  \ __DIR__ . '/footer.php'; ?>\n```\n\n如今，尽管非常不被推荐这样做，但仍有应用程序在使用这种过程化编码方式。这种架构风格的主要缺点是没有实现真正的关注点分离——与其它知名且经过验证的架构相比，维护成本和更改成本大幅增加。\n\
  \n\n架构风格\n\n9\n\n### 2.2 分层架构\n\n分层架构的核心是实现关注点分离。为了实现这一点，我们将代码划分为不同的层。在我们的示例中，这涉及到应用层、领域层和基础设施层。每一层都有明确的职责：\n\
  \n- **应用层**：负责处理用户请求并协调领域逻辑。\n- **领域层**：包含核心业务逻辑和规则。\n- **基础设施层**：处理底层技术实现，如数据库访问或文件系统。\n\
  \n通过这种分层，代码变得更于维护和测试，因为每一层的更改通常只会影响到该层本身与其依赖层。\n\n### 2.2.1 MVC（模型-视图-控制器）\n\nMVC\
  \ 是一种经典的架构模式，它将应用程序分为三个部分：\n\n- **模型（Model）**：负责数据和逻辑。\n- **视图（View）**：负责用户界面。\n\
  - **控制器（Controller）**：处理输入并协调模型与视图之间的交互。\n\n虽然 MVC 被广泛使用，但如果不正确设计，控制器往往会变得臃肿，产生所谓的“胖控制器”。\n\
  \n\n架构风格\n\n10\n\n\n\n\n每当 `Model` 更新时，在 UI 中进行表示。通常情况下，`View` 层接收一个对象，通常是一个 `Data\
  \ Transfer Object (DTO)` 而不是 `Model` 层的实例，它收集了为了成功表示所需的所有信息。对于 PHP 来说，有几个模板引擎可以极大地帮助将\
  \ `Model` 的表示与 `Model` 本身以及 `Controller` 离离开。目前最受欢迎的引擎是 [Twig](http://twig.sensiolabs.org/)。让我们看看如果使用\
  \ Twig **使用 DTO 代替 Model 实例**，View 层会变成什么样？\n\n这是一个老旧且活跃的话题。为什么要创建一个 DTO 而不是直接给\
  \ View 层提供 `Model` 实例？主要原因和简短的答案是，同样是，*关注点分离*。让视图检查并使用 `Model` 实例会导致 `View` 层与 `Model`\
  \ 层之间紧密耦合。事实上，`Model` 层的更改可能会破坏所有使用了已更改的 `Model` 实例的视图。\n\n```twig\n{% extends \"\
  base.html.twig\" %}\n{% block content %}\n{% if errormsg is defined %}\n<div class=\"\
  alert error\">{{ errormsg }}</div>\n{% else %}\n<div class=\"alert success\">Bravo!\
  \ Post was created successfully!</div>\n{% endif %}\n<table>\n<thead><tr><th>ID</th><th>TITLE</th><th>ACTIONS</th></tr></head>\n\
  <<tbody>\n{% for post in posts %}\n<tr\n<td>{{ post.id }}</td>\n<td>{{ post.title\
  \ }}<?php echo $post['TITLE']; ?></td></td>\n<td><a href=\"{{ editPostUrl(post.id)\
  \ }}\">Edit Post</a></a></td>\n</tr>\n{% endfor %}\n</tbody>\n</table>\n{% endblock\
  \ %}\n```\n\n大多数时候，当 `Model` 触发状态更改时，它也会通知相关的 `Views` 以便 UI 可以刷新。在典型的 Web 场景中，由于客户端-服务器的性质，`Model`\
  \ 及其表示之间的同步可能有点复杂。在此类环境中，通常需要一些 JavaScript 定义的交互来维持这种同步。出于这个原因，JavaScript MVC 框架如下面的框架在近年来变得非常流行：\n\
  \n* [AngularJS](https://angularjs.org/)\n* [EmberJS](http://emberjs.com/)\n* [Marionette](http://marionettejs.com/)\n\
  * [ReactJS](https://facebook.github.io/react/)\n\n## 2.2.2.3 Controller\n\nController\
  \ 层负责组织和协调 `View` 和 `Model`。它接收来自 `View` 层的消息并触发 `Model` 行为以执行所需的操作。此外，它向 `View`\
  \ 发送消息以显示 `Model` 的表示。这两个操作都归功于 `Application Layer`，该层负责协调、组织和封装领域行为。\n\n对于 PHP\
  \ 的 Web 应用而言，`Controller` 通常包含一组类，它们为了实现其目的会“说 HTTP”。也就是说，它们接收一个 HTTP 请求并返回一个 HTTP\
  \ 响应。\n\n```php\nclass PostsController\n{\n    public function updateAction(Request\
  \ $request)\n    {\n        if ($request->request->has('submit')\n        && Validator::validate($request->request->post)\n\
  \        ) {\n            $postService = new PostService();\n            try {\n\
  \                $postService->createPost(\n                    $request->request->get('title'),\n\
  \                    $request->request->get('content')\n                );\n   \
  \             $this->addFlash(\n                    'notice',\n                \
  \    'Post has been created successfully!'\n                );\n            } catch\
  \ (Exception $e) {\n                $this->addFlash(\n                    'error',\n\
  \                    'Unable to create the post!'\n                );\n        \
  \    }\n        }\n        return $this->render('posts/update-result.html.twig');\n\
  \    }\n}\n```\n\n## 2.3 依赖倒置。六边形架构\n\n遵循分层架构的核心规则，存在实现某些需要在领域模型层中使用基础设施关注点的接口的风险。\n\
  \n例如，如果我们遵循 MVC，上一个示例中的 `PDORepository` 应该被放在 `Domain Model` 中。然而，将基础设施细节直接放在我们的领域中间违反了关注点分离。这可能会导致问题，很难避免违反分层架构的核心规则，如果\
  \ `Domain Layer` 感知技术实现，将导致代码风格可能变得难以测试。\n\n### 2.3.1 依赖倒置原则 (DIP)\n\n我们如何修复这个问题？由于\
  \ `Domain Model layer` 依赖于具体的基础设施实现，可以通过将 `Infrastructure layer` 移动到其他三层之上来应用[依赖倒置原则](http://www.objectmentor.com/resources/articles/dip.pdf)。\n\
  \n**依赖倒置原则**\n\n高层模块不应该依赖低层模块。两者都应该依赖抽象。\n抽象不应该依赖细节。细节应该依赖于抽象。\nRobert C. Martin\n\
  \n通过使用 `依赖倒置原则`，架构方案发生了变化，可以被称为*低层模块*的 `Infrastructure layer` 现在依赖于 `UI`、`Application\
  \ Layer` 和 `Domain Layer`，这些是*高层模块*。依赖被反转了。但那么，六边形架构是什么？它是如何融入其中的？六边形架构（也称为端口和适配器）由\
  \ Alistair Cockburn 定义，它将应用程序表示为一个六边形，每个边代表一个端口（Port），并带有一个或多个适配器（Adapter）。端口是一个带有可插拔适配器的连接器，它将外部输入转换为**内部**可以理解的内容。\n\
  \n### 2.3.2 应用六边形架构\n\n继续之前的博客示例，我们需要的第一个概念是让*外部*世界可以与应用程序通信的端口。在这种情况下，我们将使用一个 HTTP\
  \ 端口及其相应的适配器。外部将使用端口向应用程序发送消息。示例使用数据库来存储整个博客集合，因此，为了让应用程序从数据库检索博客，需要一个端口。\n\n```php\n\
  interface PostRepository\n{\n    public function byId(PostId $id);\n    public function\
  \ add(Post $post);\n}\n```\n\n该接口定义了应用程序检索博客博客信息的端口，*并且它将位于领域层*。现在，需要一个该端口的适配器。适配器负责定义使用特定技术检索博客的方式。\n\
  \n```php\nclass PDOPostRepository implements PostRepository\n{\n    private $pdo;\n\
  \n    public function __construct(PDO $pdo)\n    {\n        $this->pdo = $pdo;\n\
  \    }\n}\n```\n\n\n\n\n```php\npublic function byId(PostId $id)\n{\n    $stm =\
  \ $this->db->prepare(\n        'SELECT \\* FROM posts WHERE id = ?'\n    );\n  \
  \  $stm->execute([$id->id()]);\n    return recreateFrom($stm->fetch());\n}\n\npublic\
  \ function add(Post $post)\n{\n    $stm = $db->prepare(\n        'INSERT INTO posts\
  \ (title, content) VALUES (?, ?)'\n    );\n    $stm->exec([\n        $post->getTitle(),\n\
  \        $post->getContent(),\n    ]);\n}\n```\n\n一旦定义了端口（Port）及其对应的适配器（Adapter），最后一步就是重构\
  \ `PostService` 类以便使用它们。这可以通过[依赖注入](http://www.martinfowler.com/articles/injection.html)⁸\
  \ 轻松实现。\n\n⁸⁸[`www.martinfowler.com/articles/injection.html`](http://www.martinfowler.com/articles/injection.html)\n\
  \n# 架构风格\n\n18\n\n```php\nclass PostService\n{\n    private $postRepository;\n\n\
  \    public function __construct(PostRepository $postRepository)\n    {\n      \
  \  $this->postRepository = $postRepository;\n    }\n\n    public function createPost($title,\
  \ $content)\n    {\n        $post = Post::writeNewFrom($title, $content);\n    \
  \    $this->postRepository->add($post);\n        return $post;\n    }\n}\n```\n\n\
  这六边形架构（Hexagonal Architecture）的一个简单示例。它是一种灵活的架构，像分层架构一样促进关注点分离，并且具有对称性——内部应用程序通过端口与外部进行通信。从现在起，这将作为构建和解释\
  \ `CQRS` 和`事件溯源（Event Sourcing）`的基础架构。\n\n为了更深入地了解这种架构，你可以查看附录](#index_split_000.html#294)，其中包含详细示例，解释了如`事务性（transactionability）`和其他`交叉关注点（cross\
  \ cutting concerns）`等高级主题。\n\n## 2.4 命令查询职责分离\n\n六边形架构是一个很好的基础架构，但它也有一些局限性。例如，复杂的\
  \ UI 可能需要以多种形式显示聚合根\n\n架构风格\n\n19\n\n```php\ninterface PostRepository\n{\n    public\
  \ function save(Post $post);\n    public function byId(PostId $id);\n    public\
  \ function all();\n    public function byCategory(CategoryId $categoryId);\n   \
  \ public function byTag(TagId $tagId);\n    public function withComments(PostId\
  \ $id);\n    public function groupedByMonth();\n    // ... ...\n}\n```\n\n当这些技术被滥用时，UI\
  \ 视图的构建可能会变得非常痛苦，我们应该权衡是让应用程序服务返回领域模型实例，还是使用某种数据传输对象（DTO），以避免领域模型与 Web 控制器、CLI 控制器等基础设施代码之间的紧耦合。\n\
  \n幸运的是，还有另一种方法。如果问题是存在多个异的视图，我们可以将它们从领域模型中排除，并开始将它们视为纯粹的基础设施关注点。这种选项基于 Bertrand\
  \ Meyer 定义的名为命令查询分离（CQS）的的设计原则，该原则诞生了由 Greg Young 定义的名为命令查询职责分离（CQRS）的新型架构模式。\n\n\
  ### 命令查询分离 (CQS)\n\n*“提问不应该改变答案” —— Bertrand Meyer*\n\n该设计原则规定每个方法要么是一个执行操作的命令（Command），要么是一个向调用者返回数据的查询（Query），不能两者兼顾。\n\
  \n`CQRS` 追求更激进的关注点分离，将模型分为二：\n\n- **写模型（Write Model）**：也称为**命令模型（Command Model）**，它执行写入并负责真实的领域行为。\n\
  - **读模型（Read Model）**：负责应用程序内部的读取，并将其视为应该属于领域模型之外的内容。\n\n每当有人触发写入模型的命令时，它会执行对目标数据存储的写入，并额外触发读模型更新，以便在读模型上显示最新的更改。\n\
  \n这种严格的分离引发了另一个问题：**最终一致性（Eventual Consistency）**。读模型的这种性现在取决于写入模型执行的命令。也就是说，可以说*读模型是最终一致的*。这意味着每当写入模型执行命令时，它都会启动一个进程，根据写入模型的最新更新来更新读模型。存在这样一个时间窗口，UI\
  \ 可能会向用户展示过期信息。在 Web 场景中这种情况经常发生，因为我们某种程度上受到当前技术的限制。\n\n想想 Web 应用前的缓存系统。每当数据库更新新信息时，缓存层的数据都可能是过时的，因此`缓存系统是最终一致的`。\n\
  \n架构风格\n\n20\n\n`写模型投影（Write Model projections）`或`投影（Projections）`。这将在书后部分解释，领域事件。写模型投影的基础是收集所有已发布的事件。\n\
  \n### 2.4.1 写模型\n\n这是领域行为的真实持有者。延续示例，`Repository` 接口将简化为：\n\n```php\ninterface PostRepository\n\
  {\n    public function save(Post $post);\n    public function byId(PostId $id);\n\
  }\n```\n\n现在 PostRepository 已从所有的读取关注点中释放，除了 `byId`，它负责加载聚合根以便我们对其进行操作。一旦完成，所有查询方法从\
  \ Post 模型中剥离，只留下命令方法。这意味着有效地去掉了所有的 getter 方法以及任何暴露信息的方法。相反，`领域事件`将被发布，以便通过订阅来触发写模型投影。\n\
  \n架构风格\n\n21\n\n```php\nclass AggregateRoot\n{\n    private $recordedEvents = [];\n\
  \n    protected function recordApplyPublishThat(DomainEvent $domainEvent)\n    {\n\
  \        $this->recordThat($domainEvent);\n        $this->applyThat($domainEvent);\n\
  \        $this->publishThat($domainEvent);\n    }\n\n    protected function recordThat(DomainEvent\
  \ $domainEvent)\n    {\n        $this->recordedEvents[] = $domainEvent;\n    }\n\
  \n    protected function applyThat(DomainEvent $domainEvent)\n    {\n        $modifier\
  \ = 'apply' . get_class($domainEvent);\n        $this->$modifier($domainEvent);\n\
  \    }\n\n    protected function publishThat(DomainEvent $domainEvent)\n    {\n\
  \        DomainEventPublisher::getInstance()->publish($domainEvent);\n    }\n\n\
  \    public function recordedEvents()\n    {\n        return $this->recordedEvents;\n\
  \    }\n\n    public function clearEvents()\n    {\n        $this->recordedEvents\
  \ = [];\n    }\n}\n```\n\n架构风格\n\n22\n\n```php\nclass Post extends AggregateRoot\n\
  {\n    private $id;\n    private $title;\n    private $content;\n    private $published\
  \ = false;\n    private $categories;\n\n    private function __construct(PostId\
  \ $id)\n    {\n        $this->id = $id;\n        $this->categories = new Collection();\n\
  \    }\n}\n```\n\n\n\n\n\n```php\npublic static function writeNewFrom($title, $content)\n\
  {\n    $post = new Post(PostId::create());\n    $post->recordApplyAndPublishThat(\n\
  \        new PostWasCreated(PostId::generate(), $title, $content)\n    );\n}\n\n\
  public function publish()\n{\n    $this->recordApplyAndPublishThat(\n        new\
  \ PostWasPublished($this->id)\n    );\n}\n\npublic function categorizeIn(CategoryId\
  \ $categoryId)\n{\n    $this->recordApplyAndPublishThat(\n        new PostWasCategorized($this->id,\
  \ $categoryId)\n    );\n}\n\npublic function changeContentFor($newContent)\n{\n\
  \    $this->recordApplyAndPublishThat(\n        new PostContentWasChanged($this->id,\
  \ $newContent)\n    );\n}\n\npublic function changeTitleFor($newTitle)\n{\n    $this->recordApplyAndPublishThat(\n\
  \        new PostTitleWasChanged($this->id, $newTitle)\n    );\n}\n```\n\n# 架构风格\n\
  \n所有触发状态变更的操作都通过*领域事件*（domain events）来实现。对于每个发布的*领域事件*，都有一个*应用*（apply）方法负责反映状态的变化。\n\
  \n```php\nclass Post extends AggregateRoot\n{\n    // ...\n    protected function\
  \ applyPostWasCreated(PostWasCreated $event)\n    {\n        $this->id = $event->id();\n\
  \        $this->title = $event->title();\n        $this->content = $event->content();\n\
  \    }\n\n    protected function applyPostWasPublished(PostWasPublished $event)\n\
  \    {\n        $this->published = true;\n    }\n\n    protected function applyPostWasCategorized(PostWasCategorized\
  \ $event)\n    {\n        $this->categories->add($event->categoryId());\n    }\n\
  \n    protected function applyPostContentWasChanged(PostContentWasChanged $event)\n\
  \    {\n        $this->content = $event->content();\n    }\n\n    protected function\
  \ applyPostTitleWasChanged(PostTitleWasChanged $event)\n    {\n        $this->title\
  \ = $event->title();\n    }\n}\n```\n\n## 2.4.2 读取模型\n\n*读取模型*（read model），也称为*查询模型*（Query\
  \ Model），是从领域关注点中提取的纯反规范化数据模型。事实上，在 CQRS 中，所有的*读取关注点*都被视为报告过程，这是一种基础设施层面的关注点。通常情况下，在使用\
  \ CQRS 时，*读取模型*取决于 UI 的需求以及组成 UI 的视图的复杂程度。\n\n在*读取模型*基于关系型数据库定义的情况下，简单的方法是在数据库表和\
  \ UI 视图之间建立一对一的关系。这些数据库表 / UI 视图将通过由*写侧*（write side）发布的*领域*事件*触发的*写模型投影*（write model\
  \ projections）进行更新。\n\n-- 单个文章及其评论的 UI 视图定义\n```sql\nCREATE TABLE single_post_with_comments\
  \ (\n    id INTEGER NOT NULL,\n    post_id INTEGER NOT NULL,\n    post_title VARCHAR(100)\
  \ NOT NULL,\n    post_content TEXT NOT NULL,\n    post_created_at DATETIME NOT NULL,\n\
  \    post_content TEXT NOT NULL\n);\n```\n\n-- 设置一些数据\n```sql\nINSERT INTO single_post_with_comments(1,\
  \ 1, \"Layered architecture\", \"Lorem ipsum dolor sit amet, ...\", NOW(), \"Lorem\
  \ ipsum dolor sit amet, ...\");\nINSERT INTO single_post_with_comments(2, 1, \"\
  Layered architecture\", \"Lorem ipsum dolor sit amet, ...\", NOW(), \"Lorem ipsum\
  \ dolor sit amet, ...\");\nINSERT INTO single_post_with_comments(3, 2, \"Hexagonal\
  \ architecture\", \"Lorem ipsum dolor sit amet, ...\", NOW(), \"Lorem ipsum dolor\
  \ sit amet, ... ...\");\nINSERT INTO single_post_with_comments(4, 2, \"Hexagonal\
  \ architecture\", \"Lorem ipsum dolor sit amet, ...\", NOW(), \"Lorem ipsum dolor\
  \ sit amet, ... ...\");\nINSERT INTO single_post_with_comments(5, 3, \"Command -\
  \ Query Responsability Segregation\", \"Lorem ipsum dolor sit amet, ...\", NOW(),\
  \ \"Lorem ipsum dolor sit amet, ...\");\nINSERT INTO single_post_with_comments(6,\
  \ 3, \"Command - Query Responsability Segregation\", \"Lorem ipsum dolor sit amet,\
  \ ...\", NOW(), \"Lorem ipsum dolor sit amet, ...\");\n```\n\n-- 查询它\n```sql\nSELECT\
  \ * FROM single_post_with_comments WHERE post_id = 1;\n```\n\n这种架构风格的一个重要特征是，*读取模型*应该是完全可弃的，因为应用程序的*真实状态*是由*写模型*处理的。这意味着在需要时，可以使用*写模型投影*删除并重新创建*读取模型*。\n\
  \n在这里我们可以看到博客应用程序中可能的视图示例：\n```sql\nSELECT * FROM posts_grouped_by_month_and_year\
  \ ORDER BY month DESC, year ASC;\nSELECT * FROM posts_by_tags WHERE tag = \"ddd\"\
  ;\nSELECT * FROM posts_by_author WHERE author_id = 1;\n```\n\n需要指出的是，*CQRS* 并不将*读取模型*的定义和实现限制在关系型数据库上。它完全取决于所构建的应用的需求。它可以是关系型数据库、文档型数据库、键值存储或任何最适合你应用程序需求的存储。\n\
  \n在博客文章应用之后，我们将使用 [Elasticsearch](https://en.wikipedia.org/wiki/Elasticsearch)（一种文档型数据库）来实现*读取模型*。\n\
  \n```php\nclass PostsController\n{\n    public function listAction()\n    {\n  \
  \      $client = new \\Elasticsearch\\ClientBuilder::create()->build();\n      \
  \  $response = $client->search([\n            'index' => 'blog-engine',\n      \
  \      'type' => 'posts',\n            'body' => [\n                'sort' => [\n\
  \                    'created_at' => 'desc']\n                ]\n            ]\n\
  \        ]);\n        return [\n            'posts' => $response\n        ];\n \
  \   }\n}\n```\n\n*读取模型*代码被极大简化为对 Elasticsearch 的查询。这揭示了*读取模型*并不一定需要对象映射器，这样做可能过度设计。然而，*写模型*可能受益于对象映射器的使用，以便根据应用的需求来组织和结构。\n\
  \n## 2.4.3 写模型与读取模型的同步\n\n这里是棘手的部分。我们如何同步*写模型*和*读取模型*？我们已经说过，通过在*写模型*事务中使用*领域事件*来实现。对于捕获的每个事件类型，都会执行特定的投影。因此，事件与投影之间将建立一对一的关系。\n\
  \n让我们来看一个配置投影的示例，以便理解：\n```php\n$client = new \\Elasticsearch\\ClientBuilder::create()->build();\n\
  $projector = new Projector();\n$projector->register([\n    new Infrastructure\\\
  Projection\\Elasticsearch\\PostWasCreated($client),\n    new Infrastructure\\Projection\\\
  Elasticsearch\\PostWasPublished($client),\n    new Infrastructure\\Projection\\\
  Elasticsearch\\PostWasCategorized($client),\n    new Infrastructure\\Projection\\\
  Elasticsearch\\PostContentWasChanged($client),\n    new Infrastructure\\Projection\\\
  Elasticsearch\\PostTitleWasChanged($client),\n]);\n\n$events = [\n    new PostWasCreated(/*...*/),\n\
  \    new PostWasPublished(/*...*/),\n    new PostWasCategorized(/*...*/),\n    new\
  \ PostContentWasChanged(/*...*/),\n    new PostTitleWasChanged(/*...*/),\n];\n\n\
  $projector->project($event);\n```\n\n这段代码是同步的，但根据需要可以是异步的。你可以通过放置一些警报让客户意识到这些数据不同步。\n\
  \n在下一个示例中，我们将使用 ampq-lib PHP 扩展结合 [ReactPHP¹⁰](http://github.com/GeniusesOfSymfony/ReactAMQP)。\n\
  \n```php\n// 连接到 AMQP 代理\n$cnn = new AMQPConnection();\n$cnn->connect();\n\n// 创建一个通道\n\
  $ch = new AMQPChannel($cnn);\n\n// 声明交换交换\n$ex = new AMQPExchange($ch);\n$ex->setName('events');\n\
  $ex->declare();\n\n// 创建事件循环\n```\n\n\n\n\n\n```php\n$loop = React\\EventLoop\\\
  Factory::create();\n\n// 创建一个每半秒发送任何等待消息的生产者\n\n$producer = new Gos\\Component\\\
  ReactAMQP\\Producer($ex, $loop, 0.5);\n\n$serializer = JMS\\Serializer\\SerializerBuilder::create()->build();\n\
  \n$projector = new AsyncProjector($producer, $serializer);\n\n$events = [\n    new\
  \ PostWasCreated( /* ... */),\n    new PostWasPublished( /* ... */),\n    new PostWasCategorized(\
  \ /* ... */),\n    new PostContentWasChanged( /* ... */),\n    new PostTitleWasChanged(\
  \ /* ... */),\n];\n\n$projector->project($event);\n```\n\n而 RabbitMQ 交换上的事件消费者将如下所示\n\
  \n# 架构样式\n\n28\n\n```php\n// 连接到 AMQP 代理\n$cnn = new AMQPConnection();\n$cnn->connect();\n\
  \n// 创建一个通道\n$ch = new AMQPChannel($cnn);\n\n// 创建一个新的队列\n$queue = new AMQPQueue($ch);\n\
  $queue->setName('events');\n$queue->declare();\n\n// 创建一个事件循环\n$loop = React\\EventLoop\\\
  Factory::create();\n$serializer = JMS\\Serializer\\SerializerBuilder::create()->build();\n\
  $client = new \\Elasticsearch\\ClientBuilder::create()->build();\n$projector = new\
  \ Projector();\n$projector->register([\n    new Infrastructure\\Projection\\Elasticsearch\\\
  PostWasCreated($client),\n    new Infrastructure\\Projection\\Elasticsearch\\PostWasPublished($client),\n\
  \    new Infrastructure\\Projection\\Elasticsearch\\PostWasCategorized($client),\n\
  \    new Infrastructure\\Projection\\Elasticsearch\\PostContentWasChanged($client),\n\
  \    new Infrastructure\\Projection\\Elasticsearch\\PostTitleWasChanged($client),\n\
  ]);\n\n// 创建一个消费者\n$consumer = new Gos\\Component\\ReactAMQP\\Consumer($queue, $loop,\
  \ 0.5, 10);\n\n// 每半秒检查一次消息，一次最多最多 10 条。\n$consumer->on(\n    'consume',\n    function($envelope,\
  \ $queue) use ($projector, $serializer) {\n        $event = $serializer->unserialize($envelope->getBody(),\
  \ 'json');\n        $projector->project($event);\n    }\n);\n$loop->run();\n```\n\
  \n从现在起，只需让所有需要的仓库消费一个\n\n# 架构样式\n\n29\n\nproject 器 实例并让它们调用投影过程即可。\n\n```php\nclass\
  \ DoctrinePostRepository implements PostRepository\n{\n    private $em;\n    private\
  \ $projector;\n\n    public function __construct(EntityManager $em, Projector $projector)\n\
  \    {\n        $this->em = $em;\n        $this->projector = $projector;\n    }\n\
  \n    public function save(Post $post)\n    {\n        $this->em->transactional(function(EntityManager\
  \ $em) use ($post) {\n            $em->persist($post);\n            foreach ($post->recordedEvents()\
  \ as $event) {\n                $em->persist($event);\n            }\n        });\n\
  \        $this->projector->project($post->recordedEvents());\n    }\n\n    public\
  \ function byId(PostId $id)\n    {\n        return $this->em->find($id);\n    }\n\
  }\n```\n\nPost 实例和记录的事件在同一个事务中触发并持久化。\n\n这确保了事件不会丢失，因为如果事务成功，我们将它们投影到`read model`。因此，`write\
  \ model`和`read model`之间不存在不一致性。\n\n![](img/index-48_1.png)\n\n# 2.5 事件溯源 (Event\
  \ Sourcing)\n\n30\n\n`CQRS` 是一种强大且灵活的架构。在收集和保存`domain events`（在聚合操作期间发生的事件）方面，它还有一个额外的好处，让你对领域内部发生的情况具有高层面的详细了解。由于`Domain\
  \ Events` 在领域内的重要性，它们是关键战术模式之一，因为它们描述了过去发生的事件。\n\n事件数量的不断增长预示着业务忽略了对领域的深度洞察。通过使用\
  \ `CQRS`，我们获得了一个极其复杂的关于所有相关事件的历史，其程度仅可以通过重现`domain events` 来表达整个领域模型的状态。我们只需要一个工具以一致的方式存储所有这些事件。这种存储被称为\
  \ `eventstore`（事件存储）。\n\n## 事件溯源的核心思想是将聚合（Aggregates）的状态表达为事件的线性序列\n\n通过 `CQRS`，我们部分实现了以下目标——Post\
  \ 实体通过使用`domain events`改变其状态，但它始终被持久化，将对象映射到数据库表。`Event Sourcing` 将此又了一层。如果我们使用数据库表来存储所有博客文章的状态，用另一个表来存储所有博客评论的状态等等，那么通过使用\
  \ `Event Sourcing`，我们只需要一个数据库表。一个单一的只追加（append-only）数据库表，将存储领域模型内所有聚合发布的所有 `domain\
  \ events`。是的，你读得正确，**单个**数据库表。\n\n考虑到这种模型，不再需要 `object-relational mappers`（对象关系映射）等工具了。对于单个数据库表来说，它们太自杀了。`eventstore`\
  \ 是存储所有这些事件所需的简单数据库表。\n\n```php\ninterface EventSAggregateRoot\n{\n    public static\
  \ function reconstitute(EventStream $events);\n}\n\nclass Post extends AggregateRoot\
  \ implements EventSAggregateRoot\n{\n    public static function reconstitute(EventStream\
  \ $events)\n    {\n        $post = new static($events->getAggregateId());\n    \
  \    foreach ($events as $event) {\n            $post->apply($event);\n        }\n\
  \        return $post;\n    }\n}\n```\n\n架构样式 31\n\n现在，聚合根有一个方法，给定一组 `events`（换句话说就是流），它能够逐步重放直到达到保存前的状态。\n\
  \n```php\nclass EventStorePostRepository implements PostRepository\n{\n    private\
  \ $eventStore;\n    private $projector;\n\n    public function __construct($eventStore,\
  \ $projector)\n    {\n        $this->eventStore = $eventStore;\n        $this->projector\
  \ = $projector;\n    }\n\n    public function save(Post $post)\n    {\n        $events\
  \ = $post->recordedEvents();\n        $this->eventStore->append(new EventStream($post->id(),\
  \ $events));\n        $post->clearEvents();\n        $this->projector->project($events);\n\
  \    }\n}\n```\n\n这就是 `PostRepository` 的实现方式，我们使用 `eventstore` 保存由聚合发布的所有事件。现在我们需要一种从事件历史恢复聚合的方法。由聚合根实现的\
  \ `reconstitute` 方法非常有用。\n\n架构样式 32\n\n```php\nclass EventStorePostRepository implements\
  \ PostRepository\n{\n    public function byId(PostId $id)\n    {\n        return\
  \ Post::reconstitute(\n            $this->eventStore->getEventsFor($id)\n      \
  \  );\n    }\n}\n```\n\n`eventstore` 是负责保存和恢复 `eventstreams` 所有职责的主力军。它的公共 API 由两个简单的方法组成：`append`\
  \ 和 `getEvents`。前者将 `eventstream` 追加到 `eventstore`，后者加载 `eventstreams` 以允许重建聚合。\n\
  \n我们可以使用键值实现来存储所有事件\n\n```php\nclass EventStore\n{\n    private $redis;\n    private\
  \ $serializer;\n\n    public function __construct($redis, $serializer)\n    {\n\
  \        $this->redis = $redis;\n        $this->serializer = $serializer;\n    }\n\
  \n    public function append(EventStream $eventstream)\n    {\n        foreach ($eventstream\
  \ as $event) {\n            $data = $this->serializer->serialize(\n            \
  \    $event,\n                'json'\n            );\n            $date = (new DateTimeImmutable())->format('YmdHis');\n\
  \            $this->redis->rpush(\n                'events:' . $event->getAggregateId(),\n\
  \                $this->serializer->serialize([\n                    'type' => get_class($event),\n\
  \                    'created_on' => $date,\n                    'data' => $data\n\
  \                ], 'json')\n            );\n        }\n    }\n\n    public function\
  \ getEventsFor($id)\n    {\n}\n```\n\n架构样式 33\n\n\n\n\n\n```php\n$serializedEvents\
  \ = $this->redis->lrange(\n    'events:' . $id,\n    0,\n    -1\n);\n\n$eventStream\
  \ = [];\n\nforeach ($serializedEvents as $serializedEvent) {\n    $eventData = $this->serializer->deserialize(\n\
  \        $serializedEvent,\n        'array',\n        'json'\n    );\n    $eventStream[]\
  \ = $this->serializer->deserialize(\n        $eventData['data'],\n        $eventData['type'],\n\
  \        'json'\n    );\n}\n\nreturn new EventStream($id, $eventStream);\n}\n}\n\
  ```\n\n这种 `eventstore` 实现是基于 [Redis](http://redis.io)¹¹ 构建的，它是一种广泛使用的键值存储器。事件使用前缀\
  \ `“events:` 被追加到列表中。此外，在持久化事件之前，我们会提取一些元数据，例如事件类或创建日期，因为它们在稍后会很有用。\n\n显然，从性能角度来看，让聚合（aggregate）每次都遍历其完整的事件历史来达到最终状态是非常昂贵的的。当一个事件流包含数百甚至数千个事件时，情况尤为如此。克服这种情况的最佳方法是从聚合中获取快照，并仅重放自快照拍摄以来事件流中的事件。快照\
  \ ¹¹[`redis.io`](http://redis.io) 只是在给定时刻聚合状态的简单序列化版本。它可以基于聚合事件流的事件数量，也可以基于时间。对于第一种方法，每触发\
  \ `n triggered events` 就会拍摄一次快照（例如每 50、100 或 200 次）。对于第二种方法，每 `n seconds` 拍摄一次快照。\n\
  \n为了遵循示例，我们将使用第一种快照方法。在事件元数据中，我们存储了一个额外的字段 `version`，我们将从这里开始重放聚合历史。\n\n```php\n\
  class SnapshotRepository\n{\n    public function byId($id)\n    {\n        $key\
  \ = 'snapshots:' . $id;\n        $metadata = $this->serializer->unserialize(\n \
  \           $this->redis->get($key)\n        );\n        if (null === $metadata)\
  \ {\n            return;\n        }\n        return new Snapshot(\n            $metadata['version'],\n\
  \            $this->serializer->unserialize(\n                $metadata['snapshot']['data'],\n\
  \                $metadata['snapshot']['type'],\n                'json'\n      \
  \      )\n        );\n    }\n\n    public function save($id, Snapshot $snapshot)\n\
  \    {\n        $key = 'snapshots:' . $id;\n        $aggregate = $snapshot->aggregate();\n\
  \        $snapshot = [\n            'version' => $snapshot->version(),\n       \
  \     'snapshot' => [\n                'type' => get_class($aggregate),\n      \
  \          'data' => $this->serializer->serialize(\n                    $aggregate,\n\
  \                    'json'\n                )\n            ]\n        ];\n    \
  \    $this->redis->set($key, $snapshot);\n    }\n}\n```\n\n现在我们需要重构 `EventStore`\
  \ 类，使其开始使用 `SnapshotRepository` 来加载聚合，以获得可接受的性能。\n\n```php\nclass EventStorePostRepository\
  \ implements PostRepository\n{\n    public function byId(PostId $id)\n    {\n  \
  \      $snapshot = $this->snapshotRepository->byId($id);\n        if (null === $snapshot)\
  \ {\n            return Post::reconstitute(\n                $this->eventStore->getEventsFrom($id)\n\
  \            );\n        }\n        $post = $snapshot->aggregate();\n        $post->replay(\n\
  \            $this->eventStore->fromVersion($id, $snapshot->version())\n       \
  \ );\n        return $post;\n    }\n}\n```\n\n我们只需要定期对聚合进行快照。我们可以同步地这样做，也可以通过负责监控\
  \ `eventstore` 的进程异步地这样做。以下代码是演示聚合快照实现的简单示例。\n\n```php\nclass EventStorePostRepository\
  \ implements PostRepository\n{\n    public function save(Post $post)\n    {\n  \
  \      $id = $post->id();\n        $events = $post->recordedEvents();\n        $post->clearEvents();\n\
  \        $this->eventStore->append(\n            new EventStream($id, $events)\n\
  \        );\n        $countOfEvents = $this->eventStore->countEventsFor(\n     \
  \       $id\n        );\n        $version = $countOfEvents / 100;\n        if (!$this->snapshotRepository->has($post->id(),\
  \ $version)) {\n            $this->snapshotRepository->save(\n                $id,\n\
  \                new Snapshot(\n                    $post,\n                   \
  \ $version\n                )\n            );\n        }\n        $this->projector->project($events);\n\
  \    }\n}\n```\n\n### 2.6 总结\n\n由于本章中有许多架构风格的选择，你可能会有些困惑。你必须考虑每种风格的权衡以便做出明智的选择。有一点是很明确的：泥球（`Big\
  \ Ball of Mud`）方法不是一个选项，因为代码会迅速腐烂。分层架构（`Layered architecture`）是一个更好的选择，但它存在一些缺点，如层与层之间的耦合。可以说，最平衡的选项可能是六形架构（`Hexagonal\
  \ Architecture`），因为它可以作为基础架构使用。它促进了应用“内部”和“外部”之间高程度的解耦和对称。\n\n我们还看到了 `CQRS` 和事件溯源（`Event\
  \ sourcing`），它们是灵活的架构，可以帮助解决复杂问题。`CQRS` 和事件溯源有其特定的用处，但不要让它们的酷炫因素让你分心。如果查询方法的数量开始增加且变得难以维护，那么是时候考虑使用\
  \ `CQRS` 来分离读写关注点了。此外，如果聚合操作的事件数量不断增长，那么考虑转向 `Event sourcing` 是否会有所收益。\n\n## 3.\
  \ 值对象（Value Objects）\n\n值对象是领域驱动设计中的基本构建块，用于在代码中建模通用语言。值对象不仅仅是领域中的某个“实体”，它衡量、量化或描述某些事物。它们可以被视为简单的对象，例如金额或日期范围——其相等性不是基于身份，而是基于内容。例如，产品价格可以使用值对象建模。在这种情况下，它不代表一个“实体”，而是一个我们衡量价值的值。这些对象的内存占用非常容易确定（通过其组成部分计算），且开销很小。因此，创建新实例优于引用引用，即使它们表示相同的值。相等性根据两个实例的字段进行检查。\n\
  \n### 3.1 定义\n\nWard Cunningham [定义](http://c2.com/cgi/wiki?ValueObject)¹ 了值对象为对某物的衡量或描述。值对象的例子包括数字、日期、货币和字符串。通常，它们是被广泛使用的小对象。它们的身份基于状态而不是对象身份。这样，你可以拥有多个相同概念值对象的副本。每张美元钞都有自己的身份（得益于其序列号），但现金经济依赖于每张美元钞与其他所有美元钞具有相同的价值。\n\
  \nMartin Fowler [定义²](http://martinfowler.com/bliki/ValueObject.html) 了值对象为金额或日期范围对象等的小对象。它们的关键属性是遵循值语义而不是引用语义。你通常能识别出它们，因为它们的相等概念不是基于身份，相反，如果两个值对象的字段都相等，它们就相等。尽管所有字段都相等，如果某个子集是唯一的，你不需要比较所有字段——例如，货币的代码就足够测试相等性。一个通用的启发式方法是值对象应该是完全不可变的。如果你想更改一个值对象，应该用新对象替换它，而不是允许更新值对象本身的值。\n\
  \n\n\n\n\n值对象会导致别名问题。\n\n¹[`c2.com/cgi/wiki?ValueObject`](http://c2.com/cgi/wiki?ValueObject)\n\
  ²[`martinfowler.com/bliki/ValueObject.html`](http://martinfowler.com/bliki/ValueObject.html)\n\
  \n# 值对象\n\n值对象的示例包括数字、文本字符串、日期、时间、人的姓名（由名、中间名、姓和头组成）、货币、颜色、电话号码和邮寄地址。\n\n### 练习\n\
  尝试在你当前的领域中寻找更多潜在的值对象示例。\n\n### 3.2 值对象 vs 实体\n\n考虑以下来自[维基百科³](http://en.wikipedia.org/wiki/Domain-driven_design#Building_blocks_of_DDD)的示例，以更好地理解值对象（Value\
  \ Objects）与实体（Entities）之间的区别。\n\n人们交换钞票时，通常不会区分每一张独特的钞票。他们只关心钞票的面值。在这种背景下，钞票是值对象。然而，联邦储备部可能对将钞票作为唯一身份进行追踪，因此将它们视为实体。\n\
  \n另一个例子可能是，许多航空公司区分座位，将它们视为独特的位置。在这种情况下，座位可以被视为一个实体。另一方面，也有一些航空公司（如美国西南航空（或欧洲的廉捷航空/莱安航空））并不区分座位。在这种背景下，座位可以被视为一个值对象。\n\
  \n### 练习\n关于地址（街道、门牌、邮政编码等）的概念。在什么可能的语境下，地址可以被建模为实体而不是值对象？请与同事讨论你的发现。\n\n## 3.3\
  \ 货币和金额示例\n\n货币和金额值对象可能是解释值对象最常用的示例，这得益于[货币模式](http://martinfowler.com/eaaCatalog/money.html)⁴.。这种设计模式提供了一种建模该问题的解决方案，以避免浮点数舍入问题，允许执行确定性的计算。\n\
  \n在现实世界中，货币描述单位的方式就像米和码描述距离单位一样。每种货币用三个大写字母 ISO 代码表示。\n\n³[`en.wikipedia.org/wiki/Domain-driven\\\
  _design#Building\\_blocks\\_of_DDD`](http://en.wikipedia.org/wiki/Domain-driven_design#Building_blocks_of_DDD)\n\
  ⁴[`martinfowler.com/eaaCatalog/money.html`](http://martinfowler.com/eaaCatalog/money.html)\n\
  \n### class Currency\n```php\nclass Currency\n{\n    private $isoCode;\n    public\
  \ function __construct($anIsoCode)\n    {\n        $this->setIsoCode($anIsoCode);\n\
  \    }\n\n    private function setIsoCode($anIsoCode)\n    {\n        if (!preg_match('/^[A-Z]{3}$/',\
  \ $anIsoCode)) {\n            throw new \\InvalidArgumentException();\n        }\n\
  \        $this->isoCode = $anIsoCode;\n    }\n\n    public function isoCode()\n\
  \    {\n        return $this->isoCode;\n    }\n}\n```\n\n值对象的主要目标之一也是面向对象设计的终圣杯：封装。通过遵循这种抽象，你将拥有一个专门的位置，用于存放特定概念的所有验证、比较逻辑和行为。\n\
  \n金额（Money）用于衡量特定数量的货币。它是通过一个金额和一个`Currency`（货币）来建模的。在货币模式中，金额使用货币最小价值单位的整数表示法来实现——例如，在美元或欧元的情况下，即分。\n\
  \n作为一个额外点，你还会在示例中注意到我们正在使用[自封装⁵](http://martinfowler.com/bliki/SelfEncapsulation.html)来设置\
  \ ISO 代码，将更改集中在值对象本身中。\n\n⁵[`martinfowler.com/bliki/SelfEncapsulation.html`](http://martinfowler.com/bliki/SelfEncapsulation.html)\n\
  \n### class Money\n```php\nclass Money\n{\n    private $amount;\n    private $currency;\n\
  \    public function __construct($anAmount, Currency $aCurrency)\n    {\n      \
  \  $this->setAmount($anAmount);\n        $this->setCurrency($aCurrency);\n    }\n\
  \n    private function setAmount($anAmount)\n    {\n        $this->amount = (int)\
  \ $anAmount;\n    }\n\n    private function setCurrency(Currency $aCurrency)\n \
  \   {\n        $this->currency = $aCurrency;\n    }\n\n    public function amount()\n\
  \    {\n        return $this->amount;\n    }\n\n    public function currency()\n\
  \    {\n        return $this->currency;\n    }\n}\n```\n\n现在你已经了解了值对象的正式定义，让我们深入探讨它们提供的一些强大功能。\n\
  \n### 3.4 特性\n\n在代码中建模通用语言（Ubiquitous Languages）概念时，你应该始终优先选择值对象而不是实体。值对象更容易创建、测试、使用和维护。\n\
  \n考虑到这一点，如果满足以下条件，你可以决定问题概念是否可以建模为值对象：\n- 它衡量、量化或描述了某个事物\n- 它可以保持不可变性\n- 它通过组合相关属性来建模一个概念整体\n\
  - 当描述变化时，它是可替换的\n- 它为协作者提供无副作用（Side-Free）的行为\n\n### 3.4.1 衡量、量化或描述\n如前所述，值对象不应该仅仅被视为领域中的一个事物。作为一个“值”，它衡量、量化或或描述了一个概念。在我们的示例中，`Currency`\
  \ 对象描述了是什么种类型的钱。\n\n### 3.4.2 不可变性\n这是掌握值对象最重要的方面之一。对象不应在其整个生命周期内被修改。由于这种不可变性，值对象易于推理、测试，并且没有意外的副作用。因此，值对象应该通过其构造函数创建。带有多个设置器（setter）的空构造函数会将创建责任推移给客户端，导致[贫血的](http://martinfowler.com/bliki/AnemicDomainModel.html)[领域模型](http://martinfowler.com/bliki/AnemicDomainModel.html)⁶，这被认为是一种反模式。\n\
  \n同样值得指出的是，不建议在你的值对象中持有实体的引用。实体是可变的，因此这可能会导致值对象中出现不必要的副作用。\n\n在支持[方法重载](http://en.wikipedia.org/wiki/Function_overloading)⁷的语言\
  \ Java 中，你可以创建多个同名的构造函数。这些构造函数提供了不同的选项来构建相同类型的结果对象。在 PHP 中，我们能够通过[工厂方法](http://en.wikipedia.org/wiki/Factory_method_pattern)⁸提供类似的能力。在我们的\
  \ `Money` 对象中，我们可以添加一些实用的工厂方法，例如：\n\n```php\nclass Money\n{\n    // ...\n    public\
  \ static function fromMoney(Money $aMoney)\n    {\n        return new self(\n  \
  \          $aMoney->amount(),\n            $aMoney->currency()\n        );\n   \
  \ }\n\n    public static function ofCurrency(Currency $aCurrency)\n    {\n     \
  \   return new self(0, $aCurrency);\n    }\n}\n```\n\n通过使用 `self` 关键字，我们没有将代码与类名耦合。这样，对⁶[`martinfowler.com/bliki/AnemicDomainModel.html`](http://martinfowler.com/bliki/AnemicDomainModel.html)\n\
  ⁷[`en.wikipedia.org/wiki/Function\\_overloading`](http://en.wikipedia.org/wiki/Function_overloading)\n\
  ⁸[`en.wikipedia.org/wiki/Factory\\_method\\_pattern`](http://en.wikipedia.org/wiki/Factory_method_pattern)\
  \ 的更改将受到影响。\n\n\n\n\n\n`class` 名称或命名空间不会影响这些工厂方法。这个细小的实现细节有助于日后对代码进行重构。\n\n### static\
  \ vs. self\n\n当 `Value Object`（值对象）继承另一个 `Value Object` 时，使用 `static` 替代 `self`\
  \ 可能会导致意外的问题。\n\n由于这种不可变性，我们必须考虑如何处理有状态上下文中常见的可变操作。如果我们需要更改状态，现在我们必须返回一个带有该更改的全新\
  \ `Value Object` 表示。\n\n例如，如果我们想增加 `Money` 值对象的金额，我们现在必须返回一个带有所需修改的全新 `Money` 实例。幸运的是，如例所示，遵循这一规则相对简单。\n\
  \n#### class Money\n\n```php\nclass Money\n{\n    // ... ...\n    public function\
  \ increaseAmountBy($anAmount)\n    {\n        return new self(\n            $this->amount()\
  \ + $anAmount,\n            $this->currency()\n        );\n    }\n}\n```\n\n`increaseAmountBy`\
  \ 返回的对象与调用该方法的对象不同。在下方的示例比较中可以观察到这一点。\n\n```php\n$aMoney = new Money(100, new Currency('USD'));\n\
  $otherMoney = $aMoney->increaseAmountBy(100);\nvar_dump($aMoney === $otherMoney);\
  \ // bool(false)\n\n$aMoney = $aMoney->increaseAmountBy(100);\nvar_dump($aMoney\
  \ === $otherMoney); // bool(false)\n```\n\n### 3.4.3 概念性整体\n\n你可能在想，为什么不直接实现类似下面示例的代码，从而避免创建新的\
  \ `Value Object` 类呢？\n\n```php\nclass Product\n{\n    private $id;\n    private\
  \ $name;\n\n    /**\n     * @var int\n     */\n    private $amount;\n\n    /**\n\
  \     * @var string\n     */\n    private $currency;\n    // ... ...\n}\n```\n\n\
  这种方法存在一些明显的缺陷，例如你想验证 ISO 码。让 `Product` 负责货币的 ISO 验证并不真的符合逻辑（违背了单一职责原则）。如果你想在领域的其他部分复用相关的逻辑（以遵循\
  \ DRY 原则），这一点会更加凸显。考虑到这些因素，这个用例是抽象为值对象的完美候选者。使用这种抽象不仅让你有机会将相关属性组合在一起，还让你能够创建高阶概念和更具体的通用语言（Ubiquitous\
  \ Language）。\n\n#### 练习\n\n与同伴讨论电子邮箱是否可以被视为值对象。它使用的上下文重要吗？\n\n### 3.4.4 值等价性\n\n\
  正如章节开头提到的，如果两个 `Value Object` 所测量、量化或描述的内容相同，那么它们就是相等的。\n\n例如，想象两个代表 1 美元的 `Money`\
  \ 对象。我们可以认为它们是相等的吗？在“现实”世界中，两枚 1 美元的硬币价值相同吗？当然是。……问题中指的是 `Money` 的独立实例。然而，我们可以认为它们都代表相同的值，因此它们反过来相等的。\n\
  \n在 PHP 中，使用 `==` 运算符比较两个 `Value Object` 是常见的。查看 [PHP 文档](http://php.net/manual/en/language.oop5.object-comparison.php)\
  \ 对该运算符的定义可以揭示一种有趣的行为。当使用比较运算符 (`==`) 时，对象变量是以简单的方式进行比较的，即：如果两个对象实例具有相同的属性和值，并且是相同类的实例，则它们是相等的。\n\
  \n这种行为与我们对 `Value Object` 的正式定义一致。然而，由于存在精确的类匹配谓词，在处理子类型 `Value Object` 时你应该小心。考虑到这一点，遗憾的是，更严格的\
  \ `===` 运算符无法帮到我们。\n\n当使用恒等运算符 (`===`) 时，当且仅当对象变量引用同一个同类的同一个实例时，它们才是相同的。\n\n以下示例应该有助于确认这些细微的差异。\n\
  \n```php\n$a = new Currency('USD');\n$b = new Currency('USD');\nvar_dump($a == $b);\
  \ // bool(true)\nvar_dump($a === $b); // bool(false)\n\n$c = new Currency('EUR');\n\
  var_dump($a == $c); // bool(false)\nvar_dump($a === $c); // bool(false)\n```\n\n\
  考虑到此，一种解决方案是在每个 `Value Object` 中实现一个常规的 `equals` 方法。该方法的任务是检查其复合属性的类型和相等性。使用 PHP\
  \ 内置的类型提示很容易实现抽象数据类型的比较。另一方面，如有必要，你也可以使用 `get_class()` 函数辅助比较检查。然而，语言本身无法理解你的领域概念中相等性真正意味着什么，这意味着提供答案是你的责任。\n\
  \n为了比较 `Currency` 对象，我们只需要比较它们关联的 ISO 码是否相同。在这种情况下，`===` 运算符非常好。\n\n```php\nclass\
  \ Currency\n{\n    // ... ...\n    public function equals(Currency $currency)\n\
  \    {\n        return $currency->isoCode() === $this->isoCode();\n    }\n}\n```\n\
  \n由于 `Money` 对象使用了 `Currency` 对象，因此 `equals` 方法需要执行这种比较检查，并比较金额。\n\n```php\nclass\
  \ Money\n{\n    // ... ...\n    public function equals(Money $money)\n    {\n  \
  \      return\n            $money->currency()->equals($this->currency()) &&\n  \
  \          $money->amount() === $this->amount();\n    }\n}\n```\n\n### 3.4.5 可替换性\n\
  \n考虑一个包含用于量化价格的 `Money` 值对象的 `Product` 实体。再考虑两个价格相同（例如 100 美元）的 `Product` 实体。这种场景可以使用两个独立的\
  \ `Money` 对象或两个指向单个值对象的引用来建模。共享同一个值对象可能是危险的，如果其中一个被修改，两个都会反映该变化。这种行为可以被视为一种意料之外的副作用。\n\
  \n由于此示例中突出了持有值对象引用而非修改其值产生的问题，建议直接替换整个对象。\n\n```php\n$this->price = new Money(100,\
  \ new Currency('USD'));\n// ... ...\n$this->price = $this->price->increaseAmountBy(200);\n\
  ```\n\n这种行为类似于 PHP 中基本类型（如字符串）的工作方式。考虑 `strtolower` 函数，它返回一个新字符串而不是修改原始字符串。没有使用引用，而是返回了一个新值。\n\
  \n### 3.4.6 无副作用行为\n\n如果我们想在 `Money` 类中包含一些额外的行为，例如 `add` 方法，检查输入是否符合任何先置条件并维护任何不变性是是很自然的做法。在我们的案例中，我们只希望相相同货币的金额。\n\
  \n```php\nclass Money\n{\n    // ... ...\n    public function add(Money $money)\n\
  \    {\n        if ($money->currency() !== $this->currency()) {\n            throw\
  \ new \\InvalidArgumentException();\n        }\n        $this->amount += $money->amount();\n\
  \    }\n}\n```\n\n如果两种货币不匹配，则抛出异常。否则，金额会相加。然而，这段代码有一些不理想的陷阱。现在假设我们有另一个方法 `otherMethod`。\n\
  \n```php\nclass Banking\n{\n    public function aMethod()\n    {\n        $aMoney\
  \ = new Money(100, new Currency('USD'));\n        $this->otherMethod($aMoney);\n\
  \        // ... ...\n    }\n}\n```\n\n\n\n一切都正常，直到由于某种原因，我们开始在 `$aMoney` 中看到意之外的结果。如果\
  \ `otherMethod` 使用了我们之前定义的 `add` 方法会发生什么？也许你没有意识到 `add` 会改变 `Money` 实例的状态。这就是我们所说的**副作用（`side-effect`）**。你不应该修改参数，因为客户端永远不会期望这种行为。\n\
  \n那么，我们该如何修复这个问题呢？很简单，通过确保值对象（Value Object）保持不可变，我们就可以避免这种意外的问题。一个简单的解决方案是为每个潜在的可变操作（例如\
  \ `add` 方法）返回一个新实例。\n\n# Value Objects\n\n```php\nclass Money\n{\n  //...\n  public\
  \ function add(Money $money)\n  {\n    if (!$money->currency()->equals($this->currency()))\
  \ {\n      throw new \\InvalidArgumentException();\n    }\n\n    return new self(\n\
  \      $money->amount() + $this->amount(),\n      $this->currency()\n    );\n  }\n\
  }\n```\n\n通过这个简单的改动，不可变性得到了保证。每当将两个 `Money` 相加时，都会返回一个新的结果实例。其他类可以执行任意数量的更改而不会影响原始副本。没有副作用的代码易于理解、易于测试，且不易出错。\n\
  \n# Value Objects\n\n### 3.5 基础类型\n\n考虑以下代码段。\n\n```php\n$a = 10;\n$b = 10;\nvar_dump($a\
  \ == $b);\n// bool(true)\nvar_dump($a === $b);\n// bool(true)\n$a = 20;\nvar_dump($a);\n\
  // integer(20)\n$a = $a + 30;\nvar_dump($a);\n// integer(50)\n```\n\n尽管 `$a` 和 `$b`\
  \ 是不同的变量，在底层存储在不同的内存位置，但当比较时它们是相同的。它们持有相同的值。我们认为它们是相等的。你可以随时将 `$a` 的值从 10 改为 20，新值是\
  \ 20，而 10 消失了。你可以随所欲地替换整数值而不必考虑之前的值，因为你并不是在修改它，你只是在替换它。如果你对它们执行任何操作（如加法 `$a + $b`），你会得到另一个新值并赋值给另一个变量或之前定义的变量。当你将\
  \ `$a` 传递给另一个函数时，除非显式通过引用传递，否则你传递的是值。`$a` 在函数内部是否被修改无关，因为在你的当前代码中，仍然拥有原始副本。值对象的行为就像基础类型一样。\n\
  \n# Value Objects\n\n### 3.6 测试\n\n值对象的测试方式与普通对象相同。然而，必须测试不可变性和无副作用的行为。一种解决方案是在执行任何修改之前，为你正在测试的值对象创建一个副本。使用实现的等性检查断言两者是相等的。执行你想测试的操作并断言结果。最后，断言原始对象和副本仍然是相等的。让我们付诸实践，测试\
  \ `Money` 类中 `add` 方法的无副作用实现。\n\n```php\nclass MoneyTest extends \\PHPUnit_Test_TestCase\n\
  {\n    /**\n     * @test\n     */\n    public function copiedMoneyShouldRepresentSameValue()\n\
  \    {\n        $aMoney = new Money(100, new Currency('USD'));\n        $copiedMoney\
  \ = Money::fromMoney($aMoney);\n        $this->assertTrue($aMoney->equals($copiedMoney));\n\
  \    }\n\n    /**\n     * @test\n     */\n    public function originalMoneyShouldNotBeModifiedOnAddition()\n\
  \    {\n        $aMoney = new Money(100, new Currency('USD'));\n        $aMoney->add(new\
  \ Money(20, new Currency('USD')));\n        $this->assertEquals(100, $aMoney->amount());\n\
  \    }\n\n    /**\n     * @test\n     */\n    public function moneysShouldBeAdded()\n\
  \    {\n        $aMoney = new Money(100, new Currency('USD'));\n        $newMoney\
  \ = $aMoney->add(new Money(20, new Currency('USD')));\n        $this->assertEquals(120,\
  \ $newMoney->amount());\n    }\n    // ...\n}\n```\n\n# Value Objects\n\n### 3.7\
  \ 持久化值对象\n\n值对象不会独立持久化，它们通常在聚合根（Aggregate）内部被持久化。值对象不应作为完整的记录持久化，尽管在某些情况下这是一种选项。相反，最好使用**嵌入值（Embedded\
  \ Value）**或**序列化大对象（Serialize LOB）**模式。当你使用开源 ORM（如 Doctrine）或自定义 ORM 持久化对象时，这两种模式均可使用。由于值对象很小，嵌入值通常是最佳选择，因为它允许通过值对象拥有的任何属性来轻松查询实体（Entities）。然而，如果通过这些字段查询对你来说并不重要，序列化策略可以非常容易实现。\n\
  \n考虑以下 `Product` 实体，它具有字符串类型的 id、name 和 price（Money 值对象）属性。我们特意决定简化此示例，让 id 为字符串而非值对象。\n\
  \n```php\nclass Product\n{\n  private $productId;\n  private $name;\n  private $price;\n\
  \n  public function __construct(\n    $aProductId,\n    $aName,\n    Money $aPrice\n\
  \  ) {\n    $this->setProductId($aProductId);\n    $this->setName($aName);\n   \
  \ $this->setPrice($aPrice);\n  }\n  // ...\n}\n```\n\n\n\n\n在 DBAL 中，`DbalProductRepository`\
  \ 应该创建 `INSERT` 语句，绑定参数并执行它。\n\n```php\nclass DbalProductRepository extends DbalRepository\
  \ implements ProductRepository\n{\n    public function add(Product $aProduct)\n\
  \    {\n        $sql = 'INSERT INTO products VALUES (?, ?, ?, ?)';\n        $stmt\
  \ = $this->connection()->prepare($sql);\n        $stmt->bindValue(1, $aProduct->id());\n\
  \        $stmt->bindValue(2, $aProduct->name());\n        $stmt->bindValue(3, $aProduct->price()->amount());\n\
  \        $stmt->bindValue(4, $aProduct->price()->currency()->isoCode());\n     \
  \   $stmt->execute();\n        // ...\n    }\n}\n```\n\n在执行这段代码创建 Product 实体并将其持久化到数据库后，每一列都填充了所需的信息。\n\
  \n```bash\nmysql> select \\* from products \\G\n********************************\
  \ 1 row *********************************\nid: 1\nname: Domain-Driven Design in\
  \ PHP\nprice_amount: 999\nprice_currency: USD\n1 row in set (0.00 sec)\n```\n\n\
  如你所见，你可以以临时的方式映射你的值对象（Value Objects）和查询参数以持久化你的值对象。然而，一切并不看起来那么简单。让我们尝试获取持久化的 Product\
  \ 及其的 Money 值对象。一种常见的方法是执行 `SELECT` 语句并返回一个新的实体。\n\n![](img/index-74_1.png)\n\n\
  ## 值对象\n\n```php\nclass DbalProductRepository extends DbalRepository implements\
  \ ProductRepository\n{\n    public function productOfId($anId)\n    {\n        $sql\
  \ = 'SELECT \\* FROM products WHERE id = ?';\n        $stmt = $this->connection()->prepare($sql);\n\
  \        $stmt->bindValue(1, $anId);\n        $res = $stmt->execute();\n       \
  \ // ...\n        return new Product(\n            $row['id'],\n            $row['name'],\n\
  \            new Money(\n                $row['price_amount'],\n               \
  \ new Currency(\n                    $row['price_currency']\n                )\n\
  \            )\n        );\n    }\n}\n```\n\n这种方法具有一些优点。首先，你可以轻松地逐步读取持久化以及随后的创建是如何发生的。其次，你可以根据值对象的任何属性进行查询。最后，持久化实体所需的空间恰好是所需的，不多也不少。\n\
  \n然而，使用这种临时的 ORM 方法也有其缺点。正如在 领域事件 中解释的那样，如果你的领域对聚合根（Aggregates）的创建感兴趣，实体（以聚合的形式存在）应该在构造函数中触发一个事件。如果你使用\
  \ `new` 运算符，你触发事件的次数将与聚合根从数据库加载的次数相同。\n\n这就是为什么 Doctrine 内部使用 `Proxies`（代理）、`serialize`\
  \ 和 `unserialize` 方法在不使用构造函数的情况下重构一个带有其属性的对象。一个实体在其生命周期内内应该只被使用 `new` 运算符创建一次。\n\
  \n### 构造函数\n\n构造函数不需要为对象中的每个属性包含一个参数。考虑一个 Post（文章）。构造函数可能需要一个 `id` 和一个 `title`，但在内部，它也可以将状态设为草稿。在发布时，应该调用\
  \ `publish` 方法来更改其状态并设置发布日期。如果你的意图仍然是推出自己的 ORM，请准备好解决一些基础性问题，例如事件、不同的构造函数、懒加载关系等。这就是为什么我们建议在\
  \ DDD 应用中尝试 Doctrine。此外，在此实例中，你需要创建一个扩展自 Product 的 DbalProduct 实体，并能够能够使用静态工厂方法从数据库重构实体。\n\
  \n### 3.7.1.2. Doctrine >= 2.5 的嵌入式 (Embeddables)\n\n在编写本文时，Doctrine 的稳定版本目前是 2.4。Doctrine\
  \ 2.5 正在开发中，并带有了对映射值对象的支持，消除了自己执行此操作的需要。目前 Doctrine 似乎不支持嵌套嵌入。目前，请查阅 [Doctrine](https://doctrine-orm.readthedocs.org/en/latest/tutorials/embeddables.html)\
  \ 以获取更多信息。这个选项如果实现正确，绝对是我们最推荐的。这将是最简单、最优雅的解决方案，同时在你的 DQL 查询中提供搜索功能。然而，在目前这在生产环境中并不是一个选项。请放心，一旦这种情况发生变化，我们将更新书籍。\n\
  \n### 3.7.1.3 Doctrine <= 2.4 的嵌入式\n\n那么对于在 Doctrine < 2.5 中使用嵌入值什么是可以接受的解决方案呢？我们需要在\
  \ Product 实体中所有的值对象属性进行代理，这意味着创建用于存储值对象信息的人造属性。一旦完成，我们就可以使用 Doctrine 映射这些新属性。让我们看看这对\
  \ Product 实体的影响。\n\n```php\nclass Product\n{\n    protected $productId;\n    protected\
  \ $name;\n    protected $price;\n    protected $surrogateCurrencyCode;\n    protected\
  \ $surrogateAmount;\n\n    public function __construct($aProductId, $aName, Money\
  \ $aPrice)\n    {\n        $this->setProductId($aProductId);\n        $this->setName($aName);\n\
  \        $this->setPrice($aPrice);\n    }\n\n    private function setPrice(Money\
  \ $aMoney)\n    {\n        $this->price = $aMoney;\n        $this->surrogateAmount\
  \ = $aMoney->amount();\n        $this->surrogateCurrencyCode = $aMoney->currency()->isoCode();\n\
  \    }\n\n    private function price()\n    {\n        if (null === $this->price)\
  \ {\n            $this->price = new Money(\n                $this->surrogateAmount,\n\
  \                new Currency($this->surrogateCurrencyCode)\n            );\n  \
  \      }\n        return $this->price;\n    }\n    // ...\n}\n```\n\n如你所见，有两个新属性。一个用于金额，另一个用于货币\
  \ ISO 代码。我们还更新了 `setPrice` 方法以在设置时保持一致性。在此基础上，我们更新了 `price` getter 以从新字段构建 Money\
  \ 对象。让我们看看对应的 XML Doctrine 映射应该如何改变。\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<doctrine-mapping\n    xmlns=\"http://doctrine-project.org/schemas/orm-mapping\"\
  \n    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n    xsi:schemaLocation=\"\
  http://doctrine-project.org/schemas/orm-mapping https://raw.githubusercontent.com/doctrine/doctrine2/master/doctrine-mapping.xsd\"\
  >\n    <entity name=\"Product\" table=\"product\">\n        <id name=\"id\" column=\"\
  id\" type=\"string\" length=\"255\">\n            <generator strategy=\"NONE\"></generator>\n\
  \        </id>\n        <field name=\"name\" type=\"string\" length=\"255\"/>\n\
  \        <field name=\"surrogateAmount\" type=\"integer\" column=\"price_amount\"\
  />\n        <field name=\"surrogateCurrencyCode\" type=\"string\" column=\"price_currency\"\
  />\n    </entity>\n</doctrine-mapping>\n```\n\n![](img/index-77_1.png)\n\n## 代理属性\n\
  \n这两个新字段并不严格属于领域，因为它们不指向基础设施细节，但由于 Doctrine 缺乏嵌入支持，它们是必要的（原文为 an necessity）。存在其他替代方案可以将这两个属性推到纯领域之外，然而，这种方法更简单、更容易，并且作为权衡，是可以接受的。代理属性在书中还有另一个用处，你可以在代理实体标识\
  \ 时找到它。\n\n\n\n使用了[抽象工厂](http://en.wikipedia.org/wiki/Abstract_factory_pattern)¹³。首先，我们需要在\
  \ `Infrastructure` 文件夹中创建一个新的 `Entity`，即 `DoctrineProduct`，它继承自 `Product` 实体。所有的代理字段将将放在新类中，并且诸如\
  \ `price` 或 `setPrice` 等方法需要重新实现。我们将 `Doctrine` 配置为使用新的 `DoctrineProduct` 而不是 `Product`\
  \ 实体。现在，我们能够从数据库中获取 `Entities`，但是，创建一个新的 `Product` 呢？在某些时刻，我们需要调用 `new Product`，但因为我们需要处理\
  \ `DoctrineProduct`，且不希望我们的 `Application Services` 了解基础设施细节，我们需要使用 `Factories` 来创建\
  \ `Product` 实体。因此，在每个使用 `new` 创建 `Entity` 的实例中，你现在将改为调用 `ProductFactory` 上的 `createProduct`。\n\
  \n¹³[`en.wikipedia.org/wiki/Abstract\\_factory\\_pattern`](http://en.wikipedia.org/wiki/Abstract_factory_pattern)\n\
  \n## 值对象 (Value Objects)\n\n可能需要许多额外的类，以避免将代理属性放在原始 `Entity` 中。因此，我们建议将所有的 `Value\
  \ Objects` 代理到同一个 `Entity` 中，尽管这会导致方案不够纯粹。\n\n### 3.7.1.4 序列化 LOB 和即时 ORM\n\n如果为\
  \ `Value Objects` 属性添加搜索功能并不重要，还有另一种可以考虑的模式，即序列化 LOB（Serialized LOB）。这种模式通过将整个 `Value\
  \ Object` 序列化为易于持久化和获取的字符串格式来实现。这种解决方案与 `Embedded` 替代方案的主要区别在于，在后者中，持久化足迹被减少到了单列。\n\
  \n```sql\nCREATE TABLE products (\n  id INT NOT NULL,\n  name VARCHAR(255) NOT NULL,\n\
  \  price TEXT NOT NULL\n)\n```\n\n为了使用这种方法持久化 `Product` 实体，需要对 `DbalProductRepository`\
  \ 进行更改。在持久化最终的 `Entity` 之前，必须将 `Money` 值对象序列化为字符串。\n\n```php\nclass DbalProductRepository\
  \ extends DbalRepository implements ProductRepository\n{\n    public function add(Product\
  \ $aProduct)\n    {\n        $sql = 'INSERT INTO products VALUES (?, ?, ?)';\n \
  \       $stmt = $this->connection()->prepare($sql);\n        $stmt->bindValue(1,\
  \ $aProduct->id());\n        $stmt->bindValue(2, $aProduct->name());\n        $stmt->bindValue(3,\
  \ $this->serialize($aProduct->price()));\n        // ...\n    }\n\n    private function\
  \ serialize($object)\n    {\n        return serialize($object);\n    }\n}\n```\n\
  \n让我们看看我们的 `Product` 现在在数据库中是如何表示的。表列 `price` 是 `TEXT` 类型，包含了代表 9,99 USD 的 `Money`\
  \ 对象的序列化。\n\n```mysql\nmysql> select * from products\n1 row\nid: 1\nname: Domain-Driven\
  \ Design in PHP\nprice: O:22:\"Ddd\\Domain\\Model\\Money\":2:{s:30:\" Ddd\\Domain\\\
  Model\\Money amount\";i:999;s:32:\" Ddd\\Domain\\Model\\Money currency\";O:25:\"\
  Ddd\\Domain\\Model\\Currency\":1:{s:34:\" Ddd\\Domain\\Model\\Currency isoCode\"\
  ;s:3:\"USD\";}}\n1 row in set (0.00 sec)\n```\n\n这种方法可以完成工作，但由于在代码中重构类时会发生的问题，并不建议使用。你能想象当将\
  \ `Money` 类从一个命名空间移动到另一个命名空间时，我们的数据库表示需要哪些变化吗？如所述，另一个权衡是缺乏查询能力。无论你是否使用 `Doctrine`，在使用序列化策略时，编写查询获取低于\
  \ 200 美元的产品的几乎是不可能的。\n\n查询问题只能通过使用 `Embedded Values` 来解决，但序列化的重构问题可以使用专门的库修复。\n\n\
  ### 3.7.1.4 使用 JMS 改进序列化\n\n如前所述，另一个权衡是缺乏查询能力。无论你是否使用 `Doctrine`，在使用序列化策略时，编写查询获取低于\
  \ 200 美元的产品的几乎是不可能的。\n\n查询问题只能通过使用 `Embedded Values` 来解决，但序列化的重构问题可以使用专门的库修复。\n\n\
  ### 3.7.1.5 使用 Doctrine 的序列化 LOB\n\n在 Doctrine 中，有不同的方法来序列化对象以便最终持久化。\n\n#### 3.7.1.5.1\
  \ Doctrine 对象映射\n\nDoctrine 支持序列 LOB 模式。你有许多映射类型可以匹配 `Entity` 属性与数据库列甚至表。这些映射类型之一就是对象类型。它使用\
  \ `serialize()` 和 `unserialize()` 将 `CLOB` 映射到 PHP 对象。\n\n正如文档所述：“对象类型根据序列化映射并转换对象数据。如果你需要存储对象的精确表示，应该考虑使用这种类型，因为它使用序列化将你的对象的精确副本作为字符串存储在数据库中。从数据库检索出的值始终通过反序列化转换为\
  \ PHP 的对象类型，或者在没有数据时转换为 null。这种类型内部始终会被映射到数据库供应商的文本类型，因为没有办法在数据库中原生存储 PHP 对象表示。此外，这种类型需要一个\
  \ SQL 列注释提示，以便从数据库进行反向工程。Doctrine 无法使用不支持列注释的供应商正确映射回这种类型，而是退回到文本类型。解决此问题的变方法是手动\
  \ `serialize()/unserialize()` 和 `base64_encode()/base64_decode()` PHP 对象并将它们存储到文本字段中。”\n\
  \n让我们看看使用对象类型为 `Product` 实体可能的 XML 映射。\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<doctrine-mapping\nxmlns=\"http://doctrine-project.org/schemas/orm/doctrine-mapping\"\
  \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\">\n```\n\n\n\n\n\n```xml\n\
  xsi:schemaLocation=\"http://doctrine-project.org/schemas/orm/doctrine-mapping https://raw.github.com/doctrine/doctrine2/master/doctrine-mapping.xsd\"\
  >\n\n<entity name=\"Product\" table=\"products\">\n    <id name=\"id\" column=\"\
  id\" type=\"string\" length=\"255\">\n        <generator strategy=\"NONE\"></generator>\n\
  \    </id>\n    <field name=\"name\" type=\"string\" length=\"255\"/>\n    <field\
  \ name=\"price\" type=\"object\"/>\n</entity>\n</doctrine-mapping>\n```\n\n关键的添加是\
  \ `type=\"object\"`，它告诉 Doctrine 我们现在将使用对象映射。现在让我们来看看如何使用 Doctrine 创建并持久化一个 `Product`\
  \ 实体。\n\n### 值对象 (Value Objects)\n\n```php\n// ...\n$em->persist($product);\n$em->flush($product);\n\
  ```\n\n让我们检查一下，如果现在我们从数据库获取我们的 `Product` 实体，它返回的是否预期的状态。\n\n```php\n// ...\n$repository\
  \ = $em->getRepository('Ddd\\\\\\\\Domain\\\\\\\\Model\\\\\\\\Product');\n$item\
  \ = $repository->find(1);\nvar_dump($item);\n```\n\n```php\nclass Ddd\\\\Domain\\\
  \\Model\\\\Product#177 (3) {\n    protected $productId => int(1)\n    protected\
  \ $name => string(41) \"Domain-Driven Design in PHP\"\n    protected $money => class\
  \ Ddd\\\\Domain\\\\Model\\\\Money#174 (2) {\n        private $amount => string(3)\
  \ \"100\"\n        private $currency => class Ddd\\\\Domain\\\\Model\\\\Currency#175\
  \ (1) {\n            private $isoCode => string(3) \"USD\"\n        }\n    }\n}\n\
  ```\n\n最后，但同样重要的，正如 Doctrine 文档所述：“对象类型通过引用进行比较，而不是通过值。如果引用发生变化，Doctrine 会更新此值，因此表现就像这些对象是不可变的值对象一样。”更多信息请查看\
  \ [Doctrine 基础映射类型参考¹⁷](http://docs.doctrine-project.org/projects/doctrine-orm/en/latest/reference/basic-mapping.html#doctrine-mapping-types)。\n\
  \n这种方法面临与即用 ORM 相同的重构问题。对象映射类型内部使用 `serialize/unserialize`。如果改用我们自己的序列化会怎样？\n\n\
  ¹⁷[`docs.doctrine-project.org/projects/doctrine-orm/en/latest/reference/basic-mapping.html#doctrine-mapping-types`](http://docs.doctrine-project.org/projects/doctrine-orm/en/latest/reference/basic-mapping.html#doctrine-mapping-types)\n\
  \n### 3.7.1.5.2 Doctrine 自定义类型\n\n另一种选项是使用 Doctrine 自定义类型来处理值对象的持久化。自定义类型为 Doctrine\
  \ 增加了一种新的映射类型，描述了实体字段与数据库表示之间的自定义转换，以便进行持久化。\n\n正如 Doctrine 文档解释的，“仅仅重新定义数据库类型如何映射到所有现有\
  \ Doctrine 类型完全没有用。你可以通过扩展 `Doctrine\\\\DBAL\\\\Types\\\\Type` 来定义你自己的 Doctrine\
  \ 映射类型。你需要实现 4 个不同的方法才能使其正常工作。”\n\n使用对象类型时，序列化步骤包含了类（class）等信息，这使得安全地重构我们的代码变得非常困难。让我们尝试改进这个解决方案。考虑一个可以解决问题的自定义序列化过程。其中一种方法是将\
  \ `Money` 值对象以“amount|isoCode”格式编码为字符串持久化到数据库中吗？\n\n```php\nuse Ddd\\\\Domain\\\\\
  Model\\\\Currency;\nuse Ddd\\\\Domain\\\\Model\\\\Money;\nuse Doctrine\\\\DBAL\\\
  \\Types\\\\TextType;\nuse Doctrine\\\\DBAL\\\\Platforms\\\\AbstractPlatform;\n\n\
  class MoneyType extends TextType\n{\n    const MONEY = 'money';\n\n    public function\
  \ convertToPHPValue($value, AbstractPlatform $platform)\n    {\n        $value =\
  \ parent::convertToPHPValue($value, $platform);\n        $value = explode('|', $value);\n\
  \        return new Money(\n            $value[0],\n            new Currency($value[1])\n\
  \        );\n    }\n\n    public function convertToDatabaseValue($value, AbstractPlatform\
  \ $platform)\n    {\n        return implode(\n            '|',\n            [\n\
  \                $value->amount(),\n                $value->currency()->isoCode()\n\
  \            ]\n        );\n    }\n\n    public function getName()\n    {\n    \
  \    return self::MONEY;\n    }\n}\n```\n\n使用 Doctrine 你需要注册所有自定义类型。通常使用一个 `EntityManagerFactory`\
  \ 来集中处理 `EntityManager` 的创建。你也可以在引导程序中完成这一步。\n\n```php\nuse Doctrine\\\\DBAL\\\\\
  Types\\\\Type;\nuse Doctrine\\\\ORM\\\\EntityManager;\nuse Doctrine\\\\ORM\\\\Tools\\\
  \\Setup;\n\nclass EntityManagerFactory\n{\n    public function build()\n    {\n\
  \        Type::addType(\n            'money',\n            'Ddd\\\\\\\\Infrastructure\\\
  \\\\\\Doctrine\\\\\\\\Type\\\\\\\\MoneyType'\n        );\n        return EntityManager::create(\n\
  \            [\n                'driver' => 'pdo_mysql',\n                'user'\
  \ => 'root',\n                'password' => '',\n                'dbname' => 'ddd',\n\
  \            ],\n            Setup::createXMLConfiguration(\n                __DIR__.'/config',\n\
  \                true\n            )\n        );\n    }\n}\n```\n\n现在，我们需要在映射中指定我们要使用的自定义类型。\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<doctrine-mapping xsi:schemaLocation=\"\
  http://doctrine-project.org/schemas/orm/doctrine-mapping https://raw.github.com/doctrine/doctrine2/master/doctrine-mapping.xsd\"\
  >\n<entity name=\"Product\" table=\"products\">\n    <id name=\"id\" column=\"id\"\
  \ type=\"string\" length=\"255\">\n        <generator strategy=\"NONE\"></generator>\n\
  \    </id>\n    <field name=\"name\" type=\"string\" length=\"255\"/>\n    <field\
  \ name=\"price\" type=\"money\"/>\n</entity>\n</doctrine-mapping>\n```\n\n### 3.7.2\
  \ 持久化值对象集合\n\n假设现在我们想为我们的 `Product` 实体添加一个要持久化的价格集合。这些价格可能代表产品在其生命周期内经历过的价格，或者不同货币下的产品价格。它可以命名为所示的\
  \ `HistoricalProduct`。\n\n```php\nclass HistoricalProduct extends Product\n{\n \
  \   /**\n     * @var Money[]\n     */\n    protected $prices;\n\n    public function\
  \ __construct($aProductId, $aName, Money $aPrice, array $somePrices)\n    {\n  \
  \      parent::__construct($aProductId, $aName, $aPrice);\n        $this->setPrices($somePrices);\n\
  \    }\n\n    private function setPrices(array $somePrices)\n    {\n        $this->prices\
  \ = $somePrices;\n    }\n\n    public function prices()\n    {\n        return $this->prices;\n\
  \    }\n}\n```\n\n`HistoricalProduct` 继承自 `Product`，因此继承了相同的行为以及价格集合的功能。\n\n###\
  \ 3.7.2.1 序列化到单列的集合\n\n将值对象集合序列化到单列可能是最简单的解决方案。之前讨论的所有关于持久化单个值对象的内容都适用于此处。\n\n\n\
  \n\n在这种情况下，使用 Doctrine 时你可以使用对象（Object）或自定义类型（Custom Type），但需要注意一些额外的：值对象（Value\
  \ Objects）的大小应该尽可能小，但如果你想持久化一个大型集合，请务必考虑数据库引擎能够处理的最大列长度和最大行宽。\n\n### 练习\n\n为持久具有不同价格的产品（Product）构思两种\
  \ Doctrine 对象类型和 Doctrine 自定义类型的实现策略。\n\n### 3.7.2.2 由连接表（Join Table）回支持的集合\n\n\
  当需要持久化一个包含值对象集合的实体且需要查询能力时，你可以选择将值对象持久化为实体（Entities）。在领域（Domain）中，这些对象仍然是值对象，但我们需要为它们提供一个\
  \ `id`，并与所有者（一个真实的实体）建立“一对多”或“一对一”关联。简而言之，你的 ORM 将值对象的集合作为实体处理，但在你的领域中，它们仍然被视为值对象。\n\
  \n“连接表”策略的核心思想是创建一个连接所有者实体及其值对象的表。让我们来看看数据库的表示。\n\n```sql\nCREATE TABLE `historical_products`\
  \ (\n  `id` varchar(255) COLLATE utf8_unicode_ci NOT NULL,\n  `name` varchar(255)\
  \ COLLATE utf8_unicode_ci NOT NULL,\n  `price_amount` int(11) NOT NULL,\n  `price_currency`\
  \ varchar(255) COLLATE utf8_unicode_ci NOT NULL,\n  PRIMARY KEY (`id`)\n) ENGINE=InnoDB\
  \ DEFAULT CHARSET=utf8 COLLATE=utf8_unicode_ci;\n```\n\n`historical_products` 表看起来与\
  \ `products` 表相同。记住，为了方便展示如何处理集合的持久化，`HistoricalProduct` 扩展了 `Product` 实体。现在需要一个新的表来持久化产品实体可以处理的所有不同\
  \ Money 值对象。\n\n```sql\nCREATE TABLE `prices` (\n  `id` int(11) NOT NULL AUTO_INCREMENT,\n\
  \  `amount` int(11) NOT NULL,\n  `currency` varchar(255) COLLATE utf8_unicode_ci\
  \ NOT NULL,\n  PRIMARY KEY (`id`)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8 COLLATE=utf8_unicode_ci;\n\
  ```\n\n最后，需要一个关联产品和价格的表。\n\n```sql\nCREATE TABLE `products_prices` (\n  `product_id`\
  \ varchar(255) COLLATE utf8_unicode_ci NOT NULL,\n  `price_id` int(11) NOT NULL,\n\
  \  PRIMARY KEY (`product_id`,`price_id`),\n  UNIQUE KEY `UNIQ_62F8E673D614C7E7`\
  \ (`price_id`),\n  KEY `IDX_62F8E6734584665` (`product_id`),\n  CONSTRAINT `FK_62F8E6734584665`\
  \ FOREIGN KEY (`product_id`) REFERENCES `historical_products` (`id`),\n  CONSTRAINT\
  \ `FK_62F8E673D614C7E7` FOREIGN KEY (`price_id`) REFERENCES `prices` (`id`)\n) ENGINE=InnoDB\
  \ DEFAULT CHARSET=utf8 COLLATE=utf8_unicode_ci;\n```\n\n### 3.7.2.2.1 使用 Doctrine\
  \ 由连接表支持的集合\n\nDoctrine 要求所有数据库实体必须具有唯一标识。因为我们要持久化 Money 值对象，所以我们需要添加一个人工标识，以便 Doctrine\
  \ 可以处理其持久化。有两种方案：在 Money 值对象中包含代理标识（surrogate identity），或将其放在扩展类中。\n\n第一种方案的问题是，新标识仅仅是因为数据库持久化层的需要。这个标识并不属于领域。\n\
  \n第二种方案的问题是，为了避免上述边界泄漏（boundary leak），需要大量的修改。使用类扩展时，不建议从任何领域对象创建 Money 对象类的新实例，因为这会破坏倒置原则（Inversion\
  \ Principle）。解决方案是再次创建一个 Money 工厂，该工厂需要传递到应用程序和服务任何其他领域对象中。\n\n在这种情况下，我们建议使用第一种方案。让我们查看\
  \ Money 值对象所需的更改。\n\n```php\nclass Money\n{\n    private $amount;\n    private $currency;\n\
  \    private $surrogateId;\n    private $surrogateCurrencyIsoCode;\n\n    public\
  \ function __construct($amount, Currency $currency)\n    {\n        $this->setAmount($amount);\n\
  \        $this->setCurrency($currency);\n    }\n\n    private function setAmount($amount)\n\
  \    {\n        $this->amount = $amount;\n    }\n\n    private function setCurrency(Currency\
  \ $currency)\n    {\n        $this->surrogateCurrencyIsoCode = $currency->isoCode();\n\
  \    }\n\n    public function currency()\n    {\n        if (null === $this->currency)\
  \ {\n            $this->currency = new Currency($this->surrogateCurrencyIsoCode);\n\
  \        }\n        return $this->currency;\n    }\n\n    public function amount()\n\
  \    {\n        return $this->amount;\n    }\n\n    public function equals(Money\
  \ $aMoney)\n    {\n        return\n        $this->amount() === $aMoney->amount()\n\
  \        && $this->currency()->equals($this->currency());\n    }\n}\n```\n\n如所示，添加了两个新属性。第一个属性\
  \ `surrogateId` 我们的领域并不使用，但是持久化基础设施将此值对象持久化为实体时所需的。第二个属性 `surrogateCurrencyIsoCode`\
  \ 保存货币的 ISO 代码。使用这些新属性可以很容易地映射我们的值对象。\n\nMoney 的映射非常直接。\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<doctrine-mapping xmlns=\"http://doctrine-project.org/schemas/orm/doctrine-mapping\"\
  \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"\
  http://doctrine-project.org/schemas/orm/doctrine-mapping https://raw.github.com/doctrine/master/doctrine-mapping.xsd\"\
  >\n  <entity name=\"Domain\\Model\\Money\" table=\"prices\">\n    <id name=\"surrogateId\"\
  \ type=\"integer\">\n      <generator strategy=\"AUTO\"/>\n    </id>\n    <field\
  \ name=\"amount\" type=\"integer\" column=\"amount\"/>\n    <field name=\"surrogateCurrencyIsoCode\"\
  \ type=\"string\" column=\"currency\"/>\n  </entity>\n</doctrine-mapping>\n```\n\
  \n使用 Doctrine，HistoricalProduct 实体将拥有如下映射。\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<doctrine-mapping xmlns=\"http://doctrine-project.org/schemas/orm/doctrine-mapping\"\
  \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"\
  http://doctrine-project.org/schemas/orm/doctrine-mapping https://raw.github.com/doctrine/master/doctrine-mapping.xsd\"\
  >\n  <entity name=\"Domain\\Model\\HistoricalProduct\" table=\"historical_products\"\
  \ repository-class=\"Infrastructure\\Domain\\Model\\DoctrineHistoricalRepository\"\
  >\n    <many-to-many field=\"prices\" target-entity=\"Domain\\Model\\Money\">\n\
  \      <cascade>\n        <cascade-all/>\n      </cascade>\n      <join-table name=\"\
  products_prices\">\n        <join-columns>\n          <join-column name=\"product_id\"\
  \ referenced-column-name=\"id\"/>\n        </join-columns>\n        <inverse-join-columns>\n\
  \          <join-column name=\"price_id\" referenced-column-name=\"id\" unique=\"\
  true\"/>\n        </inverse-join-columns>\n      </join-table>\n    </many-to-many>\n\
  \  </entity>\n</doctrine-mapping>\n```\n\n### 3.7.2.2.2 使用即时 ORM 由连接表支持的集合\n\n使用即时\
  \ ORM 实现同样的操作，此时需要级联插入（Cascade INSERTS）和连接查询。唯一需要注意的是如何处理值对象的删除，以免留下孤立的 Money 值对象。\n\
  \n### 练习\n\n为 DbalHistoricalRepository 构思一个解决方案处理 `persist` 方法。\n\n### 3.7.2.3 由数据库实体支持的集合\n\
  \n“数据库实体”策略与“连接表”策略相同，不同在于值对象仅由所有者实体管理。在当前场景中，考虑 Money 值对象仅被 HistoricalProduct 实体使用。使用连接表会过于复杂。因此，可以使用“一对多”数据库关系来实现相同的结果。\n\
  \n\n\n\n## 练习\n如果使用“数据库实体”（Database Entity）方法，考虑 `HistoricalProduct` 和 `Money` 之间所需的映射关系。\n\
  \n### 3.7.3 NoSQL\n像 `Redis`、`MongoDB` 或 `CouchDB` 等 NoSQL 机制如何？遗憾的是，你无法逃避这些问题。为了使用\
  \ `Redis` 持化一个 `Aggregate`，你需要在设置值之前将其序列化为字符串。如果你使用 `PHP` 的 `serialize`/`unserialize`\
  \ 方法，你将再次面临命名空间或类名的重构问题。如果你选择用自定义方式（json、自定义字符串等）进行序列化，那么你需要在从 Redis 获取时重新构建 `Value\
  \ Object`。\n\n### 3.7.3.1 PostgreSQL 和 JSONB\n如果我们的数据库引擎不仅允许我们使用序列化 LOB 策略，还能根据其值进行搜索，那么我们就能兼顾两种方法的优点。嗯，现在可以了。从\
  \ PostgreSQL 9.4 版本开始，增加了对 [JSONB](http://www.postgresql.org/docs/9.4/static/functions-json.html)¹⁹的支持。Value\
  \ Objects 现在可以作为 JSON 序列化的形式持久化，并在该 JSON 序列化内部进行查询。\n\n### 3.8 安全\n使用 Value Object\
  \ 对领域概念进行建模时，另一个有趣的细节是其安全性方面的优势。考虑一个机票销售背景的应用程序。如果你处理国际民航运输协会机场代码（也称为 [IATA 代码](https://en.wikipedia.org/wiki/International_Air_Transport_Association_airport_code)²⁰，你可以决定使用字符串或使用\
  \ Value Object 对该概念进行建模。如果你选择使用字符串，请考虑所有你将检查该字符串是否为有效 IATA 代码的地方。在任何重要地方遗忘的概率有多大？另一方面，考虑尝试实例化一个新的\
  \ `IATA(\"BCN'; DROP TABLE users;--\")`。如果你在构造函数中集中[守卫逻辑（guards）](https://en.wikipedia.org/wiki/Guard_\\\
  (computer_science\\))²¹ 并向你的模型传递 IATA Value Object，那么避免 SQL 注入或类似的攻击将变得更容易。\n\n\
  如果你想了解更多关于领域驱动设计的安全方面，可以关注 [Dan](https://twitter.com/danbjson) [Bergh Johnsson](https://twitter.com/danbjson)²²\
  \ 或阅读他的[博客](http://dearjunior.blogspot.com.es/search/label/domain%20driven%20security)²³。\n\
  \n### 3.9 总结\n强烈建议使用 Value Objects 对领域中需要衡量、量化或描述的概念进行建模。如所示，Value Objects 易于创建、维护和测试。为了在\
  \ DDD 应用中处理持久化，使用 ORM 是必须的。然而，为了在 `Doctrine` 目前尚不支持嵌入值（embedded values，计划在 2.5 版本支持）的情况下持久化\
  \ Value Objects，有两种方案：将 Value Object 字段直接添加到你的 `Entity` 中并进行映射（不够优雅，但更简单）或扩展你的实体（优雅得多，但很复杂）。\n\
  \n## 4 实体 (Entities)\n### 4.1 引言\n我们讨论了首先尝试将领域中的所有内容建模为值对象的益处。但在建模领域时，可能会出现这样的情况：你会发现通用语言（ubiquitous\
  \ language）中的某些概念需要身份线程（thread of identity）。这些的例子包括：\n- 一个 `person`（人）。`person`\
  \ 总是有一个身份，且就姓名而言始终相同。\n- 电子商务系统中的 `order`（订单）。在该背景下，创建的每个新订单都有自己的身份，且是唯一的。\n\n```php\n\
  class Person {\n    private $identity;\n    private $name;\n    public function\
  \ __construct($identity, $name) {\n        $this->identity = $identity;\n      \
  \  $this->name = $name;\n    }\n    public function getId() {\n        return $this->identity;\n\
  \    }\n    public function getName() {\n        return $this->name;\n    }\n}\n\
  \nclass Order {\n    private $id;\n    public function __construct($id) {\n    \
  \    $this->id = $id;\n    }\n    public function getId() {\n        return $this->id;\n\
  \    }\n}\n```\n\n### 4.2 对象 vs 原始类型\n在大多数情况下，实体的身份被表示为一种原始类型：通常是字符串或整数。但使用值对象来表示它有更多优势：\n\
  - Value Objects 是不可变的，因此无法被修改。\n- Value Objects 是复杂类型，可以拥有原始类型不具备的自定义行为。例如相等性操作。通过值对象，相等操作可以封装在自己的类中，使概念从隐式变为显式。\n\
  \n```php\nnamespace Ddd\\Domain\\Model;\nclass OrderId {\n    private $id;\n   \
  \ public function __construct($anId) {\n        $this->id = $anId;\n    }\n\n  \
  \  public function id() {\n        return $this->id;\n    }\n\n    public function\
  \ equalsTo(OrderId $anOrderId) {\n        return $anOrderId->id === $this->id;\n\
  \    }\n}\n```\n\n```php\nclass Order {\n    private $id;\n    private $amount;\n\
  \    private $firstName;\n    private $lastName;\n    public function __construct(OrderId\
  \ $anOrderId, Amount $amount, $aFirstName, $aLastName) {\n        $this->id = $anOrderId;\n\
  \        $this->amount = $amount;\n        $this->firstName = $aFirstName;\n   \
  \     $this->lastName = $aLastName;\n    }\n\n    public function id() {\n     \
  \   return $this->id;\n    }\n\n    public function firstName() {\n        return\
  \ $this->firstName;\n    }\n\n    public function lastName() {\n        return $this->lastName;\n\
  \    }\n\n    public function amount() {\n        return $this->amount;\n    }\n\
  }\n```\n\n### 4.3 身份操作\n如前所述，实体的身份是定义它的东西。因此，处理身份是实体的重要方面。通常有 4 种定义实体身份的方法：客户端提供身份、应用程序本身提供身份、持久化机制提供身份或另一个边界上下文（bounded\
  \ context）提供身份。\n\n#### 4.3.1 持久化机制生成身份\n通常最简单的方法是让持久化机制生成身份，因为大部分持久化机制都支持某种身份生成，例如\
  \ MySQL 的 `AUTO_INCREMENT` 属性或 Oracle/Postgres 的序列。这虽然简单，但存在一个主要的\n\n\n\n\n\n缺点：`在持久化实体之前，我们无法获得实体的标识。`\
  \ 因此，在某种程度上，如果我们使用由持久化机制生成的标识，将会标识操作与底层的持久化存储进行耦合。\n\n```sql\nCREATE TABLE `orders`\
  \ (\n  id(11) NOT NULL auto_increment,\n  amount decimal(10, 5) NOT NULL,\n  first_name\
  \ varchar(100) NOT NULL,\n  last_name varchar(100) NOT NULL,\n  PRIMARY KEY (`id`)\n\
  ) ENGINE=InnoDB;\n```\n\n然后我们可能会考虑这段代码：\n\n```php\nnamespace Ddd\\Identity\\Domain\\\
  Model;\n\nclass Person\n{\n    private $identificationNumber;\n    private $firstName;\n\
  \    private $lastName;\n\n    public function __construct($anIdentificationNumber,\
  \ $aFirstName, $aLastName)\n    {\n        $this->-identificationNumber = $anIdentificationNumber;\n\
  \        $this->firstName = $aFirstName;\n        $this->lastName = $aLastName;\n\
  \    }\n\n    public function identificationNumber()\n    {\n        return $this->identificationNumber;\n\
  \    }\n\n    public function firstName()\n    {\n        return $this->firstName;\n\
  \    }\n\n    public function lastName()\n    {\n        return $this->lastName;\n\
  \    }\n}\n```\n\n### 4.3.1.1 代理标识\n\n有时，使用 ORM 将实体映射到持久化存储时，会施加某些限制，例如，Doctrine\
  \ 如果使用 `IDENTITY` 生成策略，则要求一个整数字段。如果领域模型需要另一种类型的标识，这可能会与领域模型产生冲突。\n\n处理这种情况的最简单方法是使用[层超类型\
  \ (Layer SuperType)](http://martinfowler.com/eaaCatalog/layerSupertype.html)[¹]](#index_split_000.html#98)，我们在其中放置为持久化存储创建的标识字段。\n\
  \n```php\nnamespace Ddd\\Common\\Domain\\Model;\n\nabstract class IdentifiableDomainObject\n\
  {\n    private $id;\n\n    protected function id()\n    {\n        return $this->id;\n\
  \    }\n\n    protected function setId($anId)\n    {\n        $this->id = $anId;\n\
  \    }\n}\n```\n\n¹[`martinfowler.com/eaaCatalog/layerSupertype.html`](http://martinfowler.com/eaaCatalog/layerSupertype.html)\n\
  \n```php\nnamespace Acme\\Billing\\Domain;\n\nuse Acme\\Common\\Domain\\IdentifiableDomainObject;\n\
  \nclass Order extends IdentifiableDomainObject\n{\n    private $orderId;\n\n   \
  \ public function orderId()\n    {\n        if (null === $this->orderId) {\n   \
  \         $this->orderId = new OrderId($this->id());\n        }\n        return\
  \ $this->orderId;\n    }\n}\n```\n\n### 4.3.1.2 富领域模型中的 Active Record 与 Data Mapper\n\
  \n每个项目总是面临着应该使用哪种 ORM 的决策。PHP 中有很多优秀的 ORM：Doctrine、Propel、Eloquent、Paris 以及许多其他。\n\
  \n它们中的大多数是[Active Record (活动记录)](http://www.martinfowler.com/eaaCatalog/activeRecord.html)²\
  \ 的实现。Active Record 实现对于 CRUD 来说通常很好，但对于富领域模型来说，它并不是理想的解决方案，原因如下：\n\n- `Active Record`\
  \ 模式假设实体与数据库表之间存在一对一的关系。因此，它将数据库设计与对象系统设计耦合在一起。而在富领域模型中，实体有时是使用来自不同数据源的信息构建的。\n\
  - 集合或继承等高级特性实现起来非常困难。\n- 大多数实现通过继承强制要求使用某些构造结构来施加若干约定。这可能会通过将领域模型与 ORM 耦合，导致`持久化泄漏\
  \ (persistence leakage)` 到领域模型中。作者看到的唯一不强制继承自基类的 Active Record 实现是来自 [Castel Project](http://www.castleproject.org/)⁴\
  \ 的 [Castle ActiveRecord³](http://docs.castleproject.org/Active%20Record.MainPage.ashx)，这是一个\
  \ .NET 框架。虽然这在生成的实体实现了持久化和领域关注点之间的某种分离，但并没有防止数据设计与对象设计的耦合。\n\n²[`www.martinfowler.com/eaaCatalog/activeRecord.html`](http://www.martinfowler.com/eaaCatalog/activeRecord.html)\n\
  ³[`docs.castleproject.org/Active%20Record.MainPage.ashx`](http://docs.castleproject.org/Active%20Record.MainPage.ashx)\n\
  ⁴[`www.castleproject.org/`](http://www.castleproject.org/)\n\n目前 PHP 最好的 ORM 是 [Doctrine](http://doctrine-project.org)⁵。它是[Data\
  \ Mapper (数据映射器)](http://www.martinfowler.com/eaaCatalog/dataMapper.html) [`模式`⁶](http://www.martinfowler.com/eaaCatalog/dataMapper.html)\
  \ 的实现。Data Mapper 将持久化与领域解耦。\n\n### 4.3.2 客户端提供标识\n\n有时，在处理某些领域时，处理标识操作的首选方法是让客户端生成，自然而是在客户端完成。\n\
  \n```php\nnamespace Ddd\\Catalog\\Domain\\Model;\n\nclass ISBN\n{\n    private $isbn;\n\
  \n    public function __construct($anbn, $title)\n    {\n        $this->isbn = $anbn;\n\
  \        $this->title = $title;\n    }\n\n    private function setIsbn($anbn)\n\
  \    {\n        $this->isbn = $anbn;\n    }\n\n    private function assertIsbn($anbn,\
  \ $string)\n    {\n        The ISBN is invalid.\n    }\n\n    public static function\
  \ create($anbn)\n    {\n        return new static($anbn);\n    }\n}\n\n$book = new\
  \ Book(\n    ISBN::create('...'),\n    'Domain-Driven Design with PHP'\n);\n```\n\
  \n### 4.3.3 应用生成标识\n\n如果客户端不能提供标识，通常处理标识的首选方法是让应用程序生成，通常是通过 UUID 完成。PHP 中有几个库可以生成\
  \ UUID。可以在 packagist 上找到。\n\n最推荐的是 *Ben Ramsey* 在 `https://github.com/ramsey/uuid`\
  \ 开发的那个，因为它在 Github 上有约 500 个关注者，在 packagist 上有 240,000 次安装。\n\n放置标识创建的首选位置是在*Repository\
  \ (Repository)* 内部：\n\n```php\nnamespace Ddd\\Billing\\Domain\\Model\\Order;\n\n\
  interface OrderRepository\n{\n    public function nextIdentity();\n    public function\
  \ add(Order $anOrder);\n    public function remove(Order $anOrder);\n}\n\nclass\
  \ OrderId\n{\n    private $id;\n\n    private function __construct($anId)\n    {\n\
  \        $this->id = $anId;\n    }\n\n    public static function create($anId)\n\
  \    {\n        return new static($anId);\n    }\n}\n```\n\n```php\nnamespace Ddd\\\
  Billing\\Infrastructure\\Doctrine\\Order;\n\nuse Ddd\\Billing\\Domain\\Model\\Order\\\
  Order;\nuse Ddd\\Billing\\Domain\\Model\\Order\\OrderId;\nuse Ddd\\Billing\\Domain\\\
  Model\\Order\\OrderRepository;\nuse Doctrine\\ORM\\EntityRepository;\nuse Rhumsaa\\\
  Uuid\\Uuid;\n\nclass DoctrineOrderRepository\nextends EntityRepository\nimplements\
  \ OrderRepository\n{\n    public function nextIdentity()\n    {\n        return\
  \ OrderId::create(\n            strtoupper(Uuid::uuid4())\n        );\n    }\n\n\
  \    public function add(Order $anOrder)\n    {\n        $this->getEntityManager()->persist($anOrder);\n\
  \    }\n\n    public function remove(Order $anOrder)\n    {\n        $this->getEntityManager()->remove($anOrder);\n\
  \    }\n}\n```\n\n### 4.3.4 其他边界上下文生成标识\n\n这可能是最复杂的标识生成策略，因为它强制本地实体不仅依赖于本地边界上下文的事件，还依赖于外部边界\n\
  \n\n\n\n上下文事件。因此，从维护的角度来看，成本将会很高。\n\n其他边界上下文（Bounded Context）提供了一些 UI 组件来选择本地实体的标识。这甚至可以从远程实体抓取某些属性到其自身。\n\
  \n当边界上下文的实体之间需要同步时，通常可以通过每个在原始实体更改时需要通知的边界上下文上的*事件驱动*（Event Driven）架构来实现。\n\n###\
  \ 4.4 持久化实体\n\n目前，正如本章之前讨论的，将实体状态保存到持久化存储中的最佳工具是 `Doctrine ORM`。\n\n`Doctrine` 有几种方法来指定实体元数据：通过实体代码中的注解（annotations）、通过\
  \ XML、YAML 或纯 PHP。在本章中，我们将深入讨论为什么在映射实体时，使用注解不是最好的主意。\n\n### 4.4.1 设置 Doctrine\n\n\
  首先，我们需要通过 `composer` 引入它。在项目根目录下必须执行以下命令：\n\n```bash\nphp composer.phar require\
  \ \"doctrine/orm=~2.4\"\n```\n\n然后，这些行代码将允许设置 doctrine：\n\n```php\nrequire_once\
  \ \"/path/to/vendor/autoload.php\";\nuse Doctrine\\ORM\\Tools\\Setup;\nuse Doctrine\\\
  ORM\\EntityManager;\n\n$paths = [\"/path/to/entity-files\"];\n$isDevMode = false;\n\
  \n// 连接配置\n$dbParams = array(\n    'driver' => 'pdo_mysql',\n    'user' => 'the_database_username',\n\
  \    'password' => 'the_database_password',\n    'dbname' => 'the_database_name',\n\
  );\n\n$config = Setup::createAnnotationMetadataConfiguration($paths, $isDevMode);\n\
  $entityManager = EntityManager::create($dbParams, $config);\n```\n\n### 4.4.2 映射实体\n\
  \n默认情况下，`Doctrine` 文档使用注解展示代码示例。因此我们从注解开始代码示例，并讨论为什么尽可能避免它们。为了这样做，我们将引入本章之前讨论过的\
  \ `Order` 类。\n\n#### 4.4.2.1 使用注解代码映射实体\n\n`Doctrine` 发布时使用的特性之一是可以使用注解代码来指定映射信息。\n\
  \n**什么是注解？**\n\n注解是元数据的一种特殊形式。在 PHP 中，它被放在源代码的注释下。例如，`PHPDocumentor` 利用注解来构建 API\
  \ 信息，或者 `PHPUnit` 使用某些注解来指定 `dataProviders` 或对代码代码抛出的异常提供期望言。\n\n```php\nclass SumTest\
  \ extends PHPUnit_Framework_TestCase {\n    /**\n     * @dataProvider aMethodName\n\
  \     */\n    public function testAddition() {\n        // ...\n    }\n}\n```\n\n\
  因此，为了将 `Order` 实体映射到持久化存储，首先必须修改 `Order` 的源代码以添加 `Doctrine` 注解：\n\n```php\nuse Doctrine\\\
  ORM\\Mapping\\Entity;\nuse Doctrine\\ORM\\Mapping\\Id;\nuse Doctrine\\ORM\\Mapping\\\
  GeneratedValue;\nuse Doctrine\\ORM\\Mapping\\Column;\n\n/**\n * @Entity\n */\nclass\
  \ Order\n{\n    /**\n     * @Id\n     * @GeneratedValue(strategy=\"AUTO\")\n   \
  \  */\n    private $id;\n\n    /**\n     * @Column(type=\"decimal\", precision=\"\
  10\", scale=\"5\")\n     */\n    private $amount;\n\n    /**\n     * @Column(type=\"\
  string\")\n     */\n    private $firstName;\n\n    /**\n     * @Column(type=\"string\"\
  )\n     */\n    private $lastName;\n\n    public function __construct(Amount $anAmount,\
  \ $FirstName, $lastName) {\n        $this->amount = $anAmount;\n        $this->firstName\
  \ = $FirstName;\n        $this->lastName = $lastName;\n    }\n\n    public function\
  \ id() {\n        return $this->id;\n    }\n\n    public function firstName() {\n\
  \        return $this->firstName;\n    }\n\n    public function lastName() {\n \
  \       return $this->lastName;\n    }\n\n    public function amount() {\n     \
  \   return $this->amount;\n    }\n}\n```\n\n然后将实体持久化到持久化存储中就非常简单：\n\n```php\n$order\
  \ = new Order(new Amount(15), 'FirstName', 'lastName');\n$entityManager->persist($order);\n\
  $entityManager->flush();\n```\n\n乍一看，这段代码看起来很简单，可以是指定映射信息的一种简单方法。但这种方法是有代价的。最终代码奇怪之处何？首先，领域关注与基础设施关注点混合在了一起。`Order`\
  \ 是一个领域概念，而 `Table` 和 `Column` 等是基础设施关注点。因此，该实体紧密耦合到源代码中通过注解指定的映射信息。如果使用另一个实体管理器和不同的映射元数据来持久化实体，将是不可能的。注解往往会导致副作用和紧耦合。\n\
  \n那么指定映射信息的最佳方法是什么？最佳方法是将映射信息与实体本身分离。这可以通过 XML 映射、YAML 映射或 PHP 映射来实现。在本书中我们将涵盖 XML\
  \ 映射。\n\n#### 4.4.2.2 使用 XML 映射实体\n\n使用 XML 映射 `Order` 实体，首先需要更改 `Doctrine` 的设置代码：\n\
  \n```php\nrequire_once \"/path/to/vendor/autoload.php\";\nuse Doctrine\\ORM\\Tools\\\
  Setup;\nuse Doctrine\\ORM\\EntityManager;\n\n$paths = [\"/path/to/entity-files\"\
  ];\n$isDevMode = false;\n\n// 连接配置\n$dbParams = array(\n    'driver' => 'pdo_mysql',\n\
  \    'user' => 'the_database_username',\n    'password' => 'the_database_password',\n\
  \    'dbname' => 'the_database_name',\n);\n\n$config = Setup::createXMLMetadataConfiguration($paths,\
  \ $isDevMode);\n$entityManager = EntityManager::create($dbParams, $config);\n```\n\
  \n映射文件应该在 `Doctrine` 搜索路径处创建。映射文件根据完全限定类名命名，并将反斜杠（`\\`）替换为点。因此，`Acme\\Billing\\\
  Domain\\Order` 的映射文件命名为 `Acme.Billing.Domain.Order.dcm.xml`。此外，映射文件使用专门为指定映射信息创建的特殊\
  \ XML Schema：\n\n`https://raw.github.com/doctrine/doctrine2/master/doctrine-mapping.xsd`\n\
  \n最终的映射文件将：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<doctrine-mapping\n\
  \    xmlns=\"http://doctrine-project.org/schemas/orm/doctrine-mapping\"\n    xmlns:xsi=\"\
  http://www.w3.org/2001/XMLSchema-instance\"\n    xsi:schemaLocation=\"http://doctrine-project.org/schemas/orm/doctrine-mapping\
  \ https://raw.github.com/doctrine/doctrine2/master/doctrine-mapping.xsd\">\n   \
  \ \n    <entity name=\"Ddd\\Billing\\Domain\\Model\\Order\" table=\"orders\">\n\
  \        <id name=\"id\" column=\"id\" type=\"guid\">\n            <generator strategy=\"\
  NONE\"/>\n        </id>\n        <field name=\"amount\" type=\"decimal\" nullable=\"\
  false\" scale=\"10\" precision=\"5\"/>\n        <field name=\"firstName\" type=\"\
  string\" nullable=\"false\"/>\n        <field name=\"lastName\" type=\"string\"\
  \ nullable=\"false\"/>\n    </entity>\n</doctrine-mapping>\n```\n\n### 4.5 测试实体\n\
  \n测试实体相对容易。因为它们是根据其所代表的领域概念产生的普通 PHP 类。测试的重点应该是实体保护的不不变性，因为实体的行为可能会围绕这些不变量性进行建模。\n\
  \n为了示例和简单起见，假设需要一个博客的领域模型。可能的实现如下：\n\n```php\nclass Post\n{\n    private $title;\n\
  \    private $content;\n    private $status;\n    private $createdAt;\n    private\
  \ $publishedAt;\n\n    public function __construct($aContent, $title) {\n      \
  \  $this->setContent($aContent);\n        $this->setTitle($title);\n        $this->unpublish();\n\
  \        $this->createdAt(new DateTimeImmutable());\n    }\n\n    private function\
  \ setContent($aContent) {\n        $this->assertNotEmpty($aContent);\n        $this->content\
  \ = $aContent;\n    }\n}\n```\n\n\n\n\n```php\nprivate function setTitle($aPostTitle)\n\
  {\n    $this->assertNotEmpty($aPostTitle);\n    $this->title = $aPostTitle;\n}\n\
  \nprivate function setStatus(Status $aPostStatus)\n{\n    $this->assertIsAValidPostStatus($aPostStatus);\n\
  \    $this->status = $aPostStatus;\n}\n\nprivate function createdAt(DateTimeImmutable\
  \ $aDate)\n{\n    $this->assertIsAValidDate($aDate);\n    $this->createdAt = $aDate;\n\
  }\n\nprivate function publishedAt(DateTimeImmutable $aDate)\n{\n    $this->assertIsAValidDate($aDate);\n\
  \    $this->publishedAt = $aDate;\n}\n\npublic function publish()\n{\n    $this->setStatus(\n\
  \        Status::published()\n    );\n    $this->publishedAt(new DateTimeImmutable());\n\
  }\n\npublic function unpublish()\n{\n    $this->setStatus(\n        Status::draft()\n\
  \    );\n    $this->publishedAt = null;\n}\n\npublic function isPublished()\n{\n\
  \    return $this->status->equalsTo(Status::published());\n}\n\npublic function\
  \ publicationDate()\n{\n    return $this->publishedAt;\n}\n}\n\nclass Status\n{\n\
  \    const PUBLISHED = 10;\n    const DRAFT = 20;\n    private $status;\n\n    public\
  \ static function published()\n    {\n        return new self(self::PUBLISHED);\n\
  \    }\n\n    public static function draft()\n    {\n        return new self(self::DRAFT);\n\
  \    }\n\n    private function __construct($aStatus)\n    {\n        $this->status\
  \ = $aStatus;\n    }\n\n    public function equalsTo(self $aStatus)\n    {\n   \
  \     return $this->status === $aStatus->status;\n    }\n}\n```\n\n为了测试这个领域模型，我们必须确保测试覆盖了所有的\
  \ Post（文章）不变性。\n\n```php\nclass PostTest extends PHPUnit_Framework_TestCase\n{\n\
  \    /**\n     * @test\n     */\n    public function aNewPostIsNotPublishedByDefault()\n\
  \    {\n        $aPost = new Post(\n            'A Post Content',\n            'A\
  \ Post Title'\n        );\n        $this->assertFalse(\n            $aPost->isPublished()\n\
  \        );\n        $this->assertNull(\n            $aPost->publicationDate()\n\
  \        );\n    }\n\n    /**\n     * @test\n     */\n    public function aPostCanBePublishedWithAPublicationDate()\n\
  \    {\n        $aPost = new Post(\n            'A Post Content',\n            'A\
  \ Post Title'\n        );\n        $aPost->publish();\n        $this->assertTrue(\n\
  \            $aPost->isPublished()\n        );\n        $this->assertInstanceOf(\n\
  \            'DateTimeImmutable',\n            $aPost->publicationDate()\n     \
  \   );\n    }\n}\n```\n\n### 4.6 验证\n\n验证是我们领域模型中一个非常重要的过程。它不仅检查属性的正确性，还检查整个对象甚至这些对象的组合。为了保持该模型处于有效状态，需要不同层次的验证。仅仅因为一个对象由有效的属性（从基础而言）组成，并不意味着该对象（整体）是有效的。反之，有效的对象并不意味着我们拥有有效的组合。\n\
  \n### 4.6.1 属性验证\n\n有些开发者将验证视为一种检查给定对象状态的过程。通过[契约设计](https://en.wikipedia.org/wiki/Design_by_contract)\
  \ 方法，验证包含了前置条件、后置条件和不变性。为了确保属性的有效，我们可以使用值对象（Value Objects）来保护单个属性。为了使验证更加灵活，我们可以采用如下代码：\n\
  \n```php\nclass Username\n{\n    const MIN_LENGTH = 5;\n    const MAX_LENGTH = 10;\n\
  \    const FORMAT = '/^[a-zA-Z0-9]+$/';\n    private $username;\n\n    public function\
  \ __construct($username)\n    {\n        $this->setUsername($username);\n    }\n\
  \n    private function setUsername($username)\n    {\n        if (empty($username))\
  \ {\n            throw new InvalidException('Empty');\n        }\n\n        $this->assertNotShort($username);\n\
  \        $this->assertNotLong($username);\n        $this->assertFormat($username);\n\
  \n        $this->username = $username;\n    }\n\n    private function assertNotShort($username)\n\
  \    {\n        if (strlen($username) < self::MIN_LENGTH) {\n            throw new\
  \ InvalidException(sprintf('Must be at least %d characters', self::MIN_LENGTH));\n\
  \        }\n    }\n\n    private function assertNotLong($username)\n    {\n    \
  \    if (strlen($username) > self::MAX_LENGTH) {\n            throw new InvalidException(sprintf('Must\
  \ be less than %d characters', self::MAX_LENGTH));\n        }\n    }\n\n    private\
  \ function assertFormat($username)\n    {\n        if (!preg_match(self::FORMAT,\
  \ $username)) {\n            throw new InvalidException('Invalid format');\n   \
  \     }\n    }\n}\n```\n\n正如上面的示例所示，Username 必须满足以下条件：\n- 不为空\n- 至少 5 个字符\n- 少于\
  \ 10 个字符\n- 符合特定的格式\n\n有些开发者可能会将验证视为防御性编程。在这种情况下，我们关注的是输入的正确性，而不允许空值。\n\n### 4.6.2\
  \ 整个对象验证\n\n有时，一个由有效属性组成的对象在整体上仍可能是无效的。可能会将这种验证逻辑添加到对象中，但这是一种反模式。良好的做法是分离这些职责。验证应该向客户端告知发现的问题，或者收集结果后续审查。我们不想在遇到第一个错误时停止执行。抽象的\
  \ Validator 可能如下：\n\n```php\nabstract class Validator\n{\n    private $validationHandler;\n\
  \n    public function __construct(ValidationHandler $validationHandler)\n    {\n\
  \        $this->validationHandler = $validationHandler;\n    }\n\n    protected\
  \ function handleError($error)\n    {\n        $this->validationHandler->handleError($error);\n\
  \    }\n\n    abstract public function validate();\n}\n```\n\n作为一个具体的例子，我们想要验证整个\
  \ `Location` 对象，它由 `Country`、`City` 和 `Postcode` 值对象组成。这些单个值在验证时可能是无效的。也许某个城市不属于该国家，或者邮编不符合城市的格式。\n\
  \n```php\nclass Location\n{\n    private $country;\n    private $city;\n    private\
  \ $postcode;\n\n    public function __construct(Country $country, City $city, Postcode\
  \ $postcode)\n    {\n        $this->country = $country;\n        $this->city = $city;\n\
  \        $this->postcode = $postcode;\n    }\n\n    public function getCountry()\n\
  \    {\n        return $this->country;\n    }\n\n    public function getCity()\n\
  \    {\n        return $this->city;\n    }\n\n    public function getPostcode()\n\
  \    {\n        return $this->postcode;\n    }\n}\n```\n\n\n\n\n\n一旦设置了所有属性，我们就可以对实体进行验证，通常是在某些描述的过程之后。从上看，`Location`\
  \ 似乎是在验证它自己，但事实并非如此。`Location` 将此验证委托给了具体的验证器实例，从而分开了这两个清晰的职责。\n\n## 实体\n99\n\n\
  ### `class Location`\n\n```php\nclass Location\n{\n    //...\n    public function\
  \ validate(ValidationHandler $validationHandler)\n    {\n        $validator = new\
  \ LocationValidator($this, $validationHandler);\n        $validator->validate();\n\
  \    }\n}\n```\n\n### 4.6.2.1 解耦验证消息\n通过对现有实现进行微调，我们能够将验证消息从验证器中解耦：\n\n```php\n\
  class LocationValidationHandler implements ValidationHandler\n{\n    public function\
  \ handleCityNotFoundInCountry();\n    public function handleInvalidPostcodeForCity();\n\
  }\n```\n\n```php\nclass LocationValidator\n{\n    private $location;\n    private\
  \ $validationHandler;\n\n    public function __construct(Location $location, LocationValidationHandler\
  \ $validationHandler)\n    {\n        $this->location = $location;\n        $this->validationHandler\
  \ = $validationHandler;\n    }\n\n    public function validate()\n    {\n      \
  \  if (!$this->location->getCountry()->hasCity($this->location->getCity())) {\n\
  \            $this->validationHandler->handleCityNotFoundInCountry();\n        }\n\
  \n        if (!$this->location->getCity()->isPostcodeValid($this->location->getPostcode()))\
  \ {\n            $this->validationHandler->handleInvalidPostcodeForCity();\n   \
  \     }\n    }\n}\n```\n\n实体\n100\n\n我们还需要更改验证方法的签名为：\n\n```php\nclass Location\n\
  {\n    //...\n    public function validate(LocationValidationHandler $validationHandler)\n\
  \    {\n        $validator = new LocationValidator($this, $validationHandler);\n\
  \        $validator->validate();\n    }\n}\n```\n\n### 4.6.3 验证对象组合\n验证对象组合可能会变得复杂，因此，实现这一点的优方法是通过领域服务（Domain\
  \ Service）。该服务随后与仓库通信以检索有效的 `Aggregate`（聚合根）。由于创建的对象图可能复杂，`Aggregate` 可能处于中间状态，需要预先对其他聚合进行验证。我们可以使用领域事件（Domain\
  \ Events）通知系统的其他部分某个元素已通过验证。\n\n### 4.7 总结\n领域中的某些概念需要身份（Identity），即其状态的改变不会改变它们作为概念的本质。我们已经看到将身份建模为值对象（Value\
  \ Object）带来了一些好处，例如不可变性和操作身份本身的逻辑。我们展示了提供身份的几种方式：\n\n*   持久化机制：容易实现，但在持久化对象之前你无法获得身份，这会延迟并使事件传播复杂。\n\
  *   代理 ID (Surrogate id)：某些 ORM 要求在你的 `Entity` 上增加额外的字段，以将身份与持久化机制映射。\n*   由客户端提供：有时身份符合某个领域概念，你可以在领域内部对其进行建模。\n\
  \n实体\n101\n\n*   由应用程序生成：你可以使用库来生成 ID。\n*   由边界上下文（Bounded Context）生成：这可能是最复杂的策略。其他边界上下文会提供一个生成身份的接口。\n\
  \n我们已经看到了几种提供身份的方法，它们的缺点如下：\n\n*   持久化机制：容易实现，但在持久化对象之前你无法获得身份，这会延迟并使事件传播复杂。\n*\
  \   代理 ID (Surrogate id)：某些 ORM 要求在你的 `Entity` 上增加额外的字段，以将身份与持久化机制映射。\n*   由客户端提供：有时身份符合某个领域概念，你可以在领域内部对其进行建模。\n\
  *   由应用程序生成：你可以使用库来生成 ID。\n*   由边界上下文生成：这可能是最复杂的策略。其他边界上下文会提供一个生成身份的接口。\n\n最后我们可以得出结论：身份策略的选择取决于领域的需求和架构。\n\
  \n## 5. 服务\n### 5.1 介绍\n服务是封装了不属于单一实体的行为的对象。它们通常用于协调涉及多个实体的操作。\n\n你会遇到三种类型的服务：\n\
  \n*   **应用服务 (Application Services)**：这些服务协调应用逻辑，编排领域与外部世界之间对象的流动。\n*   **领域服务 (Domain\
  \ Services)**：它们包含无法在实体或值对象中领域领域逻辑。\n*   **基础设施服务 (Infrastructure Services)**：它们处理技术性问题，例如发送电子邮件、日志记录或与数据库交互。\n\
  \n### 5.2 应用服务\n应用服务协调应用逻辑，编排领域与外部世界之间对象的流动。它们是应用程序的入口。\n\n### 5.2.1 事务\n在领域驱动设计中，事务是在应用服务层处理的。你不会在领域代码的任何地方找到\
  \ `beginTransaction` 或类似代码。在执行应用服务期间执行的所有操作都将以原子方式针对你的数据库运行。\n\n在 PHP 中，我们有一个优雅的解决方案，让你的应用服务在事务范围内执行，而无必担心领域代码中的事务。\n\
  \n```php\ninterface Service\n{\n    public function execute($request);\n}\n\nclass\
  \ TransactionalService\n{\n    private $session;\n    private $service;\n}\n```\n\
  \n\n\n\n```php\npublic function __construct(Service $service, TransactionalSession\
  \ $session)\n{\n    $this->session = $session;\n    $this->service = $service;\n\
  }\n\npublic function execute($request)\n{\n    if (empty($this->service)) {\n  \
  \      throw new LogicException('A use case must be specified');\n    }\n    $operation\
  \ = function () use ($request) {\n        return $this->service->execute($request);\n\
  \    };\n    return $this->session->executeAtomically($operation->bindTo($this));\n\
  }\n}\n```\n\n```php\ninterface TransactionalSession\n{\n    /**\n     * @return\
  \ mixed\n     */\n    public function executeAtomically(callable $operation);\n\
  }\n```\n\n### 5.2.2 测试应用服务\n\n我们该如何测试这个应用服务？正如 Kent Beck 在《TDD by Examples》中所建议的样，测试所有可能出错的地方。这意味着要测试测试路径（happy\
  \ paths）和异常路径（sad paths）。测试路径是指当所有输入均有效且所有资源可用时，正确完成工作的路径。在注册用例中，这意味着邮箱和密码是有效的、用户尚不存在、数据库可用等。而异常路径则是所有其他情况。\n\
  \n```php\nclass SignInUserServiceTest extends PHPUnit_Framework_TestCase\n{\n  \
  \  /**\n     * @test\n     * @expectedException \\Ddd\\Domain\\Model\\User\\UserAlreadyExistsException\n\
  \     */\n    public function alreadyExistingEmailShouldThrowAnException()\n   \
  \ {\n        $service = new SignInUserService(new UserRepository());\n        $service->execute('user@example.com',\
  \ 'password');\n        $service->execute('user@example.com', 'password');\n   \
  \ }\n\n    /**\n     * @test\n     */\n    public function afterUserSignUpItShouldBeInTheRepository()\n\
  \    {\n        $userRepository = new UserRepository();\n        $service = new\
  \ SignInUserService($userRepository);\n        $user = $service->execute('user@example.com',\
  \ 'password');\n        $this->assertSame(\n            $user,\n            $userRepository->userOfId($user->id())\n\
  \        );\n    }\n}\n```\n\n### 5.3 领域服务\n\n在与领域专家的交流过程中，你会在通用语言（Ubiquitous Language）中遇到无法整齐地表示为实体（Entity）或值对象（Value）的概念。\n\
  \n* 用户能够自己登录系统吗？\n* 购物车能够自己转换为订单吗？\n\n上面的例子是两个具体的概念，它们无法自然地绑定到实体或值对象（Value Object）。为了进一步强调这种奇异性，我们可以尝试对行为进行建模：\n\
  \n```php\nclass User\n{\n    public function signIn($aUsername, $aPassword)\n  \
  \  {\n        // ...\n    }\n}\n\nclass Cart\n{\n    public function createOrder()\n\
  \    {\n        // ...\n    }\n}\n```\n\n在第一种实现中，我们无法知道给定的用户名和密码与被调用的用户实例相关。显然，这个操作并不适合这个实体，相反它应该被提取到一个单独的类，使其意图显式化。考虑到这一想法，我们可以创建一个唯一负责用户身份验证的领域服务。\n\
  \n```php\nclass SignIn\n{\n    public function execute($aUsername, $aPassword)\n\
  \    {\n        // ...\n    }\n}\n```\n\n同样地，在第二个例子中，有一个专门从提供的购物车创建订单的领域服务。\n\n\
  ```php\nclass CreateOrderFromCart\n{\n    public function execute(Cart $aCart)\n\
  \    {\n        // ...\n    }\n}\n```\n\n领域服务可以定义为完成领域任务的操作，它自然地不属于任何实体或值对象。作为代表领域中操作的概念，无论其运行历史如何，客户端都应该使用它们。\n\
  \n### 5.4 具有多种实现的领域服务\n\n在建模领域服务时，经常遇到基础设施依赖，例如在需要处理加密机制的情况下。通过这种模式可以在领域和基础设施之间实现**关注点分离。领域服务本身不持有状态。\n\
  \n```php\ninterface SignIn\n{\n    public function execute($aUsername, $aPassword);\n\
  }\n```\n\n使用上述接口，我们可以在基础设施中如下创建一个实现：\n\n```php\nclass DefaultEncryption\n{\n   \
  \ private $userRepository;\n\n    public function __construct(UserRepository $userRepository)\n\
  \    {\n        $this->userRepository = $userRepository;\n    }\n\n    public function\
  \ execute($aUsername, $aPassword)\n    {\n        if (!$this->userRepository->exists($aUsername))\
  \ {\n            throw new InvalidArgumentException(\n                sprintf('The\
  \ user \"%s\" does not exist.', $aUsername)\n            );\n        }\n       \
  \ $user = $this->userRepository->findByUsername($aUsername);\n        if (!password_verify($aPassword,\
  \ $user->getPassword())) {\n            throw new BadCredentialsException();\n \
  \       }\n        return $user;\n    }\n}\n```\n\n另一种基于 MD5 的实现：\n\n```php\nclass\
  \ Md5Encryption implements SignIn\n{\n    const SALT = 'S0m3S4lt';\n    private\
  \ $userRepository;\n\n    public function __construct(UserRepository $userRepository)\n\
  \    {\n        $this->userRepository = $userRepository;\n    }\n\n    public function\
  \ execute($aUsername, $aPassword)\n    {\n        if (!$this->userRepository->exists($aUsername))\
  \ {\n            throw new InvalidArgumentException(\n                sprintf('The\
  \ user \"%s\" does not exist.', $aUsername)\n            );\n        }\n       \
  \ $user = $this->userRepository->findByUsername($aUsername);\n        $encryptedPassword\
  \ = md5($aPassword . '_' . $this->salt());\n        if ($user->getPassword() !==\
  \ $encryptedPassword) {\n            throw new BadCredentialsException();\n    \
  \    }\n        return $user;\n    }\n\n    private function salt()\n    {\n   \
  \     return md5(self::SALT);\n    }\n}\n```\n\n选择这种方案允许对领域服务有多种实现，每个实现负责不同的加密机制。要决定哪个实现可以通过反转控制容器轻松管理，例如\
  \ Symfony 的依赖注入组件：\n\n```xml\n<?xml version=\"1.0\"?>\n<container xmlns=\"http://symfony.com/dic/services\"\
  \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\nxsi:schemaLocation=\"\
  http://symfony.com/dic/services\nhttp://symfony.com/dic/services/services-1.0.xsd\"\
  >\n    <services>\n        <service id=\"sign_in\" alias=\"sign_in.default\"/>\n\
  \        <service id=\"sign_in.default\" class=\"Ddd\\Auth\\Infrastructure\\Authentication\\\
  DefaultEncryption\\SignIn\">\n            <argument type=\"service\" id=\"user_repository\"\
  />\n        </service>\n        <service id=\"sign_in.md5\" class=\"Ddd\\Auth\\\
  Infrastructure\\Authentication\\Md5Encryption\\SignIn\">\n            <argument\
  \ type=\"service\" id=\"user_repository\"/>\n        </service>\n    </services>\n\
  </container>\n```\n\n### 5.4.1 关于代码复用的问题\n\n尽管上述实现清晰地定义了关注点分离，但每当我们想要实现一种新的加密机制时，都必须重复密码验证算法。\n\
  \n\n\n\n\n解决此问题的另一种方法（有助于代码复用）是将这两项职责分离出来。相反，我们可以将密码加密逻辑提取到一个专门的类中，并对所有定义的加密算法使用[策略模式²](http://en.wikipedia.org/wiki/Strategy_pattern)。这使得设计对扩展开放，而对修改关闭。\n\
  \n```php\nclass SignIn\n{\n    private $userRepository;\n    private $passwordEncryption;\n\
  \n    public function __construct(\n        UserRepository $userRepository,\n  \
  \      PasswordEncryption $passwordEncryption\n    ) {\n        $this->userRepository\
  \ = $userRepository;\n        $this->passwordEncryption = $passwordEncryption;\n\
  \    }\n\n    public function execute($aUsername, $aPassword)\n    {\n        if\
  \ (!$this->userRepository->has($aUsername)) {\n            throw new InvalidArgumentException(\n\
  \                sprintf('The user \"%s\" does not exist.', $aUsername)\n      \
  \      );\n        }\n        $aUser = $this->userRepository->byUsername($aUsername);\n\
  \        if ($this->isPasswordInvalidFor($aUser, $aPassword)) {\n            throw\
  \ new BadCredentialsException($aUser, $aPassword);\n        }\n        return $aUser;\n\
  \    }\n\n    private function isPasswordInvalidFor(User $aUser, $plainPassword)\n\
  \    {\n        return !$this->passwordEncryption->verify(\n            $plainPassword,\n\
  \            $aUser->hash()\n        );\n    }\n}\n\ninterface PasswordEncryption\n\
  {\n    /**\n     * @param string $password\n     * @param string $hash\n     * @return\
  \ boolean\n     */\n    public function verify($plainPassword, $hash);\n}\n```\n\
  \n定义不同的加密策略就像实现 `PasswordEncryption` 接口一样简单。\n\n```php\nclass BasicPasswordEncryption\
  \ implements PasswordEncryption\n{\n    public function verify($plainPassword, $hash)\n\
  \    {\n        return password_verify($plainPassword, $hash);\n    }\n}\n\nclass\
  \ Md5PasswordEncryption implements PasswordEncryption\n{\n    const SALT = 'S0m3S4lT';\n\
  \n    public function verify($plainPassword, $hash)\n    {\n        return $hash\
  \ === $this->calculateHash($plainPassword);\n    }\n\n    private function calculateHash($plainPassword)\n\
  \    {\n        return md5($plainPassword . '_' . $this->salt());\n    }\n\n   \
  \ private function salt()\n    {\n        return md5(self::SALT);\n    }\n}\n```\n\
  \n### 5.5 测试领域服务\n\n考虑到来自*多个领域服务实现* 的用户身份验证示例，能够轻松测试该服务是极有益的。然而，通常情况下测试模板方法的实现可能是复杂的，因此我们将使用一个简单的密码加密实现来进行测试目的。\n\
  \n```php\nclass PlainPasswordEncryption implements PasswordEncryption\n{\n    public\
  \ function verify($plainPassword, $hash)\n    {\n        return $plainPassword ===\
  \ $hash;\n    }\n}\n```\n\n现在我们可以测试领域服务中的所有用例了：\n\n```php\nclass SignInTest extends\
  \ PHPUnit_Framework_TestCase\n{\n    private $signIn;\n    private $userRepository;\n\
  \n    protected function setUp()\n    {\n        $this->userRepository = new InMemoryUserRepository();\n\
  \        $this->signIn = new SignIn(\n            $this->userRepository,\n     \
  \       new PlainPasswordEncryption()\n        );\n    }\n\n    /**\n     * @test\n\
  \     * @expectedException InvalidArgumentException\n     */\n    public function\
  \ itShouldComplainIfTheUserDoesNotExist()\n    {\n        $this->signIn->execute('test-username',\
  \ 'test-password');\n    }\n\n    /**\n     * @test\n     * @expectedException BadCredentialsException\n\
  \     */\n    public function itShouldTellIfTheUserIsFoundButThePasswordDoesNotMatch()\n\
  \    {\n        $this->userRepository->add(\n            new User(\n           \
  \     'test-username',\n                'test-password'\n            )\n       \
  \ );\n        $this->signIn->execute('test-username', 'no-matching-password')\n\
  \    }\n\n    /**\n     * @test\n     */\n    public function itShouldTellIfTheUserIsFoundAndMatchesTheProvidedPassword()\n\
  \    {\n        $this->userRepository->add(\n            new User(\n           \
  \     'test-username',\n                'test-password'\n            )\n       \
  \ );\n        $this->assertInstanceOf(\n            'Ddd\\\\Domain\\\\Model\\\\\
  User\\\\User',\n            $this->signIn->execute('test-username', 'test-password')\n\
  \        );\n    }\n}\n```\n\n### 5.6 贫血领域模型 vs 丰富领域模型\n\n必须小心不要在你的系统中过度使用领域服务抽象。遵循这条路径会导致实体和值对象被剥离所有行为，变成仅仅的数据容器。这与面向对象编程（OOP）的目标背道而驰，OOP\
  \ 可以被认为是将数据和行为聚集到被称为对象的语义单元中，其意图是表达现实世界的概念和问题。\n\n\n\n\n\n[`martinfowler.com/eaaCatalog/serviceLayer.html`](http://martinfowler.com/eaaCatalog/serviceLayer.html)\n\
  \n# 服务\n\n119\n\n```php\nclass ChangeOrderStatusService\n{\n    private $orderRepository;\n\
  \    public function __construct(OrderRepository $orderRepository)\n    {\n    \
  \    $this->orderRepository = $orderRepository;\n    }\n\n    public function execute($anOrderId,\
  \ $anOrderStatus)\n    {\n        // 从数据库中获取订单\n        $anOrder = $this->orderRepository->find($anOrderId);\n\
  \        // 更新订单状态\n        $anOrder->setStatus($anOrderStatus);\n        // 更新\
  \ updatedAt 字段\n        $anOrder->setUpdatedAt(new DateTimeImmutable());\n     \
  \   // 将订单保存到数据库\n        $this->orderRepository->save($anOrder);\n    }\n}\n```\n\
  \n或者在更新订单金额的情况下\n\n```php\nclass UpdateOrderAmountService\n{\n    private $orderRepository;\n\
  \n    public function __construct(OrderRepository $orderRepository)\n    {\n   \
  \     $this->orderRepository = $orderRepository;\n    }\n\n    public function execute($orderId,\
  \ $amount)\n    {\n        $anOrder = $this->orderRepository->find(1);\n       \
  \ $anOrder->setAmount($amount);\n        $anOrder->setUpdatedAt(new DateTimeImmutable());\n\
  \        $this->orderRepository->save($anOrder);\n    }\n}\n```\n\n客户端代码将大幅减少为以下意图清晰的操作：\n\
  \n``````php\n$updateOrderAmountService = new UpdateOrderAmountService(\n    $orderRepository\n\
  );\n$updateOrderAmountService->execute(1, 20.5);\n```\n\n实现这种方法可以带来很大程度的代码复用性。想要更新订单金额的人只需获取\
  \ `UpdateOrderAmountService` 的实例，并使用适当的参数调用 `execute` 方法即可。\n\n然而，选择这条路径破坏了前面讨论的面向对象设计原则，并且付出了构建领域模型的成本，却没有利用它的任何好处。\n\
  \n## 5.6.1 贫血领域模型破坏了封装\n\n如果我们重新审视在 `Service Layer`（服务层）中定义服务的代码，我们可以看到，作为一个使用 `Order`\
  \ 实体的客户端，我们被要求知道其内部表示的每一个细节。这一发现违背了面向对象编程的基本规则，即将数据与后续行为相结合。\n\n## 5.6.2 贫血领域模型带来了虚假的代码复用感\n\
  \n假设有一种情况，客户端跳过了 `UpdateOrderAmountService`，而是直接从 `OrderRepository` 获取、更新并持久化订单。如果\
  \ `UpdateOrderAmountService` 包含任何关于订单金额的其他相关业务逻辑，这些逻辑将不会被执行。这可能导致订单以不一致的状态存储。因此，不变性（invariants）应该被正确保护，而最好的方法是让真正的领域模型来处理。在本例中，`Order`\
  \ 实体是确保此点的最佳位置。\n\n服务\n\n121\n\n```php\nclass Order\n{\n    // ...\n    public function\
  \ changeAmount($amount)\n    {\n        $this->amount = $amount;\n        $this->setUpdatedAt(new\
  \ DateTimeImmutable());\n    }\n}\n```\n\n注意通过将此操作下推到实体并用“通用语言”（Ubiquitous Language）对其命名，系统实现了极大的代码复用。现在任何想更改订单金额的人都必须直接调用\
  \ `Order::changeAmount` 方法。\n\n这导致了更丰富的类，其中行为是追求的目标方向，从而实现了代码复用。这通常被称为丰富领域模型（rich\
  \ domain model）。\n\n### 5.6.3 如何避免贫血领域模型？\n\n避免陷入贫血领域模型的方法是，在启动新项目或功能时，首先考虑行为。数据库、ORM\
  \ 等只是实现细节，我们应该努力在开发过程中尽可能晚地才做出使用这些工具的决定。通过这样做，我们可以关注唯一真正重要的属性：行为。\n\n### 5.7 总结\n\
  \n正如我们看到的，在开始一个新项目时要考虑行为。服务代表了系统内部的操作。我们可以区分：\n\n*   **应用服务 (Application Services)**：协调来自外部世界的请求。它们不应包含领域逻辑。事务在应用层处理，封装事务。\n\
  *   **领域服务 (Domain Services)**：仅操作领域概念，通过“通用语言”表示。推迟实现细节会导致贫血模型和糟糕的面向对象设计。\n*  \
  \ **基础设施服务 (Infrastructure Services)**：处理如发送邮件等基础设施。\n\n## 6. 领域事件\n\n领域事件是一个或多个组件关心的领域变化。\
  \ 开发者通常不习惯处理事件。领域事件在语言中并不常见。然而，可以看到框架和库利用它们来提供新的解耦、复用和加速。领域事件是领域变化的事件。\n\n### 6.1\
  \ 引言\n\n想象一个 JavaScript 2D 平台游戏。屏幕上有许多不同的组件。有一个组件显示剩余生命，另一个显示得分，还有一个倒计时剩余时间。每当玩家跳到敌人身上得分增加。当得分超过某个数字时，你会获得额外的生命。当玩家碰撞钥匙时，获取钥匙并可能打开门。这些组件是如何交互的？这种场景的最佳架构是什么？\n\
  \n可能有两种方案：第一种是让每个组件与其连接的组件耦合。在示例中，玩家组件将与许多组件耦合。记得开闭原则吗？添加新组件不应该修改第一个组件的代码。如果组件太多会怎样？容易维护吗？完全不是。\n\
  \n第二种是将所有组件连接到一个单一对象，该对象接收每个组件的事件并将其转发给特定的组件。例如，得分组件会对 `Enemyilled` 事件感兴趣，或者 `LifeCaptured`\
  \ 事件对玩家实体和剩余生命组件非常有用。通过这种方式，所有组件都耦合到一个管理通知的单一组件上。通过这种方法，添加新组件或删除现有组件不会影响剩余组件。\n\n\
  在开发单个应用时，事件对于解耦组件非常有帮助。在分布式开发整个领域时，事件对于解耦每个服务或应用程序非常有用。关键点是相同的，但规模不同。\n\n¹[`en.wikipedia.org/wiki/Open/closed_principle`](http://en.wikipedia.org/wiki/Open/closed_principle)\n\
  \n122\n\n领域事件\n\n123\n\n### 6.2 定义\n\n领域事件是一种特定的事件，用于通知本地或远程边界上下文（Bounded Contexts）领域的变化。\n\
  \nVaughn Vernon 定义](http://www.amazon.com/Implementing-Domain-Driven-Design-Vaughn-Vernon-ebook/dp/B00BCLEBN8)²\
  \ 领域事件为领域内发生事件捕获。\n\nEric Evans 定义](https://domainlanguage.com/ddd/patterns/DDD_Reference_2011-01-31.pdf)³\
  \ 领域事件为\n\n\n\n\n领域模型的一个完整组成部分，是对领域内发生某些事件的表示。在忽略无关领域活动的同时，显式地表示领域专家想要跟踪或接收通知的事件，或者与其他模型对象的状态变更相关的事件。\n\
  \nMartin Fowler [定义⁴](http://martinfowler.com/eaaDev/DomainEvent.html) 将领域事件（Domain\
  \ Event）定义为捕捉影响影响的某些有趣事件的记忆。\n\nWeb 应用中的领域事件示例有 `UserRegistered`、`OrderPlaced`、`UserRelocated`\
  \ 或 `ProductAdded`。\n\n### 6.2.1 短故事\n\n在一个票务代理机构，一名内容经理决定增加 U2 演唱会的价格。她通过后台系统编辑了该演出。一个\
  \ `ShowPriceChanged` 领域事件被发布，并与新的演出价格在同一个事务中持久化到数据库中。\n\n一个批处理获取该领域事件并将其放入 `RabbitMQ`。该领域事件被分发到两个队列中：一个用于本地相同的边界上下文（Bounded\
  \ Context），另一个用于业务智能目的的远程队列。\n\n在第一个队列中，工作线程使用事件中的 `id` 获取对应的 `Show` 并将其推送到 `Elasticsearch`\
  \ 服务器中，以便用户在搜索时能看到新价格。它也可以更新另一个数据库表中的新价格。\n\n在第二个队列中，工作线程将信息插入到 `Logs Server` 或\
  \ `Data Lake` 中，可以在那里运行报告或数据挖掘过程。\n\n²[`www.amazon.com/Implementing-Domain-Driven-Design-Vaughn-Vernon-ebook/dp/B00BCLEBN8`](http://www.amazon.com/Implementing-Domain-Driven-Design-Vaughn-Vernon-ebook/dp/B00BCLEBN8)\n\
  \n³[`domainlanguage.com/ddd/patterns/DDD_Reference_2011-01-31.pdf`](https://domainlanguage.com/ddd/patterns/DDD_Reference_2011-01-31.pdf)\n\
  \n⁴[`martinfowler.com/eaaDev/DomainEvent.html`](http://martinfowler.com/eaaDev/DomainEvent.html)\n\
  \n![](img/index-142_1.png)\n\n领域事件\n124\n\n无法使用领域事件集成的外部应用程序，可以通过本地边界上下文提供的 REST\
  \ API 访问所有的 `ShowPriceChanged` 事件。\n\n如你所见，领域事件对于处理最终一致性和集成不同的边界上下文非常有用。聚合根（Aggregates）创建事件并发布它们。订阅者可以存储事件然后将其转发给远程订阅者。\n\
  \n### 6.2.2 比喻\n\n我周二去 Babur’s 吃饭，并用信用卡支付。这可以被建模为一个事件，其事件类型为 `PurchasePlaced`，主体是我的信用卡，发生日期是周二。如果\
  \ Babur’s 使用的是旧的人工系统，并且直到周五才传输交易记录，那么记录日期就是周五。\n\n事情总会发生。并非所有事情都是有趣的，有些可能值得记录但不会引起反应。最有趣的事件会引起反应。许多系统需要对有趣的事件做出反应。通常，你需要知道系统为什么以那种方式做出反应。\n\
  \n通过将输入系统的输入汇聚成领域事件流，你可以保留对系统所有输入的记录。这有助于你组织处理逻辑，并允许你对系统的输入保留一份审计日志。\n\n**练习题**\n\
  \n尝试在你当前的领域中寻找潜在领域事件的示例。\n\n### 6.2.3 真实案例(tm)\n\n在深入讨论领域事件的细节之前，让我们来看一个使用领域事件的真实示例，以及它们如何帮助我们的应用程序和整个领域。\n\
  \n考虑一个用于注册新用户的简单应用程序服务（Application Service）。例如在电子商务背景下。应用程序服务将在自己的章节中解释，所以不要过于担心它的接口，只需关注\
  \ `execute` 方法。\n\n领域事件\n125\n\n```php\nclass SignInUserService implements ApplicationService\n\
  {\n    private $userRepository;\n    private $userFactory;\n    private $userTransformer;\n\
  \n    public function __construct(\n        UserRepository $userRepository,\n  \
  \      UserFactory $userFactory,\n        UserTransformer $userTransformer\n   \
  \ )\n    {\n        $this->userRepository = $userRepository;\n        $this->userFactory\
  \ = $userFactory;\n        $this->userTransformer = $userTransformer;\n    }\n\n\
  \    /**\n     * @param SignInRequest $request\n     * @return void\n     * @throws\
  \ UserExistsException\n     */\n    public function execute(SignInRequest $request\
  \ = null)\n    {\n        $email = $request->email();\n        $password = $request->password();\n\
  \        $user = $this->userRepository->user($email);\n\n        if (null !== $user)\
  \ {\n            throw new UserExistsException();\n        }\n\n        $user =\
  \ $this->userFactory->build($email, $password);\n        $this->userRepository->add($user);\n\
  \        $this->userTransformer->write($user);\n    }\n}\n```\n\n领域事件\n126\n\n所示，`ApplicationService`\
  \ 检查用户是否存在。如果不存在，它会创建一个新的 `User` 并将其添加到 `UserRepository` 中。现在考虑一个新需求：必须通过电子邮件通知新用户。不用想太多，首先想到的种方法是更新\
  \ `ApplicationService` 以包含一些完成工作的代码。然而，让我们考虑另一种方法。触发一个 `UserRegistered` 事件如何？让其他组件监听该事件并发送邮件如何？这种方法有很多很酷的处。首先，每当执行新操作时，我们需要更新\
  \ `ApplicationService`。其次，它更容易测试。\n\n在同一个电子商务项目中，我们被要求集成一个不是用 PHP 编写的开源游戏化平台。每当用户在我们的边界上下下单或评价产品时，她可以获得显示在电子商务用户主页上的勋章。我们该如何建模这个问题？\n\
  \n遵循第一种方法，我们将更新 `ApplicationService` 以集成具有类似确认邮件功能的平台。使用 `DomainEvent` 方法，我们将为 `UserRegistered`\
  \ 事件创建另一个监听器，通过 REST 或 SOA 直接连接到游戏化平台，或者更好，通过某些消息系统（如 `RabbitMQ`）传播它，这样事件就可以被游戏化平台接收并做出相应反应，而我们的电子商务边界无需感知新的游戏化边界。\n\
  \n### 6.3 特征\n\n### 6.3.1 命名规范\n\n所有事件都应该用过去时动词表示，例如 `CustomerRelocated`、`Cargo-Shipped`\
  \ 或 `InventoryLossageRecorded`。它们是过去已经完成的事情。在英语中，有很多有趣的例子，人们倾向于使用名词而不是动词。\n\n\n\n\
  过去时动词，一个例子是“地震”（Earthquake）或“倾覆”（Capsize），正如最近一位议员对关亚的担忧那样。我们建议避免使用此类名称来命名领域事件（Domain\
  \ Events），而是坚持使用过去时动词。名词倾向于与后文在《精简对象建模》（Streamlined Object Modeling）中讨论的“事务对象”（Transaction\
  \ Objects）匹配。将事件建模为过去时动词是至关重要的，因为它们是通用语言（Ubiquitous Language）的一部分。\n\n### 6.3.2\
  \ 领域事件与通用语言\n\n考虑我们在讨论迁移客户所产生的副作用时，通用语言中的差异：事件使该概念变得显式化，而之前发生在聚合根（Aggregate）内部或多个聚合根之间的变化被视为一个隐式概念，需要去探索和定义。例如，在大多数系统中，副作用发生的这一事实仅仅是通过通如\
  \ `Hibernate` 或 `Entity Framework` 等工具发现的，如果用例的副作用发生了变化，它就是一个隐式概念。引入事件使得该概念变得显式化并成为通用语言的一部分；迁移客户不仅仅是改变某些东西，迁移客户会产生一个在语言中被明确定义的\
  \ `CustomerRelocatedEvent`（客户迁移事件）。\n\n### 6.3.3 不变性\n\n领域事件描述了领域中已经发生的变化。它们谈论的是过去。根据定义，改变过去是不可能的，除非你是\
  \ `Marty McFly` 且拥有一辆 `Delorean` 时空车，但事实可能并非如此。领域事件是不可变的，仅此而已。\n\n#### Symfony 事件调度器\n\
  \n某些 PHP 框架支持事件。然而，不要将这些事件与领域事件混淆。它们在特征和目标上是不同的。例如，Symfony 拥有 `Event Dispatcher`\
  \ 组件。如果你需要为状态机实现一个事件系统（例如），你可以依赖它。整个从请求到响应的 Symfony 生命周期也是基于事件的。然而，Symfony 事件是可变的，每个监听器（Listener）都能够修改事件以向其中添加或更新信息。\n\
  \n### 6.4 建模事件\n\n在建模事件时，请根据其所属的边界上下文（Bounded Context）中的通用语言来命名事件及其属性。如果一个事件是在 `Aggregate`\
  \ 上执行命令操作的结果，那么该的名称通常源自执行的命令。事件名称反映了事件发生的过去性质，这一点非常重要。它现在没有发生。它是之前发生的。选择最好的名称是反映这一事实的名称。\n\
  \n让我们考虑我们的用户注册功能，`DomainEvent` 需要代表这一事实。以下代码显示了基础 `DomainEvent` 的最小接口。\n\n```php\n\
  interface DomainEvent\n{\n    /**\n     * @return \\DateTime\n     */\n    public\
  \ function occurredOn();\n}\n```\n\n如所示，所需的最小信息是一个 `DateTime`，以便知道事件发生的时间。\n\n现在让我们建模新的用户注册事件。以下代码可以用于建模一个表示“应用程序中已注册新用户”这一事实的事件。如前所述，名称应该是过去时动词，因此\
  \ `UserRegistered`（用户注册）可能是一个不错的选择。\n\n```php\nclass UserRegistered implements DomainEvent\n\
  {\n    private $userId;\n\n    public function __construct(UserId $userId)\n   \
  \ {\n        $this->userId = $userId;\n        $this->occurredOn = new \\DateTime();\n\
  \    }\n\n    public function userId()\n    {\n        return $this->userId;\n \
  \   }\n\n    public function occurredOn()\n    {\n        return $this->occurredOn;\n\
  \    }\n}\n```\n\n通知新用户的最少信息可能是她的 `UserId`。有了这些信息，来自同一或不同边界上下文的任何进程、命令或应用程序服务都可以对此事件采取行动。\n\
  \n经验法则如下：\n- `DomainEvents` 通常被设计为不可变的\n- 构造函数将初始化 `DomainEvent` 的完整状态\n- `DomainEvents`\
  \ 将具有用于访问其属性的 getter 方法\n- 包含执行操作的 `Aggregate` 标识\n- 包含与第一个聚合根相关的其他聚合标识\n- 如果有用，包含导致事件发生的参数\n\
  \n但是，如果来自同一或不同边界上下文的领域专家需要更多信息怎么办？让我们看看带有更多信息的同一个领域事件建模，例如电子邮件地址。\n\n```php\nclass\
  \ UserRegistered implements DomainEvent\n{\n    private $userId;\n    private $userEmail;\n\
  \n    public function __construct(UserId $userId, $userEmail)\n    {\n        $this->userId\
  \ = $userId;\n        $this->userEmail = $userEmail;\n        $this->occurredOn\
  \ = new \\DateTime();\n    }\n\n    public function userId()\n    {\n        return\
  \ $this->userId;\n    }\n\n    public function userEmail()\n    {\n        return\
  \ $this->userEmail;\n    }\n\n    public function occurredOn()\n    {\n        return\
  \ $this->occurredOn;\n    }\n}\n```\n\n我们添加了电子邮件。向 `DomainEvent` 中添加更多信息可以帮助提高性能或简化不同边界上下文之间的集成。从其他边界上下文的角度进行思考有助于建模事件。当上游边界上下文创建创建一个新用户时，下游边界上下文必须创建它自己的用户。添加用户邮箱可能节省一次向上游边界上下文的同步请求。让我们来看一个例子。\n\
  \n你还记得那个游戏化的例子吗？为了创建游戏化平台的用户（可能称为 `Player` 用户），来自电子商务边界上下文的 `UserId` 可能就足够了。但是，如果游戏化平台需要通过电子邮件通知用户奖励怎么办？在这种情况下，电子邮件地址也是强制性的。因此，如果原始领域事件中包含了电子邮件地址，我们就完成了。如果情况并非如此，游戏化边界上下文需要通过\
  \ REST 从另一个请求此类信息。\n\n#### 为什么不包含整个用户实体？\n\n我是否应该在领域事件中包含来自边界上下文的整个 `User Entity`？我们的建议是：不要。领域事件用于边界上下文自身与其他边界上下文之间的通信。这意味着，在\
  \ C2C 电子商务目录边界上下文中的 `Seller`（卖家），可以是产品反馈边界上下产品评论的 `Author`（作者）。两者可以共享相同的 ID 或邮箱，但\
  \ `Seller` 和 `Author` 是来自不同边界上下文的不同概念实体。因此，一个边界上下文的实体在其他地方没有意义，或者具有完全不同的意义。\n\n\
  ### 6.5 持久化领域事件\n\n持久化事件总是好主意。某些读者可能想为什么不直接将领域事件发布到消息或日志系统，但持久化它们有许多益处：\n- 你可以通过\
  \ REST 方式为其他边界上下文暴露领域事件\n- 你可以在推送到 RabbitMQ 之前，将领域事件和聚合更改放在同一个数据库事务中（你不想通知未发生的事情，也不不想错过已发生事情的通知）\n\
  - 商业智能可以使用这些数据进行分析、预测或趋势分析\n- 审计你的实体变化\n- 对于事件溯源（Event Sourcing），你可以从领域事件重构聚合根\n\
  \n#### 6.5.1 事件存储\n\n我们在哪里持久化领域事件？在 `Event Store`（事件存储）中。`Event Store` 是一个位于领域空间中以抽象（接口或抽象类）存在的领域事件仓库，它的职责是追加领域事件并查询它们。一个可能的基础接口如下：\n\
  \n```php\ninterface EventStore\n{\n    public function append(DomainEvent $aDomainEvent);\n\
  \    public function allStoredEventsSince($anEventId);\n}\n```\n\n\n\n然而，取决于你对 `DomainEvents`\
  \ 的用法，之前的接口可以拥有更多方法来查询你的事件。\n\n在实现方面，你可以决定使用 Doctrine 存储库、DBAL 库或普通的 PDO。由于 `DomainEvents`\
  \ 是不可变的，使用 Doctrine 会增加一个不必要的性能开销。对于中小型应用程序，使用 Doctrine 可能是可以的。让我们看看使用 Doctrine\
  \ 的一种可能实现。\n\n```php\nclass DoctrineEventStore extends EntityRepository implements\
  \ EventStore\n{\n    private $serializer;\n\n    public function append(DomainEvent\
  \ $aDomainEvent)\n    {\n        $storedEvent = new StoredEvent(\n            get_class($aDomainEvent),\n\
  \            $aDomainEvent->occurredOn(),\n            $this->serializer()->serialize($aDomainEvent,\
  \ 'json')\n        );\n        $this->getEntityManager()->persist($storedEvent);\n\
  \    }\n\n    public function allStoredEventsSince($anEventId)\n    {\n        $query\
  \ = $this->createQueryBuilder('e');\n        if ($anEventId) {\n            $query->where('e.eventId\
  \ > :eventId');\n            $query->setParameters(array('eventId' => $anEventId));\n\
  \        }\n        $query->orderBy('e.eventId');\n        return $query->getQuery()->getResult();\n\
  \    }\n\n    private function serializer()\n    {\n        if (null === $this->serializer)\
  \ {\n            /* JMSSerializer\\Serializer\\SerializerBuilder */\n          \
  \  $this->serializer = SerializerBuilder::create()->build();\n        }\n      \
  \  return $this->serializer;\n    }\n}\n```\n\n`StoredEvent` 是映射到数据库所需的 Doctrine\
  \ Entity。如你所见，在添加和持久化 Store 之后没有调用 `flush`。如果此操作是在 Doctrine 事务内部进行的，则不需要。因此，我们先不写该调用，在讨论应用服务（Application\
  \ Services）时再详细说明。让我们来看看 `StoredEvent` 的实现。\n\n```php\nclass StoredEvent implements\
  \ DomainEvent\n{\n    private $eventId;\n    private $eventBody;\n    private $occurredOn;\n\
  \    private $typeName;\n\n    /**\n     * @param string $aTypeName\n     * @param\
  \ \\DateTime $anOccurredOn\n     * @param string $anEventBody\n     */\n    public\
  \ function __construct($aTypeName, \\DateTime $anOccurredOn, $anEventBody)\n   \
  \ {\n        $this->eventBody = $anEventBody;\n        $this->typeName = $aTypeName;\n\
  \        $this->occurredOn = $anOccurredOn;\n    }\n\n    public function eventBody()\n\
  \    {\n        return $this->eventBody;\n    }\n\n    public function eventId()\n\
  \    {\n        return $this->eventId;\n    }\n\n    public function typeName()\n\
  \    {\n        return $this->typeName;\n    }\n\n    public function occurredOn()\n\
  \    {\n        return $this->occurredOn;\n    }\n}\n```\n\n以及它的映射。\n`Ddd\\Domain\\\
  Event\\StoredEvent`:\n\n```yaml\ntype: entity\ntable: event\nrepositoryClass: Ddd\\\
  Infrastructure\\Application\\Notification\\DoctrineEventStore\nid:\neventId:\n \
  \ type: integer\n  column: event_id\n  generator:\n    strategy: AUTO\nfields:\n\
  \  eventBody:\n    column: event_body\n    type: text\n  typeName:\n    column:\
  \ type_name\n    type: string\n    length: 255\n  occurredOn:\n    column: occurred_on\n\
  \    type: datetime\n```\n\n由于每个 `DomainEvent` 可能有不同的字段，我们需要将它们序列化后持久化。`typeName`\
  \ 在整个领域范围内标识 `DomainEvent`。实体（Entity）或值对象（Value Object）在边界上下文（BC）内部是有意义的，但 `DomainEvents`\
  \ 定义了 BC 之间的通信协议。\n\n在分布式系统中，这种情况会发生。你必须处理未发布、在链中某处丢失或发布了多次的 `DomainEvents`。这就是为什么带有\
  \ `id` 持久化 `DomainEvent` 非常重要，这样很容易追踪哪些 `DomainEvents` 已经发布，哪些是缺失的。\n\n## 6.6 从领域模型发布事件\n\
  \n当领域事件代表的事实发生时，就应该发布 `DomainEvents`。例如，当一个新用户注册时，应该发布一个新的 `UserRegistered` 事件。\n\
  \n遵循报纸的比喻：\n- **建模（Modeling）** 领域事件就像写一篇新闻稿\n- **发布（Publishing）** 领域事件就像在报纸上印刷文章\n\
  - **传播（Spreading）** 领域事件就像发送报纸，让每个人都能阅读文章\n\n发布 `DomainEvents` 的推荐方法是使用简单的监听器-观察者模式（Listener-Observer\
  \ pattern）来实现 `DomainEventPublisher`。\n\n### 6.6.1 从实体发布领域事件\n\n继续应用程序中注册了新用户的示例，让我们看看对应的领域事件如何发布。\n\
  \n```php\nclass User\n{\n    protected $userId;\n    protected $email;\n    protected\
  \ $password;\n\n    public function __construct(UserId $userId, $email, $password)\n\
  \    {\n        $this->setUserId($userId);\n        $this->setEmail($email);\n \
  \       $this->setPassword($password);\n        DomainEventPublisher::instance()->publish(\n\
  \            new UserRegistered(\n                $this->userId\n            )\n\
  \        );\n    }\n    //...\n}\n```\n\n如示例所示，当创建 `User` 时，会发布一个 `UserRegistered`\
  \ 事件。通常情况下，使用像这里的自封装，在从我们的持久化引擎中获取由于领域规则变化而失效的无效对象时要小心。另一种完全不使用父类构造函数的方法可能是：\n\n\
  ```php\nclass CustomOrmUser extends User\n{\n    public function __construct()\n\
  \    {\n    }\n\n    public static function fromRawData($data)\n    {\n        $user\
  \ = new self();\n        $user->userId = new UserId($data['user_id']);\n       \
  \ $user->email = $data['email'];\n        $user->password = $data['password'];\n\
  \        return $user;\n    }\n}\n```\n\n使用这种方法并使用像这里的自封装，在从我们的持久化引擎中获取由于领域规则变化而失效的无效对象时要小心。另一种完全不使用父类构造函数的方法可能是：\n\
  \n## 6.6.2 从领域或应用发布你的领域事件\n\n**服务（Services）**\n\n\n\n你应该努力在链条中更深层的地方发布领域事件（Domain\
  \ Events）。越靠近实体（Entity）或值对象（Value Object）越好。正如我们在上一节看到的，有时这并不容易，但最终结果对客户端来说会更简单。我们见过开发者从应用服务（Application\
  \ Services）或领域服务（Domain Services）发布领域事件。这看起来是一个更容易实现的方法，但与将业务逻辑推向领域服务而不是将其放入实体中一样，会导致贫血领域模型（Anemic-Domain\
  \ Model）。\n\n### 6.6.3 DomainEventPublisher 如何工作\n\n`DomainEventPublisher` 是我们的边界上下文（Bounded\
  \ Context）中可用的单例类，用于发布领域事件。它还支持附加监听器 `DomainEventSubscriber`，这些监听器将监听它们感兴趣的任何 `DomainEvent`。这与使用\
  \ jQuery 的 `on` 方法订阅事件没有区别。\n\n⁶[`packagist.org/packages/ocramius/proxy-manager`](https://packagist.org/packages/ocramius/proxy-manager)\n\
  \n领域事件\n138\n\n```php\nclass DomainEventPublisher\n{\n    private $subscribers;\n\
  \    private static $instance = null;\n\n    public static function instance()\n\
  \    {\n        if (null === static::$instance) {\n            static::$instance\
  \ = new static();\n        }\n        return static::$instance;\n    }\n\n    private\
  \ function __construct()\n    {\n        $this->subscribers = [];\n    }\n\n   \
  \ public function __clone()\n    {\n        throw new BadMethodCallException('Clone\
  \ is not supported');\n    }\n\n    public function subscribe(DomainEventSubscriber\
  \ $aDomainEventSubscriber)\n    {\n        $this->subscribers[] = $aDomainEventSubscriber;\n\
  \    }\n\n    public function publish(DomainEvent $anEvent)\n    {\n        foreach\
  \ ($this->subscribers as $aSubscriber) {\n            if ($aSubscriber->isSubscribedTo($anEvent))\
  \ {\n                $aSubscriber->handle($anEvent);\n            }\n        }\n\
  \    }\n}\n```\n\n`publish` 方法遍历所有可能的订阅者，检查它们是否对发布的领域事件感兴趣。如果是的话，则调用订阅者的 `handle`\
  \ 方法。\n\n`subscribe` 方法添加一个新的 `DomainEventSubscriber`，该对象将监听特定的领域事件类型。\n\n领域事件\n\
  139\n\n```php\ninterface DomainEventSubscriber\n{\n    /**\n     * @param DomainEvent\
  \ $aDomainEvent\n     */\n    public function handle($aDomainEvent);\n\n    /**\n\
  \     * @param DomainEvent $aDomainEvent\n     * @return bool\n     */\n    public\
  \ function isSubscribedTo($aDomainEvent);\n}\n```\n\n正如我们已经讨论过的，持久化所有的领域事件是一个好主意。我们如何轻松地持久化应用中发布的所有领域事件？使用一个特定的订阅来实现。让我们创建一个\
  \ `DomainEventSubscriber`，它将监听所有类型的领域事件，并使用我们的 `EventStore` 将它们持久化。\n\n```php\n\
  class PersistDomainEventSubscriber implements DomainEventSubscriber\n{\n    private\
  \ $eventStore;\n\n    public function __construct(EventStore $anEventStore)\n  \
  \  {\n        $this->eventStore = $anEventStore;\n    }\n\n    public function handle($aDomainEvent)\n\
  \    {\n        $this->eventStore->append($aDomainEvent);\n    }\n\n    public function\
  \ isSubscribedTo($aDomainEvent)\n    {\n        return true;\n    }\n}\n```\n\n\
  `eventStore` 可以是一个自定义的 Doctrine 仓库（如之前所示），或者任何其他能够将领域事件持久化到数据库的对象。\n\n领域事件\n140\n\
  \n### 6.6.4 设置 DomainEventListeners\n\n设置 `DomainEventPublisher` 订阅者的最佳位置在哪里？这取决于具体情况。对于影响所有请求的全局订阅者，可能是在构建你的\
  \ `DomainEventPublisher` 时。如果某些订阅者只影响特定的应用服务，则在构建应用服务时。让我们来看一个使用 Silex 的示例。\n\n\
  在 [Silex](http://silex.sensiolabs.org/)⁷, 中，注册持久化所有领域事件的领域事件发布者的最佳方法是使用[应用中间件](http://silex.sensiolabs.org/doc/middlewares.html)⁸.。一个*应用前中间件（before\
  \ application middleware）允许你在执行执行器之前调整 `Request`。这是订阅负责将这些事件持久化到数据库（稍后将发送到 RabbitMQ）的监听器的正确位置。\n\
  \n```php\n// ...\n\n$app['em'] = $app->share(function() {\n    return (new EntityManagerFactory())->build();\n\
  });\n\n$app['event_repository'] = $app->share(function($app) {\n    return $app['em']->getRepository('Ddd\\\
  \\Domain\\\\Model\\\\Event\\\\StoredEvent');\n});\n\n$app['event_publisher'] = $app->share(function($app)\
  \ {\n    return DomainEventPublisher::instance();\n});\n\n$app->before(function\
  \ (Symfony\\Component\\HttpFoundation\\Request $request) use ($app) {\n    $app['event_publisher']->subscribe(\n\
  \        new PersistDomainEventSubscriber(\n            $app['event_repository']\n\
  \        )\n    );\n});\n```\n\n通过这种设置，每个聚合根（Aggregate）发布 `DomainEvent` 时，它都会被持久化到数据库中。任务完成。\n\
  \n### 6.6.5 测试\n\n你已经知道如何发布领域事件，但我们如何通过单元测试这种发布行为的发生呢？我们如何真正测试 `UserRegistered`\
  \ 是否真的触发了？我们建议的简单方法 ⁷[`silex.sensiolabs.org/`](http://silex.sensiolabs.org/) ⁸[`silex.sensiolabs.org/doc/middlewares.html`](http://silex.sensiolabs.org/doc/middlewares.html)\
  \ 领域事件 141 是使用一个特定的 `EventListener`，它将充当[间谍⁹](http://www.martinfowler.com/bliki/TestDouble.html)\
  \ 来记录领域事件是否发布。让我们来看一个 User 实体的单元测试示例。\n\n```php\nuse Ddd\\Domain\\DomainEventPublisher;\n\
  use Ddd\\Domain\\DomainEventSubscriber;\nclass UserTest extends \\PHPUnit_Framework_TestCase\n\
  {\n    //...\n\n    /**\n     * @test\n     */\n    public function itShouldPublishUserRegistered()\n\
  \    {\n        $subscriber = new SpySubscriber();\n        $id = DomainEventPublisher::instance()->subscribe($subscriber);\n\
  \        $userId = new UserId();\n        new User($userId, 'valid@email.com', 'password');\n\
  \        DomainEventPublisher::instance()->unsubscribe($id);\n        $this->assertUserRegisteredPublished($subscriber,\
  \ $userId);\n    }\n\n    private function assertUserRegisteredPublished($subscriber,\
  \ $userId)\n    {\n        $this->assertInstanceOf('UserRegistered', $subscriber->domainEvent);\n\
  \        $this->assertTrue($subscriber->domainEvent->userId()->equals($userId));\n\
  \    }\n}\n\nclass SpySubscriber implements DomainEventSubscriber\n{\n    public\
  \ $domainEvent;\n\n    public function handle($aDomainEvent)\n    {\n        $this->domainEvent\
  \ = $aDomainEvent;\n    }\n\n领域事件\n142\n\n    public function isSubscribedTo($aDomainEvent)\n\
  \    {\n        return true;\n    }\n}\n```\n\n还有一些替代方案。你可以为 `DomainEventPublisher`\
  \ 使用静态设置器，或者使用某些反射框架来检测调用。然而，我们认为这种方法更自然。最后但同样重要的是，记得清理间谍订阅，以免它影响剩余的单元测试。\n\n###\
  \ 6.7 向远程边界上下文传播消息\n\n为了向本地或远程边界上下文通信一组领域事件，有两种主要的非互斥策略：消息传递（Messaging）和 REST API。第一种策略计划使用消息系统（如\
  \ RabbitMQ）来传输它们。第二种策略计划创建一个 REST API 来访问特定边界上下文的领域事件。\n\n### 6.7.1 消息传递\n\n当所有领域事件持久化到数据库后，剩下的唯一传播工作是将它们推送到我们喜爱的消息系统。我们个人喜欢\
  \ [RabbitMQ¹⁰](https://www.rabbitmq.com),，但任何其他如 ActiveMQ 或 ZeroMQ 都能胜任。对于使用 PHP\
  \ 集成 RabbitMQ，选项并不多，[php-amqplib¹¹](https://packagist.org/packages/videlalvaro/php-amqplib)\
  \ 可以。\n\n首先，我们需要一个能够将持久化的领域事件发送到 RabbitMQ 的服务。这可以是\n\n\n\n\n\n很简单，通过 `EventStore`\
  \ 查询所有事件并发送每一个事件如何？这听起来不坏，但是，我们可能会多次推送同一个 `DomainEvent`。通常情况下，**我们需要尽力减少重新发布的 `DomainEvents`\
  \ 的次数**。如果次数为零，那就更好。为了实现这一点，我们需要某种组件来跟踪哪些 `DomainEvents` 已经推送，哪些是剩余的。\n\n最后但同样重要的一是，一旦我们知道必须推送哪些\
  \ `DomainEvents`，我们就发送它们，并跟踪发布到我们消息系统中的最后一个。让我们来看看该服务的一种可能实现：\n\n¹⁰[`www.rabbitmq.com`](https://www.rabbitmq.com)\n\
  \n¹¹[`packagist.org/packages/videlalvaro/php-amqplib`](https://packagist.org/packages/videlalvaro/php-amqplib)\n\
  \n# 领域事件\n\n143\n\n```php\nclass NotificationService\n{\n    private $serializer;\n\
  \    private $eventStore;\n    private $publishedMessageTracker;\n    private $messageProducer;\n\
  \n    public function __construct(\n        EventStore $anEventStore,\n        PublishedMessageTracker\
  \ $aPublishedMessageTracker,\n        MessageProducer $aMessageProducer\n    ) {\n\
  \        $this->eventStore = $anEventStore;\n        $this->publishedMessageTracker\
  \ = $aPublishedMessageTracker;\n        $this->messageProducer = $aMessageProducer;\n\
  \    }\n\n    /**\n     * @return int\n     */\n    public function publishNotifications($exchangeName)\n\
  \    {\n        $publishedMessageTracker = $this->publishedMessageTracker();\n \
  \       $notifications = $this->listUnpublishedNotifications(\n            $publishedMessageTracker->mostRecentPublishedMessageId($exchangeName)\n\
  \        );\n\n        if (!$notifications) {\n            return 0;\n        }\n\
  \n        $messageProducer = $this->messageProducer();\n        $messageProducer->open($exchangeName);\n\
  \n        try {\n            $publishedMessages = 0;\n            $lastPublishedNotification\
  \ = null;\n            foreach ($notifications as $notification) {\n           \
  \     $lastPublishedNotification = $this->publish(\n                    $exchangeName,\n\
  \                    $notification,\n                    $messageProducer\n    \
  \            );\n                $publishedMessages++;\n            }\n        }\
  \ catch (\\Exception $e) {\n            // Log your error (trigger_error, Monolog,\
  \ etc.)\n        }\n\n        $this->trackMostRecentPublishedMessage(\n        \
  \    $publishedMessageTracker,\n            $exchangeName,\n            $lastPublishedNotification\n\
  \        );\n        $messageProducer->close($exchangeName);\n\n        return $publishedMessages;\n\
  \    }\n\n    protected function publishedMessageTracker()\n    {\n        return\
  \ $this->publishedMessageTracker;\n    }\n\n    /**\n     * @return StoredEvent[]\n\
  \     */\n    private function listUnpublishedNotifications($mostRecentPublishedMessageId)\n\
  \    {\n        return $this->eventStore()\n            ->allStoredEventsSince($mostRecentPublishedMessageId);\n\
  \    }\n\n    protected function eventStore()\n    {\n        return $this->eventStore;\n\
  \    }\n\n    private function messageProducer()\n    {\n        return $this->messageProducer;\n\
  \    }\n\n    private function publish(\n        $exchangeName,\n        StoredEvent\
  \ $notification,\n        MessageProducer $messageProducer\n    ) {\n        $messageProducer->send(\n\
  \            $exchangeName,\n            $this->serializer()->serialize($notification,\
  \ 'json'),\n            $notification->typeName(),\n            $notification->eventId(),\n\
  \            $notification->occurredOn()\n        );\n        return $notification;\n\
  \    }\n\n    private function serializer()\n    {\n        if (null === $this->serializer)\
  \ {\n            $this->serializer = SerializerBuilder::create()->build();\n   \
  \     }\n        return $this->serializer;\n    }\n\n    private function trackMostRecentPublishedMessage(\n\
  \        PublishedMessageTracker $publishedMessageTracker,\n        $exchangeName,\n\
  \        $notification\n    ) {\n        $publishedMessageTracker->trackMostRecentPublishedMessage(\n\
  \            $exchangeName,\n            $notification\n        );\n    }\n}\n```\n\
  \n`NotificationService` 依赖于三个接口。我们已经见过 `EventStore`，它负责追加和查询 `DomainEvents`。第二个是\
  \ `PublishedMessageTracker`，负责跟踪已推送的消息。第三个是 `MessageProducer`，一个代表我们消息系统的接口。\n\n\
  领域事件\n\n146\n\n```php\ninterface PublishedMessageTracker\n{\n    /**\n     * @param\
  \ string $exchangeName\n     * @return int\n     */\n    public function mostRecentPublishedMessageId($exchangeName);\n\
  \n    /**\n     * @param string $exchangeName\n     * @param StoredEvent $notification\n\
  \     */\n    public function trackMostRecentPublishedMessage($exchangeName, $notification);\n\
  }\n```\n\n`mostRecentPublishedMessageId` 返回最后一条消息的 id，`trackMostRecentPublishedMessage`\
  \ 负责跟踪发送的内容。\n\n```php\nclass DoctrinePublishedMessageTracker extends EntityRepository\
  \ implements PublishedMessageTracker\n{\n    /**\n     * @param string $exchangeName\n\
  \     * @return int\n     */\n    public function mostRecentPublishedMessageId($exchangeName)\n\
  \    {\n        $messageTracked = $this->findOneByName($exchangeName);\n       \
  \ if (!$messageTracked) {\n            return null;\n        }\n        return $messageTracked->id();\n\
  \    }\n\n    /**\n     * @param string $exchangeName\n     * @param StoredEvent\
  \ $notification\n     */\n    public function trackMostRecentPublishedMessage($exchangeName,\
  \ $notification)\n    {\n        if (!$notification) {\n            return;\n  \
  \      }\n        $maxId = $notification->eventId();\n        $publishedMessage\
  \ = $this->findOneByName($exchangeName);\n        if (null === $publishedMessage)\
  \ {\n            $publishedMessage = new PublishedMessage(\n                $exchangeName,\n\
  \                $maxId\n            );\n        }\n        $publishedMessage->updateMostRecentMessageId($maxId);\n\
  \        $this->getEntityManager()->persist($publishedMessage);\n        $this->getEntityManager()->flush();\n\
  \    }\n}\n```\n\n代码非常直观。我们需要考虑的唯一边界情况是没有发布 `DomainEvent`。\n\n### 为什么需要交换名称？\n\n\
  我们将在“集成限界上下文”章节中详细讨论这一点。然而，当系统运行并且一个新的限界上下文（BC）加入时，你会有兴趣重新发送所有的 `DomainEvents`。因此，跟踪最后发布的\
  \ `DomainEvent` 和通道很有意义。为了跟踪 `DomainEvents`，我们需要交换名称和 ID。查看一种可能的实现。\n\n领域事件\n\n\
  148\n\n```php\nclass PublishedMessage\n{\n    private $mostRecentPublishedMessageId;\n\
  \    private $trackerId;\n    private $exchangeName;\n\n    public function __construct($exchangeName,\
  \ $aRecentPublishedMessageId)\n    {\n        $this->mostRecentPublishedMessageId\
  \ = $aRecentPublishedMessageId;\n        $this->exchangeName = $exchangeName;\n\
  \    }\n\n    public function mostRecentPublishedMessageId()\n    {\n        return\
  \ $this->mostRecentPublishedMessageId;\n    }\n\n    public function updateMostRecentMessageId($maxId)\n\
  \    {\n        $this->mostRecentPublishedMessageId = $maxId;\n    }\n\n    public\
  \ function trackerId()\n    {\n        return $this->trackerId;\n    }\n}\n```\n\
  \n以及对应的映射。\n\n领域事件\n\n149\n\n```yaml\nDdd\\Domain\\Event\\PublishedMessage:\n  type:\
  \ entity\n  table: event_published_message_tracker\n  repositoryClass: Ddd\\Infrastructure\\\
  Application\\Notification\\DoctrinePublished\\MessageTracker\n  id:\n    trackerId:\n\
  \      column: tracker_id\n      type: integer\n      generator:\n        strategy:\
  \ AUTO\n  fields:\n    mostRecentPublishedMessageId:\n      column: most_recent_published_message_id\n\
  \      type: bigint\n    exchangeName:\n      type: string\n      column: type_name\n\
  ```\n\n现在让我们看看 `MessageProducer` 接口的用途以及它的实现细节。\n\n```php\ninterface MessageProducer\n\
  {\n    public function open($exchangeName);\n\n    /**\n     * @param $exchangeName\n\
  \     * @param string $notificationMessage\n     * @param string $notificationType\n\
  \     * @param int $notificationId\n     * @param \\DateTime $notificationOccurredOn\n\
  \     * @return void\n     */\n    public function send(\n        $exchangeName,\n\
  \        $notificationMessage,\n        $notificationType,\n        $notificationId,\n\
  \        $notificationOccurredOn\n    );\n}\n```\n\n\n\n\n\n```php\n\\DateTime $notificationOccurredOn);\n\
  \npublic function close($exchangeName);\n\n}\n```\n\n# 领域事件 (Domain Events)\n\n\
  150\n\n非常简单。`open` 和 `close` 方法用于打开和关闭与消息系统的连接。\n\n`send` 接收消息正体、消息名称和消息 ID，并将它们发送到我们的消息引擎中（无论该引擎是什么）。由于我们选择了\
  \ `RabbitMQ`，我们需要实现连接和发送过程。\n\n```php\nabstract class RabbitMqMessaging\n{\n   \
  \ protected $connection;\n    protected $channel;\n\n    public function __construct(AMQPConnection\
  \ $aConnection)\n    {\n        $this->connection = $aConnection;\n        $this->channel\
  \ = null;\n    }\n\n    private function connect($exchangeName)\n    {\n       \
  \ if (null !== $this->channel) {\n            return;\n        }\n\n        $channel\
  \ = $this->connection->channel();\n        $channel->exchange_declare($exchangeName,\
  \ 'fanout', false, true, false);\n        $channel->queue_declare($exchangeName,\
  \ false, true, false, false);\n        $channel->queue_bind($exchangeName, $exchangeName);\n\
  \        $this->channel = $channel;\n    }\n\n    public function open($exchangeName)\n\
  \    {\n    }\n\n    protected function channel($exchangeName)\n    {\n        $this->connect($exchangeName);\n\
  \        return $this->channel;\n    }\n\n    public function close($exchangeName)\n\
  \    {\n        $this->channel->close();\n        $this->connection->close();\n\
  \    }\n}\n```\n\n```php\nclass RabbitMqMessageProducer extends RabbitMqMessaging\
  \ implements MessageProducer\n{\n    /**\n     * @param string $exchangeName\n \
  \    * @param string $notificationMessage\n     * @param string $notificationType\n\
  \     * @param int $notificationId\n     * @param \\DateTime $notificationOccurredOn\n\
  \     */\n    public function send(\n        $exchangeName,\n        $notificationMessage,\n\
  \        $notificationType,\n        $notificationId,\n        \\DateTime $notificationOccurredOn\n\
  \    )\n    {\n        $this->channel($exchangeName)->basic_publish(\n         \
  \   new AMQPMessage(\n                $notificationMessage,\n                [\n\
  \                    'type' => $notificationType,\n                    'timestamp'\
  \ => $notificationOccurredOn->getTimestamp(),\n                    'message_id'\
  \ => $notificationId\n                ]\n            ),\n            $exchangeName\n\
  \        );\n    }\n}\n```\n\n现在我们已经有了一个领域服务（DomainService）将领域事件（DomainEvents）推送到\
  \ RabbitMQ 这样的消息系统中，现在是执行它们了。我们需要选择一种交付机制来运行该服务。我们个人建议创建一个 [Symfony Console](http://symfony.com/doc/current/components/console/introduction.html)\
  \ 命令。\n\n领域事件\n\n152\n\n```php\nclass PushNotificationsCommand extends Command\n\
  {\n    protected function configure()\n    {\n        $this->setName('domain:events:spread')\n\
  \            ->setDescription('通过消息通知所有领域事件')\n            ->addArgument(\n    \
  \            'exchange-name',\n                InputArgument::OPTIONAL,\n      \
  \          '发布事件的交换机名称',\n                'my-bc-app'\n            );\n    }\n\n\
  \    protected function execute(InputInterface $input, OutputInterface $output)\n\
  \    {\n        $app = $this->getApplication()->getContainer();\n        $numberOfNotifications\
  \ = $app['notification_service']\n            ->publishNotifications(\n        \
  \        $input->getArgument('exchange-name')\n            );\n        $output->writeln(\n\
  \            sprintf(\n                '<comment>%d</comment> <info>已发送通知(s)!</info>',\n\
  \                $numberOfNotifications\n            )\n        );\n    }\n}\n```\n\
  \n遵循 Silex 的示例，让我们看看 `$app['notification_service']` 在 [Silex Pimple Service Container](https://silex.com/doc/2.0/pimple.container.html)\
  \ 中的定义。\n\n领域事件\n\n153\n\n```php\n// ... (代码部分同上)\n```\n\n154\n\n### 6.8 总结\n\n\
  现在，剩下的事情是关于通过消息系统来处理领域事件或相应的应用服务。我们在“集成限界（Integrating Bounded Contexts）”和“应用服务（Application\
  \ Services）”章节中看到如何实现这一点。\n\n!(-173)\n\n# 7. 模块 (Modules)\n\n当你将一些类放在一个模块（Module）中时，你是在告诉查看你设计的后续开发者将它们放在一起。如果你的模型是在讲述一个故事，那么模块就是章节。Eric\
  \ Evans，领域驱动设计\n\n在遵循领域驱动设计（DDD）构建应用时，一个常见的问题是：我们将代码放在哪里？推荐如何将代码放入应用程序？基础设施代码放在哪里？更重要的是，模型内部的不同概念应该如何组织？\n\
  \n有一个战术模式可以解决这个问题：**模块**。如今，每个人使用模块组织代码。但 DDD 更进一步，它将模块视为模型的一部分。\n\n## 7.1 在模块中组织代码\n\
  \n如果我们以一个名为 **buy.it** 的虚拟电子商务应用程序为例，为每个不同的限界上下文定义一个模块可能是合理的，因为每个限界上下文代表了一个自包含且独立的应用程序\n\
  \n```text\n├── billing\n│   ├── composer.json\n│   ├── composer.lock\n│   ├── src\n\
  │   └── tests\n├── cart\n│   ├── composer.json\n│   ├── composer.lock\n│   ├── src\n\
  │   └── tests\n├── catalog\n│   ├── composer.json\n│   ├── composer.lock\n│   ├──\
  \ src\n│   └── tests\n└── inventory\n    ├── composer.json\n    ├── composer.lock\n\
  \    ├── src\n    └── tests\n```\n\n每个模块包含一个暴露类似 REST API 的应用程序。请注意，每个模块名称都是电子商务系统中的意义概念，并使用通用语言（Ubiquitous\
  \ Language）命名：\n\n- **账单模块 (Billing)**：包含所有与支付、发票、运单以及具有有限状态机的订单处理系统等相关的代码。\n- **购物车模块\
  \ (Cart)**：包含所有与购物车系统相关的代码。\n- **目录模块 (Catalog)**：包含所有与产品描述、产品组合等相关的代码。\n- **库存模块\
  \ (Inventory)**：包含所有与产品库存管理相关的代码。\n\n\n\n\n让我们进一步深入探讨其中一个模块。以 `Billing`（账单）上下文为例，检查其结构细节。正如其名称所示，该模块负责表示订单所经历的所有流程。从它的创建到交付给购买它的客户。此外，它是一个独立的应用程序，因此它包含一个源代码文件夹（src）和一个测试文件夹（tests）。源代码文件夹包含了使该边界上下文（bounded\
  \ context）工作所需的所有代码：`domain`、`code` 和 `infrastructure code`。\n\n```\n├── composer.json\n\
  ├── composer.lock\n├── src\n│\n└── BuyIt\n│\n└── Billing\n│\n├── DomainModel\n│\n\
  └── Infrastructure\n└── tests\n```\n\n所有代码都带有以组织命名的供应商命名空间（vendor namespace）前缀（在本例中为\
  \ `BuyIt`），并包含两个子文件夹：`DomainModel` 存放所有领域代码，`Infrastructure` 存放基础设施层，将所有领域逻辑与基础设施层的细节隔离开来。通过这种结构，我们清晰地表明了，我们将使用\
  \ `Hexagonal Architecture`（六边形架构）作为基础架构。我们可能使用的另一种替代结构如下：\n\n![](img/index-175_1.png)\n\
  \n### Modules\n157\n\n```\n├── composer.json\n├── composer.lock\n├── src\n│\n└──\
  \ BuyIt\n│\n└── Billing\n│\n├── Domain\n│\n├── Model\n│\n└── Service\n│\n└── Infrastructure\n\
  └── tests\n```\n\n这种风格的结构使用额外的子文件夹来存储定义在领域模型内部的类。虽然这种组织方式可能是合理的，但我们倾向于不使用它，因为这种分离代码的方法往往更关注架构元素，而不是模型中的相关概念。我们认为这种风格很容易在领域模型之上产生某种服务层，这并不是一件坏事，但请记住，`Domain\
  \ Services`（领域服务）用于描述领域中的事物，即不属于实体（entities）也不属于值对象（value objects）的操作。因此，从现在起我们将坚持之前的代码组织方式。\n\
  \n可以将代码直接放在 `DomainModel` 子文件夹中。例如，将公共接口和服务类放在其中是非常常见的，如 `DomainEventPublisher`、`DomainEventSubscriber`\
  \ 等。\n\n如果我们对账单上下文进行建模，可能会有一个 `Order` 实体及其存储库（repository）以及所有状态信息。因此，我们的第一次尝试将是将所有这些元素直接放入\
  \ `DomainModel` 子文件夹中。乍看之下，这似乎是最简单的方法。\n\n```\n├── composer.json\n├── composer.lock\n\
  ├── src\n│\n└── BuyIt\n│\n└── Billing\n│\n├── DomainModel\n│\n├── Order.php\n│\n\
  ├── OrderLine.php\n│\n├── OrderLineWasAdded.php\n│\n├── OrderRepository.php\n│\n\
  └── OrderWasCreated.php\n│\n└── Infrastructure\n└── tests\n```\n\n### Modules\n\
  158\n\n我们将 `Order` 和 `OrderLine` 实体、`OrderLineWasAdded` 和 `OrderWasCreated` 事件以及\
  \ `OrderRepository` 放在同一个子文件夹（`DomainModel`）中。这种结构可能是可以的，但那是因为我们仍然有一个简单的模型。那么 `Bill`\
  \ 实体加上它的存储库呢？或者 `Waybill`（运单）实体加上相应的存储库呢？让我们添加所有这些元素，看看它们如何适应实际的代码结构。\n\n```\n├──\
  \ composer.json\n├── composer.lock\n├── src\n│\n└── BuyIt\n│\n└── Billing\n│\n├──\
  \ DomainModel\n│\n├── Bill.php\n│\n├── BillLine.php\n│\n├── BillLineWasAdded.php\n\
  │\n├── BillRepository.php\n│\n├── BillWasCreated.php\n│\n├── Order.php\n│\n├── OrderLine.php\n\
  │\n├── OrderLineWasAdded.php\n│\n├── OrderRepository.php\n│\n├── OrderWasCreated.php\n\
  │\n└── Infrastructure\n└── tests\n```\n\n（注：此处代码块内容展示了包含账单实体、存储库、运单实体及其对应存储库的逻辑，由于原文未提供重复翻译，此处保持结构逻辑一致）\n\
  \n虽然这种代码组织方式目前可能可行，但从长远来看，它会变得不实用且难以维护。每当我们迭代并添加新功能时，模型就会变得更大，该文件夹也会变得臃肿。为了实现这一点，我们可以使用\
  \ `Ubiquitous Language`（通用语言）来拆分模型，按领域关注点划分。我们可以尝试如下方法：\n\n### Modules\n159\n\n\
  ```\n├── composer.json\n├── composer.lock\n├── src\n│\n└── BuyIt\n│\n└── Billing\n\
  │\n├── DomainModel\n│\n├── Bill\n│\n│\n│\n├── Bill.php\n│\n│\n│\n├── BillLine.php\n\
  │\n│\n│\n├── BillLineWasAdded.php\n│\n│\n│\n├── BillRepository.php\n│\n│\n│\n└──\
  \ BillWasCreated.php\n│\n│\n│\n├── Order\n│\n│\n│\n├── Order.php\n│\n│\n│\n├── OrderLine.php\n\
  │\n│\n│\n├── OrderLineWasAdded.php\n│\n│\n│\n├── OrderRepository.php\n│\n│\n│\n\
  └── OrderWasCreated.php\n│\n│\n│\n├── Waybill\n│\n│\n│\n├── Waybill.php\n│\n│\n\
  │\n├── WaybillLine.php\n│\n│\n│\n├── WaybillLineAdded.php\n│\n│\n│\n├── WaybillRepository.php\n\
  │\n│\n│\n└── WaybillGenerated.php\n│\n└── Infrastructure\n└── tests\n```\n\n这种方式代码在概念上更有组织性，而不仅仅是技术关注点。观察之前的示例，我们可以发现\
  \ `Order` 和 `OrderLine` 概念关系紧密，因此它们位于同一个模块中。另一方面，`Order` 和 `Waybill` 虽然共享同一个上下文，但它们是不同的概念，因此它们位于不同的模块。模块是一种通信方式，并记住模块的主要目的是将领域模型的相关概念组织在一起，并将它们与不相关的解耦。模块并不分离代码，而是分离有意义的概念。![](img/index-178.png)\n\
  \n### 7.1.1 基础设施层中的模块\n\n到为止，我们一直在讨论如何构建和组织领域层的代码，但几乎没有提到过 `Infrastructure Layer`。由于我们使用\
  \ `Hexagonal Architecture` 来反转领域层和基础设施层之间的依赖，我们需要一个地方来放置领域层定义的所有接口的实现。回到账单上下文示例，我们需要为\
  \ `BillRepository`、`OrderRepository` 和 `WaybillRepository` 的实现提供一个位置。\n\n显然，它们应该放在\
  \ `Infrastructure` 文件夹中，但放在哪里？假设我们决定使用 `Doctrine ORM` 来实现持久层。我们如何将存储库的 Doctrine\
  \ 实现放入 `Infrastructure` 文件夹？让我们直接放在里面并看看看起来是什么样。\n\n```\n├── composer.json\n├──\
  \ composer.lock\n├── src\n│\n└── BuyIt\n│\n└── Billing\n│\n├── DomainModel\n│\n\
  ├── ...\n└── Infrastructure\n```\n\n\n\n\n```text\n├── OrderLine.php\n├── OrderLineWasAdded.php\n\
  ├── OrderRepository.php\n└── OrderWasCreated.php\n└── Waybill\n├── Waybill.php\n\
  ├── WaybillLine.php\n├── WaybillLineWasAdded.php\n├── WaybillRepository.php\n└──\
  \ WaybillWasGenerated.php\n└── Infrastructure\n├── DoctrineBillRepository.php\n\
  ├── DoctrineOrderRepository.php\n└── DoctrineWaybillRepository.php\n└── tests\n\
  ```\n\n我们可以保持现状。但正如我们在`Domain Layer`中看到的，这种结构和组织方式在经过几次模型迭代后就会迅速腐化并变得混乱。每当模型增长时，可能需要更多的基础设施，这样我们最终会将不同的技术关注点（如\
  \ `persistence`、`messaging`、`logging` 等）混合在一起。我们避免基础设施实现变得错综复杂的的第一个尝试，是在边界上下文（bounded\
  \ context）中为每个`技术关注点`定义一个模块。\n\n```text\n├── composer.json\n├── composer.lock\n\
  ├── src\n└── BuyIt\n    └── Billing\n        ├── DomainModel\n        ├── Bill\n\
  \        ├── Bill.php\n        ├── BillLine.php\n        ├── BillLineWasAdded.php\n\
  \        ├── BillRepository.php\n        └── BillWasCreated.php\n        ├── Order\n\
  \        ├── Order.php\n        ├── OrderLine.php\n        ├── OrderLineWasAdded.php\n\
  \        ├── OrderRepository.php\n        └── OrderWasCreated.php\n        └── Waybill\n\
  \        ├── Waybill.php\n        ├── WaybillLine.php\n        ├── WaybillLineWasAdded.php\n\
  \        ├── WaybillRepository.php\n        └── WaybillWasGenerated.php\n      \
  \  └── Infrastructure\n            ├── Logging\n            ├── Messaging\n    \
  \        └── Persistence\n            ├── DoctrineBillRepository.php\n         \
  \   ├── DoctrineOrderRepository.php\n            └── DoctrineWaybillRepository.php\n\
  \        └── tests\n```\n\n这看起来好多了，而且从长期来看比我们的第一次尝试更具维护性。如果你预先知道自己将始终只有一个持久化机制，那么可以坚持这种结构和组织。它非常简单且易于维护。但当你必须处理多种持久化机制时怎么办？如今，拥有一个关系型数据库以及某种如\
  \ `Redis` 或 `Riak` 之类的共享内存持久化是非常常见的。或者为了测试代码而拥有某种本地内存实现。让我们看看这如何融入实际方案。\n\n```text\n\
  ├── composer.json\n├── composer.lock\n├── src\n└── BuyIt\n    └── Billing\n    \
  \    ├── DomainModel\n        ├── Bill\n        ├── Bill.php\n        ├── BillLine.php\n\
  \        ├── BillLineWasAdded.php\n        ├── BillRepository.php\n        └── BillWasCreated.php\n\
  \        ├── Order\n        ├── Order.php\n        ├── OrderLine.php\n        ├──\
  \ OrderLineWasAdded.php\n        ├── OrderRepository.php\n        └── OrderWasCreated.php\n\
  \        └── Waybill\n        ├── Waybill.php\n        ├── WaybillLine.php\n   \
  \     ├── WaybillLineWasAdded.php\n        ├── WaybillRepository.php\n        └──\
  \ WaybillWasGenerated.php\n        └── Infrastructure\n            ├── Logging\n\
  \            ├── Messaging\n            └── Persistence\n            ├── DoctrineBillRepository.php\n\
  \            ├── DoctrineOrderRepository.php\n            ├── DoctrineWaybillRepository.php\n\
  \            ├── InMemoryBillRepository.php\n            ├── InMemoryOrderRepository.php\n\
  \            ├── InMemoryWaybillRepository.php\n            ├── RedisBillRepository.php\n\
  \            ├── RedisOrderRepository.php\n            ├── RedisWaybillRepository.php\n\
  \        └── tests\n```\n\n这现在看起来又有点奇怪。所有的仓库实现都位于同一个模块中，这导致了多种技术的混合。目前我们有几个仓库。如果再多出几个，维护性可能会开始下降。因此这清楚地说明了我们需要创建另一个模块，根据底层技术将相关的实现进行分组。\n\
  \n```text\n├── composer.json\n├── composer.lock\n├── src\n└── BuyIt\n    └── Billing\n\
  \        ├── DomainModel\n        ├── Bill\n        ├── Bill.php\n        ├── BillLine.php\n\
  \        ├── BillLineWasAdded.php\n        ├── BillRepository.php\n        └── BillWasCreated.php\n\
  \        ├── Order\n        ├── Order.php\n        ├── OrderLine.php\n        ├──\
  \ OrderLineWasAdded.php\n        ├── OrderRepository.php\n        └── OrderWasCreated.php\n\
  \        └── Waybill\n        ├── Waybill.php\n        ├── WaybillLine.php\n   \
  \     ├── WaybillLineWasAdded.php\n        ├── WaybillRepository.php\n        └──\
  \ WaybillWasGenerated.php\n        └── Infrastructure\n            ├── Logging\n\
  \            ├── Messaging\n            └── Persistence\n            ├── DoctrineBillRepository.php\n\
  \            ├── DoctrineOrderRepository.php\n            ├── DoctrineWaybillRepository.php\n\
  \            ├── InMemoryBillRepository.php\n            ├── InMemoryOrderRepository.php\n\
  \            ├── InMemoryWaybillRepository.php\n            ├── RedisBillRepository.php\n\
  \            ├── RedisOrderRepository.php\n            ├── RedisWaybillRepository.php\n\
  \        └── tests\n```\n\n这种基础设施层的结构和组织比我们之前的尝试更具维护性，且更容易理解。我们可以对此边界上下文中使用的技术有一个通的了解。\n\
  \n### 7.1.1.1 混合不同的技术\n\n在大型关键业务应用中，混合多种技术是相当常见的。例如，在读密集型 Web 应用中，你通常会有某种去范式化数据源（`Solr`、`Elastic`、`Sphinx`\
  \ 等）提供应用程序所有的读取操作，而传统的 RDBMS（如 `MySQL` 或 `Postgres`）主要负责处理所有的写入操作。当这种情况发生时，产生的问题之一是，是否可以让读取操作使用搜索引擎，而写入操作使用传统的数据库。我们的通用建议是，这类情况是\
  \ `CQRS` 的信号，因为我们需要独立地扩展读取和写入。如果你可以使用 `CQRS`，那么这可能是最好的选择。\n\n但由于某种原因你无法使用 `CQRS`，则需要替代方案。在这种情况下，来自“四人行”的`代理模式`将派上用场。我们可以根据`代理模式`定义仓库的实现。\n\
  \n```php\nnamespace BuyIt\\Billing\\Infrastructure\\FullTextSearching\\Elastica;\n\
  use BuyIt\\Billing\\DomainModel\\Order\\OrderRepository;\nuse BuyIt\\Billing\\Infrastructure\\\
  Persistence\\Doctrine\\DoctrineOrderRepository;\nuse Elastica\\Client;\n\nclass\
  \ ElasticaOrderRepository implements OrderRepository\n{\n    private $client;\n\
  \    private $baseOrderRepository;\n\n    public function __construct(Client $client,\
  \ DoctrineOrderRepository $baseOrderRepository)\n    {\n        $this->client =\
  \ $client;\n        $this->baseOrderRepository = $baseOrderRepository;\n    }\n\n\
  \    public function find($id)\n    {\n        return $this->baseOrderRepository->find($id);\n\
  \    }\n\n    public function findBy(array $criteria)\n    {\n        $search =\
  \ new \\Elastica\\Search($this->client);\n        // ... ...\n        return $this->toOrder($search->search());\n\
  \    }\n\n    public function add($anOrder)\n    {\n        // 首先尝试将它添加到 Elastic\
  \ 索引\n        $ordersIndex = $this->client->getIndex('orders');\n        $orderType\
  \ = $ordersIndex->getType('order');\n        $orderType->addDocument(\n        \
  \    new \\Elastica\\Document(\n                $anOrder->id(),\n              \
  \  $this->toArray($anOrder)\n            )\n        );\n\n        $ordersIndex->refresh();\n\
  \        // 完成后，我们尝试将其添加到 RDBMS 存储\n        $this->baseOrderRepository->add($anOrder);\n\
  \    }\n}\n```\n\n这个示例提供了一个使用 `DoctrineOrderRepository` 和 `Elastica` 客户端（一个与 Elastic\
  \ 服务器交互的客户端）的简单实现。注意，对于某些操作我们使用了 RDBMS 数据源，而对另一些操作使用了 Elastica 客户端。此外注意添加操作由两个部分组成。第一部分尝试将订单存储到\
  \ Elastic 索引，第二部分\n\n\n\n\n尝试将 `Order` 存储到关系型数据库中，并将该操作委托给 Doctrine 实现。请注意，这只是一个示例和一种方法。它可能会被改进，例如现在整个添加操作是同步的。相反，我们可以将操作入队到某种消息中间件中，例如将\
  \ `Order` 存储到 Elastic 中。根据你的需求，有很多可能性和改进空间。\n\n### 7.2 在 PHP 中利用模块\n\n在 PHP 5.3\
  \ 之前，模块并没有被完全支持。如今，自 PHP 5.3 以来，我们可以使用 PHP 命名空间（namespaces）来实现 `Module` 模式。由于历史原因，我们将介绍在\
  \ PHP 5.3 之前如何使用命名空间。但你应该努力使用支持 PHP 命名空间的 PHP 版本。最佳选择始终是 PHP 的最新稳定版本。\n\n### 7.2.1\
  \ PEAR 风格的命名空间\n\n在 PHP 5.3 之前，由于缺乏命名空间结构，使用了 PEAR 风格的命名空间。PEAR 是 `PHP Extension\
  \ and Application Repository` 的缩写，在过去的旧时代，它是可重用组件的仓库。它仍然活跃，但其使用已是少数，并且有许多未维护的包。特别是自从\
  \ `composer` 和 `packagist` 上台之后。PEAR 作为可重用组件的来源，需要一种避免类名冲突的方法，因此他们开始用命名空间类类名前。仍然有项目使用这种形式的命名空间（例如\
  \ `PHPUnit` 或 `Zend Framework 1`）。以下是 PEAR 风格命名空间的一个示例：\n\n```\nModules\n├── composer.json\n\
  ├── composer.lock\n└── src\n└── BuyIt\n└── Billing\n└── DomainModel\n└── Bill\n\
  └── Bill.php\n```\n\n使用 PEAR 风格的命名空间，`Bill` 实体的类名将变为 `BuyIt_Billing_DomainModel_Bill_Bill`。这个类名有点丑陋，并且没有遵循\
  \ DDD 的核心准则之一：每个类名都应该根据**通用语言**（Ubiquitous Language）来命名。出于这个原因，我们强烈不建议使用它。\n\n###\
  \ 7.2.2 PSR-0 和 PSR-4 命名规范\n\n与 PHP 5.3 的其他重要功能一起，命名空间进入了舞台。这是一次重大转变，一群最重要的框架合作者形成了\
  \ [PHP-FIG](http://www.php-fig.org/)（这是 `PHP Framework Interop Group` 的缩写），旨在标准化和统一框架及库创建的共同方面。该小组发布的第一个\
  \ `PHP 标准建议`（下简称 `PSR`）是一个自动加载标准，总而言之，它提议使用命名空间在类和 PHP 文件之间建立一一关系。如今，`PSR-4`（`PSR-0`\
  \ 的简化版，仍然保持了类与物理 PHP 文件之间的关系）是构建代码的首选且推荐的方法，我们认为这应该是在项目中实现 `Modules` 的使用方法。回到之前的示例：\n\
  \n```\n├── composer.json\n├── composer.lock\n└── src\n└── BuyIt\n└── Billing\n└──\
  \ DomainModel\n└── Bill\n└── Bill.php\n```\n\n使用命名空间和 `PSR-0/PSR-4`，`Bill` 实体的类名将简单变为\
  \ `Bill`，完全限定类名将是 `BuyIt\\Billing\\DomainModel\\Bill\\Bill`。正如你所看到的，这种方式使我们能够根据**通用语言**命名领域对象，并且构建和组织代码的首选方式。\n\
  \n### 7.3 总结\n\n模块是在我们的领域模型中分组和分离概念的一种方式。模块的命名应该遵循通用语言。我们不应该忘记，模块是通信高层概念的一种方式，它帮助我们保持低耦合和高内聚。我们看到，即使在旧版本的\
  \ PHP 中，也可以通过使用前缀创建有的模块。现在很容易遵循 `PSR-0` 和 `PSR-4` 命名规范来构建我们的模块。\n\n## 8. 聚合 (Aggregates)\n\
  \n### 8.1 引言\n\n聚合可能是领域驱动设计（DDD）中最难理解和实现的构建基石。为了正确地实现它们，我们需要理解事务、锁定和并发策略等概念。了解它们的起源以及\
  \ NoSQL 运动如何对其产生如此巨大的影响也很有趣。\n\n来自 Vaughn Vernon 的《实施领域驱动设计》：聚合是精心构建的一致性边界，将实体（Entities）和值对象（Value\
  \ Objects）聚集在一起。另一本你绝对应该购买并阅读的奇书是 Pramod J. Sadalage 写的《NoSQL Distilled: A Brief\
  \ Guide to the Emerging World of Polyglot Persistence》。书中写道：“在领域驱动设计中，聚合是一个我们希望视为一个整体处理的相关对象的集合。特别是，它是数据操纵和一致性管理的单元。通常，我们喜欢用原子操作更新聚合，并以聚合的角度与我们的数据存储进行通信。”\n\
  \n#### 8.1.1 Martin Fowler 是怎么说的……\n\n来自 [`martinfowler.com/bliki/DDD_Aggregate.html`](http://martinfowler.com/bliki/DDD_Aggregate.html)\n\
  \n聚合是领域驱动设计中的一种模式。DDD 聚合是一个可以被视为单个单元的领域对象簇。一个例子可能是订单及其行项目，这些将是单独的对象，但将订单（连同其行项目）视为单个聚合是有用的。聚合将由其组件对象中的一个作为聚合根（aggregate\
  \ root）。任何从聚合外部发出的引用都应该只指向聚合根。因此，根可以确保整个聚合的完整性。\n\n聚合是数据存储传输的基本元素——你请求加载或保存整个聚合。事务不应该跨越聚合边界。\n\
  \nDDD 聚合有时会与集合类（列表、映射等）混淆。DDD 聚合是领域概念（订单、诊疗访问、播放列表），而集合是通用的。聚合通常包含多个集合以及简单的字段。“aggregate”一词是一个通用术语，用于各种不同的上下文中（例如\
  \ UML），在这种情况下，它指的并不是 DDD 聚合的概念。\n\n#### 8.1.2 百基百科是这么说的……\n\n来自 [`en.wikipedia.org/wiki/Domain-driven_design#Building_blocks_of_DDD`](https://en.wikipedia.org/wiki/Domain-driven_design#Building_blocks_of_DDD)：聚合：由一个根实体（又称为聚合根）结合在一起的对象集合。聚合根通过禁止外部对象持有对其成员的引用，来保证聚合内所做更改的一致性。\n\
  \n示例：当你开车时，你不需要担心让轮子向前移动、让引擎通过火花和燃料燃烧等等；你只是在开车。在在这种语境下，汽车是几个其他对象的聚合，并作为所有其他系统的聚合根。\n\
  \n### 8.2 简史历史\n\n在新世纪初，技术世界遭遇了 1990 年互联网泡沫破灭的冲击。虽然这让许多人质疑互联网的经济未来，但 2000 年确实看到几个大型网络属性的规模急剧扩大。\n\
  \n这种规模的增长正在许多维度上发生。网站开始以非常详细跟踪活动和结构。出现了大量数据集：链接、社交网络、日志中的活动、映射数据。随着数据的增长，用户也增长了——因为最大的网站已成为经常服务大量访问者的庞大园区。\n\
  \n应对数据和流量的增长需要更多的计算资源。为了处理这种\n\n\n\n关于扩展，你有两个选择：向上扩展（up）或向外扩展（out）。向上扩展意味着更大的机器、更多的处理器、磁盘存储和内存。但更大的机器变得越来越贵，更不用说随着规模的增大，还存在真实的限制。另一种方案是在集群中使用许多小机器。小机器集群可以使用廉价的硬件，在这些规模下最终成本更低。它还更具韧性——虽然单台机器故障很常见，但整个集群可以设计为即使发生此类故障也能运行，提供高可靠性。\n\
  \n当大型属性转向集群时，这揭示了一个新问题——关系型数据库并不是为在集群上运行而设计的。集群关系型数据库（如 `Oracle RAC` 或 `Microsoft\
  \ SQL Server` 基于共享磁盘子系统的概念工作。它们使用感知集群的文件系统并写入到高可用磁盘子系统——但这意味着集群仍然将磁盘子系统视为单点故障。关系型数据库也可以作为独立的服务器运行于不同的数据集，有效地实现了数据库分片（sharding）。虽然这分离了负载，但所有的分片必须由应用程序控制，程序必须跟踪每一条数据应该与哪个数据库服务器通信。此外，我们还失去了任何跨分片的查询、引用完整性、事务或一致性控制。在这种背景下，我们经常听到做过此类的人说“不自然的行为（unnatural\
  \ acts）”。\n\n这些技术问题因许可成本而加剧。商业关系型数据库通常基于单服务器假设进行定价，因此在集群上运行推高价格，并导致了与采购部门令人沮丧的谈判。关系型数据库与集群之间的这种不匹配导致一些组织考虑数据存储的替代方案。特别是两家公司——`Google`\
  \ 和 `Amazon`——极具影响力。它们都处于运行此类大型集群的前沿；此外，它们正在捕获海量数据。这些因素给了它们动力。它们都是成功且不断增长的公司，拥有强大的技术组成部分，这给了它们手段和机会。难怪它们对自己的关系型数据库下了“杀身之决心”。随着\
  \ 2000 年代的到来，这两家公司都发表了关于其努力的简短但极具影响力的论文：Google 的 `BigTable` 和 Amazon 的 `Dynamo`。\n\
  \n人们常说 `Amazon` 和 `Google` 的运行规模远超大多数组织，因此它们需要的解决方案可能对普通组织并不适用。虽然大多数软件项目确实不需要那种程度的规模，但事实也是如此，越来越多的组织开始探索通过捕获和处理更多数据可以做些什么——并遇到了相同的问题。因此，随着关于\
  \ `Google` 和 `Amazon` 所做的更多信息泄露出来，人们开始探索沿着类似的路线构建数据库——显式设计为在集群世界中生存。虽然早期对关系主地位的威胁被证明是幻影，但来自集群的威胁是严重的。\n\
  \n## 8.3 聚合（Aggregates）与集群\n\n一个 `Aggregate`（聚合）由一个根 `Entity`（实体）组成，该实体持有其他的 `Entities`\
  \ 和值对象（Value Objects）。一个没有任何子实体 `Entities` 或值对象的单个 `Entity` 自身就构成一个 `Aggregate`。这就是为什么在某些书中，`Aggregates`\
  \ 术语被用来代替 `Entity` 使用。\n\n`Aggregate` 的主要优势或真实目标是确保我们领域模型操作的一致性。它允许我们保证对 `Entities`\
  \ 和值对象层级结构的更改是以原子方式执行的。\n\n考虑一个粗略的例子来引入这个概念。想象一个电子商务应用程序和一个典型的持久化机制。有 `Orders`（订单）和\
  \ `Line Orders`（订单项）。`Orders` 的总金额和 `Line Orders` 的小计总和必须匹配。你绝不会在使用不保护这两个更改的事务的情况下更改\
  \ `Line Order` 的金额和 `Order` 的金额。为什么？因为更新 `Line Order` 的 `UPDATE` 语句可以正常工作，而对 `Order`\
  \ 总金额的 `UPDATE` 可能会因为网络连接问题而失败。在这种情况下，你会在表和你的 `Domain` 中导致不一致，如果你请求 `Order` 的总金额，然后应用业务逻辑计算所有\
  \ `Line Orders` 的和，会发生什么？你明白意思了。如果你将两个更改放在一个事务中，它们要么全部成功要么全部失败，这就是一致性。所以事务帮助你保持这种一致性。\n\
  \n在另一方面，负面影响是性能问题和持久化错误。`Aggregate` 使用它自己的仓库（repository）进行获取和持久化，无论它持有许多 `Entities`\
  \ 和值对象还是没有。\n\n为了设计一个 `Aggregate`，需要遵循一些规则或考虑因素，以便我们获得所有收益并最小化负面影响。\n\n### 8.4.1\
  \ 基于业务真实不变性（Business True Invariants）设计聚合\n\n首先，什么是不变性（invariant）？不变性是在代码执行期间必须为且保持一致的规则。让我们来看一个例子帮助理解。`stack`（栈）是一个后进先出（LIFO）的数据结构，我们可以推送元素、弹出元素并查询大小。考虑一个纯\
  \ PHP 实现，不使用任何特定的 PHP 数组函数（如 `array_pop`）。\n\n```php\nclass Stack\n{\n    private\
  \ $data;\n    public function __construct()\n    {\n        $this->data = [];\n\
  \    }\n\n    public function push($value)\n    {\n        $this->data[] = $value;\n\
  \    }\n\n    public function size()\n    {\n        return count($this->data);\n\
  \    }\n\n    public function pop()\n    {\n        $topIndex = $this->size() -\
  \ 1;\n        $top = $this->data[$topIndex];\n        unset($this->data[$topIndex]);\n\
  \        return $top;\n    }\n}\n```\n\n想象获取栈的大小是非常消耗 CPU 且高成本的调用。有一种改进该方法的方法，引入一个私有属性来跟踪内部数组中元素的数量。\n\
  \n```php\nclass Stack\n{\n    private $data;\n    private $size;\n    public function\
  \ __construct()\n    {\n        $this->data = [];\n        $this->size = 0;\n  \
  \  }\n\n    public function push($value)\n    {\n        $this->data[] = $value;\n\
  \        $this->size++;\n    }\n\n    public function size()\n    {\n        return\
  \ $this->size;\n    }\n\n    public function pop()\n    {\n        $topIndex = $this->size()\
  \ - 1;\n        $top = $this->data[$topIndex];\n        unset($this->data[$topIndex]);\n\
  \        $this->size--;\n        return $top;\n    }\n}\n```\n\n通过这种方法，现在请求栈的大小变成了一个轻量级的方法。代价是什么？在\
  \ `pop` 和 `push` 方法中有一些更新，以便在添加和删除元素时跟踪新的大小。让我们尝试寻找一个不变性，即在栈对象的任何方法调用之前之后都应该为真的规则。`$this->size\
  \ === count($this->data)` 怎么样？在栈对象的任何方法调用之前之后，属性 `size` 都是一致的，并且它始终持有栈的大小。\n\n那么什么是不变性？不变性是一个必须始终为真且在事务中保持一致的业务规则。在上例中，`Order`\
  \ 的金额必须匹配所有 `Line Orders` 的金额总和，这是一个不变性。这可能使得 `Order` 成为根，并允许我们对它进行操作，而不是对它内部的 `Order\
  \ Lines` 进行操作。\n\n\n\n\n在集群上执行的操作应当保持一致性，且不破坏任何不变性。这意味着，\n\n没有机会调用方法来破坏此类规则。每当你添加一个\
  \ `Line Order` 或从根节点更新信息时，内部都会计算 `Order` 的数量。\n\n注意那些“包含”（has-a）/“包含多个”（has-many）关系，它们并不意味着会将两个\
  \ `Entities` 变成一个 `Aggregate` 且其中一个是根节点。\n\n### 8.4.2 小聚合根 vs 大聚合根\n\n在设计 `Aggregates`\
  \ 时，要努力创建小的 `Aggregates`。如果没有不变性需要保护，那么意味着所有单个 `Entities` 都在执行。\n\n你可能已经在 90% 的情况下这样做了。\n\
  \n### 8.4.3 追求最终一致性\n\n### 8.4.4 每个事务只修改一个聚合根\n\n“在所有情况下，一个设计良好的 `Bounded Context`\
  \ 在每个事务中只修改一个 `Aggregate` 实例。此外，如果不应用事务分析，我们无法正确地推断 `Aggregate` 的设计。将修改限制在每个事务一个\
  \ `Aggregate` 实例听起来可能过于严格。然而，这是一条经验法则，在大多数情况下应该是我们的目标。它解决了使用 `Aggregates` 的根本原因。”\n\
  \n### 8.4.5 异常：UX 情况\n\n在遵循之前的规则设计 `Aggregates` 时，有一个典型的例外。\n\n聚合根\n\n### 8.5 示例应用服务：用户与愿望\n\
  \n学习 `Aggregates` 的最好方法是看代码。所以，让我们考虑以下场景：一个 Web 应用，用户可以提出愿望，如果他们发生了某些事，这些愿望就能实现。把它想象成一份遗嘱。例如，我想给妻子发一封邮件，解释我在发生不幸事故并去世后该如何处理我的\
  \ `GitHub` 账户。检查我是否还活着的方法是回复平台发送我的邮件。如果你想了解更多关于[这个](https://github.com/ddd-in-php/last-wishes)\
  \ [应用⁴](https://github.com/ddd-in-php/last-wishes)，你可以访问我们的 [GitHub 账户⁵](https://github.com/ddd-in-php)\
  \ 查看此示例及更多内容。\n\n好了，我们有用户和他们的愿望。让我们只考虑一个用例，“作为一个用户，我想要许下一个愿望”。我们如何如何建模这两个概念？作为设计\
  \ `Aggregates` 的良好实践，让我们尝试追求较小的 `Aggregates`，也就是说在这种情况下，是两个各包含一个 `Entity` 的不同 `Aggregates`：`User`\
  \ 和 `Wish`。它们之间的关系呢？嗯，我们应该使用标识符，例如 `UserId`。让我们看一些代码。\n\n#### 8.5.1 没有不变性，两个聚合根\n\
  \n“作为一个用户，我想要许下一个愿望”。我们将在后续章节中介绍应用服务，但现在，让我们检查实现愿望的不同方法。我们认为对于初学者的第一种方法将类似于下面的代码。\n\
  \n```php\nclass MakeWishService\n{\n    private $wishRepository;\n\n    public function\
  \ __construct(WishRepository $wishRepository)\n    {\n        $this->wishRepository\
  \ = $wishRepository;\n    }\n\n    public function execute(MakeWishRequest $request)\n\
  \    {\n        $userId = $request->userId();\n        $address = $request->address();\n\
  \        $content = $request->content();\n        $wish = new Wish(\n          \
  \  $this->wishRepository->nextIdentity(),\n            new UserId($userId),\n  \
  \          $address,\n            $content\n        );\n        $this->wishRepository->add($wish);\n\
  \    }\n}\n```\n\n你觉得这段代码如何？它可能是性能最好的代码了。在后台，你几乎可以看到 `INSERT` 语句。对于此类用例，这是最少的操作次数，只有一个，所以干得好。按照目前的实现，你可以根据业务逻辑创建你想要的任何愿望，再次干得好。\n\
  \n然而，可能存在一个潜在问题，你可以为一个在你的领域（Domain）中可能不存在的用户创建愿望。这是一个问题。事实上，无论你是使用关系型数据库还是 NoSQL\
  \ 数据库，在持久化任何内容之前，使用这种方法，你可以在内存中创建一个没有对应 `User` 的 `Wish`。\n\n确实，这是业务逻辑的破坏。我知道，我知道，你可以通通过在数据库中使用外键从\
  \ `wish(user_id)` 到 `user(id)` 来修复它。正确，但如果我们不使用带外键的数据库怎么办？更糟糕的是，如果是 NoSQL 数据库，例如\
  \ `Redis` 或 `ElasticSearch` 怎么办？\n\n所以，如果我们想修复这个问题，以便相同的代码能够在不同的基础设施中正常工作，我们需要检查用户是否存在。可能最简单的方法是在同一个应用服务中完成，不是吗？\n\
  \n```php\nclass MakeWishService\n{\n    //......\n    public function execute(MakeWishRequest\
  \ $request)\n    {\n        $userId = $request->userId();\n        $address = $request->address();\n\
  \        $content = $request->content();\n        $user = $this->userRepository->ofId(new\
  \ UserId($userId));\n\n        if (null === $user) {\n            throw new UserDoesNotExistException();\n\
  \        }\n\n        $wish = new Wish(\n            $this->wishRepository->nextIdentity(),\n\
  \            $user->id(),\n            $address,\n            $content\n       \
  \ );\n        $this->wishRepository->add($wish);\n    }\n}\n```\n\n这可能奏效，但在应用服务中进行检查有什么问题呢？在我们的领域中没有对此提供保护，任何人在领域服务内部、基础设施的任何部分等，都可以执行如下代码的操作。\n\
  \n```php\n// 在你领域的某处\n$nonExistingUserId = new UserId('non-existing-user-id');\n\
  $wish = new Wish(\n    $this->wishRepository->nextIdentity(),\n    $nonExistingUserId,\n\
  \    $address,\n    $content\n);\n```\n\n如果你已经读过工厂（Factories）章节，你也得到了解决方案。工厂帮助我们保持业务不变性，而这正是我们这里需要的。这里有一个隐含的不变性，说明我们不允许在没有有效用户的情况下许愿望。让我们看看工厂如何帮助我们。\n\
  \n```php\nclass MakeWishService\n{\n    private $userRepository;\n    private $wishRepository;\n\
  \n    public function __construct(\n        UserRepository $userRepository,\n  \
  \      WishRepository $wishRepository\n    ) {\n        $this->userRepository =\
  \ $userRepository;\n        $this->wishRepository = $wishRepository;\n    }\n\n\
  \    public function execute(MakeWishRequest $request)\n    {\n        $userId =\
  \ $request->userId();\n        $address = $request->address();\n        $content\
  \ = $request->content();\n        $user = $this->userRepository->ofId(new UserId($userId));\n\
  \n        if (null === $user) {\n             throw new UserDoesNotExistException();\n\
  \        }\n\n        $wish = $user->makeWish(\n            $this->wishRepository->nextIdentity(),\n\
  \            $address,\n            $content\n        );\n        $this->wishRepository->add($wish);\n\
  \    }\n}\n```\n\n```php\nclass User\n{\n    //......\n\n    /**\n     * @return\
  \ Wish\n     */\n    public function makeWish(WishId $wishId, $address, $content)\n\
  \    {\n        return new Wish(\n            $wishId,\n            $this->id(),\n\
  \            $address,\n            $content\n        );\n    }\n\n    //......\n\
  }\n```\n\n为什么我们返回一个 `Wish` 而不是将新的 `Wish` 添加到内部集合，正如我们可能会在使用 Doctrine 时所做的那样？总结，在这种场景中，`User`\
  \ 和 `Wish` 并不构成聚合。每个 `Entity` 都有自己的 `Repository`，并且通过 `UserId` 关联。获取用户所有的愿望可以通过愿望\
  \ Repository 中的查找方法完成。\n\n#### 8.5.2 每个用户最多三个愿望\n\n我们的应用程序取得了取得了巨大的成功，现在是时候变现了。我们希望新用户最多拥有三个愿望。作为一个用户，如果你想拥有更多的愿望，你可能需要为付费账户付费。让我们看看如何修改代码以遵循新的关于愿望数量的业务规则（不考虑付费用户）。\n\
  \n```php\nclass MakeWishService\n{\n    //......\n    public function execute(MakeWishRequest\
  \ $request)\n    {\n        $userId = $request->userId();\n        $address = $request->email();\n\
  \        $content = $request->content();\n    }\n}\n```\n\n\n\n\n\n```php\n$count\
  \ = $this->wishRepository->numberOfWishesByUserId($userId);\n\nif ($count > 3) {\n\
  \    throw new MaxNumberOfWishesExceededException();\n}\n\n$wish = new Wish(\n \
  \   $this->wishRepository->nextIdentity(),\n    new UserId($userId),\n    $address,\n\
  \    $content\n);\n\n$this->wishRepository->add($wish);\n}\n```\n\n这很简单，对吧？可能太简单了。我们在这里看到了了不同的问题。第一个问题是\
  \ `Application Services`（应用服务）不应该包含此类业务逻辑。它们必须负责协调，但不应包含业务逻辑。可能，更好的地方是把它们放入 `User`\
  \ 中。我们可以对 `User` 和 `Wish` 之间的关系拥有更多的控制。然而，对于这里解释的问题，这段代码是可以运行的。\n\n## 聚合根 (Aggregates)\n\
  \n第二个问题是关于代码本身的。它`在竞态条件下无法工作`。因此，它是不可接受的。暂不考虑领域驱动设计（DDD），在高流量下，这段代码会有什么问题？思考一下。是否可能打破\
  \ `User` 拥有超过三个愿望的规则？为什么你的 QA 在运行她那些古怪的测试时会超级开心？\n\n你的 QA 平静地尝试了两次，结果是一个用户有两个愿望。很好。你的\
  \ QA 想要见血。想象一下，她在浏览器中打开了两个标签页，填写了两个表单并同时提交了两个按钮。突然，在两次请求之后，用户在数据库中最终有了四个愿望。发生了什么？\n\
  \n像调试器一样思考，考虑两个请求同时到达 `if ($count > 3) {` 这一行。两个请求的评估结果都为 `false`，因为用户只有两个愿望。所以，两个请求都会创建\
  \ `Wish`，并且两个请求都会将其添加到数据库中。噢！一个 `User` 有了四个愿望。\n\n我们知道你在想什么。是因为我们忘记了将所有内容放入事务（transaction）中。很好，假设将之前相同的代码放在事务块中，你将看到如何在\
  \ `Application Services` 中正确地执行。在内部，让我们检查你的数据库发生了什么。\n\n```sql\nSTART TRANSACTION;\n\
  SELECT COUNT(*) FROM wishes WHERE user_id = 'e3bb5953-dd2-4204-a8e8-3449ea88c40';\
  \ -- @a is 2\nINSERT INTO wishes(id, user_id, address, message) VALUES ('7b81e576-d7dc-4736-a559-340961b7102',\
  \ 'mom@family.com', 'always love you!');\nSELECT COUNT(*) FROM wishes; -- @a is\
  \ 3\nCOMMIT;\n```\n\n如果你取这段 SQL 块并在两个不同的连接中逐行执行（为新的愿望使用不同的 `UUIDs`），你将看到 `wishes`\
  \ 表最后会有 4 行。所以，这看起来不是事务的问题。我们该如何修复这个问题？可能，你了解过持久化机制中的`悲观并发`（Pessimistic Concurrency）和`乐观并发`（Optimistic\
  \ Concurrency），让我们来探索一下它们吧。\n\n### 8.5.2.1 悲观并发\n\n这种方法被关系型数据库广泛使用，它假设冲突更改可能会发生，并阻塞对资源的访问以防止冲突。一个典型的例子是在读取数据之前锁定该行，确保只有放置锁的线程才能对该行进行更改。\n\
  \n### 8.5.2.2 乐观并发\n\n这种方法假设冲突不太可能发生，不会阻塞正在尝试的操作。然而，如果底层数据在读取和写入之间被修改过，更新将失败。这时就取决于应用程序决定如何解决冲突。例如，它可以使用崭新的数据重新尝试更新，或者向用户报告该情况。我们能针对这个用例使用这些策略之一吗？嗯，我们认为不行，因为我们正在创建一个新的愿望。\n\
  \n```php\nclass User {\n    // ...\n    public function makeWish(WishId $wishId,\
  \ $address, $content) {\n        $this->wishes[] = new Wish(\n            $wishId,\n\
  \            $this->id(),\n            $address,\n            $content\n       \
  \ );\n    }\n    // ...\n}\n```\n\n### 8.5.3 渲染用户的愿望\n### 8.5.4 更新用户的愿望\n### 8.5.5\
  \ 成全用户的愿望\n### 8.6 总结\n\n## 9. 工厂 (Factories)\n\n### 9.1 引言\n\n在领域中，工厂帮助将客户端从了解如何构建复杂对象和\
  \ `Aggregates`（聚合）中解耦。你可以使用它们来作为一个整体创建一个 `Aggregates`，并强制执行它们不变性（invariants）。\n\n\
  ### 9.2 聚合根上的工厂方法\n\n`Factory Method`（工厂方法）模式正如经典的“四人小组”定义的，是一种创建模式，它定义了创建对象的接口，但将类型选择留给子类，创建过程延迟到运行时。在`Aggregate\
  \ Root`（聚合根）中添加`Factory Method`可以向任何外部客户端隐藏创建聚合的内部实现细节。这也将聚合完整性的责任交回了根节点。\n\n在一个拥有\
  \ `User` 和 `Wish` 实体的领域模型中，`User` 充当聚合根。没有 `User` 就没有 `Wish`。`User` 实体应该管理它的聚合。将\
  \ `Wish` 的控制权移回 `User` 实体的方法是在聚合根中放置一个 `Factory Method`。\n\n```php\nclass User {\n\
  \    //...\n    public function makeWish(WishId $wishId, $email, $content) {\n \
  \       $wish = new WishEmail(\n            $wishId,\n            $this->id(),\n\
  \            $email,\n            $content\n        );\n        DomainEventPublisher::instance()->publish(\n\
  \            new WishMade($wishId)\n        );\n        return $wish;\n    }\n}\n\
  ```\n\n客户端完全不需要知道 `Aggregate Root` 如何处理创建逻辑的内部细节：\n\n```php\n$wish = $aUser->makeWish(\n\
  \    $wishRepository->nextIdentity(),\n    'user@example.com',\n    'I want to be\
  \ free!'\n);\n```\n\n### 9.2.1 强制不变性\n\n`Aggregate Root` 中的工厂方法也是处理不变性的良好位置。在一个拥有\
  \ `Forum` 和 `Article` 实体的领域模型中，其中 `Article` 是 `Forum` 的一个聚合，发布一个 `Article` 可能如下：\n\
  \n```php\nclass Forum {\n    // ...\n    public function publishPost(PostId $postId,\
  \ $content) {\n        $post = new Post($this->id, $postId, $content);\n       \
  \ DomainEventPublisher::instance()->publish(\n            new PostPublished($postId)\n\
  \        );\n        return $post;\n    }\n}\n```\n\n在与领域专家交流后，我们得出结论：当 `Forum`\
  \ 关闭时，不应发布 `Post`。这是一个不变性，我们可以在创建 `Post` 时直接强制执行，防止不一致的领域状态：\n\n```php\nclass Forum\
  \ {\n    // ...\n    public function publishPost(PostId $postId, $content) {\n \
  \       if ($this->isClosed()) {\n            throw new ForumClosedException();\n\
  \        }\n        $post = new Post($this->id, $postId, $content);\n        DomainEventPublisher::instance()->publish(\n\
  \            new PostPublished($postId)\n        );\n        return $post;\n   \
  \ }\n}\n```\n\n### 9.3 服务上的工厂\n\n解耦创建逻辑在我们的服务中有用。\n\n### 9.3.1 构建规范 (Specifications)\n\
  \n在我们的服务中使用 `Specifications` 可能是说明如何在服务中使用工厂的最佳示例。考虑以下服务示例。给定一个来自外部世界的请求，我们希望根据系统中添加的最新\
  \ `Posts` 构建一个馈。\n\n```php\nnamespace Application\\Service;\n\nuse Domain\\Model\\\
  Post;\nuse Domain\\Model\\PostRepository;\n\nclass LatestPostsFeedService {\n  \
  \  private $postRepository;\n\n    public function __construct(PostRepository $postRepository)\
  \ {\n        $this->postRepository = $postRepository;\n    }\n\n    public function\
  \ execute($request) {\n        $posts = $this->postRepository->latestPosts($request->since);\n\
  \        return array_map(function(Post $post) {\n```\n\n\n\n```php\nreturn [\n\
  \    'id' => $post->id()->id(),\n    'content' => $post->body()->content(),\n  \
  \  'created_at' => $post->createdAt()\n];\n}, $posts);\n}\n```\n\n`Repositories`\
  \ 中的查找方法（如 `latestPosts`）具有某些局限性，因为它们会不断给我们的仓库增加复杂度。正如我们在 Repository 章节中讨论的，Specifications（规格模式）是一个更好的方法。\n\
  \n幸运的是，我们在 `PostRepository` 中有一个非常有用的查询方法，它可以配合 `Specifications` 使用工作。\n\n```php\n\
  class LatestPostsFeedService\n{\n    //...\n    public function execute($request)\n\
  \    {\n        //...\n        $posts = $this->postRepository->query($specification);\n\
  \        //...\n    }\n}\n```\n\n### 为 `Specification` 使用具体实现是一个坏主意\n\n```php\n\
  class LatestPostsFeedService\n{\n    //...\n    public function execute($request)\n\
  \    {\n        $posts = $this->postRepository->query(\n            new SqlLatestPostSpecification($request->since)\n\
  \        );\n        //...\n    }\n}\n```\n\n将我们的高层应用服务与低层的 `Specification` 实现耦合会混合层级并破坏关注点分离。此外，这是将我们的服务耦合到具体基础设施实现上也是一种非常糟糕的方法。你无法在\
  \ SQL 持久化解决方案之外使用此服务。如果我们想用内存中的实现来测试我们的服务怎么办？\n\n解决这个问题的方案是通过使用[抽象工厂模式](http://en.wikipedia.org/wiki/Abstract_factory_pattern)[²]\
  \ 将 `Specification` 的创建与服务本身解耦。抽象工厂提供了一个创建一组相关对象的接口，而无需显式地指定它们的具体类。\n\n由于我们可能有多个需要创建的\
  \ `Specification` 实现，我们首先需要为工厂创建一个接口。\n\n```php\nnamespace Domain\\Model;\ninterface\
  \ PostSpecificationFactory\n{\n    public function createLatestPosts(\\DateTime\
  \ $since);\n}\n```\n\n然后，我们需要为每个 `PostRepository` 实现创建工厂。例如，一个用于内存 `PostRepository`\
  \ 实现的工厂可能如下：\n\n```php\nnamespace Infrastructure\\Persistence\\InMemory;\nuse Domain\\\
  Model\\PostSpecificationFactory;\nclass InMemoryPostSpecificationFactory implements\
  \ PostSpecificationFactory\n{\n    public function createLatestPosts(\\DateTime\
  \ $since)\n    {\n        return new InMemoryLatestPostSpecification($since);\n\
  \    }\n}\n```\n\n一旦我们有了中心化的创建逻辑，就很容易将其从服务中解耦：\n\n```php\nclass LatestPostsFeedService\n\
  {\n    private $postRepository;\n    private $postSpecificationFactory;\n    public\
  \ function __construct(\n        PostRepository $postRepository,\n        PostSpecificationFactory\
  \ $postSpecificationFactory\n    ) {\n        $this->postRepository = $postRepository;\n\
  \        $this->postSpecificationFactory = $postSpecificationFactory;\n    }\n\n\
  \    public function execute($request)\n    {\n        $posts = $this->postRepository->query(\n\
  \            $this->postSpecificationFactory->createLatestPosts($request->since)\n\
  \        );\n        // ...\n    }\n}\n```\n\n现在，通过内存中的 `PostRepository` 实现对我们的服务进行单元测试变得非常简单。\n\
  \n```php\nnamespace Application\\Service;\nuse Domain\\Model\\Body;\nuse Domain\\\
  Model\\Post;\nuse Domain\\Model\\PostId;\nuse Infrastructure\\Persistence\\InMemory\\\
  InMemoryPostRepository;\nclass LatestPostsFeedServiceTest extends \\PHPUnit_Framework_TestCase\n\
  {\n    /**\n     * @var \\Infrastructure\\Persistence\\InMemory\\InMemoryPostRepository\n\
  \     */\n    private $postRepository;\n\n    /**\n     * @var LatestPostsFeedService\n\
  \     */\n    private $latestPostsFeedService;\n\n    public function setUp()\n\
  \    {\n        $this->latestPostsFeedService = new LatestPostsFeedService(\n  \
  \          $this->postRepository = new InMemoryPostRepository()\n        );\n  \
  \  }\n\n    /**\n     * @test\n     */\n    public function shouldBuildAFeedFromLatestsPosts()\n\
  \    {\n        $this->addPost(1, 'first', '-2 hours');\n        $this->addPost(2,\
  \ 'second', '-3 hours');\n        $this->addPost(3, 'third', '-5 hours');\n    \
  \    $feed = $this->latestPostsFeedService->execute(\n            new LatestPostsFeedRequest(new\
  \ \\DateTime('-4 hours'))\n        );\n        $this->assertFeedContains([\n   \
  \         ['id' => 1, 'content' => 'first'],\n            ['id' => 2, 'content'\
  \ => 'second']\n        ], $feed);\n    }\n\n    private function addPost($id, $content,\
  \ $createdAt)\n    {\n        $this->postRepository->add(new Post(\n           \
  \ new PostId($id),\n            new Body($content),\n            new \\DateTime($createdAt)\n\
  \        ));\n    }\n\n    private function assertFeedContains($expected, $feed)\n\
  \    {\n        foreach ($expected as $index => $contents) {\n            $this->assertArraySubset($contents,\
  \ $feed[$index]);\n            $this->assertNotNull($feed[$index]['created_at']);\n\
  \        }\n    }\n}\n```\n\n### 9.3.2 构建聚合根\n\n实体（Entities）对于持久化机制是不可知的。你不希望将持久化细节耦合并污染你的实体。\n\
  \n看看下一个应用服务：\n\n```php\nclass SignInUserService\n{\n    private $userRepository;\n\
  \    public function __construct(UserRepository $userRepository)\n    {\n      \
  \  $this->userRepository = $userRepository;\n    }\n\n    /**\n     * @param SignInRequest\
  \ $request\n     */\n    public function execute($request)\n    {\n        $email\
  \ = $request->email();\n        $password = $request->password();\n        $user\
  \ = $this->userRepository->userOf($email);\n        if (null !== $user) {\n    \
  \        throw new UserExistsException();\n        }\n        $this->userRepository->persist(new\
  \ User(\n            $this->userRepository->nextIdentity(),\n            $email,\n\
  \            $password\n        ));\n        return $user;\n    }\n}\n```\n\n带有如下\
  \ `User` 实体：\n\n```php\nclass User\n{\n    private $userId;\n    private $email;\n\
  \    private $password;\n    public function __construct(UserId $userId, $email,\
  \ $password)\n    {\n        //...\n    }\n    //...\n}\n```\n\n假设我们想使用 `Doctrine`\
  \ 作为我们的基础设施持久化机制。`Doctrine` 需要一个字符串实例作为成员变量才能正常工作。在我们的实体中，`$userId` 是一个 `UserId`\
  \ 值对象。为了 `Doctrine` 给实体添加额外的 `id` 会将我们的持久化机制与领域模型耦合。\n\n我们在实体章节中已经看到，可以通过创建代理 ID（Surrogate\
  \ Id）来解决这个问题，即在基础设施层中为我们的 `User` 实体创建一个包装器：\n\n```php\nclass DoctrineUser extends\
  \ User\n{\n    private $surrogateUserId;\n    public function __construct(UserId\
  \ $userId, $email, $password)\n    {\n        parent::__construct($userId, $email,\
  \ $password);\n        $this->surrogateUserId = $userId->id();\n    }\n}\n```\n\n\
  由于在应用服务中创建 `DoctrineUser` 会再次将持久化层与领域耦合，我们需要通过抽象工厂（Abstract Factory）将创建逻辑从服务中解耦。我们可以通过在领域中创建一个接口来实现：\n\
  \n```php\ninterface UserFactory\n{\n    public function build(UserId $userId, $email,\
  \ $password);\n}\n```\n\n并将它的实现放在我们的基础设施层：\n\n```php\nclass DoctrineUserFactory\
  \ implements UserFactory\n{\n    public function build(UserId $userId, $email, $password)\n\
  \    {\n        return new DoctrineUser($userId, $email, $password);\n    }\n}\n\
  ```\n\n一旦解耦，我们只需要将工厂（Factory）注入到应用服务中：\n\n```php\nclass SignInUserService\n{\n \
  \   private $userRepository;\n    private $userFactory;\n    public function __construct(\n\
  \        UserRepository $userRepository,\n        UserFactory $userFactory\n   \
  \ ) {\n        $this->userRepository = $userRepository;\n        $this->userFactory\
  \ = $userFactory;\n    }\n    //...\n}\n```\n\n### 9.4 测试\n\n在编写测试时，你会看到一种常见的模式。构建实体和复杂的聚合根\n\
  \n\n\n\n这可能是一个非常枯燥且重复的过程。复杂性和重复将开始渗透到你的测试套件中。\n\n考虑以下实体\n\n```php\nclass Author\n\
  {\n    private $username;\n    private $email;\n    private $fullName;\n    public\
  \ function __construct(\n        Username $aUsername,\n        FullName $aFullName,\n\
  \        Email $anEmail\n    ) {\n        $this->username = $aUsername;\n      \
  \  $this->email = $anEmail;\n        $this->fullName = $aFullName;\n    }\n    //...\n\
  }\n```\n\n在系统某处的某个测试中包含了：\n\n```php\nclass MyTest extends PHPUnit_Framework_TestCase\n\
  {\n    /**\n     * @test\n     */\n    public function itDoesSomething()\n    {\n\
  \        $author = new Author(\n            new Username('johndoe'),\n         \
  \   new FullName('John', 'Doe'),\n            new Email('john@doe.com')\n      \
  \  );\n        //对 author 进行某些操作\n    }\n}\n```\n\n边界内部的服务共享实体、聚合根和值对象等概念，想象一下在你的测试中反复重复相同的构建逻辑会有多么的混乱。正如我们将所看到的，将构建逻辑从测试中提取出来非常有帮助，并且可以防止重复。\n\
  \n### 9.4.1 对象母 (Object Mother)\n\n[对象母](http://martinfowler.com/bliki/ObjectMother.html)#index_split_000.html#212)\
  \ 是一个为你的测试创建固定固件的工厂的生动名称。接上之前的例子，我们可以将重复的逻辑提取到对象母中，以便在不同测试之间复用。\n\n³[`martinfowler.com/bliki/ObjectMother.html`](http://martinfowler.com/bliki/ObjectMother.html)\n\
  \n```php\nclass AuthorObjectMother\n{\n    public static function createOne()\n\
  \    {\n        return new Author(\n            new Username('johndoe'),\n     \
  \       new FullName('John', 'Doe'),\n            new Email('john@doe.com')\n  \
  \      );\n    }\n}\n\nclass MyTest extends PHPUnit_Framework_TestCase\n{\n    /**\n\
  \     * @test\n     */\n    public function itDoesSomething()\n    {\n        $author\
  \ = AuthorObjectMother::createOne();\n        //对 author 进行某些操作\n    }\n}\n```\n\
  \n你会发现，测试和情况越多，工厂拥有的方法就越多。由于对象母并不灵活，它们往往会迅速变得复杂。对于你的测试来说，有一种更灵活的替代方案。\n\n### 9.4.2\
  \ 测试数据构建器 (Test Data Builder)\n\n测试数据构建器只是带有默认值的普通构建器（Builders），专门用于你的测试套套件中，这样你就不需要在特定的测试用例中指定无关的参数。\n\
  \n```php\nclass AuthorBuilder\n{\n    private $username;\n    private $email;\n\
  \    private $fullName;\n    private function __construct()\n    {\n        $this->username\
  \ = new Username('johndoe');\n        $this->email = new Email('john@doe.com');\n\
  \        $this->fullName = new FullName('John', 'Doe');\n    }\n    public static\
  \ function anAuthor()\n    {\n        return new();\n    }\n    public function\
  \ withFullName(FullName $aFullName)\n    {\n        $this->fullName = $aFullName;\n\
  \        return $this;\n    }\n    public function withUsername(Username $aUsername)\n\
  \    {\n        $this->username = $aUsername;\n        return $this;\n    }\n  \
  \  public function withEmail(Email $anEmail)\n    {\n        $this->email = $anEmail;\n\
  \        return $this;\n    }\n    public function build()\n    {\n        return\
  \ new Author($this->username, $this->fullName, $this->email);\n    }\n}\n\nclass\
  \ MyTest extends PHPUnit_Framework_TestCase\n{\n    /**\n     * @test\n     */\n\
  \    public function itDoesSomething()\n    {\n        $author = AuthorBuilder::anAuthor()\n\
  \            ->withEmail(new Email('other@email.com'))\n            ->build();\n\
  \        //对 author 进行某些操作\n    }\n}\n```\n\n我们甚至可以组合测试数据构建器来构建更复杂的聚合，如 `Post`：\n\
  \n```php\nclass Post\n{\n    private $id;\n    private $author;\n    private $body;\n\
  \    private $createdAt;\n    public function __construct(\n        PostId $anId,\n\
  \        Author $anAuthor,\n        Body $aBody\n    ) {\n        $this->id = $anId;\n\
  \        $this->author = $anAuthor;\n        $this->body = $aBody;\n        $this->createdAt\
  \ = new DateTime();\n    }\n}\n```\n\n以及相应的 `PostBuilder`：\n\n```php\nclass PostBuilder\n\
  {\n    private $postId;\n    private $author;\n    private $body;\n    private function\
  \ __construct()\n    {\n        $this->postId = new PostId();\n        $this->author\
  \ = AuthorBuilder::anAuthor()->build();\n        $this->body = new Body('Post body');\n\
  \    }\n    public static function aPost()\n    {\n        return new();\n    }\n\
  \    public function withAuthor(Author $anAuthor)\n    {\n        $this->author\
  \ = $anAuthor;\n        return $this;\n    }\n    public function withPostId(PostId\
  \ $aPostId)\n    {\n        $this->postId = $aPostId;\n        return $this;\n \
  \   }\n    public function withBody(Body $body)\n    {\n        $this->body = $body;\n\
  \        return $this;\n    }\n    public function build()\n    {\n        return\
  \ new Post($this->postId, $this->author, $this->body);\n    }\n}\n```\n\n这种方案现在足够灵活，可以适应测试中的任何情况。\n\
  \n```php\nclass MyTest extends PHPUnit_Framework_TestCase\n{\n    /**\n     * @test\n\
  \     */\n    public function itDoesSomething()\n    {\n        $post = PostBuilder::aPost()\n\
  \            ->withAuthor(AuthorBuilder::anAuthor()\n                ->withUsername(new\
  \ Username('other'))\n                ->build())\n            ->withBody(new Body('Another\
  \ body'))\n            ->build();\n        //对 post 进行某些操作\n    }\n}\n```\n\n###\
  \ 9.5 总结\n\n工厂解耦逻辑与业务逻辑的强大工具。工厂方法不仅有助于将创建责任移动到聚合根，还能强制领域不变性。在服务中使用抽象工厂模式允许我们将领域逻辑与基础设施分离。常见的用例是规范及其相应的持久化实现。我们已经看到工厂在测试套件中非常有用。虽然我们可以将构建逻辑提取到对象母，但测试数据构建器提供了更高的活性。\n\
  \n### 10. 仓库 (Repositories)\n\n### 10.1 引言\n\n为了与领域对象交互，你需要持有它的引用。实现这一点的可以通过创建，也可以通过关联来实现。在面向对象的程序中，对象拥有其他对象的引用，这使得它们易于遍历。这极大地增强了我们模型的表达。困难在于，你需要一种机制来获取第一个对象，即聚合根。\n\
  \n仓库作为存储位置，获取的对象与其被持久化时的状态完全相同。每个聚合类型通常有一个唯一的关联仓库，用于其持久化需求。然而，在需要共享聚合对象层次树的情况下，这些类型可能会共享一个仓库。\n\
  \n### 10.2 定义\n\nMartin Fowler 定义¹](http://martinfowler.com/eaaCatalog/repository.html)\
  \ 仓库为领域层和数据映射层之间的机制，类似于内存中的领域对象集合。客户端对象声明地构造查询规范并将其提交给仓库以满足。对象可以像在简单集合中一样添加或删除，封装在仓库中的映射代码会在后台执行适当的操作。\n\
  \n¹[`martinfowler.com/eaaCatalog/repository.html`](http://martinfowler.com/eaaCatalog/repository.html)\n\
  \n\n\n数据访问对象（Data Access Objects）是一种将领域对象持久化到数据库的常用模式。很容易将数据访问对象模式与仓库（Repository）混淆。它们的显著区别在于：仓库代表集合，而\
  \ DAO 更贴于数据库，通常更以表为中心。通常，一个 DAO 会包含针对特定领域对象的 CRUD 方法。\n\n一个 DAO 的常见接口可以是：\n\n```php\n\
  interface UserDAO\n{\n    /**\n     * @param string $username\n     * @return User\n\
  \     */\n    public function get($username);\n\n    public function create(User\
  \ $user);\n\n    public function update(User $user);\n\n    /**\n     * @param string\
  \ $username\n     */\n    public function delete($username);\n}\n```\n\nDAO 接口可以有多个实现，其范围可以从\
  \ ORM 构建到纯 SQL 查询。DAO 的主要问题是它们的职责没有被清晰地定义。DAO 通常被视为通往数据库的网关，因此很容易通过许多特定的数据库查询方法来大幅降低内聚性。\n\
  \n### 仓库\n\n```php\ninterface BloatUserDAO\n{\n    public function get($username);\n\
  \    public function create(User $user);\n    public function update(User $user);\n\
  \    public function delete($username);\n    public function getUserByLastName($lastName);\n\
  \    public function getUserByEmail($email);\n    public function updateEmailAddress($username,\
  \ $email);\n    public function updateLastName($username, $lastName);\n}\n```\n\n\
  如你所见，DAO 变得越来越难以单元测试，因为你需要实现更多的方法，而且它与 `User` 对象的耦合变得更加紧。这个问题会随着时间的推移而增长，许多其他贡献者的协作会让这个“泥球球（ball\
  \ of mud）”变得更大。\n\n### 10.4 面向集合的仓库\n\n仓库通过实现其通用接口特性来模拟集合。作为一个集合，它不应该泄露任何关于持久化行为的意图，例如保存到存储器中的概念。\n\
  \n底层的持久化机制必须支持这种需求。你不应该被处理对象在其生命周期内的变化。集合引用了对象的最新更改，这意味着每次访问时你都会获得最新的对象状态。\n\n仓库实现了一种具体的集合类型：`Set`。`Set`\
  \ 是一种数据结构，其不变性是不包含重复条目。如果你尝试向已经存在的 `Set` 中添加元素，它将不会被添加。这在我们的用例中很有用，因为每个聚合根（Aggregate）都有一个与根实体（Root\
  \ Entity）关联的唯一标识。\n\n例如，我们有如下的领域模型：\n\n```php\nnamespace Domain\\Model;\n\nclass\
  \ Post\n{\n    const EXPIRE_EDIT_TIME = 120; // seconds\n    private $id;\n    private\
  \ $body;\n    private $createdAt;\n\n    public function __construct(\n        PostId\
  \ $anId,\n        Body $aBody,\n        \\DateTime $createdAt = null\n    ) {\n\
  \        $this->id = $anId;\n        $this->body = $aBody;\n        $this->createdAt\
  \ = $createdAt ?: new \\DateTime();\n    }\n\n    public function editBody(Body\
  \ $aNewBody)\n    {\n        if ($this->editExpired()) {\n            throw new\
  \ \\RuntimeException('Edit time expired');\n        }\n        $this->body = $aNewBody;\n\
  \    }\n\n    private function editExpired()\n    {\n        $expiringTime = $this->createdAt->getTimestamp()\
  \ + self::EXPIRE_EDIT_TIME;\n        return $expiringTime < time();\n    }\n\n \
  \   public function id()\n    {\n        return $this->id;\n    }\n\n    public\
  \ function body()\n    {\n        return $this->body;\n    }\n\n    public function\
  \ createdAt()\n    {\n        return $this->createdAt;\n    }\n}\n\nclass Body\n\
  {\n    const MIN_LENGTH = 3;\n    const MAX_LENGTH = 250;\n    private $content;\n\
  \n    public function __construct($content)\n    {\n        $this->setContent(trim($content));\n\
  \    }\n\n    private function setContent($content)\n    {\n        $this->assertNotEmpty($content);\n\
  \        $this->assertFitsLength($content);\n        $this->content = $content;\n\
  \    }\n\n    private function assertNotEmpty($content)\n    {\n        if (empty($content))\
  \ {\n            throw new \\DomainException('Empty body');\n        }\n    }\n\n\
  \    private function assertFitsLength($content)\n    {\n        if (strlen($content)\
  \ < self::MIN_LENGTH) {\n            throw new \\DomainException('Body is too sort');\n\
  \        }\n        if (strlen($content) > self::MAX_LENGTH) {\n            throw\
  \ new \\DomainException('Body is too long');\n        }\n    }\n\n    public function\
  \ content()\n    {\n        return $this->content;\n    }\n}\n\nclass PostId\n{\n\
  \    private $id;\n    public function __construct($id = null)\n    {\n        $this->id\
  \ = $id ?: uniqid();\n    }\n\n    public function id()\n    {\n        return $this->id;\n\
  \    }\n\n    public function equals(PostId $anId)\n    {\n        return $this->id\
  \ === $anId->id();\n    }\n}\n```\n\n如果我们想持久化这个 `Post` 实体，可以创建一个如下简单的内存 `Post 仓库`（Post\
  \ Repository）：\n\n```php\nclass SimplePostRepository\n{\n    private $post = [];\n\
  \n    public function add(Post $aPost)\n    {\n        $this->posts[(string) $aPost->id()]\
  \ = $aPost;\n    }\n\n    public function postOfId(PostId $anId)\n    {\n      \
  \  if (isset($this->posts[(string) $anId])) {\n            return $this->posts[(string)\
  \ $anId];\n        }\n        return null;\n    }\n}\n```\n\n而且，正如你预期的那样，它被处理为一个集合：\n\
  \n```php\n$id = new PostId();\n$repository = new SimplePostRepository();\n$repository->add(new\
  \ Post($id, 'Random content'));\n// later ...\n$post = $repository->postOfId($id);\n\
  $post->editBody('Updated content');\n// even later ...\n$post = $repository->postOfId($id);\n\
  assert('Updated content' === $post->body());\n```\n\n如你所示，从集合的角度来看，仓库中不需要 `save`\
  \ 方法。影响对象的更改由持久化层正确处理。第一步是为你的仓库定义一个类似集合的接口。\n\n```php\ninterface PostRepository\n\
  {\n    public function add(Post $aPost);\n    public function addAll(array $posts);\n\
  \    public function remove(Post $aPost);\n    public function removeAll(array $posts);\n\
  \    // ...\n}\n```\n\n接口定义应该放置在聚合根使用的同一个模块中。有时 `remove` 并不是真正的聚合删除。在某些情况下，你需要为了法律目的或商业智能保留信息。在这种情况下，你可以将聚合根标记为禁用或逻辑删除。相应地更新接口，移除删除方法或在仓库中提供禁用行为。\n\
  \n仓库另一个重要部分是查找方法，例如：\n\n```php\ninterface PostRepository\n{\n    // ...\n    /**\n\
  \     * @return Post\n     */\n    public function postOfId(PostId $anId);\n\n \
  \   /**\n     * @return array[]\n     */\n    public function latestPosts(\\DateTime\
  \ $sinceADate);\n}\n```\n\n并且，为了获取全局唯一 ID，一个逻辑位置是：\n\n```php\ninterface PostRepository\n\
  {\n    // ...\n    /**\n     * @return PostId\n     */\n    public function nextIdentity();\n\
  }\n```\n\n构建每个 `Post` 实例的代码调用 `nextIdentity()` 来获取唯一标识 `PostId`。\n\n```php\n$post\
  \ = new Post($postRepository->nextIdentity(), $body);\n```\n\n### 10.4.1 内存实现\n\n\
  正如 Uncle Bob 在[尖叫式架构](http://blog.8thlight.com/uncle-bob/2011/09/30/Screaming-Architecture.html)²\
  \ 中写道\n\n良好的软件架构允许对框架、数据库、Web 服务器以及其他环境问题和工具的决策被推迟和延迟。\n\n\n\n\n或者使用 MySql，直到项目后期才这样做。良好的架构也能让你轻松地对这些决策做出改变。良好的架构强调用例，并将其与外围关注点解耦。\n\
  \n在应用程序的早期，快速的内存实现可能会大有用场。你可以用它来完善系统的其他部分，允许你将数据库决策推到合适的时机。内存仓库简单、快速且易于实现。对于我们的\
  \ `Post` 仓库，一个内存哈希表（hash-map）就足够提供我们所需的所有功能。[`blog.8thlight.com/uncle-bob/2011/09/30/Screaming-Architecture.html`](http://blog.8thlight.com/uncle-bob/2011/09/30/Screaming-Architecture.html)\n\
  \n### 仓库 (209)\n\n```php\nnamespace Infrastructure\\Persistence\\InMemory;\n\nuse\
  \ Domain\\Model\\Post;\nuse Domain\\Model\\PostId;\nuse Domain\\Model\\PostRepository;\n\
  \nclass InMemoryPostRepository implements PostRepository\n{\n    private $posts\
  \ = [];\n\n    public function add(Post $aPost)\n    {\n        $this->posts[$aPost->id()->id()]\
  \ = $aPost;\n    }\n\n    public function remove(Post $aPost)\n    {\n        unset($this->posts[$aPost->id()->id()]);\n\
  \    }\n\n    public function postOfId(PostId $anId)\n    {\n        if (isset($this->posts[$anId->id()]))\
  \ {\n            return $this->posts[$anId->id()];\n        }\n        return null;\n\
  \    }\n\n    public function latestPosts(\\DateTime $sinceADate)\n    {\n     \
  \   return $this->filterPosts(\n            function(Post $post) use ($sinceADate)\
  \ {\n                return $post->createdAt() > $sinceADate;\n            }\n \
  \       );\n    }\n\n    private function filterPosts(callable $fn)\n    {\n   \
  \     return array_values(array_filter($this->posts, $fn));\n    }\n\n    public\
  \ function nextIdentity()\n    {\n        return new PostId();\n    }\n}\n```\n\n\
  ### 10.4.2 Doctrine ORM\n\n[Doctrine](http://www.doctrine-project.org/) 是一组用于数据库存储和对象映射的库。它默认与流行的\
  \ [Symfony 2 web 框架](http://symfony.com/) 一起包含，除了其他功能外，得益于 [Data Mapper 模式](http://martinfowler.com/eaaCatalog/dataMapper.html)，它允许你轻松地将应用程序与持久层解耦。\n\
  \n对象关系映射器（ORM）建立在一个强大的数据库抽象层之上，该层通过一种名为 Doctrine Query Language（DQL）的 SQL 方言进行数据库交互，其灵感来源于著名的\
  \ Java Hibernate 框架。\n\n如果我们打算使用 Doctrine ORM，要完成的第一任务是通过 [Composer](https://getcomposer.org/)\
  \ 为项目添加依赖项：\n\n```bash\ncomposer require doctrine/orm:~2.4\n```\n\n### 10.4.2.1\
  \ 对象映射\n\n领域对象与数据库之间的映射可以被视为一种实现细节。领域生命周期不应该感知这些持久化细节。因此，映射信息应该定义为基础设施层的一部分，位于领域之外，并作为仓库的实现。\n\
  \n##### 10.4.2.1.1 Doctrine 自定义映射类型\n\n由于我们的 `Post` 实体是由 `Body` 或 `PostId` 等值对象组成的，因此为它们创建自定义映射类型是一个好主意。这会让对象映射变得简单得多。\n\
  \n仓库 (211)\n\n```php\nnamespace Infrastructure\\Persistence\\Doctrine\\Types;\n\n\
  use Doctrine\\DBAL\\Types\\Type;\nuse Doctrine\\DBAL\\Platforms\\AbstractPlatform;\n\
  use Domain\\Model\\Body;\n\nclass BodyType extends Type\n{\n    public function\
  \ getSQL(array $fieldDeclaration, AbstractPlatform $platform)\n    {\n        return\
  \ $platform->getVarcharType($fieldDeclaration);\n    }\n\n    public function convertToPHP($value,\
  \ AbstractPlatform $platform)\n    {\n        return new Body($value);\n    }\n\n\
  \    public function convertToDatabase($value, AbstractPlatform $platform)\n   \
  \ {\n        return $value;\n    }\n\n    public function getName()\n    {\n   \
  \     return 'body';\n    }\n}\n```\n\n仓库 (212)\n\n```php\nnamespace Infrastructure\\\
  Persistence\\Doctrine\\Types;\n\nuse Doctrine\\DBAL\\Types\\Type;\nuse Doctrine\\\
  DBAL\\Platforms\\AbstractPlatform;\nuse Domain\\Model\\PostId;\n\nclass PostIdType\
  \ extends Type\n{\n    public function getSQL(array $fieldDeclaration, AbstractPlatform\
  \ $platform)\n    {\n        return $platform->getGuidType($fieldDeclaration);\n\
  \    }\n\n    public function convertToPHP($value, AbstractPlatform $platform)\n\
  \    {\n        return new PostId($value);\n    }\n\n    public function convertToDatabase($value,\
  \ AbstractPlatform $platform)\n    {\n        return $value;\n    }\n\n    public\
  \ function getName()\n    {\n        return 'post_id';\n    }\n}\n```\n\n不要忘记实现\
  \ `PostId` 值对象。\n\n### 10.4.2.1.2 XML 映射\n\nDoctrine 提供了多种映射格式，如 YAML、XML 或注解。\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<doctrine-mapping xmlns=\"\
  http://doctrine-project.org/schemas/orm\"\n    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  \n    xsi:schemaLocation=\"http://doctrine-project.org/schemas/orm\n    https://raw.githubusercontent.com/doctrine/master/mapping.xsd\"\
  >\n    <entity name=\"Domain\\Model\\Post\" table=\"posts\">\n        <id name=\"\
  id\" type=\"post_id\">\n            <generator strategy=\"NONE\"/>\n        </id>\n\
  \        <field name=\"body\" type=\"body\" length=\"250\" column=\"body\"/>\n \
  \       <field name=\"createdAt\" type=\"datetime\" column=\"created_at\"/>\n  \
  \  </entity>\n</doctrine-mapping>\n```\n\n### 10.4.2.2 Entity Manager\n\n`EntityManager`\
  \ 是 ORM 功能的中心访问点，它的初始化非常简单仓库 (214)：\n\n```php\nuse Doctrine\\DBAL\\Types\\Type;\n\
  use Doctrine\\ORM\\EntityManager;\nuse Doctrine\\ORM\\Tools;\n\nType::addType('post_id',\
  \ 'Infrastructure\\Persistence\\Doctrine\\Types\\PostIdType');\nType::addType('body',\
  \ 'Infrastructure\\Persistence\\Doctrine\\Types\\BodyType');\n\n$entityManager =\
  \ EntityManager::create([\n    'driver' => 'pdo_sqlite',\n    'path' => __DIR__\
  \ . '/db.sqlite',\n], Tools::createXMLConfiguration(\n    ['/Path/To/Infrastructure/Mapping'],\n\
  \    true\n));\n```\n\n根据你的需要进行配置。\n\n### 10.4.2.3 DQL 实现\n\n在这个仓库的情况下，我们只需要 `EntityManager`\
  \ 直接从数据库检索领域对象仓库 (215)：\n\n```php\nnamespace Infrastructure\\Persistence\\Doctrine;\n\
  \nuse Doctrine\\ORM\\EntityManager;\nuse Domain\\Model\\Post;\nuse Domain\\Model\\\
  PostId;\nuse Domain\\Model\\PostRepository;\n\nclass DoctrinePostRepository implements\
  \ PostRepository\n{\n    protected $em;\n\n    public function __construct(EntityManager\
  \ $em)\n    {\n        $this->em = $em;\n    }\n\n    public function add(Post $aPost)\n\
  \    {\n        $this->em->persist($aPost);\n    }\n\n    public function remove(Post\
  \ $aPost)\n    {\n        $this->em->remove($aPost);\n    }\n\n    public function\
  \ postOfId(PostId $anId)\n    {\n        return $this->em->find('Domain\\Model\\\
  Post', $anId);\n    }\n\n    public function latestPosts(\\DateTime $sinceADate)\n\
  \    {\n        return $this->em->createQueryBuilder()\n            ->select('p')\n\
  \            ->from('Domain\\Model\\Post', 'p')\n            ->where('p.createdAt\
  \ > :since')\n            ->setParameter('since', $sinceADate)\n            ->getQuery();\n\
  \    }\n}\n```\n\n\n\n\n\n```php\n->setParameter(':since', $sinceADate)\n\n->getQuery()\n\
  \n->getResult();\n\n}\n\npublic function nextIdentity()\n{\n\n    return new PostId();\n\
  }\n\n}\n```\n\n### 10.5 面向持久化\n\n在某些情况下，面向集合的仓库（collection-oriented repositories）与我们的持久化机制并不契合。如果你没有工作单元（unit\
  \ of work），跟踪聚合（Aggregate）的变化将一项困难的任务。持久化此类更改的唯一方法是显式地调用 save。\n\n面向持久化的仓库的接口定义与你定义一个面向集合的等价物类似。\n\
  \n### 仓库 216\n\n```php\ninterface PostRepository\n{\n    public function nextIdentity();\n\
  \    public function postOfId(PostId $anId);\n    public function save(Post $aPost);\n\
  \    public function saveAll(array $posts);\n    public function remove(Post $aPost);\n\
  \    public function removeAll(array $posts);\n}\n```\n\n在这种情况下，我们现在拥有了 `save` 和\
  \ `saveAll` 方法。它们提供了与之前的 `add` 和 `addAll` 方法相似的功能，然而重要的区别在于客户端使用它们的方式。\n\n在面向集合的风格中，你只会在创建聚合时使用一次\
  \ `add` 方法。在面向持久化的风格中，你不仅会在创建聚合后使用 `save` 动作，在修改它们时也会使用。\n\n```php\n$post = new\
  \ Post(/* ... */);\n\n$postRepository->save($post);\n\n// 之后 ...\n\n$post = $postRepository->postOfId($postId);\n\
  \n$post->editBody(new Body('New body!'));\n\n$postRepository->save($post);\n```\n\
  \n除了此差异外，细节仅存在于实现中。\n\n### 10.5.1 Redis 实现\n\n[Redis](http://redis.io/⁷⁷) 是一种极速的内存键值对存储，可以作为缓存或存储。根据情况，我们可以考虑将\
  \ Redis 作为我们聚合的存储器。\n\n要开始使用，请确保你有一个用于连接 Redis 的 PHP 客户端。一个很好的选择是 [Predis](https://github.com/nrk/predis)。\n\
  \n```bash\ncomposer require predis/predis:~1.0\n```\n\n⁷ [`redis.io/`](http://redis.io/)\n\
  ⁸ [`github.com/nrk/predis`](https://github.com/nrk/predis)\n\n### 仓库 217\n\n```php\n\
  namespace Infrastructure\\Persistence\\Redis;\n\nuse Domain\\Model\\Post;\nuse Domain\\\
  Model\\PostId;\nuse Domain\\Model\\PostRepository;\nuse Predis\\Client;\n\nclass\
  \ RedisPostRepository implements PostRepository\n{\n    private $client;\n\n   \
  \ public function __construct(Client $client)\n    {\n        $this->client = $client;\n\
  \    }\n\n    public function save(Post $aPost)\n    {\n        $this->client->hset('posts',\
  \ (string) $aPost->id(), serialize($aPost));\n    }\n\n    public function remove(Post\
  \ $aPost)\n    {\n        $this->client->hdel('posts', (string) $aPost->id());\n\
  \    }\n\n    public function postOfId(PostId $anId)\n    {\n        if ($data =\
  \ $this->client->hget('posts', (string) $anId)) {\n            return unserialize($data);\n\
  \        }\n        return null;\n    }\n\n    public function latestPosts(\\DateTime\
  \ $sinceADate)\n    {\n        $latest = $this->filterPosts(\n            function(Post\
  \ $post) use ($sinceADate) {\n                return $post->createdAt() > $sinceADate;\n\
  \            }\n        );\n\n        $this->sortByCreatedAt($latest);\n       \
  \ return array_values($latest);\n    }\n\n    private function filterPosts(callable\
  \ $fn)\n    {\n        return array_filter(array_map(function($data) {\n       \
  \     return unserialize($data);\n        }, $this->client->hgetall('posts')), $fn);\n\
  \    }\n\n    private function sortByCreatedAt(&$posts)\n    {\n        usort($posts,\
  \ function(Post $a, Post $b) {\n            if ($a->createdAt() == $b->createdAt())\
  \ {\n                return 0;\n            }\n            return ($a->createdAt()\
  \ < $b->createdAt()) ? -1 : 1;\n        });\n    }\n\n    public function nextIdentity()\n\
  \    {\n        return new PostId();\n    }\n}\n```\n\n### 10.5.2 SQL 实现\n\n在一个经典示例中，我们可以仅通过使用原生\
  \ SQL 查询为我们的 `PostRepository` 创建一个简单的 [PDO](http://php.net/manual/en/book.pdo.php⁹⁹）实现。\n\
  \n⁹ [`php.net/manual/en/book.pdo.php`](http://php.net/manual/en/book.pdo.php)\n\n\
  ### 仓库 219\n\n```php\nnamespace Infrastructure\\Persistence\\Sql;\n\nuse Domain\\\
  Model\\Body;\nuse Domain\\Model\\Post;\nuse Domain\\Model\\PostId;\nuse Domain\\\
  Model\\PostRepository;\n\nclass SqlPostRepository implements PostRepository\n{\n\
  \    const DATE_FORMAT = 'Y-m-d H:i:s';\n    private $pdo;\n\n    public function\
  \ __construct(\\PDO $pdo)\n    {\n        $this->pdo = $pdo;\n    }\n\n    public\
  \ function save(Post $aPost)\n    {\n        $sql = 'INSERT INTO posts (id, body,\
  \ created_at) VALUES (:id, :body, :created_at)';\n        $this->execute($sql, [\n\
  \            'id' => $aPost->id()->id(),\n            'body' => $aPost->body()->content(),\n\
  \            'created_at' => $aPost->createdAt()->format(self::DATE_FORMAT)\n  \
  \      ]);\n    }\n\n    private function execute($sql, array $parameters)\n   \
  \ {\n        $st = $this->pdo->prepare($sql);\n        $st->execute($parameters);\n\
  \        return $st;\n    }\n\n    public function remove(Post $aPost)\n    {\n\
  \        $this->execute('DELETE FROM posts WHERE id = :id', [\n            'id'\
  \ => $aPost->id()->id()\n        ]);\n    }\n\n    public function postOfId(PostId\
  \ $anId)\n    {\n        $st = $this->execute('SELECT * FROM posts WHERE id = :id',\
  \ [\n            'id' => $anId->id()\n        ]);\n        if ($row = $st->fetch(\\\
  PDO::FETCH_ASSOC)) {\n            return $this->buildPost($row);\n        }\n  \
  \      return null;\n    }\n\n    private function buildPost($row)\n    {\n    \
  \    return new Post(\n            new PostId($row['id']),\n            new Body($row['body']),\n\
  \            new \\DateTime($row['created_at'])\n        );\n    }\n\n    public\
  \ function latestPosts(\\DateTime $sinceADate)\n    {\n        return $this->retrieveAll('SELECT\
  \ * FROM posts WHERE created_at > :since_date', [\n            'since_date' => $sinceADate->format(self::DATE_FORMAT)\n\
  \        ]);\n    }\n\n    private function retrieveAll($sql, array $parameters\
  \ = [])\n    {\n        $st = $this->pdo->prepare($sql);\n        $st->execute($parameters);\n\
  \        return array_map(function($row) {\n            return $this->buildPost($row);\n\
  \        }, $st->fetchAll(\\PDO::FETCH_ASSOC));\n    }\n\n    public function nextIdentity()\n\
  \    {\n        return new PostId();\n    }\n\n    public function size()\n    {\n\
  \        return $this->pdo->query('SELECT COUNT(*) FROM posts')->fetchColumn();\n\
  \    }\n}\n```\n\n由于我们没有任何映射配置，在同一个类中有一个针对架构的初始化方法将非常有用。*变化在一起应该保持在一起*。\n\n```php\n\
  class SqlPostRepository implements PostRepository\n{\n    // ...\n    public function\
  \ initSchema()\n    {\n        $this->pdo->exec<<<SQL\nDROP TABLE IF EXISTS posts;\n\
  CREATE TABLE posts (\n    id CHAR(36) PRIMARY KEY,\n    body VARCHAR(250) NOT NULL,\n\
  \    created_at DATETIME NOT NULL\n)\nSQL\n);\n    }\n}\n```\n\n### 10.6 额外行为\n\n\
  为仓库添加额外行为可能是非常有益的，例如计算给定集合中所有项的能力。你可能会考虑添加一个名为 `count` 的方法，然而，由于我们正在尝试模拟集合，更好的名称将是\
  \ `size`。\n\n### 仓库 222\n\n```php\ninterface PostRepository\n{\n    // ...\n   \
  \ public function size();\n}\n```\n\n对应的实现可能是这样的：\n\n```php\nclass DoctrinePostRepository\
  \ implements PostRepository\n{\n    // ...\n    public function size()\n    {\n\
  \        return $this->em->createQueryBuilder()\n            ->select('count(p.id)')\n\
  \            ->from('Domain\\Model\\Post', 'p')\n            ->getQuery()\n    \
  \        ->getSingleScalarResult();\n    }\n}\n```\n\n你还可以将计算封装到仓库中，以及与数据存储相关的优化的查询/存储过程。然而，所有行为仍然应该遵循仓库的集合特征。鼓励尽可能将逻辑移动到领域特定的无状态领域服务中，而不是简单地将这些职责添加到仓库。\n\
  \n在某些情况下，你不需要整个聚合就可以访问少量信息。为了解决这个问题，你可以添加仓库方法来作为快捷方式访问这些信息。你应该确保只访问那些通过导航聚合根可以获取的数据。\n\
  \n\n\n\n你不应该允许访问 `Aggregate Roots` 的私有和内部区域，因为这将违反既定的契约规定。\n\n对于某些用例，你可能需要非常特定的查询，这些查询是由多个\
  \ `Aggregate` 类型组合成的，每个类型返回特定的信息。这些查询可以运行并作为单个 `Value Object` 返回。仓库返回 `Value Objects`\
  \ 是非常常见的现象。\n\n如果你发现自己正在创建许多针对用例优化的查找器方法，你可能引入了常见的代码气味（code smell）。这可能表明 `Aggregate`\
  \ 边界判断有误。然而，如果你确定边界是正确的，那么可能是时候探索 `CQRS` 了。\n\n# 10.7 查询存储库\n\n从比较的角度来看，如果我们考虑查询能力，存储库（repositories）与集合（`Collection`）不同。`Repository`\
  \ 处理的是大型对象，这些对象在执行查询时通常不在内存中。将领域对象的所有实例加载到内存中并对它们进行查询是不可行的。\n\n一个良好的解决方案是传递一个准则（criterion），并让\
  \ `Repository` 处理实现细节以成功执行操作。它可能会将准则转换为 `SQL`、`ORM` 查询或遍历内存中的集合，这并不重要，实现层会处理。\n\n\
  ## 10.7.1 规格模式\n\n准则对象的常见实现是 `Specification Pattern`（规格模式）。规格只是一个简单的谓词，它接收一个领域对象并返回一个布尔值。给定一个领域对象，如果它符合（`specifies`）该规格，则返回\
  \ true，否则返回 false。\n\n```php\ninterface PostSpecification\n{\n    /**\n     * @return\
  \ boolean\n     */\n    public function specifies(Post $aPost);\n}\n```\n\n我们只需要为我们的存储库添加一个查询方法。\n\
  \n```php\ninterface PostRepository\n{\n    //...\n    public function query($specification);\n\
  }\n```\n\n### 10.7.1.1 内存实现\n\n作为一个示例，如果我们想通过使用 `Specification` 的内存实现，在 `PostRepository`\
  \ 中重现 `latestPosts` 查询方法：\n\n```php\nnamespace Infrastructure\\Persistence\\InMemory;\n\
  \nuse Domain\\Model\\Post;\n\ninterface InMemoryPostSpecification\n{\n    /**\n\
  \     * @return boolean\n     */\n    public function specifies(Post $aPost);\n\
  }\n```\n\n`latestPosts` 行为的内存实现如下：\n\n```php\nnamespace Infrastructure\\Persistence\\\
  InMemory;\n\nuse Domain\\Model\\Post;\n\nclass InMemoryLatestPostSpecification implements\
  \ InMemoryPostSpecification\n{\n    private $since;\n\n    public function __construct(\\\
  DateTime $since)\n    {\n        $this->since = $since;\n    }\n\n    public function\
  \ specifies(Post $aPost)\n    {\n        return $aPost->createdAt() > $this->since;\n\
  \    }\n}\n```\n\n我们的存储库实现的查询方法可能看起来所示：\n\n```php\nclass InMemoryPostRepository\
  \ implements PostRepository\n{\n    // ...\n\n    /**\n     * @param InMemoryPostSpecification\
  \ $specification\n     * @return Post[]\n     */\n    public function query($specification)\n\
  \    {\n        return $this->filterPosts(\n            function(Post $post) use\
  \ ($specification) {\n                return $specification->specifies($post);\n\
  \            }\n        );\n    }\n}\n```\n\n从存储库中检索所有最新文章只需创建上述实现的定制实例即可简单：\n\n\
  ```php\n$latestPosts = $postRepository->query(\n    new InMemoryLatestPostSpecification(new\
  \ \\DateTime('-24'))\n);\n```\n\n### 10.7.1.2 SQL 实现\n\n标准的 `Specification` 对于内存实现效果良好。然而，由于在\
  \ `SQL` 实现中我们没有预先将所有领域对象加载到内存中，对于这些情况我们需要更具体的规格。\n\n```php\nnamespace Infrastructure\\\
  Persistence\\Sql;\n\ninterface SqlPostSpecification\n{\n    /**\n     * @return\
  \ string\n     */\n    public function toSqlClauses();\n}\n```\n\n该规格的 SQL 实现可能如下：\n\
  \n```php\nnamespace Infrastructure\\Persistence\\Sql;\n\nclass SqlLatestPostSpecification\
  \ implements SqlPostSpecification\n{\n    private $since;\n\n    public function\
  \ __construct(\\DateTime $since)\n    {\n        $this->since = $since;\n    }\n\
  \n    public function toSqlClauses()\n    {\n        return \"created_at > '\" .\
  \ $this->since->format('Y-m-d H:i:s') . \"'\";\n    }\n}\n```\n\n以及如何查询 `SQL` 实现：\n\
  \n```php\nclass SqlPostRepository implements PostRepository\n{\n    //...\n\n  \
  \  public function query($specification)\n    {\n        $st = $this->pdo->prepare(\"\
  SELECT * FROM posts \" . $specification->toSqlClauses());\n        $st->execute($parameters);\n\
  \        return $st->fetchAll(\\PDO::FETCH_ASSOC);\n    }\n}\n```\n\n# 10.8 管理事务\n\
  \n`Domain Model`（领域模型）不是管理事务的地方。解决此问题的常用方法是在应用层（Application Layer）放置一个 `Facade`，将相关的用例组合在一起。当从用户界面调用\
  \ `Facade` 时，它会开启事务。完成后，`Facade` 通过提交事务结束交互。如果发生任何错误，事务将回滚。\n\n```php\nuse Doctrine\\\
  ORM\\EntityManager;\n\nclass ServiceFacade\n{\n    private $em;\n\n    public function\
  \ __construct(EntityManager $em)\n    {\n        $this->em = $em;\n    }\n\n   \
  \ public function doUseCaseTask()\n    {\n        try {\n            $this->em->getConnection()->beginTransaction();\n\
  \            // 使用领域模型\n            $this->em->getConnection()->commit();\n    \
  \    } catch (Exception $e) {\n            $this->em->getConnection()->rollback();\n\
  \            throw $e;\n        }\n    }\n}\n```\n\n使用 facade 引入的问题是，我们需要不断重复相同的样板代码。如果我们统一执行用例的方式，可以使用\
  \ `Decorator Pattern`（装饰器模式）将它们封装在事务中。\n\n```php\ninterface ApplicationService\n\
  {\n    /**\n     * @param $request\n     * @return mixed\n     */\n    public function\
  \ execute($request = null);\n}\n\nclass SomeApplicationService implements ApplicationService\n\
  {\n    public function execute($request = null)\n    {\n        // 执行某些操作\n    }\n\
  }\n```\n\n使任何应用服务支持事务的装饰器实现如下：\n\n```php\ninterface TransactionalSession\n{\n  \
  \  /**\n     * @param callable $operation\n     * @return mixed\n     */\n    public\
  \ function executeAtomically(callable $operation);\n}\n\nclass TransactionalApplicationService\
  \ implements ApplicationService\n{\n    private $session;\n    private $service;\n\
  \n    public function __construct(\n        ApplicationService $service,\n     \
  \   TransactionalSession $session\n    ) {\n        $this->session = $session;\n\
  \        $this->service = $service;\n    }\n\n    public function execute($request\
  \ = null)\n    {\n        $operation = function () use ($request) {\n          \
  \  return $this->service->execute($request);\n        };\n\n        return $this->session->executeAtomically($operation->bindTo($this));\n\
  \    }\n}\n```\n\n在此之后，我们也可以地创建一个 `Doctrine` 事务会话实现：\n\n```php\nclass DoctrineSession\
  \ implements TransactionalSession\n{\n    private $entityManager;\n}\n```\n\n\n\n\
  \n\n```php\npublic function __construct(EntityManager $entityManager)\n{\n    $this->entityManager\
  \ = $entityManager;\n}\n\npublic function executeAtomically(callable $operation)\n\
  {\n    return $this->entityManager->transactional($operation);\n}\n}\n```\n\n现在我们已经拥有了在事务中执行用例的所有条件。\n\
  \n### 仓库（第 230 页）\n\n```php\n$useCase = new TransactionalApplicationService(\n \
  \   new SomeApplicationService(\n        // ...\n    ),\n    new DoctrineSession(\n\
  \        // ...\n    )\n);\n$response = $useCase->execute();\n```\n\n### 10.9 测试仓库\n\
  \n为了确保仓库在生产环境中正常工作，你需要测试它的实现。为了做到这一点，我们必须测试系统的边界，确保我们的预期是正确的。\n\n在 Doctrine 测试案例中，设置会稍微复杂一些\n\
  \n```php\nuse Doctrine\\DBAL\\Types\\Type;\nuse Doctrine\\ORM\\EntityManager;\n\
  use Doctrine\\ORM\\Tools;\nuse Domain\\Model\\Post;\n\nclass DoctrinePostRepositoryTest\
  \ extends \\PHPUnit_Framework_TestCase\n{\n    private $postRepository;\n\n    public\
  \ function setUp()\n    {\n        $this->postRepository = $this->createPostRepository();\n\
  \    }\n\n    private function createPostRepository()\n    {\n        $this->addCustomTypes();\n\
  \        $em = $this->initEntityManager();\n        $this->initSchema($em);\n  \
  \      return new PrecociousDoctrinePostRepository($em);\n    }\n```\n\n### 仓库（第\
  \ 231 页）\n\n```php\n    private function addCustomTypes()\n    {\n        if (!Type::hasType('post_id'))\
  \ {\n            Type::addType('post_id', 'Infrastructure\\Persistence\\Doctrine\\\
  Types\\PostIdType');\n        }\n        if (!Type::hasType('body')) {\n       \
  \     Type::addType('body', 'Infrastructure\\Persistence\\Doctrine\\Types\\BodyType');\n\
  \        }\n    }\n\n    protected function initEntityManager()\n    {\n       \
  \ return EntityManager::create(\n            ['url' => 'sqlite:///:memory:'],\n\
  \            Tools\\Setup::createXMLMetadataConfiguration(\n                ['/Path/To/Infrastructure/Persistence/Doctrine/Mapping'],\n\
  \                $devMode = true\n            )\n        );\n    }\n\n    private\
  \ function initSchema(EntityManager $em)\n    {\n        $tool = new Tools\\SchemaTool($em);\n\
  \        $tool->createSchema([\n            $em->getClassMetadata('Domain\\Model\\\
  Post')\n        ]);\n    }\n    //...\n}\n```\n\n### 仓库（第 232 页）\n\n```php\nclass\
  \ PrecociousDoctrinePostRepository extends DoctrinePostRepository\n{\n    public\
