  \ `Nginx` 或 `Varnish` 等额外的中间件才能运行。\n\n### 11.3.5.3 Symfony 子请求\n\n如果你使用 Symfony，子请求](http://symfony.com/doc/current/components/http_kernel/introduction.html#sub-requests)⁸\
  \ 可能是一个很有趣的选择。从 Symfony 站点提取的内容：除了发送到 `HttpKernel::handle()` 的主请求外，你还可以发送所谓的子请求。子请求的外观和行为与任何其他请求都一样，但通常用于渲染页面的一个小部分，而不是整个页面。你最常见是从你的控制器（controller）中（或者可能从由你的控制器渲染的模板内部）发起子请求。这创建了另一个完整的请求-响应周期，其中这个新的\
  \ `Request` 被转换为 `Response`。内部唯一的区别是，某些监听器（例如安全）可能只对主请求生效。每个监听器都会接收到 `KernelEvent`\
  \ 的子类，可以通过它的 `isMasterRequest()` 来检查当前请求是主请求还是子请求。\n\n这非常棒，因为你可以在不产生 AJAX 性能损耗或无需复杂的\
  \ ESI 配置的情况下，获得调用独立应用程序服务带来的益处。\n\n### 11.3.5.4 一个控制器，多个应用服务\n\n最后一个选项可能是在同一个控制器中管理多个应用服务。控制器的逻辑可能会变得有点混乱。它将处理并合并响应以传递给视图。\n\
  \n### 11.4 测试\n\n由于你对测试应用服务本身的行为（behaviour）感兴趣，因此没有将其转换为具有复杂设置且针对真实数据库的集成测试（Integration\
  \ Test）。你对测试低级细节并不感兴趣。大多数情况下，一个单元测试（Unit Test）就足够了。\n\n⁶[`en.wikipedia.org/wiki/Hijax`](https://en.wikipedia.org/wiki/Hijax)\n\
  ⁷[`en.wikipedia.org/wiki/Edge\\_Side\\_Includes`](https://en.wikipedia.org/wiki/Edge_Side_Includes)\n\
  ⁸[`symfony.com/doc/current/components/http\\_kernel/introduction.html#sub-requests`](http://symfony.com/doc/current/components/http_kernel/introduction.html#sub-requests)\n\
