  \n# 测试评分想法的用例 (UseCase)\n\nMichael Feathers 将遗留代码定义为`没有测试的代码`。你不希望你的代码从出生那起就成为遗留代码，对吧？\n\
  \n为了对这个 `UseCase` 对象进行单元测试，你决定从简单的部分开始：如果仓库不可用会怎样？我们如何生成这种行为？我们需要在运行单元测试时停止我们的 `Redis`\
  \ 服务器吗？不需要。我们需要一个具有这种行为的对象。让我们使用列表 9 中的 `mock`（模拟）对象。\n\n```php\nclass RateIdeaUseCaseTest\
  \ extends PHPUnit_Framework_TestCase\n{\n    /**\n     * @test\n     */\n    public\
