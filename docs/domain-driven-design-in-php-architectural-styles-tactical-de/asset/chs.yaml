  \ni\n\n## 前序\n\n自 2012 年起，在经历了两年阅读和实践领域驱动设计（DDD）方法后，2014 年，Christian 和 Carlos 去了柏林接受了《实现领域驱动设计》一书作者\
  \ Vaughn Vernon 的培训。培训非常精彩，直到那一刻他们脑海中浮现的所有概念，在为期三天的 IDDD 研讨会上得到了扎根。然而，在那个满是 Java\
  \ 和 .NET 开发者的房间里，他们是两个 PHP 开发者。这确实挺有趣的。\n\n四年后的 2016 年，Vaughn 在他们的帮助下在巴塞罗尼亚了他的研讨会。\n\
  \n2014 年，Carlos 向 `php[tek]` 发了一篇关于六边形架构的论文。他的演讲没有通过，但 Eli White 与他联系。你有兴趣为 `php|arch`\
  \ 杂志写一篇关于六边形架构的文章吗？太棒了！于是在 2014 年 6 月，“基于 PHP 的六边形架构”出版了。你可以在附录中找到它。\n\n这篇文章这本书的开始。Christian\
  \ 对这本书背后的想法感到兴奋，并决定从第一章就开始参与。然后，我们遇到了 Keyvan，这位推动这一具有挑战性目标的第三位参与者。\n\nCarlos 从 20\
  \ 人开始就一直领导着 20 到 100 人的敏捷团队。他自 2010 年起就是认证 Scrum Master，见证许多不同的团队面临编写易于维护代码的挑战。在处理大型团队时，DDD\
  \ 发挥了重要作用。\n\n因此，我们写了这本我们在开始领域驱动设计时想要拥有的书。充满了示例、生产就绪的代码、快捷方式，以及我们根据经验对哪些对我们团队有效、哪些无效给出的建议。我们通过\
  \ DDD 走向了 DDD。\n\n## DDD 与社区\n\n领域驱动设计已经到来。\n\n.\n\nii\n\niii\n\n\n\n## 第 1 章：入门\
  \ DDD\n\n领域驱动设计是关于什么的？它在复杂系统中扮演什么角色？它值得吗？开发者在进入这一领域时需要了解哪些核心概念？\n\n## 第 2 章：架构风格\n\
  \n边界上下文可以通过不同的方式和不同的方法来实现。然而，有两种风格变得越来越流行：六边形架构和 CQRS + ES。在本章中，我们将看到这两种解决方案并理解在使用它们时的关键考虑。\n\
  \n## 第 3 章：值对象\n\n值对象（Value Objects）可能是丰富模型的基础单元。我们将学习它们的属性以及是什么让它们如此重要。我们将检查如何使用\
  \ Doctrine 和自定义 ORM 持久化它们，以及在考虑不可变性的情况下如何验证并妥善测试它们。\n\n## 第 4 章：实体\n\n实体（Entities）是通过\
  \ DDD 的身份构建模块来标识的。我们将看到如何创建和验证它们，如何使用自定义 ORM 和 Doctrine 妥善地映射它们。我们还会回顾注释“是或否”的争议点，以及生成身份的不同策略。\n\
  \n## 第 5 章：领域服务\n\n在本章中，你将学习什么是领域服务以及何时使用它。我们将回顾什么是贫血领域模型（Anemic Domain Models）和丰富领域模型（Rich\
  \ Domain Models）。最后，我们将处理编写领域服务时的基础问题。\n\niv\n\n## 第 6 章：领域事件\n\n领域事件（Domain Events）是一种极佳的反转控制（IoC）机制。在\
  \ DDD 中，它们用于边界上下文之间的异步通信，解耦基础设施和最终一致性。\n\n## 第 7 章：模块\n\n有了如此多的战术构建模块，要知代码中将它们放在哪里有点困难。特别是当你处理像\
  \ Symfony 这样的框架时。我们将检查我们的建议，这种建议对于实践它的团队来说非常有效。\n\n## 第 8 章：聚合根（进行中）\n\n\n\n\n聚合根（Aggregates）可能是战术\
  \ DDD 中困难的部分。我们将介绍在处理它们时的关键概念，以及如何设计它们。我们将看到一个实际场景：在添加一条业务规则时，两个聚合根如何合并为一个，以及其他对象必须如何进行重构。\n\
  \n## 第 9 章：工厂（Factories）（已完成）\n\n工厂方法和工厂对象帮助我们维护业务不变性，这就是为什么它们在 DDD 中如此重要的原因。最后，我们将检查工厂与聚合根之间的关系。\n\
  \n## 第 10 章：存储库（Repositories）（已完成）\n\n存储库是从集合中检索和添加实体（Entities）与聚合根（Aggregates）的关键。我们将回顾不同类型的存储库并学习如何使用\
  \ Doctrine、自定义 ORM 和 Redis 来实现它们。\n\n## 第 11 章：应用服务（Application Services）（已完成）\n\
  \n应用层是连接外部客户端与你领域模型的薄层。在本章中，我们将向你展示如何编写应用服务，使其易于测试并保持轻量。我们将回顾如何准备请求对象、依赖项以及返回结果。\n\
  \n## 第 12 章：集成限界上下文（Integrating Bounded Contexts）（已完成）\n\n我们将探索通信限界上下文的各种战术方法并查看实际实现。我们建议使用\
  \ REST 进行同步通信，并使用 RabbitMQ 进行异步消息传递。\n\n# 前言\n\n## 附录 A：基于 PHP 的六边形架构（Hexagonal\
  \ Architecture）（已完成）\n\n在这里，你将找到由 Carlos Buenosvinos 编写并于 2014 年 6 月发表在 *php|architect*\
  \ 杂志上的原始文章，这是本书的种子。\n\n## 代码与示例\n\n作者在 GitHub.com (https://github.com/dddinphp)\
  \ 创建了一个组织，那里提供了书中的所有代码示例、额外的片段以及一些完整的示例项目。如果你感兴趣，我们强烈建议查看这些项目并提供反馈。\n\n## 致谢\n\n\
