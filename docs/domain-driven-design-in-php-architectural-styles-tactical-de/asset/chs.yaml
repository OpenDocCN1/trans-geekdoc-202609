  \n## 领域服务与通知六边形边缘 (Domain Services and Notification Hexagon Edge)\n\n我们是不是漏掉了什么？“应该通过电子邮件通知作者”，是的！确实如此。让我们看看列表\
  \ 16 中我们是如何更新用于工作的 `UseCase` 的。\n\n```php\nclass RateIdeaUseCase\n{\n    private\
  \ $ideaRepository;\n    private $authorNotifier;\n\n    public function __construct(\n\
  \        IdeaRepository $ideaRepository,\n        AuthorNotifier $authorNotifier\n\
  \    ) {\n        $this->ideaRepository = $ideaRepository;\n        $this->authorNotifier\
  \ = $authorNotifier;\n    }\n\n    public function execute(RateIdeaRequest $request)\n\
  \    {\n        $ideaId = $request->ideaId;\n        $rating = $request->rating;\n\
  \n        try {\n            $idea = $this->ideaRepository->find($ideaId);\n   \
  \     } catch (Exception $e) {\n            throw new RepositoryNotAvailableException();\n\
  \        }\n\n        if (!$idea) {\n            throw new IdeaDoesNotExistException();\n\
  \        }\n\n        try {\n            $idea->addRating($rating);\n          \
  \  $this->ideaRepository->update($idea);\n        } catch (Exception $e) {\n   \
  \         throw new RepositoryNotAvailableException();\n        }\n\n        try\
  \ {\n            $this->authorNotifier->notify(\n                $idea->getAuthor()\n\
  \            );\n        } catch (Exception $e) {\n            throw new NotificationNotSentException();\n\
  \        }\n\n        return $idea;\n    }\n}\n```\n\n正如你所看到的，我们添加了一个新参数来传递 `AuthorNotifier`\
  \ 服务，该服务将向作者发送电子邮件。这就是“端口与适配器”（Ports and Adapters）命名法中的“端口”（port）。我们还更新了 `execute`\
  \ 方法中的业务规则。\n\n仓库（Repositories）并不是唯一可以访问基础设施的对象，它们应该使用接口或抽象类进行解耦。领域服务（Domain Services）也是如此。当领域中某个行为不明确属于任何单一\
  \ `Entity`（实体）时，你应该创建一个领域服务（Domain Service）。一种典型的模式是编写一个抽象的领域服务，它包含一些具体的实现以及另一些由适配器（adapter）实现的抽象方法。\n\
  \n作为一个练习，请为 `AuthorNotifier` 抽象服务的定义实现细节。选项有 `SwiftMailer` 或简单的原始邮件调用。这由你决定。\n\n\
  ## 总结\n\n为了拥有有助于创建易编写和测试应用的*整洁架构*（clean architecture），我们可以使用六边形架构（Hexagonal Architecture）。为了实现这一点，我们将用户故事业务规则封装在\
  \ `UseCase` 或交互器（Interactor）对象内部。我们从框架请求构建 `UseCase` 请求，实例化 `UseCase` 及其所有依赖，然后执行它。我们获取响应并根据响应采取相应行动。如果我们的框架有依赖注入（Dependency\
  \ Injection）组件，你可以使用它来简化代码。\n\n相同的 `UseCase` 对象可以从不同的*交付机制*（delivery mechanisms）使用，以便用户能够从不同的客户端（Web、API、控制台等）访问功能。\n\
  \n对于测试，可以使用表现像所有定义接口的 mock（mocks），这样也可以涵盖特殊情况或错误流。享受这项出色的工作。\n\n## 六边形架构 (Hexagonal\
  \ Architecture)\n\n在几乎所有的博客和书中，你都会找到代表软件不同区域的同心圆图。正如 Robert C. Martin 在他的“整洁架构”文章解释的那样，外圈是你的基础设施所在地。内圈是你的\
  \ `Entities` 所在地。使这种架构生效的覆盖规则是**依赖规则**（The Dependency Rule）。该规则规定源代码的依赖只能指向内部。内圈中的任何内容都无法知道外圈的任何信息。\n\
  \n### 关键点\n\n如果 100% 的单元测试覆盖率对你的应用至关重要，请使用这种方法。此外，如果你能够切换存储策略、Web 框架或任何类型的第三方代码。这种架构对于需要跟上不断变化需求的长期应用特别有用。\n\
