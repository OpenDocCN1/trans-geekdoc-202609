  \n#### 实现\n\n设置一个完全持久化的仓库实现可能过于复杂，并导致执行速度缓慢。你应该关注保持测试的快速。经过整个数据库设置和查询将极大地减慢你的速度。\n\
  \n使用内存中的实现可以帮助将持久化决策推迟到最后。我们可以像以前那样测试它，但这次是使用完整的内存中实现。\n\n### 仓库（第 234 页）\n\n```php\n\
  class MyServiceTest extends \\PHPUnit_Framework_TestCase\n{\n    private $service;\n\
  \n    public function setUp()\n    {\n        $this->service = new MyService(new\
  \ InMemoryRepository());\n    }\n    // ...\n}\n```\n\n### 10.11 总结\n\n仓库是一种作为存储位置的机制。DAO\
  \ 和仓库之间的区别在于，DAO 遵循数据库优先的方法，由于许多低级方法降低了内聚性。面向集合的仓库倾向于更纯领域模型，即使它们持久化了实体。从客户端的角度来看，它看起来就像一个集合（Set）。不需要对对象进行显式的持久化调用。面向持久化的仓库需要显式的持久化调用，因为它们不跟踪变化。我们探索了\
  \ Redis 和原生 SQL。在此过程中，我们发现了规格规范（Specifications）是一种帮助我们在不牺牲灵活性的情况下查询数据库的模式。我们还研究了如何管理事务以及如何使用简单快速的内存实现测试我们的服务。\n\
  \n# 11. 应用\n\n### 11.1 引言\n\n应用层是将领域模型与查询或更改其状态的客户端分离的区域。应用服务是此类构建块。正如 Vaughn Vernon\
  \ 所，“应用服务是领域模型的直接客户端”。你可以将应用服务视为外部世界（HTML 表单、API 客户端、命令行、框架、UI 等）与领域模型本身之间的接触点。\n\
  \n在本章中，我们将探索如何实现应用服务，理解*命令模式*（Command Pattern）的作用并建立应用服务的职责。考虑*注册新用户*的用例。\n\n从概念上说，为了注册新用户，我们需要：\n\
  \n• 从客户端获取电子邮件和密码\n• 检查电子邮件是否已被占用\n• 创建一个新用户\n• 将此新用户添加到现有的用户集中\n\n让我们开始吧。\n\n####\
  \ 11.2 请求\n\n我们需要向应用服务发送*电子邮件*和*密码*。从客户端（HTML 表单、API 客户端甚至命令行）执行此类操作有许多方法。我们可以直接通过方法签名发送标准参数（电邮和密码），或者构建并发送包含这些信息的数据结构。后一种方法（发送一个\
  \ DTO）带来了一些非常有趣的功能。通过发送对象，将将其序列化并通过命令总线进行队列。\n\n\n\n\n\n¹[`martinfowler.com/eaaCatalog/dataTransferObject.html`](http://martinfowler.com/eaaCatalog/dataTransferObject.html)\n\
  \n235\n\n![](img/index-254_1.png)\n\n# Application\n\n236\n\n## 数据传输对象 (Data Transfer\
  \ Object)\n\n`DTO` 是一种在进程之间传递信息的数据结构。不要将其误认为是一个功能完备的对象。`DTO` 除了存储和检索自身数据（访问器和修改器）外，不包含任何行为。`DTOs`\
  \ 是简单的对象，不应该包含任何需要进行测试的业务逻辑。\n\n正如 Vaughn Vernon 所说：\n\n“应用服务的方法签名只使用原始类型（`int`、`strings`\
  \ 等）以及可能用到的 `DTOs`。然而，作为这些方法的方法的替代方案，更好的方法可能是设计 `Command`（命令）对象。这并不一定有对错之分。它主要取决于你的喜好和目标。”\n\
  \n用于存储应用服务所需数据的 `DTO` 实现可能如下：\n\n```php\nnamespace Lw\\Application\\Service\\User;\n\
  \nclass SignUpUserRequest\n{\n    private $email;\n    private $password;\n\n  \
  \  public function __construct($email, $password)\n    {\n        $this->email =\
  \ $email;\n        $this->password = $password;\n    }\n\n    public function email()\n\
  \    {\n        return $this->email;\n    }\n\n    public function password()\n\
  \    {\n        return $this->password;\n    }\n}\n```\n\n如你所见，`SignUpUserRequest`\
  \ 没有任何行为，只有数据。这些数据可能来自 HTML 表单或 API 端点，我们并不关心。\n\n# Application\n\n### 11.2.1 构建应用服务请求\n\
  \n从交付机制（你喜欢的框架）创建请求应该是相当直观的。在 Web 端，你可以从控制器请求中获取参数，并将它们封装在 `DTO` 中传递给内部服务层。CLI 命令也遵循同样的原理，读取输入参数并再次向下传递。\n\
  \n使用 Symfony，我们可以从来自 `HttpFoundation` 组件的 `Request` 对象中提取所需的数据。\n\n```php\n//...\n\
  \nclass UsersController extends Controller\n{\n    /**\n     * @Route(\"/signup\"\
  , name=\"signup\")\n     * @param Request $request\n     * @return Response\n  \
  \   */\n    public function signUpAction(Request $request)\n    {\n        //...\n\
  \        $SignUpUserRequest = new SignUpUserRequest(\n            $request->get('email'),\n\
  \            $request->get('password')\n        );\n        //...\n    }\n}\n\n\
  //...\n```\n\n在更复杂的 Silex 应用中，它使用 `Form` 组件来捕获和验证参数：\n\n```php\n//...\n$app->match('/signup',\
  \ function (Request $request) use ($app) {\n    $form = $app['sign_up_form'];\n\
  \    $form->handleRequest($request);\n    if ($form->isValid()) {\n        $data\
  \ = $form->getData();\n        try {\n            $app['sign_in_user_application_service']->execute(\n\
  \                new SignUpUserRequest(\n                    $data['email'],\n \
  \                   $data['password']\n                )\n            );\n     \
  \       return $app->redirect($app['url_generator']);\n        } catch (UserAlreadyExistsException\
  \ $e) {\n            $form->addError('Email is already registered');\n        }\
  \ catch (\\Exception $e) {\n            $form->addError('There was an error');\n\
  \        }\n    }\n    return $app['twig']->render('signup.twig', [\n        'form'\
  \ => $form->createView(),\n    ]);\n});\n```\n\n## 11.2.2 设计\n\n设计请求对象时，始终遵循以下原则：\n\
  \n### 11.2.2.1 使用原始类型\n\n设计请求对象时，在服务层使用原始类型（`string`、`integers`、`booleans` 等）。\n\
  \n### 11.2.2.2 可序列化\n\n`DTOs` 应该是可以跨网络传输的序列化的。\n\n### 11.2.2.3 无业务逻辑\n\n避免在请求对象中放置业务逻辑。验证应该在领域层进行。\n\
  \n### 11.2.2.4 无测试\n\n`DTOs` 是数据结构，不需要对其进行单元测试。\n\n### 11.3 应用服务的剖析\n\n一旦我们将数据封装在请求中，就是处理业务逻辑的时间了。正如\
  \ Vaughn Vernon 所：“保持应用服务的轻量化，仅用于协调任务。”\n\n首先要工作是从请求中提取必要信息，即电子邮件和密码。在高层面上，我们需要检查是否存在具有该电子邮件的用户。如果不是，我们则创建用户并添加到仓库中。对于发现相同邮箱用户的特殊情况，我们抛出一个异常，以便客户端按照自己的方式进行处理，例如显示错误、重试或忽略。\n\
  \n240\n\n```php\nnamespace Lw\\Application\\Service\\User;\n\nuse Ddd\\Application\\\
  Service\\ApplicationService;\nuse Lw\\Domain\\Model\\User;\nuse Lw\\Domain\\Model\\\
  User\\UserAlreadyExistsException;\nuse Lw\\Domain\\Model\\User\\UserRepository;\n\
  \nclass SignUpUserService\n{\n    private $userRepository;\n\n    public function\
  \ __construct(UserRepository $userRepository)\n    {\n        $this->userRepository\
  \ = $userRepository;\n    }\n\n    public function execute(SignUpUserRequest $request)\n\
  \    {\n        $email = $request->email();\n        $password = $request->password();\n\
  \        $user = $this->userRepository->ofEmail($email);\n\n        if (!$user)\
  \ {\n            throw new UserAlreadyExistsException();\n        }\n\n        $this->userRepository->add(\n\
  \            new User(\n                $this->userRepository->nextIdentity(),\n\
  \                $email,\n                $password\n            )\n        );\n\
  \    }\n}\n```\n\n![](img/index-259_1.png)\n\n## 异常处理\n\n应用服务抛出的异常是向客户端通信异常情况和流程的一种。此层的异常与业务逻辑相关（如未找到用户），而不是与实现细节（如\
  \ `PDOException`、`PredisException` 或 `DoctrineException`）相关。\n\n### 11.3.1 依赖倒置处理处理不是服务的职责。正如我们在仓库章节看到的，有一个专门的类处理用户集合，即仓库。这是从应用服务到仓库的依赖。我们不希望将应用服务与仓库的具体实现耦合，否则我们就会把服务与基础设施细节耦合在一起。\n\
  \n\n\n\n应用服务（Application services）也可以依赖于领域服务，如 `GetBadgesByUser`。在运行时，此类服务的具体实现可能非常复杂。想象有一个\
  \ `HttpGetBadgesByUser` 用于通过 HTTP 协议集成一个限界上下文（bounded context）。\n\n依赖抽象将使我们的应用服务免受底层基础设施变化的影响。\n\
  \n### 11.3.2 实例化应用服务\n\n实例化你的应用服务是非常简单的。但取决于构建依赖所需的复杂程度，构建依赖树可能会很麻烦。为了这个目的，大多数框架都自带依赖注入容器（Dependency\
  \ Injection container）。如果没有它，你最终会在控制器的某个地方写如下代码：\n\n```php\n$redisClient = new Predis\\\
  Client([\n    'scheme' => 'tcp',\n    'host' => '10.0.0.1',\n    'port' => 6379\n\
  ]);\n$userRepository = new RedisUserRepository($redisClient);\n$signUp = new SignUpUserService($userRepository);\n\
  $signUp->execute(new SignUpUserRequest(\n    'user@example.com',\n    'password'\n\
  ));\n```\n\n我们决定为 `UserRepository` 使用 [Redis](http://redis.io/)² 实现。构建该仓库所需的所有细节都在那里了，例如\
  \ [Predis³](https://github.com/nrk/predis) 配置。这不仅效率低下，而且会在控制器之间扩散代码重复。\n\n你可以将构造逻辑重构到\
  \ `Factory`（工厂）中，或者使用依赖注入容器。大多数现代框架都自带它。\n\n#### 使用依赖注入容器不好吗？\n\n一点也不不好。依赖注入容器只是一个工具。它们帮助抽象构建依赖的复杂性。它们在构建基础设施构件时非常有用。Symfony\
  \ 提供了一个[完整的解决方案⁴](http://symfony.com/doc/current/book/service_container.html)。请注意，将整个容器作为一个整体传递给其中一个服务是一个糟糕的做法。那就像是将应用程序的整个上下文与领域耦合。如果你为特定服务获取一个对象，直接获取即可。不要让该服务感知整个上下文。\n\
  \n让我们看看如何使用 Silex 来实现：\n\n```php\n// ...\n$app = new Silex\\Application();\n$app['redis_parameters']\
  \ = [\n    'scheme' => 'tcp',\n    'host' => '127.0.0.1',\n    'port' => 6379\n\
  ];\n$app['redis'] = $app->share(function ($app) {\n    return new Predis\\Client($app['redis_parameters']);\n\
  });\n$app['user_repository'] = $app->share(function ($app) {\n    return new RedisUserRepository(\n\
  \        $app['redis']\n    );\n});\n$app['sign_up_user_application_service'] =\
  \ $app->share(function ($app) {\n    return new SignUpUserService(\n        $app['user_repository']\n\
  \    );\n});\n//...\n$app->match('/signup', function (Request $request) use ($app)\
  \ {\n    // ...\n    $app['sign_up_user_application_service']->execute(\n      \
  \  new SignUpUserRequest(\n            $request->get('email'),\n            $request->get('password')\n\
  \        )\n    );\n    // ...\n});\n```\n\n如你所示，`$app` 被用作服务容器（Service Container）。我们注册了所有需要的组件及其依赖。`sign_up_user_application_service`\
  \ 依赖于上面定义的定义。更改 `user_repository` 的实现就像返回其他内容（如 `MySQL`、`MongoDB` 等）一样简单，我们不需要更改服务代码。\n\
  \nSymfony 应用的等效实现\n\n```xml\n<?xml version=\"1.0\" ?>\n<container xmlns=\"http://symfony.com/schema/dic/services\"\
  \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\nxsi:schemaLocation=\"\
  http://symfony.com/schema/dic/services\nhttp://symfony.com/schema/dic/services/services-1.0.xsd\"\
  >\n<services>\n    <service\n    id=\"sign_up_user_application_service\"\n    class=\"\
  SignUpUserService\">\n        <argument type=\"service\" id=\"user_repository\"\
  \ />\n    </service>\n    <service\n    id=\"user_repository\"\n    class=\"RedisUserRepository\"\
  >\n        <argument type=\"service\">\n            <service class=\"Predis\\Client\"\
  \ />\n        </argument>\n    </service>\n</services>\n</container>\n```\n\n现在你已经在\
  \ Symfony 服务容器中定义了应用服务，在任何语文中获取该服务都非常简单。所有交付机制在类上可用 `get('sign_up_user_application_service')`。\n\
  \n### 11.3.3 执行\n\n调用应用服务有两种不同的方法：每个用例一个专门的类，或者在同一个类中包含多个应用服务。\n\n### 11.3.3.1 每个应用服务一个类\n\
  \n我们首选的方法，适用于所有场景。\n\n```php\nclass SignUpUserService\n{\n    // ...\n    public\
  \ function execute(SignUpUserRequest $request)\n    {\n        // ...\n    }\n}\n\
  ```\n\n为每个应用服务使用专门的类使其对外部变化更具健壮性（单一职责原则）。因为类只做一件事，所以更改该类的理由更少。执行方法可以使用更具表现性的名称，例如\
  \ `signUp`。然而，[命令模式](http://martfowler.com/bliki/DecoratedCommand.html)⁵ 标准了应用服务之间的通用契约。\n\
  \n#### 11.3.3.2 一个类中多个应用服务方法\n\n在某些情况下，将内聚的应用服务分组在同一个类下可能是一个好主意。\n\n```php\nclass\
  \ UserService\n{\n    // ...\n    public function signUp(SignUpUserRequest $request)\n\
  \    {\n        // ...\n    }\n    public function signIn(SignUpUserRequest $request)\n\
  \    {\n        // ...\n    }\n    public function logOut(LogOutUserRequest $request)\n\
  \    {\n        // ...\n    }\n}\n```\n\n我们不建议这种方法，因为并不是所有应用服务都是 100% 内聚的。某些服务将需要不同的依赖，你最终会导致应用服务依赖于它们不需要的东西。另一个问题是这种类增长得很快。因为它违反了单一职责原则，会有多个理由去修改并可能破坏它。\n\
  \n### 11.3.4 返回值注册后，我们可能会考虑将用户重定向到个人资料页。在控制器中执行此操作的最直接的反映可能是直接从服务返回 `User` 实体。\n\
  \n```php\nclass SignUpUserService\n{\n    // ...\n    public function execute(SignUpUserRequest\
  \ $request)\n    {\n        // ...\n        $user = new User(\n            $this->userRepository->nextIdentity(),\n\
  \            $email,\n            $password\n        );\n        $this->userRepository->add($user);\n\
  \        return $user;\n    }\n}\n```\n\n然后，从控制器中，我们将获取 `id` 字段并重定向到其他地方。\n\n\n\n\
  controller。这将允许交付机制绕过应用层，并直接与领域交互。\n\n想象 `User` 实体提供了一个 `updateEmailAddress` 方法。你可以尝试阻止它，但在未来的某个时刻，某人可能会考虑使用它。\n\
  \n```php\n$app->match('/signup', function (Request $request) use ($app) {\n    //...*\n\
  \    $user = $app['sign_up_user_application_service']->execute(\n        new SignUpUserRequest(\n\
  \            $request->get('email'),\n            $request->get('password')\n  \
  \      )\n    );\n    $user->updateEmailAddress('shouldnotupdate@email.com');\n\
  \    //...*\n});\n```\n\n等一下，让我重新格式化一下代码：\n\n不仅如此，表示层需要的数据与领域层管理的数据并不相同。\n\n我们不希望领域层围绕表示层进行演进和耦合。我们希望它们能够自由地演进。\n\
  \nApplication 247\n\n我们需要一种灵活的方法来解耦这两个层。\n\n### 11.3.4.1 从聚合实例生成 DTO\n\n我们可以返回包含表示层所需信息的无静态数据结构。正如我们之前看到的，DTO\
  \ 适合这种场景。我们只需要在应用服务中组合它们，并将它们返回给客户端。\n\n```php\nclass UserDTO\n{\n    private $email;\n\
  \    //...*\n    public function __construct(User $user)\n    {\n        $this->email\
  \ = $user->email();\n        //...*\n    }\n\n    public function email()\n    {\n\
  \        return $this->email;\n    }\n}\n```\n\n`UserDTO` 将在表示层暴露 `User` 实体中我们需要的任何只读数据，从而避免暴露行为。\n\
  \n```php\nclass SignUpUserService\n{\n    public function execute(SignUpUserRequest\
  \ $request)\n    {\n        // ...*\n        $user = // ...*\n        return new\
  \ UserDTO($user);\n    }\n}\n```\n\n任务完成。现在我们可以将参数传递给模板引擎，将它们转换为小部件、标签、子模板，或者在表示端对数据进行任何想要的操作。\n\
  \nApplication 248\n\n```php\n$app->match('/signup', function (Request $request)\
  \ use ($app) {\n    /**\n     * @var UserDTO $user\n     */\n    $userDto = $app['sign_up_user_application_service']->execute(\n\
  \        new SignUpUserRequest(\n            $request->get('email'),\n         \
  \   $request->get('password')\n        )\n    );\n    //...*\n});\n```\n\n然而，让应用服务决定如何构建\
  \ DTO 揭示了另一个局限性。\n\n由于 DTO 的构建完全依赖于应用服务，将 DTO 适配到不同的客户端将非常困难。考虑 Web 控制器重定向所需的数据，以及同一用例的\
  \ REST 响应所需的数据。这些数据完全不同。\n\n让我们通过传递特定的 DTO 组装器，允许客户端定义如何构建 DTO。\n\n```php\nclass\
  \ SignUpUserService\n{\n    private $userDtoAssembler;\n    public function __construct(\n\
  \        UserRepository $userRepository,\n        UserDTOAssembler $userDtoAssembler\n\
  \    )\n    {\n        $this->userRepository = $userRepository;\n        $this->userDtoAssembler\
  \ = $userDtoAssembler;\n    }\n\n    public function execute(SignUpUserRequest $request)\n\
  \    {\n        // ...*\n        $user = // ...*\n        return $this->userDtoAssembler->assemble($user);\n\
  \    }\n}\n```\n\nApplication 249\n\n现在，客户端可以通过传递特定的 `UserDTOAssembler` 来自定义响应。\n\
  \n### 11.3.4.2 数据转换器 (Data Transformers)\n\n在某些情况下，为 JSON、XML、CSV、iCAL 联系人等更复杂的响应生成中间\
  \ DTO 可能认为是不必要的开销。我们可以将表示输出到缓冲区，并在稍后在交付侧请求它。\n\n转换器将高层领域概念转换为底层客户端细节。让我们来看一个例子：\n\
  \n```php\ninterface UserDataTransformer\n{\n    public function write(User $user);\n\
  \    /**\n     * @return mixed\n     */\n    public function read();\n}\n```\n\n\
  考虑为特定产品生成不同数据表示的情况。通常产品信息通过 Web 界面（HTML）提供，但我们可能兴趣提供其他格式，如 XML、JSON 或 CSV。这可能实现与其他服务的集成。\n\
  \n博客也有类似的情况。我们可能通过 HTML 向世界展示我们作为作者的潜力，但有些人会对通过 RSS 消费我们的文章感兴趣。用例——应用服务——保持不变，但表示形式不同。\n\
  \nDTO 是一种清洁且简单的解决方案，可以传递给模板引擎以实现不同的表示，但它可能会使数据转换最后一步的逻辑变得复杂。此类模板的逻辑可能会变成维护、测试和理解的问题。\n\
  \n数据转换器在特定情况下可能是更好的方法。它们只是以领域概念为输入（聚合、实体等）并以只读表示（XML、JSON、CSV 等）为输出的黑盒。这些转换器可以非常容易测试。\n\
  \nApplication 250\n\n```php\nclass JsonUserDataTransformer implements UserDataTransformer\n\
  {\n    private $data;\n    public function write(User $user)\n    {\n        //\
  \ 这里可以放置更复杂的逻辑\n        // 如使用 JMSSerializer、原生 json 等。\n        $this->data = json_encode($user);\n\
  \    }\n    /**\n     * @return string\n     */\n    public function read()\n  \
  \  {\n        return $this->data;\n    }\n}\n```\n\n这很简单。知道 XML 或 CSV 版本的长什么样吗？\n\
  \n看看如何将数据转换器集成到我们的应用服务中。\n\n```php\nclass SignUpUserService\n{\n    private $userRepository;\n\
  \    private $userDataTransformer;\n    public function __construct(\n        UserRepository\
  \ $userRepository,\n        UserDataTransformer $userDataTransformer\n    )\n  \
  \  {\n        $this->userRepository = $userRepository;\n        $this->userDataTransformer\
  \ = $userDataTransformer;\n    }\n\n    public function execute(SignUpUserRequest\
  \ $request)\n    {\n        // ...*\n        $user = // ...*\n        Application\
  \ 251\n        $this->userDataTransformer->write($user);\n    }\n\n    /**\n   \
  \  * @return UserDataTransformer\n     */\n    public function userDataTransformer()\n\
  \    {\n        return $this->userDataTransformer;\n    }\n}\n```\n\n类似于 DTO 组装器方法，但这次没有返回具体的值。数据转换器被用于持有和交互数据。\n\
  \nDTO 的主要问题是编写它们的开销。大多数时候，你的领域概念和 DTO 表示具有相同的结构。大多数时候你会觉得这不值得。\n\n使用类似 DTO 的有用用例是当表示层模型与领域模型之间存在显著差异时。在这种情况下，创建一个从领域模型映射并呈现对表示层方便接口的特定\
  \ facade/网关是合理的。它与表示模型（Presentation Model）完美契合。这是值得做的，但仅对于具有这种差异的屏幕（等）——Martin Fowler,\
  \ PoEAA\n\n我们认为长期来看是值得投资的。在中大型项目中，接口表示和领域概念的变化节奏非常不同。你可能希望将它们解耦以降低更新的摩擦。使用 DTO 或数据转换器可以让你自由地演进模型，而不必总是担心破坏布局。\n\
  \n### 11.3.5 组合布局上的多个应用服务\n\n大多数情况下，没有一个布局像单个应用服务那么简单。我们的项目具有复杂的界面。\n\n考虑特定项目的主页，我们如何处理许多部分和用例？有几种方案，让我们来看看：\n\
  \nApplication 252\n\n### 11.3.5.1 AJAX 内容集成\n\n你可以让浏览器直接请求不同的端点，并在布局完成后通过 AJAX 或\
  \ HIAX 合并数据。你将避免在控制器中混合许多应用服务，但根据触发请求的数量，可能会产生性能损失。\n\n### 11.3.5.2 ESI 内容集成\n\n\
  \n\n\nEdge Side Includes 或 [ESI⁷](https://en.wikipedia.org/wiki/Edge_Side_Includes)\
  \ 是一种微小的标记语言，与之前的方法类似，但这次是在服务器端。它需要投入一些额外工作来配置如 `Nginx` 或 `Varnish` 等额外的中间件才能运行。\n\
  \n### 11.3.5.3 Symfony 子请求 (Sub Requests)\n\n如果你使用 Symfony，[子请求](http://symfony.com/doc/current/components/http_kernel/introduction.html#sub-requests)⁸\
  \ 可能是一个很有趣的选择。从 Symfony 站点提取的内容：除了发送到 `HttpKernel::handle()` 的主请求外，你还可以发送所谓的子请求。子请求的外观和行为与任何其他请求都一样，但通常用于渲染页面的一个小部分，而不是整个页面。你最常见是从你的控制器（controller）中（或者可能从由你的控制器渲染的模板内部）发起子请求。这创建了另一个完整的请求-响应周期，其中这个新的\
  \ `Request` 被转换为 `Response`。内部唯一的区别是，某些监听器（例如安全）可能只对主请求生效。每个监听器都会接收到 `KernelEvent`\
  \ 的子类，可以通过它的 `isMasterRequest()` 来检查当前请求是主请求还是子请求。\n\n这非常棒，因为你可以在不产生 AJAX 性能损耗或无需复杂的\
  \ ESI 配置的情况下，获得调用独立应用程序服务带来的益处。\n\n### 11.3.5.4 一个控制器，多个应用服务\n\n最后一个选项可能是在同一个控制器中管理多个应用服务。控制器的逻辑可能会变得有点混乱。它将处理并合并响应以传递给视图。\n\
  \n### 11.4 测试\n\n由于你对测试应用服务本身的 `behaviour`（行为）感兴趣，因此没有将其转换为具有复杂设置且针对真实数据库的 `Integration\
  \ Test`（集成测试）。你对测试低级细节并不感兴趣。大多数情况下，一个 `Unit Test`（单元测试）就足够了。\n\n⁶[`en.wikipedia.org/wiki/Hijax`](https://en.wikipedia.org/wiki/Hijax)\n\
