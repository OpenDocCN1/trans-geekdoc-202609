  \    }\n}\n```\n\n好了，现在功能的关键部分仍然存在。我们有不同的测试测试方法，我们可以编写自己的 mock，或者使用如 `Mockery` 或\
  \ `Prophecy` 这样的模拟框架。让我们选择第一个。另一个有趣的练习是使用这些框架之一来编写这个示例以及之前的示例。\n\n```php\nclass\
