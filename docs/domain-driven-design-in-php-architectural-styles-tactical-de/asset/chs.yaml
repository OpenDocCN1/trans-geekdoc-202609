  \ `find` 方法接收到什么标识符，实现总是返回 `null`。\n\n为什么要测试这些情况？记住 Kent Beck 的话：“测试所有可能崩溃的东西”。\n\
  \n让我们继续剩余的功能。我们需要检查一个与“拥有可读但不可写的仓库”相关的特殊情况。解决方案可以在列表 11 中找到。\n\n```php\nclass RateIdeaUseCaseTest\
  \ extends PHPUnit_Framework_TestCase\n{\n    // ...\n    /**\n     * @test\n   \
