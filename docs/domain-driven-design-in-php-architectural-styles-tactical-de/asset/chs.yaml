  \            new SignUpUserRequest(\n                'user@example.com',\n     \
  \           'password'\n            )\n        );\n    }\n\n    /**\n     * @test\n\
  \     */\n    public function afterUserSignUpItShouldBeInTheRepository()\n    {\n\
  \        $user = $this->executeSignUp();\n        $this->assertSame(\n         \
  \   $user,\n            $this->userRepository->ofId($user->id())\n        );\n \
  \   }\n}\n```\n\n\n\n交付机制的。用这些概念污染领域将使开发变得更加困难。\n\n## 11.7 领域事件 (Domain Events)\n\
  \n在执行应用服务之前，必须配置领域事件监听器，否则没有人会被注意到。在某些情况下，你必须在执行应用服务之前显式地配置监听器。\n\n```php\n//...*\n\
  $subscriber = new SpySubscriber();\nDomainEventPublisher::instance()->subscribe($subscriber);\n\
  $applicationService = //...*\n$applicationService->execute(...);\n```\n\n大多数情况下，这将通过配置依赖注入容器来完成。\n\
  \n### 11.8 命令处理器 (Command Handlers)\n\n执行应用服务的一种有趣方法是通过使用命令总线（Command Bus）库。一个很好的选择是\
  \ [Tactician¹⁰](https://tactician.thephpleague.com/)。\n\n什么是命令总线？这个术语主要用于我们将[命令](https://en.wikipedia.org/wiki/Command_pattern)\
  \ [模式](https://en.wikipedia.org/wiki/Command_pattern)¹¹ 与[服务层](http://martinfowler.com/eaaCatalog/serviceLayer.html)¹²结合起来。它的工作是获取一个命令对象（描述用户想要做什么）并将其匹配到处理器（执行该操作）。这有助于保持代码的结构整洁。\n\
  \n诚然，我们的应用服务就是服务层，而我们的请求对象看起来非常像命令。\n\n如果我们有一个机制来链接所有的应用服务，然后根据请求执行正确的那个，那不是太好了吗？事实上，这正是命令总线的作用。\n\
  \n### 11.8.1 Tactician 库及其他选项\n\nTactician 是一个命令总线库。它允许你为应用服务使用命令模式。它对应用服务来说特别方便，但你也可以使用任何类型的输入。让我们来看\
  \ Tactician 网站上的示例。\n\n¹⁰[`tactician.thephpleague.com/`](https://tactician.thephpleague.com/)\n\
  ¹¹[`en.wikipedia.org/wiki/Command\\_pattern`](https://en.wikipedia.org/wiki/Command_pattern)\n\
  ¹²[`martinfowler.com/eaaCatalog/serviceLayer.html`](http://martinfowler.com/eaaCatalog/serviceLayer.html)\n\
  \n```php\n// 你这样构建一个简单的消息对象：\nclass PurchaseProductCommand\n{\n    protected $productId;\n\
  \    protected $userId;\n    // ...以及用于分配这些属性的构造函数...\n}\n\n// 以及一个期望该对象的处理器类：\n\
  class PurchaseProductHandler\n{\n    public function handle(PurchaseProductCommand\
  \ $command)\n    {\n        // 使用命令更新你的模型等\n    }\n}\n\n// 然后在你的控制器中，你可以使用你喜欢的\n\
  //// 表单或序列化器库来填充命令，然后将其丢入命令总线就搞定了！\n$command = new PurchaseProductCommand(42, 29);\n\
  $commandBus->handle($command);\n```\n\n就是这样。Tactician 就是那个 `$commandBus` 服务。它处理了寻找正确处理器和方法的所有管道连接工作。这可以避免大量的样板代码。在这里，命令和处理器只是普通的类，但你可以配置任何更适合你应用的配置。\n\
  \n总结一下，我们可以得出结论：命令仅仅是请求对象，而命令处理器仅仅是应用服务。\n\nTactician（以及通用的命令总线）的一个酷点是它们非常容易扩展。Tactician\
  \ 为日志记录和数据库事务等常见任务提供了插件。这样一来，你就不需要担心在每个处理器上设置布线了。\n\nTactician 的另一个有趣插件是集成 [Bernard¹³](http://bernard.readthedocs.org/)。Bernard\
  \ 是一个异步作业队列，允许你将某些任务留到以后处理。重量型过程会阻塞用户响应，而大多数任务可以留到以后处理。\n\nMathias Noback 开发了 Tactician\
  \ 的一个酷替代方案，叫做 SimpleBus。[查看它¹⁴](http://simplebus.github.io/MessageBus/)[](#index_split_000.html#277)\n\
  \n¹³[`bernard.readthedocs.org/`](http://bernard.readthedocs.org/)\n¹⁴[`simplebus.github.io/MessageBus/`](http://simplebus.github.io/MessageBus/)\n\
  \n### 11.9 总结\n\n应用服务代表了应用层。我们看到请求和命令保持了有序，DTO 允许我们将数据表示与领域逻辑解耦，这涉及到许多关注点。\n\n##\
  \ 12. 整合边界上下文 (Integrating Bounded Contexts)\n\n每个企业应用通常由多个区域组成。处理分布式系统是困难的。这些系统的协调并不简单，需要仔细考虑。正如\
  \ Martin Fowler 在《软件架构模式》书中所说，分布式系统的第一条法则始终是：不要分布。\n\n### 12.1 通过数据存储进行集成\n\n集成应用程序不同部分的最常用技术之一始终是共享同一个数据存储，以及相同的代码库。这通常被称为单体应用。\n\
  \n考虑一个电子商务应用程序，共享的数据存储将包含所有关注点（例如：关系型数据库中的表），围绕目录、账单、库存等。这种方法本身并没有坏处，例如在小型线性应用中，复杂度并不高。然而，在复杂的领域中，可能会出现问题。如果你跨越许多涉及多个关注点的表共享数据，事务将对性能产生巨大影响。另一个非技术性的问题可能会出现在通用通用语言（Ubiquitous\
  \ Language）方面。\n\n回到电子商务系统，假设我们想要引入“T 恤”的概念。在目录上下文中，T 恤是一个具有颜色、尺寸、材质属性以及一些精美图片的产品。但在库存系统中，我们并不真正关心这些。在这里，产品具有不同的含义，我们关心的是重量、仓库位置或尺寸等不同属性。将两个上下文混合在一起会使概念纠缠并增加设计。在\
  \ DDD 术语中，这种方式的概念混合被称为“共享内核”（Shared Kernel）。\n\n\n\n\n指定某些团队同意共享的领域模型子集。当然，这包含了该模型子集以及与该模型部分相关的代码子集或数据库设计。这些显式共享的内容具有特殊状态，在没有咨询另一个团队的情况下不应进行更改。频繁地集成功能系统，但频率略低于团队内部的持续集成（CONTINUOUS\
  \ INTEGRATION）速度。在这些集成时，运行两个团队的测试。\n\n*Eric Evans* - 《领域驱动设计：应对软件核心复杂性》\n\n# 第 14\
  \ 章 - 共享内核 (Shared Kernel)\n\n我们不建议使用 `Shared Kernel`。因为多个团队在开发它的过程中可能会发生冲突，最终导致维护问题并成为摩擦点。`Shared\
  \ Kernel` 中的更改更改应预先由所有参与方达成共识。在概念上，它还有其他问题，例如人们将其视为一个放置“不属于任何地方的杂物”的袋子，并使其无限增长。\n\
  \n处理不断增长的单体复杂性的更好方法是将其拆分为不同的自治部分。例如通过 REST、RPC 或消息系统进行通信。这需要划定清晰的边界，每个上下文可能都会有自己的基础设施——数据存储、服务器、消息中间件等——甚至有自己的团队。正如你所预见的，这可能会导致某种程度的重复。为了降低复杂性，我们愿意做出这种权衡。这些自治部分被称为`限界上下文（Bounded\
  \ Contexts）`。\n\n## 12.2 集成关系\n\n### 12.2.1 客户/供应商 (Customer / Supplier)\n\n当两个限界上下文之间存在单向集成时，其中一个作为提供者（`upstream`），另一个作为其客户端（`downstream`），我们将得到`客户-供应商开发团队（Customer\
  \ - Supplier Development Teams）`。\n\n![](img/index-281_1.png)\n![](img/index-281_2.png)\n\
  ![](img/index-281_3.png)\n\n集成限界上下文 263\n\n在两个团队之间建立清晰的客户/供应商关系。在规划会议中，让下游团队扮演上游团队的客户。为下游需求进行谈判和预算分配，以便每个人都理解承诺和进度。\n\
  \n共同开发自动化验收测试，以验证预期的接口。将这些测试添加到上游团队的测试套件中，作为其持续集成的一部分运行。这种测试将让上游团队能够放心地做出更改，而无需担心对下游产生副作用。\n\
  \n*Eric Evans* - 《领域驱动设计：应对软件核心复杂性》\n\n`Customer / Supplier Development Teams` 是集成限界上下文常见的方式。当团队紧密合作时，这通常代表着双赢的局面。\n\
  \n### 12.2.2 分离 (Separate Ways)\n\n延续电子商务的例子，考虑向旧的遗留零售商财务系统报告收入。这种集成可能非常昂贵，以至于投入实现没有价值。在\
  \ DDD 战略术语中，这被称为`分离（Separate Ways）`。\n\n集成总是昂贵的。有时收益却很小。因此，声明一个`限界上下文（BOUNDED CONTEXT）`与其他完全没有连接，让开发者感到轻松。\n\
  \n*Eric Evans* - 《领域驱动设计：应对软件核心复杂性》\n\n## 12.3 实现限界上下文\n\n### 12.3.1 现代 RPC\n\n\
  为了让事情变得更容易，我们将假设限界上下文之间存在关系。以电子商务为例，考虑向旧的遗留零售商财务系统报告收入。这种集成可能非常昂贵，以至于投入实现没有价值。在\
  \ DDD 战略术语中，这被称为`分离（Separate Ways）`。\n\n### 12.3.2 遵循者 (Conformist)\n\n再次考虑电子商务例子以及与第三方的集成。限界上下文之间存在关系。我们将假设限界上下文之间存在关系。以电子商务为例，考虑向旧的遗留零售商财务系统报告收入。这种集成可能非常昂贵，以至于投入实现没有价值。在\
  \ DDD 战略术语中，这被称为`分离（Separate Ways）`。\n\n\n\n\n\n⁴[`github.com/willdurand/BazingaHateoasBundle`](https://github.com/willdurand/BazingaHateoasBundle)\n\
  \n⁵[`github.com/schmittjoh/JMSSerializerBundle`](https://github.com/schmittjoh/JMSSerializerBundle)\n\
  \n⁶[`github.com/nelmio/NelmioApiDocBundle/`](https://github.com/nelmio/NelmioApiDocBundle/)\n\
  \n⁷[`github.com/ongr-io/ElasticsearchBundle`](https://github.com/ongr-io/ElasticsearchBundle)\n\
  \n⁸[`martinfowler.com/articles/richardsonMaturityModel.html`](http://martinfowler.com/articles/richardsonMaturityModel.html)\n\
  \n# 集成边界上下文\n\n265\n\n通过类似 `http://gamification.context.host/api/users/{id}` 的端点获取特定用户。\n\
  \n我们将从 Elasticsearch 中获取用户投影，并将其序列化为之前与客户端协商好的格式。\n\n```php\nnamespace AppBundle\\\
  Controller;\n\nuse FOS\\RestBundle\\Controller\\Annotations as Rest;\nuse FOS\\\
  RestBundle\\Controller\\FOSRestController;\nuse Nelmio\\ApiDocBundle\\Annotation\\\
  ApiDoc;\n\nclass UsersController extends FOSRestController\n{\n    /**\n     * @ApiDoc(\n\
  \     * resource=true,\n     * description=\"根据用户 ID 查找用户\",\n     * statusCodes={\n\
  \     * 200 = \"找到用户时返回\",\n     * 404 = \"未找到用户时返回\"\n     * }\n     * )\n    \
  \ * @Rest\\View(\n     * statusCode = 200\n     * )\n     */\n    public function\
  \ getUserAction($id)\n    {\n        $repo = $this->get('es.manager.default.user');\n\
  \        $user = $repo->find($id);\n        if (!$user) {\n            throw $this->createNotFoundException(\n\
  \                sprintf(\n                    'ID 为 %s 的用户不存在',\n             \
  \       $id\n                )\n            );\n        }\n        return $user;\n\
  \    }\n}\n```\n\n![](img/index-284_1.png)\n\n集成边界上下文\n\n266\n\n正如我们在**架构**章节中所解释的，*读取*（reads）被视为一种基础设施关注。没有必要将它们封装在\
  \ `Command` / `Command Handler` 流中。\n\n用户的生成的 JSON+HAL 表示形式将是：\n\n```json\n{\n \
  \ \"id\" : \"c3c587c6-610a-42df-90d3-8e9a181d65d0\",\n  \"points\" : 0,\n  \"_links\"\
  \ : {\n    \"self\" : {\n      \"href\" : \"http://gamification.context/api/users/c3c587c6-610a-42df-90d3-8e9a181d65d0\"\
  \n    }\n  }\n}\n```\n\n现在我们处于集成两个上下文的良好位置。我们只需要在 Will 上下文中编写客户端，来消费我们刚刚创建的端点。我们应该混合两个领域模型吗？直接消化游戏化上下文（Gamification\
  \ Context）意味着将 Will 上下文适配到游戏化上下文，导致**顺从式**（Conformist）的集成。然而，分离这些关注点似乎值得这些投资。我们需要一个层来保证\
  \ Will 上下文中领域模型的完整性和一致性。我们需要将*积分*（points，游戏化）翻译为*勋章*（badges，Will）。这种翻译机制就是 DDD 中所谓的***反腐保护层***（Anti-corruption\
  \ Layer）。\n\n## 反腐保护层\n\n> *创建一个隔离层，为客户端提供其自身的领域模型的功能。反腐保护层在内部在两个模型之间进行必要的翻译。通过适配器（Adapters）和面面（Facades）与系统交互。*\n\
  > — *Eric Evans - 领域驱动设计，隐藏复杂性。*\n\n反腐保护层是如何定义的呢？我们将看到如何定义从游戏化上下文获取的勋章。\n\n集成边界上下文\n\
  \n267\n\n```php\nnamespace Lw\\Domain\\User;\n\ninterface UserService\n{\n    function\
  \ badgesFrom($id);\n}\n```\n\n现在让我们看基础设施部分的实现。我们将使用适配器来进行转换。\n\n```php\nnamespace\
  \ Lw\\Infrastructure\\Service;\n\nuse Lw\\Domain\\User\\UserId;\nuse Lw\\Domain\\\
  User\\UserAdapter;\n\nclass TranslatingUserService implements UserService\n{\n \
  \   private $userAdapter;\n\n    public function __construct(UserAdapter $userAdapter)\n\
  \    {\n        $this->userAdapter = $userAdapter;\n    }\n\n    public function\
  \ badgesFrom(UserId $id)\n    {\n        return $this->userAdapter->toBadges($id);\n\
  \    }\n}\n```\n\n用于转换的适配器。\n\n```php\nnamespace Lw\\Infrastructure\\Service;\n\n\
  use GuzzleHttp\\Client;\nuse Lw\\Domain\\User\\UserId;\n\nclass HttpUserAdapter\
  \ implements UserAdapter\n{\n    private $client;\n\n    public function __construct(Client\
  \ $client)\n    {\n        $this->client = $client;\n    }\n\n    public function\
  \ toBadges($id)\n    {\n        $response = $this->client->get(sprintf('/users/%s',\
  \ $id), [\n            'allow_redirects' => true,\n            'headers' => ['Accept'\
  \ => 'application/json']\n        ]);\n        $badges = [];\n        if (200 ===\
  \ $response->getStatusCode()) {\n            $badges = json_decode($response->getBody(),\
  \ true);\n        }\n        return $badges;\n    }\n}\n```\n\n正如你所看到的，适配器作为游戏化上下文的**Facade**。我们通过这种方式使用了\
  \ **UserTranslator**。\n\n集成边界上下文\n\n269\n\n```php\nnamespace Lw\\Infrastructure\\\
  Service;\n\nuse Lw\\Domain\\Model\\FirstMadeBadge;\nuse Symfony\\Component\\PropertyAccess\\\
  PropertyAccessor;\n\nclass UserTranslator\n{\n    public function badgesFrom($representation)\n\
  \    {\n        $accessor = PropertyAccessor::createAccessor();\n        $points\
  \ = $accessor->getValue($representation, 'points');\n        $badges = [];\n   \
  \     if ($points > 3) {\n            $badges[] = new FirstMadeBadge();\n      \
  \  }\n        return $badges;\n    }\n}\n```\n\n翻译器专门负责将来自游戏化上下文的积分转换为勋章。\n\n\n\n\
  \n*使用一种文档良好的共享语言，将必要的领域信息作为通信的通用媒介，根据需要翻译成该语言或从该语言翻译。*\n\n*Eric Evans* - 《领域驱动设计：解决软件核心的复杂性》\n\
  \n思考这些消息的格式，通过仔细观察我们的领域模型（Domain Model），我们发现我们已经拥有它了！领域事件（Domain Events）。不需要在边界上下文（Bounded\
  \ Contexts）之间定义新的通信协议。我们可以使用 `Domain Events` 来跨越上下文定义一种通用语言。它们对“领域专家关注的事情刚刚发生”的定义，完美契合了我们正在寻找的“发布语言（Published\
  \ Language）”。\n\n在我们的示例中，我们可以使用 [RabbitMQ](https://www.rabbitmq.com/)⁹ 作为消息中间件。这可能是目前最可靠、最健壮的几个\
  \ [AMQP](https://www.amqp.org/)¹⁰ 协议之一。我们将引入广泛使用的 PHP 库 [php-amqplib](https://github.com/videlalvaro/php-amqplib)¹¹\
  \ 和 [RabbitMQBundle](https://github.com/videlalvaro/RabbitMqBundle)¹²。\n\n让我们从 Will（遗嘱）上下文开始，因为它在用户注册或许愿望时会触发事件。正如我们在领域事件（domain\
  \ events）章节中所看到的，**将领域事件存储到持久化机制中是一个好主意**，因此我们将理所当然地这样做。我们需要一个消息发布者（message publisher）来从事件存储获取并发布已存储的领域事件到消息中间件。我们已经在领域事件（domain\
  \ events）章节中完成了与 RabbitMQ 的集成，因此我们只需要在游戏化上下文（Gamification Context）中实现代码即可。我们将监听由\
  \ Will 上上下文触发的事件。由于我们在游戏化一侧使用了 Symfony，我们可以利用已有的 `RabbitMQBundle` 来让事情变得简单。\n\n\
  我们为“用户注册（User Signed Up）”和“已许愿（Wish Was Made）”事件定义了两个消息消费者。\n\n### 集成边界上下文\n\n```php\n\
  namespace AppBundle\\Infrastructure\\Messaging\\PhpAmqpLib;\n\nuse Lw\\Gamification\\\
  Command\\SignupCommand;\nuse OldSound\\RabbitMqBundle\\RabbitMq\\ConsumerInterface;\n\
  use PhpAmqpLib\\Message\\AMQPMessage;\n\nclass PhpAmqpLibLastWillUserRegisteredConsumer\
  \ implements ConsumerInterface\n{\n    private $commandBus;\n\n    public function\
  \ __construct($commandBus)\n    {\n        $this->commandBus = $commandBus;\n  \
  \  }\n\n    public function execute(AMQPMessage $message)\n    {\n        $type\
  \ = $message->get('type');\n        if ('Lw\\Domain\\Model\\User\\UserRegistered'\
  \ === $type) {\n            $event = json_decode($message->body);\n            $eventBody\
  \ = json_decode($event->event_body);\n            $this->commandBus->handle(\n \
  \               new SignupCommand($eventBody->user_id->id)\n            );\n   \
  \         return true;\n        }\n        return false;\n    }\n}\n```\n\n注意，在这种情况下，我们只处理类型为\
  \ `Lw\\Domain\\Model\\User\\UserRegistered` 的消息。以及针对“用户注册（User Signed Up）”事件的消费者。\n\
  \n```php\nnamespace AppBundle\\Infrastructure\\Messaging\\PhpAmqpLib;\n\nuse Lw\\\
  Gamification\\Command\\RewardUserCommand;\nuse Lw\\Gamification\\DomainModel\\AggregateDoesNotExist;\n\
  use OldSound\\RabbitMqBundle\\RabbitMq\\ConsumerInterface;\nuse PhpAmqpLib\\Message\\\
  AMQPMessage;\n\nclass PhpAmqpLibLastWillWishWasMadeConsumer implements ConsumerInterface\n\
  {\n    private $commandBus;\n\n    public function __construct($commandBus)\n  \
  \  {\n        $this->commandBus = $commandBus;\n    }\n\n    public function execute(AMQPMessage\
  \ $message)\n    {\n        $type = $message->get('type');\n        if ('Lw\\Domain\\\
  Model\\Wish\\WishWasMade' === $type) {\n            $event = json_decode($message->body);\n\
  \            $eventBody = json_decode($event->event_body);\n            try {\n\
  \                $points = 5;\n                $this->commandBus->handle(\n    \
  \                new RewardUserCommand(\n                        $eventBody->user_id->id,\n\
  \                        $points\n                    )\n                );\n  \
  \          } catch (AggregateDoesNotExist $e) {\n                // Noop\n     \
  \       }\n            return true;\n        }\n        return false;\n    }\n}\n\
  ```\n\n集成边界上下文\n\n再次，我们只感兴趣 `Lw\\Domain\\Model\\Wish\\WishWasMade`。游戏化上下文使用了 [`Tactician`³](http://tactician.phpleague.com/)\
  \ 和 [`TacticianBundle`⁴](https://github.com/videlalvaro/tactician-bundle)，这是一个可以扩展并适应你系统的简单总线（bus）。所以现在我们几乎已经准备好在\
  \ Symfony 的 `config.yml` 中定义 `RabbitMQ` 配置。\n\n```yaml\nservices:\n  last_will_user_registered:\n\
  \    class: AppBundle\\Infrastructure\\Messaging\\PhpAmqpLib\\PhpAmqpLibLastWillUserRegisteredConsumer\n\
  \    arguments:\n      - @tactician\n  last_will_wish_made:\n    class: AppBundle\\\
  Infrastructure\\Messaging\\PhpAmqpLib\\PhpAmqpLibLastWillWishWasMadeConsumer\n \
  \   arguments:\n      - @tactician\n\nframework_rabbitmq:\n  connections:\n    default:\n\
  \      host: \"%host%\"\n      port: \"%port%\"\n      user: \"%user%\"\n      password:\
  \ \"%password%\"\n      vhost: \"%vhost%\"\n  lazy: true\n\nconsumers:\n  last_will_user_registered:\n\
  \    connection: default\n    callback: last_will_user_registered\n    exchange_options:\n\
  \      name: last-will\n      type: fanout\n    queue_options:\n      name: last-will\n\
  \  last_will_wish_made:\n    connection: default\n    callback: last_will_wish_made\n\
  \    exchange_options:\n      name: last-will\n      type: fanout\n    queue_options:\n\
  \      name: last-will\n```\n\n通过这两个命令，Symfony 将执行两个消费者并监听领域事件。我们指定了 1000 条消息的限制，因为\
  \ PHP 不是运行长时间进程的最佳平台。使用像 [**Supervisor**](http://supervisord.org/) 的工具来定期监控和重启进程可能是一个好主意。\n\
  \n```bash\nphp app/console rabbitmq:consumer --messages=1000 last_will_user_registered\n\
  php app/console rabbitmq:consumer --messages=1000 last_will_wish_made\n```\n\n可能最方便的\
  \ RabbitMQ 配置是[发布/订阅（Publish / Subscribe）十五](https://www.rabbitmq.com/tutorials/tutorial-three-php)](#index_split_000.html#292)。Will\
  \ 上下发布的所有消息都会传递给所有消费者。这在 RabbitMQ 交换机中被称为 `fanout`。交换机由一个代理负责将消息传递相应的队列。\n\n尽管我们只看到了局部，但策略设计是领域驱动设计的核心。它是帮助你开发更好、更有语义模型的关键部分。\n\
  \n我们建议使用消息中间件来集成边界上下文，因为这自然会导致更简单、解耦和事件驱动的架构。\n\n⁹[`www.rabbitmq.com/`](https://www.rabbitmq.com/)\n\
