  trans: '

    正如雷达一样，存在复杂的公式可以帮助风险官量化所有这些场景。通过（这些公式的帮助）收集情报并预判风险。


    网络风险管理演变为有效的监督职能一直受到阻碍，因为大多数组织无法像处理其他类型的风险那样来组织、分类和`measure` 网络风险。`网络安全风险的量化应该处于网络风险管理的核心位置`。量化网络风险可以带来更好的决策，因为它以与公司内其他风险相同的通用语言或语境来描述了风险。向高级管理人员、董事会和其他利益相关者报告网络风险，有助于他们很好地了解公司、特定业务、产品和活动随时间推移的网络风险水平。


    对于整体网络安全预算、网络安全支出的分配以及保险范围，也可以做出更明智的决策。这也有助于营造一种重视漏洞的文化。它为对第三方供应商提供了客观评估。它有助于促进网络风险与其他企业风险及运营风险的整合。


    那么，网络风险经理是如何收集情报并预判风险的呢？网络领域存在着似乎无尽的未知因素。我建议可以使用基于制造业的创新方法来解决所有类型组织的网络安全运营中断。


    例如，在制造业中，考虑汽车制造工厂的流水线。如果一个不满的员工向流水线中间发射了一枚火箭，工厂管理团队可以确定维修流水线需要多久、维修费用是多少，以及生产损失的成本。换句话说，通过关注`what`发生了什么，而不考虑它是`how`发生的，汽车制造商就可以确定火箭造成的潜在中断损失。（当然，这种场景还应该导致对由于工厂士气低和不满员工所产生风险的额外分析。但你明白我的意思。）


    让我们把这个例子扩展到一个本应 24/7 运行的在线银行应用程序。突然，在一个三三休假周末的深夜，银行应用程序由于网络攻击而变得毫无用。无论攻击是`how`发生的，通过仅关注`what`发生了什么，银行可以确定需要修复的关键节点、费用多少、所需时间以及停机成本——所有这些都可以像制造业示例一样被`quantified`。


    这种方法关注服务中断的影响，而无论其产生原因是什么，它允许你有效地创建一个中断模型，并利用该模型来量化与运营中断相关的网络安全风险。底线是：网络风险经理应该关注关键中断节点以提高韧性——这在攻击发生很久以前就应该做到。


    正如在雨中行走的经典风险示例一样，网络风险经理经常忽视这些场景中的连锁反应。例如，假设对纽约金融系统的网络攻击包括周末期间对曼哈顿电网的攻击。所有金融交易所都有应急电源系统，但它们的响应可能会受到阻碍，因为地铁也会停止运行。连锁反应是，本应响应攻击的技术人员将很难进入该城市——这一事实很容易被忽视。


    一个优秀的网络风险管理官关注的是`what`可能发生哪些中断，而不是它们将如何`how`发生。考虑风险的连锁反应同样重要。最终，一个优秀的网络风险经理必须问自己：“我所采取的保护措施对于我的生存能力来说足够吗？”


    例如，考虑一个真正不可知的风险，例如网络安全事件造成的声誉损失总额。操作性问题是：“应该开发什么样的最佳实践——响应计划和政策——以便能够吸收影响并让组织能够继续运行？”


    在这些情况下，了解公司的“皇冠明珠”是什么非常重要，然后划定清晰的界限并采取强有力的缓解措施来保护它们。例如，在一家资产管理公司，个人客户数据极其敏感，可能需要额外的控制层，包括不同的安全协议。第二道网络风险管理的视角应主要是：“公司是否正在尽其所做的一切来妥善缓解这些风险的影响，以确保可持续性？”


    一个强大的 CyRM℠ 方法执行了以下工作：


    *   关注网络安全事件的`impact`影响——而不是它们`how`发生。

    *   使用中断模型来量化运营中断。

    *   将尽可能多的未知风险转换为已知风险，以便对其进行量化。

    *   并且对于那些不可知的风险，关注需要做什么来确保生存能力。


    # 构建更有效的网络安全防御


    将 CyRM℠ 中的网络风险管理分支类比人体免疫系统。当病菌突破人自然屏障时，免疫系统会发起三步防御：拉响警报、解决问题以及恢复和记忆。现场的第一线防者是白细胞，它们在全身不断循环，就像巡逻的警察一样。接着，被称为淋巴细胞的特殊白细胞进行双管攻击——一个针对受感染的细胞，另一个针对在血液中游走的敌对微生物。最后，一旦入侵者和受损细胞被摧毁，免疫系统的士兵就会回到基地，留下一些经验丰富的老兵，以防入侵者返回。


    网络安全防御的有效性就像免疫系统一样，很大程度上取决于每个组件是否高效地履行其职责。公司显然需要在企业层面管理网络安全，并必须提高每个要素——一线管理、运营、内部审计、风险和合规满足其个人和组织功能的能力。管理网络风险需要三道防线。第一道防止网络事件发生并保护组织。这是整个组织每个人的责任，特别是技术和信息安全部门。高层应指定一名高级合伙人作为全公司网络安全的负责人。在技术的日常管理或危机中，拥有一位高超的领导者远比领域专家要好。在选择合适的人选时，他的领导能力——沟通和危机管理——同样重要。CyRM℠
    不是在孤立状态下管理的。讨论应当是所有管理流程的一部分，例如新产品审批、合并尽职调查和第三方外包安排。

