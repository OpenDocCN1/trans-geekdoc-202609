    Not only does the customer have instant access to pricing and the strongest competitors,
    but the endgame will change. Customers will focus on their relationships with
    the vendors they buy from (Amazon), not the manufacturers of the products. Trust
    in an era of transparency, coupled with the power shifting to the consumer, will
    require companies to place a greater focus on trust and make it a competitive
    advantage. Trust will define the quality and sustainability of a company’s relationship
    with its various stakeholders.


    But trust isn’t only for the consumer. Employees’ trust will be crucial to foster
    high levels of collaboration that drive business results. Employees will ask,
    “Can I trust that my work-related data is secure and private, that networks will
    function, and that cybersecurity measures are in place?” This will become increasingly
    important in the new, virtual world, where managing remote teams takes extra effort
    to make employees feel valued when they’re away from headquarters. Trust defines
    the relationship between companies and suppliers in our interconnected business
    environment. With data and systems so widely shared, effective data management
    will become an important differentiator in helping clients succeed with their
    customers.


    Previous dealings and direct relationships will take a back seat to accountability
    and greater assurances that business partners'' governance and compliance processes
    are aligned with your own. Maintaining trust will build shared values and create
    a true competitive advantage.


    Target’s attempt to break into the Canadian market is a lesson in supply chain
    mismanagement, and how not to move into new markets. The US retailer attempted
    to open 124 shops and three large distribution centers in the country at the same
    time. It did this with an apparently faulty computerized-assisted ordering system
    that left warehouses overflowing with stock while store shelves sat bare. Marc
    Wulfraat, president of MWPVL International Inc., a logistics and supply chain
    consulting firm in Montreal, noted that Target “just completely lost control of
    inventory,” something that wouldn’t have happened if it had started its entry
    into Canada with fewer stores and been able to test its distribution network first.
    The company announced in February 2020 that its travails in the Great White North
    had lost the firm $1 billion.


    We’ve seen with the COVID-19 pandemic that trust has been expanded to include
    ecosystem partners. Companies will ask, “Can I trust that measures are being taken
    to protect my proprietary information and ensure integrity of the transactions,
    and that service levels are met as business interactions are increasingly virtual?”
    Even further, trusted companies will try to balance the trust of all their stakeholders.
    Sandra Sucher a professor at Harvard Business School, notes that “trusted companies
    know how to balance the trust of all their stakeholders.” In one example during
    the pandemic, a global hotel and resort chain that needed to furlough workers
    connected its shutdown teams with other companies that needed help in the short
    term to deal with increased surges in demand.


    # 9 CyRM℠ as a Vital Business Strategy


    Today’s business world is becoming ever more interconnected. New threats are emerging
    every day—not just from bad actors, but from the vulnerabilities created by a
    widening attack surface and enhanced communications. Today, employees can be tracked
    easily from their mobile phones or fitness watches. Their laptops can be hacked,
    as well as their cars, watches, TVs, and even their hearing aids! Greater internet
    connectivity is constantly widening the attack surface. Everything from light
    bulbs in the office to alarm systems at home to appliances, planes, and pacemakers
    are vulnerabilities.


    Digital communication keeps adding more functionality and control, while at the
    same time creating new vulnerabilities. Consider, for example, the possibility
    that your `E-ZPass` could be used by law enforcement to issue speeding tickets.


    Most people assume the main function of `CyRM` is to reduce operational risk by
    eliminating the dangers posed by viruses and hackers. But it’s time to reposition
    `CyRM` for what it really is—a growth enabler.


    Digital transformation has created an environment of increasingly intense competition.
    Agile organizations can get the upper hand by using cutting-edge technologies
    to create new products, provide better customer experiences, innovate, and rapidly
    scale those innovations across the enterprise. As a result, business strategy
    and IT strategy will be increasingly and actively more aligned. How a company
    weaves its technology investments together will ultimately determine how prepared
    it is to preempt disruption and seize opportunities. Companies that build boundaryless,
    adaptable, and radically human IT systems that explicitly enable scale and strategic
    agility will win the day.


    To succeed at this, companies will need to reimagine business processes for the
    future. They (you) need to target multiple processes with the same technologies
    increasingly dependent on platforms, ecosystems, and large varieties of connected
    data to fuel artificial intelligence systems. The key enablers for digitization
    involve cloud, big data, mobility, and collaboration. Security needs to be embedded
    in the entire business ecosystem—and it needs to be sufficiently agile to adapt
    to the speeds and volume of data required by daily transactions, all while being
    able to handle the complexity and multiplicity of threats in a digital world.


    Security and governance will become more complicated than today—as more potential
    attack surfaces increase vulnerability. While developing new products and services,
    a company needs to strike the right balance between innovation and risk. In most
    cases, the more that security is increased, the less user-friendly and convenient
    the product or service becomes. A strong `CyRM` posture is essential to ensure
    that innovation isn’t curtailed due to security concerns. A sound `CyRM` strategy
    must promote innovation as well as customer trust—both essential for continued
    growth. A well-developed `CyRM` strategy keeps innovation and the operational
    wheels of business rolling. Effective `CyRM` is also needed to enhance product
    integrity, customer experience, operations, regulatory compliance, brand reputation,
    and investor confidence.


    The business landscape is becoming ever-more interdependent. Business strategies
    are therefore focused on widening and deepening links to resources outside the
    firm. Competitive advantage is no longer the sum of all efficiencies, but rather
    the sum of all connections. Companies need to manage a complex ecosystem of stakeholders:
    partners, suppliers, investors, and customers. Partners for your network must
    be selected with governance and fiduciary processes that are aligned with their
    own. If one link is broken anywhere in the ecosystem, the others will weaken,
    too, and business will suffer. It’s important to adopt `CyRM` technologies that
    assess behavior in order to identify potential problems before they can cause
    harm. Real-time monitoring that enables automated system interventions when anomalous
    behavior is detected will become the norm.


    Companies that embrace these central notions of `CyRM` and combine them with a
    “bend but not break” approach that combines cybersecurity, business continuity,
    and enterprise resilience will gain a competitive advantage. We often are correct
    in identifying the risks that can harm us, but we usually underestimate their
    velocity or strength. Companies that elevate the role of security will strengthen
    customer trust and boost shareholder value.


    Two examples of the interconnectedness of `CyRM` and business strategy come to
    mind:

