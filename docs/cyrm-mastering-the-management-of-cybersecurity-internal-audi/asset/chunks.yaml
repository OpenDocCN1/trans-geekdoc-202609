    \ scenario’s events, what would you monitor, and what potential managerial action\
    \ steps would you take? For example, as a first step, it wouldn’t be too difficult\
    \ to monitor these attacks and get a sense of your own vulnerabilities against\
    \ your more important assets that need to be protected. Second, perhaps hire web-filtering\
    \ services that scan for websites exhibiting unusual behavior and block those\
    \ websites from your users. Or perhaps standardize on a browser other than Google\
    \ Chrome or Mozilla Firefox, which are two popular browsers (and, therefore, the\
    \ browsers for which most malware is written). Again, it’s important to think\
    \ of decision-making process in terms of four steps: assessment of the situation,\
    \ rules of the game, making the decision, and reevaluating after the fact. Remember,\
    \ it’s far better to make an error of commission—you looked at the issue, considered\
    \ all your alternatives, then went the wrong way—as opposed to an error of omission,\
    \ where you didn’t even consider the potential problem.\n\n## [Notes](#Toc.xhtml#R_sec10_9)\n\
    \n# [Conclusion](#Toc.xhtml#R_chapter11)\n\nIn far too many companies today, involvement\
    \ with cybersecurity is an afterthought, bolted onto what people do each day to\
    \ hopefully create a secure environment. We all know this approach doesn’t work.\
    \ Cybersecurity isn’t approached as a business problem and then aligned with business\
    \ needs. Also, no one is playing offense in cybersecurity—only defense, and companies\
    \ are focused on yesterday’s questions and threats that they don’t control. We\
    \ all know that real failures are often not used as learning experiences and aren’t\
    \ getting enough attention to effect change.\n\nEven further, boards and C-level\
    \ executives mistakenly think compliance will save them, but in reality, compliance\
    \ doesn’t equal appropriate levels of protection. Unfortunately, today a simple\
    \ answer doesn’t exist to the question, “Is my company’s security adequate?” There’s\
    \ also a real disconnect between executive decision-making and IT professionals\
    \ on cybersecurity, which is something that should keep more people up at night,\
    \ because every new estimate has increased levels of new threats. Cybersecurity\
    \ isn’t just an important issue to get right—it’s a \"must have right” issue.\
    \ There has to be a shift in the mindset from fighting yesterday’s war to recognizing\
    \ and getting ready to combat today’s and tomorrow’s threats.\n\nIt really takes\
    \ an army, with all its varied roles and positions, to provide appropriate CyRM℠.\
    \ There are plenty of roles for different people, the board, C-suite executives,\
    \ the CISO, IT staff, risk management staff, auditors, and every employee of the\
    \ company. It’s an army of people from a variety of different backgrounds, wealth,\
    \ and educational experiences, but everyone involved has a common purpose, which\
    \ is why it functions so well.\n\nWe’re all missing a common purpose in the cybersecurity\
    \ realm: a real commitment to CyRM℠. To me, the importance of mastering the management\
    \ of cybersecurity through CyRM℠ is like trying to explain the difference between\
    \ involvement and commitment. It’s like an egg and bacon breakfast—the chicken\
    \ was involved, but the pig was committed. You must be committed. You must create\
    \ a commitment  to CyRM℠ in your company. Throughout this book I’ve emphasized\
    \ that security should *not* be viewed as a technical problem handled by technical\
    \ people. Too often, it’s all about throwing money at technical solutions at the\
    \ expense of executive engagement. Cybersecurity is a managerial issue. To be\
    \ successful at this, you must approach security as a business problem and connect\
    \ cybersecurity with business decision-making to impact business outcomes. Remember\
    \ that CyRM℠, to effectively impact business outcomes, needs to consist of three\
    \ prongs:\n\n1.  **Risk Management:** It applies the tenets of risk management\
    \ to cybersecurity in order to take a broad view of risks across an organization\
    \ to inform resource allocation, better manage risks, and enable accountability.\n\
    \n2.  **CyberWellness℠:** It should encompass not only the firm as a whole, but\
    \ every employee, who need to be responsible for the risks they undertake. This\
    \ requires an active process with cybersecurity—just like physical wellness programs\
    \ in which the company takes an active approach to promoting employees’ good health.\n\
    \n3.  **Cybersecurity as a Business Strategy:** Cybersecurity needs to be repositioned\
    \ for what it really is: a growth enabler, and not just to reduce operational\
    \ risks by eliminating the dangers posed by viruses and hackers. It also needs\
    \ to enhance product integrity, customer experience, operations regulatory compliance,\
    \ brand reputation, and investor confidence.\n\nI wrote this book because I’m\
    \ passionate about helping business leaders sleep better at night by equipping\
    \ them with critical cyber risk management tools—CyRM℠ that protects their enterprises\
    \ while enhancing strategic business growth**.** Four decades of experience as\
    \ a financial leader for PwC, AllianceBernstein, Citibank, and others has provided\
    \ me a grounding for balancing the realities of risk with the opportunities of\
    \ business. Technology pervades all operations today, from how a business runs\
    \ to how it delivers value and succeeds. Technology also threatens all these aspects.\
    \ So, how do we flourish in this perilous environment?\n\nMy answer is to create\
    \ a commitment to CyRM℠ in your company. I’ve laid out my approach to CyRM℠ and\
    \ shown you—business  leaders and IT managers alike—how to work together and succeed.\
    \ In each chapter, I’ve highlighted what you need to know about navigating today’s\
    \ dangerous cybersecurity terrain, and outlined the proactive steps you need to\
    \ take to prepare your company—and yourself —to survive, perhaps even thrive.\n\
    \nManagement consulting pioneer W. Edwards Deming once said, \"It is not necessary\
    \ to change. Survival is not mandatory.” We all know what he meant. Given the\
    \ exponential velocity and intensity of change over the past few decades, it’s\
    \ even truer today than it was in Deming’s day. Adapt or die.\n\n# [APPENDIX A\
    \  \n\nGuiding Principles for Cyber Risk Governance](#Toc.xhtml#R_appendix-1)\n\
    \n## [Principles for Directors in Overseeing Cybersecurity](#Toc.xhtml#R_appendix-1)\n\
    \nJune 2018\n\nThe Directors and Chief Risk Officers Group ![image](images/figi12_1_B.jpg)\n\
    \n*Leaders of the global risk governance community.*\n\n![image](images/figi12_1_B.jpg)\n\
    \n## Table of Content\n\n[**Governance Council Co-Chairs**](#appendix-1.xhtml#sec12_1)\n\
    \n[**Introduction**](#appendix-1.xhtml#sec12_2)\n\n**Principles for Directors\
    \ in Overseeing Cybersecurity**\n\n[I.Cybersecurity as an Element of Enterprise\
    \ Risk](#appendix-1.xhtml#sec12_2_1)\n\n[II.Cybersecurity as a Strategic and Managerial\
    \ Issue](#appendix-1.xhtml#sec12_2_2)\n\n[III.Broad Concepts of Cybersecurity](#appendix-1.xhtml#sec12_2_3)\n\
    \n[IV.Understanding Exposure to Third-party Vendors](#appendix-1.xhtml#sec12_2_4)\n\
    \n[V.Developing a Corporate Culture that Values Cybersecurity](#appendix-1.xhtml#sec12_2_5)\n\
    \n[**Conclusion**](#appendix-1.xhtml#sec12_3)\n\n[**Guiding Principles for Cyber\
    \ Risk Governance**](#appendix-1.xhtml#sec12_4)\n\n[**DCRO Cyber Risk Governance\
    \ Council Members**](#appendix-1.xhtml#sec12_5)\n\n## [DCRO Cyber Risk Governance\
    \ Council Co-Chairs](#appendix-1.xhtml#R_sec12_1)\n\n*We offer special thanks\
    \ to the co-chairs of the DCRO Cyber Risk Governance Council for their leadership\
    \ on this initiative.*\n\n![](images/figu12_3_B.jpg)"
