    此外，第三方公司提供的服务是弹性的——换句话说，它们提供的服务和安全性有不同程度之分。这导致了不一致的安全模型。你可能听过应用程序编程接口（`APIs`）。`APIs`
    是一种编程过滤器，让用户有机会定制云服务功能以适应业务需求。例如，银行和烘焙店的需求非常不同，对它们来说，在网站上拥有特定的数据过滤器是有益的。虽然这些程序在允许用户进行身份验证、提供访问和影响加密方面非常有用，但它们也会产生漏洞。`API`
    最大的漏洞在于应用程序之间的通信——这创造了可被利用的安全风险和新的攻击面。


    举例来说：2019 年 1 月，研究人员揭示了大多数现代微处理器中一种常见的设计特征，该特征允许使用恶意的 `JavaScript` 代码从内存读取内容（包括加密数据）。这个问题有两个变体，分别被称为
    `Meltdown` 和 `Spectre`，它们允许侧信道攻击，因为它们破坏了应用程序之间的隔离。那段技术术语是另一种说法，即攻击面的扩大意味着风险的增加！


    准备好应对随云技术带来的更多潜在问题了吗？在最近的一起在线银行破解事件中，攻击者是托管该银行网站的第三方公司的前员工。据称，犯罪分子使用了 `web application
    firewall` 凭获得了“权限提升”，我们用这个词是指获取了大多数人不应看到的信息。云的另一个潜在问题包括服务提供商意外擦除数据。这最近发生在一家大型在线零售商处。通常，企业对存储在云端的数据没有恢复计划。一旦数据丢失，它就永远消失了（如果没有备份的话）。


    无论攻击是通过云端还是其他方式，针对持有敏感个人和专有数据的组织的网络攻击频率和严重性逐年剧增——这些攻击造成的资金损失已达`数十亿`。对于公共和私营组织都是如此。这些攻击对所有受影响的人无疑是破坏性的且昂贵的。


    银行、零售商、国防承包商、财富 `500` 公司、娱乐公司和地区政府——所有这些最近都是网络攻击的受害者。这只是未来更多攻击的序奏。美国许多员工现在居家办公，使用个人笔记本电脑通过不安全的互联网连接访问包含机密信息和个人数据的工作文件。这为黑客提供了充足的机会——即前面提到的“攻击面”。每家公司的攻击面都急剧扩大，使他们更容易成为目标。网络情报公司
    `CYFIRMA` 报告说，2020 年 2 月到 3 月之间，与 `COVID-19` 疫情相关的网络威胁增加了 600%。


    现在，既然我已经引起了你的注意力，对于网络攻击，我们——或者说**你**——应该怎么做？答案绝对不是掩龟自首。如果你和你的公司想在这个网络环境中生存并繁荣发展，你就必须变得明智且全面。你需要投资并增强你的网络风险管理（`CyRM℠`）。


    有些人人可能认为美国政府可以保护他们免受攻击。毕竟，我们的 `Army` 保护我们免受入侵。为什么不保护我们免受网络入侵呢？但这是一个残酷的事实：尽管美国政府擅长传统的军事防御，但遗憾的是，他们在网络防御方面并不出色。在`9·11
    事件`之后的二十年来，我们没有任何证据表明政府采取了行动来保护我们。


    考虑一下，`2014`年 11 月，`国家安全局`局长在`国会`作证时，他相信外国可以关闭电力、水务和燃料。想想看。五多年前，我们的政府接到通知，不同国家可以有效地关闭国家基础设施，但政府随后并没有给出任何关于正在采取措施的保证。也许这种威胁太理论化、太无形化，且太关乎生存。


    然而，在那次证词后仅`四天`，`朝鲜`对索尼发动网络攻击，破坏了专有信息和计算机硬件。一个国家行为者证明了它可以访问并让一家巨型跨国公司难堪。`2015`年，我们得知`人事管理局`（`OPM`）尽管早有警告，仍允许中国政府盗取
    2100 万美国人的安全许可背景数据。最近，`NSA` 未能保护高度先进的武器化的 `zero-day`。（零日漏洞是先进的网络攻击工具，速度极快且破坏性极大，以至于受害者没有时间发现它们。）`NSA`
    失败的结果是，这些漏洞现在落入了恶意攻击者手中，他们在范围内大肆破坏。`2020`年，由外国政府支持的组织的重大网络攻击渗透了美国联邦政府的多个部分。


    尽管有这些攻击和专家的反复警告，美国政府自`2002`年以来还没有通过任何独立的网络安全相关立法。`2002`年，我们都在使用 `America Online`，而
    `Gmail` 甚至不存在！最近提出的（但未通过）最重要的网络安全法案要求私营部门与政府共享更多数据。为什么公司要自愿将敏感数据交给一个在保护 `OPM`
    和 `NSA` 数据方面严重失职的实体呢？而这些数据可以说是其国家机密库中最敏感的信息之一。


    美国情报界日益担心外国政府将通过网络入侵金融机构——不是为了偷钱，而是为了污染、破坏和操纵数据。外国情报机构旨在为记录保存、交易精确度和货币估值制造混乱的网络攻击，可能会破坏并毁灭公众信任，以至于整个金融系统的稳定性都可能受到影响。


