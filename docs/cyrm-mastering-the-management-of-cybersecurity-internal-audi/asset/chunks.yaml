  trans: '

    联邦贸易委员会（FTC）此前还曾因披露问题对甲骨文（Oracle）提起诉讼，声称该公司未能告知消费者，新的软件更新不会自动删除旧版（且可能被利用的）Oracle
    Java 软件版本。去年，消费者金融保护局（CFPB）命令运营在线支付系统的 Dwolla Inc. 支付罚款并改进其安全实践，此前该公司被指控向消费者误称其网络是“安全”且“可靠”的，并且其数据安全实践“超过”或“超越”了行业安全标准。


    此外，尽管目前还没有国家层面的“数据泄露通知”法，但大多数州已经颁布法律，要求在发生涉及敏感消费者和个人身份信息的某些网络安全漏洞时，实体必须通知受影响的个人。


    Uber 可能是延迟披露和“不该如何做”最极端的例子。该公司在近一年的时间未能通知监管机构和受泄露事件影响的个人，这可能违反了州级通知法。此外，Uber 据称将不披露泄露事件作为向网络犯罪分子支付赎金的条件，这进一步加剧了掩盖真相的形象。几个州的总检察长已经对该泄露启动了调查。


    核心教训是，公司绝对必须持续审查其网络披露的充分性和及时性。这没有“一刀切”的答案。经验丰富的披露法律顾问的建议至关重要。


    如果说最近的事件教会了我们什么，那就是：如果公司未能确保第三方服务提供商也实施适当的网络风险管理系统，那么公司的网络安全协议将是徒劳。网络犯罪子的切入点往往是拥有公司系统或非公开访问数据的第三方。


    例如，Home Depot 仍在受到 2014 年网络安全事件的影响，在该事件中，黑客利用第三方支付处理程序的安全漏洞，盗了超过 5000 万 Home Depot
    客户的电子邮件和支付信息。黑客在 2013 年同样利用第三方供应商访问了 Target 的客户数据库，并偷了约 4000 万客户的支付信息。


    德勤（Deloitte）的案例说明了为什么在涉及第三方网络风险时，公司应该特别关注专业服务公司。专业服务公司——如律师事务所、审计机构和咨询公司——特别脆弱，因为它们的数据库和云计算应用程序通常包含来自许多不同客户和业务伙伴的敏感信息，而这些信息都集中在一个方便网络犯罪分子利用的地方。专业服务公司拥有的信息是网络犯罪分子极具吸引力的目标，因为通过非法交易相对容易变现。此类信息也可能是黑客分子（hacktivists）的有吸引目标。


    2016 年“巴拿马文件”丑闻是首批披露律师事务所网络漏洞的重大事件之一。受害的 Mossack Fonseca 律曾帮助数百美国客户建立离岸业务。黑客攻破了
    Mossack Fonseca 追溯到 20 世纪 70 年代的知名客户敏感信息，导致许多与该律合作过的公司暴露在风险之中。我们在“天堂地文件”丑闻中也看到类似的情况发展，该丑闻涉及
    Appleby 律师事务所泄露机客户信息。


    由于第三方通常拥有访问高度敏感公司信息的权限，在公司聘佣它们之前，应对进行严格的第三方网络风险评估。董事不需要了解每一份服务合同的具体细节，但他们应该确保公司拥有书面的供应商风险政策，以处理第三方对公司系统和敏感非公开数据的访问。至少，该政策应确保管理层进行适当的尽职调查，并意识到与特定供应商开展业务的风险。公司还应定期评估第三方风险，并确保第三方服务提供商确实履行了其义务。


    董事会应意识到向政府提供敏感非公开信息相关的风险。证券交易委员会（SEC）EDGAR 数据库的泄露引发了人们对监管机构持有多少敏感公司数据以及政府其有限资源能否保护此类数据的严重质疑。在可能的情况下，公司应考虑通过加密介质而非安全文件传输提供信息。


    网络安全不是一个要解决的问题——它是一个需要持续管理的风险，并在谨慎的情况下进行转移。作为公司风险管理工作的一部分，董事会应仔细审查与第三方供应商的合同和保单。这些协议必须明确在发生泄露时谁负责以及哪些内容在保障范围内。


    尽管网络保险仍处于早期阶段，缺乏精算数据，但它是美国公司增长最快的保险类型之一——这不无道理。与网络攻击相关的成本可能会改变公司的命运。Ponemon Institute
    最近进行的一项研究显示，全球数据泄露的平均成本为 362 万美元。大规模网络攻击的受害者可能会在这一数字后增加几个零，因为声誉损害、通知成本和长期的诉讼费用会迅速增加。


    Target 公司在今年向 SEC 提交的年度报告中报告，与其 2013 年系统数据泄露相关的累计支出已达 2.92 亿美元。


    根据该公司的说法，这笔总费用部分被 9000 万美元的保险赔款所抵消。同样，2017 年，FedEx 的荷兰子公司遭受了“NotPetya”病毒的袭击，导致运营临时中断，并导致其季度利润遭受了
    3 亿美元的打击。FedEx 没有针对该攻击的保险覆盖，FedEx 首席财务官此后透露，该事件引发了公司内部对未来是否应该购买网络保险的重新评估。


    除了保险理赔这一显而易见的潜在益处外，寻求网络保险可能为公司带来间接利益。进入网络保险市场的公司将激励使用最佳实践，因为保费在某种程度上取决于公司对保护措施的有效利用。单是申请过程就可能要求对公司现有的网络计划进行深度评估。通过这一过程，公司可能会更好地了解自身的网络风险和机会。董事会还应该意识到，在需要时，保险公司通常会提供帮助公司应对网络安全事件并减轻泄露后损失的工具。

