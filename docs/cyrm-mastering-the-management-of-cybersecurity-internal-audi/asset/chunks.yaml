    董事会通常对公司是否应该购买网络保险拥有最终决定权。作为董事会，做出这一决定可能需要应对一些新领域。你必须确定哪些是（以及应该是）被涵盖在范围内的，哪些不是（以及不需要）被涵盖在范围内的。你还需要确定特定的保费是否合理。董事会应该问的问题是，现有的保险保单是否可以涵盖某些事件。传统上，大多数商业综合责任（`CGL`）保单不包含网络“免责条款”；然而，如今，保险公司更有可能在保单中加入此类条款。董事会应确保保障范围内没有关键漏洞，并根据公司自身的风险概况考虑哪些保障范围最合理——例如，保障选项可能包括数据泄露成本；勒索；法证分析；盗窃；诉讼费用和开支；以及业务中断等。董事会还应确认其董事和高管人员（`D&O`）保单包含了对网络安全相关事件的保障。


    网络安全没有停滞不前领域。黑客攻击不断演变，上个月还是行业标准的防御措施，下个月可能就会过时。立法者和监管机构反过来努力跟上新法律新法规的步伐，这在很大程度上受到重大泄露事件后公众抗议的推动。例如，纽约州对
    Equ 信（Equifax）泄露事件做出了反应，提议监管以扩大该州首创的网络安全规则，这些规则目前要求纽约所有的金融机构必须在州注册并实施保护消费者数据的计划等。新规将将这些要求扩展到信誉报告机构。纽约州总长还提议了新立法，以修订该州现有的数据泄露通知法。值得注意的是，拟议的立法将扩大“隐私信息”的定义，并适用于任何持有纽约州居民隐私信息的实体，即使该实体在该州内没有开展常规业务。


    管理网络安全的不断变化的法律格局本身就可能被视为公司的网络“漏洞”。董事会需要意识到公司的合规义务，但这说起来易做起来难。当今公司运行在碎片化的网络安全监管体系中。州、联邦和外国监管机构都有自己的规则和指导。某些州（如加利福尼亚州和纽约州）近年来采取了特别激进的措施，在其司法管辖范围内监管并执行网络安全标准。在联邦层面，如`FTC`和`SEC`等机构在各自指定的重点领域和指导范围内处于网络安全执法的最前沿。欧盟方面实施了其《通用数据保护条例》（`General
    Data Protection Regulation`），该条例对收集欧盟公民信用卡数据或其他个人信息的公司实施了报告和其他要求。


    董事会应确保其公司继续遵守最新的网络安全州和联邦法律法规。这对于某些经常被网络犯罪分子针对的行业公司（例如金融机构），以及那些处理敏感个人信息（如个人身份识别信息、财务信息或受保护的健康信息）的公司来说，尤为如此，因为这些公司经常受到监管机构和立法者的审查。董事会的一个显而易见的第一步可能是要求公司总法律顾问和首席信息安全官（`CISO`）定期向董事会简报立法进展并提供他们的建议。鉴于许多律所正在扩大其数据隐私和网络安全业务，公司也可以根据公司的需求，借鉴外部法律顾问的专业知识，制定个性化的计划来管理网络安全风险。


    董事会也可以成为对抗“合规疲劳”的有力武器，在这种情况下，执行日常合规职能的人员在应对迥异的日常需求和多个动态目标时，会忽视全局。“。“勾选框”固然重要，但还不够够。凭借其高层次视角和地位，董事可以在鼓励管理层在改进现有流程和网络安全措施方面进行批判性和创新思维方面发挥重要作用。最终，董事会应试图确保公司的大部分精力花在实际的网络安全上，而不是仅仅为了证明合规性。


    # PRONG 2 CyberWellness℠


    # 6 CyberWellness℠


    ## 全公司方法


    无法从中心控制与员工和客户的每一次连接——因此，需要一个新的范式。公司的`CyRM℠`计划不仅需要涵盖整个公司，还需要涵盖每位员工。公司中的每个人都要对他们承担的风险负责。这需要一个积极的过程——就像身体健康计划一样，公司采取积极的方法促进健康。`Wellness℠`
    也是如此：需要在防御、响应和治理的多个维度上做出主动选择。


    正如你在前面的章节中看到的，传统的网络安全方法依赖于预防。这种过时的方法假设你的 IT 系统周围有一层坚硬的外壳。它错误地假设网络安全事件是例外——坚硬外壳的罕见穿透——而不是频繁、持续且不断创新的破解数据的尝试。良好的`CyRM℠`
    计划会说：旧方法够了，是时候践行全面的`Wellness℠`了。


    `Wellness℠` 的关键在于公司评估、衡量、监控和控制风险的能力。大多数公司通常关注泄露，这实际上只是评估的一个方面。他们需要拓宽视野，开发诸如风险容忍度等新措施，开发创新的监控技术作为关键绩效指标，并实施更好的相关控制。


    为了继续这个健康类比，请考虑近年来，我们看到公共卫生系统试图从被动模式转变为主动模式——关注预防疾病，而不仅仅是在疾病爆发发生时才做出反应。（COVID-19
    疫情加深了我们的理解，即仅仅被动应对的效果并不好！）


    与将事件视为罕见异常相反，一种情报驱动的心态假设公司已经被攻破，因此需要不断进化以保持领先。例如，在我位于山上的房子里，我有多个层次的安全措施。院子周边界有一圈铁栅栏、写着“内有狗”和“受事报报警系统保护”的牌子、光敏泛光灯、连接到每扇门窗的报警系统、隐藏在显眼之外的安全箱，以及床边的恐慌按钮。我的目标是用栅栏、泛光灯和栅栏上的牌子威慑坏人。但如果他们还是决定闯入，那么我有多个防御层次：门、窗户和窗帘都有报警，如果坏人设法在不触发外部报警的情况下进入，还有红外束、恐慌按钮、一只叫声很大的大狗以及隐藏的安全箱。

