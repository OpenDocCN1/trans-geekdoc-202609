    When we shift our focus from the IT infrastructure to the data that need to be
    protected, the first step is defining what the crucial data are. Once that’s defined,
    you can use new, proven solutions to control how the data are handled and distributed.


    Encryption, for example, can help ensure that data are secure whether at rest
    or in motion. But it isn’t fail-safe, because once cybercriminals intrude into
    a network with stolen, valid user credentials, encryption becomes useless.


    Data masking, which is the process of hiding specific data, is another useful
    tool. Data masking can be achieved a number of ways: by obscuring the data dynamically
    as users perform requests; duplicating data to eliminate the subset of the data
    that need to be hidden; or just masking the data from users or third parties.


    Another way to control data is through the use of data loss prevention (DLP) solutions,
    which can provide accurate information regarding the movement of sensitive data—and
    even block the transfer or delete it when found on unauthorized endpoints. Ongoing
    monitoring of the data using DLP solutions can help identify breaches in a timely
    fashion and limit the damage inflicted. The paradigm shift—focusing on the security
    of the data employing data-centric security—will change your corporate culture.
    Here’s how you can do it.


    ### Get the Users Involved


    Historically, anything to do with IT security was kept away from users by IT teams.
    Little wonder that users show little or no interest in the company''s security.


    In reality, users are the front line of data security. They create and handle
    the data and are best placed to understand the value of the data. Case in point:
    Allianz Ireland forced its users to select a data classification before a document
    could be shared or an email sent. The company experienced a rapid culture change
    within just a few months, resulting in a 60% increase in employee awareness of
    data security practices and an 89% reduction of breaches.


    ### Engage Employees in Training Applications


    Today''s cyber risk training focuses on phishing schemes, not protecting data.
    Most training programs aren’t engaging, interesting, or fun. They try to teach
    with borderline yes/no questions, and usually 80% of them have “yes” for an answer.
    No one fails as long as they answer all the questions. Borrrring! Now suppose
    the cybersecurity training is a video game, and you''re having fun role-playing
    a bad guy who stole valid user credentials and is now trying to steal company
    data. You receive points based on how far you go in successfully stealing data.


    The game is highly engaging, and at the end of the session you obtain a point
    score that, if high enough, comes with a reward. Even better, the company now
    has valid data to determine employees'' cyber awareness—information that could
    be used to help purchase cyber insurance.


    ### Make Diversity Part of the Security Culture


    Self-awareness and consciousness are the first steps toward changing any undesired
    behavior or attitude. Employees'' decision-making related to security is influenced
    by their diversity, their background, openness to discussing these issues, and
    attitude about community. But posters, screen savers, and even in-person group
    reviews will barely influence your employees'' ability to judge threats.


    Suppose a data breach occurs and it’s used as a learning experience for everyone.
    Instead of just creating a PowerPoint, why not have employees try to write a phishing
    email for the company? This approach takes into account the diversity of your
    employees and their varying levels of understanding of the threat.


    Long term, the board needs to understand and consider the strategic business implications
    of cybersecurity, foster the right corporate culture regarding security, and encourage
    the integration of cyber risk management practices into all governance and approval
    processes. Bottom line: a smart board of directors understands that cybersecurity
    is a management issue, not just a technical one.


    # PRONG 3: Cybersecurity as a Business Strategy


    # 8: Trust Will Become a Competitive Advantage


    When I started working at Citicorp, business was done on a handshake; your word
    was considered your bond. Numerous surveys now show that trust among people, businesses,
    and institutions has declined significantly. It’s easy to point to a few main
    drivers that undermine trust among companies and their customers, suppliers, and
    employees. Topping the list are large-scale cyberattacks and the development of
    social media platforms that create immediate transparency. The list also includes
    countless technological failures like the Google failure that disabled baby monitors
    and locked people out of their homes.


    In our fast-paced, anonymous digital world, information on a company''s product
    is readily available. As one customer service expert puts it, “customers are wired
    and dangerous.” Bad news travels faster than ever before. Being "different" is
    less and less of a competitive advantage. Instead, customers’ trust in your company’s
    credibility is the new coin of the realm—probably *the* most important competitive
    advantage you can have.


    One failure of trust really stands out in my mind. When Samsung’s Galaxy Note
    7 first hit the review cycle in August 2016, the consensus was “that it might
    be the best designed smartphone ever.” That was before the first phone exploded
    because the battery had a tendency to simultaneously combust. A month after its
    release, there’d been reports of at least 35 phones bursting into flames. Samsung
    issued a humble and apologetic statement in which the company announced it was
    recalling the Note 7 and issuing replacement devices. OK, except those replacements
    also began catching fire, including at least one on a plane. TSA banned all Note
    7s. You may remember this if you traveled that fall. Eventually, Samsung recalled
    all the phones and sent out a software update that made existing devices useless.
    The company’s decision to finally own its exploding phones and make good by replacing
    them with different models was probably what saved the company’s reputation. Credit
    Suisse analysts estimated the damages cost Samsung a cool $17 billion. That’s
    to say nothing of the consumer trust they lost.


    Equally important—perhaps even more so—trust includes safeguarding personal data.
    To gain business, every company must win customers’ trust by actually *being*
    trustworthy. Customers will ask, “Can I trust that cybersecurity is a priority
    and that my transactions, information, and personal data are correct, secure,
    and private?” A positive customer experience will be defined as accessible, frictionless,
    resilient, secure, and transparent.


    In the future, trust will become more and more important. Today we live in a world
    of platforms. We have trust platforms such as Airbnb and eBay that are essentially
    low-risk environments that encourage strangers to conduct business transactions.
    We have entertainment platforms like Netflix and iTunes taking trust a step further.
    If you try to buy an album from iTunes that you already purchased, iTunes will
    remind you that you already own it. Same with Amazon. Amazon introduced a price-check
    app, which enables your phone to scan the bar code of any product in any retail
    store, compare its price with Amazon’s, and give you a discount if you buy the
    item from Amazon.

