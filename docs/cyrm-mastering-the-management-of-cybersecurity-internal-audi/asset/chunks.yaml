  trans: '

    为了履行这一关怀责任，董事必须能够证明他们以合理的常识方式履行了对网络安全的监督职能。为此，董事应定期收到 `CEO` 和 `CISO` 的评估和保证，确保整个组织（即不仅仅是技术部门）正在执行的工作高度聚焦于保护核心资产和其他高优先级资产。这些工作计划应涉及功能分段、稳健的身份访问管理以及更高层次的员工培训，以及网络和端端的领先安全实践。


    此外，承认错误并从中吸取教训会导致更好的决策。在关于公司安全模型和漏洞的简报中，应该鼓励进行网络安全后审查。对网络安全问题的妥善考虑和参与是不可替代的。


    当然，在开发新产品和服务时，公司需要在创新和风险之间取得正确的平衡。在大多数情况下，安全性越高，产品的用户友好性和便利性越低。应该进行网络筛选的流程包括战略规划、`M&A`、产品开发以及资本分配和预算。即使是
    `HR` 流程也应该具有网络过滤器，以了解招聘、领导力培养和网络资源留存策略。


    ## II. 董事应将网络安全视为战略性和管理问题，因此应让管理层对建议和实施整体网络风险管理策略及政策负责。


    1. 管理层应对报告其行为和网络违规负责。

    2. 在适当的情况下，董事会应要求关键执行人员证明网络安全计划的某些重要方面已经执行。

    3. 提高员工意识和培训至关重要。

    4. 对网络漏洞进行第三方测试可以提供高程度的威慑力。

    5. 董事会应维持一个外部专家团队，以便在培训和危机情况下提供服务。


    董事必须通过更广泛的视角来理解安全，而不仅仅是信息技术（`IT`），因为因为对公司的潜在损害可能是毁灭性的。


    网络安全风险需要 `C-level` 问责和董事会的监督，以推动议程并管理具备正确技能的受权员工。


    与负责的公司官员就网络风险管理的讨论，应在董事会和董事委员会会议议程中获得定期且充足的时间。


    负责人员的领导技能——沟通和危机管理——应该得到同等的考虑，因为它们通常比技术技能更重要。显然，在技术的日常管理或危机时刻，拥有一位高明的领导者比拥有一位领域专家要好得多。


    董事会还应根据他们完全理解的术语（和语言）建立自评估框架，以确保实施了行业最佳实践并取得了实际进展。对结果的强关注应取代纯粹基于活动的报告。


    董事需要通过鼓励管理层各层级与下属之间的适当互动，促进稳健的网络安全状态和韧性。


    据记载，大约三分之二的成功未经授权网络攻击直接归因于员工的行动（或不采取行动的行为）。


    因此，提高员工对网络风险暴露的意识，代表了增强组织整体网络韧性的重要机会。


    通过如游戏化和持续培训等具有操作性质的倡措对员工意识进行任何可衡量的改进，将对实体保护和响应网络事件的能力产生高度的增益。


    从董事的角度来看，接收对真实和模拟事件响应事件的深度分析和评估非常重要，这些评估应详细描述上述三个之外各职能团队之间的互动。此类评估（可能由独立的第三方执行）将提供对整体网络韧性的见解，而这种韧性充其是一个不断演进的目标。


    网络韧性的重要部分包括与外部专家和公司建立关系，以支持对数据泄露做出更果断的响应。泄露后的环境不是寻找所需知识或谈判合同条款的最佳时机，因此拥有一个“随时待命”的外部资源团队可以加速恢复和业务重启。这些外部专家可以包括调查、法律、通信和系统修复等。在事件发生之前，还应考虑与执法部门（`FBI`
    等）的处理方法。


    ## III. 董事应受两个广义的网络安全概念指导


    1. 确保网络安全在三道防线内管理，以及

    2. 确保网络安全基于对收集的情报的持续反应，并促进对变化的风险环境的适应。


    ### A. 三道防线


    网络安全需要一种超越信息安全小组唯一关注的方法。首选方法是三道防线模型。第一道防线“风险识别和评估”是业务部门和信息安全团队的责任。因此，他们对拥有、理解和管理网络风险负直接问责，并让董事了解他们的风险评估情况。


    第二道防线“风险管理”是公司风险管理团队的责任，从战略业务角度就威胁的潜在影响、优先事项确定以及资源分配提供职能监督。风险管理团队还应对对第一线的网络风险方法提出建设性的战略业务挑战，确保建立了正确的政策和程序，并确保网络安全有效整合到运营和企业风险中。同样，应向董事会提供风险管理有效性的定期报告。


    第三道防线“风险监控”是内部审计的责任，为董事会和高级管理层提供企业网络风险治理有效性的保证。


    这三道防线应由一个活跃、投入的董事会指导，由董事会批准并监督公司的网络安全方法，批准战略决策和优先事项，同时对管理层提供可信且有效的制衡。


    ### B. 情报驱动方法


    传统的安全方法依赖预防策略。它使用基于异常的方法处理事件响应。相比之下，情报驱动的心态基于这样假设：公司已经遭到了入侵，因此有必要不断演进，以便在情报和事件方面保持领先。

