  trans: '


    首先，数据、连接、交易和通信量经历了前所未有的爆炸式增长，这导致传统数据系统不堪重载。


    其次，机构已经失去了有效识别问题的能力。更快的创新周期和眼目缭乱的新产品意味着，大多数企业发现自己无法快速识别安全泄露。社交网络系统、大数据、云计算、移动互联网和物联网技术正在产生个人数据流，这些数据流使得授权和信息过滤变得异常困难。


    第三，缺乏正式的控制机制。在网络安全干扰变得日益普遍且复杂的环境中，目前在检测、响应、修复和企业内部通信方面仍然没有公认的标准。这些关键职能的管理往往被留给
    IT 部门，而 IT 部门通常被指示去追求过时的“硬壳”策略，这些策略的设计初衷仅仅是为了威慑渗透尝试。


    凭借作为风险管理领导者的数十年经验，我审视了这一现状，并敏醒地意识到，我们需要一种能够持续评估其收集到的信息的有效性、可靠性和价值的信息安全模型。我开发并完善了该安全模型，将其转变为一个流程，我知道这个流程可以帮助公司避免网络攻击中最糟糕的陷阱。它被称为`cyber
    risk management`，或 `CyRM℠`。


    `CyRM℠` 是一种全新的范式，它将安全视为业务问题并与业务需求对齐。因此，它不再将安全视为由技术人员处理的技术问题，而是使用一种以结果为驱动的方法来平衡投资与风险。进一步，它不是以牺牲高管参与为代价来向问题上砸钱，而是将网络安全与业务决策联系起来，以影响业务结果。


    为了有效影响业务结果，`CyRM℠` 需要由三个部分组成：


    1. **风险管理：** 它需要将风险管理的原则应用于网络安全，以便对整个组织的风险进行全局观察，指导资源分配，更好地管理风险并实现问责制。

    2. **CyberWellness℠：** 它不仅需要涵盖整个公司，还包括每个需要对他们承担的风险负责的员工。这需要一个与网络安全的互动过程——就像公司的身体健康计划一样，公司采取积极措施促进员工的健康。

    3. **作为业务策略的网络安全：** 网络安全需要重新定位为它的本质——增长的推动者，而不仅仅设计为通过消除病毒和黑客带来的危险来降低运营风险。它还需要增强产品完整性、客户体验、运营合规性、品牌声誉和投资者信心。


    本书阐述了我对 `CyRM℠` 的方法，并向你们——无论是业务领导者还是 IT 经理——展示如何合作并取得成功。书的每一章都会告诉你管理当前网络安全格局所需要的知识。每一章都以
    `CyRM℠` 行动点结束——这些你可以采取的主动步骤，可以让你自己和你的公司做好生存和成功的准备。我期待在深入研究 `CyRM℠` 时担任你们的教育者和导师。


    # 1 现状


    2017 年 9 月 7 日，美国最大的最大的信用监控机构之一 Equifax 宣布，超过 1.43 亿客户账户遭到泄露，这可能是迄今为止影响美国消费者最严重的网络攻击。此后，受影响的人数估计已上升到
    1.47 亿。


    在 Equifax 丑闻期间，美国证券交易委员会（SEC）也发布了一些引人注目的披露信息。新上任的 SEC 主席杰·克莱顿（Jay Clayton）于 2017
    年 9 月 20 日宣布，SEC 自己的 EDGAR 申报系统在几个月前已被网络攻击者渗透。这引发了对此类系统安全性的质疑，以及拥有敏感和非公开公司信息的个人进行内幕交易的风险。


    从那以后，其他近期的高知名网络攻击层出不穷。令热门剧集《游戏王座》粉丝感到遗憾的是，HBO 电视网络被一个小组攻破，他们盗取了超过 1.5 TB 的信息，包括剧本和几部热门剧集的完整剧集。《卫报》透露，作为“四大”会计师之一的德勤（Deloitte
    LLP）——其咨询客户包括大型公司和政府部门——已成为泄露事件的受害者，内部邮件系统遭到破坏。德勤此后通知了六家信息可能受到该次泄露“影响”的客户，并完成了对该事件的内部调查。Uber
    花费了一多时间才承认自己被黑。据报道，这家网约车公司支付了一笔“赎金”，以换取黑客删除已清理数据的承诺。


    大规模数据泄露每年都在发生。2019 年，一些著名的事件包括发生在 `Capital One`、`Facebook`、`Quest Diagnostics`
    和 `First American` 的事件。在 `Capital One`，一名黑客获取了超过 1 亿客户账户的访问权限。`Quest Diagnostics`
    透露，一名用户通过第三方供应商获取了 1200 万患者的医疗信息。在剑桥分析丑闻约一年后，`Facebook` 承认无意中公开了 100 万封用户电子邮件。在一次更大的泄露中，美国房产产权公司
    `First American` 透露，近 900 亿记录遭到破坏。


    在勒索攻击方面，2019 年也是大获的一年。2020 年，公民实验室（隶多伦多大学）揭露了一个名为 `Dark Basin` 的雇佣黑客组织，位于新德。这些雇佣黑客针对
    `Exxon` 和德国公司 `Wirecard`。雇佣黑客为想要制造麻烦的客户提供服务——在不同的管辖区，阻力小且不容易被发现。2020 年，黑客通过针对远程员工入侵了美国最大的国防承包商之一洛希德·马丁（Lockheed
    Martin）。黑客获取公司访问权限只需要一个点；一旦发现该点，他们就可以接管整个网络。一旦进入，他们就可以窃取数据和秘密，甚至将授权用户排除在网络之外。


    任何公司面临的最大风险之一在于云。随着供应链变得日益复杂，金融机构依赖第三方来提供规模和灵活性。第三方提供者通常是网络入侵者利用以到达其目标的媒介。这极大地增加了公司需要考虑的攻击面——即黑客可以利用的机会范围。信任第三方会以和你相同的方式关注你的安全需求并不是明智的策略。如果你依赖薄弱的接口与云服务交互，可能会出现涉及机密性、完整性可用性和问责制的问题。


    以下是云技术可能产生的一些问题示例。攻击者现在能够使用你（或你的员工）的登录信息远程访问存储在云端的敏感数据；通过劫持的凭据伪造和操纵数据；或注入恶意软件并将其嵌入云服务器。而且，如果协同操作，攻击者可以监听、破坏敏感信息的完整性，甚至窃取数据。


