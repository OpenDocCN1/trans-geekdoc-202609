    # The first lesson is that companies must pay attention to routine alerts warning
    of cyber vulnerabilities in the company’s systems and in software the company
    uses. In Equifax’s case, hackers apparently exploited a known network vulnerability
    in the `Apache Struts` web-application software, which Equifax used to build its
    web applications. The U.S. Department of Homeland Security’s United States Computer
    Emergency Readiness Team (`US-CERT`) notified Equifax and many others of this
    vulnerability and the need to patch the software on March 8, 2017. Although the
    company disseminated the `US-CERT` notification internally by email and requested
    that appropriate personnel apply the patch, the patch was apparently not installed,
    or not installed correctly, and follow-on scans of the system one week later failed
    to reveal the error.


    # The second lesson is that companies must ensure they have appropriate systems
    in place to escalate information about potential cyber incidents and ensure, for
    example, that the general counsel imposes a freeze on trading in the company’s
    securities by individuals with insider knowledge of material breaches during key
    windows. In Equifax’s case, it was revealed that several executives had traded
    in the company’s stock after the breach had been reported internally but before
    the public had knowledge of the breach. This raised questions about possible insider
    trading and a lack of internal controls at a time when Equifax was already subject
    to intense public scrutiny over the breach itself. (The executives have since
    been cleared of wrongdoing by a special committee at Equifax tasked with analyzing
    the breach.)[⁹](#fn9)


    # The third lesson is that boards of directors must have a public response plan
    in place should a catastrophic cyberattack occur on their watch. Equifax’s public
    handling of the incident has been widely criticized from virtually all angles.
    Many, for example, have complained that it took the company a full month to disclose
    the incident publicly after the company first learned of the breach in late July
    2017. Others have ridiculed Equifax for directing consumers, in the immediate
    aftermath of the breach, to an insecure “spoofed” website mimicking the one Equifax
    had set up to engage with customers anxious to learn if their personal information
    had been compromised. Still others lamented that the company appeared to be in
    “PR mode” following the breach, and made missteps such as offering credit monitoring
    services to affected individuals for a fee, rather than free of charge. (The company
    later moved to offer victims free access to credit monitoring services, but forced
    those customers to agree to lengthy arbitration provisions which would limit the
    customers’ ability to sue Equifax in connection with the services. Equifax later
    abandoned the arbitration clause after a public outcry.)[^(10)](#fn10)


    # The fourth lesson is that companies should carefully consider when and how they
    will disclose a breach. The recent disclosures of cyber incidents at Equifax and
    Uber provide valuable guidance to boards of directors in this regard. A company
    must consider not only its legal disclosure obligations, but also the court of
    public opinion when assessing when, and what, to disclose. In a similar vein,
    some have pointed out that the `SEC`’s public disclosure of a cyber incident involving
    its `EDGAR` database came months after internal reports of the event were raised,
    illuminating just how difficult it is for any actor— including those charged with
    overseeing disclosure- based conduct—to balance the competing needs for a speedy
    public disclosure and a thorough internal review. The `SEC`’s own less-than-ideal
    response to a cyber breach (and a resulting delayed cyber disclosure) raises questions
    about how the agency will pursue companies for cyber-related disclosures in the
    future and balance the competing needs for prompt disclosures on one hand, and
    rigorous internal reviews on the other.


    # A final lesson is that companies should be aware of the risks posed when third
    parties handle sensitive company data. The events at Deloitte provide yet another
    data point and reinforce the notion that companies must be concerned not only
    with their own cybersecurity systems, but also those of third-party vendors and
    consultants (and even, perhaps, the government) when those entities handle sensitive
    company data.


    Given these recent high-profile events, we discuss below a series of practical
    considerations and principles that a board member can use to help the board build
    an effective and dynamic cybersecurity program at his or her company. These considerations
    will also help a director test the current status and effectiveness of the cybersecurity
    program.


    ## Practical Considerations for Directors


    As a first principle, directors should understand their fiduciary duties when
    it comes to cybersecurity and the overarching legal terrain guiding their companies.
    In addition to business and reputational risks, a lapse in cybersecurity can result
    in significant legal consequences for a company, its management, and, in certain
    cases, its board of directors. Companies must be aware of and understand various
    federal and state statutes, some of which regulate specific industries or types
    of sensitive information.


    Companies must also be aware that federal and state regulators, such as the `SEC`,
    `DOJ`, and `FTC`, may increasingly focus on cybersecurity when enforcing otherwise
    non-cyber-specific laws, such as federal consumer protection and securities laws.
    In addition, directors must also heed the risk of shareholder and consumer lawsuits,
    which are commonly initiated in the wake of the disclosure of cybersecurity incidents.
    As discussed below, the company’s general counsel and internal cyber personnel
    should schedule regular briefings for the board to assess these developments.


    ### 1. Take Stock of Existing Cybersecurity Risks and Prioritize


    Cybersecurity is a “first order” risk in many industries. If they have not already
    done so, boards of directors should invest in a formal briefing to discuss the
    range of existing cybersecurity risks facing their companies and weigh the pros
    and cons of various mechanisms that may help protect the company’s most valuable
    assets in light of those risks. The board should first identify the company’s
    most valuable assets and evaluate how those assets might be compromised by a cyber
    incident. For some companies, their most valuable asset is customers’ private
    financial information, personally identifiable information, or possibly health
    records. For others, it might be intellectual property, or perhaps a proprietary
    database, or even a cache of sensitive emails. Any cybersecurity program must
    be geared towards protecting these most important corporate assets.


    Directors should have a baseline understanding of the various types of cyber breaches
    that may occur on company systems and be familiar with the technical terms frequently
    used in the industry. Common cyber incidents at companies may range from malware
    to phishing attacks, and from unpatched software vulnerabilities to advanced persistent
    threats (`APT`). Additionally, vulnerabilities in a company’s physical security
    may allow actors to penetrate the company’s cyber defenses.


    While it is not necessarily incumbent on the board to study the technical mechanisms
    of a cyberattack or response thereto, the board should have enough familiarity
    with these concepts to enable productive discussions with management and effective
    oversight of the company’s cybersecurity program.

