  trans: '


    第三，重要的是要理解 `风险就是信息的缺失。` 我们所做的每件事都存在风险，因为我们不可能知晓一切——在任何情况下，总会有信息的缺失。没有比新冠肺炎（COVID-19）疫情更能体现这一点的了。你是否应该戴口罩？你每周应该去买几次食物？鉴于这一新现实，你应该如何投资你的退休资产？每个决策都存在权衡。没有一个适用于所有人的标准答案。风险是个性的。多年来，我经常对客户说，当所有人都失业时，那是衰退；当你个人失业时，那是萧条。你必须对自己的日常行为、财务选择，以及影响你、你的家庭、你的社区并间接影响整个国家的选择，进行你个人的风险/收益分析。


    做出艰难的风险决策就像亲吻响尾蛇。这绝不好玩，而且可能是致命的。但你越是系统地考虑什么对你来说真正重要、缺失了哪些信息、集体智慧在告诉你什么——并且承诺评估“相对于对我真正重要的事情，我的下行风险有多大”——你的决策就会越好。尽管这可能令人不舒服，但经过深思熟虑和仔细评估风险，总比完全不考虑要好得多。如果你得出结论认为需要帮助做出正确的决策，请尽早寻求协助。让专家来帮助你。


    最后，在危机结束后，人们只会记住你做出的判断和你取得的结果。没有人会因为你的善意而给你荣誉——只有最终的结果。最好的结果是一个深思、有纪律、有序的过程的结果，这个过程包含了集体智慧以及对确保正确的强大且高度专注的意图。


    ## 重新评估


    这里也适用常识。持续监控结果并从错误中学习，以便你将来能做出更好的决策。日本的 `kaizen`（改善）哲学，或持续改进，正是基于这种方法——通过微小的、渐进的改变来实现个人目标。例如，多年前，我曾向某慈善机构捐赠了一笔数额较大的资金，并理解这笔钱将用于启动一个我很关注的特定项目。大约一年后，我发现该慈善机构根据他们自己的计划花了大部分资金，几乎完全忽略了我的指示。我与一位积累了巨大财富的朋友吃午饭时，苦地讲述了发生的一切。“这都是你的错，”她说，“你没有很好地传达你的愿景，你没有设定里程碑，你没有根据这些里程碑监控慈善机构的进度，而且考虑到你的专业知识，你本应该知道更多。”我在重新评估我的慈善决定时没有运用常识。


    专家预测的不可避免事件——流行、地震、干旱、海平面上升和其他灾难——需要长时间才会发生，但当它们发生时，速度会非常快。场景构建（Scenario construction）是良好的实践，也是对不可避免事件发生的准备。此类练习将让你对可能可能发生的情况有一个良好的感知，这样你可以在过程中做出更好的决策。


    ## 新兴威胁


    目前使用的安全产品存在许多问题。许多杀病毒解决方案仅对已知威胁有效。平均每天会产生 350,000 种新的恶意软件变体。依赖已知恶意软件解决方案是一场无休止的、没有赢家的追逐游戏。此外，许多解决方案检测和修复攻击的时间太长。泄露的持续时间直接影响损害程度。如果你好奇的话，波波研究所（Ponemon
    Institute）得出结论，2019 年识别并持续入侵的平均时间为 279 个受影响天。进一步，更复杂的解决方案使用了依赖于历史经验的 AI 算法。尽管机器学习在检测广泛范围方面非常准确，但在检测从未见过的内容时效果并不理想，看起来安全产品似乎总是落后一步。


    此外，新兴技术往往会产生以前未遇到的新风险，并增加现有风险的复杂性。这些风险的互联性意味着需要同时处理，而不是孤立地处理。例如，公司对互联系统依赖的增加将放大故障的影响并威胁韧性。将人工智能更进一步，由于算法与社会、伦理、文化或法律规范不完全一致，将导致声誉、法律和监管方面的后果。例如，在某个网站的程序化广告在不内容旁边投放广告后，许多组织从该网站撤销了他们的广告。


    机器人（Bot）是程序化执行特定任务的软件应用程序。机器人是自动化的，这意味着它们根据指令运行，不需要人类用户启动。机器人经常模仿或取代人类用户的行为。通常，它们执行重复性任务，而且执行速度比人类快得多。恶坏机器人被设计为破解用户账户、在网络上扫描联系信息以发送垃圾邮件，或执行其他恶意活动。机器人已用于通过过度访问和权限获取大量机密数据，放大了网络事件的损害。


    自然语言生成工具和技术将能够对非结构化的“大数据”进行处理、分析和理解，公司将借此更有效地更主动地运营。然而，虚假信息的大规模也将成为可能，并以多种方式呈现，包括利用社交媒体影响舆论；通过付费在线评论创建虚假趋势；传播看起来真实的假照片/视频；以及基于错误的认知鼓励不正确的金融交易。


    ## 基于新兴威胁的场景


    考虑到这些潜在威胁以及实际发生的事件，想象这样一个涉及人工智能的潜在场景，以理解其可能性，以及在 `CyRM℠` 方面应该关注的重点。


    '
- fmt: '

    The real events, believe it or not, are several known cases in which criminals
    have taken over more than a million computers. The largest known botnet was `Bredolab`,
    which contained more than 30 million computers. It was created by a hacker network
    and made money by leasing out time on the hijacked computers to other criminal
    organizations. At its peak, it was able to send out more than three billion infected
    emails each day[²](#fn2).


    Now consider the following scenario[³](#fn3)


    ## Applying CyRM℠](#R_sec10_8)


    Based on this scenario’s events, what would you monitor, and what potential managerial
    action steps would you take? For example, as a first step, it wouldn’t be too
    difficult to monitor these attacks and get a sense of your own vulnerabilities
    against your more important assets that need to be protected. Second, perhaps
    hire web-filtering services that scan for websites exhibiting unusual behavior
    and block those websites from your users. Or perhaps standardize on a browser
    other than `Google Chrome` or `Mozilla Firefox`, which are two popular browsers
    (and, therefore, the browsers for which most malware is written). Again, it’s
    important to think of decision-making process in terms of four steps: assessment
    of the situation, rules of the game, making the decision, and reevaluating after
    the fact. Remember, it’s far better to make an error of commission—you looked
    at the issue, considered all your alternatives, then went the wrong way—as opposed
    to an error of omission, where you didn’t even consider the potential problem.


    ## Notes](#R_sec10_9)


    # Conclusion](#R_chapter11)


    In far too many companies today, involvement with cybersecurity is an afterthought,
    bolted onto what people do each day to hopefully create a secure environment.
    We all know this approach doesn’t work. Cybersecurity isn’t approached as a business
    problem and then aligned with business needs. Also, no one is playing offense
    in cybersecurity—only defense, and companies are focused on yesterday’s questions
    and threats that they don’t control. We all know that real failures are often
    not used as learning experiences and aren’t getting enough attention to effect
    change.


    Even further, boards and C-level executives mistakenly think compliance will save
    them, but in reality, compliance doesn’t equal appropriate levels of protection.
    Unfortunately, today a simple answer doesn’t exist to the question, “Is my company’s
    security adequate?” There’s also a real disconnect between executive decision-making
    and IT professionals on cybersecurity, which is something that should keep more
    people up at night, because every new estimate has increased levels of new threats.
    Cybersecurity isn’t just an important issue to get right—it’s a "must have right”
    issue. There has to be a shift in the mindset from fighting yesterday’s war to
    recognizing and getting ready to combat today’s and tomorrow’s threats.


    It really takes an army, with all its varied roles and positions, to provide appropriate
    CyRM℠. There are plenty of roles for different people, the board, C-suite executives,
    the `CISO`, IT staff, risk management staff, auditors, and every employee of the
    company. It’s an army of people from a variety of different backgrounds, wealth,
    and educational experiences, but everyone involved has a common purpose, which
    is why it functions so well.


    We’re all missing a common purpose in the cybersecurity realm: a real commitment
    to CyRM℠.

    '
