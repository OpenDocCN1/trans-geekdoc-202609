  raw: "An important component of cyber resilience entails having external experts\
    \ and firms on board to support a decisive, effective response to any data breach.\
    \ The post-breach environment isn’t the time to be searching for required expertise\
    \ or negotiating contractual terms, so having a team of external pros on board\
    \ can speed recovery and resumption of operations. These external experts should\
    \ specialize in forensics, legalities, communications, and systems remediation,\
    \ among others. Your approach to law enforcement (FBI and others) should also\
    \ be considered in advance of an incident.\n\nRepeat after me: cybersecurity cannot\
    \ be guaranteed, but a timely and appropriate reaction can.\n\n## [Establish Effective\
    \ Governance](#Toc.xhtml#R_sec6_5)\n\nCompanies need an effective governance structure\
    \ to ensure that staff and everyone you work with can conduct accurate, timely\
    \ assessments to identify current and emerging vulnerabilities. It’s best to use\
    \ an outside professional to review your governance structure. It’s critical to\
    \ involve professionals with the appropriate technical skills and knowledge of\
    \ the current risk environment. A tech-oriented professional versed in the cyber\
    \ world can be an indispensable resource.\n\n## [Ongoing Workforce Training and\
    \ Development](#Toc.xhtml#R_sec6_6)\n\nResearch indicates that two-thirds of successful\
    \ cyberattacks are directly attributable to the actions (or inactions) of employees.\
    \ Companies must ensure that employees understand the wide variety and ever-changing\
    \ nature of cyberthreats. They need to know how their own actions can help safeguard\
    \ company assets. Therefore, improving awareness of employees to risk exposures\
    \ is critical in strengthening your organization’s overall cyber resilience. Any\
    \  measurable improvement in employee awareness—through initiatives such as gamification\
    \ and ongoing training that’s operational in nature—would be highly accretive\
    \ to your organization’s capacity to protect and respond to a cyber incident.\n\
    \nUnfortunately, most employees aren’t interested in their own personal digital\
    \ security, much less their company’s. Historically, anything having to do with\
    \ IT security was kept away from users by IT teams. Is it any wonder, then, that\
    \ users show little to no interest in their company’s cybersecurity? Undoing that\
    \ disinterest is hard. Changing your organization’s corporate culture to strengthen\
    \ cybersecurity is very difficult. It requires a paradigm shift to CyberWellness℠\
    \ that keeps pace with evolving cyberthreats.\n\nIf you think about it, users\
    \ and employees should be the front line of data security. After all, they’re\
    \ the ones who create and handle information. They’re in the best position to\
    \ understand its value. Senior management should implement interactive training\
    \ and accountability programs that *engage* with users and employees. Modern game-based\
    \ training—with follow-up monitoring to see how users and employees apply their\
    \ training—can transform a company’s culture into one where cybersecurity is everyone’s\
    \ job. It’s important to cultivate and nurture a continuous learning environment—including\
    \ relevant and memorable training and tools to support strong cyber hygiene, ranging\
    \ from password protocols to antiphishing campaigns to “bring your own device”\
    \ policies.\n\nIn addition, it’s essential you create a safe environment in which\
    \ users and employees at all levels are encouraged to point out weaknesses and\
    \ vulnerabilities without worry that the messenger will be killed. Users and employees\
    \ need to know they’re acknowledged and rewarded when they identify an unmitigated\
    \ risk or emerging threat. You want them to bring you “bad news,” because you\
    \ can’t prevent or fix vulnerabilities if you don’t know they exist. A healthy\
    \ CyberWellness℠ culture praises and thanks the messengers—it doesn’t kill them.\n\
    \n## [Implement Management Processes for All Third-Party Vendors and Suppliers](#Toc.xhtml#R_sec6_7)\n\
    \nThird parties can be positively impactful to an operating environment. However,\
    \ companies aren’t usually as attuned to cybersecurity risks from third parties\
    \ as they are for their own businesses.  They should be! Third parties can create\
    \ the same adverse, long-term effects as company employees. Consider that the\
    \ sharing of data and communication between your company and its vendors is no\
    \ longer fully in control of the internal operations of your company. Vendors\
    \ and suppliers are external parties that create new entry points into a company’s\
    \ technology environment, adding complexity and potential volatility to the operating\
    \ environment.\n\nHere are some basic ground rules for any healthy third-party\
    \ program:\n\n*   Prioritize third-party exposures based on risk (including cyber)\
    \ to the organization.\n\n*   Put clear assessment tools in place for the onboarding\
    \ of any new relationships.\n\n*   Implement ongoing, risk-adjusted monitoring\
    \ processes to assess adherence to contract terms and joint disaster recovery\
    \ testing with primary service providers.\n\nLegal and other practical considerations\
    \ can (and should) be employed to partition and mitigate the risk introduced through\
    \ third-party relationships. Risk—no matter where it originates—will rebound to\
    \ your company in times of crisis or stress. Clients and customers, both corporate\
    \ and individual, will always look to *your* company for explanations and relief\
    \ when problems occur. Try explaining to someone who’s had their Social Security\
    \ number compromised that the problem came from a B2B vendor.\n\n## [Take a Step\
    \ Back](#Toc.xhtml#R_sec6_8)\n\nWhile I’ve touched on several different steps\
