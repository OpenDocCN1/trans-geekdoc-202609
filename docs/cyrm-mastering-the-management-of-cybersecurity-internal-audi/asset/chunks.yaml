    \ in place to monitor those individuals’ performances. In times past, companies\
    \ often delegated responsibility for cybersecurity to the company’s chief operations\
    \ officer or chief technology officer. Consider the officer who currently has\
    \ primary responsibility for cybersecurity at your company. Is that person C-suite\
    \ level? Is cybersecurity only one of many, pressing demands that person is currently\
    \ juggling? If the answer to the first question is “no,” and the second “yes,”\
    \ you may want to consider creating a new role in the form of a CISO.\n\nThe board\
    \ should also consider the internal reporting structure for the CISO (or other\
    \ officer with primary responsibility for cybersecurity) to ensure this individual\
    \ has the independence and authority needed to succeed in this mission-critical\
    \ role. The CISO may report to the company’s chief information officer, chief\
    \ risk officer, chief operations officer, chief technology officer, or even the\
    \ chief executive officer—but in any case, the CISO should have access to senior\
    \ management and the board as needed. Company management should also consider\
    \ establishing an information security committee chaired by the company’s CISO,\
    \ and invite C-suite officers to attend the committee’s meetings. Directors, for\
    \ their part, should understand who fills the CISO role and engage directly with\
    \ that individual as appropriate.\n\nFrom the board’s perspective, the key to\
    \ effective oversight is to hold senior management responsible for articulating\
    \ and monitoring the company’s strategy and risk tolerance related to cybersecurity.\
    \  In most cases, board members should have their noses, but not their fingers,\
    \ in the company’s cybersecurity program.\n\nOne area where boards can, and should,\
    \ play a crucial role is in developing the company’s strategic plan related to\
    \ cybersecurity. Following this initial effort, the board should oversee company\
    \ management in implementing the strategic plan.\n\nThe board should also work\
    \ with management to develop a cyber incident “response playbook” mapping out\
    \ how the company would respond to various contingencies in the event of a breach\
    \ or serious cyber incident impacting company systems. For example, in the wake\
    \ of the Uber scandal, a company may want to consider how it would approach a\
    \ ransom request, weighing the pros of potentially mitigating some of the damage\
    \ associated with a breach against the cons of rewarding criminal behavior in\
    \ this manner. Any such analysis should be flexible enough to take into account\
    \ of-the-moment law enforcement recommendations and a legal analysis of the company’s\
    \ disclosure obligations. To avoid an Equifax problem, the public response plan\
    \ should designate an internal and external team of professionals to investigate\
    \ the causes and make appropriate disclosures.\n\nThere are various frameworks\
    \ that company management can use to develop appropriate risk management strategies\
    \ related to cybersecurity. For example, in October 2013, the US Department of\
    \ Commerce’s National Institute of Standards and Technology (NIST) issued for\
    \ comment a set of voluntary standards and best practices for reducing cybersecurity\
    \ risk. The final version was released in February 2014, titled “Framework for\
    \ Improving Critical Infrastructure Cybersecurity.”\n\nThe NIST framework includes\
    \ five “functional areas,” which directors may consider in developing an overarching\
    \ cybersecurity plan for their companies. These functions include:\n\nIdentify:\
    \ Develop the organizational understanding to manage cybersecurity risk to systems,\
    \ assets, data, and capabilities.\n\nProtect: Develop and implement the appropriate\
    \ safeguards to ensure delivery of critical infrastructure services.\n\nDetect:\
    \ Develop and implement the appropriate activities to identify the occurrence\
    \ of a cybersecurity event."
