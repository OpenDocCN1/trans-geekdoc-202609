    \n# Introduction\n\n![](images/9780367565312.jpg)\n\n![](images/9780367565312.jpg)\n\
    \nBack in the 1990s—seems like eons ago, doesn’t it?—General Electric CEO Jack\
    \ Welch told business leaders, “If you’re not confused, you don’t.” I’ve always\
    \ liked that admonition, because thinking you’ve got a handle on things can lead\
    \ to arrogance and complacency; confusion keeps you humble. And if you’re humble,\
    \ you’re teachable. And being teachable—being aware that there are many things\
    \ you don’t know (and even more things you *know*)—keeps you seeking new information\
    \ and remaining alert to new threats.\n\nAt that time, I was the enterprise risk\
    \ manager for Citicorp, the largest financial institution in the world, and I\
    \ understood that financial institutions were mirrors of their environment. If\
    \ the economy in which we’re doing business is doing well, our customers do well,\
    \ and we do well. So back then, my approach was to thoroughly understand the environments\
    \ we were operating in and to keep a keen eye on inflection points—leading indicators\
    \ to know where those environments were going. For example, when our private clients\
    \ in our emerging markets business started to move their private wealth offshore,\
    \ I saw this as a leading indicator that their local economy was headed in the\
    \ wrong direction.\n\nBack then, the rate of technological innovation was a leading\
    \ indicator, so I hired MIT professor Tsutomu Shimomura to “ethically hack” the\
    \ bank. A few days later he came to me and said, “You guys are an easy target.\
    \ All someone has to do is bombard your call center. No customer will be able\
    \ to call in, and you’ll be out of business in no time.”\n\nFastforward to today:\
    \ public scrutiny (and in some cases outrage) after cyberattacks, together with\
    \ actions by regulatory authorities, have made cybersecurity a key leadership\
    \ responsibility. When things go wrong, whether in a major or minor way, the ability\
    \ to quickly identify and respond to a problem will determine the company’s ultimate\
    \ recovery. Another major breach of cybersecurity will soon be in the news. The\
    \ only question is how dramatic and costly that breach will be, and whether the\
    \ full extent of the damage will ever be public.\n\nWhat accounts for the increase\
    \ in cybercrime? Three broad new security challenges have emerged.\n"
