    如果业务部门在没有 IT 部建议的情况下做出技术决策，或者 IT 部在做出业务决策时没有考虑高层的业务目标，那么对齐是不可能的。随着业务需求和组织优先事项的变化，高层团队会通过制定符合自己的策略来做出反应，但他们很少考虑让
    IT 来支持这些变化。


    每个部门和高级高管都从自己的职能角度来看待业务问题以及机会。对齐也不例外。遗憾的是，职能部门往往无法相互交流和共享观点。董事会成员应该处于独特的地位来审视大局，并评估每个人的角色（包括
    IT 的角色）是否对所有人都是清晰的。


    在做出良好决策时，需要收集与问题相关的信息。广撒大网以充分理解问题的重要性和紧迫性至关重要。从各种来源收集大量信息也有助于产生潜在解决方案的思路。


    在过程中，不要过早评估潜在的解决方案。有时，起初看起来不合常理或疯狂的想法，在进一步考虑后可能会被证明是极可能性。管理学大师彼得·德鲁克曾说：“组织需要两类人：官僚和疯子。创新总是来自疯子——绝非来自官僚。”所以，要确保高层在征求可能解决方案的想法时，咨询了公司的那些“狂野且疯狂的人”。


    在评估高层的行动方案时，你需要确定潜在决策将如何影响其他所有参与者。问问自己：“这个决策的可能结果是什么？它对现在的业务会有什么影响？对未来又会有什么影响？”


    警告：IT 部门对这些问题的回答有时令人困惑。信息安全文化中的某些词汇和术语对于没有深度行业背景的人来说很难翻译。此外，当有问题需要解决时，IT 倾向于关注技术因素而非技术因素。当问题出现时（IT
    领域的问题以惊人的速度出现），他们假设问题要么与技术有关，要么可以通过技术或按顺序解决，这也是大多数 IT 问题的解决方式。


    ## 采取行动


    一旦你评估了选项并对高层的决策感到满意，评估每个需要的人是否都采取了行动至关重要。高层必须持续评估决策和已采取的行动，以确保一切都按计划运行。这一步也是基础性的，因为它可能要求高层在过程中寻找新信息，并进行调整和进一步的更改。


    IT 风险的衡量和评估方式与业务风险不同，这影响了决策过程。IT 风险是以性能、成本或实施时间来衡量的。当 IT 做出有关适当服务水平的决策时，他们可能会选择最高水平的服务——因为
    IT 通常是根据性能可靠性来判断的。


    而产生真正的业务价值需要不同的指标来衡量成功——而且可能不需要最高水平的服务。由于 IT 自行分配成本，它通常需要以不同的方式跟踪和管理成本，这可能会导致深刻的脱节。


    ## 管理对齐


    董事会成员评估以下内容至关重要：


    * IT 领导者是否获得了机会将其部门的角色从“服务提供者”转变为“信任伙伴”。

    * IT 策略是否在更广泛的背景下制定，以理解服务是如何帮助或阻碍业务的。

    * 公司策略不应由技术人员在不知道业务需求的情况下孤立制定。

    * IT 对公司策略的影响需要持续对话来澄清业务术语。

    * 董事会应定期检查那些警报，以便妥权衡业务取舍。


    简而言之，要在当今技术驱动的世界中有效竞争，公司需要处理好 IT 与业务的对齐。


    # 5. 针对高管和董事会的网络安全


    虽然网络安全对董事会来说并不是新挑战，但近期事件的规模和数量表明，在董事负责监督的责任和经理实施充分网络安全系统的职责方面，我们可能正经历一个转折点。事实上，近期许多公司发生的泄露事件揭示了董事会无法忽视的一系列教训。


    第一个教训是，公司必须关注有关公司系统和公司使用的软件中网络漏洞的常规警报。回想一下我提到的那些高知名网络攻击案例：Equifax、Uber、HBO 和德勤（Deloitte）。在
    Equifax 案例中，黑客显然利用了 `Apache Struts` Web 软件中一个已知的网络漏洞，Equifax 使用该软件来构建其网络应用程序。美国国土安全部美国应急准备小组（`US-CERT`）于
    2017 年 3 月 8 日通知了 Equifax 等许多其他公司此漏洞，并要求修补软件。尽管该公司通过电子邮件在内部传达了 `US-CERT` 通知并要求相关人员应用补丁，但补丁显然没有安装，或安装得不对，一周后对系统的后续扫描未能发现该错误。


    给董事会成员的第二个教训是，公司必须确保拥有适当的系统来升级有关潜在网络安全事件的信息。例如，总法律顾问是否有一套流程，在关键时间窗口内，对重大泄露有内部消息的人员冻结对公司证券的交易？在
    Equifax 案例中，据显示，在泄露内部报告之后、公众获知泄露之前，几位高管交易了公司的股票。这引发了对可能存在内部交易的质疑，以及在 Equifax 已经面临严厉公众审查时内部控制的缺失。


    '
- fmt: '

    The third lesson is that boards of directors must have a public response plan
    in place should a catastrophic cyberattack occur on their watch. Equifax’s public
    handling of the incident has been widely criticized from virtually all angles.
    Many, for example, have complained that it took the company a full month to disclose
    the incident publicly after the company first learned of the breach in late July
    2017. Others have ridiculed Equifax for directing consumers in the immediate aftermath
    of the breach to an insecure “spoofed” website mimicking the one Equifax had set
    up to engage with customers anxious to learn if their personal information had
    been compromised. Still others lamented that the company appeared to be in “PR
    mode” following the breach, making missteps such as offering credit monitoring
    services to affected individuals for a fee, rather than free of charge. Later,
    Equifax moved to offer victims free access to credit monitoring services, but
    it forced those customers to agree to lengthy arbitration provisions that would
    limit the customers’ ability to sue the company in connection with the services.
    Equifax later abandoned the arbitration clause after a public outcry.


    All of these events suggest that Equifax was ill-prepared to deal with the public
    fallout that would predictably ensue following a disclosure of this magnitude.
    A good `CyRM℠` plan is prepared for any eventuality.


    The fourth lesson for board members is that companies should carefully consider
    when and how they’ll disclose a breach. The disclosures of cyber incidents at
    Equifax and Uber provide valuable guidance to boards of directors in this regard.
    A company must consider not only its legal disclosure obligations, but also the
    court of public opinion when assessing when, and what, to disclose. In a similar
    vein, some have pointed out that the `SEC`’s public disclosure of a cyber incident
    involving its `EDGAR` database came months after internal reports of the event
    were raised, illuminating just how difficult it is for any actor—including those
    charged with overseeing disclosure-based conduct—to balance the competing needs
    for a speedy public disclosure and a thorough internal review. The `SEC`’s own
    less-than-ideal response to a cyber breach (and a resulting delayed cyber disclosure)
    raises questions about how the agency will pursue companies for cyber-related
    disclosures in the future and balance the competing needs for prompt disclosures
    on one hand, and rigorous internal reviews on the other.


    A final lesson is that companies should be aware of the risks posed when third
    parties handle sensitive company data. The events at Deloitte provide yet another
    data point and reinforce the notion that companies must be concerned not only
    with their own cybersecurity systems, but also those of third-party vendors and
    consultants (and even, perhaps, the government) when those entities handle sensitive
    company data.


    Learning the lessons I list above is only half the battle. Once senior executives
    and board members understand these lessons, it’s essential to implement an effective
    and dynamic cybersecurity program at their company. The following considerations
    will also help a director test the current status and effectiveness of the cybersecurity
    program.


    ### Legal and Fiduciary Duties


    As a first principle, directors should understand their fiduciary duties when
    it comes to cybersecurity and the overarching legal terrain guiding their companies.
    In addition to business and reputational risks, a lapse in cybersecurity can result
    in significant legal consequences for a company, its management, and in certain
    cases, its board of directors. Companies must be aware of and understand various
    federal and state statutes, some of which regulate specific industries or types
    of sensitive information. Companies must also be aware that federal and state
    regulators, such as the `SEC`, `DOJ`, and `FTC`, may increasingly focus on cybersecurity
    when enforcing otherwise non-cyber-specific laws, such as federal consumer protection
    and securities laws. In addition, directors must also heed the risk of shareholder
    and consumer lawsuits, which are commonly initiated in the wake of the disclosure
    of cybersecurity incidents. As discussed below, the company’s general counsel
    and internal cyber personnel should schedule regular briefings for the board to
    assess these developments.


    Cybersecurity is a “first order” risk in many industries. If they haven’t already
    done so, boards of directors should invest in a formal briefing to discuss the
    range of existing cybersecurity risks facing their companies and weigh the pros
    and cons of various mechanisms that may help protect the company’s most valuable
    assets in light of those risks.


    ### Asset Identification


    The board should first identify the company’s most valuable assets and evaluate
    how those assets might be compromised by a cyber incident. For some companies,
    their most valuable asset is customers’ private financial information, personally
    identifiable information, or possibly health records. For others, it might be
    intellectual property, or perhaps a proprietary database, or even a cache of sensitive
    emails. Any cybersecurity program must be geared toward protecting these most
    important corporate assets.


    ### Technical Familiarity


    Directors should have a baseline understanding of the various types of cyber breaches
    that may occur on company systems and be familiar with the technical terms frequently
    used in the industry. Common cyber incidents at companies may range from malware
    to phishing attacks, and from unpatched software vulnerabilities to advanced persistent
    threats (`APTs`). Additionally, vulnerabilities in a company’s physical security
    may allow actors to penetrate the company’s cyber defenses.


    While it isn’t necessarily incumbent on the board to study the technical mechanisms
    of a cyberattack or response thereto, the board should have enough familiarity
    with these concepts to enable productive discussions with management and effective
    oversight of the company’s cybersecurity program. In taking stock of existing
    cybersecurity risks, boards should pay close attention to trends and recent events
    in their particular industry and those impacting companies of a similar size.
    Particular types of cyberattacks appear more frequently in some industries and
    less in others. If you’re a small retailer, for example, your most pressing cybersecurity
    concern may be point-of-sale intrusions, where attackers exploit weaknesses in
    remote-access applications (often provided by third-party vendors) in order to
    siphon your customers’ credit card payment information. On the other hand, if
    you’re a large financial institution with sprawling and accessible physical infrastructure
    (e.g., `ATM` machines), then you may face a broader range of cyber vulnerabilities,
    including the risk of “skimming” attacks on individual nodes in the network.


    ### Threat Actor Profiling


    Directors should also have a broad understanding of who or which groups are most
    likely to target their companies, and for what purpose. As a starting point, the
    `2017 Data Breach Investigations Report` by Verizon suggests that the majority
    of cyber breaches are perpetrated by external threat actors (75 percent), while
    a smaller percentage are perpetrated by insiders, such as employees or former
    employees (25 percent). A growing number of breaches can be traced to state-affiliated
    actors (18 percent), while a smaller percentage involves business partners (2
    percent).


    Once the board has a good handle on the company’s existing cyberthreat profile,
    it should prioritize strategies to mitigate the risk of an actual cyber breach.
    An effective director will help the company determine which assets are most valuable
    and evaluate the key controls in place to protect them.

