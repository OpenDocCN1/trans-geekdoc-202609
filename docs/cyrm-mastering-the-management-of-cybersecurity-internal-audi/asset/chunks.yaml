    The board should also work with management to develop a cyber incident “response
    playbook” mapping out how the company would respond to various contingencies in
    the event of a breach or serious cyber incident impacting company systems. For
    example, in the wake of the Uber scandal, a company may want to consider how it
    would approach a ransom request, weighing the pros of potentially mitigating some
    of the damage associated with a breach against the cons of rewarding criminal
    behavior in this manner. Any such analysis should be flexible enough to take into
    account of-the-moment law enforcement recommendations and a legal analysis of
    the company’s disclosure obligations. To avoid an Equifax problem, the public
    response plan should designate an internal and external team of professionals
    to investigate the causes and make appropriate disclosures.


    There are various frameworks that company management can use to develop appropriate
    risk management strategies related to cybersecurity. For example, in October 2013,
    the U.S. Department of Commerce, National Institute of Standards and Technology
    (`NIST`) issued for comment a set of voluntary standards and best practices for
    reducing cybersecurity risk. The final version was released in February 2014,
    titled `Framework for Improving Critical Infrastructure Cybersecurity`.[^(14)](#fn14)


    The `NIST` framework includes five “functional areas,” which directors may consider
    in developing an overarching cybersecurity plan for their companies. These functions
    include:


    1. **Identify**: Develop the organizational understanding to manage cybersecurity
    risk to systems, assets, data, and capabilities.

    2. **Protect**: Develop and implement the appropriate safeguards to ensure delivery
    of critical infrastructure services.

    3. **Detect**: Develop and implement the appropriate activities to identify the
    occurrence of a cybersecurity event.

    4. **Respond**: Develop and implement the appropriate activities to take action
    regarding a detected cybersecurity event.

    5. **Recover**: Develop and implement the appropriate activities to maintain plans
    for resilience and to restore any capabilities or services that were impaired
    due to a cybersecurity event.[^(15)](#fn15)


    Guidelines from the `SEC` also provide valuable assistance to directors, given
    the agency’s considerable influence in markets. Cybersecurity has long been a
    priority of the `SEC`’s National Exam Program, which is overseen by the Office
    of Compliance Inspections and Examinations (`OCIE`). In August 2017, `OCIE` posted
    a risk alert highlighting the results of its Cybersecurity 2 Initiative.[^(16)](#fn16)


    As part of the Cybersecurity 2 Initiative, `OCIE` assessed how companies managed
    their cybersecurity programs in the following areas:


    1. governance and risk assessment;

    2. access rights and controls;

    3. data loss prevention;

    4. vendor management;

    5. training; and

    6. incident response.[^(17)](#fn17)


    From a broad perspective, `OCIE` found that while firms were doing more to establish
    cybersecurity programs, they were not doing enough to maintain and update those
    programs in light of the constantly changing cyber threats and attacks.[^(18)](#fn18)


    ## 5. Develop Systems to Monitor Cybersecurity Efforts


    Directors should approach monitoring their companies’ cybersecurity efforts like
    ongoing maintenance of machinery. Regular checks and adjustments will be needed,
    and it is not a one-time exercise. Technical means for conducting and preventing
    cyberattacks will constantly evolve.


    Moreover, old tactics and systems may be deemed irrelevant or insufficient as
    the company moves towards different operating systems or expands its business
    portfolio.


    Accordingly, it is wise for directors to have a standing review of the company’s
    cybersecurity program at quarterly meetings, at the very least. There should also
    be a procedure in place for briefing the board more frequently if new and serious
    issues emerge.


    The company’s board minutes should accurately reflect when cybersecurity is discussed
    at such meetings so that the board’s diligence is documented and demonstrated.
    Boards should also regularly receive a cybersecurity scorecard that highlights
    the company’s progress mitigating cyber risk, including external metrics, gap
    remediation, emerging risks, trade-offs, and other issues. The scorecard does
    not need to include highly technical key performance indicators to be effective.
    Instead, examples of good metrics for the board include:

    * customer satisfaction (customer system downtime caused by information security
    incidents)

    * reputation (number of information security incidents reported in the media)

    * financial (information security budget as a percent of IT budget)


    As an important principle, boards should ensure that management and company employees
    collect, analyze, and share data regarding cybersecurity incidents—both large
    and small—to help inform the effectiveness of ongoing cybersecurity efforts. The
    company should also prioritize collecting, analyzing, and sharing internally any
    information the company may receive from government, private, or non-profit sources
    regarding cyber vulnerabilities and possible exposure.


    Following Equifax, it is important for all companies to take a hard look at their
    information escalation protocols. Who is informed when a possible cyber incident
    is first picked up on the company’s radar?


    Oftentimes, more junior employees will be best-placed to observe the first signs
    of a cyber breach. When it comes to installing critical software patches—such
    as in Equifax’s case—ensure there are systems in place for appropriate supervision
    and peer review such that one person’s human error does not result in a catastrophic
    (and preventable) breach.


    Directors should also ensure the company has a system in place to encourage employees
    and management to learn from past mistakes.


    Acknowledging mistakes and learning from them leads to better decision making.
    Cybersecurity post mortems should be encouraged in briefings about the company’s
    security model and vulnerabilities.


    When a mistake occurs, this is also a good time to consult a lawyer. Certain mistakes
    come with legal responsibilities. For example, a company may have to disclose
    cybersecurity risks and adverse cyber events to its shareholders. Boards should
    make sure any post mortem, and any policy that grows out of it, include the necessary
    legal response.


    ## 6. Review Adequacy of Cyber Disclosures


    More and more public companies are describing cybersecurity as a risk in their
    financial disclosures each year.[^(19)](#fn19)


    Equifax received significant criticism for waiting until September to disclose
    a breach it discovered in late July. But companies and regulators alike are realizing
    that there is a major tension between disclosing early on one hand, and waiting
    to learn all material facts in order to avoid making misleading or inaccurate
    disclosures, on the other. The `SEC` itself was subject to criticism for its perceived
    missteps in handling the `EDGAR` data breach. The `SEC` first reported that no
    personally identifying information was taken; it later had to revise these statements.[^(20)](#fn20)


    It is critically important for companies to have appropriate escalation protocols
    in place. Do not lose precious time waiting for the report of a breach to slowly
    make its way up the chain to decision-makers. Instead, any time between a material
    breach and disclosure should be well spent investigating the facts and analyzing
    the issues.


    The `SEC` has provided some guidance in this area. In 2011, the `SEC`’s Division
    of Corporation Finance published guidance for public companies concerning disclosure
    obligations related to cybersecurity threats and adverse cyber events.[^(21)](#fn21)

