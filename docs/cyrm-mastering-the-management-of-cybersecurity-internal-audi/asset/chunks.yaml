  trans: '


    **响应**：针对检测到的网络安全事件，开发并实施适当活动以采取行动。


    **恢复**：开发并实施适当活动以维持韧性计划，并恢复因网络安全事件受损的任何能力或服务。


    ### SEC 的指南

    鉴于美国证券交易委员会（SEC）对市场的巨大影响力，SEC 的指南也为董事会提供了宝贵的帮助。网络安全一直是 SEC 国家检查计划的重中之重，该计划由合规检查检查办公室（`OCIE`）监督。2017
    年 8 月，`OCIE` 发布了一份风险警报，强调了其“网络安全 2 号倡议”（Cybersecurity 2 Initiative）的结果。尽管该倡议仅关注经纪交易商、投资顾问和基金——这些
    SEC 拥有主要管辖权的实体——但 `OCIE` 的发现为其他行业的公司董事及其管理层提供了一个模板，可用于评估自身在网络安全方面的努力。


    作为网络安全 2 号倡议的一部分，`OCIE` 评估了公司在以下领域管理网络安全计划的情况：


    1. 治理与风险评估

    2. 访问权限与控制

    3. 数据泄防护

    4. 供应商管理

    5. 培训

    6. 事件响应


    从广泛的角度来看，`OCIE` 发现，虽然公司在建立网络安全计划方面做得更多，但面对不断变化的网络威胁和攻击，他们在维护和更新这些计划方面做得还不够。例如，`OCIE`
    注意到几乎所有公司都有应对访问事件的计划，例如拒绝服务事件和未经授权的入侵；然而，受调查的顾问和基金中不足三分之二的似乎未能充分维护此类计划。


    ### 董事的角色

    董事应当将监控公司网络安全努力的工作比对机器的持续维护。需要进行定期的检查和调整，这并不是一项一次性的任务。用于实施和防止网络攻击的技术手段将不断演进。此外，随着公司转向不同的操作系统或扩大其业务组合，旧的战术和系统可能被认为无关或不足。


    因此，董事会至少在季度会议上对公司的网络安全计划进行常态化审查是明智的。当出现新的严重问题时，还应有一套程序更频繁地向董事会进行汇报。公司的董事会议记录应准确反映在此类会议上讨论网络安全的情况，以便董事的尽职调查得到记录和证明。


    董事会还应定期收到网络安全计分卡，突出公司在缓解网络风险方面的进展，包括外部指标、差距修复、新兴风险、权衡和其他问题。计分卡不需要包含高度技术性的关键绩效指标才能发挥作用。相反，对董事会而言的良好指标示例包括：

    * 客户满意度（由信息安全事件导致的客户系统停机时间）

    * 声誉（媒体报道的信息安全事件数量）

    * 财务（信息安全预算占 IT 预算的百分比）


    作为一个重要原则，董事会应确保管理层和公司员工收集、分析并共享有关网络安全事件的数据（无论大小），以帮助了解持续网络安全努力的有效性。公司还应优先收集、分析并内部内部从政府、私人或非营利组织获取的有关网络漏洞和可能暴露的任何信息。


    ### 事件升级与学习

    在 `Equifax` 事件之后，所有公司认真审视其信息升级协议都是至关重要的。当可能的网络事件首次被公司雷达发现时，谁会收到通知？通常，初级员工最适合观察网络泄露的初步迹象。在安装关键软件补丁时——例如在
    `Equifax` 的案例中——确保有适当的监督和同行评审系统，以免个人的人为疏误导致灾难性的（且是可避免的）泄露。


    董事还应确保公司有一套系统，鼓励员工和管理层从过去的错误中学习。承认错误并从中学习可以带来更好的决策。。在有关公司安全模型和漏洞的简报中，应鼓励进行网络安全事后分析（postmortems）。


    当错误发生时，这也是咨询律师的好时机。某些错误伴随着法律责任。例如，公司可能需要向股东披露网络安全风险和不利的网络事件。董事会应确保任何事后分析以及任何由此产生的政策都包含必要的法律应对措施。


    ### 披露挑战

    每年都有越来越多的上市公司在年度财务披露中将网络安全描述为一种风险。但要披露什么、以及何时披露，对于许多人来说仍然是一个棘手的问题。`Equifax` 因等到
    9 月才披露其在 7 月底发现的泄露而受到严厉批评。但公司和监管机构都意识到，早披露与等待了解所有实质性事实以避免做出误导性或不准确的披露之间存在着巨大的紧张关系。


    SEC 本身也因处理 `EDGAR` 数据泄露时的感知失误而受到批评。SEC 最初报告称没有个人身份信息被盗取；随后不得不修订这些声明。此外，该泄露发生在
    2016 年，但直到 2017 年 9 月才向公众报告。


    公司建立适当的升级协议至关重要。不要浪费宝贵时间等待泄露报告缓慢地层层上报给决策者。相反，在实质性泄露和披露之间的任何时候，都应该花在调查事实和分析问题上。


    ### 监管指导

    SEC 在该领域提供了一些指导。2011 年，SEC 公司财务部发布了针对上市公司的有关网络安全威胁和不利网络事件披露义务的指南。该指南建议，如果为了使其他披露不产生误导，则应披露有关网络风险和不利网络事件的实质性信息。


    特别是，公司应根据之前网络事件的严重性和频率来审查其网络风险。公司还应根据其特定行业存在的风险，考虑其网络防御的充分性。公司应避免通用的风险因素披露，而应考虑其独特的事实和情况。例如，如果公司*已经*经历过该威胁，那么披露威胁*可能*发生将是不够的。如果与网络风险或事件相关的成本或后果可能对公司的财务状况产生实质性影响，公司还应考虑在其定期文件的管理层讨论与分析（`MD&A`）部分中包含对网络风险和事件的讨论。


    虽然 SEC 尚未采取行动，其他监管机构已开始积极执行网络相关的披露义务。例如，2017 年 8 月，`Uber` 就就了联邦贸易委员会（`FTC`）就 2014
    年的泄露事件提出的指控。FTC 指控该公司在保护客户信息方面的努力上做出了欺骗性陈述，并未能采取“合理的、低成本的措施”来防止对客户个人数据的未经授权访问。同时，FTC
    确认目前正在审查 `Uber` 对 2016 年泄露的回应，该公司最近才披露了该事件。


