    读者注意，过去的业绩不代表未来。本广告的任何内容均未获得最高法院批准。有关选择过程的信息，请访问 [`www.hubbard.com/legal-notices`](https://www.hubbard.com/legal-notices)。


    ## 引言


    2017 年 9 月 7 日，美国最大的信用监控机构之一 Equifax 公司（Equifax Inc.）宣布，其 1.43 亿客户的账户遭到入侵，这可能是迄为止对美国消费者影响最严重的网络攻击。


    在 Equifax 丑闻期间，美国证券交易委员会（“SEC”）也披露了一些引人注目的内幕信息。新任 SEC 主席杰伊·克莱顿（Jay Clayton）于 2017
    年 9 月 20 日宣布，SEC 自身的 EDGAR 文件系统在几个月前已被网络罪分子渗透，这引发了人们对系统安全性以及拥有敏感非公开信息的人员可能进行内幕交易风险的担忧。


    近期其他高知名的网络攻击也层出不穷。令热门剧集《游戏之王》粉丝遗憾的是，HBO 电视网络在 2017 年 7 月遭到一个团体的入侵，他们盗走了超过 1.5
    TB 的信息，包括剧本和几部剧的完整集。


    在另一个更具轰动故事中，Uber 技术公司（Uber Technologies, Inc.）近期披露的细节显示，该网约车公司的系统在 2016 年遭到入侵，黑客盗走了数百万
    Uber 客户和司机的姓名、电子邮件地址、电话号码和执照号。Uber 不仅在一年多内没有披露此次入侵，据称还向黑客支付了“赎金”，换取黑客承诺删除被盗数据并对这一网络事件保持沉默。


    尽管网络安全对董事会来说并不是一个新挑战，但近期事件的规模和数量表明，在董事监督以及管理层实施公司充分网络安全系统的职责方面，我们可能正处于一个转折点。


    ## 董事的职责


    许多董事明白他们负有监督网络安全的责任。但更令人困惑的是他们现在应该做什么。他们应该问哪些正确的问题？下面我们对您应该关注的网络安全合规的主要领域进行了了简要讨论。我们邀请您将本文存档，并在董事会期间讨论网络安全时使用本文末的大纲。


