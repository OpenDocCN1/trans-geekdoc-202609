  trans: '


    第三点教训是，如果在其任期间发生了灾难性的网络攻击，董事会必须拥有一套公共响应计划。Equifax 对该事件的公开处理受到了来自几乎所有角度的广泛批评。例如，许多人抱怨，公司在
    2017 年 7 月底首次获知泄露后，花费了整整一个月才公开披露了该事件。还有人嘲笑 Equifax，在泄露发生后的立即，竟然将消费者引导至一个不安全的“钓鱼”网站，该网站模仿了
    Equifax 建立的网站，用以与那些急于了解个人信息是否被泄露的客户接触。也有人感叹，公司在泄露后似乎处于“公关模式”，犯了诸如向受影响的个人收取收费提供信用监控服务等错误，而不是免费提供。随后，Equifax
    转向为受害者提供免费的信用监控服务，但它强迫这些客户同意冗长的仲裁条款，这些条款限制了客户就相关服务起诉公司的能力。在公众的强烈抗议后，Equifax 最终放弃了仲裁条款。


    所有这些事件都表明，Equifax 并没有准备好应对这种规模的披露后预料中会发生的公众影响。良好的 `CyRM℠` 计划是为任何可能性做好了准备。


    董事会成员的第四点教训是，公司应该仔细考虑何时以及如何披露泄露事件。Equifax 和 Uber 的网络事件披露为这方面的董事会提供了宝贵的指导。公司在评估何时以及披露什么内容时，不仅要考虑其法律披露义务，还要考虑公众舆论。类似地，一些人指出，`SEC`
    对涉及其 `EDGAR` 数据库的网络事件进行的公开披露，在内部对该事件提出报告后几个月才公布的，这说明了对于任何行为者——包括负责监督基于披露行为的人员——来说，在快速公开披露和彻底内部审查之间平衡竞争需求是多么困难。`SEC`
    自身对网络攻击不尽人意的反应（以及由此导致的网络披露延迟）引发了人们对该机构未来将如何追究公司网络相关披露问题，以及如何在一方面的及时披露和另一方面的严谨内部审查之间平衡竞争需求的疑问。


    最后一个教训是，公司应该意识到第三方在处理公司敏感数据时所带来的风险。德勤（Deloitte）的事件提供了另一个数据点，并强化了这样一个观点：当这些实体处理公司敏感数据时，公司必须关注自己的网络安全系统，还必须关注第三方供应商和顾问（甚至可能是政府）的系统。


    学习我上面列出的教训只是战斗的一半。一旦高级高管和董事会成员理解了这些教训，在公司内部实施一套有效且动态的网络安全计划是至关重要的。以下考虑因素也将帮助董事测试当前网络安全计划的现状和有效性。


    ### 法律与信托职责


    作为基本原则，董事在涉及网络安全时应理解他们的信托义务以及指导其公司的整体法律环境。除了业务和声誉风险外，网络安全的疏忽可能会给公司、管理层以及在某些情况下给其董事会带来重大的法律后果。公司必须意识到并理解各种联邦和州法律，其中某些法律监管了特定行业或类型的敏感信息。公司还必须意识到，联邦和州监管机构（如
    `SEC`、`DOJ` 和 `FTC`）在执行其他非网络特定的法律（如联邦消费者保护法和证券法）时，可能会日益关注网络安全。此外，董事还必须警惕股东和消费者诉讼的风险，这些诉讼通常在网络安全事件披露后引发。如下文所述，公司的总法务和内部网络人员应为董事会安排定期简报，以评估这些进展。


    网络安全是许多行业中的“首要”风险。如果董事会尚未这样做，他们应该投资进行正式简报，以讨论其公司面临的一系列现有网络安全风险，并根据这些风险权衡各种可能帮助保护公司最有价值资产的机制优缺点。


    ### 资产识别


    董事会首先应该识别公司最有价值的资产，并评估这些资产可能受到网络事件的损害。对于某些公司来说，它们最有价值的资产是客户的私人财务信息、个人身份信息，或可能是健康记录。对于其他公司来说，可能是知识产权，或者可能是专利数据库，甚至是一组敏感电子邮件。任何网络安全计划都必须以保护这些最重要的公司资产为目标。


    ### 技术熟悉度


    董事应该对公司系统上可能发生的各种类型网络泄露有基础了解，并熟悉行业经常使用的技术术语。公司常见的网络事件范围从恶意软件到钓鱼攻击，从未修补的软件漏洞到高级持续性威胁（`APTs`）不等。此外，公司物理安全中的漏洞可能允许攻击者渗透公司的网络防御。


    虽然董事会并不负责研究网络攻击的技术机制或其应对措施，但董事应该对这些概念有足够的熟悉，以便与管理层进行高效讨论，并对公司的网络安全计划进行有效监督。在总结现有网络安全风险时，董事应密切关注其特定行业的趋势和近期事件，以及影响相似公司的事件。特定类型的网络攻击在某些行业频率较高，而在另一些行业则较低。例如，如果你是一个小型零售商，你最迫切的网络安全可能是
    POS 入侵，攻击者利用远程访问应用程序（通常由第三方供应商提供）的漏洞来提取客户的信用卡支付信息。另一方面，如果你是一个拥有庞大且易访问的物理基础设施（例如
    `ATM` 机器）的大型金融机构，你可能面临更广泛的网络漏洞，包括对网络中单个节点遭受“侧录”攻击的风险。


    ### 威胁者画像


    董事还应该宽泛了解谁或哪些团体最可能针对其公司，以及目的是什么。作为一个起点，维电的《2017 数据泄露调查报告》建议，大多数网络泄露是由外部威胁者实施的（75%），而较小比例是由内部人员（如员工或前员工）实施的（25%）。日益增加的泄露可以追溯到国家关联者（18%），而较小比例涉及业务伙伴（2%）。


    一旦董事会对其公司现有的网络威胁概况有了良好的掌握，就应该优先考虑降低实际发生网络泄露风险的策略。一名有效的董事将帮助公司确定哪些资产最有价值，并评估保护这些资产的关键控制措施。


