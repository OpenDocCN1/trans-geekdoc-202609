  trans: '

    董事会还应与管理层合作，制定一份网络安全事件“响应手册”，规划出公司在发生数据泄露或影响公司系统的严重网络事件时将如何应对各种突发情况。例如，在 Uber
    丑闻之后，公司可能需要考虑处理赎索请求，在可能减轻某些与泄露相关的损害的优点，与以这种方式奖励犯罪行为的劣势之间进行权衡。任何此类分析应具有足够的灵活性，以考虑到执法部门的实时建议以及对公司披露义务的法律分析。为了避免埃克福（Equifax）问题，公共响应计划应指定一个内部和外部专家团队来调查原因并进行适当披露。


    公司管理层可以使用各种框架来制定与网络安全相关的适当风险管理策略。例如，2013 年 10 月，美国商务部国家标准与技术研究所（`NIST`）发布了一套旨在降低网络安全风险的自愿标准和最佳实践征求意见。最终版本于
    2014 年 2 月发布，题为《改进关键基础设施网络安全框架》。^(14


    `NIST` 框架包含五个“功能领域”，董事可以在为公司制定整体网络安全计划时考虑这些领域。这些功能包括：


    1. **识别**：建立组织理解，以管理系统、资产、数据和能力的网络安全风险。

    2. **保护**：开发并实施适当的安全措施，以确保关键基础设施服务的交付。

    3. **检测**：开发并实施适当活动，以识别网络安全事件的发生。

    4. **响应**：开发并实施适当活动，对检测到的网络安全事件采取行动。

    5. **恢复**：开发并实施适当活动，以维护恢复性计划并恢复因网络安全事件受损的任何能力或服务。^(15


    鉴于美国证券交易委员会（`SEC`）对市场的巨大影响，其指南也为董事提供了宝贵的帮助。网络安全一直是 `SEC` 国家检查计划的重点，该计划由合规检查检查办公室（`OCIE`）监督。2017
    年 8 月，`OCIE` 发布了一份风险警报，强调了其“网络安全 2 号倡议”的结果。^(16


    作为“网络安全 2 号倡议”的一部分，`OCIE` 评估了公司在以下领域如何管理其网络安全计划：


    1. 治理和风险评估；

    2. 访问权限和控制；

    3. 数据泄露防护；

    4. 供应商管理；

    5. 培训；以及

    6. 事件响应。^(17


    从整体来看，`OCIE` 发现，虽然公司在建立网络安全方面做得越来越多，但面对不断变化的网络威胁和攻击时，他们在维护和更新这些计划方面做得不够。^(18


    ## 5. 建立监控网络安全工作的系统


    董事应将监控公司的网络安全工作视为对机器的持续维护。需要进行定期的检查和调整，而不是一次性的工作。用于实施和防止网络攻击的技术将不断演进。


    此外，随着公司向不同的操作系统迁移或扩大业务组合，旧的战术和系统可能被认为无关或不足。


    因此，董事会至少在季度会议上对公司的网络安全计划进行定期审查是明智的。还应建立一套程序，在出现新的严重问题时更频繁地向董事会进行简报。


    公司的会议记录应准确反映在此类会议上讨论网络安全的情况，以便董事会的尽职调查得到记录和证明。董事会还应定期收到网络安全计分卡，突出显示公司在缓解网络风险方面的进展，包括外部指标、差距修复、新兴风险、权衡和其他问题。计分卡不需要包含高度技术性的关键性能指标即可发挥作用。相反，适用于董事会的良好指标示例包括：

    * 客户满意度（由信息安全事件导致的客户系统停机时间）

    * 声誉（媒体报告的信息安全事件数量）

    * 财务（信息安全预算占 IT 预算的百分比）


    作为一项重要原则，董事会应确保在会议上讨论网络安全时，收集、分析并分享有关网络事件的数据（无论大小），以告知网络安全工作的有效性。公司还应优先从政府、私人或非营利机构获取任何有关网络漏洞和可能暴露的信息。


    在埃克福事件之后，所有公司认真审视其信息升级协议都是重要的。当可能的网络事件首次被发现时，谁应该被通知？


    通常情况下，初级员工最有利于观察网络的的迹象。在安装关键软件补丁时（例如埃克福案例），要确保有适当的监督和同行评审系统，以防止一个人的人为错误导致灾难性的（可预防的）泄露。


    董事还应确保公司有一套系统，鼓励员工和管理层从过去的错误中学习。


    承认错误并从中学习有助于做出决策。在关于公司安全模型和漏洞的简报中，应鼓励进行事后分析。


    当错误发生时，这也是咨询律师的好时机。某些错误带有法律责任。例如，公司可能需要向股东披露网络安全风险和不利的网络事件。董事会应确保任何事后分析以及由此产生的政策都包含必要的法律应对。


    ## 6. 审查网络披露的充分性


    越来越多的公司每年在财务披露中将网络安全描述为风险。^(19


    埃克福因在 7 月下旬发现泄露后直到 9 月才披露而受到严重批评。但公司和监管机构都意识到，在早期披露与等待了解所有重大事实以避免做出误导性或不准确的披露之间存在着巨大的张力。`SEC`
    自己也因处理 `EDGAR` 数据泄露方面的失误而受到批评。`SEC` 最初报告没有个人身份信息被获取；随后它不得不修正这些声明。^(20


    公司建立适当的升级协议至关重要。不要浪费宝贵时间等待泄露报告缓慢地层层上报到决策者手中。相反，在重大泄露和披露之间的任何时间都应该好好花在调查事实和分析问题上。


    `SEC` 在该领域提供了一些指南。2011 年，`SEC` 的公司金融部发布了针对上市公司的有关网络安全威胁和不利网络事件披露义务的指南。^(21

