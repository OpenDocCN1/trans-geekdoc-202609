    在上述场景中，如果中国是我公司主要的零部件供应商，我显然会担心我的备用供应链。如果中美之间的紧张局势升级，韩国可能不会是我的“首选供应商”。我还会监控首尔和东京之间的关系（到目前为止他们一直是敌对的），因为在朝鲜干预的情况下，如果首尔和东京都站在美国的一边，中国可能会花更多时间克制平壤，而不是支持其参与冲突。


    我在花旗银行（Citicorp）工作时，我们会监控高净人士资本的本地流动。资本从新兴市场流出预示着问题的开始——毕竟，只有该国家的人才最了解这一点——并预示了该国货币最终的贬值。如果我们等到当地政府采取行动，而不是自己监控资本流动，那么等到反应时已经太晚了。现在对未来不做任何事情往往会产生最高风险。“触发线”能让你在事件开始左右你之前采取主动行动。


    # 针对风险做出更好的决策


    每当我听到有人说他们看到了“隧道尽头的光”时，我的第一个想法是那可能是迎面而来的火车车灯。也许矿井比隧道是一个更恰的比喻：我们正在黑暗中前行，寻找黄金。我们不能仅仅根据我们看到的或自认为知道的来对未来做出决策。现实中，我们的决策总是基于不完整的信息——这只是我们当时手头拥有的最佳信息。因此，我们必须学会管理与不完美的决策过程相关的风险。我们可以将决策过程分为四个步骤：形势评估；游戏规则；做出决策；事后重新评估。


    # 评估


    了解你所处何地非常重要。在设定目标和管理风险之前，必须对你当前的状况进行清醒、彻底的评估。然而，我们感官本身的局限性使我们无法意识到周围发生的大多数事情，而这在大多数时候是一件好事。想象一下，如果我们能听到身体内细胞不断分裂的声音——那阵轰鸣会会震聋我们的耳朵。事实上，清晰思考的能力似乎依赖于某种程度的感官剥夺。正因如此，我们大多数人在工作时都会避免噪音。从更广泛的意义上说，我们每天开始时的第一个感觉是周围的环境。尽管这个过程可能在潜意识中发生，但我们的眼睛首先接收卧室熟悉的景象，从而确立我们的位置。这似乎是我们的大脑在告诉我们，为了知道我们在做什么以及可能去去哪里，我们必须首先知道自己在哪里。起初，这看起来可能是一个矛盾——即，一个人可以同时关注短期事件和长期计划的想法——但我们的生活充满了不一致性。秘诀在于知道在时机合适时改变你的视野，先研究细节，然后退一步观察大局。毕竟，没有细节，大局根本就不存在。


    （注：原文中存在大量重复段落，此处译文已保留唯一逻辑内容）


    # 游戏规则


    了解你所处何地非常重要。在设定目标和管理风险之前，必须对你当前的状况进行清醒、彻底的评估。然而，我们感官本身的局限性使我们无法意识到周围发生的大多数事情，而这在大多数时候是一件好事。


    # 做出决策


