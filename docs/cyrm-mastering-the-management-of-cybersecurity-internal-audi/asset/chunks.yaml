    ## [Assessment](#Toc.xhtml#R_sec10_2)


    It’s important to know where you are. A clear-eyed, thorough assessment of your
    current position is necessary before you can set goals and manage risks. However,
    the limits of our senses themselves keep us from being aware of much that goes
    on around us, and this, more often than not, is a good thing. Imagine, for example,
    if we were able to hear the sounds of the cells in our bodies, endlessly dividing
    themselves—the roar would deafen us. In fact, it seems as if the ability to think
    clearly is dependent on a certain level of sensory deprivation. For this reason,
    most of us avoid noise as we work. In a broader sense, our first sensations at
    the beginning of every day are our immediate surroundings. Though the process
    may occur subconsciously, our eyes first take in the familiar sights of our bedrooms,
    establishing our location. This, it seems, is our mind’s way of telling us that
    in order to know what we’re doing, and where we might go, we first have to know
    where we are. At first, this may appear to be a contradiction—that is, the notion
    that one can focus both on short-term events and long-term plans—but our lives
    are full of inconsistencies. The trick lies in knowing how to change your field
    of vision when the time is right,  first studying the details, then stepping back
    to look at the big picture. Without the details, after all, the big picture doesn’t
    exist at all.


    It’s equally important to know what you don’t know. Understand the limits of your
    own knowledge and question the assumptions of others. For example, there are numerous
    studies that predict that the populations of three of the world’s five largest
    economies—the European Union, Japan, and Germany—will decline over the next forty
    years, as well as those of Italy, Russia, and South Korea. Those changes will
    unquestionably cause changes in global economic production and will almost certainly
    tilt the balance of military power. The effects of population aging will greatly
    exacerbate this trend, reducing the number of productive workers in the world’s
    leading economies, while simultaneously causing the costs of health care to rise.
    While these assumptions are based on projections—and thus truly on things we don’t
    know—the trends are sufficiently alarming to warrant ongoing examination and questioning
    of the underlying assumptions in the years to come.


    ## [Rules of the Game](#Toc.xhtml#R_sec10_3)


    It’s essential that you determine how much risk you’re willing to accept to achieve
    your goals. What do you have to gain if you achieve your goal? What are you willing
    to give up to achieve this goal? Years ago, I was engaged by a world-class investment
    company to help the company’s senior management make what we called a “how high
    is too high” decision. In other words, how much was senior management willing
    to lose in a given investment position? We went around and around in the CEO’s
    conference room, but we finally settled on the following simple answer: “too high”
    was a loss that they would be embarrassed to read about on the front page of the
    *Wall Street Journal*. Staying below that number would give the company’s management
    peace of mind. For them, an appetite for risk was related to a desire to avoid
    bad publicity. I advised them to put limits on the company’s portfolio so that
    its losses would never exceed the amount they could tolerate seeing on the front
    page of the newspaper. The company’s head of quantitative analysis complained
    that these limits weren’t precise enough. Everyone laughed when I responded: “Better
    to be approximately right than to be precisely wrong." When you define the rules
    of the game, it’s easier to make decisions.


    ## [Making Your Decision](#Toc.xhtml#R_sec10_4)


    Many years ago, I had lunch with Margaret Thatcher. I asked her, “Prime minister,
    why did you go to war with Saddam Hussein?” She looked directly into my eyes and
    said, “You never let a bully push you around. I called up President Bush and we
    went to war.” Her answer taught me that important and difficult decisions should
    be made based on simple, fundamental principles.


    First, and most importantly, we need to identify the risks that we are simply
    not willing to take, irrespective of any potential personal cost. As COVID-19
    took over the world, US Navy Capt. Brett Crozier acted on principle. Faced with
    the choice between the potential death of hundreds (or thousands) of sailors under
    his command, versus waiting on the chain of command to act, he chose the safety
    and well-being of his crew. Likewise, if each of us understands our stress points,
    we can identify the non-negotiable risks in our own situation that we’re simple
    not willing to take—no matter what. This puts us in a better position to make
    good decisions earlier in the process.


    When evaluating risk, we all tend to *underestimate* the severity and velocity
    with which those risks can hit. Six months before the 2008 financial crisis, I
    asked the former CEO of Lehman Brothers, "What’s your strategy here?” He answered,
    “Save Mother!” Does that answer sound vaguely familiar to the answers we hear
    from others today? It’s essential to understand that the best decisions in life
    are made when you have *real* alternatives. Therefore, take steps now to create
    realistic contingency plans that will protect you against the downside.'
