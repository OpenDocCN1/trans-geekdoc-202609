    \ of managing *uncertainty*—it becomes  a question of *survival.* Your thought\
    \ process switches from “Are the costs reasonable for the risks I’m assuming?”\
    \ to “This is a risk I’m just not willing to assume. Are the protections I have\
    \ in place adequate for me to not get seriously hurt?\" In other words: *At what\
    \ point does the line that you’re not willing to cross become about survival—about\
    \ your very existence—and no longer about simply quantifying the cost?*\n\nMany\
    \ risk managers work with scenarios on issues related to survivability to try\
    \ to bind the realm of possibilities. Scenarios have limitations: they only address\
    \ *known unknown* risks (things that you can imagine), but consequently don’t\
    \ address what you do *not* know (the *unknown unknown* risks). A good risk manager\
    \ asks, “How do I turn as many unknown risks into known risks, which can then\
    \ be quantified?”\n\nFor example, consider again the scenario of a person walking\
    \ without shoes across a slippery, rain-drenched deck of a ship at sea. What if\
    \ the rain was from a hurricane, where in many cases the strength of the winds\
    \ or height of the incoming water (all velocity-related) are underestimated and\
    \ cause knock-on effects? Not only can you slip and fall overboard—what about\
    \ the scenario of the boat capsizing and the rescue party ashore not being able\
    \ to mobilize to save you?"
