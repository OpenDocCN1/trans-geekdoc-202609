    信不信由，真实发生的事件是几个已知案例，其中犯罪分子接管了超过百万台计算机。已知最大的僵尸网络是`Bredolab`，包含超过 3000 万台计算机。它由一个黑客网络创建，通过将被劫持计算机的时间租租给其他犯罪组织来获利。在巅峰时期，它每天能够发送超过
    30 亿封被感染的邮件²。


    现在考虑以下场景³


    ## 应用 CyRM℠](#R_sec10_8)


    基于此场景的事件，你会监控哪些内容，你会采取哪些潜在的管理行动举措？例如，作为第一步，监控这些攻击并了解你针对需要保护的更重要资产的脆弱性并并不困难。其次，也许可以聘请网络过滤服务，扫描表现出异常行为的网站，并阻止你的用户访问这些网站。或者，也许可以统一使用
    `Google Chrome` 或 `Mozilla Firefox` 以外的浏览器，这两种是流行的浏览器（因此大多数恶意软件都是针对它们编写的）。同样，从四个步骤来思考决策过程是非常重要的：评估状况、制定规则、做出决策以及事后重新评估。记住，犯下“积极性错误”（即你研究了问题，考虑了所有替代方案，但走错了路）远比“消极性错误”（即你甚至没有考虑过潜在的问题要好）。


    ## 注释](#R_sec10_9)


    # 结论](#R_chapter11)


    在如今太多的公司中，参与网络安全是事后考虑的，被拼凑在人们每天的工作之上，以期创造一个安全的环境。我们都知道这种方法行不可通的。网络安全并没有被视为一个业务问题，然后与业务需求对齐。此外，没有人在网络安全领域采取进攻策略——只有防守，而且公司正关注着他们无法控制的昨天的问题和威胁。我们都知道，真正的失败往往没有被用作学习经验，也没有获得足够的关注来产生改变。


    更进一步，董事会和 C 级高管错误地认为合规性会拯救他们，但实际上，合规并不等同于适当的保护水平。遗憾的是，对于“我的公司安全性足够吗？”这个问题并没有简单的答案。高管决策与网络安全领域的
    IT 专业人员之间也存在真正的脱节，这本应该让更多人彻夜难眠，因为每一个新的估算都增加了新威胁的水平。网络安全不仅仅是一个必须正确的重要问题——它是一个“必须做对”的问题。心态必须发生转变，从对打昨天的战争转变为识别并准备应对今天和明天的威胁。


    真的需要一支拥有各种角色和职位的“军队”才能提供适当的 CyRM℠。对于不同的人来说，有许多角色：董事会、C 级高管、`CISO`、IT 员工、风险管理人员、审计师以及公司的每位员工。这是一支由来自不同背景、财富和受教育经历的人组成的军队，但每个参与者都有一个共同目标，这就是它运作得如此良好的原因。


    我们在网络安全领域都缺少一个共同目标：对 CyRM℠ 的真正承诺。


