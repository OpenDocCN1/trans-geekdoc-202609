    # APPENDIX B: Practical Primer on Cybersecurity for Boards in the Age of Equifax,
    Uber, al.


    By Roel Campos and Martin


    | --- | --- |

    | **How Do Directors Cope with their Obligations?** | **A Primer for Boards**
    |


    ![](images/figi12_2_B.jpg)


    [www.hubbard.com](http://www.hubbard.com)


    New York, York


    [https://www.hubbard.com/legal-notices](https://www.hubbard.com/legal-notices)


    Hughes & Reed

    New York Partnership

    New York 2017


    Readers are advised that prior results. No aspect of this advertisement has been
    approved by the Supreme Court. For information regarding the selection process,
    please visit [https://www.hubbard.com/legal-notices](https://www.hubbard.com/legal-notices).


    ## Introduction


    On September 7, 2017, one of the nation’s largest credit monitoring agencies,
    Equifax Inc., announced that 143 million customers’ accounts had been breached
    in what may be the most significant cyberattack to impact U.S. consumers to date.


    Amidst the Equifax controversy, the U.S. Securities and Exchange Commission (“SEC”)
    made some striking disclosures of its own. The newly-arrived SEC Chair, Jay Clayton,
    announced on September 20, 2017 that the SEC’s own EDGAR filing system had been
    penetrated by cybercriminals months previously, leading to questions about the
    safety of systems and the risk of insider trading by individuals with advance
    knowledge of sensitive, nonpublic information.


    Other recent high-profile cyberattacks abound. Much to the chagrin of fans of
    the popular television show Game of Thrones, the HBO television network was breached
    in July 2017 by a group that pilfered over 1.5 terabytes of information, including
    show scripts and full episodes of several shows.


    In one of the more salacious stories, recent revelations from Uber Technologies,
    Inc. detail a 2016 breach of the ride-sharing company’s systems, during which
    hackers stole the names, email addresses, phone numbers, and drivers’ license
    numbers of millions of Uber’s customers and drivers. Not only did Uber fail to
    disclose the breach for over a year—but it also purportedly paid a “ransom” to
    the hackers in exchange for a promise by the hackers to delete the purloined data
    and keep the cyber incident quiet.


    Although cybersecurity is not a new challenge for boards of directors, the sheer
    scope and volume of recent events suggest that we may be experiencing a watershed
    moment when it comes to directors’ responsibility to oversee, and managers’ duty
    to implement, adequate cybersecurity systems at companies.


    ## The Responsibility of Directors


    Many directors understand they have a responsibility to oversee cybersecurity.
    But more puzzling is what they should be doing now. What are the right questions
    they should asking? Below we provide a short discussion of the major areas in
    cybersecurity compliance that you should be concerned with. We invite you to keep
    this article in your files and use the outline at the end of this article when
    discussing cybersecurity at board meetings.

