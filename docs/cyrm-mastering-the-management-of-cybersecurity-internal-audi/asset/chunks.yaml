  trans: '


    在评估现有网络安全风险时，董事会应特别关注其所在行业以及规模相近公司的最新趋势和近期事件。某些类型的网络攻击在某些行业中发生频率更高，而在另一些行业中则较少。例如，如果你是一家小型零售商，你最紧迫的网络安全关注可能是销售点入侵，即攻击者利用远程访问应用程序（通常由第三方供应商提供）的漏洞来窃取你客户的信用卡支付信息。


    董事还应该广泛地了解哪些个人或哪些团体最可能成为公司的目标，以及目的是什么。作为一个起点，威信公司发布的《2017 年数据泄露调查报告**（即`2017 Verizon
    Report`）显示，大多数网络安全泄露是由外部威胁者实施的（75%），而比例较小的一部分则是由内部人员（如员工或前员工）实施的（25%）。


    一旦董事会对公司现有的网络威胁概况有了良好的掌握，就应该优先考虑降低实际网络泄露风险的策略。一位有效的董事会帮助公司确定哪些资产最有价值，并评估用于保护这些资产的关键控制措施。


    他或她还将为应急情况制定计划，并确保建立适当的响应框架来处理潜在的网络事件。这一过程不可避免地涉及审查公司与网络安全相关的预算，以根据现有威胁和公司现有系统的稳健性来确定预算是否合理。（请记住，预防问题的成本远比修复问题的成本低。）


    一个关键的结论是，网络安全中没有进攻策略——只有防御策略。此外，你无法保护一切。即使是网络领域技术上最先进的机构——国家安全局（`NSA`）也无法保护其最深处的秘密。


    ## 2. 评估企业文化并树立正确的榜样


    真正“理解”网络安全的公司具有适应性文化。然而，大多数企业文化并不会迅速变化——它们是以缓慢的速度演进的。因此，许多组织的安全文化未能跟上其运营环境中的威胁格局。


    安全需要被框架化为关键的推动因素，帮助公司履行其对客户的承诺。它还需要被公司所有层级的员工视为一项基于`团队合作，而非监控`的共同努力。


    此外，还要考虑公司的“高层基调”以及发送给员工的有关网络安全实践的信息。鼓励高级管理层营造一个每个人对网络安全负有共同责任的环境。理想情况下，员工应该与公司首席信息安全官（`CISO’s`）部门的人员建立直接联系，并理解他们可以向该人员寻求判断和无障碍的指导。


    公司管理层投入网络安全相关的高质量员工培训也至关重要。现在，员工接受通用的安全意识培训被认为是一种最佳实践，这种培训可能很大程度上或专门关注网络安全。


    此外，培训不应该是一个“一次性”的活动。`CISO`部门或总法务（`GC`）应定期通过电子邮件向员工提供有关网络安全最新进展以及他们应该注意的问题。这种持续的强化培养了真正的网络“健康”文化。


    评估公司网络安全文化的一个良好起点，是审查公司关于使用和保护公司系统的书面及正式指导。例如，公司是否有一项关于员工使用个人邮箱处理公司业务的书面政策？该政策是如何实施和遵守的？董事会是否遵循相同的标准，还是存在例外？理想情况下，董事将能够以身作则。请理解，作为一名董事，你可能是网络泄露的极有吸引力的目标，因为众所周知，董事成员通常使用个人设备下载董事会书籍并就敏感的非公开公司信息进行通信。


    总之，网络健康文化需要成为战略焦点，嵌入到公司的日常运营和核心价值观中。新的范式应该是：网络安全是一项持续的风险，需要组织中的每个人来管理。当员工（你的公司或其他公司的员工）在这方面出现失误时，应将这些经历作为不要重复的教科书式教训。由于泄露通常会导致诉讼，董事会应将律师纳入讨论，并确保其改变文化的努力具有法律视角。在确保高层基调保持诚信和有效合规后，董事会应转向战略考量。


    ## 3. 关键网络安全人员


    董事会应参与关键人员的选择，例如`CISO`。他们还应确保建立了适当系统来监控这些人员的表现。在过去，公司经常将网络安全责任委托给首席运营官或首席技术官。考虑目前公司负责网络安全的主要负责人。该人员是高管级别吗？网络安全是否是他们正在应对的许多紧迫需求之一？如果第一个问题的答案是“否”，第二个问题的答案是“是”，你可能考虑创建一个`CISO`的新职位。


    董事会还应考虑 `CISO`（或其他主要负责网络安全的官员）的内部汇报结构，以确保该人员拥有在该关键岗位取得成功所需的独立性和权威。`CISO`可以向公司的首席信息官、首席运营官、首席技术官甚至首席执行官汇报——但在任何情况下，`CISO`都应根据需要接触高级管理层和董事会。公司管理层还应考虑建立由公司
    `CISO` 主席的信息安全委员会，并邀请高管参加委员会会议。董事们则应了解谁担任 `CISO` 职位，并在适当的情况下与该个人进行直接交流。


    ## 4. 评估风险管理策略


    从董事会的角度来看，有效监督的关键是让高级管理层负责制定并监控与网络安全相关的战略和风险承受能力。在大多数情况下，董事成员应该关注公司的网络安全计划，但不应插手参与。


