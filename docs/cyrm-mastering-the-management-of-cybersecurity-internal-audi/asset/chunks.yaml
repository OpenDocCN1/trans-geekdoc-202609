    When I worked at Citicorp, we monitored the local movement of high-net-worth individuals’
    capital. Local capital flowing out of an emerging markets country signaled the
    beginning of problems—best understood, after all, by those in the country—and
    foretold the eventual devaluation of the country’s currency. If we’d waited until
    local governments acted themselves, instead of monitoring capital flows ourselves,
    it would already have been too late to react. Not doing anything now about the
    future often incurs the highest risk. Trip wires allow you to move proactively
    before events begin to move you.


    # Making Better Decisions Regarding Risk


    Whenever I hear someone say they see “a light at the end of the tunnel,” my first
    thought is that it might be the headlight of an oncoming train. Perhaps a mine
    shaft is a more appropriate metaphor than a tunnel: we’re moving forward in the
    dark, looking for gold. We can’t make decisions about the future based solely
    on what we see, or what we think we know. In reality, our decisions are always
    based on incomplete information—it’s just the best information we have on hand
    at the time. As a result, we must learn to manage the risks associated with a
    decision-making process that’s imperfect. We can think of the decision-making
    process in terms of four steps: assessment of the situation; rules of the game;
    making the decision; and reevaluating after the fact.


    # Assessment


    It’s important to know where you are. A clear-eyed, thorough assessment of your
    current position is necessary before you can set goals and manage risks. However,
    the limits of our senses themselves keep us from being aware of much that goes
    on around us, and this, more often than not, is a good thing. Imagine, for example,
    if we were able to hear the sounds of the cells in our bodies, endlessly dividing
    themselves—the roar would deafen us. In fact, it seems as if the ability to think
    clearly is dependent on a certain level of sensory deprivation. For this reason,
    most of us avoid noise as we work. In a broader sense, our first sensations at
    the beginning of every day are our immediate surroundings. Though the process
    may occur subconsciously, our eyes first take in the familiar sights of our bedrooms,
    establishing our location. This, it seems, is our mind’s way of telling us that
    in order to know what we’re doing, and where we might go, we first have to know
    where we are. At first, this may appear to be a contradiction—that is, the notion
    that one can focus both on short-term events and long-term plans—but our lives
    are full of inconsistencies. The trick lies in knowing how to change your field
    of vision when the time is right, first studying the details, then stepping back
    to look at the big picture. Without the details, after all, the big picture doesn’t
    exist at all.


