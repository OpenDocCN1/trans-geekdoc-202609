  raw: "The third lesson is that boards of directors must have a public response plan\
    \ in place should a catastrophic cyberattack occur on their watch. Equifax’s public\
    \ handling of the incident has been widely criticized from virtually all angles.\
    \ Many, for example, have complained that it took the company a full month to\
    \ disclose the incident publicly after the company first learned of the breach\
    \ in late July 2017. Others have ridiculed Equifax for directing consumers in\
    \ the immediate aftermath of the breach to an insecure “spoofed” website mimicking\
    \ the one Equifax had set up to engage with customers anxious to learn if their\
    \ personal information had been compromised. Still others lamented that the company\
    \ appeared to be in “PR mode” following the breach, making missteps such as offering\
    \ credit monitoring services to affected individuals for a fee, rather than free\
    \ of charge. Later, Equifax moved to offer victims free access to credit monitoring\
    \ services, but it forced those customers to agree to lengthy arbitration provisions\
    \ that would limit the customers’ ability to sue the company in connection with\
    \ the services. Equifax later abandoned the arbitration clause after a public\
    \ outcry.\n\nAll of these events suggest that Equifax was ill-prepared to deal\
    \ with the public fallout that would predictably ensue following a disclosure\
    \ of this magnitude. A good CyRM℠ plan is prepared for any eventuality.\n\n The\
    \ fourth lesson for board members is that companies should carefully consider\
    \ when and how they’ll disclose a breach. The disclosures of cyber incidents at\
    \ Equifax and Uber provide valuable guidance to boards of directors in this regard.\
    \ A company must consider not only its legal disclosure obligations, but also\
    \ the court of public opinion when assessing when, and what, to disclose. In a\
    \ similar vein, some have pointed out that the SEC’s public disclosure of a cyber\
    \ incident involving its EDGAR database came months after internal reports of\
    \ the event were raised, illuminating just how difficult it is for any actor—including\
    \ those charged with overseeing disclosure-based conduct—to balance the competing\
    \ needs for a speedy public disclosure and a thorough internal review. The SEC’s\
    \ own less-than-ideal response to a cyber breach (and a resulting delayed cyber\
    \ disclosure) raises questions about how the agency will pursue companies for\
    \ cyber-related disclosures in the future and balance the competing needs for\
    \ prompt disclosures on one hand, and rigorous internal reviews on the other.\n\
    \nA final lesson is that companies should be aware of the risks posed when third\
    \ parties handle sensitive company data. The events at Deloitte provide yet another\
    \ data point and reinforce the notion that companies must be concerned not only\
    \ with their own cybersecurity systems, but also those of third-party vendors\
    \ and consultants (and even, perhaps, the government) when those entities handle\
    \ sensitive company data.\n\nLearning the lessons I list above is only half the\
    \ battle. Once senior executives and board members understand these lessons, it’s\
    \ essential to implement an effective and dynamic cybersecurity program at their\
    \ company. The following considerations will also help a director test the current\
    \ status and effectiveness of the cybersecurity program.\n\nAs a first principle,\
    \ directors should understand their fiduciary duties when it comes to cybersecurity\
    \ and the overarching legal terrain guiding their companies. In addition to business\
    \ and reputational risks, a lapse in cybersecurity can result in significant legal\
    \ consequences for a company, its management, and, in certain cases, its board\
    \ of directors. Companies must be aware of and understand various federal and\
    \ state statutes, some of which regulate specific industries or types of sensitive\
    \ information. Companies must also be aware that federal and state regulators,\
    \ such as the SEC, DOJ, and FTC, may  increasingly focus on cybersecurity when\
    \ enforcing otherwise non-cyber-specific laws, such as federal consumer protection\
    \ and securities laws. In addition, directors must also heed the risk of shareholder\
    \ and consumer lawsuits, which are commonly initiated in the wake of the disclosure\
    \ of cybersecurity incidents. As discussed below, the company’s general counsel\
    \ and internal cyber personnel should schedule regular briefings for the board\
    \ to assess these developments.\n\nCybersecurity is a “first order” risk in many\
    \ industries. If they haven’t already done so, boards of directors should invest\
    \ in a formal briefing to discuss the range of existing cybersecurity risks facing\
    \ their companies and weigh the pros and cons of various mechanisms that may help\
    \ protect the company’s most valuable assets in light of those risks.\n\nThe board\
    \ should first identify the company’s most valuable assets and evaluate how those\
    \ assets might be compromised by a cyber incident. For some companies, their most\
    \ valuable asset is customers’ private financial information, personally identifiable\
    \ information, or possibly health records. For others, it might be intellectual\
    \ property, or perhaps a proprietary database, or even a cache of sensitive emails.\
    \ Any cybersecurity program must be geared toward protecting these most important\
    \ corporate assets.\n\nDirectors should have a baseline understanding of the various\
    \ types of cyber breaches that may occur on company systems and be familiar with\
    \ the technical terms frequently used in the industry. Common cyber incidents\
    \ at companies may range from malware to phishing attacks, and from unpatched\
    \ software vulnerabilities to advanced persistent threats (“APTs”). Additionally,\
    \ vulnerabilities in a company’s physical security may allow actors to penetrate\
    \ the company’s cyber defenses.\n\nWhile it isn’t necessarily incumbent on the\
    \ board to study the technical mechanisms of a cyberattack or response thereto,\
    \ the board should have enough familiarity with these concepts to enable productive\
    \ discussions with management and effective oversight of the company’s cybersecurity\
    \ program. In taking stock of existing cybersecurity risks, boards should pay\
    \ close attention to trends and recent events in their particular industry and\
    \ those impacting companies of a similar size. Particular types of cyberattacks\
    \ appear more frequently in some industries and less in others. If you’re a small\
    \  retailer, for example, your most pressing cybersecurity concern may be point-of-sale\
    \ intrusions, where attackers exploit weaknesses in remote-access applications\
    \ (often provided by third-party vendors) in order to siphon your customers’ credit\
    \ card payment information. On the other hand, if you’re a large financial institution\
    \ with sprawling and accessible physical infrastructure (e.g., ATM machines),\
    \ then you may face a broader range of cyber vulnerabilities, including the risk\
    \ of “skimming” attacks on individual nodes in the network.\n\nDirectors should\
    \ also have a broad understanding of who or which groups are most likely to target\
    \ their companies, and for what purpose. As a starting point, the “2017 Data Breach\
    \ Investigations Report” by Verizon suggests that the majority of cyber breaches\
    \ are perpetrated by external threat actors (75 percent), while a smaller percentage\
    \ are perpetrated by insiders, such as employees or former employees (25 percent).\
    \ A growing number of breaches can be traced to state-affiliated actors (18 percent),\
    \ while a smaller percentage involves business partners (2 percent).\n\nOnce the\
    \ board has a good handle on the company’s existing cyberthreat profile, it should\
    \ prioritize strategies to mitigate the risk of an actual cyber breach. An effective\
    \ director will help the company determine which assets are most valuable and\
    \ evaluate the key controls in place to protect them."
