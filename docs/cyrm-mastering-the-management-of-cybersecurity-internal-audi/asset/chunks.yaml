    # 附录 B：Equifax、Uber 等时代的董事网络安全实用指南


    作者：Roel Campos 和 Martin


    | --- | --- |

    | **董事如何履行其职责？** | **董事会指南** |


    ![](img/figi12_2_B.jpg)


    [www.hubbard.com](http://www.hubbard.com)


