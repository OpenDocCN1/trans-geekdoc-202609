    \ 索引\n\n# 引言\n\n![](img/9780367565312.jpg)\n\n![](img/9780367565312.jpg)\n\n在\
    \ 20 世纪 90 年代，通用电气首席执行官杰克·韦尔（Jack Welch）曾对领导者说：“如果你不困惑，你就完了。”我一直很喜欢这个告诫，因为认为自己掌握了一切会导致傲慢和自满；而困惑能让你谦虚。而谦虚意味着你具有可学习性——意识到自己有很多不知道的事情（甚至比知道的更多）——这会促使你寻求新信息并保持警惕。\n\
    \n当时，我是花旗银行（Citicorp）的企业风险经理，我明白金融机构是经营环境的镜像。如果我们经营业务的环境良好，我们的客户就良好，我们也良好。因此在那时，我的方法是彻底理解我们运营的环境，并密切关注拐点——即领先指标。例如，当我们的新兴市场业务客户开始将其私人财富转移到海外时，我将其视为当地经济正走向错误方向的领先指标。\n\
    \n那时，技术创新的速度是一个领先指标，所以我聘请了麻理工学院教授下村通（Tsutomu Shimomura）对银行进行“道德黑客攻击”。几天后他来告诉我：“你们是一个太容易攻击的目标了。只需要轰击你们的叫中心，客户就无法打进来，你们很快就会倒闭。”\n\
    \n回到现在：网络攻击后的公众监督（有时甚至是愤怒）以及监管机构的行动，已使网络安全成为关键领导责任。当问题出现时，无论大小，快速识别并解决问题的能力将决定公司的最终恢复情况。另一起重大网络安全漏洞很快就会出现在新闻中。唯一的问题是该漏洞有多严重、多昂贵，以及损害程度是否会公开。\n\
    \n是什么导致了网络犯罪的增加？三个广泛的新安全挑战已经出现。\n\n"
