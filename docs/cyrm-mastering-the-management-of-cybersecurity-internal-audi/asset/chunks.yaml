    # 第一条教训是公司必须关注有关公司系统及公司使用的软件中网络漏洞的例行警报。在 Equifax 的案例中，黑客显然利用了 `Apache Struts`
    Web 应用程序软件中的一个已知网络漏洞，Equifax 使用该软件来构建其 Web 应用程序。美国国土安全部美国计算机应急响应小组（`US-CERT`）于
    2017 年 3 月 8 日通知了 Equifax 等许多机构该漏洞，并要求对软件进行补丁。尽管该公司通过电子邮件在内部传发了 `US-CERT` 通知，并要求相关人员安装补丁，但补丁显然没有安装，或安装不正确，一周后对系统的后续扫描未能发现该错误。


    # 第二条教训是公司必须确保他们有适当的系统来升级潜在网络事件的信息，并确保例如总律师在关键窗口期内禁止对重大违规事件有内部消息的人员进行公司证券交易。在
    Equifax 的案例中，披露有几位高管在泄露事件内部报告之后、公众获知事件之前交易了公司股票。这引发了对可能存在内部交易以及内部控制缺乏的，而当时 Equifax
    已经因为泄露事件本身面临严厉的公众审查。（这些高管随后由 Equifax 一个负责分析泄露的特别委员会无清了嫌疑。）⁹


    # 第三条教训是，如果在其范围内发生了灾难性的网络攻击，董事会必须有一份公开响应计划。Equifax 对事件的公开处理受到了来自几乎所有角度的广泛批评。例如，许多人抱怨该公司在
    2017 年 7 月下旬首次获知泄露后，花费了整整一个月才公开披露了该事件。还有人嘲笑 Equifax，在泄露发生后立即将消费者引向一个不安全的“钓鱼”网站，该网站模仿了
    Equifax 建立的用于与急于了解个人信息是否泄露的客户交流的网站。也有人感叹公司在泄露后似乎处于“公关模式”，并犯了错误，例如向受影响的个人收取费用提供信用监控服务，而不是免费提供。（该公司随后改为向受害者提供免费的信用监控服务，但强迫这些客户同意冗长的仲裁条款，这将限制客户就相关服务问题起诉
    Equifax 的能力。在遭到公众抗议后，Equifax 随后放弃了仲裁条款。）¹⁰


    # 第四条教训是公司应该仔细考虑何时以及如何披露泄露。Equifax 和 Uber 近期披露的网络事件为董事会会在这方面工作提供了宝贵的指导。公司在评估何时披露以及什么内容时，不仅要考虑其法律披露义务，还要考虑公众舆论。类似地，一些人指出，`SEC`
    对涉及其 `EDGAR` 数据库的网络事件的公开披露，是在内部对该事件提出报告的几个月后才进行的，这说明了对于任何执行者——包括那些被指负责基于披露的行为的人员——要平衡快速公开披露和彻底内部审查之间的竞争性需求是多么困难。`SEC`
    自身对网络漏洞的并不理想的应对（以及随导致的网络披露延迟）引发了人们对该机构未来将如何追究公司网络相关披露，以及如何在一方面的及时披露和另一方面的严谨内部审查之间平衡竞争性需求的疑问。


    # 最后一条教训是，公司应该意识到第三方处理公司敏感数据时所带来的风险。德勤的事件提供了另一个数据点，并强化了这样一种观点：当这些实体处理公司敏感数据时，公司不仅必须关注自身的网络安全系统，还要关注第三方供应商和顾问（甚至可能是政府）的系统。


    鉴于近期这些高关注度的事件，我们在下方讨论了一系列实用的考虑因素和原则，董事成员可以使用这些原则来帮助其公司建立一个有效且动态的网络安全计划。这些考虑因素也将帮助董事测试当前网络安全计划的现状和有效性。


    ## 董事的实际考虑因素


    作为首要原则，董事应该理解他们在网络安全方面的信托责任，以及指导其公司的首要法律环境。除了业务和声誉风险外，网络安全的疏忽可能会给公司、其管理层，在某些情况下给其董事会带来重大的法律后果。公司必须意识到并理解各种联邦和州法律，其中某些法律监管了特定行业或类型的敏感信息。


    公司还必须意识到，联邦和州监管机构（如 `SEC`、`DOJ` 和 `FTC`）在执行其他非网络特有的法律（如联邦消费者保护法和证券法）时，可能会日益关注网络安全。此外，董事还必须注意股东和消费者诉讼的风险，这些诉讼通常在网络安全事件披露后引发。下文所述，公司总律师和内部网络人员应为董事会安排定期简报，以评估这些进展。


    ### 1. 审查现有网络安全风险并确定优先级


    网络安全是许多行业中的“首要”风险。如果董事会尚未这样做，他们应该投资进行一次正式简报，讨论其公司面临的一系列现有网络安全风险，并根据这些风险权衡各种有助于保护公司最有价值资产机制的优缺点。董事会应首先识别公司最有价值的资产，并评估这些资产可能如何被网络事件破坏。对于某些公司来说，最有价值的资产是客户的私人财务信息、个人身份信息或可能的健康记录。对于其他公司来说，可能是知识产权，或者可能是专利数据库，甚至是一组敏感邮件。任何网络安全计划都必须以保护这些最重要的资产为目标。


    董事应该对公司系统可能发生的各种类型的网络泄露有基本的了解，并熟悉行业内经常使用的技术术语。公司常见的网络事件可能从恶意软件到钓鱼攻击，从未修补的软件漏洞到高级持续性威胁
    (`APT`)）。此外，公司物理安全方面的漏洞可能允许攻击者渗透公司的网络防御。


    虽然董事会并不一定需要研究网络攻击或其应对的技术机制，但董事会应对这些概念有足够的熟悉，以便与管理层进行建设性的讨论，并对公司的网络安全计划进行有效的监督。


