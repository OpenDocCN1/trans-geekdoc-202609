- fmt: '

    He or she will also plan for contingencies and ensure there’s an appropriate response
    framework in place to deal with potential cyber incidents. Part of this exercise
    will inevitably entail reviewing the company’s budget related to cybersecurity
    to determine whether it’s appropriate in light of existing threats and the robustness
    of existing company systems. (Keep in mind that it’s less expensive to prevent
    a problem than it is to fix it.)


    ## Cybersecurity Strategy and Culture


    One key takeaway is that there are no offensive strategies in cybersecurity—only
    defensive strategies. In addition, you can’t protect everything. Even the most
    technologically advanced organization in cyber—the National Security Agency (NSA)—could’t
    protect its deepest secrets. It’s therefore critical for the company to (1) reflect
    on which company assets are most valuable; (2) determine which systems are most
    vulnerable; and (3) consider what available mechanisms and strategies are both
    business-critical and cost-effective in view of this calculus.


    Firms that really “get it” when it comes to great CyRM℠ plans have adaptive cultures.
    However, most corporate cultures don’t change quickly—they evolve at a slow pace.
    As a result, the security culture in many organizations hasn’t kept pace with
    the threat landscape in which they operate.


    Security needs to be framed as a critical enabler that helps the company deliver
    its promise to customers. It also needs to be viewed by all levels of the company’s
    workforce as a shared endeavor based on `teamwork`, not `surveillance`.


    Also consider the “tone at the top” of your company and the messages that are
    being sent to employees related to cybersecurity practices. Encourage senior management
    to cultivate an environment where everyone has shared responsibility for cybersecurity.
    Ideally, employees should have a direct line of communication with someone in
    the company’s chief information security officer’s (`CISO’s) department and understand
    they can reach out to that person for judgment and hassle-free guidance.


    It’s also crucial that company management invests in quality employee training
    related to cybersecurity. It’s now considered a best practice that employees receive
    a general security awareness training, which may focus largely or exclusively
    on cybersecurity. Also, training should not be a “one-and-done” exercise. The
    `CISO`’s department or the `GC` should regularly provide updates to employees
    via email on recent developments in cybersecurity and other issues they should
    be aware of. This is the kind of constant reinforcement that cultivates a true
    culture of CyberWellness^(sm).


    ## Evaluating Cybersecurity Culture


    A good place to start in evaluating a company’s cybersecurity culture is to review
    the company’s written and formal guidance on the use and protection of company
    systems. For example, does the company have a written policy regarding employees’
    use of personal email to conduct company business? How is that policy implemented
    and observed? Does the board abide by the same standard, or are exceptions made?
    Ideally, directors will be able to lead by example. Understand that as a director,
    you may be a particularly attractive target for a cyber breach, as it’s known
    that directors often use personal devices to download board books and communicate
    about sensitive, nonpublic company information.


    In all, an excellent CyRM℠ program needs to become a strategic focus embedded
    in the day-to-day operations and core values of the company. The new paradigm
    should be that cybersecurity is an ongoing risk that needs to be managed by everyone
    in the organization.


    When employees (of your company or of other companies) make missteps on this front,
    use these experiences as textbook examples of what not to repeat—anywhere in the
    firm. Because breaches often result in legal action, the board should include
    lawyers in their discussions and make sure their efforts to change corporate culture
    are seasoned with a legal perspective. After assuring that the tone at the top
    is one of integrity and effective compliance, the board should turn to strategic
    considerations.


    ## Board Oversight and Governance


    The board should participate in selecting key personnel, such as the `CISO`. They
    should also ensure that adequate systems are in place to monitor those individuals’
    performances. In times past, companies often delegated responsibility for cybersecurity
    to the company’s chief operations officer or chief technology officer. Consider
    the officer who currently has primary responsibility for cybersecurity at your
    company. Is that person C-suite level? Is cybersecurity only one of many, pressing
    demands that person is currently juggling? If the answer to the first question
    is “no,” and the second “yes,” you may want to consider creating a new role in
    the form of a `CISO`.


    The board should also consider the internal reporting structure for the `CISO`
    (or other officer with primary responsibility for cybersecurity) to ensure this
    individual has the independence and authority needed to succeed in this mission-critical
    role. The `CISO` may report to the company’s chief information officer, chief
    risk officer, chief operations officer, chief technology officer, or even the
    chief executive officer—but in any case, the `CISO` should have access to senior
    management and the board as needed. Company management should also consider establishing
    an information security committee chaired by the company’s `CISO`, and invite
    C-suite officers to attend the committee’s meetings. Directors, for their part,
    should understand who fills the `CISO` role and engage directly with that individual
    as appropriate.


    From the board’s perspective, the key to effective oversight is to hold senior
    management responsible for articulating and monitoring the company’s strategy
    and risk tolerance related to cybersecurity. In most cases, board members should
    have their noses, but not their fingers, in the company’s cybersecurity program.


    One area where boards can, and should, play a crucial role is in developing the
    company’s strategic plan related to cybersecurity. Following this initial effort,
    the board should oversee company management in implementing the strategic plan.


    ## Incident Response and Frameworks


    The board should also work with management to develop a cyber incident “response
    playbook” mapping out how the company would respond to various contingencies in
    the event of a breach or serious cyber incident impacting company systems. For
    example, in the wake of the Uber scandal, a company may want to consider how it
    would approach a ransom request, weighing the pros of potentially mitigating some
    of the damage associated with a breach against the cons of rewarding criminal
    behavior in this manner. Any such analysis should be flexible enough to take into
    account of-the-moment law enforcement recommendations and a legal analysis of
    the company’s disclosure obligations. To avoid an Equifax problem, the public
    response plan should designate an internal and external team of professionals
    to investigate the causes and make appropriate disclosures.


    There are various frameworks that company management can use to develop appropriate
    risk management strategies related to cybersecurity. For example, in October 2013,
    the US Department of Commerce’s National Institute of Standards and Technology
    (`NIST`) issued for comment a set of voluntary standards and best practices for
    reducing cybersecurity risk. The final version was released in February 2014,
    titled “Framework for Improving Critical Infrastructure Cybersecurity.”


    The `NIST` framework includes five “functional areas,” which directors may consider
    in developing an overarching cybersecurity plan for their companies. These functions
    include:


    - **Identify**: Develop the organizational understanding to manage cybersecurity
    risk to systems, assets, data, and capabilities.

    - **Protect**: Develop and implement the appropriate safeguards to ensure delivery
    of critical infrastructure services.

    - **Detect**: Develop and implement the appropriate activities to identify the
    occurrence of a cybersecurity event.

