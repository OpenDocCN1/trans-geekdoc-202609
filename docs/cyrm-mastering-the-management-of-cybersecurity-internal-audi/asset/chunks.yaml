  trans: '


    2018 年 3 月，亚特兰大市遭受了名为`SamSam`的勒索软件攻击。这次攻击摧毁了市政府的计算机系统，扰乱了许多城市服务，包括警察记录、法院、公用事业和停车服务。计算机系统关闭了`五天`，迫使许多部门不得不手工完成必要的文书工作。五天！想象一下如果你的系统宕机五小时，你会有多崩溃。尽管服务缓慢地恢复上线，但完全恢复花费了数月时间。


    攻击者仅索要了 52,000 美元赎金，但事后统计显示，预计这次攻击的全面影响成本超过了 1,700 万美元。仅聘请应急 IT 顾问和危机管理公司的合同上就花费了近
    300 万美元。


    亚特兰大市勒索软件攻击是一个关于业务连续性规划不足的教训。这一事件表明，该市的 IT 部门对攻击的准备极其糟糕。就在两个月前，一次审计还发现该市 IT 系统中存在
    1,500 到 2,000 个漏洞，而这些漏洞因“过时的软件和由临时或未记录流程驱动的 IT 文化”而进一步恶化。


    这就是糟糕的`CyRM℠`导致糟糕业务的例子。现在让我们来看一个互联通性的正面案例。研究显示，40%到 60%的小型企业在灾害后从未重新开大门。2017 年
    8 月，哈维飓风袭击了德克萨斯州南部，破坏了该地区的房屋和企业。在四天时间里，某些地区的降雨量超过 40 英寸。当风暴过去时，它造成的损失已超过 1,250
    亿美元。


    Gaille Media 是一家家小型网络营销机构，它拒绝成为另一家被灾害关闭的小公司。尽管办公室位于办公楼的二层，但当休斯顿湖溢出时，Gaille 的办公室被淹没了。洪水严重到在三个月内没有人能进入大楼。公司从未回到大楼，但其运营几乎没有受到影响。这是因为
    Gaille 将大部分数据存储在云端，这允许员工在风暴期间及之后进行远程工作。即使办公室被毁，他们也从未失去对关键文件和记录的访问。事实上，在决定搬迁何时，老板最终决定保持公司去中心化，允许员工继续远程工作。如果公司将所有数据都存储在办公室，业务可能永远无法恢复。COVID-19
    大流行证明了`虚拟世界已经降临，而最终的赢家将是那些实现这一点的公司。`


    涉及到企业危机时，人们唯一记得的是结果。良好的结果源于一个经过良好、有纪律的过程，这种过程展示了集体智慧和对纠正结果的承诺。


    有效的`CyberWellness℠`和安全计划的特定需求包括：周密的规划、明智授权以及一个监控合规性的系统——这些都应该由董事会进行监督。从长期来看，董事会需要理解并考虑网络安全的战略业务影响，培养有关安全的正确企业文化，并鼓励将`CyRM℠`实践整合到所有的治理和审批过程中。底线是：一个明智的董事会理解网络安全是一个管理问题——而不仅仅是一个技术问题。


    拥有有效的企业网络安全策略如此重要，以至于`SEC`很快将强制要求执行。《网络安全披露法案》正在参议院审议，这是一项简单的法案，但将产生深远的影响。其意图是确保公司公开他们为保护自己和客户免受网络攻击而所采取的步骤。


    作为向`SEC`提交年度报告的一部分，上市公司必须披露董事会成员“是否在网络安全方面拥有知识或经验”。如果没有，他们将能够引用公司采取了“哪些其他网络安全措施”。要求董事会具备信息安全方面的专业知识在美国企业界将是一个新奇，除了那些已经从事信息安全业务的公司之外。


    更具重要意义的是，《网络安全披露法案》将要求董事会承担保护其公司和投资者免受数据泄露、黑客攻击和其他网络威胁的责任。这项立法将网络安全提升至上市公司必须披露的其他风险因素清单中，例如诉讼、高负债水平或劳工问题。


    简而言之，在当今技术驱动的世界中竞争并获胜，公司需要做好网络安全工作。


    # 10 如何思考未来


    许多年前，我曾为花旗银行（Citicorp）制定一项战略计划，期间我我有幸与彼得·德鲁克（Peter Drucker）共度了一天。我问德鲁克如何预测未来，他回答说：“预测未来的最好方法就是创造它。”


    情景构建和分析是预测未来的完美工具。情景是关于未来的“如果……”的故事，允许我们考虑可能发生的任何事情（无论是积极还是消面的），并帮助我们规划各种应对措施。它们还涉及边界的建立以及决定留在边界之内。这可能会让你想起上一章中的一些风险管理概念。


    当我们构建情景时，我们首先列出可能的可能的驱动因素，然后将它们分为两个大领域：我们认为已知的事情和不确定因素。前者通常是能够从过去推断出的趋势。例如，我们可以对人口统计的长期变化做出相当合理的假设。不确定因素包括利率、政治权力的更迭以及尚未预见的创新。良好的情景规划需要对已知和未知驱动因素进行仔细融合。一旦情景的大致参数确定下来，就开始寻找转折点——或称“触发线”——通过监控这些触发线来判断当天的事件是否会引发导致情景实现的连锁反应。


    一个关于第三次世界大战的情景可能如述所示：


    2021 年，在华美之间因疫情传播导致紧张局势升级一年后，中国镇压了香港。美国对所有中国出口产品实施了严厉的制裁，导致中国经济出现负增长。针对政府的社会动荡蔓延到中国大陆。国际机构无法将中美带到谈判桌。中国试图夺取南海中一些长期存在争议的岛屿。一场酝酿中的危机在几次事件后稳步升级，但转折点是台湾，它宣布从中国独立。中国随后入侵台湾，并对一艘援助台湾的美国航空航母发射了弹道导弹齐射。一艘主要战舰及其船员的损失激怒了美国采取行动。美国对台湾的中国陆军进行攻击，并阻止了这些部队的增援和补给，最终迫其投降。随着局势升级，美国同时攻击了中国的空空部队以及作为储备的舰只和飞机。也许你还构建了一个日本和朝鲜爆发冲突的情景。


    即使情景并不一定具有预测性，它们也可以在事件改变它们之前，挑战我们对世界的现有观点。通过这种方式，它们为我们提供了触发线，当我们偶然遇到这些线时，就像减速带让我们意识到速度一样，它们引导我们考虑如何受到未来事件的影响。


