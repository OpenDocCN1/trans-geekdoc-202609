    他或她还将为突发情况制定计划，并确保建立起适当的响应框架以应对潜在的网络事件。这项练习的一部分不可避免地将涉及审查公司网络网络安全的预算，以根据现有威胁和公司现有系统的稳健性来判断其是否合理。（请记住，预防问题比修复问题要廉价得多。）


    ## 网络安全战略与文化


    一个关键的结论是，在网络安全中没有进攻策略——只有防御策略。此外，你无法保护一切。即便是世界上网络安全领域技术最先进的机构——国家安全局（NSA），也无法保护其最深秘密。因此，对于公司而言，至关重要的是：(1)
    反思哪些公司资产最有价值；(2) 确定哪些系统最脆弱；(3) 根据这种权衡，考虑哪些可用的机制和策略对业务至关重要且具有成本效益。


    在制定优秀的 CyRM℠ 计划方面真正“懂行”的公司具有适应性文化。然而，大多数企业文化并不会改变得很快——它们的演变速度很缓慢。结果，许多组织的安全文化未能跟上其所处威胁格局。


    安全需要被界定为一种关键的推动因素，帮助公司履行对客户的承诺。它还需要被公司所有层级的员工视为一项基于`teamwork`（合作）而非`surveillance`（监控）的共同努力。


    还要考虑公司的“高层调”（tone at the top）以及发送给员工的有关网络安全实践的信息。鼓励高层营造一种每个人对网络安全负有共同责任的环境。理想情况下，员工应该与公司首席信息安全官（`CISOs`）部门的人员建立直接沟通渠道，并理解他们可以寻求该人员的判断和无忧指导。


    公司管理层投资与网络安全相关的高质量员工培训也至关重要。现在，员工接受通用安全意识培训被认为是一种最佳实践，这些培训可能很大程度上或完全侧重于网络安全。此外，培训不应该是“一劳永逸”的活动。`CISO`
    部门或 `GC`（总法律）应定期通过电子邮件向员工提供有关网络安全进展和其他他们应该注意的问题的更新。这种持续的强化培养了真正的 CyberWellness^(sm)
    文化。


    ## 评估网络安全文化


    评估公司网络安全文化的一个良好起点是审查公司关于使用和保护公司系统的书面及正式指南。例如，公司是否有关于员工使用个人邮箱处理公司业务的书面政策？该政策是如何实施和遵守的？董事会是否遵守相同的标准，还是会有破例？理想情况下，董事应该能够以身作则。要理解，作为董事，你可能是网络攻击的特别有吸引力的目标，因为众周知董事成员经常使用个人设备下载董事书籍并就敏感的非公开公司信息进行交流。


    总而言之，一个优秀的 CyRM℠ 计划需要成为嵌入到公司日常运营和核心价值观中的战略重点。新的范式应该是：网络安全是一项持续的风险，需要组织中的每个人来管理。


    当员工（来自贵公司或其他公司的员工）在这方面出现失误时，请将这些经历作为教科书式的反面教材，避免在公司任何地方重复这些错误。由于泄露往往会导致法律诉讼，董事会应该在讨论中加入律师，并确保他们改变企业文化的努力具有法律视角。在确保高层调性是诚信和有效合规后，董事会应转向战略考量。


    ## 董事会监督与治理


    董事会应参与关键人员的选拔，例如 `CISO`。他们还应确保建立适当的系统来监控这些人员的绩效。在过去，公司经常将网络安全的责任委托给公司的首席运营官或首席技术官。考虑目前在贵公司承担网络安全主要责任的官员。那个人是
    C 级水平吗？网络安全只是该人员目前处理的许多紧迫需求之一吗？如果第一个问题的答案是“否”，而第二个问题的答案是“是”，你可能希望考虑以 `CISO` 的形式创建一个新职位。


    董事会还应考虑 `CISO`（或其他主要负责网络安全的官员）的内部汇报结构，以确保该人员拥有在该至关重要的角色中成功所需的独立性和权威。`CISO` 可以向公司的首席信息官、首席风险官、首席运营官、首席技术官，甚至首席执行官汇报——但在任何情况下，`CISO`
    都应该能够接触高级管理层和董事会。公司管理层还应考虑建立由 `CISO` 主席的信息安全委员会，并邀请 C 级官员参加委员会会议。董事们应该了解谁担任了 `CISO`
    职位，并根据情况与该人员直接接触。


    从董事会的角度来看，有效监督的关键在于让高级管理层负责阐述和监控公司与网络安全相关的战略和风险容忍度。在大多数情况下，董事成员应对公司的网络安全计划保持“参与关注”而非“深度干预”。


    董事会可以并且应该发挥关键作用的一个领域是开发与网络安全相关的公司战略计划。在完成初步工作后，董事会应监督公司管理层实施该战略计划。


    ## 事件响应与框架


    董事会还应与管理层合作制定网络事件“响应手册”，规划出公司应对方案。例如，在 Uber 丑闻之后，公司可能想要考虑如何应对赎金要求，权衡可能缓解与泄露相关的某些损害的优点，与以这种方式奖励犯罪行为的缺点。任何此类分析都应该足够灵活，以考虑到当时的执法部门的建议以及对公司披露义务的法律分析。为了避免
    Equifax 问题，公共响应计划应指定一个内部和外部专业团队来调查原因并进行适当的披露。


    公司管理层可以使用各种框架来制定与网络安全相关的适当风险管理策略。例如，2013 年 10 月，美国商务部国家标准与技术研究所（`NIST`）发布了一套关于减少网络安全风险的自愿标准和最佳实践征求意见。最终版本于
    2014 年 2 月发布，题为《改进关键基础设施网络安全框架》。


    `NIST` 框架包含了五个“功能领域”，董事在为公司制定整体网络安全计划时可以考虑这些领域。这些功能包括：


    - **识别 (Identify)**：建立组织理解，以管理系统、资产、数据和能力的网络安全风险。

    - **保护 (Protect)**：开发并实施适当的保护措施，以确保关键基础设施服务的交付。

    - **检测 (Detect)**：开发并实施适当的活动，以识别网络安全事件的发生。


