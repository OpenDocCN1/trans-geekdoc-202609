    网络韧性的一个重要组成部分是聘请外部专家和公司，以支持对任何数据泄露做出果断、有效的响应。数据泄露发生后的环境并不是寻找所需专业知识或谈判合同条款的时机，因此拥有一支外部专家团队可以加速恢复和业务的重启。这些外部专家应精通法医鉴定、法律、沟通和系统修复等领域。在事件发生之前，您还应该预先考虑您与执法部门（如
    FBI 及其他机构）的应对方案。


    跟我重复一遍：网络安全无法无法保证，但及时且恰当的反应可以。


    ## 建立有效的治理结构


    公司需要一个有效的治理结构，以确保员工以及与您合作的每位人员都能进行准确、及时的评估，以识别当前和新兴的漏洞。最好使用外部专业人士来审查您的治理结构。让具备适当技术技能并了解当前风险环境的专业人士参与至关重要。一位精通网络世界的技术导向专业人士可以是一个不可或缺的资源。


    ## 持续的员工培训与发展


    研究表明，三分之二的成功网络攻击直接归因于员工的行为（或不作为）。公司必须确保员工理解网络威胁的多样性及其不断变化的本质。他们需要了解自己的行为如何帮助保护公司资产。因此，提高员工对风险暴露的意识对于加强贵组织的整体网络韧性至关重要。员工意识的任何可衡量的提高——通过游戏化和具有操作性质的持续培训等举措——将极大地增强贵组织保护和应对网络事件的能力。


    遗憾的是，大多数员工对自己的个人数字安全并不感兴趣，更不用说公司的安全了。从历史上看，任何与 IT 安全有关的事情都被 IT 团队隔离开用户之外。那么，用户对公司的网络安全几乎完全没有兴趣，难道不奇怪吗？消除这种消极态度是困难的。改变组织的企业文化以加强网络安全是非常困难的。这需要向
    CyberWellness℠（网络健康）范式转变，以跟上不断演变的网络威胁。


    想想，用户和员工应该是数据安全的最前线。毕竟，他们是创建和处理信息的人。他们处于理解信息价值的最佳位置。高级管理层应该实施与用户和员工 `engage` 的互动式培训和问责计划。现代基于游戏的培训——辅以后续监控以观察用户和员工如何应用培训——可以将公司的文化转变为网络安全是每个人的责任。培养和维护一个持续的学习环境是非常重要的——包括相关的且记忆深刻的培训和工具，以支持强大的网络卫生，从密码协议到反钓鱼活动，再到“自带设备”策略。


    此外，创建一个安全的环境至关重要，在这个环境中，鼓励各级用户和员工指出弱点和漏洞，而不必担心“打信者会被杀死”。用户和员工需要知道，当他们识别出未缓解的风险或新兴威胁时，他们会获得认可和奖励。你希望他们带给你来“坏消息”，因为如果你不知道漏洞的存在，你就无法防止或修复它们。一种健康的
    CyberWellness℠ 文化会赞扬并感谢这些传信者——而不是杀掉他们。


    ## 为所有第三方供应商和供应商实施管理流程


    第三方对运营环境可以产生积极影响。然而，公司对第三方网络安全风险的关注程度通常不如对自身业务的敏锐。他们本应该是这样的！第三方可能会产生与公司员工相同的负面长期影响。请考虑，公司与其供应商之间的数据共享和通信已不再完全由公司内部运营控制。供应商和供应商是为公司技术环境创建新入口的外部实体，增加了运营环境的复杂性和潜在的波动性。


    以下是任何健康第三方计划的一些基本准则：


    *   根据对组织的风险（包括网络风险）优先考虑第三方暴露风险。

    *   为任何新关系的建立建立的评估工具。

    *   实施持续的、基于风险调整的监控流程，以评估对合同条款的遵守情况，并与主要服务商进行联合灾难恢复测试。


    法律和其他务实考虑可以（也应该）用于划分和缓解通过第三方关系引入的风险。风险——无论源自哪里——在危机或压力时期都会反回到您的公司。当问题发生时，企业客户和个人客户都会向
    `your` 公司寻求解释和救济。尝试向一个社会安全号码被泄露的人解释，问题来自一个 B2B 供应商。


    ## 退后一步


    虽然我提到了贵公司为了建立健康且具韧性的网络安全计划需要采取的几个不同步骤，但我想要重申，对公司的网络安全计划感到合理的安全，不仅仅是能够回答像这样的问题：“我们的组织是否有正确的治理结构？”相反，它是要能够回答更大的问题，例如：“我们思考安全的方式正确吗？这一切将向何处发展？”通过在
    CyberWellness℠ 方法中采取主动措施，你将让自己、客户和员工尽可能地保持安全。


    # 培养强大的文化以增强网络安全


    我们都知道企业文化不会改变得很快——它们会发生迁移。大多数组织发展专家提供同样的文化改变的配方：


    1.  选择正确的领导者。

    2.  认可并奖励你想要鼓励的行为。

    3.  传达清晰的价值观。

    4.  提供广泛的培训。


    这个配方对于网络安全这个不断演变、变化莫测、不断移动的目标是不起作用的。大多数员工对自己的数字安全并不感兴趣，更不用说公司的。因此，改变公司的文化以加强安全是特别困难的，需要范式转变以跟上威胁格局。


    大多数人认为安全是对公司数字环境的保护——即像一个虚拟的硬化外壳，由安全人员保护公司的网络、服务器和应用程序。这种范式的问题在于，当你关注环境时，由于所雇用的安全措施变成了一个目的本身，并且与它试图保护的数据没有直接关系。


    例如，假设一家公司试图防御数据丢失或数据的未经授权使用。从安全的角度来看，如果数据本身不是易于读取的，并且根据授权访问者及其所处的业务背景进行跟踪，难道不是好得多？


    此外，这种方法通过公司可能作为“深度防御”策略的一部分而实施的多层防御层仍然有效。


    ## 以数据为中心的安全


