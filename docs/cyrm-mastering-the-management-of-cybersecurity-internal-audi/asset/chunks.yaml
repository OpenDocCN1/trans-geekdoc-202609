- fmt: '

    An important component of cyber resilience entails de having external experts
    and firms on board to support a decisive, effective response to any data breach.
    The post-breach environment isn’t the time to be searching for required expertise
    or negotiating contractual terms, so having a team of external pros on board can
    speed recovery and resumption of operations. These external experts should specialize
    in forensics, legalities, communications, and systems remediation, among others.
    Your approach to law enforcement (FBI and others) should also be considered in
    advance of an incident.


    Repeat after me: cybersecurity cannot be guaranteed, but a timely and appropriate
    reaction can.


    ## Establish Effective Governance


    Companies need an effective governance structure to ensure that staff and everyone
    you work with can conduct accurate, timely assessments to identify current and
    emerging vulnerabilities. It’s best to use an outside professional to review your
    governance structure. It’s critical to involve professionals with the appropriate
    technical skills and knowledge of the current risk environment. A tech-oriented
    professional versed in the cyber world can be an indispensable resource.


    ## Ongoing Workforce Training and Development


    Research indicates that two-thirds of successful cyberattacks are directly attributable
    to the actions (or inactions) of employees. Companies must ensure that employees
    understand the wide variety and ever-changing nature of cyberthreats. They need
    to know how their own actions can help safeguard company assets. Therefore, improving
    awareness of employees to risk exposures is critical in strengthening your organization’s
    overall cyber resilience. Any measurable improvement in employee awareness—through
    initiatives such as gamification and ongoing training that’s operational in nature—would
    be highly accretive to your organization’s capacity to protect and respond to
    a cyber incident.


    Unfortunately, most employees aren’t interested in their own personal digital
    security, much less their company’s. Historically, anything having to do with
    IT security was kept away from users by IT teams. Is it any wonder, then, that
    users show little to no interest in their company’s cybersecurity? Undoing that
    disinterest is hard. Changing your organization’s corporate culture to strengthen
    cybersecurity is very difficult. It requires a paradigm shift to CyberWellness℠
    that keeps pace with evolving cyberthreats.


    If you think about it, users and employees should be the front line of data security.
    After all, they’re the ones who create and handle information. They’re in the
    best position to understand its value. Senior management should implement interactive
    training and accountability programs that `engage` with users and employees. Modern
    game-based training—with follow-up monitoring to see how users and employees apply
    their training—can transform a company’s culture into one where cybersecurity
    is everyone’s job. It’s important to cultivate and nurture a continuous learning
    environment—including relevant and memorable training and tools to support strong
    cyber hygiene, ranging from password protocols to antiphishing campaigns to “bring
    your own device” policies.


    In addition, it’s essential you create a safe environment in which users and employees
    at all levels are encouraged to point out weaknesses and vulnerabilities without
    worry that the messenger will be killed. Users and employees need to know they’re
    acknowledged and rewarded when they identify an unmitigated risk or emerging threat.
    You want them to bring you “bad news,” because you can’t prevent or fix vulnerabilities
    if you don’t know they exist. A healthy CyberWellness℠ culture praises and thanks
    the messengers—it doesn’t kill them.


    ## Implement Management Processes for All Third-Party Vendors and Suppliers


    Third parties can be positively impactful to an operating environment. However,
    companies aren’t usually as attuned to cybersecurity risks from third parties
    as they are for their own businesses. They should be! Third parties can create
    the same adverse, long-term effects as company employees. Consider that the sharing
    of data and communication between your company and its vendors is no longer fully
    in control of the internal operations of your company. Vendors and suppliers are
    external parties that create new entry points into a company’s technology environment,
    adding complexity and potential volatility to the operating environment.


    Here are some basic ground rules for any healthy third-party program:


    * Prioritize third-party exposures based on risk (including cyber) to the organization.

    * Put clear assessment tools in place for the onboarding of any new relationships.

    * Implement ongoing, risk-adjusted monitoring processes to assess adherence to
    contract terms and joint disaster recovery testing with primary service providers.


    Legal and other practical considerations can (and should) be employed to partition
    and mitigate the risk introduced through third-party relationships. Risk—no matter
    where it originates—will rebound to your company in times of crisis or stress.
    Clients and customers, both corporate and individual, will always look to `your`
    company for explanations and relief when problems occur. Try explaining to someone
    who’s had their Social Security number compromised that the problem came from
    a B2B vendor.


    ## Take a Step Back


    While I’ve touched on several different steps your company needs to make to have
    a healthy and resilient cybersecurity program in place, I want to reiterate that
    feeling reasonably secure about your company’s cybersecurity program isn’t just
    a matter of being able to answer questions like: “Does our organization have the
    right governance structure?” Rather, it’s being able to answer bigger questions,
    such as: “Are we thinking about security the right way, and where is all this
    going?” By being proactive in your approach to CyberWellness℠, you''ll keep yourself,
    your clients, and your employees as safe as possible.


    # Cultivate a Strong Culture to Enhance Cybersecurity


    We all know that corporate cultures don’t change quickly—they migrate. Most organizational
    development experts offer the same recipe for culture change:


    1. Pick the right leadership.

    2. Recognize and reward the behaviors you want to encourage.

    3. Communicate clear values.

    4. Provide extensive training.


    This recipe won''t work for the ever-evolving, shape-shifting, constantly moving
    target that is cybersecurity. Most employees aren''t interested in their own digital
    security, much less their company''s. Therefore, changing a company''s culture
    to strengthen security is especially difficult, requiring a paradigm shift to
    keep pace with the threat landscape.


    Most people think of security as the protection of a company''s digital environment—a
    virtual hardened shell, protected by security guarding the company''s networks,
    servers, and applications. The problem with this paradigm is that when you focus
    on the environment, the security employed becomes an end in itself and isn’t directly
    related to the data it''s trying to protect.


    For example, suppose a company is trying to defend against data loss or the unauthorized
    use of data. Isn''t it far better, from a security perspective, if the data itself
    are not readily readable and can be tracked based on those with authorized access
    and the business context in which it’s being used?


    Further, this approach still works through the multiple defensive layers that
    a company may implement as part of a “Defense in Depth” strategy.


    ## Data-Centric Security

