    第二道防线是提供独立的监督，以确保风险得到积极且适当的管理。那些密切参与网络安全的人员偶尔会忽略某些问题，因为他们每天都处于一线战斗中。风险管理部门应该提供这种独立、客观的视角——换句话说，就是一双全新的眼睛或具有建设性的挑战。风险管理人员在处理公司内部所有其他风险时，应该扮演相同的角色并执行相同的功能。例如，他们应该在确定公司需要保护的“皇冠明珠”是什么方面发挥关键作用，然后评估现有的控制措施是否适当。


    网络安全的第三道防线是审计职能，它通过定期测试已实施的政策和控制措施，确保其到位且有效。内部审计应通过对现有和所需控制进行独立评估，在帮助公司管理网络威胁方面发挥关键作用，并帮助高管理层理解并应对当今数字世界中许多多样的风险。内部审计还应该评估整个网络安全框架，而不是有选择地挑选项目。这种评估涉及将当前状态与框架特征、组织正向何处发展以及整个行业或业务领域的预期最低网络安全实践进行对比。初始评估应为进一步、更深入的审查提供参考。它的目的并不是进行需要大量测试的详尽分析。相反，初始评估应该驱动额外的基于风险的网络安全深层审查。


    以下是构建 `CyRM℠` 免疫系统的关键组件摘要，将在后续章节中进行更详细讨论。


    ## 警报


    智能网络监控、预警指标、多层防御以及从过去事件中吸取的教训都是真正的网络韧性的关键组成部分。网络安全无法保证，但及时适当的反应是可以的。


    意识到第三方处理公司敏感数据时带来的风险，因为第三方会对运营环境产生影响。公司对第三方网络安全风险的关注程度通常不如其对自身业务风险的关注程度，尽管第三方可能会产生同样的负面长期影响。


    例如，公司与其供应商之间的数据共享和通信已不再完全由公司内部运营控制，因为这些外部实体为公司的技术环境创建了新的切点，增加了运营环境的复杂性和潜在的波动性。第三方计划的基础应包括：根据对组织的风险（包括网络风险）对第三方风险进行优先级排序；为任何新关系的建立建立的评估工具；以及持续的、基于风险调整的监控流程，以评估对合同条款的遵守情况，并与主要服务提供商进行联合灾难恢复测试。


    ## 解决问题


    建立组织理解，以管理针对系统、资产、数据和能力的网络安全风险。当问题真的发生时——因为它们迟早会发生——快速识别问题的能力将带来更有效的恢复。


    开发并实施适当的保护措施，以确保关键基础设施服务的交付。利用新兴的开源情报服务并使用收集的数据来指导持续的网络安全投资同样重要。随着时间的推移，这些数据将汇聚起来，允许开发新工具来分析、防止和缓解当下的网络威胁。这种新情报在主动量化风险和评估保护特定资产所需的投资水平时将特别有价值。


    ## 恢复与记忆


    开发并实施适当的活动，以维护弹性计划并恢复任何因网络安全事件而受损的能力或服务。就像进行年度体检一样，高管理层必须建立独立的网络安全审查流程。威胁应该在容忍水平（高和低）的背景下来看并进行相应的处理。一个全面的网络安全管理框架应该涵盖治理、目标设定、快速事件识别、风险评估以及响应和控制活动。


    ## 考虑转移网络风险的方法


    法律和其他实际考虑因素可以（也应该）被用于划分和减轻风险。然而，风险——无论源自何处——在危机或压力时期都会反弹到你的公司。对公司的 `CyRM℠` 计划感到相当安全，不仅仅是能够回答诸如“我们的公司是否有正确的治理结构？”的问题。相反，它还需要能够回答更大的问题，例如“我们考虑安全的方式是否正确，这一切将向何处发展？”


    # 对齐 IT 与业务的关键决策


    如今的董事会成员在审查技术决策时面临着一个重要问题：公司的 IT 决策是否与战略决策对齐？遗憾的是，这种关键的对齐在大多数公司中都是缺失的。想要实施稳健 `CyRM℠`
    政策的公司必须问自己以下三个问题，以评估 IT 与业务之间的对齐情况：


    *   利用技术是否在生产力、收入目标、业务敏捷性、客户体验改进、上市速度以及与客户共同采用方面为业务产生了可证明的价值？

    *   从 IT 获取业务价值是否是一项共同责任？这种责任表现为 IT 是制定战略方向的频繁合作伙伴；它被视为创新者而非仅仅是服务提供者；以及与业务部门紧密合作以利用新兴技术？

    *   是否存在一个持续的过程，在多个维度和关键时间段内调整 IT 能力？该过程是否包括 IT 与业务之间思想、知识和信息的有效交换，利用 IT 基础设施支持新应用、重心转向数据和安全，以及根据有限的价值标准对项目进行共同评估？


    董事成员在评估组织内部战略与运营决策以及 IT 决策之间的不匹配时，需要考虑以下步骤。问题是不对齐，目标是对对齐。高管理层的职责是持续管理这种对齐：


    1. 识别问题——或机会并解决它。

    2. 收集信息并开发替代方案。

    3. 选择你认为最成功的方案。

    4. 根据决策采取行动。


    ## 识别问题并解决它


    在如今的许多组织中，IT 策略是事后考虑——它是附加在业务战略上的，而不是成为其不可缺的一部分。这导致了战略和运营业务决策与 IT 决策之间的不匹配。尽管
    IT 策略在今天应该扮演重要的角色，但往往并非如此。因此，第一步是将这种不匹配识别为问题——然后确定它正在得到解决。


