- "# CyRM：网络安全管理高级指南（内部审计与 IT 审计）\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n献给我的家人，\n\
  \n他们为周围的世界赋予了生命。\n\n\n## 引言\n\n\n\n在 20 世纪 90 年代，通用电气首席执行官杰克·韦尔（Jack Welch）曾对领导者说：“如果你不困惑，你就完了。”我一直很喜欢这个告诫，因为认为自己掌握了一切会导致傲慢和自满；而困惑能让你谦虚。而谦虚意味着你具有可学习性——意识到自己有很多不知道的事情（甚至比知道的更多）——这会促使你寻求新信息并保持警惕。\n\
  \n当时，我是花旗银行（Citicorp）的企业风险经理，我明白金融机构是经营环境的镜像。如果我们经营业务的环境良好，我们的客户就良好，我们也良好。因此在那时，我的方法是彻底理解我们运营的环境，并密切关注拐点——即领先指标。例如，当我们的新兴市场业务客户开始将其私人财富转移到海外时，我将其视为当地经济正走向错误方向的领先指标。\n\
  \n那时，技术创新的速度是一个领先指标，所以我聘请了麻理工学院教授下村通（Tsutomu Shimomura）对银行进行“道德黑客攻击”。几天后他来告诉我：“你们是一个太容易攻击的目标了。只需要轰击你们的叫中心，客户就无法打进来，你们很快就会倒闭。”\n\
  \n回到现在：网络攻击后的公众监督（有时甚至是愤怒）以及监管机构的行动，已使网络安全成为关键领导责任。当问题出现时，无论大小，快速识别并解决问题的能力将决定公司的最终恢复情况。另一起重大网络安全漏洞很快就会出现在新闻中。唯一的问题是该漏洞有多严重、多昂贵，以及损害程度是否会公开。\n\
  \n是什么导致了网络犯罪的增加？三个广泛的新安全挑战已经出现。\n\n\n\n\n\n首先，数据、连接、交易和通信量经历了前所未有的爆炸式增长，这导致传统数据系统不堪重载。\n\
  \n其次，机构已经失去了有效识别问题的能力。更快的创新周期和眼目缭乱的新产品意味着，大多数企业发现自己无法快速识别安全泄露。社交网络系统、大数据、云计算、移动互联网和物联网技术正在产生个人数据流，这些数据流使得授权和信息过滤变得异常困难。\n\
  \n第三，缺乏正式的控制机制。在网络安全干扰变得日益普遍且复杂的环境中，目前在检测、响应、修复和企业内部通信方面仍然没有公认的标准。这些关键职能的管理往往被留给\
  \ IT 部门，而 IT 部门通常被指示去追求过时的“硬壳”策略，这些策略的设计初衷仅仅是为了威慑渗透尝试。\n\n凭借作为风险管理领导者的数十年经验，我审视了这一现状，并敏醒地意识到，我们需要一种能够持续评估其收集到的信息的有效性、可靠性和价值的信息安全模型。我开发并完善了该安全模型，将其转变为一个流程，我知道这个流程可以帮助公司避免网络攻击中最糟糕的陷阱。它被称为`cyber\
  \ risk management`，或 `CyRM℠`。\n\n`CyRM℠` 是一种全新的范式，它将安全视为业务问题并与业务需求对齐。因此，它不再将安全视为由技术人员处理的技术问题，而是使用一种以结果为驱动的方法来平衡投资与风险。进一步，它不是以牺牲高管参与为代价来向问题上砸钱，而是将网络安全与业务决策联系起来，以影响业务结果。\n\
  \n为了有效影响业务结果，`CyRM℠` 需要由三个部分组成：\n\n1. **风险管理：** 它需要将风险管理的原则应用于网络安全，以便对整个组织的风险进行全局观察，指导资源分配，更好地管理风险并实现问责制。\n\
  2. **CyberWellness℠：** 它不仅需要涵盖整个公司，还包括每个需要对他们承担的风险负责的员工。这需要一个与网络安全的互动过程——就像公司的身体健康计划一样，公司采取积极措施促进员工的健康。\n\
  3. **作为业务策略的网络安全：** 网络安全需要重新定位为它的本质——增长的推动者，而不仅仅设计为通过消除病毒和黑客带来的危险来降低运营风险。它还需要增强产品完整性、客户体验、运营合规性、品牌声誉和投资者信心。\n\
  \n本书阐述了我对 `CyRM℠` 的方法，并向你们——无论是业务领导者还是 IT 经理——展示如何合作并取得成功。书的每一章都会告诉你管理当前网络安全格局所需要的知识。每一章都以\
  \ `CyRM℠` 行动点结束——这些你可以采取的主动步骤，可以让你自己和你的公司做好生存和成功的准备。我期待在深入研究 `CyRM℠` 时担任你们的教育者和导师。\n\
  \n# 1 现状\n\n2017 年 9 月 7 日，美国最大的最大的信用监控机构之一 Equifax 宣布，超过 1.43 亿客户账户遭到泄露，这可能是迄今为止影响美国消费者最严重的网络攻击。此后，受影响的人数估计已上升到\
  \ 1.47 亿。\n\n在 Equifax 丑闻期间，美国证券交易委员会（SEC）也发布了一些引人注目的披露信息。新上任的 SEC 主席杰·克莱顿（Jay Clayton）于\
  \ 2017 年 9 月 20 日宣布，SEC 自己的 EDGAR 申报系统在几个月前已被网络攻击者渗透。这引发了对此类系统安全性的质疑，以及拥有敏感和非公开公司信息的个人进行内幕交易的风险。\n\
  \n从那以后，其他近期的高知名网络攻击层出不穷。令热门剧集《游戏王座》粉丝感到遗憾的是，HBO 电视网络被一个小组攻破，他们盗取了超过 1.5 TB 的信息，包括剧本和几部热门剧集的完整剧集。《卫报》透露，作为“四大”会计师之一的德勤（Deloitte\
  \ LLP）——其咨询客户包括大型公司和政府部门——已成为泄露事件的受害者，内部邮件系统遭到破坏。德勤此后通知了六家信息可能受到该次泄露“影响”的客户，并完成了对该事件的内部调查。Uber\
  \ 花费了一多时间才承认自己被黑。据报道，这家网约车公司支付了一笔“赎金”，以换取黑客删除已清理数据的承诺。\n\n大规模数据泄露每年都在发生。2019 年，一些著名的事件包括发生在\
  \ `Capital One`、`Facebook`、`Quest Diagnostics` 和 `First American` 的事件。在 `Capital\
  \ One`，一名黑客获取了超过 1 亿客户账户的访问权限。`Quest Diagnostics` 透露，一名用户通过第三方供应商获取了 1200 万患者的医疗信息。在剑桥分析丑闻约一年后，`Facebook`\
  \ 承认无意中公开了 100 万封用户电子邮件。在一次更大的泄露中，美国房产产权公司 `First American` 透露，近 900 亿记录遭到破坏。\n\n\
  在勒索攻击方面，2019 年也是大获的一年。2020 年，公民实验室（隶多伦多大学）揭露了一个名为 `Dark Basin` 的雇佣黑客组织，位于新德。这些雇佣黑客针对\
  \ `Exxon` 和德国公司 `Wirecard`。雇佣黑客为想要制造麻烦的客户提供服务——在不同的管辖区，阻力小且不容易被发现。2020 年，黑客通过针对远程员工入侵了美国最大的国防承包商之一洛希德·马丁（Lockheed\
  \ Martin）。黑客获取公司访问权限只需要一个点；一旦发现该点，他们就可以接管整个网络。一旦进入，他们就可以窃取数据和秘密，甚至将授权用户排除在网络之外。\n\
  \n任何公司面临的最大风险之一在于云。随着供应链变得日益复杂，金融机构依赖第三方来提供规模和灵活性。第三方提供者通常是网络入侵者利用以到达其目标的媒介。这极大地增加了公司需要考虑的攻击面——即黑客可以利用的机会范围。信任第三方会以和你相同的方式关注你的安全需求并不是明智的策略。如果你依赖薄弱的接口与云服务交互，可能会出现涉及机密性、完整性可用性和问责制的问题。\n\
  \n以下是云技术可能产生的一些问题示例。攻击者现在能够使用你（或你的员工）的登录信息远程访问存储在云端的敏感数据；通过劫持的凭据伪造和操纵数据；或注入恶意软件并将其嵌入云服务器。而且，如果协同操作，攻击者可以监听、破坏敏感信息的完整性，甚至窃取数据。\n\
  \n\n\n\n\n此外，第三方公司提供的服务是弹性的——换句话说，它们提供的服务和安全性有不同程度之分。这导致了不一致的安全模型。你可能听过应用程序编程接口（`APIs`）。`APIs`\
  \ 是一种编程过滤器，让用户有机会定制云服务功能以适应业务需求。例如，银行和烘焙店的需求非常不同，对它们来说，在网站上拥有特定的数据过滤器是有益的。虽然这些程序在允许用户进行身份验证、提供访问和影响加密方面非常有用，但它们也会产生漏洞。`API`\
  \ 最大的漏洞在于应用程序之间的通信——这创造了可被利用的安全风险和新的攻击面。\n\n举例来说：2019 年 1 月，研究人员揭示了大多数现代微处理器中一种常见的设计特征，该特征允许使用恶意的\
  \ `JavaScript` 代码从内存读取内容（包括加密数据）。这个问题有两个变体，分别被称为 `Meltdown` 和 `Spectre`，它们允许侧信道攻击，因为它们破坏了应用程序之间的隔离。那段技术术语是另一种说法，即攻击面的扩大意味着风险的增加！\n\
  \n准备好应对随云技术带来的更多潜在问题了吗？在最近的一起在线银行破解事件中，攻击者是托管该银行网站的第三方公司的前员工。据称，犯罪分子使用了 `web application\
  \ firewall` 凭获得了“权限提升”，我们用这个词是指获取了大多数人不应看到的信息。云的另一个潜在问题包括服务提供商意外擦除数据。这最近发生在一家大型在线零售商处。通常，企业对存储在云端的数据没有恢复计划。一旦数据丢失，它就永远消失了（如果没有备份的话）。\n\
  \n无论攻击是通过云端还是其他方式，针对持有敏感个人和专有数据的组织的网络攻击频率和严重性逐年剧增——这些攻击造成的资金损失已达`数十亿`。对于公共和私营组织都是如此。这些攻击对所有受影响的人无疑是破坏性的且昂贵的。\n\
  \n银行、零售商、国防承包商、财富 `500` 公司、娱乐公司和地区政府——所有这些最近都是网络攻击的受害者。这只是未来更多攻击的序奏。美国许多员工现在居家办公，使用个人笔记本电脑通过不安全的互联网连接访问包含机密信息和个人数据的工作文件。这为黑客提供了充足的机会——即前面提到的“攻击面”。每家公司的攻击面都急剧扩大，使他们更容易成为目标。网络情报公司\
  \ `CYFIRMA` 报告说，2020 年 2 月到 3 月之间，与 `COVID-19` 疫情相关的网络威胁增加了 600%。\n\n现在，既然我已经引起了你的注意力，对于网络攻击，我们——或者说**你**——应该怎么做？答案绝对不是掩龟自首。如果你和你的公司想在这个网络环境中生存并繁荣发展，你就必须变得明智且全面。你需要投资并增强你的网络风险管理（`CyRM℠`）。\n\
  \n有些人人可能认为美国政府可以保护他们免受攻击。毕竟，我们的 `Army` 保护我们免受入侵。为什么不保护我们免受网络入侵呢？但这是一个残酷的事实：尽管美国政府擅长传统的军事防御，但遗憾的是，他们在网络防御方面并不出色。在`9·11\
  \ 事件`之后的二十年来，我们没有任何证据表明政府采取了行动来保护我们。\n\n考虑一下，`2014`年 11 月，`国家安全局`局长在`国会`作证时，他相信外国可以关闭电力、水务和燃料。想想看。五多年前，我们的政府接到通知，不同国家可以有效地关闭国家基础设施，但政府随后并没有给出任何关于正在采取措施的保证。也许这种威胁太理论化、太无形化，且太关乎生存。\n\
  \n然而，在那次证词后仅`四天`，`朝鲜`对索尼发动网络攻击，破坏了专有信息和计算机硬件。一个国家行为者证明了它可以访问并让一家巨型跨国公司难堪。`2015`年，我们得知`人事管理局`（`OPM`）尽管早有警告，仍允许中国政府盗取\
  \ 2100 万美国人的安全许可背景数据。最近，`NSA` 未能保护高度先进的武器化的 `zero-day`。（零日漏洞是先进的网络攻击工具，速度极快且破坏性极大，以至于受害者没有时间发现它们。）`NSA`\
  \ 失败的结果是，这些漏洞现在落入了恶意攻击者手中，他们在范围内大肆破坏。`2020`年，由外国政府支持的组织的重大网络攻击渗透了美国联邦政府的多个部分。\n\n\
  尽管有这些攻击和专家的反复警告，美国政府自`2002`年以来还没有通过任何独立的网络安全相关立法。`2002`年，我们都在使用 `America Online`，而\
  \ `Gmail` 甚至不存在！最近提出的（但未通过）最重要的网络安全法案要求私营部门与政府共享更多数据。为什么公司要自愿将敏感数据交给一个在保护 `OPM`\
  \ 和 `NSA` 数据方面严重失职的实体呢？而这些数据可以说是其国家机密库中最敏感的信息之一。\n\n美国情报界日益担心外国政府将通过网络入侵金融机构——不是为了偷钱，而是为了污染、破坏和操纵数据。外国情报机构旨在为记录保存、交易精确度和货币估值制造混乱的网络攻击，可能会破坏并毁灭公众信任，以至于整个金融系统的稳定性都可能受到影响。\n\
  \n\n\n\n持续且广泛的金融数据腐败这种毒性混合——加之政府似乎无力阻止这种现象——显然是一个巨大的动荡威胁，反过来，这应该触发公共部门和私营部门的紧迫战略规划。不要等待政府对其政策进行现代化改造。不要盲目信任第三方公司。网络坏法分子拥有惊人的触达，可以触及大量潜在受害者。他们迅速变换战术，在穿过无边界的数字领域时保持高度匿名状态，在自己故土的舒适家园大肆破坏。\n\
  \n这些坏蛋面对的是——如果他们能对上号头的话——是一个拖着模拟时代法律架构的美国政府，这种架构按任务（执法、情报、军方）和地理位置（国内、国外、司法管辖区、美国人士、非美国人士）划分，并使用大部分在冷战期间构建的政策和程序（安全分级制度）。\n\
  \n面对新的网络威胁现实，政府显然并不充分、不具战略性，也不敏捷。现在是时候重新审视在如今虚拟互联的星球背景下，现有刑法、国际条约协议以及治理方案的充分性了。然而，考虑到政府迄今为止的拙劣表现，不要指望它能自己振作起来。现在就行动。\n\
  \n有些人看到光明就会改变；另一些人只有在感受到热度时才会改变。换句话说：你可以主动出击，也可以被动反应。在涉及到网络安全时，美国政府已被证明是被动的。明智商业领袖——那些能看到光明的人——有责任在**现在**采取行动来保护自己的公司。随着攻击面的倍数增加和政府的缓慢反应，是你时候投资\
  \ `CyRM℠` 并在将坏蛋拒之门外方面发挥领导作用了。\n\n## Note\n\n## 维度 1：`CyRM℠`：网络风险管理\n\n# 2 收集情报，预测风险\n\
  \n正如我们在`第 1 章`中看到的，这不再是一个公司是否会受到攻击的问题，而是关于这何时会发生的问题——以及组织将如何防止它。当问题出现时，无论程度是重大还是轻微，快速识别和响应问题的能力将决定你公司的最终恢复情况。我的方法\
  \ `CyRM℠` 将风险管理的原则应用于网络安全。我相信，从整个组织的角度审视风险是至关重要的，以此指导资源分配、更好地管理风险并实现问责制。与传统的风险管理一样，`CyRM℠`\
  \ 的目标是尽早识别风险并实施适当的缓解措施以防止事件发生或减轻其影响。为了培养卓越的网络风险管理计划，你首先需要理解企业风险管理的原则和实践。\n\n风险经理通过多种方式调查公司面临的风险格局，然后根据这些风险创建相应的应对措施。在考虑风险管理时，一个很有用的类比是人体：你的五感接收刺激并将数据传给大脑，以便发现潜在危险并预测问题。历史记忆帮助你根据过去的经验预测潜在结果，并帮助你规划潜在的应对。你的五种前瞻性感官结合你的历史记忆，持续监控你的周围环境，警示你潜在的危险。例如，烟味和/或逼近火源的热量会告诉你被火灾伤害的风险有多紧迫、多严重。你的感官越敏锐，身体就能越迅速做出反应来保护自己。你组织的风险管理系统应该持续感知任何潜在风险，确定它们对你的业务有多严重，并提供有效的机制来快速做出。\n\
  \n对于更具技术头脑的读者，另一个恰当的比喻是雷达。雷达的独特之处在于，它虽然利用历史性能（不像你身体的历史记忆），但它也向前看以预测未来的结果。\n\n它是这样运作的：雷达天线发射无线波，无线波在路径上的任何物体上反射。反射的能量返回到天线上，由它确定物体的距离、高度、方向和/或速度。跟踪算法预测移动物体未来的位置。这些算法很大程度上基于历史性能，并带有频繁的前瞻性更新。换句话说，雷达非常擅长收集情报和预测风险。\n\
  \n风险管理——像雷达一样——依赖于量化数据。风险与信息之间存在着一种反向相关性。你掌握的信息越少，面临的风险就越高。考虑一个简单的例子：如果你不知道气象预报，你就增加了着装不当而被困在大雨中的风险。\n\
  \n从风险管理的角度来看，风险和不确定性基于概率和可能的结果是可量化的。例如，如果气象预报说百分之百会下雨，但你没有带伞并导致新鞋坏了，那么潜在的损失是可以计算的。\n\
  \n将这个简单的例子再进一步，假设你为了防止在雨中坏鞋而决定脱鞋；你完全不知道脚会发生什么。一种方法是制定方案，以确定你的脚可能发生什么、每种损害的概率，并计算潜在的损失金额。当你不知道在雨中赤脚行走会对脚产生什么影响时，这个问题变得更加难以解决。\n\
  \n如果你在雨中赤脚走过海上湿滑且潮湿的甲板时，问题将变成一个完全不同的维度——因为没有理性的个人会把生存交给概率。换句话说，这不再是一个管理不确定性的问题——它变成了生存问题。你的思维过程从“我所承担的风险成本是否合理？”变成了“这是我绝对不愿承担的风险。我现有的保护措施是否足以让我遭受严重伤害？”。换句话说：你不愿跨越的界线何时变成关于生存——关乎你的存在——而不再仅仅是量化成本？\n\
  \n许多风险经理就生存相关问题通过方案工作，试图限制可能性的范围。方案具有局限性：它们只处理已知的未知风险（你可以想象到的事情），因此无法处理你不知道的事情（未知的未知风险）。优秀的风险经理会问：“我如何将尽可能多的未知风险转化为已知风险，从而对其进行量化？”\n\
  \n例如，再次考虑一个人在海上船只湿滑且被雨淋湿的甲板上赤脚行走的场景。如果这场雨是来自飓风，在很多情况下，风力强度或涌水的高度（所有与速度相关的因素）被低估并导致连锁反应呢？你不仅可能滑倒落海——如果船只翻覆了，岸上的救援队无法动员来救你怎么办？\n\
  \n\n\n正如雷达一样，存在复杂的公式可以帮助风险官量化所有这些场景。通过（这些公式的帮助）收集情报并预判风险。\n\n网络风险管理演变为有效的监督职能一直受到阻碍，因为大多数组织无法像处理其他类型的风险那样来组织、分类和`measure`\
  \ 网络风险。`网络安全风险的量化应该处于网络风险管理的核心位置`。量化网络风险可以带来更好的决策，因为它以与公司内其他风险相同的通用语言或语境来描述了风险。向高级管理人员、董事会和其他利益相关者报告网络风险，有助于他们很好地了解公司、特定业务、产品和活动随时间推移的网络风险水平。\n\
  \n对于整体网络安全预算、网络安全支出的分配以及保险范围，也可以做出更明智的决策。这也有助于营造一种重视漏洞的文化。它为对第三方供应商提供了客观评估。它有助于促进网络风险与其他企业风险及运营风险的整合。\n\
  \n那么，网络风险经理是如何收集情报并预判风险的呢？网络领域存在着似乎无尽的未知因素。我建议可以使用基于制造业的创新方法来解决所有类型组织的网络安全运营中断。\n\
  \n例如，在制造业中，考虑汽车制造工厂的流水线。如果一个不满的员工向流水线中间发射了一枚火箭，工厂管理团队可以确定维修流水线需要多久、维修费用是多少，以及生产损失的成本。换句话说，通过关注`what`发生了什么，而不考虑它是`how`发生的，汽车制造商就可以确定火箭造成的潜在中断损失。（当然，这种场景还应该导致对由于工厂士气低和不满员工所产生风险的额外分析。但你明白我的意思。）\n\
  \n让我们把这个例子扩展到一个本应 24/7 运行的在线银行应用程序。突然，在一个三三休假周末的深夜，银行应用程序由于网络攻击而变得毫无用。无论攻击是`how`发生的，通过仅关注`what`发生了什么，银行可以确定需要修复的关键节点、费用多少、所需时间以及停机成本——所有这些都可以像制造业示例一样被`quantified`。\n\
  \n这种方法关注服务中断的影响，而无论其产生原因是什么，它允许你有效地创建一个中断模型，并利用该模型来量化与运营中断相关的网络安全风险。底线是：网络风险经理应该关注关键中断节点以提高韧性——这在攻击发生很久以前就应该做到。\n\
  \n正如在雨中行走的经典风险示例一样，网络风险经理经常忽视这些场景中的连锁反应。例如，假设对纽约金融系统的网络攻击包括周末期间对曼哈顿电网的攻击。所有金融交易所都有应急电源系统，但它们的响应可能会受到阻碍，因为地铁也会停止运行。连锁反应是，本应响应攻击的技术人员将很难进入该城市——这一事实很容易被忽视。\n\
  \n一个优秀的网络风险管理官关注的是`what`可能发生哪些中断，而不是它们将如何`how`发生。考虑风险的连锁反应同样重要。最终，一个优秀的网络风险经理必须问自己：“我所采取的保护措施对于我的生存能力来说足够吗？”\n\
  \n例如，考虑一个真正不可知的风险，例如网络安全事件造成的声誉损失总额。操作性问题是：“应该开发什么样的最佳实践——响应计划和政策——以便能够吸收影响并让组织能够继续运行？”\n\
  \n在这些情况下，了解公司的“皇冠明珠”是什么非常重要，然后划定清晰的界限并采取强有力的缓解措施来保护它们。例如，在一家资产管理公司，个人客户数据极其敏感，可能需要额外的控制层，包括不同的安全协议。第二道网络风险管理的视角应主要是：“公司是否正在尽其所做的一切来妥善缓解这些风险的影响，以确保可持续性？”\n\
  \n一个强大的 CyRM℠ 方法执行了以下工作：\n\n*   关注网络安全事件的`impact`影响——而不是它们`how`发生。\n*   使用中断模型来量化运营中断。\n\
  *   将尽可能多的未知风险转换为已知风险，以便对其进行量化。\n*   并且对于那些不可知的风险，关注需要做什么来确保生存能力。\n\n\n将 CyRM℠ 中的网络风险管理分支类比人体免疫系统。当病菌突破人自然屏障时，免疫系统会发起三步防御：拉响警报、解决问题以及恢复和记忆。现场的第一线防者是白细胞，它们在全身不断循环，就像巡逻的警察一样。接着，被称为淋巴细胞的特殊白细胞进行双管攻击——一个针对受感染的细胞，另一个针对在血液中游走的敌对微生物。最后，一旦入侵者和受损细胞被摧毁，免疫系统的士兵就会回到基地，留下一些经验丰富的老兵，以防入侵者返回。\n\
  \n网络安全防御的有效性就像免疫系统一样，很大程度上取决于每个组件是否高效地履行其职责。公司显然需要在企业层面管理网络安全，并必须提高每个要素——一线管理、运营、内部审计、风险和合规满足其个人和组织功能的能力。管理网络风险需要三道防线。第一道防止网络事件发生并保护组织。这是整个组织每个人的责任，特别是技术和信息安全部门。高层应指定一名高级合伙人作为全公司网络安全的负责人。在技术的日常管理或危机中，拥有一位高超的领导者远比领域专家要好。在选择合适的人选时，他的领导能力——沟通和危机管理——同样重要。CyRM℠\
  \ 不是在孤立状态下管理的。讨论应当是所有管理流程的一部分，例如新产品审批、合并尽职调查和第三方外包安排。\n\n\n\n第二道防线是提供独立的监督，以确保风险得到积极且适当的管理。那些密切参与网络安全的人员偶尔会忽略某些问题，因为他们每天都处于一线战斗中。风险管理部门应该提供这种独立、客观的视角——换句话说，就是一双全新的眼睛或具有建设性的挑战。风险管理人员在处理公司内部所有其他风险时，应该扮演相同的角色并执行相同的功能。例如，他们应该在确定公司需要保护的“皇冠明珠”是什么方面发挥关键作用，然后评估现有的控制措施是否适当。\n\
  \n网络安全的第三道防线是审计职能，它通过定期测试已实施的政策和控制措施，确保其到位且有效。内部审计应通过对现有和所需控制进行独立评估，在帮助公司管理网络威胁方面发挥关键作用，并帮助高管理层理解并应对当今数字世界中许多多样的风险。内部审计还应该评估整个网络安全框架，而不是有选择地挑选项目。这种评估涉及将当前状态与框架特征、组织正向何处发展以及整个行业或业务领域的预期最低网络安全实践进行对比。初始评估应为进一步、更深入的审查提供参考。它的目的并不是进行需要大量测试的详尽分析。相反，初始评估应该驱动额外的基于风险的网络安全深层审查。\n\
  \n以下是构建 `CyRM℠` 免疫系统的关键组件摘要，将在后续章节中进行更详细讨论。\n\n\n智能网络监控、预警指标、多层防御以及从过去事件中吸取的教训都是真正的网络韧性的关键组成部分。网络安全无法保证，但及时适当的反应是可以的。\n\
  \n意识到第三方处理公司敏感数据时带来的风险，因为第三方会对运营环境产生影响。公司对第三方网络安全风险的关注程度通常不如其对自身业务风险的关注程度，尽管第三方可能会产生同样的负面长期影响。\n\
  \n例如，公司与其供应商之间的数据共享和通信已不再完全由公司内部运营控制，因为这些外部实体为公司的技术环境创建了新的切点，增加了运营环境的复杂性和潜在的波动性。第三方计划的基础应包括：根据对组织的风险（包括网络风险）对第三方风险进行优先级排序；为任何新关系的建立建立的评估工具；以及持续的、基于风险调整的监控流程，以评估对合同条款的遵守情况，并与主要服务提供商进行联合灾难恢复测试。\n\
  \n\n建立组织理解，以管理针对系统、资产、数据和能力的网络安全风险。当问题真的发生时——因为它们迟早会发生——快速识别问题的能力将带来更有效的恢复。\n\n\
  开发并实施适当的保护措施，以确保关键基础设施服务的交付。利用新兴的开源情报服务并使用收集的数据来指导持续的网络安全投资同样重要。随着时间的推移，这些数据将汇聚起来，允许开发新工具来分析、防止和缓解当下的网络威胁。这种新情报在主动量化风险和评估保护特定资产所需的投资水平时将特别有价值。\n\
  \n\n开发并实施适当的活动，以维护弹性计划并恢复任何因网络安全事件而受损的能力或服务。就像进行年度体检一样，高管理层必须建立独立的网络安全审查流程。威胁应该在容忍水平（高和低）的背景下来看并进行相应的处理。一个全面的网络安全管理框架应该涵盖治理、目标设定、快速事件识别、风险评估以及响应和控制活动。\n\
  \n\n法律和其他实际考虑因素可以（也应该）被用于划分和减轻风险。然而，风险——无论源自何处——在危机或压力时期都会反弹到你的公司。对公司的 `CyRM℠` 计划感到相当安全，不仅仅是能够回答诸如“我们的公司是否有正确的治理结构？”的问题。相反，它还需要能够回答更大的问题，例如“我们考虑安全的方式是否正确，这一切将向何处发展？”\n\
  \n\n如今的董事会成员在审查技术决策时面临着一个重要问题：公司的 IT 决策是否与战略决策对齐？遗憾的是，这种关键的对齐在大多数公司中都是缺失的。想要实施稳健\
  \ `CyRM℠` 政策的公司必须问自己以下三个问题，以评估 IT 与业务之间的对齐情况：\n\n*   利用技术是否在生产力、收入目标、业务敏捷性、客户体验改进、上市速度以及与客户共同采用方面为业务产生了可证明的价值？\n\
  *   从 IT 获取业务价值是否是一项共同责任？这种责任表现为 IT 是制定战略方向的频繁合作伙伴；它被视为创新者而非仅仅是服务提供者；以及与业务部门紧密合作以利用新兴技术？\n\
  *   是否存在一个持续的过程，在多个维度和关键时间段内调整 IT 能力？该过程是否包括 IT 与业务之间思想、知识和信息的有效交换，利用 IT 基础设施支持新应用、重心转向数据和安全，以及根据有限的价值标准对项目进行共同评估？\n\
  \n董事成员在评估组织内部战略与运营决策以及 IT 决策之间的不匹配时，需要考虑以下步骤。问题是不对齐，目标是对对齐。高管理层的职责是持续管理这种对齐：\n\n\
  1. 识别问题——或机会并解决它。\n2. 收集信息并开发替代方案。\n3. 选择你认为最成功的方案。\n4. 根据决策采取行动。\n\n\n在如今的许多组织中，IT\
  \ 策略是事后考虑——它是附加在业务战略上的，而不是成为其不可缺的一部分。这导致了战略和运营业务决策与 IT 决策之间的不匹配。尽管 IT 策略在今天应该扮演重要的角色，但往往并非如此。因此，第一步是将这种不匹配识别为问题——然后确定它正在得到解决。\n\
  \n\n\n\n\n如果业务部门在没有 IT 部建议的情况下做出技术决策，或者 IT 部在做出业务决策时没有考虑高层的业务目标，那么对齐是不可能的。随着业务需求和组织优先事项的变化，高层团队会通过制定符合自己的策略来做出反应，但他们很少考虑让\
  \ IT 来支持这些变化。\n\n每个部门和高级高管都从自己的职能角度来看待业务问题以及机会。对齐也不例外。遗憾的是，职能部门往往无法相互交流和共享观点。董事会成员应该处于独特的地位来审视大局，并评估每个人的角色（包括\
  \ IT 的角色）是否对所有人都是清晰的。\n\n在做出良好决策时，需要收集与问题相关的信息。广撒大网以充分理解问题的重要性和紧迫性至关重要。从各种来源收集大量信息也有助于产生潜在解决方案的思路。\n\
  \n在过程中，不要过早评估潜在的解决方案。有时，起初看起来不合常理或疯狂的想法，在进一步考虑后可能会被证明是极可能性。管理学大师彼得·德鲁克曾说：“组织需要两类人：官僚和疯子。创新总是来自疯子——绝非来自官僚。”所以，要确保高层在征求可能解决方案的想法时，咨询了公司的那些“狂野且疯狂的人”。\n\
  \n在评估高层的行动方案时，你需要确定潜在决策将如何影响其他所有参与者。问问自己：“这个决策的可能结果是什么？它对现在的业务会有什么影响？对未来又会有什么影响？”\n\
  \n警告：IT 部门对这些问题的回答有时令人困惑。信息安全文化中的某些词汇和术语对于没有深度行业背景的人来说很难翻译。此外，当有问题需要解决时，IT 倾向于关注技术因素而非技术因素。当问题出现时（IT\
  \ 领域的问题以惊人的速度出现），他们假设问题要么与技术有关，要么可以通过技术或按顺序解决，这也是大多数 IT 问题的解决方式。\n\n\n一旦你评估了选项并对高层的决策感到满意，评估每个需要的人是否都采取了行动至关重要。高层必须持续评估决策和已采取的行动，以确保一切都按计划运行。这一步也是基础性的，因为它可能要求高层在过程中寻找新信息，并进行调整和进一步的更改。\n\
  \nIT 风险的衡量和评估方式与业务风险不同，这影响了决策过程。IT 风险是以性能、成本或实施时间来衡量的。当 IT 做出有关适当服务水平的决策时，他们可能会选择最高水平的服务——因为\
  \ IT 通常是根据性能可靠性来判断的。\n\n而产生真正的业务价值需要不同的指标来衡量成功——而且可能不需要最高水平的服务。由于 IT 自行分配成本，它通常需要以不同的方式跟踪和管理成本，这可能会导致深刻的脱节。\n\
  \n\n董事会成员评估以下内容至关重要：\n\n* IT 策略是否在更广泛的背景下制定，以理解服务是如何帮助或阻碍业务的。\n* 公司策略不应由技术人员在不知道业务需求的情况下孤立制定。\n\
  * IT 对公司策略的影响需要持续对话来澄清业务术语。\n* 董事会应定期检查那些警报，以便妥权衡业务取舍。\n\n简而言之，要在当今技术驱动的世界中有效竞争，公司需要处理好\
  \ IT 与业务的对齐。\n\n\n虽然网络安全对董事会来说并不是新挑战，但近期事件的规模和数量表明，在董事负责监督的责任和经理实施充分网络安全系统的职责方面，我们可能正经历一个转折点。事实上，近期许多公司发生的泄露事件揭示了董事会无法忽视的一系列教训。\n\
  \n第一个教训是，公司必须关注有关公司系统和公司使用的软件中网络漏洞的常规警报。回想一下我提到的那些高知名网络攻击案例：Equifax、Uber、HBO 和德勤（Deloitte）。在\
  \ Equifax 案例中，黑客显然利用了 `Apache Struts` Web 软件中一个已知的网络漏洞，Equifax 使用该软件来构建其网络应用程序。美国国土安全部美国应急准备小组（`US-CERT`）于\
  \ 2017 年 3 月 8 日通知了 Equifax 等许多其他公司此漏洞，并要求修补软件。尽管该公司通过电子邮件在内部传达了 `US-CERT` 通知并要求相关人员应用补丁，但补丁显然没有安装，或安装得不对，一周后对系统的后续扫描未能发现该错误。\n\
  \n给董事会成员的第二个教训是，公司必须确保拥有适当的系统来升级有关潜在网络安全事件的信息。例如，总法律顾问是否有一套流程，在关键时间窗口内，对重大泄露有内部消息的人员冻结对公司证券的交易？在\
  \ Equifax 案例中，据显示，在泄露内部报告之后、公众获知泄露之前，几位高管交易了公司的股票。这引发了对可能存在内部交易的质疑，以及在 Equifax 已经面临严厉公众审查时内部控制的缺失。\n\
  \n\n\n\n第三点教训是，如果在其任期间发生了灾难性的网络攻击，董事会必须拥有一套公共响应计划。Equifax 对该事件的公开处理受到了来自几乎所有角度的广泛批评。例如，许多人抱怨，公司在\
  \ 2017 年 7 月底首次获知泄露后，花费了整整一个月才公开披露了该事件。还有人嘲笑 Equifax，在泄露发生后的立即，竟然将消费者引导至一个不安全的“钓鱼”网站，该网站模仿了\
  \ Equifax 建立的网站，用以与那些急于了解个人信息是否被泄露的客户接触。也有人感叹，公司在泄露后似乎处于“公关模式”，犯了诸如向受影响的个人收取收费提供信用监控服务等错误，而不是免费提供。随后，Equifax\
  \ 转向为受害者提供免费的信用监控服务，但它强迫这些客户同意冗长的仲裁条款，这些条款限制了客户就相关服务起诉公司的能力。在公众的强烈抗议后，Equifax 最终放弃了仲裁条款。\n\
  \n所有这些事件都表明，Equifax 并没有准备好应对这种规模的披露后预料中会发生的公众影响。良好的 `CyRM℠` 计划是为任何可能性做好了准备。\n\n\
  董事会成员的第四点教训是，公司应该仔细考虑何时以及如何披露泄露事件。Equifax 和 Uber 的网络事件披露为这方面的董事会提供了宝贵的指导。公司在评估何时以及披露什么内容时，不仅要考虑其法律披露义务，还要考虑公众舆论。类似地，一些人指出，`SEC`\
  \ 对涉及其 `EDGAR` 数据库的网络事件进行的公开披露，在内部对该事件提出报告后几个月才公布的，这说明了对于任何行为者——包括负责监督基于披露行为的人员——来说，在快速公开披露和彻底内部审查之间平衡竞争需求是多么困难。`SEC`\
  \ 自身对网络攻击不尽人意的反应（以及由此导致的网络披露延迟）引发了人们对该机构未来将如何追究公司网络相关披露问题，以及如何在一方面的及时披露和另一方面的严谨内部审查之间平衡竞争需求的疑问。\n\
  \n最后一个教训是，公司应该意识到第三方在处理公司敏感数据时所带来的风险。德勤（Deloitte）的事件提供了另一个数据点，并强化了这样一个观点：当这些实体处理公司敏感数据时，公司必须关注自己的网络安全系统，还必须关注第三方供应商和顾问（甚至可能是政府）的系统。\n\
  \n学习我上面列出的教训只是战斗的一半。一旦高级高管和董事会成员理解了这些教训，在公司内部实施一套有效且动态的网络安全计划是至关重要的。以下考虑因素也将帮助董事测试当前网络安全计划的现状和有效性。\n\
  \n\n作为基本原则，董事在涉及网络安全时应理解他们的信托义务以及指导其公司的整体法律环境。除了业务和声誉风险外，网络安全的疏忽可能会给公司、管理层以及在某些情况下给其董事会带来重大的法律后果。公司必须意识到并理解各种联邦和州法律，其中某些法律监管了特定行业或类型的敏感信息。公司还必须意识到，联邦和州监管机构（如\
  \ `SEC`、`DOJ` 和 `FTC`）在执行其他非网络特定的法律（如联邦消费者保护法和证券法）时，可能会日益关注网络安全。此外，董事还必须警惕股东和消费者诉讼的风险，这些诉讼通常在网络安全事件披露后引发。如下文所述，公司的总法务和内部网络人员应为董事会安排定期简报，以评估这些进展。\n\
  \n网络安全是许多行业中的“首要”风险。如果董事会尚未这样做，他们应该投资进行正式简报，以讨论其公司面临的一系列现有网络安全风险，并根据这些风险权衡各种可能帮助保护公司最有价值资产的机制优缺点。\n\
  \n\n董事会首先应该识别公司最有价值的资产，并评估这些资产可能受到网络事件的损害。对于某些公司来说，它们最有价值的资产是客户的私人财务信息、个人身份信息，或可能是健康记录。对于其他公司来说，可能是知识产权，或者可能是专利数据库，甚至是一组敏感电子邮件。任何网络安全计划都必须以保护这些最重要的公司资产为目标。\n\
  \n\n董事应该对公司系统上可能发生的各种类型网络泄露有基础了解，并熟悉行业经常使用的技术术语。公司常见的网络事件范围从恶意软件到钓鱼攻击，从未修补的软件漏洞到高级持续性威胁（`APTs`）不等。此外，公司物理安全中的漏洞可能允许攻击者渗透公司的网络防御。\n\
  \n虽然董事会并不负责研究网络攻击的技术机制或其应对措施，但董事应该对这些概念有足够的熟悉，以便与管理层进行高效讨论，并对公司的网络安全计划进行有效监督。在总结现有网络安全风险时，董事应密切关注其特定行业的趋势和近期事件，以及影响相似公司的事件。特定类型的网络攻击在某些行业频率较高，而在另一些行业则较低。例如，如果你是一个小型零售商，你最迫切的网络安全可能是\
  \ POS 入侵，攻击者利用远程访问应用程序（通常由第三方供应商提供）的漏洞来提取客户的信用卡支付信息。另一方面，如果你是一个拥有庞大且易访问的物理基础设施（例如\
  \ `ATM` 机器）的大型金融机构，你可能面临更广泛的网络漏洞，包括对网络中单个节点遭受“侧录”攻击的风险。\n\n\n董事还应该宽泛了解谁或哪些团体最可能针对其公司，以及目的是什么。作为一个起点，维电的《2017\
  \ 数据泄露调查报告》建议，大多数网络泄露是由外部威胁者实施的（75%），而较小比例是由内部人员（如员工或前员工）实施的（25%）。日益增加的泄露可以追溯到国家关联者（18%），而较小比例涉及业务伙伴（2%）。\n\
  \n一旦董事会对其公司现有的网络威胁概况有了良好的掌握，就应该优先考虑降低实际发生网络泄露风险的策略。一名有效的董事将帮助公司确定哪些资产最有价值，并评估保护这些资产的关键控制措施。\n\
  \n\n\n\n\n他或她还将为突发情况制定计划，并确保建立起适当的响应框架以应对潜在的网络事件。这项练习的一部分不可避免地将涉及审查公司网络网络安全的预算，以根据现有威胁和公司现有系统的稳健性来判断其是否合理。（请记住，预防问题比修复问题要廉价得多。）\n\
  \n## 网络安全战略与文化\n\n一个关键的结论是，在网络安全中没有进攻策略——只有防御策略。此外，你无法保护一切。即便是世界上网络安全领域技术最先进的机构——国家安全局（NSA），也无法保护其最深秘密。因此，对于公司而言，至关重要的是：(1)\
  \ 反思哪些公司资产最有价值；(2) 确定哪些系统最脆弱；(3) 根据这种权衡，考虑哪些可用的机制和策略对业务至关重要且具有成本效益。\n\n\n安全需要被界定为一种关键的推动因素，帮助公司履行对客户的承诺。它还需要被公司所有层级的员工视为一项基于`teamwork`（合作）而非`surveillance`（监控）的共同努力。\n\
  \n还要考虑公司的“高层调”（tone at the top）以及发送给员工的有关网络安全实践的信息。鼓励高层营造一种每个人对网络安全负有共同责任的环境。理想情况下，员工应该与公司首席信息安全官（`CISOs`）部门的人员建立直接沟通渠道，并理解他们可以寻求该人员的判断和无忧指导。\n\
  \n\n## 评估网络安全文化\n\n评估公司网络安全文化的一个良好起点是审查公司关于使用和保护公司系统的书面及正式指南。例如，公司是否有关于员工使用个人邮箱处理公司业务的书面政策？该政策是如何实施和遵守的？董事会是否遵守相同的标准，还是会有破例？理想情况下，董事应该能够以身作则。要理解，作为董事，你可能是网络攻击的特别有吸引力的目标，因为众周知董事成员经常使用个人设备下载董事书籍并就敏感的非公开公司信息进行交流。\n\
  \n总而言之，一个优秀的 CyRM℠ 计划需要成为嵌入到公司日常运营和核心价值观中的战略重点。新的范式应该是：网络安全是一项持续的风险，需要组织中的每个人来管理。\n\
  \n当员工（来自贵公司或其他公司的员工）在这方面出现失误时，请将这些经历作为教科书式的反面教材，避免在公司任何地方重复这些错误。由于泄露往往会导致法律诉讼，董事会应该在讨论中加入律师，并确保他们改变企业文化的努力具有法律视角。在确保高层调性是诚信和有效合规后，董事会应转向战略考量。\n\
  \n\n董事会应参与关键人员的选拔，例如 `CISO`。他们还应确保建立适当的系统来监控这些人员的绩效。在过去，公司经常将网络安全的责任委托给公司的首席运营官或首席技术官。考虑目前在贵公司承担网络安全主要责任的官员。那个人是\
  \ C 级水平吗？网络安全只是该人员目前处理的许多紧迫需求之一吗？如果第一个问题的答案是“否”，而第二个问题的答案是“是”，你可能希望考虑以 `CISO` 的形式创建一个新职位。\n\
  \n董事会还应考虑 `CISO`（或其他主要负责网络安全的官员）的内部汇报结构，以确保该人员拥有在该至关重要的角色中成功所需的独立性和权威。`CISO` 可以向公司的首席信息官、首席风险官、首席运营官、首席技术官，甚至首席执行官汇报——但在任何情况下，`CISO`\
  \ 都应该能够接触高级管理层和董事会。公司管理层还应考虑建立由 `CISO` 主席的信息安全委员会，并邀请 C 级官员参加委员会会议。董事们应该了解谁担任了 `CISO`\
  \ 职位，并根据情况与该人员直接接触。\n\n从董事会的角度来看，有效监督的关键在于让高级管理层负责阐述和监控公司与网络安全相关的战略和风险容忍度。在大多数情况下，董事成员应对公司的网络安全计划保持“参与关注”而非“深度干预”。\n\
  \n董事会可以并且应该发挥关键作用的一个领域是开发与网络安全相关的公司战略计划。在完成初步工作后，董事会应监督公司管理层实施该战略计划。\n\n\n董事会还应与管理层合作制定网络事件“响应手册”，规划出公司应对方案。例如，在\
  \ Uber 丑闻之后，公司可能想要考虑如何应对赎金要求，权衡可能缓解与泄露相关的某些损害的优点，与以这种方式奖励犯罪行为的缺点。任何此类分析都应该足够灵活，以考虑到当时的执法部门的建议以及对公司披露义务的法律分析。为了避免\
  \ Equifax 问题，公共响应计划应指定一个内部和外部专业团队来调查原因并进行适当的披露。\n\n公司管理层可以使用各种框架来制定与网络安全相关的适当风险管理策略。例如，2013\
  \ 年 10 月，美国商务部国家标准与技术研究所（`NIST`）发布了一套关于减少网络安全风险的自愿标准和最佳实践征求意见。最终版本于 2014 年 2 月发布，题为《改进关键基础设施网络安全框架》。\n\
  \n`NIST` 框架包含了五个“功能领域”，董事在为公司制定整体网络安全计划时可以考虑这些领域。这些功能包括：\n\n- **识别 (Identify)**：建立组织理解，以管理系统、资产、数据和能力的网络安全风险。\n\
  - **保护 (Protect)**：开发并实施适当的保护措施，以确保关键基础设施服务的交付。\n- **检测 (Detect)**：开发并实施适当的活动，以识别网络安全事件的发生。\n\
  \n\n\n\n\n**响应**：针对检测到的网络安全事件，开发并实施适当活动以采取行动。\n\n**恢复**：开发并实施适当活动以维持韧性计划，并恢复因网络安全事件受损的任何能力或服务。\n\
  \n鉴于美国证券交易委员会（SEC）对市场的巨大影响力，SEC 的指南也为董事会提供了宝贵的帮助。网络安全一直是 SEC 国家检查计划的重中之重，该计划由合规检查检查办公室（`OCIE`）监督。2017\
  \ 年 8 月，`OCIE` 发布了一份风险警报，强调了其“网络安全 2 号倡议”（Cybersecurity 2 Initiative）的结果。尽管该倡议仅关注经纪交易商、投资顾问和基金——这些\
  \ SEC 拥有主要管辖权的实体——但 `OCIE` 的发现为其他行业的公司董事及其管理层提供了一个模板，可用于评估自身在网络安全方面的努力。\n\n作为网络安全\
  \ 2 号倡议的一部分，`OCIE` 评估了公司在以下领域管理网络安全计划的情况：\n\n2. 访问权限与控制\n3. 数据泄防护\n4. 供应商管理\n5.\
  \ 培训\n\n从广泛的角度来看，`OCIE` 发现，虽然公司在建立网络安全计划方面做得更多，但面对不断变化的网络威胁和攻击，他们在维护和更新这些计划方面做得还不够。例如，`OCIE`\
  \ 注意到几乎所有公司都有应对访问事件的计划，例如拒绝服务事件和未经授权的入侵；然而，受调查的顾问和基金中不足三分之二的似乎未能充分维护此类计划。\n\n###\
  \ 董事的角色\n董事应当将监控公司网络安全努力的工作比对机器的持续维护。需要进行定期的检查和调整，这并不是一项一次性的任务。用于实施和防止网络攻击的技术手段将不断演进。此外，随着公司转向不同的操作系统或扩大其业务组合，旧的战术和系统可能被认为无关或不足。\n\
  \n因此，董事会至少在季度会议上对公司的网络安全计划进行常态化审查是明智的。当出现新的严重问题时，还应有一套程序更频繁地向董事会进行汇报。公司的董事会议记录应准确反映在此类会议上讨论网络安全的情况，以便董事的尽职调查得到记录和证明。\n\
  \n董事会还应定期收到网络安全计分卡，突出公司在缓解网络风险方面的进展，包括外部指标、差距修复、新兴风险、权衡和其他问题。计分卡不需要包含高度技术性的关键绩效指标才能发挥作用。相反，对董事会而言的良好指标示例包括：\n\
  * 客户满意度（由信息安全事件导致的客户系统停机时间）\n* 声誉（媒体报道的信息安全事件数量）\n* 财务（信息安全预算占 IT 预算的百分比）\n\n作为一个重要原则，董事会应确保管理层和公司员工收集、分析并共享有关网络安全事件的数据（无论大小），以帮助了解持续网络安全努力的有效性。公司还应优先收集、分析并内部内部从政府、私人或非营利组织获取的有关网络漏洞和可能暴露的任何信息。\n\
  \n在 `Equifax` 事件之后，所有公司认真审视其信息升级协议都是至关重要的。当可能的网络事件首次被公司雷达发现时，谁会收到通知？通常，初级员工最适合观察网络泄露的初步迹象。在安装关键软件补丁时——例如在\
  \ `Equifax` 的案例中——确保有适当的监督和同行评审系统，以免个人的人为疏误导致灾难性的（且是可避免的）泄露。\n\n董事还应确保公司有一套系统，鼓励员工和管理层从过去的错误中学习。承认错误并从中学习可以带来更好的决策。。在有关公司安全模型和漏洞的简报中，应鼓励进行网络安全事后分析（postmortems）。\n\
  \n当错误发生时，这也是咨询律师的好时机。某些错误伴随着法律责任。例如，公司可能需要向股东披露网络安全风险和不利的网络事件。董事会应确保任何事后分析以及任何由此产生的政策都包含必要的法律应对措施。\n\
  \n每年都有越来越多的上市公司在年度财务披露中将网络安全描述为一种风险。但要披露什么、以及何时披露，对于许多人来说仍然是一个棘手的问题。`Equifax` 因等到\
  \ 9 月才披露其在 7 月底发现的泄露而受到严厉批评。但公司和监管机构都意识到，早披露与等待了解所有实质性事实以避免做出误导性或不准确的披露之间存在着巨大的紧张关系。\n\
  \nSEC 本身也因处理 `EDGAR` 数据泄露时的感知失误而受到批评。SEC 最初报告称没有个人身份信息被盗取；随后不得不修订这些声明。此外，该泄露发生在\
  \ 2016 年，但直到 2017 年 9 月才向公众报告。\n\n公司建立适当的升级协议至关重要。不要浪费宝贵时间等待泄露报告缓慢地层层上报给决策者。相反，在实质性泄露和披露之间的任何时候，都应该花在调查事实和分析问题上。\n\
  \nSEC 在该领域提供了一些指导。2011 年，SEC 公司财务部发布了针对上市公司的有关网络安全威胁和不利网络事件披露义务的指南。该指南建议，如果为了使其他披露不产生误导，则应披露有关网络风险和不利网络事件的实质性信息。\n\
  \n特别是，公司应根据之前网络事件的严重性和频率来审查其网络风险。公司还应根据其特定行业存在的风险，考虑其网络防御的充分性。公司应避免通用的风险因素披露，而应考虑其独特的事实和情况。例如，如果公司*已经*经历过该威胁，那么披露威胁*可能*发生将是不够的。如果与网络风险或事件相关的成本或后果可能对公司的财务状况产生实质性影响，公司还应考虑在其定期文件的管理层讨论与分析（`MD&A`）部分中包含对网络风险和事件的讨论。\n\
  \n虽然 SEC 尚未采取行动，其他监管机构已开始积极执行网络相关的披露义务。例如，2017 年 8 月，`Uber` 就就了联邦贸易委员会（`FTC`）就 2014\
  \ 年的泄露事件提出的指控。FTC 指控该公司在保护客户信息方面的努力上做出了欺骗性陈述，并未能采取“合理的、低成本的措施”来防止对客户个人数据的未经授权访问。同时，FTC\
  \ 确认目前正在审查 `Uber` 对 2016 年泄露的回应，该公司最近才披露了该事件。\n\n\n\n\n联邦贸易委员会（FTC）此前还曾因披露问题对甲骨文（Oracle）提起诉讼，声称该公司未能告知消费者，新的软件更新不会自动删除旧版（且可能被利用的）Oracle\
  \ Java 软件版本。去年，消费者金融保护局（CFPB）命令运营在线支付系统的 Dwolla Inc. 支付罚款并改进其安全实践，此前该公司被指控向消费者误称其网络是“安全”且“可靠”的，并且其数据安全实践“超过”或“超越”了行业安全标准。\n\
  \n此外，尽管目前还没有国家层面的“数据泄露通知”法，但大多数州已经颁布法律，要求在发生涉及敏感消费者和个人身份信息的某些网络安全漏洞时，实体必须通知受影响的个人。\n\
  \nUber 可能是延迟披露和“不该如何做”最极端的例子。该公司在近一年的时间未能通知监管机构和受泄露事件影响的个人，这可能违反了州级通知法。此外，Uber 据称将不披露泄露事件作为向网络犯罪分子支付赎金的条件，这进一步加剧了掩盖真相的形象。几个州的总检察长已经对该泄露启动了调查。\n\
  \n核心教训是，公司绝对必须持续审查其网络披露的充分性和及时性。这没有“一刀切”的答案。经验丰富的披露法律顾问的建议至关重要。\n\n如果说最近的事件教会了我们什么，那就是：如果公司未能确保第三方服务提供商也实施适当的网络风险管理系统，那么公司的网络安全协议将是徒劳。网络犯罪子的切入点往往是拥有公司系统或非公开访问数据的第三方。\n\
  \n例如，Home Depot 仍在受到 2014 年网络安全事件的影响，在该事件中，黑客利用第三方支付处理程序的安全漏洞，盗了超过 5000 万 Home Depot\
  \ 客户的电子邮件和支付信息。黑客在 2013 年同样利用第三方供应商访问了 Target 的客户数据库，并偷了约 4000 万客户的支付信息。\n\n德勤（Deloitte）的案例说明了为什么在涉及第三方网络风险时，公司应该特别关注专业服务公司。专业服务公司——如律师事务所、审计机构和咨询公司——特别脆弱，因为它们的数据库和云计算应用程序通常包含来自许多不同客户和业务伙伴的敏感信息，而这些信息都集中在一个方便网络犯罪分子利用的地方。专业服务公司拥有的信息是网络犯罪分子极具吸引力的目标，因为通过非法交易相对容易变现。此类信息也可能是黑客分子（hacktivists）的有吸引目标。\n\
  \n2016 年“巴拿马文件”丑闻是首批披露律师事务所网络漏洞的重大事件之一。受害的 Mossack Fonseca 律曾帮助数百美国客户建立离岸业务。黑客攻破了\
  \ Mossack Fonseca 追溯到 20 世纪 70 年代的知名客户敏感信息，导致许多与该律合作过的公司暴露在风险之中。我们在“天堂地文件”丑闻中也看到类似的情况发展，该丑闻涉及\
  \ Appleby 律师事务所泄露机客户信息。\n\n由于第三方通常拥有访问高度敏感公司信息的权限，在公司聘佣它们之前，应对进行严格的第三方网络风险评估。董事不需要了解每一份服务合同的具体细节，但他们应该确保公司拥有书面的供应商风险政策，以处理第三方对公司系统和敏感非公开数据的访问。至少，该政策应确保管理层进行适当的尽职调查，并意识到与特定供应商开展业务的风险。公司还应定期评估第三方风险，并确保第三方服务提供商确实履行了其义务。\n\
  \n董事会应意识到向政府提供敏感非公开信息相关的风险。证券交易委员会（SEC）EDGAR 数据库的泄露引发了人们对监管机构持有多少敏感公司数据以及政府其有限资源能否保护此类数据的严重质疑。在可能的情况下，公司应考虑通过加密介质而非安全文件传输提供信息。\n\
  \n网络安全不是一个要解决的问题——它是一个需要持续管理的风险，并在谨慎的情况下进行转移。作为公司风险管理工作的一部分，董事会应仔细审查与第三方供应商的合同和保单。这些协议必须明确在发生泄露时谁负责以及哪些内容在保障范围内。\n\
  \n尽管网络保险仍处于早期阶段，缺乏精算数据，但它是美国公司增长最快的保险类型之一——这不无道理。与网络攻击相关的成本可能会改变公司的命运。Ponemon Institute\
  \ 最近进行的一项研究显示，全球数据泄露的平均成本为 362 万美元。大规模网络攻击的受害者可能会在这一数字后增加几个零，因为声誉损害、通知成本和长期的诉讼费用会迅速增加。\n\
  \nTarget 公司在今年向 SEC 提交的年度报告中报告，与其 2013 年系统数据泄露相关的累计支出已达 2.92 亿美元。\n\n根据该公司的说法，这笔总费用部分被\
  \ 9000 万美元的保险赔款所抵消。同样，2017 年，FedEx 的荷兰子公司遭受了“NotPetya”病毒的袭击，导致运营临时中断，并导致其季度利润遭受了\
  \ 3 亿美元的打击。FedEx 没有针对该攻击的保险覆盖，FedEx 首席财务官此后透露，该事件引发了公司内部对未来是否应该购买网络保险的重新评估。\n\n\
  除了保险理赔这一显而易见的潜在益处外，寻求网络保险可能为公司带来间接利益。进入网络保险市场的公司将激励使用最佳实践，因为保费在某种程度上取决于公司对保护措施的有效利用。单是申请过程就可能要求对公司现有的网络计划进行深度评估。通过这一过程，公司可能会更好地了解自身的网络风险和机会。董事会还应该意识到，在需要时，保险公司通常会提供帮助公司应对网络安全事件并减轻泄露后损失的工具。\n\
  \n\n\n董事会通常对公司是否应该购买网络保险拥有最终决定权。作为董事会，做出这一决定可能需要应对一些新领域。你必须确定哪些是（以及应该是）被涵盖在范围内的，哪些不是（以及不需要）被涵盖在范围内的。你还需要确定特定的保费是否合理。董事会应该问的问题是，现有的保险保单是否可以涵盖某些事件。传统上，大多数商业综合责任（`CGL`）保单不包含网络“免责条款”；然而，如今，保险公司更有可能在保单中加入此类条款。董事会应确保保障范围内没有关键漏洞，并根据公司自身的风险概况考虑哪些保障范围最合理——例如，保障选项可能包括数据泄露成本；勒索；法证分析；盗窃；诉讼费用和开支；以及业务中断等。董事会还应确认其董事和高管人员（`D&O`）保单包含了对网络安全相关事件的保障。\n\
  \n网络安全没有停滞不前领域。黑客攻击不断演变，上个月还是行业标准的防御措施，下个月可能就会过时。立法者和监管机构反过来努力跟上新法律新法规的步伐，这在很大程度上受到重大泄露事件后公众抗议的推动。例如，纽约州对\
  \ Equ 信（Equifax）泄露事件做出了反应，提议监管以扩大该州首创的网络安全规则，这些规则目前要求纽约所有的金融机构必须在州注册并实施保护消费者数据的计划等。新规将将这些要求扩展到信誉报告机构。纽约州总长还提议了新立法，以修订该州现有的数据泄露通知法。值得注意的是，拟议的立法将扩大“隐私信息”的定义，并适用于任何持有纽约州居民隐私信息的实体，即使该实体在该州内没有开展常规业务。\n\
  \n管理网络安全的不断变化的法律格局本身就可能被视为公司的网络“漏洞”。董事会需要意识到公司的合规义务，但这说起来易做起来难。当今公司运行在碎片化的网络安全监管体系中。州、联邦和外国监管机构都有自己的规则和指导。某些州（如加利福尼亚州和纽约州）近年来采取了特别激进的措施，在其司法管辖范围内监管并执行网络安全标准。在联邦层面，如`FTC`和`SEC`等机构在各自指定的重点领域和指导范围内处于网络安全执法的最前沿。欧盟方面实施了其《通用数据保护条例》（`General\
  \ Data Protection Regulation`），该条例对收集欧盟公民信用卡数据或其他个人信息的公司实施了报告和其他要求。\n\n董事会应确保其公司继续遵守最新的网络安全州和联邦法律法规。这对于某些经常被网络犯罪分子针对的行业公司（例如金融机构），以及那些处理敏感个人信息（如个人身份识别信息、财务信息或受保护的健康信息）的公司来说，尤为如此，因为这些公司经常受到监管机构和立法者的审查。董事会的一个显而易见的第一步可能是要求公司总法律顾问和首席信息安全官（`CISO`）定期向董事会简报立法进展并提供他们的建议。鉴于许多律所正在扩大其数据隐私和网络安全业务，公司也可以根据公司的需求，借鉴外部法律顾问的专业知识，制定个性化的计划来管理网络安全风险。\n\
  \n董事会也可以成为对抗“合规疲劳”的有力武器，在这种情况下，执行日常合规职能的人员在应对迥异的日常需求和多个动态目标时，会忽视全局。“。“勾选框”固然重要，但还不够够。凭借其高层次视角和地位，董事可以在鼓励管理层在改进现有流程和网络安全措施方面进行批判性和创新思维方面发挥重要作用。最终，董事会应试图确保公司的大部分精力花在实际的网络安全上，而不是仅仅为了证明合规性。\n\
  \n\n\n\n无法从中心控制与员工和客户的每一次连接——因此，需要一个新的范式。公司的`CyRM℠`计划不仅需要涵盖整个公司，还需要涵盖每位员工。公司中的每个人都要对他们承担的风险负责。这需要一个积极的过程——就像身体健康计划一样，公司采取积极的方法促进健康。`Wellness℠`\
  \ 也是如此：需要在防御、响应和治理的多个维度上做出主动选择。\n\n正如你在前面的章节中看到的，传统的网络安全方法依赖于预防。这种过时的方法假设你的 IT 系统周围有一层坚硬的外壳。它错误地假设网络安全事件是例外——坚硬外壳的罕见穿透——而不是频繁、持续且不断创新的破解数据的尝试。良好的`CyRM℠`\
  \ 计划会说：旧方法够了，是时候践行全面的`Wellness℠`了。\n\n`Wellness℠` 的关键在于公司评估、衡量、监控和控制风险的能力。大多数公司通常关注泄露，这实际上只是评估的一个方面。他们需要拓宽视野，开发诸如风险容忍度等新措施，开发创新的监控技术作为关键绩效指标，并实施更好的相关控制。\n\
  \n为了继续这个健康类比，请考虑近年来，我们看到公共卫生系统试图从被动模式转变为主动模式——关注预防疾病，而不仅仅是在疾病爆发发生时才做出反应。（COVID-19\
  \ 疫情加深了我们的理解，即仅仅被动应对的效果并不好！）\n\n与将事件视为罕见异常相反，一种情报驱动的心态假设公司已经被攻破，因此需要不断进化以保持领先。例如，在我位于山上的房子里，我有多个层次的安全措施。院子周边界有一圈铁栅栏、写着“内有狗”和“受事报报警系统保护”的牌子、光敏泛光灯、连接到每扇门窗的报警系统、隐藏在显眼之外的安全箱，以及床边的恐慌按钮。我的目标是用栅栏、泛光灯和栅栏上的牌子威慑坏人。但如果他们还是决定闯入，那么我有多个防御层次：门、窗户和窗帘都有报警，如果坏人设法在不触发外部报警的情况下进入，还有红外束、恐慌按钮、一只叫声很大的大狗以及隐藏的安全箱。\n\
  \n\n\n我的家庭安全方法——一种动态 CyRM℠ 程序的模拟版本——之所以成功，是因为它是全面的。考虑准备应对攻击的一种方法是被称为“深度防御（Defense\
  \ in Depth）”的方法。这种方法模仿了传统的军事战略。“深度防御”策略并不是将所有资源集中在前线，而是将防御者部署在系列预设的位置——即一系列层次——从那里可以占据优势并攻击进攻的敌人。转化到网络安全领域，“深度防御”策略使用多种安全技术和产品来缓解单个组件故障的风险。“深度防御”还能减缓攻击速度，并为解决问题争取时间。\n\
  \n当连环劫匪威利·萨顿（Willie Sutton）被问及为什么他忍不住抢劫金融机构时，他回答道：“钱在那儿。”网络犯罪分子也是如此。你的公司需要决定哪些数据最有价值，然后投入相应的资金来保护它们。例如，机密客户信息（如社会安全号码）可能是最关键的，应该受到最充分的保护。如果是如此，请将网络安全预算的大部分分配给客户信息保护。\n\
  \n在考虑保护客户数据时，请记住，这不再仅仅是数据被盗的问题——还要担心数据被篡改导致无法使用或错误。这是犯罪分子在公司眼皮底下会做的事，而且可能很长时间才能发现！因此，你的公司建立最有效的策略或策略来保护重要数据至关重要。一旦你确定了需要保护内容的关键性，就可以优先排序并分配资源来避免和缓解网络安全威胁。那时，你就可以决定你的网络安全预算是否合适。\n\
  \n全面掌握其他风险措施（如保险）的条款和条件，并相应了解保险和其他风险缓解措施在什么情况下不会有效，也同样重要。例如，你的公司是客户的信赖顾问。如果你的公司遭受了网络攻击，并因此丢失了顶级客户的高度个人化财务数据，这对声誉的打击可能足以让你的公司倒闭。\n\
  \n聪明的公司理解，CyberWellness℠ 并不是一个待解决的技术问题，而是一项需要持续管理的风险。网络安全无法无法保证，但及时且适当的反应是可以的。考虑到这一点，让我们考虑防范黑客攻击的最佳方法。\n\
  \n\n你的公司应该创建能够兼顾公共关系和法律问题的应急响应计划。应急响应计划有助于识别、响应和从网络安全事件中恢复。应急响应计划的目的是防止服务中断、数据丢失或盗窃等损害，以及防止对组织系统的非法访问。\n\
  \n如果没有一个可以执行计划的团队，应急响应计划就是完整的。团队成员是事件的负责人——他们负责与内部合作伙伴以及外部人员（如法律顾问、媒体、执法部门、客户和其他利益相关者）进行沟通。为了让应急响应团队发挥作用，他们需要高级管理层的支持、持续的测试和清晰的通信渠道。团队需要制定一个响应计划，为这些每个步骤提供结构化的流程：\n\
  \n*   **准备：** 进行风险评估并对安全问题进行优先级排序。识别哪些是最敏感的资产，并以此类推确定团队应该关注的哪些关键安全事件，以控制问题。创建通信计划，并准备相关文档，清晰、简要地概述角色、职责和流程。\n\
  *   **识别：** 当发现潜在事件时，团队应立即收集额外证据，决定事件的类型和严重性，并记录他们正在做的一切。\n*   **遏制：** 一旦团队识别出安全事件，首要目标是遏制事件并防止损害进一步扩大。\n\
  *   **消除：** 团队必须识别攻击的根源，并采取措施防止未来发生类似事件。例如，如果漏洞被利用，应立即进行补丁。\n*   **恢复：** 团队应将受影响的系统谨慎地恢复上线，确保恢复正常。\n\
  *   **教训总结：** 进一步调查事件以识别其是否会再次发生，然后采取措施确保不再发生。\n\n\n健康的 CyberWellness℠ 程序还练习渗透测试（penetration\
  \ testing）——也称为 pen 测试。渗透测试通过恶意攻击者经验丰富的安全专家的视角来观察你的网络、应用程序、设备和物理安全，发现漏洞并识别需要改进的地方。渗透测试不仅限于发现犯罪分子可能如何访问敏感数据，甚至接管你的系统。它还模拟真实世界的攻击，以确定你的防御表现以及泄露的可能规模。此类评估（可能由第三方执行）可以提供对组织整体韧性的见解，这是一个不断变化的目标。\n\
  \n渗透测试不仅仅关于哪里出了问题。它还关于识别合理的权衡——因为你无法保护一切。全面的渗透测试考虑了多个领域：应用程序、网络（包括无线）、弱密码和协议以及物理屏障（如传感器和摄像头）。\n\
  \n正如你去医疗保健提供者那里进行年度体检一样，寻求经过高度培训的安全顾问的帮助来执行安全测试也是明智的。虽然你可能认为自己非常健康，但医生可以进行测试探测你未察觉的危险。同样，制定、维护和监控你安全计划的人可能缺乏识别安全漏洞、理解组织风险水平以及帮助解决和修复关键问题所需的客观性。比喻地说，在这场持续的猫鼠游戏中，偶尔咨询客观的外部专家是明智的，因为鼠既敏捷又狡猾——一直在学习，一直在进化，发明偷取你奶酪的新方法。\n\
  \n\n\n\n\n网络韧性的一个重要组成部分是聘请外部专家和公司，以支持对任何数据泄露做出果断、有效的响应。数据泄露发生后的环境并不是寻找所需专业知识或谈判合同条款的时机，因此拥有一支外部专家团队可以加速恢复和业务的重启。这些外部专家应精通法医鉴定、法律、沟通和系统修复等领域。在事件发生之前，您还应该预先考虑您与执法部门（如\
  \ FBI 及其他机构）的应对方案。\n\n跟我重复一遍：网络安全无法无法保证，但及时且恰当的反应可以。\n\n\n公司需要一个有效的治理结构，以确保员工以及与您合作的每位人员都能进行准确、及时的评估，以识别当前和新兴的漏洞。最好使用外部专业人士来审查您的治理结构。让具备适当技术技能并了解当前风险环境的专业人士参与至关重要。一位精通网络世界的技术导向专业人士可以是一个不可或缺的资源。\n\
  \n## 持续的员工培训与发展\n\n研究表明，三分之二的成功网络攻击直接归因于员工的行为（或不作为）。公司必须确保员工理解网络威胁的多样性及其不断变化的本质。他们需要了解自己的行为如何帮助保护公司资产。因此，提高员工对风险暴露的意识对于加强贵组织的整体网络韧性至关重要。员工意识的任何可衡量的提高——通过游戏化和具有操作性质的持续培训等举措——将极大地增强贵组织保护和应对网络事件的能力。\n\
  \n遗憾的是，大多数员工对自己的个人数字安全并不感兴趣，更不用说公司的安全了。从历史上看，任何与 IT 安全有关的事情都被 IT 团队隔离开用户之外。那么，用户对公司的网络安全几乎完全没有兴趣，难道不奇怪吗？消除这种消极态度是困难的。改变组织的企业文化以加强网络安全是非常困难的。这需要向\
  \ CyberWellness℠（网络健康）范式转变，以跟上不断演变的网络威胁。\n\n想想，用户和员工应该是数据安全的最前线。毕竟，他们是创建和处理信息的人。他们处于理解信息价值的最佳位置。高级管理层应该实施与用户和员工\
  \ `engage` 的互动式培训和问责计划。现代基于游戏的培训——辅以后续监控以观察用户和员工如何应用培训——可以将公司的文化转变为网络安全是每个人的责任。培养和维护一个持续的学习环境是非常重要的——包括相关的且记忆深刻的培训和工具，以支持强大的网络卫生，从密码协议到反钓鱼活动，再到“自带设备”策略。\n\
  \n此外，创建一个安全的环境至关重要，在这个环境中，鼓励各级用户和员工指出弱点和漏洞，而不必担心“打信者会被杀死”。用户和员工需要知道，当他们识别出未缓解的风险或新兴威胁时，他们会获得认可和奖励。你希望他们带给你来“坏消息”，因为如果你不知道漏洞的存在，你就无法防止或修复它们。一种健康的\
  \ CyberWellness℠ 文化会赞扬并感谢这些传信者——而不是杀掉他们。\n\n\n第三方对运营环境可以产生积极影响。然而，公司对第三方网络安全风险的关注程度通常不如对自身业务的敏锐。他们本应该是这样的！第三方可能会产生与公司员工相同的负面长期影响。请考虑，公司与其供应商之间的数据共享和通信已不再完全由公司内部运营控制。供应商和供应商是为公司技术环境创建新入口的外部实体，增加了运营环境的复杂性和潜在的波动性。\n\
  \n以下是任何健康第三方计划的一些基本准则：\n\n*   根据对组织的风险（包括网络风险）优先考虑第三方暴露风险。\n*   为任何新关系的建立建立的评估工具。\n\
  *   实施持续的、基于风险调整的监控流程，以评估对合同条款的遵守情况，并与主要服务商进行联合灾难恢复测试。\n\n法律和其他务实考虑可以（也应该）用于划分和缓解通过第三方关系引入的风险。风险——无论源自哪里——在危机或压力时期都会反回到您的公司。当问题发生时，企业客户和个人客户都会向\
  \ `your` 公司寻求解释和救济。尝试向一个社会安全号码被泄露的人解释，问题来自一个 B2B 供应商。\n\n\n虽然我提到了贵公司为了建立健康且具韧性的网络安全计划需要采取的几个不同步骤，但我想要重申，对公司的网络安全计划感到合理的安全，不仅仅是能够回答像这样的问题：“我们的组织是否有正确的治理结构？”相反，它是要能够回答更大的问题，例如：“我们思考安全的方式正确吗？这一切将向何处发展？”通过在\
  \ CyberWellness℠ 方法中采取主动措施，你将让自己、客户和员工尽可能地保持安全。\n\n\n我们都知道企业文化不会改变得很快——它们会发生迁移。大多数组织发展专家提供同样的文化改变的配方：\n\
  \n1.  选择正确的领导者。\n2.  认可并奖励你想要鼓励的行为。\n3.  传达清晰的价值观。\n4.  提供广泛的培训。\n\n这个配方对于网络安全这个不断演变、变化莫测、不断移动的目标是不起作用的。大多数员工对自己的数字安全并不感兴趣，更不用说公司的。因此，改变公司的文化以加强安全是特别困难的，需要范式转变以跟上威胁格局。\n\
  \n大多数人认为安全是对公司数字环境的保护——即像一个虚拟的硬化外壳，由安全人员保护公司的网络、服务器和应用程序。这种范式的问题在于，当你关注环境时，由于所雇用的安全措施变成了一个目的本身，并且与它试图保护的数据没有直接关系。\n\
  \n例如，假设一家公司试图防御数据丢失或数据的未经授权使用。从安全的角度来看，如果数据本身不是易于读取的，并且根据授权访问者及其所处的业务背景进行跟踪，难道不是好得多？\n\
  \n此外，这种方法通过公司可能作为“深度防御”策略的一部分而实施的多层防御层仍然有效。\n\n\n\n\n\n\n当我们关注焦点从 IT 基础设施转移到需要保护的数据时，第一步是定义哪些是关键数据。一旦定义，你就可以使用新的、经过验证的解决方案来控制数据的处理和分发。\n\
  \n例如，加密可以帮助确保数据在静态存储或动态传输过程中都是安全的。但它并不是万无一失的，因为一旦网络攻击者利用窃取的有效用户凭据入侵网络，加密就会变得无用武处。\n\
  \n数据掩码（隐藏特定数据的过程）是另一个实用的工具。数据掩码可以通过多种方式实现：用户执行请求时动态地遮蔽数据；通过复制数据来消除需要隐藏的数据子集；或者仅仅对用户或第三方进行数据掩码。\n\
  \n另一种控制数据的方法是通过使用数据泄露防护（DLP）解决方案，它可以提供有关敏感数据移动情况的准确信息——并在未授权的终端上发现数据时，甚至阻止其传输或将其删除。使用\
  \ DLP 解决方案对数据进行持续监控可以及时识别漏洞并限制造成的损害。这种范式转变——通过以数据为中心的安全关注数据安全性——将改变你的企业文化。以下是实现方法。\n\
  ### 让用户参与进来\n\n从历史上看，任何与 IT 安全有关的事情都被 IT 团队与用户隔离开。难怪用户对公司的安全性表现出毫无兴趣或完全不兴趣。\n\n\
  事实上，用户是数据安全的最前线。他们创建并处理数据，最能理解数据的价值。案例是：安联爱尔兰（Allianz Ireland）强制用户在共享文档或发送电子邮件之前选择数据分类。该公司公司在短短几个月内经历了快速的文化变迁，导致员工对数据安全实践的意识提高了\
  \ 60%，数据泄露事件减少了 89%。\n\n### 让员工参与培训应用中\n\n如今的网络安全风险培训侧重于钓鱼计划，而不是保护数据。大多数培训计划都不吸引人、不有趣、也不精彩。它们试图用边缘化的是/否问题进行教学，而且通常\
  \ 80% 的问题答案都是“是”。只要回答了所有问题，没有人会不及。太无聊了！现在假设网络安全培训是一个视频游戏，你正在有趣地扮演一个偷取了有效用户凭据并正试图偷取公司数据的坏人。你根据成功偷取数据的程度来获得积分。\n\
  \n这个游戏具有很高的参与性，在课程结束时获得一个分数，如果分数足够高，还可以获得奖励。更好的是，公司现在有了有效数据来确定员工的网络安全意识——这些信息可以帮助购买网络保险。\n\
  \n### 让多样性成为安全文化的一部分\n\n自我意识和自觉是改变任何非预期行为或态度的第一步。员工与安全相关的决策受他们的多样性、背景、对讨论这些问题的开放程度以及对社区的态度的影响。但海报、屏幕保护程序，甚至面对面的小组审查几乎无法影响你的员工判断威胁的能力。\n\
  \n假设发生了数据泄露，并将其作为每个人的学习经验。与其仅仅创建一个 PowerPoint 演示稿，为什么不让员工尝试为公司写一封钓鱼邮件呢？这种方法考虑了员工的多样性以及他们对威胁不同程度的理解。\n\
  \n从长期来看，董事会需要理解并考虑网络安全的战略业务影响，培养关于安全的正确企业文化，并鼓励将网络风险管理实践整合到所有治理和审批过程中。底线是：聪明的董事会明白，网络安全是一个管理问题，而不仅仅是一个技术问题。\n\
  \n\n\n当我开始在花旗银行（Citicorp）工作时，生意是靠握手达成的；你的话被视为信誉。现在的多项调查显示，人、企业和机构之间的信任已显著下降。很容易指出几个破坏公司与其客户、供应商和员工之间信任的主要驱动因素。列在首位的是大规模网络攻击以及创造了即时透明度的社交媒体平台的发展。列表中还包括无数的技术失败，例如\
  \ Google 的某个故障导致婴儿监视器失效并让人们被锁在家里。\n\n在我们快速节奏、匿名的数字世界中，公司产品的信息随处可见。正如一位客户服务专家所说，“客户是带电的且危险的”。坏消息传得比以前任何时候都快。“与众”的竞争优势越来越小。相反，客户对你公司信誉的信任是该领域的新通货——可能是你所拥有的*最*重要的竞争优势。\n\
  \n一次信任的失败在我脑海中格外醒目。当三星 Galaxy Note 7 在 2016 年 8 月首次进入评测周期时，共识是“它可能是史上设计最好的智能手机”。那是在第一部手机爆炸之前，因为电池倾向于同时燃烧。发布一个月后，已有报道至少有\
  \ 35 台手机起火。三星发布了一份谦卑且抱歉的声明，宣布将召回 Note 7 并提供更换设备。好吧，但那些替换设备也开始起火，包括飞机上的至少一台。民航局禁止了所有\
  \ Note 7。如果你那个秋天旅行，可能会记得这件事。最后，三星召回了所有手机，并发布了软件更新使现有设备失效。公司最终决定对爆炸的手机负责并通过更换不同型号进行补偿，这可能救了该公司的声誉。瑞信的分析师估计，这些损失让三星损失了整整\
  \ 170 亿美元。这还未计算他们失去的消费者信任。\n\n同样重要的——甚至更为如此——信任包含了保护个人数据。为了获得业务，每家公司必须通过真正变得可靠来赢得客户的信任。客户会问：“我可以信任网络安全是优先事项，我的交易、信息和个人数据是准确、安全且私密的吗？”良好的客户体验将定义为可访问、无缝、韧性、安全和透明。\n\
  \n未来，信任将变得越来越重要。今天我们生活在一个平台世界。我们拥有 Airbnb 和 eBay 这样的信任平台，它们本质上是低风险环境，鼓励陌生人进行业务交易。我们拥有\
  \ Netflix 和 iTunes 这样的娱乐平台，将信任更进一步。如果你尝试在 iTunes 上购买已经买过的专辑，iTunes 会提醒你已经拥有了它。亚马逊也是如此。亚马逊推出了一个价格检查应用程序，你的手机可以扫描任何零售店中任何产品的条形码，与亚马逊\
  \ 的价格进行比较，如果你从 Amazon 购买该商品，它会给你折扣。\n\n\n\n\n客户不仅可以立即获取价格和最强竞争对手的信息，游戏规则也将发生改变。客户将关注他们与所购商品供应商（如亚马逊）之间的关系，而不是产品的制造商。在透明时代，加之权力向消费者的转移，要求公司更多地关注信任，并将其转化为一种竞争优势。信任将定义公司与其各种利益相关者之间关系的质量和可持续性。\n\
  \n但信任并不仅仅针对消费者。员工的信任对于促进高水平的协作以推动业务结果至关重要。员工会问：“我是否可以信任我的工作相关数据是安全且私密的？网络能够正常运行吗？是否采取了网络安全措施？”这在新的虚拟世界中将变得越来越重要，在那里，管理远程团队需要额外努力，才能让离开总部的员工感到被重视。在我们互联互通的业务环境中，信任定义了公司与供应商之间的关系。随着数据和系统被广泛共享，有效的数据管理将成为帮助客户赢得客户赢得成功的重要差异化因素。\n\
  \n以往的交易和直接关系将让位于问责制，以及对合作伙伴的治理和合规流程与自身流程一致的更大保证之后。维护信任将建立共同价值并创造真正的竞争优势。\n\nTarget\
  \ 进军市场的尝试是一个供应链管理不当的教训，也说明了如何避免进入新市场。这家美国零售商试图在该国同时开设 124 家商店和三个大型配送中心。它使用了一个显然有故障的计算机辅助订购系统，导致仓库积积如山而货架空空。蒙特利尔物流和供应链咨询公司\
  \ MWPVL International Inc. 的总裁 Marc Wulfraat 注意，Target “完全失去了对库存的控制”，如果它进入加拿大时开设的商店较少并能够先测试其分销网络，这种情况就不会发生。该公司在\
  \ 2020 年 2 月宣布，其在“白北方”的艰辛让公司损失了 10 亿美元。\n\n我们从新冠肺炎疫情中看到，信任已经扩展到生态系统合作伙伴。公司会问：“我是否可以信任正在采取措施来保护我的专有信息并确保交易完整性？在业务互动日益虚拟化的情况下，服务水平是否能够得到保障？”此外，受信任的公司将试图平衡所有利益相关者的信任。哈佛商学院教授\
  \ Sandra Sucher 指出，“受信任的公司知道如何平衡所有利益相关者的信任。”疫情期间的一个例子是，一家需要裁雇员工的全球酒店度假村连锁，将其关停团队与其他短期内需要帮助的公司联系起来，以应对激增的需求。\n\
  \n\n当今的商业世界变得日益互联。每天都有新的威胁出现——不仅来自恶意行为者，还来自由于攻击面扩大和通信增强所造成的漏洞。今天，员工可以很容易地从手机或健身手表上被追踪。他们的笔记本电脑可以被黑客攻击，汽车、手表、电视甚至他们的助听器也是如此！更强大的互联网连接正在不断扩大攻击面。从办公室的灯泡到家中的报警系统，再到家电、飞机和起搏器，一切都是漏洞。\n\
  \n数字通信在不断增加功能和控制的同时，也创造了新的漏洞。例如，考虑到你的 `E-ZPass` 可能被执法部门用于开具超速罚单。\n\n大多数人假设 `CyRM`\
  \ 的主要功能是通过消除病毒和黑客带来的危险来降低运营风险。但是时候重新定位 `CyRM` 的真实身份了——它是增长的赋能者。\n\n数字化转型创造了一个竞争日益激烈的环境。敏捷组织可以通过利用尖端技术创建新产品、提供更好的客户体验、创新，并在企业内部快速扩展这些创新来占据上机。因此，业务战略和\
  \ IT 战略将日益且主动地更加对齐。公司如何将其技术投资交织在一起，最终将决定其预判中断和抓住机会的准备程度。构建无边界、适应性强且彻底人性化、能够明确实现规模和战略敏捷\
  \ IT 系统的公司将赢得胜利。\n\n要实现这一点，公司需要重新想象未来的业务流程。他们（你）需要针对多个流程使用相同的技术，这些技术日益依赖平台、生态系统和各种连接数据来驱动人工智能系统。数字化的关键赋能因素涉及云、大数据、移动性和协作。安全需要嵌入到整个业务生态系统中——而且它需要具有足够的灵活性，以适应日常交易所需的数据速度和量，同时能够处理数字世界中威胁的复杂性和多样性。\n\
  \n安全和治理将比现在更加复杂——因为更多潜在的攻击面增加了脆弱性。在开发新产品和服务时，公司需要在创新和风险之间取得正确的平衡。在大多数情况下，安全性越高，产品或服务的用户友好程度和便利性就越低。强大的\
  \ `CyRM` 态势对于确保创新不因安全顾虑而受阻至关重要。健全的 `CyRM` 战略必须促进创新以及客户信任——两者对于持续增长都至关重要。良好的 `CyRM`\
  \ 战略能保持创新和业务运营的轮持续运转。有效的 `CyRM` 还需要增强产品完整性、客户体验、运营、监管合规、品牌声誉和投资者信心。\n\n商业格局正变得日益相互依赖。因此，业务战略侧重于扩大和深化与公司外部资源的联系。公司需要管理一个复杂的利益相关者生态系统：合作伙伴、供应商、投资者和客户。你网络的合作伙伴必须通过与其自身治理和信托流程一致的原则进行选择。如果生态系统的任何一个环节断裂，其他环节也会削弱，业务将遭受损害。采用\
  \ `CyRM` 技术来评估行为，以便在问题造成伤害之前识别它们是重要的。当检测到异常行为时能够自动系统干预的实时监控将成为常态。\n\n接受这些 `CyRM`\
  \ 核心概念并将其与结合了网络安全、业务连续性和企业韧性的“弯而不断”方法的公司将获得竞争优势。我们识别可能损害我们的风险时通常是正确的，但通常会低估它们的速度或强度。提升安全作用的公司将加强客户信任并提高股东价值。\n\
  \n关于 `CyRM` 与业务战略互联的两个例子出现在脑海中：\n\n\n\n\n\n2018 年 3 月，亚特兰大市遭受了名为`SamSam`的勒索软件攻击。这次攻击摧毁了市政府的计算机系统，扰乱了许多城市服务，包括警察记录、法院、公用事业和停车服务。计算机系统关闭了`五天`，迫使许多部门不得不手工完成必要的文书工作。五天！想象一下如果你的系统宕机五小时，你会有多崩溃。尽管服务缓慢地恢复上线，但完全恢复花费了数月时间。\n\
  \n攻击者仅索要了 52,000 美元赎金，但事后统计显示，预计这次攻击的全面影响成本超过了 1,700 万美元。仅聘请应急 IT 顾问和危机管理公司的合同上就花费了近\
  \ 300 万美元。\n\n亚特兰大市勒索软件攻击是一个关于业务连续性规划不足的教训。这一事件表明，该市的 IT 部门对攻击的准备极其糟糕。就在两个月前，一次审计还发现该市\
  \ IT 系统中存在 1,500 到 2,000 个漏洞，而这些漏洞因“过时的软件和由临时或未记录流程驱动的 IT 文化”而进一步恶化。\n\n这就是糟糕的`CyRM℠`导致糟糕业务的例子。现在让我们来看一个互联通性的正面案例。研究显示，40%到\
  \ 60%的小型企业在灾害后从未重新开大门。2017 年 8 月，哈维飓风袭击了德克萨斯州南部，破坏了该地区的房屋和企业。在四天时间里，某些地区的降雨量超过 40\
  \ 英寸。当风暴过去时，它造成的损失已超过 1,250 亿美元。\n\nGaille Media 是一家家小型网络营销机构，它拒绝成为另一家被灾害关闭的小公司。尽管办公室位于办公楼的二层，但当休斯顿湖溢出时，Gaille\
  \ 的办公室被淹没了。洪水严重到在三个月内没有人能进入大楼。公司从未回到大楼，但其运营几乎没有受到影响。这是因为 Gaille 将大部分数据存储在云端，这允许员工在风暴期间及之后进行远程工作。即使办公室被毁，他们也从未失去对关键文件和记录的访问。事实上，在决定搬迁何时，老板最终决定保持公司去中心化，允许员工继续远程工作。如果公司将所有数据都存储在办公室，业务可能永远无法恢复。COVID-19\
  \ 大流行证明了`虚拟世界已经降临，而最终的赢家将是那些实现这一点的公司。`\n\n涉及到企业危机时，人们唯一记得的是结果。良好的结果源于一个经过良好、有纪律的过程，这种过程展示了集体智慧和对纠正结果的承诺。\n\
  \n有效的`CyberWellness℠`和安全计划的特定需求包括：周密的规划、明智授权以及一个监控合规性的系统——这些都应该由董事会进行监督。从长期来看，董事会需要理解并考虑网络安全的战略业务影响，培养有关安全的正确企业文化，并鼓励将`CyRM℠`实践整合到所有的治理和审批过程中。底线是：一个明智的董事会理解网络安全是一个管理问题——而不仅仅是一个技术问题。\n\
  \n拥有有效的企业网络安全策略如此重要，以至于`SEC`很快将强制要求执行。《网络安全披露法案》正在参议院审议，这是一项简单的法案，但将产生深远的影响。其意图是确保公司公开他们为保护自己和客户免受网络攻击而所采取的步骤。\n\
  \n作为向`SEC`提交年度报告的一部分，上市公司必须披露董事会成员“是否在网络安全方面拥有知识或经验”。如果没有，他们将能够引用公司采取了“哪些其他网络安全措施”。要求董事会具备信息安全方面的专业知识在美国企业界将是一个新奇，除了那些已经从事信息安全业务的公司之外。\n\
  \n更具重要意义的是，《网络安全披露法案》将要求董事会承担保护其公司和投资者免受数据泄露、黑客攻击和其他网络威胁的责任。这项立法将网络安全提升至上市公司必须披露的其他风险因素清单中，例如诉讼、高负债水平或劳工问题。\n\
  \n简而言之，在当今技术驱动的世界中竞争并获胜，公司需要做好网络安全工作。\n\n\n许多年前，我曾为花旗银行（Citicorp）制定一项战略计划，期间我我有幸与彼得·德鲁克（Peter\
  \ Drucker）共度了一天。我问德鲁克如何预测未来，他回答说：“预测未来的最好方法就是创造它。”\n\n情景构建和分析是预测未来的完美工具。情景是关于未来的“如果……”的故事，允许我们考虑可能发生的任何事情（无论是积极还是消面的），并帮助我们规划各种应对措施。它们还涉及边界的建立以及决定留在边界之内。这可能会让你想起上一章中的一些风险管理概念。\n\
  \n当我们构建情景时，我们首先列出可能的可能的驱动因素，然后将它们分为两个大领域：我们认为已知的事情和不确定因素。前者通常是能够从过去推断出的趋势。例如，我们可以对人口统计的长期变化做出相当合理的假设。不确定因素包括利率、政治权力的更迭以及尚未预见的创新。良好的情景规划需要对已知和未知驱动因素进行仔细融合。一旦情景的大致参数确定下来，就开始寻找转折点——或称“触发线”——通过监控这些触发线来判断当天的事件是否会引发导致情景实现的连锁反应。\n\
  \n一个关于第三次世界大战的情景可能如述所示：\n\n2021 年，在华美之间因疫情传播导致紧张局势升级一年后，中国镇压了香港。美国对所有中国出口产品实施了严厉的制裁，导致中国经济出现负增长。针对政府的社会动荡蔓延到中国大陆。国际机构无法将中美带到谈判桌。中国试图夺取南海中一些长期存在争议的岛屿。一场酝酿中的危机在几次事件后稳步升级，但转折点是台湾，它宣布从中国独立。中国随后入侵台湾，并对一艘援助台湾的美国航空航母发射了弹道导弹齐射。一艘主要战舰及其船员的损失激怒了美国采取行动。美国对台湾的中国陆军进行攻击，并阻止了这些部队的增援和补给，最终迫其投降。随着局势升级，美国同时攻击了中国的空空部队以及作为储备的舰只和飞机。也许你还构建了一个日本和朝鲜爆发冲突的情景。\n\
  \n即使情景并不一定具有预测性，它们也可以在事件改变它们之前，挑战我们对世界的现有观点。通过这种方式，它们为我们提供了触发线，当我们偶然遇到这些线时，就像减速带让我们意识到速度一样，它们引导我们考虑如何受到未来事件的影响。\n\
  \n\n\n\n在上述场景中，如果中国是我公司主要的零部件供应商，我显然会担心我的备用供应链。如果中美之间的紧张局势升级，韩国可能不会是我的“首选供应商”。我还会监控首尔和东京之间的关系（到目前为止他们一直是敌对的），因为在朝鲜干预的情况下，如果首尔和东京都站在美国的一边，中国可能会花更多时间克制平壤，而不是支持其参与冲突。\n\
  \n我在花旗银行（Citicorp）工作时，我们会监控高净人士资本的本地流动。资本从新兴市场流出预示着问题的开始——毕竟，只有该国家的人才最了解这一点——并预示了该国货币最终的贬值。如果我们等到当地政府采取行动，而不是自己监控资本流动，那么等到反应时已经太晚了。现在对未来不做任何事情往往会产生最高风险。“触发线”能让你在事件开始左右你之前采取主动行动。\n\
  \n\n每当我听到有人说他们看到了“隧道尽头的光”时，我的第一个想法是那可能是迎面而来的火车车灯。也许矿井比隧道是一个更恰的比喻：我们正在黑暗中前行，寻找黄金。我们不能仅仅根据我们看到的或自认为知道的来对未来做出决策。现实中，我们的决策总是基于不完整的信息——这只是我们当时手头拥有的最佳信息。因此，我们必须学会管理与不完美的决策过程相关的风险。我们可以将决策过程分为四个步骤：形势评估；游戏规则；做出决策；事后重新评估。\n\
  \n\n了解你所处何地非常重要。在设定目标和管理风险之前，必须对你当前的状况进行清醒、彻底的评估。然而，我们感官本身的局限性使我们无法意识到周围发生的大多数事情，而这在大多数时候是一件好事。想象一下，如果我们能听到身体内细胞不断分裂的声音——那阵轰鸣会会震聋我们的耳朵。事实上，清晰思考的能力似乎依赖于某种程度的感官剥夺。正因如此，我们大多数人在工作时都会避免噪音。从更广泛的意义上说，我们每天开始时的第一个感觉是周围的环境。尽管这个过程可能在潜意识中发生，但我们的眼睛首先接收卧室熟悉的景象，从而确立我们的位置。这似乎是我们的大脑在告诉我们，为了知道我们在做什么以及可能去去哪里，我们必须首先知道自己在哪里。起初，这看起来可能是一个矛盾——即，一个人可以同时关注短期事件和长期计划的想法——但我们的生活充满了不一致性。秘诀在于知道在时机合适时改变你的视野，先研究细节，然后退一步观察大局。毕竟，没有细节，大局根本就不存在。\n\
  \n（注：原文中存在大量重复段落，此处译文已保留唯一逻辑内容）\n# 游戏规则\n\n了解你所处何地非常重要。在设定目标和管理风险之前，必须对你当前的状况进行清醒、彻底的评估。然而，我们感官本身的局限性使我们无法意识到周围发生的大多数事情，而这在大多数时候是一件好事。\n\
  \n\n（注：原文在此处中断）\n\n\n\n\n第三，重要的是要理解 `风险就是信息的缺失。` 我们所做的每件事都存在风险，因为我们不可能知晓一切——在任何情况下，总会有信息的缺失。没有比新冠肺炎（COVID-19）疫情更能体现这一点的了。你是否应该戴口罩？你每周应该去买几次食物？鉴于这一新现实，你应该如何投资你的退休资产？每个决策都存在权衡。没有一个适用于所有人的标准答案。风险是个性的。多年来，我经常对客户说，当所有人都失业时，那是衰退；当你个人失业时，那是萧条。你必须对自己的日常行为、财务选择，以及影响你、你的家庭、你的社区并间接影响整个国家的选择，进行你个人的风险/收益分析。\n\
  \n做出艰难的风险决策就像亲吻响尾蛇。这绝不好玩，而且可能是致命的。但你越是系统地考虑什么对你来说真正重要、缺失了哪些信息、集体智慧在告诉你什么——并且承诺评估“相对于对我真正重要的事情，我的下行风险有多大”——你的决策就会越好。尽管这可能令人不舒服，但经过深思熟虑和仔细评估风险，总比完全不考虑要好得多。如果你得出结论认为需要帮助做出正确的决策，请尽早寻求协助。让专家来帮助你。\n\
  \n最后，在危机结束后，人们只会记住你做出的判断和你取得的结果。没有人会因为你的善意而给你荣誉——只有最终的结果。最好的结果是一个深思、有纪律、有序的过程的结果，这个过程包含了集体智慧以及对确保正确的强大且高度专注的意图。\n\
  \n\n这里也适用常识。持续监控结果并从错误中学习，以便你将来能做出更好的决策。日本的 `kaizen`（改善）哲学，或持续改进，正是基于这种方法——通过微小的、渐进的改变来实现个人目标。例如，多年前，我曾向某慈善机构捐赠了一笔数额较大的资金，并理解这笔钱将用于启动一个我很关注的特定项目。大约一年后，我发现该慈善机构根据他们自己的计划花了大部分资金，几乎完全忽略了我的指示。我与一位积累了巨大财富的朋友吃午饭时，苦地讲述了发生的一切。“这都是你的错，”她说，“你没有很好地传达你的愿景，你没有设定里程碑，你没有根据这些里程碑监控慈善机构的进度，而且考虑到你的专业知识，你本应该知道更多。”我在重新评估我的慈善决定时没有运用常识。\n\
  \n专家预测的不可避免事件——流行、地震、干旱、海平面上升和其他灾难——需要长时间才会发生，但当它们发生时，速度会非常快。场景构建（Scenario construction）是良好的实践，也是对不可避免事件发生的准备。此类练习将让你对可能可能发生的情况有一个良好的感知，这样你可以在过程中做出更好的决策。\n\
  \n\n目前使用的安全产品存在许多问题。许多杀病毒解决方案仅对已知威胁有效。平均每天会产生 350,000 种新的恶意软件变体。依赖已知恶意软件解决方案是一场无休止的、没有赢家的追逐游戏。此外，许多解决方案检测和修复攻击的时间太长。泄露的持续时间直接影响损害程度。如果你好奇的话，波波研究所（Ponemon\
  \ Institute）得出结论，2019 年识别并持续入侵的平均时间为 279 个受影响天。进一步，更复杂的解决方案使用了依赖于历史经验的 AI 算法。尽管机器学习在检测广泛范围方面非常准确，但在检测从未见过的内容时效果并不理想，看起来安全产品似乎总是落后一步。\n\
  \n此外，新兴技术往往会产生以前未遇到的新风险，并增加现有风险的复杂性。这些风险的互联性意味着需要同时处理，而不是孤立地处理。例如，公司对互联系统依赖的增加将放大故障的影响并威胁韧性。将人工智能更进一步，由于算法与社会、伦理、文化或法律规范不完全一致，将导致声誉、法律和监管方面的后果。例如，在某个网站的程序化广告在不内容旁边投放广告后，许多组织从该网站撤销了他们的广告。\n\
  \n机器人（Bot）是程序化执行特定任务的软件应用程序。机器人是自动化的，这意味着它们根据指令运行，不需要人类用户启动。机器人经常模仿或取代人类用户的行为。通常，它们执行重复性任务，而且执行速度比人类快得多。恶坏机器人被设计为破解用户账户、在网络上扫描联系信息以发送垃圾邮件，或执行其他恶意活动。机器人已用于通过过度访问和权限获取大量机密数据，放大了网络事件的损害。\n\
  \n自然语言生成工具和技术将能够对非结构化的“大数据”进行处理、分析和理解，公司将借此更有效地更主动地运营。然而，虚假信息的大规模也将成为可能，并以多种方式呈现，包括利用社交媒体影响舆论；通过付费在线评论创建虚假趋势；传播看起来真实的假照片/视频；以及基于错误的认知鼓励不正确的金融交易。\n\
  \n\n考虑到这些潜在威胁以及实际发生的事件，想象这样一个涉及人工智能的潜在场景，以理解其可能性，以及在 `CyRM℠` 方面应该关注的重点。\n\n\n\n\n\
  信不信由，真实发生的事件是几个已知案例，其中犯罪分子接管了超过百万台计算机。已知最大的僵尸网络是`Bredolab`，包含超过 3000 万台计算机。它由一个黑客网络创建，通过将被劫持计算机的时间租租给其他犯罪组织来获利。在巅峰时期，它每天能够发送超过\
  \ 30 亿封被感染的邮件²。\n\n现在考虑以下场景³\n\n\n基于此场景的事件，你会监控哪些内容，你会采取哪些潜在的管理行动举措？例如，作为第一步，监控这些攻击并了解你针对需要保护的更重要资产的脆弱性并并不困难。其次，也许可以聘请网络过滤服务，扫描表现出异常行为的网站，并阻止你的用户访问这些网站。或者，也许可以统一使用\
  \ `Google Chrome` 或 `Mozilla Firefox` 以外的浏览器，这两种是流行的浏览器（因此大多数恶意软件都是针对它们编写的）。同样，从四个步骤来思考决策过程是非常重要的：评估状况、制定规则、做出决策以及事后重新评估。记住，犯下“积极性错误”（即你研究了问题，考虑了所有替代方案，但走错了路）远比“消极性错误”（即你甚至没有考虑过潜在的问题要好）。\n\
  \n## 注释](#R_sec10_9)\n\n# 结论](#R_chapter11)\n\n在如今太多的公司中，参与网络安全是事后考虑的，被拼凑在人们每天的工作之上，以期创造一个安全的环境。我们都知道这种方法行不可通的。网络安全并没有被视为一个业务问题，然后与业务需求对齐。此外，没有人在网络安全领域采取进攻策略——只有防守，而且公司正关注着他们无法控制的昨天的问题和威胁。我们都知道，真正的失败往往没有被用作学习经验，也没有获得足够的关注来产生改变。\n\
  \n更进一步，董事会和 C 级高管错误地认为合规性会拯救他们，但实际上，合规并不等同于适当的保护水平。遗憾的是，对于“我的公司安全性足够吗？”这个问题并没有简单的答案。高管决策与网络安全领域的\
  \ IT 专业人员之间也存在真正的脱节，这本应该让更多人彻夜难眠，因为每一个新的估算都增加了新威胁的水平。网络安全不仅仅是一个必须正确的重要问题——它是一个“必须做对”的问题。心态必须发生转变，从对打昨天的战争转变为识别并准备应对今天和明天的威胁。\n\
  \n真的需要一支拥有各种角色和职位的“军队”才能提供适当的 CyRM℠。对于不同的人来说，有许多角色：董事会、C 级高管、`CISO`、IT 员工、风险管理人员、审计师以及公司的每位员工。这是一支由来自不同背景、财富和受教育经历的人组成的军队，但每个参与者都有一个共同目标，这就是它运作得如此良好的原因。\n\
  \n我们在网络安全领域都缺少一个共同目标：对 CyRM℠ 的真正承诺。\n\n\n\n\n\n`Roel C. Campos` 是华盛顿特区 Hughes Hubbard\
  \ & Reed 律师事务所的合伙人，并担任证券执法执行部门主席。Campos 先生的业务范围包括为高级管理层和董事会就其最敏感、复杂的问题提供建议。他的工作通常涉及开展内部调查，以及针对金融监管机构（如\
  \ `SEC`、`DOJ`、`CFTC` 和 `FINRA`）的案件辩护。他还就网络安全、治理、加密货币以及金融监管机构拟议的规则等事项向董事会提供建议。\n\n\
  2002 年，Campos 两次被乔治·W·布什总统任命，并经美国参议院确认担任 `SEC` 委员，任职至 2007 年。\n\n在任命 `SEC` 委员之前，Campos\
  \ 先生曾与合伙人一起从事风险投资，并担任过高管，运营过一家广播公司。\n\n在从哈佛法学院毕业后，他在洛杉矶的大型律师事务所工作过。Campos 先生还曾在洛杉矶的\
  \ `U.S. Attorney’s Office` 任职。他起诉过大型毒品贩集团，并在一次著名的审判中，定罪了数名集团头目因绑架和杀害一名 `DEA` 特员。\n\
  \n`David X Martin` 是网络安全专家，曾与 `FBI` 及大型企业共同主持一项关于情报共享和最佳实践的公私合作倡议；曾就 `以色列中央银行` 的金融机构网络安全审计提供咨询；担任一家上市公司信息安全委员会主席；担任\
  \ `Oliver Wyman` 的网络安全高级顾问；并发表了许多关于管理网络安全创新方法的文章。他是网络安全咨询与开发公司 `cybXsecure` 的联合董事。\n\
  \nMartin 先生是公的风险管理和估值问题专家，在投资策略与运营、定量研究、交易所以及交易台监管方面拥有丰富经验。他是`投资公司协会（Investment\
  \ Company Institute）风险委员会`的创始人和`买方风险委员会`的共同主席。他是一位资深金融高管，40 年的职业生涯包括在`普华永道 (PWC)`、`花旗银行`和\
  \ `AllianceBernstein` 担任高级职务，在这些机构中他曾担任过首席风险官以及 `Sanford Bernstein LLC` 的董事。\n\n\
  Martin 先生还是`纽约大学 (NYU)` 和`福特汉大学 (Fordham)` 商学院的客座教授，2010 年秋季由`McGraw Hill` 出版的《风险与精明的投资者》(Risk\
  \ and the Smart Investor) 以及 2012 年由`Amazon` 出版的《风险的本质》(The Nature of Risk) 的作者。他还发表了许多关于网络安全、合规与风险、企业风险管理以及公司治理的白皮书。\n\
  \nMartin 先生担任`美国国务院国际经济政策咨询委员会`下`制裁小组小组`的成员，并担任`金融稳定中心`负责网络安全和新兴风险的特别顾问。\n\n## 引言\n\
  \n本文档的目的是为董事会提供一套“指导原则”，以便能够实施有效的网络安全计划。\n\n董事应当理解其公司面临的全方位网络风险，并鼓励管理层根据公司的运营环境、风险状况和长期目标制定定制的策略。\n\
  \n任何有效网络安全计划的特定需求包括周密的规划、精明的授权以及监控合规的系统——而这些都是董事应该监督的。这不再是公司是否会受到攻击的问题，而是这种情况何时发生的问题——以及组织将如何防止其发生。智能网络监控、早期预警指标、多层防御以及从过去事件中汲的教训都是真正的网络韧性的关键组成。当问题出现时（无论是重大还是轻微），快速识别和响应问题的能力将决定公司的最终恢复。\n\
  \n网络安全无法得到保证，但及时且恰当的反应可以。\n\n从长远来看，董事会应该理解并考虑网络安全对业务的战略影响，培养围绕安全的正确公司文化，并鼓励将网络风险管理实践整合到其他治理和审批过程中。本质上，董事会应该将网络安全视为一个管理问题，而仅仅是一个技术问题。\n\
  \n\n1. 识别组织可能受到网络攻击影响的核心资产（“皇冠宝石”）。\n2. 识别哪些网络风险需要规避、哪些需要接受、哪些需要缓解。\n3. 针对每种方法制定具体的计划。\n\
  \n网络安全中没有进攻性策略——只有防御性策略。此外，人无法保护一切。因此，董事成员首先要确定哪些资产最有价值，其次要采取最有效的策略或多种策略来保护这些资产。一旦董事确定了需要保护资产的价值，就可以进行优先排序并分配资源。\n\
  \n定义组织的风险承受能力是一项复杂的挑战，因为它要求所有人员对以下项目充满信心：\n\n* 了解自己的信息资产清单是完整且实时的；\n* 确定用于优先考虑这些资产价值流程是准确且恰当的；\n\
  * 理解保护最重要资产（例如“皇冠宝石”）所采取的关键行动的有效性；\n* 全面掌握其他风险缓解项目（如保险）的条款和条件，并相应了解保险和其他风险缓解努力在什么情况下无效；以及\
  \ 深度理解在发生网络事件时将触发的业务响应和连续性计划的规模和稳健性。\n\n上述列出的五个元素代表了“风险承受能力”计算中的部分组成元素，董事和高级管理层需要持续进行这些计算。前三项对董事来说至关重要，确保他们知道管理层为保护最有价值的资产投入了哪些计划、投资和资源，因为这些资产的被窃、未经授权的访问或损坏可能代表生存风险。\n\
  \n后两项也作为输入纳入能力计算，因为缓解行动（如第三方网络保险和远程备份设施）的成本和收益同样重要。这些传统的风险管理活动在组织评估其承受或“度过”预定义类型的业务连续性事件的能力方面起着重要作用。\n\
  \n业务连续性框架可以帮助对网络入侵发生后需要恢复的资产优先级获得洞察。当然，任何“预定义”的事件估计可能与现实情况不符，但组织可以使用频繁的模拟攻击，以识别并评估其他“非关键”资产是否从从风险缓解的角度得到了适当的评估。\n\
  \n\n\n\n为了履行这一关怀责任，董事必须能够证明他们以合理的常识方式履行了对网络安全的监督职能。为此，董事应定期收到 `CEO` 和 `CISO` 的评估和保证，确保整个组织（即不仅仅是技术部门）正在执行的工作高度聚焦于保护核心资产和其他高优先级资产。这些工作计划应涉及功能分段、稳健的身份访问管理以及更高层次的员工培训，以及网络和端端的领先安全实践。\n\
  \n此外，承认错误并从中吸取教训会导致更好的决策。在关于公司安全模型和漏洞的简报中，应该鼓励进行网络安全后审查。对网络安全问题的妥善考虑和参与是不可替代的。\n\
  \n当然，在开发新产品和服务时，公司需要在创新和风险之间取得正确的平衡。在大多数情况下，安全性越高，产品的用户友好性和便利性越低。应该进行网络筛选的流程包括战略规划、`M&A`、产品开发以及资本分配和预算。即使是\
  \ `HR` 流程也应该具有网络过滤器，以了解招聘、领导力培养和网络资源留存策略。\n\n## II. 董事应将网络安全视为战略性和管理问题，因此应让管理层对建议和实施整体网络风险管理策略及政策负责。\n\
  1. 管理层应对报告其行为和网络违规负责。\n2. 在适当的情况下，董事会应要求关键执行人员证明网络安全计划的某些重要方面已经执行。\n3. 提高员工意识和培训至关重要。\n\
  4. 对网络漏洞进行第三方测试可以提供高程度的威慑力。\n5. 董事会应维持一个外部专家团队，以便在培训和危机情况下提供服务。\n\n董事必须通过更广泛的视角来理解安全，而不仅仅是信息技术（`IT`），因为因为对公司的潜在损害可能是毁灭性的。\n\
  \n网络安全风险需要 `C-level` 问责和董事会的监督，以推动议程并管理具备正确技能的受权员工。\n\n与负责的公司官员就网络风险管理的讨论，应在董事会和董事委员会会议议程中获得定期且充足的时间。\n\
  \n负责人员的领导技能——沟通和危机管理——应该得到同等的考虑，因为它们通常比技术技能更重要。显然，在技术的日常管理或危机时刻，拥有一位高明的领导者比拥有一位领域专家要好得多。\n\
  \n董事会还应根据他们完全理解的术语（和语言）建立自评估框架，以确保实施了行业最佳实践并取得了实际进展。对结果的强关注应取代纯粹基于活动的报告。\n\n董事需要通过鼓励管理层各层级与下属之间的适当互动，促进稳健的网络安全状态和韧性。\n\
  \n据记载，大约三分之二的成功未经授权网络攻击直接归因于员工的行动（或不采取行动的行为）。\n\n因此，提高员工对网络风险暴露的意识，代表了增强组织整体网络韧性的重要机会。\n\
  \n通过如游戏化和持续培训等具有操作性质的倡措对员工意识进行任何可衡量的改进，将对实体保护和响应网络事件的能力产生高度的增益。\n\n从董事的角度来看，接收对真实和模拟事件响应事件的深度分析和评估非常重要，这些评估应详细描述上述三个之外各职能团队之间的互动。此类评估（可能由独立的第三方执行）将提供对整体网络韧性的见解，而这种韧性充其是一个不断演进的目标。\n\
  \n网络韧性的重要部分包括与外部专家和公司建立关系，以支持对数据泄露做出更果断的响应。泄露后的环境不是寻找所需知识或谈判合同条款的最佳时机，因此拥有一个“随时待命”的外部资源团队可以加速恢复和业务重启。这些外部专家可以包括调查、法律、通信和系统修复等。在事件发生之前，还应考虑与执法部门（`FBI`\
  \ 等）的处理方法。\n\n\n1. 确保网络安全在三道防线内管理，以及\n2. 确保网络安全基于对收集的情报的持续反应，并促进对变化的风险环境的适应。\n\n\
  \n网络安全需要一种超越信息安全小组唯一关注的方法。首选方法是三道防线模型。第一道防线“风险识别和评估”是业务部门和信息安全团队的责任。因此，他们对拥有、理解和管理网络风险负直接问责，并让董事了解他们的风险评估情况。\n\
  \n第二道防线“风险管理”是公司风险管理团队的责任，从战略业务角度就威胁的潜在影响、优先事项确定以及资源分配提供职能监督。风险管理团队还应对对第一线的网络风险方法提出建设性的战略业务挑战，确保建立了正确的政策和程序，并确保网络安全有效整合到运营和企业风险中。同样，应向董事会提供风险管理有效性的定期报告。\n\
  \n第三道防线“风险监控”是内部审计的责任，为董事会和高级管理层提供企业网络风险治理有效性的保证。\n\n这三道防线应由一个活跃、投入的董事会指导，由董事会批准并监督公司的网络安全方法，批准战略决策和优先事项，同时对管理层提供可信且有效的制衡。\n\
  \n\n传统的安全方法依赖预防策略。它使用基于异常的方法处理事件响应。相比之下，情报驱动的心态基于这样假设：公司已经遭到了入侵，因此有必要不断演进，以便在情报和事件方面保持领先。\n\
  \n\n\n\n自适应安全架构允许基于以下因素对安全相关问题进行决策：准确的威胁建模、可量化的资产估值，以及考虑安全措施或流程的威慑因素及其成本的“假设性”情景。正确的情报驱动方法基于先前的经验、当前的威胁情报、对影响过其他公司的泄露事件的理解、趋势、资产估值以及对保护这些资产的防御措施进行持续分析（包括在控制失效时）。\n\
  \n董事会还应鼓励对访问管理、人工智能和分布式数据的新技术进行审查，这些技术可能会增强公司的网络防御能力。\n### IV.董事会应理解公司对第三方供应商的风险。\n\
  \n第三方对运营环境可能产生影响，因为董事会和公司对第三方网络安全风险的敏锐程度通常不如对自身业务的风险那样敏锐，尽管第三方可能会产生同样不利的长期影响。\n\n\
  专注于通过核心竞争力来实现使命的组织，将利用其他提供商和合作伙伴的优势视为关键且可行的商业战略。公司管理着数百、甚至数千个供应商、第三方提供商和其他类型的外包安排。这些外部实体通过在公司的技术环境中创建新的切入点，成为增量风险的主要来源。数据共享和通信不再完全由组织的内部运营控制，为运营环境增加了复杂性和潜在的波动性。\n\
  \n法律和其他务实考量可以（也应该）被用于划分和缓解风险；然而，风险无论源自何处，在危机或压力时期都会转回到公司身上。客户（企业和个人）会直接向与其开展业务的公司寻求解释和救济。\n\
  \n许多组织在供应商管理方面处于“追赶”状态。建立完整的供应商关系清单的能力显然是整体计划中的“入场券”（table stakes）。第三方计划的基础应包括以下内容：\n\
  \n*   所有第三方合同的完整且全面的清单\n*   根据对组织的风险（包括网络风险）对第三方风险进行优先级排序\n*   为任何新关系的入驻建立清晰的评估工具\n\
  *   建立持续的、风险调整的监控流程，以评估合同条款的执行情况\n*   通过服务组织控制 (SOC) 报告对供应商实践进行第三方评估\n*   与主要服务提供商进行联合灾难恢复测试\n\
  \n这些活动应产生可操作且及时的董事会报告；利用技术驱动的供应商管理解决方案也是一种最佳实践。\n\n一种新兴趋势是进行第四方评估，以了解哪些活动被进一步外包导致了网络安全风险状况的改变。\n\
  \n对于网络安全风险，“风险调整”不再纯粹基于金额的过滤，例如基于合同的财务规模。随着廉价应用以及其他专门但高效工具的普及，以完全捕捉关系的风险状况），必须使用其他过滤器来理解对组织的影响。\n\
  \n一个强大的第三方供应商管理计划不仅能加强网络安全风险管理——它还能支持支出决策、签约策略、服务水平和其他关键运营活动，以支持核心业务目标的实现。\n\n\n\
  A. 董事会应与管理层共同定义网络安全的适当行为，并清晰地展示组织对其的重视。\n\n风险是通过共享组织价值观、信念和态度将所有风险承担和风险管理方面结合在一起的胶水。通过意识和刻意规划，可以主动影响风险文化以增强组织的水平。网络安全也不例外；鉴于绝大多数网络风险最初可以追溯到人员及其行为，而非技术，建立强大的文化是任何计划的不可或缺组成部分。\n\
  \n然而，大多数员工对自己的数字安全并不感兴趣，更不用说公司的了。从历史上看，任何与 IT 安全有关的内容都被 IT 团队排除在用户之外。用户对此表现出无兴趣。\n\
  \n但实际上，用户应该是数据安全的前线。他们创建并处理信息——因此他们最适合理解其价值。董事会应要求管理层开发与用户互动的培训和问责计划。使用现代游戏化培训并在随后监控用户如何应用培训，有助于将公司文化转化为每个人关注。\n\
  \n考虑到不断变化和快速演变的网络环境，嵌入强大的网络风险文化为员工在政策尚未起草或更新时提供了指导其活动的原则和价值观。具体的指导可能并不总是可用、相关或能被记起。强大网络安全文化的指标包括：\n\
  \n*   清晰简洁的网络安全策略框架，反映了组织所面临的风险和不断演变的运营环境\n*   董事会和领导层的议程中突出包含网络安全\n*   网络风险不是以孤立的方式管理的——关于网络的讨论被织入所有管理过程中，例如新产品审批、并购尽职调查和第三方外包安排\n\
  *   持续的学习环境，包括相关且易记的培训和工具，以支持强大的网络卫生，从密码协议到反钓鱼活动再到“自带设备”(BYOD) 政策\n*   存在一个安全的环境让员工提出风险或问题，员工需要知道，当他们识别出未缓解的风险或新兴威胁时，他们会获得支持\n\
  \n强大网络安全文化的另一个标志是组织中的没有任何人可以例外，包括董事会。董事会应通过参加公司网络安全培训、避免使用个人邮箱处理公司业务以及保护（物理和电子）机密信息，展示他们对强大网络安全实践的了解。\n\
  \nB. 董事会需要理解网络风险与其公司特定情况相关的法律和监管影响，包括他们的信义责任和整体法律格局。\n\n\n\n\n\n过去一年左右，影响 `Deloitte`、`Equifax`、`Facebook`\
  \ 等许多机构的知名事件提醒着我们，泄露风险以及对这些事件的响应会多快地影响一家公司的声誉。敏感客户和公司数据及系统的泄露将引起股东和监管机构的严厉审查，并对公司的运营以及股价构成重大风险。此外，根据证券法，董事是“守门人”，有责任防止违规行为以保护股东。\n\
  \n当然，董事负有勤勉、忠诚和诚实的信义义务，以确保保护公司资产（包括客户信息）以及公司声誉和股东价值。这包括确保存在一个满足法律要求的有效`Cybersecurity\
  \ Program`网络安全计划），并维持多层安全措施，保护敏感信息免受未经授权修改、破坏或披露（无论是无意还是故意的）。为了履行职责，董事应定期安排由 `General\
  \ Counsel`（总法律顾问）和/或外部律师提供的简报，向董事通报网络安全对联邦、地方和州法律的影响。\n\n## 结论\n\n网络攻击后的公众监督以及监管机构已使网络安全成为董事会的议题和核心责任。在危机时刻，人们在做出判断时唯一记住的是结果。良好的结果通常是一个经过深思熟虑、有纪律的过程的结果，这种过程展示了集体智慧以及对纠正结果的承诺。\n\
  \n董事会议是公司董事重新评估其在管理网络安全风险方面行使治理职责的良机。在当今全球的网络雷区中，董事会不仅要监控表现，还要激励在该领域追求卓越。\n\n##\
  \ DCRO 网络风险治理指导原则\n\n**原则 1：** 董事应将网络安全视为企业风险的重要组成部分，并对其进行监督：识别公司可能受到网络攻击威胁的核心资产，确定需要避免、接受或缓解哪些网络风险，并针对每种方法制定特定计划。\n\
  \n**原则 2：** 董事应将网络安全视为战略性和管理问题，因此应要求管理层对建议和实施整体网络风险管理策略及政策负责。\n\n**原则 3：** 董事应受网络安全的两个广泛概念指导：确保其在“三道防线”内进行管理，并根据收集的情报和变化的风险环境做出反应和调整。\n\
  \n**原则 4：** 董事应理解公司对第三方供应商的风险敞口。\n\n**原则 5：** 董事应致力于培养一种高度重视网络安全的企业文化。\n\n## DCRO\
