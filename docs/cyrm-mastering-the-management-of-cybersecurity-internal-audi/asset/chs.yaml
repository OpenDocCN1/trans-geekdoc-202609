  \nHughes & Reed\n纽约合伙公司\n纽约 2017\n\n读者注意，过去的业绩不代表未来。本广告的任何内容均未获得最高法院批准。有关选择过程的信息，请访问\
  \ [`www.hubbard.com/legal-notices`](https://www.hubbard.com/legal-notices)。\n\n\
  ## 引言\n\n2017 年 9 月 7 日，美国最大的信用监控机构之一 Equifax 公司（Equifax Inc.）宣布，其 1.43 亿客户的账户遭到入侵，这可能是迄为止对美国消费者影响最严重的网络攻击。\n\
  \n在 Equifax 丑闻期间，美国证券交易委员会（“SEC”）也披露了一些引人注目的内幕信息。新任 SEC 主席杰伊·克莱顿（Jay Clayton）于 2017\
  \ 年 9 月 20 日宣布，SEC 自身的 EDGAR 文件系统在几个月前已被网络罪分子渗透，这引发了人们对系统安全性以及拥有敏感非公开信息的人员可能进行内幕交易风险的担忧。\n\
  \n近期其他高知名的网络攻击也层出不穷。令热门剧集《游戏之王》粉丝遗憾的是，HBO 电视网络在 2017 年 7 月遭到一个团体的入侵，他们盗走了超过 1.5\
  \ TB 的信息，包括剧本和几部剧的完整集。\n\n在另一个更具轰动故事中，Uber 技术公司（Uber Technologies, Inc.）近期披露的细节显示，该网约车公司的系统在\
  \ 2016 年遭到入侵，黑客盗走了数百万 Uber 客户和司机的姓名、电子邮件地址、电话号码和执照号。Uber 不仅在一年多内没有披露此次入侵，据称还向黑客支付了“赎金”，换取黑客承诺删除被盗数据并对这一网络事件保持沉默。\n\
  \n尽管网络安全对董事会来说并不是一个新挑战，但近期事件的规模和数量表明，在董事监督以及管理层实施公司充分网络安全系统的职责方面，我们可能正处于一个转折点。\n\
  \n## 董事的职责\n\n许多董事明白他们负有监督网络安全的责任。但更令人困惑的是他们现在应该做什么。他们应该问哪些正确的问题？下面我们对您应该关注的网络安全合规的主要领域进行了了简要讨论。我们邀请您将本文存档，并在董事会期间讨论网络安全时使用本文末的大纲。\n\
  \n\n\n\n\n# 第一条教训是公司必须关注有关公司系统及公司使用的软件中网络漏洞的例行警报。在 Equifax 的案例中，黑客显然利用了 `Apache\
  \ Struts` Web 应用程序软件中的一个已知网络漏洞，Equifax 使用该软件来构建其 Web 应用程序。美国国土安全部美国计算机应急响应小组（`US-CERT`）于\
  \ 2017 年 3 月 8 日通知了 Equifax 等许多机构该漏洞，并要求对软件进行补丁。尽管该公司通过电子邮件在内部传发了 `US-CERT` 通知，并要求相关人员安装补丁，但补丁显然没有安装，或安装不正确，一周后对系统的后续扫描未能发现该错误。\n\
  \n# 第二条教训是公司必须确保他们有适当的系统来升级潜在网络事件的信息，并确保例如总律师在关键窗口期内禁止对重大违规事件有内部消息的人员进行公司证券交易。在\
  \ Equifax 的案例中，披露有几位高管在泄露事件内部报告之后、公众获知事件之前交易了公司股票。这引发了对可能存在内部交易以及内部控制缺乏的，而当时 Equifax\
  \ 已经因为泄露事件本身面临严厉的公众审查。（这些高管随后由 Equifax 一个负责分析泄露的特别委员会无清了嫌疑。）⁹\n\n# 第三条教训是，如果在其范围内发生了灾难性的网络攻击，董事会必须有一份公开响应计划。Equifax\
  \ 对事件的公开处理受到了来自几乎所有角度的广泛批评。例如，许多人抱怨该公司在 2017 年 7 月下旬首次获知泄露后，花费了整整一个月才公开披露了该事件。还有人嘲笑\
  \ Equifax，在泄露发生后立即将消费者引向一个不安全的“钓鱼”网站，该网站模仿了 Equifax 建立的用于与急于了解个人信息是否泄露的客户交流的网站。也有人感叹公司在泄露后似乎处于“公关模式”，并犯了错误，例如向受影响的个人收取费用提供信用监控服务，而不是免费提供。（该公司随后改为向受害者提供免费的信用监控服务，但强迫这些客户同意冗长的仲裁条款，这将限制客户就相关服务问题起诉\
  \ Equifax 的能力。在遭到公众抗议后，Equifax 随后放弃了仲裁条款。）¹⁰\n\n# 第四条教训是公司应该仔细考虑何时以及如何披露泄露。Equifax\
  \ 和 Uber 近期披露的网络事件为董事会会在这方面工作提供了宝贵的指导。公司在评估何时披露以及什么内容时，不仅要考虑其法律披露义务，还要考虑公众舆论。类似地，一些人指出，`SEC`\
  \ 对涉及其 `EDGAR` 数据库的网络事件的公开披露，是在内部对该事件提出报告的几个月后才进行的，这说明了对于任何执行者——包括那些被指负责基于披露的行为的人员——要平衡快速公开披露和彻底内部审查之间的竞争性需求是多么困难。`SEC`\
  \ 自身对网络漏洞的并不理想的应对（以及随导致的网络披露延迟）引发了人们对该机构未来将如何追究公司网络相关披露，以及如何在一方面的及时披露和另一方面的严谨内部审查之间平衡竞争性需求的疑问。\n\
  \n# 最后一条教训是，公司应该意识到第三方处理公司敏感数据时所带来的风险。德勤的事件提供了另一个数据点，并强化了这样一种观点：当这些实体处理公司敏感数据时，公司不仅必须关注自身的网络安全系统，还要关注第三方供应商和顾问（甚至可能是政府）的系统。\n\
  \n鉴于近期这些高关注度的事件，我们在下方讨论了一系列实用的考虑因素和原则，董事成员可以使用这些原则来帮助其公司建立一个有效且动态的网络安全计划。这些考虑因素也将帮助董事测试当前网络安全计划的现状和有效性。\n\
  \n## 董事的实际考虑因素\n\n作为首要原则，董事应该理解他们在网络安全方面的信托责任，以及指导其公司的首要法律环境。除了业务和声誉风险外，网络安全的疏忽可能会给公司、其管理层，在某些情况下给其董事会带来重大的法律后果。公司必须意识到并理解各种联邦和州法律，其中某些法律监管了特定行业或类型的敏感信息。\n\
  \n公司还必须意识到，联邦和州监管机构（如 `SEC`、`DOJ` 和 `FTC`）在执行其他非网络特有的法律（如联邦消费者保护法和证券法）时，可能会日益关注网络安全。此外，董事还必须注意股东和消费者诉讼的风险，这些诉讼通常在网络安全事件披露后引发。下文所述，公司总律师和内部网络人员应为董事会安排定期简报，以评估这些进展。\n\
  \n### 1. 审查现有网络安全风险并确定优先级\n\n网络安全是许多行业中的“首要”风险。如果董事会尚未这样做，他们应该投资进行一次正式简报，讨论其公司面临的一系列现有网络安全风险，并根据这些风险权衡各种有助于保护公司最有价值资产机制的优缺点。董事会应首先识别公司最有价值的资产，并评估这些资产可能如何被网络事件破坏。对于某些公司来说，最有价值的资产是客户的私人财务信息、个人身份信息或可能的健康记录。对于其他公司来说，可能是知识产权，或者可能是专利数据库，甚至是一组敏感邮件。任何网络安全计划都必须以保护这些最重要的资产为目标。\n\
  \n董事应该对公司系统可能发生的各种类型的网络泄露有基本的了解，并熟悉行业内经常使用的技术术语。公司常见的网络事件可能从恶意软件到钓鱼攻击，从未修补的软件漏洞到高级持续性威胁\
  \ (`APT`)）。此外，公司物理安全方面的漏洞可能允许攻击者渗透公司的网络防御。\n\n虽然董事会并不一定需要研究网络攻击或其应对的技术机制，但董事会应对这些概念有足够的熟悉，以便与管理层进行建设性的讨论，并对公司的网络安全计划进行有效的监督。\n\
  \n\n\n\n\n在评估现有网络安全风险时，董事会应特别关注其所在行业以及规模相近公司的最新趋势和近期事件。某些类型的网络攻击在某些行业中发生频率更高，而在另一些行业中则较少。例如，如果你是一家小型零售商，你最紧迫的网络安全关注可能是销售点入侵，即攻击者利用远程访问应用程序（通常由第三方供应商提供）的漏洞来窃取你客户的信用卡支付信息。\n\
  \n董事还应该广泛地了解哪些个人或哪些团体最可能成为公司的目标，以及目的是什么。作为一个起点，威信公司发布的《2017 年数据泄露调查报告**（即`2017 Verizon\
  \ Report`）显示，大多数网络安全泄露是由外部威胁者实施的（75%），而比例较小的一部分则是由内部人员（如员工或前员工）实施的（25%）。\n\n一旦董事会对公司现有的网络威胁概况有了良好的掌握，就应该优先考虑降低实际网络泄露风险的策略。一位有效的董事会帮助公司确定哪些资产最有价值，并评估用于保护这些资产的关键控制措施。\n\
  \n他或她还将为应急情况制定计划，并确保建立适当的响应框架来处理潜在的网络事件。这一过程不可避免地涉及审查公司与网络安全相关的预算，以根据现有威胁和公司现有系统的稳健性来确定预算是否合理。（请记住，预防问题的成本远比修复问题的成本低。）\n\
  \n一个关键的结论是，网络安全中没有进攻策略——只有防御策略。此外，你无法保护一切。即使是网络领域技术上最先进的机构——国家安全局（`NSA`）也无法保护其最深处的秘密。\n\
  \n## 2. 评估企业文化并树立正确的榜样\n\n真正“理解”网络安全的公司具有适应性文化。然而，大多数企业文化并不会迅速变化——它们是以缓慢的速度演进的。因此，许多组织的安全文化未能跟上其运营环境中的威胁格局。\n\
  \n安全需要被框架化为关键的推动因素，帮助公司履行其对客户的承诺。它还需要被公司所有层级的员工视为一项基于`团队合作，而非监控`的共同努力。\n\n此外，还要考虑公司的“高层基调”以及发送给员工的有关网络安全实践的信息。鼓励高级管理层营造一个每个人对网络安全负有共同责任的环境。理想情况下，员工应该与公司首席信息安全官（`CISO’s`）部门的人员建立直接联系，并理解他们可以向该人员寻求判断和无障碍的指导。\n\
  \n公司管理层投入网络安全相关的高质量员工培训也至关重要。现在，员工接受通用的安全意识培训被认为是一种最佳实践，这种培训可能很大程度上或专门关注网络安全。\n\n\
  此外，培训不应该是一个“一次性”的活动。`CISO`部门或总法务（`GC`）应定期通过电子邮件向员工提供有关网络安全最新进展以及他们应该注意的问题。这种持续的强化培养了真正的网络“健康”文化。\n\
  \n评估公司网络安全文化的一个良好起点，是审查公司关于使用和保护公司系统的书面及正式指导。例如，公司是否有一项关于员工使用个人邮箱处理公司业务的书面政策？该政策是如何实施和遵守的？董事会是否遵循相同的标准，还是存在例外？理想情况下，董事将能够以身作则。请理解，作为一名董事，你可能是网络泄露的极有吸引力的目标，因为众所周知，董事成员通常使用个人设备下载董事会书籍并就敏感的非公开公司信息进行通信。\n\
  \n总之，网络健康文化需要成为战略焦点，嵌入到公司的日常运营和核心价值观中。新的范式应该是：网络安全是一项持续的风险，需要组织中的每个人来管理。当员工（你的公司或其他公司的员工）在这方面出现失误时，应将这些经历作为不要重复的教科书式教训。由于泄露通常会导致诉讼，董事会应将律师纳入讨论，并确保其改变文化的努力具有法律视角。在确保高层基调保持诚信和有效合规后，董事会应转向战略考量。\n\
  \n## 3. 关键网络安全人员\n\n董事会应参与关键人员的选择，例如`CISO`。他们还应确保建立了适当系统来监控这些人员的表现。在过去，公司经常将网络安全责任委托给首席运营官或首席技术官。考虑目前公司负责网络安全的主要负责人。该人员是高管级别吗？网络安全是否是他们正在应对的许多紧迫需求之一？如果第一个问题的答案是“否”，第二个问题的答案是“是”，你可能考虑创建一个`CISO`的新职位。\n\
  \n董事会还应考虑 `CISO`（或其他主要负责网络安全的官员）的内部汇报结构，以确保该人员拥有在该关键岗位取得成功所需的独立性和权威。`CISO`可以向公司的首席信息官、首席运营官、首席技术官甚至首席执行官汇报——但在任何情况下，`CISO`都应根据需要接触高级管理层和董事会。公司管理层还应考虑建立由公司\
  \ `CISO` 主席的信息安全委员会，并邀请高管参加委员会会议。董事们则应了解谁担任 `CISO` 职位，并在适当的情况下与该个人进行直接交流。\n\n##\
  \ 4. 评估风险管理策略\n\n从董事会的角度来看，有效监督的关键是让高级管理层负责制定并监控与网络安全相关的战略和风险承受能力。在大多数情况下，董事成员应该关注公司的网络安全计划，但不应插手参与。\n\
  \n\n\n\n董事会还应与管理层合作，制定一份网络安全事件“响应手册”，规划出公司在发生数据泄露或影响公司系统的严重网络事件时将如何应对各种突发情况。例如，在\
  \ Uber 丑闻之后，公司可能需要考虑处理赎索请求，在可能减轻某些与泄露相关的损害的优点，与以这种方式奖励犯罪行为的劣势之间进行权衡。任何此类分析应具有足够的灵活性，以考虑到执法部门的实时建议以及对公司披露义务的法律分析。为了避免埃克福（Equifax）问题，公共响应计划应指定一个内部和外部专家团队来调查原因并进行适当披露。\n\
  \n公司管理层可以使用各种框架来制定与网络安全相关的适当风险管理策略。例如，2013 年 10 月，美国商务部国家标准与技术研究所（`NIST`）发布了一套旨在降低网络安全风险的自愿标准和最佳实践征求意见。最终版本于\
  \ 2014 年 2 月发布，题为《改进关键基础设施网络安全框架》。^(14\n\n`NIST` 框架包含五个“功能领域”，董事可以在为公司制定整体网络安全计划时考虑这些领域。这些功能包括：\n\
  \n1. **识别**：建立组织理解，以管理系统、资产、数据和能力的网络安全风险。\n2. **保护**：开发并实施适当的安全措施，以确保关键基础设施服务的交付。\n\
  3. **检测**：开发并实施适当活动，以识别网络安全事件的发生。\n4. **响应**：开发并实施适当活动，对检测到的网络安全事件采取行动。\n5. **恢复**：开发并实施适当活动，以维护恢复性计划并恢复因网络安全事件受损的任何能力或服务。^(15\n\
  \n鉴于美国证券交易委员会（`SEC`）对市场的巨大影响，其指南也为董事提供了宝贵的帮助。网络安全一直是 `SEC` 国家检查计划的重点，该计划由合规检查检查办公室（`OCIE`）监督。2017\
  \ 年 8 月，`OCIE` 发布了一份风险警报，强调了其“网络安全 2 号倡议”的结果。^(16\n\n作为“网络安全 2 号倡议”的一部分，`OCIE` 评估了公司在以下领域如何管理其网络安全计划：\n\
  \n1. 治理和风险评估；\n2. 访问权限和控制；\n3. 数据泄露防护；\n4. 供应商管理；\n5. 培训；以及\n6. 事件响应。^(17\n\n从整体来看，`OCIE`\
  \ 发现，虽然公司在建立网络安全方面做得越来越多，但面对不断变化的网络威胁和攻击时，他们在维护和更新这些计划方面做得不够。^(18\n\n## 5. 建立监控网络安全工作的系统\n\
  \n董事应将监控公司的网络安全工作视为对机器的持续维护。需要进行定期的检查和调整，而不是一次性的工作。用于实施和防止网络攻击的技术将不断演进。\n\n此外，随着公司向不同的操作系统迁移或扩大业务组合，旧的战术和系统可能被认为无关或不足。\n\
  \n因此，董事会至少在季度会议上对公司的网络安全计划进行定期审查是明智的。还应建立一套程序，在出现新的严重问题时更频繁地向董事会进行简报。\n\n公司的会议记录应准确反映在此类会议上讨论网络安全的情况，以便董事会的尽职调查得到记录和证明。董事会还应定期收到网络安全计分卡，突出显示公司在缓解网络风险方面的进展，包括外部指标、差距修复、新兴风险、权衡和其他问题。计分卡不需要包含高度技术性的关键性能指标即可发挥作用。相反，适用于董事会的良好指标示例包括：\n\
  * 客户满意度（由信息安全事件导致的客户系统停机时间）\n* 声誉（媒体报告的信息安全事件数量）\n* 财务（信息安全预算占 IT 预算的百分比）\n\n作为一项重要原则，董事会应确保在会议上讨论网络安全时，收集、分析并分享有关网络事件的数据（无论大小），以告知网络安全工作的有效性。公司还应优先从政府、私人或非营利机构获取任何有关网络漏洞和可能暴露的信息。\n\
  \n在埃克福事件之后，所有公司认真审视其信息升级协议都是重要的。当可能的网络事件首次被发现时，谁应该被通知？\n\n通常情况下，初级员工最有利于观察网络的的迹象。在安装关键软件补丁时（例如埃克福案例），要确保有适当的监督和同行评审系统，以防止一个人的人为错误导致灾难性的（可预防的）泄露。\n\
  \n董事还应确保公司有一套系统，鼓励员工和管理层从过去的错误中学习。\n\n承认错误并从中学习有助于做出决策。在关于公司安全模型和漏洞的简报中，应鼓励进行事后分析。\n\
  \n当错误发生时，这也是咨询律师的好时机。某些错误带有法律责任。例如，公司可能需要向股东披露网络安全风险和不利的网络事件。董事会应确保任何事后分析以及由此产生的政策都包含必要的法律应对。\n\
  \n## 6. 审查网络披露的充分性\n\n越来越多的公司每年在财务披露中将网络安全描述为风险。^(19\n\n埃克福因在 7 月下旬发现泄露后直到 9 月才披露而受到严重批评。但公司和监管机构都意识到，在早期披露与等待了解所有重大事实以避免做出误导性或不准确的披露之间存在着巨大的张力。`SEC`\
  \ 自己也因处理 `EDGAR` 数据泄露方面的失误而受到批评。`SEC` 最初报告没有个人身份信息被获取；随后它不得不修正这些声明。^(20\n\n公司建立适当的升级协议至关重要。不要浪费宝贵时间等待泄露报告缓慢地层层上报到决策者手中。相反，在重大泄露和披露之间的任何时间都应该好好花在调查事实和分析问题上。\n\
  \n`SEC` 在该领域提供了一些指南。2011 年，`SEC` 的公司金融部发布了针对上市公司的有关网络安全威胁和不利网络事件披露义务的指南。^(21\n\n\
  \n\n\n虽然美国证券交易委员会（SEC）尚未介入，但其他监管机构已经开始积极执行与网络相关的披露义务。例如，2017 年 8 月，Uber 就联邦贸易委员会（`FTC`）就\
  \ 2014 年的一次数据泄露提出的指控达成和解。`FTC` 指控该公司在保护客户信息的努力方面做出了误导性陈述，且未能采取“合理的、低成本的措施”来防止对客户个人数据的未经授权访问。与此同时，`FTC`\
  \ 确认其正在审查 Uber 对 2016 年数据泄露事件的响应，该公司最近才披露了该事件。\n\n`FTC` 此前还曾就披露问题对甲骨公司提起过诉讼，指控该公司未能告知消费者较新的软件更新不会自动删除旧版本（且可能被利用的）Oracle\
  \ Java 软件。去年，消费者金融保护局（`CFPB`）要求运营在线支付系统的 Dwolla, Inc. 支付罚款并改进其安全实践，此前该公司被指控向消费者误传其网络是“安全”且“可靠”的，且其数据安全实践“超过”或“优于”行业安全标准。\n\
  \n此外，尽管目前还没有国家级的“数据泄露通知”法，但大多数州已经制定了法律，要求在发生涉及敏感消费者和个人身份信息的某些网络安全泄露时，实体必须通知受影响的个人。\n\
  \nUber 很可能是延迟披露和“不应做的事”最极端的例子。该公司在近一年内未能通知监管机构和受泄露影响的个人，这可能违反了各州的通知法。此外，据报道 Uber\
  \ 还将不披露泄露作为向网络犯罪分子支付赎金的条件，这进一步加剧了其掩盖真相的形象。\n\n几个州的总检察官已经对该泄露事件启动了调查。\n\n关键的启训是，公司持续地审查其网络披露的充分性和及时性至关重要。这没有“一刀切”的答案。经验丰富的披露顾问的建议至关重要。\n\
  \n### 7. 理解第三方漏洞\n\n如果说最近的事件教会了我们什么，那就是：如果公司未能确保第三方服务提供商也实施充分的网络风险管理系统，那么公司的网络安全协议将无诸于事。很多时候，网络犯罪分子的切入点是拥有公司系统或非公开数据访问权的第三方。\n\
  \n例如，家得宝（Home Depot）仍受到 2014 年一次网络安全事件的影响，在那次事件中，黑客利用第三方支付处理器的安全漏洞，盗取了超过 5000 万名家得宝客户的电子邮件和支付信息。黑客在\
  \ 2013 年同样利用第三方供应商访问了 Target（Target）的客户数据库，盗走了约 4000 万客户的支付信息。\n\n德勤（Deloitte）最近的案例说明了为什么公司在涉及第三方网络风险时应特别关注专业服务公司。专业服务公司——如律事务所、审计机构和咨询公司——特别脆弱，因为它们的数据库和云计算应用程序通常包含来自许多不同客户和业务伙伴的敏感信息，而这些信息都集中在一个方便网络犯罪分子利用的地方。专业服务公司拥的信息是网络犯罪分子极具吸引力的目标，因为这些信息通过非法交易很容易变现。此类信息也可能是黑客分子（hacktivists）吸引的目标。\n\
  \n2015 年的“巴马文件”丑闻是首批披露律师事务所网络漏洞的事件之一。受影响的 Mossack Fonseca 律师事务所曾帮助数百名美国客户建立离岸业务。黑客入侵了\
  \ Mossack Fonseca 高知名客户的敏感信息（时间追溯到 20 世纪 70 年），导致许多与该公司合作的公司暴露在风险之中。\n\n由于第三方通常可以访问高度敏感的公司信息，因此在公司聘用它们之前，应对对其进行严格的第三方网络风险评估。\n\
  \n董事不需要了解每份服务合同的每一个细节，但他们应该确保公司已有一份书面的供应商风险管理政策，以处理第三方对公司系统和敏感非公开数据的访问。归根结底，政策应确保管理层进行适当的尽职调查，并意识到与特定供应商开展业务的风险。公司还应定期重新评估第三方风险，并确保第三方服务提供商确实履行了其义务。\n\
  \n董事还应意识到向政府提供敏感非公开信息相关的风险。SEC `EDGAR` 数据库的泄露引发了关于市场监管机构应持有多少敏感公司数据，以及资源有限的政府是否能够保护此类数据的严重问题。\n\
  \n### 8. 考虑转移网络风险的方法\n\n网络安全不是一个要解决的问题——它是一个需要持续管理的风险，并在审慎的情况下进行转移。作为风险管理工作的一部分，董事会应仔细审查与第三方供应商的现有合同和保险单。\n\
  \n这些协议必须明确说明在发生泄露时谁负责，以及涵盖哪些内容。\n\n尽管网络保险仍处于起步阶段，缺乏精算数据，但它是美国公司中增长最快的保障类型之一——而且这有其合理原因。\n\
  \nTarget 公司在今年早些时候向 `SEC` 提交的年度报告中报告，与其 2013 年系统数据泄露相关的累计支出达 2.92 亿美元，该泄露导致了客户信用卡信息被大量盗取。根据该公司说法，这笔总费用部分被\
  \ 900 万美元的保险赔款抵消。\n\n除了货币保险赔付显而易见的潜在收益外，寻求网络保险可能为公司带来辅助优势。正在寻求网络保险的公司将有动力使用最佳实践，因为保费在某种程度上取决于公司对保护措施的有效利用。单是申请过程就可能要求对公司现有的网络安全计划进行深度评估。通过这一过程，公司可能会更好地了解自身的网络风险和机遇。董事会还应意识到，在需要时，保险公司通常提供工具帮助公司应对网络安全事件并减轻泄露后的损失。\n\
  \n董事会通常对公司是否应购买网络保险拥有最终决定权。董事会做出这一决策可能需要应对一些新领域。你必须确定哪些是以及应该涵盖的内容，哪些是不以及不需要涵盖的内容。你还需要确定特定的保费是否公平。\n\
  \n\n\n\n传统上，大多数商业通用责任（CGL）保单并不包含网络安全“免责条款”；然而，如今，保险公司可能更容易在其保单中包含此类条款。董事应确保覆盖范围没有关键缺口，并根据公司自身的风险概况考虑哪些涵盖最合理（例如，涵盖选项可能包括对数据泄露成本；勒索；取证分析；盗窃；诉讼成本和费用以及业务中断的涵盖，此限于）。董事会还应确认其董事及高管人员（D&O）保单中包含了对与网络安全相关事件的覆盖。\n\
  \n## 9. 跟上发展动态\n\n网络安全领域没有任何停滞不前的事物。黑客攻击不断演变，上个月仍是行业标准的防御措施，下个月可能就会过时。立法者和监管机构反过来努力跟上新法规的步伐，这在很大程度上受到受知名泄露事件后公众抗议的推动。例如，纽约州已对最近的\
  \ Equifax 泄露事件做出了反应，提议立法以扩大该州首创的网络安全规则，这些规则目前要求纽约所有的金融机构必须在州内注册并实施保护消费者数据等计划。²⁹\n\
  \n治理网络安全的不断变化的法律格局本身就可能被视为公司的网络安全“漏洞”。董事会需要意识到公司的合规义务，但这事易说行难。当今的公司运行在一个碎片化的网络安全监管体系中。\n\
  \n州级、联邦和外国监管机构都有自己的规则和指导意见。某些州（如加利福尼亚州和纽约州）近年来采取了尤为激进的举措，在其司法管辖范围内监管并执行网络安全标准。在联邦层面，如\
  \ `FTC` 和 `SEC` 等机构在各自指定的关注领域和指导范围内也处于网络安全执法的最前沿。\n\n欧盟方面，近期实施了其《通用数据保护条例》（GDPR），该条例对从欧盟公民收集信用卡数据或其他个人信息的公司施加了报告和其他要求。³⁰\n\
  \n董事会应确保其公司继续遵守有关网络安全的最新州和联邦法律法规。对于某些经常被网络犯罪分子针对的特定行业公司（例如金融机构）以及处理敏感个人信息（如个人身份信息、财务信息或受保护的健康信息）的公司来说尤其如此，因为这些公司经常受到监管机构和立法者的审查。董事会一个明显的第一步可能是要求公司总法律顾问和\
  \ `CISO` 定期向董事会简报立法进展并提供他们的建议。随着许多律师事务所扩大其数据隐私和网络安全业务，公司也可以借鉴外部法律顾问的专业知识，根据公司的需求开发个性化的计划来管理网络安全风险。\n\
  \n董事会也可以对抗“合规疲劳”的有力武器，在这种疲劳中，执行日常合规职能的人员在应对迥异的日常需求和多个动态目标时，会忽视大局。“勾选方框”很重要，但这是不够的。凭借其高层次的视角和地位，董事可以在鼓励管理层在改进现有流程和网络安全措施时进行批判性及创新性思维方面发挥重要作用。最后，董事会应努力确保公司的大部分精力花在实际的网络安全上，而不是仅仅为了证明合规。\n\
  \n## 结论\n\n为了实施有效的网络安全计划，董事应该理解其公司面临的全方位网络风险，并鼓励管理层制定针对公司特定需求和目标的适当策略。任何有效的网络计划都包括周密的计划、明智的授权和监控合性的系统——所有这些都是董事应该负责的。这已不再是公司是否会被攻击的问题，而是关于何时被攻击以及公司将如何应对的问题。智能网络监控、尽早预警指标、多层防御以及从过去的事件中学习都是真正的网络韧性的关键组成部分。当问题出现时（无论是重大还是轻微），快速识别和响应问题的能力将决定公司的最终恢复。网络安全无法保证，但及时且恰当的反应可以。\n\
  \n## 董事网络安全清单\n\n### 风险评估 - 评估现有网络安全风险并确定优先级\n* 确定最有价值的资产\n* 寻求保护它们的有效策略\n* 审查网络安全预算的合理性\n\
  \n### 评估企业文化并树立良好榜样\n* 高管层和董事会不仅要参与，还应设定基调\n* 培训应具有参与性\n* 文化应基于合作而非监控\n\n### 开发策略和内部系统以管理网络风险\n\
  * 评估内部系统和控制的有效性\n* 参与关键网络安全人员的选择\n* 确保网络安全人员有权接触董事会\n* 理解并开发评估网络安全有效性的指标\n* 严格审查升级协议\n\
  * 请求提供安全评分卡\n* 开发事件响应计划\n* 测试该计划。考虑模拟网络攻击\n\n### 了解披露要求和第三方考量\n* 着网络安全的角度审查披露内容\n\
  * 为第三方合同建立缓解控制措施\n* 审查网络保险覆盖范围\n\n### 跟上发展动态\n* 根据不断变化的法律格局定期重新评估您的网络计划\n* 至少每季度启动一次网络计划的例行审查\n\
  * 指派总法律顾问和/或 `CISO` 向董事会简报监管进展\n* 利用与外部法律顾问现有的合作关系\n\n## 备注\n\n# 目录 (#Toc.xhtml#R_index)\n\
