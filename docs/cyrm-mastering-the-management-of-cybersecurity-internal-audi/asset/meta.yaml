- - '#'
  - 案例分析：Equifax 案例的教训
- - '##'
  - 第一条教训是公司必须关注有关公司系统及公司使用的软件中网络漏洞的例行警报。
- - '##'
  - 第二条教训是公司必须确保他们有适当的系统来升级潜在网络事件的信息。
- - '##'
  - 第三条教训是，如果在其范围内发生了灾难性的网络攻击，董事会必须有一份公开响应计划。
- - '##'
  - 第四条教训是公司应该仔细考虑何时以及披露。
- - '#'
  - 最后一条教训是公司应该意识到第三方处理公司敏感数据时带来的风险。
