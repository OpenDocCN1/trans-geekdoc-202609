- - '#'
  - 支持向量机 (SVM)：因其在高维空间中的有效性而被采用，使其成为类别间区分明显的复杂数据集的理想选择。
- - '#'
  - XGB Boost：梯度提升算法的一种高级实现，以其在分类任务中卓越的而闻名，因为它通过使用正则化和并行处理来避免过拟合并提高计算效率。
- - '#'
  - 随机森林 (Random Forest)：一种集成方法，通过创建决策树的“森林”来提高预测准确性并控制过拟合，增强模型的泛化能力。
- - '#'
  - AdaBoost：一种提升算法，通过结合多个弱分类器来增强模型，通过迭代地关注难以分类的实例来提高整体准确率。
- - '#'
  - 深度神经网络 (DNN)：这些网络是项目方法论的核心，能够通过多层抽象学习复杂的模式。DNN 特别地由于其适应性以及捕捉与网络威胁相关的网络流量细微动态的熟练程度而被利用。
- - '###'
  - 3.3 最佳模型的评估与选择
- - '##'
  - 4 结果与讨论
- - '###'
  - 平均流 IAT 作为指标：发现暴力破解攻击期间的封包平均包包到达间隔时间（`IAT`）持续快速，与良性流量中更具变性的 `IAT` 形成对比。这种快速性是暴力破解攻击的特征。
- - '###'
  - 正向包/秒和反向包/秒 作为诊断工具：暴力破解期间，每秒正向和反向包的速率显著增加，表明其攻击模式具有攻击性，且与正常网络行为明显不同。
