    # ABSTRACT


    Blockchain is a distributed, append-only digital ledger (database). The technology
    has caught much attention since the emergence of cryptocurrency, and there is
    an increasing number of blockchain applications in a wide variety of businesses.
    The concept, however, is still novel to many members of the simulation and operations
    research community. In this tutorial, we introduce the blockchain technology and
    review its frontier operations-and-data-related research. There are exciting opportunities
    for researchers in simulation, system analysis and data science.


    # 1 INTRODUCTION


    Blockchain is the underlying technology of bitcoin and other cryptocurrencies.
    It has caught public attention since 2017 when the bitcoin, secure record sharing
    system, blockchain was considered a resolution or the "future of the internet"
    by its believers; and by skeptics. In reality, blockchain technology has a broad
    application in a wide variety of domains, but it is not a unique (better) solution
    for all.


    Blockchain is literally, a chain of blocks. The block here is composed of a certain
    amount of data, and the chains that the data are connected. More specifically,
    it is a consensus-based, peer-to-peer distributed network with a "growing list
    (chain) of records, called blocks, which are linked using cryptography." (Wikipedia
    2020) Each block contains an index that specifies the sequence of blocks; a timestamp
    that records the approximate time the block was added; the data, and the hashes
    of the current and previous blocks (Figure 1). The hash is the output of a cryptographic
    function that converts a meaningful string into a non-meaningful, fixed-length
    alphanumeric string. The input of the hash for block $k$ includes the blocks mentioned
    above, the data of block $k$, and the hash of $k-1$. The hash is highly sensitive
    to the input—any change in input leads to a completely different hash value, which
    makes the blockchain nonverable. The hash function serves as the backbone of blockchain
    security and will be discussed in more details in Section 3.


    Different from the traditional centralized network. First, the data (in block)
    is immutable. Specifically, if a block is changed, all blocks after it become
    invalid since their previous blocks'' hash value will be void. Second, a distributed
    network with consensus allows users (with authorities) to communicate directly
    with each other to broadcast new blocks, synchronize the network status, and download
    the current database. The redundancy of the data and connection channels makes
    the blockchain more tolerant of node failures. With these properties, the longer
    the chain the harder to hack the chain and change blocks without detection, making
    the blockchain more reliable (Nakamoto et al. 2008). To understand the


