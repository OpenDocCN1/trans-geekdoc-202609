    PoW 链中的审查属性。他们的结果说明了内生设计选择如何影响实际性能，以及仿真如何与外生数据交互。Brousmiche 等人（2018）建立了一个基于代理的框架，用于模拟集成消费/生产行为并与私有链交互的本地市场。Bottone
    等人（2018）开发了一个可扩展的多代理仿真器。


