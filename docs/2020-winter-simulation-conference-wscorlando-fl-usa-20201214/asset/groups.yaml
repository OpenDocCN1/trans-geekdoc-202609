    # A


    Security

    Ability to maintain ledger integrity against malicious attacks through inbuilt
    mechanisms


    # C


    Figure 2: Blockchain scalability trilemma (ReverseAcid 2018).


    # 2.2 Consensus Mechanism


    The consensus is an algorithm to reach agreements among different nodes/participants
    of the distributed system to solve the Byzantine general problem (Lamport et al.
    2019) to handle malicious behaviors that give false information. There have been
    many consensuses since the invention of bitcoin. Most of them are either proof-of-work
    or proof-of-stake-based.


    +   - Proof of work (PoW) is the consensus applied by the majority of cryptocurrencies,
    including bitcoin. In this, the participants (i.e., miners) compete with each
    other to solve a complex computational puzzle that can be done by brute-force
    search via a cryptographic hash function. This is probabilistic, and the winning
    probability of a miner is proportional to her mining power. The winner will earn
    the right to add the next block and collect the transaction fees, as well as receive
    a reward (usually a certain amount of cryptocurrencies). Miners safeguard systems
    with the price of energy waste. Pow is the first consensus developed for blockchain
    and for its fairness and security. However, it is slow and expensive, and research
    shows that the mechanism cannot prevent monopoly miners.

    - Proof of stake (PoS) is another widely used consensus that is complimentary
    to PoW. The next block is selected through a quasi-random process, which depends
    on the stake held by a participant rather than power. This mechanism was first
    applied by Peercoin (Hao and Nadal 2012). PoS is much more efficient (both time
    and energy wise) than PoW. However, the PoS-based system suffers from a nothing-at-stake
    problem, in a node without any stake may behave maliciously since she has nothing
    to lose.


    Besides these two well-known consensus, there have many other algorithms proposed
    recently for different trust level and system requirements (MingXiao et al. 2017;
    Banakan et al. 2020).


    # 3 BITCOIN AND ETHEREUM: MINING AND SMART CONTRACT


    This section introduces bitcoin and Ethereum systems, two of the most famous public-permissionless
    blockchain applications (Nakamoto et al. 2008; Wood et al. 2014). These two platforms'
