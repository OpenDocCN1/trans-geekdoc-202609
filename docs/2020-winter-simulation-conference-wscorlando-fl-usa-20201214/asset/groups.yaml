    of the big data.


    # 5 SYSTEM DATA ANALYSIS OF BLOCKCHAIN SYSTEMS


    In this section, we review the recent blockchain research from system and data
    points of view. Our discussion focus on three topics: simulation characterization
    of blockchain systems (Section 5.1), game-theory approach to understand interactions
    between different nodes (Section 5.2), and machine learning in and for blockchain
    (Section 5.3).'
