    # 作者简介


    **HONG W** 是北卡罗来纳州大学工业电子工程系的副教授。他的研究重点是复杂仿真模型和区块链的实验设计与数据分析。他是 ICE 区块链实验室的主任，《区块链研究》的主编辑以及
    ACM TOC 的副编辑。他的电子邮箱为 hwan4@ncsu.edu，个人网站为 https://www.ncsu.edu/people/hwan4/


    **YING HUANG** 是北卡罗来纳州大学运筹学项目的博士生。她的研究兴趣包括仿真和区块链技术。她的电子邮箱为 yhuang43@ncsu.edu。


    **KEJUN LI** 是北卡罗来纳州大学工业与系统工程系的博士生。他的研究兴趣包括应用概率、仿真、博弈论和区块链技术。他的电子邮箱为 kli15@ncsu.edu。


