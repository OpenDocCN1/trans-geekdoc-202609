    # Wan, Huang, and Li


    # 5.2 Game Theory


    As a powerful tool for strategic decision making, game theory plays a valuable
    role in the blockchain field. It optimizes the utility of each player while considering
    the interactions among players. Of the increasing amount of research in studying
    blockchain with game theory, we categorize them by types of games and discussed
    the research respectively.


    # 5.2.1 Non-Cooperative Game


    As the term suggests, a non-cooperative game represents the situation where players
    compete against each other. The ability of a non-cooperative game depicting the
    state and dynamic game makes it the most prevalent method in blockchain research.
    Eyal (2015) modeled it as the miner''s dilemma. The non-cooperative theory was
    used for chain selection of bitcoin by Carlsten et al. (2016). Teutsch et al.
    (2016) illustrated that the player controlling at 38.2% of the network''s total
    computational power can gain reward by deviating from the protocol in any PoW-based
    cryptocurrency. Liao and Katz (2017) modeled the interaction between attackers
    and regular miners in a whale, which attackers avoid an off-chain transaction
    for miners to fix the current. With an extremely large transaction fee in off
    an incentive to convince regular miners it was investigated by Kroll et al. (2013).
    To study the computational power allocation in the bitcoin mining community, Dimitri
    (2017) characterized the mining activity as an all-pay contest. To investigate
    when gaps (the situation that miners avoid when the available fees are insufficient),
    Fsbary and Eyal (2018) analyzed the cryptocurrency system via a game. Easley et
    al. (2019) developed a game-theoretic model to explain the factors leading to
    the emergence of transaction fees and the strategic behavior of miners and users.
    The non-cooperative theory can also be used for pool selection regarding the rewards
    allocation (Schrijvers et al. 2016). Pagnitta, Emiliano and Buracchi, Andrea (2018)
    showed the equilibrium price is obtained by solving a fixed-point problem.


    # 5.2.2 Extensive-Form Game


    Extensive-form games are used to describe dynamic games. The players will make
    decisions according to a preferred order. Aiming to verify the cloud computation
    at a relatively low cost, Dong et al. (2017) employed game theory with the help
    of smart contracts. Lowenburg et al. (2015) proposed a game theoretic model of
    the competition for fees under the new structure with directed acyclic graphs.
    Cong, Lin William and He, Zhiguo and Lians (2020) applied extensive game to optimize
    reward allocation of pool. Cong, Lin William and Ye, Wang (2020) studied the utility
    of adopting blockchain game by comparing a token baseline equilibrium using extensive
    form game, to an an equilibrium without token.


    # 5.2.3 Stackelberg Game


    There are two types of players in the Stackelberg game: leaders and followers.
    The leader moves first and then the followers will make decision on the leader''s
    movement. Kang et al. (2018) formulated a Stackelberg game to maximize the utility
    of the blockchain and profit of miners. Xiang et al. (2018) modeled a series of
    results of the Stackelberg equilibrium in the market game. Li et al. (2017) illustrated
    a Stackelberg game model of interaction between the service provider and the miner
    as a Stackelberg game between the users and credit bank.


    # 5.2.4 Stochastic Game


    In the stochastic game, there could be one or more players decisions repeatedly
    with probabilistic transitions. Zhen et al. (2017) presented a Zero Determined
    strategies by modeling a two-miner game. The stochastic game was applied here
    to analyze the selection between the honest and selfish'
