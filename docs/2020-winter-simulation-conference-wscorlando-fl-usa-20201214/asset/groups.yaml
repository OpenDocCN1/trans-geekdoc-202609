    # Wan, Huang, and Li


    # 3.2 Ethereum and Smart Contract


    Ethereum is a decentralized open-source blockchain platform that features smart
    contracts. It provides a decentralized virtual machine that allows users to build
    their applications (i.e., daps). The mined cryptocurrency is called Ether and
    is the second-largest digital currency by market cap after bitcoin. Ethereum is
    currently using PoW as its consensus protocol but transitioning to PoS. Validators
    replace miners, and they vote on which block will be added to the chain. The stakes
    (the cryptocurrency) a node has, the voting power it will have. The node obtaining
    a larger number of coins has a significant probability of creating a new block.
    The elimination of PoW mining significantly improves the efficiency of the blockchain
    but reduces its decentralization level.


    Ethereum transactions include not only coins but also smart contracts. A piece
    of automatically executed code that implements activities when conditions fulfills.
    In particular, the smart contract is uploaded to an address, and other nodes can
    call a function of this smart contract to create a transaction. The transaction
    is irreversible, traceable, and transparent. Smart contracts are the elements
    of DAO which are generated by a set of smart contracts without a centralized governance
    (Shermin 2017). As discussed in Voshnir (2019), "Blockchain and smart contracts
    are technologies that have the potential to provide higher levels of transparency
    while reducing bureaucracy through self-enforcing code. They can minimize costs,
    eliminate middlemen, and subsequent conflicts. Tokens of distributed networks
    provide incentives to automatically align interests in the benefit of third parties."
    (On the flip side, the smart contract and DAO can introduce security risks to
    the blockchain (Shermin 2017). For security analysis and research of the smart
    contract, Parizi et al. (2018), Watanabe et al. (2015) and Sturm et al. (2019).
    Smart contracts on the blockchain technology have many possibilities in various
    industries. For example, one problem in the supply chain is the potential to prevent
    transparency. By translating the requirements of ontology to smart contracts,
    Kim and Laskowski (2018) found they can execute a provenance trace on the Ethereum
    blockchain. See also La and Xu (2017) and Galvez et al. (2018). Dolgui et al.
    (2020) developed and tested a model for smart contract design in the supply chain
    with multiple logistics providers and showed be presented as a multi-purpose flexible
    flow shop scheduling. Gatteschi et al. (2018) discussed the possibility of applying
    blockchain and smart contracts in the insurance industry. Chang et al. (2019)
    designed a blockchain-based smart contract technology to facilitate international
    payment. For more details, see section 4.


    # 4 CONSORTIUM BLOCKCHAIN


    A consortium blockchain involves multiple entities and stakeholders, each with
    customized authorizations, such as validators and users (Liu et al. 2019). A consortium
    chain requires an invitation to join, and each has highly customized authorities,
    allowing more control of the system by regulatory agencies. As a special case
    of consortium blockchain, the internal blockchain is a highly customized and cryptography-protected
    database maintained by a security process. The organization members could take
    part in the consensus process. The blockchain infrastructure is especially useful
    for data sharing and document approval during collaborations among organizations.
    It offers better workflow, data transparency, traceability and visibility, and
    can prevent nodes'' malicious behaviors (Manupati et al. 2020). Hyperledger is
    one of the most well-known umbrella projects of open-source consortium blockchains
    and tools developed by Linux. Its most famous framework is Hyperledger Fabric
    (IBM de Mao et al. 2018).


    A study shows that more than 30% of fish produced from retailers are incorrectly
    labeled, and illegal fishing reports losses around 10~23 billion dollar daily.
    The mislabeled and illegally sourced fish could hurt ordinary customers'' health
    or the reputation of grocery stores. It is essential to achieve traceability and
    transparency in the seafood industry. However, the complexity of seafood supply
    chains poses difficulties in interoperability (FishWise 2018). Sawtooth Lake blockchain-based
    supply chain'
