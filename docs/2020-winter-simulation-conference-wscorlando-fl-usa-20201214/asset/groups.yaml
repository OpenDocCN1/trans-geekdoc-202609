    The history of blockchain technology can be traced back to the year of 1991. Haber
    and Stornetta (1990) introduced a digital notary service to timestamp documents,
    and inspired by the blockchain. Later, they brought their idea into effect by
    creating a timestamping service called Surety. They published their hash in the
    New York Times once a week since 1995 to make it legitimate and unique. This service
    is considered to be the first in the world. Stornetta (1999) along with concepts
    of Berkeley (1980), consensus and fault tolerance (Castro, Liskov, et al., 2009)
    and Nakamoto et al. (2008) developed the bitcoin project that is the most famous
    realization of blockchain.


    There has numerous research on blockchain architectures, scalability, and consensus
    algorithms from the computer and electrical scientists, and discussions of blockchain
    applications from various areas (mostly in finance and emerging in regions). This
    tutorial has no intention to cover all of the state-of-art progress in this highly-interdisciplinary
    area. Our goal is to introduce the new technology to the simulation and operations
    research communities, review the relevant research, and initiate discussions of
    research opportunities. We first describe different kinds of blockchains with
    varying degrees of privacy, efficiency, and scalability, that fit for different
    scenarios in Section 2. Section 3 uses bitcoin and Ethereum to explain the basic
    concepts of blockchains, including mining, consensus, and smart contracts. In
    Section 4, we discuss a less famous but more widely used blockchain, the consortium
    chain, and demonstrate its applications at the enterprise level. Section 5 reviews
    the current research of blockchain in simulation, game theory, and machine learning,
    all of which focuses on system design and analysis. We conclude the paper with
    discussions in Section 6, the limitations of the blockchain and research opportunities
    for simulation and operations research communities.


    # 2 BLOCKCHAIN MECHANISM DESIGN


    In this section, we discuss the blockchain mechanism, which is mainly characterized
    by the following properties:


    +   - Who can view the data in the system? If anyone can view and download a copy
    of the whole ledger, we call it a public chain; otherwise is a private chain.

    - Who can validate the data and/or a block? If anyone can initiate and validate
    transactions as well as generate and broadcast blocks, then the blockchain is
    permissionless chain, otherwise permitted.

    - How do the network users agrees or solve conflicts? This mechanism is called
    consensus. The two most popular categories of consensus are proof of work and
    proof of stake (Mingxiao et al. 2017).


    The two properties categorize different types of blockchains, which we introduced
    in Section 2.1. Moreover, we also discuss fundamental measurements of a blockchain
    system in the same section.'
