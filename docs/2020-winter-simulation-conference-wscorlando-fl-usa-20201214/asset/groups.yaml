    organizations and customers. The consortium chain, with the ability of highly
    secured and customized data storage, has the potential to become the neural network
    of the big data.


    # 5 SYSTEM DATA ANALYSIS OF BLOCKCHAIN SYSTEMS


    In this section, we review the recent blockchain research from system and data
    points of view. Our discussion focus on three topics: simulation characterization
    of blockchain systems (Section 5.1), game-theory approach to understand interactions
    between different nodes (Section 5.2), and machine learning in and for blockchain
    (Section 5.3).


    # Wan, Huang, and Li


    # 5.1 Simulation Study of Blockchain Systems


    Recently, we see many simulation-related blockchain research appear. The current
    study mainly focuses on the mining of cryptocurrencies and the scalability of
    blockchain simulation models. Also, numerous simulators are proposed as platforms
    to evaluate the performance of blockchains under different conditions/attacks.
    We reviewed the related literature in this session.


    ## 5.1.1 Discrete-Event Simulation


    Allaby and van Moorsel (2019) proposed an event-driven model with transactions
    and emphasized on the block creation through Pow. Aoki et al. (2019) invoked events
    of block generation, block propagation, and message transmission/reception. Menon
    et al. (2019) built a queuing model to analyze the realistic behaviors of a memory
    and a memory pool for blockchain simulation. To investigate the large-scale blockchain
    networks, Wang et al. (2018) collected and defined a number of metrics to quantify
    the quality of blockchain. Miller and Jansen (2015) enabled the scalable execution
    of thousands of bitcoin nodes on a single machine in their work and enabled the
    denial-of-service attack to demonstrate the simulator. Gervais et al. (2016) studied
    optimal adversarial strategies for bitcoin simulator to analyze the security and
    performance of different configurations. Göbel et al. (2016) used discrete-event
    simulation to study the self-mining attack on a network with communication delay
    between miners. Fytik et al. (2020) presented a blockchain simulator that utilizes
    a generalized representation of consensus protocols, providing insights into the
    performance of the consensus protocols under various networking conditions.


    ## 5.1.2 Agent-Based Simulation


    Kaligoda and Macac (2018) proposed a generalized framework of modeling blockchain
    simulation by illustrating the essential aspects and functioning of the system.
    Coello and Marches (2016) reproduced the economy of the mining process with heterogeneous
    agents including the bitcoin transactions prices. Rosa et al. (2019) developed
    a security attack testing framework by exploiting parallel and distributed simulation
    techniques with extended scalability. Inspired by the design of algorithmic trading
    and reinforcement learning systems, Chitra et al. (2019) proposed an agent-based
    simulation to model censorship properties in PoW chains. Their results illustrated
    how endogenous design choices affect practical performance and how simulations
    can interact with exogenous data. Brousmiche et al. (2018) built an agent-based
    framework for simulating local market place integrating consumption/production
    behavior and interacting with a private blockchain. Bottone et al. (2018) developed
    an expandable multi-agent simulator for a block-free and fee-less ledger, which
    they employed NetLogo to provide a 3D visualization of the Tangle (Popov 2016).


    ## 5.1.3 Others


    Goswami (2017) discussed the factors that limit the scalability of blockchains
    by providing a comparative analysis of several blockchain parameters with real-time
    data. Alsahan et al. (2020) adopted the lightweight virtualization technique for
    constructing a simulation model with high speed and large scalability. The impact
    of affecting difficulty levels was also studied, as well as fork occurrences were
    evaluated. Yaaserasinghelage et al. (2017) used architectural modeling and simulation
    to measure the latency in blockchain systems under different configurations. Long
    et al. (2019) developed a hybrid (discrete-event and agent-based) supply chain
    simulation model to recreate the supply chain operations, which was integrated
    by an Ethereum-like blockchain with different visibility levels through the same
    software connector.


    # Wan, Huang, and Li


    # 5.2 Game Theory


    As a powerful tool for strategic decision making, game theory plays a valuable
    role in the blockchain field. It optimizes the utility of each player while considering
    the interactions among players. Of the increasing amount of research in studying
    blockchain with game theory, we categorize them by types of games and discussed
    the research respectively.


    ## 5.2.1 Non-Cooperative Game


    As the term suggests, a non-cooperative game represents the situation where players
    compete against each other. The ability of a non-cooperative game depicting the
    state and dynamic game makes it the most prevalent method in blockchain research.
    Eyal (2015) modeled it as the miner''s dilemma. The non-cooperative theory was
    used for chain selection of bitcoin by Carlsten et al. (2016). Teutsch et al.
    (2016) illustrated that the player controlling at 38.2% of the network''s total
    computational power can gain reward by deviating from the protocol in any PoW-based
    cryptocurrency. Liao and Katz (2017) modeled the interaction between attackers
    and regular miners in a whale, which attackers avoid an off-chain transaction
    for miners to fix the current. With an extremely large transaction fee in off
    an incentive to convince regular miners it was investigated by Kroll et al. (2013).
    To study the computational power allocation in the bitcoin mining community, Dimitri
    (2017) characterized the mining activity as an all-pay contest. To investigate
    when gaps (the situation that miners avoid when the available fees are insufficient),
    Fsbary and Eyal (2018) analyzed the cryptocurrency system via a game. Easley et
    al. (2019) developed a game-theoretic model to explain the factors leading to
    the emergence of transaction fees and the strategic behavior of miners and users.
    The non-cooperative theory can also be used for pool selection regarding the rewards
    (Schrijvers et al. 2016). Pagnitta, Emiliano and Buracchi, Andrea (2018) showed
    the equilibrium price is obtained by solving a fixed-point problem.


    ## 5.2.2 Extensive-Form Game


    Extensive-form games are used to describe dynamic games. The players will make
    decisions according to a preferred order. Aiming to verify the cloud computation
    at a relatively low cost, Dong et al. (2017) employed game theory with the help
    of smart contracts. Lowenburg et al. (2015) proposed a game theoretic model of
    the competition for fees under the new structure with directed acyclic graphs.
    Cong, Lin William and He, Zhiguo and Lians (2020) applied extensive game to optimize
    reward allocation of pool. Cong, Lin William and Ye, Wang (2020) studied the utility
    of adopting blockchain game by comparing a token baseline equilibrium using extensive
    form game, to an equilibrium without token.


    ## 5.2.3 Stackelberg Game


    There are two types of players in the Stackelberg game: leaders and followers.
    The leader moves first and then the followers will make decision on the leader''s
    movement. Kang et al. (2018) formulated a Stackelberg game to maximize the utility
    of the blockchain and profit of miners. Xiang et al. (2018) modeled a series of
    results of the Stackelberg equilibrium in the market game. Li et al. (2017) illustrated
    a Stackelberg game model of interaction between the service provider and the miner
    as a Stackelberg game between the users and credit bank.


    ## 5.2.4 Stochastic Game


    In the stochastic game, there could be one or more players decisions repeatedly
    with probabilistic transitions. Zhen et al. (2017) presented a Zero Determined
    strategies by modeling a two-miner game. The stochastic game was applied here
    to analyze the selection between the honest and selfish

