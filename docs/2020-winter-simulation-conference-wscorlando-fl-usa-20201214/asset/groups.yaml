    # 3.1 Bitcoin and Mining Process


    The most crucial difference bitcoin (and as other cryptocurrencies) and the traditional
    currency is that the former does not have an “issuer” (government or organizations)
    to endorse the value of money, validate transactions and regulate the financial
    system. Therefore the cryptocurrency must have (1) a security algorithm to protect
    each account so that other people cannot spend your, and (2) a self-regulation
    mechanism to maintain the system operation and avoid malicious behavior. For security,
    bitcoin uses public key cryptography (or asymmetric cryptography). See Huh et
    al. (2017). There is no physical form of bitcoin, but records of transactions
    and balances for each account (node). Each account is associated with a public
    key and a private key, whose relationship is similar to that of an email address
    and password. The public key can be communicated in the network, and the private
    key allows the owner to access the fund. Mining is a unique mechanism that supports
    the daily operations of transactions, and most of the other cryptocurrencies require
    authority who can add a group of transactions, i.e. block to blockchain. When
    A wants to pay B, transactions need to validate A’s account has sufficient funds,
    deduct one bitcoin from A’s account, and add one bitcoin to B’s account. The transaction
    fee is rewarded that A (or B) pays for the transaction recording. To create a
    valid block, a participant (miner) is required to


    +   1. find a lucky number (nonce),

    2. concatenate the previous hash, and the list of transactions as the input string,

    3. and apply the SHA-256 hash function to generate the hash of this output,


    such that the 256-bit hash function falls in a space that is quite small in relation
    to the much larger output space of the hash function. In this case, the nonce
    will not have to satisfy the following inequality:


    > Hash(nonce)|previous block hash|...txn| < target.


    All miners compete to solve the PoW hash to achieve the consensus in the blockchain.
    The problem can only be solved by brute-force search. Each node’s winning probability
    is proportional to their hashing power. Once a miner finds a reward, he will broadcast
    it to the whole network for validation. If the new block is validated by a majority
    of miners, the new block is formally appended to the blockchain and the creator
    earns the reward (a certain amount of Bitcoin) and transaction fees. See also
    Narayanan et al. (2016) for the details of the mining process.


    The mining process is energy-consuming. Each block takes about 10 minutes to generate
    (Nakamoto et al. 2008; Subramanian in 2018), and the actual transaction validation
    can take longer since each block contains only 1 MB of data, and there are competitions
    among miners. The higher the fee offered, the quicker the transaction is likely
    to be handled. Moreover, based on 2019 estimate (Vincent), bitcoin consumes more
    energy than Switzerland, and the solved mathematical problem is not meaningless.
    However, this process is irreplaceable because the PoW is evident and can be verified
    by all nodes used. Also, a blockchain system requires significant computational
    powers. If powers are used in mining, rewards will be higher. Therefore it discourages
    cheating behaviors.


    Compared with traditional currency, bitcoin is borderless, transparent and neutral.
    Moreover, the users have full control of their transactions. On the other hand,
    the disadvantage of bitcoin is its transaction speed, volatility, and narrow acceptance.
    The last one has been significantly improved in recent years.'
