    # AUTHOR BIOGRAPHIES


    HONG W is an Associate professor in the Department of Industrial and Electronics
    Engineering at North State University. His research focuses on the areas of experimental
    design and data analysis of complex simulation models and blockchain. He is the
    director of the ICE blockchain lab, as the editor in chief of Journal of Blockchain
    Research and the associate editor of ACM TOC. His email is hwan4@ncsu.edu and
    his website is https://www.ncsu.edu/people/hwan4/


    YING HUANG is a Ph.D. student in the Operations Research Graduate Program at North
    State University. His research interests include simulation and blockchain technologies.
    His e-mail address is yhuang43@ncsu.edu.


    KEJUN LI is a Ph.D. student in the Department of Industrial and Systems Engineering
    at North State University. His research interests include applied probability,
    simulation, game theory, and blockchain technologies. His e-mail address is kli15@ncsu.edu.


