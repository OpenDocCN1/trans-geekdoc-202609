    K.-H. Bae, B. Feng, S. Sim, S. Lazarovska-Molnar, Z. Zheng, T. Roeder, and R.
    Thiesing, 编


    # 区块链：从运筹学角度的视角


    万虹 Hong Wan

    李可军 Kejun Li

    黄颖 Yining Huang


    工业与系统工程系

    北卡罗来纳州立大学

    111 Main Drive

    Raleigh, NC 27607, USA


    运筹学研究生项目

    北卡罗来纳州立大学

    2500 Stinson Drive

    Raleigh, NC 27607, USA


    # 摘要


    区块链是一种分布式、仅追加的数字账本（数据库）。自从加密货币出现以来，该技术引起了广泛关注，各业务领域的区块链应用也日益增加。然而，对于模拟和运筹学社区的许多成员来说，这一概念仍然很新。在教程中，我们介绍了区块链技术，并回顾了其前沿的与数据相关的研究。对于模拟、系统分析和数据科学的研究人员来说，这存在着令人兴奋的机遇。


    # 1 引言


    区块链是比特币和其他加密货币的底层技术。自2017年以来，它引起了公众的关注。当时，比特币作为一种安全的记录共享系统，区块链被其信者视为一种解决方案或“互联网的未来”，也被怀疑者所审视。事实上，区块链技术在许多领域都有广泛的应用，但它并不是所有问题的唯一（更优）解决方案。


    区块链从字面上讲是区块的链。这里的区块由一定量的数据以及数据相互连接的链组成。更具体地说，它是一种基于共识的点对点分布式网络，“具有一个不断增长的记录列表（链），称为区块，它们使用密码学进行链接”（维基百科
    2020）。每个区块包含一个指定区块顺序的索引；一个记录区块添加近似时间的时间戳；数据；以及当前区块和前一个区块的哈希值（图1）。哈希是加密函数的输出，它将有意义的字符串转换为无意义的固定长度的字母数字字符串。区块
    $k$ 的哈希输入包括上述区块、区块 $k$ 的数据以及 $k-1$ 的哈希值。哈希值对输入非常敏感——输入的任何变化都会导致完全不同的哈希值，这使得区块链具有不可验证性。哈希函数是区块链安全的支柱，将在第3节中详细讨论。


    与传统的中心化网络不同。首先，数据（区块内）是不可篡变的。具体来说，如果一个区块被更改，其后的所有区块都会失效，因为它们的前一个区块的哈希值将无效。其次，具有共识的分布式网络允许用户（授权用户）相互通信以广播新区块、同步网络状态并下载当前数据库。数据和连接通道的冗余使得区块链对节点故障更具容忍性。凭借这些特性，链越长就越难被攻击以及在不被发现的情况下更改区块，这使得区块链更加可靠（Nakamoto
    et al. 2008）。为了更好地理解区块链系统，我们鼓励读者在 Blockchain Demo 上探索区块链的交互式演示。


