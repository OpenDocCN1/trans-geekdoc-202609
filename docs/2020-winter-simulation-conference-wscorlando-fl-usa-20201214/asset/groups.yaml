    # 5 区块链系统的系统分析


    在本节中，我们从系统和数据的角度回顾了最近的区块链研究。我们的讨论重点在三个主题：区块链系统的仿真表征（第5.1 节）、理解不同节点间交互的博弈论方法（第5.2
    节）以及用于区块链及区块链中的机器学习（第5.3 节）。


    # Wan, Huang, and Li


    # 5.1 区块链系统的仿真研究


    最近，我们看到许多与仿真相关的区块链研究。目前的研究主要关注加密货币的挖掘以及区块链仿真模型的可扩展性。此外，还提出了许多仿真器作为平台，以评估区块链在不同条件/攻击下的性能。我们在本节中回顾了相关文献。


    ## 5.1.1 离散事件仿真


    Allaby 和 van Moorsel（2019）提出了一个带有交易的事件驱动模型，并强调了通过 Pow 创建区块。Aoki 等人（2019）调用了区块生成、区块传播以及消息收发等事件。Menon
    等人（2019）建立了一个队列模型来分析区块链仿真中内存和内存池的真实行为。为了研究大规模区块链网络，Wang 等人（2018）收集并定义了若干指标来量化区块链的质量。Miller
    和 Jansen（2015）在他们的工作中实现了单台机器上数千个比特币节点的可扩展执行，并允许拒绝服务攻击以演示该仿真器。Gervais 等人（2016）研究了比特币仿真器的最优对抗策略，以分析不同配置的安全性和性能。Göbel
    等人（2016）使用离散事件仿真研究了矿工之间存在通信延迟的网络中的自矿攻击。Fytik 等人（2020）提出了一种区块链仿真器，该器利用共识协议的通用表示，提供了共识协议在各种网络条件下的性能见解。


    ## 5.1.2 基于代理的仿真


    Kaligoda 和 Macac（2018）通过阐述系统的关键方面和功能，提出了建模区块链仿真的通用框架。Coello 和 Marches（2016）通过包含异构代理（包括比特币交易价格）的过程复制了挖掘过程的经济性。Rosa
