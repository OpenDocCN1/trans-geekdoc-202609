    # Wan, Huang, and Li


    ## B


    ### 去中心化

    所有参与者的访问性、可用性和透明度；所有节点间账本状态一致；抗审查性


    ### 可扩展性

    与账本负载能力、吞吐量和交易处理延迟相关的非功能性需求


    ![](img/67ff1e627b551345b7c5b3a95cc9fd03_3_0.png)


    ## A


    ### 安全

    通过内置机制维护账本完整性的能力


    ## C


    图 2：区块链可扩展性三难题 (ReverseAcid 2018)。


    ## 2.2 共识机制


    共识是一种在分布式系统的不同节点/参与者之间达成一致的算法，用于解决拜庭将军问题 (Lamport et al. 2019)，处理提供虚信息的恶意行为。自比特币发明以来已经有了许多共识机制。其中大多数是基于工作量证明或权益证明的。


    - 工作量证明 (PoW) 是包括比特币在内的大多数加密货币采用的共识。在此机制中，参与者（即矿工）相互竞争，通过密码哈希函数进行暴力搜索来解决一个复杂的计算谜题。这是一种概率机制，矿工的获胜概率与其算力成正比。胜利者将获得添加下一个区块并收集交易费的权利，并获得奖励（通常是一定数量的加密货币）。矿工以能量浪费为代价维护系统安全。PoW
    是首个为区块链开发的共识，具有公平性和安全性。然而，它既慢又昂贵，而且研究表明该机制无法防止矿工的垄断。

    - 权益证明 (PoS) 是另一种广泛使用的共识，与 PoW 互补。下一个区块通过准随机过程选择，该过程取决于参与者持有的权益而非算力。这种机制最早应用于
    Peercoin (Hao and Nadal 2012)。PoS 在效率（无论是时间还是能量）上都比 PoW 高得多。然而，基于 PoS 的系统面临“无质风险”（nothing-at-stake）问题，没有任何权益的节点可能会表现出恶意行为，因为她无任何损失。


    除了这两个众知的共识之外，最近还提出了许多针对不同信任级别和系统要求的算法 (MingXiao et al. 2017; Banakan et al. 2020)。


    # 3 比特币与以太坊：挖矿与智能合约


    本节介绍了比特币和以太坊系统，这是最著名的两个公共无许可区块链应用 (Nakamoto et al. 2008; Wood et al. 2014)。这两个平台占据了全球算力的
    70% 以上 (Coinmarketcap 2020)，适合作为解释区块链系统和术语的示例。在第 3.1 节中，我们详细介绍了比特币的工作原理和挖矿过程。3.2
    节讨论了以太坊，它是一个数字货币平台，还通过智能合约允许各种区块链技术的实现。事实上，以太坊用户已经应用智能合约创建了去中心化自治组织 (DAO)。


    ## 3.1 比特币与挖矿过程


    比特币（以及其他加密货币）与传统货币最大的区别在于前者没有“发行者”（政府或组织）来背书货币价值、验证交易和监管金融系统。因此，加密货币必须具备：(1) 一种保护每个账户的安全算法，使他人无法花费你的资金；以及
    (2) 一种维持系统运行并避免恶意行为的自我调节机制。为了安全，比特币使用了公钥加密（或非对称加密）。参见 Huh et al. (2017)。比特币没有物理形式，但有每个账户（节点）的交易和余额记录。每个账户都关联一个公钥和一个私钥，两者的关系类似于电子邮件地址和密码。公钥可以在网络中传播，而私钥允许所有者访问资金。挖矿是一种支持交易日常运行的独特机制，大多数加密货币都需要能够添加区块的权限。当
    A 想要支付给 B 时，需要验证 A 的账户有足够的资金，从 A 的账户中扣除一个比特币并添加到 B 的账户。交易费是奖励给 A（或 B）的。创建一个有效的区块，参与者（矿工）需要：


    1. 找到一个幸运数字 (nonce)，

    2. 将交易列表作为输入字符串进行连接，并

    3. 应用 SHA-256 哈希函数生成此输出，


    使得 256 位哈希函数落在一个相对于较大输出较小的空间内。在这种情况下，nonce 必须满足以下不等式：


    > Hash(nonce)|上一个区块哈希|txn| < 目标值


    所有矿工竞争通过暴力搜索来解决 PoW 哈希以达成共识。每个节点的获胜概率与其算力成比。一旦矿工发现奖励，他将将其广播到整个网络进行验证。如果新区块被大多数矿工验证，该区块将被正式添加到区块链中，创建者获得奖励（一定数量的比特币）和交易费。参见
    Narayanan et al. (2016) 了解挖矿过程的细节。


    ## 3.2 以太坊与智能合约


    以太坊是一个数字货币平台，还通过智能合约允许各种区块链技术的实现。事实上，以太坊用户已经应用智能合约创建了去中心化自治组织 (DAO)。

