    # Wan, Huang, and Li


    # 5.1 Simulation Study of Blockchain Systems


    Recently, we see many simulation-related blockchain research appear. The current
    study mainly focuses on the mining of cryptocurrencies and the scalability of
    blockchain simulation models. Also, numerous simulators are proposed as platforms
    to evaluate the performance of blockchains under different conditions/attacks.
    We reviewed the related literature in this session.


    # 5.1.1 Discrete-Event Simulation


    Allaby and van Moorsel (2019) proposed an event-driven model with transactions
    and emphasized on the block creation through Pow. Aoki et al. (2019) invoked events
    of block generation, block propagation, and message transmission/reception. Menon
    et al. (2019) built a queuing model to analyze the realistic behaviors of a memory
    and a memory pool for blockchain simulation. To investigate the large-scale blockchain
    networks, Wang et al. (2018) collected and defined a number of metrics to quantify
    the quality of blockchain. Miller and Jansen (2015) enabled the scalable execution
    of thousands of bitcoin nodes on a single machine in their work and enabled the
    denial-of-service attack to demonstrate the simulator. Gervais et al. (2016) studied
    optimal adversarial strategies for bitcoin simulator to analyze the security and
    performance of different configurations. Göbel et al. (2016) used \u00e9u2001
    discrete-event simulation to study the self-mining attack on a network with communication
    delay between miners. Fytik et al. (2020) presented a blockchain simulator that
    utilizes a generalized representation of consensus protocols, providing insights
    into the performance of the consensus protocols under various networking conditions.


    # 5.1.2 Agent-Based Simulation


    Kaligoda and Macac (2018) proposed a generalized framework of modeling blockchain
    simulation by illustrating the essential aspects and functioning of the system.
    Coello and Marches (2016) reproduced the economy of the mining process with heterogeneous
    agents including the bitcoin transactions prices. Rosa et al. (2019) developed
    a security attack testing framework by exploiting parallel and distributed simulation
    techniques with extended scalability. Inspired by the design of algorithmic trading
    and reinforcement learning systems, Chitra et al. (2019) proposed an agent-based
    simulation to model censorship properties in PoW chains. Their results illustrated
    how endogenous design choices affect practical performance and how simulations
    can interact with exogenous data. Brousmiche et al. (2018) built an agent-based
    framework for simulating local market place integrating consumption/production
    behavior and interacting with a private blockchain. Bottone et al. (2018) developed
    an expandable multi-agent simulator for a block-free and fee-less ledger, which
    they employed NetLogo to provide a 3D visualization of the Tangle (Popov 2016).


    # 5.1.3 Others


    Goswami (2017) discussed the factors that limit the scalability of blockchains
    by providing a comparative analysis of several blockchain parameters with real-time
    data. Alsahan et al. (2020) adopted the lightweight virtualization technique for
    constructing a simulation model with high speed and large scalability. The impact
    of affecting difficulty levels was also studied, as well as fork occurrences were
    evaluated. Yaaserasinghelage et al. (2017) used architectural modeling and simulation
    to measure the latency in blockchain systems under different configurations. Long
    et al. (2019) developed a hybrid (discrete-event and agent-based) supply chain
    simulation model to recreate the supply chain operations, which was integrated
    by an Ethereum-like blockchain with different visibility levels through the same
    software connector.'
