    # 2.1 Blockchain Types and Trade-off among Performance Measures


    Note that a blockchain is public or private is independent of whether it is permitted
    or not. As discussed in Chris Jaikan''s testimony to congress: “Discussing a blockchain
    as public or private refers to the level of freedom users have to create identities
    and read data on blockchain. Discussing a blockchain as permitted or permissionless
    refers to the level of access the user would have on that blockchain.” (Jaikan
    2017). Table 1 classifies blockchains into four types based on these two independent
    properties.


    Table 1: Comparison of different blockchain categories (+ represents desired properties,
    ~ represents neutral, – shortcomings). (Parsons 2018)


    | Public-Permissioned | Private-Permissioned (Consortium) |

    | --- | --- |

    | + Good scaling | + Good scaling |

    | ~ Private → Public ecosystem | ~ Completely isolated ecosystem |

    | - Centralized | - Centralized |

    | + Independently verifiable | - Not independently verifiable |

    | - Not implemented | + Implemented by Hyperledger, etc. |

    | Public-Permissionless | Private-Permissionless |

    | - Poor scaling | Poor scaling |

    | ~ Completely public ecosystem | ~ Private → Public ecosystem |

    | + Distributed | + Distributed |

    | + Independently verifiable | - Not independently verifiable |

    | + Implemented by bitcoin, Ethereum, etc. | - Not implemented |


    Most of the cryptocurrencies use permission and permissionless blockchains (Section
    3). Private and permissioned (consortium) chains are used by individual enterprise
    and collaborations of businesses. Customized platforms, such as Hyperledger Fabric
    by IBM (Linux Foundation 2020), have been developed to facilitate enterprise blockchain
    implementation (Section 4). Between the two ends of the spectrum, the public and
    permissionless chain limit who can access data, which fits for internal sharing
    and auditing data. The public and permissioned only allow a subset of users to
    validate the transactions and add blocks, which can be used in asset management
    like real estate and intellectual properties (Martin 2018). The later categories
    are still in exploring stage.\ There are three major measurements of blockchains:
    scalability, security, and decentralization. Here scalability refers to the network''s
    ability to handle growth, security the attack resistance, and decentralization
    the degree of synchronization, and fairness among all nodes. In Figure 2, the
    trade-off among these three is called the scalability trilemma, which makes it
    hard to maximize two without sacrificing the third. For example, in public and
    permissionless blockchains, all peers maintain replicas of the full ledger, which
    ensures the system''s security and reliability. However, as the degree of decentralization
    increases (i.e., more peers involved), it will constrain the network''s throughput.
    Among the four categories, the public and permissionless chain has the most decentralized
    structure and assumes no trust. The private and permissioned chain, on the other
    hand, has the most centralized architecture and the highest level of trust among
    users and is widely used by individual enterprise and collaborations of business.
    Table 1 summarizes the pros and cons of the four types of blockchains. The level
    of trust among users determines the optimal blockchain architecture and the consensus
    mechanism for each application.'
