  md: '# 6 DISCUSSIONS


    In this tutorial, we introduced the concept of blockchain, its categories, applications,
    and current research in simulation area. In this section, we will discuss the
    challenges of blockchain application and how, researchers in simulation and operations
    research society, can continue.

    Up this point, we have focused on the advantages of blockchain systems and their
    applications. It has many disadvantages compared to the traditional centralized
    system. However, blockchain is not a universal (better) solution for all scenarios.
    First, the mining processes for PoW blockchain are slow and energy-intensive.
    Meanwhile, blockchain''s decentralized architecture requires duplicate of computations
    and execution efforts for transaction. All of these lead to slow transaction speed
    (Huberman 2019). Currently, the bitcoin blockchain can guarantee only 4.6 transactions
    per second (TPS), and Ethereum with an average of 12 TPS. For, on the other hand,
    the value is around 24000 TPS Strelenko (2018). The slow transaction is the biggest
    bottleneck of cryptocurrency. Moreover, the blockchain data sharing is slower
    than a traditional decentralized database. Furthermore, the safety will be compromised
    if attackers possess the majority (more than 50%) of hashing power in the system,
    which makes small-size blockchains are not safe. Finally, the blockchain can only
    identify change, but cannot prevent initial data forgery. In within perishable
    food supply chain integrated with blockchain, low-quality products have false
    labels identified, the blockchain cannot screen them.


    When should blockchain be applied? For traditional (permissionless) blockchains,
    the answer is almost no cases except for cryptocurrency. For private and consortium
    chains, a centralized or decentralized database works and you can rely on a trusted
    third party, you do not need blockchain. The consortium should be considered when
    there is no or only partial trust toward a third party and/or each, for data validation,
    audition, and publishing monitors.


    While research by scientists have made significant progress on blockchain consensus,
    architecture and scalability, characterizing the blockchain as a complex system
    is still in an early stage. Sophisticated mathematical and simulation models are
    needed to capture individual behaviors and their interactions, as the system''s
    rules operate under different environments. Moreover, in current studies, nodes/agents
    all follow rules with almost no flexibility. Game theory can show light on optimal
    strategies under various constraints (or lack of them). The current game study
    is limited and constrained. We expect that the computational game approach that
    incorporates simulation and other numerical models will be an active research
    area. Thirdly, blockchain cannot be apart from data. The current data-related
    research is at the pioneer stage and usually just a direct application of one
    technology to another. A highly integrated infrastructure that combines data science
    and blockchain technology has great potential.


