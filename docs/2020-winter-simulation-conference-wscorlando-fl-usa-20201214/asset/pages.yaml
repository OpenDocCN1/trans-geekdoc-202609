    to decide the proper time to release the mining block. Kim (2018) focused on a
    new hybrid model named Blockchain Governance, which provides the stochastic framework
    to select the block to the chain. Biais et al. (2018) modeled the PoW blockchain
    protocol as a stochastic game and analyzed the equilibrium strategies of rational,
    strategic.


    # 5.3 Machine Learning in and for Blockchain


    Machine learning refers to the science of teaching the computer system to predict
    based on data without explicit programming. Its efficiency relies heavily on the
    quantity and quality of data. Blockchain technology has attracted data scientists''
    attention since allows highly customized data sharing without relying on a trusted
    party. On the other hand, machine learning algorithms are powerful tools for analyzing
    and optimizing blockchains. The combination of the two technologies can be a game-changer.


    Data privacy is a critical issue in the current digital society, especially for
    sensitive data in healthcare and finance. Blockchain framework keeps data safe
    through cryptography, and allows users, of a third party, to have full control
    of their shared data. Harris and Wagner (2019) presented a decentralized collaborative
    learning framework with blockchain. Chen et al. (2018) presented LearningChain,
    which applies a decentralized algorithmic stochastic gradient descent algorithm
    with differential privacy mechanism to preserve users'' privacy. To secure the
    shared data in federated learning, Zhu et al. (2018) proposed a blockchain-based
    privacy-preserving framework. Li et al. (2018) established a scheme to effectively
    collect data and securely share by using Ethereum blockchain and reinforcement
    learning. We expect more blockchain-based data sharing platform to emerge in the
    future.


    Machine learning methods prove to be effective in categorizing bitcoin transactions
    and predicting their price. Yin and Vatraap (2017) applied supervised learning
    and Akvera et al. (2019) proposed a data analysis approach to classify entities
    of transactions that may involve in criminal activities. Jourdain et al. (2019)
    classified entities of transactions into common categories with a gradient boosted
    decision algorithm. The classified entities of transactions are used to forecast
    the value of UTXOs and further predict the Bitcoin price. Akbari et al. (2018)
    used LSTM to forecast Bitcoin price with the stochastic blockchain. The concept
    of graph wavelet (Akbari et al. (2019)) introduced a new method by Abay et al.
    (2019) to a new graph model ChainNet. The topological features from all or multiple
    transactions are evaluated and the amount of transferred Bitcoin is characterized
    by ChainNet. McNally et al. (2018) performed comparison of recurrent neural network
    and short-term memory models in forecasting Bitcoin price. Lahmiri and Bekiros
    (2019) also implemented deep learning model to predict Bitcoin price, but applied
    a chaotic time series analysis.


    Furthermore, researchers are exploring the possibilities of applying machine learning
    technique to solve resource optimization problem. Lueng et al. (2018) employed
    a deep learning-based auction algorithm to optimize the allocation of edge resources
    to support mobile users among. Nguyen et al. (2020) applied reinforcement learning
    to determine the optimal offloading decisions for mobile users based on blockchain
    transactions. They also developed deep reinforcement learning algorithm by using
    deep Q-network. To find an optimal strategy without knowing much about the blockchain,
    Wang et al. (2019) adopted deep multi-agent reinforcement learning. In addition
    to computing resources, capital allocation can also be solved by machine learning
    to construct portfolios of cryptocurrencies (Alexandretti et al. 2018; Jiang and
    Liang 2019).


    A closer look at the issues of incorporating machine learning with blockchain
    technology, however, reveals some concerns. First, the current research focuses
    on financial sector, specifically, bitcoin mining and trading. In combining blockchain
    with data science, the current research is simply application of one technology
    to another. The benefit of using the blockchain is unclear. The mainly focus on
    using blockchain for data sharing, improving its property of safety and higher
    cost of cheating.'
