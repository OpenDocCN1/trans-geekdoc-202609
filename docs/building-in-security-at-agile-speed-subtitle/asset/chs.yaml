  \ SDL 的方式与组织 SDL 的要求相似，并满足了组织 SDL 的要求。 |\n| 结果与输出 | 关于是否可以包含或必须避免第三方代码的评估。 |\n|\
  \ 评审或完善的触发条件 | • 提议包含/使用的第三方代码.• 对使用的/包含的第三方代码已更改。 |\n\n**表 3.13**\n\n### **第三方代码中发现的问题补丁（升级或修复）**\
  \ |\n\n| 章节 | 详细信息 |\n| :--- | :--- |\n| 目的 | 第三方代码中的问题会变成整个系统或软件的问题。任务是应用软件升级（“补丁”）来修复由第三方生产软件的问题。\
  \ |\n| 前提条件 | 必须包含或使用第三方软件。并且在第三方软件中发现或公布了安全问题（漏洞）。 |\n| 完成定义 | 所有可能导致重大损害的现有漏洞补丁已修复，或其风险已被风险决策者接受。\
  \ |\n| 结果与输出 | 已应用软件补丁或记录了风险决策。 |\n| 评审或完善的触发条件 | • 包含/使用的第三方代码发布了问题.• 包含/使用的第三方代码发现了问题。\
  \ |\n\n**表 3.14**\n\n### **功能性安全测试** |\n\n| 章节 | 详细信息 |\n| :--- | :--- |\n| 目的 |\
  \ 对安全功能进行功能性测试，以确保这些功能按预期运行，并能够良好处理错误情况和边界情况。 |\n| 前提条件 | • 安全功能的已完成实现.• 一组旨在测试每个功能预期的全范围行为和错误处理的测试。\
  \ |\n| 完成定义 | 测试已成功完成。所有识别的问题已修复。 |\n| 结果与输出 | 错误的软件行为和不当的错误处理。 |\n\n\n\n\n\n| 评审或完善的触发器\
  \ | • 每当更改功能或特性时必须重新运行测试。• 必须重新运行测试以证明问题已修复且没有引入新问题。 |\n\n### 表 3.15\n|   | Web\
  \ 协议和服务动态测试 |\n| :--- | :--- |\n| 目的 | Web 协议和服务的动态测试使用专用工具识别漏洞和安全缺陷。 |\n| 前提条件\
  \ | • 软件中包含了 Web 协议和服务，且代码已充分充分完成，可以在预期的执行环境或相似环境中执行。 • 可用用于测试已构建的特定协议和服务的工具（扫描器等）。\
  \ |\n| 完成定义 | 测试成功完成。所有识别出的问题均已修复。 |\n| 结果与输出 | 软件行为错误。软件中的漏洞和缺陷。 |\n| 评审或完善的触发器\
  \ | • 每当引入更改时必须重新运行测试。 • 必须重新运行测试以证明问题已修复且没有引入新问题。 |\n\n### 表 3.16\n|   | 其他输入安全测试（例如，模糊测试）\
  \ |\n| :--- | :--- |\n| 目的 | 其他输入安全测试使用模糊测试以及可能的其他专用工具，识别在输入畸形数据时的软件错误行为。 |\n| 前提条件\
  \ | • 软件中包含了非 Web 输入，且代码已充分完成，可以在预期的执行环境或相似环境中执行。 • 可用能够向每个特定程序输入发送畸形数据的模糊器（fuzzers）。\
  \ |\n| 完成定义 | 测试成功完成。所有识别出的问题均已修复。 |\n| 结果与输出 | 软件行为错误。软件中的漏洞和缺陷。 |\n| 评审或完善的触发器\
  \ | • 每当引入更改时必须重新运行测试。• 必须重新运行测试以证明问题已修复且没有引入新问题。 |\n\n### 表 3.17\n|   | 攻击与渗透测试\
  \ |\n| :--- | :--- |\n| 目的 | • 手动攻击和渗透测试用于发现难以通过商业和开源漏洞发现工具自动发现的安全问题。 • 攻击和渗透测试还能证明/反驳威胁模型中识别的安全假设的正确性和安全需求的充分性。\
  \ |\n| 前提条件 | 软件能够在其预期环境中执行，以及该预期执行环境或准确的相似环境。 |\n| 完成定义 | 测试成功完成。所有识别出的问题均已修复。\
  \ |\n| 结果与输出 | 软件中的漏洞和缺陷。通过成功的攻击提供问题存在的证明。 |\n| 评审或完善的触发器 | • 每当引入更改时必须重新运行测试。•\
  \ 必须重新运行测试以证明问题已修复且没有引入新问题。 |\n\n### 表 3.18\n|   | 评估与威胁模型构建/发布/部署/运行链 |\n| :---\
  \ | :--- |\n| 目的 | • 确保工具和管理访问不会为攻击者提供满足安全态势需求的手段。 • 确保发布的软件仅包含预期的软件。 |\n| 前提条件\
  \ | 用于构建、打包、发布、部署和运行软件的方法、流程和技术。 |\n| 完成定义 | 已识别出一套全面的防御措施（即完成的威胁模型。请参见“开始威胁模型”和“完善威胁模型”活动）。\
  \ |\n| 结果与输出 | 一套安全需求和控制，实施后可以关闭或缓解潜在的攻击者手段（威胁）。 |\n| 评审或完善的触发器 | • 工具或技术变更。 • 管理员数量/管理访问类型/点的变更。\
  \ |\n\n> 同样，每个安全活动并不适用于每个项目。项目在规模、关键性和范围上存在差异。一个有效的 SDL 将进行扩展以考虑这些差异。我们提供了七个决定性问题作为一个公式，用于将正确的安全任务分配给适当的项目。\n\
  \n> 跳出这里列出的特定问题，建立一套针对特定项目的问题来确定每个项目的适当安全活动，事实证明不仅能确保每个项目都执行了正确的安全，还能回答典型的项目管理问题：\n\
  \n> “我们需要做什么？”\n> “我们必须执行的最少活动集是什么？”\n\n> 以直接且易于理解的方式提出你的 SDL 决定性问题，将在安全团队和项目团队之间建立信任。最终，信任是构建安全软件的关键，这与安全编码培训和严谨的安全测试一样重要。必须从生命周期的开始就考虑安全，以便将其纳入设计。编写代码必须最大限度地减少漏洞并保护攻击面。程序的功能和无漏洞性必须通过一系列彻底的测试（架构、设计、代码、测试）得到证明。\n\
  \n> 安全软件必须满足：\n> • 免于可以被恶意操纵的错误——因此，无漏洞\n> • 包含客户[利益相关者]其预期用例所需的安全功能\n> • 具有自保护能力——软件必须抵御针对软件的各种类型攻击\n\
  > • “良好地失败”，即以能够最小化攻击成功的后果的方式发生失败\n> • 以合理的“闭式”默认设置进行安装\n\n> 未能满足这些指令中的每一项都意味着软件未能交付其功能，意味着未能在一个充斥着持续数字攻击的世界中交付本应隐含的安全性。必须关注两条重要且相互关联的路径：构建正确的功能使软件能够保护自身和用户，以及消除在软件构建过程中不可避免地进入软件的错误。不正确的实现（逻辑错误）必须被捕获并移除。任何引入的漏洞都必须被发现并消除。\n\
  \n> 安全开发生命周期是一个基于关系的真实世界过程，团队通过该过程交付安全软件。（*Core Software Security,* 第 321-323 页）\n\
  \n# 第 4 章\n# 通过威胁建模实现安全设计\n\n## 4.1 威胁建模是基础\n\n在安全开发生命周期（SDLs）中，为安全设计提供多个活动是常见做法。通常，这些活动的每个都使用不同的名称和范围，并明确说明了时间：第一次参与将是“架构风险评估”。如果在评审期间发现了潜在的安全风险，将安排“架构评审”，最终完成威胁模型，并可能通过“设计评审”完成安全设计任务。不同的\
  \ SDL 对设计活动的命名可能不同，并可能仅被拆分为三个或两个活动，或者可能比我列出的四个更多。因此，在安全设计活动方面仍然存在显著的 SDL 差异。\n\n\
  \n\n\n\n在《核心软件安全：源头安全》（*Core Software Security: Security at the Source*）#中，我们提供了上述四项活动，尽管我们也提供了一系列条件和触发因素，帮助人员识别适用于特定变化的活动，同时消除无关的活动。我们将这些称为“七个决定性问题”（第\
  \ 9 章：将 `SDL` 框架应用于现实世界，第 277-278 页 `第 9.2.1 节`]）。我们的活动符合我们编写此书时的软件安全思维。\n\n自从出版《核心软件安全》以来，我们重新审视了这些假设；我们相信，通过更清晰地理解我们想要的目标，可以显著降低安全设计过程的复杂性。从那时起，通过更简单的方法提高了效率。正如\
  \ Brook 在《网络安全架构师的秘密》中所提到的：^†\n\n> 攻击及其防御是安全架构师为软件设计和实现带来的价值主张——即开发、工程或研发。多年来，“威胁建模”有许多不同的名称：\n\
  > • 架构风险评估 (`ARA`)\n> • 架构评审或安全架构评审\n> • 安全架构评估\n> • 安全工程\n> • [`安全`]设计评审\n> • 安全设计检查点\n\
  > • 安全需求\n\n\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\n\\*Ransome, J. and\
  \ Misra, A. (2014). *Core Software Security: Security at the Source.* Boca Raton\
  \ (FL): CRC Press/Taylor & Francis Group.\n\n†Schoenfield, B. S. E. (2015). *Securing\
  \ Systems: Applied Security Architecture and Threat Models.* Boca Raton (FL): CRC\
  \ Press/Taylor & Francis Group.\n\n或许可能还有其他几个已经消失在历史长河中的术语。\n\n虽然从业务人员完全有权不同意我们将上述所有在流程中看似截然不同的术语合并为一种分析，但我意识到威胁建模分析实际上是这些表面上看似不同分析的基础。威胁建模是从业务人员必须应用的方法，无论安全分析发生在开发的何一阶段，无论项目或工作是处于完成、初始还是进行中状态。\n\
  \n在好几年里，我作为 `Intel®` 的软件安全`首席工程师`（`Principal Engineer`），其职责包括担任 `Intel` 的软件安全评审小组\
  \ `SAFE`（安全架构论坛）。我们从最初概念到设计完成对项目进行了 string 了评审。在 `Intel`，有几个安全评审停点；在开发期间的这些不同评审点，基本上是同一组人员会跨项目参与其中。\n\
  \n当然，我是全程参与的，试图将我对安全架构的最优理解应用于每一个接手的项目。\n\n### 威胁建模的演进\n\n自从出版《核心软件安全》以来，我们重新审视了这些假设；我们相信，通过更清晰地理解我们想要的目标，可以显著降低安全设计过程的复杂性。从那时起，通过更简单的方法提高了效率。正如\
  \ Brook 在《网络安全架构师的秘密》中所提到的：\n\n> 攻击及其防御是安全架构师为软件设计和实现带来的价值主张——即开发、工程或研发。多年来，“威胁建模”有许多不同的名称：\n\
  > • 架构风险评估 (`ARA`)\n> • 架构评审或安全架构评审\n> • 安全架构评估\n> • 安全工程\n> • [`安全`]设计评审\n> • 安全设计检查点\n\
  > • 安全需求\n\n虽然从业务人员完全有权不同意我们将上述所有在流程中看似截然不同的术语合并为一种分析，但我意识到威胁建模分析实际上是这些表面上看似不同分析的基础。威胁建模是从业务人员必须应用的方法，无论安全分析发生在开发的何一阶段，无论项目或工作是处于完成、初始还是进行中状态。\n\
  \n在好几年里，我作为 `Intel®` 的软件安全`首席工程师`（`Principal Engineer`），其职责包括担任 `Intel` 的软件安全评审小组\
  \ `SAFE`（安全架构论坛）。我们从最初概念到设计完成对项目进行了评审。在 `Intel`，有几个安全评审停点；在开发期间的这些不同评审点，基本上是同一组人员会跨项目参与其中。\n\
  \n当然，我是全程参与的，试图将我对安全架构的最优理解应用于每一个接手的项目。\n\n### 与现代开发的集成\n\n或许可能还有其他几个已经消失在历史长河中的术语。\n\
  \n区分安全设计活动的各个方面并不能良好集成——要求开发者执行独立概念化的架构和设计活动被证明是过于混乱的。开发者随后会为该活动应该产生什么以及对其有什么价值而苦恼。\n\
  \n简化为核心要素允许威胁建模过程作为离散的参与、在合适的分析水平展开，并与持续软件开发良好集成。（Brook 注意到，即使是我们经验最丰富的 `SAFE` 委员会成员也会混淆架构风险评审、架构评审和威胁建模之间的区别。我们经常依靠流程协调员来引导我们回到正轨。）\n\
  \n换句话说，对于匹配敏捷（`Agile`）和 DevOps 来说非常重要，没有理由通过一系列独立命名的活动来复杂化问题。如今，我们的实践不再区分不同的活动，而是强调威胁建模的主导地位。\n\
  \n\n\n\n\n- 虽然对商业防御厂商表示充分尊重，但这些产品本质上是软件，它们必然存在缺陷。\n- 防御措施通常能做得尚可，但并不完美。尽管厂商在营销活动中可能这样声称，但它们并非万能药。\n\
  - 为了保持系统的可防御性，我们必须尝试避免已知漏洞，攻击者可能会利用这些漏洞直接穿过我们周全的防御。\n\n### 现实生活示例\n\n想象一个企业客户识别系统，其标识符是基于相当简单的算法计算出的值，而这些数据是经过排序的，因此是可预测的。想象一下，该标识符被用于整个复杂系统，以区分客户之间的处理流和数据流。客户负责保护由系统所有者分配的值。我们并不是在编造事实。\n\
  \n如果攻击者能够发现（或窃取）一个相对较小的标识符群体，利用如今的工具，他们将很快地反向工程出该数值的构建方法。这意味着攻击者现在拥有了巨大的筹码，不仅可以进入系统，还可以关联处理流（即每个客户的数据）。这太糟糕了！当客户数据越关键或越敏感，负面影响的潜力就越大。\n\
  \n攻击者长时间未能误用这一漏洞（表面上的失败），可能意味着系统所有者运气很好。运气！= 安全。或者攻击者仅仅未被发现，或者他们很好地隐藏了入侵痕迹。我们曾见过多年多年未被发现的攻击。\n\
  \n这个例子是一个设计缺陷。这正是基于威胁建模的安全设计实践试图防止此类问题进入发布版本并部署到服务中的原因。存在替代的设计选择，可以使得获得这种筹码变得困难得多，并且更容易进行防御。此外，更强大的设计在任何特定客户或系统任何部分被成功破解时，具有更强的韧性。可防御系统的一个理想特性是：即使是复杂的、针对性的破解也能被遏制，并将损害降到最低，从而确保在攻击中存活。\n\
  \n## 4.2 安全设计原理\n\n正如《网络安全架构师的秘密》（*Secrets of a Cyber Security Architect*）中所述：\n\
  \n> 我们非常确定地知道，考虑到如今的反向工程工具，放置在软件可执行二进制文件中的凭据（密钥）相对容易被发现。对于涉及在第三方环境中执行的商业软件——例如，由购买者运行的商业现货（COTS）软件——将隐藏在可执行文件静态数据中的密钥分发已被证明是一个非常糟糕的设计选择。\n\
  \n> 放置在可执行数据区域的密钥经常被攻击者和研究人员发现。一旦密钥被攻击者掌握（无论是通过发现还是已发表的研究），攻击者就有能力成功地利用该密钥来应对其本\
  \ intended 保护的任何挑战。如果有 10,000 份该可执行文件正在运行，攻击者可以撤销所有 10,000 个安装中至少一个方面的安全性。不幸的是。\n\
  \n\n\n\n因此，作者们放弃了一系列安全设计活动，取而代之的是在不断具体的特定层级上进行威胁建模。我们从一个非常高的水平开始威胁建模：针对此类系统，典型且成功的攻击手段有哪些？这些攻击者的最终目标是什么？我们回答以下问题：\n\
  \n* 谁可能会攻击此软件？ \n* 攻击者过去对这类类型的系统/软件以及类似的技术是如何获得成功的？\n* 如果成功了，攻击者将获得什么？\n* 攻破系统将对系统及其利益相关者造成什么伤害？\n\
  * 我们可以做什么来阻碍这些预期的攻击——即预防、增加难度、减轻影响以及在过程中发现攻击（因此，防御）？\n\n初期的分析不需要非常详尽。在这一早期且非常高水平的阶段，不需要彻底理解每一种攻击。只要有一个例子能引导我们理解可能需要的防御类型，就足够了。我们进行分析是为了寻找通用的指导准针和方向。细节将在稍后考虑。威胁模型将不断不断完善。\n\
  \n随着满足系统目标的结构被定义，我们将根据结构（架构）方面的考虑重新审视威胁模型。此时架构尚不需要完全确定。\n\n* 哪些架构提供了适当的安全保障？ \n\
  * 是否需要结构性的防御？哪些防御将被消耗或继承？\n\n在我们进行架构设计时，我们会弄清楚需要构建和/或包含哪些安全结构。安全架构作为整个架构创建过程中不可或缺的一部分而进行；安全架构师是架构团队的关键成员。\n\
  \n当安全架构被视为某个孤立的、分离的过程时，它会变得时机不恰，并与不断展开的架构产生脱节。这会导致诸如影响，例如在所有架构决策都做出之后（可能在集成和编码开始之后）才尝试提供安全结构。在那个时候，系统尚未被考虑的安全功能可能无法完全集成到已经完成的架构中，也就是说，它们是“补上去”的，而不是“内置”的。另一个典型影响将是重做，因为在没有考虑安全的情况下做出的假设可能需要重新思考，进行中的工作将包含无法容忍的弱点等。\n\
  \n相反，我们看到，通过将安全视为整个规划和架构过程的必要条件之一，取得了巨大的成功，而不是将其视为特殊的、一次性的附加过程。放弃一系列离散的活动，转而将威胁建模及其相关的攻击和防御知识视为整个新软件制定和变更计划过程中的关键输入，这意味着安全被视为必须考虑的一部分。\n\
  \n这并不意味着安全总是获胜的，也就是说，总是优于其他必要条件。始终存在权衡，无论是安全还是其他方面。需要做出决策，希望是基于合理的风险分析。（关于风险方法的更深入探讨，可以在*确保系统安全：应用安全架构与威胁模型*的第\
  \ 4 章中找到。根据我们目前的技术，人们可以达到的最佳水平是为决策者提供可靠的风险建议，他们根据这些建议在安全与其他业务和技术需求之间做出适当决策。）\n\n\
  在某个时刻，人们必须实际构建架构，无论是通过现有系统或新系统的集成和/或编码。无论编码过程是与架构并行运行，还是它们被视为独立的“阶段”，事实都是如此——即系统必须通过所使用的任何软件开发生命周期（SDLC）方法（如果有的话）来实现。\n\
  \n随着主要架构决策的做出，系统结构变得相对明确。与此同时，并且（我们希望如此）作为结构化和规划过程中不可或缺的一部分，我们完善并修订随附的威胁模型。我们完善是为了理解成功的攻破必须完成的步骤，从而指导我们如何防御这组可能发生的攻击中的每一步。\n\
  \n随着对结构的理解展开，攻击场景（通常称为“威胁”）变得具体得多，利用了我们的知识以及诸如 MITRE ATTCK 和常见攻击模式枚举与分类（CAPEC）等资源。（关于如何使用这些资源的更多信息，可以在第\
  \ 5 章中找到，*确保系统安全：应用安全架构与威胁模型*第 5.1 节，第 116-123 页。）\n\n我们不需要发明新的攻击。但我们假设，尽管典型的漏洞目前不存在，但它们在未来的某个时刻将会出现。这是威胁建模中一个非常关键的部分，但为什么要担心那些尚未发生的问题呢？\n\
  \n我们针对已知和预期的攻击建立防御。这可能是威胁建模中最被误解的点之一——基于对类似问题的发现来预判未来。某些类型的安全缺陷会定期出现。例如，跨站脚本（XSS）错误无论使用何种语言编写的\
  \ Web 应用程序中无处不在。尽管尽力消除这些，内存漏洞在 C/C++（以及其他处理内存的语言）中仍然存在。\n\n***\n\n因此，缓解明天的 `XSS`\
  \ 或 C 缓冲区溢出并不夸张。存在许多反复出现的问题类型。我们不需要盲目远距离寻找。事实上，有几个公共资源致力于这些领域：\n\n* MITRE 的 ATT&CK\
  \ 攻击技术集合\n* MITRE 的 CAPEC 软件安全问题数据库\n* 常见漏洞枚举 (CWE)\n\n\n\n简单来说，必须预期软件会包含错误，如果现在没有被发现或存在，那么随着更改的进行它们将会出现。目前未知的错误最终会被发现，而新错误最终将会产生（特别是那些在所用技术中反复出现的错误）。某些错误将为各种类型的攻击者提供杠杆，因此会产生安全后果。\n\
  \n> “我们开发复杂软件的能力远远超过了我们在合理的财务限制内证明其正确性或进行满意的测试的能力 . . . 复杂软件难以编写和测试，因此将包含许多无意的 `bugs`。要确定地判断某段软件完全没有错误是极其困难且昂贵的。鉴于分配给开发和测试的资金相对较少\
  \ . . . 软件，我们可以安全地认为这在实际上是不可能的。”\n\n> 尽管如此，软件仍然存在漏洞，并且在可预见的未来将继续存在。事实是，人类的努力充满了错误，而软件的创建和实现也是一种人类的努力。无论漏洞是因为糟糕的设计选择还是实现过程造成的，即使通过了最严谨的安全开发生命周期（`SDL`，或安全软件开发生命周期\
  \ `S-SDLC`）并经过了同样严谨的验证，错误之后仍会存在。正如亚历山大·波普著名的文字所写的那样：“人皆有错 . . .，”（*Secrets*，第 56\
  \ 页）\n\n***\n\nRivest, R. L. and Wack, J. P. (n.d.). “关于投票系统中‘软件独立性’的概念。”Cambridge\
  \ (MA): 马萨诸理工学院计算机科学与人工智能实验室 (MIT), 第 3-4 页。检索自 [`people.csail.mitedu/Rivest-Wack-On-The-Notion-of-Software-Independence-in-Voting-Systems.pdf`](https://people.csail.mitedu/)\n\
  \nPope, A. and Johnson, S. (1836). *The Poetical Works of Alexander Pope, Esq.,\
  \ to which is prefixed A Life of the Author,* Vol. 1. Bristol: J. Gladding & Co.,\
  \ p. 89.\n\n> 此外，分析师还会应用相关的过去漏洞/漏洞对，即使这些漏洞尚未在系统中被发现。重要的是要理解，即使是最严谨的测试，正如埃德格尔·迪杰斯特拉（Edsger\
  \ Dijkstra）著名的俏话所说，“证明了系统有漏洞，而不是证明它没有漏洞。”如果在所分析系统中的任何组件中存在过可利用的漏洞，尽管在包含的版本中已修复，那么分析必须假设在未来的某个点，这些组件中很可能会发现至少一些类似的问题。（*Secrets*，第\
  \ 75 页）\n\n由于错误是不可避免的，安全要求我们对它们进行计划。但如何为目前未知的错误计划呢？事实证明，某些类型的安全影响在特定技术中经常被发现。\n\n\
  例如，正如我们之前提到的，`C/C++` 编程语言必须直接处理程序（有时是系统）内存。因此，我们可以预期内存错误的发生。当使用 `C/C++` 时，我们必须假设最终会出现为攻击者提供杠杆的内存错误。即使是一些最稳健和成熟的\
  \ `SDL` 程序，仍然会偶尔发布包含允许安全影响的 `C/C++` 内存漏洞的软件。\n\n另一个例子是，尽管并不常见，但每个虚拟运行时环境都遭受过漏洞，该漏洞允许客户（虚拟化环境）中的代码逃逸并在宿主机环境中运行。这样做违反了对虚拟环境的保护预期。当攻击者可以提供将逃逸客户并在虚拟环境的宿主机运行时运行的代码时，攻击者的代码将以宿主机环境所需的更高权限运行。这非常糟糕。这通常意味着宿主机所支持的所有虚拟环境都将完全攻陷。\n\
  \n尽管虚拟环境编码人员尽了最大努力，客户逃逸虽然不常见但已经发生过。明智的做法是假设尽管目前可能没有已知的客户逃逸，在未来的某个点，将会出现。在威胁模型中，我们可以假设尽管目前可能没有已知的客户逃逸，最终在未来的某个点，将会出现（无论选择何种虚拟环境）。我们可以思考当此类逃逸出现时如何对其进行控制。以受限权限运行虚拟环境意味着即使发生了成功的逃逸，损害也可以限制在单个虚拟主机或类型。\n\
  \n当然，软件利益相关者可能会选择接受逃逸不会发生的风险，因为这些情况并不常见。对各种类型的漏洞得出合理的风险评估是威胁建模的关键输出之一。C 语言内存错误是常见的，假设它们不会出现是愚蠢的。经验表明，即使通过最严谨的\
  \ `SDL` 机制，此类错误仍然会泄漏。威胁建模必须考虑此类问题的发生概率，以及为减少这些问题所采取 `SDL` 措施。另一方面，相比之下客户逃逸非常少，这也必须被考虑。你会立即处理哪一个？\n\
  \n***\n\nDijkstra, E. (1969, October). NATO 科学委员会. 软件工程技术。NATO 科学委员会赞助会议报告，第 16\
  \ 页。意大利罗马。检索自 [`homepages.cs.ni.ac.uk/brian.randell/NATO/nato1969.pdf`](http://homepages.cs.ni.ac.uk/)\n\
  \n内存错误或客户逃逸可能导致系统、操作系统环境、运行时甚至整个类系统和网络的完全攻陷（取决于攻击者成功执行了哪些进一步破坏），因此从我们考虑的任何一种来看，最终的影响可能至关重要。对这三个角度（以及更多）的分析必须是威胁模型的一部分。在列出所用技术中发生的漏洞类型后，考虑：\n\
  \n- 根据公告和数据库（例如国家漏洞数据库 `NVD`）报告，每个问题的观察到的复发率是多少？\n- 在此案例中采用了哪些 `SDL` 活动（如果有）来捕获和或防止每个问题？\n\
  - 当每个问题被成功利用时，攻击者的潜在收益和系统利益相关者的潜在损害是什么？\n\n正如 Brook 在 *Secrets* 中所说：\n\n> 在实践中，当从业人员进行架构风险分析（`ARA`）或初始最终的安全审查（`SR`）时，审查人员将作为分析的一部分进行威胁建模：\n\
  \n>\n\n> • 谁会攻击这个系统？\n\n\n\n\n- 为了达到什么目的？\n- 使用了什么技术？\n- 通过什么向量？\n- 激发了哪些潜在条件？\n\
  - 造成了什么伤害？（第 71 页）\n\n让我们抛弃复杂的 `SDL` 设计时活动吧。我们希望你能够看到，在所有这些名称不同的活动背后，从业人员实际上是在以不同的具体程度和详尽程度进行威胁建模。随着开发的进行，我们根据根据当前的知识反复修订威胁模型，无论这些知识是设计时的结构化理解、通过尝试实现（编码）中获得的教训、通过验证获得的知识，还是对威胁“格局”的任何可观测变化（即产生了新的、相关的攻击技术）。威胁模型是一个活的文档，它反映了在威胁模型修订或审查时所获得的任何关于攻击和防御的理解。\n\
  \n## 4.3 分析技术\n\n希望通过上一个章节，你已经确信威胁建模无非（也非仅仅）是考虑攻击及其最佳防御措施对吗？从概念上讲，威胁建模并不特别晦涩。\n\n\
  事实上，威胁建模分析可以简化为以下简单步骤：\n\n- “将系统技术中已知的、成功的攻击\n- 应用到攻击者可能到达的系统节点\n- 评估潜在的（负面）影响\n\
  - 评估每个攻击场景的风险\n- 识别适当的防御\n- （有时，支持防御措施的实现)”\n\nBrook 的威胁建模课程吸引了数千名听者。大多数参与者都能迅速掌握上述步骤。课程通常以一个非技术示例开始：餐厅外卖送餐，送餐员收取费用。对于大多数人来说，识别谁和什么处于风险之中以及可能实施的攻击并不困难。\n\
  \n威胁模型的细微之处在于上述每一个步骤中：\n\n- 某些可能被尝试的相关攻击集合是什么？\n- 鉴于这组攻击，攻击者可以从哪里开始、如何开始？\n- 成功攻破可能产生什么影响？影响的评估是风险评分的关键输入。\n\
  - 哪些防御可以缓解那些被认为风险高到无法承受的攻击场景？\n\n主要问题是，这些每一个问题都存在依赖关系，每个问题的确定性答案与其他答案相互相关！例如，虽然可以确定一组攻击，但系统为攻击者暴露了哪些机会，特别是这些暴露点中哪些提供了相对较易的访问权限，将影响哪些攻击将是最可能的（至少在短期内）。相关攻击集合将部分由攻击者更容易获取的系统位点决定。通常，这些是某种类型的系统输入。暴露给较大群体的系统位点通常比暴露给较小群体的地方具有更高的被利用潜力。访问人数越多，其中某人尝试攻击接口的可能性就越大。显然，拥有数十亿人的互联网比未连接到任何网络的家用电脑要暴露得多。\n\
  \n可以发起攻击的位点被称为“攻击面”。威胁建模的关键步骤之一是列举系统提供的攻击面。攻击面通常映射到系统输入——即系统接受数据的地方，接受任何数据的地方。攻击者对数据的潜在控制量（如果有的话）是回答上述第二个问题的维度之一：“攻击者可以从哪里开始、如何开始？”\n\
  \n如果系统能够以某种方式建立某些保证，确保接收到的数据不太受攻击者的控制，那么这些数据可能被认为是“可信的”。如果保证较少或没有保证，则数据是“受污染的”，即可能包含恶意的利用尝试。保证必须设计到系统中；建立保证可能是威胁模型的输出之一，是并将构建到系统中的安全需求之一。\n\
  \n输入的类型（网络连接、用户界面、命令行、程序化数据交换）有助于定义在所有可能的攻击范围内，哪些攻击可以通过该类型的输入进行。并非所有攻击都能通过每个输入来利用。某些攻击类型根据特定特定输入类型的允许和限制被消除了。其他攻击则变得容易得多，并因此可能性更大。攻击类型、输入类型和漏洞之间存在一组依赖关系和相互作用：这些是相关的，有时是紧密耦合的。\n\
  \n同样，不同的利用方式会产生不同的效果。攻击操控类型、攻击面（部分由架构决定）以及资产受损或泄露类型的组合决定了该类型攻击对目标系统的影响。我们经常听到老练的黑客宣称，几乎每一次攻击最终都会导致几乎每个资产被完全攻陷。他们正在进行心理计算，将\
  \ MITRE 的 `ATT&CK` 集中记录的许多攻击连接起来。`ATT&CK` 显示了许多公开报告的成功攻击案例中所使用的技术。事实上，在具备正确的系统机会、漏洞和攻击者水平的情况下，几乎任何利用手段与其他许多手段相结合，都会导致完全攻陷。\n\
  \n---\n\nSchoenfield, B. S. E. “An Introduction to Threat Modeling,” Secure Design\
  \ and Secure System Architecture Webinar Series, Part 1, July 23,2019. Retrieved\
  \ from https://acton.ioactive.com/action/fs/blocks/showLandingPage/a/34793/p/p0054/t/page/fm/O?utm_term,Access%20Part%2018cutm_campaign,IActive%20Webinars%20and%20Videos8cutm_content=landing+page8cutm_source=Action-On+Software8cutm_medium=landing+page8cc_mmc,Action-On-Software-LandingPage\n\
  \n\n\n\n\n图 4.1 是与 David Wheeler 一次边吃墨西哥卷饼边喝啤酒聊天的结果（David Wheeler 是书籍《*The IoT Architect’s\
  \ Guide to Attainable Security and Privacy*》（Auerbach Publications, 2019）的合著者，同时也是英特尔公司的首席工程师）。Dave\
  \ 提醒 Brook，每种威胁模型都必须执行一组分析评估，且每项评估的视角都略有不同。然而，评估的顺序在任何方面都不重要。随后，英特尔公司的安全架构师 Sung\
  \ Lee 为英特尔的威胁建模课程起草了威胁模型活动圆图的第一版本，这最终促成了 Brook 的“参与式威胁建模”课程大纲。\n\n经过反思，Brook 意识到不仅必须涵盖所有的评估点，而且它们还具有高度的相互依赖性和相互作用。因此，我们在图\
  \ 4.2 中看到，每个活动都依赖其他活动来确保正确性和彻底性。这就是我们之前提到的威胁模型分析的非线性的、分形的特征。无论从圆图的何处开始，都必须接触其他区域，以便完全理解哪些资产更容易受到攻击，以及通过哪些攻击面进行。用例（Use\
  \ cases）有助于确定攻击者可能如何进行。他们将利用现有的能力——“威胁”——针对“架构”中的漏洞。分析必须得出那些能够防止或使威胁利用变得极其困难的缓解措施（mitigations）。\n\
  \n例如，图 4.3 阐明了从架构（结构和组件）开始分析，然后通过系统的其他视图，最终得出适当缓解措施的过程。应该注意的是，流程中假设已进行风险评估。也就是说，为了推导出正确的防御组合，必须对每个被认为是可靠（具有一定成功可能性）的攻击场景进行风险分级。开发攻击场景后，必须对每个场景进行风险评分。我们将在下文中回到这个问题。我们希望保持图\
  \ 4.3 中箭头的数量视觉上稀疏。实际上，在分析过程中，随着新信息的发现，人们可能会在观点之间反复来回。\n\n在图 4.3 中，分析从理解所分析系统（目标系统）的结构开始。从架构开始是《Securing\
  \ Systems》中提出的 Brook ATASM 威胁建模方法建议的流程图。对于许多从业者来说，分析的起点是理解系统的整体功能、目的、将所用的每项主要技术分为逻辑或功能组件（系统的结构）、数据是什么以及保护数据有多重要（敏感性），以及数据如何在组件之间与其他实体（无论是人类还是数字实体）之间移动。这就是“架构”。\n\
  \n![](img/fig4_3_B.jpg)\n\n### 架构分析\n\n架构分析将发现资产。图 4.3 有一条从架构到资产的箭头。当资产对系统利益相关者具有价值时，它们就具有关注价值。我们必须识别作为攻击目标的资产。这两组资产是交叉的，但可能并不完全一致。例如，僵尸网络攻击者对主机和操作系统感兴趣。在水平扩展的系统中，主机对许多利益相关者来说可能是无关紧道的。Brook\
  \ 在与开发团队审查系统时，多次遇到过这种脱节。\n\n架构分析还将揭示攻击者可能通过其进入的系统点——即“攻击面（Attack Surfaces）”。图 4.3\
  \ 还有一条从架构到攻击面的箭头，表示当从架构开始时，将进入攻击面枚举。\n\n### 攻击面与威胁\n\n每个攻击面都会为攻击者提供一组该攻击面特有的潜在利用可能性。并非每种攻击都能在每个攻击面及其相关数据流（通常是输入，但可能也需要考虑输出）上上生效。图\
  \ 4.3 绘制了一条从威胁到攻击面的箭头，表示攻击者在可以接受这些威胁且足够开放（暴露）以供攻击的点上应用威胁。当我们考虑攻击面时，各种潜在威胁被“应用”了，即对可能性、潜在成功率和攻击者活动水平进行思考（这导致了发生概率，它是风险评分的关键组成部分）。我们将在下文中详细介绍威胁研究和库。\n\
  \n当然，攻击者的目标可能包括资产，因此图 4.3 中有一条从攻击面到资产的箭头，完成了分析的这部分内容。\n\n### 风险评估与缓解措施\n\n最终，尽管这在图\
  \ 4.3 中没有画出，但上述分析将通过风险评估得出缓解措施。在没有对攻击场景的发生可能性（概率）和影响进行排序之前，我们无法得知正确的缓解措施组合。通常来说，组织无法负担每种可能的防御。相反，风险评估对于识别哪些攻击值得防御，哪些攻击可以等待，以及等待多久至关重要。\n\
  \n图 4.3 绘制了 ATASM 流程。但人们不必在起点或分析流程上过于教条化。Brook 在英特尔的同事 Sung Lee 是一位专家威胁建模师，并帮助完善了威胁建模课程的一些早期版本，他倾向于从用例开始。其他从业者则喜欢从资产开始，因为这些是攻击者最想要的目标之一。许多从业者倾向于从一组相关的威胁开始。事实上，著名的\
  \ `STRIDE`（欺骗、篡改、否认、信息泄露、拒绝服务、权限提升）是一个可以从中开始的紧凑潜在威胁集。STRIDE 对于没有深度攻击类型经验的人来说特别有用，因为\
  \ STRIDE 提供了一个易于理解的框架，从这里开始识别相关的威胁。或者正如作者、世界著名的威胁建模老师 Adam Shostack 简洁的：“可能会出什么问题？”从威胁开始是让威胁模型从“可能会出什么问题？”开始。从威胁开始，分析随后会将每个“出问题”的情况应用到相关的攻击面上，这自然随后会导致人们考虑架构和资产，可能还包括允许威胁进行或获取访问的用例。在《Securing\
  \ Systems》中，Brook 试图通过图 4.4)在视觉上展示威胁建模的递归性质。\n\n![](img/fig4_4_B.jpg)!![](img/fig4_5_B.gif)\n\
  \n\n\n\n\nGary McGraw 博士（作者、研究人员）得更为简洁地指出了这个问题：“威胁建模是分形几何。”我们从数千个威胁模型中积累的经验证实，尽管我们希望为威胁模型分析建立一种顺序——即便这仅仅是为了便于解释和教导——但实际的威胁模型分析往往抵制严格的、线性的顺序。在前面的讨论中，我们已经尝试为读者提供一个更真实的画面。我们发现，在进行过程中保持良好的记录非常有（极大的）帮助。\n\
  \n也许图 4.5 展示了我们倾向于在推进时如何记录威胁模型，这能为这个潜在的混乱且众所名的难以处理的过程提供一丝希望，使其具有某种秩序？\n\n我们对每个领域中发现的内容和假设进行持续记录。在认为自己已经开发出一份全面的攻击场景列表，这些列表能够引导我们走向“正确”的防御和缓解策略之前，否则任何内容都不被视为最终结论。“未回答的问题”（`Unanswered\
  \ Questions`）列表始终表明我们还有更多待调查的内容，但在提出问题时，我们可能还没有足够的信息。\n\n当威胁模型在所能及的范围内完成后（这取决于分析时已知的详细程度）时，“未回答的问题”列表应该是空的。尽管如此，通常会有某些本该探索的领域，这些领域对我们的基础假设有影响。这些领域被排在队中，在“停车场”（`Parking\
  \ Lot`）中进行背景研究。“停车场”中的项目是我们对某些知识或掌握上存有疑虑的话题；尽职调查需要更多的保证。\n\n### 4.3.1 在威胁建模之前\n\n\
  威胁建模通常需要大量的上下文和背景知识，如下例所示。\n\n在作者共同工作过的一个机构中，该公司产品的管理界面有时会报告跨站脚本（`XSS`）错误。`XSS`\
  \ 错误一直是 Web 开发的祸根之一。对于 Web 程序员来说，这很难避免，除非他们具有相当的安全意识，或者有足够的支持来避免在代码（尤其是输入代码）中允许\
  \ `XSS`。遗憾的是，`XSS` 是一个非常严重的问题，自其存在以来就一直处于 OWASP 前 10 位漏洞 列表中。\n\n`XSS` 允许攻击者通过 Web\
  \ 应用程序作为媒介，通过服务器的输出对用户发起攻击。Web 应用程序本身并不是目标。其用户，或者其他下游自动化系统才是 `XSS` 攻击的受害者。如果一个机构关心其用户，它可能应该投资于在其\
  \ Web 代码中避免 `XSS`。\n\n但是，尽管 `XSS` 很糟糕，其影响在上下文中可能是无关的，这让我们回到了管理门户中的 `XSS`。如果攻击者可以在无需身份验证的情况下设置或传播\
  \ `XSS`，就会存在一个非常令人担心的问题。`XSS` 的影响通常包括读取用户的浏览器缓存、Cookie 以及其他服务器数据，这意味着身份令牌可能被窃取（还有许多其他可能产生危害的数据），然后这些令牌可以用于访问管理功能。这很糟糕，对此毫无疑问。\n\
  \n另一方面，如果 `XSS` 只能在身份验证*之后*被利用，那么在 `XSS` 攻击成功的情况下，管理门户已经完全被攻破，至少达到了该用户被允许的权限。虽然攻击者可能也希望利用\
  \ `XSS` 从管理员的浏览器缓存中收集任何敏感或其他有用信息，但从门户所有者的角度来看，由于失去了对攻击者的管理登录权限，他们面临的问题要糟糕得多。账户的丢失极可能是更重要的攻击，而不是随后的\
  \ `XSS` 攻击。在这种情况下，`XSS` 并不是攻击拼图中最危险的部分。\n\n我们并不是建议不应该修复 `XSS`；人们不能让任何容易修复的攻击者手段悬而未决。^†\
  \ 然而，我们示例描述的第二种情况对管理软件所有者来说危险性较低，因为利用的前提条件是敏感权限的丢失。此外，如果已经实施了足够的管理权限保护并认为它们按设计运行，那么\
  \ `XSS` 就不是紧迫在眉的问题。上述就是威胁建模必须包含的基于风险的分析。\n\n### 4.3.2 分析前知识\n\n> 就像一个好厨师从橱柜里取出所有的食材并摆好以便随时取用一样，经验评估者指尖也拥有必须投入评估的信息。在图\
  \ 4.6 以前称为 [图 2.2]，你将看到输入架构分析的知识领域集合。分析的基础是另外两个在后续章节中分别讨论的领域：系统架构以及具体来说的安全架构和信息安全风险。这些每一个都需要自己的解释和示例。因此，我们将在下文中讨论这些内容。\n\
  \n> 图 4.6](#13-9781003002451_chapter-chap4.xhtml#fig4_6) 左侧的前两个领域是战略性的：威胁和风险态势（或容忍度）。这些不仅为分析提供支持，还有帮助在开发生命期的早期设定方向和高级需求。关于早期参与的完整讨论，请参阅《核心软件安全》第九章，“现实世界中的\
  \ SDL”。顺时针移动的下两个领域——可能的控制和现有限制——指的是现有的安全基础设施及其能力：哪些可能的，哪些是困难或被排除的。最后三个领域——数据敏感性、运行/执行环境和预期的部署模型——指的是讨论的系统。\n\
  \n\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\n[*]](#13-9781003002451_chapter-chap4.xhtml#fn4_10)“OWASP\
  \ 前 10 位。“OWASP Top 10 项目。”OWASP 基金会。访问地址：[`owasp.org/`](https://owasp.org/)\n\n\
  †我们工作的机构当然修复了任何报告的管理界面跨站脚本（`XSS`）错误。\n\n![](img/fig4_6_B.jpg)\n\n\n\n\n\n图 4.7 原为[图\
  \ 2.3] 将每个贡献的知识领域放置在其最实用的区域内。如果这有助于你记忆，这些被称为“3 S”。策略（Strategy）、基础设施和安全结构（Infrastructure\
  \ and security structures）以及系统规范（Specifications）有助于确定什么是重要的：“策略、结构、规范（Strategy,\
  \ Structures, Specification）。”事实上，在生命期的非常早期，可能越早越好，战略理解对于交付高级需求至关重要。一旦分析开始，如果人们不知道哪些安全是可能的、哪些是存在的、以及局限性在哪里，安全需求的准确性、相关性和交付性可能会受到损害。正如我在最初的几次审查中所做的那，很容易指定哪些是实际上无法实现的。随着架构开始形成并变得更加稳固，数据敏感性、运行时和/或执行环境以及系统将在何种部署模型下运行等细节就会变得更加清晰。这些中的每一个都强烈影响着必要的内容、哪些威胁和攻击方法变得相关，以及哪些可以从考虑中过滤掉。\n\
  \n![](img/fig4_7_B.jpg)\n\n> 需要注意的是这个过程并不像我所展示的那样线性。例如，部署模型可能很早就已经已知，尽管它是一个相当具体的知识。部署模型会极大地影响安全是继承的，还是必须放在那些部署系统的人手中。一旦知道了这一点，部署模型将产生一些设计必要条件，可能还有一组特定的控制措施。没有这些具体细节，分析师多或少像是在黑暗中摸索。（*Securing\
  \ Systems,*，第 34-35 页）\n\n我们发现，安全研究人员通往完全系统破坏的心理路径基于对攻击资源、权限以及目标弱点或漏洞的一系列假设，这些假设可能有效，也可能无效，并且应该对每个攻击向量进行考虑。我们之前提过，那些通过了这种真实世界有效性“嗅探测试”的攻击场景可以被称为“可信攻击向量”或\
  \ `CAV`。**在威胁建模中，专注于 `CAV` 并过滤掉那些不太可能发生、影响微乎其微且其技术复杂性超过了对攻击者造成的破坏价值的攻击场景，将非常有帮助。\n\
  \n通过我们对威胁建模过程的检查，我们或许可以得出一个正式定义（正如在 *Secrets* 中陈述）：\n\n> 威胁建模是一种识别系统必须抵御的攻击以及将系统带入预期防御状态的防御的技术。\n\
  \n> 上述定义中的“系统”应该被包含在内，指任何组织、架构、系统、一组流程，无论是手动的还是数字的。\n\n> 我的定义强调了几个关键点。首先，威胁建模既不是设计也不是架构，它是一种分析技术。其次，它的目的是识别攻击和防御。\n\
  \n> 第三，这是关键的一点，即防御将系统带入其“预期的防御状态”。也就是说，而不是将系统带入象牙塔式的安全完美（当然，这在现实世界中实际上并不存在）。\n\n\
  > 为了完成威胁模型，必须首先理解系统的利益相关者期望系统实现什么样的防御状态。换句话说，在分析攻击和指定防御之前，分析师必须理解系统必须针对什么进行防御以及达到什么程度——即通常所谓的“安全态势”。（*Secrets,*，第\
  \ 73-74 页）\n\n“已经提出了许多方法来实现威胁建模的目标；其中一些方法比其他方法更正式。”Izar Tarandach 和 Matthew Coles\
  \ 在 *Threat Modeling: A Practical Guide for Development Teams,[^†** 中评估了几种最广为人知的方法的有效性。我们对任何特定的方法论或方法没有偏好，我们发现使用一种方法来排序分析似乎很有帮助。Brook\
  \ 的 `ATASM` 公式为威胁建模提供了一个高层心理结构。`ATASM` 关注必须做什么，而不是结果或细节。在这方面，`ATASM` 具有包容性，因为许多其他方法都符合\
  \ `ATASM` 的范畴。例如，`STRIDE` 可以提供观察潜在威胁的窗口，并且作为 `ATASM` 的威胁识别方法没有冲突。下一节将定义并描述 `ATASM`。\n\
  \n________________\n\n**Schoenfield, B. S. E. (2015). *Securing Systems: Applied\
  \ Security Architecture and Threat Models.* Boca Raton [FL]: CRC Press/Taylor &\
  \ Francis Group, p. 105.\n\n†*Tarandach, I. and Coles, M. J. (2021). *Threat Modeling:\
  \ A Practical Guide for Development Teams.* Sebastopol (CA): 0>Reilly Media, Inc.\n\
  \n### *4.3.3 ATASM 过程 ATASM 过程\n\n在 *Securing Systems* 中，Brook 提供了一个助记词：`ATASM`，代表架构（Architecture）、威胁（Threats）、攻击面（Attack\
  \ Surfaces）和缓解（Mitigations）。图 4.8（架构、威胁、攻击面、缓解）将 `ATASM` 展示为一个线性流，以展示每个分析区域之间的紧密关系。正如我们将看到的，这些关系并不是特别线性的。每个区域都包含大量的发现工作。（图\
  \ 4.9 将活动细分为子步骤。）\n\n`ATASM` 与其说是一种方法，不如说是提醒人们从几个不同的角度来完成完整的分析。`ATASM` 的发明是为了作为教学技术，帮助人们进入威胁建模过程。它并不是为了取代其他方法，而是简化并增强过程。`ATASM`\
  \ 的每个组件——架构、威胁、攻击面和缓解——都可以分解为组件步骤，正如在 *Securing Systems* 中所的那样（第 133-134 页）。\n\n\
  步骤的细分活动划分几乎是无限的。在我们的威胁建模课程中，我们发现将 `ATASM` 拆分得比图 4.9 还要细处并益良少。大多数学习者一旦有了示例目标系统进行练习，似乎就能很好地掌握\
  \ `ATASM`。\n\n*Securing Systems* 中的以下第 5 章](#14-9781003002451_chapter-chap5.xhtml#chap5)\
  \ 提供了一组非常高层的步骤，我们希望这些步骤能为读者提供交付合理的威胁模型所必须完成的内容。我们将它们重申为一组为 `ATASM` 提供某些细节的任务集合：\n\
  \n> 架构与构件\n\n> 理解系统的逻辑架构和组件架构\n\n> 理解每条通信流和存储的任何价值贵数据\n\n> 威胁枚举\n\n> 列出此类系统所有可能的威胁源者\n\
  \n> 列出这些威胁源者的典型攻击方法\n\n> 列出威胁源者利用攻击方法实现的系统级目标\n\n> 攻击面\n\n> 将架构分解（分解）到能够暴露每一个可能的攻击面的程度\n\
  \n> 过滤掉那些典型方法没有暴露任何攻击面的威胁源者\n\n> 为每个攻击面列出所有现有的安全控制\n\n\n\n\n\n# 过滤掉所有已有足够保护的攻击面\n\
  \n## 数据敏感性\n### 风险等级\n## 可能的控制措施\n## 为缓解措施不足的攻击服务集应用新的安全控制措施\n\n### 构建“深度防御”（*Securing\
  \ Systems*, 第 137-169 页）\n\n![](img/fig4_8_B.jpg)!(images/fig4_9_B.gif)\n\n为了进行威胁建模，必须理清背景信息——即\
  \ Brook 所说的“三个 S”（*Securing Systems*, 第 135 页）：\n\n- **策略 (Strategy):**\n    - 威胁格局\n\
  \    - 风险态势\n\n---\n\n*Securing Systems* 书中的原始标题是“关于风险的几点额外思考”。但我们在这书中并没有提供关于风险的“额外”思考。相反，在本书中，我们必须解释风险评级技术，因为这些技术在执行\
  \ SDL（安全开发生命周期）活动时是可以使用的。由于不同书籍之间主题发生了变化，我们冒昧更改了标题，以更准确反映我们在这里呈现的内容。\n\n- **组织层面\
  \ (Organizational):**\n    - 针对目标系统\n- **结构层面 (Structures):**\n    - 在当前技术水平下，针对该系统和组织可能实施的安全控制集\n\
  \    - 所有现有的、设计上的或无意的、会导致控制无法应用于目标系统的限制\n- **规范层面 (Specifications):**\n    - 将要和已经用于构建目标系统以及任何底层或基础基础设施的技术\n\
  \    - 目标系统内部以及与其他系统之间每次数据交换，以及每个存储点的最高数据敏感性，即使是临时的或瞬态的\n    - 所有的运行时和执行环境，包括所有使用的操作系统\n\
  \    - 部署和构建链、流水线、技术以及这些是如何被管理和维护的\n\n正如我们将看到的，架构审查通常会包含大部分所需的要材料。尽管如此，取决于软件和运营组织的结合方式，分析师可能需要与不同的团队交流以发现某些信息。\n\
  \n人们需要了解威胁者及其应用于所分析系统（目标系统）所用技术的实战知识。有时，分析师专注于特定类型的系统，因此他们拥有正确的威胁集和活跃威胁者，这些威胁通常会攻击分析师所熟悉的系统。例如，某位分析师可能与支持公共云运行\
  \ Web 应用程序的特定技术栈工作；另一位可能专攻固件或操作系统内核威胁。如果分析师不熟悉针对目标系统的威胁类型，则需要进行研究。\n\n至于组织风险态势，我们只发现了一种方法可以感知一个组织将承担哪些风险以及哪些风险是过度的：即分析师必须对高管和其他风险决策者进行调查，了解他们愿意承担（容忍）的风险，以及必须缓解到可容忍水平的风险。Brook\
  \ 在担任新职位时所做的第一件事之一就是查看现有的异常情况（如果这些情况已记录的话）。异常情况是描述决策者愿意承担风险的数据池。尽管如此，即使有记录在案的异常，我们发现没有什么可以替代实际上对那些最终必须做出艰难风险决策的人进行“风险脉搏”：哪些是可以接受的？哪些是令人恐惧的？需要保护的最资产是什么，包括客户信誉和品牌保护等无形资产？\n\
  \n由于安全控制实际上必须被构建（无论是作为要部署软件的一部分，还是在基础基础设施中），因此了解哪些可用的安全措施至关重要：\n\n- 身份验证系统\n- 网络架构、限制和保护\n\
  - 安全监控能力（技术性和人为的）\n- 事件响应团队和流程\n- 以及更多\n\n有时，现有的设计排除了常规控制措施。在这种情况下，我们必须寻找替代方案。或者，现有的能力对业务至关重要，因此无法中断。系统可能是老旧的，即我们所说的“遗留系统”。如果是这样，那么设计可能是针对很久以前的（因此是更简单的）威胁格局所做的，这将导致防御对于当前需求来说很薄弱。分析师必须理解这些局限性，否则他们可能会制定无法且也不会实施的“象牙塔”解决方案。一个全面的威胁模型必须考虑到防御控制集中的缺陷。在当前设计下，深入了解哪些已经构建的、哪些无法实施，这对于制定一套可实施的安全需求至关重要，且这些需求在构建后将为目标系统和利益相关者实现预期的安全态势。\n\
  \n### 4.3.4 目标系统发现\n\n威胁建模过程的一部分是发现：\n\n- 目标系统是做什么？\n- 系统为所有者、用户和其他利益相关者提供哪些服务、功能和利益？为什么该系统将/已经投入使用？它如何为更大的战略目标做出贡献？\n\
  - 系统的主要功能是什么？\n- 系统的通信链路是什么？用户输入呢？内部的？外部的？\n- 通信部分之间是否存在信任和不信任的级别？是否存在关键性水平和/或不同的安全态势？为什么？\n\
  \n极少数情况下，目标系统或项目团队能够对上述所有问题给出确定的答案。或者该系统非常简单，答案显而易见。这两种情况确实都会发生，但根据对数百个威胁模型的经验，我们可以相当确定地说，预先拥有所有所需信息确实是罕见的。\n\
  \n通常，分析需要发现。发现可能构成某个特定威胁模型中最耗时、甚至是要求最高的任务。没有这些信息，威胁模型就无法完成，通常需要花费大量的时间和精力，因为部分回答会引发更多问题。这些新问题会揭示更多信息，并可能导致新的问题，或对现有问题的完善，以此此类推，随着威胁模型分析向我们提出的问题获得足够的答案迈进。\n\
  \nGary McGraw（作者、频繁的行业演讲者，机器学习机器学习研究所及几家安全初创公司的董事会成员）喜欢说：“威胁建模是分形的。”没有比这句话更切的话了。\n\
  \n分析师了足够的知识来做出假设，并可能识别出可能的攻击及其防御。项目团队可能会纠正一个假设，这指示了攻击和防御的某些调整。接下来，一个主要功能被“分解”，即拆解为它的组成部分，以进一步识别潜在的攻击面。一个或多个组成部分会将早期的假设陷入混乱，或揭示需要更严格安全态势的数据，或类似的变化。必然会有新的攻击被加入，早期的攻击被转移，从而导致不同的防御，以此此类推。这种游戏可能会持续很长时间，直到大家同意目标系统已被充分理解，从而可以陈述一个合适的威胁模型。\n\
  \n\n\n\n任何分解或增加（可能在之前的某轮分析中遗漏了）都可能在实质性上改变威胁模型。用莎士比亚的话来说，真正的威胁建模过程很少能“一帆风顺”。通常情况下，它是分形的，这意味着需要根据新发现的信息，递归地回到之前的某个分析点并重新开始该过程。\n\
  \n---\n\n当然，存在一些“最佳实践”方法。其中许多方法可以在标准和出版物中找到。考虑到设计选择，“最佳实践”解决方案可能并不可行。当我们坚持采用某种标准的最佳实践时，尽管根据目前的能力和资源无法实现，但我们（极大地）面临着无法实现任何缓解措施的风险。此外，我们可能会在冲突中浪费大量的组织时间，而这些冲突最终可能是徒用无功。幸运的是，通常有多种方法可以实现的安全控制和缓解。有时，人们必须发挥创造精神并利用资源，将多种控制措施整合成一种深度防御，使其接近甚至等于最佳实践方法。\n\
  \n目前已经有了许多方法论提案，例如 `PASTA`（攻击模拟与威胁分析流程）、`STRIDE`（将在`第 4 章`中介绍）等（请参阅 Izar Tarandach\
  \ 和 Matthew Coles 在 *Threat Modeling: A Practical Guide for Development Teams.*\
  \ 中对方法及其相对有效性的综述）。该书中审查的所有方法都试图掩盖或粉饰分析的分形特性。这就是为什么 Brook 提到了 `ATASM`，其目的是尝试至少为这个有时看起来极其混乱得令人沮丧的流程带去某种秩序感。\n\
  \n我们发现（并经历过）我们所使用的方法具有价值。但我们告诫新接触威胁建模的人，要对其分形的本质保持开放态度——不要让任何方法（无论哪种有帮助）凌于开放、好奇的心态之上。彻底且全面的威胁模型需要准备好超越方法，去追求那种“理想的安全态势”，而不是完成一个列表或一系列模式或攻击类型的集合，例如\
  \ `STRIDE` 缩写中包含的利用技术集。鉴于所分析系统的复杂性以及可能的创新性，像 `STRIDE` 这样的集合几乎总是某种程度上（或完全）不完整的。\n\
  \n正如我的朋友兼同事 Lance Reck（IOActive, Inc. 高级顾问）经常说的：“口头上说很容易，实际做起来困难得多。”`ATASM` 帮助不熟悉威胁模型的人概念化所需的内容。我们在下一节中简要介绍我们是如何做的。\n\
  \n## 4.4 简短“如何做”入门\n\n详尽的威胁模型方法超出了本文的范围，本文侧关注作为软件的软件安全。（注：原文在此处包含重复句子；我已保持了要求的核心结构）。\n\
  \n### 4.4.1 列举\n\n详尽的威胁模型方法超出了本文的范围，本文侧关注作为软件的软件安全。（注：原文在此处包含重复句子；我已保持了要求的核心结构）。\n\
  \n（注：提供的源文本在 4.4 节中包含大量重复短语。我已根据提供的唯一内容进行了布局处理）。\n\n\n\n\n在使用威胁库时，我们强烈建议将其作为分析的起点。威胁库不应被视为“正确且官方的清单”。通过这种方式，可以轻松识别出常见问题，从而将人工分析留给更困难、更独特、本地化且复杂的问题。这正是我们鼓励使用威胁建模自动的原因（正如我们在下文章节中将看到的）。\n\
  \n### 攻击场景\n\n开发一套完整的攻击场景集时，一个可能违反直觉的技巧是：人们需要一个单一且可靠的攻击场景，在脑海中“证明”攻击者有手段利用这些机会，并识别出至少一种能够导致重大损害的方法。在构建攻击场景时，不需要做到面面详尽，因为一旦你确信某个攻击场景至少是可能的（而且很可能是真实的），你就可以轻松地针对与场景相关的、利用类似问题的、或针对受分析系统中相同目标的其他类型攻击，添加防御措施。\n\
  \n防御措施通常不会与漏洞存在 `1-to-1` (`1:1`) 的对应关系。某些攻击场景需要多种防御，而另一些恰好只需要一个；通常而言，漏洞和防御之间是多对多的关系。这意味着，针对一个可靠且经过深思熟虑的攻击场景建立合理的防御集，也能防范一系列类似的利用，并有助于缓解其他类型的攻击。\n\
  \n如果对每种可能的损害都列举了至少一种攻击场景，那么防御措施的集合（即“深度防御”）通常足以缓解大多数、也许所有相关的攻击。\n\n这就是为什么作者们认为详尽的攻击树价值较低，因为许多分支将引向那些成功概率很小或可能不会造成重大损害的攻击。在实践中，我们认为应该应该花在彻底考虑具有损害潜力的攻击类型上。我们关注已知攻击者会针对目标系统中的技术使用的利用方式。攻击频率（如果已知）有助于评估每个特定时期内的攻击概率（例如：软件发布周期、业务周期、年度、系统预期寿命等——任何对分析有意义的周期均可）。在每个攻击面上，只需通过一两个揭示潜在损害（影响）的示例攻击场景，就足以生成详尽的防御。\n\
  \n### 4.4.1.1 STRIDE\n\n微软的 STRIDE 方法可能是最简单、最直观的视角，可以推断出 Adam Shostack 幽默的起点：“可能会发生什么错误？”我们直觉上知道，人们会攻击系统。经验表明，即使是设计良好且实施周全的系统，仍然包含攻击者的利用点和向量，通过这些向量可以发现并利用这些点。表\
  \ 4.1 介绍了 STRIDE 攻击者利用技术并定义了每个 STRIDE 安全属性。\n\n**表 4.1 微软的 STRIDE**\n\n| 威胁 | 安全属性\
  \ | 描述 |\n| --- | --- | --- |\n| 伪装 (Spoofing) | 身份验证 (Authentication) | 建立用户身份（或愿意接受匿名用户）。\
  \ |\n| 篡改 (Tampering) | 完整性 (Integrity) | 数据和系统资源仅由适当的人通过适当的方式进行更改。 |\n| 否认 (Repudiation)\
  \ | 不否认性 (Non-repudiation) | 用户无法执行某项操作后否认。 |\n| 信息泄露 (Information disclosure) |\
  \ 机密性 (Confidentiality) | 数据仅对目标人员开放。 |\n| 拒绝服务 (Denial of service) | 可用性 (Availability)\
  \ | 系统在需要时随时可用。 |\n| 权限提升 (Elevation of privilege) | 授权 (Authorization) | 显式允许或拒绝用户访问。\
  \ |\n\n这就是为什么作者们认为详尽的攻击树价值较低，因为许多分支将引向那些成功概率很小或可能不会造成重大损害的攻击。在实践中，我们认为应该应该花在彻底考虑具有损害潜力的攻击类型上。我们关注已知攻击者会针对目标系统中的技术使用的利用方式。攻击频率（如果已知）有助于评估每个特定时期内的攻击概率（例如：软件发布周期、业务周期、年度、系统预期寿命等——任何对分析有意义的周期均可）。\n\
  \n*来源：[Hernan, S., Lambert, S., Shostack, A. 使用 STRIDE 发现安全漏洞(https://docs.microsoft.com/en-us/library/architecture/uncover-security-flaws-using-stride)]\n\
  \n攻击者可以伪装成已验证的用户吗？那就是伪装（Spoofing）。一种经典的 Web 技术是跨站请求伪造 (`CSRF`)。\n\n### 4.4.1.2 ATASM\n\
  \n\n\n\n\n这就是为什么 Brook 在《安全系统》中提出了架构、威胁、攻击面、缓解措施（ATASM）。ATASM 是一个过程框架。阅读其他方法时，每种方法似乎都侧重于方面，然后将该严谨的方面置于其更大的威胁建模框架之中。例如，`PASTA`\
  \ 提供了相当丰富的风险分析。但仅进行该风险分析并不能威胁模型：所有任务都必须完成。\n\n事实上，如果将 ATASM 变为“目的、架构、威胁、攻击面、风险评分、缓解措施”，即\
  \ PATASRM，或许它会更完整，但这个缩写读起来相当难，至少在英语中是如此。任何威胁建模过程都必须：\n\n\\_\\_\\_\\_\\_\\_\\_\\\
  _\\_\\_\\_\\_\\_\\_\\_\n\n[*] 请参阅 第 204 页 上的脚注。\n\n- 理解目标系统的目的、其用途、它解决的问题以及系统的功能（即“三个\
  \ S”）。\n- 理解系统的功能组成部分、实现这些功能所采用的技术，以及功能与技术的逻辑分组：架构。\n- 发现或分析可能针对系统的那些威胁行为者及其方法（威胁）。\n\
  - 找出威胁将在何处获得机会开始，即系统中以某种方式暴露在威胁之下的位点：攻击面。\n- 对每个攻击场景（针对攻击面的威胁）进行风险评分，以便对缓解措施进行优先级排序，并优先防御最可能发生的攻击。\n\
  - 构建深度防御以防止、使威胁变得过于困难、减缓其速度并捕获威胁：缓解措施。\n\n上述内容应被视为威胁建模过程框架的合理陈述：为了生成全面的威胁模型而必须完成的分析。有了\
  \ ATASM（或者 如果你愿意的话，是 PATASRM），读者将拥有一个更好的衡量标准，用来衡量各种威胁建模技术和方法。无论关注点是什么，每种方法都必须执行完整的框架：PATASRM，否则它显然是不完整的。\n\
  \n当然，PATASRM 或 ATASM 并不意在成为一种方法。正如我们所指出的，它是一个框架，是任何被采用的方法都必须完成的事项集合。\n\n### 4.4.1.3\
  \ 权限提升卡牌游戏\n\n> 这是一个可以用来研究技术攻击的极佳地方，Adam Shostack 的卡牌游戏“权限提升”（Elevation of Privilege）。[*]\
  \ 我相信当 Adam 教学时，他会让参与者玩这个游戏。我们在 Michele Guel 的国家网络安全奖（2011）第一学期用过它——在思科举办的获奖教育课程：安全知识赋能（SKE）（Michele\
  \ Guel 是思科卓越工程师和 2011 年国家网络安全奖获得者）。玩这个游戏，或者至少浏览一下卡牌，就可以对攻击者所采用的技术提供一个相当全面的（尽管不是最新的）介绍。在我看来，“权限提升”为\
  \ STRIDE 的骨架填充了血肉。\n\n> 然而，我发现实际上对系统进行威胁建模时，卡牌太多了用不用。（不过，我好奇 Adam Shostack 是否在他的威胁建模课程中以某种有效的方式使用了这些卡牌？）据我所知，“权限提升”并不是为了构建攻击场景设计的；它是一个教学工具，在这方面效果非常出色。然而，如果过一遍牌组有助于威胁建模者识别相关的攻击可能性，那么请务必使用任何和所有可用工具。（*Secrets*\
  \ 版，第 119-120 页）\n\n### 4.4.1.4 ATT&CK & CAPEC（来自 *Secrets*）\n\nMITRE 的通用攻击模式枚举与分类\
  \ (CAPEC)\n\n> MITRE® 公司赞助了一组名为 MITRE ATT&CK® 的对抗性属性集合，[†]，它将已知的多步攻击的步骤和技术进行分组，例如各种高级持续性威胁\
  \ (APT) 和勒索软件活动。人们可以前往 ATT&CK Navigator[*] 并选择一个或多个已知活动，Navigator 将突出显示——即以视觉形式显示——该活动已知已被采用的各种技术。ATT&CK\
  \ 与我见过的大多数工具、分析系统和本体论一样，侧重于旨在供事件响应人员使用的攻击分析问题——即在面对一个或多个妥协性指标 (IoC) 时必须进行的分析。根据我的课程，我现在相信\
  \ ATT&CK 可以证明安全架构从业者有用，帮助他们熟悉构成多步攻击场景的工具、战术和程序 (TTP)。\n\n> 在多步攻击的细节之外，浏览高层分类……可能为各种类型的攻击（以及，隐含的攻击者预期效果）提供一个实用的心理分类系统，如果没有这些，正如我所指出的，没有安全架构师可以实践。ATT&CK\
  \ 可能为初学者提供帮助，并为那些更有经验的人填补攻击类别和漏洞类型。ATT&CK 可能提供帮助……（*Secrets* 版，第 16 页）\n\n\\_\\\
