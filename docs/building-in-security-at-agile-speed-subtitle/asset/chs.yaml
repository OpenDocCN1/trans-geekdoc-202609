  表 4.3 提供的案例研究，获取通过威胁建模分析得出的详细防御措施。\n\n## 4.5 威胁模型自动化](#04-9781003002451_contents.xhtml#chap4_5)\n\
  \n在编写*Securing Systems*时，已存在一种商业威胁建模工具。Brook 在后记中提到了它，认为这是一个希望的信号。在*Secrets of a\
  \ Cyber Security Architect*中，第 6 章，Brook 讨论了随着另外两个威胁建模工具和几个开源项目的加入，威胁建模工具市场的形成。截至本文写作时，商业威胁产品仍然存在且运行良好。一些开源项目正在趋于成熟。自动化威胁建模似乎正在走向成熟？\n\
  \n我们认为，人类分析师没有理由一个又一个、一个接一个项目地重复同样的陈旧需求。大量的安全需求已变成标准，这意味着这些需求是可以自动化的。在我们看来，这些本该是自动化的！\n\
  \n在 DevOps 世界中，我们应该将人类分析留给那些真正需要它的。没有必要反复强调 Web 输入必须转义以防止跨站脚本（`XSS`）漏洞。自动化可以确定性地识别\
  \ Web 输入（无论是来自代码还是来自如 `UML` 等可解析语言的图表产物），以输出“转义输入”需求，这在 Web 编程中是易理解且基础的。像微软的 `Threat\
  \ Modeling Tool` 等免费工具就可以识别出这些。\n\n> 现实中，来自公共互联网的攻击要多得多。由于我们正在探索 ATASM 过程，为了保持讨论的可控性，攻击列表已被删减。尚未讨论基于网络的攻击，例如分布式拒绝服务（`DDoS`）。然而，对于真实的网站，这些以及许多其他攻击也必须进行防御。\n\
  \n> 例如，路由到站点以及在其各个层之间路由流量的网络设备都将受到攻击。我们没有检查物理网络架构。但在实际分析中，我们将从上到下检查一切。这种检查当然会包括网络设备、运行\
  \ `AppMaker` 的服务器的操作系统、数据库服务器、Java 应用程序服务器等。（*Securing Systems*, pp. 166-168）\n\n\
  > 我们认为，人类分析师没有理由一个又一个、一个接一个项目地重复同样的陈旧需求。大量的安全需求已变成标准，这意味着这些需求是可以自动化的。在我们看来，这些本该是自动化的！\n\
  \n> 在 DevOps 世界中，我们应该将人类分析留给那些真正需要它的。没有必要反复强调 Web 输入必须转义以防止跨站脚本（`XSS`）漏洞。自动化可以确定性地识别\
  \ Web 输入（无论是来自代码还是来自如 `UML` 等可解析语言的图表产物），以输出“转义输入”需求，这在 Web 编程中是易理解且基础的。\n\n\n\n\
  \n\n威胁建模必须是迭代的，并且能够与现代开发方法轻松集成。它必须能让开发者快速学习、理解和实践，可能至少在学习和研究阶段，要让那些喜欢教学和赋能他人的资深威胁建模师能够掌握。只有这样，威胁建模才能扩展到从事复杂软件项目的大量开发人员。我们在作为安全设计计划构建和运行威胁建模的经验表明，这种方法是可行的，并且具有副作用，例如建立安全文化。\n\
  \n无论采用何种方法，必须考虑到 `PATASRM`：`Purpose`（目的）、`Architecture`（架构）、`Threats`（威胁）、`Attach\
  \ Surfaces`（攻击面）、`Risk`（风险）和 `Mitigations`（缓解措施）。我们对这些每一个领域进行了调查，以帮助读者理解威胁建模的重要性及其实践。\n\
  \n最后，我们认为威胁建模的部分负担可以且必须自动化，以跟上现代开发者的敏捷性、速度和交付能力，即以 DevOps 的速度进行威胁建模。\n\n# 在敏捷世界中增强软件开发安全管理\n\
  \n## 5.1 引言\n\n在软件开发中，最脆弱的环节仍然是人，特别是负责这些人员、以及他们被要求执行的过程和任务的管理人员。`Chapter 2` 关注人类可以做什么来控制和管理安全软件开发过程及其在敏捷和\
  \ DevOps 环境中的相邻环节，并意识到经理可以做什么来帮助他们以敏捷速度交付安全软件。本章涉及与 `Chapter 2` 相同的相同的领域，但它不是基础性讨论，而是对\
  \ `Chapter 3` 中提出的新 SDL 模型以及 `Chapter 4` 中某些讨论的后续。具体而言，我们将讨论一种未来状态，在这种状态下，安全工具、技术和人员是\
  \ DevOps 流水中不可不可缺的一部分，并用于将软件安全完全集成到 DevOps 环境中。这包括：在编写源代码时使用软件安全检查器自动完成大部分代码提交检查；每次提交后进行静态代码分析；以及由软件安全专家对需求、设计和威胁建模文档进行安全审查。该方法还将利用静态代码分析和动态分析，从外部向内和从内部向外地关联软件安全缺陷。\n\
  \n在“从外部向内”的安全方法中，大部分资源集中在识别可以被外部攻击者利用的潜在软件漏洞，这意味着你只寻求阻止对软件的潜在外部威胁。在当今环境中，大量软件漏洞的利用可能来自内部人员或托管网络内部的攻击者，这要求你从“从内部向外”的角度来看。尽管这种分析的大部分已作为\
  \ `Chapter 4` 描述的威胁建模过程的一部分涵盖，但尽可能通过静态和动态代码分析工具来增强和自动化这一过程是非常重要的。用于源码分析和安全软件设计的不同工具必须将这些漏洞集成到一个整合到敏捷开发过程中的中央存储库中。实际编写策略的人理解软件开发，并仅实施那些可以被采纳和修改以适应敏捷环境的标准。正如之前讨论的，这需要新的安全观念，正如\
  \ `Table 5.1` 中强调的 `DevSecOps Manifesto` 所示。需要这些关键变化，以便安全团队能够通过保护业务并确保安全的开发、交付以及确保安全漏洞得到修复，从而在\
  \ DevOps 过程中实现价值最大化。\n\n### 表格 5.1 DevSecOps 宣言的关键元素\n\n| 应当是 (Should be) | 而不是\
  \ (Rather than) |\n| :--- | :--- |\n| 积极投入 (Leaning in) | 说“不” (Saying “No”) |\n\
  | 数据与科学 (Data and Science) | 恐惧、不确定和怀疑 (Fear, Uncertainty, and Doubt) |\n| 可消费的安全\
  \ (Consumable Security) | 强制性安全 (Mandated Security) |\n| 24x7 主动监控 (24x7 Proactive\
  \ Monitoring) | 接通知后反应 (Reacting After Being Informed) |\n| 合规运营 (Compliance Operations)\
  \ | 剪贴板和清单 (Clipboards and Checklists) |\n| 安全 (Security) | 信息 (Information) |\n\
  \n`Table 5.1` 强调了安全从业人员以更小摩擦运行和贡献价值的更好方法：\n- 创建更好的产品和服务\n\n- 偏好迭代而非试图总是列出长列表\n-\
  \ 像开发者一样运作\n- 开辟新路径，帮助他人看到他们的想法变为现实\n- 像局外人一样攻击产品和服务以提供修复方案\n- 不等待组织成为错误的错误的受害者\n\
  - 不满足于已知知识\n- 跟进新研究以规划未来\n- 通过重视开发者所重视的事物，努力成为更好的合作伙伴\n\n尽管上述 `DevSecOps Manifesto`\
  \ 中强调的 DevOps 环境下安全应具备的许多属性在 `Chapter 2` 中讨论过，但本章将关注演进这些实践，以支持 `Figure 5.1` 中的可视化模型，该模型在\
  \ `Chapter 3` 中描述（`Figure 3.1`）。挑战和出路通过《DevOps 手册》中的这段话得到最好的体现：\n\n> 实现 DevOps 原则和模式的主要反对意见之一是，“安全和合规性不允许。”然而，DevOps\
  \ 可能是将信息安全更好地集成到技术价值流每个人日常工作中最好的方式之一。\n\n***\n\n[*] DevSecOps. (2020). *DevSecOps\
  \ Manifesto.* Retrieved from `https://www.devsecops.org`\n[†] Ibid.\n[‡] Kim, G.,\
  \ Humble, J., Debois, P., and Willis, J. (2016). *The DevOps Handbook: How to Create\
  \ World-Class Agility, Reliability, and Security in Technology Organizations.* Portland\
  \ (OR): IT Revolution Press.\n\n\n\n\n\n2019 年的《敏捷现状调查》指出：“尽管对敏捷的认可和支持持续增长，但大多数受访者（78%）表示，其公司内部并非所有团队都采用了敏捷实践，这表明大多数企业的敏捷转型仍处于进行中。”尽管组织正积极向敏捷和\
  \ DevOps 转型，但我们看到它们在 DevSecOps 工具链上投入了大量资金，却仅仅复制了旧有的流程。DevSecOps 不仅仅是部署工具；它还包含了流水线自动化过程，这些实践将使所需的软件更改一直贯穿整个生产环节。遗憾的是，许多供应商向公司推销“万灵药”式的说辞，试图说服他们工具将解决开发和交付安全软件的所有问题。这与\
  \ DevOps 转型是背道而驰的，因为这种转型需要一种持续学习和改进的文化，以及如前所述的 DevSecOps——将安全性整合到为了精简软件发布周期的文化、原则和流程之中。正如本书早些部分讨论的，DevOps\
  \ 的创始人构想的是一种基于沟通、领域理解和对底层业务热情的跨学科方法。当然，这些是无法自动化的人类特质，而是通过战略愿景、变革型领导力和员工赋能所培养出的品质。这种文化上的挑战和改变我们本章中继续讨论，正如我们在第\
  \ 2 章中所讨论的那样。\n\n第 2 章中讨论的那些实践，为了支持第 3 章中描述的模型所需的演进将在本章中讨论。具体而言，如何在敏捷世界中增强软件开发安全管理，以促进\
  \ DevOps 环境下的持续安全保障。\n\n***\n\nCollabNet®VersionOne. (2019). “13th Annual State\
  \ of Agile— Report.” 获取自 `https://www.stateofagile.com/#ufh-i-521251909-13th-annual-state-of-agile-report/473508`\n\
  \n## 5.2 构建与管理 DevOps 软件安全组织\n\n### 5.2.1 持续与集成安全\n\n安全被持续地插入到开发过程中，无论是通过技术、需求还是人员。开发周期和安全生命周期必须结合，以提高效率并避免冗余和不必要的孤岛。打个比方，你不能先建立一条流水线，然后在侧面拧上一个脱离轨道、脱离流程且不属于整体的安全措施，这会在组织中产生摩擦和问题。\n\
  \n开发计划和用例的变体如此之，以至于没有“一刀切”的解决方案。适用于“A”公司的方案可能并不适用于适用于“B”公司。这就是为什么将安全作为同一团队的一部分构建到流程中，可以使得无论组织中使用何种类型的计划和用例，安全都变得更具灵活性和相关性。\n\
  \n在 DevOps 环境中向安全下一个水平提升最具挑战性的部分可能是：你必须在已经在持续集成（`CI`）和持续交付（`CD`）中执行的基础上，增加持续和集成安全的元素。本章的重点将放在管理安全元素，以促进持续和集成安全（`CIS`），从而为图\
  \ 5.2 所示的“理想化持续 DevOps 活动循环”模型中的 `CI/CD/CIS` 提供基础。这可能超越了当今运维环境中所谓的 DevSecOps。本质上，就是以安全、完全集成且持续的方式执行\
  \ DevOps。要做到这一点，安全必须：\n\n*   跨越每一个领域。\n*   被集成并强调每项活动。\n*   实现自上而下和自下而上的采用。\n* \
  \  尽可能实现自动化。\n*   将其工具与实现和测试流程集成。\n*   在不损害构建的情况下实现创新。\n\n![](img/fig5_2_B.gif)\n\
  \n*   保持持续。\n*   是持续、集成的，是相互依赖无限循环的一部分。\n*   让 DevOps 组织中各种经验和能力的个人在短时间内达到高安全熟练度，并理解安全是每个人的责任。\n\
  \n正如本书早期提到的，我们必须停止在威胁建模、渗透测试和安全编码之间跳跃，就好像它们都是等效一样。它们并非如此。这些活动中的每一个都是软件安全的一个独立维度，特别是当软件安全被视为一个整体问题时。顶尖水平的每种技术与其他都是相当不同的。\n\
  \n持续和集成安全是 DevOps 软件开发过程中不可或缺的（参见图 5.2）。为了实现集成，我们的经验表明安全必须放弃其首要地位，在必须交付的其他属性中占据其应有的位置。为此，Brook\
  \ 在本书早些部分提供了一组行为，定义了软件中“安全”的含义。当然，这些行为的程度取决于具体语境。但这五种行为定义了安全软件应该做什么。将安全定义为“持续和集成”使得安全成为活动和考量织物的一部分。旧派的安全是在争取赋权、争取一个能被听到的声音。我们往往采取“安全优于其他维度”的态度——安全风险是最重要的。我们需要转变思维，即安全是重要的，它和收入、利益相关者的实用性、性能、可扩展性一样重要。安全变成了负担之一，而不是更多，更不是更少。持续安全必须完全集成到\
  \ DevOps 的人员、流程和技术组件中（图 5.3）。\n\n![](img/fig5_3_B.gif)\n\n### 5.2.2 安全心态对比专门的安全组织\n\
  \n在 DevOps 中，作为一种心态的安全比一个专门的安全组织更重要。可以说，随着安全真正被构建到软件开发过程中，DevSecOps 一词将不再存在，它将只是\
  \ DevOps。这需要经过培训的安全开发架构师和工程师，将安全实践和需求完全构建到软件开发生命周期中而不是独立的安全开发生命周期，并将安全工具作为开发组织整体工具管理计划的一部分进行管理。这意味着需要通过将责任外包给开发团队并尽可能自动化任务和交付物，来大幅减少安全运营领导层、安全运营以及治理和相关人员。\n\
  \n\n\n\n将安全视为一种思维模式意味着尽可能将安全工作从运营转移到开发。这将最大限度地减少组织运营侧的安全工作量。通过对开发工程师进行交叉培训，或者聘佣专门负责产品安全、PSIRT\
  \ 或安全相关 GRC 任务的开发团队成员，安全运营领导层和人员、以及产品安全事件响应团队 (PSIRT) 和 GRC 团队也将随之精简（参见图 5.4），并与剩余的少数安全运营职位建立虚线汇报关系。这些开发组织中的安全专家还将担任变革推动者的角色，与高级产品安全负责人和宣倡者合作，以促进必要的文化变革，从而在开发组织内部管理安全工作。\n\
  \n高级产品安全负责人很可能留存在运营组织中，但也可能位于开发部门。该职位将负责转型领导力，包括愿景规划、激励性沟通、智力刺激和支持性领导，以引导软件开发团队内部实现安全管理和交付所需的文化变革，并在实现安全软件交付的途中与其他领导者建立关系。\n\
  \n开发团队中产品安全面临的最大障碍之一是，他们认为安全主管和工程师“从未在软件开发领域工作过，且不懂 Sprint 团队是如何交付软件的”。尽管在很多情况下事实如此，但这正是招聘具有此类经验的安全主管和工程师之所以重要的原因。这类人确实存在，且数量逐年增加。对于在开发、运营和安全之间建立急需的共识，这是至关重要的。\n\
  \n![](img/fig5_4_B.jpg)\n\n另一个问题是高级产品安全负责人的汇报结构。为了充分利用负责软件安全的人员，他们必须身处正确的组织中。詹姆斯·兰森（合著者）曾担任过七个首席安全官\
  \ (CSO) 和首席信息安全官 (CISO) 职位，以及多个高级产品安全执行职位，在我的多个职位中都曾让软件安全向我汇报。根据我的经验以及与行业同仁的交流，显然，软件安全功能理想上应该属于软件开发职能。虽然该职位可以与\
  \ CIS 或 CSO 建立“虚线”关系，但它应该向工程或软件开发组织的负责人直接汇报。普遍共识是，应用安全角色通常汇报给中心化的信息安全职位（CSO/CISO），这不应与负责向外部客户开发和交付软件产品的软件安全功能混淆。这将增强赋权、提升在开发团队中的信誉并获得预算所有权。\n\
  \n在大多数情况下，安全架构师和工程师的职责将与第 2 章和第 4 章中描述的职责相同。最显著的变化是他们将成为软件开发组织产品团队中不可或缺的一部分。\n\n\
  在书前面的部分，讨论了我们在负责的组织中创建“安全冠军”（Security Champions）以及在开发团队中向同事传达安全优先级的安全专家经验。我们成功地做到了，以应对\
  \ DevOps 转换为如今所谓的 DevSecOps 的挑战。这些安全冠军承担了“本地”专家的角色，可以回答问题、建议培训，并与安全专家对接以寻找更深层次问题的答案。尽管他们作为交付更高质量安全代码的强大变革力量，但我们现在建议，具有软件代码开发背景的专门产品安全专业人员应驻留在每个开发团队，与高级产品安全执行官建立虚线关系，但直接向开发团队汇报。此外，一位具有管理部门工程/开发组软件开发团队背景的专门安全专业人员，应代表该组开发的多个产品的安全，并同时向该组的业务负责人汇报。詹姆斯在他最近的一个职位使用了这种模型，并发现如果该职能得到\
  \ CEO 和董事会的授权，这种模型是极其成功的。理想情况下，产品安全执行官应向负责产品开发的业务部门经理或负责软件产品的公司工程负责人汇报。\n\nPSIRT\
  \ 和 GRC 的增强型组织角色和职责（支持图 5.4 所示的模型）将在本章稍后介绍。与中心化安全角色一样，这些职责大部分将转移到开发团队内部。\n\n###\
  \ 5.2.3 优化安全以防御现实威胁\n\n在讨论优化组织结构并将传统的运营安全职责转移到开发部门之前，讨论为什么通过这种移动来优化、简化并使软件开发变得高效是重要的。这种移动不仅降低了软件开发的开销和总成本并提高了效率，还优化了我们保护国家、公司和基础设施防御现实威胁的能力。\n\
  \n> 网络威胁源于软件缺陷，即可以被网络攻击利用的应用程序或系统的漏洞。在书中，我们涵盖了以 SDL 最佳实践形式实施软件安全方面的策略，以帮助软件开发组织从源头上避免和减少软件缺陷，这是核心软件安全的关键要素。\n\
  \n> 虽然实现无漏洞的产品极其困难，甚至可能不可能，但这始终应该是你的目标。通过应用书中的最佳实践，你开发的软件将尽可能没有安全漏洞。漏洞越少，攻击者利用特定应用程序就越困难。通过软件安全最佳实践无法阻止所有威胁，但最大限度地减少攻击面是我们的最终目标，因为这让我们软件安全专业人员的工作变得更容易，同时也增加了对手的难度。（《核心软件安全》，第\
  \ 325-326 页）\\*\n\n在本节中，我们将威胁分为三大类类，具体来说是战略性的、战术的和用户特定的。然后，我们将提供每个类别的攻击示例。书中概述的\
  \ SDL 最佳实践将帮助你开发出能够抵抗这些威胁和攻击方法的软件。\n\n\n\n既然我们已经描述了安全的软件开发实践，那么在结束本书之前，提醒读者使用这些实践来抵御当今的网络威胁是至关重要的。在引用了几位行业领袖的话言后，我们将高层次地概述安全软件开发实践作为核心防御基础所提供的网络威胁类型。\n\
  \n> 各组织正在实施政策以应对安全软件开发实践，除了使用软件扫描工具外，他们认为将安全软件开发实践整合到组织文化中是十分重要的。一些公司发现，使用审慎的软件软件开发流程可以减少\
  \ 70%与关键任务软件相关的漏洞。\n\n> — 杰夫·斯奈德（Jeff Snyder），雷神公司网络安全计划副总裁，2012 年\n\n> 网络攻击利用软件错误，例如未妥善验证用户输入、系统组件之间设计假设的不一致，以及不可预测的用户和操作员行为。软件错误可能会由于组件规划、开发、测试和维护期间的脱节和沟通不畅而引入。尽管应用程序开发团队可能精通所需的业务功能，但该团队通常缺乏或没有相关的安全专业知识。随着更多系统组件需要满足安全需求，脱节和沟通不畅的可能性随之增加。生命周期活动之间、多个开发团队之间，以及系统开发与最终使用之间必要的通信和关联应反映项目管理中。项目经理应该考虑额外的通信需求、生命周期活动之间的关联以及潜在的使用环境，因为这些与安全需求有关。\n\
  \n> — 罗伯特·J·埃利森（Robert J. Ellison），“安全与项目管理”，2006 年\n\n***\n\nRansome, J. and Misra,\
  \ A. (2014). *Core Software Security: Security at the Source.* Boca Raton (FL):\
  \ CRC Press/Taylor & Francis Group.\n\nSnyder, J. (2012). “增长的网络威胁需要先进的缓解方法。”来自\
  \ [`www.raytheon.com/capabilities/rtnwcm/groups/iis/documents/content/rtn_iis_cyber_whitepaper_wcs.pdf`](http://www.raytheon.com)\n\
  \n> 通过在整个行业推广最佳软件安全实践，有重大机会提高技术生态系统的整体安全性。\n\n> — 霍华·施密特（Howard Schmidt），前美国网络安全沙皇，2013\
  \ 年\n\n> 组织理解其应用安全成熟度水平以及该水平对整体 IT 安全概况的影响至关重要。研究表明，应用层负责了超过 90%的安全漏洞，但超过 80%的 IT\
  \ 安全支出继续集中在网络层，主要侧重于边界安全。这项研究的发现表明，需要对应用安全计划投入更多投资，以减少组织对网络犯罪的整体风险。\n\n> — 《应用安全状况——Ponemon\
  \ Institute LLC 和 Security Innovation 的研究报告》，2013 年\n\n战略性攻击通常经过计划和控制，旨在针对包括规范、技术、计划、能力、程序和指南在内的信息资产以获得战略优势。它们通常由国家赞助（或国家支持的实体）、有组织犯罪或竞争对手进行。战术性攻击通常是随机且机会性的；它们通过使用恶意软件、利用程序、黑客、代理人、内部威胁和聊天室，针对信息资产以获取荣誉或财务奖励，并由专业黑客、脚本小子（script\
  \ kiddies）和内部人员实施。如你所见，战术性攻击与战略性攻击之间的关键区别之一是动机：战术性攻击针对网络资产是为了荣誉或财务奖励，而战略性攻击是针对多个目标网络协调多次战术性攻击（且规模大得多），以获得战略优势或抢在对手之前获得。战术性攻击的目标是随机且机会性的，利用软件漏洞和用户的无知；而战略性攻击针对的是更高层次的流程，是由情报驱动并经过精心计划和编排的。例如，战略性攻击可能包括渗透战略基础设施、针对电信基础设施，以及在隐身技术等特定技术领域聚合信息。理解战略性攻击需要理解：(1)\
  \ 单个网络支持的业务功能和流程；(2) 网络之间的业务关系；以及(3) 供应商、供应商和目标实体之间战术攻击数据的共享。通过这些业务关系获取的信息被用于指导和引导战略性攻击。\n\
  \n***\n\nEllison, R. (2006). “安全与项目管理。”来自 [`buildsecurityin.cert.gov/articles/best-practices/profect-management/security-and-management`](https://buildsecurityin.cert.gov)\n\
  \nAcohido, B. (2013, 2 月 27). “前网络安全沙皇追求更安全的软件。”来自 [`www.usatoday.com/story/tech/2013/02/27/howard-midt-executive-director-safecode/1952359`](http://www.usatoday.com)\n\
  \nPonemon Institute and Security Innovation. (2013, 8 月 27). “应用安全状况——Ponemon Institute\
  \ LLC 和 Security Innovation 的研究报告”，第 21 页。来自 [`www.securityinnovcrtion.com/uploads/ponemon-state-of-application-security.pdf`](https://www.securityinnovcrtion.com)\n\
  \nGilbert, L., Morgan, R., and Keen, A. (2009, 5 月 5). “战术与战略性攻击的检测与预测。”美国专利 `7530105`。来自\
  \ [`www.freepatentsonline.com/7530105.html`](http://www.freepatentsonline.com)\n\
  \n针对用户的特定软件攻击可以是战略性的、战术性的机会性的。它们可能涉及针对特定用户权限提升的攻击，这种攻击利用软件漏洞来获取通常对用户不受限制的资源和信息——包括特定用户机器的数据或用户可以访问的资源。战略性攻击是利用战术性和/或用户特定攻击的超集。\n\
  \n##### *5.2.3.1.1 战略性攻击*\n\n\n\n\n\n通常，战略性软件目标对于政府、经济或整个社会的关键基础设施功能至关重要的应用程序。关键基础设施的组件包括公路、机场和飞机、火车和铁路、公交线路、航运和船线、卡车系统以及基本商品的供应网络、发电厂和输电线路，石油和天然气管道以及各类公用事业，包括水和和水道系统、陆地和手机系统、计算机网络、电视和广播（不仅是公开访问的内容，还包括由私人或政府实体在特殊网络或特殊频率上控制的内容）、银行和其他金融机构，以及安全、消防、医院和应急服务。关键基础设施的每一个元素都是如此至关重要，至于即使暂时从公式中移除，整个国家都会产生巨大的影响。即使当某个地区的基础设施受到威胁，结果也可能是灾难性的。这包括电信、能源、银行和金融、交通、水务和应急服务。当然，战略目标还包括政府的关键元素，如国防、情报和其他被认为对对手具有高价值的机构。\n\
  \n战略性软件攻击具有高度的可重复性，并使用通用目标设定，例如针对整个行业（军事、金融、能源等）或个人群体（政治家、高管），并且必须具有长期的持久。与战术威胁相比，战略性攻击的复杂程度较低，开发和维护成本通常也较低。这类攻击可分为三个主要领域：间谍、犯罪和社会政治。\n\
  \n### 5.2.3.1 间谍活动\n\n网络间谍（或网络间谍活动）是在未经信息持有者许可的情况下，通过互联网、网络或个人计算机，利用破解技术和包括木马和间谍软件在内的恶意软件，从个人、竞争对手、团体、政府和敌人获取秘密，以获得个人、经济或军事利益。它可能完全在远程基地的专业人员电脑前在线进行，也可能涉及受过计算机训练的间谍和内鬼在内部渗透，或者在其他情况下可能是业余黑客和软件程序员的工作。网络间谍活动通常涉及利用此类访问获取秘密和机密信息或破坏。\n\
  \n网络间谍活动本质上具有高度的战略性；关键目标包括关键基础设施、工业攻击、制造业、研发、制药、金融和政府。政府目标可能还包括工业基础（`DIB`），其中包括国防承包商、研究机构以及政治或其他高层人员。\n\
  \n《间谍、情报与安全百科全书》（2013）。间谍：关键基础设施。检索自 `http://www.fags.org/espionage/Cou-De/Critical-Infrastructure.html`(`http://www.fags.org/espionage/Cou-De/Critical-Infrastructure.html`)\n\
  \nLinktv.org. (2013). “网络间谍活动”。检索自 `http://news.linktv.org/topics/espionage`(`http://news.linktv.org/topics/espionage`)\n\
  \n间谍攻击的示例包括极光行动（`GhostNet`）、Shady RAT、钛雨（Titan Rain）和夜龙（Night Dragon）。注意，这些攻击中的某些既可以被视为间谍活动，也可以被视为网络战争。根据部署方式的不同，它们可能有多种用途。将网络间谍活动视为网络战争的一个部分可能会有所帮助。\n\
  \n#### 极光行动与幽灵网络\n\n2012 年美国中美委员会关于中国的年度报告包含以下陈述：\n\n中国的网络能力为北京提供了一个日益强大的工具，用以实现国家目标。在一个高度依赖网络间谍活动的战略框架内，一群多样化的中国黑客利用窃取的信息来推进政治、经济和安全目标。中国对知识产权和贸易秘密的追求意味着，此类间谍活动的目标主要是私人企业。\n\
  \n信息安全社区已经注意到网络间谍活动有一段时间了。然而，此类活动的规模和影响令我们许多人感到惊讶。2009 年，信息战争监测（Information Warfare\
  \ Monitor）的研究人员将中国政府进行的大规模网络间谍行动命名为 `GhostNet`。这些与高级持续性威胁（`APTs`）相关的行动引起了安全社区和普通公众对\
  \ APT 攻击的关注。`GhostNet` 使得对遍布全球 90 多个国家的高价值政治、经济和媒体目标得以渗透。尽管其命令和控制中心位于中国，但中国政府具有“合理的否认性”，因为没有办法将其与实际操作联系起来。请注意，成功的网络间谍行动将具有这一特征，允许政府能够与执行这些攻击的实际小组脱清关系。\n\
  \n攻击者会对目标进行“社会工程学操控”，使其打开受恶意软件感染的文档或链接。之后，恶意软件将安装在目标的系统上（对大多数用户而言不会引起任何报警）。一旦发生这种情况，恶意软件将为攻击者提供几乎不受限制的访问。代码经过了混淆，并使用了多个木马以规避许多反病毒/反恶意软件软件的检测。\n\
  \n`Operation Aurora`是一次从中国进行的网络攻击。攻击始于 2009 年并持续到年底。这些攻击的目标是包括 `Google`、`Adobe`\
  \ 和 `Rackspace` 在内的跨国公司。一些公司选择公开披露它们是攻击目标，而另一些公司虽然处于怀疑中，但从未公开。根据 `McAfee` 的说法，攻击的首要目标是获取（并修改）这些跨国公司的源代码。应该注意的是，这些许多公司在亚洲（包括中国）设有开发办公室。因此，保护他们的生存之本——源代码对他们来说至关重要，尽管在这次攻击之前，一些公司认为这并不“严重”。这种趋势正在发生，但速度还不够。如果可以的话，它导致了混乱，特别是在中国，以及对海外办公室员工的怀疑。这使得安全小组想要在全球性企业中实施的任何\
  \ `SDL` 活动变得复杂。\n\n美国中美安全审查委员会。（2012）。“美国中美安全审查委员会 2012 年向国会的报告”，第 112 届国会，第二会期。\n\
  \n\n\n\n\n# 影子鼠行动 (Operation Shady RAT)\n\nMcAfee 的 Dimitri Alperovitch 在 2011 年报告了\
  \ `Operation Shady RAT`。与 `Operation Aurora` 类似，`Operation Shady RAT` 由持续的网络攻击组成，目标涵盖\
  \ 70 多个国家以及联合国和国际奥委会委员会。`RAT` 是远程访问工具（Remote Access Tool）的缩写，虽然尚未确认这些行动的幕后是谁，但在这种情况下，怀疑也指向了中国——特别是考虑到\
  \ 2008 年北京奥运会期间对奥运组织的目标攻击。其他目标还包括美联社办公室、美国能源部和美国国防公司。在此案例中，与 GhostNet 类似，攻击者通过“社会工程学”引导特定机构的用户打开文档、表格和其他看似无害的文件，这些文件实际上包含了恶意软件。一旦终端用户配合，恶意软件就会安装，并尝试连接到其远程服务器（硬编码在恶意软件中），为攻击者提供远程外壳。\n\
  \n# 夜龙 (Night Dragon)\n\n2011 年，McAfee 报告称，关键国际石油和能源公司正发生着有组织且有针对性的网络攻击。这些攻击似乎始于\
  \ 2009 年（尽管对于此类许多攻击，目前没有确切的方法可以最终确定这一点）。根据 McAfee 的调查，矛头再次指向了中国（或位于中国的黑客）。受目标公司遍布在许多不同的国家，包括美国、希腊和台湾。被盗的信息包括公司及其运营的细节、投标数据以及项目的财务信息。攻击者利用了\
  \ `Windows®` 操作系统、应用程序（包括 `SQL injection`）和活动目录基础设施的漏洞。远程访问工具（`RATs`）被用于收集和窃取敏感信息。首先，公司的外部基础设施（例如\
  \ `Web servers`）通过 `SQL injection` 攻击遭到破坏。这使得攻击能够执行远程命令，目标并破坏企业内部的桌面和服务器。随后收集了额外信息（例如\
  \ `passwords`），使攻击者能够访问基础设施内部的敏感信息。攻击者能够从受感染系统建立到互联网的连接，并渗透了包括高管系统在内的敏感信息。\n\n#\
  \ 泰坦雨 (Titan Rain)\n\n据信代表中国政府工作的黑客对美国及其盟友的基础设施发起了 APT 类攻击。攻击者能够访问许多国防承包商和联邦机构的敏感系统。这些攻击的目的是获取敏感信息，因此将\
  \ `Titan Rain` 归为间谍活动而非战争，尽管它也可以轻松用于网络战争。\n\n***\n\n[*]McAfee Labs and McAfee Foundstone\
