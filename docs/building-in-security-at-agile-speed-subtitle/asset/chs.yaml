  \ http://www.mcafee.com/wp-global-energy-cyberattacks-night-\n\n## 5.2.3.1 有组织犯罪\n\
  \n随着互联网的演变，网络犯罪已从个人和小群领域演变为传统的有组织犯罪集团以及聚集资源和专业知识的犯罪倾向技术人员。这在很大程度上归功于现代技术为想要从事各种活动的人提供的速度、便利性和匿名性。因此，正如实体公司将其业务转移到万维网以寻求新的利润机会一样，犯罪企业也是如此。互联网的全球性允许犯罪分子在任何地方进行任何非法活动，这使得各国调整其国内控制措施以涵盖网络空间中发生的犯罪至关重要。这些活动包括对计算机数据和系统的攻击、身份盗用、传播虐童图像、网络拍卖诈骗、洗钱、渗透在线金融服务、网上银行盗窃、非法访问知识产权、网络勒索，以及部署病毒、僵尸网络和各种电子邮件诈骗（如钓鱼）。有组织犯罪集团通常在一个提供避风港的国家建立大营，从那里进行跨国运营。实际上，这为躲避执法部门提供了额外的保护，并允许他们以最小的风险运行。互联网固有的跨国性质与这种活动模式以及在可接受的风险范围内追求利润化的努力完美契合。虚拟世界没有边界，这一特征使其对犯罪活动极具吸引力；但在涉及治理这个虚拟世界时，边界和国家管辖权是巨大的障碍——这使得大规模调查最好也是缓慢且乏味，最坏的情况下是不可能的。一些值得关注的团体包括欧洲犯罪集团、国家支持的犯罪集团和代理人、美国国内犯罪集团以及墨西哥毒枭。\n\
  \n\n\n\n\n随着网络犯罪收益的增长，有组织的犯罪集团试图从中分一杯羹也并不奇奇。网络犯罪让有组织的辛迪加在为自己的其他非法活动提供资金的同时，还能获得巨额利润。犯罪团伙参与了从盗窃到勒索、海盗，以及从源头上为网络犯罪提供便利的各个领域。他们正在为“即服务”（as-a-service）这一术语赋予新的含义。除了利用网络基础设施获取货币收益外，他们还通过提供漏洞、创建工具以及向愿意付费的人员提供资源，为网络攻击制造了支持。这些服务包括出售漏洞（主动在新的软件产品和基础设施中寻找漏洞）、创建并出售现有漏洞的利用程序、垃圾邮件服务、基础设施（僵尸网络、托管）以及恶意软件。\n\
