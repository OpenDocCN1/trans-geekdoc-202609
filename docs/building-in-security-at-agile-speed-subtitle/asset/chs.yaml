  \n### 6.8.2 安全事件响应\n\n安全事件响应，特别是产品安全事件响应团队（`PSIRT`）传统的职责和组织结构必须发生变化，以适应 DevOps 的敏捷速度和协作本质。`PSIRT`\
  \ 必须分散其传统的单体结构；从为了保密而保密的现状中演变；打破传统的响应烟囱式结构，转变为分布式的组织，尽可能进行开放通信，并创建一个协作环境，在在该环境中事件将成为学习经验，以防止未来出现\
  \ Bug 和漏洞。\n\n书中之前描述了 `OODAA`（观察、定位、决策和行动）。该过程对 `PSIRT` 同样重要，并应按以下方式应用：\n\n- **观察\
  \ (Observe)：** 使用安全监控识别可能需要调查的异常行为。\n- **定位 (Orient)：** 评估网络威胁格局以及公司内部的情况。\n- **决策\
  \ (Decide)：** 根据观察结果选择最佳方案。\n- **行动 (Act)：** 修复与恢复。\n\n事件响应过程是一个旨在识别、调查和响应潜在事件的集合。这是整个生命周期和反馈。最终目标是让\
  \ DevOps 团队能够尽可能高效、自动地实施安全，并将其作为日常流程的一部分。DevOps 和安全团队拥有一个共同的工作框架来开展转型，这种转型将消除过去存在安全团队与\
  \ DevOps 团队之间的摩擦。通过成功的文化变革，将产生以下行为：\n\n### 6.8.3 安全培训\n\n为了满足 DevOps 的需求，安全培训必须是相关的、简洁的、灵活的且敏捷的：\n\
  \n- **相关性 (Relevant)：** 尽可能使用你自己的代码，并将培训内部关注开发团队目前面临的安全问题。在可用时，优先使用内部资源作为讲师。\n-\
  \ **简洁性 (Succinct)：** 开发人员的时间非常宝贵，且对安全的注意力很短。在不需要威胁建模和大量代码审查等训练练习时，像 TED 那样短的（时长\
  \ 15 到 20 分钟）、定期更新的演讲应成为常态。\n- **适应性 (Adaptable)：** 随着你开发环境、优先级和目标的变化而改变。\n- **敏捷性\
  \ (Agile)：** 你的培训应该足够灵活以满足组织的需求，无论是内部培训、外部外包还是两者兼顾。对于外部来源的培训，基于 LMS 的旧培训不仅昂贵，管理成本高得无法企，灵活性有限，在许多情况下课程与实际不符。如果你外包了任何培训，它应该是基于云的，并且仅包含与你的环境相关的培训。\n\
  \n\n\n\n将安全性构建到 DevOps 中，需要为组织的每个部分提供适当的教育和培训。这要求在产品安全培训、衡量标准、技能，以及它们如何融入 DevOps\
  \ 范围方面建立最佳实践。DevOps 专家应该具备安全意识，并应用最优质的安全开发和部署实践。这应该产生一种质量保障思维，在寻找或修复漏洞时，将安全置于首要位置。\n\
  \n在开发和完善你的安全培训和意识计划时，你还需要考虑其他其他事项，包括：\n\n- **安全是共同责任：** DevOps 团队需要了解，安全是他们必须与安全团队共同承担的责任。没有它，安全就不可能实现；而没有安全，DevOps\
  \ 将是不安全的。说安全是每个人的责任是一回事，但让每个人具备真正实现这一点的所需知识和工具则是另一回事。†\n\n- **安全意识：** 开发和运维专家应该理解应用程序漏洞、其不同类别以及避免应用程序出现漏洞的最佳实践。没有这些培训，开发人员和运维专家可能无法充分理解安全有多重要，以及它对业务可能产生的影响。‡\n\
  \n- **类似 TED 的易于获取的培训课程：** 这些课程可以是自主开发的，也可以作为你产品安全测试和管理解决方案的一部分。\n\n- **所有培训和教育必须保持更新并适用于当前环境：**\
  \ 警惕供应商提供的过时材料和教学方法。确保你实施的培训和意识是当前的且适用于你的环境的。\n\n- **安全培训和教育是双向的：** 对于没有从软件开发岗位晋升的安全从业人员，应该接受关于开发人员如何工作以及他们面临限制的培训。\n\
  \n_________________\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\n*同上。\n\n†Feiman, J.\
  \ (2019, 10 月 18). “DevSecOps 教育与培训的 5 个技巧.” 取自 [https://dzone.com/articles/5-tips-for-devsecops-education-and-training]\n\
  \n‡同上。\n\n### 6.8.4 安全技术债（遗留软件）\n\n遗留应用程序可能会留下巨大的漏洞，无论它们多么关键，都必须处理。技术债包括为了满足当前需求而更新遗留系统以及维护软件质量以达到可接受风险和性能的成本。推迟修复工作的公司最终会导致沉重的技术债。借口各异，但延迟解决技术债的原因通常是它耗时且昂贵，并且会占用其他（推测优先级更高的）的项目。技术债对任何公司来说都是巨大的船锚，但对于\
  \ DevOps 环境中的开发小组来说，它是完全不可接受的，并且可以说是是 DevOps 和敏捷交付的对立面。此外，由于安全通常是一项未拨资金的指令，而遗留软件及其安全支持在大多数时候几乎肯定也是一项未拨资金的指令。展望未来，这需要改变，特别是在\
  \ DevOps 环境中。\n\n采取一致且激进的方法来管理技术债，并不允许任何累积的“债务”和“利息”产生，应该是 DevOps 安全文化变革的关键要素。尽管将安全性构建到\
  \ DevOps 中有许多优势，但技术债等挑战仍然存在。DevOps 本身并不是减少技术债的解决方案，因为它可能会产生其特有的技术债形式。事实上，如果技术债被带入\
  \ DevOps 过程，它将会被整合到过程的开始，对该过程的所有后续更改都可能受到该债的影响。*\n\n> DevOps 在技术债方面的真正优势可能在于它的动态性。DevOps\
  \ 假设没有什么是静态的，一切都应该改变。这意味着现有的技术债（无论是代码中的还是流程中的）最终将被消除。†\n\n应该考虑以下文化变革以解决和管理技术债：\n\
  \n- **将其构建到迭代（sprints）中。**\n- **经常重构：** 如果事情变得困难或痛苦。\n- **长远考虑：** 这里的目标不是代码行数 (`SLOC`)\
  \ 或衡量标准，而是这些变化可能产生的整体影响。通过拥抱安全实践，可能会发生相反的情况。安全实践通过及早将安全作为优先事项，本质上减轻了时间线后期的压力。‡\n\
  \n_________________\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\n*Churchman, M. (2016,\
  \ 2 月 12). “技术债及其对 DevOps 的影响.” 来自 [https://www.sumologic.com/blog/technical-debt-impact-on-devops]\n\
  \n†Blea, S. (2020, 3 月 5). “技术债——反 DevOps 文化.” [https://devblogs.microsoft.com/premier/technical-debt-the-anti-devops-culture/]\n\
