- "# 敏捷速度下的安全构建指南\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 献辞\n\n本书献给教导我的父母、引导我的老师、激励我的女儿、挑战我的同事，以及一直支持我前行的安全社区。这同时也献给那些为让数字世界更安全而不懈努力的人。\n\
  \n> — James Ransome\n\n> — Brook S. E. Schoenfield\n\n# 前言\n\n在创建软件方面表现优秀的组织有何不同？以\
  \ Google Chrome 为例。Chrome 是开源的，这意味着每个人都可以完全访问并检查代码以寻找漏洞。Chrome 是一个极受重视的目标。单一漏洞就可能影响数百万用户。\n\
  \nGoogle 的 Chrome 开发团队将安全设定为一种流程，而非最终产品。它有四个基本步骤：\n\n1. 在设计代码时考虑安全性。\n2. 发现漏洞或缺陷。\n\
  3. 修复漏洞，并通过测试确保补丁符合用途。\n4. 将修复方案投入运行环境。\n\nGoogle 通过其沙箱设计将安全构建到 Chrome 中。Chrome\
  \ 沙箱限制了任何组件（例如电影播放器）破坏 Chrome 其他部分的能力。安全的开发生命周期（SDLC）超越了设计，包含了安全测试。Chrome 利用数万个\
  \ CPU 核心通过模糊测试持续探测新漏洞。如果发现漏洞，他们可以在 30 天内向全球 90% 以上的用户发布修复方案。全自动完成，无需用户点击“升级”。\n\n\
  在《Building In Security at Agile Speed》中，James Ransome 博士和 Brook S. E. Schoenfield\
  \ 将最佳安全生命周期实践精炼成一本详尽的书。他们展示了“如何做”，也解释了“为什么”。这两大巨头结合他们的行业经验，揭示了持续集成和持续交付（CI/CD）、DevSecOps\
  \ 和持续安全的奥秘，使其不再仅仅是只有少数精英才知道如何实施的艺术。这对伙伴分享了我的愿景，使这些知识民主化，并回馈给给予我们如此之多的软件安全社区。\n\n\
  技术的新可能性取决于我们执行《Building In Security at Agile Speed》中概述原则的能力。有了我们所需的知识，技术的未来已触手可及，但仍然取决于我们——我们所有人——是否能勇敢地把握它。\n\
  \n在我们携手保护世界软件之际，我充满信心地展望未来。\n\nDavid Brumley 博士\n首席执行官兼创始人\nForAllSecure, Inc.\n\
  \n然而，今天我们发现自己为忽视这一点而付出代价。足以登上头条新闻的泄露事件提醒着我们积累且必须偿还的债务。我相信，在组织内部将 DevSecOps 作为一种正式流程的实施将留下历史。尽管有些人可能认为这是一种退步，但我看到了即将到来的创新浪潮。\n\
  \n\n\n\n\nForAllSecure 的首席执行官 David Brumley 博士是卡内基·梅隆大学的终身教授，也是软件安全专家。他在学术界和实践领域拥有\
  \ 20 多年的网络安全经验，Brumley 博士在计算机安全领域发表了 50 多篇论文，并多次获得最佳论文奖。他还是竞技黑客团队 Plaid Parliament\
  \ of Pwning (PPP) 的创始人兼教职赞助人，该团队排名国际，且是 DEFCON 历史上夺奖次数最多的队伍。\n\nBrumley 博士获得的荣誉包括入选\
  \ 2010 年 DARPA CSSP 计划和 2013 年 DARPA 信息科学与技术顾问委员会、2010 年 NSF CAREER 奖、奥巴马总统颁发的 2010\
  \ 年美国总统科学家与工程师早期职业奖（PECASE，这是美国授予早期职业科学家的最高荣誉），以及 2013 年斯洛恩基金会奖。\n\n# 前言\n\n软件驱动的机器时代在过去几年中取得了巨大飞跃。战斗机飞行员、股票交易厅交易员、外科医生以及工业生产和电厂操作员等人类任务——这些任务对于武器系统、医疗系统和我们国家基础设施的关键要素至关重要——已经或正在迅速被软件所接管。这是机器领域的一次革命性进步，其机器的大脑和神经系统现在由软件驱动的程序控制，取代了以前需要人类思维的复杂非重复性任务。这导致了国家、军队、犯罪分子、活动人士和其他对手在尝试破坏、修改或影响国家、基础设施、社会和文化的方式上发生了范式转移。对于企业也是如此，多年来我们看到了越来越多的网络企业间谍活动案例。以前使用大军团、昂贵且具有破坏性的武器系统和平台、武装抢劫、物理窃取信息、暴力抗议和武装起义正迅速被所谓的网络战争、犯罪和活动主义所取代。\n\
  \n归根结底，网络手段可能与以前的技术一样深远，因为对软件漏洞的潜在利用可能导致：\n\n*   整个或部分基础设施瘫痪，包括电网、核电站、通信媒介和应急响应系统\n\
  *   化学工厂被修改以产生大规模爆炸和/或高毒性云团\n*   对关键武器系统或平台进行远程控制、修改或禁用\n*   监控系统的禁用或修改\n*   犯罪性的金融剥削和勒索\n\
  *   操纵金融市场和投资\n*   通过修改医疗支持系统或设备、手术计划或药物处方对人类进行杀或伤害\n*   通过修改投票软件、勒索，或通过网站篡改、底层\
  \ Web 应用下线或破坏损害品牌来引发政治起义和特殊利益影响\n\n网络手段的一个副作用是，它赋予了我们从受司法管辖保护的地点，通过远程利用和攻击，以以前无法想象的规模、距离和匿名性来执行上述所有操作的能力。这让政府、犯罪集团和活动人士能够通过代理主要作案者来规避责任、侦测和政治后果。\n\
  \n尽管关于网络安全有大量的宣传，但真正的“阿喀琉斯之踵”是那些（不安全的）软件，它们提供了上述的对目标进行完全控制和/或修改的潜力。随着我们快速迈向以前被归为人类思维、现在被软件驱动机器所取代的任务新时代，软件安全的至关性不容低估。这正是我们编写此书的原因。相反，在可预见的未来，软件程序将继续由人类编写。这意味着新软件将继续建立在遗留代码，或在安全受到重视之前、在复杂攻击流行之前编写的软件之上。只要人类还在编写程序，实现安全成功的关键在于让软件开发流程更加高效和有效。\n\
  \n我们，即两位作者 James 和 Brook，花费了大量时间在白板上绘图，花费了无数小时坐在咖啡馆里，几张桌子上铺满了策略文件和图表（这让咖啡师和等候人员感到惊恐），手里拿着咖啡，试图挖掘交付软件安全的最有效方法。我们想过为什么某些战术看起来那么成功。我们曾聚在一起挠腮，试图理解为什么一个在纸面上看起来很好的方法会失败：是我们的执行有误吗？是我们的假设错误吗？是否存在我们尚未考虑的某种尚未定义的文化元素？还是我们根本没有很好地解释清楚我们认为可能有效的方法？\n\
  \n这本书无疑是对 `Core Software Security: Security at the Source` 的更新和重做。因此，该书的部分材料已原封重印或经过了轻微修改，有时会在引用材料周围加上我们的更新注释。在写完那本书之后，我们每个人都继续就我们的最新理解进行写作、演讲和教学。我们希望将我们个人的单项著作整合到对软件安全的整体观点中。你将在书中看到许多摘自这些期间出版物的引文。在此值得提到的是\
  \ Brook 在 2014 年之后出版的两本书书：`Securing Systems: Applied Security Architecture and Threat\
  \ Models` 和 `Secrets of a Cyber Security Architect`。\n\n然而，这本书还包含了大量全新的材料。自 2013-2014\
  \ 年以来，软件开发、架构和运行发生了天覆地的变化，当时我们正在计划并起草 `Core Software Security`。此外，可能同样重要的是，我们学到了很多东西。我们的实践已经发生了变化，以适应\
  \ 2014 年正在发生的深刻变化，而这些变化实际上从那以后几乎已经接管了一切。我们的一些方法已经得到了精炼。一些方法已经转向了新的范式。此外，我们集体还掌握了一些新技巧，我们认为这些招式有必要印刷供他人使用，或者至少让他们做出反应。\n\
  \nJames 和 Brook 从来不回避冲突，只要由此产生的讨论具有建设性并服务于改进。在很多方面，这本书是关于我们对“持续改进”的追求。因此，我们在书中所说的内容不应被视为定论，而应被视为对现状、我们可能（应该？）去哪里以及我们如何到达那里的阶段反思。\n\
  \n尽管这本书关注软件安全的人员、流程和技术方法，但我们认为，只要软件是由人类开发、管理和利用的，软件安全的人为因素仍然是最需要管理的部分。后续内容是一个软件安全的分步骤流程，适用于今天的技术、运营、业务和开发环境，重点关注人类如何以最佳实践和指标的形式来控制和管理这一流程。我们总会有安全问题，但当软件最终发布或部署时，这本书将有助于减少这些问题。我们希望你们喜欢我们的书，就像我们喜欢写它一样。\n\
  \n\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\n\n\n\n\n\n\n# 致谢\n\n\n文字编辑、排版和校对是任何一本书交付的关键。Marje\
  \ Pollack 再次应对了作者们的各种怪癖。由于其他作品的片段与新文本交织在一起，这本书的排版工作尤为困难。我们希望 Marje 的理念能为读者创造直观的阅读体验。Susan\
  \ Culligan（Derry Publishing Services 总监）提供了必要的评审和批评。再次感谢你，Theron，我们跳舞完成了这本书。感谢与我们合作。——\
  \ James Ransome 和 Brook S. Schoenfield\n\n我想感谢我所有的前员工、同事、团队成员和业务伙伴，他们自 1997 年以来帮助我管理应用安全并保持软件安全。特别感谢\
  \ Brumley 博士为本书撰写序言，这个主题我们都充满热情，并希望传给所有的从业者和决策者。最后，同样重要的，感谢我的合著者 Brook S. Schoenfield，他与我共同走了这段旅程，证明了除了现状之外，还有另一种高效的方法来构建架构、实施和管理安全。正如美国空军采购助理部长\
  \ Will Roper 所恰切说的：“我们可以制造最棒的飞机和卫星，但如果我们不能跟上时代的速度更新软件，我们将会失败” — James Ransome\n\n\
  像这样的书如果要反映现实实践，就不能从作者的想象凭空产生。这项工作牢地植根于每位作者丰富的经验——在安全领域、在软件安全领域、在开发和维护软件中获得的经验，以及最重要的是，从与成千上万他人集体工作中获得的经验。这种“集体”必须被认可。\n\
  \n________________\n\nChristopherson. A. (2019). “更快、更智能：速度是采购改革的关键。” 检索自 `https://www.wpafb.af.mil/News/Article-Display/Article/1771763/faster-smarter-speed-is-key-in-acquisition-reform/`\n\
  \n此处表达的结论坚实地基于开发者、经理、项目经理、Scrum Master、总监、执行官、产品经理、产品所有者、教师、协调员，当然还有安全从业者的经验和实践，他们最终构成了任何有效的软件安全计划。软件安全不能被强加。它只能通过许多不同角色和专业领域的人为了共同目标共同努力，付出受启发和驱动的努力才能获得。如果不承认这些广泛的贡献，将抹大量的辛水。但也会描绘出一个虚假的现实图景。我们的许多同事都对你在这里看到的内容做出了贡献。我们将对你的合作永怀感激。遗憾的是，名单很容易就能填满整本书。\n\
  \n特别值得注意的是，我们在 McAfee, Inc.（后变为 Intel Security，后变为 McAfee, LLC）合作过的数百名安全架构师，他们尽全力执行了我们的安全开发生命周期（`SDL`）。这些“安全冠军”不仅交付了成果，还批评并帮助完善了那个\
  \ `SDL`，而那正是本本书 `SDL` 的基础。\n\n书中提到了，但在此值得感谢的是 Robert Hale 和 Catherine Blackadar\
  \ Nelson。如果我们没有在 2015-2016 年于 Intel, Inc. 参加该 `SDL` 研究，我们可能无法挖掘深埋在现有 `SDL` 下的软件开发假设。是的，我负责技术工作。但\
  \ James 以及当时的 Intel Security 质量副总裁 Noopur Davis 与我在项目进行期间彻底且定期地分析了结果。通用 `SDL` 的很大基础直接源于那次努力。\n\
  \n在离开 McAfee, LLC 后的几年里，两位作者都有机会证明，我们共同创造的工作并非偶然。我参与的每一个软件安全计划都在持续提供验证和完善。\n\n#\
  \ 作者简介\n\n\n\n\n\n**James Ransome 博士**是早期网络安全初创公司 CyberPhos 的首席科学家，并继续从事*临时*咨询工作。他还是湾区地区首席安全官协会（Bay\
  \ Area CSO Council）董事会成员。最近，Ransome 博士担任英特尔产品安全与保障、治理与运营小组（IPAS GO）的安全开发周期（SDL）工程高级总监，在那里，他领导并培养了一个由\
  \ SDL 工程师、架构师和产品安全专家组成的团队，在整个英特尔实施并推动了安全实践。在此之前，他是英特尔安全与 McAfee LLC 的产品安全和 PSIRT（产品安全应急响应）高级总监。在六年的时间，他建立、管理并增强了一个以开发者为中心、自给自足且可扩展的软件安全计划，每个产品团队中嵌入了由\
  \ 120 名软件安全架构师组成的扩展团队。这一切都是实施和增强其最新著作《核心软件安全：源头安全》（*Core Software Security: Security\
  \ at the Source*）中所描述的结果，该书已成为许多负责开发自身 SDL 的企业安全领导者的标准参考。他的职业生涯以在私营和公共行业的领导职位为标志，曾曾在应用材料公司（Applied\
  \ Materials）、欧特克（Autodesk）和 Qwest 通信担任首席信息安全官（CISO），并在 Pilot Network Services、Exodus\
  \ Communications、Exodus Communications—A Cable and Wireless Company 以及 Cisco 协作软件小组担任过四次首席安全官（CSO）。\n\
  \n在 1997 年进入企业界之前，Ransome 博士结束了 23 年的政府服务后退休，曾担任过多种支持美国情报界、联邦执法部门和国防部的职位。他担任的关键职位包括：武器班军士（美国海军陆战队）、美国联邦特探员——反外国情报（NCIS）、美国海军退役指挥官兼情报官、大规模性武器和能源部核能应急搜索小组（NEST）关键领导退役科学家-地理空间情报分析师，以及劳伦斯利弗莫尔国家实验室的威胁评估分析师。\n\
  \nRansome 博士拥有信息系统博士学位（[`[htt­ps:­//n­suw­ork­s.n­ova..ed­u/g­sci­s\\_e­td/­790­/](https://nsuworks.nova.edu/gscis_etd/790/)`），专攻信息安全；还拥有信息系统硕士学位，以及国际商务和国际事务的研究生证书。他在博士论文中开发并测试了一种用于融合有线和无线网络安全的安全模型、架构和领先实践。这项工作成为了\
  \ Getronics 无线集成安全、设计、运营和管理解决方案的基础，Ransome 博士是该方案的共同架构师。这使得 Getronics 和思科在两年内增加了超过\
  \ 4500 万美元的收入。\n\n《以敏捷速度构建安全》（*Building in Security at Agile Speed*）是 Ransome 博士的第\
  \ 14 本书，也是关于网络安全的第 12 本。他的上《核心软件安全：源头安全》已成为许多负责开发自身安全开发周期和产品安全计划的企业安全领导者的标准参考。\n\
  \nRansome 博士曾是新东南大学计算机与信息科学学院信息安全项目的兼职教授，该项目被美国国家安全局指定为信息保证教育国家卓越学术中心。他是 Upsilon\
  \ Pi 的成员、认证信息安全管理师（CISM）、注册系统安全专业人员（CISSP）以及 SANS 学院的荣誉院士。他曾在 RSA、BSIMM、OWASP 和\
  \ AppSec 等会议上发表过演讲。他在大学教授过安全架构、威胁建模和安全管理。他住在蒙大拿州的落基山山脉。当他不在思考安全架构时，你可以发现他在进行越野滑雪、远足和飞钓。\n\
  \n\n\n\n此外，在过去的几年里，我们学习了许多如何基于敏捷方法并与其进行原生集成，以构建持续性软件安全计划。这包括了这些计划的管理方式，也包括如何构建一个不干扰人员实际创建和部署软件的安全开发生命周期（`SDL`）。我们的目标是让安全成为软件创建的基础，并让安全实践（即\
  \ `SDL`）成为软件开发中经纬线的一部分。\n\n正如布鲁克的《以开发者为中心的安全宣言》所述：\n\n• 赋能开发团队进行创造和创新\n\n• 确保开发者拥有所需的足够的明确性，以“正确地交付安全”\n\
  \n\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\n\n• 为开发者构建工具以检查正确性\n\n• 深度参与，使安全能够赢得其“应有的地位”\n\
  \n• “证明”安全流程和工具的价值\\*\n\n在安全从业人员中，那些专注于与开发合作并赋能开发，而非对其强加安全要求的作者绝并不孤单。在写作期间，通过与同行的交流，我们认为自己仍然属于少数。遗憾的是，通过安全专业人员的支持和专门知识来让开发人员主导安全，目前仍然是一项新兴实践，而非常态。\n\
  \n自编写《核心软件安全》（*Core Software Security*）后的多年里，我们看到的许多地壳级转变已经在进行中。然而，这些转变中，没有一个能从根本上改变大部分软件的构建方式。尽管某些开发团队可能采用敏捷软件实践来改进流程，但很少有大型组织正在将敏捷作为全组织的标准。确实，较小的组织（尤其是初创公司）可能完全是敏捷的；然而，这在软件开发世界中在很大程度上被视为“精品化”。\n\
  \n持续集成和持续交付（`CI/CD`）以及 DevOps 是某些云原生团队正在发现的方法，而其他专注于其他类型目标的团队则对这些方法所带来的生产力提升感到惊奇和好奇。但当时显而易见的是这些技术和方法如何应用于其他语境并针对其他软件目标。\n\
  \n随着敏捷方法变得越来越流行，或者正处于全组织采纳的过程中，软件安全从业人员开始注意到这一点。事实上，在起草《核心软件安全》期间，其中两位作者正参与着从向敏捷\
  \ Scrum 的组织转型。敏捷和迭代开发总的来说在书中获得一些关注，这并不令人意外。从回头来看，我们现在认为，詹姆斯和布鲁克当时领导的软件安全计划产生了行业内首批完全敏捷的\
  \ `SDL` 之一。\n\n尽管如此，软件安全行业很大程度上仍继续构建与瀑布式开发方法对齐的 `SDLs`。当时流行的已发布 `SDLs` 全是非性的，分阶段构想，假设首先是想法，然后是需求，接着是编码，最后是测试和其他验证，如果通过，则表示有发布的意愿。这些“阶段”按有序的方式相衔接。\n\
  \n这些“阶段”按有序的方式相衔接。（等等，此处此处重复或合并，我将保持核心流程）。\n\n这些“阶段”按有序的方式相衔接。（实际上，查看源代码，这里有一个重复/合并点，我将清理逻辑）。\n\
  \n这些“阶段”按有序的方式相衔接。（等等，让我仔细重读提供的文本）。\n\n这些“阶段”按有序的方式相衔接。（提供的文本在过渡处有一个类似重复的块或部分）。\n\
  \n这些“阶段”按有序的方式相衔接。（等等，提供的文本似乎有一个重复的“这些‘阶段’按有序的方式相衔接……”部分。我将坚持核心内容）。\n\n软件开发已经一直在寻找它的“常态”。我们认为，安全必须满足并实现这种常态，我们才能停止那些困扰我们数字生活的、看似永无止境的问题发布。作者的每一个人都对这里列出的建议和技术进行了实地测试——无论是整体还是单独的。然而，从整体来看，软件行业仍然在一个接又一个问题中蹒跚前进。我们知道我们可以做得更好。这种转型将是不可能的；它需要共同的努力，专注于开发者能够并且将会做的事情，并辅以重大的组织支持，包括安全思维。\n\
  \n## 1.2 当前事件\n\n在过去的 10 年左右，\\* 软件生产、使用和维护的方式发生了深刻且革命性的转变：这种范式转移已被称为“DevOps”——即“开发加上（并通过）运营”，并被统一为参与者所能培养的最无缝且整体的实践。\n\
  \n与此同时，一个运行代码和存储数据的平台已经成熟——即“云”：公共云、私有云和混合云。代码仍然运行在人的设备上，无论是手机、平板电脑、笔记本电脑还是桌面式计算机（这些仍在销售和使用）。但日益，许多以前在设备上独立运行的功能正以某种方式（通常是多种方式）与运行在云中的服务和功能绑定，这些云通常是公共商业云服务。以这种方式构建（架构设计）功能有许多令人信服的理由，其中包括：\n\
  \n• 按需服务器负载（根据需要扩展和收缩计算资源）\n\n• 易于操作、维护和更新云软件\n\n• 可用性和稳定性\n\n• 全球分布\n\n• 连续性需求\n\
  \n• 高资源计算需求（例如，人工智能和机器学习）\n\n• 更大的数据集及其处理\n\n\n\n\n- 尽可能减少设备所需的计算资源（通常使用电池电）\n\n\
  某些计算机任务在云端处理的效果远比在受限设备上好得多。大多数设备几乎“始终连接”的状态促成了一种架构，这种架构既可以利用每个环境的特性，同时实现充分的环境间通信，使得云服务的集成看起来几乎无缝衔接。\n\
  \n简而言之，软件生产和运行的范式，以及功能的构建架构方式，已经经历了相当深刻的变化，以至于如果安全要被构建并有效运行，安全技术、工具和操作必须与当前软件构建和运行的方式匹配，并且实际上能够轻松、完全且相对无痛地集成（如果当前趋势持续，在可见的未来也是如此）。\n\
  \nPatrick Debois 被誉为在 2009 年的 DevOpsDays 会议上创造了“DevOps”一词。Kim, G., Humble, J., Debois,\
  \ P., and Willis, J. (2016). The DevOps Handbook. Portland (OR): IT Revolution Press,\
  \ p. xiii.\n\nDevOps 涉及对敏捷宣言的延续：开发者必须通过高信任的工作环境对自己的工作拥有控制权，并结合高速度、快速交付的工具和方法。\n\n\
  [DevOps 创造了]：“安全的工作系统，并使小团队能够快速、独立地开发和验证可以安全部署给客户的代码。”\n\nDevOps 包括心理和文化上的转变，旨在消除各种技术专业之间的人为障碍：\n\
  \n- 创造者 (Creators)\n- 设计师 (Designers)\n- 程序员 (Programmers)\n- 验证者 (Validators)\n\
  - 运维人员 (Operators)\n- 监控人员 (Monitors)\n\n在过去，创造者将概念交给设计师并不罕见，设计师生成计划和规范，程序员实施这些，然后将其交给“质量人员”（验证者）。一旦软件通过测试，运维人员负责将软件发布到可能需要的任何基础设施（如果有）上，而某地的某人则观察反馈数据以确保软件按规定运行（监控人员）。\n\
  \nDevOps 以这种态度打破了局面：参与其中的每个人，无论其专业技能如何，本质上都有共同目标：为所有者和用户提供价值良好的软件。它们之间存在依赖关系。如果一个想法不能融入现有结构（架构）并不能实际转化为工作代码，它就是不可行的。由于错误是软件构建过程中非常常见的产物，实现者和设计师对软件测试做出了重大贡献。同时，测试人员在最有效的验证技术方面拥有专业知识。实现者需要来自运维人员和监控人员的反馈，以便软件能够有效运行，同时返回关于不一致和无意行为（即“\
  \ 错误”）的清晰信息，以便消除这些问题。展望未来，每个学科对所有其他学科都有输入，并且必须包含来自其他知识领域的依赖关系。因此，要消除“人为的知识领域墙”。\n\
  \n与此同时，编写代码以实现复杂部署和运行环境的能力发生了爆炸式增长。“运维人员”越来越多地成为了“编码员”，而不是系统管理员。那些专业管理员通过执行长系列命令来构建环境或将主机上线的时代一去不复了。绝大多数操作都可以代码化，使得确定性的逻辑条件触发软件运行。这些运行通常是高度弹性的，因为随着负载增加，虚拟运行环境会扩展以满足需求，或者在不再需要时释放资源——也就是说软件在云上运行并利用云能力。这一切都是通过代码实现的；在运维代码认为稳定运行后，不需要人工干预。\n\
  \n一组编码员可能编写架构文档，而另一组生成功能逻辑，另一组则部署和运行代码。“程序员”不再仅仅指生成功能代码的人；几乎每个角色都可能需要编码，尽管语言和工作产物有所不同。\n\
  \n尽管 DevOps 和敏捷原则并非在处处都得到严格遵守，但即使是相当命令型的组织也采用了一些与敏捷相关的技术：\n\n- 小型、独立运行的开发团队。\n-\
  \ 离散、易于理解且规模适当的任务。\n\n可以从 https://agilemanifesto.org/principles.html 获取敏捷宣言。\n\n\
  Kim, G., Humble, J., Debois, P., and Willis, J. (2016). The DevOps Handbook. p.\
  \ xvi.\n\n- 定期的（通常是每日）团队会议。\n- 工作项队列以及某些选择下一步工作的工作的流程。\n- 较短的交付周期，通常为几周。\n- 明确且离散的可交付块或项目（“最小发布增量”或“最小可行产品”）。\n\
  - 团队保留了一些开发流程的控制权，至少控制谁负责什么以及如何选择算法。\n- 在一个开发周期结束时，团队回顾上一个周期，寻找工作和流程中的挑战和潜在改进。然后，团队从识别出的改进中选择一项或几项在下一个开发周期中尝试。\n\
  \n我们的列表不应视为敏捷开发过程的定义表达。请注意，我们观察到这些方法在许多组织中被广泛采用。上述列表应被视为源自敏捷实践。\n\n许多开发组织正在缩短交付周期，并利用\
  \ DevOps 或类 DevOps 流来构建、发布和运行软件。再次，我们观察到这种趋势甚至影响了构建遗留应用的旧软件开发组织。\n\n值得重复：软件开发已经并持续经历重大的范式转变。\n\
  \n与此同时，软件安全行业实践取得了渐进式的改进。例如，如果调查已发布的 SDL（安全开发生命周期），它们强烈倾向于以线性方式表示安全开发——安全活动按照顺序从规划和设计一直到测试和发布。即使是敏捷的\
  \ SDL 演示也试图平滑化迭代，以理顺（并易于理解）从外部看可能是相当混乱的过程（尽管敏捷开发本身并没有内在的混乱性）。\n\n但在作者看来，这些试图通过线性化提供秩序的尝试是错误的。\n\
  \n首先且重要的是，由于开发者经常处理具有大量并行性和不同微型工作之间频繁反馈的任务，线性表示无法反映开发期间的实际情况。事实上，我们的经验表明，如果 SDL\
  \ 时机表达与实际开发过程之间存在巨大差异，开发者要么完全忽略或轻视安全需求和任务，因为这些要求在开发者看来是荒谬的、不可实现的，或者更糟，与他们的开发实践完全无关。\n\
  \n\n\n\n其次，现有的安全开发生命周期（SDL）通常耦合到底层的软件开发生命周期（`SDLC`）中，安全活动及其时机与之绑定。在任何使用多个单一 `SDLC`\
  \ 的环境中，某些开发者会感到被边缘化，或者更糟，产生疏离感，这再次导致了对 `SDL` 无关的感知。\n\n书中表达的集成教训是通过多年构建并维护软件安全计划才艰辛得来的。我们这些作者每个人都曾独立构建过安全计划，并共同在两家完全不同的组织中构建过两个软件安全计划。我们的错误以及最终的成功，都基于于数以千计的优秀开发者，他们足够诚实和开放，愿意分享哪些方法有效、哪些行不，并愿意与我们共同寻求更好的解决方案——这些解决方案既能提供可衡量的安全性，又能够在各种软件开发实践和风格中实现。是的，我们犯过许多错误。同样地，这项工作也是不是为我们的工程伙伴寻找解决方案，而是**与**他们共同寻找的成果。我们倾听了他们的意见，这项工作就是结晶。\n\
  \n我们将在下文中回到通用 `SDL` 的问题。\n\n尽管软件开发在过去的 10 年里发生了巨变，但我们并不是意味着安全行业（特别是安全工具）一直停滞不前。然而，工具的变革很大程度上是渐进的，而非革命性的。与\
  \ `DevOps` 相关的方法和工具的变化是革命性的：软件的生产、部署和维护方式已完全不再像在不遥远的过去那样了。\n\n各种类型的漏洞分析（`第 3 章`将详细介绍各种方法和技术）确实在提高其可靠性，为开发者提供了不同的分析选项——从作为代码编写过程的一部分分析，到漫长的全构建分析。供应商们一直在尝试将源代码分析（静态）与运行程序的动态分析相结合，以提高分析的保真度。尽管如此，这些改进中没有哪一项能精确匹配持续交付以及分区/弹性、代码驱动的负载范式，而这在云形式的\
  \ `DevOps` 中是常见的。\n\n第二个需要解决的问题是我们在发布的 `SDLs` 中反复发现的 `SDL` 与 `SDLC` 的持续耦合。即使我们在《核心软件安全》中提出的\
  \ `SDL`（第 9 章专门讨论了这一点）也存在隐含的线性问题，并试图仅涵盖瀑布型和 `Agile` `SDLC`。\n\n值得注意的是，在我们撰写《核心软件安全》时，我们的日常工作正处于\
  \ `Agile` 转型过程中。我们当时确实在深思 `Agile` 背景下的安全问题。McA 的 `Agile SDL` 可能是第一批真正的 `Agile SDLs`\
  \ 之一。也许是第一个？\n\n尽管如此，我们很难脱离于工作中面临的 `SDLC`：纯粹的瀑布型以及可以想象的每种形式的 `Agile` 实现。但 `SDLC`\
  \ 的种类远比瀑布型和 `Agile` 多。此外，观察`图 1.1`（摘自《核心软件安全》），你会看到从设计到验证的某种演进，尽管我们试图通过圆圈避免暗示强烈的线性演进。\n\
  \n但正如我们将会看到的，`图 1.1` 中列出的 `Agile` 活动、尤其是 `DevOps` 活动可以与其他活动并行进行；这些 `SDLC` 方法看重极端并行带来的益处。强制所有设计和规划在生成一行代码之前发生，没有任何益处。同样，等到绝大多数代码编写完成后再进行验证，也没有什么整体价值。所有活动都可以同时以小增量的方式执行，并提供反馈，根据从每个增量任务中学到的经验来改进每次迭代。\n\
  \n这并不是说人们在开始编码之前不需要做任何计划。这是一个经常被引用的迷言：“规划（或设计）已经死了。直接写代码吧。”事实仍然是，缺乏规划会导致架构糟糕并变得脆弱且易碎，也就是说，在不产生深远影响的情况下无法更改，而其中一些影响不可避免地包含了安全缺陷。\n\
  \n然而，同样不真实的是另一种被经常实施的安全偏好（有时被写进僵化的策略中），即要求所有安全规划必须尽早完成，最好在进行大量编码之前。通常情况下，每当不可更改的安全需求被一次性交付时，特别是在\
  \ `Agile`（迭代开发）背景下，安全需求将跟不上开发过程中的其他变化。这几乎总是导致需求被遗留在“车间现场”，未被实现，因为陈述的需求不再符合所构建内容的现实，且无法再按照规范实现。正如我们将详细看到的，安全需求与其他任何其他规范并无区别：所有的早期规范都受益于迭代方法带来的精细化、转向和学习。安全并没有特殊的属性使其与其他设计领域有所不同：安全可以像易用性或性能一样具有灵活的适应性。\n\
  \n\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\n当然，安全工具供应商有权与我们持不同意见：工具的演进还是革命。我们的意图并不是否定安全工具创造者的努力，而是引导读者关注我们认为需要解决的一系列问题，正如在本章中所述的那样。\n\
  \n我们将在后续章节中回到各种安全分析。\n\n\n\n\n之前的版本（我们本打算引用它们作为示例）保留了 SDL（安全开发生命周期）活动隐含的线性关系。读者在网站上首次接触\
  \ SDL 时，并没有发现相对于 SDLC（软件开发生命周期）时间或流程的显式排序。与我们的通用 SDL 类似，活动是围绕核心任务分组的，正如 DevOps 承认“规划”（即我们术语中的“设计”）需要一些不同于编码的方法，尽管两者（正如我们多次提到的）是紧密不可分。\n\
  \n尽管这些活动在隐性地被划分为设计/计划、代码生成和验证活动（尽管网站上并未用这些术语进行解释），但并没有隐含或显式地基于时间限制的排序。SDL 不再对活动的顺序做任何假设。这与我们的通用\
  \ SDL 一致，更密切地遵循当今的开发实践。每项安全任务都必须在其与开发适当的关系中进行；对顺序的假设只会减少解决问题（无论是安全问题还是其他问题）时的创造力。为了方便起见，活动说明已编编号：`1-12`。我们上面的引文去掉了这些无关的编号。\n\
  \n如所示，安全设计的各个方面被放在一起。同样，验证任务也被分在一起。这很有用，但并不意味着设计在编码之前。对于任何工程师来说，显而易见的是没有代码就无法进行测试。此外，除非人们至少对将构建的内容（设计）有所了解，否则编码将困难得多。但正如我们反复过的，这些是整体开发中相互作用的方面，而不是在软件开发下一阶段之前必须完全完成的离散独立活动。微软是首批创建并实施软件安全的组织之一。在我们看来，作为一家组织，微软继续以尖端的安全实践引领行业，其形式已达到极致的成熟。再次，正如我们所做的那样，正在移除瀑布式\
  \ SDLC 的产物。\n\n我们在 `Figure 1.2` 中重现了版本的 Adobe® 安全产品生命周期（`SPLC`）。Adobe 的活动名称被放置在一个圆中，方式类似于\
  \ Adobe 描述其 `SPLC`（等同于 SDL）的方法。观察 Adobe 发布的 `SPLC`，我们认为如果要把安全完全集成到 SDLC 的多种变体中（包括敏捷和\
  \ DevOps 流程）以及跨设备、云服务和后端（或服务器）处理的架构中，说明某些我们认为必须解决的问题可能具有启发性。\n\n尽管我们被多次告知 Adobe\
  \ 的开发是敏捷的，但你可能会注意到 SDL 被呈现为一个圆，一个活动流向下一个活动，这自然暗示了 SDL 任务的顺序关系。培训是首位的，尽管这并非事实：培训被预期是重复且随时可用的。一旦完成培训，就开始进行需求和规划，从而导致设计。威胁建模被包含在“设计”类别中。其说明“将针对潜在威胁的防御直接构建到新产品服务的初始设计中”是\
  \ Adobe 对威胁建模的描述。然后，开发和测试将根据需求、设计以及作为设计一部分隐含的威胁模型进行。\n\n`SPLC` 圆表示任务之间持续相互反馈，开发并非一次完成的，而是贯穿整个产品生命周期的无尽循环。圆的范式可能优于旧的线性排序。尽管如此，Adobe\
  \ 模型仍然不可避免地带有顺序和时间。\n\n迭代和并行从 Adobe 的 `SPLC` 中被消除了。活动中还植了其他概念性错误。例如，隐私必须在需求和规划期间被考虑，并作为设计活动的根本部分，而隐私工程将在设计中以及通过实施和验证得到解决。对隐私的威胁将是威胁模型的一部分。隐私需求和行为属性必须经过“工程化”，即像任何其他功能集一样被实施和测试。但在\
  \ Adobe 的“安全工程概述”中，隐私仅被作为培训项目和需求被提到。\n\n同样，尽管威胁模型是设计中隐含的交付物（并且在需求说明中提到了威胁格局），但这种分析技术实际上支撑着许多软件安全实践，且与\
  \ SDL 相关的威胁建模支撑了所有安全设计（正如我们将在 `Chapter 4` 中看到的）。如果我们不想象哪些攻击最可能针对软件发起的，然后指定那些被认为是必要的以防止攻破的防御措施，我们就无法设计安全。本质上，这就是威胁建模，无论人们选择将其命名为\
  \ SDL 的哪个“任务”。\n\n作者们已经发现，威胁建模是一项本质技术，必须从构思阶段开始就反复应用，它将贯穿整个开发过程中的许多设计和规范决策，包括为了证明或纠正威胁模型可能需要哪些验证。\n\
  \n\n\nJames 和 Brook（作者）在 2014 年初在白板上花费了几个小时，不仅绘制了 `SDL` 任务，还绘制了它们之间的关系、依赖关系和先决条件。虽然某些\
  \ `SDL` 任务相对独立，但许多任务依赖于其他任务的输出才能开始或正确完成。捕捉这些关系是理解 `SDL` 将如何流转的关键。\n\n图 1.3 是我们早期捕捉\
  \ `SDL` 任务之间依赖关系的尝试。该图高度偏向瀑布式 SDLC（软件开发生命周期），因此不应被视为对我们通用 `SDL` 的代表。然而，该图相当准确地描述了哪些\
  \ `SDL` 活动必须接收其他活动的输出。你可能会注意到，这些依赖关系并非简单易事，也不特别直观。[*]](#10-9781003002451_chapter-chap1.xhtml#fn1_11)\
  \ 尝试沿着箭头从左侧任务追踪到右侧任务几次，就足以突出由于未能理解 `SDL` 任务之间的关系而产生的问题。大多数 `SDL` 任务并不是独立且离散的，尽管\
  \ `SDL` 任务通常被这样概念化。\n\n在约 18 个月的时间（从 2015 年左右开始），Intel 特级工程师 Bob Hale^(†)（已退休）；Intel\
  \ 高级安全研究员 Catherine Blackadar Nelson（现任于 Google）；以及 Brook（时任 Intel 安全部门首席工程师）对大多数已发表的\
  \ `SDL` 进行了研究，以寻找共同点并识别差异。该团队还获取了 ISO 27034 应用安全标准的预发布草案.^(‡)\n\n遗憾的是，该研究小组的产物属于\
  \ Intel 且从未发布过。我们无法在此提供生成的 `SDL`。那个 Intel 项目产生了极可能是世界上第一个基于对现有 `SDL` 调查的共识分析而真正通用的\
  \ `SDL`。该 `SDL` 确保了不会偏于任何特定的开发方法，并且可以很容易应用于各种 SDLC。一旦团队认为他们已经有了一个 `SDL`，几个开发团队对该\
  \ `SDL` 进行了试点并帮助完善了它。试点中的软件包含了不同的运行时栈，并涉及不同的架构（从固件到操作系统），并包含了应用程序和云基础设施代码。\n\n\\\
  _\\_\\_\\_\\_\\_\\_\\_\\_\\_[[*]](#10-9781003002451_chapter-chap1.xhtml#r_fn1_11)\
  \ 我们的图完全没有尝试捕捉关系，只有依赖关系。我们回答的问题是：“是否存在某些 SDLC 或 `SDL` 活动的输出，使得 `SDL` 任务无法开始？”必须注意的是，除了依赖关系之外，某些\
  \ `SDL` 活动的执行还会影响其他活动，而不仅仅是对输出的严格依赖。\n\n† Intel 的特级工程师可以被认为基本上等同于其他组织的卓越工程师（Distinguished\
  \ Engineer）。晋升要求候选人满足技术、领导和战略标准，这些标准由同级委员会（其他特级工程师）进行评估。该头衔不是一种荣誉称号，而是对技术卓越与深度、战略交付以及组织领导力的证明，并要求在这些每个领域中持续保持领导力。\n\
  \n‡ Intel 是该标准的贡献者和赞助者。\n\n\n虽然生成的 `SDL` 无法复制，但那项工作极大影响了你将在书中发现的内容。基于我们构建真正通用 `SDL`\
  \ 所学到的知识，这样一个 `SDL` 必须：\n\n- 不基于任何假设的 SDLC\n- 表达行业对一套全面的先进软件安全实践的共识\n- 在启动任何特定的\
  \ `SDL` 任务之前，说明必要的先决条件，包括对其他 `SDL` 任务输出的任何依赖关系\n- 描述被认为任务完成必须满足的条件\n- 解释每个任务的输出（如果有）\n\
  - 描述可能触发任务输出完善或评审的任何条件\n\n当每个任务的先决条件、任务依赖关系、完成要求、输出和触发器被充分描述后，`SDL` 就会从对任何特定 SDLC\
  \ 的假设和绑定中解放出来。\n\n当我们调查每个 `SDL` 时，显而易见的是，对于哪些高级活动构成一个健壮且完整的 `SDL`，行业存在坚实的共识。第三章\
  \ 将深入探讨共识 `SDL` 的细节。此时，重要的是，尽管每个 `SDL` 对活动的命名可能不同（而且它们确实如此），但实际任务是相同的，通常仅区别于名称，或者特定的安全任务是如何划分或一组任务是如何组合的。基于我们\
  \ 18 个月的研究，对于如何最好地交付具有安全行为的软件，存在大量的大量的共识。（我们在下文中解释“安全行为”。）\n\n## 1.4 什么是安全软件？](#04-9781003002451_contents.xhtml#chap1_4)\n\
  \n鉴于对于构成合理的活动集——即共识 `SDL`——已经存在共识（即使尚未完全正式化），那么 `SDL` 想要实现什么？遗憾的是，问 10 个人他们认为什么才是“安全软件”，你可能会收到分歧的答案，甚至是\
  \ 10 个不同的答案。\n\n在《网络架构师秘密》中，Brook 写了以下内容，试图定义一组安全软件的标准：\n\n> 安全系统必须具备的行为是什么？“安全系统”是如何定义的？在我实践的多年里，当我与开发团队开启安全讨论时，我注意到经常（不是每次，但经常），团队成员会立即跳转到四个方面：\n\
  > - 数据保护（通常通过加密技术）\n> - 实现错误（通常是安全编码）\n> - 系统用户的身份验证和授权\n> - 网络级保护机制\n\n这组回答在过去的\
  \ 20 年里表现得异常稳定，这本身就值得深思。尽管过去 20 年攻击者的能力和技术发生了巨大变化——攻击目标也发生了巨变——开发者似乎仍然在考虑上述安全图的某个方面。我不知道为什么开发进度没有跟上对抗性思维的扩张，但显然没有跟上（当然，我这里的证据完全是轶事性的）。\n\
  \n为了解决开发团队通常缺乏软件安全内所需完整图景的挑战，并提供一组安全设计目标，我提出了以下安全软件原则。“安全”软件必须：\n\n- 免于可被恶意操纵的实现错误：即漏洞\n\
  - 具备利益相关者对于预期用例所需的安全功能\n- 能够抵抗针对该软件的攻击\n- 在发生故障时，必须“良好地失败”——即以最小化攻击成功后果的方式失败\n\n\
  \n\n\n\n## 使用明智的“闭源”默认值进行安装\n\n> 上述是“安全软件”在运行过程中在某种程度上表现出的属性。这些原则是理想化的，因为没有哪个运行中的系统会完美地表现出这些行为；这些行为无法实现完美的实施。事实上，就可利用的条件而言，无论是由于实现问题、未能识别出正确的安全需求，还是由于未能设计出将要正确\
  \ `[implemented]` 的内容，软件在目前的技术水平都会包含错误——如果你愿意称之为漏洞（bugs）。这些错误中的某些可能会产生意想不到的安全后果——即允许对手利用或访问某种形式的漏洞。无论喜与否，这一真理都是软件开发中的一个客观事实。\n\
  \n> 此外，还有安全上下文和预期的安全防御状态的问题：即系统或组织的安全态势。并不是每个系统都应该预期能够抵抗每一次攻击、每一个对手、任何水平的对手熟练程度以及可以投入的努力程度（考虑到各种威胁代理者的全范畴）。\n\
  \n> 因此，上述安全软件行为的存在和健壮性必须随系统和实现方式的不同而异。\n\n> 尽管如此，我预计软件应该考虑到上述行为，即使是通过意识地接受由于上述一个或多个原则的缺失缺失或薄弱而产生的风险。我的软件原则旨在驱动安全设计决策，成为努力实现的目标。这些原则中没有一个是按照描述完全构建的。这些原则并没有告诉你如何保护一个系统必须持有的凭据。相反，通过这些原则可以对设计选择进行评估。这些是指导针，而不是设计标准。（*Secrets*，第\
  \ 29-30 页）\n\n正如 Brook 在上述引言描述的那样，“安全”软件（本身是一个无意义的陈述）表现出一组相当独特的行为。软件必须或应该以这些“安全”方式运行的程度取决于风险分析和决策：没有任何软件（或任何其他人类产物）是完全“自保护”的。\n\
  \nBrook 在多次演讲以及《网络安全架构师秘密》（*Secrets of a Cyber Security Architect*）中指出，“人类可以工程化的都可以被人类逆向工程。”如果有足够的访问和资源，几乎任何防御都可以被克服。在密码学中，强度是通过破解它所需的计算年数来衡量的。也就是说，假设加密是可以破解的；这只是时间和资源的问题。如果时间超过了人类典型的工作寿命，那么该加密被认为对于特定的用途是充分的。\n\
  \n***\n\n显然，不同的加密算法和密钥大小具有不同的强度。人们必须将加密强度与需求相匹配。通常，这是通过风险分析完成的。\n\n为实体（一个系统、一个特定的软件、一个组织）的安全防御集合提供的保护程度非常类似于密码学：有效性只能通过攻击者的成本来衡量；不存在无弹不出的防御。此外，这些防御中的大部分将通过软件实现，而我们已经注意到这些实现必须被认为是有缺陷的（即“有漏洞”）。我们可以重新表述我们的指导假设为：“人类创建的任何防御都可以被人类规避。”不存在绝对安全的安全。此外，“安全”是一个主观属性。\n\
  \n安全软件的每个行为特征也是如此：考虑到软件将投入何种用途，以及软件为了保持可用性而必须抵抗的攻击水平和对手熟练程度，遵循我们的软件安全原则达到何种程度是足够的？此外，达到何种程度才足以不会对软件的所有者和用户产生他们无法轻易恢复的影响？\n\
  \n软件遵循这些属性的程度取决于上下文，并且通常在局部范围内是唯一的。如果任何作者（评论家、专家）声称他们精确地知道每一件软件必须遵循的自保护或故障恢复程度，以及哪些安全功能，将是愚蠢的。我为自己使用编写的一个微型工具，其代码和执行被限于我据推受良好保护的个人机器，其安全态势与公共云服务完全不同。\n\
  \n安全软件的每个行为特征也是如此：考虑到软件将投入何种用途，以及软件为了保持可用性而必须抵抗的攻击水平和对手熟练程度，遵循我们的软件安全原则达到何种程度是足够的？此外，达到何种程度才足以不会对软件的所有者和用户产生他们无法轻易恢复的影响。\n\
  \n软件遵循这些属性的程度取决于上下文，并且通常在局部范围内是唯一的。如果任何作者（评论家、专家）声称他们精确地知道每一件软件必须遵循的自保护或故障恢复程度，以及哪些安全功能，将是愚蠢的。我为自己使用编写的一个微型工具，其代码和执行被限于我据推受良好保护的个人机器，其安全态势与公共云服务完全不同。\n\
  \n安全软件的每个行为特征也是如此：考虑到软件将投入何种用途，以及软件为了保持可用性而必须抵抗的攻击水平和对手熟练程度，遵循我们的软件安全原则达到何种程度是足够的？此外，达到何种程度才足以不会对软件的所有者和用户产生他们无法轻易恢复的影响。\n\
  \n软件遵循这些属性的程度取决于上下文，并且通常在局部范围内是唯一的。如果任何作者（评论家、专家）声称他们精确地知道每一件软件必须遵循的自保护或故障恢复程度，以及哪些安全功能，将是愚蠢的。我为自己使用编写的一个微型工具，其代码和执行被限于我据推受良好保护的个人机器，其安全态势与公共云服务完全不同。\n\
  \n安全原则的实现方式是 SDL 应该交付的目的。当然，这并不那么简单：SDL 的某些部分旨在培养安全设计，但它们本身并不是安全设计。同样，SDL 中的活动应该减少实现错误，但它们本身并不是安全代码。此类此类推。SDL\
  \ 是实现正确水平所需的各种活动和技能的蓝图。也就是说，SDL 旨在告诉我们必须做什么才能构建出具有正确安全原则的软件。\n\n但 SDL 并不是技能的集合；它是指向正确技能的指针。在构建安全软件程序时，执行什么以及如何实现目标处于实现层面的不同水平。\n\
  \n例如，安全编码需要理解攻击者可能利用的编码错误类型。错误集合将取决于语言：允许程序操作内存的语言，其攻击类型在内存使用透明的语言中要困难得多。同样，未能选择安全设计模式会导致安全态势变弱，即可能为攻击者提供利用。\n\
  \n简之：SDL 规定了一系列流程、活动和时间，这些要素共同为开发者和系统利益相关者提供了实现上述安全行为的协调且整体的蓝图。\n\n许多现有 SDL 未能解释某些复杂性。例如，某些活动取决于开发过程中工作产品的启动、完成或可用性。某些活动取决于工作产品已经启动。其他活动则需要完成任务。与时机取决于开发任务启动的\
  \ SDL 活动相反，还有其他 SDL 活动从开发产生代码开始就开始了。这些活动随后将与开发过程同步、协作，并可能从代码产生点开始就是其不可或缺的一部分。SDL\
  \ 活动的依赖关系往往是其独特的。\n\n一个明显的例子就是验证。如果没有生成代码，就无法对代码的正确性进行验证。同样，如果没有确定主要的结构，将难以理解攻击者从哪些系统点开始攻击：这是威胁建模分析的关键因素。\n\
  \n\n\n\n然而，在测试驱动的软件开发生命周期（SDLC）中，验证测试是在编写功能之前编写的。即使在这种范式下，在有可供测试的功能之前，测试也不会运行。\n\
  \n有趣的是，渗透测试（pen testing）可以独立于安全开发周期（SDL）的其余部分。根据我们的经验，这并不是最有效的方法。（我们将在后续章节中描述渗透测试的有效条件。）我们更倾向于集成的渗透测试，它接收来自之前的\
  \ SDL 活动的输入，并为早期的 SDL 活动提供重大的反馈。然而，渗透测试并不要求之前发生过任何其他 SDL 活动。\n\n因此，一个 SDL 不仅要列出具体的活动和要求，还必须解释这些活动和要求如何协同工作，以及它们如何匹配并相互支持：即它们的依赖关系和相对时间。\n\
  \n我们刻意没有使用“绝对时间”这个词。一个显式声明活动时间的 SDL 将与开发软件的过程绑定，即与将采用的特定软件开发生命周期（`SDLC`）。正如本章之前概述，通用的\
  \ SDL 不能绑定到任何特定的 `SDLC`。如前所述，时间假设会将 SDL 的应用限制在特定形式的 `SDLC` 中。这样做将导致 SDL 无法用于替代 `SDLC`。\n\
  \n我们相信，基于为之前的任雇主所的工作（如上所述），创建和使用不与特定 `SDLC` 的 SDL 不仅是可能的，而且是可以证明的。为了交付通用的 `SDL`，它必须包含：\n\
  \n* 一套全面的安全活动，被认为了交付软件安全的行业共识\n* 一套配套且集成的要求，解释为何以及何时执行这些活动\n* 解释如何执行这些活动和要求的流程\n\
  * 在开始每个活动和要求之前必须实现的一系列先决工作产物\n* 执行和履行活动及要求后预期的工作产物\n* 任何在这些条件存在时需要开始并重新评估活动及其输出的情况\n\
  * 对“完成”（definition of done）的定义，显式说明活动何时可以被认为已完成并满足了其安全需求\n\n上述项目符号从高级水平描述了一组需求，如果满足这些需求，将满足任何\
  \ `SDLC` 下软件开发的 SDL 需要。这样的 SDL 将完全独立于任何特定的 `SDLC`，并可以作为每个 `SDLC` 的不可或的一部分而执行。\n\n\
  正如我们已经注意到的，软件安全从业人员对这样一组活动存在共识，考虑到目前（截至本文撰写时）的技术水平，这些活动共同构成了实现软件安全目标最佳机会。\n\n各种活动的名称上存在差异。活动的粒度上也存在差异：某些发布的\
  \ `SDLs` 拆分了其他模型归为一类的活动。这在设计阶段活动中尤为如此，在这些活动中，SDL 制定者试图为实际上通常不需要任何特定或严格排序的工作提供线性顺序。\n\
  \n我们将在后续章节中以相当详细的内容深入探讨今天软件开发方法的非线性，以及所需的、不可整合的安全工作。正如我们以后看到的，尝试将必须是整合过程转换为离散的（且单独命名的）活动是一种常见的错误，这种错误将\
  \ SDL 与 SDL 活动必须集成的软件开发隔离开（对于某些 `SDLC` 来说，这种分离使其几乎毫无意义）——看似需要仔细安排 SDL 活动的需求，恰恰消除了实现软件安全所必需的这种集成。\n\
  \n“扁平化”通常并行的迭代 `SDLC` 活动会在安全与开发之间划出虚假的界限，这完全是适得其反的。根据我们的经验，当 SDL 不再表示为高度定义的任务进展时，`SDLC`\
  \ 的集成变得简单、自然且有机。开发者乐意（更重要的是，渴望地）将安全任务作为软件开发结构中不可或缺的一部分加入，这使得非生产性流程摩擦的机会减少到几乎为零。在程序构建的章节中，我们将更详细地讨论这个主题。在此时，我们为本书提供的\
  \ SDL 设定了背景。\n\n建立一个通过开发交付所需安全态势的活动集是不够的。SDL 还必须包含显式要求，说明在任何更改期间的何以及在何一点执行每个相关的\
  \ SDL 活动。通用的 SDL 不需要尝试预测特定时间，要求也不需要绑定到对 SDLC 的假设上。\n\n事实证明，执行 SDL 中即使是技巧最丰富的活动，其触发器也是相当确定的。我们在《Core\
  \ Security》的第 9 章中发布了几个触发器——特别是 `9.2.1 七个决定性问题`。我们稍后会重申这些内容；它们一个都没有改变，尽管我们将围绕威胁建模重塑安全设计活动——这是我们在发布《Core\
  \ Security》后获得的后续理解。在这项工作的目前，只需理解活动执行的指示牌可以在不与任何 SDLC 绑定的情况下定义且已经定义就足够了。不需要为了给开发者提供安全要求就确定地安排\
  \ SDL 的顺序。\n\n某些 SDL 活动是独立的：这些可以在不参考其他活动的情况下执行。例如，安全编码取决于针对特定语言的培训，涉及必须避免的错误以及在该特定语言和运行时环境中提供最少（或更好的是，没有）攻击者杠杆利用的编码模式。在假设有培训的情况下，唯一的依赖就是有代码要生成。\n\
  \n另一方面，熟练的渗透测试在系列更改几乎完成之前（即软件以发布时的状态运行）并不特别有效。渗透测试并不一定依赖于完成所有其他相关的 SDL 活动。许多组织错误地假设熟练的手动（渗透）测试是最重要的活动，可能是唯一需要的活动。坦率地说，这是一个巨大的错误，因为如果是这样，人们在使用最昂贵、最独特且定制的工具来发现本可以更早、更低成本地发现或完全避免的问题。\n\
  \n因此，理想的熟练手工测试活动应当（根据我们的强烈意见）依赖于所有之前相关的适用 SDL 活动的成功完成。渗透测试应该被作为之前 SDL 工作的证明（或否）。渗透测试不应该是实现预期安全目标的兜底、单一活动：熟练的渗透测试发生发生时已经太晚了。\n\
  \n\n\n同样，在建立正确的安全结构之前就生成特定的安全设计通常是一个错误；因此，在尝试（或选择，取决于 SDLC 方法）特定算法之前，已经成功完成了级别的安全结构化（架构）活动。设计（安全和其他设计）依赖于相对完成的结构化理解。两者之间还存在一个重要的反馈循环：设计约束可能很大（应该）影响结构（架构）的选择。这两项活动是相互依赖的，在某些\
  \ SDLC 方法中，它们紧密结合；可能几乎不需要将它们分开。因此，`SDL` 必须明确说明架构与设计如何相互作用或结合，否则将产生误解，或者更糟，在执行过程中产生摩擦。\n\
  \n最后，每一个 `SDL` 活动必须绝对告诉开发者何时可以认为该活动已完成、何成功”意味着什么、如何衡量有效性、该活动预期实现什么目标以及如何证明这些目标已经实现。那些执行取决于（有时很大程度上）经验和人工分析的活动——即既像“工艺”又像工程的活动——看起来像是一个无尽的时间黑洞。这个问题可能会困扰那些负责确保开发按时、预算内完成的人（通常是项目管理及类似的角色）。\n\
  \n我们向这许多（数百））不懈组织和驱动看似从外部看是混乱系统的人——软件开发——致敬。安全不能增加这种负担。我们在这里提供的 `SDL` 为每项活动都有明确的目标。对于\
  \ `threat modeling` 等活动，我们之前发布过一个相当清晰的“完成定义”，既作为博客文章，也在 *Secrets of a Cyber Security\
  \ Architect*（附录 E，第 203-206 页）中，我们将在此重申。每一个 `SDL` 活动都必须包含可以确定其完成的条件。必须有某种方法来衡量该活动在什么种程度上是有效或成功的。\n\
  \n总之，基于我们丰富的经验，我们认为可以实现一种不紧密于任何特定 `SDLC` 且其表达方式不会导致集成到软件开发中变得困难甚至不可能的 `SDL`。我们见过。我们曾将安全作为开发织体的一部分来体验；我们将开发组织从规避安全转变为一种安全文化，即\
  \ Noopur Davis 所说的“文化黑客”。我们发自内心地知道，这些目标不仅是可能的，而且是可以轻松实现的。\n\n这段旅程并不容易。局部差异和独特需求始终存在。不同的业务和组织目标需要不同级别的安全；没有“一刀切”的安全态势。。象牙塔式的安全宣言恰恰如此：不是现实世界的需求。\n\
  \n尽管如此，通过使用适应本地需求的通用的、基于共识的 `SDL`，我们已经看到组织实现了他们的安全目标。我们衡量了我们所负责的软件中可避免的安全泄露的减少情况。在我们的职业生涯中，没有什么能比这更让我们有成就感了。在本书书中，我们希望分享我们的技术、流程和组织方法，以便你也能获得其中的一些回报。\n\
  \n## 1.5 开发一种适用于任何开发方法论的 SDL 模型\n\n确保每个触及产品开发生命周期的人都拥有支持组织软件安全流程所需的知识，对于任何致力于实现软件安全成功的组织来说，都是是一项基础性挑战。其目标是消除组织在根据自身资源限制和知识真空下开发自定义计划时所面临的痛苦。开发者通常面临着巨大的压力，要求按时、预算内交付更多功能。很少有开发者有时间审查代码以发现潜在的安全漏洞。当他们有时间时，往往缺乏安全代码培训，并且缺乏自动化工具、嵌入式流程和程序以及防止黑客使用数百种常用利用技术触发恶意攻击的资源。\n\
  \n遗憾的是，在 `DevOps` 和 `DevSecOps` 之前，许多公司认为生产安全软件产品比生产它们更符合商业逻辑。任何解决方案都需要将此视为一种根本性的市场失败，而不是简单地希望它不是事实。如果安全要成为一个业务目标，那么它就需要符合商业逻辑。归结底，安全需求与任何业务目标一样，并应该被视为同样重要。雇主应该期望员工对自己的工作感到自豪并承担某种程度的责任。员工也应该期望雇主提供他们完成工作所需的工具和培训。\n\
  \nDevSecOps 需要一种新的安全模型，需要新的思维、流程和工具以适应 DevOps 的协作性和敏捷本质。主要重点是为复杂的软件开发创建新的解决方案。为了迁移到新模型，你必须完全理解当前的流程和生命周期，以便弥合软件开发、运营和安全团队之间的传统鸿沟。这应该包括在交付的所有阶段关注安全任务的共同责任。\n\
  \n重新发明你执行 `SDL` 的方式是将你在敏捷和 DevOps 环境中优化安全的关键。`SDL` 的目标是双重的：第一个目标是减少安全漏洞和隐私问题的数量；第二个目标是减少剩余漏洞的严重程度（即“安全技术债”）。\n\
  \n\n\n\n软件开发人员知道如何编写具有高安全性和健壮性的软件。那么，为什么软件开发人员不实践这些技术呢？书中的模型将从两个部分来回答这个问题：\n\n1.\
  \ 软件的安全性取决于对程序如何被使用、在何种条件下使用，以及其在部署环境中必须满足的安全体系的分析。`SDL` 的涵盖范围还必须扩展到产品发布之后，因为如果软件在非计划的运行环境中的基础假设及其先前的隐式需求不再成立，该软件可能不再是安全的，且如果需要对产品进行完全重新设计，`SDL`\
  \ 过程可能需要部分或全部重新开始。从这个意义上说，作者确定了建立准确且有意义的安全需求以及管理这些需求的指标的必要性，并提供了如何开发这些需求的示例。它还假设安全需求在开发过程之前并非都是已知的，并描述了推导、分析和验证这些需求的过程。\n\
  \n2. 软件部门高管、领导者和经理必须支持业务相关的 `SDL` 所要求的健壮编码实践和必要的安全增强，并支持此类此类工作所需的人员配置、进度安排、预算编制和资源分配。该模型的一部分涵盖了这些角色人员的过程、需求和指标管理，以便他们准确评估一个与其组织和环境相关且运行效果最好的\
  \ `SDL` 所需的影响和资源。该模型是从现实、基地的挑战和经验中引入并设计的；作者描述了如何思考这些问题，以开发有效的方法并将其作为业务流程进行管理。\n\n\
  由于安全性被紧密集成到 `Agile` 过程的每个部分，因此通常在 `Waterfall SDLs` 中常见的某些参与活动不再是必须的。安全性被构建在过程中，从产品构思开始，并贯穿整个过程。事实上，早期的安全需求收集必须在完成一份“意图计划”（Plan\
  \ of Intent）时完成。过程的这部分等同于参与问题：“架构是完全重新设计还是全新的？”同样，一旦启动了架构跑道（architecture runway），安全架构师应该被纳入塑造架构的架构团队中，以促进产生将所需的适当安全特性。\n\
  \n`Agile` 过程的安全部分假设了一个迭代的架构和设计过程。在这个过程中，迭代与精炼与安全性之间并不存在紧张关系。安全性并没有试图“限制”迭代过程。相反，由于安全专业知识是迭代和精炼不可或缺的一部分，安全设计将是\
  \ `Agile` 过程的自然结果。通过这种方式，安全性变得 `Agile`——即能够快速适应变化。这种方法产生了灵活、敏捷的安全架构。\n\n一个高层抽象：设计、构建和验证在各种方法论中保持相对稳定，尽管敏捷方法将这些中的部分转变为一组迭代的、并行的持续且重复的任务。由于整个敏捷过程强调迭代，通常的\
  \ `SDL` 活动也必须迭代，否则会被遗弃在后。在正式 `Sprints` 开始之前的架构并不是为了成为一个完成的过程，而是一个网关，用于种子、告知并赋能 `Sprints`\
  \ 期间将进行的迭代设计。单此这一点，就与架构被视为一个离散且独立过程的方式截然不同。相反，许多形式上离散的 `SDL` 任务在任何特定的 `Sprint` 期间并行进行。安全设计、安全编码、手动代码审查或任何不需要完整的、或多是整体软件的测试方法都在同一时间由同一团队进行。上述意味着，安全性不能跳出来发表声明，然后又跳回去，直到之后的某个治理步骤，那里将对安全计划是否执行正确进行判断。敏捷的本质意味着计划将根据新获得的信息而改变。因此，我们的方法是让安全性从该迭代过程中受益。\n\
  \n此前，在 `Core Software Security` 中，我们对 `Waterfall model` 进行了详细概述，并修改了它以创建我们的第一个敏捷开发过程版本。我们还利用它在\
  \ `DevOps` 和 `DevSecOps` 成为这种模式之前，将安全职责转移到了开发小组。在继续描述一个可以适用于任何开发方法的模型之前，回到我们的起点以及我们构建后续章节中所讨论内容的基准（baseline）是关重要的。`DevSecOps`\
  \ 方法驱动了技术、运营和社会层的变革，帮助组织更有效地、实时地应对安全威胁。这为安全性在开发和运维团队中提供了一个“一席之地”，并使其成为交付速度的价值所在而非阻碍。接下来的几节描述了软件开发实践的演进，包括我们在\
  \ `Agile environment` 中使用的之前的 `Waterfall-type SDL model`，随后是一个完全针对 `DevOps environment`\
  \ 充分优化的、可以适用于任何开发方法的新型模型。\n\n### 1.5.1 我们之前的安全开发生命周期设计和方法\n\n我们从本节开始，介绍如何通过使用 `SDL`\
  \ 来克服使软件安全的挑战的理念，如 `Core Software Security` 中所述的。自该书出版以来，软件安全以极快的速度进化。\n\n在本节中，我们将快速从对我们之前设计的回顾转向与\
  \ `Agile methods` 更好地契合的方法，并在书的剩余部分介绍一种更适合 `DevOps environment` 的设计。\n\n关于管理和使软件安全的模型、方法论、工具、人才和指标的进一步讨论，可以在书的后部分找到。\n\
  \n需要注意的是，仍然需要更好的静态和动态测试工具，以及一种集成到 `SDLCs` 中的形式化安全方法，且这种方法必须是大多数软件开发组织能够达到的。在过去的十年左右，主流的\
  \ `SDL models` 对于资源最丰富的公司之外的所有公司来说都是不可及的。我们在这本书的目标与之前的书籍相似：创建一个基于利用资源和最佳实践的 `SDL`，而不是要求大多数软件安全团队无法企及的资源。\n\
  \n\n\nSDL（安全开发周期）是软件安全演进的关键步骤，并帮助人们关注在 `SDLC`（软件开发生命周期）中构建安全的需求。过去，软件产品的利益相关者并不将软件安全视为高优先级。他们认为安全的网络基础设施就能提供针对恶意攻击所需的保护。在近期的范围内，仅靠网络安全已被证明应对此类攻击是不够的。用户已成功通过跨站脚本（`XSS`）、结构化查询语言（`SQL`）注入和缓冲区溢出利用等技术渗透有效的身份验证通道。在这种情况下，系统资产遭到破坏，数据和组织完整性也受到了损害。安全行业一直试图通过权宜措施解决软件安全问题。首先是平台安全（`OS`\
  \ 安全），然后是网络/边界安全，现在是应用安全。我们需要深度防御来保护资产，但从根本上说，这是一个软件安全缺陷，需要通过软件安全方法（`SDL`）来修复，这种方法需要与\
  \ `SDLC` 开发者的使用紧密集成并有机结合。\n\n我们可以将这种集成称为软件安全的“SDLC 方法”，或类似于“以开发者为中心的安全”。无论我们如何称呼它，核心概念是：易于实现的\
  \ `SDL` 必须支持开发者正在使用的开发方法（`SDLC`）。我们的方法与软件安全方法发生了根本性的转变，那些方法强制开发者也学习并适应与他们的 `SDLC`\
  \ 相冲突的安全方法。\n\n`SDL` 的基础组件包含了开发出符合行业和政府标准以及遵循最佳实践的加固软件所需的所有活动和安全控制。需要具备知识的员工，以及安全的软件策略和控制，才能真正防止、识别和缓解开发系统内部可利用的漏洞。\n\
  \n未能满足安全 `SDLC` 中这些基础的活动，将为内部和外部威胁误用系统资产提供机会。安全不再仅仅是一个网络需求，它现在是一项信息技术（`IT`）需求，涵盖了所有旨在分发、存储和处理信息的软件的开发。组织必须实施最高标准的开发规范，以确保为客户及其所保护的生命提供最高质量的产品。\n\
  \n`SDLC` 程序的实施确保了安全是良好的企业软件设计和开发的固有属性，而不是生产后期的事后考虑。采用 `SDLC` 方法可以产生切实收益，例如确保所有软件发布都符合最低安全标准，并确保所有利益相关者都支持并执行安全指南。在开发周期的早期消除软件风险（此时漏洞更易修复且成本更低），为信息安全团队在开发过程中协作提供了一种系统化的方法。\n\
  \n### 1.5.2 将安全开发生命周期 (SDL) 映射到软件开发生命周期 (SDLC)\n\n无论你使用何种形式的 `SDL`，无论是已有的、你自己开发的还是两者的结合，你都必须将其映射到你当前的\
  \ `SDLC` 中才能使其生效。`图 1.4`（原为 `图 2.4`）是一个 `SDL` 活动和最佳实践模型，该模型由作者开发，并已映射到典型的 `SDLC`\
  \ 阶段。每个 `SDL` 活动和最佳实践都基于实战经验，作者的示例向读者展示了安全可以被构建到 `SDLC` 的每一个阶段中——可以说，这是安全到 `SDLC`\
  \ 的映射。如果安全是[作为开发任务的核心部分]被构建的，那么软件在默认情况下安全的概率更高，且随后的软件更改不太可能损害整体安全性。这种映射的另一个处是，你可能已经与\
  \ `SDL` 的所有者和利益相关者合作过，这将有助于在 `SDLC` 的运营和业务过程中建立认同感、效率和可实现的安全性，并涵盖开发者、产品和项目经理、业务经理以及高管。（如前所述，`图\
  \ 1.4` 中的模型是基于作者在软件和信息安全领域多年的经验、研究以及与利益相关者/客户的互动。）\n\n``图 1.4` 中 `SDL` 的每个阶段在《软件安全》中已进行了详细描述，并如\
  \ `图 1.5` 至 `1.10` 所示。\n\n### 1.5.3 软件开发方法\n\n在《软件安全》中，我们讨论了各种 `SDLC` 模型，并提供了我们对通用\
  \ `SDLC` 映射的视觉概述。然而，需要注意的是，各种 `SDLC` 模型内部使用了多种软件开发方法。每种软件开发方法都是开发和维护软件的特定框架的基础，其对组织方面的关注多于技术方面。这些开发方法的主要方法包括瀑布模型和敏捷开发（`Agile`）。瀑布模型是最古老且广为人知的软件开发方法。敏捷方法在行业内日益流行，尽管包含了传统和新的软件开发实践。你可能会看到敏捷、传统的瀑布，或者两者的混合。我们选择对瀑布和敏捷开发模型进行高层次描述，以及各自的一两种变体，作为软件开发方法的介绍。\n\
  \n#### 1.5.3.1 瀑布开发\n\n瀑布开发（见 `图 1.11`）是传统软件开发方法的另一种称呼。这种方法的风险更高、成本更高且效率较低，与后文将讨论的\
  \ `Agile` 方法相比。瀑布方法使用已知的需求，每个阶段在下一个阶段之前都经过签字，并且需要大量的文档，因为它是整个过程中的主要的通信机制。\n\n\n\n\
  \n尽管瀑布式开发方法各不相同，但它们具有相似之处，即从业者试图遵循初始计划、在周期非常晚的阶段之前没有可运行的软件、假设他们从一开始就了解所有情况、通过变更控制委员会将变更最小化（即假设变更是有害的且可以控制的）、将大部分责任推给项目经理（PM）、优化对进度和预算的遵循率、通常使用较弱的控制，并且仅在完成后才允许价值实现。它们由一种以项目经理为中心的方法驱动，这种观点认为只要遵循了计划中的流程，一切就会按计划进行。在当今的开发环境中，上述大多数项目被认为是瀑布方法的负面属性，这也是行业向敏捷开发方法转变的原因几个之一。瀑布方法可以被视为一种流水线作业方法，这种方法在恰当应用于硬件时可能非常出色，但在软件开发方面与敏捷方法相比则存在短板。\n\
  \n#### 1.5.3.2 迭代瀑布开发\n\n迭代式瀑布开发模型（参见图 1.12）是对标准瀑布模型的改进。这种方法比传统的瀑布方法风险较低，但比敏捷方法风险更高、效率更低。在迭代瀑布方法中，整个项目被划分为若干阶段，每个阶段都使用传统的瀑布方法执行。将较大的项目划分为可识别的小阶段，会导致每个阶段的工作范围缩小，并且每个阶段的最终交付物可以在进入下一阶段之前审查并改进。因此，整体风险降低了。\n\
  \n迭代方法已经显示出比传统瀑布方法的显著改进。在今天的环境中，你更有可能面对敏捷的软件开发方法，而不是标准或迭代的瀑布方法。\n\n#### 1.5.3.3\
  \ 敏捷开发\n\n敏捷方法基于迭代和增量开发方法。需求和解决方案通过自组织、跨职团队之间的协作不断演进，每次迭代产生的解决方案在整个过程中都会经过审查和完善。敏捷方法是一种受时间限制的迭代方法，有助于对变化做出快速灵活的响应，反过来促进了演进式开发和交付，同时在整个项目生命周期内促进自适应规划、开发、团队合作、协作和流程适应性。任务被分解为需要极少规划的小增量。这些迭代具有被称为“时间箱”的短周期，持续从一周到四周不等。发布产品或新功能可能需要多次迭代。跨职团队负责每次迭代中的所有软件开发功能，包括规划、需求分析、设计、编码、单元测试和验收测试。敏捷项目通常是跨职的，自组织团队独立于任何公司层级或其他个人团队成员的其他公司角色运行，团队成员自己决定如何满足每次迭代的需求。这使得项目能够快速适应变化并最小化整体风险。目标是在迭代结束时提供一个可发布的版本，并在每次迭代结束时向利益者演示可运行的产品。\n\
  \n\n#### 1.5.3.4 Scrum\n\nScrum（参见图 1.13）是一种用于管理软件项目以及产品或应用程序开发的迭代且增量的敏捷软件开发方法。Scrum\
  \ 采用了一种经验主义方法，接受问题无法被完全理解或定义，而是专注于最大化团队快速交付和响应新兴需求的能力。这是通过使用能够代表所有学科的同地自组织团队来实现的。与传统的计划或预测性方法相比，这一概念有助于处理客户在项目开发过程中更改需求而产生的震动。Scrum\
  \ 的开发基本单元被称为“冲刺（Sprint）”，一个 Sprint 可以持续一周到一个月不等。每个 Sprint 都是受时间限制的，以确保产品的完成部分按时完成。从产品待办列表中派出一个优先级需求列表，如果它们在\
  \ Sprint 期间未完成，则会被忽略并返回产品待办列表。团队在每个 Sprint 完成后演示软件。通常公认的 Scrum 增值属性包括：它使用自适应规划；它要求在第一个\
  \ Sprint（通常为两周）早期且经常获得可运行软件的反馈；它强调良好变更的最大化，例如关注在整个项目过程中学习过程的最大化；它将大部分责任留给小型、专门的自适应团队，由他们规划并重新规划自己的工作；它具有强大且频繁的控制；优化了业务价值、上市时间和质量；以及它支持更早地实现价值，可能在每个\
  \ Sprint 之后。\n\n\n#### 1.5.3.5 精益开发\n\n根据我们的经验，对于你们中最近转型或正在从瀑布式软件开发方法转型的人来说，Scrum\
  \ 是你们最可能遇到的敏捷变体。精益（参见图 1.14）是另一种日益流行的方法，因此值得提及。遗憾的是，精益有很多定义，它是一种向许多方向发展的策略。虽然精益与\
  \ Scrum 的相似之处在于它们关注功能而不是功能组，但它更进一步：在最简单的形式下，你在选择、规划、开发、测试和部署下一个功能之前，先完成一个功能的选择、测试和部署。其目标是将风险进一步隔离到单个功能的水平。这种隔离的优势在于可以尽可能消除“浪费”，除非绝对必要或相关，否则不做任何事情。精益开发可以用基于精益生产原则的七原则来总结：(1)\
  \ 消除浪费、(2) 放大学习、(3) 尽可能决策、(4) 尽可能交付、(5) 赋能团队、(6) 构建完整性、(7) 顾全局。精益开发的一个关键要素是提供一个模型，即使你的开发者分散在多个地点和承包商处，也能看到整体。尽管社区中的许多人仍认为与敏捷相关，但精益软件开发是一种相关的学科，而不是敏捷的特定子集。\n\
  \n\n\n\n\n\n# 从瀑布模型到敏捷\n\n直到几年前，大多数软件开发项目都是使用*核心软件安全*中所描述的瀑布模型创建的。通常，会使用复杂的甘特图详尽地列出每一个步骤、里程碑和交付日期，以此管理瀑布流程，并说服管理层对项目具有完全的控制和可预测性。\n\
  \n这种流程试图限制变化和开发过程中的创造力。它没有考虑到和适应未知因素，也不支持短期的路线调整。遗憾的是，我们仍然看到某些团队在敏捷和即时（just-in-time）环境中使用这些图表和方法来管理项目，这简直是灾难的根源。与今天的实践相比，这是一个非常缓慢的过程，可能会导致数月甚至几年的延迟，并造成严重的预算超支。\n\
  \n## Scrum 的诞生\n\nJeff Sutherland 在 1993 年与 Ken Schwaber 共同创立了 Scrum，将其作为科技行业中一种软件的一种更快速、更可靠且更有效的方法。Jeff\
  \ 在他最近的书中写道：\n\n> “‘敏捷’一词可以追溯到 2001 年的一次会议，当时 16 位软件开发领域的领袖写成了后来广为人知的《敏捷宣言》。”它宣布了以下价值观：人胜于流程；可运行的产品优于记录产品的功能；与客户合作而非与其谈判；响应变化优于遵循计划。Scrum\
  \ 我为了实践这些价值观而建立的框架。它并不是一种方法论。\n\n## Scrum 框架\n\nScrum 提供了一个框架，使团队能够通过自组织以及对他们创建了什么和如何创建产品的认知，优化速度和质量。Scrum\
  \ 的底层流程包括：\n\n- 识别要在固定时间内完成的增量目标。\n- 每日同步会议（通常为 15 分钟或更短），称为 `Daily Standup`。\n\
  - 设定目标和预期。\n- 跨功能、自主的团队。\n- 冲刺（Sprints）时间很短，通常根据需要持续二到四周。\n\n每个冲刺周期的目标是产生一个可以发布的产品增量。团队在此检查他们的进度，并识别哪些地方做得良好，哪些地方需要更改。`Backlog`\
  \ 是一个关于产品中所有需求的动态文档。\n\n## 改善与持续改进\n\nKaizen 是日语中“*改进*的意思，在 Scrum 中常用于识别可以做得更好的地方。这是通过在每个冲刺结束时进行的\
  \ `Sprint Retrospective`（冲刺回顾）实现的，以识别哪些做得是对的、哪些可以更好，以及在下一个冲刺中可以改变什么。最重要的是，这并不是寻找为错误负责的人，而是团队对自己的流程和结果负责，以团队的形式寻求解决方案及其执行能力。\n\
  \n从这个意义上说，Kaizen 是识别哪些将真正改变流程并在下一次使其变得更好的因素。如果你熟悉 `PDCA` 循环，这就是 `Check`（检查）部分，这也就是为什么建立进入\
  \ `Act`（处理）步骤的能力如此重要的原因。每个冲刺都应该识别并解决至少一项改进或 kaizen，并将其成为下一个冲刺中要完成的最重要任务。\n\n\n\n\
  \n\nAgile Alliance. (2020). “INVEST 术语定义.” 检索自 [`www.agilealliance.org/glossary/invest/#q=-(infinite-false-filters-(postType-(-’page-‘post-‘aa_book-‘aa_event_session-‘aa_experience_report-’aa_glossary-‘aa_research_paper-‘aa_video)-tags-(-‘invest))-searchTerm-‘-sort-false-sortDirection-’asc-page-1)`](https://www.agilealliance.org/)\n\
  \n- **独立性（Independent）**：故事必须是可操作的且能够独立“完成”。它不应该从本质上依赖于另一个故事。\n- **可协商性（Negotiable）**：在实际执行之前，它需要是可重写的。内部预留了变更的空间。\n\
  - **价值性（Valuable）**：它能够为客户、用户或利益相关者交付价值。\n- **可估性（Estimable）**：你必须能够对其进行规模估算。\n\
  - **小型（Small）**：故事需要足够小，以便于轻松估计和计划。最好情况下，这应该在单个 `Sprint` 中完成。如果它太大，请重写它或将其拆分为更小的故事。\n\
  - **可测试性（Testable）**：故事必须至少有一个它预期通过的测试才能算完成。在编写故事之前先编写测试。\n\n每个用户故事都写在索引卡或便利签上，用一个简短的描述性句子提醒团队其价值。这使得团队能够通过在工作板上移动便利签或卡片，更容易在安排进度方面做出集体决策。用户故事不应与\
  \ `Use Case`（用例）混淆。`Use Case` 是对最终用户想要“使用”系统的所有方式的描述。`Use Cases` 捕捉了用户与系统之间交互以实现用户目标的所有可能交互方式。此外，过程中可能阻碍用户实现目标的错误情况也被记录为\
  \ `Use Cases`。\n\n传统的瀑布流团队可能会因为等待太久才从彼此、业务部门和市场获得可操作的反馈而导致失败，并疑惑哪里出了问题。相比之下，当 `Scrum`\
  \ 管理得当时，可能导致失败的因素是可见的并会被迅速解决。通过带有便利签的工作板来使工作可视化，便利签显示所有需要完成的工作、正在进行的工作以及已完成的工作。它应该每天更新，并且每个人都应该看到。\n\
  \n“史诗（Epic）”是相关用户故事的集合，这些故事无法在单个迭代内完成。虽然团队决定如何完成每项任务，但业务价值是将被完成的内容，通常在 `Epic` 中定义。\n\
  \n最重要的是由 `Sprint` 决定你先要做什么。我们认为杰夫·萨瑟兰（Jeff Sutherland）说得最好：\n\n> 关键在于你决定先做什么。你需要问的问题是：哪些项目对业务影响最大、对客户最重要、能产生最多资金，且最容易实现？你必须意识到，该列表上有很多事情是你永远无法触及的，但你希望先完成那些以最低风险交付最高价值的事情。通过\
  \ `Scrum` 的增量开发和交付，你希望从能够立即产生收入的事情开始，有效地为项目“去风险”。而且你希望在功能层面上做到这一点。\n\n帕累托法则（也称为\
  \ 80/20 法则）应用于软件开发时，意味着 80% 的价值集中在 20% 的功能中。那 80% 被认为是浪费的精力，是开发团队面临的管理挑战。在瀑布流开发流程主导的时代，团队在产品开发完成之前不知道那\
  \ 20% 是什么。`Scrum` 中最大的挑战之一就是确定如何先构建这 20% 内容。然而，需要注意的是，安全性通常不符合 80/20 法则；相反，80% 的权重可能被利用利用，相对于另一个\
  \ 80% 的权重。我们将在书的后部分进一步讨论这一点，以及安全如何进入“待办”列表。遗憾的是，通常存在误解，认为安全是“非功能性的”。在本书的稍后部分，我们解释了安全如何融入关键的\
  \ 20% 中，以及安全如何被视为为产品带来价值。\n\n***\n\nSutherland, J. (2014). *SCRUM: The Art of Doing\
  \ Twice the Work in Half the Time.* p. 137.\n\n同上，p. 174.\n\n`Scrum` 中有三个角色：\n\n\
  - **团队成员（Team Member）**：执行工作的团队组成部分。虽然设定战略目标是管理层的责任，但在 `Scrum` 中，决定如何工作以及达成这些目标是团队成员的责任。\n\
  - **Scrum 经理（Scrum Master）**：`Scrum Master` 负责“如何”，包括团队进展多快以及能快多少，是负责帮助团队弄清楚如何工作的团队领。`Scrum\
  \ Master` 负责以下工作：\n    - 担任软件开发团队的领导\n    - 监督编程代码和产品的设计、实现、QA 和验证\n    - 创建项目计划和时间表，并将责任分配给团队成员\n\
  \    - 促进每日 `scrums`、站会和会议，以监控项目进度并解决团队可能遇到的任何问题\n    - 通过敏捷方法的卓越管理来塑造团队行为\n   \
  \ - 对软件开发团队成员进行评审\n    - 消除项目障碍并与团队制定解决方案\n    - 确保在整个项目生命周期内达成里程碑并满足期限\n    - 与利益相关者、用户和程序负责人建立良好关系\n\
  \    - 记录进度并向高层和利益相关者汇报\n    - 对成功交付产品负责\n- **产品负责人（Product Owner）**：`Product Owner`\
  \ 负责“如何”，定义工作应该是什么。他们是负责最大化 `Scrum` 开发团队创建的产品价值的领导。这是一个多功能角色，包括业务战略师、产品设计师、市场分析师、客户联络和项目经理。他们也是\
  \ `Backlog`（待办列表）的所有者，主要决定包含什么以及项目的顺序。团队信任 `Product Owner` 能正确优先排序 `Backlog` 是重要的。\n\
  \n\n\n\n\n产品所有（Product Owner）需要的技能与 Scrum 经理（Scrum Master）有所不同，因为他们负责将团队的生产力转化为价值。这意味着产品所有不仅必须是领域专家，还需要具备足够的市场知识以了解哪些因素会产生影响。他们成功的关键要求在于是否拥有决策权。如果没有这种授权，无论他们担任该角色的背景有多优秀，都可能可能会失败。他们必须平衡这种权力：虽然他们对团队的结果负责，但必须让团队做出自己的决定。这意味着为了作为待办列表（Backlog）所有者获得尊重并承担责任，他们必须定期与团队沟通需要做什么以及为什么要这么做。这通常需要每天与\
  \ Scrum 团队进行沟通。通过讨论这些工作量增量，产品所有能够观察人们对它的反应，以及它创造了或没有创造多少价值，以便在下一个冲刺（Sprint）中实施任何必要的更改。这种持续的反馈循环促进了创新和适应。结果是，价值是可以衡量的。\n\
  \n***\n\nZip Recruiter. (2020). “Scrum Master Job Description Sample Template.”\
  \ 此列表部分内容重自 [https://www.ziprecruiter.com/blog/scrum-master-job-description-sample-template/)。此网站使用\
  \ GeoNames.org 的数据。该数据受 Creative Commons Attribution 3.0 许可证授权。\n\nScrum 的一个核心价值是赋予团队管理变更的能力。这取决于团队承认不确定性的能力，以及意识到他们当前对价值任务排序的观点仅在特定时刻是有效的，因为产品开发中具有固有的持续变化。产品所有者充当守门人的角色，识别并优先考虑不断变化的市场需求，并根据价值对这些项目进行排序，从而避免“一切都是最高优先级”的综合征以及随之而来的范围蔓延（scope\
  \ creep），后者是 Scrum 流程的终结。\n\n如果你限制了更改的数量，就会限制与更改相关的成本。由于未计划且可能不必要的发布前和发布后更改请求导致开发成本增加，许多存在软件开发业务的公司设立了变更控制委员会（Change\
  \ Control Boards）。如果管理得当，Scrum 将显著减少并可能消除此类更改请求。\n\n在书的后面部分，我们描述了如何通过 Scrum 决定安全性，以及我们完全集成的\
  \ SDL（安全开发生命周期）如何在过程中发挥作用。产品所有及其与客户的关系包括理解并倡导利益者的安全需求。我们已经成功地共同实现了这一点两次，而且它是可行的！\n\
  \n### 1.6.1 DevOps 和 CI/CD\n\nDevOps 更多的是一种工程文化的变革，而不是流程的变更，因为它将人置于流程之上，将流程置于工具之上。建立信任、协作和持续改进的文化可以加速\
  \ SDLC（SDLC）。正如你可能看到的，敏捷运动导致了从“命令与控制”向“团队赋权”的文化转变。DevOps 将这一转变推向前，并超越了编码，转向软件开发与运营的整体视图。\n\
  \nDevOps 还将编码移至运营，打破了“创造者”与“维护者”之间的差异和孤岛。技术上的变革与文化转变同步或并行发生了重大变化。最终，它促使开发和安全共同工作以造福所有人。这是通过消除瓶颈、增加工程师的赋权与协作、减少人际沟通问题并最终提高团队生产力来实现的。DevOps\
  \ 将技术置于人和流程之后，关注工程师以及他们如何更好地合作来生产出色的软件。DevOps 成功的关键要素是通过统一业务的每个部门来获得尊重和共同理解，并与合作伙伴和利益相关者建立健康的工作关系和协作。这消除了道路障碍并增加了合作，导致开发团队交付速度的提高。另一个积极结果是，业务将看到更少的客户投诉、新功能的更快交付以及现有服务可靠性的提高。\n\
  \nEmily Freeman 在她的著作《DevOps》一书中对持续集成、交付和部署提供了极佳且简练的概述：\n\n> **持续集成：** 实践持续集成（CI）的团队尽可能频繁将代码更改合并回主分支或开发分支。CI\
  \ 通常利用集成工具来验证构建，并对新代码运行自动化测试。CI 过程允许团队开发人员在代码库的同一区域工作，同时保持最小化更改并避免大规模的合并冲突。\n\n\
  > **持续交付：** 持续交付（CD）是 CI 的进阶，开发人员将代码的每次更改都视为可交付的。然而，与持续部署不同，发布必须由人工触发，且更改可能不会立即交付给最终用户。相反，部署是自动化的，开发者可以一键合并并部署他们的代码。通过进行小规模、频繁交付的迭代，团队确保了他们可以轻松排查更改。\n\
  \n> **持续部署：** 持续部署比持续交付更进了一步。每一个通过整个生产发布流水线的更改都会被部署。没错：代码被直接投入生产环境。持续部署消除了部署过程中的人工干预，并需要一套完全自动化的测试套件。\n\
  \n持续部署通常还采用 A/B，甚至是 A/B/C …… 测试，这样那些未证明有效或有多种实现方案的更改就可以被部署、监控，然后将结果反馈以转向最理想的实现方案。正如我们将看到的，安全性的实现可以从\
  \ A/B/C 测试策略中大大获益。\n\nDevOps 解决了敏捷开发中存在的一个空白，即开发人员的技术技能组合和专长与运营专家所代表的技能组合之间的冲突。消除开发人员将代码移给运营人员进行部署和支持的做法，有助于打破这些预存在的孤岛。\n\
  \n有些人甚至建议自动化应该取代运营专家。这种术语被称为 `NoOps`。虽然某些运营任务可以通过自动化完成，但运营专家仍然拥有典型开发人员不具备的技能——例如，软件基础设施，包括系统管理和软件托管的经验。运维专家将他们的专业知识应用于运行软件的代码上。在\
  \ DevOps 中，运营人员通过新流水线工具中的代码应用这些技能。运营人员很少需要手动进入系统。运营和核心基础设施知识对于工程团队的成功至关重要；因此，我们认为没有需要运营专家消失；参与规则、角色和职责只需要以与过去不同的方式进行修改和管理。需要注意的是，运营人员也是编码员：在\
  \ DevOps 中，许多角色（可能是大多数角色）都会产生各种代码。\n\n\n\n\n\nNoOps 专注于将与运维相关的所有工作自动化，包括部署流程、监控和应用管理。其目标是消除开发人员与运维专家交互的需求，这与\
  \ DevOps 直接背道而驰，因为 DevOps 促进开发人员与运维人员之间无缝的互动和工作关系。NoOps 专注于通过使用自动化解决方案来管理基础设施和部署流水线等特定问题，而\
  \ DevOps 则提供了一种侧重于人员、流程和技术的整体方法。运维专家最擅长自动化日常所需的任务，以及构建具有复杂基础设施组件的系统架构。\n\n缓解开发人员与运维专家之间鸿沟的另一种方法是双方都提供高级培训，以熟悉对方的学科。他们不会成为对方领域的专家，但这将有助于两个团队之间的互动。例如，运维可以教开发人员基础设施知识，反之，开发人员可以教运维团队版本控制，以及可能影响运维要素和相关架构特定语言的关键方面。\n\
  \n***\n\nFreeman, E. (2019). *DevOps for Durammies.* Hoboken (NJ): John Wiley &\
  \ Sons, pp. 141-143.\n\n软件部署是软件开发中导致服务中断和网站故障的最常见操作。在 DevOps 之前，开发人员通常在孤立环境中部署新代码以发布新功能。这是由于开发团队和运维团队之间的脱节导致的。在非\
  \ DevOps 环境中，开发人员通常会将代码传递给运维团队，而运维团队并不理解代码的基础设施需求，也不清楚代码如何在目标基础设施上运行。这里有一个假设：运维团队会部署代码并确保其完美运行。由于运维团队通过优化运行时间、可用性和可靠性来获得奖励，当代码写得很糟糕时，两个团队之间就会产生敌意，因为运维团队将为他们无法控制的事情承担指责。James\
  \ 和 Brook 无法数清孤立的开发人员或安全人员对基础设施做出运维永远无法满足的错误假设有多少次。读者或许可以想象，当双方都维护自己所构建的内容时，随之而来的混乱。因此，两个团队之间需要更好的沟通与协作，这也是\
  \ DevOps 的核心目标之一。\n\n### 1.6.2 云服务\n\n一些人认为，可以通过云服务促进 NoOps。云服务通过抽象复杂的运维架构，使该架构更容易让开发人员处理，从而使开发人员对其组件拥有更多所有权，但它无法完全取代所有的运维人员。然而，它确实减少了所需的运维人员规模，并释放了经验丰富的运维团队成员去处理更具主动性的解决方案。当他们达成一致并拥有共同目标时，两个团队将在作为开发和运维团队独立运行的同时进行良好协作。正如当今科技世界中的许多事物一样，最大且最困难的挑战与人类行为有关而非技术。DevOps\
  \ 试图解决这些问题。\n\n### 1.6.3 平台服务\n\n除了硬件之外，云供应商还提供了运维团队通常提供的平台即服务（PaaS）环境，例如开发、质量保证（QA）、用户验收测试、阶段环境（Staging）和生产环境。阶段环境提供了一个区域，开发人员可以在那里测试代码，而不会冒着生产环境测试产生意外影响的风险，也不需要在产品最终发布之前担心其运行的基础设施。这无疑加速了代码的开发、测试和发布。代码在\
  \ `PaaS` 上运行的基础设施资源重建了基础设施资源，如服务器、存储、数据库、中间件和网络，以及使开发团队能够作为运维职能的工具。`PaaS` 在模拟和运行环境中自动化、控制、标记和跟踪代码的能力，最终将显著地改变未来运维团队的结构和功能。运维专家及其架构伙伴仍然是需要的。问题在于，他们将是\
  \ `PaaS` 的一部分，还是开发团队所属公司组织内部的。至少，运维专家应该与运行 `SDLC` 的团队同地办公。在书的后面，我们将讨论云供应商如何负责低堆栈的安全维护。我们还描述了云供应商提供和处理的安全性与云消费者必须处理的安全性之间的责任界限。\n\
  \nDevOps 不是在代码发布后让运维参与，而是作为开发过程的一部分参与，这样开发人员和运维人员就可以妥地计划和设计基础设施来支持代码。这反映在当前的 DevOps\
  \ 文中，对运维、安全和质量保证等功能使用了“向左移”一词。这指的是可视化 DevOps 周期的标准图形，如[图 1.20]。\n\n### 1.6.4 自动化\n\
  \n团队要成功实现任何流程的自动化，必须首先理解尝试解决的问题的手动流程。如果手动流程失败，你只会自动化并可能放大这种失败。你必须衡量自动化是否是解决该问题的最成本效益且高效的方法。确保流程是连续的且开发过程不被放慢，这不仅仅是为了使用工具而使用工具。效率对于成功的软件开发至关重要，特别是在涉及\
  \ DevOps 和 CI/CD 时。\n\nDevOps 和 CI/CD 的一个与软件开发瀑布法有显著区别的关键元素，是在整个开发过程中持续使用自动化测试套件。持续测试在\
  \ CI/CD 中比在 DevOps 中更为人知。这将在本章稍后部分进行详细讨论。\n\n### 1.6.5 通用测试与质量保证\n\n\n\n\n\n由于 DevOps\
  \ 和持续集成在当前及未来工作环境中面临的复杂性和持续变化，自动化测试已成为强制性，手动测试将变得罕见。人类和预算无法吸收当前及未来工作环境中所需的复杂性和工作量。与运维团队一样，自动化和云服务将改变\
  \ QA（质量保证）团队的使用方式以及他们在组织中的定位。在传统组织中，QA 团队拥有测试环境，并在开发团队提交预发布代码在 QA 测试环境中进行测试后，进行代码审查。在当今的\
  \ DevOps 环境中，许多 QA 团队不再拥有测试环境，他们担心自动化将取代他们的功能。如果 QA 功能想要生存，它们就必须从手动测试转变为自动化测试和持续集成的专家。他们必须更像软件开发工程师一样，编写自动化测试，并作为测试实践、程序和方法的专家。这些测试包括性能测试、稳定性测试，以及负载测试和安全测试。负载测试将模拟大量用户或数据对系统施加压力，而安全测试则将在每次发布中消除漏洞，或至少将潜在影响降低到可接受的水平。\n\
  \n持续测试从开发阶段开始，并贯穿整个开发过程，缩短你的周期，并使开发团队能够快速迭代。刚开始开发 DevOps 能力的组织不应低估构建稳健测试计划、相关安全门禁和流水线所需的工作量。他们应该咨询那些以前在类似环境中获得成功经验的人，然后制定切实际的计划进行改进和适应。\n\
  \n在 DevOps 中，质量和安全测试是每个人的责任——最重要的是开发者的责任。编写良好的代码包含了内置的质量和安全性。\n\n\\_\\_\\_\\_\\\
  _\\_\\_\\_\\_\\_\\_\n\n[*]](#10-9781003002451_chapter-chap1.xhtml#r_fn1_26) 我们在稍后讨论\
  \ SDL 活动触发器和时机时，再探讨“左移”思维中隐含的线性线性问题。\n\n† 许多 DevOps 实现（并非所有）都利用了 `CI/CD`。尽管它们不一定相同，也绝对等同，但现代软件开发可以根据要构建的软件选择最有效的方法。\n\
  \n### 1.6.6 安全测试\n\n`*1.6.6 安全测试*`\n\n安全测试涵盖网络安全、系统安全以及客户端和服务器端应用安全。这些测试包括包括作为 `SDL`\
  \ 一部分在 QA 团队和开发团队中进行的测试。软件补丁（更新）用于修复发布后发现的安全问题。细小更改通常包含新功能，而重大更新可能不向后兼容，并包含可能破坏以前版本的代码。无论何种情况，在预发布开发过程中尽可能地发现并缓解这些问题都是至关重要的。如果一个软件产品发布后被发现未经过测试和/或充满安全漏洞，这可能对你们的声誉造成严重且可能是永久性的影响，并导致安全或隐私不合规的后果。如果产品或应用安全团队的成员没有参加“通过/否决（go/no\
  \ go）”产品发布会议，并且没有被赋予参与发布决策的权力，那么你的组织就未能重视安全，只是一个“纸老虎”。书的后部分将对 `SDLC` 和 `SDL` 内的安全测试进行更详细的概述。\n\
  \n### 1.6.7 DevSecOps\n\n`*1.6.7 DevSecOps*`\n\nDevSecOps 是关于 `SDLC` 中的每个人都对安全负责，其目标是通过将安全嵌入到开发过程的每个部分，将运维和开发功能与安全功能相结合。这最大限度地减少了漏洞并使安全更接近业务目标，它包括通过在\
  \ DevOps 工作流中早期嵌入安全控制和流程来实现核心安全任务的自动化。自动化还减少了安全架构师手动配置安全控制台的需求。\n\n随着 DevOps 和 `CI/CD`\
  \ 的出现，安全那种在过程末端补上安全并成为创新和按时交付障碍的传统声誉变得更加难以克服。开发者不喜欢他们的代码不安全，且在完成后才需要修复。在威胁变成安全事件之前进行评估和响应至关重要。这就是为什么有很多讨论关于“安全左移”，[*]](#10-9781003002451_chapter-chap1.xhtml#fn1_28)，这确保了安全是尽早构建在\
  \ DevOps 开发生命周期中，而不是在末端。DevOps 中的安全应该是过程的一部分——即 DevSecOps——而且可以说它不应该是一个一个独立的术语，以表示安全是真正内置的。\n\
  \n将安全集成到 DevOps 中以交付 DevSecOps 需要新的心态、流程和工具。要让安全真正成为每个人的责任，需要将其与你风险安全策略的治理挂钩，通过将这些策略构建到你的\
  \ DevOps 过程中。本书和通用 `SDL` 的目标之一是通过减少甚至消除安全任务与开发之间的摩擦，来协助 DevSecOps 的成功。最终，开发、安全和运维团队的结合结果将缩短反馈循环、减少事件并通过共同责任提高安全性。为了在开发生命周期的每一点发现并缓解安全威胁，应该让安全团队成员（或成员）在\
  \ DevOps 过程的每个阶段都有席位。\n\n### 1.6.8 教育\n\n`*1.6.8 教育*`\n\n持续教育是优秀软件团队流程的另一个关键组成。这对于\
  \ DevOps 尤为重要，因为关于软件、工具、硬件、网络以及其他技术趋势的跨学科知识是成功的关键。除了开发代码，你的开发者应该是知识资源，如果得到培养，可以为你的工程团队和他们所在的公司提供多年的宝贵建议和指导。培训包括外部阅读、与其他开发者讨论、参加会议和参加课程。\n\
  \n\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\n[*]](#10-9781003002451_chapter-chap1.xhtml#r_fn1_28)\
  \ 我们将在书的后部分对将“左移”作为一种概念范式的使用进行评论。\n\n然而，注意力的中断会让开发者闲置数小时。作为工程经理，挑战在于平衡：既不不地剥夺团队成员开发软件所需的时间（这需要高度专注的工作），又要确保他们在适当的时间继续教育。支持你的开发者并预留部分预算用于持续教育也很重要。关于教育和意识的更多内容将在书中后部分介绍。\n\
  \n#### 1.6.9 架构师和首席工程师\n\n\n\n\n在留住人才的同时，为开发者提供一条晋升路径是非常重要的。遗憾的是，在工程组织内部，开发者的晋升路径只有两条：管理人员或工程师。在很多情况下，这导致那些想要加薪或获得新职位的工程师别无选择地只能追求管理职位。虽然也有例外，但对于那些缺乏成功经理所需的人员、沟通、业务和其他技能的工程师来说，这通常是一场灾难。更糟糕的是，在许多情况下，他们发现自己处于一份他们他们并不想要的工作中，这最终会导致性能问题，并损害其下属团队的士气。\n\
  \n开发工程师的职业路径在达到开发团队提供的最高级别后，应该向组织中高级别的`架构师`（Architect）或`首席工程师`（Principal Engineer）发展。`架构师`和`首席工程师`影响系统的结构、功能的优先级排序以及代码的标准化。他们确保代码的可重用性，以及工程团队将如何处理眼前的工作。这些职位需要许多领域的知识，以及判断哪些方法有效、哪些不可行的经验。对开发团队来说，最重要的是他们能将关键且丰富的经验带到架构和代码审查中。此外，他们能够与运维专家及其他人互动，在代码集成到更大的代码库之前评估问题，并评估软件将部署的运行环境中可能发生的情况。所有人都能从这种知识共享中获益。我们将`架构师`和`首席工程师`这两个角色视为不同的职位。`架构师**必须具备某些抽象和结构方面，并且对他人互动具有较高的容忍度（有时可能涉及冲突）。但我们需要为那些倾向于坚持技术且对互动容忍度较低的人提供成长路径。重点关注工程的人必须有成长空间和晋升路径，否则他们将失去动力，或者更糟的是直接离开。技术安全领导者角色可以在职称中加入“安全”字样以明确：“首席安全架构师”和“首席安全工程师”。我们将在第\
  \ 2 章](#11-9781003002451_chapter-chap2.xhtml#chap2)中详细介绍这些安全领导者角色。\n\n### 1.6.10\
  \ 使用视觉类比进行整合\n\n#### 1.6.10.1 敏捷、Scrum 和 CI/CD 的俄罗斯块类比\n\n敏捷 SDLC 模型是迭代和增量过程模型的结合，通过快速交付可运行的软件产品专注于过程的适应性和客户满意度。敏捷方法将产品拆分为小的增量构建。这些构建版本以迭代的形式提供。每次迭代通常持续一到三周。每次迭代都涉及跨职能团队在各个领域同时工作，例如：\n\
  \n* 计划\n* 需求分析\n* 设计\n* 编码\n* 单元测试\n* 验收测试\n* 安全\n\n在迭代结束时，将向客户和重要的利益相关者展示一个可运行的产品。第一个类比是使用永恒的游戏俄罗斯块（Tetris）——作为使用敏捷、Scrum\
  \ 和 CI/CD 开发实践时发生的操作交互的视觉示例。首先是描述电子俄罗斯块棋盘及其玩法：\n\n> 游戏在一个有 20 行 10 列的棋盘上进行。俄罗斯块的目标是在屏幕被长方块填满之前尽可能持续（图\
  \ 1.18）。要做到这一点，你必须组合长方块形成一行或多行跨越整个游戏区域的块，这被称为消行。**当你这样做时，该行将消失，导致上方的块下落。**\n\n首先，在图\
  \ 1.15 中显示的每个长方块都被分配了一个跨职能团队名称，如图 1.16 所示：\n\n\n接下来，使用长方块来展示 Scrum 开发过程中 Sprint（Sprint）中发生的迭代（图\
  \ 1.17）。\n\n通过查看图 1.15 至 1.18 来整合，你应该看到以下内容：\n\n* 大部分决策是提前做出的，包括所有组件（类似于敏捷/Scrum\
  \ 的计划和设计会议）。需要注意的是，某些 Scrum 团队倾向于在 Sprint 中将设计作为工作项。并非“所有”或“大部分”设计都必须在一个 Sprint\
  \ 循环之前完成。这取决于情况，有时由团队决定。\n* 每个 Sprint 的每个组件/需求的实现以速度最快化，并在需要时快速更改，以优化完成每个/多行的必要拟合（类似于敏捷\
  \ SDLC/Scrum/Sprint 和 CI/CD）。\n\n\n* 每一行完成的行都会消失，重点在于剩余的行（类似于 Sprint）。\n* 注意安全（蓝色长方块）循环每个区域，提供了以敏捷速度构建安全的能力。\n\
  * 整个俄罗斯块类比于 CI/CD。\n\n#### 1.6.10.2 解决方案开发的俄罗斯套娃类比\n\n软件开发中的解决方案通常由相互作用的产品系统组成，以解决特定的客户问题。产品和产品平台是解决方案的构建块。这还需要硬件、软件和服务的组合。一组旨在协同工作并经过多次测试的产品让客户对实现业务结果充满信心。这将要求理解\
  \ SDLC 和 SDL 将应用于所有产品。这还需要具有软件、硬件、网络和基础设施领域跨学科经验的架构师和或首席工程师对这些环境中的所有情况进行正确评估。\n\n\
  \n在俄罗斯套娃类比中（图 1.19），将每个嵌套壳视为安全的应用程序或产品，它可以单独安全，也可以作为嵌套套娃形成解决方案，作为集成安全方法的一部分。每个应用程序或产品都需要一个完整的“或部分\
  \ SDLC”（敏捷/Scrum/Sprint），它们可以独立存在，也可以作为解决方案嵌套在一起。\n\n#### 1.6.10.3 DevOps 运维“向下移动”而非“向左移动”的类比\n\
  \n正如本章前面提到的，“向左移动”这一短语用于运维、安全和 QA（质量保证）等团队。这个想法简单是指这些团队的工作在开发流水线向左移动，或者在由自动化、云和特别是\
  \ PaaS 服务增强的过程中更早地执行。这意味着在图 1.20 左侧所示的典型 DevOps 八字图中的服务都将向左移动。虽然这些功能的并非所有组件都会向左移动，但很大一部分将由自动化云服务提供。本质上，八字图的重心将向左移动。\n\
  \n\n\n\n\n与其使用“8”字形图，我们更喜欢使用壶铃类比（图 1.20 和 图 1.21）。“壶铃具有厚实的手柄和偏移的重心，其设计是独特的，并带来了独特的优势，同时也带来了一些挑战。传统的哑铃和杠铃倾向于让重量与手部对齐，但壶铃的重心距离手柄约六到八英寸，这会根据你正在进行的训练项目而改变。”\\\
  * 从本质上，随着 DevOps 的出现，重心或“重体力活”将发生在开发侧。因此，我们更喜欢用壶铃类比，而不是“8”字形图。\n\n***\n\n\\* Jones,\
  \ B. (2020). “理解壶铃训练中的重心.” 获取自 [`www.strongfirst.com/understanding-the-center-of-mass-in-kettlebell-training/`](https://www.strongfirst.com/)\n\
  \n\n### 1.6.11 DevOps 最佳实践](#04-9781003002451_contents.xhtml#chap1_6_11)\n\n有很多来源列出了\
  \ DevOps 的最佳实践。我们发现最简练且与我们的讨论最相关的是 LiquidPlanner 的 Cesar Abeid 在其题为《管理 DevOps 项目的\
  \ 8 最佳实践》的在线论文中识别出的实践，其中七项如下：\n\n> **最小可行性产品（MVP）：** 最小可行性产品关注高回报和低风险的项目，并且可以通过每次迭代进行衡量和改进。实施这一点是创建快速、小规模产品的方法，这些产品可以快速部署并进行反馈衡量。\n\
  \n> **使用正确的工具：** 因为 DevOps 关乎协作、沟通、消除孤岛和不必要的开销，因此使用能够促进这些原则的工具至关重要。DevOps 的成功通常与使用的工具紧密相关。在考虑\
  \ DevOps 项目的工具时，请寻找能够简化配置管理、应用部署、监控和版本控制各个方面的解决方案。\n\n> **消除孤岛化：** DevOps 涉及工作流和集成，这意味着开发和运维以快速且水平的方式进行。相比之下，孤岛化是垂直的且被围墙隔开的。\n\
  \n> **减少交接：** 相比之下，DevOps 项目将项目视为从开始到结束的持续流。通过最大限度地减少交接，离散的步骤往往会消失，从而促进 DevOps 文化的形成。\n\
  \n> **创建实时项目可视化：** 为了实现工作流和集成最大化， DevOps 系统中的每个人都需要知道项目的进度。通过使用正确的工具并鼓励所有参与者以集化的方式参与，可以实现实时项目可见性。\n\
  \n> **减少开销：** 从开销中节省的工作和资源可以重新定向，以提高生产力和协作。\n\n> **协作管理变更：** 有效的变更管理对任何项目来说都可能是一个挑战。拥有一种系统的方法处理变更至关重要。*](#10-9781003002451_chapter-chap1.xhtml#fn1_30)\n\
  \n### 1.6.12 优化团队规模](#04-9781003002451_contents.xhtml#chap1_6_12)\n\n1975 年，Fred\
  \ Brooks 出了一本名为《人月神谭》（`The Mythical Man-Month`）的书，他在书中创造了“向延期项目增加人力会导致项目更晚”的说法，也\
  \ known“布鲁克斯法则”（`Brooks Law`）。†](#10-9781003002451_chapter-chap1.xhtml#fn1_31) 在软件开发领域，延期是不可接受且昂贵的。速度和可预测的交付时间对于保持竞争力至关重要。这需要正确的流程来优化交付的时间和质量（在本章前面已讨论过），以及优化的团队规模。在优化团队时，需要考虑的一些关键概念是：\n\
  \n> 三到七个人组成的小组在完成相同工作时，所需的精力仅是九到二十人小组的约 25%。这一结果在成百上千个项目中反复出现。极大型小组做的事情更少是人人性中一条铁律玉律。‡](#10-9781003002451_chapter-chap1.xhtml#fn1_32)\n\
  \n> 2001 年，密苏里大学的 Nelson Cowan 怀疑那个“七”的魔法法则是否真实，并对该主题的所有新研究进行了广泛调查。结果表明，人在短期记忆中可以保留的项目数量不是七个，而是四个。§](#10-9781003002451_chapter-chap1.xhtml#fn1_33)\n\
  \n> 所以，我们大脑任何时候能持有的内容有一个硬性限制。这让我们回到了布鲁克斯。当他试图弄清楚为什么向项目增加人员会导致时间变长时，他发现了两个原因。第一个是让人员进入状态所需的时间。正如你预期的，让新成员进入状态会减慢其他人的速度。第二个原因不仅与我们思考的方式有关，还从字面上说与我们大脑的承受能力有关。随着人数的增加，沟通通道呈指数增长，我们大脑无法跟上。如果你想计算团队规模的影响，将团队人数减\
  \ 1 再除以二。`Communication channels = (n - 1)/2`。例如，如果你有 5 个人，就有 10 个通道。6 个人，15 个。7\
  \ 个人，21 个。9 个人，36 个。10 个人，45 个。我们大脑无法处理这么多信息。当我们试图理解时就变慢了。¶](#10-9781003002451_chapter-chap1.xhtml#fn1_34)\n\
  \n从上述可以看出，优化规模非常重要，特别是对于软件开发的复杂动态特性。自 Agile、Scrum、DevOps 出现以来，团队规模变得更加重要。通常理想的人数加减二，取决于项目的额外技能。团队必须具备完成项目所需的技能，以及在采取行动和做出决策时的自由。\n\
  \n\n\n\n\n我们回顾了当前持续攻击的背景，以及我们的数字生活所遭遇的反复重大入侵。软件漏洞是攻击者利用的手段，这对于大多数读者来说是显而易见的。我们最重要的保护措施之一将是将漏洞降低到可生存的水平——这也是\
  \ `SDL` 的主要目标。我们提出了五项软件安全原则，作为衡量 `SDL` 成功的标准，并利用这些原则来对齐和指导软件安全实践。\n\n我们概述了通用 `SDL`\
  \ 的主要目标，以及为什么那些与软件开发生命周期 (`SDLC`) 密耦合且假设 `SDLC` 是线性的 `SDL` 持续存在问题；线性瀑布式 `SDLC` 已成为少数情况。敏捷、持续实践以及\
  \ DevOps 加剧了线性 `SDL` 的问题。我们在英特尔的 `SDL` 研究中发现，未来的道路是消除 `SDL` 对 `SDLC` 的依赖，使其适用于所有的\
  \ `SDLC` 时间节点和顺序。我们希望你也会认同，在我们审查敏捷/Scrum 实践之后，这一点尤为真实。\n\n作者以及其他从业者，现在已经实施、领导、游说并为一种以开发者为中心的软件安全观点做出努力——我们可以称之为“SDLC\
  \ 安全方法”。我们向你展示了《开发者为中心的安全宣言》作为一个起点。赋予开发者拥有安全任务的所有权，同时利用熟练的安全从业人员来引导和支持这种所有权，将是最有效且可扩展的方法。我们在自己的项目中已经尝到了这种方法带来的甜果；我们看到了这种方法交付的发布问题的减少。基于\
  \ `SDLC` 的软件安全方法的核心原则是：通过 `SDL` 让开发者能够识别并将构建安全视为构建软件的自然、首要任务。为了实现整体安全，`SDL` 还必须减少在执行\
  \ `SDL` 任务时的摩擦。\n\n但 `SDL` 并非成功的唯一要素。正如我们一直指出的，软件安全最终是一个人的问题。构建和运行一个成功的计划需要投入、时间、能量以及熟练的管理和组织技能。因此，软件安全管理构成了本书的关键元素。\n\
  \n# 第 2 章\n\n# 敏捷世界下的软件开发安全管理\n\n## 2.1 引言\n\n人们普遍有一种观点，认为引入安全会减慢或偏离开发进程，在某些情况下，这种担心是应得的。有效的\
  \ DevOps 安全要求跨部门协作和认可，以确保安全考量整合到整个产品开发生命周期（产品设计、开发、交付、运营、支持等）。如果你正确地将安全与 DevOps\
  \ 对齐，你就实现了高效的产品发布，同时避免了代码/产品发布后昂贵的召回或修复。为了实现这一目标，每个人都需要在自己的职责范围内承担遵循安全最佳实践的所有权。\n\
  \n本章重点关注敏捷世界中软件开发安全管理的务实方法，这些方法将增强适用于中小型公司的产品安全计划的可扩展性、效率和成本效益。本章的主要重点是管理 DevOps\
  \ 环境下的安全；它将从管理的角度涉及敏捷、Scrum 以及持续集成和持续交付 (`Cl/CD`)，这些都是 DevOps 哲学和模型涵盖的组件。这是当前和成熟\
  \ DevOps 组织如何管理安全的概述。在书的后续部分，我们将结合我们提出的新模型讨论本章涵盖的相同领域。\n\n最重要的是，根据我们和同仁的经验，我们在 DevOps、软件开发和安全方面面临的最大挑战是人的问题，而非技术问题。自动化工具、库和封闭服务可以使事情变得更快更高效，但工程团队中人类的社会动态和组织管理是一个需要解决的重大问题。DevOps\
  \ 的主要目标之一是最小化人与人之间的摩擦，以便每个人都能专注于工作。\n\n_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\nBeyond\
  \ Trust (2020). “DevOps Security Best Practices.” Retrieved from `https://www.beyondtrust.com/blog/entry/devops-security-best-practices`\n\
  \n## 2.2 构建和管理 DevOps 软件安全组织\n\n### 2.2.1 DevSecOps 术语的使用\n\n敏捷是一种心态，其价值观促进组织及其部门功能、项目管理实践和产品开发的文化转变。DevOps\
  \ 环境下的敏捷和安全具有相似的目标：消除孤岛、促进协作与团队合作，并提供更好、更快交付。DevOps 环境中的安全包含了相互依赖的实践，例如 `Cl/CD`，它促进了频繁的代码提交、版本控制、测试自动化以及持续的低风险发布和反馈，通常有自动化工具的帮助。提高运营效率；减少不必要的修订、产品交付和周期；以及由于监控和自动化带来的质量改进，带来了包括成本节省和生产力提高在内的业务收益。\n\
  \n\n\n\n“DevSecOps”一术语用于指代集成到传统 DevOps 组织中的安全团队。在讨论 DevSecOps 时，许多作者假设安全尚未构建到 SDLC（软件开发生命周期）过程之中；安全审查和测试发生在开发周期的末尾，在代码已经编写、编译并准备好上线时才被强加进去；并且假设没有使用静态应用程序安全测试（`SAST`）和动态应用程序安全测试（`DAST`）或其他自动化安全管理工具。\n\
  \nDevSecOps 是一种连接安全团队和运维团队的管理方法，类似于 DevOps 统一软件开发人员和运维专业人员的方式。DevSecOps 的目标是确保安全团队和运维团队共享责任、流程、工具和信息，以确保组织不会为了更高的可用性和更强的性能而牺牲安全性。\n\
  \n可以说的是，根据我们的经验，许多成熟的软件开发组织已经这样做多年了。尽管有些组织没有像书籍《核心安全：源头安全》（*Core Security: Security\
  \ at the Source*^† 中描述的那样构建安全性，但 DevOps 中的真正挑战在于：所需的交付速度，以及传统上相互分离的团队的开发者、生产人员和安全专业人员之间的协作，这些人员习惯于独立工作，拥有他们自己的工具和信息源。当然，这正是本书的主题——即增强组织以敏捷和\
  \ DevOps 速度构建安全性的能力。\n\nDevOps 的另一个优势是，它有助于最终促进“每个人都安全负责”的概念。这是安全领导者多年来一直倡导的，但现实中，组织并没有认同。建立一个正确的整体性安全组织，而不是一个可能成为另一个违背\
  \ DevOps 方法论的“孤岛”的独立 DevSecOps 团队，对于 DevOps 方法论至关重要。建立正确的安全组织还具有额外的业务优势，如团队间更好的协作、缩短上市时间、提高整体生产力并获得更大的客户满意度。\n\
  \n### 2.2.2 产品安全组织结构\n\n### 2.2.2.1 正确的组织位置\n\n尽管过去几年软件安全技术、流程和方法论取得了巨大进展，但我们认为，人仍然是成功的软件安全计划中最重要的要素，这包含了活动和最佳实践的实施与管理。为了充分利用负责软件安全的人员，他们必须是正确组织的一部分（参见图\
  \ 2.1）。\n\n本书合作者之一 James Ransome 担任过七个首席安全官（`CSO`）和首席信息安全官（`CISO`），在他担任 `CSO` 和\
  \ `CISO` 的多个职位中，软件安全向他汇报，并在过去的 23 年中担任过两个专门负责产品安全的高管职位。根据他的经验以及与行业同行的交流，显然，软件安全职能理想上应该属于工程（软件开发）职能，特别是质量职能。\n\
  \n目前的共识是，应用安全角色应该属于工程（软件开发）职能，特别是质量职能。\n\n\n\n\n合适的安全团队成员对于使任何 SDL 模型或 DevOps 组织的成功至关重要——特别是书中描述的这一个。他们应该至少包含一名首席软件安全架构师、由资深和通用软件安全架构师组成的团队，理想情况下，工程软件产品开发组中每个产品业务部门各一名软件安全架构师。这种关系在图\
  \ 2.2 中所示。这一人才池提供了扩展能力，因为每个工程软件产品开发组中，每个 1 级软件产品都将有一位软件安全冠军（SSC）。人才的另一个元素是软件安全布道者（SSEs），适用于规模大到为\
  \ SSC 职位有额外候选人的组织，这些人可以在有 SSC 空额出现之前担任 SSE 候选人。SSE 承担两个角色：作为受训中的 SSC 以及作为整个软件产品安全计划的布道者，负责发布和执行政策，并推广整体\
  \ SDL 流程。\n\n__________\n\n^(\\*)McGraw, G. (2006). *Software Security: Building\
  \ Security In.* Boston (MA): Addison Wesley/Pearson Education, p. 20.\n\n\n## 2.2.2.3\
  \ 正确的人才\n\n尽管软件产品和应用安全具有通用的安全实践，例如渗透测试、源代码扫描、安全导向测试和安全教育，但将安全集成到软件开发生命周期中是不可替代的。过程中的人为因素是任何安全开发过程成功的关键，需要非常丰富的软件安全架构师和工程师才能成功。威胁建模、应用诸如`最小权限`和`深度防御`等原则，可能是软件开发生命周期中最不被理解、最重要且最必要的元素，需要人类专业知识而非工具来完成。还必须收集系统的真实安全需求，并考虑合规性、安全问题、合同要求、应用程序将处理的数据以及业务风险。培训是\
  \ SDL 的另一个需要人为因素的关键元素。培训有助于降低安全成本，有效的培训计划将激励您的开发团队以更高的效率和成本效益产出更安全、问题更少的软件。必须强调的是，没有任何点解决方案能为软件安全提供单一解决方案；相反，需要一种整体的深度防御方法，包括人员、流程和技术的结合，并强调人员。虽然工具可以快速解析大量代码，速度比人类快，但它们无法替代人类。在可预见的未来，软件安全仍被视为一种艺术，但这种艺术可以通过流程和技术进行增强，而且与某些从业者传播的误言相反，这种艺术可以通过资深软件安全架构师和工程师的适当指导来传授。这些是拥有经验并在整个开发过程中能够像对手一样思考的团队成员，这是任何\
  \ SDL 成功的关键因素。一些作者将安全编码最佳实践与安全设计原则区分来；我们将在书中介绍的软件安全最佳实践中涵盖两者，并利用上述资深架构师和工程师的经验来实现。使您的组织安全的两个关键职位是安全架构师和安全冠军。\n\
  \n### 2.2.2.3 软件架构师\n\n合格的资深安全架构师将决定您的安全计划的成败。在人员方面，一个有效安全计划最关键的元素是一支软件安全架构师队伍。这些人人在进入安全领域之前拥有\
  \ 5 到 10 年的开发/编码经验，并且对系统架构的理解达到对安全的理解程度。此外，他们还必须具备出色的政治和人际技巧。这些人将接触 SDLC 的每一个元素，并对于处理产品安全升级、培训开发团队以及解决复杂的软件/应用问题至关重要。\n\
  \n区分架构驱动与其他需求并不简单，因为需要对解决方案的目标有完全理解。软件安全架构是一个交互过程，涉及对业务价值的评估以及识别对系统成功最关键的需求。这些包括解决方案的功能需求、约束条件和行为属性，所有内容都必须进行分类和规范。这些关键需求被称为`架构驱动`。“^(\\\
  *)\n\n安全架构师必须在架构层面思考如何将必要的安全技术集成到整个系统中。在云或 SaaS 环境中这包含了网络安全需求，如防火墙、虚拟专用网络等。架构师在系统的每个部分显式地记录信任假设，通常通过绘制信任边界（例如，来自防火墙外的网络流量是不可信的，但本地流量是信任的）。当然，这些边界必须反映在业务需求中。例如，高安全性应用程序不应该愿意信任任何未加密的共享网络介质。安全需求应该来自用户。资深软件安全架构师的典型工作描述如下：\n\
  \n> 软件安全架构师负责为 X 公司全公司的产品安全提供架构和技术指导。他们将设计、计划和实施安全编码实践和安全测试方法论；确保这些实践符合软件认证流程；推动产品的安全测试；测试和评估安全相关工具；并管理第三方供应商以履行这些职责。\n\
  \n安全架构师的具体角色和职责应包括以下内容：\n\n-   驱动整体软件安全架构。\n-   在 X 公司软件安全工作的全面规划、开发和执行方面提供技术领导力。\n\
  -   与产品和工程开发团队紧密合作，确保产品满足或超过客户的安全和认证要求。这包括确保安全架构得到良好的记录和沟通。\n-   在软件工程和产品开发过程中提供相关的安全规划和输入，同时对业务的限制和需求敏感。\n\
  -   监控安全技术趋势和需求（如新兴标准），以寻找新的技术机会。\n\n\n\n\n\n- 制定并执行安全计划。可能包括管理与第三方供应商的联合开发，并（与其他部门一起）为工程和测试实践提供指导。\n\
  - 确保并根据需要创建安全策略、流程、实践和操作，以确保开发的可复现性和高质量，同时将成本控制在范围内。\n- 参与软件的实操性深度分析、审查和设计，包括从安全角度对源代码进行技术审查和分析。这包括对内部开发代码的审查，以及对第三方供应商提供的技术的审查。\n\
  - 在安全认证过程中担任主要的技术角色，包括准备详尽文档并与第三方评估机构合作。\n- 为员工、承包商、开发和质量保证团队，以及与产品安全相关的产品/软件安全冠军提供培训。\n\
  - 引导 X 公司软件开发团队通过公司 X 安全开发生命周期 (`SDL`) 执行其 `SDLC`，通过参与设计评审、威胁建模以及对代码和系统的深度安全渗透测试。这些职责还扩展到对应用设计、安全编码实践、日志取证、日志设计以及应用程序代码安全提供建议。\n\
  \n---\n\n请参阅我们在第 1 章（`第 1.4 节`）中的软件安全设计原则，该章节介绍了“安全”软件必须具备的属性和行为，以及衡量 `SDL` 有效性的标准。\n\
  \n软件安全架构师团队在监督和培训软件安全冠军工作方面至关重要，这些冠军应通过跨业务部门/软件安全的教育和意识计划来确定。架构师们还将识别并评估软件安全冠军的候选人，因为他们参与了从概念提交到发布后各种软件产品的\
  \ `SDLs`。\n\n#### 2.2.2.3.2 软件安全冠军\n\n企业安全部门（无论是 IT、物理还是软件安全）的资金在可预见的未来可能不会再增加了，这意味着如果你计划成功，就必须非常审慎地使用资源。正如我们之前暗示的，资丰富的软件安全架构师寥寥无几，在理想情况下，你在当今的市场中可能无法找到并负担得起超过几个。当你看到书中所使用的或`第\
  \ 1 章`中之前提到的 `SDL` 模型时，你可能会问自己，考虑到安全软件以及与其合作的开发团队所拥有的资源，你如何能扩展到这项任务？答案是，如果你管理软件安全团队或有该职能为你工作，你将通过招聘和利用软件安全冠军\
  \ (`SSCs`) 来管理这项艰巨的任务。该角色的候选人通常应至少具有三五年的软件开发经验；对软件安全充满热情或拥有背景；有时间接受软件安全以及中心化软件安全团队工具、计划和流程的培训；最重要的是，不仅要知道如何开发（构建）软件，还要在“像黑客一样思考”时，对对手可能用来利用软件的所有可能路径或漏洞（攻击面）进行解构（拆解）。每个产品开发组织都应该至少有一位具备技术能力、并可被培训为软件安全架构师的人员，以协助中心化软件安全团队进行架构安全建模。`SSC`\
  \ 的典型职位描述如下：\n\n- `SSCs` 必须具有至少三五年的软件开发经验；对软件安全充满热情或拥有背景；有时间接受软件安全以及中心化和业务部门特定软件安全工具、计划和流程的培训；最重要的是，不仅要知道如何开发（构建）软件，还要在“像黑客一样思考”时，对对手可能用来利用软件的所有可能路径或漏洞（攻击面）进行解构（拆解）。\n\
  \n- 每个产品开发组织都应有一位具备技术能力、并可被培训为软件安全架构师的人员，以协助中心化软件安全小组进行架构安全建模。理想情况下，如果认为必要，每个团队还应该有一个额外的软件安全冠军，其角色是在变革代理（一个更偏向项目/计划的人员）协助技术导向的软件安全冠军提供支持。\n\
  \n- 具体角色和职责包括：\n    - 强制 `SDL`：协助中心化软件安全小组确保在作为 X 公司 `SDLC` 部分的 `SDL` 中遵循机密性、完整性、可用性和隐私的安全原则。\n\
  \    - 审查：协助中心化软件安全团队软件架构师进行架构安全分析、审查和威胁建模。\n    - 工具专家：在每个开发团队、产品组和/或业务部门中担任中心化软件安全团队软件安全工具专家（例如静态和动态，包括模糊测试）。\n\
  \    - 驻点：在每个开发团队、产品组和业务部门中担任中心化软件安全团队的眼睛、耳朵和支持者。\n    - 参加会议：作为全球 X 公司软件安全冠军团队的成员，参加每月电话会议并在预算允许的情况下每年两次面对面会议。\n\
  \n\n\n\n正如 Brook 的博客中所提到的，强制开发团队成员向中央安全团队报告安全问题和担忧，与授权开发团队的一名或多个成员成为团队的安全架构师之间存在着巨大差异。当做法是任命某人时，被指定的人很可能不会履行这项工作。重要的是，安全角色很可能导致该人与其团队的其他成员发生冲突。此外，如果没有赋予被任命的安全“哨兵”权力、影响力或技能，他们就没有什么动力去执行这一角色。我们甚至可以认为，一个工作是监视他人的人可能会被那些人视为间谍。这个角色对我们来说听起来并不吸引人，而且很多时候，对被任命的“间谍”来说也是如此。\n\
  \n在光谱的另一端，我们目前为止已经做了四次的事情实际上是为开发团队成员提供必要的培训和支持，使其成为各个领域的安全专家，其中一种希望是成为他们所在团队安全架构师的路径。我们尽一切努力赋予交付安全功能的开发者，让他们本质上充当安全架构师。我们赋予他们执行标准和策略的权力。我们赋予他们对决策进行风险升级的权力。但由于升级可能会导致团队成员与自己的管理层发生冲突，我们毫不犹豫地接手棘手的升级问题，并为我们的卫星安全架构师处理。通过这种方式，履行这一角色的人既得到了授权又得到了保护；我们绝不希望让我们的安全架构师与自己的管理层发生冲突。对于承担这一角色的人来说，“奖励”是他们可以理称自己履行了安全架构师的角色。因为对于许多组织来说，安全是一项高端技能，这些人在近期或中期通常会有薪资增长。履行我们这里概述的卫星安全架构师角色的人实际上执行了这项工作。他们中很大一部分继续成为安全架构师负责人。当然，并不是每个参加了计划并从事安全架构工作的人都选择继续从事安全相关职业。这没关系。如果他们一无所获，他们也将把安全知识带到未来职业生涯中可能担任的任何角色中。通常情况下，无论他们担任什么角色，都是一种胜利。\n\
  \n[^ 1]: Schoenfield, B. (2019). *Secrets of a Cyber Security Architect.* Boca Raton\
  \ (FL): Auerbach Publications/Taylor & Francis Group, pp. 148-149.\n\n### 2.2.3\
  \ 软件安全项目管理\n\n在许多情况下，开发团队仍在向 DevOps 转型过程中，这需要一种整体策略，涉及文化、角色和职责、团队结构、工具和流程的重大变革。项目经理（PMs）是这些努力中\
  \ DevOps 过程中主要的变革推动者和驱动者。他们主要通过提供有效的项目管理，让所有方（从管理层到开发和运维团队）相互协作并提高客户满意度，从而推动更大的敏捷性。转向和管理\
  \ DevOps 以及敏捷环境不仅仅是简单采用新的工具和流程。它还包括构建稳定的持续集成基础设施以及一个将交付物从开发移动到生产环境的自动化流水线。\n\n在转向持续交付方法时，应该重新定义角色和职责。在这种情况下，与产品经理（负责组织的路线图和愿景，负责发布目标，并有权对积压工作列表做出决策）相反，`PM`\
  \ 负责发布计划并负责发布跟踪，并拥有推向生产环境的权限。对于 `PM` 来说，软件开发生命周期在产品发布后并没有结束；它还涉及获取客户反馈并确定产品在现场是如何使用的。这会一直持续到下一个生命周期及更远。\n\
  \n安全 `PM` 或负责人应该支持 `PM` 办公室，并镜像或支持他们在 DevOps 环境中所有安全领域的职责。正如本章前面提到的，开发团队和运维团队之间传统上存在孤岛，与开发的联系是生产环境。DevOps\
  \ 方法论让运维有了更好的机会来理解产品，向开发者提供有价值的反馈，让运维和产品团队能够共同实现目标。`PM` 是实现这一点的关键催化剂。\n\n部门之间的反馈循环是\
  \ DevOps 的关键。每个部门或角色无论如何划分，都必须听取并理解其他部门的需求，以及其他角色输出的经验（好的、坏的和糟糕的）。实现“持续”的唯一方法是每个角色与其他人紧密协作并向他们学习：反馈成为持续持续运转的核心枢纽。`PM`\
  \ 可以提供互动所需的论坛，并确保反馈能够及时提供并得到考虑。\n\n开发者喜欢快速移动开发新内容，而产品经理喜欢看到新内容。`PM` 教育并提醒开发者和产品经理创建更好的发布安全性和质量至关重要。`PM`\
  \ 必须优先考虑敏捷回归测试，并将其作为冲刺开发的一部分。在敏捷开发过程的后期测试新内容或修复新的缺陷或回归问题是不可接受的。\n\n[PM` 应确保除非功能符合“完成定义”（definition\
  \ of done）中定义的良好安全性和质量，否则不将其推向生产环境。许多初创公司和大型公司几乎每天将他们的软件产品推向生产环境，相比之下，某些企业仍根据功能的状态以每两周或每月的节奏来处理发布。只有达到“完成定义”的功能才能被推向生产环境。\n\
  \n技术债，特别是安全债，在大公司以及已经存在十年或更久的小公司中仍然是一个关键问题。`PMs` 应该负责确保他们负责的软件在内容开发期间没有任何技术债。确保他们的冲刺在结束时都完成了正确的回归测试、安全测试和性能测试等，这非常重要。这应该包括在冲刺结束前留出时间停止内容开发，以便进行探索性手动测试、回归修复以及完成缺失的自动化测试。（我们将在第\
  \ 3 章详细讨论互锁和重叠测试策略的需求以及这些策略是什么）\n\n## 2.2.4 软件安全组织现状与杠杆\n\n`PM` 和 `产品负责人`将是 DevOps\
  \ 环境中管理合作伙伴参与和关系管理的关键团队成员，并应与软件安全团队或其代表紧密结合。\n\n\n\n\n尽管基于工作量逐步增加的增量人员招聘计划通常是大多数组织的常态，但增量式增长并不是本书中所提议模型的正确模式，对于那些处于组织内部紧缩现实中的人来说，这显然不是现实。以少办多是我们所有人面临的现实，无论我们正面临着何种风险。为了帮助解决这一困局，我们提出了一种软件安全小组的模型，该模型不依赖于持续的增长（线性或其他形式）。虚拟团队的增长对应于线性增长，使得一个人员配置齐全、中心化的软件安全小组能够保持相对稳定。我们认为，在软件工程开发组织中，由每个主要软件产品组配备一名资深软件安全架构师，以及该组内每个软件产品配备一名架构师组成的中心化小组，只要遵循本书书中建议的软件安全冠军计划，就足以很好地进行扩展。此外，通过让开发组织中每个软件产品的关键软件安全冠军共同分担典型产品安全事件响应团队（`PSIRT`）的责任，考虑到该任务在整个组织中共享的责任，一个\
  \ `PSIRT` 经理就足够了。\n\n正如书中前面提到的，卓越不在于数字的增加，而在于你所聘用的人员质量。这些资深软件安全架构师中的每一个都可以协调并支持在每个业务单元和软件产品线实施\
  \ `SDL`，并将：\n\n• 提供与中心化软件安全小组流程和治理相关的 `SSC`。\n• 在安全架构和评审方面为 `SSCs` 提供指导。\n• 支持相关的业务单元\
  \ `SSC` 对每个软件产品线 `SSC` 进行指导。\n• 与产品管理部门协调，以获取早期且及时的安全需求。\n• 帮助计算项目安全风险。\n• 帮助确保\
  \ `SSCs` 实施了适当且全面的安全测试。\n• 确保在 `SDL` 中根据需要提供适当的安全测试工具（静态、动态、模糊测试）。\n\n尽管这些任务很大程度上受益于丰富的经验和判断力，但通过让这些资深技术领导者指导\
  \ `SSCs` 和软件安全架构师，具有巨大的成本节约机会，这既是参与个人一个极佳的成长机会，也能为公司和组织节省成本。那些通过经验和指导潜力成长为领导者的人员，是我们模型中\
  \ `SSCs` 的完美人选。我们是曾所做的一切的总和，而这些经历在不断被修订和被记忆。软件安全架构师也是如此；这是一场旅程，而非一个时间点，它需要不断学习、指导以及与有经验的人士合作。\n\
  \n在我们的模型中，有多种途径可以实现适当的“覆盖”。与完全中心化的职能不同，处理得当的虚拟团队可以由规模小得多的中心团队整合并领导。作者们已经在许多不同的组织中证明了这一模型的有效性，有时甚至运行了多次，他们认为这是一个经过实践证明的模式记录，该模型将随着我们在软件安全中面临的不断变化的现实而不断演进。中心化软件安全小组的每个成员都必须能够激励、鼓励并领导虚拟团队，使得虚拟成员贡献关键的主领域专家（`SME`）任务，同时又不会被额外的或操作性的任务所压垮。这种“恰好足够”使得\
  \ `PSIRT` 功能能够通过真实的 `SMEs` 贡献和赋能获得巨大收益，同时确保没有任何人独自承担某 set 无法规避的运营活动的全部压力。由于我们的中心化软件安全小组模型使用了扩展的虚拟团队，因此不需要像其他组织那样配备大量的中心化\
  \ `PSIRT` 人员。可以以去中心化的方式管理的任务将完成，例如技术调查、发布计划和修复开发。然而，需要一个足够复杂的协调角色，能够从技术上理解各种响应所涉及的影响和风险。同行评审是避免失误的有力工具。此外，工程软件开发小组内部的中心角色提供了跨团队的协调，这是大多数组织所短缺的。我们不能对影响许多软件产品的漏洞以独特且特异的方式逐个单独做出响应。此外，在\
  \ `PR`（有时也包括营销）支持与参与响应的技术团队之间提供一个接口是至关重要的。你希望你对漏洞报告者的响应是一致的，并避免从外部给你的公司和你的品牌带来风险。\n\
  \n### 2.2.5 软件安全组织与人员管理技巧\n\n• 技术“巨星”很棒，但前提是他们也必须团队合作者和导师。如果不是，他们将成为“拖船锚”，是资源的浪费，并成为实现团队目标的干扰，而且会破坏你团队的士气。伟大的团队总有一个大于个人的目标。如果你只是在短期内需要某种目前团队中不存在的关键技术技能，那么聘用一名临时人员或承包商来满足这一需求，直到他们完成所需的工作，可能更好。团队表现不是基于个人表现。\n\
  \n• 我们一直倡导多元化团队的价值，但你应该始终确保他们是你团队中最称职的人才，或者具有通过指导成长为团队同等贡献者的潜力。在当今世界，不考虑准确的技能组合或学习潜力的配额制度始终会对你的团队产生不利。有许多多样化且合格的候选人可以招募为你团队的开发者或产品安全专家。告诉你相反情况的招聘人员可能是懒惰或无能的。\n\
  \n• 团队就像家庭，一旦有人成为家庭的一员，任何人际或兼容性问题都可能被放大。这些问题对你团队的动态可能是有害的。在招募团队成员时要小心，对于 `Scrum`\
  \ 团队，确保所有人都参与面试过程。他们的技术技能是真实的吗？他们是否承诺在团队呆几年，还是仅仅在那里那里混日子等同一家公司的其他职位？永远不要将就就事。\n\n\
  • 经验、技术能力和相关的大学学位是理想的，但技术能力和经验总是优于学位。在大多数情况下，大学教育是编写和沟通潜能力的良好指标，但作为开发者或安全从业人员的实际经验和证明过的成功优于仅仅有学位。\n\
  \n• 安全认证和经验是理想的，但与大学学位一样，作为安全从业人员的实际经验和证明过的成功优于仅仅有证书。在大多数情况下，证书是潜能力的良好信号，但不能替代实际经验。\n\
  \n• 始终质疑为什么这个人现在可用（空闲状态）。你不想要别人的“问题孩子”。检查他们是否处于某项计划中，并询问为什么他们目前的经理对他们的转岗或招聘（如果是外部招聘）没有异议。某些经理可能确实在考虑员工的职业增长，但我们的经验是，例外而非常态。你欠你的团队人情，因为他们很快就会成为你紧密家庭的一部分。\n\
  \n\n\n\n-   独行侠和不具备团队合作精神的人不需要申请。这是一项团队努力；如果他们想做个人贡献者，这些角色通常存在于组织的其他地方。要小心那些试图将表现不佳的员工推向你团队的经理，因为这些员工在目前的职位上表现不佳。这些员工可能会对你的团队动态产生真正的损害。\n\
  -   可以理解，在极客世界中，招聘时会将重点放在技术实力上，但协作能力和人际/沟通能力可以说同样重要。\n-   如果可能，在团队开发的早期防止小圈子的形成。在当今世界，成功的开发团队通常规模较小，从团队动态的角度来看，他们无法承受在内部出现\
  \ 2 到 3 个小圈子。\n-   责任终在你身上，你必须为你的团队提供“掩护”。这意味着在可能的情况下，过滤掉任何高层对团队的不必要干扰，包括与你团队任何开发项目的成功完成不相关的任务。这还包括来自利益相关者或合作伙伴的任何要求。\n\
  -   挑选那些因其技术技能以及处理团队内外人际的能力而赢得尊敬的团队负责人。这不仅增强了为你工作的团队的生产力和士气，还加强了与利益相关者和合作伙伴的合作关系。\n\
  -   抵制压力，不要在没有彻底筛选的情况下就从你的团队或高层招聘推荐的人，并且在可能的情况下，在由他们将工作的整个团队面试之前。\n-   继续教育和参加指定的会议对于让你的团队跟上工作的最新技术方面非常重要，并与那些可以帮助他们未来编码或安全问题的人建立联系。\n\
  -   资深导师在开发团队中起着不可或缺的作用。但很难找到具有良好指导经验的真实、合格的资深开发人员。如果你有多个团队，可以在团队之间共享这些开发人员，或者在可能的情况下从同事的团队中引入一些。\n\
  -   最重要的是，确保你以身作则，并在你的团队及其所做的一切中灌入透明、信任和诚信。这包括你在团队中如何进行排名和评估。\n-   Scrum 允许利益相关者参加任何会议，包括观察每日站会或评审。作为经理，你以及你的负责人的职责是确保对不文明行为零容忍，绝不让员工通过滥用或不尊重来毒化企业文化。这包括快速且直接的反馈。\n\
  -   仔细筛选你的人员并始终检查他们的参考背景，如果可能，向你认识与他们合作过但未列为参考人的人查询。如果你不能信任你招聘的人认同你所做的事情，你就招错了人，而且你建立了一个自带失败的系统。\n\
  -   开发软件需要高度专注。在可能的情况下，避免让开发人员离开专注的工作。专注中的一次中断可能会让开发人员闲置数小时。不要将会议分散在整个周；理想情况下，将其限制在每周两天或以内。为你的开发人员提供教育机会时，确保有不受干扰的安静时间。\n\
  -   你必须确保你的组织能够 24×7×365 快速有效地处理任何的软件问题。这将避免你的团队耗尽，避免错过服务水平协议（`SLAs`）。这将通过值班策略进行管理。要创建一个公平又有效的轮班，请考虑以下最佳实践：\n\
  \    -   公平地构建你的团队和组织\n    -   在设计轮班时保持灵活和创意\n    -   跟踪指标并监控事件\n    -   调整你的政策以适应公司的实际状况\n\
  \n## 2.3 安全工具、自动化与供应商管理\n\n> 如果没有用于代码分析、配置管理、补丁和漏洞管理以及特权凭据/密钥管理的自动化安全工具，你没有机会将安全扩展到\
  \ DevOps 流程中。安全的速度越能能匹配 DevOps 流程的速度，你就越不容易在嵌入安全实践时遇到文化上的阻力。\n\n### 2.3.1 安全工具与自动化\n\
  \n记住，DevOps 是一种哲学和方法论。尽管你可以为 `SDL`、发布管理和 `Cl/CD` 工具等过程获取或开发工具，但你仍然需要团队、协作、责任和所有权。你买不到这些；你必须正确地开发和管理\
  \ DevOps 的人为因素。这并不意味着不需要评估、获取、部署和管理自动化工具以使过程更有效。但当然，这同样需要人为因素的参与。\n\n在某些环境中，一天可以向生产环境推送多个版本的代码。安全的自动化是绝对必要的，以与\
  \ `Cl/CD` 环境中代码交付的速度保持同步。考虑到所需的速度，选择错误的工具可能是灾难性的。即使使用了正确的工具，适当的供应商管理也是你成功的关键。\n\n\
  自动化工具有助于开发团队在部署和监控应用程序方面拥有更多所有权，同时提供更快的交付时间、质量和更好的安全性。安全必须是过程的一部分并进行适当的自动化，以防拖慢开发过程。除了帮助发现安全漏洞和错误之外，自动化工具还可以帮助监控安全策略和标准，而不会负面地拖慢进度。\n\
  \n开发过程中使用的传统工具包括静态分析、动态分析、模糊测试以及漏洞代码分析工具。在 DevOps 中向左（或在我们的类比中向下）移动需要安全团队使用其他几类工具。这些包括扫描云配置安全最佳实践的工具、像单元测试或集成测试那样自动安全测试（如配置新服务器或部署某些\
  \ `Docker` 容器），以及用于运行时应用程序安全的工具。用于建立 DevSecOps 平台的优秀工具列表可以在 `https://github.com/devsecops/awesome-devsecops#tools`\
  \ 找到。\n\n#### 2.3.1.1 用于 SDL 的安全工具\n\n\n\n\n\n在本节中，我们将讨论静态分析、动态分析和模糊测试在整个 SDLC/SDL（软件开发周期/安全开发周期）过程中的功能和作用。过去几年中关于这些工具的关键变化之一是，现在在使用\
  \ DevOps 方法论时，它们被贯穿整个开发过程，而不是像过去那样在流程结束时进行。安全代码审查流程的最终目标是提高产品的整体安全性，并提供可供开发团队用于更改和/或缓解的输出，从而与\
  \ SDLC/SDL 流程开始时的概念提交（concept commit）相比，提高软件产品的安全性。在开始之前，重要的是要意识到每种方法都有特定的实际优势和局限性。\n\
  \n#### 静态代码分析的优势\n\n1. 可以访问软件将执行的实际指令。\n- 无需猜测或解释行为。\n- 可以完全访问软件的所有可能行为。\n2. 能够找到代码中缺陷的确切位置。\n\
  3. 可以由充分理解代码的软件保障开发人员进行。\n4. 允许快速修复。\n5. 如果使用自动化工具，速度相对快。\n6. 自动化工具可以扫描整个代码库。\n\
  7. 自动化工具可以提供缓解建议，减少研究时间。\n8. 允许在开发生命周期的早期发现缺陷，从而降低修复成本。\n\n#### 静态代码分析的局限性\n\n1.\
  \ 需要访问源代码或至少需要二进制代码，并且通常需要访问足够的软件制品来执行构建。\n2. 通常需要精通软件构建。\n3. 不会发现与运行部署环境相关的问题。\n\
  4. 如果手动进行，会非常耗时。\n5. 自动化工具不支持所有的编程语言。\n6. 自动化工具会产生假阳性和假阴性。\n7. 没有足够的经过培训的人员来彻底进行静态代码分析。\n\
  8. 自动化工具可能会提供一种一切都已解决的假安全感。\n9. 自动化工具的好坏取决于其用于扫描的规则。\n10. 不发现运行时环境中引入的漏洞。\n\n####\
  \ 动态代码分析的优势\n\n1. 发现范围有限。\n- 必须对应用程序进行足迹分析以找到测试区域。\n- 这可能导致某些区域遗漏。\n- 你只能测试已发现的内容。\n\
  2. 无法访问正在执行的实际指令。\n- 工具正在运行应用程序。\n- 对请求和响应进行模式匹配。\n3. 只需运行系统即可进行测试。\n4. 不需要访问源代码或二进制代码。\n\
  5. 无需理解如何编写软件或执行构建。\n- 工具倾向于更““发后不管”。\n6. 测试特定的运行部署环境。\n- 可以发现静态分析工具会遗漏的基础设施、配置和补丁错误。\n\
  7. 识别运行时环境中的漏洞。\n8. 自动化工具在扫描内容上提供了灵活性。\n9. 允许在无法访问实际代码的情况下分析应用程序。\n10. 识别静态分析中可能为假阴性的漏洞。\n\
  11. 允许对静态代码分析进行验证。\n12. 可以在任何应用程序上进行。\n\n#### 动态代码分析的局限性\n\n1. 自动化工具可能会提供一种一切都已解决的假安全感。\n\
  2. 自动化工具会产生假阳性和假阴性。\n3. 自动化工具的好坏取决于其用于扫描的规则。\n4. 与静态分析一样，没有足够的经过培训的人员来彻底进行动态代码分析。\n\
  5. 将漏洞追溯到代码中的确切位置更加困难，修复问题需要更长的时间。\n\n#### 模糊测试的优势\n\n1. 模糊测试的巨大优势是测试设计极其简单，且对系统行为没有预设观念。\n\
  2. 系统化/随机的方法允许这种方法发现人类肉眼经常遗漏的漏洞。此外，当被测试系统是完全封闭的（例如 SIP 电话），模糊测试是审查其质量的唯一手段之一。\n\
  3. 使用模糊测试发现的漏洞通常是严重的、可利用的漏洞，真正的攻击者可以利用它们。随着模糊测试越来越为人知，这一点变得更加真实，因为攻击者现在使用相同的技术和工具来利用已部署的软件。与二进制或源代码审计，甚至模糊测试的近亲故障注入相比，这是一个主要优势，后者通常依赖于难以或无法利用的人工故障条件。\n\
  \n#### 模糊测试的局限性\n\n1. 模糊器通常倾向于发现简单的漏洞；此外，模糊器对协议越了解，发现的奇异错误就越少。这就是为什么穷尽/随机方法仍然流行的原因。\n\
  2. 另一个问题是当你进行黑盒测试时，通常攻击的是一个封闭系统，这增加了评估发现漏洞的危险/影响的难度（没有调试可能性）。\n3. 使用模糊测试寻找程序故障的主要问题是，它通常只能发现非常简单的故障。问题本身是指数级的，每个模糊器都采取捷径，在人类感兴趣的时间范围内找到一些有趣的东西。一个初级模糊器的代码覆盖率可能很差；例如，如果输入包含一个没有正确更新以匹配其他随机更改的校验和，那么只有校验和验证代码将通过验证。代码覆盖率工具通常用于估算模糊器工作得“不好”，但这些只是模糊器质量的指南。每个模糊器都应预期发现一组不同的漏洞。\n\
  \n\n\n\n\n- Jackson, W. (2009, February). GCN—公共部门 IT 技术、工具与战术：“静态 vs 动态代码分析：优势与缺点。”\n\
  - Cornell, D. (2008, January). OWASP San Antonio 演示稿：“用于测试应用程序安全的静态分析技术”。获取自 [`www.denimgroup.com/media/pdfs/DenimGroup_StaticAnalysisTechniquesForTestingApplicationSecurity_OWASPSanAntonio_20080131.pdf`](http://www.denimgroup.com)\n\
  - Jackson, W. (2009, February). GCN—公共部门 IT 技术、工具与战术：“静态 vs 动态代码分析：优势与缺点。”\n- Cornell,\
  \ D. (2008, January). OWASP San Antonio 演示稿：“用于测试应用程序安全的静态分析技术。”\n\n#### 2.3.1.1.1\
  \ 静态分析\n\n静态程序分析是在不实际执行程序的情况下对计算机软件进行的分析。它主要用于对源代码的一个版本进行分析；也可以对对象代码进行分析。相比之下，动态分析是通过实际执行软件程序来完成的。静态分析由自动化软件工具执行，不应与人工分析或软件安全架构审查混淆，后者涉及手动进行的人工代码审查，包括对程序的理解和领会。当妥善使用静态分析工具时，它们比人工静态分析具有明显优势，因为分析的频率可以高得多，且其安全知识可能优于许多软件开发人员。因此，这使得仅在绝对必要时引入专家软件安全架构师或工程师。\n\
  \n静态分析（见[图 2.3]）也被称为静态应用程序安全测试（SAST）。它在项目开发或质量保证（QA）阶段识别漏洞。SAST 提供了代码级的检测，使开发团队能够快速修复漏洞。\n\
  \n```\nimages/fig2_3_B.gif\n```\n\n__________\n\n- 开放 Web 应用安全项目 (OWASP) (2012).\
  \ “模糊测试（Fuzzing）”。获取自 [`www.owasp.org/index.php/Fuzzing`](https://www.owasp.org)\n\
  - R2Launch. (2012). “模糊测试（Fuzz）”。获取自 [`www.r2launch.nl/index.php/software-testing/fuzz`](http://www.r2launch.nl)\n\
  \n使用静态分析工具以及为你的环境选择合适的供应商是成功的另一个关键技术因素。任何能够有利地自动化软件开发过程某部分的技术都应该是欢迎的，但在许多组织中，由于在选择工具时没有使用正确的人或正确的流程，这些软件已变成了“架上闲（shelfware）”。在该领域，并非所有工具都是平等的：某些工具对某些语言的支持更好，而另一些工具则具有强大的前端治理、风险管理和合规性（GRC）以及指标分析能力。在某些情况下，你可能需要使用三个不同的工具才能生效。\n\
  \n使用静态分析工具的挑战之一是，在分析与闭源组件或外部系统交互的应用程序时，可能会报告假阳性，因为没有源代码，无法追踪外部系统中的数据流，从而无法确保数据的完整性和。使用静态代码分析工具还会导致假阴性结果，即漏洞存在但工具没有报告。这可能在外部组件中发现新漏洞，或者分析工具不了解运行时环境及其是否配置了安全时发生。静态代码分析工具通常会产生假阳性结果，即工具报告了一个实际上并不存在的可能漏洞。这通常是因为工具无法确定数据从输入到输出流经应用程序时的完整性和安全性。\n\
  \nMichael Howard 在其 2006 年发表的 IEEE 文章《执行安全代码审查流程》中，提出了以下启发式方法，作为确定代码审查优先级的辅助。该启发式方法可以作为静态、动态、模糊测试和手动代码审查优先级排序的指南。\n\
  \n- **旧代码：** 旧代码可能比新代码更多的漏洞，因为新代码通常反映了对安全问题的更好理解。所有“遗留”代码都应该经过审查。\n- **默认运行的代码：**\
  \ 攻击者经常针对默认运行的代码。与不默认运行的代码相比，这类代码应该更早、更深地进行审查。默认运行的代码增加了应用程序的攻击面。\n- **在特权上下文中运行的代码：**\
  \ 例如，在特权身份下运行的代码（如 Unix 中的 root）也需要更早、更深入的审查，因为身份是攻击面的另一个组成部分。\n- **匿名可访问的代码：**\
  \ 匿名用户可以访问的代码应比只有有效用户才能访问的代码进行深度审查。\n- **在全局可用网络上监听的代码：** 默认在网络（特别是像互联网这样不受控的网络）上监听的代码面临着巨大的风险，必须进行深度审查。\n\
  - **用 C/C++/汇编语言编写的代码：** 由于这些语言可以直接访问内存，代码中的缓冲区操作漏洞可能导致缓冲区溢出。对这些语言编写的代码应进行深度分析，以检查缓冲区溢出问题。\n\
  - **有漏洞历史的代码：** 过去显示过多个漏洞的代码应该被引起怀疑，除非能够证明这些漏洞已被有效移除。\n- **处理敏感数据的代码：** 对处理敏感数据的代码应进行分析，以确保代码中的缺陷不会将此类数据泄露给不可信的用户。\n\
  \n__________\n\n- 开放 Web 应用安全项目 (OWASP). (2012). “静态代码分析”。获取自 [`www.owasp.org/index.php/Static_Code_Analysis`](https://www.owasp.org/index.php/Static_Code_Analysis)\n\
  - Howard, M. (2006, 7—8).《执行安全代码审查流程》。*IEEE Security & Privacy,* 第 74-79 页。\n\n\
  - **复杂代码：** 复杂的代码具有更高的 Bug 概率，更难理解，并且可能更多漏洞。\n- **频繁更改的代码：** 频繁更改的代码经常会导致新的 Bug。并非所有这些\
  \ Bug 都是安全漏洞，但与更新频率低的稳定代码集相比，不稳定的代码可能有更多的漏洞。\n\n\n\n\n\n- 来自多个工具的警告可能表明代码需要更细致的审查（例如，手动分析）。应尽早对代码进行评估，最好在每次构建时进行，并在每个里程碑处重新评估。\n\
  \n## 第二阶段：寻找常见的漏洞模式\n\n- 分析师应确保代码审查涵盖最常见的漏洞和弱点，例如整数算术问题、缓冲区溢出、SQL 注入和跨站脚本攻击 (`XSS`)。\n\
  \n- 此类常见漏洞和弱点的来源包括常见漏洞与披露 (`CVE`) 和常见弱点枚举 (`CWE`) 数据库，这些数据库由 MITRE 公司维护，并可通过 [`cve.mitre.org/cve/`](http://www.cve.mitre.org)\
  \ 和 [`cwe.mitre.org`](http://www.cwe.mitre.org)get。\n\n- MITRE 与 SANS 学院合作维护了一份“25\
  \ 个最危险的编程错误”列表 ([`cwe.mitre.org/top25/index.html`](http://www.cwe.mitre.org))，这些错误会导致严重的漏洞。\n\
  \n- 静态代码分析工具和手动技术至少应该应对这“前 25 个”。\n\n## 第三阶段：深入挖掘风险代码\n\n- 分析师还应使用手动分析（例如，代码检查），根据之前讨论的基于攻击面或基于启发式的方法，更彻底地评估已识别的任何风险代码。\n\
  \n- 这种代码审查应从所审查的每个模块的入口点开始，并跟踪系统中的数据流，评估数据、其使用方式以及安全目标是否可能被破坏。请参阅第 3 章，该章节描述了 SDL（安全开发生命周期）的要素，并详细讨论了如何充分利用复杂\
  \ SAST 工具，同时赋能开发人员让他们负责分析工作。\n\n- 若干商用静态分析器（截至本文编写时）提供了桌面版或集成开发环境 (`IDE`) 方法，以便在代码变更时对其进行静态分析。这就是“左移”的精髓，即尽早地进行可以执行的任何分析、检查和验证。我们必须强调这些自动化能力可用性的重要。正如\
  \ Brook 在《网络安全架构师的秘密》中所写道：\n\n________________\n\nHoward, M. (2004, 11 月).“通过尽量减少暴露给不可信用户的代码来降低安全风险”。可用于\
  \ [`msdn.microsoft.com/msdnmag/issues/04/11/AttackSurface`](http://www.msdn.microsoft.com)\n\
  \n“通常，勤奋的程序员在编写代码时会预期代码中存在错误。任何可以发现错误（且不会产生过多的错误结果，且不需要过多的配置和调优）的工具通常会被欢迎并集成。\n\n\
  但当程序员认为代码是稳定且正确的时，会发生一种心理转变。发布到开发过程下一阶段的代码（视开发方法论而异）可能会有点“眼之见脑后”。通常，程序员已经转向了其他问题。一旦代码离开了程序员的关注范围并向后移动，可能会出现一种‘向我证明这里有错误’的心态。\n\
  \n因此，在程序员提交代码为‘正确’之后进行的测试可能离编码过程太远了，而那些可以集成到编码过程中并在编码期间发现错误的工具通常会获得程序员更大的关注。因此，我们希望在编码过程的早期，至少将一些安全检查送到编码者的桌面上并进入他们的\
  \ `IDE` 中。即使这些检查没有后期构建过程中的检查那么严谨，尽早识别安全错误也比后期出现大量的发现更具有机性。将安全编码分析工具引入编码周期。然后，在构建期间进行更彻底的检查。”\n\
  \n### 2.3.1.1 动态分析\n\n动态程序分析是指通过在真实或虚拟处理器上运行程序对计算机软件进行分析。其目标是在程序运行时发现安全错误，而不是通过离线检查代码。通过对所有可能产生错误的情景进行调试，可以消除漏洞。\n\
  \n动态分析（见图 2.4) 也称为动态应用安全测试 (`DAST`)。`DAST` 用于评估应用程序内部的漏洞，适用于 SDL 和 SDLC。静态分析工具的相同优势和警告适用于动态分析工具。\n\
  \n以下关于在 SDLC 中如何使用动态分析的解释摘自 Peng 和 Wallace (1993) NIST 特别出版物 500-209，《软件错误分析》。\n\
  \n- 设计阶段常用的动态分析技术包括尺寸和时间分析、原型设计和仿真。尺寸和时间分析对于分析具有响应时间和内存内存执行空间要求的实时程序非常有用。这种分析对于为设计架构分配硬件和软件特别有用；如果在系统测试时才发现性能问题是由基础系统设计造成的，将非常困难。对于较大的设计，自动化仿真可能更容易。原型设计可以作为检查通用设计架构的辅助。\n\
  \n- 动态分析有助于确定代码的功能性和计算正确性。回归分析用于在任何代码更改时重新评估需求和设计问题。这种分析确保了对原始系统需求的关注。尺寸和时间分析在增量代码开发期间进行，并将分析结果与预测值进行比较。\n\
  \n\n\n\n软件开发生命周期（SDLC）最后阶段最常用的动态分析技术是回归分析与测试、模拟以及测试认证。当在此阶段对产品进行任何更改时，会进行回归分析，以验证影响程序其他区域的基本需求和设计假设未被破坏。模拟用于测试操作流程并隔离安装问题。测试认证（特别是在关键软件系统中）用于验证所需的测试已已执行，并确保交付的软件产品与经过软件验证和确认的产品是一致的。\n\
  \n静态分析通过分析源代码来发现问题。动态分析工具不需要源代码，但仍然可以识别出问题。在讨论静态分析时，我们回顾了一个 SQL 注入攻击示例。对于该示例，工具会识别出\
  \ `account_id` 是作为 URL 参数传递的，并尝试篡改该参数的值并评估应用程序的响应。\n\n### 2.3.1.1.3 模糊测试\n\n模糊测试（参见图\
  \ 2.5），或称 fuzzing，是一种黑盒软件测试技术，它可以是自动化或半自动化的，向计算机软件程序的输入提供无效、意外或随机的数据。换句话说，它通过自动化方式注入畸形/半畸形数据来发现实现漏洞或安全缺陷。然后会监控软件程序的输入以检查是否存在异常返回，例如崩溃、内置代码断言失败以及潜在的内存泄漏。模糊测试已成为软件或计算机系统安全问题测试的关键要素。模糊测试相比其他工具的独特优势在于，其测试设计极其简单，且没有对系统行为的预设。\n\
  \n模糊测试是软件安全的关键要素，必须嵌入到 SDL 中。该领域有许多供应商可以选择，有些甚至开发了自己的工具。模糊测试既用于安全测试也用于质量测试。最近，模糊测试被许多软件开发计划视为关键要素和主要缺陷，以至于它现在是美国国防部（DoD）信息安全认证与认可流程（DIACAP）的要求。\n\
  \n模糊测试是一种攻击模拟的形式，通过开放接口向系统输入意外数据，然后监控系统的行为。如果系统发生故障（例如崩溃或内置代码断言失败），说明软件存在缺陷。尽管模糊测试工具发现的所有问题都是关键且可利用的，但与静态分析工具不同，模糊测试只能发现通过开放接口访问的漏洞。模糊测试工具还必须能够与被测软件协作，以便能够访问更深层次的协议，并通过测试多个层来更彻底地测试系统。\n\
  \n![](img/fig2_5_B.gif)\n\n\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\n对手（尤其是资源丰富的对手，如国家级攻击者以及安全研究人员）经常将模糊测试作为主要技术来发现其目标中的潜在漏洞。对于注重安全的组织来说，在攻击者利用他们发现的零日漏洞或研究人员选择在不先报告的情况下发布此类问题（零日）之前，对自己的代码进行模糊测试是有必要的。\n\
  \n尽管静态分析具有全覆盖的优点，是提高软件质量水平的好方法，但它无法提供解决复杂问题的测试结果，而且之前之前过的，它还会产生大量的误报，两者都需要人类进行进一步分析，并消耗宝贵且有限的资源。模糊测试中没有误报，因为发现的每个缺陷都是模拟攻击的结果。\n\
  \n静态分析是在未执行的代码上进行的，且只能离线执行。相比之下，模糊测试必须针对可执行代码执行，可以在运行的软件上运行，因此可以发现静态代码中可能不可见的漏洞。模糊测试的目标是攻击者也会发现的问题，因此是健壮性的良好测试，同时通过仅关注可能易受攻击的最关键接口来简化流程。由于其具有测试健壮性的能力，模糊测试通常在\
  \ SDLC 中产品发布前的验证阶段使用。与静态和动态分析一样，模糊测试可以从第一个软件组件就绪的那刻开始使用，甚至在发布后使用——而不仅仅是在 SDLC 过程中的某个点。这一属性无疑可以通过在\
  \ SDLC 早期发现并修复漏洞来节省大量成本。\n\n标准的模糊测试技术在利用随机变异创建测试用例方面存在限制，只能发现部分软件漏洞。然而，这种测试仍然具有价值，因为这些是攻击者会发现的漏洞。要重要的是，攻击者也会使用模糊工具，如果发现者或攻击者通过模糊工具在你已经交付给客户的产品中发现缺陷，这是一个软件安全开发计划薄弱的明显迹。更复杂的模糊技术通过使用协议规范针对最易产生漏洞的协议区域来改进和优化覆盖，并在不损害测试覆盖的情况下减少所需的测试用例数量。静态代码分析用于确保遵循安全编码策略，而协议模糊工具则用于从攻击者的视角审视威胁和风险。\n\
  \n模糊测试的另一个优势是它可以与黑盒、灰盒或白盒测试结合，且不需要源代码。与本文讨论的动态分析类似，这一特征使其成为测试第三方软件或外包软件的佳工具。然而，模糊测试的缺点是它是侵入性的，可能会导致系统崩溃，这可能需要初始测试在单独的环境中进行，例如测试实验室或虚拟化环境。\n\
  \n模糊测试主要有两种类型：“智能”和“愚笨”。\n\n*   在“智能”（生成式）模糊测试中，模糊器以逻辑方式向程序推送数据，通常通过等待响应并可能修改堆栈。这种方法需要对目标的深入知识和专门工具，但所需的崩溃分析较少，重复发现也比愚笨模糊测试少。\n\
  *   在“愚笨”（变异式）模糊测试中，模糊器系统地向程序推送数据，而不等待正确的响应。这种方法与拒绝服务攻击密切相关。这种方法不需要目标知识并使用现有工具。然而，它需要的崩溃分析更多，且重复发现也比智能模糊测试多。\n\
  \n\n\n\n- Royal, M. and Pokorny, P. (2012, April). 凯梅隆大学 IT 4444—毕业设计：“实践中的哑模糊测试”。可用自\
  \ [`www.cameron.edu/uploads/8d/e3/8de36a6c024c2be6dff3c34448711075/5.pdf`](http://www.cameron.edu)\n\
  - Manion, A. and Orlando, M. (2011, May). ICSJWG 报告：“面向初学者的模糊测试”。可用自 [`www.us-cert.gov/control_systems/icsjwg/presentations/spring2011/ag_16b_ICSJWG_Spring_2011_Conf\
  \ Manion_Orlando.pdf`](http://www.us-cert.gov)\n- Royal, M. and Pokorny, P. (2012,\
  \ April). 凯梅隆大学 IT 4444—毕业设计：“实践中的哑模糊测试”。可用自 [`www.cameron.edu/uploads/8d/e3/8de36a6c024c2be6dff3c34448711075/5.pdf`](http://www.cameron.edu)\n\
  \n为了执行模糊测试，对于每个输入到应用程序的文件或字段，都遵循以下步骤：\n\n1. 在输入文件的某些部分输入随机数据或空格。\n2. 使用该输入文件执行应用程序。\n\
  3. 评估结果。哪些部分崩溃了？哪些部分运行正常？预期的结果是什么？\n4. 为每个测试用例编号，并向项目管理层报告发现的问题。\n\n### 2.3.2 DevOps\
  \ 工具：超越 SDL\n\nDevOps 安全将安全流程和工具集成并自动化到整个 DevOps 工作流中，从而实现持续交付而非点点交付。在 DevOps 环境中，提供下文列出的能力的特定安全工具，可以在可以在\
  \ [`www.csoonline.com/article/3398485/28-devsecops-tools-for-baking-security-into-the-development-process.html`](https://www.csoonline.com)\
  \ 找到：\n\n- 为开发者提供有关潜在安全异常和缺陷的警报和通知。\n- 自动扫描、发现并修复安全缺陷。\n- 包含仪表板工具，允许在一个图形化视图中从开发初期到运行阶段查看并共享安全信息。\n\
  - 跨越整个攻击面识别、预测并定义威胁，以便你可以做出主动的安全决策。\n- 在安全漏洞被利用之前将其识别出来。\n- 管理跨整个 CI/CD 流水线和运行环境的安全，以实现端到端安全。\n\
  - 将安全和合规性集成到公有云应用的构建、部署和运行中。这提供了自动化测试和安全强化。\n- 将 DevSecOps 架构构建到 CI/CD 过程中。\n- 基于容器的应用程序的内置安全性。\n\
  - 发现并修复跨资源配置、网络架构和用户活动的安全威胁。\n- 提供一个自动化平台，旨在收集有关软件的信息，识别威胁和应对措施，并突出相关的安全控制，以帮助企业实现其安全和合规目标。\n\
  - 处理开源漏洞。\n\n### 2.3.3 供应商管理\n\n供应商风险管理 (`VRM`) 和第三方风险管理是您的 DevOps 以及公司整体风险概况的重要方面。你必须保护自己免受业务中断和声誉损害。你必须审查工作流。这对于安全商业现货\
  \ (`COTS`) 软件产品和服务来说尤为真实，因为这些产品通常处理开发过程中利用和创建的最敏感的知识产权和业务信息。这必须包括第三方供应商的身份验证、审计和访问控制，以及他们对工作流和用户界面可能进行的任何参与。\n\
  \n多次应用程序审查得出结论，发布的代码中约有 65% 到 85% 之间是开源的。这意味着大多数所谓的“内部发明”或“自主生长”的代码并非如此。从开发的角度来看，开源社区就是供应商。要直白地说，作为软件发布的关键输入和部分内容的供应商，它们的安全性就是你的安全性。在第\
  \ `3` 章中（涵盖了通用的 `SDL`），我们将更深入地探讨软件组件管理。幸运的是，至少部分开源管理可以自动化，以符合 DevOps 思维并减轻负担。\n\n\
  - Grembi, J. (2008). *安全软件开发：安全程序员指南。* 波士顿 (MA): Course Technology\n\n让我们不要忘记开发工具也由供应商提供——包括商业、开源或受支持的开源产品。DevOps\
  \ 自动化依赖于丰富、复杂的技术栈，每种技术的安全实践都会影响开发，从而影响你组织的安全态势。如果工具中没有内置适当的安全能力，则需要采取替代措施。每个工具的配置必须符合你的安全态势。简而言之，供应商的安全性是你安全性的一部分，这需要\
  \ `VRM`。\n\n我们下一节将讨论开源和包含的软件组件。\n\n#### 2.3.3.1 管理 COTS 安全产品\n\n\n\n\n通常，采购部门（包括法律、IT\
  \ 以及在某些情况下包括工程部门）将有一个团队来管理供应商生命周期，该团队将与 DevOps 安全团队协作工作，并遵循严格的交互规则。如果您不具备这种能力，强烈建议外包此项功能并寻求相关指导。\n\
  \n该安全团队将定义需求，但经验丰富且声誉良好的 VRM（供应商风险管理）专家（包括采购人员）将对所有供应商进行标准化评估，帮助进行投标、供应商和选择流程；定义合同条款和时间范围；确保对供应商的性能和关系的监控；并在合同结束或续约时充分参与。续约的关键方面在于审查价格谈判、历史表现以及识别出的任何供应商风险。在某些情况下，如果供应商被证明为高风险，可能会提前终止合同。\n\
  \n高风险可能不仅与安全、性能或合同合规性有关；某些供应商在合同存续期内可能面临财务或偿付能力问题。在其他情况下，供应商可能被竞争对手收购，这也可以是一个问题。对于这类情况，准备一个备份供应商总是是好的。\n\
  \n法律问题，如诉讼、集体诉讼、工作损失或关系终止；潜在的合规违规、信息安全和数据安全风险；以及潜在的知识产权损失，都是供应商风险审查中将要评估的内容。即使您认为自己拥有良好的内部安全控制，如果您的第三方供应商代表您处理机密、敏感、专有或分级信息，这是非常有风险的，需要法律、风险团队、合规部门以及负责承担业务风险的人员进行审查并签字。\n\
  \n除了选择和使用 COTS（商业现成软件）安全产品外，安全团队与上述供应商风险伙伴密切合作也至关重要，以查看如何通过产品增强 DevOps 方法论和目标。例如，该产品能否交付清晰定义且可衡量的业务指标，以满足客户和业务成果？它是否能协助完成所需的\
  \ DevOps 文化变革——特别是安全方面的变革？该产品能否帮助促进或增强持续改进循环？\n\n#### 2.3.3.2 管理开源安全产品\n\nSonatype\
  \ 以及来自 IT Revolution 和 Galois 的研究伙伴编写了一篇名为《2019 年软件供应链状态报告》的论文。从 2017 年到 2019 年，他们的分析发现，开源组件的发布频率增长了\
  \ 75%，使用这些组件的团队的下载请求同比增长了 68%。他们还发现，现代软件应用程序中平均代码库的 85% 由开源组件库组成，并严重依赖于它们。\n\n该报告的其他引用指出：“将开源组件发布组装成应用程序的形式体现了极高的效率。开发者不再需要从零编写每一行代码”，以及“开发者可以在几秒钟内下载提供新功能的组件发布，这些功能由组织外部的专家构建，并将其代码免费提供给他人。”\n\
  \n报告强调，开发者下载并集成到其代码中的开源组件充满了危险的漏洞。报告举例说明，仅超过一半的 JavaScript 包下载包含已知漏洞，其中 1/3 被评为高风险漏洞，1/10\
  \ 被评为严重漏洞。\n\n过去几年中，转向开源的趋势大幅增加。我们在上一节中关注的是 COTS，但实际上，开源是当今代码中的主导部分。在大多数情况下，开源是可用的。有关开源安全请参见\
  \ `https://www.notsosecure.com/achieving-devops-with-open-source/`。\n\n随着 DevOps\
  \ 向“左侧”移动以实现更多自动化，存在倾向于开源的趋势。开源不仅具有成本效益的声誉，还促进了生产力和创新。尽管令人敬畏，但截至 2019 年，过去两年开源供应增长了\
  \ 75%。\n\n缺点是，自 2014 年以来，确认或嫌疑的开源泄露事件增加了 71%，“许多开源组件的许可协议中带有法律责任，且每 16 次开源下载请求中就有一个针对已知漏洞的组件。”鉴于大量的软件产品包含开源内容，这也意味着这些代码可以被潜在的攻击者分析。攻击者还拥有了解任何公开报告漏洞的优势，因为他们可以通过国家漏洞数据库\
  \ (`NVD`)、软件开发项目主页、GitHub Issue 列表和邮件列表等来源获取这些信息。这为攻击者提供了一个目标丰富的环境。\n\n\n\n\n遗憾的是，许多公司没有意识到开源带来的风险，或者在知后果的情况下仍然接受了这些风险。那些了解风险的机构正在追踪并有效管理开源软件的使用。商业软件会将更新推送到用户，而开源则要求你自己拉取补丁和更新，并自行跟踪漏洞。如果对进入其代码库的开源内容建立相应的跟踪系统，开发组织将无法缓解和防御通过这些开源组件引入的漏洞。2019\
  \ 年的一份 Synopsys 开源与安全分析报告发现，“在 2018 年审计的代码库中，60%的代码包含至少一个漏洞——这一数字仍然显著，但远好于 2017\
  \ 年 78%的数字。”开源软件和组件可以为使用它的组织带来巨大的益处，但如果在使用过程中没有识别任何相关的安全和法律合规问题，这种益处就不存在。软件中未修补的开源组件会增加安全风险。\n\
  \n在本章前面的部分，我们提到了 `SAST` 和 `DAST` 工具的使用，并描述了它们在软件开发程序中的用途，特别是作为 `SDL` 的一部分。这些工具对于识别代码中常见的编码错误和已知漏洞非常有用，但它们对于识别通过开源组件引入的漏洞并不有效。大多数开源项目都可以免费使用至少一个商业\
  \ `SAST` 厂商的产品。开源项目几乎没有理由不运行 `SAST` 并修复那些发现的、可能被攻击者利用的发现结果（漏洞）。\n\n组织正越来越多地使用软件成分分析\
  \ (`SCA`) 工具进行分析——既为了建立开源组件的清单，也为了识别漏洞。在 DevOps 环境中分析开源组件漏洞将需要比传统 `SDL` 环境更高频率的测试和反馈循环。\n\
  \n简而言之，必须要求开源社区实施通用 `SDL` 中的各项活动。如果未能至少做到最低要求，通常表明生成的软件组件在构建时没有具备足够的安全性，因此应该避免使用。我们将在随后的章节中更深入地讨论这一主题。\n\
  \n不应误解为开源比 `COTS` 不安全，或者认为开源社区在发布补丁方面通常做得不够出色；但手动追踪组件、版本及其漏洞，以及手动下载补丁，这些任务远远超出了大多数组织的能力范围。如果没有对所使用的代码进行完整的清单，你就无法维持良好的软件资产管理程序。最重要的是，如果你不知道自己在使用某个东西，就无法对其进行修补。美国参议院永久调查小组小组\
  \ (`PSI`)）的一份员工报告指出，Equifax 缺乏完整的软件清单是导致其 2017 年大规模数据泄露的因素之一。如前所述，开源软件的风险并不比 `COTS`\
  \ 大，但对开源软件进行管理的使用无疑风险巨大。\n\n### 防御开源安全和合规风险\n\nSynopsys 作为开源安全管理工具和服务的领导者之一，建议组织采取以下步骤来管理其环境中开源软件的安全：\n\
  \n* 创建并执行开源风险策略和流程\n* 对其开源软件进行全面清单统计\n* 映射开源内容以识别漏洞\n* 持续监控新的安全威胁\n* 识别许可风险\n* 确保开源是合并收购\
  \ (`M&A`) 尽职调查的一部分\n\n正如我们在深入研究安全开源管理所必需的 `SDL` 活动时将看到的，某些要求的工作是可以自动化的。一如既往，从 DevOps\
  \ 的视角来看，凡是能够自动化的就必须自动化。\n\n#### 2.3.3.2.1 开源许可证\n\n开源软件是可以免费使用的，但它附带许可证。开源组件在法律上属于商业物品。这些许可证大多数是宽松型（permissive）或著权型（copyleft）。宽松型开源许可证对如何重新发的要求极小。著权型许可证类似于版权，它们是限制在未经作者许可的情况下使用创作作品的权利的法律。当作者在著权许可证下发布程序时，他对该作品的版权主张所有权，并发布声明，规定只要保持了互惠义务，其他人就有权使用它。这意味着基于著权组件编写的软件必须以开源形式发布。结果是此类软件必须发布其完整源代码以及修改和分发整个代码的所有权利。这对你保护知识产权的能力产生了严重影响。如果你的公司或产品作为合并收购的一部分被收购，这可能会大幅降低你公司或产品的价值。\n\
  \n尽管开源软件是免费的，并且增加了软件产品开发的创新、效率和竞争力，但也必须将其作为资产进行管理，遵守许可义务，并且必须达到内部开发软件标准和要求的安全性水平。这些有时独特且复杂的许可和业务风险如果管理不当，可能会延迟甚至阻止软件的部署或发货。遵守适用的开源要求以避免昂贵且耗时的诉讼至关重要。\n\
  \n**开源软件许可证合规**：不遵守开源软件许可要求可能导致昂贵且耗时的诉讼、法庭时间、版权侵权、公共媒体曝光、负面声誉，以及对不合规组织声誉和业务关系的负面风险影响。开源许可证的管理不当和不合规还可能导致难以或无法提供软件产品支持、延迟当前的发布和发货日期，或停止目前计划发货的订单。\n\
  \n\n\n\n\n## 2. 开源软件安全\n\nSDL 和开发团队以及其高层赞助人需要意识到并理解与在自己的软件产品中使用的开源软件代码相关的漏洞。与内部开发的软件一样，开源社区和软件安全社区已知的所有漏洞都必须在整个\
  \ `SDL` 过程中进行识别、评估和缓解，并包含与内部开发代码同等标准的威胁建模、架构安全与隐私审查以及风险评估严谨性。\n\n- Synopsys. (2019).\
  \ “2019 开源安全与风险分析 (OSSRA).” 报告。p. 16.\n- White Source. (2020). “正处于并购边缘？不要忽视开源尽职调查。”\
  \ 检索自 https://resources.whitesourcesoftware.com\n\n如果可能的话（正如我们在那些致力于第三方组件的 `SDL`\
  \ 活动中看到的那样），让开源组件社区来执行部分或（最好是执行大部分）`SDL` 活动，比为一个疏忽或无能的社区为后腿（补救）要高效得多。重要的是，在许多开源许可证下，对开源软件的任何更改都必须回馈项目——这意味着你的开发团队必须成为组件社区的一部分。成为许多开源社区的活跃成员需要的不仅仅是寥寥几行代码。通常涉及到对构建什么以及不构建什么的持续讨论，对变更请求和建议监控，甚至可能包括评估设计和审查代码。社区参与需要某些组织可能无法付出的资源投入。\n\
  \n对于某些组织来说，这种投资和代码共享可能不会构成太大的障碍。对于其他组织，那些必须尽可能保持其软件专有化的人（有很多原因这样做），将任何内部开发内容贡献给开源项目可能是不可行或不理想的。在这种情况下，最好选择支持良好且表现出合理水平软件安全实践的组件，而不是在内部执行任何会导致开源软件发生更改的\
  \ `SDL` 活动。\n\n使用手动方法来发现、选择、监控和验证开源代码是耗时、低效的，而且是对稀缺的开发团队资源不必要的消耗。通过工具如 Black Duck\
  \ Software (`www.blackducksoftware.com`)、FlexNet Code Insight (`https://www.flexerasoftware.com/protect/products/flexnetcode-insight.html`)\
  \ 或 WhiteSource (`https://www.whitesourcesoftware.com`) 等工具实现自动化，对于有效高效地将开源软件纳入\
  \ `SDLC` 开发工作至关重要，以降低开发成本并在整个 `SDL` 过程中管理软件及其安全。我们将在后续章节中讨论进一步的自动化机会。\n\n### 2.3.3.2.2\
  \ 开源尽职调查\n\n开源尽职调查将要求你创建一个开源清单，以包含所有依赖项。如果你不知道正在使用哪些组件，你将不知道需要遵守哪些开源许可证。你的组织可以手动执行此操作，也可以使用自动化工具。推荐使用自动化方法，因为它将显著减少手动执行时可能出现的时间、资源、错误和不一致性。通过与你的构建工具集成，自动化方法可以在几分钟内揭示你所有的开源组件。在识别出开源组件后，你就可以识别你的组件所拥的所有许可证。许可证分析必须是全面的：合规性必须考虑到子许可证和子组件隐含的许可。\n\
  \n下一步是识别所有开源许可证并检查合规性。尽职调查的这一阶段的一部分是检查如果你的公司合规，每个许可证要求你做什么。在完成开源清单并验证你符合你的开源许可证后，你就可以检查你的开源组件是否由于你的开源组件而存在任何已的安全漏洞。\n\
  \n最后一步是识别有漏洞和过时的开源组件。有一个 `NIST` 数据库维护着所有报告的开源安全漏洞的记录。由于每月都会发布数千个漏洞，跟踪与你产品使用的开源软件相关的\
  \ `CVE` 几乎是不可能的。有几种自动化工具可以为你完成任务。如果安全漏洞影响了你的产品，你应该考虑将开源组件更新到新发布的版本，因为它们可能包含修复。\n\
  \n之前提到的《2019 年软件供应链状态报告》发现，几项软件供应链实践有助于降低风险，其中以下五项影响最为深远：\n\n- 开发带有标准策略的治理计划\n-\
  \ 建立一个评估和添加新组件的流程，包括这些组件如何被评估、批准和标准化\n- 主动移除问题组件——通过主动寻找并消除现有代码中潜在的开源漏洞源\n- 目标是始终使用最新版本的组件，因为它们的漏洞最少\n\
  \ 使用 使用自动化强制工具来跟踪、管理和或确保开源依赖项的策略合规性\n\n\n\n\n\n由于事件响应和责任问题的敏感性，组织架构、关系网络和准备工作都是生存的关键。尽管每个组织都可能存在差异，但执行人员、公共关系、法律、客户支持、销售，以及相关的开发者、产品经理、项目经理、Scrum\
  \ 负责人和安全人员（包括管理和技术人员）都可能参与其中，特别是那些对软件所有者、用户、客户和顾客构成最大风险，且可能在技术上最复杂、最具挑战性的问题。\n\n\
  作者们经历过许多次非常严重的事件；我们可以向读者保证，采取包容性、整体性的方法是有效且高效的。未能包含正确的技能，未能建立清晰且标准的职责和问责制度，以及没有建立的流程和指挥链，将导致混乱。管理和技术领导将都会浪费时间尝试“做正确的事”——其中极少数人除了催促某人在某处“现在做点什么”之外，实际上无法做出太大贡献。缺乏计划且未能彻底执行，很容易导致像著名的阿伯特和科斯泰洛喜剧小品“谁在第一号位？”那样的局面。当许多善意的人大叫时，混乱统治了一切，但很少的人拥有采取行动并果断决策所需的信息。\n\
  \n毫无准备的事件响应会迅速演变成一场大马戏，许多人都在对着谁认识谁来做出反应。管理这样一个三环马戏将轻易且快速地消耗比事件本身所需更多的时间和资源。未准备准备的人自哀吧。由于目前软件开发的现状，任何制作软件或集成软件的组织在某个时候都将面对事件。我们经历过这些；我们祈祷没有组织相信“这种情况不会发生在我们身上”。它会发生，而且确实发生了。\n\
  \n\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\n[¹]: Chickowski, E. (2019). “DevSecOps 如何管理软件供应链的五种方法”。获取自\
  \ [`devops.com/5-ways-devsecops-can-manage-software-supply-chains/`](https://devops.com/)。（数据源自\
  \ 2019 年软件供应链状态报告。）\n\n[²]: Morgan, S. (2019). “糟糕的软件开发是最大的网络威胁吗？”获取自 [`www.csoonline.com/article/2978858/is-poor-software-development-the-biggest-cyber-threat.html`](https://www.csoonline.com)\n\
  \n需要响应的事件可能并非源于你组织的开发工作。考虑爱德华·斯诺登的泄密（2013 年），美国国家安全局（`NSA`）在一个广泛接受的加密标准中植入了万能主钥匙。任何使用该算法且目标包括不向\
  \ `NSA` 泄露加密数据的组织，在圣诞节前四天陷入了混乱，当时许多员工已经和家人在一起过假了。这样的公告将对一个人的事件响应计划进行考验。\n\n或者，参考\
  \ 2018 年 1 月份的 `Spectre/Meltdown`公告。任何使用任何标准中央处理器（`CPUs`）和操作系统（`OSs`）的组织都受到了这些问题的影响。换句话说，几乎每个计算机用户都可能存在漏洞。不响应不是一个选项，因为在发布两周后，运行在标准浏览器中的\
  \ `Javascript™` 漏洞代码就公开了。\n\n无疑，如果你制作软件，事件响应必须成为你组织的一部分。某些问题对组织的影响远超软件制造者。做好准备。\n\
  \n无论我们面临什么样的风险，以少办多都是我们共同面临的现实。为了帮助解决这一难题，我们开发了一个不依赖于持续增长（线性增长或其他）的软件安全小组模型。虚拟团队对抗线性增长，允许一个人员配置齐全、中心化的软件安全小组保持相对稳定。我们认为，在你的软件工程开发组织中，由每个主要软件产品组的一名资深软件安全架构师以及一个担任该组内每个软件产品安全架构师角色的\
  \ `SSC` 组成的中央小组将能够很好地扩展。人才的另一个元素是 `SSEs`，当有空缺时，他们可以成为 `SSCs` 的候选人。对于本节最重要的是，通过让开发组织中每个软件产品的关键\
  \ `SSCs` 分担典型产品安全事件的责任，一个拥有极精简团队的单一 `PSIRT` 经理就足够了，前提是任务职责分布在整个组织中。\n\n## 2.4.1\
  \ 对源代码中缺陷和安全漏洞的内部响应\n\n软件开发组织拥有大型团队，专门负责产品发布前的搜索、记录、存储、跟踪和管理缺陷以及安全缺陷和漏洞。在过去，安全工程师和质量保证（`QA`）团队的大部分工作是在开发周期的后期完成的，安全性并不是真正构建的——它是在最后强加上去的（如果有话的话）。某些缺陷和安全漏洞被发布到生产环境而不是被修复是常有的。在\
  \ DevOps 中，测试是每个参与人员的责任，并且贯穿于整个开发过程。\n\n在成熟的 DevOps 组织中，持续集成意味着代码检查更频繁，而不是减少大型变化的频率。通过使用持续测试，重点是确保所有代码通过测试，确保无缺陷且无已知漏洞。然后这些问题要么被修复以通过测试，要么更改从构建中回滚。代码还被视为基础设施（左移），以确保更改在整个交付环境中得到更新。这导致了产品交付时间、质量和安全性的提高，并交付了更好的业务价值。当问题创建之间的周期时间缩短时，开发者可以快速修复、重新构建和重新测试，从而大幅缩短生产就绪产品的时间。团队将根据对终端用户的影响优先处理生产缺陷和安全修复，在纠正这些问题后，将确定根原因。根因判断的结果应该包括如何通过新测试、改进自动化、加强协作或其他更改来防止此类问题的再次发生。\n\
  \n\n\n\n\n对于内部发现的漏洞，具有特定报告要求的 SLA 通常根据严重性级别进行区分，例如通用漏洞评分系统（`CVSS`）。产品安全事件响应团队的成员参与采购和法律部门的合作非常重要，以防止合同条款不符合你们的事件响应流程和程序，或承诺了你们无法交付的内容。\n\
  \n## 2.4.2 对在产品源代码中发现的安全漏洞的外部响应\n\n我们发布后方法论的关键要素之一是，在我们建议的软件安全和隐私联动组织结构中，典型的 PSIRT\
  \ 功能可以是一项共同责任，该结构涵盖了对发布后安全漏洞和隐私问题发现的响应。无论你们的软件安全计划及相关的 `SDL` 多么完善，事实是某些时候总会遗漏一些东西，你需要一个计划来应对。最重要的是，如果从发布后的软件产品中发现软件安全漏洞和隐私问题是一个常见现象，这清楚地表明通过类似于\
  \ `SDL` 的过程在组织的 `SDLC` 中构建安全机制是薄弱或不存在的。这种薄弱可能导致由于发布后软件固有漏洞或安全缺陷被公开利用而产生的负面影响，随后由于品牌声誉受损导致市场份额流失以及诉讼或违约，并为敌对机会者的进一步利用制造一个重大目标。\n\
  \n根据我们的经验，我们再如何强调，拥有一个单一小组作为与客户就安全漏洞进行通信的焦点是多么重要的。通常，我们看到过至少三个不同的小组与客户沟通：客户支持、销售和信息安全小组。在特定公司中，`PSIRT`\
  \ 可能可能不是信息安全组织的一部分，尽管这无疑是理想的。总而言之，清晰定义的客户通信链对于防止非预期信息的泄露、避免恐慌以及防止整个账户面临风险至关重要。\n\
  \n## 2.4.3 发布后 PSIRT 响应\n\n在软件安全方面，`PSIRT` 负责响应涉及外部发现的发布后软件产品安全漏洞的软件产品安全事件。作为该角色的一部分，团队负责管理对公司软件产品及其交互系统的已公开发现的安全漏洞的调查。外部发现者可能是独立安全研究人员、顾问、行业组织、其他供应商，或是善意的甚至可能是怀有恶意的黑客，他们识别了\
  \ `PSIRT` 负责的软件产品中的潜在安全问题。识别出的问题根据漏洞的潜在严重性进行优先级排序，通常使用书中之前描述的 `CVSS` 评分系统以及其他环境因素。报告事件的解决可能需要对\
  \ `PSIRT` 母公司正在积极支持的产品进行升级。\n\n在识别漏洞后以及对漏洞声明进行调查期间，`PSIRT` 应与发现者协作，以确认漏洞的性质，收集所需的决策信息，并确定适当的补救措施。\n\
  \n当初步调查完成后，结果将交付给发现者，并附带解决方案和公开披露计划。如果事件报告者不同意结论，`PSIRT` 应尝试解决这些疑虑。\n\n发现者将被要求保持严格保密，直到客户获得完整的解决方案，并且\
  \ `PSIRT` 在公司网站通过适当的协调公开披露（通常称为安全公告，即 `SB`）发布了这些内容。在调查和预报告过程中，`PSIRT` 负责协调与发现者的通信，包括有关事件调查的状态和文档更新。此外，可能还需要从发现者处获取更进一步的信息，以验证该声明以及利用该漏洞的方法。发现者还将被通知，如果他们在\
  \ `PSIRT` 发布之前披露了漏洞，则发现者将无法公司的公开披露中获得荣誉，且该案例将被视为“零日”，即由外部来源公开报告的无通知发现。在发现零日的情况下，`PSIRT`\
  \ 和开发团队将根据特定漏洞的 `CVSS`（`http://nvd.nist.gov/cvss.cfm`）评分严重性，尽快修复漏洞。对于高分的零日漏洞，公司的公关团队将与\
  \ `PSIRT` 紧密合作，以管理潜在的负面新闻和客户反应。\n\n在对报告的漏洞进行调查期间，`PSIRT` 在高度机密的基础上协调并管理所有敏感信息。内部分发限于那些有正当知情需求并能协助解决漏洞的人员。\n\
  \n`PSIRT` 还会与第三方协调中心（如 `CERT` 协调中心（`CERT/CC`）（`http://www.cert.org/certcc.html`）等其他机构合作，对于影响其所负责的软件产品的报告漏洞，管理协调的行业披露。在某些情况下，多个供应商将受到影响，并将参与到如\
  \ `CERT` 等中心的协调响应中。如果涉及协调中心，根据情况，`PSIRT` 可能会代表发现者联系该中心，或协助他们自行联系。\n\n如果产品的第三方组件受到影响，这将使补救过程变得复杂，因为\
  \ `PSIRT` 将依赖第三方进行补救。进一步的复杂之处在于，`PSIRT` 必须协调并在许多情况下直接通知供应商，以确保与第三方协调中心的协调，并可能直接涉及发现者。尽管使用了第三方组件，但假设是主软件产品的所有者对软件的所有组件负责，无论他们是否拥有这些组件。\n\
  \n如上所述，`PSIRTs` 通常使用 `CVSS` 来评估漏洞的严重性，作为其评估产品中报告的潜在漏洞并确定哪些漏洞需要外部报告的标准流程的一部分。\n\n\
  `CVSS` 模型使用三种不同的测量值或评分，包括基础、临时和环境计算，这三个评分的总和应被视为最终的 `CVSS` 评分。该评分代表某一个时间点；它是针对特定环境定制的，并用于对特定的外部发现漏洞进行响应排序。此外，大多数\
  \ `PSIRTs` 会考虑修改最终评分，以解释 `CVSS` 评分未能充分捕捉的因素。在确定特定漏洞的严重性以及报告需求时，`PSIRTs` 通常使用以下 `CVSS`\
  \ 指南：\n\n* 高级（H）——严重——`CVSS` 基础评分 7.0–10.0\n* 中级（M）——`CVSS` 基础评分 4.0–6.9\n* 低级（L）——`CVSS`\
  \ 基础评分 0.1–3.9\n\n\n\n\n\n如果 `PSIRT` 负责的产品中涉及第三方软件组件的安全问题，根据具体情况以及第三方是否具有 `CVSS`\
  \ 分值，`PSIRT` 可能会使用组件创建者提供的 `CVSS` 分值，并/或对分数进行调整，以反映其对整个软件产品的影响。\n\n当发生以下一种或多种情况时，针对外部发布后的发现事件通常会进行公开披露，包括相关的基础分和时间\
  \ `CVSS` 分值以及 `CVE ID` 报告：\n\n- 事件响应流程已完成，并已确定存在足够的软件补丁或其他补救措施来解决该漏洞。可以发布代码修复的公开披露以应对高严重性漏洞。\n\
  - 观察到对漏洞的活跃利用，该漏洞可能导致 `PSIRT` 公司客户的风险增加，因此需要发布安全漏洞公告。该公告可能包含也不包含完整的补丁集或其他补救措施。在可能的情况下，将在公开公告中包含补偿性控制，以提供临时保护，从而在永久修复方案发布之前限制暴露口扩大。\n\
  - 可能会发生零日漏洞公告，或其他由于影响 `PSIRT` 公司产品的漏洞导致公众意识增加的情况，这可能导致客户风险增加。在这些情况下，`PSIRT` 已与公司的\
  \ `PR` 团队紧密合作，帮助评估公开指标和警告（如 Twitter Feed get 博客），判断这种暴露即将发生，并提前准备了声明。再次，这种加速的公开漏洞公告将不包含完整的补丁集或其他补救措施，但理想情况下，可以确定限制暴露的临时补偿性控制。\n\
  - 整个过程中通过了一系列记录在的制衡机制，以验证收集和评估的信息的完整性，包括 `CVSS` 评分的有效性和公平性。\n\n一个典型的 `PSIRT` 案例处理流程包括以下步骤：\n\
  \n1. 接收由个人发现者或组织评估的漏洞通知。\n2. 确定负责的软件产品开发小组，以及评估发现者漏洞主张所需的资源。\n3. 如果该主张可信，则进行影响评估并确定修复时间表。开发修复方案所需的努力程度和优先级，与漏洞严重性和风险公开披露的概率之间进行平衡。在某些情况下，由于开发团队正在执行其他关键任务，可能需要外部资源。如果主张不可信，则向发现者索要更多信息，以确保在测试环境中正确重现了威胁。如果在确认测试环境后主张仍不可信，则通知发现者公司的调查结果。如果发现者公开声称该漏洞可信，尽管公司已确定其不可信，则\
  \ `PSIRT` 通常与公司的 `PR` 团队合作，发布公司的调查结果作为对发现者的反驳。\n4. 承诺修复时间范围、修复已确认漏洞所需的资源以及报告格式（例如：安全公告、知识库文章或其他或其他形式的公开通知）。\n\
  5. 在确定补丁或其他补救方法后，在修复方案提供的日期，通过步骤 4 确定的报告格式同时通知所有客户（*Core Software Security,* 第 232-236\
  \ 页）。\n\n---\n\n- `FIRST.org`. (2020). “Common Vulnerability Scoring System v3.1:\
  \ Specification Document.” 获取自 `https://www.first.org/cvss/v3.1/specification-document`\n\
  - `MITRE`. (2013). “CVE—Common Vulnerabilities and Exposures The Standard for Information\
  \ Security Vulnerability Names.” 获取自 `http://cve.mitre.org/index.html`\n\n### 2.4.4\
  \ 优化发布后的第三方响应\n\n不同团队和利益相关者之间的协作为发布后响应提供了最好的成功机会。正如本书建议的，通过 `SSCs`、`SSEs` 以及与软件开发产品经理和质量团队建立持续的正式软件安全程序化关系，来支持并协作集中的软件安全团队，与仅依靠专门团队来处理发布后\
  \ `PSIRT` 和隐私支持相比，具有几个明显的优势：\n\n- 通过将这些功能直接嵌入到直接负责修复受发现漏洞或隐私问题直接影响产品的工程和开发小组中，实现了对\
  \ `PSIRT` 和隐私响应的直接所有权。\n- 对代码、架构以及整体软件产品设计和功能的直接了解，并对修复过程产生直接影响，将比不直接了解产品的外部组织具有更高的效率、控制力和响应能力。从本质上说，这消除了中间人并简化了流程。\n\
  - 这种流程通过资源利用以及通过开发团队的直接参与和所有权对软件产品源头的直接了解，为 `PSIRT` 和隐私响应功能提供了更好的投资回报率 (`ROI`)。\n\
  - 直接赋能开发团队和项目经理，让他们对修复过程拥有更直接的所有权，以及嵌入在工程/开发小组中的集中软件安全小组，为响应提供了单一的组织责任。\n- `SSCs`\
  \ 和 `SSEs` 与软件产品经理及适当的产品开发资源地运营，直接驱动对外部发现者所主张漏洞的评估和补救（如果需要）。\n- 以上所有结果导致了更快的执行和响应速度，最重要的是，有助于加速缓解负面媒体曝光和客户风险。我们认为，我们提议的组织架构具有优势，它提供了一种成本效益高、资源极少且高效的方式来应对此类事件，同时减轻了用于软件本身开发的资源负担。\n\
  \n#### 2.4.4.1 ISO 29147 和 ISO 30111\n\n两个国际标准组织 (`ISO`) 标准与供应商 `PSIRT` 的正常运行有关：\n\
  \n1. `ISO/IEC 29147:2018` [ISO/IEC 29147:2018]—信息技术—安全技术— 漏洞披露\n\n该标准为供应商在产品和服务中披露漏洞提供了要求和建议，适用于选择通过漏洞披露来减少供应商用户风险的供应商。\n\
  \n漏洞披露使用户能够执行 `ISO/IEC 27002:2013`, `12.6.1` 中指定的技术漏洞管理。漏洞披露帮助用户保护其系统和数据，优先考虑防御投资，并更好地评估风险。漏洞披露的目标是降低与漏洞利用相关的风险。当多个供应商受影响时，协调漏洞披露尤为重要。本标准提供了：\n\
  \n- 关于接收潜在漏洞报告的指南\n- 关于披露漏洞修复信息的指南\n\n\n\n\n\n- 漏洞披露相关的特定术语和定义\n- 漏洞披露概念概述\n- 漏洞披露的技术和策略考量\n\
  - 技术、策略（附录 A）和通信（附录 B）的示例\\*\n\n## 2. **ISO/IEC 30111:2019** [ISO/IEC 30111:2019]—信息技术—安全技术—漏洞处理过程\n\
  \n本标准为如何处理和修复产品或服务中报告的潜在漏洞提供了要求和建议，并适用于参与漏洞处理的供应商。在接收漏洞报告和披露报告之间发生的其他相关活动在 `ISO/IEC\
  \ 30111` 中描述。†\n\n### 2.4.5 关键成功因素](#04-9781003002451_contents.xhtml#chap2_4_5)\n\
  \n#### 2.4.5.1 外部漏洞披露响应流程\n\n在 `SDL` 周期的发布后阶段，拥有一个定义且记录良好的外部漏洞披露响应流程至关重要。应该明确识别利益相关者，并创建责任分配或\
  \ `RACI` 矩阵。最重要的是，应仅有一个团队负责与客户对接讨论漏洞和修复。所有其他团队和利益相关者都应与该团队合作，并确保没有其他通信渠道或向客户选择性地泄露信息。通常情况下，大客户或企业客户会获得优待，并获知中小企业无法获得的信息。这并不是良好的安全实践。漏洞信息应该向所有人披露，或者对无人披露。选择性披露不是一个好主意，它会偏袒客户，在某些情况下可能是违法的和/或违背对所有客户公平公正的原则。此外，将内部漏洞处理过程定义并规范为整体漏洞管理和修复计划的一部分也很重要。除了安全团队和外部研究人员外，产品服务的员工或内部客户通常也会发现安全问题并将其反馈给产品或运营团队。需要一个定义良好的流程，确保所有相关的安全漏洞都能捕获并进入修复队列。\n\
  \n#### 2.4.5.2 发布后认证\n\n产品发布后（或在云端部署）所需的相关的认证应在 `SDL` 周期的较早阶段被确定。认证要求应包含在安全和隐私需求中。这将防止在合规性审计认证期间出现任何追溯性或发现的问题。认证通常需要年度审计或监督审核。安全团队应与安全合规团队合作，确保满足所有相关的控制要求。\n\
  \n_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\n^(\\*)ISO®. (2018). `ISO/IEC 29147:2018` [ISO/IEC\
  \ 29147:20181—信息技术—安全技术—漏洞披露。检索自 `https://www.iso.org/standard/72311.html`](https://www.iso.org/standard/72311)^†ISO®.\
  \ (2018). `ISO/IEC 30111:2019` [ISO/IEC 30111:2019—信息技术—安全技术—漏洞处理过程。检索自 `https://www.iso.org/standard/53211.html`](https://www.iso.org/standard/53211)\n\
  \n#### 2.4.5.3 第三方评审\n\n第三方评审通常是关键。除了安全团队和外部研究人员外，产品服务的员工或内部客户通常也会发现安全问题并将其反馈给产品或运营团队。需要一个定义良好的流程，确保所有相关的安全漏洞都能捕获并进入修复队列。\n\
  \n#### 2.4.5.4 针对任何架构更改或代码复用的 SDLCycle\n\n除了安全团队和外部研究人员外，产品服务的员工或内部客户通常也会发现安全问题并将其反馈给产品或运营团队。需要一个定义良好的流程，确保所有相关的安全漏洞都能捕获并进入修复队列。\n\
  \n#### 2.4.5.5 针对遗留代码、并购及生命终止（EOL）产品的安全策略和流程\n\n遗留代码可能永远不会更新。除了安全团队和外部研究人员外，产品服务的员工或内部客户通常也会发现安全问题并将其反馈给产品或运营团队。需要一个定义良好的流程，确保所有相关的安全漏洞都能捕获并进入修复队列。\n\
  \n## 2.5 安全培训管理\n\n由于我们被要求用更少的资源完成更多的工作，系统中的漏洞产生率正在加快。在 `DevOps` 世界中，产品安全经理正苦恼于哪些方面的培训需要添加到他们现有的培训计划中。\n\
  \n\n\n\n\n## 配置管理\n\n在传统的软件开发世界中，配置（尤其是“生产”和“发布”）决定了你的成败，而在 DevOps 中，这种重要性更加剧增。遵守变更控制流程，特别是针对安全需求所需的代码变更，对于\
  \ DevOps 环境下 CI/CD 的成功至关重要。\n\nDevOps 的本质是不断变化的，随着它的持续演进，所需的培训也随之改变。标准的培训方法（如正式课程、导师指导、在线课程以及自学和研究）将保持不变，但培训需要不断演进。在管理你的教育和培训计划时，你应该考虑以下几点：\n\
  \n- 考虑到编码人员和安全从业人员的时间有限，且对数小时的培训课程容忍度较低，他们更倾向于 15 到 20 分钟或更短的“TED 式”短期培训，效果更好。\n\
  \n- 通常情况下，人们在学习某些知识并进行充分使用以使新技能完全融入时，整合技能的速度更快、更完整。在使用较短且集中的“TED 式”短期培训时，请确保学习者在每次课程之间有足够的练习时间。我们发现，对于编码人员来说，在课程中安全地实现涉及模式的算法，或对刚学的问题进行代码审查，能对新材料产生积极的强化。\n\
  \n- 通过外部供应商提供的正式内部培训课程，以及通过学习管理系统（`LMS`）提供的内部课程，都需要大量的时间、金钱和资源投入。你可能想尝试第三方供应商提供的基于\
  \ Web 的培训，这种培训不会与你的系统绑定，但可以根据你的计划进行定制，并提供评分和完成证明。一些较热门的方案提供不同等级的培训，例如黑带计划，以及针对开发者、安全专家和管理人员的各种培训路径和课程。\n\
  \n- 由各种专业组织提供的认证培训将确保你获得某些安全和开发专业领域的认证，这需要成功通过考试、具备工作经验并持续教育。如果你的组织要求或重视某些产品和安全认证，那么你就有义务拨付培训预算，并为这些人员分配时间参加持续教育以维护这些认证。\n\
  \n- 有许多成熟的安全会议，提供应用安全或产品安全分会。现在已经存在专注于 DevSecOps 的会议，且 DevSecOps 分会也日益增加，这将为你的团队提供更具针对性和相关性的培训。\n\
  \n- 导师（如高级安全架构师、首席工程师和解决特定编码挑战的专家）可以通过创建短视频来提供帮助，这些视频对特定团队、个人或整个组织都有益。这些视频可以用于针对涵盖主题的专题会议，或在需要时链接到内部\
  \ Web 页面供个人使用。当这些视频用于描述如何克服你组织特定的敏感技术或安全问题时，效果会非常成功。这比第三方提供的专业培训更相关性，并限制了组织外敏感知识产权（IP）的暴露。当一个团队解决的问题被工程组内的多个团队可以使用时，这也会很有用。它对于你所工作的环境具有相关性，且与时同步，并适用于你的工作环境。\n\
  \n- 只要开发路径上的成员有可以可以教的内容，就必须鼓励他们这样做。教学可以巩固我们学到的知识，我们必须想出解释的方法。让教学预期成为你开发战略的一部分。教学、分享和指导应成为生活的一部分。\n\
  \n- 与你的安全产品谈判培训包，以便在内部培训你的团队。如果你有全球化团队，还可以节省现场培训所需的旅行费用。当然，内部网络研讨会更便宜，但有时提供面对面的培训具有其他的组织价值。\n\
  \n- 除非团队成员绝对需要参加会议进行演讲、学习新技能，或与那些成功实施或使用某种工具或流程的人建立联系，否则请尝试将用于培训的会议限制在每年两次。\n\n\
  - 网站、博客、视频和在线文档对于跟踪 DevSecOps 的最新趋势非常有帮助。\n\n- 不要忘记通过纸质书籍和行业白皮书学习的老派方法。虽然纸质书通常很贵，但你可以利用许多大型公司已签约的数字书籍供应商来节省大量资金。电子书订阅服务通常拥有大量的数字格式技术书籍，对读者来说具有显著的成本效益。在规模较大的开发群体中，这将为你的开发和安全组织节省大量资金。\n\
  \n- 如果你有一个大型 IT 部门，他们可能会有强制性信息安全培训预算。你可能与 IT 部门分担内部课程费用，因为应用安全课程通常作为供应商可用课程的一部分提供的。他们可以将此培训课程加入其课程中供工程团队共享，从而显著降低开发和安全团队的成本。\n\
  \n- 不要忽视在当地大学、远程学习或通过专业组织提供的教育课程。\n\n- 对于通常被认为是被动的安全培训，“夺旗赛”（`CTF`）竞赛通过将培训游戏化，为网络安全培训和模拟提供了新方法，在保持参赛者投入的同时传授真实技能。可以在组织内部使用，或者你的团队也可以参加由许多供应商和会议提供的\
  \ CTF 及其他类似的竞赛。\n\n\n\n对于软件开发公司而言，软件安全不再是一个事后考虑的问题，而是一项董事会级别的关注事项。当代码中的安全漏洞在产品发布后被发现并利用时，它可能会导致人员失去工作。然而，仅仅投入大量资金用于安全并不是解决方案，也无法确保组织获得更高的安全性。明智、高效且适当的支出才是真正的解决方案，并能最大化投资回报率（ROI）。这显然包含了安全技术以及运行这些技术的人员，以及对当前安全开发实践和基础设施优劣势的识别，以及安全需要改进之处。正确地管理你的安全预算将决定采取最具成本效益的方法。你预算中的某些项目可能包括安全软件、硬件、教育与培训、人员、客户合同或监管要求所需的外部审计、第三方服务以及咨询顾问。\n\
  \n由于安全团队与 DevOps 团队之间长期存在的摩擦，可能会出现预算分配上的斗争。安全团队通常认为，人员发布可能不安全的代码会给组织带来风险；而 DevOps\
  \ 团队则认为安全实践和介入是创新的阻碍。正如之前讨论的，`DevSecOps` 的目标之一是通过更好的协同与协作来建立共识，以消除这种误解以及随之而来的摩擦。除非你处于一个安全已经真正内生的非常成熟的\
  \ DevOps 组织中，否则请意识到这些观念可能仍然存在，并在你谈判安全预算时需要解决它们。还有某些情况，是从另一公司聘用了执行官或其他高级领导，而他们原公司的\
  \ DevOps/DevSecOps 组织和关系不够成熟。如果该人员参与了预算谈判，你或你的上级可能需要对他们进行一些教育说明。\n\n## 2.6.1 准备和传达预算信息\n\
  \n与安全实践人员和开发人员的谈判通常与 CFO 及其财务团队以及其他非工程业务高管的完全不同。这要求在你的预算提案中将业务驱动因素作为组成部分。为了优化你简练传达信息的能力，一个将安全收益转化为业务价值信息的模型将帮助你识别业务驱动因素。`Gartner\
  \ 的 4I 模型` 描述了四个维度，通过这些维度，可以对投资战略性信息安全活动的业务价值进行捕捉、总结并以简明的格式进行沟通：\n\n- **投资（Investment）**：捕捉预期收益——其价值通常可以表述为预期财务回报、品牌提升、竞争差异化、未来的灵活性、组织适应性等。\n\
  - **完整性（Integrity）**：强调日常业务运营可靠性和可用性的影响——其收益体现为业务信息和流程在机密性、可用性和准确性的持续改进。\n- **保险与保证（Insurance\
  \ and assurance）**：解决风险管理的收益——这些源于对组织所面临的信息风险因素洞察增加，从而产生更有效且适当的风险管理活动。风险管理选项包括接受、规避、转移、缓解或忽略已评估的风险。\n\
  - **赔偿（Indemnity）**：强调限制监管和利益相关者敞口所带来的合规收益——这源于意识的提高、责任的增强、利益相关者的支持以及合规性的提升。\n\n\
  Scholtz, T. (2016). *Articulating the Business Value of Information Security.* Resource\
  \ Report—ID Number: G00141091. Stamford (CT): Gartner Inc.\n\n安全策略、计划以及持续和记录的改进执行必须支持业务价值预期和战略。如果不是，安全预算的批准将面临风险。\n\
  \n## 2.6.2 准备预算时需要考虑的其他事项\n\n根据定义，`DevSecOps` 让安全团队在开发和运营团队中拥有一席之地，以确保安全被构建到 DevOps\
  \ 项目中。`DevSecOps` 需要考虑的不仅仅选择正确的安全工具。它关乎建立一种文化，从开发项目开始，安全既是优先事项，也是共同的责任。任何有助于提供这些需求的都应纳入安全预算的考虑。在预算过程中需要考虑的一些关键点包括：\n\
  \n- 一些遗留系统无法很好帮助你的开发团队发现问题，无法有效提供防御当今先进复杂威胁的解决方案，也无法适应 DevOps、`CI/CD` 和敏捷工作环境的快速且持续的节奏。简而言之，它们对于新的开发方法或最佳实践已不再适用。\n\
  - 环境中拥有过多的安全工具会导致不必要的工作和成本、数据重复、开发团队对你信誉的质疑，在某些情况下甚至会导致灾难。在预算中加入额外的解决方案之前，必须对已有的安全工具进行尽职调查。遗留安全工具需要进行修改或移除，并评估其是否与现有工具具有功能重叠，或者是否需要新工具来填补空白。在替换或整合工具之前，你必须了解已经部署并使用了哪些安全工具，以及它们提供的功能。一旦了解了它们的有效性，就可以尽可能进行整合，从而释放预算用于其他需求。在通用\
  \ `SDL`（第三章）中，我们将引用来自 `Sonatype™` 的 DevSecOps 参考架构，该架构将许多安全工具置于假设的链链环境中。\n- 与安全工具一样，尽量减少使用的供应商数量。这包括工具和专业服务的供应商。并不是越多越好。最重要的是管理资源和预算的能力、供应商工具的质量以及提供专业服务人员的能力。\n\
  - 在 DevOps 世界中评估和辩护安全预算时，说明提议的工具、人员和服务将如何推动 DevOps 环境的安全和社会文化变革，这有助于在谈判过程中向他人推销你的\
  \ ROI。\n- 在敏捷环境中，与客户有非常紧密的联系。客户能够看到他们需要的价值，因为他们能够评估并影响运行中的软件。展示安全预算中的内容如何对客户满意度产生积极影响，可以是一个巨大的预算卖点。\n\
  - 我在上一节中强调了一些可以减少培训和教育成本的方法。在评估培训服务需求和辩护教育培训预算时，请记住这些点。\n\n\n\n\n- 随着安全在 DevOps\
  \ 中向左移动，DevSecOps 促成了开发与安全的结合，以降低风险。尽管开发者似乎仍然不愿承担将安全整合到其流程中的成本，但安全预算也应该向左移动，以便开发部门能够投入安全工作。\n\
  - 非技术高管可能不了解你的环境，但他们很可能理解法规和合规要求。当你的环境中存在这些要求且你的团队是合规流程的一部分时，请以此作为预算申请的筹码。\n- 如果你的产品或新功能将在云端托管或正在云端，则必须考虑托管成本。\n\
  \n## 2.7 安全治理、风险管理与合规 (GRC) 管理\n\n治理、风险和合规（GRC）管理必须始终参与到软件开发过程中；否则，发布的产品将产生责任，这些责任将转嫁给公司、其客户和股东。GRC\
  \ 指所有整合了性能、风险和合规活动治理、管理和保证能力的能力。DevOps 中 GRC 部署的一个常见盲点是 `SDLC`。虽然标准的 GRC 方法有改进空间来补充\
  \ DevSecOps 和 DevOps 概念，但自动化工具以及适当的流程和程序正朝着这一方向发展。将 GRC 要求（包括安全要求）有效地整合到所有 DevOps\
  \ 自动化和手动流程中是至关重要的，这当然将包含整个 `SDLC`，理想情况下是构建在 `SDL` 之中。这将产生成功通过审计并规避监管罚款的能力。\n\n为了让\
  \ GRC 成为 DevOps 的推动者而非障碍，它必须能够适应 DevOps 团队快速节奏和高度敏捷（Agile）的特性。相反，DevOps 团队必须支持治理，因为法规不断变化和演变，新版本要么在流水线中，要么将在不久的将来随着新的合规标准引入。这要求法律和合规团队与开发者紧密合作，设计并实施满足风险点和控制点的变更。这需要法律和合规团队提供或协调意识和培训，以便开发者能够学习专门管理其特定行业的规则和法律，并协作制定如何实施相关的控制点和软件元素，以确保合规。这通常需要打破过去存在于安全领域的同样的组织沟通孤岛。如果\
  \ DevOps 团队在 GRC 方面接受了适当培训并获得正确技术的赋能，他们将在技术漏洞和威胁管理方面成为真正的资产。有效地结合安全和其他 GRC 措施，并尽可能将它们自动化并到开发和运营流程中，可以使你的组织真正获得安全和\
  \ GRC 的最大收益。\n\n在我们的项目中，James 和 Brook 使用了一项轻量级治理技术，这种技术培养了个人责任感，同时也提供了合理的治理，以确保团队确实在执行\
  \ `SDL`。我们没有采用手动的、面对面的专家委员会，而是通过对任务结果进行同级+高级别的评审来成功完成 `SDL` 的治理。这在治理 `SDL` 中需要大量经验才能执行良好的部分（例如威胁模型）时特别为有效。我们在`第\
  \ 4 章节` 中介绍了我们目前的方法，该章节专门介绍威胁建模和安全设计。（同级评审和升级模型已在《Securing Systems》(2015) [*] 和《Secrets\
  \ of a Cyber Security Architect》(2019) [†] 中讨论过。）\n\n另一个对 GRC 和安全都至关重要的领域是我们所谓的“后果管理”。对于违反组织强制要求的故意和无误违规行为，都必须有相应的后果，并识别出纠正措施以确保不再再次发生。这些后果的严重程度将取决于对公司造成的潜在或实际损害，以及违规行为是否为故意的。\n\
  \n---\n\n[*]S Schoenfield, B. (2015). “12.2 关于治理的一些思考，”第 12 章. `Securing Systems.`\
  \ Boca Raton (FL): CRC Press/Taylor & Francis Group, pp. 348-350.\n\n[†]S Schoenfield,\
  \ B. (2019). “4.3.1 敏捷治理，”第 4 章 `Secrets of a Cyber Security Architect.` Boca Raton\
  \ (FL): Auerbach Publications/Taylor & Francis Group, pp. 90-92.\n\n除了审计在进行内部审计或引入第三方审计以确保符合监管要求和标准以及满足客户合同要求的作用外，你还可以利用审计来帮助推动文化变革。当组织遇到改变产品以满足监管或客户安全需求，或遇到支持\
  \ GRC 和安全的组织变革阻同时，可以这样做。鉴于审计部门通常向董事会报告，这通常会解决问题。\n\n请记住，你可以继承客户的安全要求。这对于金融和政府客户来说尤其如此。当营销和销售开始向这类客户推销你的产品时，需要从业务和资源的角度考虑这一点。例如，如果你的公司决定接受一个要求你获得\
  \ `FedRAMP` [*] 认证的客户，可能会产生大量的开销，以确保你能满足诸如基础设施、消除共享环境的能力、人员国籍和许可要求、特定的软件和物理安全要求以及\
  \ SLA 要求。`RAMP` 代表联邦风险授权管理计划，对于联邦机构在低、中、高风险水平下的云部署和服务模型是强制性的。\n\n`SDL` 以及相关工具在过去几年一直支持\
  \ GRC 合规检查，但它一直是一个小市场，随着 DevOps 的出现开始快速扩张。GRC 收集、合规、培训和管理钩子现在已嵌入到最流行的 `SDLC` 框架工具中。\n\
  \n自动化工具可以帮助你实现并维护符合标准的合规。这些工具提供了一个主动协作的平台，可以有效整合工具、流程和技术进行合规报告；设置 `HITRUST`、`HIPAA`\
  \ 和 `PCI` 框架的合规阈值；并加强改进对新变化或风险的监管合规响应。[†]\n\n\n\n\n\n自动化特别关注的一个领域是应用安全风险威胁管理（ASTRM），它本质上是\
  \ DevOps 的 GRC（治理、风险管理与合规）。ASRT 补充但不替代 `SAST`、`DAST` 和交互式应用安全测试 (`IAST`)。结合良好的安全意识培训基础，ASRT\
  \ 能够让团队系统地构建和维护安全软件。ASRT 解决方案具有四大主要能力：威胁建模、需求生成、应用生命周期管理 (`ALM`) 集成以及测试集成与聚合。ASRT\
  \ 供应商尚仍在成熟阶段，DevOps 环境中的 GRC 和安全从业人员应密切关注他们如何管理 `GDPR` 和 `NIST` 等适用框架。\n\n自动化另一个关注的领域是配置管理。配置管理系统能够让你更高效、有效地配置、更新和修补系统。它们解决\
  \ GRC 挑战的能力往往被忽视。组织有一系列必须遵守的策略，其中包括组织应如何符合法律要求以及相关的法规或标准。运行在服务器上并跨网络访问数据的应用程序创建并读取信息，这些信息可用于识别这些这些组件之间的连接，以便更好地理解整体环境，并利用这些信息解决\
  \ GRC 挑战，例如满足特定的合规标准，例如金融控制系统的支付卡行业标准 (`PCI`) 和数据安全标准 (`DSS`)。配置管理数据库 (`CMDB`) 中生成的资产发现信息包含了关于硬件和软件所有元素的数据，使管理员能够搜索模式和使用情况，这对于应对\
  \ GRC 挑战也有帮助。这是 GRC 和安全从业人员需要关注的另一个领域。\n\n***\n\n*   U.S. Government. (2020). FedRAMP\
  \ Website.检索自 [`www.fedramp.gov`](https://www.fedramp.gov)\n*   Tauruseer. (2020).\
  \ “审计——自动化合规至监管标准。”检索自 [`www.tauruseer.com/why-tauruseer/unite-devsecops-teams`](https://www.tauruseer.com)\n\
  *   Security Compass. (2020). “引入应用安全需求与威胁管理 (ASRTM)”。检索自 [`resources.securitycompass.com/blog/introducing-application-security\
  \ -requirements-and-threat-management-asrtm-2`](https://www.resources.securitycompass.com)\n\
  \nGRC、法律和安全团队将紧密合作，以确保 DevOps 安全策略的创建、更新和合规。软件安全策略的目的是定义需要保护的内容以及如何进行保护，包括审查并纳入\
  \ `SDL` 之外可能影响开发过程的策略。这些可能包括：\n\n### 2.7.1 SDL 对相关法规、认证和框架的覆盖\n\n`SDL` 早期成功的一个关键标准是是否已经识别了产品（或库）的所有法规、合规框架和认证。这一成功因素取决于对产品目标的理解。人们很容易很容易犯下这样的错误，认为某些法规并不适用，因为它们的用例并无效。然而，客户对此此往往有不同的看法。客户使用的用于与其他客户交互的云产品，从一个角度来看可能需要符合\
  \ `HIPAA`。但是，对于客户来说，至关重要的是这个产品即使不符合 `HIPAA`，至少至少不要产生可能导致不合规的问题。\n\n近 30 年来，Brook\
  \ 一直经常提醒我们，任何一个被用户发现稍微有一点用的软件，都会被用于软件制作者从未想象过的任务。在深思考用例时，不要排除那些想象性的用途，否则也会排除了潜在的客户。合规框架是另一个需要注意的方面。取决于产品的使用方式（内部还是云端），客户会有不同的组合预期。如果客户正在寻求\
  \ `ISO 27001` 认证并在云环境中使用你的产品，他们将期望一个可证明且可验证的操作和产品安全态势。如果客户使用信用卡为你的服务付费，那么不仅是他们，你的环境也可能受到\
  \ `PCI` 标准的监管。最后，很多时候在涵盖法规、合规框架和认证时，安全和开发团队未能仔细查看依赖项。例如，如果产品需要符合联邦信息处理标准 (`FIPS`)，使用开源库将如何影响合规性？如果产品需要获得\
  \ A 认证，依赖软件是否会成或或败这一认证？这些问题需要仔细考虑，以防止未来的“救火”。\n\n\n\n\n\n### 2.7.2 第三方评审\n\n在过去的几年里，软件供应商的客户越来越多地要求独立审计，以验证他们已购买或正在评估购买的软件应用程序的安全性和质量。过去几年中，软件漏洞越来越多地与备受关注的大数据泄露事件联系在一起，这导致更多客户要求独立且可见的证明，以确保他们所购买的软件是安全的。这无疑为开发软件的公司施加了压力，使其确保将安全的软件开发流程构建到\
  \ `SDLC` 中，以避免在发布后才发现漏洞——这种发现成本极其昂昂，而且通常是软件安全计划不成熟、低效或不存在的迹象。由于发布后代码中存在大量本应在开发期间被捕获的安全漏洞和隐私问题，对发布后或临近发布的代码进行第三方评估已成为行业常态，无论生产该软件的公司是否具有产出安全代码的声誉。在某些情况下，这是潜在或当前客户的要求；而在另一些情况下，则是由编写代码的公司主动进行的。\n\
  \n即使对于拥有优秀软件安全计划的公司，由于各种原因，软件应用程序在长时间内也可能交替符合或不符合政策或监管要求。例如，应用程序新版本中的新功能或用例可能会引入新的漏洞或攻击面，导致应用程序不再符合规定。此外，这些要求可能会随时间推而变化。许多公司使用第三方代码评审来帮助识别这些情况，而不是消耗内部团队有限的资源。\n\
  \n第三方测试应该包括整个技术栈的测试，而不只是你的产品。这意味着要执行前面的章节概述的测试，还要进行持续的发布后测试。至少，发布后测试应包括年度渗透（pen）测试（针对应用程序和软件技术栈）。初始发布后发布的任何新代码都应遵循前几个章节概述的\
  \ `SDL` 要求。\n\n最大的挑战是以及时且具有成本效益的方式完成这些工作，同时在此过程中保护源代码和其他知识产权。第三方测试的某些选择包括以下：\n\n\
  1.  **将源代码交给第三方进行检查。** 对于那些想要保护软件开发组织所拥有的最宝贵知识产权——源代码的人来说，这不是一个可行的方案。\n\n2.  **委托手动渗透测试服务，这些服务还可以对每个新版本进行深度的代码和软件架构设计评审。**\
  \ 为避免源代码脱离开发公司的控制的风险，必须要求承包商在受控环境中工作，并签署特殊的保密协议和遵循特定的指南。这些指南通常包括源代码保护策略和知识产权保护指南。这种方法的替代方案是雇佣仅使用需要暴露二进制代码的工具的公司。在这种情况下，承包商在受攻击的相同级别（即二进制文件）对应用程序进行检查，并确保检测到所有威胁。这种测试可以作为一种服务在现场或远程进行。\n\
  \n3.  **购买、安装并培训开发团队使用本地工具，并作为低级软件安全架构师担任软件安全组的延伸，进行软件安全架构评审的“人因素”部分。** 然后邀请审计师进入你的组织记录你们的流程。许多成熟的软件安全组织都已这样做。像书中描述的那种成熟的软件安全计划将有助于扩大规模，并减少完成这项工作对额外人手的需求。将此构建到你的\
  \ `SDL/SDLC` 过程中是一项具有成本效益、高效且易于管理的方法。\n\n4.  **要求应用程序中的第三方代码供应商执行同样的操作。** 在当今的软件开发环境中，大多数软件开发组织使用从其他开发的代码，无论是商业现货（COTS）还是开源软件。与内部开发的软件一样，第三方应根据软件应用程序所有者的要求准备证明报告，这可能包括攻击面评审；加密学评审；架构风险分析；针对特定技术的安全测试；如果源代码不可用则进行二进制分析；如果可用则进行源代码分析；除了常规渗透测试程序外，还包括模糊测试。\n\
  \n第三方评审通常对于向最终用户和客户证明“安全性”至关重要。软件团队应该建立一个首选供应商列表，并对这些供应商的技能以及处理敏感信息的能力进行审查。由于这些供应商将处理敏感的安全信息，注意他们是否使用全磁盘加密、是否进行安全通信、是否在测试结束后立即处理任何客户数据等是非常关重要的。每当需要安全测试时，都应选择这些供应商之一进行测试。对整个软件技术栈和产品组合的安全性测试应至少每年执行一次。\n\
  \n### 2.7.3 发布后认证\n\n产品发布后（或部署在云端）所需的的相关认证应在 `SDL` 周期的早期阶段之一中识别出来。认证的要求应包含在安全和隐私要求中。这将防止在认证审计期间出现任何补救或发现的问题。认证通常需要年度审计或跟踪审计。安全团队应与安全合规团队合作，以确保满足所有控制要求。\n\
  \n在产品发布后，软件开发团队可能会面临许多关注安全的认证，这些是由于各种原因作为要求加入的，而不是在开发过程中加入的。这些原因可能包括在设计和开发期间未计划在行业或政府部门使用；软件的新用途；以及在发布之前不存在的新政府、国家、地区、业务或行业部门或监管要求。在发布前不存在的发布后认证要求是可以原谅的错误，但错过了当前要求且在\
  \ `SDL` 早期错过的要求是不允许的。要避免不符合开发软件所需的认证要求，需要公司内部有一个专门负责遵循软件使用认证和其他要求（包括隐私要求）的资源，或者一个在该领域拥有经验的个人或组织。随着全球此类认证和要求的数量迅速增加，这变得特别具有挑战性。\n\
  \n### 2.7.4 隐私\n\n\n\n\n\n更严格的法规、增加的责任以及公众意识的提高，意味着保护个人身份信息（`PII`）不再是一种奢侈，而是一项要求和优先事项。如果你的软件缺乏保护\
  \ `PII` 所需的安全性，你的组织将面临巨额罚款、昂贵的诉讼以及公众信任的风险，而这种损害可能永远无法恢复。法规在不同地区之间也存在显著差异，这增加了在数据整个生命周期内确保合规的复杂性。而且某些法规可能会产生深远的影响。\n\
  \n例如，《通用数据保护条例》（`GDPR`）于 2018 年 5 月在欧盟（`EU`）生效，在过去的两年里，业界现在才开始感受到它的全面影响。自 2018 年以来，已报告了大量数据泄露事件。未能遵守\
  \ `GDPR` 的组织可能面临严厉的处罚。根据 `GDPR`，罚款分为两个等级。第一级最高`€10,000,000`（1000 万欧元）或公司上一财年全球年度营业额的\
  \ `2%`，以较高者为准。第二级最高`€20,000,000`（2000 万欧元）或公司上一财年全球年度营业额的 `4%`，以较高者为准。潜在的罚款金额巨大，为公司确保遵守\
  \ `GDPR` 敲警钟。例如，Google 在 2019 年 1 月因违反 `GDPR` 被罚款 `€50,000,000`，占了 `GDPR` 实施第一年所收罚款的大部分。`GDPR`\
  \ 要求组织在发现泄露后 72 小时内报告。该法规更清晰地定义了什么是受保护的数据，为个人用户对其数据提供了更大的控制权，并规定了组织如何使用这些数据。`GDPR`\
  \ 还会影响与欧盟有直接或间接业务关系的欧盟境外组织，影响其运营、工作负载和数据保护策略，无论这些数据存储何处。\n\n`GDPR` 的强制后果导致全球涌现出许多与其他隐私相关的监管要求和地区法律，定义了用户保护和企业责任。例如，《加州消费者隐私法案》（`CCPA`）是美国第一部全面的隐私法。`CCPA`\
  \ 还提供了私人诉讼权，但仅限于数据泄露。在私人诉讼权下，每个消费者每次事件的损害赔偿在 `$100` 到 `$750` 之间。`CCPA` 于 2020 年\
  \ 1 月 1 日生效。然而，加州总检察长（`AG`）的执法从 2020 年 7 月 1 日开始。\n\n与安全性一样，隐私必须构建到开发过程中，确保数据在 `DevOps`\
  \ 过程的所有阶段都得到保护。最好的方法是从一开始就将隐私构建到应用程序交付流水线中。在许多情况下，隐私所需的控制也将是安全控制。\n\n由于在软件中构建隐私需要规划、结构和设计，因此隐私必须被视为与\
  \ `SDL` 设计活动并行的评估。威胁模型将同时突出那些破坏安全并损害资产的攻击，以及破坏隐私要求的攻击。因此，隐私需求是威胁建模的输出结果之一。在`第 4\
  \ 章`中，我们将扩展对安全设计和威胁建模的讨论，包括使用威胁模型攻击场景来驱动隐私需求，因为它们与安全有关。（还有其他与安全相关的隐私需求。隐私不能仅仅局限于其安全元素。）\n\
  \n***\n\n[^] Sheldon, R. (2019). “Redgate Hub: Introduction to DevOps: Security,\
  \ Privacy, and Compliance.” Retrieved from [`www.red-gate.com/simple-talk/sysadmin/devops/introduction-to-devops-security-privacy-and-compliance/`](https://www.red-gate.com)\n\
  [^†] GDPR Associates. (2020). “GDPR Fines.” Retrieved from [`www.gdpr.associates/data-breach-penalties/`](https://www.gdpr.associates)\n\
  [^‡] msbiinfo.com. (2019). “Introduction to DevOps: Security, Privacy, and Compliance.”\
  \ Retrieved from [`www.msbiinfo.com/2019/09/introduction-to-devops-security-privacy.html`](http://www.msbiinfo.com)\n\
  [^§] Sheldon, R. (2019). “Redgate Hub: Introduction to DevOps: Security, Privacy,\
  \ and Compliance.”\n[^¶] Microsoft. (2020). “California Consumer Privacy Act (CCPA).”\n\
  \n保护用户隐私是 `SDL` 的另一个重要组成部分，在所有阶段都应被视为极其重要的系统设计原则。正如安全性一样，隐私的失败会导致信任的侵蚀。随着媒体上出现越来越多未经授权访问客户个人信息的案例，对软件和系统的信任正在恶化。此外，最近许多隐私法律和法规（如\
  \ `GDPR` 和《加州消费者隐私法案》（`CCPA`））已增加了将隐私纳入软件设计和开发的重要性。与安全性一样，对于已经过了开发生命周期的软件，进行更改可能非常昂贵；将隐私保护方法论和技术集成到\
  \ `SDLC` 的适当阶段，以保护个人隐私和 `PII` 数据，要廉价得多。微软 `SDL` 中包含的一些关键隐私设计原则包括：能够对收集、存储或共享的数据提供适当通知，以便用户对个人信息做出明智决策；启用用户策略和控制；最小化数据收集和敏感性，以及对数据存储和传输的保护。\n\
  \n#### 2.7.4.1 隐私影响评估（`PIA`）计划启动\n\n通过 `SDL` 实施最佳实践，将隐私保护构建到 `SDLC` 中是至关重要的。忽视用户的隐私顾虑可能会导致部署受阻、诉讼、负面媒体报道和不信任。\n\
  \n\n\n\n\n在州、联邦和国际等多个层面，隐私监管要求日益增多，这导致合规要求呈现出零散的状态，且违规行为将面临严厉的处罚。我们不会花费整章章节来讨论近期及即将推出的隐私要求及其各自的潜在影响，而是将讨论所需的最佳实践，以充分涵盖你在隐私、监管和政策合规方面可能面临的大多数问题。软件程序的设计目的是为了与用户的计算机集成，因此可能能够访问和存储个人信息。软件开发人员必须遵守与其软件设计的操作系统和平台相关的指南和隐私政策。底线是，当客户将敏感信息委托给贵公司时，每位员工都有义务保护这些信息。与安全问题一样，隐私违规会对客户对你的信任产生重大影响，这反过来会影响你公司的声誉以及你开发的软件的潜在收入。\n\
  \n## 隐私影响评估 (PIA)\n\n在开始开发隐私影响评估（`PIA`）之前，你需要评估哪些监管法规或政策适用于你正在开发的软件。在某些模型中，这被称为数据敏感性评估。由于大多数开发者没有法律背景，而监管人员通常不具备软件开发背景，理解围绕监管合规的问题可能会非常困难且令人沮丧。开发者往往很难完全理解法律所描述的语言和要求，而且确定明确的软件需求通常并非易事。为了成功地将法规转化为需求，有与与公司法律顾问以及任何可能聘请的外部法律隐私专家合作。如果你恰好有一个首席隐私官（`CPO`），这个人可以成为理想的伙伴，为你提供所需的资源和培训，以应对将隐私构建到\
  \ `SDL` 并最终落实到 `SDLC` 中的挑战。\n\n微软 SDL 详情可以访问：https://www.microsoft.com/en-us/securityengineering/sdl/practices#practice7。\n\
  \n在此阶段创建的 `PIA` 仅是初始系统规范和需求的初步版本，旨在指导开发者在开发的早期阶段评估隐私。为了简单起见，我们仅包含了隐私设计原则的需求分析和部分初始\
  \ `PIA` 分析。该阶段的 `PIA` 核心是对软件使用的或访问个人身份信息（`PII`）及个人信息的初步需求进行规划、文档编制和评估，包括或访问以下内容：\n\
  \n- **利益相关者教育。** 在安全评估（`AI`）发现和启动会议上，应让所有利益相关者接受隐私设计的“四个 C”教育（理解、意识、控制和同意）。架构师和开发者应该询问他们是否需要收集数据、是否有正当的业务需求，以及客户是否支持软件收集其\
  \ `PII` 的业务目的。\n- **额外的软件交互。** 外部系统进程、与新软件交互的其他系统，以及它们对 `PII`、个人信息和系统用户的使用。\n- **PII\
  \ 收集。** 收集 `PII` 的目的和要求。\n- **PII 存储留存。** 建议的个人信息保留期限以及这些长度的原因。\n- **访问。** 确定哪些实体将访问\
  \ `PII` 和个人信息，以及软件中职责/任务/角色/数据分离的初步设计。\n- **隐私管理工具。** 识别可能用于管理软件中及其所属解决方案中个人信息的隐私管理工具和系统流程。如果该软件将作为\
  \ SaaS 或云端解决方案的一部分，这一点尤为重要。\n- **安全防护措施。** 设置用于保护 `PII` 和个人信息的安全防护措施需求。这些防御将是威胁建模的自然结果，即谁将通过什么接口以及何种手段进行攻击——也就是说，威胁模型必须包含隐私保护需求。\n\
  - **数据完整性。** 确保 `PII` 和个人信息保持更新和准确。\n- **评估安全与隐私需求之间是否存在冲突。** 确保 `PII` 和个人信息更新准确。如果有，则需要在开发阶段进行处理和解决。这包括软件所需的隐私保护水平。\n\
  - **应用最小权限原则。** 本质上，这意味着访问限制在“知其”。对数据的访问应限制在具有正当业务目的的人员。此外，对于访问或传输数据的非用户（如管理员或数据库管理员），应仅提供实现其业务目的所需的最小数据。数据保护规定（包括保留和销毁要求）通常通过合同协议要求。\n\
  - **网站与网络服务。** 所有面向外部的网站都必须有指向隐私声明的链接。这包括收集 `PII` 的弹出窗口。只要可能，域名内的所有站点应使用相同的隐私声明。访问点的完整列表指向了所需的防御措施。\n\
  - **Cookie 的使用。** `PII` 和便于追踪的标识符可能作为小文件的形式存储在用户的计算机中。它们旨在持有特定客户端和网站的适量数据，并可以由 Web\
  \ 服务器或客户端计算机访问。Cookie 使用的隐私指南适用于本地存储的文件，允许服务器端连接存储和检索信息，包括 HTTP Cookie（例如 Web Cookie）和\
  \ Flash Cookie（例如 Flash 对象）。在会话 Cookie 能够满足目的的情况下，不得使用持久性 Cookie。持久性 Cookie 应在实现业务目的的最短时间内过期。存储在持久性\
  \ Cookie 中的 `PII` 必须加密。\n- **IP 地址。** 当数据通过网络传输时，客户的 IP 地址始终作为通信协议的一部分被发送。截至本文日期，关于\
  \ IP 地址是否属于 `PII` 仍有许多争议和讨论。如 GDPR 等隐私法规将 IP 地址定义为 `PII`，因为它是可以识别个人的数据点。隐私监管机构甚至讨论这一点是一个警告信号，表明我们可能需要考虑在可预见的未来此类信息归入\
  \ `PII` 类别的可能性。如果需要匿名，应避免将 IP 地址与 `PII` 存储在一起，以避免两者之间的关联。\n\n\n\n\n\n### 客户隐私通知\n\
  \n收集并传输用户数据的软件必须向客户提供并发布通知。这些也称为披露通知，必须告知用户软件将收集什么类型的信息以及如何使用这些信息。`GDPR` 要求提供退出机制（opt-out\
  \ clause），以允许用户在自意愿的情况下拒绝提供某些类型的个人信息。所需的通知类型和同意程度取决于所收集的用户数据类型及其使用方式。还必须向客户提供关于是否想要共享这些信息的选择。所有通知必须用清晰、易于阅读的语言编写。通知分为两种类型：显著的（prominent）和可发现的（discoverable）。\n\
  \n“显著通知”是旨在吸引客户注意，并邀请客户检查当前的隐私设置、了解更多候选项并做出选择的通知。`GDPR` 要求提供“显著通知”。“可发现的通知”是客户必须自行查找的通知。这可以通过在软件产品的帮助菜单中选择隐私声明链接，或通过在网站上找到并阅读隐私声明来实现。此类通知通常包括将存储的数据类型、使用方式、与谁共享；如何保护；可用的用户控制措施（包括当\
  \ `PII` 存储并可重用时的更新过程）；以及公司联系信息。\n\n如果你正在开发供另一公司使用或作为原始设备制造商（`OEM`）的产品，客户公司通常会有特定的隐私声明，第三方软件开发者必须包含这些声明。其他公司可能要求设计用于与其产品配合的软件包含隐私声明，告知用户其信息不会出售给其他公司或公开展示。软件开发者必须在隐私政策和通知中告知用户软件保护其个人信息的方法。正如我们在书中后部分讨论的，这可以通过有效的\
  \ `SSL certificate` 或使用其他安全和加密方法来实现。与隐私相关的其他领域一样，法规和其他要求是动态的，您应该咨询您的隐私专家或法律顾问，以获取针对软件的最新指导意见。\n\
  \n### 儿童隐私\n\n必须考虑儿童的隐私，因为他们可能缺乏判断力，无法理解在披露其 `PII` 时这种行为可能会给他们带来风险。随着社交软件中发现的协作和分享功能的出现，这一点变得尤为重要。通常会在产品、网站和\
  \ Web 服务中添加家长控制功能，以帮助保护儿童的隐私。必须特种努力确保父母保留对儿童是否可以披露 `PII` 的控制权。对于针对儿童和/或收集客户年龄的网站和\
  \ Web 服务，有许多隐私要求。该领域已有许多现有和即将推出的州、当地及国际要求。如果您的软件属于这一领域，请确保咨询您的隐私专家和/或公司法律顾问（或同等人员）。\n\
  \n### 第三方\n\n在评估隐私需求时，必须考虑两种类型的第三方。一类是获得授权代表公司行动，并根据公司的隐私规范使用数据。独立第三方遵循其自身的隐私规范，并将客户信息用于其自身目的，这需要一份规定数据保护要求的合同。这要求软件提供一种功能，让客户提供选择加入的同意（opt-in\
  \ consent）。在 `PII` 与独立第三方共享之前，客户必须提供选择加入的同意。如果 `PII` 是通过授权代表公司行动的第三方传输的，则仅需要“可发现的通知”。\n\
  \n### 用户控制\n\n用户控制赋予用户管理和控制其数据隐私以及更改设置的能力。这些控制措施应该是直观且易于发现的。数据可能存储在计算机上、Web 服务中或移动设备上。Web\
  \ 被用作 Web 服务的隐私。移动设备的隐私控制可以在设备本身上，也可以通过基于计算机的用户界面或链接到设备的网站进行。\n\n### 共享计算机上使用的软件所需的隐私控制\n\
  \n在家庭或小型办公室/家庭办公室（`SOHO`）环境中使用的软件通常由多个用户共享。设计用于此类环境且同样收集或存储 `PII` 的软件必须提供关于哪些用户可以访问数据的控制措施。这些控制措施可能包括严格的计算机/文件/文档访问控制以及文件权限或加密。控制措施还必须是默认设置，而不是选择加入。共享文件夹必须清晰地标记或高亮。\n\
  \n### 协作、分享和社交软件隐私功能\n\n这是一个具有非常复杂的领域，因为内容可以在社区之间共享，在某些情况下，可以在关联的社区成员以及共享的朋友或联系人之间共享。支持此类应用的软件应提供控制和通知，以帮助防止无意中向非预期受众共享\
  \ `PII`。\n\n### 安全\n\n当然，安全是本书的主题，也是隐私和质量的关键元素。安全需求将取决于收集的用户数据类型，以及数据是否将在本地存储、传输和/或远程存储。安全控制和措施的最终目标是保护\
  \ `PII` 免受丢失、误用、未经授权的访问、泄露、更改和破坏。控制措施不仅包括软件控制（如访问控制以及传输和存储中的加密），还包括物理安全、灾难恢复和审计。由于业务需要无法实施标准保护时（例如将\
  \ `PII` 作为唯一标识符，或用于路由的 `IP address` 或 `e-mail address`），可能需要补偿控制。\n\n### 隐私影响评分\n\
  \n隐私影响评分（`P1`、`P2` 或 `P3`）是 `Microsoft SDL` 中使用的一种实践。它从隐私角度衡量软件处理数据的敏感性。尽早意识到部署高隐私风险项目所需的所有步骤有助于您判断成本是否符合业务价值。隐私影响的一般定义如下：\n\
  \n ** **P1 高隐私风险**：存储或传输 `PII` 或错误报告、通过持续传输匿名数据监控用户、更改设置或文件类型关联或安装软件的功能、产品或服务。\n\
  - **P2 中等隐私风险**：功能、产品或服务中影响隐私的唯一行为是单次的、用户发起的匿名数据传输（例如，用户点击链接跳转到网站）。\n- **P3 低隐私风险**：功能、产品或服务中不存在影响隐私的行为。没有传输匿名或个人数据，没有在机器上存储\
  \ `PII`，没有代表用户更改设置，也没有安装软件。\n\n微软 开发的风险评估问卷和风险排名系统可以是评估风险并优先处理 `SDL` 中修复这些风险工作的绝佳工具。\n\
  \n总结来说，`PIA` 的目的是详细说明在您开发的软件中何时以及在何种程度上收集、存储或创建隐私信息。在发生重大决策或软件的用途和范围发生显著变化时，应继续审查并更新\
  \ `PIA`。\n\n\n\n\n\n`PIA` 可以在威胁建模开始之前进行。对于开发者来说，这样效率较低，因为他们必须对架构进行两次分析，且某些方面是重复的。如果让\
  \ `PIA` 和威胁模型作为一个单一活动启动效果会更好。架构理解、攻击面、攻击场景开发以及危害会影响所有资产（包括 `PII`）的安全性。`PIA` 保护需求是威胁模型的重要输入。而威胁模型则返回保护\
  \ `PII` 所需的安全控制措施。尽管这两个分析不能混淆，但它们是紧密配合的。隐私领域专家（`SMEs`）与威胁建模人员之间的通信是成功的必要条件。\n\n\
  ### 2.7.4.2 隐私实施评估\n\n务必确保你对遵守公司及外部隐私政策和实践所需的工作量估算尽可能准确。这将实现在未来节省大量成本。例如，如果隐私实践要求对所有\
  \ `PII` 数据进行加密，那么在设计阶段识别出这一需求至关重要。一旦软件进入执行和发布阶段，这样做的成本往往会高到无法接受。我们见过某些财富 500 强公司在服务包发布期间才做出此类决策。然而，到那时，准确修复问题将极其困难，而且非常昂贵。另一个例子是网络分段。在云/SaaS\
  \ 环境中，这是一个重要的决策。通常会有多个产品从这个共享环境中托管。如何最好保护一个产品免受另一个产品的影响是设计阶段的一个问题。\n\n有助于保护 `PII`\
  \ 数据的安全控制措施必须考虑数据保护的所有方面，包括但不限于访问控制、传输和存储中的数据加密、物理安全、灾难恢复和审计。在许多情况下，保护关键业务数据（包括机密和专有信息）免受泄露和丢失至关重要的安全控制措施，与保护客户和员工个人信息的措施是相同的，应尽可能利用这些措施。这只有在识别、理解并分类组织收集、存储或传输的\
  \ `PII` 数据之后才能被确定。\n\n### 2.7.4.3 最终隐私审查\n\n通常，在软件发布之前必须满足隐私需求。尽管在发布前必须完成最终安全审查，但如之前所述，安全异常表明，并非所有的安全问题都必须在发布前得到解决。隐私需求的验证通常与最终安全审查同步进行，且在许多情况下，现在已被视为同一流程的一部分。这要求处理在完成通用隐私问卷后发生的重大变更，例如收集不同的数据类型、实质性地更改通知语言或同意意样式，或识别出对隐私保护产生负面影响的新软件行为。这涉及审查软件是否存在在之前的隐私审查或作为最终安全审查的一部分识别出的任何相关变更或未解决问题。最终审查的特定隐私需求应包含以下内容：\n\
  \n_________________\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\nMicrosoft. (2020). “SDL\
  \ Phase 1: Requirements.” Retrieved from `https://docs.microsoft.com/en-us/previous-versions/windows/desktop/cc307412(v%3Dmsdn.10)`。\n\
  \n- 如果项目被确定为 `Pl`，则 `SDL team` 和 `privacy lead` 将决定是否需要隐私披露。如果 `privacy lead` 决定豁免，则不需要\
  \ `privacy disclosure`。\n- 如果项目被确定为 `P2`，则 `SDL team` 和 `privacy lead` 将决定是否需要隐私披露。如果\
  \ `privacy lead` 决定不需要，则进行 `privacy review` 是合适的。\n- 如果项目被确定为 `P3`，则 `SDL team`\
  \ 和 `privacy lead` 将决定是否需要隐私披露。如果没有，则没有识别出 `privacy requirements`，且隐私审查已完成。\n\n\
  ### 2.7.4.4 发布后隐私响应\n\n除了发布后可能发现的安全问题外，还可能发现潜在的隐私问题。根据我们的经验，隐私相关问题作为安全漏洞时不会得到太多关注，也没有专门的小组来处理此类问题。软件开发公司可能拥有\
  \ `CPO` 或等效人员（例如长期聘请的专门法律顾问），但大多数公司并没有，且理想情况下可能仅限于一个隐私支持专家。这需要 `PSIRT` 与公司的中央安全组以及隐私职能之间建立紧密的对齐和工作关系，无论后者是内部的还是外包的。发布后的隐私响应应该构建在\
  \ `PSIRT` 流程中，就像安全应该被构建在 `SDLC` 中一样。考虑到隐私问题或隐私控制漏洞的潜在法律性质，`privacy advisor` 应该为响应团队编写基础话术、响应程序和法律升级要求，供其使用。\n\
  \n- 隐私专家应直接参与所有属于前述 `Pl` 和 `P2` 别的事件。\n- 在 `SDL process` 期间，应识别出适用于发布后可能发现问题的额外开发、质量保证和安全资源。\n\
  - 隐私专家应参与任何发布后隐私事件问题的修复。\n\n_________________\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\\
  _\n\nMicrosoft Corporation. (2012). “Appendix C: SDL Privacy Questionnaire.” Available\
  \ at `http://msdn.microsoft.com/en-us/library/windows/desktop/cc307393.aspx`。\n\n\
  \n\n\n正如开尔文勋爵说：“如果你无法衡量它，就无法改进它。”这一格言在今天依然适用，因为它适用于产品安全，以及准确衡量软件开发组织安全态势的需求。具有有意义的安全指标至关重要，因为企业正努力应对监管和风险管理要求，日益收紧的安全预算需要精明的安全投资，而客户也要求证明安全和隐私是构建在产品之中的，而不是通过历史性的发布后修复来实现的。\n\
  \n指标跟踪就像是你的软件项目的一份保险单，也有助于管理针对漏洞的防护。正如我们反复提到的，在 `SDLC` 的后续阶段检测缺陷的成本，与在缺陷产生的 `SDLC`\
  \ 阶段检测到相同缺陷相比要高得多。指标可以追踪这些成本，并为整个 `SDL`/`SDLC` 过程中的各种投资回报率（ROI）计算提供极大帮助。在开发早期避免潜在的安全缺陷成本很低，特别是与在开发后期阶段花费该金额\
  \ 10、20、50 甚至 100 倍的成本相比。`Figure 2.6` 展示了作为 `SDL` 过程的一部分，在 `SDLC` 不同阶段修复缺陷成本的视觉化表示。有人认为，仅仅防止一两个缺陷上线，其价值就值得追踪指标的成本了。预见缺陷并修复它们的能力是衡量一个健康的软件安全计划的良好指标，但整个\
  \ `SDL`/`SDLC` 过程中的质量指标有助于管理并通常能避免过高的修复成本。\n\n`SDL` 的目标之一是通过多阶段过滤过程在整个过程中捕获缺陷，而不是通过单一的活动或时间点，从而最大限度地减少导致漏洞的剩余缺陷。每个缺陷移除活动都可以被看作是一个过滤器，可以移除一定比例的可能导致软件产品漏洞的缺陷。软件开发生命周期中的缺陷移除过滤器越多，软件产品发布时剩余的导致漏洞的缺陷就越少。更重要的是，对缺陷的早期测量使组织能够在\
  \ `SDLC` 早期采取纠正措施。每次移除缺陷时，都会对其进行测量。每个缺陷移除点都变成一个测量点。缺陷测量会导致比缺陷移除和预防更重要的结果：它告诉团队他们与目标相比进展如何，帮助他们决定是进入下一步，还是停止并采取纠正措施，并指明在何处改进他们的流程以实现目标。我们在\
  \ *Core Software Security* 中介绍的 `SDL` 模型侧重于在整个 `SDLC` 中过滤缺陷，特别强调我们模型中的 `S1——S3`\
  \ 阶段（参见 `Figure 2.7`）。\n\n安全指标可以是评估组织软件安全计划有效性的宝贵资源。有意义的指标可用于持续改进组织的软件安全计划。\n\n\n\
  \nDevOps 的核心组件之一是帮助组织实现业务目标。为了有效管理过程仍然需要团队级指标，但同时也需要组织层面的指标来证明你正在满足业务需求。这还要求你衡量的是“结果”（outcomes）而不仅仅是“产出”（outputs）。你必须展示投入的时间和执行的测试是否减少了漏洞。\n\
  \nDevOps 关注持续交付和尽可能快地发布代码，同时优化质量和应用程序性能。你实现这一目标的速度取决于团队的能力、产品类型以及风险容忍度。一个关键挑战是在确保性能和安全性的同时快速开发代码。除了上一节列出的指标外，还需要考虑的一些关键指标包括：\n\
  \n- **自动化测试通过率**：DevOps 高度依赖自动化，这不仅包括单元测试和功能测试，还包括安全性测试。该指标跟踪了自动化测试的运行情况。识别代码更改是否导致安全工具失效也具有价值，因为失败可能指向配置不当、缺乏对代码库和架构的调优，或者由于工具放置不当（针对预期任务使用了错误的工具）。\n\
  - **客户工单**：监控客户支持工单以获取反馈是非常重要的。在这些问题变成 PSIRT（产品安全应急响应小组）问题之前，这可以作为你尚未识别出的安全问题的良好指标。在某些情况下，他们识别出的应用程序质量和性能问题，可能是由于产品中的安全问题引起的。\n\
  - **缺陷逃逸率**：这将跟踪缺陷进入生产环境的频率。在 DevOps 中，你必须快速发布代码。这将告诉业务和你的团队，在软件进入生产环境之前发现软件安全缺陷的效果如何。\n\
  - **部署规模和频率**：在 DevOps 中，目标是尽可能频繁地进行小规模部署。规模越小，越容易测试和修复安全漏洞或缺陷。\n- **QA 部署**：在 DevOps\
  \ 环境中，QA（质量保证）的角色不再仅仅是检测缺陷，而是防止缺陷的发生。挑战在于尽且频繁地部署 QA，以确保有足够的时间测试安全漏洞，从而保持较低的缺陷逃逸率。\n\
  \n### 表 2.1 SDL 各阶段的指标\n\n| 阶段 | 指标 |\n| :--- | :--- |\n| 安全评估 (A1): SDL 活动与最佳实践\
  \ | 软件安全团队介入的时间（周） |\n| 参与 SDL 的利益相关者百分比 |\n| 映射到开发活动的 SDL 活动百分比 |\n| 安全目标达成率百分比\
  \ |\n| 架构 (A2): SDL 活动与最佳实践 | 业务威胁、技术威胁（映射到业务威胁）和威胁攻击者的列表 |\n| 此阶段后未满足的安全目标数量 |\n\
  | 符合公司（现有）策略的百分比 |\n| 软件的切入点数量（使用数据流图 [`DFDs`） |\n| 接受、缓解和容忍的风险（及威胁）百分比 |\n| 重新定义的初始软件需求百分比\
  \ |\n| 产品中计划的软件架构变更数量（重大的和次要变更） |\n| 根据安全需求需要的软件架构变更数量 |\n| 设计与开发 (A3): SDL 活动与最佳实践\
  \ | 威胁、概率和严重性 |\n| 符合公司（已更新）策略的百分比 |\n| 第 2 阶段对比第 3 阶段的合规百分比 |\n| 软件切入点（使用 DFDs）\
  \ |\n| 接受 vs. 缓解的风险百分比 |\n| 重新定义的初始软件需求百分比 |\n| 软件架构变更的百分比 |\n| 没有相应软件安全测试的 SDLC\
  \ 阶段百分比 |\n| 与隐私控制实现相关的软件组件百分比 |\n| 代码行数 |\n| 使用静态分析工具发现的安全缺陷数量 |\n| 使用静态分析工具发现的高风险缺陷数量\
  \ |\n| 缺陷密度（每 1000 行代码的安全问题数） |\n| 设计与开发 (A4): SDL 活动与最佳实践 | 符合公司（已更新）策略的百分比 — 第\
  \ 3 阶段对比第 4 阶段的合规百分比 |\n| 使用静态分析工具有效测试的代码行数 |\n| 通过静态分析工具发现的安全缺陷数量 |\n| 通过静态分析工具发现的高风险缺陷数量\
  \ |\n| 缺陷密度（每 1000 行代码的安全问题数） |\n| 通过静态分析、动态分析、手动代码审查、渗透测试和模糊测试发现的安全问题数量、类型和严重性\
  \ |\n| – 不同类型测试中发现的安全问题重叠情况 |\n| – 不同类型测试发现结果的严重性对比 |\n| – 发现结果与早期识别的威胁/风险的映射 |\n\
  | 已修复的安全发现数量 |\n| – 发现结果的严重性 |\n| – 修复发现花费的时间（约计小时） |\n| 未决的发现结果数量、类型和严重性 |\n| 安全安全测试计划的合规百分比\
  \ |\n| 执行的安全测试用例数量 |\n| – 安全测试用例执行的发现结果数量 |\n| – 执行的重测次数 |\n| 发布 (A5): SDL 活动与最佳实践\
  \ | 符合公司（已更新）策略的百分比 |\n| – 第 5 阶段对比第 4 阶段的合规百分比 |\n| 通过漏洞扫描和渗透测试发现的安全问题数量、类型和严重性\
  \ |\n| – 不同类型测试中发现的安全问题重叠情况 |\n| – 不同类型测试发现结果的严重性对比 |\n| – 发现结果与早期识别的威胁/风险的映射 |\n\
  | 已修复的安全发现数量（已更新） |\n| – 发现结果的严重性 |\n| – 修复发现花费的时间（约计小时） |\n| 未决的发现结果数量、类型和严重性（已更新）\
  \ |\n| 符合安全和隐私要求的百分比 |\n| 发布后支持 (PRSA1-5) | 响应外部披露漏洞的时间（小时） |\n| 外部披露过程每月全职员工（FTE）小时\
  \ |\n| 产品发布后的安全发现数量（按严重性排序） |\n| 每月客户报告的安全问题数量 |\n| SDL 活动中未识别的客户报告安全问题数量 |\n\n\
  *来源：* 改自 Ransome J. and Misra, A. (2014). *Core Software Security: Security at the\
  \ Source*. Boca Raton (FL): CRC Press/Taylor & Francis Group, pp. 356-358，经许可。\n\
  \n- **错误率**：这是质量和安全问题以及持续性能和运行问题的指标。错误率可能非常巨大，但关注它们并寻找峰值是非常重要的。良好理解并遵守异常处理最佳实践对于减少错误率至关重要。\n\
  - **安全承诺交付时间**：该指标衡量组织响应变化和交付业务价值的能力，即设计和交付请求的安全功能所需的时间。这还需要服务水平协议 (`SLA`）监控。安全团队需要了解销售、市场、法律等部门他们他们承诺了什么。通常，安全团队会有一套法律已同意的接受和拒绝的标准语言，例外情况将通过谈判解决。在承诺团队承担目前尚未的额外工作或合规要求时，必须考虑潜在的资源需求。某些承诺会导致严重的延迟在\n\
  \n\n\n\n\n- **平均检测时间 (MTTD):** 这显示了当问题发生时你识别这些问题的速度。在敏捷环境中，这些问题必须被快速修复。稳健的自动化应用程序监控将提高你检测这些问题的能力。\n\
  \n- **平均恢复时间 (MTTR):** 这将跟踪你从故障中恢复所需的时间。业务部门希望以业务工作小时而非时钟小时来衡量此指标。业务小时的 MTTR 衡量了实际业务影响，同时也评估了恢复工作的投入。建立稳健的自动化应用程序监控将优化你的发现能力和修复时间。此外，采用\
  \ A/B 测试组有助于在问题产生严重影响之前，快速识别并移除存在问题的发布版本。\n\n- **平均故障时间 (MTTF):** 多年来，这一直是安全团队的一个流行指标。Scrum\
  \ 的原则之一是失败是不可避免的，但必须从中吸取训。在 DevOps 环境中，要谨慎考虑优先考虑或使用此指标。这可能会分散你对实际上有助于缓解威胁的指标的注意力。\n\
  \n## 2.9 并购 (M&A) 管理\n\n为了保持竞争力，大多数公司都希望开发新产品并进入新市场，当无法利用现有资源做到这一点时，它们会寻求如并购（M&A）之类的替代方案。并购的发生有很多原因，但通常是由提高竞争力、盈利能力或其他公司及其产品其他价值的愿望驱动的。在软件世界中，这通常是你解决方案集或产品本身需要的一个功能。如果并购的主要重点是目标公司的软件，那么随收购而带来的人才将是一项奖励。并购活动从并购的初步讨论开始，一直持续到尽职调查阶段，直到将目标公司和/或被收购的技术整合到母公司中。过程中的努力程度和工作范围取决于投入的规模和复杂性。需要注意的是，并购并不总是包含目标公司的所有资源。它们可能包含一个软件产品的代码，或多个对收购公司具有吸引力和价值的技术或产品。\n\
  \n并购的尽职调查阶段至关重要，安全在帮助其成功方面起着至关的作用。如果软件是并购的一部分，将需要进行安全架构审查并使用自动化工具。这可以通过潜在收购方的软件安全人员或第三方来完成，取决于评估过程中施加的限制以及是否可以审查源代码。由于源代码的专有性质，大多数目标公司在并购评估过程中不允许审查其源代码。因此，需要一种能够通过静态二进制分析进行全面代码审查的自动化工具。这是通过在二进制级别扫描编译或“字节”代码完成的，而不是审查源代码，通常包括静态、动态和手动技术。\n\
  \nA/B 测试是一种在生产环境中同时运行多个竞争性软件版本的策略。虽然“A/B”可能意味着两个版本，但并没有实际的限制，特别是在今天的云扩展能力下：即多个软件版本。A/B\
  \ 测试通常通过 DevOps 部署链代码实现。这些测试在水平扩展的虚拟环境中受高度监控的子集中运行，同样通过 DevOps 代码技术。任何失败、用户困惑或其他异常都会导致其中一个子集测试失败，用户将自动转移到更成功或更稳定的软件版本。因此，在典型的云\
  \ A/B 测试中，用户影响被保持在最低，而软件实验可以被充分利用，以确定哪些更改应该保留，哪些应该被弃用。\n\n进行并购软件安全评估最好的检查清单可能可以在表\
  \ 1“软件保证 (SwA) 关注类别”和表 2“针对 GOTS（专有和开源）和定制软件的问题”中找到，这些源自卡内基·梅隆大学 US CERT 软件供应链风险管理与尽职调查、软件保证便携指南系列：收购与外包，第二卷，版本\
  \ 1.2，可以通过 `https://buildsecurityin.us-cert.gov/sites/default/files/DueDiligenceMWV12_01AM090909.pdf`\
  \ 访问。另一个相似且的资源是卡内基·梅隆大学软件工程研究所的工作论文《将 SQUARE 方法适用于安全需求工程的收购》，可以通过 `https://resources.sei.cmu.edu/library/asset-view.cfm?assetid=51609`\
  \ 访问。SQUARE 代表系统质量需求工程。这篇特定的论文描述了用于收购的 SQUARE 过程 (A-SQUARE) 安全需求工程，并针对不同的收购情况进行了调整。\n\
  \n软件安全评估员在并购安全审查期间应该记住的一些关键事项包括以下：\n\n1. 并购软件安全审查的意图不是侧重于消除目标软件的元素，而是评估由任何识别出的风险可能导致的任何业务风险。\n\
  2. 突出任何可能改变交易性质或对整合产生负面影响的内容。\n3. 寻找任何可能导致交易失败的因素（deal breaker）。\n\n### 2.9.1 开源并购考量\n\
  \n作为涉及软件的尽职调查过程的一部分，你将希望在没有任何法律影响的情况下购买它。作为收购团队，你应该检查贵公司对其软件中可能存在的任何开源组件的每个许可的合规情况。这包括他们是否对作为并购过程中收购的任何软件中的所有开源组件拥有清单，以及许可合规性验证和带有修复更新的漏洞管理。你不想继承已知的开源问题，例如丢失其专有权、违反许可条款、安全风险以及其他的专利影响。在完全了解所使用的许可以及安全和质量问题的存在之前，你不希望继续交易。\n\
  \n## 2.10 遗留代码管理\n\n\n\n\n\n尽管这些活动曾经可能被视为不必要的成本负担，但我们在模型中概述的最优活动和最佳实践，源于这样一种发现：安全并非一直是软件开发过程中的关键要素，且有时会导致安全漏洞和风险缓解成本，而这些成本可能与待开发软件的初始成本不相。\n\
  \n对遗留代码（legacy code）的接受是基于对预期的假设，即软件必须被证明在功能上是正确的且在操作上是行的。然而，当涉及到软件安全时，意外因素通常是漏洞的根源。这些安全漏洞不仅在财务上不可接受的，从运营、功能和整体风险的角度来看也是不可接受的。当软件支持嵌入式关键系统和应用时，这一点尤为真实，例如国家和区域基础设施、交通、国防、医疗和金融领域的应用。在这些应用中，意外的安全软件和系统漏洞相关的责任、成本、任务和业务影响被认为是不可接受的。\n\
  \n除非从安全角度对遗留软件的架构进行正确的评估和分析，否则无法预测更改的影响，也无法有效地实施更改。这就是为什么在遗留代码审查过程中必须遵循与 `SDL` 期间相同的测试和审查严谨性：以此作为缓解意外的手段。如果按照适当的流程和严谨性执行，这将极大地确保遗留代码与新代码之间安全代码实现的一性。\n\
