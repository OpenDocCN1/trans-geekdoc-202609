  \n网络战 (Cyber warfare)\n\n圣战者带来的威胁正在日益增加。在某种意义上，由于例如：[`mashable.com/2011/08`](http://mashable.com/2011/08)\n\
  \n网络战的定义由网络专家 William J. Lynn（美国国防部副部长）定义为网络空间中的攻击行为。\n\n为了应对这一威胁，美国国防部宣布了其正在采取的五项战略倡议。这里值得回顾：首先，将网络空间视为与陆、海、空、太空一样的一个作战领域。因此，“第五大领域”的战争被公认为是一个作战剧场。其次，演进新的防御概念以对抗网络攻击。这涉及采取四个基本步骤，如下：\n\
  \n1. 增强网络最佳实践以提高其网络安全。\n2. 威慑并减轻内部威胁，加强员工沟通、员工问责、内部监控和信息管理能力。\n3. 雇佣主动网络防御能力以防止网络和系统。\n\
  4. 开发新的防御概念和计算架构。\n\n第三项倡议是开始与其他美国政府部门、机构以及私营部门合作，以实现全政府的网络安全战略。第四项倡议是与美国盟友和国际伙伴建立强大的关系，以加强集体网络安全。最后，通过卓越的网络工作人员和快速的技术创新来利用国家的创造力。\n\
  \n与本书相关的，上述所有内容最需要注意的一点是第一步：承认为了提高网络安全的网络最佳实践，这当然包括正如书中描述的，通过在开发过程中构建安全性来保护核心。\n\
  \n强大的安全开发实践可以防御的网络战威胁包括 2007 年对爱沙尼亚的网络攻击以及 2008 年俄格冲突期间对格鲁吉亚资产的攻击。\n\n\n\n\n# 对爱沙尼亚的网络攻击\n\
  \n爱沙尼亚与俄罗斯之间有着长期（且不稳定）的关系。爱沙尼亚作为波罗的海国家之一，在 1940 年至 1991 年期间是苏联。爱沙尼亚于 2004 年加入北约。2007\
  \ 年，爱沙尼亚政府将“青铜士兵”——一座纪念苏联从纳粹德国手中解放爱沙尼亚的纪念碑——移到了另一个地方。这导致了爱沙尼亚俄语少数社区的骚乱，他们认为此举是进一步边缘化其族群认同的努力。与此同时，DDoS\
  \ 攻击开始针对该国的网络基础设施。攻击导致政府、银行和政治机构的网站关停。爱沙尼亚人指责俄罗斯发动网络战争，并考虑援引《北约条约》第 5 条，尽管他们最终没有选择这样做。应该注意的是，在这种情况下，网络战争可能导致更广泛的军事冲突——尽管我们目前可能还没有看到这种情况，但这仍然是一个现实的可能性。爱沙尼亚是第一个公开声称自己是网络战争受害的国家。\n\
  \n---\n\n* “美国国防部网络空间行动战略，”2011 年 7 月，第 3 页。\n\n# 2008 年格鲁吉亚俄冲突\n\n2008 年秋，俄罗斯与格鲁吉亚爆发南奥塞冲突。与此同时，针对格鲁吉亚资产的协同网络攻击也开始了。格鲁吉亚政府指责俄罗斯是这些攻击的幕后黑手（尽管克姆林林否认了这一点）。注意，这是网络战争首次配合军事战争。格鲁吉亚总统米哈尔·萨卡什维利的官方网站在俄罗斯武装干预开始之前已被攻击者控制，其他政府机构的网站也是如此。商业网站也被劫持。访问格鲁吉亚网站流量通过俄罗斯和土耳其路由，那里的流量被拦截，导致人们无法访问。当德国干预并将流量通过德国服务器路由时，攻击者再次夺控制，将流量路由到位于俄罗斯的服务器。\n\
  \n## 5.2.3.1.6 战术攻击\n\n战术性网络威胁本质上通常是手术式的，具有高度的针对性，并且技术上非常先进。考虑到攻击的特殊性质，开发成本通常很高。与战略性攻击相比，战术攻击的重复性并不那么重要。战术攻击可以是战略攻击的附属；在某些情况下，它们充当力量倍增器或增强其他活动（如军事行动），或作为特殊利益集团行动的补充行动。考虑到这些攻击的手术性质，它们在颠覆性行动中也很受欢迎。考虑到这些攻击的成本，它们通常由资金充足的私人实体和政府资助，这些实体通常具有全球性质和影响力——一个国家、一个企业或一个特殊利益集团。\n\
  \n战术网络攻击（被用于战略目的）的一个例子是震网蠕虫（Stuxnet）。美国和以色列政府旨在颠覆伊朗的核电厂，可能设计了 Stuxnet 蠕虫。然而，它最终感染的不仅是预定目标伊朗：它影响了包括印度、美国和英国在内的多个国家。到\
  \ 2010 年 9 月，已有超过 100,000 个唯一主机被这种蠕虫感染。Stuxnet 的设计方式是独的。它通过多种媒介传播（例如，闪存驱动和互联网连接）。它影响了`Windows`系统，并利用了操作系统中已修补的已知和未知的漏洞。然而，这些`Windows`系统并不是该蠕虫的实际目标。在感染一个主机后，它会寻找特定的工业控制系统，即西门子制造的可编程逻辑控制器（PLC）。显然，伊朗在其核电厂正在使用这种控制器。如果它没有检测到特定的控制器软件，它什么都不会做，而是等待传播到其他主机上。如果它发现了该控制器软件，它就会感染并更改它。\n\
