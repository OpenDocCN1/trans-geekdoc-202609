  \n## 5.2.3.1.7 针对用户的攻击\n\n针对用户的网络威胁在本质上可能是战略性的、战术性的或个人性的，目标是可能是消费者或企业拥有的个人设备。利用战略性的、战术性的或公开的方法利用特定个人或普通用户群体以获取金钱、政治或个人利益，可以专门针对某个用户，作为主要目标，或作为进入其他目标的手段，或者是作为机会用户进行随机利用。\n\
  \n\n\n\n\n在许多方面，大多数策略性和战术性攻击都是用户攻击的形式。这些攻击与针对特定用户的攻击之间的区别在于规模。此类攻击的一个示例是，通过在用户的系统上安装键盘记录器来针对用户，意图获取即时财务利益（例如，获取登录银行账户的密码）、未经授权访问他人的电子邮件账户（为了监视配偶或名人），或针对测验以期规避实际结果。所有这些攻击都对少数个人有益。这些类别的攻击示例包括勒索软件、信用卡信息收割、针对特定个人的金钱获取目标（银行账户、社会安全号等）、未经授权访问社交媒体网站、电子邮件和其他在线信息以意图勒索、剥削或羞辱个人、身份盗窃、钓鱼攻击以及对“智能家居”产品的利用。读者会对这些攻击中的大多数非常熟悉。勒索软件是一种恶意软件，它欺骗用户相信，除了付钱消除困扰之外，他们没有出路。此类攻击的一个例子是锁定用户的桌面并要求付款以解锁。这类攻击最初发现于俄罗斯，但在过去的几年里已蔓延到其他国家。（*核心软件安全》*，第\
  \ 326-339 页）\n\n## 5.3 安全工具、自动化与供应商管理\n\nDevOps 的目标是让开发团队在部署和监控其软件产品方面拥有更多所有权。自动化是\
  \ DevOps 的核心，有助于开发团队运行更快并交付更高质量的产品。作为这一过程的一部分，安全必须是开发过程的一部分，并尽可能地自动化，以防减慢其速度。这还包括设计好的安全策略和标准，使其不会拖慢进程。这种自动化的整体方法不仅将帮助开发团队更快速、更高质量地交付代码，而且会更加安全。在\
  \ `CI/CD` 中将手动过程自动化已帮助了以前分散的运营和开发团队像单一团队一样工作。\n\n> DevSecOps 中的自动化是共同公约数。它赋予了统一\
  \ DevSecOps 团队中的开发、安全和运营角色在整个软件开发生命周期（SDLC）中协作并扩展其视角，无论部署框架如何——本地、私有云、公有云还是混合云。它通过使安全成为组织新文化中无摩擦的一部分来加速安全进程……尽管\
  \ DevSecOps 中的自动化至关重要，但它不能替代所有的手动工作。你仍然需要关注应用程序的设计，以及应用程序和安全控制的基础设施支持。识别可能增加系统受攻击脆弱性的潜在漏洞非常重要，包括你的设计违反了安全设计模式、你的系统忽略了安全控制，或者那些安全控制遭受了错误配置、弱性或误用。\n\
  > — Steve Cohen, Synopsys, 2018\n\n***\n\nSchneier, B. (2010,10 月 7). “Stuxnet.”\
  \ Schneier on Security 一个涵盖安全与安全技术的博客。检索自 [`www.schneier.com/blog/archives/2010/10/stuxnet.html`](https://www.schneier.com)\n\
  \nDunn, J. (2012,3 月 9). “勒索木马向俄罗斯核心地区以外扩散：安全公司开始看到更多感染。” Techworld。检索自 [`news.techworld.com/security/3343528/ransom-trojans-spreading-beyond-russian-heartland`](http://news.techworld.com)\n\
  \n集成安全和审计能力应通过纳入自动化安全测试和合规性，成为你 DevOps 流程和流水线的内置组件。随着越来越多的测试和流程实现自动化，你因人为错误引入安全漏洞的风险就会降低。这为自动化流水线提供了一个用于测试、报告和解决安全问题的闭环过程。通过自动化以及将安全工具和测试作为开发和运营所用流水线的一部分，安全变成了该过程的推动者，而不是绊脚石。\n\
  \n安全即代码（Security as Code）是将安全构建到 DevOps 工具和实践中，使其成为工具链和工作流的本质组成部分。这需要添加安全检查、测试和门禁，同时不引入不必要的成本或延迟。安全工具和测试被直接移动到持续集成和持续交付（`CI/CD`）中，以便在更改立即验证安全性。下面简要讨论了在\
  \ DevOps 开发流水线中用于持续安全和集成的关键安全工具的考虑因素。（[5.3.1–[5.3.4] 节在第三章中详细讨论）。\n\n### 5.3.1 静态安全测试\
  \ (SAST)\n\nSAST 工具用于检查源代码以寻找安全缺陷。它是旨在在 DevOps 过程中早期识别并缓解安全漏洞的若干项检查之一。这些能力的自动化驱动了效率、一致性和早期检测。在\
  \ GitLab 中，SAST 将在每次代码提交后自动生成修复摘要和未解决漏洞的摘要。\n\n### 5.3.2 动态分析测试 (DAST)\n\n黑箱 DAST\
  \ 工具和服务对于测试 Web 和移动应用很有用，但它们在持续集成或持续交付中并不总是表现良好。与 SAST 类似，DAST 应该自动运行，这样开发者就不需要采取措施启动测试。在其他情况下，DAST\
  \ 也可以用于持续监控实时 Web 应用是否存在跨站脚本或身份验证漏洞等问题。测试结果应告知开发者潜在的漏洞，并作为持续更新的催化剂。GitLab 的 DAST\
  \ 工具在 QA 期间对评审应用运行实时攻击，这意味着开发者可以更早、更快地迭代新应用和更新。\n\n\n\n\n\n模糊测试（Fuzz testing）在嵌入式系统开发中非常重要，因为其错误代价很高，同时也经常被安全人员用于寻找漏洞。一些较新的模糊工具设计用于在\
  \ CI/CD 中运行（或可以适配在其中运行）。它们允许你设置种子测试值以创建可重复的测试，为测试运行设置时间限制，检测重复错误，并编写脚本在系统崩溃时自动设置/恢复状态。\n\
  \n### 5.3.4 单元与功能测试\n\nDevOps 团队使用测试驱动开发（TDD）框架和持续集成（CI）工具来自动化单元测试。安全人员可以编写代码并向流水线中添加自定义的安全单元测试，特别是针对边界情况、异常和负用例进行测试，以捕获安全问题。\n\
  \n### 5.3.5 集成测试\n\n集成测试是指测试多个一个组件以及它们如何协同工作。此层次测试的目的是暴露集成单元之间交互中的故障。与单元测试一样，安全人员应该向流水线中添加自定义的安全集成测试。\n\
  \n### 5.3.6 自动化红队测试\n\n你应该始终尝试在攻击系统时击败对手。在这种语境下，红队测试意味着从攻击者的视角来看你的基础设施和代码，从而对软件产品的优缺点有更好的安全理解。有几个测试框架是专为易用性而设计的，并在\
  \ CI/CD 环境中针对你的系统的自动化攻击表现良好。它们提供了在你的自动化测试周期中，针对你的系统设置并运行一组基础目标自动化渗透测试的能力。关于红队和紫队更深入的讨论，请参阅第\
  \ 3 章。\n\n### 5.3.7 自动化渗透测试\n\n带外渗透测试在满足强制合规性要求或验证安全计划的优劣势方面仍然适用。然而，CI/CD 的交付节奏和速度太快，传统的手动渗透测试在设置、运行和审查上花费的时间太长。现在有新的工具和服务可以提供提供持续且按需的“渗透测试即服务”（Penetration\
  \ Testing as a Service），可以通过对你的产品执行端到端安全测试，完全集成到 DevOps 环境中，从而确保开发过程的速度、可靠性和一致性。\n\
  \n________________\n\nBird, J. (2016). O’Reilly Media Online—DevOpsSec: Chapter\
  \ 4. Security as Code: Security Tools and Practices in Continuous Delivery. Retrieved\
  \ from https://www.oreilly.com/library/view/devopssec/9781491971413/ch04.html\n\n\
  ### 5.3.8 漏洞管理\n\n在敏捷、DevOps 和云环境中管理漏洞风险是复杂的。频繁的配置更改、代码和容器漏洞、云扩张以及不断变化的合规性使得这项任务变得困难且充满挑战。\n\
  \n自动化漏洞监控允许你在不中断交付流的情况下检查软件中的漏洞。这些系统通过寻找两种主要的漏洞来实现这一点。对漏洞扫描应用持续监控实践可以增强你的漏洞管理计划，使你的流水线处于持续监控之下。这将帮助你更早地检测漏洞并确定修复措施的有效性。安全团队需要在开发过程的多个阶段检测并管理漏洞。他们应该搜索可能存在代码、容器和云中的漏洞。关于流水线问题和\
  \ A/B 测试的更详细讨论，请参阅第 3 章。\n\n产品的演进很快，以应对 CI/CD DevOps 环境中漏洞管理的特定需求，并与当前的 CI/CD 开发工具保持互操作。漏洞管理解决方案是\
  \ DevSecOps 过程的核心，所有工具都需要将其数据汇入到这些解决方案中，以便进行集中管理、分级、跟踪和修复。创建或购买一个开发者仪表板程序是重要的，将漏洞管理的技术方面与个人责任相结合，以帮助公司开发人员培养安全意识。\n\
  \n### 5.3.9 自动化配置管理\n\n代码驱动的配置管理工具易于使用通用模板在数百台服务器上设置标准化配置，最大限度地减少了黑客利用某个未打补丁服务器的风险。管理环境的所有配置信息在版本控制下的中央仓库中均可见。这意味着当\
  \ OpenSSL 等软件组件报告漏洞时，很容易识别哪些系统需要打补丁。同样，推送补丁也很。这些工具还提供了一些基于主机的入侵检测能力，并让你控制配置漂移：它们持续自动地审核运行时配置，确保每个系统都匹配主配置，在缺失或出错时发出警报并可以自动修正。\n\
  \n### 5.3.10 软件成分分析\n\n软件成分分析（SCA）对第三方和开源软件进行分析，以检测非法、危险或过时的代码，并检查由于缺少补丁产生的漏洞。根据漏洞的数量和严重程度，决定是继续运行流水线还是停止修复。选择一个能够与持续集成工具集成的工具/解决方案将非常重要，以便为用户提供对所有使用的直接和间接开源库、这些库中已知和未知的漏洞以及它们如何影响应用程序的视图，而不减慢开发速度。\n\
  \n### 5.3.11 漏洞赏金计划\n\n\n\n\n\n漏洞赏金计划可以加强你在 `DevOps` 流水线中任何环节的运营安全，并在你的安全团队与开发人员之间建立协同效应。利用扩展的安全研究人员社区将为你提供你可能无法在内部内部负担得起聘佣的技能。虽然这不是一个自动化过程，但它可以帮助测试你用于识别软件中安全问题时所自动化工具和人工评估的效能。这包含了关于你的安全需求需要改进之处的信息，涵盖设计、威胁建模、安全审查、测试、编码和配置管理。\n\
  \n### 5.3.12 保护你的持续交付流水线\n\n持续交付和持续部署实际上将你生产环境的攻击面扩展到了你的构建、自动化测试和部署环境。确保持续交付工具链以及构建和测试环境的安全至关重要，以便对交付的完整性和监管链条（chain\
  \ of custody）充满信心，这不仅是为了合规性和安全考虑，也是为了确保更改是安全、重复且可追溯地进行的。你的持续交付工具链本身也是一个危险的攻击目标，因为它提供了一条进行更改并自动推送到生产环境的清晰路径。如果被攻破，它可以为攻击者提供一种进入你的开发、测试和生产环境的简单方式。应该对持续交付流水线进行威胁建模，以评估设置和控制中的任何弱点，以及审计或日志方面的漏洞。`SDL`\
  \ 威胁建模的要求在`第 3 章`中也有讨论。\n\n在 `CI/CD` `DevOps` 环境中，最重要的就是代码投入生产的速度有多快。为了让安全有效成为流水线的一部分，它必须是自动化的、早期嵌入的、持续的，并完全集成到开发生命周期和\
  \ `DevOps` 流水线。可能的自动化是 `DevOps` 流水线安全成功的关键。这已成为拥有高度 `DevOps` 实践组织的关键特征，正如 2018 年\
  \ Sonatype 对近 2300 家 IT 调查所示，57% 的受访者表示他们在整个开发生命周期中运行自动化安全测试，而且成熟的 `DevOps` 实践集成自动化安全的可能性提高了\
  \ 338%。通过自动化将安全集成到 `DevOps` 实践具有两个显著优势：\n\n1. 它确保通过监控、评估和分析尽早暴露缺陷和漏洞，从而比传统方法更早地实施修复。\n\
  2. 通过安全测试的快速失败（failing fast），组织降低了安全事件的风险并减少了重工作成本。\n\n底是，如果安全在 `DevOps` 环境中采用自动化，它可以让自己成为\
  \ `DevOps` 开发流水线不可不可缺的一部分。例如，它们可以：\n\n_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\\
  _\\_\\_\\_\\_\\_\\_\n\n同上。\n\nSonatype. (2018). *DevOps.* p. 9.\n\n- 将安全工具注入开发中并\n\
  - 自动化针对预生产环境的攻击以防止\n- 持续对生产环境进行测试以\n- 拥抱安全工具。\n\n如`第 2 章`所述，`VRM` 和安全风险管理都是 `DevOps`\
  \ 的重要部分。\n\n### 5.3.13 供应商管理\n\n供应商管理对于确保软件测试外包的效率和价值非常重要。管理不当的某些后果包括：\n\n- 对需求的理解不当可能导致大量漏洞遗漏。\n\
  - 如果使用旧的测试工具，不一致的漏洞描述可能成为问题。\n- 如果测试策略不平衡或缺乏自动化工具，可能会产生过高成本。\n- 如果供应商得不到持续反馈，他们的性能就不会提高。\n\
  - 如果供应商使用旧的软件工具，供应商锁定可能是一个副作用。\n- 如果未约定性能标准，可能会出现合同管理方面的困难。\n\n为了帮助防止上述其他问题，供应商管理应包含以下最佳实践：\n\
  \n- 使用传统的漏洞跟踪和项目管理工具监控测试团队的性能和输出。\n- 确保遵循并满足服务水平协议 (`SLA`）条款和要求。`SLAs` 可以为定期性能评估提供坚实的基础。\n\
  - 组织软件需求的更新。\n- 在阻碍测试性能的争议情况下提供判断。\n- 调解解决问题的过程。\n\n\n\n\n\nFIRST.org 的 PSIRT 服务框架网页清晰地定义了产品安全事件响应团队（PSIRT）的角色和功能：\n\
  \n> 产品安全事件响应团队（PSIRT）是组织内部的一个实体，其核心关注是识别、评估和处置与产品中安全漏洞相关的风险，这些产品包括组织生产和/或销售的产品、解决方案、组件和/或服务。\n\
  \n> 一个部署得当的 PSIRT 不是一个与组织产品开发脱节的独立运行小组。相反，它是组织更广泛的安全工程倡议的一部分。这种结构确保了安全保障活动集成到安全开发生命周期（SDL）中。\n\
  \n> 产品安全事件响应通常与 SDL 的维护阶段相关联，因为大多数产品安全漏洞是在产品发布市场后作为质量逃逸问题被报告的。然而，PSIRT 在早期的需求收集、架构、设计、规划和风险建模阶段也可以产生影响。PSIRT\
  \ 的功能还通过为处理内部发现的安全问题提供指导和监督来增加价值。†††](#14-9781003002451_chapter-chap5.xhtml#fn5_58)\n\
  \n基于第 2 章中的讨论，后续章节将描述在 DevOps 环境演进到下一阶段 PSIRT 支持所需的条件。\n\n### 5.4.1 组织结构 (#04-9781003002451_contents.xhtml#chap5_4_1)\n\
  \n成熟的 PSIRT 职责和组织在第 2 章中描述过。理想情况下，那里实际上是你现在应该所在地，但未来需要更整合的伙伴关系和一系列工具集，以最短时间内消除任何安全漏洞，最大限度地减少软件产品中外部发现的安全漏洞。此外，PSIRT\
  \ 需要的最重要的一点是执行管理层的认可和支持。如果没有这些，PSIRT 将无法有效履行其职责。\n\n如前所述，兼职的安全冠军应由兼任开发人员的全职安全工程师取代。他们仍将保留安全职责，例如帮助领导安全活动、开发安全策略和流程、主动监控安全、与安全架构师协助评估安全问题、对漏洞进行评分以及审查策略例外。这还包括与中心化的产品安全响应功能合作并作为其扩展。这将比过去产生更精简、更高效的，并在开发团队中获得更好的公信力和认可。安全工程师将成为其所代表开发团队的\
  \ PSIRT 传道士、培训师和响应负责人。\n\n__________\n\n[*]](#14-9781003002451_chapter-chap5.xhtml#r_fn5_57)同上。\n\
  \n††](#14-9781003002451_chapter-chap5.xhtml#r_fn5_58)FIRST.org (2020). “PSIRT 服务框架。”获取自\
  \ [`www.first.org/standards/frameworks/psirts/psirt_services_frameworkv1.0`](https://www.first.org)\n\
  \n### 5.4.2 主动狩猎 (#04-9781003002451_contents.xhtml#chap5_4_2)\n\n如前所述，红队的价值在于使你的组织能够领先于黑客，在他们发现之前识别出产品中的缺陷。对软件建立主动的狩猎和测试方法，结合本章早期描述的自动化工具，可以优化你发现可能被攻击者利用的软件缺陷的能力。通过增加内部安全测试并使其主动化，组织将从中受益，因为修复指导可以立即采取行动并集成到业务流程中。这通常通过使用内部红队、漏洞赏金计划和自动化工具来实现。有关红队和主动狩猎的详细讨论，请参阅第\
  \ 3 章。\n\n### 5.4.3 持续检测与响应 (#04-9781003002451_contents.xhtml#chap5_4_3)\n\n由于许多监管标准要求具备快速响应事件并及时报告的能力，对事件响应和报告的关注日益增加。为了确保这一过程的有效性，必须捕围绕事件的所有数据。考虑到大多数代码部署的动态环境，使用传统的手动方法进行捕获、分析和反应几乎是不可能的。各种服务的自动化以及\
  \ `autoscaling` 加剧了这一点。\n\nDevOps 中的下一代 PSIRT 需要持续的检测、关联和响应，以减轻源于关卡流程的软件缺陷。除了已建立的实践之外，我们预期更好的工具将支持这种\
  \ PSIRT 功能，减少人工干预并缩短响应时间，从而提高客户满意度并最大限度地减少软件流水线的中断。\n\n机器学习 (`ML`) 和人工智能 (`AI`)\
  \ 的认知工具/技术正以多种方式影响网络安全生态系统。应用 AI 机器学习和自然语言处理已被私营和公共部门用于网络安全，以增强态势感知并加强网络威胁防护。*](#14-9781003002451_chapter-chap5.xhtml#fn5_59)\n\
  \n用于计算机安全事件响应 (`CSIRT`) 的编排、自动化和响应 (`SOAR`) 解决方案提供了 `PSIRT` 部分自动化。行业尚未达到这一步，但提供的功能对于产品侧的复用或使用看起来很有前景。这些技术允许组织从不同来源收集安全威胁数据和告警，利用人类和机器的力量进行事件分析和分拣，帮助根据标准工作流定义、优先排序并驱动标准的事件响应活动。工具允许组织以数字工作流格式在安全运营剧本中定义事件分析和响应程序或脚本，使得一系列机器驱动的活动可以实现自动化。\n\
  \n__________\n\n[*]](#14-9781003002451_chapter-chap5.xhtml#r_fn5_59)Brooks, C. (2020,\
  \ 4 月 13). “SOAR 网络安全：回顾安全编排、自动化和响应。”获取自 [`cybersecurity.att.com/blogs/security-essentials/security-orchestration-automation-and-response-soar-the-pinnacle-for-cognitive-cybersecurity`](https://cybersecurity.att.com)\n\
  \n### 5.4.4 软件物料清单 (#04-9781003002451_contents.xhtml#chap5_4_4)\n\n\n\n\n\n软件物料清单（SBOM）是构成软件组件的成分列表的嵌套清单。在任何基于软件的产品中，对软件组件进行详细描述对于识别网络安全漏洞并最终帮助减少网络安全风险至关重要。SBOM\
  \ 适用于数字产品，并识别和列出软件部分、有关这些组件的信息以及它们之间的供应链关系。在过去的几年里，美国商务部——国家信息电信和信息管理局（NTIA）一直与行业利益相关者合作，加强对\
  \ SBOM 的使用和要求，以增强软件漏洞的管理和响应。\n\n### NTIA 倡议与框架\n\n自 2018 年以来，NTIA 一同政府和行业利益相关者合作，通过框架（Framing）、实践与用例（Practices\
  \ & Use Cases）、格式与工具（Formats & Tooling）以及医疗保健工作组——每周或每两周举行一次会议，创建一个围绕 SBOM 使用框架的关键文件、信息或实践。根据\
  \ NTIA 的说法，双方的目标是“探索制造商和供应商如何就构成现代软件和物联网设备的第三方及嵌入式软件组件，通信有用且可操作性的信息，以及企业如何利用这些数据来促进更好的安全决策和实践”。框架工作组创建了《软件组件透明度框架》文档，该文档定义了最小可行\
  \ SBOM，以指导制作、选择和运行软件的实体。\n\n> *为大多数软件组件快速收集这组最小基准信息的价值，将显著提高每个行业更好地管理其所用组件的能力，”文档指出，“从基准信息集开始，可以让各种利益相关者快速采纳这一过程，并随着时间的推移在此基础上进行。这是建立此类基础信息作为起点的主要驱动因素之一，而不是要求一套可能需要更多时间和资源来收集和维护的更强大的数据元素。”\
  \ Friedman 暗，政府、军队或任何其他购买软件或软件服务的实体都要求知道数字代码包含哪些部分，并向供应商索要软件物料清单。“软件驱动着我们的整个世界，万事万物都处于软件世界之中，”他指出，“如果你制造汽车，那就是一个软件产品。你制造坦克；它也是软件产品。现在是关于向游推动市场对高质量软件组件的需求。这样，组织（无论是政府还是私营部门）就可以询问其软件供应商：嘿，你们在使用最新的成分，还是在使用有毒的成分？’这正是我们真正想要做的，即驱动供应链对更好、更高质量软件成分的需求。”\n\
  \n### 漏洞管理与响应\n\n每当漏洞披露或核心库（如 `OpenSSL`）发布新版本时，SBOM 有助于对应用程序和代码进行抽检。对于 2014 年 4\
  \ 月受 Heartbleed 漏洞影响的公司来说，这对确定 `OpenSSL` 是否包含在他们的软件清单中具有巨大的帮助。`PSIRT` 和开发团队可以快速参考他们是否拥有一个漏洞版本的\
  \ `OpenSSL`，以及是否需要采取补救措施。SBOM 可以帮助回答您的软件是否受到最近发现的软件漏洞的影响，您是否需要采取行动，如果是，您需要采取的行动方案。\n\
  \n### 现代软件的复杂性\n\n今天的软件通常是来自各种软件库的提取代码、现有旧代码行的重复使用，在许多情况下主要是第三方代码的复杂混合体。攻击者日益针对第三方库中的漏洞作为其攻击的一部分，加剧了这种情况，因为这为他们提供了比单一应用程序更多的目标，因为库可以调用其他组件，并且很容易超过两个层次。这凸显了检查\
  \ `第 3 章` 中讨论的所有依赖和组件的有效性和安全性的性。最终，您的组织对您生产的任何暴露漏洞的软件产品负责，无论它是第三方组件还是不是。SBOM 应该描述应用程序包含的组件、正在使用的组件版本和构建版本、每个组件的许可证类型、该组件在源代码中调用位置等详细信息、用于构建应用程序的所有工具列表以及相关的构建脚本。\n\
  \n当客户购买软件时，他们对组件（无论是商业还是开源）的视图是有限的。如果您的 SBOM 是完整的，您的客户将能够决定他们是否愿意冒险使用包含旧的、不支持的组件的应用程序，或者更新到最新版本（如果产品仍在生产）。\n\
  \n在过去的几年里，各机构开始要求软件供应商提供 SBOM，以发现潜在的安全和许可问题，或者软件产品是否使用了过时的库版本。2019 年，美国保险实验室（UL）针对物联网（IoT）和关键基础设施供应商推出了了自愿的网络安全保障计划（`UL\
  \ CAP`），以根据一组安全标准评估其产品中的安全漏洞和缺陷。`UL CAP` 旨在通过为嵌入式产品和系统的软件漏洞和缺陷创建标准的、可测试的标准来最大限地降低风险。这有助于减少利用、处理已知恶意软件、增强安全控制并扩大安全意识。\n\
  \n简而言之，拥有详细的 SBOM 为 `PSIRT`、开发团队和客户提供了跟踪成分以获得更好安全的能力。与旧的方法相比，这将节省大量的时间和金钱，并保护您的声誉。\n\
  \n\n\n\n\n### 5.4.5 组织管理\n\n为了让 PSIRT 进化到下一个水平，还需要具备一些组织管理功能和能力。以下来自 `FIRST.org`\
