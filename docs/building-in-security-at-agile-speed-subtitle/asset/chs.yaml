  \n## 6.9 总结/结论\n\n我们认为，交付“内置”软件安全的一部分需要重大的组织和组织文化变革，我们称之为“文化黑客手段（culture hacks）”。其中一些手段是微妙的，并在程度上在个人行为层面运作。我们描述的某些黑客手段是非常公开的：对组织本身结构和投资策略的改变。请放心，本章提到的每种技术都是有意识地采取的。\n\
  \n我们使用本章概述的文化黑客手段来推动我们的组织向软件安全文化转变，使安全成为开发和运行过程中的关键考虑因素和任务集 (`SDL`) 之一。我们将这些黑客手段分为两大大类：执行手段和组织结构手段。\n\
  \n*执行手段：*\n\n- 获得组织各层的支持，并识别阻力来源：\n    - 高管\n    - 中层管理人员\n    - 高级技术领导\n    - 其他所有愿意帮助的人\n\
  \n\n\n\n\n-   信任开发者会做正确的事。持续传达什么是“正确的事”，并沟通交付所需的责任以及为交付提供赋能。\n-   信任并验证：记住每个人都会犯错。提供工具和培训，让开发者能够在发布之前发现错误。\n\
  -   建立实践社区，通过共同的使命感来支持学习和激励。\n-   为每一个对开发做出任何形式贡献的人引入威胁建模。\n-   记住，实现预期的风险态势（安全的\
  \ CIA 三要素）将为符合标准和法规奠定基础。但仅合合规并不一定能提供适当的安全。\n\n## 结构技巧 (Structure Hacks)\n\n-   对人的投资远不止于雇佣合适的人。投资有效的沟通技巧和渠道、适当的自动化以及支持性的批判性分析（特别是风险分析）也是人员投资的一部分。\n\
  -   自动化已至关重要。每个 DevOps 团队都会通过各种工具大量使用自动化。同时，某些问题由人类处理效果更好，对于复杂分析尤其如此。\n-   建立明确的战略目标，以协调人员的努力。\n\
  -   赋能并投资一个强大、有效的产品安全事件响应团队（PSIRT）。\n-   培训，然后练习、刷新、提醒、更新并反复练习。考虑哪些做法是有效的。识别挑战和潜在解决方案。回顾成功案例。然后重新培训。\n\
  -   处理技术债。\n\n在本书的最后一章，我们讨论了这些认为必须进行的组织和文化转变，以培养以敏捷、DevOps 和开发者为中心的软件安全。文化黑客行为为本书提供了一个完美的结尾，因为如果没有文化改变，通用的\
  \ SDL（安全开发生命周期）以及支持其软件安全计划的组织和管理将无法完全有效。软件安全本质上仍然是一个人的问题，需要人为驱动的解决方案。人类生活在文化中，无论我们考虑的是更广泛的区域文化、国家的特性，还是每个组织独特的预期、习惯和风格。\n\
  \n在本书开头宣布“软件安全是一个人的问题”后，我们认为认为将文化因素留到最后是合理的。在此之前，我们已经阐述了问题，提供了解决方案（通用的 SDL）、关于安全设计的细节（这真的需要另一本书来才能充分解释），以及允许程序有意图和重点地运行和执行的组织和管理方面。书中贯穿的每个广泛方面必须整合成一个整体才能成功。根据我们的经验，忽视一个或多个方面将阻碍结果，而且往往是深远的。\n\
  \n在本章中，我们回到了“人”，以及如何通过可行的方法赋能人员并赋予他们正确的工具和正确的激励（在正确的结构和赋能下），从而带来更好的软件安全以及一种安全文化——这种文化重视从开始并贯穿整个开发过程构建的安全，并将其视为软件开发经纬的核心组成部分。\n\
  \n我们支持本书的内容，这种信念建立于创建程序、对有效和无效做法的反思、对我们可能如何改变现状或添加新的、可能不同的、甚至是独特的东西之上。有时，承认我们曾认为应该交付成果的路线没有做到是痛苦的。这时，James\
  \ 和 Brook 会从字面上意思进入办公室或会议室，或者通过电话、共进午餐或喝咖啡，诚实直率地面对问题。我们可能会尝试调整正在做的工作，或者切换到不同的东西，甚至完全改变方法。或者，我们可能会加倍投入我们认为有效的东西：也许只是执行存在缺陷？书中表达的信心建立在成功和失败之上的。我们希望你，我们的读者，不必犯同样的错误，并能从我们得出的更有效的结果中获益。\n\
  \n愿我们能够迎接眼前的安全挑战。我们祈祷在这里写的内容能加速你和你的组织走向适当且相关的软件安全之路。\n\n# 附录 A\n\n# 通用安全开发生命周期 (The\
  \ Generic Security Development Lifecycle)\n\n| A.1 | 开始威胁建模 (Begin Threat Model)\
  \ |\n| --- | --- |\n| 目的 | 开始威胁建模，根据软件的安全目标交付安全的设计。安全目标在某种取决于系统必须抵抗的攻击以及系统利益相关者的安全预期，即系统威胁模型。\
  \ |\n| 前提条件 | 当有要通过软件实现的想法或概念时，可以启动威胁建模。当构思出多个结构元素作为实现软件目标的解决方案时，必须启动威胁建模。对于接近或已完成的架构，以及成熟的系统，如果尚未启动威胁模型，请立即启动。\
  \ |\n| 完成定义 | 不适用——威胁模型将在整个开发过程中不断完善。 |\n| 结果与输出 | 在概念阶段，输出高级安全需求和特性。识别额外的安全需求，以及实现安全需求的结构元素/组件和实现方案。\
  \ |\n| 评审或完善的触发因素 | 随着架构元素的添加或构思，完善威胁模型。当确定了安全特性时，完善威胁模型。当发现新的攻击技术或攻击路径（威胁）时，完善威胁模型。\
  \ |\n\n| A.2 | 完善威胁建模 (Refine Threat Model) |\n| --- | --- |\n| 目的 | 完善威胁模型，更清晰地表示呈现的系统需要抵抗的攻击，识别新的安全需求，并确保现有需求与架构和实现保持同步。\
  \ |\n| 前提条件 | 必须存在一个威胁模型。必须有一些可以分析的架构（结构元素）。 |\n| 完成定义 | 当所有相关的攻击场景都已考虑、场景已进行风险评估，并且每个具有重大影响及高利用可能性的攻击场景都有足够的安全防御以使系统达到利益相关者的风险承受能力时，威胁模型即视为完整。\
  \ |\n| 结果与输出 | 一组风险评级的攻击场景和一组防御（包括已实现的和将要实现的），共同构成了适当的“深度防御”。 |\n| 评审或完善的触发因素 |\
  \ 当架构发生变化、发现新的利用类型以及有新的防御措施可用时，完善威胁模型。架构变化可能涉及以下任何项：组件或功能；资产；用例；通信链路或数据流；信任边界或信任/不信任级别；潜在漏洞组件的暴露转移\
  \ |\n\n| A.3 | 进行隐私影响评估 (Conduct Privacy Impact Assessment (PIA)) |\n| --- | ---\
  \ |\n| 目的 | 对软件进行分析，以识别保护个人数据隐私和遵守软件将面临的隐私法规的需求。分析的关键部分是针对隐私和数据攻击的威胁建模。（请参阅开始威胁建模和完善威胁建模活动。）\
  \ |\n\n\n\n\n\n### 前提条件\n有收集人类实体数据的需求。必须已知已经或将要收集的数据元素，也必须知道收集数据的原因。必须存在现有的威胁模型。必须至少存在可以分析的架构（结构性元素）。\n\
  \n### 完成定义\n当所有隐私需求（安全及其他需求）都已识别，且威胁模型中关注隐私的部分已完成后，PIA（隐私影响评估）视为完成。（请参阅“细化威胁模型”活动。）\n\
  \n### 结果与输出\n* 一组经过风险分级的攻击场景和一组防御措施（包括已实现的防御和待构建的防御措施），它们共同构成了隐私保护和隐私监管合规的适当“深度防御”。\n\
  * 为了实现隐私所需的一组非安全需求，通常包括法律、用户界面和隐私工程需求。\n\n### 评审或精细化的触发因素\n* 人类实体数据元素的变更\n* 用例\n\
  * 通信链路或数据流\n* 信任边界 2 或信任/不信任层级\n* 处理隐私相关数据的潜在漏洞组件的暴露程度的转变\n\n# A.4 威胁模型的构建、打包、发布与部署机制\n\
  \n### 目的\n将攻击和防御分析扩展到软件开发之外，涵盖所有用于生成、运行和维护运行软件的机制。尽管一个“全面”的威胁模型应该包含这些方面，特别是在许多功能也将通过“代码化”实现的\
  \ DevOps 中，但我们将此威胁建模子任务单独列出，因为它经常被跳过。但攻击者不会跳过它，破坏可能会允许攻击者伪造或操纵软件以达到目的。\n\n### 前提条件\n\
  必须计划并存在构建、打包、发布和部署机制、代码以及软件组件。\n\n### 完成定义\n当所有相关的攻击场景都已考虑、场景已进行风险分级，并且每个具有重大影响潜力以及被利用概率的攻击场景都有足够的安全防御，以使构建、发布、部署和操作达到系统利益相关者的风险承受能力时，威胁模型即足够完整。\n\
  \n### 结果与输出\n一组经过风险分级的攻击场景和一组防御措施（包括已实现的待构建的），它们共同构成了适当的“深度防御”。\n\n### 评审或精细化的触发因素\n\
  当架构发生变化、发现新的利用类型或新的防御措施可用时，细化威胁模型。架构变化可以是以下任何一种：\n* 组件、功能或工具\n* 用于构建、发布、部署和运行的资产\n\
  * 用例\n* 通信链路或数据流\n* 信任边界或信任/不信任层级\n* 潜在漏洞组件暴露程度的转变\n\n# A.5 评估托管基础设施的安全\n\n### 目的\n\
  在未知情况下，任何使用的托管基础设施都必须对其安全能力、安全态势和安全实践进行评估。每种基础设施都有安全优势和局限。使用基础设施的软件必须理解它将获得什么，并对软件整体的安全态势负责。对基础设施进行威胁建模是评估的基础任务之一，但不是唯一的，因为部署在基础设施上的软件系统可能需要消耗基础设施的服务。（请参阅“开始威胁模型”和“细化威胁模型”活动。）\n\
  \n### 前提条件\n* 软件将使用托管基础设施（计划中的、内部、外部、商业云、混合云等）。\n* 未进行过之前的基础设施评估，基础设施未发生重大变化。\n\n\
  ### 完成定义\n所有使用或当前采用的服务都已进行威胁建模，并对其安全耐受、安全态势和安全实践进行了评估。\n\n### 结果与输出\n* 一组软件在基础设施上运行并满足软件安全需求和目标所需满足的安全需求。\n\
  * 一组运行在基础设施上为软件操作和维护增加的额外风险（如果有的话）。\n\n### 评审或精细化的触发因素\n每当添加或更改未评估的基础设施时（例如，供应商、位置或服务的变更等），重新评审评估结果。\n\
  \n# A.6 评审威胁模型\n\n### 目的\n验证威胁模型是否足够全面，并且对于当前评审时的开发状态而言已足够完整。\n\n### 前提条件\n一个认为已充分完成的威胁模型。每次评审应由一名独立于目标系统和开发的的威胁模型从业人员进行，并由一名比生成模型的人员经验丰富的评审员进行。（对于最资深的威胁建模者，由其他资深从业人员进行同级评审即可。）\n\
  \n### 完成定义\n评审人员认为模型足够完整且全面。\n\n### 结果与输出\n一组经过评审的风险分级安全需求，包括针对攻击场景的防御措施和缓解措施。\n\
  \n### 评审或精细化的触发因素\n每当威胁模型经过细化，且细化人员认为细化工作已完成时。\n\n# A.7 安全编码培训\n\n### 目的\n让程序员（及其他相关人员）为生成无安全问题的代码做好准备。\n\
  \n### 前提条件\n有生成或更改软件编程代码的需求。\n\n### 完成定义\n证明出席情况以及应用所学技术的能力。\n\n### 结果与输出\n程序员已接受适当的培训，并能够演示安全编码实践。\n\
  \n### 评审或精细化的触发因素\nN/A\n\n# A.8 人工代码评审\n\n### 目的\n人工代码评审用于发现已编写代码的安全问题，并确保安全功能已正确编写。\n\
  \n### 前提条件\n代码已生成或更改。\n\n### 完成定义\n* 已进行同行评审并获得程序员确认。\n* 对于安全关键代码，已进行专家评审并获得确认。\n\
  * 同意的问题已修复。代码已重新提交评审并可能提交到构建。\n\n### 结果与输出\n已识别的安全问题或错误实现已获得确认并修复。\n\n### 评审或精细化的触发因素\n\
  代码已生成或更改。\n\n# A.9 静态分析测试\n\n### 目的\n安全静态分析测试（SAST）用于识别程序源代码中的安全错误。\n\n### 前提条件\n\
  代码已生成或更改。\n\n### 完成定义\n* 已对包含更改的代码模块以及所有依赖和交互的模块进行了 SAST。\n* 已发现的可能为攻击者提供优势的问题（真阳性）已修复。代码已重新提交进行分析并可能提交到构建。\n\
  \n### 结果与输出\n已识别的安全问题或错误实现已获得确认并修复。\n\n### 评审或精细化的触发因素\n代码已生成或更改。\n\n# A.10 评估第三方代码\n\
  \n\n\n\n\n## 第三方代码评估\n**目的**\n第三方代码评估确保由外部或外部第三方（例如商业和开源软件）生成的包含代码符合与组织 SDL（安全开发生命周期）下产生的代码类似的\
  \ SDL 要求。\n\n**前提条件**\n将包含第三方代码。\n\n**完成定义**\n已发现第三方软件的安全实践是充分的，以至于该代码的引入不会降低系统或软件的安全性。也就是说，第三方对其\
  \ SDL 的执行与组织的 SDL 相似并满足了组织 SDL 的要求。\n\n**结果与输出**\n关于是否可以包含或必须规避第三方代码的评估结果。\n\n**触发评审或完善的诱因**\n\
  - 提议包含/使用第三方代码时。\n- 对已使用/包含的第三方代码已进行更改。\n\n## A.11 第三方代码中发现的补丁（升级或修复）问题\n**目的**\n\
  第三方代码中的问题会变成整个系统或软件的问题。该任务是应用软件升级（“补丁”）来修复由外部实体产生的软件中的问题。\n\n**前提条件**\n必须包含或使用第三方软件。并且在第三方软件中已发现或宣布了安全问题（漏洞）。\n\
  \n**完成定义**\n所有可能导致重大损害的现有漏洞补丁均已修复，或其风险已被风险决策者接受。\n\n**结果与输出**\n已应用软件补丁或已记录风险决策。\n\
  \n**触发评审或完善的诱因**\n- 在已包含/使用的第三方代码中发布问题。\n- 在已包含/使用的第三方代码中发现问题。\n\n## A.12 功能性安全测试\n\
  **目的**\n对安全功能和特性进行功能测试，确保这些功能行为符合预期，并且它们能够良好地处理错误情况和边界情况。\n\n**前提条件**\n- 安全功能和特性的实现。\n\
  - 设计了一套测试，用于执行每个功能或特性预期的完整行为和错误处理。\n\n**完成定义**\n测试已成功完成。所有识别的问题均已修复。\n\n**结果与输出**\n\
  错误的软件行为和对错误的处理不当。\n\n**触发评审或完善的诱因**\n- 每当更改功能或特性时必须重新运行测试。\n- 必须重新运行测试以证明问题已修复且没有引入新问题。\n\
  \n## A.13 Web 协议与服务的动态测试\n**目的**\nWeb 协议与服务的动态测试使用专门工具来识别漏洞和安全弱点。\n\n**前提条件**\n\
  - 软件中包含 Web 协议和服务，，且代码已充分完成，可以在预期的执行环境或其相似环境中执行。\n- 可用用于测试已构建的特定协议和服务的工具（如扫描器等）。\n\
  \n**完成定义**\n测试已成功完成。所有识别的问题均已修复。\n\n**结果与输出**\n错误的软件行为。软件中的漏洞和弱点。\n\n**触发评审或完善的诱因**\n\
  - 每当引入更改时必须重新运行测试。\n- 必须重新运行测试以证明问题已修复且没有引入新问题。\n\n## A.14 其他输入安全测试（例如，模糊测试 Fuzzing）\n\
  **目的**\n其他输入安全测试使用模糊测试（Fuzzing）以及可能的其他专门工具，识别在输入畸形数据时的错误软件行为。\n\n**前提条件**\n- 软件中包含非\
  \ Web 输入，且代码已充分完成，可以在预期的执行环境或其相似环境中执行。\n- 可用向每个特定程序输入发送畸形数据的模糊器。\n\n**完成定义**\n测试已成功完成。所有识别的问题均已修复。\n\
  \n**结果与输出**\n错误的软件行为。软件中的漏洞和弱点。\n\n**触发评审或完善的诱因**\n- 每当引入更改时必须重新运行测试。\n- 必须重新运行测试以证明问题已修复且没有引入新问题。\n\
  \n## A.15 攻击与渗透测试\n**目的**\n- 手动攻击和渗透测试用于发现难以通过商业和开源漏洞发现工具实现的安全问题。\n- 攻击和渗透测试还证明或反驳了威胁模型中识别的安全假设的充分性。\n\
  \n**前提条件**\n能够在其预期环境及准确的相似环境中执行的软件。\n\n**完成定义**\n测试已成功完成。所有识别的问题均已修复。\n\n**结果与输出**\n\
  软件中的漏洞和弱点。通过成功攻击提供了问题的证明。\n\n**触发评审或完善的诱因**\n- 每当引入更改时必须重新运行测试。\n- 必须重新运行测试以证明问题已修复且没有引入新问题。\n\
  \n## A.16 构建/发布/部署/运行链的评估与威胁建模\n**目的**\n- 确保工具和管理访问不会为攻击者提供优势，以满足安全态势需求。\n- 确保发布的软件仅包含预期软件。\n\
  \n**前提条件**\n用于构建、打包、发布、部署和运行软件的方法、流程和技术。\n\n**完成定义**\n已识别出一套全面的防御（即已完成的威胁模型。请参见“开始威胁建模”和“完善威胁建模”活动）。\n\
  \n**结果与输出**\n一组安全需求和控制，实施后可以关闭或减轻潜在的攻击者优势（威胁）。\n\n**触发评审或完善的诱因**\n- 工具或技术变更。\n-\
  \ 管理员数量/管理访问类型/点的变更。\n\n# 索引\n\n\n\n\n\n**A** A&P。*参见* 攻击与渗透 (A&P) 测试 抽象，7, 19,\
