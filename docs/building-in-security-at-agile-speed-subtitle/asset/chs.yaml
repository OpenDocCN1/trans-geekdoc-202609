  \n![](img/fig4_10_B.jpg)\n\n>  ATT&CK 的列头部提供了攻击意图。CAPEC 的类别提供了实现这些意图的方法（图 4.10 的右侧\
  \ [原图 5.3]）。\n\n\n\n\n\n\n在图 4.10 [5.3] 中，我在“初始访问”（Initial Access）与攻击者用于获取系统访问权限的几种技术之间画了箭头：“收集并分析信息”，然后是“参与欺骗性交互”。这两种机制并不构成“初始访问”技术的全部范畴，但它们是常用的手段。同样，“执行”（Execution）也是通过“注入意外项”和“操纵数据结构”获得的（再次，这并非详尽的集合）。\n\
  \n为了保持图 4.10 [5.3] 具有可读性，我只使用了两个箭头，并直接从三个类别中链接。它们的关系比这里显示的要复杂得多。尽管如此，我希望这个简单的图表能直观地展示如何通过\
  \ CAPEC 中的机制（技术）来实现 ATT&CK 列标题的意图。\n\n在构建防御措施时，我们希望防止或增加利用机制的成本，从而防止或减缓 ATT&CK（攻击者）的意图（列标题）。为了构建正确的防御\
  \ set，理解攻击者正试图实现什么（意图）是有帮助的。防止机制被成功利用成为每项防御的目的。正如我们之前看到的，防御措施与漏洞并不是一对一（1:1）相绑的。某些防御可以关闭多种机制，而另一些则可能仅警告某种攻击技术已被尝试。尽管如此，如果不了解实际的机制（有时，还包括位于每个高级类别条目树中分支中的细节），人们将被迫进行猜测。\n\
  \n“加密是安全的；也许我们应该对传输中的数据进行加密。”遗憾的是，这种说法在开发过程中经常出现。相反，如果知道数据正在通过不可信的网络移动不是很有用吗？或者没用？而且攻击者可能会通过“破坏（破坏）访问控制”来“收集并分析信息”呢？现在我们知道，双向身份验证的\
  \ `TLS` 可能作为一种防御机制值得考虑。攻击者将不得不“参与欺骗性交互”（中间人攻击），如果在如果在 `TLS` 身份验证交换期间提供的 `X.509`\
  \ 证书处理得当，那么连接的两端都会产生错误。我诚诚地希望，这两个易于获取的资源在这种出乎意料的方式结合时，可以提供一些组织性和洞察力——即正确识别系统需要抵御的那些攻击所需的指导。我在我的威胁建模课程中经常使用这种范式；轶事证据表明这种方法对参会者来说很有用。\n\
  \n通过查阅已添加到 ATT&CK® Navigator 中的攻击，可以找到更全面的初始访问技术列表。\n\n为了接管一台机器以便在其普通用户或所有者不知情的情况下使用它（例如，作为僵尸网络的一部分），攻击者必须组合一个或多个跳板、系统目标，使得攻击者能够在主机及其操作系统上获得足够的权限，以安装能够跨重启（reboots）持续存在的命令控制软件。这些目标是攻击者通过利用技术“机制”获得的“意图”。\n\
  \n例如，一个允许“攻击者选择的代码”的漏洞实际上并不足够，除非该利用能够与权限提升相结合，以控制操作系统（以及主机）。（在攻击者从高权限级别开始的场景中，不需要进行提升。）在受害者运行的权限不足以安装高权限软件的情况下，攻击者不仅必须执行代码，还必须找到增加权限的方法，以便攻击者的命令控制软件可以安装并运行。在这个微不足道的例子中，攻击者可能需要利用三个三个四个系统目标才能成功获得对机器的持久控制：\n\
  \n1. 找到交付代码的方法。\n2. 让负载在受害者机器上运行。\n3. 创建一个提升到操作系统级别以上的能力。\n4. 与攻击者建立通信。\n5. 可能会下载额外的代码以实现持久化。\n\
  \n#### 4.4.1.5 持续威胁项目\n\nBrook 最喜欢的、相对较新的威胁建模方法之一是 Autodesk 的持续威胁建模（Continuous Threat\
  \ Modeling）。该项目有几个有趣的方面；我们建议希望增加威胁建模深度的人查看来自 `https://github.com/Autodesk/continuous-threat-modeling`\
  \ 提供的所有资源。特别值得 Izar Tarandach 的 `pytm` 威胁建模工具。贡献者正在向该工具添加新威胁以增加其覆盖范围。\n\n我们认为该项目的“安全开发者清单”（Secure\
  \ Developer Checklist）为设计时的安全决策提供了宝贵且迫切的资源。安全开发者清单采取了另一种威胁建模方法：设计模式对比攻击建模。大多数设计都会遇到常见的安全问题：\n\
  \n- 添加了更改敏感属性或对象的的功能\n- 创建了新的进程或参与者\n- 使用了加密\n- 添加了嵌入组件\n- 从不可信源接收不受控制的输入\n- 添加了\
  \ Web（或类似 Web、REST）功能\n- 通过网络传输数据\n- 创建了计算密集或存储密集型进程\n- 创建了安装或补丁能力\n- 创建了命令行解释器（CLI）或作为进程的一部分执行系统命令\n\
  - 添加了可以破坏、更改或使客户数据和/或系统资源失效\n- 添加了日志记录\n\n\n\n\n\n此清单提供了安全设计模式，这些模式将增强安全性并避免在构建过程中引入弱性。列表由软件设计中反复出现的典型问题和领域组成，以及相关的方法和手段，这些方法为设计阶段的问题提供了行业最佳实践的防御。“如果你遇到这种情况，请执行此操作。”下面给出了第一个问题及相关的解决方案：\n\
  \n> *如果你执行了以下操作：添加了更改系统中敏感属性或对象的功能，那么：使用身份验证进行保护——你必须确保所有新功能都受到身份验证的保护。使用 SAML、OAuth\
  \ 等强身份验证机制，验证个人、实体或服务器的身份与其声明相符。*\n\n在上述清单的引言中，该安全模式是针对第一个问题收集的六种模式之一。也就是说，对于敏感属性或对象的更改，根据更改的具体细节，这六种解决方案中的任何一个或多个都可能适用。\n\
  \n《安全开发者清单》并没有消除对威胁建模的需求。它消除的是对每个潜在弱性都进行建模的需求。相反，可以避免典型的弱性，使得威胁模型能够集中在独特的、局部的、复杂的、不寻的以及新的（或不在清单中的！）问题上。\n\
  \n***\n\n* Tarandach, I., Schoenfield, A., 以及 Autodesk 产品安全团队, 等. (2019). 取自 [`github.com/Autodesk/continuous-threat-modeling/blob/master/Secure_Developer_Checklist.md`](https://github.com/)\n\
  \n† 同上。\n\n作者们一直希望有人能发布一套安全设计模式。《安全开发者清单》是迈向这一目标积极的一步。\n\n### 4.4.1.6 OWASP® 威胁建模\n\
  \n对于 Web 架构，开放 Web 应用安全项目（OWASP）的威胁建模资源会有很大帮助。OWASP 编译了一套非常详尽的威胁建模文档，包括教程、指南、威胁库，甚至还有一个开源威胁建模工具\
  \ `Threat Dragon`。（不过，在写本文时，`Threat Dragon` 可用的威胁数量仍然相当有限。通常，人们必须编写自己的威胁库。）（请参见\
  \ [`owasp.org/www-community/Application_Threat_Modeling`](https://owasp.org/www-community/Application_Threat_Modeling)）\n\
  \n### 4.4.2 结构、细节与抽象\n\n> 熟练的安全架构师通常至少对系统架构有一定的了解——即定义大规模系统结构的实践。如果无法理解架构本身，又如何对架构进行充分分解以提供安全智慧呢？安全架构实践中隐含了对架构师得出架构过程的掌握，以及对系统结构如何设计的牢实掌握。通常，安全架构师在设计各种类型的计算机系统方面具有丰富的经验。（*Securing\
  \ Systems*, 第 10 页）\n\n正如我们上面提到的，我们必须首先理解目标系统（处于威胁模型分析下的系统）的结构。识别已证明反复存在弱性和漏洞的区域和语言可以使分析集中。以下是一个值得参考的良好列表：\n\
  \n* **旧代码**：旧代码可能比新代码更多的漏洞，因为新代码通常反映了对安全问题的更好理解。所有“遗留”代码都应该经过深度审查。\n* **默认运行的代码**：攻击者经常针对默认运行的已安装代码。此类代码应该比不默认执行的代码进行更早、更深层次的审查。默认运行的代码会增加应用程序的攻击面。\n\
  * **在特权上下文运行的代码**：以特权身份运行的代码（例如 `nix` 中的 `root`）也需要更早、更深层次的审查，因为代码身份是攻击面的另一个组件。\n\
  * **匿名访问的代码**：匿名用户可以访问的代码，其审查深度应比只有有效用户和管理员才能访问的代码更深。\n* **在全局访问的网络接口上监听的代码**：默认在网络上（尤其是像互联网这样不受控的网络）上监听的代码面临着巨大的风险，必须对安全漏洞进行深度审查。\n\
  * **用 C / C++ / 汇编语言编写的代码**：由于这些语言可以直接访问内存，代码中的缓冲区操作漏洞可能导致缓冲区溢出，通常会导致恶意代码执行。对这些语言编写的代码应针对缓冲区溢出漏洞进行深度分析。\n\
  * **有漏洞历史的代码**：过去出现过许多安全漏洞的代码应该引起疑虑，除非能够证明这些漏洞已被有效移除。\n* **处理敏感数据的代码**：应对处理敏感数据的代码进行分析，以确保代码中的弱性不会将此类数据泄露给不可信的用户。\n\
  * **复杂代码**：复杂代码的 Bug 概率更高，难以理解，并且可能有更多漏洞。\n* **频繁更改的代码**：经常更改的代码经常引入新 Bug。并非所有 Bug\
  \ 都是安全漏洞，但与更新频率很低的稳定代码集相比，不稳定的代码可能会有更多漏洞。对上述列表中的每个项目进行更严格的审查，将识别出特定系统中攻击者更有可能利用任何弱性和问题的地方。如果存在这些条件中的任何一个，这些就是系统和技术中需要深挖并彻底理解点。我们补充说，所有允许（更糟的是要求）直接操作内存的语言都存在与\
  \ Michael Howard 在上述列表中列出的 `C/C++/assembly` 许多相似的机会。\n\n架构分析和分解的艺术是威胁建模的基础。我们必须弄清楚攻击路径、攻击的哪些地方，然后这些“地方”（即攻击面）如何允许攻击继续向中间“系统目标”演进，并在成功后实现攻击者的终极目标。\n\
  \n“威胁被应用于通过分解架构所暴露的攻击面。架构被‘拆解’为它的逻辑组件——逻辑组件的输入以及组件之间的通信流。”（*Securing Systems*, 第\
  \ 32 页）\n\n> 为了针对攻击面正确对架构进行拆解，需要回答的问题是：组件在何种特定程度上可以被视为原子的？换句话说，分析应该多深层次地分解架构？什么内容构成了混淆视图的无意义细节？\n\
  \n\n\n\n\n任何在进程启动后加入运行进程的可执行包，都是该可执行文件的攻击点，甚至可能是操作系统的攻击点。当攻击目标是机器或虚拟机本身时，这一点尤为真实。请记住，某些网络犯罪通过租用“僵尸网络”（由攻击者控制的机器网络）为生。对于这种攻击目标，机器被攻破本身就具有攻击者的价值（无需发布进一步的攻击，如按键记录或捕获用户会话）。在高级持续威胁（APT）的世界中，攻击者可能希望控制内部服务器作为滩头，即一个从其发起进一步攻击的内部机器。取决于入侵检测服务（IDS）的架构，如果攻击来自内部机器，这些来自内部的攻击可能会被忽略。与僵尸网络入侵一样，APT\
  \ 攻击者专注于获取底层的计算机操作系统环境并颠覆 `OS` 以实现其目的。\n\n探测典型计算机操作系统的权限级别有助于我们深入研究分解问题。在保护一个操作环境（如用户的笔记本电脑或移动手机）时，我们必须分解到可执行文件和/或进程边界。漏洞的存在，特别是允许攻击者执行其选择代码的溢出或边界条件漏洞，意味着一个进程可能被用于对其他所有进程，特别是该进程被隐式信任时。（*Securing\
  \ Systems*, 第 81-82 页）\n\n在 *Securing Systems* 中，Brook 提出架构分解分为有时相互交叠、但在其他情况下属于不同视图（及具体性）的结构细节：\n\
  \n- **可攻击面**：攻击者可能进入系统以启动其利用过程的点\n- **可防御边界**：系统内部或其边界处可以实施防御机制（控制）和缓解措施的点\n\n当我们考虑哪些攻击可能具有成功的潜力（并导致损害）时，我们像攻击者一样思考，因为攻击者必须首先找到任何弱点。他们从哪里开始？建立滩头后，下一步是什么，最重要的是，在哪里？Brook\
  \ 在 *Securing Systems* 中提出了一些指导建议：\n\n> 必须将一个独立运行的终端架构（或子组件）分解到每个进程空间的粒度，以便建立信任边界、攻击面和可防御边界。正如我们所看到的，在其他场景下，这种粒度深度可能是不必要的。如果你还记得，我们能够通常地将用户的浏览器视为原子的，仅仅是因为整个终端是不可信的。我再次强调：是架构的语境决定了特定组件是否需要进一步分解。\n\
  \n> 对于没有存在重大额外外部保护的操作系统的通用情况，待分析的系统可以分解为可执行进程和动态加载的库。一个实用的指南是将架构分解到可执行二进制包的级别。显然，一个可加载的“程序”，当它被操作系统执行时将被放置在通常给可执行二进制包的任何运行时空间中，可以被视为一个原子单元。与操作系统以及与其他可执行进程的通信随后可以作为可能的攻击向量进行检查。（*Securing\
  \ Systems*, 第 83-84 页）\n\n简而言之，在保护终端软件时，我们通常称为“应用程序”的集合中，相互通信的部分存在攻击面和可防御边界。对于云应用程序，每个逻辑功能和通信层可能就足够了，因为云提供商应该尽尽全力地掩盖底层的支持技术和组件。主要云供应商实施的虚拟分层设计是为了防止托管组件超出虚拟环境的边界。由于组件通常是水平扩展的，也就是说，为了支持所需的负载，会精确复制所需的实例数量，因此我们认为每个组件都已充分分解。实例并不重要。破坏一个，就破坏了所有。\n\
  \n> 在受托管服务器环境中，分解可能会有所不同。区别完全取决于保护措施是否充分，使得这些保护使得二进制包的简单替换变得非常困难。部署在此类服务器基础设施上的管理控制可能非常严格：\n\
  \n- 强身份验证\n- 对身份验证凭据的仔细保护\n- 敏感操作的授权\n- 基于需需知原则的访问\n- 仅在证明有访问需求时授予访问权限\n- 证明信任后授予访问（仅限高度可信的人员）\n\
  - 不同层次和任务集之间的职责分离\n- 敏感操作的日志记录和监控\n- 管理访问的地址范围限制（网络或其他限制）\n- 带有服务水平协议（SLAs）涵盖补丁时间的补丁管理程序\n\
  - 受限制且经过验证的二进制部署程序\n- 针对攻击系统的标准加固\n\n上述列表是良好管理的商业服务器环境中典型保护措施的示例。此列表并非旨在穷尽，而是具有代表性和/或是典型且常的。要点在于，当\
  \ `OS` 之外存在重大的外部保护时，在进行可执行层面的攻击之前必须攻破这些保护，那么将整个服务器甚至服务器群视为原子就是成为可能的，特别是当所有服务器都支持相同的逻辑功能时。也就是说，如果\
  \ 300 台服务器都用作应用程序服务器，且对这些服务器的访问有重大的保护，那么“应用程序服务器”就可以被视为单个组件。（*Securing Systems*,\
  \ 第 93 页）\n\n> 需要可执行文件内部分解的特殊情况包括：\n\n- 加密代码\n- 处理或检索秘密的代码\n- 数字版权管理 (DRM) 代码\n\
  - 软件许可代码\n- 系统信任边界\n- 权限边界\n\n只要在可执行文件内隔离特定功能具有重大的攻击价值，那么这些离散函数就应该被视为原子函数。当然，这条规则的假设条件是，攻击者可以获得运行中的二进制文件的访问，使其有足够的权限在代码对象或补丁（gadget）级别上工作。如上述所述，如果这段“异常”代码运行在高度保护的环境中，通常没有必要将代码分解到这一水平（请注意上述保护措施列表）。另一方面，如果检索秘密或执行解密的代码必须存在于未保护的终端上，那么在那种情况下，该代码将没有多少保护。此时，必须在特定的代码函数或对象级别上考虑保护。某些\
  \ DRM 系统正是以这种方式保护的；保护措施围绕并隐藏了封装的可执行二进制文件内的 DRM 代码。（*Securing Systems*, 第 94-95 页）\n\
  \n\n\n\n上述内容说明了为什么分解程度取决于所分析的系统。没有所谓的“一刀切”。事实上，尽管存在一些通用指南，但系统预期的安全态势也是决定调查深度的因素之一。\n\
  \n我们希望至少向读者介绍了架构分析与分解的这门精艺术。显而易见，威胁建模的有效性建立在软件和系统架构实践的基础之上。希望进一步提升技能的人，建议学习应用于和实践于软件的架构科学、工程和艺术。特别是正如\
  \ Brook 在其他地方提到的，企业架构的实践已有详尽记录，并且也有经验丰富的从业人员可以提供帮助。我们，这些作者，从有幸合作过的许多优秀企业架构师身上受益匪浅。\n\
  \n### 4.4.3 风险评分\n\n> 评估的成功在很大程度上取决于评估人员计算或评估系统风险的能力。既有系统在评估时规划的风险，也有每个攻击向量对系统安全态势造成的风险。最重要的是，必须以某种方式确定系统对组织带来的风险。如果不能以一种合理且持续一致的方式计算计算机安全风险，那么不仅任何特定的评估都会失败，而且整个评估计划都会失败。理解、解释并最终交付风险评分是架构风险评估\
  \ (ARA) 和威胁建模的核心任务。\n\n> “风险”一词被过度使用且定义不当。在讨论它时，我们通常并不费意严格定义它的含义；“风险”被到处提及，仿佛每个人对它都有坚定的理解。但用法往往是无区别的。出于安全评估的目的，工作性定义必须更严谨……让我们像\
  \ Jack Jones 那样来解释“风险”：“与系统相关的损失敞口。”这个工作性定义涵盖了计算机事件发生的可能性及其负面影响。（“*Securing Systems*,\
  \ p. 101”）\n\n#### 什么是“风险”？\n\n> *一种能够影响（抑制、增强或令人产生怀疑）使命、战略、项目、日常操作、目标、核心流程、关键依赖和/或利益相关者期望交付的事件。*（*Securing\
  \ Systems*, p. 107）\n\n但是如何在跨项目、跨架构，重要的是通过多个从业人员有效地且持续地对风险进行评分？自从作者们参与以来，这个问题一直困扰着信息安全从业人员。很多时候，评分取决于局面让评分者感到多么不适。个人的风险承受度既不一致也不可重复。我们已经经历过这种不一致性带来的后果：项目团队“挑选”安全人员，以获得最好、最有利（通常是最低）的风险评分。这不是一个良好的状况。\n\
  \n微软在使用 STRIDE 的同时还使用了 DREAD，我们已经审查过 STRIDE。DREAD 已被广泛采用，特别是在大型组织中。\n\n* **D**amage\
  \ potential（损害潜力：资产受影响有多大？）\n* **R**eproducibility（可重复性：攻击多容易被重复？）\n* **E**xploitability（可利用性：攻击多容易被启动？）\n\
  * **A**ffected users（受影响的用户：受影响的用户有多少？）\n* **D**iscoverability（可发现性：漏洞多容易被发现？）\n\
  \n> *评分不需要使用大型量表，因为这使得在与其他威胁对比时很难保持评分一致。你可以使用简单的方案，例如高 (1)、中 (2) 和低 (3)。*\n\n> *在回答上述问题后，为给定的威胁计算值（1-3）。结果可以在\
  \ 5-15 的范围内。然后，你可以将总分为 12-15 分的威胁视为高风险，8-11 分视为中风险，5-7 分视为低风险。*\n\nDREAD 尝试让团队对潜在危害达成共识。除了信息风险因素分析（FAIR，即\
  \ Open Group 标准）中使用的赌场数学方法外，大多数方法可能仍然需要一些定性判断；鉴于当今信息风险实践的现状，似乎没有避开定性排名的方法。此外，在威胁建模中，我们发现有快速对任何数量（通常是多个）CAV\
  \ 进行风险评分。遗憾的是，运行诸如 FAIR 风险模拟所需的设置对于大多数组织的威胁建模需求来说太长了，这可能就是 DREAD 被采用的原因。\n\nJones,\
  \ J. A. (2005). An Introduction to Factor Analysis of Information Risk (FAIR).”\
  \ Risk Management Insight LLC. Retrieved from `http://riskmanagementinsight.com/media/documents/FAIR_Introduction`\n\
  \nHopkin, P. (2005). *Implementing Risk Management*, 2nd ed. Institute of Risk Management\
  \ (IRM). Kogan Page, p. 14.\n\nMeier, J. D., Mackman, A., Dunner, M., Vasireddy,\
  \ S., Escamilla, R., and Murukan, A. (2003, June). Microsoft Corporation. Retrieved\
  \ from `https://docs.microsoft.com/en-us/previous-versions/msp`\n\n在任何情况下都不应使用的方法是通用漏洞评分系统\
  \ (CVSS)，因为它并不是为风险评分设计的，而是为了通过一致地评分严重性作为严重程度的快速指标。CVSS 的设计者从未想象过它会被作为风险的替代品。遗憾的是，相当悲哀的是，CVSS\
  \ 作为风险评分被广泛采用。我们希望事实如此，因为 CVSS 有几个重要的局限性。Brook 在其他地方写过关于 CVSS 的问题。鼓励感兴趣的读者可以在网上搜索博客文章，或阅读\
  \ *Secrets of a Cyber Security Architect* 中的 CVSS 分析（第 72 页和附录 C）。\n\n在 *Securing\
  \ Systems* 中，Brook 提供了一种简单但经过实地测试和证明的评分方法——足够好风险评分 (JGERR)。JGERR 是 Brook 和 Vinay\
  \ Bansal（思科系统公司卓越工程师）作为 FAIR 的简化版而发明的。\n\n> **可信攻击向量*影响 = 风险评分**\n\n> 其中\n\n>> *可信攻击向量\
  \ (CAV) = 0 < CAV > 1*\n\n>\n\n> *Impact = 位于预定范围内的序数，使得 0 < Impact > 预定限制（例如：0\
  \ < Impact > 500）*（*Securing Systems*, p. 105）\n\n>\n\n> CAV 由一组术语组成。在 *Securing\
  \ Systems* 中，这些术语被给出：\n\n> – 威胁 (Threat)\n> – 敞口 (Exposure)\n> – 漏洞 (Vulnerability)\n\
  > – 影响 (Impact)\n\n>\n\n> 从那时起，威胁被拆分为“威胁主体 (Threat Agent)”和“能力 (Capability)”，重新定义\
  \ CAV 为：\n\n> – 威胁主体 (Threat Agent)\n> – 能力 (Capability)\n> – 敞口 (Exposure)\n> –\
  \ 漏洞 (Vulnerability)\n> – 影响 (Impact)\n\n\n\n\n自从创建了 `JGERR`† 并在 *Securing Systems*\
  \ 的第 4 章中对其进行了更充分的解释后，我们发现“威胁”（Threat）一词实际上被过度泛化了。`Threat` 包含了两个不同的部分：一个具有攻击动机的活跃人类实体（个人、组织、企业，出于特定的原因和目标，请参阅\
  \ *Secrets of a Cyber Security Architect* 中的攻击者矩阵 \\[第 2 章\\]），以及在采取行动之前必须具备技术能力来利用漏洞的威胁主体（threat\
  \ agent）。例如，在尚未发明利用程序且威胁主体尚未意识到某个漏洞的情况下，我们可以相对安全地假设，即使是具有动机的活跃的威胁主体，尚不具备利用未知且尚未被利用漏洞的能力。因此，威胁主体尚未获得执行利用所需的能力。\n\
  \n___\n\n* 作者们从第一个版本发布之前就开始使用 `CVSS` 了。原始设计者之一与 Brook 处于同一团队，他们曾就 `CVSS` 的目的进行交流。在该职位上，Brook\
  \ 被要求在 `CVSS` 1.0 版本之前的测试 测试测试中，对接收到的漏洞进行评分。\n\n† 共同创建者兼合著者 Vinay Bansal 和 Brook\
  \ 在 2011 年为 SANS 学院智能指南将 `JGERR` Formal 化。`JGERR` 曾是且仍然是 Cisco Infosec 应用安全所使用的风险评分方法。`JGERR`\
  \ 或其后代方法也被其他企业使用。由于 James 和 Brook 都曾在思科工作过，我们确定已经收集了数千个 `JGERR` 评分——这些评分自 2009 年以来一直被有效使用。\n\
  \n事实上，某些威胁主体专注于（或许偏好或必须使用）为人知的且已编程的利用代码。此类代码被称为“武器化的”（weaponized），可以在利用包（`EK`）中找到，这些工具包可能是开源的，但在黑暗网上也有出售。威胁主体可能缺乏生成自己利用程序的技术造诣，因此被迫使用那些已经编写好的。依赖\
  \ `EK` 的另一个驱动因素是研发（`R&D`）的成本。对于网络罪分子来说，使用 `EK` 比投资开发利用程序要廉得多。互联网上可利用的条件依然大量，未打补丁的操作系统和应用程序也随处可见。既然旧且经过验证的方法就能带来丰丰的财务回报，为什么要浪费时间和金钱去尝试新事物呢？\n\
  \n因此，“能力”（Capability）是评估任何特定攻击场景发生概率评分中的一个重要维度。\n\n存在一组条件，每个条件都必须同时成立，才会产生重大的计算机安全风险。如果其中任何一个条件不成立，即该条件不成立。\n\
  \n\n\n\n\n我们对概率评分取平均值。这是因为，如果威胁攻击者针对现有漏洞（再次假设为 .9）表现得非常活跃（比如，假设为 .9），这种威胁可能通过获取漏洞利用工具的难度，以及一套能够阻止或减缓该问题执行的现有防御措施（假设每项难度均为\
  \ .2）而得到缓解，从而导致如下评分：\n\n> .9 + .9 + .2 + .2 / 4 =.775\n\n但我们还没有计算评分。\n\n`Risk =\
  \ Probability * Loss`\n\n或者在 `JGERR` 的情况下：\n\n> `Risk Rating = CAV * Impact Harm\
  \ Level`\n\n我们发现，建立一套影响危害评分是非常容易的。只需选择一个刻度即可。刻度的范围并不重要：1-10、10-100、1-500、500 万美元到\
  \ 10 亿美元：选择一个粒度即可。刻度越宽，达到的粒度就越大。但事实证明，更宽的范围并不一定带来真正更大的粒度，因为在任何选定的范围内建立危害分桶（buckets）都更直观。在实践中，人们会很快习惯所选的刻度。我们发现，只要根据需求对影响进行一致评分，影响刻度所确定的范围并不重要。\n\
  \n***\n\n当 Brook 在思科（Cisco Systems, Inc.）领导网络应用程序和基础设施安全时，思科财务部门告诉他，低于 500 万美元的损失在企业层面基本上是微不足道的。我们重现了当年思科的财务规模。从那时起，情况可能已经发生了变化。\n\
  \n在 1-10 的刻度上，假设对一个或两个用户的危害可能评为 1，而大多数面向客户的服务持续一周中断将评为 10。人们将根据所选的任何刻度，以这种方式识别潜在的组织以及系统特有的影响。\n\
  \n除去风险评分之外，大部分危害评分可以在威胁建模之前的先验（a priori）完成。可能存在少数特定于系统的危害。但我们发现，许多危害是显而易见的，因此可以在启动威胁建模计划期间进行评分。经验告诉，创建危害评分并不困难；这项工作只需要一些时间和关注。\n\
  \n> `JGERR 风险此时可以被一致地量化：`\n\n> `Risk Rating = CAV * Impact Rating`\n\n`JGERR` 并不自称是真正的风险计算。在缺乏根据成功攻破数据建立的精算表的情况下，我们要么必须使用像\
  \ `FAIR` 那样的巧妙数学方法，要么明确自己正在量化的确切内容以及是如何做的。`JGERR` 提供了一种基于坚实风险概念的一致方法。尽管如此，你得到的数字（或者说\
  \ `JGERR` 未量化的评分）并不是“风险”。它仅仅是针对威胁建模的特定情况的诊断。\n\n如果需要，`JGERR` 也可以针对漏洞分析进行调整。`CAV`\
  \ 分桶需要与我们在本节中展示的有所不同。作为一种实践，每种漏洞管理方法都必须从通用漏洞评分系统（`CVSS`）开始。`CVSS` 是行业标准，是漏洞交换和讨论的*通用语言*（lingua\
  \ franca*）。我们一直将 `CVSS` 作为起点，然后对其进行修改，或将 `CVSS` 折叠到另一个评分系统（如 `JGERR`）中用于漏洞。我们将在后续章节进一步讨论漏洞管理。\n\
  \n我们建议（正如我们在上面所做的），最重要的漏洞分析将始终是攻击者利用漏洞的效用/价值。我们利用这一维度来过滤掉那些无法达到攻击者所需的效用标准的攻击场景和漏洞。如果攻击者价值低或没有价值，利用提供的收益不足以付出精力。在我们的项目中，我们尽量不将时间浪费在对攻击者产生极小或不显著收益的问题上。\n\
  \n### 4.4.4 识别防御措施\n\n#### 什么系统该用什么防御？\n\n> 精练的安全架构师必须知道如何防止成功的攻击。攻击硬币的另一面是防御的面。完整的安全架构周期涉及对攻击进行规划，并指定那些能够防止特定攻击，或至少让攻击的执行变得足够困难，以阻止成功，或至少将攻击减慢到足以在攻破完成前捕获入侵的防御。（*Secrets*，第\
  \ 47 页）\n\n一旦我们确定了一组可靠的攻击场景，我们就必须完全理解攻击场景中各个步骤将采用的各种机制。我们不需要理解利用特定漏洞的精确计算机指令的可利用细节。那些细节对于构建安全技术（如扫描器）以及对于熟练的手工渗透测试人员来说至关重要。为了寻找合理的防御措施，我们需要理解机制以及它们的工作原理，同样重要的是，哪些措施阻止、增加利用难度或至少提醒攻击正在进行。\n\
  \n理解利用机制构成了威胁建模工程的一个方面，即威胁建模的“科学”。如果我们不理解攻击者在我们的系统中误用或滥用了什么，利用的计算机科学是什么，以及受害者是谁，我们可能无法为该场景应用正确的防御。\n\
  \n例如，不熟悉攻击细节的架构师可能认为使用依赖于传输层安全（`TLS`）服务的安全传输协议（`HTTPS`）“保护”了他们的应用程序。然而，大多数网站使用的标准\
  \ `HTTPS` 只保护用户浏览器和服务器之间传输的数据，前提双方都正确使用，包括用户端的正确使用！这对于不熟悉 `HTTPS` 的人来说可能会感到惊讶。\n\
  \n`HTTPS` 已经深度融入我们的网络使用中，以至于用户通常不懂它提供了什么，没有提供什么。当从浏览器收到“无法识别服务器”的错误时，可能是服务器 IP 地址与证书之间不匹配，因为服务提供商没有注册他们使用的所有地址。如果该\
  \ IP 确实属于该服务，这并不可担心。\n\n但“证书无效”错误可能指示着中间人（`MitM`）攻击。你在酒店和机场经常看到这些错误，那里的 WiFi 在将流量传递到互联网之前对其进行了截获（例如在向广告赞助商提供电子邮件地址之前）。连接设备上的应用程序会在连接过程完成前获取\
  \ WiFi 的自签名证书。在这种情况下，攻击者可能控制了中间 WiFi。存在明显的 `MitM` 风险，即恶意分子控制了证书并控制了所谓的保护。\n\n此外，标准\
  \ `HTTPS` 提供的仅仅保证了与证书注册的 IP 地址向浏览器提供了针对这些 IP 地址颁发的证书。由于免费的 `HTTPS` 证书随处可用，攻击者获取\
  \ IP 地址和匹配证书并不困难。证书颁发机构对证书持有者的信誉或对发送证书的服务器不作任何陈述！\n\n\n\n\n对于知名度不高的网站，无法保证没有人在中间对流量进行解密，或者他们完全是恶意的。网络用户：注意！\
  \ 如果你不了解 `X509` 证书及其在服务器认证方面的用途，请不要直接接受该证书错误。浏览器上那个小锁头图标并不意味着什么，我们很遗憾地告知。\n\n典型的\
  \ HTTPS 如果执行得当，可以提供服务器端的 IP 地址保证，从而在不可信的网络（如敌对性的 Internet）中实现加密保护。但即便如此，它可能并不像看起来那样，因为浏览器可以向下协商到脆弱的\
  \ `TLS/SSL` 版本，以及更弱甚至已破解的加密标准。软件架构师不能认为仅仅因为实现了某种形式的 `HTTPS`，他们的应用程序就是“安全”的。我们希望这个长例子能说明魔鬼隐藏在技术细节之中。人们必须理解攻击机制。例如，作为\
  \ HTTPS 中间件呈现备证书，允许中间人（MitM）攻击者查看甚至控制浏览器与服务之间的流量。\n\n###《网络安全架构师的秘密》（*Secrets of\
  \ a Cyber Security Architect*）第三章正关注这个问题：威胁建模人员在技术上需要理解什么，哪些是无关的？我们建议希望深入研究这一主题的读者从该章开始，该章以著名的“心脏溢血”（Heartbleed）漏洞为例。\n\
  \n> 我们无法期望控制或缓解措施与攻击之间存在 1 对 1 的映射，尽管当然，某些缓解措施是 1 对 1 的。（《系统安全》（*Securing Systems*），第\
  \ 165 页）\n\n遗憾的是，在任何特定情况下现有的缓解措施与我们必须应对的攻击之间缺乏 1:1 的映射，这给威胁建模人员带来了一个相当棘手的问题。由于软件栈中可能遭受攻击的各个层级之间的相互作用，复杂性迅速增加。防御者必须考虑一个基本事实：攻击者寻找不同的目标，但也具有机会主义性。一旦出现计划之外的目标，攻击者可能会利用这个额外的缺口。正如我们在书籍、论文、全球各地舞台的演讲以及大学的客座讲座中所提到的：攻击者具有适应性和创造力。攻击并不一定是一心一意的或紧密聚焦的：有些是，有些则不是。因此，我们不能掉入只考虑单一角度的陷阱。\n\
  \n防御任何特定的攻击场景可能涉及在攻击预期路径上部署安全控制措施。某些控制措施（如防火墙）将位于边界、网络管道中，而另一些可能必须在应用程序中单独编码，或者在所采用的技术的任何地方。东西向、南北向、前后向、顶底部：控制措施可能需要存在任何地方，无论使用用于可视化和讨论受保护系统的何种维度。\n\
  \n###《系统安全》（*Securing Systems*）第五章介绍了一个虚拟的 Web 商店 `Web-Sock-A-Rama`，为通过 `ATASM`\
  \ 结构探索威胁建模提供了一个示例系统。尽管完成此类系统威胁建模的防御和缓解措施远超本威胁建模引论的范围，但我们可以使用这个 Web 商店的例子来说明攻击场景到防御的复杂性。图\
  \ 4.11（原图 6.7）提供了一个……\n\n\n\n尽管如此，还有其他需要仔细考虑的攻击向量。我们的网络和主机攻击者不会通过常规和预期的通道来发起攻击。一旦在网络设备和/或主机上建立了了滩头堡，他们可能会开始探测，看看他们还能发现其他什么。他们可能会捕获身份验证流量。此类流量通常包含某种形式的凭据，无论是\
  \ `X509` 证书、密码哈希值或其他凭据。（一旦拥有了密码哈希值，目前的暴力破解密码技术通常可以快速破解除最强密码外以外的所有密码。）攻击者可能会监听数据交换。在我们虚构的网站中，身份验证数据库的更新会定期从用户配置存储器推送。如果攻击者掌握了数据必须流经的网络设备，他们就不需要破坏源数据或目标存储库。由于处于可以被认为是内部网络的环境中，攻击者可能会监听管理身份验证，从而获得对更敏感设备的控制权，例如应用程序服务器本身。上述任何内容都完全没有利用系统预期的客户使用用例。\n\
  \n### 保护网络设备\n\n为了保护网络设备，我们将使访问用户界面和管理组件变得困难，在允许访问之前需要多个身份验证器，或许还会限制可以访问设备的网络，并且肯定会限制用户访问仅限于那些证明了良好保护其访问安全技能的人员。这个解释太短，无法详尽列出保护网络设备的所有典型措施。（请参阅\
  \ *Securing Systems* 第 5 和第 6 章以获取更多细节。）\n\n除了限制用户访问外，我们还将采用网络限制，使得只有那些具有特定需求的主机（最好是应用程序）可以访问敏感数据。其他所有项均被禁止。通过这种方式，即使某些相对不重要且不参与的、具有其他用途（例如公司博客）的主机发生丢失，也不会被滥用来获取我们必须保护的数据存储。\n\
  \n我们必须发散性地考虑系统使用用例之外的攻击场景。我们的防御必须考虑到保护我们的基础设施，以及可能为对其他目标感兴趣的攻击者提供乘之机会的侵害。\n\n###\
  \ 理解攻击者目标\n\n一套完备防御的基础是对针对类似系统（在本例中为 Web 商店）所示的各种攻击类型和攻击者目标的全面理解。每种攻击者类型都有典型的目标（关于攻击者目标和能力的深入分析，请参阅《攻击者矩阵》，表\
  \ 1.2，第 14 页 [[[第 1 章]，并参阅 *Secrets of a Cyber Security Architect* 书中)）。某些攻击者目标被映射到滥用目标系统的预期功能上。但其他目标与系统的目的、其使用用例，甚至与其利益相关者对系统的兴趣毫无关系（正如我们在上面看到的路由器和僵尸网络租赁方案）。是的，分析师必须考虑系统功能如何被滥用。此外，还必须考虑其他典型的攻击者目标。如果其中任何一个被证明是相关的因此值得防御，那么就必须对防御进行深思。\n\
  \n我们希望上述内容至少一点点说明了构建真正的深度防御的复杂性。正如我们在上面提到的，防御和攻击并不一定是 1 对 1 的对应关系，即每种类型的攻击对应一种单一防御。我们必须寻找方法增加利用成本、关闭攻击可能性的技术、迫使攻击者切换战术、让他们对下一步感到困惑的方法，并且至少在重大损害发生之前尝试在他们行事时抓获他们。\n\
  \n> 正如我们之前看到的，一旦我们确定了认为将针对系统的攻击，接下来的任务就是构建一套最合适的适当防御。但人们如何获得这套知识呢？\n\n> 人可能会采取“随大流”的方法。有很多标准可以遵循：只需按照标准完成所有事情，以及人类所能做的一切。受尊敬的\
  \ `NIST 800-53`（修订版 53ARev4*）包含了 170 项控制措施。实施其中的每项可能是一种安全的方法，以避免额外的分析。但很好地实施 800-53\
  \ 的每项控制将是非常昂贵的，可能到令人无法企及。此外，如果没有额外的分析，就不知道哪些控制是适用的，哪些在上下文中是无关的。\n\n> `NIST 800-53`\
  \ 是几乎所有构成信息安全控制和过程的内容的杂烩。`AC-5`，`职责分离`（Separation of Duties）是一种旨在瓦败欺诈和合谋行为的设计原则。其想法是，让*一组*人实施欺诈变得较困难，特别是当这个小组不是特别团结时。在同一控制族中的\
  \ `AC-7`，`失败的登录尝试`（Unsuccessful Logon Attempts）是一个常见的滥用指示器：当攻击者试图暴力破解密码时，会出现异常数量的失败登录。该控制措施是限制尝试次数，通常在某个给定的时间段内。\n\
  \n> 对于一家非常小的公司来说，职责分离没有意义。每个人已经知道其他人在做什么。表现不佳的人通常会被其他负责人发现，这些负责人通常会密切观察彼此的行为。我称之为“眼对眼安全（eyeball-to-eyeball\
  \ security）”。它在规模小、关系紧密、协作密切的团队中效果相当良好。此外，在初创阶段，极小创始人团队的每个人履行多个组织角色是非常典型的。没有足够的人来在他们之间“分离”职责。但眼对眼安全在适用正式职责分离策略的企业规模下并不适用。\n\
  \n\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\n* 检索自 [`nvd.nist.gov/800-53/rev4/imp-act`](https://nvd.nist.gov/800-53/rev4/imp-act)\n\
  \n> 尽管像 800-53 这样的标准列出了典型的做法，但它并没有定义什么适用于特定的上下文。\n\n> 尽管如此，我认为为了恰当地应用防御，从业人员需要理解\
  \ `NIST 800-53` 及类似标准中提到的每个控制的功能。此类标准至少列出了人们为了保护组织而所做的已知内容。\n\n> 像 `BSIMM™ (构建安全能力模型)`*\
  \ 的软件安全测量也是随大流的例子。在 `BSIMM` 的情况下，测量是针对那些对软件安全足够重视以至于付费进行 `BSIMM` 评估的公司。它（目前）不是对组织通常做或不做的宇宙的测量。它不是对组织的随机采样；没有尝试生成统计学上有效的样本（尽管无疑，设计者在如何衡量他们测量的内容上花费了大量心血）。`BSIMM`\
  \ 的测量是针对愿意为 `BSIMM` 测量付费的公司——因此，是关注软件安全的公司。\n\n> 我并不是想暗示 `BSIMM` 没能告诉我们什么。它告诉我们那些已经投入足够资源用于软件安全的公司在做什么，并评估了这些做法的成熟程度。这无疑非常有价值：领导者在做什么，他们在他们所做的事情上有多成熟？\n\
  \n\n\n\n\n> BSIMM 并没有告诉我们，它们的软件安全计划在防止由被测量公司构建或部署的软件问题所导致的安全事件损害方面有多么有效。BSIMM 公司的做法真的有效吗？由于\
  \ BSIMM 公司的完整列表并不公开，因此无法将已知的事件与 BSIMM 参与者进行匹配†。……\n\n> 但或许，BSIMM 中概述的实践构成了合理软件安全实践的公平样本。\n\
  \n> 我以上所有内容的论点是，我们确实拥有组织所尝试的案例。对于至少 `NIST` 认为构成稳健安全计划的控制措施类型，我们有相当具体的描述。熟悉一些现有的标准可能帮助初次接触防御领域的人建立必要的知识，以便将特定的防御应用于特定的安全需求……\n\
  \n> 在 Web 上快速搜索“大规模开放在线课程（MOOC）”会返回几十条结果‡。对于愿意学习的学生来说，似乎有大量的可用资源。我不代表任何哪个 MOOC 可能是好用的。显然，许多\
  \ MOOC 是营利性运营。买家务必小心。尽管如此，今天寻找一门信息安全入门课程并不困难。任何合格的综述课程都必须包含典型的安全控制及其应用。可能对于住在大学、学院或其他高等教育机构附近的人来说，这些机构也提供一些网络安全介绍，可能会非常有用。\n\
