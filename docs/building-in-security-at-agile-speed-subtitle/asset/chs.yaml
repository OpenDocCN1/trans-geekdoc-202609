  \n### 5.2.3.1.4 社会政治攻击\n\n社会政治攻击通常旨在提高对某一话题的关注，但也可以作为针对政治团体、公民不抗运动的手段，或作为更大活动的一部分，它们可能是未来更大规模事件的预兆和警告。越来越多的证据表明，更多的网络攻击与社会、政治、经济和文化（`SPEC`）有关。众所周知，网络攻击者的社会技术水平、背景和动机是预测、预防和追踪网络攻击的关键要素。\n\
  \n一些著名的社会政治攻击案例是由于 `Anonymous`、`WikiLeaks` 和 `爱德华·斯诺登`（这也是一个内部威胁的例子）努力的结果，以及激进穆斯林团体或圣战分子（例如，基地兰组织）的攻击。`Anonymous`\
  \ 是一个活动分子团体，在过去的几年中，它因对政府和企业基础设施的攻击而闻名。它具有去中心化的指挥结构，可以被视为一场社会运动。这场运动的目标了从宗教机构（`山科学教会`）到所有人。这项运动针对了从宗教机构（`山科学教会`）到所有人的目标。在发布了关于某人的视频后，`Anonymous`\
  \ 针对`山科学教会`、企业（`PayPal`、`MasterCard`）发起了反对运动。2010 年，`Anonymous` 攻击并关闭了`美国``美国`（`DoS`）的网站，这是为了保护信息的分享权。2010\
  \ 年 11 月，`WikiLeaks` 发布了机密电报。在美国政府的压力下，`Amazon.com` 删除了 `WikiLeaks`，`PayPal` 和 `MasterCard`\
  \ 停止了提供服务。这导致了对网站和服务的攻击。\n\n***\n\n* Samani, R. and Paget, F. (2011). “网络犯罪暴露——即服务。”麦菲——英特尔公司白皮书。检索自\
