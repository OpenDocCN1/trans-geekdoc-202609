  \ `PSMM` 找到它。\n\n#### 持续教育和培训非常重要\n\n英特安全 (McAfee) 产品安全成熟度模型 (`PSMM`) 是另一个可供你的使用的模型。Harold\
  \ 和 James 在 2016 年 2 月 29 日的 `CERT` 供应商会议上介绍了该模型的公开版本。你可以在 `PSMM` 找到它。\n\n#### 5.5.1\
  \ 人\n\n安全主要关乎人，而不是技术。\n\n#### 核心软件安全\n\n底线是软件。安全仍然很少是计算机科学课程的一部分；因此，我们需要指导并培训开发者，直到安全成为他们的基因。开发者必须像安全人员一样思考（防御，而不只是进攻）。开发是你的第一防线，他们也需要学习这些技能。\n\
  \n每个组织都有自己的需求，但在大多数情况下，培训必须是全面的，从基础概念开始而不是高级主题，以确保你的受众有一个可以工作的背景。需要考虑的关键点之一是，开发者是根据软件应该做什么来思考和测试的，但安全培训必须改变他们的思维，让他们考虑软件不应该做什么。这要求他们在考虑安全性时回到安全基础知识，特别是针对：\n\
  * 机密性\n* 完整性\n* 可用性\n\n\n\n\n\n从 DevOps 的角度来看，你可能面临的最重要的人性挑战是，如何在开发组织内部改变文化并建立你的安全社区。确定你将如何打破历史性的阻力和信息孤岛以实现这一点是至关重要的。\n\
  \n### 5.5.2 流程\n\n真正的安全文化变革源于行为的改变而非流程。然而，你交付培训计划的流程将是 DevOps 环境下所需的安全文化变革的关键。行为是可以教导的。安全行为是一种能够降低风险或威胁的处事方式。安全习惯和技能组合是学习习得的行为，而你现有的文化将决定你如何调整安全培训计划以促进这一目标。\n\
  \n在规划软件安全培训计划时，需要考虑的一些关键点包括：\n\n• 通过使用你们自己的产品和代码问题来保持培训的相关性。\n\n• 在可能的情况下，利用你们自己的人员来培训他人。这可以通过录制或在\
  \ Scrum 团队会议上面对面进行。如果可能，这些内容应控制在 15 分钟或更短，并与团队正在编写的代码相关。如果能培养内部人才，让安全工作与开发团队产生关联要容易得多。在可能的情况下，让你们的安全工程师和安全架构师担任培训师和导师。\n\
  \n• 对于通用的外部源安全培训，应尽量避免需要使用公司学习管理系统（LMS）的培训。与云端交付的培训相比，这种方式非常昂贵，需要不必要的资源。你还应该确保任何外部培训都与你们的环境和代码库相关，能够随你们的变化而变化，并能够快速修改培训以支持你们的环境。此外，应该评估培训的认证级别，看它们是否符合你们的兴趣（例如某些供应商提供的腰带等级计划）。如果你考虑的供应商已利用其培训计划帮助建立了安全社区并促进了\
  \ DevOps 中的文化变革，那么这将会是一个加分项。游戏化也是某些供应商使用的一种技术，可能对某些开发文化具有吸引力。\n\n• 无论你是创建内部培训计划还是外包（或两者结合）外部安全培训计划，在可能的情况下，使用自己的代码进行实操培训应该是优先事项。从开发者的角度来看，这使你的计划价值化。\n\
  \n• 威胁建模培训、安全代码审查培训和导师指导必须是优先事项。\n\n• 你的开发人员在适当的情况下应接受蓝队能力培训。蓝队是一支负责防御真实攻击者和红队的内部安全团队。这可以通过让红队和赏金计划成员培训安全工程师和其他适当的开发团队成员，学习像攻击者一样思考的艺术，以及他们用于发现和利用软件漏洞的工具。\n\
  \n• 至关重要的是，不仅是安全工程师，整个产品团队都要对 PSIRT（产品安全响应小组）在响应外部发现的事件时遵循的流程接受培训。最重要的是，必须培训安全工程师和开发团队在\
  \ PSIRT 事件期间的职责，以及在此过程中在小组外沟通的禁忌（dos and don’ts）。你们相关的合作伙伴（如法务和 IT 部门）也应该接受该流程的培训。\n\
  \n• 如果适合你的组织，考虑为适当的安全和开发团队人员提供支持第三方 DevSecOps 认证。\n\n• 请记住，在 DevOps 环境中，你的培训计划应该是持续的、嵌入的并尽可能构建在集成开发环境（IDE）中，同时也要位于参考架构之上，以跨所有整合的领域。这将提供一个全局的但以组织为中心且相关的安全培训计划，旨在赋能并帮助开发团队学习和实施安全编码的最佳实践。\n\
  \n### 5.5.3 技术\n\n当你购买安全工具时，培训始终应该是你合同的一部分。许多安全工具并不直观，只会让没有接受过如何使用它们培训的人员感到沮丧。对于许多安全工具，你必须学会先走路后跑步。例如，当你购买并部署诸如静态分析的安全工具时，你应该选择一个具有高保真度且误报率低的套件。这样，你的开发团队就能看到该工具是如何被成功使用的：它发现了一个问题，识别出的项目较少，且通常可以在合理时间内修复。这将赢得开发团队的信任；与之相反，通常发生的情况是你们花费了数百万美元买了一个工具，开启它，结果发现了\
  \ 10 万多个问题，其中许多是误报。这通常令人望而生畏，导致团队在运行工具后就将其搁置，直到合规部门或 QA 发现它没有被持续使用。这里的教训是，必须对安全工具进行适当培训，且其使用应力争持续改进，而不是试图在第一次使用时解决所有问题。\n\
  \n在选择合适的安全工具之前，培训团队了解他们正在试图防御什么是非常重要的。像威胁建模和价值流映射之类的工具在选择使用的工具之前对于理解攻击面至关重要。由于管理层通常参与工具选择的决策，这凸显了持续教育需要涵盖管理层的必要性。这样他们就知道工具的价值以及如何对其产生更好的影响。\n\
  \n在某些情况下，安全工具可能通过供应商或第三方提供认证培训。考虑资助适当团队成员获得这些认证，但应尽可能利用供应商将这些费用包含在合同中。\n\n¹ IBM\
  \ (2020). “IBM DevOps.” 获取自 https://www.ibm.com/cloud/devops\n\n## 5.6 安全预算管理\n\n\
  \n\n\n\n对于 DevOps 中安全预算管理的演进下一步，其建议和概述与第 2 章和第 2.6 节中的描述相同。特别是，这包含了讨论准备和交付预算信息以及准备预算时需要考虑的其他事项的章节。\n\
  \n在 DevOps 中，安全与组织的每一个领域都交织在一起，从基础任务到驱动战略目标。安全预算编制不能在真空中运行，而应该是 DevOps 流程中的关键部分。双方达成共识至关重要。安全团队必须与开发和运营团队合作，以确保安全被构建到\
  \ DevOps 计划中。如果安全没有被构建进 DevOps，预算分配过程将出现问题。典型的年度预算流程（提前 12 个月预测并锁定资金并分配资源）与 DevOps\
  \ 流程是背道而驰的。正如所有正在迁移并转型为动态、响应式 DevOps 环境的一切事物一样，预算必须在这种变化中演进并适应其文化。\n\nMustafka Kapadia\
  \ 在 2018 年的 [DevOps.com](http://www.DevOps.com) 篇文章《为 DevOps 转型年度预算流程》* 中为 DevOps\
  \ 提供了三种预算流程选择：\n\n### 1. 更短的周期和频繁的\n\n某些组织正在转向更短的预算和审查周期。传统的年度项目资金结构仍然存在，但计划和分配每季度或以滚动的方式重新审视。业务端和\
  \ DevOps 端不断重新确定资助功能的优先级，并共同做出“通过/停止”的决策。这种系统的优势是，它允许团队在项目内部动态分配资金，它迫使团队从最小可行产品（MVP）的角度进行思考，并且分配错误可以被迅速纠正。然而，它有两个主要缺点。首先，资金无法跨项目重新分配，这迫使高管仍需等待年度周期。其次，如果季度审查流程没有精简化，可能会导致一种不断预算的氛围，使经理最终花费更多时间争夺资金，而不是做实际工作。\n\
  \n### 2. 基于产品的资金\n\n在这种方法中，应用程序及其资源被分到产品团队中，并获得总预算的一部分。该预算主要由首席产品负责人（Chief Product\
  \ Owner）管理，然后将其进一步分配给产品负责人。与上一个模型一样，首席产品负责人与业务部门合作决定“通过/停止”活动。此外，它还允许首席产品负责人在其投资组合内的产品和项目之间重新分配资金。产品负责人负责在分配的资金内执行最小可行功能集。这种模型的优势在于简单。CFO\
  \ 无需对项目进行下注，只需决定预算如何分布在各个产品组中。首席产品负责人和产品负责人有权根据自己的需要分配他们的份额。结果是预算决策被推到尽可能接近一线，从而提供了更大的灵活性并提高了市场响应速度。为了解决这个问题，某些组织强制团队预留部分预算用于维护和偿还技术债。\n\
  \n______________________\n\n*Kapadia, M. (2018. June 16). “Transforming the Annual\
  \ Budgeting Process for DevOps.” Retrieved from [`devops.com/transforming-the-annual-budgeting-process-for-devops/`](https://devops.com)\n\
  \n### 3. 基于风险的资金\n\n这种模型模仿了硅谷风格的风险投资人（VC），即执行委员会将为最小可行产品的想法提供资金。根据产品的有效性，向团队授予额外资金。这种模型旨在种子大量想法，并仅资助有效的想法。其优点是透明度更高且降低了财务风险。缺点是大多数公司的运作模式不像风险投资公司。\n\
  \n## 5.7 安全治理、风险与合规 (GRC) 管理](#04-9781003002451_contents.xhtml#chap5_7)\n\n对于安全治理、风险和合规（GRC）管理的演进下一步，其建议和概述与第\
  \ 2 章和第 2.7 节中的描述相同。特别是，这包含了讨论相关法规、认证和合规框架的 SDL 覆盖范围；第三方审查；发布后认证；隐私；隐私影响评估 (PIA)\
  \ 计划启动；隐私实施评估；最终隐私审查以及发布后隐私响应的章节。以下汇编了来自 Anders Wailgren 文章《DevSecOps：DevOps 和自动化如何增强安全与合规的\
  \ 9 种方法》的评论：\n\n> 你必须尽可能地修复问题，但在 DevOps 环境中，这更为重要。DevOps 加快了你的交付时间，让你能够更快速地开发、测试和部署补丁/更新。如果你必须解决诸如\
  \ Heartbleed 这样的问题，这将尤为重要。某些 DevOps 平台对所有应用程序、环境和流水线阶段状态提供的细致跟踪，极大地简化并加速了你需要发布更新时的响应。当你确切知道哪个版本的应用程序及其堆栈中的所有组件部署在哪个环境中时，你可以快速定位需要更新的应用程序组件，识别出需要关注的实例，并通过触发适当的工作流，以更快、更一致且可重复的部署流程快速发布你的更新。你的\
  \ DevOps 工具和自动化可以配置为使开发者能够自给自足并“完成工作”，同时自动确保访问控制和合规。DevSecOps 允许组织在不危及稳定治理的情况下实现速度。安全和合规控制应作为不可或缺的一部分构建到从开发一直到生产的\
  \ DevOps 流程中。通过实施从一开始整合安全实践的 DevOps 流程，你为应用程序和环境创建了有效且可行的安全层，从长远来看，这将以更精简、高效和主动的方式确保安全和合规。*\n\
  \n在第 3 章中，我们讨论了更新组件的 A/B 测试。为了坚持 DevOps 的思维方式，我们的 SDL 考虑了这种类型的自动化更新。\n\n## 5.8 安全指标管理](#04-9781003002451_contents.xhtml#chap5_8)\n\
  \n\n\n\n\n第 2 章和第 2.8 节中关于指标管理的安全指标和讨论仍然具有相关性，但为了让你在支持 DevOps 方面更上一层楼，进一步的讨论和指标也至关重要。在\
  \ DevOps 环境中，衡量安全的成功与否，应该通过持续开发的效率、代码质量、威胁检测和发布周期进行量化衡量。你需要正确的指标来确定你的安全、性能和整体运营的有效性。如果没有能够证明这些工作是有效的衡量，就很难向高级管理层以及你所支持的人员证明你的成功和预算。一旦你明确了想要在\
  \ DevOps 中解决的安全挑战，就可以确定使用哪些指标。完成这一步后，你就可以决定哪些指标对于帮助你衡量自己应对这些挑战的程度最有帮助。建立成功的某些关键指标应包括：\n\
  \n***\n\n\\*Wailgren, A. (2020). “DevSecOps: 9 Ways DevOps and Automation Bolster\
  \ Security, Compliance.” [`techbeacon.com/devops/devsecops-9-ways-devops-automation-bolster-security-compliance`](https://techbeacon.com)\n\
  \n* 部署频率\n* 交付提前期 (Lead time)\n* 测试\n* 威胁、安全缺陷和漏洞的检测\n* 平均修复时间 (Mean time to repair)\n\
  * 平均恢复时间 (Mean time to recovery)\\*\n\n使用有效的指标展示变化如何改进业务运营同样重要。以下是与 DevOps 环境相关的几个指标：\n\
  \n* `每月持续交付周期数`：这是一个重要的基准指标，用于向你展示在生产环境中部署代码更改有多快。DevOps 的一部分是组织可以管理的交付周期，而你的安全方法应该增加这个数字。\n\
  * `每行代码软件缺陷数`：衡量通过静态和动态安全代码分析发现的漏洞数量非常重要，以查看你的安全实践的有效性。这将有助于确定你是否在自定义代码移到生产环境之前更擅检测缺陷。\n\
  * `支持容器的操作系统对互联网安全中心 (CIS) 加固标准的策略遵循百分比`：尽管容器由于其和效率具有明显优势，但它们也引入了一系列必须解决的新安全挑战。遵循这些标准的比例可以作为衡量环境安全性的有用工具。\\\
  †\n\n当使用云供应商负责加固的云虚拟环境时，上述列出的最后一个指标将失去意义。一旦进入云环境，理解“包”而不是“服务器”、“主机”或“操作系统”至关重要。确定自定义代码中（在任何级别，从客体操作系统到容器再到无服务器）哪些是脆弱/易受攻击的变得变得。\n\
  \n安全为开发人员的日常安全原则实施提供有意义建议的最佳方式之一就是使用指标。以下是几个可以帮助 DevOps 团队持续改进安全的有价值指标。这些指标源自 Ericka\
  \ Chickowski 写的一篇文章，该文章涵盖了由 Shannon Lietz、Caroline Wong 和 Paula Thrasher 组成的 2018\
  \ 年 RSA 会议小组讨论\\‡：\n\n***\n\n\\*Berg, A. (2017). “DevSecOps: Incorporate Security\
  \ into DevOps to Reduce Software Risk.” Retrieved from [`www.agileconnection.com/article/devsecops-incorporate-security-devops-reduce-software-risk`](https://www.agileconnection.com)\n\
  \n†Schilling, J. (2018). “Diving into DevSecOps: Measuring Effectiveness & Success\
  \ Success.” Retrieved from [`www.armor.com/resources/diving-devsecops-measuring-effectiveness-success/`](https://www.armor.com)\n\
  \n‡Chickowski, E. (2018). “Seven Winning DevSecOps Metrics Security Should Track.”\
  \ Retrieved from [`businessinsights.bitdefender.com/seven-winning-devsecops-metrics-security-should-track`](https://businessinsights.bitdefender.com)\n\
  \n* `缺陷密度`：最简单的设置基准之一，可以通过记录 Bug 数量并将其除以固定的代码量，衡量整个组织、团队内部以及特定应用程序或服务的进展。\n* `缺陷消减率`：关注缺陷的数量，是衡量团队解决这些缺陷速度的良好标准。\n\
  * `关键风险概况`：开发团队与安全人员之间最大的问题之一是，他们通常为 DevOps 团队提供一份大量的漏洞列表，而没有任何优先级。安全团队应该根据严重性对缺陷进行分类，并为开发者制定矩阵，以便直观查看修复顺序。\n\
  * `SLA 性能`：根据严重性建立 SLA 并跟踪其性能。\n* `顶级漏洞类型和重复 Bug`：这将帮助开发人员在编码方式上做出长期改进，例如自定义培训和预测所需的技能。\n\
  * `每个应用程序的攻击者数量`：这有助于提高开发者的风险意识和对安全的兴趣。这将使开发人员寻找攻击者，并对他们实际的操作感兴趣。\n* `攻击者回归率`：这有助于开发者思考应用程序是如何被攻击的，以及攻击者多久使用相同的策略、技术和程序。也可以用于漏洞修复的排序。\n\
  \n## 5.9 合并收购 (M&A) 管理](#04-9781003002451_contents.xhtml#chap5_9)\n\n第 2 章（第 2.9\
  \ 节）中关于并购管理的讨论仍然有效，但本节提供了额外信息以让你在支持 DevOps 方面更上一层楼。\n\n过去几年中从子公司或在发生漏洞前不久作为独立实体的公司报告的重大软件安全漏洞数量，应该是安全本应是并购流程一部分的信号。并购安全尽职调查的一个重大教训案例是\
  \ Verizon 收购 Yahoo，Yahoo 漏洞的公开化导致收购价值缩减了 3.5 亿美元：\\*\n\n\n\n\n如前所述，在 DevOps 环境中，获取开源软件时应从安全角度出发，给予特别关注和严谨性。最重要的是，安全不仅应该是审查任何安全风险的流程的一部分，还应该被赋予权力，并在决策者中占有一席之地。多年来，我们都见过这样的情况：安全确实是流程的一部分，并做出了重要的记录警告，这些警告本应是停止进展的障碍，但并购（M&A）仍然发生了。一些遗留到新公司的问题在发生公开或私有安全问题之前得到了修复，而另一些则没有。\n\
  \n私有安全问题是指客户发现安全问题并要求修复，但该问题并未公开的问题。当双方都可能感到尴尬、遭受负面媒体报道，并可能失去市场份额时，这些问题通常会保持私密。在并购决策过程中不将安全考虑在内，异于拿你公司的声誉玩俄罗斯轮盘。这些风险在\
  \ DevOps 环境中并不会消失，而且如果处理不当，可能会加速发生。Matt Rose 在 Dark Reading 的文章《涉及并购时，安全至关重要》[`#14-9781003002451_chapter-chap5.xhtml#fn5_72]`\
  \ 中引用了一些相关的调查结果，该结果强调了与并购相关的持续安全问题：\n\n________________\n\n[`#14-9781003002451_chapter-chap5.xhtml#r_fn5_71]`Law.com-ALM\
  \ Media. (2018, 6 月 22). “并购交易中的网络安全尽职。” 获取自 [`finance.yahoo.com/news/cybersecurity-due-diligence-m-transactions-151002419.html`](https://finance.yahoo.com)\n\
  \n> West Monroe 的一份报告[`#14-9781003002451_chapter-chap5.xhtml#fn5_73]` 在 2017 年初对\
  \ 100 名全球高级高管进行了调查，发现网络安全在尽职调查和交易完成后仍然是并购方面的一个大问题。52% 的人表示在交易完成后发现了网络安全问题。调查还发现，安全是导致并购交易放弃的第二原因，也是买家后悔完成交易的第二常见原因。在评估整个并购过程时，受访者表示交易经常失败的前三个三是安全考量（23%）、财务和税务问题（23%）以及合规性问题（18%）。虽然这些比例相对较低，但最大的焦虑似乎出现在交易完成后。研究发现，五位受访者中有二位表示，在考虑与安全相关的问题时，合并后整合期间的问题（41%）是他们主要的担忧。\n\
  \n## 需要考虑的关键问题：\n\n* 目标公司/产品是否存在未解决的数据隐私、网络安全或监管合规性问题？\n* 目标公司是否有足够的托管资金，以应对根据州法和联邦法律可能采取行动的任何潜在安全或隐私调查或合规性考量？\n\
  \n## 需要考虑的关键任务：\n\n* 确保目标公司准备必要的文档，证明其安全和隐私符合监管和行业要求。\n* 目标公司是否有足够的托管资金，以应对根据州法和联邦法律可能采取行动的任何潜在安全或隐私调查或合规性考量？\n\
  \n\n\n遗留软件由于无法对旧版本进行修复或升级，导致了一系列安全问题。由于存在未修补的漏洞和缺陷，这使其成为攻击者极具吸引力的利用目标。更令人担忧的是遗留软件，特别是定制软件，因为开发代码的员工或承包商可能已经离开公司或退休。另一个问题的问题是，遗留软件可能导致在申请网络安全/网络责任保险时面临困难，或面临更高的保费。\n\
  \n### 5.10.2 法律与合规问题\n\n使用遗留软件的公司由于存在漏洞的遗留软件以及由于未能满足最低安全保护措施导致的未经授权个人信息/个人数据泄露，增加了其在境内和全球范围内面临监管调查、审查和罚款的责任和风险。此外，上市公司可能需要披露其产品或组件中遗留软件所固有的网络责任风险。\n\
  \n网络安全事件许多经常发现的潜在影响适用于由于未修补的遗留软件引起的数据泄露，包括：机密客户或员工信息的泄露；对专有或敏感信息的未经授权的访问，或数据的破坏或损坏；由于活动中断导致收入损失并产生修复成本；因未能遵守隐私和信息安全法而面临的诉讼、罚款和责任；影响客户和投资者信心的声誉损害；竞争优势下降以及对未来机会的负面影响；运营延迟，如生产停机或工厂和公用事业故障；无法管理供应链；无法处理客户交易或无法为客户提供服务；库存管理的破坏；研发活动的数据丢失；以及知识产权的贬值。\n\
  \n## 5.11 章节总结\n\n随着我们快速进入这个以前被归于人类大脑的任务、现在正被软件驱动的机器取代的新时代，软件安全的关键性不应被低估。这正是我们写这本书的原因。与此相反，在可预见的未来，人类将继续编写软件程序。这意味着新软件将继续在遗留代码或在安全问题受到重视之前（或在复杂攻击流行之前）编写的软件基础上构建。只要人类还在编写程序，软件安全成功的关键就是让软件开发流程变得更加高效和有效。尽管本书的方法包含了人员、流程和技术等层面的软件安全方法，但作者认为，软件安全的“人”的因素仍然是管理最重要的部分。只要软件仍由人类开发、管理和利用，这一点将一直如此。本书概述了一个与当今技术、运营、业务和开发环境相关的软件安全分步流程。我们关注的是人类如何通过最佳实践和指标的形式来控制和管理安全的软件开发过程。尽管安全并不是近年来行业构建软件方式的自然组成，但作者认为，对开发过程进行安全改进是可能的、行的且必要的。\n\
  \n软件的安全性取决于软件开发团队所使用的最佳实践的质量和相关性。软件安全必须从一开始就开始构建。它必须从一开始就是设计中的关键部分，并包含在后续每一个开发阶段，直到交付一个完整的系统。在\
  \ `SDLC` 中通过采用增强安全的流程和实践尽早纠正漏洞，比在系统上线后尝试诊断和纠正此类问题要具成本效益得多。这将大大减少在产品发布后由于他人发现的安全漏洞而修复软件的需求，这将损害供应商的声誉和信誉，并对其财务产生负面影响。今天，我们看到软件开发对安全的需求日益增长，因为安全需求、设计和防御原则必须纳入传统的\
  \ `SDLC` 中，最重要的是选择贯穿于 `SDLC` 所有活动以满足这种需求的安全开发实践。尽管安全不是过去行业构建软件方式的自然组成，但我们相信在 `DevOps`\
  \ 流水中对开发过程进行安全改进是可能的、行的且必要的。最后，软件高管、领导和经理必须支持与业务相关的安全所需的稳健编码实践和必要的安全增强，并支持此类工作在\
  \ `DevOps` 环境中成功所需的人员配备、调度、预算和资源分配。\n\n与遗留模型中安全、运营和开发团队通常作为独立的组织进行工作（`图 5.5`）不同，这些团队现在必须演变成作为一个单一单元工作的整体\
  \ `DevOps` 组织（`图 5.6`）。\n\n在结束本章之际，重复章节引言的第一行很重要：“在软件开发中，最薄弱的环节仍然人，特别是那些管理预期执行任务的人员、流程和任务的经理。”本章完全关于经理可以做什么来帮助他们以敏捷的速度交付安全的软件。这些章节是\
  \ `第 2 章` 中内容的重复，但侧重于采用书中之前提出的新模型（`第 3 章`）。\n\n\n\n\n“持续改进”多年来一直是现代组织的一个目标。Google^®\
  \ Ngram™ 搜索显示，作者对“持续改进”讨论的曲线大约从 1939 年左右开始。在 20 世纪 50 年代中期出现过一个小峰值；随后在 20 世纪 90\
  \ 年代，持续改进获得了巨大的关注，并在 1995 年左右达到顶峰。从 2003 年直到（2019 年），该术语已进入了长期的平台期（2019*）。如今，“持续改进”已成为管理指导原则之一。在我们工作过的每个组织中，我们都被敦促要对我们的程序、效率、领导风格等等方面追求“持续改进”。持续改进”的假设，或者说日本生产力目标\
  \ `Kaizen`（改善，它有时被认为是现代持续改进的源头†）是：只要团队能够反思自己的所作所为，并以改进和消除效率障碍的目标，一切都可以变得“更好”、更有效。事实上，持续改进已融入到\
  \ `Agile Scrum` 的结构和仪式中（请参阅第 2 章中对 `Agile Scrum` 的描述）。持续改进现在已成为许多组织（包括软件安全实践）的基础假设。\n\
  \n本书的核心观点是，我们必须改进我们的软件安全实践，否则我们将继续为攻击者提供大量的机会、过多的机会以及过大的攻击者杠杆，以至于我们这些软件制作者、运营者和用户，将在一个无法生存的敌对环境中进行交互。在某种意义上，我认为我们可以用传统的戒律来总结我们的主张：“不改变就死亡”。‡。软件开发已经发生了变化。安全必须适应这些变化，否则将变得毫无意义。如果安全无法满足我们在前面的章节中描述的开发变化，攻击者可能会为此庆祝。或者，我们可以使用此处描述的以及未来发明的技巧，使安全能够完全集成到我们构建的软件中。我们必须将安全实践与当今及可预见未来软件开发和运营的方式相结合。\n\
  \n***\n\n*Ngram 查询不包含当前年份，查询时当前年份为 2020 年。\n\n†请参见“什么是持续改进？”，检索自 `htt­ps:­//k­anb­ani­ze.­com­/le­an-­man­age­men­t/i­mpr­ove­men­t/w­hat­-is­-co­nti­nuo­us-­nt/`\n\
  \n‡`不改变就死亡`的起源尚不清楚。最早于 2012 年 12 月发表在《大西洋月》，网址：https://www.theatlantic.com/technology/archive/2012/12/change-or-die/26335/\n\
  \n\n\n但我们希望，到此时，你已经清楚地理解，如果不将软件安全深度集成作为软件创建、实现和运行的关键部分，它是无法实现的。适当的软件安全是开发者努力的直接结果，通常还需要软件安全专家的帮助和支持。也就是说，用一句陈词滥调的安全智慧来说，安全是“内置”的，而不是“外挂”的。\n\
  \n我们发现，所需的改变远不仅仅是将安全实践嵌入到开发团队中——这本身通常被认为或大或小地被视为一种“解决方案”。我们从未见过仅仅靠嵌入就能产生成效。开发者必须相信他们的工作包含了安全思维。他们必须将安全刻在骨子里，将其作为整体开发实践的深度组成部分。这使我们不得不对组织进行“文化黑客”（culture\
  \ hacking），以使信念和实践向目标转变。\n\n本章包含了我们的技巧和窍门，旨在将组织的视角从“对软件进行安全处理”转变为“开发产生安全”。这是一种范式转变，它超越了告诉人们该做什么以及怎么做（即一个\
  \ `SDL`）。\n\n这种转变不能仅仅通过高层的关切声明来实现，尽管这是全面文化黑客的一部分：当拥有实质性的高层支持时，情况会更容易。在高层冷漠的情况下也并非不可能。（我们仅在此说明一次：如果面对积极的高层破坏，我们只能寻找另一个组织来帮助。）\n\
  \n转变不会因为起草了要求执行的文件（`policy`）并描述了如何执行它（`SDL`）而发生。文档很重要；请不要误解。执行者可能会有疑问，或者忘记某件事情是如何做的、何时做或预期什么。此外，人员流失总是会发生的：人们离开，新人的加入。根据我们的经验，流程具有巨大的熵，因为在连续的人员世代更替中，流程的合理性会丢失，这会导致人们产生（完全合理的）疑问：到底为什么他们被要求执行某系列动作？通过定期的培训和强化来支持文档可以解决员工流失和流程熵。这也是文化黑客的重要组成部分。\n\
  \n根据我们的经验，聪明人不会因为被命令而改变。他们根据改变而带来的显而易见的价值来改变思维：更好的软件！技能的提升。职业前景的广阔。获得高额薪酬的潜力。交付带来的自豪感。这些动机共同作用并相辅相成。改变必须随之产生显而易见的价值：必须对组织目标产生明确的贡献。人们也应该从预期改变中获益。\n\
  \n正如我们上面提到的，“文化黑客”是我们同事对总结意性组织变革的一种精辟方式。也许我们两个起初都没打算成为文化黑客，尽管在第一次合作之前，我们每个人都已经意识到自己是组织变革的代理人。\n\
  \n当我们构建并随后领导自己的软件安全计划时（我们分别担任各自的角色：组织和管理动态专家，以及技术领袖），我们注意到文化转变正在发生。人们只需要稍微留心观察一下，然后对自己的观察进行反思，以发现动态中的模式。\n\
  \n此外，对于那些考虑加入这场“变革代理人大锅”的人来说，这是一个巨大的加分项，我们彼此可以探索假设，分享成功以及不可避免的失败。通过持续的互动，我们能够识别出哪些是多次有效的经验，哪些仅仅是运气。无论是一起工作还是分开工作，我们以这种方式分享了\
  \ 10 多年。\n\n这种转变不会因为起草了要求执行的文件（`policy`）并描述了如何执行它（`SDL`）而发生。文档很重要；请不要误解。执行者可能会有疑问，或者忘记某件事情是如何做的、何时做或预期什么。此外，人员流失总是会发生的：人们离开，新人的加入。根据我们的经验，流程具有巨大的熵，因为在连续的人员世代更替中，流程的合理性会丢失，这会导致人们产生（完全合理的）疑问：到底为什么他们被要求执行某系列动作？通过定期的培训和强化来支持文档可以解决员工流失和流程熵。这也是文化黑客的重要组成部分。\n\
  \n根据我们的经验，聪明人不会因为被命令而改变。他们根据改变而带来的显而易见的价值来改变思维：更好的软件！技能的提升。职业前景的广阔。获得高额薪酬的潜力。交付带来的自豪感。这些动机共同作用并相辅相成。改变必须随之产生显而易见的价值：必须对组织目标产生明确的贡献。人们也应该从预期改变中获益。\n\
  \n正如我们上面提到的，“文化黑客”是我们同事对总结意性组织变革的一种精辟方式。也许我们两个起初都没打算成为文化黑客，尽管在第一次合作之前，我们每个人都已经意识到自己是组织变革的代理人。\n\
  \n当我们构建并随后领导自己的软件安全计划时（我们分别担任各自的角色：组织和管理动态专家，以及技术领袖），我们注意到文化转变正在发生。人们只需要稍微留心观察一下，然后对自己的观察进行反思，以发现动态中的模式。\n\
  \n此外，对于那些考虑加入这场“变革代理人大锅”的人来说，这是一个巨大的加分项，我们彼此可以探索假设，分享成功以及不可避免的失败。通过持续的互动，我们能够识别出哪些是多次有效的经验，哪些仅仅是运气。无论是一起工作还是分开工作，我们以这种方式分享了\
  \ 10 多年。\n\n这种转变不会因为起草了要求执行的文件（`policy`）并描述了如何执行它（`SDL`）而发生。文档很重要；请不要误解。执行者可能会有疑问，或者忘记某件事情是如何做的、何时做或预期什么。此外，人员流失总是会发生的：人们离开，新人的加入。根据我们的经验，流程具有巨大的熵，因为在连续的人员世代更替中，流程的合理性会丢失，这会导致人们产生（完全合理的）疑问：到底为什么他们被要求执行某系列动作？通过定期的培训和强化来支持文档可以解决员工流失和流程熵。这也是文化黑客的重要组成部分。\n\
  \n## 高层支持与文化黑客\n\n支持性的高层会考虑、听取各方意见，考虑到所有的风险因素。有时，这是一个关于何时完成安全要求，而不是是否要做的问题。有时，高层会决定将安全优于其他风险因素。本该如此。我不期待赢得——赢得并不是我们在处理这些升级时应该培养的态度。安全风险需要得到充分的认可和验证。这就是我们在这些情况下寻求的所有。\n\
  \n\n\n\n\nSchoenfield, B. S. E. (2015). *Securing Systems: Applied Security Architecture\
  \ and Threat Models.* Boca Raton (FL): CRC Press/Taylor Francis Group.\n\n### 6.3.2\
  \ 中层管理的成败\n\n> 在担任技术领导安全角色后不久，我很早地意识到中层管理将决定我的努力是成功还是失败。通常，微小的、低级的甚至中级的风险由中层管理决定——在大多数组织中，是总监或同等人员。如果风险对整个组织不是灾难性的，或者局限于特定的功能或团队，中层管理通常会处理这些问题。\n\
  \n> 此外，总监通常会为自己的小组设定优先级。如果一位总监想要破坏安全倡议（至少对他们的团队而言），他们可以做到。在大型复杂的组织中，中层管理可能拥有广泛的影响力。了解他们是支持、不在还是积极抵制至关重要，这就是为什么我在进入新组织后，做的第一件事就是与每一位相关的总监聊天。此外，我还会在引入安全需求和安全任务时观察他们的做法。\n\
  \n> 批判性的提问没有问题；这代表了参与。参与是支持的信号，尽管当面对总监严厉的质问时，感觉可能并非如此。只要询问似乎是为了让工作变得更好，让安全能够与生产良好软件的所有因素协同工作，那么在我看来这就是支持。\n\
  \n> 再次，就像高管一样，如果、当在关键时刻，团队被一直允许推迟安全任务、降低安全需求的优先级，那么这要么是消极攻击，要么是积极抵制。我想识别出抵制者。如果不主动揭露他们的问题，我就无法解决他们的问题。\n\
  \n> 所以这就是我的一个窍门：找出问题是什么，也许正在保护的是什么，然后我就可以开始制定不会破坏既有构建的解决方案。在功能完备的组织中很多时候，抵制是为了保护一个或多个运行良好的“东西”。\n\
  \n> 开始文化变革计划时，往往无法预测。中层管理有改变的力量，也有抵制的力量。在这一层中，我经常发现为了取得成功而必须考虑的流程或方法[]，……超越抵制，关注为了让所有参与者获得成功而需要[]完成的任务。（*Secrets,*\
  \ 第 106-107 页）\n\n### 6.3.3 所有帮助\n\n我们涵盖了对开发者的赋能，以及技能培养，以便执行本书中所述的 `SDL`。到此时，我们希望读者已经非常熟悉一种“以开发者为中心”的安全观点、其含义，以及如何实施它。\n\
  \n显然，某些人提供的比其他人更丰富的安全专业知识和/或领域专业知识。当安全被深度集成到软件创建的肌理中，中心团队专家与开发者（架构师等）安全专家之间的区别大部分程度上会消失，特别是在解决问题时，作为蓬勃发展的软件安全实践共同体的成员。当成员的贡献更多地关乎价值而非团队身份、角色或层级时，这表明该计划正在运作良好。\n\
  \n我们在其他地方介绍过专家。以下节《网络安全架构师秘密》（*Secrets of a Cyber Security Architect*）的片段讨论了包括未被分配官方\
  \ `SDL` 角色的人的帮助。\n\n> 我接受来自任何级别、任何人的协助或支持。有时，管理层尤其是高管层并不完全理解我的朋友 James Ransome 博士所说的“真相”（ground\
  \ truth）——即开发团队中实际上发生了什么。要让一个软件组织向安全文化转型，真相至关重要。如果没有它，我保证高管声明、中层管理指令、策略声明、安全开发生命周期\
  \ (`SDL`) 文档、政策、标准、流程和方法将处处碰壁。\n\n> 我能做的最重要的事情之一就是与开发者交流并观察他们实际上是如何开发软件的，因为如果 `SDL`\
  \ 直接矛盾或干扰开发过程，它就无法运作。聪明的开发者会找到绕过任何降低他们速度或被他们认为缺乏价值的方法。\n\n> 另一方面，如果某事——任何事——似乎有助于构建更好的软件、更快地发现更多漏洞，我合作过的绝大多数开发者都会快速且几乎没有阻力地接受这项任务、那个工具或这项活动。这通常归结为感知的实用性。\n\
  \n> [中]安全必须适应开发过程。但这种适应无法通过某一种专业知识来完成；它必须通过合作来完成。这就是为什么安全必须与基层开发者直接互动。我们必须理解整个项目或工作的过程。无论需要完成哪些安全任务（本质上是\
  \ `SDL`），都必须符合用于构建软件的流程和方法。（*Secrets,* 第 107-108 页）\n\n### 6.4 信任开发者\n\n在本书中，我们反复赞扬了赋能开发者以实施安全的重要性。但这引发了一些安全人员的顾虑。某些安全信息是敏感的，有些极度敏感。如果攻击者知道弱点在哪里以及如何获取弱点，我们不仅是给了他们机会，而是给了他们一个巨大的优势，甚至是将胜利拱手送给了竞争对手。\n\
  \n> 开发者可能仅仅因为问题的提出就感到被侮辱？毕竟，成千上万的开发者经常致力于保护项目计划、凭据、架构、创意、管理访问权限、专利代码、知识产权以及软件开发工作中包含的所有数据项。\n\
  \n> 角色之间确实存在差异。这些差异可能出现在安全策略、培训、技能培养、促进安全计划方面，特别是在困难的风险决策期间，中心团队可以缓解可能与自身管理冲突的安全专家的压力。但在\
  \ `SDL` 活动的日常执行中（包括改进和评审），这些差异在很大程度上消失了，这是一个目标。当从业者并不真的在乎自己在哪个团队，而在乎他们增加了什么价值时，这表明整个计划正在按设计运行。\n\
  \n另一方面，已有记录显示了未公开项目、开发数据、代码等的泄露事件。这种情况偶尔会发生，通常是无意的。尽职调查要求我们必须防御此类事件，即使其发生频率很低。代码丢失或概念泄露的影响可能是巨大的。\n\
  \n在本书中，我们一直使用这样一个短语：“信任并验证”。我们信任开发者；赋能他们尽力实施安全。在读完下面来自 Brook《网络安全架构师秘密》中关于信任开发者并涉及威胁建模中往往非常敏感的产出的内容后，我们将讨论“验证”。\n\
  \n\n\n\n\n> 我向你（读者）承认，威胁模型的结果、安全需求，尤其是那些尚未构建或可能推迟到以后实施的需求，确实可能非常敏感。这正是许多安全实践活动将威胁模型密得不泄水、将其视为高度敏感信息并因此不与开发团队共享的原因。我敢打赌，这就是上届政府在解释他们为什么不想共享威胁模型或推导模型的过程时提出的论点。\n\
  \n> `[James]` 和我讨论过很多这个问题……围绕威胁模型保护主义盔甲上的弱点在于，开发团队拥有并掌握着代码！请务必仔细考虑这一点：他们不需要威胁模型就能摧毁由开发团队负责的软件。如果团队产生违规之举，他们通常可以在代码中插入各种糟糕的东西，比如后门或恶意代码。\n\
  \n> 存在某些检查机制来防止合结的团队做坏事（请参阅我关于安全开发的某些公开演讲，或查看我在 `Core Software Security` 中的章节）。尽管如此，即使是运行得最好的治理流程，最终也依赖于人，而其中一些人可能并不是为了组织的最佳利益着想。正如\
  \ James 常说的：“如果你不能信任开发者处理代码，你还能信任谁？”这是一个不言而明的真理。\n\n> 我们处理这个问题的方法是提醒开发者，他们对公司负有巨大的责任，他们的成功与防止公司知识产权泄露（包括任何敏感的安全状况）挂钩。要通过不同的媒体和演示渠道定期重复这一点，但不要表现得太唠叨，至于让这条信息变成工作中的背景噪音。\n\
  \n> 没有什么是完美的；某人发布某些代码或敏感的项目名称，这可能仅仅是因为那个人缺乏经验，或者对他们所做的事情极其自豪。处理这些错误是安全工作的一部分。（`Secrets,`,\
  \ 第 87-88 页）\n\n在赋予对参与开发的每个人的持续信任，并重申这种信任所包含的巨大责任的同时，人们必须拥有识别疏忽和错误的方法。这就是“信任与验证（trust\
  \ and verify）”中的“验证”。\n\n在我们的项目中，`verify` 不仅仅投入到安全、开发或任何其他小组：`Verify` 是每个人的责任，就像安全一样。“信任与验证”将文化从“安全是别人的工作”转变为“安全是我的工作”。那么这个“和”字是如何运作的呢？\n\
  \n我们已经广泛涵盖了软件验证方法；静态和动态分析、`fuzzing` 和渗透测试已集成到 `SDL` 中。我们从未对执行这些测试的人表现过偏好（独立的第三方测试除外）。\n\
  \n在实践中，`verification` 需要技能。某些方法（`SAST` 和 `DAST`）比其他方法更容易。`Fuzzing` 通常在开始产生结果之前需要一些前期的培训和练习。显然，手动渗透测试需要大量的学习投入，然后是练习。这正是其意义所在：“熟练的人工测试”。即使对于那些相对直接的扫描技术和工具，也存在专业水平之分。可用工具中（截至本文写作时）很少是轻而易手的。其中一些非常复杂。\n\
  \n在以开发者为中心的项目中，技能水平的体现方式似乎是：水平越低，对 `verify` 的需求就越高。\n\n### 验证方法\n\n*   确保使用正确的 `verify`\
  \ 方法\n*   为开发者提供 `verify` 培训\n*   识别 `verify` 疏忽和错误\n*   在整个组织中维护 `verify` 文化\n\n\
  \n\n\n\n## 6.5 构建实践社区\n\n我们最喜欢的文化黑客技巧之一是跨团队学习结合独立评审。正如我们在`第 3` 章的“敏捷治理”节中提到的，请在包含一个与被评审材料无关的人员，特别是在设计和威胁模型评审中，因为这些评审除了工程技能外，还需要大量的技艺。我们在前一节中已经提到了这种评审的益处。在这里，我们将介绍技能培养方面，并特别关注创建一个实践社区。\n\
  \n开发团队的一个共同的缺点（特别是当开发者被划分到 `Agile Scrum` 团队时）是孤立。这是因为为了让一个团队发挥作用，它必须保持足够长时间的稳定，以凝聚成一个具有自身亚文化、术语（子方言）、风格、甚至通常有独特幽默类型的单位。团队所工作的软件可能会经常变化。但很多时候，一个\
  \ `Scrum` 团队会被分配负责大型系统的某部分。这在大型项目、以及在拥有多个大型软件项目的大型开发组织（在 Scaled Agile^® 术语中通常被称为“epics”）中非常常见。\n\
  \n每个团队可能对整个系统没有完整的了解。这种视图可能由高级架构师持有，他们负责构建（架构）系统以及分配给各个 `Scrum` 团队的组件。团队会非常深入地理解自己的部分，但对于整个系统如何结合在一起，他们的知识可能仅足够让他们成为自己所工作内容的专家。\n\
  \n将大型项目拆分成碎片，然后由小型而集中的团队进行拥有、开发和交付，结果将是团队成员成为某些局部领域的专家，但仅对自己的团队成员和团队文化有共享经验的感。对于受限于紧密任务团队（`Scrum`）的开发者来说，每个人可能都觉得与某个特定系统的所有所有人之间几乎没有“文化”或共享经验的感觉，更不用说整个工程部门或整个公司了。顺便说一下，我们可不是编造的。我们在合作过的组织中恰恰看到过这种共享经验的缺失。有很多独立团队，每个团队都紧密关注自己的专业领域，但并没有感觉到“我们”开发部门，尤其是开发和安全部门——正朝着同一个目标努力。\n\
  \n通过引入另一个团队的成员（一个资深人员且可能也不在 `Scrum` 团队中的成员），我们实现了交叉授粉。考虑不属于自己的问题是一个惊人的技能加速器。Brook\
  \ 在`第 4` 章《网络安全架构师的秘密》中写过处理陌生问题的益处，如果读者想了解更多细节。\n\n除了跨团队包含的学习方面外，这样做还能建立社区。创建和维护实践社区是\
  \ Brook 近 30 年职业实践中的一个主要方面（甚至在他专注于安全之前，作为技术领导时也是如此）。他与 James 构建的软件安全计划始终将围绕执行 `SDL`\
  \ 的社区建设作为其首要目标之一和主要的文化黑客手段。\n\n（注：我注意到提供的源文件中存在一些重复文本。让我继续处理独特的内容流）：\n\n但社区不会在不付出努力的情况下凭空而生。工程师中许多人倾向于内向，可能是一个相当难以形成社区的群体。参与者必须停止操作电脑才能进行互动。\n\
  \n### 培养实践社区的技巧\n\n- 为社区创建一个空间。\n- 让分享成为一项安全感的活动。\n- 分享成功也分享失败。\n- 共同解决问题。\n- 允许多样化甚至冲突的意见。\n\
  - 定期且可预测地会面。\n- 通过多个渠道与社区交流。\n- 将定期的改进培训作为社区空间的一部分。\n- 建立积极倾听的榜。\n- 赋予社区对影响社区的项目的决策权。\n\
  \n社区空间可以是虚拟的；截至本文编写，我创建过五个虚拟社区空间。社区空间确实有助于建立信任、关系和共享经验的纽带。偶尔面对面会有帮助。然而，面对面的会议通常是稀有的奖励；目前软件开发和安全领域的大多数人都习惯了与远程人员工作，并适应虚拟会议环境。只要会议通常为参与者提供价值，人们就会定期参加。关键在于社区空间存在并以可预测的方式重复。\n\
  \n\n\n\n\n# 如何在定期会议中创造价值感？我不声称自己拥有一种百之百灵的专利技术。遗憾的是，有时在虚拟团队会议上，人们不得不处理一些行政事务，而这（不幸的是）会成为社区凝聚力的破坏者。当我的议程中有重要业务事项时，我总是尝试将其与一些感兴趣的内容取得平衡。\n\
  \n我从另一个完全不同的领域学到的一项很棒技巧是以简短的技能培训演示或练习开始会议。几乎任何情况下，对团队软件的一个部分进行 `threat modeling`（威胁建模）都会引起大量的兴趣。如果我的社区成员至少部分来自开发团队，那么他们当前的某个项目就会成为引起广泛关注的绝佳主题。\n\
  \n团队将展示他们的架构。然后，整个社区都可以对架构进行攻击和防御分析。这些讨论会变得非常有互动性，有时会产生冲突，只要保持礼貌并专业地专注于手头的工作，这没有问题。许多参与者都有分析和发言的机会。两个意见不合的人之间的对话应该尽快结束，以便让其他人尝试进行分析。\n\
  \n演示也可以关于新的试点或实验、新技术、团队发新的新流程，包括这些流程的优点和缺点。如果这些演示保持简短且重点，它们将至少会让社区的一部分成员感兴趣。\n\n\
  很难找到让每个人都感兴趣的主题。关于新流程指令以及现有流程或工具变更的演示通常具有相当广泛的兴趣，通常会获得强烈的参与——关键在于，通过提供技能技能和知识传递的机会，虽然每一场演示都能让每个参与者感兴趣，但随着时间的推移和多样化，许多演示可能会非常有吸引力。\n\
  \n共同的问题是另一个重要的社区建设者。但关于每个团队所做的一切的长报告是枯燥的、令人失去兴趣的并最终杀死社区。我的强烈建议是避免安排充斥着团队汇报的议程。工程师在多团队项目中经历过很多这种情况，定期报告必须是流程的一部分。他们不需要在安全架构社区领域这样做。\n\
  \n相反，请留出一个定期且可预测的时间，让任何成员都能提出他们想要帮助的问题。这个议程项目应该是相对非结构化的。\n\n如果组织历史上在发言方面存在情感包袱，甚至提出问题会带来负面后果，那么协调者将不得不直接处理这段历史。我的意思不是回顾历史；而是征求贡献，然后以某种有意义的方式尊重这些贡献。\n\
  \n对话——即当两个或三个参与者来回往复，本质上意见不相，或重复相同的冲突点时——必须被中断，通常是简单地感谢发言者提出问题，然后询问其他人的意见。如果其他人都保持沉默，我将询问是否还有人关心这个问题。如果只有发言者或少数几个参与者感兴趣，那么协调者可以将该议程项目或问题移到仅由这些相关人员参加的会议，将冲突从社区空间中移除。或者，如果其他参与者保持沉默，就问他们为什么。这总是能引出那些占据会议所有发言空间的人之外的贡献。有时，安静的人发言时，\n\
  \n有时，当安静的人发言时，社区往往能获得最有价值的见解。协调者的工作是创建一个安全空间让这些声音被听到，特别是在存在分歧时。目标不是寻找最简单的路径，而是为项目最安全的路径。\n\
  \n有时，当安静的人发言时，社区往往能获得最有价值的见解。协调者的工作是创建一个安全空间让这些声音被听到，特别是在存在分歧时。目标不是寻找最简单的路径，而是为项目最安全的路径。\n\
  \n有时，当安静的人发言时，社区往往能获得最有价值的见解。协调者的工作是创建一个安全空间让这些声音被听到，特别是在存在分歧时。目标不是寻找最简单的路径，而是为项目最安全的路径。\n\
  \n## 6.6 威胁建模培训面向所有人\n\n在我们向任何与软件开发和运营相关的任何角色的人开放威胁建模培训后，我们开始看到一种深刻的文化转变。尽管正如你从这一章中看到的，我们雇用了许多“文化黑客技巧”，但将安全意识深层引入开发的唯一黑客手段是\
  \ `threat modeling`。\n\n这并不是说开发中的每个人都会变成威胁建模专家。这并不是必要的，也远不现实。我们向人们介绍威胁建模，然后与那些负责构建和维护模型的人建立技能。这些人通常是更高级的工程师和架构师，尽管并非总是如此。\n\
  \n\n\n\n\n我们没有见过任何其他方法能像“威胁建模介绍”这样，广泛且一致地传递软件安全意识——这种方法让与会者实际尝试识别可能生效的攻击，以及有助于保护或防止攻击的防御措施。无疑，确实存在各种安全意识计划，它们通常会包含一些关于软件安全的内容。必须编写代码的人必须（正如我们的\
  \ `SDL` 要求的那样）接受安全编码培训。但安全编码培训对非编码人员没有帮助。\n\n无论如何，每个人在某种层面上都在做威胁建模。开车涉及一些威胁建模（尽管还涉及许多反应性的威胁响应！）。购买大件值物品，如家电、房屋、车辆，都涉及一些威胁建模。关键在于关注数字威胁和数字防御机制。这种“文化黑客”（culture\
  \ hack）手段能以一种清晰可感知的方式（至少对大多数参与者而言）将软件安全“带回”参与者身边。\n\n鼓励每个人至少熟悉威胁建模的意图，并了解其技术，可以将软件安全和\
  \ `SDL` 的重要性内化。这是迈向“安全文化”的一种强大的文化黑客手段。\n\n此外，一旦每个人都理解了威胁建模（至少在某个高层面上），每个人都可能为模型的拼图贡献重要的一部分。以下摘自\
  \ *Secrets of a Cyber Security Architect* 的节录强调了在构建模型时包容性的重要性。\n\n> 就我的观点而言，向所有人介绍威胁建模和项目的威胁模型。同时，提醒他们模型本身（尤其是其尚未实现的结果）是机密的，不能与不需要知情的人共享——特别是组织之外的人。攻击者可以利用威胁模型大作一场，因此需要对其进行保护以防止无意中泄露。\n\
  \n> 我们在全球开发中心巡回时发现，当你把每个人都纳入其中时，就能获得更好的威胁模型。这其中的一个原因本显而易见，但经常被忽视：威胁模型在从整体上进行时效果最好。一个被遗漏或忽略的细节，很可能错过一个重要的攻击向量或重要的影响。\n\
  \n> 让我提供一个真实生活的例子。我们当时检查一个网关产品。团队已经完成了相当详尽的威胁建模。我做的只是审查结果。因为我在审查中邀请了所有人，团队中一个较年轻的成员提到，为该网关选择的底层操作系统（将随产品一起交付）运行着\
  \ `SSH` 服务器。该 `SSH` 服务器带有一个公开的默认密码。这是供应商为了方便开发期间的调试而对操作系统进行的配置方式。\n\n> 因为团队高度关注产品的功能，他们忘记了考虑整个运行时栈（这是我在\
  \ *Securing Systems:* 书中反复强调的一点：必须包含运行环境，否则就会让攻击面处于无防御状态）。这个网关出厂时可能带有那个问题，那个问题导致了\
  \ Mirai 僵尸网络的形成，并引发了著名的 `DYN` 攻击。也就是说，部署在各地的摄像头运行着带有公开默认密码的 `SSH`。剩下的就是历史了。\n\n\
  > 如果我们当时没有所有人都在场，很可能在审查期间我们会漏掉这一关键信息——这个需要防御的、易于获取的攻击点。在我的演讲中，我喜欢说：“威胁模型是许多不同领域的十字路口，也是各领域专家的集合。其中任何一个环节的缺失都意味着威胁模型是不完整的。”\
  \ 该网关的威胁模型正是这一观点的完美案例。\n\n> 与威胁模型的完整性同样重要的是，包容性为我们提供的文化黑客手段。这正是“魔法”发生的地方。\n\n> 根据在全球各地教授的数百场威胁建模课程，我观察到，一旦参与者在心理上攻击系统并识别针对这些攻击的防御措施，他们就会对软件安全为何如此关键产生整体感。参与者体会到了整个安全开发生命周期（`SDL`）的重要性，无论这种\
  \ `SDL` 在其组织内部如何被表达。对于大多数参与者来说，只要他们有机会参与威胁建模过程，向安全文化的转变就是深远的。正如我上面所提到的，如果软件安全中真的有任何魔法，那就是允许每个人参与到威胁模型的构建中，学习这一过程，并让威胁模型在整个开发过程中对所有人（甚至是非技术人员）触可及。\n\
  \n> 为了补充我对包含甚至非技术人员的呼吁，我在奔驰（戴姆勒）公司的一次内部安全架构活动上做过演讲。Carsten Scherr 负责戴姆勒的安全架构计划，Luis\
  \ Servin 是技术负责人之一。他们邀请了整个供应链的安全架构师参加。我以前从未见过任何公司对供应链进行如此周全的关注。Carsten 和 Luis 意识到，如果没有每个供应商的充分参与（这些供应商的安全态势将贡献或损害整体态势），他们无法将戴姆勒的产品带到“理想状态”。\n\
  \n> 所以，为什么不包含所有必须参与关于“事情必须如何做”讨论的人呢？在我看来，这种跳出框架的、包容性的思维，正是我们行业为了跳出似乎在不断创造的设计问题所需要的。包含*每个人！*\
  \ 真的！\n\n> “参与式威胁建模是文化黑客——将开发文化黑客化为安全文化。”（*Secrets,* pp. 88-89）\n\n\n\n\n\n这个故事也顺带提到了合规性在软件安全中的地位。合规性与安全性这两者并不等同，而且并不一定能产生相同的结果，下文将对此进行解释。\n\
  \n> 组织越大，越容易遇到截然不同的观点。有时，我作为安全架构师的观点可能会与某种冲突、甚至不兼容的观点迎面撞击。这可能是我们这些追求组织变革的人——即那些“文化黑客”所面临的最大挑战之一。\n\
  \n> 让我给举个例子吧。我的一位老朋友（为了保护她的隐私，就不透露名字了）是她领域的公认专家，她拥有合规背景。我们对合规性和安全性的本质存在很大分歧。她认为实现强合规性就能提供适当的安全保障。我不认为事实如此，因为标准和法规通常对问题空间的本质做出假设，对标准的适用人群做出假设，对目标组织的结构做出假设，对标准针对的对象以及对解决方案集做出假设。由于创建、起草和批准一项标准需要花费长时间（数年），自标准中的语言成型以来，威胁格局和解决方案可能已经发生了巨大变化：这些内容很少是与时的。\n\
  \n> 想象一种标准，它假设软件安全是关于构建应用程序的。那些创建嵌入式软件或云的组织可能轻易认为“应用程序安全”并不包括这些其他组织正在构建的软件。此外，想象该标准在提到实施组织时，总是指代信息技术（IT）。许多组织并不在他们的\
  \ IT 部门开发产品软件，而是在其研发或工程部门开发。那么，他们是否会认为该标准并不是为他们的软件设计的呢？\n\n> 我上述内容并非编造。事实上，`ISO\
  \ 27034` 的第一个草案确实存在前一段所描述的问题。尽管 `ISO 27034` 意图涵盖通用的软件安全，而不只是 IT 软件交付，也不局限于应用程序，但这些问题还是渗透进来了。哎？我想是。\n\
  \n> 事实是，编写通用标准很难。改变范范围的假设很容易渗透进来。标准的起草者可能认为每个人已经知道什么是“渗透测试”，因此没有必要定义它。这正是《支付卡行业数据安全标准（PCI）》第一版和第二版的做法。但遗憾的是，渗透测试并没有标准的定义，而\
  \ `PCI`也没有指向某个特定的定义作为标准所指的定义。事实上，公司通过广泛的测试通过了 `PCI` 的渗透测试审计，涵盖从定期的漏洞扫描、应用程序漏洞测试，一直到手动驱动的入侵尝试（这是行业公认的“渗透测试”的常用定义）。我刚刚提供的三个测试示例所交付的结果大相径庭。\n\
  \n> 为了实现合规，目标是满足一组特定的预设要求：即被编入标准或法规语言中的内容。这些可能是像 `GDPR` 或 `HIPAA` 这样的法规，也可能是像 `ISO\
  \ 27001` 或 `SOC 2` 这样的标准。\n\n> 遗憾的是，标准的某些要求可能与受保护的情况完全无关。事实上，这种情况经常发生。或者像 `GDPR`\
  \ 那样，要求可能模糊到本质上毫无意义。以`第 32 条`为例，它据称描述了需要哪些安全措施：\n\n> **“第 32 条：个人数据安全——处理安全性**\n\
  >\n> “`GDPR` 第 32 条要求控制者和处理者应实施适当的技术和组织措施，以确保与风险适应的安全水平’”\n>\n> (a) 个人数据的去标识化和加密；\n\
  >\n> (b) 确保处理系统和服务的持续机密性、完整性、可用性和恢复能力能力；\n>\n> (c) 在发生物理或技术事件时，及时恢复个人数据可用性和访问的能力；\n\
  >\n> (d) 定期对测试、评估和评价确保处理安全的技术和组织措施有效性的流程。”\n\n\n\n\n\n> 以我朋友为例，如果她坚持要用某项法规或标准的条文来表达观点，只要执行者理解了需要满足的安全需求，这又有什么关系？\n\
  \n> 通过在表达方式上保持灵活性，我可以专注于目标。只有在必须实际完成的任务发生冲突时，我才希望进入冲突解决、谈判和妥协阶段。很多时候，所有的条路实际上都通向适当安全实施的“罗马”。或者，如果某项监管要求确实不合适，或者更糟，与事实无关，总有一个通过详细记录不合规可能导致的极低概率和影响而获得的“退路”。大多数标准和法规都允许以业务风险的术语给出非合规声明。只要做得足够好，提供替代合规措施的风险评估通常可以通过审计。\n\
  \n> 通常还有“补偿性控制”的可能性。补偿性控制是替代性的防御措施，能够实现与标准要求的相似的 CIA（机密性、完整性和可用性）保护。例如，针对静态数据加密的补偿性控制措施可能如下一组控制：\n\
  \n- 高度限制的网络网段。\n- 访问需要多因素身份验证。\n- 对特权访问实施严格的、仅限知情者的限制。\n- 授予访问权限后仅允许在限制期间进行。\n-\
  \ 授权通过一个采用授予方和接收方之间职责分离的正式化流程进行。\n- 对存储的任何访问都要求记录所有高特权操作，并由一个独立小组（非接收方）进行监控。\n\n\
  上述控制措施可以补偿静态数据加密。如果记录得当，这些措施很可能通过审计，并在法庭上被辩护为符合 GDPR 要求的“个人数据加密”以及“确保持续机密性、完整性的能力”。（*Secrets*，页码第\
  \ 100-103 页）\n\n我们已经向您简要介绍了一些我们最喜欢的“文化黑客”技巧——我们所做的一些可能并不“官方”的事，或者至少不是项目管理的官方组成部分（尽管，实践社区在普遍范围内被认为是一项战略举措）。接下来的章节包含了组织必须正式且非常有意识地进行“黑客攻击”的方法——即在形状和形式上进行改变，以应对\
  \ DevOps、云原生和开发者赋能的安全方法带来的挑战。事实上，某些读者可能会觉得我们正在建议组织改变其结构，即所谓的“组织架构图”。毫无疑问；我们确实在声明，为了实现深度集成到软件开发经纬线中的\
  \ SDL（软件开发生命周期），组织很可能必须有意识地改变向谁汇报的关系，改变某些角色，并进行不同的投资。\n\n接下来的章节概述了支持本书中所述变更的组织结构和投资。\n\
  \n## 6.8 组织管理视角\n\n从组织管理的角度来看，我们认为有四个关键领域区分了安全向 DevOps 的演进，这些领域超越了普通 DevOps 中关于自动化和工具的讨论：(1)\
  \ 安全文化变革；(2) 安全事件响应；(3) 安全培训；以及 (4) 安全技术债（遗留软件）。这些领域也是第 2 章和第 5 章中涵盖的内容，也是我们从组织管理视角所呈现内容的核心要点。\n\
  \n### 6.8.1 安全文化变革\n\n首要任务是在 DevOps 中构建安全所需的文化变革，以便妥善地促进以敏捷速度构建安全。这将需要一个极具争议的改变，因为它要求从一种近乎普遍的现状（即缺乏资金支持的安全指令，仅在开发组中配备兼职人员（安全冠军））转变为有资金支持的指令，拥有全职专职、具有开发经验并分别属于开发团队和小组的安全工程师和架构师。\n\
  \n正如本书之前讨论的，DevOps 需要一种将运营与开发合并同时促进协作的文化变革。本书一直关于将安全整合到相同的 DevOps 过程中。最重要的是，开发、运营和安全从产品开发项目的开始就应该相互进行协作并参与。这最终将导致漏洞的早期识别、消除孤岛、缩短交付时间并增加交付频率。\n\
  \n我们讨论的 DevOps 另一个关键组成部分是团队必须争取持续集成和交付。内置安全的一个关键优势是，它现在可以为持续开发、威胁检测和发布周期提供效率。协作将通过书中早期讨论的威胁建模、代码审查和红蓝对抗增强安全问题的检测。这些文化变革带来的另一个安全优势是它鼓励了更频繁的代码提交和版本控制。\n\
  \n通过上述文化变革实现的关键业务价值包括运营效率的提高、成本节省、质量保障和自动化测试，这些共同导致安全威胁数量的减少。\n\n文化变革的一些关键要素应包括：\n\
  \n- DevOps 中的安全还关乎于对人的投入、改进开发、运营和安全之间的通信渠道，并尽可能实现可以实现的自动化，以便人类能够专注于我们最擅长的事情。当您对人投入时，实现了\
  \ DevOps 成功的最大化，这反过来也改进了流程和工具。其中一些工作包括向开发者提供修复指导、将安全知识和安全编码实践集成到您的 DevOps 团队中，并让安全团队通过自己编写代码来增加开发的理解。\n\
  - 使用自动化代码审查以及自动化应用程序和产品安全测试。通过将安全控制措施嵌入软件开发生命周期早期来实现核心安全任务的自动化。应对整个应用生命周期（包括开发和维护）的安全缺陷进行持续监控和修复。\n\
  - 通过建立 DevOps 团队的战略驱动来实现持续过程改进，以满足不断变化的业务需求。这应包括持续赋能以启动文化变革，促进开发者、安全团队和运营人员之间的协作。DevOps\
  \ 安全需要持续改进以实现预期效率。\n- 在各自领域内推动变革和协作，导致实施人员实践的文化转变。这必须是一种转型转变，将安全文化、实践和工具整合到 DevOps\
  \ 流水线的每个阶段，驱动安全的可见性、协作性和敏捷性。\n\n\n\n\n\n- 每位员工和团队都对安全负责，需要高效地做出决策并付诸，同时不牺牲安全性。更快地将新代码推向生产环境通常是驱动新业务的目标——但在当今世界，这一目标需要与解决安全问题取得平衡。\n\
  \n- 使组织能够以更快的速度为消费者提供日益安全的产品。在应用后期安全实践期间，减少僵局状态可以为 DevSecOps 工程师腾出大量时间，以便他们在产品开发周期的其他阶段进行改进。\n\
  \n最终目标是让 DevOps 团队能够尽可能高效、自动地实施安全，并将其作为日常流程的一部分。DevOps 和安全团队拥有一个共同的工作框架来开展转型，这种转型将消除过去存在安全团队与\
  \ DevOps 团队之间的摩擦。通过成功的文化变革，将产生以下行为：\n\n__________\n\nWeeks, D. (2018, August 13).\
