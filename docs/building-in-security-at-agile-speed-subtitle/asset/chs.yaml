  \ 类别（攻击机制）相结合，可能为威胁建模提供所需的信息集。这就是我向学生展示这些内容的方式：ATT&CK 头部和 CAPEC。\n\n**表 4.2 MITRE\
  \ ATT&CK 列**\n\n| 类别 |\n| --- |\n| 初始访问 (Initial Access) |\n| 执行 (Execution) |\n\
  | 持久化 (Persistence) |\n| 权限提升 (Privilege Escalation) |\n| 逸逸 (Defense Evasion) |\n\
