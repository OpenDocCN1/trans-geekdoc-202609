  md: '# CHAPTER 4


    # Assistive Devices and IoT in Healthcare

    Functions


    ABHINEET ANAND¹, SAI PRASAD MISHRA², and SUBRATA SAHANA²


    ¹Chchitkara University Institute of Engineering and Technology,

    Chkara University, Punjab, India


    ²SCSE, Galgotias University, Greater Noida


    *Corresponding author. E-mail: Abhineet.mnnit@gmail.com


    # ABSTRACT


    Assistance to humans in the form of hardware for people with difficulties (or

    disabilities) is no new thing rather it has been part of human experience since

    ancient times. Internet of Things products for people who are not capable of

    any particular things are readily available to assist them in their daily life

    activities. In this literature, a study of different devices and their comparative

    study in structured way have been carried out to learn and list the things happening

    in this domain. It is also going to help how the future products are

    supposed to be designed so that it may help mankind to live a better life.


    # 4.1 INTRODUCTION


    A healthy nation say they is a wealthy nation. People get ill, accidents

    happen, and emergencies arise, that is why healthcare is important. Health-

    care can be defined as the diagnosis, treatment, prevention and management

    of injuries, diseases, illnesses, which helps in preserving physical and

    nmental well-being of humans. Healthcare is divided into various areas to

    meet health needs of everyone in a nation and worldwide. It comprises of

    hospitals, clinics, medical devices, health insurance, medical tourism, and'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Deep Learning and IoT in Healthcare Systems


    assistive technologies. Healthcare industry will continue to thrive as long as
    humans exist and hence forms a major part of any nation''s economy. The Indian
    healthcare sector is growing at a quick pace as it is providing public healthcare
    coverage and accessibility to various healthcare tools.


    Technology is a major part of the modern-day healthcare system. Latest technology
    provides us with many benefits to lead a healthy life. People depend on innovations
    in technology to lead stress-free life. Many companies have been focusing on developing
    healthcare technologies and building IT solutions for them. Patients now have
    access to best diagnostic tools and new-edge treatments. The year 2016 is considered
    the biggest year of healthcare technology innovations. There were many innovations
    including medical devices and gadgets. The year 2017 witnessed innovations and
    healthcare solutions in the fields of healthcare technology infrastructure, care
    models, and disease management applications. The year 2020 will see a great increase
    in the health data across cloud and mobility solutions that is estimated to reach
    US $83 million and thus the data collected from healthcare sector to reach US
    $280 billion.


    Modern technologies such as cloud and big data have transformed the information
    and technology in healthcare. There is a huge amount of data collected from different
    resources in the field of healthcare. Big data helps in analyzing, making predictions
    about, and preventing huge risks every day, whereas cloud helps in reducing the
    wastage and improving efficiency in research and development. It also helps in
    facilitating efficient health exchange information.


    Still, to reach such a large population of society, including the elderly and
    people who are prone to chronic diseases, is difficult. While technology cannot
    stop aging or eradicate chronic diseases, it can help to make it easier in terms
    of accessibility. Internet of Things (IoT) has enlarged the ambit of care delivery
    in healthcare, and IoT-based medical devices have become channels of pervasive
    healthcare to reach patients at the right time (Domingo, 2012). With the real-time
    monitoring of health connected to a smartphone, has become easier for doctors
    or authorized people to keep a track of the health condition of patients regardless
    of the place, time, and situation. The IoT devices collect and transfer health
    data such as blood pressure, oxygen and blood sugar levels, weight, ECGs, as discussed
    and shown in Figure 4.1.


    There are many applications of IoT such as cancer treatment, continuous glucose
    monitor and insulin pens, automated insulin delivery, connected inhalers, and
    promotion of hygiene hospitals.


