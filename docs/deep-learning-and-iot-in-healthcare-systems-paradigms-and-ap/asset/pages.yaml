    # 8.9.1 UNIFIED MEDICAL RECORD FOR ALL CITIZENS


    The medical record services are provided by the hospitals and health centers through
    intranet, where the accesses of the record are only subject to patient’s authorization
    or judicial. Otherwise the record is the property of the hospital and they can
    use it for medical audit or as a case study.


    Using Aadhaar card number, government can implement IoT-based e-medical record
    for all the citizens, where the requirement for unique identification for a single
    patient in multiple hospitals are not required.


    # 8.9.2 WHY IS THIS REQUIRED?


    Generally, patients have to carry multiple diagnostic reports and prescriptions
    if they go to a hospital for treatment. Due to modern age competition of private
    hospitals and access to government facilities, the patient usually have to carry
    a large number of reports for medical record history. For a long run, a hospital
    has the capacity to take care of the medical record for a certain time. OPD records
    are not available to the patients as well as hospital’s outdoor due to heavy flow
    of patients. Now, if a patient wants to go to another hospital, they need to carry
    the physical report. And due to unawareness, the patient may misplace the reports.
    There are many other disadvantages:


    +   1. Patient misplaced the physical records and have to do several repetitive
    unnecessary diagnosis.


    +   2. One hospital does not see another hospital’s record easily, if patients
    misplaced it.


    +   3. Medical history cannot be feasible to the doctors for prompt treatment.


    +   4. Reproductive out-of-pocket cost is associated with the nonretention of
    medical record.


    +   5. Government or authority cannot measures the standard of treatment thus
    poor clinical auditing.


    +   6. Poor implementation of quality measurements.


    +   7. Time and cost of the treatment will become high, thus mortality and morbidity
    cases arise for a serious patient.'
