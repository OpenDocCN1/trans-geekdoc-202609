    # 5.8 GLUCOSE LEVEL MONITORING


    Diabetes mellitus is a chronic disease that affects many people around the world.
    Due to an increase in the sedentary work around the globe and advancement in the
    technology, according to WHO, 422–500 million people suffer from diabetes (WHO,
    2018). Over the past few decades, this disease has almost grown like roots in
    human society. There is someone or the other in today''s world who is suffering
    from this chronic disease. Diabetes is a disease where the blood glucose (aka
    blood sugar) of an individual is very high. In the human body, body glucose is
    the major source of energy that provides the cells with the power to work, and
    it comes from the food that an individual takes. Insulin is a hormone in the human
    body that is produced by the pancreas, which helps the glucose reach the cells
    of the body for energy. Sometimes, the body is not able to produce enough insulin
    (or no insulin)'
  merge: -1
