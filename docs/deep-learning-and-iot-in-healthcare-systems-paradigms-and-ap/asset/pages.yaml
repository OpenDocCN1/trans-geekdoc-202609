- pgno: 304
  md: '# 10.5.3 ENERGY EFFICIENCY AT NETWORK LAYER


    The network layer is responsible for routing of data from source to destination.
    The simplest technique for routing is known as flooding, in which data received
    by a node are forwarded to all the neighboring nodes via broadcast. This technique
    is quite inefficient in terms of energy efficiency and also suffers from several
    other disadvantages as implosion, overlap, gossiping, etc. Several modified forms
    of flooding have been proposed by researchers to overcome its shortcomings and
    make the network more efficient, reliable, and perform better in terms of other
    QoS parameters. Routing techniques have been developed to solve the problems,
    which result in uneven and random increase in energy consumption by the edge nodes
    and other network devices. This includes balancing uneven flow of data, reducing
    retransmission of data, eliminating redundant data transmission, lower end-to-latency,
    and many more. Such routing protocols decide the most reliable path to transmit
    data not only with minimum packet loss and maximum throughput but also with minimum
    energy consumption. The routing protocols designed for various applications of
    sensor networks are categorized into five types—content or attribute based, flat
    based, geographical, hierarchical, and multipath routing. However, similar to
    physical and network layers, few additional challenges must be considered while
    designing a routing protocol for BANS. These are briefly introduced as follows.


    +   - Dynamic topology: In the BAN, the sensors are placed either on (wearable)
    or inside (implantable) the human body. Since these sensors send their data through
    a wireless channel (wireless BAN or WBAN), their orientation with respect to the
    data aggregator or sink node is directly dependent on the movement of human body.
    This makes the channel conditions more random and dynamic, except for the case
