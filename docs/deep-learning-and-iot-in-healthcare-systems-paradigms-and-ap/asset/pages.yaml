  md: '# 80 Deep Learning and IoT in Healthcare Systems


    (Source: https://twardsdatascience.com/machine-learning-is-the-future-of-cancer-prediction-e4d28e7e6dfa).


    Many researchers have been studied for the prediction of esophageal cancer with
    avoidance of expensive and invasive diagnosis. This type of cancer found in the
    esophagus. The esophagus is a vacant tube (i.e., food-pipe) that starts from throat
    to stomach. This helps to swallow the food. Esophageal cancer helps affect the
    food pipe and further treatment because these diagnosis go through mouth of the
    person using various kinds of imaging tests using X-rays (Barium swallow/CT scan),
    magnetic fields (MRI scan), endoscopy (a camera in a tube, passed down the throat),
    and even a biopsy (a small piece of tissue removed and examined) (Source: https://researchmatters.in/news/machine-learning-leads-cancer-prediction;
    Yala et al., 2019; Cruz and Wishart, 2006).


    The upcoming new research in cancer prediction focuses to mitigate false-negative
    rate. At the initial stage, it requires various demographic details about the
    patient such as the use of tobacco, alcohol, smoking, and other medical histories
    for prediction. The algorithms used for prediction are classification algorithms,
    logistic regression, support vector machine (SVM), random forest, and naive Bayes
    classifier. By developing serial images of tumors with nonsmooth cell lung cancer
    can predict and provide better care against clinical diagnosis (Source: https://eurekalert.org/pub_releases/2019–04/aafc-adm041819.php).
    In a study, it has been found that near 85% death is caused by lung cancer. In
    this respect, a neural network-based tool named “ImageNet” is created by researchers
    at Princeton University and Stanford University to do the correct prediction of
    lung cancer.


    Breast cancer is a kind of cancer that is growing rapidly in women all the world
    due to modern lifestyle. In a report, it is found that in the early stage, if
    cancer is diagnosed successfully with one of the existing techniques, as mammography
    and biopsy then patient survival rate can be enhanced by 80% (World Health Organization,
    2014). For the early prediction of breast cancer, a new tool with advanced AI
    features has been proposed to identify the amount of dense tissue compared to
    the amount of fatty tissue in a mammogram (Source: https://www.technologynetworks.com/cancer-research/news/using-ai-to-predict-risk-of-breast-cancer-319067).


    In mammography, breast images are analyzed by the radiologist, while in biopsy
    of tissue from the affected breast area is examined for recognition and categorization
    of the tumor through a microscope by a pathologist (Khan et al., 2019). “Benign
    and Malignant” are the two'
