  md: '# Assistive Devices and IoT in Healthcare Functions


    # 105


    ![](img/8e78e716c4c366f9e41f495059d443ec_121_0.png)


    FIGURE 4.1 Healthcare using IoT.


    # 4.1.1 IoT AND ASSISTIVE TECHNOLOGY


    Before IoT technology, many disabled people bounded themselves or were depended
    on other people for doing things for them. However, today, due to advancement
    in cutting-edge technology with devices and software systems, it has become easier
    for the disabled person to cope with difficulties and they can face almost any
    challenge of daily life easily. IoT technology truly brought the era of assistance
    to a new start and challenged the big industries including healthcare, education,
    and rehabilitation centers to integrate IoT with the assistive technology (AT),
    as AT devices are proficient for individuals with disabilities. IoT assistance
    has improved the services provided to visually impaired, deaf, and hearing-impaired
    people and also people with different health conditions to track as well as improve
    their condition. With IoT leading the blind, the latter can better understand
    and perceive their surroundings to react fast.


    # 4.2 ASSISTIVE TECHNOLOGY


    AT are products and systems that enhance the daily life of persons. It is any
    item or piece of equipment or software program that is used to maintain or increase
    the capabilities of disable or sick people.'
