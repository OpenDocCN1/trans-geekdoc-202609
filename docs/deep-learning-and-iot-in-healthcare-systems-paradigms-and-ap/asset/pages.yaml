  md: '# 11.6 FUTURE SCOPE


    This methodology can be used with a microcontroller with the algorithm coded in
    simple C/C++, a programming language that will eventually work as a direct connection
    between the EEG headgear and the computer. The microcontroller attached to the
    EEG headgear used by a patient will apply the required feature extraction onto
    the data raw, data received, and separate different brainwaves (alpha, beta, theta,
    theta, and delta) and will give the solution using the technology of Internet
    of things to solve the cause of the issue.


    For example, a patient is hyperactive due to the loud noise; then, the microcontroller
    will communicate with the environment and use the noise cancellation techniques
    to lower the brainwaves that cause the patient to turn hyperactive and will monitor
    the brainwaves in real time and will give the solution for the problem in real
    time. This is the only example application, the possibilities are endless, and
    the patient will get the real-time solution and a hardware communicating to him
    in real time; the hardware will be cheap and affordable and hence also lower the
    cost of expensive treatments from the neurologist.


