    # 5.3.2 ASSISTIVE DEVICES'' COMMUNICATION PROTOCOLS


    A communication system for assistive devices is a novel technology that connects
    the human and machine (Kim et al., 2015). Wireless communication is vital for
    assistive devices to transmit data to neighboring devices, which creates several
    issues in transmission (Jiang et al., 2015). The wireless communication system
    aims at short-range communication like body area network (BAN) and personal area
    network (PAN) as a transmission conduit. Assistive devices use wireless communication
    to set up BAN to transmit data to proximate devices. In early days, the radio
    transmission technique is used in BAN, which is susceptible to wiretapping. Assistive
    devices transfer most sensitive data that should be securely (Jeong et al., 2012).
    Moreover, intrabody communication is wireless and the electric-field distribution
    of assistive devices uses the human body as a conducting wire using the finite
    difference time domain method (Zimmerman, 1996), and hence, radio transmission
    is not applicable. Zimmerman has introduced the intrabody communication system
    (Sasamori et al., 2009).


    The hardware design for an intrusive wireless communication system for an assistive
    device is explained in Figure 5.1, which depicts the information transmission
    of an intrabody network to proximate devices. It accommodates a serial interface
    unit, which acts as an on-chip communication system, a serializer/deserializer
    and a modem. The The is module by a processor through a processor that increases
    the that of the system by using first-in-first-out (FIFO) methodology and transforms
    the data into serial form. The serial transformed data is converted into a transmission
    signal with a specified frequency using a modulator. The deserializer transfers
    the data to the serial interface unit and the main processor.'
