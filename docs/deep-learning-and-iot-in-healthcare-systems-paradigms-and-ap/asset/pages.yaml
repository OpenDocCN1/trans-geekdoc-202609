- pgno: 308
  md: '# 10.6.1 CLASSIFICATION OF ROUTING PROTOCOLS


    Broadly, energy-efficient routing protocols can be categorized as follows.


    +   - Attribute-based routing protocols: The sensor nodes transmit the content-based
    data packets to the neighboring nodes. The major attribute-based routing protocols
    include energy-aware data-centric in which each node decides whether to forward
    or drop the received data packet for improving the energy efficiency at network
    level (Sarvesh, 2017). However, the major concern is possibility of overfitting,
    which needs to be avoided.

    - Flat-based routing protocols: A large number of nodes having the same configuration
    and features collect the data together and transmit them to the destination. Initially,
    the data is stored in the routing tables of different nodes. Based on this information,
    the source node selects the intermediate nodes and then transmits the data to
    the desired destination. There are several parameters, including energy level,
    received signal strength, and hop count of intermediate nodes, which determine
    the operation of flat-based routing protocols (Sarvesh, 2017). These are preferred
    over improvement in energy efficiency.

    - Geographical routing protocol: The data is transmitted from the source node
    to the destination node taking the shortest distance based on the location information.
    This improves the overall energy efficiency of the network in addition to reducing
    the packet overhead with network lifetime.

    - Hierarchical routing protocol: This is the most energy balancing routing protocol.
    In this protocol, a number of sensor nodes constitute a cluster. One of the sensor
    nodes in a cluster is designated as the cluster head. Different sensor nodes collect
    the data and transmit them to their cluster head. The data is aggregated by the
    cluster head and then retransmitted to the base station (another sensor node in
    the network). The most widely used hierarchical routing protocol is low-energy
    adaptive clustering hierarchy (Yating, 2019).

    - Ad-hoc on distance vector (AODV) routing protocol: In the AODV routing protocol,
    the route selection is done by the destination node based on signal-to-noise ratio
    (SNR) and hop count metrics which are usually used for estimating the link quality.
    A modified data packet RREQ, which includes the SNR information, is used for route
    discovery. On receiving the control data (RREQ) by the destination'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# Energy-Efficient Network Design for Healthcare Services


    node, it sends the RREP data packet to the source. The network is energy efficient
    based on its network lifetime with higher throughput (Sarwesh, 2017; Youngbook,
    2018).


    +   Multipath routing protocol: Additional control data are generated in case
    the route fails in single path routing protocol. This requires data retransmission,
    which results in increased overhead data in the network. To overcome this situation,
    multipath routing protocols are employed, which not only reduces the overhead
    of the system but also improves the energy efficiency and reliability of the network.


    +   Routing protocol for low power (RPL) algorithm-based mobility supported routing
    protocol: The frequent change in the network topology might result in deterioration
    of link quality, packet delivery delay, packet collision, or other inconsistencies.
    The RPL algorithm-based routing protocols provide energy efficiency while considering
    the mobility of sensor nodes (Lazrevsk, 2018; Al-Shammari, 2018). They make smart
    decisions to increase the network lifetime by estimating the energy consumption
    of the sensor nodes. There is significant improvement in end-to-end delay and
    packet delivery ratio while maintaining low packet overhead in the dynamic RPL
    networks.


    +   Energy aware wearing routing protocol: This protocol is primarily an energy-aware
    and QoS-aware routing protocol for communication devices used in the healthcare
    network. This results in reduced energy consumption and the traffic load (Elias,
    2012; Bhanumathi, 2017).


    # 10.6.2 STRATEGIES FOR ENERGY-EFFICIENT ROUTING PROTOCOLS


    In wireless body area networks, the multipath routing protocol reduces the number
    of retransmissions, which enhances the network lifetime, reduces overheads, lowers
    energy consumption per data packet, decreases end-to-end delay, and reduces the
    complexity. Using multipath routing protocols, the data are sent with higher confidence
    in terms of network lifetime, stability period, delay, and throughput, as well
    as minimum energy consumption. As an instance, the IM-SIMPLE protocol is a mathematical
    model, which uses short packets for communication employing TDMA mechanism (Awan,
    2016). A forwarder node is selected based on the distance from the destination
    node as well as its residual energy. This results in considerable'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Deep Learning and IoT in Healthcare Systems


    reduction in energy consumption with increased throughput. There are several strategies
    in different routing protocols that specifically focus on energy efficiency. Some
    of them are briefly described as follows.


    +   - Relay nodes: A relay node is introduced in the network, which enables balancing
    the load as well as reducing the energy consumption. The location of the relay
    node is selected in such a way that it reduces the probability of data packet
    drops with an increase in the delivery rate of data packets to the destination
    node. Data from multiple nodes are combined by the relay node to form a unified
    data packet prior to forwarding it with maximum energy efficiency. A two-hop extension
    routing protocol can also be deployed in order to send data packets directly for
    further reduction in the energy consumption.

    - Leader selection method: A relay node has the capability to amplify the data
    prior to forwarding it to neighboring relay nodes. This leads to overall improvement
    in network performance in addition to conservation of energy.

    - Packet size optimization method: Data errors may occur due to large size packets
    and retransmission requirements in WBANs. Very small size data packets pose limitations
    in overhead and higher energy per packet. Therefore, there is a need of optimizing
    the packet size considering energy efficiency and packet error rate.

    - Cloud computing method: Using cloud computing, a mobile health monitoring service
    is about 10 times more efficient than a standard one. This method is approximately
    20 times faster in storing, analyzing, processing, delivering, distributing, and
    securing critical healthcare data. Integrating cloud computing with WBANs offers
    a convenient remote health monitoring method (Sarvesh,2017), although it poses
    major challenges in providing security and authentication.

    - Restricted tree topology protocol: There are number of relay nodes located between
    different nodes and the destination node. A star topology using optimistic and
    dynamic relays is deployed, which results in higher reliability with minimum energy
    consumption under high propagation loss conditions. The link performance metric
    used is the received signal strength indicator (RSSI) (Lazarevsk,2018).

    - Critical data routing: Only the critical data is sent by the source nodes to
    two intermediate nodes, which have minimum transmission path loss. This method
    offers energy efficiency alongwith reduced propagation loss, improved network
    lifetime, enhanced stability period, and higher throughput (Al-Shammari, 2018).'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# Energy-Efficient Network Design for Healthcare Services


    +   - Co-LAEEBA protocol: Different nodes in the network use collaborative learning
    by sharing each other''s resources. This results in effective communication among
    these nodes, and data packets are received successfully by them. The destination
    node combines the data packets using the fixed-ratio combining method. This protocol
    uses the shortest-path routing algorithm based minimum hop count in order to yield
    better residual energy, higher throughput, and greater stability period (Bhanumathi,
    2017).


    +   - Adaptive multihop routing (AMR): Adaptive multihop routing (AMR) is basically
    an adaptive tree-based with multiple hops, in which fuzzy logic evaluates metrics
    such as residual energy, hop count, and RSSI (Bhanumathi, 2017). This results
    in better load balance and higher network lifetime and energy efficiency.


    +   - Energy-aware peer routing: In this method, the peer node is discovered,
    and the data packets are exchanged between them. Without employing a fully centralized
    system, the display unit is discovered dynamically in real time, thereby improving
    patient mobility and privacy. This results enhanced performance with reducing
    traffic load and overall energy consumption (Awan, 2016). This method offers real-time
    indoor healthcare monitoring services.


    +   - Cross-layer opportunistic MAC routing: In this protocol, any node may serve
    as a sensor node or a relay node. It is based on the use of appropriate handshake
    mechanism such as RTS/CTS along-with ACK. Relay node is selected having highest
    residual energy and located near the destination node. Thus, this strategy offers
    higher energy per bit, more network lifetime, reduced end-to-end delay, and higher
    energy efficiency.


    # 10.7 ENERGY HARVESTING


    As described in previous sections of this chapter, several techniques are being
    developed and tested to make the sensor networks more and more energy efficient.
    Another approach in this direction is to make the network self-sustained in terms
    of its energy requirement. Energy harvesting (EH) is one of the most widely explored
    techniques in this context and is being used since several decades under the umbrella
    of renewable energy to develop nonconventional sources of energy such as wind,
    water, solar, etc. With the development of battery-operated devices and their
    use in various applications of communication networks, a strong need was felt
    to provide'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# 296 Deep Learning and IoT in Healthcare Systems


    source of energy, which can be used to recharge the battery so that the time to
    replacement of battery be prolonged, thus increasing the uninterrupted lifetime
    of the network. Generation of electric energy from solar energy is one technique
    that has widest utilization in terms of electric energy generated, that is, from
    a few milliwatts to several thousand watts. The recent development in the field
    of EH is to extract energy from ambient sources, which are occurring not only
    naturally but as well. Generalizing such techniques, EH can be defined as “a process
    or method to obtain energy from the natural sources of energy such as wind, water,
    solar, et., or man-made sources such as radio frequency (RF) signals, vibrations,
    pressure, etc., for the purpose of providing operational power to the devices,
    either directly or by charging of a battery.” These networks having devices powered
    through EH techniques are also called green networks, since they do not depend
    on the conventional or renewable sources of energy. The IoT applications are a
    strong supporter of EH-based devices, and critical applications such as healthcare
    services strongly demand for implementation of EH with the objective of making
    the supporting network not only more energy efficient but more reliable in terms
    of seamless connectivity with longer lifetime.


    # 10.7.1 ENERGY HARVESTING IN BANS


    The sensor nodes in BANs continuously acquire and transmit data to provide monitoring
    of clinical state of the patient. To increase the network lifetime, the following
    three methods of EH are being used to provide energy to the sensor nodes, thus
    reducing the need to change the battery.


    +   * Energy from human body: Human body, with its actions and movements, as a
    source of energy in different forms, which can be converted to electric energy
    and thus provide power to the biosensors.

    * Energy from surrounding environment (natural sources): Several renewable energy
    sources such as solar energy, wind, heat, light, etc., are present in the environment,
    which can be harnessed and converted by the sensors as power source.

    * Energy from surrounding environment (man-made sources): Electromagnetic waves
    (RF signals) are present almost everywhere in our surrounding environment due
    to several man-made wireless communication systems. This energy can be harvested
    by the sensors as a source of power.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# Energy-Efficient Network Design for Healthcare Services


    For sensors used in healthcare applications, the natural sources of energy present
    in environment may not always be present since the person wearing the sensors
    could be indoor where sufficient wind or solar energy is not available to generate
    enough electrical energy. Harvesting energy from the human body is also not reliable
    since the movement of the patient is generally restricted and cannot act as source
    of energy. Any extra device or component to store and amplify these weak or sparsely
    available energy sources will add to the discomfort in wearing the device, thus
    it less user friendly. Most of the sensors rely on wireless communication for
    connectivity, RF energy is expected to be present and can be used as a source
    of energy for the sensors. The channel connecting the sensor and its network access
    device, that is, data aggregator or sink node, carries both the RF energy and
    data between the two. This RF channel is one prime source of energy since there
    is continuous supply of energy from the network access device. Moreover, the device
    is designed and configured to operate in the same frequency band as that of RF
    channel, thus simplifying the design of the EH module for the sensor. Resource
    allocation schemes have been proposed in literature to utilize the same channel
    for adding additional energy signal to the sensor, which can be used as power
    source. In addition to this source, any other RF energy available in close proximity
    to the device can be used for EH.


