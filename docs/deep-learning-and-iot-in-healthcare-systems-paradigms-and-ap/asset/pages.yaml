  md: '# 8.10.12 DIAGNOSIS


    Smart diagnosis can reduce the exposure of the patient to a radiation hazard area,
    analyze more accurately the affected area, and suggest treatment to the doctors.
    It can help to produces 3D modeling system.


    # 8.11 FRAMEWORK OF SMART HEALTHCARE SYSTEM


    A smart hospital uses biosensors, wireless technology for connecting and tracking
    several monitors and machine in one cloud-based database topology like Bluetooth,
    RFID, and others to maintain a patient information system. This information system
    is containing all the departments like patient personal data, medical history,
    registration and admission, any past prescription, billing department, pharmacy
    indents, doctor''s portal, medical records, surgery, and others.


    Basically the patient identification and patient data through biosensors or smart
    tags are connected to the cloud-based database of the hospital or chain of hospitals.
    The management information system of the hospital are connected to this cloud-based
    database, and the doctors or nurses have access to the portal to remotely visit
    the patient''s livestream information using IoT technology. Even they can control
    the machinery remotely using the IoT-based services that can be support a PC or
    smart phone-based applications.


