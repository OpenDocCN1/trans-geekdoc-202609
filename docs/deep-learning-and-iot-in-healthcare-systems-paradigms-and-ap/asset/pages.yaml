    # 8.1 INTRODUCTION OF THE INTERNET OF THINGS


    An IoT, which is also known as the Internet of Everything technology, is forecasted
    that it will reach 25 to 27 billion units by 2020–2021 (Gartner, 2014). From production
    line and warehousing to retail delivery and store shelving, the IoT is transforming
    business processes by providing more accurate and real-time visibility into the
    flow of materials and products. Firms will invest in the IoT to redesign costly
    workflows, improve tracking of materials, and optimize distribution costs. For
    example, both John Deere and UPS are already using IoT-enabled fetch technologies
    to cut costs and improve supply efficiency. In hospitals, doctors use iOS watched
    to EMR and already track patient visits with the help of technology. Aware point
    introduces sensor-based tracking system for equipment and patients using IoT-based
    technology in real time. Many techno-companies introduce live environmental stressor
    receptors to monitor the mental health of the patient or consumers.


    # 8.2 INTERNET OF THINGS TECHNOLOGIES FOR EVERYDAY USES


    There are few essential IoT technologies widely used for the deployment of successful
    IoT-based products and services: Wireless sensor networks (WSN), radio-frequency
    identification (RFID) and cloud computing.


    # 8.2.1 WIRELESS SENSOR NETWORKS


    The WSN has spatially distributed sensors can cooperate with RFID systems to monitor
    any systems and also provide better status report about their temperature and
    locations (Atzori et al., 2010; Gubbi et al., 2013). Earlier WSN were used in
    cold chain logistics for thermal and chilled packaging to transport temperature-sensitive
    products (White and Cheong, 2012). In healthcare, this system is in use with multiple
    tracker and tracers of patient identification, remote monitoring of medications,
    saline and fluid administration, remote monitoring of patient''s health statistics,
    and others. WSN are also used for maintenance and tracking systems.


    # 8.2.2 RADIO-FREQUENCY IDENTIFICATION


    RFID uses electromagnetic fields to automatic identification and can easily track
    the tags attached to any object. Passive RFID tags rely on radio-frequency'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Healthcare Applications of the Internet of Things (IoT)


    energy transferred from the reader to the tag to control the tag without any electric
    supply. Electronic tolls, any product level tracking, are few examples of passive
    RFID. Active RFID tags have self-electric supply and can initiate communication
    with a reader. External sensors are equipped with active RFID to monitor pressure,
    temperature, and so on. Semi-passive RFID tags use batteries to power the integrated
    circuits for communication. In healthcare, the tag is usually used for identification
    purpose of the patient. For an error-free therapeutic environment, RFID technology
    can be used. Moreover, it will look after the security of the patients to track
    the movements, will track the traffic system if a patient need to transfer from
    one department to another for diagnosis or other procedures (Amendola et al.,
    2014), will track sterile container from sterile supply department, track biomedical
    waste for identification, segregation, transportation, treatment, and others.


    # 8.2 CLOUD COMPUTING


    The major requirements of many IoT applications are substantial data storage,
    ultrafast processing speed to enable real-time decision making, and high-speed
    broadband networks to rivulet data, audio, or video (Gubbi et al., 2013). Cloud
    computing provides easy access to handle huge data sets and process them for the
    exceptional number of IoT devices in real time.


    In healthcare, this cloud computing system will help to trace the remote sensors
    data, build database for preventive, primitive, therapeutic services to patients,
    in medical record management, telemedicine (Kim et al., 2010), worldwide database
    for availability of blood in blood bank with group and Rh factors, develop data
    from traffic control system to make green corridor for organ donations, and so
    on.


    # 8.3 VARIOUS INTERNET OF THINGS REAL-TIME APPLICATIONS


    Real-time IoT applications on devices and systems need to ensure the reception
    of data or messages and timely response. The inbuilt intelligence of IoT applications
    on devices can identify the problems with ease, observe the test-environment,
    communicate with each other, and potentially resolve problems without the need
    for human intervention. The IoT facilitates the development of myriad industry
    based and user-specific IoT applications. Whereas devices and networks provide
    physical connectivity, IoT'
  merge: -1
