    # 10.5.4 ENERGY EFFICIENCY AT TRANSPORT AND APPLICATION LAYER


    Similar to the network layer, the protocols and data flow management schemes applied
    at transport layer also affect the energy efficiency of the network in addition
    to overall network performance. The major function of transport layer protocols
    is to ensure reliable data transmission with minimum packet loss and minimum retransmission
    due to link failure or network congestion parameters. Versions of transmission
    control protocol have been developed to provide reliable and energy-efficient
    end-to-end data transmission.'
