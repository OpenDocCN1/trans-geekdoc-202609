    cheap. It involves an acoustic or ambient sensor along with a computer. The collected
    data found from the sensors are then passed for analysis to a PC (Lee et al.,
    2014). The investigation is done depending on some predefined conditions and cut-off
    thresholds for fall detection (Figure 6.5).'
