  md: '# Deep Learning and IoT in Healthcare Systems


    ![](img/8e78e716c4c366f9e41f495059d443ec_140_0.png)


    **FIGURE 4.19** Choosing the right assistive technology.


    +   1. **State the main goal:** What is the purpose of using the assistive device?
    What do you want to do with the AT device? Will technology help the user to do
    he/she cannot do right now or limited in doing?

    2. **Access the situation:** In this step, input is taken from the user, user’s
    family members, and medical professionals. Sometimes, this list extends to co-workers,
    caretakers, and related neighbors, that, anyone who has experience with user or
    knowledge of AT or offers expertise. This depends on the limitations and requirement
    of the user. Also, the time up to which the particular device is useful to the
    user as well as AT is determined.

    3. **Choosing a device/system:** Is the device simple to use? Does it accomplish
    the required task? Is this the most efficient way? Can it adapt to changing situations?
    Is it a cost-effective method? Augmented reality are also a good chance to check
    options.

    4. **Expert recommendation:** Before buying any of the AT devices, find the right
    term “experts” to help the right device for the user. These “experts” may doctors,
    physicians, therapists, and educators. Suggestions from people who have had similar
    experience can also help a lot. There are also many AT experts all around the
    country, in each state.

    5. **Selecting a vendor/dealer:** An important thought in buying equipment is
    the dealer’s responsiveness. The dealer should be able to provide technical support
    and service. Dealer’s should also be technically sound with proper training.'
