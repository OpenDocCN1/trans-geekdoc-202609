    # 11.4 DATA


    To be clinically and commercially relevant, the algorithmic complexity of feature
    extraction methods must be such that they can be easily and quickly computed,
    with minimal processing and power consumption demands (Phinyomark and Scheme,
    2018).


    # 11.4.1 DATA ACQUIRING


    The training dataset is from Andrzejak et al. (2001). The dataset has five sections:
    dataset A discussed as Z, dataset B discussed as O, dataset C discussed as N,
    dataset D discussed as F, and dataset E discussed as S, containing set of EEG
    fragments with a recording of the electromagnetic movement of a healthy person
    for 23.6 s. Datasets A and B are having data related to EEG chronicles from healthy
    volunteers with categorization as eyes open and eyes closed, individually.'
