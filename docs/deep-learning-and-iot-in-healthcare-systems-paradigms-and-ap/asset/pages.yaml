    same pathway may lead to prediction of an imbalance problem, which may be caused
    by fluctuation in blood pressure abruptly or neurological disorders. Fall from
    sleeping posture of elderly people mostly happens at night time when seamless
    monitoring by human intervention may not be possible, but technology-enabled,
    sensor-based smart monitoring would continue to alert the human monitor toward
    avoidance of any fatal impact.


    # 6.9 CONCLUSION


    This chapter includes smartphone-based fall detection systems enabled by advanced
    technologies such as IoT, ML, etc to extend timely monitoring, primarily by a
    machine and exert support by humans alerted by user mobility. Societal drive,
    technological advancements, change in demographic of population in today''s world,
    urge for improved quality of living, etc are the driving factors behind this emerging
    work. Functional frameworks of such smart FDSSs, different techniques for efficient
    fall detection, proposed three-phase FDS for accurate detection illustrated by
    a detailed flowchart and algorithm along with some representative results showing
    accuracy as well as false alarms generated by wrong detection of fall, etc. are
    given. This implementation-based approach followed by future research directions
    would invite interests of researchers in this domain of research.'
