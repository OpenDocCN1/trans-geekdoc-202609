    down easily in a very short time, then it is not a viable option. AT devices should
    also be easily repaired or replaced. Choosing an assistive solution is a very
    important part as of the Equalization of Opportunities for Persons with Disabilities
    for disabled people.


    There are certain plans for students with disabilities to help them access the
    facilities and not worrying of their maintenance. When an AT device is a part
    of student''s individualized education plan (IEP), the school has the responsibility
    of making certain that the individual is getting access to the AT device for the
    purposes of implementation. In most cases, schools are responsible for the maintenance,
    repair, and replacement of the device. Under the Individuals with Disabilities
    Education Act (IDEA Act), a school district is responsible for providing AT devices
    that are part of special education, including all the related services like supplementary
    aids and repair services. The device is to be provided at no cost to parents.


    Repair means improving the poor condition or no working condition of the AT devices
    by means of some modifications, while maintenance refers to modifications or replacement
    of parts to prevent possible failures while the device is in the working condition.
    Cost and ease of the repair depend on the design of devices, knowledge of the
    repairer, and availability of infrastructure near users. Cost often deters many
    disabled people from getting their devices repaired or maintained. Poor people
    find it extremely hard to buy new parts or new devices. The is the same for rural
    areas. If the repairing shop is far away home or in another city, then costs of
    transportation and lodging become a barrier.


