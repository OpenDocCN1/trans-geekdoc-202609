  md: '# 6.1.2 NONCONVENTIONAL I/O DEVICES


    The IoT-based devices are usually spread across a wide geographical region and
    follow a heterogeneous architecture. This demands a system that can handle nonconventional
    input devices such as sensors and both online and offline data. These kinds of
    I/O devices are often referred to as “distributed I/O.” The main properties that
    are observed in a distributed I/O system are devices having a small area and a
    greater variety of I/O options like digital and analogue stations, temperature
    calculations, and counter inputs. These linked devices provide a flexibility that
    old-style devices are unable to achieve. A significant advantage of this distributed
    method is a short cable for signal measuring as the devices are positioned near
    to the sensors. Direct link between the sensors do not need signal training during
    the usual signal inputs for those rare and specific sensors.

    Using dependable and traditional communication buses like Ethernet and RS485 with
    Modbus/TCP, Modbus/RTU, Profibus, and even ASIC, modules can be combined into
    current systems that require a lesser cost and an elastic architecture.


    # 6.1.3 ROLE OF IoT IN HEALTHCARE


    There has been a rapid change in medical science and healthcare after the introduction
    of sensor-based automatic monitoring systems using wireless body area network
    (WBAN).


    A body network (BAN) is also known as WBAN or body sensor network (Arya and Bilandi,
    2014). It is a wireless connection between various wearable sensors in body. These
    sensors may be implemented inside human body or outside such as human can bring
    in various positions, in pockets, in hand or in bags. The development of WBAN
    started around in 1995 around the idea of using wireless personal area network
    (WPAN) to make a communication between different parts or around the human body
    (Felipe et al., 2015). After nearly 6 years, the term "BAN” used to denote systems
    in which communication is totally within, on, and in the instantaneous immediacy
    of a human body.


    The swift progress of biological sensors, less power consumed circuits, and wireless
    communication has empowered a new group of wireless sensor networks, which is
    now being applied in determining vehicles, harvests, organization, and well-being.
    The sensors that are integrated in the human body face physical changes and display
    the patient''s health condition irrespective of their position. The data will
    be communicated wirelessly'
  merge: -1
  img_proc: true
