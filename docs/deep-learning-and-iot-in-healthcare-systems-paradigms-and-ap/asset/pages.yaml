  md: '# About the Editors


    **Krishna Kant Singh, PhD,** is a Professor in Computer Science and Engineering,
    Faculty of Engineering & Technology, Jain (Deemed-to-be-University), Bengaluru,
    India. He has wide teaching and research experience. He has authored more than
    50 research papers in Scopus- and SCIE-indexed journals of repute. He has also
    authored 25 technical books. He is also an associate editor of Journal Intelligent
    & Fuzzy Systems, IEEE ACCESS (SCIE), and a guest editor of Open Computer Science.
    He is also member of editorial board of Applied Computing & Geoscience (Elsevier).
    Dr. Singh has acquired BTech, MTech, and PhD (IIT Roorkee) degrees in the area
    of image processing and remote sensing.


    **Akansha Singh, PhD,** is an Associate Professor in the Department of Computer
    Science and Engineering, ASET, Amity University, Noida, India. She has to credit
    her more than 40 research papers, 20 books, and numerous conference papers. She
    has been the editor for books on emerging topics with publishers like Elsevier,
    Taylor and Francis, Wiley, Dr. Singh has served as a reviewer and technical committee
    member for multiple conferences and journals of high repute. She is also the Associate
    Editor for IEEE Access journal, which is an SCI journal with impact factor of
    4.018. Dr. Singh has also undertaken a government-funded project as a principal
    investigator. Her research areas include image processing, remote sensing, IoT,
    and machine learning. She holds BTech, MTech, and PhD degrees in Computer Science,
    with her PhD from IIT Roorkee in the area of image processing and machine learning.


    **Jenn-Wei Lin, PhD,** is currently a full professor in the Department of Computer
    Science and Information Engineering, Fu Jen Catholic University, Taiwan. Prior
    to that, he was a Researcher with Chunghwa Telecom Co., Ltd., Taoyuan, Taiwan,
    from 1993 to 2001. His current research interests include cloud computing, mobile
    computing and networks, distributed systems, and fault-tolerant computing. Dr.
    Lin received his MS degree in computer and information science from National Chiao
    Tung University, Hsinchu, Taiwan, and his PhD degree in electrical engineering
    from National Taiwan University, Taipei, Taiwan.'
