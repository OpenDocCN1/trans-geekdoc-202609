  md: '# Deep Learning and IoT in Healthcare Systems


    need for supervision and accelerates the process of extracting the action-able
    insights from the data sets. For example, in healthcare, deep learning applies
    the multilayered approach to the classification of data, such as finding noise
    in clinical data, abnormalities of medical images, formation of clusters based
    on patient similar characteristics respective to diseases. Due to its architecture,
    deep learning requires significantly less interaction with programmers to check
    the accuracy of its result, whereas ML needs more interaction with a human to
    check whether the outcome is correct or not.


    # 3.2.2. WORKING OF DEEP LEARNING


    As traditional artificial neural network (ANN) is the basis of deep learning based
    on human biological neural networks contains multiple layers and each layer perform
    required calculations and sends the results to the successive layer (Miotto et
    al., 2017). The number of hidden layers, connection technique and learning capability
    to extract meaningful information from the given input is the major difference
    between deep learning and ANN (LeCun et al., 2015).


    Deep learning is also known as deep-structured learning or hierarchical learning.
    Here, deep represents the number of hidden layers in the neural networks. Only
    two to three hidden layers are available in traditional ANN unlike DNNs have several
    hidden layers (Rumelhart et al., 1988; Bengio, 2009). So, in deep learning, filtering
    of data is performed in multiple layers in a cascading mode.


    Deep learning uses layered algorithmic architecture for the analysis of data and
    its accuracy depends on the processing of more and more data. Each successive
    layer learns from the previous layer and does fine tune to refine the result.
    Deep learning trains machine automatically as the human brain does naturally.
    It is basically based on the phenomena of connecting biological neurons in the
    human brain for processing the information. In deep learning no human interaction
    is required in the learning process like traditional ML algorithms. Thus, mitigates
    the overhead and chances of human error. Deep learning applies representation
    learning methodologies. Here, representation basically holds a set of features
    which explain the concept individually (LeCun et al., 2015). Another significant
    feature of deep learning is that during the training session, it can use unlabeled
    data for feature extraction without the need of human interaction that is is much
    significant in the'
  merge: -1
  img_proc: true
