    # 6.2 INTRODUCTION TO MODERN SMARTPHONE


    A smartphone, by definition, would have a sophisticated multitasking operating
    system, for example, iOS, Android, etc. high-profile web accessibility, a full-featured
    desktop web browser (e.g., Safari etc), a full-featured music player and video
    player, display photos, 3G/4G and wireless LAN (Wi-Fi) connections, TV out, etc.
    A smartphone should be able to download and install applications and may have
    a virtual or physical QWERTY standard keyboard.


    # 6.2.1 SMARTPHONE AS A SENSOR HUB


    # 6.2.1.1 EMBEDDED/INTERNAL MOBILE PHONE SENSORS


    Today''s smartphones are open, programmable, and come with several embedded sensors.
    The number and types of sensors in mobile phones vary depending on the underlying
    mobile phone platforms and usability. Some of the state-of-the-art embedded mobile
    phone sensors are listed as follows.


    Accelerometer may be defined as the rate of change of velocity over time. An accelerometer
    is usually an electromechanical instrument that is used to quantify acceleration
    values. Such accelerations can be static (acceleration due to gravity) or dmic
    for sensing the movement or vibrations of a mobile device.


    The environment of an element can be understood in a better manner using the accelerometer.
    Different types of movements may be determined by this tiny device as the subject
    is moving uphill, the maximum tilt it can survive before falling down, or if it
    is flying horizontally or angling downward. The smartphones rotate their device
    automatically (portrait/landscape) based on the tilt of the phone.


    Traditional accelerometers contain multiple axes: the two-dimensional movements
    and the third is used to determine the position. The smartphones use these three
    axes, while it is sufficient for a car to use two axes to determine the impact
    moments. These devices are highly sensitive as they are supposed to read even
    a tiny change in acceleration. The degree of accuracy is highly dependent on the
    sensitivity.'
