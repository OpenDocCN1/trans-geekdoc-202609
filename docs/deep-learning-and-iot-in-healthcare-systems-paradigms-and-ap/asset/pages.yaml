    is not the same for outdoor fall. Often unkwn people are hesitant as well reluctant
    in the case a stranger been fallen down (Igual et al., 2013). So, an alarming
    system for the external fall and an urgent notification to the relatives and caregivers
    must reach in time to save the life.


    The fragility index (Lee et al., 2014) is often used to classify the physical
    condition of the seniors. The phenotype of frailty classifies elder adults as
    frail when they persist three or more among five criteria: slow walking speed,
    weak grip strength, exhaustion, low physical activity level, and unintentional
    weight loss. The quality of life is one of the governing factors for increasing
    the risk of frailty.


    # 6.3.1 AVAILABLE MONITORING AND ASSISTING DEVICES


    The advancement in the field of IoT, robotics, and AI has opened a lot of opportunities
    in developing intelligent and automated devices using cameras, sensors, and other
    nonconvex I/O devices. A lot of work has already been done on the various types
    of automated fall detection and activities of daily living (ADL) monitoring devices
    and techniques (Hijaz et al., 2010). These fall detection systems (FDS) are divided
    into two categories—context aware (visual monitoring), and content free (sensor-based
    monitoring), as shown in Figure 6.3.


    Many experimental and commercial devices are available nowadays to track ADL and
    fall depending on the situation. The wearable sensors, especially smart and smartphones
    (e.g., Apple Smart Watch, MI Band, etc.), are now commercially available for use
    and can be monitored locally and remotely (Figure 6.4). The inexpensive ones use
    the threshold-based algorithms, while the expensive ones use ML-based algorithms
    for greater accuracy. They may or may not use data streaming.


    # 6.3.2 NEED OF REAL-TIME DETECTION BASED ON LIVE DATA


    A fall is a challenge to balance or strength that results in the inability to
    stay upright. This may happen due to stumble or illness for young adults and a
    disease and decay of physical ability for aged persons (El-Bendary et al., 2013).
    Neurological disorder, Parkinson’s disease, etc. may cause fall irrespective of
    any age.'
