    # 6.3 FALL OF SENIORS AND THEIR POSSIBLE IMPACTS


    The fall of the elderly adults is a serious problem for the family and the people
    who live with the elderly persons (Mubashir al., 2013). Falls are primary problems
    in the seniors as these may cause substantial injury and even death. This is because
    of the difficulties arising from falls that result in a substantial reduction
    in functional status, grave injuries, and an increase in the utilization of medical
    services. The fall may occur at the indoor (bathroom, bedroom, living room, kitchen,
    etc.), on a staircase or at outdoor. While it is easier for a caregiver to identify
    the fall at indoor, the situation'
