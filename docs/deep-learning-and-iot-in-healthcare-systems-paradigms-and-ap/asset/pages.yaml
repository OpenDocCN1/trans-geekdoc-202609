  md: '# Smart Fall Detection Systems for Elderly Care


    Air humidity sensor: Samsung released its Galaxy S4 model in 2013 that was the
    first smartphone to accommodate an air humidity sensor. The optimum temperature
    and humidity can be determined based on the measurement of humidity in the air
    by this sensor. However, these sensors are available in the premium segment smartphones.


    Heart rate sensor: The heart uses an LED and optical sensors to measure the heartbeat.
    The LED produces light in the direction of the skin, and this sensor measures
    the reflected light wave.


    The pulse causes a difference in the light intensity. The heartbeat is determined
    by counting the tiny pulsations of the blood vessels. It is used by many health
    and fitness applications.


    Barcode/QR code sensors: Barcode sensors use the reflected light from the code
    to determine the readings. It creates an analog signal with changing voltage that
    characterizes the barcode. This analog signal is then transformed into a digital
    form and decrypted to divulge the data in. Barcode sensors are used for scanning
    the barcode materials or QR codes.


    Pedometer: A fitness tracker applications use this sensor to count the steps that
    a subject takes. Pedometers internally use the data generated by the accelerometer
    that can be used to observe the movements as walking or running.


    Touchsensors: The touchscreen has an electrical continuously flowing through it,
    and a touch on the display causes a change in the signals. The device detects
    this change as input. Earlier smartphone models tend to use resistive touchscreens
    until Apple first introduced a capacitive touchscreen. However, now all the smartphones
    use capacitive touches only.


    Proximity sensor: A proximity sensor measures the closeness of an object by an
    infrared (IR) LED and IR light detector. This sensor automatically turns off the
    touchscreen functionality during a call reception by detecting the proximity of
    the face to avoid unintentional input via skin. The IR sensor releases a beam
    of light, invisible to human that is reflected back.


    Ambient light sensor: This sensor detects the environmental lights and adjusts
    the screen brightness accordingly. It is termed as Auto Brightness Leveler that
    can increase or decrease the brightness of the screen to keep the away from soaring.


    Biometrics: Biometric sensors can identify the various classification characteristics
    of the human individuals and can be used to provide an additional layer of security
    for the devices. This may include fingerprint recognition, iris recognition, and
    complete facial recognition.


    Biometric sensors are heavily used to unlock the phones and authenticate payment
    during purchases.'
