    a MAC protocol (TCH-MAC) based on integration of TDMA and CDMA has been proposed
    recently. This protocol has a TDMA-based scheme, which is traffic adaptive to
    handle devices due to heavy burst of traffic and an efficient CDMA-based scheme
    along with adjustable power control for the transmitter. This hybrid scheme has
    been shown to improve energy efficiency of the network while maintaining throughput
    and losses due to collision to desired levels. For detailed study of this MAC
    protocol.


    In addition to these hybrid schemes, several power control schemes have been used,
    individually or in integration with other schemes, to control the transmit power
    depending on the requirement for coverage area and signal strength. Such schemes
    are more suitable for contention-based topologies and implemented using protocols
    such as power-controlled multiple access, common power protocol, power controlled
    dual channel, et. In addition to power control for the transmitter, the operation
    of receiver of a low-power device also needs to be optimized. As discussed earlier
    in Section 10.3, idle listening is also major reason affecting energy efficiency
    of a low-power network. It is therefore, recommended that the device should be
    kept in sleep mode when it is not actually receiving any data but waiting for
    an event to occur or valid data to be received. Several power-off schemes have
    been proposed to implement this power-saving feature and thus improve the energy
    efficiency of the network. The examples of commonly used efficient power-off schemes
    are MACA protocol, power management using multisleep states, power-aware multiaccess
    with signaling, pico node multichannel MAC, et. In addition to these specially
    designed power-control and power-off protocols, fine tuning of transmit and receive
    power of antenna and using smart directional antenna have also been explored.'
