- pgno: 105
  md: '# Case Studies: Healthcare and Deep Learning


    In a research, for each class of diabetes, some practices are common to adopt
    as a routine in daily life by every patient as timely diagnosis, patient education,
    medical care on a regular basis, and follow some risk mitigation activities, for
    example, diabetic foot, retinopathy, nephropathy, and so on.


    Earlier, many AI algorithms have been used for the prediction of diabetes, for
    example, SVM, decision tree logistic regression, and so on (Kavakiotis et al.,
    2007). By using principal component analysis and neuro-fuzzy diabetes patients
    have been distinguished from normal people (Polat and Günş, 2007). T2D has been
    predicted by quantum particle swarm optimization algorithm and weighted least
    squares vector machine (Yue et al. 2008). Linear discriminant analysis-wavelet
    support vector machine (LDA-MWSVM) has been proposed to predict the diabetes (Duyu
    et al., 2011). In this approach, linear discriminant Analysis has been used to
    reduce the dimension and for feature extraction. In order to predict T2D from
    high-dimensional datasets, a prediction model using logistic regression has been
    proposed for distinct onset (Razavian et al., 2015). SVM has been used to predict
    diabetes as a multivariate regression problem, specially focused on the glucose
    level (George et al., 2013). In other studies it is found that most of the researchers
    have improved the accuracy in prediction through methods methodsKavakiotis et
    al., 2017).


