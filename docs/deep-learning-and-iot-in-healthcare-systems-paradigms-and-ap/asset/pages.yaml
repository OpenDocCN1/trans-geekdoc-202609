    # 10.5.2 ENERGY EFFICIENCY AT DATA LINK LINKER


    In a wireless network, various protocols at the data link layer (DLL) provide
    the functionality of data framing, MAC, and implementation of error control techniques.
    In context to energy efficiency, MAC sublayer of DLL is responsible for implementation
    of scheduling and power control techniques. In healthcare applications of the
    IoT, various biosensors are configured to form a BAN, and scheduling techniques
    are applied to optimize the flow of data from sensors to aggregator or sink nodes.
    Each node transmits data in its allotted slot. Channel allocation techniques are
    applied for efficient sharing of the radio spectrum, which not only improves bandwidth
    utilization but also reduces the congestion or collision in the channels. Such
    scheduling techniques improve the energy efficiency of the network by reducing
    retransmission of data, overhearing, and idle listening, thus increasing the lifetime
    of battery-operated devices. In addition to traditional scheduling techniques,
    that is, frequency-division multiple access, time-division multiple access (TDMA),
    and code-division multiple access (CDMA), recent studies have proposed more efficient
    scheduling techniques such as self-scheduled and distributed MAC, self-distributive
    MAC, distributed hybrid slot scheduling, QoS-aware scheduling, else. Another MAC
    layer technique to improve energy efficiency of the networks is power control
    and power-off'
