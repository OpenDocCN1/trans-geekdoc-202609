    # 6.5.2 MACHINE-LEARNING-BASED METHODS


    The ML-based methods depend on a trained machine for the analysis of data. The
    machine is first trained against the known data set such that it can analyze the
    outcome (classification) for similar unknown data. The fact here is detected usually
    by posture analysis where the laying posture of the subject for a certain amount
    of time, from any nonlaying posture is denoted as fall. The popular classifiers
    for this purpose are decision tree (Sarkar et al., 2019) KNN, random forest, and
    SVM. Some whereas used nonconventional models such as hidden Markov model (Thome
    et al., 2008), logistic regression, with good accuracy.


    The ML-based systems can precisely identify prefall, fall, and postfall postures.
    Different fine grain falls like left/right/face/fall-down, and postures like sit/walk/climbing
    up staircase/climbing down staircase, etc. can also be identified with good accuracy.


    However, it is difficult for a ML-based model to work on live data as they are
    based on the live data and analyzing it within a very short interval of time (say
    10 s), periodically. This will help to refresh the result and also can store the
    previous results. By carefully choosing the refreshing frequency, the nominal
    delay will hardly have any effect on generating fall warning. However, the classification
    time greatly depends on the hardware of the analyzing system, and hence, a good
    modern server is preferred in such cases.


