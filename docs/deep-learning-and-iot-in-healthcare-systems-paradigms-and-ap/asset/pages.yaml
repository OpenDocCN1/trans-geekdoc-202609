  md: '# Deep Learning and IoT in Healthcare Systems


    Gyroscope: The angular rate sensors or angular velocity sensors popularly known
    as gyroscope sensors are the devices that can measure angular velocity. The angular
    velocity may be defined as the change in rotational angle/time. The unit of angular
    velocity is degrees/second or rotation/second (RPS). Gy devices can measure or
    uphold rotational motion. An example of a small and cheap gyroscope is a microelectromechanical
    system (MEMS) that can determine angular velocity. The rotational speed is determined
    by the angular velocity.


    Magnetometer: A magnetometer measures the magnetic fields and so can point toward
    north by changing the voltage output to the phone.


    It determines the way by which an Apple Maps or Google Maps is to be shown when
    a compass application is triggered. It also supports the standalone compass applications.


    Magnetometers can detect magnetic metals, so are also used in metal detectors,
    and this is how metal detector applications are supported in smartphones.


    Nevertheless, this sensor works in conjugation with the accelerometer and GPS
    unit of the smartphone to determine the exact location of the subject and also
    the way the device is pointing in the navigation routes.


    GPS: GPS technology communicates with the satellite to determine the location
    of the subject by latitude and longitude. It does not require any data connection
    and can perform perfectly without mobile signal (however, the map will look blurry
    as they cannot be downloaded fully).


    The GPS contacts with multiple satellites to determine the location depending
    on the angles of intersection. However, it may find difficulties in locking if
    the device is used at indoor or the sky is cloudy due to the inability to contact
    with the satellites.


    The GPS is an extremely power-hungry device and can drain the battery very fast.
    The battery saving guides of every phone suggest turning GPS off while not in
    use. Tiny gadgets like smartwatches avoiding GPS module in their systems.


    The cell phone towers are an alternative way to find the location of the device.
    Modern GPS units essentially approximate GPS signals with other data, such as
    signal of the cell, to determine further accurate location data.


    Barometer: A barometer is used to determine air pressure. This data can be used
    in identifying changes in weather and measuring the altitude.


    Camera: Every smartphone nowadays is equipped with a camera that can be used to
    capture still images/videos, which can be used later for various purposes. Advanced
    smartphone technology nowadays uses more than one sensor for better result in
    image capturing.'
