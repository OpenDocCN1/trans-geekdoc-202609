- pgno: 15
  md: '# Preface


    This edited book, *Deep Learning and IoT in Healthcare Systems: Paradigms and
    Applications*, is intended to discuss the applications and challenges of deep
    learning and Internet of Things for healthcare applications. The major objective
    of this book is to provide a platform for presenting IoT-enabled healthcare techniques.


    The text offers mathematical and conceptual background presenting the latest technology.
    It describes deep learning techniques along with IoT used by practitioners and
    researchers worldwide. The book includes deep feedforward networks, regularization,
    optimization algorithms, convolutional networks, sequence modeling, and practical
    methodology, and it also presents the concepts of IoT is the set of technologies
    that make traditional devices into smart devices. IoT finds its application in
    almost all areas and connects to a network for sharing and analysis of data. Finally,
    the book offers research perspectives, covering the convergence of deep learning
    and IoT. It also presents the application of these technologies in the development
    of healthcare frameworks.


    This book is an attempt by the authors to present the most relevant topics in
    IoT, deep learning, and their applications in healthcare applications. Today,
    IoT is one of the fastest growing fields, and is being widely used in a variety
    of industries. One of the major applications of IoT is in remote healthcare monitoring
    systems. IoT-based systems are developed by a combination of various techniques
    such as wireless communication, sensor technology, and most importantly, data
    processing. Deep learning is being recognized as one of the most efficient techniques
    in data processing. The convergence of IoT and deep learning enables things to
    communicate, share information, and coordinate coordinates.


    Recently, IoT-based applications in the medical field have drawn substantial attention
    of researchers and technologists. In this book, an overview of present technologies
    that support IoT-based applications is presented. Secondly, the techniques of
    deep learning are presented in a lucid and impressive manner. The book also discusses
    the latest design and development of IoT-based healthcare systems. Finally, the
    book suggests scenarios where IoT and deep learning can be applied.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'This book is an amalgamation of theory, mathematics, and examples of the discussed
