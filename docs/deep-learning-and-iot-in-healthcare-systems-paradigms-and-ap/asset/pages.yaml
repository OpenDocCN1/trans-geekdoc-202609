- pgno: 339
  md: '# Applying Data Mining to Detect the Mental State


    The second dataset characterized by Dharmawan (2007) included healthy people who
    volunteered and analyzed under EEG to collect the data as playing particular PC
    computer games with a class as excited, not excited and relaxed on the basis of
    the various different values of the alpha, beta, theta, and gamma.


    # 11.4.2 DATA EXTRACTION


    Ambiguous data are removed and polished/refined to get more refined information
    for unique groups differently. The element utilized here is categorized underneath
    the graph. The trapezoidal rule can be used to find the area under the graph,
    which is formed in the dataset from the first source, which is in raw graphical
    form. On numerical examination, the trapezoidal governs (likewise alluded to the
    trapezoid control or trapezium run) a strategy for approximating the particular
    imperatively


    ```

    $\int_{a}^{b} f(x)dx$ (11.1)

    ```


    ```

    $\int_{a}^{b} f(x)dx=(b-a)((f(a)+f(b))/2). (11.2)

    ```


    Equation (11.1) shows the differentiation with the upper bound as (b) and lowers
    bound as (a). The working of the trapezoidal rule can be understood by approximating
    the region underneath the diagram of the element $f(x)$ as a trapezoid and computing
    its locale.


    With this, we can derive the different values for different waves. It takes after
    the district of the recurrence groups (delta, theta, alpha, and beta) is ascertained
    for every EEG section.


    # 11.5 CONCLUSION


    We are able to predict patient''s muscle movements and categorize them as eyes
    open, eyes closed, and mental state as excited, not excited, and relaxed with
    the help of our prediction system, and we were able to identify the most accurate
    algorithm, which can be used in our research, which is KNN, which has 97.50% accuracy
    rate. In Appendix C, Figure C1 shows (a) pie chart and (b) graph of the classified
    data, and there is weighing in the dataset, while Figure C2 shows the histogram
    of (a) gamma, (b) theta, (c) alpha, and (d) beta with the x-axis as frequency
    and y-axis as different values.'
