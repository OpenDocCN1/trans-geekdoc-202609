    # ABSTRACT


    Technology is the need of every hour, and our motive is to make use of technology
    for the benefit of the autism spectrum disorder (ASD) patients. We verify which
    technique of data mining (K-nearest neighbor, decision tree, neural networks,
    and naive Bayes) would provide us with the most accurate prediction and classification
    of mental state of mind (i.e., excited, not excited, and relaxed) and small muscle
    movements (i.e., open eyes and closed eyes) using electromagnetic brainwave signals
    generated in our brain neurons (i.e., alpha, beta, theta, gamma, and delta) and
    using this application with electroencephalogram to detect different abilities
    the person has situations or environment that make them hyperactive and propose
    the real-time solution for people with ASD.


