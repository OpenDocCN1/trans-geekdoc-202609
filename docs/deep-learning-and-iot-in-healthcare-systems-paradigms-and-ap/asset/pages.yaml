- pgno: 103
  md: '# Case Studies: Healthcare and Deep Learning


    models researchers have used the higher n-gram vocabulary spaces and experimental
    work has been performed on the clinical Pitt dataset of the DementiaBank on Alzheimer’s
    disease and related Dementia (Source: https://dementia.talkbank.org/access/English/Pitt.html).


    For this dataset, mini-mental state and other clinical diagnosis practices have
    been conducted to collect different types of data such as verbal interviews, diagnosed
    MCI data, and different form of AD-type dementia. In the final result, accuracy
    of the clinical diagnosis is 91.4% for AD-type dementia and 98.3% specificity
    and 98.8% sensitivity.


    In a survey of PubMed and Google scholar, deep learning techniques especially
    CNN and RNN have shown their accuracy as 96.0% for AD classification and 84.2%
    for MCI concussion prediction on neuroimaging data (Jo et al., 2019). Improved
    performance in AD classification has been obtained on the combination of multimodal
    neuroimaging and fluid biomarkers. Further has been found that deep learning is
    still evolving in AD research on different categories of data.


    Multimodal RNN, a deep learning approach, has been applied to predict the conversion
    from MCI to AD (Lee et al., 2019). The researchers have combined “cross sectional
    neuroimaging biomarkers,” “longitudinal cerebrospinal,” and “cognitive performance
    biomarkers at baseline” to develop an integrated framework to improve the prediction
    accuracy. The proposed prediction model gives 75% conversion accuracy from MCI
    to AD on single modality of data. After incorporating longitudinal multidomain
    data the prediction model gives 81% accuracy.


    A deep learning-based novel technique is developed for the early diagnosis of
    MSI and AD (Liu et al., 2014). This technique provides better AD diagnosis as
    compared to SVM with minimal previous knowledge and treats it as a multiclass
    classification task. The overall accuracy produced by the deep learning method
    in binary classification of AD is 87.76%. Also, higher sensitivity values, that
    is, 88.57% and 74.29% respectively for classification accuracy has been observed.
    Deep learning method has shown improvement as 47.42% on overall accuracy and 83.75%
    on overall specificity as to SVM.


    # 3.5.3 CASE STUDY: DIABETES


    A common type of chronic disease named diabetes covers a high population in all
    over the world. It shows a big threat for human health due to its growth rate.
    The cause of diabetes is the presence of higher blood'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Deep Learning and IoT in Healthcare Systems


    glucose than the normal level. This happens due to less secretion of insulin in
    the pancreas from beta cells or its adverse biological effects or combination
    of both (Lonappan et al., 2007). Diabetes can be a cause of severe chronic damages
    and abnormality in various tissues such as eyes, heart, kidneys, nerves, and blood
    vessels (Krasheva et al., 2011). Diabetes has three categories, type-1 diabetes
    (T1D), type-2 diabetes (T2D), and gestational diabetes mellitus (GDM).


    Patients of T1D come under the age of 30. The symptoms of this category of diabetes
    are high level of blood glucose, frequent discharge of urine and increased thirst
    (Iancu et al., 2008). Patients of this category need insulin therapy to maintain
    blood glucose rather than only medications. This is required due of impairments
    in insulin production. A patient needs multiple daily injections or continuous
    subcutaneous insulin infusion to maintain the glucose level.


    Middle-aged and elderly patients come under T2D mainly suffered from different
    diseases such as hypertension, obesity, atherosclerosis, and dyslipidemia (Robertson
    et al., 2011). Patients under this category suffer from gradual loss of insulin
    secretion. But, they can opt various remedial options. At the beginning stage
    of T2D, through medication patients improve their insulin secretion, but at later
    stage progresses of insulin are required.


    Type-3 diabetes or GDM occurs due to interaction of insulin and hormones released
    from placenta which is a cause of high blood sugar level (Kavakiotis et al., 2017).
    This occurs during pregnancy and generally disappears after the birth of a baby.
    Most of the cases there have chances of occurring diabetes in the newly conceived
    babies (Han et al., 2014). Beat dietary practices are the best option to reduce
    the level of diabetes (Kim, 2009). Therapeutic options for GDM are as same as
    used in T2D.


    With immense changes in modern lifestyle and standard of living, patient of diabetes
    is exponentially increasing. Therefore, quick and accurate diagnosis of diabetes
    and immediate remedy are the big necessity. Diagnosis of diabetes includes different
    parameters such as glucose tolerance, blood glucose (fasting), and blood glucose
    (random) (Iancu et al., 2008; Cox and Edelman, 2009; American Diabetes Association,
    2010).


    Diabetes can be controlled easily if it detected in the earlier stage. On the
    basis of patients’ medical record, deep learning can be used to predict the diabetes
    in its preliminary judgement and same can be available for clinicians for further
    action (Lee et al., 2016; Alghamdi et al., 2017; Kavakiotis et al., 2017).'
