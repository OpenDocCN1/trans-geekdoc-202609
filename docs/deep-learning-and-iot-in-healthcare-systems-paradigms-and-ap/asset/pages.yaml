  md: '# Smart Fall Detection Systems for Elderly Care


    to an external processing component (Song et al., 2007). The device is able to
    immediately spread all the data in actual time to the clinicians all over the
    world. If any emergency is noticed, the doctors will instantly notify the patient
    by providing suitable messages or alarms.


    Primary BANs are applied in the health-care field, where constant monitoring and
    storing of important parameters of people suffering from long-lasting diseases
    like diabetes, breathing problem, and cardiac attacks are considered. A BAN that
    is placed on a patient is able to notify the clinicians, even before having a
    cardiac attack, by monitoring changes in their important symptoms. A BAN on a
    diabetic patient whenever required vaccinates insulin automatically through a
    pump. Further, this technology is applied in sports, military, or security domain.
    Covering the skill to various fields also supports interaction by continuous exchanges
    of data between humans or between humans and machines.


    # 6.1 WBAN ARCHITECTURE


    The ICT-based health-care monitoring structure may be classified into three layers,
    viz., tier-I, tier-II, and tier-III, as shown in Figure 6.2.


    **Tier-I**: It is the first layer of communication in which data communication
    takes place among the sensors mounted in the human body. sends it to the “Sink,”
    which is a personal server.


    **Tier-II**: This is the next layer of WBAN in which the Sink and the access point
    (AP) communicates with each other.


    **Tier-III**: This is the outermost layer in which the AP communicates with a
    medical server in cloud via Internet. This server requires authorization.


    # 6.1.4.1 APPLICATIONS OF WBAN


    WBAN finds applications in


    +   * telemedicine and remote patient monitoring,

    * lifestyle and sports,

    * military.


    # 6.1.4.2 ADVANTAGES OF WBAN


    The advantages of WBAN are as follows:


    +   * It is used for the detection of critical diseases.

    * It is used for monitoring real-time health data and providing advice.'
