    # 10.2 NETWORK ARCHITECTURE FOR HEALTHCARE


    Based on the scale of deployment and coverage area, networks are

    categorized into personal area network (PAN), local area network (LAN),

    metropolitan area network (MAN), and wide area network (WAN). A PAN

    generally comprises sensors, which are placed in a small geographic area

    with similar terrain profile (Li et al., 2005; Zhao and Viehand, 2009).

    These sensors communicate with a locally present coordinator device or data

    regator through single-hop or multiple-hop communication. The network

    among these sensors can follow a dynamic ad hoc architecture or a static

    client-server-based architecture. In the case of mobile devices and users,

    dynamic architecture is preferred, whereas in the case of static devices, both

    dynamic and static architectures can be followed. Beyond data aggregator,

    the network could be any of LAN, MAN, and WAN or even combination

    of these. A three-layered architecture for the IoT framework (Sethi and

    Sarangi, 2017) is a common approach followed in many IoT-based healthcare

    systems. Figure 10.1 presents one architecture.


    ![](img/8e78e716c4c366f9e41f495059d443ec_289_0.png)


    **FIGURE 10.1** Three-layered architecture of an IoT framework.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Deep Learning and IoT in Healthcare Systems


    The data acquisition layer comprises of sensors that are connected to create a
    PAN, collecting various physiological parameters from the patient (Castillejo
    et al., 2013; Agrawal, 2017). The network of such devices is known as body area
    network (BAN) or body sensor network (Chen et al., 2011; Filipe et al., 2015).
    These sensors connect with a data aggregator, which could be a smartphone connected
    to sensors using Bluetooth or a locally placed data server connected through WiFi.
    Other commonly used technologies enabling connectivity are ZigBee, radio frequency
    identification (RFID), and ultrafrequency. The middle layer—data aggregator and
    processing—is responsible to collect the data from various sensors and process
    it to provide clinical inferences to the patient and send to the upper data storage
    layer. The data storage layer includes cloud-based storage and is used to keep
    the data for long duration such as months to several years. In addition, that
    data require more space and high computing and processing resources are also sent
    to the cloud so that the resources at the middle layer are kept simple and low
    with energy requirement. However, techniques of fog computing are implemented
    at the middle layer to reduce the flow of data to and from cloud storage. This
    can be in the form of processing the data and sending generated inferences to
    the patient and removing redundant data or the one with little relevant information
    being sent to the cloud. Access to the data stored at middle layer or cloud and
    the corresponding user interfaces requires connectivity along with flow of data
    across three layers. Including these additional communication, storage, processing,
    and end-user applications, the overall network architecture of most of the IoT
    applications, as smart home and city, smart health, and industrial machine-to-machine
    and device-to-device is based on the seven-layered network model given in the
    IoT World Forum (Hakim, 2018). Figure 10.2 presents this network model.


    In this reference, the lower three layers—devices, network access, and edge computing
    represent the real-time aggregation and processing of the data generated by real-time
    events. The top three layers—data abstraction, application, and collaboration
    and processes—represent query-based events and computing in non-real time data
    aggregation for long-term interfaces for user interaction and responses to the
    user. The middle layer between these two groups represents aggregation of data
    generated by both these layers and facilitates the flow of data among these groups.


    The devices and processes used in all these layers have different energy requirements,
    thus having varying impact on the overall energy efficiency'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# Energy-Efficient Network Design for Healthcare Services


    of the network. For example, the power requirement of devices in the upper group
    is much higher due to the high-end computing, huge storage, and other power hungry
    resources. Therefore, these devices use the main power line as the source of energy
    and not battery operated. The devices used in lower group of layers are generally
    battery operated, and thus, energy is a more precious resource in these devices.
    Thou, the challenges in terms of energy utilization are different for higher and
    lower layer devices. Since transmission of information is the most energy activity,
    any technique used to reduce the flow of data across different layers and among
    the network and user will make the overall system more energy efficient. In this
