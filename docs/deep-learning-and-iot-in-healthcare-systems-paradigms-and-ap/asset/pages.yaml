    # 3.2.2 DEEP LEARNING


    ML is a subset of AI that helps systems learn automatically from the environment
    as well as self-improvement from experience. It makes predictions or decisions
    without being explicitly programmed. Deep learning is a specialized branch/subclass
    of ML that applies supervised and unsupervised learning to learn features directly
    from the data representations. Deep learning performs feature extraction and transformation
    based on multiple layers of nonlinear processing units. The connection of AI,
    ML, and deep learning is shown in Figure 3.1.


    ![](img/8e78e716c4c366f9e41f495059d443ec_78_0.png)'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Case Studies: Healthcare and Deep Learning


    ML applies statistical and data driven rules to convert the given input into the
    required output. These rules are automatically generated from a large set of examples
    without use of the explicit human specification. For feature extraction, domain
    expertise and human engineering are required in a ML system to detect patterns.
    While, deep learning applies representation learning for pattern recognition.
    Multiple layers of representation are used in deep learning. These layers are
    arranged in a sequential manner and contain a large number of nonlinear and primitive
    operations. A representation of one layer is used as input for the next layer
    and it continues until optimal representation is obtained.


    Deep learning techniques are scalable to large datasets and as an input can accept
    multiple data types as shown in Figure 3.2.


    ![](img/8e78e716c4c366f9e41f495059d443ec_79_0.png)


    **Figure 3.2** Representation of deep learning uses a variety of data types for
    feature extraction.


    In deep learning, the network itself capable to perform many tasks that cover
    filtering and normalization of data that is not possible in the case of the other
    ML approaches and need human interaction. So, deep learning reduces the preprocessing
    of data. While, traditional ML approaches are less capable to analyze the natural
    data in their original form (Esteva et al., 2019). In contrast to ML approaches,
    deep learning uses automatic representation to perform detection/classification
    activities. By this way, it reduces the'
  merge: -1
  img_proc: true
