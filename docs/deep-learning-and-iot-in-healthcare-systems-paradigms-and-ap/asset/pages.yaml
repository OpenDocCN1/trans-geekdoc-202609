    # 8.4.3 SECURITY THREATS


    Irrespective of having many advantages of the IoT systems, it also faces security
    threat from hackers and other cyber criminals. A recent study by Hewlett Packard
    (Hewlett Packard, 2014) revealed that 70% of the most commonly used IoT devices
    contain serious vulnerabilities. Lack of security and privacy will create resistance
    to adoption of the IoT by firms and individuals (Sundmaker et al., 2010; Li and
    Johnson, 2002; Manyika et. al., 2011). These major issues can only be resolved
    by training developers to integrate security solutions, like firewalls, into products
    and make sure that the users utilize IoT security features without any threat.


    Since the IoT technology is such a recent area of research, so is still a lack
    of studies on the social, behavioral, economic, and managerial aspects of the
    IoT. Now the applications of IoT in healthcare models are discussed below, based
    on the recent studies of healthcare applications. Basically, IoT are used in everyday
    life and will be used in each and every aspects of our life. Like in a smart home,
    all the home appliances like televisions, air-conditioning systems, water heater,
    gas in kitchen, level of water in water tank, switches of electric supply to various
    goods, timekeeping devices, and others will communicate among themselves to provide
    secure, smart, low power absorption, remotely controllable environment. Even it
    will control the burglary alarm and remotely monitoring system, door lock system,
    voice recognizers for more safety. In healthcare, these smart homes can assist
    elderly people, younger offspring, pets, terminally ill patients, disabled persons,
    and others. The system can call the doctor or emergency services with live health
    status, alarm for fire or other hazards. Today''s smart technology like android-based
    apps and others will reduce the running and implementation cost of the IoT-based
    smart systems and making it a low-cost system for all. It will form a smart city
    with smart administration where the hospitals also become smart hospital.


