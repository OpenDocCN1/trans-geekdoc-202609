    There are various research conducted to understand whether stress actually changes
    the physiology of one''s brain. Not every type of stress is harmful; it also depends
    on the profundity, cure, and time period. As stress takes various forms, it can
    happen to fight between a person and his/her loved ones, failure when one is expecting
    success, change in environment, or sudden change in her/day-to-day habit. Definition
    of stress varies from age groups and genders. For example, a student gets stressed
    if he does not secure good score in exam or adults tend to get stressed due to
    work pressure or household-related problems. According to physiologists, stress
    can change our brain in four ways:


    +   - Chemical change, which is triggered by stress, can cause irritation.

    - High intensity of stress can shrink one''s brain.

    - A stressful event or action can kill brain cells.

    - Stress can distort and disturb one''s memory by triggering one''s brain threat
    response to one.


    While cortisol (stress hormone) reduces the working of the hippocampus (brain
    part that is used to command many functions of the body, located in the medial
    temporal lobe), it will increase the scale and activity of the corpus amygdaloidatum,
    the brain''s main center for emotional responses and motivation. The corpus amygdaloidatum
    is answerable for a certain process that threats perception and also toward fight-or-flight
    response.


