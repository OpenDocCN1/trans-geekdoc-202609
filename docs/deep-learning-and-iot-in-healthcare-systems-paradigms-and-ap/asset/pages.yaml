  md: '# Energy-Efficient Network Design for Healthcare Services


    as seamless connectivity, security, real-time data acquisition and processing,
    high throughput with error-free communication, etc. In this section, techniques
    to optimize the energy consumption in BANs have been discussed, leading to an
    energy-efficient healthcare system.


    For an energy-efficient network, the device-level power constraints must be considered
    while achieving a balance between cost and performance of the device. A standard
    architecture of a biosensor device includes a sensing unit acting as a transducer
    for the measured physical parameter, a processing unit, and a communication unit
    with having signal processing circuits and antenna for transmission and reception
    of the signals. The performance of all units of the device must be maintained
    individually and while keeping the energy consumption to a lower level for a longer
    lifetime. Optimum selection of resources such as sensitivity and resolution of
    sensing unit, computing power of the processing unit, and transmit power and receiver
    sensitivity is required, which will make the device not only cost effective but
    energy efficient as. Efficient device operation and service provisioning methods
    are also implemented through embedded software modules to reduce the power consumption
    without any impact on device performance.


    # 10.5.1 TECHNIQUES AT PHYSICAL LEVEL


    It has been well established in many research works that more than 70% energy
    consumption for a device is accounted by the communication unit. Techniques to
    regulate data transmission and flow of data across different layers of the network
    architecture have shown significant improvement in energy efficiency of the network.
    At the physical device level, efficient node placement methods are considered
    to implement low-power networks. The IoT networks operate in many-to-one mode,
    where multiple sensor nodes send the data to a common data aggregator or sink
    in single or multiple hops. The flow of data and number of hops can be optimized
    using node placement techniques for a balance between energy and performance.
    This not only balances the uneven flow of data but also reduces congestion in
    the network. Some of the popular algorithms used for node placement—genetic algorithms
    (Noruzi and Zaim, 2014; Zorlu, and Şahingöz, 2017), bioinspired algorithms (Kulkarni
    et al., 2009; Tamizharasi et al., 2013), particle swarm optimization (Shunyuan
    et al., 2016), optimized artificial fish swarm algorithm (Yiyue et al., 2012),
    artificial bee colony, territorial predator scent marking algorithm (Abidin and
    Din, 2013).'
