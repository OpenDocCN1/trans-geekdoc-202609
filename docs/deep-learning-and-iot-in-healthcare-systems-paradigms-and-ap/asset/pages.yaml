    or not use insulin well, which results in the glucose to remain in the blood,
    as a result of which the glucose circulates in the blood and does not reach the
    cells, raising in turn the glucose level of the blood and causing this disease.
    Diabetes is of two kinds: type I and type II. If a person suffers from the type
    I diabetes, then the body of the person is not able to produce insulin. The immune
    system destroys the cells that produce insulin. As a result, the person has to
    take insulin in order to stay alive (Marker et al., 2018). If the person suffers
    from type II diabetes, then the body does not make insulin or use it. This is
    the most common type of diabetes.


    Due to this increasing problem of diabetes, there is always a need for innovative
    technology that can help the people keep track of their disease on their own.
    Many such pharmaceutical companies are working every day to bring such devices
    to everyone. With the help of these devices, people will be able to freely and
    independently track the status of their sugar level. A study that was conducted
    by Polisena et al. (2015) on the Canadian Agency for Drugs and Technology in 2009
    found that storing and sharing monitored blood glucose using telehealth tools
    (such as PDAs or machines), supported by physician feedback, showed improved glycemic
    levels and reduced hospitalizations. There are various glucose-monitoring devices
    available in the market that are manufactured and marketed by some pharmaceutical
    companies and helping people to keep track of the blood glucose level independently.
    These gluometer kits come along with a device that tells the reading of the glucose
    level, with the help of test strips. In order to use this gluometer, the person
    pricks the skin (commonly his finger) and applies the blood sample onto the test
    strip, which is inserted into a meter. The glucose of the blood reacts with the
    chemicals in the test strips, and then, an electric current passes through determining
    the level of glucose in the blood sample and provides numerical results on the
    meter. Thus, by using these gluometer kits, an individual can get his/her glucose
    level in seconds.


    Wearable technology is the new trend in the glucose level monitoring industry
    that brings a trend in testing glucose (Gonzales et al., 2019). These wearable
