  md: '# CHAPTER 3


    # Case Studies: Healthcare and Deep Learning


    ASHISH TRIPATHI1*, ARUN KUMAR SINGH1*, K. K. MISHRA2, PUSHPA CHOUDHARY1, and PREM
    CHAND VASHIST1


    *1Department of Information Technology, G. L. Bajaj Institute of Technology and
    Greater Noida, India


    *2Department of Computer Science & Engineering, Motilal Nehru National Institute
    of Technology, Allahabad


    *Corresponding author. E-mail: ashish.mnnit44@gmail.com


    # ABSTRACT


    As the size of the medical data is increasing day by day, the traditional techniques
    of data analysis are becoming inefficient to provide accurate and valid information
    on time. Therefore, to overcome the limitations of the traditional techniques,
    deep understanding and analysis capabilities are required to detect and diagnose
    the disease in the early stage. In recent years, several artificially intelligent
    techniques have been developed for the analysis of different diseases, such as
    cancer, diabetes, Alzheimer’s diseases, and more likes. In this context, deep
    learning techniques are playing a significant role in analyzing the medical dataset
    for faster detection and diagnosis of diseases. In this way, these techniques
    are helping medical research and practitioners working in the healthcare industry.
    This chapter presents the role of deep learning techniques in the healthcare system.
    The role of deep learning has been discussed in the analysis and support in clinical
