    Now, the basic aspect of IoT is the connectivity to each and everything possible
    automatically. In a very simple way, it is a network that connects everything
    with every other thing using some communication medium. This aspect makes every
    node that are taking part in IoT to become a “smart” node or device. Essentially,
    the IoT architecture requires the following aspects:


    +   - A sending device that can send information to the system, e.g., a sensor

    - A receiving device that is receiving and processing information automatically,
    for example, a processing server.

    - A device that can do both, for example, our cellular phones.


    The intelligent devices can communicate among themselves and also take decisions
    of their own using some machine learning (ML) techniques and applying artificial
    intelligence (AI) (Perera et al., 2013).


    The Internet has opened an infinite highway to extend the connectivity across
    the world. The IoT devices are using this infrastructure to connect among themselves.
    So, IoT is basically an extension of the control of Internet starting from computers
    and smartphones to a wide range of other things, processes, and events. IoT offers
    businesses and people a better understanding and control over the objects and
    surroundings that spread beyond the range of the Internet. Also, by applying so,
    IoT permits businesses and people to be more linked with the circumstances and
