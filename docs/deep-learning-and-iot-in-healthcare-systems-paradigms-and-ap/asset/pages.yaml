    detection techniques that use both online and offline data, the threshold-based
    methods are quite popular. However, these methods are not very efficient to analyze
    the fine-grained falls. The fall-posture analysis can be efficiently done using
    some ML techniques like K-nearest neighbor (KNN), support vector machine (SVM)
    (Foroughi et al., 2008), random forest, decision tree, etc. These types of methods
