    # 8.4 VARIOUS LIMITATIONS IN IOT SYSTEM DEVELOPMENT


    Based on the IoT ground report survey, this section discusses limitations in IoT
    development by enterprises. It has also been observed that data centers face challenges
    in security, the enterprise, consumer privacy, data storage management, server
    technologies, and data center networking (Bradley et al., 2013). Several technical
    and managerial challenges, viz. privacy data mining, and security, are discussed
    in this section.


    # 8.4.1 PRIVACY CHALLENGE


    An IoT is likely to improve the quality of people''s lifestyle (Fichman et al.,
    2005). While it continues to gain momentum through smart home systems and wearable
    devices, confidence in acceptance of the IoT will depend on the protection of
    users'' privacy. Health-related data of a hospital or healthcare centers are always
    under privilege communication and professional secrecy. Thus the medical record
    is the property of the hospital but hospital cannot share the information without
    the permission of the patient. To use the cloud computing and database management
    system with the IoT in various healthcare applications, where the prescription
    or the treatment procedures are online telemedicine and doctors who will connect
    each other in online platform. So, the breach of data is one of the privacy challenges
    to implement IoT in healthcare.


    # 8.4.2 CHALLENGES IN DATA MINING


    Artificial intelligence (AI) required huge data to be implanted in neural hub
    and healthcare data are most sensitive data where a patient''s life is in stake.
    Thus, this data mining to successfully program health related model is a real
    challenge for health workers and IoT support providers.'
