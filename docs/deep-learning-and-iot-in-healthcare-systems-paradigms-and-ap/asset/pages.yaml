- pgno: 101
  md: '# Case Studies: Healthcare and Deep Learning


    # 3.5.2 CASE STUDY: ALZHEIMER


    Alzheimer is a chronic neurodegenerative disease that occurs due to progressive
    neurological disorder. This usually starts with gradual death of brain cells and
    cause of memory loss and thinking skills (Burns and Illiffe, 2009). It is the
    main cause of dementia that affects the ability of a person to work independently.
    It starts with an early stage of forgetting recent activities like conversation,
    remembering objects (World Health Organization. Dementia—a public health priority
    2017, Source: http://www.who.int/mental_health/neurology/dementia/infographic_dementia/en),
    reasoning/judgment problem, difficulty in learning, and problem with performing
    routine tasks (World Health Organization). Dementia fact sheet, 2017, Source:
    http://www.who.int/mediacentre/factsheets/fs362/en/). As the diseases progresses,
    different changes may be visualized in a patient behavior such as problem to carry
    out everyday tasks, rapid change in mood, behavioral changes (e.g., self-injury
    as hitting, biting, and scratching to himself), wrong sexual practices (e.g.,
    publicly masturbation/groping), stealing and throwing objects (Burns and Illiffe,
    2009). Till now, is no effective treatment has been discovered that completely
    completes this disease. In advanced stages, various complications may occur and
    result in death.


    # 3.5.2.1 CAUSES OF ALZHEIMER


    In a study, researchers have been observed that genetic complications, daily lifestyle
    and environmental factors are the main causes of Alzheimer (Wilson et al., 2011).
    Severe genetic changes are one of the main causes of Alzheimer and this is usually
    onset in the middle age (World Health Organization. Dementia—a public health priority,
    2017. Source: http://www.who.int/mental_health/neurology/dementia/infographic_dementia/en).
    main cause of Alzheimer disease (AD) is still a big research issue, but the core
    problem of this disease is the abnormal functioning of “brain proteins (i.e.,
    plaques and tangles)” that not only even disturb the normal activities of neurons
    but also releases toxic events. Consequently neurons become dying due to loss
    of interaction. Region of the brain that controls the memory is firstly affected
    by the damage. The damaged neurons then spread it and affect the other regions
    of the brain in a specific pattern. At the late stage of the disease the brain
    shrink and in result in death.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# 3.5.2.2 SYMPTOMS OF ALZHEIMER


    The symptoms of AD vary from patient to patient and it emerges gradually over
    a period of time. The initial symptoms of this disease may be forgetting events/activities,
    mild confusion, inability to do the activities without any support, problem in
    recognizing objects, and so on. Changes in Alzheimer symptoms can have three categories,
    that is, functional, cognitive, and behavioral. Functional changes affect the
    daily routine such as managing finance, personal care, and travelling. Finally,
    patient will be completely dependent on others.


    Short-term memory memory comes under cognitive changes dealing with recent events,
    inability to recognize the familiar route/faces/objects, loss of learning ability,
    inability to recognize family and friends, and unable to take decisions.


    Behavioral changes occur due to the involvement of patient in socially unacceptable
    activities such as loss of emotional feeling and change in mood (e.g., anxiety,
    depression, agitation, lack of interest, and apathy), which is very much difficult
    for a family to handle and ultimately requires medical under expert supervision.


    In a recent study, deep learning model has been proposed by the researchers of
    the University of San Francisco for the early prediction of AD by using “fluorine
    18 fluorodeoxy glucose PET” of the brain (Dean et al., 2018). This model has an
    ability to detect the AD up to six years earlier than the existing techniques.
    In this work, 2109 prospective 18F-FDG PET brain images from 1002 patients and
    40 imaging studies from retrospective independent test set of 40 patients have
    been collected to perform the clinical diagnosis. Further, the final diagnosis
    has been recorded. The proposed model used 90% of the dataset for training purposes
    and 10% of the remaining dataset for testing purposes. Performance of the proposed
    model has been compared with the radiologic readers on the basis of different
    factors such as sensitivity, i-distributed stochastic neighbor embedding, specificity,
    saliency map, and receiver operating characteristic (ROC). The area achieved by
    the algorithm under the ROC curve of 0.98 with 82% specificity and 100% sensitivity
    in the early prediction of final clinical diagnosis of AD. This result has obtained
    on an average of 75.8 months before the final diagnosis.


    In other research work, for the prediction of mild cognitive impairment (MCI)
    and Alzheimer-type dementia (AD-type dementia) on sparse learning dataset, a combination
    of deep language models and DNN named “D2NLM” has been used (Orimaye et al., 2018).
    To learn deep learning'
