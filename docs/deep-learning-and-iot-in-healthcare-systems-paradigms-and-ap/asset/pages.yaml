  md: 'equipment required. Smart lighting system can reduce the electricity bill for
    finance department.


    # 8.10.8 LAUNDRY AND LINEN SERVICES


    Effective IoT-based linen and laundry services save time and remove stain and
    germs from the used linen. Hospital can easily identified the dirty and clean
    linen easily and the store can easily identified the unused clean linen which
    may cross the expiry date.


    # 8.10.9 BED MANAGEMENT


    Smart IoT can calculate the occupancy rate of the hospital, thus send signals
    to the admission and emergency department to hold or release the patient for wards/ICU,
    or others. Smart bed can reduce the mobile monitors and directly send the vital
    signals to the doctors or nurses, alarm them for any emergency situation.


    # 8.10.10 CONTROLLING OF INFLOW OF GUESTS AND GERMS


    The smart IoT system can detect the environmental changes very easily, thus can
    be used to detect unwanted access to security areas, control the guests for admitted
    patient and accompany, can wen reminder for using washand and hand sanitizer after
    treating a patient or any other thing. It can be implemented with HVAC system
    of the hospital to control the weather inside the patient area.


    # 8.10.11 NURSING CARE


    IoT can calculate the medication procedures. Thus its reminder if any medication
    time arises, helps the nurses for taking care to a terminally-ill patient who
    cannot use the nursing calling system manually. Smart monitors also send signals
    for nature’s call like urination for very ill patients automatically so the nurses
    can take care of the patient. Any sudden changes in the monitors, the inflow of
    fluid to the patients like saline or sustained release injections can be send
    reminders to the appropriate authority prior the empty bag.'
