- pgno: 292
  md: '# 10.3 ENERGY CONSTRAINTS IN IOT NETWORKS


    The lower layers of an IoT network include devices (RFID tags, biosensors, ambience
    sensors, smart dust, etc.), which are battery-operated and network interfaces
    providing a low-power radio link (Vasseur and Dunkels, 2010). The challenges at
    device level include size, cost, and energy consumption, whereas the network-level
    challenges include seamless connectivity, bandwidth, range of communication, and
    transmit and receive signal strength. The radio links used in IoT networks (IEEE802.11,
    IEEE802.15.4, etc.) are highly unstable and lousy with low reliability due to
    interference and weak signal strength (Ko et al., 2011). For better energy efficiency,
    both the devices and radio links are low power and contribute to the energy constraints
    for device and network designers. The constraints become more critical for applications
    where uninterrupted monitoring is required, demanding for devices to be in active
    state and continuous transmission of data across various layers.


    The networks deployed for healthcare services are responsible to send health condition
    of the patients continuously to the clinical experts. This is required in case
    of preventive healthcare, where a person is being monitored to detect occurrence
    of any prehospitalization clinical emergency and also for the patients who are
    under treatment or posthospitalization (Redoni et al., 2013). Any discontinuity
    in acquisition and transmission of data may be life threatening in case of monitoring
    patients for chronic diseases. Since these devices are battery driven, the utilization
    of battery power must be optimized for long battery life. Instead of simply reducing
    the power consumption, the system should be efficient in terms of providing reliable
    and secure communication with minimum energy consumption. This efficiency can
    be improved by applying energy-efficient designs in sensor nodes, communication
    devices and network architecture, routing protocols, and data processing units.
    Most of the physiological sensors use smart, adaptive technology to transmit and
    receive data through any one or more of the various standards such as IEEE802.11x
    and IEEE802.15.x. The parameters that affect energy efficiency of the network
    must be identified, and techniques should be applied for its improvement. Some
    of the commonly observed factors are given in Table 10.2 with their cumulative
    effect on battery consumption and described further in this section.


    +   - Energy problem: In wireless sensor networks, there is uneven consumption
    of energy by the nodes depending upon their distance from the data sink or the
    aggregator node. The nodes that are closer to the sink act as aggregators for
    the nodes that do not have sink in their'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# Energy-Efficient Network Design for Healthcare Services


    range directly and thus transfer their data to the other nodes in multihop mode.
    This results in early drain-out of energy for the near nodes due to the large
    amount of data transmission activity, making them unavailable soon. The far nodes,
    though have sufficient battery life available, cannot send data to the network
    due to the broken link. This condition is called energy hole (Boukerche, 2008).
    Several techniques have been proposed and tested to reduce the network failure
    due to this reason. In case of networks used for healthcare services, the energy
    holes may occur for a common wireless sink that is being used for several patients
    present at different locations within a hospital in remote/rural areas, where
    direct connectivity to the cloud is not available for all the patients.


    # TABLE 10.2 Factors Affecting Energy Consumption in a Network


    | Sr. No | Energy Consuming Activity | Cumulative Battery Power Consumption |

    |---|---|---||

    | 1 | Energy hole | | |

    | 2 | Data retransmission | | |

    | 3 | Collision of data | | |

    | 4 | Idle-listening | | |

    | 5 | Overheating | | |


    +   - **Retransmission of data**: Most of the networks operate in hand-shake mode
    to ensure error-free delivery of data. A threshold is set to decide the failure
    of transmission or error beyond acceptable limit, which initiates retransmission
    of data (Jajrendran et al., 2003). This could be due to poor quality link having
    severe propagation loss, fading, and strong interference or failure of intermediate
    nodes. As mentioned earlier, retransmission is the most energy-consuming activity
    for a sensor network; several techniques have been proposed and tested to reduce
    retransmission of data.

    - **Collision of data**: In a sensor network, multiple nodes send data to a common
    data aggregator or sink node using similar network access technology such as ZigBee,
    BLE, or WiFi. This results in increased chances of collision of data during the
    multihop or at the sink node (Jones et al., 2001). Collisions must be avoided
    since they not only'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'affect the performance of the network but also demand for retransmission of
    data, which adds to the energy consumption overhead on the already constrained
    battery. Prediction and prevention of collision is a major power-saving activity
    for sensor networks used in mission-critical application of healthcare.


    +   * Idle-listening: A sensor node can be configured to operate in any of the
    several modes at an instant of time such as sleeping, sensing, active, and routing.
    Since most of the sensor networks operate in the multipath mode of data transfer,
    the nodes are configured to both transmit and receive data. In case of low-power
    networks, receive operation also consumes significant amount of power similar
    to transmit operation and thus need to be minimized to increase battery life and
    make the network more energy efficient (Kuntz, 2010). When sensors are used for
    critical monitoring applications, they need to listen continuously to detect occurrence
    of an event and thus remain in active state. In such conditions, the battery life
    of the nodes decreases below the expected value as per design specifications,
    reducing energy efficiency of the network.


    +   * Overhearing: It refers to the unwanted reception of data by sensor nodes,
    data aggregator, and other network devices (Kuntz, 2011). In case of multipath
    transmission, from a distant node may be received by multiple intermediate nodes
    before it reaches the data aggregator or sink node. Such multiple and redundant
    receiving activity increases the battery consumption of the nodes compared to
    the conditions whereing is minimized.


    The aforementioned and many other factors affect the energy efficiency of the
    network and challenge their suitability for critical applications related to healthcare
    services. To increase the uninterrupted lifetime of the network, the energy consumption
    needs to be reduced so that the same battery can provide power to the network
    for longer duration of time. Several techniques have been proposed to balance
    the effect of the factors mentioned in this section. This chapter focuses on the
    issues related to network design with an objective to make it more energy efficient.


