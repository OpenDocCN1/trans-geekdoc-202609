    # 8.10.5 CENTRAL STERILE SUPPLY DEPARTMENT


    # 8.10.6 MEDICAL WASTE MANAGEMENT


    The huge medical wastes can be reducing to implement the smart IoT-based system.
    This can also detect leakage or spill of medical waste. The tracers can indicate
    the collection, segregation of medical waste. After the segregation, smart indicators
    report the treatment processes to avoid any mistake. It can reduce the medical
    waste with smart intent of medication and equipment. The intelligence may reduce
    the error of segregation and treatment procedures of misfit container or misguided
    waste removal, wrong treatment procedures.


    # 8.10.7 ENERGY SAVING


    Effective IoT-based sensors and lighting system can save energy. It can make sure
    to turn the unused machinery in sleeping mode and use only the'
