    # 5.4 SPEECH RECOGNITION IN HEALTHCARE


    Assistive devices in healthcare are emerging successfully to solve many issues.
    Language technologies have the capacity to help people to understand and access
    the information easily (Pearson et al., 2010). Especially, speech recognition
    provides dominant applications in the eHealth system. Speech recognition system
    consists of microphones, sound cards, and speech engine software (Al-Aynati and
    Chorneyko, 2003). In radiology, the implementation of speech recognition reduces
    the turnaround time from 15.7 to 4.7 h (Callaway et al., 2002). As radiologists
    are dealing with huge volume of data, typing the report by hand takes more time.
    A telephone-based dictation speech recognition system is available to record the
    details dictated by the radiologist, which speeds up the report-generating process.
    This method is often referred back as back-end speech recognition. Improvement
    in the reporting of surgical pathology is analyzed, and cases signed out in 1
    day improved from 22% to 37% (Singh and Pal, 2011). Front-end speech recognition
    software is also in practice for physicians to generate the reports with the help
    of personal computers. Speech recognition software is providing benefits to people
    with disabilities. Cerebral palsy and motor neuron disease are getting benefited
    by speech recognition software. Many companies are recruiting persons with speech
    making voice recognition software available for computer control and data'
