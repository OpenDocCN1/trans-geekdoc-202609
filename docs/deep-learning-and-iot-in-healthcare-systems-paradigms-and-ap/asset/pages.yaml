    # 6.4 DIFFERENT MONITORING APPROACHES


    The methods of monitoring the fall may be divided into three types such as (1)
    a nonambulatory sensor-based method, (2) a wearable sensor-based method, and (3)
    a computer image-based method.


    In the auditory recognition method, identification of fall procedures depends
    on the quivering of frequency of the subject. However, sensor-based methods depend
    on kinematic sensors like the gyroscope and accelerometer to identify falls from
    ADL. The computer image-based method performs a real-time monitoring of the subject
    through the camera, and the postures are identified by any computer-based algorithm.
    It is more accurate than the other two methods. The caregiver has to give minimum
    effort for such a monitoring system. However, this method is still in its nascent
    stage. The conventional methods still need a lot of improvement through further
    research.


    # 6.4.1 NONAMBULATORY SENSOR-BASED METHOD


