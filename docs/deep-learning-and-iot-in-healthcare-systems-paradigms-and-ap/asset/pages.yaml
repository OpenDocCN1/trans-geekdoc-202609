    # 5.7 IoT-BASED ASSISTIVE WALKER DEVICE FOR FRAIL AND VISUALLY IMPAIRED PEOPLE


    More than 285 million people in the world are visually challenged and are facing
    reduced mobility and falls issues (Lacey et al., 2006). Elderly'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Impact of IoT on Healthcare-Assistive Devices


    people are also suffering from the same issues, and more than one-tenth of the
    falls causes serious injuries (Tinetti et al., 1988). Apparently, these people
    need an extra support for stable walk and balance, which cannot be provided by
    conventional walkers and canes that do not have modern technology. Hence, a smart
    device is important to ensure the safety of the visually impaired and elderly
    person. IoT is considered as the base for the smart assistive devices. The IoT-based
    assistive walker for frail and visually impaired people consists of both hardware
    and software. The electrical part is considered as the hardware, which accommodates
    a sensor unit, a control unit, and the output. The software maps to assist and
    find the exact location of the victims. The sensor gathers the information regarding
    the location and the surroundings of the system. If any obstacles are found in
    the path of the walker, the sensor senses the position of the object and transfers
    the details to the controller via IoT, which alerts the user through output devices
    and avoids falling or fatality.


    The IoT-based walker architecture is divided into three layers, namely,


    +   - a perception layer,

    - a network layer,

    - an application layer.


    The perception layer sometimes called as the recognition layer (Suo et al., 2012)
    is the lowest layer of the IoT architecture, responsible for collecting information
    like direction, position of the object from the environment and thing, and conversion
    of the data into the digital form. This layer uniquely identifies the address
    by utilizing communication technologies such as Bluetooth, RFID, 6LoWPAN, and
    Near-Field communication (Silva et al., 2017). The network layer is considered
    as the brain of the architecture, and it is responsible for secure data transmission
    between perception and application layers (Suo et al., 2012). This layer is the
    convergence of communication networks and the internet. The application layer
    is the topmost layer of the traditional IoT architecture that provides personalized-based
    services based on the users need thus reduces the gap between the user and the
    applications.


    Figure 5.3 shows the architecture of the IoT-enabled assistive walker. The user
    makes a request to go park through his/her Internet-connected mobile phone. The
    request is transmitted to the network layer, which process and transfer the data
    to the application layer. This layer guides the user to do necessary steps to
    reach the park safely.'
