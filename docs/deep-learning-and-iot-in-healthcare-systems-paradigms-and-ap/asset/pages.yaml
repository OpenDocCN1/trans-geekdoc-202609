- pgno: 97
  md: '# Case Studies: Healthcare and Deep Learning


    classifications of tumors in the biopsy. Benign cells are noncancerous and do
    not invade or spread nearby tissues and other parts of the body respectively.
    Fibroids and lipomas are examples of the benign tumor (López et al., 2012). Malignant
    tumors are cancerous and can affect nearby tissues. They start invading from breast
    tissue to lymph nodes and starting other parts of the body such as bones and levers.
    A biopsy helps to identify the properties of breast cancer tumor (Pöllänen et
    al., 2014).


    In deep learning, CNN is a subclass of DNNs mainly focuses on feature learning
    that is automatically learned through demonstration of data (LeCun et al., 1998).


    In a research work for the correct prediction of spontaneous breast cancer, Listgarten
    et al. (2004) has used single-nucleotide polymorphism (SNP) profiles of steroid
    metabolizing enzymes (CYP450s). In all types of breast cancer, nonfamilial breast
    cancer covers over 90% (Dumitrescu and Cotarla, 2005). This research is based
    on a certain permutation of steroid-metabolizing gene SNPs that may enhance the
    improved addition of ecological toxins/hormones in breast tissue, which is the
    cause of high probability of occurring breast cancer.


    Deep learning using the various decision tree models along a SVM technique to
    get the maximum accuracy using the SNPs data and prediction powers depends upon
    the model. Validation and accuracy are based on the training methods like cross-validation,
    bootstrap, and resampling method.


    SVM and naïve Bayes techniques have used a set of three SNPs with the highest
    accuracy while decision tree has used only a set of two SNPs and obtained the
    highest accuracy in the result. In the case of breast cancer prediction accuracy
    percentage obtained by SVM, naïve Bayes and decision tree are 69%, 67%, and 68%,
    respectively.


    In recent years, work in deep learning has been accelerated in cancer prediction
    that is the most popular disease and images have the dominant role in the analysis
    (Jiang et al., 2017). Especially cancer research is based on two types of activities
    such as radiology and pathology. Several recent works on deep learning has included
    large datasets to train the model and shows comparable results to that of the
    diagnostic experts across a range of images such as CT scan (Merk et al., 2017),
    MRI (Jamaludin et al., 2017), chest X-ray (Rajpurkar et al., 2017), and mammography
    (Koi et al., 2017). In research, it is found that CT scan of chest can reduce
    the mortality rate of lung cancer (Setio et al., 2017).


    Lots of work have been done in organ/lesion segmentation including a range of
    organs and different pathological forms that support deep analysis and present
    it as an automated system (Litkens et al., 2017). Segmentation'
