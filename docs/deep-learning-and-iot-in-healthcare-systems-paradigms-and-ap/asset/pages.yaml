    # 6.5.1 THRESHOLD-BASED METHODS


    The threshold-based methods are fast, light weight, and most popular methods for
    the detection of fall (Huang et al., 2009). T. The system usually takes the acceleration
    data from the three-axis accelerometer and combines them using signal vector magnitude
    (SVM) method or a Euclidean distance-based method. As any fall event causes a
    huge acceleration change, a predefined cut-off threshold value is compared against
    it (Tsinganos and Skodras, 2017). If the present acceleration exceeds the threshold,
    then the event is detected and an appropriate warning is generated. The mathematical
    expression used to combine the acceleration data is given as follows:


    $SVM = \sqrt{(Ax)^2+(Ay)^2+(Az)^2}$, where $Ax, Ay, Az$ are acceleration components
    along the x, y-, and z-axis, respectively.


    The Euclidean distance can be calculated by subtracting the previous reading from
    the current reading and combining them:


    If $Ex = Ax_{(t+1)} - Ax_{(t)}$, $Ey = Ay_{(t+1)} - Ay_{(t)}$, and $Ez = Az_{(t+1)}
    - Az_{(t)}$ be the Euclidean distances along the x, y-, and z-axis, respectively,


    $EuDi = \sqrt{(Ex)^2+(Ey)^2+(Ez)^2}$


    Now, if $SVM_{acc} > SVM_{acc}$ (threshold) or $EuDi > ED$ (threshold), then the
    event is recorded as fall.


    Although this method is good for detection, it may generate a number of false
    alarms for fall-alike events such as stumble, fast fitting, or sudden increase
    in speed due to any nonfall event.


    Some researchers tried to extract the posture information by calculating the pitch,
    roll, or yaw values that are nothing but a change in the angle of the'
