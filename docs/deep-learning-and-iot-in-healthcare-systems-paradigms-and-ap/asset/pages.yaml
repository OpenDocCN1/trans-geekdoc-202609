    # 5.2 TYPES OF SENSORS FOR ASSISTIVE DEVICES


    Sensors play an important role in the design and development of assistive devices
    as they collect the accurate data for monitoring health. The technologies like
    micromechanics and microelectronics have paved the way for the invention of various
    sensors to monitor human activities with low power consumption. Based on the working
    mode, the sensors are classified into invasive sensors and noninvasive sensors.


    # 5.2.1 INVASIVE SENSORS


    In invasive sensors, the body fluids are used to collect the health-related data.
    Blood plays a vital role in collecting the crucial parameters from various organs.
    Apart from blood, living cells are also used to gather the status of living organs.
    The samples are collected from humans through natural cavities. An example of
    invasive sensor is an ex vivo sensor that monitors blood gases and pH during cardiopulmonary
    bypass. This sensor is suitable for continuous parameter monitoring system (Islam
    and Mukhopadhayay, 2017).


    # 5.2.2 NONINVASIVE WEARABLE SENSORS


    Noninvasive wearable sensors do not need the body fluid, and hence, it is not
    necessary to penetrate the body using incision or injection; these are painless
    and more attractive (Table 5.1). The body fluids used in this sensor may be sweat,
    skin interstitial fluids, saliva, and tears (Bandoodkar and Wang, 2014).


    # 5.3 WORKING PRINCIPLES OF ASSISTIVE DEVICE SENSORS


    The working principles of sensors are based on different techniques like optical,
    electrical, and piezoelectric effects and electrochemical sensing.'
