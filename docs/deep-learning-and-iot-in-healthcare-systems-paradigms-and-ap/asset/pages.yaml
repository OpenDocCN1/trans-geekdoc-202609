  md: '# Case Studies: Healthcare and Deep Learning


    On the contrary, deep learning should be taken at a hand in reducing the work
    pressure, allowing the physicians to focus on critical portion of the disease,
    and help them in the diagnosis and treatment activities. In particular, the following
    issues are considered in the healthcare system.


    # 3.3.1 QUANTITY OF DATA


    Construction of the basic brain architecture is an ongoing process that starts
    from before birth and continues to adulthood. First, learning starts from simple
    neural connections and basic skills generations among neurons followed by complex
    circuit and skills. Every million of new neural connections are formed for some
    period of time. After that pruning makes brain circuit more efficient.


    Deep learning models are somehow based on a human brain architecture that is a
    group of highly intensive computational models. A multilayer neural network is
    an example of deep learning, where millions of network parameters are required
    to be optimized to solve any problem. The optimal solution is based on the availability
    of data on a large scale. Deep learning is very useful in domains where huge amount
    of data can be easily available, for example, natural language processing, speech
    recognition, and computer vision. As a great part of the population has no access
    to primary healthcare facilities. Consequently, availability of the patient''s
    data for the training of deep learning modules on a particular disease is comparatively
    very less as required. Deep learning models need tens of millions of sample data
    when they are applied on heterogeneous and complex states of diseases such as
    chronic heart disease, kidney failure, and cancer to make a reliable and authenticated
    clinical model for fruitful diagnosis. For example, in the classification of diabetic
    retinopathy and skin cancer, learning model has been required 128,175 retinal
    images (Gulshan et al., 2016) and 129,450 skin images (Esteva et al., 2017), respectively.
    Thus, in many clinical activities, unavailability of huge amount of reliable data
    is a big issue in healthcare.


    # 3.3.2 QUALITY OF DATA


    In the healthcare sector, medical data are highly unstructured, heterogeneous,
    unorganized, and ambiguous in comparison to other domains. Thus, training deep
    learning models is a very challenging task in the presence of such huge and scattered
    data sets. Several issues need to be considered, for'
  merge: -1
  img_proc: true
- pgno: 88
  md: '72


    Deep Learning and IoT in Healthcare Systems


    example, missing value, data redundancy, less significant data during the training
    session. EHRs are an example that contain these types of data for a patient. In
    this context, it is very difficult task for deep learning models to do the pattern
    recognition from such type of scattered and noisy data (GianFrancesco et al.,
    2018).


    # 3.3.3 TEMPORAL ASPECT OF DISEASE


    Considering the temporal aspect of disease in the development of deep learning
    techniques requires temporal data to handle and develop a novel solution. Here,
    temporal aspect means progresses and changes over time that happens in a nondeterministic
    way (Cheng et al., 2016). Thus, skipping these aspects is a big issue in the proposed
    techniques so far in healthcare domain (Mehrabi et al., 2015).


    # 3.3.4 COMPLEXITY OF DOMAIN


    The healthcare domain is very much complicated in comparison to other domains
    (e.g., natural language processing, visual recognition, fraud detection, entertainment)
    due to heterogeneous nature and less knowledge about the cause and progress pattern
    of diseases (Liang et al., 2014). In fact, it requires a large number of patients
    for a particular disease to do the clinical analysis, which is practically not
    feasible most of the time (Pham et al., 2017).


    # 3.3.5 MODEL INTERPRETABILITY


    Deep learning models present end to end learning and appear as boxes that take
    input and generate output without providing a clear explanation about the basis
    of prediction. For example, a patient has been diagnosed melanoma with a 0.8 probability,
    by a deep learning model. In this context, a clear interpretability is required
    for prediction to convenience the medical practitioners. Deep learning models
    are viewed with skepticism if they state only the diagnosis. Thus, clear interpretation
    of the diagnosis of models is a big challenge for the complex clinical practices
    (Noh et al., 2015).'
