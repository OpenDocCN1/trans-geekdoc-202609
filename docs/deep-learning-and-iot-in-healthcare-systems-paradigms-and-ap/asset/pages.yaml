    # 5.5 VENTRICULAR ASSISTIVE DEVICE


    A ventricular assistive device is an electromechanical device used to assist people
    with heart failure. The ventricular assistive device contains a balloon that is
    wrapped around the delicate portion of the heart to promote the blood flow. Based
    on patient''s health condition, the ventricular assistive devices are designed
    as left ventricular assistive device, right ventricular assistive device or biventricular
    assistive device (Sen et al., 2016). Traditionally, the ventricular devices contain
    a pump to circulate blood, a controller to control the activities of the device,
    a power supply to operate the device, and a drive line to connect the right atrium
    with the pulmonary artery and the left atrium with aorta.


    Nowadays, heart transplantation is considered the most successful long-term surgical
    treatment for heart failure. However, receiving the organs for transplantation
    is a tedious process. In this situation, a ventricular assistive device is considered
    the treatment modality as it acts as a bridge to transplantation. This device
    supports the patient until the donor is available. In some cases, when the patient''s
    health condition does not support for cardiac transplantation, the ventricular
    assistive device acts as destination therapy.


    # 5.6 BLOOD PRESSURE MONITORING


    Blood pressure is a very important factor along with the heart rate, the body
    temperature, oxygen saturation, etc. The measurement of the blood pressure is
    expressed in terms of the maximum heart beat (systolic pressure) over minimum
    heart beat (diastolic pressure, Siddiki, 2011). Generally, the blood pressure
    is measured in the units of millimeter of mercury (mmHg). The blood pressure is
    written in two figures:


    +   - Systolic pressure: This is the pressure when the heart pushes the blood
    out of the heart.


    +   - Diastolic pressure: This is the pressure when your heart rests between the
    beats.


    According to the WHO, the global estimation of people suffering from blood pressure
    in 2008 was around 40% of the total world population. Blood'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Deep Learning and IoT in Healthcare Systems


    pressure is mainly of two types: (1) low blood pressure and (2) high blood pressure.


    High blood pressure, also known as “hypertension,” occurs when the blood pressure
    reading of an individual is “140 over 90 mmHg” or higher. If any individual suffers
    from high blood pressure, it means that there is of extra strain on his heart
    and blood vessels, which can later on increase the rate of heart attack or stroke.


    Low blood pressure, also known as “hypotension,” occurs when the blood pressure
    reading of any individual is lower than “90 over 60 mmHg.” The causes of low blood
    pressure can vary from dehydration to any surgical disorders or serious medical
    issues. Having a low blood pressure is not a great deal of concern, but at a very
    low blood pressure, the body can feel dizziness or faintness, which can be a serious
    health issue.


    Thus, there is a serious need for finding out such devices that can help people
    to know about their blood pressure without going to doctors every time and reducing
    their hospital bills. There is always need for assistive devices by the help of
    which the population can help themselves to keep a check on their diseases without
    the involvement of the doctor’s every time.


    There is always a need for such devices that can help people, and they should
    be user friendly so that people can use them on their own and not require any
    kind of help from the doctors and other people. There are such devices for the
    people suffering from hypertension and there is also new development done on improved
    devices.


    IoT-based blood pressure monitoring machines are available nowadays. The major
    function of these machines is to measure the systolic and diastolic pressure,
    which is basically used to measure the pressure in the arteries (Pickering, 2002).
    The oscillometric technique is used to measure the systolic and diastolic pressure
    in this machine. The data recorded by the machine are then stored to a connected
    database, through a connected Wi-Fi, which can be accessed remotely by anyone
    (Babbis, 2012). By, using this device, a patient can measure his/her blood pressure
    by themselves without requiring any kind of involvement of the doctors that can
    save a lot of manpower.


    The oscillometry technique is very common these days in the automatic blood pressure
    measuring devices. In order to measure blood pressure using the oscillometric
    technique, a cuff is placed on the upper arm of the patient and inflated to a
    pressure above the patient’s systolic pressure that causes the flow in the arteries
