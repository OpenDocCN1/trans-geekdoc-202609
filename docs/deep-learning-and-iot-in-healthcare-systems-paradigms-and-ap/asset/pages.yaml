    # 7.2.3 WIRELESS SENSOR NETWORKS


    A wireless sensor network is a self-configuring network of small sensor nodes
    that use radio signals to communicate among themselves and is deployed in quantity
    to understand, monitor, and sense the physical world. The key attributes of any
    remote sensor network include:


    +   - power consumption constraints for nodes using batteries or energy harvesting,

    - possibility to cope with node failures,

    - node''s mobility

    - nodes that are heterogeneous in nature,

    - scalability to large-scale deployment,

    - capability to operate in inverse environmental conditions,

    - simple to use, and

    - cross-layer design.


    The advantages of wireless sensor networks are as follows:


    +   - No fixed infrastructure is required for network setups.

    - These are useful for unreachable places such as rural areas, mountains, deep
    forests, etc.

    - There are flexible as if there is random situation where an additional workstation
    is needed.

    - The implementation price is low.

    - Very less wiring is required.

    - New devices can be accommodated at any stage.

    - These have flexibility when undergoing any physical partitions.

    - A centralized monitoring system is used for its access.


    The disadvantages of wireless sensor networks can be summarized as follows:


    +   - It is less secure with respect to the wired network.

    - It has low speed with respect to the wired network.

    - It has complex configuration with respect to the wired network.

    - It is easily influenced by noise.

    - The communication speed is low with respect to the wired network.

    - The cost is still high.'
