    # 5.1 INTRODUCTION


    Latest developments use the potential of remote communication technology using
    wireless systems to incorporate and synchronize information from various medical
    devices with the aid of Internet of things (IoT). IoT makes intelligent and smart
    devices that are recognized as the current technological revolution. As its archetypal
    case, IoT-based assistive devices are becoming popular to mitigate the issues
    associated with various devices (Fan et al., 2014). Ubiquitous wearable sensor
    network (WSN) technologies evaluate, infer, and recognize the indications from
    assistive devices, thus changing the techniques of healthcare systems with the
    help of IoT. The actuators and sensors unify impeccably and the collected information
    is shared across platforms to build a common operating picture (Gub et al., 2013).
    The IoT-based assistive devices capture the health data of patients and send them
    to respective clinical assistance. Many hospitals use IoT to locate patients and
    personnel devices.


    Assistive technology (AT) is a broad term that covers assistive, adaptive, and
    rehabilitative devices for people with some disabilities or elderly populations
    (Wilkie, 2010). People with any kind of disability face problems in performing
    the activities of daily life (ADLs) independently. ADLs include self-care activities
    such as mobility, bathing, eating, growing, etc. AT is a powerful tool through
    which people can perform the ADLs independently or without any assistance (Hoenig
    et al., 2003). For example, a wheelchair provides a disabled person with mobility.
    According to a survey by the World Health Organization (WHO), around 15% of the
    world population suffers from a certain kind of disability (Krah, 2011). Due to
    the advancement in the world, sedentary work has increased, which has led to more
    work and no exercise, which has significantly raised the problem of diabetes (majority
    type II). According to the WHO survey in 2014, around 422 million people were
    suffering from diabetes. WHO has claimed that7.2 million deaths are due to the
    increased blood pressure in the world (WHO, 2019). Due to AT, people with disabilities
    and other problems have an opportunity of more positive and easygoing lifestyle,
    with an increase in social participation, security, and control and reduced costs
    on the problems.'
