    # 4.2.3.1.1 Vision


    AT products for people who are blind (or visually impaired) assist them in their
    daily life activities including reading, accessing computers, walking on roads,
    and other needs as shown in the chart in Figure 4.6. Some examples are magnifiers
    that include physical or software application to enlarge the images or for a clear
