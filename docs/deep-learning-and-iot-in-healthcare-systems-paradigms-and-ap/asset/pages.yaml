    device for displaying Braille characters for people who cannot use a computer
    keyboard, and screen reading software called optical character recognition (OCR)
    that is text-to-speech recognition software.


    # 4.2.3.1.2 Hearing


    AT products for people who have hearing difficulties as deaf people assist them
    in their daily life activities including communication and other needs. Some examples
    are personal sound amplification products (PSAPs) that offer many hearing-aid
    benefits, simple vibrating alarm clocks, doorbells with flash lights, face-to-face
    dual keyboard communication systems, and amplified communication devices. People
    with hearing disabilities depend more on textual content and similarly on text-based
    assistive devices.


    # 4.2.3.1.3 Hearing Loop


    Also known as induction loop, it is a system that uses electromagnetic energy
    to transmit sound. It consists of four parts: a sound source such as a public'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'address system or a microphone or a telephone, an amplifier, a thin loop of
    wire that goes around the room, and a receiver worn in the ears as a headset (Figure
    4.7).


    ![](img/8e78e716c4c366f9e41f495059d443ec_128_0.png)


    Figure 4.7 Hearing loop.


    # 4.2.3.1.4 Working of a Hearing Loop


    A miniature wireless receiver, a hearing loop receiver directly built into hearing
    aids, picks up the amplified sound that travels through the loop and create an
    electromagnetic field. To pick up the signal, a listener must be wearing the receiver
    and must be within range of the loop. As the sound is picked up directly by the
    listener, the sound is much clearer, with background noise from the nearby environment
    (Coutinho et al., 2011).


    Amplified sound (American Speech-Language-Hearing Association, 2002) can also
    be transmitted through radio signals by FM systems. They can transmit signals
    up to 300 ft and can be used in public. Usually, these devices are used in classrooms
    or halls, where the instructor wears a small microphone connected to a transmitter
    and the listener wears a receiver. People wear a wire around the neck called a
    neckloop with a telecoil inside their hearing aid to convert the incoming signal
    into magnetic signals. As these signals can transmit through walls, the listeners
    should be tune to a different signal than those outside the room.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Assistive Devices and IoT in Healthcare Functions


    Infrared systems use infrared light to transmit sound signals (Figure 4.8). The
    transmitter converts sound signals into light signals and beams it to a receiver
    that is worn by a listener when they are decoded back to sound. As FM systems,
    people whose hearing aids have a telecoil may also wear a neckloop to convert
    the infrared signal into a magnetic signal (Fransen and others, 2006). Unlike
    induction loops or FM systems, the infrared signal cannot pass through walls,
    making it particularly useful in courtrooms where often confidential information
    is being discussed. Infrared systems cannot be used in areas with too many light
    sources (Izs, 2015).


    ![](img/8e78e716c4c366f9e41f495059d443ec_129_0.png)


