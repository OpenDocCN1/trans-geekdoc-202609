    # 5.3.1 ELECTROCHEMICAL SENSORS AND IMPEDANCE SENSORS


    pedance sensors and electrochemical sensors are the important classes of wearable
    sensors for monitoring physiological parameter measurements. Electrochemical sensors
    are further classified into aerometric, potentiometric, and conductive sensors
    that use capacitive and resistive methodology to fabricate different sensors.
    Capacitors are the building blocks of the electronic world. The ability of a capacitor
    to store an electrical charge is called as capacitance. Touch is the vital human
    sensory channel, and the technology used to respond to the physical touch is often
    called as capacitive sensing. A capacitive sensor provides low temperature dependence,
    high sensitivity, and low consumption, with the capacity of sensing various chemical
    and physical parameters. Different types of capacitive sensors are co-axial cylindrical,
    parallel-plate, fringing field, and cylindrical cross-capacitor sensors (Rowland
    et al., 2011). Capacitive sensors are suitable for both invasive and noninvasive
    parameter measurements. The fringing field of the capacitor has the ability to
    sense the texture, location, and strength of the samples (Dean et al., 2012).
    Electrochemical sensors are highly portable, highly sensitive, low cost, and useful
    in many hand-held analyzers that are based on electrolytes and metabolites.


    The working of the sensors starts with gathering input from targeted devices,
    and the inputs are classified into three different categories: the target input
    that is the actual input measured by the sensor, interfering input that refers
    to the sensitive input, and the modifying input that causes a change in the input–output
    relation of the sensor to the target and the interfering inputs. Based upon the
    characteristics, the wearable sensors are classified into static (e.g., body temperature)
    and dynamic sensors. The static sensors hold the characteristics of accuracy,
    sensitivity, threshold, resolution, tolerance,'
