    # 7.2.4 RFID: THE BEDROCK OF SMART HEALTHCARE


    A smart healthcare system is one in which data is collated at all important points,
    stored precisely, and retrieved whenever needed. This exercise shifts the attention
    for medical equipment and device management to patient care. This leads to healthier
    care services and improves the brand of the hospital. Another area of interest
    where radio-frequency identification (RFID) plays a vital role in healthcare system
    in hospitals during surgical procedures (Jackson, 2008).


    Three main components are involved in any RFID-based system: (1) an application
    host, which is used to interfacing of ID data from a reader using encoding and
    decoding into a personal computer or any server mainframe, (2) an RFID tag for
    storing the identification information or code, and (3) a tag reader or tag identifier
    for sending polling signals to an RFID transmitter responder to the tag identifier
    (Karmakar et al., 2008).


