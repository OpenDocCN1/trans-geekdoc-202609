    # 10.6 ENERGY-EFFICIENT ROUTING PROTOCOLS


    Energy efficiency in IoT-based healthcare networks is of utmost importance because
    of battery-constrained biosensor devices used in wireless BANs. Energy efficiency
    can be improved by various means such as adjusting physical parameters of communication
    technology, designing less consuming devices, and developing energy-efficient
    routing protocols. Routing protocols are mainly designed for data aggregation
    and many-to-one transmission. The adoption of energy conserving routing protocols
    by monitoring the energy levels of the nodes and balanced energy utilization approaches
    are the major challenging issue in low-power healthcare systems (Yating, 2019).


    In energy-efficient routing protocols, the route request (REQ) packet having energy
    data is transmitted in energy-efficient reliable path of the network. It is followed
    by receiving the control data (route reply (RREP) packet). This whole process
    is known as flooding. With an increase in flooding, the packet overhead also increases.
    This may lead to huge consumption of energy. Furthermore, there is a need to avoid
    overfitting situation for design of energy-efficient routing protocols (Sarlesh,
    2017a, b). Currently, there are several routing protocols that address not only
    the energy efficiency issue also the reliability and QoS issues. For example,
    prediction-based secure and reliable routing protocol offers reliable and secure
    routing as.


    In order to support the energy efficiency of the healthcare network, an IoT-based
    routing protocol should dynamically move from one step to another considering
    the power on/off state of the IoT device. It necessitates the monitoring and logging-in
    of the generation and consumption of energy through communication networks. In
    WBANS, sensor nodes have limited energy associated with its lifetime. They do
    not produce much heat as nodes are directly implanted in the human body. All paths
    are well defined for data routing and must be energy aware. The main issue concerned
    with energy-efficient routing protocols is the implementation of complex algorithms.
    There are several efficient routing routing protocols, but they do not consider
    on different aspects as delay tolerant, postural information, temperature rise,
    etc.'
  merge: -1
