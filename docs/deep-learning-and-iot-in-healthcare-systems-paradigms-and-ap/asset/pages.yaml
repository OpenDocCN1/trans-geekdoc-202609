    mechanisms. To overcome limitations of TDMA (wasted time slots) and CDMA (collision
    in case of heavy data traffic), other MAC protocols have been proposed. Energy
    FDM is one such protocol, which is based on CSMA and uses power control for better
    energy efficiency. However, this protocol was observed to suffer from high collision
    rate similar to CDMA. Hybrid protocols such as OPWUM have also been attempted
    with hybrid wake-up schemes at the receiver end to reduce energy consumption.
    The complex frame structure caused degradation in performance of the transmitter
