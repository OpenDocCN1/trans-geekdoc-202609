  md: '# 7.2.2 BICHEMICAL SENSORS


    The chemical or biological amount is converted into an electrical signal by using
    biochemical sensors. A biosensor incorporates a chemically sensitive layer, a
    transducer, a receptor (biocomponent), and an electronic signal processor (De
    la Guardia, 1995). The types of biochemical sensors are as follows:


    +   * oxygen sensor,

    * carbon dioxide sensor,

    * surface reaction measurement sensor,

    * flow sensor,

    * glucose detector,

    * concentration sensor,

    * pH sensor,

    * acidity sensor, and

    * scattering measurement sensor.


    # Basic Characteristics of Biosensors


    +   * Linearity—To determine high substrate concentrations, sensors should be
    highly linear.

    * Sensitivity—It represents the electrode response value with respect to the substrate
    concentration.

    * Selectivity—There must be minimum chemical interference for obtaining correct
    results.

    * Response time—It is the time required to achieve 95% of the response.


