    # ### 7.2.1 GAS SENSORS


    Gar sensors are one of the most popular sensors for healthcare system and come
    under the classification of chemical sensors, which are used to determine the
    concentration of gas in their surroundings. It is a good sensing sensor for environment
    monitoring applications such as air quality monitoring, gas leakage detection
    in hospitals or any places, breathe test for alcoholic persons, and electronics
    noise in medical science (Bogue, 2014; Lin et al., 2015). Optical, surface acoustic
    wave, catalytic, electrochemical, and semiconductor gas sensors are the different
    types of gas sensors. Gas sensors can be divided into two categories based on
    their sensing properties (Liu et al., 2012; Yamazoe and Shimano, 2002; Lee et
    al., 1996): first, on the basis of variations in electrical properties like MOS-based
    sensors, polymer-based sensors, carbon nanotube sensors (Thai, 2011), etc., and
    second, on the basis of variations in other properties (for example, optical sensors,
    calorimetric sensors, gas chromatographs, ultrasonic-based acoustic sensors, etc.)
    (Peticulescu et al., 2006).'
