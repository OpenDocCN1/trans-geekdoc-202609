    # 8.12 CONCLUSIONS


    The IoT has immense opportunity for the healthcare sector. Smart hospitals and
    healthcare sectors are the future of the healthcare providers. With the help of
    AI and IoT, the ICT can be implemented more accurately. It will reduce the medical
    cost, increase the quality of the treatment and care, and make a secure future
    with zero defects.


    As per the WHO, health is a state of complex physical, mental, and social wellbeing
    and not merely any absence of disease or infirmity. So, the application of the
    health is also multidimensional in nature. Not only the physical condition of
    the patient but also the social environment and the mental state of the patient
    are applicable in healthcare delivery system. The SERVQUAL model is used to identify
    the service gap to reinforced the quality control over the service. Services are
    mostly intangible in nature, thus health cannot be measured easily. The service
    gap in a healthcare delivery mostly creates for gap between expected and actual
    timing of the delivery of services. The delay in the processes may consider harmful
    the patient''s health as as managerial inefficiency. The hospital''s brand depends
    on several factors, and real-time prompt service is one of the most important
    aspects of it. The IoT can be used for queue management, where the patient can
    get timely services without delay in the queue. The online procedures of paper
    works, reports, and prescriptions can reduce the total walking time from department
    to department. Thus, this service gaps'
