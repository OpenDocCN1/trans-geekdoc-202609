  md: '# 5.11 SECURITY THREATS OF ASSISTIVE DEVICES


    The basic requirements for security and privacy in assistive devices are almost
    same as other wireless devices. This section addresses the various security threats
    of the assistive devices and their solutions. Physical attack is the attack on
    communication link or physical components of the assistive devices. Jamming is
    a process that blocks the wireless communication from the sources to destination
    with the help of a specialized device. Tampering of assistive devices is intended
    to access the sensitive information, and interfacing attack introduces unwanted
    signal and noise into the legitimate user''s radio frequency communication among
    assistive devices. Malicious node injection is intentionally adding malicious
    node to the edge of the IoT with the aim of altering the vital data. Physical
    damage is destroying the components of assistive device either partially or completely.
    Malicious code injection alters the controlling software and functional components
    of assistive devices. Sleeps-deprived attack exhausts the battery power of the
    assistive devices. Network attack is to exploit the networking capability of assistive
    devices in a communication network. Traffic analysis is to sniff the traffic flow
    of data in on the assistive devices by injecting vulnerability into the traffic.
    Denial of service floods the traffic network of the assistive devices in the network,
    and hence, the beneficiaries are not able to participate in the network communication.
    Message replying attack manipulates the user commands and executes the same to
    create malfunctioning of the devices. In Sybil attack, the authentication of the
    user is hacked and the security data are misused.


    # 5.12 CONCLUSION


    AT includes the system and services regarding the delivery of assistive services
    and products. AT is a valuable therapeutic instrument for people who need special
    care. This chapter demonstrates the need of assistive devices and the corresponding
    services related to their provision. Assistive health technologies help the people
    to live longer irrespective of their health conditions. People with disabilities
    are experiencing various obstacles which isolate them from participating in social
    and community activities. Assistive devices improve the lifestyle and functioning
    of people with vulnerabilities. For elderly people, assistive devices provide
    greater control over their lives.'
