    # ABSTRACT


    Fall is considered to be one of the major health problems for senior adults.

    According to a report published by World Health Organization, early fall

    detection is an active problem in the old age group people. The report showed

    at the falling problem affects 28%–35% of people around 65 years of age\and 32%–45%
    for those over 70 years. This domain has attracted the

    attention of researchers to search for an affordable and easy to use solution.

    This remained an open challenge as no uniformly acceptable solution could

    be provided so far. The scientists have proposed multiple solutions based on

    different approaches in providing a successful patient care system (PCS).


    In this chapter, we have tried to discuss the different state of the art meth-\ologies
    proposed by the researchers in recent time. This chapter is aimed to

    provide a brief idea about this research domain starting with very basic concepts.

    A prototype detection system developed by the authors are discussed in the

    latter part of the chapter that is useful to show one practical implementation

    such a system. This prototype, on the testbed, showed an accuracy of 94.45%.


    # 6.1 INTRODUCTION


    The expectancy of human life has increased greatly in the 21st century

    due to the revolution in medical science and medicine. People in their eighty'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'and nineties are not so uncommon today in many families. Some of them can perform
    their daily activities of their own and some are dependent on caregivers. According
    to a statistic by NCOA, USA, in four Americans aged 65+ falls each year. Every
    11 s, an older adult is treated in the emergency room for a fall; every 19 min,
    an older adult dies due to a fall. Falls are identified as the primary cause of
    leg injury and the utmost common reason of nonthal shock-related hospitalizations
    in senior citizens (Lim et al., 2014).


    As the joint families across the world are splitting, the working couples sometimes
    have no options but to let their parents take care by the caregivers. It is not
    always possible for the caregivers to accompany the aged persons, especially if
    they can move by themselves. So, a real-time fall monitoring (Bai et al., 2012)
    is required to monitor their movement. As the age-old people are generally reluctant
    as well as forgetful about the wearable sensors, so the monitoring should be done
    by a device that they will love to carry (El-Bendy et al., 2013). In the age of
    smartphone and social media, the lonely seniors spend most of their time with
    this device they will love to carry anywhere they move. So, a smartphone is chosen
    as a monitoring device to detect sudden fall that may occur, during their sleeping
    morning/evening walk (Hegde et al., 2013). This is the social direction of choice
    of smartphone as the monitoring device (Igual et al., 2013). The technical reason
    is that the smartphone is now considered as a sensor hub consisting of an accelerometer;
    a gyroscope; a global positioning system (GPS); a magnetometer; gravity, proximity,
    and light sensors; and more (Li et al., 2009).


    After the introduction of high-speed Internet in the beginning of 21st century,
    the definition of computing has changed rapidly. The concept of Internet of Things
    (IOT) has changed the definition of traditional client-server computing environment
    by integrating smart objects, sensors, computers, and computing components to
    extend the range and computing capacity beyond the local hardware limitations
    (Perera et al., 2013). Devices equipped with smart sensors and network connectivity
    (such as smartphones) now can be used in conjugation with IOT for effective fall
    detection over a wide movement area (Hegde et al., 2013).


    # 6.1.1 IoT BASICS AND IMPORTANCE


    The classical definition of IoT is "A system consisting of interconnected computing
    devices'
