    In past, conventional methods have identified numerous types of cancers such as
    breast cancer (azurowski et al., 2014), renal cell cancer (Karlo et al. 2014),
    and glblastoma based on the correlation between molecular subtype and prognosis.
    In contrast, similar work done by deep learning methods has shown promising results
    based on imaging (Akkus et al., 2017; Kforiatis et al., 2017; Li et al., 2017;
    Ning et al., 2018; Zhu et al., 2019).


    In 2017, a seminal article presents the identification of metastatic breast cancer
    deposits in lymph nodes (Ehtesami et al., 2017). In this article, 129 WSIs nodes''
    test has been used for prediction by 23 teams and has been compared with two benchmarks
    by human experts. In comparison to the pathologist, deep learning methods have
    shown their potential as comparable to pathologist level performance.


    In another study, CNN has been applied on 50 slides for different types of cancer
    to map the patterns of "tumor-infiltrating lymphocytes" and make a correlation
    with molecular subtypes and survival (Saltz et al., 2018). In the proposed work,
    a limited number of slides have been used to train the initial model iteratively.
    Further, pathologists have been used to correct the predictions of this model
    and feedback for the same has been used as an additional training sample. The
    whole process has been continued until a satisfactory result found. To ease the
    morphology-based research, this study provides a way to use the automated image
    processing in an efficient way that may not be possible if every slide needs clear
    annotation by pathologists.


    ImageNet is a CNN tool that has been used to solve the Large-Scale Visual Recognition
    Challenge with error rate close to the Bayes rate in 2012. This tool has combined
    sensitive parameters based huge heterogeneous medical data sets of health informatics
    and predicts accurate decision result (Krizhevsky et al., 2012).


    Figure 3.4 shows how CNN uses pathological images for cancer prediction. During
    the training phase, the role of the pathologist is to select the interesting regions
    on available slide images. These images are cropped into small slices and used
    for CNN as for training purposes. Then backpropagation is applied for adjusting
    the model parameters to generate a prediction on a slice of images. In the testing
    phase, thresholding has been used to identify the regions of tissue on the slides
    which are already used by trained CNN. Prediction on each slide is generated by
    the model and finally all predictions are aggregated to form a slide level prediction.'
