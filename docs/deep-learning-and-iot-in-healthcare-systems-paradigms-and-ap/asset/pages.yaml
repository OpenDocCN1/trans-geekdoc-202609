  md: '# Healthcare Applications of the Internet of Things (IoT) 233


    leisure tour. Outside ambience, luxury rooms and facility can help to retain patient
    for a certain level. But now, IoT plays a big role in a modern hospital.


    # 8.10.1 RECEPTION


    The IoT facility is first observed in the reception area. Patient may get a number
    for queue and wait in the waiting hall unless his or her comes. Smart queue management
    is the key to satisfy the patient in this window of hospital. Patient may use
    smart card, provided by the hospital to retrieve the patient data easily, apart
    from patient ID and hospital information system. The smart card may be tagged
    with RFID or other technology to track the patient inside the hospital to help
    him or for correct sequence of OPD, diagnosis, and other tests. The online prescription
    provided by the doctor may directly indicate in the pharmacy so that they can
    prepare the medication before the patient arrived to them.


    # 8.10.2 INPATIENT AREA


    When a patient takes admission, the tagging of the patient with bar code or other
    tracers will be done. It will help to trace the patient for security purpose,
    and for identification of the patient to remove the error chance of treatment.
    This will prevent the duplicity of diagnosis, decrease the time of the transportation
    of the patient in between departments. Diagnostic center can retrieve the patient''s
    file first and arrange the queue depending on it. The queue systems automatically
    rearranged and displayed the emergency patient''s entry into the area, so the
    other waiting patients cannot be confused and claim to find the reason.


    # 8.10.3 HOSPITAL INFORMATION SYSTEM


    This intelligent system will track all the department associated with hospital
    like inpatient area, pharmacy, billing, finance, HR, manage, doctors, nurses records,
    store, and so on. All the patients'' medical records and prescription will be
    uploaded to the system. So that all the reports of diagnosis, doctors'' prescription
    and suggestion, nurses works, pharmacy indents, bill of the patients, vital statistics
    of the patients can be traced live. Doctor can monitor the condition of the patient
    and can update about any medication.'
