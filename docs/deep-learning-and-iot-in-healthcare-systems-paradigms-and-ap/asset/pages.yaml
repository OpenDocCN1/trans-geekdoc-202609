    Decision tree: A decision tree is a graph that uses a branching method to illustrate
    every possible outcome of a decision. It assigns monetary/time or other values
    to possible outcomes that can be automated.


    Neural network: A neural network, for the most part, includes an enormous number
    of processors working in parallel and mastered in levels. The main level creates
    the crude data—practically equivalent to optic nerves in human visual handling.
    Each progressive level gives the yield from the level going before it, instead
    of from the info—silarly neurons further from the optic nerve get signals from
    those near to it. The last level creates the yield of the framework.


    Naive Bayes: Na Bayes classifier is an algorithm that uses Bayes'' theorem to
    classify objects. Naive Bayes classifiers assume strong, or naive, independence
    between attributes of data points. Popular uses of Naive Bayes classifiers include
    spam filters, text analysis, and medical diagnosis. These classifiers are widely
    used for machine learning because they are simple to implement.


