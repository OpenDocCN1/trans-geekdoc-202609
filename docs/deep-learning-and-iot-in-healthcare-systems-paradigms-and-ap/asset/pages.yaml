    # 11.2.1 HOW ARE ALPHA BRAINWAVES USED IN OUR RESEARCH?


    In case of ASD, people with ASD have observed to have diminishing alpha electric
    waves in brain areas, which are related to motor movement and senses. This might
    explain why people with ASD have some difficulties in performing tasks for what
    they are instructed about. Alpha waves may be proven to be helpful in keeping
    subjects with ASD calm, aware, and relaxed.


    Beta: Beta brainwaves vary from 13 to 20 Hz (see Table 11.1 and Figure 11.1).
    Beta electric waves in brain neurons are the highest frequency brainwaves, which
    are generated when we feel attentive, focused, and have high intensity of alertness.
    Lack of brainwaves is often related to the problem of attention level, the person
    faces difficulty in carrying out a task for a longer consecutive period of time,
    disability in learning, and injured brain cells. The brain mapping of ASD patients
    has also been exposed to the fact that patients have both fast and slow brainwave
    activity in the frontal lobe of the brain, which might suggest lack of interconnection
    between the frontal lobe and the back area of the brain neurons.


    # 11.2.2 HOW ARE BETA BRAINWAVES USED IN OUR RESEARCH?


    Beta blockers: These are the medicines that are practiced to block one''s beta
