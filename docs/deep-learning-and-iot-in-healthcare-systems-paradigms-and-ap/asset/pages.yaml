  md: '# Case Studies: Healthcare and Deep Learning


    # 3.4 LITERATURE SURVEY


    This survey includes systematic review of the practical implementation of deep
    learning techniques in healthcare system. Different applications of deep learning
    in medical diagnosis and drug discovery have been considered for this survey.
    A wide variety of research publications have been taken to ensure the quality
    of the work. Table 3.1 shows the brief review of research articles of deep learning
    techniques in medical detection and diagnosis.


    # 3.5 CASE STUDY


    Deep learning is a new branch of ML, which based on unsupervised learning and
    using deep ANNs to study a specific pattern for mapping input to output. Unsupervised
    learning works just like a newborn baby which does not have any knowledge about
    its surroundings, but with instincts, he learned lots of things (Cruz and Wishart,
    2006; Ceccchetti, 1992).


    From origin, deep learning has been applied to many problems to resolve the challenges
    of ML algorithms successfully especially in the case of healthcare (Cochran, 1997;
    Kononenko, 2001; Park et al., 2013; Sun et al., 2006).


    In different critical diseases, deep learning is providing promising results as
    compared to other conventional ML algorithms. In this section, case study on three
    severe diseases such as cancer, diabetes, and Alzheimer has been covered.


    # 3.5.1 CASE STUDY: CANCER


    In recent years tremendous growth in cancer patient near to 14 million around
    the world has been found and they face uncertainty for their life. So, the accurate
    and real-time information about the cancer is highly recommended to take the necessary
    action by the clinicians. In some cases, disease identification is fruitful for
    the medical professionals to provide the right remedy to the patient on time while
    most of cases without correct estimation of the disease may cause of serious illness
    or death.


    Some pathological results have been found more accurate in cancer prediction.
    But as per the report of Oslo University Hospital, it provides only 60% accuracy
    in the prognosis of cancer that is a part of the biopsy'
  merge: -1
  img_proc: true
