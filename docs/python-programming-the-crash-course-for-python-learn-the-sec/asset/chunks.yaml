    # Chapter 8: Decision Trees and Random Forests in Machine Learning


    The next kind of machine learning algorithm that we are going to look at are going
    to include the decision tree and the random forest. These work together because
    a bunch of decision trees can make up a random forest. These are great tools to
    use when you need to see which decision is the best for your company, and you
    want to compare and contrast the different decisions that you are able to make.


    Let’s first explore a bit more what these decision trees are all about, and then
    we can dive into some more about how they work together to make up a random forest.


    To start with, the decision tree is going to be a good tool for data and can be
    efficient if you would like to take a look at more than one choice, and you know
    the choices are going to be completely different. You can gather up information
    on both choices and put them into the decision tree to help make the right decision
    to improve and even to grow your business.


    When the different options are presented through the decision tree to you, you
    can use this to see what the potential outcomes of each decision will be in the
    future. This makes it much easier to make accurate and smart decisions and can
    help with predictions in the future as well.


    As a programmer or even a business owner who wants to use this kind of algorithm,
    there are a few options when it comes to how you would work with these decision
    trees. Many of those who are using it are going to use it to help with random
    or categorical variables. In many cases though, machine learning is going to want
    you to make these trees as a classification problem.


    To help you double check that any decision tree you are making ends up being a
    good one, you will need to be able to take up all of the sets of data that you
    want to work with, and then you need to be able to split them up between two,
    and often more, sets with similar data being found in each of the sets. These
    can then be sorted out with the help of the independent variables that you can
    choose from, simply because this ensures that each set is distinguished and set
    out from all the others.


    So, now that we have gotten to this part, it brings up the idea that this can
    be something that is hard to work on. In order to make sure that the decision
    tree is going to work the way that you would like, or to at least see how it is
    going to behave when you try to use it, let’s look at a good example of this.


    In this one, we are going to have a group with 60 people inside of it. With these
    people, all of them are going to have three independent variables. These variables
    are going to include the height of the person, their gender, and what class they
    are in. Then, when it is time to look at the students who are in that group, you
    will be able to find out that half of them like to play soccer as well.


    Using the independent variables that you were presented above, your goal is to
    figure out which half of the students like to play soccer, and which ones do not
    like to play this sport.


    Going from the information that you have about which kinds of students are the
    most likely to enjoy playing soccer, you decide that it is time to create a model
    to help you look at that group of 60 people and decide which 30 out of them like
    the game of soccer, and which 30 are going to spend their time playing or doing
    something else.


    To make this one work, the model needs to be able to go through all of the students
    who are in the group, or all of the people in your group, and then divide them
    up into two groups. You need to have a group that is going to be the ones that
    are going to love playing soccer, and the ones that don’t. And you want to make
    sure that the model is as accurate as possible.


    There are some other possibilities that you can work with that work well with
    the decision tree. These algorithms are useful because it is going to help you
    to split up all of the data that you have, providing a few different subsets that
    are going to give you good outcomes that are the most homogenous, and will ensure
    that all of the decisions that you make based on this information is as accurate
    as possible.


    Remember here that you can have more if the situation needs it, but for the example
    that we are doing here, you will only want to work with two subgroups and no more.


    You may find that there are a lot of times when a business or another company
    will need to go through some data that is complex and they want to use this information
    to make decisions and figure out what actions they should take. A decision tree
    is going to help them to get this done and to provide them with the data they
    need in an efficient and helpful manner.


    In the past before working with some of the various machine learning algorithms,
    like decision trees, a business owner would need to work with their own intuition
    in order to make their decisions. But the world is much more complex now, and
    there is a ton of extra information that is out there that is hard to sort through
    on your own. Relying on some of these algorithms and systems to help you to make
    your decisions, rather than just guessing and risking a lot of time and money
    can make a big difference.


    ## Moving to the Random Forest


    Now that we have had some time to explore what the decision tree is all about,
    it is time to move on to another step of looking at the random forest. There are
    times when just one single decision tree is going to be enough to help you make
    some decisions for your needs. But sometimes, you need to compare a lot of different
    options and you are going to need to work with a group of decision trees, which
    will make up your own random forest.


    These random forests are going to be a popular option to work with when we talk
    about machine learning. So, if you plan to work with decision trees on machine
    learning quite a bit, then it is also important to learn how to work with the
    random forests as well.


    Since the random forest algorithm is so popular with a lot of programmers, it
    is not going to be hard for you to see that it could potentially help you with
    a lot of different types of problems. For example, if you are looking to work
    with some tasks that can look through and explore the data that you have, and
    deal with values that are missing, or you would like to deal with some of the
    outliers that show up in the data that is there.


    There are a lot of times when you are going to be able to use the random forest
    to help with various parts of machine learning. The random forest is going to
    be the best way to provide you with results out of complex or large amounts of
    data. And often this algorithm is going to be able to do a much better job than
    what you may see with some of the other algorithms that we will talk about in
    this guidebook.


    With this in mind, some of the advantages that you can get for working with random
    forests include:


    *   When you are working on your own training sets, you will find that all of
    the objects that are inside a set will be generated randomly, and it can be replaced
    if your random tree thinks that this is necessary and better for your needs.


    *   If there are M input variable amounts, then m<M is going to be specified from
    the beginning, and it will be held as a constant. The reason that this is so important
    because it means that each tree that you have is randomly picked from their own
    variable using M.


    *   The goal of each of your random trees will be to find the split that is the
    best for the variable m.


    *   As the tree grows, all of these trees are going to keep getting as big as
    they possibly can. Remember that these random trees are not going to prune themselves.

    '
