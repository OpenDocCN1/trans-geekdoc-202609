- raw: "The K-means clustering The next algorithm that we are going to spend some\
    \ time looking at is known as the k-means clustering. This is a basic idea that\
    \ is found with a lot of different kinds of algorithms in this topic, but this\
    \ is one of the easiest, and most common, forms of clustering that you are able\
    \ to work with. It is also a good example of unsupervised machine learning as\
    \ well. It is going to be applied in most cases when the data that you have doesn’t\
    \ come with labels that are on it. The goal of working with this algorithm to\
    \ ensure that you can see the clusters or the groups that are found inside your\
    \ data. The whole point of these clusters is that the objects that are found in\
    \ the same cluster are going to be closely related to the other points that fall\
    \ into that same cluster. In addition, these points are not going to have as many\
    \ similarities to the items that are found in any other cluster that you set up.\
    \ The similarity here is going to be a metric used to see how strong the relationship\
    \ between the objects are in the set of data. There are a variety of times when\
    \ you would use this kind of clustering, but one example is when you are doing\
    \ the process of data mining, especially if the data mining is more exploratory.\
    \ It could also have uses in other kinds of fields, including some that have to\
    \ go with compressing data, image analysis, computer graphics, pattern recognition,\
    \ and machine learning to list out a few. When you use this kind of algorithm,\
    \ it is going to help you to form up some of the data clusters that you need,\
    \ based on the values that come with your data. As a programmer, it is then your\
    \ job to go through and specify out what you want the value of k to end up being.\
    \ This means that you need to determine how many clusters you would like the algorithm\
    \ to make out of the data. The algorithm is then going to take the value of K\
    \ and use it to select the centroid value for all of the clusters that you are\
    \ working with. When the steps above are done, it is then time for the k-means\
    \ algorithm to go through and complete three more steps. These steps are going\
    \ to include: \n\n1.  You will want to start with the Euclidian distance between\
    \ each data instance and the centroids for all of the clusters. \n\n2.  Assign\
    \ the instances of data to the cluster of centroid with the nearest distance possible.\
    \ \n\n3.  Calculate the new centroid values, depending on what the mean values\
    \ of the coordinates of the data instances from the corresponding cluster. \n\n\
    Writing out the formula for K-means clustering So the first step that we will\
    \ need to do is to calculate the cluster responsibilities. The formula we will\
    \ use is the following: r(kn) = exp\\[ -b \\* d(m(k), x(n)) \\] / sum\\[j=1..K\\\
    ] { exp\\[ -b \\* d(m(j), x(n)) \\] } From here, you can see that the r(k,n) is\
    \ going to work out as a fraction, some number that is in between 0 and 1, where\
    \ you can interpret the hard k-means or the regular k-means to be the case where\
    \ r(k,n) is always exactly equal to 0 or 1. The d(\\*,\\*) can be any valid distance\
    \ metric, but the Euclidean or squared Euclidean distances are the ones that are\
    \ used the most. Then for the second step, we are going to work on a formula that\
    \ is similar to the hard k-means, but we are just recalculating the means based\
    \ on the responsibilities that we want to sent with it. The algorithm that we\
    \ are going to use for this includes: m(k) = sum\\[n=1..N\\] { r(k,n)\\* x(n)\
    \ \\] / sum\\[n-1..N\\] { r(k,n) } so, when you take the time to look at this\
    \ algorithm above, you are going to see that it is similar to the weighted mean.\
    \ This is going to show you that if the r(k,n) is higher, then the mean is going\
    \ to be more important to the cluster of k. When you see this, it is going to\
    \ show that this is going to have the biggest influence on the calculation of\
    \ the mean. But if the mean is higher when you look at the algorithm, you will\
    \ know that the opposite is true. Now, with some of the information in order that\
    \ we have discussed already, it is time to look at some of the coding that is\
    \ needed in order to create one of our own K-Means clustering algorithms, and\
    \ how to add in some of the soft k-means to any code that you would like to work\
    \ with. Some of the coding that you need to make this happen includes: import\
    \ numpy as np import matplotlib.pyplot as plt def d(u, v): diff = u - v return\
    \ diff.dot(diff) def cost(X, R, M): cost = 0 for k in xrange(len(M)): for n in\
    \ xrange(len(X)): cost += R\\[n,k\\]\\*d(M\\[k\\], X\\[n\\]) return cost After\
    \ this part, we are going to take the time to define your function so that it\
    \ is able to run the k-means algorithm before plotting the result. This is going\
    \ to end up with a scatterplot where the color will represent how much of the\
    \ membership is inside of a particular cluster. We would do that with the following\
    \ code. def plot\\_k\\_means(X, K, max\\_iter=20, beta=1.0): N, D = X.shape M\
    \ = np.zeros((K, D)) R = np.ones((N, K)) / K \\# initialize M to random for k\
    \ in xrange(K): M\\[k\\] = X\\[np.random.choice(N)\\] grid\\_width = 5 grid\\\
    _height = max\\_iter / grid\\_width random\\_colors = np.random.random((K, 3))\
    \ plt.figure() costs = np.zeros(max\\_iter) for i in xrange(max\\_iter): \\# moved\
    \ the plot inside the for loop colors = R.dot(random\\_colors) plt.subplot(grid\\\
    _width, grid\\_height, i+1) plt.scatter(X\\[:,0\\], X\\[:,1\\], c=colors) \\#\
    \ step 1: determine assignments / resposibilities \\# is this inefficient? for\
    \ k in xrange(K): for n in xrange(N): R\\[n,k\\] = np.exp(-beta\\*d(M\\[k\\],\
    \ X\\[n\\])) / np.sum( np.exp(-beta\\*d(M\\[j\\], X\\[n\\])) for j in xrange(K)\
    \ ) \\# step 2: recalculate means for k in xrange(K): M\\[k\\] = R\\[:,k\\].dot(X)\
    \ / R\\[:,k\\].sum() costs\\[i\\] = cost(X, R, M) if i > 0: if np.abs(costs\\\
    [i\\] - costs\\[i-1\\]) < 10e-5: break plt.show() def main(): \\# assume 3 means\
    \ D = 2 # so we can visualize it more easily s = 4 # separation so we can control\
    \ how far apart the means are mu1 = np.array(\\[0, 0\\]) mu2 = np.array(\\[s,\
    \ s\\]) mu3 = np.array(\\[0, s\\]) N = 900 # number of samples X = np.zeros((N,\
    \ D)) X\\[:300, :\\] = np.random.randn(300, D) + mu1 X\\[300:600, :\\] = np.random.randn(300,\
    \ D) + mu2 X\\[600:, :\\] = np.random.randn(300, D) + mu3 \\# what does it look\
    \ like without clustering? plt.scatter(X\\[:,0\\], X\\[:,1\\]) plt.show() K =\
    \ 3 # luckily, we already know this plot\\_k\\_means(X, K) \\# K = 5 # what happens\
    \ if we choose a \"bad\" K? \\# plot\\_k\\_means(X, K, max\\_iter=30) \\# K =\
    \ 5 # what happens if we change beta? \\# plot\\_k\\_means(X, K, max\\_iter=30,\
    \ beta=0.3) if \\_\\_name\\_\\_ == '\\_\\_main\\_\\_': main() Clustering algorithms\
    \ can be really useful when it comes to working with machine learning and some\
    \ of the other choices that come with computer sciences, and the k-means clustering\
    \ is a great way to gain some experience with doing all of this and ensuring that\
    \ you are going to get everything matched up and working the way that you would\
    \ like. Make sure to learn some of the equations above, and some of the benefits\
    \ of these carious algorithms, so that you can use them for your computing needs\
    \ when necessary. "
  fmt: "\n# K-means 聚类算法\n\n## 算法概述\n\nK-means 聚类是我们接下来要花时间研究的下一个算法。这是一个在该主题下许多不同类型的算法中都能找到的基本概念，但它是你能够使用的最简单、最常见的聚类形式之一。它也是无监督机器学习的一个很好示例。在大多数情况下，当你拥有的数据没有附带标签时，都会应用该算法。使用该算法的目标是确保你能够看到数据中发现的聚类或分组。这些聚类的整个要点在于，同一聚类中发现的对象将与落入该同一聚类的其他点密切相关。此外，这些点与你设置的任何其他聚类中发现的项目之间的相似性将不会那么多。这里的相似性将是一个用于查看数据集中对象之间关系强度的度量。有多种情况下你会使用这种聚类，但一个例子是当你进行数据挖掘过程时，尤其是当数据挖掘更具探索性时。它还可以用于其他一些领域，包括数据压缩、图像分析、计算机图形学、模式识别和机器学习等。当你使用这种算法时，它将帮助你根据数据带来的值形成一些所需的数据聚类。作为程序员，你的工作是指定\
    \ `k` 的值最终应该是多少。这意味着你需要确定你希望算法从数据中生成多少个聚类。然后，算法将取 `K` 的值，并用它来选择你正在处理的所有聚类的质心值。当上述步骤完成后，k-means\
    \ 算法就需要完成三个额外步骤。这些步骤将包括：\n\n1. 你需要从每个数据实例到所有聚类的质心开始计算欧几里得距离。\n\n2. 将数据实例分配到距离最近的质心所在的聚类中。\n\
    \n3. 根据对应聚类中数据实例坐标的均值计算新的质心值。\n\n## K-means 聚类公式\n\n编写 K-means 聚类公式时，我们需要做的第一步是计算聚类责任度。我们将使用的公式如下：\n\
    \n`r(kn) = exp[-b * d(m(k), x(n))] / sum[j=1..K] { exp[-b * d(m(j), x(n))] }`\n\
    \n从这里，你可以看到 `r(k,n)` 将作为一个分数，一个介于 0 和 1 之间的数字，你可以将硬 k-means 或常规 k-means 解释为 `r(k,n)`\
    \ 始终正好等于 0 或 1 的情况。`d(*,*)` 可以是任何有效的距离度量，但欧几里得距离或平方欧几里得距离是使用最多的。然后，对于第二步，我们将处理一个与硬\
    \ k-means 相似的公式，但我们只是根据我们想要发送的责任重新计算均值。我们将用于此的算法包括：\n\n`m(k) = sum[n=1..N] { r(k,n)*\
    \ x(n) ] / sum[n-1..N] { r(k,n) }`\n\n因此，当你花时间查看上面的算法时，你会发现它类似于加权平均值。这将向你展示，如果\
    \ `r(k,n)` 更高，那么均值对于 `k` 的聚类将更重要。当你看到这一点时，它将表明这将对均值的计算产生最大影响。但是，如果你查看算法时均值更高，你就会知道相反的情况成立。\n\
    \n## 代码实现\n\n现在，有了我们已经讨论过的一些信息，是时候看看创建我们自己的 K-Means 聚类算法所需的一些代码，以及如何将软 k-means\
    \ 添加到你想要使用的任何代码中。实现此功能所需的一些代码包括：\n\n```python\nimport numpy as np\nimport matplotlib.pyplot\
    \ as plt\n\ndef d(u, v):\n    diff = u - v\n    return diff.dot(diff)\n\ndef cost(X,\
    \ R, M):\n    cost = 0\n    for k in xrange(len(M)):\n        for n in xrange(len(X)):\n\
    \            cost += R[n,k]*d(M[k], X[n])\n    return cost\n```\n\n在这一部分之后，我们将花时间定义你的函数，以便它能够在绘制结果之前运行\
    \ k-means 算法。这将最终得到一个散点图，其中颜色将代表特定聚类中的成员程度。我们将使用以下代码来实现：\n\n```python\ndef plot_k_means(X,\
    \ K, max_iter=20, beta=1.0):\n    N, D = X.shape\n    M = np.zeros((K, D))\n \
    \   R = np.ones((N, K)) / K\n    # initialize M to random\n    for k in xrange(K):\n\
    \        M[k] = X[np.random.choice(N)]\n    grid_width = 5\n    grid_height =\
    \ max_iter / grid_width\n    random_colors = np.random.random((K, 3))\n    plt.figure()\n\
    \    costs = np.zeros(max_iter)\n    for i in xrange(max_iter):\n        # moved\
    \ the plot inside the for loop\n        colors = R.dot(random_colors)\n      \
    \  plt.subplot(grid_width, grid_height, i+1)\n        plt.scatter(X[:,0], X[:,1],\
    \ c=colors)\n        # step 1: determine assignments / resposibilities\n     \
    \   # is this inefficient?\n        for k in xrange(K):\n            for n in\
    \ xrange(N):\n                R[n,k] = np.exp(-beta*d(M[k], X[n])) / np.sum(\n\
    \                    np.exp(-beta*d(M[j], X[n])) for j in xrange(K)\n        \
    \        )\n        # step 2: recalculate means\n        for k in xrange(K):\n\
    \            M[k] = R[:,k].dot(X) / R[:,k].sum()\n        costs[i] = cost(X, R,\
    \ M)\n        if i > 0:\n            if np.abs(costs[i] - costs[i-1]) < 10e-5:\n\
    \                break\n    plt.show()\n\ndef main():\n    # assume 3 means\n\
    \    D = 2 # so we can visualize it more easily\n    s = 4 # separation so we\
    \ can control how far apart the means are\n    mu1 = np.array([0, 0])\n    mu2\
    \ = np.array([s, s])\n    mu3 = np.array([0, s])\n    N = 900 # number of samples\n\
    \    X = np.zeros((N, D))\n    X[:300, :] = np.random.randn(300, D) + mu1\n  \
    \  X[300:600, :] = np.random.randn(300, D) + mu2\n    X[600:, :] = np.random.randn(300,\
    \ D) + mu3\n    # what does it look like without clustering?\n    plt.scatter(X[:,0],\
    \ X[:,1])\n    plt.show()\n    K = 3 # luckily, we already know this\n    plot_k_means(X,\
    \ K)\n    # K = 5 # what happens if we choose a \"bad\" K?\n    # plot_k_means(X,\
    \ K, max_iter=30)\n    # K = 5 # what happens if we change beta?\n    # plot_k_means(X,\
    \ K, max_iter=30, beta=0.3)\n\nif __name__ == '__main__':\n    main()\n```\n\n\
    聚类算法在处理机器学习和计算机科学中的其他一些选择时可能非常有用，而 k-means 聚类是获得这方面经验并确保一切都能按你希望的方式匹配和工作的绝佳方式。请务必学习上面的一些方程式，以及这些各种算法的一些好处，以便在必要时可以将它们用于你的计算需求。\n"
  trans: "\n\n# K-means 聚类算法\n\n## 算法概述\n\nK-means 聚类是我们接下来要花时间研究的下一个算法。这是一个在该主题下许多不同类型的算法中都能找到的基本概念，但它是你能够使用的最简单、最常见的聚类形式之一。它也是无监督机器学习的一个很好示例。在大多数情况下，当你拥有的数据没有附带标签时，都会应用该算法。使用该算法的目标是确保你能够看到数据中发现的聚类或分组。这些聚类的整个要点在于，同一聚类中发现的对象将与落入该同一聚类的其他点密切相关。此外，这些点与你设置的任何其他聚类中发现的项目之间的相似性将不会那么多。这里的相似性将是一个用于查看数据集中对象之间关系强度的度量。有多种情况下你会使用这种聚类，但一个例子是当你进行数据挖掘过程时，尤其是当数据挖掘更具探索性时。它还可以用于其他一些领域，包括数据压缩、图像分析、计算机图形学、模式识别和机器学习等。当你使用这种算法时，它将帮助你根据数据带来的值形成一些所需的数据聚类。作为程序员，你的工作是指定\
    \ `k` 的值最终应该是多少。这意味着你需要确定你希望算法从数据中生成多少个聚类。然后，算法将取 `K` 的值，并用它来选择你正在处理的所有聚类的质心值。当上述步骤完成后，k-means\
    \ 算法就需要完成三个额外步骤。这些步骤将包括：\n\n1. 你需要从每个数据实例到所有聚类的质心开始计算欧几里得距离。\n\n2. 将数据实例分配到距离最近的质心所在的聚类中。\n\
    \n3. 根据对应聚类中数据实例坐标的均值计算新的质心值。\n\n## K-means 聚类公式\n\n编写 K-means 聚类公式时，我们需要做的第一步是计算聚类责任度。我们将使用的公式如下：\n\
    \n`r(kn) = exp[-b * d(m(k), x(n))] / sum[j=1..K] { exp[-b * d(m(j), x(n))] }`\n\
    \n从这里，你可以看到 `r(k,n)` 将作为一个分数，一个介于 0 和 1 之间的数字，你可以将硬 k-means 或常规 k-means 解释为 `r(k,n)`\
    \ 始终正好等于 0 或 1 的情况。`d(*,*)` 可以是任何有效的距离度量，但欧几里得距离或平方欧几里得距离是使用最多的。然后，对于第二步，我们将处理一个与硬\
    \ k-means 相似的公式，但我们只是根据我们想要发送的责任重新计算均值。我们将用于此的算法包括：\n\n`m(k) = sum[n=1..N] { r(k,n)*\
    \ x(n) ] / sum[n-1..N] { r(k,n) }`\n\n因此，当你花时间查看上面的算法时，你会发现它类似于加权平均值。这将向你展示，如果\
    \ `r(k,n)` 更高，那么均值对于 `k` 的聚类将更重要。当你看到这一点时，它将表明这将对均值的计算产生最大影响。但是，如果你查看算法时均值更高，你就会知道相反的情况成立。\n\
    \n## 代码实现\n\n现在，有了我们已经讨论过的一些信息，是时候看看创建我们自己的 K-Means 聚类算法所需的一些代码，以及如何将软 k-means\
    \ 添加到你想要使用的任何代码中。实现此功能所需的一些代码包括：\n\n```python\nimport numpy as np\nimport matplotlib.pyplot\
    \ as plt\n\ndef d(u, v):\n    diff = u - v\n    return diff.dot(diff)\n\ndef cost(X,\
    \ R, M):\n    cost = 0\n    for k in xrange(len(M)):\n        for n in xrange(len(X)):\n\
    \            cost += R[n,k]*d(M[k], X[n])\n    return cost\n```\n\n在这一部分之后，我们将花时间定义你的函数，以便它能够在绘制结果之前运行\
    \ k-means 算法。这将最终得到一个散点图，其中颜色将代表特定聚类中的成员程度。我们将使用以下代码来实现：\n\n```python\ndef plot_k_means(X,\
    \ K, max_iter=20, beta=1.0):\n    N, D = X.shape\n    M = np.zeros((K, D))\n \
    \   R = np.ones((N, K)) / K\n    # initialize M to random\n    for k in xrange(K):\n\
    \        M[k] = X[np.random.choice(N)]\n    grid_width = 5\n    grid_height =\
    \ max_iter / grid_width\n    random_colors = np.random.random((K, 3))\n    plt.figure()\n\
    \    costs = np.zeros(max_iter)\n    for i in xrange(max_iter):\n        # moved\
    \ the plot inside the for loop\n        colors = R.dot(random_colors)\n      \
    \  plt.subplot(grid_width, grid_height, i+1)\n        plt.scatter(X[:,0], X[:,1],\
    \ c=colors)\n        # step 1: determine assignments / resposibilities\n     \
    \   # is this inefficient?\n        for k in xrange(K):\n            for n in\
    \ xrange(N):\n                R[n,k] = np.exp(-beta*d(M[k], X[n])) / np.sum(\n\
    \                    np.exp(-beta*d(M[j], X[n])) for j in xrange(K)\n        \
    \        )\n        # step 2: recalculate means\n        for k in xrange(K):\n\
    \            M[k] = R[:,k].dot(X) / R[:,k].sum()\n        costs[i] = cost(X, R,\
    \ M)\n        if i > 0:\n            if np.abs(costs[i] - costs[i-1]) < 10e-5:\n\
    \                break\n    plt.show()\n\ndef main():\n    # assume 3 means\n\
    \    D = 2 # so we can visualize it more easily\n    s = 4 # separation so we\
    \ can control how far apart the means are\n    mu1 = np.array([0, 0])\n    mu2\
    \ = np.array([s, s])\n    mu3 = np.array([0, s])\n    N = 900 # number of samples\n\
    \    X = np.zeros((N, D))\n    X[:300, :] = np.random.randn(300, D) + mu1\n  \
    \  X[300:600, :] = np.random.randn(300, D) + mu2\n    X[600:, :] = np.random.randn(300,\
    \ D) + mu3\n    # what does it look like without clustering?\n    plt.scatter(X[:,0],\
    \ X[:,1])\n    plt.show()\n    K = 3 # luckily, we already know this\n    plot_k_means(X,\
    \ K)\n    # K = 5 # what happens if we choose a \"bad\" K?\n    # plot_k_means(X,\
    \ K, max_iter=30)\n    # K = 5 # what happens if we change beta?\n    # plot_k_means(X,\
    \ K, max_iter=30, beta=0.3)\n\nif __name__ == '__main__':\n    main()\n```\n\n\
    聚类算法在处理机器学习和计算机科学中的其他一些选择时可能非常有用，而 k-means 聚类是获得这方面经验并确保一切都能按你希望的方式匹配和工作的绝佳方式。请务必学习上面的一些方程式，以及这些各种算法的一些好处，以便在必要时可以将它们用于你的计算需求。\n\
    \n"
