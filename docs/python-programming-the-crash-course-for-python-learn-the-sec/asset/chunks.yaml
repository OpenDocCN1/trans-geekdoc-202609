    库进行一些出色的机器学习工作。现在是时候看看我们能通过 TensorFlow 库使用线性分类器进行的一些实际工作了。我们将以使用人口普查数据为例来演示。我们进行这些步骤的目的是确保你在人口普查数据集中使用一个变量，以便我们可以查看参与者，并对他们赚取多少收入进行预测。请注意，收入将成为本示例中的二进制变量。为了使此示例工作，我们将二进制变量设置为
    1，当个人年收入高于 $50,000 时。但如果参与者的年收入低于 $50,000，则该变量将显示为 0。我们将使用的数据集可以分为分类变量，共有八个。这些将包括以下内容：


    - Native country

    - Sex

    - Race

    - Relationship

    - Occupation

    - Marital status

    - Education

    - Place of work


    除此之外，我们还将查看六个连续变量。这些将包括：


    - `Hours_week`

    - `Capital_loss`

    - `Capital_gain`

    - `Education_num`

    - `Fnlwgt`

    - `Age`


    有了这些信息，我们可以调用 TensorFlow 扩展来帮助我们计算概率，以查看我们的客户或数据集中的任何个人将适合我们设置的两个组中的哪一个。这些人将被分为我们之前设置的两个组（虽然你可以根据正在进行的程序类型添加尽可能多的组）。在这个示例中，两个组将基于个人年收入是高于还是低于
    $50,000。完成此操作后，你将能够查看形成的组，并找出其中的一些背景信息，包括性别、种族、居住地、职业等等。这是许多企业正在转向并越来越依赖的工具，因为它帮助他们了解新客户和潜在客户，以及回头客，并可以使他们的整体营销更加高效。


    # 判别模型与生成模型的区别


    在处理线性分类器中发现的一些参数时，将出现两个独立的类或方法供我们使用，目前这些类或方法比较宽泛，旨在帮助你确定参数应如何设置。你在这里的选项将是生成模型或判别模型。符合生成模型的方法将被视为条件密度函数。你将看到的这种算法的两个最大示例将是类似线性判别分析的东西。这将类似于
    Naïve Bayes Classifier 或高斯条件密度模型。然后，程序员也可以选择使用所谓的判别模型。这些很重要，因为它们设置为在进行新一组训练时，使输出尽可能高质量。训练中的额外术语可能是必要的，但这些会增加整体成本，并可能对最终模型进行所谓的正则化。好消息是，这个模型将为你提供一些选项，使其更易于使用，这些选项将包括以下内容：


    1. `Logistic regression`。这将是线性分类器的似然估计，假设观察到的训练集是由依赖于分类器输出的二项模型生成的。

    2. `Perceptron`：这是一种你将使用的算法，因为它会尝试修复训练集中可能出现的任何和所有错误。

    3. `Support vector machine`：这是我们之前讨论过的选项之一。它将是能够尽可能最大化训练集中的示例与决策超平面之间边距的算法。

