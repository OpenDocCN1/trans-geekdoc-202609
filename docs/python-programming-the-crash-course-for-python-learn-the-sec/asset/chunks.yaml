    # 第 3 章：Python 入门


    现在我们已经花了一些时间来了解深度学习和人工智能的概念，以及越来越流行的机器学习，是时候来看看在使用 `Python` 时我们需要知道的一些事情了。虽然如果你想进行人工智能和机器学习，有很多不同的选择，但没有哪一种能像
    `Python` 那样提供强大的功能、易用性以及丰富的特性和库。你有很多理由想要使用 `Python` 来帮助你完成一些机器学习算法，以及在过程中想要实现的一些深度学习。它可能是一门以初学者为设计对象的编程语言，但它带来了很多好处，并且能够处理你在机器学习中进行的许多强大而复杂的事情。虽然我们将花一些时间来了解
    `Python` 提供的不同库及其工作原理，以及它们如何处理我们之前讨论过的一些其他主题，但我们需要先从 `Python` 的一些基础知识开始讨论，了解选择这种编程语言而非其他语言的一些好处，以及这种语言在机器学习方面能做什么。首先，让我们来看看
    `Python` 是什么。这是一种面向对象的编程语言，专为初学者设计。在过去，许多其他编程语言可以做很多非常了不起的事情，但它们通常很难学习，你需要花费大量时间去摸索。这些往往会让想要学习的人望而却步，因为它们太难了，而且有太多东西会变动，对刚开始学习的人来说可能毫无意义。使用
    `Python`，情况有所不同。这有几个原因，但其中一个原因是对象基于现实生活中的事物，并允许用户知道它们在哪里，并且始终将它们保持在同一位置。这总体上让生活变得更容易，并避免了大量信息在过程中移动或丢失。除此之外，这种编程语言易于阅读，使用英语编写，你需要完成的工作将减少到最少。没有不必要的额外行，即使你阅读本指南中讨论的一些不同选项以及我们提供的一些示例，你也会发现它们很容易阅读，即使在你开始之前，甚至在你了解它们含义之前也是如此。不过，在谈论这些时，你可能对使用这种语言感到有点紧张。也许你觉得有点奇怪，需要使用一种为初学者设计的语言来帮助完成机器学习和更复杂的任务。但你会发现，这种语言，即使可能比其他一些语言更容易，并且专为初学者设计，也旨在具有强大的功能。当我们浏览下面一些与机器学习和人工智能配合良好的库时，`Python`
    仍然是帮助你完成所有想要进行的算法和任务的完美语言。这只是当你决定使用 `Python` 编程语言时将享受的一些好处的开始。另一个好处是这种语言附带的许多不同的库。`Python`
    的基础库使用起来相当简单，可以为你的编码添加许多所需的功能。这是个好消息，但你可以更进一步，看看添加一些与 `Python` 一起提供的扩展和其他库将如何增加你的能力。这可以帮助处理机器学习、数学方程、科学、工程等方面，这些可能是
    `Python` 传统库单独无法处理的。`Python` 提供的社区支持也是许多程序员喜欢的东西。`Python` 是世界上使用最广泛的程序之一。由于本章讨论的所有好处，世界各地的许多程序员，无论是初学者还是更高级的用户，都在使用
    `Python` 来处理他们的所有编程需求。这为你提供了一个由其他有兴趣帮助你学习如何使用 `Python`、回答你的问题等等的个人组成的优秀社区。测试代码很容易。在处理代码时，总会有些时候你需要能够测试你的代码并确保它按你想要的方式工作。而
