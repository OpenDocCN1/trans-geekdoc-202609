    # Random Forests


    The forest that is created from a random tree can be great because it is much
    better at predicting certain outcomes. It is able to do this for you because it
    will take all prediction from each of the trees that you create and then will
    be able to select the average for regression or the consensus that you get during
    classification.


    Before you decide that the random forests are going to be the right tool for you,
    it is important to remember that they do have some negatives. For example, they
    are able to help you handle some of the regression problems that come your way,
    but they will not be able to make predictions past whatever kind of training data
    you decide to add into it, or the ranges that you are working with when you submit
    the information. What this means is that the random forests are going to help
    you to make some predictions, and they will be the best part of helping you to
