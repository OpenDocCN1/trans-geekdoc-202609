    intelligence that we are talking about, it will be able to initiate things like
    common sense, it can start with reasoning and problem solving, and can handle
    tasks that are really hard to do and kind of tedious, in no time at all. We are
    going to explore this in a bit more information below, but machine learning is
    also an important part that comes with AI. Learning without any supervision is
