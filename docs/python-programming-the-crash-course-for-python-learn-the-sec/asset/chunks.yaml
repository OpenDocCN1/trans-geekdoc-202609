- raw: "Despite the look of the name there, the LDA is not going to belong to the\
    \ discriminative models in this method. However, the nae does make sense when\
    \ you are able to compare it to some of the other algorithms that are there, such\
    \ as with principal components analysis. You will find that the LDA algorithm\
    \ is going to fit in with supervised learning and it is going to be able to utilize\
    \ the labels on your data, but the PCA is going to be an algorithm of unsupervised\
    \ learning, and it purposely goes through and ignores the labels that are present.\
    \ As you work with discriminative training, it is easy to find that it can provide\
    \ you with more of the accuracy that we were talking about before compared to\
    \ working with the conditional density function. If you are looking to get a higher\
    \ amount of accuracy out of the work that you are doing, then this is the best\
    \ algorithm to work with. However, there are some issues that can come up with\
    \ it as well. While the discriminative training is going to provide you with some\
    \ more accuracy along the way, the conditional density models are able to handle\
    \ some of the missing data points in an easier manner. If your data is missing\
    \ in a lot of places, or you are concerned about how that missing data is going\
    \ to affect your predictions, then going with the conditional density models is\
    \ the best option. Working with linear classifiers can be a great way to work\
    \ with some more of the things that we have already talked about with machine\
    \ learning, while also giving you some more time to learn about and actually use\
    \ the TensorFlow library as we talked about before. Take some time to work through\
    \ the equations that we provided above and see just how these linear classification\
    \ problems can be handled. \n\nChapter 10: Are Recurrent Neural Networks Different\
    \ From Neural Networks We spent some time talking about the neural networks before\
    \ and how they can work to make predictions and can get stronger the more times\
    \ they are exposed to inputs and can learn from them. Now we are going to take\
    \ that a bit further and discuss another topic that is along the same lines, the\
    \ idea of recurrent neural networks. When we are doing a study of the human brain,\
    \ it is reasonable to know that when we think, this process isn’t going to restart\
    \ from nothing every few seconds. We are going to keep building on what we were\
    \ able to learn in the past. We remember what we learned as a child, or even yesterday\
    \ when we went through a new process. And we can retain that information for a\
    \ long time to come. We don’t have to relearn how to brush our teeth each day,\
    \ we just remember how to do that so we can focus on learning new things in the\
    \ future. This is important because it is going to tell us that the thoughts we\
    \ have are going to have persistence and consistency that goes along with them.\
    \ With those traditional neural networks from before, you won’t see this same\
    \ kind of process occurring, and sometimes this is going to be a shortcoming that\
    \ we need to work for. For example, if you would like to be able to go through\
    \ and classify a kind of event that is happening at different points in the movie,\
    \ this would be something that the regular neural network that we talked about\
    \ before would struggle with a bit. The good thing to remember here is that there\
    \ is a machine learning algorithm that is able to handle this, and that is the\
    \ recurrent neural networks. These networks are going to have what are known as\
    \ loops in them, which makes it easy for the information that it learns to persist,\
    \ much like it does in the human brain. In this method, the loop is going to be\
    \ take all of the information that you have and will pass it from one part of\
    \ your network over to the next. This is going to be similar to what would happen\
    \ if you had more than one copy of the same network, with each message getting\
    \ moved on over to the successor has time went on. This chain like nature is important\
    \ because it is going to show us how the recurrent neural networks are going to\
    \ be related pretty closely to the sequences and the lists. They are the natural\
    \ architecture of the neural network to use for the data. And they will be used\
    \ on a frequent basis when it comes to machine learning. In the last few years,\
    \ there has been a lot of people working with these and trying to see how much\
    \ success they were able to garner from using these kinds of networks. One of\
    \ the limitations that come with the recurrent neural networks that is pretty\
    \ glaring is that the API is going to come with a variety of constraints you have\
    \ to work through. They are only going to be able to take an input of a fixed\
    \ sized vector, and they are only able to produce an output that is in a fixed\
    \ sized vector as well. These models are going to also perform the mapping that\
    \ you want, but they can only do it within a fixed number of computational steps,\
    \ which is going to equal the number of layers that you are going to see in the\
    \ model. The main reason that these recurrent neural networks are going to be\
    \ useful and can actually be exciting to use in your coding is that they will\
    \ allow you as the programmer to operate your own work over a sequence of vectors,\
    \ rather than just one. This is going to include having these sequences in the\
    \ input, the output, but oftentimes you will find them in both of these places.\
    \ ![](Images/rsrcK8.jpg)To help us see how these recurrent neural networks are\
