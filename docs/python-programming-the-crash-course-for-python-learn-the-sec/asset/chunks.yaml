    # Python 编程：快速学习 Python 编程并长久记忆的速成课程


    包含机器学习、数据科学分析和人工智能的实践项目与练习


    ## 目录


    - 简介

    - 第 1 章：什么是深度学习和人工智能

    - 第 2 章：机器学习概览

    - 第 3 章：Python 简介

    - 第 4 章：Scikit-Learn 库

    - 第 5 章：使用 Scikit-Learn 创建神经网络

    - 第 6 章：TensorFlow 库

    - 第 7 章：K 近邻与 K 均值聚类

    - 第 8 章：机器学习中的决策树与随机森林

    - 第 9 章：线性分类器及其含义

    - 第 10 章：循环神经网络与神经网络有何不同

    - 第 11 章：除了 Python 编程和机器学习，我还能做什么？

    - 结语


    ## 简介


    恭喜你下载了《Python 编程》，感谢你的选择。接下来的章节将讨论你开始 Python 编程所需了解的一切。在编写程序时，你可能有很多不同的选择，但没有哪一种能像
    Python 这样为你提供如此多样性和所有优势，而这正是我们在本指南中将要讨论的内容。要开始本指南，我们将先看看几个与 Python 越来越密切相关的话题。我们将花几章时间探讨人工智能和深度学习，以及在开始学习
    Python 语言及其相关内容之前，先了解一些机器学习的信息。经过这种介绍之后，是时候深入了解 Python 在机器学习和深度学习方面能做的所有酷事了，而比查看一些专为该主题设计的
    Python 库更好的方法又是什么呢？我们将花些时间了解 Scikit-Learn 库、如何使用该库创建一些神经网络，以及 TensorFlow 库。为了结束本指南，我们将花时间了解一些与机器学习协同工作的不同算法，以及如何使用
    Python 来帮助你编写使这些算法运行所需的代码。我们将要探索的一些最佳机器学习算法将包括 K 均值聚类、K 近邻、决策树、线性分类器等。机器学习和人工智能正在成为行业中的热门词汇，许多人有兴趣学习如何为自己的需求和自己的编程类型使用它们。虽然这是一件好事，但这些人中的许多人担心这些话题太难学习和理解。借助本指南中的信息，即使作为初学者，你也能在
    Python 的帮助下真正掌握所有这些内容。当你准备好学习如何进行 Python 编程，以及它如何与机器学习、深度学习和人工智能协同工作时，请务必查看本指南以帮助你入门！


    市面上有很多关于这个主题的书籍，再次感谢你选择了这一本！我们已尽全力确保本书包含尽可能多的有用信息，祝你阅读愉快！


    ## 第 1 章：什么是深度学习和人工智能


    在我们现代世界中，编程和使用计算机涉及许多不同的部分。许多人觉得，如果他们不懂如何进行复杂的编程，那么他们就根本无法编程。但这并不正确。你可以进行许多复杂的编程类型，而且它们比你想象的更容易完成。在本指南中，我们将花些时间讨论其中的许多内容。在本章开始时，我们将先了解深度学习和人工智能。这两者在我们探讨本指南中的一些话题时都将是不可或缺的部分，了解如何使它们发挥作用以及我们能用它们做什么，将对我们的编程以及在过程中能做的事情产生影响。关于深度学习和人工智能，我们需要知道的一些事情包括以下内容：


    ### 什么是深度学习


    本章我们将花些时间讨论的第一个主题是深度学习。深度学习实际上是一种机器学习（我们将在下一章中详细讨论），它将负责训练我们的计算机来执行人类所做的一些生活任务。有各种任务可以归入此类别，但诸如语音识别、识别图片内容以及做出预测等事情都符合这一理念。深度学习不是将数据组织起来以运行已经定义的方程，而是将为数据所需的一些基本参数设置好，然后训练计算机通过许多不同层的处理来看到模式，从而自行学习。让我们深入了解一下。


    深度学习在这里很重要，因为它将是人工智能（AI）的基础，而我们目前对深度学习的兴趣是由于它与 AI 的关系。深度学习及其带来的一些技术已经能够提高机器描述、检测、识别和分类事物的能力，这种能力以前被认为只适用于人类。一个很好的例子是深度学习在我们世界中已经能够做的所有不同的事情。我们可以发现，许多与之协同工作的算法和技术在描述它将要浏览的内容、检测对象、识别使用者的语音模式以及识别你呈现给它的图片中的内容方面表现出色。许多技术都使用了这一点，例如欺诈检测、人脸识别，以及
    Cortana 和 Siri 等系统。已经有一些发展正在致力于推进我们在深度学习中看到的内容。其中一些将包括：


    1. 对一些算法所做的改进已经能够提升我们在深度学习中看到的一些方法。

    2. 有一些较新的深度学习方法，确保了模型的准确性将保持不变。

    3. 甚至有一些神经网络具有新的类别，这些类别专为某些新应用而开发，包括图像分类和文本翻译。

    4. 来自公司的大量信息可供使用，远比过去多得多。这有助于我们构建具有许多深层的新神经网络，包括流数据、医生笔记、调查记录，甚至你可以从社交媒体获得的一些文本数据。

    5. 还有分布式云计算和图形处理单元的一些计算进步，可以为我们提供确保深度学习算法实际上可以运行所需的所有计算能力。


