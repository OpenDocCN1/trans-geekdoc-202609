    \ the vectors are going to be the ones that are red, and ten the output vectors\
    \ that we need to know are the ones that show up in blue. You can also see that\
    \ there are some green vectors present as well ans these are going to hold onto\
    \ what is known as the state of the RNN. Going from the left diagram over to the\
