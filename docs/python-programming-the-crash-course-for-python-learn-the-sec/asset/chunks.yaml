    \ through. However, there are going to be a few potential issues that can come\
    \ up when you are working with this algorithm. To start with the costs of computation\
    \ are going to be much higher. This is even more true when you try to compare\
    \ it to some of the other algorithms that could handle similar or the same kind\
    \ of work. The reason that the costs here are going to turn up higher is because\
    \ the algorithm will take all of the data, and then sort through every little\
    \ point that it can, rather than trying to cluster them and send over a prediction.\
    \ When the system has to actually look at each individual point, and in large\
    \ sets of data that could be millions of points, it is going to take a lot of\
    \ power and time and this is where the extra costs will come in. after this section\
    \ we will take a look at the K-Means clustering and see why the clustering process\
    \ can sometimes be a beneficial choice. With that said, the KNN algorithm can\
    \ be a great one for you to use in order to see some great benefits with your\
    \ work and to help you really sort out all of the different data points and information\
    \ that you have, even when the set of data is really large and seems impossible\
    \ to go through. Learning the steps that we will go through below will make sure\
    \ that you are set up and ready to work with this machine learning algorithm.\n\
    \n## How does the K-Nearest algorithm work\n\nNow that we have taken a few minutes\
    \ to discuss this kind of algorithm and all that can come with it, it is time\
    \ to take a look at some of the steps that you need to follow to make sure that\
    \ you can use the KNN algorithm in the proper manner. Some of the best steps to\
    \ use to get started with the KNN algorithm are going to include:\n\n1. Load the\
    \ data into the algorithm for it to read through.\n2. Initialize the value that\
    \ you are going to use and rely on for k.\n3. When you are ready to get the predicted\
    \ class, iteration from one to total number of the data points that you use for\
    \ training, you can use the following steps to help.\n\n    1. Start by calculating\
    \ the distance that is in between each of your test data, and each row of your\
    \ training data. We are going to work with the Euclidean distance as our metric\
    \ for distance since it’s the most popular method. Some of the other metrics that\
    \ you may choose to work with here include the cosine and Chebyshev.\n    2. Sort\
    \ the calculated distances going in ascending order, based on their distance values.\n\
    \    3. Get the k rows from the sorted array.\n    4. Get the most frequent class\
    \ for these rows.\n    5. Return back the class prediction.\n"
  trans: "\n\n# 第 7 章：K 近邻算法与 K 均值聚类\n\n在本章中，我们将花一些时间来了解两种不同的算法，你可以使用它们来借助 Python\
    \ 机器学习完成几种不同的流程。我们编码重点关注的这两种算法包括 K 近邻（KNN）和 K 均值聚类。这是两种你可以使用的流行算法，了解如何使用它们、何时有益等，对于帮助你真正看到一些结果至关重要。首先，我们将了解\
    \ KNN。该算法将用于处理你提供的数据，并搜索其中与你想要处理的任何类型实例最相似的 k 个示例。完成此操作后，算法将浏览所有数据，即使你有大量数据，以帮助你获得整体摘要。然后，算法可以使用它为你提供的结果来为你做出预测。每当你决定使用这个特定模型时，你可能会发现学习效果很好，因为它变得非常具有竞争性。之所以有帮助，是因为算法的各个部分，甚至不同模型中的不同元素之间会发生一些竞争，以便你能根据拥有的任何数据得出最佳预测。当你开始使用\
    \ KNN 算法时，你会发现它与本指南中将要讨论的某些其他算法略有不同。例如，在某些情况下，程序员会将其视为一种较为懒惰的学习方法，因为它不会实际创建模型供你使用，至少在你主动进行新预测之前不会。根据你试图使用该信息处理的情况类型，这有时对你的项目是件好事。这最终是有益的，因为等待进行新预测将帮助你拥有始终是最新的数据，或者至少是你希望算法中拥有的数据。这确保你不会得到对你的需求无效或无用的预测。如果该程序以不同的方式工作，例如在固定间隔进行预测，或每次插入新数据时进行预测，在需要时可能会有帮助。但有时你只想查看特定客户群或某些信息，而这种持续更新对你的需求并不有利。KNN\
    \ 算法将确保更新和新预测仅在你希望时发生。当你使用这种类型的算法时，你会发现使用它有许多好处。当你使用 KNN 算法时，你会发现更容易过滤掉数据集中出现的一些噪声。如果你正在处理大量数据，这种噪声有时会非常明显，消除一些噪声，尤其是当它开始变得非常分散注意力时，可以更容易地查看面前的信息和数据，并了解实际存在哪些趋势和模式，以及你可以对它们做什么。此外，如果你的公司正在尝试同时处理和筛选大量数据，那么\
    \ KNN 算法将是你的最佳选择。与本指南中的一些其他算法或你可能阅读的一些其他算法不同，该算法将工作良好，因为它能够筛选的数据大小没有限制。但是，使用此算法时可能会出现一些潜在问题。首先，计算成本将会高得多。当你尝试将其与一些可以处理相同或类似工作的其他算法进行比较时，这一点尤其正确。成本在这里会更高的原因是，算法将获取所有数据，然后筛选每一个小点，而不是尝试对它们进行聚类并发送预测。当系统必须实际查看每个单独的点时，在大型数据集中可能有数百万个点，这将需要大量的算力和时间，额外成本也就来自于此。本节之后，我们将了解\
    \ K 均值聚类，并看看为什么聚类过程有时是一种有益的选择。话虽如此，KNN 算法可以是你用来获得工作中一些巨大好处，并帮助你真正整理所有不同数据点和信息的绝佳选择，即使数据集非常大且看似无法处理。学习下面我们将要介绍的步骤将确保你已准备好使用这种机器学习算法。\n\
    \n## K 近邻算法如何工作\n\n现在我们已经花了几分钟讨论这种算法及其所有相关内容，是时候了解一些你需要遵循的步骤，以确保你能以正确的方式使用 KNN\
    \ 算法。开始使用 KNN 算法的一些最佳步骤将包括：\n\n1. 将数据加载到算法中以供其读取。\n2. 初始化你将使用和依赖的 k 值。\n3. 当你准备好获取预测类时，从\
    \ 1 迭代到你用于训练的数据点总数，你可以使用以下步骤来帮助。\n\n    1. 首先计算每个测试数据与训练数据中每一行之间的距离。我们将使用欧几里得距离作为距离度量，因为它是最流行的方法。你可能选择在此处使用的一些其他度量包括余弦距离和切比雪夫距离。\n\
    \    2. 按距离值将计算出的距离按升序排序。\n    3. 从排序后的数组中获取 k 行。\n    4. 获取这些行中出现频率最高的类。\n  \
    \  5. 返回类预测。\n\n"
