    \ intelligence is that it is a branch of computer science. In this particular\
    \ branch, we are going to aim to create machines that are intelligent, ones that\
    \ are able to learn and think on their own. In fact, this has become such a prevalent\
    \ thing in our world that it is know an essential part of the technology industry\
    \ and we are going to see it grow and take off more than ever before. There has\
    \ been a lot of research done on artificial intelligence, especially with how\
    \ much it has risen in popularity over the last few years. This kind of research\
    \ has been focused and turned into something that is more specialized and highly\
    \ technical like nothing before. The core problems that come with artificial intelligence\
    \ are going to be that we need to be able to program a computer for a lot of different\
    \ traits, and to get it to behave and think in a manner that is almost the same,\
    \ but faster and more efficient, than we see with a human. This is going to be\
    \ complicated, and many programmers, both newer and more advanced, are going to\
    \ wonder how we are supposed to make this happen at all. And is it really something\
    \ that we are able to focus on and do, or are we just wasting our time with all\
    \ of this? You will find that artificial intelligence has really started to take\
    \ the world by storm, not because it is just a neat theory, but because of all\
    \ the neat things that it is able to do in the process. Right now, there are a\
    \ lot of different ways that artificial intelligence can be used. And some of\
    \ the things that we are already able to train a computer to do with the help\
    \ of this technology will include the following: \n\n1.  The ability to move and\
    \ manipulate any of the objects that you would like. \n\n2.  Planning \n\n3. \
    \ Problem solving \n\n4.  Reasoning \n\n5.  Learning \n\n6.  Perception \n\n7.\
    \  Knowledge "
