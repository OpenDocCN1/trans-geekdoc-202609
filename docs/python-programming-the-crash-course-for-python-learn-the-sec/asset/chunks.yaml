    # One of the Core Parts of AI


    One of the core parts that you are going to see with some of this research into
    Ai is knowledge. Machines are able to be trained to act and give off reactions
    that are like humans, but this is only going to happen if the computer is able
    to learn off an abundant amount of information that teaches them how the world
    works. This kind of programming needs to have a lot of information, as well as
