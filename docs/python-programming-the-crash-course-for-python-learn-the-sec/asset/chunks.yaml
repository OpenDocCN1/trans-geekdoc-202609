    # 混淆矩阵与精确度指标


    当你查看其中一个混淆矩阵时，你将能够清晰地看到实际类别和预测类别，并了解其中的情况。接下来我们要关注的是如何查看精确度，以及该算法有多敏感。当你创建自己的混淆矩阵时，将会显示大量信息。这也将有助于我们了解这里出现的真正例和假正例的一些良好洞察。但是，也有一些情况更倾向于使用比我们迄今讨论的更简洁的指标。为了帮助我们，我们首先需要花些时间来查看代码中带来的精确度。这个精确度指标将给出正类中显示的准确度量。这只是意味着它发挥作用，让我们了解预测的正类实际上是正确的可能性，以及衡量标准。为了帮助你在自己的矩阵中检查这一点，你需要使用以下代码：`Precision
    = TP/(TP + FP)`。你在这里能得到的最高分是一。这将显示分类器对正值完美地得出正确结果。仅靠精确度不会太有帮助，因为它会忽略负类。这个指标是你可能希望与召回指标配对使用的东西。召回也称为灵敏度或真正率。接下来我们需要看的是灵敏度。这个灵敏度很重要，因为它将帮助我们计算算法能够正确检测的正类比例。这个指标可以是建模和查看正类的好方法。计算灵敏度的公式是：`Recall
    = TP/(TP + FN)`。


