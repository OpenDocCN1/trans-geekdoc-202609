    # 第 6 章：TensorFlow 库


    有了这些信息，并且对 Scikit-Learn 库的工作原理有了更好的了解之后，是时候转向本指南中将要关注的第二个库了。这个库被称为 TensorFlow
    库，它同样可以在 Python 语言中实现一些惊人的功能。那么，让我们花些时间来探索这个库，以及它在机器学习方面能为我们提供什么。


    这里还需要了解的另一件事是被称为 TensorFlow 的库。这是一个来自 Google 的框架，当你准备创建深度学习模型时会用到它。这个 TensorFlow
    将依赖于用于数值计算的数据流图。它能够让机器学习变得前所未有的简单。它使得获取数据、训练想要使用的机器学习模型、进行预测，甚至修改看到的未来结果等过程变得更加容易。由于所有这些在机器学习中都很重要，因此学习如何使用
    TensorFlow 至关重要。


    这是一个由 Google 的 Brain 团队开发的库，用于大规模进行机器学习。TensorFlow 将机器学习和深度学习算法与模型结合起来，并通过一个共同的隐喻使它们更加有用。TensorFlow
    将使用 Python，正如我们之前所说，它为用户提供了一个前端 API，可用于构建应用程序，而应用程序将在高性能 C++ 中执行。请记住，TensorFlow
    能够帮助你完成许多不同的编程任务。它用于帮助构建、训练甚至运行一些可用的神经网络，特别是那些旨在帮助自然语言处理、我们稍后将讨论的循环神经网络以及图像识别的网络。


    有了这个想法，是时候不仅了解 TensorFlow 的工作原理，还要了解如何将其下载到我们的系统上了。这个 TensorFlow 库将是本指南中讨论的许多项目的一个很好的选择，它附带了你需要的
    API，以帮助使用 Go、C++、Java 和 Rust 等语言进行编码。我们将查看在 Windows 计算机上安装此库所需遵循的所有步骤。可以在任何你喜欢的操作系统上安装这种库，并且遵循类似的过程来完成所有操作。但我们现在将专注于在一个系统上完成，即
    Windows 系统，以便我们可以了解启动所需的一些基础知识。


    ## 在 Windows 上安装 TensorFlow


    如果你想在 Windows 计算机上下载这个编码库，你可以选择借助 `pip` 或 Anaconda 扩展来安装它。首先，原生的 `pip` 将可用于帮助我们获取
    TensorFlow 库，然后将其安装在你选择的系统上，而不必担心它是否在某个环境中。这似乎是一个很棒的选择，在许多情况下确实如此，但我们需要记住的一件事是，使用
    `pip` 安装 TensorFlow 有时会引起其他问题，因为它会干扰系统上你拥有并可能正在使用的 Python 的其他部分。


    解决其中一些问题的好消息是，要让 `pip` 工作，你只需要运行一条命令。在你有机会让这条命令工作后，TensorFlow 将被安装，并可以在系统上以任何你喜欢的方式使用。当使用原生
    `pip` 安装此库时，用户将在此时间获得选项，可以从当前系统上可用的任何目录运行程序。


    你也可以选择借助 Anaconda 扩展来安装 TensorFlow 库。为此，你首先需要确保已经创建了自己的虚拟环境。但是，当你浏览 Anaconda 附带的一些步骤时，你可能会发现它仍然建议随附某种
    `pip install`，而不是使用 `conda install`。这通常是因为它更简单，并且可以更快地完成工作。


    在我们介绍完成此操作所需的一些代码之前，以及在安装完成之前，我们需要仔细检查将与之配合使用的 Python 版本。最好是使用不低于 Python 3.5 的版本。这个版本将拥有
    Python 的所有最新功能，并且总体上是最容易使用的。你还可以在此过程中使用 `pip 3 install` 的好处。


    另一个需要考虑的是，这个库有两个不同的版本可供使用。它们的代码几乎相同，但取决于你想要哪个版本。你可以根据自己的偏好选择使用 CPU 版本或 GPU 版本。用于下载
    TensorFlow CPU 版本以在 Windows 上使用的代码包括：


    ```

    pip3 install – upgrade tensorflow

    ```


    如果你想确保安装的是 TensorFlow 程序的 GPU 版本，你需要使用以下命令来实现：


    ```

    pip3 install – upgrade tensorflow-gpu

    ```


    这将确保你能够在使用的 Windows 系统上安装 TensorFlow。但你可以用来安装此库以便与 Python 和所有其他机器学习算法一起使用的另一个选项，包括借助
    Anaconda 包来安装它。`Pip` 是一个在你将 Python 安装到系统上时会自动安装的程序。但 Anaconda 程序不是。这意味着，如果你想确保
    TensorFlow 能够使用 Anaconda 程序安装，你首先需要花时间安装这个程序。为此，请访问 Anaconda 的网站，从网站下载它，然后从同一网站找到安装说明。


    完成这部分并在系统上安装 Anaconda 程序后，你应该会注意到有一个随附的新包，称为 `conda`。这是一个你将经常使用的好包，你实际上应该在此处停留一会儿，浏览一下它。它可以帮助你在一个地方管理环境等。


    现在你可以转到 Windows 的主屏幕，单击“开始”按钮，然后选择“所有程序”选项卡，我们需要展开信息并查看 Anaconda。你可以单击此提示以在系统上启动
    Anaconda 程序。如果你想查看特定包的可用详细信息，你只需运行命令“`conda info`”。这是一个简单的代码，但会让你有机会阅读有关该包及其管理器的所有详细信息。


    在使用 Anaconda 包时，你可能会发现另一件有趣的事情，那就是它将帮助你不依赖于 Python 的另一个虚拟环境，而是会经历帮助你创建自己的环境的过程。这个新环境将像是
    Python 的一个独立副本，具有维护其所需的所有文件以及所有路径和目录的所有功能。这是一件好事，因为你可以在一个 Python 版本或任何你选择的其他库中完成所需的工作，而不会对你可能正在尝试进行的其他项目产生负面影响。你会发现拥有自己的虚拟环境是一件好事，因为它们可以为用户提供一种帮助隔离项目的方法，然后你可以确保避免共享环境时可能出现的任何潜在问题。


    请注意，这是一个与你将与 Python 一起使用的正常环境不同的环境。这一点很重要，因为它将帮助你完成工作，而不会在其他项目中发生任何负面情况。


    ## 创建和激活虚拟环境


    此时，我们将为 TensorFlow 包创建一个虚拟环境。这可以借助 `conda create` 命令完成。由于我们将创建一个名为 `tensorenviron`
    的环境，你将使用以下语法：


    ```

    conda create -n tensorenviron

    ```


    此时，程序将询问你是否允许创建环境的过程继续，或者是否要取消你正在进行的工作。你将要输入“`y`”然后按回车键继续。这将允许安装成功继续，以查看你想要的结果。


    在创建了这种环境之后，你需要花些时间来激活它。如果没有正确的激活，你将无法使用设置的这个新环境。激活将借助 `activate` 命令完成。然后你将列出要使用的环境名称。打开刚刚创建的环境的示例包括：


    ```

    Activate tensorenviron

    ```


    现在你已经能够激活 TensorFlow 环境，是时候继续并确保 TensorFlow 包也将被安装了。你可以通过使用以下命令来做到这一点：


    ```

    Conda install tensorflow

    ```


    当你到达代码的这一部分时，你的计算机将能够向你展示一个更长的列表，列出你可以安装的所有不同类型的包，并且它还附带了 TensorFlow 所需的包。你将收到提示，决定是一次性全部下载，还是一次只下载一小部分。然后你可以输入
    `Y` 并按键盘上的回车键，让程序继续。一旦你到达这一点并同意所有这些内容，安装包将立即开始工作。但是，请注意，进行此安装的过程至少需要几分钟，甚至更长时间，完成所需的时间将取决于你的计算机和互联网服务提供商的速度。这可能至少需要几分钟才能完成，所以请给它一些时间。


    ## 验证安装


    安装过程完成后，你可以继续采取几个步骤来检查安装过程是否成功。这是一个容易完成的过程，因为你只需要运行 Python 的导入语句。该语句将从 Python
    终端执行，如果你使用的是随附的 Anaconda 提示符，那么你只需要输入一个词，即‘`python`’然后按回车键。这将确保你处于所选终端，然后你可以使用以下代码继续：


    ```

    Import tensorlow as tf

    ```


    如果你发现包没有以正确的方式安装，那么在运行此代码后，你将在屏幕上看到一条错误消息。如果你没有看到错误消息，那么你知道包的安装是成功的。


