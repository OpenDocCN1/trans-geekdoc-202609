    types of techniques that we are able to use with this one, but some of the ones
    that most programmers are going to work with will include singular value decomposition,
    k-means clustering, nearest neighbor mapping, and self-organizing maps. These
    algorithms are also going to be used to segment things like recommended items,
    text topics, and can help us to see some of the outliers in our information. The
    next kind of learning that we are going to focus on are the semisupervised learning.
    This is going to be a bit different than the other two that we have talked about,
    but can still be valuable to look through and it will use a lot of the same kinds
    of applications that we have seen with supervised learning. However, this is going
    to be slightly different because this kind of learning algorithm is going to be
    able to rely on both labeled and unlabeled data to help with training. Typically,
    this means that it is going to use a small amount of data that is labeled and
