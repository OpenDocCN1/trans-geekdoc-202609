    # 回归算法


    As you can see, working with the regression algorithms are going to have a few
    different benefits that come with them. To start, you will see that these algorithms
    make it easy for anyone using the information to see what relationship is present,
    if any, between the dependent variables and the independent variables. This algorithm
    is also able to show what kind of impact will happen if you try to add in a new
    variable or change up another kind of variable that is in your data set. Even
    though there are several benefits with this method, there are a few things to
    be away of when working on the regression algorithm. The biggest shortcoming that
    you will quickly notice is that you aren’t able to use this algorithm to help
    out with any classification problem that comes up. The reason that classification
    problems and the regression algorithm don’t always work together is because this
    particular algorithm tries to overfit the data many times. So, if you do try to
    add in different constraints here, you will find that the whole process is going
    to get tedious pretty quickly.


    # 聚类算法


    The clustering algorithms We spent some time earlier looking at what are known
    as the clustering algorithms when we talked about the k-means clustering algorithm.
    But now we are going to dive a bit more into what these clustering algorithms
    are able to do, and why they are so important to learn all about when you do some
    machine learning. When we are able to focus our attention on the clustering algorithms,
    we have to double check that these are kept simple, rather than adding in a lot
    of complexity. This method is meant to take on all of the data that you are working
    with, and then will create some clusters in order to put the points of data together
    before you start up an algorithm that relies on clustering, you will be able to
    benefit from choosing the number of clusters that you would like to work with.
    This is going to depend on how much data you are working with, and what you are
    planning on finding when the algorithm is done. Let’s say that you are working
    on a project where you would like to divide up your customers between male and
    females to start with. This kind of program would just need to have two clusters
    to sort people out. But if you would like to learn more about the different age
    groups of your customers, then dividing into five or six clusters could be a bit
    more useful. After you have been able to implement how many clusters you would
    like to work with, the program is able to add in the clusters and will make all
    of the data points fit into there One of the things you will enjoy about this
    algorithm is that it is going to be able to take on most of the work that you
    need to do for you in the process. This is because it is going to take the information
    that you give about how many clusters you would like to use and then can add in
    all of the data points to the various clusters based on how they fit. This is
    going to ensure that the information is easy to read and is organized, and you
    will be surprised at the insights that you can gain from doing this kind of algorithm.
    After the information has been sorted out into the various clusters it is possible
    that you will take a look at them and notice that there are a lot of different
    points that show up inside. It is safe to assume that the more points that fall
    inside a specific cluster, the more likely your target market fits in that group.
    Remember that the points that fit inside one cluster are going to be similar to
    one another, while not being similar to the points of data that show up in some
    of the other clusters that you have. Once you have formed some of the original
    clusters, it is time for you to take an individual cluster and divide it up to
    get more sets of clusters, if this makes sense for what you want to get out of
    this algorithm. You are able to do this as many times as you want, creating a
    bunch of divisions as you go through each one. In fact, it is possible to go through
    these steps so many times that you will stop seeing changes as you do the work.
    Now, there are going to be a lot of reasons why a programmer would want to work
    with these kinds of clustering algorithms when they do some work with machine
    learning. First, when you use a clustering algorithm to help with your computational
    work, it is much easier and more cost efficient to get the work done, especially
    when we look at some of the other options, the supervised learning options, that
    can do the same thing. And if you plan to work with some problems of classification,
    then these types of algorithms are the ones to get it all done. With this in mind,
    it is important to remember that the clustering algorithm is not going to be the
    right one to work with every time that you do some machine learning. This algorithm
    is not going to show you predictions or tell you exactly what to do. You can look
    at the clusters and figure out some trends and make some decisions, but you have
    to be the one who does the work at coming up with the course of action.


    # 马尔可夫算法


    What is the Markov algorithm? Another type of unsupervised machine learning algorithm
    that you can work with is the Markov algorithm. This particular algorithm is going
    to take the data that you decide to input into it, and then it will translate
    it to help work in another coding language if you choose. The nice thing here
    is that you can pick out which rules you want to use with this algorithm ahead
    of time so that the algorithm will work the way that you want. Many programmers
    in machine learning find that this algorithm, and the fact they can set up their
    own rules ahead of time, is nice because it allows you to take a string of data
    and ensure that it is as useful as possible as you learn on the job and figure
    out the parameters of how the data will behave. Another thing that you may like
    about this Markov algorithm is that you are able to work with it in several ways,
    rather than being stuck with just one method. One option to consider here is that
    this algorithm works well with things like DNA. For example, you could take the
    DNA sequence of someone, and then use this algorithm to translate the information
    that is inside that sequence into some numerical values. This can often make it
    easier for programmers, doctors, and scientists and more to know what information
    is present, and to make better predictions into the future. When you are working
    with programmer and computers, you will find that the numerical data is going
    to be much easier to sort through than other options of looking through DNA. A
    good reason why you would need to use the Markov algorithm is because it is great
    at learning problems when you already know the input you want to use, but you
    are not sure about the parameters. This algorithm is going to be able to find
    insights that are inside of the information. In some cases these insights are
    hidden and this makes it hard for the other algorithms we have discussed to find
    them. While there are a lot of benefits that can come with working on the Markov
    algorithm, it is important to know that this one can sometimes prove difficult
    for some beginners because they do have to go through it manually to create a
    new rule. This happens when they want to add in a new coding language to the work.
    If you only plan to work with Python while doing this, you only need to make the
    rules once and it is not that big of a deal. But if you do plan to work with several
    coding languages in machine learning at a time, then this could become a big hassle
    to work with.


    # Q-learning


    Q-learning We haven’t had much of a chance to talk about any of the reinforcement
    types of machine learning that you are able to work with. This kind of machine
    learning is going to be a bit different than we would see with some of the other
    two types, in that it is going to rely mostly on true and false kind of learning
    rather than on teaching it with examples or letting it learn through the unsupervised
    machine learning method. This can make it easier for you to train the program
    how to react in the way that you would like, and can ensure that you are going
    to be able to see how different types of machine learning will work. With that
    in mind, it is time to take a look at one of the algorithms that you can do with
    reinforcement learning known as Q-learning. With this kind of algorithm, you are
    going to find that it is the most effective, and it is going to work out the best,
    with something that is described as temporal difference learning. Compared to
    a few of the other types of algorithms that we have talked about in this guidebook
    the Q-learning one would be considered an off-policy algorithm. This is because
    it is not going to have the abilities inside to learn an action value function.
    This may sound confusing, but it means that you are going to be able to get the
    results and the output, regardless of the kind of state you are in at the time.
    Since you can take this Q-learning algorithm and use it no matter what function
    you are trying to create in machine learning, you will first need to take the
    time and go through your application and list out the specifications that you
    want to use. These specifications should tell us how the user, or even the learner,
    is going to select the action they want to take. This can take a bit more time
    and means you have more steps to do with the process, but it is definitely something
    that is worth the effort and the time. After you have been able to go through
    and actually find all of the functions that are considered action value that you
    would like to use (read through them and see if they are actually useful for the
    code that you are writing, it is time for you to create your own optimal policy.
    One of the best methods that you need in order to construct this is to use the
    actions that you think would be seen as the highest value for your program, regardless
    of the kind of state that you would like to work in here. Just like with any of
    the other algorithms that we have discussed in this guidebook, there are going
    to be a few benefits that come with using this algorithm. One of the benefits
    is that you won’t have to worry about taking all of that time, or dealing with
    all of the effort, to put in the models of the environment in order to get the
    system to compare it. You can even go with the option of 6choosing to compare
    a couple different actions, and even many actions, at the same time. As you can
