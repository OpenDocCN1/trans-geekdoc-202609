    监督学习将在许多场景中使用，这些场景将使用历史数据来预测未来事件发生的可能性。例如，它将预测金融机构中信用卡交易最可能发生欺诈的时间，或保险客户最可能提交索赔的时间。


    ## 非监督机器学习


    接下来我们需要了解的学习类型是非监督学习。这是一种用于处理一组没有历史标签的数据的学习类型。系统将获得数据，但在过程中不会被告知正确答案。算法需要能够根据所见内容找出信息是什么以及存在哪些趋势。其目标是让算法探索数据，然后发现其中的结构。这种算法在处理事务数据时通常效果很好。例如，它能够识别出具有共同属性的客户细分群体，用于营销活动。或者，它能够查看一些主要属性，帮助将大量客户群分成相互相似或相近的组。


    我们能够使用这种方法的技术有很多种，但大多数程序员将使用的技术包括奇异值分解、k-means 聚类、最近邻映射和自组织映射。这些算法也将用于细分推荐项目、文本主题等，并可以帮助我们发现信息中的一些异常值。


    ## 半监督机器学习


    接下来我们要关注的是半监督学习。这与我们之前讨论的两种方法略有不同，但仍然值得探索，并且将使用许多与监督学习中看到的相同类型的应用程序。然而，这将略有不同，因为这种学习算法将能够依赖于标记和未标记的数据来帮助训练。通常，这意味着它将使用少量标记的数据，并与大量完全未标记的数据混合。这是因为未标记的数据更容易获得，且不如其他一些选项昂贵。


    你可以使用这种学习的几种不同方式，其中一些选项将包括预测、回归和分类。当你发现与标记相关的成本过高，无法进行完全标记的训练时，这也是你将要使用的方法。这种机器学习算法的早期示例之一是用于识别某人在网络摄像头上的面孔。


    ## 强化学习


    最后，我们还可以使用一种称为强化学习的机器学习算法。这种算法通常用于导航、游戏和机器人等领域。在这种学习中，算法将通过试错过程发现哪些动作能为其提供最大奖励。在这种学习中，有三个重要组成部分。第一部分是代理，即决策者和学习者。第二部分是环境，即代理能够与之交互的一切。第三部分是动作，即代理能够做的一切。


    这一切的目标是让代理选择能够在给定时间内尽可能最大化预期奖励的动作。当代理能够遵循良好的策略时，它将更快地实现目标。因此，强化学习的主要目标是学习需要遵循的最佳策略。


    如你所见，你能够使用的不同类型的机器学习各不相同，它们旨在处理机器学习及你将长期使用的数据分析中的许多不同部分。你需要弄清楚自己正在处理什么样的数据，以及想要解决什么样的项目，然后才能确定需要使用哪些算法。


    在机器学习方面，你能够做的事情有很多。已经有许多不同的技术将依赖于机器学习及其带来的不同算法。例如，如果你曾经使用过手机上的语音识别设备，或使用过搜索引擎，那么你也已经使用了机器学习。这些只是你在机器学习技术方面能够做到的一些示例。关于机器学习已经有很多示例，我们可能甚至没有意识到这项技术在周围世界中被使用了多少。加上我们未来能够使用许多新事物，还有许多尚未构思的应用和用途，我们与人工智能和机器学习的未来将不断增长。


    机器学习蕴含着巨大的潜力，你会发现它可以应用于你想要用特定程序进行的几乎任何类型的人工智能和高级学习过程。学习如何使用机器学习及其所有内容，可以使这项工作变得更容易一些。


    '
