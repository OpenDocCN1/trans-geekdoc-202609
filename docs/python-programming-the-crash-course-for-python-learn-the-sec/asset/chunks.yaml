    ```


    This is going to ensure that you are able to install TensorFlow on the Windows
    system that you are using. But another option that you can use to install this
    library so that you can use it with Python and all of your other machine learning
    algorithms will include being able to install it with the help of the Anaconda
    package. `Pip` is a program that is automatically going to get installed when
    you get Python on your system. But the Anaconda program isn’t. This means that
    if you would like to make sure that TensorFlow is able to get installed with the
    use of the Anaconda program, you first need to take the time to install this program.
    To do this, visit the website for Anaconda, download it from the website, and
    then find the instructions for installation from that same site.


    Once you are done with this part and the Anaconda program is installed on your
    system, you should notice that there is a new package that comes with it known
    as `conda`. This is a good package that you are going to use on a regular basis
    and you should actually stop here for a bit and look through it. It can help you
    to manage your environment and more all in one place.


    You can now go over to the main screen for Windows, click on the button for Start,
    and then choose on the tab for All Programs here we need to expand out the information
    and see Anaconda. You can click on the prompt for this so that it launches the
    Anaconda program on your system. If you wish to look through some of the details
    that are available on a particular package, you just need to run the command of
    “`conda info`”. This is a simple code, but will give you a chance to read all
    of the details about the package as well as the manager for that particular package.


    There is something else that you may find interesting when it comes to using the
    Anaconda package, and this is that it is going to help you to not rely on another
    virtual environment from Python, but will go through the process of helping you
    to create your own to use. This new environment is going to be like its own little
    copy of Python that is isolated, with all of the capabilities of maintaining all
    of the files that it needs, along with all of the paths and all of the directories.
    This is a great thing because you can do the work that you need in one version
    of Python, or any of the other libraries that you choose, without having a negative
    affect on some of the other projects that you may be trying to do in the process.
    You will find that having one of your own virtual environments can be a great
    thing because they can provide the user with a method that helps to isolate projects,
    and you can then make sure that you avoid any of the potential problems that can
    show up if you are sharing an environment.


    Note that this is an environment that is going to be different from the normal
    environment that you will use with Python. This is important to keep in mind because
    it is going to help you to get the work done, without any negative parts happening
    in your other projects.


    ## Creating and Activating a Virtual Environment


    At this point, we are going to work to create a virtual environment for the TensorFlow
    package. This can be done with the help of the `conda create` command. Since we
    are going to create an environment that is known as `tensorenviron`, you would
    use the syntax that is below:


    ```

    conda create -n tensorenviron

    ```


    At this point, the program is going to ask you whether or not you would like to
    allow the process of creating the environment to continue on, or if you would
    like to cancel the work that you are doing. You will want to type in the “`y`”
    and then hit the enter key to move on. This will allow the installation to continue
    on successfully to see the results that you want.


    After you have gone through and created this kind of environment, you will need
    to take some time to activate it. Without the right activation, you won’t be able
    to use this new environment that you have set up. The activation is going to be
    done with the help of the `activate` command. And then you will list out the name
    of the environment that you want to work with. An example of how you would pull
    up the environment that you just created includes:


    ```

    Activate tensorenviron

    ```


    Now that you have been able to activate the TensorFlow environment, it is time
    to go ahead and make sure that the package for TensorFlow are going to be installed
    too. You are able to do this by using the command below:


    ```

    Conda install tensorflow

    ```


    When you get to this part of the coding, your computer is going to be able to
    present you with a longer list of all the different types of packages that you
    are able to install, and it also comes with the package that is needed for TensorFlow.
    You will be given a prompt to decide whether you want to download it all at once,
    or just little parts of it at a time. You can then type in `Y` and hit enter on
    your keyboard to get the program to proceed. Once you have gotten to this point
    and agreed to all of this, the installation package is going to start doing its
    work right away. However, notice that the process for doing this installation
    will take at least a few minutes, if not longer, and the amount of time that it
    will take to complete is going to depend on how much speed you have on your computer
    and with your internet provider. This can take at least a few minutes to complete
    so give it some time.


    ## Verifying the Installation


    After the installation process is all done, you can then move on and take a few
    steps to check whether the installation process was a successful one or not. This
    is an easy process to do because you just need to go through and run the statement
    for importing with Python. The statement is going to be done from the Python terminal,
    and if you are doing this using the prompt that comes with Anaconda, then you
    just need to type in one word, ‘`python`’ and then hit on your enter key. This
    will make sure that you are going to be in the chosen terminal, and then you can
    go through the process of using the code below to help continue on:


    ```

    Import tensorlow as tf

    ```


    If you find that the package wasn’t installed in the proper manner, you are going
    to end up with an error message on the screen after you do this code. If you don’t
    see an error message, then you know that the installation of the package was successful.

