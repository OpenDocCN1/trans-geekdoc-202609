    \ are going to spend some time looking at two of the different algorithms that\
    \ you are able to work with in order to help do a few different processes with\
    \ Python machine learning. These two that are the focus of our coding will include\
    \ the K-Nearest Neighbors, or KNN, and the K-Means clustering. These are two popular\
    \ algorithms that you are able to work with, and knowing how to use them, when\
    \ they can be beneficial, and more can be critical to helping you to really see\
    \ some results. First, we are going to take a look at KNN. This one is going to\
    \ be used to take some of the data that you present and search through it for\
    \ the k most similar examples of any kind of instance that you would like to work\
    \ with. When this is done, then the algorithm is going to look through all of\
    \ the data, even if you have a lot of data, in order to help you have a summary\
    \ of it all. Then the algorithm can take the results that it provides to you in\
    \ order to make predictions for you. Any time that you decide to work with this\
    \ particular model, you may find that the learning is going to work well because\
    \ it becomes really competitive. The reason that this is helpful is because there\
    \ is going to be some competition that happens between the various parts of the\
    \ algorithm, or even the different elements, in the various models so that you\
    \ can end up with the best predictions based on any data that you have. As you\
    \ get to working on the KNN algorithm, you will notice that it is a bit different\
    \ compared to some of the other algorithms that we are going to discuss in this\
    \ guidebook. For example, in some cases programmers would consider this as a lazier\
    \ approach to learning because it isn’t going to actually go through and create\
    \ a model for you, at least not until you actively go in and make a new prediction.\
    \ Depending on what kind of situation you are trying to work on with that information,\
    \ this can sometimes be a good thing for your project. This ends up being beneficial\
    \ because waiting to make new predictions is going to help you to have data that\
    \ is always up to date, or at least data that you want inside the algorithm. This\
    \ ensures that you are not going to end up with predictions that are not valid\
    \ or useful for what you need. If you had this program work in a different manner,\
    \ such as having it do predictions at regular intervals, or each time that you\
    \ inserted some new data, it could be helpful if the situation needed it. But\
    \ then there are times when you want to just look at a specific customer group\
    \ or certain information, and this constant updating is not going to be good for\
    \ what you need The KNN algorithm will make sure that the updates and the new\
    \ predictions only happen when you want them to. You will find as you work with\
    \ this kind of algorithm that there are a number of benefits to using it. When\
    \ you do bring out the KNN algorithm, you are going to find that it is easier\
    \ to cut through some of the noise that shows up in the set of data. This noise\
    \ is sometimes really loud if you are working through a ton of data, and getting\
    \ rid of some of that noise, especially when it starts to get really distracting,\
    \ can make it easier to look at the information and the data in front of you and\
    \ see what trends and patterns are actually there, and what you are able to do\
    \ with them. In addition, if your company is trying to deal with and sort through\
    \ a lot of data at the same time, then the KNN algorithm is going to be the best\
    \ choice for you. Unlike a few of the other algorithms that are in this guidebook\
    \ or some of the other ones that you may read about, this algorithm is going to\
    \ work well because there are no limits on the data size that it is able to sort\
    \ through. However, there are going to be a few potential issues that can come\
    \ up when you are working with this algorithm. To start with the costs of computation\
    \ are going to be much higher. This is even more true when you try to compare\
    \ it to some of the other algorithms that could handle similar or the same kind\
    \ of work. The reason that the costs here are going to turn up higher is because\
    \ the algorithm will take all of the data, and then sort through every little\
    \ point that it can, rather than trying to cluster them and send over a prediction.\
    \ When the system has to actually look at each individual point, and in large\
    \ sets of data that could be millions of points, it is going to take a lot of\
    \ power and time and this is where the extra costs will come in. after this section\
    \ we will take a look at the K-Means clustering and see why the clustering process\
    \ can sometimes be a beneficial choice. With that said, the KNN algorithm can\
    \ be a great one for you to use in order to see some great benefits with your\
    \ work and to help you really sort out all of the different data points and information\
    \ that you have, even when the set of data is really large and seems impossible\
    \ to go through. Learning the steps that we will go through below will make sure\
    \ that you are set up and ready to work with this machine learning algorithm.\
    \ How does the K-Nearest algorithm work Now that we have taken a few minutes to\
    \ discuss this kind of algorithm and all that can come with it, it is time to\
    \ take a look at some of the steps that you need to follow to make sure that you\
    \ can use the KNN algorithm in the proper manner. Some of the best steps to use\
    \ to get started with the KNN algorithm are going to include:  \n\n1.  Load the\
    \ data into the algorithm for it to read through. \n\n2.  Initialize the value\
    \ that you are going to use and rely on for k. \n\n3.  When you are ready to get\
    \ the predicted class, iteration from one to total number of the data points that\
    \ you use for training, you can use the following steps to help. \n\n    1.  Start\
    \ by calculating the distance that is in between each of your test data, and each\
    \ row of your training data. We are going to work with the Euclidean distance\
    \ as our metric for distance since it’s the most popular method. Some of the other\
    \ metrics that you may choose to work with here include the cosine and Chebyshev.\
    \ \n\n    2.  Sort the calculated distances going in ascending order, based on\
    \ their distance values. \n\n    3.  Get the k rows from the sorted array. \n\n\
    \    4.  Get the most frequent class for these rows. \n\n    5.  Return back the\
    \ class prediction. "
