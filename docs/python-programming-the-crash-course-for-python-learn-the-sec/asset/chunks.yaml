    # Python Programming: The Crash Course to Learn Programming Python Faster and
    Remember It Longer


    Includes Hands-On Projects and Exercises for Machine Learning, Data Science Analysis,
    and Artificial Intelligence


    ## Table of Contents


    - [Introduction](../Text/part0003.xhtml)

    - [Chapter 1: What is Deep Learning and Artificial Intelligence](../Text/part0004.xhtml)

    - [Chapter 2: A Look at Machine Learning](../Text/part0005.xhtml)

