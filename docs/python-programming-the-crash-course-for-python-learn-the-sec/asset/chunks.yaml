    The two most commonly used methods are going to be supervised machine learning
    and unsupervised machine learning. But there are a few other methods that come
    with machine learning that you are able to work with as well. Let’s explore these
    a bit to see how they are alike and different, what they can do in machine learning,
    and why they are so important. The first type of machine learning algorithm that
    we are going to explore is supervised machine learning. These ones are going to
    be trained with the help of examples that have been labeled, such as when the
    input is given with the desired output known. For example, you could have a piece
    of equipment that has some data points labeled either F for failed or R for runs.
    The learning algorithm is going to be able to receive a set of inputs with the
    outputs that are correct for them. The algorithm is going to be able to step in
    and learn when it compares the actual output with the correct outputs in order
    to find the errors that may be present. From there, it is going to be able to
    modify the different model that it is using accordingly. Through methods including
    gradient boosting prediction ,regression, and classification, this kind of learning
    algorithm is going to use some patterns in order to predict the values of the
    label on an additional data that is unlabeled. Supervised learning is going to
    be used in many cases where the application is going to use historical data that
    can predict how likely events in the future are. For example, it is going to anticipate
    for a financial institution when a credit card transaction is most likely to be
    fraudulent or when an insurance customer is likely to file a claim. The next type
    of learning that we need to take a look at here is going to be the unsupervised
    learning. This one is going to be the type of learning that is going to be used
    against a set of data that doesn’t have historical labels with it. The system
    is going to be given the data, but it will not be told the right answer in the
