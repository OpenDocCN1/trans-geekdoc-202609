    尽管名称如此，LDA 并不属于该方法中的判别模型。然而，当你能将其与其他一些算法（例如主成分分析）进行比较时，这个名称是有意义的。你会发现 LDA 算法适用于监督学习，并能够利用数据上的标签，而
    PCA 是一种无监督学习算法，它会故意忽略存在的标签。在使用判别训练时，你会发现与使用条件密度函数相比，它能提供更多我们之前讨论过的准确性。如果你希望从所做的工作中获得更高的准确性，那么这是最佳算法。然而，它也存在一些问题。虽然判别训练能在过程中提供更多准确性，但条件密度模型能够更容易地处理一些缺失的数据点。如果你的数据在很多地方都缺失，或者你担心缺失数据会如何影响你的预测，那么选择条件密度模型是最佳方案。使用线性分类器是处理我们之前在机器学习中讨论过的一些内容的好方法，同时也能让你有更多时间学习和实际使用我们之前讨论过的
    TensorFlow 库。花些时间研究我们上面提供的方程，看看这些线性分类问题如何处理。


    ## Chapter 10: Are Recurrent Neural Networks Different From Neural Networks


    我们之前花了一些时间讨论神经网络，以及它们如何进行预测，并且随着接触输入的次数增多而变得更强，并能从中学习。现在我们将进一步讨论另一个沿着相同思路的主题，即循环神经网络的概念。在研究人脑时，合理地知道当我们思考时，这个过程不会每隔几秒就从零开始。我们将继续构建过去所学到的内容。我们记得小时候学到的东西，或者昨天经历的新过程。并且我们可以长期保留这些信息。我们不需要每天重新学习如何刷牙，我们只需记得如何做，这样就可以专注于未来学习新事物。这一点很重要，因为它告诉我们，我们的想法将具有随之而来的持久性和一致性。对于之前的传统神经网络，你不会看到这种同样的过程发生，有时这将是我们需要克服的缺点。例如，如果你想分类发生在电影不同点上的某种事件，这将是我们之前讨论过的常规神经网络会有些困难的事情。这里要记住的好事是，有一种机器学习算法能够处理这个问题，那就是循环神经网络。这些网络将具有所谓的循环，这使得它学到的信息能够持续存在，就像在人脑中一样。在这种方法中，循环将获取你拥有的所有信息，并将其从网络的一部分传递到下一部分。这将类似于如果你有多个相同网络的副本，每条消息都传递给后继者，随着时间的推移。这种链式特性很重要，因为它将向我们展示循环神经网络将与序列和列表相当密切地相关。它们是用于数据的神经网络的自然架构。在机器学习中，它们将被频繁使用。在过去几年中，有很多人在使用这些网络，并试图看看他们能从使用这种网络中获得多少成功。循环神经网络的一个相当明显的局限性是，API
    将带来你需要克服的各种约束。它们只能接受固定大小向量的输入，并且只能产生固定大小向量的输出。这些模型也将执行你想要的映射，但它们只能在固定数量的计算步骤内完成，这将等于你在模型中看到的层数。循环神经网络之所以有用，并且在你的编码中使用会令人兴奋，主要原因是它们将允许你作为程序员在一系列向量上操作你自己的工作，而不仅仅是一个向量。这将包括在输入和输出中拥有这些序列，但通常你会发现它们在这两个地方都存在。


    ![](Images/rsrcK8.jpg)


    为了帮助我们了解循环神经网络如何工作，我们需要查看上面的图表以给出一个示例。上面的每个矩形都将是我们的一个向量，然后箭头将是告诉我们函数的部分。输入的向量将是红色的，然后我们需要知道的输出向量将是蓝色的。你还可以看到有一些绿色的向量存在，它们将保持所谓的
