    \ of words. \n\n3.  Sequence input: This is goi going to be the third picture\
    \ above. It is going to be more of a sentiment analysis that shows us a given\
    \ sentence and makes sure that it is classified as either a negative or positive\
    \ sentiment. \n\n4.  Sequence output and sequence output. You can find this one\
    \ in the fourth box, and it is getting a bit closer to what we want. This one\
    \ is going to be similar to a machine translation. This is when the RNN is able\
    \ to read a sentence out in English, and then can take that information and provide\
    \ you with an output that reads the sentence in rench. \n\n5.  And finally, the\
    \ last box is going to be the synced sequence input and output. The video classification\
    \ here is going to help us to label out each of the frames that occur in a video\
    \ if we decide to. "
