    # 随机森林


    由随机树创建的森林效果可能非常好，因为它在预测某些结果方面要好得多。之所以能为你做到这一点，是因为它会获取你创建的每棵树的所有预测结果，然后能够为回归选择平均值，或为分类选择你获得的共识。


    在决定随机森林是否适合你之前，重要的是要记住，它们确实有一些缺点。例如，它们可以帮助你处理遇到的一些回归问题，但它们无法对你决定加入其中的任何训练数据，或提交信息时所使用的范围之外的情况进行预测。这意味着随机森林将帮助你做出一些预测，并且它们将是帮助你做出对业务有效决策的最佳部分。虽然它带来了很多好处，但由于它能够预测的未来范围有限，也会有一些局限性。这会降低你拥有的准确性。不过，取决于你想要了解什么，你可能会发现这个算法仍然是你需求的最佳算法之一。


    # 第 9 章：线性分类器及其含义


    在学习监督机器学习算法的不同部分时，你可能会发现，你需要关注的最常见的任务包括线性分类器或线性回归，以完成工作。线性回归很有用，因为它可以帮助你预测将获得的值，而线性分类器则专注于特定的类别。本章将重点介绍线性分类器，以及如何将其与你的机器学习工作结合使用。你会发现，当你尝试使用本指南前面提到的库来进行机器学习工作时，分类问题将占据你工作的大部分，通常占机器学习任务的
    80%。分类旨在预测给定输入集下每个类别发生的概率。标签，即本例中的因变量，将是类别或离散值。如果因变量（即我们的标签）在过程中仅处理两个类别，那么你知道你选择的学习算法最终将是一个二分类器。但如果你正在处理一个多类分类器，这意味着它能够处理具有两个或更多类别的标签。让我们看一个例子。很多时候，我们处理的分类问题如果是二分类问题，可以帮助你预测客户再次光顾业务并进行另一次购买的可能性。但如果你想使用一个系统来预测给定图片中出现的动物类型，那么你正在处理一个称为多类分类问题的问题，因为程序需要处理的动物种类不止两种。考虑到这一点，是时候衡量你可以使用的线性分类器的性能了。准确率是开始的最佳主题之一。该分类器的整体性能将由其准确性来衡量。准确率能够收集你拥有的所有正确值，然后将该数字除以存在的观察总数。假设你正在使用的算法或数据中的准确率约为
    85%。这意味着当你使用该模型时，它将在大约 85% 的时间内为你提供正确答案。它也会有 15% 的时间是错误的。当然，目标是保持正确率尽可能高。此时，你已经可以看到，在处理该指标时可能存在一些缺点，尤其是当你处理包含不平衡的类别时。一组不平衡的数据将出现在你所处理的所有组中出现的观察数量不相等的情况下。为了进一步说明，假设你正在使用逻辑回归函数处理一个罕见事件的分类问题。你可以想象，你使用的分类器将尝试估计有多少患者在感染一种疾病后死亡。在你拥有的数据中，约有
    5% 感染这种疾病的患者会死于该疾病。记住这些信息后，你可以训练分类器，确保它能对最终发生的死亡人数做出良好预测，然后你可以使用准确率指标来评估该医院或诊所的性能。现在，如果分类器能够工作并预测整个数据集中有
    0 例死亡，那么它将显示该模型在使用时大约有 95% 的时间是正确的。从此，我们需要继续，看看什么是混淆矩阵。这是我们用来查看分类器性能（与准确率相比）的更好方法之一。当你使用混淆矩阵时，你将受益于可视化分类器的准确率指标与你选择的预测类别和实际类别相比时的情况。二元混淆矩阵将有一系列四个方块，你在这种矩阵中能看到的部分将包括：


    1. `TP`：这将被称为真阳性。这将包含所有被正确预测为实际阳性的预测值。


    2. `FP`：这将是假阳性，或以错误方式预测的值。它们通常被预测为阳性，但实际上是阴性。这意味着阴性值出现，但事先被预测为阳性。


    3. `FN`：这是假阴性。这是当你的阳性值被预测为阴性时。


    4. `TN`：这将是真阴性。这些是以正确方式预测并被预测为实际阴性的值。


    '
