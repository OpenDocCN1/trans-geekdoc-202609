- pgno: 188
  md: '# Learning rate optimization


    We have learned various deep learning algorithms so far; you may have noticed
    that they have one parameter in common: the learning rate. The learning rate is
    defined in the equations to update the model parameters. So, why not think of
    algorithms to optimize the learning rate? Originally, these equations were described
    as follows:


    $\theta^{(\tau+1)} = \theta^{(\tau)} + \Delta\theta^{(\tau)}$


    Here:


    $\Delta\theta^{(\tau)} = -\eta \frac{\partial E}{\partial \theta^{(\tau)}}$


    Here, $\tau$ is the number of steps and $\eta$ is the learning rate. It is well
    known that decreasing the value of the learning rate with each iteration lets
    the model have better precision rates, but we should determine the decline carefully
    because a sudden drop in the value would collapse the model. The learning rate
    is one of the model parameters, so why not optimize it? To do so, we need to know
    what the best rate could be.


    The simplest way of setting the rate is using the momentum, represented as follows:


    $\Delta\theta^{(\tau)} = -\eta \frac{\partial E}{\partial \theta^{(\tau)}} + \alpha\Delta\theta^{(\tau-1)}$


    Here, $\alpha \in [0,1]$, called the **momentum coefficient**. This hyper parameter
    is often set to be 0.5 or 0.9 first and then fine-tuned.


    Momentum is actually a simple but effective way of adjusting the learning rate
    but **ADAGRAD**, proposed by Duchi et al. (http://www.magicbroom.info/Papers/DuchiHaSi10.pdf),
    is known to be a better way. The equation is described as follows:


    $\Delta\theta^{(\tau)} = -\frac{\eta}{\sqrt{\sum_{t=0}^{\tau} g_t^2}} g_{\tau}$'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'Here:


    $g_{\tau} = \frac{\partial E}{\partial \theta^{(\tau)}}$


    Theoretically, this works well, but practically, we often use the following equations
    to prevent divergence:


    $\Delta \theta^{(\tau)} = -\frac{\eta}{\sqrt{\sum_{t=0}^{\tau} g_{t}^{2} + 1}}
    g_{\tau}$


    Or we use:


    $\Delta \theta^{(\tau)} = -\frac{\eta}{\sqrt{\sum_{t=0}^{\tau} g_{t}^{2} + 1}}
    g_{\tau}$


    ADAGRAD is easier to use than momentum because the value is set automatically
    and we don''t have to set additional hyper parameters.


    ADADELTA, suggested by Zeiler (http://arxiv.org/pdf/1212.5701.pdf), is known to
    be an even better optimizer. This is an algorithm-based optimizer and cannot be
    written in a single equation. Here is a description of ADADELTA:


    +   - Initialization:

    +     - Initialize accumulation variables:


    $E\left[g^{2}\right]_{0} = 0$


    And:


    $E\left[\Delta \theta^{2}\right]_{0} = 0$'
  merge: -1
  img_proc: true
- pgno: 190
  md: '+   - Iteration τ = 0,1,2,...,T :

    +     - Compute:

    +       $$g_{\tau} = \frac{\partial E}{\partial \theta^{(\tau)}}$$

    +     - Accumulate gradient:

    +       $$E\left[g^2\right]_{\tau} = \rho E\left[g^2\right]_{\tau-1} + (1-\rho)
    g_{\tau}^2$$

    +     - Compute update:

    +       $$\Delta \theta^{(\tau)} = -\frac{\sqrt{E\left[\Delta \theta^2\right]_{\tau-1}
    + \varepsilon}}{\sqrt{E\left[g^2\right]_{\tau} + \varepsilon}} g_{\tau}$$

    +     - Accumulate updates:

    +       $$E\left[\Delta \theta^2\right]_{\tau} = \rho E\left[\Delta \theta^2\right]_{\tau-1}
    + (1-\rho)\left(\Delta \theta^{(\tau)}\right)^2$$

    +     - Apply update:

    +       $$\theta^{(\tau+1)} = \theta^{(\tau)} + \Delta \theta^{(\tau)}$$


    Here, ρ and ε are the hyper parameters. You may think ADADELTA is rather complicated
    but you don''t need to worry about this complexity when implementing with DL4J.


    There are still other optimizers supported in DL4J such as RMSProp, RMSProp +
    momentum, and Nesterov''s Accelerated Gradient Descent. However, we won''t dig
    into them because, practically, momentum, ADAGRAD, and ADADELTA are enough to
    optimize the learning rate.'
  merge: -1
  img_proc: true
