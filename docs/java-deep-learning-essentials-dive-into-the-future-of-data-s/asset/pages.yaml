- pgno: 153
  md: "Multi-class logistic regression is used in the output layer and the delta is\
    \ then backpropagated to the hidden layer:\n\n```\n// forward & backward output\
    \ layer\ndY = logisticLayer.train(Z, T, minibatchSize, learningRate);\n\n// backward\
    \ hidden layer\ndZ = hiddenLayer.backward(flattened_X, Z, dY, logisticLayer.W,\n\
    minibatchSize, learningRate);\n\n// backpropagate delta to input layer\nfor (int\
    \ n = 0; n < minibatchSize; n++) {\n    for (int i = 0; i < flattenedSize; i++)\
    \ {\n        for (int j = 0; j < nHidden; j++) {\n            dX_flatten[n][i]\
    \ += hiddenLayer.W[j][i] * dZ[n][j];\n        }\n    }\n    dX[n] = unflatten(dX_flatten[n]);\
    \ // unflatten delta\n}\n\n// backward convolution + pooling layers\ndC = dX.clone();\n\
    for (int i = nKernels.length-1; i >= 0; i--) {\n    dC = convpoolLayers[i].backward(downsmapled_X.get(i),\n\
    \        preActivated_X.get(i), activated_X.get(i),\n        downsampled_X.get(i+1),\
    \ dC, minibatchSize, learningRate);\n}\n```\n\nThe backward method of ConvolutionPoolingLayer\
    \ is the same as forward, also simple. Backpropagation of max-pooling is written\
    \ in upsample and that of convolution is in deconvolve:\n\n```\npublic double[][][][]\
    \ backward(double[][][][] X, double[][][][] preActivated_X, double[][][][] activated_X,\
    \ double[][][][] downsampled_X, double[][][][] dY, int minibatchSize, double learningRate)\
    \ {\n    double[][][][] dZ = this.upsample(activated_X, downsampled_X, dY, minibatchSize);\n\
    \    return this.deconvolve(X, preActivated_X, dZ, minibatchSize, learningRate);\n\
    }\n```"
