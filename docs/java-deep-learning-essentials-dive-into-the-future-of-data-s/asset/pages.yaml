- pgno: 31
  md: '![](img/9315e45972ec0fbaf15f9144035bca79_31_0.png)


    Correspondence diagram between AI booms up to now and the research fields of AI


    The first time deep learning appeared was actually quite a while ago, back in
    2006. Professor Hinton at Toronto University in Canada, and others, published
    a paper (https://www.cs.toronto.edu/~hinton/absps/fastnc.pdf). In this paper,
    a method called **deep belief nets (DBN)** was presented, which is an expansion
    of neural networks, a method of machine learning. DBN was tested using the **MNIST**
    database, the standard database for comparing the precision and accuracy of each
    image recognition method. This database includes 70,000 28 x 28 pixel hand-written
    character image data of numbers from 0 to 9 (60,000 are for training and 10,000
    are for testing).


    Then, they constructed a prediction model based on the training data and measured
    its accuracy based on whether a machine could correctly answer which number from
    0 to 9 was written in the test case. Although this paper presented a result with
    considerably higher precision than a conventional method, it didn''t attract much
    attention at the time, maybe because it was compared with another general method
    of machine learning.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Then, a while later in 2012, the whole AI research world was shocked by one
    method. At the world competition for image recognition, Imagenet Large Scale Visual
    Recognition Challenge (ILSVRC), a method using deep learning called SuperVision
    (strictly, that''s the name of the team), which was developed by Professor Hinton
    and others from Toronto University, won the competition. It far surpassed the
    other competitors, with formidable precision. At this competition, the task was
    assigned for a machine to automatically distinguish whether an image was a cat,
    a dog, a bird, a car, a boat, and so on. 10 million images were provided as learning
    data and 150,000 images were used for the test. In this test, each method competes
    to return the lowest error rate (that is, the highest accuracy rate).


    Let''s look at the following table that shows the result of the competition:


    | Rank | Team name | Error |

    |---|---|---|

    | 1 | SuperVision | 0.15315 |

    | 2 | SuperVision | 0.16422 |

    | 3 | ISI | 0.26172 |

    | 4 | ISI | 0.26602 |

    | 5 | ISI | 0.26646 |

    | 6 | ISI | 0.26952 |

    | 7 | OXFORD_VGG | 0.26979 |

    | 8 | XRCE/INRIA | 0.27058 |


    You can see that the difference in the error rate between SuperVision and the
    second position, ISI, is more than 10%. After the second position, it''s just
    a competition within 0.1%. Now you know how greatly SuperVision outshone the others
    with precision rates. Moreover, surprisingly, it was the first time SuperVision
    joined this ILSVRC, in other words, image recognition is not their usual field.
    Until SuperVision (deep learning) appeared, the normal approach for the field
    of image recognition was machine learning. And, as mentioned earlier, a feature
    value necessary to use machine learning had to be set or designed by humans. They
    reiterated design features based on human intuition and experiences and fine-tuning
    parameters over and over, which, in the end, contributed to improving precision
    by just 0.1%. The main issue of the research and the competition before deep learning
    evolved was who was able to invent good feature engineering. Therefore, researchers
    must have been surprised when deep learning suddenly showed up out of the blue.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'There is one other major event that spread deep learning across the world.
    That event happened in 2012, the same year the world was shocked by SuperVision
