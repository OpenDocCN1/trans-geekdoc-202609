- pgno: 91
  md: 'In fine-tuning, sometimes only the weights of an output layer will be adjusted,
    but normally the weights of whole neural networks, including the layer where the
    weights have been adjusted in pre-training, will also be adjusted. This means
    the standard learning algorithm, or in other words the backpropagation algorithm,
    is applied to the deep neural networks just as one multi-layer neural network.
    Thus, the model of neural networks with the problem of solving more complicated
    classification is completed.


    Even so, you might have the following questions: why does learning go well with
    the standard backpropagation algorithm even in multi-layer neural networks where
    layers are piled up? Doesn''t the vanishing gradient problem occur? These questions
    can be solved by pre-training. Let''s think about the following: in the first
    place, the problem is that the weights of each network are not correctly adjusted
    due to improperly fed back errors in multi-layer neural networks without pre-training;
    in other words, the multi-layer neural networks where the vanishing gradient problem
    occurs. On the other hand, once the pre-training is done, the learning starts
    from the point where the weight of the network is almost already adjusted. Therefore,
    a proper error can be propagated to a layer close to an input layer. Hence the
    name fine-tuning. Thus, through pre-training and fine-tuning, eventually deep
    neural networks become neural networks with increased expression by having deep
    layers.


    From the next section onwards, we will finally look through the theory and implementation
    of DBN and SDA, the algorithms of deep learning. But before that, let''s look
