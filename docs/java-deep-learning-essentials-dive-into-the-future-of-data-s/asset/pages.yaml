- pgno: 223
  md: '# 7

    Other Important Deep Learning Libraries


    In this chapter, we''ll talk about other deep learning libraries, especially libraries
    with programming languages other than Java. The following are the most famous,
    well-developed libraries:


    +   - Theano

    +   - TensorFlow

    +   - Caffe


    You''ll briefly learn about each of them. Since we''ll mainly implement them using
    Python here, you can skip this chapter if you are not a Python developer. All
    the libraries introduced in this chapter support GPU implementations and have
    other special features, so let''s dig into them.


    # Theano


    Theano was developed for deep learning, but it is not actually a deep learning
    library; it is a Python library for scientific computing. The documentation is
    available at http://deeplearning.net/software/theano/. There are several characteristics
    introduced on the page such as the use of a GPU, but the most striking feature
    is that Theano supports computational differentiation or automatic differentiation,
    which ND4J, the Java scientific computing library, doesn''t support. This means
    that, with Theano, we don''t have to calculate the gradients of model parameters
    by ourselves. Theano automatically does this instead. Since Theano undertakes
    the most complicated parts of the algorithm, implementations of math expressions
    can be less difficult.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'Let''s see how Theano computes gradients. To begin with, we need to install
    Theano on the machine. Installation can be done just by using pip install Theano
    or easy_install Theano. Then, the following are the lines to import and use Theano:


    ```

    import theano

    import theano.tensor as T

    ```


    With Theano, all variables are processed as tensors. For example, we have scalar,
    vector, and matrix, d for double, l for long, and so on. Generic functions such
    as sin, cos, log, and exp are also defined under theano.tensor. Therefore, as
    shown previously, we often use the alias of tensor, T.


    As a first step to briefly grasp Theano implementations, consider the very simple
    parabola curve. The implementation is saved in DLWJ/src/resources/theano/1_1_parabola_scalar.py
    so that you can reference it. First, we define x as follows:


    ```

    x = T.dscalar(''x'')

    ```


    This definition is unique with Python because x doesn''t have a value; it''s just
    a symbol. In this case, x is scalar of the type d (double). Then we can define
    y and its gradient very intuitively. The implementation is as follows:


    ```

    y = x ** 2

    dy = T.grad(y, x)

    ```


    So, dy should have 2x within it. Let''s check whether we can get the correct answers.
    What we need to do additionally is to register the math function with Theano:


    ```

    f = theano.function([x], dy)

    ```


    Then you can easily compute the value of the gradients:


    ```

    print f(1)  # => 2.0

    print f(2)  # => 4.0

    ```


    Very simple! This is the power of Theano. We have x of scalar here, but you can
    easily implement vector (and matrix) calculations as well just by defining x as:


    ```

    x = T.dvector(''x'')

    y = T.sum(x ** 2)

    ```


    We won''t go further here, but you can find the completed codes in DLWJ/src/resources/theano/1_2_parabola_vector.py
    and DLWJ/src/resources/theano/1_3_parabola_matrix.py.'
  merge: -1
  img_proc: true
- pgno: 225
  md: "When we consider implementing deep learning algorithms with Theano, we can\
    \ find some very good examples on GitHub in Deep Learning Tutorials (https://github.com/lisa-lab/DeepLearningTutorials).\
    \ In this chapter, we'll look at an overview of the standard MLP implementation\
    \ so you understand more about Theano. The forked repository as a snapshot is\
    \ available at https://github.com/yusugomori/DeepLearningTutorials. First, let's\
    \ take a look at mlp.py. The model parameters of the hidden layer are the weight\
    \ and bias:\n\n```\n```\nW = theano.shared(value=W_values, name='W', borrow=True)\n\
    b = theano.shared(value=b_values, name='b', borrow=True)\n```\n```\n\nBoth parameters\
    \ are defined using theano.shared so that they can be accessed and updated through\
    \ the model. The activation can be represented as follows:\n\n$z = h(Wx + b)$\n\
    \nThis denotes the activation function, that is, the hyperbolic tangent in this\
    \ code. Therefore, the corresponding code is written as follows:\n\n```\n```\n\
    lin_output = T.dot(input, self.W) + self.b\nself.output = (\n    lin_output if\
    \ activation is None\n    else activation(lin_output)\n)\n```\n```\n\nHere, linear\
    \ activation is also supported. Likewise, parameters W and b of the output layer,\
    \ that is, logistic regression layer, are defined and initialized in logistic_sgd.py:\n\
    \n```\n```\nself.W = theano.shared(\n    value=numpy.zeros(\n        (n_in, n_out),\n\
    \        dtype=theano.config.floatX\n    ),\n    name='W',\n    borrow=True\n\
    )\n\nself.b = theano.shared(\n    value=numpy.zeros(\n        (n_out,),\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 226
  md: "```\ndtype=theano.config.floatX\n),\nname='b',\nborrow=True\n)\n```\n\nThe\
    \ activation function of multi-class logistic regression is the softmax function\
    \ and we can just write and define the output as follows:\n\n```\nself.p_y_given_x\
    \ = T.nnet.softmax(T.dot(input, self.W) + self.b)\n```\n\nWe can write the predicted\
    \ values as:\n\n```\nself.y_pred = T.argmax(self.p_y_given_x, axis=1)\n```\n\n\
    In terms of training, since the equations of the backpropagation algorithm are\
    \ computed from the loss function and its gradient, what we need to do is just\
    \ define the function to be minimized, that is, the negative log likelihood function:\n\
    \n```\ndef negative_log_likelihood(self, y):\n    return -T.mean(T.log(self.p_y_given_x)[T.arange(y.shape[0]),\
    \ y])\n```\n\nHere, the mean values, not the sum, are computed to evaluate across\
    \ the mini-batch.\n\nWith these preceding values and definitions, we can implement\
    \ MLP. Here again, what we need to do is define the equations and symbols of MLP.\
    \ The following is an extraction of the code:\n\n```\nclass MLP(object):\n   \
    \ def __init__(self, rng, input, n_in, n_hidden, n_out):\n        # self.hiddenLayer\
    \ = HiddenLayer(...)\n        # self.logRegressionLayer = LogisticRegression(...)\n\
    \        # L1 norm\n        self.L1 = (\n            abs(self.hiddenLayer.W).sum()\n\
    \            + abs(self.logRegressionLayer.W).sum()\n        )\n        # square\
    \ of L2 norm\n        self.L2_sqr = (\n            (self.hiddenLayer.W ** 2).sum()\n\
    \            + (self.logRegressionLayer.W ** 2).sum()\n        )\n        # negative\
    \ log likelihood of MLP\n```"
  merge: -1
  img_proc: true
