- pgno: 160
  md: '# Implementing from scratch versus a library/framework


    We implemented the machine learning algorithms of neural networks in Chapter 2,
    Algorithms for Machine Learning – Preparing for Deep Learning, and many deep learning
    algorithms from scratch in Chapter 3, Deep Belief Nets and Stacked Denoising Autoencoders
    and Chapter 4, Dropout and Convolutional Neural Networks. Of course, we can apply
    our own code to practical applications with some customizations, but we have to
    be careful when we want to utilize them because we can''t deny the possibility
    that they might cause several problems in the future. What could they be? Here
    are the possible situations:


    +   - The code we wrote has some missing parameters for better optimization because
    we implemented just the essence of the algorithms for simplicity and so you better
    understand the concepts. While you can still train and optimize the model with
    them, you could get higher precision rates by adding another parameter of your
    own implementation.

    +   - As mentioned in the previous chapter, there are still many useful deep learning
    algorithms not explained in this book. While you now have the core components
    of the deep learning algorithms, you might need to implement additional classes
    or methods to get the desired results in your fields and applications.

    +   - The assumed time consumption will be very critical to the application, especially
    when you think of analyzing huge amounts of data. It is true that Java has a better
    performance in terms of speed compared to other popular languages such as Python
    and R, but you may still need to consider the time cost. One plausible approach
    to solve the problem is using GPU instead of CPU, but this requires complex implementations
    to adjust the code for GPU computing.


    These are the main causal issues, and you might also need to take into consideration
    that we don''t handle exceptions in the code.


    This does not mean that implementing from scratch would have fatal errors. The
    code we wrote can be used substantially as an application for certain scaled data;
    however, you need to take into consideration that you require further coding for
    the fundamental parts you have implemented if you use large-scale data mining,
    where, generally, deep learning is required. This means you need to bear in mind
    that implementation from scratch has more flexibility as you can change the code
    if required, but at the same time it has a negative side in that the algorithm''s
    tuning and maintenance also has to be done independently.'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'So, how can we solve the problems just mentioned? This is where a library (or
    framework) comes in. Thanks to active research into deep learning globally, there
    are many libraries developed and published using various programming languages
    all over the world. Of course, each library has its respective features but the
    features that every library commonly has can be summarized as follows:


    +   - A model''s training can be done just by defining a layer structure of deep
    learning. You can focus on parameter setting and tuning, and you don''t need to
    think about the algorithms.

    +   - Most of the libraries are open to the public as open source projects and
    are actively updated daily. Therefore, if there are bugs, there''s a high possibility
    that these bugs will be fixed quickly (and, of course, committing to a project
    by fixing it yourself should be welcomed).

    +   - It''s easy to switch between running the program on CPU or on GPU. As a
    library supplements the cumbersome coding element of GPU computing, you can just
    focus on the implementation without considering CPU or GPU, if a machine supports
    GPU.


    Long story short, you can leave out all the parts that could be brutal when you
    implement to a library from scratch. Thanks to this, you can take more time on
    the essential data mining section, hence if you want to utilize practical applications,
    there''s a high possibility that you can perform data analysis more efficiently
    using a library.


    However, depending too much on a library isn''t good. Using a library is convenient,
    but on the flip side, it has some demerits, as listed here:


    +   - Since you can build various deep learning models easily, you can implement
    without having a concrete understanding of what theory the model is supported
    by. This might not be a problem if we only consider implementations related to
    a specific model, but there will be a risk you can''t deal with when you want
    to combine other methods or consider other methods when applying the model.

    +   - You can''t use algorithms not supported by a library, hence there might
    be a case where you can''t choose a model you would like to use. This can be solved
    by a version upgrade, but on the other hand, there''s a possibility that some
    part of a past implementation might be deprecated due to a change of specification
    by the upgrade. Moreover, we can''t deny the possibility that the development
    of a library is suddenly terminated or utilization turns out to be chargeable
    due to a sudden change in its license. In these cases, there''s a risk that the
    code you have developed up to this point cannot be used.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '+   - The precision rate you can get from experimentation depends on how a
    library is implemented. For example, if we conduct an experiment with the same
    neural network model in two different libraries, the results we obtain can be
    hugely changed. This is because neural network algorithms include a stochastic
    operation, and the calculation accuracy of a machine is limited, that is, calculated
    values during the process could have fluctuations based on the method of implementation.


    Because you well understand the fundamental concepts and theories of deep learning
    algorithms thanks to the previous chapters, we don''t need to worry about the
    first point. However, we need to be careful about the remaining two points. From
    the next section on, implementation using a library is introduced and we''ll be
    more conscious of the merits and demerits we just discussed.


    # Introducing DL4J and ND4J


    A lot of the libraries of deep learning have been developed all over the world.
    In November 2015, **TensorFlow** (http://www.tensorflow.org/), a machine learning/deep
    learning library developed by Google, became open to the public and attracted
    great attention.


    When we look at the programming language with which libraries are being developed,
    most of them open to the public are developed by Python or use the Python API.
    TensorFlow is developed with C++ on the backend but it''s also possible to write
    code with Python. This book focuses on Java to learn deep learning, hence the
    libraries developed by other languages will be briefly introduced in Chapter 7,
    *Other Important Deep Learning Libraries.*


    So, what Java-based libraries do we have? Actually, there are a few cases that
    are actively developed (perhaps there are also some projects not open to public).
    However, there is only one library we can use practically: **Deeplearning4j (DL4J)**.
    The official project page URL is http://deeplearning4j.org/. This library is also
    open source and the source code is all published on GitHub. The URL is https://github.com/deeplearning4j/deeplearning4j.
    This library was developed by Skymind (http://www.skymind.io/). What kind of library
    is this? If you look at the project page, it''s introduced as follows:


    > "Deeplearning4j is the first commercial-grade, open-source, distributed deep-learning
    library written for Java and Scala. Integrated with Hadoop and Spark, DL4J is
    designed to be used in business environments, rather than as a research tool.
    Skymind is its commercial support arm.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '> *Deeplearning4j aims to be cutting-edge plug and play, more convention than
    configuration, which allows for fast prototyping for non-researchers. DL4J is
    customizable at scale. Released under the Apache 2.0 license, all derivatives
    of DL4J belong to their authors.*


    When you read this, you will see that the biggest feature of DL4J is that it was
    designed on the premise of being integrated with Hadoop. This indicates that DL4J
    suits the processing of large-scale data and is more scalable than other libraries.
    Moreover, DL4J supports GPU computing, so it''s possible to process data even
    faster.


    Also, DL4J uses a library called **N-Dimensional Arrays for Java (ND4J)** internally.
    The project page is http://nd4j.org/. The same as DL4J, this library is also published
    on GitHub as an open source project: https://github.com/deeplearning4j/nd4j. The
    developer of the library is the same as DL4J, Skymind. As you can see from the
    name of the library, this is a scientific computing library that enables us to
    handle versatile n-dimensional array objects. If you are a Python developer, it
    might be easier for you to understand this if you imagine NumPy, as ND4J is a
    library inspired by NumPy. ND4J also supports GPU computing and the reason why
    DL4J is able to do GPU integration is because it uses ND4J internally.


    What good can come from working with them on GPUs? Let''s briefly look at this
    point. The biggest difference between CPU and GPU is the difference in the number
    of cores. GPU is, as represented in its name, a graphical processing unit, originally
    an integrated circuit for image processing. This is why GPU is well optimized
    to handle the same commands simultaneously. Parallel processing is its forte.
    On the other hand, as CPU needs to process various commands, these tasks are basically
    made to be processed in order. Compared to CPU, GPU is good at processing huge
    numbers of simple tasks, therefore calculations such as training iterations of
    deep learning is its field of expertise.


    Both ND4J and DL4J are very useful for research and data mining with deep learning.
    From the next section on, we''ll see how these are used for deep learning in simple
    examples. You can easily understand the contents because you should already understand
    the core theories of deep learning by now. Hopefully, you can make use of this
    for your fields of study or business.'
