  md: '# About the Author


    **Yusuke Sugomori** is a creative technologist with a background in information
    engineering. When he was a graduate school student, he cofounded Gunosy with his
    colleagues, which uses machine learning and web-based data mining to determine
    individual users'' respective interests and provides an optimized selection of
    daily news items based on those interests. This algorithm-based app has gained
    a lot of attention since its release and now has more than 10 million users. The
    company has been listed on the Tokyo Stock Exchange since April 28, 2015.


    In 2013, Sugomori joined Dentsu, the largest advertising company in Japan based
    on nonconsolidated gross profit in 2014, where he carried out a wide variety of
    digital advertising, smartphone app development, and big data analysis. He was
    also featured as one of eight "new generation" creators by the Japanese magazine
    Web Designing.


    In April 2016, he joined a medical start-up as cofounder and CTO.'
