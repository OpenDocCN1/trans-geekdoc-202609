- pgno: 98
  md: "Then, we'll calculate each gradient against the model parameter. The derivative\
    \ can be calculated as follows:\n\n$$\frac{\\partial ln L(\\theta | v)}{\\partial\
    \ \\theta} = \\frac{\\partial}{\\partial \\theta}\\left( ln \\sum_h \\exp(-E(v,h))\
    \ \\right) - \\frac{\\partial}{\\partial \\theta}\\left( ln \\sum_{v,h} \\exp(-E(v,h))\
    \ \\right)$$ $$= -\\frac{1}{\\sum_h \\exp(-E(v,h))} \\sum_h \\exp(-E(v,h)) \\\
    frac{\\partial E(v,h)}{\\partial \\theta}$$ $$= +\\frac{1}{\\sum_h \\exp(-E(v,h))}\
    \ \\sum_{v,h} \\exp(-E(v,h)) \\frac{\\partial E(v,h)}{\\partial \\theta}$$ $$=\
    \ -\\sum_h p(h|v) \\frac{\\partial E(v,h)}{\\partial \\theta} + \\sum_{v,h} p(v|h)\
    \ \\frac{\\partial E(v,h)}{\\partial \\theta}$$\n\nSome equations in the middle\
    \ are complicated, but it turns out to be simple with the term of the probability\
    \ distribution of the model and the original data.\n\nTherefore, the gradient\
    \ of each parameter is shown as follows:\n\n$$\\frac{\\partial ln L(\\theta |\
    \ v)}{\\partial w_{ij}} = \\sum_h p(h|v) \\frac{\\partial E(v,h)}{\\partial w_{ij}}\
    \ + \\sum_{v,h} p(h|v) \\frac{\\partial E(v,h)}{\\partial w_{ij}}$$ $$= \\sum_h\
    \ p(h|v) h_j v_i - \\sum_v p(v) \\sum_h p(h|v) h_j v_i$$ $$= p(H_j=1|v) v_i -\
    \ \\sum_v p(v) p(H_j=1|v) v_i$$ $$\\frac{\\partial ln L(\\theta | v)}{\\partial\
    \ b_i} = v_i - \\sum_v p(v) v_i$$ $$\\frac{\\partial ln L(\\theta | v)}{\\partial\
    \ c_j} = p(H_j=1|v) - \\sum_v p(v) p(H_j=1|v)$$"
