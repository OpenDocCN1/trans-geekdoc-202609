  md: '# Deep Belief Nets (DBNs)


    DBNs are deep neural networks where logistic regression is added to RBMS as the
    output layer. Since the theory necessary for implementation has already been explained,
    we can go directly to the implementation. The package structure is as follows:


    ![](img/9315e45972ec0fbaf15f9144035bca79_106_0.png)


