    \ is an example of it:\n\n![](img/9315e45972ec0fbaf15f9144035bca79_148_0.png)\n\
    \nNow let's build the model. The constructor is similar to other deep learning\
    \ models and rather simple. We construct multi ConvolutionPoolingLayers first.\
    \ The size for each layer is calculated in the method:\n\n```\n```cpp\n// construct\
