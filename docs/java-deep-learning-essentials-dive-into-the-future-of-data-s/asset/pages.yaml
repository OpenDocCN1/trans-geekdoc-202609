- pgno: 75
  md: 'Now, let''s see how we compute the output. It looks complicated at first glance
    but it accumulates the layers and the scheme of the network''s weight or activation
    in the same way, so you simply have to combine the equation of each layer. Each
    output can be shown as follows:


    $$E(W,b)=-\ln L(W,b)=-\sum_{n=1}^{N}\sum_{k=1}^{K}t_{nk}\ln Y_{nk}$$


    Here, $h$ is the activation function of the hidden layer and $g$ is the output
    layer.


    As has already been introduced, in the case of multi-class classification, the
    activation function of the output layer can be calculated efficiently by using
    the $softmax$ function, and the error function is given as follows:


    $$y_k=g\left(\sum_{j=1}^{M}w_{kj}^{(2)}z_j+b_k^{(2)}\right)$$


    $$=g\left(\sum_{j=1}^{M}w_{kj}^{(2)}h\left(\sum_{i=1}^{D}w_{ji}^{(1)}x_i+b_j^{(1)}\right)+b_k^{(2)}\right)$$


    As for a single layer, it''s fine just to reflect this error in the input layer,
    but for the multi-layer, neural networks cannot learn as a whole unless you reflect
    the error in both the hidden layer and input layer.


    Fortunately, in feed-forward networks, there is an algorithm known as backpropagation,
    which enables the model to propagate this error efficiently by tracing the network
    forward and backward. Let''s look at the mechanism of this algorithm. To make
    the equation more readable, we''ll think about the valuation of an error function
    in the online training, shown as follows:


    $$E(W,b)=\sum_{n=1}^{N}E_n(W,b)$$


    We can now think about just the gradient of this, $E_n$. Since all the data in
    a dataset in most cases of practical application is independent and identically
    distributed, we have no problem defining it as we just mentioned.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Each unit in the feed-forward network is shown as the sum of the weight of
    the network connected to the unit, hence the generalized term can be represented
    as follows:


    $$a_j = \sum_i w_{ji}x_i + b_j$$


    $$z_j = h(a_j)$$


    Be careful, as $x_i$ here is not only the value of the input layer (of course,
    this can be the value of the input layer). Also, $h$ is the nonlinear activation
    function. The gradient of weights and the gradient of the bias can be shown as
    follows:


    $$\frac{\partial E_n}{\partial w_{ji}} = \frac{\partial E_n}{\partial a_j}\frac{\partial
    a_j}{\partial w_{ji}} = \frac{\partial E_n}{\partial a_j}x_i$$


    $$\frac{\partial E_n}{\partial b_j} = \frac{\partial E_n}{\partial a_j}\frac{\partial
    a_j}{\partial b_j} = \frac{\partial E_n}{\partial a_j}$$


    Now, let the notation defined in the next equation be introduced:


    $$\delta_j := \frac{\partial E_n}{\partial a_j}$$


    Then, we get:


    $$\frac{\partial E_n}{\partial w_{ji}} = \delta_j x_i$$


    $$\frac{\partial E_n}{\partial b_j} = \delta_j$$'
