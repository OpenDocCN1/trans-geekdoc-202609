  img_proc: true
- pgno: 77
  md: 'Therefore, when we compare the equations, the output unit can be described
    as follows:


    $\delta_k = y_k - t_k$


    Also, each unit of the hidden layer is:


    $\delta_j = \frac{\partial E_n}{\partial a_j} = \sum_k \frac{\partial E_n}{\partial
    a_k} \frac{\partial a_k}{\partial a_j}$


    $\delta_j = h''(a_j) \sum_k w_{kj} \delta_k$


    Thus, the **backpropagation formula** is introduced. As such, delta is called
    the **backpropagated** error. By computing the `backpropagated` error, the weights
    and bias can be calculated. It may seem difficult when you look at the formula,
    but what it basically does is receive feedback on errors from a connected unit
    and renew the weight, so it''s not that difficult.


    Now, let''s look at an implementation with a simple XOR problem as an example.
    You will have better understanding when you read the source code. The structure
    of the package is as follows:


    ![](img/9315e45972ec0fbaf15f9144035bca79_77_0.png)'
