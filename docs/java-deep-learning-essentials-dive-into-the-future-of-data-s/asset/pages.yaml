- pgno: 65
  md: 'The sigmoid function maps any values of a real number to a value from 0 to
    1. Therefore, the output of the logistic regression can be regarded as the posterior
    probability for each class. The equations can be described as follows:


    $$p(C=1\mid x)=y(x)=\sigma(w^T x+b)$$


    $$p(C=0\mid x)=1-p(C=1\mid x)$$


    These equations can be combined to make:


    $$p(C=t\mid x)=y^t(1-y)^{1-t}$$


    Here, $t\in\{0,1\}$ is the correct data. You may have noticed that the range of
    the data is different from the one of perceptrons.


    With the previous equation, the likelihood function, which estimates the maximum
    likelihood of the model parameters, can be expressed as follows:


    $$L(w,b)=\prod_{n=1}^{N}y_n^{t_n}(1-y_n)^{1-t_n}$$


    Where:


    $$y_n=p(C=1\mid x_n)$$


    As you can see, not only the weight of the network but the bias $b$ are also parameters
    that need to be optimized.'
