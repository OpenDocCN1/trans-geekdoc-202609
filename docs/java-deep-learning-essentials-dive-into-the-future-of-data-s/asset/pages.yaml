    There are more useful websites, materials, and communities other than the two
    we picked up here, such as the deep learning group on Google+ (https://plus.google.com/communities/112866381580457264725),
    so you should watch the media which suit you. Anyway, now this industry is developing
    rapidly and it is definitely necessary to always watch out for updated information.


    # Summary


    In this chapter, we went from the example of AlphaGo as breaking news to the consideration
    of how deep learning will or should develop. A machine winning over a human in
    some areas is not worthy of fear, but is an opportunity for humans to grow as
    well. On the other hand, it is quite possible that this great technology could
    go in the wrong direction, as seen in the example of Tay, if the technology of
    AI isn''t handled appropriately. Therefore, we should be careful not to destroy
    this steadily developing technology.


    The field of deep learning is one that has the potential for hugely changing an
    era with just one idea. If you build AI in the near future, that AI is, so to
    speak, a pure existence without any knowledge. Thinking what to teach AI, how
    to interact with it, and how to make use of AI for humankind is humans'' work.
    You, as a reader of this book, will lead a new technology in the right direction.
    Lastly, I hope you will get actively involved in the cutting edge of the field
    of AI.'
