- pgno: 83
  md: '# 3

    Deep Belief Nets and

    Stacked Denoising

    Autoencoders


    From this chapter through to the next chapter, you are going to learn the algorithms
    of deep learning. We''ll follow the fundamental math theories step by step to
    fully understand each algorithm. Once you acquire the fundamental concepts and
    theories of deep learning, you can easily apply them to practical applications.


    In this chapter, the topics you will learn about are:


    +   - Reasons why deep learning could be a breakthrough

    +   - The differences between deep learning and past machine learning (neural
    networks)

    +   - Theories and implementations of the typical algorithms of deep learning,
    **deep belief nets (DBN)**, and **Stacked Denoising Autoencoders (SDA)**


    # Neural networks fall


    In the previous chapter, you learned about the typical algorithm of neural networks
    and saw that nonlinear classification problems cannot be solved with perceptrons
    but can be solved by making multi-layer modeled neural networks. In other words,
    nonlinear problems can be learned and solved by inserting a hidden layer between
    the input and output layer. There is nothing else to it; but by increasing the
    number of neurons in a layer, the neural networks can express more patterns as
    a whole. If we ignore the time cost or an over-fitting problem, theoretically,
    neural networks can approximate any function.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'So, can we think this way? If we increase the number of hidden layers—accumulate
    hidden layers over and over—can neural networks solve any complicated problem?
    It''s quite natural to come up with this idea. And, as a matter of course, this
    idea has already been examined. However, as it turns out, this trial didn''t work
    well. Just accumulating layers didn''t make neural networks solve the world''s
    problems. On the contrary, some cases have less accuracy when predicting than
    others with fewer layers.


    Why do these cases happen? It''s not wrong for neural networks with more layers
    to have more expression. So, where is the problem? Well, it is caused because
    of the feature that learning algorithms have in feed-forward networks. As we saw
    in the previous chapter, the backpropagation algorithm is used to propagate the
    learning error into the whole network efficiently with the multi-layer neural
    networks. In this algorithm, an error is reversed in each layer of the neural
    network and is conveyed to the input layer one by one in order. By backpropagating
    the error at the output layer to the input layer, the weight of the network is
    adjusted at each layer in order and the whole weight of a network is optimized.


    This is where the problem occurs. If the number of layers of a network is small,
    an error backpropagating from an output layer can contribute to adjusting the
    weights of each layer well. However, once the number of layers increases, an error
    gradually disappears every time it backpropagates layers, and doesn''t adjust
    the weight of the network. At a layer near the input layer, an error is not fed
    back at all.


    The neural networks where the link among layers is dense have an inability to
    adjust weights. Hence, the weight of the whole of the networks cannot be optimized
    and, as a matter of course, the learning cannot go well. This serious problem
    is known as the **vanishing gradient problem** and has troubled researchers as
    a huge problem that the neural network had for a long time until deep learning
    showed up. The neural network algorithm reached a limit at an early stage.


    # Neural networks'' revenge


    Because of the vanishing gradient problem, neural networks lost their popularity
    in the field of machine learning. We can say that the number of cases used for
    data mining in the real world by neural networks was remarkably small compared
    to other typical algorithms such as logistic regression and SVM.'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'But then deep learning showed up and broke all the existing conventions. As
    you know, deep learning is the neural network accumulating layers. In other words,
    it is deep neural networks, and it generates astounding predictability in certain
    fields. Now, speaking of AI research, it''s no exaggeration to say that it''s
    the research into deep neural networks. Surely it''s the counterattack by neural
    networks. If so, why didn''t the vanishing gradient problem matter in deep learning?
    What''s the difference between this and the past algorithm?


    In this section, we''ll look at why deep learning can generate such predictability
    and its mechanisms.


    # Deep learning''s evolution – what was the breakthrough?


    We can say that there are two algorithms that triggered deep learning''s popularity.
    The first one, as mentioned in *Chapter 1, Deep Learning Overview*, is DBN pioneered
    by Professor Hinton (https://www.cs.toronto.edu/~hinton/absps/fastnc.pdf). The
    second one is SDA, proposed by Vincent et al. (http://www.iro.umontreal.ca/~vincentp/Publications/denoising_autoencoders_tr1316.pdf).
    SDA was introduced a little after the introduction of DBN. It also recorded high
    predictability even with deep layers by taking a similar approach to DBN, although
    the details of the algorithm are different.


    So, what is the common approach that solved the vanishing gradient problem? Perhaps
    you are nervously preparing to solve difficult equations in order to understand
    DBN or SDA, but don''t worry. DBN is definitely an algorithm that is understandable.
    On the contrary, the mechanism itself is really simple. Deep learning was established
    by a very simple and elegant solution. The solution is: **layer-wise training**.
    That''s it. You might think it''s obvious if you see it, but this is the approach
    that made deep learning popular.


    As mentioned earlier, in theory if there are more units or layers of neural networks,
    it should have more expressions and increase the number of problems it is able
    to solve. It doesn''t work well because an error cannot be fed back to each layer
    correctly and parameters, as a whole network, cannot be adjusted properly. This
    is where the innovation was brought in for learning at a respective layer. Because
    each layer adjusts the weights of the networks independently, the whole network
    (that is, the parameters of the model) can be optimized properly even though the
    numbers of layers are piled up.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'Previous models didn''t go well because they tried to backpropagate errors
    from an output layer to an input layer straight away and tried to optimize themselves
    by adjusting the weights of the network with backpropagated errors. So, the algorithm
    shifted to layer-wise training and then the model optimization went well. That''s
    what the breakthrough was for deep learning.


    However, although we simply say **layer-wise training**, we need techniques for
    how to implement the learning. Also, as a matter of course, parameter adjustments
    for whole networks can''t only be done with layer-wise training. We need the final
    adjustment. This phase of layer-wise training is called **pre-training** and the
    last adjustment phase is called **fine-tuning**. We can say that the bigger feature
    introduced in DBN and SDA is pre-training, but these two features are both part
    of the necessary flow of deep learning. How do we do pre-training? What can be
    done in fine-tuning? Let''s take a look at these questions one by one.


    # # Deep learning with pre-training


    Deep learning is more like neural networks with accumulated hidden layers. The
    layer-wise training in pre-training undertakes learning at each layer. However,
    you might still have the following questions: if both layers are hidden (that
    is, neither of the layers are input nor output layers), then how is the training
    done? What can the input and output be?


    Before thinking of these questions, remind yourself of the following point again
    (reiterated persistently): deep learning is neural networks with piled up layers.
    This mean, model parameters are still the weights of the network (and bias) in
    deep learning. Since these weights (and bias) need to be adjusted among each layer,
    in the standard three layered neural network (that is, the input layer, the hidden
    layer, and the output layer), we need to optimize only the weights between the
    input layer and the hidden layer and between the hidden layer and the output layer.
    In deep learning, however, the weight between two hidden layers also needs to
    be adjusted.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'First of all, let''s think about the input of a layer. You can imagine this
    easily with a quick thought. The value propagated from the previous layer will
    become the input as it is. The value propagated from the previous layer is none
    other than the value forward propagated from the previous layers to the current
    layer by using the weight of the network, the same as in general feed-forward
    networks. It looks simple in writing, but you can see that it has an important
    meaning if you step into it further and try to understand what it means. The value
    from the previous layer becomes the input, which means that the features the previous
    layer(s) learned become the input of the current layer, and from there the current
    layer newly learns the feature of the given data. In other words, in deep learning,
    features are learned from the input data in stages (and semi-automatically). This
    implies a mechanism where the deeper a layer becomes, the higher the feature it
    learns. This is what normal multi-layer neural networks couldn''t do and the reason
    why it is said "a machine can learn a concept."


    Now, let''s think about the output. Please bear in mind that thinking about the
    output means thinking about how it learns. DBN and SDA have completely different
    approaches to learning, but both fill the following condition: to learn in order
    to equate output values and input values. You might think "What are you talking
    about?" but this is the technique that makes deep learning possible.


    The value comes and goes back to the input layer through the hidden layer, and
    the technique is to adjust the weight of the networks (that is, to equate the
    output value and the input value) to eliminate the error at that time. The graphical
    model can be illustrated as follows:


    ![](img/9315e45972ec0fbaf15f9144035bca79_87_0.png)'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'It looks different from standard neural networks at a glance, but there''s
    nothing special. If we intentionally draw the diagram of the input layer and the
    output layer separately, the mechanism is the same shape as the normal neural
    network:


    ![](img/9315e45972ec0fbaf15f9144035bca79_88_0.png)


    For a human, this action of *matching input and output* is not intuitive, but
    for a machine it is a valid action. If so, how it can learn features from input
    data by matching the output layer and input layer?


    Need a little explanation? Let''s think about it this way: in the algorithm of
    machine learning, including neural networks, learning intends to minimize errors
    between the model''s prediction output and the dataset output. The mechanism is
    to remove an error by finding a pattern from the input data and making data with
    a common pattern the same output value (for example, 0 or 1). What would then
    happen if we turned the output value into the input value?


    When we look at problems that should be solved as a whole through deep learning,
    input data is, fundamentally, a dataset that can be divided into some patterns.
    This means that there are some common features in the input data. If so, in the
    process of learning where each output value becomes respective input data, the
    weight of networks should be adjusted to focus more on the part that reflects
    the common features. And, even within the data categorized in the same class,
    learning should be processed to reduce weight on the non-common feature part,
    that is, the noise part.'
