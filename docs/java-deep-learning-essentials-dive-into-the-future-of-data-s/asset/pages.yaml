- pgno: 228
  md: "Each indexed input and label corresponds to x, y in givens, so when index is\
    \ given, the parameters are updated with updates. Therefore, we can train the\
    \ model with iterations of training epochs and mini-batches:\n\n```\nwhile (epoch\
    \ < n_epochs) and (not done_looping):\n    epoch = epoch + 1\n    for minibatch_index\
    \ in xrange(n_train_batches):\n        minibatch_avg_cost = train_model(minibatch_index)\n\
    ```\n\nThe original code has the test and validation part, but what we just mentioned\
    \ is the rudimentary structure. With Theano, equations of gradients will no longer\
    \ be derived.\n\n# TensorFlow\n\nTensorFlow is the library for machine learning\
    \ and deep learning developed by Google. The project page is https://www.tensorflow.org/\
    \ and all the code is open to the public on GitHub at https://github.com/tensorflow/tensorflow.\
    \ TensorFlow itself is written with C++, but it provides a Python and C++ API.\
    \ We focus on Python implementations in this book. The installation can be done\
    \ with pip, virtualenv, or docker. The installation guide is available at https://www.tensorflow.org/versions/master/get_started/os_setup.html.\
    \ After the installation, you can import and use TensorFlow by writing the following\
    \ code:\n\n```\nimport tensorflow as tf\n```\n\nTensorFlow recommends you implement\
    \ deep learning code with the following three parts:\n\n+   - inference(): This\
    \ makes predictions using the given data, which defines the model structure\n\
    +   - loss(): This returns the error values to be optimized\n+   - training():\
    \ This applies the actual training algorithms by computing gradients\n\nWe'll\
    \ follow this guideline. A tutorial on MNIST classifications for beginners is\
    \ introduced on https://www.tensorflow.org/versions/master/tutorials/mnist/beginners/index.html\
    \ and the code for this tutorial can be found in DLWJ/src/resources/tensorflow/1_1_mnist_simple.py.\
    \ Here, we consider refining the code introduced in the tutorial. You can see\
    \ all the code in DLWJ/src/resources/tensorflow/1_2_mnist.py."
  merge: -1
  img_proc: true
- pgno: 229
  md: "First, what we have to consider is fetching the MNIST data. Thankfully, TensorFlow\
    \ also provides the code to fetch the data in `https://github.com/tensorflow/tensorflow/blob/master/tensorflow/examples/tutorials/mnist/input_data.py`\
    \ and we put the code into the same directory. Then, by writing the following\
    \ code, you can import the MNIST data:\n\n```\n```python\nimport input_data\n\
    ```\n```\n\nMNIST data can be imported using the following code:\n\n```\n```python\n\
    mnist = input_data.read_data_sets(\"MNIST_data/\", one_hot=True)\n```\n```\n\n\
    Similar to Theano, we define the variable with no actual values as the placeholder:\n\
    \n```\n```python\nx_placeholder = tf.placeholder(\"float\", [None, 784])\nlabel_placeholder\
    \ = tf.placeholder(\"float\", [None, 10])\n```\n```\n\nHere, 784 is the number\
    \ of units in the input layer and 10 is the number in the output layer. We do\
    \ this because the values in the placeholder change in accordance with the mini-batches.\
    \ Once you define the placeholder you can move on to the model building and training.\
    \ We set the non-linear activation with the `softmax` function in `inference()`\
    \ here:\n\n```\n```python\ndef inference(x_placeholder):\n\n    W = tf.Variable(tf.zeros([784,\
    \ 10]))\n    b = tf.Variable(tf.zeros([10]))\n\n    y = tf.nn.softmax(tf.matmul(x_placeholder,\
    \ W) + b)\n\n    return y\n```\n```\n\nHere, W and b are the parameters of the\
    \ model. The loss function, that is, the `cross_entropy` function, is defined\
    \ in `loss()` as follows:\n\n```\n```python\ndef loss(y, label_placeholder):\n\
    \n    cross_entropy = - tf.reduce_sum(label_placeholder * tf.log(y))\n\n    return\
    \ cross_entropy\n```\n```\n\nWith the definition of `inference()` and `loss()`,\
    \ we can train the model by writing the following code:\n\n```\n```python\ndef\
    \ training(loss):\n    train_step = \n    tf.train.GradientDescentOptimizer(0.01).minimize(loss)\n\
    \n    return train_step\n```\n```"
  merge: -1
  img_proc: true
- pgno: 230
  md: "# *Other Important Deep Learning Libraries*\n\nGradientDescentOptimizer() applies\
    \ the gradient descent algorithm. But be careful, as this method just defines\
    \ the method of training and the actual training has not yet been executed. TensorFlow\
    \ also supports AdagradOptimizer(), MomentumOptimizer(), and other major optimizing\
    \ algorithms.\n\nThe code and methods explained previously are to define the model.\
    \ To execute the actual training, you need to initialize a session of TensorFlow:\n\
    \n```\n```python\ninit = tf.initialize_all_variables()\nsess.run(init)\n```\n\
    ```\n\nThen we train the model with mini-batches. All the data in a mini-batch\
    \ is stored in feed_dict and then used in sess.run():\n\n```\n```python\nfor i\
    \ in range(1000):\n        batch_xs, batch_ys = mnist.train.next_batch(100)\n\
    \        feed_dict = {x_placeholder: batch_xs, label_placeholder:\n        batch_ys}\n\
    \n        sess.run(train_step, feed_dict=feed_dict)\n```\n```\n\nThat's it for\
    \ the model training. It's very simple, isn't it? You can show the result by writing\
    \ the following code:\n\n```\n```python\ndef res(y, label_placeholder, feed_dict):\n\
    \    correct_prediction = tf.equal(\n        tf.argmax(y, 1), tf.argmax(label_placeholder,\
    \ 1)\n    )\n\n    accuracy = tf.reduce_mean(\n        tf.cast(correct_prediction,\
    \ \"float\")\n    )\n\n    print sess.run(accuracy, feed_dict=feed_dict)\n```\n\
    ```\n\nTensorFlow makes it super easy to implement deep learning and it is very\
    \ useful. Furthermore, TensorFlow has another powerful feature, TensorBoard, to\
    \ visualize deep learning. By adding a few lines of code to the previous code\
    \ snippet, we can use this useful feature.\n\nLet's see how the model is visualized\
    \ first. The code is in DLW/src/resources/tensorflow/1_3_mnist_TensorBoard.py,\
    \ so simply run it. After you run the program, type the following command:\n\n\
    ```\n```bash\n$ tensorboard --logdir=<ABSOLUTE_PATH>/data\n```\n```"
  merge: -1
  img_proc: true
