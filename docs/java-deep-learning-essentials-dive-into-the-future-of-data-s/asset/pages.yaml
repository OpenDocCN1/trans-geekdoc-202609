- pgno: 248
  md: '# What''s Next?


    The information on Deep Learning News is not updated that frequently, but it has
    tips not only for implementation or technique, but also tips for what field you
    can use for deep learning, and has deep learning and machine learning related
    event information, so it can be useful for ideation or inspiration. If you take
