  img_proc: true
- pgno: 129
  md: 'Since both the rectifier and the derivative of it are very sparse, we can easily
    imagine that the neural networks will be also sparse through training. You may
    have also noticed that we no longer have to worry about gradient saturations because
    we don''t have the causal curves that the sigmoid function and hyperbolic tangent
    contain anymore.


    With the technique of dropout and the rectifier, a simple deep neural network
    can learn a problem without pre-training. In terms of the equations used to implement
    the dropout algorithm, they are not difficult because they are just simple methods
    of adding dropout masks to multi-layer perceptrons. Let''s look at them in order:


    $$Z_j = h\left(\sum_i w_{ji} x_i + b_j\right)$$


    Here, $h(\cdot)$ denotes the activation function, which is, in this case, the
    rectifier. You see, the previous equation is for units in the hidden layer without
    dropout. What the dropout does is just apply the mask to them. It can be represented
    as follows:


    $$Z_j = h\left(\sum_i w_{ji} x_i + b_j\right) m_j$$


    $$m_j \sim \text{Bernoulli}(1 - p)$$


    Here, $p$ denotes the probability of dropout, which is generally set to 0.5. That''s
    all for forward activation. As you can see from the equations, the term of the
    binary mask is the only difference from the ones of general neural networks. In
    addition, during backpropagation, we also have to add masks to the delta. Suppose
    we have the following equation:


    $$a_j = \sum_i w_{ji} x_i + b_j$$'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'With this, we can define the delta as follows:


    $$\delta_j := \frac{\partial E_n}{\partial a_j} = \sum_k \frac{\partial E_n}{\partial
    a_k}\frac{\partial a_k}{\partial a_j}$$


    Here, $E_n$ denotes the evaluation function (these equations are the same as we
    mentioned in *Chapter 2, Algorithms for Machine Learning – Preparing for Deep
    Learning*).


    We get the following equation:


    $$a_k = \sum_j w_{kj}z_j + c_k$$

    $$= \sum_j w_{kj}h(a_j)m_j + c_k$$


    Here, the delta can be described as follows:


    $$\delta_j = h''(a_j)m_j\sum_k \delta_k w_{kj}$$


    Now we have all the equations necessary for implementation, let''s dive into the
    implementation. The package structure is as follows:


    ![](img/9315e45972ec0fbaf15f9144035bca79_130_0.png)'
