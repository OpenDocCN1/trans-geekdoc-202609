  img_proc: true
- pgno: 66
  md: 'What we need to do now is maximize the likelihood function, but the calculation
    is worrying because the function has a mathematical product. To make the calculation
    easier, we take the logarithm (log) of the likelihood function. Additionally,
    we substitute the sign to turn the object to minimizing the negative log likelihood
    function. Since the log is the monotonic increase, the magnitude correlation doesn''t
    change. The equation can be represented as follows:


    $$E(w,b) = -\ln L(w,b) = -\sum_{n=1}^{N}\{t_n \ln y_n + (1-t_n)\ln(1-y_n)\}$$


    You can see the error function at the same time. This type of function is called
    a cross-entropy error function.


    Similar to perceptrons, we can optimize the model by computing the gradients of
    the model parameters, $w$ and $b$. The gradients can be described as follows:


    $$\frac{\partial E(w,b)}{\partial w} = -\sum_{n=1}^{N}(t_n - y_n)x_n$$


    $$\frac{\partial E(w,b)}{\partial b} = -\sum_{n=1}^{N}(t_n - y_n)$$


    With these equations, we can update the model parameters as follows:


    $$w^{(k+1)} = w^{(k)} - \eta \frac{\partial E(w,b)}{\partial w} = w^{(k)} + \eta
    \sum_{n=1}^{N}(t_n - y_n)x_n$$


    $$b^{(k+1)} = b^{(k)} - \eta \frac{\partial E(w,b)}{\partial b} = b^{(k)} + \eta
    \sum_{n=1}^{N}(t_n - y_n)$$


    Theoretically, we have no problem using the equations just mentioned and implementing
    them. As you can see, however, you have to calculate the sum of all the data to
    compute the gradients for each iteration. This will hugely increase the calculation
    cost once the size of a dataset becomes big.'
