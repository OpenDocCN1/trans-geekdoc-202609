    \ Please be careful that the supported versions of JDK are 1.7 or above. This\
    \ may not be a problem because we needed version 1.8 or above in the previous\
    \ chapters. Once you have set it up without a problem, you can confirm the structure\
    \ of the directories as follows:\n\n![](img/9315e45972ec0fbaf15f9144035bca79_171_0.png)\n\
