- pgno: 173
  md: '# Build


    Let''s look at the source code in the examples and see how to build a deep learning
    model. During the process, the terms of deep learning that you haven''t yet learned
    are also briefly explained. The examples are implemented with various models such
    as MLP, DBN, and CNN, but there is one problem here. As you can see when looking
    at README.md, some methods don''t generate good precision. This is because, as
    explained in the previous section, the calculation precision a machine has is
    limited and fluctuation occurring with calculated values during the process depends
    completely on the difference of implementation. Hence, practically, learning can''t
    be done properly, although theoretically it should be done well. You can get better
    results by, for example, changing the seed values or adjusting the parameters,
    but as we would like to focus on how to use a library, we''ll use a model that
    gets higher precision as an example.


    # DBNIrisExample.java


    Let''s first look at DBNIrisExample.java in the package of deepbelief. Iris, contained
    in the filename, is one of the benchmark datasets often used when measuring the
    precision or accuracy of a machine learning method. The dataset contains 150 pieces
    of data out of 3 classes of 50 instances each, and each class refers to a type
    of Iris plant. The number of inputs is 4 and the number of outputs is therefore
    3. One class is linearly separable from the other two; the latter are not linearly
    separable from each other.


    The implementation begins by setting up the configuration. Here are the variables
    that need setting:


    ```

    final int numRows = 4;

    final int numColumns = 1;

    int outputNum = 3;

    int numSamples = 150;

    int batchSize = 150;

    int iterations = 5;

    int splitTrainNum = (int) (batchSize * .8);

    int seed = 123;

    int listenerFreq = 1;

    ```'
  merge: -1
  img_proc: true
- pgno: 174
  md: "In DL4J, input data can be up to two-dimensional data, hence you need to assign\
    \ the number of rows and columns of the data. As Iris is one-dimensional data,\
    \ `numColumns` is set as 1. Here `numSamples` is the total data and `batchSize`\
    \ is the amount of data in each mini-batch. Since the total data is 150 and it\
    \ is relatively small, `batchSize` is set at the same number. This means that\
    \ learning is done without splitting the data into mini-batches. `splitTrainNum`\
    \ is the variable that decides the allocation between the training data and test\
    \ data. Here, 80% of all the dataset is training data and 20% is the test data.\
    \ In the previous section, `listenerFreq` decides how often we see loss function's\
    \ value for logging is seen in the process. This value is set to 1 here, which\
    \ means the value is logged after each epoch.\n\nSubsequently, we need to fetch\
    \ the dataset. In DL4J, a class that can easily fetch data with respect to a typical\
    \ dataset, such as Iris, MINST, and LFW, is prepared. Therefore, you can just\
    \ write the following line if you would like to fetch the Iris dataset:\n\n```\n\
    DataSetIterator iter = new IrisDataSetIterator(batchSize, numSamples);\n```\n\n\
    The following two lines are to format data:\n\n```\nDataSet next = iter.next();\n\
    next.normalizeZeroMeanZeroUnitVariance();\n```\n\nThis code splits the data into\
    \ training data and test data and stores them respectively:\n\n```\nSplitTestAndTrain\
    \ testAndTrain =\nnext.splitTestAndTrain(splitTrainNum, new Random(seed));\nDataSet\
    \ train = testAndTrain.getTrain();\nDataSet test = testAndTrain.getTest();\n```\n\
    \nAs you can see, it makes data handling easier by treating all the data DL4J\
    \ prepares with the DataSet class.\n\nNow, let's actually build a model. The basic\
    \ structure is as follows:\n\n```\nMultiLayerConfiguration conf = new\nNeuralNetConfiguration.Builder().layer().layer()\
    \ ... .layer().build();\nMultiLayerNetwork model = new MultiLayerNetwork(conf);\n\
    model.init();\n```\n\nThe code begins by defining the model configuration and\
    \ then builds and initializes the actual model with the definition. Let's take\
    \ a look at the configuration details. At the beginning, the whole network is\
    \ set up:\n\n```\nMultiLayerConfiguration conf = new NeuralNetConfiguration.Builder()\n\
    \    .seed(seed)\n    .iterations(iterations)\n```"
