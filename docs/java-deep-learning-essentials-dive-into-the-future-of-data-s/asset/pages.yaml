  md: '$E(W,b) = -\ln L(W,b) = -\sum_{n=1}^{N}\sum_{k=1}^{K} t_{nk} \ln y_{nk}$


    Here, $W = [w_1, ..., w_j, ..., w_K]$, $y_{nk} = y_k(x_n)$. Also, $t_{nk}$ is
    the Kth element of the correct data vector, $t_n$, which corresponds to the $n^{th}$
    training data. If an input data belongs to the class $k$, the value of $t_{nk}$
    is 1; the value is 0 otherwise.


    Gradients of the loss function against the model parameters, the weight vector,
    and the bias, can be described as follows:


    $\frac{\partial E}{\partial w_j} = -\sum_{n=1}^{N} (t_{nj} - y_{nj}) x_n$


    $\frac{\partial E}{\partial b_j} = -\sum_{n=1}^{N} (t_{nj} - y_{nj})$


