- pgno: 150
  md: "Once the model is built, we need to train it. In the train method, we cache\
    \ all the forward-propagated data so that we can utilize it when backpropagating:\n\
    \n```\n```java\n// cache pre-activated, activated, and downsampled inputs of each\n\
    // convolution + pooling layer for backpropagation\nList<double[][][]> preActivated_X\
    \ = new ArrayList<>(nKernels.\nlength);\nList<double[][][]> activated_X = new\
    \ ArrayList<>(nKernels.length);\nList<double[][][]> downsampled_X = new ArrayList<>(nKernels.\n\
    length+1);  // +1 for input X\ndownsampled_X.add(X);\n\nfor (int i = 0; i < nKernels.length;\
    \ i++) {\n    preActivated_X.add(new\n    double[minibatchSize][nKernels[i]][convolvedSizes[i][0]]\n\
    \    [convolvedSizes[i][1]]);\n    activated_X.add(new\n    double[minibatchSize][nKernels[i]][convolvedSizes[i][0]]\n\
    \    [convolvedSizes[i][1]]);\n    downsampled_X.add(new\n    double[minibatchSize][nKernels[i]][convolvedSizes[i][0]]\n\
    \    [convolvedSizes[i][1]]);\n}\n```\n```\n\npreActivated_X is defined for convolved\
    \ feature maps, activated_X for activated features, and downsampled_X for downsampled\
    \ features. We put and cache the original data into downsampled_X. The actual\
    \ training begins with forward propagation through convolution and max-pooling:\n\
    \n```\n```java\n// forward convolution + pooling layers\ndouble[][][] z_ = X[n].clone();\n\
    for (int i = 0; i < nKernels.length; i++) {\n    z_ = convolutionLayers[i].forward(z_,\
    \ preActivated_X.get(i)[n],\n    activated_X.get(i)[n]);\n    downsampled_X.get(i+1)[n]\
    \ = z_.clone();\n}\n```\n```\n\nThe forward method of ConvolutionPoolingLayer\
    \ is simple and consists of convolve and downsample. The convolve function does\
    \ the convolution, and downsample does the max-pooling:\n\n```\n```java\npublic\
    \ double[][][] forward(double[][][] x, double[][][]\npreActivated_X, double[][][]\
    \ activated_X) {\n\n    double[][][] z = this.convolve(x, preActivated_X, activated_X);\n\
    \    return  this.downsample(z);\n}\n```\n```"
