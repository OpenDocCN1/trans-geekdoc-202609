- pgno: 39
  md: '# 2


    # Algorithms for Machine

    Learning – Preparing for

    Deep Learning


    In the previous chapter, you read through how deep learning has been developed
    by looking back through the history of AI. As you should have noticed, machine
    learning and deep learning are inseparable. Indeed, you learned that deep learning
    is the developed method of machine learning algorithms.


    In this chapter, as a pre-exercise to understand deep learning well, you will
    see the more details of machine learning, and in particular, you will learn the
    actual code for the method of machine learning, which is closely related to deep
    learning.


    In this chapter, we will cover the following topics:


    +   - The core concepts of machine learning

    +   - An overview of popular machine learning algorithms, especially focusing
    on neural networks

    +   - Theories and implementations of machine learning algorithms related to deep
    learning: perceptrons, logistic regression, and multi-layer perceptrons


    # Getting started


    We will insert the source code of machine learning and deep learning with Java
