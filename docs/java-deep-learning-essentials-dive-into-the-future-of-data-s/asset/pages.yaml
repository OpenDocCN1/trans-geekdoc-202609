- pgno: 232
  md: "# Other Important Deep Learning Libraries\n\nWhen you click on **inference**\
    \ on the page, you can see the model structure:\n\n![](img/9315e45972ec0fbaf15f9144035bca79_232_0.png)\n\
    \nNow let's look inside the code. To enable visualization, you need to wrap the\
    \ whole area with the scope: `with tf.Graph().as_default()`. By adding this scope,\
    \ all the variables declared in the scope will be displayed in the graph. The\
    \ displayed name can be set by including the name label as follows:\n\n```\n```python\n\
    x_placeholder = tf.placeholder(\"float\", [None, 784], name=\"input\")\nlabel_placeholder\
    \ = tf.placeholder(\"float\", [None, 10],\nname=\"label\")\n```\n```\n\nDefining\
    \ other scopes will create nodes in the graph and this is where the division,\
    \ `inference()`, `loss()`, and `training()` reveal their real values. You can\
    \ define the respective scope without losing any readability:\n\n```\n```python\n\
    def inference(x_placeholder):\n    with tf.name_scope('inference') as scope:\n\
    \        W = tf.Variable(tf.zeros([784, 10]), name=\"W\")\n        b = tf.Variable(tf.zeros([10]),\
    \ name=\"b\")\n\n        Y = tf.nn.softmax(tf.matmul(x_placeholder, W) + b)\n\
    ```\n```"
