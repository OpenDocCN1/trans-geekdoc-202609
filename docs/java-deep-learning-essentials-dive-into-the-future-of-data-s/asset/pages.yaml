- pgno: 203
  md: 'The difference between standard neural networks is that RNN has connections
    between hidden layers with respect to time. The input at time $t$ is activated
    in the hidden layer at time $t$, preserved in the hidden layer, and then propagated
    to the hidden layer at time $t+1$ with the input at time $t+1$. This enables the
    networks to contain the states of past data and reflect them. You might think
    that RNN is rather a dynamic model, but if you unfold the model at each time step,
    you can see that RNN is a static model:


    ![](img/9315e45972ec0fbaf15f9144035bca79_203_0.png)


    Since the model structure at each time step is the same as in general neural networks,
    you can train this model using the backpropagation algorithm. However, you need
    to consider time relevance when training, and there is a technique called **Backpropagation
    through Time (BPTT)** to handle this. In BPTT, the errors and gradients of the
    parameter are backpropagated to the layers of the past:


    ![](img/9315e45972ec0fbaf15f9144035bca79_203_1.png)'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'Thus, RNN can preserve contexts within the model. Theoretically, the network
    at each time step should consider the whole sequence up to then, but practically,
    time windows with a certain length are often applied to the model to make the
    calculation less complicated or to prevent the vanishing gradient problem and
    the exploding gradient problem. BPTT has enabled training among layers and this
    is why RNN is often considered to be one of the deep neural networks. We also
    have algorithms of deep RNN such as stacked RNN where hidden layers are stacked.


    RNN has been adapted for NLP, and is actually one of the most successful models
    in this field. The original model optimized for NLP is called the **recurrent
    neural network language model (RNNLM)**, introduced by Mikolov et al. (http://www.fit.vutbr.cz/research/groups/speech/publi/2010/mikolov_interspeech2010_IS100722.pdf).
    The model architecture can be illustrated as follows:


    ![](img/9315e45972ec0fbaf15f9144035bca79_204_0.png)


    The network has three layers: an input layer $x$, a hidden layer $s$, and an output
    layer $y$. The hidden layer is also often called the context layer or the state
    layer. The value of each layer with respect to the time $t$ can be represented
    as follows:'
  merge: -1
  img_proc: true
- pgno: 205
  md: '$$\begin{aligned}

    x_t &= w_t + s_{t-1} \\

    s_t &= f(Uw_t + Ws_{t-1}) \\

    y_t &= g(Vs_t)

    \end{aligned}$$


    Here, $f(\cdot)$ denotes the sigmoid function, and $g(\cdot)$ the softmax function.
    Since the input layer contains the state layer at time $t-1$, it can reflect the
    whole context to the network. The model architecture implies that RNNLM can look
    up much broader contexts than feed-forward NNLM, in which the length of the context
    is constrained to $N$ (-gram).


    The whole time and the entire context should be considered while training RNN,
    but as mentioned previously, we often truncate the time length because BPTT requires
    a lot of calculations and often causes the gradient vanishing/exploding problem
    when learning long-term dependencies, hence the algorithm is often called **truncated
    BPTT**. If we unfold RNNLM with respect to time, the model can be illustrated
    as follows (in the figure, the unfolded time $\tau = 3$):


    ![](img/9315e45972ec0fbaf15f9144035bca79_205_0.png)'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Here $d_t$ is the label vector of the output. Then, the error vector of the
    output can be represented as follows:


    $$\delta_t^{out} = d_t - y_t$$


    We get the following equation:


    $$\delta_t^{hidden} = d\left(\left(\delta_t^{out}\right)^T V, t\right)$$


    Here $T$ is the unfolding time:


    $$d(x,t) = x s_t (1 - s_t)$$


    The preceding image is the derivative of the activation function of the hidden
    layer. Since we use the sigmoid function here, we get the preceding equation.
    Then, we can get the error of the past as follows:


    $$\delta_{t-\tau-1}^{hidden} = d\left(\left(\delta_{t-\tau}^{out}\right)^T V,
    t - \tau - 1\right)$$


    With these equations, we can now update the weight matrices of the model:


    $$V_{t+1} = V_t + s_t \left(\delta_t^{out}\right)^T \alpha$$


    $$U_{t+1} = U_t + \sum_{\tau=0}^{T} w_{t-\tau} \left(\delta_{t-\tau}^{hidden}\right)^T
    \alpha$$


    $$W_{t+1} = W_t + \sum_{\tau=0}^{T} w_{t-\tau-1} \left(\delta_{t-\tau}^{hidden}\right)^T
    \alpha$$'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'Here, *α* is the learning rate. What is interesting in RNNLM is that each vector
    in the matrix shows the difference between words after training. This is because
    *U* is the matrix that maps each word to a latent space, so after the training,
    mapped word vectors contain the meaning of the words. For example, the vector
    calculation of "king" − "man" + "woman" would return "queen". DL4J supports RNN,
    so you can easily implement this model with the library.


    # ## Long short term memory networks


    Training with the standard RNN requires the truncated BPTT. You might well doubt
    then that BPTT can really train the model enough to reflect the whole context,
    and this is very true. This is why a special kind of RNN, the **long short term
    memory (LSTM)** network, was introduced to solve the long-term dependency problem.
    LSTM is rather intimidating, but let''s briefly explore the concept of LSTM.


    To begin with, we have to think about how we can store and tell past information
    in the network. While the gradient exploding problem can be mitigated simply by
    setting a ceiling to the connection, the gradient vanishing problem still needs
    to be deeply considered. One possible approach is to introduce a unit that permanently
    preserves the value of its inputs and its gradient. So, when you look at a unit
    in the hidden layer of standard neural networks, it is simply described as follows:


    ![](img/9315e45972ec0fbaf15f9144035bca79_207_0.png)


    There''s nothing special here. Then, by adding a unit below to the network, the
    network can now memorize the past information within the neuron. The neuron added
    here has linear activation and its value is often set to 1. This neuron, or cell,
    is called **constant error carousel (CEC)** because the error stays in the neuron
    like a carousel and won''t vanish. CEC works as a storage cell and stores past
    inputs. This solves the gradient vanishing problem, but raises another problem.
    Since all data propagated through is stocked in the neuron, it probably stores
    noise data as well:


    ![](img/9315e45972ec0fbaf15f9144035bca79_207_1.png)'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'This problem can be broken down into two problems: *input weight conflicts*
    and *output weight conflicts*. The key idea of input weight conflicts is to keep
    certain information within the network until it''s necessary; the neuron is to
    be activated only when the relevant information comes, but is not to be activated
    otherwise. Similarly, output weight conflicts can occur in all types of neural
    networks; the value of neurons is to be propagated only when necessary, and not
    to be propagated otherwise. We can''t solve these problems as long as the connection
    between neurons is represented with the weight of the network. Therefore, another
    method or technique of representation is required that controls the propagation
    of inputs and outputs. But how do we do this? The answer is putting units that
    act like "gates" before and behind the CEC, and these are called **input gate**
    and **output gate**, respectively. The graphical model of the gate can be described
    as follows:


    ![](img/9315e45972ec0fbaf15f9144035bca79_208_0.png)


    Ideally, the gate should return the discrete value of 0 or 1 corresponding to
    the input, 0 when the gate is closed and 1 when open, because it is a gate, but
    programmatically, the gate is set to return the value in the range of 0 to 1 so
    that it can be well trained with BPTT.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'It may seem like we can now put and fetch exact information at an exact time,
    yet another problem still remains. With just two gates, the input gate and output
    gate, memories stored in the CEC can''t be refreshed easily in a few steps. Therefore,
    we need an additional gate that dynamically changes the value of the CEC. To do
    this, we add a **forget gate** to the architecture to control when the memory
    should be erased. The value preserved in the CEC is overridden with a new memory
    when the value of the gate takes a 0 or close to it. With these three gates, a
    unit can now memorize information or contexts of the past, and so it is called
    an **LSTM block** or an **LSTM memory block** because it is more of a block than
    a single neuron. The following is a figure that represents an LSTM block:


    ![](img/9315e45972ec0fbaf15f9144035bca79_209_0.png)'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'The standard LSTM structure was fully explained previously, but there''s a
    technique to get better performance from it, which we''ll explain now. Each gate
    receives connections from the input units and the outputs of all the units in
    LSTM, but there is no direct connection from the CEC. This means we can''t see
    the true hidden state of the network because the output of a block depends so
    much on the output gate; as long as the output gate is closed, none of the gates
    can access the CEC and it is devoid of essential information, which may debase
    the performance of LSTM. One simple yet effective solution is to add connections
    from the CEC to the gates in a block. These are called peephole connections, and
    act as standard weighted connections except that no errors are backpropagated
    from the gates through the peephole connections. The peephole connections let
    all gates assume the hidden state even when the output gate is closed. You''ve
    learned a lot of terms now, but as a result, the basic architecture of the whole
    connection can be described as follows:


    ![](img/9315e45972ec0fbaf15f9144035bca79_210_0.png)'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'For simplicity, a single LSTM block is described in the figure. You might be
    daunted because the preceding model is very intricate. However, when you look
    at the model step by step, you can understand how an LSTM network has figured
    out how to overcome difficulties in NLP. Given an input sequence $x=(x_1,\ldots,x_T)$,
    each network unit can be calculated as follows:


    $$\begin{aligned}

    i_t &= \sigma(W_{ix}x_t + W_{im}m_{t-1} + W_{ic}c_{t-1} + b_i) \\

    f_t &= \sigma(W_{fx}x_t + W_{fm}m_{t-1} + W_{fc}c_{t-1} + b_f) \\

    c_t &= f_t \odot c_{t-1} + i_t \odot g(W_{cx}x_t + W_{cm}m_{t-1} + b_c) \\

    o_t &= \sigma(W_{ox}x_t + W_{om}m_{t-1} + W_{oc}c_t + b_o) \\

    m_t &= o_t \odot h(c_t) \\

    y_t &= s(W_{ym}m_t + b_y)

    \end{aligned}$$


    In the preceding formulas, $W_{ix}$ is the matrix of weights from the input gate
    to the input, $W_{fx}$ is the one from the forget gate to the input, and $W_{ox}$
    is the one from the output gate to the input. $W_{cs}$ is the weight matrix from
    the cell to the input, $W_{cm}$ is the one from the cell to the LSTM output, and
    $W_{ym}$ is the one from the output to the LSTM output. $W_{ic}$, $W_{fc}$, and
    $W_{oc}$ are diagonal weight matrices for peephole connections. The $b$ terms
    denote the bias vectors, $b_i$ is the input gate bias vector, $b_f$ is the forget
    gate bias vector, $b_o$ is the output gate bias vector, $b_c$ is the CEC cell
    bias vector, and $b_y$ is the output bias vector. Here, $g$ and $h$ are activation
    functions of the cell input and cell output. $\sigma$ denotes the sigmoid function,
    and $s(\cdot)$ the softmax function. $\odot$ is the element-wise product of the
    vectors.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'We won''t follow the further math equations in this book because they become
    too complicated just by applying BPTT, but you can try LSTM with DL4J as well
    as RNN. As CNN was developed within the field of image recognition, RNN and LSTM
    have been developed to resolve the issues of NLP that arise one by one. While
    both algorithms are just one approach to get a better performance using NLP and
    still need to be improved, since we are living beings that communicate using languages,
    the development of NLP will certainly lead to technological innovations. For applications
    of LSTM, you can reference *Sequence to Sequence Learning with Neural Networks*
    (Sutskever et al., http://arxiv.org/pdf/1409.3215v3.pdf), and for more recent
    algorithms, you can reference *Grid Long Short-Term Memory* (Kalchbrenner et al.,
    http://arxiv.org/pdf/1507.01526v1.pdf) and *Show, Attend and Tell: Neural Image
    Caption Generation with Visual Attention* (Xu et al., http://arxiv.org/pdf/1502.03044v2.pdf).


    # The difficulties of deep learning


    Deep learning has already got higher precision than humans in the image recognition
    field and has been applied to quite a lot of practical applications. Similarly,
    in the NLP field, many models have been researched. Then, how much deep learning
    is utilized in other fields? Surprisingly, there are still few fields where deep
    learning is successfully utilized. This is because deep learning is indeed innovative
    compared to past algorithms and definitely lets us take a big step towards materializing
    AI; however, it has some problems when used for practical applications.


    The first problem is that there are too many model parameters in deep learning
    algorithms. We didn''t look in detail when you learned about the theory and implementation
    of algorithms, but actually deep neural networks have many hyper parameters that
    need to be decided compared to the past neural networks or other machine learning
    algorithms. This means we have to go through more trial and error to get high
    precision. Combinations of parameters that define a structure of neural networks,
    such as how many hidden layers are to be set or how many units each hidden layer
    should have, need lots of experiments. Also, the parameters for training and test
    configurations such as the learning rate need to be determined. Furthermore, peculiar
    parameters for each algorithm such as the corruption level in SDA and the size
    of kernels in CNN need additional trial and error. Thus, the great performance
    that deep learning provides is supported by steady parameter-tuning. However,
    people only look at one side of deep learning – that it can get great precision
    – and they tend to forget the hard process required to reach that point. Deep
    learning is not magic.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'In addition, deep learning often fails to train and classify data from simple
    problems. The shape of deep neural networks is so deep and complicated that the
    weights can''t be well optimized. In terms of optimization, data quantities are
    also important. This means that deep neural networks require a significant amount
    of time for each training. To sum up, deep learning shows its worth when:


    +   - It solves complicated and hard problems when people have no idea what feature
    they can be classified as

    +   - There is sufficient training data to properly optimize deep neural networks


    Compared to applications that constantly update a model using continuously updated
    data, once a model is built using a large-scale dataset that doesn''t change drastically,
    applications that use the model universally are rather well suited for deep learning.


    Therefore, when you look at business fields, you can say that there are more cases
    where the existing machine learning can get better results than using deep learning.
    For example, let''s assume we would like to recommend appropriate products to
    users in an EC. In this EC, many users buy a lot of products daily, so purchase
    data is largely updated daily. In this case, do you use deep learning to get high-precision
    classification and recommendations to increase the conversion rates of users''
    purchases using this data? Probably not, because using the existing machine learning
    algorithms such as Naive Bayes, collaborative filtering, SVM, and so on, we can
    get sufficient precision from a practical perspective and can update the model
    and calculate quicker, which is usually more appreciated. This is why deep learning
    is not applied much in business fields. Of course, getting higher precision is
    better in any field, but in reality, higher precision and the necessary calculation
    time are in a trade-off relationship. Although deep learning is significant in
    the research field, it has many hurdles yet to clear considering practical applications.


    Besides, deep learning algorithms are not perfect, and they still need many improvements
    to their model itself. For example, RNN, as mentioned earlier, can only satisfy
    either how past information can be reflected to a network or how precision can
    be obtained, although it''s contrived with techniques such as LSTM. Also, deep
    learning is still far from the true AI, although it''s definitely a great technique
    compared to the past algorithms. Research on algorithms is progressing actively,
    but in the meantime, we need one more breakthrough to spread out and infiltrate
    deep learning into broader society. Maybe this is not just the problem of a model.
    Deep learning is suddenly booming because it is reinforced by huge developments
    in hardware and software. Deep learning is closely related to development of the
    surrounding technology.'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'As mentioned earlier, there are still many hurdles to clear before deep learning
    can be applied more practically in the real world, but this is not impossible
    to achieve. It isn''t possible to suddenly invent AI to achieve technological
    singularity, but there are some fields and methods where deep learning can be
    applied right away. In the next section, we''ll think about what kinds of industries
    deep learning can be utilized in. Hopefully, it will sow the seeds for new ideas
    in your business or research fields.


    # The approaches to maximizing deep learning possibilities and abilities


    There are several approaches to how we can apply deep learning to various industries.
    While it is true that an approach could be different depending on the task or
    purpose, we can briefly categorize the approaches in the following three ways:


    +   - **Field-oriented approach**: This utilizes deep learning algorithms or models
    that are already thoroughly researched and can lead to great performance

    +   - **Breakdown-oriented approach**: This replaces the problems to be solved
    that deep learning can apparently be applied to with a different problem where
    deep learning can be well adopted

    +   - **Output-oriented approach**: This explores new ways of how we express the
    output with deep learning


    These approaches are all explained in detail in the following subsections. Each
    approach is divided into its suitable industries or areas where it is not suitable,
    but any of them could be a big hint for your activities going forward. There are
    still very few use cases of deep learning and bias against fields of use, but
    this means there should be many chances to create innovative and new things. Start-ups
    that utilize deep learning have been emerging recently and some of them have already
    achieved success to some extent. You can have a significant impact on the world
    depending on your ideas.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Field-oriented approach


    This approach doesn''t require new techniques or algorithms. There are obviously
    fields that are well suited to the current deep learning techniques, and the concept
    here is to dive into these fields. As explained previously, since deep learning
    algorithms that have been practically studied and developed are mostly in image
    recognition and NLP, we''ll explore some fields that can work in great harmony
    with them.


    # Medicine


    Medical fields should be developed by deep learning. Tumors or cancers are detected
    on scanned images. This means nothing more than being able to utilize one of the
    strongest features of deep learning – the technique of image recognition. It is
    possible to dramatically increase precision using deep learning to help with the
    early detection of an illness and identifying the kind of illness. Since CNN can
    be applied to 3D images, 3D scanned images should be able to be analyzed relatively
    easily. By adopting deep learning more in the current medical field, deep learning
    should greatly contribute.


    We can also say that deep learning can be significantly useful for the medical
    field in the future. The medical field has been under strict regulations; however,
    there is a movement progressing to ease the regulations in some countries, probably
    because of the recent development of IT and its potential. Therefore, there will
    be opportunities in business for the medical field and IT to have a synergistic
    effect. For example, if telemedicine is more infiltrated, there is the possibility
    that diagnosing or identifying a disease can be done not only by a scanned image,
    but also by an image shown in real time on a display. Also, if electronic charts
    become widespread, it would be easier to analyze medical data using deep learning.
    This is because medical records are compatible with deep learning as they are
    a dataset of texts and images. Then the symptoms of unknown diseases can be found.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# # Automobiles


    We can say that the surroundings of running cars are image sequences and text.
    Other cars and views are images and a road sign has text. This means we can also
    utilize deep learning techniques here, and it is possible to reduce the risk of
    accidents by improving driving assistance functions. It can be said that the ultimate
    type of driving assistance is self-driving cars, which is being tackled mainly
    by Google and Tesla. An example that is both famous and fascinating was when George
    Hotz, the first person to hack the iPhone, built a self-driving car in his garage.
    The appearance of the car was introduced in an article by Bloomberg Business (http://www.bloomberg.com/features/2015-george-hotz-self-driving-car/),
    and the following image was included in the article:


    ![](img/9315e45972ec0fbaf15f9144035bca79_216_0.png)


    Self-driving cars have been already tested in the U.S., but since other countries
    have different traffic rules and road conditions, this idea requires further studying
    and development before self-driving cars are commonly used worldwide. The key
    to success in this field is in learning and recognizing surrounding cars, people,
    views, and traffic signs, and properly judging how to process them.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'In the meantime, we don''t have to just focus on utilizing deep learning techniques
    for the actual body of a car. Let''s assume we could develop a smartphone app
    that has the same function as we just described, that is, recognizing and classifying
    surrounding images and text. Then, if you just set up the smartphone in your car,
    you could utilize it as a car-navigation app. In addition, for example, it could
    be used as a navigation app for blind people, providing them with good, reliable
    directions.


    # # Advert technologies


    Advert (ad) technologies could expand their coverage with deep learning. When
    we say ad technologies, this currently means recommendation or ad networks that
    optimize ad banners or products to be shown. On the other hand, when we say advertising,
    this doesn''t only mean banners or ad networks. There are various kinds of ads
    in the world depending on the type of media, such as TV ads, radio ads, newspaper
    ads, posters, flyers, and so on. We have also digital ad campaigns with YouTube,
    Vine, Facebook, Twitter, Snapchat, and so on. Advertising itself has changed its
    definition and content, but all ads have one thing in common: they consist of
    images and/or language. This means that they are fields that deep learning is
    good at. Until now, we could only use user-behavior-based indicators, such as
    **page view (PV), click through rate (CTR), and conversion rate (CVR)**, to estimate
    the effect of an ad, but if we apply deep learning technologies, we might be able
    to analyze the actual content of an ad and autogenerate ads going forward. Especially
    since movies and videos can only be analyzed as a result of image recognition
    and NLP, video recognition, not image recognition, will gather momentum besides
    ad technologies.


    # # Profession or practice


    Professions such as doctor, lawyer, patent attorney, and accountant are considered
    to be roles that deep learning can replace. For example, if NLP''s precision and
    accuracy gets higher, any perusal that requires expertise can be left to a machine.
    As a machine can cover these time-consuming reading tasks, people can focus more
    on high-value tasks. In addition, if a machine classifies past judicial cases
    or medical cases on what disease caused what symptoms and so on, we would be able
    to build an app like Apple''s Siri that answers simple questions that usually
    require professional knowledge. Then the machine could handle these professional
    cases to some extent if a doctor or a lawyer is too busy to help in a timely manner.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'It''s often said that AI takes away a human''s job, but personally, this seems
    incorrect. Rather, a machine takes away menial work, which should support humans.
    A software engineer who works on AI programming can be described as having a professional
    job, but this work will also be changed in the future. For example, think about
    a car-related job, where the current work is building standard automobiles, but
    in the future, engineers will be in a position just like pit crews for Formula
    1 cars.


    # Sports


    Deep learning can certainly contribute to sports as well. In the study field known
    as sports science, it has become increasingly important to analyze and examine
    data from sports. As an example, you may know the book or movie *Moneyball*. In
    this film, they hugely increased the win percentage of the team by adopting a
    regression model in baseball. Watching sports itself is very exciting, but on
    the other hand, sport can be seen as a chunk of image sequences and number data.
    Since deep learning is good at identifying features that humans can''t find, it
    will become easier to find out why certain players get good scores while others
    don''t.


    These fields we have mentioned are only a small part of the many fields where
    deep learning is capable of significantly contributing to development. We have
    looked into these fields from the perspective of whether a field has images or
    text, but of course deep learning should also show great performance for simple
    analysis with general number data. It should be possible to apply deep learning
    to various other fields, such as bioinformatics, finance, agriculture, chemistry,
    astronomy, economy, and more.


    # Breakdown-oriented approach


    This approach might be similar to the approach considered in traditional machine
    learning algorithms. We already talked about how feature engineering is the key
    to improving precision in machine learning. Now we can say that this feature engineering
    can be divided into the following two parts:


    +   - Engineering under the constraints of a machine learning model. The typical
    case is to make inputs discrete or continuous.

    +   - Feature engineering to increase precision by machine learning. This tends
    to rely on the sense of a researcher.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'In a narrower meaning, feature engineering is considered as the second one,
    and this is the part that deep learning doesn''t have to focus on, whereas the
    first one is definitely the important part, even for deep learning. For example,
    it''s difficult to predict stock prices using deep learning. Stock prices are
    volatile and it''s difficult to define inputs. Besides, how to apply an output
    value is also a difficult problem. Enabling deep learning to handle these inputs
    and outputs is also said to be feature engineering in the wider sense. If there
    is no limitation to the value of original data and/or data you would like to predict,
    it''s difficult to insert these datasets into machine learning and deep learning
    algorithms, including neural networks.


    However, we can take a certain approach and apply a model to these previous problems
    by breaking down the inputs and/or outputs. In terms of NLP, as explained earlier,
    you might have thought, for example, that it would be impossible to put numberless
    words into features in the first place, but as you already know, we can train
    feed-forward neural networks with words by representing them with sparse vectors
    and combining N-grams into them. Of course, we can not only use neural networks,
    but also other machine learning algorithms such as SVM here. Thus, we can cultivate
    a new field where deep learning hasn''t been applied by engineering to fit features
    well into deep learning models. In the meantime, when we focus on NLP, we can
    see that RNN and LSTM were developed to properly resolve the difficulties or tasks
    encountered in NLP. This can be considered as the opposite approach to feature
    engineering because in this case, the problem is solved by breaking down a model
    to fit into features.


    Then, how do we do utilize engineering for stock prediction as we just mentioned?
    It''s actually not difficult to think of inputs, that is, features. For example,
    if you predict stock prices daily, it''s hard to calculate if you use daily stock
    prices as features, but if you use a rate of price change between a day and the
    day before, then it should be much easier to process as the price stays within
    a certain range and the gradients won''t explode easily. Meanwhile, what is difficult
    is how to deal with outputs. Stock prices are of course continuous values, hence
    outputs can be various values. This means that in the neural network model where
    the number of units in the output layer is fixed, they can''t handle this problem.
    What should we do here — should we give up?! No, wait a minute. Unfortunately,
    we can''t predict a stock price itself, but there is an alternative prediction
    method.'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'Here, the problem is that we can classify stock prices to be predicted into
    infinite patterns. Then, can we make them into limited patterns? Yes, we can.
    Let''s forcibly make them. Think about the most extreme but easy to understand
    case: predicting whether tomorrow''s stock price, strictly speaking a close price,
    is up or down using the data from the stock price up to today. For this case,
    we can show it with a deep learning model as follows:


    ![](img/9315e45972ec0fbaf15f9144035bca79_220_0.png)


    In the preceding image, o(t) denotes the open price of a day, t; c(t) denotes
    the close price, H(t) is the high price, and L(t) is the actual price. The features
    used here are mere examples, and need to be fine-tuned when applied to real applications.
    The point here is that replacing the original task with this type of problem enables
    deep neural networks to theoretically classify data. Furthermore, if you classify
    the data by how much it will go up or down, you could make more detailed predictions.
    For example, you could classify data as shown in the following table:


    | Class | Description |

    |---|---|

    | Class 1 | Up more than 3 percent from the closing price |

    | Class 2 | Up more than 1~3 percent from the closing price |

    | Class 3 | Up more than 0~1 percent from the closing price |

    | Class 4 | Down more than 0~-1 percent from the closing price |

    | Class 5 | Down more than -1~-3 percent from the closing price |

    | Class 6 | Down more than -3 percent from the closing price |'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'Whether the prediction actually works, in other words whether the classification
    works, is unknown until we examine it, but the fluctuation of stock prices can
    be predicted in quite a narrow range by dividing the outputs into multiple classes.
    Once we can adopt the task into neural networks, then what we should do is just
    examine which model gets better results. In this example, we may apply RNN because
    the stock price is time sequential data. If we look at charts showing the price
    as image data, we can also use CNN to predict the future price.


    So now we''ve thought about the approach by referring to examples, but to sum
    up in general, we can say that:


    +   - **Feature engineering for models**: This is designing inputs or adjusting
    values to fit deep learning models, or enabling classification by setting a limitation
    for the outputs

    +   - **Model engineering for features**: This is devising new neural network
    models or algorithms to solve problems in a focused field


    The first one needs ideas for the part of designing inputs and outputs to fit
    to a model, whereas the second one needs to take a mathematical approach. Feature
    engineering might be easier to start if you are conscious of making an item prediction-limited.


    # Output-oriented approach


    The two previously mentioned approaches are to increase the percentage of correct
    answers for a certain field''s task or problem using deep learning. Of course,
    it is essential and the part where deep learning proves its worth; however, increasing
    precision to the ultimate level may not be the only way of utilizing deep learning.
    Another approach is to devise the outputs using deep learning by slightly changing
    the point of view. Let''s see what this means.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Deep learning is applauded as an innovative approach among researchers and
    technical experts of AI, but the world in general doesn''t know much about its
    greatness yet. Rather, they pay attention to what a machine can''t do. For example,
    people don''t really focus on the image recognition capabilities of MNIST using
    CNN, which generates a lower error rate than humans, but they criticize that a
    machine can''t recognize images perfectly. This is probably because people expect
    a lot when they hear and imagine AI. We might need to change this mindset. Let''s
    consider DORAEMON, a Japanese national cartoon character who is also famous worldwide—a
    robot who has high intelligence and AI, but often makes silly mistakes. Do we
    criticize him? No, we just laugh it off or take it as a joke and don''t get serious.
    Also, think about DUMMY / DUM-E, the robot arm in the movie Iron Man. It has AI
    as well, but makes silly mistakes. See, they make mistakes but we still like them.


    In this way, it might be better to emphasize the point that machines make mistakes.
    Changing the expression part of a user interface could be the trigger for people
    to adopt AI rather than just studying an algorithm the most. Who knows? It''s
    highly likely that you can gain the world''s interest by thinking of ideas in
    creative fields, not from the perspective of precision. Deep Dream by Google is
    one good example. We can do more exciting things when art or design and deep learning
    collaborate.


    # Summary


    In this chapter, you learned how to utilize deep learning algorithms for practical
    applications. The fields that are well studied are image recognition and NLP.
    While learning about the field of NLP, we looked through two new deep learning
    models: the RNN and LSTM networks, which can be trained with time sequential data.
    The training algorithm used in these models is BPTT. You also learned that there
    are three approaches to make the best of the deep learning ability: the field-oriented
    approach, the breakdown-oriented approach, and the output-oriented approach. Each
    approach has a different angle, and can maximize the possibility for deep learning.


    And ...congratulations! You''ve just accomplished the learning part of deep learning
    with Java. Although there are still some models that have not been mentioned yet
    in this book, you can be sure there will be no problem in acquiring and utilizing
    them. The next chapter will introduce some libraries that are implemented with
    other programming languages, so just relax and take a look.'
