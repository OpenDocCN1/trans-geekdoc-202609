    \ the iterator as follows:\n\n```\nDataSetIterator iterator = new RecordReaderDataSetIterator(recordReader,4,3);\n\
    DataSet next = iterator.next();\n```\n\nIn the previous example, we used the IrisDataSetIterator\
    \ class, but here the RecordReaderDataSetIterator class is used because we use\
