    \ double w_ = Math.sqrt(6. / (in_ + out_));\n    for (int k = 0; k < nKernel;\
    \ k++) {\n        for (int c = 0; c < channel; c++) {\n            for (int s\
    \ = 0; s < kernelSize[0]; s++) {\n                for (int t = 0; t < kernelSize[1];\
    \ t++) {\n                    W[k][c][s][t] = uniform(-w_, w_, rng);\n       \
    \         }\n            }\n        }\n    }\n}\n\nif (b == null) b = new double[nKernel];\n\
    ```\n\nNext comes the construction of MLP. Don't forget to flatten the downsampled\
