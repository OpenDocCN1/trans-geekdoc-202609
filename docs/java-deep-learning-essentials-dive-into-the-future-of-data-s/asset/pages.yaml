- pgno: 193
  md: '# 6


    # Approaches to Practical Applications – Recurrent Neural Networks and More


    In the previous chapters, you learned quite a lot about deep learning. You should
    now understand the fundamentals of the concepts, theories, and implementations
    of deep neural networks. You also learned that you can experiment with deep learning
    algorithms on various data relatively easily by utilizing a deep learning library.
    The next step is to examine how deep learning can be applied to a broad range
    of other fields and how to utilize it for practical applications.


    Therefore, in this chapter, we''ll first see how deep learning is actually applied.
    Here, you will see that the actual cases where deep learning is utilized are still
    very few. But why aren''t there many cases even though it is such an innovative
    method? What is the problem? Later on, we''ll think about the reasons. Furthermore,
    going forward we will also consider which fields we can apply deep learning to
    and will have the chance to apply deep learning and all the related areas of artificial
    intelligence.


    The topics covered in this chapter include:


    +   - Image recognition, natural language processing, and the neural networks
    models and algorithms related to them

    +   - The difficulties of turning deep learning models into practical applications

    +   - The possible fields where deep learning can be applied, and ideas on how
    to approach these fields


    We''ll explore the potential of this big AI boom, which will lead to ideas and
    hints that you can utilize in deep learning for your research, business, and many
    sorts of activities.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Fields where deep learning is active


    We often hear that research for deep learning has always been ongoing and that''s
    a fact. Many corporations, especially large tech companies such as Google, Facebook,
    Microsoft, and IBM, invest huge amounts of money into the research of deep learning,
    and we frequently hear news that some corporation has bought these research groups.
    However, as we look through, deep learning itself has various types of algorithms,
    and fields where these algorithms can be applied. Even so, it is a fact that is
    it not widely known which fields deep learning is utilized in or can be used in.
    Since the word "AI" is so broadly used, people can''t properly understand which
    technology is used for which product. Hence, in this section, we will go through
    the fields where people have been trying to adopt deep learning actively for practical
    applications.


    # Image recognition


    The field in which deep learning is most frequently incorporated is image recognition.
    It was Prof. Hinton and his team''s invention that led to the term "deep learning."
    Their algorithm recorded the lowest error rates ever in an image recognition competition.
    The continuous research done to improve the algorithm led to even better results.
    Now, image recognition utilizing deep learning has gradually been adopted not
    only for studies, but also for practical applications and products. For example,
    Google utilizes deep learning to auto-generate thumbnails for YouTube or auto-tag
    and search photos in Google Photos. Like these popular products, deep learning
    is mainly applied to image tagging or categorizing and, for example, in the field
    of robotics, it is used for robots to specify things around them.


    The reason why we can support these products and this industry is because deep
    learning is more suited to image processing, and this is because it can achieve
    higher precision rates than applications in any other field. Only because the
    precision and recall rate of image recognition is so high does it mean this industry
    has broad potential. An error rate of MNIST image classification is recorded at
    0.21 percent with a deep learning algorithm (http://cs.nyu.edu/~wanli/dropc/),
    and this rate can be no lower than the record for a human (http://arxiv.org/pdf/0710.2231v1.pdf).
    In other words, if you narrow it down to just image recognition, it''s nothing
    more than the fact that a machine may overcome a human. Why does only image recognition
    get such high precision while other fields need far more improvement in their
    methods?'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'One of the reasons is that the structure of feature extractions in deep learning
    is well suited for image data. In deep neural networks, many layers are stacked
    and features are extracted from training data step by step at each layer. Also,
    it can be said that image data is featured as a layered structure. When you look
    at images, you will unconsciously catch brief features first and then look into
    a more detailed feature. Therefore, the inherent property of deep learning feature
    extraction is similar to how an image is perceived and hence we can get an accurate
    realization of the features. Although image recognition with deep learning still
    needs more improvements, especially of how machines can understand images and
    their contents, obtaining high precision by just adopting deep learning to sample
    image data without preprocessing obviously means that deep learning and image
    data are a good match.


    The other reason is that people have been working to improve algorithms slowly
    but steadily. For example, in deep learning algorithms, CNN, which can get the
    best precision for image recognition, has been improved every time it faces difficulties/tasks.
    Local receptive fields substituted with kernels of convolutional layers were introduced
    to avoid networks becoming too dense. Also, downsampling methods such as max-pooling
    were invented to avoid the overreaction of networks towards a gap of image location.
    This was originally generated from a trial and error process on how to recognize
    handwritten letters written in a certain frame such as a postal code. As such,
    there are many cases where a new approach is sought to adapt neural networks algorithms
    for practical applications. A complicated model, CNN is also built based on these
    accumulated yet steady improvements. While we don''t need feature engineering
    with deep learning, we still need to consider an appropriate approach to solve
    specific problems, that is, we can''t build omnipotent models, and this is known
    as the No Free Lunch Theorem (NFLT) for optimization.


    In the image recognition field, the classification accuracy that can be achieved
    by deep learning is extremely high, and it is actually beginning to be used for
    practical applications. However, there should be more fields where deep learning
    can be applied. Images have a close connection to many industries. In the future,
    there will be many cases and many more industries that utilize deep learning.
    In this book, let''s think about what industries we can apply image recognition
    to, considering the emergence of deep learning in the next sections.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Natural language processing


    The second most active field, after image recognition, where the research of deep
    learning has progressed is natural language processing (NLP). The research in
    this field might become the most active going forward. With regard to image recognition,
    the prediction precision we could obtain almost reaches the ceiling, as it can
    perform even better classification than a human could. On the other hand, in NLP,
    it is true that the performance of a model gets a lot better thanks to deep learning,
    but it is also a fact that there are many tasks that still need to be solved.


    For some products and practical applications, deep learning has already been applied.
    For example, NLP based on deep learning is applied to Google''s voice search or
    voice recognition and Google translation. Also, IBM Watson, the cognitive computing
    system that understands and learns natural language and supports human decision-making,
    extracts keywords and entities from tons of documents, and has functions to label
    documents. And these functions are open to the public as the Watson API and anyone
    can utilize it without constraints.


    As you can see from the preceding examples, NLP itself has a broad and varied
    range of types. In terms of fundamental techniques, we have the classification
    of sentence contents, the classification of words, and the specification of word
    meanings. Furthermore, languages such as Chinese or Japanese that don''t leave
    a space between words require morphological analysis, which is also another technique
    available in NLP.


    NLP contains a lot of things that need to be researched, therefore it needs to
    clarify what its purpose is, what its problems are, and how these problems can
    be solved. What model is the best to use and how to get good precision properly
    are topics that should be examined cautiously. As for image recognition, the CNN
    method was invented by solving tasks that were faced. Now, let''s consider what
    approach we can think of and what the difficulties will be respectively for neural
    networks and NLP. Understanding past trial and error processes will be useful
    for research and applications going forward.


    # Feed-forward neural networks for NLP


    The fundamental problem of NLP is "to predict the next word given a specific word
    or words". The problem is too simple, however; if you try to solve it with neural
    networks, then you will soon face several difficulties because documents or sentences
    as sample data using NLP have the following features:


    +   - The length of each sentence is not fixed but variable, and the number of
    words is astronomical'
  merge: -1
  img_proc: true
- pgno: 197
  md: "+   - There can be unforeseen problems such as misspelled words, acronyms,\
    \ and so on\n+   - Sentences are sequential data, and so contain temporal information\n\
    \nWhy can these features pose a problem? Remember the model structure of general\
    \ neural networks. For training and testing with neural networks, the number of\
    \ neurons in each layer including the input layer needs to be fixed in advance\
    \ and the networks need to be the same size for all the sample data. In the meantime,\
    \ the length of the input data is not fixed and can vary a lot. This means that\
    \ sample data cannot be applied to the model, at least as it is. Classification\
    \ or generation by neural networks cannot be done without adding/amending something\
    \ to this data.\n\nWe have to fix the length of input data, and one approach to\
    \ handle this issue is a method that divides a sentence into a chunk of certain\
    \ words from the beginning in order. This method is called **N-gram**. Here, *N*\
    \ represents the size of each item, and an **N-gram** of size 1 is called a **unigram**,\
    \ size 2 is a **bigram**, and size 3 is a **trigram**. When the size is larger,\
    \ then it is simply called with the value of *N*, such as *four-gram*, *five-gram*,\
    \ and so on.\n\nLet's look at how N-gram works with NLP. The goal here is to calculate\
    \ the probability of a word *w* given some history *h*; *P(w | h)*. We'll represent\
    \ a sequence of *N* words as *w₁ⁿ*. Then, the probability we want to compute is\
    \ *P(w₁ⁿ)*, and by applying the chain rule of probability to this term, we get:\n\
    \nP(w₁ⁿ) = P(w₁) P(w₂ | w₃) P(w₃ | w₁²) ... P(wₙ | w₁ⁿ⁻¹)\n       = ∏_{k=1}^n\
    \ P(w_k | w₁^{k-1})\n\nIt might look at first glance like these conditional probabilities\
    \ help us, but actually they don't because we have no way of calculating the exact\
    \ probability of a word following a long sequence of preceding words, *P(wₙ |\
    \ w_{n-1})*. Since the structure of a sentence is very flexible, we can't simply\
    \ utilize sample documents and a corpus to estimate the probability. This is where\
    \ N-gram works. Actually, we have two approaches to solve this problem: the original\
    \ N-gram model and the neural networks model based on N-gram. We'll look at the\
    \ first one to fully understand how the fields of NLP have developed before we\
    \ dig into neural networks."
  merge: -1
  img_proc: true
- pgno: 198
  md: 'With N-gram, we don''t compute the probability of a word given its whole history,
    but approximate the history with the last N words. For example, the bigram model
    approximates the probability of a word just by the conditional probability of
    the preceding word, $P(w_n \mid w_{n-1})$, and so follows the equation:


    $P(w_1^n) = \prod_{k=1}^{n} P\left(w_k \mid w_1^{k-1}\right)$


    $\approx \prod_{k=1}^{n} P\left(w_k \mid w_{k-1}\right)$


    Similarly, we can generalize and expand the equation for N-gram. In this case,
    the probability of a word can be represented as follows:


    $P\left(w_n \mid w_1^{n-1}\right) \approx P\left(w_n \mid w_{n-N+1}^{n-1}\right)$


    We get the following equation:


    $P\left(w_1^n\right) \approx \prod_{k=1}^{n} P\left(w_k \mid w_{k-N+1}^{k-1}\right)$


    Just bear in mind that these approximations with N-gram are based on the probabilistic
    model called the **Markov model**, where the probability of a word depends only
    on the previous word.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Now what we need to do is estimate these N-gram probabilities, but how do we
    estimate them? One simple way of doing this is called the **maximum likelihood
    estimation (MLE)**. This method estimates the probabilities by taking counts from
    a corpus and normalizing them. So when we think of a bigram as an example, we
    get:


    ```

    $$P(w_n \mid w_{n-1}) = \frac{C(w_{n-1}w_n)}{\sum_{w} C(w_{n-1}w)}$$

    ```


    In the preceding formula, $C(\cdot)$ denotes the counts of a word or a sequence
    of words. Since the denominator, that is, the sum of all bigram counts starting
    with a word, $w_{n-1}$ is equal to the unigram count of $w_{n-1}$, the preceding
    equation can be described as follows:


    ```

    $$P(w_n \mid w_{n-1}) = \frac{C(w_{n-1}w_n)}{C(w_{n-1})}$$

    ```


    Accordingly, we can generalize MLE for N-gram as well:


    ```

    $$P(w_n \mid w_{n-N+1}^{n-1}) = \frac{C(w_{n-N+1}^{n-1}w_n)}{C(w_{n-N+1}^{n-1})}$$

    ```


    Although this is a fundamental approach of NLP with N-gram, we now know how to
    compute N-gram probabilities.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'In contrast to this approach, the neural network models predict the conditional
    probability of a word $w_j$ given a specific history, $h_j$; $P(w_j = i \mid h_j)$.
    One of the models of NLP is called the Neural Network Language Model (NLMM) (http://www.jmlr.org/papers/volume3/bengio03a/bengio03a.pdf),
    and it can be illustrated as follows:


    ![](img/9315e45972ec0fbaf15f9144035bca79_200_0.png)'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'Here, $N$ is the size of the vocabulary, and each word in the vocabulary is
    an N-dimensional vector where only the index of the word is set to 1 and all the
    other indices to 0. This method of representation is called 1-of-$N$ coding. The
    inputs of NLMM are the indices of the $n-1$ previous words $h_j = w_{j-n+1}^{j-1}$
    (so they are $n$-grams). Since the size $N$ is typically within the range of 5,000
    to 200,000, input vectors of NLMM are very sparse. Then, each word is mapped to
    the projection layer, for continuous space representation. This linear projection
    (activation) from a discrete to a continuous space is basically a look-up table
    with $N \times P$ entries, where $P$ denotes the feature dimension. The projection
    matrix is shared for the different word positions in the context, and activates
    the word vectors to projection layer units $c_l$ with $l = 1,\ldots,(n-1).P$.
    After the projection comes the hidden layer. Since the projection layer is in
    the continuous space, the model structure is just the same as the other neural
    networks from here. So, the activation can be represented as follows:


    $$d_j = h\left(\sum_{l=1}^{(n-1).P} m_{jl}c_l + b_j\right)$$


    Here, $h(\cdot)$ denotes the activation function, $m_{ji}$ the weights between
    the projection layer and the hidden layer, and $b_j$ the biases of the hidden
    layer. Accordingly, we can get the output units as follows:


    $$o_i = \sum_{j} v_{ij} d_j + k_i$$


    Here, $v_{ij}$ denotes the weights between the hidden layer and the output layer,
    and $k_i$ denotes the biases of the output layer. The probability of a word $i$
    given a specific history $h_j$ can then be calculated using the softmax function:


    $$P\left(w_j = i \mid h_j\right) = \frac{\exp(o_i)}{\sum_{l=1}^{N} \exp(o_i)}$$


    As you can see, in NNLM, the model predicts the probability of all the words at
    the same time. Since the model is now described with the standard neural network,
    we can train the model using the standard backpropagation algorithm.'
  merge: -1
  img_proc: true
