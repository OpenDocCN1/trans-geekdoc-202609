  md: "# CSVExample.java\n\nIn the previous example, we train the model with the dataset\
    \ used as a benchmark indicator. When you would like to train and test the model\
    \ with your own prepared data, you can easily import it from CSV. Let's look at\
    \ CSVExample.java in the CSV package. The first step is to initialize the CSV\
    \ reader as follows:\n\n```\nRecordReader recordReader = new CSVRecordReader(0,\"\
    ,\");\n```\n\nIn DL4J, a class called CSVRecordReader is prepared and you can\
    \ easily import data from a CSV file. The value of the first argument in the CSVRecordReader\
    \ class represents how many lines should be skipped in the file. This is convenient\
    \ when the file contains header rows. The second argument is the delimiter. To\
    \ actually read a file and import data, the code can be written as follows:\n\n\
    ```\nrecordReader.initialize(new FileSplit(new\nClassPathResource(\"iris.txt\"\
    ).getFile()));\n```\n\nWith this code, the file in resources/iris.txt will be\
    \ imported to the model. The values in the file here are the same as ones as in\
