    \ / poolSizes[i][0] };\n\nconvpoolLayers[i] = new ConvolutionPoolingLayer(size_,\
    \ channel_, nKernels[i], kernelSizes[i], poolSizes[i], convolvedSizes[i], pooledSizes[i],\
    \ rng, activation);\n}\n```\n\nWhen you look at the constructor of the ConvolutionPoolingLayer\
