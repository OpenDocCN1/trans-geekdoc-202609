    +   1. Setting up parameters for the model.

    +   2. Building the model.

    +   3. Pre-training the model.

    +   4. Fine-tuning the model.

    +   5. Testing and evaluating the model.


    Just as in RBM, the first step in setting up the main method is the declaration
    of variables and the code for creating demo data (the explanation is omitted here).'
