    \    classified\n    if (c > 0) {\n        classified = 1;\n    } else {\n   \
    \     w.addi(x.transpose().mul(t).mul(learningRate));\n    }\n\n    return classified;\n\
    }\n```\n\nWe first focus our attention on the following code:\n\n```\n// check\
    \ if the data is classified correctly\ndouble c = x.mmul(w).getDouble(0) * t.getDouble(0);\n\
    ```\n\nThis is the part that checks whether the data is classified correctly by\
    \ perceptions, as shown in the following equation:\n\nw^T x_n t_n > 0\n\nYou can\
    \ see from the code that .mmul() is for the multiplication between vectors or\
    \ matrices. We wrote this part of the calculation in Chapter 2, Algorithms for\
    \ Machine Learning – Preparing for Deep Learning, as follows:\n\n```\ndouble c\
    \ = 0.;\n\n// check if the data is classified correctly\nfor (int i = 0; i < nIn;\
    \ i++) {\n    c += w[i] * x[i] * t;\n}\n```\n\nBy comparing both codes, you can\
    \ see that multiplication between vectors or matrices can be written easily with\
    \ INDArray, and so you can implement the algorithm intuitively just by following\
    \ the equations."
  merge: -1
  img_proc: true
- pgno: 169
  md: "The equation to update the model parameters is as follows:\n\n```\nw.addi(x.transpose().mul(t).mul(learningRate));\n\
    ```\n\nHere, again, you can implement the code like you write a math equation.\
    \ The equation is represented as follows:\n\n$w^{(k+1)} = w^{(k)} + \\eta x_n\
    \ t_n$\n\nThe last time we implemented this part, we wrote it with a for loop:\n\
    \n```\nfor (int i = 0; i < nIn; i++) {\n    w[i] += learningRate * x[i] * t;\n\
    }\n```\n\nFurthermore, the prediction after the training is also the standard\
    \ forward activation, shown as the following equation:\n\n$y(x) = f(w^T x)$\n\n\
    Here:\n\n$f(a) = \\begin{cases} +1, & a \\ge 0 \\\\ -1, & a < 0 \\end{cases}$\n\
    \nWe can simply define the predict method with just a single line inside, as follows:\n\
    \n```\npublic int predict(INDArray x) {\n    return step(x.mmul(w).getDouble(0));\n\
    }\n```\n\nWhen you run the program, you can see its precision and accuracy, and\
    \ the recall is the same as we get with the previous code.\n\nThus, it'll greatly\
    \ help that you implement the algorithms analogous to mathematical equations.\
    \ We only implement perceptrons here, but please try other algorithms by yourself."
