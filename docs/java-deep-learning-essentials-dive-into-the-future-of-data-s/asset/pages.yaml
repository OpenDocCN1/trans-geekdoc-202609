  md: "```\nreturn y\n\ndef loss(y, label_placeholder):\n    with tf.name_scope('loss')\
    \ as scope:\n        cross_entropy = - tf.reduce_sum(label_placeholder *\n   \
    \     tf.log(y))\n\n        tf.scalar_summary(\"Cross Entropy\", cross_entropy)\n\
    \n    return cross_entropy\n\ndef training(loss):\n    with tf.name_scope('training')\
    \ as scope:\n        train_step =\n        tf.train.GradientDescentOptimizer(0.01).minimize(loss)\n\
    \n    return train_step\n```\n\ntf.scalar_summary() in loss() makes the variable\
    \ show up in the EVENTS menu. To enable visualization, we need the following code:\n\
    \n```\nsummary_step = tf.merge_all_summaries()\ninit = tf.initialize_all_variables()\n\
    \nsummary_writer = tf.train.SummaryWriter('data',\ngraph_def=sess.graph_def)\n\
    ```\n\nThen the process of variables can be added with the following code:\n\n\
    ```\nsummary = sess.run(summary_step, feed_dict=feed_dict)\nsummary_writer.add_summary(summary,\
    \ i)\n```\n\nThis feature of visualization will be much more useful when we're\
    \ using more complicated models.\n\n# Caffe\n\nCaffe is a library famous for its\
    \ speed. The official project page is http://caffe.berkeleyvision.org/ and the\
    \ GitHub page is https://github.com/BVLC/caffe. Similar to TensorFlow, Caffe has\
    \ been developed mainly with C++, but it provides a Python and MATLAB API. In\
    \ addition, what is unique to Caffe is that you don't need any programming experience,\
    \ you just write the configuration or protocol files, that is .prototxt files,\
    \ to perform experiments and research with deep learning. Here, we focus on the\
    \ protocol-based approach."
