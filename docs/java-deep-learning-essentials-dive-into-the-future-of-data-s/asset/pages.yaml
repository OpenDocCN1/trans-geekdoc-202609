- pgno: 154
  md: "What upsample does is just transfer the delta to the convolutional layer:\n\
    \n```\n```java\npublic double[][][][] upsample(double[][][][] X, double[][][][]\
    \ Y,\ndouble[][][][] dY, int minibatchSize) {\n\n    double[][][][] dX = new double[minibatchSize][nKernel]\n\
    \    [convolvedSize[0]][convolvedSize[1]];\n\n    for (int n = 0; n < minibatchSize;\
    \ n++) {\n\n        for (int k = 0; k < nKernel; k++) {\n            for (int\
    \ i = 0; i < pooledSize[0]; i++) {\n                for (int j = 0; j < pooledSize[1];\
    \ j++) {\n\n                    for (int s = 0; s < poolSize[0]; s++) {\n    \
