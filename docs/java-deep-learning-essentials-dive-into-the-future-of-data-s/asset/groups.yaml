    # Logistic regression


    Logistic regression is, as you can assume from the name, the regression model.
    But when you look at the formula, you can see that logistic regression is the
    linear separation model that generalizes perceptrons.


    Logistic regression can be regarded as one of the neural networks. With perceptrons,
    the step function is used for the activation function, but in logistic regression,
    the (logistic) sigmoid function is used. The equation of the sigmoid function
    can be represented as follows:


    $\sigma(x)=\frac{1}{1+e^{-x}}$


    The graph of this function can be illustrated as follows:


    ![](img/9315e45972ec0fbaf15f9144035bca79_64_0.png)'
  - '[PAGE 65]


    The sigmoid function maps any values of a real number to a value from 0 to 1.
    Therefore, the output of the logistic regression can be regarded as the posterior
    probability for each class. The equations can be described as follows:


    $$p(C=1\mid x)=y(x)=\sigma(w^T x+b)$$


    $$p(C=0\mid x)=1-p(C=1\mid x)$$


    These equations can be combined to make:


    $$p(C=t\mid x)=y^t(1-y)^{1-t}$$


    Here, $t\in\{0,1\}$ is the correct data. You may have noticed that the range of
    the data is different from the one of perceptrons.


    With the previous equation, the likelihood function, which estimates the maximum
    likelihood of the model parameters, can be expressed as follows:


    $$L(w,b)=\prod_{n=1}^{N}y_n^{t_n}(1-y_n)^{1-t_n}$$


    Where:


    $$y_n=p(C=1\mid x_n)$$


    As you can see, not only the weight of the network but the bias $b$ are also parameters
    that need to be optimized.'
  - '[PAGE 66]


    What we need to do now is maximize the likelihood function, but the calculation
    is worrying because the function has a mathematical product. To make the calculation
    easier, we take the logarithm (log) of the likelihood function. Additionally,
    we substitute the sign to turn the object to minimizing the negative log likelihood
    function. Since the log is the monotonic increase, the magnitude correlation doesn''t
    change. The equation can be represented as follows:


    $$E(w,b) = -\ln L(w,b) = -\sum_{n=1}^{N}\{t_n \ln y_n + (1-t_n)\ln(1-y_n)\}$$


    You can see the error function at the same time. This type of function is called
    a cross-entropy error function.


    Similar to perceptrons, we can optimize the model by computing the gradients of
    the model parameters, $w$ and $b$. The gradients can be described as follows:


    $$\frac{\partial E(w,b)}{\partial w} = -\sum_{n=1}^{N}(t_n - y_n)x_n$$


    $$\frac{\partial E(w,b)}{\partial b} = -\sum_{n=1}^{N}(t_n - y_n)$$


    With these equations, we can update the model parameters as follows:


    $$w^{(k+1)} = w^{(k)} - \eta \frac{\partial E(w,b)}{\partial w} = w^{(k)} + \eta
    \sum_{n=1}^{N}(t_n - y_n)x_n$$


    $$b^{(k+1)} = b^{(k)} - \eta \frac{\partial E(w,b)}{\partial b} = b^{(k)} + \eta
    \sum_{n=1}^{N}(t_n - y_n)$$


    Theoretically, we have no problem using the equations just mentioned and implementing
    them. As you can see, however, you have to calculate the sum of all the data to
    compute the gradients for each iteration. This will hugely increase the calculation
    cost once the size of a dataset becomes big.'
