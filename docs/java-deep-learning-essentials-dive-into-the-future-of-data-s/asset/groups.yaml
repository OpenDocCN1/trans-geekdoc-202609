    right]_{\\tau-1} + (1-\\rho)\\left(\\Delta \\theta^{(\\tau)}\\right)^2$$\n  -\
    \ 应用更新：\n    $$\\theta^{(\\tau+1)} = \\theta^{(\\tau)} + \\Delta \\theta^{(\\\
    tau)}$$\n\n这里，ρ 和 ε 是超参数。你可能会觉得 ADADELTA 相当复杂，但在 DL4J 中实现时无需担心这种复杂性。\n\nDL4J 中仍支持其他优化器，如\
