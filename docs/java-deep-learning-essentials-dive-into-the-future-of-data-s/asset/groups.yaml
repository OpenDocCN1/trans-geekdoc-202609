    人们用“AI”这个词来指代这些类别，不用说，利用深度学习的新技术也被称为 AI。然而，这些技术在结构上和所能完成的任务上都有所不同。那么，我们具体应该把哪个称为
    AI 呢？遗憾的是，人们对这个问题的看法不一，答案无法客观解释。在学术上，根据机器能达到的水平，术语被设定为强人工智能或弱人工智能。但是，在本书中，为了避免混淆，AI
    被用来指（尚未实现的）与真正人脑难以区分的人类智能。AI 领域正在飞速发展，在深度学习的推动下，AI 成为现实的可能性呈指数级增长。这一领域现在比历史上任何时候都更加火热。这股热潮能持续多久，取决于未来的研究。


    ## 过去的人工智能热潮


    AI 最近突然成为热门话题；然而，这并不是第一次 AI 热潮。回顾过去，对 AI 的研究已经进行了几十年，并且经历了活跃与沉寂的循环。最近的热潮是第三次热潮。因此，有些人实际上认为，这一次不过是又一次转瞬即逝的热潮。


    然而，最新一次热潮与过去的热潮有一个显著的区别。是的，那就是深度学习。深度学习实现了过去技术无法实现的目标。那是什么？简单来说，机器本身能够从给定数据中找出特征量，并加以学习。有了这一成就，我们可以看到
    AI 成为现实的巨大可能性，因为在此之前，机器无法自行理解新概念，而需要人类利用过去在 AI 领域创造的技术，预先输入某种特征量。


    如果你仅仅读到这个事实，它看起来差别并不大，但实际有天壤之别。在机器能够自行测量特征量之前，已经走过了漫长的道路。当机器能够在深度学习的驱动下获得智能时，人们终于能够向前迈出一大步。那么，过去的技术与深度学习之间究竟有什么重大区别？让我们简要回顾一下过去的
    AI 领域，以便更好地理解这种差异。


    第一次 AI 热潮出现在 20 世纪 50 年代末。当时，搜索程序的主流研究和开发基于固定规则——不用说，这些规则是人类定义的。简单来说，搜索就是分类讨论。在这种搜索中，如果我们想让机器执行任何处理，就必须写出处理过程可能需要的每一种模式。机器计算的速度远比人类快。无论模式有多么庞大，机器都能轻松处理。机器会持续搜索一百万次，最终找到最佳答案。然而，即使机器能以高速计算，如果只是随机且盲目地搜索答案，也会花费大量时间。是的，别忘了那个约束条件——“时间”。因此，人们进一步研究了如何提高搜索效率。在这些研究中，最流行的搜索方法是**深度优先搜索（DFS）**和**广度优先搜索（BFS）**。


    在你所能想到的每一种可能模式中，搜索最有效的路径，并在现实的时间范围内从中做出最佳选择。这样做，每次都应该能得到最佳答案。基于这一假设，人们开发了两种用于图数据结构树的搜索或遍历算法：DFS
    和 BFS。两者都从图或树的根开始，DFS 在回溯前尽可能沿每个分支深入探索，而 BFS 则先探索邻居节点，然后再移动到下一级邻居。下面是一些示例图，展示了
    DFS 和 BFS 之间的区别：


    ![](img/9315e45972ec0fbaf15f9144035bca79_20_0.png)


    这些搜索算法在特定领域可以取得一定成果，尤其是像国际象棋和将棋这样的领域。棋类游戏是机器擅长的领域之一。如果预先输入大量胜负模式、过往棋局数据以及棋子所有允许的走法，机器就能评估棋盘局面，并从非常大量的模式中决定最佳下一步。


    对于对这个领域感兴趣的读者，让我们更详细地看看机器如何下国际象棋。假设机器执白棋走了第一步，那么“白方”和“黑方”的下一步各有 20 种可能的走法。回想前面图示中的树状模型。从棋局开始时的树顶开始，下方有
    20 个分支，代表白方下一步的可能走法。在这 20 个分支中的每一个下方，又有 20 个分支，代表黑方下一步的可能走法，依此类推。在这种情况下，根据白方的走法，黑方有
    20 x 20 = 400 个分支，白方有 400 x 20 = 8,000 个分支，黑方又有 8,000 x 20 = 160,000 个分支，然后……如果你愿意，可以尽情计算下去。


    机器生成这棵树，并评估这些分支中每一个可能的棋盘局面，在一秒内决定最佳布局。它深入的程度（生成并评估树的多少层）受机器速度的控制。当然，每种不同棋子的走法也必须考虑并嵌入程序中，所以国际象棋程序并不像之前想的那么简单，但本书中我们不深入讨论这一点。如你所见，机器能在国际象棋上击败人类并不奇怪。机器可以同时评估和计算大量模式，所需时间比人类短得多。机器击败国际象棋冠军并不是什么新鲜事；机器已经战胜过人类。因为这样的故事，人们曾期望
    AI 成为现实。


    不幸的是，现实并非那么容易。我们随后发现，面前有一堵高墙，阻碍我们将搜索算法应用于现实。如你所知，现实是复杂的。机器擅长根据给定的规则高速处理事物，但当只给出一项任务时，它无法自行找出如何行动以及应用什么规则。人类在行动时，会无意识地评估、丢弃许多与自身无关的事物/选项，并从现实世界中的数百万事物（模式）中做出选择。机器无法像人类那样做出这些无意识的决定。如果我们创造一台能够适当考虑现实世界中发生的现象的机器，我们可以假设两种可能性：


    - 机器试图完成其任务或目的，而不考虑次要发生的事件和可能性

    - 机器试图完成其任务或目的，而不考虑无关的事件和可能性


    当人类给它们任务时，这两种机器在达成目的之前，仍然会陷入停滞并迷失在处理过程中；尤其是后一种机器，甚至会在采取第一个行动之前就立刻僵住。这是因为这些元素几乎是无限的，如果机器试图思考/搜索这些无限的模式，它无法在现实时间内厘清它们。这个问题被认为是
    AI 领域的重要挑战之一，被称为框架问题。


    让机器获取知识，不像人类单方面命令机器做什么，而更像是机器能够回应人类的提问并给出答案。这一技术应用于现实世界的一个简单例子是正负面分析，这是情感分析的主题之一。如果你事先将定义句子中每个词语正面或负面语气（称为“词典”）的数据输入机器，机器就可以通过比较句子和词典来判断该句子是正面的还是负面的。


    这项技术被用于社交网络或博客帖子和评论的正负面分析。如果你问机器“这篇博客文章的反应是正面的还是负面的？”它会根据其知识（词典）分析评论并回答你。与第一次
    AI 热潮中机器只遵循人类设定的规则相比，第二次 AI 热潮显示出了一些进步。


    通过将知识整合到机器中，机器变得无所不能。这个想法本身对实现 AI 并不坏；然而，在实现它的道路上，我们面前有两堵高墙。首先，你可能已经注意到，在互联网更普及、我们可以从网络获取海量开放数据的今天，输入所有现实世界知识需要几乎无限的工作量。在当时，收集数百万条数据，然后分析并将这些知识输入机器，并不现实。实际上，将世界上所有数据建立数据库这项工作一直在继续，被称为
    Cyc（http://www.cyc.com/）。Cyc 的最终目标是基于这些知识的数据库构建一个推理引擎，这个数据库被称为**知识库**。下面是使用 Cyc
    项目进行知识表示（KR）的一个示例：


    ```

    (#$isa #$BarackObama #$UnitedStatesPresident)

    "Barack Obama belongs to the collection of U.S. presidents."


    (#$genls #$Tree-ThePlant #$Plant)

    "All trees are plants."


    (#$capitalCity #$Japan #$Tokyo)

    "Tokyo is the capital of Japan."

    ```


    '
