    \    .list(4)\n    .layer(0, new DenseLayer.Builder().nIn(numInputs).nOut(4)\n\
    \        .activation(\"relu\").dropOut(0.5)\n        .weightInit(WeightInit.XAVIER)\n\
    \        .build())\n    .layer(1, new DenseLayer.Builder().nIn(4).nOut(4)\n  \
    \      .activation(\"relu\").dropOut(0.5)\n        .weightInit(WeightInit.XAVIER)\n\
    .build())\n.layer(2, new DenseLayer.Builder().nIn(4).nOut(4)\n        .activation(\"\
    relu\").dropOut(0.5)\n        .weightInit(WeightInit.XAVIER)\n        .build())\n\
    .layer(3, new OutputLayer.Builder(LossFunctions.LossFunction\n.NEGATIVELOGLIKELIHOOD)\n\
    \        .weightInit(WeightInit.XAVIER)\n        .activation(\"softmax\")\n  \
    \      .nIn(4).nOut(outputNum).build())\n.backprop(true).pretrain(false)\n.build();\n\
    ```\n\n## CNNMnistExample.java/LenetMnistExample.java\n\nCNN is rather complicated\
    \ compared to other models because of its structure, but we don't need to worry\
    \ about these complications because we can easily implement CNN with DL4J. Let's\
    \ take a look at `CNNMnistExample.java` in the package of convolution. In this\
    \ example, we train the model with the MNIST dataset (http://yann.lecun.com/exdb/mnist/),\
    \ one of the most famous benchmark indicators. As mentioned in *Chapter 1, Deep\
    \ Learning Overview*, this dataset contains 70,000 handwritten numbers data from\
    \ 0 to 9, with both a height and width of 28 pixels each.\n\nFirst, we define\
    \ the values necessary for the model:\n\n```\nint numRows = 28;\nint numColumns\
    \ = 28;\nint nChannels = 1;\nint outputNum = 10;\nint numSamples = 2000;\nint\
    \ batchSize = 500;\nint iterations = 10;\nint splitTrainNum = (int) (batchSize*.8);\n\
    int seed = 123;\nint listenerFreq = iterations/5;\n```\n\nSince images in MNIST\
    \ are all grayscale data, the number of channels is set to 1. In this example,\
    \ we use 2,000 data of 70,000 and split it into training data and test data. The\
    \ size of the mini-batch is 500 here, so the training data is divided into 4 mini-batches.\
    \ Furthermore, the data in each mini-batch is split into training data and test\
    \ data, and each piece of test data is stored in ArrayList:\n\n```\nList<INDArray>\
    \ testInput = new ArrayList<>();\nList<INDArray> testLabels = new ArrayList<>();\n\
    ```\n\nWe didn't have to set ArrayList in the previous examples because we had\
    \ just one batch. For the MnistDataSetIterator class, we can set the MNIST data\
    \ just by using:\n\n```\nDataSetIterator mnistIter = new\nMnistDataSetIterator(batchSize,numSamples,\
    \ true);\n```\n\nThen, we build the model with a convolutional layer and subsampling\
    \ layer. Here, we have one convolutional layer and one max-pooling layer, directly\
    \ followed by an output layer. The structure of the configurations for CNN is\
    \ slightly different from the other algorithms:\n\n```\nMultiLayerConfiguration.Builder\
    \ builder = new NeuralNetConfiguration.\nBuilder().layer().layer(). ... .layer()\n\
    new ConvolutionLayerSetup(builder,numRows,numColumns,nChannels);\nMultiLayerConfiguration\
    \ conf = builder.build();\nMultiLayerNetwork model = new MultiLayerNetwork(conf);\n\
    model.init();\n```\n\nThe difference is that we can't build a model directly from\
    \ the configuration because we need to tell the builder to set up a convolutional\
    \ layer using ConvolutionLayerSetup() in advance. Each .layer() requires just\
    \ the same method of coding. The convolutional layer is defined as:\n\n```\n.layer(0,\
    \ new ConvolutionLayer.Builder(10, 10)\n    .stride(2,2)\n    .nIn(nChannels)\n\
    \    .nOut(6)\n    .weightInit(WeightInit.XAVIER)\n    .activation(\"relu\")\n\
    \    .build())\n```\n"
  mdcn: "\n\n## CSVExample.java\n\n在前面的示例中，我们使用了一个基准指标数据集来训练模型。当你希望使用自己准备的数据来训练和测试模型时，可以方便地从CSV中导入数据。让我们看一下CSV包中的CSVExample.java。第一步是如下所示初始化CSV读取器：\n\
    \n```\nRecordReader recordReader = new CSVRecordReader(0,\",\");\n```\n\n在DL4J中，提供了一个名为CSVRecordReader的类，你可以轻松地从CSV文件导入数据。CSVRecordReader类中第一个参数的值表示应跳过文件中的多少行。当文件包含标题行时，这很方便。第二个参数是分隔符。要实际读取文件并导入数据，代码可以编写如下：\n\
    \n```\nrecordReader.initialize(new FileSplit(new\nClassPathResource(\"iris.txt\"\
    ).getFile()));\n```\n\n通过这段代码，resources/iris.txt中的文件将被导入模型。文件中的值与Iris数据集中的值相同。为了使用这些初始化数据进行模型训练，我们如下定义迭代器：\n\
    \n```\nDataSetIterator iterator = new RecordReaderDataSetIterator(recordReader,4,3);\n\
