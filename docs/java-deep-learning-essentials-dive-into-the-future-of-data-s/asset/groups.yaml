    \n$$E(W,b)=\\sum_{n=1}^{N}E_n(W,b)$$\n\n现在只需考虑这个 $E_n$ 的梯度。在大多数实际应用中，数据集中的所有数据都是独立同分布的，因此像上面这样定义完全没有问题。\n\
    \n前馈网络中的每个单元都可以表示为与该单元相连的网络权重的和，因此一般项可以表示如下：\n\n$$a_j = \\sum_i w_{ji}x_i + b_j$$\n\
    \n$$z_j = h(a_j)$$\n\n注意，这里的 $x_i$ 不只是输入层的值（当然，它也可以是输入层的值）。另外，$h$ 是非线性激活函数。权重的梯度和偏置的梯度可以表示如下：\n\
    \n$$\\frac{\\partial E_n}{\\partial w_{ji}} = \\frac{\\partial E_n}{\\partial\
    \ a_j}\\frac{\\partial a_j}{\\partial w_{ji}} = \\frac{\\partial E_n}{\\partial\
    \ a_j}x_i$$\n\n$$\\frac{\\partial E_n}{\\partial b_j} = \\frac{\\partial E_n}{\\\
    partial a_j}\\frac{\\partial a_j}{\\partial b_j} = \\frac{\\partial E_n}{\\partial\
    \ a_j}$$\n\n现在引入下一个等式中定义的记号：\n\n$$\\delta_j := \\frac{\\partial E_n}{\\partial\
    \ a_j}$$\n\n于是得到：\n\n$$\\frac{\\partial E_n}{\\partial w_{ji}} = \\delta_j x_i$$\n\
    \n$$\\frac{\\partial E_n}{\\partial b_j} = \\delta_j$$\n\n因此，对比这些公式，输出单元可以描述如下：\n\
    \n$\\delta_k = y_k - t_k$\n\n另外，隐藏层的每个单元为：\n\n$\\delta_j = \\frac{\\partial E_n}{\\\
    partial a_j} = \\sum_k \\frac{\\partial E_n}{\\partial a_k} \\frac{\\partial a_k}{\\\
    partial a_j}$\n\n$\\delta_j = h'(a_j) \\sum_k w_{kj} \\delta_k$\n\n于是引入了**反向传播公式**。因此，delta\
    \ 被称为**反向传播的**误差。通过计算 `backpropagated` 误差，就可以计算出权重和偏置。这些公式看起来可能很难，但它本质上做的事情就是接收来自相连单元的误差反馈，并更新权重，所以并没有那么难。\n\
