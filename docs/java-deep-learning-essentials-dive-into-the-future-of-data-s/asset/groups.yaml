    # 4


    # # Dropout and Convolutional

    # Neural Networks


    In this chapter, we continue to look through the algorithms of deep learning.
    The pre-training that was taken into both DBN and SDA is indeed an innovative
    method, but deep learning also has other innovative methods. Among these methods,
    we''ll go into the details of the particularly eminent algorithms, which are the
    following:


    +   - The dropout learning algorithm

    +   - Convolutional neural networks


    Both algorithms are necessary to understand and master deep learning, so make
    sure you keep up.


    # ## Deep learning algorithms without

    ## pre-training


    In the previous chapter, you learned that layer-wise training with pre-training
    was a breakthrough for DBN and SDA. The reason why these algorithms need pre-training
    is because an issue occurs where an output error gradually vanishes and doesn''t
    work well in neural networks with simple piled-up layers (we call this the vanishing
    gradient problem). The deep learning algorithm needs pre-training whether you
    want to improve the existing method or reinvent it — you might think of it like
    that.'
  - '[PAGE 124]


    However, actually, the deep learning algorithms in this chapter don''t have a
    phase of pre-training, albeit in the deep learning algorithm without pre-training,
    we can get a result with higher precision and accuracy. Why is such a thing possible?
    Here is a brief reason. Let''s think about why the vanishing gradient problem
    occurs— remember the equation of backpropagation? A delta in a layer is distributed
    to all the units of a previous layer by literally propagating networks backward.
    This means that in the network where all units are tied densely, the value of
    an error backpropagated to each unit becomes small. As you can see from the equations
    of backpropagation, the gradients of the weight are obtained by the multiplication
    of the weights and deltas among the units. Hence, the more terms we have, the
    more dense the networks are and the more possibilities we have for underflow.
    This causes the vanishing gradient problem.


    Therefore, we can say that if the preceding problems can be avoided without pre-training,
    a machine can learn properly with deep neural networks. To achieve this, we need
    to arrange how to connect the networks. The deep learning algorithm in this chapter
    is a method that puts this contrivance into practice using various approaches.


    # Dropout


    If there''s a problem with the network being tied densely, just force it to be
    sparse. Then the vanishing gradient problem won''t occur and learning can be done
    properly. The algorithm based on such an idea is the dropout algorithm. Dropout
    for deep neural networks was introduced in Improving neural networks by preventing
    co adaptation of feature detectors (Hinton, et. al. 2012, http://arxiv.org/pdf/1207.0580.pdf)
    and refined in Dropout: A Simple Way to Prevent Neural Networks from Overfitting
    (Srivastava, et. al. 2014, https://www.cs.toronto.edu/~hinton/absps/JMLRdropout.pdf).
    In dropout, some of the units are, literally, forcibly dropped while training.
    What does this mean? Let''s look at the following figures—firstly, neural networks:'
  - '[PAGE 125]


    ![](img/9315e45972ec0fbaf15f9144035bca79_125_0.png)'
  - '[PAGE 126]


    There is nothing special about this figure. It is a standard neural network with
    one input layer, two hidden layers, and one output layer. Secondly, the graphical
    model can be represented as follows by applying dropout to this network:


    ![](img/9315e45972ec0fbaf15f9144035bca79_126_0.png)


    Units that are dropped from the network are depicted with cross signs. As you
    can see in the preceding figure, dropped units are interpreted as non-existent
    in the network. This means we need to change the structure of the original neural
    network while the dropout learning algorithm is being applied. Thankfully, applying
    dropout to the network is not difficult from a computational standpoint. You can
    simply build a general deep neural network first. Then the dropout learning algorithm
    can be applied just by adding a dropout mask—a simple binary mask—to all the units
    in each layer. Units with the value of 0 in the binary mask are the ones that
    are dropped from the network.'
  - '[PAGE 127]


    This may remind you of DA (or SDA) discussed in the previous chapter because DA
    and dropout look similar at first glance. Corrupting input data in DA also adds
    binary masks to the data when implemented. However, there are two remarkably different
    points between them. First, while it is true that both methods have the process
    of adding masks to neurons, DA applies the mask only to units in the input layer,
    whereas dropout applies it to units in the hidden layer. Some of the dropout algorithms
    apply masks to both the input layer and the hidden layer, but this is still different
    from DA. Second, in DA, once the corrupt input data is generated, the data will
    be used throughout the whole training epochs, but in dropout, the data with different
    masks will be used in each training epoch. This indicates that a neural network
    of a different shape is trained in each iteration. Dropout masks will be generated
    in each layer in each iteration according to the probability of dropout.


    You might have a question—can we train the model even if the shape of the network
    is different in every step? The answer is yes. You can think of it this way—the
    network is well trained with dropout because it puts more weights on the existing
    neurons to reflect the characteristics of the input data. However, dropout has
    a single demerit, that is, it requires more training epochs than other algorithms
    to train and optimize the model, which means it takes more time until it is optimized.
    Another technique is introduced here to reduce this problem. Although the dropout
    algorithm itself was invented earlier, it was not enough for deep neural networks
    to gain the ability to generalize and get high precision rates just by using this
    method. With one more technique that makes the network even more sparse, we achieve
    deep neural networks to get higher accuracy. This technique is the improvement
    of the activation function, which we can say is a simple yet elegant solution.


    All of the methods of neural networks explained so far utilize the sigmoid function
    or hyperbolic tangent as an activation function. You might get great results with
    these functions. However, as you can see from the shape of them, these curves
    saturate and kill the gradients when the input values or error values at a certain
    layer are relatively large or small.


    One of the activation functions introduced to solve this problem is the rectifier.
    A unit-applied rectifier is called a Rectified Linear Unit (ReLU). We can call
    the activation function itself ReLU. This function is described in the following
    equation:


    f(x) = max(0, x) = { x   if x ≥ 0

    0   otherwise }'
