    ln L(w,b) = -\\sum_{n=1}^{N}\\{t_n \\ln y_n + (1-t_n)\\ln(1-y_n)\\}$$\n\nYou can\
    \ see the error function at the same time. This type of function is called a cross-entropy\
    \ error function.\n\nSimilar to perceptrons, we can optimize the model by computing\
    \ the gradients of the model parameters, $w$ and $b$. The gradients can be described\
    \ as follows:\n\n$$\\frac{\\partial E(w,b)}{\\partial w} = -\\sum_{n=1}^{N}(t_n\
    \ - y_n)x_n$$\n\n$$\\frac{\\partial E(w,b)}{\\partial b} = -\\sum_{n=1}^{N}(t_n\
    \ - y_n)$$\n\nWith these equations, we can update the model parameters as follows:\n\
    \n$$w^{(k+1)} = w^{(k)} - \\eta \\frac{\\partial E(w,b)}{\\partial w} = w^{(k)}\
    \ + \\eta \\sum_{n=1}^{N}(t_n - y_n)x_n$$\n\n$$b^{(k+1)} = b^{(k)} - \\eta \\\
    frac{\\partial E(w,b)}{\\partial b} = b^{(k)} + \\eta \\sum_{n=1}^{N}(t_n - y_n)$$\n\
