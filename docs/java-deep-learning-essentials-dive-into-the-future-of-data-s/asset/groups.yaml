  mdcn: '

    与标准神经网络不同的是，RNN 在时间上隐藏层之间存在连接。时间 $t$ 的输入在时间 $t$ 的隐藏层中被激活，被保存在隐藏层中，然后与时间 $t+1$
    的输入一起传播到时间 $t+1$ 的隐藏层。这使得网络能够包含过去数据的状态并反映它们。你可能会认为 RNN 更像是一个动态模型，但如果在每个时间步展开模型，你会发现
    RNN 是一个静态模型：


    ![](img/9315e45972ec0fbaf15f9144035bca79_203_0.png)


    由于每个时间步的模型结构与一般神经网络相同，你可以使用反向传播算法训练该模型。然而，训练时需要考虑时间相关性，有一种名为 **Backpropagation
    through Time (BPTT)** 的技术来处理这个问题。在 BPTT 中，参数的误差和梯度会被反向传播到过去的层：


    ![](img/9315e45972ec0fbaf15f9144035bca79_203_1.png)


    因此，RNN 可以在模型内保留上下文。理论上，每个时间步的网络应考虑到此为止的整个序列，但实际上，为了使计算不那么复杂或防止梯度消失问题和梯度爆炸问题，通常会对模型应用一定长度的时间窗口。BPTT
    使层间训练成为可能，这也是 RNN 通常被认为是一种深度神经网络的原因。我们还拥有深度 RNN 的算法，例如隐藏层堆叠的堆叠 RNN。


    RNN 已被应用于 NLP，实际上是该领域最成功的模型之一。为 NLP 优化的原始模型称为 **recurrent neural network language
    model (RNNLM)**，由 Mikolov et al. (http://www.fit.vutbr.cz/research/groups/speech/publi/2010/mikolov_interspeech2010_IS100722.pdf)
    提出。模型架构可以如下所示：


    ![](img/9315e45972ec0fbaf15f9144035bca79_204_0.png)


    该网络有三层：输入层 $x$、隐藏层 $s$ 和输出层 $y$。隐藏层也常被称为上下文层或状态层。相对于时间 $t$ 的每一层的值可以表示如下：


    $$\begin{aligned}

    x_t &= w_t + s_{t-1} \\

    s_t &= f(Uw_t + Ws_{t-1}) \\

    y_t &= g(Vs_t)

    \end{aligned}$$


    这里，$f(\cdot)$ 表示 sigmoid 函数，$g(\cdot)$ 表示 softmax 函数。由于输入层包含时间 $t-1$ 的状态层，因此它可以将整个上下文反映到网络中。模型架构意味着
    RNNLM 可以查找比前馈 NNLM 更广的上下文，后者的上下文长度受限于 $N$ (-gram)。


    训练 RNN 时应考虑全部时间和整个上下文，但如前所述，我们经常截断时间长度，因为 BPTT 需要大量计算，并且在学习长期依赖时经常导致梯度消失/爆炸问题，因此该算法通常被称为
    **truncated BPTT**。如果我们根据时间展开 RNNLM，模型可以如下所示（图中展开时间 $\tau = 3$）：


    ![](img/9315e45972ec0fbaf15f9144035bca79_205_0.png)


    这里 $d_t$ 是输出的标签向量。那么，输出的误差向量可以表示如下：


    $$\delta_t^{out} = d_t - y_t$$


    我们得到以下方程：


    $$\delta_t^{hidden} = d\left(\left(\delta_t^{out}\right)^T V, t\right)$$


    这里 $T$ 是展开时间：


    $$d(x,t) = x s_t (1 - s_t)$$


    前述图像是隐藏层激活函数的导数。由于这里使用 sigmoid 函数，我们得到前述方程。然后，我们可以按如下方式得到过去的误差：


    $$\delta_{t-\tau-1}^{hidden} = d\left(\left(\delta_{t-\tau}^{out}\right)^T V,
    t - \tau - 1\right)$$


    利用这些方程，我们现在可以更新模型的权重矩阵：


    $$V_{t+1} = V_t + s_t \left(\delta_t^{out}\right)^T \alpha$$


    $$U_{t+1} = U_t + \sum_{\tau=0}^{T} w_{t-\tau} \left(\delta_{t-\tau}^{hidden}\right)^T
    \alpha$$


    $$W_{t+1} = W_t + \sum_{\tau=0}^{T} w_{t-\tau-1} \left(\delta_{t-\tau}^{hidden}\right)^T
    \alpha$$


    这里，*α* 是学习率。RNNLM 中有趣的是，训练后矩阵中的每个向量都显示了词语之间的差异。这是因为 *U* 是将每个词映射到潜在空间的矩阵，因此训练后，映射的词向量包含词语的含义。例如，“king”
    − “man” + “woman” 的向量计算会返回 “queen”。DL4J 支持 RNN，因此你可以使用该库轻松实现此模型。


    ## 长短期记忆网络

    使用标准 RNN 训练需要截断 BPTT。那么你可能会怀疑 BPTT 是否真的能足够训练模型以反映整个上下文，这确实是真的。这就是为什么引入了一种特殊的 RNN，即
    **long short term memory (LSTM)** 网络来解决长期依赖问题。LSTM 令人望而生畏，但让我们简要探讨一下 LSTM 的概念。


    首先，我们必须思考如何在网络中存储和传递过去的信息。虽然梯度爆炸问题可以通过为连接设置上限来简单缓解，但梯度消失问题仍需深入考虑。一种可能的方法是引入一个永久保存其输入值及其梯度的单元。因此，当你查看标准神经网络隐藏层中的一个单元时，它可以简单地描述如下：


    ![](img/9315e45972ec0fbaf15f9144035bca79_207_0.png)


    这里没有什么特别的。然后，通过在网络下方添加一个单元，网络现在可以在神经元内记忆过去的信息。这里添加的神经元具有线性激活，其值通常设置为 1。这个神经元或单元被称为
    **constant error carousel (CEC)**，因为误差像旋转木马一样留在神经元中而不会消失。CEC 作为存储单元工作并存储过去的输入。这解决了梯度消失问题，但引发了另一个问题。由于所有传播的数据都储存在神经元中，它可能也会存储噪声数据：


    ![](img/9315e45972ec0fbaf15f9144035bca79_207_1.png)


    这个问题可以分解为两个问题：*input weight conflicts* 和 *output weight conflicts*。输入权重冲突的关键思想是保留网络中的某些信息直到必要时；神经元仅在相关信息到来时被激活，否则不被激活。类似地，输出权重冲突可能发生在所有类型的神经网络中；神经元的值仅在必要时传播，否则不传播。只要神经元之间的连接用网络的权重表示，我们就无法解决这些问题。因此，需要另一种表示方法或技术来控制输入和输出的传播。但我们如何做到这一点？答案是在
    CEC 前后放置充当“门”的单元，它们分别称为 **input gate** 和 **output gate**。门的图形模型可以如下描述：


    ![](img/9315e45972ec0fbaf15f9144035bca79_208_0.png)


    理想情况下，门应返回对应于输入的离散值 0 或 1，门关闭时为 0，打开时为 1，因为它是一个门，但从程序上讲，门被设置为返回 0 到 1 范围内的值，以便可以用
    BPTT 很好地训练。


    看起来我们现在可以在确切的时间放置和获取确切的信息，但仍存在另一个问题。仅凭输入门和输出门两个门，存储在 CEC 中的记忆无法在几步内轻松刷新。因此，我们需要一个额外的门来动态改变
    CEC 的值。为此，我们在架构中添加一个 **forget gate** 来控制何时应擦除记忆。当门的值为 0 或接近 0 时，保存在 CEC 中的值会被新记忆覆盖。有了这三个门，一个单元现在可以记忆过去的信息或上下文，因此它被称为
    **LSTM block** 或 **LSTM memory block**，因为它更像是一个块而不是单个神经元。以下是表示 LSTM 块的图：


    ![](img/9315e45972ec0fbaf15f9144035bca79_209_0.png)

    '
