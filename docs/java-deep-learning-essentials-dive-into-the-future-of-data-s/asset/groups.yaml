    x.add(y)\nx.sub(y)\nx.mul(y)\nx.div(y)\n```\n\n结果分别为：\n\n```\n[[7.00,7.00]\n \
    \   [7.00,7.00]\n    [7.00,7.00]]\n```\n\n```\n[[-5.00,-3.00]\n    [-1.00,1.00]\n\
