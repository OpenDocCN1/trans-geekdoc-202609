    # 7

    Other Important Deep Learning Libraries


    In this chapter, we''ll talk about other deep learning libraries, especially libraries
    with programming languages other than Java. The following are the most famous,
    well-developed libraries:


    +   - Theano

    +   - TensorFlow

    +   - Caffe


    You''ll briefly learn about each of them. Since we''ll mainly implement them using
    Python here, you can skip this chapter if you are not a Python developer. All
    the libraries introduced in this chapter support GPU implementations and have
    other special features, so let''s dig into them.


    # Theano


    Theano was developed for deep learning, but it is not actually a deep learning
    library; it is a Python library for scientific computing. The documentation is
    available at http://deeplearning.net/software/theano/. There are several characteristics
    introduced on the page such as the use of a GPU, but the most striking feature
    is that Theano supports computational differentiation or automatic differentiation,
    which ND4J, the Java scientific computing library, doesn''t support. This means
    that, with Theano, we don''t have to calculate the gradients of model parameters
    by ourselves. Theano automatically does this instead. Since Theano undertakes
    the most complicated parts of the algorithm, implementations of math expressions
    can be less difficult.'
  - '[PAGE 224]


    Let''s see how Theano computes gradients. To begin with, we need to install Theano
    on the machine. Installation can be done just by using pip install Theano or easy_install
    Theano. Then, the following are the lines to import and use Theano:


    ```

    import theano

    import theano.tensor as T

    ```


    With Theano, all variables are processed as tensors. For example, we have scalar,
    vector, and matrix, d for double, l for long, and so on. Generic functions such
    as sin, cos, log, and exp are also defined under theano.tensor. Therefore, as
    shown previously, we often use the alias of tensor, T.


    As a first step to briefly grasp Theano implementations, consider the very simple
    parabola curve. The implementation is saved in DLWJ/src/resources/theano/1_1_parabola_scalar.py
    so that you can reference it. First, we define x as follows:


    ```

    x = T.dscalar(''x'')

    ```


    This definition is unique with Python because x doesn''t have a value; it''s just
    a symbol. In this case, x is scalar of the type d (double). Then we can define
    y and its gradient very intuitively. The implementation is as follows:


    ```

    y = x ** 2

    dy = T.grad(y, x)

    ```


    So, dy should have 2x within it. Let''s check whether we can get the correct answers.
    What we need to do additionally is to register the math function with Theano:


    ```

    f = theano.function([x], dy)

    ```


    Then you can easily compute the value of the gradients:


    ```

    print f(1)  # => 2.0

    print f(2)  # => 4.0

    ```


    Very simple! This is the power of Theano. We have x of scalar here, but you can
    easily implement vector (and matrix) calculations as well just by defining x as:


    ```

    x = T.dvector(''x'')

    y = T.sum(x ** 2)

    ```


    We won''t go further here, but you can find the completed codes in DLWJ/src/resources/theano/1_2_parabola_vector.py
    and DLWJ/src/resources/theano/1_3_parabola_matrix.py.'
