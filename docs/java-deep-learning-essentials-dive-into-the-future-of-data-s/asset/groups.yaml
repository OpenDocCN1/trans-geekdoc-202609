    \ method. In this example, we set up training data with the following code:\n\n\
    ```\nnext.shuffle();\nSplitTestAndTrain testAndTrain = next.splitTestAndTrain(0.6);\n\
    ```\n\nAs you can see, here the data is first shuffled and then split into training\
    \ data and test data. Be careful that the types of the arguments in .splitTestAndTrain()\
    \ are different from each other. This will be beneficial because we don't have\
