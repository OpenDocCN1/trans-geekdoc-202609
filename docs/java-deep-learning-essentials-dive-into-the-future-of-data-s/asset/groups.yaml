    \ Sahu\n- **制作协调员**：Arvindkumar Gupta\n- **封面设计**：Arvindkumar Gupta\n\n## 关于作者\n\
    \n**Yusuke Sugomori** 是一名创意技术专家，拥有信息工程背景。研究生期间，他与同事共同创立了 Gunosy。Gunosy 利用机器学习和基于网络的数据挖掘来确定每位用户的兴趣，并根据这些兴趣提供优化后的每日新闻推送。这款基于算法的应用自发布以来获得了极大关注，目前用户已超过\
    \ 1000 万。该公司自 2015 年 4 月 28 日起在东京证券交易所上市。\n\n2013 年，Sugomori 加入了电通（Dentsu）——日本\
    \ 2014 年非合并毛利润最大的广告公司，他在这家公司开展了广泛的数字广告、智能手机应用开发和大数据分析工作。他还被日本杂志《Web Designing》评为八位“新一代”创作者之一。\n\
    \n2016 年 4 月，他作为联合创始人兼首席技术官加入了一家医疗初创公司。\n\n## 关于审校者\n\n**Wei Di** 是一名数据科学家。她热衷于创建智能且可扩展的分析和数据挖掘解决方案，这些方案能够影响数以百万计的用户，并助力企业成功。\n\
    \n她的兴趣还广泛涵盖人工智能、机器学习和计算机视觉等领域。她曾就职于 eBay 人类语言技术团队和 eBay 研究实验室，专注于大规模应用的图像理解以及视觉与文本信息的联合学习。在此之前，她曾在\
    \ Ancestry.com 从事记录链接、搜索相关性和排序等领域的大规模数据挖掘和机器学习模型工作。她于 2011 年获得普渡大学博士学位，研究方向为数据挖掘和图像分类。\n\
    \n**Vikram Kalabi** 是一名数据科学家。他正在研究一种能够实现智能植物育种的认知系统。他的工作主要集中在预测分析和数学优化领域。他还参与过以推荐系统为重点的大规模数据驱动决策系统的开发。他对能够改善农民生活并减少全球粮食短缺的数据科学充满热情。他是约翰霍普金斯大学认证的数据科学家。\n\
