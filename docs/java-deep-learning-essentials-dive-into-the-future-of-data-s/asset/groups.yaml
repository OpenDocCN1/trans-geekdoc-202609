    a hidden unit, and w_{ij} the weight between these two units. As you can see,
    the difference between BM and RBM is that RBM doesn''t have connections between
    the same layer. Because of this restriction, the amount of calculation decreases
    and it can be applied to realistic problems.


    Now, let''s look through the theory.


    > Be careful that, as a prerequisite, the value that each visible unit and hidden
    unit in RBM can take is generally {0, 1}, that is, binary (this is the same as
