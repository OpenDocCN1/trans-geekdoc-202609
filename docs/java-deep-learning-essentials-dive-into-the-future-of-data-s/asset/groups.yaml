  - '[PAGE 143]


    Here, w is the weight of the kernel, that is, the model parameter. Just bear in
    mind we''ve described each summation from 0, not from 1, so you get a better understanding.
    The equation, however, is not enough when we think about multi-convolutional layers
    because it does not have the information from the channel. Fortunately, it''s
    not difficult because we can implement it just by adding one parameter to the
    kernel. The extended equation can be shown as:


    $$z_{ij}^{(k)} = \sum_{c} \sum_{s=0}^{m-1} \sum_{t=0}^{n-1} w_{st}^{(k,c)} x_{(i+s)(j+t)}^{(c)}$$


    Here, c denotes the channel of the image. If the number of kernels is K and the
    number of channels is C, we have $W \in \mathbb{R}^{K \times C \times m \times
    n}$. Then, you can see from the equation that the size of the convolved image
    is $(M - m +1)\times(N - n +1)$.


    After the convolution, all the convolved values will be activated by the activation
    function. We''ll implement CNN with the rectifier – the most popular function
    these days – but you may use the sigmoid function, the hyperbolic tangent, or
    any other activation functions available instead. With the activation, we have:


    $$a_{ij}^{(k)} = h\left(z_{ij}^{(k)} + b^{(k)}\right) = \max\left(0, z_{ij}^{(k)}
    + b^{(k)}\right)$$


    Here, b denotes the bias, the other model parameter. You can see that b doesn''t
    have subscripts of i and j, that is, we have $b \in \mathbb{R}^K$, a one-dimensional
    array. Thus, we have forward-propagated the values of the convolutional layer.


    Next comes the max-pooling layer. The propagation can simply be written as follows:


    $$y_{ij}^{(k)} = \max\left(a_{(l_1 i + s)(l_2 j + t)}^{(k)}\right)$$


    Here, $l_1$ and $l_2$ are the size of pooling filter and $s \in [0, l_1], t \in
    [0, l_2]$. Usually, $l_1$ and $l_2$ are set to the same value of 2 ~ 4.'
  - '[PAGE 144]


    These two layers, the convolutional layer and the max-pooling layer, tend to be
    arrayed in this order, but you don''t necessarily have to follow it. You can put
    two convolutional layers before max-pooling, for example. Also, while we put the
    activation right after the convolution, sometimes it is set after the max-pooling
    instead of the convolution. For simplicity, however, we''ll implement CNN with
    the order and sequence of convolution-activation-max-pooling.


    ![](img/9315e45972ec0fbaf15f9144035bca79_144_0.png)


    > One important note here is that although the kernel weights will be learned
    from the data, the architecture, the size of kernel, and the size of pooling are
    all parameters.


    The simple MLP follows after convolutional layers and max-pooling layers to classify
    the data. Here, since MLP can only accept one-dimensional data, we need to flatten
    the downsampled data as preprocessing to adapt it to the input layer of MLP. The
    extraction of features was completed before MLP, so formatting the data into one
    dimension won''t be a problem. Thus, CNN can classify the image data once the
    model is optimized. To do this, as with other neural networks, the backpropagation
    algorithm is applied to CNN to train the model. We won''t mention the equation
    related to MLP here.


    The error from the input layer of MLP is backpropagated to the max-pooling layer,
    and this time it is unflattened to two dimensions to be adapted properly to the
    model. Since the max-pooling layer doesn''t have model parameters, it simply backpropagates
    the error to the previous layer. The equation can be described as follows:


    $$\frac{\partial E}{\partial a^{(k)}_{(l_1+s)(l_2+j+t)}} = \begin{cases} \frac{\partial
    E}{\partial y^{(k)}_{ij}} & \text{if } y^{(k)}_{ij} = a^{(k)}_{(l_1+s)(l_2+j+t)}
    \\ 0 & \text{otherwise} \end{cases}$$


    Here, E denotes the evaluation function. This error is then backpropagated to
    the convolutional layer, and with it we can calculate the gradients of the weight
    and the bias. Since the activation with the bias comes before the convolution
    when backpropagating, let''s see the gradient of the bias first, as follows:


    $$\frac{\partial E}{\partial b^{(k)}} = \sum_{i=0}^{M-m} \sum_{j=0}^{N-m} \frac{\partial
    E}{\partial a^{(k)}_{ij}} \frac{\partial a^{(k)}_{ij}}{\partial b^{(k)}}$$'
