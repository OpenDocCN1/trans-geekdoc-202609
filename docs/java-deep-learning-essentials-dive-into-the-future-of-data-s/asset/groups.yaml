    Boltzmann Machines (RBM). To begin with, let''s take a look at the RBM that forms
    the basis of DBN. As RBM stands for Restricted Boltzmann Machines, of course there''s
    a method called Boltzmann Machines (BMs). Or rather, BMs are a more standard form
    and RBM is the special case of them. Both are one of the neural networks and both
    were proposed by Professor Hinton.


    The implementation of RBM and DBNs can be done without understanding the detailed
    theory of BMs, but in order to understand these concepts, we''ll briefly look
    at the idea BMs are based on. First of all, let''s look at the following figure,
    which shows a graphical model of BMs:'
