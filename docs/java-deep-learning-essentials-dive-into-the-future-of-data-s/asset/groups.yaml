    \ Java 深度学习库编写代码，以便我们能更专注于数据分析的关键部分而非琐碎部分。\n\n本章将学习以下主题：\n\n- Java 深度学习库的介绍\n\
    - 示例代码以及如何使用该库编写自己的代码\n- 一些额外的方法来优化模型以获得更高的精度率\n\n## 从零实现与使用库/框架\n\n我们在第 2 章《机器学习算法\
    \ – 为深度学习做准备》中实现了神经网络的机器学习算法，并在第 3 章《深度信念网络和堆叠去噪自编码器》以及第 4 章《Dropout 和卷积神经网络》中从零开始实现了许多深度学习算法。当然，我们可以用一些定制将自己的代码应用于实际应用，但在使用它们时必须谨慎，因为我们不能否认它们未来可能会引起一些问题的可能性。它们可能是什么？以下是可能的情况：\n\
    \n- 我们编写的代码缺少一些更好的优化参数，因为我们为了简洁和让你更好地理解概念，只实现了算法的精髓。虽然你仍然可以用它们训练和优化模型，但通过添加你自己的实现的另一个参数，你可以获得更高的精度率。\n\
    - 如前一章所述，本书中仍有许多有用的深度学习算法未作解释。虽然你现在已经掌握了深度学习算法的核心组件，但在你的领域和应用中获得所需结果时，你可能需要实现额外的类或方法。\n\
    - 假设的时间消耗对应用来说将非常重要，尤其是在考虑分析大量数据时。Java 相对于 Python 和 R 等其他流行语言在速度方面确实有更好的性能，但你仍需考虑时间成本。解决问题的可行方法之一是使用\
    \ GPU 而非 CPU，但这需要复杂的实现来调整代码以进行 GPU 计算。\n\n这些是主要的原因问题，你可能还需要考虑到我们在代码中没有处理异常。\n\n\
    这并不意味着从零实现会有致命错误。我们编写的代码可以作为特定规模数据的应用实质性地使用；然而，如果你使用通常需要深度学习的大规模数据挖掘，你需要考虑到你已实现的基本部分需要进一步编码。这意味着你需要记住从零实现具有更大的灵活性，因为如果需要你可以更改代码，但同时它也有负面影响，即算法的调优和维护也必须独立完成。\n\
    \n那么，我们如何解决刚才提到的问题呢？这就是库（或框架）发挥作用的地方。得益于全球对深度学习的积极研究，使用各种编程语言开发和发布了许多库。当然，每个库都有各自的特点，但每个库共同拥有的特点可以总结如下：\n\
    \n- 模型的训练只需通过定义深度学习的层结构即可完成。你可以专注于参数设置和调优，而无需考虑算法。\n- 大多数库作为开源项目向公众开放，并且每天都在积极更新。因此，如果存在错误，这些错误很可能很快会被修复（当然，自己修复错误并提交到项目中是受欢迎的）。\n\
    - 在 CPU 或 GPU 上运行程序之间切换很容易。由于库补充了 GPU 计算的繁琐编码元素，如果机器支持 GPU，你只需专注于实现而无需考虑 CPU 或\
    \ GPU。\n\n简单来说，你可以将从零实现时可能很残酷的所有部分留给库。得益于此，你可以在必要的数据挖掘部分花费更多时间，因此如果你想利用实际应用，使用库进行数据分析的可能性很高，可以更高效地进行。\n\
    \n然而，过度依赖库并不是好事。使用库很方便，但另一方面，它也有一些缺点，如下所示：\n\n- 由于你可以轻松构建各种深度学习模型，你可以在没有对模型所依据的理论有具体理解的情况下进行实现。如果我们只考虑与特定模型相关的实现，这可能不是问题，但当你想结合其他方法或在应用模型时考虑其他方法时，你将面临无法处理的风险。\n\
    - 你不能使用库不支持的算法，因此可能出现你无法选择想要使用的模型的情况。这可以通过版本升级解决，但另一方面，由于升级导致规范变更，过去实现的某些部分可能被弃用的可能性存在。此外，我们不能否认由于许可证突然变更，库的开发突然终止或使用变得收费的可能性。在这些情况下，你迄今为止开发的代码可能无法使用的风险存在。\n\
    \n"
