    relu\").dropOut(0.5)\n        .weightInit(WeightInit.XAVIER)\n        .build())\n\
    .layer(3, new OutputLayer.Builder(LossFunctions.LossFunction\n.NEGATIVELOGLIKELIHOOD)\n\
