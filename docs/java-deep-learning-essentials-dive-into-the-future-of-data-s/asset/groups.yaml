    - *第 3 章，深度信念网络与堆叠去噪自编码器*，深入探讨深度信念网络和堆叠去噪自编码器算法。\n- *第 4 章，Dropout 与卷积神经网络*，通过\
    \ Dropout 和卷积神经网络发现更多深度学习算法。\n- *第 5 章，探索 Java 深度学习库——DL4J、ND4J 及其他*，深入了解深度学习库\
    \ DL4J 及其实际用途。\n- *第 6 章，实际应用方法——循环神经网络与更多*，让您制定在现实世界中使用深度学习算法和库的策略。\n\n"
