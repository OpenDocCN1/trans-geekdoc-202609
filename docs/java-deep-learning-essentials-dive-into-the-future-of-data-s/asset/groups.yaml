    \ 224\n  - 深度学习的实用新闻来源 229\n  - 小结 232\n- 索引 233\n\n## 前言\n\n随着全球对 AI 的兴趣日益浓厚，深度学习吸引了公众的广泛关注。每天，深度学习算法都被应用于不同行业。深度学习为实现\
    \ AI 迈出了革命性的一步。尽管这是一项革命性技术，但深度学习常常被认为很复杂，因此其内容往往鲜为人知。基于深度学习的理论和概念并不复杂或困难。在本书中，我们将采用循序渐进的方法，学习正确理解深度学习所需的理论和公式。您将从零开始看到实现，并附有对实际用例注意事项的详细解释。\n\
