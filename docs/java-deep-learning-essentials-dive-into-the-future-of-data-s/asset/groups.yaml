    \    <groupId>org.nd4j</groupId>\n    <artifactId>nd4j-jcublas-7.0</artifactId>\n\
    \    <version>${nd4j.version}</version>\n</dependency>\n```\n\n可根据配置替换 `<artifactId>`\
    \ 的版本。\n\n看一个 ND4J 可进行计算的简单示例。ND4J 使用的类型是 `INDArray`，即 `Array` 的扩展类型。先导入以下依赖：\n\
    \n```java\nimport org.nd4j.linalg.api.ndarray.INDArray;\nimport org.nd4j.linalg.factory.Nd4j;\n\
    ```\n\n然后按如下定义 INDArray：\n\n```java\nINDArray x = Nd4j.create(new double[]{1,\
    \ 2, 3, 4, 5, 6}, new int[]{3, 2});\nSystem.out.println(x);\n```\n\nNd4j.create\
    \ 接受两个参数。前者定义 INDArray 中的实际值，后者定义向量 矩阵的形状。运行此代码得到以下结果：\n\n```\n[[1.00,2.00]\n\
    \    [3.00,4.00]\n    [5.00,6.00]]\n```\n\nINDArray 可通过 System.out.print 输出值，调试很方便。标量计算也很简单。如以下所示给\
    \ x 加 1：\n\n```java\nx.add(1);\n```\n\n得到以下输出：\n\n```\n[[2.00,3.00]\n    [4.00,5.00]\n\
