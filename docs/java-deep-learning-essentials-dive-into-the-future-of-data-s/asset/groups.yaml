    Here, \(\tilde{x}\) is the corrupted data, the input data with noise. Then, forward
    propagation to the hidden layer and the output layer can be represented as follows:


    \[ z_j = \sigma\left(\sum_{i=1}^{N} w_{ji}\tilde{x}_i + c_j\right) \]


    \[ y_i = \sigma\left(\sum_{j=1}^{M} w_{ij}z_j + b_i\right) \]


    Here, \(c_j\) denotes the bias of the hidden layer and \(b_i\) the bias of the
    visible layer. Also, \(\sigma\) denotes the sigmoid function. As seen in the preceding
    diagram, corrupting input data and mapping to a hidden layer is called **Encode**
    and mapping to restore the encoded data to the original input data is called **Decode**.
    Then, DA''s evaluation function can be denoted with a negative log likelihood
    function of the original input data and decoded data:


    \[ E := -\ln L(\theta) = -\sum_{i=1}^{N}\left\{x_i\ln y_i + (1-x_i)\ln(1-y_i)\right\}
    \]'
  - '[PAGE 114]


    Here, θ is the model parameter, the weight and the bias of the visible layer and
    the hidden layer. What we need to do is just find the gradients of these parameters
    against the evaluation function. To deform equations easily, we define the functions
    here:


    $$h_j := \sum_{i=1}^{N} w_{ji} \tilde{x}_i + c_j$$


    $$g_i := \sum_{j=1}^{M} w_{ji} z_j + b_i$$


    Then, we get:


    $$z_j = \sigma(h_j)$$


    $$y_i = \sigma(g_i)$$


    Using these functions, each gradient of a parameter can be shown as follows:


    $$\frac{\partial E}{\partial w_{ji}} = \frac{\partial E}{\partial h_j} \frac{\partial
    h_j}{\partial w_{ji}} + \frac{\partial E}{\partial g_i} \frac{\partial g_i}{\partial
    w_{ji}} = \frac{\partial E}{\partial h_j} \tilde{x}_i + \frac{\partial E}{\partial
    g_i} z_j$$


    $$\frac{\partial E}{\partial b_i} = \frac{\partial E}{\partial g_i} \frac{\partial
    g_i}{\partial b_i} = \frac{\partial E}{\partial g_i}$$


    $$\frac{\partial E}{\partial c_j} = \frac{\partial E}{\partial h_j} \frac{\partial
    h_j}{\partial c_j} = \frac{\partial E}{\partial h_j}$$'
  - '[PAGE 115]


    Therefore, only two terms are required. Let''s derive them one by one:


    $$\frac{\partial E}{\partial h_j} = \frac{\partial E}{\partial z_j}\frac{\partial
    z_j}{\partial h_j} = \frac{\partial E}{\partial z_j} z_j(1 - z_j)$$


    Here, we utilized the derivative of the sigmoid function:


    $$\frac{d}{dx}\sigma(x) = \sigma(x)(1 - \sigma(x))$$


    Also, we get:


    $$\frac{\partial E}{\partial z_j} = \sum_{i=1}^{N}\frac{\partial E}{\partial y_i}\frac{\partial
    y_i}{\partial z_j}$$ $$= \sum_{i=1}^{N} w_{ji}\left(x_i - y_i\right)$$


    Therefore, the following equation can be obtained:


    $$\frac{\partial E}{\partial h_j} = \left(\sum_{i=1}^{N} w_{ji}\left(x_i - y_i\right)\right)
    z_j(1 - z_j)$$


    On the other hand, we can also get the following:


    $$\frac{\partial E}{\partial g_i} = \frac{\partial E}{\partial y_i}\frac{\partial
    y_i}{\partial g_i}$$ $$= x_i - y_i$$'
  - '[PAGE 116]


    Hence, the renewed equation for each parameter will be as follows:


    $w_{ji}^{(k+1)} = w_{ji}^{(k)} + \eta\left[\left(\sum_{i=1}^{N} w_{ji}^{(k)} (x_i
    - y_i)\right) z_j (1 - z_j) \tilde{x}_i + (x_i - y_i) z_j \right]$


    $b_i^{(k+1)} = b_i^{k} + \eta (x_i - y_i)$


    $c_j^{(k+1)} = c_j^{(k)} + \eta\left(\sum_{i=1}^{N} w_{ji}^{(k)} (x_i - y_i)\right)
    z_j (1 - z_j)$


    Here, $k$ is the number of iterations and $\eta$ is the learning rate. Although
