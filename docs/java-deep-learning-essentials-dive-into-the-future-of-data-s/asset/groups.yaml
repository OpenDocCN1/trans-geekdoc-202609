    If we expand the theory, it can also handle continuous values. However, this could
    make equations complex, where it''s not the core of the theory and where it''s
    implemented with binary in the original DBN proposed by Professor Hinton. Therefore,
    we''ll also implement binary RBM in this book. RBM with binary inputs is sometimes
    called Bernoulli RBM.'
