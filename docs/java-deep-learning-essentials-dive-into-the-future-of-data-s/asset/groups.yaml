    \n仅供参考：我们有以下关系，它是对整流器的平滑近似。如上图所示，由于整流器比 sigmoid 函数和双曲正切函数简单得多，可以很容易猜到将其应用于深度学习算法时时间成本会降低。此外，由于计算反向传播误差时所需的整流器的导数也很简单，我们还可以进一步缩短时间成本。其导数的方程可表示如下：\n\
    \n$f'(x)=\\begin{cases}1 & if\\ x\\ge0\\\\0 & otherwise\\end{cases}$\n\n由于整流器及其导数都非常稀疏，我们可以很容易想象神经网络在训练过程中也会变得稀疏。你可能也注意到，我们不再需要担心梯度饱和问题，因为\
    \ sigmoid 函数和双曲正切函数所包含的饱和曲线已不存在。\n\n借助 dropout 技术和整流器，一个简单的深度神经网络可以在没有预训练的情况下学习一个问题。就实现\
    \ dropout 算法所使用的方程而言，它们并不困难，因为它们只是向多层感知器添加 dropout mask 的简单方法。让我们按顺序来看：\n\n$$Z_j\
    \ = h\\left(\\sum_i w_{ji} x_i + b_j\\right)$$\n\n这里，$h(\\cdot)$ 表示激活函数，在本例中为整流器。你看，前一个方程是无\
    \ dropout 的隐藏层单元的方程。dropout 所做的只是对它们应用 mask。可表示如下：\n\n$$Z_j = h\\left(\\sum_i\
    \ w_{ji} x_i + b_j\\right) m_j$$\n\n$$m_j \\sim \\text{Bernoulli}(1 - p)$$\n\n\
    这里，$p$ 表示 dropout 的概率，通常设为 0.5。这就是前向激活的全部内容。从方程可以看出，二进制 mask 项是与一般神经网络的唯一区别。此外，在反向传播期间，我们还必须向\
    \ delta 添加 mask。假设我们有以下方程：\n\n$$a_j = \\sum_i w_{ji} x_i + b_j$$\n\n在此基础上，我们可以如下定义\
    \ delta：\n\n$$\\delta_j := \\frac{\\partial E_n}{\\partial a_j} = \\sum_k \\frac{\\\
    partial E_n}{\\partial a_k}\\frac{\\partial a_k}{\\partial a_j}$$\n\n这里，$E_n$\
    \ 表示评估函数（这些方程与我们在 *第 2 章，机器学习算法 – 为深度学习做准备* 中提到的相同）。\n\n我们得到以下方程：\n\n$$a_k = \\\
    sum_j w_{kj}z_j + c_k$$\n$$= \\sum_j w_{kj}h(a_j)m_j + c_k$$\n\n这里，delta 可描述如下：\n\
    \n$$\\delta_j = h'(a_j)m_j\\sum_k \\delta_k w_{kj}$$\n\n现在我们有了实现所需的所有方程，让我们深入实现。包结构如下：\n\
    \n![](img/9315e45972ec0fbaf15f9144035bca79_130_0.png)\n\n首先，我们需要的是整流器。与其他激活函数一样，我们在\
    \ ActivationFunction.java 中将其实现为 ReLU：\n\n```java\npublic static double ReLU(double\
    \ x) {\n    if(x > 0) {\n        return x;\n    } else {\n        return 0.;\n\
    \    }\n}\n```\n\n此外，我们将 dReLU 定义为整流器的导数：\n\n```java\npublic static double dReLU(double\
    \ y) {\n    if(y > 0) {\n        return 1.;\n    } else {\n        return 0.;\n\
    \    }\n}\n```\n\n相应地，我们更新了 HiddenLayer.java 的构造函数以支持 ReLU：\n\n```java\nif (activation\
    \ == \"sigmoid\" || activation == null) {\n    this.activation = (double x) ->\
    \ sigmoid(x);\n    this.dactivation = (double x) -> dsigmoid(x);\n} else if (activation\
    \ == \"tanh\") {\n    this.activation = (double x) -> tanh(x);\n    this.dactivation\
    \ = (double x) -> dtanh(x);\n} else if (activation == \"ReLU\") {\n    this.activation\
    \ = (double x) -> ReLU(x);\n    this.dactivation = (double x) -> dReLU(x);\n}\
    \ else {\n    throw new IllegalArgumentException(\"activation function not supported\"\
    );\n}\n```\n\n一旦模型构建完成，下一步就是使用 dropout 训练模型。训练方法简单地称为 train。由于在计算反向传播误差时需要一些层输入，我们首先定义名为\
    \ layerInputs 的变量来缓存其各自的输入值：\n\n```\nList<double[][]> layerInputs = new ArrayList<>(nLayers+1);\n\
    layerInputs.add(X);\n```\n\n这里，X 是原始训练数据。我们还需要为反向传播缓存每一层的 dropout mask，因此将其定义为\
    \ dropoutMasks：\n\n```\nList<int[][]> dropoutMasks = new ArrayList<>(nLayers);\n\
    ```\n\n训练以前向激活的方式开始。看我们如何将 dropout mask 应用于值；我们只是将激活值与二进制 mask 相乘：\n\n```\n//\
    \ forward hidden layers\nfor (int layer = 0; layer < nLayers; layer++) {\n\n \
    \   double[] x_; // layer input\n    double[][] Z_ = new double[minibatchSize][hiddenLayerSizes[layer]];\n\
    \    int[][] mask_ = new int[minibatchSize][hiddenLayerSizes[layer]];\n\n    for\
    \ (int n = 0; n < minibatchSize; n++) {\n\n        if (layer == 0) {\n       \
    \     x_ = X[n];\n        } else {\n            x_ = Z[n];\n        }\n\n    \
    \    Z_[n] = hiddenLayers[layer].forward(x_);\n        mask_[n] = dropout(Z_[n],\
    \ pDropout);  // apply dropout mask to units\n    }\n\n    Z = Z_;\n    layerInputs.add(Z.clone());\n\
    \n    dropoutMasks.add(mask_);\n}\n```\n\ndropout 方法也在 Dropout.java 中定义。如方程所述，此方法返回遵循伯努利分布的值：\n\
    \n```java\npublic int[] dropout(double[] z, double p) {\n    int size = z.length;\n\
    \    int[] mask = new int[size];\n    for (int i = 0; i < size; i++) {\n     \
    \   mask[i] = binomial(1, 1 - p, rng);\n        z[i] *= mask[i]; // apply mask\n\
    \    }\n    return mask;\n}\n```\n\n经过隐藏层的前向传播后，训练数据在逻辑回归的输出层中进行前向传播。然后，与其他神经网络算法相同，各层的\
    \ delta 通过网络向后传播。在这里，我们将缓存的 mask 应用于 delta，以便其值在同一网络中进行反向传播：\n\n```java\n// forward\
    \ & backward output layer\nD = logisticLayer.train(Z, T, minibatchSize, learningRate);\n\
    \n// backward hidden layers\nfor (int layer = nLayers - 1; layer >= 0; layer--)\
    \ {\n    double[][] Wprev_;\n    if (layer == nLayers - 1) {\n        Wprev_ =\
    \ logisticLayer.W;\n    } else {\n        Wprev_ = hiddenLayers[layer+1].W;\n\
    \    }\n    // apply mask to delta as well\n    for (int n = 0; n < minibatchSize;\
    \ n++) {\n        int[] mask_ = dropoutMasks.get(layer)[n];\n        for (int\
    \ j = 0; j < D[n].length; j++) {\n            D[n][j] *= mask_[j];\n        }\n\
    \    }\n}\n```\n\n```\n}\n}\n\nD = hiddenLayers[layer].backward(layerInputs.get(layer),\n\
    layerInputs.get(layer+1), D, Wprev_, minibatchSize,\nlearningRate);\n}\n```\n\n\
    训练之后是测试阶段。但在将测试数据应用于调优模型之前，我们需要配置网络的权重。不能简单地将 dropout mask 应用于测试数据，因为在 mask 后，每个网络的形状会有所不同，这可能会导致不同的结果，因为某个单元可能对某些特征有显著影响。相反，我们所做的是平滑网络的权重，这意味着我们模拟整个单元被同等\
    \ mask 的网络。这可以通过以下方程实现：\n\n$$W_{test} = (1 - p)W$$\n\n从方程可以看出，所有权重都乘以非 dropout\
    \ 的概率。我们将此方法定义为 pretest：\n\n```\npublic void pretest(double pDropout) {\n\n  \
    \  for (int layer = 0; layer < nLayers; layer++) {\n\n        int nIn_, nOut_;\n\
    \n        if (layer == 0) {\n            nIn_ = nIn;\n        } else {\n     \
    \       nIn_ = hiddenLayerSizes[layer];\n        }\n\n        if (layer == nLayers\
    \ - 1) {\n            nOut_ = nOut;\n        } else {\n            nOut_ = hiddenLayerSizes[layer+1];\n\
    \        }\n\n        for (int j = 0; j < nOut_; j++) {\n            for (int\
    \ i = 0; i < nIn_; i++) {\n                hiddenLayers[layer].W[j][i] *= 1 -\
    \ pDropout;\n            }\n        }\n    }\n}\n```\n"
