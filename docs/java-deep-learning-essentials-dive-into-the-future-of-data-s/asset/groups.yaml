    \    .learningRate(1e-1)\n    .l1(0.3).regularization(true).l2(1e-3)\n    .constrainGradientToUnitNorm(true)\n\
    \    .list(3)\n    .layer(0, new DenseLayer.Builder().nIn(numInputs).nOut(3)\n\
    \        .activation(\"relu\").dropOut(0.5)\n        .weightInit(WeightInit.XAVIER)\n\
