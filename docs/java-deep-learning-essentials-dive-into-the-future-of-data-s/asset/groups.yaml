    \ CSV. Let's look at CSVExample.java in the CSV package. The first step is to\
    \ initialize the CSV reader as follows:\n\n```\nRecordReader recordReader = new\
    \ CSVRecordReader(0,\",\");\n```\n\nIn DL4J, a class called CSVRecordReader is\
    \ prepared and you can easily import data from a CSV file. The value of the first\
    \ argument in the CSVRecordReader class represents how many lines should be skipped\
    \ in the file. This is convenient when the file contains header rows. The second\
    \ argument is the delimiter. To actually read a file and import data, the code\
    \ can be written as follows:\n\n```\nrecordReader.initialize(new FileSplit(new\n\
    ClassPathResource(\"iris.txt\").getFile()));\n```\n\nWith this code, the file\
    \ in resources/iris.txt will be imported to the model. The values in the file\
    \ here are the same as ones as in the Iris dataset. To use this initialized data\
    \ for model training, we define the iterator as follows:\n\n```\nDataSetIterator\
    \ iterator = new RecordReaderDataSetIterator(recordReader,4,3);\nDataSet next\
    \ = iterator.next();\n```\n\nIn the previous example, we used the IrisDataSetIterator\
    \ class, but here the RecordReaderDataSetIterator class is used because we use\
    \ our own prepared data. The values 4 and 3 are the number of features and labels,\
    \ respectively.\n\nBuilding and training a model can be done in almost the same\
