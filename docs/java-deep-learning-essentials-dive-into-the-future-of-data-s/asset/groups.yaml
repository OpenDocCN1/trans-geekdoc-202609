    \      - 广告技术 201\n      - 职业/实践 201\n      - 体育 202\n    - 分解导向方法 202\n    -\
    \ 输出导向方法 205\n  - 小结 206\n- 第 7 章：其他重要的深度学习库 207\n  - Theano 207\n  - TensorFlow\
