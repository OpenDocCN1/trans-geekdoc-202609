  mdcn: "\n第7章 *其他重要的深度学习库* 将使用 Theano、TensorFlow 和 Caffe 进一步探索深度学习。\n\n第8章 *下一步是什么？*\
    \ 探讨了近期深度学习的发展动向和事件，并介绍了一些有用的深度学习资源。\n\n## 本书所需环境\n\n我们将使用 Lambda 表达式实现深度学习算法，因此需要\
    \ Java 8 或更高版本。此外，我们还会使用 Java 库 DeepLearning4J 0.4 或更高版本。\n\n## 本书读者对象\n\n本书面向希望了解深度学习算法并希望在应用程序中实现它们的\
    \ Java 开发者。\n\n由于本书涵盖了机器学习和深度学习的核心概念与方法，因此读者无需具备机器学习方面的经验。\n\n此外，我们将用非常简单的代码来实现深度学习算法，因此初级\
    \ Java 开发者也会发现本书对提升 Java 技能和深度学习技能都有帮助。\n\n## 排版约定\n\n在本书中，你会看到多种不同的文本样式，用以区分不同种类的信息。以下是一些样式示例及其含义说明。\n\
    \n文中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟 URL、用户输入和 Twitter 用户名将以如下形式显示：“我们来看看 convolution\
    \ 包中的 CNNMnistExample.java。”\n\n代码块如下所示：\n\n```xml\n<dependency>\n    <groupId>org.nd4j</groupId>\n\
    \    <artifactId>nd4j-jcublas-7.0</artifactId>\n    <version>${nd4j.version}</version>\n\
    </dependency>\n```\n\n任何命令行输入或输出写作如下：\n\n```text\n[[7.00,7.00]\n [7.00,7.00]\n\
    \ [7.00,7.00]]\n```\n\n**新术语和重要词汇**以粗体显示。你在屏幕上看到的文字，例如菜单或对话框中的文字，会以如下形式出现在文中：“如果你使用的是\
    \ IntelliJ，可以通过 **File | New | Project** 从现有源导入项目。”\n\n> 警告或重要提示会出现在这样的框中。\n\n\
    ![](img/9315e45972ec0fbaf15f9144035bca79_13_0.png)\n\n> 提示和技巧会出现在这样的框中。\n\n![](img/9315e45972ec0fbaf15f9144035bca79_13_1.png)\n\
