    \n## 学习率优化\n\n我们迄今为止学习了各种深度学习算法；你可能已经注意到它们有一个共同的参数：学习率。学习率定义在更新模型参数的方程中。那么，为什么不考虑优化学习率的算法呢？最初，这些方程描述如下：\n\
