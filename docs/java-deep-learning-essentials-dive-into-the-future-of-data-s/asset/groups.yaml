    ## 摘要


    在本章中，你学习了如何使用 ND4J 和 DL4J 库实现深度学习模型。两者都支持 GPU 计算，并且都能让我们在没有任何困难的情况下实现它们。ND4J 是一个用于科学计算的库，并支持向量化，这使得在数组之间实现计算变得更容易，因为我们不需要在其中编写迭代。由于机器学习和深度学习算法包含许多涉及向量计算的方程，例如内积和逐元素乘法，ND4J
    也有助于实现它们。


    DL4J 是一个深度学习库，通过使用该库的一些示例，你看到了我们可以轻松构建、训练和评估各种类型的深度学习模型。此外，在构建模型的过程中，你学习了为什么正则化对于获得更好的结果是必要的。你还了解了一些学习率优化器：momentum、ADAGRAD
    和 ADADELTA。所有这些都可以用 DL4J 轻松实现。


    你获得了深度学习算法的核心理论和实现方面的知识，并且现在知道如何以很少的困难实现它们。我们可以说，我们已经完成了本书的理论部分。因此，在下一章中，我们将首先了解深度学习算法如何被应用于实际应用，然后再探讨其他可能的领域和应用算法的思路。


    ## 6

    ## 面向实际应用的方法 – 循环神经网络及其他


    在之前的章节中，你已经学习了大量关于深度学习的内容。你现在应该理解了深度神经网络的概念、理论和实现的基本原理。你还了解到，通过利用深度学习库，你可以相对轻松地在各种数据上尝试深度学习算法。下一步是研究深度学习如何应用于更广泛的其他领域以及如何将其用于实际应用。


    因此，在本章中，我们将首先了解深度学习实际是如何应用的。在这里，你会看到深度学习实际被利用的案例仍然很少。但为什么即使是这样创新的方法，案例也不多呢？问题是什么？稍后我们会思考原因。此外，今后我们还将考虑可以将深度学习应用于哪些领域，并有机会将深度学习和所有相关的人工智能领域应用起来。


    本章涵盖的主题包括：

    - 图像识别、自然语言处理，以及与之相关的神经网络模型和算法

    - 将深度学习模型转化为实际应用的困难

    - 深度学习可以应用的可能领域，以及如何处理这些领域的思路


    我们将探索这场巨大的人工智能热潮的潜力，这将带来你可以利用的想法和提示，用于你的研究、业务和各种活动中的深度学习。


    ## 深度学习活跃的领域


    我们经常听到深度学习的研究一直都在进行中，这是一个事实。许多公司，尤其是像 Google、Facebook、Microsoft 和 IBM 这样的大型科技公司，投入了巨额资金用于深度学习研究，我们经常听到某些公司收购了这些研究团队的消息。然而，从整体来看，深度学习本身具有各种类型的算法，以及这些算法可以应用的领域。即使如此，人们普遍不知道深度学习在哪些领域被利用或可以被使用，这是一个事实。由于“AI”一词被广泛使用，人们无法正确理解哪种技术用于哪个产品。因此，在本节中，我们将介绍人们积极尝试将深度学习应用于实际应用的领域。


    ### 图像识别


    深度学习最常被纳入的领域是图像识别。正是 Hinton 教授及其团队的发明引出了“深度学习”这一术语。他们的算法在图像识别竞赛中创下了有史以来最低的错误率。对算法进行持续改进的研究带来了更好的结果。现在，利用深度学习的图像识别不仅在研究中逐渐被采用，也被用于实际应用和产品。例如，Google
    利用深度学习为 YouTube 自动生成缩略图，或在 Google Photos 中自动标记和搜索照片。像这些流行产品一样，深度学习主要应用于图像标记或分类，例如在机器人领域，它被用于让机器人识别周围的事物。


    我们能够支持这些产品和行业的原因是深度学习更适合图像处理，因为它能够实现比任何其他领域应用更高的精确率。正是由于图像识别的精确率和召回率如此之高，才意味着该行业具有广阔的潜力。使用深度学习算法，MNIST
    图像分类的错误率记录为 0.21%（http://cs.nyu.edu/~wanli/dropc/），而该记录不低于人类的记录（http://arxiv.org/pdf/0710.2231v1.pdf）。换句话说，如果仅限于图像识别，这不过是机器可能超越人类的事实。为什么只有图像识别能获得如此高的精度，而其他领域的方法仍需要大幅改进？


    其中一个原因是深度学习中特征提取的结构非常适合图像数据。在深度神经网络中，堆叠了许多层，并在每一层逐步从训练数据中提取特征。也可以说图像数据具有分层结构。当你看图像时，你会无意识地先捕捉到简要特征，然后再深入到更详细的特征。因此，深度学习特征提取的固有属性与图像的感知方式相似，因此我们可以准确地实现特征。虽然深度学习图像识别仍需要更多改进，特别是机器如何理解图像及其内容，但仅通过将深度学习应用于未经预处理的样本图像数据就能获得高精度，这显然意味着深度学习和图像数据是很好的匹配。


    另一个原因是人们一直在缓慢而稳步地改进算法。例如，在深度学习算法中，能够获得图像识别最佳精度的 CNN，每次遇到困难/任务时都会得到改进。引入了卷积层的核替代局部感受野，以避免网络变得过于密集。此外，还发明了诸如最大池化之类的下采样方法，以避免网络对图像位置差距的过度反应。这最初源于如何识别邮政编码等特定框架中手写字母的试错过程。因此，有许多案例是在寻求新的方法来将神经网络算法适配到实际应用中。复杂的模型
    CNN 也是基于这些累积但稳步的改进构建的。虽然深度学习不需要特征工程，但我们仍需要考虑解决特定问题的适当方法，也就是说，我们无法构建全能模型，这在优化中被称为无免费午餐定理（NFLT）。


    在图像识别领域，深度学习可以实现的分类准确率极高，并且实际上已经开始被用于实际应用。然而，深度学习可以应用的领域应该更多。图像与许多行业密切相关。未来，将会有更多案例和更多行业利用深度学习。在本书中，让我们在接下来的章节中思考，考虑到深度学习的兴起，我们可以将图像识别应用于哪些行业。

    '
