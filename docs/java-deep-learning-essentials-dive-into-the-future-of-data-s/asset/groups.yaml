    sum_h \\exp(-E(v,h)) \\right) - \\frac{\\partial}{\\partial \\theta}\\left( ln\
    \ \\sum_{v,h} \\exp(-E(v,h)) \\right)$$ $$= -\\frac{1}{\\sum_h \\exp(-E(v,h))}\
    \ \\sum_h \\exp(-E(v,h)) \\frac{\\partial E(v,h)}{\\partial \\theta}$$ $$= +\\\
    frac{1}{\\sum_h \\exp(-E(v,h))} \\sum_{v,h} \\exp(-E(v,h)) \\frac{\\partial E(v,h)}{\\\
    partial \\theta}$$ $$= -\\sum_h p(h|v) \\frac{\\partial E(v,h)}{\\partial \\theta}\
    \ + \\sum_{v,h} p(v|h) \\frac{\\partial E(v,h)}{\\partial \\theta}$$\n\nSome equations\
    \ in the middle are complicated, but it turns out to be simple with the term of\
    \ the probability distribution of the model and the original data.\n\nTherefore,\
    \ the gradient of each parameter is shown as follows:\n\n$$\\frac{\\partial ln\
    \ L(\\theta | v)}{\\partial w_{ij}} = \\sum_h p(h|v) \\frac{\\partial E(v,h)}{\\\
    partial w_{ij}} + \\sum_{v,h} p(h|v) \\frac{\\partial E(v,h)}{\\partial w_{ij}}$$\
    \ $$= \\sum_h p(h|v) h_j v_i - \\sum_v p(v) \\sum_h p(h|v) h_j v_i$$ $$= p(H_j=1|v)\
    \ v_i - \\sum_v p(v) p(H_j=1|v) v_i$$ $$\\frac{\\partial ln L(\\theta | v)}{\\\
    partial b_i} = v_i - \\sum_v p(v) v_i$$ $$\\frac{\\partial ln L(\\theta | v)}{\\\
    partial c_j} = p(H_j=1|v) - \\sum_v p(v) p(H_j=1|v)$$"
  - '[PAGE 99]


    Now then, we could find the equation of the gradient, but a problem occurs when
    we try to apply this equation as it is. Think about the term of $\sum_v p(v)$.
    This term implies that we have to calculate the probability distribution for all
    the $\{0, 1\}$ patterns, which can be assumed as input data that includes patterns
    that don''t actually exist in the data.


    We can easily imagine how this term can cause a combinatorial explosion, meaning
    we can''t solve it within a realistic time frame. To solve this problem, the method
    for approximating data using Gibbs sampling, called **Contrastive Divergence (CD)**,
    was introduced. Let''s look at this method now.


    Here, $v^{(0)}$ is an input vector. Also, $v^{(k)}$ is an input (output) vector
    that can be obtained by sampling for k-times using this input vector.


    Then, we get:


    $h_j^{(k)} \sim p\big(h_j \mid v^{(k)}\big)$


    $h_i^{(k+1)} \sim p\big(v_i \mid h^{(k)}\big)$


    Hence, when approximating $p(v)$ after reiterating Gibbs sampling, the derivative
    of the log likelihood function can be represented as follows:


    $\frac{\partial \ln L(\theta \mid v)}{\partial \theta} = -\sum_h p(h \mid v)\frac{\partial
    E(v,h)}{\partial \theta} + \sum_{v,h} p(v,h)\frac{\partial E(v,h)}{\partial \theta}$


    $\approx -\sum_h p(h \mid v^{(0)})\frac{\partial E(v,h)}{\partial \theta} \sum_{v,h}
    p(h,v^{(k)})\frac{\partial E(v^{(k)},h)}{\partial \theta}$'
  - '[PAGE 100]


    Therefore, the model parameter can be shown as follows:


    $$w_{ij}^{(\tau+1)} = w_{ij}^{(\tau)} + \eta\big(p\big(H_j = 1 \mid v^{(0)}\big)v_i^{(0)}
    - p\big(H_j = 1 \mid v^{k}\big)v_i^{k}\big)$$ $$b_i^{(\tau+1)} = b_i^{(\tau)}
    + \eta\big(v_i^{(0)} - v_i^{k}\big)$$ $$c_j^{(\tau+1)} = c_j^{(\tau)} + \eta\big(p\big(H_j
    = 1 \mid v^{(0)}\big) - p\big(H_j = 1 \mid v^{k}\big)\big)$$


    Here, τ is the number of iterations and η is the learning rate. As shown in the
    preceding formulas, generally, CD that performs sampling k-times is shown as CD-k.
    It''s known that CD-1 is sufficient when applying the algorithm to realistic problems.


