    \n```java\npublic double[] reconstruct(double[] x) {\n    double[] z = getHiddenValues(x);\n\
    \    double[] y = getReconstructedInput(z);\n    return y;\n}\n```\n\n## 堆叠去噪自编码器（SDA）\n\
    \nSDA 是堆叠了 DA 层的深度神经网络。与 DBN 由 RBM 和逻辑回归组成相同，SDA 由 DA 和逻辑回归组成：\n\n![](img/9315e45972ec0fbaf15f9144035bca79_119_0.png)\n\
