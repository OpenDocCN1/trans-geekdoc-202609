  mdcn: "\n预训练的方法并没有太大不同，但请注意，原本在 DBN 中使用 `int` 类型的地方改为了 `double` 类型，因为 DA 处理的是 [0,\
    \ 1] 区间内的数据，而不是二值数据：\n\n```\npublic void pretrain(double[][][] X, int minibatchSize,\
    \ int minibatch_N, int epochs, double learningRate, double corruptionLevel) {\n\
    \    for (int layer = 0; layer < nLayers; layer++) {\n        for (int epoch =\
    \ 0; epoch < epochs; epoch++) {\n            for (int batch = 0; batch < minibatch_N;\
    \ batch++) {\n                double[][] X_ = new double[minibatchSize][nIn];\n\
    \                double[][] prevLayerX_;\n                // Set input data for\
    \ current layer\n                if (layer == 0) {\n                    X_ = X[batch];\n\
    \                } else {\n                    prevLayerX_ = X_;\n           \
    \         X_ = new double[minibatchSize][hiddenLayerSizes[layer-1]];\n       \
    \             for (int i = 0; i < minibatchSize; i++) {\n                    \
    \    X_[i] = sigmoidLayers[layer-1].output(prevLayerX_[i]);\n                \
    \    }\n                }\n                daLayers[layer].train(X_, minibatchSize,\
    \ learningRate, corruptionLevel);\n            }\n        }\n    }\n}\n```\n\n\
    学习完成后的预测方法也与 DBN 完全相同。考虑到 DBN 和 SDA 在学习后都可以被视为一个多层神经网络（即预训练和微调），那么大部分过程是共通的也就很自然了。\n\
    \n总体来说，SDA 比 DBN 更容易实现，但能获得的精度几乎相同。这正是 SDA 的优点。\n\n## 小结\n\n在本章中，我们探讨了之前神经网络算法存在的问题，以及深度学习的突破口是什么。同时，你还学习了\
    \ DBN 和 SDA 的理论与实现——正是这两种算法推动了深度学习的热潮，以及它们各自所采用的 RBM 和 DA 方法。\n\n在下一章中，我们将研究更多的深度学习算法。这些算法采用不同的方法来获得高精度，并且已经发展得相当成熟。\n\
    \n## 4 随机丢弃（Dropout）与卷积神经网络\n\n在本章中，我们继续审视深度学习的各种算法。预训练被同时用于 DBN 和 SDA，确实是一种创新方法，但深度学习还有其他创新方法。在这些方法中，我们将深入探讨尤为著名的两种算法：\n\
    \n- 随机丢弃（Dropout）学习算法\n- 卷积神经网络\n\n这两种算法都是理解和掌握深度学习所必需的，请务必跟上。\n\n### 无需预训练的深度学习算法\n\
    \n在上一章中，你了解到带有预训练的逐层训练是 DBN 和 SDA 的突破点。这些算法需要预训练的原因在于：在简单堆叠层的神经网络中，会出现输出误差逐渐消失且无法正常工作的问题（我们称之为梯度消失问题）。无论你是想改进现有方法还是重新发明方法，深度学习算法似乎都需要预训练——你可以这样理解。\n\
    \n然而，实际上本章中的深度学习算法并没有预训练阶段，尽管在没有预训练的深度学习算法中，我们却能得到更高精度和准确率的结果。为什么能做到这一点呢？这里有一个简要的原因。让我们想想梯度消失问题为什么会发生——还记得反向传播的方程吗？某一层的\
    \ delta 通过字面意义上的反向传播网络，被分配到前一层所有单元上。这意味着在一个所有单元紧密连接的网络中，反向传播到每个单元的误差值会变得很小。从反向传播方程可以看出，权重的梯度是通过单元之间的权重和\
    \ delta 相乘得到的。因此，项数越多，网络越稠密，发生下溢的可能性就越大。这就导致了梯度消失问题。\n\n因此，我们可以说，如果上述问题可以在不进行预训练的情况下避免，那么机器就可以通过深层神经网络进行正确的学习。要实现这一点，我们需要调整网络的连接方式。本章中的深度学习算法正是利用各种方法将这种巧思付诸实践。\n\
    \n### 随机丢弃（Dropout）\n\n如果网络连接得过于稠密是个问题，那就强制让它变得稀疏。这样梯度消失问题就不会发生，学习也能正常进行。基于这种思想的算法就是随机丢弃算法。深度神经网络的\
    \ Dropout 最早在《Improving neural networks by preventing co-adaptation of feature\
    \ detectors》（Hinton 等，2012，http://arxiv.org/pdf/1207.0580.pdf）中提出，并在《Dropout:\
    \ A Simple Way to Prevent Neural Networks from Overfitting》（Srivastava 等，2014，https://www.cs.toronto.edu/~hinton/absps/JMLRdropout.pdf）中进一步完善。在\
    \ Dropout 中，一些单元在训练时会被字面意义上地强行丢弃。这意味着什么呢？我们来看下面的图——首先是神经网络：\n\n![](img/9315e45972ec0fbaf15f9144035bca79_125_0.png)\n\
    \n这张图没有什么特别之处。它是一个标准的神经网络，包含一个输入层、两个隐藏层和一个输出层。其次，对这个网络应用 Dropout 后，图形化模型可以表示如下：\n\
    \n![](img/9315e45972ec0fbaf15f9144035bca79_126_0.png)\n\n从网络中丢弃的单元用叉号标记。如上图所示，被丢弃的单元在网络中被视为不存在。这意味着在应用\
    \ Dropout 学习算法的过程中，我们需要改变原始神经网络的结构。幸运的是，从计算角度来看，对网络应用 Dropout 并不困难。你可以先构建一个普通的深度神经网络。然后只需在每一层的所有单元上添加一个\
    \ dropout 掩码——一个简单的二值掩码——即可应用 Dropout 学习算法。二值掩码中值为 0 的单元就是那些从网络中被丢弃的单元。\n\n这可能让你想起上一章讨论的\
    \ DA（或 SDA），因为 DA 和 Dropout 乍看之下很相似。DA 中损坏输入数据在实现时也会向数据添加二值掩码。然而，它们之间有两点显著的不同。首先，虽然两种方法确实都有向神经元添加掩码的过程，但\
    \ DA 只将掩码应用于输入层的单元，而 Dropout 则将其应用于隐藏层的单元。有些 Dropout 算法会同时将掩码应用于输入层和隐藏层，但这仍然与\
    \ DA 不同。其次，在 DA 中，一旦损坏的输入数据生成，该数据就会在整个训练周期中使用；而在 Dropout 中，每个训练周期都会使用具有不同掩码的数据。这表明每次迭代训练的是不同形状的神经网络。Dropout\
    \ 掩码会在每次迭代的每一层根据 Dropout 的概率生成。\n\n你可能会有疑问：即使网络的形状每一步都不同，我们还能训练模型吗？答案是肯定的。你可以这样理解：使用\
    \ Dropout 训练网络效果很好，因为它会给现有神经元赋予更大的权重，以反映输入数据的特征。然而，Dropout 有一个缺点，那就是它比其他算法需要更多的训练周期来训练和优化模型，这意味着它需要更长的时间才能达到最优。这里还引入了另一种技术来减少这个问题。虽然\
    \ Dropout 算法本身更早被发明，但仅靠这种方法还不足以让深度神经网络获得泛化能力并达到高精度。通过另一种让网络更加稀疏的技术，我们使得深度神经网络获得了更高的准确率。这项技术是对激活函数的改进，可以说是一个简单而优雅的解决方案。\n\
    \n迄今为止解释的所有神经网络方法都使用 sigmoid 函数或双曲正切函数作为激活函数。使用这些函数也许能得到很好的结果。然而，从它们的形状可以看出，当某一层的输入值或误差值相对较大或较小时，这些曲线会饱和并杀死梯度。\n\
    \n为了解决这个问题而引入的激活函数之一是整流器（rectifier）。应用了整流器的单元被称为修正线性单元（ReLU）。我们也可以把激活函数本身称为 ReLU。该函数描述如下：\n\
    \nf(x) = max(0, x) = { x   当 x ≥ 0\n0  其他情况 }\n\n"
