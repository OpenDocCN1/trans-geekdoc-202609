    \ research blog, 1.5 months before the DeepMind Challenge Match was held, DeepMind\
    \ could predict the human's moves 57% of the time (http://googleresearch.blogspot.jp/2016/01/alphago-mastering-ancient-game-of-go.html).\
    \ The fact that a machine won against a human definitely had an impact, but the\
    \ fact that a machine could learn the strategy of Go within a realistic time was\
    \ even more surprising. DeepMind applies deep neural networks with the combination\
    \ of Monte Carlo tree search and reinforcement learning, which shows the width\
    \ of the application range for the algorithm of deep neural networks.\n\n### Expected\
    \ next actions\n\nSince the news about AlphaGo was featured in the media, the\
    \ AI boom has definitely had a boost. You might notice that you hear the words\
    \ \"deep learning\" in the media more often recently. It can be said that the\
    \ world's expectations of AI have been increased that much. What is interesting\
    \ is that the term \"deep learning,\" which was originally a technical term, is\
    \ now used commonly in daily news. You can see that the image of the term AI has\
    \ been changing. Probably, until just a few years ago, if people heard about AI,\
    \ many of them would have imagined an actual robot, but how about now? \"The term\
    \ AI is now often used – not particularly consciously – with regard to software\
    \ or applications, and is accepted as commonplace. This is nothing but an indication\
    \ that the world has started to understand AI, which has been developed for research,\
    \ correctly. If a technology is taken in the wrong direction, it generates repulsion,\
    \ or some people start to develop the technology incorrectly; however, it seems\
    \ that this boom in AI technology is going in a good direction so far.\n\nWhile\
    \ we are excited about the development of AI, as a matter of course, some people\
    \ feel certain fears or anxieties. It's easy to imagine that some people might\
    \ think the world where machines dominate humans, like in sci-fi movies or novels,\
    \ is coming sooner or later, especially after AlphaGo won over Lee Sedol in the\
    \ Go world, where it was said to be impossible for a machine to beat a human;\
    \ the number of people who feel anxious might increase. However, although the\
    \ news that a machine has beaten a human could be taken as a negative if you just\
    \ focus on the fact that \"a machine won,\" this is definitely not negative news.\
    \ Rather, it is great news for humankind. Why? Here are two reasons.\n\nThe first\
    \ reason is that the Google DeepMind Challenge Match was a match in which the\
    \ human was handicapped. Not only for Go, but also for card games or sports games,\
    \ we usually do research about what tactics the opponents will use before a match,\
    \ building our own strategy by studying opponents' action patterns. DeepMind,\
    \ of course, has studied professional Go players' tactics and how to play, whereas\
    \ humans couldn't study enough about how a machine plays, as DeepMind continued\
    \ studying and kept changing its action patterns until the last minutes before\
    \ the Google DeepMind Challenge Match. Therefore, it can be said that there was\
    \ an information bias or handicap. It was great that Lee Sedol won one match with\
    \ these handicaps. Also, it indicates that AI will develop further.\n"
  mdcn: "\n它只是使用协议文件`lenet_solver.prototxt`运行`caffe`命令。该文件配置模型的超参数，例如学习率和动量。该文件还引用了网络配置文件，在本例中是`lenet_train_test.prototxt`。你可以使用类似JSON的描述来定义每一层：\n\
    \n```\nlayer {\n  name: \"conv1\"\n  type: \"Convolution\"\n  bottom: \"data\"\
    \n  top: \"conv1\"\n  param {\n    lr_mult: 1\n  }\n  param {\n    lr_mult: 2\n\
    \  }\n  convolution_param {\n    num_output: 20\n    kernel_size: 5\n    stride:\
    \ 1\n    weight_filler {\n      type: \"xavier\"\n    }\n    bias_filler {\n \
    \     type: \"constant\"\n    }\n  }\n}\n```\n\n因此，基本上，协议文件分为两部分：\n\n- **网络（Net）**：定义模型的详细结构，并描述每一层，从而构成整个神经网络\n\
    - **求解器（Solver）**：定义优化设置，例如使用CPU/GPU、迭代次数，以及模型的超参数（如学习率）\n\n当你需要以主流方法将深度学习应用于大型数据集时，Caffe是一个很好的工具。\n\
    \n## 总结\n\n在本章中，你学习了如何使用Theano、TensorFlow和Caffe实现深度学习算法和模型。它们都有特殊而强大的功能，而且每一个都非常有用。如果你对其他库和框架感兴趣，可以使用Chainer\
    \ (http://chainer.org/)、Torch (http://torch.ch/)、Pylearn2 (http://deeplearning.net/software/pylearn2/)、Nervana\
    \ (http://neon.nervanasys.com/) 等等。当你真正考虑使用前面提到的某个库构建应用程序时，也可以参考一些基准测试（https://github.com/soumith/convnet-benchmarks\
    \ 和 https://github.com/soumith/convnet-benchmarks/issues/66）。\n\n在本书中，你学习了机器学习和深度学习的基础理论和算法，以及深度学习如何应用于学习/商业领域。凭借你在这里学到的知识和技术，你应该能够应对所面临的任何问题。虽然要实现AI确实还需要更多的步骤，但你现在拥有了实现创新的最大机会。\n\
    \n## 8 下一步是什么？\n\n在前面的章节中，我们学习了深度学习的概念、理论、实现以及如何使用相关库。现在你已经掌握了深度学习的基本技术，所以不用担心。另一方面，深度学习的发展非常迅速，明天可能就会出现新模型。关于AI或深度学习的大新闻每天都接连不断。既然你已经掌握了基本技术，就可以快速学习AI和深度学习即将出现的新技术。现在，让我们暂时放下技术的细节，思考AI领域将会或应该走什么样的道路。深度学习的未来是什么？作为最后一章，让我们来思考这个问题。本章将讨论以下主题：\n\
    \n- 深度学习行业的热门话题\n- 如何管理AI技术\n- 如何进一步推进深度学习的研究\n\n至于最后一个主题——进一步学习，我将推荐一个关于深度学习的网站。你可以通过思考接下来可能出现的科技，或利用你学到的技术进行创新，从而保持领先，而不是被动地跟随AI的发展。\n\
    \n### 深度学习的重大新闻\n\n深度学习引发了AI热潮，其势头无法阻挡。每天都有新的成果被报道。如*第6章，实际应用方法——循环神经网络及其他*中所述，许多研究者在图像识别和自然语言处理领域竞争。当然，深度学习不仅限于这两个领域，还适用于许多其他领域。这些应用的结果非常令人兴奋。\n\
    \n在这次AI热潮中，2016年3月，围棋界被一件事震撼。围棋是一种两人对弈的棋类游戏，双方试图占领比对手更多的领地。当一台机器，也就是AI，在围棋上击败人类时，“AI在围棋中击败人类”的消息不仅震惊了围棋玩家，也震惊了全世界。被谷歌收购的DeepMind\
    \ (https://deepmind.com/) 一直在开发名为AlphaGo的围棋AI，AlphaGo第四次击败了世界级棋手李世石，在谷歌DeepMind挑战赛中以4比1赢得了五局系列赛。每场比赛都通过YouTube直播，许多人在线实时观看。如果你还没看过这五场比赛，可以在YouTube上观看：\n\
    \n- **第一局：** https://www.youtube.com/watch?v=VfR3K2DORc8\n- **第二局：** https://www.youtube.com/watch?v=-l-GsfyVCBu0\n\
    - **第三局：** https://www.youtube.com/watch?v=qUZmTYHEyM8\n- **第四局：** https://www.youtube.com/watch?v=yCALyQRN3hw\n\
    - **第五局：** https://www.youtube.com/watch?v=mzpW1ODPHeQ\n\n在这些比赛中，第一局获得了特别多的关注。此外，从超过135万的页面浏览量来看，你可以看到很多人观看了第四局的视频，这是AlphaGo唯一输给李世石的一局。下面是一张捕捉第一局某个场景的图片：\n\
    \n![](img/9315e45972ec0fbaf15f9144035bca79_238_0.png)\n\nAlphaGo击败李世石的瞬间 (https://www.youtube.com/watch?v=VfR3K2DORc8)\n\
    \n那一刻，不仅AI研究人员，全世界都为AlphaGo感到兴奋；但为什么这条新闻会获得如此多的关注呢？再举一个棋类游戏的例子：在国际象棋比赛中，IBM开发的深蓝在1997年击败了国际象棋世界冠军。当然，这在当时也是大新闻，因为那也是机器击败人类的时刻。那么，既然这并非机器第一次击败人类，为什么AlphaGo战胜李世石的消息如此震惊世界？国际象棋和围棋有什么区别呢？嗯，区别在于围棋模式的复杂性。事实上，围棋的策略模式比国际象棋多得多。在国际象棋、将棋和围棋等流行棋类游戏中，决定胜负的模式数量如下：\n\
    \n- 国际象棋：10^120\n- 将棋：10^220\n- 围棋：10^360\n\n即使只看这些数字，你也能看出围棋的策略有多复杂，并且很容易想象到机器也需要海量的计算。由于模式数量如此庞大，直到最近，人们还认为AlphaGo不可能击败人类，或者认为AlphaGo要过100年或200年才能击败人类。人们曾认为，机器不可能在现实的时间内计算围棋的模式。但现在，仅仅几年时间，一台机器就击败了人类。根据谷歌研究博客，在DeepMind挑战赛举行前1.5个月，DeepMind在57%的情况下能够预测人类棋手的走法\
    \ (http://googleresearch.blogspot.jp/2016/01/alphago-mastering-ancient-game-of-go.html)。机器战胜人类的事实无疑产生了影响，但机器能在现实时间内学会围棋策略这一事实更令人惊讶。DeepMind将深度神经网络与蒙特卡洛树搜索和强化学习相结合，这展示了深度神经网络算法应用范围的广度。\n\
    \n### 预期的下一步行动\n\n自从AlphaGo的新闻被媒体报道后，AI热潮肯定得到了推动。你可能会注意到，最近在媒体上听到“深度学习”这个词的频率更高了。可以说，世界对AI的期望已经提高了那么多。有趣的是，“深度学习”这个原本是技术术语的词，现在已常用于日常新闻中。你可以看到，“AI”这个词的形象一直在改变。也许就在几年前，如果人们听到AI，很多人会想象一个真正的机器人，但现在呢？“AI”这一术语现在经常被使用——并非特别刻意——用来指代软件或应用程序，并且已被普遍接受。这无非是表明，世界已经开始正确理解AI——这个为研究而开发的技术。如果一项技术被引向错误的方向，就会招致反感，或者有些人开始以错误的方式开发该技术；然而，到目前为止，这次AI技术热潮似乎正朝着一个好的方向发展。\n\
    \n当我们对AI的发展感到兴奋时，理所当然，有些人也会感到某些恐惧或焦虑。很容易想象，有些人可能会认为机器统治人类的世界——就像科幻电影或小说中那样——迟早会到来，尤其是在AlphaGo在围棋界战胜李世石之后，而围棋界曾被认为机器不可能击败人类；感到焦虑的人数可能会增加。然而，尽管如果你只关注“机器赢了”这一事实，机器击败人类的新闻可能会被视为负面消息，但这绝对不是负面新闻。相反，这对人类来说是个好消息。为什么？这里有两个原因。\n\
    \n第一个原因是，谷歌DeepMind挑战赛是一场人类处于劣势的比赛。不仅在围棋中，在纸牌游戏或体育比赛中，我们通常也会在赛前研究对手会使用什么战术，通过研究对手的行动模式来构建自己的策略。当然，DeepMind研究了职业围棋棋手的战术和棋路，而人类却无法充分研究机器如何下棋，因为DeepMind在谷歌DeepMind挑战赛开始前的最后时刻仍在不断研究并改变其行动模式。因此，可以说存在信息偏差或不利条件。李世石能在这些不利条件下赢下一局，已经非常了不起了。而且，这也表明AI将会进一步发展。\n"
