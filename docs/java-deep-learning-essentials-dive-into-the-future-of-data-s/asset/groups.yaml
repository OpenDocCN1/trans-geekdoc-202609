  mdcn: "\n\n## 接下来是什么？\n\n第一个是 **GitXiv** (http://gitxiv.com/)。其首页如下：\n\n![](img/9315e45972ec0fbaf15f9144035bca79_246_0.png)\n\
    \n在 GitXiv 中，主要收录基于论文的文章。但除了论文链接外，它还提供了用于测试的代码链接，因此可以缩短你的研究时间。当然，它会不断更新新的实验，所以你可以看到哪种方法占主导，或者深度学习目前在哪个领域火热。如果你注册了电子邮件地址，它会持续发送最新信息。你应该试试：\n\
    \n![](img/9315e45972ec0fbaf15f9144035bca79_247_0.png)\n\n第二个是 Deep Learning News\
    \ (http://news.startup.ml/)。这是一个深度学习和机器学习相关主题的链接集合。它的界面与 Hacker News (https://news.ycombinator.com/)\
    \ 相同，后者涉及整个科技行业的新闻，所以如果你知道 Hacker News，应该对布局很熟悉：\n\n![](img/9315e45972ec0fbaf15f9144035bca79_247_1.png)\n\
    \nDeep Learning News 上的信息更新不那么频繁，但它不仅提供实现或技巧方面的建议，还提供深度学习可以应用在哪些领域的建议，并包含深度学习和机器学习相关活动信息，因此对构思或灵感很有用。如果你稍微看一下首页列表中的网址，可能会产生好主意。\n\
    \n除了我们在这里挑选的两个之外，还有更多有用的网站、资料和社区，例如 Google+ 上的深度学习小组 (https://plus.google.com/communities/112866381580457264725)，所以你应该关注适合你的媒体。无论如何，现在这个行业正在快速发展，时刻关注最新信息绝对是必要的。\n\
    \n## 总结\n\n在本章中，我们从 AlphaGo 作为爆炸性新闻的例子出发，思考了深度学习将如何发展或应该如何发展。机器在某些领域战胜人类并不值得恐惧，这同时也是人类成长的机遇。另一方面，如果人工智能技术处理不当，这项伟大的技术很有可能走向错误的方向，正如\
    \ Tay 的例子所示。因此，我们应该小心不要毁掉这项稳步发展的技术。\n\n深度学习领域是一个只需要一个想法就能极大改变一个时代的领域。如果你在不久的将来构建\
    \ AI，那么这个 AI 可以说是一个没有任何知识的纯粹存在。思考教给 AI 什么、如何与它互动，以及如何为人类利用 AI，是人类的工作。作为本书的读者，你将引领一项新技术走向正确的方向。最后，我希望你能积极参与人工智能领域的最前沿。\n\
