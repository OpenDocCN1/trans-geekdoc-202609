  mdcn: "\n\n另一方面，在无监督学习中，机器使用未标注的数据。在这种情况下，仅提供输入数据。机器学习的是数据集中包含的模式和规则。无监督学习的目标是掌握数据的结构。它可能包括称为**聚类**的过程，即将具有共同特征的数据点分组，或提取关联规则的步骤。例如，假设有关于某个在线购物网站用户的年龄、性别和购买趋势的数据。那么，你可能会发现20多岁的男性和40多岁的女性的品味相近，并希望利用这一趋势来改进产品营销。这里有一个著名的例子——通过无监督训练发现，大量人群同时购买啤酒和尿布。\n\
    \n现在你已经知道监督学习和无监督学习之间存在巨大差异，但这还不是全部。每种学习方法也分别有不同的学习方法和算法。让我们在下一节中看一些代表性的例子。\n\n\
    ## 支持向量机（SVM）\n\n可以说，SVM是机器学习中最流行的监督训练方法。该方法至今仍广泛用于数据挖掘行业的各个领域。在SVM中，距离其他类别最近的数据被标记为标准，并以此标准确定决策边界，使每个标记数据到边界的欧几里得距离之和最大化。这些被标记的数据称为**支持向量**。简单来说，SVM将决策边界设置在距所有模式距离最大化的中间点。因此，SVM算法所做的事情被称为**最大化间隔**。下面是SVM概念的示意图：\n\
    \n![](img/9315e45972ec0fbaf15f9144035bca79_45_0.png)\n\n决策边界  \n支持向量  \n最大化间隔\
    \  \n支持向量\n\n如果只听到这些，你可能会想“就这么简单？”但让SVM最有价值的是一项数学技巧：核技巧，或称核方法。该技术将那些在原始维度上看似无法线性分类的数据，有意地映射到更高维的空间，从而使其能够毫无困难地被线性分类。看看下面的图，以便理解核技巧是如何工作的：\n\
    \n![](img/9315e45972ec0fbaf15f9144035bca79_46_0.png)\n\n我们有两类数据，分别用圆形和三角形表示，很明显在二维空间中无法将这两类数据线性分开。然而，如上图所示，通过将核函数应用于数据（严格来说，是训练数据的特征向量），整个数据被变换到更高维的空间，即三维空间，并且可以用一个二维平面将它们分开。\n\
    \n尽管SVM既实用又优雅，但它也有一个缺点。由于它将数据映射到更高维度，计算量往往会增加，因此随着计算变得更加复杂，处理时间往往也会更长。\n\n## 隐马尔可夫模型（HMM）\n\
    \nHMM是一种无监督训练方法，它假设数据遵循**马尔可夫过程**。马尔可夫过程是一种随机过程，其中未来的状态仅由当前值决定，与过去的状态无关。HMM用于在仅观察到单一观测值时，预测该观测值来自哪种状态。\n\
    \n仅凭前面的解释可能不足以让你完全理解HMM的工作原理，让我们看一个例子。HMM常用于分析碱基序列。你可能知道，碱基序列由四种核苷酸组成，例如A、T、G、C，而序列实际上就是这些核苷酸的字符串。仅仅浏览字符串不会得到任何信息，但你必须分析哪个部分与哪个基因相关。假设任何碱基序列是随机排列的，那么当你切出碱基序列的任何部分时，四个字符中的每一个都应该以四分之一概率出现。\n\
    \n然而，如果存在某种规律，例如C往往出现在G旁边，或者ATT组合频繁出现，那么每个字符被输出的概率就会相应改变。这种规律就是概率模型，如果输出的概率仅取决于紧邻的前一个碱基，你就可以使用HMM从碱基序列（=观测）中找出遗传信息（=状态）。\n\
    \n除了这些生物信息学领域之外，HMM还常用于需要时间序列模式的领域，例如**自然语言处理（NLP）**中的句法分析或声音信号处理。我们在此不深入探讨HMM，因为它的算法与深度学习的关系较小，但如果你感兴趣，可以参考麻省理工学院出版社出版的一本非常著名的书——*《统计自然语言处理基础》*。\n\
    \n## 神经网络\n\n神经网络与机器学习算法稍有不同。其他机器学习方法采用基于概率或统计的方法，而神经网络是模仿人脑结构的算法。人脑由神经元网络组成。看下图了解一下：\n\
    \n![](img/9315e45972ec0fbaf15f9144035bca79_48_0.png)\n\n一个神经元通过另一个神经元连接到网络中，并从突触接收电刺激。当电信号超过阈值时，它被激活并将电刺激传递给网络中连接的下一个神经元。神经网络根据电刺激的传递方式来区分事物。\n\
    \n神经网络最初是一种用数字表示这种电刺激的监督学习类型。近年来，尤其是在深度学习中，人们引入了各种类型的神经网络算法，其中一些是无监督学习。该算法通过学习过程调整网络的权重来提高可预测性。深度学习是一种基于神经网络的算法。关于神经网络的更多细节将在后面结合实现进行说明。\n\
    \n## 逻辑回归\n\n逻辑回归是服从伯努利分布的变量的统计回归模型之一。虽然SVM和神经网络是分类模型，逻辑回归是回归模型，但它确实是监督学习的方法之一。尽管逻辑回归的思维基础不同，但事实上，当你查看其公式时，可以将其视为神经网络的一种。逻辑回归的细节也将在后面结合实现进行说明。\n\
    \n如你所见，每种机器学习方法都有独特的特征。根据你想了解的内容或你想将数据用于何种目的来选择正确的算法非常重要。深度学习也是如此。深度学习有不同的方法，因此你不仅应考虑哪种方法是最佳的，还应考虑到在某些情况下不应该使用深度学习。为每种情况选择最佳方法十分重要。\n\
    \n## 强化学习\n\n仅供参考，还有另一种机器学习方法，称为**强化学习**。虽然有些人将强化学习归类为无监督学习，但另一些人则宣称监督学习、无监督学习和强化学习这三种学习算法应分别划分为不同类型的算法。下图展示了强化学习的基本框架：\n\
    \n![](img/9315e45972ec0fbaf15f9144035bca79_49_0.png)\n\n"
