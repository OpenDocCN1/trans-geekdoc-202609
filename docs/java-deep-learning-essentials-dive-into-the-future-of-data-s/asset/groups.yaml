  - "[PAGE 174]\n\nIn DL4J, input data can be up to two-dimensional data, hence you\
    \ need to assign the number of rows and columns of the data. As Iris is one-dimensional\
    \ data, `numColumns` is set as 1. Here `numSamples` is the total data and `batchSize`\
    \ is the amount of data in each mini-batch. Since the total data is 150 and it\
    \ is relatively small, `batchSize` is set at the same number. This means that\
    \ learning is done without splitting the data into mini-batches. `splitTrainNum`\
    \ is the variable that decides the allocation between the training data and test\
    \ data. Here, 80% of all the dataset is training data and 20% is the test data.\
    \ In the previous section, `listenerFreq` decides how often we see loss function's\
    \ value for logging is seen in the process. This value is set to 1 here, which\
    \ means the value is logged after each epoch.\n\nSubsequently, we need to fetch\
    \ the dataset. In DL4J, a class that can easily fetch data with respect to a typical\
    \ dataset, such as Iris, MINST, and LFW, is prepared. Therefore, you can just\
    \ write the following line if you would like to fetch the Iris dataset:\n\n```\n\
    DataSetIterator iter = new IrisDataSetIterator(batchSize, numSamples);\n```\n\n\
    The following two lines are to format data:\n\n```\nDataSet next = iter.next();\n\
    next.normalizeZeroMeanZeroUnitVariance();\n```\n\nThis code splits the data into\
    \ training data and test data and stores them respectively:\n\n```\nSplitTestAndTrain\
    \ testAndTrain =\nnext.splitTestAndTrain(splitTrainNum, new Random(seed));\nDataSet\
    \ train = testAndTrain.getTrain();\nDataSet test = testAndTrain.getTest();\n```\n\
    \nAs you can see, it makes data handling easier by treating all the data DL4J\
    \ prepares with the DataSet class.\n\nNow, let's actually build a model. The basic\
    \ structure is as follows:\n\n```\nMultiLayerConfiguration conf = new\nNeuralNetConfiguration.Builder().layer().layer()\
    \ ... .layer().build();\nMultiLayerNetwork model = new MultiLayerNetwork(conf);\n\
    model.init();\n```\n\nThe code begins by defining the model configuration and\
    \ then builds and initializes the actual model with the definition. Let's take\
    \ a look at the configuration details. At the beginning, the whole network is\
    \ set up:\n\n```\nMultiLayerConfiguration conf = new NeuralNetConfiguration.Builder()\n\
    \    .seed(seed)\n    .iterations(iterations)\n```"
  - '[PAGE 175]


    ```

    .learningRate(1e-6f)

    .optimizationAlgo(OptimizationAlgorithm.CONJUGATE_GRADIENT)

    .l1(1e-1).regularization(true).l2(2e-4)

    .useDropConnect(true)

    .list(2)

    ```


    The configuration setup is self-explanatory. However, since you haven''t learned
    about regularization before now, let''s briefly check it out.


    Regularization prevents the neural networks model from overfitting and makes the
    model more generalized. To achieve this, the evaluation function $E(w)$ is rewritten
    with the penalty term as follows:


    $E(w) + \lambda \frac{1}{p} \|w\|_p^p = E(w) + \lambda \frac{1}{p} \sum_i |w_i|^p$


    Here, $\|\cdot\|$ denotes the vector norm. The regularization is called L1 regularization
    when $p = 1$ and L2 regularization when $p = 2$. The norm is called L1 norm and
    L2 norm, respectively. That''s why we have `.l1()` and `.l2()` in the code. $\lambda$
    is the hyper parameter. These regularization terms make the model more sparse.
    L2 regularization is also called weight decay and is used to prevent the vanishing
    gradient problem.


    The `.useDropConnect()` command is used to enable dropout and `.list()` to define
    the number of layers, excluding the input layer.


    When you set up a whole model, then the next step is to configure each layer.
    In this sample code, the model is not defined as deep neural networks. One single
    RBM layer is defined as a hidden layer:


    ```

    .layer(0, new RBM.Builder(RBM.HiddenUnit.RECTIFIED, RBM.VisibleUnit.

    GAUSSIAN)

    .nIn(numRows * numColumns)

    .nOut(3)

    .weightInit(WeightInit.XAVIER)

    .k(1)

    .activation("relu")

    .lossFunction(LossFunctions.LossFunction.RMSE_XENT)

    .updater(Updater.ADAGRAD)

    .dropOut(0.5)

    .build()

    )

    ```'
  - "[PAGE 176]\n\nHere, the value of 0 in the first line is the layer's index and\
    \ .k() is for contrastive divergence. Since Iris' data is of float values, we\
    \ can't use binary RBM. That's why we have RBM.VisibleUnit.GAUSSIAN here, enabling\
    \ the model to handle continuous values. Also, as for the definition of this layer,\
    \ what should be especially mentioned is the role of Updater.ADAGRAD. This is\
    \ used to optimize the learning rate. For now, we go on to the model structure,\
    \ and a detailed explanation of the optimizer will be introduced at the end of\
    \ this chapter.\n\nThe subsequent output layer is very simple and self-explanatory:\n\
    \n```\n.layer(1, new OutputLayer.Builder(LossFunctions.LossFunction.MCXENT)\n\
    \    .nIn(3)\n    .nOut(outputNum)\n    .activation(\"softmax\")\n    .build()\n\
    )\n```\n\nThus, the neural networks have been built with three layers : input\
    \ layer, hidden layer, and output layer. The graphical model of this example can\
    \ be illustrated as follows:\n\n![](img/9315e45972ec0fbaf15f9144035bca79_176_0.png)\n\
    \nAfter the model building, we need to train the networks. Here, again, the code\
    \ is super simple:\n\n```\nmodel.setListeners(Arrays.asList((IterationListener)\
    \ new ScoreIterationListener(listenerFreq)));\nmodel.fit(train);\n```\n\nBecause\
    \ the first line is to log the process, what we need to do to train the model\
    \ is just to write model.fit()."
  - "[PAGE 177]\n\nTesting or evaluating the model is also easy with DL4J. First,\
    \ the variables for evaluation are set up as follows:\n\n```\nEvaluation eval\
    \ = new Evaluation(outputNum);\nINDArray output = model.output(test.getFeatureMatrix());\n\
    ```\n\nThen, we can get the values of the feature matrix using:\n\n```\neval.eval(test.getLabels(),\
    \ output);\nlog.info(eval.stats());\n```\n\nBy running the code, we will have\
    \ the result as follows:\n\n```\n=====================Scores======================\n\
    Accuracy:  0.7667\nPrecision: 1\nRecall:    0.7667\nF1 Score:  0.8679245283018869\n\
    ===================================================\n```\n\nF1 Score, also called\
    \ F-Score or F-measure, is the harmonic means of precision and recall, and is\
    \ represented as follows:\n\n$$F_1 = 2.\\frac{Precision.Recall}{Precision + Recall}$$\n\
    \nThis value is often calculated to measure the model's performance as well. Also,\
    \ as written in the example, you can see the actual values and predicted values\
    \ by writing the following:\n\n```\nfor (int i = 0; i < output.rows(); i++) {\n\
    \    String actual = test.getLabels().getRow(i).toString().trim();\n    String\
    \ predicted = output.getRow(i).toString().trim();\n    log.info(\"actual \" +\
    \ actual + \" vs predicted \" + predicted);\n}\n```\n\nThat's it for the whole\
    \ training and test process. The neural networks in the preceding code are not\
    \ deep, but you can easily build deep neural networks just by changing the configuration\
    \ as follows:\n\n```\nMultiLayerConfiguration conf = new NeuralNetConfiguration.Builder()\n\
    \    .seed(seed)\n    .iterations(iterations)\n    .learningRate(1e-6f)\n```"
