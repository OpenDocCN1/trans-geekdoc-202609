    \        }\n\n        if (layer == nLayers - 1) {\n            nOut_ = nOut;\n\
    \        } else {\n            nOut_ = hiddenLayerSizes[layer+1];\n        }\n\
    \n        for (int j = 0; j < nOut_; j++) {\n            for (int i = 0; i < nIn_;\
    \ i++) {\n                hiddenLayers[layer].W[j][i] *= 1 - pDropout;\n     \
