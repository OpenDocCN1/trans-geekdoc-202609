  md: "\n## CSVExample.java\n\nIn the previous example, we train the model with the\
    \ dataset used as a benchmark indicator. When you would like to train and test\
    \ the model with your own prepared data, you can easily import it from CSV. Let's\
    \ look at CSVExample.java in the CSV package. The first step is to initialize\
    \ the CSV reader as follows:\n\n```\nRecordReader recordReader = new CSVRecordReader(0,\"\
    ,\");\n```\n\nIn DL4J, a class called CSVRecordReader is prepared and you can\
    \ easily import data from a CSV file. The value of the first argument in the CSVRecordReader\
    \ class represents how many lines should be skipped in the file. This is convenient\
    \ when the file contains header rows. The second argument is the delimiter. To\
    \ actually read a file and import data, the code can be written as follows:\n\n\
    ```\nrecordReader.initialize(new FileSplit(new\nClassPathResource(\"iris.txt\"\
    ).getFile()));\n```\n\nWith this code, the file in resources/iris.txt will be\
    \ imported to the model. The values in the file here are the same as ones in the\
    \ Iris dataset. To use this initialized data for model training, we define the\
    \ iterator as follows:\n\n```\nDataSetIterator iterator = new RecordReaderDataSetIterator(recordReader,4,3);\n\
    DataSet next = iterator.next();\n```\n\nIn the previous example, we used the IrisDataSetIterator\
    \ class, but here the RecordReaderDataSetIterator class is used because we use\
    \ our own prepared data. The values 4 and 3 are the number of features and labels,\
    \ respectively.\n\nBuilding and training a model can be done in almost the same\
    \ way as the process explained in the previous example. In this example, we build\
    \ deep neural networks of two hidden layers with the dropout and the rectifier,\
    \ that is, we have an input layer - hidden layer - hidden layer - output layer,\
    \ as follows:\n\n```\nMultiLayerConfiguration conf = new NeuralNetConfiguration.Builder()\n\
    \    .seed(seed)\n    .iterations(iterations)\n    .constrainGradientToUnitNorm(true).useDropConnect(true)\n\
    \    .learningRate(1e-1)\n    .l1(0.3).regularization(true).l2(1e-3)\n    .constrainGradientToUnitNorm(true)\n\
    \    .list(3)\n    .layer(0, new DenseLayer.Builder().nIn(numInputs).nOut(3)\n\
    \        .activation(\"relu\").dropOut(0.5)\n        .weightInit(WeightInit.XAVIER)\n\
    \        .build())\n.layer(1, new DenseLayer.Builder().nIn(3).nOut(2)\n    .activation(\"\
    relu\")\n    .weightInit(WeightInit.XAVIER)\n    .build()\n.layer(2, new\nOutputLayer.Builder(LossFunctions.LossFunction\n\
    .NEGATIVELOGLIKELIHOOD)\n    .weightInit(WeightInit.XAVIER)\n    .activation(\"\
    softmax\")\n    .nIn(2).nOut(outputNum).build()\n.backprop(true).pretrain(false)\n\
    .build();\n```\n\nWe can run the model using the following lines of code:\n\n\
    ```\nMultiLayerNetwork model = new MultiLayerNetwork(conf);\nmodel.init();\n```\n\
    \nThe graphical model is as follows:\n\n![](img/9315e45972ec0fbaf15f9144035bca79_180_0.png)\n\
    \nThis time, however, the way to code for training is slightly different from\
