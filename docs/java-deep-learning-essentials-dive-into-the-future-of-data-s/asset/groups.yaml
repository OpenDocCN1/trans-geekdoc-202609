    ```\n\n配置设置本身不言自明。然而，由于你之前还没学过正则化，让我们简要地了解一下它。\n\n正则化可以防止神经网络模型过拟合，使模型更具泛化能力。为了实现这一点，评估函数\
    \ $E(w)$ 被改写为带有惩罚项的形式，如下所示：\n\n$E(w) + \\lambda \\frac{1}{p} \\|w\\|_p^p = E(w)\
    \ + \\lambda \\frac{1}{p} \\sum_i |w_i|^p$\n\n这里，$\\|\\cdot\\|$ 表示向量范数。当 $p =\
    \ 1$ 时，这种正则化称为 L1 正则化；当 $p = 2$ 时，称为 L2 正则化。相应地，范数分别称为 L1 范数和 L2 范数。这就是代码中有 `.l1()`\
    \ 和 `.l2()` 的原因。$\\lambda$ 是超参数。这些正则化项使模型更加稀疏。L2 正则化也称为权重衰减，用于防止梯度消失问题。\n\n`.useDropConnect()`\
    \ 命令用于启用 dropout，`.list()` 用于定义层数（不包括输入层）。\n\n当你设置好整个模型后，下一步就是配置每一层。在这个示例代码中，模型没有被定义为深度神经网络。一个单独的\
