    In the previous chapters, we learned the concept, theory, implementation of deep
    learning, and how to use libraries. Now you know the basic technique of deep learning,
    so don''t worry. On the other hand, development of deep learning is rapid and
    a new model might be developed tomorrow. Big news about AI or deep learning comes
    out one after the other every day. Since you have acquired the basic technique,
    you can learn about the upcoming new technologies on AI and deep learning quickly.
    Now, let''s walk away from the details of techniques and think about what path
    the field of AI will or should take. What is the future of deep learning? For
    the closing chapter, let''s think about that. We''ll pick up the following topics
    in this chapter:


    +   - Hot topics in the deep learning industry

    +   - How to manage AI technologies

    +   - How to proceed the study of deep learning further


    As for the last topic, about further study, I will recommend a website about deep
    learning. You can stay ahead of the curve by thinking about what technology might
    come next, or leveraging the techniques you have learned to innovate, rather than
    following AI developments as they appear.


    # ## Breaking news about deep learning


    Deep learning, which triggered the AI boom, can''t stop its momentum. New results
    are reported each day. As mentioned in *Chapter 6, Approaches to Practical Applications
    – Recurrent Neural Networks and More*, many researchers compete on image recognition
    and natural language processing. Of course, deep learning is not limited to these
    two fields, but applies to many other fields. The outcome of these applications
    is very exciting.'
