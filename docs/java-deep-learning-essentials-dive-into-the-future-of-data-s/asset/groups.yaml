    还有一个让深度学习席卷全球的重要事件。 该事件发生在2012年，就在世界因ILSVRC上的SuperVision而震惊的同一年，Google宣布一台机器能够利用YouTube视频作为学习数据自动检测猫，这是Google提出的深度学习算法。


    该算法的细节在 http://googleblog.blogspot.com/2012/06/using-large-scale-brain-simulations-for.html
    中有解释。 该算法从YouTube视频中提取了1000万张图像并将其用作输入数据。 现在请记住，在机器学习中，人类必须从图像中检测特征值并处理数据。 另一方面，在深度学习中，原始图像可以直接作为输入使用。
    这表明机器本身能够从训练数据中自动找到特征。 在这项研究中，机器学习了猫的概念。 （只有这个猫的故事出名，但研究也用人类图像进行了，而且进展顺利。机器学会了什么是人类！）
    研究中介绍的以下图像说明了深度学习在利用未标记YouTube视频的静帧训练后认为猫的特征是什么：


    ![](img/9315e45972ec0fbaf15f9144035bca79_33_0.png)


    这两个重大事件让我们印象深刻地认识到深度学习，并引发了至今仍在加速的热潮。


    在能够识别猫的方法发展之后，Google利用深度学习进行了一项让机器作画的另一项实验。 这种方法被称为 **Inceptionism** (http://googleresearch.blogspot.ch/2015/06/inceptionism-going-deeper-into-neural.html)。
    正如文章中所写，在这种方法中，网络被要求：


    > “你看到的任何东西，我想要更多！”这形成了一个反馈循环：如果云看起来有点像鸟，网络就会让它看起来更像鸟。 反过来，这会使网络在下一次处理时更强烈地识别出鸟，以此类推，直到一只高度详细的鸟似乎凭空出现。


    虽然机器学习中使用神经网络通常是一种用于检测模式以便指定图像的方法，但Inceptionism做的是相反的事情。 从以下Inceptionism的例子可以看出，这些绘画看起来很奇怪，像噩梦的世界：


    ![](img/9315e45972ec0fbaf15f9144035bca79_34_0.png)


    或者说，它们看起来可能具有艺术性。 任何人都可以尝试Inceptionism的工具在GitHub上向公众开放，名为Deep Dream (https://github.com/google/deepdream)。
    该页面上有示例实现。 如果你会写Python代码就可以尝试它们。


    好吧，没有什么能阻止深度学习势头增强，但仍然存在疑问，例如深度学习到底创新在哪里？是什么特殊功能大幅提高了这种精度？ 令人惊讶的是，实际上深度学习在算法上并没有太多差异。
    如前所述，深度学习是神经网络的应用，神经网络是模仿人类大脑结构的机器学习算法；然而，附加在其上的一个装置改变了一切。 代表是 **pretraining**
    和 **dropout**（以及激活函数）。 这些也是实现的关键词，请记住它们。


    首先，深度学习中的 *deep* 指的是什么？ 如你所知，人类大脑是一个电路结构，而且结构非常复杂。 它由堆叠成多层的复杂电路构成。 另一方面，神经网络算法刚出现时结构相当简单。
    它是人类大脑的简化结构，网络只有几层。 因此，它能够识别的模式极其有限。 于是大家都在想“我们能否像人类大脑一样堆积网络，使其实现复杂化？” 当然，这个方法已经尝试过了。
    不幸的是，结果精度反而比单纯堆叠网络更低。 事实上，我们遇到了简单网络中不会出现的一系列问题。 为什么会这样？好吧，在人类大脑中，信号会根据你看到的内容进入电路的不同部分。
    根据受刺激的电路部分不同而产生的模式差异，你可以区分各种事物。


    为了再现这一机制，神经网络算法用数字加权来替代网络的连接。 这是一种很好的做法，但很快就会出现问题。 如果网络简单，权重可以从学习数据中正确分配，网络可以很好地识别和分类模式。
    然而，一旦网络变得复杂，连接变得过于密集，很难在权重上做出区分。 简而言之，它无法正确地划分模式。 此外，在神经网络中，网络可以通过采用将训练期间发生的错误反馈到整个网络的机制来建立适当的模型。
    同样，如果网络简单，反馈可以正确反映，但如果网络有许多层，就会出现错误在反映到整个网络之前就消失的问题——想象一下如果那个错误被拉伸并稀释了。


    希望通过构建复杂结构的网络就能顺利进行这一意图最终以令人失望的失败告终。 算法本身的概念很精彩，但按任何标准都不能称之为好的算法；这是世界的理解。 虽然深度学习成功地使网络多层化，即使网络“变深”，成功的关键是让每一层分阶段学习。
    之前的算法将整个多层网络视为一个巨大的神经网络并让其整体学习，这导致了前面提到的问题。


    因此，深度学习采取了让每一层预先学习的方法。 这 literally 被称为 pretraining。 在 pretraining 中，学习按顺序从低维层开始。
    然后，低层学习到的数据被视为下一层的输入数据。 这样，机器就能在低级层学习低层特征，然后逐步学习更高级别的特征。 例如，在学习什么是猫时，第一层是轮廓，下一层是眼睛和鼻子的形状，下一层是面部的图像，下一层是面部的细节，等等。
    同样可以说，人类采取相同的学习步骤，先把握整体画面，后来看细节特征。 随着每一层分阶段学习，学习错误的反馈也可以在每一层中正确进行。 这导致了精度的提高。
    还有针对各层学习的各自方法的装置，但这将在后面介绍。


    我们也解决了网络变得过于密集的问题。 防止这种密度问题的方法称为 dropout。 使用 dropout 的网络通过在网络单元内随机切断一些连接来学习。 dropout
    在物理上使网络稀疏。 被切断的连接是随机的，因此每次学习步骤都会形成不同的网络。 光看可能会怀疑这会起作用，但它极大地有助于提高精度，从而增加了网络的鲁棒性。
    人类大脑的电路也有根据所见对象而反应或不反应的不同部位。 dropout 似乎能够成功模仿这一机制。 通过将 dropout 嵌入算法中，网络权重的调整得以良好完成。


    深度学习在各个领域取得了巨大成功；然而，当然深度学习也有缺点。 正如“深度学习”这个名字所示，这种方法中的学习非常深。 这意味着完成学习需要很长时间。 这一过程中的计算量往往非常巨大。
    事实上，前面提到的 Google 对猫的识别学习用了 1,000 台计算机处理了三天。 相反，虽然深度学习本身的想法可以用过去的技术构想出来，但无法实现。
    如果不能轻松使用具有大规模处理能力并处理海量数据的机器，这种方法就不会出现。

    '
