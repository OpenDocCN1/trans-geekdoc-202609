    ## 2 机器学习算法 – 为深度学习做准备


    在上一章中，你通过回顾人工智能的历史，了解了深度学习是如何发展起来的。正如你应该注意到的那样，机器学习和深度学习密不可分。的确，你了解到深度学习是机器学习算法发展而来的方法。


    在本章中，作为深入理解深度学习的前置练习，你将看到机器学习的更多细节，特别是，你将学习与深度学习密切相关的机器学习方法的实际代码。


    本章将涵盖以下主题：


    -   机器学习的核心概念

    -   主流机器学习算法概述，尤其侧重于神经网络

    -   与深度学习相关的机器学习算法的理论与实现：感知器、逻辑回归和多层感知器


    ### 开始


    从本章开始，我们将插入使用 Java 实现的机器学习和深度学习的源代码。代码中使用的 JDK 版本为 1.8，因此需要 Java 8 以上版本。同时，IDE
    使用的是 IntelliJ IDEA 14.1。我们将使用来自 *第 5 章，探索 Java 深度学习库 – DL4J、ND4J 等* 的外部库，因此我们将从一个新的
    Maven 项目开始。


    本书中使用的代码的根包名为 DLWJ，即 Deep Learning with Java 的缩写，我们将根据需要在此之下添加新的包或类。请参考下方的截图，其中显示了新建项目后立即出现的屏幕：


    ![](img/9315e45972ec0fbaf15f9144035bca79_40_0.png)


    代码中会有一些变量名和方法名不符合 Java 编码规范。这是为了与公式中的某些字符一起提高你的理解并增加可读性。请提前注意这一点。


    ### 机器学习中训练的必要性


    你已经看到机器学习是一种模式识别方法。机器学习通过识别并整理给定的学习数据中的模式来得出答案。光看这句话似乎很容易，但事实是，机器学习对未知数据进行分类，即构建合适的模型，需要相当长的时间。为什么会这样？只是分类就这么困难吗？中间还要有“学习”阶段，真的有必要吗？


    答案当然是肯定的。适当分类数据极其困难。问题越复杂，完美分类数据就越不可能。这是因为一旦提到“模式分类器”，分类模式几乎是无限的。让我们在下面的图表中看一个非常简单的例子：


    ![](img/9315e45972ec0fbaf15f9144035bca79_41_0.png)


    有两种类型的数据，圆形和三角形，以及未知数据，方形。在二维坐标空间中，你不知道正方形属于哪个组，所以任务是找出正方形属于哪个组。


    你可能会立刻意识到似乎存在一条分隔两种数据类型边界。如果决定设置边界的位置，看起来你应该能够找出正方形属于哪个组。那么，让我们来确定边界吧。然而，实际上，要清晰地定义这个边界并不容易。如果你想设置边界，有很多线需要考虑，如下图所示：


    ![](img/9315e45972ec0fbaf15f9144035bca79_42_0.png)


    此外，根据边界的放置位置，你可以看到正方形可能会被分配到不同的组或模式。此外，还可以考虑边界可能是非线性边界。


    在机器学习中，机器在训练时所做的是从这些可能模式中选择最可能的边界。在逐一处理大量训练数据时，它会自动学习如何分类模式。换句话说，它调整数学模型的参数并最终决定边界。机器学习决定的边界称为
    **决策边界**，不一定是线性或非线性边界。决策边界也可以是超平面，如果它能最好地对数据进行分类。数据分布越复杂，决策边界越可能是非线性边界或超平面。典型案例是多维分类问题。我们仅在这个问题中设置边界就已经遇到了这样的困难，因此不难想象解决更复杂的问题会非常耗时。


    ### 监督学习与无监督学习


    在上一节中，我们看到即使对于简单的分类问题也可能存在数百万条边界，但很难说哪一个是最合适的。这是因为，即使我们能够正确地整理已知数据中的模式，也并不意味着未知数据也能以相同模式进行分类。然而，你可以提高正确模式分类的比例。每种机器学习方法都设定一个标准来执行更好的模式分类器，并决定最可能的边界——决策边界——以提高比例。这些标准当然在每种方法中差异很大。在本节中，我们将看到我们可以采取的所有方法。


    首先，机器学习可以大致分为 **监督学习** 和 **无监督学习**。这两类之间的区别在于机器学习的数据集是有标签数据还是无标签数据。在监督学习中，机器使用有标签数据，即输入数据和输出数据的组合，并指出每种数据类型应被分类为哪种模式。当机器被赋予未知数据时，它会推导出可以应用的模式，并基于有标签数据，即过去的正确答案，对数据进行分类。例如，在图像识别领域，当你向机器输入一些图像时，如果你准备并提供一定数量的猫的图像，标记为
    `cat`，以及相同数量的人的图像，标记为 `human`，供机器学习，它可以自行判断一张图像属于猫或人（或两者都不是）哪个组。当然，仅判断图像是猫还是人并不能提供实际用途，但如果你将同样的方法应用于其他领域，你可以创建一个系统，能够自动标记社交媒体上上传的照片中谁是谁。如你现在所见，在监督训练中，当机器被提供由人类提前准备的正确数据时，学习就会进行。

    '
