    \    .l1(1e-1).regularization(true).l2(2e-4)\n    .useDropConnect(true)\n    .list(2)\n\
    ```\n\nThe configuration setup is self-explanatory. However, since you haven't\
    \ learned about regularization before now, let's briefly check it out.\n\nRegularization\
    \ prevents the neural networks model from overfitting and makes the model more\
    \ generalized. To achieve this, the evaluation function $E(w)$ is rewritten with\
    \ the penalty term as follows:\n\n$E(w) + \\lambda \\frac{1}{p} \\|w\\|_p^p =\
    \ E(w) + \\lambda \\frac{1}{p} \\sum_i |w_i|^p$\n\nHere, $\\|\\cdot\\|$ denotes\
    \ the vector norm. The regularization is called L1 regularization when $p = 1$\
    \ and L2 regularization when $p = 2$. The norm is called L1 norm and L2 norm,\
    \ respectively. That's why we have `.l1()` and `.l2()` in the code. $\\lambda$\
    \ is the hyper parameter. These regularization terms make the model more sparse.\
    \ L2 regularization is also called weight decay and is used to prevent the vanishing\
    \ gradient problem.\n\nThe `.useDropConnect()` command is used to enable dropout\
    \ and `.list()` to define the number of layers, excluding the input layer.\n\n\
    When you set up a whole model, then the next step is to configure each layer.\
    \ In this sample code, the model is not defined as deep neural networks. One single\
    \ RBM layer is defined as a hidden layer:\n\n```\n.layer(0, new RBM.Builder(RBM.HiddenUnit.RECTIFIED,\
    \ RBM.VisibleUnit.GAUSSIAN)\n.nIn(numRows * numColumns)\n.nOut(3)\n.weightInit(WeightInit.XAVIER)\n\
    .k(1)\n.activation(\"relu\")\n.lossFunction(LossFunctions.LossFunction.RMSE_XENT)\n\
    .updater(Updater.ADAGRAD)\n.dropOut(0.5)\n.build()\n)\n```\n\nHere, the value\
    \ of 0 in the first line is the layer's index and .k() is for contrastive divergence.\
    \ Since Iris' data is of float values, we can't use binary RBM. That's why we\
    \ have RBM.VisibleUnit.GAUSSIAN here, enabling the model to handle continuous\
    \ values. Also, as for the definition of this layer, what should be especially\
    \ mentioned is the role of Updater.ADAGRAD. This is used to optimize the learning\
    \ rate. For now, we go on to the model structure, and a detailed explanation of\
    \ the optimizer will be introduced at the end of this chapter.\n\nThe subsequent\
    \ output layer is very simple and self-explanatory:\n\n```\n.layer(1, new OutputLayer.Builder(LossFunctions.LossFunction.MCXENT)\n\
    \    .nIn(3)\n    .nOut(outputNum)\n    .activation(\"softmax\")\n    .build()\n\
    )\n```\n\nThus, the neural networks have been built with three layers : input\
    \ layer, hidden layer, and output layer. The graphical model of this example can\
    \ be illustrated as follows:\n\n![](img/9315e45972ec0fbaf15f9144035bca79_176_0.png)\n\
    \nAfter the model building, we need to train the networks. Here, again, the code\
    \ is super simple:\n\n```\nmodel.setListeners(Arrays.asList((IterationListener)\
    \ new ScoreIterationListener(listenerFreq)));\nmodel.fit(train);\n```\n\nBecause\
    \ the first line is to log the process, what we need to do to train the model\
    \ is just to write model.fit().\n\nTesting or evaluating the model is also easy\
    \ with DL4J. First, the variables for evaluation are set up as follows:\n\n```\n\
    Evaluation eval = new Evaluation(outputNum);\nINDArray output = model.output(test.getFeatureMatrix());\n\
    ```\n\nThen, we can get the values of the feature matrix using:\n\n```\neval.eval(test.getLabels(),\
    \ output);\nlog.info(eval.stats());\n```\n\nBy running the code, we will have\
    \ the result as follows:\n\n```\n=====================Scores======================\n\
    Accuracy:  0.7667\nPrecision: 1\nRecall:    0.7667\nF1 Score:  0.8679245283018869\n\
    ===================================================\n```\n\nF1 Score, also called\
    \ F-Score or F-measure, is the harmonic means of precision and recall, and is\
    \ represented as follows:\n\n$$F_1 = 2.\\frac{Precision.Recall}{Precision + Recall}$$\n\
    \nThis value is often calculated to measure the model's performance as well. Also,\
    \ as written in the example, you can see the actual values and predicted values\
    \ by writing the following:\n\n```\nfor (int i = 0; i < output.rows(); i++) {\n\
    \    String actual = test.getLabels().getRow(i).toString().trim();\n    String\
    \ predicted = output.getRow(i).toString().trim();\n    log.info(\"actual \" +\
    \ actual + \" vs predicted \" + predicted);\n}\n```\n\nThat's it for the whole\
    \ training and test process. The neural networks in the preceding code are not\
    \ deep, but you can easily build deep neural networks just by changing the configuration\
    \ as follows:\n\n```\nMultiLayerConfiguration conf = new NeuralNetConfiguration.Builder()\n\
    \    .seed(seed)\n    .iterations(iterations)\n    .learningRate(1e-6f)\n    .optimizationAlgo(OptimizationAlgorithm.CONJUGATE_GRADIENT)\n\
    \    .l1(1e-1).regularization(true).l2(2e-4)\n    .useDropConnect(true)\n    .list(3)\n\
    \    .layer(0, new RBM.Builder(RBM.HiddenUnit.RECTIFIED, RBM.VisibleUnit.GAUSSIAN)\n\
    \        .nIn(numRows * numColumns)\n        .nOut(4)\n        .weightInit(WeightInit.XAVIER)\n\
    \        .k(1)\n        .activation(\"relu\")\n        .lossFunction(LossFunctions.LossFunction.RMSE_XENT)\n\
    \        .updater(Updater.ADAGRAD)\n        .dropOut(0.5)\n        .build()\n\
    \    )\n    .layer(1, new RBM.Builder(RBM.HiddenUnit.RECTIFIED, RBM.VisibleUnit.GAUSSIAN)\n\
    \        .nIn(4)\n        .nOut(3)\n        .weightInit(WeightInit.XAVIER)\n \
    \       .k(1)\n        .activation(\"relu\")\n        .lossFunction(LossFunctions.LossFunction.RMSE_XENT)\n\
    \        .updater(Updater.ADAGRAD)\n        .dropOut(0.5)\n        .build()\n\
    \    )\n    .layer(2, new OutputLayer.Builder(LossFunctions.LossFunction.MCXENT)\n\
    \        .nIn(3)\n        .nOut(outputNum)\n        .activation(\"softmax\")\n\
    \        .build()\n    )\n    .build();\n```\n\nAs you can see, building deep\
    \ neural networks requires just simple implementations with DL4J. Once you set\
    \ up the model, what you need to do is adjust the parameters. For example, increasing\
    \ the iterations value or changing the seed value would return a better result.\n"
  mdcn: "\n\n在 DL4J 中，输入数据最多可以是二维数据，因此你需要指定数据的行数和列数。由于 Iris 是一维数据，`numColumns` 设置为\
