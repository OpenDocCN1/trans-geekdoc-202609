    # Natural language processing


    The second most active field, after image recognition, where the research of deep
    learning has progressed is natural language processing (NLP). The research in
    this field might become the most active going forward. With regard to image recognition,
    the prediction precision we could obtain almost reaches the ceiling, as it can
    perform even better classification than a human could. On the other hand, in NLP,
    it is true that the performance of a model gets a lot better thanks to deep learning,
    but it is also a fact that there are many tasks that still need to be solved.


    For some products and practical applications, deep learning has already been applied.
    For example, NLP based on deep learning is applied to Google''s voice search or
    voice recognition and Google translation. Also, IBM Watson, the cognitive computing
    system that understands and learns natural language and supports human decision-making,
    extracts keywords and entities from tons of documents, and has functions to label
    documents. And these functions are open to the public as the Watson API and anyone
    can utilize it without constraints.


    As you can see from the preceding examples, NLP itself has a broad and varied
    range of types. In terms of fundamental techniques, we have the classification
    of sentence contents, the classification of words, and the specification of word
    meanings. Furthermore, languages such as Chinese or Japanese that don''t leave
    a space between words require morphological analysis, which is also another technique
    available in NLP.


    NLP contains a lot of things that need to be researched, therefore it needs to
    clarify what its purpose is, what its problems are, and how these problems can
    be solved. What model is the best to use and how to get good precision properly
    are topics that should be examined cautiously. As for image recognition, the CNN
    method was invented by solving tasks that were faced. Now, let''s consider what
    approach we can think of and what the difficulties will be respectively for neural
    networks and NLP. Understanding past trial and error processes will be useful
    for research and applications going forward.


    # Feed-forward neural networks for NLP


    The fundamental problem of NLP is "to predict the next word given a specific word
    or words". The problem is too simple, however; if you try to solve it with neural
    networks, then you will soon face several difficulties because documents or sentences
    as sample data using NLP have the following features:


    +   - The length of each sentence is not fixed but variable, and the number of
    words is astronomical'
  - "[PAGE 197]\n\n+   - There can be unforeseen problems such as misspelled words,\
    \ acronyms, and so on\n+   - Sentences are sequential data, and so contain temporal\
    \ information\n\nWhy can these features pose a problem? Remember the model structure\
    \ of general neural networks. For training and testing with neural networks, the\
    \ number of neurons in each layer including the input layer needs to be fixed\
    \ in advance and the networks need to be the same size for all the sample data.\
    \ In the meantime, the length of the input data is not fixed and can vary a lot.\
    \ This means that sample data cannot be applied to the model, at least as it is.\
    \ Classification or generation by neural networks cannot be done without adding/amending\
    \ something to this data.\n\nWe have to fix the length of input data, and one\
    \ approach to handle this issue is a method that divides a sentence into a chunk\
    \ of certain words from the beginning in order. This method is called **N-gram**.\
    \ Here, *N* represents the size of each item, and an **N-gram** of size 1 is called\
    \ a **unigram**, size 2 is a **bigram**, and size 3 is a **trigram**. When the\
    \ size is larger, then it is simply called with the value of *N*, such as *four-gram*,\
    \ *five-gram*, and so on.\n\nLet's look at how N-gram works with NLP. The goal\
    \ here is to calculate the probability of a word *w* given some history *h*; *P(w\
    \ | h)*. We'll represent a sequence of *N* words as *w₁ⁿ*. Then, the probability\
    \ we want to compute is *P(w₁ⁿ)*, and by applying the chain rule of probability\
    \ to this term, we get:\n\nP(w₁ⁿ) = P(w₁) P(w₂ | w₃) P(w₃ | w₁²) ... P(wₙ | w₁ⁿ⁻¹)\n\
    \       = ∏_{k=1}^n P(w_k | w₁^{k-1})\n\nIt might look at first glance like these\
    \ conditional probabilities help us, but actually they don't because we have no\
    \ way of calculating the exact probability of a word following a long sequence\
    \ of preceding words, *P(wₙ | w_{n-1})*. Since the structure of a sentence is\
    \ very flexible, we can't simply utilize sample documents and a corpus to estimate\
    \ the probability. This is where N-gram works. Actually, we have two approaches\
    \ to solve this problem: the original N-gram model and the neural networks model\
    \ based on N-gram. We'll look at the first one to fully understand how the fields\
    \ of NLP have developed before we dig into neural networks."
  - '[PAGE 198]


    With N-gram, we don''t compute the probability of a word given its whole history,
    but approximate the history with the last N words. For example, the bigram model
    approximates the probability of a word just by the conditional probability of
    the preceding word, $P(w_n \mid w_{n-1})$, and so follows the equation:


    $P(w_1^n) = \prod_{k=1}^{n} P\left(w_k \mid w_1^{k-1}\right)$


    $\approx \prod_{k=1}^{n} P\left(w_k \mid w_{k-1}\right)$


    Similarly, we can generalize and expand the equation for N-gram. In this case,
    the probability of a word can be represented as follows:


    $P\left(w_n \mid w_1^{n-1}\right) \approx P\left(w_n \mid w_{n-N+1}^{n-1}\right)$


    We get the following equation:


    $P\left(w_1^n\right) \approx \prod_{k=1}^{n} P\left(w_k \mid w_{k-N+1}^{k-1}\right)$


    Just bear in mind that these approximations with N-gram are based on the probabilistic
    model called the **Markov model**, where the probability of a word depends only
    on the previous word.'
  - '[PAGE 199]


    Now what we need to do is estimate these N-gram probabilities, but how do we estimate
    them? One simple way of doing this is called the **maximum likelihood estimation
    (MLE)**. This method estimates the probabilities by taking counts from a corpus
    and normalizing them. So when we think of a bigram as an example, we get:


    ```

    $$P(w_n \mid w_{n-1}) = \frac{C(w_{n-1}w_n)}{\sum_{w} C(w_{n-1}w)}$$

    ```


    In the preceding formula, $C(\cdot)$ denotes the counts of a word or a sequence
    of words. Since the denominator, that is, the sum of all bigram counts starting
    with a word, $w_{n-1}$ is equal to the unigram count of $w_{n-1}$, the preceding
    equation can be described as follows:


    ```

    $$P(w_n \mid w_{n-1}) = \frac{C(w_{n-1}w_n)}{C(w_{n-1})}$$

    ```


    Accordingly, we can generalize MLE for N-gram as well:


    ```

    $$P(w_n \mid w_{n-N+1}^{n-1}) = \frac{C(w_{n-N+1}^{n-1}w_n)}{C(w_{n-N+1}^{n-1})}$$

    ```


    Although this is a fundamental approach of NLP with N-gram, we now know how to
    compute N-gram probabilities.'
  - '[PAGE 200]


    In contrast to this approach, the neural network models predict the conditional
    probability of a word $w_j$ given a specific history, $h_j$; $P(w_j = i \mid h_j)$.
    One of the models of NLP is called the Neural Network Language Model (NLMM) (http://www.jmlr.org/papers/volume3/bengio03a/bengio03a.pdf),
    and it can be illustrated as follows:


    ![](img/9315e45972ec0fbaf15f9144035bca79_200_0.png)'
  - '[PAGE 201]


    Here, $N$ is the size of the vocabulary, and each word in the vocabulary is an
    N-dimensional vector where only the index of the word is set to 1 and all the
    other indices to 0. This method of representation is called 1-of-$N$ coding. The
    inputs of NLMM are the indices of the $n-1$ previous words $h_j = w_{j-n+1}^{j-1}$
    (so they are $n$-grams). Since the size $N$ is typically within the range of 5,000
    to 200,000, input vectors of NLMM are very sparse. Then, each word is mapped to
    the projection layer, for continuous space representation. This linear projection
    (activation) from a discrete to a continuous space is basically a look-up table
    with $N \times P$ entries, where $P$ denotes the feature dimension. The projection
    matrix is shared for the different word positions in the context, and activates
    the word vectors to projection layer units $c_l$ with $l = 1,\ldots,(n-1).P$.
    After the projection comes the hidden layer. Since the projection layer is in
    the continuous space, the model structure is just the same as the other neural
    networks from here. So, the activation can be represented as follows:


    $$d_j = h\left(\sum_{l=1}^{(n-1).P} m_{jl}c_l + b_j\right)$$


    Here, $h(\cdot)$ denotes the activation function, $m_{ji}$ the weights between
    the projection layer and the hidden layer, and $b_j$ the biases of the hidden
    layer. Accordingly, we can get the output units as follows:


    $$o_i = \sum_{j} v_{ij} d_j + k_i$$


    Here, $v_{ij}$ denotes the weights between the hidden layer and the output layer,
    and $k_i$ denotes the biases of the output layer. The probability of a word $i$
    given a specific history $h_j$ can then be calculated using the softmax function:


    $$P\left(w_j = i \mid h_j\right) = \frac{\exp(o_i)}{\sum_{l=1}^{N} \exp(o_i)}$$


    As you can see, in NNLM, the model predicts the probability of all the words at
    the same time. Since the model is now described with the standard neural network,
    we can train the model using the standard backpropagation algorithm.'
  md: "\n## Natural language processing\n\nThe second most active field, after image\
    \ recognition, where the research of deep learning has progressed is natural language\
    \ processing (NLP). The research in this field might become the most active going\
    \ forward. With regard to image recognition, the prediction precision we could\
    \ obtain almost reaches the ceiling, as it can perform even better classification\
    \ than a human could. On the other hand, in NLP, it is true that the performance\
    \ of a model gets a lot better thanks to deep learning, but it is also a fact\
    \ that there are many tasks that still need to be solved.\n\nFor some products\
    \ and practical applications, deep learning has already been applied. For example,\
    \ NLP based on deep learning is applied to Google's voice search or voice recognition\
    \ and Google translation. Also, IBM Watson, the cognitive computing system that\
    \ understands and learns natural language and supports human decision-making,\
    \ extracts keywords and entities from tons of documents, and has functions to\
    \ label documents. And these functions are open to the public as the Watson API\
    \ and anyone can utilize it without constraints.\n\nAs you can see from the preceding\
    \ examples, NLP itself has a broad and varied range of types. In terms of fundamental\
    \ techniques, we have the classification of sentence contents, the classification\
    \ of words, and the specification of word meanings. Furthermore, languages such\
    \ as Chinese or Japanese that don't leave a space between words require morphological\
    \ analysis, which is also another technique available in NLP.\n\nNLP contains\
    \ a lot of things that need to be researched, therefore it needs to clarify what\
    \ its purpose is, what its problems are, and how these problems can be solved.\
    \ What model is the best to use and how to get good precision properly are topics\
    \ that should be examined cautiously. As for image recognition, the CNN method\
    \ was invented by solving tasks that were faced. Now, let's consider what approach\
    \ we can think of and what the difficulties will be respectively for neural networks\
    \ and NLP. Understanding past trial and error processes will be useful for research\
    \ and applications going forward.\n\n## Feed-forward neural networks for NLP\n\
    \nThe fundamental problem of NLP is \"to predict the next word given a specific\
    \ word or words\". The problem is too simple, however; if you try to solve it\
    \ with neural networks, then you will soon face several difficulties because documents\
    \ or sentences as sample data using NLP have the following features:\n\n- The\
    \ length of each sentence is not fixed but variable, and the number of words is\
    \ astronomical\n- There can be unforeseen problems such as misspelled words, acronyms,\
    \ and so on\n- Sentences are sequential data, and so contain temporal information\n\
    \nWhy can these features pose a problem? Remember the model structure of general\
    \ neural networks. For training and testing with neural networks, the number of\
    \ neurons in each layer including the input layer needs to be fixed in advance\
    \ and the networks need to be the same size for all the sample data. In the meantime,\
    \ the length of the input data is not fixed and can vary a lot. This means that\
    \ sample data cannot be applied to the model, at least as it is. Classification\
    \ or generation by neural networks cannot be done without adding/amending something\
    \ to this data.\n\nWe have to fix the length of input data, and one approach to\
    \ handle this issue is a method that divides a sentence into a chunk of certain\
    \ words from the beginning in order. This method is called **N-gram**. Here, *N*\
    \ represents the size of each item, and an **N-gram** of size 1 is called a **unigram**,\
    \ size 2 is a **bigram**, and size 3 is a **trigram**. When the size is larger,\
    \ then it is simply called with the value of *N*, such as *four-gram*, *five-gram*,\
    \ and so on.\n\nLet's look at how N-gram works with NLP. The goal here is to calculate\
    \ the probability of a word *w* given some history *h*; *P(w | h)*. We'll represent\
    \ a sequence of *N* words as *w₁ⁿ*. Then, the probability we want to compute is\
    \ *P(w₁ⁿ)*, and by applying the chain rule of probability to this term, we get:\n\
    \nP(w₁ⁿ) = P(w₁) P(w₂ | w₁) P(w₃ | w₁²) ... P(wₙ | w₁ⁿ⁻¹)\n       = ∏_{k=1}^n\
    \ P(w_k | w₁^{k-1})\n\nIt might look at first glance like these conditional probabilities\
    \ help us, but actually they don't because we have no way of calculating the exact\
    \ probability of a word following a long sequence of preceding words, *P(wₙ |\
    \ w₁^{n-1})*. Since the structure of a sentence is very flexible, we can't simply\
    \ utilize sample documents and a corpus to estimate the probability. This is where\
    \ N-gram works. Actually, we have two approaches to solve this problem: the original\
    \ N-gram model and the neural networks model based on N-gram. We'll look at the\
    \ first one to fully understand how the fields of NLP have developed before we\
    \ dig into neural networks.\n\nWith N-gram, we don't compute the probability of\
    \ a word given its whole history, but approximate the history with the last N\
    \ words. For example, the bigram model approximates the probability of a word\
    \ just by the conditional probability of the preceding word, $P(w_n \\mid w_{n-1})$,\
    \ and so follows the equation:\n\n$P(w_1^n) = \\prod_{k=1}^{n} P\\left(w_k \\\
    mid w_1^{k-1}\\right)$\n\n$\\approx \\prod_{k=1}^{n} P\\left(w_k \\mid w_{k-1}\\\
    right)$\n\nSimilarly, we can generalize and expand the equation for N-gram. In\
    \ this case, the probability of a word can be represented as follows:\n\n$P\\\
    left(w_n \\mid w_1^{n-1}\\right) \\approx P\\left(w_n \\mid w_{n-N+1}^{n-1}\\\
    right)$\n\nWe get the following equation:\n\n$P\\left(w_1^n\\right) \\approx \\\
    prod_{k=1}^{n} P\\left(w_k \\mid w_{k-N+1}^{k-1}\\right)$\n\nJust bear in mind\
    \ that these approximations with N-gram are based on the probabilistic model called\
    \ the **Markov model**, where the probability of a word depends only on the previous\
    \ word.\n\nNow what we need to do is estimate these N-gram probabilities, but\
    \ how do we estimate them? One simple way of doing this is called the **maximum\
    \ likelihood estimation (MLE)**. This method estimates the probabilities by taking\
    \ counts from a corpus and normalizing them. So when we think of a bigram as an\
    \ example, we get:\n\n```\n$$P(w_n \\mid w_{n-1}) = \\frac{C(w_{n-1}w_n)}{\\sum_{w}\
    \ C(w_{n-1}w)}$$\n```\n\nIn the preceding formula, $C(\\cdot)$ denotes the counts\
    \ of a word or a sequence of words. Since the denominator, that is, the sum of\
    \ all bigram counts starting with a word, $w_{n-1}$ is equal to the unigram count\
    \ of $w_{n-1}$, the preceding equation can be described as follows:\n\n```\n$$P(w_n\
    \ \\mid w_{n-1}) = \\frac{C(w_{n-1}w_n)}{C(w_{n-1})}$$\n```\n\nAccordingly, we\
    \ can generalize MLE for N-gram as well:\n\n```\n$$P(w_n \\mid w_{n-N+1}^{n-1})\
    \ = \\frac{C(w_{n-N+1}^{n-1}w_n)}{C(w_{n-N+1}^{n-1})}$$\n```\n\nAlthough this\
    \ is a fundamental approach of NLP with N-gram, we now know how to compute N-gram\
    \ probabilities.\n\nIn contrast to this approach, the neural network models predict\
    \ the conditional probability of a word $w_j$ given a specific history, $h_j$;\
    \ $P(w_j = i \\mid h_j)$. One of the models of NLP is called the Neural Network\
    \ Language Model (NNLM) (http://www.jmlr.org/papers/volume3/bengio03a/bengio03a.pdf),\
    \ and it can be illustrated as follows:\n\n![](img/9315e45972ec0fbaf15f9144035bca79_200_0.png)\n\
    \nHere, $N$ is the size of the vocabulary, and each word in the vocabulary is\
    \ an N-dimensional vector where only the index of the word is set to 1 and all\
    \ the other indices to 0. This method of representation is called 1-of-$N$ coding.\
    \ The inputs of NNLM are the indices of the $n-1$ previous words $h_j = w_{j-n+1}^{j-1}$\
    \ (so they are $n$-grams). Since the size $N$ is typically within the range of\
    \ 5,000 to 200,000, input vectors of NNLM are very sparse. Then, each word is\
    \ mapped to the projection layer, for continuous space representation. This linear\
    \ projection (activation) from a discrete to a continuous space is basically a\
    \ look-up table with $N \\times P$ entries, where $P$ denotes the feature dimension.\
    \ The projection matrix is shared for the different word positions in the context,\
    \ and activates the word vectors to projection layer units $c_l$ with $l = 1,\\\
    ldots,(n-1).P$. After the projection comes the hidden layer. Since the projection\
    \ layer is in the continuous space, the model structure is just the same as the\
    \ other neural networks from here. So, the activation can be represented as follows:\n\
    \n$$d_j = h\\left(\\sum_{l=1}^{(n-1).P} m_{jl}c_l + b_j\\right)$$\n\nHere, $h(\\\
    cdot)$ denotes the activation function, $m_{ji}$ the weights between the projection\
    \ layer and the hidden layer, and $b_j$ the biases of the hidden layer. Accordingly,\
    \ we can get the output units as follows:\n\n$$o_i = \\sum_{j} v_{ij} d_j + k_i$$\n\
    \nHere, $v_{ij}$ denotes the weights between the hidden layer and the output layer,\
    \ and $k_i$ denotes the biases of the output layer. The probability of a word\
    \ $i$ given a specific history $h_j$ can then be calculated using the softmax\
    \ function:\n\n$$P\\left(w_j = i \\mid h_j\\right) = \\frac{\\exp(o_i)}{\\sum_{l=1}^{N}\
    \ \\exp(o_l)}$$\n\nAs you can see, in NNLM, the model predicts the probability\
    \ of all the words at the same time. Since the model is now described with the\
    \ standard neural network, we can train the model using the standard backpropagation\
    \ algorithm.\n"
  mdcn: "\n\n## 自然语言处理\n\n继图像识别之后，深度学习研究第二活跃的领域是自然语言处理（NLP）。这一领域的研究未来可能会成为最活跃的方向。就图像识别而言，我们能够获得的预测精度几乎已经达到天花板，因为它甚至能比人类做出更好的分类。另一方面，在\
    \ NLP 中，深度学习的確让模型性能提升了很多，但同样的事实是，仍有许多任务有待解决。\n\n对于一些产品和实际应用，深度学习已经被应用。例如，基于深度学习的\
    \ NLP 被应用于谷歌的语音搜索、语音识别以及谷歌翻译。此外，IBM Watson——这一能够理解并学习自然语言、支持人类决策的认知计算系统——从海量文档中提取关键词和实体，并具备为文档打标签的功能。这些功能以\
    \ Watson API 的形式向公众开放，任何人都可以不受限制地使用。\n\n从前面的例子可以看出，NLP 本身的类型广泛且多样。就基础技术而言，我们有句子内容分类、词语分类以及词义指定。此外，像中文或日文这样词与词之间不空白的语言，还需要形态分析，这也是\
    \ NLP 中的另一项技术。\n\nNLP 包含许多需要研究的内容，因此需要明确其目的是什么、问题是什么，以及这些问题如何解决。使用哪种模型最好，以及如何恰当地获得良好的精度，都是需要谨慎审视的话题。就图像识别而言，CNN\
    \ 方法是通过解决所面临的任务而被发明的。现在，让我们思考对于神经网络和 NLP，分别可以考虑哪些方法，以及各自会面临哪些困难。理解过去的试错过程，对未来的研究和应用都将有所裨益。\n\
    \n## 用于 NLP 的前馈神经网络\n\nNLP 的基本问题是“在给定一个或几个词的情况下预测下一个词”。然而，这个问题过于简单；如果你尝试用神经网络来解决它，很快就会遇到几个困难，因为使用\
    \ NLP 的文档或句子作为样本数据具有以下特征：\n\n- 每个句子的长度不固定而是可变的，且词的数量极其庞大\n- 可能存在拼写错误、缩写等不可预见的问题\n\
    - 句子是序列数据，因此包含时间信息\n\n为什么这些特征会带来问题？回想一下一般神经网络的结构。为了用神经网络进行训练和测试，每一层（包括输入层）的神经元数量需要事先固定，并且网络对于所有样本数据需要保持相同的大小。与此同时，输入数据的长度并不固定，而且可能变化很大。这意味着样本数据至少不能直接应用于该模型。如果不对此数据进行添加/修改，就无法通过神经网络进行分类或生成。\n\
    \n我们必须固定输入数据的长度，而处理这个问题的一种方法是将句子从头开始按顺序划分为包含特定数量词的块。这种方法被称为 **N-gram**。这里，*N*\
    \ 表示每个块的大小，大小为 1 的 **N-gram** 称为 **unigram**，大小为 2 的称为 **bigram**，大小为 3 的称为 **trigram**。当大小更大时，则直接使用\
    \ *N* 的值来称呼，如 *four-gram*、*five-gram* 等。\n\n让我们看看 N-gram 如何应用于 NLP。这里的目标是计算在给定历史\
    \ *h* 的情况下某个词 *w* 的概率，即 *P(w | h)*。我们将 *N* 个词的序列表示为 *w₁ⁿ*。那么，我们要计算的概率是 *P(w₁ⁿ)*，通过将概率的链式法则应用于这一项，我们得到：\n\
    \nP(w₁ⁿ) = P(w₁) P(w₂ | w₁) P(w₃ | w₁²) ... P(wₙ | w₁ⁿ⁻¹)\n       = ∏_{k=1}^n\
    \ P(w_k | w₁^{k-1})\n\n乍一看，这些条件概率似乎对我们有帮助，但实际上它们并没有，因为我们无法计算一个词在跟随一长串前序词之后的精确概率，即\
    \ *P(wₙ | w₁^{n-1})*。由于句子结构非常灵活，我们不能简单地利用样本文档和语料库来估计该概率。这正是 N-gram 发挥作用的地方。实际上，我们有两种方法来解决这个问题：原始的\
    \ N-gram 模型和基于 N-gram 的神经网络模型。我们将先研究第一种方法，以充分理解 NLP 领域是如何发展的，然后再深入探讨神经网络。\n\n\
    使用 N-gram 时，我们不是计算一个词在给定其全部历史条件下的概率，而是用最后 N 个词来近似该历史。例如，bigram 模型仅通过前一个词的条件概率来近似一个词的概率，即\
    \ $P(w_n \\mid w_{n-1})$，因此遵循以下方程：\n\n$P(w_1^n) = \\prod_{k=1}^{n} P\\left(w_k\
    \ \\mid w_1^{k-1}\\right)$\n\n$\\approx \\prod_{k=1}^{n} P\\left(w_k \\mid w_{k-1}\\\
    right)$\n\n类似地，我们可以将方程推广并扩展到 N-gram。在这种情况下，一个词的概率可以表示为：\n\n$P\\left(w_n \\mid\
    \ w_1^{n-1}\\right) \\approx P\\left(w_n \\mid w_{n-N+1}^{n-1}\\right)$\n\n我们得到以下方程：\n\
    \n$P\\left(w_1^n\\right) \\approx \\prod_{k=1}^{n} P\\left(w_k \\mid w_{k-N+1}^{k-1}\\\
    right)$\n\n请记住，这些基于 N-gram 的近似是建立在被称为 **马尔可夫模型** 的概率模型之上的，即一个词的概率只依赖于前一个词。\n\n\
    现在我们需要做的是估计这些 N-gram 概率，但我们如何估计它们呢？一种简单的方法叫做 **最大似然估计（MLE）**。这种方法通过从语料库中获取计数并将其归一化来估计概率。所以当我们以\
    \ bigram 为例时，我们得到：\n\n```\n$$P(w_n \\mid w_{n-1}) = \\frac{C(w_{n-1}w_n)}{\\sum_{w}\
    \ C(w_{n-1}w)}$$\n```\n\n在前面的公式中，$C(\\cdot)$ 表示一个词或词序列的计数。由于分母，即以某个词 $w_{n-1}$\
    \ 开头的所有 bigram 计数之和，等于 $w_{n-1}$ 的 unigram 计数，前面的方程可以描述如下：\n\n```\n$$P(w_n \\\
    mid w_{n-1}) = \\frac{C(w_{n-1}w_n)}{C(w_{n-1})}$$\n```\n\n相应地，我们也可以将 MLE 推广到\
    \ N-gram：\n\n```\n$$P(w_n \\mid w_{n-N+1}^{n-1}) = \\frac{C(w_{n-N+1}^{n-1}w_n)}{C(w_{n-N+1}^{n-1})}$$\n\
    ```\n\n尽管这是 NLP 中 N-gram 的基本方法，但我们现在知道了如何计算 N-gram 概率。\n\n与这种方法相比，神经网络模型预测在给定特定历史\
    \ $h_j$ 的情况下某个词 $w_j$ 的条件概率，即 $P(w_j = i \\mid h_j)$。NLP 中的一种模型被称为神经网络语言模型（NNLM）（http://www.jmlr.org/papers/volume3/bengio03a/bengio03a.pdf），其结构可以图示如下：\n\
    \n![](img/9315e45972ec0fbaf15f9144035bca79_200_0.png)\n\n这里，$N$ 是词汇表的大小，词汇表中的每个词都是一个\
    \ N 维向量，其中只有该词的索引被设为 1，所有其他索引为 0。这种表示方法称为 1-of-$N$ 编码。NNLM 的输入是前 $n-1$ 个词的索引 $h_j\
    \ = w_{j-n+1}^{j-1}$（因此它们是 $n$-gram）。由于大小 $N$ 通常在 5,000 到 200,000 之间，NNLM 的输入向量非常稀疏。然后，每个词被映射到投影层，以实现连续空间表示。这种从离散空间到连续空间的线性投影（激活）本质上是一个大小为\
    \ $N \\times P$ 的查找表，其中 $P$ 表示特征维度。投影矩阵在上下文中的不同词位置之间共享，并将词向量激活为投影层单元 $c_l$，其中\
    \ $l = 1,\\ldots,(n-1).P$。投影之后是隐藏层。由于投影层处于连续空间中，模型的后续结构与其它神经网络完全相同。因此，激活可以表示如下：\n\
    \n$$d_j = h\\left(\\sum_{l=1}^{(n-1).P} m_{jl}c_l + b_j\\right)$$\n\n这里，$h(\\\
    cdot)$ 表示激活函数，$m_{ji}$ 表示投影层与隐藏层之间的权重，$b_j$ 表示隐藏层的偏置。相应地，我们可以得到输出单元如下：\n\n$$o_i\
    \ = \\sum_{j} v_{ij} d_j + k_i$$\n\n这里，$v_{ij}$ 表示隐藏层与输出层之间的权重，$k_i$ 表示输出层的偏置。给定特定历史\
    \ $h_j$ 时某个词 $i$ 的概率然后可以通过 softmax 函数计算：\n\n$$P\\left(w_j = i \\mid h_j\\right)\
    \ = \\frac{\\exp(o_i)}{\\sum_{l=1}^{N} \\exp(o_l)}$$\n\n正如你所看到的，在 NNLM 中，模型同时预测所有词的概率。由于该模型现在用标准神经网络来描述，我们可以使用标准反向传播算法来训练该模型。\n\
    \n"
