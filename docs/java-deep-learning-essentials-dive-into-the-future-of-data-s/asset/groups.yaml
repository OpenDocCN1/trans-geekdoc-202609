    \      .nIn(4).nOut(outputNum).build())\n.backprop(true).pretrain(false)\n.build();\n\
    ```\n\n## CNNMnistExample.java/LenetMnistExample.java\n\nCNN由于其结构而比其他模型更为复杂，但我们不必担心这些复杂性，因为我们可以使用DL4J轻松实现CNN。让我们看一下卷积包中的`CNNMnistExample.java`。在本示例中，我们使用MNIST数据集（http://yann.lecun.com/exdb/mnist/）训练模型，这是最著名的基准指标之一。正如*第1章，深度学习概述*中提到的，该数据集包含70,000个从0到9的手写数字数据，每个数字的宽度和高度均为28像素。\n\
    \n首先，我们定义模型所需的值：\n\n```\nint numRows = 28;\nint numColumns = 28;\nint nChannels\
    \ = 1;\nint outputNum = 10;\nint numSamples = 2000;\nint batchSize = 500;\nint\
    \ iterations = 10;\nint splitTrainNum = (int) (batchSize*.8);\nint seed = 123;\n\
    int listenerFreq = iterations/5;\n```\n\n由于MNIST中的图像都是灰度数据，因此通道数设置为1。在本示例中，我们使用70,000个数据中的2,000个，并将其拆分为训练数据和测试数据。这里的小批量大小（mini-batch）为500，因此训练数据被分成4个小批量。此外，每个小批量中的数据被拆分为训练数据和测试数据，每个测试数据存储在ArrayList中：\n\
    \n```\nList<INDArray> testInput = new ArrayList<>();\nList<INDArray> testLabels\
    \ = new ArrayList<>();\n```\n\n在前面的示例中，我们不必设置ArrayList，因为当时只有一个批次。对于MnistDataSetIterator类，我们只需使用以下方式即可设置MNIST数据：\n\
    \n```\nDataSetIterator mnistIter = new\nMnistDataSetIterator(batchSize,numSamples,\
    \ true);\n```\n\n然后，我们使用卷积层和子采样层构建模型。这里，我们有一个卷积层和一个最大池化层，后面直接连接一个输出层。CNN配置的结构与其他算法略有不同：\n\
    \n```\nMultiLayerConfiguration.Builder builder = new NeuralNetConfiguration.\n\
    Builder().layer().layer(). ... .layer()\nnew ConvolutionLayerSetup(builder,numRows,numColumns,nChannels);\n\
    MultiLayerConfiguration conf = builder.build();\nMultiLayerNetwork model = new\
    \ MultiLayerNetwork(conf);\nmodel.init();\n```\n\n区别在于我们不能直接从配置构建模型，因为我们需要预先使用ConvolutionLayerSetup()告诉builder设置卷积层。每个.layer()的编码方式完全相同。卷积层定义为：\n\
    \n```\n.layer(0, new ConvolutionLayer.Builder(10, 10)\n    .stride(2,2)\n    .nIn(nChannels)\n\
    \    .nOut(6)\n    .weightInit(WeightInit.XAVIER)\n    .activation(\"relu\")\n\
    \    .build())\n```\n\n"
