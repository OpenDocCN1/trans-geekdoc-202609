    \n构建和训练模型的过程与前面示例中解释的过程几乎相同。在本示例中，我们构建了一个包含两个隐藏层、并使用dropout和整流器的深度神经网络，也就是说，我们的结构是输入层-隐藏层-隐藏层-输出层，如下所示：\n\
    \n```\nMultiLayerConfiguration conf = new NeuralNetConfiguration.Builder()\n \
