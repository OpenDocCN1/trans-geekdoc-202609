    \ 0; i < patterns; i++) {\n    System.out.printf(\" class %d: %.1f %%\\n\", i+1,\
    \ recall[i] * 100);\n}\n```\n\n## 多层感知机（多层神经网络）\n\n单层神经网络有一个很大的问题。感知机和逻辑回归对于可以线性分类的问题很有效，但它们完全无法解决非线性问题。例如，它们甚至连图中这个最简单的\
    \ XOR 问题都无法解决：\n\n![](img/9315e45972ec0fbaf15f9144035bca79_73_0.png)\n\n现在，我们来看如何计算输出。乍一看很复杂，但它以同样的方式逐层累积网络的权重和激活结构，因此只需把每一层的方程组合起来即可。每个输出可以表示如下：\n\
    \n$$y_k=g\\left(\\sum_{j=1}^{M}w_{kj}^{(2)}z_j+b_k^{(2)}\\right)$$\n\n$$=g\\left(\\\
    sum_{j=1}^{M}w_{kj}^{(2)}h\\left(\\sum_{i=1}^{D}w_{ji}^{(1)}x_i+b_j^{(1)}\\right)+b_k^{(2)}\\\
    right)$$\n\n这里，$h$ 是隐藏层的激活函数，$g$ 是输出层。\n\n如前所述，在多分类问题中，使用 $softmax$ 函数可以高效地计算输出层的激活函数，误差函数如下：\n\
