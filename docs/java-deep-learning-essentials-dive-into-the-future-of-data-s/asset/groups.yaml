  - "[PAGE 235]\n\nIt simply runs the `caffe` command with the protocol file `lenet_solver.prototxt`.\
    \ This file configures the hyper parameters of the model such as the learning\
    \ rate and the momentum. The file also references the network configuration file,\
    \ in this case, `lenet_train_test.prototxt`. You can define each layer with a\
    \ JSON-like description:\n\n```\nlayer {\n  name: \"conv1\"\n  type: \"Convolution\"\
    \n  bottom: \"data\"\n  top: \"conv1\"\n  param {\n    lr_mult: 1\n  }\n  param\
    \ {\n    lr_mult: 2\n  }\n  convolution_param {\n    num_output: 20\n    kernel_size:\
    \ 5\n    stride: 1\n    weight_filler {\n      type: \"xavier\"\n    }\n    bias_filler\
    \ {\n      type: \"constant\"\n    }\n  }\n}\n```\n\nSo, basically, the protocol\
    \ file is divided into two parts:\n\n+   - **Net**: This defines the detailed\
    \ structure of the model and gives a description of each layer, hence whole neural\
    \ networks\n+   - **Solver**: This defines the optimization settings such as the\
    \ use of a CPU/GPU, the number of iterations, and the hyper parameters of the\
    \ model such as the learning rate\n\nCaffe can be a great tool when you need to\
    \ apply deep learning to a large dataset with principal approaches."
