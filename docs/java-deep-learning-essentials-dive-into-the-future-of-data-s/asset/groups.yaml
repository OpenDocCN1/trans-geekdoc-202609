    The following figure is a schematic drawing of the general model:


    ![](img/9315e45972ec0fbaf15f9144035bca79_57_0.png)


    Here, $x_i$ shows the input signal, $w_i$ shows the weight corresponding to each
    input signal, and $y$ shows the output signal. $f$ is the activation function.
    $\sum$ shows, literally, the meaning of calculating the sum of data coming from
    the input. Please bear in mind that $x_i$ applies a processing of nonlinear conversion
    with feature engineering in advance, that is, $x_i$ is an engineered feature.


    Then, the output of perceptron can be represented as follows:


    $y(x) = f(w^T x)$


    $f(a) = \begin{cases} +1,\ a \ge 0 \\ -1,\ a < 0 \end{cases}$


    $f(*)$ is called the step function. As shown in the equation, Perceptron returns
    the output by multiplying each factor of the feature vector by weight, calculating
    the sum of them, and then activating the sum with the step function. The output
    is the result estimated by Perceptron. During the training, you will compare this
    result with the correct data and feed back the error.'
  - '[PAGE 58]


    Let $t$ be the value of the labeled data. Then, the formula can be represented
    as follows:


    $t \in \{-1,1\}$


    If some labeled data belongs to class 1, $C_1$, we have $t = 1$. If it belongs
    to class 2, $C_2$, we have $t = -1$. Also, if the input data is classified correctly,
    we get:


    $\begin{cases} w^T x_n > 0 \text{ where } x_n \in C_1 \\ w^T x_n < 0 \text{ where
    } x_n \in C_2 \end{cases}$


    So, putting these equations together, we have the following equation of properly
    classified data:


    $w^T x_n t_n > 0$


    Therefore, you can increase the predictability of Perceptron by minimizing the
    following function:


    $E(w) = - \sum_{n \in M} w^T x_n t_n$


    Here, $E$ is called the error function. $M$ shows the set of misclassification.
    To minimize the error function, gradient descent, or steepest descent, an optimization
    algorithm is used to find a local minimum of a function using gradient descent.
    The equation can be described as follows:


    $w^{(k+1)} = w^{(k)} - \eta \nabla E(w) = w^{(k)} + \eta x_n t_n$


    Here, $\eta$ is the learning rate, a common parameter of the optimization algorithm
    that adjusts the learning speed, and $k$ shows the number of steps of the algorithm.
    In general, the smaller the value of the learning rate, the more probable it is
    that the algorithm falls into a local minimum because the model can''t override
    the old value much. If the value is too big, however, the model parameters can''t
    converge because the values fluctuate too widely. Therefore, practically, the
    learning rate is set to be big at the beginning and then dwindle with each iteration.
    On the other hand, with perceptrons, it is proved that the algorithm converges
    irrespective of the value of the learning rate when the data set is linearly separable,
    and thus the value is set to be 1.'
