  - '[PAGE 96]


    RBM is the energy-based model, and the status of a visible layer or hidden layer
    is treated as a stochastic variable. We''ll look at the equations in order. First
    of all, each visible unit is propagated to the hidden units throughout a network.
    At this time, each hidden unit takes a binary value based on the probability distribution
    generated in accordance with its propagated inputs:


    $$p(h_j=1|v)=\sigma\left(\sum_{i=1}^{D} w_{ij} v_i + c_j\right)$$


    Here, $c_j$ is the bias in a hidden layer and $\sigma$ denotes the sigmoid function.


    This time, it was conversely propagated from a hidden layer to a visible layer
    through the same network. As in the previous case, each visible unit takes a binary
    value based on probability distribution generated in accordance with propagated
    values.


    $$p(v_i=1|h)=\sigma\left(\sum_{j=1}^{M} w_{ij} h_j + b_i\right)$$


    Here, $b_i$ is the bias of the visible layer. This value of visible units is expected
    to match the original input values. This means if $W$, the weight of the network
    as a model parameter, and $b$, $c$, the bias of a visible layer and a hidden layer,
    are shown as a vector parameter, $\theta$, it leans $\theta$ in order for the
    probability $p(v|\theta)$ that can be obtained above to get close to the distribution
    of $v$.


    For this learning, the energy function, that is, the evaluation function, needs
    to be defined. The energy function is shown as follows:


    $$E(v,h) = -b^T v - c^T h - h^T W v$$


    $$= -\sum_{i=1}^{D} b_i v_i - \sum_{j=1}^{M} c_j h_j - \sum_{j=1}^{M}\sum_{i=1}^{D}
    h_j w_{ij} v_i$$'
  - '[PAGE 97]


    Also, the joint probability density function showing the demeanor of a network
    can be shown as follows:


    $$p(v,h)=\frac{1}{Z}\exp(-E(v,h))$$


    $$Z=\sum_{v,h}\exp(-E(v,h))$$


    From the preceding formulas, the equations for the training of parameters will
    be determined. We can get the following equation:


    $$p(v\mid\theta)=\sum_{h}P(v,h)=\frac{1}{Z}=\sum_{h}\exp(-E(v,h))$$


    Hence, the **log likelihood** can be shown as follows:


    $$\mathit{In}\,L(\theta\mid v)=\mathit{In}\,p(v\mid\theta)$$


    $$=\mathit{In}\,\frac{1}{Z}\sum_{h}\exp(-E(v,h))$$


    $$=\mathit{In}\,\frac{1}{Z}\sum_{h}\exp(-E(v,h))-\mathit{In}\,\sum_{v,h}\exp(-E(v,h))$$'
  - "[PAGE 98]\n\nThen, we'll calculate each gradient against the model parameter.\
