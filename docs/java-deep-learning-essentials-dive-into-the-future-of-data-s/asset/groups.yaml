  mdcn: "\n这里，w 是核的权重，即模型参数。请记住，我们将每个求和都从 0 开始描述，而不是从 1 开始，这样你能更好地理解。然而，当我们考虑多卷积层时，该方程是不够的，因为它没有通道的信息。幸运的是，这并不困难，因为我们只需在核中添加一个参数即可实现。扩展的方程可以表示为：\n\
    \n$$z_{ij}^{(k)} = \\sum_{c} \\sum_{s=0}^{m-1} \\sum_{t=0}^{n-1} w_{st}^{(k,c)}\
    \ x_{(i+s)(j+t)}^{(c)}$$\n\n这里，c 表示图像的通道。如果核的数量为 K，通道数量为 C，则有 $W \\in \\mathbb{R}^{K\
    \ \\times C \\times m \\times n}$。然后，从方程中可以看到，卷积后图像的大小为 $(M - m +1)\\times(N -\
    \ n +1)$。\n\n卷积后，所有卷积值都将由激活函数激活。我们将使用整流器——目前最流行的函数——来实现 CNN，但你也可以使用 sigmoid 函数、双曲正切或其他可用的激活函数。有了激活函数，我们有：\n\
    \n$$a_{ij}^{(k)} = h\\left(z_{ij}^{(k)} + b^{(k)}\\right) = \\max\\left(0, z_{ij}^{(k)}\
    \ + b^{(k)}\\right)$$\n\n这里，b 表示偏置，即另一个模型参数。可以看到 b 没有 i 和 j 的下标，即我们有 $b \\in \\\
    mathbb{R}^K$，一个一维数组。因此，我们已将卷积层的值前向传播。\n\n接下来是最大池化层。传播可以简单地写成如下：\n\n$$y_{ij}^{(k)}\
    \ = \\max\\left(a_{(l_1 i + s)(l_2 j + t)}^{(k)}\\right)$$\n\n这里，$l_1$ 和 $l_2$\
    \ 是池化滤波器的大小，且 $s \\in [0, l_1], t \\in [0, l_2]$。通常，$l_1$ 和 $l_2$ 被设为相同的值 2 ~\
    \ 4。\n\n这两个层，卷积层和最大池化层，往往按此顺序排列，但你不一定必须遵循。例如，你可以在最大池化之前放置两个卷积层。此外，虽然我们将激活放在卷积之后，有时它也会设在最大池化之后而不是卷积之后。然而，为了简单起见，我们将按卷积-激活-最大池化的顺序和序列实现\
    \ CNN。\n\n![](img/9315e45972ec0fbaf15f9144035bca79_144_0.png)\n\n> 这里有一个重要说明，虽然核权重将从数据中学习，但架构、核的大小和池化的大小都是参数。\n\
    \n简单的 MLP 在卷积层和最大池化层之后，用于对数据进行分类。这里，由于 MLP 只能接受一维数据，我们需要将下采样的数据展平作为预处理，以适应 MLP\
    \ 的输入层。特征提取在 MLP 之前已完成，因此将数据格式化为一维不会有问题。因此，一旦模型优化，CNN 就可以对图像数据进行分类。为此，与其他神经网络一样，反向传播算法应用于\
    \ CNN 以训练模型。我们在此不提及与 MLP 相关的方程。\n\n来自 MLP 输入层的误差被反向传播到最大池化层，这次它被展开为二维以正确适应模型。由于最大池化层没有模型参数，它只是简单地将误差反向传播到前一层。方程可以描述如下：\n\
    \n$$\\frac{\\partial E}{\\partial a^{(k)}_{(l_1+s)(l_2+j+t)}} = \\begin{cases}\
    \ \\frac{\\partial E}{\\partial y^{(k)}_{ij}} & \\text{if } y^{(k)}_{ij} = a^{(k)}_{(l_1+s)(l_2+j+t)}\
    \ \\\\ 0 & \\text{otherwise} \\end{cases}$$\n\n这里，E 表示评估函数。然后该误差被反向传播到卷积层，并据此我们可以计算权重和偏置的梯度。由于在反向传播时带偏置的激活在卷积之前，让我们先看偏置的梯度，如下所示：\n\
    \n$$\\frac{\\partial E}{\\partial b^{(k)}} = \\sum_{i=0}^{M-m} \\sum_{j=0}^{N-m}\
    \ \\frac{\\partial E}{\\partial a^{(k)}_{ij}} \\frac{\\partial a^{(k)}_{ij}}{\\\
    partial b^{(k)}}$$\n\n为了继续这个方程，我们定义如下：\n\n$\\delta_{ij}^{(k)} := \\frac{\\partial\
    \ E}{\\partial a_{ij}^{(k)}}$\n\n我们还定义：\n\n$c_{ij}^{(k)} := z_{ij}^{(k)} + b^{(k)}$\n\
    \n有了这些，我们得到：\n\n$\\frac{\\partial E}{\\partial b^{(k)}} = \\sum_{i=0}^{M-m} \\\
    sum_{j=0}^{N-n} \\delta_{ij}^{(k)} \\frac{\\partial a_{ij}^{(k)}}{\\partial c_{ij}^{(k)}}\
    \ \\frac{\\partial c_{ij}^{(k)}}{\\partial b^{(k)}}$\n$= \\sum_{i=0}^{M-m} \\\
    sum_{j=0}^{N-n} \\delta_{ij}^{(k)} h'\\left(c_{ij}^{(k)}\\right)$\n\n我们可以用同样的方式计算权重（核）的梯度：\n\
    \n$\\frac{\\partial E}{\\partial w_{st}^{(k,c)}} = \\sum_{i=0}^{M-m} \\sum_{j=0}^{N-n}\
    \ \\frac{\\partial E}{\\partial z_{ij}^{(k)}} \\frac{\\partial z_{ij}^{(k)}}{\\\
    partial w_{st}^{(k,c)}}$\n$= \\sum_{i=0}^{M-m} \\sum_{j=0}^{N-n} \\frac{\\partial\
    \ E}{\\partial z_{ij}^{(k)}} \\frac{\\partial a_{ij}^{(k)}}{\\partial z_{ij}^{(k)}}\
    \ x_{(i+s)(j+t)}^{(c)}$\n$= \\sum_{i=0}^{M-m} \\sum_{j=0}^{N-n} \\delta_{ij}^{(k)}\
    \ h'\\left(c_{ij}^{(k)}\\right) x_{(i+s)(j+t)}^{(c)}$\n\n因此，我们可以更新模型参数。如果我们只有一个卷积层和最大池化层，刚才给出的方程就足够了。然而，当考虑多卷积层时，我们还需要计算卷积层的误差。这可以表示如下：\n\
    \n$\\frac{\\partial E}{\\partial x_{ij}^{(c)}} = \\sum_{k} \\sum_{s=0}^{m-1} \\\
    sum_{t=0}^{n-1} \\frac{\\partial E}{\\partial z_{(i-s)(j-t)}^{(k)}} \\cdot \\\
    frac{\\partial z_{(i-s)(j-t)}^{(k)}}{\\partial x_{ij}^{(c)}} = \\sum_{k} \\sum_{s=0}^{m-1}\
    \ \\sum_{t=0}^{n-1} \\frac{\\partial E}{\\partial z_{(i-s)(j-t)}^{(k)}} w_{st}^{(k,c)}$\n\
    \n这里，我们得到：\n\n$\\frac{\\partial E}{\\partial z_{ij}^{(k)}} = \\frac{\\partial\
    \ E}{\\partial a_{ij}^{(k)}} \\cdot \\frac{\\partial a_{ij}^{(k)}}{\\partial z_{ij}^{(k)}}\
    \ = \\delta_{ij}^{(k)} \\frac{\\partial a_{ij}^{(k)}}{\\partial c_{ij}^{(k)}}\
    \ \\cdot \\frac{\\partial c_{ij}^{(k)}}{\\partial z_{ij}^{(k)}} = \\delta_{ij}^{(k)}\
    \ h'(c_{ij}^{(k)})$\n\n因此，误差可以写成如下：\n\n$\\frac{\\partial E}{\\partial x_{ij}^{(c)}}\
    \ = \\sum_{k} \\sum_{s=0}^{m-1} \\sum_{t=0}^{n-1} \\delta_{(i-s)(j-t)}^{(k)} h'(c_{(i-s)(j-t)}^{(k)})\
    \ w_{st}^{(k,c)}$\n\n计算时我们必须小心，因为存在 i − s < 0 或 j − t < 0 的可能性，此时特征图之间没有元素。为了解决这个问题，我们需要在它们的左上角添加零填充。然后，该方程只是沿两个轴翻转核的卷积。虽然\
    \ CNN 中的方程看起来可能很复杂，但它们只是每个参数的求和堆叠。\n\n有了之前的全部方程，我们现在可以实现 CNN，那么让我们看看如何做。包结构如下：\n\
