  mdcn: "\n## 7 其他重要的深度学习库\n\n在本章中，我们将讨论其他深度学习库，特别是使用Java以外编程语言的库。以下是最著名、发展最完善的库：\n\
    \n- Theano\n- TensorFlow\n- Caffe\n\n你将简要了解它们中的每一个。由于我们在这里主要使用Python实现它们，如果你不是Python开发者，可以跳过本章。本章介绍的所有库都支持GPU实现，并且还有其他特殊功能，让我们深入了解它们。\n\
    \n### Theano\n\nTheano是为深度学习而开发的，但它实际上并不是一个深度学习库；它是一个用于科学计算的Python库。文档可在 http://deeplearning.net/software/theano/\
    \ 获取。该页面上介绍了几个特性，例如使用GPU，但最引人注目的特性是Theano支持计算微分或自动微分，而Java科学计算库ND4J不支持这一点。这意味着，使用Theano，我们不必自己计算模型参数的梯度。Theano会自动完成这项工作。由于Theano承担了算法中最复杂的部分，数学表达式的实现就不那么困难了。\n\
    \n让我们看看Theano如何计算梯度。首先，我们需要在机器上安装Theano。只需使用pip install Theano或easy_install Theano即可完成安装。然后，下面是导入和使用Theano的代码行：\n\
    \n```\nimport theano\nimport theano.tensor as T\n```\n\n在Theano中，所有变量都作为张量处理。例如，我们有标量、向量和矩阵，d表示double（双精度），l表示long（长整型），等等。诸如sin、cos、log和exp等通用函数也定义在theano.tensor下。因此，如前所示，我们经常使用tensor的别名T。\n\
    \n作为简要理解Theano实现的第一步，考虑非常简单的抛物线曲线。实现代码保存在DLWJ/src/resources/theano/1_1_parabola_scalar.py中，方便你参考。首先，我们如下定义x：\n\
    \n```\nx = T.dscalar('x')\n```\n\n这个定义是Python特有的，因为x没有值；它只是一个符号。在这种情况下，x是d（double）类型的标量。然后我们可以非常直观地定义y及其梯度。实现如下：\n\
    \n```\ny = x ** 2\ndy = T.grad(y, x)\n```\n\n因此，dy内部应该有2x。让我们检查能否得到正确答案。我们还需要额外做的是用Theano注册这个数学函数：\n\
    \n```\nf = theano.function([x], dy)\n```\n\n然后你可以轻松计算梯度的值：\n\n```\nprint f(1)\
    \  # => 2.0\nprint f(2)  # => 4.0\n```\n\n非常简单！这就是Theano的强大之处。这里我们使用的是标量x，但你也可以轻松实现向量（和矩阵）计算，只需将x定义为：\n\
    \n```\nx = T.dvector('x')\ny = T.sum(x ** 2)\n```\n\n这里我们不再深入，但你可以在DLWJ/src/resources/theano/1_2_parabola_vector.py和DLWJ/src/resources/theano/1_3_parabola_matrix.py中找到完整代码。\n\
    \n当我们考虑用Theano实现深度学习算法时，可以在GitHub上的Deep Learning Tutorials（https://github.com/lisa-lab/DeepLearningTutorials）中找到一些非常好的示例。在本章中，我们将概述标准MLP实现，以便你更了解Theano。作为快照的fork仓库可在\
    \ https://github.com/yusugomori/DeepLearningTutorials 获取。首先，让我们看一下mlp.py。隐藏层的模型参数是权重和偏置：\n\
    \n```\nW = theano.shared(value=W_values, name='W', borrow=True)\nb = theano.shared(value=b_values,\
    \ name='b', borrow=True)\n```\n\n这两个参数都使用theano.shared定义，以便通过模型访问和更新它们。激活可以表示为：\n\
    \n$z = h(Wx + b)$\n\n这表示激活函数，即本代码中的双曲正切函数。因此，相应的代码如下：\n\n```\nlin_output = T.dot(input,\
    \ self.W) + self.b\nself.output = (\n    lin_output if activation is None\n  \
    \  else activation(lin_output)\n)\n```\n\n这里也支持线性激活。同样，输出层（即逻辑回归层）的参数W和b在logistic_sgd.py中定义并初始化：\n\
    \n```\nself.W = theano.shared(\n    value=numpy.zeros(\n        (n_in, n_out),\n\
    \        dtype=theano.config.floatX\n    ),\n    name='W',\n    borrow=True\n\
    )\n\nself.b = theano.shared(\n    value=numpy.zeros(\n        (n_out,),\n    \
    \    dtype=theano.config.floatX\n    ),\n    name='b',\n    borrow=True\n)\n```\n\
    \n多类逻辑回归的激活函数是softmax函数，我们可以直接编写并定义输出如下：\n\n```\nself.p_y_given_x = T.nnet.softmax(T.dot(input,\
    \ self.W) + self.b)\n```\n\n我们可以将预测值写为：\n\n```\nself.y_pred = T.argmax(self.p_y_given_x,\
    \ axis=1)\n```\n\n在训练方面，由于反向传播算法的方程是从损失函数及其梯度计算出来的，我们只需要定义要最小化的函数，即负对数似然函数：\n\n\
    ```\ndef negative_log_likelihood(self, y):\n    return -T.mean(T.log(self.p_y_given_x)[T.arange(y.shape[0]),\
    \ y])\n```\n\n这里计算的是平均值，而不是总和，以便在mini-batch（小批量）上进行评估。\n\n有了上述值和定义，我们就可以实现MLP了。这里同样，我们需要做的是定义MLP的方程和符号。以下是代码的摘录：\n\
    \n```\nclass MLP(object):\n    def __init__(self, rng, input, n_in, n_hidden,\
    \ n_out):\n        # self.hiddenLayer = HiddenLayer(...)\n        # self.logRegressionLayer\
    \ = LogisticRegression(...)\n        # L1 norm\n        self.L1 = (\n        \
    \    abs(self.hiddenLayer.W).sum()\n            + abs(self.logRegressionLayer.W).sum()\n\
    \        )\n        # square of L2 norm\n        self.L2_sqr = (\n           \
    \ (self.hiddenLayer.W ** 2).sum()\n            + (self.logRegressionLayer.W **\
    \ 2).sum()\n        )\n        # negative log likelihood of MLP\n```\n\n每个索引输入和标签对应于givens中的x、y，因此当给定索引时，参数会通过updates更新。因此，我们可以通过训练轮次（epoch）和mini-batch的迭代来训练模型：\n\
    \n```\nwhile (epoch < n_epochs) and (not done_looping):\n    epoch = epoch + 1\n\
    \    for minibatch_index in xrange(n_train_batches):\n        minibatch_avg_cost\
    \ = train_model(minibatch_index)\n```\n\n原始代码包含测试和验证部分，但我们刚才提到的是基本结构。使用Theano，不再需要推导梯度方程。\n\
    \n### TensorFlow\n\nTensorFlow是由谷歌开发的机器学习和深度学习库。项目页面是 https://www.tensorflow.org/\
    \ ，所有代码都在GitHub上公开，地址为 https://github.com/tensorflow/tensorflow 。TensorFlow本身是用C++编写的，但它提供了Python和C++\
    \ API。本书重点介绍Python实现。安装可以通过pip、virtualenv或docker完成。安装指南可在 https://www.tensorflow.org/versions/master/get_started/os_setup.html\
    \ 获取。安装完成后，你可以通过编写以下代码导入和使用TensorFlow：\n\n```\nimport tensorflow as tf\n```\n\n\
    TensorFlow建议你使用以下三个部分来实现深度学习代码：\n\n- inference()：使用给定数据进行预测，定义模型结构\n- loss()：返回需要优化的误差值\n\
    - training()：通过计算梯度应用实际的训练算法\n\n我们将遵循这一指导原则。在 https://www.tensorflow.org/versions/master/tutorials/mnist/beginners/index.html\
    \ 上介绍了面向初学者的MNIST分类教程，该教程的代码可以在DLWJ/src/resources/tensorflow/1_1_mnist_simple.py中找到。这里，我们考虑改进教程中介绍的代码。你可以在DLWJ/src/resources/tensorflow/1_2_mnist.py中看到所有代码。\n\
    \n"
