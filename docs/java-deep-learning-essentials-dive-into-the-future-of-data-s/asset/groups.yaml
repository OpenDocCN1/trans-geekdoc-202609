  mdcn: "\nRBM 是基于能量的模型，可见层或隐藏层的状态被视为随机变量。我们将按顺序查看方程。首先，每个可见单元通过网络传播到隐藏单元。此时，每个隐藏单元根据其传播输入生成的概率分布取二值：\n\
    \n$$p(h_j=1|v)=\\sigma\\left(\\sum_{i=1}^{D} w_{ij} v_i + c_j\\right)$$\n\n这里，$c_j$\
    \ 是隐藏层的偏置，$\\sigma$ 表示 sigmoid 函数。\n\n这次，它反过来通过同一网络从隐藏层传播到可见层。与前一种情况一样，每个可见单元根据传播值生成的概率分布取二值。\n\
    \n$$p(v_i=1|h)=\\sigma\\left(\\sum_{j=1}^{M} w_{ij} h_j + b_i\\right)$$\n\n这里，$b_i$\
    \ 是可见层的偏置。可见单元的值预计与原始输入值匹配。这意味着如果 $W$ 作为模型参数的网络权重，以及可见层和隐藏层的偏置 $b$、$c$，表示为向量参数\
    \ $\\theta$，它学习 $\\theta$，以使上面可以获得的概率 $p(v|\\theta)$ 接近 $v$ 的分布。\n\n为此学习，需要定义能量函数，即评价函数。能量函数如下所示：\n\
    \n$$E(v,h) = -b^T v - c^T h - h^T W v$$\n\n$$= -\\sum_{i=1}^{D} b_i v_i - \\sum_{j=1}^{M}\
    \ c_j h_j - \\sum_{j=1}^{M}\\sum_{i=1}^{D} h_j w_{ij} v_i$$\n\n此外，显示网络行为的联合概率密度函数可以表示如下：\n\
    \n$$p(v,h)=\\frac{1}{Z}\\exp(-E(v,h))$$\n\n$$Z=\\sum_{v,h}\\exp(-E(v,h))$$\n\n\
    根据前面的公式，将确定参数训练的方程。我们可以得到以下方程：\n\n$$p(v\\mid\\theta)=\\sum_{h}p(v,h)=\\frac{1}{Z}\\\
    sum_{h}\\exp(-E(v,h))$$\n\n因此，**对数似然**可以表示如下：\n\n$$\\ln L(\\theta\\mid v)=\\ln\
    \ p(v\\mid\\theta)$$\n\n$$=\\ln\\left(\\frac{1}{Z}\\sum_{h}\\exp(-E(v,h))\\right)$$\n\
    \n$$=\\ln\\sum_{h}\\exp(-E(v,h))-\\ln\\sum_{v,h}\\exp(-E(v,h))$$\n\n然后，我们将计算相对于模型参数的每个梯度。导数可以按如下方式计算：\n\
    \n$$\\frac{\\partial \\ln L(\\theta | v)}{\\partial \\theta} = \\frac{\\partial}{\\\
    partial \\theta}\\left( \\ln \\sum_h \\exp(-E(v,h)) \\right) - \\frac{\\partial}{\\\
    partial \\theta}\\left( \\ln \\sum_{v,h} \\exp(-E(v,h)) \\right)$$\n\n$$= -\\\
    frac{1}{\\sum_h \\exp(-E(v,h))} \\sum_h \\exp(-E(v,h)) \\frac{\\partial E(v,h)}{\\\
    partial \\theta}$$\n\n$$= +\\frac{1}{Z} \\sum_{v,h} \\exp(-E(v,h)) \\frac{\\partial\
    \ E(v,h)}{\\partial \\theta}$$\n\n$$= -\\sum_h p(h|v) \\frac{\\partial E(v,h)}{\\\
    partial \\theta} + \\sum_{v,h} p(v,h) \\frac{\\partial E(v,h)}{\\partial \\theta}$$\n\
    \n中间的一些方程很复杂，但在模型和原始数据的概率分布方面却变得简单。\n\n因此，每个参数的梯度如下所示：\n\n$$\\frac{\\partial \\\
    ln L(\\theta | v)}{\\partial w_{ij}} = -\\sum_h p(h|v) \\frac{\\partial E(v,h)}{\\\
    partial w_{ij}} + \\sum_{v,h} p(v,h) \\frac{\\partial E(v,h)}{\\partial w_{ij}}$$\n\
    \n$$= \\sum_h p(h|v) h_j v_i - \\sum_v p(v) \\sum_h p(h|v) h_j v_i$$\n\n$$= p(H_j=1|v)\
    \ v_i - \\sum_v p(v) p(H_j=1|v) v_i$$\n\n$$\\frac{\\partial \\ln L(\\theta | v)}{\\\
    partial b_i} = v_i - \\sum_v p(v) v_i$$\n\n$$\\frac{\\partial \\ln L(\\theta |\
    \ v)}{\\partial c_j} = p(H_j=1|v) - \\sum_v p(v) p(H_j=1|v)$$\n\n那么，我们可以找到梯度方程，但在直接应用该方程时会遇到问题。考虑\
    \ $\\sum_v p(v)$ 项。该项意味着我们必须为所有 $\\{0, 1\\}$ 模式计算概率分布，这些模式可以假设为包含数据中实际上不存在的模式的输入数据。\n\
