    \ at https://github.com/deeplearning4j/Canova. As explained on that page, Canova\
    \ is the library used to vectorize raw data into usable vector formats across\
    \ the machine learning tools. This also helps us focus on the more important part\
    \ of data mining because data formatting is indispensable in whatever research\
    \ or experiment we're performing.\n\n## Build\n\nLet's look at the source code\
    \ in the examples and see how to build a deep learning model. During the process,\
    \ the terms of deep learning that you haven't yet learned are also briefly explained.\
    \ The examples are implemented with various models such as MLP, DBN, and CNN,\
    \ but there is one problem here. As you can see when looking at README.md, some\
    \ methods don't generate good precision. This is because, as explained in the\
    \ previous section, the calculation precision a machine has is limited and fluctuation\
    \ occurring with calculated values during the process depends completely on the\
    \ difference of implementation. Hence, practically, learning can't be done properly,\
    \ although theoretically it should be done well. You can get better results by,\
    \ for example, changing the seed values or adjusting the parameters, but as we\
    \ would like to focus on how to use a library, we'll use a model that gets higher\
    \ precision as an example.\n\n### DBNIrisExample.java\n\nLet's first look at DBNIrisExample.java\
    \ in the package of deepbelief. Iris, contained in the filename, is one of the\
    \ benchmark datasets often used when measuring the precision or accuracy of a\
    \ machine learning method. The dataset contains 150 pieces of data out of 3 classes\
    \ of 50 instances each, and each class refers to a type of Iris plant. The number\
    \ of inputs is 4 and the number of outputs is therefore 3. One class is linearly\
    \ separable from the other two; the latter are not linearly separable from each\
    \ other.\n\nThe implementation begins by setting up the configuration. Here are\
    \ the variables that need setting:\n\n```\nfinal int numRows = 4;\nfinal int numColumns\
    \ = 1;\nint outputNum = 3;\nint numSamples = 150;\nint batchSize = 150;\nint iterations\
    \ = 5;\nint splitTrainNum = (int) (batchSize * .8);\nint seed = 123;\nint listenerFreq\
    \ = 1;\n```\n"
  mdcn: "\n\n然后，由于我们将模型参数定义为 INDArray，因此也将示例数据、训练数据和测试数据定义为 INDArray。你可以在 main 方法开头看到这些定义：\n\
    \n```\nINDArray train_X = Nd4j.create(new double[train_N * nIn], new int[]\n{train_N,\
    \ nIn});  // input data for training\nINDArray train_T = Nd4j.create(new double[train_N],\
    \ new int[]{train_N, 1});      // output data (label) for training\n\nINDArray\
    \ test_X = Nd4j.create(new double[test_N * nIn], new int[]\n{test_N, nIn});  //\
    \ input data for test\nINDArray test_T = Nd4j.create(new double[test_N], new int[]{test_N,\
    \ 1});      // label of inputs\nINDArray predicted_T = Nd4j.create(new double[test_N],\
    \ new int[]\n{test_N, 1});      // output data predicted by the model\n```\n\n\
    当我们向 INDArray 中赋值时，我们使用 put。请注意，使用 put 只能设置标量类型的值：\n\n```\ntrain_X.put(i, 0, Nd4j.scalar(g1.random()));\n\
    train_X.put(i, 1, Nd4j.scalar(g2.random()));\ntrain_T.put(i, Nd4j.scalar(1));\n\
    ```\n\n模型构建和训练的流程与之前的代码相同：\n\n```\n// construct perceptrons\nPerceptrons classifier\
    \ = new Perceptrons(nIn);\n\n// train models\nwhile (true) {\n    int classified_\
    \ = 0;\n\n    for (int i=0; i < train_N; i++) {\n        classified_ += classifier.train(train_X.getRow(i),\n\
    \        train_T.getRow(i), learningRate);\n    }\n\n    if (classified_ == train_N)\
    \ break;  // when all data classified correctly\n\n    epoch++;\n    if (epoch\
    \ > epochs) break;\n}\n```\n\n每条训练数据都通过 getRow() 传递给 train 方法。首先，让我们看一下 train\
    \ 方法的完整内容：\n\n```\npublic int train(INDArray x, INDArray t, double learningRate)\
    \ {\n\n    int classified = 0;\n\n    // check if the data is classified correctly\n\
    \    double c = x.mmul(w).getDouble(0) * t.getDouble(0);\n\n    // apply steepest\
    \ descent method if the data is wrongly classified\n    if (c > 0) {\n       \
    \ classified = 1;\n    } else {\n        w.addi(x.transpose().mul(t).mul(learningRate));\n\
    \    }\n\n    return classified;\n}\n```\n\n我们首先关注以下代码：\n\n```\n// check if the\
    \ data is classified correctly\ndouble c = x.mmul(w).getDouble(0) * t.getDouble(0);\n\
    ```\n\n这是检查数据是否能被感知机正确分类的部分，如下式所示：\n\nw^T x_n t_n > 0\n\n从代码中可以看出，.mmul() 用于向量或矩阵之间的乘法。我们在第2章《机器学习算法——为深度学习做准备》中编写了这一部分的计算，如下所示：\n\
    \n```\ndouble c = 0.;\n\n// check if the data is classified correctly\nfor (int\
    \ i = 0; i < nIn; i++) {\n    c += w[i] * x[i] * t;\n}\n```\n\n通过比较这两段代码，你可以看到向量或矩阵之间的乘法用\
    \ INDArray 可以轻松编写，因此你只需跟随方程即可直观地实现算法。\n\n更新模型参数的方程如下：\n\n```\nw.addi(x.transpose().mul(t).mul(learningRate));\n\
    ```\n\n这里，你同样可以像编写数学方程那样实现代码。该方程表示如下：\n\n$w^{(k+1)} = w^{(k)} + \\eta x_n t_n$\n\
    \n上次实现这部分时，我们使用 for 循环编写：\n\n```\nfor (int i = 0; i < nIn; i++) {\n    w[i] +=\
    \ learningRate * x[i] * t;\n}\n```\n\n此外，训练后的预测也是标准的前向激活，如下式所示：\n\n$y(x) = f(w^T\
    \ x)$\n\n其中：\n\n$f(a) = \\begin{cases} +1, & a \\ge 0 \\\\ -1, & a < 0 \\end{cases}$\n\
    \n我们可以用一行代码简洁地定义 predict 方法，如下所示：\n\n```\npublic int predict(INDArray x) {\n \
    \   return step(x.mmul(w).getDouble(0));\n}\n```\n\n当你运行该程序时，可以看到它的精确率、准确率以及召回率都与之前的代码得到的结果相同。\n\
    \n因此，按照数学方程的形式来实现算法将大有帮助。我们这里只实现了感知机，但请你自己尝试其他算法。\n\n## 使用 DL4J 实现\n\nND4J 是一个帮助你轻松方便地实现深度学习的库。然而，你必须自己实现算法，这与前面章节中的实现差别不大。换句话说，ND4J\
    \ 只是让数值计算更简单，并不是针对深度学习算法优化的库。而一个让深度学习更容易处理的库是 DL4J。幸运的是，关于 DL4J，GitHub（https://github.com/deeplearning4j/dl4j-0.4-examples）上发布了一些带有典型方法的示例代码。这些示例以你使用\
    \ DL4J 的 0.4-* 版本为前提。当你实际克隆这个仓库时，请再次检查最新版本。在本节中，我们将从这些示例程序中提取基本部分并加以查看。我们将参考 https://github.com/yusugomori/dl4j-0.4-examples\
    \ 上的分叉仓库，并在此节中作为截图展示。\n\n### 设置\n\n首先让我们从克隆的仓库设置环境。如果你使用 IntelliJ，可以通过 **文件 |\
    \ 新建 | 来自现有源的项目** 导入项目，并选择仓库路径。然后，选择**从外部模型导入项目**，并选择 **Maven**，如下所示：\n\n![](img/9315e45972ec0fbaf15f9144035bca79_170_0.png)\n\
    \n除了点击 **下一步**，其他步骤无需任何特殊操作。请注意，受支持的 JDK 版本为 1.7 或更高。这可能不是问题，因为在前几章中我们需要 1.8 或更高版本。一旦你顺利设置完成，可以确认目录结构如下：\n\
    \n![](img/9315e45972ec0fbaf15f9144035bca79_171_0.png)\n\n项目设置完成后，我们先来看一下 pom.xml。你可以看到与\
    \ DL4J 相关的包描述如下：\n\n```\n```xml\n<dependency>\n    <groupId>org.deeplearning4j</groupId>\n\
    \    <artifactId>deeplearning4j-nlp</artifactId>\n    <version>${dl4j.version}</version>\n\
    </dependency>\n\n<dependency>\n    <groupId>org.deeplearning4j</groupId>\n   \
    \ <artifactId>deeplearning4j-core</artifactId>\n    <version>${dl4j.version}</version>\n\
    </dependency>\n```\n```\n\n同样，从以下几行可以看出，DL4J 依赖于 ND4J：\n\n```\n<dependency>\n\
    \    <groupId>org.nd4j</groupId>\n    <artifactId>nd4j-x86</artifactId>\n    <version>${nd4j.version}</version>\n\
    </dependency>\n```\n\n如果你想在 GPU 上运行程序，只需修改这一部分即可。如前所述，如果已安装 CUDA，可以如下编写：\n\n```\n\
    <dependency>\n    <groupId>org.nd4j</groupId>\n    <artifactId>nd4j-jcublas-XXX</artifactId>\n\
    \    <version>${nd4j.version}</version>\n</dependency>\n```\n\n这里，xxx 是 CUDA 的版本，取决于你的机器情况。只需这样做就能采用\
    \ GPU 计算，真是太好了。我们无需任何特殊操作，就可以专注于深度学习的实现。\n\nDL4J 开发并使用的另一个特色库是 Canova。pom.xml\
    \ 中对应的部分如下：\n\n```\n<dependency>\n    <artifactId>canova-nd4j-image</artifactId>\n\
    \    <groupId>org.nd4j</groupId>\n    <version>${canova.version}</version>\n</dependency>\n\
    <dependency>\n    <artifactId>canova-nd4j-codec</artifactId>\n    <groupId>org.nd4j</groupId>\n\
    \    <version>${canova.version}</version>\n</dependency>\n```\n\n当然，Canova 也是一个开源库，其源代码可以在\
    \ GitHub 上的 https://github.com/deeplearning4j/Canova 查看。正如该页面所解释的，Canova 是一个将原始数据向量化为可供机器学习工具使用的向量格式的库。由于无论进行何种研究或实验，数据格式化都是不可或缺的，因此这也有助于我们专注于数据挖掘中更重要的部分。\n\
    \n## 构建\n\n让我们看一下示例中的源代码，了解如何构建深度学习模型。在这个过程中，也会简要解释你尚未学过的深度学习术语。示例使用各种模型实现，如 MLP、DBN\
    \ 和 CNN，但这里有一个问题。正如你在查看 README.md 时可以看到的那样，有些方法不能产生良好的精确度。这是因为，如前所述，机器拥有的计算精度是有限的，过程中计算值出现的波动完全取决于实现的差异。因此，尽管理论上应该能良好地学习，但在实际中却无法正确地进行学习。例如，你可以通过更改种子值或调整参数来获得更好的结果，但因为我们想专注于如何使用库，我们将使用一个能获得更高精度的模型作为示例。\n\
    \n### DBNIrisExample.java\n\n让我们首先看一下 deepbelief 包中的 DBNIrisExample.java。文件名中的\
    \ Iris 是常用于衡量机器学习方法的精确率或准确率的基准数据集之一。该数据集包含 3 个类别各 50 个实例，共 150 条数据，每个类别指一种鸢尾属植物。输入数量为\
    \ 4，因此输出数量为 3。一个类别与另外两个类别线性可分；但另外两个类别彼此之间不是线性可分的。\n\n实现从设置配置开始。这里需要设置的变量如下：\n\n\
    ```\nfinal int numRows = 4;\nfinal int numColumns = 1;\nint outputNum = 3;\nint\
    \ numSamples = 150;\nint batchSize = 150;\nint iterations = 5;\nint splitTrainNum\
    \ = (int) (batchSize * .8);\nint seed = 123;\nint listenerFreq = 1;\n```\n\n"
