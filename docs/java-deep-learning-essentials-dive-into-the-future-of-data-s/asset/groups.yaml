  - '[PAGE 146]


    Thus, we can update the model parameters. If we have just one convolutional and
    max-pooling layer, the equations just given are all that we need. When we think
    of multi-convolutional layers, however, we also need to calculate the error of
    the convolutional layers. This can be represented as follows:


    ∂E/∂w_ij^(c) = Σ_k Σ_{s=0}^{m-1} Σ_{t=0}^{n-1} ∂E/∂z_(i-s)(j-t)^(k) · ∂z_(i-s)(j-t)^(k)/∂x_ij^(c)
    = Σ_k Σ_{s=0}^{m-1} Σ_{t=0}^{n-1} ∂E/∂z_(i-s)(j-t)^(k) w_st^(k,c)


    Here, we get:


    ∂E/∂z_ij^(c) = ∂E/∂a_ij^(k) · ∂a_ij^(k)/∂z_ij^(k) = δ_ij^(k) ∂a_ij^(k)/∂c_ij^(k)
    · ∂c_ij^(k)/∂z_ij^(k) = δ_ij^(k) h''(c_ij^(k))


    So, the error can be written as follows:


    ∂E/∂x_ij^(c) = Σ_k Σ_{s=0}^{m-1} Σ_{t=0}^{n-1} δ_(i-s)(j-t)^(k) h''(c_(i-s)(j-t)^(k))
    w_st^(k,c)


    We have to be careful when calculating this because there''s a possibility of
    i − s < 0 or j − t < 0, where there''s no element in between the feature maps.
    To solve this, we need to add zero paddings to the top-left edges of them. Then,
    the equation is simply a convolution with the kernel flipped along both axes.
    Though the equations in CNN might look complicated, they are just a pile of summations
    of each parameter.'
