    .NEGATIVELOGLIKELIHOOD)\n    .weightInit(WeightInit.XAVIER)\n    .activation(\"\
    softmax\")\n    .nIn(2).nOut(outputNum).build()\n.backprop(true).pretrain(false)\n\
    .build();\n```\n\n我们可以使用以下代码行来运行模型：\n\n```\nMultiLayerNetwork model = new MultiLayerNetwork(conf);\n\
    model.init();\n```\n\n图形化模型如下：\n\n![](img/9315e45972ec0fbaf15f9144035bca79_180_0.png)\n\
    \n但是，这次训练代码的编写方式与前面的示例略有不同。之前，我们使用以下方式将数据拆分为训练数据和测试数据：\n\n```\nSplitTestAndTrain\
    \ testAndTrain =\n    next.splitTestAndTrain(splitTrainNum, new Random(seed));\n\
    ```\n\n这表明我们在.splitTestAndTrain()方法中对数据进行了混洗。在本示例中，我们使用以下代码设置训练数据：\n\n```\nnext.shuffle();\n\
    SplitTestAndTrain testAndTrain = next.splitTestAndTrain(0.6);\n```\n\n如你所见，这里首先对数据进行混洗，然后拆分为训练数据和测试数据。请注意，.splitTestAndTrain()中的参数类型是不同的。这会带来好处，因为我们不必计算确切的样本总数或训练数据数量。实际训练使用以下方式完成：\n\
