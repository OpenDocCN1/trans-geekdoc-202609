  mdcn: '

    标准 LSTM 结构之前已完全解释过，但有一个技巧可以提升其性能，我们现在就来解释。每个门都接收来自输入单元和 LSTM 中所有单元输出的连接，但没有来自
    CEC 的直接连接。这意味着我们无法看到网络的真实隐藏状态，因为块的输出高度依赖于输出门；只要输出门关闭，任何门都无法访问 CEC，且其缺乏必要信息，这可能会降低
    LSTM 的性能。一个简单而有效的解决方案是在块中添加从 CEC 到门的连接。这些被称为窥视孔连接，其作用类似于标准的加权连接，只是门通过窥视孔连接不会回传误差。窥视孔连接使所有门即使在输出门关闭时也能感知隐藏状态。你现在已经学习了很多术语，但因此，整个连接的基本架构可以描述如下：


    ![](img/9315e45972ec0fbaf15f9144035bca79_210_0.png)


    为了简化，图中描述了单个 LSTM 块。你可能会感到畏惧，因为前述模型非常复杂。然而，当你逐步查看模型时，你可以理解 LSTM 网络是如何解决 NLP 中的困难的。给定输入序列
    $x=(x_1,\ldots,x_T)$，每个网络单元可按如下方式计算：


    $$\begin{aligned}

    i_t &= \sigma(W_{ix}x_t + W_{im}m_{t-1} + W_{ic}c_{t-1} + b_i) \\

    f_t &= \sigma(W_{fx}x_t + W_{fm}m_{t-1} + W_{fc}c_{t-1} + b_f) \\

    c_t &= f_t \odot c_{t-1} + i_t \odot g(W_{cx}x_t + W_{cm}m_{t-1} + b_c) \\

    o_t &= \sigma(W_{ox}x_t + W_{om}m_{t-1} + W_{oc}c_t + b_o) \\

    m_t &= o_t \odot h(c_t) \\

    y_t &= s(W_{ym}m_t + b_y)

    \end{aligned}$$


    在前述公式中，$W_{ix}$ 是从输入门到输入的权重矩阵，$W_{fx}$ 是从遗忘门到输入的权重矩阵，$W_{ox}$ 是从输出门到输入的权重矩阵。$W_{cx}$
    是从单元到输入的权重矩阵，$W_{cm}$ 是从单元到 LSTM 输出的权重矩阵，$W_{ym}$ 是从输出到 LSTM 输出的权重矩阵。$W_{ic}$、$W_{fc}$
    和 $W_{oc}$ 是窥视孔连接的对角权重矩阵。$b$ 项表示偏置向量，$b_i$ 是输入门偏置向量，$b_f$ 是遗忘门偏置向量，$b_o$ 是输出门偏置向量，$b_c$
    是 CEC 单元偏置向量，$b_y$ 是输出偏置向量。这里，$g$ 和 $h$ 分别是单元输入和单元输出的激活函数。$\sigma$ 表示 sigmoid
    函数，$s(\cdot)$ 表示 softmax 函数。$\odot$ 是向量的逐元素乘积。


    由于仅应用 BPTT 就会变得过于复杂，本书不会继续推导数学方程，但你也可以尝试使用 DL4J 实现 LSTM 以及 RNN。正如 CNN 在图像识别领域发展起来一样，RNN
    和 LSTM 也是为了解决 NLP 中逐一出现的问题而发展的。虽然这两种算法只是利用 NLP 提升性能的一种方法，仍需改进，但由于我们是使用语言交流的生命体，NLP
    的发展必定会带来技术创新。对于 LSTM 的应用，你可以参考 *使用神经网络的序列到序列学习* (Sutskever et al., http://arxiv.org/pdf/1409.3215v3.pdf)，对于更近期的算法，你可以参考
    *网格长短期记忆* (Kalchbrenner et al., http://arxiv.org/pdf/1507.01526v1.pdf) 和 *展示、关注并讲述：带视觉注意力的神经图像字幕生成*
    (Xu et al., http://arxiv.org/pdf/1502.03044v2.pdf)。


    ## 深度学习的困难


    深度学习在图像识别领域已取得超过人类的精度，并已应用于相当多的实际应用中。同样地，在 NLP 领域，已研究出许多模型。那么，在其他领域深度学习被利用的程度如何？令人惊讶的是，成功应用深度学习的领域仍然很少。这是因为与过去的算法相比，深度学习确实具有创新性，确实让我们在实现
    AI 方面迈出了很大一步；然而，在实际应用中使用时存在一些问题。


    第一个问题是深度学习算法中的模型参数太多。当你学习算法的理论和实现时，我们没有详细查看，但实际上与过去的神经网络或其他机器学习算法相比，深度神经网络有许多需要决定的超参数。这意味着我们需要经过更多的试错才能获得高精度。定义神经网络结构的超参数组合，例如设置多少个隐藏层或每个隐藏层应有多少个单元，需要大量实验。此外，训练和测试配置的参数，如学习率，也需要确定。
    furthermore，每个算法特有的参数，如 SDA 中的损坏程度和 CNN 中的核大小，也需要额外的试错。因此，深度学习提供的出色性能得益于稳定的参数调优。然而，人们只看到深度学习的一面——它可以获得很高的精度——而往往忘记了达到这一点所需的艰难过程。深度学习不是魔法。


    此外，深度学习在训练和分类简单问题的数据时常常失败。深度神经网络的结构如此深且复杂，以至于权重无法得到良好优化。在优化方面，数据量也很重要。这意味着深度神经网络每次训练都需要大量时间。综上所述，深度学习在以下情况下体现其价值：


    - 它解决了复杂且困难的问题，而人们不知道其可归类的特征是什么

    - 有足够多的训练数据来正确优化深度神经网络


    与使用不断更新的数据不断更新模型的应用程序相比，一旦使用规模大且变化不大的数据集构建模型，则普遍使用该模型的应用程序更适合深度学习。


    因此，从商业领域来看，可以说使用现有机器学习获得更好结果的情况比使用深度学习更多。例如，假设我们想在电子商务中向用户推荐合适的产品。在这个电商平台中，许多用户每天购买大量产品，因此购买数据每天都会大幅更新。在这种情况下，你是否会使用深度学习来获得高精度的分类和推荐，以利用这些数据提高用户购买的转化率？可能不会，因为使用现有的机器学习算法，如朴素贝叶斯、协同过滤、SVM
    等，从实际角度来看可以获得足够的精度，并且可以更快地更新模型和计算，这通常更受青睐。这就是为什么深度学习在商业领域应用不多的原因。当然，在任何领域获得更高的精度都是更好的，但在现实中，更高的精度和必要的计算时间之间存在权衡关系。虽然深度学习在研究领域很重要，但考虑到实际应用，它还有许多障碍需要克服。


    此外，深度学习算法并不完美，其模型本身仍需要许多改进。例如，正如前面提到的，RNN 只能满足过去信息如何反映到网络中或如何获得精度其中之一，尽管它使用了 LSTM
    等技术。此外，与过去的算法相比，深度学习绝对是一种伟大的技术，但它与真正的 AI 仍相去甚远。算法研究正在积极推进，但与此同时，我们还需要一次突破，才能将深度学习推广并渗透到更广泛的社会中。也许这不仅仅是模型的问题。深度学习之所以突然兴起，是因为它得到了硬件和软件巨大发展的推动。深度学习与周边技术的发展密切相关。

    '
