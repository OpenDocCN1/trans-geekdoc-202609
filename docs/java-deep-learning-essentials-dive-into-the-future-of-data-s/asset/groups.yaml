  - '[PAGE 18]


    Although deep learning is an innovative technique, it is not actually that complicated.
    It is rather surprisingly simple. Reading through this book, you will see how
    brilliant it is. I sincerely hope that this book will contribute to your understanding
    of deep learning and thus to your research and business.


    # ## Transition of AI


    So, why is it now that deep learning is in the spotlight? You might raise this
    question, especially if you are familiar with machine learning, because deep learning
    is not that different to any other machine learning algorithm (don''t worry if
    you don''t know this, as we''ll go through it later in the book). In fact, we
    can say that deep learning is the adaptation of neural networks, one of the algorithms
    of machine learning, which mimics the structure of a human brain. However, what
    deep learning can achieve is much more significant and different to any other
    machine learning algorithm, including neural networks. If you see what processes
    and research deep learning has gone through, you will have a better understanding
    of deep learning itself. So, let''s go through the transition of AI. You can just
    skim through this while sipping your coffee.


    # ## Definition of AI


    All of a sudden, AI has become a hot topic in the world; however, as it turns
    out, actual AI doesn''t exist yet. Of course, research is making progress in creating
    actual AI, but it will take more time to achieve it. Pleased or not, the human
    brain—which could be called "intelligence"—is structured in an extremely complicated
    way and you can''t easily replicate it.


    But wait a moment - we see many advertisements for products with the phrase *by
    AI* or *using AI* all over them. Are they fraudulent? Actually, they are! Surprised?
    You might see words like *recommendation system by AI* or *products driven by
    AI*, but the word AI used here doesn''t indicate the actual meaning of AI. Strictly
    speaking, the word AI is used with a much broader meaning. The research into AI
    and the AI techniques accumulated in the past have achieved only some parts of
    AI, but now people are using the word AI for those parts too.


    Let''s look at a few examples. Roughly divided, there are three different categories
    recognized as AI in general:


    +   - Simple repetitive machine movements that a human programmed beforehand.
    For example, high speed processing industrial robots that only process the same
    set of work.

    +   - Searching or guessing answers to a given assignment following rules set
    by a human. For example, the iRobot Roomba can clean up along the shape of a room
    as it can assume the shape of a room by bumping into obstacles.'
