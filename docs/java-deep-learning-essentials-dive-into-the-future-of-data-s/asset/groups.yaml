    # About the Author


    **Yusuke Sugomori** is a creative technologist with a background in information
    engineering. When he was a graduate school student, he cofounded Gunosy with his
    colleagues, which uses machine learning and web-based data mining to determine
    individual users'' respective interests and provides an optimized selection of
    daily news items based on those interests. This algorithm-based app has gained
    a lot of attention since its release and now has more than 10 million users. The
    company has been listed on the Tokyo Stock Exchange since April 28, 2015.


    In 2013, Sugomori joined Dentsu, the largest advertising company in Japan based
    on nonconsolidated gross profit in 2014, where he carried out a wide variety of
    digital advertising, smartphone app development, and big data analysis. He was
    also featured as one of eight "new generation" creators by the Japanese magazine
    Web Designing.


    In April 2016, he joined a medical start-up as cofounder and CTO.'
  - '[PAGE 5]


    # # About the Reviewers


    **Wei Di** is a data scientist. She is passionate about creating smart and scalable
    analytics and data mining solutions that can impact millions of individuals and
    empower successful businesses.


    Her interests also cover wide areas including artificial intelligence, machine
    learning, and computer vision. She was previously associated with the eBay Human
    Language Technology team and eBay Research Labs, with a focus on image understanding
    for large scale applications and joint learning from both visual and text information.
    Prior to that, she was with Ancestry.com working on large-scale data mining and
    machine learning models in the areas of record linkage, search relevance, and
    ranking. She received her PhD from Purdue University in 2011 with focuses on data
    mining and image classification.


    **Vikram Kalabi** is a data scientist. He is working on a Cognitive System that
    can enable smart plant breeding. His work is primarily in predictive analytics
    and mathematical optimization. He has also worked on large scale data-driven decision
    making systems with a focus on recommender systems. He is excited about data science
    that can help improve farmer''s life and help reduce food scarcity in the world.
    He is a certified data scientist from John Hopkins University.'
