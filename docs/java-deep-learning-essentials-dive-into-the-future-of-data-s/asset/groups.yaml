    # Theories and algorithms of neural networks


    In the previous section, you saw the general flow of when we perform data analysis
    with machine learning. In this section, theories and algorithms of neural networks,
    one of the methods of machine learning, are introduced as a preparation toward
    deep learning.


    Although we simply say "neural networks", their history is long. The first published
    algorithm of neural networks was called perceptron, and the paper released in
    1957 by Frank Rosenblatt was named The Perceptron: A Perceiving and Recognizing
    Automaton (Project Para). From then on, many methods were researched, developed,
    and released, and now neural networks are one of the elements of deep learning.
    Although we simply say "neural networks," there are various types and we''ll look
    at the representative methods in order now.


    # Perceptrons (single-layer neural networks)


    The perceptron algorithm is the model that has the simplest structure in the algorithms
    of neural networks and it can perform linear classification for two classes. We
    can say that it''s the prototype of neural networks. It is the algorithm that
    models human neurons in the simplest way.'
