    \ 设置为相同的数值。这意味着学习过程不会将数据拆分成小批次。`splitTrainNum` 是决定训练数据与测试数据分配的变量。这里，整个数据集的 80%\
    \ 作为训练数据，20% 作为测试数据。在上一节中，`listenerFreq` 决定我们多久在过程中查看损失函数值的日志记录。此处的值设置为 1，这意味着每个\
    \ epoch 后会记录一次该值。\n\n接下来，我们需要获取数据集。在 DL4J 中，已经准备好了一个类，可以方便地获取典型数据集（如 Iris、MNIST\
