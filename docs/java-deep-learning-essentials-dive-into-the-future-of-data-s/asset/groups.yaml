    functions they could express and approximate.


    # # Summary


    In this chapter, as preparation for deep learning, we dug into neural networks,
    which are one of the algorithms of machine learning. You learned about three representative
    algorithms of single-layer neural networks: perceptrons, logistic regression,
    and multi-class logistic regression. We see that single-layer neural networks
    can''t solve nonlinear problems, but this problem can be solved with multi-layer
    neural networks—the networks with a hidden layer(s) between the input layer and
    output layer. An intuitive understanding of why MLPs can solve nonlinear problems
    says that the networks can learn more complicated logical operations by adding
    layers and increasing the number of units, and thus having the ability to express
    more complicated functions. The key to letting the model have this ability is
    the backpropagation algorithm. By backpropagating the error of the output to the
    whole network, the model is updated and adjusted to fit in the training data with
    each iteration, and finally optimized to approximate the function for the data.


    In the next chapter, you''ll learn the concepts and algorithms of deep learning.
    Since you''ve now acquired a foundational understanding of machine learning algorithms,
    you''ll have no difficulty learning about deep learning.'
  - '[PAGE 83]


    # 3

    Deep Belief Nets and

    Stacked Denoising

    Autoencoders


    From this chapter through to the next chapter, you are going to learn the algorithms
    of deep learning. We''ll follow the fundamental math theories step by step to
    fully understand each algorithm. Once you acquire the fundamental concepts and
    theories of deep learning, you can easily apply them to practical applications.


    In this chapter, the topics you will learn about are:


    +   - Reasons why deep learning could be a breakthrough

    +   - The differences between deep learning and past machine learning (neural
    networks)

    +   - Theories and implementations of the typical algorithms of deep learning,
    **deep belief nets (DBN)**, and **Stacked Denoising Autoencoders (SDA)**


    # Neural networks fall


    In the previous chapter, you learned about the typical algorithm of neural networks
    and saw that nonlinear classification problems cannot be solved with perceptrons
    but can be solved by making multi-layer modeled neural networks. In other words,
    nonlinear problems can be learned and solved by inserting a hidden layer between
    the input and output layer. There is nothing else to it; but by increasing the
    number of neurons in a layer, the neural networks can express more patterns as
    a whole. If we ignore the time cost or an over-fitting problem, theoretically,
    neural networks can approximate any function.'
  - '[PAGE 84]


    So, can we think this way? If we increase the number of hidden layers—accumulate
    hidden layers over and over—can neural networks solve any complicated problem?
    It''s quite natural to come up with this idea. And, as a matter of course, this
    idea has already been examined. However, as it turns out, this trial didn''t work
    well. Just accumulating layers didn''t make neural networks solve the world''s
    problems. On the contrary, some cases have less accuracy when predicting than
    others with fewer layers.


    Why do these cases happen? It''s not wrong for neural networks with more layers
    to have more expression. So, where is the problem? Well, it is caused because
    of the feature that learning algorithms have in feed-forward networks. As we saw
    in the previous chapter, the backpropagation algorithm is used to propagate the
    learning error into the whole network efficiently with the multi-layer neural
    networks. In this algorithm, an error is reversed in each layer of the neural
    network and is conveyed to the input layer one by one in order. By backpropagating
    the error at the output layer to the input layer, the weight of the network is
    adjusted at each layer in order and the whole weight of a network is optimized.


    This is where the problem occurs. If the number of layers of a network is small,
    an error backpropagating from an output layer can contribute to adjusting the
    weights of each layer well. However, once the number of layers increases, an error
    gradually disappears every time it backpropagates layers, and doesn''t adjust
    the weight of the network. At a layer near the input layer, an error is not fed
    back at all.


    The neural networks where the link among layers is dense have an inability to
    adjust weights. Hence, the weight of the whole of the networks cannot be optimized
    and, as a matter of course, the learning cannot go well. This serious problem
    is known as the **vanishing gradient problem** and has troubled researchers as
    a huge problem that the neural network had for a long time until deep learning
    showed up. The neural network algorithm reached a limit at an early stage.


    # Neural networks'' revenge


    Because of the vanishing gradient problem, neural networks lost their popularity
    in the field of machine learning. We can say that the number of cases used for
    data mining in the real world by neural networks was remarkably small compared
    to other typical algorithms such as logistic regression and SVM.'
