    随后，按顺序地，Karpov 等人 [15] 执行了基于 transformer 的合成方法并取得了更好的性能。为了解决序列到序列映射中的数学无效输出问题，Zhang
    和 cokers [22] 使用了一种名为 SCROP 的 Transformer 模型主要校正器。此外，研究者提出了多种基于图神经网络的图架构，同事们 [21]
    通过将目标分子图转换为一组架构，提出了一种基于 transformer 的框架 (G2G 到 G2P)。Tu 等人 [22] 生成了 Graph2MPLES，这是一种用于将分子图转换为
    SMILES 的 transformer 和解码器，确保了在不需要输入数据增强的情况下实现排列不变性。为了应对解释深度学习模型的挑战，这些作者将逆合成表述为一种分子过程，实现了定量的可解释性逆合成。


    逆合成中使用的某些无模板模型和技术在各种化学任务中具有市场价值，能够对分子进行高效的逆合成和代谢预测，以及对天然产进行全面的逆合成分析和酶催化产物预测。这些结果突显了我们通用框架的优越性，证明了其全面预测化学反应的能力。该模型已部署并在服务器
    http://hpc.cn/222469 上访问。BCNet 的代码可用 https://github.com/wjjc/BCNet


    用于训练和评估模型的数据来源于公共数据集 USPTO5K，包含 50,016 个分子和跨 10 种反应类型的 10 反应。模型在 USPTO 数据集上进行训练，该数据集包含
    479,033 条反应条目、主反应、副反应和失败反应，共 1,808,938 条反应，通过去重和规范化产生了 10,486 个唯一反应用于预测。使用相同的数据对模型进行评估，其中反应任务随机划分为训练/验证/测试集（80/10/10%）用于训练和评估。


    深度学习用于预测酶介导的化学反应 [26, 2067]。利用酶进行有机合成以创建利用生物反应的选择性合成路线仍处于发展阶段。Kreuter 等人 [23]
    使用卷积神经网络学习分子 transformer 以预测酶促反应。同样，Probit 等人 [30] 使用 Molecular Transformer 扩展了数据驱动的方法，以预测酶催化反应和代谢模型。另一种酶催化反应预测方法侧重于药物代谢
    [31]。代谢过程涉及由酶（如细胞色素 P450）介导的化学反应。研究人员已通过整合开发中的代谢研究开发了预测药物代谢的深度学习模型 [33–35]。Wang
    等人 [36] 建立了一个预测代谢反应类型和位点的模型。Li 等人 [37] 提出了一种基于规则的学习方法来预测小分子（包括药物）的代谢产物。我们的工作专注于开发支持特定应用的学习模型，重点构建无偏框架。所有化学反应预测的核心是原子间化学键的断裂和形成。BART
    [38] 使用 Transformer 任务学习化学反应规则，并构建了双向化学整合网络 (BCNet) 框架来预测药物代谢。其性能使用公共数据集 USPTO5K
    进行评估，包含 50,016 个任务，执行正向和反向催化的准确率分别为 80.7% 和 48.6%。该框架用于预测各种反应，包括有机酶催化反应和药物代谢。


    代谢数据集用于微调模型（版本 5.12）。在将多个产物生成拆分反应后（每个反应包含单个分子和产物），删除了 3,417 个有效反应中的重复和无效的 SMILES
    表示。为了研究代谢反应，排除了反应，剩余 3,380 个有效反应。该数据集被随机分为训练、验证和测试集（80/10/10%）。此外，为了解决代谢中预测与真实药物过程激活之间的差异，使用了一个化学组合数据集药物预测和代谢数据集来微调模型。


    酶催化数据集用于微调来自 SCERAFT 的模型，由 Probit 等人 [30] 开发。该数据集包含 62,222 种酶，根据相应分配了不同的反应类型代码。例如，“EC7.24.1”对应“E1.2,
    E2.7, E3.8, E4.1”，其中第一个数字代表类别与底物之间的氢键数量，后续数字根据酶国际分类。


    代谢产物被分为 "" 生成的反应和产物。


    BART 主干包含 12 层编码器层和 12 层注意力解码器层，每层有 768 个隐藏单元。BCNet 编码器每次预测一个原子，BCNet 解码器根据预测状态每次生成一个标记。模型生成反应图并输出预测/产物
    SMILES。


    使用了两个指标：精确匹配（exact match）和最大片段准确率（MaxFrag accuracies）来评估模型。精确匹配率通过将预测反应与数据集中的真值进行比较计算得出。为了评估预测极限，使用
    MaxFrag 准确率来计算仅最后一个片段的精确匹配。


    引入了四个泛化训练任务以降低过拟合风险并提高模型的泛化能力：


