    Data used to train and evaluate the model were sourced from the public dataset
    USPTO5K, with 50,016 molecules and 10 reactions across 10 reaction types. The
    model was trained on the USPTO dataset, which contains 479,033 reaction entries,
    main reactions, side reactions, and failed reactions, including 1808,938 reactions,
    produced through deduplication and canonization, resulting in 10,486 unique reactions
    used for prediction. The model was evaluated using the same dataset, where reaction
    tasks were randomly split into training/validation/test sets (80/10/10%) for training
    and evaluation.


    Deep learning is employed in predicting enzyme-mediated chemical reactions [26,
    2067]. The uses of enzymes for organic synthesis to create selective synthetic
    routes that utilize biological reactions are still in the early stages of development.
    Kreuter et al. [23] used a convolutional neural network to learn the molecular
    transformer for predicting enzymatic reactions. Similarly, Probit et al. [30]
    extended the data-driven approach with Molecular Transformer to predict enzyme-catalyzed
    reactions and metabolism models. Another approach of enzyme-catalyzed reaction
    prediction focuses on drug metabolism [31]. Metabolic processes involve chemical
    reactions mediated by enzymes, such as cytochrome P450. Multiple efforts have
    been made to develop deep learning models for predicting drug metabolism through
    the integration of metabolic studies in development [33–35]. Wang et al. [36]
    established a model for predicting the metabolic reaction type and site. Li et
    al. [37] presented a rule-based end-to-learning method for predicting predicting
    metabolites of small molecules, including drugs. Our work focuses on developing
    learning models that support specific applications, with emphasis on building
    unbiased frameworks, the core of all chemical reaction predictions is the breakage
    and formation of chemical bonds between atoms. BART [38] used Transformer tasks
    for learning chemical reaction rules and built a Bidirectional Chemical Integration
    Network (BCNet) framework to predict drug metabolism. Its performance was evaluated
    using the public dataset USPTO5K, with 50,016 tasks, performing one-forward and
    backward catalysis with accuracies of 80.7% and 48.6%, respectively. This framework
    was applied to predict various reactions, including organic enzyme-catalyzed reactions
    and drug metabolism.


    The metabolism dataset was used for fine-tuning the model (version 5.12). After
    generating multiple products into split reactions, each containing a single molecule
    and product, 3417 valid reactions had duplicates and invalid SMILES representations
    removed. For studying metabolic reactions, reactions were excluded, 3380 valido
    reactions. This dataset was randomly divided into training, validation, and test
    sets (80/10/10%), respectively. In addition, the difference between prediction
    and real drug process activation in metabolism and metabolism, a chem combined
    dataset drug predicting and metabolism dataset was used to fine-tune the model.


    The enzyme-catalyzed dataset was used for fine-tuning the model from SCERAFT,
    developed by Probit et al. [30]. Containing 62,222 enzymes, coding for different
    reaction types was assigned accordingly. For example, “EC7.24.1” is “E1.2, E2.7,
    E3.8, E.4.1” where the first number represents the number of hydrogen bonds between
    categories and substrates, and the subsequent numbers are according to the International
    Classification of Enzymes.


