    S2）。对于正向预测，反应物和产物的影响如图 2 所示。反应物与产物之间的连接使用编码器/解码器层中的注意力机制可视化。由于所有预测的概率分布是基于注意力层和输出层的当前转换计算的，我们通过仅考虑注意力权重分析了模型的最后部分。这些结果表明，为了澄清反应中的语法规则，我们从数据集中筛选了类代谢反应以供所提模型进行预测。表
