    为了验证所提方法的应用，我们将我们的单步模型扩展到全路径，分别预测包括下一代抗炎药物在内的化合物的有机反应。在方案 1a 中，吲美酸的预测结果与之前发表的文献一致。唯一的区别是我们的模型关注的是官能团，图中显示了该官能团。在布洛芬的多步逆合成分析中，模型的预测结果与文献中的结果完全一致。在两步中，反应是亲核取代和随后的消除反应，而所提模型为这些类型预测了合理的顺序。值得注意的是，模型正确地将亲核取代分为两步，其中官能团被正确地用作取代基。对阿托伐他汀进行了正向和反向预测评估。同样，预测结果与图
    1 所示的类别一致。有趣的是，模型对正向和反向模式的响应更为准确，表明这些反应揭示了反应物和产物之间的微小变化。然而，对于涉及巨大结构变化的杂原子烷基化和环形成，模型的预测准确率下降了。此外，还评估了预测值与真实值之间的相似性（支持信息中的
