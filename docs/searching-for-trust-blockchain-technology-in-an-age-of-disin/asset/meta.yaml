  - 2.4 什么是信任？
- - '###'
  - 不同观点之间的信任。
- - '####'
  - 一种被广泛依赖的信任理解是 Hardin (2002) 将信任视为“封装的利益”的概念。因此，它为深入探索关于信任含义的各种辩论提供了一个起点，包括我在本书中关注的社会信任概念。Hardin
    信任概念化的一个关键特征是它是关系性的。尽管对信任有多种概念化，学者们倾向于同意一点：信任涉及产生信任的人（信任方，或委托人）与被信任的人或物（被信任方，或受托人）之间的关系(Castaldo
    et al., 2010)。
