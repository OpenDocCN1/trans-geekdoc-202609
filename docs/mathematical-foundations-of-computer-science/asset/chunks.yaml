  trans: "\n\n```html\n<li><span>1966</span><a   href=\"/perlis\">Perlis, Alan J</a></li>\n\
    <li><span>1967</span><a   href=\"/wilkes\">Wilkes, Maurice V</a></li>\n<li><span>1968</span><a\
    \   href=\"/hamming\">Hamming, Richard W</a></li>\n<li><span>1968</span><a   href=\"\
    /minsky\">Minsky, Marvin L</a></li>\n...\n```\n\n你使用你选择的语言编写了爬取该网页的代码，现在你的任务是从这个\
    \ HTML 中提取出姓名。虽然使用字符串处理来获取每个姓名是一个很好的解决问题练习，但解决此问题的更好方法是使用一种称为正则表达式的工具。只需观察到上述每一行都符合\
    \ `< li > < span > YEAR < /span > < a href=\"URL\" > NAME < /a > < /li >` 的形式，其中\
    \ `YEAR` 是他们获奖的年份，`URL` 是其页面的 URL（统一资源定位符），而 `NAME` 是获奖者的姓名，你就可以用几行代码轻松获取所有姓名。你将在本章稍后的部分看到如何这样做。\n\
    \n## 5.3 正则表达式操作\n\n正则表达式的三种操作是并（`+`）、连接（`⋅`）和克莱尼星（`^*(\\`）。并运算与集合的并运算相同。\n\n\
    连接操作允许将两个正则表达式连接在一起，表示一个字符串集合，该集合由第一个表达式中的字符串后第二个表达式中的字符串组成。\n\n最后，对正则表达式进行克莱尼星操作会生成一个由该正则表达式的零或多个字符串组成的字符串集。\n\
    \n值得注意的是上述三种操作的优先级。克莱尼星操作的优先级最高，因为它适用于其之前构成有效正则表达式的最短字符序列。连接操作的优先级次之，并运算最后。始终可以添加括号来对表达式进行分组。\n\
    \n你可能已经注意到，在上面的所有示例中，表达式都被说表示该集合。这是一个重要的区别——正则表达式的类型不是集合，而是表示集合的它自己的类型。更具体地说，我们将使用符号\
    \ `L(r*)` 来表示正则表达式 `r` 的语言。\n\n为了方便起见，我们允许在正则表达式中使用字符串的简写符号。注意，指数必须始终是一个固定的整数——我们不允许在指数中使用变量。\n\
    \n## 5.4 正则表达式的正式定义\n\n正则表达式的递归定义如下。\n\n我们可以使用这些规则构建相当复杂的表达式，如接下来所示。\n\n## 5.5 应用\n\
    \n许多编程语言都支持正则表达式，因为你可以使用它们搜索大量文本，以找到格式类似于电话号码或地址的子字符串。一些高级文本编辑器也允许你使用正则表达式进行搜索。\n\
    \n在学习 Linux 命令行时，正则表达式是无价的。例如，假设你想搜索文件夹中所有以字母 a 开头的文件。你可以在终端中输入 `ls a\\*` 来实现。这会调用\
    \ Linux 的列表命令 `ls` 并指定只显示开头为 a 的文件。在这里，`*` 符号对应于正则表达式 `Σ^(*)`，因此任何字符串（包括空字符串）都可以匹配文件名的结尾。同样，如果你想找到所有以\
    \ a 开头并以 `.txt` 结尾的文件，你将使用以下命令 `ls a*.txt`。如果你想找到包含字符串 `L` 的所有文件，可以使用此命令：`ls L*`。\n\
    \n你还有能力使用符号 `?` 匹配单个字符。例如，为了匹配所有以 `FILE` 开头后跟单个字符的文件名，你可以使用 `ls FILE?`；如果你想找到所有三个字符的文件，将使用\
    \ `ls ???`。\n\n## 5.6 Python 中的正则表达式\n\nPython 有一个名为 `re` 的包。下表包含了 Python 中正则表达式的一些特殊语法。\n\
    \n| 语法 | 含义 | 示例 | 单词 |\n| :--- | :--- | :--- | :--- |\n| `[]` | 字符集 | `[a-zA-Z]`\
    \ | 字母 a 到 z 和 A 到 Z |\n| `*` | 零或多次出现 | `[a-z]*` | 从 a 到 z 的零或多个字母 |\n| `+` |\
    \ 一次或多次出现 | `[a-z]+` | 从 a 到 z 的一个或多个字母 |\n| `{}` | 精确次数 | `[a-z]{3}` | 从 a 到\
    \ z 的三个三个字母 |\n| `\\d` | 数字 (0-9) | `\\d{3}` | 正好有 3 位数字的数字 |\n| `\\w` | 字符 a-z,\
    \ A-Z, 0-9, _ | `\\w+` | 来自 a-z, A-Z, 0-9, _ 的一个或多个字符 |\n\n我们现在可以使用此来查看如何从之前的\
    \ HTML 示例中提取我们想要的信息。\n\n## 5.7 章节总结与核心概念\n\n*   正则表达式有三种操作：并（`+`）、连接（`⋅`）和克莱尼星（`*`）。\n\
    *   正则表达式由这些规则正式定义：\n    *   空集 `∅` 是一个正则表达式。\n    *   空字符串 `λ` 是一个正则表达式。\n  \
    \  *   对于任何 `s ∈ Σ*`，`s` 是一个正则表达式。\n    *   对于任何正则表达式 `r1` 和 `r2`，`r1 + r2` 是一个正则表达式。\n\
    \    *   对于任何正则表达式 `r1` 和 `r2`，`r1 ⋅ r2` 是一个正则表达式。\n    *   对于任何正则表达式 `r1`，`(r1*)`\
    \ 是一个正则表达式。\n*   正则表达式用于某些文本编辑器和 Linux 命令行中。\n*   正则表达式可以在 Python 等编程语言中计算。\n\n\
    ## 练习题\n\n按短字典序（short-lex order）列出以下语言中长度为 4 的字符串（参见第 1.10 节）：\n\n*   5.1 `00(0+1)*`\n\
    *   5.2 `0(0+1)*0`\n*   5.3 `(0+1)*0(0+1)*1(0+1)*`\n*   5.4 `(0+1)²(0+1)`\n* \
    \  5.5 `(1+00)*`\n\n为以下语言给出正则表达式：\n\n*   5.6 基于 `{0,1}` 的所有字符串\n    $$\\begin{array}{l}\
    \ {\\Sigma = \\{a,b\\}} \\end{array}$$\n*   5.7 以 `b` 开头\n*   5.8 以 `ab` 结尾\n\
    *   5.9 包含至少一个 `a`\n*   5.10 包含子字符串 `aab`\n*   5.11 按顺序包含字符 `a, a, b`，但不一定相邻\n\
    *   5.12 第四个个符号是 `a`\n*   5.13 倒数第四个符号是 `b`\n*   5.14 长度能被 3 整除的字符串\n*   5.15\
    \ 恰好一个 `a`\n*   5.16 恰好两个 `b`\n*   5.17 最多两个 `b`\n*   5.18 包含至少一个 `a` 和一个 `b`（任意顺序）\n\
    *   5.19 偶数个数 `a` 和任意数量的 `b`\n*   5.20 不包含子字符串 `aa`\n*   5.21 不以 `ab` 结尾\n   \
    \ $$\\begin{array}{l} {\\Sigma = \\{ a - z,0 - 9,\\text{_}\\}} \\end{array}$$\n\
    *   5.22 有效变量名（不能以数字开头，忽略关键字）\n*   5.23 有效密码（至少一个字母和一个数字）\n    $$\\begin{array}{l}\
    \ {\\Sigma = \\{ 0 - 9, - \\}} \\end{array}$$\n*   5.24 有效整数（无前导零，但可以是负数）\n* \
    \  5.25 格式为 555-555-5555 的电话号码\n\n编写 Python 代码搜索字符串中的以下模式：\n\n*   5.26 格式为 `(555)-555-5555`\
    \ 的电话号码\n*   5.27 格式为 `MM-DD-YYYY` 的日期（不需要检查日期或月份有效）\n*   5.28 格式为 `[username@domain.com]`\
    \ 的邮箱地址，可以包含符号 a-z, A-Z, 0-9 和最多一个点。\n*   5.29 可能有多个点的邮箱地址（例如 `[username@domain.co.uk]`）。\n\
    \n"
- fmt: "\nIn this section we will see that the languages accepted by DFAs and NFAs\
    \ are exactly the same as the languages of regular expressions. This means that\
    \ we can use these two ideas interchangeably. Moreover, we will prove the equivalence\
    \ constructively, which means that we will have a way to design a regular expression\
    \ from any DFA and vice versa.\n\n## 6.2 Converting a Regular Expression to a\
    \ $\\lambda$-NFA\n\nWe will first see a procedure for converting any regular expression\
    \ to a $\\lambda$-NFA. This $\\lambda$-NFA can then be converted to a DFA using\
    \ the subset construction technique from [Chapter 4](#chapter4.xhtml). Recall\
    \ from [Section 5.4](#chapter5.xhtml#sec5_4) that regular expressions are defined\
    \ recursively using the following rules:\n\n1. The empty set has the regular expression\
    \ `∅`.\n2. The set `{λ}` has the regular expression `λ`。\n3. For each symbol `s`\
    \ ∈ `Σ`, the set `{s}` has the regular expression `s`.\n4. For any regular expressions\
    \ `r[1]` and `r[2]`, the set `L(r[1])` ∪ `L(r[2])` has the regular expression\
    \ `r[1] + r[2]`。\n5. For any regular expressions `r[1]` and `r[2]`, the set `{s[1]\
    \ ⋅ s[2] : s[1] ∈ L(r[1]) ∧ s[2] ∈ L(r[2])}` has the regular expression `r[1]\
    \ ⋅ r[2]`。\n6. For any regular expression `r[1]`, the set `{s[1]…s[n] : n ≥ 0\
    \ ∧ s[1], …, s[n] ∈ L(r[1])}` has the regular expression `(r[1])^(\\*)`。\n\nThe\
    \ $\\lambda$-NFAs for the languages `∅`, `{λ}`, and `{a}` for any `a` ∈ `Σ` are\
    \ given in [Figures 6.1a](#chapter6.xhtml#fig6_1), [6.1b](#chapter6.xhtml#fig6_1),\
    \ and [6.1c](#chapter6.xhtml#fig6_1). Using these as our starting point, we see\
    \ how to construct expressions that involve unions, concatenation, and Kleene\
    \ \\*.\n\n![Figure 6.1 λ-NFAs for simple regular expressions](images/fig6_1.jpg)\n\
    \n[Figure 6.1](#chapter6.xhtml#b6fig6_1) $\\lambda$-NFAs for simple regular expressions\n\
    \nWe can construct a $\\lambda$-NFA for the union of two languages for which we\
    \ have $\\lambda$-NFAs by using $\\lambda$-transitions from a new start state\
    \ to the start states of the two $\\lambda$-NFAs. [Figure 6.2](#chapter6.xhtml#fig6_2)\
    \ shows a scheme for how you can do this for any pair of $\\lambda$-NFAs.\n\n\
    ![Figure 6.2 A λ-NFA for the union of the languages of two λ-NFAs](images/fig6_2.jpg)\n\
    \n[Figure 6.2](#chapter6.xhtml#b6fig6_2) A $\\lambda$-NFA for the union of the\
    \ languages of two $\\lambda$-NFAs\n\nWe can concatenate the language of two $\\\
    lambda$-NFAs by adding $\\lambda$-transitions from each of the accepting states\
    \ of the first $\\lambda$-NFA (and making them non-accepting) to the start state\
    \ of the second $\\lambda$-NFA. This is illustrated in the scheme shown in [Figure\
    \ 6.3](#chapter6.xhtml#fig6_3).\n\n![Figure 6.3 A λ-NFA for the concatenation\
    \ of the languages of two λ-NFAs](images/fig6_3.jpg)\n\n[Figure 6.3](#chapter6.xhtml#b6fig6_3)\
    \ A $\\lambda$-NFA for the concatenation of the languages of two $\\lambda$-NFAs\n\
    \nLastly, we can take the Kleene \\* of the language of any $\\lambda$-NFA by\
    \ using the scheme in [Figure 6.4](#chapter6.xhtml#fig6_4). We create a new start\
    \ state (labeled `q[0]'` in the figure), make it accepting, and then add a $\\\
    lambda$-transition to the start state of the original $\\lambda$-NFA. We then\
    \ add $\\lambda$-transitions from each accepting state back to the start state\
    \ `q[0]'`.\n\n![Figure 6.4 A λ-NFA for the Kleene \\* of the language of a λ-NFA](images/fig6_4.jpg)\n\
    \n[Figure 6.4](#chapter6.xhtml#b6fig6_4) A $\\lambda$-NFA for the Kleene \\* of\
    \ the language of a $\\lambda$-NFA\n\nWe can create an NFA for any regular expression\
    \ by repeating these three procedures as needed.\n\n## 6.3 Converting a Dfa to\
    \ a Regular Expression\n\nWe can convert DFAs to regular expressions using a state\
    \ elimination algorithm. This is useful in of itself because there are some regular\
    \ languages for which it is easy to define a DFA, but hard to come up with a regular\
    \ expression. This algorithm then can be used to extract a regular expression\
    \ from a DFA. Before formally defining the algorithm, let us see a few examples.\n\
    \nNow, it will not always be the case that the starting state is the only accepting.\
    \ In these situations, we must eliminate states down to the start state and each\
    \ accepting state. We can now generalize the above two examples. If we have eliminated\
    \ down to the start state and it is an accepting state with self-loop with expression\
    \ `R`, then the regular expression for the original DFA was `(R)^(\\*)`. If there\
    \ is a non-starting accepting state, then we eliminate down to the start state\
    \ and the accepting state as in [Figure 6.5](#chapter6.xhtml#fig_5) and the final\
    \ regular expression will be `(R+S^(\\*)T)^(\\*)S^(\\*)`.\n\n![Figure 6.5 General\
    \ form for when the accepting state is not the start state](images/fig_5.jpg)\n\
    \n[Figure 6.5](#chapter6.xhtml#b6fig6_5) General form for when the accepting state\
    \ is not the start state\n\nWe are now ready to see the full algorithm for state\
    \ elimination (`Algorithm 6.1`)). Note that if `q[0]` is an accepting state, we\
    \ also eliminate down to just `q[0]` by itself. Let us see one more example with\
    \ multiple accepting states. We will see how the State Elimination algorithm works\
    \ on DFA in [Figure 6.6](#chapter6.xhtml#fig_6).\n\n![Figure 6.6 Example DFA for\
    \ State Elimination algorithm](images/fig_6.jpg)\n\n[Figure 6.6](#chapter6.xhtml#b6fig6_6)\
    \ Example DFA for State Elimination algorithm\n\nFinally, to get the set of strings\
    \ that can reach any of the accepting states `{q[0], q[1], q[3]}`, we union the\
    \ expressions from [Examples 6.6](#chapter6.xhtml#exam_6), [6.7](#chapter6.xhtml#exam_7),\
    \ and [6.8](#chapter6.xhtml#exam_8), to get the expression\n\n$$\\begin{array}{ll}\
    \ {(00 + 11^{\\ast}0 + (01 + 11^{\\ast}0)1^{\\ast}0)^{\\ast}(01 + 11^{\\ast}0)1^{\\\
    ast}} & {+} \\\\ {(00 + 11^{\\ast}0}(00 + 01^{\\ast}0))^{\\ast}1^{\\ast}} & {+}\
    \ \\\\ {(00 + 11^{\\ast}0}(00 + 01^{\\ast}0))^{\\ast}.} & \\\\\\\\ \\end{array}$$\
    \   \n\nWhile this formula is long and complicated, you can verify that it correctly\
    \ captures the strings that get to each state. Here, `q[0]` is reachable by strings\
    \ that have an even number of 0s and don't end in 1, `q[1]` is reachable by strings\
    \ with an even number of 0s and do end in 1, and `q[3]` is reachable by strings\
    \ that have an odd number of 0s and do end in 1.\n\n## 6.4 Another Definition\
    \ for Regular Languages\n\nNow that we have established that the language of every\
    \ finite automaton has a regular expression and vice versa, we can expand our\
    \ definition of regular languages even further.\n\n## 6.5 Chapter Summary and\
    \ Key Concepts\n\n* There is a procedure for converting any regular expression\
    \ into a $\\lambda$-NFA.\n* Any DFA can be converted to a regular expression using\
    \ the **State Elimination** algorithm.\n* A **regular language** is one that has\
    \ a DFA, NFA, or regular expression.\n\n## EXERCISES\n\nGive $\\lambda$-NFAs `using\
    \ the algorithm in this chapter` for regular expressions below:\n\n* 6.1 `a*b*(a+b*)`\n\
    * 6.2 `(a+b*a*)^(\\*)`\n* 6.3 `a*b* + (*a*b*)^(\\*)`\n* 6.4 `(a+b*)^(\\*)(a*b*)(a+b*)^(\\\
    *)`\n* 6.5 `(a+b*b*)^(\\*) + (*b*+a*a*)^(\\*)`\n* 6.6 `(000)^(\\*)`\n* 6.7 `00(0+1)^(\\\
    *)00`\n* 6.8 `0(0+1)^(\\*)0+1(0+1)^(\\*)1`\n* 6.9 `(0+1)^(\\*)0(0+1)²`\n* 6.10\
    \ `001^(\\*)00 + 110^(\\*)11 + (01)^(\\*)(0+1)^(\\*)`\n\nConstruct DFAs for the\
    \ following languages and `use the state elimination algorithm in this chapter`\
    \ to create a regular expression for each. Show the intermediate steps as you\
    \ eliminate each state along the way.\n\n* 6.11 `w ∈ {0,1}^(\\*) : w is of length`\n\
    * 6.12 `w ∈ {0,1}^(\\*) : w has an odd number of 1s`\n* 6.13 `w ∈ {0,1}^(\\*)\
    \ : w has at least two 1s`\n* 6.14 `w ∈ {0,1}^(\\*) : w has at most three 0s`\n\
    * 6.15 `w ∈ {0,1}^(\\*) : the number of 0s in w is divisible by 3`\n* 6.16 `w\
    \ ∈ {0,1}^(\\*) : w does not have 01 as a substring`\n* 6.17 `w ∈ {0,1}^(\\*)\
    \ : w has an even number of 0s and an odd number of 1s`\n* 6.18 `w ∈ {0,1}^(\\\
    *) : w has an even number of 0s and an even number of 1s`\n"
