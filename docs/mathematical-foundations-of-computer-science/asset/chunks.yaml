    # 第 1 章：数学数据类型


    DOI: [10.1201/9781003383284-1](https://doi.org/10.1201/9781003383284-1)


    ## 1.1 为什么你应该关注


    在本章中，你将学习贯穿全本书用到的基础数学对象。你可以将其类比为学习编程语言中的原始数据类型（例如 `int` 或 `float`）。为了能够理解更复杂的概念，很好地理解这些基础至关重要。


    ## 1.2 集合


    你可以将集合想象成一个装有一组对象的盒子。例如，下面是一个包含数字 1、2 和 3 的集合实例。这个集合用记法 `{1, 2, 3}` 表示。


    关于集合的概念，有几点重要的需要注意。首先，集合中没有重复的对象。如果一个对象重复出现，它只被计数一次。特别是，下面示例中的两个集合是相同的，因为 3 在集合中出现几次并不重要。


    其次，集合的顺序是不值钱的。集合 `{1, 2, 3}` 和 `{2, 1, 3}` 是同一个集合。这与 Python 等编程语言中的列表（list）概念非常不同，在
    Python 中，`[1,2,3]` 和 `[2,1,3]` 是不同的列表。


    集合可以包含各种类型的对象，而不只是数字。


    我们现在准备好学习第一个定义了：


    ## 1.3 集合术语


    作为计算机科学家，需要了解许多围绕集合的术语。学习这些简单的方法是看大量的例子。


    集合中的任何对象被称为该集合的 `element`（元素）或 `member`（成员）。


    我们说不在集合中的对象不是元素。


    如果集合 `A` 的所有元素都是另一个集合 `B` 的元素，我们说第一个集合`包含`在第二个集合中，或者说 `A` 是 `B` 的 `subset`（子集），写作
    `A ⊆ B`。


    这是一个特殊情况：任何集合都是是自身的子集。


    一个特殊的集合被称为 `empty set`（空集），记作 `∅`，它是没有任何元素的集合。空集是所有集合的子集，包括它自己。


    如果一个集合是另一个集合的子集，且不包含后者所有的元素，那么该集合是后者的 `proper subset`（真子集）。


    如果两个集合具有完全相同的元素，它们就是 `equal`（相等的）。另一种定义是：两个集合互互为子集。


    集合的 `cardinality`（基数）是它包含的不同项目的数量。集合的基数用在集合两侧的竖线表示。


    如果一个集合的大小或基数是一个有限整数，则该集合被称为 `finite`（有限的）。


    如果一个集合中的元素数量是无限的，则该集合被称为 `infinite`（无限的）。


    有一些无限集合有特殊的符号来表示。自然数集 `ℕ` 定义为：


    整数集 `ℤ` 定义如下：


    所有实数的集合记作 `ℝ`。


    ## 1.4 集合构造表示法


    当我们表示集合（特别是无限集合）时，使用 `set-builder notation`（集合构造表示法）是非常用的。在这种表示法中，集合的形式为 `{expression:
    constraints}`，其中表达式是在插入集合之前，根据给定的约束对所有可能的值执行的操作。


    你可以将其想象为一个 `for loop`（for 循环），它遍历所有符合冒号右侧条件的值（例如自然数 0, 1, 2, 3, 4），并将这些值插入集合中。


    冒号左侧的表达式是可以应用于正在迭代的值的操作。在上面的示例中，该操作对每个值什么都没做。在接接的示例中，我们将该值翻了一倍。


    集合构造表示法也可以用于具有无限元素的集合，尽管构建它的 `for loop` 永远不会结束。


    我们也可以使用集合构造表示法用纯英语描述集合，如下所示：


    ## 1.5 并集、交集、差集、补集


    集合上存在许多标准操作。集合的 `union`（并集）是至少于一个集合中的元素集合。


    集合的 `intersection`（交集）是所有集合中元素的集合。


    集合的 `difference`（差集）是第一个集合中但不在第二个集合中的元素。集合 `A` 和 `B` 的差集写作 `A \ B`。


    在某些情况下，集合被定义为全集，记作 `U`。集合 `A` 的 `complement`（补集）是 `U` 中不在 `A` 中的集合。


    ## 1.6 恩图


    可视化集合操作的一种方法是画 `Venn diagrams`（恩图）。这些图展示了一个或多个集合之间的操作。我们甚至可以视觉化涉及三个集合的集合操作。这些恩图有时可以用于演示不同表达式之间的关系。例如，德·摩根规定
    `∪B = A''∩B''` 和 `A∩B = A''∪B''`。


    ## 1.7 幂集


    有时引用一个集合的所有子集的集合是有用的。我们还可以拥有复杂的幂集。由于集合的每个元素都可以包含在子集中或不包含，因此我们可以有指数级的子集。更具体地说，集合
    `A` 的幂集的基数由 `|P(A)| = 2^{|A|}` 给出。


    ## 1.8 元组和笛卡尔积


    接下来，我们看与编程语言中列表概念最接近的 tuple（元组）类型。元组是用括号括起的逗号分隔的列表，例如 `(1, 2, 3)`。它们与集合的不同之处在于它们允许重复，且元素的顺序实际上是重要的。


    具有两个元素的元组称为 `pairs`（对）。具有三个元素的元组称为 `triples`（三元组）。更长的元组被称为 `n-tuples`（n 元组），其中
    `n` 是元组的长度。


    元组出现的重要方式是当我们查看两个或多个集合的所有元素组合时，称为 `Cartesian product`（笛卡尔积）。笛卡尔积可以用三种（或更多）方式进行，如下：你可以使用幂符号表示集合与其自身的笛卡尔积。如果在笛卡尔积中添加括号，需要小心。


    笛卡尔积的基数可以通过各个集合基数的乘积来计算。如果我们有集合 `A[1], A[2], A[3], ..., A[n]`，那么笛卡尔积 `A[1] × A[2]
    × A[3] × ... × A[n]` 的基数是 `|A[1]| ⋅ |A[2]| ⋅ |A[3]| ⋅ ... ⋅ |A[n]|`。


