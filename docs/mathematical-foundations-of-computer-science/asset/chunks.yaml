    \ graph in [Figure E.7](#appE.xhtml#fig19_7) bipartite? List out the vertices\
    \ in *L* and *R* if it is.\n\n# Appendix FLoop Invariants\n\n## F.1 Why You Should\
    \ Care\n\nWhen you write a function to search or sort a list, how do you know\
    \ that it will work on all valid inputs? You certainly can't test it on every\
    \ possible input. In computer science, we prove correctness of our algorithms.\
    \ A common technique for proving correctness of algorithms with loops is the loop\
    \ invariant proof. Read on to learn more!\n\n## F.2 Summing a List\n\nConsider\
    \ the following algorithm ([Algorithm F.1](#appF.xhtml#algoF_1)) for summing up\
    \ a list of numbers:\n\nThis is a very simple algorithm, but it makes a great\
    \ first example to see how we can prove that it always works. To prove that the\
    \ sum algorithm is correct, we introduce a loop invariant.\n\nA loop invariant\
    \ for the sum problem is given below. Note that for the rest of this chapter we\
    \ will use the notation *L*\\[*i* : *j*\\] to indicate the sub-list consisting\
    \ of *L*\\[*i*\\], *L*\\[*i* + 1\\], …, *L*\\[*j* − 1\\] (i.e., starting from\
    \ the *i*th element up to but not including the *j*th element), similar to the\
    \ notation used by Python for list slices.\n\nWe use loop invariants such as this\
    \ one to essentially write a proof by induction to show correctness of the algorithm.\
    \ We start with the loop initialization (similar to the base step) and then show\
    \ that the invariant is maintained (similar to the inductive step) after each\
    \ iteration. Unlike a proof by induction that shows the result for all positive\
    \ *n*, we terminate our proof based on the termination condition of the loop.\n\
    \nEvery loop invariant proof needs all of the above four parts: statement of the\
    \ loop invariant, initialization, maintenance, and termination. We'll see some\
    \ more examples next.\n\n## F.3 Exponentiation\n\nConsider the standard algorithm\
    \ for exponentiation ([Algorithm F.2](#appF.xhtml#algoF_2)) below. It very straightforwardly\
    \ just uses an accumulator to compute the exponent. Think about what would be\
    \ the loop invariant in this case.\n\nThe invariant involves the *result* variable\
    \ that starts at 1 and should end at *a*^(*n*). At each iteration, the value of\
    \ *result* is multiplied by *a*. Guided by this, we propose the following invariant:\n\
    \nThe rest of the proof looks as follows.\n\nThe correctness of the previous algorithm\
    \ might have looked obvious to you, so let us see how we can write a proof for\
    \ a more interesting exponentiation algorithm ([Algorithm F.3](#appF.xhtml#algoF_3)).\
    \ It will also show us an example that has a while loop rather than a for loop.\n\
    \nThis algorithm works similarly to the previous one, accumulating the product\
    \ into an accumulator variable, except that if the exponent is even it performs\
    \ the following speedup: it squares the base and halves the exponent. This considerably\
    \ decreases the number of multiplications needed since we often halve the exponent,\
    \ earning the algorithm the name **fast exponentiation**.\n\nTo prove correctness\
    \ of the algorithm, we need to find a pattern in the values of *result, b*, and\
    \ *e*. Notice that at every iteration the remaining product that needs to be multiplied\
    \ into the *result* variable is *b*^(*e*). After some thought, you might get the\
    \ following invariant:\n\nFor example, in the table in the previous example, you\
    \ should verify that *r**e**s**u**l**t* ⋅ *b*^(*e*) is always equal to 2^(31).\
    \ Notice that this invariant doesn't have an iteration number as we had in the\
    \ previous for loop examples.\n\n## F.4 Insertion Sort\n\nThe following Insertion\
    \ Sort algorithm ([Algorithm F.4](#appF.xhtml#algoF_4)) sorts a list of comparable\
    \ types (i.e., types that have the > operation defined). It works much in the\
    \ same way that most people sort playing cards in their hands: as we encounter\
    \ a card (starting from the left), we insert that card in the correct position\
    \ for the cards encountered thus far. More precisely, during each iteration *i*,\
    \ the algorithm inserts the *i*th element in the correct position for the sublist\
    \ *L*\\[0 : *i* + 1\\]. At each successive iteration a larger sublist of the list\
    \ is sorted. Eventually, when all the items in the list have been encountered,\
    \ the entire list will be sorted.\n\nWe will formally prove the correctness of\
    \ Insertion Sort next. Notice that each iteration of Insertion Sort has a larger\
    \ prefix of the list sorted (indicated in bold in the above example). We will\
    \ use this idea to develop the following loop invariant for it:\n\nNote that the\
    \ above proof could be made even more rigorous by adding in a separate loop invariant\
    \ proof for the while loop. This is left as an excercise for the reader.\n\n##\
    \ F.5 Chapter Summary and Key Concepts\n\n*   **Loop invariants** are statements\
    \ that are true at the start of each iteration of a loop. They allow us to prove\
    \ correctness of the algorithm.\n\n*   Any loop invariant proof has four parts:\
    \ (1) **stating** the invariant, (2) an **initialization** step in which the invariant\
    \ is shown to be true at the start of the loop, (3) a **maintenance** step in\
    \ which it is shown that if the invariant was true before the previous iteration\
    \ then it must be true before the next iteration, and (4) a **termination** step\
    \ in which the invariant is used to show that the loop correctly computed what\
    \ it was suppsed to.\n\n## Exercises\n\nWrite out algorithms (with **loops**)\
    \ for each of the following and prove them correct using loop invariant proofs.\n\
    \n*   F.1 Finding the maximum of a list\n\n*   F.2 Finding the minimum of a list\n\
    \n*   F.3 Summing up the first *n* positive integers"
