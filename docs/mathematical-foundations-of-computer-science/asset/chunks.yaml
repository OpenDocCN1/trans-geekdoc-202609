    tapes, for which each tape has a separate head. (See [Figure 14.2](#chapter14.xhtml#fig14_2).).)
    Now, each head can be at a different cell of the tape. A `k`-tape Turing machine
    can be simulated by a `2k`-track Turing machine by using odd numbered tracks to
    represent the tapes and the even numbered tracks to maintain the head position
    of the track before it. We omit the details of how to design such a Turing machine
