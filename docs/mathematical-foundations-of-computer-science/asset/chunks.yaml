- fmt: '

    Similar to conditional statements in computer code, we use three operations to
    modify logical statements: and, or, and not.


    Logical `conjunction` (and) is an operation that takes on the value true precisely
    when both the statements it modifies are true. It is denoted by the `∧` symbol.


    Logical `disjunction` (or) is an operation that takes on the value true precisely
    when either of the statements it modifies are true. It is denoted by the `∨` symbol.


    Logical `negation` (not), denoted by the `¬` symbol, is an operation on a single
    expression that flips true to false and false to true.


    We can use variables to serve as placeholders for logical statements.


    In terms of order of operations, the negation operation has the highest precedence
    and all other ordering is shown using parentheses.


    ## 3.4 Truth Tables


    A convenient way to represent expressions involving the above logical expressions
    is to use `truth tables`. The truth table for the operations from the previous
    section is given in [Figure 3.1](#chapter3.xhtml#fig3_1). The values `true` and
    `false` are abbreviated with `T` and `F`.


    ![Figure 3.1 Truth table for logical operations](images/fig3_1.jpg)


    [Figure 3.1](#chapter3.xhtml#b3fig3_1) Truth table for logical operations


    You should create truth tables for more complex expressions by breaking them into
    smaller pieces.


    The notation for and (`∧`) and or (`∨`) may remind you of the notation for set
    intersection (`∩`) and set union (`∪`) and this is for good reason. When you compute
    the intersection of two sets, you are saying that the resulting elements must
    be in the first set `and` and the second. Similarly, the elements of the union
    of two sets must be in the first set `or` the second.


    The above connection means that some rules with sets generalize to logical statements.
    The following example shows that one of De Morgan''s laws for sets applies for
    logic as well since the column for `¬(A ∨ B)` is identical to the one for `¬A ∧ ¬B`.


    Since `¬(A ∨ B)` and `¬A ∧ ¬B` have identical columns in the truth table, we say
    that they are `logically equivalent`.


    As an exercise, show that `¬(A ∧ B)` and `¬A ∨ ¬B` are logically equivalent (this
    is another of De Morgan''s laws).


    ## 3.5 Conditional Statements


    Another important logical operation is the conditional. This applies when one
    logical expression implies another and is denoted using the `⇒` operator.


    The truth table for conditionals is given in [Figure 3.2](#chapter3.xhtml#fig3_2).
    For example, a true expression always implies a true expression, so `T ⇒ T` is
    true and `T ⇒ F` is false. However, a false expression can imply a false or true
    expression, so `F ⇒ T` and `F ⇒ F` are both true. Another way to say this is that
    the result of the operation is true if the first expression is false or if the
    second is true and this logical equivalence is demonstrated with `¬A ∨ B` in the
    last column of the table.


    ![Figure 3.2 Truth table for conditional operation](images/fig3_2.jpg)


    [Figure 3.2](#chapter3.xhtml#b3fig3_2) Truth table for conditional operation


    Some people are thrown off when they see that `F ⇒ T` is true. An example helps
    to understand why this is the case.


    A common error made by novices to logic is to confuse a statement and its `converse`.


    A quick check of the truth tables for `P ⇒ Q` and `Q ⇒ P` will show you that these
    expressions are not logically equivalent. We can see this more intuitively from
    the following example.


    A useful tool when proving conditionals later will be to use the `contrapositive`
    of a conditional statement.


    The logical equivalence of `¬B ⇒ ¬A` and `A ⇒ B` is demonstrated in [Figure 3.3](#chapter3.xhtml#fig3_3).


    ![Figure 3.3 Logical equivalence of the contrapositive](images/fig3_3.jpg)


    [Figure 3.3](#chapter3.xhtml#b3fig3_3) Logical equivalence of the contrapositive


    Thus, the contrapositive of a true statement is always a true statement.


    One last logical operator that we will define is called the `biconditional`.


    The truth table for the biconditional is given in [Figure 3.4](#chapter3.xhtml#fig3_4).


    ![Figure 3.4 Truth table for biconditional](images/fig3_4.jpg)


    [Figure 3.4](#chapter3.xhtml#b3fig3_4) Truth table for biconditional


    ## 3.6 Quantifiers


    While it is easy to use logical operators for finite sets, we need additional
    notation when making statements about larger sets. For this, we introduce two
    `quantifiers`, namely the universal or “for all” quantifier `∀` and the existential
    or “there exists” quantifier `∃`.


    These quantifiers can be alternated to make more complex mathematical statements.
    It is important to note that the `order` of the quantifiers matters and changing
    the order can greatly change the meaning of the statement.


    ## 3.7 Big-O Notation


    Quantifiers are the basis of asymptotic notation that is used ubiquitously in
    computer science. You may have encountered Big-O notation when analyzing the running
    time of an algorithm you were studying. You''ll get a taste of how this is defined
    using quantifiers in this section.


    Say that you have an algorithm that on input of size `n` performs `f(n) = 2n + 3`
    computational operations. For practical purposes, the `+3` in the formula is not
    very relevant as it is going to contribute very little when `n` gets large. Even
    the coefficient of `2` in the formula is not very important when we want to study
    the growth of the function `f`. In Big-O notation, we say that `f` is `O(n)` or
    linear in `n`.


    The mathematical definition of Big-O is as follows:


    In other words, we can say that the function `f` is bounded by `g` times some
    constant factor for sufficiently large values of `n`. This definition allows us
    to categorize the growth rate of functions into ones such as linear (`O(n)`) or
    quadratic (`O(n²)`).


    ## 3.8 Negating Logical Statements


    You will at times need to negate statements. For example, negating statements
    is really important for writing `while` loops,


    To negate unquantified statements, we can apply De Morgan''s laws to get that
    the negation of `P ∧ Q` is `¬P ∨ ¬Q` and the negation of `P ∨ Q` is `¬P ∧ ¬Q`.


    To negate quantified statements, we have to flip `∀` and `∃` before negating the
    innermost statement.


    ## 3.9 Chapter Summary and Key Concepts


    *   A `logical statement` is a mathematical statement that takes on the values
    `true` or `false`.

    *   Commonly used `logical operations` performed on statements include `conjunction
    (and)`, `disjunction (or)`, and `negation (not)`.

    *   `truth tables` can be used to compute logical operations and to show that
    two expressions are `logically equivalent`.

    *   `conditional statements` are used for logical implication. The `contrapositive`
    of a statement is logically equivalent to the original statement. A conditional
    statement is different from its `converse`.

    *   The `for all ∀ quantifier` and `there exist ∃ quantifier` allow us to make
    quantified statements for the elements of a set.

    *   `Big-O notation` allows us to measure the rate of growth of functions, with
    applications such as expressing the running time of an algorithm.

    *   Logical statements can be `negated` by carefully switching `∀/∃` and negating
    the innermost statement.


    ## Exercises


    ### Exercises for 3.2


    Determine whether each of the following statements is true or false. Give a one
    line explanation for each.


    *   3.1 (Assume that `x` = 3) `x` ≤ 2

    *   3.2 (Assume that `x` = 3) `x` < 3

    *   3.3 (Assume that `x` = 3) (`x` ≤ 3) ∧ (`x` ≤ 2)

    *   3.4 (Assume that `x` = 3) (`x` ≤ 3) ∨ (`x` ≤ 2)

    *   3.5 (Assume that `x` = 3 and `y` = 4) (`x` < *y*) ∧ (`x` + 1 ≤ *y*)

    *   3.6 Every number is either even or odd.

    *   3.7 For every number, there is always a bigger number.

    '
  raw: 'Similar to conditional statements in computer code, we use three operations
    to modify logical statements: and, or, and not.


    Logical **conjunction** (and) is an operation that takes on the value true precisely
    when both the statements it modifies are true. It is denoted by the ∧ symbol.


    Logical **disjunction** (or) is an operation that takes on the value true precisely
    when either of the statements it modifies are true. It is denoted by the ∨ symbol.


    Logical **negation** (not), denoted by the ¬ symbol, is an operation on a single
    expression that flips true to false and false to true.


    We can use variables to serve as placeholders for logical statements.


    In terms of order of operations, the negation operation has the highest precedence
    and all other ordering is shown using parentheses.


    ## 3.4 Truth Tables


    A convenient way to represent expressions involving the above logical expressions
    is to use **truth tables**. The truth table for the operations from the previous
    section is given in [Figure 3.1](#chapter3.xhtml#fig3_1). The values true and
    false are abbreviated with T and F.


    ![Figure 3.1 Truth table for logical operations](images/fig3_1.jpg)


    [Figure 3.1](#chapter3.xhtml#b3fig3_1) Truth table for logical operations


    You should create truth tables for more complex expressions by breaking them into
    smaller pieces.


    The notation for and (∧) and or (∨) may remind you of the notation for set intersection
    (∩) and set union (∪) and this is for good reason. When you compute the intersection
    of two sets, you are saying that the resulting elements must be in the first set
    **and** the second. Similarly, the elements of the union of two sets must be in
    the first set **or** the second.


    The above connection means that some rules with sets generalize to logical statements.
    The following example shows that one of De Morgan''s laws for sets applies for
    logic as well since the column for ¬(*A* ∨ *B*) is identical to the one for ¬*A* ∧ ¬*B*.


    Since ¬(*A* ∨ *B*) and ¬*A* ∧ ¬*B* have identical columns in the truth table,
    we say that they are **logically equivalent**.


    As an exercise, show that ¬(*A* ∧ *B*) and ¬*A* ∨ ¬*B* are logically equivalent
    (this is another of De Morgan''s laws).


    ## 3.5 Conditional Statements


    Another important logical operation is the conditional. This applies when one
    logical expression implies another and is denoted using the ⇒ operator.


    The truth table for conditionals is given in [Figure 3.2](#chapter3.xhtml#fig3_2).
    For example, a true expression always implies a true expression, so T ⇒ T is true
    and T ⇒ F is false. However, a false expression can imply a false or true expression,
    so F ⇒ T and F ⇒ F are both true. Another way to say this is that the result of
    the operation is true if the first expression is false or if the second is true
    and this logical equivalence is demonstrated with ¬*A* ∨ *B* in the last column
    of the table.


    ![Figure 3.2 Truth table for conditional operation](images/fig3_2.jpg)


    [Figure 3.2](#chapter3.xhtml#b3fig3_2) Truth table for conditional operation


    Some people are thrown off when they see that *F* ⇒ *T* is true. An example helps
    to understand why this is the case.


    A common error made by novices to logic is to confuse a statement and its **converse**.


    A quick check of the truth tables for *P* ⇒ *Q* and *Q* ⇒ *P* will show you that
    these expressions are not logically equivalent. We can see this more intuitively
    from the following example.


    A useful tool when proving conditionals later will be to use the **contrapositive**
    of a conditional statement.


    The logical equivalence of ¬*B* ⇒ ¬*A* and *A* ⇒ *B* is demonstrated in [Figure
    3.3](#chapter3.xhtml#fig3_3).


    ![Figure 3.3 Logical equivalence of the contrapositive](images/fig3_3.jpg)


    [Figure 3.3](#chapter3.xhtml#b3fig3_3) Logical equivalence of the contrapositive


    Thus, the contrapositive of a true statement is always a true statement.


    One last logical operator that we will define is called the **biconditional**.


    The truth table for the biconditional is given in [Figure 3.4](#chapter3.xhtml#fig3_4).


    ![Figure 3.4 Truth table for biconditional](images/fig3_4.jpg)


    [Figure 3.4](#chapter3.xhtml#b3fig3_4) Truth table for biconditional


    ## 3.6 Quantifiers


    While it is easy to use logical operators for finite sets, we need additional
    notation when making statements about larger sets. For this, we introduce two
    **quantifiers**, namely the universal or “for all” quantifier ∀ and the existential
    or “there exists” quantifier ∃.


    These quantifiers can be alternated to make more complex mathematical statements.
    It is important to note that the *order* of the quantifiers matters and changing
    the order can greatly change the meaning of the statement.


    ## 3.7 Big-O Notation


    Quantifiers are the basis of asymptotic notation that is used ubiquitously in
    computer science. You may have encountered Big-O notation when analyzing the running
    time of an algorithm you were studying. You''ll get a taste of how this is defined
    using quantifiers in this section.


    Say that you have an algorithm that on input of size *n* performs *f*(*n*) = 2*n* + 3
    computational operations. For practical purposes, the +3 in the formula is not
    very relevant as it is going to contribute very little when *n* gets large. Even
    the coefficient of 2 in the formula is not very important when we want to study
    the growth of the function *f*. In Big-O notation, we say that *f* is *O*(*n*)
    or linear in *n*.


    The mathematical definition of Big-O is as follows:


    In other words, we can say that the function *f* is bounded by *g* times some
    constant factor for sufficiently large values of *n*. This definition allows us
    to categorize the growth rate of functions into ones such as linear (*O*(*n*))
    or quadratic (*O*(*n*²)).


    For more on asymptotic notation, see [Appendix D](#appD.xhtml#appD).


    ## 3.8 Negating Logical Statements


    You will at times need to negate logical statements. For example, negating statements
    is really important for writing while loops because you will want to negate the
    stopping condition to get the while condition.


    To negate unquantified statements, we can apply De Morgan''s laws to get that
    the negation of *P* ∧ *Q* is ¬*P* ∨ ¬*Q* and the negation of *P* ∨ *Q* is ¬*P* ∧ ¬*Q*


    To negate quantified statements, we have to flip universal (∀) and existential
    (∃) quantifiers before negating the innermost statement.


    ## 3.9 Chapter Summary and Key Concepts


    *   A **logical statement** is a mathematical statement that takes on the values
    **true** or **false**.


    *   Commonly used **logical operations** performed on logical statements include
    **conjunction (and), disjunction (or)**, and **negation (not)**.


    *   **Truth tables** can be used to compute logical operations and to show that
    two logical expressions are **logically equivalent**.


    *   **Conditional statements** are used for logical conditionals or implication.
    The **contrapositive** of a statement is logically equivalent to the original
    statement. A conditional statement is different from its **converse**.


    *   The **for all ∀ quantifier** and **there exist ∃ quantifier** allow us to
    make quantified statements for the elements of a set.


    *   **Big-O notation** allows us to measure the rate of growth of functions, with
    applications such as expressing the running time of an algorithm.


    *   Logical statements can be **negated** by carefully switching ∀/∃ and negating
    the innermost statement.


    ## Exercises


    ### Exercises for 3.2


    Determine whether each of the following statements is true or false. Give a one
    line explanation for each.


    *   3.1 (Assume that *x* = 3) *x* ≤ 2


    *   3.2 (Assume that *x* = 3) *x* < 3


    *   3.3 (Assume that *x* = 3) (*x* ≤ 3) ∧ (*x* ≤ 2)


    *   3.4 (Assume that *x* = 3) (*x* ≤ 3) ∨ (*x* ≤ 2)


    *   3.5 (Assume that *x* = 3 and *y* = 4) (*x* < *y*) ∧ (*x* + 1 ≤ *y*)


    *   3.6 Every number is either even or odd.


    *   3.7 For every number, there is always a bigger number.'
