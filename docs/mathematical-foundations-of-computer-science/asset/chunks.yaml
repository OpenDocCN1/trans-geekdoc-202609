    \n## 10.1 为什么你应该关注\n\n反证法是一种强大的技术，通常是证明计算机科学中许多结果的最佳方法。与直接证明相比，它证明某些结果可能更容易，因为它允许证明者假设一些可用于证明的事实。\n\
    \n## 10.2 技术概述\n\n反证法通过假设你想证明的对立面（否定）是真的，然后得出一个矛盾陈述（通常是陈述和它的否定同时成立）。换句话说，证明某个语句\
    \ $S$ 的结构如下：\n\n1. 为了反证，假设 $S$ 的否定是真的。\n2. 基于此假设进行论证。\n3. 显示你得到了矛盾。\n\n这种技术为你的证明提供了一个起点——假设你想要证明的语句的否定。困难之处在于如何得到最后的矛盾。\n\
    \n## 10.3 为什么你无法将 $\\sqrt{2}$ 写成分数\n\n反证法的技术至少追溯到古希腊时期，他们用它来证明 $\\sqrt{2}$ 是无理的。\n\
    \n毕达哥派使用反证法证明 $\\sqrt{2}$ 是无理的。一个有趣的副作用是，无法使用 float、double 甚至使用有理数类来精确存储 $\\sqrt{2}$\
    \ 的值，因为我们需要无限精度来捕获该数字中的所有数字。我们接下来来看为什么。\n\n在上面的证明中，我们使用了奇数的平方始终是奇数的这一事实。这源于算术基本定理。\n"
