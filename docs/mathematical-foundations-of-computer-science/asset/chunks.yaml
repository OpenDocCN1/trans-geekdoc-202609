    The point of demonstrating these variations is to show you that there are more
    complex models possible that are no more powerful than the Turing machine. These
    variations are also getting closer to models of computation you are used to in
    which you can keep track of multiple values at the same time.


    ## 14.3 The Church-Turing Thesis


    Now that we have seen that Turing machines are capable of maintaining multiple
    tapes (variables in memory) and can perform many of the operations we deem necessary
    for computation (arithmetic, loops, conditionals) in examples and exercises in
    the last chapter, we are ready to make an assertion about the power of Turing
    machines. The following is one version of what is called the Church-Turing thesis,
    named after two pioneers in the theory of computation, Alonzo Church and Alan
    Turing.


    The above statement is called a thesis because it is a hypothesis. Since the term
    “mechanical computation” is not well defined, the above thesis cannot be mathematically
    proved. It hypothesizes that any computation that we think is feasible can be
    done by a Turing machine. All modern computers are no more or less powerful than
    a Turing machine in that they can solve the same problems. Given enough time and
    memory, a Turing machine can perform any computation that we can do on a computer.
    Conversely, modern computers can perform any computation that a Turing machine
    is capable of given enough time and computer memory.


    Now, this is not to say that we will never be able to build a computer that is
    more powerful than a Turing machine. It just means that we don''t currently believe
    some more powerful computer is possible and all empirical evidence seems to support
    that belief.


    ## 14.4 Universal Turing Machines


    An important property of the Turing machine is that it is powerful enough to simulate
    itself. That is, given the encoding of a Turing machine and an input string, we
    can design a Turing machine (called a **Universal Turing Machine**) that can simulate
    the given Turing machine on the given input.


    You might be wondering how you can encode a Turing machine as a string. Since
    the description of a Turing machine is always finite, we can encode the description
    into a single string. For example, we can encode the name of the states, the input
    and tape alphabet, the starting and accepting states, and the blank symbol into
    a string. We can then encode the `δ` transition rules as sequences—for example,
    `δ(q[0], 0) = (q[1], B, R)` could be encoded by a string such as `q0#0#q1#BBR`,
    where `#` is a special separator symbol. Thus, any Turing machine can be represented
    with a string encoding.


    Given such an encoding of a Turing machine, it is possible (with a lot of effort!)
    to design a Turing machine that could take such an encoding and use it to process
    the behavior of the Turing machine on some input string. We could do this by,
    for example, storing the input string on one tape, the current state on another,
    the head position on a third, and the Turing machine encoding on a fourth. For
    each step of the Turing machine simulation, we would look up what character is
    at the current head position and what state we are currently at and then search
    the Turing machine encoding tape for the correct move to execute next.


    The idea of the Universal Turing Machine is important for a number of reasons.
    For one, it tells us that Turing machines are capable of running other Turing
    machines. In fact, this is exactly what happens when you run a program using a
    compiler or interpreter—these are examples of Universal Turing Machine programs
    in that they can process arbitrary (correct) code.


    Another important reason for Turing machines being able to simulate other Turing
    machines is that we can have a Turing machine call another Turing machine in a
    subroutine, allowing us to chain together increasingly complex computations.


    ## 14.5 Recursive and Recursively Enumerable Languages


    We are now ready to define what languages are computable.


    Note that we specify that the Turing machine for the language must halt on all
    inputs. This is because Turing machines are allowed to reject a string by running
    forever. Since computations that run forever are not very useful, we specify that
    the Turing machine must halt and accept or halt and reject on every possible input.


    There is also a broader collection of languages that defines everything a Turing
    machine is capable of computing called the recursively enumerable languages.


    Notice that this collection of languages contains the recursive ones because recursive
    languages all have Turing machines (that also must halt on all inputs). This classification
    isn''t as useful from a practical standpoint because it allows Turing machines
    to run forever on some inputs, but it does help us with some proofs later in this
    chapter. Next, we prove a few results based on these definitions.


    Notice in the above proof that we had to run the simulations for `M` and `\overset{―}{M}`
    in parallel because it could be possible for either `M` or `\overset{―}{M}` to
    run forever and so if we had them sequentially the computation may never end.


    ## 14.6 A Non-Computable Problem


    To show that there are non-recursive problems, we first need to understand that
    all strings and Turing machines can be enumerated (listed in a numbered list).
    To list off the strings in a fixed order, we can use shortlex ordering. For a
    review of shortlex ordering of strings, take a look at [Section 1.10](#chapter1.xhtml#sec1_10).
    To list all Turing machines, we can write an encoding for each one (see [Section
    14.4](#chapter14.xhtml#sec14_4)) and then also use a shortlex ordering. Let us
    call the Turing machines generated in this manner `M[i]` for each string `i`.


    We are now ready to define the Diagonal Problem (`D`). The Diagonal Problem can
    be intuitively thought of as the set of strings that when interpreted as a Turing
    machine accepts itself as an input.


    To understand the above definition, we have to interpret the string `i` in two
    distinct ways. In one interpretation, we treat the string `i` as the encoding
    for a Turing machine `M[i]` as we saw in [Section 14.4](#chapter14.xhtml#sec14_4).
    If the string `i` does not correspond to the encoding of any Turing machine, then
    we simply define `M[i]` to be a simple Turing machine that rejects all inputs
    by immediately halting and rejecting. The second interpretation of `i` is simply
    that of a string—an input string to be accepted or rejected.


    Next, we define the complement of the language `D`, called `\overset{―}{D}`.


    We will now show that `\overset{―}{D}` does not have a Turing machine that accepts
    it. Before formally proving this, let us build some intuition about why this is
    the case. We use a technique called **diagonalization**.

