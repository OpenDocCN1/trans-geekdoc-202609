    # Chapter 13 Turing Machines


    DOI: [10.1201/9781003383284-13](https://doi.org/10.1201/9781003383284-13)


    ## 13.1 Why You Should Care


    The Turing machine is the standard model for all computation. It is capable of
    accepting all regular languages, context-free languages, and indeed any language
    computation that is believed to be possible by a computer. All programming languages
    are called Turing-complete, which is an informal way of saying that they can do
    all that a Turing machine can do. Thus understanding how Turing machines work
    is important for any computer scientist.


    ## 13.2 An Example Turing Machine


    What makes the DFA an unsatisfactory model of computation is that it necessarily
    has finite memory and thus cannot count arbitrarily high, leading it to be unable
    to accept simple languages like


    ```

    \begin{array}{l} {L = \\{ 0^{n}1^{n}:n \\geq 0\\}.} \\\\ \end{array}

    ```


    To get around this deficiency, the Turing machine adds an infinitely long tape
    (stretching forever to the left and right) that has data on it in the form of
    cells, each of which holds a single character and can be modified by a head that
    moves along the tape one cell at a time. This unbounded memory allows us to model
    all known computation. The input string now starts on the tape with the head pointed
    to the leftmost character. All other cells are filled with a special blank symbol
    (usually B).


    ![Figure 13.1 A Turing machine with the input 01 on its doubly infinite tape](images/fig13_1.jpg)


    Figure 13.1 A Turing machine with the input 01 on its doubly infinite tape


    Here are several differences from DFAs that are important to understand:


    *   Not all state/symbol combinations need to be defined for a Turing machine.

    *   The transitions that are defined are deterministic—we will not study non-deterministic
    models.

    *   Unlike DFAs for which we go through the string only once, for Turing machine
    we can traverse the string multiple times.

    *   As soon as an accepting state is reached, the computation halts.


    The language of a Turing machine is the set of strings accepted by it. Notice
    that this first example Turing machine will halt and accept or reject on all strings,
    but it is possible that Turing machine can reject by running forever. This detail
    will be important later.


    ## 13.3 Formal Definition of a Turing Machine


    A Turing machine can be defined using 7-tuple as follows.


    ## 13.4 Recognizing Addition


    Our second example will demonstrate how Turing machines can recognize addition
    with unary. Unary, or tally numbering, is a very simple numerical encoding that
    has a single symbol (usually 1 or 0) and each positive integer is represented
    by that number of symbol.


    The following language allows us to recognize or check addition in unary by using
    0s for the first number, 1s for the second, and 0s for the sum:


    ```

    \begin{array}{l} {L\_{+} = \\{ 0^{n}1^{m}0^{n + m}:n,m \\geq 0\\}.} \\\\ \end{array}

    ```


    To design a Turing machine for this language, we can use an algorithm similar
    to the previous example. We can match 0s at the start of the string with 0s at
    the end by erasing them. Once this is done we matched pairs of 1s from the beginning
    with 0s on the end until the entire string is erased. If the end result of the
    computation is a blank tape, then the computation should accept. If the string
    is not of the given form, the computation should reject.


    You should also verify that the Turing machine works correctly when *n* = 0 (for
    example, by accepting strings such as 10 and 1100 and rejecting strings such as
    110 and 100), when *m* = 0 (for example, by accepting strings such as 00 and 0000
    and rejecting strings such as 0 and 000), and when both *n* and *m* are zero (i.e.,
    when the input is *λ*).


