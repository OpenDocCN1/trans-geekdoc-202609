    \ of `n` (1 × 2 × 3… × `n`)\n* F.6 Computing the `n`th Fibonacci number (iterative)\n\
    * F.7 Linear search of a list\n* F.8 Reversing a list by creating a new list\n\
    * F.9 Reversing a list in place\n* F.10 Selection sort (Hint: First prove a loop\
    \ invariant for the inner loop, then use this to prove a loop invariant for the\
    \ outer loop.)\n* F.11 Bubble sort (Hint: First prove a loop invariant for the\
    \ inner loop, then use this to prove a loop invariant for the outer loop.)\n*\
    \ F.12 Binary search (iterative)\n\n# Appendix G Recurrence Relations\n\n## G.1\
    \ Why You Should Care\n\nRecurrence relations, sometimes called recurrences, are\
    \ a way of analyzing recursive algorithms to compute their run-time. Since recursion,\
    \ particularly divide-and-conquer, comes up quite often in algorithm design, knowing\
    \ how to solve them is important for computer scientists.\n\n## G.2 Merge Sort\n\
    \nDivide and conquer is a recursive algorithmic technique in which the instance\
    \ of the problem being solved is broken down into two or more smaller versions\
    \ of the original problem and the answer to these helps compute the answer to\
