    CFG `G` = `(*V, Σ, P, S*)` 的语言定义为从 `S` 开始使用 `P` 中的产生式直到只剩下终结符的字符串集合。任何具有上下文文法的语言都称为上下文相关的（context-free）。


    ## 12.6 并集的封闭性


    我们可以从两个上下文无关语言的文法构造出它们并集的 CFG，例如：


    `U = {0^n:n ≥ 1} ∪ {w01:w ∈ {0,1}*}`


    我们可以对上述例子进行泛化，给出一个寻找任意两个上下文无关语言的并集 CFG 的程序。


    你可以以类似的方法证明连接和 Kleene 星的封闭性。这些留作练习题。


