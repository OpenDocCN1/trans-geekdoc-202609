    Strings are defined over an **alphabet** set Σ (the Greek symbol uppercase sigma).


    Notice that, unlike programming language strings, we do not include any quotes
    around the string. Another important difference is that programming languages
    allow for all characters (ASCII or Unicode), but mathematical strings will usually
    be restricted to a smaller collection of characters.


    The **length** of a string *s* is the number of characters in it and denoted |*s*|.


    The unique string of length zero is called the **empty string**. It is usually
    denoted in programming languages by "", but since no quotation marks are used
    for mathematical strings, we use the Greek symbol lowercase lambda (*λ*). Some
    books also use lowercase epsilon (*ϵ*) to denote the empty string.


    A shorthand that we will use for strings such as aaaaaaa is to use power notation
    to express it more succinctly as a⁷. We can also combine this with concatenation
    to write strings such as a³b²a³ to be shorthand for aaabbaaa. This shorthand can
    also be applied to string expressions, such as (`a``b`) ³ for ababab.


    A **substring** is any consecutive sequence of characters in a string.


    A **prefix** is any initial substring of a string.


    A **suffix** is any substring at the end of a string.


    Notice that strings above were listed in ascending order in their length, breaking
    ties using the usual dictionary order. This is known as **shortlex** ordering.


    This is easiest seen by the way of a few examples:


    Note that shortlex ordering is not the same as standard dictionary ordering as,
    for example, the string cat comes before the string abacus (since cat is shorter).


    We will refer to all the strings over an alphabet Σ as *Σ*^(\*). Using the notion
    of shortlex ordering, we can now write all strings in *Σ*^(\*) in the following
    example:


    ## 1.11 Languages


    Almost all the computation we will see in this book will consist of recognizing
    or accepting languages.


    We can write out languages more succinctly and precisely by using mathematical
    notation.


    We can also introduce string variables to write out sets over strings more compactly,
    as shown in the following examples:


    The term language comes from the fact that the languages that you are familiar
    with can be represented by sets of strings.


    The computational tasks we will perform in this book then just become ones of
    determining whether a string (the input) is in a particular language. Any function
    that we can compute that has a Boolean output (True or False) can be thought of
    as the set of input strings that return True.


    This may appear unusual to you as computations such as addition and multiplication
    (or more complex functions) aren''t tasks where you are trying to determine if
    something is in a set. While it is true that we lose the ability to describe such
    computation with languages, we still retain considerable expressive power that
    is sufficient to prove many results about various models of computation.


    ## 1.12 Chapter Summary and Key Concepts


    *   A **set** is an unordered collection of distinct objects (numbers, strings,
    programming languages, etc.). The objects in a set are called its **elements**
    or **members**. The notation *x* ∈ *A* is how we denote that *x* is an element
    of the set *A* and *x* ∉ *A* is how we denote that *x* is not an element of the
    set *A*.


    *   The **empty set** (∅) is the unique set with no elements.


    *   A set is a **subset** of another set if all its elements are contained in
    the other set. The empty set is a subset of all sets. A set is always a subset
    of itself.


    *   Two sets are **equal** if they have the same elements. To show that two sets
    are equal, we have to show that both sets are subsets of each other.


    *   The **cardinality** of a set is the number of elements in the set. Sets can
    be **finite** or **infinite**.


    *   The set ℕ is all the **natural numbers**, the set ℤ is the set of **integers**,
    the set ℝ is the set of all **real numbers**, and the set ℚ is the set of all
    **rational numbers** (i.e., numbers of the form *p*/*q*, where *p* and *q* are
    integers and *q* is not zero).


    *   Sets are often expressed in **set builder notation**, which takes the form
    { expression: constraints}.


    *   The **union** of sets *A* and *B* is *A* ∪ *B* = {*x* : *x* ∈ *A* or *x* ∈ *B*}.
    The **intersection** of sets *A* and *B* is *A* ∩ *B* = {*x* : *x* ∈ *A* and *x* ∈ *B*}.
    The **difference** of sets *A* and *B* is *A* − *B* = {*x* : *x* ∈ *A* and *x* ∉ *B*}.


    *   The **complement** of a set *A* is its difference from a universal set *U*,
    $\\overset{―}{A} = U - A$.


    *   **Venn diagrams** are diagrams that visualize set operations.


    *   The **power set** of a set is the set of all its subsets. The cardinality
    of the power set of a set *A* is given by |𝒫(*A*)| = 2^(|*A*|).


    *   A **tuple** is an ordered collection of items that allows for repeated items.
    Sets of tuples are commonly created by computing **Cartesian products** of sets.
    The size of the set created from the Cartesian product of several sets is the
    product of the sizes of those sets.


    *   **Functions** are mappings of values from a **domain** set to a **codomain**
    set. Functions can be represented by formulas or tables.


    *   A **string** is an ordered sequence of characters from an **alphabet**. The
    number of characters in a string *s* is called its **length** and is denoted by
    |*s*|. The unique string of length zero is called the **empty string** *λ*.


    *   Any consecutive sequence of characters in a string is called a **substring**.
    When the substring appears at the start of the string, it is called a **prefix**.
    When it appears at the end of the string, it is called a **suffix**.


    *   Strings can be sorted using **shortlex ordering**. In this ordering, shorter
    strings come before longer strings. For strings of the same length, the dictionary
    ordering is used—the leftmost character at which the two strings differ is used
    to order them.


    *   Any set of strings over an **alphabet** Σ is called a **language**. Languages
    are used extensively in computer science to define sets with the same property
    (e.g., whether a number is a prime or whether a computer program is syntactically
    correct).


