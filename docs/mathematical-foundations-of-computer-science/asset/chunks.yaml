    \ the question of how many strings there are of length *at most* *n*. We know\
    \ from the previous theorem that the number of strings of length *n* is exactly\
    \ 2^(*n*), so the number of strings of length at most *n* must be the number of\
    \ strings of lengths 0, 1, 2, …, *n*, or $\\\\sum\\\\limits\\_{i = 0}^{n}2^{i}$.\
    \ When *n* = 0, this is just 2⁰ or 1. When *n* = 1, we get 2⁰ + 2¹ = 3. When *n* = 2,\
    \ we have 2⁰ + 2¹ + 2² = 7. When *n* = 3, it is 2⁰ + 2¹ + 2² + 2³ = 15. Do you\
    \ see a pattern emerging? Try to guess the pattern before reading on.\n\nYou may\
    \ have noticed that the *n*th number consistently turns out to be 2^(*n* + 1) − 1.\
    \ (This is not the only way of expressing the pattern; you might have also observed\
    \ that each number is one more than twice the previous, which is also correct.)\
    \ Let us state this formally as a hypothesis and see how we can prove it.\n\n\
    Notice that this time we used the proof by induction as part of a larger proof.\
    \ It is important to tell your reader that you are doing this, both in the setup\
    \ to say how you will use the inductive hypothesis and in the conclusion explaining\
    \ how you used the induction result for the larger proof.\n\n## 8.6 Comparing\
    \ Growth of Functions\n\nWhen you later learn about running times of algorithms,\
    \ you will have to compare the running time of various functions to see which\
    \ ones grow quicker. We will show that the factorial function (*n*!, seen earlier\
    \ in this chapter) grows faster than an exponential function (2^(*n*)). Before\
    \ trying to prove this result, we should check it for small values of *n* to make\
    \ sure that it checks out. From [Table 8.1](#chapter8.xhtml#tbl8_1) we can see\
    \ that for small values of *n* (*n* ≤ 3), the factorial function has a smaller\
    \ value than this exponential one but for larger values (*n* ≥ 4) the factorial\
    \ function seems to get substantially larger with larger values of *n*.\n\n[Table\
    \ 8.1](#chapter8.xhtml#b8tbl8_1) Table for 2^(*n*) and *n*! for small values of\
    \ *n*\n\n| *n* || 1 || 2 || 3 || 4 || 5 || 6 || 7 |\n\n| --- | --- | --- | ---\
    \ | --- | --- | --- | --- |\n\n| 2^(*n*) || 2 || 4 || 8 || 16 || 32 || 64 || 128\
    \ |\n\n| *n*! || 1 || 2 || 6 || 24 || 120 || 720 || 5040 |\n\nThe table is insufficient\
    \ to tell us that the inequality holds true for all bigger values, so we will\
    \ prove it by induction. Note that the base and conclusion steps will be different\
    \ from the earlier examples as the hypothesis will hold only for *n* ≥ 4.\n\n\
    While the above induction step is correct, it doesn't give a lot of insight of\
    \ how it was obtained, so we'll break it down next. When proving the induction\
    \ step, it is helpful to write down your assumption *P*(*k*) (here, that 2^(*k*) < *k*!)\
    \ and what you are trying to prove (here, 2^(*k* + 1) < (*k* + 1)!) first. This\
    \ will help you to figure out the connection between them. In this case, we start\
    \ with one side of the inequality we are trying to prove (here, 2^(*k* + 1)) and\
    \ figure out how it relates to our induction hypothesis (2^(*k*) < *k*!). We can\
    \ make the observation that 2^(*k* + 1) is just 2 times 2^(*k*) to make that connection,\
    \ as we do in the second line of the derivation. We then use the induction hypothesis\
    \ to replace 2 × 2^(*k*) with 2 × *k*! in the third line, stating that we used\
    \ the induction hypothesis. You should always make sure that you used the induction\
    \ hypothesis somewhere in the inductive step. Next, we have to make sure that\
    \ the value 2 × *k*! is at most the value (*k* + 1)! from what we are trying to\
    \ prove. To make this connection, we observe that (*k* + 1)! is just (*k* + 1) × *k*!\
    \ and so we really need to just show that 2 × *k*! is at most (*k* + 1) × *k*!,\
    \ which it must be as 2 is less than (*k* + 1) as we assumed that *k* ≥ 4. This\
    \ gives us the third line of the derivation above.\n\nNotice how this proof is\
    \ different from the previous ones in that our base case must be when *n* = 4\
    \ since *P*(1), *P*(2), *P*(3) are all false. This is a good reminder that *P*(*n*)\
    \ may not always be true for all values of *n*. It is also a good cautionary example\
    \ for why we must pay attention to the base case. The above induction step seems\
    \ to work whenever (*k* + 1) > 2 or *k* > 1, but the hypotheses *P*(2) and *P*(3)\
    \ are false, so we really needed to check to make sure that the base case was\
    \ true.\n\n## 8.7 Common Errors When Using Induction\n\n1.  Not clearly defining\
    \ the induction hypothesis: Any induction proof should start with a clear statement\
    \ of the induction hypothesis *P*(*n*) and for which values it is being proved\
    \ to be true."
