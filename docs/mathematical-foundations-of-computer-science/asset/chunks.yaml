    # Chapter 8Induction


    DOI: [10.1201/9781003383284-8](https://doi.org/10.1201/9781003383284-8)


    ## 8.1 Why You Should Care


    Proof by induction is a key proof technique that is used extensively in computer
    science. It is used for proving correctness of algorithms with loops and recursion.
    It is also used for showing bounds on the run-time of many recursive algorithms.
    We''ll also see how some of the results for sets and regular languages from earlier
    chapters can be formally proved.


    ## 8.2 Induction and Recursion


    Consider the pseudo-code in [Algorithm 8.1](#chapter8.xhtml#algo8_1) for computing
    the factorial function.


    Why does the above algorithm work? How do we go about proving that it always returns
    the correct answer? The intuitive reasoning goes something like this:


    1.  When *n* = 1 (the smallest possible input), the function returns the correct
    answer of 1 in the second line.


    2.  When *n* = 2, the third line of the function returns factorial(1) \* 2, which
    is 1 \* 2 or 2, again the correct answer.


    3.  When *n* = 3, the third line of the function returns factorial(2) \* 3, which
    is 2 \* 3 or 6, again the correct answer.


    4.  When *n* = 4, the third line of the function returns factorial(3) \* 4, which
    is 6 \* 4 or 24, again the correct answer.


    5.  This pattern can be continued indefinitely until we reach any desired positive
    integer.


    The idea behind proof by induction is to formalize this pattern. We have to show
    that the function gives the correct answer for the smallest input *n* = 1 (called
    the base step). We then have to show that if the function works for the case of
    some *n* = *k*, then it also must work for the case when *n* = *k* + 1 (called
    the inductive step).


    Let us use the above example to write a more formal proof. A proof by induction
    always has four parts and you should practice writing all four parts until you
    become a more experienced proof-writer. These parts are:


    1.  State the hypothesis


    2.  Base step


    3.  Inductive step


    4.  C​onclusion


    For ease of writing our proof, we denote the hypothesis by the function *P* to
    refer to it more succinctly later. The hypothesis is always a logical statement
    (i.e., taking on a value of true or false). A common error is to mistakenly think
    of *P*(*n*) as a number, which it is not.


    The base step is usually the simplest part of a proof by induction. You should
    make sure to verify the hypothesis for the smallest possible value of *n*. This
    may not always be 1, depending on the result being proved.


    The inductive step of the proof is where all the “work” is done. It always takes
    the same form: fix *k*, assume the hypothesis for *k*, prove the hypothesis for
    *k* + 1 while making sure to use the assumption. More specifically, before writing
    the induction step, it helps to write down the inductive hypothesis (*P*(*k*))
    and what you are trying to prove (*P*(*k* + 1)). Here, *P*(*k*) is the statement
    “The factorial program on input *k* returns 1 × 2 × 3 × … × *k* ” and *P*(*k* + 1)
    is the statement “The factorial program on input *k* + 1 returns 1 × 2 × 3 × … × (*k* + 1).”
    We have to explain why it is that *P*(*k*) implies *P*(*k* + 1) for any *k* ≥ 1.


    The conclusion simply summarizes the proof by induction argument. It is somewhat
    verbose and is almost identical in all proofs, but I recommend that you write
    it out after each proof to remind yourself of why it is that induction works.


    A proof doesn''t just convince us that an algorithm is correct, it gives us a
    deeper understanding of *why* the algorithm is correct. It takes away the mystery
    of how the algorithm works and gives us insight into how to adapt it to solve
    new problems. Hopefully, the above proof gave you a deeper understanding and appreciation
    for the recursive factorial function.


    ## 8.3 An Analogy for Understanding Induction


    An analogy for induction is building a multi-floor building or tower. When constructing
    the building, it is important to make sure that the bottom-most level has a firm
    foundation, which is analogous to the base case of induction. We can only build
    the second level of the building after the first (the base) has been firmly established.
    Similarly, we need the second level before we can build the third level, and so
    on.


    In an induction proof, we have to show the following two facts:


    1.  The bottom level or base case is firmly established. \[Show *P*(1) is true.\]


    2.  If any level *k* is firmly established, then the level *k* + 1 will also be
    firmly established. \[For all *k* ≥ 1, show that if *P*(*k*) is true then *P*(*k* + 1)
    is true.\]


    Using these two facts, it is clear to see that we can build a tower of any height.
    The base level is firmly established by the first fact. The second level is firmly
    established by applying the second fact with *k* = 1 to the base case. The third
    level is firmly established by applying the second fact with *k* = 2 to the previous
    result about the second level. Continuing in this way, we can show that any level
    *n* ≥ 1 will be firmly established. This is illustrated in [Figure 8.1](#chapter8.xhtml#fig8_1).


    ![Figure 8.1 The tower analogy for induction](images/fig8_1.jpg)


    [Figure 8.1](#chapter8.xhtml#b8fig8_1) The tower analogy for induction


    ## 8.4 Induction for Analyzing Sorting Run-Time


    When analyzing the running time of sorting algorithms such as selection sort and
    insertion sort, it can be shown that to sort a list of *n* items takes time proportional
    to 1 + 2 + 3 + … + (*n* − 1) time steps. To demonstrate that these sorting algorithms
    take quadratic time, it helps to show that 1 + 2 + 3 + … + (*n* − 1) = *n*(*n* − 1)/2
    for all *n* ≥ 1. Before proving this result, we will take a short detour to introduce
    some notation that you will encounter frequently in this book and in later courses.


    Rather than write out long series such as 1 + 2 + 3 + … + (*n* − 1), we can use
    summation or sigma notation (for the Greek letter used to represent it), as follows:'
