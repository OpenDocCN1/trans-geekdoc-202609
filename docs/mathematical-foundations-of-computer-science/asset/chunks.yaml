    \ 0，即将数字 01 视为 1。\n\n## 2.9 总结与核心概念\n\n- **确定性有限自动机 (DFA)** 是用于计算字符串是否属于某种语言的简单模型。它由**状态**组成，包括一个**起始状态**和一个或多个**接受状态**，状态之间存在转移。\n\
