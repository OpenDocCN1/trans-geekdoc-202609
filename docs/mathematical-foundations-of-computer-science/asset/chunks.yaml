    # 第 13 章 图灵机


    ## 13.1 为什么关注图灵机


    图灵机是计算的标准模型，它们能够处理所有正则语言，并且被认为是[计算完备的](https://doi.org/1201/9781003284)。


    ## 13.2 图灵机示例


    使得 DFA 模型不尽意的缺陷是它具有有限内存，因此无法计数任意大的数字


    ```

    \begin{array}{l} {L = 0^{n}1^{n}:n \geq 0\\}\\end{array}

    ```


    为了解决这一缺陷，图灵机增加了无限长的带子（向左和向右延伸），带子上可以存储字符，这允许我们模拟所有计算机计算。![图 13.1 带有 01 输入的图灵机](img/fig13_1.jpg)


    图 13.1 带有 01 输入的图灵机


    这里有与 DFA 的几个重要的区别：


    *   图灵机不需要所有的状态/符号组合都经过定义。

    *   所定义的转移是确定性的——我们不研究非确定性模型。

    *   与 DFA 只遍历一次字符串不同，图灵机可以多次遍历字符串。

    *   一旦到达接受状态，计算就会停止。


    图灵机的语言是它接受的字符串集。注意这个第一个例子图灵机将接受或拒绝所有字符串，但它可能会通过无限运行来拒绝。这一细节在以后很重要。


    ## 13.3 图灵机的形式定义


    图灵机可以使用以下七元组进行定义。


    ## 13.4 加法识别


    我们的第二个示例将展示图灵机如何识别一进制加法。一进制（或计数计数）是一种非常简单的数值编码，它只有一个符号（通常是 1 或 0），每个正整数由该符号的个数来表示。


    以下语言允许我们通过使用 0 表示第一个数字，使用 1 表示第二个数字，使用 0 表示和，在一进制中识别或检查加法：


    ```

    \begin{array}{l} {L_{+} = \\{ 0^{n}1^{m}0^{n + m}:n,m \geq 0\\}\\\\ \end{array}

    ```


    为了给这个语言设计图灵机，可以使用与上一个示例类似的算法。我们可以通过删除字符串开头的 0 和末尾的 0 来匹配它们。完成后，我们将成对的 1 与末尾的 0
    进行匹配，直到整个字符串被擦除。如果计算的结果是空白带，则计算应该接受。如果字符串不符合给定格式，则计算应该拒绝。


    你还应该验证图灵机在 *n* = 0 时工作正常（例如，通过接受 10 和 1100 但拒绝 110 和 100），在 *m* = 0 时工作正常（例如，通过接受
