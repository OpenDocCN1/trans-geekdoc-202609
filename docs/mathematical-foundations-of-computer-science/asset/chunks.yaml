    ## 1.9 函数


    在计算机科学和本书中，你将大量使用函数。


    将定义域（domain）视为函数输入参数的类型是有用的，就像我们在 `Java` 等强类型语言中所那样；将陪域（codomain）视为函数输出的类型。


    在书的后面，我们将看到对元组具有更复杂定义域和陪域的函数。


    ## 1.10 字符串


    字符串是数学对象，与编程语言中的字符串非常。它们是字符序列，如 `abc` 或 `123`。与编程语言类似，字符串可以相互**拼接**，因此如果我们有两个字符串
    `s[1]= abc` 和 `s[2]= def`，那么拼接后的字符串为 `s[1]s[2]=abcdef`。


    字符串定义在**字母表**集合 `Σ`（希腊字母大写 sigma）上。


    注意，与编程语言字符串不同，我们不在字符串周围包含任何引号。另一个重要的区别是，编程语言允许所有字符（ASCII 或 Unicode），但数学字符串通常被限制在一个较小的字符集中。


    字符串 `s` 的**长度**是其中包含字符的数量，记为 `|s|`。


    长度为零的唯一字符串被称为**空字符串**。它在编程语言中通常用 `""` 表示，但由于数学字符串不使用引号，我们使用希腊字母小写 lambda (`λ`）。有些书也使用小写
    epsilon (`ϵ`）来表示空字符串。


    我们对 `aaaaaaa` 等字符串使用的一种简写方法是使用幂表示将其更简洁地表示为 `a⁷`。我们还可以将其与拼接结合，写出如 `a³b²a³` 的字符串，作为
    `aaabbaaa` 的简写。这种简写也适用于字符串表达式，例如用 `(a b)³` 表示 `ababab`。


    **子字符串**是字符串中任何连续的字符序列。


    **前缀**是字符串的任何起始子字符串。


    **后缀**是字符串末端的任何子字符串。


    注意，上述字符串是按长度升序列出的，并使用通常字典顺序处理相等。这被称为**短字典优先**（shortlex）排序。


    通过几个例子可以最容易地看到：


    注意，短字典优先排序不同于标准的字典排序，例如，字符串 `cat` 排在字符串 `abacus` 之前（因为 `cat` 更短）。


    我们将所有字母表 `Σ` 上的字符串称为 `Σ*`。利用短字典优先排序的概念，我们现在可以在下面的例子中写出 `Σ*` 中的所有字符串：


    ## 1.11 语言


    我们在书中看到的几乎所有的计算都将由识别或接受语言组成。


    我们可以使用数学符号更简洁、更精确地写出语言。


    我们还可以引入字符串变量来更紧凑地写出字符串的集合，如下例：


    “语言”（language）一词源于事实，你所熟悉的语言可以用字符串集来表示。


    我们在书中执行的计算任务随后就变成了确定一个字符串（输入）是否属于特定语言。任何我们可以计算的、具有布尔值输出（真或假）的函数，都可以被认为是返回真的输入字符串集。


    这对你来说可能看起来不寻常，因为加法和乘法（或更复杂的函数）等计算并不是试图确定某物是否属于某个集合的任务。虽然我们确实失去了用语言来描述此类计算的能力，但我们仍然保留了相当强大的表达能力，足以证明关于各种计算模型的许多结果。


    ## 1.12 章节总结与核心概念


    *   **集合**是若干不同对象（数字、字符串、编程语言等）的无序集合。集合中的对象被称为它的**元素**。符号 `x ∈ A` 是我们用来表示 `x`
    是 `A` 的元素的方式，而 `x ∉ A` 是我们表示 `x` 不是 `A` 的元素的方式。

    *   **空集** (∅)是不包含任何元素的唯一集合。

    *   如果一个集合的所有元素都包含另一个集合中，那么这个集合就是另一个集合的**子集**。一个集合总是其自身的子集。

    *   如果两个集合具有相同的元素，则它们是**相等**的。

    *   集合的**基数**是其元素的数量。集合可以是**有限的**或**无限的**。

    *   集合 `ℕ` 是所有自然数，集合 `ℤ` 是所有整数，集合 `ℝ` 是所有实数，集合 `ℚ` 是所有理数（即形式为 `p/q` 的数，其中 `p`
    和 `q` 为整数）。

    *   集合通常用**集合构造**法表示。集合 `A` 和 `B` 的**并集**是 `A ∪ B`。`A` 和 `B` 的**交集**是 `A ∩ B`。`A`
    和 `B` 的**差集**是 `A − B`。

    *   集合 `A` 的**补集**是与全集 `U` 的差。

    *   集合 `A` 的**幂集**是其所有子集的集合，由 `2^|A|` 表示。

    *   **元组**是有序集合。元组集通过**笛卡尔积**创建。

    *   **函数**是从一个**定义域**集合到**陪域**集合的映射。

    *   **字符串**是来自**字母表**的有序序列。`s` 中字符的数量称为其**长度**，记为 `|s|`。长度为零的唯一字符串是 `λ`。

    *   字符串中的任何连续字符序列都是**子字符串**。当该子字符串出现在开头时是**前缀**。当它出现在末尾时是**后缀**。

    *   字符串可以使用**短字典优先**进行排序。在这种排序中，短字符串排在长字符串之前。对于长度相同的字符串，使用它们第一个不同的字符进行排序。

    *   字母表 `Σ` 上的任何字符串集被称为**语言**。语言在计算机科学中广泛用于定义具有相同属性的集合（例如质数或程序语法是否正确）。


