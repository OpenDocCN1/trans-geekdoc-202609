  trans: "\n\n在本节中我们将看到 DFA 和 NFA 接受的语言与正则表达式的语言是完全相同的。这意味着我们可以交替使用这两种思想。此外，我们将构造性地证明它们的等价性，这意味着我们拥有一种方法从任何\
    \ DFA 设计出正则表达式，反之亦然。\n\n## 6.2 将正则表达式转换为 $\\lambda$-NFA\n\n我们将首先学习一种将任何正则表达式转换为\
    \ $\\lambda$-NFA 的程序。然后，该 $\\lambda$-NFA 可以使用第 4 章中的子集构造法转换为 DFA。回想第 5.4 节的内容，正则表达式是使用以下规则递归定义的：\n\
    \n1. 空集的正则表达式为 `∅`。\n2. 集合 `{λ}` 的正则表达式为 `λ`。\n3. 对于每个符号 `s` ∈ `Σ`，集合 `{s}` 的正则表达式为\
    \ `s`。\n4. 对于任意两个正则表达式 `r[1]` 和 `r[2]`，集合 `L(r[1])` ∪ `L(r[2])` 的正则表达式为 `r[1]\
    \ + r[2]`。\n5. 对于任意两个正则表达式 `r[1]` 和 `r[2]`，集合 `{s[1] ⋅ s[2] : s[1] ∈ L(r[1]) ∧\
    \ s[2] ∈ L(r[2])}` 的正则表达式为 `r[1] ⋅ r[2]`。\n6. 对于任意一个正则表达式 `r[1]`，集合 `{s[1]…s[n]\
    \ : n ≥ 0 ∧ s[1], …, s[n] ∈ L(r[1])}` 的正则表达式为 `(r[1])^(\\*)`。\n\n语言 `∅`、`{λ}`\
    \ 和 `{a}`（对于任意 `a` ∈ `Σ`）的 $\\lambda$-NF 分别见图 6.1a、6.1b 和 6.1c。以这些为起点，我们将看到如何构建涉及并、、连接和\
    \ Kleene 星的表达式。\n\n![图 6.1 简单正则表达式的 λ-NAs](img/fig6_1.jpg)\n\n图 6.1 简单正则表达式的 $\\\
    lambda$-NFAs\n\n我们可以通过从一个新的起始状态到两个 $\\lambda$-NFA 的起始状态添加 $\\lambda 转移，为两个已有 $\\\
    lambda$-NFA 的语言并集构造一个 $\\lambda$-NFA。图 6.2 展示了对任意一对 $\\lambda$-NFA 执行此操作的方案。\n\
    \n![图 6.2 两个 λ-NFAs 语言并集的 λ-NFA](img/fig6_2.jpg)\n\n图 6.2 两个 $\\lambda$-NFAs 语言并集的\
    \ $\\lambda$-NFA\n\n我们可以通过从第一个 $\\lambda$-NFA 的每个接受状态（并将其变为非接受状态）到第二个 $\\lambda$-NFA\
    \ 的起始状态添加 $\\lambda 转移，来连接两个 $\\lambda$-NFA 的语言。这在图 6.3 所示的方案中得到了说明。\n\n![图 6.3\
    \ 两个 λ-NFAs 语言连接的 λ-NFA](img/fig6_3.jpg)\n\n图 6.3 两个 $\\lambda$-NFAs 语言连接的 $\\\
    lambda$-NFA\n\n最后，我们可以通过图 6.4 中的方案获取任何 $\\lambda$-NFA 语言的 Kleene 星闭。我们创建一个新的起始状态（在图中标记为\
    \ `q[0]'`），将其设置为接受状态，然后添加一个指向原始 $\\lambda$-NFA 起始状态的 $\\lambda 转移。接着，我们从每个接受状态添加到起始状态\
    \ `q[0]'` 的 $\\lambda 转移。\n\n![图 6.4 λ-NFA 语言 Kleene 星闭的 λ-NFA](img/fig6_4.jpg)\n\
    \n图 6.4 $\\lambda$-NFA 语言的 Kleene 星闭的 $\\lambda$-NFA\n\n我们可以根据需要重复这三个程序，为任何正则表达式创建一个\
    \ NFA。\n\n## 6.3 将 DFA 转换为正则表达式\n\n我们可以使用状态消除算法将 DFA 转换为正则表达式。这本身就有意义，因为对于某些正则语言，定义\
    \ DFA 很容易，但很难构造正则表达式。该算法可以用于从 DFA 中提取正则表达式。在正式定义算法之前，让我们先来看几个例子。\n\n现在，起始状态并不总是唯一的接受状态。在这些情况下，我们必须消除状态直到剩下起始状态和每个接受状态。我们现在对上述两个例子进行泛化。如果我们已经消除到起始状态，且它是一个带有表达式为\
    \ `R` 的自环的接受状态，那么原始 DFA 的正则表达式为 `(R)^(\\*)`。如果存在非起始的接受状态，则将其消除到起始状态和接受状态（如图 6.5\
    \ 所示），最终正则表达式将为 `(R+S)^(\\*)`。\n\n![图 6.5 接受状态不是起始状态时的形式](img/fig_5.jpg)\n\n图\
    \ 6.5 接受状态不是起始状态时的形式\n\n我们现在准备好查看完整的状态消除算法（`Algorithm 6.1`）。注意，如果 `q[0]` 是接受状态，我们也将其消除到\
    \ `q[0]`。让我们看看状态消除算法是如何对图 6.6 中的 DFA 工作的。\n\n![图 6.6 状态消除算法示例 DFA](img/fig_6.jpg)\n\
    \n图 6.6 状态消除算法示例 DFA\n\n最后，为了得到到达任何接受状态 `{q[0], q[1], q[3]}` 的字符串集合，我们合并来自 6.6、6.7\
    \ 和 6.8 的表达式，得到：\n\n$$\\begin{array}{ll} {(00 + 11^{\\ast}0 + (01 + 11^{\\ast}0)^{\\\
    ast})1^{\\ast}} & {+} \\\\ \\{(00 + 01^{\\ast}0)^{\\ast}.} \\end{array}$$\n\n\
    虽然这个公式很长且复杂，但你可以验证它是否正确捕捉了到达每个状态的字符串。在这里，`q[0]` 由具有偶数个数 0 且不以 1 结尾的字符串到达，`q[1]`\
    \ 由具有偶数个数 0 且以 1 结尾的字符串到达，`q[3]` 由具有奇数个数 0 的字符串到达。\n\n## 6.4 正语言的另一种定义\n\n既然我们已经建立了每个有限自动机都有正则表达式，我们可以进一步扩展正则语言的定义。\n\
    \n## 6.5 章总结与核心概念\n\n* 有将任何正则表达式转换为 $\\lambda$-NFA 的程序。\n* 任何 DFA 都可以使用**状态消除**算法转换为正则表达式。\n\
    * **正则语言**是指具有 DFA、NFA 或正则表达式的语言。\n\n## 练习\n\n使用算法为以下正则表达式给出 $\\lambda$-NFA：\n\
    \n* 6.1 `a*b*(a+b*)`\n* 6.2 `(a+b*a*)^(\\*)`\n* 6.3 `a*b* + (*a*b*)^(\\*)`\n*\
    \ 6.4 `(a+b*)^(\\*)(a*b*)(a+b*)^(\\*)`\n* 6.5 `(a+b*b*)^(\\*) + (*b*+a*a*)^(\\\
    *)`\n* 6.6 `(000)^(\\*)`\n* 6.7 `00(0+1)^(\\*)00`\n* 6.8 `0(0+1)^(\\*)0+1(0+1)^(\\\
    *)1`\n* 6.9 `(0+1)^(\\*)0(0+1)²`\n* 6.10 `001^(\\*)00 + 11^(\\*)11 + (01)^(\\\
    *)(0+1)^(\\*)`\n\n为以下语言构造 DFA 并使用本章的状态消除算法创建一个正则表达式。在消除每个状态的过程中展示中间步骤。\n\n* 6.11\
    \ `w ∈ {0,1}^(\\*) : w 的长度为`\n* 6.12 `w ∈ {0,1}^(\\*) : w 具有奇数个数的 1`\n* 6.13 `w\
    \ ∈ {0,1}^(\\*) : w 至少有两个 1`\n* 6.14 `w ∈ {0,1}^(\\*) : w 最多有三个 0`\n* 6.15 `w\
    \ ∈ {0,1}^(\\*) : w 中 0 的个数能被 3 整除`\n* 6.16 `w ∈ {0,1}^(\\*) : w 不包含子串 `01` \n\
    * 6.17 `w ∈ {0,1}^(\\*) : w 具有偶数个数的 0 和奇数个数的 1`\n* 6.18 `w ∈ {0,1}^(\\*) : w 具有偶数个数的\
    \ 0 和偶数个数的 1`\n\n"
- fmt: "\n* 6.19 `{w` ∈ {0, 1}^(\\*) : `w` has an odd number of 0s and an even number\
    \ of 1s\n* 6.20 `{w` ∈ {0, 1}^(\\*) : `w` has an odd number of 0s and an odd number\
    \ of 1s\n* 6.21 `{w` ∈ {0, 1}^(\\*): the number of 1s in `w` is not divisible\
    \ by 4\n\n# Chapter 7 Direct Proof and Closure Properties\n\nDOI: [10.1201/9781003383284-7](https://doi.org/10.1201/9781003383284-7)\n\
    \n## 7.1 Why You Should Care\n\nProofs are the means by which we demonstrate that\
    \ an algorithm does what we intend for it to do. It is usually impossible to test\
    \ all possible inputs to an algorithm so we have to make a logical argument about\
    \ its correctness. Making rigorous arguments then is a critical skill for a computer\
    \ scientist.\n\n## 7.2 Tips for Writing Proofs\n\nWhen writing proofs, here are\
    \ a few rules of thumb to keep in mind:\n\n1. Write in full, grammatical sentences.\
    \ Don't forget punctuation, especially periods after mathematical expressions.\n\
    2. Write in paragraph form.\n3. Show where the proof begins and ends very clearly.\n\
    4. Know your audience. This will tell you how formal you have to be.\n5. Define\
    \ variables before they are used.\n6. Don't start a sentence with math.\n\n##\
    \ 7.3 The Importance of Definitions\n\nWhen making an argument, we have to start\
    \ with some basic assumptions. This is particularly true in the case of direct\
    \ proofs, where we prove statements such as “If `P` is true, then `Q` is true.”\
    \ For this kind of proof, we start by assuming `P` is true and then make a sequence\
    \ of logical arguments to show that `Q` then also must be true. To help us along\
    \ the way, we need to make use of definitions. As an example, consider the following\
    \ two definitions.\n\nWe can now use these definitions to prove theorems such\
    \ as the following.\n\nThis theorem can be re-written as an if/then statement\
    \ as follows.\n\nTo rigorously prove such a theorem, we need to use the above\
    \ definitions to introduce notation for the lengths of the string to get us started.\
    \ To show the result, we will need to use a definition again. The proof of the\
    \ above theorem is given below:\n\nNotice that we start by stating the assumption\
    \ and defining our variables, even if they were defined in the theorem statement.\
    \ This is always the first step in a direct proof. We proceed by unpacking the\
    \ definition of our assumption, in this case introducing more notation to indicate\
    \ that the strings are of even and odd lengths. At this point it is helpful to\
    \ jump ahead to look at what we are trying to prove—here, that the concatenated\
    \ string has odd length. We can work backwards from here by seeing that we will\
    \ need to show using the definition of odd length that the concatenated string\
    \ has odd length in the penultimate step. This gives us a direction for how to\
    \ go about the proof: we must use the notation introduced by the definition of\
    \ even and odd length strings to show that that concatenated string has an odd\
    \ length. All that is left is to develop the reasoning to fill in the middle of\
    \ this proof.\n\nThis proof follows the style conventions mentioned previously.\
    \ We must clearly show where the proof begins by making the assumption and where\
    \ it ends by stating the conclusion. Every step must be written out using complete\
    \ sentences with punctuation, including periods ending sentences with math in\
    \ them. All the variables should be defined before they are used and no sentence\
    \ should start with a mathematical expression. Here is another similar example.\n\
    \nSometimes a proof needs cases. Consider the following definition and theorem.\n\
    \nFor some direct proofs, it is easier to show the contrapositive. Recall from\
    \ [Chapter 3](#chapter3.xhtml) that the contrapositive of the statement `A` ⇒ `B`\
    \ is the statement `¬B` ⇒ `¬A`, and they are logically equivalent. An example\
    \ is given below:\n\nWe sometimes get an exact characterization of a property\
    \ when a conditional statement and its converse is true. To show that `A` ⇔ `B`\
    \ we have to show both `A` ⇒ `B` and `B` ⇒ `A`. This is called an “if and only\
    \ if” (sometimes abbreviated iff) proof.\n\n## 7.4 Numerical Proofs\n\nWhen comparing\
    \ the running time of two algorithms we want to show that one is faster than the\
    \ other. For example, we may have Algorithm A that on an input of size `n` needs\
    \ `10*n` ⅅ+ 4 operations, while Algorithm B needs `n²` operations. If we were\
    \ to only look at small values of `n`, it would appear that Algorithm B is better.\
    \ However, we may want to show that Algorithm A is preferable for larger values\
    \ of `n`. We start by trying different values of `n` until we find one for which\
    \ `10*n` ⅅ+ 4 < `n²`. After some trial and error we find that this inequality\
    \ holds true when `n`  = 11. But perhaps it is no longer true for some larger\
    \ value (like `n`  = 100) ? We can show this is not the case using a direct proof.\n\
    \nHere is another example.\n\n## 7.5 Closure under Set Operations\n\nWe can use\
    \ direct proofs to show that performing a variety of operations on regular languages\
    \ will result in languages that are also regular. This is useful as another way\
    \ to show that a language is regular. For example, showing closure under complements\
    \ easily lets us see that the set\n\n$$\\\\begin{array}{l} {\\\\{ s \\\\in \\\\\
    { a,b\\\\}^{\\\\ast}:s\\\\text{~doesn't\\\\ start\\\\ with\\\\ an~}a\\\\{~~or}s\\\
    \\text{~doesn't\\\\ end\\\\ with\\\\ a~}b\\\\}} \\\\\\\\ \\\\end{array}$$  \n\n\
    is regular because the complement of this set is the language of the expression\
    \ `a(*a` ⅅ+ *b*)^(\\*)b`, which we know is regular as it has a regular expression.\n\
    \nA nearly identical proof shows closure under concatenation:\n\nAs practice,\
    \ use the above technique to show that the following theorem is true:\n\nSometimes\
    \ a proof will require you to use a different version of a definition to show\
    \ the result more easily. We know that there are three equivalent definitions\
    \ for a regular language: the language must have a DFA, an NFA, or a regular expression.\
    \ We take advantage of this in the following result:\n\nOnce we have proved some\
    \ closure properties, we can even start to combine them together. Consider the\
    \ proof for closure under intersections.\n\nHere is another example where we can\
    \ combine several properties to show closure under set difference.\n\nWe can also\
    \ show closure under the reverse operation. We define `w`^(*R*) to be the reverse\
    \ of any string `w`.\n\nWe define the reverse of a language to be the set of strings\
    \ that are the reverse of the strings in the language.\n\nRather than formally\
    \ proving this claim, we will see a construction that demonstrates it for any\
    \ regular language. We'll see a formal proof of the claim in [Chapter 8](#chapter8.xhtml).\n\
    \nAny regular language `L` must have a regular expression `E`. We will see how\
    \ to take the regular expression and convert it into a regular expression for.\
    \ Recall that regular expressions were defined recursively using six rules in\
    \ [Section 5.4](#chapter5.xhtml#sec5_4). We show how to reverse the expression\
    \ for each of these rules as follows:\n\n1. We leave instances of ∅, `λ`, and\
    \ single characters `s` ∈ `Σ` unchanged.\n2. If the expression is of the form\
    \ `E[1]` ⅅ+ `E[2]`, we replace it with the expression `E[1]`^(*R*) ⅅ+ `E[2]`^(*R*)\
    \ (recursively following this procedure for the expressions `E[1]` and `E[2]`).\n\
    3. If the expression is of the form `E[1]` ⅅ⋅ `E[2]`, we replace it with the expression\
    \ `E[2]`^(*R*) ⅅ⋅ `E[1]`^(*R*).\n4. If the expression is of the form (`E[1]`)^(\\\
    *), we replace it with the expression (`E[1]`^(*R*))^(\\*).\n\nWhile we can verify\
