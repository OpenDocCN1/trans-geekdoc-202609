    \ $n \\ge 1$，\n\n$$\\\\begin{array}{l} {P(n):T(n) = 2cn^{\\log\\_{2}3} - 2cn.}\
    \ \\\\\\\\ \\\\end{array}$$  \n\n对于基础情况，当 $n = 1$ 时，我们知道 $T(1) = 0$，且 $2cn^{\\\
    log[2]3} - 2cn = 2c - 2c = 0$。因此 $P(1)$ 成立。\n\n我们固定某个 $k > 1$，并假设归纳假设对于所有 $n <\
    \ k$ 的值都。我们将证明归纳假设对于 $n = k$ 也成立。\n\n当 $n = k$ 时，我们有\n\n$$\\\\begin{matrix} {T(k)}\
    \ & {=} & {3T(k/2) + ck} & & {\\\\text{(by\\\\ the\\\\ definition\\\\ of~}T)}\
    \ \\\\\\\\ & {=} & {3(2c(k/2)^{\\\\log\\_{2}3} - 2ck/2) + ck} & & {\\\\text{(by\\\
    \\ the\\\\ induction\\\\ hypothesis\\\\ when~}n = k/2)} \\\\\\\\ & {=} & {6ck^{\\\
    \\log\\_{2}3}/2^{\\\\log\\_{2}3} - 3ck + ck} & & \\\\text{(algebra)} \\\\\\\\\
    \ & {=} & {2ck^{\\\\log\\_{2}(3)} - 2ck} & & {\\\\text{(as~}2^{\\\\log\\_{2}(3)}\
    \ = 3),} \\\\\\\\ \\\\\\\\end{matrix}$$  \n\n从而证明了归纳步骤。我们可以再次像常一样完成强归纳法的证明。\n\n\
    ## G.7 章节总结与核心概念\n\n- **递归关系（Recurrences）**是递归公式，通常用于表示递归算法的运行时间。\n- **递归树法（recursion\
    \ tree method）**可以用于展开递归关系以获得其精确公式。\n- **代入法（substitution method）**使用强归纳法来形式化证明递归关系的公式。\n\
    \n## 练习题\n\n使用递归树法求解以下递归关系。在每种情况下，假设 $T(1) = 0$。\n\n- G.1 $T(n) = 2T(n/4) + n$\n\
    - G.2 $T(n) = 2T(n/2) + n²$\n- G.3 $T(n) = 7T(n/8) + n$\n- G.4 $T(n) = 3T(n/4)\
    \ + n²$\n- G.5 $T(n) = 5T(n/8) + n³$ 使用代入法（强归纳法）求解以下递归关系。在每种情况下，假设 $T(1) = 0$。（提示：先用树法得到每情况下的归纳假设。）\n\
    - G.6 $T(n) = 2T(n/4) + n$\n- G.7 $T(n) = 2T(n/2) + n²$\n- G.8 $T(n) = 7T(n/8)\
    \ + n$\n- G.9 $T(n) = 3T(n/4) + n²$\n- G.10 $T(n) = 5T(n/8) + n$\n\n## 扩展阅读\n\n\
    关于计算机科学的离散数学书籍有很多，例如 `Epp19`、`FK03`、`GKP89`、`LN22`、`SDB10`。然而，我认为这是第一本用计算理论引入这些离散数学的书。\n\
    \n由于本书旨在介绍计算机科学中的数学思想，对计算理论仅有简要介绍，因此后者中的许多主题被简要讨论过，另一些被省略了。对于希望更多阅读这些主题的人，推荐 `HMU06`、`Mar90`\
    \ 和 `Sip96` 的一些标准教材。若想更深入地了解该主题，可以查看 `HO02`——其中某些处理深受我从本书作者处学到的影响。\n\n对于想要复习书中一些计算机科学基础的学生，推荐\
    \ `Hav20` 编写的《Discovering Computer Science》一书。\n\n我经常喜欢和学生探讨计算机哲学。对于这一点，可以使用斯坦福哲学百科\
    \ `sep24`。\n\n关于算法的更多细节，推荐 Cormen、Leiserson 和 Stein 的算法圣经 `CLRS09`。\n\n要了解更多计算机科学中的概率，请参见\
    \ `MU05`。Motwani 和 Raghavan 的 `95` 是随机算法的标准文本。\n\n## 参考文献\n\n- Thomas H. Cormen,\
    \ Charles E. Leiserson, Ronald L. Rivest, and Clifford Stein. Introduction to\
    \ Algorithms, Third Edition. The MIT Press, 3rd edition, 2009.\n- Susanna `Epp`.\
    \ Discrete Mathematics with Applications. Cengage Learning, 5th edition, 2019.\n\
    - T. Feil and J. Krone. Essential Discrete Mathematics for Computer Science. Prentice\
    \ Hall, 2003.\n- Ronald L. Graham, Donald E. Knuth, and Oren Patashnik. Concrete\
    \ Mathematics: A Foundation for Computer Science. Addison-Wesley, 1989.\n- Jesen\
    \ Havill. Discovering Computer Science: Interdisciplinary Problems, Principles,\
    \ and Python Programming (Second Edition). Chapman and/CRC Press, 2nd edition,\
    \ 2020.\n- J. E. Hopcroft, R. Motwani, and J. D. Ullman. Introduction to Automata,\
    \ Languages, and Computation. Addison Wesley, 3rd edition, 2006.\n- Lane A. Hemaspaandra\
    \ and Mitsunori Ogihara. The Complexity Theory Companion. Springer-Verlag, 2002.\n\
    - David Liben-Nowell. Connecting Discrete Mathematics and Computer Science. Cambridge\
    \ University Press, 2nd edition, 2022.\n- Harry Lewis and Rachel Zax. Essential\
    \ Discrete Mathematics for Computer Science. Princeton University Press, 2019.\n\
    - John C. Martin. Introduction to Languages and the Theory of Computation. McGraw-Hill,\
    \ Inc., USA, 1 edition, 1990.\n- Rajeev Motwani and Prabhakar Raghavan. Randomized\
    \ Algorithms. Cambridge University Press, 1995.\n- Michael Mitzenmacher and Eli\
    \ Upfal. Probability and Computing: Randomized Algorithms and Probabilistic Analysis.\
    \ Cambridge University Press, 2005.\n- Cliff Stein, Robert Drysdale, and Kenneth\
    \ Bogart. Discrete Mathematics for Computer Scientists. Addison-Wesley Publishing\
    \ Company, 2010.\n- Stanford Encyclopedia of Philosophy `sep24`, 2024.\n"
