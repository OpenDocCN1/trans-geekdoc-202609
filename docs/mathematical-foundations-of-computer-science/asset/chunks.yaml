    \ the end.\n\n*   1.92 The set of all strings that start and end with the same\
    \ three characters.\n\n# Chapter 2Deterministic Finite Automata\n\nDOI: [10.1201/9781003383284-2](https://doi.org/10.1201/9781003383284-2)\n\
    \n## 2.1 Why You Should Care\n\nWe are now ready to study a simple model of computation.\
    \ As computer scientists, we have to understand the computing models that we working\
    \ with to determine what is easily computable and (later in this book) what is\
    \ not computable at all. The first model of computation that we will study is\
    \ called a **deterministic finite automaton** or **DFA** (plural: deterministic\
    \ finite automata).\n\n## 2.2 A Vending Machine Example\n\nSuppose that you had\
    \ a vending machine that only accepts nickels (5 cent coins) and dimes (10 cent\
    \ coins) and sold snacks for 20 cents. (Wouldn't it be lovely to be able to buy\
    \ anything for 20 cents!) The DFA for such a machine is given in this example.\n\
    \nThe circles in the diagram are called states and the computation is always at\
    \ exactly one state at any given time. Any computation on this DFA starts at the\
    \ start state (*q*[0] in this example) that is denoted by an arrow entering it.\
    \ The actions that are then performed are the insertion of nickels (denoted with\
    \ an arrow labeled with an N) or dimes (denoted by arrows labeled with a D). These\
    \ actions cause the computation to transition between the states {*q*[0], *q*[5], *q*[10], *q*[15], *q*[20]}.\
    \ Note that arrows with multiple characters have commas separating them, for example\
    \ we can transition from *q*[15] to *q*[20] on either N or D.\n\nThe names of\
    \ the states were picked in such a way to denote how much money has been entered\
    \ into the vending machine. For example, when a dime is entered at state *q*[0],\
    \ the vending machine should transition to the state *q*[10] denoting a total\
    \ of 10 cents that have been entered thus far.\n\nThe state *q*[20] is called\
    \ the final or accepting state and indicates the condition under which the vending\
    \ machine dispenses a snack. It is denoted by a double circle.\n\nFor a DFA to\
    \ be completely defined, each state must have a transition for each possible input\
    \ (in this case a nickel or dime). In particular, in this example, we send any\
    \ over-payment (a dime at *q*[15] or any additional coins at *q*[20]) to *q*[20].\
    \ Conceptually, this represents the idea that the machine should still dispense\
    \ the snack if there is over-payment—it may just eat change.\n\nRather than performing\
    \ any actions, this DFA is designed to capture the set of inputs that should cause\
    \ the machine to dispense a snack. For example, if a user enters a nickel and\
    \ a dime, this input would be represented by the string ND and since it would\
    \ end at state *q*[15] (a non-final state), this input would be rejected—there\
    \ was insufficient money for the snack.\n\nMake sure to follow the transitions\
    \ for each string in the above examples to see why they do(n't) end up at the\
    \ accepting state.\n\nTo solidify your understanding of this example, try to construct\
    \ a DFA for a vending machine for a 30 cent snack. You can also add a Q action\
    \ for quarters (25 cent coins).\n\n## 2.3 Formal Definition of a DFA"
