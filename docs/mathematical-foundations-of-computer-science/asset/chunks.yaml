    ## 11.8 章节总结与核心概念


    *   **鸽巢原理**（pigeonhole principle）指出，如果将超过 `n` 个对象分配到 `n` 个容器中，那么至少有一个容器包含多个对象。

    *   **泵引理**（pumping lemma）展示了所有正则语言必须满足的性质。

    *   我们可以通过假设某个语言是正则的以产生矛盾，并证明泵引理不适用，从而证明该语言不是正则的。


