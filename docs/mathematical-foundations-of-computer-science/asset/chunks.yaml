    \n# 第 9 章 证明 DFA 的语言\n\nDOI: [10.1201/9781003383284-9](https://doi.org/10.1201/9781003383284-9)\n\
    \n## 9.1 为什么你应该关注\n\n现在你已经知道了如何创建 DFA，你应该验证你创建的 DFA 是否确实接受你认为它接受的语言。这类似于证明设计的算法在所有可能的输入上都能给出正确答案，这是每个计算机科学家都应该做的。\n\
    \n## 9.2 简单示例\n\n我们将从下面的简单 DFA 开始（图 9.1）：\n\n![图 9.1 {0,1} 上奇长度字符串的 DFA](img/fig9_1.jpg)\n\
    \n图 9.1 {0,1} 上奇长度字符串的 DFA\n\n显而易见，这个 DFA 接受奇长度的字符串。为什么会这样？直觉上，原因是我们在任何字符上都在 `q[0]`\
    \ 和 `q[1]` 状态之间切换，因此所有偶长度字符串都结束于 `q[0]`，奇长度字符串结束于 `q[1]`。接下来我们将形式化这个想法。\n\n首先，我们需要泛化\
    \ `δ` 函数使其处理字符串而不是符号。这允许我们说明字符串将结束于哪个状态。\n\n更正式地，我们递归地定义 `δ̂(q[i], s)` 如下：\n\n"
- fmt: "\n$$\\begin{array}{l} {\\hat{\\delta}(q_{i},s) = \\left\\{ \\begin{matrix}\
    \ {q_{i},\\\\qquad\\qquad\\qquad\\text{~if~}s = \\lambda} \\\\ {\\delta(\\hat{\\\
    delta}(q_{i},p),c),\\\\qquad\\text{if~}s = pc,\\\\ \\text{where~}p \\in \\Sigma^{\\\
    ast}\\ \\text{and~}c \\in \\Sigma.} \\\\ \\end{matrix} \\right.} \\\\\\\\ \\end{array}$$\
    \  \n\nUsing this new notation, we can see that for the above DFA we have the\
    \ following two criteria for the pair of states. For any string $s \\in \\Sigma^*$,\n\
    \n1. $\\hat{\\delta}(q[0], s) = q[0]$ if and only if $|s|$ is even.\n2. $\\hat{\\\
    delta}(q[0], s) = q[1]$ if and only if $|s|$ is odd.\n\nNote that we always start\
    \ from `q[0]` because this is the start state. It should be fairly clear why proving\
    \ the above pair of statements is sufficient to prove the language of the DFA.\
    \ Since the only accepting state is `q[1]`, the set of strings that reach `q[1]`—the\
    \ odd length strings—is the set that the DFA accepts.\n\nTo prove this result,\
    \ we need a more involved hypothesis, sometimes referred to as a **mutual induction**\
    \ hypothesis. Notice that this hypothesis is over the length of the string $n$\
    \ and thus must be shown true for every string of length $n$. It also has multiple\
    \ parts, one per state of the DFA.\n\nThe base case of this induction hypothesis\
    \ is more involved than usual because we have to prove if and only if results\
    \ for both statements. The proofs for the second part of the hypothesis are very\
    \ similar and you can closely follow much of the language. Pay close attention\
    \ to what has changed from the proof of the first part and be sure to understand\
    \ why the changes are needed.\n\nThe induction wrapup is the same as the previous\
    \ proofs by induction that you have seen before. However, there is an additional\
    \ step where you should tell your reader why the hypothesis proves that the DFA\
    \ does indeed accept the desired language. Specifically, you should tell the reader\
    \ the language of the DFA, which is all the strings that can reach an accepting\
    \ state.\n\n## 9.3 A More Involved Example\n\nThe above example was simple in\
    \ that the DFA had the same transition for both symbols of the alphabet from both\
    \ states. Let us look at a slightly more complex example in which this is not\
    \ the case.\n\nTake a look at the DFA in [Figure 9.2](#chapter9.xhtml#fig9_2)\
    \ and think about what language it accepts.\n\n![Figure 9.2 DFA for all strings\
    \ over { 0,1} that end in 01](images/fig9_2.jpg)\n\n[Figure 9.2](#chapter9.xhtml#b9fig9_2)\
    \ DFA for all strings over {0,1} that end in 01\n\nAfter giving it some thought,\
    \ hopefully you came to the conclusion that this DFA accepts precisely the set\
    \ of strings over $\\Sigma = \\{0,1\\}$ that end in 01. Intuitively, the strings\
    \ that reach state `q[1]` must be precisely the ones that end in 0 and thus the\
    \ strings that reach state `q[2]` must be precisely the ones that end in 01. By\
    \ the process of elimination, this means that the strings that reach state `q[0]`\
    \ are the ones that neither end in 0 nor 01. We use this to once again prove the\
    \ result as above. We wrap the proof up similar to before.\n\n## 9.4 An Example\
    \ with Sink States\n\nHere is another example with sink states.\n\nBefore reading\
    \ on, try to determine the set of strings that can reach the states `q[0]`, `q[1]`,\
    \ `q[2]`, and `q[3]` in [Figure 9.3](#chapter9.xhtml#fig9_3). Some examples of\
    \ strings in each set are given below to help you get started.\n\n![Figure 9.3\
    \ DFA for all strings over { 0,1} that start with 0 and contain a 1](images/fig9_3.jpg)\n\
    \n[Figure 9.3](#chapter9.xhtml#b9fig9_3) DFA for all strings over {0,1} that start\
    \ with 0 and contain a 1\n\nHere are the sets for each state:\n\n* The start state\
    \ `q[0]` has no transitions entering it, so the only string that ends at `q[0]`\
    \ is $\\lambda$. Thus, the set in this case is $\\{\\lambda\\}$.\n* The state\
    \ `q[1]` is a sink state for strings that start with a 1. The set is then $\\\
    {1s : s \\in \\{0,1\\}^*\\}$.\n* The state `q[2]` can only be reached by strings\
    \ that have one or more 0s and no 1s. The set is thus $\\{0^n : n \\ge 1\\}$.\n\
    * Lastly, the state `q[3]` has all the remaining strings, namely the ones that\
    \ start with a 0 and contain a 1. This set is $\\{0st : s, t \\in \\{0,1\\}^*\\\
    }$.\n\nFinally, we wrap up the induction step and explain to the reader how the\
    \ induction tells us the language of the DFA.\n\n## 9.5 Chapter Summary and Key\
    \ Concepts\n\n* We can prove that a DFA accepts a given language using **mutual\
    \ induction**.\n* The function $\\hat{\\delta}$ extends the $\\delta$ function\
    \ of a DFA to apply to strings.\n* The mutual induction **hypothesis** defines\
    \ precisely what set of strings ends at each state.\n* The mutual induction **base\
    \ case** verifies the empty string.\n* The mutual induction **inductive step**\
    \ proves that strings of length $n+1$ end at the correct state assuming that the\
    \ strings of length $n$ do.\n* The mutual induction **conclusion** both concludes\
    \ the induction and demonstrates the language of the DFA by examining the set\
    \ of strings that reach the accepting state(s).\n\n## Exercises\n\nDraw DFAs as\
