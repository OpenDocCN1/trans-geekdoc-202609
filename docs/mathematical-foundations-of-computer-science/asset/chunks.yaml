    \ that all even length strings end at `q[0]` and odd length strings end at `q[1]`.\
    \ We will formalize this idea next.\n\nWe first need to generalize the `δ` function\
    \ to operate on strings rather than symbols. This will allow us say which state\
    \ a string will end up at.\n\nMore formally, we recursively define `δ̂(q[i], s)`\
    \ as follows:\n"
