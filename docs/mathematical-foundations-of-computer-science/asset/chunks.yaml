  trans: '


    类似于计算机代码中的条件语句，我们使用三种操作来修改逻辑语句：与（and）、或（or）和非（not）。


    逻辑`合取`（conjunction，与）是一种仅当它所修改的两个语句都为真时，其取值为真的的操作。它由符号 `∧` 表示。


    逻辑`析取`（disjunction，或）是一种仅当它所修改的两个语句中至少有一个为真时，其取值为真的的操作。它由符号 `∨` 表示。


    逻辑`否定`（negation，非）用符号 `¬` 表示，是对单个表达式的操作，它能将真转为假，将假转为真。


    我们可以使用变量作为逻辑语句的占位符。


    在运算顺序方面，否定操作的优先级最高，所有其他排序都使用括号表示。


    ## 3.4 真值表


    表示涉及上述逻辑表达式的方便方法是使用`真值表`。上一节操作的真值表见图 3.1。值 `true` 和 `false` 缩写为 `T` 和 `F`。


    ![Figure 3.1 Truth table for logical operations](img/fig3_1.jpg)


    图 3.1 逻辑操作真值表


    你可以通过将复杂的表达式拆解为更小的部分来创建真值表。


    与（∧）和或（∨）的符号可能让你联想起集合交集（∩）和集合并集（∪）的符号，这是很有道理的。当你计算两个集合的交集时，你是指结果元素必须在第一个集合中且在第二个集合中。同样，两个集合并集的元素必须在第一个集合中或第二个集合中。


    上述联系意味着某些集合规则可以推广到逻辑语句。接下来的示例显示德·摩根定律之一也适用于逻辑，因为 `¬(A ∨ B)` 的列与 `¬A ∧ ¬B` 的列是相同的。


    由于 `¬(A ∨ B)` 和 `¬A ∧ ¬B` 在真值表中具有完全相同的列，我们称它们是`逻辑等价`的。


    作为一个练习，请证明 `¬(A ∧ B)` 和 `¬A ∨ ¬B` 是逻辑等价的（这是另一个德·摩根定律）。


    ## 3.5 条件语句


    另一个重要的逻辑操作是条件关系。当一个逻辑表达式推导出另一个表达式时适用，并使用运算符 `⇒` 来表示。


    条件语句的真值表见图 3.2。例如，真的表达式总是推导出真的表达式，因此 `T ⇒ T` 为真，而 `T ⇒ F` 为假。然而，假的表达式可以推导出假或真的表达式，所以
    `F ⇒ T` 和 `F ⇒ F` 都是真的。另一种说法是，如果第一个表达式为假或第二个表达式为真，则该操作的结果为真，这种逻辑等价关系通过表格最后一列的
    `¬A ∨ B` 得到了证明。


    ![Figure 3.2 Truth table for conditional operation](img/fig3_2.jpg)


    图 3.2 条件操作真值表


    当人们看到 `F ⇒ T` 是真时，会感到困惑。一个例子有助于理解为什么会这样。


    初学者在逻辑上的一个常见错误是混淆语句与其`逆命题`（converse）。


    快速检查 `P ⇒ Q` 和 `Q ⇒ P` 的真值表会发现这些表达式在逻辑上是不等价的。我们可以从以下示例中直观地看到这一点。


    以后证明条件语句的一个有用工具是使用语句的`逆否命题`（contrapositive）。


    `¬B ⇒ ¬A` 和 `A ⇒ B` 的逻辑等价关系在图 3.3 中所示。


    ![Figure 3.3 Logical equivalence of contrapositive](img/fig3_3.jpg)


    因此，真语句的逆否命题总是真语句。


    我们将定义的最后一个逻辑运算符是`双充分命题`（biconditional）。


    双充分命题的真值表见图 3.4。


    ![Figure 3.4 Truth table for biconditional](img/fig3_4.jpg)


    图 3.4 双充分命题真值表


    ## 3.6 量词


    虽然对于有限集合使用逻辑运算符很容易，但在关于更大的集合时我们需要额外的符号。为此，我们引入两个`量词`：全称量词 `∀` 和存在量词 `∃`。


    这些量词可以交替使用以构成复杂的语句。重要的是量词的`顺序`会改变语句的意思。## 3.7 O 符号法


    量词是计算机科学中无处不在的渐近符号的基础。你在分析算法运行时可能遇到过 O 符号法。在本节中将了解如何定义它。


    假设有一个大小为 `n` 的算法执行 `f(n) = 2n+3` 次操作。对于实际目的来说，当 `n` 很大时，公式中的 `+3` 并不重要。当我们研究函数
    `f` 的增长时，在 O 符号法中，我们说 `f` 是 `O(n)`，即线性的。


    O 符号法的数学定义如下：


    换句话说，对于足够大的 `n` 值，说函数 `f` 被某个常数因子 `g` 所限制。这种定义允许我们将函数的增长率分类为线性 (`O(n)`) 或二次方 (`O(n²)`)。##
    3.8 否定逻辑语句


    你有时需要否定语句，例如，否定 `while` 循环非常重要。


    要否定非量化语句，我们可以应用德·摩根定律得到 `P ∧ Q` 的否定是 `¬P ∨ ¬Q`，且 `P ∨ Q` 的否定是 `¬P ∧ ¬Q`。


    要否定量化语句，必须在否定内部语句之前翻转 `∀` 和 `∃`。## 3.9 章节总结与核心概念


    *   `逻辑语句`是一种取 `true` 或 `false` 值的数学语句。

    *   语句常用的`逻辑操作`包括`合取（and）`、`析取（or）`和`否定（not）`。

    *   `真值表`可以计算逻辑操作并证明两个表达式是`逻辑等价`的。

    *   `条件语句`用于逻辑推导。语句的`逆否命题`与原语句等价。条件语句与其`逆命题`不同。

    *   `全称 ∀ 量词`和`存在 ∃ 量词`允许我们对集合元素做出量化语句。

    *   `O 符号法`允许我们衡量函数的增长率，例如算法的运行时间。

    *   可以通过仔细切换 `∀/∃` 并否定内部语句来`否定`逻辑语句。## 练习


    ### 3.2 练习


    判断以下每个语句的真假。为每个语句给出一个一行的解释。


    *   3.1 (假设 `x=3`) `x ≤ 2`

    *   3.2 (假设 `x=3`) `x < 3`

    *   3.3 (假设 `x=3`) (`x ≤ 3`) ∧ (`x ≤ 2`)

    *   3.4 (假设 `x=3`) (`x ≤ 3`) ∨ (`x ≤ 2`)

    *   3.5 (假设 `x=3` 且 `y=4`) (`x < y`) ∧ (`x+1 ≤ y`)

    *   3.6 每个数字不是偶数就是奇数。

    *   3.7 对于每一个数字，总有一个更大的数字。


    '
