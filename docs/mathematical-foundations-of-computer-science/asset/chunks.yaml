    * 9.5 $w \\in \\{0,1\\}^*$: $w$ has an even number of 0s\n* 9.6 $w \\in \\{0,1\\\
    }^*$: $w$ has an even number of 0s and an odd number of 1s\n* 9.7 $w \\in \\{0,1\\\
    }^*$: $w$ has an even number of 0s and an even number of 1s\n* 9.8 $w \\in \\\
    {0,1\\}^*$: $w$ has an odd number of 0s and an even number of 1s\n* 9.9 $w \\\
    in \\{0,1\\}^*$: $w$ has an odd number of 0s and an odd number of 1s\n* 9.10 $w\
    \ \\in \\{0,1\\}^*$: $w$ starts with 00\n* 9.11 $w \\in \\{0,1\\}^*$: $w$ starts\
    \ and ends with a 0\n* 9.12 $w \\in \\{0,1\\}^*$: $w$ has exactly one 0\n* 9.13\
    \ $w \\in \\{0,1\\}^*$: the number of 0s in $w$ is divisible by 3\n* 9.14 $w \\\
    in \\{0,1\\}^*$: the second character in $w$ is 0\n* 9.15 $w \\in \\{0,1\\}^*$:\
    \ the second last character in $w$ is 0\n\n# Chapter 10 Proof by Contradiction\n\
    \nDOI: [10.1201/9781003383284-10](https://doi.org/10.1201/9781003383284-10)\n\n\
    ## 10.1 Why You Should Care\n\nProof by contradiction is a powerful technique\
    \ that is often the best way to prove many results in computer science. It can\
    \ be an easier way to prove some results than, say, direct proof because it allows\
    \ the prover to assume more facts to be used in the proof.\n\n## 10.2 Overview\
    \ of the Technique\n\nProof by contradiction works by assuming the opposite (negation)\
    \ of what you are trying to prove and then arriving at a contradictory statement\
    \ (usually that a statement and its negation are both true). In other words, the\
    \ structure of proving some statement $S$ looks like the following:\n\n1. Assume\
    \ for a contradiction that the negation of $S$ is true.\n2. Make arguments based\
    \ on this assumption.\n3. Show that you arrive at a contradiction.\n\nThis technique\
    \ gives you a starting point for your proof—assuming the negation of the statement\
    \ you are trying to prove. The tricky part with it is figuring out how to get\
    \ to the final contradiction.\n\n## 10.3 Why You Can't Write $\\sqrt{2}$ as an\
    \ Integer Fraction\n\nThe technique of proof by contradiction dates back at least\
    \ to the ancient Greek who used it to show that $\\sqrt{2}$ is irrational.\n\n\
    The Pythagoreans used proof by contradiction to show that $\\sqrt{2}$ is irrational.\
    \ An interesting side effect of this is that it is impossible to precisely store\
    \ the value of $\\sqrt{2}$ as a float, double, or even using a rational number\
    \ class since we would need infinite precision to capture all the digits in the\
    \ number. We see why next.\n\nIn the above proof we use the fact that the square\
    \ of an odd number is always an odd number. This follows from the fundamental\
    \ theorem of arithmetic.\n"
