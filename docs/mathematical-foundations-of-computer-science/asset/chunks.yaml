    \ `w` is divisible by 7\n- 2.24 `w ∈ {0,1}`: `w` has substring ATG followed later\
    \ by TAA\n- 2.25 `w ∈ {0,1}`: `w` has substring ATG followed later by TAG or TGA\n"
