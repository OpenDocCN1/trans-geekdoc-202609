    证明是我们用来证明一个算法执行了我们预期的任务的手段。通常情况下，对算法的所有可能的输入进行测试是不可能的，因此我们必须对其正确性进行逻辑论证。做出这种严谨的论证是计算机科学家的一项关键技能。


