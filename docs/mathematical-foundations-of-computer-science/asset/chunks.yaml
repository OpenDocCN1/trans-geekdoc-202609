    \ not contain the substring *aa*\n\n*   5.21 Does not end *ab*\n\n    $$\\\\begin{array}{l}\
    \ {\\\\Sigma = \\\\{ a - z,0 - 9,\\\\underset{―}{}\\\\}} \\\\\\\\ \\\\end{array}$$\
    \  \n\n*   5.22 Valid variable name (cannot start with a digit, ignore reserved\
    \ words)\n\n*   5.23 Valid password (at least one letter and one digit)\n\n  \
    \  $$\\\\begin{array}{l} {\\\\Sigma = \\\\{ 0 - 9, - \\\\}} \\\\\\\\ \\\\end{array}$$\
    \  \n\n*   5.24 Valid integer (no leading 0s, but could be negative)\n\n*   5.25\
    \ Phone numbers of the form 555-555-5555\n\nWrite Python code to search strings\
    \ for the following patterns:\n\n*   5.26 Phone numbers of the form (555)-555-5555\n\
    \n*   5.27 Dates of the form MM-DD-YYYY (you don't have to check that the days\
    \ or months are valid)\n\n*   5.28 Email addresses of the form [username@domain.com](http://username@domain.com)\
    \ that could contain the symbols a-z, A-Z, 0-9, and at most one period.\n\n* \
    \  5.29 Email addresses that may have multiple periods (e.g., [username@domain.co.uk](http://username@domain.co.uk))\n\
    \n# Chapter 6Equivalence of Regular Languages and Regular Expressions\n\nDOI:\
    \ [10.1201/9781003383284-6](https://doi.org/10.1201/9781003383284-6)\n\n## 6.1 Why\
    \ You Should Care"
