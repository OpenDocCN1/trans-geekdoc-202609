    # Preface


    The guiding principle behind this book is to make the mathematics needed in computer
    science accessible to students who are motivated by computer science topics. By
    being introduced to mathematical topics just in time to understand the next computer
    science concept, students will be motivated to master the mathematical ideas.
    This book also includes concepts such as automata, regular expressions, grammars,
    Turing machines, and computability, which students may not otherwise see until
    much later courses (if they see them at all).


    I assume that the reader of this book has had an algebra course (not necessarily
    calculus) and has taken an introductory computer science course that covers computer
    arithmetic, functions, iteration, conditionals, and recursion.


    ## Note for Students


    This book is written to be example-heavy—there are over 250 worked examples. As
    you read each concept, work through the examples that come right after. (Keep
    paper and pen handy!) To solidify your understanding, practice the concept using
    the exercises that are given at the end of each chapter—there are over 550. The
    book was written with concision in mind, but this means that there are some sections
    you may have to read through several times to fully understand the ideas. It is
    well worth making sure you understand each section before moving on, as each section
    builds on the previous one(s).


    ## Note for Instructors


    The goal of this book is to introduce students to the mathematical concepts needed
    in computer science just in time to apply them to learning some basic theory of
    computation. I have found that having real computer science topics helps motivate
    the mathematics for most students. The just-in-time philosophy works really well
    with theory of computation topics as you can make connections such as sets/languages
    to DFAs, direct proof to closure properties, induction to proving the language
    of a DFA, and proof by contradiction to the pumping lemma.


    For programs that have a limited number of credits that they can require (such
    as at liberal arts colleges), this book offers a way to fold discrete math and
    automata theory into a single course. It covers most of the standard topics in
    both courses with some exceptions (e.g., pushdown automata). If you choose to
    adopt the approach of this book, your department will have to coordinate learning
    goals between this course and any later theory of computation course that you
    offer.


    While I recommend going through most chapters sequentially, please feel free to
    reorder some topics. The dependencies between chapters are given in [Figure 0.1](#preface.xhtml#fig0_1).
    I prefer to get to DFAs ([Chapter 2](#chapter2.xhtml)) very quickly, but you could
    choose to cover logic ([Chapter 3](#chapter3.xhtml)) before it. When I teach this
    course over 15 weeks, we typically get through the entire book with the exception
    of [Chapters 9](#chapter9.xhtml) and [12](#chapter12.xhtml) and Appendices C and
    E. Depending on time constraints at your institution, you can also choose to not
    spend a lot of time on [Chapter 6](#chapter6.xhtml) and cut some of the later
    theory of computation material ([Chapters 13](#chapter13.xhtml) and [14](#chapter14.xhtml)),
    though it is compelling to get to decidability in this course. The appendices
    are included to cover other topics that are needed by your curriculum. They can
    be taught in any order, except that [Appendix A](#appA.xhtml#appA) (Counting)
    briefly references [Chapter 3](#chapter3.xhtml) (Logic), [Appendix B](#appB.xhtml#appB)
    (Probability) uses [Appendix A](#appA.xhtml#appA), [Appendix D](#appD.xhtml#appD)
    (Asymptotic Notation) relies on [Chapter 3](#chapter3.xhtml) (Logic), and Appendices
    F and G (Loop Invariants and Recurrence Relations) should be covered after [Chapter
    8](#chapter8.xhtml) (Induction).


    ![Figure 1 Chapter dependencies](images/fig0_1.jpg)


    [Figure 1](#preface.xhtml#bfig0_1) Chapter dependencies


    This book was typeset in LaTeX, and all figures were made using TikZ. I recommend
    having your students write up their solutions in LATEX. Many resources for this
    book can be found at [https://personal.denison.edu/~lalla/MFCS](https://personal.denison.edu/~lalla/MFCS).


    If you do end up adopting this book for a course, I would love to hear about it
    at [lalla@denison.edu](mailto:lalla@denison.edu). If you have comments or find
    any typos, please also feel free to reach out.


