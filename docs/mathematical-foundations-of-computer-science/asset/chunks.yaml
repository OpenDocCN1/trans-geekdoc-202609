    This example shows an easy way to design an NFA that accepts the union of two
    regular languages—we can simply create NFAs for the two languages and then create
    an NFA that nondeterministically chooses between them so that the strings from
    both languages are accepted.


    ## 4.4 Formal Definition of an NFA


    Now that you have seen some examples, we can see a formal definition for an NFA.
    An NFA is formally defined by a 5-tuple `(*Q`, `Σ`, `δ`, `q[0]`, `F*)`, where
    `Q` is the set of states, `Σ` is the input alphabet, `δ` : `Q` × `Σ` → `P(Q)`
    is the transition function, `q[0]` is the start state, and `F` is the set of final
    or accepting states.


    Note that the mathematical definition is nearly identical to that of a DFA and
    only `δ` is really different. The `δ` function''s output is now a *set* of states
    since transitions can now go to multiple states from any state/symbol pair. In
    the case that a transition is missing, the output state of `δ` is the empty set
    (∅).


    ## 4.5 Language of an NFA


    With the formal definition of an NFA in hand, let us see how to mathematically
    define which strings an NFA accepts.


    At first glance the above quantified formula looks quite intimidating. However,
    we can break it down to see that the idea is not very complex. It says that the
    string `s = s[1]s[2]s[3]…s[n]` will be accepted if we can find a sequence of states
    `p[0]` through `p[n]` (where `p[0]` is just defined to be the start state `q[0]`)
    such that after each symbol `s[i]` (1 ≤ `i` ≤ `n`) we can use a transition in
    `δ` that takes us from state `p[i−1]` to state `p[i]` on symbol `s[i]` and that
    the last state we reach (`p[n]`) must be an accepting state. We can see this using
    an example.


    ## 4.6 Subset Construction


    The NFA is what is called a generalization of the DFA because it can do all that
    a DFA can do. In particular, we can think of a DFA as an NFA that has exactly
    one transition defined for each state/symbol pair. This might seem to imply that
    NFAs are more powerful than DFAs. However, we will see next that DFAs are capable
    of accepting all the languages that NFAs can accept showing that they are in fact
    equivalent in the languages that they can accept.


    We will show that DFAs are as powerful as NFAs constructively by giving an algorithm
    that can convert any NFA into a DFA with the same language. This algorithm is
    known as the Subset Construction algorithm. For any NFA, we construct a DFA that
    has as its states sets of states from the NFA. The complete Subset Construction
    procedure is given in [Algorithm 4.1](#chapter4.xhtml#algo4_1).


    The algorithm works by creating a DFA that has as states the *sets of states*
    of the NFA. Intuitively, each state of the DFA (a set of states of the NFA) represents
    the set of states that a string can reach. We then have to add in the transitions
    from each state appropriately. If the number of states of the DFA is `n`, we may
    have as many as `2^(n)` subsets of these states. However, in practice the number
    we need often turns out to be a lot smaller. We only create the states that are
    necessary by adding in new states as needed. We start at the state `{q[0]}` since
    `q[0]` is the unique starting state of the NFA and add any new states reachable
    from it. We continue this process until there are no new states and every state
    has all its transitions defined for it.


    Since we can see that any NFA can be converted to a DFA by the Subset Construction
    algorithm, and any DFA can be trivially converted to an NFA, this means that DFAs
    and NFAs accept the same languages. In other words, we can now give an alternative
    definition for regular languages.


    ## 4.7 NFAS with λ Transitions


    There is a variation of the NFA with λ-transitions called a λ-NFA. A λ-transition
    can be followed while not consuming a character of the string. For example, if
    the language is the union of two languages with simple NFAs, we can create an
    NFA with the union of their languages by adding initial λ-transitions, as seen
    in the following example:


    The formal definition of a λ-NFA is identical to that of an NFA except that we
    now add transition rules for `δ` on each state on a `λ` as seen in this example.


    We can also convert a λ-NFA into a DFA using a procedure similar to the Subset
    Construction algorithm. The only difference will be that we have to make sure
    to also follow λ-transitions when determining what set of states can be reached
    from any state.


    ## 4.8 Chapter Summary and Key Concepts


    *   **Nondeterminism** is an important concept in computer science. A **nondeterministic
    finite automaton (NFA)** can nondeterministically transition between states.

    *   The transition function for NFA outputs a **set of states** that can be reached
    on a given state character pair.

    *   A string is accepted by NFA if **there exists a path for it from the start
    state to accepting state**.

    *   The **Subset Construction** algorithm can be used to convert any NFA into
    a DFA.

    *   A **regular language** is one that has a DFA or NFA that accepts it.

    *   A variation of the NFA, called the **λ-NFA**, allows for λ-transitions to
    go from a state to another without consuming a character.


