- fmt: "\nA DFA is formally defined by a 5-tuple (`Q`, `Σ`, `δ`, `q[0]`, `F`). These\
    \ are as follows:\n\n*   `Q` is the set of states\n*   `Σ` is the input alphabet\n\
    *   `δ`: `Q` × `Σ` → `Q` is called the transition function\n*   `q[0]` is the\
    \ start state\n*   `F` is the set of final or accepting states\n\nThese are best\
    \ illustrated with examples.\n\nWhen designing your own DFAs, you should make\
    \ sure the table for the `δ` transition function is fully filled in—every pair\
    \ of state and input symbol must have an entry. This is something easy to forget\
    \ when you are first learning to create DFAs.\n\nNotice how the entire computation\
    \ model can be so precisely captured using the mathematical data types that you\
    \ learned about in [Chapter 1](#chapter1.xhtml), including sets, tuples, alphabets,\
    \ strings, and functions. This is conceptually similar to “coding” up your computation\
    \ using technical notation.\n\nWe give a name to all the languages accepted by\
    \ a DFA:\n\n## 2.4 Matching Phone Numbers\n\nThe next example of a DFA we will\
    \ look at is for one that will identify numbers that start with the author's area\
    \ code (740). This can be represented by the language\n\n$$\\begin{array}{l} \\\
    { 740s:s \\in \\{ 0,\\ldots,9\\}^{\\ast}\\}. \\\\ \\\\ \\end{array}$$  \n\nThe\
    \ next figure shows a DFA that will accept only strings that start with 740. (Note\
    \ that it will accept strings of any length that start with 740, including ones\
    \ that are too short or long to be a phone number, but we will ignore that detail\
    \ for now.)\n\nThis DFA works by moving toward the accepting state `q[3]` precisely\
    \ when the first three symbols are 7, 4, and 0. Notice that the states `q[3]`\
    \ and `q[4]` are what are known as **sink states**. That is, it is impossible\
    \ to leave them once entered. The difference, of course, is that once the state\
    \ `q[3]` is entered, the string is accepted no matter what (it has been confirmed\
    \ to start with 740), whereas once the state `q[4]` is entered the string is definitely\
    \ rejected since it did not start with a 740 pattern.\n\nAs before, we can create\
    \ a tuple for this DFA.\n\nA common error to avoid with DFAs is to be imprecise\
    \ about its language. In particular, someone looking at this DFA might notice\
    \ that it accepts all strings that start with 74 and infer that that is its language.\
    \ Of course, since this DFA does not accept strings such as 747, this is not correct—saying\
    \ that it accepts all strings that start with 74 was too broad.\n\nThe opposite\
    \ problem might occur as well. It might be noted that this DFA does accept all\
    \ strings that start with 7405. This time, the observation is too specific—this\
    \ characterization excludes strings such as 7401234567. Being precise about the\
    \ language of a DFA you are given or that you design is very important. Just as\
    \ with writing code, you want to test your DFA with lots of examples and think\
    \ about special cases.\n\n## 2.5 Computational Biology\n\nYou might have heard\
    \ that DNA is encoded by four types of nucleotides that are represented by the\
    \ letters A, C, G, and T. Sequences of these nucleotides are studied by computational\
    \ biologists to analyze DNA and search for proteins. Our next problem will be\
    \ to take a string of DNA and determine whether the substring of length three\
    \ (called a codon) TTA appears anywhere in it. This can be written as the language\n\
    \n$$\\begin{array}{l} \\{ pTTAs:p,s \\in \\{ A,C,G,T\\}^{\\ast}\\}. \\\\ \\\\\
    \ \\end{array}$$  \n\nFor example, the string GATTACA should be accepted but the\
    \ string CATCAT should not. A DFA for this language is given in the example below:\n\
    \nSimilar to the previous example, we create a path to the accepting state when\
    \ TTA is seen as a substring (`q[0]` → `q[1]` → `q[2]` → `q[3]`). This time, however,\
    \ the substring can be in any part of the string, so we have to be careful about\
    \ the other transitions. It is useful here to think about what strings should\
    \ reach each of the states. Since we have to keep track of whether the substring\
    \ TTA has appeared, we use states to remember our progress toward this goal. We\
    \ use `q[1]` to denote the case that we have not yet found a TTA substring and\
    \ we have most recently encountered a single T (but not a TT). The state `q[2]`\
    \ is reachable by strings for which we have not yet found a TTA substring and\
    \ we have most recently encountered a TT. The accepting sink state `q[3]` is reached\
    \ once we have encountered the entire substring TTA. The start state `q[0]` then\
    \ is reachable from all other strings.\n\nArmed with this intuition, we can understand\
    \ why all the transitions were chosen in [Example 2.6](#chapter2.xhtml#exam2_6).\
    \ Any transition out of a state that does not make progress toward the goal of\
    \ identifying the string TTA should go back to state `q[0]`. For example, the\
    \ state `q[1]` returns to `q[0]` on an A, C, or G.\n\n## 2.6 Stop Codons\n\nOur\
    \ next example, also from biology, will be to identify strings that do not end\
    \ with the TAG. That is, we want to accept the complement of the language `{x:x\
    \ \\in {A,C,G,T}*}`. Just like the previous example, we need to create states\
    \ that will allow us to keep track of whether the last three symbols were TAG.\
    \ We will use `q[1]` to represent whether the last symbol seen was T, `q[2]` to\
    \ represent whether the last two symbols were TA, and `q[3]` to represent whether\
    \ they were TAG. The state `q[0]` will again catch all the remaining strings.\
    \ The resulting DFA is shown below:\n\nNotice here that, unlike the previous example,\
    \ we accept strings that reach any state other than `q[3]`. Since we have multiple\
    \ accepting states, `F` really has to be a set to hold all of them.\n\n## 2.7\
    \ Divvying Up Candy\n\nA mom wants to split up the candy between her two kids\
    \ and wants to know if she can divide it evenly. There are three types of candies:\
    \ chocolates, lollipops, and taffy. The mom wants to make sure that there is an\
    \ even number of chocolates and lollipops, but she doesn't care about the taffy\
    \ since neither kid likes it.\n\nWe will create a DFA that will determine whether\
    \ a pile of candies can be evenly divided ways. The pile will be represented by\
    \ a string in which chocolates, lollipops, and taffy are represented by the letters\
    \ C, L, and T, respectively. For example, the DFA should accept the strings CLTTLLLC\
    \ and TCCTT since they have an even number of chocolates and an even number of\
    \ lollipops. The DFA should reject the string TLLC and TLC because the first has\
    \ an odd number of chocolates and the second has an odd number of both chocolates\
    \ and lollipops.\n\nTo design a DFA for this problem, we have to think about the\
    \ possible states that we need to represent. Specifically, we care if there is\
    \ an even or an odd number of chocolates, and similarly for the lollipops. Since\
    \ the number of chocolates and lollipops are unrelated numbers, we will have a\
    \ total of four possibilities: both even, odd chocolates and even lollipops, even\
    \ chocolates and odd lollipops, and both odd. Armed with this intuition, we design\
    \ the DFA seen in the example below:\n"
  raw: "A DFA is formally defined by a 5-tuple (*Q*, *Σ*, *δ*, *q*[0], *F*). These\
    \ are as follows:\n\n*   *Q* is the set of states\n\n*   Σ is the input alphabet\n\
    \n*   *δ* : *Q* × *Σ* → *Q* is called the transition function\n\n*   *q*[0] is\
    \ the start state\n\n*   *F* is the set of final or accepting states\n\nThese\
    \ are best illustrated with examples.\n\nWhen designing your own DFAs, you should\
    \ make sure that the table for the *δ* transition function is fully filled in—every\
    \ pair of state and input symbol must have an entry. This is something easy to\
    \ forget when you are first learning to create DFAs.\n\nNotice how the entire\
    \ computation model can be so precisely captured using the mathematical data types\
    \ that you learned about in [Chapter 1](#chapter1.xhtml), including sets, tuples,\
    \ alphabets, strings, and functions. This is conceptually similar to “coding”\
    \ up your computation using technical notation.\n\nWe give a name to all the languages\
    \ accepted by a DFA:\n\n## 2.4 Matching Phone Numbers\n\nThe next example of a\
    \ DFA we will look at is for one that will identify numbers that start with the\
    \ author's area code (740). This can be represented by the language\n\n$$\\\\\
    begin{array}{l} {\\\\{ 740s:s \\\\in \\\\{ 0,\\\\ldots,9\\\\}^{\\\\ast}\\\\}.}\
    \ \\\\\\\\ \\\\end{array}$$  \n\nThe next figure shows a DFA that will accept\
    \ only strings that start with 740. (Note that it will accept strings of any length\
    \ that start with 740, including ones that are too short or long to be a phone\
    \ number, but we will ignore that detail for now.)\n\nThis DFA works by moving\
    \ toward the accepting state (*q*[3]) precisely when the first three symbols are\
    \ 7, 4, and 0. Notice that the states *q*[3] and *q*[4] are what are known as\
    \ **sink states**. That is, it is impossible to leave them once entered. The difference,\
    \ of course, is that once the state *q*[3] is entered, the string is accepted\
    \ no matter what (it has been confirmed to start with 740), whereas once the state\
    \ *q*[4] is entered the string is definitely rejected since it did not start with\
    \ a 740 pattern.\n\nAs before, we can create a tuple for this DFA.\n\nA common\
    \ error to avoid with DFAs is to be imprecise about its language. In particular,\
    \ someone looking at this DFA might notice that it accepts all strings that start\
    \ with 74 and infer that that is its language. Of course, since this DFA does\
    \ not accept strings such as 747, this is not correct—saying that it accepts all\
    \ strings that start with 74 was too broad.\n\nThe opposite problem might occur\
    \ as well. It might be noted that this DFA does accept all strings that start\
    \ with 7405. This time, the observation is too specific—this characterization\
    \ excludes strings such as 7401234567. Being precise about the language of a DFA\
    \ you are given or that you design is very important. Just as with writing code,\
    \ you want to test your DFA with lots of examples and think about special cases.\n\
    \n## 2.5 Computational Biology\n\nYou might have heard that DNA is encoded by\
    \ four types of nucleotides that are represented by the letters A, C, G, and T.\
    \ Sequences of these nucleotides are studied by computational biologists to analyze\
    \ DNA and search for proteins. Our next problem will be to take a string of DNA\
    \ and determine whether the substring of length three (called a codon) TTA appears\
    \ anywhere in it. This can be written as the language\n\n$$\\\\begin{array}{l}\
    \ {\\\\{ pTTAs:p,s \\\\in \\\\{ A,C,G,T\\\\}^{\\\\ast}\\\\}.} \\\\\\\\ \\\\end{array}$$\
    \  \n\nFor example, the string GATTACA should be accepted but the string CATCAT\
    \ should not. A DFA for this language is given in the example below:\n\nSimilar\
    \ to the previous example, we create a path to the accepting state when TTA is\
    \ seen as a substring (*q*[0] → *q*[1] → *q*[2] → *q*[3]). This time, however,\
    \ the substring can be in any part of the string, so we have to be careful about\
    \ the other transitions. It is useful here to think about what strings should\
    \ reach each of the states. Since we have to keep track of whether the substring\
    \ TTA has appeared, we use states to remember our progress toward this goal. We\
    \ use *q*[1] to denote the case that we have not yet found a TTA substring and\
    \ we have most recently encountered a single T (but not a TT). The state *q*[2]\
    \ is reachable by strings for which we have not yet found a TTA substring and\
    \ we have most recently encountered a TT. The accepting sink state *q*[3] is reached\
    \ once we have encountered the entire substring TTA. The start state *q*[0] then\
    \ is reachable from all other strings.\n\nArmed with this intuition, we can understand\
    \ why all the transitions were chosen in [Example 2.6](#chapter2.xhtml#exam2_6).\
    \ Any transition out of a state that does not make progress toward the goal of\
    \ identifying the string TTA should go back to state *q*[0]. For example, the\
    \ state *q*[1] returns to *q*[0] on an A, C, or G. The only exception here is\
    \ that *q*[2] on a T self-loops since the past two characters were still TT, so\
    \ we want to stay on *q*[2] on a T.\n\nAs with the other DFAs, trace the path\
    \ for strings in the language such as TTA, ATTGTTA, and ATTTTAGC to see why they\
    \ get to the accepting state as well as why other strings such as TTG, TATTCTT,\
    \ and TTTTGTT do not get to the accepting state.\n\nGenerating the tuple for this\
    \ DFA is left as an exercise for the reader.\n\n## 2.6 Stop Codons\n\nOur next\
    \ example, also from computational biology, will be to identify strings that do\
    \ *not* end with the stop codon TAG. That is, we want to accept the complement\
    \ of the language {*x**T**A**G* : *x* ∈ {*A*, *C*, *G*, *T*}^(\\*)}. Just like\
    \ the previous example, we need to create states that will allow us to keep track\
    \ of whether the last three symbols were T, A, and G. We will use a state *q*[1]\
    \ to represent whether the last symbol seen was a T, *q*[2] to represent whether\
    \ the last two symbols were TA, and *q*[3] to represent whether the last three\
    \ symbols were TAG. The state *q*[0] will once again catch all the remaining strings.\
    \ The resulting DFA is shown below:\n\nNotice here that, unlike the previous example,\
    \ we accept strings that reach any state other than *q*[3]. Since we have multiple\
    \ accepting states, *F* really has to be a set to hold all of them.\n\nAgain,\
    \ practice creating the tuple for this DFA.\n\n## 2.7 Divvying Up Candy\n\nA mom\
    \ wants to split up the candy between her two kids and wants to know if she can\
    \ divide it evenly between them. There are three types of candies: chocolates,\
    \ lollipops, and taffy. The mom wants to make sure that there is an even number\
    \ of chocolates and lollipops, but she doesn't care about the taffy since neither\
    \ kid likes it.\n\nWe will create a DFA that will determine whether a pile of\
    \ candies can be evenly divided two ways. The pile will be represented by a string\
    \ in which chocolates, lollipops, and taffy are represented by the letters C,\
    \ L, and T, respectively. For example, the DFA should accept the strings CLTTLLLC\
    \ and TCCTT since they have an even number of chocolates and an even number of\
    \ lollipops. The DFA should reject the string TLLC and TLC because the first has\
    \ an odd number of chocolates and the second has an odd number of both chocolates\
    \ and lollipops.\n\nTo design a DFA for this problem, we have to think about the\
    \ possible states that we need to represent. Specifically, we care if there is\
    \ an even or an odd number of chocolates, and similarly for the lollipops. Since\
    \ the number of chocolates and lollipops are unrelated numbers, we will have a\
    \ total of four possibilities: both even, odd chocolates and even lollipops, even\
    \ chocolates and odd lollipops, and both odd. Armed with this intuition, we design\
    \ the DFA seen in the example below:"
