    # Introduction


    1. Asymptotic notation is about the growth rate of functions and not just the
    running time of an algorithm. Thus, for example, you should say that an algorithm
    has `O(n)` `running time` and not simply that an algorithm is `O(n)`. Asymptotic
    notation can also be used to analyze memory, disk usage, number of database queries,
    and other properties of algorithms.


    2. Never say “at least Big-O” since Big-O is an upper bound. Instead, use `Ω`
    or, better yet, `Θ` notation. When in doubt, be precise and use `Θ` notation unless
    you really don''t have an exact characterization of the function.


    3. While it is the case that `2*n = O(n)` and `3*n = O(n)`, be wary of any circumstance
    in which you get something like `n + n + ... + n` (`n` times) = `O(n)` since this
    is not true.


    ## D.7 Chapter Summary and Key Concepts


    * **Asymptotic notation** allows us to compare the growth rate of functions. It
    is used extensively when analyzing the time and memory used by algorithms.


    * **Theta (Θ) notation** is used to exactly capture the growth rate of a function.
    We say `f(n)` is `Θ(g(n))` if there exists `n[0]`, `c[1]`, `c[2] > 0` such that
    for all `n ≥ n[0]` we have that `c[1]*g(n) ≤ f(n) ≤ c[2]*g(n)`.


    * **Big-O (O) notation** is used to compute upper bounds on a function. We say
    `f(n)` is `O(g(n))` if there exists `n[0]`, `c > 0` such that for all `n ≥ n[0]`
    we have that `f(n) ≤ c*g(n)`.


    * **Big-Omega (Ω)** is used to compute lower bounds on a function. We say that
    `f(n)` is `Ω(g(n))` if there exists `n[0]`, `c > 0` such that for all `n ≥ n[0]`
    we have that `c*g(n) ≤ f(n)`.


    * **Little-o (o) notation** is used to compute strict upper bounds on a function.
    We say that `f(n)` is `o(g(n))` if for all `c > 0` there exists a constant `n[0]
    > 0` such that for all `n ≥ n[0]` we have that `f(n) < c*g(n)`.


    * **Little-omega (ω) notation** is used to compute strict lower bounds on a function.
    We say that `f(n)` is `ω(g(n))` if for all `c > 0` there exists a constant `n[0]
    > 0` such that for all `n ≥ n[0]` we have that `c*g(n) < f(n)`.


