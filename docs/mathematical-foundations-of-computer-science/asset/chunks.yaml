    \ A *λ*\\-NFA for the union of the languages of two *λ*\\-NFAs\n\nWe can concatenate\
    \ the language of two *λ*\\-NFAs by adding *λ*\\-transitions from each of the\
    \ accepting states of the first *λ*\\-NFA (and making them non-accepting) to the\
    \ start state of the second *λ*\\-NFA. This is illustrated in the scheme shown\
    \ in [Figure 6.3](#chapter6.xhtml#fig6_3).\n\n![Figure 6.3 A λ-NFA for the concatenation\
    \ of the languages of two λ-NFAs](images/fig6_3.jpg)\n\n[Figure 6.3](#chapter6.xhtml#b6fig6_3)\
    \ A *λ*\\-NFA for the concatenation of the languages of two *λ*\\-NFAs\n\nLastly,\
    \ we can take the Kleene \\* of the language of any *λ*\\-NFA by using the scheme\
    \ in [Figure 6.4](#chapter6.xhtml#fig6_4). We create a new start state (labeled\
    \ *q*[0]^′ in the figure), make it accepting, and then add a *λ*\\-transition\
    \ to the start state of the original *λ*\\-NFA. We then add *λ*\\-transitions\
    \ from each accepting state back to the start state *q*[0]^′.\n\n![Figure 6.4\
    \ A λ-NFA for the Kleene \\* of the language of a λ-NFA](images/fig6_4.jpg)\n\n\
    [Figure 6.4](#chapter6.xhtml#b6fig6_4) A *λ*\\-NFA for the Kleene \\* of the language\
    \ of a *λ*\\-NFA\n\nWe can create an NFA for any regular expression by repeating\
    \ these three procedures as needed.\n\n## 6.3 Converting a Dfa to a Regular Expression\n\
    \nWe can convert DFAs to regular expressions using a state elimination algorithm.\
    \ This is useful in and of itself because there are some regular languages for\
    \ which it is easy to define a DFA, but hard to come up with a regular expression.\
    \ This algorithm then can be used to extract a regular expression from a DFA.\
    \ Before formally defining the algorithm, let us see a few simple examples.\n\n\
    Now, it will not always be the case that the starting state is the only accepting\
    \ one. In these situations, we must eliminate states down to just the start state\
    \ and each accepting state. We see an example of this next.\n\nWe can now generalize\
    \ the above two examples for any DFA. If we have eliminated down to the start\
    \ state and it is an accepting state with a self-loop with expression *R*, then\
    \ the regular expression for the original DFA was (*R*)^(\\*). If there is a non-starting\
    \ accepting state, then we eliminate down to the start state and the accepting\
    \ state as in [Figure 6.5](#chapter6.xhtml#fig6_5) and the final regular expression\
    \ will be (*R* + *S**U*^(\\*)*T*)^(\\*)*S**U*^(\\*).\n\n![Figure 6.5 General form\
    \ for when the accepting state is not the start state](images/fig6_5.jpg)\n\n\
    [Figure 6.5](#chapter6.xhtml#b6fig6_5) General form for when the accepting state\
    \ is not the start state\n\nWe are now ready to see the full algorithm for state\
    \ elimination ([Algorithm 6.1](#chapter6.xhtml#algo6_1)). Note that if *q*[0]\
    \ is an accepting state, we also eliminate down to just *q*[0] by itself.\n\n\
    Let us see one more example with multiple accepting states. We will see how the\
    \ State Elimination algorithm works on the DFA in [Figure 6.6](#chapter6.xhtml#fig6_6).\n\
    \n![Figure 6.6 Example DFA for State Elimination algorithm](images/fig6_6.jpg)\n\
    \n[Figure 6.6](#chapter6.xhtml#b6fig6_6) Example DFA for State Elimination algorithm\n\
    \nFinally, to get the set of strings that can reach any of the accepting states\
    \ {*q*[0], *q*[1], *q*[3]}, we union the expressions from [Examples 6.6](#chapter6.xhtml#exam6_6),\
    \ [6.7](#chapter6.xhtml#exam6_7), and [6.8](#chapter6.xhtml#exam6_8), to get the\
    \ expression\n\n$$\\\\begin{array}{ll} {(00 + 11^{\\\\ast}00 + (01 + 11^{\\\\\
    ast}01)1^{\\\\ast}0)^{\\\\ast}(01 + 11^{\\\\ast}01)1^{\\\\ast}} & {+} \\\\\\\\\
    \ {(00 + 011^{\\\\ast}0 + 11^{\\\\ast}(00 + 011^{\\\\ast}0))^{\\\\ast}11^{\\\\\
    ast}} & {+} \\\\\\\\ {(00 + 011^{\\\\ast}0 + 11^{\\\\ast}(00 + 011^{\\\\ast}0))^{\\\
    \\ast}.} & \\\\\\\\ \\\\end{array}$$  \n\nWhile this formula is long and complicated,\
    \ you can verify that it correctly captures the strings that get to each state.\
    \ Here, *q*[0] is reachable by strings that have an even number of 0s and don't\
    \ end in 1, *q*[1] is reachable by strings with an even number of 0s and do end\
    \ in 1, and *q*[3] is reachable by strings that have an odd number of 0s and do\
    \ end in 1.\n\n## 6.4 Another Definition for Regular Languages\n\nNow that we\
    \ have established that the language of every finite automaton has a regular expression\
    \ and vice versa, we can expand our definition of regular languages even further.\n\
    \n## 6.5 Chapter Summary and Key Concepts\n\n*   There is a procedure for converting\
    \ any regular expression into a *λ*\\-NFA.\n\n*   Any DFA can be converted to\
    \ a regular expression using the **State Elimination** algorithm.\n\n*   A **regular\
    \ language** is one that has a DFA, NFA, or regular expression.\n\n## EXERCISES\n\
    \nGive *λ*\\-NFAs *using the algorithm in this chapter* for the regular expressions\
    \ below:\n\n*   6.1 *a**b*(*a* + *b*)\n\n*   6.2 (*a* + *b**a*)^(\\*)\n\n*   6.3\
    \ *a**b* + (*a**b*)^(\\*)\n\n*   6.4 (*a* + *b*)^(\\*)(*a**b*)(*a* + *b*)^(\\\
    *)\n\n*   6.5 (*a* + *b**b*)^(\\*) + (*b* + *a**a*)^(\\*)\n\n*   6.6 (000)^(\\\
    *)\n\n*   6.7 00(0 + 1)^(\\*)00\n\n*   6.8 0(0 + 1)^(\\*)0 + 1(0 + 1)^(\\*)1\n\
    \n*   6.9 (0 + 1)^(\\*)0(0 + 1)²\n\n*   6.10 001^(\\*)00 + 110^(\\*)11 + (01)^(\\\
    *)(0 + 11)^(\\*)\n\nConstruct DFAs for the following languages and *use the state\
    \ elimination algorithm in this chapter* to create a regular expression for each.\
    \ Show the intermediate steps as you eliminate each state along the way.\n\n*\
    \   6.11 {*w* ∈ {0, 1}^(\\*) : *w* is of even length}\n\n*   6.12 {*w* ∈ {0, 1}^(\\\
    *) : *w* has an odd number of 1s}\n\n*   6.13 {*w* ∈ {0, 1}^(\\*) : *w* has at\
    \ least two 1s}\n\n*   6.14 {*w* ∈ {0, 1}^(\\*) : *w* has at most three 0s}\n\n\
    *   6.15 {*w* ∈ {0, 1}^(\\*): the number of 0s in *w* is divisible by 3}\n\n*\
    \   6.16 {*w* ∈ {0, 1}^(\\*) : *w* does not have 01 as a substring}\n\n*   6.17\
    \ {*w* ∈ {0, 1}^(\\*) : *w* has an even number of 0s and an odd number of 1s}\n\
    \n*   6.18 {*w* ∈ {0, 1}^(\\*) : *w* has an even number of 0s and an even number\
    \ of 1s}"
