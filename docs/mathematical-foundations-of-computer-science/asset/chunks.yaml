    # Chapter 4Nondeterministic Finite Automata


    DOI: [10.1201/9781003383284-4](https://doi.org/10.1201/9781003383284-4)


    ## 4.1 Why You Should Care


    Nondeterministic Finite Automata (NFAs) allow us to create simpler, often smaller,
    automata for the same language. They are a generalization of DFAs that add in
    a property called nondeterminism. While nondeterminism is not something that any
    real computer can exhibit, it is an important concept for much of theoretical
    computer science. In particular, in later courses you will learn about hard NP-complete
    problems for which nondeterminism is an integral concept to understand.


    ## 4.2 Why NFAS Can be Simpler Than Dfas


    We will start with an example of a language that is tricky to get a correct DFA
    for and then see how to create an exceedingly simple NFA for it. Consider the
    language *L* = {*s* ∈ {0, 1}^(\*) : *s* ends in 010101}. A DFA for this language
    is given below:


    This DFA works by having states for strings that end in each of the following
    prefixes of 010101: 0, 01, 010, 0101, 01010, and 010101 (states *q*[1] through
    *q*[6]). However, you have to be careful about where each transition goes to maintain
    the correct prefix property for each state, making the diagram fairly complicated.


    In contrast, consider an NFA for the same language in the following example:


    Let us use this example to understand a few differences between NFAs and DFAs.
    You may first notice that the state *q*[0] has two possible destinations on a
    0. Nondeterminism means that the NFA is able to follow either transition. The
    diagram is also a lot simpler because there are no transitions for many state/symbol
    pairs—for example, there is no transition from *q*[1] on a 0. These are two of
    the major differences between NFAs and DFAs. The other big difference to understand
    is how strings are accepted.


    An NFA accepts a string if there exists a legal path from *q*[0] to an accepting
    state while traversing the string. For example, the string 010101 is accepted
    by the NFA since it can follow the transitions to *q*[1] on the first 0, to *q*[2]
    on the first 1, and so on, until it reaches the accepting state *q*[6]. Importantly,
    there may be other paths that don''t lead to an accepting state, but this doesn''t
    change the fact that an accepting path exists. For example, an alternate processing
    of string 010101 would be to stay at *q*[0] and thus reject. Yet another rejecting
    path would be to stay at *q*[0] for 0101 and then get to *q*[2] on the final 01.
    However, since there does exist at least one accepting path, we ignore all the
    rejecting paths and conclude that 010101 is accepted by the NFA.


    Now, to understand why this NFA accepts the correct language, we will see that
    it accepts all strings that end in 010101 and no others. For any string that does
    end in 010101, we can self-loop at *q*[0] until such time that we arrive at the
    sixth last symbol and then follow the transitions to *q*[6]. Conversely, the only
    strings that can be accepted must end in 010101 as that is the sequence that must
    be followed to arrive at the only accepting state *q*[6]. Also note that there
    are no transitions out of *q*[6], so the string really must end in 010101 to be
    accepted.


    ## 4.3 More Example Nfas


    This last example shows us a way to easily create an NFA for any finite language.'
