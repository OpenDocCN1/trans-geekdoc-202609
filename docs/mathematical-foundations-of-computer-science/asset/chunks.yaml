    # Appendix B Probability


    ## B.1 Why You Should Care


    Computer scientists need to know about probability to be able to design randomized
    algorithms—ones that have random choices made in them. Randomized algorithms are
    useful because they can either improve the expected running time (these are called
    Las Vegas algorithms) or allow faster computation at the expense of a small probability
    of failure (called Monte Carlo algorithms). In addition, randomness is important
    for designing data structures such as hash functions, computing in scientific
    applications such as Monte Carlo simulations, and making video game AI opponents
    less predictable.


    ## B.2 Sample Spaces


    When studying probabilities of events, we must first consider the sample space
    of possibilities. For example, when you roll a six-sided die there are six possible
    outcomes or possible rolls. When you flip a coin there are two outcomes (heads
    or tails). This set is called the sample space.


    ## B.3 Events


    When studying probability, we will often want to group together a number of outcomes
    and refer to them collectively as an event.


    The probability of an event is simply the sum of probabilities of the outcomes
    that make up that event.


    The probability of the complement of an event is one minus the probability of
    the event itself.


    For mutually exclusive events, the probability that either event happens is the
    sum of the probabilities of the two events.


    A pair of events is called `independent` if neither event affects the probability
    of the other.


    We now recast the definition mathematically.


    ## B.4 Chapter Summary and Key Concepts


    *   The `sample space` of a random trial is the set of all possible outcomes of
    the trial.


    *   The `probability` of an outcome `x` is denoted by `Pr(x)`, where `0 ≤ Pr(x)
    ≤ 1`. The sum of the probabilities of all the outcomes in the sample space must
    be 1.


    *   An `event` is a subset of a sample space. The probability of the event is
    the sum of the probabilities of the outcomes that make up the event.


    *   The `complement` of an event is the complement of the event set.


    *   Two events are called `mutually exclusive` if their sets do not intersect.


    *   Two events are called `independent` if neither affects the probability of
    the other.


