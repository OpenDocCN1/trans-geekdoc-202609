    ## 2. Treating `P(n)` as a number

    A common error, particularly in proofs involving summations, is to treat `P(n)`
    as a number. Remember that `P(n)` is a logical statement and can only take on
    the values true and false.


    ## 3. Omitting the base step

    If we don''t check the base case, we can run into serious issues. For example,
    consider the following untrue claim:


    $$\\begin{array}{l} {P(n):3^{n}\\text{~is\\ even,\\ for\\ all~}n \geq 1} \\ \\end{array}$$


    Proof (inductive step): Fix some `k`  ≥ 1. We assume the hypothesis is true for
    `n`  = `k`, that is `3^(k)` is even. This means that we can write `3^(k)` = 2*f`
    for some `f`  ≥ 1. Then, `3^(k)` + 1) can be written as `3^(k)` + 1) = 3^(k)` ⋅ 3 = 2*f* ⋅ 3,
    which means that `3^(k)` + 1) is even as it can be written as `2(3f)`.


    This proof must clearly be erroneous since we know that no natural number power
    of 3 is even. This proof breaks down because the base step does not hold—when
    `n`  = 1, `3^(n)` = 3 is not an even number.


    ## 4. Making an error in the inductive step

    When proving the inductive step, you have to make sure that the proof works for
    all stated values. The following is an example of an incorrect proof that all
    horses are the same color!


    $$\\begin{array}{l} {P(n):\\text{~every\\horse\\in\\ a\\ set\\ of~}n\\text{~horses\\
    has\\ the\\ same\\color,\\ for\\ all~}n \\geq 1} \\ \\end{array}$$


    Base step: When `n`  = 1, there is only one horse in the set and thus every horse
    in that set has the same color.


    Inductive step: Fix some `k`  ≥ 1. We assume the hypothesis is true for `n`  = `k`.
    When `n`  = `k`  + 1 we exclude the first horse and get a set of size `k` for
    which we know that all the horses are the same color (by the induction hypothesis).
    Again, doing the same but this time excluding the last horse, we get that all
    the horses in this set are the same color. Now, since both sets have horses of
    the same color, it follows that all the `k` + `1` horses are the same color.


    The error here stems from the fact that the inductive step does not work when
    showing that `P(2)` is true. The last statement in the proof is false.


    ## 8.8 Strong Induction

    Sometimes, regular induction is hard to make work because we cannot build the
    argument based on one smaller value of `n`. In such cases, we need a stronger
    hypothesis—that the induction hypothesis is true for all smaller values of `n`.
    In such situations, we use a technique known as strong induction. The proof of
    the recursive Fibonacci program in [Algorithm 8.2](#chapter8.xhtml#algo8_2) below
    is a great example of this.


    Recall that the Fibonacci numbers start 1, 1, 2, 3, 5, …… and each subsequent
    one is the sum of the previous two. It is not obvious how to write a proof of
    correctness for the above algorithm by regular induction because computing the
    `(n + 1)` th Fibonacci number correctly relies on having correctly computed the
    `n`th and `(n − 1)` th Fibonacci numbers.


    We''ll next see an example of strong induction that gets around this. Specifically,
    in strong induction we assume the hypothesis is true for all values up to `n`
    and then prove it for the case of `(n + 1)`. The other changes we make include
    showing multiple base cases and modifying the concluding step.


    A question you might have about strong induction is how many base cases you need
    to show. This depends on the largest value of `n` that cannot be proved using
    the inductive argument. In this example, we cannot argue that the two smallest
    Fibonacci numbers were computed from any smaller numbers, so we had to include
    base cases for both. More generally, if your inductive step relies on the problem
    being a certain size, then you need to show the hypothesis for all smaller sizes
    in the base step.


    One might infer from the name that strong induction is stronger than regular induction—you
    can prove more with it. This turns out not to be the case as they are equivalent
    in proving power. Any strong induction proof can be converted into a regular induction
    proof by modifying the proposition so that it holds for all values up to `n`.
    However, this makes the proof more complicated to read, so we just use strong
    induction instead. The term “strong” simply indicates that we are making a stronger
    assumption than in regular induction.


    ## 8.9 An Analogy for Strong Induction

    Proofs by strong induction rely on the induction hypothesis being true for all
    smaller values of `n`. Continuing our tower analogy, this means that each level
    depends on it.


    In an induction proof, we have to show the following facts:

    1. The bottom levels are firmly established. `Show that P(n) is true for all smaller
    values of n.`

    2. If all levels are firmly established, then the next level will also be established.
    `Show that if P(i) is true for all i < n, then P(n) is true.`


    Sometimes we only need some of the following. For example, in the Fibonacci proof,
    we only need the previous two values. The tower analogy for strong induction for
    the first few levels is illustrated in `Figure 8.2`.


    ## 8.10 Proofs with Regular Expressions

    We can use strong induction to prove the correctness of some of the procedures
    we designed for regular expressions. For example, in [Chapter 6](#chapter6.xhtml)
    we showed that any regular expression has a `λ-NFA`. We can prove this rigorously
    using strong induction.


    Recall in [Section 6.2](#chapter6.xhtml#sec6_2) we saw a procedure for converting
    any regular expression into `λ-NFA`. This involved designing `λ-NFAs` for the
    empty set, the set containing the empty string, and for the set containing a character
    string that will make up the base case of the following proof. In addition, there
    were procedures for designing `λ-NFAs` for the union and concatenation of any
    pair of expressions and the Kleene star of any expression; these are used in the
    inductive step of the following proof.


    In our next example we will prove that the procedure for reversing a regular expression
    in [Chapter 7](#chapter7.xhtml) does indeed give the reverse of the original language.


    ## 8.11 Correctness of Binary Search

    Another great application of strong induction is to more deeply understand the
    recursive binary search algorithm, shown in [Algorithm 8.3](#chapter8.xhtml#algo8_3).
    This algorithm assumes that the input list `L` is already sorted and gives an
    efficient way to search for the index of a target element by bisecting the region
    to be searched in half at every step. The recursive version of this algorithm
    also includes the left and right ends of the range of the indexes to be searched.
    When searching a list `L` indexed from 0 to `n - 1` for a target, the recursive
    function is called with parameters `BinarySearch(L, target, 0, n - 1)`. The base
    cases of the recursion are when there are no more items to search (when the left
    index crosses the right index), in which case we return -1 to indicate that the
    search failed, and when the target is found at the middle of the active range
    of indices, in which case we return that middle index. Otherwise, the recursive
    procedure narrows the range to the appropriate half and continues the search.

