    $$\begin{array}{l} {\sum\limits\_{i = 1}^{n - 1}i = 1 + 2 + 3 + \ldots + (n -
    1).} \\ \end{array}$$


    在此符号法中，`Σ` 表示求和（不要与字符串字母表混淆）。下标（此处为 `i` = 1）表示我们在求和中 `i` 从什么值开始，上标（此处为 `n` − 1）表示（包含终点的）停止点，紧随其后的表达式是应用于被求和的每个
    `i` 值的函数。在这个例子中，我们只是将所有这些 `i` 值相加。


    现在我们将使用数学归纳法证明 $\sum\limits\_{i = 1}^{n - 1}i = n(n - 1)/2$。


    再次注意，`P`(*n*) 是一个逻辑陈述（取值为真或假），而不是级数之和。具体来说，它表示级数之和是否等于公式 `n`(*n* − 1)/2。


    让我们来理解上述推导是如何形成的。首先，从你假设的内容（`P`(*k*)）开始，即 $\sum\limits\_{i = 1}^{k - 1}i = k(k
    - 1)/2$，以及你试图证明的内容（`P`(*k* + 1*)），即 $\sum\limits\_{i = 1}^{(k + 1) - 1}i = (k
    + 1)((k + 1) - 1)/2$ 或 $\sum\limits\_{i = 1}^{k}i = (k + 1)k/2$。在证明等式时，我们从试图证明的式的一侧开始（此处为
    $\sum\limits\_{i = 1}^{k}i$），并想要证明它等于右侧（(*k* + 1)*k*/2)）。为了这一点，我们必须与归纳假设建立联系。对于证明级数的和，这几乎总是看起来是一样的：观察到较大级数的和等于较小级数加上额外的项。这就是为什么在这个例子中，我们在推导的第三行将求和
    $\sum\limits\_{i = 1}^{k}i$ 分解为 $\sum\limits\_{i = 1}^{k - 1}i$ 和 `k`。我们现在可以在第四行应用归纳假设，将
    $\sum\limits\_{i = 1}^{k - 1}i$ 替换为 `k`(*k* − 1)/2。最后，我们使用代数方法证明我们得到的是试图证明的等式右侧的表达式（(*k* + 1)*k*/2)）。


    结论步骤与第一个例子完全相同。


    ## 8.5 长度为（最多）*N* 的位字符串有多少个？


    接下来我们将使用归纳法来证明一个关于不同位字符串数量的结果，即在字母表 `Σ` = {0, 1} 上长度为 `n` 的字符串。长度为 0 的字符串恰有一个，即
    `λ`。长度为 1 的有两个：{0, 1}。长度为 2 的有 4 个：{00, 01, 10, 11}，长度为 3 的有 8 个：{000, 001, 010, 011, 100, 101, 110, 111}。在继续阅读之前，你注意到什么规律？


    你可能注意到每个后续长度的字符串数量都是前一个长度数量的两倍。我们可以借此建立假设 `P`(*n*)：长度为 `n` 的字符串数量等于 2^(*n*)。让我们看看如何证明这一点。


    注意，这种情况与之前的示例略有不同，因为我们从 `n` = 0 开始。归纳步骤也需要一个稍微复杂的论证来证明 `P`(*k*) 意味着 `P`(*k* + 1)。我们之前使用的方法仍然有效。首先为该问题完整地写出
    `P`(*k*) 和 `P`(*k* + 1*) 的陈述。然后阐述为什么在 `P`(*k*) 为真的情况下，`P`(*k* + 1*) 是的。


    我们可以将此分析进一步，以回答长度为*最多* `n` 的字符串有多少个。从之前的定理可知，长度为 `n` 的字符串数量恰好是 2^(*n*)，所以长度最多
    `n` 的字符串数量必须长度为 0, 1, 2, …,*n* 的字符串数量，即 $\sum\limits\_{i = 0}^{n}2^{i}$。当 `n` = 0
    时，这仅仅是 2⁰或 1。当 `n` = 1 时，我们得到 2⁰ + ¹ = 3。当 `n` = 2 时，我们得到 2⁰ + ¹ + ² = 7。当 `n` = 3
    时，它是 2⁰ + ¹ + ² + ³ = 15。你看到规律了吗？在继续阅读之前尝试猜一下规律。


    你可能注意到第 *n* 个数字始终是 2^(*n* − 1) −1。（这不是表示规律的唯一方式；你可能还观察到每个数字都是前一个的两倍加一，这也是正确的。）让我们正式表述为一个假设并看看如何证明它。


    注意，这次我们将数学归纳法作为大证明的一部分。在设定和结论告诉读者我们使用了归纳法是非常重要的。


    ## 8.6 比较函数的增长速度


    当你以后学习算法时，将需要比较哪些函数的增长速度更快。如下表所示，阶乘函数的增长速度比指数函数快得多。


    | *n* | 2^*n* | *n*! |

    |---|---|---|

    | 0 | 1 | 1 |

    | 1 | 2 | 1 |

    | 2 | 4 | 2 |

    | 3 | 8 | 6 |

    | 4 | 16 | 24 |

    | 5 | 32 | 120 |

    | 6 | 64 | 720 |

    | 7 | 128 | 5040 |

    | 8 | 256 | 40320 |

    | 9 | 512 | 362880 |

    | 10 | 1024 | 3628800 |


