    现在你已经看了一些示例，我们可以来看 NFA 的正式定义。NFA 在形式上被定义为一个五元组 `(*Q`，`Σ`, `δ`, `q[0]`, `F*)`，其中
    `Q` 是状态集，`Σ` 是输入字母表，`δ` : `Q` × `Σ` → `P(Q)` 是转移函数，`q[0]` 是起始状态，而 `F` 是终止状态（或接受状态）的集合。


    注意，其数学定义与 DFA 几乎相同，只有 `δ` 是真正不同的地方。`δ` 函数的输出现在是一个状态的*集合*，因为现在从任何状态/符号对，转移都可以去到多个状态。在缺少转移的情况下，`δ`
    的输出状态为空集（∅）。


    ## 4.5 NFA 的语言


    有了 NFA 的正式定义，让我们来看看如何在数学上定义一个 NFA 接受哪些字符串。


    乍看之下，上面的量化公式看起来非常令人生畏。然而，我们可以将其拆解，发现这个想法并不复杂。它是说，如果我们可以为字符串 `s = s[1]s[2]s[3]…s[n]`
    找到一个从 `p[0]` 到 `p[n]` 的状态序列（其中 `p[0]` 被直接定义为起始状态 `q[0]`），使得在每个符号 `s[i]` (1 ≤ `i`
    ≤ `n`) 之后，我们都可以使用 `δ` 中的转移，在符号 `s[i]` 上将我们从状态 `p[i−1]` 转移到状态 `p[i]`，并且我们到达的最后一个状态（`p[n]`）必须是一个接受状态。我们可以通过一个例子来理解这一点。


    ## 4.6 子集构造法


    NFA 被称为 DFA 的泛化，因为它可以完成 DFA 能做的所有事情。特别地，我们可以将 DFA 看作是一个为每个状态/符号对恰好定义了一个转移的 NFA。这可能意味着
    NFA 比 DFA 更强大。然而，我们将在下一节看到，DFA 能够接受 NFA 能够接受的所有语言，这表明它们在所接受的语言上实际上是等价的。


    我们将通过提供一种可以将任何 NFA 转换为具有相同语言的 DFA 的算法，构造性地证明 DFA 和 NFA 一样强大。这个算法被称为子集构造算法（Subset
    Construction algorithm）。对于任何 NFA，我们都构造一个 DFA，其状态是 NFA 状态集合的集合。完整的子集构造步骤在算法 4.1
    中给出。


    该算法的工作原理是创建一个 DFA，其状态为 NFA 的*状态集*。直观地说，DFA 的每个状态（NFA 的一个状态集）代表了字符串可以到达的所有状态集合。然后我们必须适当地添加从每个状态的转移。如果
    DFA 的状态数量为 `n`，我们可能有多达 `2^(n)` 个这些状态的子集。然而在实践中，我们需要的数量通常往往要小得多。我们只根据需要通过添加新状态来创建必要的状态。我们从状态
    `{q[0]}` 开始，因为 `q[0]` 是 NFA 的唯一起始状态，并添加从它可到的任何新状态。我们继续这个过程，直到没有新状态产生且每个状态的所有转移都已定义。


    由于我们可以看到任何 NFA 都可以通过子集构造转换为 DFA，而任何 DFA 都可以显而易地转换为 NFA，这意味着 DFA 和 NFA 接受相同的语言。换句话说，我们现在可以为正则语言提供另一种定义。


    ## 4.7 带有 λ 转移的 NFA


    带有 λ 转移的 NFA 有一种变体称为 λ-NFA。在不消耗字符串字符的情况下，可以跟随 λ 转移。例如，如果语言是两个简单 NFA 语言的并集，我们可以通过添加初始
    λ 转移来创建一个包含它们语言并集的 NFA，如下例所示：


    λ-NFA 的正式定义与 NFA 相同，但我们现在为每个状态添加了针对 `λ` 的转移规则，如例所示。


    我们还可以使用类似于子集构造算法的程序将 λ-NFA 转换为 DFA。唯一的区别在于，在确定从任何状态可以到达的状态集合时，我们必须同样遵循 λ 转移。


    ## 4.8 章总结与核心概念


    *   **非确定性**是计算机科学中的一个重要概念。**非确定有限自动机 (NFA)** 可以在状态之间进行非确定性转移。

    *   NFA 的转移函数输出在给定状态-字符对上可以到达的**状态集合**。

    *   如果**存在一条从起始状态到接受状态的路径**，则该字符串被 NFA 接受。

    *   **子集构造**算法可将任何 NFA 转换为 DFA。

    *   **正则语言**是指有一个接受它的 DFA 或 NFA 的语言。

    *   NFA 的一种变体称为 **λ-NFA**，允许 λ 转移。


