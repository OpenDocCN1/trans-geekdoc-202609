  trans: "\n\nDFA（确定性有限自动机）的形式化定义为一个五元组 (`Q`, `Σ`, `δ`, `q[0]`, `F`)。它们具体如下：\n\n*\
    \   `Q` 是状态集合\n*   `Σ` 是输入字母表\n*   `δ`: `Q` × `Σ` → `Q` 是转移函数\n*   `q[0]` 是起始状态\n\
    *   `F` 是终止或接受状态集合\n\n用示例来解释这些内容最为合适。\n\n在设计自己的 DFA 时，你应该确保 `δ` 转移函数的表格是完全填充的——每一对状态和输入符号都必须有一个条目。这在你初学创建\
    \ DFA 时是很容易忘记的事情。\n\n请注意，整个计算模型是如何使用你在第 1 章中学习过的数学数据类型（包括集合、元组、字母表、字符串和函数）如此精确地捕捉到的。这在概念上等同于使用技术记法来“编码”你的计算过程。\n\
    \n我们为 DFA 接受的所有语言取了一个名称：\n\n## 2.4 匹配电话号码\n\n我们将看到的下一个 DFA 示例是用于识别以作者区号 (740)\
    \ 开头的数字。这可以用语言表示：\n\n$$\\begin{array}{l} \\{ 740s:s \\in \\{ 0,\\ldots,9\\}^{\\\
    ast}\\}. \\\\ \\\\ \\end{array}$$  \n\n下一幅图显示了一个只接受以 740 开头的字符串的 DFA。（注意，它会接受任何长度的以\
    \ 740 开头的字符串，包括太短或太长无法作为电话号码的，但我们现在忽略这个细节。）\n\n这个 DFA 的工作原理是：只有当前三个符号是 7、4 和 0\
    \ 时，它才会移动到接受状态 `q[3]`。注意状态 `q[3]` 和 `q[4]` 是所谓的**汇状态（sink states）**。也就是说，一旦进入这些状态，就无法离开。区别在于，一旦进入状态\
    \ `q[3]`，无论字符串如何都会被接受（因为它已经确认是以 740 开头的），而一旦进入状态 `q[4]`，字符串一定会被拒绝，因为它不是以 740 模式开头的。\n\
    \n和之前一样，我们可以为这个 DFA 创建一个元组。\n\n在使用 DFA 时需要避免的一个常见错误是对其语言的描述不精确。特别是，观察这个 DFA 的人可能会注意到它接受所有以\
    \ 74 开头的字符串，并推断出这就是它的语言。当然，由于这个 DFA 不接受诸如 747 这样的字符串，所以这是错误的——说它接受所有以 74 开头的字符串范围得太宽了。\n\
    \n相反的问题也可能发生。可能会注意到这个 DFA 确实接受所有以 7405 开头的字符串。这次，观察太具体了——这种表描述排除了诸如 7401234567\
    \ 这样的字符串。对于给定的或你设计的 DFA，对其语言的精确描述是非常重要的。就像写代码一样，你想要用大量的例子来测试你的 DFA，并考虑特殊情况。\n\n\
    ## 2.5 计算生物学\n\n你可能听过 DNA 由四种类型的核苷酸编码，这些核苷酸由字母 A、C、G 和 T 表示。计算生物学家研究这些核苷酸的序列来分析\
    \ DNA 并寻找蛋白质。我们的下一个问题是取一个 DNA 字符串，并确定长度为三的子字符串（称为密码子）TTA 是否出现在其中任何位置。这可以写为语言：\n\
    \n$$\\begin{array}{l} \\{ pTTAs:p,s \\in \\{ A,C,G,T\\}^{\\ast}\\}. \\\\ \\\\\
    \ \\end{array}$$\n\n例如，字符串 GATTACA 应该被接受，但字符串 CATCAT 不应该被接受。下面的示例给该语言的 DFA：\n\n\
    与之前的示例类似，当看到 TTA 作为子字符串时，我们创建一条通接受状态的路径（`q[0]` → `q[1]` → `q[2]` → `q[3]`）。然而，这次子字符串可以出现在字符串的任何部分，因此我们必须对其他转移小心。在这里，思考哪些字符串应该到达每个状态是有用的。由于我们必须跟踪子字符串\
    \ TTA 是否已经出现，我们使用状态来记住我们向这一目标的进展。我们使用 `q[1]` 表示我们尚未找到 TTA 子字符串，且最近遇到的是单个 T（但不是\
    \ TT）。状态 `q[2]` 可以由那些尚未找到 TTA 子字符串且最近遇到 TT 的字符串到达。一旦我们遇到整个子字符串 TTA，就会到达接受汇状态 `q[3]`。起始状态\
    \ `q[0]` 则可以从所有其他字符串到达。\n\n凭借这种直觉，我们可以理解为什么在示例 2.6 中选择了所有的转移。任何没有朝着识别字符串 TTA 目标进展的状态转移都应该回到状态\
    \ `q[0]`。例如，状态 `q[1]` 在遇到 A、C 或 G 时返回到 `q[0]`。\n\n## 2.6 终止密码子\n\n我们的下一个示例同样来自生物学，是识别不以\
    \ TAG 结尾的字符串。也就是说，我们要接受语言 `{x:x \\in {A,C,G,T}*}` 的补集。与之前的示例一样，我们需要创建状态来允许跟踪最后三个符号是否为\
    \ TAG。我们将使用 `q[1]` 表示最后看到的符号是否为 T，`q[2]` 表示最后两个符号是否为 TA，`q[3]` 表示它们是 TAG。状态 `q[0]`\
    \ 再次捕获所有剩余字符串。生成的 DFA 如下所示：\n\n注意这里，与之前的示例不同，我们接受到达 `q[3]` 之外任何状态的字符串。由于我们有多个接受状态，`F`\
    \ 必须是一个集合以包含所有状态。\n\n## 2.7 分糖果\n\n一位妈妈想把糖果分给她的两个孩子，并想知道是否可以平均分。有三种糖果：巧克力、棒棒糖和麦糖。妈妈想确保巧克力和棒棒糖的数量都是偶数个，但她不在乎麦糖，因为两个孩子都不喜欢。\n\
    \n我们将创建一个 DFA 来判断一堆糖果是否可以被平均分。这堆糖果将由一个字符串表示，其中巧克力、棒棒糖和麦糖分别由字母 C、L 和 T 表示。例如，DFA\
    \ 应该接受字符串 CLTTLLLC 和 TCCTT，因为它们有偶数的巧克力和偶数的棒棒糖。DFA 应该拒绝字符串 TLLC 和 TLC，因为前者巧克力数量是奇数，后者的巧克力和棒棒糖数量都是奇数。\n\
    \n为了为这个问题设计 DFA，我们必须考虑需要表示的可能状态。具体来说，我们关心巧克力数量是偶数还是奇数，棒棒糖也是如此。由于巧克力和棒棒糖的数量是不相关的数字，我们总共会有四种可能性：都是偶数、巧克力为奇数且棒棒糖为偶数、巧克力为偶数且棒棒糖为奇数、都是奇数。凭借这种直觉，我们设计了下方示例所示的\
    \ DFA：\n\n"
- fmt: "\nThe states `q[0]`, `q[1]`, `q[2]`, `q[3]` represent the four possibilities\
    \ listed above. Each time we see another piece of chocolate we switch between\
    \ the left and right states. Each time we see another lollipop we switch between\
    \ and the top and bottom states. Since the number of pieces of taffy doesn't affect\
    \ anything, we just self-loop on the current state when we see a taffy. Lastly,\
    \ we make `q[0]` the accepting state since this is the one that captures strings\
    \ that have an even number of chocolates and lollipops—a nice even split for the\
    \ kids!\n\nOnce again, write out the full tuple for this DFA as practice.\n\n\
    ## 2.8 Divisibility in Binary\n\nFinite automata can also be used to compute mathematical\
    \ properties. For example, we will see how to determine whether a number, given\
    \ in binary, is divisible by three next. Before we do this, we will take a short\
    \ detour to review binary numbers.\n\nIn the decimal number system (or base 10)\
    \ that we are used to using, the digit at each position indicates the corresponding\
    \ power of ten's place for the number. For example, the decimal number 1234 can\
    \ be written as\n\n$$\\begin{array}{l} {1234 = 1 \\times 10^{3} + 2 \\times 10^{2}\
    \ + 3 \\times 10^{1} + 4 \\times 10^{0}.} \\\\ \\end{array}$$  \n\nIn other words,\
    \ there is a 1 in the thousand's (10³) place, a 2 in the hundred's (10²) place,\
    \ a 3 in ten's (10¹) place, and a 4 in the one's (10⁰) place.\n\nSimilarly, binary\
    \ (or base 2) numbers have places for the powers of two. For example, the binary\
    \ number 1011[2] (here, the subscript 2 indicates that the number is in binary)\
    \ can be written as\n\n$$\\begin{array}{l} {1011_{2} = 1 \\times 2^{3} + 0 \\\
    times 2^{2} + 1 \\times 2^{1} + 1 \\times 2^{0} = 8 + 0 + 2 + 1,} \\\\ \\end{array}$$\
    \  \n\nwhich is just the number eleven.\n\nNow, to solve the divisibility by three\
    \ in binary problem, we will use the following strategy. An alternative way of\
    \ saying that a number is divisible by three is to say that it leaves a remainder\
    \ of zero when divided by three. We will thus design a DFA that keeps track of\
    \ the remainder of the number when dividing by three, with one state for each\
    \ of the remainders 0, 1, and 2, as seen in the following DFA:\n\nTo understand\
    \ how the DFA was designed, it is first necessary to understand what happens to\
    \ a binary number when a 0 or a 1 is appended to the end of it. When we add a\
    \ 0 to the end of a binary number, it is the same as multiplying the number by\
    \ 2 (similar to how adding a 0 to the end of a decimal number multiplies it by\
    \ 10). When we add a 1 to the end of a binary number, it is the same as multiplying\
    \ it by 2 then adding 1. Therefore, when we start at state `q[0]` (the state representing\
    \ remainder of 0 when dividing by 3), doubling the number still gives a remainder\
    \ of 0 when dividing by 3 so we have self-loop on 0. On the other hand, when multiplying\
    \ a number with remainder 0 by 2 and adding 1, we get a number that has a remainder\
    \ of 1 dividing by 3, so we transition from `q[0]` to `q[1]`. See what happens\
    \ when you do the same for numbers that have a remainder of 1 divided by 3 (state\
    \ `q[1]`) and numbers that have a remainder of 2 divided by 3 (state `q[2]`) to\
    \ make sure you understand how the transitions out of `q[1]` and `q[2]` were determined.\
    \ Note that, for simplicity, we assume that the empty string is in the language.\
    \ We also allow the binary number to have leading 0s, that is, we treat the number\
    \ 01 as 1.\n\n## 2.9 Summary and Key Concepts\n\n- A **deterministic automaton\
    \ (DFA)** is a simple model for computing whether a string is in a language. It\
    \ consists of **states**, including one **starting state** and one or more **accepting\
    \ states**, with transitions between them.\n- DFAs are formally defined by a **5-tuple**\
    \ (`Q`, `Σ`, `δ`, `q[0]`, `F`), where `Q` is the set of states, `Σ` is the **input\
    \ alphabet**, `δ` is the **transition function**, `q[0]` is the **start state**,\
    \ and `F` is the set of **final or accepting states**.\n- A language is called\
    \ **regular** if it has a DFA that accepts it.\n- DFAs can be used to accept languages\
    \ with applications such as vending machines, pattern matching, computational\
    \ biology, and testing arithmetic.\n\n## Exercises\n\nGive the full 5-tuple for\
    \ DFAs for the following languages:\n\n- 2.1 `w ∈ {0,1}`: `w` starts with a 0\n\
    - 2.2 `w ∈ {0,1}`: `w` ends with a 1\n- 2.3 `w ∈ {0,1}`: `w` ends with 00\n- 2.4\
    \ `w ∈ {0,1}`: `w` has 01 as a substring\n- 2.5 `w ∈ {0,1}`: `w` does not have\
    \ 01 as a substring\n\nDraw DFAs for the following languages:\n\n- 2.6 `w ∈ {0,1}`:\
    \ `w` is of odd length\n- 2.7 `w ∈ {0,1}`: `w` has an even number of 0s\n- 2.8\
    \ `w ∈ {0,1}`: `w` has an even number of 0s and an odd number of 1s\n- 2.9 `w\
    \ ∈ {0,1}`: `w` has an even number of 0s and an even number of 1s\n- 2.10 `w ∈\
    \ {0,1}`: `w` has an odd number of 0s and an even number of 1s\n- 2.11 `w ∈ {0,1}`:\
    \ `w` has an odd number of 0s and an odd number of 1s\n- 2.12 `w ∈ {0,1}`: the\
    \ third character in `w` is 0\n- 2.13 `w ∈ {0,1}`: `w` starts and ends with a\
    \ 0\n- 2.14 `w ∈ {0,1}`: `w` starts or ends with a 0\n- 2.15 `w ∈ {0,1}`: `w`\
    \ has exactly one 0\n- 2.16 `w ∈ {0,1}`: `w` contains 10 but not 1010\n- 2.17\
    \ `w ∈ {0,1}`: `w` contains at least two 0s and at least 1\n- 2.18 `w ∈ {0,1}`:\
    \ `w` contains at most two 0s\n- 2.19 `w ∈ {0,1}`: the number of 0s is 3\n- 2.20\
    \ `w ∈ {0,1}`: `w` is divisible by 4\n- 2.21 `w ∈ {0,1}`: `w` is divisible by\
