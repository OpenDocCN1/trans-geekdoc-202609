    \n[content]\n想象一下我们可以构造一个无限大的表格，其中行是所有的图灵机，列是所有的字符串，如图 14.3 所示。为了简单起见，我们假设字符串是基于字母表\
    \ {0, 1} 的。表格中的每个条目都将指示该行对应的图灵机是接受（A）该列的字符串还是拒绝（R）该字符串。（图 14.3 中的条目并非真实，仅为了说明目的而展示。）我们将关注表格的对角线条目（用方框标记），作为对角语言，因为对角线语言及其补集是关于这些值的。我们可以证明\
    \ `M[λ]` 不是 $\\overset{―}{D}$ 的图灵机，因为（在这个示例表中）`λ` 被 `M[λ]` 接受，使得 `λ` 处于集合 `D`\
    \ 中（根据 `D` 的定义），但随后 $\\overset{―}{D}$ 的图灵机应该拒绝 `λ`。类似的论证表明 `M[0]` 也不是 $\\overset{―}{D}$\
    \ 的有效图灵机。另一方面，图灵机 `M[1]` 拒绝字符串 1，这意味着 1 在 $\\overset{―}{D}$ 中，但现在 `M[1]` 不能是 $\\\
    overset{―}{D}$ 的图灵机，因为它本应该接受 1。对每个对角线条目（无论 A 还是 R）继续这一论证，将在我们所有可能的图灵机列表中，没有一个图灵机可以接受\
    \ $\\overset{―}{D}$。这表明 $\\overset{―}{D}$ 不是可递归枚举的。\n\n![图 14.3 每个图灵机接受/拒绝每个字符串的表格](img/fig14_3.jpg)\n\
    \n图 14.3 每个图灵机接受/拒绝每个字符串的表格\n\n我们可以从此得出关于 `D` 的以下结论。\n\n我们已经证明了 $\\overset{―}{D}$\
    \ 和 `D` 不是递归的或可计算的，但它们并不是非常自然的语言。接下来我们将使用它们来证明，其他更容易理解的问题也是不可计算的。\n\n## 14.7 归约\n\
    \n现在我们将展示如何通过一种称为“归约”（reduction）的技术，从之前的两个语言出发，来证明另一个语言的不可计算性。考虑以下语言：\n\n语言 `A`\
    \ 由所有图灵机编码和字符串的对组成，使得该图灵机接受该字符串。我们通过引入新符号 `(`、`)`、`,` 和 `;` 来对这种配进行编码。如果我们能计算这个语言，就可以判断任意程序是否接受任意输入。遗憾的是，正如我们接下来看到的，并不存在它的图灵机（即在所有输入上都能停机的机器）。\n\
    \n直觉上，上述归约利用了这样一个事实：确定 `M[i]` 是否接受任意字符串 `x` 应该比确定 `M[i]` 是否接受特定字符串 `i` 更加困难。\n\
    \n由于我们相信图灵机能够执行计算机上任何可能的机械计算，我们可以这样重新表述上述定理的含义：\n\n> 设计一个能够预判任意程序在任意输入上的输出的程序是不可能的。\n\
    \n## 14.8 程序比较\n\n接下来我们将看到一个稍微复杂的归约。符号 `L(M[a])` 表示图灵机 `M[a]` 的语言。\n\n语言 `SAME`\
    \ 在概念上是指在所有输入上行为完全相同的图灵机对。从图灵机转换到更实用的用法，`SAME` 的不可计算性意味着以下结果：\n\n> 设计一个能够判断两个程序在所有输入上的行为是否相同的程序是不可能的。\n\
    \n通过证明这个问题是不可计算的，这意味着你的计算机科学老师无法设计出一个程序，以两个程序（例如，一个运行的解决方案和一个学生的作业）作为输入，并判断它们在所有输入上的行为是否完全相同。\n\
    \n该归约的核心在于设计图灵机 `M[a]`，它忽略其输入并在输入 `i` 上模拟 `M[i]`。它的设计专门为了使得对于任何 `i`  ∈ `D`，图灵机\
    \ `M[a]` 总是接受，导致 `L(M[a])`  = `Σ`^(\\*)`；而对于所有 `i` ∉ `D`，图灵机 `M[a]` 总是拒绝，导致 `L(M[a])`\
    \  =  `⌀`。这种鲜明的对立允许我们在归约中使用 `M[a]`，通过一个用于 `SAME` 的图灵机来区分给定字符串是否在 `D` 中。\n\n更具体地说，我们设置了作为\
    \ `SAME` 图灵机输入的图灵机 `M[a]` 和 `M[b]` 如下：\n\n| `i` ∈ `D` ? | `M[i]` 接受 `i` | `L(M[a])`\
