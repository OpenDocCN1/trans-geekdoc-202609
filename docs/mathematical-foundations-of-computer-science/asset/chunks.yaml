    ## 14.3 丘奇-图灵论题


    既然我们已经看到图灵机能够维护多条磁带（内存中的变量），并且可以在上一节的示例和练习中执行许多我们认为计算所必需的操作（算术、循环、条件判断），我们就可以对图灵机的能力做出断言了。以下是所谓的丘奇-图灵论题的一个版本，它以计算理论的两位先驱阿隆索·丘奇（Alonzo
    Church）和艾兰·图灵（Alan Turing）命名。


    上述陈述被称为“论题”（thesis），因为它是一个假设。由于“机械计算”这一术语没有明确定义，因此上述论题无法在数学上被证明。它假设任何我们认为可行的计算都可以由图灵机完成。所有现代计算机的性能与图灵机并孰上下，因为它们可以解决相同的问题。给定足够的时间和内存，图灵机可以执行任何我们在计算机上能做的计算。反之，给定足够的时间和计算机内存，现代计算机也可以执行任何图灵机能够胜任的计算。


    现在，并不是说我们永远无法构建比图灵机更强大的计算机。这仅仅意味着我们目前不认为可能存在更强大的计算机，而且所有的经验证据似乎都支持这一信念。


    ## 14.4 通用图灵机


    图灵机的一个重要特性是它强大到足以模拟它自己。也就是说，给定一个图灵机的编码和一个输入字符串，我们可以设计一个图灵机（称为**通用图灵机**，Universal
    Turing Machine），它可以在给定的输入上模拟给定的图灵机。


    你可能好奇如何将一个图灵机编码为字符串。由于图灵机的描述始终是有限的，我们可以将该描述编码为单个字符串。例如，我们可以将状态名称、输入和磁带字母表、起始状态和接受状态以及空白符号编码进字符串中。然后我们可以将
    `δ` 转移规则编码为序列——例如，`δ(q[0], 0) = (q[1], B, R)` 可以被编码为如 `q0#0#q1#BBR` 的字符串，其中 `#`
    是一个特殊的分隔符。因此，任何图灵机都可以用字符串编码来表示。


    给定这样一个图灵机的编码，是有可能的（尽管需要巨大的努力！）设计出一个图灵机，它可以获取这种编码并利用它来处理图灵机在某些输入字符串上的行为。我们可以这样做，例如，将输入字符串存储在一条磁带上，将当前状态存储在另一条上，将读头位置存储在第三条，并将图灵机编码存储在第四条。对于图灵机模拟的每一步，我们都会查看当前读头位置的字符是什么以及我们当前处于什么状态，然后在图灵机编码带上搜索下一个要执行的正确移动。


    通用图灵机的思想出于多个原因非常重要。首先，它告诉我们图灵机能够运行其他的图灵机。事实上，当你使用编译器或解释器运行程序时，发生正是这种情况——这些都是通用图灵机程序的例子，因为它们可以处理任意（正确的）代码。


    图灵机能够模拟其他图灵机的另一个重要原因在于，我们可以让图灵机在子程序中调用另一个图灵机，从而允许我们将日益复杂的计算串联在一起。


    ## 14.5 递归语言与递归可枚举语言


    我们现在准备好定义什么是可计算的语言了。


    注意，我们规定用于语言的图灵机必须在所有输入上停止。这是因为图灵机允许通过无限运行来拒绝字符串。由于无限运行的计算没有太大用，因此我们规定图灵机在每个可能的输入上都必须停止并接受或停止并拒绝。


    还有一个更广泛的语言集合定义了图灵机能够计算的所有内容，称为递归可枚举语言（recursively enumerable languages）。


    注意，这个语言集合包含了递归语言，因为递归语言都拥有图灵机（这些图灵机必须在所有输入上停止）。从实用角度来看，这种分类并不有用，因为它允许图灵机在某些输入上无限运行，但它有助于我们完成本章后续的某些证明。接下来，我们将基于这些定义证明几个结果。


    在上面的证明中注意，我们必须并行运行 `M` 和 `\overset{―}{M}` 的模拟，因为 `M` 或 `\overset{―}{M}` 都有可能无限运行。

