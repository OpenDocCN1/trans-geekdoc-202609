    ## 5.1 为什么你应该关注它


    正则表达式是正则语言的快捷表示方式。通过使用三种操作的组合，我们可以表示任何正则语言。除了与正则语言的关系外，正则表达式在文本搜索、现代文本编辑器以及 Unix
    命令行搜索工具中被广泛使用。


    ## 5.2 为什么需要正则表达式


