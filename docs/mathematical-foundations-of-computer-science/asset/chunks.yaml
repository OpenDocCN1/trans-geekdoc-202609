    is a problem that is uncomputable. Since we established Turing machines as our
    model of computation, we will see that no mechanical computer that currently exists
    or ever will exist can solve this problem. We will then show that a number of
    other problems are also uncomputable by bootstrapping from this one problem using
    a technique called a reduction, another important concept in computer science.


    ## 14.2 Variations of Turing Machines


    While the standard model of the Turing machine from the last chapter is as powerful
    as we will need, we will see in this section that it is equivalent in power to
    seemingly more advanced models of computation, such as Turing machines that have
    multiple tapes.


    We will first see how to construct a Turing machine with multiple tracks using
    a standard Turing machine. A two-track Turing machine has each cell on the tape
    split into a top and bottom part so that each cell can hold two symbols. (See
    [Figure 14.1](#chapter14.xhtml#fig14_1).) This model of the Turing machine can
    then make transitions based on the state and the symbols on both of the tracks.


    ![Figure 14.1 Multi-track TM](images/fig14_1.jpg)


    [Figure 14.1](#chapter14.xhtml#b14fig14_1) Multi-track TM


    We can simulate any such two-track Turing machine by treating the tape alphabet
    as pairs of symbols from the original tape alphabet. For example, if a cell had
    a 1 and a B in it, we would represent this with a single symbol [*B*]¹ and make
    a standard Turing machine that did whatever the two-track Turing machine did by
    designing the appropriate rules. Similarly, we can see that a multi-track Turing
    machine, for some number of tracks *k*, would be no more powerful than a standard
    Turing machine because we can replace the tape alphabet with *k*\-tuples that
    represent any combination of *k* symbols from the original tape alphabet.'
