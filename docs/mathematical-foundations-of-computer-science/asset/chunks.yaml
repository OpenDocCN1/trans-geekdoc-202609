  raw: 'Imagine that we could construct an infinitely large table that has all the
    Turing machines on the rows and the strings on the columns, as illustrated in
    [Figure 14.3](#chapter14.xhtml#fig14_3). For simplicity, we will assume that the
    strings are over the alphabet {0, 1}. Each entry in the table will indicate whether
    the Turing machine on the row accepts (A) the string on the column or rejects
    (R) it. (The entries in [Figure 14.3](#chapter14.xhtml#fig14_3) are not real and
    just shown for illustrative purposes.) We will focus on the diagonal entries of
    the table (marked with boxes) as the diagonal language and its complement are
    about these values. We can show that *M*[*λ*] is not a Turing machine for $\\overset{―}{D}$
    because (in this example table) *λ* is accepted by *M*[*λ*], putting *λ* in *D*
    (by the definition of *D*) but then a Turing machine for $\\overset{―}{D}$ should
    reject *λ*. A similar argument shows that *M*[0] is also not a valid Turing machine
    for $\\overset{―}{D}$. On the other hand, the Turing machine *M*[1] rejects the
    string 1, which means that 1 is in $\\overset{―}{D}$, but now *M*[1] cannot be
    a Turing machine for $\\overset{―}{D}$ as it should have accepted 1. Continuing
    this argument for each diagonal entry (whether it is A or R), shows that no Turing
    machine in our list of all possible Turing machines can accept $\\overset{―}{D}$.
    This shows that $\\overset{―}{D}$ is not recursively enumerable.


    ![Figure 14.3 Table of whether each Turing machine accepts/rejects each string](images/fig14_3.jpg)


    [Figure 14.3](#chapter14.xhtml#b14fig14_3) Table of whether each Turing machine
    accepts/rejects each string


    We can conclude from this the following result for *D*.


    We have shown that $\\overset{―}{D}$ and *D* are not recursive or computable,
    but they are not very natural languages. We will use them to next show that other,
    more easy to understand problems, are not computable as well.


    ## 14.7 Reductions


    We will now show how to prove the non-computability of another language by bootstrapping
    from the previous two languages using a technique called a reduction. Consider
    the following language:


    The language *A* consists of all pairs of Turing machine encodings and strings
    such that the Turing machine accepts the string. We encode pairings such as this
    by introducing new symbols (, ), and ,. If we could compute this language, we
    could then tell whether any arbitrary program accepts an arbitrary input. Unfortunately,
    no Turing machine (that halts on all inputs) exists for it as we see next.


    Intuitively, the above reduction uses the fact that determining whether *M*[*i*]
    accepts an arbitrary string *x* should be even harder than determining whether
    *M*[*i*] accepts the specific string *i*.


    Since we believe Turing machines to be able to perform any mechanical computation
    possible on a computer, we can rephrase the implications of the above theorem
    thus:


    > It is impossible to design a program that can predict the output of an arbitrary
    program on arbitrary input.


    ## 14.8 Program Comparison


    We''ll next see a reduction that is a little more involved. The notation *L*(*M*[*a*])
    denotes the language of the Turing machine *M*[*a*].


    The language *SAME* is conceptually the pairs of Turing machines that behave identically
    on all inputs. Translated from Turing machines to more practical usage, the uncomputability
    of *SAME* implies the following:


    > It is impossible to design a program that can tell if two programs behave identically
    on all inputs.


    By showing that this problem is non-computable, this means that it is impossible
    for your CS instructor to design a program that takes as input two programs (for
    example, a working solution and a student''s submission) and determine whether
    they behave identically on all inputs.


    At the heart of this reduction is the design of the Turing machine *M*[*a*] that
    ignores its input and simulates *M*[*i*] on input *i*. It is designed specifically
    so that for any *i* ∈ *D* the Turing machine *M*[*a*] will always accept giving
    *L*(*M*[*a*]) = *Σ*^(\*) and for all *i* ∉ *D* the Turing machine *M*[*a*] always
    rejects giving *L*(*M*[*a*]) = ⌀. This stark dichotomy allows us to use *M*[*a*]
    in the reduction to distinguish whether a given string is in *D* or not by using
    a Turing machine for *SAME*.


    More specifically, we have set up the Turing machines *M*[*a*] and *M*[*b*] that
    are given as input to the Turing machine for *SAME* as follows:


    | *i* ∈ *D* ? || *M*[*i*] accepts *i*? || *L*(*M*[*a*]) || *L*(*M*[*a*]) = *L*(*M*[*b*])
    ? || *M* accepts || *M*^′ accepts |


    | --- | --- | --- | --- | --- | --- |


    | Yes || Yes || *Σ*^(\*) || Yes || Yes || Yes |


    | --- | --- | --- | --- | --- | --- |


    | No || No || ∅ || No || No || No |


    The proof then takes the following form:


    1.  Assume for a contradiction that some Turing Machine *M* accepts *SAME* and
    halts on all inputs.


    2.  Build a new machine *M*^′ that on input *i* halts and accepts if *i* ∈ *D*
    and halts and rejects if *i* ∉ *D*. It does so by running *M* (the Turing machine
    for *SAME*) on the Turing machines *M*[*a*] and *M*[*b*] described above. (This
    is the part of the proof that you will have to adapt, using a table similar to
    the one above, to solve most of the exercises.) Since *M* halts on all inputs,
    so must *M*^′.


    3.  Since we showed in the last step that *M*^′ is a Turing machine for *D* that
    halts on all inputs, this shows that *D* is recursive. This is a contradiction,
    so *SAME* can not be recursive.


    ## 14.9 The Halting Problem


    Another classic problem that is known to be uncomputable is the **Halting Problem**.
    Simply put, the Halting Problem asks whether a given computation will ever halt
    or if it will run forever. By showing that this problem is not recursive we know,
    for example, that it is impossible to design a compiler that can always detect
    infinite loop bugs in arbitrary code.


    Next, we define the Halting Problem and show that it is undecidable as well.


    Notice that this definition is about whether a Turing machine halts or not on
    a given input, making it about the behavior of the Turing machine beyond whether
    it accepts certain strings or not. This makes the reduction a little more complicated.


    In practical terms:


    > It is impossible to design a program that can tell if another program will ever
    terminate.


    The Halting Problem is one of the classic problems in computer science that is
    uncomputable.


    ## 14.10 Classes of Languages


    When studying the difficulty of solving a problem, computer scientists use the
    notion of a class of problems.


    In conclusion, here is a diagram with the containment properties of these classes.


    ![A Venn diagram defines the relationship between different classes of languages.
    The innermost circle represents regular languages, surrounded by a larger circle
    representing context free languages, which in turn is surrounded by a circle representing
    recursive languages. The outermost circle represents recursively enumerable languages.](images/fig14_4.jpg)


    Figure 14.4 All classes of languages in this book


    ## 14.11 Chapter Summary and Key Concepts


    *   **Variations** of Turing-machine models include ones with **multiple tracks**
    and **multiple tapes**. These models are no more powerful than the standard Turing
    machine model.


    *   The **Church-Turing thesis** states that all mechanical computation can be
    performed by a Turing machine.


    *   The **Universal Turing machine** is one that takes as input the encoding of
    a Turing machine and an input and simulates that Turing machine on that input.


    *   A language is called **recursive** or **computable** or **decidable** if there
    exists a Turing machine that accepts it and halts on all inputs.


    *   A language is called **recursively enumerable** if there exists a Turing machine
    that accepts it.


    *   A language is recursive if and only only if its complement is recursive.


    *   A language is recursive if and only if it and its complement are recursively
    enumerable.'
