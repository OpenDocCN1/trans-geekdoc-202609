    # Appendix E Graphs


    ## E.1 Why You Should Care


    Graphs are a data type that have many applications in computer science. They show
    up when we study computer networks and social networks and when your GPS finds
    the shortest route to your destination. In fact, there are so many applications
    of graphs in computer science that there are entire courses taught on the subject.


    ## E.2 Formal Definition


    Simply put, a graph is collection of objects, called nodes or vertices, together
    with connections between some of them, called edges. While this sounds like a
    rather simple description, the study of graphs involves a large array of ideas
    and algorithms.


    The above example is technically called an undirected graph. In some situations,
    we want the edges to be directed from one vertex to another. Some applications
    where this might be useful include one-way roads and relationships that are not
    symmetric (e.g., you could follow a celebrity on a social network, but they may
    not follow you back).


    ## E.3 Graph Representation


    There are two ways to represent graphs. The adjacency list maintains a list of
    neighbors for each vertex. The adjacency matrix uses a table to indicate whether
    there is an edge between each vertex. The adjacency list is often more space efficient
    for sparse graphs (graphs with few edges), while the adjacency matrix is more
    efficient for checking if a specific edge exists.


    ## E.4 Graph Terminology


    When working with graphs, it is important to know the terminology being used.
    All the following definitions are for undirected graphs, but similar analogs exist
    for directed graphs.


    * **Vertex (Vertices)**: A node in the graph.

    * **Edge**: A connection between two vertices.

    * **Degree**: The number of edges connected to a vertex.

    * **Path**: A sequence of vertices connecting two nodes.


