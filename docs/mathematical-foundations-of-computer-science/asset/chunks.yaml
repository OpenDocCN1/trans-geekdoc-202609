    # 附录 B 概率


    ## B.1 为什么你应该关注


    计算机科学家需要了解概率以便设计随机算法——即内部包含随机选择的算法。随机算法是有用的，因为它们可以改进期望运行时间（这些被称为拉斯维加斯算法），或者以很小的失败概率为代价实现更快的计算（被称为蒙特卡洛算法）。此外，随机性对于设计数据结构（如哈希函数）、科学应用中的计算（如蒙特卡洛模拟）以及让视频游戏
    AI 对手变得不可预测非常重要。


    ## B.2 样本空间


    在研究事件的概率时，我们必须首先可能的样本空间。例如，当你掷一个六面骰子时，有六种可能的结果或掷法。当你抛硬币时，有两种结果（正面或反面）。这个集合被称为样本空间。


    ## B.3 事件


    在研究概率时，我们通常想要将若干结果分组，并统称为一个事件。


    事件的概率仅仅是组成该事件的所有结果的概率之和。


    一个事件补集的概率是 1 减去该事件本身的概率。


    对于互斥事件，其中一个事件发生的概率是这两个事件概率之和。


    如果两个事件互不影响对方的概率，则称这对事件为`独立`的。


    我们现在用数学方法重新表述这个定义。


    ## B.4 章节总结与核心概念


    *   随机试验的`样本空间`是试验所有可能结果的集合。


    *   结果 `x` 的`概率`记为 `Pr(x)`，其中 `0 ≤ Pr(x) ≤ 1`。样本空间中所有结果的概率和必须为 1。


    *   `事件`是样本空间的一个子集。事件的概率是组成该事件的结果的概率之和。


    *   事件的`补集`是事件集的补集。


    *   如果两个事件的集合不相交，则称这两个事件为`互斥`的。


    *   如果两个事件互不影响对方的概率，则称这两个事件为`独立`的。


