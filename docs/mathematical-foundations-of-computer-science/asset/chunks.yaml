    \ it is the same as multiplying the number by 2 (similar to how adding a 0 to\
    \ the end of a decimal number multiplies it by 10). When we add a 1 to the end\
    \ of a binary number, it is the same as multiplying it by 2 and then adding 1.\
    \ Therefore, when we start at state *q*[0] (the state representing a remainder\
