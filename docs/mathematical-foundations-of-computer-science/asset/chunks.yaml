    ## 10.4 质数会耗尽吗？


    许多算法（例如数据加密）都依赖于大质数的存在。如果数字是有限的，将会产生问题。接下来的证明将说明并非如此。


    ## 10.5 语言的数量


    我们将看到的下一个结果是，可能的语言数量巨大，以至于我们无法列出所有。这个证明是康托对角线法的适应，该方法证明了实数是不可列举的，这意味着存在不同规模的无限。这种技术对于我们在第
    14 章中非常重要，那时我们将证明存在任何计算机都无法接受的语言。


    ## 10.6 总结与核心概念


    * `反证法` 技术用于通过从否定陈述开始并最终导致一个不可能的情况（矛盾），来证明一个陈述是正确的。

    * 2 的平方根不能写成整数之比。

    * 质数有无限多个。

    * 可能语言的数量巨大，以至于我们甚至无法为它们列出一个无限列表。


