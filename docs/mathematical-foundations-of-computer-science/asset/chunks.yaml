    *   The `diagonal language D*` and its complement can be shown to be non-recursive
    using `diagonalization`.

    *   `Reductions` are a way of showing that a language is not recursive. To do
    this, you must reduce from a problem known not to be recursive to the problem
    being shown is not recursive.

    *   Many problems, such as determining (1) whether a Turing machine (program)
    will accept a given input, (2) whether two Turing machines (programs) accept the
    same language, and (3) whether a Turing machine (program) will ever halt are all
    known to be non-recursive.

    *   A `class` of problem is a set of languages that have the same computational
    difficulty. These include `regular`, `context-free`, `recursive`, and `recursively
    enumerable` languages.


