    \nDOI: [10.1201/9781003383284-10](https://doi.org/10.1201/9781003383284-10)\n\n\
    ## 10.1 Why You Should Care\n\nProof by contradiction is a powerful technique\
    \ that is often the best way to prove many results in computer science. It can\
    \ be an easier way to prove some results than, say, direct proof because it allows\
    \ the prover to assume more facts to be used in the proof.\n\n## 10.2 Overview\
    \ of the Technique\n\nProof by contradiction works by assuming the opposite (negation)\
    \ of what you are trying to prove and then arriving at a contradictory statement\
    \ (usually that a statement and its negation are both true). In other words, the\
    \ structure of proving some statement *S* looks like the following:\n\n1.  Assume\
    \ for a contradiction that the negation of *S* is true.\n\n2.  Make arguments\
    \ based on this assumption.\n\n3.  Show that you arrive at a contradiction.\n\n\
    This technique gives you a starting point for your proof—assuming the negation\
    \ of the statement you are trying to prove. The tricky part with it is figuring\
    \ out how to get to the final contradiction.\n\n## 10.3 Why You Can't Write $\\\
    \\sqrt{2}$ as an Integer Fraction\n\nThe technique of proof by contradiction dates\
    \ back at least to the ancient Greek who used it to show that $\\\\sqrt{2}$ is\
    \ irrational.\n\nThe Pythagoreans used proof by contradiction to show that $\\\
    \\sqrt{2}$ is irrational. An interesting side effect of this is that it is impossible\
    \ to precisely store the value of $\\\\sqrt{2}$ as a float, double, or even using\
    \ a rational number class since we would need infinite precision to capture all\
    \ the digits in the number. We see why next.\n\nIn the above proof we use the\
    \ fact that the square of an odd number is always an odd number. This follows\
    \ from the fundamental theorem of arithmetic."
