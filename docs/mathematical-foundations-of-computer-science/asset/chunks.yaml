    \n## 3.1 Why You Should Care\n\nIt is not an exaggeration to say that mathematical\
    \ logic underlies all of computer science. Computer circuits are made out of logical\
    \ operators. The mathematical arguments we make about algorithms follow the rules\
    \ of logic. Moreover, understanding logic will make you better at writing conditional\
    \ (if) statements and (while) loops when you code.\n\n## 3.2 Logical Statements\n\
    \nA **logical statement** is a mathematical statement that has a value of **true**\
    \ or **false**.\n\nWe can treat logical statements like mathematical objects (for\
    \ instance, sets or strings) and give them names.\n\nSometime propositions take\
    \ arguments, in which case they are called predicates.\n\n## 3.3 Logical Operations"
