    \ of elimination, this means that the strings that reach state *q*[0] are the\
    \ ones that neither end in 0 nor 01. We use this to once again prove the result\
    \ as above.\n\nWe wrap the proof up similar to before.\n\n## 9.4 An Example with\
    \ Sink States\n\nHere is another example with sink states.\n\nBefore reading on,\
    \ try to determine the set of strings that can reach the states *q*[0], *q*[1], *q*[2],\
    \ and *q*[3] in [Figure 9.3](#chapter9.xhtml#fig9_3). Some examples of strings\
    \ in each set are given below to help you get started.\n\n![Figure 9.3 DFA for\
    \ all strings over \\\\{ 0,1\\\\} that start with 0 and contain a 1](images/fig9_3.jpg)\n\
    \n[Figure 9.3](#chapter9.xhtml#b9fig9_3) DFA for all strings over {0, 1} that\
    \ start with 0 and contain a 1\n\nHere are the sets for each state:\n\n*   The\
    \ start state *q*[0] has no transitions entering it, so the only string that ends\
    \ at *q*[0] is *λ*. Thus, the set in this case is {*λ*}.\n\n*   The state *q*[1]\
    \ is a sink state for strings that start with a 1. The set is then {1*s* : *s* ∈ {0, 1}^(\\\
    *)}.\n\n*   The state *q*[2] can only be reached by strings that have one or more\
    \ 0s and no 1s. The set is thus {0^(*n*) : *n* ≥ 1}.\n\n*   Lastly, the state\
    \ *q*[3] has all the remaining strings, namely the ones that start with a 0 and\
    \ contain a 1. This set is {0*s*1*t* : *s*, *t* ∈ {0, 1}^(\\*)}.\n\nFinally, we\
    \ wrap up the induction step and explain to the reader how the induction hypothesis\
    \ tells us the language of the DFA.\n\n## 9.5 Chapter Summary and Key Concepts\n\
    \n*   We can prove that a DFA accepts a given language using **mutual induction.**\n\
    \n*   The function *δ̂* extends the *δ* function of a DFA to apply to strings.\n\
    \n*   The mutual induction **hypothesis** defines precisely what set of strings\
    \ ends at each state.\n\n*   The mutual induction **base case** verifies the hypothesis\
    \ for the empty string.\n\n*   The mutual induction **inductive step** proves\
    \ that strings of length *n* + 1 end at the correct state assuming that the strings\
    \ of length *n* do so.\n\n*   The mutual induction **conclusion** both concludes\
    \ the induction proof and demonstrates the language of the DFA by examining the\
    \ set of strings that reach the accepting state(s).\n\n## Exercises\n\nDraw DFAs\
