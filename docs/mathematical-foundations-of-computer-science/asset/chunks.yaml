    # 附录 D 渐近符号


    ## D.1 为什么需要它


    在分析算法效率时，计算机科学家使用渐近符号（asymptotic notation）来捕捉如运行时间、内存占用、查询次数、能量消耗等指标。分析这些数量的增长率，比计算少数几个实例的精确值重要得多。


    ## D.2 为什么使用渐近符号


    假设你正在比较两个算法，并试图决定为你正在开发的应用实现其中哪一个。如果你想了解哪一个运行得更快，你可以统计每个算法的基本操作次数并以此进行比较。为了具体说明，假设你有一个算法，在输入规模为
    `n` 时需要 `f(n)` = 1000n 次操作，另一个需要 `g(n)` = n² 次操作。如果你在问题的小实例上运行这些算法，你可能会发现第二个算法运行更快。但在实践中，计算机科学家对小实例保持警惕，因为我们知道数据规模在不断增加，我们应该为大数据集做长远计划。这就是渐近符号允许我们在更大规模下比较上述算法。


    在上面的示例中，我们会说第一个算法是 `Θ(n)`（读作“theta of `n`”）时间级算法，第二个是 `Θ(n²)` 时间级。换句话说，第二个函数的增长率远高于第一个。例如，如果规模增加一千倍，第一个算法的运行时间会增加千倍，但第二个算法的运行时间会增加百万倍！这在处理大规模输入时非常关键。


    ## D.3 Theta 符号


    渐近符号最有用的形式是 theta 符号（theta notation），因为它对函数提供了精确的刻画。当你不确定应该使用哪种类型的渐近符号时，theta
    符号是最佳选择。


    换句话说，如果对于足够大的 `n`，我们可以将函数 `f(n)` 夹在 `g(n)` 的常数倍之间，那么我们可以 `f(n)` = `Θ(g(n))`。注意，可能有多个不同的常量
    `n[0], c[1], c[2]` 也适用。


    ## D.4 Big-O 和 Big-Ω 符号


    有时我们无法或不在乎计算函数的精确刻画，并乐于接受一个上界或下界。例如，我们可能想证明我们的排序程序最多花费二次级时间。在这种情况下，我们可以使用 `Big-O`
    作为上界，使用 `Big-Ω`（“big omega”）作为下界。


    ## D.5 严格界限


    上述所有界都是包含所比较函数本身的包含性界限。在某些情况下，我们想要说明一个函数的渐近增长率严格小于（或大于）另一个函数。这就是 little-o 和 little-ω（“little
    omega”）符号使用的地方。


    严格下界 little-ω 的定义类似。


    ## D.6 常见错误


    初学者在处理渐近符号时会犯许多错误。下面列出了一些你想要避免的错误：


