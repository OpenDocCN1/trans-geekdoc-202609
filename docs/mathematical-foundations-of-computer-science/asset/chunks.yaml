    * D.19 `10*n³ = ω(n²)`


    证明以下内容：


    * D.20 如果 `f(n) = O(h)` 且 `g(n) = O(h)`，则 `f(n) + g(n) = O(h)`。

    * D.21 如果 `f(n) = O(g)` 且 `g(n) = O(h)`，则 `f(n) = O(h)`。

    * D.22 `f(n) = O(g)` 充分当仅当 `g(n) = Ω(f(n))`。

    * D.23 `f(n) = o(g)` 充分当仅当 `g(n) = ω(f(n))`。

    * D.24 证明 `f(n) = Θ(g)` 充分当仅当 `f(n) = O(g)` 且 `f(n) = Ω(g(n))`。


    # 录 E 图


    ## E.1 为什么你应该关注图


    图在计算机科学中有许多应用。当我们研究计算机网络、社交网络以及 GPS 寻找最短路径时，图就会出现。


    ## E.2 形式化定义


    简单来说，图是一组对象（称为节点或顶点）以及它们之间某些对象的连接（称为边）。虽然这听起来是一个简单的描述，但图的研究涉及大量的思想和算法。


    上面的例子在技术上被称为无向图。在某些情况下，我们希望边是从一个顶点指向另一个顶点。


    ## E.3 图的表示


    有两种表示图的方法。邻接列表为每个顶点维护一个邻居列表。邻接矩阵使用表格表示每个顶点之间是否存在边。邻接列表对于稀疏图（边较少的图）通常在空间上更高效，而邻接矩阵在检查是否存在特定边时更有效。


    ## E.4 图术语


    在处理图时，了解所使用的术语非常重要。以下所有定义都适用于无向图，但有图中也有类似的定义。


    * **顶点 (Vertex)**：图中的节点。

    * **边 (Edge)**：两个顶点之间的连接。

    * **度 (Degree)**：连接到顶点的数量。

    * **路径 (Path)**：连接两个顶点的顶点序列。


