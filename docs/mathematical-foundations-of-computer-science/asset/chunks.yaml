    \ in [Figure E.6](#appE.xhtml#fig19_6) bipartite? List out the vertices in `L`\
    \ and `R` if it is.\n*   E.24 Is the graph in [Figure E.7](#appE.xhtml#fig19_7)\
    \ bipartite? List out the vertices in `L` and `R` if it is.\n\n# Appendix F Loop\
    \ Invariants\n\n## F.1 Why You Should Care\n\nWhen you write a function to search\
    \ or sort a list, how do you know that it will work on all valid inputs? You certainly\
    \ can't test it on every possible input. In computer science, we prove correctness\
    \ of our algorithms. A common technique for proving correctness of algorithms\
    \ with loops is the loop invariant proof. Read on to learn more!\n\n## F.2 Summing\
    \ a List\n\nConsider the following algorithm ([Algorithm F.1](#appE.xhtml#fig19_1))\
    \ for summing a list:\n\nTo prove the correctness of the algorithm, we use a loop\
    \ invariant. The loop invariant is given below:\n\n```\nL[0..i-1] is the sum of\
    \ the first i elements of the list L.\n```\n\nDuring each iteration, the invariant\
    \ is maintained. When the loop terminates, the invariant shows us that the algorithm\
    \ has correctly computed the sum of all elements in the list.\n\n## F.3 Exponentiation\n\
    \nConsider the following algorithm ([Algorithm F.2](#appE.xhtml#fig19_2)) for\
    \ exponentiation:\n\n```\nresult = 1\ni = 0\nwhile i < n:\n    result = result\
    \ * a\n    i = i + 1\n```\n\nTo prove the correctness of this algorithm, we propose\
    \ the following loop invariant:\n\n```\nresult = a^i\n```\n\nAt each iteration,\
    \ the invariant is maintained. When the loop terminates, the invariant shows that\
    \ `result = a^n`.\n\nNow consider a more efficient algorithm ([Algorithm F.3](#appE.xhtml#fig19_3))\
    \ which uses a `while` loop:\n\n```\nresult = 1\nbase = a\nwhile n > 0:\n    if\
    \ n % 2 == 1:\n        result = result * base\n    base = base * base\n    n =\
    \ n / 2\n```\n\nTo prove the correctness of this algorithm, we use the following\
    \ loop invariant:\n\n```\nresult * base^n = initial_a\n```\n\n## F.4 Insertion\
    \ Sort\n\nThe following Insertion Sort algorithm ([Algorithm F.4](#appE.xhtml#fig19_4))\
    \ sorts a list of comparable types:\n\n```\nfor i from 1 to len(L)-1:\n    key\
    \ = L[i]\n    j = i - 1\n    while j >= 0 and L[j] > key:\n        L[j+1] = L[j]\n\
    \        j = j - 1\n    L[j+1] = key\n```\n\nDuring each iteration, a larger prefix\
    \ of the list is sorted. We use the following loop invariant for it:\n\n```\n\
    L[0..i-1] is a sorted permutation of the first i elements of L.\n```\n\n## F.5\
    \ Chapter Summary and Key Concepts\n\n*   **Loop invariants** are statements that\
    \ are true at the start of each iteration of a loop. They allow us to prove correctness\
    \ of the algorithm.\n*   Any loop invariant proof has four parts:\n    1.  **stating**\
    \ the invariant.\n    2.  **initialization** step in which the invariant is shown\
    \ to be true at the start of the loop.\n    3.  **maintenance** step in which\
    \ it is shown that if the invariant was true before the previous iteration then\
    \ it must be true before the next iteration.\n    4.  **termination** step in\
    \ which the invariant is used to show that the loop correctly computed what was\
    \ supposed to.\n\n## Exercises\n\nWrite out algorithms (with **loops**) for each\
    \ of the following and prove them correct using loop invariant proofs.\n\n*  \
    \ F.1 Finding the maximum of a list\n*   F.2 Finding the minimum of a list\n*\
    \   F.3 Summing up the first *n* positive integers\n"
