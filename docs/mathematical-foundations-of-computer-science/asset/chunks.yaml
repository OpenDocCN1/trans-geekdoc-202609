    ## 4.1 为什么你应该关注


    非确定有限自动机（NFA）允许我们为相同的语言创建更简单、通常更小的自动机。它们是确定有限自动机（DFA）的推广，增加了非确定属性。虽然非确定性不是任何真实计算机能够执行的，但它是理论计算机科学的一个重要概念。特别是在随后的课程中，你将学习许多需要这一概念来解决的
