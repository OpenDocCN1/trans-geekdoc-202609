    * Erin, Kiran, and Shannon: the best family a dad-dad could ask for.


    This book is dedicated to the memory of my father, Ajit.


    # Chapter 1: Mathematical Data Types


    DOI: [10.1201/9781003383284-1](https://doi.org/10.1201/9781003383284-1)


    ## 1.1 Why You Should Care


    In this chapter, you will learn about the basic mathematical objects that you
    will use throughout this book. You can think of this as analogous to learning
    about primitive data types (e.g., `int` or `float`) in a programming language.
    It is critical to understand these very well to be able to understand more complex
    ideas.


    ## 1.2 Sets


    You can think of a set as a box with a collection of objects in it. For example,
    below is an instance of a set with the numbers 1, 2, and 3 in it. This set is
    represented by the notation `{1, 2, 3}.


    There are a few important things to note about the idea of a set. First, a set
    does not have any repeated objects. If an object is repeated, it is only counted
    once. In particular, both the sets in the example below are the same because it
    doesn''t matter how many times 3 appears in the set.


    Second, the order of a set is immaterial. The sets `{1, 2, 3}` and `{2, 1, 3}`
    are the same set. This is very different from the idea of a list in a programming
    language like Python, where `[1,2,3]` and `[2,1,3]` are different lists.


    Sets can contain objects of a variety of types, not just numbers.


    We are now prepared to see our first definition:


    ## 1.3 Set Terminology


    There is much terminology surrounding sets that is necessary to know as a computer
    scientist. The easiest way to learn it is to see lots of examples.


    Any object in a set is called an `element` or `member` of the set.


    We say that any object not in a set is not an element.


    If all the elements of a set `A` are elements of another set `B`, we say that
    the first set is `contained` in the second or that `A` is a `subset` of `B` and
    write this as `A ⊆ B`.


    A special case of this is that a set is always a subset of itself.


    A special set, called the `empty set`, denoted by `∅`, is the set with no elements.
    The empty set is a subset of all sets, including itself.


    A set is a `proper subset` of another if the former is a subset that does not
    have all the elements of the latter.


    Two sets are `equal` if they have exactly the same elements. An alternative definition
    is that both sets are subsets of each other.


    The `cardinality` of a set is the number of distinct items it contains. The cardinality
    of a set is denoted by vertical bars around the set.


    A set is called `finite` if its size or cardinality is a finite integer.


    A set is called `infinite` if the number of elements in it is infinite.


    There are a few infinite sets that have special symbols to represent them. The
    set of natural numbers `ℕ` is defined as:


    The set of integers `ℤ` is defined as follows:


    The set of all real numbers is denoted by `ℝ`.


    ## 1.4 Set-Builder Notation


    When we are representing sets, especially infinite ones, it is useful to use `set-builder
    notation`. In this notation, a set is given in the form `{expression: constraints}`,
    where the expression is an operation performed on all possible values with the
    given constraints before insertion into the set.


    You can think of this as a `for loop` that iterates through all the values that
    fit the conditions to the right of the colon (i.e., the natural numbers 0, 1,
    2, 3, 4) and inserts these values into the set.


    The expression to the left of the colon is an operation that can be applied to
    the values being iterated over. In the above example, the operation does nothing
    to each value. In the example below we double the value instead.


    Set-builder can also be used for sets with infinite elements, even though a `for
    loop` to build it would never terminate.


    We can also use set-builder to describe sets using plain English, as shown in
    the below:


    ## 1.5 Union, Intersection, Difference, Complement


    There are a number of standard operations that are performed on sets. The `union`
    of sets is the set of elements in at least one of them.


    The `intersection` of sets is the set of elements in all of them.


    The `difference` of sets is the set of elements in the first that are not in the
    second. The difference of sets `A` and `B` is written `A \ B`.


    In some cases, sets are defined as a universal set, denoted `U`. The `complement`
    of a set `A` is the set of `U` that are not in `A`.


    ## 1.6 Venn Diagrams


    A way to visualize set operations is to draw `Venn diagrams`. These diagrams show
    operations between one or more sets. We can even visualize set operations involving
    three sets. These Venn diagrams can sometimes be used to demonstrate relationships
    between different expressions. For example, De Morgan''s Laws state that `∪B =
    A''∩B''` and `A∩B = A''∪B''`.


    ## 1.7 Power Sets


    It is sometimes useful to refer to the set of all subsets of a set. We can also
    have more complex power sets. Since each element of a set can either be included
    or not included in a subset, we can have an exponential number of subsets. More
    specifically, the cardinality of the power set of a set `A` is given by `|P(A)|
    = 2^{|A|}`.


    ## 1.8 Tuples and Cartesian Products


    Next, we look at the tuple type that is closest to the notion of a list in programming
