    # 引言


    1. 渐近符号关注的是函数的增长率，而不仅仅是算法的运行时间。因此，例如，你应该说一个算法具有 `O(n)` `running time`，而不是简单地说一个算法是
    `O(n)`。渐近符号也可以用于分析内存、磁盘占用、数据库查询次数以及算法的其他属性。


    2. 永远不要说“至少 Big-O”，因为 Big-O 是一个上界。相反，请使用 `Ω` 符号，或者更好的 `Θ` 符号。在不确定时，请保持精确，除非你真的没有对函数的精确刻画，否则请使用
    `Θ` 符号。


    3. 虽然 `2*n = O(n)` 和 `3*n = O(n)` 是成立的，但要警惕任何类似于 `n + n + ... + n`（`n` 次） = `O(n)`
    的情况，因为这是不成立的。


    ## D.7 章节总结与核心概念


    * **渐近符号 (Asymptotic notation)** 允许我们比较函数的增长率。它在分析算法消耗的时间和内存时被广泛使用。


    * **Theta (Θ) 符号** 用于精确刻画函数的增长率。我们说 `f(n)` 是 `Θ(g(n))`，如果存在 `n[0]`、`c[1]`、`c[2]
    > 0`，对于所有 `n ≥ n[0]`，都有 `c[1]*g(n) ≤ f(n) ≤ c[2]*g(n)`。


    * **Big-O (O) 符号** 用于计算函数的上界。我们说 `f(n)` 是 `O(g(n))`，如果存在 `n[0]`、`c > 0`，对于所有 `n
    ≥ n[0]`，都有 `f(n) ≤ c*g(n)`。


    * **Big-Omega (Ω)** 用于计算函数的下界。我们说 `f(n)` 是 `Ω(g(n))`，如果存在 `n[0]`、`c > 0`，对于所有
    `n ≥ n[0]`，都有 `c*g(n) ≤ f(n)`。


    * **Little-o (o) 符号** 用于计算函数的严格上界。我们说 `f(n)` 是 `o(g(n))`，如果对于所有 `c > 0`，存在一个常数
    `n[0] > 0`，对于所有 `n ≥ n[0]`，都有 `f(n) < c*g(n)`。


    * **Little-omega (ω) 符号** 用于计算函数的严格下界。我们说 `f(n)` 是 `ω(g(n))`，如果对于所有 `c > 0`，存在一个常数
    `n[0] > 0`，对于所有 `n ≥ n[0]`，都有 `c*g(n) < f(n)`。


