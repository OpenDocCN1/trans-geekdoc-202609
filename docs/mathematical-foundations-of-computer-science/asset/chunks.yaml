    *   E.13 给出图 E.5 图中图的邻接矩阵表示。\n*   E.14 给出图 E.6 图中图的邻接矩阵表示。\n*   E.15 给出图 E.7 图中图的邻接矩阵表示。\n\
    *   E.16 列出图 E.6 图中每个节点的度。\n*   E.17 列出图 E.7 图中每个节点的度。\n*   E.18 图的子图是顶点的一个子集以及它们之间所有的边。对于图\
    \ E.6 图中最大的完全图子图的大小有多大？图 E.7 图中最大的完全图子图的大小有多大？\n*   E.19 在图 E.6 图中找到一个仅第一个和最后一个顶点重复的最长环。\n\
    *   E.20 在图 E.7 图中找到一个仅第一个和最后一个顶点重复的最长环。\n*   E.21 图 E.6 中的图是树吗？\n*   E.22 图 E.7\
    \ 中的图是树吗？\n*   E.23 图 E.6 中的图是二部图吗？如果是，列出 `L` 和 `R` 中的顶点。\n*   E.24 图 E.7 中的图是二部图吗？如果是，列出\
    \ `L` 和 `R` 中的顶点。\n\n# 附录 F 循环不变性\n\n## F.1 为什么你应该关注\n\n当你编写一个函数来搜索或排序列表时，你如何知道它对所有有效输入都有效？你显然无法对每个可能的输入进行测试。在计算机科学中，我们证明算法的正确性。证明带有循环的算法正确性的常用技术是循环不变性证明。继续阅读以了解更多！\n\
    \n## F.2 列表求和\n\n考虑以下求和和的算法 (算法 F.1)：\n\n为了证明算法的正确性，我们使用循环不变性。循环不变性如下：\n\n```\n\
    L[0..i-1] 是列表 L 前 i 个元素的和。\n```\n\n在每次迭代期间，不变性都保持不变。当循环结束时，不变性告诉我们算法已正确计算了列表中所有元素的和。\n\
    \n## F.3 幂运算\n\n考虑以下幂运算的算法 (算法 F.2)：\n\n```\nresult = 1\ni = 0\nwhile i < n:\n\
    \    result = result * a\n    i = i + 1\n```\n\n为了证明这个算法的正确性，我们提出以下循环不变性：\n\n\
    ```\nresult = a^i\n```\n\n在每次迭代中，不变性都保持不变。当循环结束时，不变性显示 `result = a^n`。\n\n现在考虑一个更高效的使用\
    \ `while` 循环的算法 (算法 F.3)：\n\n```\nresult = 1\nbase = a\nwhile n > 0:\n    if n\
    \ % 2 == 1:\n        result = result * base\n    base = base * base\n    n = n\
    \ / 2\n```\n\n为了证明这个算法的正确性，我们使用以下循环不变性：\n\n```\nresult * base = initial_a\n```\n\
    \n## F.4 插入排序\n\n以下插入排序算法 (算法 F.4) 对可比较类型的列表排序：\n\n```\nfor i from 1 to len(L)-1:\n\
    \    key = L[i]\n    j = i - 1\n    while j >= 0 and L[j] > key:\n        L[j+1]\
    \ = L[j]\n        j = j - 1\n    L[j+1] = key\n```\n\n在每次迭代期间，列表的一个更大的前缀是有序的。我们使用以下循环不变性：\n\
    \n```\nL[0..i-1] 是 L 前 i 个元素的有序排列。\n```\n\n## F.5 核心概念\n\n*   **循环不变性**是在循环迭代开始时成立的语句。它们允许我们证明算法的正确性。\n\
    *   任何循环不变性证明都有四个部分：\n    1.  **陈述**不变性。\n    2.  **初始化**步骤，证明不变性在循环开始时是成立的。\n\
    \    3.  **维护**步骤，证明如果不变性在上一次迭代之前成立，那么它在下一次迭代之前也必须成立。\n    4.  **终止**步骤，利用不变性证明循环正确地计算了预期的结果。\n\
    \n## 练习题\n\n为以下每个问题编写算法（带有**循环**），并使用循环不变性证明证明它们的正确性。\n\n*   F.1 寻找列表中的最大值\n*\
    \   F.2 寻找列表中的最小值\n*   F.3 求前 *n* 个正整数的和\n\n"
