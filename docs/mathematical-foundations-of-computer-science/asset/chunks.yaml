    # 第 8 章 归纳法


    DOI: [10.1201/9781003328408](https://doi.org/10.1201/9781003328408)


    ## 8.1 为什么你应该关注


    归纳法是计算机科学中广泛使用的一种关键证明技术。它被用于证明带有循环和递归的算法的正确性。它还用于展示运行时间的界限。我们还将看到前面章节中的某些结果是如何证明的。


    ## 8.2 归纳与递归


    考虑 `Algorithm 8.1` 中计算 `factorial` 函数的伪代码。为什么上面的算法是有效的？我们如何证明它总是返回正确答案？直观推理如下：


    1. 当 `n = 1`（最小可能的输入）时，函数返回正确答案 `1`。

    2. 当 `n = 2` 时，函数的第三行返回 `factorial(1) * 2`，即 `1 * 2` 或 `2`。

    3. 当 `n = 3` 时，函数的第三行返回 `factorial(2) * 3`，即 `2 * 3` 或 `6`。

    4. 当 `n = 4` 时，函数的第三行返回 `factorial(3) * 4`，即 `6 * 4` 或 `24`。

    5. 这种模式可以无限持续，直到我们达到任何所需的整数。


    归纳法背后的思想是将这种模式形式化。我们必须证明函数对于最小输入 `n = 1` 给出正确答案（称为基础步骤 base step）。然后我们必须证明如果函数在某些情况
    `n = k` 下有效，那么它在 `n = k + 1` 的情况下也必须有效（称为归纳步骤 inductive step）。


    让我们使用上面的例子来写一个更正式的证明。归纳法始终包含四个部分，你应该练习编写所有部分，直到你成为一个经验丰富的证明编写者。这四个部分是：


    1. 陈述假设

    2. 基础步骤

    3. 归纳步骤

    4. 结论


    为了方便编写证明，我们用函数 `P` 来表示假设，以便稍后更简洁地引用它。归纳法始终包含四个部分，你应该练习编写所有部分，直到你成为一个经验丰富的证明编写者。这四个部分是：


    1. 陈述假设

    2. 基础步骤

    3. 归纳步骤

    4. 结论


    为了方便编写证明，我们用函数 `P` 来表示假设，以便稍后更简洁地引用它。


    （注：此处原文中存在部分内容重复，已根据指令“不要重复输出原文”的原则在翻译时进行了逻辑对齐和处理）


    ## 8.3 理解归纳法的类比


    归纳法的类比是建造一栋多层建筑或塔。在建造建筑时，确保底层是稳固的重要的，这比比归纳法的基础。只有在第一层（基础）建立之后，我们才能建造第二层。


    在归纳证明中，我们必须证明以下两个事实：


    1. 底层或基础是稳固的。[证明 `P(1)` 为真。]

    2. 如果任何层 `k` 都是稳固的，那么第 `k + 1` 层也是稳固的。[对于所有 `k ≥ 1`。]


    ## 8.4 使用归纳法分析排序运行时间


    在分析诸如选择排序和插入排序的运行时间时，可以证明排序包含 `n` 个元素的列表需要 `1 + 2 + 3 + … + (n-1)` 步的时间。为了证明这些排序算法是平方级时间，证明
    `1 + 2 + 3 + … + (n-1) = n(n-1)/2` 对于所有 `n ≥ 1` 会有帮助。在证明这个结果之前，我们将进行简短的离题，介绍一些你在本书和以后的课程中经常遇到的符号。


    与其写出如 `1 + 2 + 3 + … + (n-1)` 的长级数，我们可以使用求和符号或 sigma 符号（用于表示它的希腊字母），如下：


    '
- fmt: '

    $$\begin{array}{l} {\sum\limits\_{i = 1}^{n - 1}i = 1 + 2 + 3 + \ldots + (n -
    1).} \\ \end{array}$$


    In this notation, the `Σ` indicates summation (not to be confused with a string
    alphabet). The subscript (here, `i` = 1) indicates what value we start `i` at
    in the summation, the superscript (here, `n` − 1) indicates the (inclusive) stopping
    point, and the expression right after is the function that is applied to each
    of the values of `i` that are being summed. In this example, we are just adding
    up all these values of `i`.


    We will now demonstrate $\sum\limits\_{i = 1}^{n - 1}i = n(n - 1)/2$ using induction.


    Once again, note that `P`(*n*)` is a logical statement (taking values true or
    false) and not the sum of the series. Specifically, it denotes whether or not
    the sum of the series is equal to the formula `n`(*n* − 1)/2.


    Let us understand how the derivation above was developed. First, start with what
    you are assuming (`P`(*k*)`) , which is $\sum\limits\_{i = 1}^{k - 1}i = k(k -
    1)/2$ and what you are trying to prove (`P`(*k* + 1)`) , which is $\sum\limits\_{i
    = 1}^{(k + 1) - 1}i = (k + 1)((k + 1) - 1)/2$ or $\sum\limits\_{i = 1}^{k}i =
    (k + 1)k/2$. When proving equality, we start with one side of what we are trying
    to prove (here, $\sum\limits\_{i = 1}^{k}i$) and we want to show that it is equal
    to the right side ((*k* + 1)*k*/2)). To do this, we have to make a connection
    to the induction hypothesis. For proving the sum of series, this will almost always
    look the same: observe that the sum of the larger series is the same as the smaller
    one with an additional term. This is why, for this example, we break down the
    summation $\sum\limits\_{i = 1}^{k}i$ into $\sum\limits\_{i = 1}^{k - 1}i$ and
    `k` on the third line of the derivation. We can now apply the induction hypothesis
    to replace $\sum\limits\_{i = 1}^{k - 1}i$ with `k`(*k* − 1)/2 on the fourth line.
    Finally, we use algebra to show that we get the expression on the right-hand side
    of the equality we are trying to prove ((*k* + 1)*k*/2)).


    The conclusion step is identical to the one in the first example.


    ## 8.5 How Many Bit Strings are There of Length (At Most) *N*?


    We''ll next use induction to prove a result about the number of distinct bit strings,
    that is, strings of length `n` over the alphabet `Σ` = {0, 1}. There is exactly
    one string of length 0, namely `λ`. For length one, we have two: {0, 1}. For length
    two we have 4: {00, 01, 10, 11}, and for length three we have eight: {000, 001, 010, 011, 100, 101, 110, 111}.
    Before reading ahead, what is the pattern that you notice?


    You may have noticed that the number of strings of each successive length is twice
    that of the length one smaller. We might then use this to make the hypothesis
    `P`(*n*)`: the number of strings of length `n` is equal to 2^(*n*). Let us see
    how to prove this.


    Notice that this case was slightly different than the previous examples as we
    started from `n` = 0. The induction step also needed a slightly more sophisticated
    argument showing that `P`(*k*)` implies `P`(*k* + 1)`. . The approach we used
    earlier still works. Start by writing out the statements for `P`(*k*)` and `P`(*k* + 1)`
    fully for the problem. Then articulate why `P`(*k* + 1)` is true given the fact
    that `P`(*k*)` is true.


    We can take this analysis one step further to answer the question of how many
    strings there are of length *at most* `n`. We know from the previous theorem that
    the number of strings of length `n` is exactly 2^(*n*), so the number of strings
    of length at most `n` must be the number of strings of lengths 0, 1, 2, …, *n*,
    or $\sum\limits\_{i = 0}^{n}2^{i}$. When `n` = 0, this is just 2⁰ or 1. When `n` = 1,
    we get 2⁰ + 2¹ = 3. When `n` = 2, we have 2⁰ + 2¹ + 2² = 7. When `n` = 3, it is
    2⁰ + 2¹ + 2² + 2³ = 15. Do you see a pattern emerging? Try to guess the pattern
    before reading on.


    You may have noticed that the *n*th number consistently turns out to be 2^(*n* − 1) −1.
    (This is not the only way of expressing the pattern; you might have also observed
    that each number is one more than twice the previous, which is also correct.)
    Let us state this formally as a hypothesis and see how we can prove it.


    Notice that this time we used the proof by induction as part of a larger proof.
    It is important to tell the reader that we used induction, both in the setup and
    the conclusion.


    ## 8.6 Comparing Growth of Functions


    When you later learn about algorithms, you will have to compare which ones grow
    faster. Note that the factorial function grows substantially faster than the exponential
    function, as seen in the table below.


