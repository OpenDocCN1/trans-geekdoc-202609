    \ 3 and 5 to make any amount of postage `n` ≥ 8.\n*   8.30 Design your own analogy\
    \ for strong induction. Be sure to clearly state what are the hypothesis, base\
    \ case, and inductive step in your analogy.\n\n# Chapter 9 Proving the Language\
    \ of a DFA\n\nDOI: [10.1201/9781003383284-9](https://doi.org/10.1201/9781003383284-9)\n\
    \n## 9.1 Why You Should Care\n\nNow that you know how to create DFAs, you should\
    \ next verify that the DFA you created does accept the language you think it does.\
    \ This is analogous to showing that the algorithm you designed gives the correct\
    \ answer on all possible inputs, something that every computer scientist should\
    \ be doing.\n\n## 9.2 A Simple Example\n\nWe will start with the simple DFA below\
    \ ([Figure 9.1](#chapter9.xhtml#fig9_1)):\n\n![Figure 9.1 DFA for odd length strings\
    \ over {0,1}](images/fig9_1.jpg)\n\n[Figure 9.1](#chapter9.xhtml#b9fig91) DFA\
    \ for odd length strings over {0,1}\n\nIt should be apparent that this DFA accepts\
