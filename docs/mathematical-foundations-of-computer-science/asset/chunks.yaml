    ## 2.8 Divisibility in Binary\n\nFinite automata can also be used to compute mathematical\
    \ properties. For example, we will see how to determine whether a number, given\
    \ in binary, is divisible by three next. Before we do this, we will take a short\
    \ detour to review binary numbers.\n\nIn the decimal number system (or base 10)\
    \ that we are used to using, the digit at each position indicates the corresponding\
    \ power of ten's place for the number. For example, the decimal number 1234 can\
    \ be written as\n\n$$\\\\begin{array}{l} {1234 = 1 \\\\times 10^{3} + 2 \\\\times\
    \ 10^{2} + 3 \\\\times 10^{1} + 4 \\\\times 10^{0}.} \\\\\\\\ \\\\end{array}$$\
    \  \n\nIn other words, there is a 1 in the thousand's (10³) place, a 2 in the\
    \ hundred's (10²) place, a 3 in ten's (10¹) place, and a 4 in the one's (10⁰)\
    \ place.\n\nSimilarly, binary (or base 2) numbers have places for the powers of\
    \ two. For example, the binary number 1011[2] (here, the subscript 2 indicates\
    \ that the number is in binary) can be written as\n\n$$\\\\begin{array}{l} {1011\\\
    _{2} = 1 \\\\times 2^{3} + 0 \\\\times 2^{2} + 1 \\\\times 2^{1} + 1 \\\\times\
    \ 2^{0} = 8 + 0 + 2 + 1,} \\\\\\\\ \\\\end{array}$$  \n\nwhich is just the number\
    \ eleven.\n\nNow, to solve the divisibility by three in binary problem, we will\
    \ use the following strategy. An alternative way of saying that a number is divisible\
    \ by three is to say that it leaves a remainder of zero when divided by three.\
    \ We will thus design a DFA that keeps track of the remainder of the number when\
    \ dividing by three, with one state for each of the remainders 0, 1, and 2, as\
    \ seen in the following DFA:\n\nTo understand how the DFA was designed, it is\
    \ first necessary to understand what happens to a binary number when a 0 or a\
