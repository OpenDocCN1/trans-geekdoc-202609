    数论是许多哈希函数、伪随机数生成器和密码学算法的基础。没有数论，大多数现代加密和加密货币将无法实现。


    ## C.2 模运算


    当我们在 `Python` 中除整数整数时，我们实际上是在进行取整除（floor division）。`Floor division` 是将一个整数除以一个非零整数并向下取整。


    我们现在可以如下方式定义除法的商和余数：


    商和余数可以使用以下除法算法来计算：我们使用一种称为 `modulus`（模）的操作，缩写为 `mod` 来获取余数。这与大多数编程语言中的 `%` 操作相同，尽管它在不同语言中对负数的处理方式不同（与除法一样）。


    `mod` 术语有时也用于表示两个数在被同一个除数除以时具有相同的余数。这被称为模该除数同余（congruence modulo the divisor），写作
    `a` ≡ `b` (`m`o`d` `c`))（即 `a` 模除数 `c` 同余于 `b`）。


    如果一个整数 `a` 能被另一个非零整数 `b` 整除（写作 `b` | `a`），我们说 `a` 被 `b` 整除。我们称 `b` 为 `a` 的 `divisor`（约数）或
    `factor`（因子）。


    对于许多数值算法（例如将分数约化为简形式），我们需要计算两个数字之间的最大公约数（在某些地区也称为最高公因数）。


    对于一对正整数，另一个有用的函数是最小公倍数，它用于寻找两个分数的公分母。


    最大公约数和最小公倍数是相互相关的。对于任何正整数 `a` 和 `b`，我们有 `gcd(`a`, `b`)` ⋅ `lcm(`a`, `b`)` = `a` ⋅ `b`。这意味着如果我们知道其中一个，就可以很容易算出另一个。我们通常使用接下来要学的
    `Euclid''s algorithm`（欧几里得算法）来计算 `gcd`。


    ## C.3 用于 GCD 的欧几里得算法


    与其尝试一对数字所有可能的除数，`Euclid''s algorithm` 以非常高效且优雅的方式计算出 `gcd`。


    ## C.4 章节总结与核心概念


    *   `Floor division` 是整数相除且没有余数的情况。

    *   当除两个正整数时，`floor division` 的结果被称为 `quotient`（商）。任何剩余部分被称为 `remainder`（余数），并通过
    `mod` 操作计算。

    *   一对正整数的 `greatest common divisor`（最大公约数）是能整除这两者的最大整数。

    *   一对正整数的 `least common multiple`（最小公倍数）是两个者的倍数中的最小正整数。

    *   `Euclid''s algorithm` 允许我们快速计算两个正整数的最大公约数。


