    # Appendix EGraphs


    ## E.1 Why You Should Care


    Graphs are a data type that have many applications in computer science. They show
    up when we study computer networks and social networks and when your GPS finds
    the shortest route to your destination. In fact, there are so many applications
    of graphs in computer science that there are entire courses taught on the subject.


    ## E.2 Formal Definition


    Simply put, a graph is collection of objects, called nodes or vertices, together
    with connections between some of them, called edges. While this sounds like a
    rather simple description, the study of graphs involves a large array of ideas
    and algorithms.


    The above example is technically called an undirected graph. In some situations,
    we want the edges to be directed from one vertex to another. Some applications
    where this might be useful include one-way roads and relationships that are not
    symmetric (e.g., you could follow a celebrity on a social network, but they may
    not follow you back).


    ## E.3 Graph Representation


    There are two standard ways to represent graphs: adjacency lists and adjacency
    matrices.


    The adjacency list representation of a graph maintains lists of vertices that
    each vertex is adjacent to, as in the following examples:


    The adjacency matrix representation of a graph uses a matrix or table to indicate
    when there is an edge between each vertex on the rows with each vertex on the
    columns, as seen in the following examples:


    The adjacency list and adjacency matrix representations each have their own advantages.
    The adjacency list might be a lot smaller in the case where most pairs of vertices
    don''t have edges (e.g., social networks) as the total space usage is proportional
    to the number of vertices plus the number of edges (*O*(|*V*| + |*E*|)). An adjacency
    matrix on the other hand always uses the same amount of space equal to the square
    of the number of vertices (*O*(|*V*|²)), which can get prohibitive when there
    are a large number of vertices.


    On the other hand, adjacency matrices have very fast lookups. To see if a pair
    of vertices has an edge between them, we can just look up the matrix in constant
    (*O*(1)) time. The time to perform a similar operation on an adjacency list is
    proportional to the size of the list, which could be as large as the number of
    vertices in the graph (*O*(|*V*|)). Thus, which representation to pick depends
    on whether you have enough memory to store the matrix, failing which you have
    to deal with slower lookups.


