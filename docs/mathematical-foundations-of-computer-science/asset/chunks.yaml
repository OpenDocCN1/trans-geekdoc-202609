  trans: '


    ## 2. 将 `P(n)` 视为数字

    一个常见的错误（特别是在涉及求数的证明中）是将 `P(n)` 视为一个数字。记住 `P(n)` 是一个逻辑命题，它只能取真（true）或假（false）两个值。


    ## 3. 遗漏基础步骤

    如果我们不检查基础情况，可能会遇到严重的问题。例如，考虑以下这个错误的断言：


    $$\\begin{array}{l} {P(n):3^{n}\\text{~is\\ even,\\ for\\ all~}n \geq 1} \\ \\end{array}$$


    证明（归纳步骤）：固定某个 `k`  ≥ 1。我们假设假设在 `n`  = `k` 时成立，即 `3^(k)` 是偶数。这意味着我们可以将 `3^(k)` = 2*`f`，其中某个
    `f`  ≥ 1。那么，`3^(k)` + 1) 可以写成 `3^(k)` + 1) = 3^(k)` ⋅ 3= 2*`f`* ⋅ 3，这意味着 `3^(k)` + 1)
    是偶数，因为它可以写成 `2(3f)`。


    这个证明显然是错误的，因为我们知道 3 的任何自然数幂都不是偶数。这个证明之所以崩溃是因为基础步骤不成立——当 `n`  = 1 时，`3^(n)` = 3
    不是一个偶数。


    ## 4. 在归纳步骤中出错

    在证明归纳步骤时，你必须确保证明对于所有给出的值都有效。以下是一个关于“所有的马都是同颜色的”错误证明示例！


    $$\\begin{array}{l} {P(n):\\text{~every\\horse\\in\\ a\\ set\\of~}n\\{~horses\\has\\the\\same\\color,\\
    for\\ all~}n \\geq 1} \\ \\end{array}$$


    基础步骤：当 `n`  = 1 时，集合中只有一只马，因此该集合中的每只马都有相同的颜色。


    归纳步骤：固定某个 `k`  ≥ 1。我们假设假设在 `n`  = `k` 时成立。当 `n`  = `k`  + 1 时，我们排除第一只马，得到一个大小为
    `k` 的集合，我们知道该集合所有的马都是相同颜色（根据归纳假设）。同样的操作，但这次排除最后一只马，我们得到该集合中的所有马都是相同颜色。现在，由于两个集合都有相同颜色的马，可以得出所有
    `k` + `1` 只马都是相同颜色。


    这里的错误在于，在证明 `P(2)` 为真时，归纳步骤不起作用。证明中的最后一个陈述是错误的。


    ## 8.8 强归纳法

    有时，普通归纳很难实现，因为我们无法根据 `n` 的某一个较小值来构建论证。在这种情况下，我们需要一个更强的假设——即归纳假设对于所有较小的 `n` 值都成立。在这样的情况下，我们使用一种称为强归纳（strong
    induction）的技术。下方算法 8.2 中递归斐波那契程序的证明就是这很好的例子。


    记住，斐波那契数从 1, 1, 2, 3, 5、…… 开始，每一个数都是前两个数之和。要通过普通归纳法为上述算法编写正确性证明并不容易，因为正确计算第 `(n
    + 1)` 个斐波那契数依赖于正确计算第 `n` 个和第 `(n − 1)` 个斐波那契数。


    接下来我们将看到一个解决此问题的强归纳示例。具体来说，在强归纳中，我们假设假设对于直到 `n` 的所有值都成立，然后证明 `(n + 1)` 情况成立。我们做的其他改变还包括展示多个基础情况以及修改结论步骤。


    你对强归纳可能有一个问题是需要展示多少个基础情况。这取决于无法使用归纳论证证明的 `n` 最大值。在这个例子中，我们无法认为两个最小的斐波那契数是从任何较小的数计算出来的，因此我们必须包含这两个基础情况。更通地说，如果你的归纳步骤依赖于问题的特定大小，那么你需要在基础步骤中展示所有较小尺寸的假设。


    人们可能会从名称推推出强归纳法比普通归纳法更强——可以用它证明更多东西。事实并非如此，因为它们在证明能力上是等价的。任何强归纳法证明都可以通过修改命题使其对于直到
    `n` 的所有值都成立，转换为普通归纳法证明。然而，这会让证明读起来变得更复杂，所以我们直接使用强归纳法即可。“强”这个词仅仅表示我们所做的假设比普通归纳法中的更强。


    ## 8.9 强归纳法的类比

    通过强归纳法进行的证明依赖于归纳假设对于所有较小的 `n` 值都成立。继续我们的高塔类比，这意味着每一层都依赖于它。


    在归纳证明中，我们必须证明以下事实：

    1. 底部级是确立的。`对于所有较小的 n 值，证明 P(n) 成立。`

    2. 如果所有级都确立了，那么下一层也将被确立。`证明对于所有 i < n，P(i) 成立，那么 P(n) 就成立。`


    有时我们只需要部分级。例如，在斐波那契证明中，我们只需要前两个值。前几层的强归纳高塔类比如图 `8.2` 所示。


    ## 8.10 正则表达式的证明

    我们可以使用强归纳法来证明为正则表达式设计的某些程序的正确性。例如，在第 6 章中，我们证明了任何正则表达式都有 λ-NFA。我们可以使用强归纳法严谨地证明这一点。


    记得在第 6.2 节中我们看到了将任何正则表达式转换为 λ-NFA 的程序。这涉及为空集、包含空字符串的集合以及构成后续基础情况的字符字符串设计 λ-NFA。此外，还有为任意两个表达式的并、连接以及任何表达式的克莱尼星设计
    λ-NFA 的程序；这些被用于后续证明的归纳步骤。


    在下一个示例中，我们将证明第 7 章中反转正则表达式的程序确实得出了原语言的反转。


