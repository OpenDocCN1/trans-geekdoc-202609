    ## 13.8 本节总结与核心概念


    *   `Turing machine` 是所有可能计算的标准模型。任何能够完成 `Turing machine` 所能一切事情的计算系统被称为 `Turing-complete`（图灵完备）。

    *   `Turing machine` 拥有一个 `doubly-infinite tape`（双无限磁带）和一个可以沿着磁带移动的读写 `tape head`。它还具有带有转移的状态形式的
    `finite control`。

    *   `Turing machine` 由元组 `(Q, Σ, Γ, δ, q[0], B, F)` `formally defined`（形式化定义），其中
    `Q` 是 `states` 集合，`Σ` 是 `input alphabet`，`Γ` 是 `tape alphabet`，`δ` 是 `transition
    function`，`q[0]` 是 `start state`，`B` 是 `blank symbol`（空白符号），`F` 是 `accepting states`（接受状态集合）。

    *   `Turing machine` 可用于计算操作，如 `recognizing arithmetic operations`（识别算术运算）和执行
    `conditional branching`（条件分支）。

    *   每一个正则语言都有接受它的 `Turing machine`。

    *   `Turing machines` 还可以用于对字符串输入输出进行 `compute functions`（函数计算）。


