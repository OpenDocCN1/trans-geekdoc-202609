    # 附录 G 递归关系


    ## G.1 为什么你应该关注它


    递归关系（Recurrence relations，有时称为 recurrences）是分析递归算法以计算其运行时间的方法。由于递归（特别是分治法）在算法设计中经常出现，知道如何求解它们对于计算机科学家来说非常重要。


    ## G.2 合并排序


    分治法是一种递归算法技术，它将正在解决的问题实例分解为原始问题的两个或多个更小版本，这些子问题的答案有助于计算原始问题的答案。这种方法的一个重要例子是合并排序算法。


    合并排序算法通过将列表分成两个接近相等的半部分，递归地对这两个部分进行排序，然后将这两个部分合并在一起来完成排序。（由于列表长度可能是奇数，其中一个部分可能比另一个大一个，因此是“接近相等”的。）在基础情况下，当列表长度为
    1 时，我们不需要做任何操作，因为大小为 1 的列表已经是排序的了。我们在这里不会深入算法的细节，而是仅分析它的运行时间。


    假设大小为 `n` 的列表在合并排序上的运行时间记为 `T(n)`，对于所有 `n` ≥ 1 成立。根据上述描述，我们可以整个算法的运行时间将是排序两个半大小列表的时间以及合并这些列表的时间。根据
    `T` 的定义，排序每个半大小列表的时间可以为 `T(n/2)`。为了简单起见，我们假设 `n` 始终是 2 的幂，以避免部分不相等的复杂性。合并列表的时间证明是
    `n` 的线性的，为了简单起见，我们将其记为 `cn`，其中 `c` 是某个大于 `0` 的常数。最后，合并排序的基础情况是列表大小为 1，在这种情况下我们直接返回列表而不进行任何额外工作，因为大小为
    1 的列表已经排序了。将这一切整合在一起，我们得到了 `T` 的以下定义，称为**递归关系**或**递归式**：


    $$\begin{array}{l} {T(n) = \left\{ \begin{matrix} 0 & {\\text{if~}n = 1} \\\\
    {2T(n/2) + cn} & {\\text{if~}n > 1.} \\\\ \\end{matrix} \right.} \\\\ \end{array}}$$


    接下来我们将看到几种求解此类递归关系的方法。


    ## G.3 递归树法


    求解上述递归关系的方法之一是递归树法，即使用 `T` 的公式并像这样展开几次：


    $$\begin{matrix} {T(m)} & {=} & {2T(m/2) + cm} & & {\\text{~(using\\the\\formula\\for~}T\\
    \text{when~}n = m)} \\ & {=} & {2\left( 2T(m/4) + cm/2 \right) + cm} & & {\\text{~(using\\the\\formula\\for~}T\\
    \text{when~}n = m/2)} \\ & {=} & {4T(m/4) + 2cm} & & \text{(simplifying\\with\\
    algebra)} \\ & {=} & {4\left( 2T(m/8) + cm/4 \right) + 2cm} & & {\\text{~(using\\the\\formula\\for~}T\\
    \text{when~}n = m/4)} \\ & {=} & {8T(m/8) + 3cm} & & \text{(simplifying\\with\\
    algebra).} \\ \\end{matrix}}$$


    我们可以继续这个过程几次，以发现这似乎遵循某种模式（在展开公式 `k` 次后）：


    $$\begin{array}{l} {T(m) = 2^{k}T(m/2^{k}) + kcm.} \\\\ \end{array}}$$


    我们可以继续上述展开，直到将问题缩小到大小为 1。这正发生在 `m/2^(k)` = 1 或者当 `m` = 2^(k)` 或 `k` = log2 时。将此
    `k` 取值值代入上述公式，我们得到


    $$\begin{matrix} {T(m)} & {=} & {2^{\log_{2}(m)}T(m/2^{\log_{2}(m)}) + cm\log_{2}(m)}
    & & \\ {=} & {mT(1) + cm\log_{2}(m)} & & {\\text{(as~}2^{\log_{2}(m)} = m)} \\
    & {=} & {cm\log_{2}(m)} & & {\\text{(as~}T(1) = 0).} \\ \end{matrix}}$$


    我们可以从这个推导得出结论：合并排序的运行时间为 `cm\log_{2}(m)`，更简单的表示方法（使用大 O 符号，见附录 D）为 `O(n log n)`。


    ## G.4 某些规则回顾


    正如你在上一节中看到的，你将熟悉对数。这里有几个值得记住的规则。对于任何 `b` > 1 和 `n` > 0，我们有


    $$\begin{array}{ll} {\log_{b}(1)} &= 0 \\ {\log_{b}(b)} &= 1 \\ b^{\log_{b}(n)}
    &= n \\ {\log_{b}(nm)} &= \log_{b}(n) + \log_{b}(m)} \\ {\log_{b}(n/m)} &= \log_{b}(n)
    - \log_{b}(m)} \\ {\log_{b}(n^{m})} &= m\log_{b}(n)$$


    ## G.5 代入法


    证明递归的另一种更简单的方法是使用强归纳法。对于这种方法，我们需要知道递归是什么。我们可以写下归纳假设：


    $$\begin{array}{l} {P(n) = cn\log_{2}(n)} \end{array}$$


    对于基础情况，当 `n=1` 时，我们知道 $T(1)=0$ 且 $\log_{2}(1)=0$，因此 $P(1)$ 成立。对于任何 `k` > 1，假设归纳假设成立。我们要证明当
    `n=k` 时，我们有


    $$\begin{matrix} {T(k)} & {=} & {2T(k/2) + ck} & {\\text{(by\\definition\\of~T)}}
    \\ {=} & {2(c(k/2)\log_{2}(k/2)) + ck} & {\\text{(by\\induction\\hypothesis\\when~}n
    = k/2)}} \\ {=} & {ck\log_{2}(k/2) + ck} & {\\text{(simplifying\\with\\algebra)}}
    \\ {=} & {ck(\log_{2}(k) - \log_{2}(2)) + ck} & {\\text{(as~}\log_{2}(2) = 1)}}
    \\ {=} & {ck\log_{2}(k) - ck + ck} & {\\text{(simplifying\\with\\algebra)}} \\
    {=} & {ck\log_{2}(k)} & {\\text{(so~P(k) holds)}} \end{matrix}$$


    从而证明了归纳步骤。我们可以像常一样完成强归纳证明。


    ## G.6 分析 Karatsuba-Ofman 算法


    另一种用于大数的分治算法是 Karatsuba-Ofman 算法，具有以下递归关系：


    $$\begin{array}{l} {T(n) = \left\{ \begin{matrix} 0 & {\\text{if~}n = 1} \\\\
    {3T(n/2) + cn} & {\\text{if~}n > 1.} \\\\ \end{matrix} \right.} \\\\ \end{array}}$$


    接下来我们将使用上述两种技术分析它。使用递归树法，我们得到：


    $$\begin{matrix} {T(m)} & {=} & {3T(m/2) + cm} & & {\\text{~(using\\the\\formula\\for~}T\\
    \text{when~}n = m)} \\ & {=} & {3\left( 3T(m/4) + cm/2 \right) + cm} & & {\\text{~(using\\the\\formula\\for~}T\\
    \text{when~}n = m/2)} \\ & {=} & {9T(m/4) + 3/2cm + cm} & & \text{(simplifying\\with\\
    algebra)} \\ & {=} & {9\left( 3T(m/8) + cm/4 \right) + 3/2cm + cm} & & {\\text{~(using\\the\\formula\\for~}T\\
    \text{when~}n = m/4)} \\ & {=} & {27T(m/8) + (3/2)^{2}cm + (3/2)cm + cm} & & \text{(simplifying\\with\\
    algebra).}}$$


    我们可以继续这个过程几次，以发现这似乎遵循某种模式（在展开公式 `k` 次后）：


    $$\begin{array}{l} {T(m) = 3^{k}T(m/2^{k}) + \sum\\limits_{i = 0}^{k - 1}(3/2)^{i}cm.}
    \\\\ \end{array}}$$


    我们可以继续上述展开，直到将问题缩小到大小为 1。这正发生在 `m/2^(k)` = 1 或者当 `m` = 2^(k)` 或 `k` = log2 时。将此
    `k` 取值代入上述公式，我们得到


