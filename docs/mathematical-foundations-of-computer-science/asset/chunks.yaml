    # Appendix ACounting


    ## A.1 Why You Should Care


    Being able to count up the number of different ways or combinations that are possible
    for a problem is an exceedingly useful skill in computer science. It is needed
    for tasks as different as counting the number of passwords (to improve computer
    security), determining the number of ways processes can be scheduled, to measuring
    the search space for a variety of games so that you can compute an optimal play
    strategy.


