    # 前言


    本书的核心指导原则是让对计算机科学主题感兴趣的学生能够接触计算机科学所需的数学知识。通过在恰好理解下一个计算机科学概念时引入数学课题，学生将激发掌握数学思想的动力。这本书还涵盖了自动机、正则表达式、语法、图灵机和可计算性等概念，学生在更晚的课程中可能才会看到这些内容（如果他们看到的话）。


    我假设本书的读者上过代数课程，并修过一门计算机科学入门课程。


