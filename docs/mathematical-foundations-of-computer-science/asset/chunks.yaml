    # Appendix DAsymptotic Notation


    ## D.1 Why You Should Care


    When analyzing the efficiency of our algorithms, computer scientists use asymptotic
    notation to capture such metrics as running time, memory used, number of queries,
    energy usage, etc. Analyzing the rate of growth of each of these quantities is
    far more important than computing the exact value for a few instances.


    ## D.2 Why Asymptotic Notation


    Suppose that you are comparing a pair of algorithms and trying to decide which
    one you will implement for an application that you are working on. If you are
    interested in understanding which one will run quicker, you may count up the number
    of basic operations of each and use this for comparison. To make things concrete,
    say that you have one algorithm that, on an input size of *n*, needs *f*(*n*) = 1000*n*
    operations and another that needs *g*(*n*) = *n*² operations. If you were to run
    these on small instances of your problem, you would likely find that the second
    algorithm runs faster. However, in practice computer scientists are wary of small
    instances as we know that data sizes are constantly increasing and we should instead
    plan ahead for large data sets. This is where asymptotic notation allows us to
    compare the above algorithms for larger sizes.


    In the above example, we would say that the first algorithm is a *Θ*(*n*) (pronounced
    “theta of *n*”) time algorithm and the second is *Θ*(*n*²) time. In other words,
    the rate of growth of the second function is considerably higher than the first.
    For example, if we increase the size a thousand-fold, then the first algorithm''s
    run-time goes up by a factor of a thousand but the second''s run-time goes up
    by a factor of one million! When working with large size inputs the second algorithm
    will be several orders of magnitude slower than the first.


    When performing asymptotic analysis, we ignore constant multiplicative factors
    such as the 1000 in *f*(*n*) = 1000*n*. In most algorithms these factors are not
    very large and don''t significantly affect the analysis. We also ignore how algorithms
    perform on small input sizes as these are not as relevant to us most of the time.
    Both these considerations have lead to computer scientists using asymptotic notation
    as the way we analyze the performance of our algorithms.


    ## D.3 Theta Notation


    The most useful form of asymptotic notation is theta notation since it gives an
    exact characterization of the growth rate of the function. When in doubt about
    which type of asymptotic notation you should be using, theta notation is your
    best bet since it is the most precise.


    In other words, if we can sandwich the function *f*(*n*) between constant multiples
    of *g*(*n*) for sufficiently large *n*, then we can say that *f*(*n*) = *Θ*(*g*(*n*)).


    Notice that there could be several different constants *n*[0], *c*[1], *c*[2]
    that could also work. Which ones you pick is not important as long as they show
    the above sandwich property.


    ## D.4 Big-O and Big-Ω Notation


    Sometimes we are unable to, or don''t care to, compute the exact characterization
    of a function and are happy to settle for an upper or lower bound. For example,
    we may want to argue that our sorting routine takes at most quadratic time. In
    such a case, we might use Big-O for an upper bound and Big-Ω (“big omega”) for
    a lower bound.


    This is identical to the definition and examples introduced in [Section 3.7](#chapter3.xhtml#sec3_7).
    Since Big-O notation is only an upper bound, it may not be a precise bound on
    the function that you are studying. This is why you should use theta notation
    if you are trying to be precise. Big-O notation can give an overestimate of the
    growth rate of a function as can be seen in the following example:


    Similar to upper bounds, we sometimes have need for lower bounds on the growth
    of a function. For example, we may want to argue that the runtime of an algorithm
    is always at least quadratic.


    Once again note that since Big-Ω notation is only a lower bound, it may not be
    a tight bound.


    ## D.5 Strict Bounds


    All the above bounds were inclusive ones that included the function being compared
    with. In some circumstances we want to say that the asymptotic growth rate of
    a function is strictly smaller than, or strictly larger than, another function.
    This is where little-o and little-*ω* (“little omega”) notation is used.


    The strict lower bound little-*ω* is defined similarly.


    ## D.6 Common Errors


    There are a number of common errors that novices make with asymptotic notation.
    Some that you will want to avoid are listed below:'
