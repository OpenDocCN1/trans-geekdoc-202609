    \ In addition, there were procedures for designing *λ*\\-NFAs for the union and\
    \ concatenation of any pair of expressions and the Kleene star of any expression;\
    \ these are used in the inductive step of the following proof.\n\nIn our next\
    \ example we will prove that the procedure for reversing a regular expression\
    \ in [Chapter 7](#chapter7.xhtml) does indeed give the reverse of the original\
    \ language.\n\n## 8.11 Correctness of Binary Search\n\nAnother great application\
    \ of strong induction is to more deeply understand the recursive binary search\
    \ algorithm, shown in [Algorithm 8.3](#chapter8.xhtml#algo8_3). This algorithm\
    \ assumes that the input list *L* is already sorted and gives an efficient way\
    \ to search for the index of a target element by bisecting the region to be searched\
    \ in half at every step. The recursive version of this algorithm also includes\
    \ the left and right ends of the range of the indexes to be searched. When searching\
    \ a list *L* indexed from 0 to *n* − 1 for a target, the recursive function is\
    \ called with parameters BinarySearch(*L*, *t**a**r**g**e**t*, 0, *n* − 1). The\
    \ base cases of the recursion are when there are no more items to search (when\
    \ the left index crosses the right index), in which case we return  − 1 to indicate\
    \ that the search failed, and when the target is found at the middle of the active\
    \ range of indices, in which case we return that middle index. Otherwise, the\
    \ recursive procedure narrows the range to the appropriate half and continues\
    \ the search."
