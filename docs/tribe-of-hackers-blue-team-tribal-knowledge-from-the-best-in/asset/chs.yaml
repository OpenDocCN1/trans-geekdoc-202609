  \n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\n我使用类比，并分享不采取行动的风险。我写的每份报告都建议了行动方案（COAs）。行动方案可能是拆除并更换大里所有的交换机，也可以什么都不做并接受风险。如果你希望他们不要选择接受风险，那么取决于作者如何用通懂的语言解释这种风险，例如：\n\
  \n\n\n“我们的防火墙软件中存在一个无法解决的致命缺陷，这允许黑客连接到我们的网络，就像他们站在我们的办公室里一样，而我们无办法检测到它。无所作为的风险是**高**的，因为我们的防火墙版本可以很容易被远程枚举，此漏洞是众为人知的，非专业的威胁行为者很容易在远程实施它，而且我们目前的检测技术无法阻止它。”\n\
  \n## 在重大持续事件期间，对于管理非技术高管的预期你有什么建议？\n\n显然，这取决于 `incident commander` 如何维护自己的态势感知，并对正在发生的事件提供简洁、定期且诚实的报告。如果非技术管理人员能够定期收到有关事件的更新，他们就不那么容易恐慌，并决定亲自去看看到底发生了什么。\n\
  \n对于那些真正愤怒的经理，要向他们解释你需要让团队各司其职。事情已经发生了；站在在消防员旁边告诉他们该把水水管指向哪里，可能不会让火熄灭得更快，而且在调查之前指责只会导致更多压力。向他们保证，你作为经理也参与了其中，并帮助引导和指导资源及精力，让他们明白你理解这种紧迫感。提醒他们，你的员工已经针对此类情况接受过训练，他们正在解决问题。压力是正常的，也是预料之中的，但它应该被引导向积极方面，例如让他们开始向他们的员工和服务接收者传达冷静情绪，告知内部人员已获知问题并正在尽快解决。如果他们认为问题本可以有不同的处理方式，那么以后在事后回顾中会有时间讨论持续改进。\n\
  \n在危机期间管理非技术高管的预期让起了一个笑话，我将用它结束我的采访。\n\n一位新 `CISO` 上任，在办公桌上发现了两个信封。上面的信封写着“现在打开我”，于是\
  \ `CISO` 打开了信封，在里面发现一张条写着：“将任何发生的错误归咎于前任 `CISO`。”\n\n一个月后，发生了勒索软件攻击，于是 `CISO` 确实那样做了，将他们的准备不足归咎于前任\
  \ `CISO`。董事会接受了这个借口，几个月来一切顺利，但突然发生了一次大规模数据泄露。`CISO` 担心该怎么办，跑过去撕开了第二个信封，希望获得另一条智慧之言，结果上面的纸条写着：“准备两个信封。”\n\
