  \n# 1\n\nMarcus J. Carey\n\n![](img/c01uf001.png)\n\n> “在微观层面，蓝队由直接负责监控、防御和响应事件的个人组成。”\n\
  \n**Twitter:** [@marcusjcarey](https://twitter.com/marcusjcarey) • **Website:**\
  \ [www.linkedin.com/in/marcuscarey](http://www.linkedin.com/in/marcuscarey)\n\n\
  Marcus J. Carey 是一个网络安全社区倡导者和初创创始人，拥有超过 25 年保护敏感政府和商业数据的经验。他在美国海军密码学部门开始其网络安全职业，随后在国家安全局（`NSA`）任职。\n\
  \n## 你如何定义蓝队？\n\n在宏观层面，蓝队是整个组织，包括终端用户和客户。我之所以这样说，是因为从安全角度出现问题时，你的终端用户和客户会最先注意到。\n\
  \n我知道让客户让你发现存在安全问题是极其尴尬的，但他们一次又一次地救了我们。每个人都是团队的一员。\n\n在微观层面，蓝队由直接负责监控、防御和响应事件的个人组成。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n我认为网络可视性和日志管理是每个蓝队都努力掌握的两个核心能力。在传统基础设施中，网络可见性允许组织理解网络上正在发生什么，例如身份验证、域名解析和各种嘈杂的协议。\n\
  \n网络可见性是密不可分的，因为它意味着你不仅要确保能看到网络上正在发生什么，还需要确保信息源正在记录事件。他们还需要确保数据被捕获并可以进行分析（部分是实时）以检测入侵。\n\
  \n这通常需要一个日志管理系统，该系统需要足够的存储空间以便于故障排除和法证调查。\n\n**总结（TLDR）：** 你必须确保记录了所有正确的内容，并且这些内容可以为了故障排除和事件响应而被检索。没有这些，你可能只是在演“安全戏”（security\
  \ theater）。\n\n### 事件响应计划有哪些核心关键优势？\n\n我将使用古老的“建立主场优势”的概念。你需要一支能力出众的团队，这意味着你应该投入培训，并聘用渴望学习和成长的人才。\n\
  \n完善的事件响应计划建立在尽可能了解系统、软件和网络基础设施的基础上。你必须能够尽可能忽略所有正常活动，专注于异常情况。\n\n要实现完全零异常是不可能的，因为软件的行为可能很奇怪，系统在组织之间存在差异，用户会做意料之外的事。关键在于不断推动、改进并尽可能实现自动化。\n\
  \n### 蓝队成员如何学习、练习和成长？\n\n在学习和练习技艺方面，我非常推崇 80/20 模型。蓝队成员应该投入 20% 的时间用于持续教育和练习新技能。这是一个循环，意味着你先学习，然后将这些技能付诸实践，而成长部分则是了解哪些有效、哪些无效。\n\
  \n有大量的免费信息源供蓝队成员从中学习。优秀蓝队成员的特征之一是能够自学来解决问题。如果你在聘用蓝队成员，你应该寻找他们自主学习新技能的案例。\n\n\n\n\
  \n如果你目前正寻找网络安全方面的工作，许多招聘经理看重的最重要特质是你的自学和学习新技能的能力。你应该“学会如何学习”并应用新技能。这将极大地提高你在就业市场上的价值。\n\
  \n## 你如何奖励优秀的蓝队（Blue Team）工作？\n\n给予他们合理的报酬，不要让他们去做不必要的“安全作秀”（security theater）工作。我个人对每个和我一起工作的人都承诺，我将确保他们能够在职业生涯上有所。在未来的某一天当他们离开时，他们的职业生涯将处于更高的水平。我有时看到有些组织为了留住人员而限制其增长，这是错误的，而且总是会适得其反。\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护一个成功的信息安全计划？\n\n归根结底，蓝队的最终衡量标准是检测入侵的平均时间（MTTD）和缓解威胁的平均时间。为了实现这一点，蓝队需要合适的人员、流程和技术。人员需要精通，流程必须敏捷，技术必须被充分利用。在此过程中，你必须持续测量检测平均时间，以改进和维护这些能力。\n\
  \n## 如果你是一家中小型企业中唯一的信息安全人员，且其安全基础设施非常原始，你会从何处开始？\n\n美国国家标准与技术研究院（`NIST`）提供了大量的免费资源。特别是，`NIST`的网络安全框架（`CSF`）是一个任何组织都可以获取并开始实施的优秀资源。\n\
  \n除了 `NIST CSF` 之外，他们还提供了几个特别出版物（`SPs`），我非常推荐用于自评估，包括以下两个：\n\n*   `NIST SP 800-115`:\
  \ 信息安全测试与评估技术指南\n*   `NIST SP 800-37`: 信息系统和组织的风险管理框架\n\n## 性价比最高的安全控制措施是什么？\n\n\
  限制管理权限是性价比最高的安全控制措施。通过限制这些权限，你可以减少网络遭受入侵的次数。它将防止人员安装未经授权的、盗版的或破解的软件。\n\n攻击者通常会继承他们所攻破的用户或服务的权限。这意味着，如果他们不是管理员，他们最初将没有权限在系统上随心所欲地操作。如果攻击者必须提升权限，那是另一个抓住他们行踪的机会。\n\
  \n## 你的组织是否实施了任何欺骗技术（Deception Technologies）？\n\n没有。\n\n## 组织应该在何处使用加密？\n\n使用加密最有效的地方是虚拟专用网络（VPN）、网页登录和全盘加密。\n\
  \n`VPNs` 通常使用加密来确保数据的端到端私密。网页登录需要加密，以确保用户名、密码以及所有其他认证数据保持机密。全盘加密很重要，以防电脑或笔记本电脑被盗时，磁盘上的数据得到保护。\n\
  \n## 你如何处理数据治理以及减少数据足迹的其他方法？\n\n我在军队中学到，你总是想尽可能保留少的数据。只保留法律或合规性要求保留的数据。不要保留必要的客户或员工数据。我们一次又一次看到各种疯狂的故事，讲述组织如何将所有的客户数据以未加密的形式存储在本地和云端。避免这种情况最好的方法是从根本上不要这些数据。\n\
  \n## 你对合规性（Compliance）有什么看法？\n\n我接受合规性，因为它确实设定了一个组织应该遵循的最低门槛。我希望现在人们能意识到，合规是绝对的底线，并不意味着他们在任何意义上都是安全的。\n\
  \n此外，安全领导者需要确保他们的沟通是诚实的。\n\n## 是否有一个框架可以将蓝队执行的活动或功能与监管合规要求对齐？\n\n我是 `NIST` 网络安全框架的忠实粉丝，因为它建议对安全计划进行持续测试和评估，其层次比大多数通用合规标准更高。\n\
  \n## 你如何组织组织的所有不同部门以实现防御最大化？\n\n你必须通力合作将组织的所有不同部门都纳入蓝队的成员。即使被分为不同的部门，系统管理员、`网络工程师`、`软件开发人员`等角色也需要成为内部网络安全审查委员会的一部分，跨组织进行沟通并降低风险。当最终发生入侵时，这支团队在事件响应中也将表现非常出色。当事件发生时，不应该是大家第一次聚在一个房间里。\n\
  \n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\n我认为安全专业人员需要更多更多地从业务风险的角度来谈论，并成为非技术决策者的教育工作者。业务应该驱动所有的安全决策。因此，安全领导者需要能够用业务语言来拆解安全决策如何影响业务。此外，蓝队需要帮助组织的所有成员理解安全概念，以及用户的决策如何影响组织。\n\
  \n## 对于管理非技术高管的预期，你有什么建议？\n\n我建议每季度与高管进行桌面演练（Tabletop exercises），涵盖可能发生的事件及响应。我的不仅是指技术方面，还包括通告声明、沟通计划、事件响应计划、灾难恢复计划等。任何响应的一部分都应涵盖在内，以确保技术人员在同一频道上。\n\
  \n这样当重大事件发生时，非技术高管会有正确的预期。\n\nWiley\n\n# 2\n\nDanny Akacki\n\n![](img/c2uf001.png)\n\
  \n> “我们都是蓝队。”\n\n**Twitter:** [@DAacki](https://twitter.com/DAacki) • **网站:** [randoh.net](http://randoh.net)\n\
  \nDanny Akacki 是谁？他是一个寻找舞台的讲述者。他没有比这更喜欢参加会议、发表演讲、写博客，并寻找新方法来接触更多的人。对于 Danny 来说，没有什么比社区建设更有成就感了。\n\
  \n他非常幸运，职业生涯一直在防御领域，向业内顶尖的人士学习，包括 `Mandiant`、`GE Capital` 以及最近作为 Gigamon 的高级 `TAM`。Danny\
  \ 热爱他所做的事情以及与他共事的人。\n\n## 你如何定义蓝队？\n\n我将蓝队定义为组织中的每一个人。拥有公司登录权限的人天生负着将恶分子排除在外的任务。我们都是蓝队。\n\
  \n## 蓝队应该具备哪些核心能力？\n\n蓝队应该对他们可以利用的数据有意识，并有一种查看数据的方法。闪烁的盒子很漂亮，供应商提供的午餐也很棒，但如果你从一开始不知道自己拥有什么数据，或者更重要的是不知道自己缺少了哪些数据，你就等同于死了。\n\
  \n## 事件响应计划有哪些关键优势？\n\n*   *项目管理*: 确保列车准时运行，或者至少在引擎起火时知道灭火器在哪里。\n*   *案例管理*: 你们将团队的发现和调查记录放在哪里？大家是否都在同一个页面上？\n\
  \n\n\n\n- **高层支持与利益相关者的认可**：事件响应（IR）并非孤立存在。它需要触及许多不同的领域，而这些领域对应的人有着不同的目标。\n\n##\
  \ 蓝队人员如何学习、实践和成长？\n\n- 通过研究对手。\n- 威胁模拟，例如 Offensive Security 认证课程，阅读每一份产出的泄露报告，以及研究攻击者的行为。\n\
  - 了解他们自己的网络。你真的知道自己在保护什么吗？弄清楚什么对你的业务非常重要，以及人们为什么/如何想要偷取这些东西。\n\n## 如何奖励优秀的蓝队工作？\n\
  \n公开认可以及各种形式的零食诱惑。\n\n## 蓝队可以使用哪些核心指标来构建、衡量和维护成功的信息安全计划？\n\n- 衡量事件增加的百分比。发现更多问题并不本质意味着你的安全变得松懈了；它很可能是安全流程改进的象。情况在变好的同时可能看起来变得更糟。\n\
  - 将员工培训应用于实际业务用例。`SANS` 课程不仅仅是昂贵的一周假期。让你的员工回来汇报他们学到的内容，然后将这些知识分享给团队。\n\n## 如果你是一个规模中等、安全基础设施原始的小型企业中唯一的信息安全人员，你会从哪里开始？\n\
  \n收集机构知识。我会找到入职时间最长的人，用零食贿赂他们，让他们告诉我关于公司他们知道的一切。谁拥有什么？我们是否发生过安全事件？发生了什么？什么存在于哪里，我该如何看到它们？\n\
  \n## 性价比最高的安全控制措施是什么？\n\n用户。工资单上的每一个人都是安全团队的一员，而且他们每天都在那里领薪工作。他们也是对手最可能针对的目标。教育他们，让他们意识到自己利益攸关。\n\
  \n## 你的组织实施了任何欺骗技术吗？\n\n想得不错，Fancy Bear（野熊）。\n\n### 组织应该在何时使用加密？\n\n作为术语宾果游戏卡上的免费空格。\n\
  \n## 如何引导组织的所有不同部门以实现防御最大化？\n\n通过学会说他们的语言。翻译是王道，所以找到一种将安全目标翻译为业务目标的方法。为泄露造成的损害标上金额。更好的是，给它起一个新闻标题。\n\
  \n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\n同理心。找到一种关心他们所关心的事情的方法，并以此作为通相互理解的垫石。\n\n## 在重大持续事件期间，对于管理非技术高管的预期你有什么建议？\n\
  \n告诉他们罗马不是一蹴而成的。无论发生了什么，它的发生需要时间，所以解决它也需要时间。帮助他们理解 IR 团队是一项长期投资，既包括团队的长期存存，也包括理解发生了什么以及为什么所需的时间。\n\
  \n\n# 3 \n\nRicky Banda\n\n![](img/c03uf001.png)\n\n> “蓝队的核心是一个专注于防御性信息安全态势、分析、调查和响应的组织。”\n\
  \n**Twitter:** [@teck923](https://twitter.com/teck923)\n\n## 你如何定义蓝队？\n\n蓝队的核心是一个专注于防御性信息安全态势、分析、调查和响应的组织。\n\
  \n## 蓝队具备哪些核心能力？\n\n普遍而言，拥有良好的用例来围绕开展工作是有帮助的。在这种情况下，以下示例可能是帮助此项实践的良好方法论，因为这是我成长时遵循的模型：\n\
  \n- **咨询**：通过沟通、表达担忧和意识，将安全融入到各种工作流中。\n- **事件响应**：有效响应威胁以遏制、根除并增强防御态势。\n\n## 事件响应计划具有哪些优势？\n\
  \n普遍而言，拥有良好的用例来围绕开展工作是有帮助的。在这种情况下，以下示例可能是帮助此项实践的良好方法论，因为这是我成长时遵循的模型：\n\n- **流程**：IR\
  \ 流程应该清晰定义。\n    - IR 流程是什么？\n    - 事件的定义清晰吗？\n    - 个人贡献者与领导者之间的关键责任领域是什么？\n- **平台**：响应计划必须拥有正确的工具来执行任务。\n\
  - **沟通**：清晰的沟通渠道、标准和 `SLAs`（服务等级）应该清晰定义。强大的事件计划能够通知受影响的用户以及领导者事件。\n- **可操作的指标**：强大的事件计划能够向领导者传达事件要点，以便在资源分配的策略上做出明智决策。\n\
  - **教育**：响应计划能够为人员设定教育和持续培训的标准，以跟上变化的威胁格局。\n- **关系**：最重要的是，强大的事件计划将尽力与利益相关者建立积极的关系，分享信息、担忧和意识，以增强防御运作并维持态势感知。\n\
  \n\n\n\n这是一个很难回答的问题，因为典型的回答可能集中在告警关闭率或响应时间上。然而，正如许多人正在意识到的，这些并不是有效衡量信息安全（InfoSec）计划的真实指标。相反，此类指标应侧重于以下方面：\n\
  \n* 对利益相关者的影响\n* 对组织的影响\n* 在事件响应程序上花费的时间\n* 通过成本和/或工时衡量的风险缓解情况\n\n### 如果你是一家安全基础设施简陋的中小型企业的唯一信息安全人员，你将从哪里开始？\n\
  \n理解边界。首先，了解网络从哪里开始到哪里结束。对环境中实施的子网、`VLANs` 以及路由和交换标准进行盘点。在资源有限的企业中尝试构建安全控制时，熟悉并理解环境内部的入站和出站流量非常有帮助。\n\
  \n> 熟悉并理解环境内部的入站和出站流量在资源有限的企业中尝试构建安全控制时非常有帮助。\n\n你无法凭个人之力解决所有问题；但在这种用例中，从网络入手可以优先考虑初始侦察，并为企业其他部分的安全控制设定先例。\n\
  \n## 性价比最高的安全控制措施是什么？\n\n在我看来，`NetFlow` 和/或基于网络智能的审查边界边界流量的解决方案是性价比最高的安全控制措施。这种可见性通过让安全组织了解进出环境的流量，允许对整个企业的工作进行进一步的优先级排序。\n\
  \n## 你如何参与组织的所有不同部门以实现防御最大化？\n\n食物。认认真的。最大化防御的最佳方法是理解你所保护的产品和流程背后的利益相关者。邀请这些人出去吃午饭，请他们喝咖啡，了解他们是谁以及他们的计划是如何运作的。通常，蓝队成员不会考虑他们的工具和可见性如何帮助其他部门收集信息。作为事件响应的战斗力放大器，在时间关键时刻，与你熟悉的人合作要容易得多，反反之亦然。\n\
  \n> 最大化防御的最佳方法是理解你所保护的产品和流程背后的利益相关者。\n\n### 你使用什么策略向非技术决策者传达你所遇到的威胁？\n\n我构建深度防御的策略的一部分，是让决策者了解蓝队为了有效响应事件而使用的工具和工作流。\n\
  \n例如，对于一个可能犹豫于在其关键服务器上安装 `EDR` 解决方案的非技术经理，坐下来解释该解决方案的使用和目的，以及其益处、可见性，以及该工具在事件期间或其他情况下如何提供帮助是至关重要的。\n\
  \n解释威胁；进行教学、沟通和协作；不要强制或期望非安全人员在没有理由的情况下天生地服从你的要求。这只会滋生怨恨，并在事件发生时增加障碍。\n\n### 在重大持续事件期间，你对管理非技术高管的预期有什么什么建议？\n\
  \n教育高管。留出时间并确保高管对事件有明确的预期和交付物。建立 `SLAs`，规定他们应该在何时收到信息、他们应该遵循哪些行动，以及在高压力情况下他们需要做什么来支持\
  \ `ICs`（事件指挥官）。如果不对高管进行事件响应程序的教育，事件计划可能会面临误解和不必要的额外压力风险。\n\n> 如果不对高管进行事件响应程序的教育，事件计划可能会面临误解和不必要的额外压力风险。\n\
  \n高管也是人，在事件期间他们肩上也负着期望；确保这些需求与 `IR` 团队的需求一起得到满足。\n\nWileyPRE\n\n# 4\n\nWilliam Bengtson\n\
  \n![](img/c04uf001.png)\n\n> “对我来说，蓝队的概念是一个通过构建保护措施并将其投入来保护公司的团队。”\n\n**Twitter:**\
  \ [@__muscles](https://twitter.com/__muscles) • **网站:** [www.linkedin.com/in/william-bengtson](http://www.linkedin.com/in/william-bengtson)\n\
  \nWill Bengtson 是 `HashiCorp` 的威胁检测与响应主管，专注于安全运营和企业安全扩展。在加入 `HashiCorp` 之前，Bengtson\
  \ 曾在 `CapitalOne`、`Netflix` 和 `Nuna` 工作，并在国防部担任多年顾问。Bengtson 在安全的许多领域拥有经验，对基础设施安全、云安全和检测领域充满热情。Bengtson\
  \ 贡献了许多开源项目，并在全球范围内就安全主题演讲。\n\n## 你如何定义蓝队？\n\n我对蓝队的定义是任何不是红队的团队，换句话说，任何工作不是持续攻击并试图发现公司弱点的团队。这超越了传统的威胁检测或事件响应团队。\n\
  \n对我来说，蓝队的概念是一个通过构建保护措施并付诸实践来保护公司的团队。如果你局限于安全范围，这个团队就是构建检测的团队、确保基础设施默认安全的团队、帮助应用所有者保护其应用程序的团队、帮助保护公司资产的团队以及许多其他。在安全之外，这个团队是安全开发应用程序的团队、报告可疑邮件和外联信息的用户，以及许多其他。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n来自安全领域的蓝队应该具备在处理任务时实现自动化并进行清晰且具有跳性思维思考的能力。随着今天的基础设施和公司向云端迁移，保护公司和响应威胁的传统方式正在发生根本性变化。自动化的需求存在，是为了跟上公司在云端移动和增长的速度，并保持领先。\n\
  \n考虑到这一点，具备清晰和跳性思维思考的能力将使蓝队成员在完成他们设定的每项任务时取得成功。在构建新检测和自动化的情况下，它允许他们思考每项检测，并确定差距以及在响应时需要什么。它还允许他们思考哪些应该被检测到。在响应事件时，计划？\n\
  \n事件计划的核心优势在于其能力以及将告警噪音保持在零的能力。团队的能力将让你看到检测和响应的成熟度，并与团队相关的指标直接相关。这些指标可以是告警数量、误报、真阳性、响应告警的时间与开发新技术的时间比例，以及自动化。\n\
  \n保持噪音接近零是团队有多少时间来开发未来的告警和工具以继续加强团队的指标。它也是团队快乐程度以及你是否面临人员流风险的指标。根据我的经验，一个不断响应告警并执行操作手册的团队成员不会长期保持快乐。\n\
  \n### 蓝队成员如何学习、练习和成长？\n\n\n\n\n蓝队成员今天拥有优势，因为他们有很多方法可以继续学习、实践和成长。脑海中立刻想到的包括与红队和应用安全团队合作，观察攻击的真目以及使用了哪些技术。这可以为他们提供观察攻击的新视角，并为构建新的检测技术提供空间。有许多培训可以帮助团队成员快速上手并获得一些可以带回的思路；其中一个免费的资源是\
  \ [OpenSoc.io](http://OpenSoc.io)。\n\n花时间学习并尝试公司正在使用的平台是团队学习的另一种极佳方式。他们还可以参加 CTF（攻防赛）或在安全的其他领域进行轮岗，以作为蓝队成员的身份不断学习和提升。\n\
  \n## 如何奖励优秀的蓝队团队工作？\n\n我认为奖励优秀蓝队团队的一种很好的方法是认可团队所付出的卓越工作。通常，蓝队会被忽视，而他们在构建和响应检测方面所付出的无数小时工作往往无人问。\n\
  \n除了公司内部的公开认可，一些很棒的奖励还可以参加会议、培训、技术书籍，或者他们平时无法获得/得到的东西。你需要确保他们的工作被看到并感激。\n\n## 蓝队可以使用哪些核心指标来构建、衡量和维护一个成功的信息安全计划？\n\
  \n蓝队可用于构建、衡量和维护成功计划的一些核心指标如下：\n\n* 已部署检测的数量\n* 误报的数量（False positives）\n* 良性真阳性数量（真实的告警，但是内部员工）\n\
  * 真阳性数量\n* 已部署防御措施的数量\n* 防御措施生效的次数\n* 手动响应告警花费的时间\n\n## 如果你是一家安全基础设施非常原始的中小型企业中唯一的信息安全人员，你会从哪里开始？\n\
  \n如果我要从这样一家公司开始，我会从了解所有现有内容以及基础设施和环境的现状开始。你可以将其称为可见性和/或资产盘点，但对当前状态有真实的感知可以让你从安全角度制定应该从哪里开始。可见性是从零开始构建安全网络的首要基础要素。如果你不知道存在什么以及那里应该存在什么，你很难构思出安全网络应该是什么样的。\n\
  \n## 性价比最高的安全控制措施是什么？\n\n性价比最高的安全控制是欺骗技术（Deception technique）。从实施/维护的角度来看，欺骗技术的成本可能不高，而且当它触发时，可以为你提供惊人的投资回报。另一个是允许团队免费实施安全最佳实践的安全基石。这也被称为解决问题的高杠杆解决方案，并通过赋能从业人员/开发者来实现极佳的扩展。\n\
  \n## 你的组织是否实施了任何欺骗技术？\n\n欺骗技术在我的组织非常有效。它们提供了极高的投资回报率，并捕到了其他情况下难以检测的利用行为。\n\n## 组织应该在何处使用加密？\n\
  \n我认为组织应该在任何需要保护敏感数据的地方使用加密。这取决于我们在这里指的加密，但 `TLS` 应该在尽可能的地方使用，并且你应该利用静态加密（encryption\
  \ at rest），特别是当它由平台/云提供商免费提供时。在实施加密时，你应该采取让团队易于利用和使用的方法。你不应该只是告诉团队他们应该使用加密，然后把实现工作完全留给他们自己。\n\
  \n## 你如何处理数据治理以及减少数据足迹的方法？\n\n在处理数据治理时，最重要的一个方面是对你作为公司可能持有或处理的数据类型有清晰的理解和定义。一旦有了清晰的定义，你就可以通过标记/元数据来处理数据治理。这将让你了解在什么地方拥有什么数据，然后开始围绕数据采取安全措施。根据你可能需要考虑的法规，这也有助于你的架构和方法。\n\
  \n## 你对合规性有什么看法？\n\n我对合规性的看法是它是必要的，并且能帮助公司比通常情况下更安全。同样，我认为你应该在公司内部实施并做好正确的事，让合规性成为你已有的实践和流程的附加收益。\n\
  \n## 是否有一个框架可以将蓝队执行的活动或功能与监管合规要求相结合？\n\n互联网安全中心（CIS）倾向于被许多工具采用以满足监管要求的框架。它是衡量你在云安全方面表现的一个很好的起点或评分卡。当然，你可能需要对其进行调整以适应特定行业/特定的的需求，但在处理当今公司的安全时，它将为你提供一些非常棒的初步考虑因素。蓝队在这些控制范围内有很多领域可以负责，并且应该对剩余的控制有良好的理解。\n\
  \n## 你如何参与组织的所有不同部门以实现防御最大化？\n\n我不断参与公司的所有区域，关注目前正在进行或在路线图上的计划。通常，这是通过与公司不同部门的领导进行每周/双周/每月的同步完成的。频率通常取决于变化的关键性/频繁程度，如果变化非常重要，保持感知并领先就至关重要。\n\
  \n这也是讨论来自蓝队的内容以及整个组织/部门/团队中需要解决的关注领域的机会。另一种很好的参与方式是通过全员演示，以及就团队正在开展和未来计划开展的计划进行沟通。\n\
  \n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\n我使用的一种向非技术决策者传达威胁的策略是使用他们熟悉的类比，描述其影响和/或以他们能够真正理解的方式进行传达。了解听众是沟通中最重要的方面。如果面对高管，从金钱损失/延迟等影响公司整体的角度来讨论风险，可能比讨论特定漏洞的利用风险更有。\n\
  \n## 在重大持续事件期间，你管理非技术高管预期的建议是什么？\n\n我在重大持续事件期间管理非技术高管预期的建议是持续检查并向他们保证一切都在范围内，并对响应建立信心。\n\
  \n花时间与他们坐在一起，向他们讲解发生了什么，直到他们理解并能用自己的话解释。讨论响应事件的不同方式以及每种方式的风险/信心水平。他们感到越参与、越理解，焦虑感就越少，对人的误导就越少，对你的信任就越多，并会将你带入与董事会和/或其他利益相关者的高层对话中，这在整个响应时间内总体将产生无价的回报。\n\
  \n\n\n\n“因为我们无法将蓝队限制在一个标准的孤岛中，因此它最终将由组织中的任何成员（有时是第三方）组成，这些成员为企业、软件或服务的防御安全态势做出了贡献，特别是涵盖机密性、完整性和可用性的\
  \ CIA 三要素。”\n\n**Twitter:** [@InfoSystir](https://twitter.com/InfoSystir) • **网站:**\
  \ [www.linkedin.com/in/amandaberlin](http://www.linkedin.com/in/amandaberlin) 和\
  \ [www.mentalhealthhackers.org](http://www.mentalhealthhackers.org)\n\nAmanda Berlin\
  \ 是 Blumira 的高级安全架构师，也是非营利组织 Mental Health Hackers 的首席执行官兼所有者。她编写了一本名为*Defensive\
  \ Security Handbook: Best Practices for Securing Infrastructure*的关于蓝队最佳实践的书，该书合著者为\
  \ Lee Brotherston（O'Reilly Media, 2017）。她是 Brakeing Down Security 播客的共同主持人，并在多个博客撰文章。她在不同的技术领域和行业工作了十多年，提供基础设施支持、分检和设计。现在，她致力于创建尽可能多有意义的告警。Amanda\
  \ 是一位热心的志愿者和心理健康倡导者。她在许多会议、会议和行业活动中进行过演讲。示例包括 DerbyCon、O'Reilly Security、GrrCon\
  \ 和 DEF CON。虽然她不像其他人可能拥有的资或声望，但她希望通过自己的机智、幽默感以及快速上手新技术的技巧来弥补这一点。\n\n## 你如何定义蓝队？\n\
  \n如果你从军事演习中这一术语的起源核心来看，它意味着简单纯粹的防御。我个人认为，出于几个原因，你不能将蓝队限制在特定的角色或职位名称上。当防火墙管理员配置下一代防火墙（`NGFW`）以实现仅限白名单\
  \ ACL 时，他们正在执行蓝队功能，因为这是企业整体防御的一部分。相比之下，当同一位防火墙管理员配置一条新路由时，那就是一项网络功能。\n\n因为我们无法将蓝队限制在一个标准的孤岛中，因此它最终将由组织中的任何成员（有时是第三方）组成，这些成员为企业、软件或服务的防御安全态势做出了贡献，特别是涵盖机密性、完整性和可用性的\
  \ CIA 三要素。\n\n蓝队功能可以涵盖信息安全中的许多不同部门，包括实施和设计系统以主动提高安全性的工程师和架构师、花费时间在客户日志中搜寻恶意活动威胁的托管服务提供商，以及在编写报告中撰写建议期间的渗透测试人员。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n通常是防御和检测技能，诚然这涵盖了广泛的知识。如果让我从这每个类别中各选出一个顶尖能力，它们将是对企业系统工作原理的通用理解，以及利用这些知识识别哪些关键操作应该被监控并视为异常的能力。\n\
  \n## 事件响应程序的一些关键优势是什么？\n\n事件响应流程是在发生事件时快速反应、判断非事件、在事件期间高效运行以及在事件后进行改进的不可缺组成部分。在事件发生之前建立流程从长远来看将产生回报。引入\
  \ `IR` 程序流程部分的关键优势是标准化流程。\n\n## 蓝队成员如何如何学习、练习和成长？\n\n最重要的四点是 `CTFs`、`podcasts`、`home\
  \ labs` 和 `books`。我建议任何非全职红队人员都去参加夺旗赛（CTF）。它们也可以提供交叉培训并增加技能。以下是一些 `CTF` 资源：\n\n\
  - [`ctftime.org`](http://ctftime.org)\n- [`ctf365.com`](http://ctf365.com)\n- [`overthewire.org`](http://overthewire.org)\n\
  - [`hackissite.org`](http://hackissite.org)\n\n播客是信息的 get 来源，从采访到新闻都有：\n\n- Brakeing\
  \ Down Security\n- Cyberwire\n- Darknet Diaries\n- Defensive Security Podcast\n\
  - Open Source Security Podcast\n- SANS ISC Daily\n- Security Weekly\n\n刚开始时家庭实验室是必须的。它们能让你理解基础网络、操作系统和软件，同时让你能够尝试攻击和防御，而无需担心变更控制的麻烦或可能损害生产环境。创建家庭实验室的资源非常多，但这完全取决于你当时的具体目标。如果你寻找的是类似\
  \ `Azure` 或 `GCP` 的体验，那么你的家庭实验室在云环境中可能比在办公室更好。\n\n信息安全领域有大量书籍。以下是我对蓝队的推荐：\n\n- *Defensive\
  \ Security Handbook: Best Practices for Securing Infrastructure*，作者：Amanda Berlin\
  \ 和 Lee Brotherston\n- *Blue Team Handbook: Incident Response Edition*，作者：Don Murdoch\n\
  - *Blue Team Field Manual*，作者：Alan J. White 和 Ben Clark\n- *Intelligence-Driven\
  \ Incident Response: Outwitting the Adversary*，作者：Scott Roberts 和 Rebekah Brown\n\
  - *Building an Information Security Awareness Program: Defending Against Social\
  \ Engineering and Technical Threats*，作者：Bill Gardner 和 Valerie Thomas\n- *How to\
  \ Measure Anything in Cybersecurity Risk*，作者：Douglas Hubbard 和 Richard Seiersen\n\
  \n\n\n\n根据所衡量的信息安全计划的不同部分，有几种不同的指标可以提供帮助。在计划实施之前、新策略/程序/技术的实施期间以及计划改进之后，一致地应用这些指标，可以很好地了解哪些因素产生了重大影响。这方面的两个非常有用的资源是\
  \ Douglas Hubbard 和 Richard Seiersen 编写的《How to Measure Anything in Cybersecurity\
  \ Risk》，以及 Bill Gardner 和 Valerie Thomas 编写《Building an Information Security Awareness\
  \ Program: Defending Against Social Engineering and Technical Threats》。\n\n*   **`Number\
  \ of overall security incidents`（安全事件总量）**：随着安全态的提高，这个数字应该减少。\n*   **`% of out of\
  \ date systems`（过期系统百分比）**：`Firmware`、`software` 和 `operating system` 补丁应该被跟踪并作为计划要求的一部分，因为它们导致了大量的安全事件。\n\
  \n在实施安全意识计划时，一个例子是员工报告恶意活动的平均时间。如果在培训之前没有报告或报告极少，而在发生首次恶意活动后，报告变得更加频繁和快速，那么合情合理，教育方法和材料按预期发挥了作用。\n\
  \n### 如果你是一家中小型企业唯一的信息安全人员，且安全基础设施非常原始，你会从哪里开始？\n\n毫无疑问是资产管理。这是最难涵盖的垂直领域之一。如果没有适当的资产管理，环境就无法得到最大程度的保护。在不知道要保护什么的情况下，没有办法制定出完整的防御策略。攻击者或红队在攻击或交战期间的首要任务之一就是侦查。在较大的网络中，要完全了解连接的每一个设备或用户可能安装的每一件软件几乎是不可能的。然而，有了正确的安全控制措施，这就会变得容易得多。\n\
  \n分类、组织、自动化、定义、收集、跟踪、监控、报告、记录、清洗、揉搓、重复。\n\n## 性价比最高的安全控制措施是什么？\n\n大多数企业手头都有一个被极度使用的资源，即\
  \ `Windows Group Policy`。`Group Policy objects`（`GPOs`）用于在域配置中集中管理硬件和软件设置。它们被分为本地策略和域策略，并可以按照特定顺序应用于特定的账户或容器，以获得不同的结果。与其从零开始通过检查每个单独设置来尝试构建安全的\
  \ `GPO`，不如可以使用现成的完全配置模板。美国国家标准与技术研究所（`NIST`）有一组可以从其网站下载的安全基准 `GPOs`。\n\n`NIST GPOs`\
  \ 包含了诸如满足标准密码安全要求、禁用域账户密码的 `LM hashes`、禁用本地访宾账户以及防止缓存用户凭据等设置，以及数百种其他用户和计算机设置。可以在网站上找到布局良好且文档完备的设置，以及下载文件和修订历史。\n\
  \n## 你的组织是否实施了任何欺骗技术？\n\n是的！我目前在一家名为 `Blumira` 的软件服务（SaaS）提供商工作。我们的主要目标是收集客户日志，并提供与\
  \ `playbooks` 的可操作告警，供较小的安全团队遵循，并接收有关每个发现应配合哪些事件响应或修复程序的逐步说明。在很多时候，特别是在没有完整安全团队的小型组织中，部署任何类型的欺骗技术都是极其令人令畏的。我们提供的服务之一是内置在组织内部解决方案中的\
  \ `honeypot deployment`。\n\n## 组织应该在何处使用加密？\n\n随处可见！我想不出任何传输中或静态存储的数据是不从加密中获益的。\n\
  \n## 你对合规性有什么看法？\n\n处理合规性确实有对错方法之分。可以在考虑安全的情况下获得合规性；但在执行过程中，仅仅做一个“选框检查者”是容易且懒惰的。\n\
  \n### 你如何参与组织的所有部门以实现防御最大化？\n\n与组织的不同成员一起进行 `tabletops`（桌面演练）可以展示出如果不重视安全会发生多么糟糕的情况。在\
  \ C 层中拥有理解为何必须实施某些安全措施的高层支持者或倡导者，将有助于获得参与和推动。\n\n### 在重大事件期间，对于管理非技术人员的预期有什么建议？\n\
  \n如果他们询问（这很罕见），在定期更新中提供关于攻击计划、潜在结果和潜在影响的清晰简洁信息通常是最好的做法。\n\n\n\n\n\n*   **桶 1：**\
  \ 蓝队是一项旨在全行业网络安全防御从业者协作的全球性努力。如果世界上某个地方的一家公司被攻击者攻破，那是不幸的；如果另一家公司以同样的方式被攻破，说明缺乏有效的信息共享和教训评估。攻击者在选择目标时具有全球眼光，会寻找盟友协助其任务并执行。事实就如此简单。作为蓝队成员，我们必须采取`DFIR`（数字取证与应急响应）为行业所做的工作；我们已经定位自己，以缩短响应攻击的时间并将他们踢出我们的环境。现在加上网络威胁情报、云安全和威胁猎寻能力；我们正在缓慢转向主动，在保持响应和检测威胁能力的同时防止未来的攻击。这就是蓝队对我而言的意义。\n\
  \n### **蓝队应该具备哪两个核心能力？**\n\n可见性和响应能力。盲目战斗是困难的，如果你没有跨越网络和系统的可见性方法，你本质上就是在进行盲目战斗。确保你具有响应攻击的能力至关重要，无论是内存痕迹收集、即时拦截第\
  \ 3 层流量的能力，还是拆除系统并用备份替换。\n\n### **应急响应计划的一些关键优势是什么？**\n\n**耐心。** 在我的经验中，攻击者的故事是逐条线索拼接起来的。如果你不是一个有耐心的人，并且在管理层要求快速答案的压力下，你会错过一些东西。\n\
  \n**灵活性。** 我在职业生涯中曾亲身受此害。当你的公司投入大量资金将工具整合到环境中时，你的操作假设是这些工具总是可用的，或者整个团队对它们有深入理解。在员工流失且新成员尚未适应的情况下会发生什么？更好的是，如果工具出现错误无法运行怎么办？你该怎么办？拥有一个足够灵活、可以利用开源工具的计划对我来说意义重大。\n\
  \n### **蓝队成员如何学习、实践和成长？**\n\n**参与攻破调查。** 认真的。在把攻击者赶出去之后，工作并没有结束；实际上才刚刚开始。你正在对自己的工具、流程和程序进行彻底的审查和审查。\n\
  \n**听听“老兵”的话。** 如果你想表现得哲学一点，请听从长辈。在安全领域有很多有 30 到 40 年经验的人，他们也许不在 Twitter 上活跃。找到这些人，并尝试与他们建立关系。汲取他们愿意分享的所有知识。\n\
  \n### **如何奖励出色的蓝队工作？**\n\n这是一个有趣的问题，因为企业并没有将这种心态应用于防御。考虑一下开机时间以及贵公司没有发生事件的平均天数。这可能超过其他替代方案。认可是一个很好的开始。之后，团队在公司的出资下运作。或者也许，仅仅是，他们每年为团队支付参加一个或以上会议的费用。\n\
  \n### **蓝队可以使用哪些核心指标来构建、衡量和维护一个成功的信息安全计划？**\n\n*   响应时间\n*   事件关闭时间\n*   漏洞修复中位时间\n\
  \n### **如果你是一家拥有简陋安全基础设施的中小型企业中唯一的信息安全人员，你会从哪里开始？**\n\n**了解你的网络。** 了解当前的入站和出口点始终是一个良好的开始。之后，应该对协议和加密方案进行审查。一旦我理解了这些领域，我就可以开始计划实施一种辅助监控和检测的解决方案。\n\
  \n### **性价比最高的安全控制措施是什么？**\n\n最小特权控制。并不是所有人都需要管理员权限。\n\n### **组织应该在何处使用密码学？**\n\n\
  关键任务数据的存储和传输。\n\n### **你如何处理数据治理和其他减少数据足迹的方法？**\n\n在与治理、风险、合规（`GRC`）专业合作合作，我的想法非常开放。我尝试听从他们的，因为那不是我最擅长的领域。了解你的局限。\n\
  \n### **你对合规性有什么看法？**\n\n简而言之，如果你处于一个不合规可能会影响底线的领域，就去做必须做的事。\n\n### **是否有框架可以将蓝队执行的活动或功能与监管合规要求对齐？**\n\
  \n`NIST CSF` 不仅在构建蓝队功能时，在创建安全运营计划时都是极很好的参考。我认为这是一个起点，也是判断安全计划强弱的地方。\n\n### **你使用什么策略向非技术决策者传达你遇到的威胁？**\n\
  \n我尝试不以恐惧、不确定和怀疑（`FUD`）的模式运作，而是提供真实世界的示例，说明攻击者如何获取访问、在环境内部移动并最终外泄数据。在某种意义上，辛苦的工作已经通过像\
  \ `Verizon DBIR` 这样的年度报告完成了。\n\n我尝试将安全请求与底线联系起来。例如，“我需要资金购买 `SIEM`”是一个宽泛的陈述。然而，“我需要\
  \ 60000 美元购买 `SIEM`，以及这将如何保护我们免受十大威胁”要好得多。\n\n### **在重大事件期间，管理非技术高管的预期有什么建议？**\n\
  \n在拨电话或参加高管会议之前，要有一个行动计划，因为如果你偏离了原始声明，他们会抓住机会。这并不是说他们要针对你，但必须记住，最后必须有人承担责任。\n\n\
  尝试沟通里程碑而非最终目标。例如，“七天内我们将获得关于如何被攻击的更多以及后续步骤”比“我们在七天内解决”要好。不要过度承诺。参考我的第一个答案以了解为什么。\n\
  \n** John Breth\n\n![](img/c07uf001)\n\n> “每一个从事 IT 的人都有责任以安全的方式构建、运行和维护系统。”\n\n\
  **Twitter:** [@jbizzle703](https://twitter.com/jbizzle703) • **网站:** [www.linkedin.com/in/john-breth-730b7755](http://www.linkedin.com/in/john-breth-730b7755)\
  \ 和 [www.youtube.com/channel/UCmJJUewPWfnyzvrFHkA](http://www.youtube.com/channel/UCmJJUewPWfnyzvrFHkA)\n\
  \nJohn Breth 是 `JBC` ([jbcsec.com`](http://jbcsec.com)) 的创始人兼首席经理，是一位经验架构师和作者，拥有\
  \ 17 年经验，帮助国家联邦机构、国防和情报机构以及关键基础设施公司识别、实施和防御网络威胁。John 曾为一级 ISP 支持的联邦政府的网络保护、多处国防部联合网络以及空军一号的安全网络设计并实施了关键任务系统。John\
  \ 获得了来自 `(ISC)²`、`Cisco` 和 `CompTIA` 的多个高级认证，并在约翰·霍普金斯大学获得了信息技术方向的硕士学位。\n\n\n\n\n\
  \n这里有两个答案。其中一个是通常接受的答案，我们在尝试对管理工作进行概念化时会使用它，特别是在处理资金和资源时。这是蓝队（blue team）的默认定义，即一组（如果你来自国防部背景，则称为防御者）负责监控和响应潜在事件的人员。\n\
  \n我更全面的答案是，每个在 IT 领域工作的人都有责任以安全的方式构建、运行和维护他们的系统。这意味着我们在 IT 部门的每一个人都是蓝队的一员。我认为，对于那些想要成为管理员和工程师的新人，不培养他们的这种心态是不诚恳的。调整、监控和响应告报可能不是你的工作，但你应该意识到要实施最佳安全实践，并理解你在提高环境及其用户安全性方面所扮演的角色。\n\
  \n我认为，具有影响力的红队和蓝队之间的行动可以且应该存在很多重叠。例如，一个优秀的蓝队成员甚至是 IT 人员，应该验证并测试他们实施的缓解措施（即类似于红队的活动）。同样，一个优秀的红队人员应该就改进其所测试组织的防御和警报的方法提供可操作的信息（这也是蓝队成员也应该持续做的事）。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n技术能力取决于资源预算（技术和合格的团队成员）。这始终会与现实作斗争，即实现下一个工具、增强团队等所需的时间总是比预想的少。因此，我认为最重要的、独立于技术能力的是关于心态的。我们需要在面对这些挑战时，能够以产生影响的方式运作的人员。对我来说，这些能力是指从多个角度观察和处理信息的能力，以及在行动中保持坚韧的能力。\n\
  \n从多个角度看问题允许团队成员识别威胁、弱点，开发应对措施，创建有影响力的告报，并定义和实施可用且重复的流程。这涉及到从外部威胁、内部威胁、用户、其他 IT\
  \ 员工以及团队其他成员的角度来看问题。坚韧的心态是驱动团队成员在项目中额外努力的力量。\n\n成功的应急响应（IR）程序是一个处于不断改进和调整状态的。威胁在变，技术在变，法规政策在变，团队和责任也是如此。不仅能够修改程序的范围和政策，还能测试程序在技术和计划方面的有效性，这是至关重要的。这涉及到将组织中所有相关的触点结合在一起，并积极寻求他们的意见和参与。你不能在一个黑箱里创建一个有效的\
  \ IR 程序。\n\n## 蓝队成员如何学习、实践和成长？\n\n一种既重视知识积累又重视分享的工作文化是非常重要的。这意味着支持组织内部的学习机会（午餐学习会、供应商培训和在职培训）以及外部的学习机会（会议、训练营、大学课程）。重点应该放在分享他人已有的知识上，并为学习更多知识建立途径。这需要初级人员、资深人员和管理层的积极参与。\n\
  \n在更细粒度的层，有三件事证明是有益的。首先，被低估的领域是文档编写。写下程序对员工很有用。其次，了解个人的具体情况非常重要。最后，组织培养重视知识文化的一种绝佳方法是支持员工。\n\
  \n## 你如何奖励蓝队的工作？\n\n这取决于个人、他们的职业生涯以及他们的技术追求。然而，在我们讨论这些之前，让我们先从这一点开始：照顾好员工。我作为一个小企业主是这么说的。做到这一点的首要方法是（特别是对于那些在岗位上表现出色的人）是以一种让他们感到受尊重和感激的方式支付报酬。\n\
  \n之后，我们进入具体的细节理解。奖励工作可能包括允许他们追求自己喜欢的培训，在组织内部赋予他们与其目标一致的责任，并将他们晋升到反映其成长的职位。然而，这些事情因人而异。通过对话来确定这些事情是关重要的，对于一个健康的团队也非常重要。这归根于在私下和公开场合的认可与尊重，以及对个人的沟通和支持。\n\
  \n## 如果你是一个安全基础设施极其简陋的中小型企业中唯一的信息安全人员人员，你会从哪里开始？\n\n第一步是了解你拥有什么以及你需要保护什么。因此，我想知道存在哪些资产，它们的业务/任务功能是什么，环境中的“皇冠明珠”有哪些，以及建立了哪些工具用于监控、管理、日志记录、扫描和补丁。适当的文档是关键的基础功能。如果我们不能对这里有什么、什么是重要的/需要保护的、使用了哪些工具以及我们的主要威胁达成共识，那么我们只能是在原地打转。\n\
  \n一旦信息开始被发现和验证，我们就可以决定从哪里投入精力。我们需要日志记录和监控工具吗？我们需要实施网络划分/限制数据流吗？我们需要关注补丁吗，因为已经两年没有打过补丁了？但在对当前状态和差距有相当的把握之前，这些决定是无法做的。\n\
  \n## 什么是性价比最高的安全控制措施？\n\n\n\n\n\n我喜欢这个问题，因为我对它的答案是我最喜欢讨论和写作的话题之一。我是网络安全基础知识的坚实支持者，而在环境中真正能产生影响的首要手段是网络分段。如果从环境之初就实施了这一点，可以极大地限制横向移动的能力。由于我主持过大量的评估工作，我可以证实，这真的能让红队非常沮丧。在环境中实施这一方案时，我有一套三阶段的方法。\n\
  \n### 网络分段策略\n\n第一步是根据每个独特的功能（有时甚至是子功能）将网络划分为独立的 `VLANs`/`subnets`/`security zones`。从高层次来说，这意味着域控制器放在自己的\
  \ `VLAN` 中，打印机放在自己的 `VLAN` 中，监控工具放在另一个 `VLAN` 中。试想象一下奥普拉（Oprah）如何喜欢给粉丝们分发汽车；这就是我分配\
  \ `VLANs` 的方式。这显然会增长得很快，在较大的环境中，自动化将是你的朋友。\n\n其次，我喜欢在这些 `VLANs/subnets/security\
  \ zones` 内部实施私有 VLAN（private VLANs）。这是一种 VLAN 技术，允许你更粒度地确定 `VLAN` 内部哪些主机可以相互通信。例如，工作站之间是不需要通信的。因此，在它们所在的私有\
  \ VLAN 中，你将它们置于隔离模式（isolated mode）。现在，该 VLAN 中它们唯一可以通信的设备（尽管它们都在同一个子网中）是你配置的网关的设备。主机之间没有横向通信！\n\
  \n最后，我喜欢在三个级别实施访问控制列表（ACLs）。在网关/防火墙层面，我为不同 `VLANs/security zones` 之间的数据流实施特定规则（即\
  \ `inter-VLAN ACLs`）。在交换机层面，我随后实施 `intra-VLAN ACLs`，以控制同一 `VLAN` 内被私有 VLAN 配置允许通信的所有主机之间的数据流。最后作为最后的保护，我确保在主机层面也实施了\
  \ `ACLs`。这些步骤并没有真正的魔力，如果你对 `ACLs` 设置得非常具体，通过这种分段确实可以为网络防御提供一个坚实的基础。\n\n### 欺骗技术\n\
  \n你的组织是否实施了任何欺骗技术？\n\n在过去的两年里，我真的非常迷于阅读欺骗技术了。向 Black Hills Information Security\
  \ 的 John Strand 致敬。他们就这个主题发布的信息非常棒，我很感激去年能在 Black Hat 大会上参加了他的“主动防御（Active Defense）”课程。我已经开始在我一些客户的环境中实施一些与此对齐的方法论和工具。\n\
  \n一些像蜜罐账户（honey accounts）这样简单的东西其实是一个非常容易的解决方案，我很惊讶为什么没有更多地方实施。我一直在尝试和测试蜜罐端口（honey\
  \ ports）（显然还有蜜罐容器 honeypots）以及金丝雀（canary tokens）。\n\n我用过的另一个工具集与主动防御课程更契合（不一定是欺骗，更多是溯源），是使用\
  \ `Bro/Zeek/Corelight` 结合 `Active Countermeasures AI Hunter/Rita` 进行信标检测。\n\n最后，在我支持的一个安全服务中，我们确实提供一个\
  \ DNS 汇洞（DNS sinkhole）服务，将客户受感染主机重定向到蜜罐。因此，基于此的告非常有用。\n\n### 合规性观点\n\n你对合规性怎么看？\n\
  \n合规性是重要的，可以用来验证你是否在环境安全和卫生方面做了应该做的基础工作。我在 Twitter 上看到过一句很棒的名言，我无法核实最初是谁说的，但它完美地总结了我对合规性的观点。“良好的安全实践就像洗手；你应该花时间彻底地洗。但如果你只是在洗手，你就没法用你的手来干活。”\n\
  \n我看到，仅仅为了一个勾选框而维护不断增长的合规需求列表是一项挑战。这应该有一个折中点，但验证和报告的过程本身花费的精力不应比实际的安全加固和监控更多。\n\n\
  ### 监管框架\n\n是否存在一种框架可以将蓝队执行的活动或功能与监管合规性要求对齐？\n\n这是一个棘手的问题，所以我说这取决于情况。我的观点是，框架可以作为指南或起点，将个人/团队/组织引向正确的方向。但它们不是一种一刀切的解决方案，你需要根据对你的团队和组织有效或无效的方法来采取全面的方法（除非那是你法律规定必须做的事；如果是那样，你就得硬着头皮做了）。\n\
  \n从整体 IT 来看（包括蓝队活动），我发现 `NIST 800-53 Security Controls and Traceability Matrix (SCTM)`\
  \ 是一个非常有用的起点。再次，这里有很多细微差别，我绝不是在说它是完美的。但我觉得，如果你是从零开始，并寻找关于从控制角度应该实施某些内容的指导，这确实是向正确方向的一个相当不错的推力。\n\
  \n### 组织参与\n\n你如何参与组织的所有不同部门以实现防御最大化？\n\n我一直发现，结构化且高效管理的每周/双周会议是有益的，这些会议将需要相互作用的各个小组的关键成员聚集在一起。至少通过这种方式，存在某种程度的情境意识。它有助于与其他小组的成员建立关系，我目前的组织中很幸运，团队之间有很多交流。我以前在一些地方工作过，一个小组去并实施了某些东西，而不与其他团队沟通。这导致了由于连锁反应，引发的响应让极少有人知道这是经过批准的实施方案。因此，从规划和意识的角度来看，沟通是关键。\n\
  \n### 与领导层沟通\n\n你使用什么策略向非技术决策者传达你遇到的威胁？\n\n对于那些纯技术思维的人来说，这可能是一个挑战。这回涉及到理解你组织的使命是什么、他们的驱动力是什么，以及如果某种威胁变为现实会对他们的使命产生哪些潜在的负面影响。如果你有关于潜在损失（小时/金额/资源）的定量数据，那么对于非技术人员来说就是一个容易理解的故事，尽管那种类型的数据通常更难收集和制定。\n\
  \n获取外部观点和建议是有益的。出于某些原因，有时领导层（遗憾的是）对外部顾问或评估小组的反应会更积极，他们会提供关于威胁是什么以及如何应对和防御这些威胁的建议。我在做评估时喜欢做的一件事是问\
  \ IT/网络安全团队是否有他们一直向管理层请求过但没有得到的东西。如果这看起来很有道理，我很乐意在我的建议报告中写一些内容，说明团队提到需要 X，并且根据 A\
  \ 到 D 等原因同意他们。\n\nWileyPRE\n\n\n\n\nLee 的职业生涯大部分都在蓝队角色中度过，包括工程师、事件响应、顾问、取证和领导职位。这些角色涵盖了电信、金融、酒店业、运输和物联网（IoT）等许多行业。他是《防御安全手册》（*The\
  \ Defensive Security Handbook*，O'Reilly 出版）的合著者，并经常在会议上就多个信息安全相关的话进行演讲。\n\n## 你如何定义蓝队？\n\
  \n这个定义实际上比我想象中要困难。每当我开始使用如“提高组织的安全态势”之类的描述时，这个定义就会崩溃，因为红队也会试图通过其他手段做到这一点。因此，在最广泛的范围内，我会将蓝队归类为任何主要关注防御性实践的人员。\n\
  \n## 蓝队应该具备哪些核心能力？\n\n沟通是一项核心能力。如果蓝队无法与业务其他领域的人有效交流，那么他们实施变更的能力将受到严重影响。无论是在战略倡议还是运营战术决策方面都是如此。根结底，安全团队可能并不掌握最终权力，因此将依靠其他团队的支持以确保正确的变更发生，而这些其他团队需要参与进来。。为了说明，如果你因为漏洞需要禁用某个公共\
  \ API，蓝队将需要管理的支持，特别是当它面向客户时。为了支持这一行动，开发团队可能需要花时间编写修复程序，通告团队可能需要撰写公告等。能够用每个这些团队都能理解的语言准确地表述问题，将带来更好的结果和更高的效率。\n\
  \n务实也是一项非常强大的能力。如果蓝队试图在追求安全安全乌托邦的过程中在每一个阵地上都“战死”，那么他们可能一无所获，并在此过程中与组织的其余部分疏远。学会选择战斗目标是一项被低估的技能。如果你参加每一场战斗，就会耗尽你积累的大量社会资本，如果人们认为他们知道答案会是什么，他们就会找到方法避开你。而如果你在方法上是务实的，那么当你真的需要给出一个有力的“不”时，人们会更认真地对待你，因为你的话更有分量。同样，你花费了更少的能量和资源去在组织内部进行那些收益微乎其微的战斗。简单地考虑这一点，如果你为了完美而战斗并失败了，你实现了\
  \ 0% 的目标；如果你为了实现 60% 的目标而战斗并让其他 40% 放过，你仍然比完美主义者领先了 60%。\n\n> 如果蓝队试图在追求安全乌托邦的过程中在每一个阵地上都“战死”，那么他们可能一无所获，并在此过程中与组织的其余部分疏远。\n\
  \n## 事件响应计划具备哪些关键优势？\n\n我在事件响应方面的经验是，你绝对无法考虑到所有的可能发生的情况。如果你可以，那么响应早就已经自动化了。因此，一个试图列举我们面临的所有可能事件的计划注定会有遗漏，所以我认为一个灵活的计划是一项关键优势。当然，某些事情应该是固定的，例如升级路径、沟通计划、角色和职责、SLA\
  \ 等。但例如，为每一种恶意软件组合编写一个点击点击式的操作手册（playbook）简单是不可能的。\n\n## 蓝队人员可以如何学习、实践和成长？\n\n我认为学习最好的方法首先是弄清楚自己最适合如何学习。有些人通过阅读和倾听来学习，在这种情况下有大量的书籍、播客、博客文章、会议演讲等资源可用。如果你愿意为此花一些钱，各种公司会针对各种主题举办培训课程。\n\
  \n> 我认为学习最好的方法首先是弄清楚自己最适合如何学习。\n\n有些人通过实践来学习，在这种情况下，防御自己的网络可以是一个极好的学习场所。为你的家庭网络配置自己的\
  \ `firewall` 和 `IDS`，或者在某处运行一个廉价的虚拟服务器，学习如何加固操作系统、检测并警报攻击等。\n\n成长也体现在增加你在传统安全领域之外的经验和理解。这种增长从个人角度来看是非常棒的，在寻找新工作机会时也极具市场竞争力。例如，能够理解预算和法律文件在与领导层和更具业务意识的人士交谈时将产生回报，这可以帮助那些寻求进入安全领导职位的人。学习编程或网络管理等技能将让你有更深入的理解，并有足够的词汇与你需要的以完成安全工作的开发者和网络工程师交流。\n\
  \n最后，利用社区和你的的人脉网络。无论是导师指导还是即时建议，都有许多愿意伸手帮助的人。人们非常乐意就技术决策提供建议、分享经验、审核简历、职业建议等，你通常可以通过这种方式找到答案。\n\
  \n## 你如何奖励出色的蓝队工作？\n\n选择如何奖励蓝队工作是困难的，因为很容易引入扭曲的激励。例如，如果你选择为那些发现并修复漏洞的人提供某种奖金，这可能会激励人们暗中引入漏洞，以便他们以后可以“发现”这些漏洞来领取奖金。如果你引入了保护措施来防止人们在自己的代码中发现漏洞，那么他们可能会与他人合作，由一个人负责引入，另一个人负责发现。\n\
  \n> 选择如何奖励蓝队工作是困难的，因为很容易引入扭曲的激励。\n\n我认为奖励应该是基于指标的，但要使用一种与工作质量对齐得更紧密的指标。\n\n至于奖励本身，很大程度上取决于个人。当然，大多数人喜欢获得资金或假期，但许多人也寻求职业发展、学习机会、首选任务、培训等。\n\
  \n## 蓝队可以使用哪些核心指标来建立、衡量和维护成功的信息安全计划？\n\n指标是困难的。有很多糟糕的指标我们可以选择的，我也见过人们选择这些，但它们实际上是毫无意义的。这些是诸如拦截的病毒数量、过滤的垃圾邮件、拦截的端口扫描等。为了选择良好的指标，我们应该首先问自己，我们从指标中得到什么？对于安全计划，我可能更希望关注组织整体安全态势的改进，而不是关于阻止攻击数量的任意指标，后者无论安全成熟度如何，结果都可能剧烈波动。\n\
  \n> 有很多糟糕的指标我们可以选择的，我也见过人们选择这些，但它们实际上是毫无意义的。\n\n那么，我们应该衡量什么？我想说我们应该更多地关注如风险降低之类的内容。衡量此的一个简单替代指标可能是环境中高危和严重级漏洞的数量，或者从发现漏洞到修复这些漏洞的平均时间。这种指标将为组织安全态势的改进提供更具意义的洞察。\n\
  \n\n\n\n\n根据组织的不同，还有许多可能有用或无用的其他指标。例如，在开发类组织中，我们可能希望使用诸此类指标，如静态代码分析工具的输出、漏洞依赖检查、漏洞赏金提交或其他代码质量的替代指标。\n\
  \n### 如果你是一家中小型企业唯一的信息安全人员，且公司的安全基础设施非常原始，你会从何处开始？\n\n针对中小型企业安全基础设施原始的情况，根据我的经验，该公司不太可能一直很好地处理操作系统补丁、删除旧账户、强制\
  \ `2FA` 等任务。确保这些基础级实践的到位是成功的关键；否则，你可能开始部署更复杂的防御措施，结果却被一个普通的恶意软件而付诸东流。接下来，我将使用红队战术之一：`live\
  \ off the land`（离地攻击）。\n\n> 接下来，我将使用红队战术之一：`live off the land`。\n\n红队人员通常会重用环境中已有的工具以避免被检测；我们也可以重用现有工具进行改进，而无需承担部署新基础设施或软件所带来的中断、成本和资源消耗。\n\
  \n例如，许多用于服务器和网络的监控及健康工具会从主机收集许多指标，以判断它们何时运行不正常。其中许多指标也可以被重用来检测潜在的安全问题。这当然取决于不同环境的具体情况；然而，任何偏离常态的情况都可能是有用的信号。\n\
  \n用于统计和分析目的 Web 日志监控工具也可以被重用于对潜在攻击发出告警。例如，比通常数量的 `3XX` 或 `4XX` 错误，通常表明有人正在攻击服务器、枚举端点、进行暴力破解等。\n\
  \n如果你的组织使用内部 `DNS` 缓存、代理或防火墙，那么通常使用这些现有工具来提取访问过的域名和 IP 地址列表是简单的。有很多可用资源可以检查这些连接是否指向了已知的命令与控制网络（C2）、钓鱼网站等。\n\
  \n## 你的组织是否实施了任何欺骗技术？\n\n就个人而言，我对欺骗技术持有复杂的感情。许多部署的技术误报率可能高于预期，事实上它们本身还会通过扩大攻击面，向环境中引入漏洞和弱点。\n\
  \n然而，`canary tokens`（金丝雀令牌）非常有价值，例如创建无法访问任何内容但在使用时会触发警报的 `API keys` 或访问令牌。你可以将这些密钥放置在开发人员电脑上，如果收到告警，你可以假设某台开发者电脑已被攻破。同样，虚拟客户账户在被访问（或在数据转储中出现）时触发告警，可以作为客户数据库被攻的良好指标。\n\
  \n通过仔细使用 `canary tokens`，很容易在你的基础设施周围创建一种高信号、低风险的触发器部署方法，让攻击者触碰。\n\n## 你对合规性有什么看法？\n\
  \n我对合规性的看法实际上取决于你的环境，它可以是负面的，也可以是正面的。仅仅为了合规而合规在财务、时间和社会资本方面可能是代价昂贵的。\n\n> 仅仅为了合规而合规在财务、时间和社会资本方面可能是代价昂贵的。\n\
  \n在这些情况下，安全团队确实可能将所有宝贵的资源用在了合规上。这通常是因为要求与实际风险不对等。这可能导致“勾选框心态”，即为了文档而牺牲安全性。\n\n此外，合规性要求可能非常僵化且会对业务运营产生干扰。如果处理不当，团队可能无法应对新威胁。\n\
  \n### 是否有框架可以将安全活动与监管合规性结合起来？\n\n目前存在许多框架，但它们往往难以跟上不断变化的威胁格局。关键在于建立一种基于风险的方法，根据组织的实际威胁和漏洞对合规要求进行优先级排序。\n\
  \n### 你使用什么策略向非技术决策者传达你所遇到的威胁？\n\n我发现，最好的方法是理解决策者的动机和语言。例如，决策者并不一定理解这一点：“我们应该在客户账户上强制执行\
  \ `2FA`，因为来自外部泄露的凭据填充攻击是获取账户访问的一种非常有效的方法。”\n\n\n\n\n然而，他们可能理解的是这一点：“我们的企业目标之一是减少高价值客户流失。客户离开的列出原因之一是对我们这家公司缺乏信任。如果我们能为他们的账户提供双重身份验证（2FA），我们就能直观地证明我们正在采取符合其利益的行为，并提高信任度。这反过来有助于减少流失。”\n\
  \n这种表述方式既兼顾了他们和公司的目标。这可以通过他们熟悉的指标（例如：流失率、客户评分、2FA 采用率）来衡量，而不是使用在他们看来是随意的“我们不会受到撞库填充攻击”，这种表述在措辞上更以客户为中心且更具市场性，尽管最终结果完全相同。\n\
  \n## 在发生重大持续事件期间，对于管理非技术高管的预期，你有什么建议？\n\n我坚信，与高管保持透明沟通是让他们感到满意以及防止直接参与事件响应的人员因频繁请求更新而受到干扰的关键。\n\
  \n我倾向的实现这一目标的方法包括以下内容：\n\n* 向高管发送定期的更新通报。这应该包含他们预计何时收到下一次沟通的时间。如果你不为下次沟通设定预期，你几乎注定会在某个时候收到“有新进展吗？”的邮件。\n\
  * 如果没有更新，也要告知他们没有更新。这样做可以防止那种“敲、敲、敲，这东西在运行吗？”的机械性回复。\n\n沟通内容应该包含他们感兴趣的信息。这可能包含极少的技术细节，更有可能侧重于：\
  \ SLA（服务水平协议）是否面临风险、是否需要进行面向客户的沟通、监管合规性是否存在风险、预计解决还需要多久、有多少人受影响，以及他们可以做些什么来支持响应人员。确保“沟通”是事件响应计划中一个定义的角色。\n\
  \n> 确保沟通是事件响应计划中一个定义的角色。\n\n这确保了将有专人负责确保更新的发生，并确保不同沟通之间的一致性。\n\n如果高管对事件有疑问，为他们提供一个单一联系点；这很可能是负责沟通的人员。这可以减少对埋头处理事件的人员的干扰，并让高管感到他们得到了预期的反馈。\n\
  \nWileyPRE\n\n# 9\n\nRonald Bushar\n\n![](img/c09uf001.png)\n\n> “蓝队是使用设备（武器/工具）、培训和组织原则来防御攻击者或敌人的‘士兵’。”\n\
  \n**Twitter:** [@Cobrakaii](https://twitter.com/Cobrakaii) • **网站:** [www.linkedin.com/in/rbushar](http://www.linkedin.com/in/rbushar)\n\
  \nRonald Bushar 的职业生涯始于美国空军，担任信息战攻击中队的军官。Bushar 先生是一位资深、高效且创新的网络安全领导者，在政府和商业部门的网络防御运营、网络安全咨询和事件响应服务方面拥有\
  \ 20 多年的经验。Bushar 先生拥有成功构建战略计划和动态团队的记录，提供创新的网络解决方案，确保有效的安全并最大限度地降低组织风险。\n\n目前，Bushar\
  \ 先生担任 FireEye 政府解决方案高级副总裁兼首席技术官。在该职位上，他领导着全球网络专家团队，提供 FireEye 独特的创新安全计划能力和解决方案平台，以保护全球关键任务、基础设施和国家安全利益。\n\
  \n在加入 FireEye 之前，Bushar 先生曾担任司法部安全运营中心（JSOC）局长，在那里，他领导了变革性工作，重新定义并重构了关键信息安全和网络防御运营能力。Bushar\
  \ 先生还担任部门的内部威胁计划经理以及国家内部威胁任务组的联系人。在之前的职位中，Bushar 曾在多个部门建立并领导了由网络防御操作员、事件响应人员和红队组成的专家团队。\n\
  \n## 你如何定义蓝队？\n\n对我而言，蓝队始终遵循演练和运营中的军事定义，即使用设备（武器/工具）、培训和组织原则的防御者。简单，蓝队防御攻击者、红队或“敌对力量”。这种定义跨越了所有领域/维度（陆、海、空、太空、网络、间谍等）。\n\
  \n再次，由于军事训练，我倾向于将这些定义严格地对齐到安全工程、工具、平台或应用程序的维护。这些功能是赋能、“组织、培训和装备”类型的功能。蓝队是使用设备（武器/工具）、培训和组织原则来防御攻击者或敌人的“士兵”。在此框架下，蓝队可以包括：SOC\
  \ 分析师、事件响应人员、威胁猎人、威胁情报分析师以及取证/恶意软件分析师。\n\n## 蓝队应该具备哪两种核心能力？\n\n蓝队应该非常擅长做两件事：\n\n\
  * 发现并修复被防御环境中的*任何*敌人。这是传统的告警/检测、审查、分析、识别以及协调/跨部门沟通。\n* 对敌人进行机动，以实现以下一个或多个结果，取决于组织的风险态势和功能：\n\
  \    * **拒绝 (Deny):** 在检测到侦察后阻止入侵者获取访问，或在初始入侵后进一步进入环境。修复系统，实施防火墙/代理/DNS 拦截等。\n \
  \   * **降低 (Degrade):** 实施额外的措施或控制以减缓攻击或使攻击行动对防御者变得可见。部署额外的 IOC，暴露恶意软件、C2、TTP，内部和/或外部。\n\
  \    * **中断 (Disrupt):** 尝试在生命周期的某个阶段停止某些攻击行动。拦截 C2，移除后门等。\n    * **欺骗 (Deceive):**\
  \ 这通常是一个更高级的功能，它是引导或限制攻击者进入受严格控制和观察的基础。这使防御者能够赢得时间，并更多地了解攻击者的 TTP、动机和意图，同时制定响应计划。\n\
  \    * **摧毁/修复 (Destroy/remediate):** 在此语境下，意味着完全停止并修复攻击。将攻击者赶出去，并尽可能防止或减少他们可能对组织造成的任何损害。\n\
  \n除了具备高水平执行这些功能的知识、技能、能力和工具外，蓝队还能够跨其他 IT 和安全团队以及关键组织利益相关者（通常定义为业务部门领导和其他核心业务部门，如财务、法律、人力资源、公关等）运作、协调和沟通。最好的蓝队在重大漏洞期间担任事件“指挥官”或“\
  \ quarterback”，在执行技术响应的同时提供关键的非技术事件处理功能。\n\n\n\n\n\n> 最优秀的蓝队在重大泄露事件期间充当事件“指挥官”或“四分卫”，在执行技术响应的同时，提供关键的非技术事件处理功能。\n\
  \n## 应急响应计划有哪些哪些核心优势？\n\n关键技术优势应包括以下内容（并非由单人承担，而是跨团队分布）：\n\n*   网络安全监控与分析\n*   威胁狩猎\n\
  *   网络威胁情报分析\n*   主机分析\n*   恶意软件分析\n*   磁盘取证分析\n*   安全日志分析\n*   安全事件协调/分析\n*   关键管理/领导力/“软”技能\n\
  *   书面沟通\n*   口头沟通/简报技巧\n*   规划/协调能力\n*   批判性思维/分析\n\n## 蓝队成员如何如何学习、实践和成长？\n\n热衷于磨练蓝队技能并在职业道路上不断成长的人员，应该专注于一个或多个关键功能领域的技术深度，并广泛接触模拟（演练）和真实世界的攻击。最简单的起点是在家里搭建一个网络防御/安全运营中心，使用开源工具（`Security\
  \ Onion` 是一个很好的起点）。在家里实践和学习既廉价又方便。\n\n正式培训（如 `SANs` 和 `Black Hat`）对于加速特定技术技能的掌握、学习以及建立行业和联系非常有帮助。许多蓝队成员的第一份工作是\
  \ 1 级 `SOC` 分析师。虽然这些职位可能非常辛苦，但你有机会看到并处理大量的此类事件。\n\n```\nif (condVar > someVal) {console.log(\"\
  xxx\")}\n```\n（注：提供的文本在后半部分包含了一些重复且碎片化的句子。我已根据指令保留了核心技术信息，并维护了要求的格式规则。）\n\n\n\n\n\
  \n然而必须理解的是，仅仅实施合规计划、仅采取最少控制措施，并关注审计结果和补救措施，永远无法带来稳健且成熟的安全能力。事实上，大多数合规计划甚至根本没有强制要求蓝队（blue\
  \ team）功能！我将合规视为基础元素，它们能确保组织免于监管和法律纠纷，并为更有效的安全能力提供起点。这种“打选框式安全”（Checkbox security）本身永远无法阻止攻击者。\n\
  \n## 是否有一个框架可以将蓝队所执行的活动或功能与监管合规要求对齐？\n\n`NIST Cybersecurity Framework`（NIST 网络安全框架）倾向于与蓝队功能良好对齐，特别是检测和响应领域。它现在被用作多项政府合规要求的依据，例如国防部的\
  \ `CUI` 保护和 `CMMC`。其他监管和合规体系也开始对齐 `NIST` 或类似的框架，这些框架将检测和响应（而不只是预防性控制）视为实现稳健防御能力的关键。纽约金融服务局（DFS）的网络安全法规就是一个最近例子。\n\
  \n## 如何让组织的所有不同部门以实现防御最大化？\n\n网络安全是一项团队运动。我们几年前将术语从 `information security`（信息安全）转向\
  \ `cyber`（网络），部分是为了承认这一领域不再局限于 IT 功能。当攻击发生时，会产生真实的物理、隐私、财务、安全和运营风险及影响。在当今大多数行业和全球大部分地区，网络风险跨越并影响组织考虑和计划的所有其他风险。网络防御者和蓝队面对的是真实的人，他们思考并以同样快或更快的速度做出反应。组织必须理解这些现实，并确保业务中的每位领导都支持关键决策和行动，否则防御者最终将失败，坏人获胜。\n\
  \n> 在当今大多数行业和全球大部分地区，网络风险跨越并影响组织考虑和计划的所有其他风险。\n\n我发现的参与非网络利益相关者的最佳方法，是用他们能理解的语言（法律、财务、隐私、客户满意度等）清晰地解释风险和潜在影响。由于业务和威胁不断变化，这是一项持续的工作。一旦建立了这种参与，你就必须向这些利益相关者每一个展示价值。你不能在不显示投资回报的情况下，要求资金或\
  \ IT 更改（这些会减慢他们的速度或让他们痛苦）或合规。这种回报必须为每个关键利益相关者量身定制，包括降低风险（用他们理解的语言）、带有安全信心的快速上市速度、在\
  \ IT 或应用程序规划中增加灵活性、节约或规避成本（罚款、损失、泄露成本）等。\n\n## 对于向非技术决策者传达你遇到的威胁，你使用哪些策略？\n\n我喜欢使用决策者由于其目前的职位或以往的经验而能够理解的类比。简单的物理犯罪类比（例如，银行抢劫犯）通常效果很好。清晰地阐述什么是现实、什么是电视/电影虚构也很重要。是的，攻击者确实可以在几秒钟内获取应用程序服务器的远程\
  \ shell。不，他们不能在几分钟内“攻破”防火墙并破解你的关键服务器。是的，我们可以（理想情况下）快速拦截 `C2` 流量，但不能，无法在 2 小时内收集并分析来自\
  \ 100,000 个系统的遥测数据。\n\n## 在重大持续事件期间，对于管理非技术高管的预期有什么建议？\n\n在任何事件期间，我遵循一些简单的原则，特别是那些影响巨大且处于公众或媒体关注的泄露事件。\n\
  \n*   **坚持事实：** 在没有准确信息支持分析的情况下做出假设或推测，几乎总是会导致错误，并可能对团队以及组织的信誉产生巨大影响。\n*   **快速行动但要有条理地思考和分析：**\
  \ 在所有危机中，尤其是敌人不可见的网络环境中，人们倾向于要求立即答案并同时关注太多的事情。许多组织会用竞争或矛盾的请求或指导迅速让他们的 IT 团队崩溃不堪。优先考虑数据收集、部署、拦截、系统和账户更改以及其他所有活动，并以资源最大化和延迟最小化的方式进行。事件发生之前的规划和练习是关键。\n\
  *   **在了解问题的全部范围之前尽量不要反应/响应：** 基于第一部分分析的膝跳反应就像在没有仪表的情况下在浓雾中降陆飞机；你可能会错过跑道。在决定完整的行动方案之前，留出时间进行进一步的数据收集、分析和验证。理想情况下，你的蓝队已经制定了一份稳健的\
  \ `IR`（应急响应）计划。\n\n\n\n\n问题在于，红队或敌人只需要找到一个开放的大门并溜过一名守卫即可。那么，我该如何定义蓝队呢？专业知识和警惕性。对无休止进攻的投入。与西西弗不同，我们并不是每天都在推巨石上山；我们是在阻挡大海。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n从个人层面来说，蓝队成员应该具备投入精神和警惕性。在技术层面，他们应该具备可视化数字地形的能力，就像游戏玩家可视化他们的数字领域那样，以便他们能够“看到”其多孔性。他们需要知道在哪里设置监控器，并准备好响应告警，但仅仅遵循一律认为的最佳实践或合规性要求可能并不完美适合你独特的环境，因此他们需要像看到城堡墙上松动的灰砂一样看到缝隙。\n\
  \n在大多数网络拓图中，我们使用不同的行业标准名称称呼各种分段，例如 `intranet`、`DMZ` 等。现实是，脏防火墙内部或企业边界内部的一切完全是同一件事——“对抗空间”（adversarial\
  \ space）——因为这是你在应对攻击者时将斗争的区域。只要你保持这种心态，你就处于蓝队的思维框架中。\n\n## 事件响应程序有哪些关键优势？\n\n与优秀的安全计划其他部分一样，其优势在于人、流程和工具。在人方面，假设他们具备正确的核心特质，关键在于培训。当事件发生时，会有压力。届那时，人们需要接受高度培训——接受培训以读取他们的\
  \ `SEIMs`、解释告警、判断何时真的是假报，或者何时攻击者正试图让他们产生模糊感或误导他们的注意力。当情况变得非常紧张时，培训就发挥了作用。服务器可能会宕机，经理可能会为了服务交付大叫。第一响应人员（不要误，他们非常像第一响应人员）接受过“断开”、隔离的培训，并让培训发挥作用。\n\
  \n接下来是流程，它们需要根据培训期间获得的教训进行设计和完善。需要建立流程来实时进行调查、制定方案、策略和缓解，并与管理层保持紧密的合作关系以获得批准并处理通信。\n\
  \n最后是工具。如果分析师没有告警，因为 `HIDS` 只报告给终端用户，或者没有 `NIDS`，那么最好的 IR（事件响应）也将处于未激活状态。\n\n##\
  \ 蓝队成员如何学习、实践和成长？\n\n正如我提到的，培训。这意味着要跟上新兴的威胁情报，并关注行业内工具的最新趋势和改进。\n\n> 仅仅因为你拥有 `Security+`\
  \ 证书并不意味着你不应该停止尝试获取 `CISSP`。\n\n他们需要不断挑战自我进行学习。仅仅因为你拥有 `Security+` 证书并不意味着你不应该尝试获取\
  \ `CISSP`。仅仅因为你是 `CISSP` 意味着你不应该去尝试 `CISSP-ISSEP`。\n\n从字面上挑战他们。模拟入侵和持久化的演习演练以及渗透测试将帮助他们磨练技能，并在情况变糟时为他们可以依靠的培训。\n\
  \n## 如何奖励优秀的蓝队工作？\n\n撇开所有的管理赞誉和达成 `KPIs` 可能获得的奖金，我认为优秀蓝队工作最大的回报之一是低压力的工作环境。当蓝队尽到职责时，真阳性（true\
  \ positives）应为零，假阳性应尽可能低，敏感数据保持保密，对可用性的贡献保持高水平。工作满意度始终是员工留的关键因素之一，其他工资、尊重、工作条件和福利。但现实是，奖金是消费品，会被接受、花费、遗忘。奖励只会落灰。\n\
  \n> 当蓝队尽到职责时，真阳性应为零，假阳性应尽可能低，敏感数据保持保密，对可用性的贡献保持高水平。\n\n每天来到运行良好、安全的环境并获得认可和尊重，此外还获得行业标准薪酬的员工，最可能留下来并投入努力继续改进自己和环境。\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护成功的信息安全计划？\n\n真阳性、假阳性、破解、已响应的事件、已缓解的威胁。\n\n- 如果攻击者绕过了所有防御且未被检测到，那就是真阳性。\n\
  - 如果攻击者绕过了所有防御且未被检测到，那就是假阳性。\n- 如果攻击者绕过了所有防御且未被检测到，那就是破解。\n- 如果攻击者绕过了所有防御且未被检测到，那就是已响应的事件。\n\
  - 如果攻击者绕过了所有防御且未被检测到，那就是已缓解的威胁。\n\n\n\n我们在 DMZ 中启用了蜜罐技术（honeypots）。如果配置不当或放置位置错误，某些蜜罐很容易被检测到并绕过。在\
  \ DMZ 或用户 VLAN 中部署一个名为 `Finance` 的服务器，会被任何已经突破了你防火墙或物理屏障的、自认为渗透测试人员或真实黑客所绕过，因此，我们使用\
  \ Web 或 `FTP` 配置了蜜罐，并将它们命名为某些即使在没有通过防火墙进行 NAT 的情况下通过反向 DNS 解析的实际名称。\n\n至于我们的检测手段，蜜罐确实充当了早期警报系统，表明“某些东西”扫描了它们并对其运行了枚举。这为我们提供了一个交叉检查，确认了\
  \ DMZ 中 `NIDS` 的有效性。例如，如果攻击者对数据包进行分片或乱发送，他们可能会绕过 `NIDS` 的触发，但由于蜜罐基本上是一个作为目标端进行重组数据包的\
  \ `HIDS`，网络入侵检测遗漏的内容将触发蜜罐上的主机入侵检测技术。关键在于设置一个实际上是诱饵或诱饵的蜜罐，使其看起来和行为都像一个真实的高价值目标。太多的通用现成（COTS）产品很容易被识别为诱饵并被攻击者快速绕过。\n\
  \n### 组织应该在何时使用加密？\n\n此类问题的正确答案是，你应该在合规性要求的地方使用加密。这是满足合规性能够很好良好安全态的领域之一。\n\n现实情况是，加密在今天无处不在，而且几乎没有许可费用，因此，问何时以及何时*不应该*使用加密可能更好。销售笔记本电脑可以使用\
  \ `BitLocker` 进行端点静态加密。大多数 `AV` 客户端都内置了 `VPN` 隧道，大多数小型 `SOHO` 路由器都有 `VPN` 客户端，因此即使是日常浏览时的简易传输中加密也是可用的。显然，任何存储敏感身份验证数据、账号数字或个人身份数据或\
  \ `HIPAA` 数据的地方，都会自动进行静态加密，可能在传输中也是如此的。\n\n所有通往企业交付的用于客户服务的 Web 接口隧道都应该使用强加密算法进行加密。\n\
  \n除了少数低风险的文件共享外，企业环境中目前真正无法使用加密的地方是工业控制环境。截至本文写作，我们最接近协议安全的是 `DLP3`，但它仍然没有给我们提供加密，只有循环冗余校验。\n\
  \n## 你如何处理数据治理以及减少数据足迹的其他方法？\n\n数据保留策略是策略工具箱中减少数据足迹最重要的文档。几乎无法期望或依赖终端用户社区来管理他们自己的数据。\n\
  \n> 几乎无法期望或依赖终端用户社区来管理他们自己的数据。\n\n大多数终端用户都是数字囤积者。如果有机会机会，大多数人会保存从远古时代起每一封发出的邮件，“只是以防万一”。我们都知道，我们必须在取证请求（discovery\
  \ motion）的潜在成本与通过电子通信轨迹提供可证明的辩护之间取得平衡。\n\n硬硬币的另一面是知道需要保存什么，这需要来自各个部门负责人和利益相关者的投入。例如，如果有一个最初用\
  \ `FoxPro` 编译的应用程序具有某些特定的业务逻辑，没有人能够对其进行反向工程，并且它代表了重大的收入流，那么必须对其进行考虑并赋值。\n\n## 你对合规性有什么看法？\n\
  \n> 几乎无法期望或依赖终端用户社区来管理他们自己的数据。\n\n大多数终端用户都是数字囤积者。如果有机会，大多数人会保存从远古时代起每一封发出的邮件，“只是以防万一”。我们都知道，我们必须在取证请求的潜在成本与通过电子通信轨迹提供可证明的辩护之间取得平衡。\n\
