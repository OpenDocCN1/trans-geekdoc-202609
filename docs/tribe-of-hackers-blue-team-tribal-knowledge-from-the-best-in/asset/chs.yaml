  \n\n\n\n\n\n\n\n\n\n\nWileyPRE\n\n# 致谢\n\n我想将这本书献给我的家人以及多年来帮助过我的所有人。你们知道自己是谁，我爱你们。\n\
  \n**—Marcus J. Carey**\n\n我要感谢我的朋友和家人做我的支持系统，并感谢 `Tribe of Hackers` 社区对我们使命的支持。我们完全不知道第一本书会带来什么样的反应，而现在我们有了一整个系列丛。我感谢\
  \ Wiley 团队与我们合作，让这些书成为现实。最后，感谢 Marcus 对我潜力的信任。没有你，我就不会在这里！\n\n**—Jennifer Jin**\n\
  \nWileyPRE\n\n# 前言\n\n我对你坦诚吧：我用荧光笔、折角以及铅笔和笔标记毁了第一本 `Tribe of Hackers`。交织职业和个人生活的\
  \ 14 个问题引发了具有启发性且引人深思的概念。得知它将成为一个系列时，我非常兴奋。`Tribe of Hackers` 系列是 `InfoSec` 社区中每个人都应该读过的丛。它展示了红队和蓝队的角色。\n\
  \n\n\n\n\n在我 20 多年的网络安全职业中，这一点一直如此。尽管某些工具和实践已经不再是有效的风险应对措施，但它们仍然存在。如果你向 100 名网络安全专业人士询问某些工具的有效性，得到的答案可能大同相同。\n\
  \n如果没有真实的测试和指标，谁知道什么是有效的？但无论如何，我们仍然在继续做着同样的事情。\n\n另一个老掉牙的经典格言出自奥托·冯·俾斯麦，他曾说过类似的话：“只有愚子才会从自己的错误中学习。智者从他人的错误中学习。”大多数蓝队成员都是“社会大学”的毕业生。\n\
  \n许多蓝队的职业生涯都是建立在通过试错来创建有效的安全模型之上。我启动 `Tribe of Hackers`（黑客部落）系列是为了让人们能够从其他专业人士见解中学习如何优化网络安全技术、流程和人员，以产生最大的影响力。\n\
  \n就像《Tribe of Hackers: Red Team》这本书一样，我们从社交媒体上收集问题。我们很高兴社区再次聚集在一起提出这些问题。我们出色的贡献者是网络安全领域的领导者，他们希望分享自己的部落知识。\n\
  \n知识共享是提高网络安全水平的关键。在我过去于情报部门工作时，就存在信息共享的问题。这个问题今天仍然存在，特别是在民用领域。\n\n我认为我们可以从医疗行业学习他们如何分享新疗法的教训。这对全球都有帮助。在网络安全领域，我们并没有在全球范围内共享信息。如果任何国家、人口群体等更容易受到易于缓解的攻击，我们都会输掉。我们应该像对待传染病爆发一样对待漏洞。\n\
  \n我想额外强调的另外一点是练习我们的技艺。我们需要在组织和技术层面练习我们的技艺。在公司和技术个人层面，我们必须保持敏锐。俗话得说：“熟能生工”。组织应该使用桌面演练（tabletop\
  \ exercises）来审查他们的网络安全和事件响应能力。桌面演练可以通过选择一个可能的入侵/事件场景并模拟公司将如何应对来进行。从高管到企业公关到技术人员，响应方案应该是众为人知的。\n\
  \n技术第一响应人员保持敏锐的另一种方法是参加培训和夺旗赛（`CTFs`）挑战。`CTFs` 是学习网络流量分析到逆向恶意软件等主题的有趣方式。这些技能将转化为个人和组织更好的防御能力。\n\
  \n所以，我的三个行动号召如下：\n\n*   不要再因为“我们一直是这么做的”而继续做同样的老事。尝试新事物，衡量它们，如果无效就停止。\n*   分享更多信息，因为这会让世界更安全。\n\
  *   最后，停止尝试重复轮子。找到那些执行过你正在尝试的策略的人并听取意见。不要陷入“没有人尝试解决这个问题”的困境，否则你将不得不陷入自己的死亡螺旋。\n\n\
  不要忘记，我们做的大多数事情并不关乎生死（除非它们确实关乎）。记住，我们蓝队在这里是为了帮助降低风险。就如何以安全的方式开展业务提供最好的建议，并保持推进。如果人们没有遵循你的建议，不要将其视为个人攻击。想象一下我的医生因为我不停止吃我喜爱的甜点就不跟我说话。当我们需要医生时，他们依然在那里。\n\
  \n保持警惕，并在人们需要捍卫他们的安全和隐私时随时出现。\n\n**Marcus J. Carey**\n\n## 问题\n\n就像我们的《Tribe Hackers\
  \ Red Team》这本书一样，我们向同事提了从社区收集的问题。以下推文没有特定顺序，它们提供了灵感：\n\n![](img/flast03uf001.png)![](img/flast03uf002.png)![](img/flast03uf003.png)![](img/flast03uf004.png)\n\
