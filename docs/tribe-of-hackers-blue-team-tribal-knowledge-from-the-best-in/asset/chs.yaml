  \n。。因此，蓝队的实践不仅包括设计和构建安全架构，还包括持续的运营、加固、监控，并在许多情况下对这些系统进行响应。这听起来很大吗？确实如此，这就是为什么蓝队可能是该领域最有成就感的角色。\n\
  \n## 蓝队应该具备哪些核心能力？\n\n只有两个？好的，接受挑战。\n\n我会说第一个是像红一样思考并像蓝一样行动。缓解所有风险是不可能的，这就是为什么蓝队需要做的最重要的事情之一就是学会权衡。每一天你都会面对许多可能要做的事情。所以，当你开始这一天时，你应该花时间调优这些噪音较大的\
  \ SIEM 规则吗？你应该编写事件响应采集脚本？进行数据发现实验以找出谁在笔记本上保留了未经许可的记录？或者，你更愿意在网络中寻找最新的 APT？你如何确定优先级？\n\
  \n> 缓解所有风险是不可能的，这就是为什么蓝队需要做的最重要的事情之一就是学会权衡。\n\n这个答案需要你像攻击者一样思考（红），同时像防御者一样行动（蓝）。例如，红思考意味着询问：“哪些威胁可能对组织产生影响？”而蓝行动则另一方面，需要理解网络、基础设施、应用程序、数据和业务架构的不同层级如何处理这些威胁，并知道哪些技术和非技术防御措施可以帮助你防御它们。采取这种心态会帮助你保持正轨，并帮助你专注于更高价值的任务。\n\
  \n第二个是平衡战略和战术愿景的能力。\n\n\n\n例如，当你看到攻击者活动的证据时，你会通过将活动拆解为不同的组件来对其进行分析，以更好地理解他们的行为。现在，你将进一步开展分析，对所使用的工具甚至可能的攻击者动机进行假设，寻找能够证明或反驳你假设的证据。最后，你将报告你的发现，综合你所发现的内容，并以业务人员和决策者能够理解的方式进行报告。在很多情况下，你可能还需要负责展示这些结果，因此能够说这种“战略性”语言——即业务语言，将使你与那些“只会”说比特和字节的人脱颖而出（尽管说十六进制仍然很酷，但别误会我）。\n\
  \n## 事件响应计划的一些关键优势是什么？\n\n毫无疑问，事件响应计划的核心优势之一在于“止血”的能力。然而，我们必须意识到这是 IR 的六个阶段之一：`遏制`。但其他五个阶段呢：准备、识别、根除、恢复和教训？这是几年前我咨询的一位客户的情况。在全美最大的城市之一，支持着近\
  \ 100,000 台系统，他们每天花费大量精力处理反复出现的感染、响应、遏制和根除，却很少关注这些事件发生的根本原因。在委员会会议上记录分钟、收集指标并重新镜像，但当我问：“有人对这些机器为什么被感染做过分析吗？”，得到的答案是：“我们不确定。”这就像生病了之后去看医生，只被开了些缓解症状的药物，而不是查看你为什么生病或底层问题是什么。同样，如果没有根源分析和数字取证等强大的\
  \ IR 能力，组织注定会不断重复导致安全违规的错误。\n\n### 蓝队成员如何学习、练习和成长？\n\n我是家庭实验室的忠实粉丝，因为这是在不破坏生产环境的情况下获得实践培训的最廉且最有效的方法之一。我知道在生产环境中玩玩可能更有趣，但让我们承认，玩运气并不适合所有人，而且也可能是限制职业发展的行为。\n\
  \n从职业生涯早期，我一直在做这件事，专注于练习我我比较薄弱的技能，并实施了后来我才知道被称为`刻意练习`（[tim.blog/2016/10/the-art-and-science-of-learning-anything-faster/](https://tim.blog/2016/10/the-art-and-science-of-learning-anything-faster/)）的工具。例如，我记得参加过（[www.sans.org/course/intrusion-detection-in-depth](https://www.sans.org/course/intrusion-detection-in-depth)）关于网络入侵分析的\
  \ SANS 课程，那是 12 年前了，我想：“哇，流量分析和入侵检测方面还有这么多需要学习的！”\n\n因此，我开始以一种重构我的家庭网络的方式，让我捕获所有出站流量，以便学习那些酷的\
  \ `tcpdump` 技巧（谁不喜欢位掩码和 BPF 过滤器呢？），以及练习更高级的 `Snort` 配置和规则。我对这个领域的新兴趣使我在当时工作的环境中引入了网络安全监控（NSM）传感器。当层看到这个\
  \ POC（概念验证）的价值时，我被允许部署更大的传感器网络，很快，我就获得了跨整个组织的可视性和高级检测能力。我在家的新爱好变成了工作中的成长机会。谁能想到年后我会向数百名学生教这门流量分析课程呢？\n\
  \n家庭实验室很有趣，今天的虚拟化技术使其比以往任何时候都更容易、更便宜，所以要好好利用它们。从零开始构建安全系统，学习操作系统的内部原理、对其进行加固、破坏它们、分析日志、捕获并分析流量、尝试\
  \ `Docker` 容器，并在博客中分享你的经验，让其他人从你的学习经验中受益。\n\n> 请不要害怕在工作中学习。\n\n请不要害怕在工作中学习。每天你都有学习、练习和成长的机会；你只需要识别并拥抱这些机会。归根结底，没有人知道一切，如果你已经全都知道，想想那将有多无聊！\n\
  \n## 你如何奖励出色的蓝队工作？\n\n我们都渴望被认可。这是人性的本能。当然，以合理的薪水和奖金形式表现的认可很重要。但当这些基础需求得到满足后，还有另一种奖励在某些情况下可能同样重要，甚至更为。\n\
  \n奖励蓝队成员的一种方法是给他们成长的机会，例如让他们参加会议和培训。我有机会在许多国际会议上演讲和教学，对此我感到荣幸，因为这代表了扩展蓝队同行网络并从他们的经验中学习的绝佳机会。因此，这是我鼓励每个人这样做来奖励你的蓝队的方法。许多会议提供网络防御靶场和演练，他们那里也可以以团队形式获得实践经验。当然，并不是所有人都能旅行，但仍有很多培训计划提供远程在线课程。\n\
  \n但让我们把这个想法更进一步。在管理蓝队时，对我一直非常有效的方法之一就是通过提交论文征稿（CFPs）来鼓励参与活动。这对于团队来说可以是一次奇妙且难忘的学习经历。如果有人在团队中太新，对公开演讲的想法感到畏缩，就鼓励他们和一位经验丰富的同事一起提交。或者，为什么不通过提议和她一起提交来提供帮助和指导呢？多年来，我有多次机会这样做，这是一种很有成就感的体验。\n\
  \n> 这种在管理蓝队时，对我一直非常有效的方法之一就是通过提交论文征稿（CFPs）来鼓励参与活动。\n\n即使在不可行的情况下，也有很多机会奖励良好的团队合作。例如，如果某人在调查期间表现非常出色，鼓励他们在下个月的“午餐学习会”上展示他们的工作发现，这样大家都能受益。几句真诚的感谢或小小的礼品卡也能让人们感到被重视，是团队中受器重的一员。这并不需要多少！\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护一个成功的信息安全计划？\n\n指标是安全领域的圣杯。我们处于对完美指标的持久追求中，但我们无法简单地找到它们！\n\
  \n\n\n\n问题所在在于，我们花费了太多时间制定与这些资产相关的计划。你还会开始自动化一些最常见的操作，例如创建工单或数据采集脚本，以从可疑系统中收集基础取证证据。你通过衡量此时的通知耗时间和修复时间来完成你的\
  \ 30 天目标，从而建立你的初始基准。\n\n> 没有可可见性，很难检测和调查威胁；而缺乏这些能力，也很难证明并获得改进安全基础设施所需的支持。\n\n在此之后，在最初的\
  \ 60 天内，你将仅关注监控关键和高风险警报，在执行这些警报的同时不断完善你的事件响应计划，通过从事件响应（IR）活动中总结的教训来提高管理层的意识，并衡量调查时长和恢复时间。\n\
  \n最后，你将完成初始的 90 天周期，分析并沟通从 IR 活动中总结的教训，识别改进点，并根据这些结果与业务目标之间的对齐情况来转型你的计划。\n\n根据我的经验，这些短周期计划运行得非常好，不仅适用于大型组织，也适用于需要快速证明价值的中小型企业。\n\
  \n## 性价比最高的安全控制措施是什么？\n\n我知道这听起来很无聊，但资产清单多年来一直是 `CIS` 前 20 项控制措施中的第一，这是有原因的（[www.cisecurity.org/controls/cis-controls-list](http://www.cisecurity.org/controls/cis-controls-list)）。说到底，你无法保护你不知道拥有的东西！相信我，这听起来比实际要容易。最好（或最糟）的一是……你永远无法完成这个项目。这是一项你必须持续工作。在主动方面，`Nmap`\
  \ 或任何其他网络扫描器可能是你最好的盟。自动化扫描无疑是正确的方向，例如将数据导出到像 `Elastic Stack` 这样的平台，以添加索引、搜索和报告功能。\n\
  \n但主动资产清单有局限性；这就是为什么用被动技术进行补充至关重要。为此，我非常喜欢 `Zeek`（以前称为 `Bro`），它可以在任何网络段生成类似 `NetFlow`\
  \ 的数据，以发现产生流量的设备及其 IP 和物理地址，并发现其他可用于设备指纹的元素（如用户代理和服务横幅 banner）。这些数据也可以输入同一个 `Elastic`\
  \ 引擎，以补充通过主动扫描获得的数据。\n\n\n\n\n我还可以再增加一个控制手段吗？可能是我最喜欢的控制手段莫过于代理。代理简直太棒了。作为正向代理或反向代理部署，这些技术允许你桥接连接，将其拆分为两个部分以便进行检查，控制数据流，并根据特定的应用程序策略允许或阻塞数据。例如，正向代理对于保护发往互联网的外出流量非常有帮助，既可以部署在本地也可以部署在远程（例如云端），而反向代理则可以通过某些\
  \ WAF 和负载均衡功能，保护多个 Web 服务器免受常见的 Web 应用攻击。但虽然它们是优秀的防御设备，大多数人仍然低估了代理在检测和威胁狩猎方面的价值！如果你不相信我，去获取你网络允许发往可疑域名的最新\
  \ 20 条连接报告，并检查这些端点。如果你仔细观察，我保证你会发现那些绕了你的防御技术并攻破这些系统的攻击证据。狩猎愉快！\n\n## 你的组织实施了任何欺骗技术吗？\n\
  \n多年来，我利用欺骗技术检测那些非常难以察觉的内容取得了巨大成功，特别是像横移动这样的战术。一旦攻击者进入内部网络，没有什么比放置巧妙的陷阱（tripwires）和红��鱼（red\
  \ herrings，例如蜜令牌 honey tokens）能提供更大的检测价值了。然而，我必须承认，我一直很难说服公司这是防御安全架构中不可或缺的元素。原因是法务部门（有时甚至是人力资源部门）完全不喜欢“欺骗”（deception）这个词。事实上，在企业环境中，你只要提到这个词，对话通常就结束了。原因是什么？有些人认为欺骗涉及诱导他人入侵系统，本质上是为了犯罪，没有任何法务团队会允许你在他们的系统上这样做。解决方案是什么？我来分享一个多次对我来说非常有效的小秘密。我称之为“伊斯斯梅尔的心灵大师之术”！准备好了吗？\n\
  \n关键在于改变你的呈现方式。是的，营销很重要！不要说你要部署一个蜜罐（honeypot）或任何其他欺骗技术，要说你要部署“预警系统”。我记得我曾为一个大客户提供咨询，他们无论任何情况下都不允许我部署蜜罐。在遭受事件后，他们要求我提出一种解决方案来增强他们对横移动的可见性和检测能力。我带着一份使用虚拟化和开源技术的部署预警系统的提案回到了他们那里。项目毫无问题地通过了！我们只是改变了名称。正如我常说的，行业利用营销来对付我们。现在是我们这些蓝队成员利用营销来为自己争取优势了。\n\
  \n> 正如我常说的，行业利用营销来对付我们。现在是我们这些蓝队成员利用营销来为自己争取优势了。\n\n### 组织应该在何时使用加密？\n\n加密可以是工具带上的一把强大武器，但如果不小心，它会让你受到伤害。\n\
  \n加密是为用户提供隐私的极佳工具，但它可能会让你的企业层 7 检测技术盲目。许多公司在下一代防火墙、IPS、IDS、应用代理和其他类型的层 7 检测工具上投入了大量资金，结果发现这些系统现在\
  \ 90% 是无效的，因为 90% 的流量都是 TLS 加密后的。为了让这些系统重新发挥作用，你应该采用某些 TLS 检查或 TLS 卸载，对需要检查的连接进行中间人攻击处理，以保护你的组织，例如发往外部的\
  \ HTTPS 流量。政治和隐私指令可能会阻止你完全实施这些控制，但至少你应该与管理层就此进行沟通以评估风险。\n\n另一方面，当敏感流量跨越不可信区域时，应该使用加密。在旧的基于边界的安全模型中，我们认为局域网是信任的，因此我们只对从远程系统到我们\
  \ VPN 集中器的流量进行加密，而在内部段的桌面到桌面通信中保持不加密。很清楚，这种模型已经不再适了，因为几乎每个设备都应该被视为不可信且可能具有敌意的，这正是“零信任”模型背后的哲学（[www.sans.org/webcasts/zero-trust-architecture-108795](http://www.sans.org/webcasts/zero-trust-architecture-108795)）。因此，需要平衡，特别是在考虑传输中加密时。尽可能为“可见性”进行架构设计。即使隐私指令获了胜，也要确保你通过利用\
  \ NetFlow 数据进行分析来获得所需的可见性。\n\n对于静态数据，加密始终应该被认为是缓解数据泄露影响的必要控制手段。但要意识到，这本质上只是一种物理控制，在使用在易丢失或被盗的设备上（如笔记本电脑、便携式硬盘、手机、平板电脑等）时效果会更有效。此外，工作站或服务器上的全盘加密可以防止攻击者使用像\
  \ Kon-Boot（[kon-boot.com](http://kon-boot.com)）这样的黑客工具启动这些系统并绕过认证。\n\n## 你如何处理数据治理以及减少数据足迹的方法？\n\
  \n我总是尝试遵循一种务实的方法来进行蓝队工作，在数据治理方面也是如此。对我来说，数据治理始于了解你所关心的数据存储在何处。相信我，假设它们永远不在本该待在的地方！为了做到这一点，特别是在我无法选择购买企业级数据发现或\
  \ DLP 解决方案的中小型环境中，我必须发挥创意。多年来，我一直成功地使用强大的 Yara 引擎（[virustotal.github.io/yara](http://virustotal.github.io/yara)）来实现此目的，通过自定义规则，搜索分布跨越数千个端点的静态特定数据，包括递归搜索磁盘中的目录，甚至是内存进程中的内容。我的开源项目\
  \ rastrea2r（[github.com/rastrea2r/rastrea2r](http://github.com/rastrea2r/rastrea2r)）提供了这一想法的可移植实现，可用于威胁狩猎、搜索\
  \ IOC 或数据发现等目的。\n\n一旦你找到了它们所在的位置，数据治理还关乎对数据进行分类。再次，数据分类并不是你作为蓝队成员能做的最令人兴奋的项目，但它在军事领域被使用了多年是有原因的：它有效！虽然许多人不知道，Microsoft\
  \ Windows 允许你通过文件分类基础设施（FCI）自动实现文件分类，而这可能已经包含在你已拥有的许可中（[techcommunity.microsoft.com/t5/storage-at-microsoft/file-classification-infrastructure-fci-classification-and-policy/ba-p/423879](http://techcommunity.microsoft.com/t5/storage-at-microsoft/file-classification-infrastructure-fci-classification-and-policy/ba-p/423879)）。这将允许你设置规则，根据位置或内容等因素自动对文件进行分类，并通过\
  \ PowerShell 进行管理。\n\n\n\n\n最后，数据治理要求在你的所有系统中执行这些策略。再次，许多组织会发现，利用他们环境中已有的东西，或者他们可能已经付过过的工具是有用的，例如微软的动态访问控制（DAC）；请参见\
  \ [technet.microsoft.com/en-us/library/dn408191](http://technet.microsoft.com/en-us/library/dn408191)\
  \ `(v=ws.11).aspx`。这可以根据用户和设备实施条件访问，但它允许你通过实施基于时间的限制来减少攻击面。例如，为什么用户 Bob 会在周日的下午或周一凌晨\
  \ 3 点访问这部分数据呢？配合 FCI，DAC 还可以允许你根据创建后 X 天、修改、最后访问或其他属性等条件，自动删除或移除已过期的数据。\n\n## 你对合规性有什么看法？\n\
  \n对我来说，合规性不是安全，而是安全的一个子集。合规是必要的，我认为甚至是一个关键的组成部分，但要提供有效的防御，这还远远不够。我认识的许多蓝队成员对合规性产生了这种反感，我不怪他们，因为许多组织似乎认为，信息安全就像在检查清单上勾掉一系列控制项一样简单。事实是，如果你知道如何利用它，合规性是可以帮助到你的。\n\
  \n> 事实是，如果你知道如何利用它，合规性是可以帮助到你的。\n\n例如，合规通常会提供你实施有效安全所需的预算。要做到这一点，要跳出控制项，去考虑涉及的安全原则。例如，进行定期的漏洞评估可以让你合规，但只有关注威胁和缓解影响才能真正让这个过程变得有效。你实现后者所需的工具可能与你为了合规所需的工具是同一种。区别在于你处理问题的心态以及你如何实施它。当你产生怀疑时，正如我常说的，要“红方”思考——像攻击者一样思考——以便采取“蓝方”行动。\n\
  \n记住，合规不是目标，但如果你能策略性地使用它，它就是很有用的。此外，合规不会让你变得安全，但如果你做出了正确的决策，设计、构建并维护具有防御性的安全架构，很有可能你也会变得合规。\n\
  \n### 是否有一个框架，可以将蓝队执行的活动或功能与监管合规要求对齐？\n\n我不认为有一个单一的框架或模型适用于所有人。首先，任何框架或模型始终是对一个更复杂的现实的简化表示。其次，没有哪个组织的文化是相同的，而且公司运营的国家等其他方面也会产生巨大差异。\n\
  \n尽管如此，在为全球范围内的公司提供了多年咨询经验后，我承认我是 `ISO 27000` 系列和 `NIST 网络安全框架（`NIST Cyber Security\
  \ Framework`）的忠实粉丝。我个人喜欢使用 `ISO 27001` 作为一个风险驱动的框架来建立信息安全管理体系（`ISMS`），然后在更具战术层面上使用\
  \ `ISO 27002` 控制措施和 `NIST CSF` 来映射技术控制。归结底，对我来说，这些仅仅是沟通工具。它们就像指标一样：使用任何能帮助你完成工作的工具即可。对于某些组织，特别是在美国，遵循由\
  \ `NIST`、`DISA`、`MITRE` 等美国机构创建的框架会更容易。另一方面，由 `ISO` 或 `ENISA`发布的框架和模型在欧洲可能更受欢迎。这些是手段，所以请选择任何能帮助你从高层获得支持以实施你的安全计划的工具。\n\
  \n## 你如何参与组织的所有不同部门以实现防御最大化？\n\n获得所有业务部门支持的很大一部分在于向他们解释为什么他们应该关注，并让他们尽早参与流程。通常，没有人喜欢收到一份从未向他们征求意见却要求他们遵守的策略，特别是当这将给他们和他们的团队带来更多负担时。\n\
  \n一种在不同大陆、项目项目和雇主中对我都非常有效的策略，是与所有涉及的业务部门组织培训课程。\n\n> 每个人都喜欢免费培训，特别是当培训内容与他们的日常工作相关并能帮助他们工作得更好时。\n\
  \n每个人都喜欢免费培训，特别是当培训内容与他们的日常工作相关并能帮助他们工作得更好时。在培训这些业务部门时，思考你需要传达的内容并简洁明了地表达出来。使用生动有趣且相关的故事来解释威胁是什么，并给他们参与的机会，分享他们对该事的意见和经验。当你这样做时，你将实现多个目标：\n\
  \n*   你最终与他们建立了关系，这种关系将有助于改进未来的沟通。\n*   他们最终理解了为什么安全对他们很重要，以及为什么他们应该关注它。\n\n这让你能够更好地理解你试图保护的业务，他们他们以特定的方式工作，以及为什么你可能需要具有适应性。\n\
  \n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\n这完全取决于我们使用的语言。面对现实吧，我们许多人从本质上都是极客。我们喜欢玩嗅探器、编写脚本、解剖十六进制载荷并分析内存转储，但这些内容很难转化给那些需要做战略性业务决策的人。\n\
  \n在向高管汇报内容之前，我经常问自己的最有力的问题之一是：我试图解决的问题是什么？这个人为什么要关心？一旦你确定了目标，接下来就要关注如何传递信息，以及如何格式化。问问自己，这些高管通常以什么格式消费数据？我发现图表是一种传达数据的有力方式，也是他们熟悉的格式。有些在线服务提供低成本甚至免费的模板。在谈到这一点时，我经常提到我最喜欢的书籍之一，以及蓝队的先驱之一克里夫·斯托尔（Cliff\
  \ Stoll）的《金丝雀蛋》（`The Cuckoo's Egg`（[www.amazon.com/Cuckoos-Egg-Tracking-Espionage/dp/1416507787](http://www.amazon.com/Cuckoos-Egg-Tracking-Espionage/dp/1416507787)）。在他最近的一次演讲中（[blog.ismaelvalenzuela.com/2018/10/11/intelligence-driven-defense-successfully-embedding-cyber-threat-intel-in-security-operations](http://blog.ismaelvalenzuela.com/2018/10/11/intelligence-driven-defense-successfully-embedding-cyber-threat-intel-in-security-operations)），他这样说道：\n\
  \n> 原始数据可能是枯燥的，但以说明行动与不行动成本的故事形式呈现时，它可以帮助你强化观点。\n\n### 对于在重大持续事件期间管理非技术高管的预期，你有什么建议？\n\
  \n首先，重要的是管理预期的时机不是房子着火、大家在危机中奔波的时候。与物理灾害一样，适当的事件指挥至关重要，而这最好提前计划。当规划薄弱或不充分时，在处理事件期间注定会出现沟通问题。\n\
  \n如果这无法实现，有几点是必须尽快传达的。\n\n\n\n\n\n# 事件响应最佳实践\n\n*   核心在于风险管理。执行高层与业务部门的协作对于确保快速遏制和减轻影响至关重要。确保他们理解自己对于成功事件响应（IR）计划的责任，并确保响应是协调的以避免进一步损害。\n\
  \n*   明确定义指挥链，并进行适当的交接。记住，决策应该是由业务驱动的，而非技术驱动，重点在于理解影响而非立即修复。高层领导应帮助平衡调查工作与影响评估。\n\
  \n*   确保业务部门理解，适当的响应需要适当的范围。如果没有对总威胁有`complete`的理解，响应将是无效的。范围不当和信号误读通常会导致修复不彻底，从而引发灾难。\n\
  \n*   考虑长期的响应或长期恢复。如果是某种针对性攻击，即使攻击被成功遏制和消除，攻击者也不会躲在角落里哭泣。确保业务部门理解攻击者很可能会回来。\n\n\
  *   公关、法律和合规性影响往往被忽视。不要忽略这些或其他任何通知要求。这些问题不应被推迟到事件后处理。\n\n*   根据受众的不同，通过高层简报和技术简报进行频繁沟通。一致且有效的沟通流程至关重要。应该要求定期召开事件状态会议，并将事件状态详细记录在安全的带外位置。所有关键团队都必须在通信链中，并且不要忘记敏感信息的通信任何时候都必须严格控制。\n\
  \n最后，不要急于下结论。使用竞争性假设分析（ACH）模型（[www.sans.org/cyber-security-summit/archives/file/summit-archive-1496695240.pdf](http://www.sans.org/cyber-security-summit/archives/file/summit-archive-1496695240.pdf））来开展调查工作，并确保始终追溯事件的根源，以持续改进您的安全态。\n\
  \nWileyPRE\n\n# 51: Dave Venable\n\n![](img/c51uf001.png)\n\n> “我倾向于将蓝队视为公司内部整个安全组织，从一线到首席信息安全官（CISO）。”\n\
  \n**Twitter:** [@davevenable](https://twitter.com/davevenable) • **网站:** [www.linkedin.com/in/dvenable](http://www.linkedin.com/in/dvenable)\n\
  \nDave Venable 曾是美国国家安全局的情报专家，在计算机网络利用、信息作战和密码学方面拥有丰富经验。Dave 开发并管理了多个支持全球反恐行动和全球反恐战争的美国国家项目，同时也为全球\
  \ 500 强企业提供安全咨询服务。\n\nDave 是信息安全领域的定期演讲者和作者，也是 Masergy 的网络安全副总裁。Dave 还担任南方梅德大学网络安全顾问委员会成员，并在那里教授安全。\n\
  \n## 你如何定义蓝队？\n\n我倾向于将蓝队视为公司内部整个安全组织，从一线到 CISO。诚然，在大多数人眼中，事件响应团队可能是蓝队的最前线，但只要你关注公司的安全，你就是蓝队的一员。\n\
  \n尽管如此，我区分安全角色和 IT 角色，即使那些 IT 角色可能承担某些安全功能。事实上，我不将网络安全视为一种 IT 专业化，而是视为一种安全专业化。根据我情报部门的背景，我们看到各种安全专业领域：物理、通信等。网络只是该领域内的另一个重点领域。\n\
  \n我总是喜欢使用的类比是观察建筑的安全性：你有保安员、监控报警系统的人员、测试和审计安全控制的人员等。这些都是安全角色。另一方面，还有负责建筑维护工作的人。这些不是安全角色，尽管他们可能会更换锁或为报警系统安装一些布线。我经常听到网络安全被视为\
  \ IT 内部的一个专业方向，但这就像将建筑安全视为建筑维护内部的一个专业方向一样是有缺陷的。它们完全是两个不同的领域。\n\n## 蓝队应该具备哪两个核心能力？\n\
  \n检测事件的能力和响应事件的能力。\n\n## 事件响应计划的一些核心优势？\n\n显然，检测和响应事件的技术能力是关键的，但实现这种能力的一个关键优势是安全团队能够有效地跨公司工作，并与他人紧密合作，在事件发生之前而非发生期间建立关系。\n\
  \n## 蓝队成员如何如何学习、实践和成长？\n\n在整个职业生涯中获得各种经验。确保参与不同类型的项目，与不同的人合作，并在不同的环境中工作。每个组织或公司都有其自己的办事方式，从不同的视角学习这些方法总是好的。这种感知的多样性将为你职业生涯后期提供更多见解并使你能够理解。这包括花时间在进攻方工作。\n\
  \n## 你如何奖励优秀的蓝队工作？\n\n以每个员工都关心的方式：休假、奖金和加薪。此外，我总是乐意让那些通过工作脱颖而出的团队成员参加高级培训，并指派他们负责优先级项目。\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护一个成功的信息安全计划？\n\n这本身就可以写一本书，但这确实是安全计划最核心的方面之一。正如俗说，被衡量的东西才重要。然而，你想保持足够简单，以便让执行高层和董事会中的非安全专家也能理解。\n\
  \n我建议在那个级别使用不超过五个指标，然后使用能力成熟度模型（CMM）来跟踪这些领域的成熟度。我开发了一个简单的成熟度模型，可以在 [davevenable.com/maturity](http://davevenable.com/maturity)\
  \ 下载。它跟踪安全计划在以下方面的成熟度：\n\n*   策略\n*   技术\n*   人为因素\n*   风险和漏洞管理\n*   支持\n\n## 如果你是基础设施原始的中小型企业唯一的信息安全人员，你会从哪里开始？\n\
  \n我首先会想要了解未来三年的业务目标，然后将其转化为安全需求，最后根据业务目标的优先级、安全计划的现状，以及哪些控制措施能在投入最少精力和钱的情况下获得最大效果对这些进行排序。\n\
  \n## 什么是性价比最高的安全控制措施？\n\n我会列出四个。\n\n\n\n\n\n*   **多因素身份验证：** 这一点显而易见。通过钓鱼获取用户账户访问权限是目前攻击的主要手段。\n\
  *   **防止密码重复使用的密码管理器：** 这与前一项的原理是相同的。\n*   **欺骗技术：** 这种技术成本低，且几乎零误报。\n*   **作为服务的\
  \ 24/7 SOC 监控：** 这比其他三项要贵，但外包 24/7 监控比建立一个 24/7 SOC、配置人员并留住合格的人要便宜得多。务必部署好传感器以检测跨内部网络的流量。\n\
  \n## 你的组织是否实施了任何欺骗技术？\n\n我是欺骗技术的粉丝，因为它廉价、易于维护（甚至可以把它忘在脑后），而且误报率极低。这是我在任何新环境中喜欢实施的首要事项之一。\n\
  \n## 组织应该在何处使用加密？\n\n任何可以使用的地方。在 `PRISM` 程序的一些细节披露之后（当时大型公司的内部通信受到了监控），我喜欢建议尽可能对数据进行加密，包括传输中数据和静态数据。\n\
  \n## 你对合规（Compliance）有什么看法？\n\n合规是一把双刃剑。如果你过度依赖它，或者更糟糕的是将合规与安全性混同一谈，它可能会导致你的失败。看看近年来，符合安全框架要求的组织中发生了多少重大数据泄露事件。\n\
  \n然而，没有什么能像合规在为你的安全计划争取支持、认可和资金那样有用了。它是安全工作的一个极佳的理由，特别是对于那些尚未理解其价值的组织。利用它的优势，但不要把它误认为是最终目标。\n\
  \n## 是否有某种框架可以将蓝队执行的活动或功能与监管合规要求对齐？\n\n从整体安全计划来说，有无数框架可以做到这一点。我倾向于选择目标框架（类似于 `ISO\
  \ 27002`、`NIST 800-53` 的子集或类似的），然后查看该框架中映射到“关键安全控制”（Critical Security Controls）的控制措施。然后我根据组织面临的现实风险以及实施缓解措施所需的精力和成本对这些控制措施进行优先级排序。这提供了一个相当客观的方法来观察应该优先实施哪些控制。\n\
  \n## 你如何参与组织的所有不同部门以实现防御最大化？\n\n根据我的经验，其关键是在事故发生*之前*与不同部门的领导建立并维护关系。我更倾向于提供咨询而非下达指令，并确保领导层理解我们是为了让他们的工作变得更轻松。\n\
  \n### 你使用什么策略向非技术决策者传达你所遇到的威胁？\n\n永远不要夸大。理解业务有时需要接受风险。如果你被看作是在夸大风险，那么在最关键的时刻你的信誉将会丧失。始终尝试保持务实和合理，在解释网络威胁时，我总是喜欢想出一个植根于物理世界的比喻。\n\
  \n## 在重大持续事件期间，你对管理非技术高管的预期有什么建议？\n\n向他们透明说明发生的情况，并保持足够的更新频率，让他们觉得不需要主动询问进度，但又不要频繁到让他们厌烦收到你的邮件。这有时是一个很难的平衡。如果你对某些事情不确定，在确定之前不要更新他们。\n\
  \n### WileyPRE\n\n# 52\n\n### Robert “TProphet” Walker\n\n![](img/c52uf001.png)\n\
  \n> “有些蓝队想要排他性。我的管理风格是激进包容的。如果你想提供帮助，欢迎加入团队！”\n\n**网站：** [www.linkedin.com/in/robertwa](http://www.linkedin.com/in/robertwa)\n\
  \nRobert Walker 是一位高级安全架构师。在 `Microsoft` 工作了 13 年（其中有 3 年在北京）并创立了 `PCPursuit`（其工作曾登上《纽约时报》首页）后，他被公共部门信息安全的独特挑战所吸引。Robert\
  \ 了业务、管理、信息安全和深厚的 IT 专业知识，使其成为业务和技术团队信赖的声音。在个人生活中，Robert 访问过所有大洲，并正致力于加入“旅行世纪俱乐部”（Traveler's\
  \ Century Club）。\n\n## 你如何定义蓝队？\n\n对我来说，这很简单：如果你在进行防御，你就在蓝队中，即使这不是你的主工作。有些蓝队想要排他性。我的管理风格是激进包容的。如果你想提供帮助，欢迎加入团队！\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n*   **影响力：** 蓝队所做的一切都始于人并终于于人。蓝队无法独自防御一切。他们需要对整个组织的业务和技术团队具有高度影响力，并确保\
  \ `InfoSec`（信息安全）一直是对话的一部分。\n*   **洞察力：** 最有效的蓝队成员能够快速合成来自不同来源的信息，并迅速发现哪些是重要的。这种洞察力通常来自经验，但新鲜视角也可以非常惊艳！\n\
  \n## 应急响应计划的一些关键优势是什么？\n\n从根本上避免事故总是好的。良好的信息安全卫生就是良好的 IT 卫生，这应该被尽力实践。应急响应是一个专业领域，因此外包这些服务可能是完全合适的。然而，寻找承包商的正确时机*不是*事故发生期间。请聘一家高质量的公司作为顾问。\n\
  \n拥有一个`current`最新的）且`tested`测试过的）应急响应计划是绝对成功的因素。遗憾的是，大多数组织在这方面的投入并不适当。\n\n*   一个好的计划会明确定义谁负责指挥、指挥地位于何处以及谁拥有哪些功能区域。如果你的计划里没有别的内容了，至少要有这些内容！\n\
  *   计划不应该只放在你的 `SharePoint` 上，因为如果勒索软件吃掉了你的 SharePoint 服务器，它将无法访问。一份老式的打印件是一个很好的选择。每当你测试计划时都要更新它。\n\
  \n应急响应团队快速响应的能力高度取决于准确的文档记录。然而，大多数系统的文档记录都很糟糕。\n\n*   详细说明参考架构以及系统和网络组件的`current`最新的制品构物是至关重要的。\n\
  *   一个准确的、最新的资产清单（服务器、虚拟机、容器、云实例、网络设备、备份等）以及`current`现有的升级联系人至关重要。你不想花钱让专业的应急响应承包商在你的数据中心四处跑，扫描条形码录入\
  \ Excel，并试图弄清楚谁拥有那台贴着“永远*不要*关机！”贴条的陈旧服务器。\n*   正在使用的系统和和服务账户清单以及分配的权限（这使得应急响应人员更容易发现未经授权的修改）。\n\
  \n### 蓝队成员如何学习、练习和成长？\n\n最好的蓝队成员是内在驱动的。成长的最好方法是什么？在该领域找到你强烈渴望改进的事情，然后去执行！帮助他人：担任志愿者、在会议上演讲、主持工作坊。你回馈得越多，别人回馈你的越多。\n\
  \n\n\n\n\n你具体是如何不进步、不成长的？通过各种认证计划并在你的名字后面加上一串字母，或者获得一个网络安全方面的硕士学位。这就像是厨师和主厨的区别：任何人都可以去烹饪学校学习如何遵循食谱，但主厨拥有天生的才华。\n\
  \n## 如何奖励优秀的蓝队防御（Blue Teaming）工作？\n\n蓝队成员是一个被严重低估的角色，因为蓝队表现得越出色，他们在公司其他部门的可见度往往就越低。奖励蓝队出色工作的最佳方式是信任他们、听取他们的意见、将他们视为业务的战略伙伴，并在尽可能遵循他们的建议。对他们来说，这比一张\
  \ 5 美元的星巴克礼品卡意义得多。\n\n> 给你的蓝队提供公平的薪水，不要让他们先去面试并拿到另一个录取。\n\n给你的蓝队提供公平的薪水，不要让他们先去面试并拿到另一个录取。只需跟踪市场的中位数水平或更高水平，并每年自动匹配。是的，我知道薪资压缩是你\
  \ MBA 课程中的一个 HR 模块，但信息安全人士精通这一点。这是一个小而紧密的社区，工程师们经常与同行交流。当他们的薪水低于市场水平时，他们会直接离开，而不是玩弄游戏。\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护一个成功的信息安全计划？\n\n答案很大程度上“视情况而定”。从你的威胁模型开始，考虑最重要的风险因素。按优先级进行堆叠，并构建相应的监测工具进行衡量。\n\
  \n企业喜欢对每件事都进行量化衡量。然而，信息安全中并非所有事情都能容易量化。你不能总是等待数据来做决策，而且每个组织都有盲点。数据应该是决策过程中的一个元素，但不是唯一的元素。\n\
  \n尽管如此，未补丁的系统、配置错误和被攻击的账户是大多数安全漏洞的根源。对未补丁系统建立明确的责任制有助于推动有关缓解措施的讨论。账户维护和配置管理也是如此。\n\
  \n## 如果你是一个安全基础设施原始的中小型企业唯一的信息安全人员，你会从哪里开始？\n\n我会从开发和测试组织开始，与他们合作实施实施安全开发生命周期（`SDLC`）。良好的参考架构、合理的开发模式以及（最重要的是）现代框架可以掩盖许多安全漏洞。潜在的安全问题越能向上游推进并在设计和代码中缓解，这些缓解措施通常就越容易、越便宜。\n\
  \n## 性价比最高的安全控制措施是什么？\n\n按计划打补丁，不找借口。补丁经过了供应商的广泛测试，在任何组织中，补丁导致任何问题是非常罕见的（记住，补丁本身必须有一个\
  \ bug，且该 bug 必须产生阻塞影响才会导致任何实际问题）。超过一半的漏洞始于未补丁的系统。在大多数组织中，这是最好/最廉价的安全投资回报率（ROI）。是的，偶尔会有\
  \ bug——但这就是存在回滚功能的原因。你有这个功能，对吧？\n\n## 组织应该在何处使用加密？\n\n无处不在。但认真，无处不在。原因如下：你应该假设你企业中任何信息系统的任何组件都可能被攻破。一个对信息存储和检索采取分层方法的架构，在每个阶段都进行加密，即使单个组件被攻破，仍然可以保护敏感数据。以前构建这样的东西要困难得多，但现代工具和框架通常内置了加密功能。这就是将安全向上推到架构和开发模式，并与开发团队紧密合作可以真正获得回报的地方。\n\
  \n## 你如何处理数据治理以及减少数据足迹的其他方法？\n\n产品管理团队与安全团队之间应该存在健康的紧张关系，产品管理团队想要收集任何可能有用的数据，而安全团队应该尽可能少地收集数据。这是一种谈判，通常的结果是只收集具有特定、当前业务理由支持的数据。\n\
  \n## 你对合规性（Compliance）有什么看法？\n\n它是一个实用的工具，但经常与安全混淆，而两者并不是一回事。\n\n## 是否有一个框架可以将蓝队执行的活动或功能与监管合规要求对齐？\n\
  \n当然，你可能找到一个既能顾鱼又能自行车的框架，但它有用吗？能实现什么目标？对我来说，合规性和安全是独立的业务职能。它们松地相关，安全评审甚至可以作为部署流水线中的一个有用关口，以确保满足合规性要求，但这两项活动在并行轨道上运行，应该涉及不同的员工。毕竟，合规性也监管安全团队的活动！\n\
  \n## 你如何参与组织的所有不同部门以实现防御最大化？\n\n“说话要轻，大棒要硬”。安全领导力从顶层开始，因此为了获得进展，获得高层支持应该是首要任务；这是我的方法。如果你理解高管层使用的工具和决策流程，你将更好地准备好利用它们。重要的不仅是获得一个通用的支持声明，而是要被整合到组织的高级报告流程中，一直到他们审查的每周仪表板。没有人想成为任何具有高层高管可见性的倡议的阻碍，每个人都希望在具有高管可见性的倡议中成为英雄。这完全改变了对话的内容。\n\
  \n> 安全领导力从顶层开始，因此为了获得进展，获得高层支持应该是首要任务；这是我的方法。\n\n要保持在高管可见的范围之内并不是容易的。要做到这一点，你需要被视为业务的战略伙伴，代表一个经常需要执行级审查的关键业务领域。\n\
  \n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\n对于业务决策者来说，信息安全决策主要是风险决策。它们使用风险框架进行评估和评分。一个关键问题是，高管往往会尝试将项目风险框架应用于信息安全风险。这几乎会将风险压缩到低于其应有的类别。使用更合适的框架（如\
  \ `FAIR`）并确保业务拥有适当的背景信息是很好的策略。\n\n我在 MBA 学到的技能确实有助于与高管进行有效沟通，因为我理解他们思考的业务背景，并且能说他们的语言。虽然我不建议你跑出去去读一个\
  \ MBA，但我建议你查看课程内容（可以免费获取），并学习一些工具和技术。\n\n\n\n\n我从不情绪化——*绝不*。我的工作是确保业务在做出决策时拥有适当的背景。当然，我有建议，但我并不总是能得到我想要的。业务决策者优先考虑其他事情并不是错误或愚蠢；当决策达到我所运作的水平时（这也是每个安全专业人士都希望所处的水平），这些决策并不总是轻而易举的或显而易见的。完美不是好的敌人，所以只要风险被记录、业务部门完全理解并接受了它，我觉得我就做得很好了——即使某项安全倡议被推迟了。\n\
  \n## 在重大持续事件期间，对于管理非技术高管的预期你有什么建议？\n\n第一也是最重要的一点是建立信任并确指挥权。业务部门的人很容易陷入恐慌并开始向不同的方向发展。领导层应该采取以下措施：\n\
  \n*   承认事件发生\n*   解释行动计划正在制定中\n*   告知人员何时会听到下次消息\n\n始终准备好一段战斗动员：“好消息是，这只是一个计算机事故。没有人死亡。从统计学上来说，胜算在我们这边。我们有组织中最优秀的人正在处理此事，我们正在执行计划，明天太阳照样升起。”\n\
  \n确保业务优先事项被充分理解，并对业务愿意接受的权衡有所感知。\n\n帮助高管理解风险可能是什么、哪些可能不是，以及哪些是未知的。确保他们理解事件是瞬息万变的，早期信息并不总是正确的，因此他们应该做好准备，信息可能会根据发现的事实而改变。高管通常欣赏坦诚和透明。\n\
  \n高管可能会询问关键的业务问题，并要求对影响给出置信水平。在某些领域说“现在知道还太早”是合理的，只要你不推卸*所有*问题即可。在后台，他们会有业务分析师利用这些信息建立模型并模拟结果，以便他们尝试理解最好和最坏的情景。\n\
  \n如果可能涉及法律情况，确保你的组织总法务已参与并让高管完全知情。在最初几次会议中让法律部门通常是一个好主意，因为在快速发展的事件中，需要他们审查的证据可能会浮现。\n\
  \n确保高管们知道他们要做什么是重要的，哪些现在没有帮助，你将在何时以及何种频率提供状态，以及联系谁获取信息。\n\n*   激活事件响应计划，并释放所需的所有应急资金。\n\
  *   根据需要激活承包商资源（已约定的）。\n*   明确现在谁或什么该错并不重要。不应该把时间花在上面；这些时间本可以花在解决问题上。之后会有回顾会议。\n\
  \n如果你说，“我们需要向 SOC（安全运营中心）持续供应披萨”，这*完全*可以实现！真的，不要害于要求任何执行助理可以实现的请求，以保持你的团队动力充足、驻守现场并高效工作。\n\
  \n理解高管们也管理着许多群体——董事会、潜在的媒体、客户和其他利益相关者。他们面临着巨大的压力，所以尊重这一点。\n\n这些群体每一个都想确切知道发生了什么、影响的细节以及你的后续步骤。在事件发生初期，这恰恰是你不知道的。\n\
  \n确保高管们知道他们将如何以及以什么频率获取更新。在事实被揭露的过程中，起初可能需要更频繁的频率，但要争取尽可能降低更新频率，以让你的团队专注于解决问题，而不是提供状态。\n\
  \n如果不进行专门制止，来自组织各处的项目管理团队将围攻事件响应团队寻求不断的状态更新，并在此消耗大量的工程时间。高管可以通过集中所有报告来提供帮助，这是你应该提出的特定请求。\n\
  \nWileyPRE\n\n# 53\n\nJake Williams\n\n![](img/c53uf001.png)\n\n> “蓝队并不负责实际实施安全配置控制（那是系统管理员的工作），但他们会对系统管理员可能漏掉配置更改提出建议。”\n\
  \n**Twitter:** [@MalwareJake](https://twitter.com/MalwareJake) • **Website:** [www.renditioninfosec.com](http://www.renditioninfosec.com)\n\
  \nJake Williams 是一位成就卓越的安全专业人士，拥有近二十年的经验。在美国情报界度过了十多年后，Jake 创立了 Rendition Infsec，他在那里领导着一个专业团队，执行对手模拟、事件响应、恶意软件反向工程、取证调查和漏洞开发。\n\
  \n## 你如何定义蓝队？\n\n蓝队是组织防御任务的核心。蓝队并不负责实际实施安全配置控制（那是系统管理员的工作），但他们会对系统管理员可能漏掉配置更改提出建议。\n\
  \n此外，蓝队还帮助为 SOC 即将检测的特定威胁提供策略支持。虽然 SOC 通常负责编写自己的关联规则，但蓝队确保了适当的日志源可用。\n\n## 蓝队应该具备哪些核心能力？\n\
  \n很难将其限制为仅两项，但如果我们正在玩“蓝队幸存者”，我不会投票投出岛屿的两项能力是指标扫描（indicator sweeps）和全网络安全监控（包括东西向\
  \ NetFlow）。\n\n执行失陷指标（`IOC`）扫描的能力对于任何蓝队行动都至关重要。这是实现狩猎行动的关键能力。网络安全监控（`NSM`）解决方案通常只部署南北向（从内部到外部）的。虽然这是所有部署的开始方式，但东西向（内部网络通信）是发现网络内部威胁和攻击者的巨大推动因素。\n\
  \n## 事件响应计划有哪些一些核心优势？\n\n除了“准备好将攻击者排出网络”这个显而易见的答案外，我将事件响应计划视为决策支持工具。事件响应计划为决策者提供了所需的数据，以便在事件发生时回答客户和监管机构的查询。计划的存在（以及某种程度上计划的成熟度）表明组织对安全有所承诺，并准备好应对事件。\n\
  \n## 蓝队人员如何学习、实践和成长？\n\n人脉、人脉、人脉。这是最重要的。在任何组织中，都很容易陷入隧道视野。参加网络研讨会，参加会议，学习别人在做什么。蓝队所能做的最糟糕的事情就是浪费资源去规划昨天的威胁，而不是处理今天的威胁。社区中的人们之间分享了大量关于他们在做什么、如何狩猎等的惊人信息。蓝队人员可以通过建立人脉获取这些知识，并成为组织的力量倍增器。\n\
  \n## 如何奖励优秀的蓝队工作？\n\n\n\n\n\n这非常困难，但我们会尽可能强调团队的胜利成果（例如，在威胁狩猎期间发现攻击者）。现实情况是，蓝队的工作并不酷（不像传统意义上的红队工作那样），而且人们往往对胜利做出了贡献，但却不是胜利的“脸面人物”。为了帮助这一点，我们会作为一个团队进行庆祝，并传达整个团队在确保获胜方面表现得有多出色。\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护一个成功的信息安全计划？\n\n蓝队的指标很难衡量。在威胁狩猎计划的背景下，你可以强调任何检测到的威胁。然而，这里的危险之处在于，当没有检测到威胁时，该计划看起来价值就较小。相反，我们建议测量用于威胁扫描的资产数量，以证明无论是否有检测结果，活动都在进行。\n\
  \n在事件响应方面，我们努力展示事件响应计划的改进。每当我们能够为利益相关者回答 12 个月前无法回答的问题时，就会强调这一事实，为计划的改进提供具体的实例。\n\
  \n## 如果你是一家安全基础设施简陋的中小型企业中唯一的信息安全人员，你会从哪里开始？\n\n从零开始构建安全的一个基础性要素是可见性。获取可见性的最快方法是部署\
  \ `SIEM`，但许多小型公司并没有足够的预算。在这种情况下，我建议优先考虑日志记录和保留。重新利用一台旧服务器或工作站并填满驱动器槽。然后在关键服务器上部署\
  \ `Winlogbeat` 或 `syslog forwarder`，将日志发送到临时的 `SIEM`。`SOF-ELK` 发行版是搜索这些数据的极佳方法（尽管如果不经过大量的调优，你不会将其误认为是商业级\
  \ `SIEM`）。\n\n你可以立即采取的让以后生活得更轻松的事情，是增加所有工作站和服务器上的事件日志大小。大多数设备都有大量的空闲空间，而且没有哪个调查员曾说过：“我该用这些日志做什么什么？！”同时也开启进程审计，你的调查工作将像读书一样轻松。\n\
  \n## 性价比最高的安全控制措施是什么？\n\n这在很大程度上取决于安全计划的成熟度。如果计划相对不成熟且没有 `SIEM`，那是我的第一步。如果团队已经有了\
  \ `SIEM`，他们需要快速实施 `EDR`。之后，我正在寻找 `NetFlow` 和 `DNS monitoring`。所有这些都是任何安全计划的极佳补充，将为蓝队提供巨大的价值，但也可用于排排除\
  \ IT 运营问题。强调使用安全工具来检测和响应运营问题，是获得 IT 部门支持的极佳方法（在某些情况下可以让他们分担部分部署工具的财务负担）。\n\n## 你的组织是否实施了任何欺骗技术？\n\
  \n我们在自己的网络和客户的网络中都使用了欺骗技术。欺骗技术是一个很棒的助力，但它们应该始终被视为一种次要检测技术。很多时候，`CISOs` 追逐最新的热词，而不是在安全控制措施方面做出更明智的决策。欺骗技术应该只被视为在主检测技术失效时使用的安全网。\n\
  \n## 你如何处理数据治理以及减少数据足迹的其他方法？\n\n虽然数据显然是检测的推动器，但如果组织不拥有它，它也可能成为一种负担。相反，我们建议测量用于威胁扫描的资产数量，以证明无论是否有检测结果，活动都在进行。在事件响应方面，我们努力展示事件响应计划的改进。每当我们能够为利益相关者回答\
  \ 12 个月前无法回答的问题时，就会强调这一事实，为计划的改进提供具体的实例。\n\n虽然数据显然是检测的推动器，但如果组织不拥有它，它也可能成为一种负担。相反，我们建议测量用于威胁扫描的资产数量，以证明无论是否有检测结果，活动都在进行。在事件响应方面，我们努力展示事件响应计划的改进。每当我们能够为利益相关者回答\
  \ 12 个月前无法回答的问题时，就会强调这一事实，为计划的改进提供具体的实例。\n\n## 你对合规性有什么看法？\n\n唉，`compliance` 这个词。合规性很重要，但许多组织认为合规性等同于安全性。实现合规性是迈向安全性的积极一步，但我们绝不应该认为实现合规就意味着组织是安全的。\n\
  \n## 是否有一个框架可以将蓝队所执行的活动与监管要求对齐？\n\n我是 `CIS 20 Critical Controls` (`CSCs`) 的忠粉丝，将其作为优先部署安全控制措施的一种。然而，许多组织需要与\
  \ `NIST CSF`、`PCI` 或框架对齐。我总是建议组织查看 James 和 Keli 提供的 `CSCs` 与其他框架之间的免费对照表（[www.auditscripts.com/download/2742/](http://www.auditscripts.com/download/2742/)）。\n\
  \n## 你如何组织组织的所有不同部门以实现防御最大化？\n\n这真的从高层开始，一种文化转变，即安全是每个人的责任。将安全团队之外的人员引入防御任务，最大的影响是系统管理员引入安全思维的时候。\n\
  \n\n\n\n\n我总是解释说，重大事件需要大量时间来解决，这不会立即发生。我经常用像 `CSI: Cyber` 这样的犯罪剧集来类比，并指出虽然 LL Cool\
  \ J 可以在一小时内调查案件并用手枪抽打嫌疑人，但我不能。然后我通常会说，如果他们想要那种服务，也许他们应该找 Ted Danson。这通常会引起大笑（即使在压力巨大的时期），并让大家达成共识：我们的调查工作面临着一条艰难的路要走。\n\
  \n> 我经常用像 `CSI: Cyber` 这样的犯罪剧集来类比，并指出虽然 LL Cool J 可以在一小时内调查案件并用手枪抽打嫌疑人，但我不能。\n\n\
  我们做的另一件事是在报告中明确下一次沟通发生的时间，以及他们应该从该沟通中期待什么。如果你发送了晨间状态报告，但之后没有发送任何其他内容，那么到下午 2 点，决策者的询问就会接踵而来。但如果你告诉他们，下一次计划的沟通将在下午\
  \ 4 点进行，并将包含对我们在早上 7 点收到的 `NetFlow` 数据中横向移动的评估，那么（根据我们的经验）他们更有可能耐心等待。\n\n# WileyPRE\n\
  \n## 54\n\n## Robert Willis\n\n![](img/c54uf001.png)\n\n> “简而言之，蓝队通过各种控制措施防御组织并对恶意活动做出反应，努力在尽可能保护组织的同时，具备应对最坏情况的知识，以便进行妥善的封锁和恢复。”\n\
  \n**Twitter:** [@rej\\_ex](https://twitter.com/rej_ex) • **网站:** [www.linkedin.com/in/blueteam](http://www.linkedin.com/in/blueteam)\n\
  \nRobert Willis 是 `1337 Inc.` 的一名安全顾问。他拥有管理学学士学位，并获得斯坦福大学、美国空军（USAF）、国土安全部（DHS）、CompTIA、EC-Council、ELS\
  \ 以及其他其他组织的 IT 和安全认证。他于 20 世纪 90 年代后期在 AOL 上开始了编程和黑客之旅。Robert 目前在德克萨斯州卫兵役，在德克萨斯州奥斯汀的\
  \ Mabry 营从事网络安全工作。Robert 最近因其网络安全工作荣获德克萨斯荣誉勋章。\n\n## 你如何定义蓝队？\n\n蓝队成员是安全专业人员，负责准备和保护组织免受恶意攻击者的侵害。蓝队可以专长许多不同的角色，从管理主动防御措施到响应事件——一直到整个识别和恢复过程。简而言之，蓝队通过各种控制措施防御组织并对恶意活动做出反应，努力在尽可能保护组织的同时，具备应对最坏情况的知识，以便进行妥善的封锁和恢复。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n加固系统、维护安全堆栈、分析流量以及能够对恶意活动做出响应并恢复是蓝队的一些核心功能。蓝队是组织的防守者；他们必须维护其安全计划以主动应对可能的威胁，同时能够修复问题。\n\
  \n蓝队成员应该定期修补系统，维护一个配置适当（且经过测试）的安全堆栈以进行保护和检测，并能够分析流量，同时准备好用适当的响应应对恶意活动。事件发生后，应该始终将教训加入到定期测试的计划中。\n\
  \n### 事件响应计划有哪些哪些关键优势？\n\n拥有事件响应计划的几个关键优势是减少事件发生时的混乱和停机时间。如果组织按照建议实践执行其计划，该计划将每年接受测试，并结合教训以使其变得更加有效高效。个人在实际事件发生之前就会知道自己的角色和被期望的任务，这将使得任务和团队管理方面的恢复过程变得更加精简。\n\
  \n### 蓝队成员如何学习、练习和成长？\n\n研究行业认可机构的认证路径是一种非常明智的学习方式。尽管一些人认为认证不能证明现实世界的知识和经验，但你所学习的材料提供了对相关主题的大量接触，这让想要进一步“深入下兔子洞”的人能够自己进行更深层次的实践。多年来，我许多成功的朋友都是根据他们想要追求的认证来设定学习目标的。这是一个制定自学大纲的极佳方法。\n\
  \n许多网站为蓝队成员提供了供练习的实验室。有很多免费或低成本的优质资源。我发现成长的一种好方法是让自己处于同样对 `InfoSec` 充满热情的人周围。参加会议，登录\
  \ `Twitter`，关注发布新发现漏洞的人（包括红队和蓝队成员）。阅读关于领域内见解的开放讨论可以提供丰富的知识财富。\n\n### 你如何奖励工作？\n\n\
  良好的工作应该像行业内其他一样得到奖励：通过激励。我认为这是一个管理问题，可以被问为：“你如何让员工快乐，特别是当他们供不应求时？”激励应该包括休假和加薪。我会说激励应该包括参加会议（费用报销）和认证，但这些是公司本应该提供的。\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护成功的信息安全计划？\n\n指标应该是特定的、可衡量的、可实现的、相关的且有时限的（SMART）。对于指标来说，有一个基准进行分析是有关重要的。指标可以涉及从衡量流程改进到跟踪系统修复的所有内容。测试响应计划和钓鱼测试结果可以提供有关改进的信息。\n\
  \n### 如果你是一个拥有原始安全基础设施的中小型企业的唯一信息安全人员，你会从哪里开始？\n\n如果安全基础设施目前处于原始状态，显然需要提升到良好的成熟水平。在中小型企业中，建立安全计划（我喜欢使用\
  \ `NIST 网络安全框架`）以创建适当的安全系统工程指南至关重要。这不仅有助于将需要做的工作与当前的实践联系起来（如果你是根据接受的框架制定政策），还能解决随着公司增长由于缺乏既定政策或指南而可能产生的许多问题。\n\
  \n在许多现实案例中，最大的威胁可能是一个没有经过良好培训的员工无意中损害了他们的组织。确保基础设施的安全是按照政策设置的，但同时也要确保个人不会利用他们现有的权限做出让安全从业人员感到无奈的行为。仅仅设置防火墙、`IDS/IPS`、`SIEM`\
  \ 和 `DLP` 是是不够的，如果一个已经拥有权限的个人是最大的威胁。\n\n**性价比最高的安全控制是什么？**\n\n\n\n\n打补丁是免费的，而且能解决很多问题。并不意外的是会有“补丁周二”（Patch\
  \ Tuesday），而第二天就是“漏洞利用周三”（Exploit Wednesday），新发布的漏洞信息会被用来攻击目标。我曾参与过一些非常大的事件响应，如果系统及时打了补丁，这些事件本是可以轻易避免的。\n\
  \n我认为对于小型公司来说，备份是非常廉的。我见过几家公司遭受了勒索软件的打击，如果他们有备份，恢复情况会好得多。\n\n## 贵组织是否实施了任何欺骗技术？\n\
  \n这绝对是一个关于“蜜罐”（honeypot）的问题——蜜罐是一种用于诱捕攻击者进入的诱饵设置。我接触过蜜罐，它们对于收集数据以理解攻击者正在创建的方法和流量非常有帮助，但确保设置蜜罐对于客户目前的成熟度来说确实是必要的至关重要。我之所以这么说，是因为蜜罐可能是潜在客户提出的要求，但在很多情况下，我发现客户目前的网络可能非常不成熟，在设置诱饵之前，他们需要专注于修复自己的问题。在那个阶段，一个脆弱的诱饵只是网络上众多可选漏洞机器中的之一。\n\
  \n如果你是一个成熟的组织，蜜罐是收集和分析信息的绝佳工具，可以观察实际攻击者正尝试做什么（以及他们是如何尝试的）。这些信息可以用于与蓝队的简报，并准确定要特别查找的活动（特别是当攻击者试图使用高级战术来规避检测时）。\n\
  \n### 组织应该在何时使用加密？\n\n组织应该首先建立数据分类策略，以识别和分类不同类型的数据。这有助于组织理解什么类型的数据最敏感，并开始采取措施保护这些数据，从最敏感到最不敏感。你应该考虑数据是如何被访问/使用的（静态数据与传输中数据）以及当前的数据可见性（例如面向公众的数据）。所有个人身份（PII）和敏感数据都应该加密。事实上，组织应该尝试加密尽可能的数据；某些数据在某些人看来并不敏感，但攻击者可以用许多不同的方式利用它们。\n\
  \n## 你如何处理数据治理和其他减少数据足迹的方法？\n\n数据治理的方法很大程度上取决于组织必须满足的法规或合规性。要求有助于明确定义需求范围。\n\n有很多方法可以减少数据足迹。这包括删除不需要的重复内容，以及归档（或删除）不再需要的旧数据。组织还可以利用第三方来存储和处理数据。我看到信用卡处理和存储时经常出现这种情况，当它被交给第三方处理器时——这消除了很多头疼的问题。\n\
  \n## 你对合规性有什么看法？\n\n合规并不意味着你是安全的。而且，在这一领域，我发现许多组织并不合规，却声称自己合规，特别是涉及到 `HIPAA` 时（要害怕，非常害怕）。这是一直以来最令人困惑的事情了。\n\
  \n我信任某些必须由特定机构和符合要求的审计师验证的合规性（`PCI DSS` 和 `SOC2` 就很棒），但其他则完全是一团糟，因为许多组织试图将合规性映射工作交给他们的通用\
  \ IT 人员——这些人员并不专业，也不完全理解安全或安全语言——这几乎总是以一团糟结果终场，特别是当是在内部完成完全困惑的自评估时。\n\n遗憾的是，当一个年营业额数百万美元（或更多）的组织完全是一团烂摊，并且不符合他们声称的许多要求时，这已经不再令人感到震惊了。\n\
  \n## 是否有一个框架可以将蓝队执行的活动或功能与监管合规性要求对齐？\n\n有不同的框架可以与监管合规要求紧密对齐，但许多框架必须作为安全计划的“骨架”结构，最终根据特定的监管要求进行扩展——取决于要满足哪一个。\n\
  \n> 在构建安全计划时，我喜欢使用 NIST 网络安全框架，并在此基础上构建以满足特定需求。\n\n在构建安全计划时，我喜欢使用 NIST 网络安全框架，并在此基础上构建以满足特定需求。还有其他框架拥有多个合规需求的映射表（crosswalks），其中流行的是\
  \ `HITRUST`。\n\n具有过多映射表的框架的负面影响是，它们对于许多组织的需求可能太笨了，这就是为什么我喜欢了解需要满足哪些监管合规。这样我就确切知道需要向像\
  \ `NIST` 这样的框架添加哪些内容，而不会过度。\n\n## 你如何参与组织的所有不同部门以实现防御最大化？\n\n所有员工都需要安全培训。从高管到人力资源部门，每个人都需要理解可能的威胁，特别是涉及到社会工程和妥善处理数据时。让所有员工理解他们在日常活动中需要注意的事项，对于在安全部门之外的防御至关重要，这可能包括被钓鱼而泄露过多信息的可能性。\n\
  \n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\n> 作为顾问，我发现要在提供坏消息的同时提供积极反馈是重要的，同时准确勾勒出组织为了构建更好的安全态势需要完成的工作。\n\
  \n作为顾问，我发现要在提供坏消息的同时提供积极反馈是重要的，同时准确勾勒出组织为了构建更好的安全态势需要完成的工作。你不能对非技术决策者谈技术，因为你会失去他们。即使他们点头并说他们知道你在说什么，也很大可能他们其实并不懂。\n\
  \n在一个许多企业仅仅因为法律原因被迫而寻求增加安全性（或因为他们有大型合作伙伴要求他们满足某些标准）的世界里，解释为什么由于这些原因必须做某事是非常重要的。除非失去交易和金钱的可能性是无所事事的后果之一，否则企业通常不想在安全上花钱。\n\
  \n## 在重大持续事件期间，你对管理非技术高管的预期建议是什么？\n\n不要制造恐惧、不确定性和怀疑（FUD），要非常具体地概述不包含过度承诺的基准。大多数高管在事件中的目标都围绕着尝试尽可能地减少业务中断，这转化为尽可能减少金钱损失。对于恢复时间要现实，因为你提供的信息会在内部传给其他高管，如果你过度承诺，你默认就让该高管也陷入了过度承诺，你可能会被他们推出去背锅。\n\
