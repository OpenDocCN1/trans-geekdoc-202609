  # 应急响应指标助你不断改进\n\n知识是运营和防御系统最强大的工具。将这些知识转化为应对任何威胁的优势。\n\n以下是关于应急响应计划的优秀且详细的参考：\n\
  \n*   `NIST Special Publication 800-61 Revision 2`: [nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-61r2.pdf](http://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-61r2.pdf)\n\
  *   `NIST Special Publication 800-82 Revision 2, Section 6.2.8 Incident Response`:\
  \ [nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r2.pdf](http://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r2.pdf)\n\
  \n## 蓝队成员如何如何学习、实践和成长？\n\n首先是学做中学。与你的蓝队队友合作完成关键任务。\n\n其次是接受外部培训，例如参加有蓝队赛道的会议、观看网络视频，或参加付费的专业培训课程。\n\
  \n实践至关重要，这回到了在职学习和演练（tabletop exercises）。此外，你还可以通过蓝队挑战（CTF）来磨练技能。很多都是免费的！成长的极佳方法是与同事分享你的所所得，或者通过在会议上演讲、写博客或发布工具（私有或公开）来实现。\n\
  \n## 如何奖励优秀的蓝队工作？\n\n如果你处于领导岗位，可以通过向关键管理层传达蓝队成员的重要性来奖励他们。\n\n让他们参加他们想参加的高级培训或会议。或者带团队出去吃顿晚餐或进行某种团队建设活动。\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护一个成功的信息安全计划？\n\n俗话说，你无法管理那些你无法衡量的东西。在纸面上列出你的优劣势可以指导你在人员配置、预算和技术部署方面的决策。\n\
  \n关于安全运营中心（`SOC`）人员配置也有许多优秀的博客和白皮书。\n\n以下是一些应急响应（IR）指标的参考：\n\n*   `NIST SP-800-61\
  \ Rev2, Section 3.4.2, “Using Collected Incident Data”`: [nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-61r2.pdf](http://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-61r2.pdf)\n\
  *   `Mandiant's “Using Metrics to Mature Incident Response Capabilities”`: [www.nist.gov/system/files/documents/2016/09/16/mandiant\\\
  _rfi\\_response.pdf](http://www.nist.gov/system/files/documents/2016/09/16/mandiant\\\
  _rfi_response.pdf)\n*   `SANS' “Common Practices for Security Operations”`: [www.sans.org/media/analyst-program/common-practices-security-results-3906.pdf](http://www.sans.org/media/analyst-program/common-practices-security-results-3906.pdf)\n\
  \n\n\n\n\n> “无论主要角色是什么，每位员工作为其职责的一部分都有防御责任。这意味着从首席执行官到邮件室都是如此。”\n\n**Twitter:**\
  \ [@jaysonstreet](https://twitter.com/jaysonstreet) • **网站:** [JaysonEStreet.com](http://JaysonEStreet.com)\n\
  \nJayson E. Street 是 `Dissecting the Hack` 系列的作者、`DEF CON` 组全球大使以及 `SphereNY` 的\
  \ `InfoSec` 副总裁。他曾在 `DEF CON`、`DerbyCon`、`GRRCon` 以及其他多个“CON”会议和大学就各种 `InfoSec`\
  \ 主题进行演讲。\n\n## 你如何定义蓝队（Blue Team）？\n\n我认为，蓝队是指在公司中担任涉及特定防御职能任何人。我之所以这样定义，是因为无论主要角色是什么，每位员工作为其职责的一部分都有防御责任。这意味着从首席执行官到邮件室都是如此。然而，蓝队指的是信息安全领域的人员，例如\
  \ `SOC`、网络安全、`DFIR` 等。\n\n## 蓝队应该具备哪两个核心能力？\n\n全面的事件响应技能以及应对入侵的既定程序。\n\n虽然蓝队应该将建立防御边界以防止被入侵作为首要任务，但在当今时代，他们也应该同样地准备好应对入侵，而且入侵极有可能会发生。如果认为防御工事最终将保护你，那不仅是过时的，更是愚蠢！我们需要理解，边界防御的主要功能是像一个防火保险箱。每一个保险箱都有一个等级，说明内部在被烧毁前能坚持多久。你支付的越多，保险箱在失效前能承受的热量就越长。这就是你的防御措施的工作方式。你投入并实施得越多，意味着你的边界在被突破之前能承受攻击的时间越长。这段时间就是在入侵发生前检测到他们的窗口，就像保险箱承受火灾一样，为你提供了灭火或救援保险箱的机会。\n\
  \n此外，一个设计周全的边界可能无法承受长时间攻击，但也可以让攻击者在攻击过程中变得更加活跃，从而导致被发现。\n\n第二种能力是与所有其他部门保持良好关系，并拥有一个开放且有利于部门间协作的通信渠道，特别是那些蓝队在入侵发生时会直接依赖的部门。如果你与网络部门或其他任何部门的唯一接触是在入侵或其他问题期间，那么他们就需要参与进来，否则在入侵变得之前，他们不太可能报告或进行互动。他们需要在事件发生前感到可以放心地向你寻求。如果员工只将信息安全视为管理层的执行部门或其他负面内涵的，那么他们将努力避免与蓝队的任何互动，即使与蓝队沟通对他们自己有益也是。\n\
  \n## 事件响应计划的一些关键优势是什么？\n\n* 它应该有深思熟虑的方案，尽可能涵盖他们能想象到的所有潜在事件，同时在计划中为不可预见的情景留出空间。\n\
  * 它应该有一个稳固的响应结构，让每个部门的每个人在入侵期间发生期间被激活时都知道自己的角色。\n* 管理层的完全支持总是至关重要的。\n* 一个充分理解业务部门及其功能和流程的计划。即使这些部门在事件期间并非至关重要，在任何事件中也需要将他们考虑在内。\n\
  \n## 蓝队成员可以如何学习、实践和成长？\n\n遗憾的是，对于大多数蓝队成员来说，寻找成长、学习和实践的方法是他们必须自己实现并努力争取的。很多公司没有通过持续教育对员工进行适当投资，这非常遗憾。这通常需要员工自己去争取带薪培训，或者在工作之余寻找学习的方法。幸运的是，在这个社区中，有很多资源提供给想要学习、实践和提高技能的人士。\n\
  \n蓝队成员在工作中学习的方法是实际上去观察其他部门的人员，看看他们的流程是如何运作的；这有助于让 `InfoSec` 更加平易近人，当事件发生时，这不会是员工与团队的互动。此外，玩几个不同的\
  \ `IR` 游戏，例如 `Oh Noes!` 和 `Backdoors & Breaches`，这两种团队建设游戏可以使学习如何处理某些问题变得有趣。\n\n\
  ## 如何奖励出色的蓝队工作？\n\n通过认可，大多数蓝队成员明白，他们做得越好，被看到的就越少。在一部涉及 `CIA` 的电影中，我记得一个演员对他们的工作说过一句话：“我们的成功是秘密，我们的失败是公开的。”一个良好的安全计划也是如此：你保持安全方面变得越精通，被看到的就越少。因此，当管理层认可团队对公司整体的贡献时，这是一件大事！\n\
  \n另一些人可能会说，主要方法仅仅是通过投入你的团队来提供，例如支付继续教育（如认证培训）并允许团队参加会议。\n\n## 蓝队可以使用哪些核心指标来建立、衡量和维护成功的信息安全计划？\n\
  \n指标对于任何成功的计划都至关重要。所有核心指标应该由每个团队决定，因为每个信息安全计划必须针对公司及其保护的资产进行量身定制。\n\n我推荐的适合任何计划的几个指标首先是对任何连接到网络的带有\
  \ `IP` 地址的设备的资产跟踪。应该在设备首次添加和移除时进行记录。补丁管理也应该包含指标跟踪部分。几个通用指标包括防火墙更改、`IDS/IPS` 告警、代理更改、异常活动调查及其结果。\n\
  \n## 如果你是一个安全基础设施原始的中小型企业中唯一的信息安全人员，你会从哪里开始？\n\n弄清楚你在保护什么。首先，你无法保护你不知道存在的东西。在较小的公司中，管理应该更容易。\n\
  \n此外，要意识到资产只是一部分。你需要知道是什么让你的公司盈利的。入侵期间什么会对你的公司产生负面影响？这些都是需要尽快提出的问题。\n\n此外，监控入/出站流量的能力是从零开始构建安全网络的基础要素。如果你不知道入侵正在发生，很难进行响应/遏制。因此，许多当前的攻击依赖于入侵的内部源向攻击者发出请求以下载剩余的恶意载荷或连接到命令控制服务器。我不只是监控边界的可疑入站流量，我认为至少应该投入相等的时间/资源来监控内部活动和流量。\n\
  \n## 性价比最高的安全控制是什么？\n\n一支受过教育的员工，他们充分理解并接受自己的责任，即他们工作的重要部分也包括负责维护公司资产的安全。\n\n一个组织应该在何时使用加密？\n\
  \n\n\n\n\n说真的，在任何可行的情况下，这都不会阻碍业务模式，也不会对信息安全（InfoSec）和网络团队的总预算产生负面影响。加密始终存在权衡，无论是成本、速度还是可管理性。每个人都应该就何时以及在何处使用加密做出明智的决策。至少，我强烈建议在安全通信以及每一个可以实施加密的设备硬盘上使用它。\n\
  \n## 你对合规性有什么看法？\n\n我的观点始于一个相关的观察。在我看来，我在新闻中看到的每一家遭受黑客攻击的公司似乎都“符合 PCI 合规标准”。我觉得这很奇怪，在他们不合规之前，大家似乎都是合规的。这就像是“薛定谔的安全计划”！与其让公司为了通过认证或符合监管要求而努力合规，也许我们应该努力实现安全，并随着这种安全的成功，意识到合规性和法规将是其副产品之一！\n\
  \n## 是否有某种框架可以将蓝队执行的活动或功能与监管合规要求对齐？\n\n我不认为框架在这方面是最佳选择。尽管如果确实需要框架，它也应该是你的团队专门为自己的业务模型创建的，同时考虑到你们的威胁模型。在考虑了这些因素之后，再将合规性考虑进来。否则，你最终将把不同框架的碎片拼凑在一起，你认为这样对你的公司最有效，但实际上本可以在内部创建出一个更完整、更全面的框架。\n\
  \n## 你如何组织组织的所有不同部门以实现防御最大化？\n\n从入职的第一天起，就应该向每位员工介绍并教育他们与信息安全相关的职责。这在整年中也应该不断得到强化。这是通过一个全面的安全意识计划实现的。如果他们不觉得安全是他们责任的一部分，或者不会对他们的工作产生负面影响，那么你根本就没有安全计划！你只是有很多良好的意图而已！这就像是从街角某人那里买了一个降落伞然后在不检查的情况下直接使用。是的，它可能运行良好，但参与你计划的另一个人无论结果如何，其实并没有任何问题！\n\
  \n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\n非常简单，就是像在试图教育一个想要学习的人一样说话，而不是为了表现或恐吓他们来获得我所需要的东西！这些人不是笨蛋；他们只是缺乏信息，确保他们充分了解风险、影响以及采取何种应对措施可能产生的后果是你的职责之一。你需要用尽可能少的技术术语进行解释，你使用的每一个术语都应该紧紧跟一个外行人士的定义。如果一个高管不完全理解他们所面临的风险，他们可能就不会放心地采取适当的行动来补救局面。\n\
  \n## 在重大持续事件期间，对于管理非技术高管的预期你有什么建议？\n\n在任何事件发生之前，与公司的整个管理结构建立信任关系。让管理层参与安全意识培训，并理解他们在保持公司安全方面的作用。至少每月交付一次你收集的指标，并确保他们理解这些指标的含义。你将与他们建立信任，这种信任在事件发生时会产生回报。你不需要管理他们的预期，因为他们已经了解了你的能力，并相信你正在做要求的事情。他们会期望你告知他们发生了什么，以及需要他们做什么。他们会信任你会以他们理解的方式提供信息，以便他们做出明智的决策。\n\
