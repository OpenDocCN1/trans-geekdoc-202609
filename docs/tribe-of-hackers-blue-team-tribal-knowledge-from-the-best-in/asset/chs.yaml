  \n嗯，我会从非常优秀的安全自动化开始。从零开始构建时，团队首先需要检测安全事件的能力。这需要处处添加可见性，例如在主机上添加入侵检测系统、添加网络入侵检测、记录用户活动以及对应用程序和主机进行漏洞扫描。在为组织添加可见性后，下一步是将所有这些告警或信息汇总到蓝队可以管理的方式，通常是\
  \ SIEM。将这些发现提交给团队和组织的其他人将有助于降低风险并提高安全性。\n\n## 性价比最高的安全控制措施是什么？\n\n嗯，开源领域有很多非常棒的企业级安全工具具有许多功能。其中一个\
  \ `Wazuh`。它拥有许多优秀的功能并支持许多不同的系统。它是一个入侵检测系统，可以监控事件响应并帮助合规。它可以处理 Windows 操作系统、Linux、Mac\
  \ 和容器。`Wazuh` 分析文件系统（甚至是应用程序的文件系统），并且它可以进行配置评估、日志数据分析和漏洞检测。而且它都是开源的，所以 `Wazuh` 应该出现在最高性价比安全工具的上。\n\
  \n然而，实时威胁情报是通用开源工具所缺失的。威胁情报是我更希望有一个企业级工具，并将这些发现整合到其他安全工具中的。\n\n\n\n\n\n我所在的组织或我待过的任何组织从未实施过欺骗技术。我个人曾尝试过这些技术，但并非在组织内部实施过。不过，确实使用过某些欺骗技术。例如，当你被\
  \ `WAF` 或防火墙拦截时，你可能会收到“406 Blocked”响应。这会向攻击者泄露他们正被拦截的信息；相反，我们可以拦截请求并将 HTTP 响应码更改为“404\
  \ Not Found”响应。\n\n同样，我们做过的另一种技术是将服务器信息更改为与实际情况相反的内容，例如用 `IIS` 代替 `Apache`，或者反之亦然。\n\
  \n## 你如何处理数据治理以及减少数据足迹的其他方法？\n\n这对每一个人都产生了非常深远的影响。我们总是试图限制数据复制的地方，特别是对于个人身份信息（PII）。当每个服务都与单一数据存储交互时，防止数据泄露要容易得多。隔离生产环境并拥有一个带有模拟数据的测试环境至关重要。数据治理也适用于访问管理，甚至延伸到诸如\
  \ `S3` 数据存储和日志文件。\n\n## 你对合规性有什么看法？\n\n我对合规性的看法是，人们有一种观点，认为合规就意味着你是安全的，这完全是错误的。\n\
  \n## 你如何引导组织内的所有不同部门以实现防御最大化？\n\n* 教育与培训\n* 让每个人都觉得自己是安全团队的一员\n* 让他们对钓鱼邮件、离开电脑未锁定、甚至让不认识且没有证件的人进入办公室保持警惕和安全意识\n\
  \n> 我们可以拥有世界上所有的安全控制，但取决于公司里的每个人是否具有安全意识。\n\n我们可以拥有世界上所有的安全控制，但取决于公司里的每个人是否具有安全意识。`blue\
  \ team`（蓝队）的工作之一就是通过分享案例、参与个人安全讨论以及参加培训来参与过程中。\n\n### 你使用什么策略向非技术决策者传达你所遇到的威胁？\n\
  \n我认为在向非技术决策者传达威胁时，一种有效的策略是将所有风险进行组织，并包含建议以及缓解该风险的预估成本/工作量，同时说明如果被利用的影响。组织风险的一种极方法是与公司内的技术人员以及其他安全利益相关者召开会议以评估风险。然后分配优先级，并提出可以传达给非技术决策者的建议。整个过程是风险评估的常见做法。内部风险评估是掌握组织安全威胁状况的绝佳方法。\n\
  \n## 在重大持续事件期间，你对管理非技术高层的预期有什么建议？\n\n我建议诚实地面对你所知道和不知道的信息。尝试设定固定的时间来同步正在进行的事件状态。这可以是每四小时一次或每八小时一次。管理非技术高层的持续沟通非常重要，但也要记住在混乱时期给\
  \ `blue team` 留操作空间。\n\n> 管理非技术高层的持续沟通非常重要，但也要记住在混乱时期给 `blue team` 留操作空间。\n\nWileyPRE\n\
  \n# 21\n\n### Shawn Kirkland\n\n![](img/c21uf001.png)\n\n> “蓝队的目标是使应用程序的网络安全生态自动化，以主动和被动地保护自己免受全球范围内威胁的影响。”\n\
  \n**Twitter:** [@ShawnKirklandCS](https://twitter.com/ShawnKirklandCS) • **Website:**[www.linkedin.com/in/shawn-kirkland-240a6539](http://www.linkedin.com/in/shawn-kirkland-240a6539)\
  \ 和 cyberpulse.tech\n\nShawn Kirkland 在美国海军开始职业生涯，担任行动专家，将军事的全球网络连接在一起。随后他进入蒙哥马利的奥伯恩大学学习计算机编程，并在大学期间开始了为\
  \ `Air Force` 提供外包服务的军外生涯。在接下来的八年里，Shawn 熟练掌握了当今行业中大多数可用系统和应用程序的安全防护。Shawn 利用这些知识指导公司如何正确地启动和维护信息安全计划。\n\
  \n## 你如何定义蓝队？\n\n公司里的每一个人都是 `blue team` 的一部分。从执行助理到 `CISO`（首席安全官），所有人员都承担着某种程度的责任。在更具体的层，`blue\
  \ team` 的目标是使应用程序的网络安全生态自动化，以主动和被动地保护自己免受全球范围内威胁的影响。要实现这一点，蓝队必须拥有一漏洞管理计划和一套流程。\n\
  \n## 蓝队应该具备哪些核心能力？\n\n蓝队应该具备五项核心能力，列如下：\n\n* **发现 (Discover)**：映射、分类并识别每项资产。\n*\
  \ **评估 (Assess)**：\n    * **主动性 (Pre-active)**：在镜像发布到网络之前，建立安全和加固的自动化流水线。\n    *\
  \ **被动性 (Re-active)**：对于在网络上运行的资产，确保其持续接受漏洞评估。\n* **分析 (Analyze)**：报告关键性能指标 (KPI)\
  \ 和指标。\n* **修复 (Fix)**：将结果分配给相关人员。\n* **衡量 (Measure)**：循环往复。持续确保流程有效。\n\n## 事件响应计划的一些关键优势是什么？\n\
  \n* **识别 (Identify)**：要感知事件，首先需要建立稳健的资产管理或发现计划，不断记录和跟踪网络中的所有资产和流量。\n* **监控 (Monitor)**：为了从全局视角获取网络视图，有三种主要数据类型需要监控：\n\
  \    * **软件**：使用漏洞扫描软件扫描软件以识别漏洞或控制措施。\n    * **流量**：分析流量以确定数据在网络中的流动并发现恶意活动。\n \
  \   * **日志**：捕获和分析日志对于确定攻击历史可能预测未来有帮助。\n* **遏制 (Contain)**：一旦发生事件，遏制威胁将减少扩散的可能性。利用威胁遏制软件可以隔离文件或流量。\n\
  \n## 蓝队成员如何学习、实践和成长？\n\n成功的蓝队具备操作和理解任何形式技术的诀窍。他们还很好地了解这些技术和网络基础设施在公司整体技术生态系统中是如何运作的。\n\
  \n> 成功的蓝队具备操作和理解任何形式技术的诀窍。\n\n以下是在在不断演变的网络安全领域保持领先的几个步骤：\n\n* **沟通 (Communicate)**：为了与不断变化的网络保持同步，必须与公司内的所有团队或部门建立联系。\n\
  \n\n\n\n\n例如，一个信息安全计划的成功极度取决于网络团队。通过与网络团队建立每周或每两周一次的会议，你可以不断讨论网络变化或现有基础设施的变化，这将帮助你确保这些网络拥有适当的覆盖。如果与网络团队没有关系，信息安全计划在网络安全方面将是盲目的。\n\
  \n以下是取得成功需要与之建立关系的几个团队：\n\n* 网络团队\n* 运维团队\n* 红队\n* DevOps 团队\n* 云团队\n\n* **学习：**\
  \ 这是一个好消息，通过阅读这本书，你已经迈出了第一步！技术在不断地发生变化和演变，网络安全专业人士必须掌握最新的功能、软件和最佳实践，才能成功地保护网络。观看视频、参加\
  \ SANS 课程和阅读文章将使你的知识水平与行业的最新动态保持同步。\n\n* **实践：** 学习有助于从高层层面理解网络安全最佳实践，但我们如何在现实世界中应用这些知识呢？拥有一个家庭或工作实验室来测试最佳实践，将让你在成功应用生产网络中这些机制的能力上领先数光年。\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护一个成功的信息安全计划？\n\n通过识别蓝队成功的定义，你可以定义指标来衡量这些成功标准。例如，指标可以与以下五个核心能力中的每项相关：\n\
  \n* **发现：** 我是否正在发现并分类我 100% 的资产？\n* **评估：** 我是否正在对所有发现的资产进行漏洞扫描和控制检查？\n* **分析：**\
  \ 我是否正根据蓝队定义的 SLA 和成功标准进行报告汇报？\n* **修复：** 我的资产所有者是否正在根据 SLA 修复发现的问题？\n* **衡量：**\
  \ 如果我没有遵守一个或多个指标，我该如何更改或改进流程，以满足前四个核心目标中的 KPI 和指标？\n\n### 如果你是一家拥有原始安全基础设施的中小型企业中唯一的信息安全人员，你会从哪里开始？\n\
  \n学习网络。今天我的客户面临的最常见问题是缺乏对其网络架构的理解。\n\n> 今天我的客户面临的最常见问题是缺乏对其网络架构的理解。\n\n这通常是因为没有与网络团队建立良好的关系。网络是成功实现安全防护时需要理解的最关键的基础性项目。与网络团队建立每周或每两周一次的会议，以掌握目前的架构以及未来将实施哪些改进或更改。\n\
  \n## 性价比最高的安全控制措施是什么？\n\n漏洞扫描技术是一项非常有用的软件，因为它可以收集海量信息。以下是一个“良好的”漏洞扫描解决方案可以为你完成的一些任务：\n\
  \n* **发现：** 了解网络上存在哪些资产对于你整个网络中的许多计划至关重要，例如通过资产管理来识别安全缺口、威胁所处的位置以及应该由谁来修复它们。\n*\
  \ **漏洞：** 扫描过时的软件、配置错误的代码或恶意软件将有助于保护你的网络。\n* **合规性：** 在信息安全计划中迈出下一步并实施合规控制时，拥有一套可以对所有系统运行配置检查的软件，将有助于识别合规缺口在哪里。\n\
  * **流量分析：** 在 `TAPs/SPANs` 部署被动扫描技术将确保你正在分析所有进入和离开网络的流量，以识别网络中的恶意活动。这种扫描方法对于识别违规资产也有用，因为它是\
  \ 24/7/365 全天监听，而主动扫描器只是时间点扫描。\n* **补丁管理：** 补丁管理团队将负责向整个网络的所有系统部署补丁，无论其是否为安全补丁。主动扫描器能够登录资产并发现无论供应商如何，需要哪些补丁。这些数据可以发送给补丁管理团队，以确保他们的应用程序设置正确，并为所有软件补丁自动化创建包。\n\
  * **镜像安全：** 持续扫描整个网络中的现有资产是关重要的，但通过在镜像进入生产环境之前对其扫描，你可以进一步增强安全性，确保不安全的镜像/软件不会部署到整个网络。将扫描解决方案集成到此流水线中将缓解这些问题。\n\
  * **日志：** 某些漏洞扫描技术在其产品中还包含日志解决方案。利用这些功能或将你的漏洞扫描解决方案与现有的 `SIEM` 集成，将日志与主动和被动漏洞关联起来。\n\
  \n### 组织应该在何时使用加密？\n\n* **个人身份信息 (PII)：** 在高层，任何有 PII 信息流过的网段都应该加密。即使该网段对外部不可，攻击者也可以利用外部可用资产跳转到有\
  \ PII 信息流过的网段。\n* **灾难与恢复：** 备份包含大量信息，一旦泄露，对公司可能是灾难性的。确保你的备份已加密，并保持异地存储的数据路径加密。\n\
  * **面向外部的资产：** 外部可用资产（如 Web 服务器）通常是黑客尝试攻破网络的首选。如果这些外部 Web 服务器被攻破，攻击者可能跳转到其他外部不可用的资产，例如数据库服务器。确保你的外部可用资产与它们连接到网络内部的资产之间的连接是安全且加密的。\n\
  \n### 你如何处理数据治理和其他减少数据足迹的方法？\n\n通过为你的网络安全计划回答“成功意味着什么？”，你可以识别出哪些数据对你存储、分析和报告最重要。例如，日志是监控整个网络活动的好方法，但存储日志以及购买软件进行分析的成本可能很高。\n\
  \n在确定了成功指标后，你可以定义哪些日志需要记录，哪些日志对你来说不需要记录。这不仅从数据足迹的角度对你有帮助，你还可以根据“有用”的日志基于这些数据进行事件报告/监控。\n\
  \n## 你对合规性有什么看法？\n\n合规性是一个复杂的世界；然而，为了被认为是一个“良好的”信息安全计划，它是绝对必要的。对于我的客户，我将合规性称为“终局安全”。我建议在建立稳健的漏洞管理计划之前，不要开始执行合规性。如果你还没有为你的计划定义“成功”，就开始实施合规性，你很可能在开始之前就已经失败了。\n\
  \n某些合规控制措施需要几个月才能实施，而某些则需要接受风险，因为该风险不适用于你的网络，或者会破坏网络的关键方面。在开始实施合规计划之前，我会准备好以下几项内容：\n\
  \n\n\n\n\n- **风险接受工作流：** 针对控制措施定义的审批流程。如果这些控制措施在给定的 `SLAs` 内无法修复，则需要被风险接受。\n- **定义的\
  \ SLA：** 你应该给资产所有者多长时间来修复每项控制措施？这将允许你衡量合规修复工作的成效。\n- **已部署自动化修复工具：** 许多合规性控制措施应部署在整个网络中，并通过软件（如\
  \ Windows 的 `Group Policy`、`Puppet`、`Chef`、`Ansible` 以及脚本等）强制执行。\n- **资产所有者：** 一旦开始合规扫描和分析，预先识别资产所有者将使控制措施的修复过程更加顺畅。\n\
  - **与公司所有团队（包括非 IT 团队）的沟通渠道：** 在技术的各个方面，与其他团队建立良好的沟通渠道始终是至关重要的。在合规方面，这一点尤为重要。许多控制措施如果实施不当，可能会导致你的网络瘫痪。理解每项控制措施如何影响你团队的技术将缓解其中的一些痛苦。\n\
  \n## 是否有某个框架可以将蓝队执行的活动或功能与合规要求对齐？\n\n通常，我总是向每个客户推荐两个框架，取决于他们是政府机构还是商业机构，无论他们的网络中拥有什么类型的资产或数据：\n\
  \n- **NIST：** 政府客户要求对其整个网络中的所有资产实施 NIST 控制。你可以在此处找到加固标准：[csrc.nist.gov/glossary/term/Hardening](http://csrc.nist.gov/glossary/term/Hardening)。\n\
  - **CIS：** 商业客户应在整个网络中实施 CIS 控制。你可以在此处找到 CIS 基准测试：[www.cisecurity.org/cis-benchmarks](http://www.cisecurity.org/cis-benchmarks)。\n\
  \n根据你的合规要求、穿越网络的数据或公司内部的功能，你可能需要实施其他框架，如 `NERC-CIP`、`PCI`、`ISO` 等。如果是，请联系相应的网站获取更多信息。\n\
  \n## 如何参与组织的所有不同部门以实现防御最大化？\n\n在开始与组织中的每个业务部门 (`BU`) 通通时，使用“我能如何帮助你，你能如何帮助我？”的策略将让你进入对方的大门，并与相应的\
  \ `BU` 建立良好关系。以下是一些示例：\n\n### 网络团队：\n- *你能如何帮助我？* 为我提供当前网络状况的视图，并提供必要的数据，以便我从漏洞和合规性的角度分析网络。\n\
  - *我能如何帮助你？* 根据主动和被动扫描技术提供网络“实际”面貌的数据，以更新你的系统。提供漏洞和合规信息，以更好地保护你的系统。\n\n### 补丁管理团队：\n\
  - *你能如何帮助我？* 使用适当的补丁管理工具自动化方式修复系统以关闭漏洞。\n- *我能如何帮助你？* 提供关于系统需要哪些补丁的必要信息，并对补丁管理范围内可能属于你的资产提供更全面的视图。\n\
  \n### 开发部门：\n- *你能如何帮助我？* 在软件发布到生产网络之前确保安全。\n- *我能如何帮助你？* 将漏洞扫描解决方案集成到你的开发流水线中，确保软件在发布到生产环境之前是安全的。\n\
  \n## 你使用什么策略向非技术决策者汇报你遇到的威胁？\n\n在高级别，公司内部通常有两种报告威胁数据的机制。\n\n- **资产所有者：** 这些是实际上负责修复网络中威胁或发现的人。他们希望尽可能多地了解威胁信息，例如：\n\
  \    - 威胁是什么？\n    - 我该如何修复它？\n    - 是否有关于该威胁的其他信息可以帮助我确定最合适的行动？\n    - 我有多少时间来修复这个漏洞？可以将这些数据以\
  \ `PDF`、`电子表格`甚至工单格式分发给资产所有者，帮助他们理解修复发现项时需要知道的变量。\n- **高管：** “高层人员”、经理或执行官通常只想知道一个简单的问题：“我们的情况是好，还是不妙？”他们不需要了解修复发现项的细节，但可能想知道以下某些内容：\n\
  \    - 上个月我们的关键资产上有多少漏洞？这个月又有多少？\n    - 在趋势图上，我们的修复工作在季度跨度上是否比上一个季度有所进展？\n    -\
  \ 我们是否已经配备了所有必要的技术来监控/强制执行我们定义的成功指标？\n    - 我们是否已经到位的人员来监控/强制执行我们定义的成功指标？\n    -\
  \ 我们是否可以利用集成点来自动化可能阻碍我们工作流的手工劳动？\n    通过每周的 `PDF` 或幻灯片演示回答这些以及更多问题，以高层水平展示你在信息安全计划中处于什么位置。\n\
  \n## 在重大持续事件期间，对于管理非技术高管的预期有什么建议？\n\n当事件持续发生时，压力会非常大，因为高管和高层管理希望尽快获得以下某些问题的答案：\n\
  - 哪些系统被攻破，哪些数据受到了影响？\n- 威胁仍然活跃，还是已被遏制？\n- 客户数据或 `PII` 是否受到影响？\n- 威胁何时会被遏制或消除？\n\n\
  > 确保保持冷静，并让你的团队尽快识别威胁、哪些网络资产或网络区域受到影响，以及如何遏制威胁。\n\nWileyPRE\n\n# 22\n\nSami Laiho\n\
  \n![](img/c22uf001.png)\n\n> “蓝队对抗红队，就像军事演习一样。”\n\n**Twitter:** [@samilho](https://twitter.com/samilho)\
  \ • **网站:** [4sysops.com/members/sami-laiho](http://4sysops.com/members/sami-laiho)\
  \ 和 [samilho.com](http://samilho.com)\n\nSami Laiho 是 `Windows OS` 和安全领域全球领先专家之一。Sami\
  \ 自 1996 年以来一直从事并教授操作系统故障排除、管理和安全。2019 年，Sami 被 *TiVi* 杂志选为芬兰 IT 领域的 100 位最具影响力人物之一。他是芬兰该领域\
  \ Twitter 上粉丝数第 11 的人物。在 Microsoft Ignite 2018 上，Sami 的“幕后：如何构建一个获奖会议课程”和“Sami Laiho：45\
  \ 分钟掌握 Windows OS 的 45 个技巧”课程被列为 1708 场课程中的第一和第二。这是该会议历史上首次有人能做到这一点。\n\n**你如何定义蓝队？**\n\
  \n蓝队的重点是防御组织免受数字/网络攻击。基本上，它包含了任何防御公司免受敌人攻击的内容，但通常指的是网络安全。蓝队对抗红队，就像军事演习一样。\n\n**蓝队应该具备哪两个核心能力？**\n\
  \n- 对硬件和软件资产有良好的了解/清单，以便他们知道需要保护什么。\n\n\n\n\n\n-   接受过在事件发生时如何应对的技能培训\n\n## 事件响应计划的一些关键优势是什么？\n\
  \n目标是以一种限制损害并缩短恢复时间和成本的方式来处理局势。\n\n一个良好的事件响应计划包含五个主要步骤。\n\n1. 准备\n2. 检测与报告\n3. 分类分诊与分析\n\
  4. 遏制与中和\n5. 事件后活动\n\n练习、练习、再练习。\n\n## 蓝队人员如何学习、练习和成长？\n\n使用按需学习，并在 Twitter 上关注其他专家。\n\
  \n## 如何对出色的蓝队工作进行奖励？\n\n如果蓝队能够保持环境安全，每年都应该获得奖励。应对管理层对蓝队所采取的积极措施进行教育，即使他们从未主动阻止过事件。我遇到的最糟糕的例子是，我的一个朋友作为\
  \ CISO 被公司踢了出去，因为没有发生过事件，管理层认为不需要他的服务了。\n\n## 蓝队可以使用哪些核心指标来构建、衡量和维护一个成功的信息安全计划？\n\
  \n安全性不能阻碍可用性。否则，你永远无法获得管理层或终端用户的认可。因此，衡量标准不仅应该是防止了哪些事件或修复了哪些漏洞情况，还应该是受保护系统用户的整体满意度。\n\
  \n> 安全性不能阻碍可用性。否则，你永远无法获得管理层或终端用户的认可。\n\n## 如果你是一家拥有基础安全设施的中小型企业中唯一的信息安全人员，你将从何处开始？\n\
  \n实施最小权限原则。大多数传统恶意软件可以通过移除管理员权限来缓解。与被动措施相比，其结果非常惊人，特别是看 Office 应用程序和浏览器时！在 2019\
  \ 年，移除管理员权限缓解了 Windows 80% 的漏洞，以及 Office 和 IE/Edge 100% 的漏洞。\n\n你应该记住，移除管理员权限不仅仅是为了安全。移除管理员权限还能让你的计算机运行更快、更好、寿命更长，且重装次数更少。我的大客户还衡量出，移除管理员权限后，帮助台工单的数量减少了\
  \ 75%。这意味着你可以在更长时间内更安全、更高效。\n\n## 性价比最高的安全控制措施是什么是什么？\n\n白名单机制。配置正确的白名单不会产生开销，你平均每月只需要添加一条新规则。传统的威胁黑名单由于新恶意软件的出现，每天需要添加\
  \ 100 万行新。\n\n> 配置正确的白名单不会产生开销，你平均每月只需要添加一条新规则。\n\n## 组织应该在何处使用加密？\n\n每个终端都需要进行全盘加密。全盘加密最重要的任务是保持设备完整性。因此，最重要的特性是完整性，而不是许多人所认为的数据加密。\n\
  \n即使是没有数据的终端也需要加密，以防止任何人篡改它。一个很好的例子是 Windows 上的 `AppLocker` 白名单。如果你设置了一个良好的策略，任何具有物理访问权限的人都可以将系统离线并清理\
  \ `C:\\Windows\\System32\\Applocker` 文件夹，这将禁用整个白名单功能。当你的计算机磁盘被加密时，这种情况就无法发生。\n\n\
  ## 你如何参与组织的所有部门？\n\n在我的公司，安全部门从一开始就被包含在内。这真的非常有成效！\n\n## 你使用什么策略向非技术高管沟通威胁？\n\n\
  我发现，与业务的其他领域相比，蓝队人员极度匮乏认可。CISO 经常进行月度汇报。\n\n## 在事件期间管理非技术预期，你有什么建议？\n\n不要尝试自己解决所有问题。对于局势的影响范围要极其诚实。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n这个答案有点不合常规，但内容如下：蓝队的主要能力应该是保持系统安全，还要教育业务的其他领域。蓝队通常比我们需要的规模小得多，因此从其他部门寻求帮助至关重要。这包括教员工钓鱼诈骗是什么样的、授权人们成为自己所在部门的安全倡导者，以及维护良好的\
  \ DevSec（开发安全）关系。\n\nKat Maddox ![](img/c23uf001.png)\n\n> “蓝队的主要能力应该是保持系统安全，还要教育业务的其他领域。”\n\
  \n**Twitter:** [@ctrlshifti](https://twitter.com/ctrlshifti) • **网站:** [codem.com](http://codemopolitan.com)\n\
  \nKat Maddox 是一位安全架构师，她经常自称为“单人制女性安全团队”。她专注于帮助小公司在安全态势上抢先机，工作领域包括漏洞管理、应用安全、合规性和风险分析。Kat\
  \ 在加入蓝队之前曾担任渗透测试员，她是缩小攻击性安全与防御性安全之间差距以及建立知识共享文化的倡导者。在不在处理火警时，Kat 会在 Twitter 上写技术笑话。\n\
  \n\n\n\n\n在信息安全（InfoSec）以及整个技术领域，经常被忽视的一的是理解组织业务目标的重要性。一家提供仅限授权客户访问的 SaaS 的金融科技公司，其威胁面会比一个任何人都可以访问的在线商店要小得多。公司的路线图甚至可能包含扩展到与其目前合规的完全不同的安全法规覆盖的领域。如果你在设计安全基础设施之前不理解业务需求，你将会浪费时间、资源，最糟糕的是，还会得罪你的利益相关者。这种局面需要付出大量的努力和大量的“咖啡贿赂”才能挽回。\n\
  \n在设计任何安全解决方案之前，我会问自己以下问题：\n\n*   如果这是一个产品驱动型公司，那么谁在使用这个产品？\n*   我的关键利益相关者是谁？在开始之前，我可以从他们那里学到什么？\n\
  *   为了实现业务目标，公司需要获得/合规哪些法规或认证，最好是不要让 CEO 被罚款或入狱？\n*   一年业务路线图是什么？两年的？五年的？\n*   已经存在哪些安全措施（如果有的话）？\n\
  *   当前网络和系统的架构是什么？\n*   预算是多少？如果我需要增加预算，我必须去讨好谁？\n\n一旦我得到了这些问题的答案，通常我从哪里开始就很明显了。即使是最优秀的安全专业人士有时也会陷入在自己的泡泡中运行的陷阱，很容易在安全团队与业务其他部门之间产生脱节。根据我的经验，运行一个没有纷争且资金充足的安全计划的关键，是让你的利益相关者不将其视为一个安全计划，而是视为另一个我们都需要共同努力实现的业务计划。\n\
  \n> 在我的经验中，运行一个没有纷争且资金充足的安全计划的关键，是让你的利益相关者不将其视为一个安全计划，而是视为另一个我们都需要共同努力实现的业务计划。\n\
  \n## 什么是性价比最高的安全控制措施？\n\n这在很大程度上取决于业务（看我之前的抱怨！），但在身份和访问管理（IAM）方面取得了最好的成功。审计谁有权访问什么内容，并撤销任何非必要或未使用的访问。在任何可以的地方应用最小权限原则。这已经缓解了你大部分的人员风险，并让钓鱼诈骗变得危险得多（这比任何钓鱼模拟都有效——但那是以后讨论的话题）。这额外的好处是，在审计访问控制时，你通常会发现许多你原本不会知道的糟糕实践的“深坑”，这仅仅通过与人们讨论他们拥有和需要的访问就能实现。\n\
  \n### 组织应该在何时使用加密？\n\n对于每个业务来说没有一成不变的解决方案。我目前工作的组织几乎在`everywhere` 都加密数据，因为我们现有的网络基础设施使这既便宜又容易，而且我们存储敏感的财务数据。我之前工作过的一家公司几乎`now\
  \ 加密`，因为他们不收集或传输任何敏感数据，实施复杂的加密策略对业务造成的成本将远高于可能节省的成本。在决定数据需要在哪些阶段进行加密之前，我会从理解数据`是什么`、它的敏感级别是什么，以及数据的生命周期是什么开始。\n\
  \n## 你对合规性有什么看法？\n\n我`love`合规性。CEO 也是。我在合规方面看到的主要问题是，组织将其视为一种勾选活动，而不是真正对安全进行投入。理解它如何影响法规是业务至关重要的部分。我参加过很多审计，那里是安全性的明显信号。我认为安全团队与业务目标紧密合作非常重要。\n\
  \n## 你使用什么策略向非技术决策者传达威胁？\n\n你必须将其转化为他们能理解的术语。如果你在与风险专业人员交流，你可以描述它将如何影响组织。如果你在与运营人员交流，理解他们所处的世界至关重要。同时，我认为不低估他们很重要。仅仅因为某人是非技术人员并不意味着他们愚蠢。你提供的背景信息越多，就越有机会提供你本没有考虑过的解决方案。\n\
  \n在过去的几年里，我一直在要求我在各种会议和活动中遇到的人们定义他们用来描述我们这个行业所做工作的术语，首先问“什么是漏洞？”或“什么是威胁？”，最后问“什么是安全？”。我不断对回答中缺乏一致性感到惊讶，而且坦率地说，最后一个问题已经困住了许多人，甚至包括几位被认为我们领域中领袖或有影响力的人士。\n\
  \n## 你如何定义蓝队（Blue Team）？\n\n第一个问题是一个很好的起点，但也意味着`blue team`的定义中至少有一部分涉及事件响应。老实说，这不是一个在咨询/顾问工作中经常出现的术语，主要是在贷/借记安全领域（你知道的，PCI）。我在黑客/安全会议上听过很多次这个术语，但它并不是我的日常工作中经常出现的术语。\n\
  \n我在过去几年中了解到，蓝队很大程度上是组织网络运营的防御者。\n\n\n\n\n尽管缺乏简洁的答案，但安全领域似乎出现了两种广义的观点。第一个观点认为组织需要“是安全的”，这意味着它们要达到一种对攻击免疫或或说无法被攻破的状态。从这个意义上说，安全是一种需要达到（并维持）的状态或水平。出现的第二种观点（也是我更经常建议的观点）是安全是你正在“所做的事”；它是一系列持续执行的活动，用于检测恶意活动、识别/遏制攻击，或尽可能减少损害或损失，分析漏洞利用利用的来源和/或原因，以防止攻击在未来再次成功，并确保识别出的任何停止未来攻击的更改/缓解/应对措施都能得到实施，或者创建相应的步骤/流程以检测是否再次尝试此类攻击。\n\
  \n这些活动听起来非常像人们预期在事件响应计划中会看到的活动，因此从本质上说，蓝队（blue team）负责组织网络的安全。安全 = 防御。\n\n## 蓝队应该具备哪两个核心能力？\n\
  \n在多年来我所咨询的组织中，我看到最一致的能力是：对团队负责的系统有深入的了解，对其运行的“正常”情况有良好的把握，以及一种恰恰偏执但坚定的态度，确保他们所负责的任何系统都不会落入敌手手中。曾有人对我说过：“不在我的看守范围内，绝不在我的机器上。”也许这些更像是特质而非能力，但这些确实是我描述为安全工作做得良好的组织中最经常看到的属性。\n\
  \n遗憾的是，随着技术在工作原理、速度以及数据、应用程序、系统、运营等方面复杂性的提高，我看到这些特质越来越少。我仍然能看到了解技术如何工作的人，但看到了解技术在预期功能之外还能做什么的人越来越少。此外，必然需要更多地依赖自动化来收集和筛选所有技术产生的所有网络流量、日志和审计追踪，人们越来越多地成为他们执行这些活动所用工具的专家，而往往是以牺牲理解他们实际在做什么为代价的。\n\
  \n### 事件响应计划的一些关键优势是什么？\n\n一个很好的起点是建立一个正式的计划。正式意味着目标、任务、步骤和活动都已记录记录。事件响应计划需要涉及组织中的每位员工，但这一点似乎经常缺失。\n\
  \n我经常看到普通用户/员工假设组织内其他地方的某人或某事负责监控、检测、预防和响应。所有员工都需要接受培训，对于他们在工作中所使用的任何应用程序和系统的任何异常行为或活动，要做到“见者必言”。他们承担的责任不仅仅是能够识别钓鱼尝试和每年看一次\
  \ 20 分钟的安全意识视频。良好的事件响应计划会训练员工在看到异常或奇怪情况时进行报告，并给他们应该告知的人员姓名/电话/邮箱。除此之外，关键优势还包括拥有专业的分析师，他们熟悉业务运营，并具备正确的技能，或者与开发者、管理员和运营人员建立了良好的关系，以便他们在调查期间利用正确的资源。\n\
  \n高层和管理层的支持也至关重要，因为事件响应团队必须在调查和响应期间调用任何所需的资源。\n\n### 性最高的安全控制措施是什么？\n\n知识。\n\n组织应该何时使用加密？\n\
  \n加密在组织中有几种可能的应用。从数据安全的角度来看，可以使用加密来促进数据的三个经典方面：机密性、完整性和可用性。加密函数也常用于身份验证机制，例如密码保护以及用于授权和不可否认性的数字签名（防止某人否认其同意、许可并签署了某项协议或合同）。\n\
  \n我认为这个问题主要是在问数据安全，因此首先组织应该创建一个数据分类标准或指南，然后用它来确定组织处理的哪些类型的数据需要加密解决方案所提供的类型保护。组织还应该进行业务流程/数据流分析，以确定诸如数据是如何被创建或引入组织的、数据流向何、谁或什么消耗了数据或需要访问数据、是否需要保留、在哪里以及如何保留以及需要多久、数据是否离开组织，以及在不再需要时何时以及如何被销毁。\n\
  \n那么，当敏感数据在传输到/在内部/离开组织网络时，以及当数据被存储或保留时，加密就变得恰当。\n\n## 你对合规性有什么看法？\n\n我认为美国（可能可能是全球）的大多数组织对安全的接触、兴趣或接纳/意愿/预算都是有限的，他们只在监管/合规标准要求他们做某些事时才对安全感兴趣。\n\
  \n自 2004 年引入以来，我几乎完全参与支付卡行业数据安全标准（`PCI DSS`），并在其中近 10 年里担任过合格安全评估师。在这 10 年里，我与 100\
  \ 多家组织合作过，其中许多是财富 500 强企业（包括至少两家当时排名财富榜第一的企业）。我的客户中有几家是当时一些重大数据泄露事件的受害者。这些公司在泄露后确实对安全感兴趣，但当时没有一家为所发生的事情做过准备。\n\
  \n但这类公司是特例。我的大多数其他客户对建立安全计划几乎没有表现出兴趣，只想做最少的工作来被认为合规，并且会花费大量时间试图“缩小范围”，以避免执行大多数人认为是最佳实践的事。\n\
  \n在评估期间，我花了很多时间解释 `PCI DSS` 要求的含义、为什么它们很重要，以及为什么我的客户不仅应该在他们的持卡者数据环境（`CDE`）中执行所有事情，而且要在组织的任何地方都这样做。我经常会收到这样的反馈：“这是我们经历过最困难的事情了；感谢你帮助我们理解。”我也听过类似的话：“我们的竞争对手在做什么，因为我们想做到不多，也不多做？”以及“我们为什么要担心安全；我们只是卖衣服的？”还有我最喜欢的一句，在花大量时间解释加密工作原理以及\
  \ `PCI DSS` 的要求之后：“是的，但我们不需要国防级别的安全。”\n\n所以，我现在对合规性的看法非常明确，而且这明确是指针对 `PCI DSS`。\n\
  \n今天所有的渗透测试人员和红队人员很大程度上之所以有工作，是因为 `PCI` 要求进行年度渗透测试。\n\n\n\n\n*   我在黑客/安全社区中与很多 `PCI`\
  \ 的反对者和唱反者交流，他们的观点总是基于对 `PCI` 实际运作以及/或 `PCI DSS` 要求的误解或误读。\n*   我最经常听到的是 `PCI` 在实际安全实践/要求方面只是“最低限度”，但我合作过的许多公司发现，要真正遵循并持续遵循\
  \ `PCI DSS` 提出的要求并保持一致性且良好执行是非常困难的。当我听到这些陈述时，我会试着问那个人，从安全的角度来看，缺少了什么，或者在 `PCI` 之外他们还需要做什么。我很少得到任何回答。\n\
  *   我还会听到“你可以合规但不安全”，对于这一点，我会有两种回答方式：“是的，如果是我对你进行评估，你可以这样做”以及“你可以是安全的也可以是不安全的”。\n\
  \n**结论**：如果你将 `PCI DSS` 视为一个框架，而不仅仅是针对特定类型敏感数据的安全标准，并遵循主要目标/要求的原则或精神，你将建立起一个相当不错的安全计划，包括应急响应以及无论如何称呼的蓝队（如果有的话）。\n\
  \n## 是否有一个框架可以将蓝队执行的活动或功能与监管合规要求对齐？\n\n人们对“只做监管合规要求的事”的担忧在于，这少于安全的要求，因此会让你暴露在受到攻击的风险中，或者更糟糕的是攻击没有被发现。现实是，大多数公司只会做监管合规要求的事，所以你最好知道如何在这些限制范围内工作，以便作为一个有效的应急响应人员/防御者/蓝队成员发挥作用。\n\
  \n这就是我在 `PCI` 客户那里获得巨大成功的地方。我将成功定义为：我觉得我至少帮助他们做出了更明智的决定，关于他们如何/如何不遵循 `PCI DSS` 要求，并帮助他们理解每项要求的必要性、所有要求之间的相互依赖性，以及组织中所有让这一切运转的人。\n\
  \n所以，是的，有一个框架；它就是 `PCI DSS`。这并不是一个这样做是否明智的问题；而是有很多机构必须这样做的问题，因此挑战就变成了如何将 `PCI` 作为达到目的的手段。明明的组织会拥抱他们所应用的任何框架；理解它将你引向某个特定的方向，并且它并没有涵盖你需要做的所有细节，但理想情况下，你会意识到它涵盖了一个成熟安全计划的所有方面。\n\
  \n## 你如何参与组织的所有不同部门以实现防御最大化？\n\n当我还是一名合格的安全评估师 (`QSA`) 时，我有机会接触组织中的所有不同参与者，包括业务部门、人力资源、法务、内部审计、开发人员、管理员，甚至安全团队。这因为\
  \ `PCI DSS` 的性质而变得简单，因为如果他们被认为合规，就需要所有不同部门的参与（而这始终是一个强有动力）。\n\n我经常在完成 `PCI` 合规评估后，对客户业务运营/安全态势的整体情况比我接触过的任何一个小组都理解得更透彻。我会利用这一点作为优势，帮助讨论他们为了实现合规（安全）需要做哪些新颖且不同的事情，通过教育各个小组，让他们了解自己如何融入业务大局，并理想情况下激发他们为组织的整体利益而贡献一份力量的愿望/动力。\n\
  \n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\n总的来说，我遵循从我 25 多年的咨询经验中学到的教训，并将这些教训包含在一个名为“绝地大师心灵法术艺术”的培训课程中（`[www.cybrary.it/skill-certification-course/art-of-the-jedi-mind-trick-certification-training-course](http://www.cybrary.it/skill-certification-course/art-of-the-jedi-mind-trick-certification-training-course)`）。\n\
  \n基本上我的策略涉及“了解我的听众”之类的点，我会尝试了解他们的一些信息，这样如果我需要使用示例或类比，我可以尝试从他们已经理解的内容中提取。我也尝试学习他们的语言——无论是业务语言、高管语言、HR、法务、技术人员语言或其他。我并不是试图让他们学习我的技术术语；用他们能理解的方式向他们解释是我的责任。\n\
  \n另一个关键策略也是倾听，这不仅有助于了解他们的背景或兴趣或他们使用的语言，还能帮助判断他们是否理解或跟上了我所说的话。讲故事、做类比、寻找共同点或理解基础、保持耐心、尝试多种方法，以及询问“你听我我说了什么？”都是能帮助非技术决策者做出正确（或至少是明智）决定的不同技巧。（这被称为*说服性演讲*。）\n\
  \nWileyPRE\n\n# 25\n\n## April Mardock\n\n![](img/c25uf001.png)\n\n> “我的专业网络安全团队专注于防御，但这种防御延伸到了应急响应、风险管理、业务连续性计划和灾难恢复。”\n\
  \n**Twitter:** [@aprilmardock](https://twitter.com/aprilmardock) • **Website:**\
  \ [www.linkedin.com/in/aprilmjwork](http://www.linkedin.com/in/aprilmjwork)\n\n\
  April Mardock 在 132 家不同的公司支持过网络安全和信息技术。她非常熟悉复杂的层层环境，目前是一个拥有 60,000 名用户的学校的功能 `CISO`。她拥有\
  \ IT 硕士学位和 `CISSP` 安全认证，以及其他行业认证。April 目前的职责包括现场审计、信息安全策略管理、灾难恢复和业务连续性咨询、防火墙管理、渗透测试、电子邮件垃圾网页过滤以及现场网络取证。\n\
  \n## 你如何定义蓝队？\n\n对我来说，蓝队是所有参与业务资产防御的人。有些人是全职参与，有些人是兼职，有些人只是偶尔参与，但现实中我们都是蓝队的一员，因为每个人都有责任在日常工作中实践防御网络安全。看到就说。\n\
  \n我的专业网络安全团队完全专注于防御，但这种防御延伸到了应急响应、风险管理、业务连续性计划和灾难恢复。我们还在进行董事会工作，通过改变业务运营来更好地管理机数据。我们正在利用一切杠杆从内部向外改变组织。我的蓝队甚至延伸到了外部合作伙伴，比如在员工睡觉的晚上和周末监控我们组织的\
  \ `SOC`。\n\n## 蓝队应该具备哪些核心能力？\n\n蓝队成功需要两点：对终端用户的同理心以及推动必要变化的坚持。大多数攻击并不是通过狩猎来停止的；攻击是通过遵循最佳实践（如定期补丁、跟踪告警、移除管理员权限和阻止横移动）停止的。\n\
  \n### 应急响应计划有哪些关键优势？\n\n一个良好的应急响应计划在战术层面和战略层面都理解威胁。\n\n*   战术层面，意味着尽可能详细地说明许多步骤，以便技能最低的人员也能取得成功。\n\
  *   战略层面，意味着跨越组织，涵盖高管、公关、法务、风险管理和其他团队，并积极让他们作为响应工作的一部分参与进来。\n\n\n\n\n一旦建立，应急响应计划就需要在组织的各个层级进行定期测试和修订。\n\
  \n## 蓝队成员如何学习、实践和成长？\n\n在我们公司这种规模的组织中，信息安全（InfoSec）蓝队每天都有学习、实践和成长的机会。这就是管理 60,000\
  \ 台计算机的优势之一；从不缺乏威胁。关键在于保护团队的时间，防止他们被组织的其他需求（如取证请求和调查）耗尽精力。\n\n### 你如何奖励优秀的蓝队工作？\n\
  \n奖励通常取决于团队的每个成员。对于内向者，一张小小的礼品卡可能会让他们感激；对于外向者，可能是在公开会议上口头表感谢。蓝队通常受到服务被认可的激励，特别是当他们的表现超出职责范围时。我曾见过总监给我的高级安全工程师送过一个写有“飞向球场”字样的签名足球，因为他非常擅长预判和拦截威胁。\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护成功的信息安全计划？\n\n蓝队的指标取决于角色。它可能简单到“过去 30 天内安装了最新补丁的系统百分比”。但它应该是针对那些被认为高风险的事项的指标。\n\
  \n### 如果你是一个安全基础设施简陋的中小型企业中唯一的信息安全人员，你将从何处开始？\n\n仔细研究一下 `NIST CSF`。然后创建一个系统清单。你拥有什么？它们是做什么的？然后对你当前的漏洞和弱点进行优先级排序，通过计算你的\
  \ `Worry Index = (%对业务的影响) × (%事件发生的概率)` 来进行排名。将你有限的资源集中在你最关心的五个问题上。对我们来说，这包括钓鱼攻击和勒索软件。\n\
  \n## 性价比最高的安全控制措施是什么？\n\n没有标准答案。就低成本/无成本选项而言，停止赋予用户管理员权限并开启 `LAPS`（阻止横向移动）。这将减慢任何潜在攻击者的速度。然后强制从外部访问时使用\
  \ `MFA`。如果必须，可以创建一个例外组，但 `MFA` 是一个巨大的游戏改变者。\n\n### 你们组织实施过任何欺骗技术？\n\n是的，我们利用了一些简单的欺骗技术。我们开启了内部邮件中继，并在有人尝试使用它时设置了简单的\
  \ `BLAT` 警报。我们使用了更优雅的工具如 `Kushtaka` 来建立一个“虚假” `FTP` 服务网络，以捕获寻找未受保护数据的恶意分子。我们甚至使用了蜜罐令牌（honey\
  \ tokens）来标记导出的数据，这样如果数据出现在其他地方，我们就可以进行指纹识别。所有这些手段都能让我们及早发现来自好奇好奇的学生和恶意分子的探测活动。\n\
  \n### 组织应该在何时使用加密技术？\n\n我们都需要养成对静态数据加密的习惯，这在我看来或许是加密最关键的用途。但加密还应该用于在全球范围内验证每台主机，并帮助组织清晰地划分可信与不可信的主机及用户。顺便提一下，我们还需要更有针对性地保护我们的加密私钥对和\
  \ `API keys`。\n\n## 你如何处理数据治理以及减少数据足迹的方法？\n\n与法律团队合作；了解他们在使用什么工具进行电子数据（e-discovery），并利用相同的系统识别整个网络中的风险数据，如\
  \ `SSN` 和信用卡数据。然后隔离并整合这些风险内容，在其周围增加额外的控制措施以审计和控制其使用。你有时也可以利用相同的系统来识别过时数据：与组织合作删除你不需要的东西！如果它消失了，就无法被盗。示例包括自动删除离职的家庭驱动器（包括云数据）。\n\
  \n## 你对合规性有什么看法？\n\n将合规检查清单视为发现遗漏的机会，但*永远不要*假设合规检查清单意味着你能够抵御攻击。每个组织的风险指纹都是不同的，因此所有缓解计划都应该有所不同。\n\
  \n> 每个组织的风险指纹都是不同的，因此所有缓解计划都应该有所不同。\n\n### 是否有一个框架可以将蓝队执行的活动或功能与监管合规性要求对齐？\n\n没有完美的框架。有些框架会向你推销听起来很好的对齐策略和解决方案，但为团队守住底线取决于你自己。你的重点应该是你的清单和定制的风险配置。你的大部分工作应该与业务优先级和评估过的风险保持一致。合规性工作是一种必要的恶，但你需要努力避免产生虚假的安全感。“勾选所有方框”永远无法防止你被攻破（pwned）。\n\
  \n### 你如何动组织的所有不同部门以实现防御最大化？\n\n对我来说，每个人都参与网络安全。我将其称为“人类防火墙”。我们每一个人都承担防御责任。要让蓝队工作成功，你必须嵌入到组织的每一个层级。对于我的终端用户，是教育他们他们的密码就像牙刷一样——不要分享，并且要经常更换。对于我的开发人员，是深入到\
  \ `SDLC` 过程中，帮助他们在风险变成负债之前对其进行评估。对于我的运营团队，是帮助他们确定补丁的优先级，以便首先处理最高风险。对于我的网络安全和响应团队，则是在每次事件后进行学习和改进，处于一个持续反馈的紧密循环中。\n\
  \n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\n我与高管沟通时最成功的策略是证明他们那些最有能力的同僚正在这样做。如果像我这样的其他机构采取了同样的预防措施，高管通常更愿意考虑该请求。来自州或联邦官方渠道的警告也是如此——如果他们认为该请求具有某种外部“可度”，他们更有可能允许业务中断或提供额外资金。\n\
  \n另一个对非技术决策者有效的方法是有效的类比。用他们可以理解的方式进行解释，以便他们向更高层进行汇报。保持简单、相关且易记，就像密码的牙刷类比一样。\n\n\
  ## 在重大持续事件期间，对于管理非技术高管的预期你有什么建议？\n\n如果你在之前已经沟通过应急计划并进行过桌面演练，将会很有帮助。最好的是在进入紧急状态之前已经建立了高管的信任。他们需要见过你，并对你的数据以及团队的决策能力表示信任。\n\
  \n\n\n\nMawudor 博士在韩国浦京国立大学获得 IT 融合与应用工程博士学位，专注于信息安全方向。他曾在 120 多场网络安全会议上发表过演讲，并在各大学进行过教学。\n\
  \nMawudor 博士对网络安全工具进行了多种评估和选择，并成功实施了 IT 安全系统，以保护关键业务环境的机密性、可用性和完整性，抑制并缓解风险。\n\n\
  ## 你如何定义蓝队？\n\n蓝队是一个防御性安全团队，专注于提高组织的安全态势。蓝队识别入侵、执行事件响应、进行恶意软件分析，并制定避免未来潜在攻击的策略。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n入侵识别和事件响应。\n\n## 应急响应计划的一些关键优势是什么？\n\n- **计划：** 一份良好的应急响应计划可以帮助团队应对威胁，概述如何隔离事件、分配严重程度评分并停止攻击。\n\
  - **人员：** 蓝队需要互补且良好的沟通技巧，这些技巧结合使用可以增加制止对手的几率。\n- **正确的工具：** 在蓝队中使用错误的工具会大大增加事件的平均响应时间（`MTTR`）。\n\
  \n## 蓝队成员如何学习、实践和成长？\n\n- 根据频率、方法和严重性，关注当前及以往的威胁。\n- 理解他们从环境中收集了哪些输入数据（`logs`、`SNMP`、`NetFlow`\
  \ 等）以及如何解释这些数据以检测和关联事件。\n- 适当沟通和信息共享以缩短 `MTTR`。\n- 在控制环境中进行紫队演习以学习对手的行为。\n\n## 你如何奖励优秀的蓝队工作？\n\
  \n金钱奖励通常认为对团队成员非常好，但我们组织达成了一项协议，在公司会议和团队聚餐期间认可团队的工作，最重要的是，让组织赞助他们用于职业发展的认证课程，这些课程通常很昂贵。\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护一个成功的信息安全计划？\n\n定期衡量唯一事件的事件响应时间 `MTTR`。\n\n## 如果你是一家安全基础设施简陋的中小型企业中唯一的信息安全人员，你会从哪里开始？\n\
  \n识别一个适合业务的框架，并使用开源技术实现任务自动化以始终保持可见性，因为这不涉及大量的资本支出。这将通过向员工开展定期安排的安全意识培训并测试一些课程（如钓鱼攻击）来提供支持。\n\
  \n## 性价比最高的安全控制措施是什么？\n\n始终保持可见性，并制定好响应事件的策略，以便在最短时间内确定根本原因。主要是准备好一个具有最新备份的灾难恢复站点，以便在需要时进行故障切换。\n\
  \n## 你的组织是否实施了任何欺骗技术？\n\n从好的一方面来说，蓝队可以学会对手规避技术并获得如何阻止它们的见解。缺点是，如果欺骗技术与生产环境隔离开，会导致误报率激增。这允许对部署在环境中的蜜罐进行微调，一个非常好的例子是\
  \ `RedCanary` 令牌，它可以放置在网络、系统、应用程序和 Web 服务器中。\n\n## 组织应该何时使用加密？\n\n加密确保了组织数据的机密性和完整性。此类数据可能包括密码和知识产权。传输中和内存中的数据应采用加密，以防止入侵者在攻击成功获取访问权限时导致损害。\n\
  \n> 加密确保了组织数据的机密性和完整性。\n\n## 你如何处理数据治理以及减少数据足迹的方法？\n\n组织需要采用将用于治理数据的框架。必须执行规则和政策，例如为负责数据资产的员工分配责任。减少数据足迹需要对数据进行分类以及充分的存档、压缩和备份。不再需要的旧数据可以归档，并注意去重和计划备份。\n\
  \n## 你对合规性有什么看法？\n\n对于不理解合规对法律实体可能产生的影响组织来说，合规仍然是一个难以接受的概念。保护个人数据和隐私需要大量的意识，不仅要了解如何执行，还需要了解组织在未能采取它时将面临的处罚和成本。这种意识始于了解自己是数据控制者、数据处理者还是共同控制者。\n\
  \n## 是否有一个框架可以将蓝队执行的活动或功能与监管合规要求对齐？\n\n适用于蓝队的框架会因公司而异。如果涉及卡数据，某些公司可能受 `ISO` 管理，另一些受\
  \ `PCI DSS` 管理。`PCI DSS` 关注以下领域：\n\n- 构建并维护安全网络\n- 保护持卡人数据\n- 维护漏洞管理计划\n- 实施强访问控制措施\n\
  - 定期监控和测试网络\n- 维护信息安全策略\n\n拥有此类框架是明智且至关重要的，因为它将蓝队及其活动约束为遵循最佳实践标准。\n\n> 拥有此类框架是明智且至关重要的，因为它将蓝队及其活动约束为遵循最佳实践标准。\n\
  \n## 你如何参与组织的所有不同部门以实现防御最大化？\n\n业务部门将理解对话的内容是关于蓝队暴露和识别的风险，以及如果不处理可能造成的潜在损害范围。进一步的讨论将围绕潜在的暴露区域以及作为实施策略的补救计划进行。\n\
  \n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\n我喜欢使用现场演示来模拟日常看到的某些威胁。例如通过嵌入在 `Excel` 表格中宏的钓鱼邮件发起的勒索软件攻击。我通过复制类似的场景来解释，并使用类似的示例域名将附件作为压缩文件发送给非技术用户。在用户打开后，我使用\
  \ `Metasploit` 等简单框架展示他们只需通过打开一个带有宏或 `DDE` 的简单文档就能对目标获得的控制水平。\n\n如果组织需要购买软件或硬件，我确保已对市场上的最佳产品进行了充分的比较，并准备了概念验证（PoC），以展示它们阻止此类攻击的价值。在这种情况下，一个例子可以是终端检测和响应工具。\n\
  \n## 在发生重大持续事件期间，对于管理非技术高管的预期你有什么建议？\n\n> 事件发生期间需要快速做出决策，我会让非技术高管知道他们是涉及组织福祉的利益相关者。\n\
  \n\n\n\n\n在事件发生期间，需要快速做出决策，我会让非技术背景的高管意识到，他们是关系到组织健康发展的利益相关者。这涵盖了从沟通到立即获取所需的工具，从执行为故障转移起草的事件响应或灾难恢复计划等等方面。业务影响分析以及获得高管的支持对于组织的未来发展始终至关重要。\n\
  \n# WileyPRE\n\n## 27\n\nDuncan McAlynn\n\n![](img/c27uf001.png)\n\n> “蓝队成员是一种特殊的物种。”\n\
  \n**Twitter:** [@InfoSecwar](https://twitter.com/InfoSecwar) • **网站:** [mcalynn.com](http://mcalynn.com)\n\
  \nDuncan McAlynn 是 Operandis 的创始人，也是播客节目 Cyber Speaks LIVE 的节目持人。他是一位拥有 25 年行业经验的信息安全专业人士，目前处于半退休状态，为网络安全行业开发技术内容，并指导下一代网络安全精英。在职业生涯中，他曾为许多财富\
  \ 500 公司、政府机构和教育机构提供企业管理和安全策略方面的咨询。\n\nDuncan 活跃于当地社区，支持安全 BSides 活动，参加当地黑客协会聚会，以及\
  \ ISACA 和 ISSA 会议，他还是 FBI InfraGard 的成员。\n\n## 你如何定义蓝队？\n\n蓝队成员是一种特殊的物种。他们倾向于具有同理心，当看到有人需要帮助就会采取行动提供帮助。当这些世界前线防卫者承担蓝队成员的角色时，同样的真诚原则也适用。他们成为了国家企业、政府机构、非营利组织和学习机构的保护者和防御者。他们直面挑战，面对攻击者。我每天都赞赏他们的努力。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n虽然这看起来显而易见，但我无法如何强调蓝队成员成为一名团队合作者有多么重要。要成为一名有效的蓝队成员，你不仅要与核心团队合作，还要与网络工程、桌面支持、服务器团队合作，更不用说\
  \ CISO 和 CIO 了。这意味着团队合作和沟通（口头和书面）是至关重要的。你不能既是蓝队成员又是一个独行侠侠。\n\n其次，蓝队成员应该对学习新事物充满热情，无论是通过阅读书籍、观看\
  \ YouTube 视频、参加会议还是向同事寻求帮助。蓝队成员应该具备足够的谦虚，知道自己不知道的什么，并表现出学习的意愿。\n\n### 事件响应计划的一些关键优势是什么？\n\
  \n我从担任网络事件的第一响应者中学习到的一点是：适当的、预先计划的沟通可能是成功的事件响应与彻底失败（导致信任丧失以及潜在的法律和财务后果）之间的区别。事件响应计划应该包含一个经过考虑的沟通计划，涉及关键利益相关者，并清楚地说明谁在什么时候说了什么，以确保所发表的声明（内部和外部）不会造成大于益的伤害。\n\
  \n你永远不知道在发生网络安全事件时会需要什么。所以，务必准备一个随时可以出发的“急救包”（jump bag）。这个包包字面上就是一个背包，里面装满了完全修补的笔记本电脑、笔、铅笔、纸、微型打印机、数码相机、手机、内存卡、USB\
  \ 闪盘、手电筒等。这个背包应该在 CIRT 成员之间每月轮换一次并进行备份——始终一个在现场，一个在离现场。\n\n### 蓝队成员如何学习、练习和成长？\n\
  \n如今人们学习知识有很多方法，起初可能因为不知道从哪里开始而感到无从措。然而，大多数人会知道自己属于哪种类型的学习者：听觉型、视觉型或动觉型。幸运的是，现在每种类型都有大量的资源可用。这种学习领域的巨大进步主要归功于互联网。所以我说，利用适合你的任何方法吧！\n\
  \n如果你是听觉型学习者，请注册 Amazon 的 Audible 服务或听一些非常优秀的播客节目。\n\n如果你更偏视觉型学习者，可以在 YouTube 和\
  \ Vimeo 上搜索一些网络安全主题，或者观看 [Cybrary.it](http://Cybrary.it) 和 Pluralsight 上的可用内容。\n\
  \n对于动觉型学习者，没有比建立自己的实验环境来捣腾、搞坏，然后不得不重新开始更棒的方法了。我认识的一些最棒的黑客不得不这样做过几十次，甚至上百次。得益于云计算和虚拟化，这不需要非常昂贵。\n\
  \n### 你如何奖励优秀的蓝队工作？\n\n我并不是说“好样的”（attaboys）就能支付账单之类的，但实际上，公开赞扬团队成员的贡献确实非常有帮助。蓝队工作很多时候是一份不计回报的工作，因为当一切顺利运行时，没有人会注意到；而当发生事件时，你只有一次机会做对。所以，当过程中出现小成就时，得到认可是件好事。层级越高，能做到这一点就越好。\n\
  \n### 蓝队可以使用哪些核心指标来建立、衡量和维护成功的信息安全计划？\n\n我发现，一个组织使用的关键性能指标（`KPIs`）与其他组织之间会有很大差异。但我认为最成功的那些都是短期的、可衡量的且可重复的。也许是降低\
  \ `MTTD` 或提高应用软件更新的响应时间，甚至是参与并实施一项新的漏洞赏金计划的结果。无论情况如何，它的成功取决于团队成员，他们应该得到认可。\n\n###\
  \ 如果你是中小型企业唯一的安全人员，你会从哪里开始？\n\n在这里，我会依靠互联网网络安全中心（CIS）的 Top 20 安全控制措施，重点关注实施小组 1（IG1）。\n\
  \n*   硬件资产清单与控制\n*   软件清单与控制\n*   持续漏洞管理\n*   权限控制\n*   移动设备、笔记本电脑、工作站和服务器的安全配置\n\
  *   审计日志的维护、监控和分析\n\n该框架基于全球行业专家的投入，并提供了一种简单的方法，帮助不同规模的组织在正确的时间专注于正确的地方，同时利用 `CIS\
  \ Controls` 计划的价值。更多信息请访问 [www.cisecurity.org](http://www.cisecurity.org)。\n\n###\
  \ 什么是性价比最高的控制？\n\n补丁。补丁。补丁。\n\n### 你的组织实施过任何欺骗技术吗？这对这对蓝队的检测能力产生了什么影响？\n\n高保真传感器（例如由\
  \ Tribe of Hackers 贡献 Jared Folkins 维护的开源 `Kushtaka`）在企业的深度防御方案中有一席之地。关键在于“高保真”。当正确实施和使用时，这些解决方案可以通过缩短平均检测时间（`MTTD`）帮助防止基础设施泄露演变为数据泄露。这些传感器让蓝队在攻击者触发巧妙布置的资产时立即收到通知。他们可以对警报采取行动，例如阻止攻击者的\
  \ IP 地址或使用 `SOAR playbooks` 自动化过程。\n\n组织应该在何处使用加密？\n\n\n\n\n\n与其解决“哪里”，我更想探讨一下“为什么”。随着对消费者数据安全处理的法规日益严格，如今机构要按常开展业务正变得越来越具有挑战性。\n\
  \n> 随着对消费者数据安全处理的法规日益严格，如今机构要按常开展业务正越来越具有挑战性。\n\n虽然这对于数据隐私和保护倡导者来说是个好消息，但这意味着公司在处理任何个人身份信息（PII）时必须非常谨慎，因为新的法律正在以飞快的速度不断出台。\n\
  \n如果收集了这类敏感数据（例如出生日期、健康记录、社会安全号码或信用卡号），那么州、联邦或行业法规可能要求这些数据在静态存储、传输中或使用过程中必须进行加密。\n\
  \n如果你的机构不确定哪些要求适用于他们，对于美国公司，一个很好的起点是当地的州务卿部门；在欧洲，可以咨询你的国家数据保护机构：`[edpb.europa.eu/about-edpb/board/members_en](http://edpb.europa.eu/about-edpb/board/members_en)`。\n\
  \n## 你对合规性有什么看法？\n\n合规性 ≠ 安全。很多时候，机构会过度关注获得某个特定的合规级别，以至于“见树木不见森林”。在追求获得某些行业或联邦合规标志的途中，他们忽视了一些能够缓解风险和减少漏洞的最基础的安全控制措施。\n\
  \n> 当你将安全融入你的技术栈的设计、构建和开发时，合规性会变得容易得多。\n\n当你将安全融入你的技术栈的设计、构建和开发时，合规性会变得容易得多。\n\n\
  ## 是否有一个框架可以将蓝队执行的活动或功能与监管合规要求对齐？\n\n有的。美国标准与技术研究所（`NIST`）《改进关键基础设施网络安全框架》已迅速成为行业宠儿，作为整体战略的一部分来应对机构的网络安全风险。该框架具有足够的活性，各种规模和行业的机构都可以根据其独特的威胁类型、漏洞和风险承受能力来实施。\n\
  \n### 你如何参与组织中的所有不同部门以实现防御最大化？\n\n尽早且频繁。另一个过度劳累小组最不希望的就是我们在最后时刻意料之外地给他们丢下更多任务。我们与其他小组的沟通和协作越频繁越好。我还发现，早餐塔可饼（breakfast\
  \ tacos）是多团队协作成功的关键。\n\n### 你使用什么策略来向非技术决策者传达你遇到的威胁？\n\n风险是董事会室的语言。在与高管交流时，我学会了谈论那些最能引起他们共鸣的话题。\n\
  \n> 在与高管交流时，我学会了谈论那些最能引起他们共鸣的话题。\n\n就我们的工作而言，这意味着要谈论他们所面临的风险。\n\n## 在重大持续事件期间，对于管理非技术高管的预期你有什么建议？\n\
  \n早期建立信任是网络安全相关事件期间设定预期的关键因素。无论你是在与一线人员交流，还是直升到董事会进行汇报，这一点都适用。信任来自于自信，而自信来自于经验。这就是三位一体。\n\
  \nWileyPRE\n\n# 28\n\nFrank McGovern\n\n![](img/c28uf001.png)\n\n> “猜猜怎么着？你是这支蓝队的一部分。这里没有隔阂。我们为了同一个目标并肩战斗。”\n\
  \n**Twitter:** `[@FrankMcG](https://twitter.com/FrankMcG)` • **Website:** `[www.frankmcg.com](http://www.frankmcg.com)`\n\
  \nFrank McGovern 是 Blue Team Con 的创始人，这是一场专注于蓝队社区的信息安全会议。他也是伊利诺伊州芝加哥的高级信息安全工程师。Frank\
  \ 在大型机构中拥有小型网络安全团队的独特背景。因此，他协助网络安全架构、实施和运营。他目前还负责组织网络安全策略的编写以及其网络安全 GRC 项目的实施。他来自海军陆队情报背景，这在他的网络安全生涯一直受益。\n\
  \n## 你如何定义蓝队？\n\n蓝队是致力于防御组织资产的人员结晶。这意味着你的头衔并不重要；重要的是你正在做的工作。你是中学里管理防病毒软件的 IT 人员吗？你是蓝队。你是\
  \ `GRC` 人员（如审计员）吗？你是蓝队。你正在进行安全编码吗？你是蓝队。你甚至是一个攻击性安全红队成员吗？猜猜怎么着？你是这支蓝队的一部分。这里没有隔阂。我们为了同一个目标并肩战斗。\n\
  \n### 事件响应计划的一些关键优势是什么？\n\n优势在于能够维护一份教训总结文档并在随后的会议中反思这些教训。通过持续成熟的方法来适应环境，是成功防御任何未来风险的关键。\n\
  \n## 蓝队成员如何学习、实践和成长？\n\n学习对每个人来说并不是一条路。有些人通过阅读学习，有些人通过实践学习。你学习、实践和成长的最好方式是找到适合自己的方法，不要通过他人来衡量自己。你正在走你自己的路，你比任何人都更清楚什么适合你。关注这一点，你就会发现自己不断达成各项里程碑。\n\
  \n如果你是在一家安全基础设施简陋的中小型企业中唯一的信息安全人员，你会从哪里开始？\n\n通过安装主机防护来移除管理员权限将产生最大的投资回报（ROI）。从那里开始，你需要通过资产管理完全了解环境中的情况。一旦处理了这些基础问题，就开始解决\
  \ `CIS Top 20` 控制措施。\n\n### 哪种安全控制性价比最高？\n\n移除管理员权限。紧随其的是在尽可能的范围内实施多因素身份认证。许多人关注实现\
  \ 100% 的解决方案。即使移除 75% 机器的本地管理员权限也是一种胜利。实施 50% 的 `MFA` 也是一种胜利。开始这段旅程，你终到达终点。\n\n\
  ## 你对合规性有什么看法？\n\n合规性是一个很好的定义基准的检查清单。从那里开始，你应该发现差距以及业务中其他关注的问题，并实施更多控制措施。总有一些合规性没有强调的问题需要解决，而作为蓝队成员，你的职责就是点明这些风险。\n\
  \nWileyPRE\n\n# 29\n\nDonald McFarlane\n\n![](img/c29uf001.png)\n\n> “蓝队必须拥有核心智力好奇、审慎且对所属领域充满热情的成员。”\n\
  \n**Twitter:** `[@dsmcf](https://twitter.com/dsmcf)` • **Website:** `[www.linkedin.com/in/dmcfarlane](http://www.linkedin.com/in/dmcfarlane)`\n\
  \nDonald McFarlane 提供管理层/董事会咨询和“虚拟 CISO”服务，主要面向企业领域。他是一位热情的信息安全架构师和风险管理传播者，帮助运营\
  \ DEF CON 的 Skytalks 并为多个其他行业会议贡献时间。\n\n\n\n\n他实施、运营和保护 IT 系统的经验起得很早，在预读学校就开始运行自己的\
  \ BBS，并从当地大学丢弃的线打印机输出物中“捡捡垃圾”。他的第一份有薪信息安全工作是为英国版的 DARPA（高级研究计划署）保护 Unix 系统。从那以后，他保护了在线交易系统、全球数据中心以及\
  \ 100 多个国家的分支网络，并对多项数十亿美元的收购、合并和剥离提供过建议。\n\n当他没有思考事情可能如何出错时，他会做饭、打高尔夫，并经营一家小型 ISP（互联网服务提供商）。他与妻子、儿子和狗住在新罕布什州山坡旁自己建造的一栋木屋里。\n\
  \n## 你如何定义蓝队？\n\n蓝队/红队的概念是模拟与威胁的对抗，以改进企业的防御能力，并学习更好的防御策略和恢复策略。整个安全团队的责任是通过理解理解涉及的危害并促进适当的风险降低来吸纳这些教训。事后报告（After-action\
  \ reports）应该涉及红蓝双方团队、安全领导层以及其他可能的 IT 和业务部门（BU）领导层，而且无论政治因素如何，都应该保持透明和诚实。\n\n大多数组织会希望根据当前练习的任务，在蓝队中进行关键安全人才的轮换。这种方法——实际上整个蓝队/红队方法——只有在你的核心安全团队拥有深厚且广泛的实力时才能运作。你还应该准备好从安全团队之外识别人才，这可能对任务有益。\n\
  \n尽管如此，你应该意识到，行业中许多人并没有采纳这种对蓝队的理解，而是将该术语泛泛应用于组织的所有防御者，或者至少是所有职位头衔中带有“安全”字样的人。这不是一个有用的定义。在涉及安全时，公司里的每一个人，不用说安全团队，都有可以发挥的角色。这项工作并非开始或结束于任何单一学科，蓝队成员应该将他们的经验带回自己的主要角色，在此过程中提升所有人的水平。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n要很好地设计某个东西，必须理解其用例和正常故障模式；要很好地保护某个东西，在此基础上还要增加对潜在滥用途径和意外故障模式的理解，并在某种程度上理解可能参与此类滥用的威胁模型和攻击者。这一切要求具备理解和探索堆栈所有层的能力和意愿。\n\
  \n因此，蓝队必须拥有一支核心成员，他们智上充满好奇心、深熟虑，并对工作领域充满热情。团队内部必须培养对技术栈、生命周期，以及这些技术所包含的风险和流程的广泛知识。\n\
  \n其次，无论个人团队成员或小组有多聪明，只有当蓝队成员花时间与 IT 和业务版图中其他团队的对应人员密切互动时，蓝队才能发挥最佳作用，共同理解特定的环境、活动、挑战和挫败感。他们必须重视业务风险和流程，识别出使业务运行以及值得防御的事物的优先级。\n\
  \n就像蓝队一样，整个 IT 安全团队应该理解，他们的使命是使业务（或其他实体）生存并繁荣，而不是为了将其防御到超出任何可能的的地步。鼓励一种超越下季度收益或下份年度报告——甚至超越继任\
  \ CEO 或 CIO 任命的长期眼光，这可能完全不是一件坏事，但未能理解“安全”决策的更广泛背景就是坏的。那些无法识别细微差别并无法概念化不同风险之间相互作用的教条派团队成员，可能会助长错误的决策，或维持一个功能失调的“拒绝部门”模型，这不适合安全团队。在事件中派遣安全团队是因为他们被认为是有益的，而不是被视为必要的恶。尽管如此，为了进行适当的倡导，团队核心必须口能善辩，并精通推理、论证和历史背景。\n\
  \n## 蓝队成员如何学习、实践和成长？\n\n花时间与他人交流和协作。参加会议（为了从他人那里学习并互动，而不仅仅是听演讲）。尝试参加 `CTF` 并学习一些红队技术。广泛阅读，而不仅仅是安全类书籍。如果你的管理层不支持交叉培训，请询问他们并解释原因。如果你感到没有挑战，请问问自己为什么；如果你不喜欢那个答案，请更新简历，并愿意尝试不同的角色。即使你本质上是一个安全人员，也应考虑离开安全领域几年以获得其他视角。\n\
  \n作为一家公司，练习失败的艺术。如果这听起来很奇怪，请看看 Netflix 十年来在混沌工程方面的所作，并考虑你们的 `DR`（灾难恢复）、`BCP`（业务性计划）和事件管理测试计划是否达到了预期目标。进行“如果……”的情景模拟。与经历过泄露的人交谈。噢，而且你们有红队，对吧？\n\
  \n## 如何奖励优秀的蓝队工作？\n\n我尝试对个人的需求和兴趣保持敏感。有时，雇主传统的绩效激励和正强化技术效果最好，但要根据具体情况调整你的方法。这可能是在公司论坛之外（甚至是推特）给予表扬和认可，增加培训/工具，留出时间从事有趣且能提高水平的个人项目，提供灵活的时间和地点，或者允许向黑客社区发布（经过适当脱敏处理的）工具/技术/经验。几乎总方法可以满足双方并实现互利。\n\
  \n红蓝队之间应该存在竞争精神，你们应该记住，工作提供的实践机会往往比具体的成果和教训更有价值。\n\n\n\n所以，第一个问题是，你试图推动什么变化，其相对优先级是什么？为了回答这个问题，首先要了解你目前处于什么成熟度，以及提升到下一个阶段的合理目标。与几位更明智、更具“机灵”且理解人性的同事进行头脑风暴，以理解你首次创建正确指标时实际上会导致哪些负面行为。然后进行迭代。在此之后，且仅在此之后，再发布。准备好随着成熟度的提高而调整指标，但要清楚，这样做会让你丢失（或产生不连续的）趋势数据，因此，尽可能在设计每项指标时，都要使其能够贯穿其旨在促成的变革的整个生命周期。\n\
  \n作为一个一般原则，量化指标应该是基于风险的，而不是基于合规的。你的目标应该是有效地降低风险，这自然会产生合规态势。然后你可以对合规性进行定性评估，并弥补任何剩余的微小差距。如果你衡量的优先事项是合规，那么当结果证明解决方案没有达到你预期的风险降低水平时，不要惊讶。\n\
  \n噢，至于红队与蓝队的对比指标？当然，你可以衡量特定任务目标的简单成功或失败。但如果意图是鼓励和奖励优秀工作，那么通过同事和领导层对已完成的工作进行主观评估会更好。如果你真的想将其转化为指标，那么在你的下次行动后报告（after-action\
  \ report）中加入一轮意见评分（mean opinion scoring）环节。\n\n### 如果你是一家安全基础设施原始的中小型企业唯一的信息安全人员，你会从哪里开始？\n\
  \n了解你自己。当然，当你巡视防御工事时，你可能想在此启动几个并行线程，以顺便解决一些最显而易见的巨大漏洞。但要花几周时间了解你的资产——系统、网络、软件、数据、业务模式和关键流程、人员、风险承受能力、历史、失败案例、根源以及可用预算。做一个\
  \ SWOT 分析。挑选一些主题，并向人们询问“五个为什么”（five whys）。了解在业务层面和 IT 层面，王国的钥匙在哪里。了解什么让你的董事会（或伙伴或所有者）以及高级管理层彻夜难眠。了解你的客户。然后喝杯好茶，在你职业生涯中第无数次翻阅\
  \ `SANS top 20` 列表或你其他喜爱的备忘清单，仔细思考你的下一步。\n\n如果这太令人令畏了，就从网络图、防火墙规则以及软件/应用程序列表开始。\n\
  \n## 性价比最高的安全控制措施是什么？\n\n`DNS logging`。捕获并管理所有通过各种传输协议的 `DNS` 请求，记录它们，并建立监控和告警。你可以使用黑名单/白名单方法来减少噪声，建立基准并观察流量异常来检测\
  \ `C2` 通道，你甚至查看其他上下文细节，例如域名注册的时间。\n\n## 你的组织是否实施了任何欺骗技术？\n\n从 20 世纪 90 年代就开始使用简单的蜜罐（honeypots）和其他虚假误导目标了。尽管现在有很多供应商试图进入这一领域，并从那些追求“不遗留任何安全工具”策略的公司手中赚取额外收入，但事实是，这并不困难，也不贵。如果你已经建立了基本的日志记录和告警机制，或者……（注：提供的文本在后半部分包含一些重复/混乱的表述，我已按要求保留了核心含义）。\n\
  \n如果你已经建立了基本的日志记录和告警机制，或者……（注：提供的文本在后半部分包含一些重复/混乱的表述，我已按要求保留了核心含义）。\n\n*（自纠：提供的源文本后半部分从“If\
  \ you have basic logging...”开始包含大量的重复和无意义的句子。我已根据指令清理了格式，同时保持了提供的文本。）*\n\n\n\n\n\
  \n# 如何调动组织的所有不同部门以实现防御最大化？\n\n不要仅仅局限于记记式的安全培训——安全意识应该是频繁且开放的对话。人们需要提醒和练习来养成良好的习惯，大多数人在理解并相信“**为什么要这样做**”而不仅仅是“**做什么**”时会学得更好。\n\
  \n举办教育座讨会，向不同部门和领导层简述他们特别感兴趣的安全相关话题。调动观众参与，挖掘他们的恐惧和兴趣。与他们讨论工作之外以及个人生活中的安全问题。IT 团队应该与运营部门和非\
  \ IT 人员合作，确保安全被理解是一项共同责任，许多团队在其中发挥作用，并且每个人都知道如何做并感到被授权去执行。开展桌面演练，让安全团队参与业务连续性和灾难恢复演练，运行攻击模拟以练习事件处理。\n\
  \nWiley\n\n![](img/c001.png)\n\n> 在我看来，`蓝队`这个词不应该那么模糊，以至于清楚其中包含哪些人。\n\nTwitter:\
  \ [@nathancnulty](https://twitter.com/nathancnulty)\n\nNathan McNulty 是一个拥有超过 40,000\
  \ 名学生大型地区的安全架构师。他拥有计算机科学学学位，职业始于 IT 帮助台，然后转到学区的桌面工程，并在那里管理了一切。在过去的四年里，他专注于安全工作，利用\
  \ `Graylog`、`Nessus`、`Panorama`、`Microsoft 365` 和 `Kali` 进行渗透测试。Nathan 还担任 [OpsecEdu.com](http://opsecedu.com)\
  \ 的董事成员，致力于赋能和培养信息安全人才。\n\n## 你如何定义蓝队？\n\n我个人将蓝队定义为那些负责积极直接保护组织的人，无论是通过实施安全控制来防止事件，还是通过对事件做出响应。我更倾向于定义明确的角色，虽然网络管理员可能会执行蓝队活动（如对防火墙进行安全更改），但我认为，`蓝队`这个词不应该那么模糊，以至于清楚其中包含哪些人。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n良好的人际技巧和对细节的关注。技术方面很少是阻碍因素。实施积极变化通常取决于能否向多个层面（在 C 管层、安全团队、帮助台和终端用户之间）准确解释风险和对组织的影响。当你专注于与团队内部或外部的人交流时，你会获得同理心，这通常会导致更好的解决方案，最大限度地减少对用户的影响，并帮助赢得他们对未来项目的信任。从长远来看，这比你试图实现的任何单一安全控制都重要。在我看到的每份职位描述中，“关注细节”都被轻描描写，但随着我们系统复杂性和攻击者技能水平的提高，那些细微的细节可能是捕获或错过攻击者、或意外破坏业务关键系统的关键。\n\
  \n准备工作和态度决定一切。因为 `IR`（事件响应）对大多数人来说都是压力巨大的，我们的大脑并不会像通常情况下那样过滤和处理我们的反应。培训、桌面演练和回顾之前的案例是重要的，这可以让我们在实战中保持冷静。这种培训的一个主要应该是专注于保持积极、互相鼓励，并不惜一切地避免指责失败或推卸责任。想想当同事严重生同时你是如何反应的。你不会埋怪他们并因为他们没有工作而感到愤怒；你会寻找帮助他们的方法。\n\
  \n在危机期间，很容易产生隧道视野并只关注自己的事情。对那些挣扎或陷入困境的人保持开放的耳朵，特别是在你可能擅长的领域。提前建立的良好关系在这里会有巨大帮助。当帮助的机会出现时，务必提问或征求许可提供反馈。这让他们感到不那么受威胁，让他们保持控制权，并更容易尊重他们的决定。\n\
  \n## 蓝队成员如何学习、实践和成长？\n\n我深信最好的学习和成长发生在社区背景下。我们每个人都有许多他人永远不会拥有的经历，通过分享这些经历，我们获得了更好的理解和同理心。这可能表现为参加舒适区之外的项目，或临时填补另一个团队的空白。\n\
  \n对于个人学习，网上有大量的免费资源：YouTube、播客、社交媒体、像 `Cybrary` 或 `Lynda`这样的课程目录，以及来自 `SANS` 或 `CIS`\
  \ 等小组的内容。最重要的部分是将其视为优先事项。确定你如何学得最好以及向谁学得最好，并实现它。\n\n对于实践，没有什么能比得上动手学习，比如家庭实验室、`Raspberry\
  \ Pi` 或云开发者账户。我经常尝试新产品，测试控制的有效性，或者运行通常在工作中无法执行的指南。虽然许多人认为这是把工作带回家里，但我认为大家将其看作是对自己的投资。它会有回报的。\n\
  \n## 你如何奖励蓝队的工作？\n\n了解团队中每个人对来说“奖励”意味着什么是一个好主意。有些人被肯定的话激励，有些人被礼物激励，另一些人被公开认可。这可能是一条简单的短信表示你感谢某人、在员工会议上对其贡献的认可、额外的年假或奖金。奖励本身没有你给人们带来的感受重要。让你的团队感到被重视，不仅通过你的言语，还通过你的行动。\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护成功的信息安全计划？\n\n对于一个简单的模型，映射到某个框架甚至 CIS 前 20 项，都是设定目标和跟踪进展的简单方法。通过为这些控制措施映射映射值（无论是在实施还是改进它们）来实现指标，然后根据你组织的威胁概况对它们进行优先级排序。漏洞管理也可以映射到这里。\n\
  \n我的流程是为每个数据领域创建一个文档（例如，电子邮件安全、终端加固、SIEM、身份等）。在每个文档中，我根据框架或任何合理的方式创建类别。现在，当我学到新的技术、改进想法或需要注意的事项时，它们被放入相应的类别中，作为待办事项、创建为变更管理的议题（issue），并在完成后删除。\n\
  \n现在，我可以回顾这些每一项的提交历史，并跟踪已完成的进展。当我关注所有尚未完成的事情时，我往往会感到沮丧，因此拥有这些进展可以供回顾非常有帮助，并能让我们意识到已经做了多少优秀的工作。\n\
  \n\n\n\n\n我获得最高投资回报的投入是对我的运营团队进行教育和授权。你永远无法跟上运营团队所做出的变更数量，相反，你应该专注于让他们理解“默认安全”，使安全成为文化的一部分，并成为他们正常思维流程的一部分。此外，这是无法逃避的；你将需要依靠他们来完成资产清单工作。\n\
  \n特别是在刚开始时，我认为至关重要的是将大部分精力集中在你自己最擅长的事情上，把它做好，并努力学习你的下一个优势知识领域，按列表逐一攻克。对我而言，`email`、`endpoints`\
  \ 和 `identity` 是我最擅长的领域，正因为这些领域做得很好，才与我的团队建立了信任，使得处理较薄弱的主题成为了一项更更容易的任务。\n\n如果我要从零开始构建网络，那么它将完全取决于\
  \ `NAC` 如何控制允许连接的内容以及它们被分配到哪个网络分段。这使得监控变得更容易管理，因为我现在可以更好地定义我在每个分段中要寻找的内容，并真正减少我所处理的数据“大海针”规模。\n\
  \n## 性价比最高安全控制是什么？\n\n特权身份管理。这意味着从终端用户处移除管理员权限，并且不在 `endpoints` 之间共享管理员权限。为你的系统、网络和安全团队将普通凭据和管理员凭据分开，并仅允许这些管理员凭据在不允许其他账户登录的加固系统上使用。在你可以控制的一切设备上为这些管理员账户启用多因素身份验证。最后，在可能的情况下，使用特权访问管理解决方案来启动审批工作流，仅在完成工作所需的时间内，将这些管理员账户提升为管理员角色。\n\
  \n## 你的组织是否实施了任何欺骗技术？\n\n我已经部署了几个 `honeytoken` 账户几年，这些账户分布在我们大多数服务的几个不同权限级别中，包括\
  \ `AD`、`Office 365` 和 `G Suite`。对于蜜罐（honeypots），我最初从 `OpenCanary` 开始，现在我正在使用 [Kushtaka.io](http://Kushtaka.io)\
  \ 的预发布版本。\n\n我的传感器经常触发报警，但公平地说，在 40,000 多名学生中，可能只有几百人真正知道如何窥探和寻找东西。他们充满好奇并试图学习，这给了我一个机会，在他们陷入太大麻烦之前，将这种能量引导到适当的学习资源上。我非常感激传感器带我的安全感，如果没有它们，我的响应时间将会受到影响。我喜欢将其视为一种保单，同时我继续在其他领域构建和增强我的检测能力。\n\
  \n## 组织应该在何处使用加密？\n\n尽可能在任何地方。我们越来越意识到对静态存储、内存和传输中数据加密的必要性。如果我列出一个简短的示例，将包括全盘加密、所有浏览使用\
  \ `TLS 1.2+`、`VPN`、网络访问（`EAP-TLS`、`802.1x`）以及对脚本和其他代码进行数字签名。\n\n## 你如何处理数据治理以及减少数据足迹的方法？\n\
  \n由于我们必须遵守州政策，我们必须根据州对我们的要求来制定留存策略。了解你的法律要求至关重要，因此这里最重要的事情是从你的法律部门获得指导。\n\n## 你对合规性有什么看法？\n\
  \n当我们面临巨大压力时，很难记住他们也同样压力巨大。要在与他们沟通的时间与处理事件的时间之间平衡是困难的，但让他们知道自己的声音被听到了是非常有帮助的。这种沟通渠道需要保持健康。\n\
  \n\n\n\nJames Medlock 是一位拥有 25 年军伍经历的老兵，具备多种职业技能，担任网络行动专家、卫星网络工程师以及领域专家（SME）。他曾担任\
  \ `General Dynamics` 的高级卫星工程师和参谋工程师，负责军事通信系统的设计与支持工作；在 `Milstar` 通信卫星发射太空前在其签过名；拥有信息系统管理学士学位和硕士学位；在石油天然气行业有八年的\
  \ IT 和 OT 工作经验；他衣柜里的箱子里有一大堆证书；担任高中的网络爱国主义者导师；曾担任三本书的技术编辑；为陆军通信设备编写过多份技术手册；是多个会议的董事成员；每天在\
  \ DEF CON 步行 15,000 步；曾参加过光明会派对；是许多人的朋友、五个孩子的父亲以及一个人的配偶。\n\n## 你如何定义蓝队？\n\n蓝队负责检测、评估、调查、关联，并向系统所有者提供修复事件的建议。他们还应该参与修复后的验证。这并不意味着他们是企业内部提供建议或执行这些活动的唯一人员。在某些情况下，初始事件检测可能由用户发起，或者系统所有者可能已经识别了初始事件。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n- 对保持安全领域的更新有积极的个人兴趣。\n- 渴望/性格/心态上主动狩猎并研究攻击者进入或退出网络的不同机会/途径。\n\
  \n## 事件响应计划有哪些一些关键优势？\n\n- 即使在未知是否有异常发生时也保持活跃。\n- 具备领导灵活性，允许人员研究并尝试新的检测技术或工具。然而，永远不要\
  \ 100% 信任你的工具；它们会撒谎。定义验证准确性的方法；否则，你可能会在不知情的情况下盲目。\n\n## 蓝队成员如何学习、实践和成长？\n\n- 为你的团队寻找一些可以研究和测试的项目。\n\
  - 跟上当前技术，努力保持对安全脉搏的关注。\n- 参加或观看感兴趣的会议主题和工作坊；YouTube 上有很多资源。\n- 加入并参与你当地的安全小组；例如\
  \ `OWASP`、`ISSA`、`AHA`、`BSides`、`DEF CON`、`2600`、`IEEE`、`ISACA` 和 `ISC2`。如果没有当地的小组，几个小组有较大的分会直播他们的活动。\n\
  \n## 你如何奖励优秀的蓝队工作？\n\n从“有力的击击掌”、贴纸、休假到财务补偿，无所不。\n\n## 蓝队可以使用哪些核心指标来构建、衡量和维护成功的信息安全计划？\n\
  \n- 衡量从通知/发现到升级和调查，再到批准建议措施所需的时间。\n- 我将拦截和修复与之前的测量分开，因为许多 `BT`（蓝队）由于不是系统所有者，没有权限或授权拦截活动。\n\
  - 使用具有真实场景的个人和团队训练模拟器。我建议保持工具无关性（tool-agnostic），尽管某些公司可能希望关注团队对环境中工具的使用速度和熟悉程度。\n\
  - 让你的个人/团队面对类似的场景，并评估他们解决问题的速度和准确性；定期重复进行类似的场景。\n\n## 如果你是那个[负责人]，你会从哪里开始？\n\n对于大多数人来说，第一步将遵循最佳实践：\n\
  \n- **程序化：** 建立业务策略。\n- **技术上：** 了解你的边界。\n\n## 什么是性价比最高的？\n\n通常是从风险所在的地方开始。包括 `NTP`、`FTP`\
  \ 和证书机构（`CAs`）。在关键服务易受攻击的地方管理流量和方向。\n\n## 你的组织实施了任何欺骗技术吗？\n\n在我之前的一家机构中，有一些欺骗技术。从\
  \ `honeypots` 到主动监控不等。在大多数情况下，企业或实体会将这些作为学习和警报的机会。\n\n### 组织应该在何时使用加密？\n\n至少在法规或治理要求的地方。对于不属于合规性伞下的企业，建立风险管理计划，并评估你的业务数据暴露最高风险是什么。\n\
  \n对于大多数人来说，第一步是：\n\n- 静态数据：磁盘加密\n- 传输数据：`HTTPS/TLS/SSL`、邮件 `PKI`\n- 使用中数据：最困难的\n\
  \n## 你如何处理数据治理以及减少数据足迹的其他方法？\n\n这个世界正向着大数据收集观念发展，因此我们收集的数据比过去要多得多，市场上也有多种工具来丰富你当前的数据消费需求。\n\
  \n要么不收集你不需要的数据，或者如果收集了，设定一个已知的删除期限。一种技术是将其放在文件夹中，在 15/30/60/90 天后（随你的决定）删除。减少不必要数据的收集。我曾被引入一家公司，发现他们对工作站和服务器进行哈希、加密和备份；然而，他们没有清理服务器/工作站，因此他们备份并存储了活跃的\
  \ Windows 分区以及留在所有的 Windows 安装文件。解决此问题的常见方法是建立一个存储重要文档的 `Data` 驱动并仅存储这些数据。\n\n##\
  \ 你对合规性有什么看法？\n\n它是为了大局而必要的痛苦，但法规很容易失控，因此在实施时应极加谨慎和关注。以前，几项业务法规是自评估或自报告的；像 `Enron`\
  \ 这样在没有外部（第三方）验证的情况下运行的公司摧毁了员工和投资者的财务状况。\n\n\n\nNIST、PCI-DSS 等。它们提供了一个框架，使大众能够使用相同的术语，并将系统和服务清晰地归类为可审计的活动格式。我认为，许多领域的标准化使我们能够消除一些恐惧、不确定性和怀疑（FUD），并用基于风险语言与业务所有者/领导层进行沟通。\n\
  \n## 如何让组织的所有不同部门以实现防御最大化？\n\n一个词：认同（buy-in）。建立一个与客户或业务部门相关的共同范围，建立共同共识，并提供专注于该组织使命/愿景/风险的清晰意图。\n\
  \n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\n非技术型业务领导者主要关注风险和财务，因此快速且脱口而出的答案是：“风险、风险、钱、风险、钱，没有恐惧、不确定性和怀疑。”\n\
  \n换句话说，使用以下可量化的指标对威胁进行详尽阐述：\n\n*   对品牌的风险\n*   对当前收入的风险\n*   修复工作中损失的资金\n*   对未来收入流的风险\n\
  *   资金（减少暴露风险的缓解措施的最小成本）\n*   没有恐惧、不确定性和怀疑（尽量减少安全经理用来争取更多安全资金的旧式“天崩地裂”战术）\n\n###\
  \ 在重大持续事件期间，你对管理非技术高管的预期有什么建议？\n\n保持他们知情，不断向他们保证团队正在处理，提供执行摘要，提醒他们不要做任何承诺，限制 FUD\
  \ 的数量，并提供非技术的谈要点。\n\nWileyPRE\n\n# 32\n\nDaniel Miessler\n\n![](img/c32uf001.png)\n\
  \n> “我将蓝队定义为通过采用对抗同情保护组织免受真实攻击者红队攻击的群体。”\n\n**Twitter:** [@danielmiessler](https://twitter.com/danielmiessler)\
  \ • **网站:** [danielmiessler.com](http://danielmiessler.com) 和 [www.linkedin.com/in/danielmiessler](http://www.linkedin.com/in/danielmiessler)\n\
  \nDaniel Miessler 是一位丰富的安全从业人员和虚拟 CISO，在信息安全领域拥有 20 多年的经验。他感兴趣并关注的领域是 Web 应用安全、IoT\
  \ 安全、OSINT/侦察以及安全计划设计。\n\n## 你如何定义蓝队？\n\n我将蓝队定义为通过采用对抗同情保护组织免受真实攻击者和红队攻击的群体。对抗同情不仅是指使用与敌人类似的\
  \ TTP（战术、技术和程序），还意味着成功地像他们一样思考。\n\n## 蓝队应该具备哪两个核心能力？\n\n通过广泛部署、详细且集中的日志/告警，对受攻击环境进行深度洞察；以及对“正常情况”的深度理解，这在出现异常时可以帮助蓝队。\n\
  \n### 事件响应计划有哪些一些关键优势？\n\n*   将攻击者思维作为一种文化采纳\n*   使用指标客观地理解当前状态和未来的团队性能目标\n*   记录响应过程的每一步，以便进行持续改进\n\
  *   根据对以往事件的定期审查中获得的教训进行形式化的改进\n\n类似于个人学习中的固定型与成长型思维，强大的 IR（事件响应）团队不仅关注指标有多好，还关注他们改进了多少以及以多大的规模。\n\
  \n### 蓝队成员可以如何学习、练习和成长？\n\n对于大多数蓝队成员来说，成长的最好方法是学会更像他们的对手一样思考。这不仅意味着接受技术培训并精通各种工具，还应该包括对他们可能面临的各种真实对手的动机和能力的教育。了解对手的指标是什么、他们如何获得奖励以及以往攻击的历史，将帮助蓝队成员预测他们的行动，这与了解特定技术同样重要。\n\
  \n### 你如何奖励优秀的蓝队工作？\n\n第一种方法是不立即将他们调到红队。蓝队不应该被视为红队的落选者池或红队的试验场。有些人拥有红队级别的技能，但他们只是倾向于防御，这类人应该通过额外的导师指导、培训和演讲机会（根据偏好）来获得奖励，并鼓励他们留下来教导下一代。\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护一个成功的信息安全计划？\n\n事件生命周期中所有方面的特定时间点，例如：从事件发生到记录需要多久，从记录开始到被系统或人工分析其恶意性需要多久，传给蓝队成员需要多久，分检需要多久，遏制和根除需要多久，以及（如果有的话）根据教训对现有流程进行改进需要多久。\n\
  \n### 如果你在一个安全基础设施原始的中小型企业担任唯一的信息安全人员，你会从哪里开始？\n\n在栈的所有层上进行广泛、集中的日志记录。\n\n## 性价比最高的安全控制措施是什么？\n\
  \n日志记录。你无法对看不见的东西做出反应。\n\n### 你的组织实施过任何欺骗技术吗？\n\n我见过许多组织尝试欺骗技术，但除了少数几个，最终都在以后（几个月或几年后）意识到，时间本该花在基础工作上的。更多的日志记录、对日志的自动化分析、更好的分检方法、更好的\
  \ IR 流程等。\n\n### 组织应该在何时使用加密？\n\n在任何希望保护信息免受未经授权查看的地方。\n\n### 如何处理数据治理和其他减少数据足迹的方法？\n\
  \n最好的方法是从关键利益相关者处获取一段时间内数据使用的主要用例，然后问自己可以删除什么以及删除频率。核心原则应该是不存储任何由于某些原因而明确需要的内容。\n\
  \n### 你对合规有什么看法？\n\n> 合规在安全中有其地位，就像高中在教育中有地位一样。\n\n合规在安全中有其地位，就像高中在教育中有地位一样。它是作为一种正式要求，让人们获得指标、教训，以及与其他团队进行的成功互动次数，从而为组织带来更好的安全。\n\
  \n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\n使用叙事性示例结合量化指标（例如：这个人做了某事，是因为受到了这种动机的驱动，我们在这样的新闻报道中看到了这一点，这可能会给我们的业务带来这种类型的损害，我们在过去的\
  \ 10 天内已经看到了 47 次这样的攻击，这就是我们建议这么做的原因）。\n\n### 在重大持续事件期间，你对管理非技术高管的预期有什么建议？\n\n同时做这两两件事：\n\
  \n*   向他们提供简洁、高层的更新，以传达事件的状态。\n\n\n\n\n\n*   提醒他们，如果需要，细节是透明的，但情况正在处理中。\n\n这提醒了他们，组织中的每个人都是自己所领域领域的专家（SME），现在是信任的时刻，而不是持续探听或微观管理。\n\
  \nWileyPRE\n\n# 33\n\nAlyssa Miller\n\n![](img/c33uf001.png)\n\n> “在组织内部，蓝队通常是一个由不同学科人员组成的团队，涵盖从安全运营到事件响应和取证各个领域。”\n\
  \n**Twitter:** [@AlyssaM\\_InfoSec](https://twitter.com/AlyssaM_InfoSec) • **网站:**\
  \ [www.linkedin.com/in/alyssam-infosec](http://www.linkedin.com/in/alyssam-infosec)\
  \ 和 [www.alyssasec.com](http://www.alyssasec.com)\n\nAlyssa Miller 从青少年时期购买第一台电脑起就是一名黑客和程序员。虽然\
  \ IT 并不是她最初的职业计划，但她最终在金融服务行业担任开发人员，后来成为渗透测试。随着她转向咨询领域，她对防御企业系统的关注日益增加，以至于能够为财富 100\
  \ 强提供如何构建全面安全计划的建议。她是一位安全倡导者、公共演讲者和作家，热爱分享自己的想法和知识，以帮助改进我们防御数字世界。\n\n## 你如何定义蓝队？\n\
  \n对我来说，蓝队是指任何负责设计、部署、维护、支持或运行安全控制和防御的人员。在组织内部，蓝队通常是一个由不同学科人员组成的团队，涵盖从安全运营到事件响应和取证各个领域。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n每个蓝队都始于安全运营能力。这些是一线人员，负责监控和响应安全系统及事件。积极观察攻击迹象并能够在需要时启动响应，对于任何蓝队组织来说都是至关重要的。\n\
  \n此外，每个蓝队都应该具备安全架构能力。这组专家负责设计和部署必要的安全控制基础设施，这些设施能够实际防御系统并实现监控和响应。架构能力是确保全面的安全防御计划的基础要素。\n\
  \n## 事件响应计划的一些关键优势有哪些？\n\n> “事件响应计划在跨组织所有领域建立清晰的共同责任制时最为成功。”\n\n当事件响应计划在跨组织所有领域建立清晰的共同责任制时，它们最为成功。要意识到，事件响应不仅仅是利用技术手段对抗攻击以及在攻击后收集取证数据。最好的事件响应计划理解需要记录在案的策略、通知要求（包括组织内部和外部）、影响评估方法论，甚至包括参与第三方响应服务的规则。此外，一个良好的计划应该准备好应对所有形式的事件，从数据泄露到勒索软件/恶意病毒爆发，从虚假信息攻势甚至甚至是针对人员的攻击。\n\
  \n## 蓝队成员如何如何学习、实践和成长？\n\n有几项活动可以帮助蓝队成员精炼他们的技艺。在桌面演习中，通过推演和讨论不同的情景，让蓝队成员能够真正考虑其行为产生的影响。专注于优化正在使用或正考虑使用的安全技术的实验室和研讨会对蓝队成员的技能培养同样有效。此外，红蓝演习（即蓝队与红队协作工作）不仅可以提供对当前能力的观察，还可以提供改进这些能力的策略。\n\
  \n## 你如何奖励蓝队的工作？\n\n奖励良好的工作的难之处不在于你如何奖励，而在于你最初如何衡量它。较小的成功可以用简单的认可来奖励。然而，对于更重大的成功，金钱补偿是一种极好的奖励。但也有其他选择。额外的假期是一种选择。考虑到安全从业人员所工作的高压力环境，休息一天对持续健康具有极高价值。\n\
  \n> “考虑到安全从业人员工作的高压力环境，休息一天对持续健康具有极高价值。”\n\n然而，组织必须确保该人员确实休了假。另一种常见的有效策略是公司赞助参加会议或培训。这里的关键部分是确保这是员工选择的，而不是由组织指定的。与工作相关的培训和员工发展不应作为奖励而被扣留。这些是公司应该对每个个体进行的投资。在工作培训和奖励之间建立的区分是非常重要的。\n\
  \n最后，旅行奖励是奖励员工的一种极佳方式。对于经常出差的员工，可以是让他们下次出差时购买头舱机票，或为他们购买常常航空俱乐部会员。对于所有员工，亮目的成功可以用公司赞助的员工及其家庭旅行作为奖励。\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护成功的信息安全计划？\n\n衡量安全计划成功的所需的指标需要关注可衡量的元素。由于我们最终讨论的是一种难以衡量的事物，即我们的努力阻止了多少次攻击，因此重要的是关注那些显示我们的流程和程序正在不断改进的衡量。例如，与其衡量修复了多少个漏洞（这最终是环境中产生漏洞的直接结果），组织应该转而跟踪漏洞的解决时间。添加额外的特征（如严重程度、受影响系统的风险状况等）可以提供额外的清晰度。类似的指标也可以用于衡量安全事件响应。\n\
  \n在架构团队内部，指标应侧重于衡量自动化、对新兴威胁的响应时间以及新能力的部署。要做到这一点，需要为安全计划定义清晰的路线图和战略。\n\n## 如果你是一个安全基础设施简陋的中小型企业中唯一的信息安全人员，你会从哪里开始？\n\
  \n\n\n\n\n假设什么都没有，那么最好的起点应该是制定一个全面的补丁管理策略。许多发生的泄露事件都是利用了过旧系统的漏洞。当我说“全面”时，这包含了跨硬件和软件的完整资产盘点。这具有挑战性，但是必须的。如果你不知道自己拥有什么，并且无法保持它们更新，你就已经为你的企业打开了主要的攻击向量。\n\
  \n## 性价比最高的安全控制措施是什么？\n\n人为因素已成为泄露的单一最大来源。无论是由于配置不当导致 `S3` 存储桶暴露，还是由于编码实践不佳导致应用程序出现漏洞，亦或是用户点击恶意链接导致恶意软件/勒索软件感染，这些问题都是人类制造的。因此对我来说，性价比最高的安全控制措施是文化。组织需要培养一种真正将安全视为所有人共同责任的文化。`DevSecOps`\
  \ 让我们离这个目标更近了一步，但我们需要超越特定的技术职能。从法务团队到营销部门，再到开发和客户服务，每个人都需要理解他们对公司的安全负责，并且需要获得相应的工具和流程支持，使他们能够以安全的方式完成日常工作（而这是一个经常被忽视的关键要素）。\n\
  \n## 你的组织实施了任何欺骗技术吗？\n\n我不确定我目前的组织如何，但我过去与许多部署了 `honeypots`（蜜罐）和 `honeynets`（蜜网）的公司合作过。我发现这些技术的问题是，很难衡量它们是否成功。当然，你可以观察进入的攻击，可以尝试跟踪落地的攻击者数量指标，但到底，并没有背景信息可以说明这是否帮助识别了可能发生或将在其他地方发生的攻击。建立这种关联通常很困难，因为在被欺骗防御系统捕获后，攻击者通常会改变他们的方法。\n\
  \n从蓝队（防御方）的角度来看，观察这些系统很有趣。有时查看日志，看到攻击者在慢慢意识到他们正在攻击诱饵时的行为，甚至是有些滑稽的。但同时，这些系统和网络需要大量的资源时间来管理和运行。如果没有一种良好的方法将诱饵攻击与针对生产系统的防御攻击关联起来，就很难证明它们值得投入精力。\n\
  \n## 组织应该在何处使用加密？\n\n这是一个陷阱题吗？字面意思是，在任何任何存在他们想要保护的数据的地方，无论是凭据、个人信息还是公司机密。静态数据和传输中数据的古语在这里同样适用。`cryptography`\
  \ 应该随时保护所有这些内容。现在这是一种非常理想化的观点；然而，这并不现实。\n\n现实情况是，加密技术仍然未能解决一些关键问题。例如，至今数据库中的数据仍然可能非常有问题。你如何加密它？在什么语境下加密？全\
  \ `DB` 加密固然，但当访问数据库并具有解密能力的服务账户被直接或间接地剥削时，这种防御就失效了。你应该提升层级，在应用层面进行加密吗？嗯，现在你又面临性能、密钥管理等问题，这些让公式变得复杂。\n\
  \n所以，虽然这看起来像是在推卸责任，但答案是没有标准答案。每个组织都需要查看自己的业务资产，并设计一个从支持或实现这些资产的 IT 系统开始并不断扩展的防御计划。这可以包括加密控制，也可能利用其他缓解控制。安全没有一劳永逸的方法，这包括在何时/何处利用加密安全。\n\
  \n### 你如何处理数据治理和其他减少数据足迹的方法？\n\n我再怎么强调都不够我们必须停止将数据视为资产。数据*不是**资产；它是一种负债。公司拥有的每份数据都带有义务。从技术债的角度来看，它必须被存储。从合性的角度来看，它必须被保护、分类和管理。为了从中获得价值，必须对其分析。这就是关键所在。数据本身并不像真正的资产那样具有内在价值。我喜欢用\
  \ `UPS` 货车举例。他们可能拥有数百万辆那种定制卡车。即使没有人对这些卡车有任何其他用途，它们制成的组件（金属、玻璃纤维等）也具有某种内在价值。数据的情况并非如此。\n\
  \n我知道这在目前是一个不受欢迎的观点。我们有大型科技巨头在数据变现的基础上构建整个业务模型，并将数据视为资产。我们构建了巨大的 `data lakes`（数据湖），存储了我们可能收集到的所有数据。遗憾的是，我们已经成了数据囤积者。存储数据是为了某一天能将其变现，而不是为了特定目的而存储。然而，如果我们开始将数据视为负债并真正致力于以这种方式对待它，它就会驱动一种行为，即数据在收集和存储之前必须有目的。数据被分类和标记标签。这些标签定义了特定的安全控制、保留期等。我们需要的是数据的“舍离法”：如果它不能给你带来收入或合规性，就把它扔掉。\n\
  \n> 我们需要的是数据的“舍离法：如果它不能给你带来收入或合规性，就把它扔掉。\n\n### 你对合规意见如何？\n\n监管要求是业务领导者一直在抱怨的事情——在某些方面，这种抱怨也是合理的。这些要求很少驱动真正的安全衡量。更糟糕的是，由于这些要求通常非常繁琐，公司以极简主义的态度对待它们。我们如何通过完成最少的工作来勾选框并继续？组织利用“要求的意图”这一术语来恰恰相反的操作，规避作者的意图。这完全是一个没有尽头的恶性循环。\n\
  \n现实情况是，大多数合规和监管要求更多是为了转移责任，而不是真正保护任何东西。`PCI` 是一个极佳的例子。并不是秘密，卡组织能够利用 `PCI` 将责任转嫁给处理商，处理商再转嫁给发行银行，银行再转嫁给零售商。这不是为了保护持卡人信息；而是为了在发生泄露时谁被指责、谁被起诉。\n\
  \n尽管尽管如此，我们商界没有人可以指责，只能自责。如果商界在负责数据方面做得很好，在防欺诈技术方面做得很好，立法者和管理机构就不会觉得需要创建这些法规。但事实是，除非威胁到底线，否则企业没有动力采取行动。这就是合规介入的地方，通过对底线产生影响，为企业创造人为风险，从而反过来激励企业遵循预期的做法。所以，遗憾的是，合规已成为一种必要的恶。\n\
  \n\n\n\n\n目前来看，NIST 可能是最接近这一点的。`800.53` 是一套指令性的控制措施，遗憾的是它过于细碎。我曾尝试建立那种“一刀切”的方法，但效果并不理想。然而，当你观察网络安全框架（`CSF`）时，它在关注核心概念并将这些概念与蓝队在组织内部应该执行的活动对齐方面做得好得多。我认为这种模型是一个值得遵循的范本。它为组织提供了所需的活性，不仅能够设计出符合其业务的安全策略，还帮助他们建立起持续改进的路线图。\n\
  \n从监管和合规性的角度来看，实施 NIST `CSF` “可以”使公司符合监管要求。然而，考虑到近期隐私立法（如 `GDPR`、`CCPA` 等），这种情况正在发生变化，这些法律已超出了简单的组织如何保护系统和消费者数据的范围。遵守这些新规定要求组织创建新的流程并实施新技术，其目的不是为了安全，而是为了赋予消费者对其自身数据的某种程度的控制权权限。\n\
  \n## 你如何让组织的所有不同部门以实现防御最大化？\n\n同样，虽然这听起来可能很虚幻，但它必须从文化开始。从首席执行官到每一位员工，每个人都必须理解自己在组织安全方面的角色，并被赋予胜任能力。我见过一些公司举办内部安全会议，向员工提供有价值的信息，内容不仅关于如何保护公司，还关于如何保护他们的个人生活。这对于促进与安全团队的合作非常有效。\n\
  \n我曾与一些公司合作，他们实施了“换地思考”的计划，让安全部门的人员花时间在业务的其他领域工作，反之亦然。这在团队之间创造了同理心，而对于协作至关重要。我甚至见过一些组织为安全意识培训找到了独特的培训想法，例如逃脱室，或者员工想要参加且能传达价值信息的趣味活动。\n\
  \n最后，我个人非常喜欢利用威胁建模。这项活动如果执行得当，应该将业务的许多领域聚集在一起，共同讨论威胁态势以及各种系统的安全态势。\n\n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\
  \n让我先从我不做什么的事情开始说。我不会走那种老旧、陈腐的路线，利用恐惧、不确定性和怀疑（`FUD`）来试图传达我的信息。我确保自己在谈判时带着一个定义好的解决方案。然后，我专注于将该解决方案与如何改进业务联系起来。这可能是为了节省成本，可能是为了增加业务收入，或者最好的情况是它实际上可以被用来创造新的业务差异化优势。\n\
  \n简单地告诉非技术业务领导者“你必须这么做，否则会发生非常糟糕的事情”实际上是适得其反的。这不会激励他们采取行动；而是激励他们忽视你，让他们冻结无所事事，从长远来看，完全避开你。你必须从业务目标和要求的角度展示收益。通过实施该安全控制措施提供一个切实的结果，以解决你关心的威胁。这并不容易；`FUD`\
  \ 很容易，但这种过程才是有效且能赢得支持的。\n\n## 在重大持续事件期间，你有什么建议来管理非技术高管的预期？\n\n你可以做的最重要的一点就是建立定期的更新沟通。高管们理解，对于看似简单的问题，例如“这需要多久？”或“这将花费多少费用？”并不总会有简单的答案。然而，当他们觉得自己处于信息盲区时，他们就会变得紧张。所以，要诚实并定期、详细地分享信息。关注客观信息，而不是猜测或估算，而是告诉他们你手里掌握了什么。\n\
  \n他们可能会要求猜测或估算。当他们这样做时，要准备好提供基于客观信息的、自信的回答。我们经常在没有准备的情况下被问到；被要求给出一个估值，于是我们随口抛出一个数字。如果你无法用事实证明你的答案，那那就是一个糟糕的答案。通过预测并对他们的问题做好准备，让他们确信你正掌控着局面。给他们一个信任你的理由，并与他们定期沟通，他们就会为你留出空间来完成工作。\n\
  \nWileyPRE\n\n# 34\n\nMaggie Morganti\n\n![](img/c34uf001.png)\n\n> “传统上，蓝队是积极并直接参与评估运行环境以确保安全的团队。”\n\
  \n**Twitter:** `@magg_py`\n\nMaggie Morganti 是橡斯克里奇国家实验室电力与能源系统团队的技术人员，专注于电网的网络安全和韧性。在加入奥斯克里奇国家实验室之前，Maggie\
  \ 曾是 `FireEye` 的研究生实习生，并在 `iSight` 团队担任威胁分析师。她在梅西赫斯特大学（Mercyhurst University）获得了专注于网络安全的情报研究硕士学位。在研究生期间，她曾在大学的信息研究与培训中心（`CIRAT`）计划担任情报分析师，并担任核不扩散俱乐部的活跃成员。她是\
  \ IEEE 会员。\n\n## 你如何定义蓝队？\n\n随着许多从事辅助安全任务的人员加入，蓝队角色的界限无疑变得更加包容和模糊了。\n\n我发现思考“什么是蓝队的定义？”最简单的方法是追溯红队/蓝队的军事起源。蓝队传统上是积极并直接参与评估运行环境以确保安全并挫败敌方攻击的团队。在军事行动中，有无数支持这些团队的角色，例如通信、运输和后勤人员。所有这些角色对于促进演习或行动都是必要的，但当攻击开始打击边界（无论是物理还是网络边界）时，蓝队是积极参与响应的人。我认为在很大程度上，这一前提可以转移到网络安全领域，帮助我们更容易地思考蓝队。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n我认为蓝队具备的两个核心能力是：\n\n*   对他们试图防御的网络有深入理解\n*   与管理层就组织风险和“核心资产”保持紧密的沟通循环\n\
  \n本质上，我们需要知道需要优先防御的内容以及它所处的数字环境。\n\n## 事件响应计划有哪些主要的关键优势？\n\n我认为事件响应计划的两个关键优势是适应性和清晰度。某些部分如角色、关键步骤和报告必须是清晰易于识别的。然而，计划也不应该陷入极度复杂的细节中，以至于无法灵活调整以满足事件的需求。\n\
  \n### 蓝队成员如何学习、练习和成长？\n\n> 让你的蓝队轮岗到红队、威胁情报团队、业务开发团队等部门共事。\n\n\n\n\n这里的简单答案是培训，但我认为这不仅仅是完成继续修教育的勾选那么简单。让你的蓝队进行轮岗，花时间与红队、威胁情报团队、业务发展团队等共处。这种接触将为他们提供更好的工具、视角和伙伴关系。\n\
  \n## 如何奖励优秀的蓝队工作？\n\n坦诚说：我把这个问题“外包”了，因为我觉得代表大家发言感到很局促。当我询问同事和同行他们希望如何获得奖励时，我收到的压倒性回答是职业晋升和培训。这是一个充满希望的指标，说明我们作为防御者，希望通过获得工具来作为奖励，以帮助我们更好地完成使命。\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护一个成功的信息安全计划？\n\n我认为有一些非常容易获得的“送分题”的核心指标，我们通常可以参考这些指标来衡量成功的安全计划：培训得分、事件发生间隔时间、事件类型、补丁周期等。\n\
  \n在运营技术（`OT`）环境中，我认为这些指标通常是类似的，但有几点例外。\n\n考虑到遗留设备的普及以及/由于互操作性问题而难以打补丁的设备，在常见安全指标可能遇到复杂情况的网络中，应该采用侧重于准确资产清单、网络分段和白名单的指标。\n\
  \n## 如果你是一个安全基础设施简陋的中小型企业中唯一的信息安全人员，你会从哪里开始？\n\n我认为从零开始的起点和基本要素通常必须是弄清楚该业务的价值最高的资产是什么，评估与这些资产相关的风险，并围绕这些资产对安全人力物投资进行优先排序。\n\
  \n## 性价比最高的安全控制措施是什么？\n\n人。听我慢慢解释。我进入这个领域时，丈夫是一名制造工程师，父亲是一名油气高管。这两家机构的运营都依赖 IT Staff，他们同时兼任企业安全人员和\
  \ ICS 安全人员（如果以及当他们真的考虑过 ICS 安全的话）。我们目前市场上有很多非常棒的技术，但没有任何供应商的解决方案可以魔术般为规模较小、任务过载的\
  \ IT 部门腾出时间来成为一支强大的蓝队。只有专职这些任务的人才能减轻这种负担。我认为公司往往太想要“买一个网络安全解决方案”，于是他们去购买最新的闪烁灯盒子，然后由于缺乏专门的管理人员，这些盒子就只能在架子上落灰，带着未知的\
  \ `ANY/ANY` 规则和未监控的告警。\n\n> 我认为公司往往太想要“买一个网络安全解决方案”，于是他们去购买最新的闪烁灯盒子，然后由于缺乏专门的管理人员，这些盒子就只能在架子上落灰，带着未知的\
  \ `ANY/ANY` 规则和未监控的告警。\n\n## 组织应该在何处使用加密？\n\n组织应该在最需要且在业务上可以支持的地方使用加密。特别是在 ICS 环境中，必须考虑延迟等因素。\n\
  \n## 你如何处理数据治理以及减少数据足迹的其他方法？\n\n数据治理对于像我们这样的研究机构和政府机构等组织至关重要。政府拥的研究实验室必须同时管理有关高价值知识产权的数据以及机密情报材料。简单的步骤，例如不将敏感文档上传到\
  \ `VirusTotal` 和 `Google` 等网站，以及不对与你组织相关的敏感数据进行黑客攻击，在减少数字足迹和不必要的数据暴露方面大有帮助。\n\n\
  ## 你对合规性有什么看法？\n\n我认为合规性是一个为组织提供基准的绝佳起点。然而，至关重要的是我们不能让利益相关者陷入认为“合规”等同于“安全”的陷阱。\n\
  \n此外，我们不应该达到让所有者对合规审计的恐惧超过对组织实际入侵的程度。\n\n> 此外，我们不应该达到让所有者对合规审计的恐惧超过对组织实际入侵的程度。\n\
  \n## 是否有一个框架可以将蓝队执行的活动或功能与监管合规要求相结合？\n\n在关键基础设施和电力系统领域，我认为 `NERC-CIP` 是很好的例子。除了概述保护关键资产和系统所需的采取措施外，`NERC`\
  \ 还开展年度 `GridEx` 演练，在模拟网络攻击条件下测试这些控制措施。这是非常有价值，因为它允许蓝队在发生真实事件时依靠协调的既定培训。\n\n## 你如何参与组织的所有不同部门以实现防御最大化？\n\
  \n团队之间的沟通和共识。这听起来是显而易见的，但遗憾的是仍然需要重复。很多时候，`SOC` 不与 `IT` 人员沟通，而 `IT` 人员又与工程师或操作员不沟通。管理、安全、编程和运行关键资产的人员之间顺畅的通信对于最大化这些网络的防御至关重要。桌面安全演练应该包含所有这些团队的人员。特别是在\
  \ ICS 环境中，需要与资产工程师和操作员建立伙伴关系以理解并正确防御网络。\n\n> 管理、安全、编程和运行关键资产的人员之间顺畅的通信对于最大化这些网络的防御至关重要。\n\
  \n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\n当我尝试向非技术决策者传达威胁时，对我最重要的策略如下：\n\n*   **谦逊**：当我们带着“比决策者更了解公司或环境”的傲态进入情境时，我们是在自毁自脚。坐在我们对面的人必须考虑全局，而不仅仅是“网络安全问题”。在制造工厂里，我们可能会走动并嘲笑遗留和未打补丁的设备。我们可以揉太阳穴并道道地说这一切必须在“昨天”就解决。然而，通过这样做，我们没有考虑到仓促补丁修补或“推倒重来”方案对运营造成的破坏，可能与我们正试图防御的实际攻击一样大甚至更严重。\n\
  *   **效益**：决策者可能并不关心最新的新颖攻击细节。他们关心自己的人和底线。因此，当我们与他们交谈时，我们也应该关心这些：停机时间。损失的资金。声誉受损。这些指标对决策者来说是有意义的，而不会让他们陷入细碎的技术细节中。\n\
  \n\n\n\n> “通过组织化的日志管理、加固技术以及结合威胁情报的网络安全分析，蓝队增强了 SecOps 部门提升安全成熟度的能力，同时维护了业务连续性的完整性。”\n\
  \n**Twitter:** [@masofmoss](https://twitter.com/masofmoss) • **网站:** [www.linkedin.com/in/justin-moss-090206132](http://www.linkedin.com/in/justin-moss-090206132)\n\
  \nJustin Moss 是一位网络安全爱好者，目前在端点安全公司 CrowdStrike 担任销售工程师。他拥有 CompTIA Security+ 认证，以及\
  \ CrowdStrike 的主动狩猎、事件响应和管理认证，他热衷于向行业介绍如何主动使用其安全工具。Justin 通过创建和交付工作讨会来弥补安全供应商解决方案与从业人员需求之间的鸿沟，从而在工作中保持主动性。\n\
  \n## 你如何定义蓝队？\n\n蓝队建设代表了所实施的主动实践，旨在加速识别和响应针对大型 IT 业务资产的恶意事件的过程。通过组织化的日志管理、加固技术以及结合威胁情报的网络安全分析，蓝队增强了\
  \ SecOps 部门提升安全成熟度的能力，同时维护了业务连续性的完整性。\n\n利用现有的工具集，蓝队实现了跨部门通信。这有助于安全团队识别、评估、确定优先级并缓解\
  \ IT 业务威胁。\n\n换句话说，链条中的环节孤立存在时提供的保护有限。在一起时，它们的力量提升了安全能力。尽管蓝队引入了特定的实践和技能，但其理念是相同的。无论在事件响应之外的工作如何，蓝队都能维持整体业务运营的跨部门通信。\n\
  \n## 蓝队应该具备哪些核心能力？\n\n蓝队应该具备两个核心能力是能够通过自动化实现安全增强的工具以及基于云的管理平台。\n\n网络威胁格局已经现代化，这意味着我们的防御策略必须随之改变。根据端点安全公司\
  \ CrowdStrike 发布的《2020 年全球威胁报告》，2019 年利用恶意软件的攻击从 2017 年至 2018 年的 60% 下降了 11%。这意味着攻击者更频繁地使用无软件和基于脚本的攻击来破坏系统并访问敏感数据。\n\
  \n能够自动识别并向防御者告警受信任/内置应用程序滥用情况的技术，结合云驱动的日志管理平台，有助于事件响应和取证调查工作流的可用性/完整性。\n\n## 事件响应程序的一些关键优势是什么？\n\
  \n事件响应程序的三个关键优势如下：\n\n* 事件前流程\n* 事件中流程\n* 事件后流程\n\n事件前流程的目标仅仅是确认是否存在事件并启动事件响应流程。确定事件中要寻找内容的基准，以及在发生事件时联系谁，可以降低遭受《威瑞信\
  \ 2019 年数据泄露调查报告》(DBIR) 中记录的平均 45 到 150 天之安全泄露滞留时间（dwell time）的风险。\n\n在事件期间，可以使用大量的工具来协助对磁盘、文件、内存日志等的分析。无论使用何种技术，由谁管理事件、内部/外部通信以及事件目标的流程都应保持不变。\n\
  \n事件后流程应用于反思成功之处和改进领域。最重要的是，这是关键业务和 IT 利益相关者聚集在一起，评估其内部/外部事件响应（IR）资源的有效性，相对于事件持续时间和金钱影响的成本。\n\
  \n## 蓝队人员如何学习、练习和成长？\n\n蓝队人员可以使用以下基础指南和框架来学习、练习并提高他们的整体安全能力：\n\n* 洛克希德·马丁网络杀链 (Cyber\
  \ Kill Chain)\n* Mitre ATT&CK 框架\n* 美国国家标准技术研究院 (NIST) 网络安全框架 (CSF)\n\n蓝队通常被视为与反应性安全等同的过程。从业人员通常认为蓝队意味着对最新的恶意软件和/或勒索软件家族做出反应。尽管这很重要，但蓝队人员应该专注于应用对抗现代及旧威胁的核心策略和程序的安全控制，以保护他们的人、流程和产品。\n\
  \n> 从业人员通常认为蓝队意味着对最新的恶意软件和/或勒索软件家族做出反应。\n\n## 如何奖励优秀的蓝队工作？\n\n在 Daniel Pink 的书籍《驱动》（Drive）中，他建设性将人类动力分解为两个部分：内在动力，描述那些响应具有项目自主权的工作环境并将自己视为目标最大化者的人；外部动力，描述那些对项目被严密监控且性能与预设奖励挂钩的工作环境做出反应的人。根据书中介绍的研究，受外部驱动的人通常认为自己是各自组织的利润最大化者。\n\
  \n书中有很多示例可以借鉴，可以为最适合你组织的方法提供帮助。一个令我印象深刻的例子是“如果-那么”（If-Then）和“既然”（Now That）奖励系统的区别。如果你是内在动力员工的支持者，那么是在项目完成后提供惊喜奖励（例如，“既然你完成了\
  \ X 效果良好，让我们用 Y 来庆祝吧”）。这种方法相比“如果-那么”奖励系统具有展示谢意并提高团队士气的潜力。另一方面，根据书中提供的研究，“如果-那么”的可能会破坏有效的绩效。\n\
  \n最终，蓝队是一项不受人待的工作，由于安全活动/资源有限，可能可能没有可奖励的项目。突出员工表现价值的一种种可靠方法是将其与业务运营的 KPI 联系起来。Gino\
  \ Wickman 的书籍《引力》（Traction）概述了如何建立并完美执行这一方法的实用指南。\n\n\n\n\n要设计一个能够抵御未知天气条件和意外损坏的建筑，你需要从一张蓝图开始。蓝图允许从业人员在开始奠基时，就能预见到最终成功的成果。在构建安全计划时，没必要重复造轮子。像\
  \ `NIST CSF` 这样的标准是模块化的。从业人员可以信心地朝着成熟的安全态势发展，同时评估并优先考虑整体安全风险。\n\n## 性价比最高的安全控制措施是什么？\n\
  \n能为你提供最高性价比的安全控制措施是预防控制。安全团队在分析和处理安全事件上花费的时间越少，从业人员就能投入更多时间进行主动威胁狩猎。主动威胁狩猎应该是从业人员除\
  \ `IR` 之外使用的唯一手动流程之一，用于维护业务运营并对抗现代的“离地攻击”（live-off-the-land）型攻击。\n\n> 主动威胁狩猎应该是从业人员除\
  \ `IR` 之外使用的唯一手动流程之一，用于维护业务运营并对抗现代的“离地攻击”型攻击。\n\n### 组织在何时应该使用加密技术？\n\n组织应尽可能始终使用加密技术。对离开网络的数据进行加密，是维护知识产权、个人身份信息和敏感数据机密性的基础部分。由于威胁格局的变化，加密内部数据通道将提供额外的必要安全保障。“离地攻击”技术（如增加攻击者的足迹存在）已成为他们完成恶意目标计划中不可缺的一部分。\n\
  \n> 勒索软件通常是攻击者中断业务运营时使用的最激烈且最后的手段。\n\n大多数企业都担心受到勒索软件攻击，这是一个合理的担忧。遗憾的是，在防御者需要保护自己的事情上，这只是冰山一角。勒索软件通常是攻击者中断业务运营时最激烈且最后的手段。在部署勒索软件之前，攻击者通常会执行以下操作：\n\
  \n* 获取漏洞主机/用户的初始访问权限\n* 建立持久化\n* 监控/将数据外传到海外 `C2` 服务器\n\n利用内部/外部加密实践并限制系统对数据的访问，应该减少你遭受上述攻击的风险暴露范围。\n\
  \n## 你对合规性有什么看法？\n\n如果要求要求，合规性应作为防御者与非技术高管之间连接安全与业务运营的桥梁。能够实现安全的组织理解仅将安全与合规对齐的局限性。对于不具备安全能力的组织，防御者可以使用合规性作为对齐业务与安全目标的弹弓。\n\
  \n合规性就像定期的体检一样，可以作为基准态势的灯塔。就像人们根据体检诊断结果来遵循处方饮食计划一样，合规性应该被视为改进安全态势之路上的检查站。\n\n###\
  \ 是否有框架可以将蓝队执行的活动或功能与监管合规要求对齐？\n\n有的，有几个此类框架，例如 `NIST CSF` 和 `ISO 27000` 系列。最近，网络安全成熟模型认证（`CMMC`）结合了上述框架以及美国建筑师协会（`AIA`）的反垄断合规性部分。与\
  \ `NIST` 一样，`CMMC` 计划围绕安全计划提供实施流程，并提供了执行这些流程的指导步骤。\n\n### 在发生重大持续事件期间，对于管理非技术高管的预期有什么建议？\n\
  \n除了之前在员工奖励问题中提到的技术外，从业人员可以每季度/每半年对非技术高管应用类似的技术。通过关键利益相关者的桌面演练或围绕业务驱动的安全指标进行简报，防御者可以建立公司范围内对其拟定安全计划的信心。\n\
  \n从高管习惯的语言开始，向他们展示什么是值得保护的、他们他们应该关注，以及蓝队如何实现整体业务目标。这可以确保当事件发生时，他们了解以下内容：\n\n* 在\
  \ `IR` 过程中可以预期到什么\n* 根据对业务的影响预测事件成本\n\n在事件发生之前、期间和之后让非技术高管知情，将为你的安全团队、更重要的是为你的业务带来丰厚的回。\n\
  \nWileyPRE\n\n# 36\n\nMark Orlando\n\n![](img/c36uf001.png)\n\n> “显然，安全是许多不同群体和个人的共同责任，但关键区别在于承担采取行动的责任，即使这种行动仅仅是识别和升级。”\n\
  \n**Twitter:** [@markaorlando](https://twitter.com/markaorlando) • **Website:**\
  \ [www.linkedin.com/in/marko16](http://www.linkedin.com/in/marko16) 和 [www.bioniccyber.com](http://www.bioniccyber.com)\n\
  \nMark 于 2001 年作为一名 `SOC` 分析师开启了他的安全职业，从那时起，他一直在为蓝队资源而战，同时也试图通过自动化让这些资源转型。他曾在五角楼、白宫、能源部、全球托管安全服务提供商以及众多财富\
  \ 500 强客户处建立、评估并管理安全团队。\n\nMark 的热情在于通过基础知识和辅助技术的正确应用，寻找帮助防御者扩大规模的新颖方法，并帮助领导和非技术角色的人员应对信息安全方面的诸多挑战。2012\
  \ 年，他设计并启动了一项托管检测与响应（`MDR`）服务，并帮助发明了一种自动化网络威胁狩猎技术，这两者后来都被收购了。如今，他是 Bionic 的联合创始人兼首席执行官，这专注于为各地组织提供先进防御能力的科技公司。\n\
  \nMark 曾在 `DEF CON`蓝队村、应用网络安全研究所（`IANS`）论坛、`BSidesDC` 以及 `RSA 大会` 上演讲过安全运营和评估，并被《纽约时报》、《华盛顿邮报》、《福布》、《CNBC》和《安全杂志》等许多媒体引用。他拥有乔治梅森大学高级信息技术学士学位，曾在美国海军陆战队担任火兵士官。在空闲之余，Mark\
  \ 喜欢阅读、看摇滚演唱会以及偶尔偷看 Netflix。\n\n**你如何定义蓝队？**\n\n蓝队在防御企业时响应威胁。显然，安全是许多不同群体和个人的共同责任，但关键区别在于承担采取行动的责任，即使这种行动仅仅是识别和升级。\n\
  \n**蓝队应该具备哪两个核心能力？**\n\n每个蓝队都应该具备网络安全监控和主机监控能力。在大多数多阶段攻击中，你会在网络层看到某些动作，某些动作只能在主机层看到，因此两者同等重要。出色的团队在这里也获得荣誉，因为这还需要熟练的分析师能够有目的地在主机和网络数据之间切换以识别感兴趣的事件。\n\
  \n**事件响应计划的主要优势有哪些？**\n\n\n\n\n一个核心优势是能够通过事件响应过程提升组织的安全态势。这意味着总结经验教训、识别可能防止事件发生或实现更佳检测的控制措施，并将新需求输入到规划过程中。如果你无法回顾过去一个月或过去一年中处理过的案例，并识别出你改进整体安全性的何种方法，那么你只是在玩“打地鼠”游戏。另一个经常被忽视的关键优势是通信。事件响应计划必须包含内部和外部通信，以确保业务所有者、用户、客户和其他利益相关者能够获得及时、准确的信息。后一个元素如果处理不当，会对组织产生深远的影响。\n\
  \n## 蓝队成员应该如何学习、练习和成长？\n\n这是我从兵役经历中汲取的教训。你并不会一直处于战斗状态；事实上，你希望待在战斗区域的时间尽可能短。但你在那种情况下的成功直接取决于你训练的程度和质量。对于蓝队成员来说，这意味着持续的培训和改进。如果你没有通过导师指导和正式培训来提高个人技能，那么你就是在通过结构化的演练、红蓝对抗（purple\
  \ teaming）和测试新的检测手段来提升团队能力。跨学科培训也同样重要。有时，很难挑选出你了解但同事不了解的事情，反之亦然。在多个学科（包括你专业领域之外的）进行培训有助于减少对特定团队成员的过度依赖。\n\
  \n## 如何奖励优秀的蓝队工作？\n\n人们应该通过增加薪资和晋升机会获得优秀工作的报酬。但奖励和激励并不总是正式或金钱形式的。了解驱动你员工的动力，并为质量和主动性提供一系列奖励至关重要。这些奖励可以是追求热情项目的时间和资源、对其工作的口头或书面认可，或者在团队中承担更多责任。我喜欢那种团队中任何成员都可以“授予”的非正式认可。你可以对此发挥创意，这会鼓励团队认可彼此的工作。\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护一个成功的信息安全计划？\n\n每个蓝队都需要两种指标：一种用于内部运营，另一种用于衡量对组织的影响。内部指标帮助团队改进技术运营。识别事件的平均时间（MTTI）、响应的平均时间（MTTR）、按检测源划分的误报率和真报率以及监控覆盖范围，都是团队可以追踪以提高自身能力的有用指标。外部指标更具战略性，用于衡量蓝队的价值和贡献。例如，从事件中恢复的平均时间以及按阶段划分的事件发现情况（理想情况下这些趋势应向左移动，意味着团队正在减少成功攻击的影响）。我也是目标与关键结果（`OKRs`）的拥护者，它们衡量了实现特定有限目标的进展。\n\
  \n## 如果你在一个安全基础设施非常原始的中小型企业中，且是唯一的信息安全人员，你该从哪里开始？\n\n良好的安全始于态感知。我会尝试至少在主机和网络层获得最小的可视性，以更好地理解环境中发生了什么，调查我发现的问题，并从那里向外开展。在能够响应事件、执行策略和解决反复出现的问题之前，你必须能够监控环境。在网络层，对\
  \ `DNS`、`SMTP` 和 `HTTP` 等核心服务的可见良好的良好的开始而在主机层，事件日志是必须的。\n\n## 性价比最高的安全控制措施是什么？\n\
  \n完整且最新的资产清单。`CIS Top 20` 中的前两项控制是硬件和软件清单，这非常有理。由于检测和可防御网络架构的很大程度上基于对环境中拥有什么的理解。如果你对这些了如指掌，你可以在不部署任何安全产品的情况下产生巨大的影响。\n\
  \n## 你的组织实施了任何欺骗技术吗？\n\n我用过 `honey tokens`（蜜罐令牌）来触发深度侦察或利用后活动的检测。我喜欢这项技术，因为它不复杂且廉价，但非常有效。对于蓝队来说，遍布环境的\
  \ `honey tokens` 提供了高保真的检测，标记了攻击中某些破坏性最大的阶段。\n\n### 组织应该在何时使用加密？\n\n假设加密应用得当，它可以成为蓝队的福音。它是我们使用的信任框架的基础，借此减少垃圾邮件并验证我们想要访问的网页资源等。蓝队应该接受在这些控制措施中使用加密，但同时要理解加密如何影响安全监控和其他防御措施。近期在\
  \ `DNS over TLS` 和 `DNS over HTTPS` 中采用加密是一个很好的例子，这种做法改进了隐私，但为网络安全监控带来了挑战。\n\n##\
  \ 你如何处理数据治理以及减少数据足迹的方法？\n\n当我开始从事安全运营时，我们的方法是收集所有能获取到的数据，即使我们不确定如何将它们用于检测。除此，我们不需要太多的数据收集策略（或者认为不需要）。今天，隐私和监管格局大不相同，更不用说有更多数据要收集。我强烈主张只收集支持检测和调查所需的数据。在某些情况下，捕捉敏感数据是不可避免的，但如果你可以对其进行掩码处理或完全避免收集和存储，会更简单也更安全。一个考虑到存储成本以及对所收集数据的监管影响的数据收集策略已不再是可选项。\n\
  \n## 你对合规性有什么看法？\n\n我认为合规性在意识方面产生了一些积极影响，并且在理论上在某些行业和基础设施中执行了最低安全标准。蓝队成员在合规性上出错的地方在于，我们将合规与安全混淆了，或者认为因为我们合规，就不需要采取步骤来确保安全。根据我的经验，合规性是一个很好的推动因素，可以促使我们部署某些控制措施或发布政策。\n\
  \n## 是否有某个框架可以将蓝队执行的活动或功能与监管合规要求对齐？\n\n我认为 `NIST 风险管理框架` 在桥接合规（在此例中为对系统进行分类和安全控制清单）与蓝队活动（如安全监控）方面是一个坚实的概念。这个框架以及其他框架的缺点是，仍然取决于单个组织如何实施这些指南以及什么构成了成功。我给客户的建议是尽可能同时遵循指南的字面意思和精神。例如，如果你为了满足“监控”要求而收集数据，但没有人在利用这些数据，你可能合规了，但你仍然没有在实践良好的安全。\n\
  \n## 你如何参与组织中的所有不同部门以实现防御最大化？\n\n你必须走出 `SOC`（安全运营中心）。蓝队有一种内部营销元素，你必须不断向用户和利益相关者“推销”安全，而不是用它来敲他们的头。这是一项持续的努力，包括培训和意识、简报以及参与蓝队演练。用户可以是安全工作中强大的盟友，但你必须定期且建设性地与他们互动。\n\
  \n\n\n\n\n### 你使用什么策略向非技术决策者传达你所遇到的威胁？\n\n第一步是意识到组织的存在并不是为了绝对安全，因此你不能期望所有的决策者都对蓝队认真对待每一件事感兴趣。我喜欢使用“五问分析法（five\
  \ whys）”方法，通过对一个问题进行迭代提问，直到找到根源。\n\n反过来使用这种方法（即“我为什么要关心这个？”）是将技术漏洞或其他问题抽象为更广泛的业务影响的绝佳方法。决策者离技术越远，在能够与他们进行有效沟通之前，你就越需要回答很多“我为什么要关心这个？”的问题。\n\
  \n# 在发生重大持续事件期间，对于管理非技术高管的预期有什么建议？\n\n掌握工作主动权，或者至少在开始提供一个清晰的计划和参与规则（rules of engagement），可以帮助你避免双方的挫败感。分析和调查是一门艺术，但在事件期间，非技术高管对这些并不感兴趣。响应工作必须从清晰的行动计划、具体的目标以及经各方同意的通信计划开始。在真空状态下，高管会介入并为你制定这些东西，你会发现自己一直坐在会议桥上不断更新进度，并陷入无尽的细节。\n\
  \nWileyPRE\n\n# 37\n\n## Mitch Parker\n\n![](img/c37uf001.png)\n\n> “蓝队利用他们能收集到的所有信息并将其整合，以此制定策略和战术，以评估并应对威胁。”\n\
  \n**Twitter:** [@mitchparkerciso](https://twitter.com/mitchparkerciso) • **网站:**\
  \ [www.linkedin.com/in/mitchparkerciso](http://www.linkedin.com/in/mitchparkerciso)\n\
  \nMitch Parker 是 IU Health 的 CISO，这是印第安纳州最大的医疗系统。他最初作为国防机构的合同信息保证分析师开始信息安全职业。多年来，他通过担任顾问和\
  \ CISO 管理信息安全组织，在国防领域积累了丰富的经验。Mitch 曾在 *Ars Technica, Healthcare IT News, CSO Online,\
  \ Healthcare IT Today* 以及许多其他出版物上发表文章。他还在会议和大学进行过演讲和客座讲。\n\n## 你如何定义蓝队？\n\n我将蓝队定义为组织中负责防御企业网络威胁的部分。他们从构建安全系统和平台的组织部门获取信息，并将其与自己的知识和情报来源相结合。蓝队利用他们能收集到的所有信息并将其整合，以此制定策略和战术，以评估并应对威胁。\n\
  \n## 蓝队应该具备哪些核心能力？\n\n蓝队需要的两项能力是：对他们运行的环境有深入的理解（包括能够帮助找出谁拥有或负责哪些内容的团队成员），以及能够快速学习和解码针对合法流量和攻击流量的新方法及新流程。\n\
  \n# 事件响应计划的一些关键优势是什么？\n\n我认为一个计划的关键优势可以总结为以下几个关键领域。\n\n* **理解：** 了解你的基础运行环境以及谁在维护关键系统\n\
  * **检测：** 能够检测到基础环境的变化，并将其追溯到做出这些更改的人或第三方\n* **通信：** 将你发现的内容有效地传达给正确的人\n* **教育：**\
  \ 不断对自己和团队进行技术、战术以及正在使用的最新技术的教育\n\n# 蓝队成员可以如何学习、实践和成长？\n\n他们能做的最好的事情是利用容器化和虚拟化来构建自己的环境。像红队成员一样，你需要对一切是如何运作的、正常和异常行为长什么样有理解。应用程序和系统有很多行为是你必须理解的。系统会产生非常频繁的交互。最好的学习方法是自己构建系统，或者获取它们的镜像来观察它们是如何工作的以及如何发送和接收数据的。\n\
  \n> 系统会产生非常频繁的交互。最好的学习方法是自己构建系统，或者获取它们的镜像来观察它们是如何工作的以及如何发送和接收数据的。\n\n建议像红队那样学习。获取虚拟机。学习如何反向工程代码。关注会议和\
  \ Twitter 上的内容。那里有很多素材。你只需要应用并理解它们。\n\n你还必须不断地学习。那里有很多素材。充分利用我们社区中最优秀的成员免费提供的资源，例如\
  \ Ian Coldwater、Gabrielle Hempel、Marcus Carey 和 Mudge。提问。不要害怕接触这些大人物并向他们请。\n\n#\
  \ 你如何奖励优秀的蓝队工作？\n\n你必须始终认可巨大的努力。利用你现有的任何机制确保你能吸引并留住你的团队成员。不要基于某一次活动来给予奖励。保持你的团队快乐、获得丰厚的报酬并接受良好的教育。确保你的目标反映了他们正在工作。帮助他们建立事业，而不仅仅是期望他们整天看日志。为他们制定可以遵循并成功的计划。\n\
  \n# 蓝队可以使用哪些核心指标来建立、衡量和维护一个成功的信息安全计划？\n\n我发现最有说服力的是阻止的针对性攻击数量。这证明了情报在发现鱼叉式钓攻击方面的有效性。其他的包括分析的日志和来源数量、监控的设备数量以及发现的漏洞数量。你还需要报告平均修复时间。\n\
  \n# 如果你是一个安全基础设施原始的中小型企业中唯一的信息安全人员，你会从哪里开始？\n\n你需要一个良好的日志分析平台来分析你所有设备的数据。人类已经无法通过肉眼观察了。从建立一个小型\
  \ `ELK Stack` 服务器开始收集日志并监控网络。开始查询并分析你的数据，找出痛点在哪里。使用开源工具进行漏洞扫描。解决发现的问题以满足即时需求的同时，规划更好的长期控制措施。尽早开始评估和处理。\n\
  \n> 你需要一个良好的日志分析平台来分析你所有设备的数据。人类已经无法通过肉眼观察了。\n\n## 你的组织实施了任何欺骗技术吗？\n\n我们尚未实施这些技术，因为我们认为市场仍在成熟中，而且这些技术的使用需要非常深熟的考虑。这项技术具有巨大的前景，并最终会被使用的。\n\
  \n\n\n\n\n### 组织应该在何时使用加密？\n\n在他们能够有效管理加密的情况下。管理不当的加密比不加密更糟糕，因为它提供了一种虚假的安全感，让人们认为在不存在机密性和完整性的地方确实存在。当你实施这些措施时，请考虑你将如何管理私钥和公钥、密码短以及服务器证书。不要使用默认设置，务必始终生成自己的证书。确保你的操作系统和加密库更新到最新版本。\n\
  \n使用自签名证书或过期的证书，并告诉系统管理员点击跳过它们，这意味着当有人发送钓鱼邮件时，他们也会照做。由于我们没有管理好加密，这可能会导致更大的攻。。\n\n\
  对于传输中的数据、静态存储的数据，以及结合双因素身份验证的任何远程访问或系统管理，请使用加密技术。\n\n## 你如何处理数据治理和其他减少数据足迹的方法？\n\
  \n数据治理是减少数据和应用足迹的一种途径。它实际上是最有效的，因为它可以识别出生成组织所使用的最重要数据的“事实来源系统”。这让你能够将防御集中在最关键的系统上。在某种程度上，数据治理允许你进行间接的风险评估。这是因为这些流程旨在识别关键数据元素以及生成这些元素的系统。\n\
  \n## 你对合规性有什么看法？\n\n合规性是许多人认为自己很擅长、但实际上并不了解。在医疗保健领域，我们把 `HIPAA` 合规性称为金标准。然而，它的意图并不是一次性满足所有要求，而是评估并解决风险，并制定跟进计划。你不需要、也不应该尝试第一次就完美完成所有工作。如果你这样做，就就像在标准的企业桌面电脑上运行系统加固工具一样。你最终会修复自己所弄坏的所有东西。采取“评估/解决/计划”的方法，并朝着可衡量且智能的目标努力，而不是为了尝试\
  \ 100% 符合某项框架而精疲力竭。\n\n我刚开始工作时学到的教训之一是来自一位从事信息安全保障的老陆战员 Ron Lauzon。Ron 告诉我，那些 100%\
  \ 关注合规性的组织将会倒闭。你必须关注重要且风险最高的事情。当你这样做时，你就解决了许多其他问题。\n\n花费时间在 `Linux` 安装中那些由于漏洞扫描出的、你并未使用的包上进行争论，会分散你对大局的注意力。\n\
  \n## 是否有一个框架可以将蓝队执行的活动或功能与监管合规性要求对齐？\n\n我推荐 `NIST Cybersecurity Framework`，因为它具有足够的扩展性，可以映射到这些活动，并且已经映射到如\
  \ `HIPAA` 等主要的监管合规性框架。如果你处于受监管的行业，你需要证明自己正在向某个特定框架进行映射。`NIST` 是许多组织使用的标准，并且有多个通往监管框架的对照表（crosswalks）。\n\
  \n## 你如何参与组织的所有不同部门以实现防御最大化？\n\n参与是持续且必要的。你必须了解组织，才能知道如何保护它。技术资产和应用程序总会变化，而文化和团队成员的变化频率较低。我们经常忽视了组织的这一方面。我们还忽视了那些让大公司在由于高层造成的孤岛和割据的情况下仍能运行的“连接者”。我们需要了解谁是连接者，以及谁了解这些连接者。\n\
  \n## 你使用什么策略向非技术高管传达威胁？\n\n最好的建议是透明化。事件指挥系统 (`ICS`) 依赖于每个运营周期内提供报告。你希望让关键利益相关者了解最新进展。你还应该使用\
  \ `ICS`，因为网络事件现在对业务产生了严重影响。你只需要看一眼勒索软件攻击如何关闭一家企业，就能看出在组织中使用 `ICS` 有么重要了。\n\n\n\n\
  \nStuart 在信息安全行业拥有超过 13 年的经验，涵盖威胁情报交付、社交工程学、应用程序威胁建模、`GRC` 以及应急响应项目。Stuart 还创立了\
  \ The Many Hats Club，这是一个在线社区和播客节目。他是英国和欧洲会议及活动中著名的公共演讲者。\n\n## 你如何定义蓝队？\n\n任何采取行动来检测、反应和响应攻击者的人都是蓝队的一员，而不仅仅是\
  \ `SOC`（尽管这被认为是标准定义）。例如，一个结构完善的计算机安全事件响应团队（`CSIRT`）应该由 `SOC` 分析师、事件经理/响应人员、基础设施安全专家、`AppSec`、服务台（因为这些通常是事件处理者和协调员）以及其他常见人员，如信息安全负责人（`CISO`/总监）等组成。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n蓝队中的每个人都应该尝试培养调查者思维，对信息不断提问，通过内部和外部来源验证一切，并得出逻辑严密、证据驱动的结论。我个人发现，通过参与开源情报（`OSINT`）夺旗赛（`CTF`）来提高我的调查技能非常有帮助。\n\
  \n蓝队还需要能够快速分析数据、定义恶意流量/行为并遏制威胁，无论是通过工具、日志分析还是逆向工程。蓝队的最终目标是检测、遏制和消除威胁。\n\n## 应急响应计划的一些关键优势是什么？\n\
  \n对我来说，应急响应中最重要的事情是应急响应团队与关键利益相关者（如高管）之间良好且清晰的沟通。我个人见过见过由于沟通不畅导致关键决策延迟或被否决的情况；在早期做好这一点至关重要，特别是当必须快速做出艰难选择时。\n\
  \n接下来是良好的且相关的文档，例如应急响应计划、工作流和 `runbooks`，这些文档应在事件发生后或至少每 12 个月更新一次。关于 `runbooks`，要确保它们具有相关性并限制在少数场景内。我见过有超过\
  \ 30 种 `runbook` 场景的情况。没有什么比在事件发生中花费大量时间试图寻找正确的流程更糟糕的！\n\n最后，定期通过桌面演练或红蓝对抗现场活动进行应急事件场景测试是非常棒的，这不仅可以对应急响应计划进行“压力测试”，还可以确保应急响应团队为那些“完美风暴”做好了准备。\n\
  \n## 蓝队成员如何学习、实践和成长？\n\nTwitter 是学习最新漏洞、攻击技术和趋势的高效资源。蓝队成员应该关注红队成员以学习他们的战术，反之亦然；我们必须互相警惕！\n\
  \n在情报方面，国家计算机应急响应小组——`US-CERT`、`CERT-UK` 等对关键攻击和漏洞提供了良好的建议。此外，英国的情报小组非常适合与其他跨行业的蓝队成员协作，并保持对最新威胁的关注。\n\
  \n## 性价比最高的安全控制是什么？\n\n多因素身份认证（`MFA`）易部署且可以防止许多常见攻击，如凭据填充、钓鱼等。仍然有许多公司没有 `MFA`，并疑惑为什么会看到这么多账户被接管。\n\
  \n### 组织应该在何时使用加密？\n\n加密应用于保护静态和传输中的敏感及关键信息；现实情况是，许多公司仍然不对静态数据进行加密。我们加密笔记本电脑是因为这变得更容易了，随着\
  \ `Azure` 和 `AWS` 等云提供商的使用，这变得越来越可行。然而，对于本地数据库，我们仍然看到加密的优先级排在较后。\n\n谈到密码，`hashing\
  \ + salting` 是如此重要；近期发生了许多泄露事件，密码仅使用弱算法进行哈希，允许攻击者使用 `Hashcat` 等工具进行哈希比对或暴力破解。\n\n\
  ## 你如何处理数据治理以及减少数据足迹的方法？\n\n幸运的是，在英国我们有诸如 `EU GDPR` 和《2018 年英国数据保护法》等法规，这些法规为帮助组织管理如何处理和控制个人身份信息（`PII`）提供了稳健的框架。这规定了个人数据的保留形式应允许识别个人，且保留时间不得超过处理该数据目的所需的时间。\n\
  \n这些权利在确保个人有权通过“删除权”（也被称为“被遗忘权”）来减少自己的数字足迹方面也很有价值，通过主体访问请求（`SARs`），数据主体可以请求删除其信息。\n\
  \n\n\n\n攻击者并不真正在乎合规性。而且，他们正希望于你关注合规性！合规性确实很重要，但许多符合标准和法规的公司仍然发生过安全违露。合规性与安全之间存在平衡；例如，策略和程序只有在得到充分实施、团队遵循这些策略以及每个人都理解这些策略存在的原因时，才能提供保障。确保安全既关乎安全文化（组织对安全的态度），也关乎开展信息安全计划的流程。如果你唯一的关注点是合规性，那么你可能关注了错误的目标。\n\
  \n## 联动组织部门以实现防御最大化\n\n### 如何让组织中的所有不同部门来实现防御最大化？\n\n培训是帮助人们深入了解信息安全重要性的最强大的工具之一。这些课程通常是面对面的，以帮助最大化参与度，并包括真实且相关的攻击和泄露案例、它们发生的原因以及这些公司是如何应对的。最重要的是，帮助人们理解基础网络卫生技术不仅可以在工作中保护他们，还能在家里保护他们，这确实有助于获得认同和参与。根据经验，我发现幽默比恐惧更有效。\n\
  \n## 在重大持续事件期间，对于管理非技术高管的预期你有什么建议？\n\n在事件发生期间与高管沟通时，清晰、简洁且诚实的预期是最重要的。此时情绪和压力通常处于临界点，尤其是事件持续时间越长。利用你现有的数据给出明确的建议，说明哪些关键系统可以优先恢复以缓解压力，始终关注在时间范围内可以做和不能做什么。此外，当发现事件比最初预期的要糟糕时，要对意外情况或“哎呀”时刻设定预期，特别是在泄露发生最初的几个小时内。\n\
  \n这似乎显而易见，但在重大事件发生的激烈时刻，显而易见的东西往往会被抛诸脑后！\n\nWileyPRE\n\n# 39\n\nCarlos Perez\n\n\
  ![](img/c39uf001.png)\n\n> “除了威胁猎和事件响应之外，蓝队是寻找不安全配置、发现安全漏洞并监控内部基础设施（无论是内部还是外部）未经授权行为的团队。”\n\
  \n**Twitter:** [@Carlos\\_Perez](https://twitter.com/Carlos_Perez)\n\nCarlos Perez\
  \ 自 1999 年起一直活跃在安全社区，曾为波多黎哥政府工作，负责网络安全和内部渗透测试。他后加入了 Compaq/HP，担任安全和网络咨询业务的高级解决方案架构师，涵盖中美、南美和加勒比地区的\
  \ 33 个国家。他帮助客户设计并实施安全解决方案，以安全的方式满足其业务需求。\n\nCarlos 曾在 Tenable, Inc. 担任反向工程总监，负责所有远程代码执行检查并发现被测试产品中的零日漏洞。他目前是\
  \ TrustedSec 的研究实践负责人，在那里为咨询团队研究并开发攻击性及事件响应工具。他因对 `Metasploit`、`DNSRecon` 等开源安全工具的贡献而闻闻名。他曾在\
  \ Derbycon、DEF CON、Troopers、PSConfEU、HackCon 和 BSidesPR 等会议上进行过演讲并提供培训。\n\n## 定义蓝队\n\
  \n除了威胁猎和事件响应之外，蓝队是寻找不安全配置、发现安全漏洞并监控内部基础设施（无论是内部还是外部）未经授权行为的团队。该团队还将更新和检查安全指标，以确保内部安全措施正在产生价值和结果。蓝队不是运营团队；最佳实践、安全产品的实施以及监控基础设施建设不应是他们工作的一部分。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n一是对不同基础设施组件如何单独工作以及如何相互运作有深入了解，此外还有这些关系与业务流程的关系以及对整体运营的重要性。\n\
  \n其次是有能力并决心尽可能记录团队拥有的知识以及所获得的知识，以确保知识是让蓝队强大的关键，而不是他们可能使用的工具。\n\n> 知识是让蓝队强大的关键，而不是他们可能使用的工具。\n\
  \n## 事件响应与团队成长\n\n## 事件响应计划有哪些关键优势？\n\n我发现很多时候缺失的部分是对教训的收集。大量的精力投入到了狩猎和信息处理中，因为狩猎是最令人兴奋的部分，但要确保获取的知识用于包含、修复等措施。\n\
  \n### 蓝队成员如何学习、练习和成长？\n\n在学习方面，通过在评估团队和个人的指标中加入学习，这要求团队对关注领域制定发展计划。团队需要在关注的领域具备专业知识。这有助于减少由于知识和技能缺乏导致的人为错误，减少基于糟糕决策的风险。\n\
  \n练习部分更具挑战性，因为管理层必须确保轮岗任务，以确保团队每个成员在不同领域都有经验。虽然会有领域专家，但轮岗确保了每个人都有基础经验来支持他们的决策过程。实验室会有帮助，但许多组织没有资源或能力让人员进行练习。年度黑客松、夺旗赛（CTF）或其他任何类型的活动都是可以考虑的替代方案。\n\
  \n### 你如何奖励蓝队的工作？\n\n第一方法是认可。做得好的人应该告诉他们他们做得很好，最好向整个团队公开。这包括他们被奖励的具体原因，以便突出导致被认可的核心原则、价值观和行动。奖励因组织而异；有些是奖金形式，有些是奖品形式，但公开认可无论政策或文化如何都应该是标准。\n\
  \n### 蓝队用于构建、衡量和维护成功信息安全计划的核心指标有哪些？\n\n有些指标如下：\n\n* 事件发生到发现的时间\n* 公开新威胁被确认到产生 `IOCs`\
  \ 简报之间的时间\n* 演练结束后生成的事项的处理速度\n\n我尝试用时间而非数量来衡量指标，因为威胁、`IOCs` 和处理资源的数量变量差异很大。解决已识别和估计任务的时间是一个更简单且现实的衡量方法。\n\
  \n### 如果你在一个基础设施简陋的中小型企业的唯一信息安全人员，你会从哪里开始？\n\n收集一份系统及其角色的清晰且最新的清单。如果不知道自己所处的战场，我们甚至无法开始对其进行准备或在其中运行。\n\
  \n\n\n\n\n> 如果不了解自己处于什么样的战场，我们无法开始对其进行准备，甚至无法在其中开展工作。\n\n更具体地说，如果不知道自己所处环境的组成部分，我们就无法知道基础设施是如何支持不同业务流程的，或者这些流程之间是如何相互影响或作用的。拥有的基础资产清单可以对其他任务进行优先级排序，并在整个事件响应过程中提供帮助。\n\
  \n### 性价比最高的安全控制措施是什么什么？\n\n与其说是一项控制措施，倒不如在我看来，配置管理是最重要的。以自动化方式配置环境的能力可以确保资产维持在已知状态，这意味着减少了日常操作中的人为风险，并能能够以更高效的方式部署新的控制措施。\n\
  \n### 你们的组织是否实施了任何欺骗技术？\n\n是的，我们针对攻击者使用的已知常用 TTP（战术、技术和程序）设置了金丝雀（canaries）。这可以带来更高的投资回报，因为为虚假服务账户等目标设置金丝雀以诱导攻击者对账户执行\
  \ `Kerberoast` 往往会产生巨大的价值，因为这是一项许多人都会执行的技术。像任何基于 TTP 的东西一样，持续的审查/更新是强制性的，因为攻击者会随着新技术的开发和采用改变其行为。\n\
  \n### 组织应该在哪些地方使用加密技术？\n\n组织应该在三个主要地方使用加密技术。\n\n*   可能的情况下系统之间的信息通信\n*   根据风险评估确定哪些数据应优先保护的静态数据\n\
  *   对凭证进行哈希处理，以确保在发生泄露时，利用此类凭证的成本尽可能高，从而赢得时间并能够在攻击者的决策循环内部进行操作\n\n### 你们如何处理数据治理以及减少数据足迹的其他方法？\n\
  \n根据我在治理方面的有限经验，“减少”是指减少信息孤岛，以便更容易遵守政府的法规。通过了解手头拥有哪些信息并尽可能地将这些信息集中化，更容易应用由委员会或内部小组制定并帮助定义的策略。数据的类型以及它如何契合业务运，将决定策略的内容以及策略的适用方式。\n\
  \n## 你对合规性有什么看法？\n\n遵守法规合规仅仅是人们应该努力实现的最低基准，这不仅包括为了合规而必须实施的控制措施，还包括为了维护和说明这些合规工作而实施的系统。这一同样的过程是安全高效运营的基础。\n\
  \n## 是否有一个框架可以将蓝队所执行的活动或功能与监管合规要求对齐？\n\n最近的一个我认为是良好基础是由 NIST 发布的 `NISTIR 8183 Rev.\
  \ 1`，该标准涵盖了识别、保护、检测、响应和恢复。\n\n### 你们如何组织组织的所有不同部门以实现防御最大化？\n\n简单来说就是玩好部门间政治和文化的游戏。每个环境都有其独特的结构和权势人物，但可能适用于许多环境的方法是专注于自己可以做什么来帮助他们最小化风险并确保他们的成功。通过将自己和团队视为实现他们目标的资产，关系会更容易建立。\n\
  \n### 你们使用什么策略向非技术决策者传达你们遇到的威胁？\n\n确保这些威胁是在其如何影响其业务流程的背景下进行传达的。这正是拥有准确且最新的资产清单，并以此构建清晰的其与不同业务流程之间关系的视图所展现出其价值的地方。人们能够以决策者可以理解的术语清晰地量化对业务的影响和影响，因为这些是根据他们所负责的业务表现来衡量的。\n\
  \n### 在重大持续事件期间，对于管理非技术高管的预期，你有什么建议？\n\n了解业务和运营，以便更好地传达风险和影响。通过了解这些，可以更好地将目标转化为特定的关注领域。高管关心的是业务，而不那么关心技术细节。\n\
  \n> 高管关心的是业务，而不那么关心技术细节。\n\n\n\n\n\n* 夺旗赛（Capture-the-flag）活动有助于持续磨炼我们的技能，并允许团队中倾向于关注事件响应中特定活动的成员拓宽他们的视野。\n\
  * 针对性的威胁建模和风险场景开发使人们能够深入研究组织的业务领域，从而真正理解某些威胁对贵组织带来的风险。\n* 协同防御演练允许你们的蓝队和其他技术团队（例如\
  \ Web 应用团队）关注攻击场景及其对应的应对措施。\n* 红蓝蓝队对抗演练允许进行模拟攻击，并为蓝队提供测试其针对特定威胁和战术防御能力的机会。\n* 演示日（Demo\
  \ days）是展示你一直在研究的主题以及该主题如何对组织有益的好极方法。证明直接影响我们工作方式的话题会更有趣。\n\n## 组织外部活动\n\n* 培训与会议\n\
  * 与其他安全团队建立联系\n\n## 如何奖励优秀的蓝队工作？\n\n组织和/或团队负责人可以通过实施认可流程来奖励优秀的蓝队工作。在我的组织内部，我们通过颁发挑战币（challenge\
  \ coins）来奖励这类工作。这可以根据贵组织的情况而有所不同。\n\n## 蓝队可以使用哪些核心指标来构建、衡量和维护成功的信息安全计划？\n\n虽然指标及其价值可能根据组织和计划类型而异，但一些核心指标如下：\n\
  \n* 调查的事件总数\n    * 按事件类型\n    * 按类别\n    * 按严重程度\n    * 按检测源\n    * 按报告类型\n* 需要升级的事件总数\n\
  * 平均检测时间 (MTTD)\n* 平均响应时间 (MTTR)\n* 平均修复时间 (MTTC)\n* 开启外部工单的案例总数\n* 由自动化创建的案例总数\n\
  * 安全警报总数及警报趋势\n\n## 如果你是一家安全基础设施极其简陋的中小型企业中唯一的信息安全人员，你会从何处开始？\n\n如果我是一家中小型企业唯一的信息安全人员，我将评估当前的安全态势，根据该组织所属的垂直领域开发风险场景，确定最需要的投资领域（时间、资源、资金），并专注于该领域的实施。根据其他领域所需的投资百分比，引入外部资源可能是值得的。\n\
  \n构建安全网络所需的基础要素之一是可见性。你无法对看不见的东西进行保护或响应。\n\n## 哪种安全控制措施性价比最高？\n\n电子邮件和身份安全控制（例如多因素身份验证）。\n\
  \n## 贵组织是否实施了任何欺骗技术？\n\n我不会对我组织已实施的技术发表评论。我个人认为，欺骗工具在安全栈中占有一席之地，前提是在计划开发的合适时期引入。\n\
  \n## 组织应该在何处使用加密？\n\n我认为组织应该评估其加密环境和加密用例，并在需要的地方实施加密。然而，通用和标准的用例包括应用于数据传输和数据存储的加密。\n\
  \n## 你如何处理数据治理以及减少数据足迹的其他方法？\n\n数据治理充当数据管理计划的监督，例如围绕数据质量、保留、策略等特定实践的建立和审计。\n\n##\
  \ 你对合规性有什么看法？\n\n合规性是信息安全计划的必要方面，允许通过专门的实践来确保降低风险的现有法律和政策得到遵守。当计划仅作为通过审计的手段时，合规性就会变得适得其反。当一个全面的合规计划被用作主动确保技术和安全控制合规的方法时，它将非常有效，因为这些控制对政策、标准以及法律的条文和/或意图都有影响。\n\
  \n## 是否有框架可以将蓝队执行的活动或功能与监管合规要求对齐？\n\n我不熟悉任何可以将蓝队执行的活动与监管合规要求对齐的单一框架，因为监管合规性取决于多种因素。有各种清单和/或指导性文档可以帮助确保组织符合特定法规的要求。\n\
  \n我认为框架通常是有帮助，特别是对于那些缺乏资源为此类主题制定适当策略的组织。我认为框架应该涵盖整个信息安全计划，而不仅仅是蓝队。\n\n## 如何参与组织的所有部门以实现防御最大化？\n\
  \n与组织的所有区域进行通信至关重要。我们通过多种方法来实现这一点，包括：\n\n* 事件响应准备工作\n* 安全态势报告\n* 网络威胁情报简报\n* 事件管理协调\n\
  * 协同防御演练\n\n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\n我们使用基于风险的方法向非技术决策者传达威胁。如果传递得当，人们不需要理解威胁的技术细节就能理解对业务/组织带来的风险。数据也是我们表示风险的驱动因素。根据数据，可以从开源（即\
  \ OSINT）或我们内部数据中获取；从网络遥测、漏洞和调查的案例中获取；以此类推。我们认为自己的数据是我们最大的来源之一。\n\n威胁的传达以多种方式进行，取决于通信的原因。可能由于活跃事件、关键漏洞、事件后响应等其他原因需要通信。根据贵组织的情况，蓝队可能是通信的承担者，因此建立流程将必要信息交给适当的小组以便他们进行有效通信是至关重要的。\n\
  \n## 在重大事件期间，对于管理非技术高管的预期有什么建议？\n\n以下是在重大事件期间无论高管是技术性的还是非技术的的一些建议：\n\n* 让你的高管了解事件的阶段以及你们正处于哪个阶段。\n\
  * 设定预期：在活跃事件期间，事实可能会随着时间的推移而发展。\n* 词很重要，所以要定义并记录它们。例如，为了避免事件响应过程中术语的混乱和误解，在开始阶段解释使用的特定词（例如“事件”）。\n\
  * 开发清晰的协议并进行传达。\n* 设置更新频率并准时完成。\n* 根据高管团队的情况，为他们开发一个仪表板以查看与案件相关的信息，该信息将根据团队的工作自动更新。这将减少提问的数量。\n\
  * 传达与事件结束相关的清晰措施。\n\n\n\n\nLauren 是一位经验丰富的事件响应人员和威胁猎寻人员，曾帮助财富 500 强企业网络识别并缓解网络攻击者。她领导过从数据泄露到针对性攻击的各种调查，并继续致力于定义网络空间中无尽的未知领域，让网络安全不再那么抽象，而是更加具体。Lauren\
  \ 担任 BSides Kansas City 的 CFP 委员会成员，是 SecKC 会的负责人，并参加所有会议。她目前持有 `GCIH` 和 `GREM`\
  \ 认证。在不在屏幕前时，你可以在户外找到 Lauren，努力不让她的山地地车摔下来。\n\n## 你如何定义蓝队？\n\n对我来说，蓝队是指任何积极识别、缓解、消除或削弱威胁及威胁行为者的群体。随着每次新攻击的出现，蓝队每天都在进化。不要误会，每个人的工作最终都归结为防御我们的企业；我们只是采取不同的防御方法。\n\
  \n定义蓝队的关键因素是他们始终处于战斗状态，不断进化，并不断改进自己和自己的企业。我在事件响应领域工作多年，你必须时刻警惕以应对下一次事件。勒索软件不会在你写完最后一份报告后才等待执行，攻击者也不在乎你昨晚为了查阅日志熬到凌晨\
  \ 3 点（事实上，他们可能更喜欢这样）。尽管事件响应具有高度的反应性，但目标始终应该是防止未来再次使用该攻击向量，或者缩短下一次攻击中的停留时间。我的第一个老板教我“预防是好的，但检测是必不可少的”，我相信蓝队应该始终具有看到发生什么的能力。\n\
  \n现在我领导一个威胁猎寻团队，该团队主要是主动的，但我们的目标仍然是一样的。尝试使用数据和情报来预测威胁的下一次行动，并填补这些漏洞。如果我们无法填补这些漏洞，我们就要确保下次当有人谈论我们猎取过什么时，是\
  \ `IR` 或 `SOC` 团队在使用我们的检测结果。\n\n## 蓝队应该具备哪两个核心能力？\n\n*   检测任何类型攻击的能力，或者针对现有检测手段漏掉的攻击创建检测规则的能力。日志对于蓝队来说是黄金，当你没有日志时，特别是当无法在中心位置进行正确解析时，你会让蓝队的生活变得极其困难甚至无法进行。\n\
  \    > 日志对于蓝队来说是黄金，当你没有日志时，特别是当无法在中心位置进行正确解析时，你会让蓝队的生活变得极其困难甚至无法进行。\n\n*   在业务中推动流程变更、政策变更和工具变更的能力。如果蓝队没有被授权与财务部门合作，在流程中增加电话核实环节，那么你所做的只是确保你的蓝队在发生业务邮件诈骗\
  \ (`BEC`) 且某笔巨款已汇款到世界另一端的西联汇后，继续忙于收拾残局。授权你的蓝队去做出能让攻击者生活变得更加艰难的改变。\n\n## 事件响应程序有哪些关键优势？\n\
  \n一个强大的事件响应程序反映了团队成员的素质。`IR` 是很辛苦的；每当电话响起，你就步入了一个你并不掌握全部细节的火场。强大的 `IR` 程序拥有一位不畏冲锋陷、照顾员工的经理。他们拥有想要将攻击者赶出网络并确保他们再也无法进入的人。他们拥有持续保持好奇心的人，即使有时你得跟在他们后面把他们拉上来喘口气。他们拥有能够承受压力的人，以及一位能够保护他们免受毒性政治和过度透支的经理。他们拥有能够面对未知的人，以及一位会在他们面前提灯引路的经理。强大的\
  \ `IR` 程序从各行各业招募事件响应人员，并对聘用帮助台大师、音乐教育专业的学生和全职妈妈开放。你总是可以教技能，而强大的 `IR` 程序会确保看到技术之外的价值。\n\
  \n强大的 `IR` 程序寻求与攻击者共同进化。他们跟踪当前的趋势、`TTPs` 和情报，并理解组织中潜在的弱点。安全领域的每一天都是新的，因此赋予团队与时俱进学习和成的能力至关重要。\n\
  \n此外，强大的 `IR` 程序了解自己的基准。他们知道哪些工具覆盖了安全堆栈的哪些部分。他们知道日志的可用性如何，以及需要去哪里获取日志，或者至少，他们知道在需要来临时该向谁索取所需的日志。强大的\
  \ `IR` 程序了解他们的组织。\n\n## 蓝队成员如何如何学习、实践和成长？\n\n蓝队成员应该参加会议、阅读博客、建立实验室并尝试对手模拟。与红队对应同事的合作让我的蓝队水平提升了十倍。我宁愿被朋友在凌晨\
  \ 2 点吵醒，也不愿遭受真正的攻击。这有助于我理解攻击者的心理，并发现漏洞。\n\n## 你如何奖励优秀的蓝队工作？\n\n休假和有竞争力的薪水！\n\n关于防御者必须\
  \ 100% 正确而攻击者只需要正确一次的格言是如此真实，坦率地说，这非常消耗精力。你必须照顾好你的员工并防范倦怠，因为这种情况发生得很快且打击很大。除此之外，奖励是对投入工作的认可，以及对培训和保持敏锐的投资。听着，我接触过的大多数进入这个领域的人都想成为渗透测试。他们想拿钱拉开连帽并点击那个魔法按钮，这没关系。\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护一个成功的信息安全计划？\n\n指标很难，但它们非常重要。如果你没有为你的蓝队建立指标，请改变路线，从今年开始制定这些指标。如果你没有可靠的指标，你实际上是在浪费资金、人员、培训和资源，因为你的故事没有被有效地传达给董事会。\n\
  \n\n\n\n蓝队也应该关注跟踪真阳性、假阳性、真阴性和假阴性的比率，特别是通过工具来实现。工具在不断变化，如果你发现工具开始将某些项目误分类为恶意项（从而为你增加了更多工作量）或漏掉了恶意项目，那么可能是时候重新评估你的工具了。我非常喜欢平均检测时间（`MTTD`）和平均响应时间（`MTTR`），因为这些可以勾勒出人员不足或安全栈不完善的丑陋事实。许多行业报告也使用了这些指标，因此你可以将自己与行业平均水平进行比较。\n\
  \n你不应该做的第一要务是将你的蓝队变成一个工单商店，并跟踪诸如处理事件的数量或关闭工单的平均时间。如果你必须通过处理工单的数量来证明配置的合理性，请确保你有一个强大的故事作为支撑，而不是鼓励你的事件响应（IR）团队为了关闭工单而非完成高质量的工作。\n\
  \n最后，记住，凡是被衡量的都会被管理（这并不总是好事），正如明智的武当帮（Wu Tang Clan）曾说过的：“金钱统治着我周围的一切”，所以确保你用高层管理人员能理解的语言与他们交流：即金钱。\n\
  \n### 如果你是一家安全基础设施简陋的中小型企业中唯一的信息安全人员，你会从何处开始？\n\n我会从在具有妥当配置的中央位置收集所有可用日志开始。通过良好的数据湖和经过正确解析的日志，你可以进行大量的检测和告警。微软在处理\
  \ `EVTX` 日志方面拥有极其优秀的文档，这可以让你洞察许多各种活动。一旦你正确处理了日志解析，就可以利用频率检测来搜索异常，并利用趋势分析来查看检测发生最频繁和最少发生的地方。对于大多数采购或招聘决策，你需要支持数据来证明支出的合理性，而集中日志记录可以帮助你实现这些计划。\n\
  \n## 性价比最高的安全控制措施是什么？\n\n我坚信，一个良好的终端检测与响应（`EDR`）工具价值相当于黄金、银和任何其他宝石的总和。随着远程办公的普及以及全球化组织的布局，我们在每天某一天很少与同事处于同一间办公室，甚至不在同一个网络上。攻击者仍然在深度利用终端，无论是通过\
  \ `Mimikatz` 获取凭据，还是为未来的隐蔽活动安装后门。能够在粒度级别检测进程更改、注册表写入、计划任务设置或文件外泄的能力，是防御工作的关键。确保寻找允许进程或哈希拦截以及远程隔离的\
  \ `EDR` 解决方案，以控制入侵。\n\n## 你的组织实施了任何欺骗技术吗？\n\n我热爱欺骗技术。我自封为“带有报复心理的蓝队队员”。有一次有人钓鱼了我祖母，所以我写了一个基于\
  \ `Python` 的凭据填充器，向攻击者的数据库中灌满了垃圾信息。我们在多次事件中使用了这种方法，试图制造一种“大海捞针”的情况，这在攻击者使用潜在的合法凭据之前争取了更多时间。\n\
  \n我们的组织还使用蜜罐（honeypot）和蜜标（honey token）防御作为预警系统。这些确实会产生噪音和潜在的假阳性，但对于识别攻击模式和找出潜伏的威胁非常有帮助。我鼓励所有蓝队使用欺骗技术。它们执行起来非常有趣，并且作为防御策略具有正面的回报。\n\
  \n## 你如何参与组织的所有不同部门以实现防御最大化？\n\n这从上而下开始。我的组织在高管层拥有出色的领导力，他们确保了安全从高管层向下保持一致。我们尽力进行教育和协作，让财务、人力资源等部门理解他们自己在防御中所扮演的角色，以及为什么这真的非常重要。\n\
  \n我不断与业务中的其他领导者联系，讨论新的协作方法，并寻找确保我们提供的反馈能使他们受益。\n\n我喜欢邀请其他业务部门参与蓝队工作，特别是威胁狩猎。许多人将网络安全视为一个高度抽象的概念，只在晚间新闻中接触到它。我们努力让它变得易于理解，并在他们在威胁狩猎或对手模拟中扮演一个角色，让他们感到自己被重视。这对我们来说也是一个巨大的收益，因为我们可以看到那些并非日复一日从事这项工作的人是如何思考的，并发现我们以前从未想过的事情。\n\
  \n> 我喜欢邀请其他业务部门参与蓝队工作，特别是威胁狩猎。\n\n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\n就个人而言，我尝试用我的配偶、父亲和祖母能听懂的方式写出威胁及其影响。我也严重依赖比喻来描绘这一画面。很多人都能理解的一件事就是钱。当人们听到去年的\
  \ BEC（业务邮件欺骗）邮件是最大的威胁时，他们往往会走神；而当他们听到 BEC 邮件是最大的威胁并导致了 17 亿美元的损失时，情况就不同了。\n\n对于在重大事件期间管理非技术高管的预期有什么建议？\n\
  \n> 始终保持冷静，随时做好准备，不要指责任何人。\n\n始终保持冷静，随时做好准备，不要指责任何人。我曾走进一个满是大叫高管的房间，那种冷静地用当时所有可用事实解释情况的能力可以产生奇妙的效果。他们可能会提出你不知道答案的问题；这没关系。确保你提供清晰、一致的更新，并以自信的坚韧继续引导船只远离冰山。记住，事件对每个人来说都是压力的，没有人想成为下一个头条新闻。\n\
  \n\n\n\n\n蓝队并非组织内部一个被划分的员工池。是的，一个组织会有一名专注于防御目标的安全团队专职人员。这些个人可能可能在逆向工程、内存取证、操作系统加固或网络取证方面拥有专业知识，但他们并不是防御（蓝队）团队的唯一成员。蓝队由许多得多的成员组成。\n\
  \n定义、编写、审查和实施政策、程序、合规性和法律要求的人员也是蓝队的一部分。这种例子在许多层面都可以看到：组织的前线支持（例如帮助热线）在用户重置密码尝试期间审查该人员；为部门部门资产增加额外安全控制的\
  \ IT 分析师；一个追求完美、并希望在策略规定之外更安全地保护系统数据的 `DBA`（数据库管理员）；以及报告其收到的任何可疑邮件的用户。这些人员都是蓝队的一部分。我希望所有这类人都能进入我的蓝队中——想象一下如果他们不在的话会是怎样。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n蓝队应该具备谈判和沟通的能力。当然，需要多个专业领域的领域的技能，但这些完全取决于组织的类型。蓝队的一项关键能力是理解何时某些事情对组织来说不是重点，并且努力应该集中在其他地方。了解何时为了安全相关的改进投入时间、精力和精力是值得的很重要。遗憾的是，如果一个组织不关注安全，那么这感觉可能像是一场艰苦的斗争。\n\
  \n理解何时接受风险至关重要，而对于任何蓝队来说，沟通都是至关重要的，无论是解释事件的范围和影响，还是展示某个工具/产品将为检测、响应或修复能力增加的价值。在响应事件时，沟通是一项核心要求。确保每个人都在同一个频道上并理解目标和后续步骤至关重要。此外，在整个事件响应过程中都需要沟通。无论你处于准备、识别、遏制、根除、恢复还是回顾性阶段，沟通都是至关重要的。\n\
  \n### 事件响应计划有哪些一些关键优势？\n\n事件响应计划的关键优势在准备阶段和回顾性阶段应该是显而易见的。在事件响应计划中，你应该拥有清晰且准确的文档。这些文档在许多人认为的事件准备阶段被定义。文档应包含关于事件响应过程的清晰指南、事件发生期间应联系谁以及何时联系，以及程序参考，这些将帮助事件响应团队有效地协调和响应。\n\
  \n事件响应计划的另一个关键优势是回顾性阶段。如果回顾性阶段得到了适当执行和落实，那么它应该不断更新、修改和调整流程，包括文档。所有这些更改和更新都将反馈到准备阶段。这意味着事件响应计划文档永远不会完全完成，它是一份活的文档，应该不断地更改和审查。\n\
  \n> 如果回顾性阶段得到了适当执行和落实，那么它应该不断更新、修改和调整流程，包括文档。\n\n如果一个团队精通了这两个阶段，那么当下一次事件发生时，他们将表现良好。他们将知道谁、在什么时候以及做什么，即使团队规模缩小、扩大或发生变化。\n\
  \n### 蓝队成员可以如何学习、练习和成长？\n\n> 蓝队成员学习、练习和成长最好的方法是满足他们好奇心。\n\n蓝队成员学习、练习和成长最好的方法是满足他们好奇心。许多组织将分析师（尤其是初级分析师）视为蜂群中的工蜂。他们希望他们盯着屏幕工作，并且尽可能不偏离任务。这种方法会导致职业倦怠，可能导致团队忽视威胁。\n\
  \n公司需要识别其蓝队成员的技能并利用它们。安全专业人员是天生的摆腾者，想要从深层理解事物是如何运作的。他们不仅想了解如何检查邮件头；他们还想了解消息是如何传输的。\n\
  \n\n\n\n作为你安全计划的一部分，你可能或应该跟踪的许多不同的指标。其中许多指标取决于你组织的任务。例如，如果你自己构建、发布并销售自己的产品，你的指标可能侧重于报告给你团队的漏洞的响应时间。你可能还有关于你代码库的静态和动态分析的指标，以及自动化测试的数量和工具的性能的指标。如果你的产品是基于\
  \ SaaS 的，那么你可能还有关于你的应用程序面临的平均安全威胁以及你应对这些威胁能力的指标。\n\n传统的安全团队，即安全运营中心（`SOC`）或安全分析师团队，将有不同的指标。根据你的安全成熟度，你应该开始持续性地捕获和跟踪你的暴露情况。使用如\
  \ `[Shodan.io](http://Shodan.io)`、`Nmap` 或你的漏洞管理平台（或所有工具）来构建暴露风险概况。此外，你*必须*理解并跟踪公司拥有什么数据、数据在何处、谁有权访问、他们如何访问以及个人为什么需要访问这些数据。对于你组织范围内的所有数据回答这些问题，对于一个成熟的安全计划至关重要。\n\
  \n不同组织对安全计划的方法各不相同。有些侧重于资产、系统、应用程序等，有些侧重于数据。我个人认为，对资产的理解是必要的，但你的核心关注点首先应该是你的数据。将你的精力和防御策略集中在这些数据上，并将你的安全团队转向以数据为中心的安全模型而不是以资产为中心的模型。\n\
  \n最后，你应该拥有的最大指标是展示你相对于所有资产、应用程序、服务等的可视性百分比。为了获得这个指标，你应该有一个 `SIEM` 或某些日志聚合器（你有的，不是吗？）。从对目前发送到你的\
  \ `SIEM` 的内容进行盘点开始。无论这包括原始事件日志、数据包捕获、产品日志甚至仅仅来自产品的告警，都要进行盘点，并确保每次发生变化时都更新它。接下来，关注你拥有哪些安全工具以及这些工具是否被发送到你的\
  \ `SIEM`。如果没有，就弄清楚原因以及如何将它们获取进来。\n\n\n\n从分析师的角度来看，合规（Compliance）通常被视为一个负面词汇。老实说，从潜在客户、客户或服务/公司使用者的角度来看，我个人并不介意合规。我希望他们遵循能够保护我个人数据的准则，因此我在公司内部也有同样的预期。\n\
  \n合规框架不断变化并扩大其范围，这使得执行起来变得非常困难。某些框架（如 `DoD 6510`）在报告要求方面极其严苛，这会带来负担。而另一些框架在定义上又非常灵活。因此，我理解人们对合规框架的各种挫败感和赞誉。\n\
  \n合规有其价值，特别是当发生事件时，你需要提供清晰的文档记录、流程和报告要求时。这是为了确保你的组织遵循强制性的最佳实践，以及你的组织必须采取的任何法律行动或救济措施。\n\
  \n### 是否有框架可以将蓝队团队执行的活动或功能与监管合规要求对齐？\n\n目前没有单一的框架可以将蓝队团队工作与所有合规框架对齐（据我知），但有一些产品和工具可以促进这一点。我个人有些偏好，但安全、编排、自动化和响应（SOAR）工具非常符合这种模型。\n\
  \n大多数 SOAR 产品允许蓝队在系列条件和动作中定义其业务和操作流程。这些合规要求可以通过这些条件和动作以工作流（workflow）或剧本（playbook）的形式（在某种程度上）自动化。此外，你可能需要的任何审计要求都（应该）内置在所选的\
  \ SOAR 平台中。将其想象为平台内采取的每项操作（自动或手动）的详细说明。SOAR 平台还允许你直接在平台内部针对任何报告相关的需求生成或创建报告。\n\n\
  我相信 SOAR 将驱动许多组织的合规需求，特别是那些需要高度详尽审计追踪的合规框架。你可以通过自动化完成其中的一些工作，但 SOAR 不同于简单的自动化。能够接入数据、基于业务和操作流程做出判断，并编排事件的收集或验证，是\
  \ SOAR 的闪光之处。\n\n再次，我带有偏见，因为我目前为一家 SOAR 供应商工作，但如果你能在白板或纸上定义一个流程，你就可以用 SOAR 实现其自动化。\n\
  \n### 如何参与组织的所有不同部门以实现防御最大化？\n\n实现防御最大化的方法有很多，但我发现最好的方法是创建能引起共鸣的内容。我过去在安全团队的一个职位包括一个安全意识协调员，负责代表我们的安全团队进行组织外接触。这包括关于我们这类组织所面临的相关且具有时效性的威胁的意识，甚至是关于个人事件（例如，钓鱼尝试）。当你试图传达最佳实践时，这种方法非常有效。\n\
  \n此外，你的安全团队应该是平易近人的，并与不同的组织会议保持开放的沟通渠道。在一个较大的组织中，我我是事件响应和数字取证团队的一员，同时我还是员工奖励委员会的主席（该委员会为员工获得培训或参加活动提供拨款）。通过与团队之外的人员建立这种可见性和沟通，使我能够更好地完成自己的工作，同时分享来自我们安全团队的最新信息。\n\
  \n最后，安全团队应该为不同的组织部门进行定制化或针对性的演示。在与部门管理员聊天时，你可以谈论个人安全；在与行政人员交谈时，你可以谈论钓鱼；这取决于具体而定。无论你做什么，请确保内容是现代且紧跟潮流的，并加入几个梗或内部笑话来展示你的幽默感，如果需要灵感，可以去搜一些冷笑话（dad\
  \ jokes）。\n\n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\n在向非技术决策者传达你遇到的威胁时，我强烈建议展示这些威胁对运营的影响。例如，出现了某个零日漏洞，并影响了你们组织的设备集群。展示威胁对你的组织部门产生的影响有助于平衡竞争环境。大多数非技术决策者都能理解能力规划、资源限制和生产力影响，因此请展示这一事件是如何影响你的团队的。你可以通过分享花费在事件响应上的小时、使用的全职人力（FTE）总数，以及此事件对正常业务可能产生的影响（例如，由于响应工作导致项目延迟）来实现这一点。\n\
  \n## 在重大持续事件期间，对于管理非技术高管的预期你有什么建议？\n\n需要清晰的沟通渠道和预期的设定。如果你正确地创建了事件响应计划（`IRP`），那么你已经审查了该计划并获得了高管的批准。这意味着你的\
  \ `IRP` 包含了提供更新的流程。如果没有，没关系——但作为回顾的一部分，你应该确保将其添加到 `IRP` 中。\n\n在现实中，每个事件都是不同的，每位高管都有不同的预期。确保你清晰地传达持续事件的状态，并尽量不要给出估值。如果你必须给出估值，请确保所有的限制条件都到位。此外，提供一个将提供更新的精确时间，并确保在设定的时间准时执行——无论如何。\n\
  \n事件响应过程的一个关键部分是确保所有通信都与事件指挥官进行。该人员是掌控全局的；你可以将他们视为四卫。他们宣布战术并与事件响应团队的个人成员交流，这些成员将信息回传给指挥官，始终确保他们是信息的真实来源。随后，该人员将与公关或营销部门合作，以确保所有沟通内容一致且不偏离。\n\
  \n\n\n\n定义蓝队是一项巨大的挑战，因为参与此类操作的人员范围非常广泛。在某种意义上，蓝队是由核心工作职责是确保组织安全的人员组成的。然而，安全工程师、SOC\
  \ 分析师和事件响应人员等团队可能属于这一类，但如果没有整个组织、开发人员、网络工程师、帮助热线等人的支持，他们在自己的岗位上无法取得成功。\n\n## 蓝队应该具备哪两个核心能力？\n\
  \n沟通与管理支持。虽然从技术/技能角度来看这不一定是传统的“能力”，但如果没有团队内部进行协调的能力，世界上所有的技术都无法提供任何价值。此外，安全部门通常是组织内部一个被忽视或不受欢迎的部门。我们被视为说“不”的人，试图通过安全控制让事情变得复杂。\n\
  \n> 如果一个知道如何有效沟通团队需求并提供高层支持的管理团队，任何项目的成功都将充满挑战。\n\n如果没有一个知道如何有效沟通团队需求并提供高层支持的管理团队，任何项目的成功都将充满挑战。\n\
  \n## 蓝队成员如何学习、实践和成长？\n\n实战经验是学习、实践和成长最好、最高且最有趣的方法。我最钦佩并认为他们在职业中将取得巨大成就的新人，是那些渴望知识、并通过不断尝试、提问和犯错来回应的人。那些想要理解网络流量分析的人只需启动\
  \ `Wireshark` 并开始查看数据包。这些人将在他们的职业生涯中大放异彩。此外，管理层鼓励员工追求兴趣并花时间学习新技能，而不是将他们锁在目前的技能组合中，这也是非常重要的。\n\
  \n> 我最钦佩并认为他们在职业生涯将取得巨大成就的新人，是那些渴望知识、并通过不断尝试、提问和犯错来回应的人。\n\n## 如何奖励出色的蓝队工作？\n\n\
  意识到在网络安全领域工作（尤其是蓝队角色）可能带来的压力和职业倦怠至关重要。这通常是一份不讨好报的工作，只有在出现问题时你才会出现在光灯下，当一切顺利运行时，却很少得到认可。正因如此，我认为有两点可以对蓝队成员做以奖励他们的工作。首先，对成功的普遍认可、感谢或向上级部门提交一份认可员工的备忘录，对于确保员工理解自己的价值将非常有帮助。其次，理解对心理健康休息的需求。特别是在完成重大项目或事件之后，为员工提供机会从增加的压力中恢复至关重要，无论是休息一天，还是为员工提供一天进行培训/处理他们想做的事情。\n\
  \n## 性价比最高的安全控制是什么？\n\n日志记录。在应用程序和操作系统中开启日志通常不会产生额外的产品成本，只会消耗项目时间和资源。虽然有许多可以且应该实施的防御技术，但你的组织可能总会有被入侵的。当需要响应此类事件时，对攻击活动缺乏可见性将限制蓝队寻找根源、遏制和修复事件的能力，并最终防止攻击再次发生的能力。\n\
  \n## 你对合规性有什么看法？\n\n虽然从理论上讲，合规提供了一种确保组织符合某些安全标准的方法，但我们在所谓的受监管行业中观察到的泄露事件数量，并不支持这些努力的有效性。即使对违规行为执行了罚款等处罚，我们仍看到许多组织开完支票就继续业务。与生活中的许多事情一样，合规性在纸面上是一个好主意，但在实践中尚未证明其有效性。\n\
  \n## 是否有某个框架可以将蓝队执行的活动或功能与监管合规要求对齐？\n\n我工作过的最好且最清晰的框架是 `CIS Controls`（尽管在监管合规方面历史有限）。我认为使用框架有利有弊，这实际上取决于组织对待它们时的心态。如果一个组织是受法规迫使，仅仅为了通过检查而做最低限的工作然后置之不顾，那么我不认为它被充分利用了。然而，使用此类框架有几个积极的用途。\n\
  \n首先，对于需要起点的新兴组织，此类框架通常为实施关键安全控制提供了良好的建议。\n\n其次，高管喜欢像框架这样的指导来证明项目的合理性。将提议的项目映射到广知的合规框架中，可能会为犹豫的审批链（他们并不一定理解）提供依据\n\
  \n\n\n作为安全从业人员，我们从不同的视角来看待安全。如果仅仅因为别人或他们“做事方式不同”、不是“盯着屏幕的人”或不在“一线”，就贬低他们或他们的经验，那将是一种遗憾。这并不意味着他们没有提供价值。\n\
  \n我们可以相互学习；通过这种共同学习，我们都会变得更强大。\n\n## 蓝队成员如何进行学习、实践和成长？\n\n一名全能蓝队从业者需要许多技能。由于我们生活在个人计算的黄金时代，每位蓝队从业者都需要自己的个人实验室。这个实验室不需要很大、很贵、物理化，甚至是持久性的，也能发挥作用并提供丰富的教育价值。\n\
  \n云计算成本正处于历史低位。你可以启动任何配置的系统和服务，并仅为你使用的时间和资源付费。单板计算让你的实验室小型化，并将其放入口袋中。\n\n> 任何从业人员最重要的需求是什么？对学习的动力和奉献。\n\
  \n任何从业人员最重要的需求是什么？对学习的动力和奉献。\n\n## 蓝队可以使用哪些核心指标来构建、衡量和维护成功的信息安全计划？\n\n指标在任何安全计划中都起着关键作用，特别是因为我们无法改进我们无法衡量的东西。质量指标让我们洞察组织的运行情况，并能突出关键缺陷。\n\
  \n关注于网络状态的指标对于理解攻击面、识别潜在的立足点以及确定系统和网络的整体健康至关重要。\n\n关于你的安全计划的漏洞管理，可以收集的一些有用指标包括：\n\
  \n*   **网络和服务范围覆盖率：** 不要假设漏洞扫描完全覆盖了网络上的每一个系统和服务。完全覆盖取决于实时的资产清单，并且通常需要身份验证凭据来获取详细的服务信息。\n\
  *   **漏洞存留时间（Vulnerability dwell time）：** 漏洞在被修补之前存在多长时间？存留越久，组织的风险就越大。在处理关键业务应用程序和服务器的漏洞时，影响更大，这一指标也变得更重要。\n\
  *   **补丁时间（Time to patch）：** 一旦厂商发布安全漏洞补丁，你的组织需要多长时间将这些更新应用于资产，防止被攻击者利用？\n\n## 如果你是一家安全基础设施简陋的中小型企业中唯一的信息安全人员，你会从哪里开始？\n\
  \n任何优秀安全计划的基础都是良好的可见性。你无法防御你看不见且不知道的东西。我做的第一件事是建立一份资产清单，这是一份包含公司拥有并运营的每一个技术和软件的详尽列表。\n\
  \n*   是的，这需要时间。\n*   是的，这将是一个活文档。\n*   是的，这会令人感到沮丧。\n*   是的，这是值得的。\n\n一旦你了解了你所防御内容的细节，就可以开始规划防御它的最佳方式。\n\
  \n## 哪种安全控制措施性价比最高？\n\n> 基于主机的防火墙是性价比最高的控制措施。\n\n基于主机的防火墙是性价比最高的控制措施。每个现代操作系统都内置了防火墙，并可以在大规模部署之前进行配置。\n\
