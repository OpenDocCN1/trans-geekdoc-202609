  \nMichael 在计算机安全和情报领域担任过各种角色将近 30 年。他曾在军事、政府和商业市场担任过一线、管理和执行职务。Michael 曾共同创立了多家安全初创公司，担任过\
  \ C 级职位，或在公司的形成和运营中发挥过重要作用，他非常幸运，因为他得到的多于付出的。\n\n## 你如何定义蓝队？\n\n实时防御操作、安全编码、安全工程、策略……这些都很好且很重要，但在这些每一个空间中，他们都拥有时间优势，或者至少有一定的时间优势。蓝队没有这种奢侈。蓝队负责现在路上和终端上正在发生的一切。没有暂停键；也没有延期截止日。\n\
  \n## 蓝队应该具备的两个核心能力是什么？\n\n意识和好奇心。你必须知道你正在试图防御和保护什么。其他一切都始于此。如果你不知道应该关注什么，那么投资安全技术或服务的意义何在？\n\
  \n好奇心是团队成员需要具备的特质。它是任何从事安全角色（无论是防御还是进攻）的人都需要具备的本质特质。如果没有好奇心以及它的表兄弟韧性，你只是在盯着屏幕等某些事情发生，这当然是你应该做的事情的完全相反。\n\
  \n> 好奇心是团队成员需要具备的特质。\n\n## 事件响应计划有哪些关键优势？\n\n良好的 IR（事件响应）计划需要每个被要求参与相应活动的人都能清晰理解并执行。如果你抽调安全部门之外的人员（正如你应该做的那样），职责和责任需要被明确定义，使用的语言对各方来说应该是无歧的。\n\
  \n所有这些都需要定期进行测试，以解决问题，并让人们在真实情况发生时会有所准备（真实情况很少像演习）。在每次真实事件后都应该编写一份行动报告，以便解决新的进展或不可预见的问题并将其纳入计划。良好的\
  \ IR 计划是活文档的定义。\n\n## 蓝队成员如何学习、实践和成长？\n\n*   **阅读：** 像你的工作取决于它一样去阅读。阅读尽可能化的内容。\n\
  *   你很快就能发现哪些是安全内容最可靠、实时的来源。\n*   一旦你理清了，就开始从业务内容或你所在行业的来源中获取输入建议。\n*   对你所支持的组织及其业务模式建立工作性的认知。\n\
  *   读一本历史书。Durant 夫妇的《历史的教训》是一本很好的入门读物，可以帮你入门。\n*   Stoll 的《金雀蛋》（The Cuckoo's Egg）是一门我们领域历史的短期课程；它今天与\
  \ 20 世纪 80 年代中期写作时一样准确。\n\n\n\n\n\n-   **培训：** 如果你没有培训预算，可以利用像 Cybrary ([www.cybrary.it](http://www.cybrary.it/))\
  \ 这样的免费资源。许多供应商和服务提供商都提供了其工具的免费版或功能限制版。利用它们来熟悉新的技术和方法论。你可能在目前的职位上无法使用它们，但它们只能增强你的理解，并为你接下来的工作做好准备。\n\
  \n-   **写作：** 我们中没有人是莎士，但通过写作来记录你的问题、胜利和发现（必要时请获得许可），这种练习可以起到两个作用：它能帮助你理清思路（清晰是关键），并能开启该领域内其他人士之间的沟通渠道。在某个地方，一定有人遇到过你所的问题的问题并拥有答案。另一些人需要知道他们在处理这些问题时并不孤单。与他人互动并成为社区的一部分。这并不是为了尝试成为什么“某某名人”或令人畏惧的网络安全“摇滚之星”。它是学习与回馈的对等结合体。\n\
  \n## 如何奖励优秀的蓝队工作？\n\n嗯，如果我们认为一个组织已经为蓝队建立了清晰且可实现的目标、成功衡量标准，以及一套奖励制度和职业路径，那我们的假设就太大了。我不清楚有多少家机构做到了这一点。任务往往是“阻止邪恶\
  \ \\*\\*\\* 发生”，这就是为什么许多蓝队被视为浪费、成本中心，并被认为表现失败。但如果我们假设已经建立了良好的指标并达到了这些指标，你所做的最好的事情就是对评估期间或事件期间发生的情况进行事后报告，识别出那些能让事情进展得更好/更快的因素，并对其进行投入。向那些保护你的人展示你的关注，表达你对他们工作的重视，尊重他们的努力，并希望为他们提供做得更好的所需的工具。高管层会竭尽全力为财务、市场营销等部门获取最新、最好的工具，但由于某种原因，安全部门被预期能空手变奇迹。\n\
  \n> 向那些保护你的人展示你的关注，表达你对他们工作的重视，尊重他们的努力，并希望为他们提供做得更好的所需的工具。\n\n## 蓝队可以使用哪些核心核心指标来构建、衡量和维护一个成功的信息安全计划？\n\
  \n每个行业或组织都有其他们关心的特定事项，但有几个指标是我认为是“通用的”。速度就是之一。与你开始时相比，现在检测恶意活动的速度快了多少？你多快能让受影响的设备恢复运行？面对新情况时，你能多快召集合适的人并做出决策？\n\
  \n另一个是影响力。你是否很少与高管交流，还是说你是一个 `C` 真正代表意义的首席信息安全官（CISO）？你在正确的层级进行沟通以完成任务的能力与任何技术都一样重要。\n\
  \n我不知道除了 `communication`（沟通）这个词还能如何描述。安全被讨论的频率和运营、财务或供应链一样吗？当基层员工有疑问时，他们会自由且乐意地找你吗？当他们不小心做错了什么时，他们会找你吗？在将安全视为警察功能并将响应视为惩罚形式的组织中，你看不到很多沟通。\n\
  \n## 如果你是一家安全基础设施极其原始的中小型企业唯一的信息安全人员，你会从何开始？\n\n这切都归根于意识。我负责什么？我在保护什么？万物从这个基础上开始生长。在这个基础上，我清楚我拥有什么，包括我拥有哪些原生能力（例如，所有的操作系统都是最新的且具备\
  \ `FDE` 能力），以及我面临哪些关键问题（例如，90% 的操作系统已经过时）。当你知道自己拥有什么，你就知道缺少什么，并且可以向高层汇报这些缺陷以及你的改进计划。你可以用数据来支持你的请求。这已经占了\
  \ 50%。\n\n> 你可以用数据来支持你的请求。这已经占了 50%。\n\n另外的 50% 是与 CEO 进行一次坦诚且开放的讨论，了解他们对安全的真实感受以及他们对你的期望。没有他们全方位且公开的支持，你什么也做不成。他们为了面子有番话可说，也有他们为了实现目标而所做的。如果你想成功，就必须与后者保持一致。这不可避免地意味着你方面的妥协。你必须接受不完美，因为没有人*想要*安全；他们是出于无数原因而*必须*拥有安全。\n\
  \n## 性比最高的安全控制措施是什么？\n\n2FA（双重身份验证）。它正变得越来越普及且越来越免费。如果正确且全面地执行，它可以消除一整类攻击。有一拨人喜欢指出\
  \ 2FA 的缺点，特别是通过短信的 2FA，但总比比无要好，而且那些说“2FA 坏了”的人所假设的威胁模型，并不是大多数其他使用电脑世界的威胁模型。\n\n\
  ## 你的组织是否实施了任何欺骗技术？\n\n作为一名前情报官，对于在网络安全领域借用 `deception`（欺骗）等术语，我有特别强烈的观点。对我来说，欺骗行动意味着非常特定的东西，模拟的虚假终端作为触发器并不完全符合标准。这一点以及复杂的欺骗方案助长了某些部门中一种有害的驱动，即让客户为人们的间谍对战幻想买单。我理解这些论点，但我还没有遇到过一个为了深入了解攻击者而想要扩展\
  \ `pwnage` 能力的客户。人们只想回到工作中。\n\n现在，欺骗方法的有效性是不容怀疑的。回看看克利夫·斯托尔的《比谷物》，就能看到这种努力有多大的威力。我倾向于让欺骗努力作为一种“预警”机制。很多人从一个好的想法（如传感器）开始，然后试图变得全能。我的意思是，谁不需要另一个查看数据的面板呢？警告邪恶的存在就足够了。如果你有欺骗工具，你已经有了其他可以帮助的工具；你不需要另一个。\n\
  \n### 组织应该在何时使用加密？\n\n我不完全确定大多数组织应该对加密投入过多。我知道正在阅读此内容的数学痴迷正拿着他们的火炬和叉子，但请听我解释。如果你作为一个组织，不知道你所有的数据在哪里、由谁控制以及谁有权访问，那么加入加密热潮可能是你最不该的事。如果你想做加密，请先做好功课。最好的情况是你的数据存储或交给真正理解加密以及如何实现加密的人，并且他们接过了接力棒。让他们去做吧，因为他们负担得起正确执行加密所需的特定痴迷；你可能不能。\n\
  \n> 如果作为一个组织，不知道你所有的数据在哪里、由谁控制以及谁有权访问，那么加入加密热潮可能是你最不该的事。\n\n尽管如此，但每个人都应该理解通过各种手段可使用的原生加密能力并实施它们。快用上\
  \ `HTTPS` 吧。\n\n\n\n\n我们真的需要打破一种观念，即因为我们可以存储所有东西，我们就应该把它存起来。我记得我的第一块 `100 MB` 硬盘；它贵得要命，我当时想我再也不需要第二个了。而今天，我们存储所有的音乐、电影、书籍和图片已经是习以为常的事，因为存储空间已经极其廉价且充足。但所有这些数据都是一种风险。我不会详细详述勒索软件的危害，但数据劫持者无法锁住不存在的东西。这更多是些体力活，但在当今时代，它是至关重要的。你的数据在哪里？谁在控制它？谁有访问权限？你如何决定哪些保留，哪些可以删除？你多久以及以及多大程度地进行备份？你把这些备份存在哪里？虽然是些体力活，但如果你希望能够行使某种程度的控制权，这就非常重要。\n\
  \n> 我不会详细详述勒索软件的危害，但数据劫持者无法锁住不存在的东西。\n\n## 你对合规性有什么看法？\n\n合规性名声不太好，是因为有很多人将合规性与安全性混为一谈。合规性建立了你相对于标准的位置。如果你从零开始并进行一次合规性检查——即使你在许多方面（或所有方面）都不符合合规——你的状况也比以前要好，因为你清楚了自己的所处境地。然而，决策者需要理解，安全性是一个持续的过程，而不是一个二元对的状态。合规性基本上是“到场”。如果你想成功，你必须做得更多。\n\
  \n## 是否有某种框架可以将蓝队执行的活动或功能与监管合规要求对齐？\n\n我凭记忆力说，我不确定是否以任何正式或被广泛接受的形式存在这种东西。在 `NIST`\
  \ 或 `CIS` 之类的内容之间进行交叉对比（crosswalk）并将其映射到 `HIPPA` 等内容，可能并不太费力，这取决于适用于你业务的标准。我敢打赌，可能不止一个人在公司内部做过这件事；这只是一个如何让他们分享出来的问题。\n\
  \n## 你如何让组织的所有不同部门以实现防御最大化？\n\n一切都从 `CEO` 开始。你对组织防御的计划必须解释清楚，目的和价值必须清晰，并且你需要他们的明确确认，表示他们同意、批准并希望它发生。他们需要亲自向执行团队和员工传达这一信息。在这些这些的支持下，你将获得所需的支持，让每个人参与到前进的努力中。这并不是说不会阻力，因为不可避免地，你想做的事情将与公司的盈利模式发生直接冲突，但你会获得参与感，而这已经赢了一大半了。\n\
  \n## 你使用什么策略来向非技术决策者传达你遇到的威胁？\n\n你必须使用你的听众的词汇并理解他们他们在意什么。这就是为什么我说你需要阅读很多内容并理解你在为谁工作。你必须展示我所谓的“领域尊重”，因为他们不会费力去理解安全。读读来自任何\
  \ `AV` 厂商的恶意软件报告；大多数报告都说“可能导致任意代码的执行”。对于一个靠弯曲金属为生的人来说，这意味着什么？对于一个管理卡车队的人呢？对于一个追踪流水线上\
  \ 100 人生产力的人呢？“可能允许某些中断你赚钱的能力”是一个如何做得更好的粗浅例子，但你领会其中的精髓了。\n\n我曾运行 `DOD` 用于警报军事指挥及政府其他大部分部门应对国家级和非国家行为者网络威胁的警报系统。警告业务有自己的词汇，`CNO`\
  \ 业务也是如此，所以在某种程度上，如果不违背既定方法论，我们几乎无能调整我们的信息（是的）。\n\n## 在非技术决策者管理预期时，你有什么建议？\n\n你必须使用你的听众的词汇并理解他们他们在意什么。这就是为什么我说你需要阅读很多内容并理解你在为谁工作。你必须展示我所谓的“领域尊重”，因为他们不会费力去理解安全。读读来自任何\
  \ `AV` 厂商的恶意软件报告；大多数报告都说“可能导致任意代码的执行”。对于一个靠弯曲金属为生的人来说，这意味着什么？对于一个管理卡车队的人呢？对于一个追踪流水线上\
  \ 100 人生产力的人呢？“可能允许某些中断你赚钱的能力”是一个如何做得更好的粗浅例子，但你领会其中的精髓了。\n\n我曾运行 `DOD` 用于警报军事指挥及政府其他大部分部门应对国家级和非国家行为者网络威胁的警报系统。警告业务有自己的词汇，`CNO`\
  \ 业务也是如此，所以在某种程度上，如果不违背既定方法论，我们几乎无能调整我们的信息（是的）。\n\n## 在非技术决策者管理预期时，你有什么建议？\n\n\n\
  \n成为一名蓝队成员绝非可以轻视的事，因为你将永远追逐不断变化的目标。在职业生涯中，你将看到真实的零日漏洞，在预算紧张时跳出思维利用安全工具创建缓解措施，并发现自己处于必须学习某些你不喜欢的冷门技术的境地——因为这些技术是多年前购买的。信息安全领域的教育可以带你走向那里，但只有当你陷入一场持续\
  \ 2 周、涉及 1,000 台受损设备的事件，且 CEO 在你脑后后质问“为什么还没修复？这种停机每小时正让公司损失 X 千美元”时，你才才会真正有体会。\n\
  \n## 事件响应计划有哪些核心优势？\n文档、文档、还是文档。如果没有写下流程和程序，步骤就会因为人为错误而遗漏，而这些错误总是发生在最糟糕的时刻。通过编写文档，流程变得可重复，你就可以培训初级分析师了。\n\
  \n## 蓝队成员如何学习、实践和成长？\n蓝队成员成长、实践和学习的最佳方式之一是彼此合作！安全会议是寻找与你同领域工作人士的绝佳途径，这并不意味着你必须去\
  \ DEF CON。还有许多小型或本地的聚会，所以在你所在的地区找一个，离开你的电脑，去和人们聊天吧！\n\n另一件能帮助你学习的事情是学习一种脚本语言，因为这将帮助你自动化重复性任务，从而专注于更重要的任务。如果你在终端上反复运行相同的五个命令，就把它们写进一个\
  \ `Python` 脚本中。你每次运行脚本可能只为你节省 2 分钟，但在一个 20 人的分析师团队中，每天多次节省这 2 分钟，一年下来就等于节省大量时间。说真的，把重复性任务脚本化吧。\n\
  \n## 如何奖励优秀的蓝队工作？\n在北卡罗来纳州长大，很多问题的答案很简单：边吃东西边聊天。虽然这看起来可能很小，但给办公室点披萨吃午饭边聊天，这种做法对团队建设非常有帮助，特别是当涉及到多个团队时。对于奖励蓝队成员，提供他们感兴趣的培训（而不一定是你希望他们学习的领域）也很有帮助。人们显然喜欢更多钱，但当一个团队难以合作工作时，这可能会变成一把双刃剑。确保员工开心对团队的健康和生产力大有益。\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护成功的信息安全计划？\n谈到指标时，问问领导层想要什么类型的信息。他们是想知道发生了多少事件，节省了多少钱，还是在事件期间损失了多少钱？提供给他们。如果有些问题无法回答，尝试尽可能接近问题本身，让领导层对安全计划的运行情况了如。提前提供信息不仅有助于建立信任，还能在需要增加人员时提供支持性证据。\n\
  \n## 你对合规性有什么看法？\n谈到合规性，这可能是一把双刃剑。对于那些开始重视安全的组织来说，它有助于提供一个良好的起点基准。但问题在于，有些组织将合规性和安全视为一个“勾选框”，认为如果所有框都勾选了，公司就是安全的。这是一种错误的方法，因为黑客会不断进化以绕过这些保护。\n\
  \n安全和合规应该是一场确保设备受保护的竞赛，而不仅仅是为了合同需要而进行的简单勾选框。\n\n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n作为一名黑客和逆向工程工程师，多年来我学到的最难的教训是停止说技术黑话，除非你的高管要求要求。是的，那个你在周六晚上靠着咖啡因花了\
  \ 10 小时破解的加密算法很酷，但根结底你必须提供指标，例如节省、赚取或损失的金额，以及这在业务运营背景下的意义。对于业务来说，蓝队为公司提供保护，帮助缓解与网络安全事件相关的风险。\n\
  \n为了阐述你的需求，这里有一个秘密公式。你需要用数学方法解释为什么某事很重要、为什么需要这么做、将缓解哪些风险，以及每一步的成本是多少。如果保护措施能够抵消威胁带来的成本，那么做出业务合理的理由就非常直白了。如果你能为公司节省资金，那将更大的胜利！但请确保你有可追踪的指标来支持你的主张，因为如果你无法证明你所说的，你的请求可能会被拒绝。\n\
  \n或者为读到这里的技术人员重新表述这段话：“提供指标和哈希值，否则事情不会发生。”\n\n## 在重大持续事件期间，你对于管理非技术高管的预期有什么建议？\n\
  首先，事件对每个人来说都是压力巨大的，向管理层和关键决策者提供及时的更新至关重要。通过提供不断的更新，可以限制谣言的传播，取决于事件的敏感性。\n\n在某些情况下，事件可能会持续几天甚至几周，取决于问题的范围。在这种情况下，提供每日指标和更新，并将细节保持在事件的事实（而非推测）。如果你必须提供关于事件的细节和理论，请务必明确这只是在日后可能会改变的理论。承认自己不知道某事是可以的，但通常最好提供一个可能得到答案的时间范围。\n\
  \nWileyPRE\n\n# 49\n\nAshley Tolbert\n\n![](img/c49uf001.png)\n\n> “蓝队防御组织的网络、端点、数据和所有数字资产免受网络威胁的影响。”\n\
  \n**Twitter:** [@ashleytolb](https://twitter.com/ashleytolb) • **网站:** [www.linkedin.com/in/ashleytolbert](http://www.linkedin.com/in/ashleytolbert)\n\
  \nAshley 目前是 Netflix 的高级安全工程师，负责危机管理和事件响应；她曾在能源部和斯坦福大学线性加速器中心（SLAC）工作。她多元化的背景包括在\
  \ NASA 喷气推进实验室研究电力智能电网受攻击的情况。Ashley 拥有卡内基梅隆大学的信息安全硕士学位和奥伯大学的软件工程学士学位。她目前担任安全与隐私女性协会（WISP）董事会成员。在不在防御网络空间时，她会在户外跑步、发现新音乐（如非洲节奏）或通过旅行寻找灵感。\n\
  \n如何定义蓝队？\n\n\n\n\n\n我将蓝队定义为任何机构的事件响应和防御部门——即应对网络攻击和网络危机的人员。许多机构会定制自己的配方，决定哪些“成分”被整合到他们的蓝队中；这可能包括一级\
  \ `SOC`、检测团队、网络团队、威胁情报、取证调查等。规模较小的机构可能将这些部分或全部功能整合到一个团队中，而较大的机构通常有足够的人力来独立配置这些职能。蓝队负责保护机构的网络、端点、数据和所有数字资产免受网络威胁。在非防御状态下，蓝队会演练响应方案或战术（play）——就像篮球球队演练战术一样——以加强他们的技术装甲和协同防御。蓝队成员不断处于训练状态，并自问：“我们如何缩短解决事件的时间？为此需要哪些技能组、战术手册（playbooks）或工具？”\n\
  \n## 蓝队应该具备哪两个核心能力？事件响应计划有哪些关键优势？\n\n蓝队应该具备的两个核心能力是执行以下操作的能力：\n\n*   有效地调查和分析事件，收集任何相关或所需的资源资源\n\
  *   高效地驱动事件的解决\n\n以下是使这些能力成为可能的关键优势：\n\n*   拥有具有互补技能的正确团队：蓝队成员必须具备独特的技能，以增强团队对抗攻击者和攻击的整体防御能力。\n\
  *   流程的可预测性（即拥有一套完整且经过练习的事件响应计划和战术手册）：在事件发生期间，不应是蓝队第一次看到事件响应计划或战术手册。他们应该定期通过桌面推演（tabletops）和实战演练进行练习和微调。该计划应指导团队识别事件的严重性、隔离攻击、控制攻击、根除事件原因、进行修复并执行任何事后行动。\n\
  *   拥有正确的工具并能够快速访问：能够访问对事件分析有价值的工具或日志是至关重要的。这些工具通常用于检索信息，如 `NetFlow` 或身份验证日志以供调查。\n\
  \n## 蓝队成员可以如何学习、练习和成长？\n\n`CTFs` 是学习、练习和成长蓝队技能的宝贵资源。花时间进行红队对抗（red teaming）是加强攻击思维的极佳方法；它允许你部署自己将要防御的攻击战术。像《蓝队员手册》（The\
  \ Blue Teamer's Manual）和《情报驱动事件响应》（Intelligence Drive Incident Response）这样的书籍是我随身携带的实用资源。从研究系统加固开始。`Windows`\
  \ 或 `Linux` 都是很好的起点。利用 `MITRE ATT&CK` 框架了解常见的攻击者战术和技术；然后审查 `DeTT&CT` 框架，学习蓝队如何防御此类攻击，例如读取和比较数据日志源质量、可见性范围、检测覆盖范围以及威胁活动者的行为。\n\
  \n需要开发的其他技能是分析性思维和对响应的熟悉。对于培养分析性思维，《情报分析心理学》（Psychology of Intelligence Analysis）是一本经常推荐给蓝队成员的书。它涵盖了记忆、偏见以及我们人类如何通过偏见扭曲数据等概念。我们带着自己的假设而来，书中推荐了一些机制，以纯粹地观察数据，并以不带偏见的心态进行分析。\n\
  \n为了熟悉响应，我建议研究危机管理和大型事故。研究大规模事件（包括网络相关和非网络相关）例如 `Stuxnet` 或 `BP` 石油泄漏——及其处理方式——可以极大地提升你的事件响应知识范围和多样性。研究危机响应者的行动（例如危机期间的执法部门），有助于理解危机响应中语气、沟通策略和修复行动的细微差别。你可以考虑如何将这些行动加入到你的计划中以进行改进。每个机构都是不同的，需要定制化的事件响应计划。最后，反复练习你的事件响应战术手册。与团队进行有趣的桌面推演场景，并将你的响应与战术手册进行对比。\n\
  \n> 每个机构都是不同的，需要定制化的事件响应计划。\n\n## 蓝队可以使用哪些核心指标来构建、衡量和维护成功的信息安全计划？\n\n核心指标应该是可操作且有价值的——即驱动持续改进的数据。衡量组建响应团队和筛选事件所需的平均时间是一个核心指标。衡量团队解决事件所需的平均时间有助于衡量团队的整体效能。其他指标如事件趋势——特定类型事件的发生率是在增加还是减少——是事后加固可能不足的关键指标。\n\
  \n单次事件成本对于了解安全事件消耗了公司多少成本非常有价值。这种成本可能包括检测成本和响应成本。用于响应的虚假检测检测数量，以及用户报告的警报数量与你检测系统警报数量的对比，对于判断你的检测策略和机制是否有价值说明意义。过量的虚假警报会完全破坏团队对警报的信任，并减慢响应速度。要成为有效的\
  \ `IR` 团队，团队不能浪费时间去调查影响微小或无关的大量警报。另一个有趣的指标是入侵发生到在你的生态系统中被发现之间的时间差。\n\n## 如果你是一个安全基础设施简陋的中小型企业中唯一的信息安全人员，你将从哪里开始？\n\
  \n如果你是中小型规模，意味着你已经在监管许多可能需要某种加固的端点了。我将从对员工（人员安全）进行安全意识培训、对工程师进行安全编码培训开始。补丁和加密所有端点、执行密码策略、实施邮件安全工具、在关键数据系统上启用多因素身份验证、如果可能通过安全信息和事件管理系统（`SIEM`）启用日志/检测，并确保价值资产位于\
  \ `VPN` 之后，这些都构成了我从零开始的安全起步包。接下来的议程是加密我们生态系统中传输的所有敏感数据、实施基于主机的入侵检测系统、使用漏洞扫描器检查未打补丁的系统和已知漏洞，并确保记录了业务连续性计划。对于资金有限的小企业来说，开源的加固和检测工具是宝贵的资源。\n\
  \n## 性价比最高的安全控制措施是什么？\n\n防火墙和入侵检测系统。一旦这两个系统的日志被摄收到 `SIEM` 中，来自网络、Web 服务器、扫描器等的日志都可以与防火墙或\
  \ `IDS` 警报一起分析并用于调查。\n\n## 组织应该何时使用加密技术？\n\n组织应该加密存储在我们的生态系统中的凭据，以及敏感、机密或财务数据（如\
  \ `PI` 或 `PCI`）。加密桌面和笔记本是至关重要的。你的组织应该使用 `SSL` 证书来加密网站上传输的数据。\n\n> 加密桌面和笔记本是至关重要的。\n\
  \n你如何处理数据治理以及减少数据足迹的其他方法？你对合规性有什么看法？\n\n\n\n\n数据治理对网络安全至关重要。这里是一些强有力的步骤：对数据类型及与之相关的风险进行分类、根据风险实施访问控制和数据操作指南、实施数据泄露防护软件和数据安全控制，并考虑集中式数据模型。\n\
  \n了解你数据的安全分级可以确定需要哪些安全控制措施。理解哪些数据需要保护是防御威胁的关键步骤。数据治理是帮助我们把资源恰当地分配给环境中风险最高数据的过程。\n\
  \n## 你如何组织组织的所有不同部门以实现防御最大化？\n\n台式演习（Tabletops）和通用的安全意识是两个可以让组织中的许多不同部门聚集在一起共同进行防御的概念。台式演习有助于同时向多个团队传达共同的安全责任。响应实模拟的安全事件是一个实用的机会，可以提醒其他部门，对于所有团队来说，安全优先的价值。\n\
  \n> 响应实模拟的安全事件是一个实用的机会，可以提醒其他部门，对于所有团队来说，安全优先的价值。\n\n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\
  \n作为事故指挥官，在重大事故期间的目标是尽可能快速、定期向执行领导汇报事故的当前状态、其风险和严重程度以及任何对组织/运营的影响。不同的事故有不同的通知需求。重大事故通常可能需要高层执行者的更新。及时传达明确说明哪些数据或服务面临风险，以及将采取什么措施来消除事故根源，并预计的解决时间，有助于管理和缓解担忧。\n\
  \n为了向非技术决策者传达威胁，我倾向于淡化威胁的技术影响，更多地关注威胁导致的数据泄露、价值损失、财务损失或法律责任，以及在威胁实际发生时预期的运营影响。如果可能，我会尝试将威胁与决策者的具体职责联系起来。学习如何类比化威胁信息，并以一种突显公司整体风险的方式进行传达，对于推动风险严重程度和残余风险的非常有帮助。\n\
  \n> 如果可能，我会尝试将威胁与决策者的具体职责联系起来。\n\nWileyPRE\n\n# 50 \n\nIsmael Valenzuela\n\n![](img/c50uf001.png)\n\
  \n> “对我来说，蓝队成员本质上是一个‘全能防御者’，是一个多才艺且拥有一系列技能的安全专业人员，这些技能对于保护组织免受各种威胁至关重要。”\n\n**Twitter:**\
  \ [@aboutsecurity](https://twitter.com/aboutsecurity) • **Website:** [aboutsecurity.io](http://aboutsecurity.io)\n\
  \n自从他在西班牙成立首批 IT 安全咨询公司以来，Ismael Valenzuela 在过去的 20 年里作为安全专业人员参与了全球多个项目。在目前担任 McAfee\
  \ 高级首席工程师之前，Ismael 曾领导英特尔全球 Foundstone Services 团队交付 SOC、IR 和取证服务。\n\nIsmael 是 SANS\
  \ 认证讲师，《网络防御》和《蓝队运营》课程（以及 SANS SEC530：可防御安全架构）的合著者，并持有许多专业认证，包括备受推的 GIAC 安全专家 (GSE\
  \ #132)。\n\n## 你如何定义蓝队？\n\n让我先定义一下当我想到蓝队成员时脑海中浮现的画面。对我来说，蓝队成员本质上是一个‘全能防御者’，是一个多才艺且拥有一系列技能的安全专业人员，这些技能对于保护组织免受各种威胁至关重要。\n\
