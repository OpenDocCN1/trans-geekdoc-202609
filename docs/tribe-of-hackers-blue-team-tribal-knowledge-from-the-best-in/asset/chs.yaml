  \n**Twitter:** [@bucfoo](https://twitter.com/bucfoo)\n\nEddie Clark 从事技术领域已超过 20\
  \ 年，其中大约一半的时间在安全领域。他从 20 世纪 90 年代的结构化布线和网络开始工作，在 `Pacific Bell` 和 `AT&T` 电话局花费了大量时间。他仍然可以像顶级高手一样缝合电缆——只需要找到九芯线和一根缝衣针！他曾在地方和联邦政府以及私营部门从事过安全工作。在整个职业生涯中，他曾担任过\
  \ `system admin`、`network admin` 和 `security analyst`，并参与并领导过网络安全。（注：原文提示词中存在重复，我将保持核心流程）。\n\
  \n*根据原文进行的自我修正：* 在整个职业生涯中，他曾担任过 `system admin`、`network admin` 和 `security analyst`，并参与并领导过网络安全。（文本继续了关于他在政府和私营部门工作的具体细节）。他曾担任过\
  \ `system admin`、`network admin` 和 `security analyst`，以及 `SecOps`、`DevOps`、`InfoSec`、`DevOps`、`DevOps`、`DevOps`、`SDLC`、`SIEM`\
  \ 和 `DevOps`。\n\n## 你如何定义蓝队？\n\n我对蓝队的定义本质上是指任何负责防御组织、其人员及其数据的人。\n\n### 团队应该具备哪两个核心能力？\n\
  \n韧性和天赋。\n\n### 事件响应的一些主要优势是什么？\n\n与其他团队进行有效沟通的能力对于进行事件响应至关重要。\n\n\n\n\n> 团队的每位成员都需要不断成长并变得更好。\n\
  \n## 职业发展\n\n对于职业发展而言，蓝队（Blue Team）保持信息更新至关重要，因为攻击者和威胁格局在不断演变。这可以表现为正式培训、包括访问网络范围（Cyber\
  \ Ranges）在内的学习材料，或者仅仅是鼓励他们抽出“静心”时间进行自主学习。对于事件响应计划来说，不仅要允许这种行为，还要鼓励并奖励这种行为，这是重要的。\n\
  \n对于个人发展，留出充电时间至关重要。处理事件（尤其是关键事件）意味着几乎没有足够的睡眠或时间来照顾自己。在事件发生后安排某种“强制性”休息时间，对于防止职业倦怠有很大帮助。在团队成员表现良好时给予认可，也是保持个人士气的关键，这能创造出一种忠诚感，也有助于留住人才。\n\
  \n## 蓝队成员如何学习、实践和成长？\n\n加入当地的安全小组是从其他蓝队成员那里学习更多知识的绝佳方法。有一个下午，我开始写下亚利桑那州所有的本地小组，最后停在了\
  \ 20 个。这些小组确实存在，但关键在于努力建立人脉，即使这意味着要跳出舒适区。几年前，我在菲尼克斯的一次 ISSA 会议上跳出了舒适区，并自愿成为董事会成员帮助管理他们的网站。在志愿服务的四年里，我建立了一些友谊和极佳的人脉联系。\n\
  \n我在 2016 年于亚利桑那州的 CactusCon 上也获得了一些非常棒的建议。Grifter 当了主旨演讲，他的大意是：“要在安全社区中成长，你需要成为一个高功能的内向者。”从那以后，我一直以此作为我的心态。\n\
  \n网上也有很多资源可以提供帮助。像 `IronGeek` 这样的人会将会议视频发布在网上。我无法数在晚上难以入睡时，有多少次浏览他的 YouTube 频道并观看一些非常聪明的人的会议演讲。获取人的视角是增加知识的绝佳方法。像\
  \ Black Hills Information Security (`BHIS`) 和 `TrustedSec` 这样的优秀机构也有许多资源，他们不仅提供安全内容，还提供帮助蓝队学习的安全工具。我期待每个周（或每隔一周）`BHIS`\
  \ 发布另一个精彩的网络研讨会。对于那些新进入或想开始信息安全职业的人，我从不犹豫向他们推荐 `BHIS` 的《你的信息安全五年计划》，这是一场网络研讨会和一份资源列表。信息安全社区的人能提供如此帮助，这总是让我感到惊讶。你只需要知道去哪里寻找，并在学习努力中保持刻意而为。\n\
  \n> 信息安全社区的人能提供如此帮助，这总是让我感到惊讶。\n\n练习蓝队技能的最佳方法之一是保护你的家庭环境。虽然需要一些投入，但你在家里可以做的很多事情可以通过开源资源或极低的成本来实现。有很多网络研讨会和资源可以指导你防御家庭网络。买一个廉价的托管型交换机；为日志管理、入侵检测和网络监控创建几个虚拟机，以及其他几个工具；或者获取一份\
  \ Doug Burks 编写的 `Security Onion` 副本，它包含了保护家庭网络所需的大部分甚至全部工具。你会弄坏一些东西，这没关系。因为这是你的网络，你会有额外的动力去修复它并让一切正常运行。解决问题的过程将让你对解决方案的原理有非常透彻的理解。这无疑是最高效的学习方式，你增加的防御越多，学到的就越多。\n\
  \n> 你会弄坏一些东西，这没关系。\n\n## 如何奖励优秀的蓝队工作？\n\n认可与培训。大多数安全专业人员（无论是蓝队还是红队）都有一种与生的好奇心，这让他们擅长工作，因为他们不会在解决问题之前轻易放弃。尽管他们的动力源自内心，但认可仍然重要。认可的一个重要部分是尝试理解人们希望如何被认可。是的，这需要更多努力。一个例子是如果你选择通过邀请蓝队成员到台前接受大家的掌声来认可他们。有些人非常喜欢这样并从中蓬勃；而另一些人会对此感到无颜自辞，这会对他们产生负面影响。要有刻意性，并了解你的成员，最终将会有回报。\n\
  \n对蓝队卓越工作的另一种奖励是培训。如果可能，让他们自己选择培训课程。应该有一些准则，例如你不想为你的蓝队成员支付房经纪人执照的费用。但如果你有一位蓝队成员想学习攻击云端的红队战术，就让他们去学。这既会让他们开心，又能从攻击者的角度为他们更好的视角，从而让他们成为更出色的蓝队成员。\n\
  \n### 如果你是一个小型企业中唯一的信息安全人员，你会从何处开始？\n\n我的第一步将创建一个增加可见性的计划。CIS 前 20 项控制中的前两是资产清单和软件清单。如果你不知道有什么或它们在哪里，就很难防御。在大多数网络上，可以使用\
  \ `Nmap` 等其他工具进行扫描，且不会产生负面影响（取决于设备类型）。计划的另一个部分是创建一个日志管理策略。你想要实施的大多数技术都需要日志。如果你在实施其他解决方案之前处理好这一点，将使你未来更加高效，并打下坚实的基础。\n\
  \n\n\n\n如果您将合规性作为整体安全策略的一部分来帮助组织变得更加安全，它可以是一个极好的工具。在创建这些标准上花费的时间对每个行业都非常重要，因为某些控制措施是针对特定业务类型的。每个组织都需要理解，合规性是安全策略的关键组成部分。此外，组织还需要了解合规标准未涵盖的漏洞在哪里，然后制定一个优先的计划来填补这些漏洞。虽然填补这些漏洞与合规工作是分开的，但在可能的情况下，可以并且并行进行。\n\
  \n合规性固然重要，但它并不是全部。对于组织而言，关键在于既要实现合规，*又要*实现安全。\n\n## 如何让组织的所有不同部门以实现防御最大化？\n\n这听起来像是个简单的答案，但关键在于尽早与其他团队开始对话，以真正开通沟通渠道。同时，确确保在这些早期对话开始时，基调是合作而非对抗也是至关重要的。很多时候，安全团队被视为那个对所有人说“不”的团队。如果\
  \ `blue team` 能够向组织的其他团队证明，目标是帮助业务而不是阻碍业务，那么采纳率将会高得多。\n\n最后，经常沟通非常重要。团队越早听到需要处理的控制措施，该团队解决它的机会就越大。在实现防御最大化的过程中让每个人知情，将使每个人都能成功，组织将获得更好的防御，每个人的表现也会更好。这是所有人的真正双赢。\n\
  \n### 你使用什么策略向非技术类决策者传达你遇到的威胁？\n\n非技术类决策者需要理解威胁会如何影响他们和业务。我一直使用一种格式：在邮件/备忘录的顶部用一到两句话分别说明威胁是什么、谁以及什么受到了可能受到影响、修复的方法和\
  \ `ETA` 是什么，以及期间的替代方案是什么。将这些信息简洁明了地放在邮件顶部是非常重要的，因为对于管理层和 C 级执行人员，你的效率越高就越好。备忘录的下半部分是关于威胁的更多细节，供那些可能想要深入研究的人参考。\n\
  \n虽然告知决策者威胁很重要，但让让他们知道威胁何时被缓解也至关重要。这些信息不仅有助于他们晚上睡得更安稳，还能让他们将注意力和精力转移到下一个任务上。\n\n\
  在 在重大持续期间期间，管理非技术高管的预期你有什么建议？\n\n练习，我们是在讨论练习吗？是的，以桌面演练（tabletop exercise）的形式进行事件练习是准备技术团队和非技术高管的绝佳方式。在演习期间将为所有方设定沟通预期。为非技术高管提供预期，例如谁将是他们的联系人、多久接收一次更新以及对他们的要求，是帮助事件处理更顺畅的好方法。\n\
  \n> 是的，以桌面演练（tabletop exercise）的形式进行事件练习是准备技术团队和非技术高管的绝佳方式。\n\n处理事件的团队也需要以定期更新的形式进行主动沟通。如果团队能够在非技术高管提问之前提供他们需要的信息，就不需要造成任何中断。\n\
  \n\n\n\n## 团队动态\n\n- **团队：** 在宣布事件时，能够迅速组建一个具有预定义角色的中心化事件响应团队，是一个成熟计划的关键优势。事件响应经理、通信负责人、威胁研究人员和领域专家等角色，应由团队成员承担，而无需对谁该承担什么责任产生争议。此外，团队还应该能够通过有效的沟通和纪律，根据与事件响应计划一致的既定目标采取行动。\n\
  \n- **工具：** 有效的工具链对于团队以良好组织且通常是自动化的进行告警、上下文化、通信和响应的能力至关重要。工具的选择取决于团队的沟通方式、文化、收集上下文信息的方法论以及处理事件的整体流程。\n\
  \n- **心态：** 最后的优势是能够在工作流中保持冷静，并对团队的流程充满信心。如果团队惊慌失措、疯狂试图在不遵守计划的情况下单独去灭火，那么这个团队是无法良好恢复的。这会导致整个过程中出现覆盖漏洞，并引发通信和可见性的崩溃。请保持冷静并信任团队的计划。\n\
  \n## 蓝队人员如何学习、练习和成长？\n\n如果没有红队，蓝队人员的效果将大打折扣；否则，你的“团队”仅仅是在保护系统。这就像在没有对手的情况下进行战斗训练。如果不进行对练，你如何知道真实的战斗看起来和感觉是怎样的？当你深陷战壕时，你如何在压力下表现？我想表达的点是，你每次都必须像面对现实一样进行训练和练习。这将为蓝队人员获得知识、经验和信心提供温床。蓝队和红队决定执行的每个场景都应该尽可能接近现实。当蓝队寻求改进他们的检测和响应态势时，红队应该不断改进他们的攻击方法。\n\
  \n通过这种协作，蓝队人员可以学习新的攻击手段和相应的防御能力。当红队意识到新威胁并对其进行测试时，蓝队现在意识到了这些威胁并必须创建相应的检测和响应能力。作为蓝队人员，改进最重要的因素是与你的团队以及红队的沟通。两个团队通过规划和开发新能力来相互超越，从而使彼此共同成熟，并在之后聚在一起实施更成熟的安全控制，并响应现实世界的威胁者。\n\
  \n## 如何对出色的蓝队工作给予奖励？\n\n我相信认可和积极的赋能是对优秀蓝队工作的有效奖励。在应当给予的地方给予荣誉，保持团队士气，让人们有动力继续提高自己的能力。归根结底，每个蓝队人员都希望知道他们所做和训练的内容在响应发生的真实攻击时是有效的。在演练中巧妙地防止此类攻击时给予认可，会增强每个团队成员的这种信心。简而言之，不要缺少积极反馈，并确保批评是建设性的而不是贬低的。\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护成功的信息安全计划？\n\n之前提到过，但我认为有助于衡量安全计划整体成熟度的三个核心指标如下。我认为团队回答以下“如何”问题的方式是衡量安全计划整体成功的关键指标。\n\
  \n- **平均检测时间 (MTTD)：** 你的检测解决方案工作得如何？你的告警来自哪里？是用户、管理员还是你的检测解决方案？你的解决方案检测某个本应立即采取行动的告警需要多久？\n\
  \n- **误报率：** 你能在多大程度上信任你的告警？你是否被无意义的信号淹没，或者你是否对符合你组织事件标准的事件发出告警？\n\n- **平均响应/修复时间\
  \ (MTTR)：** 从告警/检测到响应和修复需要多久？\n\n## 如果你是一个拥有原始安全基础设施的中小型企业中唯一的信息安全人员，你会从哪里开始？\n\n\
  我将做的第一件事是实施漏洞和补丁管理流程。如果可以的话，我想首先消除易得的果实，并减少近期漏洞的整体攻击面。这种实施的成功理想情况下可以防止组织受到来自 2008\
  \ 年的远程代码执行问题的入侵。这包括改进系统设计和架构，以考虑相关的安全风险。同时，确保有足够的日志记录以便最终发出告警。在高级阶段，我的两个主要目标是建立初始的检测能力，并通过沟通和支持执行安全基础设施。\n\
  \n我会尽力推动一种让安全成为深思熟虑而非事后考虑的文化。我在这里不是为了做守门员，而是为了帮助其他团队成功，同时为团队的操作和部署提供安全的基准环境。最后，教育团队成员关于安全因素以及目前基础设施或开发过程中存在的可用风险。安全是每个人的责任，促进这种心态可能帮助他们意识到并激励他们如何设计解决方案。\n\
  \n## 哪种性价比最高的安全控制措施？\n\n防火墙。开玩笑的。日志。没有日志，我没有基础来检测、告警、狩猎、上下文化和响应整个组织中发生的事件。\n\n##\
  \ 组织应该何时使用密码学？\n\n这是一个巨大的问题。我喜欢它。密码学应该用于加密传输中的数据，例如相互 TLS、`VPN`、`SSH`、邮件 (PKI) 以及完美的\
  \ Wi-Fi。它还应该用于加密静态数据，例如全盘加密、加密文件系统或硬件安全模块 (`HSMs`)。如果你想更酷一点，可以使用全同态加密来处理使用中的数据。在高级阶段，密码学应该在需要的地方执行数据完整性、隐私、机密性和不可否认性。对于任何需要上述某方面的领域，使用密码学可能都是好主意。这个问题非常大，每个主题都开启了一个由几本书和白皮书组成的兔子洞。最后，我们不能忘记区块链……但我跑题了。\n\
  \n## 你对合规性有什么看法？\n\n我倾向于避开围绕合规性和监管框架的讨论。然而，我全心全认可它们对组织的重要性，以及安全控制和策略如何在组织内部定义。我经常发现，正在实施的控制在某种程度上与策略和合规性保持一致。如果没有合规性，另一个组织如何能对你组织的安全态势具有确定性？必须有一个大家公认的标准供组织遵守，其他人才能有信心与他们交往。\n\
  \n你如何参与组织的所有不同部门以实现防御最大化？\n\n\n\n\n传统上，安全团队因试图在不同部门中“强制”安全控制而闻名，但并没有真正考虑部门当前的工作负载以及这些控制对执行速度可能产生的影响。他们说：“你需要执行\
  \ X 以符合行业最佳实践。”这导致安全团队在尝试传达意愿时留下了负面印象，在最坏的情况下，他们的建议往往不被认真考虑，甚至被公然忽略。\n\n消除这种污名化的方法是与不同部门合作，工程化出安全的解决方案，而不是告诉他们需要遵守一个可能考虑也可能不考虑当前业务需求的标准。成为解决方案的一部分，理解当前的工作和业务需求，然后提供帮助团队继续高效且安全地运行的指导。\n\
  \n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\n关注风险的发生概率，以及该威胁对业务运营构成的真实和财务影响。这不关乎基础设施可能发生的技术细节，而关乎对业务可能造成什么种损害、恢复情况是怎样的，以及你的团队是如何处理该状况的。\n\
  \n### 在重大持续事件期间，对于管理非技术高管的预期，你有什么建议？\n\n结论先行（Bottom line up front）：让非技术高管了解情况的绝对现实以及事件是如何被管理的，但不要陷入技术细节。\n\
  \nWileyPRE\n\n# 13\n\nAyman Elsawah\n\n![](img/c13uf001.png)\n\n> “无论你是 SOC 分析师、安全架构师/工程师、合规经理还是\
  \ CISO，你都在内部进行防守。”\n\n**Twitter:** [@coffeewithayman](https://twitter.com/coffeewithayman)\
  \ • **网站:** [www.linkedin.com/in/infosecleader](http://www.linkedin.com/in/infosecleader),\
  \ [cloudsecuritylabs.io/about](http://cloudsecuritylabs.io/about), 以及 [gettingintoinfosec.com](http://gettingintoinfosec.com)\n\
  \nAyman Elsawah 是一位 vCISO，帮助高增长公司理顺安全事务，技术重点关注 AWS 安全。他热爱教育，无论是帮助 CTO 启动他们的安全计划，还是帮助工程师理解\
  \ AWS 安全的复杂性。他回馈的热情使他在训练营和当地大学授课。他是《打破边界：信息安全职业入门实战指南》（*Breaking IN: A Practical\
  \ Guide to Starting a Career in Information Security*）的作者，也是《进入信息播客》（*Getting Into\
  \ Infosec Podcast*）的主持，这是一档类似于 Fresh Air 式的播客，介绍行业内新老人士的职业转型。\n\n## 你如何定义蓝队？\n\n\
  对我来说，蓝队是指任何内部专注于检测、预防和阻止安全事件的团队。请记住，安全事件（攻击、配置错误、数据处理不当等）可能是恶意的或无心的，内部或外部的。无论你是\
  \ SOC 分析师、安全架构师/工程师、合规经理还是 CISO，你都在内部进行防守。如果你不是其中任何一种，猜猜怎么着——安全仍然你的责任！\n\n蓝队成员天生是建设者，而红队成员则以破坏者著称。这不是非黑即白的，但你明白其中的意思。\n\
  \n在进入“安全”领域之前，我从网络领域开始，构建和设计 Cisco 网络，并兼做一些 sys admin 工作。然后我成为了一名安全专业人员。\n\n\n\n\
  \n培训和跨团队参与/轮是一个极佳的方法。人们很容易陷入孤岛，尤其是在大型组织中，因此鼓励跨团队沟通和轮岗至关重要。让你的蓝队与红队成员紧密合作，或者在安全组织之外与开发人员和产品经理进行合作。这不仅能让他们建立关系（这在安全领域至关重要），还能让他们更多地了解公司的不同方面，从而帮助他们更好地工作。他们将知道在内部应该寻找什么，并促进灵感的产生。\n\
  \n> 人们很容易陷入孤岛，尤其是在大型组织中，因此鼓励跨团队沟通和轮岗至关重要。\n\n### 你如何奖励优秀的蓝队工作？\n\n要在该给予的地方给予，并且经常给予。蓝队的工作有时是不那么光鲜且困难的。定期将你的蓝队推向台前，向公司的其他小组展示他们所做的良好工作。让他们面向更广泛的组织演讲，或者举办举办与工程师和产品经理的午餐学习会（lunch-and-learn）。注意职业倦怠情况，并预先给他们时间休息充电。让他们经常参加培训。如果他们愿意，鼓励他们参与与工作不直接相关的安全项目。将他们创建的工具开源，以便他们能够在行业内获得认可。\n\
  \n> 定期将你的蓝队推向台前，向公司的其他小组展示他们所做的良好工作。\n\n最后一点超级重要。许多工程师想要开源他们的工作，以便进行展示，同时也能在项目上获得帮助。许多公司对此持“过敏”心态，导致项目没有开源，让安全工程师感到失望和怨恨。要成为他们工作开源的倡导者；这在安全社区中至关重要。\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护一个成功的信息安全计划？\n\n误报数量是一个帮助减少蓝队告警疲劳和倦怠的重要指标。不断调整你的系统以提高信噪比，确保收到的任何告警都是高信号且可操作的。\n\
  \n检测和修复时间是其他良好的指标。你的团队检测并修复一个问题需要多长时间？在检测和纠正行动方面，利用自动化将是关键。\n\n需要注意的是，建立更多的预防性控制，使我们不至于过度依赖检测和纠正控制，这是关键。在预防性控制上花费的时间在以后将产生回报。\n\
  \n### 如果你是一个安全基础设施原始的中小型企业中唯一的信息安全人员，你会从哪里开始？\n\n在与高增长初创公司合作时，这个问题经常出现。身份识别和日志是我通常建议从这两个地方开始。\n\
  \n身份验证是一个很好的起点，因为在增长中的业务中，入职和离职通常并不非常顺畅或高效（我也看到大型企业中也会发生这种情况）。如果入职/离职没有自动化或没有执行到位，你可能会发现前员工仍有系统访问权限，或者长期员工拥有过多的权限（权限蔓）。我建议渐进地采用零信任模型，这将强制/引导全公司推行最小权限访问等概念。这将对你的安全产生倍增效应。\n\
  \n> 我建议渐进地采用零信任模型，这将强制/引导全公司推行最小权限访问等概念。\n\n日志记录也非常重要，因为在修复问题之前，你需要知道你的环境中发生了什么！如果你是\
  \ 1 号安全工程师，正专注于安全意识培训或员工密码强度，但你的 SaaS 应用管理门户却开放在网上并整天遭受暴力破解攻击，或者你有工程师在 `AWS` 中开放了\
  \ `0.0.0.0/0` 安全组暴露了你的 `Jenkins` 服务器（是的，我经常看到这种情况），那么你真的在处理重要的事情吗？每个安全项目都是重要的，但它是优先级第一吗？拥有出色的日志将使你能够充分利用时间、精力和资源。通过良好的日志记录，你可能会发现公司范围内的系统性问题，通过简单的流程修改就可以完全改进你的安全。\n\
  \n> 通过良好的日志记录，你可能会发现公司范围内的系统性问题，通过简单的流程修改就可以完全改进你的安全。\n\n### 性价比最高的安全控制是什么？\n\n\
  毫无疑问单点登录（SSO）加多因素身份验证（MFA）。这不仅能让你控制碎片的应用，而且实际上让人们的生活整体变得更简单了！当我进入一个组织时，我首先寻找 MFA，但倡导\
  \ SSO。为什么？因为我想要一个胜利，并对所有应用的身份验证有可靠控制。通常，MFA 没有设置或至少没有强制执行，这糟糕，特别是对于管理员和高管。此外，入职和离职是一团糟，所以我经常发现未注销的旧员工或承包商账户，更糟糕的是带有默认密码的新账户，更不用说那一大串分散的影子\
  \ IT 应用了。\n\n这个问题的短答案是 MFA。然而，与其只推出 MFA（这是一个高触控的过程），然后在以后某个时候再推出 SSO（这是必然的），为什么不直接推出\
  \ SSO + MFA 呢？听着，如果你打算对用户产生影响，你最好 1) 不要搞砸 2) 尽可能不要通过多次更改来干扰他们。后者会让安全部门处于不受待的境地。\n\
  \n作为安全专业人员，要意识到你对用户的影响以及高触控项目的频率。高触控意味着将剧烈改变用户体验或需要高水平干预才能部署的项。\n\n所以，当我进入一个组织时，我希望自己已经带有一个“胜利”，因为在某个时刻，我会要求人们做一些他们不一定想做的事。是的，我现在要求他们做\
  \ MFA，但我正在通过推出 SSO 让他们的生活变得更容易，这是他们都会认同的，特别是如果你对他们进行教育并做好充分准备。安全控制很少能赢得青睐，但相信我，他们会因为你推出了\
  \ SSO 而爱上你的！\n\n> 安全控制很少赢得青睐，但相信我，他们会因为你推出了 SSO 而爱上你的！\n\n### 你的组织实施过任何欺骗技术吗？\n\n\
  我现在合作的很多公司几乎无法掌握自己的实际数据，也没有大型安全团队来部署蜜罐（honeypots）和蜜罐网络（honeynets）。不过，我的演示经常放入蜜令牌（honey\
  \ tokens），如 `AWS` 密钥，看看是否有人认为它是真实的令牌。\n\n### 组织应该在哪里使用加密？\n\n所有可能的地方！我曾一度认为没有必要加密一切，但由于有了零信任模型、深度防御的思想以及现在可用的大量工具，这是合理的。例如，`S3`\
  \ 存储桶泄露过去是、也将是一个问题。所以，我的建议是使用 `KMS` 密钥加密这些对象。现在有很多密钥管理工具，使得它们的部署比以前更容易。然而，使用 `KMS`\
  \ 密钥加密的原因是，如果该对象由于任何原因（意外或恶意）变得公开可用，还需要访问 `KMS` 密钥才能访问数据，从而使对象变得毫无用且无法读取。\n\n\n\n\
  \n\n我以前并不喜欢加密所有内容，特别是日志，因为我的下游 SIEM 无法轻松摄取这些数据。要与你的团队合作确定哪些需要加密，并保持在最小水平且分阶段进行。你应该拥有一份数据分类和处理标准，定义不同的数据类型以及它们应该如何被处理，或者是否应该加密。不要只冲进来就大喊着要加密所有东西，却没有合理的理由。给你的团队提供清晰的说明和文档来教育他们，但也要听取他们的需求并进行调整。对于新项目，加密数据也会更容易被团队接受。\n\
  \n## 你如何处理数据治理和其他减少数据足迹的方法？\n\n如果我从根本上没有这些数据，我就不需要担心处理它们了。作为一名现代安全专业人员，你不希望拥有比必要的更多的权限或数据。这是一巨大的责任。所以，如果业务不需要这些数据，那么它们对你来说负担就更小。如果你能在存储之前对数据进行匿名化，那更好。只需确保你确实是在言行一致即可。\n\
  \n> 作为一名现代安全专业人员，你不希望拥有比必要的更多的权限或数据。\n\n然而，不捕获敏感数据并非总是可能的。有些公司拥有数据工程团队，他们有时是事实上的数据所有者，或者至少是知道有哪些数据的人。我建议实际上建立一个\
  \ `Data Owners`（数据所有者）小组，并记录谁拥有什么，这样当必须就如何处理这些数据的决策时，很清楚该问谁以及这将如何影响他们。\n\n## 你对合规性有什么看法？\n\
  \n我的观点？我的观点不重要！如果你受 `PCI` 约束，那就是现实。如果你的企业客户要求 `SOC2` 合规性，那就是我们生活的现实。\n\n我经常看到这种情况。\n\
  \n问题在于，这些合规框架并不是为那些只有 50 人或 100 人、拥有优秀产品的成功 SaaS 初创公司设计的。他们没有 50,000 美元来通过审计，更不用增加额外的人来维护日志和告警了。最终的结果是公司外包某些组件仅仅为了满足一个勾选框。他们也可以将其自动化，但需要有人来构建，而他们通常在分配资源开发新功能或为客户修复漏洞之间做抉择。\n\
  \n另一方面，遗憾我仍然看到安全和合规人员的陈旧思维，他们躲在“政策”后面，而不与小型 SaaS 供应商开会或谈判他们的某些合规要求。交易的失败是因为企业合规团队不愿意在安全需求上做出中肯妥协，甚至不倾听。\n\
  \n在我参与过的一项合作中，潜在客户的安全团队甚至没有参加会议来简单讨论需求。业务方在，供应商也在，但在所有要求被满足之前，他们拒绝参与。这甚至只是为了一个演示环境！\n\
  \n> 在我参与的一项合作中，潜在客户的安全团队甚至没有参加会议来简单讨论需求。\n\n## 是否有一个框架可以将蓝队所执行的活动或功能与监管合规要求对齐？\n\
  \n这很棘手。合规意味着我*必须*遵守。例如，如果我是一家上市公司，那么我必须遵守 `SOX-404` 法律，这可能使你符合 `COBIT` 或 `COSO`。如果我处理信用卡，我就受\
  \ `PCI` 标准的约束，这些是由 `Visa`、`Mastercard`、`Amex` 和 `Discover` 执行的私有标准。如果我是 SaaS 提供商，那么我的客户*期望*我遵守\
  \ `SOC2` 标准，这也是一个私有标准。如果我与政府打交道，我就必须符合 `FedRamp`。然后你还有 `ISO`、`NIST`、`CAIQ` 和 `CIS\
  \ Benchmarks`，大量的供应商安全问卷，更不用说受监管的 `GDPR` 和 `CCPA`。\n\n所以，这很复杂。\n\n我帮助过公司实现 `SOC2`、`PCI`\
  \ 和 `SOX-404`，但我*不是*合规专家。不过，我确实相信使用常识。很多人对合规框架感到安心，是因为它们是指导性的，并给了他们定义，这完全没问题。如果你可以选择一个框架并执行下去，那就尽管去做吧！在我看来，问题在于过度依赖它们，这会带来虚假安全感，或者更糟，导致在与其他团队合作时变得僵化。有时这会导致创造力或技术意识缺乏，从而在无法满足特定要求时无法提出补偿性控制，而你是被允许这样做的。方木头插进圆孔并不总是世界末日，但许多人会恐慌。\n\
  \n> 很多人对合规框架感到安心，是因为它们是指导性的，并给了他们定义，这完全没问题。\n\n我要说的可能会有争议，但如果你不受这些任何一项的约束，我想让你知道，你有权制定自己的框架。许多人并不知道。然后你可以将其对齐或映射到这些中的一个或多个以增加可信度。只需做好记录（合规的一半是文档工作），并确保持续遵守它，而不仅仅是在每年一次的审计。\n\
  \n噢，合规并不总是等同于安全。还有许多灰色地带，例如审计员当天的心心情、他们的技术水平或他们理解规则的能力。\n\n我想这是一个很长的回答，但比把我塞进一个框架然后走开要好。\n\
  \n## 你如何参与组织中的不同部门以实现防御最大化？\n\n战争故事！我喜欢工作中的这部分：与所有部门（包括非技术部门）合作；向他们介绍安全团队；并教育他们我们为什么在这里，我们在做什么，以及如何与我们互动。营造受欢迎的环境，并让他们知道安全是一项帮助他们的服务。\n\
  \n午餐学习是一个很好的方法。月度通讯是另一种方法。视频消息也可以。这在很大程度上是营销和互动。\n\n听着，很多人听到安全团队时会感到害怕。真的。我被告诉过很多，看到安全团队的邮件时会感到焦虑，但打开它后，他们会感觉好一些。\n\
  \n我曾进入过一个安全团队声誉不佳的。各个部门不想与安全团队互动，事实上在项目启动会议上将他们列为“风险”！记住这一点，我确保在与各个团队互动时提供额外的咨询服务，直接走过去面谈而不是躲在邮件后面，或者如果情况有点复杂就约咖啡。\n\
  \n最终，在会议结束后他们会说类似“我们没认为你会同意的”或“好吧，这很简单”之的话，他们本以为在提出挑战时会非常困难。事实证明由于我有技术背景，并提供了一个既能配合他们又不会损害安全的解决方案，这很有帮助。\n\
  \n\n\n\n\n# 尽早参与项目。保持平易近人。走出舒适区，去结识其他团队。`Slack` 中的“donut”应用非常适合这一点。通过与公司内的随机小组和个人（从客户服务代表到工程师，再到项目经理）交流，我取得了许多安全方面的胜利。\n\
  \n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\n讲故事、使用良好（且能引起共鸣的）类比、保持简洁直接、同理心以及使用他们听懂的语言。\n\n决策者需要足够的正确信息来做出决策。他们依赖于我们的专业知识、意见以及对他们所面临选择的影响和后果的理解。我们的工作是提供能够做出明智决策的信息，特别是当这涉及到他们为部门或公司接受某种程度的风险时。\n\
  \n> 决策者需要足够的正确信息来做出决策。\n\n他们脑子里也有很多事情，所以考虑到他们的时间非常重要。不要替他们做决定，但要做好研究并做充分准备。预判他们的问题，不要在小事上浪费他们的时间。解释清楚事情并避免使用术语。也不要胡扯；如果你完全不知道某个问题的答案，请诚实告知。\n\
  \n当然，你需要面对*正确的*决策者。有些组织将安全职能排得非常靠后，以至于风险和后果没有被纳入业务决策中。这就是为什么让 `CISO` 或安全部门向高层汇报至关重要；尽管有时我们并不具备这种奢侈。\n\
  \n## 在发生重大持续事件期间，你有什么建议可以管理非技术高管的预期？\n\n确保在处理事件时，房间里有正确的人。不要对任何事情粉饰太平细节，陈述事实和未知的部分，并传达你正在采取哪些修复措施，告知他们你是否需要他们的决策、执行操作，或需要他们/他人的支持。\n\
  \n高管有一种……去执行并完成任务的本性。他们也能处理坏消息，但不要让他们用想象力来填补空白。每小时或每半小时更新一次进度，确保你的事实经过绝对确认，并让他们知道任何未确认的事项。在事件中，未知因素绝不是好事，所以要把这些问题解决掉。\n\
  \nWileyPRE\n\n# 14\n\n### Sahan Fernando\n\n![](img/c14uf001.png)\n\n> “蓝队成员是致力于系统防御的人。”\n\
  \n**Twitter:** [@SriLankanMonkey](https://twitter.com/SriLankanMonkey)\n\nSahan\
  \ 拥有近十年的各种规模系统和网络架构设计、测试和防御经验。Sahan 利用其在业务信息方面的背景，确保 `IT` 和 `InfoSec` 项目可用、可扩展且安全，同时与业务目标和需求保持一致。Sahan\
  \ 曾协助并领导了各种规模组织计划的创建。Sahan 负责 `Intrinium` 的所有托管和工程服务，包括 24/7 的 `SOC/NOC`。Sahan 毕业于\
  \ `Gonzaga University`，获得了 `BBA` 和 `MA` 学位。在办公室之外，他喜欢划船、音乐、美食以及和狗度度时光。\n\n## 你如何定义蓝队？\n\
  \n对我来说，真正的蓝队是指任何直接或间接参与信息安全防御的人。`SOC` 显然是至关重要的，但参与构建安全系统的系统管理员和服务服务台人员也做出了巨大贡献。蓝队成员是致力于系统防御的人。\n\
  \n## 蓝队应该具备哪些核心能力？\n\n蓝队应该具备的两个核心能力是检测和响应安全事件的能力（识别、检测、分级、响应、审查），以及在不干扰业务目标和流程的情况下提供如何保护这些目标和流程的建议的能力。\n\
  \n## 事件响应计划有哪些关键优势？\n\n在拥有事件响应策略后，我心中首要考虑的是拥有一套清晰的角色、职责和问责制度。从那里开始，策略可以针对组织已识别的风险/威胁制定响应剧本（playbook）。你就可以识别出成功检测、分级、响应以及消除威胁所需的资源，同时跟踪你需要接受且仍需准备好应对的风险。\n\
  \n## 蓝队成员如何学习、实践和成长？\n\n我发现这是需要多方面的努力。我鼓励我所有的员工建立关系，不仅向彼此学习，也向其他团队学习（如服务台、`红队`、`工程部门`等等）。我认为，开放去尝试许多不同的事物，并弄清楚你喜欢什么以及想从那里进一步深入研究，是非常重要的。\n\
  \n## 你如何奖励优秀的蓝队工作？\n\n公开表扬是第一步！我会在所有的公司群聊/邮件中提到他们，偶尔还会提供其他奖励（金钱、参加会议等）。\n\n## 蓝队可以使用哪些核心指标来构建、衡量和维护一个成功的信息安全计划？\n\
  \n这总是非常困难！你的听众在这里是关键——他们是技术人员还是高管？对于后者，你必须用业务术语来表述数据（理想情况下关联到与业务目标相关的风险）。看似具有真正价值的技术指标包括按严重性划分的告警、告警分类、平均响应时间以及平均修复时间。你还可以做诸如补丁合规水平、关键风险项的修复时间、社会工程测试统计以及检测到的策略违规等工作。\n\
  \n## 如果你是一个安全基础设施原始的中小型企业中唯一的信息安全人员，你会从哪里开始？\n\n我会从理解业务开始。这将决定此后的每项行动——我正在试图保护什么、我正在处理哪些治理和合规要求、文化是什么、利益相关者是谁，等等。从零开始构建安全网络的基础要素是对你要保护的内容的了解。\n\
  \n## 性价比最高的安全控制措施是什么？\n\n我非常简单。我喜欢一个具有 `AV`、网页过滤、应用控制、`IPS` 以及内置无线控制器等功能的优秀防火墙。虽然这还远远不够，但对于那些开始担心安全和安全事件影响的企业来说，这是一个切实可行且相对廉价的第一步。\n\
  \n## 你的组织实施了任何欺骗技术吗？\n\n通常，我对欺骗技术的看法是它们有其用处，但大多数安全团队有其他的优先级要处理。有些优秀的工具是免费且易于实现的。\n\
  \n## 组织应该在哪里使用加密？\n\n我是全加密的坚定支持者。加密的成本很少大于信息的价值，而且行业在推动默认加密方面做得很好。未加密的通信（如 `HTTP`、`Telnet`\
  \ 等）应该是例外，而不是常态。\n\n## 你如何处理数据治理和其他减少数据足迹的方法？\n\n除了简单的“法律要求我们”之外，我认为组织应该尽努力了解其数据存储在何处、数据的分类、哪些人员/应用程序拥有访问权限，以及数据在业务流程中的流动。从那里开始，你就可以做出持续的决策，来改变流程、机会以及你希望的整体足迹是什么。\n\
  \n## 你对合规性有什么看法？\n\n\n\n\n这是一个极其强大的工具，一些优秀的人士在执行它时面临着非常艰巨的工作。归根结底，组织选择从事可能导致合规和监管的业务实践，而我们的工作就是支持这一决定。合规性应该被视为通向更高信息安全的杠杆点，而不是终点或目标。在大多数情况下，合规性仅仅是安全性的基线，但许多合规框架关注风险管理，这一事实是将你更广泛的风险管理与合规的法律要求联系起来的一种可操作方法，从而获得资金。\n\
  \n> 合规性应该被视为通向更高信息安全的杠杆点，而不是终点或目标。\n\n## 是否有某种框架可以将蓝队执行的活动或功能与监管合规要求对齐？\n\n`NIST\
  \ CSF` 是一个流行的选择，我发现它在对齐之外还具有价值。它能更容易向高管传达组织的现状，并能与同类机构进行比较。没有任何一个框架能完美适配某个组织，但它能提供你大部分所需的内容，然后你可以根据组织需求进行调整。`NIST\
  \ CSF` 还具有易于从其他合规法规中进行映射的优点，因此你不需要重复努力。\n\n## 如何调动组织的所有部门以最大化防御能力？\n\n我从理解每个部门为业务的工作开始。从\
  \ IT 到人力资源再到财务，如果不了解业务流程以及涉及的资产/工具，防御工作将变得困难。听听他们在做什么是非常有趣的——这显示了你的关怀。\n\n> 从 IT\
  \ 到人力资源再到财务，如果不了解业务流程以及涉及的资产/工具，防御工作将变得困难。\n\n从那里开始，你可以建立关系，并征求他们关于如何改进的意见。对于 `SOC`\
  \ 中的技术人员，同样的方法适用——表现出你关心业务，并且是为了支持组织的使命和愿景，不要成为只会说“不”的安全人员。\n\n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n\
  \n我总是根据威胁对组织带来的风险来表述它。用易于理解的语言与他们交流是真正有效的唯一途径；否则就会变成白噪音，并导致“成本是多少”的问题。当以财务损失、停机、声誉损害和其他不良结果呈现时，决策者会更积极地讨论解决方案。\n\
  \n## 在重大事件期间，管理非技术高管预期的建议有哪些？\n\n诚实。不要试图恐吓他们或隐藏任何事情，只需主动、定期地传达当前状态、目标和下一步计划。不要试图解释“本该发生什么”或“我告诉过你”的时刻。专注于恢复业务运营。事件后的根因分析可以显示你正在尽力地解决他们的担忧（例如：“我们正在努力确认没有攻击者存在，以便恢复正常业务”）。\n\
  \nWiley 15\n\n### Stephen Hilt\n\n![](img/c5uf001.png)\n\n> “那些构建、维护和提升组织内计算机系统安全的人都是蓝队。”\n\
  \n**Twitter:** [@tothehilt](https://twitter.com/tothehilt)\n\nStephen Hilt 是 `Trend\
  \ Micro` 的高级威胁研究员。他专注于通用安全研究、威胁活动、攻击背后的以及工业系统安全。他喜欢拆解并重新组装。他是一位世界著名的研究员，曾在 `Blackhat\
  \ US`、`RSA`、`HITB` 等场合演讲。他的研究曾两次获得 `Dark Reading` 年度黑客。他是 `nmap` 的贡献者，并为 `ICS` 和其他主流协议编写了一些\
  \ `nmap` 脚本。这项工作使他成为了 `ICS` 协议的专家，并合著了 *Hacking Exposed Industrial Control Systems:\
  \ ICS and SCADA Security Secrets & Solutions*\n\n## 如何定义蓝队？\n\n蓝队是对抗红队（即“攻击者”）的团队。蓝队是“防御”。那些构建、维护和提升组织内计算机系统安全的人都是蓝队。\n\
  \n关于这个想法最好的例子之一是 `DHS` 在爱达荷国家实验室（Idaho National Labs）针对控制系统进行的培训。在 `INL`，蓝队试图通过修补系统、研究关键信息流以及直接更改网络基础设施来阻止攻击，以及大家最喜欢的部分：提交工单来记录变更。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n检测和响应是蓝队至少具备的两个核心能力。大多数蓝队处理许多类型的事件和告警，并确定哪些需要优先处理和响应。响应取决于事件的类型和待修复的系统的优先级。\n\
  \n## 事件响应计划的一些关键优势是什么？\n\n检测、分类、优先排序和响应事件，并将对业务的影响降至最低的能力。为了检测事件，`IR` 计划应该拥有正确的工具来近实时检测事件，并应该能够存储执行事件分析所需的价值信息。一旦告警进入流程，他们应该对事件进行分类。这可能包括调查来源和信息的有效性，包括是否可能是误报。然后根据对业务的影响，对事件进行优先级排序。当然，响应事件是最重要的部分之一，因为你的响应方式决定了团队在内部和外部的形象。可以说，没有人会记得处理得当的\
  \ `IR` 和披露，但处理错误的会被记住很长一段时间。\n\n### 蓝队成员如何学习、练习和成长？\n\n根据我为了帮助自己成长所做的事情，我的首要建议如下：\n\
  \n- **学习：** 阅读博客、倾听播客、参加培训，并在社交媒体上关注那些提供优质内容、能让你跟上最新趋势的人。\n- **练习：** 家庭实验室、工作实验室、各种实验室、实验室、实验室。如果你在使用这些工具和技术，你会学得更好。在在家里安装\
  \ `IDS` 软件，响应你自己的事件，并像保护你的公司一样保护你的家人。当然，你的配偶可能不喜欢被阻止访问经常访问的网站，但这又回到了了解组织的问题。作为夺旗赛（`CTFs`）的坚定支持者和多个\
  \ `CTFs` 的开发者，学习如何防御攻击的最佳方法之一就是学习攻击者使用的工具和技术，这些可以在许多 `CTFs` 中找到。[CTFTime.org](http://ctftime.org)\
  \ 拥有一份可以参加的 `CTFs` 列表。[Hackthebox.eu](http://hackthebox.eu) 是一个付费的 `CTF` 资源，对学习非常有帮助。\n\
  \n\n\n\n\n## 成长\n**成长：** 为你自己和员工设定目标。如果有人想学习新任务以为他们从事工作的其他方面铺平道路，只要这对组织也有益，就应该予以支持。个人发展是确保你能够按照自己认为的方式成长，并实现你职业生涯目标的目标的关键之一。\n\
  \n### 你如何奖励优秀的蓝队防御（Blue Teaming）工作？\n使用标准的企业结构进行奖励。任何表现超出寻常的员工都应该获得奖励。\n\n### 蓝队可以哪些哪些核心指标来构建、衡量和维护一个成功的信息安全计划？\n\
  关键指标是许多组织都在尝试追踪并确定哪些因素对他们重要的。最重要的指标之一是随时间推移的事件率。这意味着，随着组织的成熟和改进，随着时间推移发现的事件数量应该减少。同样，在被动和主动扫描活动期间发现的漏洞数量也应该随着组织的日益成熟而减少。此外，还应该考虑内部用户意识培训，以及例如钓鱼测试的成功率，以帮助提高意识水平，不仅让安全部门和蓝队团队取得成功，也让整个组织取得成功。\n\
  \n### 如果你是一个安全基础设施原始的中小型企业中唯一的信息安全人员，你将从何开始？\n了解你的网络上有什么。资产管理是中型企业甚至更大企业要解决的最大障碍之一，因为资产始终在网络中进出。如果你不知道网络上有什么，甚至不知道哪些是你的但不在你网络上的资产，你就无法很好地了解你应该防御什么，以及优先级应该放在哪里。\n\
  \n### 哪种性价比最高的安全控制措施？\n最小权限原则（`PoLP`）。这是所有渗透测试人员都会利用并发现其失效之处的地方。如果你有一套完善的 `PoLP`\
  \ 设置，你会发现攻击者想要获取访问、维持访问以及在你的网络中移动将变得更加困难。虽然这是实现的最困难的事情之一，但在我看来，你将从中获得最大的收益。\n\n\
  ### 你们的组织是否实施了任何欺骗技术（Deception Technologies）？\n我在 `Trend Micro`（趋势科技）工作，我们经常部署蜜罐。我本人运行过多个已发表过研究报告的蜜罐项目。尽管如此，如果你的组织在安全方面尚未成熟到能够处理来自蜜罐的可能事件，那么在你们自己的网络基础设施中运行蜜罐当然是有风险的。\n\
  \n### 组织应该在何时使用加密技术？\n在何时加密传输数据与静态数据方面，这里有几种不同的方法，但归结底取决于数据本身的敏感性。我认为，如果数据对业务功能是敏感的，那么无论它在何处都应该加密。这的一个缺点是，你无法控制人们存储信息的地方，而且你经常需要追溯他们在哪里以未加密的形式存储它们。\n\
  \n另一个选项是在处处加密数据。然而，如果你正在这样做，请确保使用了所有的加密标准。这意味着要寻找诸如 `custom encryption`（自定义加密）之类的短语。根据我的经验，当你看到这个词时，它通常是\
  \ `XOR`，这根本不是加密，而是编码。\n\n## 你对合规性（Compliance）有什么看法？\n合规是向正确方向的一一步，但它始终是组织认为他们应该做的最低要求。在很多情况下，他们觉得如果他们做得更多，有时比不做最低要求还要糟糕，因为可能会暴露监管机构会拆解的其他问题。应该将多个标准统一起来，拥有一套通用标准，这样人们就可以同时满足\
  \ `NIST`、`NERC`、`HIPPA` 和 `PCI`，而不需要为了确保每一项都合规而费周章。\n\n## 是否有一个框架可以将蓝队执行的活动或功能与监管合规要求对齐？\n\
  `NIST 800-53` 是记录安全控制措施的良好起点。这些是政府用于帮助创建、运行和审计安全计划的工具。它们允许你灵活地定义对你的组织来说是合理的控制措施。\n\
  \n## 你如何参与组织的所有不同部门以实现防御最大化？\n桌面演练（Tabletop exercises）。公司应该练习在网络安全事件发生时会如何做。这是因为如果他们不练习，某些业务部门可能不知道人们对他们期望什么，并且对事件的响应时间会较慢。在美国的能源部门，`NERC`\
  \ 举办网络演练来帮助公司这样做。美国政府每年在许多联邦机构举行桌面演练。\n\n## 你使用什么策略向非技术决策者传达你遇到的威胁？\n使用业务语言。当你向工厂或电厂工作的人员解释安全性的重要性时，你不能陷入技术细节中，并使用那些与计算机无关的轶事。\n\
  \n### 在重大持续事件期间，你对管理非技术高管的预期有什么建议？\n如果他们要求，就定期向高管更新情况。这包括你处于事件响应的哪个阶段、你目前看到的潜在结果以及你认为对组织构成的风险。如果事件指挥官要求提供，这些信息应该清晰地提供给高管。他们不应该与技术人员交流，因为这会分散他们处理事件的注意力。我经历过需要向高管每小时更新一次的情况。这些通过事件指挥官传递，然后由指挥官与高管进行快速通话。应该让高管意识到任何可能影响业务、声誉或其他任何因素的重大事件。\n\
  \n\n\n\n\n定义蓝队（blue team）的一种更快捷方法是：“这是一群辩称你不需要雇用红队的人，因为我们有 `X`、`Y` 和 `Zed` 或 `Zee`，在我们开始寻找更多漏洞之前，它们就能解决一切问题。”\n\
  \n## 蓝队应该具备哪些核心能力？\n\n耐心和乐观！这些比任何产品、工具或流程都重要得多。\n\n* 耐心是因为防御感觉就像霍夫斯塔特定律（Hofstadter's\
  \ law）的延伸，而且总是比你想象的要长。\n* 乐观是因为很容易精疲力竭，尤其是作为防御者，你可以看到许多事情可能（有时确实会）出错的办法，却忽视了你的防御措施实际上生效的所有方式。\n\
  \n你只看到进入城堡的路径，而从未看到护河的有效性或防御墙的成功。攻击者必须穿过这个迷宫，并在不触发任何警报的情况下完成所有操作，这种现实往往是我脑海中考虑最少的想法，因此，以乐观的态度保持视角是保持活力的核心。\n\
  \n## 事件响应计划的一些关键优势是什么？\n\n在事件响应中，没有计划很少能成功，但从本质上说，你已经在响应某些失败的事情了。某些东西没能阻止入侵者进入或没能留住数据，加密更像是一个建议而非承诺，等等。因此，拥有一个流程可以消除对下一步该做的猜测。PagerDuty\
  \ 在 `response.pagerduty.com/` 上记录了详尽的流程，该流程大量借鉴了国家事件管理系统 (`NIMS`)，虽然它的创建主要是为了关注系统方面，但事件响应中最困难的部分是通信与协调，而不是它所应用的领域。\n\
  \n## 如果你是一家处于安全基础设施简陋的中小型企业的唯一信息安全人员，你会从哪里开始？\n\n招聘。几乎是最大的力量倍增器就是增加你的兵力。\n\n假设没有这个选择，我将深入我最喜欢的话题之一——威胁建模（threat\
  \ modeling）！威胁建模是一个很大的话题，实现方法也很多，但我最常用的角度是找出我们拥有或正在做的哪些对哪些人有价值的内容，以及他们最可能如何攻击这些内容。\n\
  \n例如，多年来我曾在像 `Stripe` 等金融服务公司以及大家喜爱的针织和手工艺网站 `Etsy` 工作。虽然它们在处理服务和金钱方面相似，但 `Stripe`\
  \ 更有可能成为高端黑客甚至接近国家级力量攻击的目标（2018 年的许多 `SWIFT` 攻击是由针对朝鲜的 `APT38` 执行的）。另一方面，由于 `Etsy`\
  \ 主要是一个销售意大利面艺术品和鹿角饰品的网站，我们认为它很大程度上没有被 `GCHQ` 和 `NSA` 理会。\n\n如果你正在构建一个新平台，遗憾的是，要知道有人会尝试利用它来作恶。任何用于托管图片的平台都会被用于托管你不想看到的图片。任何可以用于善意的东西，例如\
  \ `Firefox`、`Let's Encrypt` 或防止 `DDoS` 的 `CDNs`，都会被攻击者和普通坏人利用。从一开始就对此并计划将避免以后很多痛苦。\n\
  \n系统的隔离和所有权也有帮助。每家初创公司都经历过这样一个阶段：关键的大服务绑定在某个前工程师的信用卡和账户上。你的 `AWS` 账户所有者几乎肯定是一个加入早到至于名字已经成为传说的人，无论他们是否仍在那里工作。在这些问题导致在凌晨\
  \ 2 点打来恐慌的事件响应电话（试图访问该账户或快速将其关闭）之前，修复这些问题。\n\n## 性价比最高的安全控制是什么？\n\n多因素身份认证（Multifactor\
  \ authentication）。它可以是免费，而且它为你的账户和认证增加的安全性是巨大的。目前有一种倾向是由于老旧的 `SMS` 和电信基础设施的不安全性而忽视基于短信的双重身份认证\
  \ (`2FA`)，但我宁愿立即使用它也不使用单因素认证。\n\n理想情况下，人们应该使用比 `SMS` 更强的东西，例如基于时间的一次性密码 (`TOTP`)，我确定许多人都经历过，即在手机上的\
  \ App 中扫描 `QR code`，然后输入定期更改的六位代码。如果你有 20 到 20 美元之间的资金，请使用如 `Yubikey` 和 `FIDO/U2F`\
  \ 等 `security key`。\n\n\n\n\n相反，当“深爱的”NSA 攻击 Google 的服务器时，他们并没有对 `TLS` 进行某种突破性的新型密码分析，而是在完成解密后直接接管了光纤连接。Google\
  \ 雇佣了一些非常厉害的密码学家，其加密方案本身是健全的，但架构并非如此，这正是他们攻击之处。\n\n如果你盲目地加密所有内容，那么你现在就面临密钥管理问题。公平地说，你几乎肯定在之前就就有这类问题了，只是以前没那么难以管理（这就是为什么像\
  \ `Amazon` 的 `KMS` 和 `Google` 的 Cloud Key Management Service 这样的服务是救命稻草）。加密备份始终是一个明智之举；当我扮演攻击者时，我喜欢去攻击比主系统防御弱得多的备份文件。加密会让这些文件对攻击者的实用性大大降低，除非密钥就躺在它们旁边，这就是为什么我们需要密钥管理。\n\
  \n了解加密的局限性同样重要。是的，你在服务器上启用了全盘加密，这意味着当你通过 `SSH` 或其他方式登录它们时，所有文件都可以像往常一样访问，而且完全是透明的。等等，如果所有文件都可以原封不动地被拷贝，我们为什么要这么做呢？我偶尔喜欢问，我们如何知道那些声称已加密的云服务真的加密了？`AWS`\
  \ 又不会邮寄给你一个旧硬盘作为证明。目前没有实用的方法可以查看写入磁盘的内容，所以我们都只是开心地度过每一天，心里确信那些本就没人能访问的东西已经加密了。所以简而言之，加密你能能加密的一切。\n\
  \n## 你对合规性有什么看法？\n\n合规性是一种“必要的（虽不完全是）恶”，但它并非好事。如果没有像 `PCI` 这样的标准，我们会有更多的明文信用卡号，因为它是一根有用的大棒，可以确保至少某些东西处于合理的安全状态，即使这种状态是\
  \ 10 年前的，且是基于 `Windows NT` 时代设计的。合规性处境艰难。行动太慢，你可能等同不存在；行动太快，则没人能合规，而且这会变成每个人的全职工作。\n\
  \n合规性感觉也像学校里的考试。你不需要一直都给出正确答案。你只需要展示解题过程就能获得大部分分数，而且你必须回答考官给出的问题，而不是现实世界的正确答案。`PCI`\
  \ 范围内的每个 `Mac` 和 `Linux` 主机都运行 `ClamAV`，因为它们必须运行杀毒软件，因为过去当我们盲目拷贝软磁盘时，电脑会感染病毒。\n\n\
  杀毒软件已经“进化”了。病毒领域现在非常微小（且在很大程度上被其他东西，如恶意软件——抱歉，我的意思是“高级持续性威胁”所取代），但一切都必须有一套杀毒解决方案，而\
  \ `ClamAV` 是免费的：任务勾选。`ClamAV` 是否曾经救过任何信用卡数据免于落入乌克兰盗刷论坛？没有。是否有人读过他们 `PCI` 环境中 `ClamAV`\
  \ 的输出结果？也没有。这是一种有用且合理的安全控制措施吗？你又得了第三个“不”！它应该消失吗？我深怀疑。`IDSs` 也是如此，如果他们读了日志，也许能救救\
  \ `Target`，但如果你曾用默认规则开启过 `Snort`，你就知道这些告警最好的去处就是 `/dev/null`，因为它们报警的内容早已不再存在了。\n\
  \n### 你使用什么策略向非技术决策者传达你面临的威胁？\n\n作为安全专业人员，我们有过度夸大漏洞的习惯，我指的不只是最新的、最酷的、命名的攻击，而是那些声称天要塌了发现或报告。在我的职业生涯中，这方面深有其罪（如果你正读到这里，我很抱歉），所以请尝试在发现某些东西时克制自己的兴奋，以真正理解其影响和风险。\n\
  \n对于在重大持续事件期间，管理非技术高管的预期有什么建议？\n\n我建议首先不要称他们为“非技术”人员，因为他们是高管，而高管是一项非常有技术性的业务职能。\n\
  \n事件响应的 `NIMS` 框架有很多关于沟通和预期管理的规定。它依赖于你的理解：在事件响应期间，响应者（好吧，是事件指挥官）的话具有决定性，因此他们已经接受了这一点。\n\
  \n\n\n\n尽管与许多事件响应工作一样，在他们做出反应之前，你无法真正知道他们如何反应，这就是为什么通过模拟攻击或桌面推演练（tabletop exercises）来练习这一过程非常有益处，但不要低估这些活动对参与人员及相关人员带来的压力，这种压力往往与真实攻击不相上下。这不是我完全推荐的路径，但如果你接手了一家过去发生过泄露的公司，这意料之中对于设定未来的预期大有奇效。\n\
  \nWileyPRE\n\n# 17\n\nTerence Jackson\n\n![](img/c17uf001.png)\n\n> “蓝队首先主动防御我们的系统，响应威胁和事件，并寻找安全态势中的改进领域以弥补漏洞。”\n\
  \n**Twitter:** [@tjackson78](https://twitter.com/tjackson78) • **网站:** [www.terence-jackson.com](http://www.terence-jackson.com)\
  \ 和 [www.linkedin.com/in/terencejackson](http://www.linkedin.com/in/terencejackson)\n\
  \nTerence Jackson 目前担任 Thycotic Software 的首席信息安全官。他的职责包括保护组织的信息资产以及管理风险和信息技术计划。Terence\
  \ 是行业公认的专家和公共演讲者，经常受全球最大且最受尊敬的组织邀请进行演讲并分享见解，包括 Forbes、Dark Reading、BrightTalk、云安全联盟、SC\
  \ Magazine、InfoSec Magazine、Tech News World、The Guardian Hedge Fund Monthly 和 Spectrum\
  \ News。在不工作时，他喜欢和妻子两个孩子一起度过时光。\n\n**你如何定义蓝队？**\n\n我将蓝队定义为我的内部 SWAT（特警行动队）。蓝队首先主动防御我们的系统，响应威胁和事件，并寻找安全态势中的改进领域以弥补漏洞。\n\
  \n**蓝队应该具备的两个核心能力是什么？**\n\n我认为检测和响应是每个蓝队应该具备的两个核心能力。它们是基本原则。没有了它们，蓝队就会形同虚设。没有检测就没有响应；同样，如果你不知道自己在保护什么，那么在受到攻击时检测到的几率就很小。\n\
  \n**事件响应计划有哪些关键优势？**\n\n该计划或团队的第一优势是能够最大限度地缩短停留时间（dwell time）或简单地快速检测事件。\n\n第二个优势是在行动时团队能够步调一致并进行有效沟通，因此拥有经过练习的剧本（playbooks）以及在事件响应（IR）各个领域的专业知识，可以最大限度地减少对手造成的损害和声誉损失。\n\
  \n最后，我会说是准备。他们必须随时做好准备。\n\n**蓝队成员可以如何学习、练习和成长？**\n\n通过参加桌面推演练、参加 CTF 活动、参加 RSA、Black\
  \ Hat 等行业会议以及当地的 BSides 活动。他们还必须持续关注对手正在利用的新战术，因此教育是保持竞争力的重要组成部分。\n\n**你如何奖励优秀的蓝队工作？**\n\
  \n我通过每月午餐、极具竞争力的薪资、领导机会、奖项、培训、乐趣以及灵活的工作环境和信任来奖励我的团队。我还允许我的团队自由思考如何解决有趣的问题，这允许他们探索解决问题的的替代方法。\n\
  \n**蓝队可以用于构建、衡量和维护安全的一些核心指标有哪些？**\n\n我喜欢查看停留时间和平均检测时间（`MTTD`）。保持相关性是其中很大的一部分。\n\n\
  **如果你是唯一的安全成员，你会从哪里开始？**\n\n首先通过数据映射和分类练习。然后实施适当的 `IAM` 控制以及 `DLP`。企业通常没有制定策略。\n\
  \n**是否有一个框架可以将蓝队执行的活动或功能与监管合规结合起来？**\n\n对此有不同的观点，但我非常信赖 `NIST Cybersecurity Framework`\
  \ 和 `ISO27001`。这两者都为稳实的安全计划提供了控制、策略和程序的蓝图。\n\n**对于在重大事件期间管理非技术高管的预期你有什么建议？**\n\n\
  将事件与量化结果和潜在损失预期挂钩。他们可能不懂技术，但他们会懂数字。用业务语言交流，并频繁沟通。\n\nWileyPRE\n\n# 18\n\nTanya Janca\n\
  \n![](img/c18uf001.png)\n\n> “他们实施安全工具和策略，响应事件并加固服务器等。”\n\nTanya Janca，也被称为 `SheHacksPurple`，`We\
  \ Hack Purple` 的创始人，这是一家专门为 IT 专业人员提供在线和虚拟安全培训的技术初创公司。他们还提供教练服务，帮助公司启动和改进其 `AppSec`\
  \ 程序。Tanya 从青少年时期就开始编写代码。她在 IT 领域工作了 20 多年，获得过众多奖项，创办过几次公司，担任过公职，并就职微软、Adobe 和诺基亚等科技巨头。她担任过渗透测试、CISO、CEO、AppSec\
  \ 工程师，但主要是软件开发人员。她是一位获奖的演讲者、活跃的博客作者和主播，在六大洲进行过数百场演讲和培训。她重视多样性、包容性和友善，这在她无数的项目和成就中得以体现。\n\
  \nTanya 还是 `We Hack Purple`、`Women of Security` (`WoSEC`)、`OWASP DevSlop`、`OWASP\
  \ Victoria` 以及 `#CyberMentoringMonday` 的创始人。\n\n**你如何定义蓝队？**\n\n\n\n\n蓝队是我们的防御者；他们确保我们拥有适当的防御措施并得到充分的保护。他们负责实施安全工具和策略、响应事件以及加固服务器等工作。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n完成工作的技术能力，以及理解需要完成什么工作以及为何这么做的沟通技巧。\n\n### 事件响应计划的一些核心优势是什么？\n\
  \n> 一个强大的事件响应计划主要在于准备：完善的事件处理流程、针对应急响应人员和调查人员的培训、工具和访问权限的已准备就绪等。\n\n一个强大的事件响应计划主要在于准备：完善的事件处理流程、针对应急响应人员和调查人员的培训、工具和访问权限的已准备就绪等。其他核心优势包括：始终进行无责备的事后分析、保持指标并尽可能消除或防止事件，以及在响应期间表现出强有且专业的领导力。\n\
  \n## 蓝队成员如何如何学习、实践和成长？\n\n*   **工具：** 在购买前创建概念验证（PoC）以便评估和学习。关注在线上与正在使用的工具相关的讨论和流，或者在可能的情况下参加技术培训。建立自己的实验室并尽情尝试。一个可以测试和防御的安全空间意味着你不会造成伤害；利用这个机会了解工具的局限性。如果可能的话，与友好的红队成员或渗透测试员配合，看看你是否能从他们那里学习你薄弱的地方。考虑参加在线或线下的攻防赛（`CTF`）。\n\
  *   **事件响应：** 作为观察者跟随事件经理或调查人员是学习的最好方法；但并不是每个人都有这个选择。线上有许多阅读、培训或观看视频的选项，而且一种名为 `Backdoors\
  \ and Breaches` 的卡牌游戏对教学事件响应非常有用。\n*   **理论（非实操部分，它能让你知道如何设定方向并决定执行哪些技术工作）：** Wiley\
  \ 及其他出版社出版了多本关于该主题的好书，以及相关的培训。然而，最好的学习方法是将自学与导师指导、工作观察或其他实操培训相结合。\n\n### 你如何奖励优秀的蓝队工作？\n\
  \n用奖励所有优秀工作的方式一样。直接告诉你的团队他们做得很好，在管理层面前认可他们，并给予奖项、礼品、奖金和击掌鼓励。\n\n## 蓝队可以使用哪些核心指标来构建、衡量和维护成功的信息安全计划？\n\
  \n指标可能是我最喜欢的话题！在刚开始某项工作和或构建计划时，你想看到整体的安全态势如何。对于软件（我的专长），这意味着查看你发现的所有类型的漏洞以及相关的事件。在\
  \ `SDLC`（软件开发生命周期）期间发生了多少安全活动（如 `code review` 或 `testing`）？你认为目前做得足够且/或符合行业最佳实践？在开始新工作时，我通常针对他们最常遇到的前三个问题，同时制定一个现代化和改进整个\
  \ `AppSec` 计划的方案。先止血，再进行长期治愈。\n\n> 先止血，再进行长期治愈。\n\n对于软件，将所有测试结果上传到同一个地方，并寻找以下内容：\n\
  \n*   找出你是否在反复犯同样的错误。如果是，通过教育和/或工具以及重新测试来针对这些类型的问题。有改进吗？不断尝试不同的方法，直到你看到改进。\n*  \
  \ 你是否发现了新类型的问题？如果没有，开始寻找新方法来发掘你目前遗漏的内容，并在过程中进行衡量。\n*   你是否满足了 `SLAs`？错误是否在 `SLA`\
  \ 范围内被修复？如果没有，为什么？如何达到这一目标？\n*   你是否符合所有适用的策略和标准？如果不符合，如何达到？如何确保保持在该状态？\n\n针对事件响应的问题包括：\n\
  \n*   你是否为每个事件都完成了 `incident report`（事件报告）和 `postmortem activity + report`？\n* \
  \  你是否在重复相同类型的事件，还是出现了新类型的事件？\n*   是否有任何事件是可以避免的？\n*   你是否有一种方法在未来防止这些某些事件？\n* \
  \  你的团队在每次事件后是否有时间喘息，还是一个接一个地发生（这可能导致职业倦怠）？\n*   其他团队将事件转给你们的速度有多快？\n*   分拣需要多长时间？\n\
  *   你是否可以缩短恢复时间？\n\n### 如果你是唯一的安全负责人员，你会从哪里开始？\n\n我的公司目前成立了五个月，所以我们还没有很好地考虑数据治理或减少数据足迹的方法。然而，我们对不敏感信息进行了\
  \ `off-site backups`（异地备份）、`duplication of data`（数据复制）和 `cloud storage`（云存储）。目前我们的数据没有经过分类，尽管我们发布了相当多的内容。基本上它们分为“已发布”、“草稿”或“不发布”（通常是电子邮件、财务或客户信息）。\n\
  \n## 你对合规性有什么看法？\n\n我不认为合规是一项令人有趣的活动，但我确实认为我们需要确切知道自己是否遵循了策略。这就是合规的意义。尽管如此，只要可能，我倾向于尽可能自动化，既为了方便也为了准确。\n\
  \n### 你如何参与组织的所有不同部门来实现防御最大化？\n\n我尝试使用倡导/教育、政策以及邀请自己参加会议的方法。我觉得重要的是首先要尝试通过“甜蜜”来获得你想要的，即教导人们、向他们展示，并引导他们看到安全的价值。之后，我致力于制定策略或标准来获取我认为我们需要的东西。在整个过程中，我尝试尽可能与人们进行一对一或面对面的互动，以确保我理解他们的感受和想法。通过邮件很容易产生误解；参与需要理解。\n\
  \n\n\n\n## 在发生重大持续事件期间，对于管理非技术高管的预期你有什么建议？\n\n在管理事件时，务必明确高管们应该与你沟通，而不是你的团队（这会减慢工作进度）。告诉他们，每当有重大进展或每隔一小时你都会向他们更新情况。然后我会*确实按照承诺，每小时更新一次情况*。遵守承诺将确保赢得信任，即使更新的内容是“我们仍然不知道”。在将任何内容作为事实呈现之前，确保你所掌握的是事实而非直觉。尽可能提供时间估计，但要不断向他们保证你正在竭尽全力，你的团队也理解这种紧迫性。在紧急情况下安慰人们真的非常有帮助。如果他们来电，始终接听。他们正寄希望于你。\n\
  \n> 遵守承诺将确保赢得信任，即使更新的内容是我们仍然不知道。\n\nWileyPRE\n\n# 19\n\nRuth Juma\n\n![](img/c19uf001.png)\n\
  \n> “蓝队的整个概念是确保随着业务的数字化，企业内部的一组精英资源能够主动针对网络攻击制定策略（通过政策和程序）、开发安全系统，并检测并防止网络事件变为现实。”\n\
  \n**网站：** [www.linkedin.com/in/ruth-juma-9144b138](http://www.linkedin.com/in/ruth-juma-9144b138)\n\
  \nRuth 是一位资深网络安全工程师，在多个行业拥有五多年的经验。她具备多种技能，包括 Web 安全、渗透测试和网络安全监控，目前主要关注红队行动。最近的其他兴趣还包括移动应用程序的逆向工程。\n\
  \n## 你如何定义蓝队？\n\n我们在不同的业务领域中遇到过许多网络攻击案例和数据泄露事件。事实上，任何拥有数据的企业都是目标。更糟糕的是，数字化是不可逆的趋势；因此，越来越多的企业将拥有更多的数据，并通过数字渠道提供服务。\n\
  \n蓝队的整个概念是确保随着业务的数字化，企业内部的一组精英资源能够主动针对网络攻击制定策略（通过政策和程序）、开发安全系统，并检测并防止网络事件变为现实。这就是蓝队。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n蓝队成员应该对网络攻击者的运作方式有深入的理解，包括他们的动力、目标、意图、果决等。正如孙子所说：“知彼知己，百战不殆。”\n\
  \n蓝队成员应该在网络通信以及数据如何在 OSI 七层模型中传输方面具有丰富的实战经验。DevOps 的基础知识也是关键。在了解你的对手后，你可以快速判断他们将如何利用技术来实现他们的目标。\n\
  \n最后，蓝队成员必须具备快速分析形势并确定网络事件可能根本原因的能力，并能够清晰、从容地与其他利益相关者（包括非技术人员）沟通事件、活动和响应流程。\n\n\
  ## 事件响应计划的一些关键优势是什么？\n\n事件响应计划应该是全方位的，从应用程序开发阶段到对多个多样化事件进行关联分析，以快速建立网络事件的潜在根本原因。这意味着该计划应该支持来自多个学科/专业的输入，并优化与与事件相关的每个查询的响应时间。\n\
  \n## 蓝队成员如何学习、实践和成长？\n\n> 对于初学者来说，志愿者参加任何性质的响应团队是一个很好的起点。\n\n对于初学者来说，志愿者参加任何性质的响应团队是一个很好的起点。另一种方法是使用各种在线实验室提供的此类场景的模拟器。对于该领域的从业人员来说，没有什么比加入一个解决网络事件的团队（从检测到控制增强）更棒的。参与红蓝队对抗活动也能提供视角和理解，同时也能识别出你技能树中哪些盲点需要加强。是时候将这些活动引入到初中和大学的课程中了。\n\
  \n## 你如何奖励优秀的蓝队工作？\n\n归结底，在处理数据和托管这些数据的系统中，PPT 三要素中的“人”是最关键的。就像对待其他其他资产一样，我们必须照顾员工。可以通过提高薪酬、明确职业发展路径以及对优秀表现者的晋升来实现。更多的责任、曝光以及通过会议和其他安全活动向专家学习的机会，激励着蓝队员工在该领域投入更多。\n\
  \n## 蓝队可以使用哪些核心指标来构建、衡量和维护成功的信息安全计划？\n\n对于日常运营（BAU），性能指标可以围绕事件管理展开，例如：一段时间内的事件数量、一段时间内的重复事件、事件检测和解决的速度以及检测事件所需的时间。从策略角度，通过已知的实践和全球标准来定制蓝队运营成熟度框架是切实的。\n\
  \n> 从策略角度，通过已知的实践和全球标准来定制蓝队运营成熟度框架是切实的。\n\n## 你如何参与组织内的不同部门以实现防御最大化？\n\n过去，存在一个明显的差距，即除了蓝队之外，没有人理解网络安全在处理网络事件中的作用。通过意识活动，让网络安全和蓝队在业务部门不再神秘，这提升了大家的一种认知，甚至将业务部门和其他部门（法律、风险与合规、人力资源）纳入了事件响应小组（CIRT）流程。底线，如果业务部门认可团队的投入，他们就会愿意支持其工作。\n\
  \n\n\n\nBrendon Kelley 是德克萨斯州奥斯汀的居民，他在那里长大，目前在一家医疗支付软件公司担任安全工程师，负责安全运营和倡议。他担任一家专注于军事和国防的政府咨询公司的安全顾问，曾是\
  \ Bazaarvoice 的安全工程师。他毕业于贝勒大学的计算机科学专业，并曾担任贝勒大学网络安全队的副队长，该团队获得了 2018 年西南部学院网络防守大赛\
  \ (SWCCDC) 冠军，并在 2018 年的 NCCDC 国家学院网络防守大赛中获得第四名。\n\n## 你如何定义蓝队？\n\n我会将蓝队定义为不仅仅是事件响应。蓝队的核心职责是响应事件，但这实际上只是其功能的一个子集。技术安全审查、创建安全工具和管理漏洞都是蓝队的功能。他们始终持续地工作，以减少应用程序和网络安全威胁，并完善组织的安全态势。\n\
  \n## 蓝队应该具备哪两个核心能力？\n\n根据你在蓝队中的职能，某些能力可能比其他的更有价值；仅定义两项是很困难的。我会说其中一个是理解并感知攻击模式和当前威胁的能力。我一直在程序？\n\
  \n我认为，一个非常强大的事件响应计划由安全自动化、文档、运行手册（runbooks）以及做好任何情况的准备组成。更成熟的计划针对事件响应建立了自动化的流程和程序。某些事件响应计划拥有相同的程序或流程，但它们更多是手动操作。\n\
  \n例如，当系统发生入侵检测时，一个具有优势的 IR 计划可以自动隔离资源并汇总发现以进行调查。一个必须手动收集资源和隔离系统的 IR 计划将非常耗时。事件响应的安全自动化将这些程序区分出优劣。蓝队一直在收到安全告警，因此在事件响应计划中内置安全自动化可以使事件响应变得更易管理。另一个关键优势是通过为事件建立运行手册、文档和策略来做好准备。花时间评估整个过程可以让你在其他一切事情都陷入混乱时保持专注。\n\
  \n## 蓝队人员可以如何学习、实践和成长？\n\n就像软件工程师必须学习新的框架或应用程序一样，蓝队也必须跟上这些进展，以便如何防御它们。我个人认为 Twitter\
  \ 上的安全社区非常紧密。我通过关注许多其他“黑客之族”（Tribe of Hackers）成员学到了很多。与他们见面的绝佳方法是参加许多安全会议之一。我在早期通过参加奥斯汀周边的当地安全活动中学到了最多的知识。\n\
  \n另一种学习和实践的方法是查看一些安全 Git 仓库。有些仓库提供了工具集，以及关于学习的教学材料。在蓝队中成长涉及技术技能和软技能。\n\n## 事件响应计划的一些关键优势有哪些？\n\
