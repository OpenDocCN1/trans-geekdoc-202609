    # 机器学习入门：如何通过数据科学构建人工智能的完整概述

    Richard Mendez


    ## 目录

    - 引言

    - 第 1 章：关于机器学习

    - 第 2 章：机器学习基础

    - 第 3 章：机器学习算法与技术

    - 第 4 章：决策树与随机森林：第一部分

    - 第 5 章：决策树：第二部分

    - 第 7 章：深度学习

    - 第 8 章：数字神经网络与计算机科学

    - 结论


    ## 引言

    我想要对选择这本书——《机器学习入门：算法、决策树和随机森林简介》表示衷心的感谢。你选择这本书是正确的，因为你将学习到关于技术和计算机世界的许多新、新颖且有趣的事实。


    ###将以一种直观、有趣且具有教育意义的方式引导你学习人工智能和机器学习的基础。机器学习是一个非常有前景的概念，目前是技术领域最受讨论的话题之一。然而，除了前景和优势之外，它经常伴随着争议和讨论。不了解机器学习本质和益处，或从不可靠来源获取知识的人，往往会轻视并恐惧机器学习。另一方面，你听过的关于机器学习的所有奇闻怪事，可能只是误解和错误的认知。这本书将试图通过展示机器学习如何可能是技术领域发生过的最棒的事情，来消除这些恐惧。你将在这里找到所有与机器学习相关问题的解答以及更多内容。因此，你将不再仅仅是假设，而是学习并理解机器学习的基础，并得出自己的结论。


    ## 第 1 章：关于机器学习

    当今技术时代最吸引人的特征之一是它的适应性和灵活性。似乎每天都有新的科学突破发布。每天，科学技术世界瞬息万变的特征都在改变着整个地球历史的方向。曾经被认为是幻想或虚构的事情现在正迅速成为现实的一部分。人类正齐心努力，缓慢而坚定地在自己的规则中击败自然。然而，另一个领域尚未被征服。我们尚未成功征服机器学习或人工智能领域。然而，它现在已成为一个家喻户晓的词汇，全世界的人都在表达观点。但并不是每个人都对其感到热衷。大多数人对其感到担忧或恐惧。然而，没有理由恐惧机器学习或人工智能，因为这些技术将使人类实现我们现在无法想象的成就。


    ### 什么是机器学习？

    如果你查看 2016 年最热门词汇的搜索结果，你会注意到机器学习和人工智能（`AI`）在人气上远超其他。机器学习之所以变得越来越流行，是因为它在我们的日常生活中变得越来越普遍。目前，它被应用于各种设备和机械以及电子产品中。另一方面，广大大众对其仍持怀疑。因此，为了消除这些幻象，让我们简要回顾机器学习的历史。根据亚瑟·塞缪尔（Arthur
    Samuel）1959 年的定义，机器学习过程被定义为将数据输入计算机系统，使计算机在未来不需要经过显式编程或提供相似或额外数据的情况下，学会处理和执行该活动的能力。通俗来说，这意味着计算机将能够发展出自己的“大脑”，并能够独立“思考”。虽然这听起来很可怕，但事实并非如此。一旦计算机系统被赋予推理能力，它们就会变得更智能，从而更易操作。它们的功能将大幅扩展，并成为人类的宝贵资产。机器学习的潜力适用于几乎所有的认识论领域。化学信息学、计算解剖学、游戏、自适应网站、自然语言处理、机器人运动和移动（包括医学诊断）、序列挖掘、行为分析（包括语言学）、翻译（包括欺诈检测）和其他领域目前正在使用。这个列表还可以继续下去。


    ### 历史

    机器学习的起源可以追溯到另一个相似领域的开端，即人工智能（`AI`）。我认为可以说，这两个领域是同时创建的，然后随着时间的推移逐渐变得独立。许多最初对人工智能感兴趣的科学家逐渐将重心转向机器学习的学术研究。他们开始采用概率推理和其他技术。20
    世纪 90 年代左右，人工智能和机器学习这两个领域正式分开，如今，每个领域都被独立研究。在接下来的章节中，你将发现机器学习的基础，以及它如何应用于日常生活中。你还将了解到该行业可以提供的各种职业，以及适合专家的某些高级主题。


    '
