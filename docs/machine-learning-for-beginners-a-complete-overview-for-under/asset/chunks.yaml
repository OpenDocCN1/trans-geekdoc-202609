    # Classifiers should be combined


    The predictions of each classifier are combined with the help of a mode, a mean,
    or a median to form a single forecast. This is dependent on the nature of the
    problem at hand. In most cases, the combined values are more powerful than a single
    value. It is vital to note that the number of models that are to be built is not
    intended to be a hyper parameter in this situation. A bigger number of models
    is nearly always preferable than a smaller number of models. Although they can
    perform on similar planes in some circumstances, they can also provide performance
    that is comparable to that of the lower numbers in other cases.


    Under certain assumptions, it is possible to demonstrate theoretically that the
    variance of all the combined predictions is reduced to `1/n`, where `n` is the
    number of classifiers, of the normal variance, and that this is the case.


    ## Random Forests


    Bagging models can be implemented in a number of different ways. The random forest
    model is one example of this. It will be covered in greater detail in the following
    and final chapter of the decision tree series. Part Three of Decision Trees is
    covered in Chapter 6.


    In this chapter, we will look at the fundamentals of Random Forests and how they
    fulfill their functions. Random Forest can be considered as a universal answer
    because it is stated that if you are unsure about which algorithm to employ, you
    should use a random forest method. It is possible to characterize the random forest
    as a versatile and intelligent machine learning method that may be used to accomplish
    both classification and regression tasks.


    Data exploration can be carried out through the use of dimensionality reduction
    methods, outlier values, missing values, and other data exploration techniques.
    It is a professional answer for the majority of difficulties. It is referred to
    as an ensemble method of learning because a set of weak models is integrated to
    build a powerful model in this manner.


    The Random Forest''s operation is as follows: A random forest is used to produce
    a large number of decision trees. This is diametrically opposed to the `CART`
    model. When it comes to the classification of newly discovered object-based properties,
    each of the trees provides a classification. This presentation is frequently referred
    to as the ''vote'' process for the class. The forest is then given the option
    of selecting the classification that received the most number of votes.


    ### Illustration


    Let us suppose that the total number of cases in a training set is equal to `N`.
    Then a random sample of the `N` cases can be chosen from the group. However, it
    is necessary to replace it. The sample will be used as a training set for the
    tree that is being grown. If there are `M` input variables, then the following
    is true: mlowed:


    - If the email contains only one, promotional image: `SPAM`

    - It only has link or links: `SPAM`

    - If the body of the email contains only sentences such as "You won a prize money
    of ---": `SPAM`

    - Email received from an official domain: `Not a SPAM`

    - Email received from a known sender: `Not a SPAM`


    As a result, these are the guidelines or criteria that we employ in order to determine
    if an email is spam or not. Do you, on the other hand, believe that these criteria
    are sufficient to distinguish between emails that are spam and those that are
    not spam? It is not possible to answer the question above in affirmative. On their
    own, these principles cannot be claimed to be powerful enough to distinguish between
    email that is spam and email that is not spam. As a result, these rules are referred
    to as "weak learners."


    ## Strong Learners and Boosting


    Strong learners, on the other hand, can be developed from weak learners by integrating
    the predictions produced by the weak learners with the help of a variety of approaches
    such as:

    - The average or weighted average is used in this case.

    - Choosing the prediction with the highest percentage of votes received.


    For example, in the preceding scenario, we have five students who are weak learners.
    If three of these five items are determined to be `SPAM`, the remaining two items
    will be determined to `NOT SPAM`. Due to the higher number of votes in this particular
    circumstance, we will continue to consider email `SPAM` as a viable option.


    What is the procedure? As we have shown, boosting actually brings together a group
    of weak learners to produce a powerful rule. When considering how it identifies
    weak rules, the issue that should occur in your mind is: how does it do so? The
    machine-learning technique with a variable distribution must first be used to
    identify the weak rule before it can be identified. When this method is implemented,
    a new weak prediction rule is produced, which is repeated every time. This is
    a cyclical procedure that is performed numerous times during the day.


    The boosting algorithm combines these rules into a single strong prediction rule
    that can be used in many situations. The question is, how do we select a different
    distribution for each round? The following actions can be taken in order to select
    the most appropriate distribution:


    1. All the distributions are taken and assigned by the base learner to equal weight
    and attention.

    2. If any prediction error happens due to the first base learning algorithm, more
    attention is then paid to the observation that has caused the error. It is then
    applied to the next base-learning algorithm.

    3. The second step is repeated until the base learning algorithm limit is reached
    or a high level of accuracy is gained.

    '
