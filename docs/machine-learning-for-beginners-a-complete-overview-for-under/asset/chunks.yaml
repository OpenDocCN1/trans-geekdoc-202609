    # 第 3 章：机器学习算法与技术


    在上一章中讨论机器学习的基础知识时，我们简要提到了机器学习在算法中的应用。本章将更深入地讨论算法、其类型、最流行的算法以及与它们相关的所有内容……正如上一章所提到的，对于机器学习领域的新手来说，海量且可选的算法可能会让他们无所适从。因此，为了方便组织，将它们分为两个大类是至关重要的。


    算法可以通过两种方式进行分类：第一种是根据其学习风格对其进行分类，第二种是根据算法在目的或形式上的相似性将其归类。这两种分类策略或方法都是有用的；尽管如此，让我们根据相似性类别来看算法，并看看它们之间有什么不同。


    ## 学习风格


    集成学习方法（Ensemble Learning Method）是一种涉及一群人共同学习的学习类型。为了让算法能够根据与经验、环境或其他形式的输入数据的交互来基于问题，必须以多种不同的方式定义问题。在人工智能和机器学习教科书中，人们普遍认为应该首先考虑算法的学习风格，之后再考虑算法的其他特征。算法可以使用的学习模型或学习风格只有几种。这些将在后续章节中进行详细讨论。


    机器学习算法的分类（或者用科学术语来说，分类学/组织）是非常理想的，因为它迫使你考虑输入数据所起的作用以及模型创建和开发的过程。然后你就可以选择最适合你问题的方法，以获得尽可能好的结果。尽管在第一章中已经简要讨论过，但以下是三种不同但基础的学习风格：


    ### 监督学习（Learning Under Supervision）

    在这种情况下，输入数据被称为训练数据。它包含一个已知的结果或标签，例如垃圾邮件/非垃圾邮件或股票价格等。通过训练过程，开发并测试一个良好的预测模型。为了进行预测，这是必要的，如果这些预测不正确，就会对其进行修正。训练过程会不断重复，直到获得所需的准确率，或者达到完美。例如，`Logistic
    Regression`（逻辑回归）和`Back Propagation Neural Network`（反传播神经网络）都是统计模型。


    ### 无监督学习（Unsupervised Learning）

    无监督学习是一种在没有监督员的情况下发生的学习类型。对于这类数据类型包含的数据，既找不到已知的输出或结果，也无法命名。预测模型通过预测输入数据中包含的结构数量来形成，这通常是为了从输入数据中提取通用规则。降维、聚类和关联规则学习只是可以解决的挑战中的几个。各种算法，如
    `Apriori` 算法和 `k-Means` 方法被用作说明。


    ### 半监督学习（Semi-Supervised Learning）

    在这种情况下，输入数据是杂乱的，由已标记和未标记的案例混合而成，且没有明显的模式。模型必须学习所需的结构，不仅是为了组织数据，还为了根据信息生成预测。分类和回归困难是这种类型问题的两个例子。扩展算法是用作示例的算法。


    ## 按相似性分组的算法（Algorithms Grouped By Similarity）


    正如之前说的，算法可以根据各种不同的标准进行分类。它们通常根据其在操作中可能观察到的共同点进行分组。例如，受神经网络启发的方法和基于树的方法都是可用的。这被广泛认为是分组算法最有效的方法之一，也是使用最广泛的方法之一。然而，它并不是没有缺陷的，例如，许多算法无法被归类到严密的隔绝区域中。`Learning
    Vector Quantization`（学习向量量化）就是一种既基于实例又受神经网络启发的方法示例。例如，结果，仅使用两种标准，是不可能在更深层次上识别的。


    正如前文所述，在对机器学习算法进行分类时，人们经常使用分层方法。有许多算法组可以选择。


    ### 回归算法（Regression Algorithms）

    这些关注变量之间关系的模拟。通过预测误差的测量来实现对这种连接的迭代精炼。它们基于统计，现在被应用于机器学习领域。人们发现这有点困惑，因为“回归”可以指问题类型，也可以指方法本身。尽管如此，“回归”指的是一个过程。一些常用的回归算法包括：


    * `Least Squares Regression`（普通最小二法回归）

    * 线性回归

    * 逻辑回归

    * `Stepwise regression`（逐步回归）

    * `Multivariate Adaptive Splines`（多元自适应回归样条）


    ### 基于实例的算法（Algorithms that are based on instances）

    实例学习是一种基于训练示例解决问题的决策方法。对于模型来说，它们被认为是至关重要的或必要的。这些过程通常会产生示例数据库。在相似性量的帮助下，与新输入的数据进行比较。这样做是为了找到最佳匹配并对结果预测。因此，基于实例的方法（也称为胜者为王法或内存学习）经常应用于机器学习中。这种技术的重点是存储实例的表示，以及用于比较它们之间的相似性量。以下是高度基于实例的算法：


    * `KNN` 代表 K 近邻。

    * `LVQ`（学习向量量化）

    * `Self-Organizing Map`（自组织映射）

    * `Locally Weighted Learning`（局部权学习）


    ### 正则化算法（Regularization Algorithms）

    这些方法作为另一种方法（如回归方法）的扩展或辅助技术，提供额外信息。它们被用于惩罚复杂的模型，同时奖励基础且泛化良好的模型。除了 `Ridge Regression`（岭回归）之外，`LASSO`（绝对收缩回归，即最小绝对收缩和选择算子）、`Elastic
    Net`（弹性网络）和 `Least-Angle Regression`（最小角回归）都是广泛使用的正则化技术（`LARS`）。


    '
- fmt: '

    ### Classification and Regression Tree (CART)

    * `Iterative Dichotomiser 3 (ID3)`

    * `C4.5` and `C5.0` (different versions of a robust approach)

    * `Chi-squared Automatic Interaction Detection (CHAID)`

    * `Stump on a Decision`

    * `M5`

    * `Conditional Decision Trees`


    ### Algorithms with Bayesian Inference

    Known as Bayesian approaches, these techniques directly apply Bayes'' Theorem
    to a variety of tasks, including classification and regression, in order to get
    accurate results. The most common Bayesian algorithms are:


    * `Naive Bayes`

    * `Gaussian Naive Bayes''`

    * `Naive Bayes Multinomial`

    * `Averaged One-Dependence Estimators (AODE)`

    * `The Bayesian Belief Network (BBN)`

    * `Bayesian Network (BN)`


    ### Algorithms for Clustering

    The classifications are similar to regression in that they describe both the class
    of problems and the class of methods that are being used. Different modeling methodologies,
    such as centroid-based and hierarchical modeling, are used to organize them. All
    of these make use of the data''s built-in structures to better organize the data
    into small groups with the greatest amount of commonality. The following are some
    of the most widely used clustering algorithms:


    * `K-Means`

    * `K-Media Professionals`

    * `Expectation Maximization (EM)`

    * `Clustering Based on Hierarchy`


    ### Association Rule Learning

    Association Rule Learning is a type of machine learning algorithm. There are rules
    that are used to analyze the links between data and variables, which are identified.
    Many economically useful and relevant relationships can be discovered using these
    principles while searching through huge and multidimensional data sets. These
    can be used in conjunction with businesses. Some examples include:


    * `Algorithm apriori`

    * `Etalit algorithm`


    ### Artificial Neural Network Algorithms

    Artificial Neural Network Algorithms are a type of algorithm that uses artificial
    neural networks to solve problems. These are neural networks that have been modeled
    and inspired by the functioning and structures of biological nerves in order to
    create a more realistic experience. They are frequently used for classification
    problems as well as regression, but they can be used for a variety of other tasks
    as well, as machine learning is a vast area with many different epistemic sectors
    and perspectives. Highly popular artificial neural network algorithms include:


    * `Perceptron`

    * `Back-Propagation`

    * `Hopfield System`

    * `Radial Basis Function Network (RBFN)`

    * `Deep Learning Algorithms`


    ### Algorithms for Deep Learning

    These are artificial neural networks that are current and extremely up to date,
    and they can take advantage of cheap and abundant computation. More information
    on these will be provided in the future chapters. These are concerned with the
    building of huge and very complicated networks of neurons, as well as the study
    of neural networks in general. A few of the most often used deep learning algorithms
    are:


    * `The Deep Boltzmann Machines (DBMs)`

    * `Deep Belief Networks (DBNs)`

    * `Convolutional Neural Networks (CNNs)`

    * `Stacked Auto-Encoders`


    ### Dimensionality Reduction Algorithms

    Among the most widely used deep learning algorithms are:


    #### An Introduction to Dimensional Reduction Algorithms

    These approaches are similar to clustering methods in that they attempt to discover
    and utilise the data''s inherent structure. This is carried out in an unsupervised
    manner in certain instances. In order to show dimensional data or to simplify
    data that can be utilized in a supervised learning process, this technique can
    be beneficial.


    #### Algorithms in Groups (Ensemble Algorithms)

    These models are composed of a number of weaker models that have been independently
    trained to perform distinct tasks. In order to produce an ensemble prediction,
    the predictions of all of these models are integrated. A great deal of thought
    has gone into identifying the different categories of weak learners as well as
    how they might be blended. Supposedly, it is a really effective procedure.

