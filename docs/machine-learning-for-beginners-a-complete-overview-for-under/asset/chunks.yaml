    # 第 2 章 机器学习基础


    究竟是什么让机器学习在当今世界成为一个如此热门的话题？


    对于上述问题，最简单直接的答案之一是：它具有独特且特征丰富的属性，有潜力永远改变人类历史的进程。用比尔·盖茨的话来说：估计机器学习的一项突破价值于十个微软。上述这句话的本质含义是，世界各地的科学家和计算机专业人士都在迫切地寻找机器学习的突破，以及一种让其更易于使用、更有帮助且更可靠的方法。然而，此类程序仍在运行中，我们尚未发现创建一种能够进行推理的计算机的方法。


    机器学习是计算机学习自我编程的过程。如果将编程被视为自动化以及一种自动化过程，那么机器学习就可以被视为这种自动化过程的自动化，在这种情况下，它导致了双重自动化过程。让编程更具扩展性并在更短的时间内产生更好的结果，是机器学习能为我们提供的两个益处。


    为了证明这一点，请考虑以下对比：传统编程与机器学习之间的区别如下：


    ### 传统意义上的编程

    将信息提供给计算机，并运行一个程序。该软件随后根据提供的数据生成输出。


    ### 机器学习

    机器学习是一个指研究机器如何学习的术语。计算机提供了预先求解的数据以及来自预先求解数据的输出。这两个输入结合形成程序的基础。该程序随后将能够执行传统编程的功能。


    因此，可以通过农业类比的角度来讨论机器学习。算法可以被视为种子，而数据被视为养分。你是农民，而从数据发展出来的程序就是你的作物。


    ## 机器学习的要素


    由于机器学习是一门密集且令人困惑的科学，掌握其基础可能是困难的。它也是一个不断扩张的领域。因此，几乎每天都能看到该领域出现新的构建。例如，根据某些估计，全球每年发明的数算法超过数百个。目前机器学习算法的总数已超过
    1 万个，使机器学习算法的总数突破了万大。


    尽管机器学习算法存在巨大的差异，但它们都建立在三个基本概念之上，具体如下：


    ### 表征 (Representation)

    这个概念与信息的表示有关。它涉及如何表示知识、表示知识需要什么等。表示的一些示例包括规则集，例如 `decision trees`（决策树）、`support
    vector machines`（支持向量机）、`instances`（实例）、`neural networks`（神经网络）、`graphical models`（图形模型）、`model
    ensembles`（模型集成）等。其他类型的表示还包括 `graphical models` 和 `model ensembles`。其中某些将在书后后的部分进行详细介绍。


    ### 评估 (Evaluation)

    这是继递归概念之后最重要的算法概念。它也被称为候选程序，因为它是评估假设的方法。`accuracy`（准确率）、`prediction`（预测）、`recall`（召回）、`squared
    error`（平方误差）、`likelihood`（似然性）、`posterior probability`（后验概率）、`cost`（成本）、`margin`（间隔）、`entropy`（熵）、`k-L
    divergence`（KL 散度）和其他指标都是衡量衡量的示例。


    ### 优化 (Optimization)

    这是算法世界中的第三也是最后一个思想。具体来说，它是开发假设或预期程序的过程。它通常被称为搜索过程。优化技术如 `combinatorial optimization`（组合优化）、`convex
    optimization`（凸优化）和 `constrained optimization`（约束优化）就是示例。创建上述组件的各种组合产生了所有的机器学习算法，因此它们构成了机器学习研发的基础。


    ## 机器学习可以分为几类


    如前所述，机器学习是一个复杂且广泛的领域，因此，它可能被分为许多领域和类别。然而，在表面上，它可以被分为以下四个部分：


    1. 形式化转述

    2. 在专业人员监督下学习 `unsupervised learning`（也称为 `unsupervised learning`）是一种不需要监督的学习方法。

    3. 在半监督环境中的学习

    4. `reinforcement learning`，也称为 `reinforcement learning`，


