    - The resulting Chi-squares are then combined together and added together again
    to obtain the final Chi-square.

    - Gaining Information and Making a Decision are two terms that come to mind. This
    allows for the construction of a conclusion that a small number of impure nodes
    requires less information to characterize them. Specifically, this information
    theory is utilized to quantify and define the degree of disorder in a given system.
    This is referred to as Entropy. For example, if a sample is 100 percent homogeneous,
    the entropy level is zero; but, if the sample is divided equally, the entropy
    level is one or one hundred percent. The less entropy there is, the better it
    is for you. Entropy can be calculated for a split in the following ways:


    - Calculate and express the entropy of the parent node in mathematical terms.

    - For each individual node in the split, calculate the entropy of that node separately,
    and then compute the weighted average of all the other nodes that are present
    in the split.


    ### Variance Reduction


    So far, we''ve looked at algorithms for determining target variables. The procedure
    can be utilized with continuous target variables when the variance is lowered,
    which is a benefit of using it. This technique makes use of a standard calculation
    of variance that can be utilized to determine which split is the best. Variance
    is calculated in the following ways:


    - Create a formula for the variance of each node.

    - Formulate the variance for each split as a weighted average of the variance
    for each node in the split.


    ### Avoiding Overfitting


    We have covered the fundamentals of decision trees as well as the fundamentals
    of the decision-making process that is used to select the optimum splits for a
    tree model up to this point. This tree can be used and used to both classification
    and regression problems, depending on the situation.


    How can overfitting in trees be avoided, and what are the most important parameters
    to consider when modeling trees? Over-fitting is one of the most difficult challenges
    that researchers confront while designing decision trees, and it is a big source
    of frustration for them. If there is no restriction in a decision tree, then it
    will present you with 100 percent accuracy in its results. However, in the worst-case
    situation, it will construct one leaf for every observation made during the experiment.
    As a result, when developing a decision tree, it is critical to prevent over-fitting
    the dataset. Using the following two ways, you can accomplish this:


    - Putting size restrictions on trees and Pruning existing trees. Let''s start
    with the first one and talk about it briefly.

    - How to Set Constraints on the Size of the Tree. This can be accomplished through
    the use of a number of parameters that can be utilized to define a tree.


    These factors are explored in greater detail below. These are true regardless
    of the tool that is utilized. These arguments are available in both R and Python,
    and they are described below.


    - Minimum number of samples required for a node split.

    - It has the ability to specify the amount of observations that are required for
    a certain node in order to split the data.

    - It is also employed in order to prevent over-fitting. A huge number of values
    can make it difficult to learn relationships.

    - A huge number of values can also result in under-fitting of the model.

    - It has the capability of defining the minimum sample size for a leaf.

    - It can be used to keep over-fitting under control.


    Lower values are welcomed for problems involving uneven class relations since
    the number of regions in which the minority class turns out to be the majority
    class is insignificant. The maximum depth of the tree is:


    - This can be used to determine the depth of a tree''s root system.

    - It is used to keep over-fitting under control.

    - It will need to be fine-tuned with the help of CV.

    - A significant number of terminal nodes are present.

