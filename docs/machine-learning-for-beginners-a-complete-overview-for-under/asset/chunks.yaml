    \ are preceded by weak rules, which is known as boosting. There are numerous boosting\
    \ algorithms available that can improve the accuracy of boosting models even further.\n\
    \nAfter that, you can learn even more about the two most often used boosting methods:\
    \ Gradient Boosting (`GBM`) and `XGBoost`, which are both covered in the course.\
    \ Which is more powerful, the `GBM` or the `XGBoost`? Numerous researchers have\
    \ expressed their admiration for `XGBoost`'s boosting powers. When compared to\
    \ `GBM`, it frequently produces a superior output; yet, it is generally observed\
    \ that the benefits are minimal, and in many situations, irrelevant. The following\
    \ are the reasons why `XGBoost` is preferable to `GBM`:\n\n### Regularization\n\
    Regularization is present in `XGBoost`, as opposed to the Standard `GBM` implementation,\
    \ which does not have regularization. Regularization can help to regulate the\
    \ amount of over-fitting that occurs. This is why `XGBoost` is often referred\
    \ to as a 'regularized boosting strategy,' which is another term for it.\n\n###\
    \ Parallel Processing\nParallel Processing (also known as Distributed Processing)\
    \ is a technique for processing several tasks at the same time. Unlike `GBM`,\
    \ `XGBoost` utilizes parallel processing, which allows it to be far quicker than\
    \ traditional boosting methods. You might wonder how boosting, a serialized or\
    \ sequential process can be parallelized, and this is a legitimate issue. The\
    \ following short clarification will help to understand why this is the case.\
    \ An older or previous decision tree must be used as a foundation for the construction\
    \ of a new decision tree. Because of this, it is possible to grow or produce a\
    \ new tree from each core. As a result, it is a highly adaptable strategy. `XGBoost`\
    \ can also be used in conjunction with Hadoop. \n\n### High degree of adaptability\n\
    `XGBoost` is far more flexible than `GBM` in that it allows the user to optimize\
    \ and tailor any assessment criteria as well as optimization objectives the user\
    \ want. This makes it extremely strong because it effectively removes any constraints\
    \ from the field, allowing you to do whatever you want.\n\n### Missing Values\n\
    `XGBoost` is a superior solution to `GBM` since it is more capable of dealing\
    \ with missing values than `GBM`. As an alternative to the observation, the user\
    \ can offer a value that is not the observation and can send it as a parameter.\
    \ `XGBoost` will attempt to complete a variety of jobs because it is capable of\
    \ locating a missing value on every node and learning the path as well.\n\n###\
    \ Pruning\nPruning trees is a necessary part of tree care. An algorithmic splitter\
    \ frequently stops splitting nodes when it detects a negative loss in the split.\
    \ This makes it a more greedy algorithm, in the eyes of the general public. Comparatively,\
    \ `XGBoost` can split till the max depth of the value is reached, and then it\
    \ begins the pruning mechanism, which removes the splits until a positive gain\
    \ is found. When this is not done, it returns to the starting point.\n\n### Cross-validation\n\
    Cross-validation is built into the system `XGBoost` includes a built-in mechanism\
    \ for cross-validation, which is executed at the end of every repeat. The optimal\
    \ amount of boost repetitions in a single run thus becomes exceedingly simple\
    \ to calculate as a result of these developments. When it comes to grid-searching\
    \ algorithms, this is not the case, as only certain values are checked in the\
    \ mechanism in the case of `GBM`.\n\n### Keeping the Current Model in Place\n\
    It is possible to re-run the `XGBoost` model from the.\n"
