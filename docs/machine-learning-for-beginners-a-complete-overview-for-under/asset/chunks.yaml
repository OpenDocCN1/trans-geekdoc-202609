    在最后阶段，它汇总从所有弱学习器获得的所有信息并生成报告。在最后一步中，它接收来自所有弱学习器的所有信息并将其结合，以创建一个强学习器。最终，这个学习器将能够提高模型的预测能力。它高度关注于之前被弱规则判分类错误的案例和高误差案例，这被称为提升（boosting）。目前有许多可用的提升算法可以进一步提高提升模型的准确性。


    之后，你可以学习更多关于两种最常用的提升方法：梯度提升（`GBM`）和 `XGBoost`，这两者在课程中都会涵盖。`GBM` 还是 `XGBoost` 更强大呢？许多研究人员都对
    `XGBoost` 的提升能力表示赞赏。与 `GBM` 相比，它经常产生更优越的输出；然而通常观察到，这种优势微乎其微，在许多情况下甚至是无关痒的。以下是
    `XGBoost` 优于 `GBM` 的原因：


    ### Regularization

    `XGBoost` 存在正则化，而标准的 `GBM` 实现则没有正则化。正则化有助于调节过拟合的程度。这就是为什么 `XGBoost` 通常被称为“正则化提升策略”，这是它的另一个术语。


    ### Parallel Processing

    并行处理（也称为分布式处理）是一种同时处理多项任务的技术。与 `GBM` 不同，`XGBoost` 利用并行处理，这使其比传统的提升方法快得多。你可能会奇怪作为一种串行或顺序过程的提升是如何实现并行化的，这是一个非常合理的问题。下面的简短说明将有助于理解为什么是这样。构建新的决策树必须使用旧的或之前的决策树作为基础。因此，可以在每个核心上生长或产生一个新树。结果是这是一种高度适应的策略。`XGBoost`
    还可以结合 Hadoop 使用使用。


    ### High degree of adaptability

    `XGBoost` 比 `GBM` 灵活得多，因为它允许用户优化并定制任何评估标准以及用户想要的任何优化目标。这使其变得极其强大，因为它有效地消除了该领域的任何限制，允许你随心所欲。


    ### Missing Values

    `XGBoost` 是 `GBM` 的优越解决方案，因为它比 `GBM` 更能够处理缺失值。作为观测的替代方案，用户可以提供一个不是观测值的值并作为参数发送。`XGBoost`
    会尝试完成各种工作，因为它能够定位每个节点上的缺失值并同时学习路径。


    ### Pruning

    修剪树是树维护的必要部分。算法拆分器在检测到分裂中出现负损失时通常会停止分裂节点。这使得在普通大众眼中，它更像是一种贪婪算法。相比之下，`XGBoost`
    可以一直分裂到达到值的最大深度，然后开始修剪机制，移除分裂直到找到正增益。当未执行这一点时，它会返回起点。


    ### Cross-validation

    交叉验证已内置在系统中，`XGBoost` 包含一个内置的交叉验证机制，该机制在每次重复结束时执行。因此，由于这些进展，单次运行中最佳提升次数的计算变得异常。对于网格搜索算法，情况并非如此，因为在
    `GBM` 机制中只检查某些值。


    ### Keeping the Current Model in Place

    可以从此处重新运行 `XGBoost` 模型。


