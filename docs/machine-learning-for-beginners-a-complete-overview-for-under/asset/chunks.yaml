    # Chapter 2 Basics of Machine Learning


    What is it about machine learning that has made it such a popular topic in today''s
    world?


    One of the most straightforward answers to the preceding question would be that
    it has a unique and feature-rich character that has the potential to alter the
    course of human history forever. Putting it in the words of Bill Gates: It is
    estimated that a breakthrough in machine learning is worth ten Microsoft. What
    the above phrase essentially means is that scientists and computer professionals
    all around the world are desperately searching for a breakthrough in machine learning,
    as well as a way to make it more accessible, helpful, and reliable. However, such
    programs are still in operation, and we have not yet discovered a way to create
    a computer that is capable of reasoning.


    Machine learning is the process through which computers learn to program themselves.
    If programming is considered to be automation as well as an automated process,
    then machine learning is considered to be the automation of this automatic process,
    resulting in a double automatic process in this case. Making programming more
    scalable and producing better outcomes in shorter periods of time are two benefits
    that machine learning can provide us.


    In order to demonstrate this, consider the following comparison: The distinctions
    between traditional programming and machine learning are as follows:


    ### Programming in the traditional sense

    The information is supplied to the computer, and a program is run as a result.
    This software then generates output based on the data that has been supplied.


    ### Machine learning

    Machine learning is a term that refers to the study of how machines learn. The
    computer is provided with pre-solved data as well as the output from the pre-solved
    data. These two inputs are combined to form the basis of a program. This program
    will thereafter be able to perform the functions of traditional programming.


    As a result, machine learning can be discussed via the lens of agricultural analogies.
    Algorithms can be thought of as seeds, whilst data is considered nourishment.
    You are the farmer, and the program that develops from the data is your crop.


    ## Elements of Machine Learning


    Because machine learning is a dense and confusing science, it can be difficult
    to grasp its fundamentals. It is also a field that is constantly expanding. As
    a result, it is possible to witness new construction in the region virtually every
    day. For example, it is estimated that more than a few hundred new algorithms
    are invented each year all around the world, according to some estimates. The
    total number of machine learning algorithms now exceeds 10 thousand, bringing
    the total number of machine learning algorithms to more than ten thousand.


    In spite of the fact that there is a great deal of variation in machine learning
    algorithms, all of them are founded on three fundamental notions, which are as
    follows.


    ### Illustration

    This idea is concerned with the representation of information. It is concerned
    with how knowledge can be represented, what is required in order to represent
    knowledge, and so forth. Some examples of representation include sets of rules,
    such as `decision trees`, `support vector machines`, `instances`, `neural networks`,
    `graphical models`, `model ensembles`, and so on. Other types of representation
    include `graphical models` and `model ensembles`. Some of them will be covered
    in further detail later in the book.


    ### Evaluation

    This is the second most essential algorithmic notion after the concept of recursion.
    It is also referred to as the candidate program because it is the method by which
    hypotheses are evaluated. `accuracy`, `prediction`, `recall`, `squared error`,
    `likelihood`, `posterior probability`, `cost`, `margin`, `entropy`, `k-L divergence`,
    and other metrics are examples of what is measured.


    ### Optimization

    This is the third and last idea in the algorithmic world. Specifically, it is
    the process by which a hypothesis or a prospective program is developed. It is
    often referred to as the search procedure. Optimization techniques such as `combinatorial
    optimization`, `convex optimization`, and `constrained optimization` are examples.
    Creating various combinations of the above components yields all machine-learning
    algorithms, and as such, they serve as the foundation for machine learning research
    and development.


    ## Machine learning can be divided into several types


    As previously stated, machine learning is a complex and extensive field, and as
    a result, it may be separated into numerous areas and categories. It can, however,
    be divided into four sections, which are as follows on the surface level:


    1. Formalized paraphrase

    2. Taking classes under the supervision of a professional `unsupervised learning`
    (also known as `unsupervised learning`) is a method of learning that does not
    require supervision.

    3. Learning in a semi-supervised environment

    4. `reinforcement learning`, also known as `reinforcement learning`,

