  trans: '


    # 摘要


    使用 AI（人工智能）的目标是复制人类的能力，如知识应用、抽象思维、推理和其他认知功能。与此相反，机器学习依赖于基于先验经验开发软件的原则，这正是它名称的由来。令我们惊讶的是，机器学习实际上与数据挖掘和统计学紧密相关，而不是人工智能。


    原因何在？换句话说，当一个计算机程序根据先前的经验完成特定任务时，我们可以得出机器已经“学习”的结论。这种情况与那些因为创建者已经详细描述了其能力而完成任务的程序是完全不同的。


    ## 机器学习的分类


    总而言之，机器学习可以分为三个不同的类别：


    ### 监督学习

    使用已经标记了正确答案和结果的数据对机器进行教学和训练，被称为监督学习。提供的数据量越大，机器对相关主题或学科知识的了解就越多。例如是：苹果的红色和黄色、香蕉的绿色以及西兰花的红色。在机器经过训练后，将向它展示全新的且以前未见过的数据，学习算法将利用其之前的经验来预测结果。


    ### 无监督学习

    使用未标记的数据集对机器进行教育，这被称为“无监督学习”。学习算法不知道数据代表什么，因为它没有收到指令。例如，这里有一封信或一个苹果，但没有提供关于它们或其内容的额外信息。或者，它可能在描述某个特定物品（如树）的特征，而不提供该物品的名称。


    详细描述这一过程。考虑收听中文或印地语等外语播客的经历。在收听了成百上千个播客后，你开始看到趋势、创建模型并识别特定的声音。无监督学习的运作方式与监督学习相似。


    ### 强化学习

    强化学习是一种无监督学习，其数据未标记，与无监督学习相似。然而，如果对数据提出查询，结果也将受到检查。例如，考虑与电脑对手下棋的经历。当计算机胜利时，它会检查结果以确定如何获胜，从而强化这种活动。结果，随着时间的推移，计算机参与数千次游戏，共同开发出获胜的方法和框架。


    ## 神经网络


    在机器学习领域，有一个日益流行的术语：“神经网络”。但它到底是什么？它模仿我们大脑中的神经网络，其功能与神经元相同。当提供了一定数量的输入时，神经网络将根据它对信息的感知来传播信号。机器学习的核心概念是在本概述子章节中述过的内容。这就是机器学习的工作和运行方式，也是我们每天在使用、甚至察觉不到其运作的许多内容！


    # 结论


    这是一个科技时代，因此，技术每天都在变化和演变。每天，要跟上几乎每个行业的最新突破、时尚趋势、科学发现和技术进步都变得越来越困难。在科学和技术领域，情况尤其如此。现代社会的特征是科学和技术的巨大进步，这是两个演变最快的学科。


    因此，为了跟上这种令人目眩晕的速度，人们必须保持极强的时代性并精通技术。然而，这对于所有人来说并不总是。为了让当前的流行词和概念具有意义，像这本书这样的书籍有助于普通公众理解这些概念和流行词的基础知识。


    本书试图通过以直观且明确的方式帮助这类群体理解机器学习、人工智能和决策树的基础知识来为他们提供帮助。本书最适合机器学习新手以及有兴趣学习更多知识的人。。然而，你也将发现不仅适合初学者、也适合专者的知识。书中使用的语言保持了基础且无术语，以便于普通读者阅读。


    本书分为许多章节，允许你在阅读其余内容的同时，仅关注与你相关的部分。在书中，讨论的主要课题是基于树的算法，这对于所有处理数据的科学家来说极其重要。与机器学习家族中的其他模型相比，它们因产生性能最好的模型而闻名。决策树和随机森林在书中得到了深入，涵盖了广泛的主题。树建模的主题从一开始就开始讨论。我有你已经理解了决策树的意义，以及生物学思想是如何被用于推动技术进步的。


    '
