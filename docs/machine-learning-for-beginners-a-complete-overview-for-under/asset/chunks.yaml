- fmt: "\n# Chapter 4: Decision Tree and Random Forests: Part One\n\nThis chapter,\
    \ as well as the following two, will cover the core subject matter of this book,\
    \ which is decision trees and randomly generated forests. Decision trees and random\
    \ forests are a large field that has been divided into three chapters for the\
    \ convenience of readers. This ensures that even if the reader is an absolute\
    \ beginner or an amateur, they will be able to follow the information in the book\
    \ without any difficulty. Let's start at the beginning and go through the fundamentals\
    \ of decision trees.\n\n## What is a Decision Tree, and how does it work?\n\n\
    What is the specific mechanism by which it operates? Before starting on any topic,\
    \ it is essential to understand the fundamentals of the subject and what it entails.\
    \ As a result, this part will deal with broad facts about Decision Trees and their\
    \ applications. \n\nIn layman's terms, a Decision Tree can be characterized as\
    \ a kind or type of learning algorithm that is supervised and has a pre-specified\
    \ goal variable that is widely used in classification issues and may be defined\
    \ as follows: `Decision Trees` are particularly well suited to classification\
    \ difficulties, as they are excellently suited to classification problems. When\
    \ dealing with continuous input output variables, as well as categorical output\
    \ variables, decision trees can be employed effectively. According to this strategy,\
    \ the sample is divided into two or more homogenous sets based on the most significant\
    \ splitter or differentiator in each of the input variables used.\n\n### Example\n\
    \nConsider a sample of 30 children with three different variables: `gender` (male\
    \ or female), `town` (A or B), and `weight` (in kilograms or pounds) (50 to 60\
    \ kg). In their spare time, 15 of these 30 people like playing the piano. At this\
    \ point, the condition is that I want to develop a model that can predict who\
    \ enjoys playing the piano in their spare time. In order to solve this problem,\
    \ it is vital to differentiate between children and group them together in groups\
    \ such as children who play the piano. This should be predicated on a highly important\
    \ input variable that is located in the middle of all three. In such a situation,\
    \ a decision tree can be extremely beneficial since it differentiates and categorizes\
    \ children based on all three criteria at the same time and will result in the\
    \ most homogeneous groups of kids who are heterogeneous to one another.\n\n##\
    \ Decision Trees and Algorithms\n\n`Decision Trees` and `Algorithms` are two types\
    \ of algorithms. As previously stated, decision trees are used to find and identify\
    \ the most significant variable, as well as the value of that variable. This algorithm\
    \ finds the most homogeneous set of data possible. How does it accomplish this,\
    \ specifically how does it identify the variable as well as the split, is a question\
    \ that arises from this. This activity is carried out by the decision tree, which\
    \ makes use of a variety of algorithms. Those algorithms will be covered in further\
    \ detail in the following sections of this chapter.\n\n## Different Types of Decision\
    \ Trees\n\nIn some cases, the decision tree's category might be determined by\
    \ the type of target variable that is made available. It has been discovered that\
    \ it can be classified into two types:\n\n### The Categorical Variable Decision\
    \ Tree\n\nThe `Categorical Variable Decision Tree` consists of the following steps:\
    \ A categorical variable decision tree is a decision tree that has a categorical\
    \ target variable and is used to make decisions. If we were to continue with the\
    \ previous example, we could say that \"Children play piano or not\" will be the\
    \ goal variable in this equation. That is, YES or NO.\n\n### Decision Tree for\
    \ Continuous Variables\n\nThe second type of decision tree is the heuristic decision\
    \ tree. A `Continuous Variable Decision Tree` is a type of decision tree that\
    \ has a goal variable that is constantly changing. Instead than continuing with\
    \ the previous example, let's attempt something new and innovative instead: Assume\
    \ that a person will pay his or her tax to the appropriate government agency (yes/no).\
    \ It can be observed here that the individual's income is the most crucial variable.\
    \ The tax firm, on the other hand, may or may not be aware of the identity of\
    \ the individual. Due to the fact that we are already aware of the relevance of\
    \ the variable, a decision tree may be designed to predict the income based on\
    \ variables such as the product, occupation, and so forth. As a result, the predictions\
    \ are being fulfilled in the case of a continuous variable.\n\n## Terminology\
    \ and jargon used in the context of Decision Trees\n\nBecause machine learning\
    \ is a sophisticated and difficult topic to understand, it has developed its own\
    \ jargon-filled terminology. In a similar vein, the discipline of Decision Trees\
    \ has its own jargon that is frequently characterized by the use of tree metaphors.\
    \ Let us have a look at some of the most important idioms in English.\n\n*   **Root\
    \ Node**: This node represents the whole sample size or population. It is then\
    \ subdivided into two or more homogenous sets, depending on its size.\n*   **Division**:\
    \ This is the procedure that is used to subdivide a node into two or more subnodes,\
    \ as described above.\n*   **Decision Node**: The further separation of subnodes\
    \ into more subnodes is referred to as splitting.\n*   **Leaf or Terminal nodes**:\
    \ The nodes that cannot be divided are known as `Leaf` or `Terminal nodes`, depending\
    \ on their position in the tree.\n*   **Pruning**: The process of removing subnodes\
    \ from its tree.\n*   **Branch and Subtree**: The term `branch` refers to the\
    \ sub-section of a complete tree, while the term `subtree` refers to the sub-section\
    \ of a whole tree. \n*   **Parent Node and Child Node**: When a node is divided,\
    \ the node that is divided is referred to as `parent node`, and the nodes generated\
    \ as a result of the division, i.e. subnodes, are referred to as `child nodes`.\n\
    \n## Advantages\n\n**Uncomplicated to comprehend**: The decision tree method is\
    \ fairly simple to understand, even for those who do not have an analytical background.\
    \ In order to analyze, understand, and comprehend the trees, the user does not\
    \ require any statistical knowledge or information of any kind. Because the graphical\
    \ representation is highly intuitive and user-friendly, users can readily read\
    \ the information contained inside trees.\n\n**Data exploration can be aided by**:\
    \ This is one of the most expedient methods of identifying the most significant\
    \ variable as well as the relationship between two or more factors. When creating\
    \ new variables and features, decision tree might assist the user in the process.\
    \ These characteristics will have greater predictive power when it comes to forecasting\
    \ the target variable. Suppose that the user is working on a project in which\
    \ there are several variables and the data is available in a variety of formats.\
    \ In this case, the decision tree will function properly.\n\n**Data cleanup is\
    \ less of a hassle**: In machine learning, a user must spend the majority of their\
    \ time cleaning data and distinguishing between good and bad data. In the case\
    \ of decision tree, this procedure is rather simple and does not require a significant\
    \ amount of time. Due to the fact that it is not influenced by missing numbers\
    \ or outliers, the cleaning process is simple.\n\n**Data type does not pose a\
    \ restriction**: Unlike other algorithms, decision tree is extremely flexible\
    \ and can handle both categorical and numerical data with ease.\n\n**Method is\
    \ not based on parameters**: A nonparametric approach is one that makes no assumptions\
    \ about the structure or distribution of classifiers across space. Decision tree\
    \ is a nonparametric method used in data analysis.\n\n## Disadvantages\n\n**Excessive\
    \ tailoring**: The use of decision tree models is fraught with challenges, the\
    \ most prominent of which is overfitting. This common and practical challenge\
    \ can be overcome over by imposing limitations on model parameters and by filtering\
    \ the data.\n\n**Not well-suited for this model**: Despite the fact that it is\
    \ capable of working with continuous variables, it is not well suited for this\
    \ task. When decision tree begins to categorize variables into more and more categories,\
    \ the information contained within it is lost. In contrast to classification trees,\
    \ regression trees are used to predict outcomes. The terminal nodes, often referred\
    \ to as leaves, are the final step of a decision tree's development. This means\
    \ that decision trees are typically erected upside down, with the leaves at the\
    \ bottom and the roots at the top, rather than the other way.\n\n## Where does\
    \ the tree get split?\n\nThe subject of where the tree should be divided is one\
    \ that all of the users are concerned with. This choice frequently has a significant\
    \ impact on the correctness of the trees. However, the criteria that are utilized\
    \ to make this decision differ between classification trees and regression trees.\
    \ In order to decide where to split and how much to split, the decision trees\
    \ employ a number of different methods. Because to the addition of sub-nodes,\
    \ the homogeneity of the network is increased. This indicates that as the goal\
    \ variable grows, the purity of the nodes improves as a result of this. The type\
    \ of target variables is taken into consideration when selecting an algorithm.\
    \ The four most frequently encountered algorithms in such decision trees are as\
    \ follows:\n\n### Gini Index\n\nWhen two things are selected at random from the\
    \ population, they must belong to the same class in order for the `Gini Index`\
    \ to be calculated. This is a very likely scenario. Let us look at the following\
    \ formula:\n\n```\nGini Index = 1 - sum(p_i^2)\n```\n\nWhere `p_i` is the probability\
    \ of an item being classified into a particular class. For example, we need to\
    \ calculate the Gini coefficients for whether they are playing piano or not.\n\
    \n```\nGini Index = 1 - (p1^2 + p2^2)\n```\n\nWhere `p1` is the probability of\
    \ the child playing piano and `p2` is the probability of the child not playing\
    \ piano.\n\n```\nGini Index = 1 - (0.5^2 + 0.5^2) = 1 - (0.25 + 0.25) = 0.5\n\
    ```\n\nThe Gini Index is used to determine the split. For example, we need to\
    \ calculate the Gini coefficients for the genders:\n\n```\nGini Index = 1 - (p1^2\
    \ + p2^2)\n```\n\nWhere `p1` is the probability of the child being male and `p2`\
    \ is the probability of the child being female.\n\n```\nGini Index = 1 - (0.6^2\
    \ + 0.4^2) = 1 - (0.36 + 0.16) = 0.48\n```\n\nThe Gini Index is used to determine\
    \ the split. For example:\n\n```\nGini Index = 1 - (p1^2 + p2^2)\n```\n\nWhere\
    \ `p1` is the probability of the item being in class A and `p2` is the probability\
    \ of it being in class II.\n\n```\nGini Index = 1 - (0.7^2 + 0.3^2) = 1 - (0.49\
    \ + 0.09) = 0.42\n```\n\nThe Gini Index is used to determine the split. For example:\n\
    \n```\nGini Index = 1 - (p1^2 + p2^2)\n```\n\nWhere `p1` is the probability of\
    \ the item being in class I and `p2` is the probability of it being in class II.\n\
    \n```\nGini Index = 1 - (0.8^2 + 0.2^2) = 1 - (0.64 + 0.04) = 0.32\n```\n\nThe\
    \ Gini Index is used to determine the split. For example:\n\n```\nGini Index =\
    \ 1 - (p1^2 + p2^2)\n```\n\nWhere `p1` is the probability of the item being in\
    \ class I and `p2` is the probability of it being in class II.\n\n```\nGini Index\
    \ = 1 - (0.9^2 + 0.1^2) = 1 - (0.81 + 0.01) = 0.18\n```\n\nThe Gini Index is used\
    \ to determine the split.\n\n### Chi-square\n\nWhen two things are selected at\
    \ random from the population, they must belong to the same class in order for\
    \ the `Chi-square` to be calculated. This is a very likely scenario. Let us look\
    \ at the following formula:\n\n```\nChi-square = sum((O - E)^2 / E)\n```\n\nWhere\
    \ `O` is the observed frequency and `E` is the expected frequency. The Chi-square\
    \ is used to determine the split. For example, we need to calculate the Chi-square\
    \ for the genders:\n\n```\nChi-square = sum((O - E)^2 / E)\n```\n\nWhere `O` is\
    \ the observed frequency and `E` is the expected frequency. The Chi-square is\
    \ used to determine the split. For example:\n\n```\nChi-square = sum((O - E)^2\
    \ / E)\n```\n\nWhere `O` is the observed frequency and `E` is the expected frequency.\
    \ The Chi-square is used to determine the split. For example:\n\n```\nChi-square\
    \ = sum((O - E)^2 / E)\n```\n\nWhere `O` is the observed frequency and `E` is\
    \ the expected frequency. The Chi-square is used to determine the split.\n\n###\
    \ Information Gain\n\nInformation Gain is used to determine the split. It is calculated\
    \ using the formula for entropy:\n\n```\nEntropy = -sum(p_i * log2(p_i))\n```\n\
    \nWhere `p_i` is the probability of an item being classified into a particular\
    \ class. Information Gain is then calculated as:\n\n```\nInformation Gain = Entropy(Parent)\
    \ - sum(weight(Child) * Entropy(Child))\n```\n\nWhere `weight(Child)` is the proportion\
    \ of items in the child node relative to the parent node.\n"
