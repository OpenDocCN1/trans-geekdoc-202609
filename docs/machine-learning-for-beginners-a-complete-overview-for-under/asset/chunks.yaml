- fmt: "\n# Chapter 5: Decision Trees: Part 2\n\nIn this chapter, certain topics such\
    \ as tree pruning, etc. will be handled.\n\n## Tree Pruning\n\nBecause it is regarded\
    \ a greedy technique, as previously stated in the previous chapter, the method\
    \ of setting a constraint is not advised. As a result, until one of the numerous\
    \ halting conditions specified is fulfilled, the algorithm will just search for\
    \ the best split and move forward from there.\n\nFor example, if we are to utilize\
    \ the metaphor of driving, we may say that: Assume that there are two lanes on\
    \ the highway. Cars are traveling at a speed of 90 kilometers per hour in lane\
    \ one. Trucks are traveling at a speed of 40 kilometers per hour in lane two.\
    \ You are driving a red car, and you now have two choices in front of you. You\
    \ have two options: either take a left and overtake the two cars in front of you\
    \ as soon as possible, or stay in your lane and wait for the situation to resolve\
    \ itself. \n\nLet's take these options one by one and see how they work out. In\
    \ option number one, you will immediately take control of the automobiles and\
    \ then proceed into the lane where the trucks are driving to complete the mission.\
    \ After that, you'll have to travel in the lane with the trucks at a speed of\
    \ 40 kilometers per hour until a space opens up in the old lane. In the meantime,\
    \ the automobiles in the original lane, which were behind you, have moved forward\
    \ and are now in front of you on the highway. If your goal required you to cover\
    \ the greatest amount of ground in the shortest amount of time, your selection\
    \ would be the most appropriate. If you opt for the latter option, you'll maintain\
    \ your speed as you pass the trucks and then have the opportunity to take the\
    \ wheel and continue forward. \n\nThis is the difference between a pruning decision\
    \ tree and a regular decision tree. Because it cannot see the 'truck' or the obstruction\
    \ in front of it, a decision tree with restrictions would attempt to take a greedy\
    \ strategy in order to maximize its gains. If pruning is utilized, on the other\
    \ hand, the method will take a few steps back and will have a chance to consider\
    \ the situation before acting on it. This implies that trimming is preferable\
    \ to the other alternative.\n\nSo, what is the best way to make use of it? It\
    \ is required to create a decision tree with a large depth in order to make use\
    \ of pruning. Then we must start from the bottom and work our way up, slowly and\
    \ gradually removing the leaves that are producing bad effects as compared to\
    \ the leaves at the top of the tree. Suppose a split results in a negative result,\
    \ meaning that we lose 10, and the following split results in a positive result,\
    \ meaning that we make 20. An unpruned decision tree will come to a standstill\
    \ at step one; however, after pruning, we will see the overall gain increase to\
    \ +10 while still retaining both of the leaves in place.\n\n## Choosing the Model\n\
    \nWhat do you prefer: linear models or tree-based models? In order to utilize\
    \ the algorithm, you must first determine what type of problem you are attempting\
    \ to solve. Let us have a look at some of the aspects that you should consider\
    \ when solving a problem, and which can assist you in determining the algorithm\
    \ to be used:\n\n- If a linear model is used to approximate the relationship between\
    \ an independent and a dependent variable, the linear regression will outperform\
    \ the model.\n- Whenever there is a significant amount of nonlinearity as well\
    \ as a complex relationship between the independent and dependent variables, a\
    \ tree model will perform significantly better than a standard technique.\n- If\
    \ you compare it to a linear model, a decision table is considerably easier to\
    \ understand and explain.\n\n## Methods for putting together an ensemble\n\nThe\
    \ definition of ensemble in the dictionary is a group of people. As a result,\
    \ ensemble approaches are comprised of a collection of prediction models that\
    \ work together to improve stability and accuracy. They are also well-known for\
    \ enhancing the performance of tree-based models.\n\nThere are certain issues\
    \ with a decision tree-based model, just as there are with all of the other models\
    \ we have seen so far. Bias and variance are two examples of these issues. The\
    \ term \"bias\" refers to the disparity between the average values that were predicted\
    \ and the actual values that were observed. If the samples are drawn from the\
    \ same population, the term \"variance\" refers to the variation in predictions\
    \ made by models at the same point in time.\n\nThe prediction error can be reduced\
    \ when the model's complexity is increased, which is due to the model's bias being\
    \ reduced when the model's complexity is increased. However, if you gradually\
    \ continue to develop a more intricate model, you run the risk of overfitting\
    \ your model, and your model may suffer as a result of the increased variance.\
    \ It is essential that a robust and extremely powerful model is capable of maintaining\
    \ a healthy balance between the various forms of errors outlined above. Alternatively,\
    \ this is referred to as the tradeoff management of bias-variance mistakes. The\
    \ use of ensemble learning is one of the most effective methods of doing a tradeoff\
    \ analysis.\n\nThe following are the most often used methods of ensemble learning:\n\
    \n- Bagging\n- Boosting\n- Stacking\n\nIn this chapter, we’ll focus on Bagging\
    \ in detail while Boosting will be handled in the next chapter.\n\n## Bagging\n\
    \nWhat exactly is bagging? What is the procedure? Bagged predictions are used\
    \ to reduce the variance of predictions by combining the output of two or more\
    \ classifiers that are trained on distinct samples from the same data set. Bagging\
    \ is accomplished by following the methods outlined below:\n\n1. **Create Multiple\
    \ Data sets**: As a result of sampling, the original data is replaced by the creation\
    \ of new data sets. The resulting data sets may contain only a fraction of the\
    \ rows and columns from the original data sets. In a bagging model, these are\
    \ typically considered hyper parameters. Taking the columns and rows in fractions\
    \ smaller than one can aid in making the model strong and robust by reducing the\
    \ number of possible combinations. It can also help to lessen the amount of over-fitting.\n\
    2. **Build Multiple Classifiers**:\n   - Each new data collection is used to create\
    \ a new set of these.\n   - Every data set is typically treated the same way,\
    \ with the same classifier being built on each one and the predictions being produced\
    \ subsequently.\n"
