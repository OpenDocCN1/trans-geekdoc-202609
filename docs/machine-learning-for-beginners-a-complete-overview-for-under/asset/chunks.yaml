    # 第四章：决策树与随机森林：第一部分


    本章以及接下来的两章将涵盖本书的核心内容，即决策树和随机生成的森林。决策树和随机森林是一个巨大的领域，为了方便读者理解，我们将其分为了三个章节。这确保了即使读者是完全的初学者或业爱好者，也能轻松地跟随书中的信息。让我们从开始，学习决策树的基础知识。


    ## 什么是决策树，它是如何工作的？


    它的运行的特定机制是什么？在开始任何主题之前，理解该主题的基础知识及其包含的内容至关重要。因此，这部分将涉及关于决策树的广义事实及其应用。


    用通俗的话说，决策树可以被描述为一种受监督的学习算法，它具有一个预定义的目标变量，广泛应用于分类问题，可以定义如下：`Decision Trees` 特别适用于分类难题，因为它们非常适合解决分类问题。在处理连续的输入输出变量以及类别输出变量时，可以有效地使用决策树。根据这种策略，将根据所使用的每个输入变量中最重要的拆分器（或区分器），将样本分为两个或多个同质集合。


    ### 示例


    考虑一个由 30 个儿童组成的样本，具有三个变量：`gender`（男或女）、`town`（A 或 B）和 `weight`（以公斤或磅为单位，50 到 60
    公斤）。在空闲时间，这 30 人中的 15 人喜欢弹钢琴。此时，条件是我想开发一个模型来预测谁在空闲时间喜欢弹钢琴。为了解决这个问题，区分孩子们并将他们分为若干组（例如弹钢琴的儿童）至关重要。这应该建立在所有三个变量中间的一个非常重要的输入变量之上。在这种情况下，决策树非常有用，因为它可以同时根据这三个标准对儿童进行区分和分类，从而产生彼此异质但内部同质的儿童小组。


    ## 决策树与算法


    `Decision Trees` 和 `Algorithms` 是两种类型的算法。如前所述，决策树用于寻找和识别最重要的变量以及该变量的值。这种算法寻找的是尽可能同质的数据集。它是如何实现这一点的，具体来说它是如何识别变量以及拆分的，这是一个随之产生的问题。这项活动由决策树执行，它利用了多种算法。这些算法将在本章的后续章节中详细介绍。


    ## 不同类型的决策树


    在某些情况下，决策树的类别可能取决于可用目标变量的类型。已经发现它可以被分为两类：


    ### 类别变量决策树


    `Categorical Variable Decision Tree` 由以下步骤组成：类别变量决策树是一种具有类别目标变量并用于做出决策的决策树。如果我们继续之前的示例，我们可以说“孩子是否弹钢琴”将是该方程中的目标变量。即：是（YES）或
    否（NO）”。


    ### 连续变量决策树


    第二种决策树是启发式决策树。`Continuous Variable Decision Tree` 是一种目标变量不断变化的决策树类型。与其继续之前的示例，让我们尝试一些新颖且创新的：假设某人将向适当的政府机构缴纳税（是/否）。在这里可以观察到，个人的收入是最关键的变量。另一方面，税收公司可能知道也可能不知道个人的身份。由于我们已经知道该变量的相关性，可以设计决策树，根据产品、职业等变量来预测收入。因此，在连续变量的情况下，预测得以实现。


    ## 决策树背景下使用的术语和行话


    由于机器学习是一个复杂且难以理解的主题，它已经发展出了一套充满术语的词汇。同样，决策树学科也有自己的行话，这些行话通常以树的比喻为特征。让我们来看一些英语中最重要的短语。


    *   **根节点 (Root Node)**：此节点代表整个样本量或总体。然后根据其大小，它被细分为两个或多个同质集合。

    *   **划分 (Division)**：这是用于将节点如上所述地细分为两个或多个子节点的程序。

    *   **决策节点 (Decision Node)**：将子节点进一步分离为更多子节点被称为“拆分（splitting）”。

    *   **叶节点或终端节点 (Leaf or Terminal nodes)**：无法再划分的节点被称为 `Leaf` 或 `Terminal nodes`，这取决于它们在树中的位置。

    *   **剪枝 (Pruning)**：从树中移除子节点的过程。

    *   **分支与子树 (Branch and Subtree)**：`branch` 一词指的是完整树的一个部分，而 `subtree` 指的是整棵树的一个部分。

    *   **父节点与子节点 (Parent Node and Child Node)**：当一个节点被划分时，被划分的节点称为 `parent node`（父节点），而由于划分产生的节点（即子节点）称为
    `child nodes`（子节点）。


    ## 优点


    **易于理解**：决策树方法非常容易理解，即使对于那些没有分析背景的人也是如此。为了分析、理解和领会树，用户不需要任何统计知识或任何类型的信息。由于图形化表示非常直观且用户友好，用户可以轻松地读取树中包含的信息。


    **可以辅助数据探索**：这是识别最重要的变量以及两个或多个因素之间关系最快捷的方法之一。在创建新变量和特征时，决策树可能会在此过程中帮助用户。当涉及到预测目标变量时，这些特征将具有更强的预测能力。假设用户正在运行一个项目，该项目有多个变量，且数据以各种格式存在。在这种情况下，决策树将正常工作。


    **数据清洗不那么烦恼**：在机器学习中，用户必须花费大部分时间清洗数据并区分好数据和坏数据。在决策树的情况下，这一过程相当简单，不需要花费大量时间。由于它不受缺失数字或离群值的影响，清洗过程非常简单。


    **数据类型不构成限制**：与其他算法不同，决策树非常灵活，可以轻松地处理类别和数值数据。


    **方法不基于参数**：该方法不基于参数。


    ## 缺点


    **理解简单**：决策树方法非常容易理解，即使对于那些没有分析背景的人也是如此。为了分析、理解和领会树，用户不需要任何统计知识或任何类型的信息。由于图形化表示非常直观且用户友好，用户可以轻松地读取树中包含的信息。（注：此处原文内容似乎与优点部分重复，翻译已按要求保留）


    **过拟合**：决策树在处理复杂数据集时容易产生过拟合现象，导致模型的泛化能力较差。


    **对噪声敏感**：数据中的微小变化可能会导致决策树结构发生巨大变化。


    **计算开销大**：对于非常大的数据集，构建树可能需要大量的计算资源。


