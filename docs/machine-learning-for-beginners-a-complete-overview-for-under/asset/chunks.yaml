  trans: '


    # 监督学习


    在技术领域，监督学习（supervised learning）也被称为归纳学习（inductive learning）。这种学习方法被认为是所有学习方法中最先进、最成熟的。因此，它是研究最充分、应用最频繁的学习类型。这种学习类型很容易使用，因为在监督下学习比在无监督的情况下学习要容易得多。


    我们提供了一个形式为数据 `(x)` 的函数示例，函数的输出为 `(f (x))`。这被称为归纳学习。在这种情况下，归纳学习的目标是理解并学习对收集的新数据
    `(x)` 的函数。在学习过程中，程序会在预先建立的“范例”集合的帮助下进行“训练”。通过这种训练，软件获得了能够易地在不受不受任何干扰的情况下，使用新提供的数据生成新鲜且准确结果的能力。监督学习是所有学习方法中应用最广泛、最受欢迎的，本章以及本书其余部分将尝试重点关注它。其他类别将在稍后进行详细介绍。


    在大多数监督学习应用中，最终目标是开发一个合适且良好的预测函数 `h (x)`。假设（hypothesis）是这一概念的另一个术语。“学习”包含了几个数学过程，这些过程是为了最大化函数而要求的。经过优化后，当数据
    `X` 提供给连接特定领域的计算机时，它可以准确地预测 `h (x)` 的值。例如，当给定农用地的面积时，计算机应该能够对该土地的价值进行估计。


    尽管 `x` 似乎始终代表多个数据点，但事实并非如此。所以，如果我们遵循前面的例子，程序可能会考虑井的数量 `(x2)`、树的数量 `(x3)`、温室的数量
    `(x4)`、电线杆的数量 `(x5)`、堆肥坑的数量 `(x6)` 以及除第一个变量（即土地面积 `(x1)`）之外的各种其他变量。因此，确定正确的输入是指能够产生正确结果的输入。开发机器学习算法是该过程中最重要的方面之一。为了避免变得过于复杂和困难，本示例将仅考虑单个输入值。此条发布于
    2010 年 7 月 8 日。


    ## 示例


    假设程序或预测器正在使用以下语法和结构：

    ```

    H (x) = 0 + 1x

    H (x) = 0 + 1x

    ```

    值 `0` 和 `1` 是该方程中的常量。这里的目标是发现上述两个常量的最优值，以构建并确保我们的预测器正常运行。训练示例被用于改进预测器 `h (x)`
    的性能。在每个示例中，都添加了一个 `x train` 的值，并且该值对应的输出值 `y` 是预先已知的。


    作为说明，可以确定已知的（即正确的）值 `y` 与预测值 `h (x train)` 之间的差异。当提供足够数量训练示例时，就可以对差异进行分析和验证，以识别并衡量
    `h (x)` 的误差。通过应用我们的发现，我们可以通过改变 `0` 和 `1` 的值来调整和操作 `h (x)`，提高其准确性。然后重复该过程，直到通过试错发现
    `0` 和 `1` 的最佳值。这就是训练预测器的方法。这个训练好的预测器现在可以读取真实世界的数据，并根据输入完全或几乎正确地预测结果。


    无监督学习（也称为无引导学习）是一种不需要监督的学习方法。在训练数据中，输入系统的数据不包含任何预期的输出。因此，要提供的数据没有任何输出。这是否是一种良好且建议的学习方法，很难察觉和确定地断言。例如，聚类（Clustering）就是这样一个例子。半监督学习是上述两种学习类型的结合，训练数据包含部分但不是所有预期的输出。强化学习是在收到正向强化时发生的一种学习类型。它是所有学习模式中最具野心的，被认为是最困难的。在这种情况下，奖励是根据一系列行为授予的。这是人工智能经常偏好的方式。


    ## 现实世界中的机器学习


    尽管机器算法是整个机器学习过程的关键方面，但它们仅占整个过程的一小部分。实际上，过程要复杂得多。作为说明，考虑以下内容：


    ### 开始循环

    -

    在这种情况下，必须理解该领域。手头的现有事实、可获得的知识以及预期的结果都被考虑在内。这通常涉及到与主题专家交流。目标通常是模糊的，在采取行动之前，你必须尝试尝试许多不同的方法。


    数据整合、选择、清洗和预处理都是过程的一部分。这是整个过程中最耗时的一步……它几乎了总处理时间的一半，甚至更多。获取高质量数据至关重要。然而，质量与数据量之间的关系通常成反比，收集的数据越多，产生脏数据的可能性越大。从剩余数据中分离出良好且可用数据所需的时间，是因为这个过程极其耗时。


    ### 学习模型

    该过程的这一阶段尽管它是最成熟的元素，也是它最有趣的部分。这是通过使用通用工具完成的。


    ### 结果及其解释

    大多数时候，不需要理解模型是如何工作的，因为唯一重要的是结果。人类专家在这一点上经常与你持不同意见。汇总并应用所学知识。尽管许多项目在实验室中非常成功且卓越，但它们在现实生活中实现的概率极低。事实上，大多数项目都被放弃了，从未在实际世界中使用过。


    ### 循环结束

    过程结束时有一个结束循环，它不是一次性操作。需要反复运行循环，直到获得预期且有用的结果。数据也可以在过程中发生变化，这对整体过程产生影响，因为必须创建一个新循环来替换之前的。


    ## 机器学习应用示例

    以下是机器学习可以获得卓越结果的一些领域简选：


    - **搜索引擎**：如 `Google` 和 `Yahoo!` 可以根据你之前的点击和点赞对网页和搜索条目进行排序，并显著显示新鲜、相关的结果。

    - **计算生物学**：能够利用以前研究的数据，在系统或计算机中逻辑化地产生药物。

    - **金融**：能够确定信用卡相关的风险水平。它还可以根据客户的偏好和购买历史向其发送个性化报价。还可以帮助你决定将钱放在哪里运作。在电子商务中识别交易的性质，例如它是否是合法的正当交易还是欺诈交易。

    - **太空探索**：可以协助射电天文学和太空任务等。

    - **机器人**：该领域可以帮助自动驾驶汽车和自主机器人的发展。对能够处理不可预测情况和陌生地点的机器人做出贡献。

    - **数据**：从可以通过访问的数据库中检索信息。社交网络可以帮助你收集有关偏好和关系的信息。

    - **调试**：此功能可用于调试。


