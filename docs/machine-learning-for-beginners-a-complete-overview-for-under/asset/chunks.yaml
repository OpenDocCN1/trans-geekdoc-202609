  trans: "\n\n# 第 5 章：决策树：部分 2\n\n在本章中，我们将处理树剪枝等主题。\n\n## 树剪枝\n\n由于它被视为一种贪心技术，正如上一节所提到的，不建议设置约束条件。因此，在满足指定的众多停止条件之一之前，算法将一直寻找最佳划分点并据此继续进行。\n\
    \n例如，如果我们用开车来做比喻，可能会说：假设高速公路上两条车道。第一条车道上的汽车以每小时 90 公里的速度行驶。第二条车道的卡车以每小时 40 公里的速度行驶。你开着一辆红汽车，现在面前有两个选择。你有两个方案：要么左转并尽快超过前面的两辆车，要么留在原车道内等待情况自行解决。\n\
    \n让我们逐一分析这些方案，看看它们是如何运作的。在方案一中，你将立即控制车辆，然后进入卡车行驶的车道以完成任务。之后，你必须以每小时 40 公里的速度在卡车车道上行驶，直到旧车道出现空间。与此同时，原车道中在你在你后面的汽车已经向前移动，现在位于高速公路的你的前方。如果你的目标是在最短时间内覆盖最大的路程，那么你的选择是最合适的。如果你选择后一种方案，你将在通过卡车时保持原有速度，然后有机会接管方向盘继续向前行驶。\n\
    \n这就是剪枝决策树与普通决策树之间的区别。因为带有限制的决策树看不见前面的“卡车”或障碍物，它会尝试采取贪心策略以实现收益最大化。另一方面，如果利用剪枝，该方法将向后退几步，并在采取行动之前有机会考虑状况。这意味着修剪比其他替代方案更优。\n\
    \n那么，使用它的最佳方法是什么呢？需要创建一个深度的决策树以便使用剪枝。然后我们必须从底部开始向上操作，缓慢且逐渐移除与树顶端叶节点相比产生负面影响的叶节点。假设一次划分导致了负结果（意味着我们损失了\
    \ 10），而随后的划分产生了正结果（意味着我们赚了 20）。未剪枝的决策树会在第一步停滞；但在剪枝后，我们将看到总收益增加到 +10，同时仍保留了两个叶节点。\n\
    \n## 选择模型\n\n你更倾向于线性模型还是基于树的模型？为了利用该算法，你必须首先确定你尝试解决的问题类型。让我们看看解决问题时应该考虑的一些方面，这些方面可以帮助你确定使用的算法：\n\
    \n- 如果使用线性模型来近似自变量与因变量之间的关系，线性回归将优于该模型。\n- 每当自变量和因变量之间存在大量的非性和复杂关系时，树模型的性能将显著优于标准技术。\n\
    - 与线性模型相比，决策表更容易理解和解释。\n\n## 组合模型的方法\n\n字典中“ensemble”（集成）的定义是指一组。因此，集成方法由一组共同工作的预测模型组成，旨在提高稳定性和准确性。它们在增强基于树的模型性能方面也广闻名。\n\
    \n基于决策树的模型存在某些问题，就像我们目前为止看到的所有其他模型一样。偏差（Bias）和方差（Variance）是这些问题的两个例子。“偏差”是指预测平均值与观测到的实际值之间的差异。如果样本抽自同一个总体，“方差”则指模型在同一时间点所做预测的波动。\n\
    \n当模型复杂性增加时，预测误差可以减少，这是因为模型复杂性的增加会导致模型偏差的降低。然而，如果你继续开发开发更复杂的模型，就会面临模型过拟合的风险，你的模型可能会因为方差增加而遭受损害。一个健壮且极其强大的模型能够在上述各种错误形式之间保持健康的平衡至关重要。或者，这被称为偏差-方差错误的权衡管理（tradeoff\
    \ management）。使用集成学习是进行权衡分析最有效的方法之一。以下是最常用的集成学习方法：\n\n- Bagging（袋装）\n- Boosting（提升）\n\
    - Stacking（堆叠）\n\n在本章中，我们将详细关注 Bagging，而 Boosting 将将在书中处理。\n\n## Bagging\n\n到底什么是\
    \ Bagging？流程是什么？Bagged 预测通过组合在同一数据集不同样本上训练的两个或多个分类器的输出，减少预测的方差。Bagging 通过遵循以下方法实现：\n\
    \n1. **创建多个数据集**：通过采样，原始数据被创建的新数据集所取代。生成的数据集可能包含原始数据集的一部分行和列。在 Bagging 模型中，这些通常被视为超参数。取小于\
    \ 1 比例的行和列可以通过减少可能的组合数量来帮助模型变得更强大、健壮。它也有助于减少过拟合程度。\n2. **构建多个分类器**：\n   - 每个新的数据集合都用于创建这些分类器的新集合。\n\
    \   - 每个数据集通常以相同的方式处理，在每个数据集上构建相同的分类器，并随后产生预测。\n\n"
