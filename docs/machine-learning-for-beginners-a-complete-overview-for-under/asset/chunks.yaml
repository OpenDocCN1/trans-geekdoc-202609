    ### 分类回归树 (CART)

    * `Iterative Dichotomiser 3 (ID3)`

    * `C4.5` 和 `C5.0`（鲁棒方法的不同版本）

    * `卡方自动相互作用检测 (CHAID)`

    * `决策树中的桩 (Stump on a Decision)`

    * `M5`

    * `条件决策树`


    ### 基于贝叶斯推断的算法

    这些技术被称为贝叶斯方法，它们直接将贝叶斯定理应用于各种任务（包括分类和回归），以获得准确的结果。最常见的贝叶斯算法有：


    * `朴素贝叶斯`

    * `高斯朴素贝叶斯`

    * `多项式朴素贝叶斯`

    * `平均单变量依赖估计器 (AODE)`

    * `贝叶斯信念网络 (BBN)`

    * `贝叶斯网络 (BN)`


    ### 聚类算法

    这些分类方法与回归的相似之处在于，它们都描述了问题的类型以及所使用的模型类型。使用了不同的建模方法（如基于质心的建模和层次建模）来对它们进行组织。所有这些方法都利用数据内置的结构，以便将数据更好地组织成具有最大共性的小组。以下是一些最广泛使用的聚类算法：


    * `K-Means`

    * `K-Media Professionals`

    * `期望最大化算法 (EM)`

    * `基于层次的聚类`


    ### 关联规则学习

    关联规则学习是一种机器学习算法。它使用某些规则来分析数据与变量之间的联系并识别这些联系。在搜索海量多维数据集时，利用这些原理可以发现许多经济价值且相关的关系。这些方法可以与业务结合使用。一些示例包括：


    * `apriori 算法`

    * `Etalit 算法`


    ### 人工神经网络算法

    人工神经网络算法是一种利用人工神经网络来解决问题的算法。这些神经网络通过模拟生物神经的功能和结构进行建模和启发的，以创建更真实的体验。它们经常被用于分类问题以及回归问题，但也可以用于许多其他任务，因为机器学习是一个巨大的领域，拥有许多认知领域和视角。广受欢迎的人工神经网络算法包括：


    * `感知器`

    * `反向传播算法`

    * `Hopfield 系统`

    * `径向基函数网络 (RBFN)`

    * `深度学习算法`


    ### 深度学习算法

    这些是当前且非常先进的人工神经网络，它们可以利用廉价且丰富的计算资源。关于这些更多信息将在后续章节中提供。它们涉及构建巨大且复杂的神经元网络，以及对神经网络的整体研究。一些最常用的深度学习算法有：


    * `深度波尔兹曼机 (DBMs)`

    * `深度信念网络 (DBNs)`

    * `卷积神经网络 (CNNs)`

    * `堆叠自动编码器`


    ### 降维算法

    最广泛使用的深度学习算法中包括：


    #### 降维算法简介

    这些方法与聚类方法相似，之处在于它们试图发现并利用数据的内在结构。在某些情况下，这是以无监督的方式进行的。为了展示多维数据或简化可用于监督学习过程的数据，这种技术可以是有益的。


    #### 分组算法（集成算法）

    这些模型由若干个弱模型组成，这些模型经过独立训练以执行不同的任务。为了产生集成预测，会整合所有这些模型的预测结果。在识别不同类弱学习器以及如何混合它们方面投入了大量精力。据推，这是一种非常有效的程序。


