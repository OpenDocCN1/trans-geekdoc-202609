    # 第 8 章：数字神经网络与计算机科学


    20 世纪见证了现代计算机的发明和计算的实践。全世界的人都进行了理性的推测，并试图预测计算机未来将带来的成就和进步。例如包括与人类交流、识别面部和肢体语言、与人类对弈象棋等游戏，以及操作机动等。需要注意的是，计算机已经执行并将继续执行所有上述任务和功能。


    其中大部分进展归功于人工智能和机器学习的进步和扩展，特别是在数字神经网络方面。深度学习是一种复杂且高度进化的神经网络，它已经存在很长时间了。这些大约在 70
    年前被设计并投入使用的。1944 年，两位科学家沃尔特·皮茨斯（Walter Pitts）和沃伦·麦卡卡洛（Warren McCullough）产生了一个后来声闻的理念。另一方面，这项研究迅速转变了方向并在开发上陷入停滞。然而，它在
    20 世纪 90 年代重新受到关注，并在今天被认为是人工智能领域最重要的理念之一。


    基于动物（特别是哺乳动物）大脑中生物神经网络的计算机系统被称为人工神经网络，简称为 `ANN`。因此，它是对自然演化的复杂神经元网络的复制。该系统最令人印象深刻的特征是它通过检查样本来学习并完成任务，而不是需要特定任务的代码来完成任务。结果是减少了所需的时间和资源。


    `ANN` 组是连接在一起的人工神经元集合。这组神经元相互连接，连接用于从一个神经元传递和传输信息。它们还具有多层结构。这些层中的每一层在身体中都承担着独特且多样化的功能。信号通常会在整个集中路由多次。人工神经网络（`ANNs`）最重要的目标是复制人类大脑以及人类大脑解决问题的方法。然而，`ANNs`
    的重点正在发生转移，现在更多关注解决问题，而不是以前那样模拟神经网络。为了应对这一点，科学家们正在开发许多新方法和网络，这些网络与自然界中的网络完全不同，但比自然界的网络强大得多。


    ## ANN 的应用


    `ANN` 用于各种应用，包括：

    - 太阳能可用于建模和设计更高效的设备和家用电器。

    - 此外，它还用于系统建模。

    - 能够相对容易地处理复杂和部分数据。

    - 可以用它解决非线性问题。

    - 空调系统、通风、制冷、加热、发电、负载预测以及建筑和施工中的采热负载估计都在涵盖范围内。

    - 机器人、预测、模式识别、医学、制造业、社会和心理科学、信号处理和优化只是涵盖的领域领域。

    - 太阳能建筑中的气流预测和能量消耗预测是预测建模的两个例子。到目前为止，计算机世界中使用人工神经网络已被证明是非常有利的。


    ## ANN 的优势


    - 神经网络能够执行线性网络无法成功完成的任务。

    - 因为它是非线性网络，即使一个或多个元素出现故障，网络也会继续处理并执行其功能。

    - 不需要定期对其进行重新编程。

    - 操作简单。

    - 这是一种具有适应性的学习方法。它非常稳健，可以非常容易地解决各种复杂问题。它可以用于各种不同的情况。

    - 与技术相关的风险相比，`ANN` 的优势远大于这些负面影响。

    - 根据程序使用简单的样本生成结果和响应。

    - 它具有很高的适应性和灵活性。能够通过少量的变量快速学习。

    - 它对用户产生的错误容忍度高得多，因此在许多情况下比线性网络更合适。

    - 自适应学习是该系统的基础。


    ## 使用 ANN 的风险


    在使用 `ANN` 时，有一些需要注意并减轻的风险。然而可以观察到，优点列表远长于风险列表：


    - `ANN` 在有效使用之前需要大量的训练。然而，一旦你掌握了它，使用起来相当简单。

    - 这是一项极其耗时的技术。

    - 在采用 `ANN` 之前有必要正确模拟架构，因为它与微处理器不同。

    - 人工神经网络分为几类。

    - 还有许多其他形式的 `ANNs` 或人工神经网络，但以下三种最重要的。

    - 带反馈的 `ANN`：结果反馈回网络，重复该过程直到获得所需的结果或输出。

    - 馈机 `ANN`：这是一个简单的网络。它由三层组成：输出层、输入层和一个或多个神经连接层。

    - 类预测 `ANN`：前馈人工神经网络的一个子集。


