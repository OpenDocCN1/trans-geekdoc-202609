    ## 热启动 (Warm start)

    这是一个有趣的参数，如果使用得当且谨慎，它可以为用户提供巨大的帮助。该参数可用于快速方便地向之前的模型中添加更多树。这将帮助你节省大量时间，从而开展各种复杂的应用。


    ## 预排序 (Presort)

    当你需要决定是否对数据进行预排序以促进更快的分裂时，可以使用此项。默认情况下，它会自动为你生成一个选择。另一方面，如有必要可以修改这些值。


    以下是使用 `caret` 包的 R 用户最重要的调优参数：


    - `Trees` —— 在此处指定重复次数，以及用于生长后续树的树。

    - `Interaction depth` —— 定义了树的复杂程度，或者树为了正常运行而必须执行的划分总数。

    - `Shrinkage` —— 这用于学习率的引用。它类似于 `python` 中提供的学习率。

    - `N.minobsinnode` —— 这是节点继续分裂所需的最小训练样本量。


    ## 哪里是最好的练习场所？

    定期进行练习对于完善任何技能或概念至关重要。此外，如果你想学习上述算法，你必须投入必要的时间和精力进行练习。练习上述列出的算法非常简单，因为互联网上有大量的资源可以让你找到练习游戏和考试来帮助你提高技能。这些测试定期更新，你还可以参加许多竞赛，这些将帮助你学习如何掌握算法思维和推理。这些挑战通常包含全球排行榜，让你不仅可以练习算法，还能向整个世界展示你的能力和进步。此外，即使在没有连接互联网的情况下，你也可以找到离线练习集，用于准备考试。


    在本书中，关于决策树学习的三部系列将在本章的结束而画上句号。在接下来的章节中，我们将看看今天社会中日益流行的各种机器学习类型。


    ## 第 7 章：深度学习 (Deep Learning)

    到目前为止，我们涵盖了机器学习的基础知识，以及决策树和随机森林的基础及其工作原理。然而，显而易见，机器学习领域并未此结束；相反，在未来的几年里，它的规模和复杂性将继续增加。近年来，深度学习已成为计算机科学中最重要的主题之一。本章旨在对这种学习方法进行简要介绍。


    深度学习，也称为层次学习，定义为使用非生物神经网络来研究和学习具有一个或多个隐藏层的特征，而不是学习没有隐藏的方面。它是学习数据表示层级结构的一部分。根据所使用的方法，学习可以是完全监督的、半监督的或无监督的。许多不同类型的神经网络架构已开发并应用于各个领域，包括计算机视觉、语音识别、机器翻译、社交网络过滤、自然语言处理和生物信息学。深度神经网络还用于声音识别和
    3D 空间中的物体识别等。在这种情况下，这些算法生成的输出能够与人类用户生成的结果相媲美。


    出于特征提取和转换的目的，深度学习指的是一类机器学习算法，这些算法采用超过两层处理单元的节律进行特征提取和转换。鉴于这些层级是级联和嵌套的，前一层的输出或结果将作为后续层的输入或样本。用于分类和模式分析的可能可能是监督的或无监督的。无监督的利用了多种不同类型的数据。它们还利用了信息的视觉表示。该技术在本节中是嵌套，因为本节中的高级特征是建立在低级特征之上的。


    深度学习首次由伦敦世界学校委员会（World School Council of London）创建。机器学习、深度学习和人工智能之间的区别如下：上述三个概念之间最显著的区别，或者说最本质的特征区别是，深度学习是机器学习的一种，而机器学习是人工智能的一种。机器学习被广泛认为是目前可用的人工智能的方法或形式之一。然而，并非所有基于人工智能的系统都使用机器学习；例如，自动驾驶或无人驾驶汽车使用的是基于规则的系统。预测机器学习将在不久的未来成为最流行的人工智能形式。涉及到机器学习，深度学习可以被描述为一种非常流行且技术先进的方法。尽管机器学习的未来一片光明，但并没有保证成功。如果开发出其他证明优于机器学习的其他技术，机器学习将尽快被淘汰，且不会引起任何问题。


