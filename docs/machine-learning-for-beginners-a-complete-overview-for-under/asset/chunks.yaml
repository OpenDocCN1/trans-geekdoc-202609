    "sub-tree" refers to the sub-section of a whole tree. Parent Node and Child Node:
    When a node is divided, the node that is divided is referred to as a parent node,
    and the nodes that are generated as a result of the division, i.e. the subnodes,
    are referred to as the child nodes. These are the jargons that are most frequently
    encountered in the Decision Tree terminology. Consider the pros and cons of the
    method, which will be discussed more below. There is no such thing as a perfect
    machine-learning algorithm, and all algorithms have some sort of flaw or flaws
    in them. In this case, rather than criticizing an algorithm, it is vital to examine
    its pros and downsides and then use the algorithm according to your specific requirements
    and specifications. The advantages and disadvantages of the decision tree method
    are briefly explored in the sections below. Advantages Uncomplicated to comprehend:
    The decision tree method is fairly simple to understand, even for those who do
    not have an analytical background. In order to analyze, understand, and comprehend
    the trees, the user does not require any statistical knowledge or information
    of any kind. Because the graphical representation is highly intuitive and user-friendly,
    users can readily read the information contained inside decision trees. Data exploration
    can be aided by the following: If not the quickest, then certainly one of the
    most expedient methods of identifying the most significant variable as well as
    the relationship between two or more than two factors is thought to be the decision
    tree. When creating new variables and features, a decision tree might assist the
    user in the process. These new characteristics will have greater predictive power
    when it comes to forecasting the target variable. The data exploration stage is
    another step at which it can be applied. Suppose that the user is working on a
    project in which there are several variables and the data is available in a variety
    of formats. In this case, the decision tree will function properly and will accurately
    anticipate the most significant variable. Data cleanup is less of a hassle: As
    previously stated in the first chapter, in machine learning, a user must spend
    the majority of their time cleaning data and distinguishing between good and bad
    data in order to be successful. However, in the case of the decision tree, this
    procedure is rather simple and does not require a significant amount of time.
    Due to the fact that it is not influenced by missing numbers or outliers, the
    cleaning process is simple. The data type does not pose a restriction: Unlike
    other algorithms, the decision tree is extremely flexible, and it can handle both
    category and numerical data variables with ease. Method that is not based on parameters:
    A nonparametric approach is one that makes no assumptions about the structure
    of classifiers or the distribution of classifiers across space. A decision tree
    is a nonparametric method that is used in data analysis. Disadvantages Excessive
    tailoring: The use of decision tree models is fraught with challenges, the most
    prominent of which is overfitting, which is both common and practical. This challenge,
    on the other hand, can be overcome by imposing limitations on model parameters
    and by filtering the data. The following section provides an illustration of this.
    The following variables are not well-suited for this model: Despite the fact that
    it is capable of working with continuous variables, it is not well suited for
    this task. When a decision tree begins to categorize variables into more and more
    categories, the information contained within it is lost. In contrast to classification
    trees, regression trees are used to predict outcomes. The terminal nodes, often
    referred to as the leaves, are the final step of a decision tree''s development.
    This means that decision trees are typically erected upside down, with the leaves
    at the bottom and the roots at the top, rather than the other way around. Both
    of the trees stated above function in a similar or nearly same manner; however,
    there are some tiny distinctions that are highly significant. Let''s take them
    one by one and see how they go. Whenever the dependent variable is continuous,
    the regression trees are employed; however, whenever the dependent variable is
    categorical, the classification trees are employed. In the case of a regression
    tree, the value gained by the terminal nodes in the sample data corresponds to
    the mean of response observed in the data. Because of this, when data is observed,
    the mean value is predicted, rather than the median. In the case of the classification
    tree, the mode of observation is the class earned by the terminal node in the
    sample data, whereas the class won by the terminal node in the sample data is
    the mode of observation in the case of the classification tree. As a result, if
    any previously unknown data falls into that zone, the prediction that takes place
    is the mode value. In both types of trees, the predictor space is divided into
    distinct, non-overlapping spaces by the predictors. In a manner, they are three-dimensional
    boxes with a lot of depth. Both trees employ a top-down greedy style of learning.
    Recursive binary splitting is the term used to describe this method. As a top-down
    method, it begins at the top of the tree, where all of the observations are concentrated
    in a single region, and then separates the predictor space into two new branches
    as it progresses further down the tree. It is referred to as ''greedy'' since
    it is an algorithm that searches exclusively for the best available variable in
    the current split. It is unconcerned with potential splits that will result in
    a more superior tree in the future. The operation of splitting or dividing continues
    indefinitely until the halting criterion specified by the user is satisfied. For
    example, the user can instruct the algorithm to terminate as soon as the number
    of observations in each node falls below 50. This is because in such circumstances,
    the division process or the splitting process produces an output consisting of
    fully created or developed trees until the requirement is met. Although it is
    possible that the data will over-fit the tree, this is unlikely. This results
    in poor accuracy due to the presence of unseen data. Pruning is required as a
    result of this. It is typically employed in order to resolve the problem of over-fitting.
    More information on this will be provided in the following part! Where does the
    tree get split? The subject of where the tree should be divided is one that all
    of the users are concerned with. This choice frequently has a significant impact
