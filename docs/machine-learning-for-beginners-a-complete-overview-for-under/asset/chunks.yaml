    - 单个节点的卡方值是通过计算该节点“成功”和“失败”结果的偏差推得出的。

    - 随后将得到的卡方值合并并再次相加，以获得最终的卡方值。

    - “获取信息”和“做出决策”是两个会想到的术语。这使得我们可以得出一个结论：少数不纯节点只需要较少的信息来表征。具体而言，这种信息论被用于量化和定义给定系统的无序程度。这被称为**熵**。例如，如果一个样本是
    100%同质的，则熵水平为零；但如果样本被平均平分，熵水平为一或百分之百。熵越小，对你越越。。可以通过以下方式计算分裂的熵：


    - 用数学术语计算并表示父节点的熵。

    - 对于分裂中的每个单独节点，分别计算该节点的熵，然后计算分裂中存在的所有其他节点的加权平均值。


    ### 方差减少


    到目前为止，我们已经查看了确定目标变量的算法。当方差降低时，该程序可以用于连续目标变量，这是使用它的优势之一。该技术利用标准的方差计算方法来确定哪种分裂是最好的。方差的计算方式如下：


    - 为每个节点的方差创建一个公式。

    - 将每次分裂的方差制定为该分裂中每个节点方差的加权平均值。


    ### 避免过拟合


    到此为止，我们涵盖了决策树的基础知识，以及用于为树模型选择最优分裂的决策过程基础。根据情况，这种树可以同时用于分类问题和回归问题。


    如何避免树的过拟合，在对树进行建模时需要考虑最重要的参数是什么？过拟合是研究人员在设计决策树时面临的最困难的挑战之一，也是他们挫败感的巨大来源。如果决策树没有任何限制，那么它的结果将呈现
    100%的准确率。然而，在最坏的情况下，它将为实验中的每个观测值构建一个叶子节点。因此，在开发决策树时，防止数据集过拟合至关重要。通过以下两种方法，你可以实现这一点：


    - 对树设置大小限制并修剪现有树。让我们从第一个开始并简要讨论一下。

    - 如何设置树的大小限制。这可以通过若干用于定义树的参数来实现。


    这些因素在下文中得到了更详细的探讨。无论使用什么工具，这些都是真实的。这些参数在 R 和 Python 中可用，描述如下：


    - 节点分裂所需的最小样本数。

    - 它能够指定特定节点分裂数据时所需的观测值数量。

    - 它也被用于防止过拟合。大量的值会使学习关系变得困难。

    - 大量的值也导致模型的欠拟合。

    - 它具有定义叶子节点最小样本量的能力。

    - 它可以用于控制过拟合。


    对于涉及不平衡类别关系的问题，较低的值是更受欢迎的，因为少数类最终变为多数类的区域数量是微不足道的。树的最大深度为：


    - 这可以用于确定树根系统的深度。

    - 它用于控制过拟合。

    - 它需要通过交叉验证（CV）的帮助进行微调。

    - 存在大量的终端节点。

