  \ 2008 年开始向员工提供这些设备，甚至更早。它们曾通过一份现在已公开、曾经机密的 NSA ANT 目录进行销售。\n\n所以，对于 USB 优盘的相同建议也适用于随机给你的、或者你不知道来源的充电线和插头。在我们极度连接的世界里，为了让你更好地保护自己，这是一个微小但必要的代价。\n\
