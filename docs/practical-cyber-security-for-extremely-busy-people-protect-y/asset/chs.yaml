  在第 15 章“反击网络喷子”中，提供了关于在社交媒体平台举报骚扰的详细说明。非自愿色情内容的受害者也应使用这些说明，向发生滥用的社交媒体平台提交举报。\n\n\
  如果你的信息在其他网站上被共享，如果你认为他们可能愿意帮助，可以考虑联系网站所有者。如果你不想联系网站所有者，或者他们不愿意提供帮助，你可以请求 Google、Bing\
  \ 和 Yahoo 从他们的搜索结果中移除你的图片。\n\n这两种处理方法的详细说明见下文。\n\n### 联系网站所有者\n\n根据 Google 的政策，从\
  \ Google 搜索结果中移除个人信息的最佳方法是联系发布该信息或图片的网站所有者。根据 Google 的说法，如果网站所有者删除了该信息，它最终将作为 Google\
  \ 定期更新过程的一部分从 Google 搜索中移除。为了加快从 Google 搜索中移除的过程，请使用 Google 的“过时内容删除工具”（你可以在网上搜索它）。\n\
  \n联系网站所有者有多种方法：\n\n#### “联系我们”链接\n使用网站的“联系我们”链接或网站所有者的电子邮件地址，通常位于网站主页的底部。\n\n####\
  \ 使用 Whois.net\n[`www.whois.net`](http://www.whois.net)\nWhois.net 网站将提供不同网站的注册信息。通常，你想要联系的网站会在那里列出联系方式。\n\
  \n#### 联系网站的托管公司\nWhois.net 的搜索结果通常包含关于谁托管该网站的信息。如果你无法联系网站所有者，请尝试联系网站的托管公司。\n\n\
  ### 从搜索引擎中移除你的图片\n\n你可以联系 Google、微软（Microsoft）和 Yahoo 这三大最大的搜索引擎，请求他们从自己的搜索结果中移除你的非自愿图片。\n\
  \n#### 向 Google 举报非自愿内容\n如果网站所有者不移除你的信息，或者你不想直接联系网站所有者，Google 将从 Google 搜索中移除某些会产生身份盗窃、财务欺诈或其他特定损害之重大风险的敏感个人信息，包括：\n\
  \n*   非自愿的露骨或私密个人图片，\n*   非自愿的虚假色情内容，\n*   具有剥削性移除实践网站上关于你的内容，\n*   特定的财务、医疗和国家\
  \ ID 信息，以及\n*   带有伤害意图的暴露联系信息的搜索（doxing）内容\n\n要请求 Google 移除这些领域的信息，请在网上搜索“从 Google\
  \ 移除你的个人信息”或输入以下地址：\n\n[`support.google.com/websearch/troubleshooter/9685456?hl=en`](https://support.google.com/websearch/troubleshooter/9685456?hl=en)\n\
  \n点击 Google 的官方页面并按照说明操作。\n\n![](img/00157.jpeg)\n\n你可以针对非自愿色情内容向 Google 提交第二次举报。搜索“从\
  \ Google 移除非自愿的露骨或私密图片”或输入以下地址：\n\n[`support.google.com/websearch/answer/6302812?hl=en`](https://support.google.com/websearch/answer/6302812?hl=en)\n\
  \n寻找提供说明的 Google 官方页面。\n\n![](img/00158.jpeg)\n\n![](img/00159.jpeg)\n\n#### 向微软举报非自愿内容\n\
  如果网站所有者不移除你的信息，或者你不想直接联系网站所有者，Google 将从 Google 搜索中移除某些会产生身份盗窃、财务欺诈或其他特定损害之重大风险的敏感个人信息。类似于\
  \ Google 的流程，请访问下方链接并遵循说明：\n\n[`www.microsoft.com/en-us/revenporn`](https://www.microsoft.com/en-us/revenporn)\n\
  \n![](img/0160.jpeg)\n\n#### 向 Yahoo 举报非自愿内容\n访问下方链接并按照 Yahoo 的说明请求从雅搜索、Yahoo Answers\
  \ 以及其他 Yahoo 站点移除：\n\n[`help.yahoo.com/kb/posts-intimate-permission-sln2612.html#/`](https://help.yahoo.com/kb/posts-intimate-permission-sln2612.html/)\n\
  \n![](img/0161.jpeg)\n\n#### DuckDuckGo 的非自愿内容\n虽然 DuckDuckGo 是保护匿名性的良好浏览器，但它并不提供阻止非自愿色情内容出现在其搜索结果中的支持。DuckDuckGo\
  \ 声称从 400 多个源收集数据，与其他搜索引擎的工作类似。遗憾的是，该发布者没有提供从其搜索结果中移除内容的具体说明或指导。\n\n#### Apple Safari\
  \ 的非自愿内容\nApple Safari 使用 Google 作为默认搜索引擎。用户可以在设置中的 Safari 标签页中将搜索引擎更改为 Bing、Yahoo\
  \ 或 DuckDuckGo。如果图片从搜索引擎中移除，那么在使用相同搜索引擎的 Safari 时，这些图片也会被移除。你需要直接向 Google、Bing 和\
  \ Yahoo 请求移除非自愿图片。\n\n### 将敏感照片存入保险\n\n正如第 9 章“移动设备安全”中提到的，在这里值得重申：任何可能被暴露、羞辱或损害你的个人照片和视频都应存储在加密应用程序中。不幸的是，已经发生了无数次手机黑客事件，色徒偷取了人们的隐私、有时是私密的图片并将其发布到网上。我强烈建议使用照片箱来保护你的重要相册。\n\
  \n请注意，这些应用程序对于高级黑客来说可能并非百分之百无懈可击，但这里是一些可以加密手机照片和视频的流行的安全应用程序。还有许多其他应用，但下方应用以强加密水平而闻名。你可以在\
  \ App Store 或 Google Play 上找到它们。\n\n\n\n\n\nCoverMe 拥有照片和视频库，还提供向其他 CoverMe 用户发送安全短信的服务。\n\
