  \n视频保险\n\n![](img/00164.jpeg)\n\n## 维护者的观点\n\n切尔·斯卡莱特（Cher Scarlett）是非自愿色情受害者权利的坚定倡导者。她文章的一部分包含在本章的开头。她分享了这段总结性的观点：\n\
  \n无论任何男性或女性在你同意的情况下交给你的东西，都是私密的。我们一直说，如果你发送裸照会有泄露的风险，但这仅仅是因为这样做几乎没有后果。\n\n这种叙事需要发生转变。你不能既期待又想要伴侣和/或炮友提供私密的色情内容，同时又抱着一种态度：认为不仅有理由相信他们会被偷取、泄露并在未经你许可的情况下分发，而且认为一旦有人泄露了，其他人就有权查看。……\n\
  \n这种态度的问题通常在于，那些说你分享这些照片是你的错的人，往往也是那些想看到这些照片传播的人。实际上，他们只是在指责你，这样他们就不必为鼓励和欢迎这种行为承担责任。\n\
  \n站在受害者的一边。他们不需要你居高临下地警告他们裸照是如何泄露的。他们已经知道了，因为他们已经经历过泄露了。如果你想教人如何处理私密内容的网络安全，去开个班课吧。指导一些青少年，顺便告诉那些青少年不要未经当事人同意的情况下分发色情材料，并惩罚那些这样做的人。\n\
  \n对于我分享这篇[在 Medium.com 上的文章]后收到的大多数回复，我感到非常自豪。对于那些受到影响但一直不敢站出来的其他女性来说，这真的非常有启发性。我们还有很长的路要走，但我一点也不后悔分享这一篇。”99\n\
  \n如果你想阅读切尔的完整文章《五十万人看过了我的裸体》，你可以在 Medium.com 的以下地址找到它：\n\nhttps://medium.com/@cherp/half-a-million-people-have-seen-me-naked-e70e8b89269c\n\
  \n## 第 17 章 – 保护青少年和儿童\n\n根据 FBI 的数据，针对儿童最常见的网络犯罪发生在：\n\n*   成年人在网上与年幼受害者建立关系，并在随后安排会面并虐待该儿童，或\n\
  *   成年人通过操纵、礼物或威胁胁迫儿童制作具有性暗示的图像或视频 —— 这种犯罪被称为“性勒索”（sextortion）。\n\n根据国家失踪与受剥削儿童委员会的数据，遭受网络诱骗的儿童受害者年龄从\
  \ 1 岁到 17 岁不等，平均年龄为 15 岁。几乎所有报告的孩子都表示，除了在线交流外，他们并不认识勒索者。在诱骗儿童的捕食者中，82%为男性，9%为女性，另外\
  \ 9%的案例中性别未知。100\n\n### 性勒索会导致严重的现实后果\n\nFBI 报告了一起令人震惊的遭遇：13 岁的女孩切尔西（Chelsea，为了保护她的身份，她更改了名字）通过一款流行的即时通讯软件与另一个名为\
  \ K.C. 的青少年女孩建立了在线友谊。在几周内，他们互相发送信息和自己的穿着照片。然而，切尔西的一张略显暴露的照片让 K.C.‒ 实际上是一个 30 岁的佛罗里达州男性，名叫贾斯汀·理查德·泰斯尼（Justin\
  \ Richard Testani）‒ 获得了等待已久的威胁机会。\n\n根据 FBI 在 2020 年 11 月 10 日在其网站上发布的一份声明，该捕食者表示，如果她不按他的要求，就会分享这张照片并向她的朋友家人传播关于她的传言。\n\
  \n“她放松了警惕，”她的母亲在 FBI 网站的一份声明中说。“她认为那是另一个青少年女孩而放松了警惕。”\n\n要求和威胁从那里迅速升级。根据 FBI 调查人员介绍，泰斯尼告诉切尔西，如果她不在视频通话中执行他要求的日益露骨和极端的行为，他就强奸并杀死她以及她的亲人。捕食者利用从他们对话中收集的细节以及她在网上发布的信息，使他的威胁变得具体而恐怖。根据切尔西母亲的说法，他告诉她：“我知道你妈妈在哪里工作。如果你不听我说的，我就去杀了她。”\n\
  \n泰斯尼告诉切尔西，他知道她住在哪里，在哪里上学，以及如何找到她的朋友。切尔西的母亲说：“她坚信那是站在门外的人。一个可以立刻找到她的人。”\n\n泰斯尼想接管她的社交媒体账号之一，以便利用它来联系她的朋友，从而获得欺骗和剥削另一群女孩的能力。\n\
  \n当切尔西终于告诉父母发生了什么时，她感到绝望和恐惧。她的继父报了警。101\n\n根据佛罗里达州中部地区检察官办公室的话，在为期一年的审判后，泰斯尼因剥削儿童被判处联邦监狱监禁\
  \ 60 年。根据提交的证据，泰斯尼联系了数百名年轻女孩（通常在 10 到 13 岁之间），通过 Instagram 和 Snapchat 横跨美国。102\n\
  \n切尔西的母亲说，女儿仍在与抑郁和焦虑作斗，在学校难以集中注意力，并会恐恐发作。切尔西从未私见过泰斯尼，甚至没见过他的脸，这进一步放大了她的恐惧。\n\n“这就是为什么她从一个社交达人变成了完全不敢出门，”她的母亲说。\n\
  \n所以父母和监护人能做的最重要的的事情是什么？根据 FBI 的声明，切尔西自己说，当孩子需要帮助时要在那。如果你的孩子因为下载了禁用应用或违反了其他规则而害怕，他们在成为受害者时可能不会寻求帮助。\n\
  \n切尔西还为年轻人分享了一段信息：“一切并不如表面看起来那样。人们在互联网上很容易伪装成别人。不要相信他们所说的一切。如果你陷入了这种处境，最重要的的一点之一是，尽管他们告诉你他们掌握着权力，但你才是掌控局面的人。不要害怕出来。你并不孤单。”103\n\
  \n### 不要害怕寻求帮助\n\n立即向执法部门报告成年人与孩子之间的不当接触。也要通知他们使用的网站。如果一个年轻人正遭受剥削，他们是受害者，应该举报。你可以通过以下一项或多项来帮助他们：\n\
  \n*   联系你当地的 FBI 分局：[`www.fbi.gov/contact-us/field-offices`](https://www.fbi.gov/contact-us/field-offices)\n\
  *   拨打 `1-800-CALL-FBI`\n*   在 `tips.fbi.gov` ([`www.fbi.gov/tips`](https://www.fbi.gov/tips))\
  \ 进行举报\n*   联系你当地的执法部门\n\n### 性勒索：父母需要了解的\n\n什么是性勒索？\n\n性勒索是指成年人通过威胁或操纵，强迫未成年人制作性暗示的图像并发送到互联网。\n\
  \n为什么任何孩子或青少年会同意做这种事情？\n\n\n\n\n\n根据联邦调查局（FBI）的数据，实施此类犯罪的个人技术精明且手段残忍，他们磨炼了自己的技术和方法以最大限度地提高成功率。青人的切入点可以是任何移动或在线网站、应用程序或游戏。这种手段可能表现为赞美、奉承，或者假装开始一段浪漫关系。\n\
  \n另一个切入点是向孩子提供他们看重的东西，以换取快速拍摄一张照片。这可能是签约合同的可能性；在线游戏点数或代码；或者是钱、加密货币和礼品卡。\n\n第三个常见的切入点是直接进行威胁，要么声称他们已经拥有该少年的照片并将其分发，要么威胁要伤害孩子或其他孩子在乎的人或物。\n\
  \n一旦犯罪者获得了第一张照片，他们就会利用曝光或其他伤害的威胁，迫使孩子产生越来越多的露骨素材。\n\n但我的孩子绝不会那样做。\n\nFBI 调查过年仅仅\
  \ 8 岁的受害者，这种犯罪影响不同性别的孩子，并跨越了所有种族和社会经济群体。受害者中包括优等生、教师的孩子、学生运动员等。受害者唯一的共同点是可以使用互联网。\n\
  \n## 为什么受害者不告诉别人或寻求帮助？\n\n受害的循环持续下去是因为孩子感到害怕——害怕犯罪分子威胁的后果，也害怕会在父母、监护人或法律执法部门那里遇到麻烦。当孩子成为受害者时，他们已经做了一些可能会产生深层羞耻感和尴尬的事。犯罪分子还可能告诉他们，他们制作了儿童色情片并将因此受到起诉。此外，他们可能担心由于自己的行为导致手机或电脑的使用权被剥夺。\n\
  \n## 我如何保护我认识的年轻人？\n\n信息共享和开放的沟通渠道是最好的防御。年轻人需要知道这种犯罪正在发生，并理解风险隐藏在哪里。向你身边的孩子解释，人们在网络上可以假装成任何人或任何事物，在网上联系他们的网络陌生人可能怀有坏意，而且无论平台或应用程序如何声称，网络上没有任何东西会“消失”。如果他们拍了照片或视频，这些内容始终有公开的可能。\n\
  \n另一个关键因素是对孩子敞开大门，让他们知道可以来找你寻求帮助。让他们知道，你的第一反应将是提供帮助——永远如此。这些捕食者之所以强大是因为恐惧，而随着犯罪持续数天、数周和数月，受害者遭受的负面后果。\n\
  \n如果你是孩子信任并告知此类信息的成人，请安慰他们，帮助他们理解自己是犯罪的受害者，并帮助他们向执法部门报案。104\n\n## 如何与你的孩子谈论性勒索（Sextortion）\n\
  \nFBI 提供了以下建议，帮助父母和照护者与青少年及孩子讨论网络安全的话题。\n\n### “不要与陌生人交谈”的新版本\n\n- 当你在线上网时，是否有任何你不认识的人曾尝试联系你或与你交谈？\n\
  - 如果发生这种情况，你会做什么或会怎么做？\n- 你认为为什么有人会想在网上找一个孩子？\n- 你知道，在网络上假装成不是你的人很容易，而且并不是每个人都是好人。确保你屏蔽或忽略任何现实生活中你不认识的人发来的信息。\n\
  \n### 照片的力量\n\n- 你认识的人是否曾经发送过自己的照片，并导致照片在学校、团队或俱乐部中流传？\n- 当你给任何人发送照片时，可能会发生什么？\n\
  - 如果那张照片很丢脸怎么办？\n- 你能想到某人如何利用那种照片来对付一个人吗？\n\n### 我在这里提供帮助\n\n- 我今天读到一篇文章，关于孩子被迫向一个在网上认识的人发送他们身体的照片和视频。你听过任何类似的事情吗？\n\
  - 有时他们会受到威胁和骚扰——是很可怕的事情。\n- 你知道，如果你觉得发生了什么——无论是在网上还是私下——让你感到害怕、错误或超出了你的能力范围，我的首要考虑将是帮助你。你随时可以找我。105\n\
  \n#### 性勒索：让你的孩子读这一段\n\n\n\n\n\n# 什么是性勒索？\n\n性勒索（Sextortion）是一种发生在网络上的犯罪，指成年人说服未满\
  \ 18 岁的人分享性暗示图片或在网络摄像头前进行性行为。\n\n## 它是如何开始的？\n\n根据`FBI`的说法，性勒索可能发生在任何人们认识和交流的网站。当你在玩游戏时，有人可能会联系你，或者通过约会软件或你的某个社交媒体账号与你联系。\n\
  \n在某些情况下，犯罪分子第一次接触就是威胁。此人可能声称他们已经有了你的照片或视频，如果你不发送更多照片，他们就会分享。然而，更多情况下，这种犯罪始于年轻人认为自己正在与一个年龄相仿的人交流，而对方对建立关系感兴趣，或者正在提供某些有价值的东西。成年人可以使用威胁、礼物、金钱、奉承、谎言或其他方法来迫使青少年制作这些图像。\n\
  \n一旦犯罪分子获得了一段或多个视频或照片，他们就会利用分享或发布这些内容的威胁，迫使受害者产生更多图像。成年人只要向青少年索要一张裸骨图片，就构成了犯罪。\n\
  \n## 为什么年轻人愿意这样做？\n\n实施这种犯罪的人研究了如何接触和针对儿童及青少年。`FBI`因这种犯罪入狱的一个人是一个 40 多岁的男人，他曾担任青少年牧师，因此他可以学习青少年之间是如何交流的。然后，他创建了社交媒体账号，假装成一个少女。这个“女孩”会在网上开始和男孩聊天，并鼓励他们拍视频。\n\
  \n另一个人向他的受害者提供金钱和新的智能手机。在其中案例中，犯罪分子威胁一个女孩——说如果她不发送照片就会伤害她并炸掉她的学校。其他案例则始于提供货币或游戏积分，以换取一张快速的照片。\n\
  \n## 你如何知道网络上谁是可以信任的？\n\n这就是网络连接最困难的所在。`FBI`发现，实施这种犯罪的人可能拥有几十个不同的在线账号和个人资料，并同时与许多青少年交流——试图寻找受害者。\n\
  \n当你与现实生活中未见过的人在网上交谈时，务必极其小心。人们很容易想：我正用手机，在自己家里，能发生什么事呢？但你很快就能给犯罪分子提供他伤害你所需的信息和材料。\n\
  \n## 但这会如何伤害我？\n\n事实是这些犯罪分子通常不会在现实生活中孩子见面，但这种犯罪的受害者仍然会经历负面影响。犯罪分子可能会变得凶残，并在要求、骚扰和威胁上无停止。受害者报告感到恐惧、孤独、尴尬、焦虑和绝望。许多人觉得无处可。\n\
  \n## 如果这种情况发生在我身上该怎么办？\n\n如果你准备好了，请拨打`1-800-CALL-FBI` 联系`FBI`，或在`https://tips.fbi.gov`在线举报犯罪。`FBI`探员经常看到这些案件并帮助过数千名青少年。`FBI`希望停止骚扰，逮捕犯罪背后的人，并帮助你获得所需的支持。\n\
  \n如果你觉得还没准备好与`FBI`交谈，请去找另一个值得信任的成年人。告诉他们你正在遭受网络侵害并需要帮助。谈论这些可能觉得很困难，但有人可以提供帮助。你并不是那个遇到麻烦的人。\n\
  \n## 你怎么能说我不会遇到麻烦？\n\n犯法的人不是你。这种情况可能会让你感到非常困惑，犯罪分子正希望你因为感到太不确定、恐惧或羞愧而不敢告诉别人。即使这始于你还太小无法进入的应用程序或网站。即使你觉得制作某些内容并没问题。即使你接受了金钱、游戏积分或其他东西，你并不是遇到麻烦的人。性勒索是一种犯罪，因为成年人向未成年人索要、付费或强行要求裸骨图片是非法且错误的。\n\
  \n## 我如何帮助其他处于这种境遇的人？\n\n如果你发现朋友、同学或家庭成员正遭受侵害，请用善意和理解倾听他们。告诉他们你对这件事发生在他们身上感到遗憾，你想提供帮助。让他们知道他们犯罪的受害者，没有做错任何事。鼓励他们寻求帮助，看看你是否可以帮助他们识别一个可以告诉的信任成年人。\n\
  \n## 我如何保护自己和我的朋友？\n\n你们这一代可以是终结这些犯罪分子的一代。网络意识和理性的安全做法，加上寻求帮助的意愿，可以结束这种剥削。负责这些案件的`FBI`探员希望你了解以下六点：\n\
  \n*   对在网上分享的内容要保持谨慎。如果你的社交媒体账号对所有人开放，捕食者可能获取到很多关于你的信息。\n*   对你在网上第一次遇到的任何人都要保持警惕。屏蔽或忽略陌生人的信息。\n\
  *   意识到人们在网上可以假装成任何身份或任何人。视频和照片并不能证明某人就是他们声称的那个人。图像可以被篡改或盗取。\n*   如果你在某个游戏或应用上遇到某人，他们要求你在另一个平台上开始与他们交谈，请保持怀疑。\n\
  *   了解相关信息。你在网上创建的任何内容——无论是短信、照片还是视频——都可能被公开。一旦你发送了东西，你就无法对它后续的去向拥有控制权。\n*   乐于寻求帮助。如果你在网上收到看起来不对劲的消息或请求，请屏蔽发送者，向网站管理员举报该行为，或告诉成年人。\n\
  \n### 社交媒体意识\n\n| |\n|---|---|\n| 1 | 孩子理解现实朋友和虚拟朋友的区别。 |\n| 2 | 向你的孩子解释，不要向网络上的任何人透露姓名、地址、出生日期或电话号码。\
  \ |\n| 3 | 向你的孩子解释，不要向网上的陌生人发送自己的照片或视频。 |\n| 4 | 教导孩子不要回应恶意、侮辱或伤害性的信息或评论。 |\n| 5\
  \ | 对于较小的孩子，你应该确保他们的在线朋友和粉丝是你和孩子在现实生活中认识的人。 |\n| 6 | 设置第 12 章“阻止、删除、备份和恢复”推荐的反病毒程序和恶意软件删除程序将保护你们免受钓鱼攻击。向你的孩子解释点击发给他们的随机链接危险。\
  \ |\n| 7 | 与孩子约定规则，在没有你知情和监督的情况下，他们不能与在网上认识的人约见。 |\n\n\n\n\n\n由于你很可能购买或正在为孩子的手机、平板电脑或电脑支付每月服务费用，请帮助他们理解这些设备实际上属于你（父母），而不是属于他们。是你允许他们使用这些设备。因此，你有权拥有设备的解锁密码。让你的孩子为你提供解锁码，将它们记录下来并妥善保存。让他们明白，只要他们负责任地使用设备，你就会让他们拥有适当程度的隐私。然而，他们在使用设备时应该意识到，你可能会在任何时候决定查看这些设备。\n\
  \n如果他们更改了口密码，及时通知你是他们的责任。你还应该偶尔确认一下他们的密码，以防他们无意中更改了密码却忘记通知你。\n\n### 3. 练习更安全的浏览\n\
  \n除了第 8 章 ‒ 浏览中提到的建议外，如果你的家庭正在使用共享电脑，你应该为你自己和孩子设置独立的账户。独立的账户可以帮助保护你的文件和个人信息不被孩子访问（并可能被删除）。\n\
  \n在孩子的账户上，你可以调整其浏览器的设置，将其设置为“儿童安全（Child Safe）”或“儿童友好（Child Friendly）”限制。\n\n为孩子的在线账户使用密码管理器，以便在需要时你可以访问他们的在线活动。\n\
  \n### 4. 限制屏幕时间\n\n一个明智的习惯是不要让孩子在应该睡觉时，在无人监管的情况下将手机、平板电脑或笔记本电脑留在卧室里。在家里指定一个不同的地点让他们晚上给设备充电，而不是放在他们关的卧室门后。\n\
  \n随着你的孩子逐渐长大，他们需要在设备上完成更多作业，你可以根据需要决定对大孩子来说什么是合理且适当的。\n\n### 5. 社交媒体安全——待办事项\n\n\
  不要让孩子使用真实姓名作为用户名。这些信息让别人很容易在网上搜寻到他们的个人信息（包括位置）。让他们使用别名（例如：Ghost Pepper（名：Ghost，姓：Pepper））。\n\
  \n对于大多数网站来说，在个人资料中使用真实的出生日期并没有益处。重要的是，他们不要误导自己的真实年龄（一个 9 岁的孩子不应该说自己 12 岁，或者是 18\
  \ 岁），但考虑到对我们进行了如此大量的数据挖掘，并不是每个人都需要（或配得上）知道我们的真实细节。在保持出生年份准确的同时，我建议在社交媒体和其他非关键账户上将出生月份和日期改为其他容易记忆的日期（例如\
  \ 10 月 31 日万圣节）。对于学术、医疗和其他重要账户，你应该使用他们真实的、有价值的信息。\n\n你的孩子不应该在个人头像中使用自己的脸。让他们使用非个人的图像、图标或表情符号。这随机陌生人更难在网上搜到他们。\n\
  \n将他们的社交媒体设置设置为私密，让只有“朋友”才能看到他们的帖子。允许“朋友的朋友”联系他们是你做出的个人决定，取决于你对孩子能够负责任地管理社交媒体的信任程度。不要让他们的帖子被无限制的公众看到。\n\
  \n你自己要了解孩子使用的网站、软件、游戏和应用程序。\n\n检查他们的社交媒体和游戏个人资料以及帖子。就哪些话或分享是合适的与他们进行交流。\n\n### 6.\
  \ 如果你的孩子需要公开形象\n\n是否让你的孩子拥有面向公众的账户是你的个人决定。如果你的孩子出于任何原因需要公开形象（无论是为了学业、运动或其他兴趣），他们在任何平台上都应该维护两个完全独立的账户。\n\
  \n其中一个账户应该是他们的个人账户，并设置好上述详细的所有保护措施（包括别名用户名和不可识别的个人头像）。他们应该只与亲密的人圈分享个人账户，在他们他们可以做自己。\n\
  \n另一个账户是他们的面向公众的账户，他们分享的信息是经过仔细筛选的，提供了供大众查看的相关信息。他们应该在“谁可以进入个人账户”和“谁被拒绝”之间划一条坚硬的界限，因为某些陌生人（他们可能仍然能够追踪到你孩子的两个账户）可能会请求获得这两个账户的访问权限。与他们谈谈在个人形象和公众形象之间设定边界的重要性。\n\
  \n如果你的孩子已经只用一个账户进行个人和公开发布，让他们创建一个第二个私密账户，并仅邀请他们的亲密圈在那里连接。他们可以继续使用现有账户作为面向公众的账户。他们可能想要编辑或删除该账户中提供了过多个人信息的过去帖子。与他们一起查看帖子，以帮助决定哪些旧帖子适合继续向公众分享。\n\
  \n#### 国家性侵犯者公开查询网站\n\n作为预防措施，父母和监护人应该了解这个网站并进行检查，以意识到当地范围内是否有已注册的性犯罪者。\n\n该数据库由司法部协调，使公众能够搜索来自所有\
  \ 50 个州、哥伦比亚特区、波多黎各、关岛以及许多印第部落的最新信息，查询已知性犯罪者的身份和位置。你也可以通过链接搜索由各个司法辖区维护的注册网站。国家注册网站与州及部落注册网站中包含的信息是相同的，但国家注册网站允许跨司法辖区进行搜索。该注册网站地址为：\n\
  \n`https://www.fbi.gov/scams-and-safety/sex-offender-registry`\n\n![](img/00165.jpeg)\n\
  \n#### 针对年幼儿童的适龄教育\n\nFBI 提供了适合年龄的活动，向 3 至至 8 年级的儿童教授在线习惯，涵盖英语和西班牙语，地址如下：\n\n英文版：`https://sos.fbi.gov/en/`\n\
  \n西班牙语版：`https://sos.fbi.gov/es/`\n\n![](img/00166.jpeg)\n\n![](img/00167.jpeg)\n\
  \n\n\n\n\n[`maps.google.com`](https://maps.google.com)\n\n在 Google 地图中，输入您的家庭地址，然后点击屏幕上的人像图标进入街景模式。在街景模式中，查看您的家或汽车是否可以被识别。同时查看您或您的家人是否包含在照片中。如需请求模糊细节，请按照以下步骤操作：\n\
  \n1. 访问 `https://maps.google.com` 并输入您的家庭地址。为了说明此例，我们查看的是纽约市的一个随机位置。\n\n![](img/00168.jpeg)\n\
  \n2. 点击地图右下角的人像图标，这将显示 Google 街景中了哪些可用道路。\n\n![](img/00169.jpeg)\n\n3. Google 街景将打开。点击左上角的\
  \ `![](img/00104.jpeg)` 更多选项，并选择“报告问题”。\n\n![](img/00170.jpeg)\n\n4. 请求模糊您的房屋、汽车车牌或脸部。\n\
  \n![](img/00171.jpeg)\n\n您应该会立即收到 Google 已收到您请求的确认。 Google 表示他们将与您联系，告知他们采取的任何行动。几周后再次查看街景，看看他们是否已删除了您的图像。\n\
  \n![](img/00172.jpeg)\n\n### 第三方及 Google 贡献图像\n\n根据 Google 地图的隐私政策，Google 会自动模糊视频中的脸和车牌，但不会模糊照片。如果您在用户贡献中发现了自己的脸部、车牌或房屋，并希望删除该图像，请使用图像上的“报告问题”功能。[\\\
  [107\\]](#part0185.html#_ftn107)。该过程与上述 Google 的说明类似。\n\n### 手动从数据商处删除您的信息\n\n佛蒙特州的数据经纪人法于\
  \ 2019 年 1 月 1 日生效，该法监管数据经纪商，法律将其定义为收集并向第三方出售或许可与该业务没有建立直接关系的消费者的个人信息的公司。该法律要求数据经纪商每年向佛蒙特州州卿注册。为了让大家了解这项活动的普遍性，截至\
  \ 2020 年 11 月，佛蒙特州已有 277 家注册的数据经纪商[\\[108\\]](#part0185.html#_ftn108)，可以假设这些公司在全国甚至范围内都是活跃的。\n\
