  \n第 20 章 ‒ 将你的工作生活与个人生活分开\n\n第 21 章 – 求职搜索与职业工具\n\n识别 LinkedIn 上的销售机器人和虚假朋友\n\n\
  求职\n\n绕过筛选机器人\n\n第 22 章 – 在线会议这真的可以通过一封邮件解决\n\n会议组织者的安全步骤\n\n参会者的安全步骤\n\n避免哪些视频会议服务\n\
  \n保护你的会议录制\n\n\n\n\n公司的人资源部门是为了保护公司的，而不是为了保护你。当发生劳动纠纷时，人力资源部门最终会采取符合公司利益的行动，并降低公司的风险。如果你在解决过程中能得到良好的对待，那就再好。如果你不能得到你预期的那种对待，那么明智的做法是（提前）让自己处于个人风险最小的位置，包括确保你的个人数字生活井井有序且受你控制。\n\
  \n当我还是一个员工时，我并没有怎么想过要把公司配发的笔记本电脑和手机视为“我的”电脑和“我的”手机，这意味着我用它们处理工作和生活中的绝大多数事情。在浏览网页、写电子邮件或进行任何操作时，我总是很小心违反常识地使用它们，因为我知道公司会监控每个人的电脑使用情况。然而，我可能在处理个人事务方面使用的频率超过了审慎的范围。支付账单、收藏素食辣椒酱菜谱、检查\
  \ Facebook 或我的个人 Gmail 账户，都是我在办公时间期间抽空做的日常活动。当我离开一家公司时，我像其他人一样，尽职地交还了笔记本电脑和手机。幸运的是，因为我从未做过任何不当的事情，所以我无所畏惧。\n\
  \n另一方面，当我担任管理层时，我们曾面临过一项艰巨的任务：解雇一名因玩职职守和严重判断失误的员工。公司没收了那个人的笔记本电脑和手机，并让我们的 IT 人员筛选任何对公司感兴趣的文件或电子邮件。设备上的每一个文件，包括浏览器历史（而且非常详尽），都经过了审查，因为它们终究是公司的财产。\n\
  \n意识到自己处于雇主/雇员关系的哪一方非常重要，这样你才能相应地履行职责。\n\n### 使用独立设备\n如果可能的话，你应该尝试只将公司配发的电脑和/或手机用于你的工作职责，并使用另一部完全独立的电脑和手机（你合法拥有的）来处理所有其他事情。这是避免你这两个非常重要的世界交叉污染的最佳方法。你应该假设，你在公司配发的设备上所做的一切都会被公司监控，并进行备份和记录以备后参考。显然，购买一台个人使用的独立电脑、平板电脑、iPad\
  \ 或 Chromebook 是有成本的，但如果可能的话，这一重要步骤可以提供重要的个人保护。如果你无法拥有独立的电脑，请尝试使用你的个人手机进行个人活动、邮件和浏览。这不能保证隐私（尤其是当你使用个人设备连接公司\
  \ WiFi 时），但比完全不做要好得多。\n\n### 一切都在被监控\n你应该假设，你在连接到雇主网络（无论是现场还是远程）期间所做的一切都会被你的公司记录，并可以在公司的日志文件中检索到。\n\
  \n还要进一步意识到，你访问的网站可能无意中违反了公司的使用政策，因此持续的警惕和谨慎是明智的。\n\n此外，假设你进行的每一次击键和鼠标点击（即使在离线状态下）仍然被你的设备记录，监控数据将在你下次连接互联网时上传到公司的服务器。\n\
  \n### 公司设备上的数据属于你的雇主\n如果你没有将个人数据备份到你控制的地方，万一你被解雇或裁员，公司收回了设备，如果你的重要文档仅存在于该设备上，你可能会丢失它们。我还没有见过哪家公司会给予即将离开的员工时间（或持续的访问权限）来从设备中备份个人文件。\n\
  \n## 第 21 章 – 求职与职业工具\n\n### 识别 LinkedIn 上的销售机器人和假朋友\n不久前，我在我的 LinkedIn 简介上增加了一段数字诱饵，以测试我经常收到的“新朋友”邀请是由真人发送的还是自动机器人发送的。结果令人大开眼界。\n\
  \n我每天会收到一到几个邀请，其中大约一半来自三度人关系，这意味着他们不认识我，也不认识我在 LinkedIn 上联系的任何人。通常情况下，这些邀请不包含消息，只是一个连接请求，因此没有背景可言，而且我之前从未见过这些人。虽然我希望认为自己是一个超级有趣的人类，以至于世界各地的陌生人都向我涌来，但现实中，我不知道为什么来自中国、中东、非洲以及美国各地的随机陌生人会向我发送连接邀请。\n\
  \n越来越多的公司和销售人员在使用自动化程序扫描 LinkedIn 以寻找潜在客户。为了测试我的任何连接请求是否是自动化的，我在职业个人资料中的第一个名字前添加了一个表情符号图标。为了插入该图形，我使用手机上的\
  \ LinkedIn 应用 编辑了我的个人资料名称，这允许我使用带有表情符号的屏幕键盘。我选择了一个地球仪，因为，是的，我很有世俗眼光之类的。这看起来比啤酒杯或笑脸选项更合适。为了稳妥起见，我还在标题末尾添加了另一个表情符号——蓝色地图，看看这是否会被任何自动化工具捕捉。\n\
  \n很快，我收到的每 5 或 7 个新邀请中，就有大约 1 个内容类似于：“你好 Daniel Farber，我在 IT 行业工作，对建立联系感兴趣。你有兴趣吗？”\n\
  \n嗯……不。\n\n![](img/00178.jpeg)\n\n连接邀请没日一日地不断涌入。在我的名字开头添加表情符号告诉我哪些可以忽略，因为它们确实是冷启动电话。\n\
  \n### 求职\n通过在线资源找工作是非常困难的。LinkedIn、Indeed、ZipRecruiter、Monster 以及无数针对公司特定的招聘板提供了数以千计的“机会”，但很难判断哪些是真实的，哪些对你是有用的，哪些永远不会发生。\n\
  \n### 绕过筛选机器人\n\n\n\n\n最终，招聘决策将由活生生的人类做出，但要接触到他们，候选人必须经历一场通关算法的“华尔兹”。将筛选策略作为求职过程的一部分并不合理。我听过许多招聘顾问建议，候选人将特定职位发布中发现的关键词和短语织入提交给该特定公司的简历中，这是很有道理的。毕竟，招聘经理会将关键词输入筛选程序，以对收到的简历进行层层筛选。\n\
  \n我建议将这种定制化的方法再推进一步（实际上是再多走几步），不仅织入关键词（这需要大量时间来编辑和润色简历），而是将整个职位描述注入到你的定制化简历和求职信中。再次强调，目标是与真实的人类建立联系，这需要通过一个没有感情的算法，所以不要为战胜了一个机器人而感到太自自责。这就像是一场数字象棋游戏。\n\
  \n假设你的简历格式为 `Microsoft Word` 或类似的程序（在这些程序中你有提供详细格式设置的能力），如果你想跳过一些筛选机器人，请尝试以下步骤：\n\
  \n1. 复制整个职位发布文本（包括职位名称、职责和任职资格），并将其作为纯文本（不要换行符，使其成为一个长折行段落）粘贴在你的简历和求职信的底部（不是页脚）。\n\
  2. 将该额外文本更改为 1 号字体，并将颜色设置为白色，使其看起来不可见。通过将字体设置为 1 点，不应改变你的整体页面长度。如有必要，调整行间距。\n3.\
  \ 将你的简历和求职信重命名并保存为针对特定职位机会的 `PDF` 文件。你本质上是在文档中添加了自己版本的元数据，希望这些数据会被筛选程序识别为与该职位搜索匹配的关键词，并将你的申请加入待审核的短候选人名单。\n\
  4. 某些招聘网站可能会自动将简历和求职信上传到表单字段中。如果你的文档发生了这种情况，由于职位描述可能会出现在标准表单的最底部，但让我们假设，如果你是一个合格的候选人，人类招聘人员不会介意见面。他们可能只会认为这是一个格式错误。或者，他们可能会对你绕过他们筛选程序的机智感到印象深刻。这是无法预测的。无论如何，希望你已经实现了绕过筛选机器人的目标。\n\
  \n## 第 22 章 – 在线会议\n\n来自 `UrbanDictionary.com`：\n\n`Zoombomb` - 在他人的视频会议背景中进行愚蠢或恶剧的行为。可以联系对方进行\
  \ `z-bomb`。类似于“抢镜”（photo bombing）。起源于 `CoViD-19` 隔离时期，当时学校和雇主使用 `Zoom` 在家中进行课程和业务。\n\
  \n就像我们在第 4 章提到的与 `Zoom` 诈骗——`Email Safety` 一样，点击会议链接时要保持谨慎，并确认链接来自你信任的人。\n\n###\
  \ 这真的可以一封邮件解决\n\n既然世界很大范围内已经进入了虚拟化并在居家办公和学习，每天数百万计的视频通话让毫无防备的用户面临窥探、监视、骚扰、侵入和干扰的风险。随着时间的推移，由于破坏者开发出新方法来利用会议，名单将变得越来越长，因为员工花费越来越多的时间在那些其实可以通过邮件解决的视频通话上。\n\
  \n### 会议组织者的安全步骤\n\n为了获得最大的安全性和隐私，请考虑在你的视频通话习惯中增加以下部分或全部：\n\n#### 公共通话需要预注册\n如果你正在宣传公共视频通话或电话会议，不要在初始公告中包含会议链接。相反，要求用户注册，然后向已注册并经过审核的用户告知，你将在靠近会议日期和时间向他们发送直播会议链接，这将有助于控制你发布到外界的信息。\n\
  \n#### 使用临时会议 ID\n如果你是负责安排视频通话或电话会议的人，使用临时会议 ID 是最安全的。如果你使用账户的默认会议 ID，安全性较低（注：此处原文略有残缺，意指建议使用临时\
  \ ID 而非默认）。\n\n（此处后续翻译根据原文逻辑延续，由于原文后续段落较完整，以下为基于提供的文本内容翻译）\n\n\n\n\n\n有时，从会议参会者的环境中可以获取大小大小个人细节，范围从其物理位置的线索（如果可见窗户）、墙上或架子上的照片显示的家庭成员身份（包括他们的孩子），以及你可能不希望公众知道的特定细节。你可以在会议设置中选择虚拟背景，即遮盖你实际背景视图的图像。\n\
  \n![](img/00179.jpeg)\n\n这些是 Zoom 设置中提供的默认虚拟背景。\n\n其他平台也提供了类似的隐藏真实生活背景的方法。\n\n##\
  \ 隐藏你的个人资料和显示名称\n\n对于公共聊天，请考虑将显示名称更改为匿名内容。同样，你可能考虑从你的账户中删除个人头像。当你关闭摄像头时，某些会议平台会用你的个人头像代替你的实时画面。删除照片后，应该只显示黑色或空白屏幕，以保持你的匿名性。\n\
  \n### 应该避免哪些视频通话服务\n\nFirefox 浏览器的开发者 Mozilla 对 18 个视频通话应用在加密程度、安全性、隐私性、密码要求和漏洞管理方面进行了调查。在接受审查的\
  \ 15 家供应商中，有 3 家未能达到其最低标准，应予以避免。请记住，最低标准并不是高门槛，因此通过的另外 12 个应用具有不同程度的稳健性，但仍被 Mozilla\
  \ 认为是可靠的。\n\n未通过审查的三个应用（及其发行商）按字母顺序排序：\n\n*   Discord (Discord)\n*   Doxy.me (Doxy.me)\n\
  *   Houseparty (由 Epic Games 开发)\n\n符合 Mozilla 最低标准的 15 个应用（及其发行商）按字母顺序排序：\n\n*\
  \   BlueJeans (Verizon)\n*   Duo / Hangouts / Meet apps (Google)\n*   FaceTime (Apple)\n\
  *   Signal (Signal Technology Foundation)\n*   Jitsi Meet (8x8)\n*   Messenger /\
  \ Messenger Kids (Facebook)\n*   Skype (Microsoft)\n*   Teams (Microsoft)\n*   GoToMeeting\
  \ (LogMeIn)\n*   Webex (Cisco)\n*   WhatsApp (Facebook)\n*   Zoom (由 Zoom 开发)\n\n\
  ### 保护你的录制会议\n\n视频通话和会议电话通常会被录制，如果不小心，这既可能有帮助也可能危险。最安全的办法是将录制内容存储在计算机的硬盘上，而不是云端。2020\
  \ 年初，Zoom 出现过数据漏洞，导致某些通话被存储在流行的云服务中。黑客能够在这些服务中搜索使用 Zoom 标准命名规则的文件，并获得录制会议文件的访问权限。Zoom\
  \ 此后修复了该特定问题。黑客一直在积极寻找会议录制，因此那场事故是一个很好的提醒，让你将你的敏感文件安全地锁好。\n\nZoom 允许你限制只有通过你提供的密码进行身份验证的用户才能访问录制内容。分享完成后，关闭共享选项。如果你必须与他人分享录制内容或其他文件，`Google\
  \ Drive`、`SharePoint` 和 `OneDrive` 等云服务允许你设置特定的用户权限，规定谁可以访问、读取和编辑文件。你还可以禁用文件下载。\n\
  \n# 总结\n\n恭喜你读完这句话！希望这意味着你已经浏览了本指南的大部分内容——更希望的是，你已经采取了其中的某些步骤来保护你、你的亲人以及你的工作免受可能试图伤害你的在线攻击者的侵害。\n\
  \n我为你感到自豪。\n\n真的，我是真的！\n\n照顾你的数字生活在某些方面与照顾你的身体和家里相似。有些事情需要定期维护，而另一些事情应该每段时间检查一次。我希望你将在线安全和健康成为你自我护理的经常组成部分。阅读并遵循本指南是向这一持续方向迈出的巨大一步。我发自地高兴，有越来越多像你这样的人正在认真对待个人网络安全，因为这最终会让我们所有人以及我们关乎的人更加安全。\n\
  \nDaniel Farber Huang\n\n# 附录\n\n## 身份盗用恢复行动计划\n\n根据联邦贸易委员会（FTC）的说明，如果你的身份被盗，请立即采取以下行动步骤：\n\
  \n### 立即执行这些操作\n\n你正在处理税务、医疗或儿童身份盗用吗？查看：身份盗用的特殊表格\n\n#### 第 1 ：致电你知道发生欺诈的公司。\n\n\
  *   致电欺诈部门。解释有人盗取了你的身份。\n*   要求他们关闭或冻结账户。这样，除非你同意，否则没有人可以增加新的费用。\n*   更改你账户的登录名、密码和\
  \ PIN 码。\n\n#### 第 2 ：放置欺诈警告并获取信用报告。\n\n*   通过联系三家信用局之一来放置免费的、为期一年的欺诈警告。该公司必须通知另外两家。欺诈警告是免费的。它会让别人更难以你的名义开设新账户。当你的报告中有警告时，企业在以你的名义发放新信贷之前必须验证你的身份。你可以在一年后更新欺诈警告。你将收到来自每个信用局的信件。它将确认他们已在你的文件中放置了欺诈警告。\n\
  *   三家信用报告公司是：\n\n![](img/00175.jpeg)\n\n*   Equifax\n    *   `https://www.equifax.com/personal/`\n\
  \    *   电话：`800-685-1111`\n*   Experian\n    *   `https://www.experian.com/`\n\
  \    *   电话：`888-397-3742`\n*   Transunion\n    *   `https://www.transunion.com/`\n\
  \    *   电话：`888-909-8872`\n*   通过访问 `https://www.annualcreditreport.com/index.action`\
  \ 获取 Equifax、Experian 和 TransUnion 的信用报告。\n*   查看你的报告。记录下任何你不熟悉的账户。\n\n#### 第 3\
  \ ：向 FTC 报告身份盗用。\n\n*   在 `https://www.IdentityTheft.gov`（或拨打 `1-877-438-4338`）创建账户并提供你的信息。尽可能包含详细信息。根据这些信息将创建身份盗用报告和恢复计划。你的身份盗用报告向企业证明有人盗取了你的身份。它还保证了你的某些权利。\n\
  \n#### 第 4：向当地警察局报案。\n\n*   前往当地警察局，携带：\n    *   FTC 身份盗用报告副本\n    *   带照片的身份证\n\
  \    *   地址证明（贷款声明、租赁协议或公用事业账单）\n    *   你拥有的其他被盗证据（账单、IRS 通知等）\n*   告诉警察有人盗取了你的身份，你需要报案。\n\
  *   索要一份警局报告副本。你可能需要它来完成其他步骤。\n\n### 接下来做什么 - 开始修复损害\n\n关闭以你的名义开设的新账户。\n\n*   现在你有了\
  \ FTC 身份盗用报告，致电开设账户的各企业的欺诈部门。解释有人盗取了你的身份。要求企业关闭账户。\n*   要求企业向你发送一封信，确认：\n    * \
  \  该欺诈账户不是你的\n    *   你对其不负责\n    *   它已从你的信用报告中删除\n*   保留这封信。如果该账户以后出现在你的信用报告上，请使用它。\n\
  *   企业可能要求你向他们发送 FTC 身份盗用报告的副本或填写特殊的争议表格。\n*   记录下你联系了谁以及时间。\n\n移除你账户中的虚假费用。\n\n\
  *   致电各企业的欺诈部门。\n\n\n\n\n\n# 身份盗用应对措施\n\n* 解释有人盗取了你的身份。告诉他们哪些费用是欺诈性的。要求企业删除这些费用。\n\
  * 要求企业向你发一封信，确认他们已删除了这些欺诈费用。妥善这封信。如果该账户以后出现在你的信用报告上，请使用它。\n* 企业可能要求你向他们发送一份 `FTC\
  \ Identity Theft Report` 副本，或填写一份特殊的争议解决表格。\n* 记录下你联系了谁以及时间。\n\n## 纠正你的信用报告\n\n\
  * 给三家信用信局中的每一家都写信。附上你的 `FTC Identity Theft Report` 副本和身份证明（如姓名、地址和社会安全号码）。解释报告中的哪些信息是由于身份盗用导致的。要求他们屏蔽这些信息。\n\
  * `Equifax.com`\n    * `P.O. Box 105069, Atlanta, GA 30348-5069.` \n    * 电话：`1-800-525-6285`\n\
  * `Experian.com`\n    * `P.O. Box 9554, Allen, TX 75013.` \n    * 电话：`1-888-397-3742`\n\
  * `TransUnion.com, Fraud Victim Assistance Department`\n    * `P.O. Box 2000, Chester,\
  \ PA 19016.` \n    * 电话：`1-800-680-7289`\n\n* 如果有人盗取了你的身份，你有权从你的信用报告中删除欺诈性信息。这被称为“屏蔽”（blocking）。一旦信息被屏蔽，它就不会出现在你的信用报告上，公司也无法向你催收债务。如果你有\
  \ `FTC Identity Theft Report`，信用信局必须尊重你屏蔽这些信息的请求。\n* 如果你没有 `FTC Identity Theft Report`，你仍然对信用文件中的错误信息提出争议。这可能需要更长时间，并且不能保证信用信局一定会删除信息。\n\
  \n## 考虑添加长期欺诈警报或信用冻结\n\n长期欺诈警报和信用冻结可以帮助防止个人信息被进一步滥用。两者存在重要的区别。此表可以帮助你决定哪种适合你。\n\n\
  | 长期欺诈警报 | 信用冻结 |\n| :--- | --- |\n| 只要公司采取措施验证你的身份，你就可以访问自己的信用报告。 | 除非你解除或移除它，否则将停止对你信用报告的所有访问。\
  \ |\n| 免费放置和移除。在有人盗取你身份时可用。 | 免费放置和移除。任何人都可以使用。 |\n| 有效 7 年。 | 持续到你解除或移除为止。 |\n\
  | 通过联系三家信用信局来设置：报告有人盗取了你的身份。请求长期欺诈警报。填写任何必要的表格并发送 `FTC Identity Theft Report` 副本。\
  \ | 通过联系三家信用信局来设置。 |\n\n经常检视你的信用报告。\n\n## 其他可能的步骤\n\n根据你的情况，你可能需要采取额外的步骤。\n\n###\
  \ 举报被滥用的社会安全号码\n\n* 如果你的社会安全卡丢失或被盗，请办理补办。\n* 你认为有其他人在使用你的社会安全号码吗？在 `socialsecurity.gov/account`\
  \ 查看你的历史记录。\n* 停止催收员尝试催收。\n* 在 30 天内向催收员写信。\n* 发送你的 `FTC Identity Theft Report`\
  \ 副本及任何其他文件。\n* 联系发生盗窃的企业。\n* 要求信用信局屏蔽你的信息。\n* 提供你的身份证明。\n* 向法院申请声明你无罪的 `certificate\
  \ of clearance`（清白证明）。\n* 随身携带 `certificate of clearance`。\n* 联系你所在州的总检察长。\n* 询问你所在的州是否有\
  \ `identity theft passport`（一种你可以用来解决财务问题的工具）或其他针对身份盗用的帮助。如果你拿到了 `identity theft\
  \ passport`，请随时随身携带。\n* 考虑请辩护律师。美国律师协会可以帮你寻找律师。\n* 询问逮捕犯人的执法机构相关信息。\n* 向经纪人写信。要求他们从你的文件中删除错误。\n\
  * 政府颁发。\n\n## 特定账户的步骤\n\n对于某些类型的账户，你可能需要联系部门。\n\n### 公用事业\n\n* 如果有人利用你的信息办理电缆、电力、水或其他类似服务，请联系服务供应商。告诉他们有人盗取了你的身份。要求他们关闭账户。\n\
  * 如需额外帮助，请联系你所在州的公共委员会并解释情况。\n\n### 电话\n\n* 联系国家电信和公用事业交易所（NCTUE）并申请 `NCTUE Data\
  \ Report`。`NCTUE data report` 是交易所报告的所有电信、付费电视和公用事业账户记录，包括你的账户历史、欠费账户和客户服务申请。检查是否有任何你不熟悉的账户。\n\
  * [`https://www.nctue.com](https://www.nctue.com)`，电话：`1-866-349-5185`\n* 如果服务供应商未解决问题，请向联邦通信委员会投诉，电话为\
  \ `1-888-225-5322`。\n\n### 政府福利\n\n* 联系发放政府福利的机构并解释有人盗取了你的身份。询问你需要做什么来解决问题。\n* 如果你因身份盗用而停止领取福利，询问你需要做什么才能恢复福利。你可能需要面面或提交书面材料。\n\
  * 记录下你联系了谁以及时间。\n\n### 支票账户\n\n\n\n\n\n*   你是否认为有人用你的名义开了支票账户？申请一份免费的 `ChexSystems`\
  \ 报告，该报告汇总了有关你支票账户的信息。\n    *   要获取报告，请拨打 `1-800-428-9623` 联系 `ChexSystems`，或访问他们的网站。\n\
  *   然后联系每个开设新账户的金融机构。要求他们关闭这些账户。\n*   如果有人用你的账户开具坏票，请联系你的金融机构。要求他们停止对被盗支票的付款并关闭你的账户。要求他们向支票核实系统报告此盗窃行为。支票核实系统将通知企业拒绝被盗支票。\n\
  *   此外，联系任何接收坏票的商家。解释有人盗取了你的身份。在他们对你采取催收行动之前尽快行动。\n*   你还可以联系支票核实公司。报告你的支票被盗了。要求他们通知企业拒绝被盗支票。\n\
  \    *   `Telecheck` `1-800-710-9898`\n    *   `Certegy` `1-800-437-5120`\n*   如果商家拒绝了你的支票，请向商家寻求解释。商家必须告知你是什么信息导致他们拒绝了你的支票。\n\
  *   记录下你联系了谁以及何时。保留你寄送的任何信件的副本。\n\n### 学生贷款\n*   联系开设贷款的学校或项目。解释情况。要求他们关闭贷款，并向你寄一封信，说明你对该贷款不负责。\n\
  *   如果这是联邦学生贷款，请联系美国教育部监察长办公室（U.S. Department of Education Office of Inspector General）热线电话，电话为\
  \ `1-800-MISUSED` (`1-800-647-8733`)。\n*   如果这些步骤未能解决你的困境，请拨打 `1-877-557-2575` 或在线联系美国教育部联邦学生援助协调员（U.S.\
  \ Department of Education Federal Student Aid Ombudsman）。\n*   记录下你联系了谁以及何时。保留你寄送的任何信件的副本。\n\
  \n### 公寓或房屋租赁\n*   询问将物业租给身份盗窃者的房东使用的是哪种租户历史服务。联系这些公司。索要一份你的租户历史报告副本，并询问你需要采取哪些步骤来纠正报告中的欺诈信息。\n\
  \    *   什么是租户历史报告？有几家公司收集并出售有关租客的信息——例如租客逾期缴租的频率或租客是否曾被驱逐。如果有人以你的名义租了公寓，你将希望纠正租户历史报告中的任何错误。\n\
  *   记录下你联系了谁以及何时。保留你寄送的任何信件的副本。\n\n### 投资账户\n*   拨打你的经纪或账户经理，描述情况。\n*   记录下你联系了谁以及何时。保留你寄送的任何信件的副本。\n\
  \n### 以你名义申请的破产\n*   写信给破产地区的美国受托人（U.S. Trustee）。描述情况并提供你的身份证明。美国受托人计划（U.S. Trustee\
  \ Program）会将涉嫌破产欺诈的案件提交给美国检察官办公室（U.S. Attorney’s Office）进行起诉。美国受托人无法为你提供法律帮助，因此你可能需要聘佣律师。\n\
  *   考虑聘佣律师。美国律师会（American Bar Association）或当地法律服务提供商可以帮助你寻找律师。律师可以向法院说明该破产申请是欺诈。\n\
  *   记录下你联系了谁以及何时。保留你寄送的任何信件的副本。\n\n# 身份盗窃的特殊形式\n\n## 税务身份盗窃\n*   如果你在邮件中收到来自美国国税局（IRS）的通知，说有人使用了你的社会安全号码获取退税，请按照信中提供的说明操作。\n\
  *   通知是否说你从一个你不认识雇主那里获得了工资？向该雇主寄一封信，解释有人盗取了你的身份，且你不在该雇主处工作。\n*   填写 IRS 身份盗窃声明（`IRS\
  \ Identity Theft Affidavit`，`Form 14039`）。根据说明邮寄或传真该表格。\n*   提交纳税申报并缴纳你欠的所有税款。你可能需要邮寄纸质纳税表。\n\
  *   记录下你联系了谁以及何时。保留你寄送的任何信件的副本。\n*   如果这些步骤未能解决你的困境，请联系美国国税局（Internal Revenue Service），拨打\
  \ `1-800-908-4490` 获取专业协助。\n*   设置欺诈警报。联系三家贷局之一。该公司必须通知另外两家。\n    *   `Equifax`:\
  \ `https://www.equifax.com/personal/`, 电话：`800-685-1111`\n    *   `Experian`: `https://www.experian.com/`,\
  \ 电话：`888-EXPERIAN` (`888-397-3742`)\n    *   `Transunion`: `https://www.transunion.com/`,\
  \ 电话：`888-909-8872`\n*   从 `Equifax`、`Experian` 和 `Transunion` 获取免费信用报告。访问 [`https://www.annualreport.com`](https://www.annualreport.com)\
  \ 或拨打 `1-877-322-8228`。\n*   如果你发现任何欺诈账户，请遵循“后续步骤”中的说明操作。\n\n## 儿童身份盗窃\n*   是否有人利用你孩子的信息进行欺诈？联系发生欺诈的实体。\n\
  *   解释你的孩子是未成年人，无法签署合同。\n*   如果有人盗了你孩子的身份，请遵循“该做什么”中的步骤操作。\n*   记录下你联系了谁以及何时。\n\
  *   如果信用局有报告，请请求对其社会安全号码进行人工检索。\n*   申请免费信用冻结（也称为安全冻结），以防止他人以你孩子的名义开设新账户。分别联系每家信用局并遵循其说明。\n\
  *   是否有人使用你孩子的社会安全号码进行报税？填写 IRS 身份盗窃声明（`IRS Identity Theft Affidavit`，`Form 14039`）。根据说明邮寄或传真该表格。\n\
  *   如果这不能解决问题，请联系美国国税局（IRS），拨打 `1-800-908-4490` 获取专业协助。\n\n## 医疗身份盗窃\n*   如果你怀疑有人利用你的信息获取医疗服务，请获取你的医疗记录副本。\n\
  *   联系可能使用过你信息的每位医生、诊所、医院、药房、实验室和医疗计划。索要你的医疗记录副本。\n*   填写提供者的记录请求表并支付获取记录所需的费用。\n\
  *   查询你所在州的健康隐私法。某些州的法律让你更容易获取医疗记录副本。\n*   你的提供者是否为了保护身份盗窃者的隐私权而拒绝提供记录副本？你可以提出申诉。联系提供者《隐私惯例通知》（Notice\
  \ of Privacy Practices）中列出的人员、患者代表或协调员。解释情况并索要你的档案。\n*   如果提供者在收到书面请求后 30 天内拒绝提供记录，你可以向美国卫生与公众服务部民权利办公室（U.S.\
  \ Department of Health and Human Services Office for Civil Rights）投诉。\n*   审查你的医疗记录，并向你的医疗提供者报告任何错误。\n\
  *   写信给你的医疗提供者报告记录中的错误。附上显示该错误的医疗记录副本。说明为什么这是错误，以及如何纠正。\n\n\n\n\n\n* 附上您的 FTC 身份盗窃报告副本。\n\
  * 请通过挂号邮件寄送此信，并要求回执执证。\n* 您的医疗服务提供者应在 30 天内回复您的信件。要求提供者纠正错误，并通知其他记录中可能存在相同错误的医疗服务提供者。\n\
  * 通知您的健康保险公司。\n* 将您的 FTC 身份盗窃报告发送给健康保险公司的反欺部门。告知他们您医疗记录中的任何错误。\n* 如果您的信用报告上存在医疗账单错误，请按照“后续操作”下的步骤通知三家信用报告公司。\n\
  * 记录下您联系过的人和时间。保留您所发送的所有信件副本。\n\n# 致谢\n\n这本书（以及通往出版的多年准备工作）如果没有我的妻子 Theresa Menders\
