  \ 14 章——社交媒体谨慎。\n\n## 第 7 章 – 为什么你的隐私很重要\n\n你是否曾感觉自己正被监视？你确实在在线上被监控。\n\n个人信息对于公司、利益集团甚至整个政府来说具有极高价值，用以影响（有时是公然操纵）目标人群的支出、偏好，甚至是投票习惯。存在一个由咨询公司和数据分析师组成的整个行业，他们根据人的浏览活动、购买习惯、社交媒体活动、阅读习惯以及大量其他指标，为不同类型的人群开发非常具体的个人画像。\n\
  \n通过收集关于人们在线活动的海量数据，可以将目标受众细分为越来越小的群体。营销人员（广义上）通常尝试设计不同的、非常特定的信息，以与每个微定位小组产生最佳的共鸣。有时，这种微定位被用于鼓励特定的消费者购买更多牙膏或特定品牌的婴儿尿布。其他时候，其目标可能更具操纵性和恶意。\n\
  \n遗憾的是，在我们的现代世界中，虚假信息通过所谓的“计算宣传”（computational propaganda）很容易传播，这种手段利用算法、自动化和人为输入，在社交媒体上有意地发布误导性信息。这些宣传可能范围从政治辞令、半真半假到裸裸的谎言。在几小时、几天或几年针对目标受众的宣传数量之大，令人难以承受。某些信息可能微妙且细致，以便在目标受众的思维中植下想法或视角的种子。另一些信息可能极具挑动性，故意推动目标受众对另一个群体实施暴力。\n\
  \n根据牛津大学牛津互联网学院的说法，社交媒体被积极用作公共舆论操纵的工具，尽管方式多样且主题各异。在威权国家，社交媒体平台是社会控制的主要手段。在民主国家，社交媒体被积极用于计算宣传，无论是通过广泛的舆论操纵，还是针对特定人群的定向努力。[\\\
  [12\\]](#part0185.html#_ftn12)\n\n跟踪你的在线行为可以转化为他人口袋里的钱，但通常不是你的口袋。这就是为什么 `Google`、`Facebook`、`Twitter`\
  \ 以及许多其他公司价值数千亿美元的原因。对于许多公司来说，数据挖掘就是金矿开矿。\n\n`美国`和`欧盟`的消费者隐私法正在演变，这令人鼓舞，但公司对我们的个人数据仍拥有巨大的权力。\n\
  \n \n在接下来的章节中，我们将介绍保护隐私和数据的方法。\n\n \n在在此之前，花一点时间了解我们有多少的个人数据掌握在 `Google` 和 `Facebook`\
  \ 等公司手中是值得的。\n\n|\n\n#### 多少追踪才算过度？\n\n\n\n\n为了让你直观了解 Google 追踪了你多少个人信息和活动，你可以要求他们根据你的电子邮件地址为你提供一份关于你的所有信息的下载包。收到请求后，Google\
  \ 将向你发送下载链接以查看你的记录。\n\n最近，我通过他们的网站请求 Google 提供我的信息。他们让提交数据请求变得非常简单（说明在本章后续部分提供）。当我收到回复时，Google\
  \ 告诉我，在我提供的电子邮件账户所连接的 54 个服务或应用中，他们拥有我 1.3 TB（或 1,304 GB）的数据。\n\n![](img/00024.jpeg)\n\
  \nGoogle 仅通过一个邮箱账户就获取了关于我的 1.3 TB 的数据。由于他们的下载限制为每个文件 `2GB`，如果我想检索我的数据，我有 632 个文件等待逐一下载。我的电脑磁盘空间甚至不足以下载\
  \ Google 关于我的所有已知信息。\n\n1.3 TB 到底是什么概念？![](img/00025.jpeg)\n\n根据法律软件公司 `Digital\
  \ WarRoom` 的说法，为了直观对比，莎士比亚的所有文字作品只需要 5 兆字节（`5MB`）的存储空间即可存储。1 GB（TB 的 `1/1000`）大约可以存储\
  \ 15,000 多张图片、近 65,000 个 Microsoft Word 文件，或超过 100,000 封电子邮件。我这些我都做得很多，所以让我们用 Microsoft\
  \ Word 文件作为一个合理的中间估值。如果 Google 关于我有 `1.3TB` 的信息，那相当于 8400 万（即 `84,000,000`）份 Microsoft\
  \ Word 文件，涵盖了我的浏览习惯、购物习惯、社交媒体、照片、视频、电子邮件以及谁知道的其他信息。他们拥有有多久的历史我完全不知道。我甚至不记得我是什么时候开始测试那个\
  \ `Gmail` 账户的。我有多个邮箱账户，每个账户都有自己的历史存储在 Google 这个巨兽内部某处。更不用说 Facebook、Twitter 以及无数其他平台追踪的数据了。\n\
  \n我有一个很少使用的 Facebook 公账户。向 Facebook 请求我的数据显示，他们关于我很少使用的活动有 `401MB` 的数据。可以合理假设，Facebook\
  \ 可以轻松地对一个经常阅读、点赞、分享、评论和发布内容的活跃用户存储多倍的数据。\n\n### 查看你的数据被追踪了多少\n\n我在这次讨论中重点关注 Google\
