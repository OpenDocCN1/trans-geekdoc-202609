  \ xlek.com\n- zabasearch.com\n\n## 第 19 章 身份盗窃\n\n除了身份盗窃给受害者造成的财务损失外，情感、心理和身体伤害对目标受害者及其家人、朋友、同事、同学以及其他关系也可能是严重的。根据身份盗窃资源中心（Identity\
  \ Theft Resource Center，一家旨在支持身份盗窃受害者解决案件的非营利组织），“身份犯罪的情感影响让受害者对自己的处境产生了极其负面的情绪。”受访者表示，他们感到担心、愤怒和沮丧（各占\
  \ 85%）；感到被侵犯（83%）；感到无法信任他人并感到不安全（均占 69%）；感到无力或无助（67%）；感到悲伤或抑郁（59%）以及感到被背叛（55%）。\n\
  \n\n\n\n此外，该中心报告称：“负面情绪影响产生了非常真实的生理后果。”在受访者中，84% 的人报告了睡眠习惯问题；77% 的人报告压力水平增加；63 人有注意力不集的问题；56\
  \ 人有持续的酸痛、疼痛、头痛和/或抽筋，相同比例的人经历了胃部问题；54% 的人感到疲劳增加或精力下降，50% 的人报告他们对曾经喜欢的活动或爱好失去了兴趣。[\\\
  [109\\]](#part0185.html#_ftn109)\n\n### 这绝非一场无受害者的犯罪\n\n身份盗窃受害者可能会以多种方式受到伤害。当有人冒用你的名字和凭据时，他们可以：\n\
  \n**剥削你的信用。** 凭借你的 `Social Security number`，小偷可以轻易开设新账户，范围从信用卡、服务到抵押贷款以及个人和商业贷款。信用评分的受损还会导致汽车和房屋主保险等项目的保费更加贵。\n\
  \n**制造税收负担。** 如果有人在工作申请中使用你的 `SSN`，获取收入但不缴纳税款，负担将默认落到你身上。此外，小偷有时会以某人的名义提交虚假税表，骗巨额退税。等受害者发现政府向一个陌生人支付了非法款项时，钱已经消失了，留你独自来收拾造成的损害。\n\
  \n**损害你的职业前景。** `Fair Credit Reporting Act` 要求潜在雇主在获取招聘候选人的信用历史之前必须获得其书面同意。尽管某些州限制雇主将信用报告用于用人决策，但雇主对于是否聘用某人拥有完全裁量权。申请人的糟糕信用报告会影响潜在雇主的决定吗？有可能。雇主没有义务解释拒绝候选人的原因，因此你可能永远不知道信用不良是否是因素之一。\n\
  \n**伤害你的医疗健康。** 医疗身份盗窃是指他人盗取或使用你的个人信息获取医疗治疗，并在未经你授权的情况下提交虚假的医疗保险理赔。当他人的医疗治疗被错误地添加到你的健康记录时，医疗身份盗窃会干扰你的医疗护理。\n\
  \n**伤害你的孩子。** 身份身份盗窃发生在有人使用儿童的 `Social Security number` 实施欺诈，包括开设信用账户、贷款或申请政府福利或工作时。因为儿童通常拥有干净的信用记录，并且在年龄较大（如申请学生贷款）之前不会申请贷款，因此这种身份盗窃可能会持续多年。根据研究公司\
  \ `Javelin Strategy & Research` 的数据，2017 年超过 100 万儿童成为身份欺诈的受害者，导致了 26 亿美元的损失和家庭超过\
  \ 5.4 亿美元的自付成本。[\\[110\\]](#part0185.html#_ftn110)\n\n**消耗你的时间、金钱和精力。** 修复身份盗窃是一个费力、压力巨大且耗时的过程。你将投入的是你的劳动、压力和时间，还有那些帮助你解决这些问题的亲近的人。\n\
  \n### 那么，该怎么办？\n\n定期检查你的信用报告，至少每年一次。\n\n[`www.annualcreditreport.com/`](https://www.annualcreditreport.com/)\n\
  \n从 `Equifax`、`Experian` 和 `TransUnion` 获取你的免费信用报告。检查你的报告。记录下任何你不认识的账户或交易。这将帮助你向\
  \ `FTC` 和警方举报盗窃。\n\n![](img/00174.jpeg)\n\n**在你的信用报告上放置欺诈警报**\n\n通过联系三家信用局之一来放置免费的一期欺诈警报。该公司必须通知另外两家。欺诈警报是免费的。它会让别人很难以你的名义开设新账户。当你报告中带有警报时，企业在以你的名义发放新信用必须验证你的身份。你可以在一年后更新欺诈警报。你会收到每家信用局的一封信，信将确认他们已在你的文件中放置了欺诈警报。\n\
  \n![](img/00175.jpeg)\n\n[`www.equifax.com/personal/`](https://www.equifax.com/personal/)\n\
  \n电话：800-685-1111\n\n![](img/00176.jpeg) \n\n[`www.experian.com/`](https://www.experian.com/)\n\
  \n电话：888-EXPERIAN (888-397-3742)\n\n![](img/00177.jpeg)\n\n[`www.transunion.com/`](https://www.transunion.com/)\n\
  \n电话：888-909-8872\n\n**留意你收到的账单**\n\n在不断不断接收的信息流中，很容易让信用卡上的小额交易或模糊的经常性交易被忽略，而这些可能是更大犯罪的迹象。\n\
  \n**保护你的在线隐私。** \n\n如前几章中提到的。\n\n### 身份盗窃恢复步骤\n\n根据 `联邦贸易委员会 (FTC)` 的规定，如果你的身份被盗用，有一些需要立即采取的重要行动步骤。下方提供了这些步骤的总结。本书的附录中提供了更详细的行动计划，包含了要采取的步骤和要联系的机构。附录中的行动计划非常复杂，并提供了具体的说明来帮助你追回数据和身份。我真心希望你永远不需要使用它。\n\
  \n在这个极其简短的总结中，需要注意的是，为了找回身份，你可能需要采取许多有意义且耗时的个人行动。我希望这份清单强调了为什么我们提到的所有健康习惯不仅要被考虑，而且要付诸行动。\n\
  \n**如果身份被盗，立即执行以下操作：**\n\n1. 联系发生盗窃的公司。\n2. 放置欺诈警报并获取你的信用报告。\n3. 向 `FTC` 举报。\n4.\
  \ 向当地警察局报案。\n\n**后续操作——开始修复。**\n\n5. 关闭以你的名义开设的账户。\n6. 从你的账户中删除错误的费用。\n7. 修正你的信用报告。\n\
  8. 考虑添加信用冻结。\n9. 定期检查你的信用报告。\n\n**其他可能的步骤**\n\n10. 报告被滥用的 `Social Security number`。\n\
  11. 防止债务催收催收你不欠的债务。\n12. 更换政府颁发的证。\n13. 清除记录。\n\n对于某些类型的账户，你可能需要联系额外的机构。\n\n14.\
  \ 公用事业\n15. 电话\n16. 政府福利\n17. 支账户\n18. 学生贷款\n19. 租房\n20. 投资账户\n21. 以你名义申请的破产\n\n\
  **需要额外步骤的特殊身份盗窃形式**\n\n22. 税务身份盗窃\n23. 儿童身份盗窃\n24. 医疗身份盗窃\n\n# 第四部分 保护你的职业\n\n章节目录\n\
