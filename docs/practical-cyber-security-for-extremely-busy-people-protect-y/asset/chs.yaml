  \n\n\n\n\n安全问题是进行内部梗的绝佳平台。“你在哪个城市或小镇长大？”写出一个你喜欢的故事、快餐店，甚至是你喜欢的行星（如果你有的话）中某个遥远土地的名字。如果你喜欢，可以一直这样这样做。你可以在所有账户中对母亲的母姓使用同一个虚假答案。或者，如果你想做得格外、格外彻底，你可以在不同的账户上对该问题给出不同的答案，并将特定网站的回复保存在此类账户的密码管理器备注中。如果你能做到这种勤奋的程度，我愿为你点赞。\n\
  \n## 不要使用公共计算机\n\n如果你必须使用公共计算机（例如在 FedEx 办公点、酒店商务中心甚至是朋友的电脑上），在完成操作并离开之前，请执行以下这四个关键步骤：\n\
  \n1. 退出你正在使用的任何网站和账户。\n2. 删除你所使用的任何浏览器的完整历史记录。如果我使用的是真正的公共电脑，我会删除历史记录直到时间之初。如果我使用的是朋友的电脑，我会删除从我开始使用它为止的历史记录，以免给他们带来太多不便。\n\
  3. 删除电脑回收站中的所有内容。\n4. 重启电脑。\n\n## 第 6 章 – 双重身份验证\n\n### 双重身份验证 – 做回你自己\n\n越来越多的网站为用户提供了使用双重身份验证（有时称为\
  \ `2FA`）的选项，这要求用户在登录账户时，通过次要手段确认他们确实是经过授权的用户。二次验证的不同方法包括接收短信或可能是电子邮件。其他方法包括使用身份验证器应用，它会生成一个每分钟刷新一次的临时代码。其他物理身份验证器包括生成临时代码的数字钥匙扣，用户必须在物理上持有它才能使用，而不是让位于例如东欧或亚洲的犯罪分子使用。或者在托勒多。\n\
  \n这里有一条硬性规定：在任何你可以选择双重身份验证的地方，都要去用。无论你选择哪种方式——短信、电子邮件、身份验证器应用、钥匙扣或未来引入的任何其他聪明手段——`2FA`\
  \ 都是防止黑客和窃偷获取你账户权限的最佳方法之一。不仅包括你与金钱相关的账户（如银行或信用卡账户），还包括你用于购物、服务、信息和社交媒体的账户。\n\n创意窃偷不断开发新的骗局和诈骗手段，以从目标或其亲属关系人中窃取金钱或其他贵物品。直接盗窃的方法是获取实际账户信息并将资金转出账户、以受害者的名义贷款或信贷，或使用受害者的信用卡非法购买物品。\n\
  \n间接从受害者那里盗钱包括扮演目标的在线身份，并可能说服该目标的祖父母通过西联汇（Western Union）汇款，因为冒充者声称自己发生了车祸或被捕了。虽然人们认为人类的诈骗雷达会响起来，常识也能防止此类诈骗成功完成，但“请不要告诉爸爸妈妈”这句话非常有力量，可以操纵情感和其他有逻辑的思维。\n\
  \n双重身份验证是很好，但并非万无一失。这并不是因为技术无法胜任，而是因为过程中仍然涉及人类。虽然最先进的技术在纸面上可能运行良好，但以下是一个窃偷分子研究如何破解大脑而非算法的示例。\n\
  \n#### 美国银行的短信验证骗局\n\n“你好，[插入姓名]女士。这里是美国银行欺诈保护中心拨打。我们注意到您的借记卡上有些可疑活动，正与您联系以确认这些交易是否由本人操作。在我们开始之前，为了确认我们已联系到账户持有人，您稍后将收到一条来自美国银行的短信。请确认短信中的代码。”\n\
  \n随后，电话那头的骗子就这样绕过了美国银行的双重身份验证，并获得了访问权限。\n\n\n\n\n\n# 电脑与笔记本电脑\n# 手机与平板电脑\n\n## 第\
