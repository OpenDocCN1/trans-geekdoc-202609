  \n### 设备启动密码\n\n即使你 100% 在家工作，此时你可能可能是唯一可以访问自己电脑、平板电脑或手机的人，添加启动密码也是保护你的工作、数据和文件的最简单但最有效的步骤之一。许多计算机允许你设置仅四个或六个字符的密码，有时是简单的四位\
  \ PIN 码，但在这里使用更复杂的密码（遗憾的是，你必须记住它）付出这点微小的额外精力是值得的。\n\n指纹识别器和面部识别也是保护电脑的相当安全的方法。无论你选择哪种方案，这种初始安全层都可以防止针对你的更严重的攻击。\n\
  \n### 手机 \n\n在你的手机壳内部，写上你的名字和姓氏的首字母（例如，我会写成 Daniel H.），以及一个信任、可靠的家庭成员或朋友的电话，他们可以代表你接收短信。你可能还写上“如获有，”以及“请拨打或短信。”不要添加你的主邮箱地址，因为那被用来绕过你为保护账户而安装的任何双重身份验证（我们将在第\
  \ 6 章——双重身份验证中讨论这个主题）。如果你的手机丢失（实际上是丢失了，而不是留在车里或其他裤兜里），你可以立即锁定或远程删除其内容。你仍然可以让被擦除的设备返回，然后从云端重新安装你的数据（稍后会详细介绍）。\n\
  \n### 电脑和手机维修\n\n\n\n既然你已经检查了物理资产——你的电脑、手机以及所有昂贵的配件，那么需要考虑的下一层网络装甲就是你连接外部世界的方式。`WiFi`\
  \ 连接正在变得越来越快，家中的 `5G` 速度也已随处可用，让你能够更快速地阅读电子邮件，并可能更明显地（某些人认为更重要地）流式 Netflix 而无卡顿。\n\
  \n保护薄弱的 `WiFi` 信号也是黑客访问你计算机和移动设备的欢迎入口。更重要的是，其他类型的连接设备数量正在迅速增长，它们正渗透到我们日常生活的无数方面。这些智能设备种类多样，如监控摄像头、体脂秤、智能冰箱和灯光开关。这些以及其他类型的智能连接设备通常被归类为“物联网”。黑客和其他坏分子正在不断寻找渗透物联网设备的新方法。随着消费者不断向家和工作场所增加智能（或更智能）的设备，作乱或监视的新机会也随之增加。\n\
  \n#### 考虑执行这 7 个重要步骤\n\n以下是你为了保护 `WiFi` 免受入侵者而应该采取的 7 个关键步骤，其中某些可能已经为你设置好了。（不用担心，虽然一次比较耗费时间，但为了为你创造显著提升的保护，这是值得的。）\n\
  \n##### 修复最基础的设置\n\n取决于你向谁支付网络连接费用，访问无线路由的方法会有所不同。请搜索你的服务商查找说明，以进入路由器设置软件程序。\n\n\
  **网络名称。** 一旦进入，你将能够将路由器名称从默认值更改为自定义内容。你应该更改名称，因为默认名称可以为黑客提供有关你正在使用的路由器品牌和型号的信息，这有助于他们利用该类型设备的已知漏洞。你的新路由器名称也应该是匿名的，不要用你的家庭地址或任何让人明显看出该网络属于你的内容。[我侄女的\
  \ `WiFi` 名称是“FBI 监控车”，我觉得很有趣。]无论你给它起什么名字，都要确保陌生人不会将其与你或你的家人联系起来。\n\n**网络密码。** 我见过网络安全专家的演示，他们使用现成程序在几秒钟内就能破解\
  \ `WiFi` 密码。当我意识到这有多容易时，真的被吓了一大跳。拥有复杂的 `WiFi` 密码至关重要。这种密码在输入时应该长到让人心烦，因为它不需要频繁输入。\n\
  \n我将我的 `WiFi` 密码设置为路由器允许的最长字符串——64 个字符。诚然，这让我的妻子和孩子疯了大约三周，因为他们必须在笔记本电脑、手机和游戏上更新密码。但另一方面，我不得不处理无线打印机、监控摄像头、烟雾报警器和其他智能设备。这确实麻烦了一段时间，我也收到了很多抱怨，但说真的，我亲眼看到一个密码在几秒钟内被破解。\n\
  \n**路由器名称。** 如果你的路由器允许，将路由器登录名称更改为 `Admin` 以外的内容，这样黑客就很难判断。\n\n**路由器密码。** 无论你的登录名称是什么，务必将你的路由器密码从默认的\
  \ `Admin` 或预装的任何内容更改。让它变得长而易记。它不需要像你的 `WiFi` 密码那样疯狂长，但应该具有意义以增加破解难度。\n\n##### 开启路由器防火墙\n\
  \n大多数路由器都内置防火墙，但值得检查它是否开启。防火墙充当家庭网络和互联网之间的屏障，阻止未经授权的流量。登录路由器设置并寻找 `firewall` 部分以确保它已开启。\n\
  \n##### 设置 WPA2 加密\n\n`WPA2` 代表 WiFi 保护访问 2，它是目前保护 `WiFi` 网络的行业标准。在路由器设置中，寻找安全或加密选项并选择\
  \ `WPA2`。这确保了在你的网络上传输的数据经过加密，黑客更难拦截。\n\n##### 设置访客 WiFi\n\n如果你的路由器提供此功能，`Guest WiFi`\
  \ 允许访客使用你的互联网而无需让他们访问你的网络。如果客人的设备感染了恶意软件，这特别有用。设置一个与你的主密码不同的 `Guest WiFi` 密码。\n\n\
  ##### 设置自动更新\n\n检查路由器的固件是否由服务商自动更新，或者需要你手动设置。无论哪种，保持路由器更新都是重要的，因为随着新漏洞的发现，会有新的修复和补丁推出。\n\
  \n##### 定期重启路由器\n\n你可以通过路由器设置中的重启按钮、按住设备电源按钮或简单拔掉电源等一会儿后再插回来来重启路由器。我建议每月重启一两次，这将有助于自动更新并可能提高整体连接速度。\n\
  \n##### 将路由器移动到家里中心\n\n试图破解你家 `WiFi` 的骗子需要访问你的 `WiFi` 信号，因此你将 `WiFi` 信号集中在家里墙内越越好。`WiFi`\
  \ 信号从设备扩散出来就像石头掉进池塘产生的波纹。主要有两种类型的 `WiFi` 信号频率：`2.4GHz`（最常见）和较新的 `5GHz` 频率。`5GHz`\
  \ 频率更快，但范围比 `2.4GHz` 短。如果你家里周围有信号扩展器，请考虑它们的位置以及你的 `WiFi` 在墙外多容易被接收到。\n\n\n\n\n蓝牙是黑客可以利用的获取访问你设备和信息的另一种途径。使用蓝牙的最佳规则是：\n\
  \n不使用时关闭蓝牙。\n\n蓝牙用于耳机、导航、电子设备和物联网的免提技术提供了极大的便利，但也面临着重大的安全风险。某些蓝牙耳机和汽车免提套件的漏洞允许黑客将这些设备转变为移动窃听设备，让攻击者能够监听对话。\n\
  \n随着设备变得越来越复杂，蓝牙的新版本不断开发出来，每个版本对于精明的黑客来说自然会有一些新的、尚未被发现的漏洞，这些漏洞可能会暴露你、你的设备或数据。\n\n\
  蓝牙通常被营销为短距离信号，有效范围可能不会超过 30 到 50 英尺。实际上，通过信号放大器和增强天线（取决于黑客的水平），访问你设备的工作范围可以可以大得多。\n\
  \n以下是坏人利用蓝牙设备的某些方式。\n\n**BlueJacking（蓝牙劫持）** —— 一种蓝牙劫持，向目标设备发送垃圾广告或其他侵入。`BlueJackers`\
  \ 可能会冒充银行、电信公司或其他已知实体（如 `Amazon.com`）等信任实体，以诱骗目标点击链接或输入个人数据。\n\n**BlueSnarfing（蓝牙盗取）**\
  \ —— 比蓝牙劫持（向目标发送数据）更危险，`BlueSnarfing` 从目标设备中窃取数据，例如照片、电子邮件、短信或设备的唯一识别信息，这些信息可被用于更具危害的网络攻击。\n\
  \n**BlueBugging（蓝牙植后）** —— `BlueBuggers` 在受害者的手机或笔记本电脑中植后门，允许他们访问设备以监视目标的活动。黑客可能在社交媒体或在线银行上冒充受害者。\n\
  \n**BlueSmacking（蓝牙攻击）** —— `BlueSmackers` 通过向受害者的设备发送过多信息使其过载，导致设备无法运行。通常这可以通过重启目标设备来解决。[3]\n\
  \n### 保护你的 Apple AirDrop\n\nApple 的 `AirDrop` 将你的手机变成蓝牙外设，这可能允许附近的未授权个人（即：变态者、黑客、捣事者）匿名与你连接。捣事者已使用\
  \ `AirDrop` 向附近的设备发送不受欢迎和/或令人反感的图片。当你没有主动使用 `AirDrop` 时，你应该禁用 `AirDrop` 或仅允许“我的联系人”找到你。\n\
  \n以下是你为了减少遭受蓝牙攻击的风险而应该采取的三个步骤。\n\n1. **升级你的设备。** 多年来已经出现了许多蓝牙版本，从蓝牙版本 1.0、1.1、1.2、2、2.1、3+、4\
  \ 以及最新的版本 5（于 2016 年引入）。所有版本对于精明的黑客来说都有自己的安全弱点。如果你有超过四年的设备（并且很可能运行较旧的蓝牙版本），将它们淘汰并更换为使用蓝牙\
  \ 5 的新设备是一个好主意。\n2. **更改默认 PIN 码。** 耳机的 PIN 码（几乎）总是“0000”，这为打开了攻击之门。尽可能在你的蓝牙设备上将默认\
  \ PIN 码更改为难以猜测的内容。\n3. **将其关闭。** 再次，防止蓝牙利用最安全的方法是在不使用时保持关闭。\n\n## 第 4 章 – 电子邮件安全\n\
  \n根据在线安全公司 `Retuster` 的数据，截至 2019 年，钓鱼攻击占数据泄露的 90%。此外，15% 成功被钓鱼的人在一年内至少被针对过一次。2019\
  \ 年，钓鱼尝试较较上一年增长了 65%。根据 `Verizon` 的数据，30% 的钓鱼信息会被目标用户打开.[4]\n\n### 钓鱼\n\n钓鱼攻击是一种宽泛的、撒网式的诈骗手段。它并不复杂，但在向成千上万人发送信息时仍然有效。钓鱼是指诈骗者发送伪装成信誉良好的公司的电子邮件，试图让收件者（称为\
  \ Mark）点击恶意链接或泄露个人信息，如密码或信用卡信息。我们都收到过这些邮件，无论是来自虚假的 `Ebay`、虚假的 `Paypal`、虚假的 `Apple`\
  \ 或其他虚假公司，告知我们需要更新密码，或者某项购买（我们并未进行）已获批准，或者是这些主题的无尽变体。\n\n各种类型的个人或组织电子邮件列表（如公司、学校，甚至警察局）在黑市以及合法市场上都很容易购买。通常，钓鱼链接会将毫无防备的受害者引导至真实公司的克隆网站，受害者在认为以某种方式保护自己的情况下提供信息。实际上，他们正在直接将宝贵的数据提供给坏人。\n\
  \n其他钓鱼诈骗会将受害者引导至 `Google Forms`，目标会被要求输入信息，认为这将用于合法用途。\n\n除非你真的有一个尼日利亚王子的亲戚，否则对收到的所有未经请求的邮件保持怀疑。\n\
  \n### 快讯：尼日利亚王子禁用了自动更正\n\n之所以这么多尼日利亚王子/近期的寡妇/流亡政裁者的诈骗邮件写得糟糕、充满拼写错误和语法错误是有正原因的。根据\
  \ `Steven D. Levitt` 和 `Stephen J. Dubner` 在他们的书籍《思考 Freak[5]》（他们广受欢迎书籍《趣味经济学》的后续）中提到，发送钓鱼邮件很容易，但实际上要通过长线骗让受害者与其金钱分离需要时间，有时甚至是几周或几个月。企业典型的销售漏斗如下：\n\
  \n1. 潜在客户\n2. 销售电话\n3. 跟进\n4. 转化\n5. 成交\n\n\n\n\n\n钓鱼诈骗也无异。在这种情况下，`Leads`（潜在客户）是初始邮件列表。`Sales\
  \ Calls`（销售电话）是初始邮件（“你好，亲爱的，祝福……”），`Follow-up`（跟进）是诈骗者希望与目标进行的初始回复和调侃，`Conversion`（转化）是讲述关于提供无法想象的财富的故事，而\
  \ `Sale`（成交）则是受害者汇出数千美元（或更多）以确保承诺的交易，而这笔交易 ‒ 随时可能发生 ‒ 本应该导致数百万美元作为介绍人费或佣金发送给目标。\n\
  \n现在，绝大多数收到这些邮件的人都会因为知道这是骗局而立即将其置之脑后。但仍有一部分人可能会被吸引并回应。（遗憾的是，我个人认识一位老老妇，她曾准备把她微薄但珍贵的退休金寄给其中一个骗局。幸运的是，她勤奋的儿子及时干预，防止了灾难的发生。干得，安德鲁！）\n\
  \n诈骗者在转化潜在受害者上花费的时间越长，而对方在过程中某个时刻清醒过来并未能达成交易（即没有被上当），诈骗者浪费的时间、能量和资源就越多，而这些资源如果集中在更容易的目标上本会有更高的效率。根据列维特（Levitt）和杜布纳（Dubner）的说法，诈骗者将时间浪费在了“假阳性”上，即那些最初看起来可能是客户（通过回复诈骗者）但最终没有付费的人。在转化过程的某个地方他们清醒了并意识到这是不合法的。与其在下游识别这些假阳性，对诈骗者的最佳利益是尽早消除他们。这就是那封粗糙的邮件证明了它的价值。许多人会立即拒绝封来自尼日利亚皇室寻求合作伙伴的、写得良好且精美的邮件。而带有拼写错误和语法错误的邮件会吓走那些最初可能好奇但不太可能一路被骗到成交的目标。那封粗糙的推销邮件只会让最轻信的人产生信誉，而这些人恰恰是诈骗者正在寻找的目标。写得糟糕的邮件是一种自我过滤机制，可以剔掉那些烦人的、不产生利润的假阳性。保持怀疑。做一个假阳性吧。\n\
  \n### 鱼叉式钓鱼\n\n鱼叉式钓鱼针对特定的个人、组织或企业。鱼叉式钓鱼不是采取大撒网式的方法发送数千封通用邮件，而是要求诈骗者对目标进行某种程度的研究和侦察。\n\
  \n#### 诈骗渴望讨好的员工\n\n“你今天上班吗？”我老板发来的邮件写道。\n\n“是的，我在。进展怎么样？”我回答道。\n\n“你需要尽快帮我个忙，”简短的回复来了。\n\
  \n“没问题，你需要什么？”\n\n“你需要买 10 张 100 美元的礼品卡，并立即把卡号邮件给我。”\n\n什么鬼？这是一个很奇怪的要求，虽然对于我当时的老板来说完全不合常理。也许他想把这些送给客户作为礼物。我的老板是一个小企业主，容易迸发灵感和狂热。这可能是他的另一个心仪项目的现实实现。然而，在仔细检查邮件后，我发现发送者的邮箱看起来像我老板的正式工作邮箱，但点击详情后显示它实际上来自另一个账户。这是一个试图诈骗\
  \ 1000 美元的冒充者。坏种蛋。\n\n我们当时的公司网站列出了我们小团队的姓名和职位。通过在线搜索很容易找到老板的真实邮箱。然后，使用相同的格式（`名字首字母\
  \ + 完整的姓氏 @ companyname.com`），那个潜在的窃偷给我发了邮件，伪装成急需礼品卡的老板。同一个窃偷在接下来的几周里对其他员工尝试了同样的诈骗，希望欺骗一个努力迎合老板的、渴望讨好的员工。幸运的是，没有人上当，但我确定这在其他地方起过作用，否则那些小偷不会一直尝试下去。\n\
  \n在另一个案例中，在另一家公司（为了讨论我称之为“Keystone”），一个攻击者访问了供应商的邮箱，并静静地拦截了与 Keystone 应付账款人员（即负责开支票或向供应商发送\
  \ ACH 电子付款的人）的实际邮件对话。诈骗者能够看到与 Keystone 的邮件历史记录，包括数万美元的大额频繁采购订单。他们的第一个行动是获取一封关于待处理发票的邮件对话（诈骗者能够从之前的邮件中获知准确金额），并将邮件链转发到一个虚假邮箱，该邮箱看起来像供应商的，但只是在字母上做了细微更改，除非你专门寻找，否则很难察觉。\n\
  \n使用这个假邮箱地址，诈骗者继续与 Keystone 的应付账款人员进行友好的互动。“周五快乐，祝你有一个快的周末！”等等。然后，诈骗者很快发送了他们的发票，以及\
  \ ‒ 当然 ‒ 指向“修订”账户的付款说明。\n\nKeystone 是一家精简运营的小公司，员工很少。员工经常从目前的办公室职位调整，承担额外的职责以填补人员短缺。在这种情况下，应付账款人员在该职位上相当新，幸运的是，她问了：“我如何更改供应商的银行账户？”\n\
  \n“为什么”是 Keystone 财务经理的逻辑回答。经过审查，在向虚假账户支付任何欺诈发票资金之前，诈骗被发现了。回想那段跨越约 2 周的邮件对话，看到诈骗者是如何潜入邮件的，而真正的供应商应收账款人员完全不知道发生了什么，非常有意思。Keystone\
  \ 通知了供应商有人冒充他们的应收账款人员。如果诈骗者正试图欺骗 Keystone，他们很可能对供应商的其他客户也做了同样的事情。\n\n在某些方面，进行骗局就像制造钻石。在正确的位置投入足够的时间和压力，一块碳（在这种情况下，是一个毫无防备的客户）可以变成极具利润的报酬。在这种场景中，在访问供应商的邮箱后，诈骗者在玩弄\
  \ Keystone 上花费的时间精精力（阅读邮件历史记录然后转移对话）与数万美元的潜在报酬相比是是微不足道的。而供应商有数百个客户，所有人都已准备好成为目标。对于诈骗者来说，这是一个数字游戏，只需要击中一两个目标就值得且有利可图了。\n\
  \n上述主题的变体是，诈骗者访问了公司的邮箱，试图劫持已经发送给客户的发票付款（而不是像上面的情况那样开具假发票）。我的一些客户的应付账款部门收到过冒充者邮件（也称为“身份欺骗”），伪装成供应商的诈骗者写道：“我们的银行在未来几天内进行年度审计，所以我需要你向我们的其他应收账户汇款。这里是汇款详情……”\n\
  \n幸运的是，我也抓到了那一个。通过这个快速增长的客户合作，我们立即建立了标准的财务操作程序，要求在输入或修改任何供应商详情（包括银行账户信息）之前进行多重安全措施和审批。\n\
  \n以下是另一个真实案例，一个毫无防备的个人邮箱被黑，其联系人被索要钱财……\n\n\n\n\n当我搜索自己的邮件寻找网络钓鱼案例时，我遇到了一封来自一位极少联系的人的信息，在本文讨论中我称他为\
  \ Barney。为了隐私起见，身份信息和电子邮箱地址已过脱敏。\n\n![](img/00009.jpeg) \n\n由于我们并不经常交流，Barney 邮件中的紧迫感立刻提醒我这是网络钓鱼或其他诈骗，于是我查看了发件人的姓名和邮箱地址。当我点击查看详情时，与我文件中记录的\
  \ Barney 的联系信息相比，两者看起来都是合法的。通常伪造邮件一眼就能看出来，但此处的细节显示的是同一个 `comcast.net` 账户。![](img/00010.jpeg)\
  \ \n\n为了进一步探测，我点击了“回复”查看邮件将发送到哪里，发现它被导向了一个 `outlook.com` 账户，而不是显示的 `comcast.net`\
  \ 账户。它使用了与 Barney 相同的姓名格式，但发送到了不同的邮箱服务（`outlook.com`）。这是一个相当巧妙的误导，成功伪造了第一层身份识别。![](img/00011.jpeg)\
  \ \n\n我给受害者 Barney 打了电话，提醒他有人冒充他。他已经意识到了这一点，并告诉我黑客侵入了他的邮箱账户，将上述信息发送给了他可能存在的整个联系人列表，然后（这是一个既具有破坏性又极其卑劣的行为）删除了受害者整个超过\
  \ 1000 人的联系人列表，导致他无法通知联系人其账户被盗，无法告知他并未处于困境或需要紧急资金。Comcast 无法为他找回联系人列表，他只能自认倒霉。\n\
  \n据 Barney 所说，诈骗者位于尼日尔，这是通过他律师女儿的研究发现的。幸运的是，Barney 没有在其他账户上使用他的邮箱密码，这限制了黑客可能对他造成的潜在损害。他更改了邮箱密码，根据\
  \ Comcast 的说法，这会自动注销他所有已登录的邮箱账户。希望这防止诈骗者进一步在他的邮箱中操作。然而，最初的损害已经造成，误导性邮件已经发给了 Barney\
  \ 广谱的联系人。\n\nBarney 说，他的联系人中有一个出于立刻担心回复了那封假邮件，诈骗者随后为那位担心的朋友提供了一个可以拨打的电话。那位朋友确实拨了电话。电话那头的人听到真的来电显得非常兴奋，那位朋友立刻产生了怀疑并挂断了电话。然后他直接打了\
  \ Barney 的电话，意识到这是一个骗局。\n\n如果让我给上述尝试打分，我会给诈骗者一一两分，因为他们在掩盖伪造邮箱地址方面做得不错，至少在通过第一层审查时是如此。通常你可以点击查看邮件发件人的详情，重定向很容易被发现，但我确定这种方法随着时间的推移，会被更狡猾、更复杂的身份掩盖方法所取代。在这里，`outlook.com`\
  \ 邮箱在用户点击回复之前是被隐藏的，点击后才会显示得更清晰，但这仍然需要目标收件者进行更仔细的观察。\n\n如果我要做这种恶劣的事情，我会采取稍微缓慢的方法来热身目标。首先，为了让这更具可信度，诈骗者可以很容易建立他们自己的\
  \ `comcast` 账户，并创建一个与 Barney 极其相似的名字。例如，将字母 `n` 改为 `m`，或将小写的 `i` 改为小写的 `l`，或者用大写字母\
  \ `O` 代替数字 `0`。其次，我不会向整个列表发送紧急信息，而是会考虑温和地切入。与其立即寻求帮助，或许先发条信息说：“嘿，希望你一切都好。前几天我想起了你，所以只是想来打个招呼。”然后看看谁会回复“谢谢，你也是！”或任何类似的无害的回复。或者其变体。然后根据诈骗者希望实施的任何骗局来利用目标。\n\
  \n我详细列出上述替代方案，并不是因为我在建议你考虑做这些事（我想在这里明确说明：千万不要做这些事！），而是我希望当你在收件箱中收到略显奇怪或可疑的邮件时，它们能引起你的共鸣。如果你还没有被这些邮件淹没，将来某个时刻肯定会收到。\n\
  \n### 大鲸式钓鱼 (Whaling)\n\n大鲸式攻击鱼就像鱼叉式钓鱼，但针对的是更昂贵的邮区。虽然鱼叉式钓鱼通常针对个人，但大鲸式攻击针对的是高层高管。\n\
  \n#### 西捷发布了 10,000 名员工的 W-2 表格副本\n\n在 2016 年，数据技术巨头西捷（Seagate）的人力部门收到一封似乎来自公司 CEO\
  \ Stephen Luczo 的邮件。邮件要求提供员工 2015 年的 W-2 表格和其他个人信息，包括姓名、社会安全号码、收入和家庭地址。人力部门尽职尽责地完成了请求，导致数据直接发送给了网络犯罪分子。\n\
  \n#### Snapchat 交出工资信息\n\nSnapchat 对网络攻击并不陌生，但在 2016 年，该社交媒体平台再次成为数据泄露中心，因为一名员工被骗交了工资信息。在这次攻击中，工资团队的成员收到一封自称来自\
  \ Snapchat CEO 的邮件。\n\n#### FACC CEO 在向诈骗者转账 500 万美元后失职\n\nFACC 是一家利的飞机制造公司，客户包括波音和空客。2016\
  \ 年，由于该公司是一次成功的大鲸式攻击的受害者，导致财务部门向诈骗者转账了 500 万美元。虽然攻击的完整细节从未公开，FACC 的 CEO 被解雇，因为他“严重违反了职责”，随后首席财务官也被解雇了。\n\
  \n### 恐惧软件 (Fearware) —— 欢迎来到新世界\n\n新冠、气候变化、政治选举以及任何其他热点事件都为不法分子提供了利用人们担忧情绪的巨大机会。正如新冠病毒肺炎在全球范围内传播一样，成千上万的虚假网站出现，带有虚假信息、钓鱼诈骗、产品优惠或三者的结合。\n\
  \n根据网络安全公司 Zscaler 的数据，在新冠疫情爆发初期（2020 年 1 月至 4 月），创建了 30,000 个可疑的与新冠相关的新域名（NRDs）。这些可疑域名的关键词包含了与新冠常见的词汇，如测试、口罩、武汉、药包等。\n\
  \n\n\n无辜的受害者，例如通过添加类似这种流行的 CAPTCHA（验证码）功能来掩盖他们的在线诈骗。\n\n在消费者端，Zscaler 识别了一些索要个人信息的电子邮件，声称帮助个人获得政府刺激资金或用于与新冠相关的慈善事业。\n\
  \n由于有许多人居家办公，对 VPN 安全的需求随之增长，猜猜坏家伙做了什么。Zscaler 报告说，一些网络分子开发了虚假的 VPN 软件，意在伪装成法的 VPN\
  \ 客户端欺骗用户下载并安装更多的恶意软件。\n\n一个假装追踪冠病毒并提醒用户附近 COVID-19 患者的虚假移动应用程序实际上是勒索软件，旨在锁定受害者的手机并要求付款以解锁设备[7\n\
  \n另一个虚假的新冠应用承诺在用户安装其应用后向他们发送“新冠病毒安全口罩”，但在安装后，该应用搜索了用户的联系人。随后，该应用向联系人列表发送了口罩信息，并从那里继续指数级传播。在安装时，该应用必须请求用户权限读取联系人并发送短信。Zscaler\
  \ 在其博客中写道：“这是用户立即丢弃该应用的巨大警信号。”[8\n\n包含 COVID-19 数据但嵌入隐藏恶意软件的恶意文档（如 Excel 表格和 PowerPoint\
  \ 演示文稿）也很流行。来自约翰·霍普金斯大学的附带 Excel 文档的假邮件标题为“WHO COVID-19 情况报告”，但将包含在毫无防备的受害者计算机上安装远程桌面访问的代码[9\n\
  \n## 恐惧软件 – 来自来自人力资源部的消息\n\n新冠肺炎期间发生的一种特别残忍的诈骗是“你被解雇了”诈骗。根据网络安全公司 Abnormal Security\
  \ 2020 年 4 月 21 日的一篇博客文章，一些诈骗者正在发送看似来自人力资源部门的电子邮件，坚持收件人参加一个 `Zoom` 会议（当然是几分钟后），目的是讨论“合同暂停/终止试用”。\n\
  \n发者的电子邮件看起来像是来自 `Zoom` 客户服务。邮件正文如下：\n\n在 Zoom 上与 [公司名称] 团队的会议提醒！\n\n此提醒您与人力资源和薪资管理负责人的\
  \ `zoom` 会议将在几分钟后开始。您的出席对这次会议至关重要，对于开始第一季度绩效评估会议也是同样需要的。\n\n邮件方便地提供了“加入此直播会议”的链接，这会将恐慌的收件人引导到一个虚假但可信的\
  \ `Zoom` 网站，收件人在假网站上输入其 `Zoom` 凭据，从而暴露登录详情。接下来，黑客就可以登录受害者真实的 `Zoom` 账户并获取存储在那里的任何其他信息。Abnormal\
  \ Security 估计这次钓鱼尝试发送给了 50,000 多收件人[10\n\n### 不要被网络钓鱼者上当\n\n以下是你可以采取的一些采取措施，以增强你应对敌对或恶意攻击者的电子邮件韧性。\n\
  \n### 这听起来很奇怪吗？\n\n在你的网络生活中，过度的怀疑精神是一种健康的习惯。对任何要求你快速且意外执行某事的消息保持警惕。如果信息来自你认识的人，给他们发短信或拨打电话以确认是否真的是他们在要求。你也可以用借口，“与其来回发邮件，我想既然你说很急，我觉得这样更快。”如果真的是他们，你应该因为反应迅速而受到表扬。如果不是他们，你应该因为在诈骗变成危机之前发现了它而受到表扬。\n\
  \n下一句已经被说了几百万次，可能几十亿次，但总是被忽视。警惕任何听起来好得不可谱的事物。简单来说，无论一个人在那一刻对更多钱、更轻体重、更好的外、更好的浪漫伴侣或其他任何事情感到多么绝望。（面对现实吧，你的生活并没有糟糕到真的你真的需要点击一个发送给你的、提供问题简单答案的随机链接。这是一件好事！\U0001F60A\
  ）\n\n即使它听起来确实好得不可谱，也不要点击那个链接。\n\n### 报告并删除可疑电子邮件\n\n如果你在工作邮箱账户上收到可疑邮件，你应该联系你公司的\
  \ IT 部门并告知他们，询问他们是否希望你将该可疑邮件转发给他们审核。向公司适当的相关人员对可疑的、潜在破坏性的邮件发出警报是非常重要的，因为如果你正成为目标，你的同事也可能成为目标。而且他们可能没有你那么勤勉。\n\
  \n删除可疑邮件保护的是你个人，而报告邮件则保护了你组织中的其他人。\n\n### 幸运的是，最明显的垃圾邮件会自动筛选\n\n内置的垃圾邮件过滤器擅长捕捉最明显的垃圾（包括我似乎被吸引的“快速减肥”、“在房地产中致富”和“开始副业”等邮件。显然，这里的“火辣单身”真的很有兴趣见我，我是听他们是这么说的）。某些内置垃圾邮件过滤器还会禁用标记为垃圾邮件的邮件中的任何链接，以防止用户意外点击潜在的恶意链接。\n\
  \n### 设置简单的电子邮件过滤器\n\n关注重要的事情。今天电子邮件的一个问题是每天流入收件箱的新“事宜”数量惊人。\n\n自动将你的电子邮件分类真实人的直接邮件与邮件列表发布（如时事通讯和促销邮件）是有帮助的。我在\
  \ `Gmail` 和 `Yahoo` 账户中创建了过滤器，将任何包含 `unsubscribe` 词的邮件移动到 `Inbox` 之外的独立文件夹中，这提高了我的工作效率并减少了每小时的干扰，因为每日的时事通讯和促销不再占用我的主收件箱。这是一种简单易用的优先处理传入消息的方法，让我能够专注于可能需要回复的邮件，而不是那些可以空闲阅读的邮件。通过减少你邮件流量中的噪声，也可能帮助你更容易发现可疑邮件。\n\
  \n以下创建电子邮件过滤器的指令适用于 Google 的 `Gmail`，类似的步骤也适用于其他电子邮件服务。\n\n步骤 1 ：前往电子邮件的设置选项。在 `Gmail`\
  \ 中，选择查看所有设置，然后选择“过滤器和被屏蔽地址”，然后选择“创建新过滤器”。\n\n![](img/00013.jpeg)\n\n步骤 2 ：在打开的新窗口中，指定你想过滤所有包含\
  \ `unsubscribe` 字样的邮件，然后点击“创建过滤器”。\n\n![](img/00014.jpeg)\n\n步骤 3 ：注意 `Gmail` 通过标签而不是文件夹组织信息。你的邮件提供商可能使用文件夹、标签或其他，但概念是相同的。在下一个屏幕，`Gmail`\
  \ 显示我可以选择现有标签或创建一个新标签。我创建了一个名为“Newsletters and Stuff”的新标签，并点击了“应用标签”选项。我还点击了“将过滤器应用于匹配的邮件”，对包含\
  \ `unsubscribe` 的现有邮件进行标记。现在当我使用 `Gmail` 时，所有现有和未来的过滤邮件都会离开我的 `Inbox` 并进入“Newsletters\
  \ and Stuff”类别，这极大地帮助清理了我的收件箱。\n\n![](img/00015.jpeg)\n\n验证发件人地址与显示名称是否一致\n\n\n\n\
  \n邮件显示名称可以是你设置的任何内容，而电子邮件地址则应该显示邮件的真实来源。邮件显示名称是随意的，诈骗者利用了我们倾向于相信眼见内容的心理。这就是为什么当他们向你发送信息时，使用`“customerservice@apple.com”`或`“service@paypal.com”`作为显示名称对诈骗者来说非常有效，即使只有片刻也是如此。\n\
  \n如果你收到的任何邮件存在可疑，请确认发件人地址是否与显示名称一致，并且是否来自正规机构的网站地址。更勤恳的诈骗者会在发送给你的邮件中同时伪造他们的显示名称和电子邮件地址。如果你选择回复一封可疑的邮件，请双重检查在你的回复邮件中显示的回复地址。有时，你会发现你的回复被重定向到了与原始发件者不同的电子邮箱，这是一种更狡明、更稳健的伪装手段。不要回复！\n\
  \n## 对链接练习“悬停手”技巧\n\n在点击邮件中的任何链接之前，请花一点时间让你的光标悬停在链接或按钮上，然后再点击。在浏览器窗口的左下角，你应该能够看到该链接将带你去到的真实\
  \ URL 地址。\n\n右键点击链接也可以让你看到链接将引导向的真实 URL 地址。\n\n它会将你引导向真实的公司网站（例如，`www.bankofamerica.com`）还是一个可能存疑的\
  \ URL（例如，`www.bankofamerlca.com`）？你注意到这两个地址之间的区别了吗？如果是，那得很好。如果没有，请再看一遍。\n\n## 开启自动更新\n\
  \n自动更新有助于让你的计算机保持最新的升级、补丁和针对已知漏洞的修复，以防止旧的恶意软件利用这些漏洞。你所有程序和应用程序的升级速度和频率超过了大多数人类能够（或愿意）维护的水平，因此，请将你的更新设置设置为自动，并尽可能设置为设置允许的频率。\n\
  \n## 禁止自动显示邮件图像\n\n公司、广告商以及不那么友善的行为者经常会在图像中嵌入跟踪像素。跟踪像素是邮件图像中的不可见信息，当你打开图像时，它们会收到警报，并收集有关你的计算机甚至你位置的信息。你甚至不需要点击图像，跟踪像素就会激活，只需图像在你的屏幕上加载，你的信息就会被收集。为了防止窥探的目光，你应该将你的邮件设置为防止自动显示图像。这样做还将加快你查看消息的速度，而无需等待图像加载。每封邮件内部都会有选项，允许在你需要时查看被拦截的图像。\n\
  \n### 极高加密邮件\n\n在涉及邮件安全时，并非所有邮件都是平等的。例如，Google 的 Gmail 非常流行且极其方便，但它的数百万用户以隐私换取了便利。因为\
  \ Gmail 被 Google 所有（Google 对挖掘你的隐私并不陌生），Gmail 会查看你的数据，并可以将其与第三方公司共享以进行定向广告。Gmail\
  \ 还会记录你的每一次登录，并可以访问信箱中的每一封邮件。其他流行的邮件提供商对你的邮件也有不同程度的权限。\n\n![](img/00016.jpeg)\n\n\
  ### Protonmail\n\n[`protonmail.com/`](https://protonmail.com/)\n\n一种广泛接受的极端邮件隐私解决方案是\
  \ Protonmail，它提供端到端加密。Protonmail 总位于瑞士，那里拥有最严格的隐私法律之一。由于加密，即使是公司也无法读取你的信息。\n\n##\
  \ 如果你被骗了，给联邦打电话\n\nIC3 将互联网犯罪定义为任何涉及互联网向消费者传达虚假或欺诈陈述的非法活动。这些犯罪可能包括但不限于预付诈骗、货物或服务未交付、计算机黑客或就业机会。如果你认为自己是这些行为的受害者，可以在\
  \ FBI 的互联网投诉中心 [www.ic3.gov](https://www.ic3.gov) 提交投诉。\n\n在 IC3 提交投诉后，分析师将审查该信息并将其转发给相应的联邦、州、或国际执法机构。IC3\
  \ 不进行调查，也不提供已提交投诉的进度。\n\n## 第 5 章：那真的是你的密码吗？\n\n我的记忆力很差。对于名字和脸我是最糟糕。对于密码也是如此。短的、长的、随意的，无论用途如何。大多数人在密码方面也是这样。网络窃偷和分子对大众具有巨大的优势，因为他们知道数百万人使用易于破解的密码。此外，无数人在不同账户上使用相同的用户名和密码，无论是\
  \ Facebook 还是信用卡。\n\n敏捷的密码破解者还拥有大量的工具，包括包含成千上万种密码组合的列表，通常使用自动化程序根据常用词的变体进行密码尝试。而这些自动化破解工具通常是有效的。\n\
  \n其他情况下，窃偷可能会获取目标单个账户的访问权限，并以此该密码为起点获取目标其他账户的访问权限。多年来，我一直在几十个在线账户上使用了相同用户名和密码的错误选择，从我的常客号到新闻网站等等。我花费了相当长通过重置所有重复的密码来消除这一漏洞。\n\
  \n### 你被破解过（pwned）了吗？\n\n根据 UrbanDictionary.com 的定义，“pwned”是“owned”的变体（尽管是一个糟糕的变体）。这个术语源于网络游戏魔兽中的一个拼写错误，当时一名设计师写错了“owned”。当电脑击败玩家时，游戏本应宣布输者“has\
  \ been owned”，结果却显示玩家“has been pwned”。\n\n这在这里有什么关系？嗯，它基本上意味着被对手或局面击败或支配。根据 HaveIBeenPwned.com\
  \ 的说法，这是迄今为止最大的数据泄露，泄露了超过 7.72 亿唯一的电子邮件，以及这些地址在其他泄露的服务上使用的密码，总计 27 亿条记录。那次特定泄露的数据在一个流行的黑客论坛上公开。\n\
  \n\n\n\n\n使用以下网站之一来查看您的电子邮箱和密码是否在已知的数据泄露中泄露过。我发现我的好几个邮箱都涉及了多次泄露。真倒霉。这些网站提供了关于哪些账户泄露的信息，因此我根据列表更改了密码。\n\
  \n### HaveIBeenPwned\n\n[`haveibeenpwned.com/`](https://haveibeenpwned.com/)\n\n\
  HaveIBeenPwned 包含了数据泄露数据库，受害者的电子邮件和密码被盗取。重要的是，它是一个仓库，人们可以在此检查自己的邮箱是否在截至本指南发布时（超过\
  \ 48 亿个被泄露的网站账户）之中。\n\n![](img/0018.jpeg)\n\n### Firefox Monitor\n\n[`monitor.firefox.com/`](https://monitor.firefox.com/)\n\
  \nFirefox Monitor 会搜索已知的泄露。你可以设置一个免费账户来接收涉及你邮箱地址的新泄露警报。\n\n![](img/0019.jpeg)\n\n\
  ### 你的密码有多常见？\n\nHaveIBeenPwned 还有一个功能可以让你看到不同密码在泄露中出现的频率，这样你就能知道自己的密码有多常见。以下是使用长密码更好的实际结果说明。\n\
  \n| 密码 | 在泄露账户中使用的次数 |\n| :--- | :--- |\n| password | 3,759,315 |\n| password12\
  \ | 2,418,984 |\n| password121 | 186,721 |\n| password123 | 123,063 |\n| password1234\
  \ | 23,743 |\n| password12345 | 11,696 |\n| password123456 | 7,581 |\n| password1234567\
  \ | 5,503 |\n| password12345678 | 5,532 (比“password123456”稍微常见) |\n\n### 使用密码管理器\n\
  \n过去几年，我一直使用密码管理器来生成并安全地存储密码。我使用 LastPass 高级，每月只需几美元，证明非常稳健且可靠。我将 LastPass 账户与配偶和青少年孩子共享，这样他们就可以访问各种在线账户。重要的是，LastPass\
  \ 通过允许他们创建和存储安全密码，培养了他们良好的密码习惯。当他们长大独立后，他们会有自己的订阅。\n\n这是一个由 LastPass 生成的 50 字符密码示例。\n\
  \n```\nBSA334un5FN!qYlDFmH@sf3IxJGOckrIvecz9*RhI3bp\n```\n\n上面的字符串对于大多数人类来说太难记忆了，但这正是目的所在。良好的密码管理器会组织你的安全信息并创建强大的密码，让你轻松登录账户，同时增加他人破解的难度。\n\
  \n在第 8 章浏览器中，我们将推荐一些可以保护隐私并内置密码管理器的浏览器。此外，这里有两个可以添加到浏览器的免费和高级版密码管理器。还有无数其他，但你明白意思。\n\
  \n![](img/0020.gif)\n\n### LastPass\n\n[`www.lastpass.com/`](https://www.lastpass.com/)\n\
  \n![](img/0021.jpeg)\n\n## 1Password\n\n[`1password.com/`](https://1password.com/)\n\
  \n当我打开新的在线账户时，通常会使用我的一个邮箱作为用户名（我有 5 个活跃邮箱，将在书中进一步讨论），然后让 LastPass 使用目标网站允许尽可能字符生成随机密码。默认情况下，我通常选择\
  \ 34 到 60+ 字符的密码，仅仅因为我可以。长密码没有额外费用，但它几何增加了黑客（或其自动化机器人程序）尝试访问我账户时可能的密码数量。现在我无法记住这些长字符串，但我不需要，密码管理器会替我做。当我登录网站时，LastPass\
  \ 会自动填充我的用户名和密码；如果一个网站有多个账户（例如 Facebook），LastPass 会让我想用哪个账户登录。它既简单又稳健。\n\n### 50\
