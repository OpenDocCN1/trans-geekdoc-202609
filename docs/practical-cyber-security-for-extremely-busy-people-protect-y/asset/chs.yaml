  \n# 关于作者\n\n![](img/00180.jpeg)\n\nDaniel Farber Huang 是一位战略顾问，就网络安全及其他风险缓解问题提供咨询，客户涵盖从初创企业到跨国国公司的各类组织。他曾与美国许多联邦、州和地方执法机构紧密合作，为他们的移动技术需求提供解决方案。Daniel\
  \ 专注于为联邦探员、警察和其他机构提供硬件和软件解决方案，以支持他们履行职责。\n\n在创立自己的独立咨询公司之前，Daniel 曾在高盛集团（Goldman,\
  \ Sachs & Co.）、美林（Merrill Lynch）及其他大型投资银行工作，为企业和投资者提供国内外企业融资交易的建议。他积极参与了金额超过 100\
  \ 亿美元的融资项目。Daniel 曾为广泛的投资赞助人和策略提供建议，包括私募股权、风险投资、基础设施、房地产、新兴市场、对冲基金和特殊状况。Daniel 是普林顿大学工程教育创新中心（Keller\
  \ Center for Innovation）的顾问，为创业企业创始人提供业务最佳实践建议。\n\n在咨询工作之外，Daniel 还是记者和纪录片摄影师，关注女性儿童问题以及全球减贫。他是“面孔的力量”（The\
  \ Power of Faces）的联合创始人，这是一个旨在提高全球难民危机意识的大肖像项目。作为独立的人道主义倡导者，Daniel 记录了世界各地的难民营，并在\
  \ TED.com 等其他平台通过多次演讲积极提高公众意识。他的纪录片作品曾在国际特赦组织、中东研究所以及众多大学展出。他的作品被收录于国际摄影中心、纽约市博物馆、纽约历史学会、美洲华裔博物馆、纽约市消防博物馆等机构的永久收藏馆中。\n\
  \nDaniel 是探险家俱乐部（The Explorers Club）的国家成员，这是一个多学科专业协会，致力于推动实地研究的发展，并坚持保护探索本能至关重要的理念。他是\
  \ OP/TECH USA 相机配件的品牌大使。Daniel 还是沃顿校友社会影响俱乐大使。\n\nDaniel 在哈佛大学获得新闻学硕士学位（A.L.M.）和国际安全证书，在宾夕法尼亚大学沃顿商学院获得金融和创业管理工商管理硕士学位（MBA），并在纽约大学获得经济学学士学位。\n\
