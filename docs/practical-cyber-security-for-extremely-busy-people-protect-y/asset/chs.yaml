  \ |\n\n\n\n\n安全浏览互联网的话题可以写出好本书，但（对你来说很幸运！）我们将关注保持在线安全的几个关键、审慎且实用的要点。我们将尽可能保持内容简练。\n\
  \n简单来说，互联网上有好的网站、可疑的网站以及显然糟糕的网站，它们正等着你去访问。良好的网站提供它们声称提供的服务——例如提供新闻、娱乐、购物或你特定寻找的任何内容。可疑的网站提供的大多是你预期的内容，但其方式是为了为它们产生最大的收益（包括点击诱饵，即敦促你点击“下一页”或“下一张幻片”来浏览“前\
  \ 10 名”之类的列表）。显然糟糕的网站可能包含网络钓鱼计划或其他恶意手段，你的浏览器内置安全功能应该为你标记这些内容。\n\n## 浏览器 vs 搜索引擎\n\
  \n浏览器提供访问互联网的通道，而搜索引擎让你通过浏览器搜索互联网。`Safari`、`Chrome`、`Edge`、`Firefox` 和 `Brave`都是浏览器。`Google`、`Bing`\
  \ 和 `Yahoo` 是搜索引擎。我们将介绍如何让这两个工具都尽可能安全地为你服务。\n\n## 减少跟踪 Cookie\n\n`Cookies` 是网站用于管理你交互的文本片段。主要有三种类型：会话\
  \ Cookie、第一方持久性 Cookie 和第三方持久性 Cookie。`Session cookies`是最基础且临时的，在你关闭浏览器时会被删除。\n\n\
  `持久性 cookies`（包括第一方和第三方）存储在你设备的内存中，并由发行者设置过期日期，该日期可以是网站规定的任何时间段。`第一方 cookies` 由你正在访问的网站创建，并在你关闭浏览器后仍保留在你的设备上。这些\
  \ Cookie 可以让你的浏览更加方便，例如记住你是否已经登录或购物车里有什么东西。\n\n根据 Privacy.net 的说法，使用跟踪 Cookie 的一些常见资源是广告、社交媒体小组件（如\
  \ `Like` 和 `Share` 按钮以及评论）以及网络分析。14\n\n`第三方 cookies`也称为跟踪 Cookie，也存储在你的设备内存中，但它们是被除你实际访问的网站以外的其它网站所访问的。这允许第三方在你浏览时收集你的数据。`跟踪\
  \ cookies` 甚至不需要你点击任何内容，你的信息就会传回给创建它们的第三方。只要你访问的任何网页加载，你的信息就会被共享。跟踪 Cookie 通常被用于广告重定向营销，即你的浏览习惯被用来定制你看到的广告。如果你曾经在\
  \ `Amazon.com` 上看过的某件产品，然后在其他网站上又看到了该产品的广告：恭喜你，你被重定向营销了。\n\n社交媒体跟踪器帮助像 `Facebook`\
  \ 这样的公司汇集关于你兴趣的详尽个人画像（包括宗教、政治、经济和无数其他类别）。如果你喜欢例如大熊猫幼子或幼犬的视频，社交媒体跟踪器可以让你的社交媒体浏览更加愉快。然而，社交媒体跟踪对普通大众的负面影响可能是巨大的，已经多次出现利益集团向不同群体传播虚假信息、宣传和赤裸裸的谎言，以影响从流行趋势到社会公正再到总统选举等的问题。这可能发生在你所在的社区，也可能发生在范围内。\n\
  \n此外，跟踪像素是隐藏在出现在屏幕上的图像中的第三方跟踪器，它们允许数据收集者收集有关你的计算机和位置的信息。跟踪像素不需要你做任何操作即可激活，这使得它们非常有侵略性。只要它们附带的图像在你的页面或电子邮件中加载，第三方就可以收集信息。\n\
  \n## 隐身模式有多隐身？\n\n根据你使用的浏览器，这可能被称为 `Private`、`InPrivate` 或 `Incognito` 模式。这些隐私浏览器模式会在你关闭隐私浏览器时，删除你计算机或设备上的搜索记录和浏览历史。私密模式可以防止其他使用你电脑的人知道你查看过什么，但你在私密浏览期间下载的任何文件或创建的书签将保留在你的计算机上。\n\
  \n重要的是，要理解这些隐私浏览器并不会让你对网站或你的互联网服务提供商匿名。如果你在隐私模式下使用工作电脑，你的公司仍然可以监控你的浏览活动。\n\n隐私浏览无法保护你免受可能已经位于计算机上的键盘记录器或间谍软件。（我们将在第\
  \ 12 章——阻止、删除、备份和恢复中介绍如何移除这些程序。）\n\n## 使用尊重你隐私的浏览器\n\n简单的答案是：停止使用 `Google Chrome`\
  \ 作为你的浏览器。\n\n保护你的隐私不受广告商、社交媒体网站和其他将你视为商品而非人类的力量侵害，是你为网络健康所能最重要的步骤之一。根据 Statcounter.com\
  \ 网站显示，全球高达 70% 的桌面用户使用 `Google Chrome` 进行浏览。15\n\n有很多简单的替代方案可以取代 `Google Chrome`，后者会激进地挖掘你的个人数据并允许第三方跟踪你所有的活动。无需长篇说明\
  \ `Google` 有多大的侵入性，只需理解它们的原始业务模式是基于将个人在线搜索活动的各个点连接起来，以开发可以出售给广告商的定向个人画像。随着分析技术的飞跃式发展，在线隐私的意义性和价值不断增长。底线是，你的个人信息、浏览活动和在线习惯应该是你自己的，而不是被商品化并用来对付你。\n\
  \n这里是一些 `Google Chrome` 的简单替代品，你可以从每个发行商的网站或从你的应用商店下载最新版本。16\n\n更具体地说，一个保护你隐私的浏览器应该：\n\
  \n1. 默认阻止第三方跟踪 Cookie\n2. 阻止社交媒体跟踪器\n3. 提供隐私浏览或隐身模式\n4. 提供密码管理器，鼓励你使用长且复杂的密码来保护你所有的登录\n\
  \n这四款浏览器提供了上述所有功能，你可能需要在浏览器的设置中开启它们：\n\n![](img/00033.jpeg)\n\n### Apple Safari\n\
  \n`Apple Safari` 使用它所谓的“智能跟踪防止”来阻止广告商跟踪你的在线活动。`Safari` 还防止广告商创建你的设备画像，以便根据你的浏览器配置、字体以及安装的插件等特征针对你投放。为了帮助防止这一点，`Safari`\
  \ 只与你访问的网站共享简化的系统配置文件，使得数据公司更难识别出你。\n\n![](img/00034.jpeg)\n\n### Mozilla Firefox\n\
  \n我开始偏爱 `Firefox` 的免费浏览器，因为它还提供了 `Facebook Container` 免费插件，该插件防止 `Facebook` 跟踪你在\
  \ `Facebook` 之外的活动。通常，如果你在 `Facebook` 中点击一个链接跳转到外部网站，`Facebook` 会继续跟踪你的活动，即使你可能正在\
  \ `Amazon` 或任何地方。`Facebook Container` 防止了 `Facebook` 跟踪你的外部活动。`Facebook` 仍然能够跟踪你在其平台上观看、阅读、点赞、评论和进行的一切切，但\
  \ `Facebook Container` 让你从这家极具侵入性的社交媒体公司手中夺回了部分在线隐私的控制权。\n\n\n\n\n\nMozilla 是流行的\
  \ `Firefox` 浏览器的制造商，由一家非营利组织支持，该组织支持在线隐私并赋予用户更多控制在线生活的能力。`Firefox` 会自动拦截超过 2,000\
  \ 个已知的跟踪器，其隐私模式还会拦截广告和跟踪器。\n\nMozilla 还为 iOS 和 Android 了一了一个名为 `Firefox Focus` 的“轻量级”移动浏览器，它可以自动剥离广告并简化你在较小屏幕移动设备上的浏览体验。通过不加载多余的广告和图像，它是一个更快的移动浏览器。你可以在手机上同时安装\
  \ `Firefox`（当你想要更丰富的浏览体验时）和 `Firefox Focus`（用于更快速、简单的任务），以获得更大的灵活性。\n\n![](img/00035.jpeg)\n\
  \n### Brave 浏览器\n\nBrave 是一种会自动拦截跟踪器的浏览器，并且不会存储或收集你的浏览数据。它还通过自动升级到 `HTTPS` 安全性来提供安全的加密通信。`Brave`\
  \ 适用于电脑和移动设备。\n\n![](img/00036.jpeg)\n\n## Microsoft Edge\n\n`Edge` 的 `Tracking\
  \ Prevention`（跟踪防止）设置让你选择选择拦截跟踪器的严格程度：`Basic`（基础）、`Balanced`（平衡）和 `Strict`（严格）。`Basic`\
  \ 拦截已知的有害跟踪器，但在其他允许其他跟踪器按预期监控你。`Strict` 模式拦截大部分但不是所有的跟踪器，并可能阻止某些网站完全正常运行。如果 `Strict`\
  \ 过于严格，`Balanced` 模式提供了折中方案。\n\n![](img/00037.jpeg)\n\n## 不，不要这个\n\n抱歉了，Google。我喜欢你的易用性，但请给我们一些隐私。`Google`\
  \ 的默认设置默认情况下都不进行拦截。你可以在 `Chrome` 内部开启一些隐私功能，但要确保与上述浏览器相同的隐私和匿名水平，需要你付出一些努力，包括添加和启用隐私扩展（下文将讨论更多相关内容）。\n\
  \n然而，`Google` 作为研究型搜索引擎是非常优秀的，我们将在第 14 章——“社交媒体谨慎使用”和第 15 章——“防御网络喷子”中讨论如何使用他们的浏览器\
  \ `Google Maps`（及其 `Street View` 和 `Satellite View` 功能）以及 `Google Earth` 来防止网络骚扰。\n\
  \n### 极端浏览器隐私\n\n![](img/00038.jpeg)\n\n## Tor 浏览器\n\n`Tor Browser` 是在线隐私的黄金标准。在压迫政府下工作的记者和人权维护者可以使用\
  \ `Tor` 来保护他们的线人以及他们自己。`Dark Web` 坏人也使用 `Tor` 进行非法活动，但（幸运的是）美国高级执法机构能够识别并成功逮捕躲在\
  \ `Tor` 后的网络违法者。执法部门还可以识别某人是否在使用 `Tor`，如果迹象表明正在进行非法活动，这可能会使使用户成为关注对象。对于大多数诚实的用户来说，`Tor`\
  \ 是一个强有力的隐私工具，它可以向广告商、`ISPs`（互联网服务供应商）和网站隐藏你的活动。它的性能可能比更流行的浏览器慢，但这是获得匿名性的代价。`Tor\
  \ Browser` 可能仍然显示广告，但这些广告无法跟踪你。\n\n`Tor` 相信每个人都应该能够在保护隐私的情况下探索互联网。它由 `Tor Project`\
  \ 运行，这是一个美国 501(c)3 非营利组织。他们表示，其目标是通过免费软件和开放网络推进人权并保护公众的在线隐私。`Tor Browser` 会隔离你访问的每个网站，以便第三方跟踪器和广告无法跟随你。当你完成浏览时，任何\
  \ `cookies` 自动清除。浏览历史也是如此。`Tor Browser` 防止监视你连接的人知道你访问了哪些网站。监控你浏览习惯的人只能看到你正在使用 `Tor`。`Tor\
  \ Browser` 旨在让所有用户看起来一样，使得很难根据你的浏览器和设备信息对你进行指纹识别。你的流量在通过 `Tor` 网络时会经过三次中继加密。该网络由数千个由志愿者运行的服务器组成，被称为\
  \ `Tor relays`（节点）。通过 `Tor Browser`，你也可以访问家庭网络可能屏蔽的网站。\n\n### 使用更私的搜索引擎\n\n`Google`\
  \ 和许多其他搜索引擎通过利用你的搜索历史、购买历史和其他从你的在线活动中确定的其他细节（有很多）来编写你的目标消费者画像，从而从你的浏览习惯中获利，这侵犯了你的在线隐私。`Google`\
  \ 依靠它在数百万个网站上管理的跟踪 cookie 来跟踪你的搜索。广告商随后可以对你进行精准投放，这就是为什么当你搜索某种产品或服务时，在访问其他网站时经常会看到那些特定物品的广告——广告商正在在线跟踪你。而搜索引擎通过展示广告获得报酬。\n\
  \n## DuckDuckGo\n\n`DuckDuckGo` 拦截 `Google` 和第三方跟踪器，帮助保持你的浏览历史更加私密。它是一个通过广告获利的搜索引擎，但以更少侵入性的方式保护你的隐私。`DuckDuckGo`\
  \ 不收集你的个人信息，因此搜索广告基于你正在查看的搜索结果页面，而不是专门针对你的画像的。如果你在搜索鞋子，`DuckDuckGo` 会向你展示关于鞋子的广告，广告商并不知道作为详细的你是谁。他们只知道有人搜索过鞋子。`DuckDuckGo`\
  \ 是一个免费的浏览器插件，可以设置为你的默认搜索引擎。`DuckDuckGo` 也是 `Tor` 浏览器的默认搜索引擎，这说明了它保护用户匿名性的能力。\n\n\
  ![](img/00039.jpeg)\n\n### 为隐私调整你的浏览器设置\n\n进入浏览器设置，检查这些功能是否已针对你的隐私进行了设置：\n\n####\
  \ 限制外部权限\n\n确保你的浏览器设置在允许任何网站访问以下内容之前需要你的许可：\n\n- 你的位置\n- 你的摄像头\n- 你的麦克风\n\n####\
  \ 禁用弹出窗口\n\n阻止网站弹出窗口并自动重定向到其他网站。\n\n#### 开启“请勿追踪”（DNT）\n\n你的浏览器设置还有一个 `Do Not Track`\
  \ 选项，告知第三方 cookie 创建者你不希望他们收集你的信息。开启它。但请注意，`Not Track` 是对第三方的请求，没有强制机制，因此某些不道德的跟踪器可能会（实际上很可能）忽略此。\n\
  \n#### 清除现有的 cookies\n\n在浏览器设置中，进入 `History`（历史）部分并清除浏览器历史。这将要求你在下次访问网站时重新登录，但定期养成此习惯是一个健康的习惯。你（希望）已经安装的密码管理器会让重新登录变得快速且无痛苦。\n\
  \n#### 为 PC 和 Android 设备安装广告拦截器\n\n苹果设备内置了广告拦截器，这让广告代理机构感到非常沮丧，但对其用户有利。`PCs` 和 `Androids`\
  \ 没有对第三方跟踪器具有免疫力，因此我建议安装广告拦截器来提高你的隐私。\n\n\n\n\n\n美国白宫网站被拦截了 4 个跟踪器\n\n![](img/00042.jpeg)\n\
  \n运动公司耐克被拦截了 12 个跟踪器\n\n![](img/00043.jpeg)\n\n媒体和娱乐网站 Buzzfeed 也被拦截了十几个跟踪器\n\n\
  ![](img/00044.jpeg)\n\n新闻网站 CNN 被拦截了 21 个跟踪器。\n\n![](img/00045.jpeg)\n\n保持个人信息隐私对你是有利的，广告拦截器显然可以提供帮助。\n\
  \n## 了解如何查看内置安全功能\n\n网络浏览器内置了检查来自受信网站的安全证书的功能。当你访问任何网页时，你的浏览器应该通过在 URL 地址旁边显示符号，指示你的连接和数据是否安全。\n\
  \n在你访问的每个网站 URL 开头，寻找 `https://`（而不是不带 `s` 的 `http://`）和挂锁图标，这表示你与网站之间的通信经过了加密，可以防止窥探之眼。\n\
  \n例如，Google 的 Chrome 浏览器显示如下所示：\n\n![](img/00046.jpeg)\n\n你的浏览器还会在进入恶意网站之前向你警告。\n\
  \n![](img/00047.jpeg)\n\n## 选择单个网站的隐私选项\n\n安全和某些可疑的网站都会激进地（但合法地）根据其 Cookie 策略允许的范围收集尽可能关于你的信息。（在讨论中，我们暂时忽略那些完全欺诈的网站，因为它们从根本就没有合法的\
  \ Cookie 策略）。越来越多的用户能够设置自己的权限，并在允许“必要 Cookie”（用户无法避免被安装）和“可选 Cookie”之间进行区分，网站声称这些\
  \ Cookie 可以“增强你的观看体验”。\n\n在实践中，可选 Cookie 帮助网站广告商根据你的浏览习惯、设备信息和其他数据更有针对性地向你投放广告以获取其经济利益，而对你这个用户来说益处微乎其微。每当我进入一个显示其\
  \ Cookie 策略的新网站（通常是在我访问的第一个页面底部弹出的横幅消息）时，我都会点击它并确保拒绝可选 Cookie。否则，我只是让自己更容易暴露在不希望的、侵入性的广告面前。我建议你也这样做，以尽可能保持匿名性。\n\
  \n![](img/00048.jpeg)\n\n这是来自另一个网站的另一个版本……\n\n![](img/00049.jpeg)\n\n## 下载时要谨慎\n\
  \n在从网站下载程序、文件、插件或应用程序之前，请检查它们是否来自可靠的来源，这些来源会对软件进行审查或审核以是否存在有害功能。有时，间谍软件或其他恶意程序会溜入以下平台，但最终会被捕获，而那些在野外未受监控的可能永远不会被拦截。\n\
  \n虚假应用可以人为地推高评分以吹榜五星评论，使它们（至少最初）看起来是合法的。在下载和安装任何并非来自受信发行者或来源的应用程序之前，花几分钟进行自己的独立研究是明智的。阅读评论，从一星级开始，看看用户是否对该应用不满意。此外，在将未知应用添加到电脑之前，考虑搜索独立的评论（如果有的话）。手机或平板电脑也是如此。\n\
  \n**Apple App Store**。在你的 `System Preferences`（系统设置）中，点击 `Security & Privacy`（安全性与隐私），然后点击\
  \ `General`（通用）。指定接受从哪些来源下载是最安全的。你可以从 (i) App Store 或 (ii) App Store 和已识别的开发者中进行选择。选项\
  \ (ii) 允许来自向 Apple 注册开发者的程序，并可以选择将其应用程序上传到 Apple 进行安全检查。\n\n**Microsoft Store**。微软商店不像\
  \ App Store 那样全能，但程序和应用程序经过了微软的审核，因此被认为是安装安全的。\n\n**Google Play Store**。所有 Android\
  \ 应用在出现在 Google Play Store 之前都经过了安全测试。Google 会审核 Google Play 中的每个应用和开发者，并暂停违反其政策的者。\n\
  \n## 浏览器扩展\n\n在浏览器上启用浏览器扩展也遵循同样的严谨态度。仅使用通过浏览器自带设置工具提供的扩展。\n\n## 警惕钓骗网站\n\n浏览时，请注意那些依赖用户不小心输错合法网站的钓骗网站。看一眼浏览器的安全图标将有助于提醒你。\n\
  \n当你想要访问 `Newsweek.com` 时\n\n![](img/00050.jpeg)\n\n但不小心输入了 `Newsweel.com`，会显示这个……\n\
  \n![](img/00051.jpeg)\n\n## 扫描网站或文件以检测已知病毒\n\n### VirusTotal\n\n`https://www.virustotal.com`\n\
  \nVirusTotal 是一项免费服务，它使用 70 多种反病毒扫描器和 URL/域名黑名单服务来检查可疑网站、链接和文件（你上传进行扫描的文件），此外还有从研究内容中提取信号的工具。任何用户都可以使用浏览器从电脑选择一个文件并发送到\
  \ VirusTotal，以确保在打开之前它是安全的。\n\n![](img/00052.jpeg)\n\n## 忽略声称你有病毒的弹出窗口\n\n如果你按照上面的建议设置了浏览器，这种诈骗对你来说就不应该是问题。如果你还没有设置，不要相信任何尖叫你有病毒并敦促你点击任何按钮或链接来解决危机的弹出消息。相反，退出浏览器，修复你的浏览器弹出设置（如上所述），并重新考虑你当时正在浏览的网页是否合法。\n\
  \n不要尝试关闭或最小化弹出窗口本身。\n\n最小化或关闭按钮可能是假的，通过点击它们，你实际上是对弹出窗口产生了响应。\n\n## 第九章 移动设备安全\n\n\
  ### 定位、锁定或删除你丢失的设备\n\n如果你的手机或移动设备丢失，Apple 和 Android 都有方便的应用程序可以帮助你定位、锁定或删除手机内容以保持你的信息安全。\n\
  \n**Apple Find My 应用**\n\nApple 的 iCloud 拥有 Find My（查找）应用，用于定位 iPhone、iPad、Mac、Apple\
  \ watch、AirPods 和 iPod。Find My 应用甚至可以通过全球连接设备的 Find My 网络找到离线设备。\n\n要开启“查找”，前往 `Settings`（设置），点击你的名字，然后点击\
  \ `Find My`。按照指令设置你的设备。\n\n要使用 Find My 定位、锁定或删除你的手机，请使用你的 iCloud 账户登录 [`https://www.icloud.com/find`](https://www.icloud.com/find)，并按照指令定位并在必要时锁定或删除你的设备。\n\
  \n![](img/00053.jpeg)\n\n**Google 查找我的设备应用**\n\n如果你丢失了 Android 手机或平板电脑，你可以找到、锁定或擦除它。如果你在设备上添加了\
  \ Google 账户，查找我的设备会自动开启。\n\n要确认你的 Android 设备设置正确，请检查以下步骤：\n\n步骤 1：检查查找我的设备是否开启。打开设备的\
  \ `Settings`（设置）应用程序。点击 `Security`（安全），然后点击 `Find My Device`（查找我的设备），并检查查找我的设备是否已开启。\n\
  \n步骤 2：检查位置是否开启。在设备的 `Settings`（设置）应用程序中，点击 `Location`（位置）并确认位置已开启。\n\n步骤 3：检查 Google\
  \ Play 可见性是否开启。如果你在 Google Play 上隐藏了设备，它不会出现在查找我的设备中，你需要将其可见。打开 [`https://play.google.com/settings`](https://play.google.com/settings)，并在\
  \ `Visibility`（可见性）下检查确保你的设备是可见的。\n\n![](img/00054.jpeg)\n\n## 从 Apple Store 或 Google\
  \ Play 下载时要警惕\n\n\n\n\n\n这两个平台上的应用理理都经过安全审查和审核，但请注意，某些故意的恶意程序会溜过筛选过程，并进入 `App Store`\
  \ 或 `Google Play Store`。最终，希望它们能被发现并移除，且最好是在你下载它们之前被移除。但要意识到，坏苹果有时确实存在，并且对那些毫无防备的下载者开放。\n\
  \n## 欺骗你的指纹以进行购买\n\n`Lifehacker.com` 网站曾报道过一个诈骗性的 `iOS` 心率监测应用，该应用最初被 `App Store`\
  \ 封禁，但在八个月后又重新出现。这个虚假应用声称使用你的指纹触摸扫描仪来追踪脉搏。但它实际上的操作是利用你的指纹作为授权，在后台使用你的指纹进行 `$89`\
  \ 的秘密应用内购买。其他虚假应用还承诺点对点视频聊天、免费色情、性内容，以及一般的问答和热门娱乐。[\\[19\\]](#part0185.html#_ftn19)\n\
  \n与电脑下载类似，虚假的移动应用可以通过人为手段推高评分，使其在最初（至少）看起来是合法的。在下载和安装任何并非来自受信任发行者或来源的应用之前，花几分钟进行自己的独立研究是明智的。阅读评论，从一星评价开始，看看用户是否对该应用不满。此外，在将未知应用添加到手机或平板电脑之前，考虑搜索独立的评论（如果存在）。\n\
  \n## 检查你的权限\n\n![](img/00055.jpeg)\n\n### PermissionDog\n\nAndroid 用户可以通过安装 `PermissionDog`\
  \ 应用来查看已安装应用的的侵入性有多大，该应用会列出你安装的所有程序，并检查每个应用正在使用哪些权限。根据这些权限，它会对应用程序的危险程度进行评分。`PermissionDog`\
  \ 还支持实时保护。每当你启动应用程序时，都会弹出一个通知，显示该应用正在使用多少权限。某些应用需要实质权限，包括 `Google` 和银行应用，但另一些应用可能存在不必要的侵入性。你可以决定哪些应用值得授予广泛权限，而哪些不值得。\n\
  \n你可以在 `Google Play Store` 中找到 `PermissionDog`。\n\n## 关闭自动照片备份\n\n关闭自动云端保存。如果你手机上有敏感照片或视频，请先将它们锁在照片保险箱中，从主相册中删除，然后让手机备份你的其他照片和视频。\n\
  \n### 在 iPhone 上\n\n你在 `iPhone` 上拍摄的每张照片都会上传到 `Apple` 的 `iCloud`。要关闭 `iCloud` 共享，请进入\
  \ `Settings` > `iCloud` > 滚动到 `Photos` 并关闭选项。要完全禁用 `iCloud`，请前往菜单底部并点击“删除帐户”。\n\n\
  ### 在 Android 手机上\n\n照片可以备份到 `Google Drive` 服务，但在首次设置 `Google` 账户时该功能是关闭的。双检你的设置：进入\
  \ `Photos` 应用 > 选择 `General Settings` > 将 `Auto-Backup` 滑到 `Off`。频繁检查你的云端，以确切知道那里存储了什么。\n\
  \n同样的理念也适用于你可能使用的其他备份服务。检查并确保你了解设备和云端存储了什么，以确保你对私生活保持严密控制。\n\n## 将敏感照片放在保险箱中\n\n\
  不一定是指你金鱼的照片，但绝对包括任何可能被用来暴露、让你尴尬或其他方式伤害你的个人照片。每个人都有权按照自己的意愿拍摄任何自己的照片和视频。不幸的是，已经出现过……\n\
  \n\n\n\n\n仅仅因为一个应用程序声称提供加密消息，就不要假设它完全保护了你的通信。对于某些应用，加密需要手动开启才能生效，而某些应用可能在所有情况下都不会进行加密。最安全的消息应用提供端到端加密、默认加密（意味着你使用它时加密始终开启）以及开源代码。开源允许外部世界查看应用程序的内部运行机制，并引起对代码任何漏洞的关注，开发者随后对这些漏洞进行修复和加固。\n\
  \n# 你可以使用的最安全的消息应用\n\n以下是一些可以考虑使用的、保护你隐私的安全应用。\n\n![](img/00060.jpeg)\n\n## Signal\n\
  Signal 被认为安全消息的黄金标准，它会自动加密使用其应用的人员之间的所有消息，使得只有发送者和接收者可以阅读。发布 Signal 的公司 Open Whisper\
  \ Systems 甚至无法读取通过其应用发送的消息，而且消息可以在设定的时间后自动销毁。Signal 提供加密文本信息、语音通话、群消息和视频通话。你可以设置消息在一定时间后消失，并还可以使用密码锁定应用。Signal\
  \ 适用于 iPhone 和安卓手机。\n\n![](img/00061.jpeg)\n\n## Wickr\nWickr 提供个人版本（`Wickr Me`，免费）和商业版本（`Wickr\
  \ Pro`，付费服务）。与 Signal 类似，Wickr 在端到端加密方面被认为是顶级水平。如果接收者尝试对任何消息截图，Wickr 会提醒发送者。Wickr\
  \ 适用于 iPhone 和安卓手机。\n\n![](img/00062.jpeg)\n\n## Dust\nDust 在 24 小时内或在阅读后立即删除消息，以先到者为准。Dust\
  \ 适用于 iPhone 和安卓手机。\n\n#流行的应用存在隐私缺陷\n\n最常用的应用在隐私方面虽然良好但并不完美，如果你担心极端隐私，应该谨慎使用。\n\n\
  ![](img/00063.jpeg)\n\n## Apple iMessage\niMessage 仅在 iPhone 用户之间提供端到端加密，发送给安卓用户时的短信是不加密的。备份到\
  \ `iCloud` 的 iMessages 是由 Apple 加密的，而不是由你加密。如果你的 `iCloud` 被黑客入侵（或者 Apple 被法院传唤），你的消息可能会泄露。\n\
  \n![](img/00064.jpeg)\n\n## Facebook Messenger\nMessenger 的加密功能必须开启，它们不是默认设置的，这会让某些用户感到困惑。Facebook\
  \ 的公司行为和对隐私的态度引起了人们对其可能如何激进地处理（或收集）用户数据的担忧，例如剑桥分析丑闻（如果你没读过这个事件，我强烈建议你去查一下。它令人不骨悚然且令人不安）。简单来说，很难知道\
  \ Facebook 在多大程度上尊重或不尊重用户的隐私。\n\n![](img/00065.jpeg)\n\n## WhatsApp\n我喜欢 WhatsApp，它控制简单快捷，但它是\
  \ Facebook 拥有的，因此也应该考虑关于 Facebook 数据收集立场的相同担忧。此外，备份在 `Google Drive`  WhatsApp 消息是不加密的，可能会暴露（为了防止这种情况，你可以禁用\
  \ `Google Drive` 上的 WhatsApp 备份）。\n\n# 你所在手机追踪法律\n\n智能手机的位置记录可以揭示关于人的巨大信息。根据美国公民自由联盟（`ACLU`），隐私法律还没有跟上技术进步，执法部门此前曾声称有无搜查令从手机公司访问这些信息的权限。虽然国会和最高法院尚未对位置信息需要搜查令做出裁决，但州立法机构和下级法院正在一点点为越来越多的美国人扩大隐私保护。在实际操作中，你的隐私保护状态取决于你所在地。例如，你的位置信息在蒙特拿州受到保护，但在乔治亚州则不然。在伊利诺伊州，警察需要搜查令才能知道你现在在哪里，但不需要知道你上周在哪里。在加利福尼亚州，你的位置信息受到州当地警察无搜查令搜索的保护，但不受联邦当局保护。在佛罗里达州，州法院和联邦法院在该问题上存在分歧。\n\
  \n`ACLU` 在其网站上有一张交互地图，详细列出了各州手机位置追踪法律的状态。\n\n[`www.aclu.org/issues/privacy-technology/location-tracking/cell-phone-location-tracking-laws-state`](https://www.aclu.org/issues/privacy-technology/location-tracking/cell-phone-location-tracking-laws-state)\n\
  \n![](img/00066.jpeg)\n\n### 极端隐私\n\n有时，一个人只需要保持独处。\n\n在某些极端情况下，你可能会遇到压迫政府或其他行为试图窃取或强迫你交出手机数据。这可能是公开进行的，例如如果你被捕且物品被没收并检查，也可能是隐蔽进行的，例如当你通过国际海关时压迫性政府检查你的手机。可能性是无限的。获取或克隆手机的技术在公开市场上可以轻易买到。\n\
  \n除了上述重要的隐私安全步骤外，在糟糕情况发生之前，你还可以采取一些额外措施来保护你的隐私，包括：\n\n* 锁定你的 SIM 卡\n* 禁用指纹和面部识别\n\
  * 准备好手机出厂设置\n\n## 锁定 SIM 卡\n每部手机都使用 SIM 卡（用户识别模块的缩写），这是一个存储用户代码的微型芯片，手机公司识别你的手机并向你收费。SIM\
  \ 卡设计易于安装和移除，可以在手机之间传输。\n\n### 但是……\n如果有人复制了你的 SIM 卡，他们就可以创建一个你的手机副本并监控你的语音通话和短信。\n\
  \n现代 SIM 卡通常带有一个默认 `PIN`。如果有人想复制你的 SIM 卡，他们需要这个代码，但你的是，默认 `PIN` 可以在网上搜到。手机运营商通常会在网站上发布它们。\n\
  \n为了让未经授权的人难以复制你的 SIM 卡，你可以更改你的 `PIN` 代码。每当你重启手机或移除 SIM 卡时，都需要输入 `PIN` 代码。你也可以根据需要开启或关闭\
  \ `PIN` 限制。\n\n请注意，多次输入错误的 `PIN` 代码会锁定你的手机，所以在更改代码时要小心。如果你不知道默认的 SIM 卡 `PIN` 代码是多少，不要尝试猜测。检查你运营商的客服页面或随无线套餐提供的文档。或者你可以联系你的运营商。\n\
  \n为了说明，以下是在 Verizon 安卓手机上更改 SIM 卡 PIN 代码的方法：\n\n1. 从网络浏览器登录 Verizon 网站上的你的账户。\n\
  2. 点击“账户”，进入“我的设备”，然后点击“设备概览”。\n3. 选择你的手机并点击“管理设备”。\n4. 选择“PIN”和“个人解锁密钥 (PUK)”。\n\
  5. 点击链接后将显示默认 `PIN` 和“解锁密钥 (PUK)”。如果你因多次输入错误 PIN 锁定了 SIM 卡，PUK 是另一个恢复密钥。\n\n对于使用\
  \ SIM 卡的 Apple 设备：\n\n1. 如果你使用的是 iPhone，进入“设置”，然后“蜂窝”，最后点击“SIM PIN”。如果你使用的是 iPad，进入“设置”\
  \ >“移动数据” >“SIM PIN”。\n2. 开启你的 `SIM PIN` 代码。\n3. 如果你从未使用过 SIM 代码，请输入运营商提供的默认 `SIM\
  \ PIN`。\n\n\n\n\n\n### 4. 点击完成\n\n### 禁用指纹和面部识别\n\n在某些极端情况下，例如面对极具压迫性的政府、执法部门或其他行为者试图胁迫或强迫你解锁手机，使用指纹登录或面部识别可能会让你的设备面临被强制侵入的风险。无论是通过身体强迫你将手指或脸部对准位置、将手机举到你脸前，还是诱骗你这样做，生物识别登录都可能被用来对付你。\n\
  \n从民权的角度来看，政府机构想要强迫你披露密码或 PIN 码来解锁手机要困难得多，取决于你可能遇到的具体情况，你可以正式记录并声明你拒绝披露密码。\n\n或者，如果你正准备前往或从国外的地区返回，请关闭指纹和其他生物识别登录。如果你打算参加例如和平抗议或任何可能出现民事“摩擦”的情况，也同样这样做。在这两种情况下，你可以在安全回到家后重新启用生物识别登录。\n\
  \n《美国宪法》第五修正案防止政府（实际上是禁止）强迫某人提供不利于自己的证据。当某人“行使第五修正案权利”时，他们指的是这项宪法权利。第五修正案也意味着，如果你被捕，不必与警察交谈，正如他们告知你“你有权保持沉默”一样。\n\
  \n关于执法部门是否可以强迫某人使用生物识别特征解锁手机，存在一些困惑。过去，美国法院曾允许执法部门这样做，但加利福尼亚州北区法院的一位法官裁出了相反的判决。为了最好保护自己，如果你可能处于敏感处境，关闭生物识别登录是明智之举。\n\
  \n### 在 iPhone 上\n\n进入 `Settings`（设置） > `Face ID & Passcode`（较旧设备上为 `Touch ID and\
  \ Passcode`）。关闭解锁手机的面部识别或指纹扫描。接下来，如果你需要创建更强的 PIN 码，滚动到 `Change Passcode`（更改密码）。\n\
  \n### 在安卓手机上\n\n进入 `Settings`（设置） > `Security`（安全） > `Face unlock`（面部解锁）。在“用于面部解锁”下，关闭“解锁手机”。在安全设置页面上，你还可以根据使用的手机类型禁用指纹扫描或删除已保存的指纹。\n\
  \n#### 准备好手机出厂设置\n\n在某些情况下，你采取的最安全行动（特别是当时间紧迫以避免手机被没收、克隆或检查时）可能是对设备进行出厂设置，然后度过你的困境，等回到安全的地方后再恢复设置和数据。\n\
  \n例如，我曾多次过海外旅行，我不清楚作为一个外国人在海关受到的接待会有多友好。根据威胁程度，如果有理由相信移动设备可能会被检查，我准备好在进入海关区域之前对手机进行出厂设置。如果我的手机可能离开我的手中哪怕一分钟，我都会擦手机，然后让他们在没有任何信息的情况下检查我的设备。之后，一旦安全就位，我就会从云备份中恢复我的信息。\n\
  \n我们将在第 12 章“阻止、删除、备份与恢复”中讨论如何备份手机数据和设置。为了让自己拥有随时可以对手机进行出厂设置的选项，请确保你已设置了自动备份。\n\n\
  要对手机进行出厂设置，请进入手机的 `Settings`（设置）菜单。寻找适用于你设备的可用重置选项。在去任何地方或可能采取任何可能让你处于不利境地之前，请记住如何找到\
  \ `Factory Reset`（出厂重置）选项。\n\n## 第 10 章 ‒ 经过检验的电话诈骗\n\n随着手机变得越来越智能并提供新功能，不可避免会有新的诈骗手段被发明，以利用各种产品的最新发布。然而，重要的是，诈骗者和小偷仍然在使用老式的诈骗手段（我补充一下，非常成功），通过真实的电话从受害者那里骗取资金。以下是你保护自己和周围人的一些方法。\n\
  \n### 了解你的来电者\n\n电话号码像电子邮件和网站一样可以伪造，因此在接到未知号码的电话时要留留意，并知道来电显示显示是由来电者提供的，他们可能也可能非法。\n\
  \n最常见的电话诈骗包括：\n\n* 来自政府机构、IRS（税务局）、家庭成员或电脑技术维修人员的冒充诈骗，\n* 债务缓解和信用修复诈骗，\n* 商业和投资诈骗，\n\
  * 慈善诈骗，\n* 汽车延保，\n* 免费试用，\n* 贷款诈骗，\n* 奖项和彩票诈骗，\n* 旅游诈骗和分时诈骗，以及\n* 要求释放家人而索要赎金的假绑架电话\n\
  \n### 电话诈骗\n\n根据美国联邦贸易委员会的规定，记住这些常识规则以防受骗：\n\n* 没有奖金。如果你必须支付费用、运费或税费才能获得奖金，那就不是奖金。\n\
  * 你不会被捕。执法部门、IRS 或联邦机构不会打礼貌电话说你可以通过交罚款来避免被捕。所以，不要交。\n* 不需要匆忙。合法的企业会在你购买前给你留时间做决定。不要让自己在压力迫下当场做决定。\n\
  * 绝不要用现金、礼品卡或转账应用支付。任何要求你以这种方式支付的人都是诈骗者。\n* 政府机构不会打电话核实你的敏感信息。永远不会。\n\n#### 谢绝拨打名单\n\
  \nFTC 的国家谢绝拨打名单（Do Call list）始于 17 多年前，旨在停止不受欢迎的推销电话。注册是免费的，寻求推销电话的公司应该遵守该规定。在理想情况下，合法公司会遵守它。然而，该名单不适用于：\n\
  \n* 政治电话，\n* 慈善电话，\n* 债务催收电话，\n* 纯信息电话，以及\n* 调查问\n\n上述电话不应包含推销。诈骗者、垃圾邮件发送者和机器人电话会忽略谢绝拨打名单，但它可以帮你屏蔽掉想要骚扰你的拨号者。\n\
  \n该注册接受手机和座机电话注册。要通过电话注册，请拨打 `888-382-1222`。你必须从想要注册的电话号码拨打。要在 [`www.donotcall.gov`](https://www.donotcall.gov)\
  \ 在线注册，你需要回复确认邮件。如果你已经注册了手机或其他号码，无需重复注册。一旦注册，该号码将一直留在名单中，直到取消注册或号码停用。\n\n#### 根据，根据\
  \ 2017 年 3 月 24 日《洛杉矶时报》的文章，诈骗者正在骗受害者在电话中口头授权，然后利用受害者的话——实际上只有一个词——来对付他们。\n\n在诈骗发生时，机器人电话会联系你，在你接电话后，机器人电话会假装连接有问题并询问“你能听见我吗？”\n\
  \n不要说“是”。\n\n根据《洛杉矶时报》，全国各警察部门都警告过，提供肯定的回答可能会被编辑，使得看起来你许可了某项购买或其他交易。录下的“是”还可能被用于拒绝任何后期投诉的无辜客户的退款。\n\
  \n\n\n\n“如果有人打电话并问‘你能听见我说话吗？’不要回答‘是’，”美国商务局（Better Business Bureau）建议道，“直接挂掉。随着公众的警觉，诈骗者会改变策略，因此要警惕其他旨在诱导简单‘是’字回答的问题。”\n\
  \n# 一响定音\n\n有些电话垃圾机器人被设计为拨打目标号码并只响一次或两次，希望目标的好奇心战胜理智，从而回电查看是谁在联系他们。不要回拨那种只响一次的电话，即使该号码看起来很熟悉。首先，这会让机器人知道该号码有一个真人。其次，它还让诈骗者知道目标是那种会回拨未知号码的人，是进一步针对的极佳候选对象。此外，你回拨的号码可能会向你收取高昂费用，例如\
  \ `900` 号或其他向拨号者收费的前缀。\n\n让它进入语音信箱，然后你就可以删除它了。\n\n## Jolene 的故事\n\n中国骗子冒充警察和 DHL，以此掏空受害者的投资组合。\n\
  \n![](img/00067.jpeg)\n\n注意：这篇比本指南中的其他案例研究要长，它揭示了骗子在诈骗中操纵的心理。\n\n最近，我的一位在美国中国朋友接到一个电话，对方自称是国际快递公司\
  \ DHL 华盛顿特区的办事处。DHL 类似于 `FedEx` 或 `UPS`，在海外（包括亚洲）非常活跃。“代理人”告诉我的朋友“Jolene”，上海海关没收了一个以以\
  \ Jolene 名义寄出的、装满护照和信用卡的包裹。\n\n[我改了我朋友的名字以保护她的身份（并以此向多莉·帕顿表达一些谢意）。这篇文章很长，但是因为这是一个相当漫长的骗局。请关注我，看看这场离抢夺\
  \ Jolene 全部积蓄仅差两天之实的详细过程。]\n\nJolene 告诉 DHL 代理她没有发送过任何包裹。电话那人建议这可能是身份盗窃，Jolene 应该联系上海警察获得一份等于宣誓的文件，声称她是身份盗窃的受害者，并将其交回\
  \ DHL。（假的）DHL 代理将 Jolene 转接到了长宁区的派出局，那是包裹的收件地址所在地。当地警察对此此身份盗窃案有管辖权。\n\n一个自称“李警”的男人接了电话。Jolene（惊慌地）解释了发生了什么，[这非常、非常聪明]，李告诉\
  \ Jolene 去查一下长宁派出所的电话号码（她认为 DHL 代理把她转接到了那儿），他会在几分钟后用那个列出的号码回电给她，以便她确认他执法人员的身份。假警察挂了电话。\n\
  \nJolene 在 Google 上搜索了中国的派出所，看到了他们的真实号码（`+86-21-6290-6290`）。与此同时，李伪造了同一个电话号码，使其在\
  \ Jolene 的主叫显示上看起来是合法的，并回了了电话。伪造电话——假装从另一个号码拨打——是非常容易的，也被诈骗者和推销员广泛使用。自然，在那种恐惧甚至可能处于恐慌的状态下，Jolene\
  \ 相信她自己正在与真正的当局交谈。\n\n李警/糟糕的李先生（注意我的双关）要求 Jolene 提供她的中国身份证号，以便他从总部调取相关信息。李说，根据他们的记录，Jolene\
  \ 是广为人知的中国郑少东国际洗钱案中的一名要嫌疑人，该案涉及约 7000 名嫌疑人和数百万美元。十年前，郑少东曾是一名高级公安官员，负责调查经济犯罪（讽刺的是），因收受超过\
  \ 100 万美元贿赂被定罪。2010 年，中国法院对他判处死刑缓，改为无期徒禁。\n\n根据 Jolene 为本文提供的书面笔记，李说郑承认了，并指认 Jolene\
  \ 为同犯，利用她的个人账户帮助他洗钱。郑声称 Jolene 收取了约 `$14,000`（98,000 人民币）的费用。此外，李说，中国的受害者是那种会回拨未知号码的人，是进一步针对的极佳候选对象。\n\
  \n### 恐慌模式：1000%\n\n根据 Jolene 为本文提供的书面笔记，李说郑承认了，并指认 Jolene 为同犯，利用她的个人账户帮助他洗钱。郑声称\
  \ Jolene 收取了约 `$14,000`（98,000 人民币）的费用。此外，李说，中国的受害者是那种会回拨未知号码的人，是进一步针对的极佳候选对象。\n\
  \n（等等，我将只提供最终的版，不包含内部重复笔记。）\n\n\n\n检察官 `Qian Sun`（也是这场骗局中的第 4 或第 5 个人，取决于其中是否有人还充当了虚假的\
  \ DHL 代理）同意申请进行“优先调查”，前提是（请听好……重点来了……）Jolene 要清算她所有的投资并将资金转入她的支票账户。根据 `Sun` 的说法，中国政府只有在其系统中查询和调查银行账户的能力，而没有投资账户。\n\
  \n即使生活在美国土地上，Jolene 也担心中国政府会以某种方式将她绑架，在她头上套上黑袋，把她扔进辆没有牌照的面包，飞回中国，然后关进监狱。（她的脑海中充满了各种“扔”的动作，因为她恐惧引发的想象力在疯狂生长）。请记住，受贿官员\
  \ `Zheng Shaodong` 被判处无期监禁，考虑到 Jolene 一直遭受的所有操纵，她对中国当局无情追捕的恐惧是可以理解的。\n\n在一次电话采访中，Jolene\
  \ 说：“那种恐惧……太具有压倒性了……因为我是说我的一生都在这里（在美国）。后果，被捕、几乎失去一切，以及对我家的影响，是无法想象的。我想这基本上[他们]剥夺了我所有逻辑思考的能力。他们真的掌握了如何从情感上操纵你。”\n\
  \n于是……Jolene 清算了她**所有**投资账户，将收益存入她的支票账户，并焦虑地等待着进一步的指示。\n\n## Jolene 迄今为止的表现评估……\n\
  \n根据 `Healthline.com` 上的一篇文章《你应该了解的悲伤阶段》，悲伤的五个阶段是：否定、愤怒、讨价、抑郁，最后是接受。\n\n文章指出：“并不是每个人都会经历这五个阶段，而且你可能并不是按照这个顺序经历它们。”“每个人的悲伤都是不同的，所以你可能在讨价阶段开始应对损失，然后发现自己进入了愤怒或否定阶段。你可能会在五个阶段中的某一个阶段停留几个月，但完全跳过其他阶段。”\n\
  \nJolene 经历了否定（这是完全正确的做法）。如果她能一直处于坚决、暴力的否定中那就好了，但这个骗局并不允许她留在那那里。这个骗局包装得太完美、太严密了，让人无法不中招（至少最初是这样）。\n\
  \n愤怒？当然。有人决定（据称）盗取了她的身份并毁了她的生活。谁会不愤怒呢？\n\nJolene 试图与调查她的友善警察讨价，试图与他们进行理性的沟通以让他们理解并接受她的清白，但无济于事。\n\
  \n抑郁？毫无疑问。她孤单一人，被警告不要向任何人透露，担心自己在等待审判期间被捕并关进中国监狱，还错误地与一名被判处无期监禁的腐败前官员联系在一起。\n\n\
  接受。Jolene 按照警察的指示清算了她所有的资产，希望他们能继续调查，证明她的正直清白，并在某一天将这场噩梦抛在过去。Jolene 的接受将成为她的毁灭。\n\
  \n## 但接着……\n\n那天晚上，Jolene 和她的女性朋友“Sam”聊了话，并将一切倾出来。Jolene 真的担心自己会被绑架，而且没人知道她发生了什么。她给了\
  \ Sam 她的家里钥匙和车钥匙副本、她父母的联系方式以及与她案件相关的所有信息。\n\n在克服了最初的震惊后，Sam 回家立即与丈夫“Diego”谈了话。从客观来看，他们的直觉告诉他们身份盗窃的故事是合理的，但让\
  \ Jolene 清算资产的要求却完全不合逻辑。\n\n通过反推，他们在 Google 上搜索了 Jolene 提供的信息，发现其中一个电话号码在众包诈骗网站上被标记为诈骗电话。意料之中，发现这一切只是一个恶毒的童话让\
  \ Jolene 立即如释重负。\n\n如果 Jolene 没有向她的朋友透露，接下来可能发生的情况是警察告诉 Jolene，已经聘请了一家全球性律师事务所在调查期间对账户进行托管。他们很可能会提供看起来很真实的\
  \ `PDF` 文件，如授权信或其他伪造的律师事务所抬头的正式法律文件，证明他们受中国政府委托作为受托人，保护像 Jolene 这样的人的资产安全。文件将会有律师事务所真实的中国地址，并可能使用该事务所某位真实合伙人的名字签名。当然，还有\
  \ Jolene 应该存款资金的汇款说明。\n\n## 步骤拆解\n\n在 Maria Konnikova 所写的令人大开界的书籍《心理游戏：我们为什么每次都会上当……[25]](#part185.html#_ftn25)》中，记者兼职业扑克玩家拆解了精心骗局的关键步骤。\n\
  \n### 铺垫（Put-Up）\n铺垫主要是关于骗子（被称为 Grifter）如何选择受害者（被称为 Mark）：了解我们是什么样的人，我们关乎什么，什么能触动我们，以及什么让我们感到无所谓。\n\
  \nJolene 是一个在美国工作的中国公民，在一家大公司拥有良好的头衔和资历背景。骗子们可以很容易找到她的住址，无论她的社区是否富裕。\n\n### 执行（The\
  \ Play）\n执行是骗子首次钩住我们并开始获得我们信任的时刻。这首先是通过情感实现的。一旦我们的情感被捕获，一旦骗子足够近距离地观察我们并识别出我们想要什么，感受就会接管思维，至少在在那一刻是这样。\n\
  \n\n\n\n### 3. 绳索 (The Rope)\n“绳索”是骗局的始与终：康尼科娃（Konnikova）写道，在将我们定为目标并通过“一些花哨的情绪手段”降低我们的防御后，就是时候进行真正的说服推销了。\n\
  \nAlpha 提议（alpha proposal）是增加某事的吸引力，这是更常见的骗局。Omega 提议（omega proposal）则是从另一个角度减少阻力。\n\
  \n在 Alpha 阶段，骗子会竭尽全力让他们的提议（无论是什么）更具吸引力。他们会润色虚假机会的背景故事——为什么这是一个如此棒的机会，为什么你（目标）是做这件事的完美人选，每个人将获得多少收益等等。\n\
  \n在 Omega 阶段，你（是的，是你，而不是骗子）要让一个请求或提议看起来如此简单，以至于无需思考——我为什么不这样做呢？我会有什么损失？这种并置法被称为说服的“趋近回避模型”：你通过让我想要接近它，并减少我可能规避它的任何理由，来说服我。\n\
  \n在乔琳（Jolene）的情况下，电话那头“和蔼”的警察愿意调查她对那场即将毁掉她生活的巨大诈骗案的清白主张。当然，她是无辜的，事实上是 100% 的无辜，乔琳会坚持这么认为。她如何才能让这些人相信她呢？\n\
  \n### 4. 故事 (The Tale)\n当“故事”被讲述出来时——也就是说，我们被告诉我们个人将如何获益——这就不再真正是在向我们讲述了。我们现在才成了讲述故事的人。一个高明的骗子一直在为了这一刻而努力，即那个从“好得不可置信”转变为“实际上，这完全合乎逻辑”的时刻：他说服目标相信：“我是非凡的，我理应得到。这不是好得不可置信，这正是我应得。变化可能不到\
  \ 1%，但话说回来，我是一个不到 1% 的人。”\n\n乔琳知道自己是无辜的，她只需要等别人也看到这一点。\n\n### 5. 说服者 (The Convincer)\n\
  “说服者”让你看起来自己赢了，一切都按照计划进行。你的投资正在获利。你的皱纹正在消失，体重在下降。你下注的马（无论是字面上的还是比喻上的）赢了。“故事”让我们充分意识到了自己非凡的特质，以及现在似乎正在发生的事情：我们对这个游戏的最初的信任确实是合理的。\n\
  \n没有任何一个有自尊的骗子是完全的空谈。这需要一些真实的东西来锚定这一切。仅仅在那一刻，骗子需要他的目标感觉自己手里握着一张中奖彩票。\n\n幸运的是，乔琳在到达这一点之前通过与朋友们讨论情况制止了自己，朋友们帮助她重新校准了现实。如果她没有这样做，骗局可能会持续持续如下：\n\
  \n### 6. 崩溃 (The Breakdown)\n从骗子的角度来看，这是大赚的理想时机：就在你的目标最深信的时候拔掉插。目标已经尝到了胜利的果实，并对自己的洞察力和能力赞誉有加。他已经上钩了。如果骗子让他继续赢下去，对他来说没有额外的好处。毕竟，归给目标的一切，对骗子来说都少了一。相反，如果骗子现在让目标输掉呢？至少输一点？换句话说，当现实突然不符合我们建立的预期时，我们该怎么办？\n\
  \n虚假警察可能会告诉乔琳，检察官不相信她是清白的，现在正更严厉地调查她。无论崩溃如何发生，乔琳都会收到一些坏消息，让她恐慌和恐惧剧增，使她更加绝望地解决这场噩梦。\n\
  \n### 7. 投送 (The Send)\n这是骗局的最后一部分，受害者被重新投入，被要求向骗子的计划中投入越来越多的金钱、时间和资源。\n\n在乔琳的案例中，骗子/虚假警察可能会回到乔琳身边，声称发现她还有其他钱在向他们“隐藏”着，迫使她出售其他资产并将收益汇入她的支票账户。或者，她可能必须支付，例如\
  \ 20,000 美元作为预付法律费。\n\n### 8. 收割 (The Touch)\n骗局最终结出果实，目标被完全、不可挽回地割了韭。目标被夺光了所有家当。骗子得到了他想要的一切，并准备好从我们的生活中消失。\n\
  \n如果乔琳将她的全部积蓄汇入那个虚假的托管账户，骗子就赢了。\n\n### 9. 甩场 (The Blow-Off)\n根据康尼科娃的说法，一旦骗子拿到奖品，就必须尽快摆脱目标。“甩场”通常是骗局的最后一步，是骗子在游戏结束后顺滑消失。\n\
  \n乔琳会突然发现自己无法联系上那些虚假警察，Skype 账号不再接听，她日益恐慌的消息没有得到回复。如果她随后决定拨打警局列出的电话，她会收到真实警察告知，那里没有工作的李督察、张督察或小督察，也没有孙检察官。（也许确实有叫这些名字的人在那里工作，但他们并不是乔琳一直在交道的那些冒充者，他们的身份被诈骗者盗取了）。\n\
  \n### 10. 设局 (The Fix)\n如果目标没有掉以轻心，骗子可能还会采取最后一步：设局，即骗子推迟执法部门的介入，以防止目标提出投诉。\n\n如果骗子决定不甩掉乔琳，他们可以轻易拖延几个月，甚至几年，因为调查需要时间。但别担心，乔琳，他们正在处理，而且看起来很有戏……\n\
  \n## 如果这种事情发生在你身上该怎么办（是的，你！）\n\n如果这是一部电影，这个骗局的开头可能会被起一个戏剧化的名字。震惊与震慑。180 度大转弯（让目标倒置）。也许是击击。无论叫什么，目标都是让目标陷入恐慌，以至于他们停止思考。目标变得\
  \ 100% 反应性，试图理解一个完全不合逻辑的情况。这里是一些重要的步骤，可以防止你成为被甩掉的目标。\n\n\n\n\n\n根据 Gonzales 的说法，法国作家、记者兼飞行员安托万·德·圣埃克苏佩（他也写过经典儿童读物《小王子》）观察到，在危机发生的时刻，你唯一允许自己产生的念头应该是关于你的下一个正确行动。\n\
  \nJolene 那些更客观的朋友通过简单的在线搜索，就发现了 Jolene 所错失的清晰思路，并能看出这些事情在逻辑上根本不通。警察可不会告诉人们变卖资产。\n\
  \n找律师。如果 Jolene 的身份确实被盗用来向中国发送护照，并且有人以她的名义开设银行账户欺骗他人，那么法律代表将至关重要。任何稍微像样的律师在第一次咨询时就应该（或已经）看穿这个骗局。如果骗局已经进行到那种程度，律师理应阻止她将资金汇入所谓的“`escrow`”账户。\n\
  \n即使一个人第一个联系的律师并不精通相关领域，律师也会经常将客户介绍给其他律师。第一位法律顾问应该能够引导潜在受害者找到另一可以提供帮助的律师或律事务所。如果有人不认识任何法律专业人士请教，他们可以在\
  \ Google 上找到一家当地律所并请求初步电话咨询。\n\nJolene 曾收到中国官员的警告，不要向任何人讨论她的案件，但在不涉及过多细节的情况下，Jolene\
  \ 原本能够提供问题的概括，然后判断她找到的律师是否适合为她提供建议。\n\n诚然，请律师是需要付费的。初始对话可能需要花费数千元，但在 Jolene 的情况下，这笔费用仅是她即将被抢夺金额的一小部分，与失去全部积蓄相比，这是一笔相对很小的代价。即使她没有被那些骗子骗取，如果这是真的，如果中国当局确实在调查她，你敢赌她一定会想要有一个随时待命的律师。\n\
  \n## 后果\n\nJolene 说：“我的意思是，老实说，我认为如果这种事再次\\[再次\\]] 发生在我身上，我可能会再次掉进这个陷阱。就好像比，我不知道会在哪个节点选择采取不同的行动，而不是更早地联系\\\
  [我的朋友\\]]？”\n\n她联系了中国的真实执法部门，包括`常宁`警方，告知他们犯罪分子正在冒充他们。警察不太可能抓到这些骗子（更不用说知道他们是谁了），但报告这些犯罪是值得且重要的，这样执法部门就能意识到网络犯罪的严重性、范围以及新的变体。而且知道自己已经向真正的执法部门举报了这些诈骗者，可能给了她些微的慰藉。\n\
  \n出乎意料的是，Jolene 对自己的在线活动变得更加警惕。她确实想过是否有针对经历过类似经历的人的支持小组，并搜索了一下，但随后就作此了。\n\nJolene\
  \ 最终算是个幸运的。虽然她设法没有让积蓄被抢光，但 Jolene 在股市低迷时变卖了投资组合，并产生了税务影响。“仅仅”是亏损卖出并欠下`IRS`（美国国税局）的钱，是\
  \ Jolene 乌云中一个扭曲的慰藉，但她接受了。这是一次昂贵的教训，但幸好它不是毁灭性的。\n\nJolene 想分享她的故事让公众获得更多信息，希望她这笔昂贵的教训能对保护他人有所价值。\n\
  \n## 第 11 章 – 加密你的设备\n\n对你的设备和通信进行加密将使你的信息远离窥探的目光，无论是普通的黑客，还是包括执法部门在内的更有组织的成员。\n\
  \n### 加密设备无法做到的\n\n如果你的电脑或手机上已经运行了间谍软件且设备被盗，那么间谍软件的黑客（可能与偷电脑的人不是同一个）可能已经在监控你的活动并窃取你的信息。加密无法阻止他们，因为他们并不是试图读取你电脑系统之外的驱动器，他们已经在系统内部了。尽管如此，如果你的设备没有默认设置加密，那么在设备丢失时，加密可以提供重要的安全感。\n\
  \n以下是你可以检查的方法：\n\n### 电脑和笔记本电脑\n\n#### Apple MacBook\n\n苹果较新的 MacBook（2018 年后销售的）配备了`Apple\
  \ T2 安全芯片`，内置加密功能，因此只要你的电脑需要启动密码，你就大功告吉了。\n\n旧款的 MacBook 依赖`FileVault` 来加密数据。你可以进入`系统偏好`，点击`安全性与隐私`，点击`FileVault`\
  \ 选项卡，然后点击`开启 FileVault`来检查你的电脑是否已安全。\n\n#### Microsoft Windows\n\nWindows 使用 `BitLocker`\
  \ 来保护电脑硬盘。在`设置`中，搜索“`加密`或`BitLocker`”并按照说明操作。`BitLocker`的设置将为你提供一个密钥（一长串字符），并给你保存该信息副本的选项。请以数字和打印格式各保存一份。我有三个安全位置来存储我的确认码：物理存储在纸质上（整齐地存放在我的个人网络安全文件夹中），存储在一个专门为此用途的`USB`\
  \ 优盘上，以及在云端备份中。我假设当我真的需要使用那些代码时，可能处于高度压力的时刻，因此我想让这些关键信息触手可及，而不需要费力记忆把它们存在了哪里。\n\n\
  ### 手机和平板\n\n手机上的加密原理是类似的。普通的攻击者（即非政府情报机构）（通常）无法在没有加密密钥的情况下接入数据。大多数情况下，手机小偷可能对出厂重置手机或抹除手机并出售设备感兴趣，但保护你的信息是有意义的。\n\
  \n此外，如果你还没有为手机设置密码或 PIN 码，现在是时候了。在`设置`菜单中，查看你的`安全性`或`显示/锁定屏幕`设置（不同设备措辞可能不同），并设置一个具有挑战性的密码或\
  \ PIN 码。你应该设置手机在启动时需要密码或 PIN，以及从睡眠中唤醒或在短暂闲置后需要。我将我的手机设置为在闲置 10 分钟后需要 PIN。如果没有密码或\
  \ PIN 码来保护手机，小盗完全可以访问你的所有数据，因此加密将无用武处。\n\n#### iPhone 和 iPad\n\n苹果的 iPhone 在屏幕锁定时默认会对数据进行加密，前提是\
  \ iPhone 需要密码或 Touch ID 才能解锁。如果你没有在手机上设置密码或 Touch ID，那么添加一个（或两者）是重要的，以确保在设备被他人获取时，你的数据能得到保护。\n\
  \n#### Android 手机\n\n要查看手机是否已加密，请进入手机的`设置`并搜索“`加密`”。在这里你会看到手机手机已加密。如果你的不是，请开启加密并按照提示操作以保护设备。并确保你的手机需要密码或\
  \ PIN 码来解锁。\n\n\n\n\n\n病毒在计算机与计算机之间传播，安装会影响你设备运行方式的代码，并可能导致严重损害，例如损坏重要数据或破坏文件。恶意软件会干扰、损坏或允许对设备或整个系统（如网络）的访问。间谍软件会监控你的活动并收集你的信息，例如银行账户详情或用户名和密码。勒索软件会阻止对计算机或设备的访问，直到支付赎金以获得释放，但存在支付了赎金却没有获得释放的风险。\n\
  \n总而言之，这些都是非常讨厌的东西，其目的是让受害者的生活变得痛苦。\n\n计算机系统内置了基础级别的保护，但现实世界表明，持续的黑客、诈骗者和恶徒仍然经常找到渗透计算机、设备和整个系统的方法。他们可能变成滋扰，也可能造成毁灭性的破坏。养成良好习惯所需的时间以及有时的少许资金成本，远比由于中断、数据损坏或针对你的针对性攻击而导致的价值工作和数据的风险、挫败感和潜在损失。\n\
  \n## 更快速、更简单的解决方案\n\n安装一个全面的保护包，例如 `Norton 360 Deluxe`。\n\n`Norton 360 Deluxe`\n\
  \n![](img/00022.jpeg)\n\n为了你的在线活动提供全面的保护，简单的答案是购买并安装 `Norton 360 Deluxe`。`Norton\
  \ 360 Deluxe` 为多达五台 PC、Mac、智能手机或平板电脑提供保护。它具有一系列广泛的保护功能、100GB 云备份、密码管理器和其他实用的功能。\n\
  \n我认为这是安装后市面上最强有力的解决方案之一。我个人在生活和职业生活中都使用 `Norton 360 Deluxe`，并用于家人的在线保护。该软件的订阅价格每年约为\
  \ 40 美元，可以保护五台计算机或移动设备。\n\n或者，如果你愿意花时间和精力构建自己的防御体系，你至少应该安装一个杀毒扫描程序和恶意软件删除工具。以下供应商提供免费版和付费版。\n\
  \n### 添加杀毒扫描程序\n\n杀毒程序是实时扫描器，用于快速检测试图感染你设备的恶意文件的存在，或发现已存在于设备上的坏程序。良好的杀毒程序还可以帮助防止勒索软件感染你的计算机，并防止钓鱼尝试通过。杀毒程序会发现并阻止坏问题，但不会删除它们。\n\
  \n![](img/00068.jpeg)\n\n#### BitDefender 杀毒与恶意软件删除\n\n[`www.bitdefender.com/solutions/free.html`](https://www.bitdefender.com/solutions/free.html)\n\
  \n`Bitdefender` 的 `Antivirus` 免费版也包含恶意软件删除，这是一个很好的二合一解决方案。\n\n![](img/00069.jpeg)\n\
  \n#### AVG 杀毒\n\n[`www.avg.com/`](https://www.avg.com/)\n\n`AVG` 免费版可以阻止病毒和恶意软件，但不删除现有的恶意软件。\n\
  \n![](img/00070.jpeg)\n\n#### Avast 杀毒\n\n[`www.avast.com/`](https://www.avast.com/)\n\
  \n`Avast` 与上述一样提供实时病毒保护。\n\n### 添加恶意软件删除程序\n\n恶意软件删除程序可以隔离并移除间谍软件、勒索软件和其他恶意软件。Windows\
  \ 和 Apple 在其平台中内置了反病毒和反间谍安全功能，但恶意软件总有可能溜进你的计算机中。幸运的是，有很多免费和付费的解决方案可以扫描你的设备，寻找旨在伤害你的程序。付费升级版将允许你对设备进行自动定时扫描。以下是一些受欢迎的：\n\
  \n![](img/00068.jpeg)\n\n#### BitDefender 杀毒与恶意软件删除\n\n[`www.bitdefender.com/solutions/free.html`](https://www.bitdefender.com/solutions/free.html)\n\
  \n如上所述，`BitDefender` 可以删除恶意软件，并阻止病毒感染你的计算机。\n\n![](img/00071.jpeg)\n\n#### Malwarebytes\
  \ 恶意软件防护\n\n[`www.malwarebytes.com/`](https://www.malwarebytes.com/)\n\n![](img/00072.jpeg)\n\
  \n#### SuperAntiSpyware\n\n[`www.superantispyware.com/`](https://www.superantispyware.com/)\n\
  \n![](img/00073.jpeg)\n\n#### Microsoft 安全扫描器\n\n[`docs.microsoft.com/en-us/windows/security/threat-protection/intelligence/safety-scanner-download`](https://docs.microsoft.com/en-us/windows/security/threat-protection/intelligence/safety-scanner-download)\n\
  \n### 设置自动备份\n\n如果勒索软件绕过了你的杀毒和恶意软件删除保护，保护你自己的最佳方法是在文件发生更改时，持续对你的设备和重要文件进行备份。这可以在后台自动完成，因此一旦设置妥当，你甚至不需要关注它。你可以将宝贵信息（以及猫咪表情包或任何让你快乐的东西）备份到与计算机分离的硬盘或云端。我这两种都用，并建议你也这样做。\n\
  \n将文件备份到独立的硬盘上是方便的，因为备用硬盘通常在你自己手中。如果你需要快速检索文件，这很方便，尽管这不是一个万无一失的解决方案。取决于你运气有多糟糕，物理驱动可能会丢失、被盗、损坏或销毁。但当它们正常工作时，手头有一个会很好。\n\
  \n云存储可以采取许多不同的形式。你的设备可能提供一些免费存储空间，并可能可以升级以获得更多容量。\n\n![](img/00074.jpeg)\n\n####\
  \ Backblaze\n\n这是我主要的备份服务，多年来一直无缝地保护我的文件。我定期检查状态，它一直保持更新。1TB 存储每月 6 美元。\n\n![](img/00075.jpeg)\n\
  \n#### Apple iCloud\n\nApple 的 `iCloud` 同时适用于 Apple 设备（iPad、iPhone、Mac 等）和 PC。Apple\
  \ 提供 5GB 免费存储，并可以升级到 50GB（每月 1 美元）、200GB（每月 3 美元）或 2TB（每月 10 美元）。\n\n![](img/00076.jpeg)\n\
  \n#### Microsoft OneDrive\n\n你可以免费在 `OneDrive` 中备份 5GB 文件，或通过 `Microsoft 365` 订阅备份高达\
  \ 1TB。单用户 `Microsoft 365` 许可证的价格每年约为 70 美元，家庭订阅每年 100 美元，两者都包含 `Office` 程序。\n\n\
  ![](img/00077.jpeg)\n\n#### Google Drive\n\nGoogle 为 `Google Drive`、`Gmail` 和 `Google\
  \ Photos` 提供 15GB 免费空间。更多存储空间可以升级到 `Google One`，它提供 100GB（每年 20 美元）、200GB（每年 30\
  \ 美元），最高可达 10TB 存储（每年 600 美元，但那是巨大的存储空间）。Android 和 iOS 用户都可以使用 `Google Drive` 的\
  \ 15GB 免费空间用于 `Google Photos`、`Google Calendar` 和 `Google Contacts`。\n\n![](img/00078.jpeg)\n\
  \n#### 使用 Amazon Glacier 进行长期存储\n\n`Amazon S3 Glacier` 和 `S3 Glacier Deep Archive`\
  \ 是用于数据存档和长期备份的安全、低成本 Amazon 存储。它们的界面需要一些学习，但对于存档重要文件来说是一个非常可靠的备份。\n\n### 如果你的 Windows\
  \ 或 MacOS 故障\n\n有时病毒或其他问题会导致你的计算机无法启动。为了保护自己，了解如何恢复操作系统是一个非常好的主意。\n\n创建 Windows\
  \ 恢复驱动器\n\n\n\n\n\n恢复驱动器有助于在硬件故障时重新安装 Windows 操作系统，它与常规文件备份不同。创建恢复驱动器是一个好主意。这样，如果你的\
  \ PC 遭遇了硬件故障等重大问题，你就可以使用恢复驱动器重新安装 Windows。Windows 会定期更新自身以提高安全性和 PC 性能，因此建议每年重新创建恢复驱动器。个人文件和任何随\
  \ PC 附带的应用将不会被备份。你可以在 Windows 设置中找到说明，并需要一个至少有 16 GB 内存的 USB 优存盘。\n\n# Apple 的 macOS\
  \ 恢复程序重新安装 Mac 操作系统\n\nmacOS 恢复中的实用程序可以帮助你从 Time Machine 恢复你的 Mac、重新安装 macOS、获取在线帮助、修复或擦除硬盘。macOS\
  \ 恢复是你的 Mac 内置恢复系统的一部分。你可以从 macOS 恢复程序启动并使用其实用程序从某些软件问题中恢复，或在你的 Mac 上采取其他操作。如果你遇到需要从\
  \ macOS 恢复程序启动的硬件问题，请打开你的 Mac 并立即按住这两个按键：`Command (⌘)` 和 `R`。在恢复模式下，你仍然可以使用 Safari\
  \ 浏览网页并为你的 Mac 寻找帮助。其中包含了指向 Apple 支持网站的链接。\n\n### 清理垃圾箱\n\n当你在 PC 或 Mac 上删除文件时，该文件会被放入回收站或垃圾箱文件夹。当你清空回收站或垃圾箱时，文件会从文件夹中消失，但实际上它仍然留在你的电脑上。它在视觉上被隐藏了，直到另一个文件需要它所在的磁盘空间并覆盖它为止。在它被覆盖之前，如果有人想知道你的电脑上真正有什么，删除的文件是可以被恢复的。要完全移除你删除的文件，必须用一个新文件的\
  \ `0s` 和 `1s` 进行覆盖。\n\n磁盘清理程序可以完全删除已的文件。它们还能清理可能占用磁盘空间并减慢电脑运行速度的垃圾和临时文件。免费版本通常需要你手动运行清理，而付费版本提供定期计划的清理以方便方便。\n\
  \n![](img/00079.jpeg)\n\n### Windows 版 Ccleaner\n\n[`www.ccleaner.com/`](https://www.ccleaner.com/)\n\
  \n![](img/00080.jpeg)\n\n### Mac 版 CleanMyMac\n\n[`cleanmymac.com/`](https://cleanmymac.com/)\n\
  \n# 第 13 章 —— 在途中\n\n除了在第 1 章“保护你的资产”中讨论过的保护你的物理资产外，当你旅行或在路上工作时，有几个简单但极具实用的步骤可以采取，以保护你的隐私和财产。\n\
  \n## 尽可能使用你的手机热点\n\n诚然，除非你有非常好的流量套餐，否则不要流媒体播放《权力的游戏》全部八季，但在尽可能的情况下，使用手机手机热点比使用公共\
  \ WiFi 是更好的选择。拥有一个强有力且难以破解的热点密码非常重要，就像你（现在）在家里 WiFi 上做的那样，这样附近的的黑客（他们故意在公共聚集场所徘徊）就无法访问。\n\
  \n而且，给你的热点起一个无法识别你个人身份的名字。\n\n## 清楚你连接到了谁\n\n黑客向毫无防备的用户提供自己的公共 WiFi 并不罕见，其名称听起来很官方，例如\
  \ `Terminal 4 WiFi` 甚至直接是 `Free WiFi`。连接的人信息将受到监控和窃取。如果在寻找公共 WiFi 时有疑问，请寻找打印的标志，或询问客服人员该设施官方\
  \ WiFi 的名称。\n\n### 30 秒读懂虚拟专用网络 (VPN)\n\n为了解释什么是虚拟专用网络（或 `VPN`），让我们先从解释没有 `VPN`\
  \ 是什么样的开始。想象浏览互联网（和所有人一起）就像在公路上行驶汽车，从 `Point A`（你的电脑）到 `Point B`（任何网站）。使用 `VPN`\
  \ 就像是在这些点之间建立了一条加密隧道，保护你的数据不被窥视。使用 `VPN` 可以隐藏你的 IP 地址，使其他用户（如黑客、互联网服务提供商 ISP 等）无法看到你访问的网站内容。此外，`VPN`\
  \ 还可以帮助绕过地理限制，让你访问某些地区无法使用的服务。简单来说，`VPN` 是你在线活动安全的一道盾牌。\n\n在没有 `VPN` 的情况下，你的数据就像是在裸裸的公路上行驶，很容易被拦截或监听。特别是在使用公共\
  \ WiFi（如咖啡馆或机场时，黑客可以轻易嗅获你的流量。使用 `VPN` 后，你的数据会被加密，即使数据被截获，攻击者也无法破解其中的内容。这对于保护你的银行账户、密码和个人隐私至关重要。此外，`VPN`\
  \ 还可以更改你的虚拟位置，让你能够访问其他国家的内容。总而言之，`VPN` 是在现代数字时代保护个人隐私和确保网络安全的重要工具。\n\n\n\n\n\n不要在公共场所让设备无人看管，包括你离开它们去充电时，因为它们可能会被盗窃或篡改。你可以使用一根足够长的充电线（例如\
  \ 10 英长的 USB 线），让它能从公共插座延伸到你坐的地方，或者使用一根轻便的扩展线，这样你就能随时靠近电源。使用扩展线还能在大家争抢那仅有的两个珍贵墙壁插座时为你提供更多插口。如果你觉得合适，也可以随时与他人分享你的插座。\n\
  \n## 跟踪你的包包\n\n我在我的公文包里放了一个 `Tile` 追踪设备，在我偶尔使用的较小的电脑包包里又放了一个。为了稳妥起见，我还在钱包里放了一个信用卡大小的\
  \ `Tile` 追踪器。这些设备非常非常小，可以很容易隐藏在包包的褶皱或口袋中。`Tile` 销售的多只装组合设备，价格相当亲民，而且 `Tile` 应用程序也易于设置和使用。\n\
  \n每个 `Tile` 都需要位于具有位置服务的设备标准蓝牙范围内，以便将其位置传输给应用程序。这意味着 `Tile` 无法实时追踪移动中的物体，除非范围内有一个随它移动的设备，而这正是\
  \ `Tile` 众包网络的价值所在。每当当在手机上运行 `Tile` 应用程序的人经过你的 `Tile` 范围时，他们的设备就会自动且匿名地向你的应用程序更新你的\
  \ `Tile` 的最新位置。随后你将收到你的 `Tile` 最后已知位置的通知，这样你可以返回那里尝试寻找并取回它。\n\n![](img/00085.jpeg)\n\
  \n## 固定你的包包\n\n旅行是一件压力很大的事，尤其是使用公共交通工具时——机场、火车，甚至是轮渡。首先是登机前往往漫长的等待，然后是旅程本身，最后是混乱的到达流程。当我旅行时，我总是带着大量的电子设备，通常还有电脑和许多高端摄影设备，尽管我买了保险，但在途中丢失装备可能会彻底摧毁我处理旅行目的之任何项目的工作能力。我还倾向于手里提着多个包旅行（除了飞行时必须托运的行李之外），因此时刻保持警惕可能会疲惫。我尝试建立一种检查和平衡机制，来对抗我有时不注意事的倾向。\n\
  \n如果我坐在桌子或座位上等出发，我通常会用一根廉价的行李锁穿过包包的提手，将它们系在一起。（如果你还没有，可以在你所在的任何航站的报刊亭或商店轻松买到）。我喜欢这些线缆锁的轻便和方便，我所做的仅仅是让别人试图带走我的任何一个包包时变得困难。通过将它们连接在一起，拉动一个包包就会引起足够的动静——即使我在椅子上睡着了，也会被这种扰动吵醒。\n\
  \n如果我打算在咖啡馆坐着工作一小时，我会同样这样做。如果我随身没有行李锁，我会确保把腿跨在包包的肩带里。或者，我可能会解开肩带的一端，将其穿过椅子的一个开口，然后将其固定好。当我准备好离开时，再将其解开。这两种方法都很隐蔽，并且能让我专注于工作。\n\
