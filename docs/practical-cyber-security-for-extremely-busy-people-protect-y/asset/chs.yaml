  \nYouTube 隐私投诉表单继续……\n![](img/00144.jpeg)\n\n### 搜索引擎可能不会移除骚扰\n\nGoogle、Bing 和雅虎对于他们将协助从其搜索引擎中移除的骚扰类型有更严格的指南。搜索引擎通常不会移除可能发生的各种在线骚扰。\n\
  \n例如，Google 表示他们将协助移除：\n* 非自愿的显露或私密个人图像，\n* 非自愿的伪色情，\n* 在具有剥削性移除实践网站上关于你的内容，\n*\
  \ 特定的财务、医疗和国家身份信息，以及\n* 带有伤害意图的暴露联系信息（doxing）内容\n\n关于移除上述类别骚扰的具体指令将在下一章提供，第 16 章——非自愿色情/报复色情。\n\
  \n### 设置 Google 提醒\n\nGoogle 提醒 (Google Alerts)\n[`www.google.com/alerts`](https://www.google.com/alerts)\n\
  \n访问上述网站并输入你的姓名，以及可能拼写错误的姓名变体，并设置你希望在 Google 在新文章或新帖子发现你的名字时接收提醒的频率。\n\n![](img/00145.jpeg)\n\
  \n### 利用社交媒体行善。为了你自己。\n\n类似于网络喷子（trolls）可能针对受害者的方式，你也可以反向利用社交媒体来收集骚扰者的信息，目标是收集足够的信息来评估针对你的威胁程度，从而决定保护自己的最佳行动方案。\n\
  \n与信赖的朋友合作，尝试客观地评估针对你的威胁水平，以便你相应地保护自己。你收到的骚扰看起来是针对你的协同行动，还是针对你的注意力更多是个人的且随机的？\n\n\
  在你调查时，请确保将你发现的信息保存为 PDF 或截图，并在文件中保持组织整齐，以防你可能需要向当局提交证据（取决于具体情况，这可能是执法部门，甚至是喷子的家庭、学校或雇主）。最好的做法是在第一次看到任何信息时就将其捕获。不要指望将来还能追溯自己的步骤。追溯步骤可能非常耗时，而且喷子也可能会删除他们的信息。\n\
  \n如果喷子通过社交媒体与你联系，看看你可以收集哪些线索来建立对以下内容的认知：\n1. 他们是谁（个人层面、职业层面、学术层面），\n2. 他们的朋友、支持者和同伙网络，\n\
  3. 他们关注谁或什么（朋友、小组、网站、兴趣，甚至是运动队以缩小地理范围）。\n\n\n\n\n\n让我们在这里明确一点，我并不是鼓励私刑正义。受害者应该拥有与其攻击者相同的工具，以防需要识别那些网络喷子（trolls）。如果你能够获取到那些网络喷子的图像，这里有一些方法可以让你对他们的图像进行反向工程，以收集有关他们的更多情报。至少，知道他们的大致位置可能帮助你判断他们仅仅是远处的骚扰者还是潜在的威胁。你掌握的真实骚扰者的信息越详实，在必要时就能越有效地协助执法部门或其他机构（例如他们的雇主或父母）。\n\
  \n## 反向图像搜索\n\n反向图像搜索可以提供该喷子使用的其他社交媒体的线索，这可以提供关于喷子身份、联系人、所属关系和活动的更多细节。他们是连环喷子者吗？他们的骚扰是否存在某种模式，例如针对特定的女性群体、族裔或职业？\n\
  \n### 使用 Google 搜索图像\n\n使用 `Google Chrome` 浏览器，你可以右键点击图像，弹出 `Google` 的`通过 Google\
  \ 搜索图像`选项。反向图像搜索将显示与你搜索的图片相似的其他图像。`Google` 的功能有用且快速，但并不总是能提供可靠的结果。不过，这是一个很好的开始。\n\
  \n### Microsoft Bing\n\n`Bing` 在其搜索栏中有一个图像图标，你可以在其中选择图像或 URL 进行搜索。\n\n![](img/00148.jpeg)\n\
  \n### Yandex\n\n[`yandex.com/`](https://yandex.com/)\n\n俄罗斯网站 `Yandex` 提供了一个更强大的图像搜索工具，具有强大的面部、风景和物体识别能力。它高度依赖用户生成的内容和社交网络来寻找不同角度拍摄的相似照片。它在处理欧洲或东欧内容方面最强。北美和其他大陆在他们搜索中的内容没有那么丰富，但仍然是你研究中使用的良好资源。\n\
  \n![](img/00149.jpeg)\n\n### TinEye\n\n[`tineye.com/`](https://tineye.com/)\n\n\
  `TinEye` 寻找图像的精确匹配，包括经过裁剪、调整大小或编辑的图像。它通常找不到类似的、多样的图像。\n\n![](img/00150.jpeg)\n\n\
  ### 寻找视觉线索\n\n在第 14 章 – 社交媒体谨慎中，提供了几个可以从照片中辨别出的视觉线索的示例。\n\n如果你发现了网络喷子发布的图像，你能从看到的内容中辨别出什么？他们穿着的能表明任何所属关系、运动队或活动的服装吗？你从背景中辨别出的东西会让你感到惊讶。如果是户外环境，是否有可见的建筑或地标，或者任何地理标记（如河流、道路、标志牌）。\n\
  \n孤立地工作，盯着照片独自寻找真实信息可能会让你感到绝望。与值得信任、有洞察力的朋友或同事合作是一个好主意，他们可以帮助你逐个评估图像的各个元素。然后并在互联网上交叉验证你的直觉，使用基础工具如\
  \ `Google Street View`（谷歌街景）或企业或其他公共场所的照片。\n\n### 调查他们的元数据\n\n反转局势，在网络喷子发布的图像中搜索你能找到的信息。GPS\
  \ 位置、拍摄日期、拍摄照片的人员，甚至拍摄的设备，对于编制全面的个人档案都有帮助。\n\n#### 使用互联网\n\n有很多免费的 `EXIF reader`\
  \ 网站可以显示图像中的信息（如果存在的话）。它们通常允许你提供图像出现的 URL，或者你可以上传图像。在你的浏览器中搜索“EXIF reader”。这些网站通常非常简单，因为它们不需要很花哨就能显示图像中的文件信息。\n\
  \n打印或对显示的信息进行截图以供存档。\n\n#### 在电脑上本地操作\n\n使用你电脑的文件管理器，在电脑的某处创建一个单独文件夹文件夹，可以在那里组织关于网络喷子的信息并下载涉及的图像。右键点击文件并打开`属性`。查看你详细信息`中是否显示了任何信息并记录任何有用内容。\n\
  \n### Adobe Photoshop\n\n你还可以在 `Adobe Photoshop` 和其他编辑程序中查看照片的文件信息。在 `Photoshop`\
  \ 中，转到`文件`然后点击`文件信息`以查看可用详情。\n\n![](img/00151.jpeg)\n\n## 记录你发现的信息\n\n### 如何截图\n\
  \n有几种方法可以截取屏幕用于记录和证据之目的。确保截取 URL、数据信息和其他识别细节，以帮助验证被截取的信息。\n\n以下是你的电脑和智能手机如何截图的方法：\n\
  \n**在 Mac 上**\n\n同时按下 `[Shift]`+`[Command]`+`[4]` 键。截图应保存到你的桌面。\n\n**在 Windows PC\
  \ 上**\n\n同时按下 `[Windows]`+`[PrintScreen]` 按钮。文件将默认保存到 `Pictures>Screenshots` 文件夹。\n\
  \n**在 iPhone 上**\n\n对于带有 `FaceID` 的 iPhone，同时按下`[侧边按钮]`和`[音量增大]` 按钮。\n\n对于带有 `TouchID`\
  \ 和侧边按钮的 iPhone，按下侧边按钮。同时按下`[侧边按钮]`和`[主屏幕]`按钮。\n\n**在 Android 设备上**\n\n同时按下 `[电源键]`和\
  \ `{音量减}` 几秒。如果无效，尝试长按 `[电源键]` 几秒。\n\n### 如何截取整个网页\n\n#### Archive Today\n\n[`archive.is/`](https://archive.is/)\n\
  \n`Archive Today` 是网页的时光胶囊。它获取网页的“快照”，即使原始页面消失它也会一直存在。保存的页面没有活动元素和脚本，因此对你是是安全的。\n\
  \n![](img/0152.jpeg)\n\n#### Snagit\n\n[`www.techsmith.com/screen-capture.html`](https://www.techsmith.com/screen-capture.html)\n\
  \n`Snagit` 是一个付费服务（目前一次性费用 50 美元），具有更多功能，包括截取整个桌面、窗口或滚动屏幕。\n\n![](img/0153.jpeg)\n\
  \n### 如何保存为 PDF\n\nAdobe PDF\n\n[`helpx.adobe.com/acrobat/using/print-to-pdf.html`](https://helpx.adobe.com/acrobat/using/print-to-pdf.html)\n\
  \n在几乎任何 Windows 或 macOS 应用程序打印时都可以选择 Adobe PDF。打印到 PDF 会创建一个文件的电子副本并将其保存到磁盘。你的电脑需要安装\
  \ `Adobe Acrobat`，否则 `Adobe PDF` 打印机或`另存为 PDF`选项不会出现。\n\n![](img/0154.jpeg)\n\n\
  ## 第 16 章 – 非自愿色情 / 报复色情\n\n非自愿色情是指“在未经个人同意的情况下分发的私密性暗示图像[或视频].”[94]](#part0185.html#_ftn94)\n\
  \n### 有五十万人看过了我的裸体\n\n2018 年，Cher Scarlett 在 `Medium.com` 上写了名为《有五十万人看过了我的裸体》的文章。Cher\
  \ 讨论了在她的男友将她的私密照片发布到她作为活跃成员的 `Twitch` 在线游戏社区后，她遭受了多年的骚扰。\n\nCher Scarlett 慷慨地允许在书中分享她的经历，以提高人们对非自愿色情可能造成的严重伤害的认识。最好的方式是用她自己的话来说，以下是文章的摘录（文末附有全文链接）。\n\
  \n\n\n\n\n“我曾和网上的一个人有过交往，他最初的意图是通过将我的裸照泄露到我们的整个服务器来羞辱我。他写了某种程序，每当我设法删掉这些照片时，程序就会自动重新上传，并将它们分享给我们认识的每一个人。这太糟糕了。这是我第一次被我曾经那样在意过的人用这种羞辱，我不得不向警察求助，让他让他停手。\n\
  \n在从警察那里获得了一些非常有威慑力的措辞后，我与那个人谈了话，他同意停止并从电脑里删除这些照片。我不知道他是感到内疚还是害怕，但在我看来，事情已经结束了。从以后，这个人就他的行为向我道过歉，并进行了补偿。”\n\
  \n但事情并没有停止。\n\n2012 年 7 月，Cher 发现另一个人保存了那些照片，并因为她与他们《魔兽世界》游戏社区的另一位成员交往而对她愤怒。那个骚扰者反复将这些照片发布到\
  \ Imgur（一个流行的照片共享网站），以及 Cher 经常去的 Twitch 聊天频道。Cher 希望通过保持沉默让热度消退。她当时的男友和朋友向 Imgur\
  \ 举报了这些图片，说是未经许可发布的虐待。如果有人问起，Cher、她的男友和她的朋友都会否认那是她的照片。\n\n最终，在 Imgur 于 2012 年 8\
  \ 月删除最后一张照片后，人们停止了谈论它们。\n\n直到两个月后……\n\n“2012 年 10 月的第三周，我开始在 Twitch 上收到几十几十条关于那些照片的消息。\n\
  \n到那时，每个人似乎都很确定那是我，我收到的消息量大得离谱。每个人都在谈论这些照片，都在评论它们。一个主播说我的青脉看起来像一张地图，我被嘲讽为‘世界地图胸’。我真的无法理解为什么这一切突然再次开始，明明两个月前还似乎已经平息了。……\n\
  \n终于有人给我发了专辑链接，我的心提到了嗓子眼。它的浏览量超过了 30 万次。与其他专辑不同，这个并不是匿名上传的。它属于一个名为 Uncleswagg 的\
  \ Imgur 用户，他显然以收集和分发 Twitch 和《魔兽世界》女性的裸照而闻名。他拥有几十个裸照专辑，是整个 Twitch 社区中最全的。当他从某个渠道获得我的一小部分照片时，他得知我过去交往过的某人可能有更多，于是联系他以获取更多照片放入他的专辑中。\n\
  \n最糟糕的部分是，Uncleswagg 对此感到自豪。向 Twitch 和 Imgur 员工发送的无数邮件似乎都没有让专辑被删除，他为自己能够保持链接永久而感到自豪。他通过‘报复性色情’骚扰女性，并成为用非法裸照‘揭露’游戏行业女性的核心枢纽，获得了他梦寐以求的名声。……\n\
  \n骚扰仍在持续，我进入任何 Twitch 频道都会听到一些关于我胸部的言论，或者被叫作妓女。我删除了我的 Twitch 账户并创建了一个新的。这是一个全新的开始，没有了通过信息和聊天评论进行的性侵扰。……\n\
  \n……但在 2013 年 5 月，Twitch 上的骚扰信息再次开始。\n\n骚扰仍在持续，我进入任何 Twitch 频道都会听到一些关于我胸部的言论，或者被叫作妓女。我删除了我的\
  \ Twitch 账户并创建了一个新的。这是一个全新的开始，没有了通过信息和聊天评论进行的性侵扰。……\n\n……但在 2013 年 5 月，Twitch 上的骚扰信息再次开始。\n\
  \n骚扰仍在持续，我进入任何 Twitch 频道都会听到一些关于我胸部的言论，或者被叫作妓女。我删除了我的 Twitch 账户并创建了一个新的。这是一个全新的开始，没有了通过信息和聊天评论进行的性侵扰。……\n\
  \n……但在 2013 年 5 月，Twitch 上的骚扰信息再次开始。\n\n骚扰仍在持续，我进入任何 Twitch 频道都会听到一些关于我胸部的言论，或者被叫作妓女。我删除了我的\
  \ Twitch 账户并创建了一个新的。这是一个全新的开始，没有了通过信息和聊天评论进行的性侵扰。\n\n### 删除你的照片的步骤\n\n如果你的照片在未经许可的情况下出现在网络上，以下是主要步骤：\n\
