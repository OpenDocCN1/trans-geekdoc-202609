  \ | |\n\n本节涵盖了关于：\n* 社交媒体审慎\n* 防范黑客\n* 非自愿色情/报复性\n* 保护青少年与儿童\n* 从互联网删除你的个人信息\n\n\
  这些都是互联网用户需要意识的重要问题，遭受网络滥用可能会导致严重的、甚至是致命的后果。这里的目标是帮助读者理解这些网络威胁对你、亲人或熟人可能造成的伤害。\n\n\
  重要的是，这些章节包含了你可以采取的防御操作步骤，无论是在问题发生之前，还是在面临网络骚扰时。\n\n\n\n\n简单来说，永远不要发布任何可能被用来对付你的内容。有让你情绪化的观点吗？在点击发送之前，先停顿并深思熟虑你的措辞。想分享推文来表达对某人或某事的不满吗？说实话，如果我们能深呼吸并停一下，这个世界可能会稍微快乐一点。\n\
  \n而且一旦你把它发布出去，它可能真的永远存在那里。\n\n不相信吗？去 `AllMyTweets.net` 获取任何用户账户的最后 3,200 条推文（那可是三千两百条！）！当个人由于某种原因（无论是因为正当理由还是无故）成为关注对象时，记者可能会使用该网站。此类网站获取一个人漫长的在线历史的速度，往往比其本人删除贴文的速度快得多。最好在网络上言行审慎，从源头上就不要让自己陷入这种尴尬的境地。\n\
  \n[`www.allmytweets.net/connect/`](https://www.allmytweets.net/connect/)\n\n![](img/00086.jpeg)\n\
  \n考虑删除旧的社交媒体帖子，或使用可以删除过去推文的服务。施暴者经常会挖掘你以前发布的旧帖子，以此来损害你的声誉。\n\n## 一张自拍胜过万言\n\n2019\
  \ 年，日本流行星松冈爱（Ena Matsuoka）在家外被一名疯狂的粉丝袭击和侵犯。该男子通过分析受害者发布的一张自拍，识别出了她的家庭住址。具体来说，这位歌手拍了一张看起来很简单的户外自拍，照片中没有明显的其位置的迹象。跟踪者放大了她眼睛中的倒影，在那里他发现了建筑和路牌的倒影。该男子前往该地点并等待松冈。攻击者袭击了她，将她拖入一个偏僻区域并对其进行侵犯。幸运的是，她最终逃脱了。东京都警方最终逮捕了该男子。[27]](#part0185.html#_ftn27)\n\
  \n## 照片隐私案例研究\n\n为了说明照片可以揭示多少微妙信息，这里列了一些人们可能发布的图像中可以发现的内容示例。当然，一个人在不同社交媒体账户的照片集中的内容可能存在无数种变化。查看单张照片可能会揭示一个人的信息元素。黑客、跟踪者或网络喷子可能会从目标的账户中收集一系列线索，从而构建出关于该人习惯、兴趣和活动的全面画像。\n\
  \n对于后续所有示例，我使用了用于商业用途的公共图库。照片中的人物已允许各自的摄影师将其图像用于出版。我们无意透露这些照片中任何个人的个人信息。\n\n在线跟踪者可以轻松放大照片以搜索细节。在接下来的示例中，你将被要求检查照片中关于位置或其他细节的线索。在答案中，我将提供每张照片仔细检查可以发现的细节。\n\
  \n虽然 `Google` 在保护个人隐私方面并不完美，但它们的搜索工具非常出色。`Google Maps`（包括其 `Street View` 街视图功能）以及\
  \ `Google Earth` 是极其强大的侦察工具，正如你在这些示例中看到的。\n\n接下来的练习的目的不是恐吓你永远不要发布照片，而是让你充分意识到图像是如何被操纵并违背你的最大和安全利益的。\n\
  \n### 研究 #1\n\n这张两个女性的照片是在哪里拍摄的？\n\n![](img/00087.jpeg)\n\n（照片由 Gabriella Clare\
  \ Marino 拍摄于 Unsplash）\n\n答案在下一页。\n\n### 研究 #1 答案\n\n放大照片顶部的中心可以发现他们背后的街道名为 `Della\
  \ Posta Vecchia`。\n\n最初，由于字母模糊，并不清楚具体的街道名称是什么。当我使用 `Google` 搜索该名称时，在我输入前两个词后，`Google`\
  \ Convenient 地自动补全了正确的拼写。有了 `Google` 建议的拼写，我随后能够确认那正是照片中的街道名称。\n\n在 `Google Maps`\
  \ 中搜索 `Della Posta Vecchia` 提供了几个具有该街道名的城市。使用 `Google Maps Street View`（街视图），我找到了特定的城市。\n\
  \n![](img/00088.jpeg)\n\n### 研究 #2\n\n关于这张照片的拍摄地点，你可以判断出什么？\n\n![](img/00089.jpeg)\n\
  \n（照片由 Henry Ivany 拍摄于 lifeofpix.com）\n\n答案在下一页。\n\n### 研究 #2 答案\n\n放大屋顶和挡风玻璃上的倒影，你可以看到上方建筑和天空的更多细节。这张照片似乎是在一个停车结构的顶层拍摄的，旁边就是倒影中的建筑。\n\
  \n建筑本身本身的下部分颜色较浅，上部分颜色较深。或者它们是两栋建筑，一个较短且较浅，另一个较高且窗户更多。你还可以看到建筑或建筑不同部分的图案、相对大小和模式。\n\
  \n如果你知道这张照片可能是在哪个城市或城镇拍摄的（例如，如果你知道照片中的人住在哪个城市），你可以使用排除法尝试锁定此位置。在 `Google Maps` 上搜索“parking\
  \ garage”（车库），然后通过 `Street View` 和 `Google Earth` 查看位置以寻找倒影中的建筑，将有助于缩小范围。\n\n![](img/00090.jpeg)\n\
  \n### 研究 #3\n\n从这张照片中可以推断出哪些细节？\n\n![](img/00091.jpeg)\n\n（照片由 Chloe Kal 拍摄于 Pexels）\n\
  \n答案在下一页。\n\n### 研究 #3 答案\n\n放大太阳镜上的倒影揭示了许多信息。\n\n你可以看到一个留着齐发、看起来穿着短袖衫和裙子的女性正在为他拍照。根据她双手握持相机的方式以及手臂的位置，她正在使用一台看起来是数码相机。（用手机拍照的人不会那样拿。）\n\
  \n男子正后面是一栋建筑或几栋相连的建筑。在太阳镜倒影中，似乎有一个浅色的阶梯墙和一个内池。墙的另一侧有大树。\n\n如果你知道男子居住的大致位置，使用 `Google\
  \ Maps` 的 `Satellite View`（卫星视图，提供区域的俯视图）可能有助于定位建筑以及墙那边树木环围的封闭池区。`Google Maps Street\
  \ View`（街视图）可以显示该地点的正面以及街道地址。\n\n![](img/00092.jpeg)\n\n### 研究 #4\n\n关于这个男子所在的位置，你可以判断出什么？\n\
  \n![](img/00093.jpeg)\n\n（照片由 Sina Khansari 拍摄于 Unsplash）\n\n答案在下一页。\n\n### 研究 #4\
  \ 答案\n\n他的建筑涂有深色外墙，从外墙看似乎是木质护墙。\n\n阳台有一个约三英尺高的墙，上方有金属安全护栏。\n\n阳台的门和窗户似乎使用了大块玻璃，呈现出独特的图案，可能从街道上识别。\n\
  \n阳台前方似乎有高树。\n\n不远的地方（大约 500 到 1000 英尺外）有一栋高层建筑，看起来至少有 10 层楼，可能更高。它非常宽，带有斜屋顶。从外表看，它可能是一家酒店或公寓楼。\n\
  \n根据上述信息以及从其他照片和来源中为目标收集的其它线索进行在线搜索，可以获得非常准确的位置信息。\n\n### 研究 #5\n\n这张照片是在什么时候拍摄的？\n\
  \n关于这个地点你还能判断出什么？\n\n![](img/00094.jpeg)\n\n（照片由 Andrea Piacquadio 拍摄于 Pexels）\n\
  \n答案在后两页。\n\n### 研究 #5 答案\n\n\n\n\n注意女性头部上方石块上阳光的角度。地面上没有阳光，这说明这张照片是在黄昏时拍摄的，当时太阳开始下山。较低的光线会被街道对面的树木遮挡。你可能会认为这也可能是日出时拍摄的，因为那时太阳也很低。这虽然可能，但观察照片的背景（包括女性的神态），它更有可能是在白天拍摄的，而不是在大清晨。这是一种假设，但并不合理。\n\
  \n假设这确实是黄昏，那么墙上的光光表明这栋建筑的这一侧面向西，即太阳落下的方向。因此，如果有人在寻找这个地点，他们就会知道在街道的哪一侧，从而显著减少搜索范围。\n\
  \n![](img/00095.jpeg)\n\n答案继续见下一页。\n\n## 练习 #5 答案（继续）\n\n放大女性头部后方玻璃窗上的反射，可以看到一个像路灯的东西，它可能具有独特的风格。它看起来像是一个带有玻璃面板的老式黑色路灯。\n\
  \n如果它不是路灯，它很可能仍然具有足够的特征，在建筑旁边的搜索中出现它就能确认照片拍摄的位置。\n\n![](img/00096.jpeg)\n\n### 此外……\n\
  \n你可以很容易辨认建筑的细节，包括建筑风格和浅色石材，以及街道层的大平板玻璃窗。\n\n在街道对面，你可以看到沿人行道排列的细长树木。街道下方路杆上的路牌如果有人在寻找那里，将有助于确认位置。\n\
  \n## 练习 #6\n\n### 在哪里？\n\n![](img/00097.jpeg)\n\n（照片由 Yogendra Singh 发布于 Pexels）\n\
  \n这张照片是在印度拍摄的。如果有人对该地区熟悉，有一些线索可能帮助识别这个特定地点。\n\n宽阔的小路平坦且维护良好，显然是供人走的。如果有用，可以研究当地的树木和植物。此外，陡峭的岩层表明这条路是在山丘或山腰上开凿的。\n\
  \n注意从照片中身上收集到的线索。那个成年人看起来可能是男性，正在使用一根登山杖。由于手杖的高度，它看起来像是一根登山杖而不是拐杖。拐杖会短一些。使用登山杖意味着这是一条长距离步行路线。\n\
  \n那么，这些练习你做得怎么样？\n\n## 健康且隐蔽\n\n考虑采取这些步骤来减少你发布到世界的个人信息。\n\n### 让你的头像去个性化\n\n在你的社交媒体账户上，考虑为每个账户使用不包含你脸部的图像，这样你就不会被立即发现。如果可能，也使用非个人化的网名。你仍然能够找到朋友，但普通大众追踪你的难度会逐渐增加。\n\
  \n### 禁用位置共享\n\n如果有人真的需要知道你在哪里，他们会问你。否则，你提供的细节信息是不必要的，这些细节益处无微，而且如果有人想要监控你的活动，它们会显示规律。\n\
  \n### 不要发布位置信息\n\n如果有人真的需要知道你在哪里，他们会问你。否则，你提供的细节信息是不必要的，这些细节益处无微，而且如果有人想要监控你的活动，它们会显示规律。\n\
  \n\n\n\n以下是关于如何更改几个社交媒体网站隐私设置的说明。未列出的其他网站可能也有类似的设置步骤。通常情况下，最好的做法是允许你的朋友（如果你选择，也可以朋友的朋友）查看你的个人页面。\n\
  \n注意：不同的网站和应用可能使用 `![](img/00104.jpeg)`、`![](img/00105.jpeg)`、`![](img/00106.jpeg)`\
  \ 或其他符号作为“更多选项”菜单。为了本指南的简洁，我们将使用 `![](img/00104.jpeg)`（称为省略号）作为选择“更多选项”菜单的通用符号，但根据你的电脑或移动设备，它可能会与上述符号有所不同。\n\
  \n## Facebook 隐私设置\n\n1. 仅允许“朋友的朋友”与你建立联系，而不是“所有人”。\n2. 设置隐私，以减少他人通过电子邮件或电话查找你的方式。\n\
  3. 限制搜索引擎查找你的时间线。\n4. 关闭允许他人查看你过去帖子的选项。\n5. 勾选在朋友在照片中标记你之前需要你许可的设置。\n6. 屏蔽对你的健康没有益处的人。\n\
  \n## Instagram 隐私设置\n\n1. 个人 Instagram 账户可以设置为“公开”或“私密”。当有人关注私密账户时，他们必须向账户所有者发送请求，所有者可以批准或拒绝其访问。\n\
  2. 请记住，私密账户在其他社交媒体（如 Twitter）上的分享可能会导致其 Instagram 私密帖子在公开的 Twitter 账户上可见。\n3. 如果在你将\
  \ Instagram 帖子设置为私密之前有人已经关注了你，而你不希望他们看到你的帖子，你可以屏蔽他们。\n4. 即使人们没有关注你，他们仍然可以直接向你发送照片或视频。\n\
  \n## Snapchat 隐私设置\n\n1. 在相机屏幕上，点击顶部的个人资料图标\n2. 点击 `⚙️` 打开设置\n3. 向下滚动到“谁可以……”Who\
  \ Can…部分并点击“联系我”\n4. 选择“我的朋友”，这样只有你的朋友才能给你发送 Snap 和和你聊天。\n5. 点击返回按钮更新你的隐私设置。\n\n\
  ## TikTok 隐私设置\n\n要让你的 TikTok 私密，点击屏幕右上角的 `![](img/00104.jpeg)`，然后导航到“隐私与安全”并更改你的设置。\n\
  \n## Twitter 隐私设置\n\n要让你的推文私密，进入“隐私与安全”设置并勾选“保护我的推文”。\n\n# 第 15 章 - 防御网络喷子\n\n“网络骚扰难道不是你参与互联网所付出的代价吗？”\n\
  \n“不，绝对不是。每个人都有权过上没有任何形式虐待和骚扰的生活，这个概念在网络世界并不会突然失效。上网并不会让威胁变得不真实，或让种族主义言论的伤害力减小，它们应该受到与线下骚扰相同的标准对待。接受使用互联网而遭受的骚扰并不是你的责任；不骚扰你才是骚扰者的责任。”\n\
  \n“谁在经历网络骚扰？”\n\n“根据皮尤研究会研究中心（Pew Research Center）的一项调查，40% 的人曾遭受过网络骚扰，73% 的人目睹过他人遭受网络骚扰。我们知道，各行各业的人都会经历甚至助长网络骚扰。然而，当涉及到威胁时，女性、有色种人士和\
  \ LGBTQ 群体受到的影响不成比例。在经历过网络骚扰的人中，66% 的人表示最近一次事件发生在社交网络网站或应用上。”\n\n上述两个问题在 `HeartMob.com`\
  \ 网站上得到了深入解答，该网站为遭受网络骚扰的人提供支持。 [\\[28\\]](#part0185.html#_ftn28)\n\n人们可能因为任何原因成为网络虐待和喷子的受害者，而且往往毫无理由。如果陌生人试图在网络上虐待、骚扰和伤害你，尽可能地保护自己是至关重要的。\n\
  \n记者由于他们在报道具有挑战性且有时具有争议的问题时扮演的角色，对现实世界和网络骚扰都特别容易受到。来自网络喷子的虐待和威胁往往是极端的，现实世界的暴力威胁对于全球记者来说是一个屡见不鲜的现实。让我们来看看他们防御喷子的策略，这些策略也适用于许多其他情况。\n\
  \n### 立即采取的步骤\n\n保护记者委员会（The Committee to Protect Journalists）是一个独立的非营利组织，旨在促进全球新闻自由，并维护记者在安全且无惧报复的情况下报道新闻的权利。该组织发布了保护记者的指南，这些指南对普通受害者也高度具有参考价值。总结如下：\n\
  \n1. 考虑你的心理健康。在处理严重事件时，感到挣扎是很常见的。尽早寻求同伴的支持或咨询会很有帮助。个人支持网络对于缓解此类情况引起的孤立感和不知所措感也非常有价值。\n\
  2. 不要读喷子的评论。那是他们希望你做的，他们故意试图从情感、心理、甚至身体上扰乱、惊吓和伤害你。相反，让一位信赖的朋友或同事为你阅读，并让他们让你知道你需要的信息。你的朋友可以作为一个更客观的过滤器，缓冲你免受喷子希望施加给你的情感动荡和恐惧。\n\
  3. 记录一切，保留任何网络骚扰的截图和记录。向发布威胁的社交媒体公司举报此类虐待。如果你将来决定联系执法部门或起诉，记录将非常重要。\n4. 屏蔽或静音虐待者。被屏蔽的虐待者会收到通知，这可能导致他们变得更加恶毒并开启另一个账号。被静音的人并不知道被静音了，他们会继续将虐待投向虚无，而不是你的屏幕。同样屏蔽电子邮件，或将它们发送到单独的文件夹。\n\
  5. 让你的家人和/或亲友了解情况，并要求他们在分享在线信息时和你一样保持谨慎。喷子经常针对家庭成员。\n6. 如必要通知你的雇主，如果你担心对方可能会联系你或你工作地的同事。\n\
  7. 如果你继续在线发布内容，将未来的帖子设置为仅对朋友可见（而非公众）。禁用帖子中的回复功能。注意网络上存在的你的照片以及它们可能如何被用来对付你。决定要删除或暂停你的社交媒体账户，直到尘埃落定。喷子最终会转向其他目标，尽管这可能需要几个月或几年。\n\
  8. 喷子会尝试破解你的账户，确保你的社交媒体和电子邮件登录是安全的。\n9. 晚上关闭通知，这样你就能从一直连接的状态中获得心理休息。晚上不要把手机放在卧室。\n\
  10. 注意可能会被雇佣付费喷子来对受害者进行虐待。虽然很难从情感动荡中抽离，但要意识到针对你的谩骂可能并非针对。\n11. 为你的名字以及各种拼写变体设置 Google\
  \ 警报（Google Alerts），以便了解可能涉及你的公开动态。也考虑为你的家人设置警报。如果收到警报会给你带来过大压力，你可以让一个信赖的人设置警报并发送到他们的邮箱。（说明将在本章稍后部分提供。）[\\\
  [29\\]](#part0185.html#_ftn29), [\\[30\\]](#part0185.html#_ftn30)\n\n### 协作\n\n\n\
  \n\n\n即使是蝙蝠侠也有他的管家阿尔弗雷德，有时还有罗宾作为他的倾听者。如果你打算走上至少是保护自己（显然，我是支持的）并坚守立场（我也支持这一点）这条道路，请确保你以理性的方式这样做。廉价的报仇带不了你多远，但追求正义可以。\n\
  \n### 传播信息\n\n如果你已经成功识别了网络喷子（troll）——并完全确认该个人无疑是敌对者——你接下来该怎么办？首先，如果威胁水平确实需要，请考虑报警报警（在我看来，你对举报骚扰者的内部阈值应该设得非常、非常低。你不需要忍受任何人的虐待。不惜一切代价保护自己是你不可剥夺的权利）。如果情况进一步恶化，报警报警也可以作为一份重要的文件记录。在与你信任且客观的合作者讨论后，考虑告知对该喷子有影响力的人是否合适，例如他们的雇主、学校甚至他们的父母。\n\
  \n## 记录完整情况\n\n美国作家协会文学与人权倡导组织 PEN America 建议，在记录骚扰事件时，“确保你保存了所有相关证据，而不仅仅是那些对你有利的证据。例如，如果你在计划记录的某个在线交流中贡献了攻击性对话或激进言论，请务必也将这些交流内容包含在。虽然你可能后悔说过某些话，但如果你最终进入法庭，未能记录骚扰的所有方面可能会对你造成伤害。你追求骚扰者并不需要证明自己在每一步都反应得完美无缺.”31\n\
  \n我建议以多种格式记录信息，以确保记录的冗余性，防止丢失宝贵的证据：\n\n1. 对网页进行截图（本章后面将提供说明），并将它们整理到计算机文件夹中（根据需要创建子文件夹以保持整洁），\n\
  2. 将网页保存为 PDF 文件，并将文档整理在上述文件夹中；\n3. 打印成纸质版并将页面整理在证据夹中。\n\n### 联系当地执法部门\n\n如果你觉得正处于危险之中，请考虑拨打\
  \ `911`。\n\n某些受害者可能因为担心会“打扰”执法部门或其他机构而犹豫，但事实并非如此。这些绝不是你可能寻求执法部门帮助的唯一理由。在这些情况下，我总是建议相信你的直觉并保持过度的谨慎。即使向当地派出所报告在线骚扰没有导致立即行动，它也会建立起以后可能需要的书面记录。\n\
  \n在更通用的情况下，警察更有可能对以下形式的在线骚扰提供某种的帮助。根据 PEN America 的说法，在以下情况下，你可能需要考虑联系执法部门：\n\n\
  * 你收到了直接暴力威胁，或在威胁中被点名（暗示时间、地点或位置的威胁更容易被执法部门重视），\n* 网络虐待者发布了你的非自愿、性显露的图像（关于此类骚扰的更多信息请参阅第\
  \ 16 章 ‒ 非自愿色情 / 报复性色情），\n* 你通过电子通信被跟踪，或\n* 你认识认识你的在线骚扰者并希望寻求限制令。 [32]](#part0185.html#_ftn32)\n\
  \n### 不要被吓倒\n\n这一建议取决于具体情况，应该根据每个喷子的攻击性程度逐案考虑，或者针对所有骚扰你的人采取行动。与你信任、客观的支持者讨论情况。考虑给骚扰者发一条信息，警告任何进一步的接触将导致报警。某些沟通可能到此为止。对每个喷子仅回复一次，并记录你的沟通内容。\n\
  \n## PEN America 对在线虐待的定义\n\nPEN America 出版了一份编写良好的《在线骚扰实战手册》，对在线骚扰可能采取的不同形式提供了见解。他们慷慨地允许在书中分享这些重要的定义。由于理解在线虐待可能发生的多种方式至关重要，因此我们包含了\
  \ PEN America 的详细列表，这不仅可以帮助你保护自己，还能帮助保护你关心的人。\n\n“在线虐待”——也被称为“网络骚扰”、“网络虐待”和“在线骚扰”——包括但不限于在在线环境中进行的行为。在线环境包括电子邮件、社交媒体平台（如\
  \ `Twitter`、`Facebook` 和 `Instagram`）、即时消息应用（如 `Facebook Messenger` 和 `WhatsApp`）、博客平台（如\
  \ `Medium`、`Tumblr` 和 `WordPress`）以及评论区（如数字新闻平台、个人博客、`YouTube` 页面和 `Amazon` 图评上的评论）。本词表面向两类受众：\n\
  \n在线虐待的目标。本词表将帮助你识别正在经历的特定形式的网络骚扰，并为处理该特定虐待提供建议和资源。每个“怎么办”部分都为特定形式的骚扰提供了简短且立即的行动方案。\n\
  \n见证者、盟友、亲人和主。本词表将帮助与受害者接触的群体和个人了解特定的在线骚扰类型。提高网络骚扰的集体意识并进行反击需要具备描述和应对虐待的词汇。\n\n\
  本词表处注明了更多信息的来源和参考文献，也可以在 PEN America 的网站 `https://www.pen.org` 获取更多信息。[33]](#part0185.html#_ftn33)\n\
  \n## 术语表\n\n### 假水草根 (Astroturfing)\n\n定义：假水草根是指传播或放大内容（包括虐待），这些内容看起来是从基层自发传播的，但实际上是由个人、利益集团、政党或组织协调的（通常使用多个假账号）。\n\
  \n示例：2012 年，俄罗斯青年团体 `Nashi` 被指控付钱批评关于普京的负面文章，并不喜欢关于普京的负面 YouTube 视频。34\n\n怎么办：假水草根之所以有效，是因为骚扰者费尽心思让假账号看起来很真实。尽管如此，检查账号可能是假的迹象是个好主意（见下文关于假账号的指导）。你可以尝试部署支持社区来帮助举报账号、屏蔽和静音以及记录虐待。如果你正在考虑调查假水草根运动以揭露并破坏其信誉，PEN\
  \ America 在其网站上提供了反击言论的指南。35\n\n### 关注性钓鱼 (Concern Trolling)\n\n定义：虐待者伪装成目标作品的粉丝或支持者，发表伪装成建设性反馈的有害且贬低信息的评论。\n\
  \n根据《牛社交媒体词典》，海狮行为（Sealioning）是“一种进入在线讨论并对答案和证据提出无尽要求的对抗性做法”。36](#part0185.html#_ftn36)\n\
  \n示例：根据 Anita Sarkeesian 的《女性上网指南”，“当针对女性时，[关注性钓鱼]最常见通过对改善外貌的‘体贴’建议来实施……关注性钓鱼者的虚伪评论实际上是为了削弱或贬低你。”37\n\
  \n跨平台骚扰\n\n\n\n\n\n## 跨平台骚扰\n\n**定义**：跨平台骚扰是在多个社交媒体和通信平台上进行的协调且故意的部署，利用了大多数平台仅对其自身网站进行内容管理的特点。\n\
  \n**示例**：一名作家在发表了一篇讽刺女性主义的文章后，发现自己陷入了 Twitter 风暴的中心，这场风暴迅速蔓延到她的专业 Facebook 页面、她所属的一家专业会员组织的网站以及更远的地方；施暴网络喷子在\
  \ `4Chan` 和 `Reddit` 等平台上协调了这些攻击。\n\n**应对措施**：没有简单的方法可以处理协调的跨平台骚扰。加强你的网络安全以保护自己免受黑客攻击和人肉搜索（doxing）至关重要。为了应对攻击的规模和范围，集结一个支持性的网络社区来分担记录、举报、屏蔽和静音攻击行为的负担是有帮助的。\n\
  \n## 网络欺凌\n\n**定义**：这是一个术语，网络欺凌涵盖许多骚扰行为，但归结底是“通过使用计算机、手机和其他电子设备蓄意且反复的伤害”。该术主要用于儿童和青少年。\n\
  \n**示例**：在一个悲剧且现在臭名昭著的网络欺凌事件中，一名十二岁的女孩在新泽西州结束了自己的生命。\n\n**应对措施**：访问 `https://www.cyberbullying.org`\
  \ 获取与网络欺凌相关的最佳资源和信息。\n\n## 网络暴民攻击（又称“群攻” Dogpiling）\n\n**定义**：当一群施暴者通过大量的威胁、谩骂、侮辱和其他侵扰策略集体攻击一个目标时。\n\
  \n### 愤怒/羞辱暴民\n\n**定义**：一种暴民正义的形式，侧重于公开暴露、羞辱和惩罚目标，通常是因为目标对具有政治敏感性的题或观点表达了意见，而愤怒暴民不同意这些观点，和或这些观点被断章取义以推某种特定的议程。\n\
  \n**示例**：Ricochet 编辑及政治保守派专栏作家贝塔·曼德尔（Bethany Mandel）在公开宣布反对唐纳德·特朗普后，通过 `Facebook`\
  \ 和 `Twitter` 经历了来自自认为白人民族主义者的反犹太主义网络攻击浪潮。\n\n**应对措施**：尝试应对网络暴民攻击可能像玩一场精疲力竭的打地鼠游戏。如果举报骚扰没有起作用，可以考虑请你支持社区的成员代表你监控和举报骚扰，而你则进行休息。其他选项还包括：发起反击言运动以重新建立叙事或夺回与你的用户名相关的标签；在社交媒体上发表声明，提醒你的社交网络注意这些负面活动；并考虑暂时退出你的社交媒体账号或将其设为私密，直到最糟糕的骚扰过去为止。\n\
  \n## 网络跟踪\n\n**定义**：在法律语境下，“网络跟踪”是指在网上长时间、反复地使用侵扰行为（一种“行为过程”），意在“杀死、伤害、骚扰、恐吓，或在蓄图杀死、伤害、骚扰或恐吓的意图下对目标进行监控”。\n\
  \n**示例**：在长达 15 年的时间里，《科学美国人》（Scientific American）的一名自由记者成为一名男子的网络跟踪目标，该男子随后盗取了她的身份并威胁她的职业生涯。\n\
  \n**应对措施**：网络跟踪是联邦犯罪，许多州也制定了网络跟踪法律。如果你愿意联系执法部门或寻求律师建议，你可能希望对网络跟踪者采取法律行动。其他策略包括：在社交媒体上屏蔽你的跟踪者、记录与网络跟踪相关的每一次骚扰事件、在你预见到会有身份欺诈时确保你的在线账户受到保护，以及寻求你的支持社区的支持。\n\
  \n## 深度伪造（Deepfake）\n\n**定义**：使用“一种被称为深度学习的人工智能”制造看起来真实的图像、音频和/或视频。这些图像、音频和/或视频模仿语音或面部表情，使得他们似乎说了或做了他们没有做过的事。\n\
  \n**示例**：一个使用调查记者拉纳·阿尤布（Rana Ayyub）图像创建的深度伪造色情视频被分享了 40,000 多次，试图让她并让她沉默。她足够勇敢在\
  \ 2018 年《哈佛顿邮报》的文章中分享了她的故事。\n\n## 拒绝访问\n\n**定义**：利用技术或平台的功能伤害目标，通常是阻止其访问基本的数字工具或平台。\n\
  \n### 大规模举报（又称虚假举报）\n\n**定义**：施暴者协调虚假举报目标账户为侵扰或其他有害内容，试图使其被封禁或关闭。\n\n### 邮件轰炸（又称洪水攻击\
  \ Flooding）\n\n**定义**：施暴者向个人或机构的电话或电子邮件账户发送大量垃圾信息，旨在限制或阻止目标使用该平台的能力。\n\n**示例**：2017\
  \ 年，机器人账户发送的大量邮件关闭了 `ProPublica.com` 的服务器，这是对 ProPublica 记者的报复性攻击，这些记者曾写过一篇关于科技公司与极端网站之间关系的争议性文章。这次攻击阻止了该公司的员工访问重要邮件，并严重干扰了该新闻机构的日常运营。\n\
  \n**应对措施**：立即向发生骚扰的社交媒体平台、电话供应商、互联网公司或电子邮件提供商报告该事件。如有必要，创建一个新的或/临时电子邮件地址或用户名，告知你的同事、家人和朋友你遭受了邮件轰炸，且不再能访问常用账号。\n\
  \n## 拒绝服务 (DoS) 攻击\n\n**定义**：一种网络攻击，通过用数据淹载系统，导致网站或网络临时或无限地崩溃或无法运行。DoS 攻击可能会阻止你访问自己的设备和数据，并可能损害存储在你设备上的敏感信息。\n\
  \n### 分布式拒绝服务 (DDoS)\n\n**定义**：当攻击者控制多个用户的计算机来攻击另一个用户的计算机时。这可以强制被劫持的计算机向特定网站发送大量数据或向目标电子邮件地址发送垃圾邮件。\n\
  \n**示例**：2016 年，英国广播公司（BBC）遭受了针对性的 DDoS 攻击，导致了 `Reddit`、`Twitter`、`Etsy`、`GitHub`\
  \ 和 `Spotify` 的访问限制。\n\n**应对措施**：由于 DoS 攻击针对电子邮件地址、网站和在线账号，务必联系相关供应商报告此类骚扰。\n\n\
  ## 狗哨（Dog Whistling）\n\n**定义**：使用具有双重（或代码）含义的侵扰或有害词汇，有时向一群网络施暴者发出攻击特定目标的信号。\n\n\
  **示例**：2016 年，Twitter 上的白人至上主义者在个人姓名周围使用三层括号——`(((echo)))`——来识别他们是犹太人并发起协调的骚扰。犹太人作家和记者团结起来夺回了该符号，主动在自己的\
  \ Twitter 账号上添加了三层括号。\n\n## 人肉搜索（Doxing / Doxxing）\n\n\n\n\n\n# 人肉搜索 (Doxing)\n\n\
  定义：指在网上发布敏感的个人信息——包括家庭地址、电子邮件、电话号码、社会安全号码、照片等——以此骚扰、恐吓、勒索、跟踪或盗取目标的身份。根据 HTML.com\
  \ 的说法，doxing 是“dropping docs”的缩写，曾是 90 年代计算机黑客之间的一种报复手段。[56]\n\n示例：在《纽约时报》报道了涉及密苏里州州费尔格森市迈克尔·布朗枪击事件的警官后，两名记者因其报道遭到报复，其个人地址被发布在网上，导致他们被迫逃离家。[57]\n\
  \n**该怎么办：** 如果你已经遭受了人肉搜索，请立即向该信息出现的平台举报此类行为，并尽力评估对你安全的威胁程度。[58] 如果你认为被泄露的信息可能落入意图伤害你的人手中，请考虑立即让当地执法部门介入。[59]\n\
  \n# 网络性骚扰（又称网络性性侵、基于性别的骚扰）\n\n网络性骚扰涵盖了数字平台上的广泛性不当行为。认同为女性和/或 LGBTQIA+ 群体的人不成比例地成为目标。\n\
  \n## 揭人名 (Deadnaming)\n\n违背目标的意愿公开其曾用以对其伤害，这种技术“最常用于公开 LGBTQIA+ 社区成员的身份，这些成员可能出于各种原因更改了出生姓名，包括避免职业歧视和人身危险”。[60]\n\
  \n## 糖果化对待 (Lollipopping)\n\n“任何旨在使[女性]幼稚化的行为，从称呼她为‘hon’或‘sweetie’，到告诉她长大就能得到想要的。这种行为以医生和商人发给小小孩以安抚他们的糖果命名。”[61]\n\
  \n## 非自愿亲密图像（见下文）\n\n## 性勒索 (Sextortion)\n\n一种勒索形式，虐待者威胁要“暴露裸露或性图像以迫使某人做某事”。[62]\n\
  \n## 未请求的情色内容\n\n向目标发送性露骨或暴力的图像和视频。[63]\n\n## 不受欢迎的性化\n\n向目标发送“不受欢迎的性请求、评论和内容”。[64]\n\
  \n**示例：** 当作家、律师兼女性主义博客作者吉尔·菲利波维奇（Jill Filipovic）在纽约大学法学院就读时，她在匿名留言板上发现了数百个帖子充满了针对她的强奸威胁——其中许多描述得非常露骨。当骚扰者开始出现在菲利波维奇所在的法学院，随后出现在她的律师事务所时，这些网络威胁转变为线下威胁。菲利波维奇写道，由于她所遭受的网络性骚扰，她的信心和安全遭到了损害。[65]\n\
  \n**该怎么办：** 一个重要的起点是向接收骚扰的平台举报此类骚扰[66] 并记录这些虐待行为[67]。网络性骚扰对目标来说可能是极其创伤的，可能需要法律干预。（目前有\
  \ 46 个州制定了非自愿情色内容法律——检查你的所在地是否在其中。）[68] 如果你确实希望寻求执法部门或律师的帮助，请访问美国作家（PEN America）《网络骚扰现场手册》中的“法律考虑”部分。[69]\n\
  \n如果你是网络性骚扰的目标，记住你并不孤单，这一点极其重要。寻求他支持对维护你的心理健康有很大帮助。请查看美国作家协会《网络骚扰现场手册》中的“与朋友和亲人交谈”部分，获取更多关于与周围的人讨论敏感话题（包括网络性骚扰）的技巧。[70]\n\
  \n# 黑客攻击 (Hacking)\n\n定义：未经授权进入设备或网络，黑客攻击通常旨在通过窃取数据、侵犯隐私或向其设备植入病毒来攻击、伤害或陷害另一个个人。当黑客攻击被用于进行非法活动或恐吓目标时，它属于网络犯罪。[71]\n\
  \n**示例：** 俄罗斯黑客组织“花奇熊”（Fancy Bear）已针对数百名记者，包括一名独立的俄罗斯记者、至少 50 名《纽约时报》记者以及《每日野兽》的几名记者，以及其他报道情报、国家安全和俄罗斯水军农场的记者。[72]\n\
  \n**该怎么办：** 实践严谨的网络安全对于保护自己免受黑客攻击至关重要。[73]\n\n# 仇恨言论\n\n定义：攻击个人身份特定方面的表达，例如种族、族裔、性别认同、宗教、性取向、残疾等。网络上的仇恨言论通常以人身攻击的形式出现，通过攻击个人的性格或特征来避免对当前话题的讨论，用偏见情绪取代智力辩论。\n\
  \n**示例：** 2016 年，喜剧演员莱斯莉·琼斯（Leslie Jones）成为了一场基于种族歧视、厌女主义信息的广泛网暴活动的目标，最终导致她遭受了报复性色情、人肉搜索和黑客攻击。（该事件还导致臭名昭著的网络喷子米洛·亚纳诺普洛斯\
  \ Milo Yiannopoulos 因其针对性的公开种族歧视虐待被踢出 Twitter，这部分归功于她的支持者发起的 #LoveforLeslie Twitter\
  \ 活动。）[74]\n\n**该怎么办：** 根据这些攻击中包含的威胁和恐吓程度，你可能希望屏蔽或静音用户、进行反击言，或者在某些情况下甚至考虑直接对抗你的网暴者。如果你觉得回应或屏蔽某用户不安全，请寻求你的支持社区，并确保你正在进行自我照顾。如果你在暴力威胁或性恐吓中被点名并担心自己的安全，请联系执法部门。[75]\n\
  \n# 非自愿亲密图像（又称报复性色情）\n\n定义：非自愿情色内容是指“在未经个人同意的情况下，分发私人的、性露骨的图像[或视频]”。[76]\n\n**示例：**\
  \ 数量的女性和名人一直是非自愿情色内容的目标。领先的报复性色情专家凯·戈尔德格（Carrie Goldberg）是网络权利倡议组织董事成员兼律师，她职业生涯致力于处理性隐私和网络虐待案件，她自己曾是前男友非自愿亲密图像的受害者。[77]\n\
  \n**该怎么办：** 遭受非自愿情色内容的攻击可能是极其创伤的，可能需要法律干预。（目前有 46 个州制定了非自愿情色内容法律——检查你的所在地是否在其中。）[78]\
  \ 如果露骨图像被发布在社交媒体平台或聊天论坛上，请标记其删除，并在可能的情况下联系平台管理员。[79] 在此期间也一定要向你的支持社区寻求帮助。\n\n# 网络身份冒充\
  \ (Online Impersonation)\n\n定义：创建一个虚假的社交媒体账号，通常使用目标的姓名和/或照片，发布攻击性或煽动性的言论，以诽、诋毁或煽唆进一步的虐待。骚扰者还可以冒充目标认识的人来造成伤害。\n\
  \n\n\n\n\n# 示例：作家 Lindy West 曾遭受过特别残忍的冒充骚扰，一名网络喷子冒充了她已去世的父亲。然而，她的故事有一个意想不到的结局：那个虐待她的喷子最终道歉了。\n\
  \n### 怎么办：\n立即向发生该行为的平台举报此种冒充行为。你可能考虑在自己真实的社交媒体账户上发布声明，提醒你的在线社区注意该冒充者。（如果骚扰发生在 Twitter\
  \ 上，你可以将一条推文“置顶”在个人资料页顶部，这样当有人访问你的真实 Twitter 个人资料时就能看到。）在某些情况下，告知你的雇主或亲人这种虐待行为可能是合适的，特别是当他们卷入冒充者的评论中时。\n\
  \n## 网络钓鱼 (Phishing)\n\n**定义：** 一种始于某种形式通信（电子邮件、短信、WhatsApp 消息）的网络诈骗，设计成看起来来自可靠来源。其目的是欺骗你做某些事情——通常是点击链接或打开附件，这可能会自动向你的设备下载病毒，或引导你输入私密信息（如登录详情），这些信息随后可能被用于控制你的在线账户、冒充你或将你的信息卖给他人。\n\
  \n## 威胁 (Threats)\n\n**定义：** “针对目标实施痛苦、伤害、破坏或其他敌对行动的意图声明”。这包括死亡威胁、身体暴力威胁，而且对于女性来说，通常还有性暴力威胁。\n\
  \n**示例：** 作家 Jessica Valenti 在她 14 年的在线写作生涯中，一直是泛滥的厌女性主义、毒性（且无关的）的人格攻击，以及强奸和死亡威胁的目标。2016\
  \ 年，在针对她 5 岁女儿的在线强奸和死亡威胁后，她暂时退出了社交媒体。\n\n## 报特警误报 (Swatting)\n\n**定义：** 向执法部门拨打虚假电话，详细说明在目标家中或经营场所发生的完全虚假的威胁事件，意在派遣一支全武装的警察部队（SWAT\
  \ 队）前往目标地址。特警误报虽然罕见，但极其危险，它是网络骚扰可能对生活中造成伤害的典型案例。\n\n**示例：** 2013 年，一名网络安全记者在位于弗吉尼亚州的家中险遭了特警误报，10\
  \ 到 12 名警察持枪包围了他的车道入口。\n\n### 怎么办：\n特警误报是非法行为。它通常是“人肉搜索泄露”（doxing）事件的结果，即一个人的家庭或业务地址被发布在网上。你可以采取措施主动保护你的信息免受泄露。如果你认为自己未来可能成为特警误报的目标，请考虑通知当地执法部门，为这种可能性做好准备。如果你曾是特警误报的目标，你可能想要采取法律行动。\n\
  \n## Zoom 会议轰炸 (Zoombombing)\n\n**定义：** “劫持虚拟会议并通过共享文本、视频或音频来干扰通信的行为……通常被称为‘突袭’或‘轰炸’……有时这些袭击是……出于特定目的，包括干扰业务活动和对边缘群体的基于身份的攻击。”\n\
  \n**示例：** 当虐待性喷子用色情内容轰炸会议时，记者 Kara Swisher 和 Jessica Lessin 被迫关闭了一场关注科技领域女性所临挑战的\
  \ Zoom 活动。\n\n### 怎么办：\n关于避免被 Zoom 轰炸的特定建议请见第 22 章——在线会议。此外，确保定期更新 `Zoom` 以及任何其他视频会议软件，因为它们不断发布新的安全功能。\n\
  \n上述定义、示例和行动步骤的主要来源是：\nPEN America, 网络骚扰实务手册 [`onlineharassmentfieldmanual.pen.org/`](https://onlineharassmentfieldmanual.pen.org/)\n\
  \n## 向社交媒体平台举报骚扰\n\n如果你在社交媒体上遭受虐待，你应该向发生骚扰的平台举报该骚扰行为。\n\n以下是在主要社交媒体和照片共享平台举报骚扰的说明。文中包含了实际举报过程的截图，以便你更清楚地了解预期情况。此举目的是为了在可能需要删除图片的压力时期，让举报过程变得更透明、更高效，且不那么令人畏惧。几张截图显示了如何举报非自愿色情（又称复仇性色情），我们将在后面的第\
  \ 16 章“非自愿色情/复仇性色情”中讨论，但任何形式的骚扰都可以（也应该）被举报。\n\n包含的社交媒体网站有（按字母顺序）：\n\n- Facebook\n\
  - Imgur\n- Instagram\n- Reddit\n- Snapchat\n- Tumblr\n- Twitter\n- YouTube\n\n###\
  \ 向 Facebook 举报骚扰\n如果你在社交媒体上遭受虐待，你应该向发生骚扰的平台举报该骚扰行为。\n\n点击帖子上方的 `...` 获取更多选项。选择“举报”（Report）。将该帖子举报为“不当”。\n\
  \n### 向 Imgur 举报骚扰\n点击你想举报的帖子上的 `...`。你也可以访问以下地址请求删除特定图像：\n`https://imgur.com/removalrequest`\n\
  \n### 向 Instagram 举报骚扰\n如果你有一个 Instagram 账户，你可以在应用内举报虐待、垃圾信息或任何不符合其社区准则的内容。根据 Instagram\
  \ 的说明，你的举报是匿名的，除非你举报的是知识产权侵权。你举报的账户看不到是谁举报了他们。\n\n如何举报帖子或个人资料：\n点击帖子上方的 `...` 获取更多选项。选择“举报”（Report）。举报该帖子。\n\
  \n如果你有 Instagram 账户，关于举报虐待或垃圾信息的帖子或个人资料更多信息请访问此地址：`https://help.instagram.com/192435014247952`\n\
  \n如果你没有 Instagram 账户，你可以在此地址举报虐待、垃圾信息或任何不符合其社区准则的内容：`https://help.instagram.com/contact/383679321740945`\n\
  \n### 向 Reddit 举报骚扰\n在帖子底部选择举报（report）选项。在弹出的举报问题（Report an Issue）窗口中提供信息。\n\n你也可以将评论页的\
  \ URL 发送到 `contact@reddit.com`，主题写为“非自愿色情报告”（Nonconsensual Pornography Report）或另一个合适的、清晰的骚扰描述。\n\
  \n### 向 Snapchat 举报骚扰\n\n\n\n\n\n要举报 Snapchat 账户，请访问其个人页并点击 ![](img/00104.jpeg)\
