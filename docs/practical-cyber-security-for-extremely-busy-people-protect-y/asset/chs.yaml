- "# 极忙人士的实用网络安全指南：保护你、家人和职业免受网络剥削\n\n\n\n\n\n\n\n\n\n致 Theresa, Quincy, Christian,\
  \ Alexander, Celeste\n始终如一。\n\n\n\n# 引言\n\n极忙碌人士的实用网络安全\n保护你、你的家人和职业免受网络攻击\n这本书是为你而写的。\n\
  \n我非常理解你极其忙碌，因此我尽可能清晰、简洁地编写了本指南，直奔主题。网络安全关乎：\n\n在 2021 年，数百万人将继续通过部分或完全远程办公或入学来履行职责。个人采取主动措施保护网络安全比以往任何时候都重要。\n\
  \n《极忙碌人士的实用网络安全》旨在为你提供一个清晰、可行的行动计划，以：\n\n1. 保护你的资产\n2. 在网络和现实世界中保护你的个人数据\n3. 保护你免受钓鱼攻击、恶意软件和其他利用\n\
  4. 捍卫你免受骚扰者和网络喷子的针对性攻击\n\n全面的网络安全（不是）一蹴而就的，但好消息是，采取本指南概述的可操作步骤，将快速且积累地让你处于一个更安全、准备更充分的状态，去过生活、保护你关心的人并安全地管理你的职业。\n\
  \n书中穿插截图、图表和其他视觉效果，为你可能考虑使用的说明、网站和应用程序提供更清晰的画面。其意图让你个人采取的网络安全步骤不再那么令人生畏、更加透明且更高效。你将知道书中之外的预期。\n\
  \n我鼓励读者进行独立研究，以增强本书之外的安全意识，因为持续的意识是一种培养的健康习惯，类似于锻炼或学习新技能。\n\n我为许多热门设备和应用提供了说明。如果你有书中未专门的设备或应用，概念仍然是相同的，你针对特定设备或应用采取的步骤可能与这些章节讨论的步骤相似。\n\
  \n\n\n\n我的网络安全经验构建于多个领域。首先，多年来，我与全美的许多联邦、州和地方执法机构紧密合作，为他们的移动技术需求提供解决方案。我专注于为联邦外勤探员、调查员、警察和其他执法部门提供硬件和软件解决方案，以支持他们履行职责。我担任一名战略顾问，帮助不同行业的各类公司降低其组织各个层级的风险。经验告诉我，公司面临的最常见的网络风险通常不是来自其硬件或软件。糟糕事情的发生通常是因为公司内部某人做了或没做某些事。这可能是由一名兼职、临时工或首席执行官（CEO）造成的，往往是出乎意意的，但有时也是故意的。无论何种情况，损害都是毁灭性的。我努力帮助防止这种情况的发生。\n\
  \n其次，我作为记者、纪录片摄影师和独立人道主义支持者的工作，要求我从不同的角度评估个人的网络安全。我访问过近 40 个国家，通常是为了记录和拍摄人道主义危机或政治敏感局势。我曾在对外国人面临秘密或可见威胁的地方工作，具体来说，是来自压迫政府、军方、地方当局、有组织犯罪，甚至是无组织的街头罪犯的威胁。我通常与我组织的团队一起工作。除了我个人的安全，我还要负责其他人的现场安全。我需要确保我的团队拥有必要的设备（电脑、手机、相机和其他设备）来完成我们的报道。我需要确保我们收集的敏感信息（照片、视频、采访笔记和证据）能够尽可能安全地存储，以防止被没收、被盗或甚至是意外的数据损坏。我需要考虑跨越国边界可能会为我们的团队带来额外风险，例如手机可能被检查或没收。。当局有能力在未经所有者同意的情况下复制手机内容——照片、联系人、信息、通话和浏览记录、账户登录，一切内容。我们的网络安全规划和执行每一次都是非常详尽的。\n\
  \n第三，我在哈佛大学获得了新闻学硕士学位和国际安全证书。在学习期间，我对政府、非国家行为者、公司甚至孤立个人如何利用网络战获取了视角和洞察力，这些手段不仅针对相互之间，还针对毫无防备的平民。当我从沃顿学院获得工商管理硕士（MBA）学位时，我接受过效率训练，因此在整本书中，我将直奔主题。你很忙，我理解。\n\
  \n让我们开始吧！\n\n# 第一部分 ‒ 至少，做到这些\n\n## 章节目录\n\n\n## 20 秒懂加密\n\n等等，源文本说的是：\n20 秒懂加密\n\
  第 1 章 ‒ 保护你的资产\n占有即法律的 9/10\n让它个性化\n为你的设备标记\n摄像头安全\n麦克风\n第 2 章 ‒ 一些常用术语\n第 3 章 ‒\
  \ 保护你的管道\n第 4 章 ‒ 电子邮件\n第 5 章 ‒ 那真的是是你的密码吗？\n第 6 章 ‒ 双重身份验证\n\n等等，查看提供的用于目录文本块：\n\
  “20 秒懂加密\n第 1 章 ‒ 保护你的资产\n占有即法律的 9/10\n让它个性化\n为你的设备标记\n摄像头安全\n麦克风\n第 2 章 ‒ 一些常用术语\n\
  第 3 章 ‒ 保护你的管道\n第 4 章 ‒ 电子邮件\n第 5 章 ‒ 那真的是是你的密码吗？\n第 6 章 ‒ 双重身份验证”\n\n实际上，让我仔细重读提示中用于目录部分的原始文本：\n\
  “20 秒懂加密\n第 1 章 ‒ 保护你的资产\n占有即法律的 9/10\n让它个性化\n为你的设备标记\n摄像头安全\n麦克风\n第 2 章 ‒ 一些常用术语\n\
  第 3 章 ‒ 保护你的管道\n第 4 章 ‒ 电子邮件\n第 5 章 ‒ 那真的是是你的密码吗？\n第 6 章 ‒ 双重身份验证”\n\n等等，提示中用于目录部分的原始文本有些混乱，有很多重复的单词（例如，“摄像头安全”、“麦克风”、“第\
  \ 2 章 ‒ 一些常用术语”……）。我将将其清理为结构化列表。\n\n## 20 秒懂加密\n\n加密只是对你的数据进行乱码的一种高级说法。（注：源文本在正文后面部分有一些解密/不可读的片段，但目录部分本身非常混乱。我将关注内容章节。）\n\
  \n## 第 1 章 ‒ 保护你的资产\n\n首先，在网络空间中保护自己之前，让我们先在现实生活中保护好自己。虽然数字盗窃泛滥成灾，但也有无数理由让小偷乐于偷走你的笔记本电脑。让我们采取一些重要的（但也廉价且低技术的）步骤，这些将立即提高你的防御性。笔记本安全\n\
  \n你最后一次阅读笔记本底部刻有的信息是什么时候？正确答案是“可能从没有”，因为你为什么要这样做呢？没有人这样做。虽然笔记本的底部是光滑且时尚的，和笔记本外壳一样，但它们只是浪费的空间。\n\
  \n使用永久性墨水或油漆笔是识别你资产更稳妥的方法。名字贴是另一种选择，但它们可以被撕掉或损坏，是一种不那么持久的解决方案。我根据笔记本的颜色，使用 Sharpie\
  \ 记号笔或细头漆笔在笔记本底部写下我的名字、电子邮件和手机号码。我还会写上“如得有酬”，以鼓励发现者联系我，寻回金额取决于具体情况，但我会尽量大方，以换回我的数字工具。\n\
  \n尽管这个简单的步骤在找回丢失或被盗的笔记本电脑方面无价之比，但我惊讶于我经常被人们反对这么做。\n\n“它太漂亮了”是最常见的理由之一。再次，它在底部，没有人会看到它。直到你需要它的时候。\n\
  \n“这是我的工作电脑”是另一个借口，但从现实来说，我不认为公司真的那么在意。当该把笔记本电脑还给公司的 IT 部门时，因为你弄坏了它，或者正在升级……\n\n\
  \n\n我曾读过一篇关于一名乘坐商业航空航班女性的新闻报道。她在飞行期间，随手将笔记本电脑放在了地板上的包上。飞机上并不算拥挤，她后面的一排座位空着。在某个时刻，她的电脑滑到了座椅下面，最后落在了她后方一个男人的脚边。当她意识到电脑移动了后，她回去寻找，发现那个男人拿了电脑。她向他索回，但那个人说不，那是他的电脑，这真是一个极其卑劣的行为。他们发生了争吵（这并不意外），等到他们降落时，机场警察被传到飞机上解决纠纷。那个男人告诉警察那是他的电脑。那个女人要求他开机证明电脑是她的，因为她可以输入密码，但那个男人拒绝了。机场警察没有权限强制该男子开机，或者即使他打开了，警察也不让她碰。那个男人一直坚持认为笔记本电脑是他的，在没有其他证据反驳的情况下，他被允许带着他新偷来的战利品离开了飞机。那个女子无计可做，她的电脑就在她眼皮底下被偷了。\n\
  \n虽然不能强迫那个男人打开电脑，但如果那个女人坚持说外面写着她的名字，他很可能会被促使将其翻过来。\n\n### 让它具有个性化\n\n![](img/00001.jpeg)\n\
  \n如果一个小偷看到这两台被无人看管的笔记本电脑，他们更有可能偷哪一个？（照片由 Imgix 发布于 Unsplash）\n\n通过贴纸和标签让你的重要设备和器材个性化，使其易于识别，这同时也对潜在的小偷起了某种心理上的震慑。虽然贴有名字的贴纸不是标记装备最安全的方法，但它们仍然帮助你的资产个性化，并且如果小偷担心带着易于识别的物品被发现，这会降低对他们的吸引力。从一个毫无防备的目标那里偷一台黑色、毫无特征的笔记本电脑？轻而易举。偷一台满是图形、标志和其他视觉标记的黑色笔记本？嗯……也许我会去别处。\n\
  \n我恰好得到一卷反光橙色胶带（那种用于车贴贴且很难撕掉的），我把它贴在我拥有的所有东西上。我是指所有东西，从笔记本电脑到鼠标垫，从小电子配件到手机充电头（这些是我最常弄丢的东西）。当我坐在桌前拖延时，我会在手机充电线上缠一小段。总而言之，标记我的设备可以清楚看出哪些物品是我的。至少，这防止了在会议桌旁或教室里与同事一起工作时，我的物品与别人的混淆。\n\
  \n资产个性化的最好的部分在于，你可以由自己决定想得多么有创意，而且好处降低了小偷带走你物品的吸引力。这是形式与功能的结合。\n\n### 标记你的设备\n\n\
  1. 笔记本电脑\n2. 手机\n3. 手机壳——我在壳内写了我的名字和备用电话\n4. 昂贵的配件\n    1. 摄像头\n    2. 无线鼠标和键盘\n\
  \    3. 蓝牙耳机\n    4. 无线耳机\n5. 易丢物品\n    1. 笔记本电脑电源线和适配器\n    2. 手机充电器\n    3. 手机线\n\
  \    4. 手写笔\n\n### 摄像头安全\n\n![](img/00002.jpeg)\n\n摄像头盖可以保护你的视线不受不必要的监视。\n\n摄像头很有用，只要它们不表现得很糟糕。在\
  \ 2020 年疫情之前，办公室里的笑话通常是“这次会议其实可以发邮件解决”。现在，随着远程办公，这种讽刺演变成了“这次视频通话其实可以发邮件解决”。对于人们来说，与同事、客户、朋友和家人保持联系（通常情况下）是很重要的。视频通话只会比\
  \ 2020 年发现的更具侵略性且频繁。\n\n社交媒体乐于向世界广播那些无意的 Zoom 用户在视频通话中犯下的瞬间却极度尴尬的失误，包括在摄像头前没穿裤子（让其他参与者感到沮丧或大笑）；上厕所；和他们的父母、宠物或植物聊天；以及任何许多此前无法想象的失礼行为。在一些广为人知的事件中，会议参与者的行为太不像离谱了，导致了严重的后果。\n\
  \n此外，一些恶意的犯罪分子可能能够开启并监控活动，或者让电脑处于开放状态以便进行操纵，这些操作隐藏在 U 盘内存的可执行文件或根文件中。当不使用摄像头时，你应该用简单的便利签、云胶带盖住镜头，或者，如果你愿意的话，买一个精美的滑动盖。\n\
  \n### 如果你使用外部摄像头，最佳实践是完全将摄像头从 USB 插槽中拔掉。只需在开始视频通话前将其插回去即可。\n\n### 麦克风\n\n与摄像头类似，盖住笔记本电脑内置麦克风的孔有助于防止不必要的窃听。如果你的电脑有辅助接口（通常是类似于耳机的小型\
  \ `3.5mm` 接口），保护自己免受未经授权监听的简单而有效的方法是从不使用的耳机上剪断插头并将其插入麦克风接口。通过将插头插入接口，电脑应该默认认为插入了外部麦克风。你可以在电脑的音频设置中验证这一点。由于你从物理上剪断了插头的线，有人试图偷听时也没有录音设备可以连接。当你需要使用真实的麦克风时，拔掉插头。\n\
  \n![](img/00003.jpeg) ![](img/00004.jpeg)\n\n通过断开耳机插头临时禁用内置麦克风。\n\n### USB 优盘\n\n\
  就像你不会不知道东西是什么或来源何处就随便乱吃一样，你插入电脑的东西也应该被同样对待。USB 优盘是便携式存储设备，可以存放文档、照片、电影、程序或其他文件，而且往往在你需要时它们却不在。根据人们参加的各种商务会议或活动，公司经常免费发放带有公司\
  \ Logo 的优盘，这些是很好的带回家的实用小礼物。它也让 USB 优盘成为传播和安装恶意软件或可能窃取数据、监控活动或让电脑处于开放状态以便操纵的程序的完美媒介，这些程序隐藏在优盘内存的可执行文件或根文件中。\n\
  \n底，即使它们是免费的、漂亮的或时尚，如果你不知道它们的来源，不要使用 USB 优盘。幸运的是，内存价格持续下降。购买由主要制造商制造的新优盘是明智之。\n\n\
  ### 美国军方被免费优盘入侵\n\n\n\n\n\n2008 年，美国五角楼发现他们的机密 SIPRNet 计算机网络（该网络连接了军方、白宫高级官员以及美国情报机构）正被俄罗斯情报部门渗透并监控。根据大卫·桑格（David\
  \ Sanger）在其引人入胜的著作《**完美武器**》（*The Perfect Weapon*）中的描述，俄罗斯特工曾在中东某处美国军事基地的停车场和公共区域丢弃了\
  \ USB 优盘。有人捡起了一个，并最终插入了一台连接到军事 SIPRNet 网络的笔记本电脑中。据桑格介绍，“简而言之，如果俄罗斯人进入了那个通信通道，他们就可以访问所有重要信息。”为了防止再次发生类似的泄露，国防部计算机上的\
  \ USB 端口最终被超强胶水密封了。\n\n在相近的时期，美国和以色列情报机构正试图渗透伊朗政府用于其核计划的计算机网络。桑格指出，伊朗系统是“物理隔离的”（air\
  \ gapped），这意味着它没有连接到互联网或外部世界。它是一个独立的、单机系统，由于无法在线访问，本应该是不受客攻击的。美国和以色列军队试图通过在 USB\
  \ 密钥上插入代码以及其他技术来跨越物理隔离。最终他们成功了。\n\n[如果你对这个迷人的故事感兴趣，我强烈建议阅读《**完美武器**》，以深入了解网络武器的使用，以及国家和其他行为者可能给彼此造成的各种作剧或破坏。]\n\
  \n### 充电线和充电插头\n\n如果我想针对一个毫无防备的受害者并在手机或笔记本电脑上安装恶意软件，我会在充电线或充电插头的塑料外壳中内置一个小型内存芯片，一旦插入就会启动一个隐蔽程序。只是随口一说。觉得这听起来很不可谱吗？美国国家安全局（NSA）先进网络技术部门（ANT）至少从\
  \ 2008 年开始向员工提供这些设备，甚至更早。它们曾通过一份现在已公开、曾经机密的 NSA ANT 目录进行销售。\n\n所以，对于 USB 优盘的相同建议也适用于随机给你的、或者你不知道来源的充电线和插头。在我们极度连接的世界里，为了让你更好地保护自己，这是一个微小但必要的代价。\n\
  \n![](img/00005.jpeg)\n\n一份现已公开的国家安全局监控工具目录包含一根在外壳内内置了隐蔽监控技术的 USB 缆。（国家安全局 ANT 目录）\n\
  \n### 设备启动密码\n\n即使你 100% 在家工作，此时你可能可能是唯一可以访问自己电脑、平板电脑或手机的人，添加启动密码也是保护你的工作、数据和文件的最简单但最有效的步骤之一。许多计算机允许你设置仅四个或六个字符的密码，有时是简单的四位\
  \ PIN 码，但在这里使用更复杂的密码（遗憾的是，你必须记住它）付出这点微小的额外精力是值得的。\n\n指纹识别器和面部识别也是保护电脑的相当安全的方法。无论你选择哪种方案，这种初始安全层都可以防止针对你的更严重的攻击。\n\
