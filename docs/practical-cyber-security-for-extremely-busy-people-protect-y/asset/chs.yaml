  \n### Charger cables and charger plugs\n\nIf I wanted to target an unsuspecting\
  \ victim and install malware on their phone or laptop, I would build a small memory\
  \ chip into the plastic housing of charger cables or charger plugs that would launch\
  \ a covert program once plugged in. Just saying. Think that sounds far-fetched?\
  \ The National Security Administration’s (NSA) Advanced Network Technology division\
  \ (ANT) has been making these-de these gadgets available to its employees since\
  \ at least 2008, if not longer. They were being sold through a now-public, formerly\
  \ classified NSA ANT catalog.\n\nSo, the same advice for USB thumb drives goes for\
  \ charger cables and plugs that are randomly given to you or which you don’t know\
  \ where they came from. It’s a minor but necessary cost to keep yourself more protected\
  \ in our ultra-connected world.\n\n![](img/00005.jpeg)\n\nA now-public National\
  \ Security Administration catalog of monitoring tools includes a USB cable with\
  \ covert surveillance technology built into the housing. (National Security Administration\
  \ ANT Catalog)\n\n### Device startup passwords\n\nEven if you are working 100 percent\
  \ at home where, at present, you might be the only person with access to your computer,\
  \ tablet, or phone, adding startup passwords is one of the simplest but most effective\
  \ steps you can take to protect your work, data and files. Many computers allow\
  \ you to set a password with as few as four or six characters or sometimes a PIN\
  \ code with a mere four digits, but having a more complex password here (that, alas,\
  \ you’ll have to remember) is worth the miniscule amount of extra effort.\n\nFingerprint\
  \ readers and facial recognition are also reasonably secure methods to protect your\
  \ computer. Whichever option you choose, this initial layer of security can prevent\
  \ much more significant attacks from being directed at you.\n\n### Mobile phones\n\
  \nOn the inside of your phone case, write your first name and the initial of your\
  \ last name (for example, I would be Daniel H.) and a trusted, reliable family member’s\
  \ or friend’s phone number that can receive text messages on your behalf. You may\
  \ also want to write “Reward if found”, and “Please call or text.” Do not add your\
  \ main email address(es) as that can be used to override any 2-factor authentication\
  \ you’ll have installed to protect your accounts (we’ll cover this topic in Chapter\
  \ 6 – 2-Factor Authentication). Should your phone be lost (actually lost, not left\
  \ in your car or other pair of pants), you can lock or remote delete its contents\
  \ immediately. You can still have the wiped device returned to you and then reinstall\
  \ your data from the cloud (more on this later).\n\n### Computer and phone repairs\n\
  \nWait, the user provided a repetitive text in the prompt history. I will provide\
  \ the clean translation of the unique content provided at the end.\n\n[content]\n\
  2008 年，美国五角楼发现他们的机密 SIPRNet 计算机网络（该网络连接了军方、白宫高级官员以及美国情报机构）正被俄罗斯情报部门渗透并监控。根据大卫·桑格（David\
  \ Sanger）在其引人入胜的著作《**完美武器**》（*The Perfect Weapon*）中的描述，俄罗斯特工曾在中东某处美国军事基地的停车场和公共区域丢弃了\
  \ USB 优盘。有人捡起了一个，并最终插入了一台连接到军事 SIPRNet 网络的笔记本电脑中。据桑格介绍，“简而言之，如果俄罗斯人进入了那个通信通道，他们就可以访问所有重要信息。”为了防止再次类似的泄露，国防部计算机上的\
  \ USB 端口最终被超强胶水密封了。\n\n在相近的时期，美国和以色列情报机构正试图渗透伊朗政府用于其核计划的计算机网络。桑格指出，伊朗系统是“物理隔离的”（air\
  \ gapped），这意味着它没有连接到互联网或外部世界。它是一个独立的、单机系统，由于无法在线访问，本应该是不受攻击的。美国和以色列军队试图通过在 USB 密钥上插入代码以及其他技术来跨越物理隔离。最终他们成功了。\n\
  \n[如果你对这个迷人的故事感兴趣，我强烈建议阅读《完美武器》，以深入了解网络武器的使用，以及国家和其他行为者可能给彼此造成的各种作剧或破坏。]\n\n###\
  \ 充电线和充电插头\n\n如果我想针对一个毫无防备的受害者并在手机或笔记本电脑上安装恶意软件，我会在充电线或充电插头的塑料外壳中内置一个小型内存芯片，一旦插入就会启动一个隐蔽程序。只是随口一说。觉得这听起来很不可谱吗？美国国家安全局（NSA）先进网络技术部门（ANT）至少从\
  \ 2008 年开始向员工提供这些设备，甚至更早。它们曾通过一份现在已公开、曾经机密的 NSA ANT 目录进行销售。\n\n所以，对于 USB 优盘的相同建议也适用于随机给你的、或者你不知道来源的充电线和插头。在我们极度连接的世界里，为了让你更好地保护自己，这是一个微小但必要的代价。\n\
