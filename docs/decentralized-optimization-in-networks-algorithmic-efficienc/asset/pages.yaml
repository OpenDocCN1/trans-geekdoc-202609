  md: '# ## 8.3.2 Main results


    We begin by demonstrating the asymptotic consensus of the proposed algorithm as
    stated in the following lemma.


    **Lemma 8.4** (Asymptotic consensus). Denote \(\bar{y}^t = \sum_{i=1}^m c_i y_i^t\)
    and consider Algorithm 1. Under Assumption 8.2, we obtain


    $$

    \lim_{t \to \infty} |y_i^t - \bar{y}^t| = 0, \text{ a.s., } \forall i \in \mathcal{V}.

    $$


    Proof. See Appendix 8.A.


    Next, we present a crucial lemma that underpins the main results of this chapter.


    **Lemma 8.5.** Consider Algorithm 1. Given Assumptions 8.1 and 8.2, and if \(0
    < q < 1/2\), then, for all \(i \in \mathcal{V}\), \(v \in \mathbb{R}_{\ge 0}\),
    and \(t \ge \hat{t}\), where \(\hat{t} = \hat{t}(q, m)\) is a sufficiently large
    positive integer, the following inequality holds:


    \(\sum_{i=1}^m c_i \mathbb{E} \left[ |y_i^{t+1} - v|^2 | \mathcal{F}^t \right]
