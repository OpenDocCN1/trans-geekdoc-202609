- pgno: 115
  md: 'It is important to note that the aforementioned techniques rely on continuous
    communication. This means that agents are constantly engaging in communication,
    resulting in significant communication overhead. Additionally, maintaining real-time
    communication in a real-world network can be challenging due to variations in
    computational capabilities and data flow among agents. In fact, the effectiveness
    of decentralized optimization algorithms is predominantly influenced by communication
    efficiency rather than computational efficiency, as information exchange typically
    takes longer than computation in a multi-agent network. Therefore finding a method
    to circumvent continuous communication is crucial. The emergence of the event-triggering
    mechanism presents an innovative approach to facilitating information exchange
    between agents. The fundamental concept behind this mechanism is that agents only
    transmit updates when the discrepancy between the current and previously transmitted
    updates surpasses a certain threshold. Recent studies have introduced several
    decentralized event-triggered strategies [38–41]. For instance, Liu et al. [39]
    proposed distributed event-triggered techniques to address constrained optimization
    challenges. Gao et al. [38] enhanced communication efficiency by integrating an
    event-triggering mechanism into an established decentralized optimization approach
    [15], demonstrating impressive convergence rates. Meanwhile, Li et al. [41] devised
    an event-triggered method with a consistent step-size for undirected networks,
    capable of converging to the global minimum under standard assumptions.


    # 4.1.2 Main contributions


    In this chapter, we focus on enhancing the efficiency of communication for the
    decentralized stochastic gradient tracking method. Inspired by [14,38], our aim
    is to introduce an algorithm that optimizes communication by implementing an event-triggering
    system for the method described in [14]. The key contributions presented in this
    chapter include:


    +   (1) We propose a unique, decentralized stochastic gradient tracking algorithm
    enhanced with an event-triggering system, designated as ET-DSGT. This innovation
    integrates an event-based triggering mechanism into the decentralized stochastic
    gradient tracking approach. Utilizing a diminishing step-size, ET-DSGT is capable
    of achieving convergence to the precise global optimum at a rate of O(1/t).


    +   (2) Unlike time-triggered methods referenced in [15–17,26], ET-DSGT employs
    an event-based triggering system to prevent consecutive real-time communication,
    thereby enhancing communication effectiveness. Furthermore, we demonstrate that
    for every agent, the duration between consecutive trigger events exceeds the iteration
    interval.


    +   (3) Distinct from [16,17,36], we leverage the inherent characteristics of
    stochastic noise to derive connections between particular norms governed by the
    doubly stochastic weight matrix constraint. Utilizing these connections, we provide
    a comprehensive convergence analysis.'
