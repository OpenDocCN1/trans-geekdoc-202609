  md: '# Privacy-preserving decentralized optimal economic dispatch algorithms with
    conditional noises


    # 8.1 Introduction


    EDP is a crucial and foundational issue in smart grid energy management [1]. The
    aim is to find the optimal power generation for all generators to minimize the
    total operational cost across the network while meeting load demands and adhering
    to each generator''s capacity [2–5]. Consequently, EDP is essentially a constrained
    optimization problem extensively studied in recent years [6–8]. Many centralized
    methods have been developed to address EDP [8]. However, these centralized approaches
    are costly, susceptible to single points of failure, and lack robustness in new
    environments. With the integration of distributed generation equipment, energy
    storage, load equipment, and other components, modern smart grids are highly decentralized,
    making centralized EDP processing on a single central controller impractical [4].
    Decentralized optimization control has been a classical topic, gaining renewed
    interest [9–11]. In decentralized optimization, each generator communicates only
    with its local in-neighbors over a connected network [11,12].


    # 8.1.1 Literature review


    Recently, considerable efforts have been devoted to developing decentralized solutions
    for EDP. The majority of decentralized discrete-time optimization methods for
    EDP in the literature rely on the consensus protocol [13–20]. For instance, a
    decentralized leader-following consensus algorithm was first proposed in [13]
    to solve EDP. However, the presence of a leader in [13] contradicts the core principle
    of full decentralization. To eliminate the leader role, a two-level incremental
    cost consensus algorithm and a fully decentralized algorithm using the “consensus+innovations”
    framework were proposed in [14] and [15], respectively. Furthermore, several efficient
    methods addressing real-world EDP factors such as transmission losses [16], private
    security [17], nonconvex conditions [18], supply–demand balance [19], and time
    delays [20] have emerged. Additionally, continuous–time methods have attracted'
