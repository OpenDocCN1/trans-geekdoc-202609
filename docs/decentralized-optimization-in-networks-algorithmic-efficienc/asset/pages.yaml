  md: '+   Algorithm 1 Privacy-protected decentralized random sleep algorithm at each
    generator \( i \in \mathcal{V} \).

    +   1: **Initialization:** Each generator \( i \) starts with \( y_i^0 \in \mathbb{R}_{\ge
    0}, z_i^0 = e_i \in \mathbb{R}^m, v_i^0 = \sum_{j=1}^m b_{ij} y_j^0 \in \mathbb{R}_{\ge
    0} \), and \( p_i^0 \in \mathbb{R}_{\ge 0} \).

    +   2: **for** \( t=0, 1, 2, ... \) **do**

    +   3: Independently and identically generate a Bernoulli random variable \( \tilde{h}_i^t
    \);

    +   4: Perform the random sleep strategy for optimization:

    +   \[

    +   y_i^{t+1} = \begin{cases} v_i^t + \epsilon_i^t - \gamma_i^t \frac{p_i^t -
    d_i}{[z_i^t]_i}, & \text{if } \tilde{h}_i^t = 1, \\ v_i^t + \epsilon_i^t, & \text{if
    } \tilde{h}_i^t = 0, \end{cases}

    +   \] (8.7)

    +   where \( \epsilon_i^t \in \mathbb{R} \) is an arbitrary noise chosen in \(
    [-\hat{\epsilon}^t, \hat{\epsilon}^t] \), \( \gamma_i^t \) is a local step-size,
    and \( [z_i^t]_i \) represents the \( i \)th entry of vector \( z_i^t \).

    +   5: Perform dynamic average consensus as:

    +   \[v_i^{t+1} = \sum_{j=1}^m b_{ij} y_j^{t+1}, \quad z_i^{t+1} = \sum_{j=1}^m
    b_{ij} z_j^t,\] (8.8)

    +   where \( b_{ij} \) is the weight between \( i \) and \( j \).

    +   6: Perform the local update of the primal variable as:

    +   \[p_i^{t+1} = \min\{\max\{\nabla J_i^{-1}(v_i^{t+1}), p_i^{\min}\}, p_i^{\max}\}.\)
    (8.9)

    +   7: **end for**


    # 8.2.4 Algorithm construction


    In this subsection, to address the problem in (8.1), we introduce the proposed
    privacy-protected decentralized random sleep algorithm. This algorithm ensures
    privacy protection by incorporating conditional noise into the variables transmitted
    within the network, as per [36], while maintaining optimality. Additionally, the
    algorithm leverages a random sleep strategy to enhance computational efficiency,
    as suggested in [24]. Furthermore, the algorithm employs a row-stochastic matrix
    to rescale the gradient with an auxiliary variable, mitigating the imbalance caused
    by directed networks.


    Before presenting the proposed algorithm, we describe the random sleep strategy.
    This strategy introduces a novel approach to improving computational efficiency.
    Here, \( \tilde{h}_i^t \) is a random variable that determines if generator \(
    i \) is active at time \( t \ge 0 \). If \( \tilde{h}_i^t = 1 \), generator \(
    i \) performs gradient updates at time \( t \), otherwise, it only conducts local
    computations. Specifically, given \( 0 < \eta_i < 1 \) for all \( i \in \mathcal{V}
    \), \( \mathbb{P}(\tilde{h}_i^t = 1) = \eta_i \) and \( \mathbb{P}(\tilde{h}_i^t
    = 0) = 1 - \eta_i \). Additionally, we define \( \breve{\eta} = \min_{i \in \mathcal{V}}\{\eta_i\}
    \) and \( \hat{\eta} = \max_{i \in \mathcal{V}}\{\eta_i\} \).


    The proposed privacy-protected decentralized random sleep algorithm at each generator
    \( i \) is summarized in Algorithm 1. The detailed steps are as follows: at each
    time \( t \), each generator \( i \) independently generates a Bernoulli random
    variable \( \tilde{h}_i^t \).'
