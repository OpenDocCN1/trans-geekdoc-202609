    # ## 6.3 Algorithm construction


    In this section, we introduce a proficient decentralized methodology, designated
    as ZO-DDA, tailored to address problem (6.1). This algorithm is rooted in the
    dual averaging framework, offering a novel perspective on the solution.


    # ## 6.3.1 Dual averaging approach


    Before unveiling our proposed algorithm, let us first delve into the canonical
    dual averaging technique introduced in [22]. We shall define the projection mapping
    \(\Pi_{\Omega}^{\phi}(q, \alpha)\) as


    ```

    \(\Pi_{\Omega}^{\phi}(q, \alpha) = \arg \min_{u \in \Omega} \{ \langle q, u \rangle
    + \frac{\phi(u)}{\alpha} \},\) (6.5)

    ```


    where \(\alpha\) is strictly positive, \(q \in \mathbb{R}^m\), and \(\phi(u)\)
    is taken to be a proximal function endowed with 1-strongly convexity, satisfying
    the conditions \(\phi(0) = 0\), \(\phi(u) > 0\), \(u \in \Omega\). The function
    \(\phi(u)\), which incorporates a certain norm denoted as \(||\cdot||\), plays
    a pivotal role in determining the projection operator \(\Pi_{\Omega}^{\phi}(q,
    \alpha)\) (refer to [46] for further details). Subsequently, for each node \(i
    \in \mathcal{V}\), we employ the classical decentralized dual averaging methodology,
    as outlined in [22].


    ```

    \(\left\{\begin{array}{l} q_{t+1}^i = \sum_{j=1}^n p^{ij} q_t^j + g_t^i, \\ x_{t+1}^i
    = \Pi_{\Omega}^{\phi}(q_{t+1}^i, \alpha_t), \end{array}\right.\)

    ```


    where \(g_t^i \in \partial f_t^i(x_t^i)\), \(\alpha_t > 0\) is a non-increasing
    step-size and \(P = [p^{ij}] \in \mathbb{R}^{n \times n}\) is a doubly stochastic
    matrix, i.e., \(\sum_{i=1}^n p^{ij} = \sum_{j=1}^n p^{ij} = 1\), \(\forall i,
    j \in \mathcal{V}\). The primal variable \(x_{t+1}^i\) is acquired through the
    projection of the dual variable \(q_{t+1}^i\) onto the feasible set \(\Omega\).
    By leveraging the dual variable \(q_t^i\) and providing flexibility in selecting
    the proximal function \(\phi\) within the projection operator \(\Pi_{\Omega}^{\phi}\),
    the dual averaging methodology presents an efficient framework for tackling nonsmooth
    optimization problems with constraints [22]. Nonetheless, it is noteworthy that
    the aforementioned algorithm imposes stringent conditions on the matrix \(P\),
    which are not always straightforward to fulfill in real-world scenarios involving
    time-varying directed networks. To address this challenge, the authors of [40]
    introduced a dual averaging push algorithm'
