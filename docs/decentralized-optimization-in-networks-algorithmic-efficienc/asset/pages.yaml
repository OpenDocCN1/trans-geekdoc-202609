    in Table 2.1, cited from [17,35,43]. Here, we assume that the total load demand
    across all generators is known to be $\sum_{i=1}^n c_i = 380$MW.


    Analyzing the operational outcomes depicted in Figs. 2.2(a) and 2.2(b), it is
    evident that ET-PDA has effectively attained the desired optimal economic dispatch,
    with the generation power of each generator set as follows: x1* = 80MW,'
