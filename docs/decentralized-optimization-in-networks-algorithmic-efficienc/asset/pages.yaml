- pgno: 11
  md: '# # Preface


    Along with the rapid development of information technology, human beings have
    moved from the information technology era to the data technology era, and gradually
    entered the ternary world of “human–machine–object” integration. In particular,
    with the integration of data-driven intelligent devices into the physical scene,
    the interaction of information acquisition, transmission and processing constitutes
    a complex multidimensional system, i.e., the networked control system, that deeply
    integrates communication, control, and optimization. This type of system is composed
    of many intelligent devices that collaborate with each other to efficiently complete
    the assigned tasks, thus solving large-scale complex problems that are difficult
    for a single device to handle. Currently, networked control systems have been
    enriched in many fields and brought great convenience to the life of human beings.
    With the advancement of wireless communication technology, microelectronics and
    microelectromechanical technology, and integrated perceptual computing system,
    the application scenarios of networked control systems are constantly expanding.
    With the advancement of wireless communication technologies and integrated perceptual
    computing systems, the application scenarios of networked control systems are
    constantly expanding. As with the rapid increase in computing power and storage
    capacity of smart devices, it has become a trend to deploy advanced optimization
    algorithms on decentralized smart devices in networked control systems. A typical
    example is the decentralized optimization framework: multiple smart devices in
    a network collaborate to solve a global optimization task through local computation
    and local communication. Decentralized optimization frameworks are more suitable
    for large-scale networked control systems because of their advantages over centralized
    optimization frameworks in terms of scalability, robustness, and privacy. As a
    hot research topic spanning multiple disciplines with wide applicability and great
    application value, decentralized optimization in networks lays an important foundation
    for promoting and leading the cutting-edge development of computer science, artificial
    intelligence, automatic control and other fields. As an emerging research hotspot
    and an important research field, decentralized optimization in networks has achieved
    substantial and meaningful research results in terms of algorithmic efficiency
    and privacy preservation, respectively, thereby providing effective approaches
    for solving related optimization problems. However, for the research of actual
    more complex optimization problems and higher algorithmic demands, the related
