- pgno: 209
  md: '# Privacy-preserving decentralized dual averaging push algorithms with correlated
    perturbations


    # 7.1 Introduction


    In recent years, advancements in communication and sensing technologies within
    networked control systems have naturally led to a variety of optimization problems
    across networks [1,2]. Traditional methods typically rely on central intelligent
    devices for storage, communication, and computation, which are costly, lack robustness
    in new environments, and are vulnerable to single points of failure [3]. Decentralized
    approaches, which minimize long-distance communication, offer advantages such
    as enhanced robustness, reduced communication needs, and improved privacy over
    centralized methods. They achieve this by breaking down large-scale problems into
    smaller subproblems, applicable in areas like large-scale data analysis [4,5],
    wireless sensor networks [6,7], and information control [8,9].


    # 7.1.1 Literature review


    Recently, numerous decentralized algorithms have been developed to effectively
    solve optimization problems [10–16]. Algorithms that only use gradient information
    are frequently reported due to their scalability and performance [1,2]. Early
    works on decentralized gradient descent (DGD) [10,11] and their extensions address
    various problem factors and targets [12–16], demonstrating their effectiveness
    in decentralized optimization over networks [10–16]. For instance, [14] introduced
    a decentralized primal-dual algorithm achieving optimal allocation in integrated
    energy systems, while [15] explored fixed-time decentralized optimal resource
    management for microgrids. Further, decentralized dual averaging methods have
    been extensively studied [17–22]. The work in [17] first presented a decentralized
    dual averaging algorithm for constrained optimization over undirected networks,
    inspiring many efficient decentralized approaches for acceleration [18,19], online
    learning [20], and improved efficiency [21,22].'
