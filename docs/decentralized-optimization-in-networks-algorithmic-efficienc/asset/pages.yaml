  md: '**Remark 8.1.** Problem (8.1) represents a general EDP in smart grids, extensively
    studied in recent works [23–28]. As with these studies, this chapter does not
    address network loss and node voltage constraints but focuses on designing new
    algorithms to achieve specific goals. Additionally, it assumes that each generator
    or load device is considered individually in the economic dispatch of smart grids.
    Therefore solving problem (8.1) involves optimizing the power generated by each
    generator to minimize the total generation cost while meeting the total load demand
    and generation capacity.


    # **8.2.2 System model**


    In this chapter, each generator is assigned to a bus within the bus system of
    smart grids. The communication among these generators (buses) is modeled as an
    unbalanced directed network, denoted as \(\mathcal{G} = \{\mathcal{V}, \mathcal{E}\}\),
    where \(\mathcal{V} = \{1, 2, \dots, m\}\) represents the set of vertices (generators)
    and \(\mathcal{E} \subseteq \mathcal{V} \times \mathcal{V}\) represents the set
    of edges. An edge \((j, i) \in \mathcal{E}\) indicates that generator \(j\) can
    directly transmit data to generator \(i\), making \(i\) an out-neighbor of \(j\),
    and vice versa, \(j\) an in-neighbor of \(i\). We define \(\mathcal{N}_i^{\text{out}}
    = \{j \in \mathcal{V} | (i, j) \in \mathcal{E}\}\) and \(\mathcal{N}_i^{\text{in}}
    = \{j \in \mathcal{V} | (j, i) \in \mathcal{E}\}\). If there exists an \(i\) such
    that \(\mathcal{N}_i^{\text{out}} \neq \mathcal{N}_i^{\text{in}}\), then the network
    \(\mathcal{G}\) is considered unbalanced. Strong connectivity in a directed network
    implies that there are directed paths connecting any pair of generators. To facilitate
    communication among generators, we adopt the following assumption regarding the
    communication network (system model) [24,32,40].


    **Assumption 8.2.** The directed network \(\mathcal{G}\) is strongly connected.


    This assumption ensures that each generator can directly or indirectly influence
    all other generators in the network. Although this assumption is more restrictive
    than the uniformly and strongly connected assumption, it remains broadly applicable
    [24, 32,37].


    **Remark 8.2.** In real-world economic dispatch scenarios of smart grids, data
    exchange between neighboring generators often occurs in less-than-perfect environments,
    posing privacy risks. Therefore it is critical to safeguard the privacy of generators
    in decentralized networks. Current privacy-preserving techniques, such as differential
    privacy [31–33] and homomorphic encryption [34,35], significantly impact the performance
    (in terms of convergence and computational cost) of decentralized economic dispatch
    algorithms. Furthermore, not all transmitted information necessitates feedback,
    i.e., the network is directed, and practical solutions must accommodate this scenario.
    Consequently, this chapter aims for the proposed algorithm to achieve three primary
    objectives under accurate convergence: (i) ensuring privacy protection; (ii) enhancing
    computational efficiency; (iii) applicability to an unbalanced directed network.


    For problem (8.1), a generator''s private information includes \(J_i(p_i)\), \(d_i\),
    \(p_i^{\min}\), and \(p_i^{\max}\), which are inaccessible to other generators.
    The ultimate goal of this chapter is to enable generators to interact with their
    respective neighbors over an unbalanced directed network to collaboratively and
    efficiently solve problem (8.1) without disclosing private information.'
