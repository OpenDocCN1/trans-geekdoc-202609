    # 1.2.1 Problem description


    The chapter aims to solve a decentralized resource allocation challenge over a
    directed network comprised of \(n\) interconnected nodes, as outlined below:


    \(\begin{aligned} \min_x C(x) &= \sum_{i=1}^n C_i(x_i), \qquad \text{(1.1a)} \\
    \text{s.t. } \sum_{i=1}^n x_i &= \sum_{i=1}^n r_i = K, \qquad \text{(1.1b)} \\
    x_i \in \Omega_i, \quad \forall i &= 1, \dots, n, \qquad \text{(1.1c)} \end\text{aligned}\)


    where \(x = [x_1, x_2, \dots, x_n]^T \in \mathbb{R}^n\) denotes the optimal estimator
    and \(x_i \in \mathbb{R}\) signifies the quantity of resources assigned to node
    \(i\). The function \(f_i : \mathbb{R} \rightarrow \mathbb{R}\) portrays the convex
    cost associated with resource \(x_i\), while \(\Omega_i \subseteq \mathbb{R}\)
    represents a non-empty, closed, and convex set, unique to node \(i\). The equality
    constraints, \(\sum_{i=1}^n x_i = \sum_{i=1}^n r_i = K\) serve to interlink the
    decisions of the nodes, with \(K \in \mathbb{R}\) being the fixed total resources
    and \(r_i \in \mathbb{R}\) representing the local, virtual demand for resources
    at node \(i\). Here, we define \(\Omega\) as the Cartesian product of the individual
    sets \(\Omega_i\), i.e., \(\Omega = \Omega_1 \times \cdots \times \Omega_n\),
    and we refer to the feasible set of (1.1) as \(\mathcal{D} = \{x \in \Omega |
    \sum_{i=1}^n x_i = K\}\).


