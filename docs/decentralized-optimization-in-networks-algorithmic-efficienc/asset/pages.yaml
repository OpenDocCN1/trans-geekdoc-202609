    # 3.3 Algorithm construction


    To decrease the margin of error introduced by the stochastic gradient algorithm,
    which can enhance computational efficiency, prior scholars have suggested the
    variance-reduction method (VR) [20–22]. To minimize the inaccuracy stemming from
    inadequate agreement among various nodes, past researchers have introduced a gradient
    tracking method (GT) [50,51]. Leveraging these two strategies, certain scholars
    have put forward the GT-VR algorithmic structure, noted for its high computational
    efficiency and precise linear convergence speed, particularly when the step-size
    is adequately small, as exemplified in [19]. To address optimization problems
    confined to a closed convex set, the researchers in [26] employed the projection
    operator to devise an algorithm called GT-CDGD. However, there is still considerable
    room for enhancing its computational efficiency. In order to enhance this efficiency,
    we integrate the projection operator with the variance-reduction method, presenting
    a new projected decentralized variance-reduction algorithm (P-DVR) tailored for
    constrained decentralized optimization problems. The iterative process at node
    i is exhibited below, with \(\eta > 0\) representing a fixed step-size:


    ```

    \(x_{k+1}^i = P_{\Omega_0}[\sum_{j=1}^m a^{ij} x_k^j] - \eta y_k^i,\) (3.6a)


    \(s_{k+1}^i = P_{\Omega_0}[x_{k+1}^i],\) (3.6b)


    \(y_{k+1}^i = \sum_{j=1}^m a^{ij} y_k^j + g^i(s_{k+1}^i) - g^i(s_k^i).\) (3.6c)

    ```


    In Algorithm 1, each node \(i\) maintains a table of component gradients denoted
    as \(\{ \nabla f^{i,j}(t_k^{i,j}) \}_{j=1}^{n^i}\) for the purpose of computing
    the gradient estimator \(g^i(s_k^i)\). Here, \(t_k^{i,j}\) represents the most
    recent iterative state pertaining to the \(j\)th data point prior to'
