    push algorithm for general constrained optimization over time-varying directed
    networks. By using edge-based correlated perturbations, our algorithm surpasses
    differential-privacy-based decentralized algorithms [36,37] in convergence accuracy.
    Unlike related algorithms in [39,40] that use edge-based perturbations, our approach
    also leverages the push-sum averaging protocol to handle imbalances in time-varying
    directed networks. Additionally, compared to node-based perturbation methods [35,43],
    our algorithm offers more design flexibility with edge-based perturbations.


    +   (ii) We provide a rigorous analysis of the convergence and privacy protection
    of our algorithm. It is demonstrated that our algorithm achieves the same \(\mathcal{O}(1/\sqrt{K})\)
    convergence rate (where \(K\) is the number of iterations) as those without privacy
    protection [25–28], under more relaxed initial conditions. This makes our approach
    more general than existing methods [25,26,28], which require zero initial conditions.
    Our algorithm thus does not necessitate the coordination of initial state estimates
    among network nodes, enhancing robustness and flexibility.


    +   (iii) Our algorithm ensures that malicious nodes cannot deduce private information
    from their observations, thereby protecting node privacy. To the best of our knowledge,
    this is a novel decentralized algorithm that not only safeguards the privacy of
    normal nodes but also accurately solves a generally constrained optimization problem
    over time-varying directed networks under weaker initial conditions. Numerical
    examples further corroborate the performance of our algorithm.


