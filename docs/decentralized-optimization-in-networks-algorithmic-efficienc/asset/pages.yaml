    # 1.2.3 Dual decomposition


    Analogous to previous studies [28,31,34], the optimization problem (1.1) can be
    rephrased as a dual problem focused on the equality constraint (1.1b), and subsequently
    resolved using decentralized optimization methods. Initially, the Lagrangian function,
    represented as \( L : \Omega \times \mathbb{R} \rightarrow \mathbb{R} \), is introduced
    and defined as follows:


    ```

    \( L(x, y) = \sum_{i=1}^n C_i(x_i) - y \sum_{i=1}^n (x_i - r_i), \quad (1.2) \)

    ```


    where \( y \in \mathbb{R} \) denotes the Lagrangian multiplier. Consequently,
    the dual counterpart of the optimization problem (1.1) can be articulated in the
    following manner:


    ```

    \(\max_{y \in \mathbb{R}} Q(y) = \sum_{i=1}^n Q_i(y), \quad (1.3)\)

    ```


    where each \( Q_i(y) \) represents a concave function, as detailed in [31], which
    can be characterized as


    ```

    \( Q_i(y) = \min_{x_i \in \Omega_i} C_i(x_i) - y(x_i - r_i), i \in \mathcal{V},
    \quad (1.4) \)

    ```


    and \( Q(y) \) may lack differentiability. Assuming that for any \( y, \tilde{x}_i(y),
    i \in \mathcal{V} \) serves as the minimizer of (1.4), the subdifferential of
    \( Q(y) \) then takes the form of


    ```

    \(\partial Q(y) = - \sum_{i=1}^n (\tilde{x}_i(y) - r_i), \quad (1.5)\)

    ```


    and \(\partial Q_i(y) = -(\tilde{x}_i(y) - r_i), \forall i \in \mathcal{V}\).
    Here, it is important to clarify that the local demand of resource \( r_i \in
    \mathbb{R} \) is a hypothetical value for each \( i \in \mathcal{V} \) and is
    arbitrary. This ensures that the condition \(\sum_{i=1}^n r_i = K\) is satisfied.
    These hypothetical resource demands do not have a physical interpretation and
    can be set in various ways, such as \( r_i = K/n, \forall i \in \mathcal{V} \).
    Furthermore, based on Assumption 1.1, we can infer that a strong duality exists
    between (1.1) and (1.3) [28,31]. This implies that the set of dual optimal solutions
    for (1.3) is non-empty (see Proposition 6.4.2 of [35]). In other words, there
    exists at least one dual optimal solution \( y^* \) to (1.3) that satisfies \(
    C(x^*) = Q(y^*) \).'
