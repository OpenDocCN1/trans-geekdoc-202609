    # ## 2.3 Algorithm exploration


    This section focuses on the exploration of algorithmic solutions within the context
    of several fundamental assumptions.


    **Assumption 2.1.** For each generator designated as $i$, its respective local
    function, denoted as $f_i$ possesses the property of being $\mu_i$-strongly convex,
    meaning that, $f_i(y) \geqslant f_i(x) + \nabla f_i(x)^T(y-x) + \frac{\mu_i}{2}||y-x||^2$,
    where $\forall x, y \in \mathbb{R}, \mu_i \geqslant 0$.


    **Assumption 2.2.** Regarding each generator labeled $i$, its corresponding local
    function $f_i$ is differentiable, and the gradient of $f_i$ exhibits Lipschitz
    continuity with a parameter $L_i$, specifically, $||\nabla f_i(y) - \nabla f_i(x)||
    \leqslant L_i||y-x||$, where $\forall x, y \in \mathbb{R}, L_i \geqslant 0$.


    **Assumption 2.3.** (a) The undirected network $\mathcal{G}$ maintains connectivity;
    (b) The matrix $\mathbf{W}$ satisfies the conditions $\mathbf{1}_n^T\mathbf{W}
    = \mathbf{1}_n^T$ and $\mathbf{W}\mathbf{1}_n = \mathbf{1}_n$.


    **Remark 2.2.** Assumption 2.1 postulates the uniqueness of an optimal vector
    $\mathbf{x}^*$ for problem (2.2), which attains the minimal value of the objective
    function. In our derivation, we introduce the notations: $L$ as the average of
    $\{L_i\}_{i=1}^n$ given by $\frac{1}{n} \sum_{i=1}^n L_i$, $\mu$ as the mean of
    $\{\mu_i\}_{i=1}^n$ expressed as $\frac{1}{n} \sum_{i=1}^n \mu_i$, and $\hat{\mu}$
    and $\check{\mu}$ as the maximum and minimum values among $\{\mu_i\}_{i=1}^n$,
    respectively. Furthermore, Assumption 2.3 establishes that the matrix $\mathbf{W}$
    is doubly stochastic in nature, with its second-largest singular value strictly
    less than 1, i.e., $\sigma = ||\mathbf{W} - \mathbf{1}_n\mathbf{1}_n^T/n|| < 1$
