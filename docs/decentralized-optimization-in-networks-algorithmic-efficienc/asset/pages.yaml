  md: '# ### 2.3.1 Decentralized Lagrangian method


    It is widely acknowledged that the Lagrangian function possesses the capability
    of converting a constrained optimization problem into an unconstrained one. Consequently,
    our initial step involves formulating the subsequent Lagrangian function L:


    \(\mathcal{L}(\mathbf{x}, \theta) = \sum_{i=1}^n f_i(x_i) + \theta \sum_{i=1}^n
    (x_i - c_i), \quad (2.3)\)


    where \(\mathcal{L} : \mathcal{X} \times \mathbb{R} \to \mathbb{R}\), and the
    parameter \(\theta\) serves as the Lagrangian multiplier, pertaining to the coupling
    constraint stated in (2.2b).


    In order to simplify the solution process, it is beneficial to obtain the dual
    formulation of (2.2). Specifically, this dual problem can be defined in the manner
    presented below:


    \(\max_{\theta \in \mathbb{R}} d(\theta) = \sum_{i=1}^n d_i(\theta), \quad (2.4)\)


    where \(d_i(\theta) = -f_i^*(-\theta) - \theta c_i\). The task of identifying
    a solution for Eq. (2.4) can be recast as an analogous minimization problem, formulated
    as follows:


    \(\min_{\theta \in \mathbb{R}} q(\theta) = \sum_{i=1}^n q_i(\theta), \quad (2.5)\)


    where \(q_i(\theta)\) is determined as


    \(q_i(\theta) = f_i^*(-\theta) + \theta c_i. \quad (2.6)\)


    # ### 2.3.2 Event-triggered mechanism


    In the event-triggered mechanism, whenever generator \(i\) decides to disseminate
    its accumulated estimates to its neighboring entities at instant \(k\), we refer
    to this precise moment as the event-triggered time and represent it as \(t_i^k\).
    Consider \(\tilde{\theta}_i^t \in \mathbb{R}\) and \(\tilde{z}_i^t \in \mathbb{R}\)
    as the estimates that generator \(i\) had communicated to its neighbors during
    the most recent trigger event prior to time \(t\), in other words,


    \(\left\{\begin{array}{ll} \tilde{\theta}_i^t = \theta_i^{k(i, t)} & \text{for
    } t_i^{k(i, t)} \leqslant t \leqslant t_i^{k(i, t)+1}, \\ \tilde{z}_i^t = z_i^{k(i,
    t)} & \text{for } t_i^{k(i, t)} \leqslant t \leqslant t_i^{k(i, t)+1}, \end{array}\right.
    \quad (2.7)\)


    where \(\theta_i^t\) and \(z_i^t\) represent the two respective estimates of generator
    \(i\). Furthermore, following the preceding trigger event, the subsequent trigger
    must adhere to the following criterion:


    \(t_i^{k(i, t)+1} = \inf \{t | t > t_i^{k(i, t)}, ||\varepsilon_{i, \theta}^t||
    + ||\varepsilon_{i, z}^t|| > E(\kappa_1)^t \}, \quad (2.8)\)'
