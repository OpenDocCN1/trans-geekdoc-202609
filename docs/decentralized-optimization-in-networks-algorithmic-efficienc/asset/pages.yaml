    are identical, meaning \(\tilde{z}_{i,k}\) equals \(\tilde{z}''_{i,k}\). Subsequently,
    aligning with the reasoning presented in Proposition 1 of reference [23], it suffices
    to show that


    \(\prod_{i=1}^n \prod_{t=1}^m \frac{[\tilde{z}_{i,k}(t) - z_{i,k}(t)]}{[\tilde{z}''_{i,k}(t)
    - z''_{i,k}(t)]}\)

    \(\le= \exp(\frac{||z''_{i,k} - z_{i,k}||_1}{b_k}) \le \exp(\frac{\Delta_k}{b_k})
    = e^{\epsilon_k}.\)


