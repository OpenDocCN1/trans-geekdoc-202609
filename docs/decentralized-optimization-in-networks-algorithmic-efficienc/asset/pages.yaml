- pgno: 59
  md: 'momentum term acceleration method. Recently, Gao et al. [44] presented a novel
    decentralized momentum algorithm (PDM) that encompassed heavy-ball and Nesterov
    momentum terms as specific instances.


    Driven by the aforementioned challenges, we were motivated to devise a decentralized
    algorithm that encompasses a range of momentum methodologies and leverages an
    event-based triggering mechanism, thereby enhancing efficiency in addressing the
    Economic Dispatch Problem (EDP) within smart grid systems.


    # ## 2.1.2 Statement of contributions


    Inspired by the works of [39–44], this chapter proposes a decentralized accelerated
    algorithm with event-triggered parameter updates, referred to as ET-PDA. The main
    contributions of this chapter are summarized as:


    +   (i) ET-PDA does not adhere to a single momentum strategy mentioned in [30–35].
    Rather, it embraces a diverse array of momentum methods, tailored to specific
    parameter settings. Consequently, the momentum approach adopted varies in accordance
    with the parameter values, allowing each generator to garner greater insight from
    its neighbors, ultimately speeding up the convergence rate.


    +   (ii) Given the significant costs and resources expended in continuous communication
    among generators, as documented in [11–20], ET-PDA employs an event-triggered
    approach instead of a time-triggered one [36–38]. This approach facilitates interaction
    between generators and their neighbors only when specific events occur, thus eliminating
    the need for real-time communication and ultimately enhancing overall efficiency.


    +   (iii) Distinct from the centralized updating approach of the Lagrangian multiplier
    employed in [45], ET-PDA adopts a decentralized strategy. Assuming the strong
    convexity and smoothness of the local cost function are upheld, ET-PDA can attain
    a linear convergence rate, provided that the maximum step-size and momentum coefficient
    adhere to specific criteria. Additionally, ET-PDA mitigates the emergence of Zeno-like
    behavior.


    # ## 2.1.3 Organization


    The foundational details are outlined in Section 2.2. In Section 2.3, we elaborate
    on the implementation procedures for ET-PDA. Section 2.4 verifies the convergence
    properties of ET-PDA. Additionally, the simulation outcomes presented in Section
    2.5 provide further evidence of the practical applicability of ET-PDA. Lastly,
    Section 2.6 concludes our findings and explores potential directions for future
    research.


    # ## 2.2 Preliminaries


    In this section, we offer a concise introduction to several essential ideas and
    concepts.'
