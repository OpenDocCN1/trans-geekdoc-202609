- pgno: 144
  md: '# 5.2.1 Problem descriptions


    Consider a directed network \(\mathcal{G} = \{\mathcal{V}, \mathcal{E}\}\) composed
    of \(n\) nodes, where \(\mathcal{V} = \{1, 2, ..., n\}\) and \(\mathcal{E} \subseteq
    \mathcal{V} \times \mathcal{V}\) represents the connections. Within this graph,
    node \(j\) can acquire data from the vertices in its adjacent set \(\mathcal{N}_j^{in}
    = \{i \in \mathcal{V} | (i, j) \in \mathcal{E}\}\). Assume that every node in
    the directed graph has access only to the data communicated by its incoming neighbors.
    This data is relayed through a dependable communication link, unaffected by delays,
    lost packets, or network congestion. Given these conditions, each vertex can use
    the information obtained from its incoming neighbors via the link to efficiently
    perform its iterations. Furthermore, each node \(i \in \mathcal{V}\) is associated
    with a collection of local convex cost functions \(\{f_{i,k}\}_{k=1}^K\), whose
    precise shapes are not predetermined but are determined as node \(i\) makes decisions
    at each instance \(k\). Under these circumstances, the objective of the nodes
    within the graph, at every instance \(k \in \{1, \cdots, K\}\), is to collectively
    optimize the subsequent minimization problem:


    $$\min f_k(x) = \sum_{i=1}^n f_{i,k}(x), \quad \text{s.t. } x \in \Omega, \quad
    (5.1)$$


    where \(\Omega\) is a non-empty, closed, and convex subset of \(\mathbb{R}^m\),
    and let \(x\) represent a global decision vector belonging to \(\mathbb{R}^m\).


    In this study, like previous investigations [12,15,23,28], we utilize regret as
    a measure to assess the effectiveness of our proposed algorithm. Due to the stochastic
    nature of the algorithm being examined (introducing randomized noise to obscure
    the true state of nodes for privacy reasons), we employ the concept of pseudo-individual-regret
    for node \(j \in \mathcal{V}\) across the timeframe \(K\), as referenced in [12,23,28]:


    $$\bar{R}_{j,K} = \mathbb{E}[\sum_{k=1}^K \sum_{i=1}^n f_{i,k}(x_{j,k})] - \mathbb{E}[\sum_{k=1}^K
    \sum_{i=1}^n f_{i,k}(x^*)], \quad (5.2)$$


    where \(x_{j,k}, j \in \{1, \cdots, n\}\) represents the local variable for \(x\)
    at time instant \(k\). Furthermore, the optimal decision over the time horizon
    \(K\) is denoted as \(x^*\), which is obtained by \(\arg\min_{x \in \Omega} \sum_{k=1}^K
    \sum_{i=1}^n f_{i,k}(x)\).


    Our primary objective in this context is to devise an efficient decentralized
    online optimization algorithm that not only ensures sublinear regret with respect
    to \(K\) as expressed in (5.2), specifically satisfying the condition \(\lim_{K
    \to \infty} \bar{R}_{j,K} / K = 0\) for all \(j \in \mathcal{V}\), but also fully
    preserves the privacy of the participating nodes. Furthermore, we operate under
    a set of presuppositions outlined in [32,47].


    **Assumption 5.1.** a) \(\mathcal{G}\) remains constant and possesses a robust
    connectivity; b) The matrix \(A\), belonging to \(\mathbb{R}^{n \times n}\), is
    row-stochastic, satisfying the condition that the sum of its elements in each
    row equals 1, that is, \(\sum_{j=1}^n A_{ij} = 1\) for every \(i\) in the set
    \(\mathcal{V}\).


    **Assumption 5.2.** a) The maximum possible diameter of \(\Omega\) is bounded
    above by a positive number \(M\); b) The subgradient \(g_{i,k}(x)\) possesses
    \(L\)-Lipschitz continuity, where \(L\) is a positive constant. This implies that
    the norm of \(g_{i,k}(x)\) is always less than or equal to \(L\), regardless of
    the values of \(k\) (as long as it is greater than or equal to 1), \(i\) (belonging
    to the set \(\mathcal{V}\)), and \(x\) (within the domain \(\Omega\)).'
  merge: -1
  img_proc: true
- pgno: 145
  md: '**Remark 5.1.** Assumption 5.1 a) assumes that every node within the directed
    network $\mathcal{G}$ has the ability to directly gather information from their
    incoming neighbors or indirectly through other nodes in the network. Assumption
    5.1 b) imposes further limitations on the weighted matrix $A$, which outlines
    how each node impacts its out-going neighbors. To elaborate, $A$ is presumed to
    be row-stochastic, indicating that the total of each row in $A$ equals 1. This
    assumption is extensively adopted in numerous studies [23,32,47,50] dealing with
    directed networks and holds significant importance for the subsequent analysis
    of the algorithm’s convergence. It is worth mentioning that formulating a weighted
    matrix $A$ adherent to Assumption 5.1 b) can be relatively straightforward, given
    that each node is aware of its in-degree, as referenced in [47,50].


    # ## 5.2.2 Differential privacy


    The scholars in [48] undertook a comprehensive examination of differential privacy,
    a concept that guarantees the confidentiality of delicate data while permitting
    participating nodes to divulge their personal details. In this section, we harness
    a differential privacy approach to protect the individual loss function of every
    node. The ensuing section introduces the definition of differential privacy.


    **Definition 5.1.** Given two datasets, denoted as $U = \{u_1, ..., u_n\}$ and
