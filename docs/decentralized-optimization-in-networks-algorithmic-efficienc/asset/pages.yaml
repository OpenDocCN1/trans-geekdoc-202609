  md: 'The transmission of information between nodes can be envisioned as a directed
    network, labeled $\mathcal{G} = \{\mathcal{V}, \mathcal{E}\}$, which comprises
    the set of nodes $\mathcal{V} = \{1, 2, ..., n\}$ and the set of edges $\mathcal{E}
    \subseteq \mathcal{V} \times \mathcal{V}$. When node \(j\) is capable of directly
    transmitting data to node \(i\), the edge \((j, i)\) belongs to \(\mathcal{E}\),
    with \(j\) considered an inbound neighbor for \(i\), and conversely, \(i\) is
    an outbound neighbor of \(j\). The set of inbound neighbors for node \(i\) is
    defined as $\mathcal{N}_i^{\text{in}} = \{j \in \mathcal{V} | (j, i) \in \mathcal{E}\}$,
    and similarly, the set of outbound neighbors $\mathcal{N}_i^{\text{out}}$ is delineated.
    A network is considered unbalanced if the inbound degree of a node \(i\) does
    not match its outbound degree. The directed network $\mathcal{G}$ is deemed strongly
    connected if a directed path exists between any two nodes. Furthermore, the key
    findings of this chapter are grounded on the assumption outlined below [7,28].


    **Assumption 1.1.** The mapping \(C_i : \mathbb{R} \to \mathbb{R}\) for all \(i
    \in \mathcal{V}\) is well-defined, closed-valued, and strictly convex, and the
    set \(D\) of admissible solutions is non-vacuous.


    Drawing upon Assumption 1.1, we can deduce that (1.1) is indeed a convex optimization
    problem, possessing a singular vector \(x^* = [x_1^*, x_2^*, ..., x_n^*]^T\) within
    the domain \(\mathbb{R}^n\) that attains the minimal value of the problem (1.1).


    # 1.2.2 A motivating example


    Problem (1.1) revolves around the issue of resource allocation, where diverse
    individual variables associated with nodes are interconnected through equality
    constraints while adhering to specific localized restrictions. It is noteworthy
    that problems of the form (1.1) arise in numerous engineering scenarios, such
    as the decentralized economic dispatch problems (EDPs) encountered in power systems
    [10,33,34,36], the decentralized channel allocation problems in wireless communication
    networks [9], etc. Here, we present a motivating practical application that aligns
    with the problem (1.1).


    **Example 1:** The focal point of decentralized economic dispatch problems (EDPs)
    lies in minimizing the overall generation cost, while fulfilling the aggregate
    load demand and adhering to the output constraints of individual generators. Here,
    we explore a network comprising \(n\) generators interconnected through directed
    networks. In this framework, the local variable \(x_i\) in problem (1.1) represents
    the power output of generator \(i\). Consequently, generator \(i\) incurs a cost
    \(C_i : \mathbb{R} \to \mathbb{R}\) when producing \(x_i\) power, typically adhering
    to Assumption 1.1. Therefore the total cost \(C\) of the network can be expressed
    as \(C(x) = \sum_{i=1}^n C_i(x_i)\), which aligns with (1.1a). Notably, EDPs prioritize
    the balance of the entire network, rather than the power balance of individual
    generators. To this end, the aggregate power output must match the total load
    of the network, expressed as a positive constant \(K\), satisfying \(\sum_{i=1}^n
    x_i = K\), which is (1.1b). Furthermore, it is realistic to assume that each generator
    \(i\) has a limited power output range, \(x_i \in \Omega_i = \{\hat{x} | x_{i,\min}
    \leq \hat{x} \leq x_{i,\max}\}\), captured by the constraints (1.1c) for all \(i\).
    Here, \(x_{i,\min}\) and \(x_{i,\max}\) denote the minimum and maximum power generation
    capacities. Additionally, in a practical power system, each generator only communicates
    its own information to neighboring generators without requiring feedback, rendering
    the communication network directional. However,'
