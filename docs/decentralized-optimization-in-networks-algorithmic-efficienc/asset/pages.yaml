    # 1.2.4 An epigraph form of problem (1.6)


    Distinct from the approaches mentioned in [7,8,22,28,31], the epigraph strategy
    offers a novel perspective to resolve the imbalance arising from directed networks
    in (1.6). This unique strategy has yet to find its application in current methods
    aimed at resolving resource allocation issues within directed networks. More precisely,
    the epigraph of the function \(J(y) : \mathbb{R} \to \mathbb{R}\) is characterized
    as detailed in [24,25,32]:


    ```

    \text{epi } J = \{(y, k)|y \in \text{dom}(J), J(y) \le k\},

    (1.7)

    ```


    which is a particular segment within the space \(\mathbb{R}^2\). Drawing from
    the reference [38], we deduce that the epigraph of \(J\) constitutes a convex
    set, owing to the convex nature of \(J\), as mentioned in the preceding subsection.
    As a result, minimizing \(J\) amounts to identifying the smallest value of the
    auxiliary variable \(k\) within its epigraph. Given this framework, we restructure
    the minimization problem (1.6), whose objective function is a summation of locally
    convex functions, into an epigraph-based format for facilitation of a solution.
    By utilizing auxiliary variables to delineate the upper limit of the local objective
    function, the current objective function is transformed into a singular linear
    function comprising these auxiliary variables, while the previous local objective
    function is converted into local constraints.


