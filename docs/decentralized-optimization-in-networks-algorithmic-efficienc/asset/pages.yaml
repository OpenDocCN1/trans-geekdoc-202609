  md: '# 8.2.3 Problem transformation


    Following the approach of previous works [23–28], the Lagrangian function L :
    P × R_{≥0} → R for (8.1) is formulated as follows:


    ```

    L(p, y) = \sum_{i=1}^m J_i(p_i) - y \sum_{i=1}^m (p_i - d_i),

    ```


    where y ∈ R_{≥0}. Then, the dual problem of (8.1) is indicated as


    ```

    max_{y ∈ R_{≥0}} Q(y) = \sum_{i=1}^m Q_i(y),

    ```


    where Q_i(y) is described as


    ```

    Q_i(y) = \min_{p_i ∈ P_i} J_i(p_i) - y(p_i - d_i), i ∈ V.

    ```


    Given an optimal p*, Assumption 8.1 implies that there exists at least one dual
    optimal solution y* for (8.3), ensuring a zero duality gap [42], i.e., J(p*) =
    Q(y*). For any non-negative y and under Assumption 8.1, the unique minimizer of
    (8.4) can be determined as follows:


    ```

    \tilde{p}_i(y) = \begin{cases} p_i^{\max}, & \nabla J_i^{-1}(y) \ge p_i^{\max},
    \\ \nabla J_i^{-1}(y), & p_i^{\min} < \nabla J_i^{-1}(y) < p_i^{\max}, \\ p_i^{\min},
    & \nabla J_i^{-1}(y) \le p_i^{\min}, \end{cases}

    ```


    where \nabla J_i^{-1}(y) exists within [p_i^{\min}, p_i^{\max}] as per Assumption
    8.1. Given the non-empty set of dual optimal solutions for (8.3), for any dual
    optimal solution y*, the sole optimal solution to (8.1) is p_i^* = \tilde{p}_i(y*),
    \forall i ∈ V. Since \tilde{p}_i(y) is unique for any given y ∈ R_{≥0}, it follows
    from [48] that Q(y) is differentiable at y, with its gradient given by


    ```

    \nabla Q(y) = - \sum_{i=1}^m (\tilde{p}_i(y) - d_i),

    ```


    and \nabla Q_i(y) = -(\tilde{p}_i(y) - d_i), \forall i ∈ V. For any given y, it
    can further be deduced that -Q_i(y) is a convex function, and |\nabla Q_i(y)|
    ≤ C, where C > 0 (see Proposition 1 in [36] for more details).


    Currently, numerous centralized and decentralized methods exist to solve the dual
    problem (8.3). However, these methods often overlook the issues of private security
    during information exchange and the computational efficiency of generators in
    unbalanced directed networks. These are critical concerns in the practical economic
    dispatch of smart grids. To address these challenges, it is necessary to design
    an algorithm that not only protects sensitive information and enhances computational
    efficiency in a decentralized manner but also adapts to the unbalanced directed
    networks discussed in this chapter. This is the principal motivation behind the
    algorithm proposed in the following subsection.'
