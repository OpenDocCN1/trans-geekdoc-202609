    # 1.7 Conclusion


    In this chapter, we introduce two innovative decentralized asynchronous methodologies
    aimed at resolving resource allocation challenges across directed networks. To
    mitigate the imbalance arising from directed networks in the dual-related domain,
    we adopt a fresh perspective by leveraging the epigraph approach. Additionally,
    we enhance communication efficiency by incorporating the gossip-based protocol
    and the random sleep protocol into our proposed algorithms. Our theoretical investigations
    confirm that these algorithms effectively allocate optimal resources for the given
    problem. Furthermore, we provide a theoretical analysis of the error bounds associated
    with these algorithms. To validate their performance, we conduct extensive simulations.
    Looking ahead, we intend to broaden the applicability of these algorithms to various
    real-world scenarios, encompassing random link failures, transmission losses,
    and latency. Additionally, exploring the integration of differential privacy strategies
    to safeguard information and prevent leakage represents a promising area for future
    research.


