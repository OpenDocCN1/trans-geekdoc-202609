- pgno: 143
  md: '# 5.1.2 Main contributions


    +   (i) We introduce an efficient differentially private decentralized dual averaging
    algorithm, achieved by integrating the gradient rescaling tactic into the decentralized
    dual subgradient averaging method, which employs Laplace noise perturbation. In
    contrast to the current cloud-based differential privacy techniques referenced
    in [43,46], our proposed algorithm facilitates a simpler decentralized implementation
    as it eliminates the need for an additional central hub.


    +   (ii) Unlike the methods described in references [27–31], which necessitate
    starting from zero initial conditions, our algorithm permits dual variables to
    begin with any initial state. This flexibility and robustness eliminate the need
    for nodes in the network to coordinate beforehand. Additionally, contrasting with
    the technique outlined in reference [23], our algorithm utilizes dual subgradient
    averaging, offering a fresh viewpoint on decentralized online optimization challenges
    with constraints.


    +   (iii) When compared to the privacy safeguarding methods [44,45], our algorithm,
    utilizing row-stochastic weights, can be applied to a wider range of practical
    and general network topologies. Additionally, our algorithm can address imbalances
    caused by directed networks by employing a gradient rescaling tactic and is broader
    in scope than the method described in [27], which relies on prior knowledge of
    the entire network to compute the eigenvectors of the weight matrix beforehand.


    +   (iv) Our proposed algorithm attains an expected regret of O(√K) (K denotes
    the time horizon), which is on par with non-privacy-focused algorithms referenced
    in [27,29–31]. Additionally, we conducted a thorough analysis of the ε-differential
    privacy aspect of our algorithm (ε represents the privacy level), thereby exposing
    the balance between optimization precision and privacy protection. Lastly, our
    investigations also demonstrated that our algorithm exhibits comparable performance
    even in the presence of limited communication delays within the network.


    _Notation:_ Let _I<sub>n</sub>_ represent the _n × n_ identity matrix, whereas
    _0<sub>n</sub>_ and _1<sub>n</sub>_ symbolize the _n × 1_ vectors whose elements
    are all zero and one, respectively. The notation ⟨_a_, _b_⟩ refers to the inner
    product of two vectors _a_, _b_ ∈ R_<sup>m</sup>_. The Euclidean norm and 1-norm
    of the vector _a_ ∈ R_<sup>m</sup>_ are denoted by ∥_a_∥ and ∥_a_∥<sub>1</sub>,
    respectively. The transpose of a vector is indicated by the superscript (·)<sup>T</sup>.
    We define a vector _e<sub>i</sub>_ = [0, ..., _i<sub>i</sub>_, ..., 0]<sup>T</sup>,
    where all elements are zero except for the _i_th element, which is one. Let E[_z_]
    and P[_z_] stand for the expectation and probability of a random variable _z_,
    respectively. Given a function _f_ : R_<sup>m</sup>_ → R, its subdifferential
    at a point _v_ ∈ R_<sup>m</sup>_, denoted by ∂_f_(_v_), signifies the set containing
    all subgradients. Here, _g_(_v_) ∈ ∂_f_(_v_) ⊆ R_<sup>m</sup>_ represents the
    subgradient of _f_ at _v_ satisfying the condition _f_(_v_) - _f_(_u_) ≥ ⟨_g_(_v_),
    _u_ - _v_⟩ for all _u_ ∈ R_<sup>m</sup>_.


    # 5.2 Problem description


    In this section, we outline a decentralized online optimization challenge with
    constraints. Following that, the fundamentals of differential privacy are introduced.'
