  md: 'Then, each generator \( i \) applies the random sleep strategy described in
    (8.7) to obtain the dual-related variable \( y_i^{t+1} \), adding an arbitrary
    noise \( \epsilon_i^t \). After updating \( y_i^{t+1} \), each generator \( i
    \) calculates the dual variable \( v_i^{t+1} \) and the auxiliary variable \(
    z_i^{t+1} \) via dynamic average consensus as per (8.8). Subsequently, each generator
    \( i \) updates the local primal variable \( x_i^{t+1} \) using (8.9). The algorithm
    terminates after a predefined number of iterations.


    In Algorithm 1, the local step-size \( \gamma_i^t \), for \( i \in \mathcal{V}
    \), diminishes according to the relative frequency of updates by generator \(
    i \), defined as \( \gamma_i^t = 1/\Gamma_i^t \), where \( \Gamma_i^t \) represents
    the number of updates performed by generator \( i \) up to time \( t \) [43].
    Moreover, the bound (\( \hat{\epsilon}^t \)) of conditional noise adheres to the
    following conditions [36]: (i) \( \lim_{t \to \infty} \hat{\epsilon}^t / (t^2)
    = 0 \), for all \( t \ge 0 \) and \( i \in \mathcal{V} \); (ii) \( 0 < \hat{\epsilon}^t
    \le \hat{\epsilon}^s \), for all \( 0 \le s < t \). The matrix \( B = [b_{ij}]
    \in \mathbb{R}^{m \times m} \) collects the weights \( b_{ij}, i, j \in \mathcal{V}
    \), corresponding to the network \( \mathcal{G} \), subject to the conditions:


    ```

    \( b_{ij} = \begin{cases} > \varrho, & j \in \mathcal{N}_i^{\text{in}}, \\ 0,
    & \text{otherwise,} \end{cases} \quad \sum_{j=1}^m b_{ij} = 1, \forall i \in \mathcal{V}
    \quad (8.10) \)

    ```


    and \( b_{ii} = 1 - \sum_{j \in \mathcal{N}_i^{\text{in}}} b_{ij} > \varrho, \forall
    i \in \mathcal{V} \), where \( 0 < \varrho < 1 \). Here, the matrix \( B \) is
    row-stochastic as verified.


    Essentially, \( -(p_i^t - d_i) \) in (8.7) is the gradient of \( Q_i(y) \) at
    \( y = v_i^t \), i.e., \( \nabla Q_i(v_i^t) = d_i - p_i^t, i \in \mathcal{V} \).
    It is notable that this gradient term is combined with conditional noise, unlike
    the precise gradient in [25–27], presenting a challenge in proving the convergence
    of Algorithm 1. Furthermore, the random sleep strategy in (8.7) indicates that
    each generator need not compute the inexact gradient term when updating \( y_i^t
    \), potentially reducing computation cost. Moreover, (8.7) represents a decentralized
    inexact gradient ascent step, with the gradient scaled by \( [z_i^t]_1 \), updated
    through (8.8). The update of \( z_i^t \) in (8.8) is a consensus step designed
    to address the imbalance caused by the left normalized Perron eigenvector \( c
    = [c_1, ..., c_m]^\mathsf{T} (1_m^\mathsf{T} c = 1) \), associated with the eigenvalue
    1 of matrix \( B \). This step is similar to those used in [24,37,38]. Lastly,
    Algorithm 1 avoids using any global parameters, enabling fully decentralized implementation.


    From the above analysis, Algorithm 1 achieves the following advantages under the
    condition of accurate convergence: (i) Protection of sensitive information; (ii)
    Enhanced computational efficiency; (iii) Applicability to unbalanced directed
    networks.


    **Remark 8.3.** Over the past decade, some effective metaheuristic algorithms
    [59,60] have been applied to solve the EDP, yielding better performance with complex
    cost functions or constraints. However, these metaheuristic algorithms do not
    guarantee convergence to the global optimal solution, which can only be achieved
    by comparing the costs of all feasible solutions. In contrast to these algorithms
    [59,60], the proposed algorithm can rigorously be proven to converge to the global
    optimal solution of the EDP without additional comparisons, thus avoiding resource
    consumption. Furthermore, most metaheuristic algorithms, which primarily rely
    on centralized control, may fail if one or more control signal links are disrupted.
    The proposed algorithm is robust to such scenarios with decentralized control.'
