  md: '# Algorithm 1 The proposed decentralized algorithm (ZO-DDA) at each node $i
    \in \mathcal{V}$.


    +   1: **Initialization:** Each node \(i\) starts with \(\alpha_0 > 0, q_1^i \in
    \mathbb{R}^m, x_1^i = \Pi_{(1-\xi)\Omega}^\phi(q_1^i, \alpha_0)\), and \(v_1^i
    = 1\).

    +   2: Set \(t = 1\).

    +   3: **while** \(t \le T\) **do**

    +   4: Calculate subgradient estimator \(\hat{g}_t^i(x_t^i)\) via

    +   \[\hat{g}_t^i(x_t^i) = \frac{m}{\delta}(f_t^i(x_t^i + \delta b_t^i) - f_t^i(x_t^i))
    b_t^i.\]

    +   5: Generate noise \(\vartheta_t^i \sim \mathcal{L}(0, b_t)\).

    +   6: Perturb \(q_t^i\) by \(\vartheta_t^i\) and gain \(\tilde{q}_t^i\) via

    +   \[\tilde{q}_t^i = q_t^i + \vartheta_t^i.\]

    +   7: Transmit \(c_t^{ji} v_t^i\) and \(r_t^{ji} \tilde{q}_t^i\) to its out-neighbors
    \(j \in \mathcal{N}_{t,\text{out}}^i\).

