  md: '# Event-triggered decentralized accelerated algorithms for economic dispatch
    in networks


    # 2.1 Introduction


    As society and technology rapidly progress, several domains, including computing,
    communication, and control, are confronting the growing challenge of ever-increasing
    data volumes and computational demands [1,2]. Traditional centralized approaches
    may struggle to cope with such intricate and expansive problems due to their inherent
    limitations. In response, distributed algorithms have emerged as a viable solution.
    These algorithms have garnered considerable attention in various real-world applications,
    such as smart grids [3,4], sensor networks [5,6], and machine learning [7,8],
    owing to their capacity to facilitate collaborative and coordinated problem-solving
    among multiple entities. Recognizing the benefits of decentralized algorithms
    in terms of robustness, adaptability, and scalability, researchers have explored
    their potential in addressing the economic dispatch problem (EDP) [9,10].


    # 2.1.1 Literature review


    The Economic Dispatch Problem (EDP) holds a fundamental and crucial position in
    the grid economy, aiming to facilitate generators in adhering to their generation
    capacity limitations while minimizing overall generation costs and fulfilling
    the total generation demand. Currently, numerous studies have delved into decentralized
    algorithms for addressing the EDP [11–16]. Zhang and Chow [11] introduced an algorithm
    known as ICC, facilitating a decentralized approach to EDP. However, a significant
    limitation emerged: maintaining the supply–demand equilibrium necessitated a leader,
    whose selection significantly influenced the convergence rate. Subsequently, Yang
    et al. [12] devised methods to eliminate the reliance on a leader. Additionally,
    Hug et al. [13] presented a “consensus + innovations” strategy, where the mismatch
    between demand and supply served as the innovative term for each generator’s consensus
    variable. The references [14–16] tackled EDP from diverse perspectives. Nevertheless,
    the aforementioned algorithms [7,11–16] rely on decaying step-sizes to attain
    optimal solutions, thereby resulting in a sluggish convergence.'
