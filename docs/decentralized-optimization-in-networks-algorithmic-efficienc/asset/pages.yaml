- pgno: 212
  md: '# 7.2.1 Problem formulation


    This work aims to address the following decentralized constrained optimization
    problem:


    ```

    \min_{x \in \Omega} f(x) = \sum_{i=1}^v f_i(x),\qquad(7.1)

    ```


    where \(x \in \mathbb{R}^d\) is the global decision variable and \(\Omega \subseteq
    \mathbb{R}^d\) is a non-empty, closed, and convex set. Each node \(i \in \{1,
    2, ..., v\}\) has its local cost function \(f_i : \mathbb{R}^d \to \mathbb{R}\),
    and no node has access to the global cost function \(f\). Additionally, we make
    the following assumptions.


    **Assumption 7.1.** (a) The optimization problem (7.1) has at least one finite
    solution \(x^*\); (b) Each function \(f_i(x)\) is convex and \(L\)-Lipschitz continuous
    over the set \(\Omega\) for any \(i \in \{1, 2, ..., v\}\).


    Assumption 7.1(a) ensures the existence of a solution \(x^*\) that minimizes problem
    (7.1). Assumption 7.1(b) implies that \(||g_i|| \le L\) for any \(x \in \Omega\)
    and any subgradient \(g_i \in \partial f_i(x)\), for all \(i \in \{1, 2, ...,
    v\}\).


    # 7.2.2 Communication network


    Consider a time-varying directed network \(\mathcal{G}(k) = \mathcal{V}, \mathcal{E}(k)\),
    comprising the set of nodes \(\mathcal{V} = \{1, 2, ..., v\}\) and the set of
    edges \(\mathcal{E}(k) \subseteq \mathcal{V} \times \mathcal{V}\) for \(k \ge
    1\). If node \(j\) can directly send messages to node \(i\) at time \(k\), then
    \((j, i) \in \mathcal{E}(k)\), where node \(j\) is an in-neighbor of node \(i\),
    and node \(i\) is an out-neighbor of node \(j\). The in-neighbors of node \(i\)
    at time \(k\) are denoted by \(\mathcal{N}_i^{\text{in}}(k) = \{j \in \mathcal{V}
    | (j, i) \in \mathcal{E}(k)\}\), and its out-neighbors are denoted by \(\mathcal{N}_i^{\text{out}}(k)\).
    The network is unbalanced if a node''s in-degree differs from its out-degree.
    The weighted matrix of the network \(\mathcal{G}(k)\) is represented by \(P(k)
    = [P_{ij}(k)] \in \mathbb{R}^{v \times v}\), where \(P_{ij}(k) > 0\) if \((j,
    i) \in \mathcal{E}(k)\), and \(P_{ij}(k) = 0\) otherwise. Additionally, we make
    the following assumptions regarding the network.


    **Assumption 7.2.** (a) There exists a positive integer \(B\) such that the joint
    network \(\mathcal{G}(k) \cup \mathcal{G}(k+1) \cup \cdots \cup \mathcal{G}(k+B-1)\),
    \(k \ge 1\), is strongly connected; (b) The matrix \(P(k) \in \mathbb{R}^{v \times
    v}\) is column-stochastic, meaning \(\sum_{i=1}^v P_{ij}(k) = 1\) for all \(j
    \in \mathcal{V}, k \ge 1\).


    **Remark 7.1.** Assumption 7.2(a) ensures that all nodes can obtain information
    from their in-neighbors or indirectly from any other nodes within any period of
    \(B\). This is a more general assumption than requiring strong connectivity of
    each directed network \(\mathcal{G}(k)\), \(\forall k \ge 1\). Assumption 7.2(b)
    specifies that the weighted matrix \(P(k)\) is column-stochastic, which means
    the sum of each column of \(P(k)\) is 1. This is a common assumption in the literature
    [11,27,28,36] on time-varying directed networks and is crucial for the convergence
    analysis of the designed algorithm. Furthermore, constructing \(P(k)\) to meet
    Assumption 7.2(b) is straightforward if each node knows its out-degree. For instance,
    \(P_{ij}(k) = \frac{1}{d_j^{\text{out}}(k)+1}\) if \(j \in \mathcal{N}_i^{\text{in}}(k)\),
    and \(P_{ij}(k) = 0\) otherwise, where \(d_j^{\text{out}}(k) = |\mathcal{N}_j^{\text{out}}(k)|\)
    is the out-degree of node \(j\) at time \(k\). Here, \(|\cdot|\) denotes the cardinality
    of a set.'
