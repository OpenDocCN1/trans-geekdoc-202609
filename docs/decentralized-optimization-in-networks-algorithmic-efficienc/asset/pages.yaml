    = \mathcal{X} \cap \mathcal{H}\) is the feasible set of problem (2.2). Hence,
    \(\mathcal{X}^\star = \{ \mathbf{x} \in \Omega | \sum_{i=1}^n f_i(x_i) = f^\star
