    representation of (1.6). Drawing from the previous deliberations, problem (1.6)
    can be precisely rephrased in the following manner:


    ```

    \min_{(y,k) \in \mathfrak{S}} \sum_{i=1}^n 1_n^T k, \text{ s.t. } J_i(y) - e_i^T
    k \le 0, \forall i \in \mathcal{V},

    (1.8)

    ```


    where \(k = [k_1, ..., k_n]^T \in \mathbb{R}^n\) and \(\mathfrak{S} = \mathbb{R}
