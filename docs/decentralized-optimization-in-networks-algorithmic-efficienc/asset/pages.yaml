- pgno: 15
  md: '# Asynchronous decentralized algorithms for resource allocation in directed
    networks


    # 1.1 Introduction


    Decentralized optimization has garnered significant interest in recent years due
    to its extensive applicability across various network engineering systems, spanning
    power grids [1,2], sensor networks [3,4], and edge computing networks [5]. Many
    optimization challenges encountered in these systems often manifest as decentralized
    resource allocation quandaries, such as economic dispatch in smart grids [1,2,6,7],
    computational resource assignment in edge computing [8], and channel allocation
    in wireless communication [9]. Traditional centralized approaches to resolving
    such problems typically necessitate a central entity to gather crucial information
    from all nodes, which proves costly, susceptible to single points of failure,
    and lacking resilience in new environments. In contrast, decentralized methods
    circumvent the need for long-distance communication, thus effectively mitigating
    the drawbacks of centralized approaches while offering enhanced robustness, quicker
    computation, reduced communication overhead, and bolstered privacy protection
    [10–13].


    # 1.1.1 Literature review


    Decentralized optimization techniques, which primarily rely on gradient information,
    constitute a significant portion of the decentralized resource allocation strategies
    documented in the research literature [14–21]. Notably, the work presented in
    [14] introduced a decentralized algorithm without a central coordinator, representing
    a groundbreaking approach for decentralized implementations. However, this initial
    algorithm lacks the consideration of local constraints, which are crucial in practical
    applications, such as limiting the capacity of generators in economic dispatch
    problems. To address this limitation, a diverse range of decentralized methods
    have been proposed, including the decentralized bisection method [15], dual gradient
    algorithms [16], consensus-based optimization [17,18], primal-dual gradient approaches
    [19,20], and dual splitting algorithmsmm [21]. These techniques aim to incorporate
    local constraints effectively. Additionally, several efficient methods have been
    introduced to tackle diverse factors in resource allocation, such as privacy considerations
    [22],'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'communication efficiency [1], and balancing supply and demand [23]. More recently,
    decentralized game-theoretic frameworks [4,43,44] have garnered attention in addressing
    the resource allocation challenge. Specifically, the authors in [43] presented
    an enhanced and flexible game-theoretic framework known as the MSUPC-CP algorithm,
    aimed at efficient decentralized power control. In this framework, the decision-making
    process of users acting as players occurs asynchronously and in a decentralized
    fashion. Subsequently, the authors in [4,44] introduced two novel decentralized
    algorithms to efficiently compute the two-variable Nash equilibrium points of
    optimization problems stemming from two distinct real-world resource allocation
    scenarios.


    When decentralized methods are utilized to address real-world decentralized resource
    allocation issues, the communication network among the nodes stands as a critical
    component that merits thorough consideration. In actual applications, information
    exchange tends to be asymmetric, leading to the development of unbalanced and
    directed communication networks [28,31]. Unlike traditional methods for managing
    directed networks, such as the push-sum average consensus technique [28] and the
    gradient rescaling approach [31], researchers in [24,25] employed the epigraph
    strategy to tackle the imbalance resulting from directed networks from a fresh
    perspective. It is worth noting that in [24,25], synchronous decentralized algorithms
    are examined for general optimization problems, where all nodes update concurrently.
    This synchronization relies on a central timing reference that nodes consult,
    enabling them to synchronize global parameters (e.g., step-size), but this significantly
    constrains their applicability. Furthermore, in practical scenarios, some nodes
    may remain inactive at certain intervals. To facilitate asynchronous operations
    among nodes, numerous protocols have been introduced, such as gossip-based protocols
    [26,27], random sleep protocols [29], and broadcast-based protocols [30,32].


    Upon reviewing the current landscape, we recognize the scarcity of asynchronous
    algorithms that are specifically designed to handle decentralized resource allocation
    problems in directed networks. Motivated by this realization, the principal aim
    of this chapter is to explore a decentralized asynchronous algorithm that aims
    to uncover the optimal solution for decentralized resource allocation issues in
    directed networks.


    # ## 1.1.2 Main contributions


    In this chapter, we examine a comprehensive resource allocation scenario that
    encompasses diverse real-world applications in directed networks. Rather than
    addressing the original problem directly, we endeavor to solve its dual counterpart
    in a fully decentralized and asynchronous framework. To this end, we introduce
    a novel decentralized asynchronous algorithm grounded on the gossip communication
    protocol and epigraph methodology, rendering it suitable for practical applications
    and exhibiting flexibility. In comparison to existing research, the distinguishing
    features of our current work are summarized as follows:'
