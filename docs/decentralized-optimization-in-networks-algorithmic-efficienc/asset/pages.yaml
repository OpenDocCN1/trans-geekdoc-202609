  md: '# 7.2.3 Motivating examples


    Problem (7.1) is a general decentralized constrained optimization problem where
    network nodes aim to collectively minimize the sum of local cost functions subject
    to a shared constraint set. Such problems are prevalent in many engineering applications,
    such as energy-based source localization in wireless sensor networks [6,7] and
    information control [8,9]. They also appear in machine learning applications like
    distributed regression [46,48,49]. Below, are two practical applications fitting
    problem (7.1).


    **Example 7.1.** A prominent example of problem (7.1) is the decentralized constrained
    sparse logistic regression problem [48,49], which has significant applications
    in machine learning. Building on [48,49], we introduce a general constraint \(\Omega\)
    to prevent extreme deviations during optimization. The decentralized constrained
    sparse logistic regression problem is formulated as:


    ```

    $$\min_{x \in \Omega} \sum_{i=1}^v \sum_{j=1}^{n_i} \ln[1 + \exp(-b_{ij} e_{ij}^T
    x)] + \rho_1 ||x||_1 + \rho_2 ||x||^2,$$

    ```


    where each node \(i\) is assigned \(n_i\) pairs of samples \(\{b_{ij}, e_{ij}\}_{j=1,2,...,n_i}\)
    to train, where \(b_{ij} \in \{-1, 1\}\) represents the label of the \(i, j\)th
    sample and \(e_{ij} \in \mathbb{R}^d\) denotes the feature vector. The positive
    constants \(\rho_1, \rho_2\) are regularization coefficients for the \(l_1\)-norm
    and \(l_2\)-norm, respectively, and \(\Omega\) is a closed, convex set. This problem
    can be rewritten in the form of problem (7.1) by defining


    ```

    $$f_i = \sum_{j=1}^{n_i} \ln[1 + \exp(-b_{ij} e_{ij}^T x)] + \frac{\rho_1}{v}
    ||x||_1 + \frac{\rho_2}{v} ||x||^2,$$

    ```


    which satisfies Assumption 7.1. The goal is to use the training set to find the
    optimal solution \(x^*\), which can then be used for regression. During decentralized
    regression, each server only needs to send information to its neighbors without
    feedback, making the network directional. Furthermore, long-term server operations
    can cause link or partial server failures, resulting in a time-varying communication
    network. Therefore problem (7.1) models the decentralized constrained sparse logistic
    regression problem well. Section 7.6.1 will demonstrate our algorithm’s performance
    on this decentralized regression problem using a real-world dataset.


    **Example 7.2.** Another common example of problem (7.1) is the decentralized
    energy-based source localization problem [46,52]. Determining the location of
    an acoustic source is crucial in military and environmental fields. Inspired by
    [46,52], consider an unknown location \(\breve{x} \in \Omega\) of a fixed acoustic
    source. Each sensor in the network aims to estimate this location through local
    communication and computation. Each sensor \(i \in \mathcal{V}\) is randomly located
    at \(c_i\), known only to itself, and takes \(n_i\) measurements. The isotropic
    energy propagation model \(m_{ij} = a / (\breve{x} - c_i)^v + b_{ij}\) is used
    for the \(j\)th measurement at sensor \(i\), where \(v \ge 1\) is an attenuation
    factor,'
