    In this section, we delve into a related decentralized asynchronous algorithmic
    approach that utilizes the random sleep protocol and epigraph strategy to tackle
    the problem in the context of time-varying directed networks.


    # 1.5.1 Network and algorithm


    Assuming the interplay between nodes fluctuates over time, we define \(\mathcal{G}^t
    = \{\mathcal{V}, \mathcal{E}^t\}\) to represent the evolving directed communication
    network at each time \(t \ge 0\). Here, \(\mathcal{E}^t \subseteq \mathcal{V}
    \times \mathcal{V}\) signifies the set of directed edges, and \(\mathcal{N}_i^{\text{in},t}
    = \{j \mid (j, i) \in \mathcal{E}^t\}\) denotes the set of in-neighbors for node
    \(i\) at time \(t\). In the subsequent discussion, we typically adopt the following
    assumptions regarding the networks.


    **Assumption 1.3.** We introduce a positive integer constant \(B\) such that,
    for any non-negative time \(t\), the union of consecutive networks from \(\mathcal{G}^t\)
    to \(\mathcal{G}^{t+B-1}\) maintains strong connectivity, denoted as \(\mathcal{G}^t
    \cup \mathcal{G}^{t+1} \cup \dots \cup \mathcal{G}^{t+B-1}\).


    Assumption 1.3 stipulates that within any given period of \(B\) time units, any
    node has the capability to acquire information either directly from its incoming
    neighbors or indirectly through any other node in the network. This assumption
    encompasses a broader scope compared to presuming the individual directed networks
    \(\mathcal{G}^t\) to be strongly connected.


    Here, we propose a decentralized asynchronous algorithm that leverages the random
    sleep protocol and epigraph strategy. To clarify the approach, we first elaborate
    on the random sleep mechanism. Specifically, we introduce \(h_i^t\), a random
    variable that determines whether node \(i\) is active or inactive at time \(t
    \ge 1\). If \(h_i^t = 1\), node \(i\) performs updates at time \(t\); otherwise,
    it remains unchanged. Notably, \(h_i^t\) is assumed to be an independent and identically
    distributed Bernoulli random variable with probability \(\mathbb{P}(h_i^t = 1)
    = \hat{\eta}_i\) and \(\mathbb{P}(h_i^t = 0) = 1 - \hat{\eta}_i\), where \(0 <
    \hat{\eta}_i \le 1\) for all \(i \in \mathcal{V}\). We further define \(\hat{\eta}_{\max}\)
    and \(\hat{\eta}_{\min}\) as the maximum and minimum activation probabilities
    among all nodes in the network. Subsequently, we formally present Algorithm 2,
    which outlines the decentralized asynchronous algorithm for each node \(i\) utilizing
    the random sleep protocol.


    Algorithm 2 employs the same decaying step-size (random) \(\alpha_i^t, i \in \mathcal{V}\),
    analogous to Algorithm 1. Specifically, \(\alpha_i^t = 1 / \Gamma_i^t\), where
    this formulation adheres to the prerequisites outlined in Lemma 1.2 with distinct
    parameters \(\alpha_1, \alpha_2\), and \(\alpha_3\) (see Lemma 3 in [31] for a
    detailed proof). This eliminates the need for any global parameters, allowing
    each node to update its states by either receiving information from its neighboring
    nodes or solely relying on its own data at each time \(t\). Furthermore, we introduce
    a matrix \(\hat{W}^t = [\hat{w}_{ij}^t] \in \mathbb{R}^{n \times n}\) that corresponds
    to the network \(\mathcal{G}^t\) at time \(t \ge 0\) and adheres to the conditions
    as:


    ```

    \(\hat{w}_{ij}^t = \begin{cases} > \rho, & j \in \mathcal{N}_i^{\text{in},t},
    \\ 0, & \text{otherwise}, \end{cases} \quad \sum_{j=1}^n \hat{w}_{ij}^t = 1, \forall
    i \in \mathcal{V}\)

    ```'
