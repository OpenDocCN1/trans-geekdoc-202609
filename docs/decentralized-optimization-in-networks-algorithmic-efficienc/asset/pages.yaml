- pgno: 172
  md: 'Expanding upon the existing research on online optimization, methodologies
    grounded in decentralized dual averaging have garnered significant attention.
    Specifically, the study presented in [22] introduced a decentralized dual averaging
    algorithm tailored for tackling online constrained optimization challenges over
    undirected network topologies. Nonetheless, in practical online optimization scenarios,
    information exchange is often unidirectional, leading to unbalanced and directed
    communication networks [23,24,44,45,48]. Recognizing this limitation, numerous
    decentralized dual averaging techniques have emerged, each designed to address
    the imbalance inherent in directed networks. These methods leverage diverse strategies,
    including the push-sum mechanism [27,40,48] and the surplus-based method [28],
    subgradient rescaling [44,45], among others. More recently, research has addressed
    the even more intricate scenario where directed networks undergo temporal variations
    [25]. For instance, the authors of [25] developed a decentralized dual averaging
    push method specifically for solving online constrained optimization problems
    in the context of time-varying directed networks. Beyond these strategies, the
    work in [29] presented an innovative approach by constructing row-stochastic matrices
    and subsequently rescaling the zeroth-order oracle, demonstrating its efficacy
    in mitigating the imbalance of time-varying directed networks. However, it is
    important to note that this particular strategy does not intersect with the realm
    of decentralized dual averaging methods, which forms the cornerstone of the present
    investigation.


    Moreover, the aforementioned methods necessitate learning the comprehensive loss
    function or its subgradients, which are unattainable in certain real-world applications,
    for example, online source localization routing in data networks [30] and adversarial
    black-box machine learning [49], among others. This underscores the importance
    of implementing zeroth-order methodologies that approximate the gradient of a
    loss function solely based on its function value [32–34]. An array of decentralized
    zeroth-order algorithms have been explored in the literature [35,41], wherein
    instead of directly computing the true gradient, these algorithms leverage function
    evaluations to devise gradient estimators. Recently, the realm of decentralized
    zeroth-order methods has expanded into the online domain [26,29–31]. Notably,
    the authors in [26] introduced a push-sum based decentralized online method employing
    zeroth-order techniques (a one-point gradient estimator approach), achieving anticipated
    sublinear regrets over time-varying directed networks. Similarly, the method presented
    in [29] attained the desired results utilizing zeroth-order approaches (adopting
    a two-point gradient estimator approach). Nevertheless, it is crucial to highlight
    that zeroth-order methods are not incorporated within the framework of decentralized
    dual averaging methods, which forms the crux of the present investigation.


    In numerous practical contexts, communication frequently occurs in less-than-ideal
    environments [36,37]. Malicious entities within the network can intercept information
    exchanged between nodes and deduce sensitive details about participating nodes,
    posing a significant risk of privacy compromise [38,39,42]. Given the surge in
    privacy breaches recently, safeguarding the privacy of every node in decentralized
    networks has become a pressing concern [36–39,42]. Differential privacy, an'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'alluring solution, has garnered substantial interest due to its rigorous mathematical
    underpinnings, provable security properties, and straightforward implementation
    [43]. Essentially, differential privacy involves introducing controlled noise
    to transmitted data, striking a balance between preserving privacy and maintaining
    optimization precision. In light of this, researchers in [20] introduced a differentially
    private decentralized primal method tailored to address a privacy-sensitive online
    constrained optimization problem over directed networks. Subsequently, the study
    in [39] presented a differentially private decentralized online dual averaging
    method for time-varying directed networks.


    # 6.1.2 Main contributions


    In this chapter, we concentrate on tackling a privacy-centric decentralized online
    constrained optimization challenge within the framework of time-varying directed
    networks. To this end, we devise an efficacious decentralized algorithm, dubbed
    ZO-DDA, that comprehensively addresses the aforementioned concerns and enhances
    its applicability in practical scenarios. In comparison to prior research, the
    salient contributions of our work can be summarized as follows:


    +   (i) A proficient zeroth-order decentralized dual averaging methodology, termed
    ZO-DDA, is introduced to address the privacy-sensitive online constrained optimization
    task within the context of dynamically evolving directed networks. The anticipated
