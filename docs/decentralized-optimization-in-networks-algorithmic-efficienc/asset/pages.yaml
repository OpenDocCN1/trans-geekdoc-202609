  md: '# ## 7.5 Analysis of privacy protection


    This section focuses on demonstrating how Algorithm 1 ensures privacy protection
    through the edge-based correlated perturbations strategy. We begin with some preliminaries,
    followed by the main results regarding the privacy-protection properties of Algorithm
    1.


    # ### 7.5.1 Preliminaries


    Due to the integration of edge-based correlated perturbations in Algorithm 1,
    the information obtained by malicious nodes about their in-neighbors is inaccurate.
    Nonetheless, normal nodes can still receive accurate information from their in-neighbors
    and use it to update their variables. Malicious nodes, however, might collaborate
    to infer private information about the sender. Therefore it is essential to ensure
    that malicious nodes cannot distinguish between real and fake subgradients of
    normal nodes using the edge-based correlated perturbations strategy in Algorithm
    1.


    We define $\mathcal{D}_H$ and $\mathcal{D}_E$ as the sets of normal and malicious
    nodes, respectively. Additionally, we make the following assumption regarding
    the capabilities of malicious nodes.


    **Assumption 7.3.** Malicious nodes have full knowledge of the adjacency matrix
    and all transmitted information from their in-neighbors. Specifically, node $j
    \in \mathcal{D}_E$ can observe $h_j(k), \tau_{ij}(k), \tilde{h}_{ji}(k), i \in
    \mathcal{N}_j^{\text{in}}(k)$, and $P(k)$ for all $k \ge 1$.


    Assumption 7.3 allows malicious nodes to possess comprehensive network information,
    which is more realistic than the assumptions in the existing literature [31,36].
    We define the observations of nodes $j \in \mathcal{D}_E$ as $S(\{h_i(1), g_i(k),
    \tau_{ji}(k)\}_{i,j \in \mathcal{V}, k \ge 1}) = \{ \tilde{h}_{ji}(k) \}_{j \in
    \mathcal{D}_E, k \ge 1}$ about an output of Algorithm 1, which depend on the input
    $\{h_i(1), g_i(k), \tau_{ji}(k)\}_{i,j \in \mathcal{V}, k \ge 1}$. The following
    definition describes the privacy protection of Algorithm 1.


    **Definition 7.1.** If there exist $\hat{h}_i(1) \in \mathbb{R}^d$, $\{\hat{g}_i(k)
    : \hat{g}_i(k) \neq g_i(k)\}$, and $\{\hat{\tau}_{ij}(k) : \hat{\tau}_{ij}(k)
    = \tau_{ij}(k)\}$ for all $j \in \mathcal{D}_E$ such that $S(\{\hat{h}_i(1), \hat{g}_i(k),
    \hat{\tau}_{ji}(k)\}_{i,j \in \mathcal{V}} = S(\{h_i(1), g_i(k), \tau_{ji}(k)\}_{i,j
    \in \mathcal{V}})$ for all $k \ge 1$, then the subgradients $g_i(k)$, $i \in \mathcal{D}_H$,
    are protected.


    According to Definition 7.1, if malicious nodes obtain the same observations from
    both the actual subgradients $\{g_i(k)\}$ and fake subgradients $\{\hat{g}_i(k)\}$,
    they cannot distinguish between $g_i(k)$ and $\hat{g}_i(k)$ for any $i \in \mathcal{D}_H$.
    Thus the privacy of normal nodes is safeguarded.


    # ### 7.5.2 Main results


    The following theorem demonstrates the privacy-protection capability of Algorithm
    1.


    **Theorem 7.2.** Suppose Assumption 7.3 holds. Algorithm 1 can protect the private
    local subgradients $g_i(k)$ for all $i \in \mathcal{D}_H$.'
