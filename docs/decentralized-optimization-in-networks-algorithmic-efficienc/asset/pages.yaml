  md: '# ### 4.2.3 Event-triggering mechanism


    In this subsection, we present a unique event-based triggering strategy for communication,
    where the agent transmits its estimators to adjacent nodes only when the specified
    triggering criteria are met.


    To enhance the design of the event-triggering mechanism, we initially establish
    \(t_k^i\) to signify the kth triggering instant for agent i. The estimators of
    agent i at the specific triggering moment are denoted as \(x_{t_k^i}^i\) and \(y_{t_k^i}^i\),
    respectively. Moreover, the starting states for these estimators are set as \(x_{t_0^i}^i
    = x_0^i\) and \(y_{t_0^i}^i = y_0^i\) across all agents. Subsequently, we introduce
    the event-triggering mechanism as follows:


    ```

    \( t_{k+1}^i = \inf\{t|t > t_k^i, \|e_t^{i,x}\|^2 + \|e_t^{i,y}\|^2 > \frac{C}{(t
    + 1)^2}\}, \quad (4.3) \)

    ```


    where the threshold is represented by \(C/(t + 1)^2\), where \(C > 0\) serves
    as a parameter. To quantify the errors, \(e_t^{i,x}\) and \(e_t^{i,y}\) are utilized,
    and their definitions are provided below:


    ```

    \( e_t^{i,x} = x_{t_k^i}^i - x_t^i, \quad e_t^{i,y} = y_{t_k^i}^i - y_t^i. \quad
    (4.4) \)

    ```


    > **Remark 4.2.** The introduction of the event-triggering mechanism offers an
    innovative approach to data exchange within multi-agent networks. It is important
    to mention that agent i initially assesses its estimators prior to and following
    an iteration. When the disparity attains the threshold stipulated by the event-triggering
    criteria, agent i proceeds to disseminate its present estimators \(x_{t+1}^i\)
    and \(y_{t+1}^i\) to adjacent agents. Subsequently, the neighboring agents update
    the estimators of agent i retained in their local storage with the most recent
    ones. As a result, methodologies incorporating the event-triggering mechanism
    circumvent the need for continuous data transmission, in contrast to time-triggered
    methods [15–17,26].


    # ### 4.2.4 Algorithm construction


    In this subsection, we introduce a unique, event-triggered decentralized stochastic
    gradient tracking algorithm that incorporates the event-triggering strategy into
    the decentralized stochastic gradient tracking method. We refer to this integrated
    method as ET-DSGT. A comprehensive outline of ET-DSGT is presented in Algorithm
    1.


    For the local execution of the algorithm, we initially assume that each agent
    possesses a local storage capacity to retain the estimators received from neighboring
    agents. Furthermore, we presume that the agents’ initial estimators are set to
    \(x_0^i\) and \(y_0^i = \nabla g(x_0^i, \zeta_0^i)\). During the \((t + 1)\)th
    iteration, agent i employs its own estimators along with the stored estimators
    from its local memory to refresh \(x_{t+1}^i\) and \(y_{t+1}^i\) as outlined in
    step 2 and step 3. Note that agent i only shares its estimators with neighboring
    agents at its designated triggering time, denoted as \(t_k^i\). Specifically,
    if the event-triggering criterion specified in (4.3) is not met, agent i will
    refrain from'
