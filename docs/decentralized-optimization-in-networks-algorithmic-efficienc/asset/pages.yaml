- pgno: 171
  md: '# Differentially private decentralized zeroth-order algorithms for online optimization
    in dynamic networks


    # 6.1 Introduction


    In recent times, the realm of potential communication and sensing technologies
    within networked control systems has undergone swift advancements, inevitably
    presenting a myriad of optimization challenges across networks [1,2]. Traditional
    methodologies for tackling these issues often rely heavily on centralized intelligent
    systems for storage, communication, and computational processes, leading to high
    costs, diminished adaptability to novel environments, and heightened vulnerability
    to single-point failures [3]. By contrast, decentralized algorithms that mitigate
    the need for long-distance communication, offer several advantages over centralized
    algorithms, primarily due to their ability to partition extensive problems into
    manageable subsets. The decentralized algorithms boast enhanced robustness, reduced
    communication overhead, and improved privacy, thereby enabling their widespread
    adoption in diverse applications, including large-scale data analytics [4,5],
    information control systems [6,7], smart grid management [8,9], and online learning
    frameworks [10,11], among numerous others.


    # 6.1.1 Literature review


    Numerous real-world instances of decentralized optimization, nonetheless, are
    characterized by profound uncertainty [12], a prime example being the handling
    of online forecasting and estimation challenges within wireless networks. These
    challenges can be effectively addressed within the online optimization framework,
    where the functionalities associated with individual nodes are subject to temporal
    fluctuations, with such variations only discernible by the nodes in retrospect
    [13]. A diverse array of efficient methodologies exists for tackling online optimization
    problems, encompassing the seminal contributions centered on decentralized gradient
    descent algorithms [14,15], alongside their multifaceted extensions aimed at resolving
    constraints [16,17], adapting to intricate network topologies [10,13], enhancing
    efficiency [18,19], and safeguarding privacy [21], among others.'
