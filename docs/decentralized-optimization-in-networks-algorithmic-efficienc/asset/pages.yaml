    # ## 7.4 Convergence guarantees


    This section provides a theoretical analysis of the convergence behavior of Algorithm
    1. Initially, two preliminary results related to projection operation and the
    matrix \( P(k) \) are presented. Subsequently, two crucial lemmas are introduced
    by defining several auxiliary vectors, which significantly impact the main results.
    Finally, the convergence of Algorithm 1 is established based on these findings.


    # ### 7.4.1 Preliminary results


    We first present two useful preliminary results.


    **Lemma 7.1.** [17] For any \(\vartheta, \sigma \in \mathbb{R}^d\), the following
    holds:


    \(\left\|\Pi_\Omega^\vartheta(\vartheta, \gamma) - \Pi_\Omega^\sigma(\sigma, \gamma)\right\|
    \le \gamma \|\vartheta - \sigma\|.\)


    Define the state transition matrix \(\psi(k_1, k_2) = [\psi_{ij}(k_1, k_2)] \in
    \mathbb{R}^{d \times d}\), which satisfies:


    \(\psi(k_1, k_2) = \begin{cases} P(k_2 - 1)P(k_2 - 2) \cdots P(k_1), & k_2 > k_1,
    \\ I_n, & k_2 \le k_1. \end{cases}\)


    Based on [11, Corollary 2], we obtain the following result for \(\psi(k_1, k_2)\).


    **Lemma 7.2.** [11] Under Assumption 7.2, for any \(k_2 \ge k_1 > 0\), there exists
    a sequence of stochastic vectors \(\phi(k) = [\phi_1(k), ..., \phi_t(k)]^\mathrm{T}
    \in \mathbb{R}^t\) (\(i.e., \phi_i(k) \ge 0\), \(\sum i = 1^v \phi_i(k) = 1\))
    such that


    \(|\phi_i(k) - \psi_{ij}(s, k)| \le C \lambda^{k-s}, \forall i, j \in \mathcal{V},\)


