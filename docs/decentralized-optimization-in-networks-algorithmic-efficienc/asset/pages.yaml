    \(\mathbb{P}[\mathcal{B}(U) \in S] = \prod_{k=1}^K \mathbb{P}[\mathcal{B}(U_k)
    \in S].\)


    Hence, it can be concluded that


    \(\prod_{k=1}^K \mathbb{P}[\mathcal{B}(U_k) \in S] \le \prod_{k=1}^K \exp(\frac{\Delta_k}{b_k})
    \cdot [\mathcal{B}(U''_k) \in S],\)


    which according to \(\hat{\epsilon} = \sum_{k=1}^K (\Delta_k / b_k)\) shows that


    \(\mathbb{P}[\mathcal{B}(U) \in S] \le \exp(\hat{\epsilon}) \cdot \mathbb{P}[\mathcal{B}(U'')
    \in S].\)


    Based on Definition 5.2, Theorem 5.2 is derived.


    Drawing from Theorem 5.2, it becomes evident that both the parameter \(b_k\) and
    sensitivity \(\Delta_k\) play a role in determining the degree of differential
    privacy. Specifically, \(\Delta_k\) exhibits a direct correlation with privacy
    levels, whereas \(b_k\) demonstrates an inverse correlation with privacy at any
    given time \(k\). It is worth noting that adjusting the sensitivity \(\Delta_k\)
    poses challenges, primarily because it is solely influenced by the dimension \(m\)
    of the vectors \(z_{i,k}\) and \(y_{ii,k}\), as well as the Lipschitz parameter
    \(L\). Consequently, careful consideration must be given to selecting the parameter
    \(b_k\) to ensure the attainment of our desired \(\epsilon_k\)-differential privacy.
