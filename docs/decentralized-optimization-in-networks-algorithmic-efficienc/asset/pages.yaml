    # ## 7.3 Algorithm construction


    In this section, we start by revisiting some decentralized dual averaging algorithms
    from previous research [17, 27], and subsequently introduce our own algorithm.


    # ## 7.3.1 Overview of decentralized dual averaging techniques


    Our algorithm builds upon the dual averaging approach initially introduced by
    [17] for undirected networks. We define the projection operator as follows:


    \(\Pi_\Omega^\varphi(h, \gamma) = \arg\min_{x \in \Omega} \{ \langle h, x \rangle
    + \frac{\varphi(x)}{\gamma} \}, \quad (7.2)\)


    where $\gamma > 0$ and $\varphi(x)$ is assumed to be a 1-strongly convex function,
    satisfying $\varphi(0) = 0$ and $\varphi(x) > 0$. This function $\varphi(x)$ involves
    a norm $\|\cdot\|$ that primarily influences the computation of the projection
    operator $\Pi_\Omega^\varphi(h, \gamma)$ (refer to [17, 40, 44] for more details).
    The update procedure for the standard decentralized dual averaging algorithm [17]
    for each node $i \in \mathcal{V}$ is given by:


    \(\begin{cases} h_i(k+1) = \sum_{j=1}^v W_{ij} h_j(k) + g_i(k), \\ x_i(k+1) =
    \Pi_\Omega^\varphi(h_i(k+1), \gamma(k)), \end{cases}\)


    where $h_i(k)$ is a state variable, $x_i(k)$ is a primal variable, $g_i(k) \in
    \partial f_i(x_i(k))$, $\gamma(k) > 0$ is a decreasing step-size, and $W = [W_{ij}
    \in \mathbb{R}^{d \times d}$ is a doubly stochastic matrix, ensuring $\sum_{i=1}^v
    W_{ij} = \sum_{i=1}^v W_{ji} = 1$, for all $i, j \in \mathcal{V}$. It is important
    to note that this'
