    # 4.4.2 Energy-based source localization


    In this subsection, we present a simulation based on an energy-driven source localization
    challenge, as referenced in [45], conducted on a randomly linked network structured
    as follows:


    ```

    \(\min_{x \in \mathbb{R}^2} \frac{1}{N} \sum_{l=1}^N (\frac{1}{n^i} \sum_{h=1}^{n^i}
    (z^{i,h} - \frac{c}{||x - b^i||^\lambda})^2 ).\)

    ```


    Here, \(b^i \in \mathbb{R}^2\) (where \(i = 1, ..., N\)) represents sensor \(i\),
    which gathers \(n^i\) data points. The isotropic energy propagation model, represented
    by \(z^{i,h} = c/(||\hat{x} - b^i||^\lambda) + q^{i,h}\), is employed to gauge
    the intensity of the \(h\)th signal received by sensor \(i\). Here, \(c\) is a
    positive constant indicating signal strength, while \(\lambda\) signifies the
    attenuation characteristic. Additionally, the condition \(||\hat{x} - b^i|| >
    1\) holds, and \(q^{i,h}\) denotes an independent and homogeneously distributed
    sample noise.'
