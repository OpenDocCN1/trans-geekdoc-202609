  md: 'significant attention due to their flexible application in continuous-time
    physical systems and hardware implementations [12]. Various decentralized continuous-time
    optimization methods for EDP have been explored during this period [21,22].


    In addition to the above studies, blockchain-based decentralized algorithms [53,54]
    and peer-to-peer decentralized schemes [55,56] have been effectively applied to
    smart grids. Notably, Hassan et al. [53] examined blockchain integration in smart
    grids, highlighting fundamentals, challenges, and solutions. Tushar et al. [55]
    provided a comprehensive review of decentralized peer-to-peer energy trading innovations,
    contributing to future smart grid development. Concurrently, numerous related
    works employing traditional search algorithms [57,58] and computational intelligence
    algorithms (including metaheuristic algorithms [59,60] and decentralized reinforcement
    learning algorithms [64,65]) to tackle EDP have emerged. For example, Park et
    al. [57] introduced a new algorithm using a modified PSO mechanism to address
    EDP with nonsmooth cost functions. An adaptive robust hybrid optimization algorithm
    combining two metaheuristic approaches was developed in [60] for nonconvex EDP
    cost functions. Subsequently, Dai et al. [64] proposed a novel decentralized reinforcement
    learning algorithm for dynamic EDP with inaccessible cost functions.


    When applying decentralized methods to EDP in real smart grids, the communication
    network among generators is a critical aspect to consider. Information transmission
    is often asymmetric in practice, resulting in unbalanced and directed communication
    networks. Yang et al. [23] proposed a decentralized algorithm using column-stochastic
    matrices for EDP with communication delays, employing the push-sum average consensus
    to mitigate directed network imbalance. Li et al. [24] adopted the gradient rescaling
    technique and presented a decentralized algorithm based on row-stochastic matrices
    for EDP. Numerous studies have focused on decentralized algorithms for EDP achieving
    various objectives such as linear convergence [25,26] and accelerated convergence
    [27] using row- or column-stochastic matrices. Zhao et al. [28] introduced a decentralized
    algorithm utilizing both row- and column-stochastic matrices, addressing conservatism
    in related works [23,24] through eigenvector estimation.


    In previously mentioned decentralized algorithms [13–16,18–28], direct information
    transmission among generators in the communication network leads to severe privacy
    leakage issues [29], allowing external eavesdroppers to effectively attack the
    power grid. For instance, eavesdroppers can infer and reveal local cost function
    variables (power generation), designing optimal attack schemes to increase total
    costs and disrupt the grid [30]. Differential privacy approaches have been widely
    and successfully applied in optimization for privacy protection in decentralized
    optimization [31–33]. However, this method compromises solution optimality, balancing
    optimality and privacy levels [31–33]. Recently, several privacy-protected algorithms
    incorporating homomorphic encryption into decentralized optimization have been
    proposed [34,35]. Unfortunately, these decentralized homomorphic encryption algorithms
    require more information transmission time and are only suitable for undirected
    networks.'
