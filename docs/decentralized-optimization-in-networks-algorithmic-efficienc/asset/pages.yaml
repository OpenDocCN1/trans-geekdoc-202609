    & \hat{\alpha}\hat{g}\sqrt{n} & \beta\sigma & \hat{\alpha} & \hat{\alpha}|s|\beta
    \\ \hat{\alpha}\hat{g} & \lambda & \beta a_1 & \hat{\alpha}a_1 & \hat{\alpha}|s|\beta
    a_1 \\ a_3 + \hat{\alpha}\hat{g}\sqrt{n} & \hat{\alpha}\hat{g}\sqrt{n} & \beta
