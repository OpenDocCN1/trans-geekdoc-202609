    **Remark 5.5.** According to Theorem 5.1, it is evident that Algorithm 1 is capable
    of attaining the anticipated regret at a sublinear rate of $\mathcal{O}(\sqrt{K})$.
    This signifies that every node will progressively drive its expected regret towards
    zero as the time horizon $K$ increases, indicating that $\lim_{K\to\infty} \bar{R}_{j,K}/K$
    approaches 0. Furthermore, Theorem 5.1 also implies that the magnitude of $b_{\max}$
    has a direct impact on the precision of optimization achieved by Algorithm 1,
    assuming constant system parameters. Specifically, as $b_{\max}$ rises (indicating
    a lower privacy level $\epsilon_k$ at a set sensitivity, as will be elaborated
    in the subsequent subsection), the algorithm''s optimization accuracy diminishes,
    given unchanging system parameters.


    **Remark 5.6.** It appears that the zero-sum correlated perturbation approach
    mentioned in references [45,55] could potentially be integrated into Algorithm
    1, replacing the differential privacy method, to enhance the algorithm''s efficiency
    while maintaining privacy. Nevertheless, this integration is not straightforward.
    Algorithm 1 operates within a directed network and utilizes row-stochastic matrices,
    complicating the introduction of noises in a zero-sum correlated perturbation
    scheme, as these noises must inherently satisfy the network''s noise balance.
    Furthermore, the privacy-preserving analysis presented in [45,55] relies on stronger
    assumptions regarding network topology, rendering it less resilient compared to
    the differential privacy analysis detailed in the subsequent subsection.


    # ## 5.4.3 Differential privacy analysis


    In this subsection, our main objective is to demonstrate that Algorithm 1 can
    attain $\epsilon$-differential privacy. Imagine a scenario where certain hostile
    nodes are actively monitoring sensitive data exchanged among nodes and deliberately
    attempting to deduce their privacy. Differential privacy''s core aim is to conceal
    the delicate information of nodes, thus rendering hostile nodes unable to discern
    the authentic node data. Additionally, according to Definition 5.3, sensitivity
    gauges the amount of noise introduced by assessing the effect of a single node''s
    data within Algorithm 1''s dataset. Therefore to ensure $\epsilon$-differential
    privacy, we estimate the necessary noise level by limiting the sensitivity of
    our proposed algorithm.'
