  md: '# ## 8.3 Convergence guarantees


    In this section, we analyze Algorithm 1 theoretically.


    # ### 8.3.1 Auxiliary results


    This subsection presents some auxiliary results relevant to directed networks,
    step-sizes, and the supermartingale convergence result.


    **Lemma 8.1.** _[38] Let Assumption 8.2 hold and consider Algorithm 1. For any
    $t \ge 0$, there exist a normalized vector $c$ ($c^{\mathrm{T}}1_m = 1$), a constant
    $W > 0$, and a constant $0 < \lambda < 1$ satisfying:_


    +   a) $\lim_{t \to \infty} (B)^t = 1_m c^{\mathrm{T}}, |[z_i^t]_i - c_i| \le
    W (\lambda)^t, |[(B)^t]_{ji} - c_i| \le W (\lambda)^t, \forall i, j \in \mathcal{V};$


    +   b) there exists $\kappa > 1$ satisfying $\kappa^{-1} \le [z_i^t]_i \le 1,
    \forall i \in \mathcal{V}.$


    _Proof._ The detailed proof is available in [38], thus it is omitted here.


    Let the scalar $q$ satisfy $0 < q < 1/2$, and recall that $\gamma_i^t = 1 / \Gamma_i^t,
    \forall t \ge 1, i \in \mathcal{V}$. The conditions on the step-size $\gamma_i^t$
    are established in the lemma below.


    **Lemma 8.2.** _[43] For all $i \in \mathcal{V}$ and $t \ge \hat{t}$, where $\hat{t}
    = \hat{t}(q, m)$ is a sufficiently large positive integer, the step-size $\gamma_i^t$
    satisfies a.s._


    $$\gamma_i^t \le \frac{2}{t\hat{\eta}}, \quad (\gamma_i^t)^2 \le \frac{4m^2}{t^2\hat{\gamma}^2},
    \quad |\gamma_i^t - 1/(t \eta_i)| \le \frac{2}{t^{3/2-q}\hat{\eta}^2} = \phi^t.$$


    _Proof._ The detailed proof is available in [43], thus it is omitted here.


    Next, we present the well-known supermartingale convergence result [44] in the
    following lemma.


    **Lemma 8.3.** _[44] Suppose the sequence of $\mathcal{F}^t$-measurable non-negative
    random variables $\{v^t\}, \{u^t\}, \{a^t\},$ and $\{b^t\}$ satisfy that for all
    $t \ge 0$._


    $$\mathbb{E}[v^{t+1}|\mathcal{F}^t] \le (1+a^t)v^t - u^t + b^t, \text{a.s.},$$


    where $\mathcal{F}^t$ is the collection of $v^0, \dots, v^t, u^0, \dots, u^t,
    a^0, \dots, a^t,$ and $b^0, \dots, b^t$. Assuming $\sum_{t=0}^\infty a^t < \infty$
    and $\sum_{t=0}^\infty b^t < \infty$ a.s. hold, then, we have $\lim_{t \to \infty}
    v^t = v$ for a random variable $v \in \mathbb{R}_{\ge 0}$ a.s., and $\sum_{t=0}^\infty
    u^t < \infty$ a.s..


    _Proof._ The concrete proof can be found in [44], and therefore we omit it here.'
