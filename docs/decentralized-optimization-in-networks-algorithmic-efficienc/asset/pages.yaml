- pgno: 141
  md: '# Differentially private decentralized dual averaging algorithms for online
    optimization in directed networks


    # 5.1 Introduction


    In recent years, there has been a rapid advancement in networked control systems
    and potential communication/sensing technologies, sparking a surge of interest
    in diverse network optimization challenges, as referenced in [1,2]. Traditionally,
    optimization problems are tackled using centralized smart devices to handle storage,
    communication, and computation tasks. However, these methods can be costly, inflexible
    to new scenarios, and prone to single points of failure, as noted in [3]. The
    decentralized network approach offers a parallel computing framework designed
    to minimize the collective sum of local loss functions distributed across a network
    of nodes, eliminating the need for a central coordinator, as described in [4].
    This collaborative minimization method, relying on local communication and computation,
    significantly cuts down communication overhead on the parameter server. It finds
    widespread applications in areas such as wireless sensor networks [5,6], information
    control [7,8], large-scale data analysis [9,10], online learning [11,12], etc.


    # 5.1.1 Literature review


    Numerous real-world applications of decentralized optimization often encounter
    significant uncertainty, as referenced in [13]. One example is the consideration
    of online forecasting and estimation challenges in wireless networks, where sensor
    readings fluctuate due to interference and noise inherent in sensor networks.
    These issues can be addressed through an online optimization framework, where
    the functions linked to each node may evolve over time. This variation is only
    recognized by the nodes in retrospect, as mentioned in [14]. The decentralized
    aspect allows for the conversion of a large-scale problem into multiple smaller
    ones, while simultaneously maintaining inherent resilience against environmental
    uncertainties and communication failures. This makes decentralized online methods
    highly suitable for extensive networks.'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'Numerous methods exist, including prior works rooted in decentralized gradient
    descent, as cited in [15,16], along with their diverse extensions for handling
    constraints [17,18], applications in intricate networks [19,20], achieving efficiency
    [21,22], ensuring privacy [23,24]. These methods underscored the feasibility of
    approaching online optimization challenges through a decentralized network-based
    approach, as evidenced in [15–24].


    Although previous works on online optimization problems have garnered attention,
    decentralized dual averaging methods have also undergone comprehensive examination.
    Additionally, when addressing real-world online optimization challenges, the network
    facilitating communication among nodes emerges as a critical aspect deserving
    careful consideration. Typically, information transfer tends to be unidirectional,
    resulting in an asymmetry within the communication network, as referenced in [26,27].
    In light of this observation, various decentralized dual averaging techniques
    have emerged, grounded in several proven strategies, such as the push-sum method
    [28–30] and the surplus-based strategy [31]. In addition to these techniques aimed
    at addressing information transmission imbalances, the subgradient rescaling strategy,
    coupled with a consensus step for eigenvector estimation, proved beneficial [23,32].
    This strategy ensured the incorporation of row-stochastic weights into the algorithms,
    simplifying decentralized implementation. Nevertheless, this particular strategy
    remained unexplored in the context of decentralized dual averaging methods, constituting
    the focal point of this chapter.


    In recent times, due to the significant growth in data size, its widespread distribution,
    and rapid fluctuations, the ability to communicate and process data in real-time
    (or online) has become critically important to swiftly address user needs. However,
    given the inherent fragility of communication networks, there exists a risk that
    malevolent nodes could intercept information transmissions between nodes, leading
    to a high likelihood of information breaches [33,34]. Furthermore, handling vast
    quantities of data inherently poses a threat to user privacy. Consequently, it
    is imperative to prioritize the protection of sensitive node information within
    decentralized networks [35,36]. When it comes to preserving privacy in decentralized
    optimization contexts, data encryption emerges as a viable solution. It has been
    utilized to maintain the confidentiality of critical information in multiple applications
    [37–39]. Nevertheless, the associated expenses are understandably undesirable
    for networks with limited resources [35,36]. Differential privacy, as a compelling
    alternative, has garnered considerable attention owing to its rigorous mathematical
    foundation, proven security attributes, and ease of implementation, as detailed
    in [40–43]. The fundamental concept behind the differential privacy approach involves
    the introduction of noise, potentially elevating privacy levels albeit at the
    expense of compromising optimization precision. In this regard, research conducted
    in [44] investigated a differentially private decentralized online dual averaging
    algorithm by introducing Laplacian noise into the transmitted data. Subsequently,
    the study presented in [45] introduced a decentralized dual averaging algorithm
    that incorporates a correlated perturbation strategy to preserve node privacy.'
