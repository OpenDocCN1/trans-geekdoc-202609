    # 1.3.2 Decentralized asynchronous algorithm


    For any non-negative \( t \), we shall define three localized estimates pertaining
    to node \( i \) as \( x_i^t \in \mathbb{R} \), \( y_i^t \in \mathbb{R} \), and
    \( k_i^t \in \mathbb{R}^n \). These estimates originate from initial values of
    \( x_i^0 \in \mathbb{R} \), \( y_i^0 \in \mathbb{R} \), and \( k_i^0 \in \mathbb{R}^n
    \). Subsequently, the proposed decentralized asynchronous algorithm comprises
    the following sequential procedures.


    **Step 1 (Consensus on the dual variable):** Except for the node \( j^t \), no
    other nodes update for \( t \ge 1 \), i.e.,


