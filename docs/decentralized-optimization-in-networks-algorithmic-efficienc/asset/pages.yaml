  md: '# ### 3.1.2 Main contributions


    In [26], the authors presented a decentralized algorithm, GT-CDGD, boasting a
    linear convergence rate, tailored for addressing decentralized optimization problems
    constrained within a closed convex set. Aiming to achieve elevated computational
    efficiency when dealing with extensive datasets, we leverage the powerful computational
    efficiency of the variance-reduction method to devise an innovative algorithm,
    namely P-DVR. This advanced algorithm offers both a linear convergence rate and
    remarkable computational efficiency. Our specific contributions are outlined below:


    +   (i) A novel and innovative algorithm, termed as P-DVR, is introduced for addressing
    decentralized constrained optimization challenges involving closed convex set
    constraints. This P-DVR algorithm, which incorporates projected decentralized
    variance-reduction techniques, is specifically designed to tackle constrained
    optimization issues. Given a small enough constant step-size, the P-DVR demonstrates
    linear convergence towards the optimal solution, particularly when dealing with
    strongly convex and smooth local functions.


    +   (ii) Distinct from the method presented in [26], known as GT-CDGD, the P-DVR
    algorithm possesses superior computational efficiency due to its incorporation
    of a variance-reduction method. In contrast to the GT-CDGD method, which lacks
    this variance-reduction technique, the P-DVR algorithm can theoretically boost
    computational efficiency per iteration by a factor of _n_, where _n_ represents
    the number of data items stored in each node.


    +   (iii) Through numerical analysis, we validate the linear convergence of the
    P-DVR algorithm, exceptional computational efficiency, and overall efficacy by
    applying it to solve two distinct problems: a logistic regression-driven binary
    classification problem and an energy-based problem of acoustic source localization.


    # ### 3.1.3 Organization


    The structure of the subsequent sections is outlined below. In Section 3.2, we
    frame the problem under investigation and clarify its distinctions and connections
    with multi-objective optimization problems. Section 3.3 introduces the P-DVR algorithm.
    A thorough convergence analysis of the P-DVR algorithm is presented in Section
    3.4. Section 3.5 offers numerical simulations showcasing the application of the
    P-DVR algorithm, where it is used to address a logistic regression-based binary
    classification problem and an acoustic source localization problem. Ultimately,
    we summarize our findings in the concluding section.


    # ## 3.2 Problem formulation


    In this chapter, a decentralized optimization problem can be characterized as


    ```

    min _f_(_x_), s.t. \( x \in \Omega_0 \), (3.1)

    ```'
