    # 6.6 Conclusion


    In this chapter, we have crafted an efficient zeroth-order decentralized dual
    averaging methodology, termed ZO-DDA, tailored for optimizing privacy-sensitive
    online constrained optimization tasks across time-evolving directed networks.
    Instead of relying on precise subgradient computations, we harness a zeroth-order
    oracle. ZO-DDA employs specially crafted row-stochastic matrices to rescale the
    zeroth-order oracle with an auxiliary parameter, thereby mitigating the imbalance
    stemming from the dynamic directed network topology. Additionally, to uphold differential
    privacy, ZO-DDA incorporates perturbations infused with Laplace noise. Our theoretical
    investigations establish that ZO-DDA, under reasonable assumptions, attains a
    desired sublinear regret while safeguarding the differential privacy of each node’s
    loss function. We uncover the intricate balance between privacy preservation and
    optimization precision inherent in our algorithm. Through extensive simulations,
    we validate the efficacy of ZO-DDA. Looking ahead, we aim to enhance the communication
    and computational efficiency of our approach. Moreover, extending our findings
    to decentralized online optimization frameworks encompassing generalized (inequality
    or equality) constraints presents an intriguing direction for future research.


