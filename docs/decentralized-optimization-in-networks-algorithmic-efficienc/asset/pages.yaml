    # 5.3.1 A general dual averaging approach


    Initially, we introduce the conventional dual averaging method outlined in [25].
    Define the projection operator $\Pi_\Omega^h(v, \alpha)$ as follows:


    ```

    $$ \Pi_\Omega^h(v, \alpha) = \arg \min_{u \in \Omega} \left\{ \langle v, u \rangle
    + \frac{h(u)}{\alpha} \right\}, $$ (5.4)

    ```


    where $\alpha > 0$, $v$ belongs to $\mathcal{R}^m$, and assuming $h(u)$ is a proximal
    function exhibiting 1-strongly convex characteristics, satisfying the conditions
    $h(0) = 0$ and $h(u) > 0$ for all $u = u \in \Omega$ [25,29,49]. Then, the dual
    averaging method can be employed to resolve the problem stated in (5.1) over a
    shared constraint set denoted as $\Omega$ (as described in [25]). Specifically,
    for every $i$ belonging to the set $\mathcal{V}$, the algorithm proceeds as follows:


    ```

    $$

    z_{i, k+1} = z_{i, k} + g_{i, k},

    $$

    $$

    x_{i, k+1} = \Pi_\Omega^h(z_{i, k+1}, \alpha_k),

    $$ (5.5)

    ```


    where $g_{i, k}$ belongs to the subgradient of $f_i$ at $x_{i, k}$, while $\alpha_k$
