  md: "# 6.2.3 Differential privacy\n\nIndeed, within a decentralized network architecture,\
    \ not all nodes adhere to the norm, with some potentially exhibiting malicious\
    \ intentions. As these rogue nodes abide by the revised protocols, they actively\
    \ scrutinize the sensitive inter-node communications, deliberately attempting\
    \ to deduce the private information of other nodes. Even though each node is restricted\
    \ to acquiring only the functional value and exchanging localized estimates within\
    \ its immediate vicinity, as documented in [50], the threat of privacy breaches\
    \ persists, as evidenced by model inversion attacks [51]. Consequently, to safeguard\
    \ the local loss functions of participating nodes, the differential privacy framework\
    \ is embraced. Proceeding further, we will delve into pertinent definitions of\
    \ differential privacy, as outlined in [43].\n\n**Definition 6.1** (Adjacency).\
    \ Consider two distinct data collections, denoted as $U = \\{u_1, ..., u_n\\}$\
    \ and $\\hat{U} = \\{\\hat{u}_1, ..., \\hat{u}_n\\}$. The datasets $U$ and $\\\
    hat{U}$ are deemed adjacent if there exists a specific index $i_0$ within the\
    \ set $\\mathcal{V}$ such that the corresponding elements differ, _i.e.,_ $u_{i_0}\
    \ \\neq \\hat{u}_{i_0}$, while all other elements indexed by $j$ in the subset\
    \ $\\mathcal{V}_0 = \\{j | j \\in \\mathcal{V}, j \\neq i_0\\}$ remain identical,\
    \ meaning $u_j = \\hat{u}_j$ for all $j \\in \\mathcal{V}_0$.\n\nStated differently,\
    \ the datasets $U$ and $\\hat{U}$ are considered adjacent if there exists a single\
    \ discrepancy among their respective elements. Based on Definition 6.1, we now\
    \ proceed to articulate the concept of differential privacy.\n\n**Definition 6.2**\
    \ (Differential Privacy). For any two neighboring datasets $U$ and $\\hat{U}$,\
    \ provided that\n\n$\\mathbb{P}[\\mathcal{B}(U) \\in S] \\leq \\exp(\\epsilon)\
    \ \\cdot \\mathbb{P}[\\mathcal{B}(\\hat{U}) \\in S],$ (6.4)\n\nthen the algorithm\
    \ $\\mathcal{B}$ is endowed with $\\epsilon$-differential privacy, where $\\epsilon\
    \ > 0$ represents the degree of privacy protection. Here, $S$ denotes an arbitrary\
    \ subset of the output space $\\text{Range}(\\mathcal{B})$, which comprises the\
    \ entire collection of potential results yielded by the algorithm $\\mathcal{B}$.\
    \ \n\nUtilizing the inequality (6.4), it becomes evident that any minimal alterations\
    \ to the private dataset will have negligible impact on the outcome of the randomized\
    \ algorithm $\\mathcal{B}$. Furthermore, a decreased value of $\\epsilon$ signifies\
    \ a heightened degree of privacy safeguarding for the nodes. Consequently, to\
    \ achieve the utmost privacy protection, $\\epsilon$ should be minimized through\
    \ the introduction of noise with substantial variance, albeit potentially compromising\
    \ the algorithm’s precision. Let us designate $\\text{Adj}(U_t, \\hat{U}_t)$ as\
    \ the adjacency relation between the neighboring datasets $U_t$ and $\\hat{U}_t$\
    \ at time $t$. Based on this, we proceed to define the concept of sensitivity\
    \ as follows.\n\n**Definition 6.3** (Sensitivity). The level of responsiveness\
    \ or susceptibility of the randomized algorithm $\\mathcal{B}$ at the specific\
    \ instant $t$ can be articulated as\n\n$\\Delta_t = \\sup_{U_t, U'_t: \\text{Adj}(U_t,\
    \ \\hat{U}_t)} ||\\mathcal{B}(U_t) - \\mathcal{B}(\\hat{U}_t)||_1.$"
