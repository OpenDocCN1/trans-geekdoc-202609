  md: '**Definition 3.1.** Given the closed convex set $\Omega_0 \subseteq \mathbb{R}^p$,
    we designate $P_{\Omega_0}(x) = \arg\min_{s \in \Omega_0} \|x - s\|$ as the projection
    operator, where both $x$ and $s$ belong to the space $\mathbb{R}^p$.


    Based on Definition 3.1, it is evident that for any pair of vectors, namely $\mu$
    and $v$, the subsequent inequality consistently holds true:


    $$\|P_{\Omega_0}(\mu) - P_{\Omega_0}(v)\| \leq \|\mu - v\|, \qquad \text{(3.4)}$$


    and the optimal solution, denoted as $x^*$, is ensured to fulfill the subsequent
    correlation:


    $$s^* = P_{\Omega_0}(s^* - \eta_0 \nabla f(s^*)), \qquad \text{(3.5)}$$


    where $s^*$ represents the result of projecting the optimal solution $x^*$ of
    problem (3.1), while $\eta_0$ denotes a fixed positive step-size. From this, we
    can deduce that $s^* = x^*$.


    # ## 3.2.1 The difference and relation with multi-objective optimization


    Here, it is important to note the distinction and correlation between problem
    (3.1) and multi-objective optimization problems.


    **(i) Difference:** Presented as a mono-objective optimization problem, the decentralized
    optimization problem in (3.1) aims to minimize the global function outlined in
    the same equation, and it possesses a solitary optimal solution based on Assumption
    3.1 (illustrated on the left side of Fig. 3.1). In contrast to the problem stated
    in (3.1), multi-objective optimization problems strive to simultaneously minimize
    numerous objective functions expressed as $f(x) = (f^1(x), f^2(x), \dots, f^m(x))^\mathrm{T}
    (\mathbb{R}^p \to \mathbb{R}^m)$ [44–46]. These problems yield a collection of
    solutions known as Pareto optimal solutions (displayed in the center of Fig. 3.1).
    Additionally, multi-objective optimization problems emphasize the Pareto frontier
    (depicted on the right side of Fig. 3.1), a concept not addressed in this work.


    **(ii) Relation:** As discussed in numerous studies [43–46], a multi-objective
    optimization problem can be transformed into a mono-objective optimization problem,
    similar to the one addressed in this work, namely problem (3.1). For instance,
    the goal programming method [47] and the weighted sum technique [48] have been
    introduced to facilitate this conversion. Furthermore, from the viewpoint of objective
    and local functions, distinct objective functions can be assigned to different
    nodes, serving as local functions. Subsequently, the decision-maker''s preferences
    can be expressed through the topological connections between these nodes [43,49].
    By adopting this methodology, we can utilize a row-stochastic matrix (representing
    an undirected network) in lieu of a doubly stochastic matrix, enabling us to solve
    multi-objective optimization problems effectively.


    In conclusion, it bears mentioning that the primary objective of this undertaking
    is to effectively tackle the (mono-objective) decentralized optimization problem
    denoted by (3.1), which holds significant relevance in numerous engineering scenarios.
    However, it is important to clarify that the focus of this endeavor does not encompass
    multi-objective optimization problems. We intend to address multi-objective optimization
    problems via a decentralized optimization algorithm in our forthcoming projects.'
