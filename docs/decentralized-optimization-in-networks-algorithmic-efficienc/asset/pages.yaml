    # 4.5 Conclusion


    In this chapter, we have devised a new event-triggered decentralized stochastic
    gradient tracking approach, coined as ET-DSGT, by advancing the real-time decentralized
    stochastic gradient tracking technique. Agents only disseminate estimators to
    adjacent nodes during their designated trigger moments, indicating that ET-DSGT
    circumvents continuous communication, thereby enhancing communication effectiveness.
    We have demonstrated that, with a diminishing step-size, ET-DSGT can converge
    to the precise global minimum at a sublinear pace, subject to specific presumptions
    about the network and cost function. Furthermore, it has been established that,
    under certain circumstances, the duration between two triggering events exceeds
    the iteration gap. Consequently, the communication overhead of ET-DSGT is significantly
    lower compared to corresponding time-triggered methods. Simulation outcomes have
    confirmed the impressive capabilities of ET-DSGT. Our future efforts will be directed
    towards adapting the algorithm for constrained optimization challenges and directed
    networks.


