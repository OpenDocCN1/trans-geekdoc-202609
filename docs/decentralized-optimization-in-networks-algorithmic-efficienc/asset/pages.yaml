  md: '# Variance-reduced decentralized projection algorithms for constrained optimization
    in networks


    # ### 3.1 Introduction


    The exploration of decentralized optimization techniques aimed at resolving extensive,
    constrained optimization problems has garnered growing interest, driven by heightened
    demand in various fields, including resource allocation [1], acoustic source localization
    [2], economic dispatch problems [3,4], signal processing [5–8], and machine learning
    [9,10]. The advent of massive datasets poses significant challenges to the computational
    power and storage capabilities of current computing systems. In light of these
    challenges, it is imperative to devise a decentralized algorithm that exhibits
    elevated computational efficiency, rapid convergence, and precise solutions. The
    utilization of projection operators to manage constraints within closed convex
    sets [11–16] and variance-reduction methods to ensure accurate results [17–22]
    are invaluable tools in crafting the desired algorithmic solution.


    # #### 3.1.1 Literature review


    Decentralized constrained optimization problems have garnered significant attention
    in both practical applications and scientific inquiries. The scholars referenced
    in [3] introduced a decentralized method for power management, tailored to address
    the constraints inherent in the Economic Dispatch Problem (EDP). Similarly, Maros
    and Jaldén [4] presented a linear adaptation of the PANDA algorithm, specifically
    designed to tackle the constrained EDP. Furthermore, the study documented in [23]
    offered an algorithm that preserves privacy while resolving the constraints associated
    with the acoustic source localization problem. Moreover, several other investigations
    [11–16,24,25] delved into constrained issues and devised corresponding algorithms.
    To elaborate, the researchers of [11] contemplated problems characterized by decentralized
    objective functions and constraints, while those of [12] established a straightforward
    decentralized continuous-time control law incorporating a constraint. The work
    in [13] incorporated the projection operator to manage constraints, and the work
    in [14] examined the subgradient projection algorithm within a constrained framework.
    The authors of [15] considered a standard convex constraint set in a'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'decentralized continuous-time optimization context, and Yan et al. [16] addressed
    bound constraints in nonconvex optimization scenarios through a single-layer projection,
    among other methods. Although previous algorithms tackled constrained problems
    using the projection operator, they exhibit limitations in computational efficiency,
    convergence speed, and precise convergence. In a separate study [26], the decentralized
    constrained optimization problem was explored. When employing a small constant
    step-size, the algorithm achieved linear convergence to the precise optimal solution,
    thanks to the gradient tracking method. However, it still suffered from relatively
    low computational efficiency due to the necessity of computing local batch gradients.


    Significant advancements have been made in the realm of decentralized optimization,
    with notable results such as DGD [27] and its numerous refined algorithms that
    address constraints [28,29]. These methods have been effectively applied to intricate
    networks [3,30] and have undergone acceleration [31,32], thereby illustrating
    the proficiency of decentralized strategies in addressing large-scale problems.
    However, compared to centralized algorithms, these decentralized methods still
    face a trade-off between convergence speed and achieving precise convergence.
    In recent years, numerous techniques rooted in gradient tracking have emerged
    to address the precision quandary and sluggish convergence associated with decentralized
    algorithms [33–42]. Specifically, the authors of [33] deliberated on power system
    problems within undirected networks, while Qu and Li [35] introduced a novel gradient
    estimation method. The works in [34,36] contemplated time-varying and directed
    graphs, the authors of [37] explored uncoordinated step-sizes for localized optimization,
    and Shi et al. [38] examined a synchronous gradient-based algorithm. However,
    these methods exhibit reduced computational efficiency per iteration due to the
    necessity of computing local batch gradients. To enhance computational efficiency,
    decentralized gradient algorithms incorporating the variance-reduction technique
    have surfaced, including GT-SAGA and GT-SVRG [19], [20], etc. Broadly speaking,
    the variance-reduction technique mitigates errors stemming from the stochastic
    gradient algorithm, whereas gradient tracking addresses discrepancies arising
    from inadequate consensus among nodes. Notably, the variance-reduction technique
    also elevates computational efficiency.


    Based on the information mentioned earlier, it is evident that the computational
    efficiency of [26] is somewhat limited due to the requirement of calculating local
    batch gradients. Additionally, it is well-known that the variance-reduction method
    can significantly enhance computational efficiency. With the aim of achieving
    greater computational efficiency, our intention is to integrate the variance-reduction
    technique into [26], thereby presenting an algorithm that boasts superior computational
    efficiency and precise linear convergence.


    Recently, multi-objective optimization problems have captured the interest of
    scholars concentrating on the creation of decentralized optimization algorithms.
    The authors of [43] introduced a decentralized optimization algorithm grounded
    in switching topology to address such multi-objective problems. However, it is
    worth mentioning that this study emphasizes decentralized optimization issues,
    not the multi-objective ones.'
