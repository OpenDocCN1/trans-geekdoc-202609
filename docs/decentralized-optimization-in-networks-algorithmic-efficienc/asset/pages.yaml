  md: 'In practical scenarios, communication networks among nodes are often unidirectional,
    leading to unbalanced and directed communication networks [23,24]. Consequently,
    several decentralized dual averaging approaches have been proposed using effective
    strategies like surplus-based [25] and push-sum [26–28] algorithms. For example,
    [25] proposed a decentralized surplus-plus-based dual averaging algorithm for
    robust constrained optimization over directed networks, and [26] introduced a
    push-sum decentralized dual averaging algorithm with similar convergence properties.
    However, when networks vary over time, the convergence analysis of these algorithms
    may not hold. To address this, [4,5] proposed effective algorithms for different
    practical optimization problems over time-varying directed networks. Furthermore,
    [27] presented a decentralized dual averaging push algorithm suitable for time-varying
    directed networks, and [28] developed a similar algorithm for online constrained
    optimization over such networks.


    In many real-world applications, not all nodes are normal, and communication often
    occurs in imperfect environments [29,30]. Decentralized approaches require nodes
    to share their state information with neighbors, which poses risks if normal nodes
    contain sensitive information [31]. Malicious nodes can capture transmitted information
    and infer private data, leading to privacy leaks [31]. With the rise in privacy
    leakage incidents, there is an urgent need to protect the privacy of nodes in
    decentralized networks [32–37]. Existing privacy-protected decentralized approaches
    fall into two categories: encryption-based [32,33] and non-encryption-based [30,34–37,41,42].
    While encryption effectively protects privacy, it is computationally complex and
    costly in communication, making it unsuitable for resource-limited networks. Differential
    privacy, a non-encryption scheme, has gained attention for its strong mathematical
    foundation, provable security, and ease of implementation [34–37,41,42]. However,
    differential privacy may reduce optimization accuracy. To achieve accurate convergence
    while protecting privacy, some researchers have devised correlated perturbation
    schemes [30,38–40]. For instance, [39] introduced zero-sum correlation perturbations
    in DGD to protect privacy, and [40] developed a privacy-protected decentralized
    dual averaging algorithm for time-varying undirected networks using edge-based
    correlated perturbations. However, these networks were undirected.


    Given the above context, it is evident that there are few privacy-protected decentralized
    algorithms dedicated to handling general constrained optimization problems over
    time-varying directed networks accurately. Therefore the main motivation of this
    study is to develop a privacy-protected decentralized dual averaging algorithm
    with edge-based correlated perturbations for time-varying directed networks, ensuring
    accurate convergence while effectively protecting the privacy of normal nodes.


    # 7.1.2 Main contributions


    This chapter aims to solve a privacy-sensitive decentralized constrained optimization
    problem over time-varying directed networks by proposing an effective privacy-protected
    decentralized algorithm, suitable for practical applications and adaptable to
    various conditions. Compared to existing works, our contributions are summarized
    as follows:'
