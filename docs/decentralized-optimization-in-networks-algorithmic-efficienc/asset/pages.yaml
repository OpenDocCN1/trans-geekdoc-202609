  md: 'To enhance the efficiency of processing the Economic Dispatch Problem (EDP),
    novel algorithms with fixed step-sizes have been formulated [17–20]. Doan and
    Olshevsky [17] proposed a fully decentralized method that demonstrated linear
    convergence towards the optimal economic dispatch, provided a constant step-size
    was selected within a predefined maximum limit. Subsequently, Zhang et al. [18]
    presented a decentralized Lagrangian algorithm employing a fixed step-size. Unlike
    the approach in [17], the upper bound in [18] is solely dependent on the cost
    functions and the network topology of the generators, rather than the total number
    of generators. As research on EDP progresses, relevant studies are broadening
    to cover areas such as electric vehicles [21,22], privacy safeguarding [23,24],
    communication latency [25,26], transmission losses [27], wind power generation
    [28,29], and numerous other facets. Notably, the heavy-ball method and the Nesterov
    momentum term are widely adopted gradient-based acceleration strategies [30–33].
    To tackle the Economic Dispatch Problem (EDP), researchers have opted to integrate
    solutions within smart grids. Wu et al. [34] introduced the FDLFDM algorithm,
    which leveraged the Nesterov momentum term to expedite convergence towards the
    optimal economic allocation. Notably, all the referenced studies [30–34] solely
    employed a single momentum term. However, Lü et al. [35] introduced the innovative
    D-DLM algorithm, which incorporated two distinct momentum terms. In contrast to
    algorithms lacking momentum terms, D-DLM empowered generators to garner more information
    from neighboring entities, resulting in enhanced convergence results.


    Nowadays, numerous studies have employed time-triggered approaches to address
    practical challenges [36–38]. Nevertheless, practical implementation reveals that
    implementing a time-triggered scheme amplifies the communication load and computational
    demands. It is crucial to note that generators’ communication resources are significantly
    depleted during actual interactions, thus this mechanism might not be ideal for
    addressing the Economic Dispatch Problem (EDP). To address this, various decentralized
    event-triggered methods have emerged in recent literature [39–43], aiming to restrict
    communication between generators to specific sampling instances, thereby minimizing
    losses and cost savings. Dong et al. [39], for instance, introduced an event-triggered
    algorithm with dynamic constant step-sizes, effectively conserving communication
    resources and alleviating network strain. Subsequently, Ji et al. [40] proposed
    a distinct event-triggered strategy, integrating it into the decentralized gradient
    tracking algorithm to achieve similar benefits. Li et al. [41], on the other hand,
    presented a novel method leveraging asynchronous communication from a multi-energy
    system perspective. The Zeno-like behavior, which was not addressed in [39,40],
    was subsequently disregarded in [2,3,41,42]. However, these studies overlooked
    the momentum terms associated with accelerated convergence. Zhang et al. [43]
    addressed this gap by introducing an algorithm called ET-DAPDA, which incorporated
    two momentum term variants. This algorithm not only reduced the number of interactions
    but also achieved an accelerated linear convergence rate. Given the limitations
    of the acceleration strategy in [43] in integrating with existing decentralized
    momentum acceleration algorithms, there is an urgent need for a more adaptable'
