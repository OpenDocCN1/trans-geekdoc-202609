    \tau_{ji}(k))_{i,j \in \mathcal{V}, k \ge 1}\} \quad \text{and}$$

    $$

    \{ \hat{\tilde{h}}_{ji}(k) \}_{j \in \mathcal{D}_E, k \ge 1} = S(\{(\hat{h}_i(1),
    \hat{g}_i(k), \hat{\tau}_{ji}(k))_{i,j \in \mathcal{V}, k \ge 1}\})$$

    that are generated by Algorithm 1, where the fake subgradients $\hat{g}_i(k)$
    are not equal to $g_i(k)$, $i \in \mathcal{D}_H$.


    When $k=1$, obviously, $\hat{\tilde{h}}_{ji}(1) = \tilde{h}_{ji}(1)$, $j \in \mathcal{D}_E$
