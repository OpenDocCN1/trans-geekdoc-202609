    \ factors such as scalability, security and energy consumption.\n\n#### Impact\
    \ of Decentralization and Consensus\n\nThe combination of decentralization and\
    \ consensus has transformed sectors such as finance, healthcare, supply chain\
    \ and governance. In financial systems, for example, these technologies eliminate\
    \ intermediaries and enable low-cost, almost instantaneous transfers of value.\n\
    \nIn healthcare, decentralized blockchain facilitates the secure sharing of medical\
    \ records between different providers, ensuring data privacy and integrity. In\
    \ governance, algorithms such as DPoS have been used to create participatory models,\
    \ where citizens can vote directly on decisions of public interest.\n\nDecentralization\
    \ and consensus algorithms are fundamental pillars of blockchain, enabling its\
    \ broad application and ensuring security, transparency and trust. As technology\
    \ evolves, new approaches and improvements continue to emerge, further expanding\
    \ its possibilities.\n\nCHAPTER 4. SMART CONTRACTS\n\n### \n\n* * *\n\nSmart contracts\
    \ are one of the most revolutionary elements of blockchain technology. They expand\
    \ the use of blockchain beyond a transaction recording tool, enabling the automated\
    \ execution of agreements based on predefined conditions. These contracts work\
    \ as code scripts that are deployed and executed on blockchain networks, eliminating\
    \ intermediaries, reducing costs and increasing efficiency in various applications.\n\
    \n#### What Are Smart Contracts\n\nA smart contract is a program that operates\
    \ on a blockchain network, executing automatically when specific conditions are\
    \ met. Its essence lies in combining programming logic with blockchain principles\
    \ of immutability and decentralization. This automation ensures that agreed terms\
    \ are met without the need for human intervention.\n\nSmart contracts are made\
    \ up of three main elements:\n\n1.  Entries: Data or actions that trigger the\
    \ contract.\n\n2.  Logic: Set of programmed rules that determine how the contract\
    \ should react to inputs.\n\n3.  Outputs: Actions performed by the contract, such\
    \ as token transfers or execution of functions.\n\nUsing smart contracts eliminates\
    \ the risk of manual errors, increases transparency and reduces the likelihood\
    \ of disputes as all conditions and results are recorded on the blockchain.\n\n\
    #### How Smart Contracts Work\n\nSmart contracts are written in specific blockchain\
    \ languages, such as Solidity for Ethereum, and deployed to the network as part\
    \ of a block. Each contract has a unique address, allowing participants to interact\
    \ with it by sending data or tokens.\n\nWhen a smart contract is activated, it\
    \ automatically checks whether predefined conditions have been met. If so, it\
    \ performs the programmed actions such as transferring funds, recording data or\
    \ updating information on the blockchain.\n\nExecution is transparent and verifiable\
    \ by all network participants, ensuring trust and eliminating the need for intermediaries.\n\
    \nsolidity\n\npragma solidity ^0.8.0;\n\ncontract SimpleContract {\n\naddress\
    \ public owner;\n\nuint public balance;\n\nconstructor() {\n\nowner = msg.sender;\n\
    \n}\n\nfunction deposit() public payable {\n\nbalance += msg.value;\n\n}\n\nfunction\
    \ withdraw(uint amount) public {\n\nrequire(msg.sender == owner, \"Only owner\
    \ can withdraw\");\n\nrequire(amount <= balance, \"Insufficient balance\");\n\n\
    payable(owner).transfer(amount);\n\nbalance -= amount;\n\n}\n\n}\n\nIn this smart\
    \ contract, the owner can deposit and withdraw funds. The use of checks, such\
    \ as require, guarantees that only the authorized owner can make withdrawals,\
    \ protecting funds against unauthorized access.\n\n#### Examples of Use in Public\
    \ Blockchains\n\nSmart contracts have broad applications in public blockchain\
    \ networks, ranging from decentralized finance to gaming and digital identity.\n\
    \n##### Decentralized Finance (DeFi)\n\nDeFi is one of the areas where smart contracts\
    \ play a central role. They enable the creation of platforms that offer lending,\
    \ staking, trading and other financial services without traditional intermediaries.\n\
    \nFor example, a smart contract can be used to offer a secured loan. The borrower\
    \ provides cryptocurrency collateral, and the smart contract automatically verifies\
    \ the value and grants the loan. If the collateral falls below a set threshold,\
    \ the contract automatically liquidates the collateral to protect the creditor.\n\
    \nsolidity\n\npragma solidity ^0.8.0;\n\ncontract LoanContract {\n\naddress public\
    \ borrower;\n\naddress public lender;\n\nuint public loanAmount;\n\nuint public\
    \ collateralAmount;\n\nbool public loanRepaid;\n\nconstructor(address \\_lender,\
    \ uint \\_loanAmount) payable {\n\nrequire(msg.value > \\_loanAmount, \"Insufficient\
    \ collateral\");\n\nborrower = msg.sender;\n\nlender = \\_lender;\n\nloanAmount\
    \ = \\_loanAmount;\n\ncollateralAmount = msg.value;\n\nloanRepaid = false;\n\n\
    }\n\nfunction repayLoan() public payable {\n\nrequire(msg.sender == borrower,\
    \ \"Only borrower can repay\");\n\nrequire(msg.value == loanAmount, \"Incorrect\
    \ repayment amount\");\n\nloanRepaid = true;\n\npayable(lender).transfer(loanAmount);\n\
    \npayable(borrower).transfer(collateralAmount);\n\n}\n\nfunction liquidateCollateral()\
    \ public {\n\nrequire(!loanRepaid, \"Loan already repaid\");\n\nrequire(msg.sender\
    \ == lender, \"Only lender can liquidate\");\n\npayable(lender).transfer(collateralAmount);\n\
    \n}\n\n}\n\nThis smart contract implements a basic collateralized lending system.\
    \ It ensures that both parties are protected by automating the liquidation of\
    \ collateral if the loan is not repaid.\n\n##### Blockchain-Based Games\n\nSmart\
    \ contracts have revolutionized the gaming industry by introducing transparency\
    \ and digital ownership. In blockchain-based games, digital assets such as items\
    \ and characters are represented as non-fungible tokens (NFTs). These NFTs are\
    \ managed by smart contracts that guarantee authenticity and ownership.\n\nIn\
    \ a game, a smart contract can be used to manage the transfer of items between\
    \ players. When a player purchases an item, the contract updates ownership of\
    \ the associated token and records the transaction on the blockchain.\n\nsolidity\n\
    \npragma solidity ^0.8.0;\n\nimport \"@openzeppelin/contracts/token/ERC721/ERC721.sol\"\
    ;\n\ncontract GameItems is ERC721 {\n\nuint public nextTokenId;\n\naddress public\
    \ admin;\n\nconstructor() ERC721(\"GameItems\", \"GI\") {\n\nadmin = msg.sender;\n\
    \n}\n\nfunction mint(address to) external {\n\nrequire(msg.sender == admin, \"\
    Only admin can mint\");\n\n\\_safeMint(to, nextTokenId);\n\nnextTokenId++;\n\n\
    }\n\nfunction transfer(address to, uint tokenId) external {\n\nrequire(msg.sender\
    \ == ownerOf(tokenId), \"Not owner\");\n\n\\_transfer(msg.sender, to, tokenId);\n\
    \n}\n\n}\n\nThis smart contract implements a basic in-game item management system.\
    \ It uses the ERC-721 standard to create and transfer NFTs, allowing players to\
    \ securely own and trade their digital assets.\n\n##### Digital Identity\n\nSmart\
    \ contracts are also being used to create decentralized digital identity systems.\
    \ These systems allow individuals to manage their personal information and share\
    \ only the necessary data with third parties, without the need for a centralized\
    \ intermediary.\n\nA smart contract can store identity data such as name, age\
    \ and address. When an organization requests identity verification, the contract\
    \ verifies the necessary information and grants access only to what has been authorized\
    \ by the holder.\n\nsolidity\n\npragma solidity ^0.8.0;\n\ncontract IdentityContract\
    \ {\n\nstruct Identity {\n\nstring name;\n\nuint age;\n\nstring city;\n\nbool\
    \ isVerified;\n\n}\n\nmapping(address => Identity) public identities;\n\nfunction\
    \ createIdentity(string memory name, uint age, string memory city) public {\n\n\
    identities\\[msg.sender\\] = Identity(name, age, city, false);\n\n}\n\nfunction\
    \ verifyIdentity(address user) public {\n\nrequire(msg.sender != user, \"Cannot\
    \ verify yourself\");\n\nidentities\\[user\\].isVerified = true;\n\n}\n\nfunction\
    \ getIdentity(address user) public view returns (string memory, uint, string memory,\
    \ bool) {\n\nreturn (\n\nidentities\\[user\\].name,\n\nidentities\\[user\\].age,\n\
    \nidentities\\[user\\].city,"
