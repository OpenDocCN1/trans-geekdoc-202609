- raw: "Choosing the appropriate blockchain platform is a critical step in the development\
    \ of projects based on this technology. With several platforms available, each\
    \ with unique characteristics, it is essential to understand their functionalities,\
    \ advantages and use cases to make informed decisions. This chapter explores three\
    \ of the most popular and powerful platforms: Hyperledger, Corda and Polkadot,\
    \ highlighting their characteristics, differences and criteria for selecting the\
    \ best option for different types of projects.\n\n#### Hyperledger\n\nHyperledger\
    \ is an open source project led by the Linux Foundation, created to promote the\
    \ use of blockchain technologies in companies. Unlike public networks like Bitcoin\
    \ and Ethereum, Hyperledger is designed for permissioned networks, where participants\
    \ are identified and trusted.\n\nHyperledger offers several frameworks and tools,\
    \ the most Hyperledger Fabric one of the most popular.\n\n##### Features of Hyperledger\
    \ Fabric\n\n1.  Modular Architecture:  \n\n    Fabric uses a modular architecture,\
    \ allowing developers to choose specific components, such as consensus algorithms\
    \ and identity management, to meet the needs of their projects.\n\n2.  Permissioned\
    \ Network:  \n\n    Participants are authenticated and authorized, ensuring greater\
    \ security and privacy.\n\n3.  Smart Contracts (Chaincode):  \n\n    Smart contracts\
    \ in Fabric are called chaincodes and can be written in languages ​​such as Go,\
    \ Java or Node.js.\n\n4.  Private Channel:  \n\n    Fabric allows the creation\
    \ of private channels, where specific transactions are visible only to relevant\
    \ participants.\n\ngo\n\npackage main\n\nimport (\n\n\"github.com/hyperledger/fabric-contract-api-go/contractapi\"\
    \n\n)\n\ntype SmartContract struct {\n\ncontractapi.Contract\n\n}\n\nfunc (s \\\
    *SmartContract) CreateAsset(ctx contractapi.TransactionContextInterface, id string,\
    \ value string) error {\n\nreturn ctx.GetStub().PutState(id, \\[\\]byte(value))\n\
    \n}\n\nfunc (s \\*SmartContract) ReadAsset(ctx contractapi.TransactionContextInterface,\
    \ id string) (string, error) {\n\nvalue, err := ctx.GetStub().GetState(id)\n\n\
    if err != nil {\n\nreturn \"\", err\n\n}\n\nreturn string(value), nil\n\n}\n\n\
    The chaincode above demonstrates how to create and read assets on a Hyperledger\
    \ Fabric network.\n\n##### Use Cases\n\n1.  Supply Chain: Tracking goods with\
    \ transparency and efficiency.\n\n2.  Financial Sector: Private networks for payment\
    \ settlement and financing.\n\n3.  Health: Secure sharing of medical records between\
    \ institutions.\n\n#### String\n\nCorda is a blockchain platform designed for\
    \ enterprises, developed by R3. Its focus is on privacy and supporting transactions\
    \ between known parties, and is widely used in the financial sector.\n\n#####\
    \ Corda Features\n\n1.  Private Architecture:  \n\n    Transactions on Corda are\
    \ visible only to the parties involved, ensuring high privacy.\n\n2.  Smart Contracts\
    \ in Kotlin/Java:  \n\n    Smart contracts are written in Kotlin or Java, making\
    \ it accessible to enterprise system developers.\n\n3.  Notaries:  \n\n    At\
    \ Corda, notaries are responsible for validating transactions and ensuring chronological\
    \ order.\n\n4.  Interoperability:  \n\n    Supports integration with existing\
    \ systems and allows interaction between different networks.\n\nkotlin\n\npackage\
    \ com.example.contract\n\nimport net.corda.core.contracts.\\*\n\nimport net.corda.core.transactions.LedgerTransaction\n\
    \n@BelongsToContract(SimpleContract::class)\n\ndata class SimpleState(val value:\
    \ String, override val participants: List<AbstractParty>) : ContractState\n\n\
    class SimpleContract : Contract {\n\noverride fun verify(tx: LedgerTransaction)\
    \ {\n\nrequire(tx.inputs.isEmpty()) { \"No inputs allowed\" }\n\nrequire(tx.outputs.size\
    \ == 1) { \"Only one output allowed\" }\n\n}\n\n}\n\nContract in Kotlin shows\
    \ how to implement a simple transaction in Corda.\n\n##### Use Cases\n\n1.  Banking\
    \ Sector: Transaction settlement and loan management.\n\n2.  Properties: Digitization\
    \ of property records and secure transfers.\n\n3.  Insurance: Claims automation\
    \ and policy validation.\n\n#### Polkadot\n\nPolkadot is a blockchain platform\
    \ designed to enable interoperability between different networks. Created by the\
    \ Web3 Foundation, its goal is to connect multiple blockchains into a unified\
    \ ecosystem.\n\n##### Polkadot Features\n\n1.  Interoperability:  \n\n    Polkadot\
    \ allows different blockchains to communicate, sharing information and assets.\n\
    \n2.  Parachains:  \n\n    Parallel networks connected to Polkadot that may have\
    \ their own rules and functionality.\n\n3.  On-Chain Government:  \n\n    Participants\
    \ vote on changes and updates directly on the network.\n\n4.  Scalability:  \n\
    \n    Polkadot uses sharding to process multiple transactions simultaneously.\n\
    \nrust\n\nuse frame\\_support::{decl\\_module, decl\\_storage, decl\\_event, dispatch};\n\
    \npub trait Config: frame\\_system::Config {\n\ntype Event: From<Event<Self>>\
    \ + Into<<Self as frame\\_system::Config>::Event>;\n\n}\n\ndecl\\_storage! {\n\
    \ntrait Store for Module<T: Config> as ExampleModule {\n\nValue: u32;\n\n}\n\n\
    }\n\ndecl\\_event!(\n\npub enum Event<T> where AccountId = <T as frame\\_system::Config>::AccountId\
    \ {\n\nValueSet(AccountId, u32),\n\n}\n\n);\n\ndecl\\_module! {\n\npub struct\
    \ Module<T: Config> for enum Call where origin: T::Origin {\n\nfn deposit\\_event()\
    \ = default;\n\n#\\[weight = 10\\_000\\]\n\nfn set\\_value(origin, value: u32)\
    \ -> dispatch::DispatchResult {\n\nlet sender = ensure\\_signed(origin)?;\n\n\
    Value::put(value);\n\nSelf::deposit\\_event(RawEvent::ValueSet(sender, value));\n\
    \nOk(())\n\n}\n\n}\n\n}\n\nThe Substrate module above demonstrates how to implement\
    \ simple functionality on a Polkadot parachain.\n\n##### Use Cases\n\n1.  Blockchain\
    \ Interoperability: Connection of public and private networks.\n\n2.  DApps: Development\
    \ of decentralized applications that interact between multiple blockchains.\n\n\
    3.  Governance: Systems based on voting and decentralized decision-making.\n\n\
    #### Choosing the Ideal Platform for Projects\n\nWhen deciding which blockchain\
    \ platform to use, consider the following criteria:\n\n1.  Project Scope:\n\n\
    ○       Private business projects can benefit from Hyperledger or Corda.\n\n○       Public\
    \ and interoperable projects are best suited for Polkadot.\n\n2.  Privacy:\n\n\
    ○       For maximum privacy, choose Corda or Hyperledger Fabric.\n\n3.  Interoperability:\n\
    \n○       If the project requires interaction between multiple networks, Polkadot\
    \ is the best choice.\n\n4.  Ease of Development:\n\n○       Choose platforms\
    \ with support for popular languages ​​and robust tools.\n\n5.  Use Cases:\n\n\
    ○       Choose a platform that specializes in your desired application domain,\
    \ such as finance, healthcare, or logistics.\n\nBlockchain development platforms\
    \ offer unique solutions for different needs. Hyperledger, Corda, and Polkadot\
    \ represent significant advancements in governance, interoperability, and privacy.\
    \ Understanding its characteristics and use cases is essential for selecting the\
    \ right technology and ensuring project success.\n\nCHAPTER 18. PRIVACY ON BLOCKCHAIN\n\
    \n### \n\n* * *\n\nPrivacy is a critical aspect in the design of blockchain systems,\
    \ especially in a scenario where the inherent transparency of public transactions\
    \ can compromise sensitive data. While blockchain technology offers robust security\
    \ and immutability, it also presents significant challenges related to anonymity.\
    \ The combination of transparency and pseudonymity in networks like Bitcoin and\
    \ Ethereum creates a paradox: all transactions are publicly visible, but the real\
    \ identity of participants is often protected by cryptographic addresses.\n\n\
    However, this is not enough to fully protect privacy, especially for individuals\
    \ and organizations that want to avoid tracking, data analysis, or exposure of\
    \ business transactions. This chapter explores the anonymity mechanisms on blockchain\
    \ and analyzes advanced privacy technologies, focusing on platforms such as Zcash,\
    \ Monero, and other innovations.\n\n#### Mechanisms for Anonymity\n\n##### Pseudonymity\
    \ and Its Limitations"
  fmt: "\n# Choosing the Appropriate Blockchain Platform\n\nChoosing the appropriate\
    \ blockchain platform is a critical step in the development of projects based\
    \ on this technology. With several platforms available, each with unique characteristics,\
    \ it is essential to understand their functionalities, advantages and use cases\
    \ to make informed decisions. This chapter explores three of the most popular\
    \ and powerful platforms: Hyperledger, Corda and Polkadot, highlighting their\
    \ characteristics, differences and criteria for selecting the best option for\
    \ different types of projects.\n\n## Hyperledger\n\nHyperledger is an open source\
    \ project led by the Linux Foundation, created to promote the use of blockchain\
    \ technologies in companies. Unlike public networks like Bitcoin and Ethereum,\
    \ Hyperledger is designed for permissioned networks, where participants are identified\
    \ and trusted.\n\nHyperledger offers several frameworks and tools, the most **Hyperledger\
    \ Fabric** one of the most popular.\n\n### Features of Hyperledger Fabric\n\n\
    1.  **Modular Architecture**\n\n    `Fabric` uses a modular architecture, allowing\
    \ developers to choose specific components, such as consensus algorithms and identity\
    \ management, to meet the needs of their projects.\n\n2.  **Permissioned Network**\n\
    \n    Participants are authenticated and authorized, ensuring greater security\
    \ and privacy.\n\n3.  **Smart Contracts (Chaincode)**\n\n    Smart contracts in\
    \ `Fabric` are called `chaincodes` and can be written in languages such as `Go`,\
    \ `Java` or `Node.js`.\n\n4.  **Private Channel**\n\n    `Fabric` allows the creation\
    \ of private channels, where specific transactions are visible only to relevant\
    \ participants.\n\n```go\npackage main\n\nimport (\n\t\"github.com/hyperledger/fabric-contract-api-go/contractapi\"\
    \n)\n\ntype SmartContract struct {\n\tcontractapi.Contract\n}\n\nfunc (s *SmartContract)\
    \ CreateAsset(ctx contractapi.TransactionContextInterface, id string, value string)\
    \ error {\n\treturn ctx.GetStub().PutState(id, []byte(value))\n}\n\nfunc (s *SmartContract)\
    \ ReadAsset(ctx contractapi.TransactionContextInterface, id string) (string, error)\
    \ {\n\tvalue, err := ctx.GetStub().GetState(id)\n\tif err != nil {\n\t\treturn\
    \ \"\", err\n\t}\n\treturn string(value), nil\n}\n```\n\nThe chaincode above demonstrates\
    \ how to create and read assets on a `Hyperledger Fabric` network.\n\n### Use\
    \ Cases\n\n1.  **Supply Chain**: Tracking goods with transparency and efficiency.\n\
    2.  **Financial Sector**: Private networks for payment settlement and financing.\n\
    3.  **Health**: Secure sharing of medical records between institutions.\n\n##\
    \ Corda\n\n`Corda` is a blockchain platform designed for enterprises, developed\
    \ by R3. Its focus is on privacy and supporting transactions between known parties,\
    \ and is widely used in the financial sector.\n\n### Corda Features\n\n1.  **Private\
    \ Architecture**\n\n    Transactions on `Corda` are visible only to the parties\
    \ involved, ensuring high privacy.\n\n2.  **Smart Contracts in Kotlin/Java**\n\
    \n    Smart contracts are written in `Kotlin` or `Java`, making it accessible\
    \ to enterprise system developers.\n\n3.  **Notaries**\n\n    At `Corda`, notaries\
    \ are responsible for validating transactions and ensuring chronological order.\n\
    \n4.  **Interoperability**\n\n    Supports integration with existing systems and\
    \ allows interaction between different networks.\n\n```kotlin\npackage com.example.contract\n\
    \nimport net.corda.core.contracts.*\nimport net.corda.core.transactions.LedgerTransaction\n\
    \n@BelongsToContract(SimpleContract::class)\ndata class SimpleState(val value:\
    \ String, override val participants: List<AbstractParty>) : ContractState\n\n\
    class SimpleContract : Contract {\n    override fun verify(tx: LedgerTransaction)\
    \ {\n        require(tx.inputs.isEmpty()) { \"No inputs allowed\" }\n        require(tx.outputs.size\
    \ == 1) { \"Only one output allowed\" }\n    }\n}\n```\n\nContract in `Kotlin`\
    \ shows how to implement a simple transaction in `Corda`.\n\n### Use Cases\n\n\
    1.  **Banking Sector**: Transaction settlement and loan management.\n2.  **Properties**:\
    \ Digitization of property records and secure transfers.\n3.  **Insurance**: Claims\
    \ automation and policy validation.\n\n## Polkadot\n\n`Polkadot` is a blockchain\
    \ platform designed to enable interoperability between different networks. Created\
    \ by the Web3 Foundation, its goal is to connect multiple blockchains into a unified\
    \ ecosystem.\n\n### Polkadot Features\n\n1.  **Interoperability**\n\n    `Polkadot`\
    \ allows different blockchains to communicate, sharing information and assets.\n\
    \n2.  **Parachains**\n\n    Parallel networks connected to `Polkadot` that may\
    \ have their own rules and functionality.\n\n3.  **On-Chain Government**\n\n \
    \   Participants vote on changes and updates directly on the network.\n\n4.  **Scalability**\n\
    \n    `Polkadot` uses sharding to process multiple transactions simultaneously.\n\
    \n```rust\nuse frame_support::{decl_module, decl_storage, decl_event, dispatch};\n\
    \npub trait Config: frame_system::Config {\n    type Event: From<Event<Self>>\
    \ + Into<<Self as frame_system::Config>::Event>;\n}\n\ndecl_storage! {\n    trait\
    \ Store for Module<T: Config> as ExampleModule {\n        Value: u32;\n    }\n\
    }\n\ndecl_event!(\n    pub enum Event<T> where AccountId = <T as frame_system::Config>::AccountId\
    \ {\n        ValueSet(AccountId, u32),\n    }\n);\n\ndecl_module! {\n    pub struct\
    \ Module<T: Config> for enum Call where origin: T::Origin {\n        fn deposit_event()\
    \ = default;\n\n        #[weight = 10_000]\n        fn set_value(origin, value:\
    \ u32) -> dispatch::DispatchResult {\n            let sender = ensure_signed(origin)?;\n\
    \            Value::put(value);\n            Self::deposit_event(RawEvent::ValueSet(sender,\
    \ value));\n            Ok(())\n        }\n    }\n}\n```\n\nThe `Substrate` module\
    \ above demonstrates how to implement simple functionality on a `Polkadot` parachain.\n\
    \n### Use Cases\n\n1.  **Blockchain Interoperability**: Connection of public and\
    \ private networks.\n2.  **DApps**: Development of decentralized applications\
    \ that interact between multiple blockchains.\n3.  **Governance**: Systems based\
    \ on voting and decentralized decision-making.\n\n## Choosing the Ideal Platform\
    \ for Projects\n\nWhen deciding which blockchain platform to use, consider the\
    \ following criteria:\n\n1.  **Project Scope**\n    *   Private business projects\
    \ can benefit from `Hyperledger` or `Corda`.\n    *   Public and interoperable\
    \ projects are best suited for `Polkadot`.\n\n2.  **Privacy**\n    *   For maximum\
    \ privacy, choose `Corda` or `Hyperledger Fabric`.\n\n3.  **Interoperability**\n\
    \    *   If the project requires interaction between multiple networks, `Polkadot`\
    \ is the best choice.\n\n4.  **Ease of Development**\n    *   Choose platforms\
    \ with support for popular languages and robust tools.\n\n5.  **Use Cases**\n\
    \    *   Choose a platform that specializes in your desired application domain,\
    \ such as finance, healthcare, or logistics.\n\n`Blockchain` development platforms\
    \ offer unique solutions for different needs. `Hyperledger`, `Corda`, and `Polkadot`\
    \ represent significant advancements in governance, interoperability, and privacy.\
    \ Understanding its characteristics and use cases is essential for selecting the\
    \ right technology and ensuring project success.\n\n# CHAPTER 18. PRIVACY ON BLOCKCHAIN\n\
    \n---\n\nPrivacy is a critical aspect in the design of blockchain systems, especially\
    \ in a scenario where the inherent transparency of public transactions can compromise\
    \ sensitive data. While blockchain technology offers robust security and immutability,\
    \ it also presents significant challenges related to anonymity. The combination\
    \ of transparency and pseudonymity in networks like `Bitcoin` and `Ethereum` creates\
    \ a paradox: all transactions are publicly visible, but the real identity of participants\
    \ is often protected by cryptographic addresses.\n\nHowever, this is not enough\
    \ to fully protect privacy, especially for individuals and organizations that\
    \ want to avoid tracking, data analysis, or exposure of business transactions.\
    \ This chapter explores the anonymity mechanisms on blockchain and analyzes advanced\
    \ privacy technologies, focusing on platforms such as `Zcash`, `Monero`, and other\
    \ innovations.\n\n## Mechanisms for Anonymity\n\n### Pseudonymity and Its Limitations\n"
  trans: "\n# 选择合适的区块链平台\n\n选择合适的区块链平台是基于该技术开发项目的关键步骤。由于有多个平台可供选择，每个平台都有其独特的特性，因此了解它们的功能、优势和用例以做出明智的决策至关重要。本章探讨了三个最流行且最强大的平台：Hyperledger、Corda\
    \ 和 Polkadot，重点介绍它们的特性、差异以及针对不同类型项目选择最佳方案的标准。\n\n## Hyperledger\n\nHyperledger\
    \ 是由 Linux 基金会牵头的开源项目，旨在推动区块链技术在企业中的应用。与比特币和以太坊等公共网络不同，Hyperledger 专为许可型网络设计，其中参与者经过身份识别且受信任。\n\
    \nHyperledger 提供了多个框架和工具，其中最著名的是 **Hyperledger Fabric**。\n\n### Hyperledger Fabric\
    \ 的特性\n\n1.  **模块化架构**\n\n    `Fabric` 采用模块化架构，允许开发者选择特定组件，如共识算法和身份管理，以满足其项目需求。\n\
    \n2.  **许可型网络**\n\n    参与者经过身份验证和授权，确保更高的安全性和隐私性。\n\n3.  **智能合约**\n\n    `Fabric`\
    \ 中的智能合约称为 `chaincodes`（链码），可使用 `Go`、`Java` 或 `Node.js` 等语言编写。\n\n4.  **私有通道**\n\
    \n    `Fabric` 允许创建私有通道，特定交易仅对相关参与者可见。\n\n```go\npackage main\n\nimport (\n\t\"\
    github.com/hyperledger/fabric-contract-api-go/contractapi\"\n)\n\ntype SmartContract\
    \ struct {\n\tcontractapi.Contract\n}\n\nfunc (s *SmartContract) CreateAsset(ctx\
    \ contractapi.TransactionContextInterface, id string, value string) error {\n\t\
    return ctx.GetStub().PutState(id, []byte(value))\n}\n\nfunc (s *SmartContract)\
    \ ReadAsset(ctx contractapi.TransactionContextInterface, id string) (string, error)\
    \ {\n\tvalue, err := ctx.GetStub().GetState(id)\n\tif err != nil {\n\t\treturn\
    \ \"\", err\n\t}\n\treturn string(value), nil\n}\n```\n\n上述链码演示了如何在 `Hyperledger\
    \ Fabric` 网络上创建和读取资产。\n\n### 用例\n\n1.  **供应链**：以透明高效的方式追踪货物。\n2.  **金融领域**：用于支付结算和融资的私有网络。\n\
    3.  **医疗**：机构间安全共享医疗记录。\n\n## Corda\n\n`Corda` 是一个专为企业设计的区块链平台，由 R3 开发。其核心关注点在于隐私保护和支持已知方之间的交易，广泛应用于金融领域。\n\
    \n### Corda 特性\n\n1.  **私有架构**\n\n    `Corda` 上的交易仅对参与方可见，确保高度隐私。\n\n2.  **Kotlin/Java\
    \ 智能合约**\n\n    智能合约使用 `Kotlin` 或 `Java` 编写，方便企业级系统开发者使用。\n\n3.  **公证人**\n\n \
    \   在 `Corda` 中，公证人负责验证交易并确保时间顺序。\n\n4.  **互操作性**\n\n    支持与现有系统集成，并允许不同网络间交互。\n\
    \n```kotlin\npackage com.example.contract\n\nimport net.corda.core.contracts.*\n\
    import net.corda.core.transactions.LedgerTransaction\n\n@BelongsToContract(SimpleContract::class)\n\
    data class SimpleState(val value: String, override val participants: List<AbstractParty>)\
    \ : ContractState\n\nclass SimpleContract : Contract {\n    override fun verify(tx:\
    \ LedgerTransaction) {\n        require(tx.inputs.isEmpty()) { \"No inputs allowed\"\
    \ }\n        require(tx.outputs.size == 1) { \"Only one output allowed\" }\n \
    \   }\n}\n```\n\n`Kotlin` 合约展示了如何在 `Corda` 中实现简单交易。\n\n### 用例\n\n1.  **银行业**：交易结算和贷款管理。\n\
    2.  **房产**：房产记录数字化和安全转让。\n3.  **保险**：理赔自动化和保单验证。\n\n## Polkadot\n\n`Polkadot`\
    \ 是一个旨在实现不同网络间互操作性的区块链平台。由 Web3 基金会创建，其目标是将多条区块链连接成一个统一的生态系统。\n\n### Polkadot\
    \ 特性\n\n1.  **互操作性**\n\n    `Polkadot` 允许不同区块链进行通信，共享信息和资产。\n\n2.  **平行链**\n\n\
    \    连接到 `Polkadot` 的并行网络，可拥有自己的规则和功能。\n\n3.  **链上治理**\n\n    参与者直接在网络上对变更和升级进行投票。\n\
    \n4.  **可扩展性**\n\n    `Polkadot` 使用分片技术同时处理多笔交易。\n\n```rust\nuse frame_support::{decl_module,\
    \ decl_storage, decl_event, dispatch};\n\npub trait Config: frame_system::Config\
    \ {\n    type Event: From<Event<Self>> + Into<<Self as frame_system::Config>::Event>;\n\
    }\n\ndecl_storage! {\n    trait Store for Module<T: Config> as ExampleModule {\n\
    \        Value: u32;\n    }\n}\n\ndecl_event!(\n    pub enum Event<T> where AccountId\
    \ = <T as frame_system::Config>::AccountId {\n        ValueSet(AccountId, u32),\n\
    \    }\n);\n\ndecl_module! {\n    pub struct Module<T: Config> for enum Call where\
    \ origin: T::Origin {\n        fn deposit_event() = default;\n\n        #[weight\
    \ = 10_000]\n        fn set_value(origin, value: u32) -> dispatch::DispatchResult\
    \ {\n            let sender = ensure_signed(origin)?;\n            Value::put(value);\n\
    \            Self::deposit_event(RawEvent::ValueSet(sender, value));\n       \
    \     Ok(())\n        }\n    }\n}\n```\n\n上述 `Substrate` 模块演示了如何在 `Polkadot` 平行链上实现简单功能。\n\
    \n### 用例\n\n1.  **区块链互操作性**：连接公有和私有网络。\n2.  **DApps**：开发可在多条区块链间交互的去中心化应用。\n3.\
    \  **治理**：基于投票和去中心化决策的系统。\n\n## 为项目选择理想平台\n\n在决定使用哪个区块链平台时，请考虑以下标准：\n\n1.  **项目范围**\n\
    \    *   私有企业项目可受益于 `Hyperledger` 或 `Corda`。\n    *   公共和互操作性项目最适合 `Polkadot`。\n\
    \n2.  **隐私性**\n    *   为追求最高隐私，选择 `Corda` 或 `Hyperledger Fabric`。\n\n3.  **互操作性**\n\
    \    *   若项目需要多网络交互，`Polkadot` 是最佳选择。\n\n4.  **开发便利性**\n    *   选择支持主流语言且工具完善的平台。\n\
    \n5.  **用例**\n    *   选择专精于您所需应用领域的平台，如金融、医疗或物流。\n\n`Blockchain` 开发平台为不同需求提供独特解决方案。`Hyperledger`、`Corda`\
    \ 和 `Polkadot` 分别在治理、互操作性和隐私方面代表了重大进步。了解其特性和用例对于选择合适技术并确保项目成功至关重要。\n\n# 第 18 章\
    \ 区块链上的隐私\n\n---\n\n隐私是区块链系统设计中的关键方面，特别是在公共交易的固有透明性可能泄露敏感数据的场景下。虽然区块链技术提供了强大的安全性和不可篡改性，但也带来了与匿名性相关的重大挑战。`Bitcoin`\
    \ 和 `Ethereum` 等网络中透明性与假名性的结合产生了一个悖论：所有交易公开可见，但参与者的真实身份通常受加密地址保护。\n\n然而，这不足以完全保护隐私，尤其是对于希望避免追踪、数据分析或商业交易曝光的个人和组织。本章探讨区块链上的匿名机制，并分析先进隐私技术，重点关注\
    \ `Zcash`、`Monero` 等平台及其他创新。\n\n## 匿名机制\n\n### 假名性及其局限性\n"
