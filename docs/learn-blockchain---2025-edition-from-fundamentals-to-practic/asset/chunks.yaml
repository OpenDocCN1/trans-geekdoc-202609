    \n```solidity\npragma solidity ⁰.8.0;\n\ncontract ToDoList {\n    struct Task\
    \ {\n        uint256 id;\n        string content;\n        bool completed;\n \
    \   }\n\n    uint256 public taskCount;\n    mapping(uint256 => Task) public tasks;\n\
    \n    event TaskCreated(uint256 id, string content, bool completed);\n    event\
    \ TaskCompleted(uint256 id, bool completed);\n\n    function createTask(string\
    \ memory content) public {\n        taskCount++;\n        tasks[taskCount] = Task(taskCount,\
    \ content, false);\n        emit TaskCreated(taskCount, content, false);\n   \
    \ }\n\n    function toggleComplete(uint256 id) public {\n        Task storage\
    \ task = tasks[id];\n        task.completed = !task.completed;\n        emit TaskCompleted(id,\
    \ task.completed);\n    }\n}\n```\n\n1.  **函数 `createTask`**：  \n    创建新任务并发出事件以通知创建。\n\
