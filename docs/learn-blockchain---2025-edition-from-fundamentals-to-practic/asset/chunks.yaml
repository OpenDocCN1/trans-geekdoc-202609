    const `web3` = new `Web3`(`Web3.givenProvider` || "http://localhost:7545");


    const `toDoList` = new `web3.eth.Contract`(`contractABI`, `contractAddress`);


    `document.getElementById`("taskForm").`addEventListener`("submit", async (`event`)
