- raw: "●       Improved privacy for data and transactions.\n\nDisadvantages\n\n●       Less\
    \ decentralization.\n\n●       Dependence on trust in managing entities.\n\n●       Less\
    \ transparency for external users.\n\n#### Choosing the Right Approach\n\nThe\
    \ choice between public and private blockchain depends on the project context\
    \ and specific needs.\n\nFor applications that require global inclusion, transparency,\
    \ and the elimination of intermediaries, public blockchains are ideal. They are\
    \ suitable for community initiatives, decentralized governance and open financial\
    \ markets.\n\nWhether the goal is to protect sensitive information, comply with\
    \ regulations, or optimize internal operations, private blockchains are the best\
    \ choice. They offer greater control and privacy without compromising efficiency.\n\
    \nBoth models can be used in a complementary way. Hybrid networks combine the\
    \ advantages of public and private blockchains, creating solutions that balance\
    \ transparency and privacy.\n\nWith the continuous evolution of blockchain technology,\
    \ new models are emerging to overcome limitations and meet diverse demands. Interoperability\
    \ between public and private blockchains is an active area of ​​research, allowing\
    \ for greater flexibility and collaboration between disparate networks.\n\nPublic\
    \ and private blockchains play crucial roles in advancing decentralized technologies.\
    \ Understanding their differences and applications is essential to explore their\
    \ potential and create solutions that positively impact society and the global\
    \ economy.\n\nCHAPTER 6. ETHEREUM: THE REVOLUTIONARY PLATFORM\n\n### \n\n* * *\n\
    \nEthereum is widely recognized as one of the most innovative and influential\
    \ platforms in the blockchain space. Created to go beyond the limitations of Bitcoin,\
    \ it introduced the concept of smart contracts and decentralized applications\
    \ (dApps), revolutionizing the way people interact with blockchain technology.\n\
    \n#### Ethereum Fundamentals\n\nEthereum was launched in 2015 by a group of developers\
    \ led by Vitalik Buterin. The main idea behind Ethereum was to create a platform\
    \ that would allow not only financial transactions but also the execution of programmed\
    \ logic in the form of smart contracts.\n\nWhile Bitcoin functions as a decentralized\
    \ payments system, Ethereum is a decentralized virtual machine, called the Ethereum\
    \ Virtual Machine (EVM). EVM runs smart contracts written in specific languages\
    \ ​​such as Solidity, allowing developers to create decentralized applications\
    \ ranging from games to complex financial systems.\n\nThe functioning of Ethereum\
    \ is based on its blockchain, where each transaction and smart contract is recorded.\
    \ Mining, initially based on Proof of Work (PoW), is being replaced by Proof of\
    \ Stake (PoS) with Ethereum 2.0, an upgrade designed to improve the network's\
    \ scalability, security, and sustainability.\n\nEther (ETH) is Ethereum's native\
    \ cryptocurrency. In addition to being used for value transfers, it is used as\
    \ \"fuel\" to run smart contracts, known as \"gas.\" The price of gas is determined\
    \ by the complexity of the operation and network congestion, encouraging the efficient\
    \ use of resources.\n\n#### Solidity and Smart Contract Development\n\nSolidity\
    \ is the main programming language used on Ethereum to create smart contracts.\
    \ Designed specifically for the platform, it is inspired by languages ​​like JavaScript\
    \ and Python, making it accessible to developers with prior programming experience.\n\
    \nSmart contracts in Solidity are implemented as immutable codes that reside on\
    \ the blockchain. Once implemented, they cannot be changed, ensuring transparency\
    \ and security.\n\nThe first step in smart contract development is to set up the\
    \ development environment. Popular tools include Remix, a browser-based IDE, and\
    \ frameworks like Hardhat or Truffle, which offer greater control over testing\
    \ and deployments.\n\n##### Basic Structure of a Solidity Contract\n\nCreating\
    \ a smart contract starts with defining its structure. A master agreement includes\
    \ a license statement, Solidity version specification, and agreement definition.\n\
    \nsolidity\n\n// SPDX-License-Identifier: MIT\n\npragma solidity ^0.8.0;\n\ncontract\
    \ BasicContract {\n\nstring public message;\n\nconstructor(string memory initialMessage)\
    \ {\n\nmessage = initialMessage;\n\n}\n\nfunction setMessage(string memory newMessage)\
    \ public {\n\nmessage = newMessage;\n\n}\n\nfunction getMessage() public view\
    \ returns (string memory) {\n\nreturn message;\n\n}\n\n}\n\nIn this contract,\
    \ the function constructor defines an initial message. The function setMessage\
    \ allows you to change the message, while getMessage returns the current value.\n\
    \n##### Data Types and Modifiers\n\nSolidity supports multiple data types, including\
    \ integers, strings, arrays, and addresses. Modifiers like public, private, view\
    \ and pure control the accessibility and behavior of functions.\n\nFor example,\
    \ a function marked as view does not change the state of the contract, while a\
    \ function pure does not access or change the state. These modifiers help reduce\
    \ execution costs and organize the code.\n\n##### Interaction with Contracts\n\
    \nSmart contracts can interact with each other, creating an interconnected ecosystem.\
    \ This functionality is crucial for the development of complex dApps such as decentralized\
    \ marketplaces.\n\nsolidity\n\npragma solidity ^0.8.0;\n\ncontract ParentContract\
    \ {\n\nuint public value;\n\nfunction setValue(uint newValue) public {\n\nvalue\
    \ = newValue;\n\n}\n\n}\n\ncontract ChildContract {\n\nParentContract parent;\n\
    \nconstructor(address parentAddress) {\n\nparent = ParentContract(parentAddress);\n\
    \n}\n\nfunction updateParentValue(uint newValue) public {\n\nparent.setValue(newValue);\n\
    \n}\n\n}\n\nIn the example, the ChildContract interacts with the ParentContract,\
    \ allowing updates to the status of the main contract. This interaction is fundamental\
    \ to creating modular systems.\n\n##### Events and Logs\n\nEvents in Solidity\
    \ are used to record information on the blockchain, allowing external applications\
    \ to monitor state changes.\n\nsolidity\n\npragma solidity ^0.8.0;\n\ncontract\
    \ EventContract {\n\nevent ValueChanged(address indexed sender, uint oldValue,\
    \ uint newValue);\n\nuint public value;\n\nfunction updateValue(uint newValue)\
    \ public {\n\nuint oldValue = value;\n\nvalue = newValue;\n\nemit ValueChanged(msg.sender,\
    \ oldValue, newValue);\n\n}\n\n}\n\nEvents are emitted using the keyword emit\
    \ and can be viewed by applications connected to the blockchain.\n\n##### Development\
    \ Security\n\nSecurity is a central concern in the development of smart contracts.\
    \ Vulnerabilities can be exploited to steal funds or manipulate data. Some best\
    \ practices include:\n\n●       Use updated versions of Solidity to take advantage\
    \ of security fixes.\n\n●       Limit exposure of functions by marking them as\
    \ private or internal when possible.\n\n●       Implement strict keyword checks\
    \ require.\n\n●       Perform code audits and exhaustive testing before deployment.\n\
    \n##### Smart Contract Use Cases\n\nSmart contracts have vast and diverse applications.\n\
    \n1.  Decentralized Finance (DeFi): Platforms like Uniswap and Aave use smart\
    \ contracts to create intermediary-free financial markets.\n\n2.  NFTs: Smart\
    \ contracts manage the creation and transfer of non-fungible tokens, enabling\
    \ authenticity in digital art and games.\n\n3.  Supply Chain: Product traceability\
    \ is guaranteed by contracts that record each step of the process.\n\n4.  Governance:\
    \ Decentralized autonomous organizations (DAOs) use contracts to vote and implement\
    \ collective decisions.\n\nEthereum, with its ability to host smart contracts\
    \ and dApps, has established a new paradigm for blockchain technology. Through\
    \ tools like Solidity and innovations like Ethereum 2.0, it continues to lead\
    \ the decentralized revolution, impacting industries on a global scale.\n\nCHAPTER\
    \ 7. BITCOIN: THE FIRST BLOCKCHAIN\n\n### \n\n* * *"
  fmt: "\n# 区块链公有链与私有链对比\n\n## 优势\n\n- 数据和交易的隐私性得到提升。\n\n## 劣势\n\n- 去中心化程度较低。\n- 依赖对管理实体的信任。\n\
    - 对外部用户透明度较低。\n\n## 选择合适的方法\n\n公有链与私有链的选择取决于项目背景和具体需求。\n\n对于需要全球包容性、透明度以及消除中介的应用，公有链是理想选择。它们适用于社区倡议、去中心化治理和开放金融市场。\n\
    \n无论目标是保护敏感信息、遵守法规还是优化内部运营，私有链都是最佳选择。它们在不妥协效率的前提下提供更强的控制力和隐私性。\n\n两种模式可以互补使用。混合网络结合了公有链和私有链的优势，创造出平衡透明度与隐私性的解决方案。\n\
    \n随着区块链技术的持续演进，新模型不断涌现以克服局限并满足多样化需求。公有链与私有链的互操作性是活跃的研究领域，这将允许不同网络之间拥有更大的灵活性和协作空间。\n\
    \n公有链和私有链在推动去中心化技术发展中发挥着关键作用。理解它们的差异和应用对于探索其潜力、创造积极影响社会和全球经济的解决方案至关重要。\n\n# 第\
    \ 6 章 Ethereum：革命性平台\n\n---\n\nEthereum 广泛被认为是区块链领域最具创新性和影响力的平台之一。它的创建旨在突破 Bitcoin\
    \ 的局限性，引入了智能合约和去中心化应用（dApps）的概念，彻底改变了人们与区块链技术交互的方式。\n\n## Ethereum 基础\n\nEthereum\
    \ 于 2015 年由 Vitalik Buterin 领导的开发者团队推出。Ethereum 的核心理念是创建一个平台，不仅支持金融交易，还支持以智能合约形式执行编程逻辑。\n\
    \nBitcoin 作为去中心化支付系统运行，而 Ethereum 是一个去中心化虚拟机，称为 Ethereum Virtual Machine（EVM）。EVM\
    \ 运行用特定语言（如 Solidity）编写的智能合约，使开发者能够创建从游戏到复杂金融系统的去中心化应用。\n\nEthereum 的运行基于其区块链，每笔交易和智能合约都记录在其中。挖矿机制最初基于\
    \ Proof of Work（PoW），正在通过 Ethereum 2.0 升级替换为 Proof of Stake（PoS），旨在提升网络的可扩展性、安全性和可持续性。\n\
    \nEther（ETH）是 Ethereum 的原生加密货币。除了用于价值转移，它还作为运行智能合约的“燃料”，称为“gas”。Gas 价格由操作复杂度和网络拥堵程度决定，鼓励资源的高效利用。\n\
    \n## Solidity 与智能合约开发\n\nSolidity 是 Ethereum 上创建智能合约的主要编程语言。它专为该平台设计，受 JavaScript\
    \ 和 Python 等语言启发，使有编程经验的开发者易于上手。\n\nSolidity 中的智能合约作为不可变代码部署在区块链上。一旦部署，便无法更改，确保了透明度和安全性。\n\
    \n智能合约开发的第一步是搭建开发环境。流行工具包括基于浏览器的 IDE Remix，以及 Hardhat 或 Truffle 等框架，它们提供了对测试和部署更大的控制权。\n\
    \n### Solidity 合约的基本结构\n\n创建智能合约始于定义其结构。一个主合约包含许可证声明、Solidity 版本指定和合约定义。\n\n```solidity\n\
    // SPDX-License-Identifier: MIT\npragma solidity ^0.8.0;\n\ncontract BasicContract\
    \ {\n    string public message;\n\n    constructor(string memory initialMessage)\
    \ {\n        message = initialMessage;\n    }\n\n    function setMessage(string\
    \ memory newMessage) public {\n        message = newMessage;\n    }\n\n    function\
    \ getMessage() public view returns (string memory) {\n        return message;\n\
    \    }\n}\n```\n\n在该合约中，`constructor` 函数定义初始消息。`setMessage` 函数允许修改消息，而 `getMessage`\
    \ 返回当前值。\n\n### 数据类型与修饰符\n\nSolidity 支持多种数据类型，包括整数、字符串、数组和地址。`public`、`private`、`view`\
    \ 和 `pure` 等修饰符控制函数的可访问性和行为。\n\n例如，标记为 `view` 的函数不改变合约状态，而 `pure` 函数不访问也不改变状态。这些修饰符有助于降低执行成本并组织代码。\n\
    \n### 合约交互\n\n智能合约之间可以相互交互，创建互联的生态系统。此功能对于开发复杂的 dApps（如去中心化市场）至关重要。\n\n```solidity\n\
    pragma solidity ^0.8.0;\n\ncontract ParentContract {\n    uint public value;\n\
    \n    function setValue(uint newValue) public {\n        value = newValue;\n \
    \   }\n}\n\ncontract ChildContract {\n    ParentContract parent;\n\n    constructor(address\
    \ parentAddress) {\n        parent = ParentContract(parentAddress);\n    }\n\n\
    \    function updateParentValue(uint newValue) public {\n        parent.setValue(newValue);\n\
    \    }\n}\n```\n\n在示例中，`ChildContract` 与 `ParentContract` 交互，允许更新主合约的状态。这种交互是创建模块化系统的基础。\n\
    \n### 事件与日志\n\nSolidity 中的事件用于在区块链上记录信息，允许外部应用监控状态变更。\n\n```solidity\npragma solidity\
    \ ^0.8.0;\n\ncontract EventContract {\n    event ValueChanged(address indexed\
    \ sender, uint oldValue, uint newValue);\n    uint public value;\n\n    function\
    \ updateValue(uint newValue) public {\n        uint oldValue = value;\n      \
    \  value = newValue;\n        emit ValueChanged(msg.sender, oldValue, newValue);\n\
    \    }\n}\n```\n\n事件使用 `emit` 关键字触发，可被连接到区块链的应用查看。\n\n### 开发安全性\n\n安全性是智能合约开发的核心关注点。漏洞可能被利用以窃取资金或篡改数据。一些最佳实践包括：\n\
