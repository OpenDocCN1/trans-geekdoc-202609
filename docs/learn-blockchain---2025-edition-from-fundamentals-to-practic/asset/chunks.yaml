- raw: "In the healthcare sector, blockchain enables the secure management of medical\
    \ records. Instead of storing data on centralized servers that are vulnerable\
    \ to attack, records can be distributed across a network of nodes, where only\
    \ authorized people can access them. This improves patient privacy and efficiency\
    \ in sharing medical information.\n\nOver the years, different types of blockchain\
    \ have been developed to meet specific needs. Public blockchains, like Bitcoin,\
    \ allow anyone to participate in the network and contribute to the validation\
    \ process. Private blockchains, on the other hand, are used by companies that\
    \ want to control access and permissions within their networks. Hybrid blockchains\
    \ combine characteristics of both, offering flexibility for varied use cases.\n\
    \nAlthough blockchain has numerous advantages, it also faces challenges. Scalability\
    \ is one of the most discussed issues. As the number of transactions increases,\
    \ blockchain networks may experience congestion, resulting in longer processing\
    \ times and higher fees. Furthermore, energy consumption, especially in Proof\
    \ of Work-based blockchains, has been criticized for its environmental impact.\n\
    \nAnother challenge is adoption. Despite its growing popularity, many organizations\
    \ still do not fully understand how to integrate blockchain into their existing\
    \ processes. This requires investments in infrastructure, training and, often,\
    \ a change in mindset regarding how data is managed.\n\nWith all its advantages\
    \ and challenges, blockchain remains one of the most promising technologies of\
    \ the 21st century. It has the potential to democratize access to services, improve\
    \ transparency in critical sectors and open up new possibilities for innovation.\
    \ As more companies and governments begin to adopt blockchain, its impact on society\
    \ will only grow.\n\nIn short, blockchain is more than just a technology; it is\
    \ a paradigm that is redefining the concepts of trust, transparency and decentralization.\
    \ Its history is a testament to how technological innovations can transform entire\
    \ industries, and its continued evolution ensures it will remain relevant for\
    \ years to come. The future of blockchain is promising, and mastering it is an\
    \ essential skill for any technology professional or enthusiast.\n\nCHAPTER 2.\
    \ BLOCKCHAIN ​​FUNDAMENTALS\n\n### \n\n* * *\n\nThe blockchain is made up of a\
    \ unique architecture that combines a series of structural elements and mechanisms\
    \ to guarantee security, transparency and immutability. A detailed understanding\
    \ of how these pieces fit together is critical to mastering the technology. The\
    \ block structure, hash, timestamp and chaining are the core elements that make\
    \ blockchain a reliable and widely applicable solution.\n\n#### Block Structure\n\
    \nEach block in the blockchain is a unit of data that contains essential information\
    \ organized into three main sections: header, transaction data, and hash of the\
    \ previous block. This organization follows a logic that guarantees the immutability\
    \ and integrity of the record.\n\nA block's header includes the hash of the previous\
    \ block, a timestamp marking the time the block was created, the nonce used to\
    \ solve the proof-of-work algorithm (where applicable), and other metadata necessary\
    \ to identify the block.\n\nTransaction data represents the content of the block\
    \ and can include any information valid for the blockchain application. In the\
    \ case of Bitcoin, this data consists of financial transactions, while in other\
    \ networks, such as Ethereum, it may contain smart contracts or other forms of\
    \ data.\n\nEach block is linked to the previous one through hashing, creating\
    \ a continuous chain. This sequential structure is the basis for the secure and\
    \ decentralized functioning of the blockchain.\n\n#### Hash and Its Function\n\
    \nThe hash is an alphanumeric sequence generated by mathematical functions that\
    \ transforms input data into a fixed-size output. In the blockchain, the hash\
    \ serves as a fingerprint for each block, uniquely identifying it. Even a small\
    \ change to the input data will result in a completely different hash, ensuring\
    \ the integrity of the stored data.\n\nOn blockchain, the most widely used hash\
    \ algorithm is SHA-256 (Secure Hash Algorithm 256 bits). It processes any input\
    \ and returns a fixed 256-bit sequence, which is used to create the unique block\
    \ and transaction identifiers.\n\npython\n\nimport hashlib\n\ndef generate\\_hash(data):\n\
    \nreturn hashlib.sha256(data.encode('utf-8')).hexdigest()\n\ndata = \"blockchain\
    \ example\"\n\nprint(generate\\_hash(data))\n\nThis Python code demonstrates how\
    \ to generate a SHA-256 hash. The returned string is unique to the given input\
    \ and changes completely if any character in the input changes.\n\nIn addition\
    \ to providing integrity, hashing plays a crucial role in consensus algorithms\
    \ such as proof of work. The solution to a hash-based mathematical problem is\
    \ the mechanism that validates the addition of new blocks to the chain.\n\n####\
    \ Timestamp and Chronological Record\n\nThe timestamp is an essential component\
    \ in the header of each block and indicates the exact moment the block was created\
    \ and validated. This timestamp ensures that data on the blockchain is recorded\
    \ chronologically, avoiding clutter and inconsistencies.\n\nThe reliability of\
    \ the timestamp depends on consensus between network nodes, eliminating the possibility\
    \ of unilateral manipulation. This is especially important in applications that\
    \ require accurate history, such as supply chain asset tracking or medical records.\n\
    \n#### Block Chaining\n\nThe connection between blocks occurs through the hash\
    \ of the previous block, forming a continuous chain. This approach is fundamental\
    \ to blockchain security, as any attempt to change a block invalidates the hashes\
    \ of all subsequent blocks, making the change easily detectable.\n\nImagine a\
    \ chain with three blocks. If a malicious actor attempts to modify the data in\
    \ block 2, the hash of that block will change, breaking the connection to block\
    \ 3. To disguise the change, it would be necessary to recalculate the hashes of\
    \ all subsequent blocks, which would require significant computational power ,\
    \ especially in large networks.\n\nHash-based chaining also allows for quick verification\
    \ of chain integrity. Any discrepancy between the hashes indicates manipulation\
    \ or error, helping network participants maintain confidence in the stored data.\n\
    \n#### Basic Cryptography on Blockchain\n\nCryptography is one of the pillars\
    \ of blockchain security. It protects transactions, guarantees anonymity when\
    \ necessary and authenticates network participants. Two main types of encryption\
    \ are widely used: public and private key encryption and digital signatures.\n\
    \n##### Public and Private Key Cryptography\n\nEach participant in the blockchain\
    \ has a pair of keys: a public key and a private key. The public key is used to\
    \ identify the user, while the private key is used to sign transactions and authenticate\
    \ ownership of assets.\n\nThe transaction is digitally signed with the sender's\
    \ private key, ensuring that only the owner can initiate the transaction. The\
    \ sender's public key allows other participants to verify the signature without\
    \ revealing the private key.\n\npython\n\nfrom cryptography.hazmat.primitives.asymmetric\
    \ import rsa\n\nfrom cryptography.hazmat.primitives import serialization, hashes\n\
    \nfrom cryptography.hazmat.primitives.asymmetric import padding\n\n\\# Generating\
    \ private key\n\nprivate\\_key = rsa.generate\\_private\\_key(\n\npublic\\_exponent=65537,\n\
    \nkey\\_size=2048,\n\n)\n\n\\# Generating public key\n\npublic\\_key = private\\\
    _key.public\\_key()\n\n\\# Signing message\n\nmessage = b\"transaction data\"\n\
    \nsignature = private\\_key.sign(\n\nmessage,\n\npadding.PSS(\n\nmgf=padding.MGF1(hashes.SHA256()),\n\
    \nsalt\\_length=padding.PSS.MAX\\_LENGTH\n\n),\n\nhashes.SHA256()\n\n)\n\n\\#\
    \ Verifying signature\n\npublic\\_key.verify(\n\nsignature,\n\nmessage,\n\npadding.PSS(\n\
    \nmgf=padding.MGF1(hashes.SHA256()),\n\nsalt\\_length=padding.PSS.MAX\\_LENGTH\n\
    \n),\n\nhashes.SHA256()\n\n)"
