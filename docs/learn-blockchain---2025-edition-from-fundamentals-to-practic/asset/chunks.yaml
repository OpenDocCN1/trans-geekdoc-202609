- raw: "Altcoins, or alternative currencies, refer to all cryptocurrencies that are\
    \ not Bitcoin. They were created to overcome limitations of Bitcoin or to offer\
    \ unique functionalities that suit different use cases.\n\n##### Litecoin\n\n\
    Litecoin was designed as a lighter alternative to Bitcoin with a focus on fast\
    \ and affordable transactions. It uses a different hashing algorithm called Scrypt,\
    \ which reduces dependence on specialized mining hardware.\n\npython\n\n\\# Transaction\
    \ time simulation between Bitcoin and Litecoin\n\ndef transaction\\_time(block\\\
    _time, transactions):\n\nreturn block\\_time \\* transactions\n\nbitcoin\\_time\
    \ = transaction\\_time(10, 5) # Average Bitcoin time: 10 minutes per block\n\n\
    litecoin\\_time = transaction\\_time(2.5, 5) # Average Litecoin time: 2.5 minutes\
    \ per block\n\nprint(f\"Bitcoin: {bitcoin\\_time} minutos, Litecoin: {litecoin\\\
    _time} minutos\")\n\nLitecoin reduces average transaction times, making it ideal\
    \ for fast payments and microtransactions.\n\n##### Ethereum\n\nEthereum is the\
    \ second largest cryptocurrency in terms of market capitalization and has introduced\
    \ smart contracts on the blockchain. While Bitcoin is limited to value transfers,\
    \ Ethereum allows the execution of programmable code in the form of decentralized\
    \ applications (dApps).\n\nDevelopers can create smart contracts that automate\
    \ processes like lending, insurance, or even decentralized governance.\n\nsolidity\n\
    \npragma solidity ^0.8.0;\n\ncontract SimpleContract {\n\naddress public owner;\n\
    \nconstructor() {\n\nowner = msg.sender;\n\n}\n\nfunction getOwner() public view\
    \ returns (address) {\n\nreturn owner;\n\n}\n\n}\n\nThe Solidity code demonstrates\
    \ how to create a simple contract to manage ownership, illustrating the flexibility\
    \ of Ethereum.\n\n##### Cardano\n\nCardano is a blockchain platform that focuses\
    \ on sustainability and scalability. Using a Proof of Stake consensus algorithm\
    \ called Ouroboros, it reduces energy consumption while maintaining security.\n\
    \nIts features include smart contracts and the ability to interact with multiple\
    \ blockchains, promoting interoperability.\n\n##### Polkadot\n\nPolkadot facilitates\
    \ communication between different blockchains, allowing information and assets\
    \ to be transferred between different networks. This functionality, called interoperability,\
    \ solves the problem of fragmentation in the blockchain ecosystem.\n\n##### Monero\n\
    \nMonero is a privacy-focused cryptocurrency offering anonymous transactions.\
    \ Using technologies such as stealth addresses and ring signatures, it ensures\
    \ that senders, recipients and transacted amounts remain hidden.\n\npython\n\n\
    \\# Anonymous transaction simulation using masked values\n\nclass MoneroTransaction:\n\
    \ndef \\_\\_init\\_\\_(self, sender, receiver, amount):\n\nself.sender = self.mask\\\
    _address(sender)\n\nself.receiver = self.mask\\_address(receiver)\n\nself.amount\
    \ = amount\n\ndef mask\\_address(self, address):\n\nreturn f\"MASKED-{address\\\
    [-4:\\]}\"\n\ntransaction = MoneroTransaction(\"Alice123\", \"Bob456\", 100)\n\
    \nprint(f\"Sender: {transaction.sender}, Receiver: {transaction.receiver}, Amount:\
    \ {transaction.amount}\")\n\nMonero's approach exemplifies how privacy can be\
    \ integrated into financial transactions.\n\n#### Stablecoins\n\nStablecoins are\
    \ cryptocurrencies designed to minimize volatility by tying their value to stable\
    \ assets such as fiat currencies, commodities or controlling algorithms.\n\n#####\
    \ Stablecoins Backed by Fiat Currencies\n\nThese stablecoins hold reserves equivalent\
    \ to the number of tokens in circulation. For each unit issued, a corresponding\
    \ fiat currency is stored in an escrow account.\n\nTether (USDT) and USD Coin\
    \ (USDC) are popular examples of this category. They offer stability and are widely\
    \ used for international transfers, payments and protection against volatility\
    \ in cryptocurrency markets.\n\npython\n\nclass FiatBackedStablecoin:\n\ndef \\\
    _\\_init\\_\\_(self, fiat\\_reserve):\n\nself.reserve = fiat\\_reserve\n\nself.tokens\
    \ = 0\n\ndef mint(self, amount):\n\nif amount <= self.reserve:\n\nself.tokens\
    \ += amount\n\nself.reserve -= amount\n\nreturn f\"{amount} tokens minted\"\n\n\
    return \"Insufficient reserve\"\n\nstablecoin = FiatBackedStablecoin(1000)\n\n\
    print(stablecoin.mint(500))\n\nThe script demonstrates the issuance of stablecoins\
    \ backed by fiat reserves.\n\n##### Cryptocurrency-Backed Stablecoins\n\nThese\
    \ stablecoins use other cryptocurrencies as collateral. Because cryptocurrencies\
    \ are volatile, they often require overcollateralization to ensure stability.\n\
    \nDAI is an example of a cryptocurrency-backed stablecoin where users lock Ether\
    \ in smart contracts to issue DAI.\n\n##### Stablecoins Algorítmicas\n\nAlgorithmic\
    \ stablecoins do not rely on reserves, but use algorithms to adjust their supply\
    \ based on demand. If the token price rises, the algorithm increases the supply;\
    \ if it falls, it reduces supply.\n\npython\n\nclass AlgorithmicStablecoin:\n\n\
    def \\_\\_init\\_\\_(self, supply, price\\_target):\n\nself.supply = supply\n\n\
    self.price\\_target = price\\_target\n\ndef adjust\\_supply(self, market\\_price):\n\
    \nif market\\_price > self.price\\_target:\n\nself.supply += 10 # Increase to\
    \ supply\n\nelif market\\_price < self.price\\_target:\n\nself.supply -= 10 #\
    \ Reduce supply\n\nstablecoin = AlgorithmicStablecoin(1000, 1.0)\n\nstablecoin.adjust\\\
    _supply(1.2)\n\nprint(f\"New supply: {stablecoin.supply}\")\n\nThe code exemplifies\
    \ how algorithmic stablecoins adjust supply to stabilize their price.\n\n####\
    \ Tokens\n\nTokens are digital assets created on existing blockchains. They can\
    \ represent a wide range of utilities, from voting rights to access to services.\n\
    \n##### Fungible Tokens\n\nFungible tokens, like ERC-20 on Ethereum, are interchangeable.\
    \ They are used in applications such as decentralized finance (DeFi) and crowdfunding.\n\
    \nsolidity\n\npragma solidity ^0.8.0;\n\nimport \"@openzeppelin/contracts/token/ERC20/ERC20.sol\"\
    ;\n\ncontract MyToken is ERC20 {\n\nconstructor(uint256 initialSupply) ERC20(\"\
    MyToken\", \"MTK\") {\n\n\\_mint(msg.sender, initialSupply);\n\n}\n\n}\n\nThe\
    \ code creates an ERC-20 standard fungible token, illustrating the simplicity\
    \ of creating tokens on Ethereum.\n\n##### Non-Fungible Tokens (NFTs)\n\nNFTs\
    \ are unique and not interchangeable. They are used to represent digital property\
    \ in art, games, and collectibles.\n\nsolidity\n\npragma solidity ^0.8.0;\n\n\
    import \"@openzeppelin/contracts/token/ERC721/ERC721.sol\";\n\ncontract MyNFT\
    \ is ERC721 {\n\nconstructor() ERC721(\"MyNFT\", \"MNFT\") {}\n\nfunction mint(address\
    \ to, uint256 tokenId) public {\n\n\\_mint(to, tokenId);\n\n}\n\n}\n\nThe code\
    \ demonstrates the creation of a non-fungible token using the ERC-721 standard.\n\
    \n#### Impact of Altcoins, Stablecoins and Tokens\n\nDiversity in the cryptocurrency\
    \ ecosystem expands the possibilities for using blockchain, going beyond storing\
    \ value and financial transactions. Altcoins introduce innovations that solve\
    \ specific challenges, while stablecoins and tokens pave the way for new economic\
    \ and social models.\n\nWith a growing impact on sectors such as finance, gaming,\
    \ governance and logistics, these technologies continue to shape the future of\
    \ the digital economy and global decentralization.\n\nCHAPTER 9. BLOCKCHAIN ​​AND\
    \ THE ECONOMY\n\n### \n\n* * *\n\nBlockchain technology has significantly reshaped\
    \ the global economy, creating new value paradigms and altering traditional financial\
    \ dynamics. Through the introduction of digital tokens and the growing Decentralized\
    \ Finance (DeFi) ecosystem, blockchain has transcended its initial application\
    \ supporting Bitcoin, transforming into a multifunctional tool that promotes transparency,\
    \ accessibility and economic innovation.\n\n#### Creating Value Through Tokens\n\
    \nDigital tokens play a central role in creating value within the blockchain ecosystem.\
    \ Representing tangible or intangible assets, they have been used to unlock new\
    \ business models, drive financial inclusion and provide new forms of governance\
    \ and digital ownership.\n\n##### Types of Tokens\n\nTokens can be broadly classified\
    \ into two main categories: fungible and non-fungible."
