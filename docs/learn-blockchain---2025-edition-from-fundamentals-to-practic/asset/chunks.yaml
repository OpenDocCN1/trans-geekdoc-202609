    \ if record[\"product_id\"] == product_id]\n\nsupply_chain = SupplyChain()\nsupply_chain.add_record(\"\
    Product123\", \"Factory\", \"Manufactured\")\nsupply_chain.add_record(\"Product123\"\
    , \"Warehouse\", \"Stored\")\nsupply_chain.add_record(\"Product123\", \"Retailer\"\
    , \"Available\")\n\ntracking_info = supply_chain.track_product(\"Product123\"\
    )\nprint(tracking_info)\n```\n\n该代码演示了如何在供应链中记录和追踪产品的历史。\n\n### 透明度保障\n\n供应链的透明度降低了与不道德行为（如强迫劳动）和欺诈行为（如产品掺假）相关的风险。记录在区块链上的每一笔交易对所有授权方均可见，使得审计能够快速高效地进行。\n\
    \n在传统系统中，信息往往分散在不同利益相关者手中，导致数据核对困难。区块链通过为所有参与者创建单一事实来源消除了这些鸿沟。\n\n```python\n\
    class Blockchain:\n    def __init__(self):\n        self.chain = []\n\n    def\
    \ add_block(self, data):\n        self.chain.append({\"block_id\": len(self.chain)\
    \ + 1, \"data\": data})\n\n    def get_chain(self):\n        return self.chain\n\
    \nsupply_chain_blockchain = Blockchain()\nsupply_chain_blockchain.add_block({\"\
    product_id\": \"Product123\", \"status\": \"Manufactured\", \"location\": \"Factory\"\
    })\nsupply_chain_blockchain.add_block({\"product_id\": \"Product123\", \"status\"\
    : \"Stored\", \"location\": \"Warehouse\"})\nsupply_chain_blockchain.add_block({\"\
