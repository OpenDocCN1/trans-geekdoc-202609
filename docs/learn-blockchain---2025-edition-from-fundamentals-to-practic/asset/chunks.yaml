    \ the world.\n\n# Chapter 8: Cryptocurrencies Beyond Bitcoin\n\nBitcoin set the\
    \ path for the development of countless other cryptocurrencies, known as altcoins.\
    \ While Bitcoin focuses on the function of a store of value and decentralized\
    \ medium of exchange, altcoins have significantly diversified the use of blockchain\
    \ technology, bringing unique functionalities and innovative approaches. Among\
    \ these currencies, stablecoins and tokens represent prominent categories due\
    \ to their specific utility and growing popularity.\n\n## Altcoins and Their Features\n"
  trans: "\n\n# 比特币：首个区块链应用\n\n比特币被广泛认为是区块链技术的首个实用且革命性的应用。它由中本聪于 2008 年推出，其诞生奠定了去中心化数字货币系统的基础，该系统能够在没有中介的情况下运行。除了改变金融领域，比特币还引入了基本概念，这些概念持续影响着基于区块链的技术发展。\n\
    \n## 比特币如何工作\n\n比特币是一种去中心化的数字货币，允许点对点的价值转移，无需银行等中介。其运行基于一种称为区块链的分布式记录系统，所有交易都以公开且不可篡改的方式记录在其中。\n\
    \n每一枚比特币都作为分布式账本上的一条记录而存在。当用户发起一笔交易时，它会被广播到网络中，矿工在将其添加到区块链之前验证其真实性。\n\n### 挖矿与验证\n\
    \n挖矿是验证交易并向比特币区块链添加新区块的过程。矿工竞争解决涉及为下一个区块创建哈希值的复杂数学问题。最先解决问题的矿工将获得比特币奖励，这激励了网络的维护。\n\
    \n每个区块的哈希值使用 `SHA-256` 算法生成，该算法将区块数据转换为一个 64 字符的字母数字序列。哈希值的有效性取决于是否满足难度标准，该标准会定期调整以保持平均挖矿时间在\
    \ 10 分钟左右。\n\n```python\nimport hashlib\n\ndef mine_block(data, difficulty):\n\
    \    nonce = 0\n    prefix = '0' * difficulty\n    while True:\n        block_hash\
    \ = hashlib.sha256(f\"{data}{nonce}\".encode()).hexdigest()\n        if block_hash.startswith(prefix):\n\
    \            return nonce, block_hash\n        nonce += 1\n\ndata = \"Bitcoin\
    \ transaction data\"\ndifficulty = 4\nnonce, hash_result = mine_block(data, difficulty)\n\
    print(f\"Nonce: {nonce}, Hash: {hash_result}\")\n```\n\n该代码展示了矿工如何迭代一个称为 `nonce`\
    \ 的值以找到有效的哈希值。这一资源密集型过程正是确保网络安全的原因。\n\n### 交易\n\n比特币交易由输入和输出组成。输入指代先前接收的比特币，而输出指明接收方和发送金额。用户的余额基于未花费交易输出（`UTXOs`）计算，即可用于花费的金额。\n\
    \n```python\nfrom bitcoinlib.transactions import Transaction, Output, Input\n\n\
    # 配置一笔交易\ninputs = [Input(address=\"sender_address\", value=0.5)]\noutputs = [Output(address=\"\
    receiver_address\", value=0.5)]\ntransaction = Transaction(inputs=inputs, outputs=outputs)\n\
    \n# 生成交易 ID\ntransaction_id = transaction.id\nprint(f\"Transaction ID: {transaction_id}\"\
    )\n```\n\n该脚本展示了如何设置一笔基本的比特币交易，突出了主要组成部分。\n\n### 安全性与不可篡改性\n\n比特币的设计旨在防篡改。任何试图更改现有区块中交易的行为都会导致所有后续区块的哈希值失效，从而使更改对整个网络显而易见。此外，分布式共识确保无效交易被拒绝。\n\
    \n去中心化也保护比特币免受攻击。随着成千上万个节点在全球范围内运行，操纵网络需要控制超过 50% 的总算力，这在大型网络中在经济上是不可行的。\n\n##\
    \ 比特币的重要性\n\n比特币在数字经济和区块链技术的发展中发挥着核心作用。它的出现挑战了传统金融体系，促进了更大的自主权和金融普惠。\n\n### 去中心化数字货币\n\
    \n比特币为法定货币提供了一种替代方案，实现了无需中介的无国界价值转移。在银行基础设施有限的地区，它实现了安全且可及的交易，促进了金融普惠。\n\n###\
    \ 价值存储\n\n除了作为交换媒介，比特币常被比作黄金，视为一种价值存储手段。其 2100 万枚的有限供应量及其抗通胀特性，使其成为寻求抵御经济波动的投资者的吸引人选择。\n\
    \n### 技术创新\n\n比特币引入了区块链技术，此后该技术已被改造用于加密货币以外的众多应用。医疗、物流和治理等领域正利用不可篡改性和去中心化的原则来提高透明度和效率。\n\
    \n### 其他加密货币的灵感来源\n\n比特币的成功激发了数千种其他加密货币的发展，称为山寨币。许多此类币种利用相似的原则，而其他币种则通过智能合约和更高的可扩展性扩展了功能。\n\
    \n## 比特币的局限性\n\n尽管具有重要意义，比特币仍面临影响其采用和功能的挑战。\n\n### 可扩展性\n\n比特币的设计限制了每秒可处理的交易数量。网络的最大吞吐量约为每秒七笔交易，远低于\
    \ Visa 等系统每秒数千笔交易的处理能力。\n\n闪电网络等解决方案正在开发中以缓解这一问题。闪电网络通过减轻主链负载，实现了快速且廉价的链下交易。\n\
    \n```python\n# 简化的闪电网络通道示例\nclass LightningChannel:\n    def __init__(self, balance_a,\
    \ balance_b):\n        self.balance_a = balance_a\n        self.balance_b = balance_b\n\
    \n    def transfer(self, sender, receiver, amount):\n        if sender == \"A\"\
    :\n            self.balance_a -= amount\n            self.balance_b += amount\n\
    \        elif sender == \"B\":\n            self.balance_b -= amount\n       \
    \     self.balance_a += amount\n\nchannel = LightningChannel(balance_a=1.0, balance_b=1.0)\n\
    channel.transfer(sender=\"A\", receiver=\"B\", amount=0.3)\nprint(f\"Balances:\
    \ A={channel.balance_a}, B={channel.balance_b}\")\n```\n\n该代码展示了闪电网络支付通道的基本机制。\n\
    \n### 能源消耗\n\n比特币使用的工作量证明机制能耗巨大，引发了对其环境影响的批评。高能耗与对专用硬件的需求以及日益增加的挖矿难度相关。\n\n###\
    \ 相对匿名性\n\n尽管比特币提供了假名性，但所有交易都公开记录在区块链上。借助高级分析工具，可以将交易追溯到其源头，从而损害隐私。\n\n### 监管\n\
    \n世界各国政府对比特币采取了不同的监管方式，从禁止到友好监管不等。监管的不确定性可能在某些地区限制其采用。\n\n## 未来影响\n\n比特币持续演进，技术改进和监管变化塑造着它的未来。它仍然是区块链领域创新的基石，同时挑战着传统金融体系。\n\
    \n其去中心化、安全性和透明度的原则持续激发新应用，并重新定义社会与数字系统的互动方式。比特币不仅仅是一种数字货币；它是一场持续改变世界的技术革命的起点。\n\
    \n# 第 8 章：超越比特币的加密货币\n\n比特币为无数其他加密货币（称为山寨币）的发展铺平了道路。虽然比特币专注于价值存储和去中心化交换媒介的功能，但山寨币显著丰富了区块链技术的用例，带来了独特的功能和创新方法。在这些货币中，稳定币和代币因其特定的实用性和日益增长的普及度而代表了突出的类别。\n\
    \n## 山寨币及其特性\n\n"
