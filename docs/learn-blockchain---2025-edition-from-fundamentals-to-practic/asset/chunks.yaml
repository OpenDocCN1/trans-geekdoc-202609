- raw: "Fungible tokens, such as those based on Ethereum's ERC-20 standard, are interchangeable\
    \ and have the same value regardless of their origin. They are often used for\
    \ digital currencies, financial assets and rewards systems.\n\nsolidity\n\npragma\
    \ solidity ^0.8.0;\n\nimport \"@openzeppelin/contracts/token/ERC20/ERC20.sol\"\
    ;\n\ncontract MyToken is ERC20 {\n\nconstructor(uint256 initialSupply) ERC20(\"\
    MyToken\", \"MTK\") {\n\n\\_mint(msg.sender, initialSupply);\n\n}\n\n}\n\nThe\
    \ code demonstrates how to create a fungible token using the ERC-20 standard,\
    \ which is widely adopted for issuing coins and utility tokens.\n\nNon-fungible\
    \ tokens (NFTs), on the other hand, are unique and represent digital property.\
    \ They're ideal for assets like art, game items, and digital certificates.\n\n\
    solidity\n\npragma solidity ^0.8.0;\n\nimport \"@openzeppelin/contracts/token/ERC721/ERC721.sol\"\
    ;\n\ncontract MyNFT is ERC721 {\n\nconstructor() ERC721(\"MyNFT\", \"MNFT\") {}\n\
    \nfunction mint(address to, uint256 tokenId) public {\n\n\\_mint(to, tokenId);\n\
    \n}\n\n}\n\nThis code creates an NFT using the ERC-721 standard, allowing digital\
    \ items to be registered as unique on the blockchain.\n\n##### Tokens as Economic\
    \ Instruments\n\nTokens are used to represent participation in projects, rewards\
    \ for contributions or voting rights in decentralized organizations. On blockchain-based\
    \ crowdfunding platforms such as the Initial Coin Offering (ICO) or the more recent\
    \ Security Token Offering (STO), tokens allow startups to raise capital efficiently.\n\
    \nUtility tokens provide access to specific services or products within a blockchain\
    \ ecosystem, while governance tokens empower holders to influence important decisions\
    \ about the future of a project.\n\n##### Creating Social Value\n\nIn addition\
    \ to their economic application, tokens have driven social change, promoting transparency\
    \ in supply chains, traceability of donations and creating markets for artists\
    \ and content creators.\n\n#### DeFi (Decentralized Finance) and Its Impacts\n\
    \nDecentralized Finance (DeFi) represents a transformative application of blockchain,\
    \ allowing individuals to carry out financial transactions without intermediaries.\
    \ Using smart contracts, DeFi eliminates the need for banks and other institutions,\
    \ offering services such as lending, trading, insurance, and more.\n\n##### Fundamental\
    \ Principles\n\nDeFi is built on three main principles: accessibility, transparency\
    \ and automation.\n\n●       Accessibility: Anyone with an internet connection\
    \ can participate in DeFi platforms, regardless of location or financial background.\n\
    \n●       Transparency: All transactions are recorded on the blockchain, ensuring\
    \ traceability and reducing the risk of corruption.\n\n●       Automation: Smart\
    \ contracts replace traditional intermediaries, reducing costs and speeding up\
    \ processes.\n\n##### Examples of DeFi Applications\n\nLoans and Secured Loans\n\
    \nPlatforms like Aave and Compound allow users to lend or borrow without the need\
    \ for a bank. Borrowers provide collateral in cryptocurrencies, while lenders\
    \ earn interest.  \n\nsolidity  \n\npragma solidity ^0.8.0;\n\ncontract LendingContract\
    \ {\n\nmapping(address => uint) public balances;\n\nmapping(address => uint) public\
    \ borrowed;\n\nfunction deposit() public payable {\n\nbalances\\[msg.sender\\\
    ] += msg.value;\n\n}\n\nfunction borrow(uint amount) public {\n\nrequire(balances\\\
    [msg.sender\\] >= amount, \"Insufficient collateral\");\n\nborrowed\\[msg.sender\\\
    ] += amount;\n\npayable(msg.sender).transfer(amount);\n\n}\n\n}\n\nThis master\
    \ agreement illustrates how to create a secured loan system.\n\nDecentralized\
    \ Exchanges (DEX)\n\nExchanges like Uniswap allow users to exchange cryptocurrencies\
    \ directly with each other. Using liquidity pools, DEXs eliminate the need for\
    \ a centralized intermediary.  \n\nsolidity  \n\npragma solidity ^0.8.0;\n\ncontract\
    \ SimpleDEX {\n\nmapping(address => uint) public liquidity;\n\nfunction addLiquidity(uint\
    \ amount) public payable {\n\nrequire(msg.value == amount, \"Mismatch in ETH sent\"\
    );\n\nliquidity\\[msg.sender\\] += amount;\n\n}\n\nfunction swap() public payable\
    \ {\n\n// Simplified implementation for token exchange\n\n}\n\n}\n\nDecentralized\
    \ Insurance\n\nBlockchain-based insurance automates claims and eliminates fraud.\
    \ Smart contracts check for triggering events and automatically process payments.\n\
    \nStablecoins and Payments\n\nStablecoins like DAI and USDC are widely used in\
    \ DeFi for payments and as a stable medium of exchange.\n\n##### Benefits of DeFi\n\
    \n●       Elimination of Intermediaries: Reduces costs and increases efficiency.\n\
    \n●       Financial Inclusion: Democratizes access to financial services.\n\n\
    ●       Transparency: Minimizes the risk of corruption and fraud.\n\n##### DeFi\
    \ Challenges\n\n●       Scalability: Blockchain infrastructure can face congestion.\n\
    \n●       Security: Poorly designed smart contracts can be exploited by hackers.\n\
    \n●       Regulation: Regulatory uncertainty creates barriers to large-scale adoption.\n\
    \n#### Economic Impact and Future\n\nThe combination of tokens and DeFi is reshaping\
    \ the global economy. As the blockchain ecosystem continues to grow, new applications\
    \ and innovations will continue to emerge, promoting greater efficiency and accessibility\
    \ across industries.\n\nThe creation of value through tokens and the impact of\
    \ Decentralized Finance demonstrate how blockchain is transforming the economy,\
    \ making it more inclusive and innovative. This movement continues to redefine\
    \ the role of traditional institutions and create new opportunities for individuals\
    \ and companies.\n\nCHAPTER 10. SCALABILITY ON BLOCKCHAIN\n\n### \n\n* * *\n\n\
    Scalability is one of the main challenges facing blockchain networks as their\
    \ adoption grows across the world. While the technology offers significant benefits\
    \ in terms of decentralization, security and transparency, its limitations in\
    \ the ability to process large volumes of transactions quickly have raised concerns\
    \ about its viability for large-scale use cases.\n\nSolutions to scalability problems\
    \ seek to balance performance with the fundamental principles of blockchain. Among\
    \ the most relevant approaches are the Lightning Network, a second-layer solution,\
    \ and sharding, which alters the underlying structure of the blockchain to improve\
    \ efficiency.\n\n#### Scalability Issues\n\nTraditional blockchain faces scalability\
    \ issues due to its architecture. On public networks like Bitcoin and Ethereum,\
    \ all nodes on the network must process, validate and store each transaction.\
    \ This ensures security and decentralization, but also limits the number of transactions\
    \ that can be processed per second.\n\n##### Low Transaction Rate\n\nBitcoin processes\
    \ an average of 7 transactions per second (TPS), while Ethereum processes around\
    \ 15 to 20 TPS. These fees are insufficient to compete with traditional systems\
    \ like Visa, which can process thousands of TPS.\n\n##### Network Congestion\n\
    \nIncreased transaction volume can cause congestion, resulting in longer wait\
    \ times and higher transaction fees. This issue is evident during periods of high\
    \ demand, such as during token launches or spikes in interest in NFTs.\n\n#####\
    \ Energy and Resource Costs\n\nConsensus based on Proof of Work (PoW) requires\
    \ high levels of computing power, increasing energy costs and hindering environmental\
    \ sustainability.\n\n#### Solutions for Scalability\n\nSeveral solutions have\
    \ been proposed and implemented to overcome these challenges, covering approaches\
    \ at higher layers and in the blockchain architecture itself.\n\n##### Lightning\
    \ Network\n\nThe Lightning Network is a second-layer solution designed to improve\
    \ Bitcoin's scalability. It allows users to create payment channels outside of\
    \ the main blockchain, where transactions can occur instantly and with minimal\
    \ fees.\n\nChannels are established with a smart contract, which holds both parties'\
    \ funds in a multi-signature address. Transactions are recorded on these channels\
    \ and once completed, the final state is transmitted to the main blockchain.\n\
    \npython\n\nclass LightningChannel:\n\ndef \\_\\_init\\_\\_(self, balance\\_a,\
    \ balance\\_b):\n\nself.balance\\_a = balance\\_a\n\nself.balance\\_b = balance\\\
    _b"
