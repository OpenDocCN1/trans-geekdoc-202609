  trans: "\n\n# 区块链编程基础\n\n## 智能合约示例：产品管理\n\n```solidity\nmapping(uint256 => Product)\
    \ public products;\n\nfunction addProduct(uint256 id, string memory name, uint256\
    \ price) public {\n    products[id] = Product(name, price, msg.sender);\n}\n\n\
