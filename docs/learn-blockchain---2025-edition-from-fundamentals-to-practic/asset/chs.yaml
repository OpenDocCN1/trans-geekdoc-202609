  \ amount) public {\n        require(balances[msg.sender] >= amount, \"Insufficient\
  \ collateral\");\n        borrowed[msg.sender] += amount;\n        payable(msg.sender).transfer(amount);\n\
  \    }\n}\n```\n\n该主协议展示了如何创建抵押贷款系统。\n\n##### 去中心化交易所 (DEX)\n\nUniswap 等交易所允许用户直接相互交换加密货币。通过流动性池，DEX\
