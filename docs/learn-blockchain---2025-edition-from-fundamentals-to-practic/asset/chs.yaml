  \n**第 3 章：去中心化与共识**\n\n我们分析了中心化与去中心化系统的区别，并考察了 `Proof of Work (PoW)`、`Proof of Stake\
  \ (PoS)` 和 `Delegated Proof of Stake (DPoS)` 等共识算法，解释了它们如何确保网络安全。\n\n**第 4 章：智能合约**\n\
