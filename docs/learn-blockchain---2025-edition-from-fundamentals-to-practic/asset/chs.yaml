  \ 180 多部著作，涵盖六种语言。\n\n## 本书导读\n\n欢迎来到 **《学习区块链：从基础到实战应用》**！\n\n很高兴能与你共同踏上这段学习之旅。如果你正在阅读这篇导读，你大概率已经注意到了区块链对数字化转型的影响，以及它在一个日益互联的世界中的相关性。本书旨在作为一本综合指南，提供一条从基础核心到高级实战应用的清晰路径。\n\
