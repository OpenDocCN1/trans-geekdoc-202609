    LAN 指的是在房屋或办公室等狭小空间内连接的各种 PC。局域网主要用于通过同轴链路和双绞线对等通信基站将至少两台 PC 连接起来。LAN 的成本较低，因为它是使用价格合理的设备构建的，包括以太网链路和作为中心点的网络连接器。在
    LAN 中信息传输的速度比某些其他网络更快。局域网提供了更安全的组织选择。


    ## 个人局域网 (PAN)


    这是一种围绕个人设计的网络，更具体地说，范围在十米以内。它主要用于连接大多数仅供个人使用的电脑设备。研究人员托马斯·齐尔曼（Thomas Zimmerman）首次提出了个人局域网的概念。这种网络可以覆盖多达
    30 英尺的空间。你可以利用电脑来构建这种网络。此类设备包括手机、工作站、工作区、游戏机和媒体播放器。如今，个人局域网分为两类：有线个人局域网和无线个人局域网。后者通过蓝牙和
    Wi-Fi 等无线技术实现，这通常是一种短距离网络。而有线网络则通过 USB 链路进行工作。


    ## PAN 示例


    体域网：这是一种随个人移动的网络。例如，手携设备设备随人移动。假设一个拥有手机的人建立了一个连接，并允许不同的设备接入以共享数据和连接。


    离线网络：这种网络可以在家里直接构建。它通常用于接口和连接各种设备，特别是电脑、打印机和收音机。尽管如此，你需要注意这些设备并未连接互联网。小型家庭办公室（SOHO）：这种网络主要用于将各种组件连接到网络连接，并通过
    `VPN` 建立协调连接。


    ## 城域网 (MAN)


    MAN 是一种通过通过连接其他类型的局域网来形成更大的网络，从而覆盖巨大地理区域的网络。城域网基本上用于政府机构和私营企业以连接居民。在这种网络中，有几个区域是通过电话线连接的。城域网中常用的协议包括
    `ATM`、`Frame Relay`、`ADSL` 等。与局域网相比，MAN 范围更广，覆盖范围更远。


    ## MAN 的用途


    它用于建立城市内银行等金融机构之间的通信。MAN 可以应用于运营商的预订。此外，城域网也用于位于城市内的教育机构。它还用于军事领域通信模块的生产。


    ## 广域网 (WAN)


    WAN 是一种覆盖极大地理区域（如国家或州）的网络。与局域网相比，WAN 规模巨大。它并不限于单一区域，而是可以通过光纤链路或卫星连接分布在广大的区域内。对你来说，互联网可能是最好的
    WAN 类型。广域网被广泛应用于教育、商业和政府领域。


    ## WAN 示例


    移动宽带：在这种网络中，`4G` 网络在全国范围内被广泛使用。最后一公里互联网：这是一种媒体传输网络通过将家庭连接到光纤网络，为不同地区的客户提供互联网服务的情况。私有网络：银行提供一组可以连接多达
    44 个工作场所的私有网络。该私有网络主要利用电信公司提供的电话线构建。


