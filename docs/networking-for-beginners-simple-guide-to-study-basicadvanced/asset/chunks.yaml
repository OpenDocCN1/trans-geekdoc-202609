    广域网与局域网相比，广域网的范围非常令人震惊。`WAN` 计算机网络有效地与位于偏远区域的计算机建立关联。低电压设备和计算机一样，在彼此之间建立远距离关联。它们通过一个单一巨大的网络来实现这一点，允许更远距离的通信。`WAN`
    计算机网络有多种分类，其中 `Internet` 是最重要的类型。`Internet` 考虑了全球范围内所有计算机的连接。各种公共和组织实体通常拥有 `WAN`
    计算机网络。这由于其更广泛的范围而成为可能。


    ### 存储区域网络 (SAN)

    SAN 计算机网络速度快且本质是专用的。它们在共享存储设备和不同的工作站之间建立连接。`SAN` 网络不依赖于 `WAN` 和 `LAN`。计算机网络通常将存储设备从计算机网络中移除，并将其放在专门的骨干网络中。这些计算机网络对于附加到工作站的驱动器是开放的。存储区域网络包括集成
    `SANs` 和联合虚拟 `SANs`。


    ### 系统局域网

    这种计算机网络非常新，也被缩写为 `SANs`。这种计算机网络主要用于描述相对附近的局域网。这些网络设计用于包括工作站、处理器以及存储区域网络在内的应用程序的快速连接。计算机通过这种类型的网络作为单一系统运行，并提供极快的速度。


    ### 无源化光接入局域网 (POLAN)

    `POLAN` 计算机网络被用于替代基于交换机的以太网 `LAN`。`POLAN` 计算机网络中技术被添加到结构化布线中。这种组合的目的是解决传统网络应用和以太网协议引起的问题。`POLAN`
    使用光分路器来提高从单根光纤中分离光信号的效率。单模光纤被转换为服务设备和客户的各种信号。


    ### 企业私有网络 (EPN)

    企业私有网络由创建它们的组织拥有。组织倾向于使用这种计算机网络作为获取共享该组织的不同区域之间连接的方法。


    ### 虚拟私有网络 (VPN)

    利用虚拟私有网络使得 `Internet` 上任何私有网络的扩展成为可能。`VPN` 计算机网络使得关联设备之间发送和接收数据信息成为可能。当客户端使用没有直接连接的设备时，这种交互也是可能的。通过被称为接入点的连接，对远程私有网络的访问也变得可能。计算机网络计算机网络的基本元素包括在各个节点之间建立连接的系统。这些连接帮助它们共享资源和数据。计算机网络组件是计算机网络中使用的核心元素。基本上，计算机网络有四大组件。它们包括计算机、传输介质、协议和网络程序。为了计算机网络有效运行，每个组件都需要协调工作。


    ### 计算机

    计算机是先进设备，可以接受各种类型的信息输入，使用数据结构和预定义算法进行处理，并执行任务作为输出。这种交互可以描述为将原始信息转换为有用数据。输出包括执行一些实际任务，如存储数据、在需要时更改或恢复数据。计算机建立网络是通过使用分布式软件模型和交换信息来实现。


    ### 传输介质

    传输介质是客户端将信息从一个地方发送到另一个地方的方式。在处理信息时，计算机和电信设备使用信号。从一个设备到下一个设备的信号传输主要通过电磁能。它们通过空气、真空和各种模式从发送者传输到接收者。传输介质有两种。引导或有线传输介质包括光纤链路、双绞线链路和同轴链路。非引导或无线传输介质包括红外线、无线电和微波。


    ### 协议

    协议是控制计算机网络设备之间通信的特征化显示和规则。计算机网络协议包括用于识别和彼此之间建立连接的设备工具。协议规则用于确定作为获取和发送消息的信息封装策略。协议有三种类型。互联网协议、远程网络协议和网络路由协议。互联网协议是用于通过
    `Internet` 或另一个网络发送信息配置的规则。它们是用于 `Internet` 上地址和路由信息的规范。互联网协议根据数据包头部的位置将数据包从主机传输到目标主机。


