    这是一种引入在任何 `OSI` 模型会话层的防火墙。它们被用于筛选会话和连接，例如通过 `TCP` 多路复用握手来判断所提连接是否真实。在电路级网关防火墙中，大量且关键的筛选发生在连接发送之前。指向组织另一侧
    PC 设备的数据希望来自一个网关。该元素在为内部组织建立防止外部入侵的隐私保护性方面起着至关重要的作用。


