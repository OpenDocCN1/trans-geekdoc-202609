    # 资源共享


    PC 网络的基本目标是确保业务的任何内容对每一位参与者都是可的。PC 网络通过让任何使用该组织的个人都能访问所有设备、信息和项目来实现这一目标。任何客户端都可以访问
    PC 网络，而无需考虑其实际的地理位置。


    # 服务器-客户端模型


    在一种特定的模型中，业务数据存储在服务器上，服务器是性能强大的计算机。服务器位于中间，并由一个框架头部进行管理。业务员工通常拥有客户端，即他们办公区域内的简单设备。服务器-客户端模型考虑让这些代表能够更方便地访问远程信息和数据。


    # 通信介质


    业务环境中的员工需要不断就影响业务运行的不同问题进行交流。因此，PC 网络为代表之间的通信提供了一种极佳机制。几乎所有公司都有几台登录了消息的电脑。员工在日常通信计划中会使用这些电脑。公司可以发送特定内容，所有参与业务活动的人都能收收到。


    # 电子商务


    每家业务核心关注的可能是通过互联网与潜在客户进行互动。在现代世界，大多数客户倾向于在家购物。音乐销售商、书店和食品店等各类实体已经在考虑使用 PC 网络来解决他们客户的问题。


    # 多数据源的高可靠性


    PC 网络通过提供多种信息源提供了更高的可靠性。这意味着所有记录都可以复制到多台机器上。当其中一台机器不可用时，可以使用另一台来获取相同的数据。可靠性的概念在银行、军事、核反应堆安全和军事领域至关重要。这是因为这些领域在硬件和软件故障时都需要可靠的运行。


    # 节点


    从某些组织和机构的经济角度来看，PC 组织是一个重要的概念。因为它可以节省大量的资金。PC 网络提供了使用电脑而非昂贵的集中式服务器电脑的选择。通过系统管理所有电脑在一起，组织可以充分利用分布式模型。组织中的每个人都可以为了某些目的（如通信）访问组织。PC
    网络提供的区域模型有助于为组织的活动提供安全性。与组织相关的客户可以通过服务器获取信息并与组织交流。


    # 计算机网络：


    家庭应用 家庭客户还出于其他原因考虑使用 PC 网络。其中一些包括：

    - **访问远程数据**：人们连接设备以便更方便地访问宝贵数据。**个人对个人通信**：这种通信包括发送消息或其他类型的通信。远程客户可以轻松地与其他人交流。他们可以无延迟地看到和听到远离他们的人的声音。视频会议可能是最著名的个人对个人通信，用于远程学校，或从远处的专家那里获得医疗建议。人们还考虑使用
    PC 网络轻松地访问由全球新闻组发布的数据。通过这些网络，人们可以有效地发表自己的意见，而无需考虑其实际地理位置。

    - **智能娱乐**：计算机网络考虑了更方便地访问点播节目、多人互动游戏以及人们对直播电视节目（如对话、测试等）的兴趣。正是通过这些网络，人们可以在家中心感受到乐趣。人们还使用
    PC 网络轻松地访问由全球新闻组发布的数据。以下是 PC 组织的一些基本类型。


    ## 个人区域网 (PAN)


    个人区域网是最基本、最小种类的计算机网络。它包含计算机、电话、平板电脑、打印机和一个远程调制解调器。它围绕建筑内的单个个人旋转。这些网络通常用于家庭和小型工作场所。其管理受限于一个连接或个人的一个设备。


    ## 局域网 (LAN)


    局域网是当今世界上研究广泛的网络。它们可能是最独特、最简单且最常见的计算机网络类型。它们用于连接几台低电压电脑和设备。这些设备通常在短距离内，例如一个建筑内的多个房间或几座相邻的建筑。它们有助于在关联设备之间共享资源和数据。局域网
    PC 通常由企业使用。它们非常经济且可行。


    ## 无线局域网 (WLAN)


    WLAN 网络的工作方式与 LAN 网络类似。这些网络使用无线连接技术。其中一些包括 `Wi-Fi`。WLAN 网络在连接时，并不要求设备具有实际连接。


    ## 校园区域网


    校园区域网比局域网大得多，但比广域网小。校园区域网通常用于独立的企业、学院、大学和大型校园区域。校园区域网分布在相互靠近的多个建筑中。它们允许不同建筑中的任何客户进行连接并提供资源。


    ## 市域网


