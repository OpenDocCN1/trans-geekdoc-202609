  trans: "\n\n它是 PC 中智能智能部分。当你需要在 PC 中进行数值或逻辑选择时，数据由 `ALU` 完成。`ALU` 以位为单位对数据进行处理。位由成对的逻辑\
    \ 0 和 1 组成。它们由 CPU 中被称为 `寄存器` 的存储单元组成，寄存器用于存储信息，而信息现在被分配给成对数据。它们的处理方式与指令类似。\n\n\
    ### CU（控制单元）\n它是 PC 中 CPU 的一部分，负责管理处理器的活动。它向 PC 内存、输出、信息设备以及 `ALU` 提供如何以最有效的方法响应数据集的指令，并且本身不处理任何信息。\n\
    \n### 内存（Memory）\n内存是 PC 的一部分，用于存储工作所需的信息和数据。内存有两种类型：\n\n*   **Ram** – 随机存取存储器是\
    \ CPU 的内部内存，负责存储信息、程序和应用程序的结果。当 PC 工作时，内存会被读取和写入，随后不易失性地存储信息。当机器关闭时，信息将会丢失或删除。RAM\
    \ 的示例是 `动态随机存取存储器 (DRAM)` —— 它是 PC 中使用的实际内存。这种内存必须不断刷新，否则它就会丢失内容，它是易失性的。`静态随机存取存储器\
    \ (SRAM)` —— 这种内存比 DRAM 更快且更不容易易失；因此需要更多的功率且更昂贵，不需要刷新。`协调动态随机存取存储器`这种内存具有更高的处理速度。\n\
    *   **只读存储器 (ROM)** – 这种内存只能读取，不能写入。这种内存是非易失的。存储在该内存中的数据是持久的，内存存储了启动 PC 或引导所需的指令。ROM\
    \ 有许多类型。型号包括 `MROM (掩膜 ROM)`、`可编程只读存储器`、`可擦除可编程只读存储器`和 `EPROM`。\n\n### 外设（Peripherals）\n\
    这些是与 PC 关联的设备，当这些设备与 PC 断开时它们仍然工作，但外围执行的功能将无法使用。外设示例包括：\n\n*   **显示器（Monitor）**\n\
    \    屏幕是一个视觉显示单元，是 PC 的主要输出设备。它们将图像显示为被称为像素的小点，像素在 PC 中以矩形结构组织，以优化图像。图像的大小将取决于使用的像素数量。\n\
    *   **键盘（Keyboard）**\n    它是一种辅助向 PC 输入信息的设备。它由按键组成，负责向 PC 输入字母表、数字和特殊字符。它们还可以通过控制台进行导航，以在\
    \ PC 中执行特定的快捷路径。\n*   **鼠标（Mouse）**\n    它是一个利用光标的指针设备。这种控制设备底部带有一个带有衬垫球的小盒子，它记录了鼠标的移动并将信息传递给\
    \ CPU 进行处理。\n*   **打印机（Printer）**\n    它是一种用于将测量信息打印在纸上的输出设备。打印机的示例有：`针式打印机` ——\
    \ 它们通过击打丝带打印信息，丝带通常推在纸上进行打印。`非针式打印机` —— 这种打印机不使用丝带打印字符。它们一次打印整页纸。它们是激光打印机、胶打印机或喷墨打印机。\n\
    *   **摇杆（Joy Stick）**\n    这种外设可以将光标移动到屏幕上的某个位置，用于 `计算机辅助设计 (CAD)`。\n*   **扫描仪（Scanner）**\n\
    \    该设备允许用户扫描打印纸张并将其转换为 PC 设备中使用的文档。\n\n### 无线与 LTE\n这些是将电信号转换为无线波的设备；它们利用 `Wi-Fi`\
    \ 连接有线网络。它们是三种主要的无线设备，分别是 `WAN`、`PAN` 和 `LAN`。`无线广域网`由手机信号创建。它们由移动网络运营商制作和维护。`无线局域网`使用无线电波，但这些网络的基础是通过连接到无线网关的链路支持的。这种无线网络可以在空间内、整个校园或医院中使用。`无线个人局域网\
    \ (WPAN)` 是一种短距离网络。它们使用 `蓝牙` 技术，通常连接到中心区域附近的可用设备。`WPAN` 的范围大约为三十英尺。网络使用的设备从电脑、平板电脑、电话和工作站等，并统称为终端。当通过感兴趣区域或使用办公室或家中的`路由器`访问网络时，该设备被称为终端。某些`路由器`可以作为终端工作；这可以在\
    \ PC 中有一张卡并与其他接口或与更多离线 `App` 连接时发生。`App` 可以是跨越无线设备与以太网或路由器的独立设备。`App` 可以利用基于 PC\
    \ 功率和设备使用的接收器通过无线网络覆盖广泛的区域。一些手机、工作站或无线路由器支持一种名为 `Ad-Hoc` 的模式，该模式允许设备直接关联，而无需控制连接的路由器。并不是所有的电脑都具有\
    \ `Ad-Hoc`，有些是被隐藏的。启用 Ad-Hoc 的设备可以创建网络网格，当它们被启用时被称为 `网格节点`。连接距离区域像两个建筑一样的无线网络需要更活跃的接收器，例如`距离无线线`。\n\
    \nLTE（长期终端演进）\n这是一个通常用作 `4G` 的术语，是无线标准。4G 移动允许在手机上浏览网页，速度比 `3G` 网络快数倍。\n\n"
