    Control Lists`）所表征的标准。数据包过滤防火墙的工作原理是通过检查给定的数据包的整个设置，并将其与执行人员通过 `ACL` 提供的规则设置进行比对来确认。在数据包不符合管理员表征的规则设置的情况下，该数据包会被快速丢弃，并根据需要进行记录和更新日志。在使用数据包过滤防火墙时，管理员能够根据约定、地址和数据包特征来构建其
    `ACL`。


    ### 数据包过滤防火墙的优点

    - 数据包过滤防火墙的关键优势之一是它们是真正的轻量级。

    - 数据包过滤防火墙还需要较低的资源利用，使其更具成本效益。

