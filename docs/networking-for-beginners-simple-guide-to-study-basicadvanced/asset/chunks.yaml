    客户端-服务器网络依赖于一个主导服务器。该服务器被赋予了一项特殊任务。例如，它很可能是一个控制服务器或 Web 服务器。客户端需要与服务器接口以利用某些服务。这种系统管理的典型示例就是
    Web 网络。


    ### 优点

    - 客户端-服务器网络没有中心化的负担。

    - 它有一个极其专注的枢纽，使得数据定位变得异常简单。

    - 客户端-服务器具有卓越的安全级别。

    - 该网络易于维护。


    ### 缺点

    - 服务器可能会出现故障。当它们失效时，整个组织都会受到威胁。这些单点故障会极大地破坏整个组织。

    - 客户端-服务器设备并不廉价。它需要巨大的投资，这对于家庭和小型办公者来说可能负担不起。

    - 这种组织最终可能会变得混乱。这可能导致组织内部的一些效率下降。

    - 客户端-服务器网络的最佳实例包括 Twitter、Facebook 和 `Google Search`。


    ## 计算机网络分类

    计算机网络分为不同的分类。这些分组取决于地理区域、使用设备之间的连接以及访问类型。


    ### 基于地理位置的分类

    - **LAN-局域网**：它连接一个办公室或几个工作场所内的设备。`Ethernet` 和 `Token Ring` 属于此类分类。

    - **MAN-城域网**：它是一个稍大的网络，能够跨建筑连接设备。

    - **WAN-广域网**：这是一个巨大的网络，连接跨越国家的各种设备。WAN 组织的真实示例包括 `Asynchronous Transfer Mode`
    和 `Integrated Services Digital Network`。

    - **PAN-个人局域网**：该组织用于个人区域内的设备连接。它是你用于将 `PC` 连接到打印机时使用的网络类型。


    ## 网络层与协议

    协议是一套预先定义的规则 set，指导计算机之间应该如何相互通信。`HTTP` 是著名的协议之一，你可能在与计算机交互时遇到它。该协议维持特定网络浏览器与其服务器之间的通信。真实的信息连接协议示例包括
    `Wi-Fi` 和 `Ethernet`。这些协议规定了信息在介质上呈现的形式。两者都使用一个被称为 `MAC` 地址的物理地址。它有 48 位限制。其他常见的
    MAC 地址包括具有 64 位的 `EUI 64`。


    系统管理可以分为不同的层或级别。有一个使用七层模型的 `OSI` 网络。此外，还有一个常见的 `TCP/IP` 组织，它使用四层模型。以下是 `TCP/IP`
    组织的四个及其各自的模型：


    - 数据链路层- `Ethernet` 或 `Wi-Fi`。

    - 传输层- `UDP` 或 `TCP`。

    - 网络层-`IP`

    - 应用层-`HTTP`


