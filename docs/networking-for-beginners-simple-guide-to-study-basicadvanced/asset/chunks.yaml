    这些是大多数业务组织的基础前提。正如我们大多数人所知，`switch`（交换机）就像一个连接 PC 组织内部打印机、`PCs` 和工作人员的调节器。它们让组织内部的设备能够在它们内部建立通信，并构建通常共享的资产。`Switches`
    通过资产划分和共享节省了大量资金。它们同样提高了效率。PC 网络中通常有两种类型的交换机：管理式交换机和非管理式交换机。`unmanaged` 类型的交换机可以即插即用，无需配置。家庭网络设备设置明确提供
    `unmanaged switches`。而，`managed switch`（管理式交换机）是可以配置的。它赋予了你更改和监控网络流量进展的能力。因此，它让你对整个系统管理测量具有更多的控制权。


    ### Routers


    这些是负责连接不同组织网络的基础部分。它们还被委托将办公组织内的 `PCs` 连接到工作互联网。它们使得网络中的每个设备或 `PCs` 都能共享一个互联网连接，从长远来看，这节省了资金。`Switches`
    充当调度员。它们检查通过特定网络发送的信息，跟踪信息传输的最快路径，并按该路径发送。它们可以将你的业务连接到世界其他部分，确保关键数据不受危险，并对哪些 `PCs`
    有权获得比其他更多的关注做出决定。除了已知的系统管理功能外，`switches` 还配备了一系列功能，使管理测量变得更加简单和安全。根据你的需求，例如，你可以购买带有虚拟私有网络（通常称为
    `VPN`）、防火墙或 `Internet Protocol`（通常称为 `IP`）的 `switch`。


    ### The Access Points


    这是 PC 另一个基础部分，允许设备在不使用链路的情况下连接到网络（远程组织）。远程网络使得在在线组织上欢迎新设备更容易，并为远程办公人员提供灵活的帮助。它们充当你
