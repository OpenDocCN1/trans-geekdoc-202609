    计算机网络将网络编程作为所有组织构建的基础组件。组织编程帮助管理人员对任何组织进行传输、监控和观察。各种传统组织由独特的设备组成，包括在混合中包含系统管理编程的交换机和路由器。系统管理编程涵盖了在规划、执行、运行和观察计算机组织方面的广泛编程。大多数传统的计算机网络依赖于嵌入在产品中的硬件。特征化网络（Characterized
    Networking）作为一种软件出现并推动了软件与硬件的分离。这种分离使得组织编程对于不断发展的计算机网络理念变得更加灵活。


    ## 选择合适的计算机网络


    在为组织选择计算机网络类型时，有一些应当考虑的因素。这些元素包括：


    - **组织**：应当考虑组织运营的经济区域、组织提供的内容、组织中使用的人数，以及他们所从事的职位。

    - **现有系统**：对于当前的计算机网络分段、组织运行的工作框架、网络工程、传输介质和地理位置至关重要。

    - **用户数量**：在为组织选择计算机网络之前，关注用户数量至关重要。因为组织通常会有处理独立及共享工作站的客户。

    - **实用性**：考虑组织客户尝试的任务以及在完成任务时使用的软件应用程序。

    - **预算**：考虑选择一个预算范围内的计算机网络管理员。这有助于确保组织的成功执行和支持。


    ## 第三章：计算机网络学习简易指南


    本文讨论了计算机网络的基本组成部分以及你可以学习它们的简单方法。它还广泛地讨论了计算机网络的高级特性，以及你可以如何学习和应用它们。继续阅读以发现！


    计算机网络已经存在很久了，随着时间的推移，技术变得更快、更智能。这些组织是不同设备和部分的发展，包括计算机、交换机和路由器，它们通过远程信号或链路连接。了解这些组织和关联是如何构建的，对于创建一个用于某些用途的组织至关重要。在分解这个复杂主题的途中，让我们从检查任何计算机组织的基本部分开始。


    ## 计算机网络的重要组件


    这是你学习计算机网络时需要看到的核心。任何计算机网络都由四个部分组成：`介质`、`网络设备`、设备协议`和`终端设备`。让我们讨论每一个基本部分。


    ### 终端设备


    是一种在特定组织内发送或接收一组信息或数据的设备。终端设备可以是工作站、手机、电脑或任何具有在关联网络内接受或发送信息配置能力的机器。对于你的数据，你至少需要两个设备来组成一个组织。终端设备有两种：客户端终端设备和工作端终端设备。工作端终端设备负责提供支持或信息。而客户端终端设备负责接收从上一个（工作端终端设备）提供的信息。


    ### 介质


    这是计算机网络的一个重要部分，为终端设备提供可用性和连接。除非通过任何类型的介质连接，否则终端设备无法交换服务或信息。今天，主要存在两种分类或类型的介质：有线介质和无线介质。在使用无线介质时，无线信号基本上用于在终端设备之间移动信息和数据。在有线介质中，链路被考虑了所有因素。上述介质还根据数据传输速度、长度、频带等因素分为不同的子类型。这些子类型通常被称为介质标准。主流且通用的介质标准是
    `IEEE802.11`（也称为 Wi-Fi 标准）和 `以太网`。这两种介质标准假设不同的基本部分。`以太网`负责定义有线介质的规则，而 `IEEE802.11`
    则在定义远程介质规则中发挥作用。


    ### 协议


    实际上，与前两个一样，这是计算机网络的一个重要部分。协议负责复杂的终端设备之间的通信；它们至少有两个。协议的特征由一组决策定义，这些决策规定了通信的特定或每个阶段的规范和指示。以下是协议所执行的一些实现功能：


    - 开始和结束通信过程。

    - 在传输任何数据之前进行加密和压缩。

    - 将数据封装成可以在网络内传输的格式。

    - 建立并提供逻辑寻址地址。

    - 执行错误纠正过程。

    - 执行介质认证。


    两种主流的系统管理模型描述了最基本协议的功能：`TCP/IP` 模型和 `OSI` 参考模型。这些模型将整个通信周期划分为合理的层。它们进一步阐明了每个协议在每一层中如何工作，从而使通信周期化。


    ### 网络设备


    这是计算机网络的基础部分，工作在终端设备之间。它负责控制信息的平稳传输。根据其功能，网络设备被分为三种不同的类型：发送设备、接口设备和最终的接收设备。下面，我们检查每个一个所提设备的功能。


    - **连接设备**：它负责关联至少两种协议和介质。在两个终端设备被安排在不同的拓扑结构中或使用特定类型介质连接的情况下，它们需要一个接口轴来完成信息交换。这种功能可以通过`多层`和
    `路由器交换` 提供。

    - **安全设备**：该设备负责从任何未经授权的访问获取信息。接收设备根据预定义的规则在获取任何数据包时进行安全检查。然后根据所做的选择将其推进或拒绝它。执行这些功能的常用设备部分是
    `NAT` 和 `防火墙`。

    - **转发设备**：这是一个负责发送信息的设备。它有许多区域和端口，主要用于在单一组织内连接至少两个终端设备。这些功能的两种通用设备是 `集线器`、`以太网`和`网桥交换机`。


