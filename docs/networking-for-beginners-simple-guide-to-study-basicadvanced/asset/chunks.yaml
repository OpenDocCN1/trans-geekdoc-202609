    # 引言


    恭喜下载《初学者网络教程》（Networking for Beginners），感谢你的支持。世界正在变得计算机化，每个人都需要关注不断出现的新技术。无论如何，你不能在不理解基础知识的情况下就引入一项创新。这意味着，在深入研究复杂的练习（例如
    PC 编程等）之前，你首先需要熟悉各种电脑组件的标准。


    接下来的章节将介绍初入该领域的人员在注册场景中进行系统管理时需要考虑的所有内容。有些人可能对系统管理只有有限的知识，但通过本指南，你很快就会成为这方面的专家。随后，你将了解到系统管理中使用的各种协议，如互联和互联网等。系统管理中包含关键概念，并且可能还包括与计算机组织相关的不同活动。总而言之，你将了解计算机组网，并看到先进的媒体传输网络是如何通过机器之间的资源共享来工作的。


    系统管理是计算机研究的一个重要领域，它考虑让计算机在全球范围内互联。同样，你将了解到 `AI` 作为一种计算和可测量技术，即机器如何获得执行给定任务的能力。`AI`
    是一个广泛的主题，但对初学者来说至关重要，特别是当他们需要了解计算机如何像人类一样在特定情况下做出决定时。市场上有很多关于这个主题的书，再次感谢你选择这一本！我们尽一切努力确保它包含尽可能有用的信息。请享受其中！


    # 第 1 章：机器学习与计算机网络简介


    `AI` 和计算机组网都是计算机科学中的基础领域，但它们涉及不同的概念。也就是说，它们是处理比较报告区域的主题，该区域实际上涵盖了计算机系统的不同领域。在这种情况下，`AI`
    涉及计算机算法和模型，这些模型通过处理已处理的数据循环、逻辑示例的识别以及最佳结果的确定。相反，计算机组网管理全球各种计算机的关联和互连，从而实现数据共享、资源管理和客户端应用。


    ## 计算机网络


    计算机网络是关于考虑和分析相互关联或互连的计算设备或系统的通信程序的计算机信息，用于交换数据或资源。计算机网络被定义为连接在一起以传输和共享信息及资源的计算机集合。计算机系统管理仅依赖于计算机设计、科学、媒体传输以及数据发展的理论和实际应用。要在机器之间建立计算机网络，需要一个人拥有交换机、网卡和特定的协议。


    ### 计算机网络的历史


    计算机网络始于 20 世纪 50 年代计算机的崛起，但使用了军事使用的封闭组织框架。与现代网络框架完全不同，20 世纪 50 年代后期出现了军事雷达的使用，这演变成了由手持器、交换机电信电路和基站模块组成的
    `MOS` 半导体。不同的设计师提出了不同类型的计算机网络，包括西方电气公司在 1965 年提出的电话交换机。


    计算机网络的主要基础进展始于 20 世纪 70 年代，期间见证许多今天用于推进系统管理的设备变化。其中之一包括 `Xerox PARC`，指的是 `Ethernet`（以太网）的使用、用于不断增长的
    `IP` 网络包含以及主机的产生。从 1969 年的 `50kb/s` 电路到现在的 `10mb/s` 到 `100mb/s`，系统管理经历了巨大的变化。尽管如此，预计未来将继续增加，看到最快的组织方法出现。此外，框架的速率已通过
    `Ethernet` 有效提升到 `400GB/s`。


    ## 计算机网络组件


    ### 路由器


    交换机是计算机网络中推进数据包最广为人知的设备，具有协调网络流量的基本能力。数据包（例如网页）通过一个交换机发送，然后传输到下一个交换机，同时保持目标。交换机通常用于家庭和小型企业，通过网络链接运行，而不是使用集成的驱动程序，并通过
    `USB` 与计算机关联。交换机可以是远程的，也可以通过端口连接以考虑网络，例如光纤和 `DSL`。根据你理想的连接，你的网络速度将会波动，某些将引导你获取单个交换机。此外，交换机可能遵循互联网上的特定
    `IP` 地址，作为基本网关。


    ### 网络接口卡


    网卡是一种将一台计算机连接到网络的电子设备，例如 `局域网 (LAN)`。大多数现代计算机在主板上集成了网络接口卡，而不是使用外部芯片来连接网络。当计算机使用诸如
    1977 年连接的 `ARCNET` 等专用协议通过网络交换信息时，这些卡是基础的，但今天大多数计算机使用 `Ethernet`。以太网卡的使用已广为人知，且每年发生变化。网速通常取决于接口卡上的协议。旧网卡支持最高
    `10mb/s`，而目前的连接支持 `100mb/s` 到 `1000mb/s`。网卡并不真正支持远程连接，但交换机也包含这些卡，这决定了给定网络的速率。预计不久后将通过以太网卡进一步增加。在这种情况下，速度将在未来几年内通过速率填充。


    ### 协议


    计算机网络还包括连接协议，它由至少两个框架交换所需的规则组成。除了指南外，协议还包括标点、对应和语义，以及错误恢复程序，用于硬件和编程。最后，协议是一组规则，允许关注基础、计划和原则的工人通过机器、编程或两者者进行工作，以便在两台计算机之间交换数据。计算机网络通常使用
    `开放系统互连 (OSI)` 模型来分离功能层。在计算机网络中使用的不同协议有：`TCP`（传输控制协议）、`UDP`（用户数据报协议）、`IP`（网协议）、`HTTP`（超文本传输协议）和
    `FTP`（文件传输协议）等。


    ## 计算机网络类型


    ### 局域网 (LAN)


    局域网（通常缩称为 `LAN`）是使用特定区域（如工作场所或结构）的计算机框架，通过通信媒体连接。


    ### 个人局域网 (PAN)


    这是一种在 10 米范围内使用机器的私有组织。个人局域网最早由 Zimmerman 发现并介绍，在 30 英尺范围内使用机器。有线和无线 PAN 都可以用于这种类型，其源于更多地从播放器、工作站和手机产生。远程通常与
    `Bluetooth`（蓝牙）和 `Wi-Fi` 关联，位于给定范围内。有线 PAN 与 `USB` 链接关联，用于给定范围内的组织。


    ### 城域网 (MAN)


    城域网是一种通过连接几个局域网来覆盖较宽范围的计算机网络。这种类型的计算机网络通常由政府办公室用于连接不同的办事处，如居民和私人连接。MAN 的部分协议包括
    `ISDN`（整合数字数字业务）、`Frame Relay`（帧中继）和 `OC-3` 等，通过线路进行工作。这种类型的计算机网络被用于比局域网更大的区域，如电信通信、大学和银行。


    ### 广域网 (WAN)


    广域网在巨大的地理范围内覆盖计算机网络，例如国家或国家之间。它比局域网和 WAN 大得多，但不限于一个空间，通过卫星连接或光纤链路扩大范围。WAN 是世界上最大的网络，用于政府任务和教学。WAN
    的一部分包括统一数据、快速移动、更高数据，支持全球。


    ## 机器学习与 AI 细节


    ### AI 与计算机网络（详细）


    `AI` 表现为人类大脑，包括神经元以及它们如何与吸收、思考和决定工作。这个概念最早在 1943 年与计算机熟悉，或者处理涵盖不同领域的报告区域。在这种情况下，`AI`
    涉及计算机算法和模型，通过处理已处理的数据循环、逻辑示例的识别以及最佳结果的确定。


    ### 机器学习细节（详细）


    ### 机器学习 VS 计算机编程


    `AI` 通常被误认为是脚本编程，这种情况下有巨大差异。`AI` 是关于机器获取特定的信息索引、选择最佳算法、学习并决定。实际上，计算机编程需要人类连接来最初选择使用的数据并在机器中与之保持联系。


    ### 机器学习的步骤


    ### 数据的收集与准备


    如果没有连接，人类永远无法学习和了解某事。同样，机器也面临类似的测试，因为它们在学习之前需要访问重要数据。因此，`AI` 的初始阶段是收集重要信息并使其适应给定基础。


    ### 训练模型的选择


    ### 模型的评估


    最后的进展是目前通过尝试筛选出选定的模型，该模型使机器能够在没有人类参与的情况下学习并做出决定。在这个过程中，计算机因此选择最适合给定数据集的模型，并通过熟悉当前数据来自我训练。这确保了处理的数据和结果将获得帮助并提供计划的安排。


    ### 机器学习算法类型


    #### 监督算法


    如所述，`AI` 包含多种类型，取决于如何处理信息以产生结果。模型之一是监督算法，数据集通过给定的边界范围，从而决定结果。机器首先将信息指示为标记，由于包含了准备信息。在这种情况下，信息首先尝试发现其结果，从而控制结果。这种类型的计算通常有一个合理的后续，大部分是计划的。监督算法还分为分类算法和回归算法。分类算法使用
    `K 近邻 (K-Nearest Neighbor)` 分类算法，负责将信息排列到单个标记中。信息通过特征或输入机器的数据之间的相似性来表征。相反，回归算法集中于数值连接。


    #### 无监督算法


    这是与监督算法相反的东西，包含未标记的数据集，很多时候，结果是模糊的。单一算法被分为 `K-means 聚类`、间性和人工神经网络。


    #### 强化算法


    强化算法 `Reinforcement Algorithms` 是机器在特定设置内决定特定数据的地方。AI 的类型之一，支持模型是最有益的，因为学习特定数据集会导致结果的放大。如果将某些不正确的数据放入机器，`强化学习`
    允许你快速做出更改，或改变结果。


