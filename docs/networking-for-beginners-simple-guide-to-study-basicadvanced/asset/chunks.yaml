    考虑到我们之前检查的内容，信息危害评估创新在帮助组织了解其最脆弱的信息并提供有关如何修复这些信息方面起着至关重要的作用。这种方法的实施从识别至关且脆弱的信息开始，这些信息通常是公开透明的。风险评估创新概述了许多发现的细节，为复杂的输入提供了关于脆弱性的公平见解，并提醒你需要从哪里开始加固。


    ### 最小化数据


    在过去的十年里数据创新中，人们对信息的看法发生了巨大变化。以前，人们倾向于多而不要少。你拥的信息越多，你就就越领先。然而，在当今，信息在很大程度上是一种责任。数十亿英镑的潜在损失、泄露可能摧毁整个组织的声誉，再加上收集超出建议的信息相关的巨额罚款，使得信息成为一种极不安全的资源。因此，建议只保留你需要的信息。当你只需要身份证明号码时，尝试不要询问用户的电话和个人住址。在了解信息安全进展后，我们继续讨论信息安全的类型。继续阅读！数据安全类型。正如我们之前学过的，信息安全保护合理和脆弱的信息免受未经授权的访问。当今时代的一切都围绕着计算机和互联网旋转。音乐和娱乐传输与基础、医疗、购物和其他社会领域都已变得数字化。银行同样在在线平台上运行其交易。这种对互联网的高度依赖应该让我们反思我们共享的数据和信息的脆弱性。基本信息能多大有效地在未经授权的情况下获取？这样的问题自然会促使建立安全措施。下面讨论了一些可以帮助保护你敏感信息的信息安全类型。


    ### 关键安全基础设施


    这类信息涉及我们在当前文化中依赖的高级网络安全框架。让我们将其进一步细分，并注意几个基础设施的例子：交通灯、商场以及电网。任何这些关键基础设施都会成为未经授权访问和数字攻击的明确目标。例如，电力系统无疑会成为数字攻击的目标。因此，信息包含基础设施的组织和协会应该建立措施，防止其落入某些不受接受的人手中。他们需要理解自己所处理的数据的脆弱性，因为这是公众成功的基本因素。此外，那些不直接管理基础设施的组织应该采取保护策略来确保其安全，因为攻击可能会影响到所有人，包括他们自己。


    ### 应用安全


    这是你应该考虑的必备信息安全措施之一。它利用设备和软件方法来应对可能出现在任何合理信息中的接近安全威胁。在应用程序中保留有用数据是高风险，因为它们在互联网上是开放的，程序人员会访问它们。只有在有充分的安全措施来防止获取的数据被未经授权访问时，才这样做。杀病毒软件是应用安全类型的一部分。此类防御措施有助于确保信息没有未经授权的访问。此外，这些行动还为组织识别任何可疑活动并建立了警惕的反击。


    ### 网络安全


    由于意识到信息安全更多地关注来自外部的危险，组织安全保护你的信息免受具有恶意意图的人的未经授权访问。组织的安全框架通过控制谁访问信息以及设置安全措施来保护信息；它还会识别谁有未经授权的访问。随着目前的机械进步，通过引入
    AI 管理异常流量以及尽早识别风险，安全措施变得越来越现代化。这种信息安全继续执行有助于防止不当访问和滥用信息的系统和策略。组织安全执行的实例包括受监控的网络访问、强密码和程序加密防火墙。


    ### 云安全


    云是强大安全措施的结果。这是一种基于软件的类型安全类型。它筛选并保护云资产中的信息。云安全组织一直在执行和开发新的云安全设备，这些设备在获取信息方面发挥着重要作用。关于分布式计算有一种特定的幻想，与其他信息安全措施形成了对比。人们认为物理存储你的信息更安全，因为你可以控制它。然而，研究发现将信息存储在云中比真实存储在硬盘中更安全。控制存储在云端的信息也更容易。2018
    年，Alert 进行的一项调查显示，本地存储的信息平均受到 62 次攻击，而存储在云的信息平均遭受 25 次攻击。将信息存储在云中更安全，减轻了你不断关注它的压力，而且非常合理。它强烈建议使用云作为你的信息存储平台。由于技术的不断进步，云安全的未来更加美好广阔。


