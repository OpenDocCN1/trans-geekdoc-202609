    and your target would be the weight.


    Converting the data to tensors: PyTorch provides several ways to convert data
    to tensors. For example, you can use the torch.Tensor() or torch.as_tensor() functions.


    Splitting the data into training and test sets: This is an important step to evaluate
    how well your model generalizes to unseen data. You can use the train_test_split()
    function from sklearn to do this.


    The following is an example of how you can perform these steps:'
