- pgno: 294
  md: '# Train the Model


    In order to train our linear regression model, we need to define both a loss function
    and an optimizer.


    For a regression task such as this one, a common choice for the loss function
    is the Mean Squared Error (MSE) loss. The MSE loss computes the average squared
    differences between the predicted and actual values, and our goal during training
    is to minimize this value.


    As for the optimizer, we will use the Adam optimizer. Adam stands for Adaptive
    Moment Estimation and it is a popular choice because it combines the benefits
    of two other extensions of stochastic gradient descent. Specifically, it calculates
    an exponential moving average of the gradient and the squared gradient, and the
    parameters beta1 and beta2 control the decay rates of these moving averages.


    # Define MSE Loss Function'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'The following is how you define the MSE loss function and the Adam optimizer
    in PyTorch:


    ```

    # Define the loss function and the optimizer


    criterion = nn.MSELoss()


    optimizer = torch.optim.Adam(model.parameters(),

    lr=0.001)

    ```


    The nn.MSELoss() function creates a criterion that measures the mean squared error
    between each element in the input x and target y.


    The torch.optim.Adam() function creates an Adam optimizer. We pass the parameters
    of our model to this function so the optimizer knows which tensors it should update.
    The learning rate lr specifies the speed at which our optimizer should update
    the model''s parameters.


    Now, we will set our model to training mode and run a forward pass to check the
    initial predictions.


    This can be done using the following script:'
  merge: -1
  img_proc: true
- pgno: 296
  md: "```\n# Set model to training mode\n\nmodel.train()\n```\n\n```\n# Run a forward\
    \ pass on the model to get the initial predictions\n\nwith torch.no_grad():\n\
    \    initial_predictions = model(x_train)\n```\n\n```\n# Print the initial predictions\n\
    \nprint(initial_predictions)\n```\n\nThe model.train() function sets the model\
