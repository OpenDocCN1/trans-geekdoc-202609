- pgno: 297
  md: 'torch.no_grad(): to specify that we don''t want to keep track of the gradients
    during this operation, as we don''t need them for just checking the predictions.


    The initial predictions will likely be far off from the actual values, as the
    model''s parameters are initially set to random values. This is expected, and
    the model should improve once we start the training process.


    Now, we will delve a bit deeper into the loss function and the Adam optimizer.


    A loss function, in the context of machine learning and deep learning, is a method
    of evaluating how well an algorithm models the given data. If the predictions
    deviate too much from the actual results, the loss function would output a large
    number. Good predictions result in a small number.


    In this scenario, we''re using the Mean Squared Error (MSE) loss. This is a popular
    loss function for regression problems. It works by calculating the average squared
    differences between the predicted and actual values. The squaring is necessary
    to remove any negative signs. It also amplifies the impact of larger errors. The
    equation for MSE is:'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'MSE = 1/n Σ(actual - predicted)²


    Where Σ is a sum over all examples, n is the total number of examples, and actual
    - predicted represents the difference between the actual and predicted values
    for each example.


    Adam (Adaptive Moment Estimation) is a method that computes adaptive learning
    rates for each parameter. It combines the perks of two other extensions of stochastic
    gradient descent. Namely:


    AdaGrad: Which scales down the learning rate for each parameter adaptively, so
    parameters with larger gradients that are updated more also have their learning
    rate reduced more.


    RMSProp: Which also scales down the learning rate according to the magnitude of
    the gradients, but unlike AdaGrad, it uses a moving average of the squared gradient,
    so it doesn''t decrease as fast.


    Adam, in particular, computes adaptive learning rates through estimations of both
    the first-order moments'
  merge: -1
  img_proc: true
- pgno: 299
  md: '(the mean) and the second-order moments (the uncentered variance) of the gradients.


    The algorithm maintains a separate learning rate for each weight in the model
    and adaptively adjusts them over time. This leads to good performance with less
    sensitivity to the initial learning rate compared to other gradient descent optimizations.


    The name "Adam" comes from the method''s adaptive moment estimation, and it has
    been empirically shown to work well in practice and compared to other adaptive
    learning-method algorithms.


    Now that we''ve covered the basics of the loss function and the optimizer, we''ll
    be in a better position to understand the training process, which involves using
    the optimizer to minimize the loss function.


