  md: '# # Diving into Tensors


    A tensor, in the context of deep learning, is a generalization of vectors and
    matrices to potentially higher dimensions, and is a fundamental data structure
    in PyTorch. Tensors are a type of data structure used in linear algebra, and like
    vectors and matrices, you can calculate arithmetic operations with tensors.




    Tensors are a core unit of data in PyTorch and are represented as multi-dimensional
    arrays. The dimensionality of a tensor can be described with rank, shape, and
    size.


    Rank: This simply tells us the number of dimensions in a tensor. A scalar has
    rank 0, a vector has rank 1, a matrix has rank 2, and a tensor has rank 3 or more.


    Shape: The shape of a tensor is the number of elements in each dimension.'
  merge: -1
  img_proc: true
