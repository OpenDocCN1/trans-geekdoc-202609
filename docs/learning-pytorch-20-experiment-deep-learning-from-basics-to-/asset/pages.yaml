- pgno: 4
  md: '# Prologue


    Dear reader, we are excited to take you on an exciting adventure into the fascinating
    world of PyTorch 2.0. This book has been painstakingly developed as a thorough
    reference, with the intention of illuminating the complex terrain of deep learning.
    Its goal is to change you from a curious enthusiast into a proficient practitioner
    by providing you with the theoretical understanding as well as the practical expertise
    necessary to properly use PyTorch. While we embark on this journey of discovery,
    we want you to participate completely by testing the validity of your previously
    held beliefs and broadening your perspective on the fascinating field of deep
    learning.


    The first part of the book lays a strong basis in the fundamental principles that
    underpin PyTorch. Tensors, the fundamental building elements of PyTorch, are the
    subject of substantial discussion in the first few chapters. These first few chapters
    will walk you through the steps of comprehending tensors, as well as the process
    of building and manipulating them. This book will ensure that you have a solid
    foundation in the'
  merge: -1
  img_proc: true
- pgno: 5
  md: 'fundamentals before going on to more advanced ideas by gradually increasing
    the difficulty of the topics as you progress through it.


    As we continue to delve further into the workings of PyTorch, the book begins
    to introduce the development of basic as well as more complex models. We break
    down the many parts that make up these models with the help of some examples to
    illustrate our points. You will gain knowledge on how to create and train a variety
    of neural networks, including feed-forward and recurrent neural networks, as well
    as GRUs and CNNs, which are more advanced models. You will be able to apply what
    you learn in the book to real-world situations since it combines theoretical explanations
    with real-world examples, which helps to drive home the many concepts and methods
    that are covered.


    The knowledge of the training process comes next in the book, after an initial
    look at neural networks. Unraveling optimization algorithms, sometimes known as
    the "engines that drive learning in neural networks," is one of the most important
    aspects of this endeavor. The book explains each algorithm in a manner that is
    both comprehensive and easy to understand, beginning with the fundamental Gradient
    Descent and progressing all'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'the way up to the more complex Adaptive Moment Estimation. You will now have
    the ability to construct and train robust models using PyTorch thanks to the knowledge
    and the activities you have completed.


    In the latter chapters of this book, we delve into the more sophisticated principles
    of the PyTorch programming language. You will acquire knowledge regarding the
    serialization and optimization of models, as well as the use of distributed training
    and the Quantization API provided by PyTorch. In addition, we investigate the
    connection between TensorFlow 2.0 and PyTorch 2.0, comparing and contrasting the
    advantages and disadvantages of both programs. In doing so, the book arms you
    with the knowledge necessary to select the framework that caters to your requirements
    in the most optimal manner.


    As we embark on this adventure, we want to urge you to approach each chapter with
    an open heart and a mind that is full of curiosity. This book offers something
    to offer everyone, from someone who is just beginning out in deep learning to
    someone who is an experienced professional looking to develop their skills. We
    have high hopes that by the time you finish reading this book, you will not only
    have a comprehensive understanding of'
  merge: -1
  img_proc: true
- pgno: 7
  md: PyTorch 2.0 but also the self-assurance to put what you have learned into practice
    in the real world. Let's not waste any more time and go right into this thrilling
    adventure together, shall we? PyTorch 2.0 is where you want to be, so welcome!
  merge: -1
