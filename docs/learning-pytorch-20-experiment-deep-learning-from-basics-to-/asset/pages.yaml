- pgno: 62
  md: 'vector in PyTorch would be torch.tensor([1, 2, 3, 4]). This tensor has a single
    axis and therefore has an extent or length, with each element corresponding to
    a point along that axis.


    # Matrix


    Advancing in complexity, a matrix is a two-dimensional tensor, possessing both
    rows and columns. In PyTorch, it could be represented as torch.tensor([[1, 2],
    [3, 4]]). Matrices can be thought of as a table of numbers or a grid that spans
    two directions or axes.


    # Tensor Operations


    An essential aspect of tensor manipulation is the numerous tensor operations supported
    by PyTorch. These operations cover a broad spectrum, ranging from basic arithmetic
    operations like addition, subtraction, multiplication, and division to more complex
    linear algebra functions. Element-wise operations, reduction operations, and comparison
    operations form a rich palette of tools that make PyTorch an effective and versatile
    platform for deep learning tasks.'
