- pgno: 220
  md: '# Distributed Training of Deep Learning


    Distributed training refers to the practice of training a deep learning model
    across multiple machines, each equipped with one or more GPUs. As the size of
    datasets and models increases, the time required to train these models also increases.
    Therefore, to expedite training times, machine learning practitioners often opt
    for distributed training.


    # Methods of Distributed Training


    Distributed training can happen in two main ways:


    Data Parallelism: In data parallelism, a single model is replicated across multiple
    GPUs, and each GPU is given a unique batch of data to perform forward and backward
    passes on. The gradients from each GPU are then gathered and averaged to update
    the model weights. This is the most common form of distributed training and is
    effective when your model can fit within the GPU memory.'
  merge: -1
  img_proc: true
- pgno: 221
  md: "Model Parallelism: In model parallelism, different parts of the model are placed\
    \ on different GPUs. For example, if you have a deep neural network with many\
    \ layers, you could put the first few layers on one GPU and the remaining layers\
    \ on another GPU. Model parallelism is used when the model is too large to fit\
    \ into the memory of a single GPU. This method can be a bit trickier to implement\
    \ because it involves manually assigning different parts of the model to different\
    \ devices.\n\n# Distributed Training in PyTorch\n\nPyTorch supports distributed\
    \ training through its torch.nn.DataParallel and torch.nn.parallel.DistributedDataParallel\
    \ classes for data parallelism. torch.nn.DataParallel is a wrapper that you can\
    \ place around any module to make it run in parallel across multiple GPUs in a\
    \ single machine.\n\nThe following is a brief example:\n\n```\nmodel = MyModel()\n\
    \nif torch.cuda.device_count() > 1:\n\n    model = nn.DataParallel(model)\n```"
  merge: -1
  img_proc: true
- pgno: 222
  md: 'For multi-machine data parallelism, PyTorch provides torch.nn.parallel.DistributedDataParallel.
    This is more efficient than DataParallel but requires a little more setup, including
    launching multiple Python processes and providing network addresses and ports
    for communication.


    Model parallelism in PyTorch typically involves manual work, splitting your model
    into different parts and assigning them to different devices using .to(device).


    Distributed training has the potential to greatly decrease training times by leveraging
    multiple GPUs, but it also increases the complexity of your training code and
    can lead to more difficult debugging situations. So, it''s usually considered
    when the benefits outweigh these complexities.


