    of the elements of the shape.


    In PyTorch, tensors allow for operations to be performed on GPUs, which can significantly
    accelerate the computations. They are similar to NumPy''s ndarrays, with the addition
    being that Tensors can also be used on a GPU to accelerate computing.


    # Different Tensors


    PyTorch provides various functions to create different types of tensors. Below
    are a few examples:


    +   • Empty Tensor: torch.empty(size): Returns a tensor of given size filled with
    uninitialized data. Here, size is a tuple defining the dimension of the tensor.


    +   • Zero Tensor: torch.zeros(size): Returns a tensor filled with zeroes.


    +   • Ones Tensor: torch.ones(size): Returns a tensor filled with ones.'
