    The DataLoader is designed to be efficient and takes care of batching, shuffling,
    and parallel data loading. It creates an iterable over our dataset, and the core
    of this iterable is the batch, which is automatically managed by PyTorch.


    The following is an example of how we can create DataLoader instances for our
    training and test sets:


    ```

    ```python

    from torch.utils.data import TensorDataset, DataLoader


    # Define batch size


    batch_size = 32

    ```

