- pgno: 277
  md: 'model works to reduce as part of the training process. PyTorch includes a number
    of pre-defined loss functions in the torch for its users to choose from.nn module
    that you are free to utilize, such as MSELoss for problems involving regression
    or CrossEntropyLoss for problems involving classification.


    # Optimizer


    The optimizer is the algorithm that updates the model parameters (weights and
    biases) depending on the gradients of the loss function. PyTorch has a large number
    of pre-defined optimizers in its torch.optim module. These optimizers include
    SGD, Adam, RMSProp, and many more.


    # Training


    You are now able to train your model now that you have your data, model, loss
    function, and optimizer prepared. In most cases, training consists of iteratively
    traversing the full dataset over and over again (using epochs). During each epoch,
    the model will calculate the loss, compute the gradients, and update the parameters.
    Additionally, the model will make predictions for each data point.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# Evaluation


    Following the completion of the training phase, you will need to assess how well
    your model performs on data that it has not previously seen (your test set). You
    will get a sense from this of how effectively your model generalizes to new data
    if you do this. It is essential to keep in mind that the performance of the model
    while it is being trained is not always indicative of how well it will perform
    on data it has not previously seen.


    # Model Saving and Loading


    Once you are satisfied with the performance of your model, you will be able to
    save the parameters of the model to a file. Because of this, you will no longer
    need to retrain the model in order to generate predictions after loading these
    parameters later on.


    Building a PyTorch model involves a combination of these steps, tailored to the
    specific problem you''re trying to solve. Once you''ve mastered these basic steps,
    you can move on to more advanced techniques, such as handling larger datasets
    with data loaders, improving your model with regularization or dropout, and speeding'
