  md: '# Understanding Convolutional Neural Networks


    # Overview


    Convolutional Neural Networks (CNNs) are a category of Neural Networks that have
    proven very effective in areas such as image recognition and classification. They
    were designed to mimic the connectivity pattern of neurons in the human brain
    and have been very successful in identifying faces, objects and traffic signs
    apart from powering vision in robots and self driving cars.


    CNNs have their "neurons" arranged in three dimensions: width, height, and depth.
    The neurons in a layer are only connected to a small region of the layer before
    it, called a receptive field. Layers close to the input layer learn to recognize
    simple patterns, like lines and curves. Layers further along the network combine
    these simple patterns to recognize more complex patterns, like shapes, and even
    further, objects.


    # Advantages of CNNs


    CNNs are especially good at analyzing visual data, hence their close connection
    with image and video'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'processing. The following are the key attributes and benefits for CNNs being
    so appealing::


    Parameter Sharing: A feature detector (like a vertical edge detector) that''s
    useful in one part of the image is probably useful in other parts of the image.
    This drastically reduces the amount of parameters in the model, making it less
    likely to overfit, more computationally efficient and less demanding on memory.


    Local Connectivity: In CNNs, instead of fully connecting all neurons to each other,
    neurons are only connected to a small subset of neurons in the next layer. This
    mirrors the way neurons in the human visual system are connected: neurons in the
    retina are only connected to a small subset of neurons in the visual cortex.


    Translation Invariance: Because of parameter sharing, the network is translation
    invariant, meaning it can recognize an object regardless of where in the visual
    field it appears. A CNN trained to recognize a cat in the right side of an image
    will also recognize a cat on the left side.'
  merge: -1
  img_proc: true
- pgno: 153
