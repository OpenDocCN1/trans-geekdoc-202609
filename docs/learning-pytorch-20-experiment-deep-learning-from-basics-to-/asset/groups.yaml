    \ 方法中定义，并在 `forward` 方法中应用。\n\n从更广泛的意义上讲，在 PyTorch 中设计自定义层和网络是一种灵活且强大的工具，它让你能够实现任何你能想象到的架构。无论你是在应用标准技术，还是在发明新技术，PyTorch\
    \ 的灵活性都使其成为深度学习研究和开发的绝佳选择。\n\n## 总结\n\n总体而言，本章深入探讨了 PyTorch 的 `nn` 模块的功能，详细介绍了如何利用它来创建各种类型的神经网络。本章第一部分向你介绍了前馈网络的概念。前馈网络是许多其他类型神经网络的基础，数据沿一个方向流动——从输入到输出。它们已被广泛应用于众多场景，并具有简单且可解释性强的优点。\n\
    \n接下来，我们进入了循环神经网络（RNN）的领域。RNN 通过考虑数据的时间序列维度，为前馈网络增添了新的维度。这使得它们能够捕获随时间变化的模式，从而在时间序列分析、自然语言处理等领域尤为有用。我们还了解了如何在\
    \ PyTorch 中创建 RNN，演示了定义和训练这些网络是多么简单。本章随后介绍了更高级的 RNN 类型，即 GRU 和 CNN。门控循环单元（GRU）通过缓解梯度消失问题改进了传统\
    \ RNN，使其能够更好地捕获长期依赖关系。另一方面，卷积神经网络（CNN）凭借其从输入图像中提取高级特征的能力，在图像处理任务中表现出色。我们逐步演示了如何在\
    \ PyTorch 中创建这些模型，展示了整个过程是多么直接。\n\n本章最后讨论了将 RNN 和 CNN 组合到单一模型中（CRNN），以及如何在 PyTorch\
    \ 中设计自定义层和网络。PyTorch 的灵活性使我们能够创建新的架构，以专门满足特定任务的独特需求。我们了解到，可以通过扩展 `nn.Module` 类并定义自定义的\
    \ `forward` 前向传播方法来构建这些自定义模型。所有这些主题旨在让你全面理解 PyTorch 的能力和潜力，为你应对广泛的深度学习任务做好准备。\n\
    \n## 第 5 章 在 PyTorch 2.0 中训练神经网络\n\n## 神经网络训练概述\n\n训练机器学习模型涉及学习一组最优权重，以便在给定数据的情况下做出最佳预测。这是通过一个称为优化的过程实现的。训练过程是迭代式的，通常涉及前向传播、反向传播和权重更新等步骤。我们将更深入地探讨以下步骤：\n\
    \n前向传播是将输入数据传入网络以生成预测的过程。神经网络使用权重（在开始时随机初始化）来计算输出。例如，在一个简单的线性回归问题中，前向传播将涉及使用权重和输入\
    \ `x` 值来计算预测的 `y` 值。\n\n在前向传播之后，下一步是计算损失。损失函数衡量网络预测值与实际值之间的差异。它提供一个数值，表示预测中存在的误差大小。常见的损失函数包括用于回归问题的均方误差、用于分类问题的交叉熵损失等。训练的目标是最小化这个损失值。\n\
    \n反向传播：反向传播（backward pass）是神经网络训练中发生“魔法”的步骤。反向传播算法通过应用链式法则，计算损失函数相对于网络中每个权重的梯度。本质上，它确定了每个权重对整体误差的贡献程度。\n\
    \n权重更新：一旦我们知道每个权重对误差的贡献程度，就可以调整权重以最小化损失。这通常使用优化算法来完成。最常见的优化器是随机梯度下降（SGD）。SGD 沿着梯度的反方向以一小步更新权重。这有助于减少损失。其他流行的优化器包括\
    \ Adam、RMSProp 等，它们会动态调整学习率以加速收敛。\n\n轮次（Epochs）与批次（Batches）：前向传播、反向传播和权重更新的整个过程会在多个周期（称为轮次）中迭代进行。为了加速训练并更好地利用计算资源，数据通常被划分为较小的批次。\n\
    \n前向传播和反向传播是在每个批次上进行的，而不是在整个数据集上，并且权重会在每个批次之后更新。\n\n多年来，人们对这些步骤进行了许多改进和变体。例如，Adam\
    \ 和 RMSProp 等先进优化技术会在训练过程中自适应调整学习率。Dropout 和 Batch Normalization 等正则化技术也常用于训练过程中，以防止过拟合并帮助模型更好地泛化。简而言之，深度学习中的训练过程是前向传播、计算损失、反向传播和权重更新之间一场错综复杂的协作。这是一种系统且迭代的方法，用于教导神经网络做出准确的预测，其驱动力来自优化的力量和反向传播的微积分原理。\n\
    \n## PyTorch optim 模块\n\nPyTorch 的 `optim` 模块包含了多种可用于训练神经网络的优化算法。这些算法至关重要，因为它们会影响训练的速度和质量。优化器的选择会影响模型收敛的速度，甚至决定其能否收敛。\n\
    \nPyTorch `optim` 模块中的所有优化器类都继承自基类 `torch.optim.Optimizer`。该类提供了基础功能，包括管理待优化参数、状态和超参数。每个优化器算法都利用这些功能，并在其\
    \ `step()` 方法中实现具体的优化策略，该方法执行单次优化步骤（即参数更新）。\n\n### 使用优化器\n\n要在 PyTorch 中使用优化器，你首先需要实例化所选优化器类，传入待优化模型的参数以及必要的超参数（如学习率）。在计算梯度之后，调用\
    \ `optimizer.step()` 即可更新参数。\n\n例如：\n\n```\n# 定义模型\nmodel = torch.nn.Linear(10,\
    \ 5)\n\n# 定义优化器\noptimizer = torch.optim.Adam(model.parameters(), lr=0.001)\n\n\
    # 训练步骤\nfor input, target in dataset:\n    optimizer.zero_grad()\n    output =\
    \ model(input)\n    loss = loss_fn(output, target)\n    loss.backward()\n    optimizer.step()\n\
    ```\n\n在上面的代码片段中，首先使用 `optimizer.zero_grad()` 将模型的梯度清零，以确保不会使用过时的梯度。然后，在通过 `loss.backward()`\
    \ 计算出梯度后，优化器使用 `optimizer.step()` 基于这些梯度执行参数更新。\n\n总体而言，PyTorch 的 `optim` 模块提供了广泛的优化算法，有助于高效地训练神经网络。\n\
    \n"
