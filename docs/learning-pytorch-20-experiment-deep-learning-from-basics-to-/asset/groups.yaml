  - '[PAGE 180]


    # Optimization Algorithms


    Optimization algorithms are crucial for training machine learning models. They
    are iterative methods used to improve the model''s performance by adjusting the
    model''s parameters in a way that minimizes the cost function, also known as the
    loss function.


    The following is an overview of some of the most common optimization algorithms:


    Gradient Descent: This is the most basic form of an optimization algorithm. It
    computes the gradient of the loss function with respect to the parameters at the
    current position in the parameter space, then moves in the direction of steepest
    descent. The size of the step is determined by the learning rate. The process
    is repeated until the algorithm converces to a local minimum.


    Stochastic Gradient Descent (SGD): This is a variant of gradient descent, where
    the update to the parameters is performed after computing the loss for each instance
    in the training dataset, rather than the entire dataset. It'
  - '[PAGE 181]


    introduces randomness in the optimization process and can escape shallow local
    minima more easily.


    Mini-batch Gradient Descent: This is a compromise between batch gradient descent
    and stochastic gradient descent. It splits the training dataset into small subsets
    or "mini-batches". The model parameters are updated after computing the loss for
    each mini-batch. This can reduce the noise in the gradient estimation and make
    the training process faster.


    Momentum: This is a method used to accelerate SGD. It computes an exponentially
    weighted average of the gradients to update the parameters, which can help the
    algorithm converge faster and avoid local minima.


    Adagrad: This algorithm adapts the learning rate for each parameter based on the
    history of gradients, which makes it good for dealing with sparse data.


    RMSProp: This is an improvement over Adagrad that resolves its radically diminishing
    learning rates. It uses a moving average of squared gradients to normalize the
    gradient itself.'
  - '[PAGE 182]


    Adam (Adaptive Moment Estimation): This is currently one of the most popular optimization
    algorithms. It combines ideas from Momentum and RMSProp. It computes adaptive
    learning rates for different parameters and keeps an exponentially decaying average
    of past gradients, similar to momentum.


    Each of these algorithms has its own strengths and weaknesses, and the choice
    of optimization algorithm can significantly affect the quality of the final model.
