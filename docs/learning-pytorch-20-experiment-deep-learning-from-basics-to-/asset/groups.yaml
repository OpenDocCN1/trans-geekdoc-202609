  - '[PAGE 298]


    MSE = 1/n Σ(actual - predicted)²


    Where Σ is a sum over all examples, n is the total number of examples, and actual
    - predicted represents the difference between the actual and predicted values
    for each example.


    Adam (Adaptive Moment Estimation) is a method that computes adaptive learning
    rates for each parameter. It combines the perks of two other extensions of stochastic
    gradient descent. Namely:


    AdaGrad: Which scales down the learning rate for each parameter adaptively, so
    parameters with larger gradients that are updated more also have their learning
    rate reduced more.


    RMSProp: Which also scales down the learning rate according to the magnitude of
    the gradients, but unlike AdaGrad, it uses a moving average of the squared gradient,
    so it doesn''t decrease as fast.


    Adam, in particular, computes adaptive learning rates through estimations of both
    the first-order moments'
