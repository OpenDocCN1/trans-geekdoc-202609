    two other popular algorithms: AdaGrad, which handles sparse gradients, and RMSProp,
    which handles non-stationary (i.e., rapidly changing) objectives.


    The name "Adam" is derived from "adaptive moment estimation", and the algorithm
    is designed to compute individual adaptive learning rates for different parameters.
    It calculates an exponential moving average of the gradient and the squared gradient,
    and the parameters beta1 and beta2 control the decay rates of these moving averages.


    The main advantages of Adam include:


    +   - Straightforward to implement.

    +   - Computationally efficient with little memory requirements.

    +   - Invariant to diagonal rescale of the gradients.

    +   - Well suited for problems that are large in terms of data or parameters.

    +   - Appropriate for non-stationary objectives.

    +   - Works well with problems with very noisy or sparse gradients.

    +   - Provides some regularization effects.


