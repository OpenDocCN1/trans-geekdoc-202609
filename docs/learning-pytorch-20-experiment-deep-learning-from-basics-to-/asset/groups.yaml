    \n## 总结\n\n在本章中，我们深入探讨了 PyTorch 的基本构建块：张量。我们首先了解了张量是什么、其重要性，以及它们如何成为 PyTorch 和深度学习中操作的基石。张量本质上是对矩阵向多维的推广，并且是\
