    layer as its input. For example, a simple fully connected (or dense) layer, also
    known as a linear layer, applies a linear transformation to its input, while a
    convolutional layer applies a convolution operation. The nn module includes a
    variety of layers such as nn.Linear, nn.Conv2d, and nn.MaxPool2d to name a few.


    Activation functions are another essential component of neural networks. They
