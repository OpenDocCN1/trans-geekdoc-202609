    # Exploring Gated Recurrent Units (GRUs)


    # Overview


    Gated Recurrent Units (GRUs) are a type of recurrent neural network architecture
    that were designed to combat the vanishing gradient problem found in traditional
    RNNs. This problem makes it hard for RNNs to maintain and learn from long-term
    dependencies in a sequence. The GRU, proposed by Kyunghyun Cho et al. in 2014,
    is simpler than the Long Short-Term Memory (LSTM) architecture, another solution
    to the vanishing gradient problem, but it has shown comparable performance in
    certain tasks.


    GRUs introduce the concept of a gating mechanism, similar to LSTMs. These mechanisms
    are a way to control the flow of information in the network, but GRUs use two
    gates, compared to the three used in LSTMs:


    Update Gate (z): This gate decides what information to throw away and what new
    information to add. It is a mix between the current memory and the new input.'
