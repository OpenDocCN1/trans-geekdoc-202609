    \ 5)\n```\n# 定义批大小\n```\nbatch_size = 10\n```\n# 训练循环\n```\nfor i in range(100):\n\
    ```\n```\nfor j in range(0, input.shape[0], batch_size):\n```\n# 计算预测输出\n```\n\
    output = model(input[j:j+batch_size])\n```\n# 计算损失\n```\nloss = loss_fn(output,\
    \ target[j:j+batch_size])\n\n# Zero the gradients\n\noptimizer.zero_grad()\n\n\
    # Compute the gradients\n\nloss.backward()\n\n# Update the parameters\n\noptimizer.step()\n\
    ```\n\n在上面的示例程序中，使用 torch.optim.Adagrad 实例化 Adagrad 优化器。与 SGD 类似，Adagrad 优化器的主要参数是要优化的参数集合，它还接受学习率\
    \ (lr) 作为可选参数。\n\n## 自适应矩估计\n\n自适应矩估计（Adam）是一种流行的优化算法，用于训练许多类型的深度学习模型。Adam 结合了来自\n\
    两个其他流行算法的元素：AdaGrad，可处理稀疏梯度；以及 RMSProp，可处理非平稳（即快速变化）的目标。\n\n名称“Adam”源自“adaptive\
    \ moment estimation”，该算法旨在为不同参数计算单独的自适应学习率。它计算梯度和平方梯度的指数移动平均值，而参数 beta1 和 beta2\
