    \n序列化期间封装的关键元素包括模型架构——定义模型结构蓝图的架构，包括层及其相互连接。这种设计对于描述模型如何处理输入并产生输出至关重要。另一个保留的重要元素是模型参数——模型在训练期间学习到的权重和偏置。这些参数是模型学习的精髓，定义了模型如何进行预测或决策。优化器状态也被保存，其中包括当前学习率和其他优化器特定参数（如\
