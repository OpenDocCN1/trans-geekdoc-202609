  mdcn: "\n最后，我们讨论了 CUDA 对深度学习的重要性，它通过利用 NVIDIA GPU 的并行计算能力，可以显著加速训练过程。我们还强调了 CUDA\
    \ 与 PyTorch 的无缝融合，能够实现高效计算和快速模型训练。在本章结尾，我们逐步介绍了在 Linux 平台上搭建 PyTorch 2.0 和 CUDA\
    \ 11.8 环境的过程。这一搭建过程使开发者能够在深度学习项目中充分利用 GPU 加速运算的力量，为后续章节深入探讨实际应用奠定基础。\n\n## 第 2\
    \ 章：张量入门\n\n### 深入了解张量\n\n在深度学习中，张量是向量和矩阵向更高维度的推广，是 PyTorch 中的基本数据结构。张量是线性代数中使用的一种数据结构，与向量和矩阵类似，你可以对张量进行算术运算。\n\
    \n张量是 PyTorch 中的核心数据单元，以多维数组的形式表示。张量的维度可以用秩、形状和大小来描述。\n\n- **秩**：它简单地告诉我们张量中的维度数量。标量的秩为\
    \ 0，向量的秩为 1，矩阵的秩为 2，而张量的秩为 3 或更高。\n- **形状**：张量的形状是每个维度中的元素数量。\n- **大小**：张量中元素的总数，可以通过形状各维度元素数量的乘积来计算。\n\
    \n在 PyTorch 中，张量允许在 GPU 上执行操作，这可以显著加速计算。它们与 NumPy 的 ndarray 类似，区别在于张量也可以用于 GPU\
    \ 加速计算。\n\n### 不同类型的张量\n\nPyTorch 提供了多种函数来创建不同类型的张量。以下是一些示例：\n\n- **空张量**：`torch.empty(size)`：返回一个指定大小的张量，其中填充了未初始化的数据。这里，size\
    \ 是一个定义张量维度的元组。\n- **零张量**：`torch.zeros(size)`：返回一个用零填充的张量。\n- **全 1 张量**：`torch.ones(size)`：返回一个用\
    \ 1 填充的张量。\n- **随机张量**：`torch.rand(size)`：返回一个填充了来自 [0, 1) 区间均匀分布的随机数的张量。\n\n\
    ### 张量术语与概念\n\n张量是标量、向量和矩阵的多维推广，是流行的深度学习框架 PyTorch 功能的关键。掌握与张量相关的概念是充分发挥 PyTorch\
    \ 全部威力的重要一步，因为这些数据结构对于在深度学习中高效执行计算至关重要。\n\n### 标量\n\n标量是张量中最简单的类型，只包含一个元素，没有维度。在\
    \ PyTorch 框架中，标量可以表示为 `torch.tensor(5)`。这是一个零维张量，类似于几何中的点——有位置，但没有大小。\n\n### 向量\n\
    \n向量则是张量中的一维张量，类似于几何中的线。PyTorch 中向量的一个示例是 `torch.tensor([1, 2, 3, 4])`。该张量只有一个轴，因此具有范围或长度，每个元素对应于该轴上的一个点。\n\
    \n### 矩阵\n\n随着复杂度的提升，矩阵是一个二维张量，既有行又有列。在 PyTorch 中，它可以表示为 `torch.tensor([[1, 2],\
    \ [3, 4]])`。矩阵可以被看作一个数字表格或一个跨越两个方向（轴）的网格。\n\n### 张量运算\n\n张量操作的一个重要方面是 PyTorch\
    \ 支持的众多张量运算。这些运算涵盖了广泛的范畴，从加、减、乘、除等基本算术运算到更复杂的线性代数函数。逐元素运算、归约运算和比较运算构成了丰富的工具集，使\
    \ PyTorch 成为深度学习任务中高效且多功能的平台。\n\n### 广播\n\nPyTorch 一个特别强大的机制是广播（broadcasting），该功能允许框架在算术运算中处理不同形状的数组。它将较小的数组扩展到与较大的数组匹配，从而顺利执行逐元素运算，这一特性显著提高了数组操作的灵活性和便利性。\n\
    \n### 设备\n\n最后，PyTorch 的“设备”方面确保张量可以通过 `.to` 方法无缝移动到任何设备内存中。例如，`tensor.to(\"cuda\"\
    )` 便于将张量传输到 GPU，从而实现硬件加速计算，这对于处理深度学习巨大的计算需求至关重要。\n\n张量是 PyTorch 的支柱，因此理解张量对于有效利用\
    \ PyTorch 框架至关重要。它们提供了深度学习算法在处理海量数据和执行复杂计算时所需的计算效率。这一基础理解为我们在后续章节中探索更高级的深度学习概念和技术奠定了基础。\n\
    \n### 创建张量的示例程序\n\n我们将深入使用 PyTorch 创建张量。我们将看到如何创建空张量、用 1 填充的张量、用 0 填充的张量以及随机值张量。请注意，你必须安装\
    \ PyTorch 才能运行这些代码。\n\n首先，我们将导入 PyTorch 库：\n\n```\nimport torch\n```\n\n### 创建空张量：\n\
    \n```\nempty_tensor = torch.empty(3, 2)\nprint(empty_tensor)\n```\n\n这将创建一个形状为\
    \ 3x2 的张量，其中填充了未初始化的数据。输出结果类似如下：\n\n```\ntensor([[2.1019e-44, 0.0000e+00],\n \
    \       [      nan, 0.0000e+00],\n        [1.3733e-14, 6.4069e+02]])\n```\n\n\
    ### 创建用零填充的张量：\n\n```\nzero_tensor = torch.zeros(3, 2)\nprint(zero_tensor)\n```\n\
    \n这将创建一个形状为 3x2 且用零填充的张量。输出结果为：\n\n```\ntensor([[0., 0.],\n        [0., 0.],\n\
