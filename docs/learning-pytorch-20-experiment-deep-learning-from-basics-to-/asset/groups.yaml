    # Momentum


    Momentum, a concept borrowed from physics, has been cleverly applied in the realm
    of optimization algorithms to accelerate the learning process. The idea behind
    momentum is simple: an object in motion tends to maintain its trajectory unless
    acted upon by an external force. This principle is applied to the optimization
    process in machine learning to guide the optimizer effectively, ensuring smoother
    and quicker convergence towards the global minimum of the loss function.


    Within the context of optimization, momentum functions by carrying forward a fraction
    of the update vector from the previous time step to the current one. This mechanism
    assists the optimizer in moving along relevant directions more effectively, thereby
    mitigating unnecessary oscillations. The momentum term effectively serves as a
    memory of the previous'
  - '[PAGE 194]


    gradients, helping to guide the optimization process by dampening rapid changes
    in gradient directions. Momentum can be a potent tool in optimization, especially
    in scenarios marked by high curvature, small but consistent gradients, or noisy
    gradients. High curvature can lead to rapid changes in gradient direction, causing
    the optimization process to oscillate wildly and potentially miss the optimum.
    A small but consistent gradient can lead to a slow convergence towards the optimum.
    Noise can introduce randomness, making it harder for the optimizer to find the
    optimum.


    In each of these cases, momentum can help significantly. It increases the update
    for dimensions whose gradients point consistently in the same direction, accelerating
    convergence in these dimensions. At the same time, it reduces updates in dimensions
    where the gradients frequently change direction, helping to dampen oscillations.
    This dual action helps make the trajectory of the optimizer more direct and less
    prone to oscillations, leading to faster convergence and potentially better solutions.


    # Using Momentum with SGD'
