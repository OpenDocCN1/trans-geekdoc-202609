    # Essentials of Neural Networks


    An fascinating computer model known as the artificial neural network captures
    the essence of deep learning, a subset of machine learning. Deep learning is a
    subset of machine learning. In this chapter, we investigate the fundamentals of
    neural networks, including their applicability to deep learning and the manner
    in which these models imitate the fundamental processes carried out by the human
    brain.


    Artificial neurons make up the processing units that make up neural networks,
    which are collections of interconnected nodes. These networks take their design
    cues from real neurons, which are the essential building blocks of the brain.
    Artificial neurons and the connections between them form the basis for the intellectual
    capabilities of deep learning systems. Just as billions of neurons connected by
    synapses allow people to learn, see, and react to the environment around them,
    so do artificial neurons and their connections.


    # Anatomy of a Neural Network'
  - '[PAGE 31]


    Artificial neural networks are typically structured in layers, starting with an
    input layer, one or more hidden layers, and an output layer. Each layer consists
    of multiple artificial neurons, also known as nodes.


    Input Layer: The input layer is responsible for receiving raw data from the outside
    world. This data is then fed into the network to be processed. Each node in this
    layer represents a single feature from the input dataset.


    Hidden Layers: The hidden layers are where the actual processing is done via a
    system of connections characterized by weights and biases. These layers transform
    the input into something the output layer can use.


    Output Layer: The output layer is responsible for producing the final result or
    decision. The number of nodes in the output layer is often determined by the nature
    of the problem - for instance, a binary classification problem would have one
    node, while a multi-class problem would have nodes equivalent to the number of
    classes.


    Each node is interconnected with nodes of the preceding and succeeding layers.
    These connections are'
  - '[PAGE 32]


    associated with weights, which dictate the importance or influence of a particular
    input. Furthermore, each node has a bias that allows the activation function''s
    threshold to be shifted.


    # Learning in a Neural Network


    Given a collection of input-output pairs, the process of "learning" in neural
    networks is making adjustments to these weights and biases in accordance with
    the error that the network generates. A loss function is used to calculate this
    error. A loss function is a function that measures the difference between the
    prediction made by the network and the actual output.


    Backpropagation is the process of updating the weights and biases of a network
    by sending an error signal back through the network and then propagating that
    error. When trying to identify the ideal collection of weights and biases that
    will result in the smallest possible loss function, optimization procedures such
    as gradient descent are utilized.


