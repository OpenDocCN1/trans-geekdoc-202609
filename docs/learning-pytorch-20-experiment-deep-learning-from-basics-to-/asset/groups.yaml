    ## 学习 PyTorch 2.0


    ![](img/286c3edb31e3a341cc18ae23104da014_0_0.png)


    Matthew Rosch


    ## 前言


    本书是一本全面指南，旨在帮助读者理解并运用 PyTorch 2.0 进行深度学习应用。本书首先介绍了 PyTorch、它相对于其他深度学习框架的诸多优势，以及它与
    CUDA 结合实现 GPU 加速的方法。接着，我们深入 PyTorch 的核心——张量，学习它们的不同类型、属性和操作。通过逐步示例，读者将学会对张量执行基本算术运算、操作张量，并理解与张量形状相关的错误。


    本书有相当一部分内容专门用于演示如何构建简单的 PyTorch 模型，包括上传和准备数据集、定义架构、训练和预测，并提供了真实世界数据集的动手练习。随后，本书转向探索
    PyTorch 的 nn 模块，并详细比较了不同类型网络（如前馈网络、RNN、GRU、CNN）及其组合。


    此外，本书深入探讨了训练过程和 PyTorch 的 optim 模块，概述了诸如梯度下降、SGD、小批量梯度下降、动量、Adagrad 和 Adam 等优化算法。另有单独一章聚焦
    PyTorch 2.0 中的高级概念，如模型序列化、优化、分布式训练和 PyTorch 量化 API。


    在最后几章中，本书讨论了 TensorFlow 2.0 与 PyTorch 2.0 之间的差异，以及使用 ONNX 将 TensorFlow 模型迁移到 PyTorch
    2.0 的逐步过程，并概述了在此过程中遇到的常见问题及解决方法。


    在本书中，你将学到：


    -   全面介绍用于深度学习的 PyTorch 和 CUDA。

    -   对 PyTorch 张量的深入理解和操作。

    -   构建简单 PyTorch 模型的分步指南。

    -   深入了解 PyTorch 的 nn 模块，并比较各种网络类型。

    -   训练过程概述，以及探索 PyTorch 的 optim 模块。

    -   理解 PyTorch 中的高级概念，如模型序列化和优化。

    -   了解 PyTorch 中的分布式训练。

    -   使用 PyTorch 量化 API 的实用指南。


    ## 序言


    亲爱的读者，我们很高兴带你踏上一段激动人心的冒险，进入 PyTorch 2.0 的迷人世界。本书经过精心打磨，力求成为一部详尽的参考书，旨在阐明深度学习复杂的地形。它的目标是让你从一名好奇的爱好者转变为一名熟练的实践者，为你提供正确使用
    PyTorch 所需的理论理解和实践技能。当我们踏上这段发现之旅时，我们希望你能完全参与其中，检验你先前持有的信念，并拓宽你对深度学习这一迷人领域的视野。


    本书的第一部分为 PyTorch 的基本原则奠定了坚实的基础。张量，作为 PyTorch 的基本构建元素，在前几章中得到了充分的讨论。这些早期的章节将引导你逐步理解张量，以及构建和操作张量的过程。通过逐步增加主题的难度，本书将确保你在继续学习更高级的概念之前，已牢固掌握基础知识。


    随着我们进一步深入 PyTorch 的内部运作，本书开始介绍基础模型和更复杂模型的开发。我们借助一些示例来剖析构成这些模型的众多部分。你将学习如何创建和训练各种神经网络，包括前馈神经网络、循环神经网络，以及更高级的
    GRU 和 CNN 模型。由于本书将理论解释与实际示例相结合，你将能够把书中所学应用到现实场景中，这有助于加深对所述各种概念和方法的理解。


    在初步了解神经网络之后，本书接下来讲解训练过程的知识。解开优化算法之谜——有时被称为“驱动神经网络学习的引擎”——是这项工作中最重要的方面之一。本书以全面且易于理解的方式解释了每种算法，从基础的梯度下降一直讲到更复杂的自适应矩估计。借助这些知识和所完成的练习，你现在将有能力使用
    PyTorch 构建并训练健壮的模型。


    在本书的后续章节中，我们深入探讨 PyTorch 编程语言中更高级的原理。你将获得有关模型序列化和优化、分布式训练以及使用 PyTorch 提供的量化 API
    的知识。此外，我们还研究了 TensorFlow 2.0 与 PyTorch 2.0 之间的联系，对两者的优缺点进行了比较和对照。通过这样做，本书为你提供了必要的知识，以便选择最能满足你需求的框架。


    当我们踏上这段冒险之旅时，我们希望你能以开放的心态和充满好奇的头脑来对待每一章。无论你是刚刚开始深度学习的初学者，还是希望提升技能的经验丰富的专业人士，本书都能为你提供有价值的内容。我们衷心希望，当你读完这本书时，你不仅能全面理解
    PyTorch 2.0，还能树立起将所学应用于现实世界的自信。让我们不要再浪费时间，一起直接进入这激动人心的冒险吧，好吗？欢迎来到 PyTorch 2.0！


    ## 学习 PyTorch 2.0


    利用 Pythonic PyTorch 的全部潜能，从基础到复杂模型进行深度学习实验


