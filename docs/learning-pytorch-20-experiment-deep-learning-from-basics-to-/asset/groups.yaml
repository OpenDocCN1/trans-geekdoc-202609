    \ the loss function and the Adam optimizer.\n\nA loss function, in the context\
    \ of machine learning and deep learning, is a method of evaluating how well an\
    \ algorithm models the given data. If the predictions deviate too much from the\
    \ actual results, the loss function would output a large number. Good predictions\
    \ result in a small number.\n\nIn this scenario, we're using the Mean Squared\
    \ Error (MSE) loss. This is a popular loss function for regression problems. It\
    \ works by calculating the average squared differences between the predicted and\
    \ actual values. The squaring is necessary to remove any negative signs. It also\
    \ amplifies the impact of larger errors. The equation for MSE is:\n\nMSE = 1/n\
    \ Σ(actual - predicted)²\n\nWhere Σ is a sum over all examples, n is the total\
    \ number of examples, and actual - predicted represents the difference between\
    \ the actual and predicted values for each example.\n\nAdam (Adaptive Moment Estimation)\
    \ is a method that computes adaptive learning rates for each parameter. It combines\
    \ the perks of two other extensions of stochastic gradient descent. Namely:\n\
    - AdaGrad: Which scales down the learning rate for each parameter adaptively,\
    \ so parameters with larger gradients that are updated more also have their learning\
    \ rate reduced more.\n- RMSProp: Which also scales down the learning rate according\
    \ to the magnitude of the gradients, but unlike AdaGrad, it uses a moving average\
    \ of the squared gradient, so it doesn't decrease as fast.\n\nAdam, in particular,\
    \ computes adaptive learning rates through estimations of both the first-order\
    \ moments (the mean) and the second-order moments (the uncentered variance) of\
    \ the gradients.\n\nThe algorithm maintains a separate learning rate for each\
    \ weight in the model and adaptively adjusts them over time. This leads to good\
    \ performance with less sensitivity to the initial learning rate compared to other\
    \ gradient descent optimizations.\n\nThe name \"Adam\" comes from the method's\
    \ adaptive moment estimation, and it has been empirically shown to work well in\
    \ practice and compared to other adaptive learning-method algorithms.\n\nNow that\
    \ we've covered the basics of the loss function and the optimizer, we'll be in\
    \ a better position to understand the training process, which involves using the\
    \ optimizer to minimize the loss function.\n\n## Training Iterations\n\nTo train\
    \ the model, we need to iterate over our training data in epochs. An epoch is\
    \ one complete pass through the entire training data. During each epoch, we perform\
    \ the following steps:\n- Run a forward pass on the input data through the model\
    \ to get the predictions.\n- Compute the loss based on the difference between\
    \ the model's predictions and the actual values.\n- Run a backward pass through\
    \ the model (backpropagation) to compute the gradients of the loss with respect\
    \ to the model's parameters.\n- Use the optimizer to adjust the model's parameters\
    \ in a way that minimizes the loss.\n\nBelow is an example of a simple training\
    \ loop in PyTorch. We'll use a relatively small number of epochs (e.g., 100) for\
    \ demonstration purposes:\n\n```\n# Number of epochs\n```\n\n```\nepochs = 100\n\
    ```\n\n```\n# Store the losses\n```\n\n```\nlosses = []\n\nfor epoch in range(epochs):\n\
    \    # Forward pass\n    y_pred = model(x_train)\n    # Compute loss\n    loss\
    \ = criterion(y_pred, y_train)\n    # Store the loss\n    losses.append(loss.item())\n\
    \    # Print loss every 10 epochs\n    if epoch % 10 == 0:\n        print(f'Epoch\
    \ {epoch}, Loss: {loss.item()}')\n    # Zero gradients\n```\n\n```\noptimizer.zero_grad()\n\
    \n# Backward pass\n\nloss.backward()\n\n# Update weights\n\noptimizer.step()\n\
