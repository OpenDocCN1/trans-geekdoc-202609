    \ view() 之前调用 contiguous()。\n\n```\n# View the tensor\n\nviewed_tensor = tensor.view(2,\
    \ 4)\n\nprint(\"\\nViewed Tensor:\")\n\nprint(viewed_tensor)\n```\n\n输出：\n\n```\n\
    Viewed Tensor:\ntensor([[1, 2, 3, 4],\n    [5, 6, 7, 8]])\n```\n\n### 堆叠张量序列\n\
    \nstack() 函数用于沿新维度连接一系列张量。所有张量需要具有相同的大小。\n\n```\n# Create two tensors\n\ntensor1\
