    # ### OpenBLAS


    OpenBLAS is an open source implementation of the Basic Linear Algebra Subprograms
    (BLAS) API with many hand-crafted optimizations for specific processor types.
    OpenBLAS developed at the Lab of Parallel Software and Computational Science,
    ISCAS.


    OpenBLAS added implementations of linear algebra kernels for several processor
    architectures. OpenBLAS is a fork of GotoBLAS2, which was created by Kazushige
    Goto at the Texas Advanced Computing Center.


    For information, see OpenBLAS.


    # ### NVIDIA Collective Communications Library


    The NVIDIA Collective Communications Library (NCCL) implements multi-GPU and multi-node
    communication primitives that are performance-optimized for NVIDIA GPUs. NCCL
    provides routines such as all-gather, all-reduce, broadcast, and reduce-scatter,
    that are optimized to achieve high bandwidth over PCIe and NVLink interconnect.


    > Note: This library is usually pronounced as the word "nickel" [nikuhl].


    For information, see NVIDIA Collective Communications Library.


    # ### Bazel


    Bazel is a build tool that builds code quickly and reliably. Supported build tasks
    include running compilers and linkers to produce executable programs and libraries,
    and assembling deployable packages.'
