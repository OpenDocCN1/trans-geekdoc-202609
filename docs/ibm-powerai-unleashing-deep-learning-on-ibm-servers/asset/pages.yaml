    ```\n\ndefined graph\n\n```\nwith tf.Session() as sess:\n    sess.run(tf.global_variables_initializer())\n\
    \    for epoch in range(num_epochs):\n        epoch_loss = 0\n        buffer =\
    \ []\n        buffer_label = []\n        with open('train_hot_vectors.pickle',\
    \ 'rb') as train_vec:\n            for i in range(line_sizes['train']):\n    \
    \            hot_vector_line = pickle.load(train_vec)\n                buffer.append(hot_vector_line[0])\n\
    \                buffer_label.append(hot_vector_line[1])\n```\n\n```\nif len(buffer)\
    \ >= batch_size:\n    cost_iter = sess.run(optimizer, cost,\n        feed_dict={in_placeholder:\
    \ buffer, y: buffer_label})\n    epoch_loss += cost_iter\n    buffer = []\n  \
    \  buffer_label = []\n```\n\n```\nprint('Epoch {}. Total loss: {}'.'.format(epoch+1,\
    \ epoch_loss))\n```\n\n```\ncorrect = tf.equal(tf.argmax(nn_output, 1), tf.argmax(y,\
    \ 1))\naccuracy = tf.reduce_mean(tf.cast(correct, 'float'))\n```\n\n```\nwith\
    \ open('test_hot_vectors.pickle', 'rb') as train_vec:\n    buffer = []\n    buffer_label\
    \ = []\n```\n\n```\nfor i in range(line_sizes['test']):\n    test_vector_line\
    \ = pickle.load(train_vec)\n    buffer.append(test_vector_line[0])\n    buffer_label.append(test_vector_line[1])\n\
    ```\n\n```\nprint('Accuracy using test dataset: {}')\n.format(accuracy.eval({in_placeholder:\
    \ buffer_test})))\n```"
