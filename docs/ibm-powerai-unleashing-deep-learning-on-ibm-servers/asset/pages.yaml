  md: '# 3.1.2 IBM Power Systems for deep learning


    As the main part of the solution, IBM PowerAI relies on both Power Systems servers
    and NVIDIA GPUs to deliver maximum performance and a reliable solution for DL
    workloads. This is a software offering, hardware is not included with IBM PowerAI,
    but it is required for the solution to run.


    # IBM Power System S822LC for High Performance Computing (8335-GTB) server


    The IBM Power System S822LC for High Performance Computing is the chosen platform
    for running DL workloads. This server benefits from POWER8 CPUs plus dedicated
    P100 GPUs from NVIDIA to support demanding workloads, as the typical DL workload
    during the training phase.


    The IBM Power System S822LC for High Computing was designed and built in collaboration
    with the OpenPOWER partners NVIDIA, Mellanox, and Wiston to track high-performance
    and technical computing workloads. This is the first server to incorporate NVIDIA
    NVLink technology into the processor technology. For more information, the NVIDIA
    NVlink website.


    This system is designed to provide the highest performance and greatest efficiency
    for workloads that use GPU acceleration, including CFD and molecular modeling
    applications. GPU acceleration is also used extensively in machine learning (ML),
    and cognitive workloads.


    This system supports up to four NVIDIA Tesla P100 GPUs, which are connected through
    the NVIDIA NVLink. Each node can handle up to 1 TB of DDR4 memory, supports Mellanox
    100 Gbps (Enhanced Data Rate (EDR)) InfiniBand adapters for interconnect. Large
    clusters accommodate high-speed interconnect between nodes.


    The system also includes the following items:


    +   - Choice of air-cooled or water-cooled models for greater thermal efficiency

    - Choice of NVMe-based storage devices for greater performance

    - 100 Gbps InfiniBand adapters that use Mellanox ConnectX-4 technology


    For computationally rich high-performance or technical computing workloads that
    do not benefit from GPU acceleration, IBM Power System S822LC Technical Overview
    and Introduction, REDP-5283.


    # IBM POWER9 servers: IBM Power System AC922 server


    The IBM Power AC922 server is the next generation of the IBM processor-based systems,
    and is designed for DL and AI, high-performance computing (HPC).


    The IBM Power System AC822 (8335-GTW and 8335-GTG) is an OpenPOWER Linux scale-out
    server. In 2 form factor, these two servers provide POWER9 single chip module
    processors, with up to 40 processor cores, coherently sharing 16 directly attached
    DDR4 inline memory module DIMMs. The supported memory DIMMs are 8 - 12 GB.


    These servers support the NVIDIA SXM2 form factor processor units (GPUs) with
    an NVLink2 interface. The system also contains four directly attached, Coherent
    Accelerator Processor Interface (CAPI)-enabled Gen4 Peripheral Component Interconnect
    Express (PCIe) slots.'
