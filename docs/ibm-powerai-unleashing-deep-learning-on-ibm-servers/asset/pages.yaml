  md: "# Model and training\n\nExample A-2 shows the sentiment_neural_net.py model\
    \ and training file.\n\nExample A-2 The sentiment_neural_net.py file\n\n```\n\
    import tensorflow as tf\nimport pickle\n\nx = tf.placeholder('float')\ny = tf.placeholder('float')\n\
    \nbatch_size = 1000\nnum_epochs = 1\n\ndef load_details():\n    with open('data_details.pkl',\
    \ 'rb') as details:\n        det = pickle.load(details)\n        return det\n\
    ```\n\nline_sizes = load_details()\n\n```\n# Creates the neural network model\n\
    def ff_neural_net(input_data):\n    neurons_h1 = 1500\n    neurons_h2 = 1500\n\
    \    neurons_h3 = 1500\n\n    output_neurons = 2\n\n    l1_weight = tf.Variable(tf.random_normal([[line_sizes['dict'],\
    \ neurons_h1]), name='w1')\n    l1_bias = tf.Variable(tf.random_normal([neurons_h1]),\
    \ name='b1')\n\n    l2_weight = tf.Variable(tf.random_normal([[neurons_h1, neurons_h2]),\
    \ name='w2')\n    l2_bias = tf.Variable(tf.random_normal([neurons_h2]), name='b2')\n\
    \n    l3_weight = tf.Variable(tf.random_normal([[neurons_h2, neurons_h3]), name='w3')\n\
    \    l3_bias = tf.Variable(tf.random_normal([neurons_h3]), name='b3')\n\n    output_weight\
    \ = tf.Variable(tf.random_normal([[neurons_h3, output_neurons]), name='wo')\n\
    \    output_bias = tf.Variable(tf.random_normal([output_neurons]), name='bo')\n\
    \n    l1 = tf.add(tf.matmul(input_data, l1_weight), l1_bias)\n    l1 = tf.nn.relu(l1)\n\
    \n    l2 = tf.add(tf.matmul(l1, l2_weight), l2_bias)\n    l2 = tf.nn.relu(l2)\n\
    ```"
