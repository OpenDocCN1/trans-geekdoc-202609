  md: '# Problem determination tools


    This appendix describes Linux tools that are frequently used to gather data from
    a running system. This appendix also describes troubleshooting practices.


    This appendix contains the following topics:


    +   * Logs and configuration data gathering tools

    * Troubleshooting pointers for Linux on Power

    * Solving a RAID failure'
