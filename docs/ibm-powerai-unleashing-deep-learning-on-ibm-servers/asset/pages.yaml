  md: 'IBM Knowledge Center is good source for error analysis codes, tools, procedures,
    and other resources to help you solve problems with Linux on Power, and especially
    for NVIDIA graphical processing units (GPUs) running in these systems.


    # Solving a RAID failure


    While a software RAID is not a requirement of IBM PowerAI, it is a preferred practice
    to mitigate against disk failure. Creating a RAID device is not mandatory in case
    of a failure of one of the disks IBM PowerAI, but it provides high availability
    (HA) in case of a failure of one of the disks (solid-state disks (HDDs) or hard
    disk devices (HDDs)) that are part of the RAID array. The steps that are required
    to create a two-disk RAID array are described in “Creating a RAID1 array” page
    82.


    # RAID failure


    This section covers the recovery procedure after the occurrence of one failure
    in one disk is part of a RAID array.


    This test assumes that a failure occurs in /dev/sda, where the PreBoot area is
    created.


    In this example, we completed the following sequence of steps to simulate the
    disk failure scenario and subsequent recovery. In case of an actual failure, we
    would have started from step 3.


    +   1. Confirm the current software RAID configuration.

    2. Simulate a failure in one disk (pseudo failure to /dev/sda).

    3. Remove the disk in /dev/sda.

    4. Add a disk and create a partition.


    # Confirming the current software RAID configuration


    To confirm the current software RAID configuration, run the following commands
    to check the state of the software-defined RAID:


    ```

    $ sudo mdadm --detail /dev/md0

    /dev/md 0:

