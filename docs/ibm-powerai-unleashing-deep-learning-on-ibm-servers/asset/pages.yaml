  md: '# TensorFlow


    TensorFlow started in 2011 as a proprietary system that was called DistBelief
    that was developed by Google Brain. Due to its success across the company''s applications,
    Google focused on improving DistBelief, which then became TensorFlow. The first
    open source version was released in 2017.


    TensorFlow is one of the well-known frameworks, and its usage has increased over
    time it is sponsored by Google, and it comes with several useful features:


    +   TensorFlow works in a Define-and-Run scheme that the compiler goes through
    all the code to create a static graph and then runs it. An advantage of this approach
    is that during the graph, TensorFlow can optimize the operations that are defined
    and the best way to run each one of them.


    +   TensorFlow was developed in C++ and has an interface for Python. TensorFlow
    has an interesting feature that is called TensorBoard, which is a GUI that you
    can use to visualize the graphs that you created and data is flowing through.


    +   The framework works GPUs and runs in a distributed mode. Running in Define-and-Run
    mode introduces a lack of flexibility because the graph is static, but also enables
    a better way to distribute the code across different nodes, ensures that the graph
    can be shipped, and runs equally in all of the GPUs.


    # Theano


    Theano is a numerical computation library like TensorFlow. Its development began
    at the University of Montreal in 2007, so it is one of the older frameworks. It
    is developed in Python, which is its only supported interface.


    Similar to TensorFlow, Theano also works in a Define-and-Run scheme where the
    graph is built first during compile, and then the processes flow through the graph
    during run time. Theano supports working with GPUs and can run in a distributed
    mode.


    Although the framework is stable and ready for use in production, in September
    2017, the development team announced that Theano''s development stopping after
    release 1.0¹² At the time of writing, the future of Theano is unknown. Theano
    is open source, so it is possible that its development might continue under new
    management.


    # Torch and PyTorch


    Even though these two frameworks look like and have the same C/C++ engine, they
    are not the same.


    Torch came first and its core engine was developed in C/C++ with interfaces for
    Lua and LuaIT as its scripting language. Torch was developed by research teams
    with Facebook, Twitter, and Google.


    PyTorch was developed by Facebook and released in 2017. The main purpose of PyTorch
    is to make Torch available with a Python interface because Lua is a language that
    is not often used among researchers and developers. Even though that was main
    purpose, PyTorch was designed in a way that PyTorch tightly integrates with the
    Torch core engine that is developed in C, improving memory management and optimization.


    PyTorch works in a Defined-by-Run scheme similar to Chainer and can run on speed
    other, not difficult to run by using GPUs, and has several pre-trained models.


    > ¹² https://groups.google.com/forum/#theano-users/PouqGBZubbt/rNCfeAEAWJ'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 1.3.2 A final word on deep learning frameworks


    There is not a bcm framework. The choice of framework depends on your need and
    context. At a high level, PyTorch and TensorFlow have been growing and becoming
    fit-all frameworks. Caffe has been around for some time, it is stable, and good
    for production, but specializes in computer vision. Theano is stable, one of the
    oldest, might be going away, and unless you already have Theano implementations,
