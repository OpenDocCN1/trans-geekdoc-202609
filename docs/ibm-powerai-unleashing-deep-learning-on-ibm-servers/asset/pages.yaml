  md: 'Bazel is a type of tool that Google uses to build its server software internally,
    expanded to build other software as well. For more information, see Bazel at GitHub
    and Bazel build.


    # OpenMPI


    OpenMPI is a Message Passing Interface (Mpi)³ library project combining technologies
    and resources from other projects: FT-MPI, LA-MPI, LAM/MPI, and PACX-MPI.


    Open MPI represents the merger between three well-known MPI implementations:


    +   - FT-MPI from the University of Tennessee

    - LA-MPI from Los Alamos National Laboratory

    - LAM/MPI from Indiana University

    - With contributions from the PACX-MPI team at the University of Stuttgart


    These four are the founding members of the OpenMPI development team.


    The OpenMPI code has three major modules:


    +   - OMPI: The MPI API and supporting logic

    - ORTE: The Open Run-Time Environment (support for better back-end runtime)

    - OPAL: The Open Portable Access Layer (utility and glue code that is used by
    OMPI and ORTE)


    For more information, see OpenMPI.


    > Uninstall any openmpi or libopenmpi packages before installing IBM Caffe or
    the Distributed Deep Learning (DDL) custom operator for TensorFlow. Purge any
    configuration files to avoid interference by running the following commands:


    $ dpkg -l | grep openmpi

    $ sudo apt-get purge ..


