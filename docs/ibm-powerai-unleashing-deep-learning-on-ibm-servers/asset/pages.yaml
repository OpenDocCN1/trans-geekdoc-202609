    # #2.3.3 Large Model Support


    When training large neural networks that are prevalent in the DL space for tasks
    such as high definition image recognition, large batch size tasks, highly deep
    neural networks, the amount of GPU memory that is available can be a significant
    limitation. To overcome this challenge in IBM PowerAI V1.4, IBM provides LMS,
    which uses main system memory with GPU memory to train these large-scale neural
    networks.


    LMS enables you to process and train larger models that do not fit within GPU
    memory space that is available. LMS uses the GPU memory and a fast interconnect
    (NVLink) to accommodate such large models and fetch only the working set in each
    instance to ensure the fastest computation possible while operating with a large
    batch size outside the GPU memory space.


    To accommodate models that occupy both system and GPU memory, LMS performs many
    CPU to GPU copy operations. There is regular transfer of data from system to GPU
    memory during training phase. To perform this operation without inducing delays
    that impact computation time, the system requires a high-bandwidth interconnect
    between the CPU and the GPU. On IBM Power Systems, LMS can take advantage of the
    higher bandwidth provided by NVLink, which is described in 2.3.1,"NVLink and NVLink
    2.0" on page 24.


    > ¹Trishul Chilambi, et al. "Project Adam: building an efficient and scalable
    Deep Learning system", OSDI''14 Proceedings of the 11th USENIX conference on Operating
    Systems Design and Implementation.\² Dean, et al. "Large-Scale Distributed Deep
    Networks. Advances in Neural Information Processing Systems (NIPS)", Neural Information
    Processing Systems Foundation, Inc., 2012.


    IBM PowerAI: Deep Learning Unleashed on IBM Power Servers'
