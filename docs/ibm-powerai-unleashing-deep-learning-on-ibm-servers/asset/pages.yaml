    | | | | | |

    | | | | | |


    Figure 2-2 Neural networks diagram


    To use LMS with IBM Caffe, add the following flag during the run time:

    -lms <size in K8>


    This flag sets the threshold size for determining which memory allocations must
    happen on the CPU memory, and which must be on the GPU memory. For example:

    -lms 1028


    When you use this parameter, any memory chunk larger than 1028 KB is processed
    on the main system memory address space by the CPU, and only fetched to GPU memory
    when required for computation. So, smaller values result in a more aggressive
    use of LMS and a greater amount of system memory is used. However, large values,
    such as 100,000,000, essentially disable the LMS feature and ensure that all chunks
    are allocated to GPU memory.


    This parameter can be used to control the performance tradeoff because more data
    being brought in from the CPU during the run time results in a runtime impact.


    An alternative way to use LMS within your environment is by using the lms_frac
    flag:

    -lms_frac <0 < x < 1.0>'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'In this instance, LMS does not use system memory for allocating chunks of data
    until a certain threshold of GPU memory is allocated. For example:


    -lms_frac 0.75


    Until more than 75% of the GPU memory that is available is allocated, the system
    can assign chunks of any size to the GPU. The advantage to method this is that
    you can essentially disable the LMS function for faster training of smaller networks,
    or have more efficient utilization of GPU memory for larger networks.


