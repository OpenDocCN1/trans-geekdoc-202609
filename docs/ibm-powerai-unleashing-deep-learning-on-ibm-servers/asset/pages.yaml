    # 7.3 Use case: High-performance computing environment


    IBM Power Systems have been used within high-performance computing (HPC) environments
    since the days of the original IBM RS/6000 SP clusters. The scalability and flexibility
    of the hardware platform makes it an attractive choice for the HPC community.
    This relationship continues with the advent and popularity of DL. Usage of the
    GPU-enabled IBM Power Systems for HPC environments is increasing. These servers
    provide an alternative model compared to traditional HPC environments, where it
    was expected to require the largest server models with most quantity of resources,
    now the GPU-enabled models provide the same processing power in a much smaller
    footprint. Where previously rooms were required, we can now talk in quantities
    of racks.


    Presently, there are many scientists conducting DL frameworks in such clusters.
    The largest announced environment at the time of writing is one that will be adopted
    for the Collaboration of Oak Ridge, Argonne, and Livermore (CORAL) project for
    the US Department of Energy. This environment will be constructed by using the
    recently announced POWER9 based Power AC922 machines. Especially for the DL frameworks
    in HPC, users manage the environment with job scheduling software, such as IBM
    Spectrum LSF®,, and recently with Spark technology to enable distributed parallel
    processing.


