- pgno: 27
  md: 'The filter is initialized randomly before a CNN is trained, and during the
    training process, it is adjusted and its size is defined by whoever is designing
    the CNN based on their needs.


    After the convolution, it is necessary to add non-linearity to the result because
    most of the data and applications are non-linear and the convolutional process
    generates linear results. In Figure 1-10, all the negative pixels are turned to
    0 by using an operation called rectified linear unit (ReLU).


    ![](img/f6f95c5defc8b3406a94a86b8d202807_27_0.png)


    Figure 1-10 Rectified linear unit graph


    +   The next phase, pooling, reduces the dimensions of the feature map that are
    generated in the convolutional phase and then rectifies the previous phase. This
    process is known as downsampling. Even though the dimensionality is reduced, the
    most important information is retained.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'There are different methods of pooling, such as extracting the average of a
    specific group or getting the highest number. This process is similar to the convolutional
    process where a specific area is defined and then moved across (without overlapping)
    and the highest number is kept (in the max pooling scenario), as shown in Figure
    1-11.


    | 1 | 0 | 3 | 6 |

    | 2 | 4 | 5 | 2 |

    | 2 | 6 | 2 | 0 |

    | 3 | 4 | 1 | 7 |


    Figure 1-11 Max pooling process example


    +   - Finally comes the last phase, the fully connected layer. This is a classical
    FFNN with a specific activation function at the output layer (usually a softmax
    one). The idea is to learn and classify the features that were extracted in the
    previous phases. It is fully connected because as in an FFNN, all neurons from
    a layer are connected to all neurons in the next layer.


    It is worth noting that the convolutional, rectified, and pooling phases can be
    repeated before reaching the fully connected phase to extract even more features
    from the object.


    During the training phase, a back-propagation algorithm is used to apply a gradient
    descent across all the fully connected neurons and into the convolutional filters
    to adjust their weights and values.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 1.2.5 Difference between a classical and deep neural networks


    The answer to the question "What is the difference between classical and deep
    neural networks?” is straightforward. A deep neural network has more than one
    hidden layer in its architecture, usually even more than two or three.


    It is possible to have deep neural networks in many different neural network models,
    such as a deep FFNN or a deep convolutional neural network, as shown in Figure
    1-12.


    ![](img/f6f95c5defc8b3406a94a86b8d202807_29_0.png)


    Figure 1-12 Difference between a classical network and a deep neural network


    So, why use more than one hidden layer, and what are the advantages of doing so?


    Using only one hidden layer has proved that it is possible to approximate any
    function based on the error that it is generated.7 However, the point is that
    in most approximations in more complex situations, neural networks with one hidden
    layer do not have accuracies greater than 99%. Yet there can be many reasons for
    that situation, and there are many studies and research in this area, one thing
    that has been tried and shown successful results is using extra hidden layers.


    Adding more hidden layers to a neural network enables it to better generalize
    unknown data (not in the training set). This characteristic is essential and helps
    greatly with the image and object recognition areas; with more hidden layers,
    it is possible to recognize a set of features in a better way.


    However, deep neural networks require much more processing power and powerful
    hardware that can reach those levels of processing.


    > 7 https://en.wikipedia.org/wiki/Universal_approximation_theorem'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# 1.2.6 Neural networks versus classical machine learning algorithms


    Both neural networks (in addition to DL) and classical ML offer ways to train
    models and classify data.


    If you take pictures of a car and a motorcycle and show them to any human being,
    you expect them to be able to answer which one is the car and which one is the
    motorcycle. The reason is that they have seen many cars and motorcycles in their
    lives so that they know the specific characteristics and shape of each one. Machine
    tries to learn by studying objects characteristics and behaviors of each and becoming
    the same way humans do. However, machines and humans can fail to identify objects
    sometimes because they are not familiar with them or not know specific things
    about.


    For a machine to do a classical ML classification of an image, you must select
    manually its relevant features to train that specific model (logistic regression
    or any other). These features can be used by the model to identify and classify
    the image to train this kind of model, and also to perform predictions on it.
    The data (images in this case) must be prepared from all the features that were
    previously extracted to feed the model.


    By using a neural network, there is no need to use code to extract those features
    from the image beforehand because you provide the image directly to the neural
    network algorithm (the image layers, for example red, green, and blue (RGB) must
    be sent before they go into the model).


    Even neural networks seem more promising, they require much machine power and
    large data sets to make the model effective.


    When classical ML algorithms, it is possible to train your model in several classifiers
    and check which one produces the best results, and if needed, work with more than
    one in conjunction to achieve even more. You also need to know the best features
    to extract that the model can perform best for your data set.


    Usually, for more applications where you already have most of the features, for
    example, revenue prediction, it might be easier and faster to work with classical
    ML algorithms. Especially for non-structured data such as sounds, text, images,
    and others, neural networks can be straightforward even though they require more
    processing and in many cases, a great deal of data.


    It is possible to use neural networks for classical regression and classification
    because they provide better accuracy when trained with the expected amount of
    data. In several cases for simple classification or regressions, there is not
    much data to use in a training set, which makes neural networks performance insufficient.


    If you do not have much data or lack machine power, it is better to stick with
    classical ML algorithms; otherwise, add neural networks options to your stack
    and check which one performs better for your specific scenario.


