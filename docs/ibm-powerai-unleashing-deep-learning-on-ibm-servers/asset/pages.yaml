    Hyperparameter tuning is a key feature in DLI. There are three definitions of
    it:


    +   - Parameters tuning


    For a network to train, different parameters that are input to the model affect
    the training result, such as time cost or the accuracy. Parameters tuning helps
    to find relatively good parameters compared to random input manually.


    +   - Tuning task


    One of the tasks that you start from UI to tune the hyperparameters for a model.


    +   - Tuning job


    One tuning task gets many tuning jobs that run with a set of hyperparameters.'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'To tune the model hyperparameters, complete the following steps:


    +   1. To run a hyperparameter search task, select a training model, click its
    name, and select **Hyperparameter Tuning** → **New Tuning** to start the configuration,
    as shown in Figure 6-50.


    ![](img/f6f95c5defc8b3406a94a86b8d202807_207_0.png)


    **Figure 6-50** Starting a hyperparameter tuning task


    In the ways, you can the policies and policies for this tuning task. The search
    type, DLI supports the policies Random Search, TPE, and Bayesian. The following
    section explains each one of them:


    +   - **Random Search**nRandom Search algorithms generate random pairs of combinations
    by using the input hyperparameters in the UI, and finds the best of the tuning
    jobs results with these random combinations of hyperparameters.

    - **TPE**nAutomatically chooses a group of better parameters for objective function
    optimization in ML by evaluating some tuning (training) jobs. In principle, it
    uses a Parzen window to distinguish the selected samples on each dimension of
    the parameters with a specified random number generator, then applies a Gaussian
    mixture model with the loss value to derive a new random number generator for
    new samples until finding some good parameters combination for the training session.

    - **Bayesian**nRuns tuning and training jobs with random chosen parameters in
    batches. In each batch, it calculates the possibility of good parameters corresponding
    to loss value and uses this possibility as a distribution that comes from theoretical
    deduction to estimate the Gaussian density of the good parameters. Eventually,
    it finds a good parameter combination by changing the distribution.


    For more information about these policies, see 6.6.3, "Hyperparameter optimization
    and search" on page 147.


    For learning rate, weight decay, and momentum parameters, you can use a range,
    such as 0.1 - 0.2. If you select Random Search as the search type, it also supports
    discrete point values, such as 0.1, 0.2, 0.3. For more information, see Figure
    6-51 on page 195.


    194 IBM PowerAI: Deep Learning Unleashed on IBM Power Systems'
