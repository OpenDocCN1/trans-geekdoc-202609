  md: '# Distributed Deep Learning TensorFlow


    DDL TensorFlow is a library that enables TensorFlow to spread the workload over
    several nodes. When training models grow, they can reach a point where the data
    sets cannot fit into a one or multiple GPUs in a server. In such cases, the distributed
    TensorFlow architecture offers a great advantage, enabling several servers to
    support this workload, resulting in radically reduced processing time.


    For more information, see Distributed Deep Learning TensorFlow.


    # Chainer


    Chainer is a DL framework, primarily sponsored by Preferred Networks that focuses
    on the flexibility to write complex architectures simply and intuitively.


    Chainer adopts a Define-by-Run scheme, for example, the network is dynamically
    defined through actual forward computation. More precisely, Chainer stores the
    history of computation instead of programming logic. This strategy enables it
    to fully take advantage of the power of programming in Python. The Define-by-Run
    scheme is the core concept of Chainer.


    Table 3-20 shows the Chainer versions for IBM PowerAI.


