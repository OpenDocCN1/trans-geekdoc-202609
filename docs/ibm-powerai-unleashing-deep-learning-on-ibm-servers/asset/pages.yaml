- pgno: 35
  md: '# 2.1 What is IBM PowerAI


    IBM PowerAI is a package of software distributions for many of the major deep
    learning (DL) software frameworks for model training, such as TensorFlow, Caffe,
    Chainer, Torch, and Theano, and their associated libraries, such as CUDA Deep
    Neural Network (cuDNN), and nvCaffe. They are extensions that take advantage of
    accelerators, for example, nvCaffe and NVIDIA extension to Caffe so that it can
    run on graphical processing units (GPU). As with nvCaffe, the IBM PowerAI solution
    is optimized for performance by using the NVLink-based IBM POWER S82LC for High
    Performance Computing server, and its successor, the IBM Power AC922 for High
    Performance Computing. The stack also comes with supporting libraries, such as
    Deep Learning GPU Training System (DIGITS), OpenBLAS, Bazel, and NVIDIA Collective
    Communications Library (NCCL).


    # 2.1.1 Contents of IBM PowerAI IBMAI Release 4


    The IBM PowerAI package is released with all of the upgraded versions of each
    framework and libraries. However, under special circumstances, with an increase
    in demand, targets for the next release. Table 2-1 shows the IBM PowerAI software
    stack.


    Table 2-1 IBM PowerAI software stack


    | IBM PowerAI software stack (basic) |

    |---||

    | Deep learning frameworks | |

    | Core | TensorFlow | IBM Caffe |

    | Other frameworks | BLVC Caffe | nvCaffe |

    | Chainer | Torch |

    | Theano | N/A |

    | Libraries and other components | |

    | Major components | DIGITS | NCCL |

    | OpenBLAS | Bazel |

    | Distributed DL | IBM Distributed Deep Learning (DDL) for IBM Caffe |

    | TensorFlow Operator for DDL Library


    # 2.1.2 Minimum hardware requirement for IBM PowerAI


    IBM PowerAI can be run on POWER8 and IBM POWER9TM servers. However, to run the
    DL platform, IBM recommends the following configuration in those servers:


    +   * POWER8 CPUs

    * 128 GB of memory

    * NVIDIA Tesla P100 or V100 with NVLink GPUs

    * NVIDIA NVLink interface to Tesla GPUs


    You can download at no cost to use the current version of IBM PowerAI from Index
    of /software/server/POWER/Linux/midi/ubuntu.


    > > "Note: The instruction guide for IBM PowerAI can be found in the readme file."'
