    # # 6.3 Key features of Deep Learning Impact


    This section introduces some key features of DLI.

    As a DLI development and management platform, the major targets of DLI are the
    following ones:


    +   - To improve the accuracy of the neural network model

    - To improve the training efficiency when processing a large-scale data set

    - To provide real-time response for a user inference request after the model is
    deployed


    To achieve these targets, DLI provides parallel data processing, hyperparameter
    tuning, parallel training with optimized gradient and weight reducing algorithm,
    training advisor, inference as service functions, and others.


    # ## 6.3.1 Parallel data set processing


    A DLI data set is used for model tuning, training, testing, and validation. Data
    set management features can help with a user management data set. DLI data set
    can create, remove, and list data, monitor a data set''s status, and view data
    set details. It can support and manage the following data set types:


    +   - LMDB and TFRecords

    - Images for classification

    - Images for object detection

    - Images vector

    - CSV data

    - Raw data


    When creating a data set, DLI can:


    +   - Randomly shuffle the data

    - Split a data set to train data set, test data set, and validate data data set

    - Resize images

    - Convert data to LMDB or TFRecords'
