    ᵃ. DDL custom operator for TensorFlow.


    This release of IBM PowerAI includes a technology preview of the DDL custom operator
    for TensorFlow. The DDL custom operator uses CUDA-aware OpenMPI and NCCL to provide
    high-speed communications for distributed TensorFlow.


    The DDL custom operator can be found in the ddl-tensorflow package. For more information
    about DDL and the TensorFlow operator, see the following files:


    +   - /opt/DDL/ddl/doc/README.md

    - /opt/DDL/ddl-tensorflow/doc/README.md

    - /opt/DDL/ddl-tensorflow/doc/README-API.md


    The TensorFlow operator makes it easy to enable Slim-style models for distribution.
    The package includes examples of Slim models that are enabled with DDL, which
    you can access by running the following commands:


    ```

    $ /opt/DDL/ddl-tensorflow/bin/ddl-tensorflow-activate

    $ ddl-tensorflow-install-samples <someid>

    ```


    Those examples are based on a specific commit of the TensorFlow models repository
    with a small adjustment. If you prefer to work from an upstream clone, rather
    than the packaged release, run the following commands:


    ```

    $ git clone https://github.com/TensorFlow/models.git

    $ cd models

    $ git checkout 11833ec646a1fe961def44224860359f0a9alb

    $ git revert fc7342b0f47ec5c7a7020202ada48661bd373d

    $ cp /opt/ddl-tensorflow/examples/slim/train_image_classifier.py slim/

    ```


    Unlike any other framework, TensorFlow can do partial subgraph computation, which
    involves taking a subsample of the total neural network and then training it,
    apart from the rest of the network. This is also called model parallelization,
    and allows for distributed training.


    For more information, see TensorFlow and GitHub - TensorFlow.'
