- pgno: 124
  md: '# Optimizations in IBM Caffe


    The IBM Caffe package (caffe-ibm) in IBM PowerAI is based on BVLC Caffe and includes
    optimizations and enhancements from IBM:


    +   - CPU and GPU layer-wise reduction


    +   - Large Model Support (LMS)


    +   - IBM PowerAI DDL


    # Command-line options


    IBM Caffe supports BVLC Caffe options and adds new ones to control the enhancements:


    +   -bvlc: Enables CPU and GPU layer-wise reduction.


    +   -threshold: Tunes CPU and GPU layer-wise reduction. If the number of parameters
    for one layer is greater than or equal to the threshold, their accumulation on
    the CPU is done in parallel. Otherwise, the accumulation is done by one thread.
    By default, it is set to 2,000,000.


    +   -ddl [-option1 param -option2 param]: Enables DDL with an optional space-delimited
    parameter string. The supported parameters are as follows:


    ```

    mode <mode>

    - dummy_iter <N>

    - dev_sync <0, 1, 2>

    - rebind_iter <N>

    - dbg_level <0, 1, 2>

    ```


    +   -ddl_update: This option instructs Caffe to use a custom version of the ApplyUpdate
    function that is optimized for DDL. It is faster, although it does not support
    clipping, so it is off by default. It can be used in networks that do not support
    clipping.


    +   -ddl_align: This option ensures the gradient buffers have a length that is
    a multiple of 256 bytes and start addresses that are multiples of 256, which ensures
    cache alignment on multiple platforms and alignment with NCCL caches. This option
    is off by default.


    +   -ddl_database_restart: This option ensures that every learner always looks
    at the same data set during an epoch, which enables a system to cache only the
    pages that are touched by the learners that are contained within it. It can help
    reduce the number of learners that are needed for a given data set by establishing
    a known database footprint per system. This option is off by default.


    +   -lms <size>: This option enables LMS with a threshold of <size>.


    +   -lms_frac <fraction>: This option tunes LMS memory usage between the CPU and
    GPU.


    Table 4-2 IBM Caffe command-line options


    | Feature | bvlvc | -ddl | -lms | -gpu |

    |---|---|---|---||

    | CPU/GPU layer-wise reduction | Do not specify. | Do not care. | Do not care.
    | Multiple GPUs |

    | DDL | Do not care. | Do specify. | Do not care. | Do not specify. |

    | LMS | Do not care. | Do not care. | Do specify. | Do not care. |'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'LMS is effective regardless of the other options that are used if -lms is specified.
    For example, you can use DDL and layer-wise together.


    CPU and GPU layer-wise reduction is enabled only if multiple GPUs are specified
    and layer_wise_reduce is false.


    Using multiple GPUs with DDL is specified by the Message Passing Interface (MPI)
    rank file, so the -gpu flag can be used to specify multiple GPUs for DDL.


    # About CPU and GPU layer-wise reduction


    This optimization aims to reduce the running time of a multi-GPU training by using
    CPUs. In particular, gradient accumulation is offloaded to CPUs and done in parallel
    with the training. To get the best performance with IBM Caffe, use unnecessary
    applications that consume a high percentage of CPU.


    > Note: If you use a single GPU, IBM Caffe and BVLC Cafe have similar performance.


    The optimizations in IBM Caffe do not change the convergence of a neural network
    during training. IBM Caffe and BVLC Cafe produce the same convergence results.


    CPU and GPU layer-wise reduction is enabled unless the -bvlc command-line flag
    is used.


    # About PowerAI Distributed Deep Learning


    For more information using IBM PowerAI DDL, see /opt/dl/ddl-doc/doc/README.md.


    # About Large Model Support


    IBM Caffe with LMS loads the neural model and data set in system memory and caches
    activity to GPU, enabling methods and the training batch size to scale significantly
    beyond what was possible. LMS is available as a technology preview.


    You can enable the LMS by adding -lms <size in KB>, for example -lms 1000. Then,
    any memory chunk larger than 100 KB is fetched to GPU memory, and fetched to GPU
    memory only when needed for computation. If you use a large value such as -lms
    1000000000, it effectively disables the, and a small value means more aggressive
    LMS. The value is used to control the performance tradeoff.


    As a secondary option, there is -lms_frac <1.0>. For example, -lms_frac 0.4, LMS
    does not affect effect when not least than 40% of GPU memory is expected to be
    taken. This is useful for disabling LMS for a small network.


    # Combining Large Model Support and Distributed Deep Learning


    ```

    LMS and DDL can be combined, by running the following command:

    $ mpirun -x PATH -LD_LIBRARY_PATH -rf 4x4x2.rf -n 8 cafe train -solver alexnet_solver.prototxt
    -d

    ```


    # Getting started with TensorFlow


    The TensorFlow home page has a variety of information, including tutorials, how
    to instructions, and a getting started guide.


    For more tutorials and examples, see the following resources:


    +   * TensorFlow Tutorials

    * TensorFlow Tutorial and Examples for Beginners with Latest APIs'
