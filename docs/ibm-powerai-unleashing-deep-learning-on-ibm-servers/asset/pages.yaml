- pgno: 113
  md: '# Note about Python setup tools and easy_install:


    The python easy_install packages can interfere with the proper functioning of
    some of the IBM PowerAI framework packages, including TensorFlow and Chainer.


    The IBM PowerAI packages include local copies of Python modules such as protobuf
    (TensorFlow) and pillow (Chainer) because they require versions newer than those
    that are provided by Canonical and Ubuntu. The <framework>-activate scripts set
    up the path that is needed to make it work (set PYTHONPATH to get the local copies
    priority over the system default versions).


    The easy_install utility adds a script that can create the system''s paths to
    be searched ahead of PYTHONPATH entries, which might result in protobuf or pillow
    failures in TensorFlow and Chainer.


    If easy-install runs as root, the problematic script can be in the following directory:
    /usr/local/lib/python2.7/dist-packages/easy-install.pth


    # Optimizing the environment


    To get the most out of the system, there is more tuning to perform, and in some
    cases tuning depends on the framework that used:


    +   * Enable Governor:

    * sudo apt-get install linux-tools-common linux-tools-generic cpufreqputils lsb-release

    * sudo cpower -c all frequency-set -g performance


    +   * SMT value for TensorFlow:

    This is a specific parameter to set for TensorFlow workloads. This reduces the
    CPU parallelism by changing the value of SMT from default (8) to the recommended
    (2).

    * sudo apt-get install powerpc-ibm-utils

    * sudo ppc64_cpu --smt=2


    If you are going to run other workloads in the system, it can negatively impact
    these workloads.


    +   * HW parameters valid for all frameworks:

    * Enable NVIDIA driver persistence mode:

    This prevents the driver from hanging during the run time, which removes any latency
    while waiting for driver initialization events:


    ```

    $ nvidia-smi -pm ENABLED

    Enabled persistence mode for GPU 00000002:01:00.00

    Enabled persistence mode for GPU 00000003:01:00.00

    Enabled persistence mode for GPU 0000000A:01:00.00

    Enabled persistence mode for GPU 00000008:01:00.00

    All done.

    ```


    +   * Set GPU clocks to the optimum value:

    $ sudo nvidia-smi -ac 715,1480

    Applications clocks set to "MEM 715, SM 1480" for GPU 00000002:01:00.00

    Applications clocks set to "MEM 715, SM 1480" for GPU 00000002:03:00.00

    Applications clocks set to "MEM 715, SM 1480" for GPU 00000002:04:00.00

    Applications clocks set to "MEM 715, SM 1480" for GPU 00000002:08:00.00


