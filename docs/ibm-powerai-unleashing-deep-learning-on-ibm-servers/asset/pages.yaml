- pgno: 22
  md: 'Neural networks are inspired by the synapse structure and how it passes and
    processes signals. By using this structure as a base, scientists can implement
    a new approach to data processing, where different simple elements (neurons) are
    part of a bigger and complex structure (neural network) that can perform more
    complex tasks.


    In this scenario, a neural network is an artificial structure that is composed
    of artificial neurons that are arranged so they form layers with a level of specialization.
    A neuron in a certain layer receives the inputs from a previous layer, processes
    them (that is, weights input signals to generate an output signal), and passes
    the result to the adjacent neuron in the next layer.


    Figure 1-5 shows how an artificial neuron receives several inputs and processes
    them according to a function f(S) to produce an output that is propagated to the
    next layer.


    ![](img/f6f95c5defc8b3406a94a86b8d202807_22_0.png)


    Figure 1-5 Signal processing in a neuron


    The network expects some values as an input, so there must be input neurons. All
    neural networks must have output, so there must also be output neurons.


    The set of input neurons is called the input layer, and the set of output neurons
    is called the output layer. In the brain, there are several neurons communicating
    to each other and passing information through them; in the artificial neural network,
    there are neurons between the input and the output layer, which are collectively
    known as the hidden layer. The following section describes the hidden layers.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Figure 1-6 illustrates a simple neural network with one hidden layer and eight
    neurons.


    ![](img/f6f95c5defc8b3406a94a86b8d202807_23_0.png)


    Figure 1-6 Simple feed forward neural network


    After you have your neural network structure defined, you adjust each neuron weight
    after each training step to conform to the provided label. For each type of neural
    network, there is a specific behavior and way to train and handle its neurons
    weights and biases. The following section outlines the most common neural network
    architectures.


    # 1.2.4 Neural network architectures


    This section describes some of the most common neural network architectures.


    # Feed forward neural network


    A feed forward neural network (FFN) is one of the most common neural network architectures.
    Data comes into the input layer and is propagated forward through the hidden layer
    until it reaches the output layer with the value it comes up based on its training.


    The FNN is trained using a back-propagation algorithm. Basically, for each input,
    an expected value is provided to the neural network and the output is compared
    against this value. The difference from the expected value and the one delivered
    by the neural network (which can be the Mean Square Error or other cost function)
    is then back-propagated across all the neurons, and an optimization algorithm
    is used to adjust each neuron''s weight aiming to reduce the error that found.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'This process happens for the number of epochs that is defined for the training
    phase until the error rate converges, which is decided by the data scientist.


    For more information about FFNN, see "The Perceptron. A probabilistic model for
    information storage and organization in the brain" by Rosenblatt⁵


    # Recurrent neural network


    Recurrent neural networks (RNNs) use sequential information. In an FFNN, the inputs
    and outputs are independent of each other. An RNN is different because they need
    to know their previous input to understand the sequence, and make suggestions
    about that sequence. RNNs are recurrent because they go through the same processing
    (layers) for every element in a specific sequence. In a certain way, RNNs store
    the data that is calculated so far.


    An RNN has two kinds of input: the new input, also known as the present, and the
    recent past that passes through a feedback loop returning its previous decision
    back into the neurons in the hidden layer. These outputs are combined to output
    the new value.


    ![](img/f6f95c5defc8b3406a94a86b8d202807_24_0.png)


    Figure 1-7 How a recurrent neural network works


    RNNs are used in many fields, the natural language processing (NLP) field because
    you need to know the sequence of words in a sentence to take actions such as predicting
    the next word or understanding the sentence''s semantic content. RNN also allows
    the creation of a language model that can be used to generate text or help with
    word suggestions and algorithms for language conversion.


    One of the limitations of this network model is that it can remember only short
    sequences, and it cannot output values that are based on inputs from the being
    of a large sequence. This limitation was addressed by a variation of the RNN called
    long / short term memory (LSTM), which is described in "Long and Short Term Memory"
    on page 12.


    For more information, see "Finding structure in time" by Elman.


    > http://citeseer.ist.psu.edu/viewdoc/download?7doi=10.1.1.335.3398&rep=repl&type=pdf


    Chapter 1. Introduction to artificial intelligence and deep learning 11'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Long and Short Term Memory


    The LSTM network is a specific type of RNN. LSTM is more robust and aims to address
    the limitations of classical RNNs. LSTM stores long-term memory and can provide
    relevant outputs about information that is provided far behind in a sequence.


    With LSTM, it is possible to preserve error generation across several steps in
    the loop so that the RNN keeps learning with the input that is far behind. This
    behavior enables the neural network to make relationships and point out connections
    from remote regions.


    Using as called gates, information flowing through the neural network can be stored
    by creating a memory within each cell. These cells enable the network to perform
    reads and writes or erase its content to manage what is useful for the given learning
    context.


    Those gates are responsible for deciding whether the information is kept, altered,
    or removed using a sigmoid function, which is similar to a classical neural network,
    and activates that gate based on its signals that manage the cells'' weights.
    This process repeats and the weights are adjusted by the RNN learning method.


    With this type of neural network, it is possible to understand and infer words
    or sentences based on a complete book writing style, which leads to several other
    applications, such as handwriting recognition, music composition, and grammar
    learning.


    For more LSTM, see "Long short-term memory" by Hochreiter and Schmiduber.⁶


    # Convolutional neural networks


    Convolutional neural networks (CNNs) have become more prominent because of their
    effectiveness in areas image recognition and classification. CNNs can identify
    different objects within the same image and know where in the image that object
    is.


    In a CNN, there are a few basic operations that are essential to how they work:


    +   The convolutional phase focuses extracting features from the input object
    (in most cases, those objects are images) by creating a filter (or kernel) that
    goes through this object piece piece by piece, performs a multiplication of the
    elements, and then sums the result and puts it into a new and smaller generated
    matrix that is called the feature map. In a simple grayscale image (numerical
    matrix), imagine a filter being a smaller matrix that is applied over the original
    one at the upper left corner that performs the calculation, moves one pixel to
    the right, and starts the calculation until the filter has covered the whole matrix.


    > ⁶ https://crl.ucsd.edu/~elman/Papers/fsit.pdf'
  merge: -1
  img_proc: true
