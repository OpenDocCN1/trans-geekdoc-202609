  md: '# 3.1 IBM PowerAI components


    This section covers the components of IBM PowerAI since the first public release
    (V1.3) to the current release (V1.5.0) as of December 2017.


    IBM PowerAI is an IBM Cognitive Systems for the rapidly growing and quickly evolving
    artificial intelligence (AI) tier of deep learning (DL). IBM PowerAI provides
    a suite of capabilities from the open source community and combines into a single
    distribution of software that incorporates complete lifecycle management of installation
    and configuration, data ingestion and preparation, building, optimizing, and training
    the model, inference, testing, and moving the model into production. IBM PowerAI
    takes advantage of a distributed architecture to enable your teams to quickly
    iterate through the training cycle with more data to help improve the model over
    time.


    IBM PowerAI is designed for enterprise scale, with software that is optimized
    for both single-server and cluster DL training.


    IBM PowerAI provides an end-to-end DL platform for data science. It offers many
    optimizations that can ease installation and management, and can accelerate performance:


    +   - Ready-to-use DL frameworks (TensorFlow and C).

    - Distributed as easy-to-install binary files.

    - Includes all dependencies and libraries.

    - Easy updates: Code updates from a repository.

    - Validated DL platform with each release.

    - Integrated interfaces, with optical parallel transformation capability to unlock
    DL sets.

    - Dedicated support teams for DL.


    IBM PowerAI software distribution consists of a meta-package that includes all
    libraries, DL frameworks, and customizations to enable a fast, reliable, and optimized
    way to deploy a DL solution on IBM Power Systems.


    IBM PowerAI is distributed through electronic download from My Entitled Support,
    or it be preinstalled on the hardware. The following items are included:


