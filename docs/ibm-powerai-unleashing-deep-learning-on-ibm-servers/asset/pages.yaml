  md: '# 6.4 DLI deployment


    This section introduces how to deploy DLI on IBM PowerAI.


    # 6.4.1 Deployment consideration


    This section introduces three deployment modes: single node, multi-nodes without
    a high availability (HA) function, and multi-nodes with a HA function. In real
    case scenarios, there are some other methods, although they depend on the customer''s
    requirements.


    Regarding this deployment model, this scenario focus on a general architecture.
    In our environment, the version of software stack is as follows:


    +   - DLI V1.1

    - IBM Spectrum Conductor with Spark V2.2.1

    - IBM PowerAI V1.5

    - RHEL for Power Systems (ppc64le) V7.4

    - CUDA V9.0.176

    - GPU driver V384.81

    - CUDA Deep Neural Network (cuDNN) V7.0.4

    - IBM Spectrum MPI V10.1


    > Note: You must use a fully qualified domain name (FQDN) to access the IBM Spectrum
    Conductor with Spark GUI. In a DLI solution, you use the FQDN too. Here is an
    example of a /etc/hosts file FQDN entry:

    172.16.51.96 dli01.dli.com dli01


    # 6.4.2 DLI single-node mode


    In this mode, there is only one node. This mode is usually deployed for developing
    and testing purposes. The node acts as both master and compute nodes. Figure 6-8
    on page 155 shows the sequence of installation steps.'
