  md: '# Anaconda


    A number of the DL frameworks require Anaconda. Anaconda is a platform-neutral
    data distribution with a collection of 1,000+ open source packages with no-charge
    community support.


    Download and install Anaconda. The installation requires input for a license agreement,
    the installation location (the default is $HOME/anaconda2), and permission to
    modify the PATH environment variable (by of .bashrc). Use the following commands:


    ```

    $ wget https://repo.continuum.io/archive/Anaconda2-5.0.0-Linux-ppc64.sh

    $ bash anaconda2-5.0.0-Linux-ppc64.sh

    $ source ~/.bashrc

    ```


    # 4.4.3 Installing the deep frameworks


    This section describes how to install the DL frameworks.


    # IBM Spectrum MPI installation


    Complete the following steps:


    +   1. Download IBM Spectrum MPI from the ESP download site.

    2. Install the RPMs:


    ```

    $ sudo rpm -ihv ibm_smi_lic_s-10.02.00*.ppc64.rpm

    ibm-mpi-10.02.00*.ppc64.rpm

    ```


    # Software repository setup


    IBM TensorFlow for Power AC922 Deep Learning packages are distributed in an RPM
    file and are available from the ESP download site. Installing the RPM creates
    an installation repository on the local machine. To install the repository package,
    run the following command:


    ```

    $ sudo rpm -ihv mdl-repo-local*.rpm

    ```


    # Installing all frameworks together


    The DL frameworks can be installed together using the power-mdl meta-package:


    ```

    $ sudo yum install power-mdl-esp

    ```


    # Installing frameworks individually


    The DL frameworks can be installed individually if you prefer. The framework packages
    are:


    +   - tensorflow: Google TensorFlow V1.4.0

    - tensorboard: Web Applications for Inspecting Tensorflow Runs and Graphs V0.4.orc3

    - ddl-tensorflow: DDL custom operator for TensorFlow


    Each can be installed by running the following command:


    ```

    $ sudo yum install <framework>-cuda9.1

    ```'
