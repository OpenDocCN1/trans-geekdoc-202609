  md: '# ### 4.3.5 Getting started with machine learning and deep learning frameworks


    This section shows how to get started with the machine learning and deep learning
    (MLDL) frameworks.


    # #### General setup


    Most of the IBM PowerAI packages install outside the normal system paths (to /opt/DL/...),
    so each framework package provides a shell script to simplify environmental setup
    (for example, Path, LD_LIBRARY_PATH, PYTHONPATH).


    Update your shell rc file (.bashrc) to source the necessary setup scripts. For
    example:

    source /opt/DL/<framework>/bin/<framework>-activate


    Any errors that occur when you run the activate scripts must be resolved before
    you use the framework.


    Each framework also provides a test script to verify basic functions:

    $ <framework>-test


    # #### Dependencies


    Many IBM PowerAI frameworks (for example, TensorFlow, TensorBoard, and Caffe)
    have their dependencies satisfied by Anaconda packages. These dependencies are
    validated by the <framework>-activate script to ensure they are installed. If
    they are not installed, the script fails.


    For these frameworks, the /opt/<framework>/bin/install_dependencies script must
    be run before activation to install the required packages.


    For example:

