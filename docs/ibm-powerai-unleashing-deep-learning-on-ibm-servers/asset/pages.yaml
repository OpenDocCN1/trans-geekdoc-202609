    |

    | Label file (optional) | /demodata/userdata/cifar10_binary/cifar10-batches-bin/batches.meta.txt
    |


    > Note: This data set does not include a validation data set. In general, it does
    not need to configure a validation folder. However, we want to show the validation
    function, so we use a test data set as a validation data set.


