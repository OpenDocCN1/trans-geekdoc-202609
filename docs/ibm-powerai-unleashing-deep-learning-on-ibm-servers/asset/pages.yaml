- pgno: 135
  md: '# 5.1 Knowing requirements and data


    When a department in a company decides to implement a cognitive solution by using
    machine learning (ML) capabilities, it is a common oversight to not think about
    the data they have: what kind of data, age of data, governance, and sensitivity.
    It is tempting for the technical team to start deciding about algorithms without
    taking time to appreciate what data is.


    Although it is possible to implement a cognitive system without understanding
    your data, the result might not be the most accurate or efficient. The first task
    is to understand and agree on the actual business needs and requirements. Employee
    design thinking sessions can assist with this part of the process. All parties
    that are involved in the project can highlight and discuss requirements, priorities,
    concerns, and expectations.


    With business requirements and expectations discussed and agreed upon, the next
    phase focuses on the data itself. There must be a clear understanding across the
    involved teams to adapt to the data that is used. People must have agreed expectations
    of what information the data provides.


    This data analysis phase should be done during the discovery and viability of
    the project and not committing to the project. Making decisions and dependencies
    based on assumptions of the data can be an inhibitor to a successful project.


    An example of a situation where data can be a barrier for the project is in a
    case where the system must be able to predict whether an order is fraudulent and
    expectations are made that historic data exists. When the data is checked, the
    team finds that there are no connections between the data history, making it impossible
    to identify whether a specific transaction is fraudulent. The data that they have
    is simple field, such as amount, name, and address. There are no fraud tables
    registering old data or indications that characterize fraud.


    If there is such a situation, it does not mean the project can never happen, but
    it might require more phases or a project on the existing systems to generate
    more detailed data and start registering fraud data in the expected format. It
