  md: '# ## 5.4 Word suggestions by using long and short memory on TensorFlow


    To make a word suggestion to speed up a user typing process or even generate text
    that is based on some other existing text, it is important to have different applications
    where cognitive systems must be the rule and not the exception. This section describes
    a word suggestion implementation using a long and short term memory (LSTM) recurrent
    neural network (RNN) so that you can understand how it works with TensorFlow and
    take advantage of IBM PowerAI.


    This is a straightforward implementation focusing on clarity so that you can understand
    the details and build from it. This kind of implementation as a head start.


    Our example is all about training our model into a data set of phrases; when we
    use it, we can starting words to create a phrase and receive predictive suggestions
    from our model on what the next word can be so we do not have to type it.


    To do so, we use an RNN because the order or sequence the words are in make a
    good suggestion. We implement a specific RNN called LSTM because a simple RNN
    cannot keep data from old iterations; they can remember only recent data, LSTM
    remember what is important and *forget* what is not. For more information, see
    1.2.3, "Types of neural networks and their usage" on page 8.


    # ## 5.4.1 Our data set


    We use a simple and small data set with about 100 created questions that simulate
    users asking how to do something within their system, how to reset their password,
    how to get access to the internet, and where to find some information.


    The data is already in the correct format, but in a production environment you
    must obtain the data from databases and apply transformations to convert it to
    the required format.


    # ## 5.4.2 Overall structure of the code


    The overall structure of the code is the same as the one that is used by the sentiment
    analysis in 5.3, "Sentiment analysis by TensorFlow on IBM PowerAI" on page 123,
    so the same diagram is used (Figure 5-1 on page 124). The diagram represents how
    our code is structured.


    There is a preparation phase to create our dictionaries and put the phrases into
    the correct Python objects so that they are ready to be used by the neural network.
    Then, in the second phase we define our LSTM neural network model, train it, and
    so that we can get to the third phase where the model can be used.


    # ## 5.4.3 Data preparation


    In this phase, we create our dictionary of words so that we know each different
    word that occurs in our data set. We are not excluding any words because every
    word is important for the system.


    In this phase, we transform each phrase from the data set into a list of words
    and save it into a pickle file so that we can process larger data sets without
    having to keep all of them in memory.'
  merge: -1
  img_proc: true
