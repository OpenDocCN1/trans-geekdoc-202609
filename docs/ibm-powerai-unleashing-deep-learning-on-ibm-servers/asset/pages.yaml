  md: "# 6.3.2 Monitoring and Optimization for one training model\n\nThe function\
    \ is used for training process monitoring and issue detection. A deep neural network\
    \ is complex and time-consuming, so it is important to know the current progress\
    \ and status of a user's training job. Monitoring and Optimization (MAO) provides\
    \ the following features:\n\n+   - Monitor the DL training job by capturing logs\
    \ from instrumented DL frameworks (filtering the logs based on keywords).\n- Visualize\
    \ the training progress by summarizing the training job's monitoring data.\n-\
    \ Advise and optimize the training (enables the user to accept them and have it\
    \ implement the optimizations on their behalf).\n\nThe training visualization\
    \ function can visualize time, iteration, loss, and accuracy metrics as histograms\
    \ of weights, activations, and gradients of the neural network. From these charts,\
    \ the user knows whether the training is running smoothly or there is something\
    \ wrong.\n\nDuring the training process, MAO can help the user detect the following\
    \ issues of neural model design: \n\n+   - Gradient explosion\n- Overflow\n- Saturation\n\
    - Divergence\n- Overfitting\n- Underfitting\n\nIf DLI detects any of these issues,\
    \ DLI estimates whether the training process can skip the issue. If not, DLI provides\
    \ an early stop suggestion and the amendment suggestion to the user. The user\
    \ can stop the training, adjust the model, and start again. The function helps\
    \ the user improve the training efficiency.\n\n# 6.3.3 Hyperparameter optimization\
    \ and search\n\nHyperparameters are parameters whose values are set before the\
    \ start of the model training process. DL models such as convolutional neural\
    \ networks (CNNs) and recurrent neural networks (RNNs) can have 10-100 hyperparameters,\
    \ for example, the learning rate, the configurations, and others. These parameters\
    \ affect the model training process and the final model performance. Hyperparameters\
    \ optimization is one of the direct impediments to tuning DL models. There are\
    \ three algorithms to automatically optimize the hyperparameters: Random search,\
    \ TPE, and Bayesian optimization based on the Gaussian Process.\n\n# Random search\n\
    \nThis method is the most popular search method in machine learning (ML) and DL.\
    \ It easily supports parallel jobs with high efficiency. If a user has a candidate\
    \ value for the hyperparameters and they are discrete, random search is the best\
    \ choice.\n\n# Tree-structured Parzen Estimator Approach search\n\nThis is a tree-based\
    \ search method and the sampling window follows the Parzen estimator. This is\
    \ a sequential search model, and during each search iteration, in parallel, it\
    \ searches the potential optimization point. The TPE search efficiency is between\
    \ the random search and the Bayesian search."
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Bayesian search


    This method is a traditional and high accuracy method to search hyperparameters.
    It uses Gaussian probability density to describe the relationship between hyperparameters
    and loss value of neural networks, and takes advantage of the Expectation Maximization
    (EM) algorithm to find the best result. Bayesian search is also a sequential search
    method, so it can be quickly convergent to the best optimal value.


    Our implementation takes advantage of the state-of-the-art research results and
    the IBM Spectrum Conductor with Spark platform to efficiently parallel search
    the best set of hyperparameters that has the final model performance.


    # 6.3.4 IBM Fabric for distributed training


    DLI uses IBM Fabric technology as part of its general distribution DL framework.
    IBM Fabric is a general distribution DL framework. The implementation provides
    comprehensive support for distribution DL across multiple GPUs and Nodes provides
    compatibility with TensorFlow and Caffe models. IBM Fabric supports various parallelization
    schemes for a gradient descent method, which results in more than 80% speedup
    ratio. Furthermore, IBM Fabric can efficiently scale out on IBM Spectrum Conductor
    with Spark clusters.


    IBM Fabric mainly supports the following functions:


    +   - Single Node, Multiple GPUs Training is supported without PS for TensorFlow
    and Caffe models.


    +   - Multiple Nodes, Multiple GPUs Training is supported by PS for TensorFlow
    and Caffe models.


    +   - Distribution synchronous and asynchronous training algorithms are supported
    for multi-nodes including a synchronous gradient data control algorithm, an asynchronous
    gradient data control algorithm, a synchronous weight data control algorithm,
    and an asynchronous weight data control algorithm.


    +   - NCCL is supported for broadcasting and reducing gradient and weight data
    across multiple GPUs.


    +   - Continue training is supported by saving and restoring the training checkpoint
    and snapshot files.


    # 6.3.5 IBM Fabric and auto-scaling


    In addition to the distributed training engine with IBM Fabric, there is an added
    auto-scaling function that is available. The distributed training engine with
    IBM Fabric and auto-scaling uses a fine-grained control for training. This is
    an alternative to the coarse-grained strategy, where the resource utilization
    is capped and no additional GPUs can be added to the training phase. With auto-scaling,
    the Spark scheduler distributes the task and the session scheduler dynamically
    issues resources from the resource manager, enabling more GPUs to be added.


    In the reclaim case, the scheduler finishes the current training iteration, pushes
    the gradient on PS, and then exits and gracefully shuts down. In the scale-up
    case, the scheduler adds more workers to the training job to pick up the pending
    training iteration.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# 6.3.6 DLI inference model


    This model puts the trained DL model into production, which is the most exciting
    moment for a data scientist. The DLI inference model makes this step easy and
    efficient by just clicking several buttons in the portal. The inference model
    is also the most important way that a user can really benefit from the DL model.
    The IBM Conductor serves the data scientist and user by managing the inference
    model as a service in the IBM Spectrum Conductor with Spark cluster and provides
    access to the user with an advanced inference engine. Based on the powerful scheduling,
    elastic scaling, and efficient resource management features from IBM Spectrum
    Conductor with Spark, the inference request from the user can be served in IBM
    Spectrum Conductor with Spark DLI smoothly and efficiently.


    The DLI inference model supports the following functions:


    +   * Convert a trained model into an inference model.

    * Create an inference model with pre-trained weight files.

    * Infer from an IBM Spectrum Conductor with Spark DLI web portal and REST API.

    * Manage an inference model and results from a web portal and REST API.

    * Support an inference model preinstallation to reduce the response time and increase
    resource utilization.

    * Provide large throughput.

    * Support running in a large dynamic cluster.


    # 6.3.7 Supporting a shared multi-tenant infrastructure


    DLI is built on IBM Spectrum Conductor with Spark, which uses the IBM Enterprise
    Grid Orchestrator (IBM EGO) to provide resource management and scheduling capabilities
    for Spark applications within the IBM Spectrum Conductor with Spark cluster. IBM
    EGO also provides the underlying system infrastructure to enable multiple applications
    to operate within a shared multi-tenant infrastructure.


    > Note: For more information, see IBM EGO.'
  merge: -1
  img_proc: true
