    # ## 3.1.5 NVIDIA components


    For proper operation, IBM PowerAI requires low-level access to all functions that
    are provided by NVIDIA GPU and NVLink technologies. To achieve this access, NVIDIA
    drivers, CUDA, and CUDA Deep Neural Network (cuDNN) software are needed, but they
    are not provided within IBM PowerAI due to license constraints with NVIDIA. These
    components can be downloaded from the vendor webpage (as shown in 3.1.5, "NVIDIA
    components" on page 42 and 3.16, "NVIDIA drivers" on page 44).


    # ### CUDA


    CUDA is a parallel computing platform and programming model that enables the use
    of the GPU to accelerate computing performance.


    CUDA broadly frees the data-parallel model of computation. Typically, each thread
    runs the same operation on different elements of the data in parallel.


    The data is divided into a 1D, 2D, or 3D grid of blocks. Each block can be 1D,
    2D, or 3D in shape, and can consist of over 512 threads on current hardware. Threads
    within a thread block can cooperate by use of shared memory. Thread blocks are
    run as smaller groups of threads that are known as *warps*.'
  merge: -1
  img_proc: true
