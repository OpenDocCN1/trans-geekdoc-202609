  md: "# ## 7.1 Use case one: Bare metal environment\n\nIn many modern industries,\
    \ companies require and depend on real-time responses from their applications\
    \ and systems to maintain a successful business. Such customers are receptive\
    \ to new technology (such as DL) and have expectations about any new technology\
    \ that quickly contributes to satisfying their business goals and requirements.\n\
    \n# ### 7.1.1 Customer requirements\n\nWhen users and data scientists initially\
    \ experiment with implementation, they do not consider the infrastructure that\
    \ hosts their DL frameworks because their focus on the environment is the accuracy\
    \ results that their models produce. However, as their familiarity grow and they\
    \ implement more complex models with larger data sets, it is inevitable that the\
    \ training phase takes longer. As a result, their focus shifts to the infrastructure\
    \ under the frameworks. They start to evaluate differences in performance depending\
    \ on the servers' configurations. As a criteria for vendor selection, customers\
    \ tend to evaluate the performance of one specific framework, and testing a specific\
    \ data set such as imagen.\n\nHere are examples of customer requests:\n\n+   -\
    \ Capability to host an on-premises DL infrastructure for real-time analysis of\
    \ large quantities of internal data\n- Capability to run frameworks, such as TensorFlow\
    \ and Torch, on the DL platform\n- Proven expectation of reduction for the training\
    \ time compared to other providers (both for on-premises and cloud providers)\n\
    - Reduced total cost of ownership (TCO) compared to other solutions\n\n# ### 7.1.2\
    \ IBM solution\n\nThe customer requirements that are described in 7.1.1, “Customer\
    \ requirements” on page 232 can be satisfied by implementing the following environment:\n\
    \n+   - Hardware: IBM Power System S822LC for High Performance Computing server\n\
    - Operating system: Ubuntu 16.04\n- Software: IBM PowerAI Release 4, including\
    \ TensorFlow and Torch\n  - CUDA: Version 8\n  - CUDA Deep Neural Network (cuDNN):\
    \ Version 6\n  - NVIDIA driver: Version 384.66\n- Network: 10 Gb Ethernet (see\
    \ Figure 7-1)"
