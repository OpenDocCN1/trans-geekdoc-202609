    +   1. The **training** function begins by concluding the TensorFlow graph. It
    first calculates the error, which is the difference of the correct label and what
    the model outputs. The error is calculated using the **softmax_cross_entropy_with_logits**
    function. This generated error is then optimized by the **RMSPropOptimizer**.
    RMSProp is a gradient descent optimization algorithm that is used to reduce the
    error and adjust the network''s weights and biases. We can exchange this for any
    other to try it out. In our case, RMSProp helped reach high accuracy rates.

    2. Building the TensorFlow graph, we define the correct label that receives an
    array (in case, size 1) with value 1 if the network output is the same as the
    one that is provided by the label (placeholder) or 0 if otherwise. As with the
    previous step, the mean is calculated and assigned to the accuracy variable used
    to calculate the general accuracy during the graph execution phase.

    3. We create a dictionary of words file file is opened and we loop through the
    epochs. The epoch is how many times we want to iterate through all our data to
    train our model. There are different ways to define that, from establishing a
    specific number of times to checking the accuracy and run until the accuracy reaches
    a minimal variation.


    We are using a specific number of epochs, 60000, which can reach more than 90%
    accuracy. Of course, increasing the number of epochs and providing a better data
    set can improve the accuracy even.


    Within the epochs, we start going through data set, which is already in a list
    format, and for each phrase the code picks the first three words as training data,
    converts them to the word''s respect number, and conforms to the neural network
    input. We also provide the label, which is the fourth.


    +   4. For the label, we transform the word into a hot vector with the same size
    as the dictionary of words. We use a hot vector to check which position has the
    biggest value, which is the strongest suggestion, and the rest of the successive
    suggestions.


    The process to create the hot vector is straightforward. We have the array filled
    with zeros, it is necessary to add only one to the index referring to the respective
    number of the word that is found in the dictionary of words `word_dict`.


    +   5. With the training data and label prepared, they are fed into the neural
    network for training. After all the epochs are interacted, the trained model is
    saved by using the **save** method from `tf.trainer.Saver`.


