    # # 1.2 Neural networks overview


    # ## 1.2.1 A history about neural networks


    This section describes neural networks.


    Artificial neural networks have been around for some time, and they have evolved
    over time. Today, neural networks play an important role in the AI realm, as described
    in 1.2.2, "Why neural networks are an important subject" on page 6.


    According to Yadav, neural network history has been divided into four great ages
    starting in the 1940s when the first article about the subject was published in
    1943. It discovered the fact that neural networks can be created brain-like methods
    of learning as a promising way to create learning algorithms.


    The 1950s and 1960s were marked by the first neurocomputer, which was called Snack,
    and was created by Marvin Minsky in 1951. What characterized these years as the
    golden age of the neural networks was the first successful neurocomputer that
    changed the direction of what we know today. The neurocomputer was created in
    1957 - 58 by Frank Rosenblatt, Charles Wightman, and others.


    Unfortunately, by the end of 1960s, neural networks suffered because most of the
    researchers were working on experimental data that were not applicable in real
    scenarios.


    During the 1970s, researches continued experimenting in the areas of adaptive
    processing, biological modeling, and pattern recognition. Many of these scientists
    who started their work became the ones who were responsible for reviving the neural
    network field about one decade later.


    > Yadav, et al, "History of Neural Networks. In: An Introduction to Neural Network
    Methods for Differential Equations", Springer Briefs in Applied Sciences and Technology,
    Springer, Dordrecht, 2015


    Chapter 1. Introduction to artificial intelligence and deep learning 5'
