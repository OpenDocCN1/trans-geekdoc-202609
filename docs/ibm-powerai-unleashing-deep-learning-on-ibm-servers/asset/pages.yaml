- pgno: 73
  md: '# 4.1 IBM PowerAI V1.4 setup guide


    This chapter contains information about how to set up IBM PowerAI V1.4.


    # 4.1.1 About this chapter


    This chapter shows the procedure for installing Ubuntu 16.04 on a bare metal IBM
    Power System S822LC for High Performance Computing (M/T 8335-GTB) server. This
    POWER8 server is equipped with a NVIDIA Tesla P100 graphical processing unit (GPU).


    After the installation of Ubuntu, this chapter describes the procedure for installing
    IBM PowerAI V1.4.


    This chapter is a comprehensive and visual guide to IBM PowerAI installation and
    setup by using the most common installation scenario. For more information for
    IBM PowerAI releases, see the IBM PowerAI Release Notes.


    > Note: To avoid conflicts with uncont or unsupported versions of certain system
    libraries, disable automatic updates.


    # 4.1.2 Preparing to install IBM PowerAI V1.4


    Because the IBM Power System S822LC for High Performance Computing model does
    not have a DVD drive, you must install the operating system in one of the following
    ways:


    +   1. Mounting media virtual with the Remote Console function of the baseboard
    management controller (BMC)

    2. USB device

    3. Network boot installation


    During the use of any these methods, you must have a terminal to connect to the
    system through Intelligent Platform Management Interface (IPMI).


    For more information about installing Linux on IBM Power Systems LC servers, see
    IBM Knowledge Center.


    # Preparation steps


    Before starting the configuration, prepare the connection environment from the
    target server to the internet. When installing the package, the download is performed
    from the internet to update any dependency relationship.


    # Downloads


    This section describes the installation packages to be downloaded.


