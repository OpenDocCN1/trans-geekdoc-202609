    # # 1.2.3 Types of neural networks and their usage


    There are several different types or architectures of neural networks. This section
    describes fundamentals and briefly reviews the main architectures.


    As the name implies, neural networks were inspired by the human brain, and the
    idea is to imitate how the brain works. Scientists have still much to learn about
    the human brain, and the knowledge that is available so far is enough to produce
    some interesting theories and implementations for an artificial network.


    In human brain, there are billions of neurons, and they signal each other through
    a structure that is a synapse. Every neuron is a single cell that is composed
    of a body cell (that holds the nucleus), an axon (a long tail that extends from
    the environment), and many dendrites (smaller branches of the cell wall that are
    around the cell body and at the end of the axon). The synapse can be compared
    to a chemical bridge between two neurons. The synapse is the gap between two dendrites
    of different neurons, and works as a chemical gate that can be opened or closed
    to prevent the electrical signal from jumping from one to another.'
