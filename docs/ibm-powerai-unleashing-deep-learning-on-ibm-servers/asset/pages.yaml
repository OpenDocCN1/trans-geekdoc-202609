  md: '5. Change the IP address to static:


    ```

    # ipmitool lan set 1 ipsrc static

    ```


    6. Set up the IP, gateway, and network mask addresses:


    ```

    # ipmitool lan set 1 ipaddr IP_ADDRESS

    # ipmitool lan set 1 defgw GATEWAY_ADDRESS

    # ipmitool lan set 1 netmask NETMASK_ADDRESS

    ```


    7. Confirm the settings:


    ```

    # ipmitool lan print 1

    ```


    8. Stop the system to restart the management processor:


    ```

    # ipmitool power off

    ```


    9. After the system disconnects, disconnect both power cords, and reconnect the
    power cords after 30 seconds.


    10.Set the power to ON.


    11.Using the set IP address, confirm that you can access the BMC by using your
