  md: '# 6.2 Benefits of IBM Spectrum Conductor Deep Learning Impact


    On IBM Power platforms, IBM PowerAI provides many DL frameworks and useful technologies
    for the customer to take advantages of and implement. In many cases, customers
    want to use DL technology and integrate with their existing applications to bring
    new value to their business. There are some important elements to ensure a (not
    one) DL project can be put into production successfully, such as data management,
    arithmetic and neural network management, and computing resource management.


    Figure 6-1 demonstrates a general lifecycle for DL projects.


    ![](img/f6f95c5defc8b3406a94a86b8d202807_158_0.png)


    Figure 6-1 Data science of deep learning project lifecycle


    A DL always begins with the business requirement (step 1). In most cases, data
    is provided by the customer. If you use a supervised training network, data labeling
    is needed too (step 2).


    After you understand the business requirements and available data, you can implement
    one or more neural networks by completing the following high-level steps:


    +   1. Reformatting or restructuring data to be in a usable/required format to
    be used by the model (step 3).

    2. Import a DL network to create a training model (step 4).

    3. Start a model training task (step 4).

    4. Tune a model to improve accuracy (step 5).

    5. Generate an inference model based on the trained model (step 6).

    6. Integrate an inference model with a customer''s application (step 6 and 7).

    7. Put the model into production (step 7).

    8. Generate an updated inference model to adapt to changing data (step 8).


    These steps explain a closed-loop lifecycle for DL projects.'
  merge: -1
  img_proc: true
