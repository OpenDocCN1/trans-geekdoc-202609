    # 6.7 Integrating with a customer''s network in DLI


    This section describes how to integrate the customer''s network by using DLI.


    # Caffe single-node and distributed CaffeOnSpark training engine


    You can import a Caffe model into the DLI platform for training and inference.
    A typical Caffe model can run in the DLI platform has the following structure:


    +   - The solver.prototxt file: Caffe solver definition

    - The train_test.prototxt file: Caffe train model definition

    - The inference.prototxt file: Caffe inference model definition


    You must rename your files to three fixed names before importing your model into
    DLI.


    The models for different training engines are slightly different. For example,
    the Caffe model for the CaffeOnSpark training engine uses a MemoryDataObject type
    of input layer, and a single-node training engine does not. DLI does conversion
    automatically for those known and compatible parameters. However, choose the compatible
    training engine or you might have to troubleshoot and change it after a failure.


    There are sample Caffe models that are shared by DLI in IBM Bluemix®. For more
    information, see the model readme file.'
  merge: -1
  img_proc: true
- pgno: 221
  md: "# TensorFlow single-node and distributed training engine\n\nYou can import\
    \ a TensorFlow model into the DLI platform for training and inference. TensorFlow\
    \ model that can run in a DLI platform has following structure:\n\n+   - The main.py\
    \ file: The TensorFlow training model program main entrance\n\n+   - The inference.py\
    \ file: The TensorFlow inference model program main entrance\n\n+   - The fabricmodel.py\
    \ file: The callback program to convert a training model into a TensorFlow compute\
    \ graph\n\n+   - The ps.conf file: The training parameters, which are optional\n\
    \nThe main.py and inference.py files are mandatory for a TensorFlow model for\
    \ any training engine. The fabricmodel.py file is required if your model wants\
    \ to run by using the IBM Fabric training engine. For more information about how\
    \ to write the IBM Fabric model, see \"Fitting the TensorFlow model to fit IBM\
    \ Fabric\" page 210. The main.py file is the main training program.\n\nIf you\
    \ want to train this model in single-node TensorFlow, the following command line\
    \ options are mandatory:\n\n+   - train_dir <TRAIN_DIR> is the directory where\
    \ you event logs and checkpoints.\n\n+   - If you train this in distributed TensorFlow,\
    \ you must follow TensorFlow's standard distributed training guide and support\
    \ the following extra command-line options:\n    - job_name: Comma-separated list\
    \ of hostname:port for the PS jobs\n    - ps_hosts: Comma-separated list of hostname:port\
    \ for the worker nodes\n    - task_id: Task ID of the worker or replica that runs\
    \ the training\n\n# DLI parameter injection API for TensorFlow model\n\nTensorFlow\
    \ models are written in Python, these models are flexible. To work with DLI, DLI\
    \ provides a TensorFlow parameter injection API for Python programs. You can use\
    \ this API to get training parameters from a DLI platform, as shown in Example\
    \ 6-8.\n\n> Example 6-8 API utilization example\n\n```\nimport tf_parameter_mgr\n\
    \nFLAGS,max_steps=tf_parameter_mgr.getMaxSteps()\nFLAGS.test_interval=tf_parameter_mgr.getTestInterval()\n\
    \nfilenames = tf_parameter_mgr.getTrainData()\n\n# Create a queue that produces\
    \ the filenames to read.\nfilename_queue = tf.train.string_input_producer(filenames)\n\
    \n# Compute gradients.\nwith tf.control_dependencies([loss_averages_op]):\nlr\
    \ = tf_parameter_mgr.getLearningRate(global_step)\nopt = tf_parameter_mgr.getOptimizer(lr)\n\
    grad = opt.compute_gradients(total_loss)\n```"
  merge: -1
  img_proc: true
- pgno: 222
  md: "Here are the functions for the tf_parameter_mgr:\n\n+   * getBaseLearningRate()\n\
    * getLearningRateDecay()\n* getLearningDecaySteps()\n* getTrainBatchSize()\n*\
    \ getTestBatchSize()\n* getHNDenseState()\n* getTrainData(getfile=True)\n* getTestData(getfile=True)\n\
    * getValData(getfile=True)\n* getMaxSteps()\n* getTestInterval()\n* getOptimizer(learning_rate)\n\
    * getLearningRate(global_step=None)\n\nYou must change code to call previously\
    \ written API functions. There are sample TensorFlow models that are shared by\
    \ DLI by IBM Bluemix. For more information about detailed usages of these API\
    \ functions, see the model readme file.\n\n# Fitting the Caffe model to IBM Fabric\n\
    \nThis section introduces the process of fitting the Caffe model to IBM Fabric.\
    \ When you have a Caffe model and want to use IBM Fabric to accelerate the training\
    \ process, you may modify some Caffe configurations:\n\n+   1. You must name the\
    \ Caffe solution file as solver.prototxt. In the solver.prototxt file, add the\
    \ configuration that is shown in Example 6-9.\n\nExample 6-9 Example of solver.prototxt\n\
    \n```\ntest_compute_loss:true\n```\n\n+   2. You must name the Caffe train and\
    \ test net file as train_test.prototxt. In the train_test.prototxt file, the input_param\
    \ data must be the shape type, as shown in Example 6-10.\n\nExample 6-10 Example\
    \ of train_test.prototxt for input_param\n\n```\ninput_param ( shape: { dim:200\
    \ dim: 3 dim: 32 dim: 32 }\n```\n\n+   3. In the train_test.prototxt file, the\
    \ accuracy layer configuration, as shown in Example 6-11.\n\nExample 6-11 Example\
    \ of train_test.prototxt for the accuracy layer\n\n```\nlayer {\n  name: \"accuracy\"\
    \n  type: \"Accuracy\"\n  bottom: \"ip2\"\n  bottom: \"label\"\n  top: \"accuracy\"\
    \n}\n```"
  merge: -1
