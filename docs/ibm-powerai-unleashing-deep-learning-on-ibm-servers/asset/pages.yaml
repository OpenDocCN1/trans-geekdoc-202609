  md: '# IBM Fabric single-node and multi-GPU training


    If you select the number of workers as equal to 1, the fabric training engine
    does not use the PS. The IBM Fabric single-node and multi-GPU training process
    is as follows and shown in Figure 6-68.


    ![](img/f6f95c5defc8b3406a94a86b8d202807_217_0.png)


    Figure 6-68 IBM Fabric single-node and multiple-GPU training process


    +   1. Updates the weight value of a model and starts the model native train in
    multi-GPUs.

    2. Gathers the gradient data from the GPU cards.

    3. Reduces the gradient data.

    4. Applies the reduced gradient data to weight values, and goes to step 1.


    # IBM Fabric multi-nodes and multi-GPU training


    If you select the number of workers as greater than 1, the fabric training engine
    uses the PS. The IBM Fabric multi-nodes and multi-GPU training process is as follows
    and depicted in Figure 6-69.


    ![](img/f6f95c5defc8b3406a94a86b8d202807_217_1.png)


    Figure 6-69 IBM Fabric multi nodes and GPUs training process


    204 IBM PowerAI: Deep Learning Unleashed on IBM Power Systems Servers'
  merge: -1
  img_proc: true
- pgno: 218
  md: '+   1. Pulls the weight from the PS, updates the weight value to GPUs in the
    worker, and starts the model training.


    +   2. Gathers and reduces the gradient data in the worker and pushes the reduced
    gradient data to PS.


    +   3. Sync and async updates updates the gradient data in PS.


    +   4. Applies the gradient data to the weight value in PS, and then goes to step
    1.


    If you select the number of workers as equal to 1, the fabric training engine
    does not use PS.



    # IBM Fabric core engine support by NVIDIA Collective Communications Library


    The IBM Fabric core engine supports the NCCL function for data exchange schema
    between GPU cards. To use it, you do not need to do any other configuration. Complete
    the following steps:


    +   1. NCCL broadcasts the weight data schema, as shown in Figure 6-70.


    ![](img/f6f95c5defc8b3406a94a86b8d202807_218_0.png)


    When the weight data is assigned to GPU:0, NCCL can broadcast the weight data
    to other GPU cards in the worker.'
  merge: -1
