    # 4.2 Testing IBM PowerAI V1.4


    As with machine learning (ML) environments, before you can use the framework,
    you must first source it so that your runtime knows the library is available.
    This task can be completed on an individual basis through the shell, globally
    in /etc/bash.basrc, or on a per user in //.bashrc.


    ```

    $ source /opt/DL/framework/bin/<framework>-activate

    ```


    All the frameworks in IBM PowerAI come with a simple test that you can run to
    ensure everything is working correctly. To run the test, ensure that you have
    sourced the framework, and then run the following command:


    ```

    $ <framework>-test

    ```


    The <framework>-test syntax is the same for all of the bundled frameworks.


    For more information about the tutorial for using each framework, see Getting
    Started with <framework in the IBM PowerAI manual.


