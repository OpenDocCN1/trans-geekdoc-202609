  md: '# 5.4.8 Final considerations


    The word suggestion code code can be improved and implemented in different ways.
    In this section, we transformed each word into a number, although if more word
    context is required, this number can be represented as a Word2Vec, which is a
    complete representation. However, it requires a model to convert the words and
    more processing capacity.


    Although the sample scenario does not implement retraining, it can be an interesting
    exercise. If a user types in a phrase where more than 70% of the words are not
    in the dictionary of words, the phrase can be inserted into the data set and the
    model retrained.


    The hot vector representation of the label words, but if you grow it too much,
    then the number of words in the dictionary requires more processing.


    Other parameters can be changed to increase the model accuracy, and a test data
    set is good way to check the accuracy without using only the data in the training
    set.'
