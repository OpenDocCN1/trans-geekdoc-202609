  md: '# 1.1 Deep learning


    Although these paths seem to be distant from each other, ever since the development
    of mathematics, few humans have dreamed of finding a way to merge all of these
    paths, mainly through human-created devices that can develop a certain degree
    of intelligence.


    The 20th century brought the dawn of a new machine. Computers could compute a
    large number of numbers that humans could solve complex mathematical systems at
    an unimaginable scale.


    The most promising approach to these problems is artificial intelligence (AI).
    AI is a scientific concept that is glorified and promoted in literature and films.
    However, in recent decades, science fiction has steadily moved closer becoming
    fact, and in every places in our modern world. Although AI remains a field of
    science, certain characteristics that were previously labeled as science fiction
    became defined by subsequent fields and areas of scientific study.


    Probably the biggest field in AI is machine learning (ML), which can be described
    as a scientific representation of decision making, is the ability to represent
    a human decision process in material format so that it can be implemented as a
    program (or algorithm) that a computer can run against a given data set. To prove
    and establish the algorithm, a computer must be taught or trained so that learning
    is based on experience (as is the case in the human context) to enable the system
    to interpret results and improve the accuracy of results. ML is closely related
    to statistics, and has grown as large amounts of information available through
    digitalization and computer storage.


    For example, a data set of thousands of images from a traffic camera. An algorithm
    can be written to count the number of vehicles that is captured over time. The
    algorithm can be improved to count only the number of cars (ignoring trucks and
    bikes). The results can be then processed to determine whether a car can be considered
    blue.


    Before you consider the detection of color, an initial problem is to define whether
    an image was captured and detected a vehicle (and if, what type). Although it
    is obvious to the human eye, the more combinations and permutations can be handled
    with more training and algorithms, the more accurate the results become. The size
    of the vehicle, the time of day of the photograph, weather conditions, and density
