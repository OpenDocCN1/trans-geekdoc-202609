  md: '# 6.8.1 Data preparation


    The Cifar-10 data set contains 60,000 32x32 color images in 10 classes, with 6000
    per class. There are 50,000 training images and 10,000 test images.


    The original data set is divided into five training batches and one test batch,
    each with 10,000 images. The test batch contains exactly 1000 randomly selected
    images from each class. Example 6-15 shows a script to prepare the data for importing.


    Example 6-15 Cifar-10 data set preparation


    ```

    !/bin/bash

    wget --no-check-certificate http://www.cs.toronto.edu/~kriz/cifar-10-binary.tar.gz

    tar -xvf cifar-10-binary.tar.gz


    export target_dir=${lv_dir}/cifar10_testdata

    export source_dir=${lv_dir}/cifar-10-batches-bin

    mkdir -p $target_dir

    rm -rf $target_dir/cifar10_train_lmdb $target_dir/cifar10_test_lmdb

    ```


    ```

    echo "Generate LMDB files..."

    source /opt/DL/caffe/bin/caffe-activate

    /opt/DL/caffe/bin/convert_cifar_data.bin ${source_dir} ${target_dir} lmdb

    ```


