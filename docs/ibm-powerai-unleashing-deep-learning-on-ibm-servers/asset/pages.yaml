- pgno: 10
  md: '# Preface


    IBM® Redbooks® publication is a guide about the IBM PowerAI Deep Learning solution.
    This book provides an introduction to artificial intelligence (AI) and deep learning
    (DL), IBM PowerAI, and components of IBM PowerAI, deploying IBM PowerAI, guidelines
    for working with data and creating models, an introduction to IBM Spectrum™ of
    the Conductor Deep Learning Impact (DL), and case scenarios.


    IBM PowerAI started as a package of software distributions of many many DL software
    frameworks for model training, such as TensorFlow, Caffe, Theano, and the associated
    libraries, with CUDA Deep Neural Network (cuDNN). The IBM PowerAI software is
    optimized for performance by using IBM Power Systems™ servers that are integrated
    with NVLink. The AI stack foundation starts with servers with accelerators. Graphical
    processing unit (GPU) accelerators are well-suited for the intensive nature of
    DL training, and servers with the highest CPU to GPU bandwidth, as IBM Power Systems
    servers, enable the high-performance data transfer that is required for larger
    and more complex DL models.


    This publication targets technical readers, developers, IT specialists, systems
    architects, brand specialist, sales team, and anyone looking for a guide about
    to understand the IBM PowerAI Deep Learning architecture, framework configuration,
    application and workload configuration, and user infrastructure.


    # Authors


    This book was produced by a team of specialists from around the world working
    at the International Technical Support Organization, Poughkeepsie Center


    Dino Quintero is a Solutions Enhancement Project Leader and an IBM Level 3 Certified
    IT Specialist with IBM Redbooks in Poughkeepsie, New York. Dino shares his technical
    computing passion and expertise by leading teams developing content in the areas
    of enterprise, continuous availability, management, high-performance computing
    (HPC), cloud computing, and Analytics Solutions. He is also an Open Group Distinguished
    Technical Specialist. Dino holds a Master of Computing Information Systems degree
    and a Bachelor of Science in Computer Science from Maurice College.


    Bing He is a Consultant IT Specialist at IBM China. He joined IBM in 2007. He
    holds a degree in Computer Science from Beijing Jiaotong University. His areas
    of expertise include IBM AI®, performance tuning, IBM PowerVM®, IBM PowerHA®,
    IBM Geographically Dispersed Resiliency for IBM Power Systems, HA on Power, and
    Linux on Power.


    Bruno C. Faria is a Data Engineer at IBM Brazil. He has 9 years of experience
    in the Data and machine learning (ML) fields. He has worked at IBM for 9 years,
    and dedicated the last 3 years to big data and how to scale and manage large amounts
    of data and real-time data, and how to apply ML techniques to these systems. His
    areas of expertise include several SQL and No-SQL databases, ETL, DL, and others.'
  merge: -1
  img_proc: true
