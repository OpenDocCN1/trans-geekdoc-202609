- pgno: 223
  md: "# Fitting the TensorFlow model to fit IBM Fabric\n\nThis section introduces\
    \ the process of fitting the TensorFlow model to IBM Fabric. When you have single-node\
    \ single-card TensorFlow model and want to use IBM Fabric for distributed training\
    \ to accelerate the training process, you must call the IBM Fabric API and modify\
    \ some of the model's code.\n\nBefore fitting the model to IBM Fabric, there are\
    \ two limitations for the fabric TensorFlow model that you must understand:\n\n\
    +   1. IBM Fabric does not support `tf.placeholder()` as a data input. You must\
    \ use the TensorFlow queue schema as data input. For more information about the\
    \ TensorFlow queue schema, see the TensorFlow Programmers Guide.\n\n+   2. In\
    \ the TensorFlow model, you do not need to define the `tf.device()` operation.\
    \ IBM Fabric auto-deploys the model to single-node/multi-nodes, and multi-GPU\
    \ devices.\n\n> Note: Because of the first limitation, the IBM Fabric TensorFlow\
    \ training engine is for classification and object detection DL scenarios.\n\n\
    When you fit the TensorFlow model to DLI IBM Fabric, complete the following steps:\n\
    \n+   1. You must define the `fabricmodel.py`.\n\n+   2. In the `fabricmodel.py`\
    \ file, you must import the IBM API as shown in Example 6-12. For development,\
    \ you can obtain the IBM API files `meta_writer` and `tf_meta_pb2.py` from the\
    \ DLI Fabric tools.\n\nExample 6-12: Importing the IBM Fabric module\n\n```\n\
