    # # Working with data and creating models in IBM PowerAI


    This chapter illustrates practical examples of neural networks, how to implement
    them, and the advantages of using IBM PowerAI. It describes why you must understand
    the context of your project and learn that model definition is just one piece
    of the overall project.


    This chapter describes understanding a project in detail, from a business perspective
    to the technical levels. This context enables the technical team to verify and
    confirm the project feasibility before any initial decisions are implemented.


    The chapter then describes data preparation. After the project goals and direction
    are finalized, this stage is the next step. It is an initial critical project
    phase that if incorrectly done directly impacts the model''s accuracy. This chapter
    highlights many aspects and describes how a different model can change the method
    that is used for data preparation.


    The final sections of the chapter illustrate example coded neural network models
    and the process of data preparation and how that process provides the foundation
    to grow and advance the model.


    This chapter contains the following topics:


    +   * Knowing your requirements and data

