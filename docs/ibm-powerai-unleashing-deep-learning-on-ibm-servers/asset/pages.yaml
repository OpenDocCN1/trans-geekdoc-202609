  md: '# 4.2.2 Utilization of a multilayer perceptron on a sample data set


    The first test runs on an open source data set. For this test, as shown in Figure
    4-76, an MNIST database of handwritten numbers was chosen.


    ![](img/f6f95c5defc8b3406a94a86b8d202807_115_0.png)


    Figure 4-76 MNIST data set sample


    # MNIST data set


    Here is the MNIST data set.


    This data set has a training set of 60,000 examples, and a test of 10,000 examples.
    It is a subset of a larger set available from NIST. The digits are size-normalized
    and centered in a fixed-size image.


    The original black and white (bilevel) images from NIST are size-normalized to
    fit in a 20 x 20 pixel box while preserving their aspect ratio. The resulting
    images contain gray levels because of the anti-aliasing technique that is used
    by the normalization algorithm. The images are centered in a 28 x 28 image by
    computing the mass of the pixels, and converting the image to position at the
    center of the 28 x 28 field.


    # Multilayer perceptron


    The most basic and commonly used forward-propagation network among neural networks
    is multilayer perceptron MLP. An MLP is a class of feed-forward artificial neural
    network. An MLP consists of at least three layers of nodes, each node is a neuron
    that uses a nonlinear activation function. MLP uses a supervised learning technique
    that is back propagation for training. Its multiple layers and non-linear distinguishing
    MLP from a linear perceptron. It can distinguish data that is not linearly separable.


    MLPs are sometimes colloquially referred to as vanilla neural networks, especially
    when they have a single hidden layer.


    Figure 4-77 on page 103 shows a possible network architecture for an MLP that
    is used for character recognition over an MNIST data set.'
