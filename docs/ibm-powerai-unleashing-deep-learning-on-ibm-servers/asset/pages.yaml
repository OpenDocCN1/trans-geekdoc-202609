    # Berkeley Vision and Learning Center upstream Caffe⁴


    Caffe is a framework that has expression, speed, and modularity. It is developed
    by Berkeley Research (BAIR)⁵Berkeley Vision and Learning Center (BLVC)⁶ and community
    contributors.


    ³ MPI is a standardized message-passing standard that is designed by a group of
    researchers from academia and industry to target a wide variety of parallel computing
    architectures. The standard defines the syntax and semantics of a core library
    that is useful to a wide range of users writing message-passing programs in C,
    C++, and Fortran. There are well-tested and efficient implementations of MPI,
    which of many are open source or in the public domain.


    ⁴ Y. Jia, et al., "Caffe: Convolutional Architecture for Feature Attention," arXiv:1408.5093,
