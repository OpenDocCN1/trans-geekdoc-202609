  md: '# Anaconda


    Starting in IBM PowerAI V1.5 with Red Hat Enterprise Linux as the required operating
    system, Anaconda is required to distribute, update, and install software.


    Anaconda is the installation program that is used by Fedora, Red Hat Enterprise
    Linux, and some other distributions. During installation, a target computer''s
    hardware is identified and configured, the appropriate file systems for the system''s
    architecture are created. Anaconda enables the user to install the operating system
    software on the target computer. Anaconda can also upgrade existing installations
    of earlier versions of the same distribution. After the installation is complete,
    you can restart your installed system and continue customization using the initial
    setup.


    Anaconda is a fairly sophisticated installer. It supports installation from local
    and remote sources such as CDs and DVDs, images that are stored on an HDD, NFS,
    HTTP, and FTP. Installation can be scripted with kickstart to provide a fully
    unattended installation that can be duplicated on copies of machines. Anaconda
    can also run over VNC on machines without an interface. Various advanced storage
    devices, LVM, RAID, ISCSI, and multipath, are supported from the partitioning
    program. Anaconda provides advanced features for remote logging, access to the
    Python interpreter debugger, and saving of exception dumps.


    Starting from IBM PowerAI V1.5, Anaconda is a requirement when using TensorFlow
    and Caffe frameworks.


    Table 3-21 Anaconda versions for IBM PowerAI.


    | PowerAI version | Anaconda 2 |

    | V1.3.0 | N/A |

    | V1.3.1 | |

