  md: 'Aside from all the features and capabilities that are provided by BVLC Caffe,
    the IBM optimized version of BVLC Caffe offers extra advantages:


    +   This compilation is optimized by IBM Power systems engineers and designed
    to run on Power Systems, so it is highly optimized for POWER processors.


    +   As part of the collaboration with NVIDIA, this compilation is also optimized
    for NVIDIA GPUs (including many of the optimizations NVCAaffe includes).


    +   Includes support for Large Model Support (LMS).


    For more information, GitHub - open-power-ref-design/deep-learning.


    # NVIDIA fork of Caffe


    NVIDIA Caffe is an NVIDIA-maintained fork of BVLC Caffe that is tuned for NVIDIA
    GPUs, particularly in multi-GPU configurations. Table 3-14 shows the NVIDIA Caffe
    version for IBM PowerAI.


    Table 3-14 NVIDIA Caffe versions


    | IBM PowerAI version | NVIDIA fork of Caffe | |

    |---|---|---|

    | V1.3.0 | Alternative | Default |

    | | V0.14.15 | |

    | V1.3.1 | |

    | | V0.15.13 |

    | V1.3.2 | | |

    | V1.3.3 | | |

    | V1.3.4 | | V0.15.14 |

    | V1.4.0 | | V0.15.14 |

    | V1.5.0 | Deprecated, no longer part of IBM PowerAI |


    Here are the major features:


    +   16-bit (half) floating point train and inference support.


    +   Mixed-precision support to store and compute data in 64-, 32-, or 16-bit formats.
    Precision can be defined for every layer (forward and backward passes might be
    different), or it can be set for the whole net.


    +   Integration with cuDNN v6.


    +   Automatic selection of the best cuDNN convolutional algorithm.


    +   Integration with Version 1.3.4 of NCCL library for improved multi-GPU scaling.


    +   Optimized GPU memory management for data and parameters storage, I/O buffers,
    and workspace for convolutional layers.


    +   Parallel data parser and transformer for improved I/O performance.


    +   Parallel back propagation and gradient reduction on multi-GPU systems.


    +   Fast solvers using fused CUDA kernels for weights and history update.


    +   Multi-GPU test phase for even memory load across multiple GPUs.


    +   Compatibility with earlier versions of BVLC Caffe and NVCAffe 0.15.


    +   Extended set of optimized models (including 16-bit floating point examples).'
