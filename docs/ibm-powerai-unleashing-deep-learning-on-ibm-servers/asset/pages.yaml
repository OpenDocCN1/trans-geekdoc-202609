    # Red Hat Enterprise Linux for IBM POWER


    Starting with Red Hat Enterprise Linux 7.1, Red Hat provides separate bands and
    licenses for big endian and little endian versions for IBM Power Systems.


    Red Hat Enterprise Linux 7.4 for IBM Power LE (POWER9) introduces the Red Hat
    Enterprise Linux 7.4 user space with an updated kernel.


    The Red Hat Enterprise Linux 7.4 kernel depends on the CPU POWER architecture,
    so it is better for POWER8 and POWER9 processes.


    For more information about Red Hat Enterprise Linux for IBM POWER, see [Red Hat
    Enterprise Linux 7.4 for IBM Power LE (POWER9) - Release Notes] and [Power System
    S822LC for High Performance Computing].


    # 3.1.4 NVIDIA GPUs


    GPUs are functional when it comes to calculations that are related to DL. Unlike
    CPUs, GPUs are designed and optimized to perform mathematical operations over
    matrices and vectors, which are the core of DL, in particular, during training
    tasks (the most intensive).


    Table 3-5 shows the main differences between CPUs and GPUs.


    | GPUs | CPUs |

    | --- | --- |

    | Hundreds or thousands of simpler cores | A few complex cores |

    | Thousands of concurrent hardware threads | Single or low number of threads performance
    optimization |

    | Maximize floating-point throughput | Not applicable |

    | Most die surface for integrating and floating-point units | Transistor space
    that is dedicated to ILP |


    Table 3-5 GPUs versus CPUs


    IBM PowerAI relies on the IBM POWER architecture, which is known for its resilience
    and SMT capabilities, plus the NVIDIA GPUs and NVLink technologies, as shown in
    Table 3-6.


