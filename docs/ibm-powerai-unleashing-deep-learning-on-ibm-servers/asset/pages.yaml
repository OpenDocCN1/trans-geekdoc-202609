- pgno: 263
  md: '# Logs and configuration data gathering tools


    Linux, as an open technology, has many tools that help sysadmins gather relevant
    information from a system, before, during, and after a problem occurs. This section
    covers two of these tools:


    +   - The sosreport tool

    - The Scale-out LC System Event Log Collection Tool


    # The sosreport tool


    Sosreport is an extensible and portable data collection tool that is primarily
    aimed at Linux distributions and other UNIX-like operating systems.


    This section describes the installation and use of this tool with Ubuntu. The
    tool also can be used with Red Hat Enterprise Linux (RHEL).


    The main purpose of this tool is to gather and collect system logs and configuration
    from a running system. This is a package that is provided as standard in Ubuntu
    where you can collect logs and configuration information in a batch file.


    # Installing sosreport


    To install the sosreport tool, install the package by running the following command
    (the system needs connectivity to an Ubuntu package repository):


    ```

    $ apt-get install sosreport

    Reading package lists ...n(...) Processing triggers for man-db (2.7.5-1) ...

    Setting up sosreport (3.4-1 ~ ubuntu 16.04.1) ...

    ```


    # Running sosreport


    To run the sosreport tool, run the following command (you need root permission):


    ```

    $ sosreport

    sosreport (version 3.4)

    (...)

    No changes will be made to system configuration.

    Press ENTER to continue your initial and last name [comp02]:

    Please enter the case id that you are generating this report for []:

    (...)

    Your report has been generated and saved in:

    /tmp/sosreport-comp02-2017082514916.tar.xz

    The checksum is: 90bce3c9a8ec3fb916a79666b916.

    Please send this to your support representative.

    ```


    A .tgz is generated /tmp/. You can expand it to see the contents or send it for
    analysis.'
  merge: -1
  img_proc: true
- pgno: 264
  md: "# The Scale-out LC System Event Log Collection Tool\n\nThis tool is a Perl\
    \ script that is provided by IBM Support that collects logs from a remote local\
    \ system through an SSH connection to its baseboard management controller (BMC).\
    \ The script can be used with an open problem management report (PMR) to provide\
    \ more information to IBM Support for systems under a support contract with IBM.\
    \ The tool used to gather and central logs and configurations from many Power\
    \ Systems LC systems in a central Linux repository.\n\n# Prerequisites\n\nBefore\
    \ you install the tool, you must meet these prerequisites:\n\n+   - The operating\
    \ system where the collector tool is run must be Linux.\n- The Linux system must\
    \ have network connectivity to the BMC.\n- The Linux system that is used to perform\
    \ the data collection must have the following packages installed:\n  - ipmitool\n\
    \  - perl\n  - sshpass\n\nTo install these packages, run the following command:\n\
    \n```\n$ sudo apt-get install perl sshpass ipmitool\n```\n\n# Where to get the\
    \ tool\n\nThe tool can be downloaded from Scale-out LC System Event Log Collection\
    \ Tool.\n\nThere is more than one version of the tool, depending on the system's\
    \ model and type. You choose the one that applies to you and download the correct\
    \ plc.zip file.\n\n# Installation steps\n\nTo install the tool, complete the following\
    \ steps:\n\n+   1. Copy the plc.zip package to a Linux system that has network\
    \ connectivity to the BMC of the Scale-out LC server from which you need to collect\
    \ data.\n2. Extract the plc.zip file into a directory of your choice by running\
    \ the following command:\n\n```\n$ unzip plc.zip\n```\n\n```\ninflating: eSEL\
    \ 2.p\ninflating: led_status.sh\ninflating: plc.pl inflating:\nREADME\n```\n\n\
    The directory now contains the following files:\n\n+   - plc.pl\n- eSEL.2\n- led_status.sh\n\
    - README"
  merge: -1
  img_proc: true
- pgno: 265
  md: 'Note: The files that are generated by this script are saved in the same directory
    from which the script is run.


    # Usage


    This section shows the command syntax, its flags, a sample run, and its result:


    ```

    $ plc.pl [-b bmc_address | -i ] [-a admin_pw] [-s sysadmin_pw] [-h host -u user
    -p password] [-f]

    ```


    Here are the flags:


    | | |

    |---||

    | -b | BMC host name or IP address |

    | -a | BMC ADMIN password if changed from the default (admin) |

    | -s | BMC sysadmin password if changed from the default (superuser) |

    | -i | Interactive mode |

    | -f | Collect BMC firmware image |

    | -h | Linux host address |

    | -u | Linux host user ID |

    | -p | Linux host password |


    To use the tool, run the following command (in this example, the BMC IP is 10.10.10.10):

    $ ./plc.pl -b 10.10.10.10 -a admin -f


    Getting BMC data

    Warning: Permanently added ''10.10.10.10'' (RSA) to the list of known hosts.

    ................

    Getting IPMI Data

    ................


    To list the resulting file, run the following command:

    $ ls -l

    10.7.22.1-2017-06-30145.powerlc.tar.gz


    # Errors


    +   This section highlights a few errors messages and their exit codes:

    * If sshpass is not found on the system, the plc.pl script prints sshpass is required
    and not found on this system and exits with return code 1

    * If the BMC is not reachable by a ping, the plc.pl script prints Unable to ping
    bmhostname/IPAddress and exits with return code 2

    * If a command not found error is returned when running the plc.pl command, try
    the command by prefixing the command with ./ so that the command is ./plc.pl.


    # Troubleshooting pointers for Linux on Power


    IBM provides a troubleshooting and problem analysis list and techniques for Linux
    on Power Systems at IBM Knowledge Center.'
  merge: -1
