    | V1.3.4 | |

    | V1.4.0 | |

    | V1.5.0 | 5.0.0a |

    na. Anaconda is required if TensorFlow or Caffe frameworks are used.


    For more information, see Anaconda at the Fedora Project.


    # IBM PowerAI Distributed Deep Learning


    Many times, the amount of data that is required to be processed exceeds the capacity
    processing of a single server. In other cases, the training time can potentially
    be reduced by dividing the tasks among a cluster of servers.


    To accelerate the time that is dedicated to training a model, the IBM PowerAI
    stack uses new technologies to deliver exceptional training performance by distributing
    a single training job across a cluster of servers.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'IBM PowerAI provides intelligence about the structure and layout of the underlying
    cluster (topology), which includes information about the location of the cluster''s
    different compute resources, as GPUs and CPUs and the data on each node.


    IBM PowerAI is unique in that this capability is incorporated into the DL frameworks
    as an integrated binary, reducing complexity for clients who are in high-performance
    cluster environments


    As a result of this, IBM PowerAI with DDL can scale jobs across many cluster resources
    with little to communication impact.


    For an in-depth discussion on IBM PowerAI and IBM PowerAI DDL scalability, read
    IBM PowerAI DDL (2017). It was written by a team of IBM scientists who describe
    and prove that DL workload performance using IBM PowerAI DDL scales linearly with
    the number of nodes.


    > Note: At the time of writing, DDL is available as a technology preview with
    IBM PowerAI V1.4 and V1.5.0, and is compatible with bundled TensorFlow and Caffe
    frameworks.


    For more information, see Deep Learning and PowerAI Development.


    # Large Model Support


    Because the models are becoming more complex and the data sets are getting larger,
    DL workloads are becoming bigger. In many cases, the size of the data set overflows
    the GPU memory, keeping these workloads from being analyzed in these systems.


    Figure 3-1 shows data fragmentation in a traditional approach that divides the
    problem into 16 GB chunks without LMS.


    ![](img/f6f95c5defc8b3406a94a86b8d202807_69_0.png)


    Figure 3-1 Large Model Support disabled


    LMS uses the system memory with GPU memory to overcome GPU memory limitations
    in DL training.'
