    | CUDA cores | 5376 | 3840 |


    > ² ppc64le is a pure little endian that was introduced with POWER8 as the primary
    target for technologies that enable porting of the x86 Linux-based software provided
    by the OpenPower Foundation, aiming at enabling minimal effort.'
