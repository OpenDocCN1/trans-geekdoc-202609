    # Preparing disks for a RAID array


    As the onboard SATA adapter does not provide any hardware RAID features, the following
    steps can be taken to configure software RAID. Although software RAID is not a
    requirement of IBM PowerAI, it is a preferred method to mitigate against local
    disk failure. Creating a RAID device is not mandatory for the installation of
    IBM PowerAI, although it is preferred because it provides high availability (HA)
    if there is a failure of one of the disks (SDDs) or hard disk drives (HDDs) that
    are part of the RAID array.


    For more information, see the Ubuntu wiki.


