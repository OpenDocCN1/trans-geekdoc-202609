- pgno: 37
  md: '# 2.3 IBM unique capabilities


    This section highlights the unique capabilities of IBM products and solutions
    that you can take advantage with IBM PowerAI, which includes the following items:


    +   - NVLink and NVLink 2.0

    - Distributed Deep Learning (DDL)

    - Large Model Deep Support (LMS)


    # 2.3.1 NVLink and NVLink 2.0


    Announced in 2014, NVLink is the NVIDIA proprietary high-speed, low-latency physical
    interconnect. NVLink improves on the traditional communication between multiple
    GPUs, enabling efficient and performance communication between GPUs and system
    memory. Additionally, NVLink provides more performant and efficient communication
    between system CPUs and GPUs.


    The initial generation of NVLink was implemented with the NVIDIA GPU based on
    their Pascal-microarchitecture. It provides higher bandwidth than the industry-standard
    Peripheral Component Interconnect (PCIe) interface. NVLink was first commercially
    available in September 2016 with the launch of the IBM Power System S822LC for
    High Performance Computing server. This model is available in configurations with
    either 2 or 4 NVIDIA Tesla P100 GPUs.


    The implementation of NVLink in this IBM POWER8 system provides a bidirectional
    path between GPUs of up to 180 Gbps and a bidirectional path between the GPUs
    and CPUs of up to 80 Gbps.


    In systems that configured with more than one GPU, the benefits that are provided
    by NVLink increase and scale. Each extra GPU adds a separate interconnect between
    itself and neighboring GPUs and each itself the nearest CPU.


    In 2017, NVLink announced the second generation of NVLink with the introduction
    of its Volta-microarchitecture. It provides improved data rates up to 300 Gbps.
    The POWER9 processor-based IBM Power System AC922 for High Performance Computing
    server launched in December 2017 with the second generation of NVLink, supporting
    configurations of up to six NVIDIA GPUs.


    > Note: For more information about the deployment and architecture of NVLink,
    including performance metrics, see the NVIDIA NVLink website.


    # 2.3.2 Power AI Distributed Deep Learning


    IBM PowerAI DDL is a software/hardware co-optimized distributed DL system that
    can achieve near-linear scaling up to 256 GPUs. This algorithm is encapsulated
    as a communication library that is called DDL that provides communication APIs
    for implementing DL patterns across multiple DL frameworks.


    The inherent challenge with distributed DL systems is that as the number of learners
    increases, the amount of computation decreases at the same time of communication
    remains constant. This intuitively results in unwanted communication ratios.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'To mitigate the impact of this scaling problem, IBM DDL uses an innovative
    multi-ring communication algorithm that balances the communication PowerAI latency
    and communication impact. This algorithm adapts to the hierarchy of communication
    bandwidths, intranode, internode, and interact, within any system. This implementation
    allows for adaptation, which enables the optimal IBM PowerAI DDL to deliver for
    an environment.


    The current implementation of IBM PowerAI DDL is based on IBM Spectrum MPI because
    IBM Spectrum MPI provides many of the required functions, such as scheduling processes
    and communications in a portable, efficient, and mature software infrastructure.
    IBM Spectrum MPI specifically provides functions and optimizations to IBM Power
    Systems and InfiniBand network technology.


    IBM PowerAI DDL objects() are the foundation of IBM PowerAI DDL. Each object instance
    contains both the data and relevant metadata. The data structure component itself
    can contain various payloads, such as a tensor of gradients. The metadata provides
    a definition of the host, type of device (GPU others), device identifier, and
    the type of memory where the data structure is. All of the functions within IBM
    PowerAI DDL operate on these objects, which are effect synonymous with variables.


    In a 256 GPU environment, about 90 GB of data must be transmitted to perform a
    simple reduction operation, and the same amount of data must be transmitted to
    copy the result to all the GPUs. Even a fast network connection with a 10 Gbps
    transfer rate bringing this data to a single Parameter Server (PS) can take 9
    seconds. IBM PowerAI DDL performs the entire reduction and distribution of 350
    MB in less than 100 ms using a communication scheme that is optimized for the
    specific network topology.


    A key differentiator for IBM PowerAI DDL is its ability to optimize the communication
    scheme based on the bandwidth of each available link, topology, and latency for
    each segment. In a heterogeneous environment, with multiple link speeds, IBM PowerAI
    DDL adjusts its dimensions to use the fastest available link, thus preventing
    the slowest link from dominating the run time.'
  merge: -1
  img_proc: true
