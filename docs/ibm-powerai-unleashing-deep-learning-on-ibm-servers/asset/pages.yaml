  md: '# 1.3 Deep learning frameworks


    Implementing neural networks algorithms is not an easy task as it requires several
    lines of code to create a simple neural network, and it probably lacks several
    features. Besides the neural network logic with all its neurons and connections,
    it is necessary to think about how to distribute the heavy training process across
    different machines and make them run on CPUs and GPUs.


    This is where DL frameworks come into play. They take care of most the complexities
    that are involved in running neural network algorithms, and all the code that
    is necessary to interact with the GPU library. They also do many things besides
    implementing these algorithms, as providing higher-level APIs to make the DL code
    easier to implement.


    # 1.3.1 Most popular learning frameworks


    There are several DL frameworks, and each has their own specific characteristics,
    advantages, and disadvantages. This section introduces and describes the most
    popular learning frameworks.


    # Caffe


    Caffe is one of the first DL frameworks, even though it is not old. Caffe was
    created at Berkeley University by Yangqing Jia during his PhD years. Caffe was
    developed in C++ and it supports Python.


    Today, Caffe is stable and suited for production, but it is also used in research.
    Caffe performs well when the area is computer vision, such as image recognition,
    but it lacks in other DL areas.


    The framework also works with GPUs that use the CUDA Deep Neural Network (cuDNN)
    library. The code can be found on GitHub.9 Unfortunately, it still lacks documentation.


    # Chainer


    Chainer is a flexible framework that enables a complex neural network architecture
    in a simpler way.


    Chainer implements a Define-by-Run methodology, which means that the network Chainer
    creates is defined dynamically during runtime. This approach is similar to writing
    in any language a FOR loop runs the same within the network as it is in a normal
    code.


    The framework was developed in Python and there are no other interfaces. As mentioned
    on the official website,10 Chainer works by representing a network as an execution
    path on a computational graph where this computational graph is a series of function
    activations. Each function is a layer of a neural network, and they are connected
    using links where the variables are, and are updated during the training process.


    Chainer is successful framework, although other frameworks are capable for applicable
    models. Chainer has a well documented model11 and several examples on the web.
    It is possible to run Chainer on GPUs using the CuPy library, which can be easily
    installed.


    ```

    $9 https://github.com/bayC/caffe

    10 https://docs.chainer.org/en/stable/tutorial/basic.html

    11 https://chainer.org/

    ```'
  merge: -1
  img_proc: true
