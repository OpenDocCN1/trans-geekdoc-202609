  md: "# Removing the disk in /dev/sda\n\nTo remove a disk in /dev/sda, complete the\
    \ following steps:\n\n+   Remove the disk from the RAID definition:\n- Exclude\
    \ /dev/sda2 from the software-defined RAID:\n  - sudo mdadm --remove /dev/md0\
    \ /dev/sda2\n    mdadm: removed /dev/sda2 from /dev/md0\n- Exclude /dev/sda from\
    \ the system:\n  - sudo echo  > /sys/block/sda/device/delete\n  - Confirm that\
    \ /dev/sda is excluded from the system:\n  - sudo fdisk -l\n\n# Adding a disk\
    \ and creating a partition\n\nTo add a disk and create a partition, complete the\
    \ following steps:\n\n+   Install the disk in the system.\nRecognize the disk\
    \ in the system:\n  - $ sudo echo \" - \" > /sys/class/scsi_host0/scan\nConfirm\
    \ that the disk is recognized as /dev/sda:\n  - $ fdisk -l\nCreate a partition\
