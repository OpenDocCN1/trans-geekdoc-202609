  fmt: "\n# PHP String Operators\n\nPHP 字符串运算符包含两种运算符：连接运算符（`.`）和连接赋值运算符（`.=`）。\n\n\
    - **连接运算符**：`$x . $y` 将 `$x` 和 `$y` 连接起来。\n- **连接赋值运算符**：`$x .= $y` 将 `$y` 追加到\
    \ `$x` 后面。\n\n---\n\n# 第 9 章：PHP 中的字符串\n\n字符串是字符序列。\n\n## 如何定义字符串变量？\n\n请看下面的示例：\n\
    \n```php\n$x = \"hello world\";\n```\n\n在上面的示例中，我们创建了一个变量 `$x` 并为其赋值。该值是一个字符序列，因此这样就创建了一个字符串变量。\n\
    \nPHP 中有各种字符串函数可用于应用程序，下面讨论其中一些：\n\n假设我们要检查字符串变量的长度，可以使用 `strlen()`。\n\n```php\n\
    <?php echo strlen(\"hi\"); ?>\n```\n\n输出结果为 `2`，因为只有两个字符。\n\n还有许多其他的 PHP 字符串函数，如\
    \ `strstr()`、`strlen()`、`strpos()` 等。\n\n---\n\n# PHP 数组\n\n数组用于在单个变量中存储多个值。\n\
    \n定义数组使用 `[]` 括号。\n\n定义一个名为 `fruits` 的数组：\n\n```php\n$fruits = array();\n```\n\
    \n上面的 `$fruits` 是一个空数组。现在为其赋值：\n\n```php\n$fruits = ['guava', 'apple', 'orange',\
    \ 'pineapple', 'mango'];\n```\n\n如果打印 `$fruits[1]`，结果将是 `apple`，因为 `apple` 在索引\
    \ 1 处。\n\n数组主要有三种类型：\n\n1. **索引数组**：索引为数字。\n2. **关联数组**：索引不为数字（通常为字符串）。\n3. **多维数组**：包含一个或多个数组的数组。\n\
    \n---\n\n# 第 10 章：If 和 Else 语句块及示例\n\n`if` 和 `else` 是条件语句块，根据条件执行不同操作。\n\n**示例**：当变量值为\
    \ 10 时打印 \"hello\"。\n\n```php\n<?php\n$var = 10;\nif ($var == 10) {\n    echo\
    \ \"hello\";\n} else {\n    echo \"bye\";\n}\n?>\n```\n\n在上面的示例中：\n1. 定义变量 `$var`\
    \ 并赋值为 10。\n2. 应用 `if` 条件：如果变量值为 10 则打印 \"hello\"，否则执行 `else` 块打印 \"bye\"。\n3.\
    \ 由于变量值满足 `if` 条件（值为 10），屏幕将显示 \"hello\"。\n\n输出示意图：\n![Illustration 9: If .. Else\
    \ block](image_rsrcE3.jpg)\n\n---\n\n# 第 11 章：PHP 循环\n\n当需要在满足特定条件时重复执行代码块时使用循环。\n\
    \n循环类型：\n- `while`\n- `do ... while`\n- `for`\n- `foreach`\n\n## While 循环\n\n\
    当条件为真时持续执行。\n\n**语法**：\n```php\nwhile (condition is true) {\n    // code to be\
    \ executed\n}\n```\n\n**示例**：\n```php\n$var = 1;\nwhile ($var <= 6) {\n    echo\
    \ $var;\n    $var++;\n}\n```\n**输出**：`123456`\n变量每次增加 1 并显示，直到其值小于或等于 6。\n\n##\
    \ Do...While 循环\n\n先执行一次代码块，然后在条件为真时重复循环。\n\n**语法**：\n```php\ndo {\n    // code\
    \ to be executed\n} while (condition is true);\n```\n\n**示例**：\n```php\n$var =\
    \ 1;\ndo {\n    echo $var;\n    $var++;\n} while ($var <= 6);\n```\n**输出**：`123456`\n\
    \n## For 循环\n\n在条件为真时，按指定次数迭代代码块。\n\n**语法**：\n```php\nfor (initialization; condition;\
    \ increment) {\n    // code to be executed\n}\n```\n\n**示例**：\n```php\nfor ($x\
    \ = 1; $x <= 5; $x++) {\n    echo $x;\n}\n```\n**输出**：`12345`\n\n## Foreach 循环\n\
    \n遍历数组中的每个元素。\n\n**语法**：\n```php\nforeach ($array as $key => $value) {\n    echo\
    \ $key;\n    echo '<br>';\n    echo $value;\n}\n```\n\n**示例**：\n假设有数组变量 `$arr`：\n\
    ```php\n$arr = ['a' => 'yellow', 'b' => 'red', 'c' => 'white'];\nforeach ($arr\
    \ as $key => $value) {\n    echo $key;\n    echo '<br>';\n    echo $value;\n}\n\
    ```\n**输出**：\n```text\na\nyellow\nb\nred\nc\nwhite\n```\n\n---\n\n# PHP 超全局变量\n\
    \n预定义的全局作用域变量，即可在脚本任何位置访问。无需特殊操作即可调用。\n\n主要超全局变量：\n- `$GLOBALS`\n- `$_SERVER`\n\
    - `$_POST`\n- `$_GET`\n- `$_REQUEST`\n- `$_FILES`\n- `$_ENV`\n- `$_COOKIE`\n-\
    \ `$_SESSION`\n\n功能说明：\n- `$_SERVER`：返回与头部和路径相关的信息。\n- `$_POST`：用于获取从表单提交的数据值。\n\
    - `$_GET`：用于获取 GET 变量的值。\n- `$_REQUEST`：用于同时获取 POST 和 GET 数据。\n- `$_ENV`：环境变量。\n\
    \n---\n\n# PHP 表单\n\n现代网站（餐厅预订、活动报名、博客等）都包含表单功能。\n\n**场景**：访问餐厅网站预订晚餐。经理需要知道预订信息，开发人员创建页面收集客人信息（姓名、手机号等）并存入数据库。\n\
    \n## 表单基础\n\n- 表单以 `<form>` 标签开始，以 `</form>` 结束。\n- 基本字段：文本框、密码框、文本域、日期选择器、单选按钮、复选框。\n\
    - 每个表单有 `method` 属性：`post` 或 `get`，指定数据传输方式。\n  - `get` 为默认方法，数据追加在 URL 中。\n \
    \ - `post` 更安全，数据不暴露在 URL 中。\n- 每个表单有 `action` 属性：提交后重定向到指定页面处理表单。\n\n**语法**：\n\
    ```html\n<form action=\"action.php\" method=\"post\">\n    <field1...>\n    <field2...>\n\
    </form>\n```\n\n**示例**：客人预订餐桌表单\n```html\n<form method=\"post\" action=\"process.php\"\
    >\n    Name: <input type=\"text\" name=\"name\">\n    Mobile: <input type=\"number\"\
    \ name=\"mobile\">\n    Email: <input type=\"text\" name=\"email\">\n    <input\
    \ type=\"submit\" name=\"submit\" value=\"submit\">\n</form>\n```\n\n---\n\n#\
    \ 第 14 章：服务端验证\n\n提交表单时应进行验证，即检查必填字段非空且数据类型正确。\n\n针对上述表单，在 `process.php` 中添加处理逻辑：\n\
    \n```php\nif (isset($_POST['submit'])) {\n    if ($_POST['name'] != '' && $_POST['number']\
    \ != '' && $_POST['email']) {\n        // code to be executed\n    } else {\n\
    \        // redirect to previous page\n    }\n}\n```\n\n上述代码检查字段是否包含值。若任意字段未设置值，则将用户重定向回表单页面。\n\
    \n---\n\n# 第 15 章：MySQL 简介\n\nMySQL 是开源关系型数据库系统，是 PHP 最常用的数据库。由 Oracle 公司开发、分发和支持。\n\
    \nMySQL 中包含表，每个表包含行和列。适用于大小型应用，速度快、可靠、易用，可在多种平台编译运行。\n\n---\n\n# 第 16 章：PHP 连接\
    \ MySQL\n\n可使用 `mysqli` 扩展连接 MySQL。\n\n**语法**：\n```php\n<?php\n$host = 'localhost';\n\
    $username = 'root';\n$password = '';\n\n// 创建新连接\n$conn = new mysqli($host, $username,\
    \ $password);\n\nif ($conn->connect_error) {\n    die('Connection Failed: ' .\
    \ $conn->connect_error);\n}\n\necho 'Connected Successfully';\n?>\n```\n\n**输出**：\n\
    ```text\nConnected Successfully\n```\n\n在上面的代码中，我们创建了 `mysqli` 类的实例。\n"
  trans: "\n# PHP 字符串运算符\n\nPHP 字符串运算符包含两种运算符：连接运算符（`.`）和连接赋值运算符（`.=`）。\n\n- **连接运算符**：`$x\
    \ . $y` 将 `$x` 和 `$y` 连接起来。\n- **连接赋值运算符**：`$x .= $y` 将 `$y` 追加到 `$x` 后面。\n\n\
    ---\n\n# 第 9 章：PHP 中的字符串\n\n字符串是字符序列。\n\n## 如何定义字符串变量？\n\n请看下面的示例：\n\n```php\n\
    $x = \"hello world\";\n```\n\n在上面的示例中，我们创建了一个变量 `$x` 并为其赋值。该值是一个字符序列，因此这样就创建了一个字符串变量。\n\
    \nPHP 中有各种字符串函数可用于应用程序，下面讨论其中一些：\n\n假设我们要检查字符串变量的长度，可以使用 `strlen()`。\n\n```php\n\
    <?php echo strlen(\"hi\"); ?>\n```\n\n输出结果为 `2`，因为只有两个字符。\n\n还有许多其他的 PHP 字符串函数，如\
    \ `strstr()`、`strlen()`、`strpos()` 等。\n\n---\n\n# PHP 数组\n\n数组用于在单个变量中存储多个值。\n\
    \n定义数组使用 `[]` 括号。\n\n定义一个名为 `fruits` 的数组：\n\n```php\n$fruits = array();\n```\n\
    \n上面的 `$fruits` 是一个空数组。现在为其赋值：\n\n```php\n$fruits = ['guava', 'apple', 'orange',\
    \ 'pineapple', 'mango'];\n```\n\n如果打印 `$fruits[1]`，结果将是 `apple`，因为 `apple` 在索引\
    \ 1 处。\n\n数组主要有三种类型：\n\n1. **索引数组**：索引为数字。\n2. **关联数组**：索引不为数字（通常为字符串）。\n3. **多维数组**：包含一个或多个数组的数组。\n\
    \n---\n\n# 第 10 章：If 和 Else 语句块及示例\n\n`if` 和 `else` 是条件语句块，根据条件执行不同操作。\n\n**示例**：当变量值为\
    \ 10 时打印 \"hello\"。\n\n```php\n<?php\n$var = 10;\nif ($var == 10) {\n    echo\
    \ \"hello\";\n} else {\n    echo \"bye\";\n}\n?>\n```\n\n在上面的示例中：\n1. 定义变量 `$var`\
    \ 并赋值为 10。\n2. 应用 `if` 条件：如果变量值为 10 则打印 \"hello\"，否则执行 `else` 块打印 \"bye\"。\n3.\
    \ 由于变量值满足 `if` 条件（值为 10），屏幕将显示 \"hello\"。\n\n输出示意图：\n![图解 9：If .. Else 语句块](img/image_rsrcE3.jpg)\n\
    \n---\n\n# 第 11 章：PHP 循环\n\n当需要在满足特定条件时重复执行代码块时使用循环。\n\n循环类型：\n- `while`\n- `do\
    \ ... while`\n- `for`\n- `foreach`\n\n## While 循环\n\n当条件为真时持续执行。\n\n**语法**：\n\
    ```php\nwhile (condition is true) {\n    // code to be executed\n}\n```\n\n**示例**：\n\
    ```php\n$var = 1;\nwhile ($var <= 6) {\n    echo $var;\n    $var++;\n}\n```\n\
    **输出**：`123456`\n变量每次增加 1 并显示，直到其值小于或等于 6。\n\n## Do...While 循环\n\n先执行一次代码块，然后在条件为真时重复循环。\n\
    \n**语法**：\n```php\ndo {\n    // code to be executed\n} while (condition is true);\n\
    ```\n\n**示例**：\n```php\n$var = 1;\ndo {\n    echo $var;\n    $var++;\n} while\
    \ ($var <= 6);\n```\n**输出**：`123456`\n\n## For 循环\n\n在条件为真时，按指定次数迭代代码块。\n\n**语法**：\n\
    ```php\nfor (initialization; condition; increment) {\n    // code to be executed\n\
    }\n```\n\n**示例**：\n```php\nfor ($x = 1; $x <= 5; $x++) {\n    echo $x;\n}\n```\n\
    **输出**：`12345`\n\n## Foreach 循环\n\n遍历数组中的每个元素。\n\n**语法**：\n```php\nforeach ($array\
    \ as $key => $value) {\n    echo $key;\n    echo '<br>';\n    echo $value;\n}\n\
    ```\n\n**示例**：\n假设有数组变量 `$arr`：\n```php\n$arr = ['a' => 'yellow', 'b' => 'red',\
    \ 'c' => 'white'];\nforeach ($arr as $key => $value) {\n    echo $key;\n    echo\
    \ '<br>';\n    echo $value;\n}\n```\n**输出**：\n```text\na\nyellow\nb\nred\nc\n\
    white\n```\n\n---\n\n# PHP 超全局变量\n\n预定义的全局作用域变量，即可在脚本任何位置访问。无需特殊操作即可调用。\n\n主要超全局变量：\n\
    - `$GLOBALS`\n- `$_SERVER`\n- `$_POST`\n- `$_GET`\n- `$_REQUEST`\n- `$_FILES`\n\
    - `$_ENV`\n- `$_COOKIE`\n- `$_SESSION`\n\n功能说明：\n- `$_SERVER`：返回与头部和路径相关的信息。\n\
    - `$_POST`：用于获取从表单提交的数据值。\n- `$_GET`：用于获取 GET 变量的值。\n- `$_REQUEST`：用于同时获取 POST\
    \ 和 GET 数据。\n- `$_ENV`：环境变量。\n\n---\n\n# PHP 表单\n\n现代网站（餐厅预订、活动报名、博客等）都包含表单功能。\n\
    \n**场景**：访问餐厅网站预订晚餐。经理需要知道预订信息，开发人员创建页面收集客人信息（姓名、手机号等）并存入数据库。\n\n## 表单基础\n\n-\
    \ 表单以 `<form>` 标签开始，以 `</form>` 结束。\n- 基本字段：文本框、密码框、文本域、日期选择器、单选按钮、复选框。\n- 每个表单有\
    \ `method` 属性：`post` 或 `get`，指定数据传输方式。\n  - `get` 为默认方法，数据追加在 URL 中。\n  - `post`\
    \ 更安全，数据不暴露在 URL 中。\n- 每个表单有 `action` 属性：提交后重定向到指定页面处理表单。\n\n**语法**：\n```html\n\
    <form action=\"action.php\" method=\"post\">\n    <field1...>\n    <field2...>\n\
    </form>\n```\n\n**示例**：客人预订餐桌表单\n```html\n<form method=\"post\" action=\"process.php\"\
    >\n    Name: <input type=\"text\" name=\"name\">\n    Mobile: <input type=\"number\"\
    \ name=\"mobile\">\n    Email: <input type=\"text\" name=\"email\">\n    <input\
    \ type=\"submit\" name=\"submit\" value=\"submit\">\n</form>\n```\n\n---\n\n#\
    \ 第 14 章：服务端验证\n\n提交表单时应进行验证，即检查必填字段非空且数据类型正确。\n\n针对上述表单，在 `process.php` 中添加处理逻辑：\n\
    \n```php\nif (isset($_POST['submit'])) {\n    if ($_POST['name'] != '' && $_POST['number']\
    \ != '' && $_POST['email']) {\n        // code to be executed\n    } else {\n\
    \        // redirect to previous page\n    }\n}\n```\n\n上述代码检查字段是否包含值。若任意字段未设置值，则将用户重定向回表单页面。\n\
    \n---\n\n# 第 15 章：MySQL 简介\n\nMySQL 是开源关系型数据库系统，是 PHP 最常用的数据库。由 Oracle 公司开发、分发和支持。\n\
    \nMySQL 中包含表，每个表包含行和列。适用于大小型应用，速度快、可靠、易用，可在多种平台编译运行。\n\n---\n\n# 第 16 章：PHP 连接\
    \ MySQL\n\n可使用 `mysqli` 扩展连接 MySQL。\n\n**语法**：\n```php\n<?php\n$host = 'localhost';\n\
    $username = 'root';\n$password = '';\n\n// 创建新连接\n$conn = new mysqli($host, $username,\
    \ $password);\n\nif ($conn->connect_error) {\n    die('Connection Failed: ' .\
    \ $conn->connect_error);\n}\n\necho 'Connected Successfully';\n?>\n```\n\n**输出**：\n\
    ```text\nConnected Successfully\n```\n\n在上面的代码中，我们创建了 `mysqli` 类的实例。\n"
