  fmt: "\n# Chapter 17: Create Database and Tables\n\n## Creating a Database\n\nTo\
    \ create a database, you can write the following SQL command:\n\n```sql\nCREATE\
    \ DATABASE dbname;\n```\n\nYou can also create a database by navigating to **phpMyAdmin**.\
    \ phpMyAdmin is a free and open-source administration tool for MySQL and MariaDB.\
    \ As a portable web application written primarily in PHP, it has become one of\
    \ the most popular MySQL administration tools. Check the screenshot below:\n\n\
    ![Illustration 10: phpMyAdmin Interface](image_rsrcE4.jpg)\n\nMySQL is the relational\
    \ database used to store data.\n\n## Connect to MySQL Database from PHP Code\n\
    \nTo connect with the database from PHP code, we need to write code to establish\
    \ the connection.\n\n```php\n<?php\n$servername = \"hostname or ip address\";\n\
    $username = \"mysql username\";\n$password = \"mysql password\";\n\n/* Create\
    \ a connection with below code */\n$connection = mysqli_connect($servername, $username,\
    \ $password);\n\n/* Add code to check connection */\nif (!$connection) {\n   \
    \ die(\"Connection failed: \" . mysqli_connect_error());\n}\n\necho \"Connected\
    \ successfully\";\n?>\n```\n\nIf the connection is created, then the connection\
    \ will be successful; otherwise, it will print an error stating that the connection\
    \ is not created.\n\n## How to Create a Database\n\nYou can create a database\
    \ in two ways:\n\n1.  Go to phpMyAdmin and click on the **Databases** tab. On\
    \ clicking it, an option will appear where you can enter your desired database\
    \ name and click on the **Create** button.\n2.  Go to phpMyAdmin and click on\
    \ the **SQL** tab. Paste the query:\n    ```sql\n    CREATE DATABASE `database_name`;\n\
    \    ```\n    Then click on the **Go** button. The above query will be executed\
    \ and the database will be created.\n\n## Creating Tables\n\nNow we need to create\
    \ a table in our database. I have created a database named `myproject`. Now I\
    \ will be creating tables under this database. I am going to create a table `category`\
    \ under database `myproject`.\n\nWhen you have created a database, you can see\
    \ that it will appear on the left side of your phpMyAdmin interface. From here,\
    \ you will click on the database `myproject`. In this way, it gets selected. Now\
    \ you can see an option to **Create table**. Enter the name of the table in the\
    \ text box on the screen and the number of columns (i.e., the fields you want\
    \ for your table).\n\n![Table Creation Step 1](image_rsrcE5.jpg)\n\nNow I have\
    \ entered the name as `category` and `4` in column fields and clicked on the **Go**\
    \ button. Table `category` will be created and will ask you to enter the name\
    \ of the columns and the datatype you want for your column names in the table.\n\
    \n![Table Creation Step 2](image_rsrcE6.jpg)\n\nNow click on the **Go** button\
    \ and the table will be created.\n\nYou can also run the below query under the\
    \ SQL tab in phpMyAdmin and execute the query to create the table:\n\n```sql\n\
    CREATE TABLE `myproject`.`category` (\n  `id` INT NOT NULL AUTO_INCREMENT,\n \
    \ `name` VARCHAR(64) NOT NULL,\n  `status` CHAR(1) NOT NULL,\n  `sort_order` TINYINT(1)\
    \ NOT NULL,\n  PRIMARY KEY (`id`)\n) ENGINE = InnoDB;\n```\n\n# Chapter 18: Session\
    \ in PHP\n\n## What are Sessions?\n\nSessions are stored on the server in the\
    \ form of variables. They are generally used to store webpage visitor preferences\
    \ and identify them across multiple webpages. A session expires when we close\
    \ the webpage or log out of the application.\n\n## How to Create a Session in\
    \ PHP?\n\nWe use the `$_SESSION` superglobal variable to create a session. For\
    \ creating a session, we need to first start the session and then store the variable\
    \ in the session.\n\n```php\nsession_start();\n$_SESSION['username'] = 'your_username';\n\
    ```\n\n## How to Check if the Session is Set?\n\nTo check if the session variable\
    \ is set or not, you can use the `isset()` function with that session variable.\n\
    \n```php\nif (isset($_SESSION['username'])) {\n    /* your piece of code */\n\
    }\n```\n\n## How to End a Session?\n\nWhen we do not require the session, we can\
    \ unset the session variable and destroy it.\n\n```php\nsession_start();\nunset($_SESSION['username']);\n\
    session_destroy();\n```\n\n## Where Do We Use Sessions?\n\nSessions are used to\
    \ store the login details of any user so they can access other webpages and we\
    \ can track the user. When a user usually logs out, their session gets expired\
    \ and they leave the application.\n\n# Chapter 19: PHP Project - User Registration\n\
    \nNow we are going to create a small PHP project where we will be creating a database\
    \ and table. Then we will create a small project where a user will register, log\
    \ in, and navigate to a restricted page on the website.\n\n## Create Database\n\
    \nRun the below query to create the database:\n\n```sql\nCREATE DATABASE `user_registration`;\n\
    ```\n\nSelect the database and copy the below code. Execute the query after pasting\
    \ it under the SQL tab to create table `users`:\n\n```sql\nCREATE TABLE `user_registration`.`users`\
    \ (\n  `id` INT NOT NULL AUTO_INCREMENT,\n  `name` VARCHAR(255) NOT NULL,\n  `type`\
    \ ENUM('user','admin') NOT NULL,\n  `username` VARCHAR(64) NOT NULL,\n  `password`\
    \ VARCHAR(255) NOT NULL,\n  `status` CHAR(1) NOT NULL DEFAULT 'A',\n  PRIMARY\
    \ KEY (`id`)\n) ENGINE = InnoDB;\n```\n\n## Project Structure\n\nNow we create\
    \ a project folder named `user_registration`. Under this folder, we are going\
    \ to save PHP files, CSS, JS, and images. We will have the below file structure\
    \ for our project:\n\n![Project File Structure](image_rsrcE7.jpg)\n\nI have created\
    \ a folder named `ReadersCollection`. Inside that, I have created my project folder\
    \ named `user_registration`. This folder holds `index.php` which is the main registration\
    \ page. Other pages are the login page, restricted page, and a `process.php` page.\
    \ The `process.php` page is where we will be writing all our logic for the code.\
    \ I have created a `connection.php` page which holds code for connecting to the\
    \ database.\n\nScreenshot for the main registration page:\n\n![Main Registration\
    \ Page](image_rsrcE8.jpg)\n\nThis folder contains a `css` and `js` folder. The\
    \ `css` folder contains `bootstrap.css` file and the `js` folder holds `bootstrap.js`\
    \ file. I have not included them here. You can go to the Bootstrap website and\
    \ download the respective files and include them in your project.\n\n## Code for\
    \ `connection.php`\n\nThis page will be included at the top of every PHP page.\n\
    \n```php\n<?php\nsession_start();\n\n$servername = \"localhost\";\n$username =\
    \ \"root\";\n$password = \"\";\n$dbname = 'user_registration';\n\n/* Create a\
    \ connection with below code */\n$connection = mysqli_connect($servername, $username,\
    \ $password, $dbname);\n\n/* Add code to check connection */\nif (!$connection)\
    \ {\n    die(\"Connection failed: \" . mysqli_connect_error());\n}\n\n// echo\
    \ \"Connected successfully\";\n?>\n```\n\n## Registration Functionality\n\nThe\
    \ register form holds three inputs: name, username, and password. Username should\
    \ be unique and password should be stored in encrypted form. The code for the\
    \ register or index page can be found below:\n\n### Code for `index.php`\n\n```php\n\
    <!DOCTYPE html>\n<?php\ninclude \"connection.php\";\n?>\n<html>\n<head>\n    <title></title>\n\
    \    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n    <link rel=\"stylesheet\" href=\"css/bootstrap.css\"\
    >\n    <script src=\"js/bootstrap.js\"></script>\n</head>\n<body>\n    <div class=\"\
    container text-center\">\n        <nav class=\"navbar navbar-expand-lg navbar-light\
    \ bg-light\">\n            <ul class=\"navbar-nav mr-auto\">\n               \
    \ <?php\n                if (isset($_SESSION['username'])) {\n               \
    \ ?>\n                <li class=\"nav-item active\"><a href=\"restricted.php\"\
    >Restricted Page | </a></li>\n                <?php } ?>\n                <?php\
    \ if (!isset($_SESSION['username'])) { ?>\n                <li class=\"nav-item\
    \ active\"><a href=\"login.php\">Login |</a></li>\n                <?php } ?>\n\
    \                <?php if (isset($_SESSION['username'])) { ?>\n              \
    \  <li class=\"nav-item active\"><a href=\"process.php?action=logout\">Logout</a></li>\n\
    \                <?php } ?>\n            </ul>\n        </nav>\n\n        <?php\
    \ if (!isset($_SESSION['username'])) { ?>\n        <div class=\"row\">\n     \
    \       <div class=\"col-md-12\">\n                <div class=\"row\"><strong>Register\
    \ here</strong></div>\n            </div>\n        </div>\n\n        <form name=\"\
    frm\" method=\"post\" action=\"process.php?action=register\">\n            <div\
    \ class=\"row\">\n                <div class=\"col-md-12\">\n                \
    \    <div class=\"col-md-6\">Name:</div>\n                    <div class=\"col-md-6\"\
    ><input type=\"text\" name=\"name\" value=\"\"></div>\n                </div>\n\
    \                <div class=\"col-md-12\">\n                    <div class=\"\
    col-md-6\">UserName:</div>\n                    <div class=\"col-md-6\"><input\
    \ type=\"text\" name=\"username\" value=\"\"></div>\n                </div>\n\
    \            </div>\n        </form>\n        <?php } ?>\n    </div>\n</body>\n\
    </html>\n```\n"
  trans: "\n\n# 第 17 章：创建数据库和表\n\n## 创建数据库\n\n要创建数据库，可以编写以下 SQL 命令：\n\n```sql\nCREATE\
    \ DATABASE dbname;\n```\n\n你也可以通过访问 **phpMyAdmin** 来创建数据库。phpMyAdmin 是一个用于 MySQL\
    \ 和 MariaDB 的免费开源管理工具。作为一个主要用 PHP 编写的便携式 Web 应用程序，它已成为最流行的 MySQL 管理工具之一。请查看下面的截图：\n\
    \n![图示 10：phpMyAdmin 界面](img/image_rsrcE4.jpg)\n\nMySQL 是用于存储数据的关系型数据库。\n\n##\
    \ 从 PHP 代码连接 MySQL 数据库\n\n要从 PHP 代码连接数据库，我们需要编写代码来建立连接。\n\n```php\n<?php\n$servername\
    \ = \"hostname or ip address\";\n$username = \"mysql username\";\n$password =\
    \ \"mysql password\";\n\n/* 使用下面的代码创建连接 */\n$connection = mysqli_connect($servername,\
    \ $username, $password);\n\n/* 添加代码检查连接 */\nif (!$connection) {\n    die(\"Connection\
    \ failed: \" . mysqli_connect_error());\n}\n\necho \"Connected successfully\"\
    ;\n?>\n```\n\n如果连接创建成功，则连接将会成功；否则，它将打印一条错误，指出连接未创建。\n\n## 如何创建数据库\n\n你可以通过两种方式创建数据库：\n\
    \n1.  进入 phpMyAdmin 并点击 **Databases（数据库）** 选项卡。点击后，将出现一个选项，你可以在其中输入所需的数据库名称并点击\
    \ **Create（创建）** 按钮。\n2.  进入 phpMyAdmin 并点击 **SQL** 选项卡。粘贴查询：\n    ```sql\n  \
    \  CREATE DATABASE `database_name`;\n    ```\n    然后点击 **Go（执行）** 按钮。上述查询将被执行，数据库将被创建。\n\
    \n## 创建表\n\n现在我们需要在数据库中创建表。我已经创建了一个名为 `myproject` 的数据库。现在我将在这个数据库下创建表。我将在数据库 `myproject`\
    \ 下创建一个表 `category`。\n\n当你创建好数据库后，可以看到它会出现在 phpMyAdmin 界面的左侧。从这里，你将点击数据库 `myproject`。这样它就被选中了。现在你可以看到一个\
    \ **Create table（创建表）** 选项。在屏幕上的文本框中输入表名和列数（即你想要的表字段）。\n\n![表创建步骤 1](img/image_rsrcE5.jpg)\n\
    \n现在我输入名称为 `category`，列字段输入 `4`，然后点击 **Go（执行）** 按钮。表 `category` 将被创建，并会要求你输入列名以及表中列名所需的数据类型。\n\
    \n![表创建步骤 2](img/image_rsrcE6.jpg)\n\n现在点击 **Go（执行）** 按钮，表将被创建。\n\n你也可以在 phpMyAdmin\
    \ 的 SQL 选项卡下运行下面的查询并执行查询来创建表：\n\n```sql\nCREATE TABLE `myproject`.`category` (\n\
    \  `id` INT NOT NULL AUTO_INCREMENT,\n  `name` VARCHAR(64) NOT NULL,\n  `status`\
    \ CHAR(1) NOT NULL,\n  `sort_order` TINYINT(1) NOT NULL,\n  PRIMARY KEY (`id`)\n\
    ) ENGINE = InnoDB;\n```\n\n# 第 18 章：PHP 中的 Session\n\n## 什么是 Session？\n\nSession\
    \ 以变量的形式存储在服务器上。它们通常用于存储网页访问者的偏好设置，并在多个网页中识别他们。当我们关闭网页或退出应用程序时，Session 就会过期。\n\
    \n## 如何在 PHP 中创建 Session？\n\n我们使用 `$_SESSION` 超全局变量来创建 Session。要创建 Session，我们需要先启动\
    \ Session，然后将变量存储在 Session 中。\n\n```php\nsession_start();\n$_SESSION['username']\
    \ = 'your_username';\n```\n\n## 如何检查 Session 是否已设置？\n\n要检查 Session 变量是否已设置，可以对该\
    \ Session 变量使用 `isset()` 函数。\n\n```php\nif (isset($_SESSION['username'])) {\n\
    \    /* 你的代码片段 */\n}\n```\n\n## 如何结束 Session？\n\n当我们不再需要 Session 时，可以取消设置 Session\
    \ 变量并销毁它。\n\n```php\nsession_start();\nunset($_SESSION['username']);\nsession_destroy();\n\
    ```\n\n## 我们在哪里使用 Session？\n\nSession 用于存储任何用户的登录详细信息，以便他们可以访问其他网页，我们也可以跟踪用户。当用户通常注销时，他们的\
    \ Session 会过期并离开应用程序。\n\n# 第 19 章：PHP 项目 - 用户注册\n\n现在我们将创建一个小型 PHP 项目，我们将在其中创建数据库和表。然后我们将创建一个小型项目，用户将在其中注册、登录并导航到网站上的受限页面。\n\
    \n## 创建数据库\n\n运行下面的查询以创建数据库：\n\n```sql\nCREATE DATABASE `user_registration`;\n\
    ```\n\n选择数据库并复制下面的代码。在 SQL 选项卡下粘贴后执行查询以创建表 `users`：\n\n```sql\nCREATE TABLE `user_registration`.`users`\
    \ (\n  `id` INT NOT NULL AUTO_INCREMENT,\n  `name` VARCHAR(255) NOT NULL,\n  `type`\
    \ ENUM('user','admin') NOT NULL,\n  `username` VARCHAR(64) NOT NULL,\n  `password`\
    \ VARCHAR(255) NOT NULL,\n  `status` CHAR(1) NOT NULL DEFAULT 'A',\n  PRIMARY\
    \ KEY (`id`)\n) ENGINE = InnoDB;\n```\n\n## 项目结构\n\n现在我们创建一个名为 `user_registration`\
    \ 的项目文件夹。在这个文件夹下，我们将保存 PHP 文件、CSS、JS 和图片。我们的项目将具有以下文件结构：\n\n![项目文件结构](img/image_rsrcE7.jpg)\n\
    \n我创建了一个名为 `ReadersCollection` 的文件夹。在里面，我创建了我的项目文件夹 `user_registration`。该文件夹包含\
    \ `index.php`，这是主注册页面。其他页面包括登录页面、受限页面和一个 `process.php` 页面。`process.php` 页面是我们将编写所有代码逻辑的地方。我创建了一个\
    \ `connection.php` 页面，其中包含连接数据库的代码。\n\n主注册页面的截图：\n\n![主注册页面](img/image_rsrcE8.jpg)\n\
    \n此文件夹包含一个 `css` 文件夹和一个 `js` 文件夹。`css` 文件夹包含 `bootstrap.css` 文件，`js` 文件夹包含 `bootstrap.js`\
    \ 文件。我没有在此处包含它们。你可以去 Bootstrap 网站下载相应的文件并将它们包含在你的项目中。\n\n## `connection.php` 的代码\n\
    \n此页面将包含在每个 PHP 页面的顶部。\n\n```php\n<?php\nsession_start();\n\n$servername = \"\
    localhost\";\n$username = \"root\";\n$password = \"\";\n$dbname = 'user_registration';\n\
    \n/* 使用下面的代码创建连接 */\n$connection = mysqli_connect($servername, $username, $password,\
    \ $dbname);\n\n/* 添加代码检查连接 */\nif (!$connection) {\n    die(\"Connection failed:\
    \ \" . mysqli_connect_error());\n}\n\n// echo \"Connected successfully\";\n?>\n\
    ```\n\n## 注册功能\n\n注册表单包含三个输入框：姓名、用户名和密码。用户名应唯一，密码应以加密形式存储。注册或索引页面的代码如下：\n\n###\
    \ `index.php` 的代码\n\n```php\n<!DOCTYPE html>\n<?php\ninclude \"connection.php\"\
    ;\n?>\n<html>\n<head>\n    <title></title>\n    <meta charset=\"UTF-8\">\n   \
    \ <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
    \    <link rel=\"stylesheet\" href=\"css/bootstrap.css\">\n    <script src=\"\
    js/bootstrap.js\"></script>\n</head>\n<body>\n    <div class=\"container text-center\"\
    >\n        <nav class=\"navbar navbar-expand-lg navbar-light bg-light\">\n   \
    \         <ul class=\"navbar-nav mr-auto\">\n                <?php\n         \
    \       if (isset($_SESSION['username'])) {\n                ?>\n            \
    \    <li class=\"nav-item active\"><a href=\"restricted.php\">Restricted Page\
    \ | </a></li>\n                <?php } ?>\n                <?php if (!isset($_SESSION['username']))\
    \ { ?>\n                <li class=\"nav-item active\"><a href=\"login.php\">Login\
    \ |</a></li>\n                <?php } ?>\n                <?php if (isset($_SESSION['username']))\
    \ { ?>\n                <li class=\"nav-item active\"><a href=\"process.php?action=logout\"\
    >Logout</a></li>\n                <?php } ?>\n            </ul>\n        </nav>\n\
    \n        <?php if (!isset($_SESSION['username'])) { ?>\n        <div class=\"\
    row\">\n            <div class=\"col-md-12\">\n                <div class=\"row\"\
    ><strong>Register here</strong></div>\n            </div>\n        </div>\n\n\
    \        <form name=\"frm\" method=\"post\" action=\"process.php?action=register\"\
    >\n            <div class=\"row\">\n                <div class=\"col-md-12\">\n\
    \                    <div class=\"col-md-6\">Name:</div>\n                   \
    \ <div class=\"col-md-6\"><input type=\"text\" name=\"name\" value=\"\"></div>\n\
    \                </div>\n                <div class=\"col-md-12\">\n         \
    \           <div class=\"col-md-6\">UserName:</div>\n                    <div\
    \ class=\"col-md-6\"><input type=\"text\" name=\"username\" value=\"\"></div>\n\
    \                </div>\n            </div>\n        </form>\n        <?php }\
    \ ?>\n    </div>\n</body>\n</html>\n```\n\n"
