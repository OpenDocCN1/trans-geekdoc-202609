- raw: "\n\n![](image_rsrcDS.jpg)\n\nPractical Hand On Experience With Php & Mysql\
    \  \n\nHi Friends! This book is all about PHP and Mysql.It covers almost all the\
    \ core topics in PHP.Each and every topic is explained with practical examples\
    \ so that you can clearly understand the topic and you can practice the same on\
    \ your own.  \n\nThe last chapter in this book covers a small project with full\
    \ source code. It covers the main topics and give you an understanding of how\
    \ to build a dynamic website from scratch using PHP and Mysql. © 2021 by Dipti\
    \ Sahay All Rights Reserved http://readerscollection.in Content : 1.Introduction\
    \ to PHP  \n\n2.Type of applications that can be developed using Php. 3.How to\
    \ install PHP locally  \n\n4.Run your first program with Php  \n\n5.Variable and\
    \ Constants explained with examples  \n\n6.Php datatypes  \n\n7.Php operators.\
    \ 8.Php operators usage explained with examples  \n\n9.Php Strings and Arrays\
    \ with examples 10.If and Else block and it's use with practical example  \n\n\
    11.Different types of loops in PHP.  \n\n12.Php superglobals  \n\n13.Create Php\
    \ Forms  \n\n14.Php Form Validation:Server side Validation 15.Introduction to\
    \ Mysql  \n\n16.How to connect to your database from your application 17.How to\
    \ create database and tables  \n\n18.Session management in php 19.A practical\
    \ project where you will get to know how to create  \n\ni)Database and table creation\
    \ iii)A frontend where user can register and login and access the restricted page\
    \ in the website  \n\nCHAPTER 1: Introduction To Php:: Php is a server side scripting\
    \ language and is generally used to develop dynamic  webpages. It is an opensource\
    \ scripting language.It is free,widely used and easily available for  \n\ndownload.\
    \ It is the best ever tool for developing webapplications or dynamic websites.\
    \  \n\nPHP was originally created by Rasmus lerdorf in 1994.  \n\nPreviously PHP\
    \ stood for personal Home page but now PHP stands for PHP:Hypertext Preprocessor.\
    \ Php scipts are executed on server.It is compatible with all servers like Apache,IIS,etc.\
    \ A Php file contains HTML  \n\ncode,CSS code and Php  \n\nscript.The file is\
    \ saved with .php extension.It is executed on server and the response generated\
    \ is pure HTML which is displayed in the browser.  \n\nSo before we start learning\
    \ Php we must know what Php can do . Php can be used to create  \n\ndynamic page\
    \ content.  \n\nIt can be used to create forms and collect data from end users.\
    \ It can create session and can maintain session for any user while he is navigating\
    \ through multiple pages in any website. Php can be used to manipulate data in\
    \ database by performing crud operations like  \n\ncreate,read,update and delete\
    \ operations.  \n\nPhp can be used to create sessions and track user activity.\
    \ To learn or work with Php you should have basic knowledge on HTML,CSS and javascript.\
    \ HTML is hypertext markup language and CSS is cascading style sheet.HTML describes\
    \ structure of webpage.HTML contains number of elements. These elements hold text\
    \ and images for the webpage.It actually tells the browser how to display the\
    \ data for a webpage. CSS is used to give a styling to those elements i.e the\
    \ look and the feel of the webpage.  \n\nHTML and CSS topics are not covered here\
    \ however while using HTML tags and CSS code in this book I will briefly describe\
    \ what is the main purpose of using them. CHAPTER 2  \n\nTypes of Application\
    \ developed using Php:: Php can used to develop any dynamic webpage.Well what\
    \ do we mean by dynamic  website? Dynamic website means that the content of the\
    \ website is not static i.e html pages are not storing content for the website.Data\
    \ or content is coming from database and it is changing with user action.  \n\n\
    So now what type of applications and websites we can develop using php.  \n\n\
    We can develop informative websites,blogs,B2B applications, B2C applications,ecommerce\
    \ applications,forums,erp and many more. CHAPTER 3  \n\nHow to install Php locally::\
    \ Installing Php locally means installing it in your local PC.This is important\
    \ step while learning Php so that you can run and test your php code locally on\
    \ your PC. We are going to install xampp server (which contains  \n\nApache,Mysql\
    \ and Php).Apache is a webserver which is required to run php scripts.  \n\nFollow\
    \ the below steps to install xampp in your PC. Step 1:Go to  \n\nhttps://www.apachefriends.org/do\
    \ wnload.html  \n\nDownload the latest xampp for your windows. Step 2:Save and\
    \ Run the .exe file Step 3:A setup wizard dialog will get open on your screen\
    \ for you.Follow the instructions and install your xampp in desired folder.  \n\
    \nYour installation part is now done! CHAPTER 4  \n\nRun your first program with\
    \ Php:: If you have done the xampp installation in C folder.Then navigate to C\
    \ folder and manually start the server by clicking on xampp\\_start icon which\
    \ is  \n\nalready there inside xampp folder.See the screenshot below: ![](image_rsrcDT.jpg)To\
    \ write the php scripts we need an editor.A number of free editor tools like Notepad\
    \ editor ++, Sublime,Netbeans are available . You can use any of them.  \n\nI\
    \ will be using Netbeans for writing the php scripts.  \n\nNavigate manually to\
    \ C:\\\\xampp\\\\htdocs folder. This is a folder where you can store your project\
    \ folder and files within it. I am creating a folder here and naming it as Practicalphp.I\
    \ will be using this folder to store all the php scripts required for practical\
    \ examples and test them as we proceed gradually. Php code starts with open tag\
    \ and ends with close tags.Well what are open and close tags in php? <?php is\
    \ the open tag and ?> is the close tag.Php script goes between these two tags.You\
    \ can find the code below: <?php  \n\n//php code goes here ?> Below we are going\
    \ to print text on webpage with php.For this create a file in  \n\nC:\\\\xampp\\\
    \\htdocs\\\\PracticalPhp folder and save it as index.php. Paste the below code\
    \ to display “Hello ! I am here” on a page. <!DOCTYPE html>  \n\n<html lang=\"\
    en\">  \n\n<head> <meta charset=\"utf-8\">  \n\n<title>MyFirstExample</title>\
    \ </head>  \n\n<body>  \n\n<?php echo \"Hello ! I am here\" ;?>  \n\n</body> </html>\
    \ Now if you have already started your xampp server in your PC then open any browser\
    \ and type localhost/PracticalPhp/ and click enter.You will see “Hello ! I am\
    \ here “ on your screen.See the screenshot below: ![](image_rsrcDU.jpg)Illustration\
    \ 1: Example To Print Hello !I am here A normal php file contains some HTML code\
    \ and some Php scripting code and the file is saved with .php extension. The php\
    \ code is written within php open tag and php close tags.Each statement of Php\
    \ code ends with semicolon. Here in the above code “  \n\nMyFirstExample” text\
    \ is used as title within the HTML title tag which will get displayed on the top\
    \ of the page.In Php there is a built-in function “echo” which can be used to\
    \ output the text “Hello ! I am here”on a web page. CHAPTER 5  \n\nVariable declaration\
    \ and it's usage with examples:: A variable is a container which store values\
    \ in it.It can store a string of text,numbers etc.We donot have to declare the\
    \  \n\ndatatype(ie String,Integer) of the variable.  \n\nIt automatically converts\
    \ the variable to it's correct data type depending on it's value. The assignment\
    \ operator is used to assign value to a variable.Once a variable is declared it\
    \ can be used throughout the code. Php variables follow some naming conventions\
    \ i.e follow some rules for defining a  \n\nvariable.A php variable starts with\
    \ dollar sign $ ,followed with a name.A variable name cannot start with number.It\
    \ can have alphanumeric characters and as well as underscore.A varaiable name\
    \ cannot have spaces.They are case sensitive. Find below examples to define a\
    \ variable: $var=”This is a string variable”; Since the above $var variable stores\
    \ text.It is a variable with datatype as String . $var=10;  \n\nSince the above\
    \ $var variable stores number.It is a variable with Integer data type. $var=array(“a”,”b”,”c”);\
    \ Since the $var stores array data so it is an array variable. $var=2.5;  "
  fmt: "\n![](image_rsrcDS.jpg)\n\n# Practical Hand On Experience With Php & Mysql\n\
    \nHi Friends! This book is all about PHP and Mysql. It covers almost all the core\
    \ topics in PHP. Each and every topic is explained with practical examples so\
    \ that you can clearly understand the topic and you can practice the same on your\
    \ own.\n\nThe last chapter in this book covers a small project with full source\
    \ code. It covers the main topics and gives you an understanding of how to build\
    \ a dynamic website from scratch using PHP and Mysql. © 2021 by Dipti Sahay All\
    \ Rights Reserved http://readerscollection.in\n\n## Content\n\n1. Introduction\
    \ to PHP\n2. Type of applications that can be developed using Php\n3. How to install\
    \ PHP locally\n4. Run your first program with Php\n5. Variable and Constants explained\
    \ with examples\n6. Php datatypes\n7. Php operators\n8. Php operators usage explained\
    \ with examples\n9. Php Strings and Arrays with examples\n10. If and Else block\
    \ and it's use with practical example\n11. Different types of loops in PHP\n12.\
    \ Php superglobals\n13. Create Php Forms\n14. Php Form Validation: Server side\
    \ Validation\n15. Introduction to Mysql\n16. How to connect to your database from\
    \ your application\n17. How to create database and tables\n18. Session management\
    \ in php\n19. A practical project where you will get to know how to create\n \
    \   i) Database and table creation\n    iii) A frontend where user can register\
    \ and login and access the restricted page in the website\n\n# CHAPTER 1: Introduction\
    \ To Php\n\nPHP is a server side scripting language and is generally used to develop\
    \ dynamic webpages. It is an opensource scripting language. It is free, widely\
    \ used and easily available for download. It is the best ever tool for developing\
    \ webapplications or dynamic websites.\n\nPHP was originally created by Rasmus\
    \ Lerdorf in 1994.\n\nPreviously PHP stood for Personal Home Page but now PHP\
    \ stands for PHP: Hypertext Preprocessor. PHP scripts are executed on server.\
    \ It is compatible with all servers like Apache, IIS, etc. A PHP file contains\
    \ HTML code, CSS code and PHP script. The file is saved with `.php` extension.\
    \ It is executed on server and the response generated is pure HTML which is displayed\
    \ in the browser.\n\nSo before we start learning PHP we must know what PHP can\
    \ do. PHP can be used to create dynamic page content.\n\nIt can be used to create\
    \ forms and collect data from end users. It can create session and can maintain\
    \ session for any user while he is navigating through multiple pages in any website.\
    \ PHP can be used to manipulate data in database by performing CRUD operations\
    \ like create, read, update and delete operations.\n\nPHP can be used to create\
    \ sessions and track user activity. To learn or work with PHP you should have\
    \ basic knowledge on HTML, CSS and javascript. HTML is hypertext markup language\
    \ and CSS is cascading style sheet. HTML describes structure of webpage. HTML\
    \ contains number of elements. These elements hold text and images for the webpage.\
    \ It actually tells the browser how to display the data for a webpage. CSS is\
    \ used to give a styling to those elements i.e. the look and the feel of the webpage.\n\
    \nHTML and CSS topics are not covered here however while using HTML tags and CSS\
    \ code in this book I will briefly describe what is the main purpose of using\
    \ them.\n\n# CHAPTER 2: Types of Application developed using Php\n\nPHP can be\
    \ used to develop any dynamic webpage. Well what do we mean by dynamic website?\
    \ Dynamic website means that the content of the website is not static i.e. HTML\
    \ pages are not storing content for the website. Data or content is coming from\
    \ database and it is changing with user action.\n\nSo now what type of applications\
    \ and websites we can develop using PHP.\n\nWe can develop informative websites,\
    \ blogs, B2B applications, B2C applications, ecommerce applications, forums, ERP\
    \ and many more.\n\n# CHAPTER 3: How to install Php locally\n\nInstalling PHP\
    \ locally means installing it in your local PC. This is important step while learning\
    \ PHP so that you can run and test your PHP code locally on your PC. We are going\
    \ to install XAMPP server (which contains Apache, Mysql and PHP). Apache is a\
    \ webserver which is required to run PHP scripts.\n\nFollow the below steps to\
    \ install XAMPP in your PC.\n\n**Step 1:** Go to `https://www.apachefriends.org/download.html`.\
    \ Download the latest XAMPP for your windows.\n\n**Step 2:** Save and Run the\
    \ `.exe` file.\n\n**Step 3:** A setup wizard dialog will get open on your screen\
    \ for you. Follow the instructions and install your XAMPP in desired folder.\n\
    \nYour installation part is now done!\n\n# CHAPTER 4: Run your first program with\
    \ Php\n\nIf you have done the XAMPP installation in C folder. Then navigate to\
    \ C folder and manually start the server by clicking on `xampp_start` icon which\
    \ is already there inside XAMPP folder. See the screenshot below:\n\n![](image_rsrcDT.jpg)\n\
    \nTo write the PHP scripts we need an editor. A number of free editor tools like\
    \ Notepad++, Sublime, Netbeans are available. You can use any of them. I will\
    \ be using Netbeans for writing the PHP scripts.\n\nNavigate manually to `C:\\\
    xampp\\htdocs` folder. This is a folder where you can store your project folder\
    \ and files within it. I am creating a folder here and naming it as `Practicalphp`.\
    \ I will be using this folder to store all the PHP scripts required for practical\
    \ examples and test them as we proceed gradually.\n\nPHP code starts with open\
    \ tag and ends with close tags. Well what are open and close tags in PHP? `<?php`\
    \ is the open tag and `?>` is the close tag. PHP script goes between these two\
    \ tags. You can find the code below:\n\n```php\n<?php\n//php code goes here\n\
    ?>\n```\n\nBelow we are going to print text on webpage with PHP. For this create\
    \ a file in `C:\\xampp\\htdocs\\PracticalPhp` folder and save it as `index.php`.\
    \ Paste the below code to display “Hello ! I am here” on a page.\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n  \
    \  <title>MyFirstExample</title>\n</head>\n<body>\n    <?php echo \"Hello ! I\
    \ am here\" ;?>\n</body>\n</html>\n```\n\nNow if you have already started your\
    \ XAMPP server in your PC then open any browser and type `localhost/PracticalPhp/`\
    \ and click enter. You will see “Hello ! I am here “ on your screen. See the screenshot\
    \ below:\n\n![](image_rsrcDU.jpg)\n\n**Illustration 1: Example To Print Hello\
    \ !I am here**\n\nA normal PHP file contains some HTML code and some PHP scripting\
    \ code and the file is saved with `.php` extension. The PHP code is written within\
    \ PHP open tag and PHP close tags. Each statement of PHP code ends with semicolon.\
    \ Here in the above code “MyFirstExample” text is used as title within the HTML\
    \ `<title>` tag which will get displayed on the top of the page. In PHP there\
    \ is a built-in function `echo()` which can be used to output the text “Hello\
    \ ! I am here” on a web page.\n\n# CHAPTER 5: Variable declaration and it's usage\
    \ with examples\n\nA variable is a container which stores values in it. It can\
    \ store a string of text, numbers etc. We do not have to declare the datatype\
    \ (i.e. String, Integer) of the variable.\n\nIt automatically converts the variable\
    \ to its correct data type depending on its value. The assignment operator is\
    \ used to assign value to a variable. Once a variable is declared it can be used\
    \ throughout the code. PHP variables follow some naming conventions i.e. follow\
    \ some rules for defining a variable. A PHP variable starts with dollar sign `$`,\
    \ followed with a name. A variable name cannot start with number. It can have\
    \ alphanumeric characters and as well as underscore. A variable name cannot have\
    \ spaces. They are case sensitive.\n\nFind below examples to define a variable:\n\
    \n```php\n$var = \"This is a string variable\";\n```\nSince the above `$var` variable\
    \ stores text. It is a variable with datatype as String.\n\n```php\n$var = 10;\n\
    ```\nSince the above `$var` variable stores number. It is a variable with Integer\
    \ data type.\n\n```php\n$var = array(\"a\", \"b\", \"c\");\n```\nSince the `$var`\
    \ stores array data so it is an array variable.\n\n```php\n$var = 2.5;\n```\n"
  trans: "\n\n![](img/image_rsrcDS.jpg)\n\n# PHP 与 MySQL 实战经验\n\n嗨，朋友们！本书主要讲解 PHP\
    \ 和 MySQL。它涵盖了 PHP 中几乎所有的核心主题。每个主题都配有实战示例进行解释，以便您能清晰地理解主题，并能自行进行练习。\n\n本书最后一章包含一个带有完整源代码的小型项目。它涵盖了主要主题，让您了解如何从零开始使用\
    \ PHP 和 MySQL 构建动态网站。© 2021 Dipti Sahay 版权所有 http://readerscollection.in\n\n##\
    \ 目录\n\n1. PHP 简介\n2. 使用 PHP 可开发的应用程序类型\n3. 如何在本地安装 PHP\n4. 运行您的第一个 PHP 程序\n5.\
    \ 变量与常量详解及示例\n6. PHP 数据类型\n7. PHP 运算符\n8. PHP 运算符用法详解及示例\n9. PHP 字符串与数组及示例\n10.\
    \ If 和 Else 语句块及其用法实战示例\n11. PHP 中的不同循环类型\n12. PHP 超全局变量\n13. 创建 PHP 表单\n14. PHP\
    \ 表单验证：服务端验证\n15. MySQL 简介\n16. 如何从应用程序连接到数据库\n17. 如何创建数据库和表\n18. PHP 中的会话管理\n\
    19. 一个实战项目，您将了解如何创建\n    i) 数据库和表的创建\n    iii) 一个前端，用户可在其中注册、登录并访问网站中的受限页面\n\n\
    # 第 1 章：PHP 简介\n\nPHP 是一种服务端脚本语言，通常用于开发动态网页。它是一种开源脚本语言。它免费、广泛使用且易于下载。它是开发 Web\
    \ 应用程序或动态网站的最佳工具。\n\nPHP 最初由 Rasmus Lerdorf 于 1994 年创建。\n\n早期 PHP 代表 Personal\
    \ Home Page（个人主页），但现在 PHP 代表 PHP: Hypertext Preprocessor（超文本预处理器）。PHP 脚本在服务器上执行。它兼容所有服务器，如\
    \ Apache、IIS 等。一个 PHP 文件包含 HTML 代码、CSS 代码和 PHP 脚本。文件以 `.php` 扩展名保存。它在服务器上执行，生成的响应是纯\
    \ HTML，并显示在浏览器中。\n\n因此，在开始学习 PHP 之前，我们必须了解 PHP 能做什么。PHP 可用于创建动态页面内容。\n\n它可用于创建表单并收集最终用户的数据。它可以创建会话，并在用户浏览网站中的多个页面时维护该用户的会话。PHP\
    \ 可用于通过执行 CRUD 操作（如创建、读取、更新和删除操作）来操作数据库中的数据。\n\nPHP 可用于创建会话和跟踪用户活动。要学习或使用 PHP，您应该具备\
    \ HTML、CSS 和 JavaScript 的基础知识。HTML 是超文本标记语言，CSS 是层叠样式表。HTML 描述网页的结构。HTML 包含许多元素。这些元素存放网页的文本和图像。它实际上告诉浏览器如何显示网页的数据。CSS\
    \ 用于为这些元素赋予样式，即网页的外观和风格。\n\nHTML 和 CSS 主题未在本书中涵盖，但当在本书中使用 HTML 标签和 CSS 代码时，我将简要描述使用它们的主要目的。\n\
    \n# 第 2 章：使用 PHP 开发的应用程序类型\n\nPHP 可用于开发任何动态网页。那么什么是动态网站呢？动态网站意味着网站内容不是静态的，即 HTML\
    \ 页面不存储网站内容。数据或内容来自数据库，并随用户操作而变化。\n\n那么我们可以使用 PHP 开发哪些类型的应用程序和网站呢？\n\n我们可以开发资讯类网站、博客、B2B\
    \ 应用、B2C 应用、电子商务应用、论坛、ERP 系统等等。\n\n# 第 3 章：如何在本地安装 PHP\n\n在本地安装 PHP 意味着将其安装在您的本地电脑上。这是学习\
    \ PHP 的重要一步，以便您可以在本地电脑上运行和测试 PHP 代码。我们将安装 XAMPP 服务器（包含 Apache、MySQL 和 PHP）。Apache\
    \ 是运行 PHP 脚本所需的 Web 服务器。\n\n请按照以下步骤在您的电脑上安装 XAMPP。\n\n**步骤 1：** 访问 `https://www.apachefriends.org/download.html`。下载适用于您\
    \ Windows 系统的最新版 XAMPP。\n\n**步骤 2：** 保存并运行 `.exe` 文件。\n\n**步骤 3：** 您的屏幕上将打开一个安装向导对话框。按照说明在所需文件夹中安装\
    \ XAMPP。\n\n安装部分现在完成了！\n\n# 第 4 章：运行您的第一个 PHP 程序\n\n如果您已在 C 盘完成 XAMPP 安装。然后导航到\
    \ C 盘，通过点击 XAMPP 文件夹内已有的 `xampp_start` 图标手动启动服务器。请看下面的截图：\n\n![](img/image_rsrcDT.jpg)\n\
    \n编写 PHP 脚本需要一个编辑器。有许多免费的编辑器工具可用，如 Notepad++、Sublime、Netbeans。您可以使用其中任何一个。我将使用\
    \ Netbeans 编写 PHP 脚本。\n\n手动导航到 `C:\\xampp\\htdocs` 文件夹。这是一个您可以存放项目文件夹及其中文件的文件夹。我在这里创建一个文件夹并将其命名为\
    \ `Practicalphp`。我将使用此文件夹存放所有用于实战示例的 PHP 脚本，并随着我们逐步推进进行测试。\n\nPHP 代码以开始标签开头，以结束标签结尾。那么\
    \ PHP 中的开始和结束标签是什么？`<?php` 是开始标签，`?>` 是结束标签。PHP 脚本位于这两个标签之间。您可以在下面找到代码：\n\n```php\n\
    <?php\n//php code goes here\n?>\n```\n\n下面我们将使用 PHP 在网页上打印文本。为此，在 `C:\\xampp\\\
    htdocs\\PracticalPhp` 文件夹中创建一个文件并将其保存为 `index.php`。粘贴下面的代码以在页面上显示 “Hello ! I am\
    \ here”。\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"\
    utf-8\">\n    <title>MyFirstExample</title>\n</head>\n<body>\n    <?php echo \"\
    Hello ! I am here\" ;?>\n</body>\n</html>\n```\n\n现在，如果您已经在电脑上启动了 XAMPP 服务器，请打开任意浏览器并输入\
    \ `localhost/PracticalPhp/` 然后按回车。您将在屏幕上看到 “Hello ! I am here”。请看下面的截图：\n\n![](img/image_rsrcDU.jpg)\n\
    \n**图示 1：打印 Hello !I am here 的示例**\n\n一个普通的 PHP 文件包含一些 HTML 代码和一些 PHP 脚本代码，文件以\
    \ `.php` 扩展名保存。PHP 代码写在 PHP 开始标签和 PHP 结束标签之间。每条 PHP 代码语句以分号结尾。在上面的代码中，“MyFirstExample”\
    \ 文本被用作 HTML `<title>` 标签内的标题，将显示在页面顶部。在 PHP 中有一个内置函数 `echo()`，可用于在网页上输出文本 “Hello\
    \ ! I am here”。\n\n# 第 5 章：变量声明及其用法示例\n\n变量是一个存储值的容器。它可以存储文本字符串、数字等。我们不必声明变量的数据类型（即\
    \ String、Integer）。\n\n它会根据其值自动将变量转换为其正确的数据类型。赋值运算符用于给变量赋值。一旦声明了变量，就可以在整个代码中使用它。PHP\
    \ 变量遵循一些命名约定，即定义变量时遵循一些规则。PHP 变量以美元符号 `$` 开头，后跟名称。变量名不能以数字开头。它可以包含字母数字字符和下划线。变量名不能包含空格。它们区分大小写。\n\
    \n请看下面定义变量的示例：\n\n```php\n$var = \"This is a string variable\";\n```\n由于上述 `$var`\
    \ 变量存储文本。它是一个数据类型为 String 的变量。\n\n```php\n$var = 10;\n```\n由于上述 `$var` 变量存储数字。它是一个数据类型为\
    \ Integer 的变量。\n\n```php\n$var = array(\"a\", \"b\", \"c\");\n```\n由于 `$var` 存储数组数据，所以它是一个数组变量。\n\
    \n```php\n$var = 2.5;\n```\n\n"
