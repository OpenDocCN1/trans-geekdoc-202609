  fmt: "\n# PHP Variables and Constants\n\nSince the `$var` variable stores a floating\
    \ point number so it's a float variable.\n\n## PHP Constants\n\nAn identifier\
    \ which holds a value and that value remain the same throughout the script. The\
    \ value cannot be changed throughout the script. It starts with a letter or underscore.\
    \ It is global throughout the script.\n\nTo create a constant in your script you\
    \ can use `define()` function.\n\n```php\n<?php\ndefine(\"STORE\", \"Estore Diversity\"\
    );\necho STORE;\n?>\n```\n\nIn the above example I have define a constant named\
    \ `STORE`. It holds the value `Estore Diversity`.\n\nNow whenever I will use and\
    \ print the `STORE` constant in my script it will display the value as `Estore\
    \ Diversity`.\n\nSo the main purpose to define constant is that when we want to\
    \ define some identifiers that will hold some value that are not going to change\
    \ throughout the code and are available globally to the script.\n\n# CHAPTER 6:\
    \ PHP Datatypes\n\nDatatype tells the type of data. A value which is stored in\
    \ a variable can be of any datatype. There are number of datatypes:\n\n- String\n\
    - Integer\n- Boolean\n- Array\n- Object\n- NULL\n- Float\n\nAny sequence of characters\
    \ included between single or double quote is a String. For example:\n\n```php\n\
    <?php\n$var = \"Hello World\";\necho $var;\n?>\n```\n\nThe above `$var` is a string\
    \ variable as it holds sequence of characters between double quotes.\n\nA variable\
    \ holding digits which is a non-decimal number is an Integer. Integer can be positive\
    \ or negative but it should be whole numbers.\n\nFor example:\n\n```php\n<?php\n\
    $a = 10;\necho $a;\n?>\n```\n\nIn the above example variable `$a` holds a number\
    \ 10 which donot have any decimal point and thus it is an Integer.\n\nA variable\
    \ which holds boolean value ie true or false is a boolean variable. Boolean values\
    \ are used in conditional blocks. For example if some variable value is equal\
    \ to true or false then the following condition will be executed. If and Else\
    \ condtion have been explained in next section.\n\nA floating point number is\
    \ a number which has decimal point. For example:\n\n```php\n<?php\n$b = 2.45;\n\
    ?>\n```\n\nArrays are the datatype which stores multiple values of same type in\
    \ one variable. We can define array by using `array()` function. This has been\
    \ explained in detail in Array section.\n\nObjects are the datatype which stores\
    \ data and also the information on how to process the data. An object must be\
    \ explicitly declared. First we define a class with `Class` keyword. It holds\
    \ some properties and methods. Then we create an instance ie the object of the\
    \ class to use the methods and properties.\n\n```php\n<?php\nclass A {\n    public\
    \ $var = \"hello\";\n    public function demo() {\n        echo $this->var;\n\
    \    }\n}\n$object = new A();\necho $object->demo();\n?>\n```\n\nHere we have\
    \ declared a class `A`. It holds `$var` property and a method `demo()`. Property\
    \ is the variable and method is the function in the class.\n\n![](image_rsrcDV.jpg)\n\
    Illustration 2: Class Datatype\n\n`demo()` method is accessing the variable `$var`\
    \ and value \"hello\" will get printed. `$object` is the object created for class\
    \ `A`. Check the output of the code below:\n\nNULL is a special data type which\
    \ holds no value. It has only NULL as value. A variable can be set with NULL value.\n\
    \n```php\n<?php\n$x = NULL;\nvar_dump($x);\n?>\n```\n\n![](image_rsrcDW.jpg)\n\
    Illustration 3: NULL Datatype\n\n# CHAPTER 7: PHP Operators\n\nOperators are used\
    \ to perform different operations on variable and values. Suppose we want two\
    \ variables and we want to know the summation of that. Then we will perform and\
    \ addition of that two variables using Arithmetic Operators.\n\nWe can divide\
    \ the operations into different groups:\n\n- Arithmetic Operators\n- Assignment\
    \ operators\n- Comparison Operators\n- Increment/Decrement Operators\n- Logical\
    \ Operators\n- String Operators\n- Array operators\n- Conditional assignment operators\n\
    \n## Arithmetic Operators\n\n### Addition\n\n`+` is the addition operator. This\
    \ is used when we want sum of two variables. For example:\n\n```php\n<?php\n$x\
    \ = 10;\n$y = 20;\necho $x + $y;\n?>\n```\n\n![](image_rsrcDX.jpg)\nIllustration\
    \ 4: Addition Operator\n\n### Subtraction\n\n`-` is the subtraction operator.\
    \ This is used when we want to subtract one variable from other variable.\n\n\
    ```php\n<?php\n$x = 50;\n$y = 25;\necho $x - $y;\n?>\n```\n\nHere by using subtraction\
    \ operator `$y` variable is deducted from `$x` variable. Check the output below:\n\
    \n![](image_rsrcDY.jpg)\nIllustration 5: Subtraction Operator\n\n### Multiplication\n\
    \n`*` is the multiplication operator. This is used when we want a product of two\
    \ variables.\n\n```php\n<?php\n$x = 10;\n$y = 20;\necho $x * $y;\n?>\n```\n\n\
    Here in above example we have two variable `$x` and `$y`. We are mutiplying it\
    \ to get the product of two variables. Check the output below:\n\n![](image_rsrcDZ.jpg)\n\
    Illustration 6: Mutiplication operator\n\n### Division\n\n`/` is the divison operator\
    \ which is used when we want to divide one variable by another variable. For example:\n\
    \n```php\n<?php\n$x = 100;\n$y = 10;\necho $x / $y;\n?>\n```\n\nHere we have one\
    \ variable `$x` which is getting divided by `$y` and return a value. Check the\
    \ output below:\n\n![](image_rsrcE0.jpg)\n\n### Modulus\n\n`%` is the modulus\
    \ operator which returns the remainder when one variable is divided by another\
    \ variable. For example:\n\n```php\n<?php\n$x = 100;\n$y = 40;\necho $x % $y;\n\
    ?>\n```\n\nIn the above example we have taken a variable `$x` and it is getting\
    \ divided by `$y`. The result will be the remainder we are getting by dividing\
    \ the two variables. Check out the output below:\n\n![](image_rsrcE1.jpg)\nIllustration\
    \ 7: Modulus Operator\n\n### Exponentiation\n\n`**` is the exponentiation operator.\
    \ It is used when we want to print any variable with some power. For example:\n\
    \n```php\n<?php\n$x = 2;\n$y = 3;\necho $x ** $y;\n?>\n```\n\nIn the above example\
    \ we are finding 2 to power of 3. Check the outut below:\n\n![](image_rsrcE2.jpg)\n\
    Illustration 8: Exponentiation Operator\n\n## Assignment Operators\n\nWith assignment\
    \ operators we can set values in a variable. Basic assignment operator in PHP\
    \ is `=`.\n\nFor example:\n\n- `$x += $y;` is same `$x = $x + $y;`\n- `$x -= $y;`\
    \ is same as `$x = $x - $y;`\n- `$x *= $y;` is same as `$x = $x * $y;`\n- `$x\
    \ /= $y;` is same as `$x = $x / $y;`\n- `$x %= $y` is same as `$x = $x % $y;`\n\
    \n## Comparison operators\n\n- `==` is Equal operator. For example `$x == $y`\
    \ Here this will return true if `$x` value is equal to `$y` value.\n- `===` is\
    \ the identical operator. For example: `$x === $y` returns true if and only if\
    \ the values and type of both variables re same.\n- `!=` is the not equal to operator.\
    \ For example: `$x != $y` returns true if value of both variables are different.\n\
    - `<>` is the not equal to operator. For example: `$x != $y` returns true if value\
    \ of both variables are different.\n- `!==` Not identical operator. For example\
    \ `$x !== $y` returns true if either the value is not same or the type is not\
    \ same.\n- `>` is the Greater operator. For example: `$x > $y` is true when `$x`\
    \ value is greater than `$y`.\n- `<` is the Less than operator. For example: `$x\
    \ < $y` is true when `$x` value is less than `$y`.\n- `>=` is Greater than or\
    \ equal to operator. For example: `$x >= $y` is true when `$x` value is greater\
    \ than or equal to `$y`.\n- `<=` is Less than or equal to operator. For example:\
    \ `$x <= $y` is true when `$x` value is less than or equal to `$y`.\n- `<=>` is\
    \ the spaceship operator. For example: `$x <=> $y` returns an integer less than,\
    \ equal to or greater than zero if value of `$x` is less than, equal to or greater\
    \ than `$y`.\n\n## Increment and Decrement operators\n\n- `$x++` will return `$x`\
    \ and then increment it's value by one.\n- `++$x` will increment value of `$x`\
    \ by one and then return `$x`.\n- `$x--` will return `$x` and then decrease it's\
    \ value by one.\n- `--$x` will decrement the value by one and then return `$x`.\n\
    \n## Logical operators\n\n- **And operator**: `$x and $y` gives a result true\
    \ if both `$x` and `$y` are true.\n- **`&&` operator**: `$x && $y` gives a result\
    \ true if both `$x` and `$y` are true.\n- **OR operator**: `$x or $y` gives a\
    \ result true if either `$x` and `$y` are true.\n- **`||` operator**: `$x || $y`\
    \ gives a result true if either `$x` and `$y` are true.\n- **`!` Not operator**:\
    \ `!$x` gives a result true if `$x` is not true.\n\n# CHAPTER 8\n"
  trans: "\n\n# PHP 变量与常量\n\n由于 `$var` 变量存储的是一个浮点数，因此它是一个浮点型变量。\n\n## PHP 常量\n\n标识符，它保存一个值，且该值在整个脚本执行期间保持不变。该值不能在脚本中被更改。它以字母或下划线开头。它在整个脚本中是全局的。\n\
    \n要在脚本中创建常量，可以使用 `define()` 函数。\n\n```php\n<?php\ndefine(\"STORE\", \"Estore Diversity\"\
    );\necho STORE;\n?>\n```\n\n在上述示例中，我定义了一个名为 `STORE` 的常量。它保存的值为 `Estore Diversity`。\n\
    \n现在，每当我在脚本中使用并打印 `STORE` 常量时，它都将显示值 `Estore Diversity`。\n\n因此，定义常量的主要目的是：当我们想要定义一些标识符，它们将保存一些在整个代码中不会改变且在脚本中全局可用的值时。\n\
    \n# 第 6 章：PHP 数据类型\n\n数据类型说明了数据的类型。存储在变量中的值可以是任意数据类型。有多种数据类型：\n\n- 字符串\n- 整型\n\
    - 布尔型\n- 数组\n- 对象\n- NULL\n- 浮点型\n\n包含在单引号或双引号之间的任何字符序列都是字符串。例如：\n\n```php\n<?php\n\
    $var = \"Hello World\";\necho $var;\n?>\n```\n\n上述 `$var` 是一个字符串变量，因为它保存的是包含在双引号之间的字符序列。\n\
    \n保存数字（非十进制数）的变量是整型。整型可以是正数或负数，但必须是整数。\n\n例如：\n\n```php\n<?php\n$a = 10;\necho\
    \ $a;\n?>\n```\n\n在上述示例中，变量 `$a` 保存数字 10，它没有任何小数点，因此它是一个整型。\n\n保存布尔值（即 true 或\
    \ false）的变量是布尔型变量。布尔值用于条件块中。例如，如果某个变量的值等于 true 或 false，则将执行以下条件。If 和 Else 条件将在下一节中解释。\n\
    \n浮点数是带有小数点的数字。例如：\n\n```php\n<?php\n$b = 2.45;\n?>\n```\n\n数组是一种数据类型，它在一个变量中存储多个相同类型的值。我们可以使用\
    \ `array()` 函数来定义数组。这在数组章节中有详细解释。\n\n对象是一种数据类型，它存储数据，还存储如何处理这些数据的信息。对象必须显式声明。首先，我们使用\
    \ `Class` 关键字定义一个类。它包含一些属性和方法。然后我们创建一个实例，即类的对象，以使用这些方法和属性。\n\n```php\n<?php\n\
    class A {\n    public $var = \"hello\";\n    public function demo() {\n      \
    \  echo $this->var;\n    }\n}\n$object = new A();\necho $object->demo();\n?>\n\
    ```\n\n这里我们声明了一个类 `A`。它包含 `$var` 属性和一个 `demo()` 方法。属性是类中的变量，方法是类中的函数。\n\n![](img/image_rsrcDV.jpg)\n\
    图 2：类数据类型\n\n`demo()` 方法访问变量 `$var`，将打印值 \"hello\"。`$object` 是为类 `A` 创建的对象。请查看下面代码的输出：\n\
    \nNULL 是一种特殊的数据类型，它不保存任何值。它的值只能是 NULL。变量可以被设置为 NULL 值。\n\n```php\n<?php\n$x =\
    \ NULL;\nvar_dump($x);\n?>\n```\n\n![](img/image_rsrcDW.jpg)\n图 3：NULL 数据类型\n\n\
    # 第 7 章：PHP 运算符\n\n运算符用于对变量和值执行不同的操作。假设我们有两个变量，想要知道它们的总和。那么我们将使用算术运算符对这两个变量执行加法运算。\n\
    \n我们可以将操作分为不同的组：\n\n- 算术运算符\n- 赋值运算符\n- 比较运算符\n- 自增/自减运算符\n- 逻辑运算符\n- 字符串运算符\n\
    - 数组运算符\n- 条件赋值运算符\n\n## 算术运算符\n\n### 加法\n\n`+` 是加法运算符。当我们需要两个变量的和时使用它。例如：\n\n\
    ```php\n<?php\n$x = 10;\n$y = 20;\necho $x + $y;\n?>\n```\n\n![](img/image_rsrcDX.jpg)\n\
    图 4：加法运算符\n\n### 减法\n\n`-` 是减法运算符。当我们想要从一个变量中减去另一个变量时使用它。\n\n```php\n<?php\n$x\
    \ = 50;\n$y = 25;\necho $x - $y;\n?>\n```\n\n这里通过使用减法运算符，从 `$x` 变量中减去了 `$y` 变量。请查看下面的输出：\n\
    \n![](img/image_rsrcDY.jpg)\n图 5：减法运算符\n\n### 乘法\n\n`*` 是乘法运算符。当我们想要两个变量的乘积时使用它。\n\
    \n```php\n<?php\n$x = 10;\n$y = 20;\necho $x * $y;\n?>\n```\n\n在上面的示例中，我们有两个变量\
    \ `$x` 和 `$y`。我们将它们相乘以获得两个变量的乘积。请查看下面的输出：\n\n![](img/image_rsrcDZ.jpg)\n图 6：乘法运算符\n\
    \n### 除法\n\n`/` 是除法运算符，当我们想要用一个变量除以另一个变量时使用它。例如：\n\n```php\n<?php\n$x = 100;\n\
    $y = 10;\necho $x / $y;\n?>\n```\n\n这里我们有一个变量 `$x`，它被 `$y` 除并返回一个值。请查看下面的输出：\n\
    \n![](img/image_rsrcE0.jpg)\n\n### 取模\n\n`%` 是取模运算符，它返回一个变量除以另一个变量的余数。例如：\n\n\
    ```php\n<?php\n$x = 100;\n$y = 40;\necho $x % $y;\n?>\n```\n\n在上述示例中，我们取了一个变量\
    \ `$x`，它被 `$y` 除。结果将是两个变量相除得到的余数。请查看下面的输出：\n\n![](img/image_rsrcE1.jpg)\n图 7：取模运算符\n\
    \n### 幂运算\n\n`**` 是幂运算符。当我们想要打印某个变量的若干次幂时使用它。例如：\n\n```php\n<?php\n$x = 2;\n$y\
    \ = 3;\necho $x ** $y;\n?>\n```\n\n在上述示例中，我们计算 2 的 3 次幂。请查看下面的输出：\n\n![](img/image_rsrcE2.jpg)\n\
    图 8：幂运算符\n\n## 赋值运算符\n\n通过赋值运算符，我们可以给变量设置值。PHP 中基本的赋值运算符是 `=`。\n\n例如：\n\n- `$x\
    \ += $y;` 等同于 `$x = $x + $y;`\n- `$x -= $y;` 等同于 `$x = $x - $y;`\n- `$x *= $y;`\
    \ 等同于 `$x = $x * $y;`\n- `$x /= $y;` 等同于 `$x = $x / $y;`\n- `$x %= $y` 等同于 `$x\
    \ = $x % $y;`\n\n## 比较运算符\n\n- `==` 是相等运算符。例如 `$x == $y`，如果 `$x` 的值等于 `$y` 的值，则返回\
    \ true。\n- `===` 是全等运算符。例如：`$x === $y` 仅当两个变量的值和类型都相同时返回 true。\n- `!=` 是不等于运算符。例如：`$x\
    \ != $y` 如果两个变量的值不同，则返回 true。\n- `<>` 是不等于运算符。例如：`$x != $y` 如果两个变量的值不同，则返回 true。\n\
    - `!==` 不全等运算符。例如 `$x !== $y` 如果值不相同或类型不相同，则返回 true。\n- `>` 是大于运算符。例如：`$x > $y`\
    \ 当 `$x` 的值大于 `$y` 时为 true。\n- `<` 是小于运算符。例如：`$x < $y` 当 `$x` 的值小于 `$y` 时为 true。\n\
    - `>=` 是大于或等于运算符。例如：`$x >= $y` 当 `$x` 的值大于或等于 `$y` 时为 true。\n- `<=` 是小于或等于运算符。例如：`$x\
    \ <= $y` 当 `$x` 的值小于或等于 `$y` 时为 true。\n- `<=>` 是太空船运算符。例如：`$x <=> $y` 如果 `$x`\
    \ 的值小于、等于或大于 `$y`，则返回一个小于、等于或大于零的整数。\n\n## 自增和自减运算符\n\n- `$x++` 将返回 `$x`，然后将其值加一。\n\
    - `++$x` 将 `$x` 的值加一，然后返回 `$x`。\n- `$x--` 将返回 `$x`，然后将其值减一。\n- `--$x` 将值减一，然后返回\
    \ `$x`。\n\n## 逻辑运算符\n\n- **And 运算符**：`$x and $y` 如果 `$x` 和 `$y` 都为 true，则结果为 true。\n\
    - **`&&` 运算符**：`$x && $y` 如果 `$x` 和 `$y` 都为 true，则结果为 true。\n- **OR 运算符**：`$x\
    \ or $y` 如果 `$x` 和 `$y` 任一为 true，则结果为 true。\n- **`||` 运算符**：`$x || $y` 如果 `$x`\
    \ 和 `$y` 任一为 true，则结果为 true。\n- **`!` 非运算符**：`!$x` 如果 `$x` 不为 true，则结果为 true。\n\
    \n# 第 8 章\n\n"
