    \ access</strong></div>\n        </div>\n    </div>\n    <?php } ?>\n</div>\n\
    </body>\n</html>\n```\n\n---\n\n## 注销功能\n\n当用户点击注销按钮时，会话将被销毁，用户重定向到 `index.php`\
