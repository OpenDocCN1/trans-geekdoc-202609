    \ '$password')\";\n        mysqli_query($connection, $sql) or die('error');\n\n\
    \        $_SESSION['username'] = $username_db;\n        $_SESSION['name'] = $name;\n\
    \        header(\"location:restricted.php\");\n    } else {\n        header(\"\
    location:index.php?msg=Please enter fields\");\n    }\n}\n?>\n```\n\n**逻辑说明：**\n\
    1.  `if(isset($_REQUEST['action']) && ($_REQUEST['action']=='register'))` 检查 `action`\
    \ 值是否为 `register`，是则继续执行，否则退出。\n2.  `$username_check` 查询用户名是否已存在于数据库。\n3.  若用户名存在，使用\
