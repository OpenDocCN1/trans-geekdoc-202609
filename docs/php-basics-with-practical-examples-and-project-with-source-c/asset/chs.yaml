  ## 用户注册、登录、受限页面与注销功能实现\n\n### 注册功能\n\n#### 表单页面 (index.php)\n\n页面包含一个注册表单，包含三个输入字段：`name`、`username`\
  \ 和 `password`。访问者填写详情并点击 `SUBMIT` 按钮后，信息将被插入数据库表中，用户完成注册，随后重定向到受限区域。\n\n表单 HTML\
  \ 结构如下：\n\n```html\n<div class=\"col-md-12\">\n  <div class=\"col-md6\">Username:</div>\n\
  \  <div class=\"col-md6\"><input type=\"text\" name=\"username\" value=\"\"></div>\n\
  </div>\n<div class=\"col-md-12\">\n  <div class=\"col-md6\">Password:</div>\n  <div\
  \ class=\"col-md6\"><input type=\"password\" name=\"password\" value=\"\"></div>\n\
  </div>\n<div class=\"row\"><input type=\"submit\" name=\"submit\" value=\"SUBMIT\"\
  ></div>\n```\n\n#### 处理逻辑 (process.php?action=register)\n\n```php\n<?php\nif (isset($_REQUEST['action'])\
  \ && ($_REQUEST['action'] == 'register')) {\n    $name = $_POST['name'];\n    $username\
  \ = $_POST['username'];\n    $password = md5($_POST['password']);\n\n    if (isset($name)\
  \ && isset($username) && isset($password)) {\n        $username_check = mysqli_query($connection,\
  \ \"SELECT * FROM `users` WHERE `username` = '$username'\");\n\n        if (mysqli_num_rows($username_check)\
  \ == 0) {\n            $username_db = $username;\n        } else {\n           \
  \ $username_db = rand(0, 9) . '_' . $username;\n        }\n\n        $sql = \"INSERT\
  \ INTO `users`(`name`, `username`, `password`) VALUES ('$name', '$username_db',\
  \ '$password')\";\n        mysqli_query($connection, $sql) or die('error');\n\n\
  \        $_SESSION['username'] = $username_db;\n        $_SESSION['name'] = $name;\n\
  \        header(\"location:restricted.php\");\n    } else {\n        header(\"location:index.php?msg=Please\
  \ enter fields\");\n    }\n}\n?>\n```\n\n**逻辑说明：**\n1.  `if(isset($_REQUEST['action'])\
  \ && ($_REQUEST['action']=='register'))` 检查 `action` 值是否为 `register`，是则继续执行，否则退出。\n\
  2.  `$username_check` 查询用户名是否已存在于数据库。\n3.  若用户名存在，使用 `rand()` 函数追加随机数以保证唯一性。\n4.\
  \  插入新记录，并使用 `$_SESSION` 超全局变量设置 `username` 和 `name`。\n5.  最后重定向到 `restricted.php`。\n\
  \n---\n\n### 登录功能\n\n#### 登录页面 (login.php)\n\n页面包含两个输入字段：`username` 和 `password`\
  \ 以及一个提交按钮。用户提交数据后，代码验证用户名和密码。若匹配成功，将登录详情（`name` 和 `username`）存入会话，并重定向到受限页面。\n\n\
  **页面截图：**\n![](img/image_rsrcE9.jpg)\n\n**页面代码结构：**\n\n```html\n<!DOCTYPE html>\n\
  <?php include \"connection.php\"; ?>\n<html>\n<head>\n    <title></title>\n    <meta\
  \ charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n    <link rel=\"stylesheet\" href=\"css/bootstrap.css\"\
  >\n    <script src=\"js/bootstrap.js\"></script>\n</head>\n<body>\n<div class=\"\
  container textcenter\">\n    <nav class=\"navbar navbar-expand-lg navbar-light bg-light\"\
  >\n        <ul class=\"navbar-nav mr-auto\">\n            <?php if (isset($_SESSION['username']))\
  \ { ?>\n                <li class=\"nav-item active\"><a href=\"restricted.php\"\
  >Restricted Page | </a></li>\n            <?php } ?>\n            <?php if (!isset($_SESSION['username']))\
  \ { ?>\n                <li class=\"nav-item active\"><a href=\"index.php\">Register\
  \ |</a></li>\n                <li class=\"nav-item active\"><a href=\"login.php\"\
  >Login |</a></li>\n            <?php } ?>\n            <?php if (isset($_SESSION['username']))\
  \ { ?>\n                <li class=\"nav-item active\"><a href=\"process.php?action=logout\"\
  >Logout</a></li>\n            <?php } ?>\n        </ul>\n    </nav>\n\n    <div\
  \ class=\"row\"><?php if (isset($_GET['msg'])) { echo $_GET['msg']; } ?></div>\n\
  \n    <?php if (!isset($_SESSION['username'])) { ?>\n    <form name=\"frm\" method=\"\
  post\" action=\"process.php?action=login\">\n        <div class=\"row\">\n     \
  \       <div class=\"col-md12\">\n                <div class=\"col-md6\">UserName:</div>\n\
  \                <div class=\"col-md6\"><input type=\"text\" name=\"username\" value=\"\
  \"></div>\n            </div>\n            <div class=\"col-md-12\">\n         \
  \       <div class=\"col-md6\">Password:</div>\n                <div class=\"col-md6\"\
  ><input type=\"password\" name=\"password\" value=\"\"></div>\n            </div>\n\
  \        </div>\n        <div class=\"row\"><input type=\"submit\" name=\"submit\"\
  \ value=\"SUBMIT\"></div>\n    </form>\n    <?php } else { echo 'You are logged\
  \ in.'; } ?>\n</div>\n</body>\n</html>\n```\n\n#### 登录处理逻辑 (process.php?action=login)\n\
  \n```php\nif (isset($_REQUEST['action']) && ($_REQUEST['action'] == 'login')) {\n\
  \    $username = $_POST['username'];\n    $password = $_POST['password'];\n    $new_password\
  \ = md5($password);\n\n    $sel_query = \"SELECT * FROM `users` WHERE `username`\
  \ = '$username' AND `password` = '$new_password'\";\n    $sql = mysqli_query($connection,\
  \ $sel_query);\n\n    if (mysqli_num_rows($sql) > 0) {\n        $row = mysqli_fetch_array($sql);\n\
  \        $_SESSION['username'] = $row['username'];\n        $_SESSION['name'] =\
  \ $row['name'];\n        header(\"location:restricted.php\");\n    } else {\n  \
  \      header(\"location:index.php?msg=Incorrect username or password\");\n    }\n\
  }\n```\n\n**逻辑说明：**\n由于密码使用 `md5` 哈希加密存储，用户输入的密码会被转换为加密形式后再与数据库值比对。若匹配成功则重定向到受限页面；否则重定向回\
  \ `index.php` 并提示 \"Incorrect username or password\"。\n\n---\n\n### 受限页面功能\n\n####\
  \ 页面逻辑 (restricted.php)\n\n页面检查会话变量 `$_SESSION['username']` 是否已设置。若已设置，显示 \"Welcome\
  \ to restricted access\"；否则重定向到 `index.php`。\n\n```php\n<?php\ninclude \"connection.php\"\
  ;\nif (!isset($_SESSION['username'])) {\n    header(\"location:index.php\");\n}\n\
  ?>\n<!DOCTYPE html>\n<html>\n<head>\n    <title></title>\n    <meta charset=\"UTF-8\"\
  >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n    <link rel=\"stylesheet\" href=\"css/bootstrap.css\">\n    <script src=\"\
  js/bootstrap.js\"></script>\n</head>\n<body>\n<div class=\"container textcenter\"\
  >\n    <nav class=\"navbar navbar-expand-lg navbar-light bg-light\">\n        <ul\
  \ class=\"navbar-nav mr-auto\">\n            <?php if (isset($_SESSION['username']))\
  \ { ?>\n                <li class=\"nav-item active\"><a href=\"restricted.php\"\
  >Restricted Page | </a></li>\n            <?php } ?>\n            <?php if (!isset($_SESSION['username']))\
  \ { ?>\n                <li class=\"nav-item active\"><a href=\"index.php\">Register\
  \ |</a></li>\n                <li class=\"nav-item active\"><a href=\"login.php\"\
  >Login |</a></li>\n            <?php } ?>\n            <?php if (isset($_SESSION['username']))\
  \ { ?>\n                <li class=\"nav-item active\"><a href=\"process.php?action=logout\"\
  >Logout</a></li>\n            <?php } ?>\n        </ul>\n    </nav>\n\n    <?php\
  \ if (isset($_SESSION['username'])) { ?>\n    <div class=\"row\">\n        <div\
  \ class=\"col-md-12\">\n            <div class=\"row\"><strong>Welcome to restricted\
  \ access</strong></div>\n        </div>\n    </div>\n    <?php } ?>\n</div>\n</body>\n\
  </html>\n```\n\n---\n\n### 注销功能\n\n当用户点击注销按钮时，会话将被销毁，用户重定向到 `index.php` 并提示 \"Logged\
  \ out successfully\"。\n\n**注销处理代码 (位于各页面顶部公共区域)：**\n\n```php\nif (isset($_REQUEST['action'])\
  \ && ($_REQUEST['action'] == 'logout')) {\n    unset($_SESSION['name']);\n    unset($_SESSION['username']);\n\
  \    session_destroy();\n    header(\"location:index.php?msg=Logged out successfully\"\
  );\n}\n```\n"
