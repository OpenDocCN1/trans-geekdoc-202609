- "# PHP 基础实例与项目实战源码指南\n\n\n\n\n\n嗨，朋友们！本书主要讲解 PHP 和 MySQL。它涵盖了 PHP 中几乎所有的核心主题。每个主题都配有实战示例进行解释，以便您能清晰地理解主题，并能自行进行练习。\n\
  \n本书最后一章包含一个带有完整源代码的小型项目。它涵盖了主要主题，让您了解如何从零开始使用 PHP 和 MySQL 构建动态网站。© 2021 Dipti Sahay\
  \ 版权所有 http://readerscollection.in\n\n\n\n# 第 1 章：PHP 简介\n\nPHP 是一种服务端脚本语言，通常用于开发动态网页。它是一种开源脚本语言。它免费、广泛使用且易于下载。它是开发\
  \ Web 应用程序或动态网站的最佳工具。\n\nPHP 最初由 Rasmus Lerdorf 于 1994 年创建。\n\n早期 PHP 代表 Personal\
  \ Home Page（个人主页），但现在 PHP 代表 PHP: Hypertext Preprocessor（超文本预处理器）。PHP 脚本在服务器上执行。它兼容所有服务器，如\
  \ Apache、IIS 等。一个 PHP 文件包含 HTML 代码、CSS 代码和 PHP 脚本。文件以 `.php` 扩展名保存。它在服务器上执行，生成的响应是纯\
  \ HTML，并显示在浏览器中。\n\n因此，在开始学习 PHP 之前，我们必须了解 PHP 能做什么。PHP 可用于创建动态页面内容。\n\n它可用于创建表单并收集最终用户的数据。它可以创建会话，并在用户浏览网站中的多个页面时维护该用户的会话。PHP\
  \ 可用于通过执行 CRUD 操作（如创建、读取、更新和删除操作）来操作数据库中的数据。\n\nPHP 可用于创建会话和跟踪用户活动。要学习或使用 PHP，您应该具备\
  \ HTML、CSS 和 JavaScript 的基础知识。HTML 是超文本标记语言，CSS 是层叠样式表。HTML 描述网页的结构。HTML 包含许多元素。这些元素存放网页的文本和图像。它实际上告诉浏览器如何显示网页的数据。CSS\
  \ 用于为这些元素赋予样式，即网页的外观和风格。\n\nHTML 和 CSS 主题未在本书中涵盖，但当在本书中使用 HTML 标签和 CSS 代码时，我将简要描述使用它们的主要目的。\n\
  \n# 第 2 章：使用 PHP 开发的应用程序类型\n\nPHP 可用于开发任何动态网页。那么什么是动态网站呢？动态网站意味着网站内容不是静态的，即 HTML\
  \ 页面不存储网站内容。数据或内容来自数据库，并随用户操作而变化。\n\n那么我们可以使用 PHP 开发哪些类型的应用程序和网站呢？\n\n我们可以开发资讯类网站、博客、B2B\
  \ 应用、B2C 应用、电子商务应用、论坛、ERP 系统等等。\n\n# 第 3 章：如何在本地安装 PHP\n\n在本地安装 PHP 意味着将其安装在您的本地电脑上。这是学习\
  \ PHP 的重要一步，以便您可以在本地电脑上运行和测试 PHP 代码。我们将安装 XAMPP 服务器（包含 Apache、MySQL 和 PHP）。Apache\
  \ 是运行 PHP 脚本所需的 Web 服务器。\n\n请按照以下步骤在您的电脑上安装 XAMPP。\n\n**步骤 1：** 访问 `https://www.apachefriends.org/download.html`。下载适用于您\
  \ Windows 系统的最新版 XAMPP。\n\n**步骤 2：** 保存并运行 `.exe` 文件。\n\n**步骤 3：** 您的屏幕上将打开一个安装向导对话框。按照说明在所需文件夹中安装\
  \ XAMPP。\n\n安装部分现在完成了！\n\n# 第 4 章：运行您的第一个 PHP 程序\n\n如果您已在 C 盘完成 XAMPP 安装。然后导航到 C\
  \ 盘，通过点击 XAMPP 文件夹内已有的 `xampp_start` 图标手动启动服务器。请看下面的截图：\n\n![](img/image_rsrcDT.jpg)\n\
  \n编写 PHP 脚本需要一个编辑器。有许多免费的编辑器工具可用，如 Notepad++、Sublime、Netbeans。您可以使用其中任何一个。我将使用 Netbeans\
  \ 编写 PHP 脚本。\n\n手动导航到 `C:\\xampp\\htdocs` 文件夹。这是一个您可以存放项目文件夹及其中文件的文件夹。我在这里创建一个文件夹并将其命名为\
  \ `Practicalphp`。我将使用此文件夹存放所有用于实战示例的 PHP 脚本，并随着我们逐步推进进行测试。\n\nPHP 代码以开始标签开头，以结束标签结尾。那么\
  \ PHP 中的开始和结束标签是什么？`<?php` 是开始标签，`?>` 是结束标签。PHP 脚本位于这两个标签之间。您可以在下面找到代码：\n\n```php\n\
  <?php\n//php code goes here\n?>\n```\n\n下面我们将使用 PHP 在网页上打印文本。为此，在 `C:\\xampp\\htdocs\\\
  PracticalPhp` 文件夹中创建一个文件并将其保存为 `index.php`。粘贴下面的代码以在页面上显示 “Hello ! I am here”。\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\"\
  >\n    <title>MyFirstExample</title>\n</head>\n<body>\n    <?php echo \"Hello !\
  \ I am here\" ;?>\n</body>\n</html>\n```\n\n现在，如果您已经在电脑上启动了 XAMPP 服务器，请打开任意浏览器并输入\
  \ `localhost/PracticalPhp/` 然后按回车。您将在屏幕上看到 “Hello ! I am here”。请看下面的截图：\n\n![](img/image_rsrcDU.jpg)\n\
  \n**图示 1：打印 Hello !I am here 的示例**\n\n一个普通的 PHP 文件包含一些 HTML 代码和一些 PHP 脚本代码，文件以 `.php`\
  \ 扩展名保存。PHP 代码写在 PHP 开始标签和 PHP 结束标签之间。每条 PHP 代码语句以分号结尾。在上面的代码中，“MyFirstExample”\
  \ 文本被用作 HTML `<title>` 标签内的标题，将显示在页面顶部。在 PHP 中有一个内置函数 `echo()`，可用于在网页上输出文本 “Hello\
  \ ! I am here”。\n\n# 第 5 章：变量声明及其用法示例\n\n变量是一个存储值的容器。它可以存储文本字符串、数字等。我们不必声明变量的数据类型（即\
  \ String、Integer）。\n\n它会根据其值自动将变量转换为其正确的数据类型。赋值运算符用于给变量赋值。一旦声明了变量，就可以在整个代码中使用它。PHP\
  \ 变量遵循一些命名约定，即定义变量时遵循一些规则。PHP 变量以美元符号 `$` 开头，后跟名称。变量名不能以数字开头。它可以包含字母数字字符和下划线。变量名不能包含空格。它们区分大小写。\n\
  \n请看下面定义变量的示例：\n\n```php\n$var = \"This is a string variable\";\n```\n由于上述 `$var`\
  \ 变量存储文本。它是一个数据类型为 String 的变量。\n\n```php\n$var = 10;\n```\n由于上述 `$var` 变量存储数字。它是一个数据类型为\
  \ Integer 的变量。\n\n```php\n$var = array(\"a\", \"b\", \"c\");\n```\n由于 `$var` 存储数组数据，所以它是一个数组变量。\n\
  \n```php\n$var = 2.5;\n```\n\n\n\n\n\n## PHP 变量与常量\n\n由于 `$var` 变量存储的是一个浮点数，因此它是一个浮点型变量。\n\
  \n### PHP 常量\n\n标识符，它保存一个值，且该值在整个脚本执行期间保持不变。该值不能在脚本中被更改。它以字母或下划线开头。它在整个脚本中是全局的。\n\
  \n要在脚本中创建常量，可以使用 `define()` 函数。\n\n```php\n<?php\ndefine(\"STORE\", \"Estore Diversity\"\
  );\necho STORE;\n?>\n```\n\n在上述示例中，我定义了一个名为 `STORE` 的常量。它保存的值为 `Estore Diversity`。\n\
  \n现在，每当我在脚本中使用并打印 `STORE` 常量时，它都将显示值 `Estore Diversity`。\n\n因此，定义常量的主要目的是：当我们想要定义一些标识符，它们将保存一些在整个代码中不会改变且在脚本中全局可用的值时。\n\
  \n# 第 6 章：PHP 数据类型\n\n数据类型说明了数据的类型。存储在变量中的值可以是任意数据类型。有多种数据类型：\n\n- 字符串\n- 整型\n-\
  \ 布尔型\n- 数组\n- 对象\n- NULL\n- 浮点型\n\n包含在单引号或双引号之间的任何字符序列都是字符串。例如：\n\n```php\n<?php\n\
  $var = \"Hello World\";\necho $var;\n?>\n```\n\n上述 `$var` 是一个字符串变量，因为它保存的是包含在双引号之间的字符序列。\n\
  \n保存数字（非十进制数）的变量是整型。整型可以是正数或负数，但必须是整数。\n\n例如：\n\n```php\n<?php\n$a = 10;\necho $a;\n\
  ?>\n```\n\n在上述示例中，变量 `$a` 保存数字 10，它没有任何小数点，因此它是一个整型。\n\n保存布尔值（即 true 或 false）的变量是布尔型变量。布尔值用于条件块中。例如，如果某个变量的值等于\
  \ true 或 false，则将执行以下条件。If 和 Else 条件将在下一节中解释。\n\n浮点数是带有小数点的数字。例如：\n\n```php\n<?php\n\
  $b = 2.45;\n?>\n```\n\n数组是一种数据类型，它在一个变量中存储多个相同类型的值。我们可以使用 `array()` 函数来定义数组。这在数组章节中有详细解释。\n\
  \n对象是一种数据类型，它存储数据，还存储如何处理这些数据的信息。对象必须显式声明。首先，我们使用 `Class` 关键字定义一个类。它包含一些属性和方法。然后我们创建一个实例，即类的对象，以使用这些方法和属性。\n\
  \n```php\n<?php\nclass A {\n    public $var = \"hello\";\n    public function demo()\
  \ {\n        echo $this->var;\n    }\n}\n$object = new A();\necho $object->demo();\n\
  ?>\n```\n\n这里我们声明了一个类 `A`。它包含 `$var` 属性和一个 `demo()` 方法。属性是类中的变量，方法是类中的函数。\n\n![](img/image_rsrcDV.jpg)\n\
  图 2：类数据类型\n\n`demo()` 方法访问变量 `$var`，将打印值 \"hello\"。`$object` 是为类 `A` 创建的对象。请查看下面代码的输出：\n\
  \nNULL 是一种特殊的数据类型，它不保存任何值。它的值只能是 NULL。变量可以被设置为 NULL 值。\n\n```php\n<?php\n$x = NULL;\n\
  var_dump($x);\n?>\n```\n\n![](img/image_rsrcDW.jpg)\n图 3：NULL 数据类型\n\n# 第 7 章：PHP\
  \ 运算符\n\n运算符用于对变量和值执行不同的操作。假设我们有两个变量，想要知道它们的总和。那么我们将使用算术运算符对这两个变量执行加法运算。\n\n我们可以将操作分为不同的组：\n\
  \n- 算术运算符\n- 赋值运算符\n- 比较运算符\n- 自增/自减运算符\n- 逻辑运算符\n- 字符串运算符\n- 数组运算符\n- 条件赋值运算符\n\
  \n## 算术运算符\n\n### 加法\n\n`+` 是加法运算符。当我们需要两个变量的和时使用它。例如：\n\n```php\n<?php\n$x = 10;\n\
  $y = 20;\necho $x + $y;\n?>\n```\n\n![](img/image_rsrcDX.jpg)\n图 4：加法运算符\n\n###\
  \ 减法\n\n`-` 是减法运算符。当我们想要从一个变量中减去另一个变量时使用它。\n\n```php\n<?php\n$x = 50;\n$y = 25;\n\
  echo $x - $y;\n?>\n```\n\n这里通过使用减法运算符，从 `$x` 变量中减去了 `$y` 变量。请查看下面的输出：\n\n![](img/image_rsrcDY.jpg)\n\
  图 5：减法运算符\n\n### 乘法\n\n`*` 是乘法运算符。当我们想要两个变量的乘积时使用它。\n\n```php\n<?php\n$x = 10;\n\
  $y = 20;\necho $x * $y;\n?>\n```\n\n在上面的示例中，我们有两个变量 `$x` 和 `$y`。我们将它们相乘以获得两个变量的乘积。请查看下面的输出：\n\
  \n![](img/image_rsrcDZ.jpg)\n图 6：乘法运算符\n\n### 除法\n\n`/` 是除法运算符，当我们想要用一个变量除以另一个变量时使用它。例如：\n\
  \n```php\n<?php\n$x = 100;\n$y = 10;\necho $x / $y;\n?>\n```\n\n这里我们有一个变量 `$x`，它被\
  \ `$y` 除并返回一个值。请查看下面的输出：\n\n![](img/image_rsrcE0.jpg)\n\n### 取模\n\n`%` 是取模运算符，它返回一个变量除以另一个变量的余数。例如：\n\
  \n```php\n<?php\n$x = 100;\n$y = 40;\necho $x % $y;\n?>\n```\n\n在上述示例中，我们取了一个变量\
  \ `$x`，它被 `$y` 除。结果将是两个变量相除得到的余数。请查看下面的输出：\n\n![](img/image_rsrcE1.jpg)\n图 7：取模运算符\n\
  \n### 幂运算\n\n`**` 是幂运算符。当我们想要打印某个变量的若干次幂时使用它。例如：\n\n```php\n<?php\n$x = 2;\n$y =\
  \ 3;\necho $x ** $y;\n?>\n```\n\n在上述示例中，我们计算 2 的 3 次幂。请查看下面的输出：\n\n![](img/image_rsrcE2.jpg)\n\
  图 8：幂运算符\n\n## 赋值运算符\n\n通过赋值运算符，我们可以给变量设置值。PHP 中基本的赋值运算符是 `=`。\n\n例如：\n\n- `$x +=\
  \ $y;` 等同于 `$x = $x + $y;`\n- `$x -= $y;` 等同于 `$x = $x - $y;`\n- `$x *= $y;` 等同于\
  \ `$x = $x * $y;`\n- `$x /= $y;` 等同于 `$x = $x / $y;`\n- `$x %= $y` 等同于 `$x = $x\
  \ % $y;`\n\n## 比较运算符\n\n- `==` 是相等运算符。例如 `$x == $y`，如果 `$x` 的值等于 `$y` 的值，则返回 true。\n\
  - `===` 是全等运算符。例如：`$x === $y` 仅当两个变量的值和类型都相同时返回 true。\n- `!=` 是不等于运算符。例如：`$x !=\
  \ $y` 如果两个变量的值不同，则返回 true。\n- `<>` 是不等于运算符。例如：`$x != $y` 如果两个变量的值不同，则返回 true。\n\
  - `!==` 不全等运算符。例如 `$x !== $y` 如果值不相同或类型不相同，则返回 true。\n- `>` 是大于运算符。例如：`$x > $y`\
  \ 当 `$x` 的值大于 `$y` 时为 true。\n- `<` 是小于运算符。例如：`$x < $y` 当 `$x` 的值小于 `$y` 时为 true。\n\
  - `>=` 是大于或等于运算符。例如：`$x >= $y` 当 `$x` 的值大于或等于 `$y` 时为 true。\n- `<=` 是小于或等于运算符。例如：`$x\
  \ <= $y` 当 `$x` 的值小于或等于 `$y` 时为 true。\n- `<=>` 是太空船运算符。例如：`$x <=> $y` 如果 `$x` 的值小于、等于或大于\
  \ `$y`，则返回一个小于、等于或大于零的整数。\n\n## 自增和自减运算符\n\n- `$x++` 将返回 `$x`，然后将其值加一。\n- `++$x`\
  \ 将 `$x` 的值加一，然后返回 `$x`。\n- `$x--` 将返回 `$x`，然后将其值减一。\n- `--$x` 将值减一，然后返回 `$x`。\n\
  \n## 逻辑运算符\n\n- **And 运算符**：`$x and $y` 如果 `$x` 和 `$y` 都为 true，则结果为 true。\n- **`&&`\
  \ 运算符**：`$x && $y` 如果 `$x` 和 `$y` 都为 true，则结果为 true。\n- **OR 运算符**：`$x or $y` 如果\
  \ `$x` 和 `$y` 任一为 true，则结果为 true。\n- **`||` 运算符**：`$x || $y` 如果 `$x` 和 `$y` 任一为\
  \ true，则结果为 true。\n- **`!` 非运算符**：`!$x` 如果 `$x` 不为 true，则结果为 true。\n\n# 第 8 章\n\n\
  \n\n\n## PHP 字符串运算符\n\nPHP 字符串运算符包含两种运算符：连接运算符（`.`）和连接赋值运算符（`.=`）。\n\n- **连接运算符**：`$x\
  \ . $y` 将 `$x` 和 `$y` 连接起来。\n- **连接赋值运算符**：`$x .= $y` 将 `$y` 追加到 `$x` 后面。\n\n---\n\
  \n# 第 9 章：PHP 中的字符串\n\n字符串是字符序列。\n\n## 如何定义字符串变量？\n\n请看下面的示例：\n\n```php\n$x = \"\
  hello world\";\n```\n\n在上面的示例中，我们创建了一个变量 `$x` 并为其赋值。该值是一个字符序列，因此这样就创建了一个字符串变量。\n\
  \nPHP 中有各种字符串函数可用于应用程序，下面讨论其中一些：\n\n假设我们要检查字符串变量的长度，可以使用 `strlen()`。\n\n```php\n\
  <?php echo strlen(\"hi\"); ?>\n```\n\n输出结果为 `2`，因为只有两个字符。\n\n还有许多其他的 PHP 字符串函数，如\
  \ `strstr()`、`strlen()`、`strpos()` 等。\n\n---\n\n## PHP 数组\n\n数组用于在单个变量中存储多个值。\n\n\
  定义数组使用 `[]` 括号。\n\n定义一个名为 `fruits` 的数组：\n\n```php\n$fruits = array();\n```\n\n上面的\
  \ `$fruits` 是一个空数组。现在为其赋值：\n\n```php\n$fruits = ['guava', 'apple', 'orange', 'pineapple',\
  \ 'mango'];\n```\n\n如果打印 `$fruits[1]`，结果将是 `apple`，因为 `apple` 在索引 1 处。\n\n数组主要有三种类型：\n\
  \n1. **索引数组**：索引为数字。\n2. **关联数组**：索引不为数字（通常为字符串）。\n3. **多维数组**：包含一个或多个数组的数组。\n\n\
  ---\n\n# 第 10 章：If 和 Else 语句块及示例\n\n`if` 和 `else` 是条件语句块，根据条件执行不同操作。\n\n**示例**：当变量值为\
  \ 10 时打印 \"hello\"。\n\n```php\n<?php\n$var = 10;\nif ($var == 10) {\n    echo \"\
  hello\";\n} else {\n    echo \"bye\";\n}\n?>\n```\n\n在上面的示例中：\n1. 定义变量 `$var` 并赋值为\
  \ 10。\n2. 应用 `if` 条件：如果变量值为 10 则打印 \"hello\"，否则执行 `else` 块打印 \"bye\"。\n3. 由于变量值满足\
  \ `if` 条件（值为 10），屏幕将显示 \"hello\"。\n\n输出示意图：\n![图解 9：If .. Else 语句块](img/image_rsrcE3.jpg)\n\
  \n---\n\n# 第 11 章：PHP 循环\n\n当需要在满足特定条件时重复执行代码块时使用循环。\n\n循环类型：\n- `while`\n- `do\
  \ ... while`\n- `for`\n- `foreach`\n\n## While 循环\n\n当条件为真时持续执行。\n\n**语法**：\n```php\n\
  while (condition is true) {\n    // code to be executed\n}\n```\n\n**示例**：\n```php\n\
  $var = 1;\nwhile ($var <= 6) {\n    echo $var;\n    $var++;\n}\n```\n**输出**：`123456`\n\
  变量每次增加 1 并显示，直到其值小于或等于 6。\n\n## Do...While 循环\n\n先执行一次代码块，然后在条件为真时重复循环。\n\n**语法**：\n\
  ```php\ndo {\n    // code to be executed\n} while (condition is true);\n```\n\n\
  **示例**：\n```php\n$var = 1;\ndo {\n    echo $var;\n    $var++;\n} while ($var <=\
  \ 6);\n```\n**输出**：`123456`\n\n## For 循环\n\n在条件为真时，按指定次数迭代代码块。\n\n**语法**：\n```php\n\
  for (initialization; condition; increment) {\n    // code to be executed\n}\n```\n\
  \n**示例**：\n```php\nfor ($x = 1; $x <= 5; $x++) {\n    echo $x;\n}\n```\n**输出**：`12345`\n\
  \n## Foreach 循环\n\n遍历数组中的每个元素。\n\n**语法**：\n```php\nforeach ($array as $key => $value)\
  \ {\n    echo $key;\n    echo '<br>';\n    echo $value;\n}\n```\n\n**示例**：\n假设有数组变量\
  \ `$arr`：\n```php\n$arr = ['a' => 'yellow', 'b' => 'red', 'c' => 'white'];\nforeach\
  \ ($arr as $key => $value) {\n    echo $key;\n    echo '<br>';\n    echo $value;\n\
  }\n```\n**输出**：\n```text\na\nyellow\nb\nred\nc\nwhite\n```\n\n---\n\n## PHP 超全局变量\n\
  \n预定义的全局作用域变量，即可在脚本任何位置访问。无需特殊操作即可调用。\n\n主要超全局变量：\n- `$GLOBALS`\n- `$_SERVER`\n\
  - `$_POST`\n- `$_GET`\n- `$_REQUEST`\n- `$_FILES`\n- `$_ENV`\n- `$_COOKIE`\n- `$_SESSION`\n\
  \n功能说明：\n- `$_SERVER`：返回与头部和路径相关的信息。\n- `$_POST`：用于获取从表单提交的数据值。\n- `$_GET`：用于获取\
  \ GET 变量的值。\n- `$_REQUEST`：用于同时获取 POST 和 GET 数据。\n- `$_ENV`：环境变量。\n\n---\n\n## PHP\
  \ 表单\n\n现代网站（餐厅预订、活动报名、博客等）都包含表单功能。\n\n**场景**：访问餐厅网站预订晚餐。经理需要知道预订信息，开发人员创建页面收集客人信息（姓名、手机号等）并存入数据库。\n\
  \n### 表单基础\n\n- 表单以 `<form>` 标签开始，以 `</form>` 结束。\n- 基本字段：文本框、密码框、文本域、日期选择器、单选按钮、复选框。\n\
  - 每个表单有 `method` 属性：`post` 或 `get`，指定数据传输方式。\n  - `get` 为默认方法，数据追加在 URL 中。\n  -\
  \ `post` 更安全，数据不暴露在 URL 中。\n- 每个表单有 `action` 属性：提交后重定向到指定页面处理表单。\n\n**语法**：\n```html\n\
  <form action=\"action.php\" method=\"post\">\n    <field1...>\n    <field2...>\n\
  </form>\n```\n\n**示例**：客人预订餐桌表单\n```html\n<form method=\"post\" action=\"process.php\"\
  >\n    Name: <input type=\"text\" name=\"name\">\n    Mobile: <input type=\"number\"\
  \ name=\"mobile\">\n    Email: <input type=\"text\" name=\"email\">\n    <input\
  \ type=\"submit\" name=\"submit\" value=\"submit\">\n</form>\n```\n\n---\n\n# 第\
  \ 14 章：服务端验证\n\n提交表单时应进行验证，即检查必填字段非空且数据类型正确。\n\n针对上述表单，在 `process.php` 中添加处理逻辑：\n\
  \n```php\nif (isset($_POST['submit'])) {\n    if ($_POST['name'] != '' && $_POST['number']\
  \ != '' && $_POST['email']) {\n        // code to be executed\n    } else {\n  \
  \      // redirect to previous page\n    }\n}\n```\n\n上述代码检查字段是否包含值。若任意字段未设置值，则将用户重定向回表单页面。\n\
  \n---\n\n# 第 15 章：MySQL 简介\n\nMySQL 是开源关系型数据库系统，是 PHP 最常用的数据库。由 Oracle 公司开发、分发和支持。\n\
  \nMySQL 中包含表，每个表包含行和列。适用于大小型应用，速度快、可靠、易用，可在多种平台编译运行。\n\n---\n\n# 第 16 章：PHP 连接 MySQL\n\
  \n可使用 `mysqli` 扩展连接 MySQL。\n\n**语法**：\n```php\n<?php\n$host = 'localhost';\n$username\
  \ = 'root';\n$password = '';\n\n// 创建新连接\n$conn = new mysqli($host, $username, $password);\n\
  \nif ($conn->connect_error) {\n    die('Connection Failed: ' . $conn->connect_error);\n\
  }\n\necho 'Connected Successfully';\n?>\n```\n\n**输出**：\n```text\nConnected Successfully\n\
  ```\n\n在上面的代码中，我们创建了 `mysqli` 类的实例。\n\n\n\n\n# 第 17 章：创建数据库和表\n\n## 创建数据库\n\n要创建数据库，可以编写以下\
