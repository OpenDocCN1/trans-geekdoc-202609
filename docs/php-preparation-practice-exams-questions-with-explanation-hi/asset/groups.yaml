    approach keeps sensitive information out of the source code, minimizing the risk
    of accidental exposure or unauthorized access if the code is shared or deployed
    to production environments.


    ## Question 3. In the context of PHP and MySQL integration, what is the role of
    prepared statements, and why are they crucial for database operations?


    -   A. Prepared statements are used solely for retrieving data from the database
    without altering it.


    -   B. They allow for executing the same SQL statement multiple times with different
    parameters, improving performance.


    -   C. Prepared statements help prevent SQL injection attacks by separating SQL
    logic from data inputs, ensuring safety.


    -   D. Their main function is to optimize database performance by indexing frequently
    accessed tables.


    Correct Answer: C


    Explanation: Prepared statements play a crucial role in preventing SQL injection
    attacks by separating SQL logic from user inputs. This means that the data provided
    by the user is treated as parameters rather than executable code, making it much
    more difficult for attackers to inject malicious SQL commands, thus enhancing
    the security of database operations in PHP applications.


    ## Question 4. When using the PDO (PHP Data Objects) extension for database integration
    in PHP, which of the following features is considered an advantage of this method
    over the older MySQL extension?


    -   A. PDO provides a consistent interface for working with multiple database
    systems.


    -   B. PDO does not support prepared statements, which limits its usability.


    -   C. MySQLi allows for asynchronous queries, whereas PDO does not.


    -   D. PDO requires more code to establish a database.


    Correct Answer: A


    Explanation: One of the significant advantages of PDO (PHP Data Objects) is that
    it provides a consistent interface for working with multiple database systems.
    This allows developers to switch databases with minimal changes to code.


    ## Question 5. What is the significance of using transactions in PHP when performing
    related operations, and what could be a potential outcome if transactions are
    not utilized?


    -   A. Transactions guarantee that all operations are completed; otherwise, they
    allow for rollback.


    -   B. They increase the speed of database operations.


    -   C. Transactions are only necessary for read operations.


    -   D. Without transactions, the application can scale.


    Correct Answer: A


    Explanation: The significance of using transactions in PHP when performing related
    operations lies in their ability to ensure data integrity. If any part of the
    transaction fails, it allows for rollback to restore the database to its previous
    state. This is crucial in scenarios where changes depend on each other.


