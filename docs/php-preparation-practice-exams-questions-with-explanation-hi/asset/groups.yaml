    解释：更新 ''users'' 表中特定用户电子邮件的正确 SQL 命令是 `UPDATE users SET email=''newmail@example.com''
    WHERE id=1;`。`UPDATE` 语句用于修改表中的现有记录，`WHERE` 子句根据条件指定更新哪些记录。


