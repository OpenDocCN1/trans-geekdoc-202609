    "name" and "age" mapped to the values "John" and 30 respectively?


    - A. $person = array("name" => "John", "age" => 30);


    - B. $person = ["name": "John", "age": 30];


    - C. $person = ("name": "John", "age": 30););


    - D. $person = {"name" => "John", "age" => 30};


    Correct Answer: A


    Explanation: The array data type in PHP allows for the storage of multiple values
    in a single variable. The correct way to initialize an associative array is by
    using the array() function or the shorthand [] with key-value pairs defined by
    the => operator. Option A correctly shows this syntax, establishing keys "name"
    and "age" with their corresponding values.


    ## Question 34. In PHP, when using the isset() function, what is its primary purpose
