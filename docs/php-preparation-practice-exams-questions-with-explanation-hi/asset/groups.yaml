    ## CHAPTER 1 MCQ’s


    ### Basic Syntax and Data Types


    Question 1. What is the correct way to declare a variable in PHP, ensuring that
    the variable name adheres to the naming conventions, which include beginning with
    a dollar sign, followed by a letter or underscore, and consisting of any combination
    of letters, numbers, and underscores?


    - A. $variable name

    - B. $variable$name

    - C. $_variable123

    - D. $123_variable


    Correct Answer: C


    Explanation: The correct option is C, $_variable123, as it starts with a dollar
    sign, followed by an underscore, and contains a combination of letters and numbers.
    Option A is incorrect due to the space, which is not allowed in variable names.
    Option B is also incorrect as it lacks the dollar sign at the start, and option
    D is invalid since variable names cannot start with a number.


    Question 2. In PHP, which of the following data types can be used to store a series
    of characters, such as a name or a sentence, and can also be enclosed in either
    single or double quotes, allowing for both basic and complex variable interpolation?


    - A. Integer

    - B. Float

    - C. String

    - D. Boolean


    Correct Answer: C


    Explanation: The correct answer is C, String, which can hold a sequence of characters.
    Strings in PHP can be created using single quotes or double quotes. Single quotes
    treat the string literally, while double quotes allow for variable interpolation
    and special character interpretation. Options A and B are numerical data types,
    while option D represents a truth value.


    Question 3. What will be the output of the following PHP code snippet:


    ```php

    $x = 5;

    $y = 10;

    echo $x + $y;

    ```


    - A. 5

    - B. 10

    - C. 15

    - D. 510


    Correct Answer: C


    Explanation: The correct answer is C, 15, as the code performs an arithmetic operation
    where the values of $x and $y (10) are added together. The echo statement outputs
    the result of this addition. Option D may appear plausible but it incorrectly
    suggests string concatenation instead of numeric addition.


    Question 4. Which of the following PHP functions is specifically used to determine
    the type of a variable, returning a string representation of the type, which can
    be useful for debugging purposes to ensure that variables hold the expected data
    types during runtime?


    - A. gettype()

    - B. is_array()

    - C. var_dump()

    - D. type_of()


    Correct Answer: A


    Explanation: The correct answer is A, gettype(), which returns a string that indicates
    the type of the variable passed to it. Options B and C are functions that check
    for specific types or display variable contents rather than return type information.
    Option D, type_of(), does not exist in PHP.


    Question 5. What is the correct way to create a constant in PHP, which is a type
    of variable that cannot be changed once it is defined, ensuring that its value
    remains the same throughout the script execution, typically using a predefined
    function?


    - A. define(''MY_CONSTANT'', ''value'');

    - B. const MY_CONSTANT = ''value'';

    - C. set_constant(''MY_CONSTANT'', ''value'');

    - D. constant(''MY_CONSTANT'', ''value'');


    Correct Answer: A


    Explanation: The correct answer is A, define(''MY_CONSTANT'', ''value''); which
    is the proper syntax for defining a constant in PHP. While Option B is also valid
    in PHP 7 and later, it is not used with the same flexibility as define(). Options
    C and D do not represent valid PHP functions for creating constants.


    **Question 6.** What is the correct way to declare a variable in PHP, ensuring
    that it starts with the correct symbol and follows the naming conventions for
    identifiers, which typically involve starting with a dollar sign followed by a
    letter or underscore, and may contain letters, numbers, and underscores but cannot
    start with a number?


    - A. variable $name;

    - B. $name = "John";

    - C. $name = "John";

    - D. name = "John";


    Correct Answer: C


    Explanation: The correct way to declare a variable in PHP is to start with a dollar
    sign followed by a valid identifier. Option C correctly declares a variable named
    $name and assigns it the string "John". Option A is incorrect as it lacks the
    assignment operator. Option B is invalid because variable names cannot start with
    a number. Option D is incorrect as it does not use the dollar sign to declare
    the variable.


    **Question 7.** Which of the following PHP data types is used to represent a collection
    of key-value pairs where each key is unique, allowing for easy retrieval and manipulation
    of data, particularly when dealing with associative arrays?


    - A. Integer

    - B. String

    - C. Array

    - D. Object


    Correct Answer: C


    Explanation: In PHP, an array is used to store a collection of key-value pairs,
    allowing for easy retrieval and manipulation of data, particularly when dealing
    with associative arrays.


    **Question 8.** When working with PHP, what would be the output of the following
    snippet: $a = 5; $b = 10; echo $a + $b$;


    - A. 15

    - B. 510

    - C. 5

    - D. 0


    Correct Answer: A


    Explanation: The correct answer is A, 15, as the code performs an addition of
    $a and $b. Option B suggests string concatenation, while C and D are incorrect
    in this arithmetic context.


    **Question 9.** In PHP, what is the significance of the unset() function on a
    variable, and how does it affect memory management?


    - A. It deletes the variable, freeing up memory.

    - B. It changes the variable''s data type to null.

    - C. It resets the variable value.

    - D. It only modifies the visibility scope.


    Correct Answer: A


    Explanation: The unset() function is used to destroy a specified variable, making
    it inaccessible and freeing up the memory allocated to that variable. Option A
    is correct, while Option B is incorrect as the variable is deleted, not changed.
    Option C is also inaccurate.


    **Question 10.** What is the purpose of using the is_numeric() function in PHP,
    particularly in relation to validating input and ensuring that data conforms to
    expected formats before performing operations, such as arithmetic or database
    transactions?


    - A. It checks if the input is a string containing only alphabetic characters.

    - B. It verifies if the input is a valid number or a numeric string.

    - C. It converts all numeric inputs to integers.

    - D. It ensures that a variable is not empty before processing.


    Correct Answer: B


    Explanation: The is_numeric() function checks whether a variable contains a number
    or a numeric string, which is essential for input validation before executing
    operations that require numeric data. Option B is correct.


    **Question 11.** In PHP, which of the following data types is used to store a
    whole number, and which syntax correctly defines a variable that holds the value
    of this type?


    - A. Integer; $myVariable = 10;

    - B. Float; $myVariable = "10.5";

    - C. String; $myVariable = 10;

    - D. Array; $myVariable = array(10);


    Correct Answer: A


    Explanation: An integer is a data type used to represent whole numbers in PHP.
    The correct syntax to define a variable that holds an integer value is to use
    the $ symbol followed by the variable name, as in $myVariable = 10.

