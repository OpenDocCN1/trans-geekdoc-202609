    无论条件如何都执行循环体，这会如何影响程序的整体控制流？


    A. 当循环至少需要执行一次时，因为条件是在循环体之后进行评估的。


    B. 当开始时条件为假时，循环不应该执行时。


    C. 当循环仅用于固定次数的迭代，且不带任何条件时。


    D. 当循环必须持续进行，直到外部条件改变流程时。


