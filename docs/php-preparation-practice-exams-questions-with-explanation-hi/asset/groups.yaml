    C. Both loops check the condition before executing the block of code.

    D. while loop executes at least once regardless of the condition.


    Correct Answer: B


    Explanation: The key difference between while and do...while loops in PHP is the
    timing of the condition check. The do...while loop checks the condition after
    executing the code block, ensuring it runs at least once.

