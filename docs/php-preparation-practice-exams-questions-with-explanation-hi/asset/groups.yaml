    Question 14. In PHP, what is the primary advantage of using the PDO (PHP Data
    Objects) extension over MySQLi when connecting to databases, particularly in terms
    of database abstraction?


    +   A. PDO supports only MySQL databases.


    +   B. PDO allows for easier switching between different database types with minimal
    code changes.


    +   C. PDO is more efficient in executing complex queries.


    +   D. PDO does not support prepared statements.


    Correct Answer: B


    Explanation: The primary advantage of using PDO is its ability to support multiple
