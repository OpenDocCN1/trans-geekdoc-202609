    # Question 16. What is the role of transactions in PHP database integration, and
    how can they be effectively managed when performing multiple related SQL operations?


    +   A. Transactions ensure that all SQL operations are executed in a single statement.

    B. Transactions allow for multiple SQL operations to be rolled back if one fails,
    ensuring data integrity.

    C. Transactions automatically commit changes after each SQL operation.

    D. Transactions are not supported in PHP database operations.


    Correct Answer: B


    Explanation: Transactions in PHP database integration are used to manage multiple
    related SQL operations as a single unit of work. If one operation fails, the entire
    transaction can be rolled back, preserving data integrity and ensuring that the
    database remains consistent. This is crucial for applications that require atomicity,
    where a set of operations must all succeed or fail together.


