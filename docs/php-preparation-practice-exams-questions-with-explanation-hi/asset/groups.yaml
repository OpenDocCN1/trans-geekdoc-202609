    # Question 91. What is the purpose of the break statement in a switch control
    structure in PHP, and what would happen if it were omitted from any case block?


    A. It terminates the switch structure completely.

    B. It allows the next case to execute as well.

    C. It throws an error.

    D. It exits the entire script.


    Correct Answer: B


    Explanation: The break statement in a switch structure is used to terminate the
    execution of a case block. If omitted, PHP continues to execute subsequent case
    blocks, a behavior known as "fall-through." This can be useful in certain scenarios,
    but it often leads to unintended consequences if not carefully managed.


    # Question 92. Which of the following statements accurately describes the while
