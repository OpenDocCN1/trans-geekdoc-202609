    \ the dataset, in the GitHub: [https://github.com/shriramkv/MachineLearningwithoneAPI](https://github.com)\\\
    >\n\n![](images/inline9.1.jpg)![](images/inline9.2.jpg)![](images/inline9.3.jpg)![](images/inline9.4.jpg)![](images/inline9.5.jpg)\n\
    \nWe hope you found that this chapter was also interesting. To complete this field,\
    \ the concepts of boosting and stacking await you in [Chapter 10](#c10.xhtml#c10).\
    \ Let’s progress to that next chapter.\n\n## Resources\n\n*   Vasudevan, S.K.,\
    \ Pulari, S.R., & Vasudevan, S. (2021). Deep Learning: A Comprehensive Guide (1st\
    \ ed.). Chapman and Hall/CRC. [https://doi.org/10.1201/9781003185635](https://doi.org/10.1201/9781003185635).\n\
    \n*   Murphy, K. P. & Bach, F. (2012) Machine Learning: A Probabilistic Perspective.\
    \ Cambridge, MA, MIT Press.\n\n*   [https://www.youtube.com/playlist?list=PL3uLubnzL2Tl-7fugIeCk4-l4HVVdn5\\\
    _v](https://www.youtube.com)\n\n*   [https://www.simplilearn.com/tutorials/machine-learning-tutorial/bagging-in-machine-learning](https://www.simplilearn.com)\n\
    \n*   [https://www.geeksforgeeks.org/bagging-vs-boosting-in-machine-learning/](https://www.geeksforgeeks.org)\n\
    \n*   [https://www.javatpoint.com/bias-and-variance-in-machine-learning](https://www.javatpoint.com)\n\
    \n## 9.10 Key Points to Remember\n\n1.  The ensemble model brings the concept\
    \ of combining multiple models to improve the predictability of models.\n\n2.\
    \  Ensemble methods are commonly used for regression and classification.\n\n3.\
    \  Ensemble learning is basically divided into homogeneous or heterogeneous.\n\
    \n4.  Bagging, otherwise known as bootstrap aggregating, is a homogeneous ensemble\
    \ technique.\n\n5.  Bagging has the capability to reduce bias and variance for\
    \ an optimized prediction model.\n\n6.  Bagging has three steps, mainly bootstrapping,\
    \ parallel training and aggregations.\n\n7.  Bagging is used to reduce variance\
    \ without increasing bias.\n\n8.  Bagging is easy to implement and can work well\
    \ with high-dimensional data.\n\n9.  Bagging is less flexible and it is very difficult\
    \ to interpret the insights.\n\n10.  Random forest uses bagging and is an extension\
    \ of the bagging technique.\n\n11.  Bagging is computationally expensive.\n\n\
    12.  Healthcare, the financial industry, fraud detection, credit card frauds,\
    \ remote sensing, network intrusion detections, bioinformatics, land cover mapping,\
    \ masonry structures, etc. are specific areas of research where bagging is used.\n\
    \n13.  Bagging can prevent overfitting by reducing the bias and variance trade-off.\n\
    \n     The following points are taken from the article: [https://www.javatpoint.com/bias-and-variance-in-machine-learning](https://www.javatpoint.com)\
    \ and found useful to improve understanding.\n\n14.  High bias/low variance (underfitting):\
    \ predictions are consistent, but inaccurate on average. This can happen when\
    \ the model uses very few parameters.\n\n15.  High bias/high variance: predictions\
    \ are inconsistent and inaccurate on average.\n\n16.  Low bias/low variance: it\
    \ is an ideal model, but we cannot achieve this.\n\n17.  Low bias/high variance\
    \ (overfitting): predictions are inconsistent and accurate on average. This can\
    \ happen when the model uses a large number of parameters.\n\n## Quiz Questions\
    \ (Answer It Yourself, Folks)\n\n1.  What is ensemble learning?\n\n2.  List the\
    \ types of ensemble learning.\n\n3.  What is bagging?\n\n4.  What are the major\
    \ steps involved in bagging?\n\n5.  Why is bagging important?\n\n6.  What is the\
    \ major relationship between bagging and variance?\n\n7.  State the major applications\
    \ of Bagging.\n\n8.  Can you elaborate on the advantages of bagging?\n\n9.  Can\
    \ you explain the major disadvantages of bagging?\n\n10.  List a few applications\
    \ of bagging.\n\n# 10 Boosting and Stacking\n"
  trans: "\n# 9 自助聚合\n\n在组合器/集成模型处进行多数投票以实现优化的预测。每个基础学习器都单独应用于自助训练样本。也就是说，它们彼此独立训练。在自助聚合过程中使用的每个模型都被赋予相同的权重。自助聚合对于回归和分类问题都很重要。决策树通常使用自助聚合。这是因为准确率得到提高，降低了方差，从而消除了过拟合问题。随机森林使用自助聚合，其中在每个自助样本中使用特征子集，如图\
    \ 9.5 所示。本书第 8 章的第 8.4 节已涵盖此主题，见第 8 章。\n\n![图 9.5 随机森林。](img/fig9.5.jpg)\n\n**图\
    \ 9.5** 随机森林。\n\n在上面的示例中，我们可以看到随机森林集成学习方法是对决策树的扩展。每棵树都会产生一个输出，该输出被输入到随机森林集合中。这会产生一个期望的输出，其中会注意到多数输出。这有助于确定输出。从上面的示例可以清楚地看出，随机森林算法基本上使用一组决策树。它们的输出被汇总为最终预测。它们具有限制过拟合的能力，从而降低偏差和方差。\n\
    \n## 9.6 方差与自助聚合 – 主要关联\n\n自助聚合主要与决策树模型一起使用，后者是高方差模型。与低方差的线性回归模型相比，自助聚合在这些模型上效果很好。然而，当对高偏差模型执行自助聚合时，准确性会有所妥协。自助聚合用于降低方差而不增加偏差。这意味着训练集的微小变化会导致预测的巨大变化。自助聚合使用具有不同均值和标准差的单个模型或基础学习器。然后，它们被汇总以获得最终预测。只有当我们尝试实现并比较有无自助聚合时的性能时，才能理解这一点，我们将在即将到来的实现第\
    \ 9.9 节中看到。\n\n## 9.7 自助聚合的主要优势和挑战\n\n自助聚合有许多优点和挑战。其中，有一些值得提及。它们总结如下：\n\n主要优势是，\n\
    \n1.  由于 scikit-learn 或 sklearn 提供的 Python 库，自助聚合易于实现。将多个基础学习器的预测结果结合起来以提高模型的性能，这正是它真正发挥作用的地方。\n\
    \n2.  自助聚合适用于高维数据。如果您拥有大量缺失值的高维数据，这可能会导致高方差，从而导致整体过拟合和不准确的预测。如果在这种情况下使用自助聚合，它可以降低方差。\n\
    \n自助聚合的主要挑战包括：\n\n1.  1\\. 通过自助聚合推断和解释实时业务洞察非常困难。这是因为在自助聚合过程结束时取平均值或组合预测。\n\n\
    2.  2\\. 自助聚合涉及多个模型且变得更加密集，使其计算成本高昂。\n\n3.  3\\. 自助聚合方法适用于那些稳定性较差的算法，使其灵活性降低。\n\
    \n## 9.8 自助聚合的应用\n\n自助聚合的主要应用包括医疗保健、金融行业、欺诈检测、信用卡欺诈、遥感、网络入侵检测、生物信息学、地表覆盖制图、砌体结构等。\n\
    \n## 9.9 实现示例\n\n我们使用葡萄酒质量数据集来实现自助聚合。在这里，通过自助聚合，我们将葡萄酒分类为红酒或白酒。该数据集具有化学指标和质量指标，可用于确定葡萄酒的类别。可以在图\
    \ 9.6 中快速查看数据集的外观。\n\n![图 9.6 葡萄酒质量数据集。](img/fig9.6.jpg)\n\n**图 9.6** 葡萄酒质量数据集。\n\
    \n实现已完成，代码在 Intel DevCloud 上运行。代码逐行解释，执行结果也在下面呈现。此外，代码连同数据集一起在 GitHub 上提供：[`github.com/shriramkv/MachineLearningwithoneAPI`](https://github.com)\\\
    >\n\n![](img/inline9.1.jpg)![](img/inline9.2.jpg)![](img/inline9.3.jpg)![](img/inline9.4.jpg)![](img/inline9.5.jpg)\n\
    \n我们希望您也觉得本章很有趣。为了完成这一领域，第 10 章中等待着您的是提升和堆叠的概念。让我们继续下一章。\n\n## 资源\n\n*   Vasudevan,\
    \ S.K., Pulari, S.R., & Vasudevan, S. (2021). Deep Learning: A Comprehensive Guide\
    \ (1st ed.). Chapman and Hall/CRC. [`doi.org/10.1201/9781003185635`](https://doi.org/10.1201/9781003185635).\n\
    \n*   Murphy, K. P. & Bach, F. (2012) Machine Learning: A Probabilistic Perspective.\
    \ Cambridge, MA, MIT Press.\n\n*   [`www.youtube.com/playlist?list=PL3uLubnzL2Tl-7fugIeCk4-l4HVVdn5\\\
    _v`](https://www.youtube.com/playlist?list=PL3uLubnzL2Tl-7fugIeCk4-l4HVVdn5\\\
    _v)\n\n*   [`www.simplilearn.com/tutorials/machine-learning-tutorial/bagging-in-machine-learning`](https://www.simplilearn.com)\n\
    \n*   [`www.geeksforgeeks.org/bagging-vs-boosting-in-machine-learning/`](https://www.geeksforgeeks.org)\n\
    \n*   [`www.javatpoint.com/bias-and-variance-in-machine-learning`](https://www.javatpoint.com)\n\
    \n## 9.10 需要记住的关键点\n\n1.  集成模型带来了结合多个模型以提高模型可预测性的概念。\n\n2.  集成方法通常用于回归和分类。\n\n\
    3.  集成学习基本上分为同质或异质。\n\n4.  自助聚合，也称为自助采样聚合，是一种同质集成技术。\n\n5.  自助聚合具有降低偏差和方差以实现优化预测模型的能力。\n\
    \n6.  自助聚合有三个主要步骤：自助采样、并行训练和聚合。\n\n7.  自助聚合用于降低方差而不增加偏差。\n\n8.  自助聚合易于实现，并且可以很好地处理高维数据。\n\
    \n9.  自助聚合灵活性较差，很难解释其洞察。\n\n10.  随机森林使用自助聚合，是自助聚合技术的扩展。\n\n11.  自助聚合计算成本高。\n\n\
    12.  医疗保健、金融行业、欺诈检测、信用卡欺诈、遥感、网络入侵检测、生物信息学、地表覆盖制图、砌体结构等是自助聚合被使用的特定研究领域。\n\n13.\
    \  自助聚合可以通过减少偏差和方差的权衡来防止过拟合。\n\n     以下要点摘自文章：[`www.javatpoint.com/bias-and-variance-in-machine-learning`](https://www.javatpoint.com)\
    \ 并被认为有助于提高理解。\n\n14.  高偏差/低方差（欠拟合）：预测结果一致，但平均不准确。当模型使用非常少的参数时可能会发生这种情况。\n\n15.\
    \  高偏差/高方差：预测结果不一致且平均不准确。\n\n16.  低偏差/低方差：这是一个理想的模型，但我们无法实现。\n\n17.  低偏差/高方差（过拟合）：预测结果不一致且平均准确。当模型使用大量参数时可能会发生这种情况。\n\
    \n## 测验问题（自己回答吧，朋友们）\n\n1.  什么是集成学习？\n\n2.  列出集成学习的类型。\n\n3.  什么是自助聚合？\n\n4. \
    \ 自助聚合涉及的主要步骤是什么？\n\n5.  为什么自助聚合很重要？\n\n6.  自助聚合与方差之间存在什么主要关系？\n\n7.  说明自助聚合的主要应用。\n\
    \n8.  你能详细说明自助聚合的优点吗？\n\n9.  你能解释自助聚合的主要缺点吗？\n\n10.  列出自助聚合的几个应用。\n\n# 10 提升与堆叠\n"
