    4.  什么是监督学习？你能举例说明吗？

    5.  什么是无监督学习？你能举例说明吗？

    6.  什么是强化学习？你能举例说明吗？

    7.  为什么需要机器学习？

    8.  你能详细说明机器学习框架吗？

