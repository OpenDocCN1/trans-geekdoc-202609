    本章将探讨 Pandas、数据框以及用于输出可视化的库。 选择 Python 有很多原因：两个很好的原因是“资源可用性”和“社区连接”。 读者将通过相关示例以及同时呈现的结果来学习理解概念。


    ## 5.2 本章使用什么？


    本章将向读者介绍以下工具集。它们易于使用且肯定有趣可学。

    *   `Jupyter Notebooks`: 这是目前用于交互式编程和输出可视化的最常见工具之一，易于使用和学习。现已集成到 Intel DevCloud
    中，我们已在 第 3 章 详细讨论过。读者如有需要可重温本章。

    *   `NumPy, Pandas`: 这些是充分利用所进行数值计算的关键。

    *   `Matplotlib, Seaborn`: 当谈到输出可视化时，最简单且最有效的方法是使用 Matplotlib/Seaborn。两者都非常知名，并在全球数据科学家中广泛使用。


    本章将通过示例和练习阐明所有这些内容。敬请关注。现在是时候实践了。


    ## 5.3 让我们学习 Pandas


    好吧，Pandas 很棒。它快速、强大且灵活。 它非常容易学习和使用。 它是一个基于 Python 构建的开源数据处理和分析工具。 实际上，Pandas 包含大量极其有用的功能。
    即使处理复杂数据，选择 Pandas 也显得更容易。 最重要的是，访问统计函数、可视化等始终变得容易得多。 这很有趣，本节将使读者能够理解 Pandas。
    可以访问官方 Pandas 网站 @ [`pandas.pydata.org/`](https://pandas.pydata.org)


    请记住这一点。


    Pandas 实际上是 Panel Datasets 的缩写。数据始终以具有行和列的表格格式引用。


    ### 5.3.1 让我们安装


    很简单。你需要已安装 Python（最新版本）和 Anaconda。这会让生活更轻松。 按照下面介绍的步骤操作，将有助于轻松安装 Pandas。


    转到 Anaconda Prompt（必须理解 Anaconda Prompt 与命令提示符不同）。 可以参考下面 图 5.1 中展示的屏幕截图，其中显示了
    Anaconda Prompt。 如果你使用的是 Intel DevCloud，可以直接通过 DevCloud 使用 Jupyter Notebook 安装。


    ![图 5.1 Anaconda 提示符。](img/fig5.1.jpg)


    **图 5.1** Anaconda 提示符。


    可以通过 Anaconda Prompt 使用命令 Jupyter Lab 启动 Jupyter Notebook。 可以参考 图 5.2 来了解此步骤，这将使你能够启动
    Python Notebook。 就这样。你将获得笔记本以输入代码，如 图 5.3 所示。


    ![图 5.2 启动 Jupyter Lab。](img/fig5.2.jpg)


    **图 5.2** 启动 Jupyter Lab。


    ![图 5.3 笔记本。](img/fig5.3.jpg)


    **图 5.3** 笔记本。

