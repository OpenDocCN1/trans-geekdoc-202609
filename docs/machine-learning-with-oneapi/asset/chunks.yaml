    reader. It’s time for the reader to start to practice. Ready, Get Set, Pandas!


    We hope you readers enjoy learning the contents of this chapter. Supervised learning
    awaits you in the next chapter. Let’s carry on!


    ## Resources


    *   [https://youtu.be/bzaO9SFHJSA](https://youtu.be)


    *   [https://youtu.be/VnkfaI9tG4M](https://youtu.be)


    *   [https://youtu.be/xXOPfrba8I0](https://youtu.be)


    *   [https://pandas.pydata.org/](https://pandas.pydata.org)


    *   [https://seaborn.pydata.org/](https://seaborn.pydata.org)


    *   [https://matplotlib.org/](https://matplotlib.org)


    ## 5.5 Key Points to Remember


    *   One of the most common tools used today for interactive coding and visualization
    of output is the Jupyter Notebook.


    *   NumPy and Pandas are the key for the reader to get the best of the numerical
    computations carried out.


    *   The simplest and the most effective approach to visualization is to use Matplotlib/Seaborn.


    *   Pandas is fast, powerful, and flexible as well. It is very easy to learn and
    use. It is open-source data manipulation and analysis tool which is built above
    python.


    *   Pandas is an abbreviation for the Panel Datasets. The data are always referred
    to in the tabular format which has rows and columns.


    *   Operations with the Pandas series are very easy and fun.


    *   Handling missing data is a paramount task with the data. Data imputation is
    the simplest way which experts follow to handle missing data. Imputation is the
    process of replacing missing data with substituted values.


    *   Data visualization is an important aspect of data analytics. Matplotlib and
    Seaborn provide you with support for better visualization experiences.


    # 6 Supervised Learning


    DOI: [10.1201/9781003393122-6](https://doi.org/10.1201/9781003393122-6)


    ## Learning Objectives


    After reading this chapter, the reader should be able to understand the following:


    *   What is supervised learning?


    *   Types of supervised learning algorithms.


    *   What is regression?


    *   Where is regression useful?


    *   Steps in regression.


    *   Implementation of regression.


    *   Logistic regression.


    *   Linear *vs* logistic regression.


    *   What is classification?


    *   K-nearest neighbors (KNN) – steps.


    *   Implementation of KNN.


    *   Loss and cost function, bias and variance trade-off, regularization, feature
    selection, hyperparameter tuning.


    ## 6.1 Introduction


    So, we are back to square one, with the concept of supervised learning. If anyone
    has skipped [Chapter 4](#c4.xhtml#c4), we highly recommend you to take some time
    to go through the real-time examples of supervised learning and then head toward
    this chapter.


    Supervised learning algorithms take a dataset, build a model using the training
    dataset and validate them using the test dataset and predict or classify the results.
    The accuracy of the model can be calculated so that we can have a good understanding
    of the model that we have used for prediction or classification purposes. If required,
    we can also have feedback to improve the process.


    ## 6.2 Types of Supervised Learning Algorithms


    Supervised learning algorithms are mainly categorized as regression algorithms
    and classification algorithms ([Figure 6.1](#c6.xhtml#f6.1)). An email spam classifier
    is an example of a classification algorithm.


    ![Figure 6.1 Types of supervised learning algorithms.](images/fig6.1.jpg)


    [**Figure 6.1**](#c6.xhtml#re_f6.1) Types of supervised learning algorithms.


    ### 6.2.1 Classification


    Supervised learning, as you will know by now, can be seen employed quite often
    in our day-to-day lives. Will there be a single person who doesn’t open his Gmail
    inbox in a day? Even our kids need Gmail access for accessing Google classrooms.
    The inbox of Gmail is bombarded with advertisements and spam emails. Yes, I am
    coming to this spam classifier ([Figure 6.2](#c6.xhtml#f6.2)). If Gmail didn’t
    offer this spam classification, I couldn’t even imagine how many more emails I
    would have to manually classify. Hence, when we look around, we use supervised
    learning algorithms knowingly or unknowingly.


    ![Figure 6.2 Spam email classifier.](images/fig6.2.jpg)


    [**Figure 6.2**](#c6.xhtml#re_f6.2) Spam email classifier.


    The major intention of this chapter is to introduce you with the various types
    of supervised learning algorithms. We mainly focus on regression and classification.
    This chapter is not comprehensive as these are very large topics with lots of
    research being carried out. However, we will strive to make you understand how
    to implement simple linear regression and simple KNN classification algorithms.
    Only when we make our hands dirty, will we learn more! Isn’t that true? Yes, come
    on, let’s dive in together for a deeper learning experience.


    Say you have always noticed how your parents were busy making ends meet and following
    the traditional dreams laid out by society (at least a few parents![](images/inline4.1.jpg)).
    They might be always busy making money for your fees and the ultimate goal for
    all parents is to own a house. You may have noticed at one stage, when they decided
    to buy a house, that they were calling all the broker agents, going to the house/land
    sites directly and making enquiries to neighbors to pay the best price for the
    plot where they are looking to build their dream house. At times, if the parents
    are busy, they will finally decide to buy an already-built house. However, if
    we had our way, house price prediction would have been a great help for our parents.
    This is actually an example for regression, where we deal with continuous target
    variables.


    ### 6.2.2 Regression


    Regression algorithms mainly deal with predictive applications like stock market
    predictions, prediction of an employee’s salary, prediction of house prices, etc.
    If you carefully look at these, you would find that there is a single target variable
    that is related to several independent variables. In other words, regression algorithms
    help us to find the relationship between a dependent (target) variable and several
    independent variables (predictors).


    Now to make you understand how regression analysis is part of supervised learning,
    keeping in mind that regression analysis starts with a dataset where the target
    attribute is known or labeled. Supervised learning is thus based on labeled data.


    To make it clear, say, when the variable of a dataset is completely numerical
    and the target variable is numerical, then the regression analysis will predict
    a number. For example, a regression model can predict house prices, if we have
    observations of houses over a certain period of time. House variables may include
    house area (square meters), number of bedrooms, number of bathrooms, garage space,
    number of floors, building materials, close proximity to resources such as schools,
    shops, facilities, etc. which are the independent predictors. Regression model
    predicts the target variable – house price – based on the linear relationship
    between house price and a combination of these predictors.


    ## 6.3 Applications Where Regression Is Useful?


    ### 6.3.1 Trend Analysis


    Regression is mainly useful in application areas like trend analysis. Have you
    ever used Google Trends? If not, it is something which has to be tried for sure.
    Google Trends brings in the most popular search query trends and is mainly used
    by forecasters and academics for prediction-based analyses. The major data used
    by Google Trends are the daily searches people make in the Google search engine.
    The main plus point is that it can locate outliers or irregular spam search activity.
    Google trends analyses operate by regression modeling, while searching for join
    points.


    During the recently concluded 2022 FIFA Men’s World Cup event, you could imagine
    the search trends of the word “World Cup”; this basically works by regression
    analysis, using one of the techniques listed below ([Figure 6.3](#c6.xhtml#f6.3)).'
