    ## 12.2 What Is OpenVINO?


    OpenVINO (Open Visual Inference and Neural Network Optimization) is a cross-platform
    deep learning toolkit developed by Intel. It focuses on optimizing neural network
    inference with a write-once, deploy-anywhere approach for Intel hardware platforms.
    The toolkit is free for use and has two versions: OpenVINO toolkit, which is supported
    by the open-source community, and the Intel Distribution of OpenVINO toolkit,
    which is supported by Intel. By using the OpenVINO toolkit, software developers
    can select models and deploy pre-trained deep learning models (YOLO v3, ResNet
    50, etc.) through a high-level C++ Inference Engine API integrated with application
    logic. A pre-trained model denotes a model created by someone and trained on a
    large dataset to solve a similar problem that can be used as a starting point,
    instead of building a model from scratch.


    YOLOv3 (You Only Look Once, Version 3) is a real-time object detection algorithm
    that identifies specific objects in videos, live feeds or images. The YOLO machine
    learning algorithm makes use of the features learned by a deep CNN (Convolutional
    Neural Network) for object detection. ResNet, which stands for Residual Network,
    is a specific type of CNN and is generally used to power computer vision applications.
    ResNet-50 is a CNN that is 50 layers deep, and it achieves greater accuracy.


    OpenVINO provides integrated functionalities for accelerating the development
    of applications and solutions that solve several tasks, using computer vision,
    automatic speech recognition, natural language processing, recommendation systems,
    machine learning and more.


    ### 12.2.1 Why Use OpenVINO?'
