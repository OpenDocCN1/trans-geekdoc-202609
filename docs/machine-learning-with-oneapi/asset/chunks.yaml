    ## 12.2 什么是 OpenVINO？


    OpenVINO（Open Visual Inference and Neural Network Optimization）是由 Intel 开发的跨平台深度学习工具包。它专注于针对
    Intel 硬件平台采用一次编写、随处部署的方法优化神经网络推理。该工具包可免费使用，并有两个版本：由开源社区支持的 OpenVINO 工具包，以及由 Intel
    支持的 Intel Distribution of OpenVINO toolkit。 通过使用 OpenVINO 工具包，软件开发人员可以选择模型并通过与应用程序逻辑集成的<|message|>
    高级 C++ Inference Engine API 部署预训练的深度学习模型（YOLO v3、ResNet 50 等）。预训练模型是指由某人创建并在大型数据集上训练以解决类似问题的模型，可用作起点，而无需从头构建模型。


    YOLOv3（You Only Look Once，版本 3）是一种实时目标检测算法，可在视频、实时流或图像中识别特定对象。YOLO 机器学习算法利用深度
    CNN（卷积神经网络）学习到的特征进行目标检测。ResNet 代表残差网络，是一种特定的 CNN，通常用于驱动计算机视觉应用。ResNet-50 是一个 50
    层深的 CNN，并且具有更高的准确性。


    OpenVINO 提供了集成功能，用于加速使用计算机视觉、自动语音识别、自然语言处理、推荐系统、机器学习等解决多个任务的应用程序和解决方案的开发。


    ### 12.2.1 为什么使用 OpenVINO？

