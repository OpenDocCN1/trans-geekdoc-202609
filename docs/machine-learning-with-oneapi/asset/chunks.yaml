    ## 6.5 Classification – A Must-Know Concept


    The first question that normally arises is: What is the difference between regression
    and classification? We shall let the reader understand this point first.


    Well, to start with, regression and classification both come under supervised
    learning algorithms! (Yes, supervised, labeled). Both these have extensive usage
    in machine learning and both use the labeled dataset. Then, where do they differ?
    The problems that they solve are different and that defines their difference.


    As discussed, regression predicts continuous variables, such as salary, marks,
    age etc. Classification classify variables like male/female, pass/fail, false/true,
    spam/legitimate etc. (It classifies, that’s it.) Classification divides the given
    dataset into classes based on the parameters considered. An example will be very
    helpful.


    Gmail is the best example. Gmail classifies email as legitimate or spam. The model
    is trained with millions of emails and takes many parameters into consideration.
    Whenever a new email pops up, the classification shall be done as “Inbox, Spam,
    Promotions or updates.” If spam, it goes to spam box. If legitimate, it goes to
    Inbox.


    There are many famous and frequently used classification algorithms:

    * Support Vector Machines (`SVM`)

    * K-Nearest Neighbors

    * Kernel SVM

    * Logistic Regression

    * Naïve Bayes

    * Decision Tree Classification

    * Random Forest Classification


    It is good to understand and learn all of these. But it would be beyond the scope
    of this book. So, we select K-Nearest Neighbors (`KNN`) and Support Vector Machines
    (`SVM`) for further discussion.


    ### 6.5.1 K-Nearest Neighbor (`KNN`)


    `KNN` is one of the easiest and most frequently used approaches, like `SVM`. `KNN`
    is also based on supervised learning algorithms. It is based on a very simple
    approach. Based on history, the current case is predicted, i.e., when the new
    data are sent in for classification, based on the similarity of data available
    in the past, the new one gets classified, i.e., the most similar category will
    be found and the new data entry shall be classified into that.


    Simply speaking, new data can be classified with ease into the most similar category
    with `KNN` in place.


    The next question would be, where can we use `KNN`? It has been used for classification
    and regression. But, like `SVM`, `KNN` works better when used with classification
    and hence is used preferentially for classification.


    `KNN` has two very important characteristics:

    * 1.It is referred as non-parametric.

    * 2.It is also said to be lazy learner algorithm.


    It is important to understand what non-parametric means. It means the algorithm
    does not make any assumptions on the characteristics underlying the data.


    Next, what is lazy learning? Nothing happens immediately in this approach. “Lazy
    learner” means that the algorithm does not learn anything from the training dataset
    at that instance. But it stores the entire dataset during the classification and
    then does the action on the dataset. It infers that there is no specialized training
    phase and uses all the data for training while classification is underway.


    As ever, an example would be useful. If someone wants to classify a fruit, such
    as an orange, when the input is sent in, the algorithm works with the similarity
    concept. Based on the similarly of the features, it would then classify the fruit
    as an orange or not.


    In the `KNN`, remember, `K` is the king. Data scientists have preferred `K` to
    be an odd number when the classes are even. `K` could be 1, 3, 5 or 7 when there
    are two classes. One should also note that, when `K` = 1, it is the nearest neighbor
    algorithm.


    It is now time to approach `KNN` step by step:

    * Can we select the number `K` of the neighbors? Yes, it is the first step.

    * One should calculate the Euclidean distance of the number `K` of the neighbors

    Then, take the `K` nearest neighbors as per the calculated Euclidean distance.

    * Start counting. Among these `K` neighbors, count the number of data points in
    each category.

    * Assign the new data points to the category for which the number of the neighbors
    is highest.

    * The model is ready.


    An example will be very handy and make it easier to understand. One can have a
    look at [Figure 6.18](#c6.xhtml#f6.18).


    ![Figure 6.18 The assumed scenario.](images/fig6.18.jpg)


    [**Figure 6.18**](#c6.xhtml#re_f6.18) The assumed scenario.


    The problem statement is presented pictorially in [Figure 6.19](#c6.xhtml#f6.19),
    where the new data entry has to be classified as a red star or a green triangle.


    ![Figure 6.19 The assumed scenario – with a new entrant.](images/fig6.19.jpg)


    [**Figure 6.19**](#c6.xhtml#re_f6.19) The assumed scenario – with a new entrant.


    #### Case 1 – When `K` is Chosen to be 1


    If `K` is chosen as 1, then the task becomes easier, and this is the simplest
    option. The input data get classified as Class A. One can easily understand this
    from [Figure 6.20](#c6.xhtml#f6.20).


    ![Figure 6.20 Case 1: K = 1.](images/fig6.20.jpg)


    [**Figure 6.20**](#c6.xhtml#re_f6.20) Case 1: K = 1.


    #### Case 2 – When `K` is Chosen to be 3


    Let us calculate the Euclidean distance between the data points when `K` is chosen
    as 3. The Euclidean distance is the distance between two points (can be done through
    other methods also; Python has in-built functions to help the programmers). One
    could have a look at [Figure 6.21](#c6.xhtml#f6.21) to understand how `KNN` works
    when the `K` value is chosen to be 3.


    ![Figure 6.21 Case 2: K = 3.](images/fig6.21.jpg)


    [**Figure 6.21**](#c6.xhtml#re_f6.21) Case 2: K = 3.


    #### Case 3 – When `K` is Chosen to be 7


    Here is the scenario when `K` is set as 7. One can understand how this works by
    referring to [Figure 6.22](#c6.xhtml#f6.22).


    ![Figure 6.22 Case 2: K = 7.](images/fig6.22.jpg)


    [**Figure 6.22**](#c6.xhtml#re_f6.22) Case 2: K = 7.


    By now, the reader will have understood the way that `KNN` works. One must make
    a note that “Keeping low `K` values should be avoided as the prediction could
    go wrong.”


    #### Advantages

    * Simple.

    * The more data, the better the classification.


    #### Disadvantage

    * Finding the optimum value for `K` is challenging.


    One can listen to a brief note on `KNN` from the authors by listening to [https://youtu.be/nVgZbVUmh50](https://youtu.be).


    ### 6.5.2 Implementation of KNN

