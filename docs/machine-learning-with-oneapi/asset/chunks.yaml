    # 4 What Is Machine Learning?An Introduction!


    DOI: [10.1201/9781003393122-4](https://doi.org/10.1201/9781003393122-4)


    ## Learning Objectives


    After reading this chapter, the reader should be able to understand the following:

    * What is machine learning?

    * Relationship between artificial intelligence (AI), machine learning (ML) and
    deep learning DL).

    * Types of machine learning.

    * Need for machine learning.

    * The machine learning framework.

    * Machine learning *vs* deep learning.

    * Machine learning applications.


    ## 4.1 Introduction


    The term machine learning (ML), belonging to the research field of Artificial
    Intelligence (AI), has been buzzing around us for quite a few decades. Most of
    us have already carried out some attempts to understand “what the word level abstract
    meaning is,” at least by performing a Google search. Even if you have not done
    that, don’t worry: you are in the right place to learn in-depth about “What is
    machine learning?” from a technical perspective. The intention of this chapter
    doesn’t stop there – we will dive a little deeper to understand the various types
    of machine learning, its application to real-life scenarios and the differences
    between ML and Deep Learning (DL).


    ## 4.2 What Is Machine Learning?


    Okay, let’s start by taking you back to your memorable childhood. Do you ever
    remember how many times you fell before you started walking properly? Oh, that’s
    a pretty old memory for you to recollect, probably we should direct this question
    to your parents. Let’s consider an example that you might remember even now. Every
    one of us had a favorite kindergarten teacher, who was so sweet and patient to
    us. Yes, I used the word “patient” intentionally. You know why! I still remember
    the way my KG teacher taught me what an apple was. She literarily brought the
    real apple and handed it over to me, asked me to play with it to experience and
    tell me that was an apple. In fact, she did this for almost a week.


    ![Figure 4.1 Teacher showing (training) the student for a week “what is an apple?”](images/fig4.1.jpg)


    **Figure 4.1** Teacher showing (training) the student for a week “what is an apple?”


    Next week, she brought a tomato and an apple and asked me to tell her which one
    was the apple. I was able to correctly point out the apple without any hesitation.


    ![Figure 4.2 Teacher testing the student if they correctly recognize the apple.](images/fig4.2.jpg)


    **Figure 4.2** Teacher testing the student if they correctly recognize the apple.


    Now let’s come to the point: what do you think the teacher did to make the student
    recognize it so well! Yes, the teacher patiently *trained* the student with an
    original apple for a week and the features of the apple, such as its red color,
    round shape and its internal properties of being white and hard inside, all having
    been registered properly by experiencing it. This collective intelligence gathered
    by the student helped to recognize the apple from a different fruit, like a tomato,
    during the *testing* phase. (By the way, we haven’t conveyed anything wrong! Tomatoes
    are fruits that are considered vegetables by nutritionists, as suggested by Britannica.com
    ![](images/inline4.1.jpg).)


    So, let’s discuss again the question we started with: “What is machine learning?”
    How is it even relevant to the example given above? Now, carefully answering this
    question, by the meaning of “machine learning,” we are trying to make a machine
    learn. Yes, we feed already-known data into a machine and *train* them. Once the
    machine is trained appropriately, we will ***test*** the machine to see whether
    the machine is able to provide the appropriate answers with the help of the training
    data. We can keep training the machine till it provides us with the most optimized
    results.


    Oh, that’s all, isn’t it? Machine learning is all simple now and makes sense.

