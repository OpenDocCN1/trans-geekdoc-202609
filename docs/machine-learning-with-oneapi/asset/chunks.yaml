    ### Intel® C++ Compiler Classic


    The installation procedure is almost the same as discussed earlier for the Intel
    oneAPI Base Toolkit. However, the installable is to be downloaded from the link
    [https://www.intel.com/content/www/us/en/developer/tools/oneapi/iot-toolkit-download.html](https://www.intel.com).


    ### Intel oneAPI Rendering Kit


    This kit is for the creative folks. Yes, the guys working on the visualization
    and related areas can use this kit to create performant, high-fidelity visualization
    applications. The toolkit is very interesting for developers to use and develop
    stunning results, and it contains a handful of tools as listed below:

    * Embree

    * Implicit SPMD Program Compiler

    * Open Volume Kernel Library

    * Open Image Denoise

    * OpenSWR

    * OSPRay

    * OSPRay Studio

    * OSPRay for Hydra

    * Rendering Toolkit Utilities


    The installation procedure will take almost as long as that for the Intel oneAPI
    Base Toolkit. However, the installable is to be downloaded from the link: [https://www.intel.com/content/www/us/en/developer/tools/oneapi/rendering-toolkit-download.html](https://www.intel.com).


    ### Intel AI Analytics Toolkit


    This is one of the best toolkits, and industry is already heaping accolades onto
    this toolkit. With this toolkit in place, one could accelerate machine learning
    and data science pipelines with optimized DL (Deep Learning) frameworks and high-performing
    Python libraries. This toolkit is very powerful and full of resources. The toolkit
    comes with the following tools:

    * Intel Optimization for TensorFlow

    * Intel Optimization for PyTorch

    * Intel Distribution for Python*

    * Intel Distribution of Modin (available through Anaconda only)

    * Model Zoo for Intel Architecture

    * Intel Low-Precision Optimization Tool


    One can download the AI Analytics Toolkit at the link: [https://www.intel.com/content/www/us/en/developer/tools/oneapi/ai-analytics-toolkit-download.html?operatingsystem=linux&distributions=zypperpackagemanager](https://www.intel.com).


    ### Intel OpenVINO


    This is one of the finest toolkits. It is Open Visual Inferencing and Neural Network
    Optimization. One can develop and deploy high-performance inference and applications
    from edge to cloud with OpenVINO. OpenVINO can be downloaded and installed seamlessly
    with the guidelines and installable provided at [https://www.intel.com/content/www/us/en/developer/tools/openvino-toolkit/overview.html](https://www.intel.com).


    ![Figure 2.15 The oneAPI toolkits (some are powered by oneAPI).](images/fig2.15.jpg)


    **Figure 2.15** The oneAPI toolkits (some are powered by oneAPI).


    The greatest advantage of all these toolkits is that they are free to use and
    easy to learn. The toolkits can be installed for Windows, Linux, or Mac OS. Also,
    if the developer wishes to use the DevCloud, it is also possible and requires
    no installation or any additional downloads. It is easy to develop and results
    are available instantaneously.


    The next appreciable advantage is that there are so many tutorials and learning
    materials made available for beginners. Many case studies are presented to ensure
    progressive learning as well.


    Well, we honestly hope the readers will have enjoyed exploring these toolkits.
    Let’s move on to the next chapter to learn more details about the DevCloud, along
    with its features, power, etc.


    ## Resources

    * [https://www.intel.com/content/www/us/en/developer/tools/oneapi/overview.html#gs.3otusu](https://www.intel.com)

    * [https://www.intel.com/content/www/us/en/developer/tools/oneapi/toolkits.html#gs.kfp7z3](https://www.intel.com)

    * [https://youtu.be/FdntPy1cCKo](https://youtu.be)

    * [https://youtu.be/_y4bPjj8Gv4](https://youtu.be)


    ## 2.2 Key Points to Remember

    1. Each oneAPI toolkit comes with a bundle of tools.

    2. The oneAPI toolkits can be installed directly onto the machine with the guidelines
    provided or one can develop applications with the DevCloud.

    3. The DevCloud enables developers to develop applications with ease without any
    installations or configurations.

    4. The oneAPI Base Toolkit has a pack of high-performance tools for building applications
    with C++, DPC++.

    5. With the oneAPI HPC Toolkit, one can build and deliver fast Fortran, OpenMP
    and MPI applications that combine high-performance computing applications with
    cutting-edge techniques.

    6. Visualization and related areas can use the oneAPI Rendering Toolkit to create
    performant, high-fidelity visualization applications.

    7. With the AI Analytics Toolkit in place, one can accelerate machine learning
    and data science pipelines with optimized DL frameworks and high-performing Python
    libraries.

    8. One can develop and deploy high-performance inference and applications from
    edge to cloud with the OpenVINO Toolkit.


    ## Quiz

    1. Explain the need for someone to opt for the Intel oneAPI Base Toolkit.

    2. What are the features that one could get by opting for the Intel IoT Toolkit?

    3. Mention the names of the libraries/packages that come with the Intel oneAPI
    AI analytics toolkit.

    4. Which toolkit would be handy for developers working on visualization applications?

    5. If someone is working on HPC applications, which toolkit would be most helpful
    for them?


    # 3 The Intel DevCloud and Jupyter Notebooks


    DOI: [10.1201/9781003393122-3](https://doi.org/10.1201/9781003393122-3)


    ## Learning Objectives


    After reading this chapter, the readers should be able to understand the following:

    * Power of DevCloud

    * Registration process

    * Jupyter Notebook and DevCloud

    * DevCloud Commands


    ## 3.1 Introduction


    This chapter will provide a lot of insights into the fundamentals of Intel DevCloud.
    Also, the Jupyter Notebook is integrated with DevCloud, making learning and usage
    much easier for software developers. It is expected that readers should create
    an Intel DevCloud account to try out all the points which are being discussed
    in this chapter.


    ## 3.2 What Is Intel DevCloud?


    The DevCloud is an interesting and powerful sandbox which enables someone to develop,
    test and run the workloads across a range of accelerators which include Intel
    CPUs, GPUs, and FPGAs with the Intel oneAPI software stack.


    It comes with so many features and is power packed. [Figure 3.1](#c3.xhtml#f3.1)
    presents the features of the Intel DevCloud. Coding with the DevCloud is easy,
    without the need to worry about hardware acquisition; more importantly, no installations
    or configurations are required. It also possesses excellent and easy-to-understand
    tutorials for developers. Above all, the support for the Jupyter Notebooks and
    Visual Studio code makes it stand taller than the most sought-after cloud platforms.


    ![Figure 3.1 Intel DevCloud features summarized.](images/fig3.1.jpg)


    [**Figure 3.1**](#c3.xhtml#re_f3.1) Intel DevCloud features summarized.


    One can find a lot of useful information on the Intel DevCloud from the website
    software.intel.com/devcloud/oneapi


    ### 3.2.1 How to Create a DevCloud Account?


    One can follow the step-by-step process presented below to create the DevCloud
    account/access created.

    1. Visit the software.intel.com/devcloud/oneapi website.


    It will prompt you to fill in certain basic information which should not consume
