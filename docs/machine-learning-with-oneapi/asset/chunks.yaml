    # 1 Intel oneAPIAn Introductory Discussion


    DOI: [10.1201/9781003393122-1](https://doi.org/10.1201/9781003393122-1)


    ## Learning Objectives


    After reading this chapter, the reader should be able to understand the following:


    *   Why oneAPI?


    *   What is there for us in oneAPI?


    *   Features and learning resources of oneAPI.


    ## 1.1 Introduction


    What is oneAPI? Well, this is a question asked by many tech enthusiasts, learners,
    teachers, industry practitioners and everyone in the tech space. This chapter
    is intended to provide information as to what oneAPI is all about, why there is
