    ## 学习目标

    阅读本章后，读者应能够理解以下内容：

    * 什么是 Boosting？

    * Boosting 算法的类型。

    * 为什么 Boosting 很重要？

    * 偏差与 Boosting——两者有何关联？

    * Bagging 与 Boosting 的比较。

    * Boosting 的主要应用。

    * Boosting 的主要优势和挑战。

    * 什么是 Stacking？

    * Stacking 算法的类型

    * 为什么 Stacking 很重要？

    * Stacking 的实现


    ## 10.1 引言

    集成方法使用多个模型，并在最后使用一个组合器来决定适用于所使用数据的准确预测方法。是的，有 Bagging、Boosting 和 Stacking 方法可用，我们已在第
    9 章中详细介绍了 Bagging 方法。在本章中，我们将进一步探索集成学习的另外两种技术，即 Boosting 和 Stacking。我们还将在本章中对
    Bagging 和 Boosting 方法进行适当的比较。到本章结束时，您将完全了解为什么机器学习中使用集成学习方法及其重要性。让我们开始吧。


    ## 10.2 什么是 Boosting？

    Boosting 是一种集成学习技术，它使用基学习器的顺序使用方式，而不是像 Bagging 中那样并行使用多个基学习器。我知道，现在看起来有点模糊。让我们深入理解一下。假设您开发了一个可以识别老虎的模型。您的模型已训练用于识别老虎。现在的问题是，模型仅用老虎图像训练，但在某些情况下，它会将家猫误分类为老虎。

    然而，我们的模型必须准确地仅分类老虎。是的，老虎属于猫科，![](img/inline4.1.jpg)我们同意。但我们需要一个特定的老虎分类系统，也许我们正在构建一个系统来识别进入附近社区的老虎，从而在那里引起人类恐慌。在这种情况下，如果我们从远处将一只成年猫误分类为老虎，我们的系统就会失败，如图
    10.1 所示。这里，Boosting 通过以顺序方式训练多个模型来拯救局面，以提高模型对未见数据的准确性。所以，现在您知道 Boosting 可以在哪里被利用。


    ![图 10.1 误分类。](img/fig10.1.jpg)

    **图 10.1** 误分类。


    Boosting 中遵循的顺序过程可以从图 10.2 最好地理解。


    ![图 10.2 Boosting 过程。](img/fig10.2.jpg)

    **图 10.2** Boosting 过程。


    如图 10.2，所示，Boosting 过程中的主要步骤如下：

    了解这一点很重要，该过程是通用的，并且训练过程会根据使用的 Boosting 算法而变化。

    无论如何，继续进行该过程：

    1. 对原始数据样本中的每一个赋予相等权重，并将其输入到 Boosting 算法中的第一个模型中。在此阶段，它对每个数据样本进行预测。通常，它们被称为基算法。所以基本上，基算法预测原始数据集中的每个数据样本。

    2. Boosting 算法根据模型性能分配权重，增加具有更大误差的样本的权重。有许多模型，预测最优化的模型将对最终预测贡献更多。

    3. 这会继续进行，并在每个模型中调整权重。

    4. 步骤 2 和 3 会继续进行，直到训练误差小于最小阈值。

    最终预测用于为应用程序推断解释。在 Boosting 过程中，如果您注意，它使用顺序过程来通过算法进行处理。这与 Bagging 过程中遵循的并行执行过程不同。


    ## 10.3 Boosting 算法的类型

    现在，让我们探索各种 Boosting 算法。详细探索每一种超出了本书的范围。然而，了解算法类型并知道它们之间的基本差异非常重要。三种主要类型是自适应提升、梯度提升和极限梯度提升（XGBoost）。


    ### 10.3.1 自适应提升

    为 Boosting 创建的第一个模型之一是自适应提升（`AdaBoost`）。每次重复 Boosting 过程时，它都会调整并努力自我纠正。`AdaBoost`最初分配给每个数据集的权重相同。在每个决策树之后，数据点权重然后自动调整。为了在下一轮中修复它们，决策树会对错误分类的那些应用调整后的权重。它不断进行该过程，直到残差误差，即实际值与预测值之间的差异，低于预定的阈值（图
    10.3）。

    ![图 10.3 AdaBoost。](img/fig10.3.jpg)

    **图 10.3** AdaBoost。

    `AdaBoost`用途广泛，通常比其他 Boosting 算法不那么敏感。它可以用各种预测器使用。当特征相关或数据高度维时，该方法表现不佳。


    ### 10.3.2 梯度提升

    梯度提升不会像`AdaBoost`那样调整权重。相反，它使用差分损失函数，该函数使用预测值与真实值之间的差异。梯度提升也使用顺序训练模型。此 Boosting
    过程确保当前基学习器/模型比前一个更好。此方法通常在初始步骤本身就能提供准确的度量（图 10.4）。

    ![图 10.4 梯度提升。](img/fig10.4.jpg)

    **图 10.4** 梯度提升。


    ### 10.3.3 极限梯度提升（XGBoost）

    在许多方面，极限梯度提升（`XGBoost`），如图 10.5，所示，在计算速度和扩展性方面增强了梯度提升。为了在训练期间实现并行学习，`XGBoost`利用
    CPU 的多个核心。对于大数据应用，这种 Boosting 方法很有趣，因为它可以处理庞大的数据集。并行化、分布式计算、缓存优化、非线性、交叉验证、可扩展性和外核处理是`XGBoost`的一些突出特点。解释每一种超出了本书的范围，尽管并行化整个
    Boosting 过程可以提高训练时间，并且算法倾向于始终产生优化的预测。

    ![图 10.5 XGBoost。](img/fig10.5.jpg)

    **图 10.5** XGBoost。


    ## 10.4 为什么 Boosting 很重要？

    像 Bagging 一样，Boosting 也是一个重要的集成技术，它使用顺序训练模型，随着每一步比前一步更加强化弱基学习器。这创建了一个强学习器，它将给出准确的预测，从而提高模型的性能。基学习器最初的预测准确率较低，容易过拟合，并且无法正确分类数据。例如，如果我们训练模型来识别印度象，那么模型可能无法预测具有大耳朵的非洲象。

