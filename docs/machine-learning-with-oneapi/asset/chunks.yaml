    ## 6.6 Loss and Cost Function, Bias and Variance Trade-off, Regularization, Feature
    Selection and Hyperparameter Tuning


    Linear regression tries to predict the target variable, minimizing the error over
    the independent input variables. This helps to understand the model accuracy with
    respect to the accurate predictions done on the test inputs, which are unseen.
    Regularization is the method used to prevent overfitting of the model generated.
    Let’s understand a bit more about the underfitting and overfitting of a model,
    with a suitable example. To understand them in a detailed manner, it is mandatory
    to touch upon certain terminologies, like loss and cost functions.


    As linear regression is a supervised machine learning model which focuses on reducing
    the errors, it is important to understand the loss function, cost function and
    gradient descent at a bare minimum.


    *Loss function* is the simplest way to understand how well the given linear regression
    machine learning model fits the specific training dataset. This basically calculates
    the prediction error. Say if we consider a ground truth for the values and if
    there is a major difference between the predicted and ground truth values, then
    we could say that the loss function is high. Loss functions are commonly used
    for hyperparameter tuning or optimization.


    *Cost Function* is the collective loss function across all observations in the
    training dataset. In terms of a linear regression, an example of a loss function
    could be the least squared error and the cost function is the mean squared error
    (MSE).


    So, let’s understand what exactly an “error” in machine learning is. Consider
    [Figure 6.23](#c6.xhtml#f6.23) below. This depicts the error, in fact, the training
    and validation error in terms of Bias and Variance.


    ![Figure 6.23 Error and model complexity.](images/fig6.23.jpg)


    [**Figure 6.23**](#c6.xhtml#re_f6.23) Error and model complexity.


    *Error* is simply a measure of how well the machine learning algorithm will make
    predictions for the unseen dataset. Mainly, the errors are divided into reducible
    and irreducible errors, as shown in [Figure 6.24](#c6.xhtml#f6.24).


    ![Figure 6.24 Errors in machine learning.](images/fig6.24.jpg)


    [**Figure 6.24**](#c6.xhtml#re_f6.24) Errors in machine learning.


    *Bias and Variance* are basically the reducible errors in machine learning. What
    do we mean by that? This simply means that there is a chance that you can reduce
    these errors and improve the accuracy of the model. On the contrary, irreducible
    errors are those present in the model by default.


    What is bias? Bias is the difference in prediction values and actual values expected
    to be predicted by the model. This shows the model’s incapability of understanding
    the correlation between the various data points. Bias can be of two types: low
    bias and high bias.


    Low bias is where the model includes fewer assumptions about the target function.
    Say, for example, an algorithm like a linear regression algorithm is simple and
    learns fast, and will have a higher bias. That means a model with a higher bias
    would not match the training dataset. In other words, a model will underfit if
    there is a high bias and the model will overfit if there is a low bias.


    Consider the example where we need to predict the salary of a person based on
    their educational qualification. Consider we did an experiential analysis of asking
    100 people in person, and if we consider the data taken for plotting the salary
    and age, it is an easy task. The model might not bring accurate results because
    of underfitting or high bias.


    Say, for example, if we consider many independent variables like age, sex, level
    of education, profession, etc., even though the model becomes complex and tries
    to generalize to make a good prediction on the training dataset, it fails to bring
    in good predictions on the test dataset. This is nothing but overfitting or high
    variance as shown in [Figure 6.25](#c6.xhtml#f6.25).


    ![Figure 6.25 Overfitting of data points.](images/fig6.25.jpg)


    [**Figure 6.25**](#c6.xhtml#re_f6.25) Overfitting of data points.


    In terms of linear regression, we can have various independent variables, like
    age, level of education, sex, profession, etc., as mentioned earlier. All of these
    independent variables may take up different values (or weights) to predict the
    salary in various permutations and combinations. This is where the hyperparameter
    optimization or tuning or weights for hyperparameters come into the picture. These
    adjustments of weights carried out on the independent variables is called regularization
    and is done to make the best prediction on the test dataset by the model.


    So, what exactly is *Regularization*?


    By regularization, you are making the model select the best features that will
    help the model predict the best in a test dataset. In simple terms, we could say,
    regularization helps in feature selection of the model. To keep it in terms of
    bias and variance, regularization helps to find a trade-off between high bias
    and high variance, as shown in [Figure 6.26](#c6.xhtml#f6.26). This is nothing
    but the bias–variance trade-off scenario in a machine learning problem. That means
    that we would like to reduce the accuracy on the training dataset from, say, 100
    % to 80 %, but still achieve an accuracy of say 50 to 80 % on the test or unseen
    dataset.


    ![Figure 6.26 Bias and variance trade-off.](images/fig6.26.jpg)


    [**Figure 6.26**](#c6.xhtml#re_f6.26) Bias and variance trade-off.'
