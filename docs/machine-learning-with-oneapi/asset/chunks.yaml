    ![Figure 1.4 Programming model.](images/fig1.4.jpg)


    [**Figure 1.4**](#c1.xhtml#re_f1.4) Programming model.


    * The developers working with CUDA (Compute Unified Device Application) find that
    migrating the existing CUDA code (CUDA Source Code) to the (Data Parallel C++)
    DPC++ (DPC++ Source Code) is easier with oneAPI. oneAPI provides you with the
    Intel DPC++ Compatibility Tool to migrate source code from CUDA to DPC++ with
    ease. There is a lot of assistance available with the migration, with almost 80–90%
    being carried out automatically. The best part is “inline comments,” which are
    also provided in an understandable manner for the developers to finish the porting.

    * The Intel oneAPI DPC++ / C++ compiler is very powerful, and it supports direct
    programming. This approach comes in useful when the APIs are not available for
    the algorithms. The reader will be presented with more details about direct programming
    later. For direct programming, Data Parallel C++ is an evolution of C++ for productive
    data-centric coding that will target CPUs, GPUs FPGAs and AI accelerators.

    * The next approach is API-based programming. There is a huge set of libraries
    catering to different domains and areas. Details of the libraries are presented
    in the following section, where readers will find a lot of information. Developers
    can just go ahead and use them without any challenge.

    * Finally, in [Figure 1.4,](#c1.xhtml#f1.4) you can also see that the tools like
    Intel VTune Profiler and Intel Advisor are present, which can help in analyzing
    the performance.


    ## 1.3 Libraries – More Power to You

    oneAPI comes with a rich set of libraries, which enable the acceleration of domain-specific
    functions. All the libraries shown in [Figure 1.5](#c1.xhtml#f1.5) are preoptimized
    to ensure maximum performance. One can see that the libraries cater to vast domain
    requirements. These libraries simplify programming by providing developers with
    APIs.


    ![Figure 1.5 Power of oneAPI.](images/fig1.5.jpg)


    [**Figure 1.5**](#c1.xhtml#re_f1.5) Power of oneAPI.


    A brief note on each of these libraries is presented below:

    * `Intel oneAPI Math Kernel Library`: One could use this library to develop the
    highly optimized math routines in their applications.

    * `Intel oneAPI Deep Neural Network Library`: One could use this library to build
    the deep learning applications which use the neural networks optimized for the
    Intel hardware, be it processor or graphics.

    * `Intel oneAPI Video Processing Library`: As the name indicates, this library
    can be very handy to accelerate video processing in the chosen application.

    * `Intel oneAPI Data Analytics Library`: This is one of the best libraries, especially
    for industrial needs. One can use this library to combine high speed and performance
    in big data applications.

    * `Intel oneAPI Threading Building Blocks`: Often known as TBB, these provide
    the developer with the opportunity to combine the TBB-based parallelism on the
    Multicore CPUs and the SYCL device-accelerated parallelism in the chosen application.

