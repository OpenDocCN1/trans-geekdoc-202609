    # 1 Intel oneAPI 初步讨论


    DOI: [10.1201/9781003393122-1](https://doi.org/10.1201/9781003393122-1)


    ## 学习目标


    阅读本章后，读者应能够理解以下内容：


    * 为什么需要 oneAPI？

    * oneAPI 对我们有什么？

    * oneAPI 的特性和学习资源。


    ## 1.1 引言


    oneAPI 是什么？嗯，这是许多科技爱好者、学习者、教师、行业从业者以及科技领域所有人都会提出的问题。本章旨在提供有关 oneAPI 的信息，说明 oneAPI
    到底是什么、为什么大家都在讨论 oneAPI、oneAPI 能提供什么等。（注意：是 oneAPI 而不是 OneAPI。）


    让我们首先了解全球软件开发者面临的问题。

    '
