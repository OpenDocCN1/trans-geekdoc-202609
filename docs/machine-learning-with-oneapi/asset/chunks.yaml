    # Preface


    oneAPI is an open, cross-architecture programming model from Intel that gives
    wings to the developers to use a single code base across multiple architectures
    to achieve accelerated computing. The oneAPI Base Toolkit contains a core set
    of tools and libraries for developing high-performance, data-centric applications
    across diverse architectures. In short, it offers a powerful performance-based
    programming ecosystem.


    It is becoming more obvious that the future of computing is not in a single chip
    for everything, but in several chips for several things. The consumers can choose,
    combine, and match from an ocean of accelerators for their explicit requirements.
    The objective is to aid software developers having one set of code to be run seamlessly
    for all the chips.


    Adapting such unified progresses, like oneAPI, offers flexibility and can get
    rid of the need to toil with diverse codebases, tools and programming languages.
    It simplifies software development and delivers relentless performance for accelerated
    computing without proprietary lock-in, while also assisting the integration of
    existing code. With oneAPI, developers can choose the best accelerator architecture
    for the specific problem they are trying to solve without the need to rewrite
    the software for the chosen architecture/platform.


    Machine learning has been growing tremendously in the market and has vast application
    possibilities and opportunities. Learning ML has become almost inevitable for
    engineers to achieve the best results and increased productivity. Many tools and
    software packages are available to make machine learning easier. oneAPI from Intel
    has been a boon to the market and many applications are being developed with it.
    This book explores the ML algorithms, concepts and implementation with relevant
    theoretical explanations and practical implementations with the latest tools which
    include oneAPI. The content is presented in such a way that it caters to everyone,
    from novice to expert level.


    The installations and practices needed to get used to the Intel DevCloud, Jupyter
    notebook and then the machine learning workflow, which is one of the most relevant
    workloads nowadays, are provided. The visualization tools, the classification,
    regression, bagging and boosting algorithms, along with their relevant implementation
    codes, offers an enjoyable learning experience while also demonstrating the solid
    optimized performance of oneAPI. Classification problems are included to help
    the reader understand the power of optimization, with additional details on Intel
    tools provided for an enhanced development experience catering to the varying
    demands of readers.


    GitHub links for the codes have been presented for easier accessibility.


    Let’s unleash the true power of our code across diverse archi­tectures!


    # Authors


    **Dr. Shriram K. Vasudevan**, Lead Technology Evangelist, Asia Pacific and Japan,
    Intel India Pvt. Ltd., has more than 17 years of experience in industry and academia
    combined. He holds a Doctorate in embedded systems. He has authored / co-authored
    45 books for various publishers including Taylor & Francis, Oxford University
    Press, and Wiley. He also has been granted 13 patents as inventor so far. Shriram
    is a hackathon enthusiast and has received awards from Harvard University, AICTE,
    CII, Google, TDRA Dubai and many more. He has published more than 150 research
    articles. He was associated with L&T Technology Services before joining Intel.
    Dr. Vasudevan runs a YouTube channel, under his name, which has more than 38,000
    subscribers and maintains a wide range of playlists on varied topics. Dr. Shriram
    is also a highly regarded public speaker and has participated in multiple training
    events. He is a oneAPI certified Instructor, ACM Distinguished Speaker, NVIDIA
    Certified and NASSCOM Prime Ambassador.


    **Mr. Nitin Vamsi Dantu**, Founder and CEO, Quadran AI, Intel Innovator, USA,
    is a young and dynamic AI engineer with a computer science background. He is one
    of the youngest CEOs in the country. He is the founder and CEO of Quadron AI and
    is working on Deep Learning-based healthcare solutions. His focus is toward building
    affordable and easy-to-use healthcare solutions. He has a dozen papers published
    in top journals and conferences. He is also a winner of the TDRA Award from the
    Government of the UAE. He has received awards from P&G, CITI, AWS and many other
    high-ranking companies for his skillset and contributions. He is currently pursuing
    research at Northeastern University in the USA.'
