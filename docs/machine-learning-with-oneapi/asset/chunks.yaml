- raw: 'What are we trying to conclude here? Yes, it is simple. As the number of dimensions
    increases, things become more and more complicated to deal with. Yes, you know
    now ![](images/inline11.11.jpg).


    Let’s make it more technical! In our problems, we use datasets. Consider that
    there is a huge dataset which contains a large number of attributes; the number
    of attributes indirectly provides information about the dimensionality of the
    dataset space. Normally, for humans, it is not that easy to visualize any dimensions
    greater than 3. So, is there a way that we can reduce the number of attributes
    (features) in a dataset? However, when we reduce the attributes, the predominant
    thing to be kept in mind is that this reduction should not lose any valuable information
    or relationships among the data in the dataset. The principal component analysis
    is a widely used dimensionality reduction method which makes use of an excellent
    exploratory data analysis tool to understand the variations in the dataset in
    a beautiful manner.


    ## 11.5 PCA in Depth


    We will start where we left off. Principal component analysis is a dimensionality
    reduction method that figures out the correlations and patterns in a dataset,
    so that when the data are reduced to a lower dimension, all the important information
    related to attributes and their relationships is preserved.


    When reducing the higher dimension to a lower dimension, PCA eliminates the inconsistencies
    and removes the redundant data and highly correlated features as shown in [Figure
    11.8](#c11.xhtml#f11.8). Why the highly correlated features? In a dataset, if
    you have two attributes which are highly correlated to each other or, in other
    words, if the correlation coefficient is close to 1, that means that the strength
    of the relationship is high. In such cases, if you retain one of the attributes
    and remove the other, it will not make any difference to your final result as
    you are able to preserve the information and relationship, with the help of one
    attribute alone.


    ![Figure 11.8 Simplest representation of PCA.](images/fig11.8.jpg)


    [**Figure 11.8**](#c11.xhtml#re_f11.8) Simplest representation of PCA.


    Consider there a crowd attending a function, as shown in [Figure 11.9](#c11.xhtml#f11.9).
    You, being the photographer for the function, need to capture the best photo of
    the crowd. Hence, you need to identify the direction and position you need to
    fix the camera and lighting, so that the maximum number of people in the crowd
    are included in the photos taken for the event.


    ![Figure 11.9 Crowd from different positions.](images/fig11.9.jpg)


    [**Figure 11.9**](#c11.xhtml#re_f11.9) Crowd from different positions.


    When mapping them all onto a straight line, considering three straight lines (projections)
    for three positions as shown in [Figure 11.10](#c11.xhtml#f11.10), it is understood
    that the greatest number of people from the crowd is actually covered


    ![Figure 11.10 How a crowd is mapped to three straight lines from three positions?](images/fig11.10.jpg)


    [**Figure 11.10**](#c11.xhtml#re_f11.10) How a crowd is mapped to three straight
    lines from three positions?


    in line 3. This means that the projection on straight line 3 is better than on
    the other projections, 1 and 2. Why? It is because line 3 preserves more information
    than the other projections.


    Having got a minimal understanding of how we perform PCA, we should now move on
    to the steps in the algorithm, as shown in [Figure 11.11](#c11.xhtml#f11.11).


    ![Figure 11.11 Steps in PCA.](images/fig11.11.jpg)


    [**Figure 11.11**](#c11.xhtml#re_f11.11) Steps in PCA.


    The algorithmic steps are as follows and the same is shown in [Figure 11.12](#c11.xhtml#f11.12).


    ![Figure 11.12 Understanding eigenvectors.](images/fig11.12.jpg)


    [**Figure 11.12**](#c11.xhtml#re_f11.12) Understanding eigenvectors.


    *   *Step 1:* Collect data and present it in the form of a table where the rows
    are the observations and columns are the attributes (dimensions of the space).


    *   *Step 2:* Perform normalization by using Z-normalization


    |   Z \=   X − M   /  S    ||  |


    | --- | --- |


     where m is the mean, and S is the standard deviation.


    *   *Step 3:* Calculate the covariance matrix.


    *   *Step 4:* Calculate the eigenvectors and eigenvalues. Make sure that the eigenvectors
    are unit vectors (have a length of 1).


    *   *Step 5:* Inspect the eigenvalues and select the eigenvector with the highest
    eigenvalue, which determines the *first principal component* (it preserves the
    greatest percentage of the information from the dataset). The eigenvector with
    the next highest eigenvalue determines the *second principal component* and so
    on. We can ignore the eigenvectors with a low eigenvalue: this leads to dimensionality
    reduction.


    *   *Step 6:* Reconstruct the *data into a new dataset*. For the selected eigenvector/eigenvectors,
    create a transpose matrix and multiply it from the left by the adjusted dataset
    matrix.


    *Resulting Data* = (*Eigenvector Matrix*) *^T* × *Adjusted Data Matrix*


    Some major points to be kept in mind include:


    *   If your data set is of *9 dimensions, then 9 principal components are computed*,
    such that, *the first principal component* stores the *maximum information possible*
    and the *second one* stores the remaining maximum information and so on.


    *   For every eigenvector, there is an eigenvalue.


    *   The number of attributes in the data determine the number of eigenvectors
    that is to be calculated.


    We hope you have understood the process of principal component analysis and how
    the principal components are calculated in order to reduce the dimensions of the
    dataset without causing the loss of relevant and important information. See [Figure
    11.13](#c11.xhtml#f11.13) for a complete understanding of PCA from 5D to 2D.


    ![Figure 11.13 The complete process of PCA from 5D to 2D.](images/fig11.13.jpg)


    [**Figure 11.13**](#c11.xhtml#re_f11.13) The complete process of PCA from 5D to
    2D.


    ## 11.6 Implementation of PCA


    To demonstrate how powerful oneAPI could be in implementing the PCA, the following
    piece of code and demonstrations are presented. We have considered the famous
    IRIS dataset for the dimensionality reduction. One could visualize the dataset
    from [Figure 11.14](#c11.xhtml#f11.14). Also, the performance of the Intel distribution
    of sklearn is compared with the stock sklearn, and you can try this out as well.


    ![Figure 11.14 The IRIS dataset.](images/fig11.14.jpg)


    [**Figure 11.14**](#c11.xhtml#re_f11.14) The IRIS dataset.


    ![](images/inline11.4.jpg)


    One could see that the stock version is used first, followed by the Intel-optimized
    version.


    ![](images/inline11.5.jpg)![](images/inline11.6.jpg)![](images/inline11.7.jpg)![](images/inline11.8.jpg)![](images/inline11.9.jpg)


    One can see the swift increase in performance with the Intel-optimized sklearn
    over the stock version. The complete code and dataset is made available in the
    GitHub: [https://github.com/shriramkv/MachineLearningwithoneAPI](https://github.com)
    and the reader can try this out.


    We sincerely hope you had a great read. It’s almost curtains now, but not before
    we describe the additional Intel tools that can provide you with an enhanced development
    experience! Let’s move on to the last chapter. [Chapter 12](#c12.xhtml#c12) awaits
    you.


    ## Resources


    *   Vasudevan, S.K., Pulari, S.R., & Vasudevan, S. (2021). Deep Learning: A Comprehensive
    Guide (1st ed.). Chapman and Hall/CRC Press. [https://doi.org/10.1201/9781003185635](https://doi.org/10.1201/9781003185635)


    *   Murphy, K.P., & Bach, F. (2012). Machine Learning: A Probabilistic Perspective.
    Cambridge, MA, MIT Press.


    *   [https://youtu.be/n7npKX5zIWI](https://youtu.be)


    *   [https://youtu.be/7G4UW4qkfOs](https://youtu.be)


    ## 11.7 Key Points to Remember


    1.  Clustering is a method or technique to group data into clusters. The objects
    inside a cluster should have a high similarity.'
