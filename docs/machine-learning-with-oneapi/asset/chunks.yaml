    \ Library.\n   * oneAPI `DPC++` Compiler.\n   * oneAPI `DPC++` Library.\n   *\
    \ oneAPI Math Kernel Library.\n   * oneAPI Threading Building Blocks.\n   * oneAPI\
    \ Video Processing Library.\n   * Intel `Advisor`.\n   * Intel Distribution for\
    \ `Python*`.\n   * Intel `DPC++` Compatibility Tool.\n   * Intel FPGA Add-On for\
    \ oneAPI Base Toolkit (optional).\n   * Intel Integrated Performance Primitives.\n\
    \   * Intel `VTune™ Profiler`.\n   * `GDB`.\n\nThe reader can refer to [Figure\
    \ 2.1](#c2.xhtml#f2.1) to understand how the Intel oneAPI Base Toolkit supports\
    \ developers with direct programming, API-based programming and a rich array of\
    \ libraries.\n\n![Figure 2.1 Richness of the oneAPI Base Toolkit.](images/fig2.1.jpg)\n\
    \n[`Figure 2.1`](#c2.xhtml#re_f2.1) Richness of the oneAPI Base Toolkit.\n\nThe\
    \ features that the oneAPI Base Toolkit bring in are enormous and are summarized\
    \ as a diagrammatic representation in [Figure 2.2](#c2.xhtml#f2.2) for easier\
    \ reference.\n\n![Figure 2.2 The features of the oneAPI Base Toolkit.](images/fig2.2.jpg)\n\
    \n[`Figure 2.2`](#c2.xhtml#re_f2.2) The features of the oneAPI Base Toolkit.\n\
    \nOne can install the oneAPI Base Toolkit in the machine and develop applications\
    \ or can use `DevCloud` to develop applications seamlessly. The latter option\
    \ is easier for the developer as the need for installation or setting up the environment\
    \ is not great.\n\nThe installation procedure for all the mentioned kits remains\
    \ almost the same. The only variable is that the executable file to be downloaded\
    \ and the corresponding links could be different.\n"
  trans: "\n* `Intel oneAPI Collective Communications Library`: 这可用于以深度学习和机器学习工作负载为主要关注点的应用程序。\n\
    * `Intel oneAPI DPC++ Library`: 可使用此库构建高性能并行应用程序。\n* `Support in the form of Ray\
    \ Tracing libraries`: 这些库可用于构建逼真的视觉效果，从工作室动画到科学和工业可视化。\n* `Intel oneAPI Image\
    \ Processing Library`: 顾名思义，oneAPI 包含图像处理功能、滤镜、几何变换、颜色和类型转换以及各种 3D 操作，使开发人员能够通过\
    \ `SYCL*` API 利用多样化的计算设备而无需更改其代码。\n* `Intel oneAPI Data Transformation Library\
    \ (DTL)`: 这是英特尔为多样化架构提供即用型、优化的数据压缩功能的一项非常创新的尝试。`OneDTL` 的设计方式使其可在包括 CPU、GPU 等在内的各种设备上执行。\n\
    \n现在是读者了解工具包的时候了。Intel oneAPI 提供了丰富的工具包，提供广泛的服务。这些将在 第 2 章 中探讨。\n\n## 1.4 oneAPI\
    \ 与本书的联系是什么？\n\n好吧，这应该已经在读者的脑海中了。让我们来回答这个问题。机器学习（`ML`）概念可以通过各种平台和模式教授。对于本书，我们选择了\
    \ oneAPI。我们相信通过这种方法，机器学习会更容易。此外，oneAPI 目前是行业迫切需要的。`ML` 技能与 oneAPI 知识相结合将是惊人的。我们确信读者会喜欢这整个学习之旅。\n\
    \n## 资源\n\n英特尔所做的最伟大的事情之一就是为所有水平的专业知识提供优秀的学习资源。从新手到专家，所提供的材料和学习路径简直出色。英特尔还为学习者提供案例研究、通过\
    \ `GIT` 的参考代码等。教师有机会成为 oneAPI 认证讲师，他们可以获得完整的培训材料、演示文稿、示例代码、作业问题和答案。\n\n以下链接可用于了解更多关于\
    \ oneAPI 的信息，\n* oneAPI 简介\n  [`www.intel.com/content/www/us/en/developer/tools/oneapi/overview.html#gs.d912h6`](https://www.intel.com)\n\
    * oneAPI 工具包\n  [`www.intel.com/content/www/us/en/developer/tools/oneapi/toolkits.html#gs.3ovxmi`](https://www.intel.com)\n\
    * 学习路径\n  [`www.intel.com/content/www/us/en/developer/tools/oneapi/training/overview.html`](https://www.intel.com)\n\
    * 社区项目\n  [`devmesh.intel.com/`](https://devmesh.intel.com)\n* oneAPI DevCloud\n\
    \  [`devcloud.intel.com/oneapi/`](https://devcloud.intel.com)\n\n要成为 oneAPI 认证讲师，可以前往申请到\n\
    [`www.intel.com/content/www/us/en/secure/developer/oneapi/certified-instructor-apply.html`](https://www.intel.com)\n\
    \n而且请记住，一切都是免费的！\n\n## 1.5 需要记住的关键点\n\n1. oneAPI 是一个行业倡议，是一种基于标准的开放编程模型。\n2. 针对使用\
    \ oneAPI 进行编程，开发人员提供了两种选项。一种是直接编程，另一种是基于 API 的编程。\n3. oneAPI 为您提供 Intel `DPC++`\
    \ 兼容性工具，可轻松将源代码从 `CUDA` 迁移到 `DPC++`。\n4. oneAPI 配备了 Intel `VTune™ Profiler` 和\
    \ Intel `Advisor` 等工具，可帮助分析性能。\n5. oneAPI 配备了丰富的库，可实现特定领域的函数加速。\n6. 读者不必被上述庞大的列表冲昏头脑！我们将确保学习以应有的方式传授。\n\
    \n好吧，我们衷心希望您喜欢这次关于 oneAPI 的相当详细的介绍性讨论。是时候继续前进并探索 Intel oneAPI 工具包了，所以让我们继续下一章。\n\
    \n## 测验问题（自己作答吧，朋友们！）\n\n1. 什么是 oneAPI？\n2. oneAPI 的主要优势有哪些？\n3. 列出 oneAPI 库的名称。\n\
    4. 编写一次代码，随意重复使用——oneAPI 如何实现这一点？\n5. `VTune Profiler` 对开发人员有何帮助？\n6. 有人如何使用 Intel\
    \ Advisor 来获得更好的结果？\n7. 解释 oneAPI 支持的编程模型。\n\n# 2 Intel oneAPI 工具包 探索\n\nDOI:\
    \ [10.1201/9781003393122-2](https://doi.org/10.1201/9781003393122-2)\n\n## 学习目标\n\
    \n阅读本章后，读者应能够理解以下内容：\n* oneAPI 工具包是什么？\n* oneAPI 工具包的功能是什么。\n* 安装指南。\n* 资源。\n\n\
    ## 2.1 Intel oneAPI 工具包\n\n随着 `2022.3.1` 版本的发布，Intel oneAPI 提供了丰富的工具包，可满足各种领域和应用的需求。有了这些\
    \ oneAPI 工具包，可以在 CPU、GPU 或任何其他加速器上构建、分析和甚至优化性能改进的跨架构应用程序。工具包还为开发人员提供优秀的库、优化的框架以及出色且易于使用的调试工具。\n\
    \n这些工具包以性能为主要目标，同时降低软件开发成本并减少维护成本。oneAPI 和工具包无疑使开发人员更具生产力。\n\n以下是英特尔为开发人员探索和使用而提供的\
    \ oneAPI 工具包。（参见图 2.1）\n\n1. a. `Intel oneAPI Base Toolkit`: 一切都始于 oneAPI Base\
    \ Toolkit，它包含一套用于使用 `C++`、`DPC++` 等构建应用程序的高性能工具。在此工具包的帮助下，开发人员可以在多样化的架构上构建以数据为中心的应用程序。您可以将基础工具包与其他工具包互补。该工具包包含一套工具和库，下面列出以供快速参考：\n\
    \   * oneAPI 集体通信库。\n   * oneAPI 数据分析库。\n   * oneAPI 深度神经网络库。\n   * oneAPI `DPC++`\
    \ 编译器。\n   * oneAPI `DPC++` 库。\n   * oneAPI 数学核心库。\n   * oneAPI 线程构建模块。\n   *\
    \ oneAPI 视频处理库。\n   * Intel `Advisor`。\n   * Intel `Python*` 发行版。\n   * Intel\
    \ `DPC++` 兼容性工具。\n   * Intel FPGA 插件 for oneAPI Base Toolkit（可选）。\n   * Intel\
    \ 集成性能原语。\n   * Intel `VTune™ Profiler`。\n   * `GDB`。\n\n读者可以参考 图 2.1 来了解 Intel\
    \ oneAPI Base Toolkit 如何通过直接编程、基于 API 的编程以及丰富的库支持开发人员。\n\n![图 2.1 oneAPI Base\
    \ Toolkit 的丰富性。](img/fig2.1.jpg)\n\n`Figure 2.1` oneAPI Base Toolkit 的丰富性。\n\n\
    oneAPI Base Toolkit 带来的功能是巨大的，并以图表形式在 图 2.2 中进行了总结，以便更易于参考。\n\n![图 2.2 oneAPI\
    \ Base Toolkit 的功能。](img/fig2.2.jpg)\n\n`Figure 2.2` oneAPI Base Toolkit 的功能。\n\
    \n可以在机器上安装 oneAPI Base Toolkit 并开发应用程序，或使用 `DevCloud` 无缝开发应用程序。后一种选项对开发人员来说更容易，因为安装或设置环境的需要不大。\n\
    \n所有提及的工具包的安装程序几乎保持相同。唯一变量是需要下载的可执行文件和相应的链接可能不同。\n\n"
