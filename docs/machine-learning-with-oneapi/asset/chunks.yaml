    # 7 Support Vector Machines (SVM)An Exploration


    DOI: [10.1201/9781003393122-7](https://doi.org/10.1201/9781003393122-7)


    ## Learning Objectives


    After going through this chapter, the reader should be able to understand the
    following:


    *   What is SVM?


    *   How does it work?


    *   Implementation and testing


    *   Costs and functions of SVM


    ## 7.1 SVM – Support Vector Machines


    To start with, SVM is very easy to use, as well as to learn. Data scientists claim
    that SVM offers greater accuracy than other classifiers we work with. SVM is mostly
    used in e-mail classification, handwriting recognition, etc. The reader will be
    introduced to SVM and have it explained clearly in this section.


    SVM is usable for both regression and classification problems, but, most commonly,
    it is used for classification problems rather than regression ones. The main aim
    of SVM is all about creating an optimum line or a decision boundary. The decision
    boundary will enable segregation of the dataset into classes. Also, it will enable
    the correct classification of new data in the future.


    The appropriate decision boundary is referred to technically as a hyperplane.
    It is very important for the reader to understand the terminologies used in SVM.
    They are presented one after another in this chapter in a detailed manner.


    ### 7.1.1 Hyperplane


    This is an important term. It is a plane which separates (i.e., enables grouping
    of) objects that belong to different classes. This line helps in classifying the
    data points (i.e., the red stars and green triangles). One can refer to Figure
    7.1 to understand the hyperplane concept.


    The dimension of a hyperplane is a variable too. Is it possible that way? Yes,
    it is. One should refer to [Figure 7.1](#c7.xhtml#f7.1). It has two features and
    hence one straight line is sufficient. If there are three features, yes, it must
    be a two-dimensional plane.


    ![Figure 7.1 The SVM – a complete picture.](images/fig7.1.jpg)


    [**Figure 7.1**](#c7.xhtml#re_f7.1) The SVM – a complete picture.


    #### 7.1.2 Support Vectors


    One should refer again to [Figure 7.1](#c7.xhtml#f7.1). The red stars and the
    green triangles are the support vectors. These points are very close to the hyperplane.
    These data points are the ones that would affect the position of the hyperplane
    as well. These points are vectors. Since they have a role in deciding the hyperplane’s
    placement, they are called support vectors.


    #### 7.1.3 Margin


    This is a gap. If the margin between two classes is larger, then it is a good
    margin. Otherwise, it is considered to be bad. In simple terms, a margin is a
    gap between two lines on closely located class points. By referring again to Figure
    7.1, one can understand that the margin can be calculated as the perpendicular
    distance from the line to the support vectors (red stars and green triangles)


    ### 7.1.4 How Does SVM Work?


    Simple! One should group/segregate the dataset (i.e., non-classified to classified)
    in the best possible way.


    The readers know what a margin is all about. A margin is a gap between two lines
    on closely located class points. Now, the task in hand is simple. One must select/draw
    a hyperplane with a maximum margin between the support vectors from the input
    dataset. The greater the margin, the larger the gap.


    The reader will be taken through the process step by step:


    One should first generate hyperplanes. Three such planes are generated, brown
    followed by blue and red, as shown in [Figure 7.2](#c7.xhtml#f7.2). As anyone
    can see, brown and blue have failed miserably to classify the dataset. This reflects
    a high error rate. So, red is very appropriate, and it does the classification
    properly. So, what do we do? The answer is obvious: choose the best line. The
    best-drawn line (the “line-of-best-fit”) is presented as a black line on the right-hand
    side of [Figure 7.2](#c7.xhtml#f7.2).


    ![Figure 7.2 Hyperplane selection.](images/fig7.2.jpg)


    [**Figure 7.2**](#c7.xhtml#re_f7.2) Hyperplane selection.


    That is it. One could now understand that all the red stars and green triangles
    are grouped appropriately based on the hyperplane.


    The oneAPI implementation of SVM will now be presented in the next section.


    ## 7.2 SVM Implementation


    It is time to implement the SVM, using the oneAPI open programming model. The
    reader will be presented with a step-by-step explanation of the implementation,
    with the results discussed at the end.'
