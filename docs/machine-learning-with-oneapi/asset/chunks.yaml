    ## 11.1 Introduction


    To make it simple, clustering is a method or technique which groups data into
    clusters. The objects inside a cluster should have high similarity. For example,
    in a dataset of medical students, first-year students represent a cluster, second-year
    students are a cluster, etc. The objects in one cluster should be different from
    those in another cluster; for example, first-year engineering students are one
    cluster that is dissimilar to a second cluster of first-year medical students.
    These two clusters are disjoint. Clustering helps to divide the complete dataset
    into many clusters. This is a non-labeled, unsupervised approach. One can understand
    clustering by referring to [Figure 11.1](#c11.xhtml#f11.1).


    ![Figure 11.1 Clustering.](images/fig11.1.jpg)


    [**Figure 11.1**](#c11.xhtml#re_f11.1) Clustering.


    It is time to understand K-means clustering.


    ## 11.2 K-Means Clustering


    As discussed before, clustering is a method or technique to group data into clusters
    with the objects inside the cluster possessing greater similarity than the objects
    in another cluster. A cluster’s objects should be markedly dissimilar to the objects
    from another cluster. In one word, we can say that the metric being employed is
    “similarity!” It is the metric which talks about the relationship between the
    objects.


    Now comes the next question: Why do we need clustering? Simple, it gives you an
    exploratory view of the data. One can get a better idea about the data with clustering.


    K-means is actually called “centroid-based clustering.” “What is a centroid?”
    is the next question to be answered! The dictionary definition is that a centroid
    is the center of mass of a geometric object of uniform density. Well, in ML, the
    centroid definition remains the same. It is the data point at the center of a
    cluster.


    The centroid need not be a member of the dataset considered, though it can be.


    This clustering approach is iterative in nature. This means that the algorithm
    keeps working until the target is achieved. One sample dataset is taken and clustering
    is explained step by step.


    The challenge in this example is to group the eight objects in the dataset into
    two clusters. All the objects have the X, Y and Z coordinates clearly accessible.
    How do we identify the K value? K is the number of clusters. Here, it is two.
    So, in this example, the K value is set as 2.'
