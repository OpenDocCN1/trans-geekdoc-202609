    on ML. So, the point is simple. With ML in the picture, a company can identify
    more opportunities for making good profits. A scenario: you are browsing about
    holidays in Thailand. You have not booked any tickets or even confirmed the trip.
    Upon logging into your Facebook account, you will be receiving the Thailand holiday-related
    posts. That is ML for you! It helps in finding avenues for new business and enhancing
    profit for subscribing companies, all without any errors or human intervention.
    No operator is necessary to link that Thai holiday advertisement to your Facebook
    page.


    Further major application of ML are in:


    *   *Agricultural sector*: To identify the crop diseases.


    *   *Energy sector*: To predict the consumption of energy for a region in the
    next two months.


    *   *Education sector*: To predict the number of students completing the course
    and the job openings in the market.


    *   *Government sector*: Many ML-related applications are used, such as automated
    identification of the unique Identifier from a captured image of a person, for
    facial recognition purposes.


    *   *Other Sectors*: Financial sector, media sector, retail sector, smart home
    and telecom are some of the other sectors where we frequently employ machine learning
    concepts.


    Well, it was a fascinating chapter, right?! Let’s progress further to explore
    Pandas, Data Frames, and Libraries for visualization. The next chapter awaits
    you!


    ## Resources


    *   Vasudevan, S.K., Pulari, S.R., & Vasudevan, S. (2021). Deep Learning: A Comprehensive
    Guide (1st ed.). Chapman and Hall/CRC Press. [https://doi.org/10.1201/9781003185635](https://doi.org/10.1201/9781003185635)


    *   Murphy, K. P. (2012). Machine Learning: A Probabilistic Perspective. Cambridge,
    MA, MIT Press.


    *   [https://www.youtube.com/playlist?list=PL3uLubnzL2Tl-7fugIeCk4-l4HVVdn5\_v](https://www.youtube.com)


    ## 4.9 Key Points to Remember


    1.  Machine learning is a branch of AI, which can help a machine learn and act
    by imitating intelligent human behaviour.


    2.  AI is the broader umbrella term, and machine learning and deep learning come
    under this umbrella. All of them are related to each other.


    3.  Machine learning algorithms are categorized as supervised learning, unsupervised
    learning and reinforcement learning. Evolutionary learning algorithms make use
    of genetic algorithms.


    4.  Supervised learning algorithms use labeled datasets. They have a training
    phase to model and a testing phase to predict or classify the data. They are used
    to handle classification problem.


    5.  Unsupervised learning algorithms don’t not use labeled data; they categorize
    data into groups or clusters. They are clustering algorithms.


    6.  Reinforcement learning receives feedback from the environment, using computer
    agents and actions, to best utilize the parameters for optimal rewards.


    7.  Machine learning can perform adaptive learning, to bring the greatest accuracy
    to the process, taking feedback and making the process less error prone, and using
    them for recurrent tasks.


    8.  Machine learning frameworks mainly include the following steps: data collection,
    data analysis, model building, testing the model, visualization and results interpretation.


    9.  Machine learning uses ML algorithms to predict or classify the data, whereas
    deep learning (DL) uses neural networks and its hidden layers to provide the output,
    which makes it a bit harder to understand and find the inferences.


    10.  Machine learning has many applications in various sectors like retail, agriculture,
    finance, healthcare, education, energy, government, etc., in addition to Facebook
    recommending you friends, Amazon and Flipkart recommending you products, Netflix
    recommending movies, etc.


    ## Quiz Questions (Answer It Yourself, Folks!)


    1.  What is machine learning?


    2.  How are AI, ML and DL related?


    3.  State the types of machine learning algorithms


    4.  What is supervised learning? Can you explain with an example?


    5.  What is unsupervised learning? Can you relate with an example?


    6.  What is reinforcement learning? Can you describe with an example?


    7.  Why do we need machine learning?


    8.  Can you elaborate on the machine learning framework?


    9.  List a few machine learning applications.


    10.  Describe the differences between a ML and DL process.


    # 5 Tools and Pre-requisites


    DOI: [10.1201/9781003393122-5](https://doi.org/10.1201/9781003393122-5)


    ## Learning Objectives


    After going through this chapter, the reader should be able to understand the
    following:


    *   The basics of Pandas.


    *   Data frames and operations.


    *   Visualization tools and options.


    ## 5.1 Introduction


    This chapter is going to explore Pandas, data frames and libraries for use in
    output visualization. Python is chosen for many reasons: two good reasons are
    “resource availability” and “community connect.” The reader will learn to understand
    the concepts through relevant examples and the results presented alongside.


    ## 5.2 What’s Used in This Chapter?


    Readers shall be introduced to the following toolsets in this chapter. They are
    easy to use and certainly interesting to learn.


    *   *Jupyter Notebooks*: This is one of the most common tools used today for interactive
    coding and output visualization, which is easy to use and learn. The same is now
    integrated with Intel DevCloud, which we have discussed in detail in [Chapter
    3](#c3.xhtml#c3). The reader can revisit this chapter if needed.


    *   *NumPy, Pandas*: These are the keys for someone to get the best out of the
    numerical computations conducted.


    *   *Matplotlib, Seaborn*: When you talk about output visualization, the simplest
    and the most effective approach is to use Matplotlib/Seaborn. Both are very well-known
    and widely used by data scientists all over the world.


    This chapter will throw light on all of these, with examples and exercises. Stay
    tuned. It is time to go practical now.


    ## 5.3 Let’s Learn Pandas


    Well, Pandas is amazing. It is fast, powerful and flexible as well. It is very
    easy to learn and use. It is an open-source data manipulation and analysis tool
    which is built over Python. Actually, Pandas is packed with a lot of extremely
    useful functionalities. Even working with complex data appears easier when you
    choose Pandas. Most importantly, it is always very much easier to access statistical
    functions, visualizations, etc. It is fun and this section will enable the reader
    to understand Pandas. One can visit the official Pandas website @ [https://pandas.pydata.org/](https://pandas.pydata.org)


    Remember this.


    Pandas actually is an abbreviation for the Panel Datasets. The data are always
    referred to in the tabular format which has rows and columns.


    ### 5.3.1 Let’s Install


    It is simple. You need to have Python (latest version) and Anaconda already installed.
    This will make life easier. Follow the steps presented below and it will help
    install Pandas with ease.


    Go to the Anaconda Prompt (it has to be understood that the Anaconda Prompt is
    different from the Command Prompt). One could refer to the screenshot presented
    below in [Figure 5.1](#c5.xhtml#f5.1) which reveals the Anaconda Prompt. If you
    are using the Intel DevCloud, you can directly install with the Jupyter Notebook
    through DevCloud.


    ![Figure 5.1 The Anaconda Prompt.](images/fig5.1.jpg)


    [**Figure 5.1**](#c5.xhtml#re_f5.1) The Anaconda Prompt.


    One can launch the Jupyter Notebook with the Command Jupyter Lab through the Anaconda
    Prompt. One can refer to [Figure 5.2](#c5.xhtml#f5.2) to understand this step,
    which will enable you to launch the Python Notebook. That’s it. You would have
    gotten the Notebook for you to type your code as shown in [Figure 5.3](#c5.xhtml#f5.3).


    ![Figure 5.2 Launch the Jupyter Lab.](images/fig5.2.jpg)


    [**Figure 5.2**](#c5.xhtml#re_f5.2) Launch the Jupyter Lab.


    ![Figure 5.3 The Notebook.](images/fig5.3.jpg)


    [**Figure 5.3**](#c5.xhtml#re_f5.3) The Notebook.'
