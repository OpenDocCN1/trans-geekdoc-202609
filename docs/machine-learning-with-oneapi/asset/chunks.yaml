    # OneAPI Base Toolkit Installation Guide


    ## Download and System Requirements


    One can download the oneAPI Base Toolkit from the link: [https://www.intel.com/content/www/us/en/developer/tools/oneapi/base-toolkit-download.html](https://www.intel.com).


    But it is important to know if the user’s system has the requirements met for
    the installation to be carried out. One can learn the requirements from the link:
    [https://www.intel.com/content/www/us/en/developer/articles/system-requirements/intel-oneapi-base-toolkit-system-requirements.html](https://www.intel.com).


    ## Operating System Support


    The oneAPI Base Toolkit is available for MacOS, Windows and Linux ([Figure 2.3](#c2.xhtml#f2.3)).
    Based on what the user’s operating system is, the download can be initiated.


    ![Figure 2.3 Operating system support.](images/fig2.3.jpg)


    [**Figure 2.3**](#c2.xhtml#re_f2.3) Operating system support.


    ## Installation Options


    One can prefer online, or offline distribution as required. Below is the screenshot
    ([Figure 2.4](#c2.xhtml#f2.4)) presenting the options (online or offline options
    are available for all the supported operating systems).


    ![Figure 2.4 Installation options.](images/fig2.4.jpg)


    [**Figure 2.4**](#c2.xhtml#re_f2.4) Installation options.


    If the online mode of installation is selected, one would get the executable file
    downloaded immediately and it is lightweight one (13 MB). If the offline option
    is selected, the executable file is heavy (6 GB) and may need a little more time
    to complete the download process. Both the options are fine, and the users can
    choose according to their requirements. There may be a signup request for the
    download to be accomplished. One can see the volume of the installation file for
    offline and online modes presented in [Figure 2.5](#c2.xhtml#f2.5).


    ![Figure 2.5 Installation options.](images/fig2.5.jpg)


    [**Figure 2.5**](#c2.xhtml#re_f2.5) Installation options.


    ## Offline Installation Walkthrough


    The user is presented with a walk-through of the offline installation procedure.
    The operations and sequences remain the same with the online mode of installation
    as well.


    The first step is to specify the path for the extraction of the product package.
    [Figure 2.6](#c2.xhtml#f2.6) indicates the path to be specified.


    ![Figure 2.6 Extraction path.](images/fig2.6.jpg)


    [**Figure 2.6**](#c2.xhtml#re_f2.6) Extraction path.


    It takes a few seconds for the extraction to be completed ([Figure 2.7](#c2.xhtml#f2.7)).


    ![Figure 2.7 Extraction progress.](images/fig2.7.jpg)


    [**Figure 2.7**](#c2.xhtml#re_f2.7) Extraction progress.


    The next step in the sequence is interesting. The installer will automatically
    check the system requirements. One can refer to [Figure 2.8](#c2.xhtml#f2.8) to
    understand this. On clicking “Continue” in the pop-up shown below, the system
    requirement checks begin automatically.


    ![Figure 2.8 System requirements check.](images/fig2.8.jpg)


    [**Figure 2.8**](#c2.xhtml#re_f2.8) System requirements check.


    The complete details of what is getting installed with the oneAPI Base Toolkit
    are shown once the system check is completed. Also, one must agree to the license
    agreement. The user can also customise the installation, if required ([Figure
    2.9](#c2.xhtml#f2.9)). On clicking “Continue,” the installation will progress
    further. It may take some time for the entire process to be completed.


    ![Figure 2.9 The installation.](images/fig2.9.jpg)


    [**Figure 2.9**](#c2.xhtml#re_f2.9) The installation.


    ## IDE Integration


    To make life easier, the installer will prompt if the integration with the Integrated
    Development Environment (IDE) needs to be carried out; the options presented are
    as shown in [Figure 2.10](#c2.xhtml#f2.10). Though this is an optional step, it
    is preferred to be integrated with the IDE (Microsoft Visual Studio 2022).


    ![Figure 2.10 IDE integration.](images/fig2.10.jpg)


    [**Figure 2.10**](#c2.xhtml#re_f2.10) IDE integration.


    Subsequently, the intel software improvement program will now appear, and the
    user is free to give consent for data collection, or otherwise ([Figure 2.11](#c2.xhtml#f2.11)).


    ![Figure 2.11 Software improvement program – consent for data collection.](images/fig2.11.jpg)


    [**Figure 2.11**](#c2.xhtml#re_f2.11) Software improvement program – consent for
    data collection.


    That is it! The installation will begin ([Figure 2.12](#c2.xhtml#f2.12)). The
    user can sit back and relax for a while.


    ![Figure 2.12 Seamless installation of oneAPI Base Toolkit.](images/fig2.12.jpg)


    [**Figure 2.12**](#c2.xhtml#re_f2.12) Seamless installation of oneAPI Base Toolkit.


    When the installation is completed ([Figure 2.13](#c2.xhtml#f2.13)), and there
    is no stoppage, one can go ahead and innovate as required with the Intel oneAPI
    Base Toolkit.


    ![Figure 2.13 Successful installation of oneAPI Base Toolkit.](images/fig2.13.jpg)


    [**Figure 2.13**](#c2.xhtml#re_f2.13) Successful installation of oneAPI Base Toolkit.


    The options for building and running the projects with the visual studio command
    line are also available and can be referred to at the link: [https://www.intel.com/content/www/us/en/docs/oneapi-base-toolkit/get-started-guide-windows/2023-0/run-project-visual-studio-command-line.html](https://www.intel.com)


    ## Alternative: Intel DevCloud


    There may be a question in the minds of readers! Can we not make it simple without
    these installations? We do hear it. Yes, there is an option for that too. You
    can build, test and even optimize your project without any investment using the
    Developer Cloud (DevCloud) account. It is free and more powerful, and gets you
    access to all the latest Intel hardware, including the CPUs, GPUs or FPGAs. Access
    is given by Intel for 120 days and can also be extended. With the cloud, one can
    use any of the kits with ease and no installations, software downloads or configurations
    are required. It is simple and easy to use. One can register for the same access
    with the this link:


    [https://consumer.intel.com/intelcorpb2c.onmicrosoft.com/B2C_1A_UnifiedLogin_SISU_CML_SAML/generic/login?entityId=www.intel.com&ui_locales=en](https://consumer.intel.com)
    or the following QR code ([Figure 2.14](#c2.xhtml#f2.14)) can also be scanned.


    ![Figure 2.14 Intel DevCloud registration link.](images/fig2.14.jpg)


    [**Figure 2.14**](#c2.xhtml#re_f2.14) Intel DevCloud registration link.


    The registration process is simple and may need some information as your name
    and email id. That’s it, you can build your solutions with oneAPI!


    What next? Gear up and program. One can learn the oneAPI programming easily with
    the plethora of information being made available by intel with this link: [https://www.intel.com/content/www/us/en/docs/oneapi/programming-guide/2023-0/overview.html](https://www.intel.com)


    ## Related Toolkits


    1. b. *Intel oneAPI HPC (high-performance computing) Toolkit*: The name says it
    all. This toolkit, as one can understand, is domain specific. With this toolkit,
    one can build and deliver fast Fortran, OpenMP and MPI applications that combine
    high-performance computing applications with cutting-edge techniques.


    The toolkit comes with a bundle of tools and libraries, and they are listed below
    for the reader’s quick reference:


    * C++ Compiler

    * Cluster Checker

    * Fortran Compiler

    * Intel Inspector

    * Intel MPI Library

    * Intel Trace Analyzer and Collector


    The installation procedure remains almost the same as was discussed for the Intel
    oneAPI Base Toolkit section. However, the installable is to be downloaded from
    the link: [https://www.intel.com/content/www/us/en/developer/tools/oneapi/hpc-toolkit-download.html](https://www.intel.com).
    The rest of the guidelines remain the same. Some of the toolkits may demand the
    installation of the Base Toolkit as a prerequisite, which will be clearly indicated
    by the checker at the beginning of the installation.


    2. c. *Intel oneAPI Internet of Things (IoT) Toolkit*: This is also a domain-specific
    toolkit. With this IoT toolkit one, could accelerate the development of smart
    and connected devices leading to endless innovations. This toolkit is bundled
    with:


    * Intel Inspector

    * Intel oneAPI DPC++/C++ Compiler

    '
