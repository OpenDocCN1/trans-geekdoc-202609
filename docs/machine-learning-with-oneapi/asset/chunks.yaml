    3.  趋势分析、时间序列分析和生物医学成像都是回归分析的各种应用。

    4.  线性回归和逻辑回归是两种回归类型。

    5.  线性回归主要用于回归任务。

    6.  线性回归不仅仅是通过散点拟合一条直线。

