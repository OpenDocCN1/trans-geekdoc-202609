- raw: 'DOI: [10.1201/9781003393122-10](https://doi.org/10.1201/9781003393122-10)


    ## Learning Objectives


    After reading this chapter, the reader should be able to understand the following:


    *   What is boosting?


    *   Types of boosting algorithms.


    *   Why is boosting important?


    *   Bias and boosting – what’s the association?


    *   Comparison of bagging and boosting.


    *   Major applications of boosting.


    *   Major benefits and challenges of boosting.


    *   What is stacking?


    *   Types of stacking algorithms


    *   Why is stacking important?


    *   Implementation of stacking


    ## 10.1 Introduction


    Ensemble methods use multiple models and a combiner at the end to decide about
    the accurate prediction methods suitable for the data being used. Yes, there are
    bagging, boosting and stacking methods available and we have seen in detail about
    the bagging method in [Chapter 9](#c9.xhtml#c9). In this chapter, we are going
    to explore more about the other two techniques of ensemble learning, that is boosting
    and stacking. We will also do a proper comparison between bagging and boosting
    methods in this chapter. By the end of this chapter, you will have a complete
    idea about why we use ensemble learning methods in machine learning and their
    importance. Let’s get started.


    ## 10.2 What Is Boosting?


    Boosting is an ensemble learning technique that uses sequential ways of using
    the base learners rather than the parallel way of using multiple base learners,
    as in bagging. I know, it seems to be a bit vague as of now. Let’s try to understand
    it in depth. Say you have developed a model which can identify tigers. Your model
    has been trained to identify tigers. Now, the issue is that the model is trained
    only with tiger images but, at times, it misclassifies the domestic cat as a tiger.


    However, our model has to accurately classify only tigers. Yes, the tiger belongs
    to the cat family, ![](images/inline4.1.jpg)we agree. But we need a specific tiger
    classification system, maybe we are building a system to identify the tigers that
    enter the nearby neighborhood, thereby causing panic among the humans therein.
    In such cases, if we misclassify a fully grown cat from a distance, our system
    fails, as shown in [Figure 10.1](#c10.xhtml#f10.1). Here, boosting comes to the
    rescue by training multiple models, but in a sequential manner, to improve the
    accuracy of the model on unseen data. So, now you know where boosting can be utilized.


    ![Figure 10.1 Misclassification.](images/fig10.1.jpg)


    [**Figure 10.1**](#c10.xhtml#re_f10.1) Misclassification.


    The sequential process followed in boosting can be best understood from [Figure
    10.2](#c10.xhtml#f10.2).


    ![Figure 10.2 Boosting process.](images/fig10.2.jpg)


    [**Figure 10.2**](#c10.xhtml#re_f10.2) Boosting process.


    The major steps in the boosting process, as shown in [Figure 10.2,](#c10.xhtml#f10.2)
    are as follows:


    It is good to understand that this process is a generic one and that the training
    process changes based on the boosting algorithm used.


    Anyway, moving on to the process:


    1.  Equal weights are assigned to each of the original data samples and are fed
    to the first model in the boosting algorithm. At this stage, it makes predictions
    for each data sample. Normally, they are referred to as base algorithms. So, basically,
    the base algorithm predicts each data sample in the original dataset.


    2.  The boosting algorithm assigns weight, based on the model performance, that
    increases the weight of samples with a more significant error. There are many
    models and the model with the optimized predictions will contribute more to the
    final predictions.


    3.  This continues and the weights are adjusted at each model.


    4.  Steps 2 and 3 continue until the training errors are less than a minimum threshold
    value.


    The final predictions are used for inferring interpretations for the applications.
    In the boosting process, if you notice, it uses a sequential process for proceeding
    through the algorithm. This is different from the parallel process of execution
    followed in the bagging process.


    ## 10.3 Types of Boosting Algorithms


    Now, let’s explore the various types of boosting algorithms. Exploring each one
    in detail is beyond the scope of this book. However, it is very important to understand
    the types of algorithm and to know the basic differences between them. The three
    main types are adaptive boosting, gradient boosting and eXtreme Gradient boosting
    (XGBoost).


    ### 10.3.1 Adaptive Boosting


    One of the first models that was created for boosting was adaptive boosting (AdaBoost).
    Every time the boosting procedure is repeated, it adjusts and makes an effort
    to self-correct. The initial weight assigned by AdaBoost to each dataset is the
    same. After each decision tree, the data point weights are then automatically
    adjusted. To fix them for the following round, the decision tree applies adjusted
    weights to those that were improperly categorized. It keeps going through the
    procedure until the residual error, that is, the difference between the actual
    and predicted values, falls below a predetermined threshold value ([Figure 10.3](#c10.xhtml#f10.3)).


    ![Figure 10.3 AdaBoost.](images/fig10.3.jpg)


    [**Figure 10.3**](#c10.xhtml#re_f10.3) AdaBoost.


    AdaBoost is versatile and generally less sensitive than other boosting algorithms.
    It may be used with a wide variety of predictors. When features are correlated
    or if the data are highly dimensional, this method does not perform well.


    ### 10.3.2 Gradient Boosting


    Gradient boosting doesn’t adjust the weights as in AdaBoost. Instead, it uses
    a differential loss function which uses the difference between the predicted values
    and ground truth. Gradient boosting also uses the sequential training model. This
    boosting process makes sure that the current base learner/model is better than
    the previous ones. This method normally delivers accurate measures at the initial
    steps itself ([Figure 10.4](#c10.xhtml#f10.4)).


    ![Figure 10.4 Gradient boosting.](images/fig10.4.jpg)


    [**Figure 10.4**](#c10.xhtml#re_f10.4) Gradient boosting.


    ### 10.3.3 Extreme Gradient Boosting (XGBoost)


    In numerous ways, Extreme Gradient Boosting (XGBoost), as illustrated in [Figure
    10.5,](#c10.xhtml#f10.5) enhances gradient boosting in terms of computational
    speed and scaling. To enable parallel learning during training, XGBoost makes
    use of the CPU''s multiple cores. Big data applications find this boosting approach
    interesting since it can handle massive datasets. Parallelization, distributed
    computing, cache optimization, non-linearity, cross-validation, scalability and
    out-of-core processing are some of the XGBoost standout characteristics. Explaining
    each of these is beyond the scope of this book, although parallelizing the whole
    boosting process improves the training time and the algorithm tends to always
    produce optimized predictions.


    ![Figure 10.5 XGBoost.](images/fig10.5.jpg)


    [**Figure 10.5**](#c10.xhtml#re_f10.5) XGBoost.


    ## 10.4 Why Is Boosting Important?


    Like bagging, boosting is also an important ensemble technique which uses the
    sequential training model to strengthen the weak base learners more with each
    step than the previous one. This creates a strong learner which will give accurate
    predictions, thereby improving the performance of the model. Base learners initially
    will have low accuracy for prediction and are susceptible to overfitting, and
    won’t be able to classify the data properly. Say, for example, if we have trained
    the model for identifying Indian elephants, then the model may not be able to
    predict African elephants with big ears.'
