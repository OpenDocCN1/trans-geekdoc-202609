    # 4 什么是机器学习？导论！


    DOI: [10.1201/9781003393122-4](https://doi.org/10.1201/9781003393122-4)


    ## 学习目标


    阅读本章后，读者应能够理解以下内容：

    * 什么是机器学习？

    * 人工智能（AI）、机器学习（ML）和深度学习 DL 之间的关系。

    * 机器学习的类型。

    * 机器学习的必要性。

    * 机器学习框架。

    * 机器学习 *vs* 深度学习。

    * 机器学习应用。


    ## 4.1 引言


    术语机器学习（ML）属于人工智能（AI）研究领域，已在我们周围流传了几十年。我们中的大多数人已经尝试理解“该词的抽象含义”，至少是通过进行 Google 搜索。即使你没有这样做，也不用担心：你来对地方了，可以从技术角度深入学习“什么是机器学习？”本章的意图并不止于此——我们将更深入地了解各种机器学习类型、其在现实生活场景中的应用以及
    ML 与深度学习（DL）之间的差异。


    ## 4.2 什么是机器学习？


    好吧，让我们先带你回到难忘的童年。你还记得在你学会正常走路之前摔了多少次吗？哦，那是你回忆起来相当久远的记忆了，也许我们应该把这个问题问你的父母。让我们考虑一个你现在可能仍然记得的例子。我们每个人都有一个最喜欢的幼儿园老师，她对我们如此甜美和耐心。是的，我是有意使用了“耐心”这个词。你知道为什么！我仍然记得我的
    KG 老师是如何教我什么是苹果的。她字面意义上拿来了真正的苹果，递给我，让我玩它来体验并告诉我那是苹果。事实上，她几乎持续了一周。


    ![图 4.1 老师花了一周时间“训练”学生“什么是苹果？”](img/fig4.1.jpg)


    **图 4.1** 老师花了一周时间“训练”学生“什么是苹果？”


    下周，她带来了一个番茄和一个苹果，问我哪一个是苹果。我能够毫不犹豫地正确指出苹果。


    ![图 4.2 老师测试学生是否能正确识别苹果。](img/fig4.2.jpg)


    **图 4.2** 老师测试学生是否能正确识别苹果。


    现在让我们切入正题：你认为老师做了什么才让学生如此好地识别它！是的，老师耐心地用真正的苹果 *训练* 了学生一周，苹果的特征，如其红色、圆形形状以及内部呈白色且坚硬的特性，都通过体验被正确地记录下来。学生在
    *测试* 阶段收集的这种集体智能帮助其从番茄等不同水果中识别出苹果。（顺便说一下，我们并没有说错！番茄是水果，但营养学家认为它是蔬菜，正如 Britannica.com
    所建议的 ![](img/inline4.1.jpg)。）


    所以，让我们再次讨论我们开始时提出的问题：“什么是机器学习？”它与上面给出的例子有什么关系？现在，仔细回答这个问题，根据“机器学习”的含义，我们试图让机器学习。是的，我们将已知的数据输入机器并
    *训练* 它们。一旦机器得到适当训练，我们将 ***测试*** 机器，看看机器是否能够借助训练数据提供适当的答案。我们可以一直训练机器，直到它为我们提供最优化的结果。


    哦，就这么简单，对吧？机器学习现在变得简单明了了。


