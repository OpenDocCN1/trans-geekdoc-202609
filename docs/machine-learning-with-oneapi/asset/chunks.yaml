    ### 6.3.2 Time Series Prediction

    A time series is a collection of values or observations of data gathered over
    a period of time through repeated measurements. Time series prediction or forecasting
    use regression analysis widely for predicting future values. Economic and sales
    forecasting, budgetary analysis, stock market analysis, yield projections, process
    and quality control, inventory studies, temperature predictions, etc., are all
