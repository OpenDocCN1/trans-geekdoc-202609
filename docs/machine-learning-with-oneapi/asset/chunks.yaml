    ### 6.3.3 Biomedical Imaging

    Regression techniques are commonly useful in the medical imaging and radiology
    fields of research. They allow identification of the relationship between the
    various independent parameters for determining the target variable. Multiple regression
    analysis is basically used to predict disease progression from the data available
    in electronic format. Normally the regression analysis is widely used for evaluating
    the results gathered from visual grading experiments like medical images from
    radiological studies ([Figure 6.5](#c6.xhtml#f6.5)).


    ![Figure 6.5 Medical imaging using regression analysis.](images/fig6.5.jpg)


