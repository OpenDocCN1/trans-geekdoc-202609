    **Terminology of XGBoost**


    *   *Learning rate*: This simply means how fast the model learns. If the learning
    rate is very fast, we will skip the optimal solution. If it is too slow, we will
    need too many iterations to converge to the best values. So, using a good learning
    rate is crucial.


    *   *Maximum depth of a tree*: Increasing this value will make the model more
    complex and more likely to overfit. XGBoost aggressively consumes memory when
    training a deep tree!


    *   *colsample\_bytree*: This is a family of parameters for the subsampling of
    columns. All colsample\_by\* parameters have a range of \[0, 1\], the default
    value being 1, and specify the fraction of columns to be subsampled. colsample\_bytree
    is the subsample ratio of columns when constructing each tree. Subsampling occurs
    once for every tree constructed.


    *   *ALPHA*: The L1 regularization term on weights. Increasing this value will
    make the model more conservative: default =1; combats overfitting.


    *   *n\_estimators*: the number of runs XGBoost will try to learn. This is the
    number of trees you want to build before taking the maximum voting or averages
    of predictions. Higher number of trees gives you a better performance but makes
    your code slower.


    *   *tree\_method string \[default*\= *auto\]*: The tree construction algorithm
    used in XGBoost.


    *   *Hist*: A faster histogram optimized to approximate to greedy algorithm.


