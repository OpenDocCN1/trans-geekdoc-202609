    button, shown on the LHS (Left Hand Side), provides options for developers. Developers
    can create Python Notebooks with ease, and other options are also available. The
    consoles can even be chosen based on your requirements. Terminal options are also
    presented ([Figure 3.10)](#c3.xhtml#f3.10).


    ![Figure 3.10 Launch Pad.](images/fig3.10.jpg)

    [**Figure 3.10**](#c3.xhtml#re_f3.10) Launch Pad.


    On clicking the Python 3 Notebook Launcher, the user gets the Jupyter Notebook
    launched with the oneAPI Kernel as shown in [Figure 3.11](#c3.xhtml#f3.11).


    ![Figure 3.11 Jupyter Notebook Launch.](images/fig3.11.jpg)

    [**Figure 3.11**](#c3.xhtml#re_f3.11) Jupyter Notebook Launch.


    Let’s understand how to use the Jupyter lab, step by step.


    The first step is to get the Notebook saved. From the file menu, click “Save”
    as an option to save the Notebook, with a desired name for the file. One can have
    a look at [Figure 3.12](#c3.xhtml#f3.12) to understand same.


    ![Figure 3.12 Save the Notebook.](images/fig3.12.jpg)

    [**Figure 3.12**](#c3.xhtml#re_f3.12) Save the Notebook.


    Jupyter Notebooks provide a great workspace, with in-browser coding, where we
    can define variables, work with them at our own pace, and analyse them as we go.


    Why is it named Jupyter? Jupyter is an anagram of: Julia, Python and R. Yes, you
    can use all of these with Jupyter.


    One can write code, add beautiful markdown text, images and insert YouTube videos
    with ease. This makes it more versatile and extremely easy to use.


    It is important to know how it is structured. The Jupyter Notebook is certainly
    a sequence of cells. The cell can contain HTML or Latex or Actual code, making
    it very easy for the developer. One can refer to [Figure 3.13](#c3.xhtml#f3.13)
    where text, code and equations are all included, which makes the Jupyter Notebook
    super cool to use.


    ![Figure 3.13 The super-flexible Jupyter Notebook.](images/fig3.13.jpg)

    [**Figure 3.13**](#c3.xhtml#re_f3.13) The super-flexible Jupyter Notebook.


    The code is all divided into smaller cells, and enables developers to have greater
    control. Also, it facilitates those developers with interactive development experience.


    Code is divided into cells to control execution.


    There are some cool magics available with the Jupyter Notebook (see [Figure 3.14)](#c3.xhtml#f3.14).


    ![Figure 3.14 Jupyter cell magics.](images/fig3.14.jpg)

    [**Figure 3.14**](#c3.xhtml#re_f3.14) Jupyter cell magics.


    *   `%matplotlib inline`: Display plots inline in the Jupyter Notebook

    *   `%%timeit`: Time how long a cell takes to execute and the same is presented
    below as an instance.


    One can execute code from another Notebook or Python file with ease in the Jupyter
    Lab. Here is the option. `%run filename.ipynb`, where `filename.ipynb` is the
    one to be pulled for execution. One can refer to [Figure 3.15](#c3.xhtml#f3.15)
    (below) to understand how to perform this task.


    ![Figure 3.15 The execution of another Notebook from the current one.](images/fig3.15.jpg)

    [**Figure 3.15**](#c3.xhtml#re_f3.15) The execution of another Notebook from the
    current one.


    Similarly, `%load filename.py`: copies the contents of the file and pastes them
    into the cell prescribed and the reader can try this out.


    ## 3.4 Jupyter Installation


    If developers wish to install Jupyter locally in their machine and try out developments,
    this is also possible and this subsection summarizes it.


    1. For the installation of the Jupyter, one should open the Anaconda Prompt. Many
