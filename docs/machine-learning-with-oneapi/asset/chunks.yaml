    ## 3.5 DevCloud 为软件开发者提供什么？


    看到 DevCloud 能提供的内容，开发者应该感到欣喜。


    首先，可以在 CPU、GPU 和 FPGA 架构上测试性能。可以利用多种加速器选项运行其工作负载（图 3.26）。


