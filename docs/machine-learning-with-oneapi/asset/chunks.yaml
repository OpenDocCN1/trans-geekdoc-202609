    Next, one needs to update conda with the command “conda update conda”. One will
    receive the “status completion” message on correct execution (see [Figure 12.2](#c12.xhtml#f12.2)).


    ![Figure 12.2 Conda update screen.](images/fig12.2.jpg)


    [**Figure 12.2**](#c12.xhtml#re_f12.2) Conda update screen.


    Add the Intel channel as the next step. One needs to inform conda to choose the
    Intel packages rather than the default packages, when available, by issuing the
    command “conda config --add channels intel” (see [Figure 12.3](#c12.xhtml#f12.3)).


    ![Figure 12.3 Add Intel channel.](images/fig12.3.jpg)


    [**Figure 12.3**](#c12.xhtml#re_f12.3) Add Intel channel.


    As the next step, install Intel Distribution for Python via conda. It is recommended
    that you create a new environment when installing. To install the core python3
    environment, issue the command “conda create -n idp intelpython3\_core python=3.x”.
    One can refer to the below screenshot to understanding the process ([Figure 12.4](#c12.xhtml#f12.4)).


