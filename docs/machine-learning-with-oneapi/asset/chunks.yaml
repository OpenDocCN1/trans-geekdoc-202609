    # 9 Bagging


    DOI: [10.1201/9781003393122-9](https://doi.org/10.1201/9781003393122-9)


    ## Learning Objectives


    After going through this chapter, the reader should be able to understand the
    following:


    *   What is ensemble learning?


    *   Types of ensemble learning.


    *   What is bagging?


    *   Why is bagging important?


    *   Variance and bagging – what’s the relationship?


    *   Major benefits and challenges of bagging.


    *   Applications of bagging.


    *   Implementation of bagging.


    ## 9.1 Introduction


    “Alone, we can do so little; together, we can do so much,” the famous saying by
    Helen Keller is what comes to mind when we talk about ensemble learning. Yes,
    the ensemble model brings the concept of combining multiple models to improve
    the predictability of models. This is what we need to understand at the start
    as bagging, boosting, etc. are the various methods that we use in ensemble modeling.
    Hence, it is very important to understand what ensemble modeling is before we
    start digging on bagging.


    ## 9.2 What Is Ensemble Learning?


    Ensemble methods combine multiple algorithms and are commonly used for regression
    and classification. These methods are mainly used by those models where they reduce
    bias and variance to improve the accuracy of the models. They use the concept
    of base learners. They incorporate the predictions from all base learners/models
    to build a more accurate model. Let’s consider the case of a brainstorming session,
    where multiple suggestions might improve the accuracy of the idea being discussed.


    In [Figure 9.1](#c9.xhtml#f9.1), it is understood that we consider the dataset
    and train with various models. Once the training of the model is done, we use
    a “combiner” to get the best predictions. A single model would be considered as
    a single base learner, which may not be able to give accurate results due to a
    high variance or high bias. Hence, multiple single learners are combined, which
    helps to reduce the bias or variance for producing an optimal model for better
    performance.


    ![Figure 9.1 Ensemble learning.](images/fig9.1.jpg)


    [**Figure 9.1**](#c9.xhtml#re_f9.1) Ensemble learning.


    ## 9.3 Types of Ensemble Learning


    Ensemble learning is basically divided into homogenous and heterogeneous, where
    bagging and boosting come under homogeneous ensemble learning techniques, as shown
    in [Figure 9.2](#c9.xhtml#f9.2). Stacking comes under heterogeneous ensemble learning
    techniques. Random forest and XGBoost are very well-known and effective homogeneous
    ensemble learning algorithms used for efficient predictions.


    ![Figure 9.2 Types of ensemble learning.](images/fig9.2.jpg)


    [**Figure 9.2**](#c9.xhtml#re_f9.2) Types of ensemble learning.


    ## 9.4 What Is Bagging?


    Bagging, otherwise known as bootstrap aggregating, is a homogeneous ensemble learning
    technique. As you know, the aim is to help improve the performance and accuracy
    of the model to bring about the most optimized prediction model. Bagging has the
    capability to reduce the bias and variance or, in other words, to deal with a
    bias–variance trade-off to achieve an optimized prediction model. Hence, it prevents
    the overfitting of the trained data. Bagging is most commonly used for regression
    and classification models and works best for decision tree classification algorithms.
    Now, coming back to the process of bagging, in this technique, the weak or single
    learners are trained in parallel. Mainly, bagging has three main steps, such as
    bootstrapping, training done in parallel and aggregation.


    ### 9.4.1 Bootstrapping


    This is the first step where training samples are randomly generated from the
    dataset. The same can be visualized in [Figure 9.3](#c9.xhtml#f9.3).


    ![Figure 9.3 Bootstrapping samples.](images/fig9.3.jpg)


    [**Figure 9.3**](#c9.xhtml#re_f9.3) Bootstrapping samples.


    ### 9.4.2 Aggregation and Optimized Predictions


    The bootstrap samples are used with models that work in parallel. They would be
    aggregated by ensemble models to provide optimized predictions as shown in [Figure
    9.4](#c9.xhtml#f9.4).


    ![Figure 9.4 Complete bagging process.](images/fig9.4.jpg)


    [**Figure 9.4**](#c9.xhtml#re_f9.4) Complete bagging process.


    ### 9.4.3 Steps in Bagging


    Bagging is also called bootstrap aggregations. The major steps in bagging are
    summarized as follows:


    1.  Bootstrap samples are randomly generated from the original dataset population.


    2.  A base model is applied to all individual bootstrap samples.


    3.  Each of the models is learned in parallel with corresponding bootstrap samples
    individually.


    4.  Optimized predictions are given based on the combined predictions from each
    of the models (mostly by using a combiner, ensemble model or majority voting).


    ## 9.5 Why Is Bagging Important?'
