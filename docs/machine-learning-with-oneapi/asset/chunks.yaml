- raw: 'Consider that a student is given a dataset with a set of dog and cat images,
    with absolutely no labels ([Figure 4.11](#c4.xhtml#f4.11)). Everyday, this dataset
    is given to the student and, after a week, the student is asked to group together
    the similar images in the dataset. What do you think the student will do? The
    student has been going through the different types of images given for a week
    and would have been smart enough to identify the features of both the cat and
    the dog images. By the end of the week, if different sets of images are given,
    obviously with the collective knowledge he has gathered through the process of
    mapping the features of dogs and cats, the student will, at least to some extent,
    map or group the cat and dog images properly. Yes, there are some cutie dogs that
    resemble cats, but we can’t help that – hence, there may be some misclassifications.


    ![Figure 4.11 The unsupervised learning process.](images/fig4.11.jpg)


    [**Figure 4.11**](#c4.xhtml#re_f4.11) The unsupervised learning process.


    Given a set of data, the algorithm will categorize them and give this categorization
    as the output. Each category (dog, cat) is referred to as a cluster. The labels
    for the clusters are to be manually tagged later. The categorization is based
    on the features in the data points. The unsupervised learning algorithms are also
    referred as clustering algorithms. Consider the same case discussed for supervised
    learning, with apples and tomatoes. Here, the model will take in all images and
    give out two clusters. One cluster will be “apple” whereas the other cluster will
    have all the photos of “tomato.” When a new image is given to the model, it will
    be placed in one of the two clusters based on its features.


    ### 4.4.3 Reinforcement Learning Algorithm


    The reinforcement learning algorithm is a machine learning algorithm, which uses
    the computer agent to learn the optimal behaviour of the environment and ought
    to take appropriate actions to achieve the maximum reward. This is mainly about
    the decision-making process, for which the feedback obtained is crucial. This
    is a feedback-based learning process. This method of learning is used in most
    of the robots and computer-based games. Here, the input need not have labeled
    data. Instead, the model learns by interacting with the environment and receiving
    feedback from it. The first time the model picks a decision, based on the feedback,
    the model learns whether its decision is right or wrong. So, this supervised learning
    relaxes the task of giving completely labeled data for training. A very common
    example is a computer chess game, if the computer loses while playing with you,
    then the program will remember all the steps that the player and the system made.
    Next time, the same strategy won’t work in the system and eventually the player
    will lose to the program.


    Oh, does all this seem to be Greek or Latin to you? Don’t worry, we will use an
    example to understand the process.


    Let’s take a simple example for reinforcement learning. Consider a mom teaching
    her kid, and, when he makes a mistake, the mom gives feedback which could be helpful
    to him the very next time ([Figure 4.12](#c4.xhtml#f4.12)).


    ![Figure 4.12 Reinforcement learning.](images/fig4.12.jpg)


    [**Figure 4.12**](#c4.xhtml#re_f4.12) Reinforcement learning.


    ### 4.4.4 Evolutionary Approach


    This strategy is still evolving and is not an easy one. These types of algorithms
    imitate natural evolution to solve a particular problem. For instance, genetic
    algorithms can be employed to solve a problem. This is beyond the scope of this
    book and hence is ignored for now.


    ## 4.5 So, Why Do We Need ML?


    This is a wonderful question, at the right time. By this time, it is obvious that
    we use our own experience to learn things. Say, for a simple example, going back
    to childhood. Yes, childhood is a treasure chest full of experiences, right? So,
    why not take another example?!


    Do you ever remember the very first time your hand got hurt toughing a hot vessel
    in the kitchen? Unless that was a big accident, no one usually even remembers
    that instance? However, now you are old, do you still need somebody’s assistance
    to understand whether a vessel is hot, and you shouldn’t touch it? Here, you could
    understand the experiential learning. Maybe, when you were a kid, you would have
    touched a hot pot and instantly you would have got the impulse. That feedback
    stays in your collective memory and, whenever you see a pot, you just take a precaution
    to determine whether it is hot or not.


    Yes, we humans have intelligence to do all of these things. But we cannot reach
    everywhere and always do such a sort of things. But we have the intelligence to
    program a machine to follow our orders. This is exactly what we are trying to
    do in machine learning. So why do we do all these things? The reason is this will
    make our lives easy. If we can build an interactive and self-adaptive learning
    algorithm for a machine and if we could train the machine in the way that we need
    to achieve things, there is nothing like it. However, everything has its own flaws
    coming along. As humans, first, we should know where to limit the use of machines
    and to what extent. Anything and everything could be trained for negative intentions,
    too.


    Where humans cannot achieve accuracy, yes, machines could bring it. So, making
    the machines work using human intelligence is a good strategy. Machines with ML
    algorithms don’t require explicit human intervention, as mentioned earlier, and
    machines can always adapt to the environment, learn from feedback and avoid repeated
    mistakes.


    ## 4.6 Machine Learning Framework


    A machine learning framework has various steps, which use math, tools and techniques.
    The first step is all about gathering data from alternative relevant sources.
    It all starts from the data, as data acts as the fuel for the whole process. The
    next step is basically data cleansing or an extensive exploratory data analysis
    step, where we need to clean and understand the data as much as possible, as this
    will help later processes to be smooth, easy and inferential. Building the appropriate
    model is the next step in the process. Training and testing need to be done. The
    most important step is understanding the patterns from the results and making
    the correct inferences for the betterment of the whole process itself. Visualization
    techniques could be of great help, to identify the hidden golden nuggets of information
    from the results. This concludes the flow of the ML framework. However, as a picture
    can speak a thousand words, let’s depict the whole process flow as a simple diagrammatic
    representation ([Figure 4.13](#c4.xhtml#f4.13)).


    ![Figure 4.13 Machine learning framework.](images/fig4.13.jpg)


    [**Figure 4.13**](#c4.xhtml#re_f4.13) Machine learning framework.


    ## 4.7 Machine Learning *vs* Deep Learning


    We have been talking about machine learning algorithms, their types, framework,
    etc. Now, it is time to dive a little bit deeper and understand the major differences
    between ML and DL algorithms. The difference in their process flow can be best
    understood from [Figure 4.14](#c4.xhtml#f4.14).


    ![Figure 4.14 Difference in process flow with ML and DL.](images/fig4.14.jpg)


    [**Figure 4.14**](#c4.xhtml#re_f4.14) Difference in process flow with ML and DL.


    ## 4.8 Common Applications of ML


    Some of the common ML applications you will have already experienced in your life
    include:


    *   FB (Facebook) recommending you friends.


    *   Amazon recommending you products.


    *   Flipkart recommending you products.


    *   Netflix recommendations'
