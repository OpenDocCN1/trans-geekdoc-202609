    *   One can also deploy on-premises, on-device or in the cloud which reflects
    the flexibility offered by OpenVINO.


    *   All of the OpenVINO tutorials are outlined @ [https://docs.openvino.ai/2022.2/tutorials.html](https://docs.openvino.ai).


    *   The sample codes and tutorials can be launched through the Binder and developers
