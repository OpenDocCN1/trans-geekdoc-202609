    # 11 聚类技术和主成分分析


    DOI: [10.1201/9781003393122-11](https://doi.org/10.1201/9781003393122-11)


    ## 学习目标


    阅读本章后，读者应能够理解以下内容：


    * `K-means clustering`

    * `K-means clustering` 实现

    * 维度灾难

    * 主成分分析 (`PCA`)

    * `PCA` 实现


    ## 11.1 引言


    简单来说，聚类是一种将数据分组到簇中的方法或技术。簇内的对象应具有较高的相似性。例如，在医学学生的数据集中，一年级学生代表一个簇，二年级学生是一个簇，等等。一个簇中的对象应与另一个簇中的对象不同；例如，一年级工程学生是一个簇，与一年级医学学生的第二个簇不相似。这两个簇是不相交的。聚类有助于将完整数据集划分为多个簇。这是一种无标签的、无监督的方法。可以通过参考
    图 11.1 来理解聚类。


    ![图 11.1 聚类。](img/fig11.1.jpg)


    **图 11.1** 聚类。


    现在是理解 `K-means clustering` 的时候了。


    ## 11.2 K-Means 聚类


    如前所述，聚类是一种将数据分组到簇中的方法或技术，簇内的对象比另一个簇中的对象具有更大的相似性。一个簇的对象应与另一个簇的对象明显不同。用一句话说，我们可以说所采用的度量是“相似性！”它是谈论对象之间关系
    的度量。


    接下来出现的问题是：为什么需要聚类？简单，它为您提供数据的探索性视图。通过聚类可以更好地了解数据。


    `K-means` 实际上称为“基于质心的聚类”。“什么是质心？”是下一个需要回答的问题！字典定义是质心是均匀密度几何对象的质心。嗯，在 ML 中，质心定义保持不变。它是簇中心的
    数据点。


    质心不一定是所考虑数据集的成员，尽管它可以是。


    这种聚类方法本质上是迭代的。这意味着算法会一直工作直到目标实现。取一个示例数据集并逐步解释聚类。


    本例中的挑战是将数据集中的八个对象分组到两个簇中。所有对象都有清晰可用的 `X`、`Y` 和 `Z` 坐标。我们如何识别 `K` 值？`K` 是簇的数量。这里是两个。因此，在本例中，`K`
    值设置为 2。

    '
