    深度神经网络（DNNs）的最新进展将计算机视觉算法的准确性提升到了更高水平。然而，部署和生产如此准确且有用的模型需要对计算方法以及硬件进行调整。`OpenVINO`
    通过集成各种工具，使 DNN 模型的优化成为一个简化和高效的过程。`OpenVINO` 工具包基于最新一代的人工神经网络（ANN），例如 CNN，以及循环和基于注意力的网络。


    `OpenVINO` 工具包通过采用预定函数的库以及预优化的内核，最大化性能并加速应用程序开发。此外，其他计算机视觉工具，例如 `OpenCV`（开源计算机视觉库）、`OpenCL`
    内核等，也包含在 `OpenVINO` 工具包中。`OpenCL`™（开放计算语言）是一种用于异构计算的低级 API，可在 GPU 上运行。


    ## 12.2.2 OpenVINO 的优势


    优势包括：

    * 通过在不同的 Intel 处理器和加速器上启用简单执行方法来加速性能，例如 `CPU`、`GPU`/Intel 处理器图形、`VPU`（向量处理单元）和
    `FPGA`。

    * 通过提供一种集中方法来实现数十个 `DL` 模型，从而简化深度学习（`DL`）部署。

    * 在没有框架开销负担的情况下自定义 `DL` 模型层，实现各种加速器的并行编程。

    * 允许用户在私有应用程序中扩展人工智能（`AI`）。

    * 通过 `Model Optimizer`、`Intermediate Representation`、`nGraph` 集成等流程，将 `AI` 优化一直延伸到云端。

    * `nGraph` 库是一个开源的 C++ 库以及 `DL` 网络的运行时/编译器套件。这促进了在任意数量的硬件架构上使用首选的深度学习框架，用于训练和推理。


    ## 12.2.3 最新版本是什么？


    最新版本是 2022.3 LTS（长期支持），并具有出色的功能。这使得开发人员创新变得非常容易。新版本为开发人员提供更多面向性能的开发、更多深度学习模型、增强的设备可移植性，更重要的是，在代码更改极少的情况下改善推理性能。


    最新版本为开发人员提供：

    1. a. 更广泛的模型和硬件支持。

    2. b. 扩展的模型覆盖范围。

    3. c. 改进的 API 和更多集成。


