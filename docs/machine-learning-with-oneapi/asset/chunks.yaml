    ![Figure 12.14 Jupyter Notebook – image classification example.](images/fig12.14.jpg)


    [**Figure 12.14**](#c12.xhtml#re_f12.14) Jupyter Notebook – image classification
    example.


    That’s it! We have come to the end of this book. We are certain that it was an
    enjoyable ride of learning!


    ## 12.2.6 Key Points to Remember


    *   Intel Distribution for Python is an optimized Python version and provides
