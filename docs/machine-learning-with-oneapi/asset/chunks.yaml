- raw: "Say, for example, you are given a dataset of animals as shown in [Figure 8.11](#c8.xhtml#f8.11),\
    \ and your job is to classify animals correctly using a random forest algorithm.\
    \ The random forest algorithm uses its dataset and creates random samples from\
    \ the given animal dataset. It is fed to the various decision tree models. Here,\
    \ each of the decision trees creates its predictions by using the different conditions\
    \ given. For example, decision tree 1 uses color = yellow as the initial condition\
    \ and proceeds to build the tree using the entropy and information gain. Maybe\
    \ decision tree 2 finds the information gain is more for the condition height\
    \ ≥20 and proceeds building the tree, etc. Thus, each of the decision tree models\
    \ might use different conditions for initial attribute selection. Once the decision\
    \ trees are formed, then comes the ensemble part, using majority voting. Say in\
    \ our example, given in [Figure 8.11](#c8.xhtml#f8.11), two of the decision trees\
    \ have predicted class 1, which is toucan (a brightly colored bird with large\
    \ curved beak) and one of the decision trees has predicted class 2, which is the\
    \ Gouldian finch (a small bird available in a variety of striking, vibrant colors).\
    \ According to the concept of majority voting used, we will stick with the final\
    \ prediction as class 1, which is toucan. Hopefully, the workings of the random\
    \ forest classifier is now clearer.\n\n![Figure 8.11 Random forest classifier\
    \ – a real-time example.](images/fig8.11.jpg)\n\n[**Figure 8.11**](#c8.xhtml#re_f8.11)\
    \ Random forest classifier – a real-time example.\n\n## 8.5 Advantages of Decision\
    \ Trees and Random Forests\n\nThe major features of decision trees are simple,\
    \ easy to visualize and infer results from them. Decision trees work well and\
    \ provide pretty good results, even on fewer data with lesser degrees of cleaning.\
    \ They can work well on both numerical and categorical data.\n\nThe major features\
    \ of random forests include employing various decision trees, which carries out\
    \ attribute selection in a unique way, unaffected by the curse of dimensionality\
    \ (or to make it simple, the number of features or dimensions), and using a parallel\
    \ execution to build the random forest. The final predictions are more reliable\
    \ than from decision trees as random forests use the ensemble model bagging for\
    \ optimal predictions. This makes the random forest algorithm more stable than\
    \ the decision tree one.\n\nThe major disadvantage of decision trees is that they\
    \ may overfit quickly, whereas the main disadvantage of random forests is the\
    \ heavy demand for computational resources.\n\n## 8.6 Applications of Decision\
    \ Trees and Random Forests\n\nBoth decision trees and random forests may be used\
    \ for real-time applications in finance, healthcare, customer churn rates, banking\
    \ sector, e-commerce, stock predictions, prediction of loan repayment by a customer,\
    \ etc.\n\n## 8.7 Decision Trees or Random Forest?\n\nLet’s first compare them\
    \ based on certain common factors, as shown in [Table 8.1](#c8.xhtml#t8.1).\n\n\
    \ [**Table 8.1**](#c8.xhtml#re_t8.1) Comparison of Decision Trees and Random Forest\n\
    \n| ![](images/Table8.1.jpg)  |\n\n| --- |\n\nThe decision to use decision tree\
    \ or random forest algorithms will completely depend on the real-time problem\
    \ that you are working on. From the comparison table above, it is clear that,\
    \ if you need fast prediction, then you should proceed with a decision tree, although\
    \ the accuracy may be compromised. Hence, it is clear, even though it is a time-consuming,\
    \ computationally expensive, slow process, if you are more focused on the accuracy\
    \ of the result, you should proceed with the random forest algorithm. As a random\
    \ forest algorithm uses a collection of decision trees, it might take more time\
    \ on large datasets, whereas simple decision tree algorithms will work faster\
    \ on large datasets. If you consider overfitting to be a significant problem,\
    \ then it would be preferable better to go with random forests than decision trees.\
    \ Decision trees are easy to visualize and interpret, whereas random forest is\
    \ more complicated and will be more complex to visualize and interpret as it involves\
    \ a collection of decision trees and requires more expertise to analyze and interpret.\n\
    \n## 8.8 Implementation\n\nLet’s code to understand the power of optimizations.\
    \ All these codes are made available in GitHub ([https://github.com/shriramkv/MachineLearningwithoneAPI](https://github.com))\
    \ for the ease of access for the reader. The code is run on the Intel DevCloud\
    \ and the results are presented for the reader’s clearer understanding about how\
    \ impactful the optimizations are and how powerful oneAPI is. The dataset used\
    \ is diabetes dataset.\n\n*   *Step 1:*\n\n![](images/inline8.1.jpg)\n\n*   *Step\
    \ 2:* We are going to compare the performance of the stock version of sklearn\
    \ with the Intel-optimized sklearn. Understand patching is the process which is\
    \ used to accelerate the process by using optimized versions. This process helps\
    \ us to understand the added value which the Intel-optimized version brings to\
    \ the table.\n\n![](images/inline8.2.jpg)\n\n*   *Step 3:* Now come the traditional\
    \ steps. Load the dataset and split it into the training and testing datasets.\
    \ We ideally keep 80% and 20% of the dataset as the training and testing datasets,\
    \ respectively. Then, normalization happens as shown below. If the reader is trying\
    \ this out in DevCloud, it is better to follow the sequence. Remember, the dataset\
    \ being considered is the diabetes dataset.\n\n![](images/inline8.3.jpg)\n\n*\
    \   *Step 4:* The next step is interesting and here is where the model is created.\
    \ One can see the stepwise presentation with the comment line, which makes understanding\
    \ easier. Once this part is executed correctly, the file name where the model\
    \ is stored will become available. Here, we saved the trained model into a Joblib\
    \ file. This will help you to use the trained model to use on test or unseen data.\
    \ This also helps the user to compare the trained model with other contemporary\
    \ models. Hence, saving the trained model is an important step.\n\n![](images/inline8.4.jpg)\n\
    \n*   *Step 5:* Loading the model is the next step, following which the prediction\
    \ can be made. Also, the time needed for execution is printed to compare the performance\
    \ of the two variants of sklearn, as mentioned earlier. The time for execution\
    \ is also printed on the execution.\n\n![](images/inline8.5.jpg)\n\nThe above\
    \ implementation is with the stock version of sklearn, so now it is time for us\
