    ![Figure 5.11 Datatype conversion.](images/fig5.11.jpg)


    [**Figure 5.11**](#c5.xhtml#re_f5.11) Datatype conversion.


    Handling missing data is a paramount task with the data. Data imputation is the
    simplest way experts follow when handling missed data. Imputation is the process
    of replacing missing data with substituted values and the same is presented in
    [Figure 5.12](#c5.xhtml#f5.12). Also, the reader could see that `NaN` (Not a Number)
