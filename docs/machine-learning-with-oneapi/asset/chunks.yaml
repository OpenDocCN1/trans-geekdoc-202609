    Now, `water_consumption` is a Pandas series. It’s simple, right? One could also
    note that it is properly indexed. The given data have been allocated proper indexing
    through this simple step.


    It was a simple piece of code that we have written. It is good to have indexing
    but is certainly better to have the corresponding dates in place of the index.
    The simple `pd.date_range` routine would be helpful to accomplish the task. We
    have six data entries and hence we will get six successive dates created through
    this step. One should remember that the series is created in the previous step
    and its name is `water_consumption`. And our series is now indexed differently.


    Also, note that the values of the series stayed the same. The index is reassigned
    to dates and that’s visible from the results, clearly.


    ![Figure 5.6 Adding date range to the series.](images/fig5.6.jpg)


    **Figure 5.6** Adding date range to the series.


    ### 5.3.4 Operations with the Series – It’s Fun


    One can retrieve the values from the series with the index. It is easy and is
    akin to using a dictionary. One could see the code snippet presented in [Figure
    5.7](#c5.xhtml#f5.7) to understand the same.


