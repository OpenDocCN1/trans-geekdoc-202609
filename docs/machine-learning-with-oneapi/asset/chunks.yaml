- raw: 'Firstly, there has been humongous growth recently in specialized workloads.
    Secondly, each hardware needs to use different programming languages and related
    libraries. This increases the challenges with respect to maintaining different
    code bases and repositories. Thirdly, though it is seen as an advantage with the
    increase in the number of tools, it is also a challenge for developers to learn
    to use different tools, particularly given the learning time involved. What we
    mean here is that the development of software for different hardware platforms
    like CPU (Central Processing Unit), GPU (Graphics Processing Unit) or FPGA (Field-Programmable
    Gate Array) requires different learning strategies, investments and eventually
    no guarantee of reusing that work with other architectures/hardware. Writing code
    once, then writing it again for another architecture is the biggest bugbear faced
    by software developers globally. Yes, this problem has to be solved and this is
    where oneAPI comes in.


    One can understand the aforesaid point by referring to [Figure 1.1](#c1.xhtml#f1.1).
    The figure presented is self-explanatory. The challenge to be solved is huge and
    that is where oneAPI comes in handy.


    ![Figure 1.1 The challenge.](images/fig1.1.jpg)


    [**Figure 1.1**](#c1.xhtml#re_f1.1) The challenge.


    One must first understand what oneAPI is all about. It is an open and standards-based
    multi-architecture programming model which addresses the programmers’ challenges.
    oneAPI provides the developers with total freedom and choice to select the hardware
    as CPU, GPU, or FPGA for enhanced computing. The vision behind the oneAPI’s creation
    is interesting. It aims to bring a unified software development environment across
    CPU, GPU and other accelerators.


    oneAPI is an industry initiative and is completely based on standards and open
    specifications.


    oneAPI has many features which developers certainly appreciate:


    *   First and foremost, developers can develop and deploy the software with absolute
    peace of mind.


    *   oneAPI includes libraries and has a unified language that can ensure complete
    native code performance.


    *   Freedom. oneAPI facilitates the native code performance across a range of
    hardware including CPUs, GPUs, FPGAs and AI (Artificial Intelligence) accelerators.


    *   Since it is of open-industry standards, it is certainly the best approach
    for the future.


    *   The biggest advantage lies with the excellent compatibility of oneAPI with
    the existing programming languages, including C++, Python, SYCL, Fortran and openMP
    languages.


    oneAPI is the foundational or base programming stack. One should see it as a facilitator
    to optimize the middleware and the upstream frameworks. One can achieve a clearer
    understanding of this point from [Figure 1.2](#c1.xhtml#f1.2). The reader can
    see that TensorFlow kind of frameworks sit above oneAPI, which is optimized for
    performance. The representation shown in [Figure 1.2](#c1.xhtml#f1.2) is enhanced
    and presented in [Figure 1.3](#c1.xhtml#f1.3) for extra clarity.


    ![Figure 1.2 The revolution – oneAPI (the industry initiative and Intel product).](images/fig1.2.jpg)


    [**Figure 1.2**](#c1.xhtml#re_f1.2) The revolution – oneAPI (the industry initiative
    and Intel product).


    ![Figure 1.3 Power of oneAPI.](images/fig1.3.jpg)


    [**Figure 1.3**](#c1.xhtml#re_f1.3) Power of oneAPI.


    The optimized applications go to the uppermost layer as one can see from Figure
    1.3, which leverages the middleware and the frameworks.


    oneAPI comes with powerful and advanced porting toolkits (this eases our job,
    folks, as it ports the code for us). Analysis tools, like the intel VTune profiler,
    intel advisor and debuggers, are also provided. This enables someone to debug
    the code or to analyse the performance across all levels of abstraction without
    any hindrance.


    Having explained what oneAPI is and what it brings to you as a developer, it is
    important to talk about another very important benefit oneAPI offers to developers.
    There is no proprietary lock-in associated with oneAPI and it is compatible with
    the code written in native languages such as C, C++ and more, as described earlier.


    In simple words, oneAPI provides developers with the option to choose the best
    of the architecture for a specific problem without forcing the developer to re-write
    the code for different architectures or platforms.


    oneAPI also promotes community and industry collaboration on a larger scale.


    Remember this – oneAPI is all about “Write once, deploy many times!”


    ## 1.2 Approaches – Direct Programming and API-Based Programming


    oneAPI is interesting. There are two options provided to developers for programming:
    direct programming and API-based programming. In addition, DPC++ provides the
    compatibility tool and the debug tools with oneAPI (see [Figure 1.4](#c1.xhtml#f1.4)).


    ![Figure 1.4 Programming model.](images/fig1.4.jpg)


    [**Figure 1.4**](#c1.xhtml#re_f1.4) Programming model.


    *   The developers working with CUDA (Compute Unified Device Application) find
    that migrating the existing CUDA code (CUDA Source Code) to the (Data Parallel
    C++) DPC++ (DPC++ Source Code) is easier with oneAPI. oneAPI provides you with
    the Intel DPC++ Compatibility Tool to migrate source code from CUDA to DPC++ with
    ease. There is a lot of assistance available with the migration, with almost 80–90%
    being carried out automatically. The best part is “inline comments,” which are
    also provided in an understandable manner for the developers to finish the porting.


    *   The Intel oneAPI DPC++ / C++ compiler is very powerful, and it supports direct
    programming. This approach comes in useful when the APIs are not available for
    the algorithms. The reader will be presented with more details about direct programming
    later. For direct programming, Data Parallel C++ is an evolution of C++ for productive
    data-centric coding that will target CPUs, GPUs FPGAs and AI accelerators.


    *   The next approach is API-based programming. There is a huge set of libraries
    catering to different domains and areas. Details of the libraries are presented
    in the following section, where readers will find a lot of information. Developers
    can just go ahead and use them without any challenge.


    *   Finally, in [Figure 1.4,](#c1.xhtml#f1.4) you can also see that the tools
    like Intel VTune Profiler and Intel Advisor are present, which can help in analyzing
    the performance.


    ## 1.3 Libraries – More Power to You


    oneAPI comes with a rich set of libraries, which enable the acceleration of domain-specific
    functions. All the libraries shown in [Figure 1.5](#c1.xhtml#f1.5) are preoptimized
    to ensure maximum performance. One can see that the libraries cater to vast domain
    requirements. These libraries simplify programming by providing developers with
    APIs.


    ![Figure 1.5 Power of oneAPI.](images/fig1.5.jpg)


    [**Figure 1.5**](#c1.xhtml#re_f1.5) Power of oneAPI.


    A brief note on each of these libraries is presented below:


    *   *Intel oneAPI Math Kernel Library*: One could use this library to develop
    the highly optimized math routines in their applications.


    *   *Intel oneAPI Deep Neural Network Library*: One could use this library to
    build the deep learning applications which use the neural networks optimized for
    the Intel hardware, be it processor or graphics.


    *   *Intel oneAPI Video Processing Library*: As the name indicates, this library
    can be very handy to accelerate video processing in the chosen application.


    *   *Intel oneAPI Data Analytics Library*: This is one of the best libraries,
    especially for industrial needs. One can use this library to combine high speed
    and performance in big data applications.


    *   *Intel oneAPI Threading Building Blocks*: Often known as TBB, these provide
    the developer with the opportunity to combine the TBB-based parallelism on the
    Multicore CPUs and the SYCL device-accelerated parallelism in the chosen application.'
