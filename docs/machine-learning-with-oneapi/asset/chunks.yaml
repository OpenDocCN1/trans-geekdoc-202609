- raw: '[Figure 4.3](#c4.xhtml#f4.3) correctly describes the machine learning process
    in a simple way. The machine takes a picture of an apple as an input, manually
    extracts the features of the apple and uses the information to learn. This is
    basically done by various machine learning algorithms which are available to create
    a ML-trained model. This ML-trained model is provided with test data to check
    whether the model identifies the apple accurately or not. The major point to be
    noted here is that, in any machine learning process, feature extraction is very
    important and could be done without human intervention.


    ![Figure 4.3 Machine learning process.](images/fig4.3.jpg)


    [**Figure 4.3**](#c4.xhtml#re_f4.3) Machine learning process.


    ## 4.3 Relationship between AI, ML and DL


    *Artificial Intelligence* (AI) is the broad area of research where researchers
    started thinking of introducing intelligence into machines. You may all know Sophia,
    the first humanoid robot who has citizenship of Saudi Arabia. Tang Yu is the AI-driven
    virtual robot CEO, who has been appointed to optimize operational efficiency.
    The whole concept of AI in the metaverse swirls around the fact that people don’t
    need to face any real-life risks as they do in a real-life environment.


    ![Figure 4.4 Humanoid robot Sophia, Robert CEO Tang Yu and AI in Metaverse.](images/fig4.4.jpg)


    **Figure 4.4** Humanoid robot Sophia, Robert CEO Tang Yu and AI in Metaverse.


    In this epoch of AI, ML is a beautiful subset of AI, which allows one to perform
    a specific task without any explicit interventions. Data from the past is provided
    to the system, the system extract features and learns from the patterns identified.
    Certain inferences are made from patterns and, accordingly, intelligent decisions
    are taken. Machine learning algorithms are auto-adaptive and hence no explicit
    human interventions are required for the learning process of models. Feature extraction
    is an important step in the whole process which helps the model to predict or
    classify the data appropriately.


    *Deep learning* (DL) is an advanced subset of AI, where a human brain is imitated
    in the processing and understanding of data. Neural networks tend to be the basis
    of deep learning, which mainly acts like a black box to grab data and yield wonderful
    insights. Interpreting the results from the deep neural networks requires good
    analytical skills so that the output obtained makes sense for other useful applications.


    [Figure 4.5](#c4.xhtml#f4.5) shows the relationship between AI, ML and DL. Some
    of the major applications of AI include natural language processing (NLP), visual
    perception by visualization techniques, automated programming platforms like no
    code, AI-driven robots for strenuous jobs and household jobs, knowledge representation
    and reasoning.


    ![Figure 4.5 Relationship between AI, ML and DL.](images/fig4.5.jpg)


    [**Figure 4.5**](#c4.xhtml#re_f4.5) Relationship between AI, ML and DL.


    Machine learning uses many algorithms like regression, classification, principal
    component analysis, clustering, etc. to detect the inferences from the data analyzed,
    using the models created. Multilayer perceptrons used in neural networks, with
    the help of various algorithms like CNN (convolutional neural networks), RNN (recurrent
    neural networks), GAN (generative adversarial networks), automatic feature extraction
    and prediction or classification, could be achieved using deep learning. The evolution
    of various categories of algorithm is portrayed in [Figure 4.6](#c4.xhtml#f4.6).


    ![Figure 4.6 Evolutionary progress of various algorithms.](images/fig4.6.jpg)


    [**Figure 4.6**](#c4.xhtml#re_f4.6) Evolutionary progress of various algorithms.


    ## 4.4 Types of Machine Learning


    Now that we have a deep understanding of the place of machine learning in the
    AI field of research, it is time for us to understand the various types of machine
    learning algorithms. Machine learning algorithms are mainly classified into three
    categories, as given below, although we can add a fourth category for in-depth
    understanding (see [Figure 4.7](#c4.xhtml#f4.7)).


    ![Figure 4.7 Types of machine Learning algorithms.](images/fig4.7.jpg)


    [**Figure 4.7**](#c4.xhtml#re_f4.7) Types of machine Learning algorithms.


    *   Supervised learning.


    *   Unsupervised learning.


    *   Reinforced learning.


    *   Evolutionary learning.


    Let’s have a deeper look into these types of machine learning and associated algorithms,
    with easy examples.


    ### 4.4.1 Supervised Learning Algorithms


    This algorithm makes use of labeled data gathered from the past to train the model
    and make the model predict or classify the test data, which are not labeled to
    check whether the model can predict or classify the data properly. Supervised
    machine learning algorithms use labeled data, but what is meant by that? It is
    simple: consider an example to understand the supervised learning process.


    You are provided with a dataset that contains images of both Cat and Dog ([Figure
    4.8](#c4.xhtml#f4.8)). All the images in the dataset are labeled properly; let’s
    say you have 1000 images of each of Cat and Dog. You are creating a supervised
    learning model where you train the model using 700 labeled Cat data and 700 labeled
    Dog data. You have kept 300 Cat and 300 Dog images as test data ([Figure 4.9](#c4.xhtml#f4.9)).
    Once the supervised machine learning model is created, we will make the model
    predict these test data and check the accuracy of the model created.


    ![Figure 4.8 Sample – cat- and dog-labeled training dataset.](images/fig4.8.jpg)


    [**Figure 4.8**](#c4.xhtml#re_f4.8) Sample – cat- and dog-labeled training dataset.


    ![Figure 4.9 Sample test dataset with names as cat\_or \_dog\_1 and cat\_or \_dog\_2.](images/fig4.9.jpg)


    [**Figure 4.9**](#c4.xhtml#re_f4.9) Sample test dataset with names as cat\_or
    \_dog\_1 and cat\_or \_dog\_2.


    As we now understand what’s in the datasets, we shall proceed with the process.


    The complete supervised learning process is described in [Figure 4.10](#c4.xhtml#f4.10).
    In the supervised learning model, we work with labeled data, which are fed into
    the model for training; once the model is trained, test data are fed into the
    model to either classify or predict the test data. The accuracy of model prediction
    is usually calculated as an evaluation metric to understand the efficacy of the
    trained model.


    ![Figure 4.10 The complete supervised learning process.](images/fig4.10.jpg)


    [**Figure 4.10**](#c4.xhtml#re_f4.10) The complete supervised learning process.


    One major point to be noted here is that, if the model is trained using wrong
    labeled data, of course, the model will predict in a wrong manner. Hence, the
    training data fed to the model need to be appropriately labeled ones. Another
    scenario might be where the model is trained with a certain labeled dataset but
    an entirely new dataset is given for prediction; the percentage accuracy will
    be extremely low. This is quite understandable. If you have Cats and Dogs in the
    dataset, which is given for training the model, and if you give the test dataset
    as Crocodile images, there is a higher chance that the trained model might not
    be able to predict or will incorrectly predict the data.


    Figure 4.1, depicting a teacher teaching a student about the apple, is also an
    example of supervised learning. Maybe you should revisit that example once again
    to register the concept well in your mind.


    ### 4.4.2 Unsupervised Learning Algorithm


    This approach is different from the supervised learning model, as there are no
    labels associated with the data. Also, there is no explicit training and testing
    phases in the unsupervised learning method. Oh, is this not confusing? Then, how
    will the model be able to predict? Yes, there is a way, and we can understand
    it by using the following simple example.'
