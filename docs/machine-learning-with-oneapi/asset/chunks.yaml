    ## 1.1 引言

    首先，近期在专用工作负载方面出现了巨大的增长。其次，每个硬件都需要使用不同的编程语言和相关库。这增加了维护不同代码库和存储库方面的挑战。第三，虽然工具数量的增加被视为优势，但对于开发者来说学习使用不同工具也是一种挑战，特别是考虑到所需学习时间。我们这里的意思是，为
    CPU（中央处理单元）、GPU（图形处理单元）或 FPGA（现场可编程门阵列）等不同硬件平台开发软件需要不同的学习策略、投入，并且最终无法保证将该工作在其他架构/硬件上重复使用。一次编写代码，然后为另一种架构再次编写代码，是全球软件开发者面临的最大痛点。是的，这个问题必须解决，而这正是
    oneAPI 发挥作用的地方。


    可以通过参考 图 1.1 来理解上述观点。所呈现的图是自解释的。需要解决的挑战是巨大的，而这正是 oneAPI 派上用场的地方。


    ![图 1.1 挑战。](img/fig1.1.jpg)


    **图 1.1** 挑战。


    首先必须了解 oneAPI 的本质是什么。它是一种开放且基于标准的跨架构编程模型，可解决程序员的挑战。oneAPI 为开发者提供完全的自由和选择，可选择 CPU、GPU
    或 FPGA 等硬件以实现增强计算。oneAPI 创建背后的愿景很有趣。它旨在在 CPU、GPU 和其他加速器之间建立统一的软件开发环境。


    oneAPI 是一个行业倡议，完全基于标准和开放规范。


    oneAPI 具有许多开发者肯定会欣赏的功能：

    * 首先，开发者可以安心地开发和部署软件。

    * oneAPI 包含库并具有统一语言，可确保完整的原生代码性能。

    * 自由。oneAPI 在包括 CPU、GPU、FPGA 和 AI（人工智能）加速器在内的多种硬件上实现原生代码性能。

    * 由于其符合开放行业标准，这无疑是未来的最佳方法。

    * 最大的优势在于 oneAPI 与现有编程语言的出色兼容性，包括 C++、Python、SYCL、Fortran 和 openMP 语言。


    oneAPI 是基础或底层编程栈。应将其视为优化中间件和上游框架的促进者。可以通过 图 1.2 更清晰地理解这一点。读者可以看到 TensorFlow 之类的框架位于
    oneAPI 之上，而 oneAPI 已针对性能进行了优化。图 1.2 中显示的表示已增强并在 图 1.3 中呈现以获得额外清晰度。


    ![图 1.2 革命 – oneAPI（行业倡议和 Intel 产品）。](img/fig1.2.jpg)


    **图 1.2** 革命 – oneAPI（行业倡议和 Intel 产品）。


    ![图 1.3 oneAPI 的力量。](img/fig1.3.jpg)


    **图 1.3** oneAPI 的力量。


    正如图 1.3 所示，经过优化的应用程序会进入最上层，该层利用了中间件和框架。


    oneAPI 配备了功能强大且先进的移植工具包（这简化了我们的工作，大家，因为它为我们移植代码）。还提供了分析工具，如 intel VTune 分析器、intel
    advisor 和调试器。这使得某人能够在所有抽象级别上调试代码或分析性能而不会受到任何阻碍。


    在解释了 oneAPI 是什么以及它为开发者带来什么之后，谈谈 oneAPI 为开发者提供的另一个非常重要的好处很重要。与 oneAPI 无关的专有锁定，并且它与用原生语言（如
    C、C++ 等）编写的代码兼容，如前所述。


    简单来说，oneAPI 为开发者提供选择特定问题的最佳架构的选项，而无需强制开发者为不同架构或平台重写代码。


    oneAPI 还在更大规模上促进社区和行业协作。


    记住这一点 – oneAPI 的全部意义在于“一次编写，多次部署！”


    ## 1.2 方法 – 直接编程和基于 API 的编程

    oneAPI 很吸引人。为开发者提供的编程选项有两种：直接编程和基于 API 的编程。此外，DPC++ 提供了与 oneAPI 的兼容性工具和调试工具（参见
    图 1.4）。


    ![图 1.4 编程模型。](img/fig1.4.jpg)


    **图 1.4** 编程模型。


    * 使用 CUDA（Compute Unified Device Application）的开发者发现，使用 oneAPI 将现有 CUDA 代码（CUDA
    源代码）迁移到（Data Parallel C++）DPC++（DPC++ 源代码）更容易。oneAPI 为您提供 Intel DPC++ 兼容性工具，可轻松地将源代码从
    CUDA 迁移到 DPC++。迁移过程中有大量帮助，几乎 80–90% 可自动完成。最好的是“内联注释”，这些注释也以易于理解的方式提供给开发者以完成移植。

    * Intel oneAPI DPC++ / C++ 编译器非常强大，并支持直接编程。当算法不可用 API 时，这种方法非常有用。读者稍后将了解有关直接编程的更多详细信息。对于直接编程，Data
    Parallel C++ 是 C++ 的演进，适用于面向生产力的数据中心编码，将针对 CPU、GPU FPGA 和 AI 加速器。

    * 下一种方法是基于 API 的编程。有大量库可满足不同的领域和区域。库的详细信息将在下一节中介绍，读者将在其中找到大量信息。开发者可以毫不费力地直接使用它们。

    * 最后，在 图 1.4， 你还可以看到像 Intel VTune Profiler 和 Intel Advisor 这样的工具，它们可以帮助分析性能。


    ## 1.3 库 – 更强大的功能

    oneAPI 配备了丰富的库，可实现特定领域的函数加速。图 1.5 中显示的所有库都已预先优化以确保最大性能。可以看出，这些库满足了广泛的领域需求。这些库通过为开发者提供
    API 简化了编程。


    ![图 1.5 oneAPI 的力量。](img/fig1.5.jpg)


    **图 1.5** oneAPI 的力量。


    以下是对这些库的简要说明：

    * `Intel oneAPI Math Kernel Library`：可以使用此库在应用程序中开发高度优化的数学例程。

    * `Intel oneAPI Deep Neural Network Library`：可以使用此库构建使用针对 Intel 硬件（无论是处理器还是图形）优化的神经网络的深度学习应用程序。

    * `Intel oneAPI Video Processing Library`：如名称所示，此库可非常方便地加速所选应用程序中的视频处理。

    * `Intel oneAPI Data Analytics Library`：这是最好的库之一，尤其适用于工业需求。可以使用此库在大数据应用程序中结合高速和性能。

    * `Intel oneAPI Threading Building Blocks`：通常称为 TBB，它们为开发者提供了在所选应用程序中结合基于 TBB
    的多核 CPU 并行性和 SYCL 设备加速并行性的机会。

