  trans: "\n\n![图 5.17 转置操作。](img/fig5.17.jpg)\n\n**图 5.17** 转置操作。\n\n可以很容易地通过下面的代码片段找到数据框的维度。\n\
    \n![图 5.18 数据框的维度。](img/fig5.18.jpg)\n\n**图 5.18** 数据框的维度。\n\n切片选项也很有趣。用数据框进行切片很容易。可以看到数据框中切片是如何轻松实现的，如图\
    \ 5.19 所示。它切片了前三个条目，我们收到了输出。\n\n![图 5.19 切片。](img/fig5.19.jpg)\n\n**图 5.19** 切片。\n\
    \n也可以按相反顺序切片，这在图 5.20 中进行了演示，以便更快地参考。\n\n![图 5.20 反向切片。](img/fig5.20.jpg)\n\n\
    **图 5.20** 反向切片。\n\n可以通过 `Pandas` 轻松获得数据框中每个数据条目的出现次数。方法 `value_counts()` 有助于完成此任务。可以从图\
    \ 5.21 看到其实现方式。\n\n![图 5.21 计数出现次数。](img/fig5.21.jpg)\n\n**图 5.21** 计数出现次数。\n\n\
    为了过滤并获得结果，`Pandas` 提供了更简单的方法。可以看到基于 `water_need` 大于 10 过滤后的结果，如图 5.22 所示。\n\n\
    ![图 5.22 过滤。](img/fig5.22.jpg)\n\n**图 5.22** 过滤。\n\n如果有人想从数据框中删除列或行，也很容易。\n\n\
    最初，数据框有四列。要删除特定列，应将要删除的列名与 `axis` 描述为 1 一起包含，如下面代码片段所示，该片段以图 5.23 呈现。呈现的输出中不包含列\
    \ `ID`。\n\n![图 5.23 从数据框中删除列。](img/fig5.23.jpg)\n\n**图 5.23** 从数据框中删除列。\n\n同样，也可以删除特定行；为此，`axis`\
    \ 应描述为 0 并提及行索引。下面的代码片段（图 5.24）和获得的结果将帮助读者理解这一点。这里可以注意到第 2 行（`Lion`）被删除了。\n\n\
    ![图 5.24 从数据框中删除行。](img/fig5.24.jpg)\n\n**图 5.24** 从数据框中删除行。\n\n关于数据框就足够了——是时候学习可视化了。是的，这很重要。\n\
    \n## 5.4 让我们可视化\n\n没有理解的数据或结果不会提供任何有用的见解。适当的视觉化将使用户获得有用的见解。“图像胜于言表”是一句谚语，在数据分析中它\
    \ 100% 成立！\n\n这是学习的令人兴奋的部分。输出可视化可以通过多种方式创建，例如 `matplotlib` 和 `seaborn`。\n\n* \
    \  `Matplotlib` 是用于创建绘图和图形的主要库之一。它有很多功能。`Matplotlib` 是一个用于在 Python 中创建静态、动画和交互式可视化的综合库。由于\
    \ `Pandas` 提供了围绕 `matplotlib` API 的非常易于使用和方便的包装，因此更易于为某人创建绘图。\n\n*   `Seaborn`\
    \ 是一个基于 `matplotlib` 的 Python 数据可视化库。它提供了一个高级接口来绘制有吸引力且信息丰富的统计图形。\n\n第一步是什么？嗯，就是导入，可以通过图\
    \ 5.25 所示的代码片段了解我们如何导入 `matplotlib` 和 `seaborn`。\n\n![图 5.25 导入 matplotlib 和 seaborn。注意：seaborn\
    \ 现在是“sea”，matplotlib 对读者来说是“plot”。](img/fig5.25.jpg)\n\n**图 5.25** 导入 `matplotlib`\
    \ 和 `seaborn`。注意：`seaborn` 现在是 \"`sea`\"，`matplotlib` 对读者来说是 \"`plot`\"。\n\n本章之前显示的同一动物数据集进一步增强为更大的数据集。可以参考图\
    \ 5.13 来可视化早期版本，并参考图 5.26 来了解增强内容。\n\n![图 5.26 扩展数据集。](img/fig5.26.jpg)\n\n**图\
    \ 5.26** 扩展数据集。\n\n1.  a. *柱状图 – 从这里开始*：柱状图是用矩形条表示分类数据的图形，其高度或长度与所代表的值成比例。\n\n\
    \    条形图可以垂直或水平绘制。我们现在可以通过简单的代码片段呈现柱状图吗？可以清楚地看到针对所考虑数据集的柱状图绘制。`sea.barplot` 方法足以获得清晰的可视化。\n\
    \n    也可以使用 Hue 来完成。可以在图 5.28 中可视化相同内容。\n\n2.  b. *直方图*：直方图是使用不同高度的条形显示数据的图形显示。它类似于柱状图，但直方图将数字分组为范围。可以从代码片段和图\
    \ 5.29 所示的输出中了解如何获取直方图以及绘图的样子。\n\n    作为扩展，可以使用箱获取直方图。直方图中的箱是你在获得频率之前用来组合值的块（或分组）。例如，如果你正在创建年龄的直方图，箱可能是\
    \ 0–5、6–10、11–15，等等，直到 85 等等。可以参考图 5.30 以更好地理解概念。\n\n3.  c. *密度图*：密度图可视化数据在连续区间或时间段上的分布。该图表是直方图的变体，通过平滑噪声获得更平滑的分布。密度图的峰值有助于显示区间上集中的值。代码片段和由此开发的密度图以图\
    \ 5.31 呈现，供读者快速浏览。\n\n4.  d. *箱线图*：箱线图是给定数据集的统计五数概括的视觉表示。五数概括包括：# 最小值，第一四分位数，中位数（第二四分位数），第三四分位数，最大值。可以从图\
    \ 5.32 看到它是什么样子，其中也呈现了代码片段。\n\n5.  e. *散点图*：这有助于通过绘图揭示两个变量之间的关系。`import matplotlib.pyplot\
    \ as plot`。我们可以看代码吗？（参考图 5.33）。\n\n6.  f. 配对图：当你需要比较许多变量时，配对图是最好的选择。可以看到编码多么简单以及获得良好的结果（图\
    \ 5.34）。\n\n7.  g. *热力图*：热力图是我们需要理解和可视化的最终绘图。它简单而高效。可以参考图 5.35。\n\n![图 5.27 柱状图。](img/fig5.27.jpg)\n\
    \n**图 5.27** 柱状图。\n\n![图 5.28 带 Hue 的柱状图。](img/fig5.28.jpg)\n\n**图 5.28** 带 Hue\
    \ 的柱状图。\n\n![图 5.29 直方图。](img/fig5.29.jpg)\n\n**图 5.29** 直方图。\n\n![图 5.30 带分箱的直方图。](img/fig5.30.jpg)\n\
    \n**图 5.30** 带分箱的直方图。\n\n![图 5.31 密度图。](img/fig5.31.jpg)\n\n**图 5.31** 密度图。\n\n\
    ![图 5.32 箱线图。](img/fig5.32.jpg)\n\n**图 5.32** 箱线图。\n\n![图 5.33 散点图。](img/fig5.33.jpg)\n\
    \n**图 5.33** 散点图。\n\n![图 5.34 配对图。](img/fig5.34.jpg)\n\n**图 5.34** 配对图。\n\n![图\
    \ 5.35 热力图。](img/fig5.35.jpg)\n\n**图 5.35** 热力图。\n\n"
