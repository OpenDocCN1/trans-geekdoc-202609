    [**Figure 5.26**](#c5.xhtml#re_f5.26) Extended dataset.\n\n1.  a. *Bar Chart –\
    \ Let’s Start Here*: A bar chart is a figure that presents categorical data with\
    \ rectangular bars with heights or lengths proportional to the values that they\
    \ represent.\n\n    The bars can be plotted vertically or horizontally. Can we\
    \ present the bar chart now through a simple piece of code? One can see that the\
    \ bar chart plotting shown for the dataset considered is clear. Sea.barplot method\
    \ is sufficient to get a clear visualization.\n\n    The same can be done with\
    \ the Hue. One can visualize the same in [Figure 5.28](#c5.xhtml#f5.28).\n\n2.\
    \  b. *Histogram*: Histogram is a graphical display of data using bars of different\
    \ heights. It is similar to a Bar Chart, but a histogram groups numbers into ranges.\
    \ One can understand the way to get the histogram and what the plot looks like\
    \ from the bar code snippet and output shown in [Figure 5.29](#c5.xhtml#f5.29).\n\
    \n    As an extension, one can get the histograms with a bin. A bin in a histogram\
    \ is the block (or grouping) that you use to combine values before obtaining the\
    \ frequency. For instance, if you are creating a histogram of age, the bins might\
    \ be 0–5, 6–10, 11–15, and so on up to 85 and so on. One can refer to [Figure\
    \ 5.30](#c5.xhtml#f5.30) to understand the concept better.\n\n3.  c. *Density\
    \ Plot*: A density plot visualizes the distribution of data over a continuous\
    \ interval or time period. This chart is a variation of a histogram that obtains\
    \ smoother distribution by smoothing out the noise. The peaks of a density plot\
    \ help display the values that are concentrated over the interval. The code snippet\
    \ and the density plot developed from it is presented as [Figure 5.31](#c5.xhtml#f5.31)\
    \ for the reader’s quicker perusal.\n\n4.  d. *Box Plot*: A box plot is the visual\
    \ representation of the statistical five-number summary of a given dataset. A\
