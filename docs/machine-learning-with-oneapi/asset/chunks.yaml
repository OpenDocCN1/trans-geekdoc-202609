- raw: 'However, after sequential training, the weak learners become strong and will
    yield greater accuracy and performance. Say, for example, in this case, the model
    will use multiple learners, where one learner will effectively identify the features
    of the elephant and another learner will even identify the wide ears of the African
    elephant and might correctly classify without making the system fail. This, in
    turn, will improve the accuracy and performance of the system.


    ## 10.5 Bias and Boosting


    The weak learners are converted into strong learners in the boosting process.
    The models will have high bias and low variance. The boosting process is helpful
    for models with underfitting, as shown in [Figure 10.6](#c10.xhtml#f10.6).


    ![Figure 10.6 Various fitting scenarios.](images/fig10.6.jpg)


    [**Figure 10.6**](#c10.xhtml#re_f10.6) Various fitting scenarios.


    In the underfitting, we could clearly see how badly the learner fits the data
    points. It is best shown when a learner or model is used to show the residual
    errors. The data points that are incorrectly categorized would be assigned higher
    weights. This is actually a way to deal with the errors or residuals. As every
    time a new stronger learner/model is introduced, it will start making better predictions
    on the data observations and start correcting the misclassified predictions in
    the best way possible by the model. This will eventually reduce the errors and
    give optimized predictions, making the model a strong learner for the scenario.
    This is how bias and boosting are connected. However, boosting is good for regression
    and classification problems.


    ## 10.6 Major Applications of Boosting


    Boosting is widely used in many real-time applications where regression and classification
    come into the picture. AdaBoost algorithms are widely used for customer churn
    (percentage of customers lost by a business in a given time period) prediction
    and categorizing the types of interests of customers in the market. Applications
    of the XGBoost algorithm involve regression, classification, ranking and diverse
    prediction problems.


    ## 10.7 Major Benefits and Challenges of Boosting


    Boosting has many benefits and challenges, depending on the type of boosting algorithm,
    the dataset, the amount of missing and sparse data, etc. However, here we will
    quote the generic benefits and challenges of boosting algorithms.


    The major benefits are as follows:


    1.  Boosting algorithms are supposed to be easily understandable and hence easy
    to interpret. They learn from either a parallel or sequential weak base learner
    and make it strong by serial iterations by increasing the weights based on the
    errors. This helps to reduce high bias.


    2.  Boosting algorithms have the capability to handle missing data and don’t require
    pre-processing.


    3.  Boosting algorithms can handle large datasets and aim to identify important
    features by increasing the predictive accuracy during training, which increases
    the computational efficiency of the algorithm.


    4.  Boosting can very well prevent overfitting. The XGBoost algorithm is widely
    used for major regression and classification problems as they can work independently
    of small, medium and large datasets.


    The major challenges include:


    1.  Boosting algorithms are very sensitive to outliers, which will result in a
    skewed distribution.


    2.  XGBoost algorithms are not good for very sparse data.


    3.  Boosting algorithms are not that scalable and tend to be highly complex when
    compared with other methods, thus making it challenging for them to be used in
    real-time applications.


    ## 10.8 Comparison of Bagging and Boosting


    Bagging and boosting have major differences in the processing techniques they
    use, as shown in [Figure 10.7](#c10.xhtml#f10.7).


    ![Figure 10.7 Bagging and boosting.](images/fig10.7.jpg)


    [**Figure 10.7**](#c10.xhtml#re_f10.7) Bagging and boosting.


    1.  Bagging uses parallel execution of base learners, whereas boosting uses sequential
    execution of base learners


    2.  Individual models are fed with data samples separately in bagging, whereas,
    in boosting, each new model formed is based and improved on the previous model
    built.


    3.  Bagging reduces variance and boosting helps to reduce high bias and variance.


    4.  Bagging may reduce overfitting better than boosting algorithms.


    5.  Bagging uses the average of n learners for the final prediction, whereas boosting
    uses the weighted average of n learners for the final prediction.


    6.  In bagging, each model receives equal weight, whereas, in the boosting process,
    the model receives weights according to performance.


    ## 10.9 What Is Stacking?


    Now, as we have studied bagging and boosting ensemble methods, it’s time for us
    to understand the stacking ensemble method, which is shown in [Figure 10.8](#c10.xhtml#f10.8).


    ![Figure 10.8 Stacking.](images/fig10.8.jpg)


    [**Figure 10.8**](#c10.xhtml#re_f10.8) Stacking.


    Stacking, also called stacked generalization, is an ensemble model which uses
    multiple models to explore different parts of the problem, rather than the whole
    of the problem as such. The theme is to use intermediate models to make predictions
    and then use a new model which uses these intermediate predictions for achieving
    the best prediction. That is why this model is called stacking as the final prediction
    model is built, or stacked, on top of other models. This stacking model is supposed
    to give better predictions than the individual model predictions.


    The steps in the stacking process are as follows:


    1.  Similar to k-fold cross-validation, we divided the training dataset into k-folds.


    2.  On the k-1 parts, a base model is fitted, and predictions are given for the
    kth part.


    3.  We repeat the same for each section of the training dataset.


    4.  After that, the base model is fitted to the entire training dataset to determine
    how well it performs on the test set.


    5.  For various base models, we repeat the previous three steps.


    6.  The features of the second-level model are drawn from predictions made by
    the training dataset.


    7.  The prediction is made using a second-level model on the test dataset.


    Blending is a kind of stacking that uses validation and a test dataset for the
    whole process to make predictions.


    ## 10.10 Types of Stacking Algorithms


    The stacking algorithms are mainly divided into majority voting and weighted average
    ensemble models.


    ### 10.10.1 Majority Voting


    Say, we take an example of sentiment analysis, which we all know. Consider the
    sentence “It is shining bright and I feel happy. I think I should call my friends
    and plan a trip” as shown in [Figure 10.9](#c10.xhtml#f10.9). This is the sentence
    given for you to identify whether it is positive, negative or neutral.


    ![Figure 10.9 Majority voting.](images/fig10.9.jpg)


    [**Figure 10.9**](#c10.xhtml#re_f10.9) Majority voting.


    Let’s apply this sentence to multiple classifiers or models. Each of the models
    has predicted different sentiments say, model-1 predicted it to be positive, model-2
    to be positive again and model-3 to be negative. Then, these results are passed
    through a majority voting model, where the model identifies the majority positive
    sentiment and gives a prediction of positive sentiment for our input sentence.
    Simple statistics are used to get the final prediction, e.g., mean or median in
    the majority voting ensemble methods.


    ### 10.10.2 Weighted Average Ensemble


    This is a variant of the majority voting ensemble, which uses a diverse collection
    of multiple models. This method finds the average weight of each member in the
    training dataset, based on their performance. To make an impact, it finds the
    weight of each member based on the performance on the validation set using k-fold
    cross-validation. It also uses optimization algorithms to fine-tune the hyperparameters
    for weights assigned for each model for best performance, as shown in [Figure
    10.10](#c10.xhtml#f10.10).


    ![Figure 10.10 Weighted average ensemble.](images/fig10.10.jpg)'
