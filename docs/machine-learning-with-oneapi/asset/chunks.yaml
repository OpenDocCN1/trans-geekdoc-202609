  fmt: '

    The overall aim of the regression is to reduce the error to as low as possible.
    It is time to go with a little mathematics now. Readers must be familiar with
    these fundamental mathematical terminologies already and, in that case, it would
    be a recap for those readers. Otherwise, it is important to pay attention to the
    next couple of sections where it is all fairly fundamental mathematics.


    One should refer to [Figure 6.13](#c6.xhtml#f6.13) before getting into the expressions
    presented below.


    ![Figure 6.13 The mathematical connect – positive impact.](images/fig6.13.jpg)


    [**Figure 6.13**](#c6.xhtml#re_f6.13) The mathematical connect – positive impact.


    One should recollect the `Y = M X + C` expression to describe a straight line,
    which was learnt during schooldays. This will come in handy here.


    | `Y = b0 + b1 * x` || |

    | --- | --- |

    * `Y` = estimated Pay

    * `x` = number of hours worked

    * `b0` = y intercept

    * `b1` = slope of the line – here, there is a positive relationship and hence
    the equation includes “+`b1`”


    As the number of hours worked increases, the pay should increase. Hence, there
    is a positive relationship.


    * `x` is the independent variable which alone can be controlled.

    * `y` is the dependent variable and is the outcome. The salary is dependent on
    the number of hours worked. (This variable is fully dependent)


    | `Y = b0 - b1 * x` || |

    | --- | --- |

    * `Y` = CGPA

    * `x` = number of hours watching TV

    * `b0` = y intercept

    * `b1` = slope of the line. There is a negative impact and hence is “−`b1`”


    As the number of hours watching TV increases, the CGPA score will come down. Hence,
    there is a negative relationship (see [Figure 6.14](#c6.xhtml#f6.14)).


    ![Figure 6.14 The mathematical connect – negative impact](images/fig6.14.jpg)


    [**Figure 6.14**](#c6.xhtml#re_f6.14) The mathematical connect – negative impact


    * `x` is the independent variable. `Y` is the dependent variable and is the outcome.


    The next step is to understand how to calculate the linear regression derived
    using the Least Squares Method. This is one of the most commonly used approaches
    for linear regression calculation/plotting.


    The first step is to create a simple dataset. The entire process is presented
    step by step:


    *Step 1:* `x` is the input and `y` is the output. `x` can be termed the independent
    Variable and `y` the dependent variable (see [Table 6.1](#c6.xhtml#t6.1)). For
    each of the five `x` values, there is one corresponding `y` value. Collect the
    pairs of `x`/`y` values.


    [**Table 6.1**](#c6.xhtml#re_t6.1) The Data Points


    | `x` || `y` |

    | --- | --- |

    | 1 || 2 |

    | --- | --- |

    | 2 || 4 |

    | 3 || 6 |

    | 4 || 3 |

    | 5 || 5 |


    The immediate next step is to calculate mean `x` and mean `y`.


    Mean `x` = (1 + 2 + 3 + 4 + 5) / 5 = 3.


    Mean `y` = (2 + 4 + 6 + 3 + 5)/ 5 = 4.


    So, we have calculated the mean `x` and mean `y` values. It is time for the reader
    to go to the next step in the sequence. Can we draw a plot of the relationship,
    by plotting the five values of the independent variable against the corresponding
    five values of the dependent variable ([Figure 6.15](#c6.xhtml#f6.15)).


    ![Figure 6.15 Plot of x vs y.](images/fig6.15.jpg)


    [**Figure 6.15**](#c6.xhtml#re_f6.15) Plot of `x vs y`.


    One can look at [Figure 6.16](#c6.xhtml#f6.16) to understand how the plotting
    is done.


    ![Figure 6.16 Mean x and mean y plot.](images/fig6.16.jpg)


    [**Figure 6.16**](#c6.xhtml#re_f6.16) Mean `x` and mean `y` plot.


    The next step is to calculate the slope and the y intercept (intercept of the
    line on the y axis) plotted. It is to be taken forward from the previously presented
    graph shown in [Figure 6.17](#c6.xhtml#f6.17).


    ![Figure 6.17 Y intercept and the slope.](images/fig6.17.jpg)


    [**Figure 6.17**](#c6.xhtml#re_f6.17) `Y` intercept and the slope.


    The above plots have allowed the visualization of the data in the form of a graph
    and it is mandatory to visualize the data points in an understandable manner.
    Now, we need to calculate the distance from each data point to the line-of-best-fit.
    The distance from each `x` value to the `x` mean (`x''`) and from each `y` value
    to the `y` mean (`y''`) is to be calculated. As a result, [Table 6.2](#c6.xhtml#t6.2)
    will keep growing step by step and will be easier to understand.


    [**Table 6.2**](#c6.xhtml#re_t6.2) The Data Points


    | x || y || x - x’ || y - y’ || (x-x’)² || (x-x’) (y-y’) |

    | --- | --- | --- | --- | --- | --- |

    | 1 || 2 || 1 – 3 = – 2 || 2 – 4 = – 2 || 4 || – 2 × – 2 = 4 |

    | --- | --- | --- | --- | --- | --- |

    | 2 || 4 || 2 – 3 = – 1 || 4 – 4 = 0 || 1 || – 1 × 0 = 0 |

    | 3 || 6 || 3 – 3 = 0 || 6 – 4 = 2 || 0 || 0 × 2 = 0 |

    | 4 || 3 || 4 – 3 = 1 || 3 – 4 = – 1 || 1 || 1 × – 1 = – 1 |

    | 5 || 5 || 5 – 3 = 2 || 5 – 4 = 1 || 4 || 1 × 2 = 2 |

    |   ||   ||   ||   || 10 || 5 |


    Now that the calculation is complete and Table 6.2 contains the required information,
    it is easy to proceed with the formula to complete the process. There are some
    real cool tips to be followed when constructing the table. The sum of the `x-x''`
    and `y-y''` should always be 0; if it is not zero, then there is something wrong
    in the computation.


    `y'' = b0 + b1 * x''`


    `b1 = 5 / 10 = 0.5`


    The above is derived through the expression:


    `b1 = Σ [(x – x’) (y – y’)] / Σ(x – x²)`


    where Σ=summation.


    We are into the final stage of the computation.


    `y'' = b0 + b1. x''`


    (`x''` and `y''` are the mean `x` and mean `y`, respectively)


    * `4 = b0 + b1*3`

    * `4 = b0 + 0.5 * 3`

    * `4 = b0 + 1.5`

    * `4 – 1.5 = b0 + 1.5 – 1.5`

    * `b0 = 2.5`

    * `b1 = slope = 0.5`

    * `b0 = y intercept = 2.5`


    So, you have now calculated how to draw the straight regression line (“line-of-best-fit”),
    which will pass through `x''`/`y''` and `x=0`/`y=2.5` (when `x=0`, the intercept
    on the y axis is 2.5).


    The time has now come for us to learn what exactly the logistic regression is.
    The terminologies of logistic and linear regressions are very important and they
    are among the most discussed topics in machine learning.


    ### 6.4.2 Logistic Regression – A Sneak Peek


    A logistic regression is a mathematical model, which predicts the probability
    of the occurrence of `y`, given the information of `x`, a previous event. Given
    `x`, the logistic regression predicts whether `y` will occur or not. Logistic
    regression is a binary event, which means `y` can be either 0 or 1. `y` gets the
    value 1, if the event occurs, whereas `y` gets the value 0 if the event does not
    occur.


    Logistic regression is mainly used for classification applications like spam email
    detection, diabetes/cancer detection for a person based on various features provided,
    etc. Another popular application is customer choice prediction – i.e., whether
    the customer will click on a particular link or not. Will the customer buy the
    product or not?


    ### 6.4.3 Comparison of Linear and Logistic Regressions


    Linear regression gives you a continuous variable output, but logistic regression
    provides a discrete variable output. Linear regression illustrates a straight-line
    relationship but logistic regression deals with a relationship following a sigmoidal
    function.


    Briefly:


    * Linear regression is an approach to model the linear relationship between dependent
    and independent variables.

    * Logistic regression is more statistical in nature where the model predicts the
    outcome which could be one of the two values.


    Learning or implementing logistic and linear regression through codes is beyond
    the scope of this book. But, the authors have provided a clear video lecture for
    the reader who wants to explore the implementation aspects as well.


    Implementation of Linear Regression: [https://youtu.be/i6G94Me9LN0](https://youtu.be)


    Implementation of Logistic Regression: [https://youtu.be/snr1q\_iq-bE](https://youtu.be)


    It is time to understand what classification is all about.


    ### 6.4.4 Implementation of Linear Regression

    '
  trans: '

    回归的总体目标是将误差降至尽可能低。现在是时候进行一些数学推导了。读者应该已经熟悉这些基础数学术语，如果是这样，对这些读者来说就是复习。否则，重要的是要关注接下来的几个部分，其中全部都是相当基础的数学。


    在进入下面给出的表达式之前，应参考图 6.13。


    ![图 6.13 数学联系 – 正向影响。](img/fig6.13.jpg)


    **图 6.13** 数学联系 – 正向影响。


    应回忆一下在学校时期学过的用 `Y = M X + C` 表达式来描述直线的知识。这里会派上用场。


    | `Y = b0 + b1 * x` || |

    | --- | --- |

    * `Y` = 估计薪资

    * `x` = 工作小时数

    * `b0` = y 截距

    * `b1` = 直线的斜率 – 这里存在正相关，因此方程包含“+`b1`”


    随着工作小时数的增加，薪资应该增加。因此存在正相关关系。


    * `x` 是可以单独控制的自变量。

    * `y` 是因变量，是结果。薪资取决于工作小时数。（该变量完全依赖）


    | `Y = b0 - b1 * x` || |

    | --- | --- |

    * `Y` = CGPA

    * `x` = 看电视的小时数

    * `b0` = y 截距

    * `b1` = 直线的斜率。存在负向影响，因此为“−`b1`”


    随着看电视小时数的增加，CGPA 分数会下降。因此存在负相关关系（参见图 6.14）。


    ![图 6.14 数学联系 – 负向影响](img/fig6.14.jpg)


    **图 6.14** 数学联系 – 负向影响


    * `x` 是自变量。`Y` 是因变量，是结果。


    下一步是了解如何使用最小二乘法计算线性回归。这是线性回归计算/绘图最常用的方法之一。


    第一步是创建一个简单的数据集。整个过程逐步呈现：


    *步骤 1：* `x` 是输入，`y` 是输出。`x` 可称为自变量，`y` 为因变量（参见表 6.1）。对于每个 `x` 值，都有一个对应的 `y` 值。收集
    `x`/`y` 值对。


    **表 6.1** 数据点


    | `x` || `y` |

    | --- | --- |

    | 1 || 2 |

    | --- | --- |

    | 2 || 4 |

    | 3 || 6 |

    | 4 || 3 |

    | 5 || 5 |


    下一步是计算平均 `x` 和平均 `y`。


    平均 `x` = (1 + 2 + 3 + 4 + 5) / 5 = 3.


    平均 `y` = (2 + 4 + 6 + 3 + 5)/ 5 = 4.


    因此，我们已经计算出平均 `x` 和平均 `y` 值。是时候让读者进入序列中的下一步了。我们能否通过绘制自变量的五个值与对应的因变量的五个值来绘制关系图（图
    6.15）。


    ![图 6.15 x 与 y 的关系图。](img/fig6.15.jpg)


    **图 6.15** `x vs y` 的关系图。


    可以查看图 6.16 来了解绘图是如何进行的。


    ![图 6.16 平均 x 和平均 y 绘图。](img/fig6.16.jpg)


    **图 6.16** 平均 `x` 和平均 `y` 绘图。


    下一步是计算绘制的斜率和 y 截距（直线上 y 轴的截距）。应从先前展示的图 6.17 中所示的图中继续进行。


    ![图 6.17 Y 截距和斜率。](img/fig6.17.jpg)


    **图 6.17** `Y` 截距和斜率。


    上述图表已允许以图形形式可视化数据，并且以可理解的方式可视化数据点是强制性的。现在，我们需要计算每个数据点到最佳拟合线的距离。需要计算每个 `x` 值到 `x`
    均值（`x''`）的距离以及每个 `y` 值到 `y` 均值（`y''`）的距离。因此，表 6.2 将逐步增长，更易于理解。


    **表 6.2** 数据点


    | x || y || x - x’ || y - y’ || (x-x’)² || (x-x’) (y-y’) |

    | --- | --- | --- | --- | --- | --- |

    | 1 || 2 || 1 – 3 = – 2 || 2 – 4 = – 2 || 4 || – 2 × – 2 = 4 |

    | --- | --- | --- | --- | --- | --- |

    | 2 || 4 || 2 – 3 = – 1 || 4 – 4 = 0 || 1 || – 1 × 0 = 0 |

    | 3 || 6 || 3 – 3 = 0 || 6 – 4 = 2 || 0 || 0 × 2 = 0 |

    | 4 || 3 || 4 – 3 = 1 || 3 – 4 = – 1 || 1 || 1 × – 1 = – 1 |

    | 5 || 5 || 5 – 3 = 2 || 5 – 4 = 1 || 4 || 1 × 2 = 2 |

    |   ||   ||   ||   || 10 || 5 |


    现在计算已完成，表 6.2 包含所需信息，很容易继续使用公式完成过程。构造表格时有一些很酷的技巧需要遵循。`x-x''` 和 `y-y''` 的总和应始终为
    0；如果不是零，则计算有误。


    `y'' = b0 + b1 * x''`


    `b1 = 5 / 10 = 0.5`


    上述是通过以下表达式推导得出的：


    `b1 = Σ [(x – x’) (y – y’)] / Σ(x – x²)`


    其中 Σ=求和。


    我们已进入计算的最后阶段。


    `y'' = b0 + b1. x''`


    （`x''` 和 `y''` 分别是平均 `x` 和平均 `y`）


    * `4 = b0 + b1*3`

    * `4 = b0 + 0.5 * 3`

    * `4 = b0 + 1.5`

    * `4 – 1.5 = b0 + 1.5 – 1.5`

    * `b0 = 2.5`

    * `b1 = slope = 0.5`

    * `b0 = y intercept = 2.5`


    因此，你现在已经计算出如何绘制直线回归线（“最佳拟合线”），该线将通过 `x''`/`y''` 和 `x=0`/`y=2.5`（当 `x=0` 时，y 轴上的截距为
    2.5）。


    现在是时候学习逻辑回归到底是什么了。逻辑回归和线性回归的术语非常重要，它们是机器学习中最常讨论的话题之一。


    ### 6.4.2 逻辑回归 – 初探


    逻辑回归是一种数学模型，根据 `x` 的信息，即先前事件，预测 `y` 发生的概率。给定 `x`，逻辑回归预测 `y` 是否会发生。逻辑回归是一个二元事件，这意味着
    `y` 可以是 0 或 1。如果事件发生，`y` 取值为 1；而如果事件未发生，`y` 取值为 0。


    逻辑回归主要用于分类应用，如垃圾邮件检测、基于各种特征对个人进行糖尿病/癌症检测等。另一个流行的应用是客户选择预测——即客户是否会点击某个特定链接。客户是否会购买产品？


    ### 6.4.3 线性回归与逻辑回归的比较


    线性回归给出连续变量输出，但逻辑回归提供离散变量输出。线性回归说明直线关系，而逻辑回归处理遵循 S 形函数的关系。


    简要来说：


    * 线性回归是建模因变量与自变量之间线性关系的方法。

    * 逻辑回归更具统计性质，其中模型预测的结果可能是两个值之一。


    通过代码学习或实现逻辑回归和线性回归超出了本书的范围。但作者为希望探索实现方面的读者提供了清晰的视频讲座。


    线性回归实现：[`youtu.be/i6G94Me9LN0`](https://youtu.be)


    逻辑回归实现：[`youtu.be/snr1q\_iq-bE`](https://youtu.be)


    是时候了解分类到底是什么了。


    ### 6.4.4 线性回归的实现

    '
