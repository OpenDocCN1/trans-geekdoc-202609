    In this chapter, we shall cover the general algorithm for decision trees. There
    are several other types of decision tree algorithms, which we will cover briefly,
    as a detailed discussion is beyond the scope of this book.


    The details shown in [Figure 8.6](#c8.xhtml#f8.6) are a generic algorithm and
    might vary between specific algorithms.


    ![Figure 8.6 Generic decision tree algorithm.](images/fig8.6.jpg)


    [**Figure 8.6**](#c8.xhtml#re_f8.6) Generic decision tree algorithm.


    The various decision tree algorithms include:


    1.  ID3 → (Iterative Dichotomiser 3)


    2.  CART → (Classification and Regression Tree)


    3.  C4.5 → (A variant of ID3)


    ID3 uses entropy and information gained as metrics while building the decision
    trees, whereas CART uses Gini Impurity as the metric. C4.5 is an extension of
    ID3 and uses the Gain ratio as the metric.


    ### 8.3.1 Challenges in Decision Trees


    When building an optimal tree, we want the tree to be as short as possible.


    *   Which attribute to select first to achieve that?


    *   and


    *   Which attribute to select next?


    *   Where to perform Attribute to split the tree?


    The idea is to select for the root node; the attribute which brings the most information
    will be the best predictor. The same analogy is to be used when deciding on the
    next node.


    In order to perform selection for the best attribute, there are certain metrics
    used in decision trees.


    You should know the appropriate terminology if you want to dive deep into the
    concepts. The way to pick the starting test condition in Decision Trees could
    be decided by these metrics. Let’s get started.


    *Impurity/Entropy* is the measure of randomness or disorder or simply it is the
    uncertainty present in the data. This is an attribute selection measure. We can
    calculate entropy by the following equation:


    |   E  S  \=   ∑  i \= 1  c   −  p i      l o  g 2       p i      ||  |


    | --- | --- |


    where S is the set of all instances in the dataset,


    c is the number of classes,


    *p* *[i]* [] is the event probability.


    A simple example could be, say, if we flip a coin, there is a 50 % uncertainty
    that we may always get heads or tails; this uncertainty is always there for each
    flip, which is considered the entropy. The representation of low and high entropy
    is presented in [Figure 8.7](#c8.xhtml#f8.7).


    ![Figure 8.7 Representations of low and high entropy.](images/fig8.7.jpg)


    [**Figure 8.7**](#c8.xhtml#re_f8.7) Representations of low and high entropy.


    *Information gain* can be defined as the amount of information gained about a
    random variable or signal from observing another random variable. You may calculate
    the information gain as follows:


    If S is the total collection of data,


    |     I n f o r m a t i o n   G a i n       \= E n t r o p y   ( S ) − \[ w e
    i g h t e d   a v e r a g e \* E n t r o p y   ( e a c h   f e a t u r e ) \]     ||  |


    | --- | --- |


    To make it simpler to understand,


    |   I n f o r m a t i o n   G a i n   ( P a r e n t ,   C h i l d ) \= E ( P a
    r e n t ) − E ( C h i l d )   ||  |


    | --- | --- |


    *Gini Impurity* is a method for splitting the nodes when the target variable is
    categorical.


    |   G i n i   I m p u r i t y \= 1 − G i n i   ||  |


    | --- | --- |


    For this, we need to know how to calculate Gini:


    Gini is the probability of correctly labeling a randomly chosen element if it
    is randomly labeled according to the distribution of labels in the node.


    |   G i n i \=   ∑   i \= 1  c   p i 2    ||  |


    | --- | --- |


    Mathematically,


    |   G i n i   I m p u r i t y \= 1 −   ∑   i \= 1  c   p i 2    ||  |


    | --- | --- |


    All these help the decision tree algorithms to be suitable for attribute selection
    in various algorithms like ID3, CART, etc. All these metrics help decision trees
    in various algorithms to decide which attribute will give the most appropriate
    path to reach the optimal solution.


    It is time for us to see a generic example of a decision tree to understand how
    we make use of the conditions given and how we try to reduce the entropy to reach
    the optimal solution. Consider we are given an animal dataset with varied height,
    weight and color. We are given certain conditions to consider, like color = yellow,
    height≥10, etc. Let’s see how we find a tree using the decision tree method to
    reduce the entropy at each step.


    As shown in [Figures 8.8](#c8.xhtml#f8.8) and [8.9](#c8.xhtml#f8.9), given a dataset
    of various animals with varied attributes and conditions, entropy is calculated
    and various conditions are then applied based on the gain. Next, we need to apply
    the conditions in order to recalculate the entropy and it can be noted that the
    entropy is drastically reduced at each step.


    ![Figure 8.8 Steps in excision tree illustration.](images/fig8.8.jpg)


    [**Figure 8.8**](#c8.xhtml#re_f8.8) Steps in excision tree illustration.


    ![Figure 8.9 Last step in illustration of decision trees.](images/fig8.9.jpg)


    [**Figure 8.9**](#c8.xhtml#re_f8.9) Last step in illustration of decision trees.


    ## 8.4 Random Forest Classifier


    Random forest is an extension of decision trees, which contains a group of decision
    trees applied to the subsets of the dataset. The accuracy is calculated by taking
    the average across the trees to improve the predictions with greater accuracy.
    This will be covered in the bagging model in ensemble modeling, where we learn
    to use multiple classifiers to find the optimal solution for the problem with
    better performance. We will touch upon random forest in the next chapter also.


    Steps for random forest are as follows:


    1.  Given the dataset or training dataset, select random samples.


    2.  Construct a decision tree for each of the samples.


    3.  Use the ensemble method to perform majority voting.


    4.  Finally, the optimal prediction will be based on the most voted result.


    Bagging is an ensemble model which is also called a bootstrap aggregation. Random
    forest uses bagging where bootstrapping is the initial step, where the dataset
    or training samples are provided as random samples. After this process, they aggregate
    the results to find the optimal solution, which is why bagging is also called
    bootstrap aggregation. A detailed explanation of bagging will be presented in
    [Chapter 9](#c9.xhtml#c9).  [Figure 8.10](#c8.xhtml#f8.10) given below explains
    the working of a random forest algorithm.


    ![Figure 8.10 Operation of a random forest algorithm.](images/fig8.10.jpg)


    [**Figure 8.10**](#c8.xhtml#re_f8.10) Operation of a random forest algorithm.'
