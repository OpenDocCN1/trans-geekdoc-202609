    far as Pandas is concerned, the most common and basic data structure is the `Series`.
    It is the basic building block for the data in tabular format.


    ### 5.3.2 What Is a Data Frame?


    We need structured data for carrying out all the data analytics. We are familiar
    with SQL (Structured Query Language), right? It is all about rows and columns
    and makes life easier.


    For Data Science and ML with Python, we have something similar called data frames
    (the dataset has to be converted to data frames for easier access and processing).
    Here, the data are being visualized as a table, making interpretation much easier.


    Pandas Library will help in getting the data frames created so let’s learn the
    same.


    One should remember that the data frame is a 2D data structure. Can we have an
    example to enhance our understanding? Your first data frame is presented below
    which will certainly enhance the reader’s understanding of the data frame. We
    will use the data frames at a later point of this chapter, and this is just a
    head’s up for information.


    ![Figure 5.4 A sample data frame (with heterogeneous data inside).](images/fig5.4.jpg)


    **Figure 5.4** A sample data frame (with heterogeneous data inside).


    Remember:


    * We will come across CSV files in many of our ML/DL projects. A CSV file is a
    Comma Separated Values (CSV) file and is a plain text file that stores data by
    delimiting data entries with commas.


    ### 5.3.3 Pandas Series Creation and Indexing


    We are going to create the Pandas series first. It is very simple, and we need
    to have data for the same. We are using the water consumption by an apartment
    as the data, and we shall build the Pandas series around these data. First step
