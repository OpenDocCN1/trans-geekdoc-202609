    [**Figure 3.19**](#c3.xhtml#re_f3.19) Anaconda Prompt Installation complete.


    ![Figure 3.20 How to open Jupyter.](images/fig3.20.jpg)

    **Figure 3.20** How to open Jupyter.


    3. Once the installation is complete, one can open and access the Notebook with
