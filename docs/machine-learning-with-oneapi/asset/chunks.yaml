    How can someone access DevCloud through “Connect with Jupyter Lab”?


    Click the link [https://devcloud.intel.com/oneapi/get\_started/](https://devcloud.intel.com).
    In the bottom portion of the page, there is an option for “Connect with Jupyter
    Lab” ([Figure 3.8)](#c3.xhtml#f3.8)


    ![Figure 3.8 Connect with Jupyter Lab.](images/fig3.8.jpg)

    [**Figure 3.8**](#c3.xhtml#re_f3.8) Connect with Jupyter Lab.


