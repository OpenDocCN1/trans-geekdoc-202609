    ## 12.1 Intel Distribution for Python


    The Intel Distribution for Python (a cluster of packages) improves the speed of
    common libraries and algorithms, especially data analytics, to yield better performance.
    The new optimization provides significant speedups for scikit-learn (a free software
    machine learning library). especially in NumPy (short for Numerical Python) and
    SciPy (Scientific Python) packages meant for performing various operations with
    the data. It also leverages Intel Data Analytics Acceleration Library (Intel DAAL).
    The performance speed can be seen to accelerate around a whopping 140 times for
    several scikit-learn algorithms. Intel DAAL is a software development library
    that is highly optimized for Intel architecture processors and provides building
    blocks for all data analytics stages, from data preparation to data mining and
    machine learning.


    The Intel Distribution for Python includes accelerated packages for NumPy, SciPy
    and scikit-learn (or sklearn) that are drop-in compatible with other similar community
    packages. Since these accelerated packages best utilize the Intel hardware already
    available, no code changes are needed.


    The readers can visit [intel.com/content/www/us/en/developer/tools/oneapi/distribution-for-python.html#gs.3ou56q](http://intel.com)
    to download the Intel Distribution for Python.


    As a first step to install and use the Intel Distribution for Python, one has
    the option to go ahead with Intel AI Analytics Toolkit or via Anaconda.


    We will choose the option of Anaconda and the following steps need to be done,
    in sequence.


    As shown in [Figure 12.1](#c12.xhtml#f12.1) below, one must click the Anaconda
    Prompt.


