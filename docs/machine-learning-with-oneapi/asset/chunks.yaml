    除此之外，作为开发者，您将获得以下资源：

    * 可免费访问 Intel® oneAPI Toolkits 和组件以及最新的 Intel® 硬件

    * 220 GB 文件存储空间

    * 192 GB RAM

    * 120 天访问权限（可延长）

    * 终端界面（Linux*）

    * Microsoft Visual Studio* Code 集成

