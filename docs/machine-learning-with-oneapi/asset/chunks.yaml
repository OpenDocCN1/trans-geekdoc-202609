    \n![Figure 5.25 Importing matplotlib and seaborn. Note: seaborn is now “sea,”\
    \ matplotlib is “plot” for the reader.](images/fig5.25.jpg)\n\n[**Figure 5.25**](#c5.xhtml#re_f5.25)\
