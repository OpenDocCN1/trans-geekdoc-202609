  # 第 1 章 黑客对俄罗斯的攻击


  技术突破改变了我们世界的方方面面，包括我们进行战争的方式。除了导弹、坦克和战斗机，数字手段也发挥了重要作用，且对它们的依赖将在当代和未来的冲突中呈指数级增长。自互联网发明的第一天起，其军事化只是时间问题。如今，这已成事实。2009
  年，美国网络后果部门首席技术官 John Bumgarner 强调网络攻击与“实地部队”同样重要，将网络战比作一场国际象棋游戏，其中“政府、企业和公民是卒子”，即最弱小的棋子（Rutherford
  2009）。2012 年，前国防部长 Leon Panetta 已强调发生“网络珍珠港”式袭击国家基础设施的可能性极大，这将导致物理空间的大规模破坏，甚至危及人们的生命安全（Mora
  2012）。尽管他的担忧针对的是美国，但他的警告适用于全球每一个国家，因为现代的不确定性表明，迟早每个国家都有同等机会成为网络侵略的目标。






  ## 关键基础设施遭受的网络攻击及地缘政治背景


  针对关键基础设施和其他敏感领域的网络攻击可能造成毁灭性后果，导致巨大且往往不可逆转的损害。2010 年，伊朗核浓缩设施遭到“震网”病毒攻击，该恶意软件旨在干扰气体离心机的运转，直至其自我毁坏（Lipovsky
  2017）。2015 年 12 月 23 日，乌克兰西部陷入黑暗，约 22.5 万人断电，因为黑客获得了对电厂系统的远程访问权限（Temperton 2016）。2016
  年 12 月，又一次试图瘫痪乌克兰关键能源设施的行动发生，乌克兰首都基辅部分地区断电（Cherepanov and Lipovsky 2017）。乌克兰当局将这两次攻击的责任归咎于俄罗斯黑客组织。


  黑客对政府实体构成了严重威胁。在 2008 年短暂的俄格战争期间，俄罗斯攻陷了多个格鲁吉亚政府网站、银行和媒体机构。根据美国非营利组织“网络后果小组”的报告，实施这些袭击的俄罗斯人员是平民，其中一些人没有任何计算机经验，并通过在线论坛被招募（Meserve
  2009）。调查人员并未将这些网络攻击归咎于俄罗斯军方或当局，但承认如果存在这种牵连，也微不足道（Bumgarner 2009）。2020 年 8 月，挪威议会遭攻击瘫痪，攻击者获取了属于立法者和工作人员的政府电子邮件、密码和用户名（Bakken
  2020）。经调查后，挪威外交大臣伊内·埃里克森·索雷德表示，此次袭击背后是俄罗斯联邦，由与俄罗斯情报机构格鲁乌（GRU）有关联的黑客组织“花式熊”实施（Bakken
  2020; RFERL 2020）。


  2022 年 2 月，乌克兰数字实体经历了一连串网络袭击。因此，银行、企业、政府部门和媒体机构都已成为网络犯罪分子的常见目标；黑客数量持续增长，其技能和胃口也在膨胀。他们组建团伙，追求经济利益或政治议程。


  ### 入侵前对乌克兰的网络攻击（2022 年 1 月–2 月）


  在 2022 年 2 月 24 日之前，乌克兰经历了其他严重的网络攻击，政府数字网络被迫关闭。1 月，除其他网站外，乌克兰外交部、国家紧急服务局、能源部和教育部的运作均被中断；2
  月，黑客则袭击了乌克兰国防机构和两家银行的网站（Interfax 2022; Lyngaas et al. 2022）。在被篡改的网站上，肇事者留下了以下信息：


  > “乌克兰人！你们所有的个人数据已被上传至公共网络。电脑上的所有数据已被销毁，无法恢复。关于你们的所有信息已公开，请感到恐惧并预料最坏的结果。这是为你们的过去、现在和未来。为沃伦，为
  OUN^1，为 UPA^2，为加利西亚，为波利西亚和为历史领土”（Interfax 2022）。


  欧洲国家和美国立即提出协助乌克兰政府调查事件并恢复其网络资源（Webber 2022）。


  ### 国际反应与归因


  欧盟于 2022 年 1 月 14 日发表声明，谴责针对乌克兰的网络侵略（欧盟理事会 2022）。欧盟立法者强调，这些行动意在破坏乌克兰的稳定并散布虚假信息，指出网络袭击威胁国家主权，并加剧了本已困难的局势。此外，声明还包含了关于即将提供的“直接技术援助，以帮助乌克兰修复此次攻击造成的损害”的信息（欧盟理事会
  2022）。再者，2021 年 12 月，欧盟向乌克兰政府拨款 3100 万欧元，不仅用于支持“军事医疗单位，包括野战医院、工程、机动和后勤单位”，还用于网络防御（欧盟理事会
  2021）。


  在这些袭击发生后，美国警告俄罗斯当局，若俄罗斯继续实施网络打击，将面临网络反制（白宫 2022）。鉴于此，2 月初，美国副国家安全顾问安妮·诺伊伯格抵达欧盟，与欧洲和北约代表^3
  举行会晤，讨论俄罗斯的网络威胁（Hughes 2022）。因此，在 2022 年 1 月第一波网络侵略之后，美国政府和欧盟外交官承认俄罗斯联邦极有可能发动进一步的网络侵略，并认识到合作与联合应对准备的必要性。他们派遣了技术团队和调查人员，并向乌克兰提供了资金。


  ### REvil 勒索软件组织与俄罗斯执法行动


  值得注意的是，在第一波网络袭击当天，俄罗斯情报人员在莫斯科、圣彼得堡、莫斯科州、列宁格勒州和利佩茨克州实施突击搜查，拘捕了 14 名 REvil 黑客组织成员（Shustova
  2022）。REvil（又称 Sodinokibi）于 2019 年出现，因攻击全球企业而闻名。俄罗斯媒体挖出了两名被捕黑客的姓名——罗曼·米罗姆斯基和安德烈·贝索诺夫，他们在莫斯科被捕。联邦安全局（FSB）^4
  声称其调查人员追踪了每一名成员，但在联邦安全局行动之前，美国已向俄罗斯调查人员共享了关于 REvil 成员的信息。结果，俄罗斯当局缴获了约 100 万美元和 4.26
  亿卢布的现金及加密货币，并扣押了服务器和笔记本电脑等专业设备以及二十辆豪车（Shustova 2022）。此外，官方宣布俄罗斯联邦仅引渡非俄罗斯公民身份的 REvil
  成员，持有俄罗斯公民身份的成员将继续受国内司法管辖。值得注意的是，2021 年，欧洲情报机构在波兰、韩国和科威特识别并拘捕了五名 REvil 成员（Europol
  2022）。


  ### REvil 的高调攻击行动


  REvil 黑客开发恶意软件并实施高调攻击。据美国调查人员称，该组织重创了多家美国及国际企业。在美国，最大的国内燃料输送商“科洛尼尔管道公司”，以及全球最大肉类加工企业
  JBS Foods 的美国分支 JBS USA，在遭受 REvil 黑客攻击后被迫中断正常运营。据科洛尼尔管道公司领导层宣布，勒索软件攻击于 2021 年 5
  月 7 日发起（Colonial Pipeline 2021）。次日，这起网络勒索迫使科洛尼尔管道公司支付赎金，约合 430 万美元比特币（Sganga and
  Hymes 2021）。另一家美国公司紧随其后。肉类加工商 JBS USA 满足了黑客的条件，向其账户转账 1100 万美元，以完全恢复所有系统并恢复全面功能（Bunge
  2021）。知名软件供应商 Kaseya 于 2021 年 7 月遭受勒索软件攻击。为防止客户受损，Kaseya 管理层关闭了公司服务器（CISA 2021）。因此，俄罗斯拘捕
  REvil 成员标志着该黑客组织的终结。尽管俄罗斯极少在追究网络罪犯方面进行合作，但联邦安全局仍根据美国请求拘捕了 REvil 成员。考虑到俄罗斯正在为干预行动做准备，这是一个尤为奇怪的决定。






  ### 对俄罗斯媒体的攻击


  正如前所述，在战争爆发前一周多，第二波网络攻击导致许多乌克兰网站于 2022 年 2 月 15 日关闭。协调一致的分布式拒绝服务（DDoS）攻击中断了两家银行（Privatbank^[5]
  和 Oschadbank）及其移动应用程序的活动。鉴于此类网络攻击的性质，其影响是有限且短暂的。尽管这些金融机构的网站瘫痪了两个小时，但乌克兰国家银行的数字平台仍持续运行，未受中断（Antoniuk
  2022）。三天后，在白宫简报会上，美国官员直接指认俄罗斯是这起网络侵略的幕后主使。此外，安妮·诺伊伯格详细阐述了调查人员掌握的部分证据，这些证据将所有线索串联起来：“我们拥有技术信息，将俄罗斯总参谋部情报总局（GRU）与之关联，因为观测到已知的
  GRU 基础设施正向乌克兰境内的 IP 地址和域名传输大量通信数据”（白宫 2022）。


  这两波网络攻势接踵而至，正值关于俄罗斯军队在俄乌边境附近大规模军事集结的消息广泛流传之际。欧洲、美国和乌克兰官员将这两波网络攻击均归咎于克里姆林宫控制的黑客。然而，俄罗斯当局否认了这些指控。2022
  年 1 月，在接受 CNN 采访时，总统新闻秘书德米特里·佩斯科夫表示，俄罗斯联邦与此网络侵略无关，并强调俄罗斯反对所有类型的网络勒索（CNN 2022）。随后，俄罗斯驻华盛顿特区大使馆回应了安妮·诺伊伯格指责俄罗斯对乌克兰政府机构和银行发动大量近期网络袭击的言论：“我们坚决拒绝接受这一指控，并强调俄罗斯与这些网络袭击毫无关系，事实上，俄罗斯从未实施过，也不实施恶意网络行动”（RIA
  News 2022）。实际上，无论西方官员措辞多么强硬、即将到来的对俄制裁警告多么严厉，俄罗斯当局仅简单拒绝了指控，未提供确凿证据。


  2 月 24 日，俄罗斯总统普京在向全国发表讲话时宣布在乌克兰开展“特别军事行动”。此番宣布是在叛乱乌克兰地区大规模撤离之后、俄罗斯于 2 月 21 日宣布承认顿涅茨克和卢甘斯克共和国、以及俄罗斯与这些共和国代表签署互助条约之后作出的。随着俄罗斯武装部队从不同方向进入乌克兰领土，欧盟和美国发布了一系列制裁，旨在挤压俄罗斯的金融部门。次日，欧盟对弗拉基米尔·普京和外交部长谢尔盖·拉夫罗夫实施了个人制裁（欧盟理事会
  2022）。


  随着乌克兰战争的爆发，网络空间变成了战场。当政客们忙于对俄罗斯社会各阶层及其商业和政治圈子展开新制裁时，最臭名昭著的黑客组织之一“匿名者”向俄罗斯政府宣战（Anonymous
  2022）。该组织誓言发动数字攻击，以报复俄罗斯在乌克兰的侵略行径。然而，“匿名者”并非孤军奋战，他们决定与其他黑客联手，无论是成群结队还是单打独斗，来自乌克兰、美国、格鲁吉亚、波兰及其他国家的俄语互联网板块。Ghostsec^[6]、AgainstTheWest
  (ATW)^[7]、SHDWSec^[8]、白俄罗斯网络游击队^[9]、乌克兰 IT 军^[10]、NB65^[11]、GNG^[12] 及其他黑客组织站在乌克兰一边，向俄罗斯政府宣战。据报道，部分黑客经验丰富，而另一些则是新手。例如，乌克兰网络安全高级官员维克托·佐拉将该群体与政府划清界限，声称：“志愿者继续他们的行动，我们认为其中一些行动可能具有进攻性……这是他们自己的主动行为，因此该活动不由政府协调”（Marks
  2022）。2022 年，许多新的黑客组织涌现，与俄罗斯黑客一样，他们中的许多人创建了社交媒体账号以宣称其成功的黑客行径。


  值得注意的是，相当比例的俄罗斯公民谴责“特别军事行动”，而乌克兰政府给了他们一个在保持匿名的同时帮助主权国家的真实机会。2022 年 2 月 28 日，乌克兰国家特种通信与信息保护局在其
  Twitter 账号上发布了一条鼓励性的邀请帖：“网络战线现已开放！如果您掌握有关俄罗斯网络防御漏洞（漏洞、后门、凭证）的任何信息，请通过聊天机器人 @stop_russian_war_bot
  举报。乌克兰网络专家将利用您的信息对抗侵略者”（SSSCIP Ukraine 2022）。未披露有多少俄罗斯公民向乌克兰提供了密码及其他网络漏洞详情，但在这条帖文发布后，至少发生了两起严重的网络袭击，俄罗斯调查人员怀疑是“内部作案”。2022
  年 3 月，Yandex 外卖服务发生数据泄露，同年 5 月，俄罗斯版 YouTube “Rutube” 遭到黑客攻击，后果严重。


  入侵前，网络攻击几乎每天都在发生，但从 2 月 24 日起，黑客开始每小时发动多种类型的袭击，几乎每一个数字实体——从小型乡村报纸和本地手工艺店到大型联邦公司和政府部门——都成为了目标。通常，黑客入侵受害者网络的动机多种多样。虽然一些组织专注于数据泄露，寻求经济利益，但另一些则根据其政治立场实施网络攻击，许多黑客仅仅是为了磨练技术、寻求乐趣而发动袭击。针对俄罗斯的网络攻击中，相当数量的袭击是由其坚持和遵循的政治议程所驱动，正如“匿名者”团队在其宣言中所述。他们的潜在目标不难预料。除了黑客行动主义者，还有许多黑客旨在增加财务收入。正如
  Positive Technologies 2022 年调查结果所示，专注于特定经济领域的专业黑客，仅实施了针对政府网站所有攻击的 30%，以及针对工业、金融和能源领域所有袭击的
  10%（Nefedova 2023）。因此，网络攻击成为了小企业主、主播、博主、政治家、医生、房地产经纪人及许多其他俄罗斯公民共同的噩梦。俄罗斯的网络空间成为了一个不言而喻的练兵场，纯粹的务实考量可以隐藏在政治议程背后。





  在对抗期间，密切关注敌方宣传渠道一直是通行做法。对新闻门户、媒体机构、博客和其他媒体机构数字资源的网络攻击是非常可预见且意料之中的；此前运行正常的网站变得无响应且缓慢，会让定期查看新闻的民众感到困惑和迷失方向。自乌克兰战争爆发以来，黑客反复对联邦和地方新闻源（包括受众较小的农村新闻源）发动袭击。尽管如此，对于俄罗斯媒体来源，尤其是联邦级媒体，各类网络攻击并不罕见。2017
  年，`Sputnik Armenia` 挫败了一次严重的 `DDoS` 攻击，而其分支机构 `Sputnik Belarus` 于 2021 年 11 月成功抵御了一次袭击（Rambler
  2017；Sputnik Georgia 2021）。`Russia Today` 公司报告称，其数字实体在 2012 年、2014 年和 2016 年遭遇了大量黑客攻击（RT
  2016）。正如国际新闻机构 `RT` 和 `Sputnik` 一样，面向国内受众的 `Kommersant` 网站也在 2008 年、2011 年、2012
  年和 2018 年频繁遭遇网络攻势（Meduza 2018）。其他国内媒体门户也有网络事件历史，攻击者不仅包括本地黑客，还有外国黑客。


  自 2 月 24 日起，`Anonymous` 的宣言拉开了针对俄罗斯的网络战序幕，许多黑客及其团体将其解读为参战的信号。值得注意的是，一旦某新闻频道成为黑客受害者，黑客往往会多次返回以完成其破坏性工作。鉴于网络犯罪分子数量不断增加，返回的不一定是同一个黑客组织或独行的网络“爱好者”。结果，除其他目标外，俄罗斯在线媒体机构成为俄罗斯联邦第三大受攻击数字领域（Yoachimik
  2022）。2022 年 10 月，安全问题部门负责人 `Sergei Boyko` 强调，外国黑客活动和针对国内媒体资源的网络攻势呈现前所未有的增长（Boyko
  2022）。


  鉴于这种前所未有的激增，本研究根据 `Mediaologia` 公司 2021 年的评级，选择性地关注最受欢迎的媒体机构^[13]。术语“媒体机构”指在线报纸（如
  `Kommersant.ru`）、期刊（`Forbes.ru`）和通讯社（俄罗斯新闻社 `TASS`）。为突显小型农村新闻机构中持续的网络混乱，研究根据实体的地位、受众和地理位置选择实体，其中地理位置对于展示网络侵略的范围至关重要。此外，在满足上述条件的前提下，研究筛选了在研究时间范围内报告、宣布或公开其网络问题的两类实体。


  在 `Putin` 宣布“特别军事行动”几小时后，国家计算机事件协调中心（`NCCC`）向俄罗斯媒体资源发出了预警（NCCC 2022）。该中心强调形势严峻，要求俄罗斯信息平台以及全国关键基础设施对象做好准备，应对因乌克兰冲突爆发而针对其实体的高强度网络攻势。`FSB`
  部门预计将面临来自黑客活动家的网络打击，后者受政治动机驱使，旨在造成声誉损害。鉴于政治不稳定，运营系统的每一次微小中断都必须被俄罗斯媒体团队视为一次攻击（NCCC
  2022）。该预警未提供可帮助数字实体防御攻击的指导。值得注意的是，当该预警发布时，许多媒体网站早已在抵御这些袭击。


  #### Russia Today 和 Sputnik


  针对俄罗斯媒体机构的网络攻击始于对一个象征性受害者——`Russia Today`，以及后来的 `RT` 发动的 `DDoS` 攻击。`RT` 成立于 2005
  年，随后拓展业务，涵盖多语言电视频道和众多社交媒体平台。其运营完全由俄罗斯预算资助。事实上，2014 年 `RT` 公司获得了 4.45 亿美元资助（Tadviser
  2022）。2022 年，政府向 `RT` 拨款 290 亿卢布，这是发送给任何俄罗斯媒体公司的最大金额（Meduza 2021）。


  2017 年，`Alphabet`（`Google` 母公司）首席执行官 `Eric Schmidt` 表示，针对国家资助的 `RT`、`Sputnik` 和其他媒体来源的措施正在进行中，`RT`
  面临的国际压力由此开始（Hern 2017）。其德语分支机构（`RT DE`）于 2021 年 12 月开业，但当局迅速针对这个所谓的“克里姆林宫喉舌”采取行动，在一周内将其从卫星网络上撤下。几个月内，`RT
  DE` 仍可通过 `RT` 移动应用和在线访问（DW 2022）。乌克兰入侵改变了 `RT` 公司的许多处境。战争开始几小时后，应乌克兰政府要求，`YouTube`
  在乌克兰领土上屏蔽了 `RT` 频道（Voanews 2022）。类似的请求导致 `Google` 移除了 `RT` 移动应用，使其在乌克兰无法下载，随后 `Apple`
  也在其商店屏蔽了该应用（Faulconbridge 2022；Mack 2022）。局势每小时都在恶化：全球社交媒体巨头——`Meta`、`YouTube` 和
  `Tik-Tok`，对欧盟地区的 `RT` 机构实施了禁令（Darcy 2022）。同时，`Roku` 公司使其欧洲客户无法访问 `RT`（Darcy 2022）。在英国，`RT`
  的日子屈指可数。英国文化大臣 `Nadine Dorries` 在致英国电视监管机构 `Ofcom` 的信中，将 `RT` 称为“明显是俄罗斯全球虚假信息运动的一部分”（Heffer
  2022）。她辩称，“普京绝不能被允许利用我们开放自由的媒体，将有毒的宣传散布到英国家庭中”（Wheeler 2022）。因此，随着武装冲突爆发，在政治圈的巨大压力下，`RT`
  的报道范围大幅缩减。当黑客介入时，`RT` 公司陷入了进退维谷的境地。


  在宣布对“俄罗斯政府”发动战争后不久，`Anonymous` 黑客对国防部、俄罗斯政府和克里姆林宫等重要网络实体发动了多次网络攻击。`RT` 管理层证实，`Anonymous`
  对 `RT` 网站的袭击从当地时间下午 5 点开始，持续了至少 6 小时。`DDoS` 攻击开始 5 小时后，部分 `RT` 网站关闭，还有几个明显变慢。`RT`
  管理层避免透露任何细节，仅强调参与攻击的 IP 地址中约有 27% 位于美国（RT 2022）。正如许多 `RT` 访客所述，其在一些外国和俄罗斯网站上的页面变得非常慢或根本无法打开（RT
  2022）。不到两周后，针对 `RT` 俄罗斯网站的另一轮严重袭击发起（RT 2022）。




  另一个具有象征意义且广为人知的受害者是卫星通讯社，它与 RT 一起被美国国务院称为“俄罗斯虚假信息和宣传生态系统中的关键要素”（U.S. Department
  of State 2022）。2017 年，卫星通讯社的网络不仅包含多个不同语言的网站，包括后苏联地区的语言，还拥有一个广播平台、社交媒体渠道和一个应用程序（Tadviser
  2017）。入侵发生后，美国、欧盟和全球科技巨头摧毁了卫星通讯社网络，几乎同时关闭了其分支机构。甚至连卫星通讯社至少一名主播、颇受欢迎的阿尔缅·加斯帕良也遭到了个人制裁。他于
  2022 年 3 月被制裁，被指控持续传播“符合克里姆林宫宣传的叙事”。此外，他“利用逻辑谬误解释国际事务，否认乌克兰对克里米亚的主权，并为俄罗斯在刻赤海峡捕获乌克兰军舰的行动辩护”（Opensanctions
  2022）。


  截至 2 月 26 日，卫星通讯社管理层注意到黑客对其网络的关注，当时黑客试图在波兰和捷克共和国关闭其国际平台（Sputnik International 2022）。一小时内，捷克卫星通讯网站在黑客压力下瘫痪。在第一波
  DDoS 攻击中，只有少数分支机构受到攻击，但第二波攻击于 2022 年 3 月 3 日升级，成为严重障碍。据推测来自“匿名者”组织的黑客，同时对卫星通讯社三十个数字分支发动了持久的
  DDoS 攻击（Sputnik News 2022）。结果，卫星通讯社员工无法访问许多部门的网站，因此其公关部门被迫向公众通报正在进行且成功的攻击。鉴于 DDoS
  闪击战造成的技术问题，其工作人员暂时通过 Telegram 渠道发布新闻。尽管黑客竭力破坏，公司 IT 专家仍在几天内恢复了卫星通讯社的网络。


  然而，这些黑客在 2022 年 8 月卷土重来，准备更充分、动机更强，发动了另一次攻击（Sputnik News 2022）。当两家公司的员工下班回家时，他们同时对卫星通讯社和俄新社发动了一系列大规模攻击。这场麻烦的数字闪击战源自泰国、乌克兰、美国、英国甚至俄罗斯的数千个
  IP 地址。据公司 IT 代表称，网络犯罪分子采用了 2022 年 2 月至 3 月网站遭遇的相同攻击模式，但他们行动极其自信：“他们吸取了之前的教训，全副武装地扑向我们的资源。他们的主要目标是让我们公司的整个网络瘫痪，包括其外部和内部服务器及系统”（Sputnik
  News 2022）。在 24 小时内，IT 团队消除了威胁，稳定了在线实体的运行，并据称成功防止了数据泄露。然而，此事通常不被归因为支持乌克兰的“匿名者”黑客所为，因此“匿名者”参与针对这些媒体公司的网络打击存疑。为了适应新的好战现实，卫星通讯社和俄新社^(14)
  加强并增加了网络安全专业人员，实行 24 小时值班。这两家新闻机构成为了黑客难以攻克但极具吸引力的目标。


  #### 塔斯社、《消息报》、俄新社及其他媒体来源


  必须提及其他俄罗斯主流媒体遭遇的网络麻烦，如 RBC、Lenta、塔斯社、Kommersant、《消息报》、Fontanka、Forbes、《Such Things》、Mel
  等新闻媒体。2022 年 2 月 24 日，恶意方对其媒体网站发动了协同攻击，结果许多网站被篡改并进而关闭。几乎同一时间，同一条反战信息出现在各大俄罗斯新闻媒体渠道上。数小时内，观众在多个平台上看到了黑客发布的帖子，这表明知名俄罗斯媒体实体已被攻陷。在
  Kommersant 等媒体的头版，观众发现了如下反战信息：


  > 亲爱的公民们！我们恳请你们停止这场疯狂。不要送你们的丈夫和儿子去那里送死。普京强迫我们撒谎，让我们陷入危险。我们与世界其他地区隔绝。没人想买我们的石油和天然气。几年内，我们将变得像朝鲜一样。我们要它干什么？为了在课本上写普京？这不是我们的战争，让我们停止吧！我们的信息会被删除。我们中的一些人会被解雇，甚至入狱。但我们再也忍无可忍了。（Krymr
  2022）


  帖子下方，黑客插入了“匿名者”标志，而且这条篡改信息署名为俄罗斯记者。


  鉴于此，被黑客攻击的新闻资源试图告知公众其数字实体遭遇网络困难。连同 Kommersant、《消息报》和 Forbes，塔斯社也进行了危机公关，发布了如下更新：“我社官方网站遭到不明恶意行为者攻击，其突破了我们的网络安全。肇事者在我们网站上发布了信息，但这是虚假信息。我社与此无关”（TASS
  2022）。同样，为了澄清反战信息引发的争议，Kommersant 管理层承认失去了对网站的控制权，网站被攻击者操纵。鉴于上传的反战帖子，Kommersant
  还警告其受众极有可能出现其他类似刊物，强调该新闻门户不发表政治声明（Kommersant 2022）。针对该网站的网络攻击始于 2022 年 2 月 24 日，当时肇事者试图破坏
  Kommersant 的媒体报道。Kommersant 的 IT 安全团队数日未能夺回网站控制权，至 2 月 28 日网站仍处于离线状态。


  俄新社是俄罗斯联邦最受欢迎的新闻机构之一；鉴于此，黑客发动 DDoS 雪崩式攻击试图瘫痪其网站并不令人意外。俄新社网站于 2 月 25 日变慢，最终于次日无响应，意味着攻击持续了数小时（Realnoe
  Vremya 2022）。为了安抚受众，俄新社立即宣布其数字平台正遭受持续攻击：“俄新社正努力应对大规模 DDoS 攻击，此前‘匿名者’誓言对俄罗斯发动网络战，且制裁正在展开”（RIA
  News 2022）。2 月 27 日，该机构恢复了网站，恢复正常运行，如果存在其他问题（如数据被盗），则未对外宣布。不明身份的黑客继续实施网络勒索，2022
  年 4 月 4 日，俄新社的客户数据库在互联网上被发现（Leaks 2022）。约 665,577 条记录中，部分包含注册用户信息、电子邮箱、登录名、关联社交媒体账号及其他详情。Leaks
  网站管理员随机核查了多条记录，确认其真实有效（Leaks 2022）。





  这次大规模篡改网站行动的一些受害者未披露细节，而其他受害者则尽可能保持透明。例如，这次篡改行动的目标之一是 RBC 新闻门户网站，该网站成立于 2003 年，并与
  CNN 和 CNBC 保持合作关系（Shakhova 2022）。据 RBC 代表 Anna Abramova 称，该网站遭遇了大量非法流量冲击，每分钟约有 250
  万个请求被发送；这些流量是通过一个恶意网站产生的，黑客在该网站用多种语言针对几家俄罗斯媒体实体发布了请求。该请求要求该新闻公司停止在俄语网络空间传播虚假信息（Yasakova
  and Stogova 2022）。一些 RBC 访客报告称在 RBC 网站上看到了这篇帖子，并向其管理部门投诉。作为回应，RBC 的 IT 专业人员关闭了几台外部服务器，试图将损失降到最低（Voropaeva
  2022）。


  为了监控网站功能并防止潜在攻击，RBC 团队调整了工作时间表，以应对网络紧急状态。尽管采取了措施，但 3 月 1 日，该门户网站仍成功遭受了一次远程 DDoS
  攻击。RBC 集团 CEO Nikolay Molibog 向用户保证，此次攻击似乎仅影响了 RBC 的数字实体，该实体遇到了微不足道的困难，而其移动应用程序运行顺畅（RBC
  2022）。然而，几天后，一些网络用户无法访问该门户网站数小时：“今天早上，我无法打开 Rbc.ru。取而代之的是其首页显示：502 Error. Bad gateway.
  网站无响应。请稍后再试或致电 RBC 管理部门”（Dzen blog 2022）。


  在考察俄罗斯数字平台对社会产生即时政治影响的潜力时，黑客活动家不可能放过电视频道。成立于 1996 年的联邦电视频道 TV Center 于 2022 年 2
  月 26 日遭受 DDoS 攻击（TV Center 2022）。其两个网站——`tvc.ru` 和 `nastroenie.tv`——受到影响，因为客户联系
  TV Center 管理部门，报告网站出现技术问题。不到 2 小时，该频道发布官方声明，指责不明身份的黑客发动攻击，其网站每分钟接收到超过 40 万个请求（TV
  Center 2022）。


  当新闻、商业和国家数字实体遭受网络勒索时，Anonymous 声称成功攻击了“俄罗斯流媒体服务 Wink 和 Ivi（类似 Netflix）以及直播电视频道 Russia
  24、Channel One、Moscow 24”（Anonymous 2022）。事实上，两个在线电视平台（`Ivi.tv` 和 `Wink.ru`）被黑，黑客将
  Russia 24、Moscow 24 和 Channel One 的直播内容替换为一段反战视频信息；据称视频展示了俄罗斯轰炸乌克兰城市哈尔科夫的画面，以及被黑媒体之一的屏幕显示信息：“我们是俄罗斯公民。我们反对在乌克兰的战争。俄罗斯人和俄罗斯联邦反对战争！普京的专制和犯罪政府代表俄罗斯公民发动了这场战争。俄罗斯人！站起来反对乌克兰的种族灭绝！”（Anonymous
  2022）。据 `SecurityLab.ru` 门户网站称，此次黑客攻击持续时间不长，但当局和电视频道代表未立即发表评论（SecurityLab 2022）。


  2022 年 5 月 9 日，俄罗斯公民庆祝国庆节胜利日之际，对 `MTS`^(15)、`Rostelecom` 和 `NTV-Plus` 卫星站进行了其他象征性的网络攻击（Maryanenko
  2022）。黑客活动家更改了电视频道和节目描述，将其替换为政治诉求。结果，这三个站点的广播被中断。据 `MTS-Siberia` 代表称，其技术团队修复了站点，清除了黑客造成的破坏（Maryanenko
  2022）。然而，到当天结束时，广播仍未完全恢复，因为鞑靼斯坦的客户仍无法观看电视。


  自 1990 年代以来，俄罗斯社会每年 6 月 12 日庆祝俄罗斯日。2022 年，这个国庆节几乎被黑客活动家毁掉。引用俄罗斯记者 Andrey Shipilov
  的 Facebook 帖子，乌克兰媒体来源传播了关于 2022 年 6 月 12 日三个俄罗斯电视频道——Channel One、NTV 和 Russia-1
  遭遇黑客事件的消息（Kravchyk 2022; Mediasat 2022）。Shipilov 附上多张截图支持其帖子，他写道：“现在，下午 12:30，我正在录制电视广播。我不知道你们地区的联邦频道发生了什么，但在这里，电视频道被好心人黑了，因为频道正在呈现真相”（Shipilov
  2022）。屏幕上出现了关于俄罗斯武装部队巨大人员损失、高级军官普遍腐败、严重经济问题、天然气和石油供应下降及其他信息，这些信息在 `VGTRK`^(16) 的声明中被定性为极端主义内容。数小时后发布了一份声明，`VGTRK`
  管理部门宣布因针对其数字电视平台“Smotrim”和新闻门户“Vesti.ru”的网络侵略，正面临持续的技术困难（Smotrim 2022）。


  如今，俄罗斯联邦的每个地区都管理着自己的电视台，与联邦媒体相比，它们预算较低，网络防御系统似乎也较差。自 2022 年 2 月以来，联邦频道发生了多起有效攻击事件，导致直播中断，网络安全未能保护这些媒体。地方电视公司成了最容易攻击的目标。据乌克兰媒体资源称，2022
  年 8 月 20 日，乌克兰 IT 军队黑客活动家潜入克里米亚电视台，并用泽连斯基的讲话替换了其广播（Kalitventseva 2022; Ponomarenko
  2022）。2022 年 12 月，`XXII` 黑客组织据称黑入了乌兰乌德的智能电视服务。其客户惊讶地看到了 Alexander Nevzorov 的视频，他在
  2022 年战争开始后不久被迫逃离俄罗斯。然而，名为“War with fake information”的俄罗斯媒体否认了此次黑客攻击，强调该黑客组织可能是假的，且其展示网络攻击的视频制作粗糙（Warwithfakes
  2022）。


  #### 地方小型媒体的网络灾难


  不幸的是，黑客不仅针对知名国家媒体实体，还以地方小型新闻来源为目标。自 2022 年 2 月 24 日起，一个网络攻势成为常态的新时期开始了。俄罗斯联邦的每个地区每天都有多起针对地方新闻媒体的攻击，导致许多数字实体关闭。媒体网站成为活动家推进政治议程、中断新闻发布流程和影响舆论的热门目标。因此，对黑客活动家而言，即使是小型乡村报纸也值得花时间攻击。2022
  年 2 月之前，地方媒体很少遭遇网络攻击，因为黑客的动机主要是经济利益而非政治议程。因此，2022 年的网络混乱对大多数俄罗斯小型新闻门户来说，成为了一个阴郁且意外的现象。


  2022 年 2 月 25 日发生的一起此类事件涉及一家名为 `Kommuna` 的小型地方报纸官方邮箱访问权限被盗（2022）。这家乡村报纸服务于普斯科夫州
  Dedivichevsky 地区的一个小社区。当其困惑的员工试图弄清楚如何打开邮箱时，肇事者发送了大量关于乌克兰冲突的信息。






  放弃夺回邮箱控制权的尝试后，《公社》报的工作人员在其社交媒体账号上发布了一份关于该事件的声明（《公社》报 2022）。在这份声明中，报社管理层否认了这些邮件的真实性，并强调“肇事者以报社名义散布了关于俄罗斯武装部队的虚假信息”（《公社》报
  2022）。据信，参与攻击的亲乌克兰黑客是代表乌克兰行事的。根据一些当地消息来源，黑客成功入侵了其他几家普斯科夫乡村报纸的多个官方邮箱，这些报纸的名称未向公众披露（Vedernikov
  2022）。显然，州长办公室及其下属部门收到了数十封甚至数千封黑客发来的信息。困惑的地方官员开始将这些黑客攻击视为一个非常严重的问题，并密切关注其网络安全和主播的数字素养。不久后，他们组织了一场媒体会议，讨论网络威胁以及在展开的军事冲突和爱国黑客活跃的背景下，地方媒体代表的新角色（Vedernikov
  2022）。


  在新罗西斯克，名为“我们的报”的本地新闻门户网站于 2022 年 2 月 26 日出现技术故障（Bloknot 2022）。其管理层被拒绝访问自己的网站，被黑客屏蔽。取而代之的是，黑客开始以同一个标题——普京的战争——发布许多新文章，文章强调人员伤亡、俄罗斯军队中的大量逃兵、全世界对泽连斯基和乌克兰的支持、对俄罗斯运动员的禁赛以及其他事件。两天后，“我们的报”主编米哈伊尔·阿斯特拉汉采夫在一次采访中承认了针对该媒体门户的成功黑客攻击，建议其受众查看“我们的报”关联的
  Instagram、Vkontakte 和 Telegram 社交媒体渠道上的新闻（Bloknot 2022）。此外，主编联系了 Roskomnadzor（俄罗斯联邦通信、信息技术和大众传媒监督局）报告持续存在的问题，获悉当天俄罗斯联邦各地的本地新闻机构遭遇了大量网络攻击。


  在叶卡捷琳堡，黑客关闭了同一媒体门户的分部（KubNews 2022）。其工作人员承认试图夺回网站控制权未果。据悉，“我们的报”新罗西斯克和叶卡捷琳堡分部使用的是同一台服务器。黑客获得主服务器的完全访问权限后，卸载了五十多篇文章，这些文章同时出现在两个门户网站上（Bloknot
  2022）。IT 专家试图关闭这台服务器以夺回网站控制权，主编被告知短期内极大概率无法恢复控制权。“我们的报”网络的绝望局势迫使其管理层向警方报案。显然，警方调查人员未能找到网络犯罪分子，但至少管理层能保护其员工免受因虚假信息而可能面临的起诉。


  显然，2022 年 2 月实施的大多数攻击都是经过准备和协调的，似乎恶意主体一直在监控叶卡捷琳堡地区，反复冲击当地媒体网站（Bogatyrev 2022）。然而，黑客活动家们保持了适应性。他们能够在需要时改变计划，通过黑客攻击传播特定的政治信息。由地方政府管理的叶卡捷琳堡地区媒体门户“州报”，决定更改其标题中一个字母的外观，以强调其对乌克兰正在进行的战争的支持（Sergeev
  2022）。结果，其网站未能抵御住 2022 年 3 月 3 日开始的网络攻击（Pervo.info 2022）。门户网站被篡改后，数小时内出现了一张以乌克兰国旗颜色呈现的哭泣眼睛图片，并带有“停止战争”的标语（Pervo.info
  2022）。


  2022 年 2 月实施的数字侵略只是网络战争的开始，表明网络攻击将持续并升级。2022 年 5 月，沃洛格达地区报告称本地媒体网站遭遇了 DDoS 攻击洪峰。虽然许多数字资源变慢但继续运行，但两个本地媒体门户——“高度
  102”和“自由岛”遭受了严重破坏。


  然而，并非所有黑客袭击都取得了成功。在卡卢加地区，一家本地新闻机构的媒体团队在其网站上检测到异常在线活动（Vest 2022）。黑客造成了微不足道的麻烦，并未扰乱
  Vest 网站的整体运行。推测鉴于针对热门媒体机构的持续网络攻击，卡卢加媒体公司采取了必不可少的措施，以预防或至少减轻恶意网络活动造成的损害。更不幸的黑客活动在克里米亚被发现。随着俄罗斯入侵乌克兰的宣布，黑客向一家名为“克里米亚通讯社”的本地媒体机构发动了三次
  DDoS 攻击（Interfax 2022）。2 月 28 日，其负责人马克西姆·尼古拉恩科表示，该媒体门户仍几乎是网络犯罪分子的每日受害者，攻击每十二小时进行一次，每次持续约两小时；到目前为止，第三次袭击未对网站造成任何影响（Interfax
  2022）。


  2022 年期间，黑客活动家几乎每天发动篡改攻击，给本地和农村小型媒体资源注入了恐惧。网络事件频率极高，无法界定袭击周期。直到 2022 年 5 月，这一问题仍完全是一个地方性问题，甚至俄罗斯
  IT 分析机构自 2022 年春末起开始在其报告中纳入本地媒体来源。


  2022 年 5 月和 6 月，克里米亚、卡卢加、沃洛格达、利佩茨克、奔萨等地区的 46 个城市中，有 200 多家本地媒体网站处于黑客活动家的密切关注之下（Crimea-news
  2022）。例如，2022 年 5 月，许多俄罗斯地区的媒体机构经历了长时间的 DDoS 攻击。滨海边疆区的两大通讯社——GTRK 符拉迪沃斯托克和 OTV-prim——因长达十二小时的
  DDoS 攻击而停止工作（Vesti Primorie 2022）。据 Roskomnadzor 称，黑客从乌克兰发动了网络攻势。随后，2022 年 5 月 29
  日，不明黑客成功关闭了萨哈林媒体门户 Sakh.online，其受众约为 50 万人（Sakh Online 2022）。派出的 IT 团队数小时内未能恢复该门户。


  相比之下，2022 年 7 月，黑客施加的压力不如 5 月和 6 月强烈。俄罗斯公司 Storm Wall 检测到，其媒体资源于 2022 年 7 月 20 日至
  7 月 30 日被黑客活动家拖慢并进一步导致停止工作数小时（Iks Media 2022）。总体而言，2022 年 7 月，分布在普斯科夫、布良斯克、鄂木斯克、索契、车里雅宾斯克等十四个俄罗斯城市的
  70 多家本地新闻机构遭到攻击。DDoS 攻击的强度低于针对政府网站的攻击：每秒超过 18,000 个请求，攻击平均持续时间为二十小时（Iks Media 2022）。IT
  专家警告称，黑客活动将在 2022 年秋季增强，并呼吁当局保护本地媒体网站（Security Media 2022）。这一预测成真，克拉斯诺达尔、叶卡捷琳堡、克里米亚、卡卢加、鞑靼斯坦等地区均报告了黑客活动。






  ## 俄罗斯媒体和政府遭受的网络攻击


  ### 对俄罗斯媒体机构的影响


  随着乌克兰“特别军事行动”的开始，俄罗斯媒体来源遭受了来自不同国家 IP 地址的恶意代理的非同寻常的网络打击。针对俄罗斯联邦各地媒体渠道的黑客组织试图发表政治声明，并阻止俄罗斯主播及其受众支持入侵行动。几家知名媒体机构成为大规模篡改攻击的受害者，据称由一个黑客组织——匿名者协同发动。攻击持续了数天；每个目标的网站都出现严重问题，最终尽管许多受害者未提供详情或仅透露了有限的技术困难信息，但它们仍失去了对数字平台的控制权。然而，随着反战帖子出现在其网站上，被黑媒体机构的管理层被迫发表公开声明，因为意识到该帖子可能造成长期的声誉损害，即使在删除黑客帖子后影响仍会持续。然而，这些澄清是在帖子出现数小时甚至数天后才发布的，让受众感到困惑。此外，考虑到篡改攻击的强度，有理由推测部分数据可能已丢失或落入黑客之手。然而，媒体渠道对此守口如瓶。


  小型农村媒体机构也经历了网络问题，其管理层极少报告。总体而言，除少数案例外，它们的网络安全和员工数字素养水平薄弱或几乎不存在。地方政府和相关媒体代表试图避免网络事件曝光，因此无法描绘出这一问题的全貌。由于管理层未安装专业网络安全软件，黑客组织成功瘫痪了绝大多数地方媒体网站。因此，网络事件的后果更为毁灭性。在持续网络攻击的背景下，它们的前景不容乐观。考虑到预算有限、网络安全薄弱（或缺失）以及黑客关注度日益增加，许多地方媒体资源将被迫寻求地方或联邦当局的额外资助、裁减员工，甚至关闭新闻机构。


  ### 对俄罗斯政府的网络攻击


  尽管俄罗斯媒体资源经历了大规模网络攻击激增，但其数量和强度甚至无法与针对俄罗斯政府网站的强大黑客的潜力相提并论。2022 年 5 月，普京总统指出国家数字资源遭受的网络打击数量不断增加（克里姆林宫
  2022）。根据 StormWall 报告，2022 年俄罗斯联邦在政府和商业网站遭受 DDoS 攻击最多的国家中排名第四（CisoClub 2023）。与 2021
  年相比，2022 年针对政府数字平台的网络侵略数量增加了两到三倍。这一激增的主要原因是大量黑客活动家的涌现，他们的动机基于政治议程，并以此作为选择下一个目标的指南。根据俄罗斯
  IT 机构的数据，2022 年政府实体的数据泄露事件较 2021 年统计数据至少增长了 1.5 倍。自 2022 年 2 月网络战爆发以来，已有超过二十个属于俄罗斯政府部门的数据库在互联网上流传。


  与俄罗斯联邦的许多其他数字资源一样，对于政府数字实体而言，俄罗斯网络空间自战争爆发以来已成为真正的地狱，因为发动的网络侵略数量惊人地高。匿名者和来自各国的在线志愿者投入了战斗。审视这场网络无政府状态，Check
  Point Software Technologies 威胁情报部门负责人 Lotem Finkelstein 强调：“历史上第一次，任何人都可以参与战争……整个网络社区都卷入其中，许多团体和个人都站队了，要么支持俄罗斯，要么支持乌克兰”（Pitrelli
  2022）。毫无疑问，随着俄罗斯成为所谓的“合法目标”，网络犯罪者的数量开始呈指数级增长。


  属于俄罗斯政府的各类网站成为黑客的主要象征性受害者。如前所述，匿名者在战争第一天成功攻击了多个网站。2 月 26 日，该组织向网民保证其发动网络战的意愿：“匿名者正在进行持续行动，使
  .ru 政府网站离线，并向俄罗斯民众推送信息，使他们能摆脱普京的国家审查机器。我们也在持续开展行动，尽最大努力保持乌克兰民众在线”（匿名者 2022）。匿名者不仅渴望对俄罗斯部署攻击，还欢迎无关联的黑客采取行动：“全世界的黑客们：以
  #Anonymous 的名义攻击俄罗斯，让他们知道我们不原谅，不遗忘。匿名者永远战胜法西斯”（匿名者 2022）。


  根据政府报告和国内媒体消息，截至战争第二天，匿名者或另一个黑客组织已瘫痪至少八个政府网站的运营，如 `Kremlin.ru`、俄罗斯政府 (`government.ru`)、俄罗斯国家杜马
  (`duma.gov.ru`)、联邦委员会 (`council.gov.ru`)、国防部、联邦通信与信息技术监督局、公共服务门户 (`gosuslugi.ru`)
  和内务部。然而，官方否认联邦网站遭受 DDoS 攻击。例如，2 月 25 日，匿名者声称成功入侵俄罗斯国防部内部数据并公开发布了其员工个人信息（匿名者 2022）。国防部的反应即时且意料之中：其代表否认数据泄露，坚称其数据库完好无损，匿名者和其他黑客无法触及，因为根据俄罗斯法律，此类信息不得存储在任何数字平台上（Lezhepekova
  2022）。虽然内务部长弗拉基米尔·科洛科利采夫将军对黑客对全国警务网络造成的损害保持沉默，但地方媒体警告称联邦警察网站于 2 月 25 日遭入侵，最终在两天内关闭（Inkazan
  2022）。除了主要警察平台，以下七个地区的区域警察网站也无法访问：鞑靼斯坦、乌德穆尔特、下诺夫哥罗德、新西伯利亚、伏尔加格勒、别尔哥罗德和克拉斯诺亚尔斯克。显然，许多其他数字分支也面临黑客袭击造成的严重网络损害。





  俄罗斯媒体大量引用了总统新闻秘书佩斯科夫的回应，他表示克里姆林宫网站在 2 月 24 日正常运行（The Village 2022）。但 RBC 主播进行了自己的调查，请求其他国家的居民检查该网站。很快，他们收到了来自白俄罗斯、德国、格鲁吉亚和哈萨克斯坦的克里姆林宫门户网站访问者的大量投诉，称无法打开
  Kremlin.ru（Stogova and Gromova 2022）。检测到一些异常情况。例如，来自德国、英国和捷克共和国的几位访问者没有发现网站有任何问题。显然，IT
  专业人员启动了网络安全措施，试图保护并最大限度地减少恶意攻击的影响。2 月 26 日，佩斯科夫在回应媒体请求时承认，政府实体不仅持续遭受 DDoS 攻击，而且这些攻击已扰乱了正常运作（Ren.Tv
  2022）。当当局不情愿地讨论针对联邦资源的网络攻势时，乌克兰官员瓦季姆·杰尼先科澄清了情况：“昨天，我们和‘乌克兰赛博垃圾邮件’进行了一次行动，关闭了克里姆林宫网站。我们发布了……克里姆林宫工作人员和记者的电话信息”（KUN
  2022）。如今，克里姆林宫员工的电话和电子邮件可以在互联网上和一个为用户方便而创建的 Telegram 频道中找到。


  在俄罗斯，访问量最大的联邦数字实体之一是公共服务门户，俄罗斯公民、企业和外国人可以在那里获得广泛的服务，包括罚款缴纳、专业认证、商业执照等。2020 年，其日均受众约为
  400 万在线用户，2021 年，超过 9400 万俄罗斯公民（即俄罗斯联邦 64% 的人口）在该门户上拥有经过验证的账户（Alekseevsky 2022;
  RIA 2021）。因此，其受欢迎程度和庞大的用户群使其成为黑客活动家的首要目标，他们从 2022 年 2 月 24 日起试图瘫痪国家服务门户。他们持续的攻击迫使数字发展部警告用户门户即将出现技术问题。


  > 数字发展部正面临前所未有规模的网络攻击。截至 2 月 26 日，检测到 50 多起容量超过 1 TB 的 DDoS 攻击，以及多起针对该门户的专业定向攻击。数字发展部强调，我们安全中心的专家成功击退了每一次网络攻击。（PRIME
  2022）


  在萨哈林州和沃洛格达州，许多人抱怨无法访问该门户，而在滨海边疆区，居民强调该网站运行毫无中断（Novosti Volgograda 2022; Sakh Online
  2022）。


  许多注册用户对数据泄露表示严重担忧，因为在这场 DDoS 雪崩之前，即 2021 年 12 月，未知黑客利用其奔萨市分部渗透主网站，发布了该门户的关键技术信息（Sergeev
  2021）。然而，在 2021 年和 2022 年 2 月，官员们向用户保证个人数据库受到保护，黑客无法触及（PRIME 2022）。然而，在 2022 年 10
  月，乌克兰黑客在 Telegram 上发布了据称从该门户窃取的 27,000 多条记录（Leaks 2022; Tadtaev 2022）。该数据库包含 2015
  年 12 月至 2021 年 1 月期间收集的电子邮件、用户名、电话、护照号码以及其他基本个人信息。该门户的数据分三部分在同一个月内分别发布。根据发布此信息的
  Telegram 管理员称，他们联系了泄露数据中随机的个人，只有少数人回复并确认了他们的电子邮件或电话（Leaks 2022）。当第一部分泄露到互联网上时，当局派遣了一支
  Rostelecom 调查小组来审查数据。在检查了每次泄露的记录后，调查人员得出结论，该数据库不符合该门户的参数，但数据很可能是从国家邮政运营商 Russian
  Post (pochta.ru) 窃取的（Balashova, Plamenev, and Chebakova 2022）。


  自 2022 年 7 月以来，1000 万 Russian Post 客户的个人数据被抓取、泄露并在互联网上流传，特别是在 Telegram 上（Savkin
  2022）。该泄露中最新的记录创建于 2022 年 6 月。调查仍在继续，但国家邮政运营商于 2022 年 7 月 29 日确认了此次泄露（Russian Postal
  2022）。Russian Post 有理由相信被盗数据库与邮政的承包商有关，并强调客户的银行记录仍然安全。


  回到网络战的第二个月，2022 年 3 月初在黑客活动方面也动荡混乱，俄罗斯社会每天都逐渐习惯了这种状况。因此，展开的网络无政府状态成为了新常态。克里姆林宫、外交部和其他联邦资源继续与各种网络犯罪分子作斗争，而乌克兰
  IT 军队试图关闭 FSB 网站。结果，FSB IT 专家关闭了该网站以应对这些强大的打击（IT army of Ukraine 2022; Izvestia
  2022）。


  鉴于针对俄罗斯数字实体的网络攻势巨大激增，俄罗斯当局采取措施打破这一令人担忧的趋势，并显然旨在减少对外国互联网服务的依赖。自 2 月 24 日和第一波 DDoS
  攻击以来，FSB 计算机事件中心开始运行一个恶意行为者使用的 IP 地址库。其中包括来自白俄罗斯、格鲁吉亚、乌克兰、俄罗斯、美国、拉脱维亚、德国和其他欧盟国家的
  IP 地址；该名单还包括 FBI 和 CIA 的 IP 地址，以及 USA Today 和乌克兰网站 korrespondent.net 的 IP 地址（Cyberscoop
  2022; ITsec 2022）。3 月，在俄罗斯法院遭受大规模篡改攻击后，数字发展部利用此列表过滤外国互联网流量以保护联邦网站（Dulneva 2022）。有趣的是，该列表的初始部分于
  3 月 2 日发布，考虑到其最后更新于 2022 年 5 月，显然 IT 专家意识到这一努力无效，因为黑客可以劫持域名并继续发布误导性信息（NCCC 2022）。


  除了该列表，NCCC 专家还制定了几项抵御网络攻击的建议，范围涵盖从密码控制和提高员工数字素养，到移除外国外部插件和使用国内 DNS 系统（NCCC 2022）。然而，在
  2022 年 2 月 28 日，政府部门收到了关于使用外国软件和 Anonymous 活动的警告：“据推测，计算机攻击计划通过外国软件更新实施。带有恶意附件的更新分发可通过开发者的官方网站进行”（Ministry
  of Education 2022）。此外，该文件建议员工停止来自美国和欧洲开发者的更新，删除不必要的网络服务和应用程序，并警告每位员工关于 Anonymous
  和其他外国黑客组织的间谍活动，他们通过社交媒体平台寻找叛逃者（Ministry of Education 2022）。




  尽管他们做出了努力，新采取的措施仍不足以防止甚至最小化针对政府网站的网络攻击。随着事态恶化，2022 年 3 月 6 日，数字发展部副部长 Andrey Chernenko
  指示联邦和地方政府部门将其在线域名和服务器迁移至国内系统，退出所有国外网络托管服务，移除由西方公司生成的 JavaScript，并加强密码管理。政府部门仅有五天时间（截至
  3 月 11 日）来执行这些指令（Tichina et al. 2022）。此外，数字发展部强调：


  > 没有计划将俄罗斯与全球互联网断开……我们正在为不同场景做准备，以确保俄罗斯资源可供公民使用。该文件概述了一套基本的网络卫生指令，将更有效地组织工作，保护我们的资源免受恶意活动侵害，保持服务运行，并控制域名。（Tichina
  et al. 2022）


  尽管如此，这一举措在全球广为人知，引发了俄罗斯和外国媒体的讨论和传闻（Djess 2022; Giannelis 2022; NYT 2022; Parsons
  2022; Shome 2022）。继数字发展部之后，俄罗斯官员试图安抚恐慌的公民，称一切正常，互联网不会关闭。2022 年 3 月 7 日，国家杜马安全委员会副主任
  Andrey Lugovoy 表示，乌克兰战争不是切断俄罗斯互联网的充分理由，因为没有全球网络，西方将无法操纵俄罗斯公民，而全球网络是信息战的有力工具（Bylkina
  2022）。国家杜马副手、国家杜马信息政策委员会主席 Anton Gorelkin 指出：“俄罗斯互联网板块太庞大，无法封锁，任何试图将国家与全球网络断开的尝试都会导致全球互联网放缓”（Litvinov
  2022）。然而，2022 年 9 月，FSB 计算机事件协调中心代表 Aleksey Novikov 描述了 2022 年 3 月发生的不同情况。他承认从 2
  月 24 日起，俄罗斯几乎无法控制不断恶化的网络安全，政府曾认真考虑将国家与全球网络断开（Kommersant 2022）。


  自乌克兰战争开始以来，国家航天集团 Roscosmos 成为黑客的常见目标。其关于 DDoS 攻击的首份报告于 2 月 26 日发送给 Roskomnadzor，当时`roscmos.ru`瘫痪数小时。随后，其新闻服务报告了
  3 月、4 月、6 月和 8 月针对该集团发起的恶意网络活动。对于目睹政府和媒体数字资源失效的俄罗斯社会而言，Roscosmos 遭受成功攻击的宣称成为了另一个不愉快的惊喜。据称，黑客团队
  NB65 获得了该集团控制中心的访问权限及对卫星的控制权。在 Twitter 上，其帖子包含一张所谓卫星“车辆监控系统”的图片及以下文本：


  > 俄罗斯航天局确实热衷于卫星成像。更妙的是，他们确实热衷于车辆监控系统。WSO2 已被删除，凭证已轮换，服务器已关闭。网络营不会给你 IP 地址，那太容易了，不是吗？祝你周一愉快地修复你的间谍技术。荣耀属于乌克兰。在你们停止投弹、杀害平民和试图入侵之前，我们不会停手。（NB65
  2022）


  针对这一指控，Roscosmos 负责人 Dmitry Rogozin 承认针对该集团的网络攻击已持续数日，强调 Roscosmos 的防御机制化解了每一次恶意尝试（Vesti
  2022）。根据 Rogozin 的社交媒体账号，他查阅了 Anonymous 关于黑客攻击的转发。“这些骗子和小骗子的信息不实。我们所有的航天活动控制中心均正常运行，”Rogozin
  在其 Twitter 账号上用英语补充道（Rogozin, It is fake! 2022）。面向俄语受众，Roscosmos 官方详细反驳了 NB65 的指控，解释称黑客提到的
  IP 地址属于一个城市交通部门，从未是 Roscosmos 卫星控制系统的一部分（Rogozin 2022）。根据 Roscosmos 的说法，针对该集团的协同
  DDoS 攻击源自乌克兰及其他几个国家，但随着俄罗斯武装部队于 2022 年 3 月 2 日对乌克兰战略设施发动军事打击，攻击力度显著减弱（Moscow 24
  2022）。


  另一起 DDoS 攻击于 2022 年 6 月 29 日发起，恰逢 Dmitry Rogozin 辞职前夕。结果导致 Roscosmos 网站关闭数小时（Fontanka
  2022）。据俄罗斯媒体和 Roscosmos 称，此次攻击是对发布数个北约成员国中心图像的报复。这些图像由该集团的资源-P 空间卫星拍摄。同日，获悉该 DDoS
  攻击并非乌克兰黑客所为，而是源自俄罗斯叶卡捷琳堡。正如一位俄罗斯 IT 专家所言，这可能是一名拥有数台电脑的独狼黑客所为，并无意对`roscmos.ru`造成重大破坏（Moscow
  24, 2022）。


  2022 年 8 月，Roscosmos 连同另外两家国有企业 Rosatom（`rosatom.ru`）和 Rostec（`rostec.ru`）成为黑客目标，后者试图通过其用于内部通信的二十个视频会议服务——Videomost、iMind、TrueConf
  和 Webinar.ru——渗透集团。为摧毁这些服务，每秒 18 万次请求的大规模 DDoS 闪电战于 8 月 12 日发起，持续约 30 小时（Bilyk 2022）。截至
  8 月 29 日，DDoS 闪电战仍在继续；然而，这些企业坚称未造成严重损害或数据泄露，仅内部通信出现轻微中断（Bilyk 2022）。


  当 NB65 黑客（据称隶属于 Anonymous）专注于 Roscosmos 时，Anonymous 策划了另一起引人注目的黑客行动。2022 年 3 月 3
  日，Anonymous 黑客在 Twitter 上展示了对俄罗斯联邦机构 Roskomnadzor 的成功攻击，令人印象深刻。该机构成立于 2008 年，是监控大众媒体和在线媒体内容的主要审查机关。据称，恶意入侵是通过其巴什科尔托斯坦分支机构实现的，黑客窃取了
  36 万多个文件或 800GB 以上数据，其中部分文件为 2022 年 3 月最新签发（Varlamov 2022）。Roskomnadzor 代表未对此次黑客攻击发表评论，仅无视网络上流传的消息及文件。然而，基于此次泄露文件的至少两项调查已公开发布。它们包含实际文件截图，披露了
  Roskomnadzor 近期在境内活动的许多有趣细节（Dmitriev 2022; Marmeladova 2022）。




  ## 俄罗斯网络安全政策与网络攻击事件回顾


  ### 政策部署与机构建设


  为贯彻削减对西方 IT 依赖的既定论述，2022 年 5 月发布的一项新令禁止政府机构自 2025 年 1 月 1 日起使用“非友好国家”生产的网络防御系统（Kremlin
  2022）。2022 年 3 月，政府建立了网络中心网络，旨在保护和监控特定领域的网络事件。5 月 1 日的命令敦促政府部门和组织加快建设步伐，强调地方官员往往无视这一关键举措（Kremlin
  2022）。一个月内，85 个俄罗斯联邦主体中有 99% 建立了运作中的网络防御单元，且在 85% 的政府部门中，这些新单元开始履行其主要职能（Kapranov
  2022）。


  ### 官方叙事与指责


  持续不断的针对国内各类网站的网络攻击，若不解释攻击原因、采取的措施、实际损失等，便无法继续下去。官方叙事由 2022 年 3 月 29 日外交部发布的声明塑造。为引起国际社会对网络无政府状态的关注，俄罗斯指责乌克兰当局组建了由国内外黑客组成的“网络军队”，对俄罗斯数字资源发动战争（Ministry
  of International Affairs 2022）。声明强调，国内数字平台每天经历数十万次网络打击，表明北约深度介入：


  > 这些攻击及其紧密配合清楚地表明，由美国和其他北约专家训练的乌克兰特种 ICT 行动中心对俄罗斯发动的网络战，正在得到匿名黑客和喷子的加强，这些人奉基辅政权西方导师之命行事。事实上，这场网络战是由一支网络雇佣兵大军在进行的，他们被赋予了具体的作战任务，这些任务往往接近恐怖主义。（Ministry
  of International Affairs 2022）


  随后，在安全会议上，普京重申了外交部 3 月 29 日声明的主要观点，即惊人的网络打击数量、针对俄罗斯的展开中的网络战以及协调一致的网络攻势：


  > 包括高级别在内的网络攻击数量激增了数倍……攻击来自国外，且攻击明显经过协调。事实上，国家机构站在这些攻击背后，我们知道一些国家的军队已经包含网络军队。（Kremlin
  2022）


  此外，他强调俄罗斯需要通过发展本土技术和减少使用外国 IT 创新来加强网络安全措施。


  ### 重大网络攻击事件


  有趣的是，俄罗斯节假日成为黑客实施网络攻势的常见时机，此时大多数办公室和部门均处于关闭状态。2022 年 3 月 8 日国际妇女节（俄罗斯广泛庆祝的节日）发生了一系列严重的
  DDoS 攻击，亲乌克兰黑客针对十一家政府网站，如文化部（culture.gov.ru）、内务部、能源部（minenergo.gov.ru）、联邦青年事务局（fadm.gov.ru）、联邦执法局和联邦铁路运输局（Data
  Leaks 2022; 5 TV Chanel 2022）。同时，所有这些数字实体上都被放置了相同的图像，内容为俄乌国旗、坦克和逃跑的俄罗斯士兵。鉴于这些篡改攻击的同步性，有推测认为恶意行为者通过利用安全漏洞，仅获得了对
  `gosmonitor.ru` 一个网站的未授权访问，该网站直接在大多数政府网站上展示特色内容（Data Leaks 2022）。数小时后信息被移除，但这一大规模篡改事件引发了对政府实体乃至俄罗斯数字平台总体存储数据和网络安全质量的担忧。此外，尽管实际损失微乎其微，黑客仍向俄罗斯公民展示了其威胁能力，损害了政府和军队的声誉。


  这场篡改噩梦于 2022 年 3 月 16 日以较小规模重演，新受害者为两个核心部门——应急情况部和俄罗斯仲裁法院。据媒体报道，当地时间下午 5 点左右，哈巴罗夫斯克、莫斯科、滨海边疆区、克里米亚、布里亚特、堪察加等地的
  80 个俄罗斯仲裁法院网站停止工作，取而代之的每个法院网站首页均显示一条新帖子：“普京是头号恐怖分子！海牙法院在等你们所有人！释放政治犯！”（ZaTelekom
  2022）。一个多小时后黑客信息被删除，但法院网站仍瘫痪数小时。当地法院网站受损尤为严重，数日无法为民众服务。最严重的是伏尔加格勒州，其网站瘫痪长达 14 天。为澄清事件，滨海边疆区法院代表英加·索罗金娜（Inga
  Sorokina）强调，整个法院网络基于位于莫斯科的同一台服务器，这让黑客得逞（Lisitsyna 2022）。


  当仲裁法院等待 IT 专业人员恢复主服务器访问权限时，据称乌克兰黑客组织攻击了应急情况部的主网站和区域网站，实施篡改，导致其联邦和许多区域平台瘫痪数日。来自克麦罗沃、圣彼得堡等地的关注人士表示，当地网站持续关闭。攻击者上传了一个模仿官方首页但内容被篡改的新首页，取代了应急情况部惯常的官方网站首页。网站显示几个链接，标题为：“不要相信俄罗斯媒体——它们在撒谎”、“关于乌克兰战争的完整信息”和“俄罗斯的失败就在眼前”。此外，黑客放置了一条信息：“应急情况部通报：在乌克兰阵亡士兵超过
  13,000 名”（Denisyuk 2022）。这个新首页在不到一小时内消失，取而代之的是正常公告：“抱歉造成不便。网站遇到意外错误，将暂时离线”（Fontanka
  2022）。除了篡改和破坏部门网络外，其官方电话号码还被篡改为乌克兰号码。然而，4 月黑客重返应急情况部，针对其媒体门户 `mchsmedia.ru`。篡改门户并羞辱该部，黑客发布了数篇关于乌克兰和俄罗斯的新文章（Ministry
  of Emergency Situations 2022）。值得注意的是，互联网用户表达了对政府无法保护其网站免受黑客攻击的失望，强调政府试图在网络安全上省钱，导致其无效且薄弱（Fontanka
  2022; Nikitin 2022）。





  ## 对俄罗斯基础设施的网络攻击：时间线与分析


  ### 第一波攻击：2022 年 3 月


  随着俄罗斯联邦通信、信息技术和大众传媒监督局（Roskomnadzor）于 3 月 10 日宣布在俄罗斯限速 Twitter，两小时后，最大的互联网服务提供商
  Rostelekom 检测到运营问题，导致多个政府数字门户出现严重故障（Tvrain.tv 2022）。于是，针对政府网站的另一波网络攻击开始了。当地时间中午
  12 点左右，克里姆林宫、俄罗斯政府和国家杜马的网站变得无响应（Kapital 2022）。许多国内外消息来源将 Roskomnadzor 与 Twitter
  的问题与政府数字资源的技术故障联系起来。然而，Roskomnadzor 代表安德烈·波利亚科夫否认了这两起事件之间的关联，强调称“互联网问题的调查正在进行中，我们正在核查中断的细节和规模”（Kapital
  2022）。尽管如此，在这波网络攻击期间，检测到针对内务部、文化部、联邦刑罚执行局（FCIN）和联邦国家统计局（Rosstat）网站的黑客活动。许多政府网站尚未从之前的攻击中恢复，新的攻击又已发起。


  ### 监控系统沦陷：2022 年 3 月–4 月


  作为对入侵乌克兰的报复，出于政治动机的“匿名者”黑客组织于 2022 年 3 月攻陷了俄罗斯联邦的许多安全摄像头。被攻陷的摄像头超过 400 个，“匿名者”在一个专门的网站上发布了来自闭路电视（CCTV）源的实时画面（Anonymous
  2022）。在一篇关于摄像头攻陷的帖子下，“匿名者”宣布了他们计划采取的下一步行动：“我们已经在着手准备下一次摄像头数据泄露，其中将包含来自白俄罗斯和乌克兰的摄像头，主要是战区，这对侦察将更有用。这严格来说是面向俄罗斯人民的反宣传行动”（Anonymous
  2022）。2022 年 4 月 6 日，“匿名者”透露，一个加入其对抗俄罗斯行动的黑客组织（@Thblckrbbtworld）成功获取了“克里姆林宫闭路电视系统”的访问权限（Anonymous
  2022）。为了证明这一说法，“匿名者”在帖子下放出了据称来自克里姆林宫摄像头的画面。值得注意的是，该画面中的场景无法验证。针对这一声明，为安抚担忧的俄罗斯媒体，德米特里·佩斯科夫强调，“匿名者”无法访问克里姆林宫闭路电视系统，因为该系统是隔离的（AIF
  2022）。


  ### 数据泄露与勒索软件：2022 年 6 月


  6 月 5 日深夜，建设、住房和公用事业部遭遇严重数据泄露和篡改攻击，攻击者为 dumpForums.com，勒索赎金 0.5 枚比特币（Akinshina 2022）。黑客威胁要公开被盗的个人数据，给该部两天时间转账比特币。此外，该部失去了对其官方网站的控制权，网络犯罪分子在其上传了一条乌克兰语留言及其加密钱包地址（Novaya
  Gazeta 2022）。很快，该部门网站显示了关于存在技术问题的官方声明。每次成功入侵后，几乎所有受害者（本案中为不同政府部门）都试图向公众保证内部数据完好无损，该部也未改变这一惯例，强调个人数据受到保护，未遭恶意代理窃取。然而，暗网监控显示，来自该部服务器的超过
  100,000 条包含邮箱、用户真实姓名和登录名的个人记录已在互联网上扩散（Zsrf.ru 2022）。无法确定该数据文件何时被窃取。该部是否向网络犯罪分子支付了赎金尚未披露。


  ### 高调目标：圣彼得堡国际经济论坛


  6 月 15 日至 18 日，圣彼得堡国际经济论坛在俄罗斯举行，该论坛被认为是与经济相关的最具影响力的活动之一。6 月 17 日，根据论坛日程，总统弗拉基米尔·普京计划发表演讲。考虑到正在进行的网络战，论坛组织者采取了严格的安全措施保护活动，但论坛基础设施在总统计划演讲当天遭遇了攻击。这是一场强大的
  DDoS 攻击，峰值流量超过 140 GB/秒，导致论坛入场系统和参会者数据库出现重大技术中断（Smotrim 2022)。结果，普京的演讲推迟了一个小时。在普京早前给安全会议的致辞中，总统强调俄罗斯互联网段和
  IT 专业人员成功应对了持续不断的网络攻势。然而，网络安全事件的形势却愈发恶化。任何政府的声誉都与其如何应对网络风险密不可分。自 2 月 24 日以来，俄罗斯社会反复目睹一个接一个国家网站的网络溃败，公民几乎不会对另一次篡改攻击或数据泄露感到惊讶。然而，他们期望至少他们的总统能受到高超技艺的
  IT 专业人员的保护。此次攻击及随后的总统演讲推迟，使社会认识到持续的网络混乱将是长期且持久的。


  ### 选举基础设施遭围攻：2022 年 6 月–9 月


  经过数月的冲突，显而易见，黑客组织将俄罗斯的每一个重要事件视为发动攻势的机会。2022 年 9 月，俄罗斯人民选举地方和区域政府代表，包括十四个地区选举州长。然而，针对中央选举委员会及其地区分支机构的持续网络攻击始于
  2022 年 6 月，至 9 月 9 日已阻止 28,000 次攻击，其中包括 90 次大规模网络攻击（Kuban24 2022）。因此，八十多个地区的选举官员为
  9 月 9 日至 11 日期间的高强度恶意活动做好了准备。


  特别是，网络犯罪分子试图颠覆莫斯科的在线投票平台。选举监督公共总部负责人瓦迪姆·科瓦列夫报告称，在为期三天的市政选举期间，莫斯科在线投票系统记录到了超过 10,000
  次 DDoS 攻击（Izvestia 2022）。总计有 35,000 次企图破坏选举，黑客组织在选举网络、员工账户和其他目标中寻找漏洞（Fomag 2022）。


  ### 对地方政府的攻击


  联邦行政分支机构每天都在与网络攻击作斗争，地方政府也面临恶意代理试图突破其数字平台的高强度活动。然而，由于许多地区官员未能维持强有力的网络防御，且编制内没有 IT
  专业人员，地方政府更容易受到数字威胁。2022 年 2 月 24 日后，市长办公室、州长、地区立法机构、发电厂和其他系统的网站均遭到黑客袭击。






  ### 对政府网站的网络攻击


  如果其他地方政府希望黑客行动主义者会放过他们，那么有两个地点肯定会成为黑客的主要目标：克里米亚和塞瓦斯托波尔。2 月 24 日和 25 日两天里，爱国黑客组织对克里米亚政府网站发动了大规模
  DDoS 攻击。据内政、信息与通信部长米哈伊尔·阿法纳西耶夫称，IT 专业人员成功阻挡了每一次试图破坏不仅政府网络而且其他关键基础设施的数字攻击。“DDoS 攻击始于晚上
  8:27……主要打击集中在克里米亚政府门户网站上，该网站收到了来自位于印度、南美洲和美国的 IP 地址的难以置信数量的请求，”阿法纳西耶夫强调道，并指出克里米亚政府预料到了这些行动（RBC
  2022）。尽管攻击似乎在 25 日停止了，但 2 月 28 日，黑客活动恢复了对政府网站的猛攻。然而，尽管黑客发起了 HTTP 洪水攻击，目标网站仍继续不间断运行（Interfax
  2022）。


  塞瓦斯托波尔发生了类似情况，黑客组织试图瘫痪市政府的数字政务实体（Shuvainikov 2022）。在针对塞瓦斯托波尔网站的一天网络侵略后，该市州长米哈伊尔·拉兹沃扎耶夫表示，由于无休止的打击导致多个网站出现技术问题，该市正经历艰难时刻。雪上加霜的是，2
  月 25 日，黑客通过网络攻击瘫痪了塞瓦斯托波尔市政府网站的运行，导致对该实体的完全失控。


  自 2 月 24 日起，车里雅宾斯克、库尔斯克、伏尔加格勒、喀山、赤塔、哈巴罗夫斯克、圣彼得堡以及俄罗斯联邦许多其他城市的市政当局反复遭受大规模 DDoS 攻击，导致其数字平台的数据丢失和控制权丧失。例如，2022
  年 2 月至 9 月间，伏尔加格勒当局报告了其数字资源遭遇的四波 DDoS 攻击，每次攻击后都停止工作。鉴于这些破坏性攻击，州长叶夫根尼·哈里奇金发起建立了一个本地网络中心，于
  2022 年 10 月开始运营（Petrov 2022）。该网络中心开业不到一个月，下一次攻击就扰乱了市政府网站，导致其运行非常缓慢，且数小时内未显示常规栏目（Chutnekorzhok
  2022）。


  2022 年 4 月，不明黑客篡改了普斯科夫政府网站，该地驻扎着第 76 近卫空中突击师（Inform Pskov 2022）。其士兵曾参与 2014 年顿巴斯地区的冲突，2022
  年俄罗斯政府再次派遣该师士兵前往乌克兰。在被篡改的网站上，肇事者发布了关于该师巨大人员伤亡的信息。此外，在网站的一个栏目中，还插入了一篇关于为俄罗斯武装部队进行的正在进行的筹款活动的帖子。除了政治驱动的黑客外，还有网络流氓单纯破坏在线资源。2022
  年 5 月，萨马拉市平台在周末被网络流氓黑客入侵；他们在常规首页的位置发布了色情内容（63 SamaraOnline 2022）。直到愤怒的市民投诉，市政府官员才发现被黑。


  在提供服务和推行有效网络安全措施的过程中，地方当局实施了越来越复杂的新技术，给网络犯罪分子提供了更多接触他们的机会。在乌克兰战争之前，俄罗斯地区当局就已成为黑客组织的目标，后者篡改其网站并窃取其数据。然而，最近网络侵略的激增暴露了他们的网络无能和准备不足，甚至体现在招聘
  IT 专家方面。据新西伯利亚州年度报告显示，其政府网站经受了 1000 多次 DDoS 攻击（Grachev 2022）。2022 年 1 月至 3 月间，黑客对克拉斯诺达尔地区的地区当局和工业部门发动了
  1253 次攻击（KubanAif 2022）。总的来说，包含克拉斯诺达尔、伏尔加格勒、罗斯托夫和阿斯特拉罕地区、卡尔梅克、阿迪格亚、克里米亚和塞瓦斯托波尔市的南部联邦区，2022
  年经历了约 30,000 次网络勒索企图（Newkuban 2023）。


  ### 对金融机构和企业的网络攻击


  俄罗斯最大的银行——俄罗斯联邦储蓄银行、VTB^(18)、天然气工业银行、阿尔法银行和俄罗斯农业银行，以及其他几家银行，都遭受了黑客源源不断的攻击，试图中断其运营并获取客户数据。2022
  年 2 月，俄罗斯电信-索拉尔公司 Solar JSOC 的执行官弗拉基米尔·德留科夫表示，发生了许多容量高达 750 GB 的 DDoS 攻击（Tyunyaeva
  and Narayeva 2022）。在 2022 年 3 月 1 日至 3 月 10 日的十天里，不明黑客组织对俄罗斯商业部门发动了 1100 多次网络攻击；在这
  1100 次网络攻击中，有 450 多次专门针对银行（Vasyutchenko 2022）。卡巴斯基实验室证实，2022 年 3 月网络侵略的重点从数字国家实体转移到了金融领域（Iliyna
  2022）。鉴于网络侵略的激增，俄罗斯政府开始与银行合作，为其提供 DDoS 防御协助。每家相关银行应向央行发送请求并附上濒危运营系统清单，数字发展部将对银行的互联网流量进行分流（Banki
  2022）。


  自战争爆发以来，俄罗斯联邦储蓄银行每天都遭受来自多个恶意主体的网络攻击，后者发起了包括 DDoS 在内的各类攻击。最强大的攻击之一，达到每秒 450 GB，发生在
  2022 年 5 月 6 日（Securitylab 2022）。该银行董事会成员斯坦尼斯拉夫·库兹涅佐夫强调，约有 27,000 台设备参与了此次网络攻势，但肇事者未能获取俄罗斯联邦储蓄银行的数据（NTV
  2022）。不到两周，匿名者组织声称成功入侵俄罗斯联邦储蓄银行，但被该银行斥为虚假信息（Ren TV 2022）。2022 年 3 月初，俄罗斯联邦储蓄银行否认其应用程序遭到入侵，据称银行客户因此经历了未经授权的取款（Sberbank
  2022）。有趣的是，在 2022 年 6 月 15 日至 17 日举行的国际经济论坛上，同一官员斯坦尼斯拉夫·库兹涅佐夫总结称，自“特别军事行动”开始以来，共有六千五百万客户记录泄露，一千三百多万张银行卡被黑（Tairov
  2022）。不过，他并未说明俄罗斯联邦储蓄银行在此次泄露中所占的比例。


  2022 年下半年是恶意主体持续猛攻的繁忙时期。2022 年 9 月，黑客行动主义者试图破坏俄罗斯支付系统“Mir”的运行，由于 Visa、万事达卡等外国借记卡和信用卡于
  2022 年 3 月加入制裁，“Mir”已成为国家支付系统。一次大规模 DDoS 攻击针对“Mir”系统及其运营商国家支付卡系统（Isakova and Byilov
  2022）。虽然 IT 专家强调国内支付系统保持了高水平的防御，但当局拒绝对该攻击发表评论。10 月，俄罗斯联邦储蓄银行报告了另一次由外国黑客发动的 DDoS
  闪击。幸运的是，该银行的网络防御系统成功抵御了来自 30,000 多台设备的 DDoS 攻击（TASS 2022）。2022 年 12 月初，VTB 客户无法在
  VTB 网站上进行金融交易。正如银行代表所证实的，一个黑客组织攻击了 VTB 网站，导致运营问题（Koshkina and Pashkova 2022）。






  ## 2022 年网络战对俄罗斯数字实体的影响


  每年，银行和其他金融机构都会增加网络防护措施的预算，但 2022 年的网络攻势浪潮截然不同。银行代表们不将其视为一次网络事件，而是视为一场持续的网络战，攻势更加密集且隐蔽。参与者数量庞大。结果，俄罗斯银行在网络技术和人员上的支出大幅增加。


  俄罗斯商业部门也成为众多黑客的目标。尴尬的是，大量中小企业主并未为黑客的关注做好准备。根据战事爆发后不久进行的一项调查，约 70%的中小企业主预期其网站会遭受网络攻击，而
  28%的受访者认为黑客组织对大型且利润丰厚的企业更感兴趣，而非浪费时间在小公司身上（Dailybest 2022）。


  传统上，在线零售业务一直是网络犯罪分子的最爱目标。战争的展开和政治动机的黑客行动主义激增进一步恶化了局势。俄罗斯最大的在线市场之一 Wildberries^19
  未能保护其网站和移动应用免受 2022 年 3 月 14 日的网络攻击。当天，来自俄罗斯联邦各地的许多客户无法登录账户、购买商品或在 Wildberries 上进行任何操作（Habr
  2022）。配送服务停摆。其管理层确认存在技术问题，但坚称并非网络攻击，无客户数据被访问。然而，据多位匿名消息人士透露，3 月 15 日，该零售商成为黑客受害者，攻击由知名且危险的黑客组织
  OldGremlin 实施（Securitylab 2022）。俄罗斯网络空间流传着诸多不祥的传言，称零售商管理层不仅丢失了内部数据，甚至失去了对平台的控制权（Securitylab
  2022）。不过，零售商坚称客户数据完好无损，并已向警方报案。3 月 19 日，网站仍存技术问题，但配送和在线购物开始恢复（Romanova 2022）。


  俄罗斯政府于 2022 年 9 月宣布动员，引发了针对 Rusarmyshop、Voenrus、Gorsing 等品牌在线商店的网络打击浪潮。这些位于莫斯科、圣彼得堡、喀山、摩尔曼斯克和沃罗涅日的商店销售军装、军靴及其他军用服饰（Ixbt
  2022）。网络攻势发动于极不方便的时刻，因“部分动员”驱动的高需求导致商店销量剧增。这波每秒 10 万次请求的 DDoS 攻击，极有可能是由乌克兰 IT 军队组织的，其活动人士在
  Telegram 上号召用户对俄罗斯网站发动攻击。由于缺乏足够的网络防御，超过七十家在线商店被迫关闭；部分离线数小时，另一些则停摆数日。


  2022 年，无论规模和盈利能力如何，包括餐厅、商店、健身中心在内的俄罗斯企业，因大规模网络攻势持续泄露敏感数据。春季月份间，黑客发布了 73 份从俄罗斯公司窃取的信息，而在
  2022 年 6 月至 9 月间，140 个数据库在互联网上流传（Lykov 2022）。


  总之，在全面入侵乌克兰之前，私营和国家的俄罗斯数字实体直接或间接地熟悉黑客攻击，这被视为每个互联网用户不可避免的祸害。自 2022 年 2 月 24 日起，俄罗斯网络环境开始酷似鲨鱼成群的大海，凡入其中者，迟早会被吞噬。Anonymous
  对俄罗斯宣战，不仅是邀请其他黑客对任何俄罗斯网站发动网络攻势，更将针对俄罗斯数字实体的任何行动合法化，理由是为“特别军事行动”复仇。全球和国内层面官方及关心公民缺乏负面反应，助长了黑客气焰。必须强调：防御俄罗斯黑客对欧洲、乌克兰和美国网站的对抗行动，与身处不明地点、由不可控目标驱动的独立黑客组织发动网络攻势，二者有本质区别。据初步统计，约有
  40 万国际黑客参与了这场网络战（Pitrelli 2022）。参战人员构成多样，可分为两大类：黑客行动主义者和黑客。黑客行动主义者活动频繁且猛烈，瞄准娱乐、新闻门户和国家数字实体，但优先攻击经济部门以造成最大财务损失。他们主要利用
  DDoS 勒索。与 2021 年相比，DDoS 攻击数量增加了 60%至 70%（Frolova 2023）。


  据卡巴斯基实验室及其他 IT 公司统计，网络攻击手段多样化，且攻势更密集、强度更大、持续时间更长。2022 年，国家统计数据和 IT 分析师一致认为网络打击数量激增。2022
  年 1 月 19 日，数字发展部代表德米特里·切尔内申科强调，已阻止 5 万次高度专业的攻击，这为俄罗斯创下前所未有的纪录，他称局势为网络“入侵”（Business
  Gazeta 2023）。约 2.8 TB 个人数据泄露记录被发布到互联网或在暗网挂牌出售（Trukhachev 2022）。


  这场网络混乱始于入侵乌克兰，将俄罗斯数字领域变成黑客的全球练兵场。俄罗斯 IT 专家已开发出新的网络防护方案，在隔离状态下，俄罗斯联邦迟早会找到可接受的解决方案，控制住这场网络混乱。这些训练有素的黑客将何去何从？谁和哪些网站将成为他们的下一个目标？


