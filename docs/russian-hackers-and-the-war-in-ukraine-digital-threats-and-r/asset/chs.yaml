  # 第 4 章：黑客赢得公众信任与认可


  ## 品牌信任





  在营销领域，品牌信任是一项至关重要的长期战略，旨在建立一个长期忠诚的客户群。有效的方法将在新业务视角、客户拥护、忠诚度以及塑造购买选择等方面带来回报。对于黑客品牌而言，信任是最关键的范畴之一，必须根据品牌产品的特殊性进行控制、管理和发展。


  一方面，如前所述，大众并不认为黑客行为是透明和公开的。鲜有人听说过或了解白帽黑客，他们的活动是合法且备受尊敬的。在公众认知中，“黑客”一词通常指代罪犯，他们不寻求曝光，反而不惜一切代价避免曝光。另一方面，持续的网络战影响了俄罗斯互联网用户：他们变得更加多疑，行事更加谨慎。考虑到这些公众联想和政治局势，在俄语受众中建立信任对亲俄黑客品牌而言是一个艰难的目标。人们如何能相信黑客团队寻求关注的方式与服装品牌、天才摄影师或青年演员相同？运营
  Telegram 账号的是真正的黑客团队，还是一群骗子？


  网络曝光迫使俄罗斯黑客品牌致力于建立信任的方法。为赢得并保持受众的信心，品牌专注于两个因素：能力和正直。前者指其兑现承诺、执行团队声称能完成任务的能力。品牌正直关乎对品牌真实性和品牌承诺的把控。品牌必须始终如一地兑现对受众的承诺，并符合受众的期望。


  信任难以建立，有效的信任构建策略必须周密且深思熟虑。由于“乌克兰特别军事行动”的展开，黑客群体呈现多元化且高度聚焦政治。2 月 24 日后，随着国际现实迅速变化，俄罗斯社会经历了大规模蜕变。每天都带来突如其来的不愉快发现：全球社交媒体平台被禁、国际制裁展开、新闻报道导向改变，震撼着民众。战争爆发引发了社会分裂：一部分民众不赞成侵略，另一部分支持政府和对乌军事行动（Belokrysova
  等，2022）。俄罗斯社会中还存在一个重要群体，他们未准备好站队；他们对冲突信息的有效性持合理保留态度，拒绝支持或反对战争。考虑到前文讨论的黑客组织政治立场，黑客社区主要吸引了战争支持者，或许在较小程度上吸引了第三类人群。因无法接受任何一方，这些人更容易被吸引加入俄罗斯版“匿名者”，从而在不被花哨政治帖子轰炸的情况下参与其中。对他们而言，黑客品牌是带有隐藏无政府主义意图的叛逆实体。考虑到来自宣传的巨大压力和异常的信息框架，大多数在战争问题上摇摆不定的人，极可能转变为战争支持者，或彻底离开这些社区。


  显而易见，加入此类社区时，这两类追随者都在寻找一个志同道合的圈子，以便参与正在进行的冲突并以某种方式影响其结果。在追随者眼中，黑客会保护社区成员；加入这些渠道的人彼此公开交流，充满自信，并感到足够安全从而参与网络攻击。他们经常请求管理员提供指导，例如如何保护
  Telegram 个人账户、上传哪些 VPN 服务^(1)、使用哪些教育资源获取初步 IT 技能等问题。


  作为回报，黑客团队建立并强化了行为准则，实施严格审核，移除持不同意见的用户以避免冲突。在明显夸大黑客 IT 技能的倾向下，受众相信黑客不仅能获取机密信息，还能获取真实信息。对众多追随者而言，黑客的亲俄立场为他们自己的亲战立场提供了理由；人们的逻辑推演如下：如果黑客坚持这一立场，意味着他们知道公众尚不知晓的内幕。


  此外，随着与黑客团队实时互动的发展，订阅者的社区感和归属感增强为一股强大力量。他们开始为黑客建议攻击目标，要求攻击持不同战争观点、北约、西方价值观等的乌克兰甚至俄罗斯数字资源。而且，想参与网络侵略的追随者数量缓慢但持续增长，因为参与极具吸引力和诱惑力，能提升他们的自尊。


  ### 黑客的能力


  对追随者而言，亲俄黑客不断强调他们的能力和技术。一些团队试图用分布式拒绝服务（DDoS）攻击给受众留下深刻印象，邀请追随者参与，并为其开发便利软件。其他团队如
  XakNet 或 From Russia with Love (FRWL) 则主要专注于更复杂的攻击。毫无疑问，大多数支持者几乎无法分辨这些网络打击类型的区别。对他们而言，黑客组织技术实力的最佳证明是攻击频率和目标的重要性。为维持品牌活力和追随者增长，每个团队都试图发起尽可能多的攻击。然而，严肃工作需要投入大量资源，黑客无法每天用成功的新行动取悦追随者。一些团队账号数周无内容更新或受众互动；其他团队宣布调整渠道内容。在期待新活动模式时，黑客团队以两种主要方式吊足胃口。首先，解释他们即将从网络空间消失且缺乏新攻击，黑客发布消息称正在为下一个目标做准备，追随者应期待近期有有趣动作。11
  月，FRWL 频道告知支持者：“致我们亲爱的家人！我们还活着。但我们做了很多事，稍后会提供更多信息！你们好吗？”（FRWL 2022）。此后，FRWL Telegram
  账号沉寂一个月。相比之下，另一黑客团队 Zarya 积极与社区沟通以维持网络存在感。在多次泄露乌克兰地方政府机构数据和邮件后，Zarya 黑客决定暂停泄露：“我们需要暂停泄露。此后，组织内容将填充为过往泄露分析和信息帖子。我们正在准备一些非常迷人的东西”（Zarya
  2022）。借暗示幕后持续工作，它试图与追随者建立诚实连接。





  其次，黑客让公众相信他们正在做一些极其困难且非同寻常的事情，目前无法透露。这些非同寻常的目标让他们忙得不可开交，以至于该组织无暇顾及其品牌门户。例如，FRWL
  门户管理员写道：“团队积累了潜在目标的技术漏洞”（FRWL 2022）。


  “我们储存了关于对手的有用信息，但如果这些信息不再具有战略重要性和对国家的价值，我们将向公众公开”——FRWL 组织补充道（FRWL 2022）。2022 年
  5 月，Zarya 组织宣布其成功实施了黑客攻击，但该组织并未透露受害者或事件的确切日期（Zarya 2022）。Zarya 一位管理员激起了追随者的好奇心，强调称：“这是对虚假乌克兰黑客攻击的一次严肃反击。但我们需要准备要公开的数据”（Zarya
  2022）。在经历了一段长达数周的公开不活跃期后，XakNet 发布了一条消息，解释了其缺席的原因，介绍了一个新目标，并吹嘘了其过往的成就。


  最引人注目的例子是 Legion 组织针对欧洲歌唱大赛^(2) 发动的那次不幸的攻击（BBC News 2022）。2022 年，这项音乐比赛在意大利都灵举行，共有
  52 个国家派代表参赛。由于对乌克兰宣战，俄罗斯联邦被禁止参赛。2022 年 5 月 14 日定于举行决赛，为了干扰投票，与 KillNet 有关联的 Legion
  组织对欧洲歌唱大赛网站发动了协同攻击。尽管 Zarya 组织在其官方账号中未提及此次攻击，但该组织协助 Legion 查找了欧洲歌唱大赛的 IP 地址（Legion
  2022）。


  在行动开始前至少七小时，Legion 管理员公布了五个所谓的欧洲歌唱大赛服务器，邀请其追随者在预定时间发动打击（Legion 2022）。它宣布了两个主要目标：（1）寻找在线投票服务器；（2）发动集体
  DDoS 攻击，该攻击必须在莫斯科时间上午 7 点前结束（Legion 2022）。聊天参与者中有几人立即回应，强调他们已准备好攻击：“我们没受邀参加这场比赛。既然他们反正已把我们贴上了恐怖分子的标签，我们已准备好完成我们的军事目标！”（Legion
  2022）。一小时后，Legion 团队建议下载欧洲歌唱大赛的 Android 应用程序，并使用嗅探程序检查 IP 地址。随后，为了检查就绪情况，Legion
  管理员进行了一项民意调查，结果显示 80% 的受访者在等待命令（Legion 2022）。共有 578 人参与了投票。有趣的是，即使是 Legion 自己的追随者也不明白为什么
  Legion 决定攻击欧洲歌唱大赛（Legion 2022）。一些人指出，许多人通过电视观看该节目，因此网络攻击毫无意义。其他人则质疑攻击时间，因为 Legion
  下令在欧洲歌唱大赛投票开放前两小时开始攻击。值得注意的是，Legion 团队在下达发动行动的命令前后，通过其聊天室与加入打击行动的活跃追随者进行了沟通。


  尽管要求坚持网络攻击直到上午 7 点，但攻击开始仅三十分钟，Legion 就下令停止（Legion 2022）。许多投入的追随者表达了失望和困惑，称投票程序甚至尚未开始。其他追随者询问他们的攻击是否成功。一些热情的人建议继续攻击。Legion
  帖子下的讨论有演变危险的趋势，因此 Legion 团队赶紧安抚参与者：“别再唠叨了，DDoS 恐怖分子们！一切都按我们的计划进行”（Legion 2022）。“我们不想泄露我们的秘密！明天你们就会看到一切了，”——黑客们继续安抚愤怒的受众（Legion
  2022）。然而，与追随者的争执并未结束，团队发布了一篇关于闪电战军事战略的模糊帖子，旨在以雷霆万钧之势使敌人瘫痪，使其无法做出反应（Legion 2022）。事实上，这一声明解释了为何停止网络行动：黑客遭遇了准备充分的
  IT 专家的强力回应，他们成功保护了欧洲歌唱大赛的网络。确实，第二天，新闻平台传播了关于成功挫败亲俄黑客攻击的警方声明。意大利警方宣布，黑客曾试图渗透歌唱比赛的开幕夜和决赛，但未成功。在预料到网络攻击的情况下，意大利
  IT 专家值班待命，并对社交媒体平台进行了细致监控（Commissariatodips.it 2022）。当俄罗斯媒体开始播报这一消息时，愤怒的 Legion
  团队发布了一份冗长的情绪化声明，以防止声誉受损（Legion 2022）。试图将失败包装成一项精明且预谋已久的发现频道间谍的行动，该组织解释称，其刻意与公众进行公开沟通。随着声明的继续，该组织声称他们在进行演练而非实际攻击。事实上，Legion
  夸夸其谈的在线帖子被情报部队发现并监控，后者已为即将到来的 DDoS 打击做好了充分准备。结果，Legion 团队被迫中止打击，拼命为追随者找一个站得住脚的借口。


  然而，并没有多少追随者意识到到底发生了什么。Legion 组织提供的不明所以的理由被照单全收；有大量用户只是在评论中高呼“俄罗斯万岁”，完全未能将前因后果串联起来。他们继续相信指令背后隐藏的意图，并对黑客的
  IT 技能深信不疑。尽管遭此奇耻大辱，这支黑客队伍的受众规模却持续增长。


  因此，黑客展示了其能力和技能的严肃演示。即使在不活跃期或黑客攻击失败时，他们在受众面前也给人一种全能且时刻警惕的印象。


  ### 对有意义目标的攻击


  给追随者留下深刻印象的另一个有效途径是攻击有意义的目标。在公众心目中，目标的重要性可以抵消对黑客成功与否的要求。黑客倾向于选择广为人知和/或政治上至关重要的目标。对于目标，黑客不仅可以选择特定的行政部门网站或知名商业品牌，还可以专注于特定的地理区域。这些组织通常会宣布，结合当前政治局势，他们计划在可预见的未来攻击某个特定国家，而不提及具体目标。以下列举的攻击在这方面极具说明性。





  乌克兰战争爆发后，极少数公司继续与俄罗斯客户打交道，而绝大多数西方企业则选择彻底退出该市场。2022 年 4 月，俄罗斯社交媒体因迪拜一家香奈儿（Chanel）专卖店发生的一起事件而沸腾。该店员工拒绝向一名俄罗斯公民出售一款高端手袋（Beschetnikova
  2022）。许多有影响力且富有的俄罗斯人对该事件表达了不满，并对阿联酋境内该品牌的服务表示失望。“20 多年来，我一直购买香奈儿和香奈儿高定产品，并坐在其品牌大秀的前排……这情况简直是个冲击！！！我在那里花了
  100 多万欧元；这简直是羞辱，”亚娜·鲁德科夫斯卡娅^(3)在其 Telegram 账号中写道（Rudkovskaya 2022）。迪拜事件发生后，俄罗斯电视名人玛丽娜·叶尔莫什金娜发起了一项名为“撕烂你的香奈儿手袋”的网络挑战（Thevoicemag
  2022）。这被视为对香奈儿针对俄罗斯客户政策的反抗。有趣的是，俄罗斯外交部官方发言人玛丽亚·扎哈罗娃对此事发表评论，指出可可·香奈儿在二战期间曾与德国纳粹政权合作（Zakharova
  2022）。此外，扎哈罗娃还提到了法国解放后不久品牌创始人被捕的情况，以及可可·香奈儿定居瑞士的原因（Zakharova 2022）。这场不断发酵的丑闻引起了`XakNet`成员的愤怒。该组织发表声明，将该情况定性为“不可接受的折磨”。声明强调，目前该公司不在他们的“战术利益”范围内，但战争结束后，黑客们威胁将再次针对该品牌。帖子末尾，`XakNet`警告道：“事实上，我们有一份俄罗斯联邦冒犯者名单。道德黑客行为已结束”（XakNet
  Team 2022）。如果`XakNet`黑客不入狱，且敌人名单确实存在，香奈儿将获得一个强劲的对手。在俄罗斯公众眼中，这种对全球品牌的公开恐吓提升了`XakNet`的声誉和能力。`XakNet`聊天参与者支持未来对香奈儿实施黑客攻击，认为只有强大的团体才能挑战这一著名目标，无人质疑该攻击的可行性（XakNet
  Team 2022）。


  为了推广品牌，`KillNet`组织决定瞄准另一个极具意义的目标——欧洲议会。在实施多轮制裁后，2022 年 11 月 23 日，欧洲议会将俄罗斯联邦指定为恐怖主义赞助商，强调“其武装力量对居民区和民用基础设施实施了无差别攻击，杀害了数千名乌克兰平民，并在全国范围内实施恐怖行为，针对居民区、学校、医院、火车站、剧院、水电网络等各类民用基础设施”，且违反了国际法（The
  European Parliament 2022）。俄罗斯当局的回应迅速且充满挫败感。俄罗斯外交部发言人玛丽亚·扎哈罗娃在其 Telegram 账号中写道：“我建议将欧洲议会指定为愚蠢的赞助商”（Zakharova,
  The European Parliament decision 2022）。联邦委员会外交事务委员会主席格里戈里·卡拉辛辩称该决定缺乏法律依据，“被证明是为了制造信息噪音”并创造新的贬义标签。声明最后他总结道：“我们将看到这种政治分裂症能走多远”（Karasin
  2022）。


  `KillNet`组织不负其名。决议发布当天，作为`KillNet`组织一部分的`Anonymous Russia`对欧洲议会网站发动了成功的 DDoS 攻击。黑客攻击发生在下午，就在欧洲议员宣布俄罗斯为恐怖主义赞助商后不久。结果，网站瘫痪数小时才恢复运行。两小时后，在发布关于俄罗斯新地位的激愤新闻后，黑客们宣称对`europarl.europa.eu`网站实施了攻击，并晒出截图，显示该网站在二十多个州无响应（We
  are KillNet 2022）。这一攻击证据伴随着一条带有恐同性质的不当言论。此外，该组织还追踪媒体和政客的反应，监控欧洲议员和新闻平台的主要账号。其努力未白费：欧洲议会主席罗伯塔·梅措拉在其
  Twitter 上发布了愤慨的信息。她承认网站经历了一次“复杂的攻击”，并辩称是一个“亲克里姆林宫团体”对此次黑客攻击负责（Metsola 2022）。`KillNet`频繁实施
  DDoS 攻击或分布式拒绝服务攻击，这很难被视为非常复杂。此外，自乌克兰战争和网络大混乱爆发以来已过去数月，政治家和决策者有机会观察黑客的行为模式：针对俄罗斯联邦的“非友好行动”极有可能招致网络攻击。考虑到这种可预测的反应，欧洲议会为何在额外网络防护上松懈，实在令人费解。


  `KillNet`受众为这一针对重量级目标的新攻击喝彩。然而，除了传统的普京举香槟酒杯和德米特里·梅德韦杰夫微笑的表情包外，少数聊天成员表达了恼怒。他们指出乌克兰战争旷日持久，要求黑客实施严肃且具破坏力的攻击，停止发动微不足道且无效的行动。一位参与者苦涩地说道：


  > 伙计们，最终做点严肃的事吧。我监控你们的行动已超六个月……但这不严肃。全面战争正在进行，所以做点实质性的事……全世界听到`KillNet`的名字都会感到恐惧。（We
  are KillNet 2022）


  ### 对黑客的威胁：虚假账号


  如前所述，品牌完整性与对品牌真实性和承诺的把控息息相关。鉴于持续的网络战，对于黑客品牌而言，真实性指的是每日监控 Telegram 上虚假账号的流通情况。这些账号每天都在
  Telegram 上出现。为破坏黑客品牌的公信力，Telegram 用户试图模仿其社区和支持频道。冒充者通常上传黑客品牌的视觉标识，并为其虚假账号命名与原账号极其相似的名称。这一策略至少让最缺乏经验的黑客追随者感到困惑。`KillNet`组织成为这些
  Telegram 骗子的主要受害者之一，而其他组织很少遇到虚假账号问题。





  ## KillNet 安全单位与冒充者活动分析


  ### 安全单位的建立与早期冒充活动


  为保护 KillNet 受众并追踪虚假实体，该组织建立了安全单位。第一个冒充账号——模仿 KillNet 支持渠道的账号——于 2022 年 3 月 2 日被发现（We
  are KillNet 2022）。3 月份，Telegram 上流传着 14 个冒充渠道；而到了 4 月，安全单位揭露了两个渠道和一个文件，该文件被宣称为独特的
  KillNet 病毒——`Killnet.exe`（We are KillNet 2022）。虚假账号分为公开和私人两类，传播恶意软件、DDoS 攻击及其他服务等产品。这些虚假实体背后的个人使用的渠道名称与原始
  KillNet 频道名称极为相似。6 月，该组织揭露了另一个拥有 23,000 多名追随者的蜜罐账号（We are KillNet 2022）。因此，尽管 KillNet
  的虚假账号数量从 3 月到 8 月有所减少，但这些虚假实体的“质量”却有所提升，因为它们吸引了大量追随者。虚假频道成为常态，并持续困扰着 KillNet。


  ### 9 月至 12 月的冒充实体检测


  2022 年 9 月至 12 月间，团队在 Telegram 和 Vk.com 上检测到多个冒充实体。在 KillNet 创始人就资金短缺问题发表公开声明后不久，Telegram
  上发现了一个名为 Alena KillNet 的个人账号（We are KillNet 2022）。为筹集资金，KillNet 大力推广加密货币作为支持者捐款的主要来源。然而，为方便捐赠者，KillNet
  也使用其他支付系统；不愿通过加密平台汇款的人可联系该组织的支持渠道以获取指引。显然，冒充者一直在监视 KillNet，并知晓其活动的各种细节。建立该账号的人模仿
  KillNet 的支持账号，以从支持者处骗取钱财。这些捣乱者自称是负责引导客户使用 KillNet 其他支付选项的 KillNet 团队成员（We are KillNet
  2022）。值得注意的是，KillNet 对虚假渠道的日常监控在其追随者中催生了类似的做法。一名女性 KillNet 支持者轻松识破了这一骗局；她强调自己愿意通过该冒充渠道捐款。为完成交易，冒充者向她提供了一个关联银行卡号。这名
  KillNet 支持者立即将该虚假实体连同带有银行卡号的截图上交给 KillNet 团队。KillNet 向其 Telegram 追随者发布警告：“冒充者！我们不会发送消息……”（We
  are KillNet 2022）。另一名作为 Vkontakte 用户的 KillNet 支持者在浏览社交媒体动态时，向黑客报告了其在 Vkontakte 平台上的虚假页面。该冒充账号在俄语受众中寻求赞助（We
  are Killnet 2022）。一经发现，KillNet 团队要求其受众向 VK 管理部门投诉该账号。许多追随者迅速做出反应，在 KillNet 聊天群中报告已提交投诉。在该集体行动下，冒充渠道在一天内被管理员封禁。


  ### 病毒传播与私有 Telegram Bot


  如前所述，捣乱者曾通过将其伪装成 KillNet 开发的独特软件来传播病毒。2022 年 12 月，另一群捣乱者建立了一个私有 Telegram Bot，提议提供多种服务，如入侵个人
  Telegram 渠道、测试 Telegram 账号保护等（We are KillNet 2022）。KillNet 支持者不仅被告知避免与这类渠道打交道，还被要求举报宣传捣乱者的渠道（We
  are KillNet 2022）。


  ### 破坏品牌信任与真实性的尝试


  破坏品牌信任和真实性的尝试可从不同角度发起。冒充者不仅建立蜜罐账号，还试图以亲俄黑客组织的名义实施行动。他们惯用伪造受害者名义发表声明的手段。通过使用可识别的品牌标识，他们创建了符合黑客意识形态议程的声明，从而为捣乱者的行动增加了可信度。KillNet
  和 XakNet 这两个最著名、最显眼的品牌成为首批目标。有两个引人注目的案例，分别发生在 2022 年 7 月和 9 月。


  #### 2022 年 7 月案例：电话恐吓威胁


  2022 年 7 月 26 日，KillNet 团队公开了一条发送至其 Telegram 账号的消息。发件人自称“著名电话恐怖分子”，要求 KillNet 停止攻击波兰数字资源。如果
  KillNet 继续袭击，此人承诺将以 KillNet 名义在俄罗斯联邦制造多起炸弹威胁（We are KillNet 2022）。KillNet 黑客未将这名波兰
  Telegram 用户的威胁当真，显然继续了对波兰的攻击。随后 KillNet 收到另一条消息：“我想和平解决此事。所以，你们组织将轰炸捷克设施。然后，你们将威胁白俄罗斯警察局和维捷布斯克购物中心。名单上再加上阿拉木图机场和地铁站”（We
  are KillNet 2022）。最终，KillNet 团队回复该用户，欢迎其在欧洲发动攻击，并承诺未来为这些行动买单（We are KillNet 2022）。尽管
  KillNet 团队试图将此情况呈现为玩笑，且大多数聊天参与者也如此接收，但该组织对此事严肃对待。在下一条帖子中，该组织澄清了这一争议情况，并警告潜在的网络勒索者：“给其他幼稚的电话恐怖分子——如果你们想以我们组织的名义在任何国家制造炸弹威胁，尽管去！你们无法动摇我们的声誉”（We
  are KillNet 2022）。


  #### 2022 年 9 月案例：“莫斯科之日”摩天轮事件


  2022 年 9 月 10 日，普京总统与莫斯科市政府共同揭幕了一项名为“莫斯科之日”的新景点（MoscowSun 2022）。这是一个巨大的摩天轮，总高度达
  459 英尺（Meduza 2022）。开幕次日，该景点关闭，管理方宣布需要重新校准部分麻天轮设备。次日，自称 XakNet 和 KillNet 的黑客入侵了摩天轮网站并发布了以下声明：


  > 伊久姆投降了。巴拉克利亚投降了。库皮扬斯克投降了。俄罗斯将军抛弃了他们的士兵……我们是不愿容忍懦弱、背叛和欺骗的俄罗斯黑客。KillNet 和 XakNet
  团体联合起来阻止这血腥的摩天轮。当我们的战友在战场上牺牲时，腐败的俄罗斯知识分子却在首都观看烟火、享受生活，这对我们来说是不可接受的。我们要求惩罚那些导致我方士兵死亡的责任人……摩天轮装满了炸药。（We
  are KillNet 2022）


  声明最后威胁要炸毁该景点。声明出现后不久，XakNet 和 KillNet 均否认对此次攻击负责。为澄清情况，KillNet 黑客要求追随者不要轻信 KillNet
  Telegram 账号之外发布的任何信息，即使那些信息展示了该组织的标志和名称（We are KillNet 2022）。作为回应，XakNet 声明强调该组织不在俄罗斯网络空间实施网络侵略，仅专注于乌克兰数字资源（XakNet
  Team 2022）。


  # 结论


  模仿者的主要目标是破坏黑客品牌的可信度。他们不一定以经济利益为目标。为接触黑客受众，模仿者使用了黑客的标志并建立了相似的名称。自 2022 年秋季以来，捣乱活动有所减少，但虚假账号仍是黑客面临的问题。向受众警示检测到的虚假账号已成为常规工作，使其追随者了解问题并变得警惕，且与黑客保持合作。






  #### 政治立场或品牌承诺


  亲俄黑客在进入公共领域并宣告其品牌存在之前，先生成了一个品牌承诺。随后，黑客们将这一承诺缩小并具体化为一套清晰阐述的价值观和体验，供受众对品牌抱以期待。在学习如何在公共领域运作的过程中，这些团队做出了模糊且充满情绪的承诺。“从今天起，我们将通过
  DDoS 攻击袭击所有欧盟国家，”KillNet 团队宣称，承诺捍卫独联体国家的互联网（We are KillNet 2022）。与 KillNet 形成对比的是，XakNet
  组织倾向于不提及其战略潜力，仅声称 XakNet 开展了自己的爱国“特别行动”，旨在击溃乌克兰的虚假信息雪崩（XakNet Team 2022）。尽管 KillNet
  承诺专注于欧洲国家，但该组织暗示乌克兰的数字实体也是目标。另一个亲俄团队——NoName057(16)也是如此，该组织在其于 2022 年 3 月 11 日发布的介绍性声明中暗示了这一点（NoName057(16)
  2022）。自称由俄罗斯爱国者组成的“人民网络军”，承诺监控并采取行动打击针对俄罗斯公民、威胁俄罗斯联邦的行为（People’s Cyber Army 2022）。如前所述，FRWL
  组织在战争爆发三个月后加入了黑客行动主义运动。因此，其品牌承诺反映了其他黑客品牌积累的经验。该组织强调全力支持“俄罗斯在乌克兰的特别军事行动”，承诺在网络空间对抗纳粹主义，正如“俄罗斯战士在战场上所做的那样”（FRWL
  2022）。KillNet、XakNet、NoName057(16)、人民网络军、FRWL 和 RaHDIt 将其承诺面向居住在俄罗斯联邦境内的俄罗斯受众，而
  Beregini 和 Joker DPR 的黑客则专注于那些不支持泽连斯基政府、且不对俄罗斯持敌对态度的乌克兰公民。对于公众而言，缺乏对俄罗斯在乌克兰行动的谴责，即表明这些黑客同情该国。Beregini
  和 Joker DPR 组织以寻求顿巴斯地区的和平为由，将其品牌定位为亲乌克兰但反寡头、亲西方政治取向且反泽连斯基政府。两个品牌均承诺竭尽所能改善乌克兰局势。其议程引起了俄语受众的共鸣，从品牌视角满足了其追随者的期待。


  在此方面，审视另一个组织——Anonymous Russia（匿名者俄罗斯）颇具趣味。该组织反复向其俄语受众发送相互矛盾的信息。在 Telegram 上的一篇欢迎帖中，Anonymous
  Russia 管理员写道，其团队将“反对不道德的国家”（Anonymous Russia 2022）。考虑到该组织使用“Russia”一词以突显其地理归属，Telegram
  受众结合当前政治形势解读了关于“不道德国家”的信息：“不道德国家”指那些谴责俄罗斯联邦在乌克兰行动并积极支持乌克兰的国家。与此同时，该组织将自己品牌化为 Anonymous
  的亲俄分支，并点名批评每一位不支持俄罗斯立场的 Anonymous 成员，但该组织拒绝将自己定义为“像 KillNet 那样的俄罗斯网络爱国者”。尽管如此，Anonymous
  Russia 团队承认双方都是“自由与和平的战士”，但如果 Anonymous Russia 代表全球的自由与和平，KillNet 则代表俄罗斯联邦的自由与和平（Anonymous
  Russia 2022）。


  尽管此前几周才刚刚对 KillNet 发表过言论，且事出意料，但在其出现在 Telegram 不足一个月后，Anonymous Russia 正式宣布加入 KillNet。在俄罗斯用户眼中，这一举动自动使该组织成为亲俄派，并注定要履行
  KillNet 的品牌承显而易见，Anonymous Russia 背后的团队拥抱了原版 Anonymous 的品牌意识形态，却在意识形态斗争中失利，无法将对俄罗斯联邦的支持与全球自由的初衷调和。其创建者试图利用与知名品牌
  KillNet 关联的优势，却未能将个人动机与 Anonymous 的原始诉求相协调。其后续活动清晰地表达了支持并兑现 KillNet 品牌承诺的意愿。


  随着黑客行动主义运动加速、战争危机展开，这些品牌详细阐述了其在网络空间捍卫俄罗斯、攻击其对手的意识形态目标。品牌承诺与黑客的政治观点直接相关。基于这些观点和当前政治时刻，亲俄黑客组织选定了目标。并非每个黑客团队都清晰地塑造并向追随者传达其意识形态立场，但通常黑客会通过转发、与更强大的黑客品牌合并、评论或贴标签来表明立场。这些方法有助于关注者理解品牌及其与自身期待的关联度。黑客政治态度中存在若干观点维度：北约、欧盟、美国、乌克兰民众、乌克兰政府，以及公开批评俄罗斯政府、指责军事侵略的俄罗斯公民。


  通过帖子和与追随者的交流，黑客们表达了对乌克兰持续战争的立场。KillNet 和 XakNet 等一些组织投入大量时间在其渠道发布和转发意识形态信息，而其他组织则倾向于通过转发
  KillNet 或新闻频道来阐述立场。尽管如此，这些黑客组织在关键政治问题和乌克兰局势上持有相同观点。这些黑客实体有一个共同特征：它们反复声明支持俄罗斯在乌克兰的行动、克里姆林宫和俄罗斯武装力量。


  ##### 北约


  对俄罗斯而言，北约传统上被视为对整个地区的现实威胁。苏联解体后，克里姆林宫要求担保前苏联加盟共和国不得加入北约。作为回应，这个军事联盟吸纳了北美和欧洲国家，试图制衡俄罗斯联邦的影响力。俄罗斯政府的反北约叙事多年未实质改变，却被证明对普通民众极具成效和说服力。年复一年，俄罗斯社会对北约持负面态度，2018
  年 3 月反对率为 76%，2022 年 3 月为 78%（列瓦达中心 2022）。仅 10% 的受访者在 2018 和 2022 年表达了好感（列瓦达中心 2022）。这些观点在过去两年以及战争爆发后均未发生显著转变。同样，俄罗斯社会视北约为对俄罗斯威胁的看法也基本未变。2017
  年，74% 的受访者认为该军事联盟构成危险，而 2022 年这一数字上升至 78%。然而，不认为北约构成威胁的人群比例从 2017 年的 25% 下降至 2022
  年的 13%（列瓦达中心 2022）。鉴于这些趋势，俄罗斯宣传者无需花费时间煽动对北约的负面情绪。顺应流传的宣传，俄罗斯社会认为北约是该地区不稳定和不安全的主要根源，这一形象短期内不太可能改变。在这块准备充分的土壤上，政客们可以利用一切必要手段来为任何行动辩护、推广或推进。





  自 2022 年 2 月冲突爆发以来，俄罗斯政治人物反复强调北约在乌克兰冲突中无可争议的作用，以及泽连斯基政府的“提线木偶”性质（Kp.ru 2022；Strozewski
  2022；TASS 2022）。2022 年 2 月 25 日，俄罗斯外交部发言人玛丽亚·扎哈罗娃在阐述干预乌克兰领土的目标时表示：“必须将犯有危害平民罪行的提线木偶基辅政权绳之以法”（Demidov
  2022）。此外，该发言人补充称“乌克兰政府没有主权”，只遵循来自国外主子的命令（俄罗斯外交部 2022）。俄罗斯国家航天集团总裁德米特里·罗戈津在赫鲁尼切夫中心莫斯科导弹设施的一次会议上坚称，乌克兰是一个纳粹政权，并得到北约的积极支持（Rogozin
  2022）。正如黑客的帖子所示，他们持有相同的观点。这一立场的后果导致了首次 KillNet 民意调查，该调查在战争开始四天后发起，询问其追随者选择下一个攻击目标；有两个选项——北约或美国政府网站（We
  are KillNet 2022）。另一个值得一提的有趣事实是 2022 年 12 月 20 日对 KillNet 领导人 KillMilk 的采访。KillMilk
  对军事联盟表达了公开的敌意，强调其在当前战争中的核心作用。当一名参与者询问新计划时，KillMilk 写道：“我想用任何手段消灭北约”（KillMilk 2022）。毫无疑问，这反映了俄罗斯社会内部流传的态度，同时这也意味着北约将继续成为黑客的优先目标。


  黑客们强调北约具有进攻性使命而非防御性，并辩称其积极参与了正在进行的战争，向乌克兰提供武器、情报数据和技术服务。2022 年 3 月和 4 月，KillNet
  团队表示严重关切，如果波兰派遣部队协助乌克兰政府，从而将北约拖入战争（We are KillNet 2022）。KillNet 管理员表达了他们的观点：“波兰加入这场战争的可能性很大。但它不想与俄罗斯作战，其真正目标是乌克兰境内的波兰旧领土”（We
  are KillNet 2022）。


  2022 年 4 月，该组织宣布与名为“Stop-NATO”的俄罗斯 Telegram 社区合作，以对抗“军事联盟和乌克兰的新纳粹政权”（We are KillNet
  2022）。在传播反北约言论时，该组织将自己定义为“国际志愿者运动”，成员来自后苏联地区、中国、中东、拉丁美洲、美国和欧盟。然而，由于语言覆盖范围的原因，其国际基础极具疑问（Stop-NATO
  movement 2022）。其唯一的 Telegram 渠道仅用俄语与追随者交流；不过其网站有两个版本——一个面向俄语使用者，一个面向英语使用者。总体而言，这种设置行不通，因为网站的两个版本自
  2022 年 5 月以来均未更新。然而，其 Telegram 账号定期更新，但成员数量并不令人印象深刻：约 1,200 名追随者。尽管存在这些不利因素，KillNet
  仍打算与该运动建立长期联系。2022 年 4 月至 12 月间，KillNet 内容线程反复展示 Stop-NATO 帖子，强调 KillNet 成员的意识形态和政治信仰。


  乌克兰战争已将全球社会推向核敌对的边缘，这将毁灭全球每一个国家。但北约和现任拜登-哈里斯政府进一步煽动了与主要核大国俄罗斯的冲突。在第一个视频中，KillNet
  黑客强调，鉴于当前的地缘政治环境，这两个斯拉夫群体之间的战争是不可避免的（KillNet 2022）。据他们称，外国特工挑战了斯拉夫兄弟情谊，而作为提线木偶的乌克兰总统泽连斯基将乌克兰人送入了这场毫无意义的战争，屠杀他们（We
  are KillNet 2022）。


  ##### 乌克兰政府及其西方盟友


  在美国及其欧洲盟友的控制下，“新纳粹团体”被组建、训练，并成为乌克兰武装部队的先锋；黑客强调，这些团体过去八年领导了针对顿巴斯人民的战争，而乌克兰政府无视明斯克协议（XakNet
  Team 2022）。指责泽连斯基总统挑起战争，黑客反复强调他将乌克兰变成新纳粹主义温床的关键作用。在视觉传播方面，黑客团队经常发布泽连斯基总统的照片。由于泽连斯基是乌克兰法西斯分子和班德拉追随者的领袖，展示泽连斯基的图片经过策划，旨在以一种荒诞和情感负面的方式呈现他；这些图片经常带有纳粹标志，这也凸显了黑客对这位政治家的看法（FRWL
  2022；We are KillNet 2022；People’s Cyber Army 2022）。


  ##### 乌克兰人


  将乌克兰政府与其公民分开，俄罗斯和乌克兰民族之间兄弟情谊的概念广受欢迎，并深深植根于俄罗斯民族矩阵中。这意味着两国之间深刻的联系，其中“基辅罗斯”是斯拉夫团结的历史遗址。黑客与白俄罗斯、乌克兰和俄罗斯民众共享共同遗产和起源的言论。在其介绍性帖子中，KillNet
  团队将自己呈现为“来自斯拉夫兄弟民族的志同道合的黑客！我们绝不支持战争和同族相残！”（We are KillNet 2022）。在与追随者交流时，XakNet
  强调了对乌克兰平民的尊重和赞赏，该组织无意针对和伤害他们（XakNet Team 2022）。然而，这种言论无法长久维持，XakNet 团队强调，鉴于战场军事冲突的升级和对俄罗斯网站的网络攻击，这种言论注定会结束。2022
  年 3 月，KillNet 管理员承认他们的攻击将对乌克兰平民造成损害：


  > 我们不是博主。我们不能承诺任何事，也不想威胁乌克兰人民。但我们将继续攻击 Anonymous。我们将发布“右区”成员的个人信息。我们将入侵并摧毁对手的网站！（We
  are KillNet 2022）


  当 XakNet 和 KillNet 警告未来有害的黑客行为时，其他团体干脆不再提及或提及斯拉夫兄弟情谊。迟早，每个黑客团体都将被迫在仁慈和无情之间做出选择。





  ### 道德黑客案例


  尽管如此，仍有必要强调几个所谓“道德黑客”的案例。如前所述，3 月，XakNet 团队声称成功攻击了多家乌克兰互联网服务提供商，导致许多居民断网（XakNet
  Team 2022）。XakNet 的追随者被要求帮助团队做出正确选择：是切断互联网，还是什么都不做以避免严重损害（XakNet Team 2022）。无论调查结果如何，该团队仅对提供商的设置进行了微小更改，并将所有数据归还给了所有者（XakNet
  Team 2022）。


  2022 年 7 月 29 日，FRWL 发布了一份情绪化的声明，旨在推广该黑客品牌的意识形态议程。在此之前，其成员据称对乌克兰网站 `organosyn.com.ua`
  实施了成功攻击。这是一家位于基辅的药理学公司。据黑客称，其团队获得了对该系统的完全访问权和控制权。然而，引用黑客运动的所谓“道德准则”，FRWL 宣称：


  > 为了保护乌克兰平民的生命，我们准备提供一份完整且免费的网络报告，详述该网站的漏洞及我们的修复建议。为了获取报告，网站所有者应通过我们的支持渠道联系我们，并在联系我们前，为生病的儿童捐赠药品，并向我们发送该行动的视频报告。（FRWL
  2022）


  该帖子下附有两张截图，作为黑客攻击的证据。FRWL 的追随者对黑客的专业技能、仁慈、利他主义以及对受苦儿童的尊重关怀感到振奋。结果，该帖子引发了强烈的情感共鸣，获得了
  100 多个赞，犯罪活动再次因其情感诉求而被视为正当合法。


  上述 FRWL 案例发生在 7 月，但早在 2022 年 3 月底，在黑客中享有盛誉的 XakNet 决定不再做“道德黑客”，转而发动实质性攻击。其团队在攻破乌克兰财政部后改变了立场。浏览窃取的数据时，XakNet
  团队发现乌克兰在全球范围内索要军事物资资金。他们将泽连斯基政府称为“厚颜无耻的罪魁祸首”、“骨子里腐烂”以及“利用乌克兰人榨取疯狂的钱”。此外，黑客推测乌克兰政府成员“将这笔钱存放在他们的离岸账户中”（XakNet
  Team 2022）。


  > 我们团队不想深究政治。我们将发布财政部泄露的文件。XakNet 团队给法西斯分子一记耳光。我们不再要求其他团体停手，因为乌克兰和俄罗斯的区别已变得显而易见。俄罗斯人为国家利益而战，出于对俄罗斯的爱与责任。但法西斯分子为钱工作。我们目前的攻击轻易就能卖出数百万。我们不需要美元；我们爱我们的国家。（XakNet
  Team 2022）


  因此，这些黑客持亲俄立场，并兑现了对俄罗斯社会的承诺。


  ### IT 专业人士外流与“叛逆名人”


  随着西方国家接连对俄罗斯联邦实施毁灭性制裁，外国企业决定撤资，许多俄罗斯公民决定离开该国。在名人、商人、记者和官员中，IT 专家成为外流率最高的职业群体之一。据俄罗斯电子通信协会负责人称，2022
  年 3 月 22 日，有 5 万至 7 万名 IT 专家离开了俄罗斯。


  Sergey Plugotarenko 进一步警告俄罗斯政府，IT 专家将迎来第二波外流潮（Interfax 2022）。考虑到正在进行的网络战，每天都有许多俄罗斯网站遭受严重攻击，克里姆林宫和俄罗斯社会对这一局势极为担忧。试图解决问题或至少减轻专业人才损失，俄罗斯政府仓促出台了一些优惠政策。首先，政府提供大量资金和暂时性税收减免以支持国内
  IT 公司；IT 专家有权获得低息抵押贷款、缓征兵役和减税（Balashova, Chebakova, and Kornev 2022）。


  许多黑客团体对此次外流感到愤慨，视同己出。事实上，XakNet 团队不断发表声明，试图安抚担忧的受众：“别担心：俄罗斯 IT 专业人士都在家里。我们不走。一切都好。我们将专门为我们的国家工作”（XakNet
  Team 2022）。尽管如此，尽管政府采取了措施，夏季期间 IT 专业人士仍成群结队地离开俄罗斯。FRWL 的一份情绪化声明强调：


  > 朋友们！我们不想触碰这个话题，但我们不得不讨论。几个月来，我们眼睁睁看着 IT 专业人士逃离国家。我们再也无法视而不见……我们的朋友抱怨土耳其、泰国和南美的酒店挤满了来自俄罗斯的
  IT 专家。他们谴责和指责俄罗斯……停止吧！你们需要你们的国家。如今，我们面临全面的网络战，我们是俄罗斯的主力部队。（FRWL 2022）


  FRWL 团队否认 IT 专家受到恶劣对待、被迫应对不当工作条件，要求他们“停止恐慌和懦弱的逃跑”（FRWL 2022）。声明最后，FRWL 团队将 IT 专业人士定性为叛徒，指责他们为钱不惜出卖祖国。俄罗斯黑客品牌将此次外流视为其开始建立公众形象的原因之一，这可能会产生严重后果。


  黑客们不仅攻击同行，一些黑客团体还谴责逃离的俄罗斯名人。事实上，这些名人因逃离俄罗斯联邦并谴责俄罗斯军队在乌克兰的行动，遭到了俄罗斯同胞的愤怒。


  叛逆的俄罗斯公民（包括名人和商界人士）数量每月都在增加，因此，持明显负面态度的俄罗斯社会质疑官员和文化精英：这些逃亡人物若选择回国，是否会受到欢迎。政治家和文化界人士都无法忽视这一日益增长的公众诉求。一些官员试图煽动负面情绪；另一些人则呼吁更理性的回应。首个反应来自政治圈。战争开始四天后，前俄罗斯总统德米特里·梅德韦杰夫在
  Telegram 上表示，离开俄罗斯的人仇恨祖国，渴望其战败，必须被视为“公敌”（Medvedev 2022）。推动这一话题，罗戈津嘲讽逃往他国、拒绝以任何方式支持俄罗斯军队的背叛成功名人和寡头（Rogozin
  2022）。为平息日益增长的愤怒，俄罗斯总统新闻秘书佩斯科夫将逃离公民分为两类：第一类是不承认且害怕政治局势发展的个人；第二类是公开批评克里姆林宫行动和俄罗斯武装部队的真正国家敌人（Anisimova
  2022）。特别是，佩斯科夫反对玷污伊万·乌尔甘特^(4)的名誉，强调他私下认识这位主播，且知道他一直是俄罗斯爱国者（Anisimova 2022）。佩斯科夫对伊万·乌尔甘特的立场招致了卡德罗夫的回应，车臣领导人指出佩斯科夫立场“模糊不清”（Kadyrov
  2022）。





  > 我当时并不知情，原来要成为一名真正的爱国者，你需要大声疾呼地批判俄罗斯的行动并移居国外，还要搞得很可怜。在自己周围制造声势。然后，等政治局势变得更宽容时，再回到俄罗斯。这套路真管用！


  车臣领导人卡德罗夫在其 Telegram 频道中写道。当精英阶层还无法统一立场时，俄罗斯社会对被迫移民海外的人士（尤其是公众人物）变得非常苛责。


  KillNet 密切关注这一特定议题，并在此嗅到了严肃的营销良机。3 月，其管理员发起了一项新投票来娱乐粉丝，询问粉丝是否希望黑掉几位俄罗斯名流——普加乔娃^5、加尔金^6、梅拉泽^7、索布恰克等（We
  are KillNet 2022）。毫无疑问，绝大多数受访者欢迎报复的可能性。当天，其频道上流传出几个指向这些人被盗信息的链接，呼吁粉丝查看关于“俄罗斯叛徒”的数据（We
  are KillNet 2022）。不清楚黑客攻击是否由 KillNet 团队实施。但其受众非常兴奋，并未质疑攻击的性质。


  2022 年 3 月，阿拉·普加乔娃和马克西姆·加尔金夫妇带着 9 岁的双胞胎独自搬迁至以色列。加尔金在演唱会和社交媒体账号上多次对俄罗斯入侵乌克兰及克里姆林宫发表严厉批评（Meduza
  2022）。结果，KillNet 给这对夫妇贴上了“前超级巨星”和“叛徒”的标签（We are KillNet 2022）。后来，当俄罗斯媒体宣布阿拉·普加乔娃于
  2022 年 8 月现身莫斯科时，愤怒的 KillNet 团队声称：“普加乔娃说她度假后回到了俄罗斯！我们不信！滚……回去”（We are KillNet 2022）。KillNet
  猜测马克西姆·加尔金是否也一同回国，因为黑客想惩罚这位演艺界人士的反俄立场（We are KillNet 2022）。鉴于这种失控的网络混乱和俄罗斯缺乏严肃的网络安全，这一警告不应被忽视和漠视。名人始终是各类罪犯梦寐以求的目标。


  对 KillNet 而言，普加乔娃和加尔金夫妇并非唯一目标。2022 年 7 月，其受众参与了下一轮投票。在十位媒体名人中，受访者可挑选一位作为 KillNet
  未来的黑客目标（We are KillNet 2022）。以微弱优势领先，俄罗斯博主兼记者尤里·杜德获得 46% 的选票位居第一；第二、三位分别是克谢尼娅·索布恰克（30%）和亚历山大·涅夫佐罗夫^8（28%）。热情的追随者不仅要求黑掉投票名单上的名流，还要求黑掉马克西姆·加尔金、安德烈·马卡列维奇^9
  和鲍里斯·格列本什奇科夫^10。值得注意的是，黑客品牌利用调查来激发社区参与度；然而，他们极少兑现承诺，这正是该投票的结局。投票结束后，KillNet 将目标转向立陶宛、波兰、美国及其他国家。


  然而，投票受访者并未忘记黑客的承诺。随后几周，粉丝们轰炸黑客，询问何时黑掉尤里·杜德。2022 年 8 月 29 日，愤怒的 KillNet 被迫回应，解释既软弱又无说服力。表面上说是组长生病了，而团队忙于其他目标（We
  are KillNet 2022）。最后，黑客们掩饰不住对烦人粉丝的恼火，为了让他们安分，KillNet 写道：“各位！如果你们没听到攻击消息，就意味着我们在筹备攻击。别忘了，我们不是政府部门，所以只有有空时才能干活”（We
  are KillNet 2022）。令人惊讶的是，KillNet 公众停止了抱怨，转而关心 KillMilk 的健康，并向黑客保证他们愿意等待多久就等多久。KillNet
  品牌建立了一群极其忠诚的追随者，他们甚至愿意毫无保留地接受这种无法令人信服的解释。此后，KillNet 再未提及此投票及黑掉尤里·杜德的承诺。事实上，这意味着黑客未能发动成功的攻击。


  另一个对黑客意义重大的目标是亚历山大·涅夫佐罗夫。他因担心被起诉而被迫逃离该国，因为调查委员会已针对他启动调查。


  委员会声称，涅夫佐罗夫在其 Instagram 和 YouTube 帖子中散布虚假信息，暗示马里乌波尔的一家医院被俄罗斯武装部队故意炮击（Sledkom 2022）。此外，调查人员强调，他的帖子包含由乌克兰媒体制作的不准确照片。值得注意的是，关于传播虚假信息或呼吁对俄罗斯实施新制裁的新法律于
  2022 年 3 月 4 日由俄罗斯总统普京签署生效。根据该法律，个人将面临最高十五年监禁的罚则（国家杜马 2022）。从此，发布与官方媒体来源不同的新闻成为可惩罚行为。调查委员度利用这项法律追查亚历山大·涅夫佐罗夫并封锁其网站。


  2022 年 3 月 22 日，RBC 主播联系上亚历山大·涅夫佐罗夫，他表示已离开俄罗斯前往其他国家（Gromova and Ovsiannikova 2022）。随后，涅夫佐罗夫连同其他几位俄罗斯公民被认定为“外国代理人”，并被缺席签发拘留令（Novaya
  Gazeta 2022）。


  考虑到著名记者亚历山大·涅夫佐罗夫的名字登上新闻头条数周，黑客们发现他的网站是个绝佳目标。这能让黑客品牌引起媒体关注。首次攻击发生在俄罗斯总检察长下令封锁 `nevzorov.tv`
  网站后的第八天。黑客组织“DepartmentZ”（后改名为 Bear.IT.Army）于 2022 年 4 月 4 日对其发动 DDoS 攻击，并在该组织的
  Telegram 账号上发布公告并附上截图（Bear.IT.Army 2022）。


  尽管如此，四天后网站恢复全面运行。2022 年 5 月 13 日，KillNet 组织报告称对涅夫佐罗夫网站发动了另一次成功的 DDoS 打击，由 KillNet
  旗下名为 Mirai 的分队实施（We are KillNet 2022）。KillNet 的攻击紧随俄罗斯巴斯曼尼法院下达涅夫佐罗夫逮捕令之后（Voropaeva
  and Serova 2022）。KillNet-Mirai 攻击后，网站处于维修状态，显示“错误代码 1020”长达三周多。有趣的是，尽管 KillNet 聊天成员持续推动黑客再接再厉，KillNet
  无视追随者的争论和情绪；该网站不再是个有趣的目标。


  因此，绝大多数亲俄黑客组织既未追踪 IT 专家的外流，也未追逐俄罗斯名流。此外，他们虽热情支持俄罗斯武装部队并拥有特殊技能，却无视俄罗斯国内各界公众人物公开贬低俄罗斯在乌克兰军事行动所引发的丑闻。遵循所谓的黑客道德准则，这些组织无法在俄罗斯联邦境内实施攻击。即使黑客们因克谢尼娅·索布恰克关于
  KillNet 与 XakNet 联合打击的文章而愤怒，XakNet 和 KillNet 也未对她发动网络勒索。


  #### 新的黑客战术





  ### 非黑客攻击：骚扰与投诉活动


  除了大量的网络攻击外，两个组织实施了非黑客攻击：NoName057(16) 和 KillNet 组织了骚扰和投诉活动，针对各种乌克兰和俄罗斯实体。与不使用通信手段的
  KillNet 形成对比，NoName057(16) 的骚扰活动包含两个步骤：散发邮件或消息以及 DDoS 打击。


  #### NoName057(16) 的骚扰活动


  在 DDoS 攻击之前，NoName057(16) 团队会向员工发送邮件或直接消息，其文本内容会发生变化。有时，黑客会以其黑客组织的名义签署这些邮件和消息，但也有邮件试图模仿官方公文的写作风格，并以俄罗斯调查委员会的名义签署。


  例如，2022 年 3 月，在新闻门户网站 oukr.info 工作的记者两次收到了 NoName057(16) 的消息。在第二封邮件中，NoName057(16)
  强调：


  > 黑客组织 NoName057(16) 想要警告门户网站员工。如果门户网站不停止散布关于俄罗斯联邦的虚假信息，我们将继续打击你们的网站. 你们所有人都将面临正义的审判.
  在为时已晚之前考虑法律后果。


  为了消除对发件人意图的疑虑，在这封邮件的末尾，黑客放置了组织名称及指向 NoName057(16) Telegram 账户的外部链接。尽管该新闻门户知晓发件人身份，但另一家新闻机构收到了一封欺诈性邮件。


  2022 年 3 月 28 日，乌克兰新闻机构 4studio 收到了 NoName057(16) 的冒名消息：


  > 俄罗斯调查委员会对 4studio 人员发起刑事调查，怀疑其涉及极端主义活动. 相关个人信息已移交当局. 当乌克兰领土处于俄罗斯军队控制下时，4studio
  员工将被讯问并进而定罪.


  此外，该邮件提出了一组强制性条件，以帮助他们避免即将到来的定罪。从意识形态角度来看，通过这些邮件，NoName057(16) 团队凸显了其黑客行为背后的政治议程及其对俄罗斯政府的直接支持。从技术角度来看，显然这些冒名邮件或直接消息能够触达所有目标，因为反垃圾邮件工具无法有效检测它们，因为这些通信的到达量很小。此外，黑客团队通常不附带恶意外部链接或可疑附件。


  NoName057(16) 团队承诺将不懈追捕每一个制造和传播“假反俄新闻和宣传”的乌克兰新闻媒体来源。鉴于此，NoName057(16) 的骚扰活动组织有序。最初，NoName057(16)
  成员建立新的电子邮件地址或在允许从无关联账户发送消息的社交媒体平台上建立傀儡账户。通过建立 NoName057(16) 独特的品牌内容并在 Telegram 用户中建立信任，黑客不仅观察无响应的网站，还有一到两名团队成员加入受害者的社交媒体渠道，以追踪和截图任何与其发起的活动相关的内容线程。许多收到
  NoName057(16) 类似警告的受害者在其个人或官方社交媒体账户上公开了这些警告。记者们试图与同事分享他们担忧的经历，而 NoName057(16) 团队旨在收集其黑客行为的视觉证据。


  一旦 NoName057(16) 关闭一个网站，它会返回并再次攻击同一受害者。例如，在 3 月 8 日至 4 月 6 日期间，新闻资源 Ukr.net 经历了三次以上的
  DDoS 打击。3 月 31 日，NoName057(16) 庆祝了对乌克兰新闻门户 Zadix.net 的第二次成功网络攻击，并强调：


  > 其利沃夫纳粹管理层吸取不到教训，继续向我们的国家泼脏水. 美化斯捷潘·班德拉，它试图抹黑俄罗斯军队. 鉴于这一政治立场，该新闻媒体将反复遭受打击. 停止在
  Telegram 上哭诉我们的 DDoS 攻击！


  值得注意的是，NoName057(16) 旨在给公众留下深刻印象，而不期望他们有任何互动，而 KillNet 则要求其受众积极参与 KillNet 的倡议。


  #### KillNet 的投诉活动


  KillNet 团队大约每月发起一次投诉活动。KillNet 如何选择受害者尚不清楚。考虑到 KillNet 的支持账户被广泛宣传，Telegram 用户向乌克兰和俄罗斯的
  Telegram 账户以及立场明确亲乌克兰的网站发送了投诉。此外，在每个 KillNet 帖子下，聊天参与者会提出一些要求，请求该组织摧毁敌对的在线实体。尽管
  KillNet 的聊天管理员通常不回应这些要求，但黑客无法完全忽视其受众。因此，当黑客挑选下一个目标时，他们会浏览粉丝的消息，并根据自己的亲身经历选择受害者。他们的选择取决于各种因素，范围从当前的政治形势和黑客所需时间到内容简短程度以及对组织声誉的潜在积极影响。


  2022 年 6 月，该组织检测到一家乌克兰媒体试图联合其追随者对 KillNet 的分支机构 Legion 发起投诉攻击。KillNet 没有等待 Telegram
  管理部门的纪律处分，而是组织其众多追随者投诉这家乌克兰媒体，发起了反击。由于这场数字决斗，Legion 的 Telegram 频道幸存下来，但乌克兰的对应频道被关闭或被迁移到新账户。


  2022 年 9 月 15 日，KillNet 团队勃然大怒，并忙乱地对一名提供印有 KillNet 品牌标志 T 恤的 AliExpress 卖家发起了新的活动。黑客将其视为对该组织标志的“未经授权使用”。KillNet
  受众的很大一部分不同情其对 AliExpress 卖家的挫败感，反而为卖家的商业创意鼓掌，并暗示这可能对品牌知名度产生积极影响。KillNet 的聊天管理员监控讨论并推动追随者提交投诉，对持不同意见的参与者进行攻击。当几个聊天参与者开始讨论购买
  T 恤和运费时，KillNet 管理员感到受辱，并要求他们不要购买 T 恤。最终，尽管明显不同意 KillNet，其受众还是遵从了其命令。结果，自第一条关于 T
  恤的 KillNet 帖子发布以来，不到两小时内，AliExpress 网站就移除了有争议的产品。通过猛烈攻击这位小商人，KillNet 将自己呈现为品牌建设者，在其品牌支持者中灌输了强烈的印象，即其控制着品牌在线形象的方方面面，从而赢得了信任。





  正如前文所述，黑客选择受害者的方式并不总是透明的。2022 年 9 月，不知名的志愿者以某种方式引起了 KillNet 对俄罗斯联邦境内欺诈活动的关注。据称，这些女性志愿者想为顿巴斯地区的俄军购买几条香烟。在将全部款项转给卖家后，该公司消失了，电话也无人接听。万般无奈之下，志愿者请求
  KillNet 组织追踪该公司及相关人员。应 KillNet 的要求，其受众和关联团体协助篡改了这伙诈骗分子的网页，他们骗取了约 1000 美元（We are
  KillNet 2022）。在篡改网页前，管理员曾要求犯罪者归还赃款，但显然款项未被退还，因为几小时后，一名核心团队成员和几名热心追随者公开了诈骗分子的个人信息（We
  are Killnet 2022）。在 KillNet 聊天群中，女性志愿者感谢了 KillNet，并表示警方调查人员已收到提取的数据。


  ## 品牌知名度


  ### 黑客合作


  如前所述，有几个黑客品牌进入公众视野，开始打造自己的品牌并聚拢人气。正如互联网常见的情况一样，黑客们很快意识到获得网络曝光的好处之一：他们可以找到志同道合的团体来推进自己的品牌和产品。建立这些联系的一个极其有用的工具是品牌意识形态。在某些关键问题上持亲俄立场，成为了黑客团体之间建立长期或短期合作的基础。同时，他们的亲俄立场帮助黑客团队与
  IT 专业圈子之外的其他数字实体建立了紧密联系。这些合作针对不同的目标。虽然黑客团体之间的合作通常导致相互配合的网络攻击，但与其他团体的合作则带来了资金援助、广告宣传和信息支持。


  为了在 Telegram 公共空间中轰轰烈烈地亮相，XakNet 对乌克兰总统网站和国防部网站发动了两次引人注目的 DDoS 攻击（XakNet Team 2022）。由于该团体专注于更复杂的网络攻击类型，其团队与另一个提供
  DDoS 服务的未知团体进行了合作（XakNet Team 2022）。这些攻击导致乌克兰网站瘫痪了几天。一个月后，XakNet 团队发布了一份致谢声明，向其受众推广该
  DDoS 团体的服务高效可靠（XakNet Team 2022）。


  2022 年 3 月 4 日，XakNet 和 KillNet 开始合作（XakNet Team 2022）。对这次合作寄予厚望的 KillNet 团队于 2022
  年 4 月宣布成立国际黑客联盟。该联盟建立了 Telegram 频道，邀请其他志同道合的黑客团体加入。Phoenix 黑客组织，一个 Telegram 上的新实体，于
  4 月 15 日加入（Phoenix 2022）。然而，这一倡议在创建者未作解释的情况下于 2022 年 4 月 30 日夭折，当时发布了最后一条帖子，频道随后被废弃（International
  Hacker Alliance 2022）。KillNet 官方频道停止推广该项目；显然这里出了问题。


  随后与 XakNet 的进一步沟通和协调通过 KillNet 细分部门 Zarya 的负责人进行（Zarya 2022）。尽管双方都赞扬了合作，承诺追随者将在可预见的未来发动独特的打击行动，但他们所谓的合作并未超越相互转发和广告宣传。他们的首次行动发生在
  5 月。


  如前所述，2022 年 5 月，俄罗斯军事单位联系 XakNet 团队，寻求帮助以应对战场上的严峻形势。为了瘫痪乌克兰的“Kropyva”系统，XakNet 与
  KillNet 及一个偶尔协助 XakNet 的 DDoS 服务团体合作（Legion 2022）。有趣的是，攻击成功后，XakNet 团体删除了许多与该打击协调相关的帖子。此外，其代表在后续采访和帖子中几乎未提及其他黑客团体的参与。对其他参与者而言，如
  KillNet 的关联团体 Legion，这次联合攻击被视为一种特殊的荣幸和荣誉事件，因为 XakNet 在当今的数字环境中拥有重要声誉。


  直到 2022 年 7 月，当 XakNet 和 Zarya 确定目标时，双方才再次宣布联合攻击。几天后，双方宣布联合入侵乌克兰国家档案馆网站（archives.gov.ua），因为
  XakNet 专注于乌克兰资源（Zarya 2022）。最初，为了证明入侵属实，黑客发布了几张截图，随后泄露了从 archives.gov.ua 网站窃取的大量文件和视频（Zarya
  2022）。第二天，双方改变主意，发帖称将停止泄露档案数据（Zarya 2022）。受众对此突然叫停感到不满，要求团体给出解释，在公告下轰炸式留言。


  第三次联合网络攻击由以下黑客团体发起：XakNet、Zarya 和 Beregini。据黑客称，他们在 10 月花费了一周多时间潜入乌克兰安全局（XakNet
  Team 2022）。此次入侵由 Beregini 实施和协调，该团体开始分批公开大量窃取的乌克兰文件。然而，Zarya 和 XakNet 的追随者只能看到入侵过程中的截图和短视频。此后，双方团队休整，解释称团队成员需要休息，因此账号不会再充斥独家内容（Zarya
  2022）。Zarya 管理员试图用“网络攻击并不简单，需要准备”这一声明，来为其频道缺乏定期活动进行辩解（Zarya 2022）。


  2022 年 11 月初，发生了一件事，使 XakNet 与 KillNet 的合作濒临破裂。一个专注于 IT 领域科技新闻的俄罗斯网站发表了一篇抨击 KillNet
  的恶毒文章，随后 KillNet 团队对其发动了 DDoS 攻击（XakNet Team 2022）。XakNet DDoS 细分部门严厉谴责 KillNet
  攻击俄罗斯联邦，强调这种行为不可接受（XakNet Team 2022）。四天后，KillNet 宣布攻击希腊一家医疗机构，丑闻再次升级。


  “最初，他们的 DDoS 攻击瘫痪了希腊的一个医疗网站。KillNet 再次自我败坏名声……这甚至对你们来说也太低级了……荣誉和道德去哪儿了？”（XakNet
  Team 2022）。作为回应，KillNet 使用不当语言进行了激烈反击。在这场争吵中，XakNet 团体要求其 DDoS 细分部门和 KillNet 停止在该丑闻中提及
  XakNet 的名字：


  > 我们不明白为什么双方都在闹剧表演。你们能好好谈谈吗？我们已给我们细分部门的管理员发了信息。同事们！别再提 XakNet：我们不想参与这场幼稚的闹剧。（XakNet
  Team 2022）


  这条帖子让双方黑客冷静下来。尽管如此，鉴于这一不愉快的经历，XakNet 不会重建与 KillNet 的合作。此外，还有许多持专业态度的其他黑客团体可以受邀进行联合攻击。




  KillNet 组织在与知名团体合作的同时，也积极与新成立或知名度较低的团体开展合作。2022 年 8 月，在其主导下，来自 Anonymous Russia、Phoenix
  和 CarbonSec 的亲俄黑客据称对美国全球安全与航空航天公司洛克希德·马丁的网站发动了攻击。该公司生产了著名的“海马斯”火炮系统，乌克兰武装部队于 2022
  年装备了该系统。KillNet 声称发动网络攻击后不久，洛克希德·马丁的网站仍保持活跃。显然，该网站抵御住了 DDoS 攻击（如果确实曾针对该公司发起过攻击）。据《新闻周刊》报道，公司代表未阐明网站是否遭受攻击，仅保证洛克希德·马丁拥有“健壮的多层信息系统和数据安全”。


  KillNet 的新任务于 2022 年 7 月 21 日宣布，锁定洛克希德·马丁公司为目标。在声明中，黑客通知追随者将针对武器制造商发起新一轮攻击，并承诺将采取超越
  DDoS 攻击的手段。十天后，KillMilk 发布了一段英语视频，呼吁洛克希德·马丁员工和关心公民在全球范围内纵火焚烧其办公室。他为每位实施者提议 50,000
  美元的奖励，要求将证据发送至其 Proton 邮箱。视频末尾，他列出了洛克希德·马丁在美国、加拿大和欧洲的公司办公地址。作为对 KillMilk 宣言的回应，黑客组织
  FRWL 对洛克希德·马丁的供应商 Gorilla Circuits 实施了入侵。该组织坚持要求获得“Gorilla Circuits 信息的完全访问权限”，包括“2016
  年的备份”、“技术文档”、供应商名单和客户群。FRWL 黑客团队继续实施恐吓，称“与 Gorilla Circuits 有关联的组织数据已被泄露。你们处于危险之中！”


  针对该美国公司的攻击确切日期不详。部分 KillNet 帖子暗示攻击发生在 8 月 10 日且持续时间不长：黑客惊讶地发现自己被踢出了系统。确实，KillNet
  组织于 2022 年 8 月 10 日发布了视频证据和截图。为了向公众证明网络打击的真实性，KillMilk 据称公布了一份洛克希德·马丁员工名单。此外，KillNet
  创始人强调只有无用信息会立即公开，并阐明了后续步骤：


  > 接下来我要做什么？(1) 很快，你们将看到洛克希德·马丁的新技术。我不懂火箭系统，但有人懂。(2) 将泄露其全体员工名单（超过 100,000 人）。(3)
  我将在其人员居住的国家泄露数据。我的泄露热爱金钱……(4) 洛克希德·马丁的股价将发生变化……我很快会展示关于这家公司的许多有趣事情。


  在 8 月 13 日发布关于该公司的消息后，KillNet 组织完全停止提及洛克希德·马丁攻击事件，KillMilk 也未说明被盗数据的去向。有趣的是，俄语追随者对这一针对重要目标的攻击表现出极大的热情和鼓励。就品牌知名度而言，此次攻击带来了梦寐以求的媒体关注。遗憾的是，在大众眼中，媒体关注往往被视为网络打击的可靠、无可置疑的证据。总体而言，此次打击引发了诸多疑问：此次打击是否成功？黑客攻击何时发生？数据是否被窃取？哪些数据泄露？黑客如何处理这些数据？


  可以推测，两名独行黑客——KillMilk 和 Two-Faced，连同数个组织——KillNet、Anonymous Russia、Phoenix 和 CarbonSec，共同策划了针对该美国公司的网络侵略。尽管如此，这次攻击很难被视为成功，因为所谓被盗数据未在任何地方浮出水面。从
  KillMilk 和 KillNet 的声明来看，在此次攻击后直至 2022 年 12 月，KillNet 的财务困境持续存在。显然，黑客未能以高价出售数据，或者
  KillNet 因攻击失败而根本没有数据可售。总的来说，这种协同黑客行动导致的只是媒体喧嚣，而非实实在在的收益。


  另一个提升 KillNet 在俄语受众中品牌知名度的有趣项目是其与 Deanon Club 组织联手打击在线毒品交易平台。自 2022 年 11 月起，KillNet
  团队开始与 Deanon Club 组织合作。此前，双方关系极其恶劣。Deanon Club 多次嘲讽 KillNet 组织，指责其不专业、高度政治化且议程缺乏客观性。该组织认为
  KillNet 不仅缺乏客观性，还沦为宣传的代言人。据其管理员称，KillNet 的实力是建立在其“浮夸的大声政治声明”基础上的幻觉。实际上，KillNet 的
  DDoS 攻击徒劳无功，其所谓的泄露数据均为广泛可获取的公开信息。此外，Deanon Club 还暗示 KillNet 曾宣布即将入侵一个知名在线毒品市场但随后删除了帖子，这可能是从潜在受害者那里收了钱。这解释了为何
  KillNet 官方渠道删除了攻击声明。然而，当 Deanon Club 承认 KillNet 在入侵 Rutor 网站及其主管 Egor B. 方面展现了高超技艺时，双方很快找到了和解与谈判的基础。撇开
  KillNet 炫耀性的政治表态不谈，早在 2022 年 3 月，最古老的黑客组织 XakNet 就曾称赞 KillNet 黑客对 Anonymous 组织和
  cyberpol.info 网站发动了组织良好且行之有效的攻击。显然，KillNet 的能力及其团队技术并不差。


  抓住 Deanon Club 这一积极评价的机会，KillNet 领导人 KillMilk 主动联系 Deanon Club 协商合作。谈判期间，双方领导人讨论了共同目标与手段的协调：


  > 我们专门致力于共同目标。KillNet 将专注于其擅长领域，而我们组织将不涉足政治领域。KillNet 擅长某一领域，我们组织在另一领域技艺精湛。因此，携手合作我们能达成重大目标。





  ## Deanon Club 的行为分析


  Deanon Club 的管理员是一个极其健谈、野心勃勃且渴望在危机中牟利的人。他毫不谦虚地拒绝并贬低那些指责 Deanon Club 不爱国、纯粹务实（与其他黑客组织形成对比）的追随者。此外，管理员公开承认实施肮脏手段。事实上，Deanon
  Club 故意谴责黑客组织，并准备以此换取金钱来停止羞辱性运动。当 Deanon Club 宣布与 KillNet 合作时，该组织暗示这种合作在质量上将受到限制且持续时间短暂。随后，合作原因浮出水面：Deanon
  Club 和 KillNet 联合起来打击俄罗斯毒品平台 Black Sprut。考虑到 Deanon Club 的道德准则，这种合作不会是非营利项目。简单来说，这里有几种可能的情况在起作用。第一，也许
  Deanon Club 接受了 Black Sprut 竞争对手之一的订单来摧毁它。第二，另一个可能性极高的选项是：在合作的特定阶段，Deanon Club 会接受
  Black Sprut 所有者的钱以结束他们的团队合作。另一方面，KillNet 并非寻求金钱利益，而是开放合作并积极利用合作来扩大其品牌。在这方面，KillNet
  管理员贪婪地与著名黑客实体和不知名的小团体建立团队合作。他们准备好帮助其他组织实现目标，并提出自己的目标，共享成功。


  总而言之，网络犯罪是一门有利可图的生意，且生意兴隆。持续的网络战让许多怀有腐败意图且拥有 IT 技能的危险分子得以公开活动，积累客户群并磨练技能。对世界共同体的每个成员来说，这种趋势的后果是可预测的，且将是灾难性的。


  ## 现实生活中的黑客合作


  在现实生活中，黑客作为同事、朋友、邻居、同学等相互合作。密集的网络战改变了他们的生活和工作方式。黑客开始学会通过互联网相互信任、信任他人并建立伙伴关系，习惯了某种程度的公开可见性。Zarya
  黑客小组发生的一个独特案例证明了这一点。2022 年 11 月，至少两名 Zarya 成员前往顿巴斯地区，距离前线不到 12 英里（Zarya 2022）。尽管目标明确——“我们
  Zarya 的黑客抵达顿巴斯，提供信息援助和在线支持。我们将会见前线的黑客”（Zarya 2022），但出于极度谨慎，黑客团队并未宣布此行。因此，Zarya 黑客与战区的
  IT 专家建立了关系；这或许是一个名为 Department Z 的团体，成立于 2022 年 3 月，但自 2022 年 11 月起，该黑客组织更名为“Bear.
  IT.Army”（Bear IT Army 2022）。显然，新到达的 IT 专家携带了所需设备，并将为顿巴斯团体提供技术援助。随着黑客分享行程视频和照片，其追随者对黑客匿名性可能受损表达了严重担忧。为了安抚追随者，团体领导人强调，该组织仅向“俄罗斯战士”透露成员身份，因为
  Zarya 感到有义务在那里提供帮助（Zarya 2022）。尽管黑客承诺向受众通报行程，但 Zarya 的组织渠道并未发布关于此行程或成员在那里阵亡的更新。显然，新来者学习了基本安全措施，并试图不危及自己和他人的生命。在这方面，值得注意的是
  KillMilk 自战争开始以来两次访问顿巴斯战区。他未透露访问该地区的原因、任何当地联系人、日期或访问过的城镇。


  ## Beregini 组织的合作情况


  作为一个自给自足的女性黑客组织，Beregini 很少与其他亲俄组织合作。然而，它确实在 2022 年 10 月与 XakNet 和 Zarya 进行了协调。那次黑客行动中大部分被盗数据未公开泄露。Beregini
  似乎与 RaHDIt 组织保持着密切联系。2022 年 7 月，他们的黑客团队对乌克兰国防大学发动了成功攻击，从其服务器中提取了大量信息，如教科书、电话簿、学生名单和其他材料（Nemesis
  2022）。9 月，Beregini 与 RaHDIt 共同梳理了乌克兰第 72 信息心理作战中心人员的数据（Beregini 2022）。结果，RaHDIt
  的“Nemesis”项目发布了一系列包含乌克兰人员照片和个人数据的帖子。


  ## FRWL 团队的活动


  在进入公众视野之前，FRWL 团队监控了许多亲俄黑客组织的活动，如 XakNet、KillNet、Beregini、Joker DPR 等。从其内容线索来看，FRWL
  黑客反复向 XakNet 表示赞赏。然而，FRWL 在黑客行动主义运动中发展了非常有限的合作，避免团队合作和共同制定目标。事实上，当 KillMilk 宣布针对洛克希德·马丁公司的行动时，FRWL
  对其供应商之一进行了黑客攻击。2022 年 7 月，针对挪威批准向乌克兰提供军事装备实施报复性侵略，该组织协助攻击了较小黑客组织“DeaDNetRu”的目标（FRWL
  2022）。


  ## People’s Cyber Army 的合作行动


  事实上，另一个组织 People’s Cyber Army 并未表现出愿意与其他黑客团队或类似实体公开合作。尽管如此，它确实与 XakNet 团队合作过几次，或者更准确地说，People’s
  Cyber Army 的管理员向其 Telegram 追随者通报了打击行动。首次联合攻击发生在 2022 年 4 月，黑客成功入侵了 ukc.gov.ua 网站，该网站积累了关于俄罗斯武装部队及其调动的有用信息（People’s
  Cyber Army 2022）。结果，网站服务器被摧毁，People’s Cyber Army 和 XakNet 窃取了大量内部文档数据。在 Telegram
  上，黑客将此行动作为对乌克兰袭击俄罗斯别尔哥罗德的报复。事实上，2022 年 4 月 1 日，该地区州长 Gladkov 称，两架 Mi-24 直升机从乌克兰进入俄罗斯领空，对当地石油储存库“Belgorodnefteprodukt”发动空袭（BBC
  2022）。10 月，在准备对乌克兰军事软件（Ukropsoft）发动网络进攻时，People’s Cyber Army 的黑客与 XakNet 组织协调了行动。在未透露细节的情况下，People’s
  Cyber Army 发布了一条简短感谢 XakNet 的声明（People’s Cyber Army 2022）。遇到技术困难时，该组织会联系 XakNet
  协调针对军事目标的行动。





  2022 年 9 月，其合作的另一个引人入胜的案例被公之于众，并直接与弗拉基米尔·普京总统于 9 月 21 日下达的动员令联系在一起。尽管如此，“人民网络军”并未透露许多细节或其他参与者；显而易见，黑客们与达吉斯坦警方保持着联系。动员令一开始，许多
  Telegram 账号就成了遍布俄罗斯联邦各地抗议者的避风港，号召当地人占领街道、阻碍动员活动（“达吉斯坦晨报” 2022）。特别是“达吉斯坦晨报/Utro Dagestan”频道协助达吉斯坦居民举行有组织的集会；9
  月 25 日，其管理员号召马哈奇卡拉居民于当地时间下午 3 点聚集在首府的主要广场（“达吉斯坦晨报” 2022）。针对反动员集会的线上筹备工作非常周密，因为该
  Telegram 频道不仅安排了抗议的时间和地点，其团队还指示参与者在特定时间做好准备，齐声高呼“停止动员！停止战争！”，并遵循该媒体机器人发布的指令（“达吉斯坦晨报”
  2022）。抗议活动前，“达吉斯坦晨报”的管理员设立了一个用于抗议活动沟通和协调的机器人；例如，该媒体要求参与者上传活动现场的照片和视频。据推测，“人民网络军”的黑客利用这个机器人联系了“达吉斯坦晨报”的管理员，发送了如下信息：“嗨！这是穿制服的暴力豺狼的第一个受害者！这名女子死在重症监护室！请传播此信息！”（“政治学家”
  2022）。在这条信息下，黑客附上了一个看起来像云服务链接的链接；然而，这个链接却是获取该账号管理员权限的钥匙。重要的是要强调，这一在 Telegram 上广泛传播的信息，既未得到“人民网络军”的支持，也未被其反驳。


  数字调查的初步结果在警方拘留 100 多名抗议者的第二天，在“人民网络军”的官方渠道上公布（“OVD News” 2022）。与此同时，达吉斯坦共和国首脑谢尔盖·梅利科夫否认抗议活动是当地自发的倡议，强调外国“敌人试图分裂”国家，通过策划和煽动马哈奇卡拉的抗议活动来达到目的，这类似于
  1990 年代发生的情况（梅利科夫 2022）。此外，他还补充说“挑衅者不参与这些抗议活动”，而是派达吉斯坦妇女去与警察对峙（梅利科夫 2022）。顺便提一下，所谓被识别出的“达吉斯坦晨报”管理团队位于乌克兰基辅，但抗议活动的实际主谋（据联邦安全局视频显示为四至五人）在达吉斯坦被捕（“达吉斯坦国家电视广播公司”
  2022）。“人民网络军”的黑客声称破解了“这个挑衅者网络”，他们在 Telegram 内部运作，并确认了组织者的名字，将其移交给当局（“人民网络军” 2022）。9
  月 30 日，黑客们赞扬了这次联合行动：


  > 战士们！干得好！这不仅是我们的成功，许多人也帮助了我们！由于我们与达吉斯坦联邦安全局特工的合作，几名管理匿名聊天室和 Telegram 渠道的管理员被捕……超过
  10 人被拘留。（“人民网络军” 2022）


  因此，这是亲俄黑客首次参与联邦安全局的行动。有趣的是，“人民网络军”承认了其参与联邦安全局突击行动的事实，而官方政府新闻却未提及黑客的协助。也许，黑客们长期以来一直协助警方、联邦安全局和其他政府部门，但他们并未公开每一个合作案例。还有一种不容忽视的情况：他们可能主动志愿参与这种合作，匿名向联邦安全局特工提供所需信息。


  俄罗斯联邦反动员骚乱引发的丑闻正在发酵，这对“KillNet”的品牌运营者来说太具诱惑力了，不容错过。KillNet 的一个附属分支没有等待“人民网络军”行动的结果，而是从另一个角度切入“达吉斯坦晨报”渠道。通过审查该渠道的预算，KillNet
  于 2022 年 9 月 26 日发现其加密账户上有超过 15 万美元，即 109 枚 ETH（“中心撰稿人” 2022）。通过 Telegram 传播这一快讯，黑客公开谴责联邦安全局，要求立即采取行动，因为“一个北约间谍”在俄语网络空间内活动（“我们是
  KillNet” 2022）。其受众赞同 KillNet 向联邦安全局的呼吁，因此，部分追随者向联邦安全局网站投诉了 KillNet 的数据；另一部分受众则在
  KillNet 聊天室内组织了针对“达吉斯坦晨报”及其他几个渠道的投诉活动（“中心撰稿人” 2022）。KillNet 集团关于该渠道财务状况的报告仅仅是 KillNet
  的主动行为，但收集到的数据被发送给联邦安全局进一步审议。一方面，这一举措是提升 KillNet 品牌的营销手段。另一方面，黑客展示了他们与政府合作的意愿。


  “NoName057(16)”和“Joker DPR”组织独立为各自的目标工作，没有建立伙伴关系。前者反复提及其他组织，为他们对抗俄罗斯联邦敌人不可或缺的努力喝彩；而“Joker
  DPR”则完全不提及其他组织。也许，这些组织进行了幕后沟通和团队协作，但未对外宣称。尽管如此，“Joker DPR”的隐居行为虽不常见，但在其他黑客组织中尚可接受。


  除了专业的团队协作，亲俄黑客还积极与新闻媒体沟通，其中大多数运营于 Telegram。例如，至少三个黑客组织（XakNet、KillNet、FRWL）与新闻平台“俄罗斯之春”（`rusvesna.su`）建立了关系。该媒体源成立于
  2014 年，2015 年俄罗斯当局为其颁发了注册证（“俄罗斯之春” 2018）。


  2022 年 9 月，“俄罗斯之春”新闻媒体（其 Telegram 受众超过 100 万粉丝）收到了约 2700 美元的捐款（“XakNet 团队” 2022）。XakNet
  成员与该频道保持了长期关系，因为“其团队拥有相同的精神和道德价值观”（“XakNet 团队” 2022）。当“俄罗斯之春”请求 XakNet 帮助购买媒体设备时，其成员筹集了全额款项。披露部分细节时，其声明宣称：“我们没有向粉丝募集资金支持。这是
  XakNet 团队送给信息领域同事的礼物……最近我们有一份图文报告，展示‘俄罗斯之春’如何花费了我们的捐款”（“XakNet 团队” 2022）。很快，KillNet
  发起了类似的活动。




  2022 年 11 月 13 日，KillNet 管理员宣布了该品牌的生日，据称他们在那天建立了 KillNet DDoS 服务（We are KillNet
  2022）。为了热身社区互动，KillMilk 发起了一项引人入胜的活动：“生日快乐，KillNet！今天，我将在我们的追随者之间分配 7000 美元的比特币。等待进一步指引并建立加密钱包！”（KillMilk
  2022）。随后，追随者被要求回答一个问题：他们是想把钱捐给新闻媒体 Rusvesna，还是想平分这笔钱？可以肯定的是，KillNet 效仿了 XakNet 的模式，寻求将其品牌与享有盛誉的
  XakNet IT 专业人士建立正面关联。在投票中，超过 20,000 名 Telegram 用户参与投票，其中 95%的受访者选择了将捐款捐给 Rusvesna
  平台的选项。根据追随者的意愿，全额款项在当天结束前转入了 Rusvesna 账户。为了证明这笔转账，附带 Rusvesna 感谢信的截图在 Telegram 上流传（Rusvesna
  2022）。KillNet 群体对此感到振奋，对这一行动和 KillNet 的慷慨表达了自豪和喜悦。


  显然，FRWL 集团通过 Rusvesna 的 Telegram 渠道与俄罗斯军方单位之一进行了沟通。在其公开活动初期，该集团曾询问追随者向顿巴斯地区发送无人机的可能性。考虑到
  FRWL 未开展筹款活动，其成员考虑自掏腰包购买军事装备。后来，在 2022 年 8 月，该集团推广了一个属于顿巴斯地区军事单位的 Telegram 渠道：“我们为该群体提供全方位支持并保持联系！”（FRWL
  2022）。该特定单位不与外部实体沟通或接受支持，除非完全通过 Rusvesna 平台进行。鉴于这一条件，有人推测 FRWL 最初通过 Rusvesna 与该军事单位建立了联系，随后直接与该单位沟通。有趣的是，该集团收到了来自其他亲俄团体的许多合作提议，但
  FRWL 并未接受这些提议（FRWL 2022）。据 FRWL 管理员称，其成员认为合作不会非常富有成效，为了向其他黑客团体表示赞赏，FRWL 经常在其主题帖中转发他们的帖子。


  在九个黑客团体中，只有三个团体向顿巴斯地区提供了资金支持。显然，Rusvesna 和黑客团体通过 Telegram 消息建立了联系，直接向 Rusvesna 账户发送资金或加密货币。其他团体未参与类似的慈善项目，避免与外界接触。许多黑客团体意识到了团队合作的好处，因此偶尔会发起联合打击。与
  KillNet 渴望合作（且不完全局限于其“报复俄罗斯政治敌人”的主要任务）形成对比的是，其他团队看重其独立地位，建立短期合作伙伴关系，追逐单一目标。正如 Kropyva
  案例所示，黑客们对乌克兰作战军事单位的求助做出了回应。尽管目前的合作具有零星性质，但他们显然愿意向执法机构提供帮助，并使这种合作变得常规化和持续化。考虑到并非每个政府协助的行动都能公开宣布，关于黑客与政府合作的大量信息对社会隐瞒。随着时间的推移，这种合作极有可能成为俄罗斯社会的支柱。


  ## 俄罗斯的动员


  鉴于俄罗斯军队人员短缺以及乌克兰持续的反攻从东部收复了领土，俄罗斯总统弗拉基米尔·普京签署了动员令。2022 年 9 月 21 日，部分且立即动员随普京的电视讲话开始，总统在讲话中强调了将被动员的人员类别（《共青团真理报》2022）。国防部长谢尔盖·绍伊古透露了更多细节。据他称，需要
  30 万预备役人员来控制乌克兰约 1000 公里的被占领土（《列塔报》2022）。


  动员开始七天后，数字转型部发布了获得延期征召的专家名单，在 195 个职业中，IT 专业人员被列入其中（《财经 Rambler》2023）。当俄罗斯民众试图消化这项新法令时，几个黑客团体表达了兴奋，并试图鼓励那些不那么幸运的追随者。FRWL
  集团在直播普京的讲话时强调，许多人有真正的机会展示他们的勇气和爱国主义（FRWL 2022）。KillNet 也分享了 FRWL 的热情。值得注意的是，在动员令发布前一周，其关联的分析频道谴责了拒绝加入俄罗斯军队在乌克兰作战的个人：


  > “昨晚，我查看了几个聊天室，发现许多人在推测万一动员就移民和搬迁。他们卑鄙、懦弱、无用……难道他们想穿裙子吗？我喜欢动员的一个原因，因为我能立刻识别出真正的俄罗斯兄弟……动员是真相的时刻。”（Writer
  from the Center 2022）


  这篇帖子引发了激烈讨论，男女均参与其中。女性参与者对“裙子”一词的贬义内涵感到愤怒；女性辩称她们已准备好为祖国而战，强调将追随丈夫共同参战（Writer from
  the Center 2022）。几位聊天参与者拒绝为腐败官员辩护，承认他们更关心家庭而非国家。然而，有一个建议团结了所有参与者：他们相信动员是不可避免的。有趣的是，第二天，KillNet
  发布了一项调查，询问受众回答以下问题：如果收到动员令，你会加入俄罗斯军队吗？（We are KillNet 2023）约 23,000 人参与投票，其中 62%的受访者表示愿意入伍。而
  11%的参与者坦言会竭尽全力避免动员，7%的女性不愿让丈夫去打仗（We are KillNet 2023）。


  战争升级在俄罗斯联邦内部引发了强烈反弹。对动员的反对立即在包括莫斯科、乌兰乌德、托木斯克、圣彼得堡、叶卡捷琳堡、新西伯利亚等 30 多个城市的抗议活动中出现（《生意人报》2022）。自
  2022 年 9 月 21 日起，大规模和个人抗议活动反复发生。由于 KillNet 对动员令如此兴奋，他们抓住机会谴责任何持不同观点的人，并发表了以下声明：


  > “不要阅读国内外国代理人制造的宣传（他们向拜登出卖灵魂）。消除对俄罗斯力量和实力的一切疑虑！亲西方博主和媒体机构，如电视频道‘雨’等，在我们社会内散布恐惧。无视任何关于大规模向乌克兰投降的信息！

  >

  > 无视任何针对我们国家和总统的批评！

  >

  > 如果你有关于在俄罗斯散布虚假信息人员的有价值线索，请发送给我们。

  >

  > 法西斯主义和欧洲侵略必将灭亡！

  >

  > 荣耀属于俄罗斯和我们伟大的未来！”（We are KillNet 2022）




  具体而言，KillNet 盯上了反战青年运动“韦斯纳”，该组织在全国范围内组织了多场反动员集会。在普京 9 月 21 日发表讲话后不久，韦斯纳领导人通过社交媒体平台开始号召俄罗斯公民占领城市街道：


  > 今天，弗拉基米尔·普京宣布在俄罗斯开始局部动员。这意味着成千上万的我们的男人——父亲、兄弟和丈夫，将陷入战争地狱。他们为何而死？母亲和孩子们为何而哭？是为了普京的豪宅吗？（韦斯纳
  2022）


  尽管街头抵抗力度不大且持续时间不长，但 KillNet 黑客对韦斯纳的“非爱国”立场感到愤怒，这使得其成员成为 KillNet 的攻击目标。试图寻找关于该运动的可靠信息，KillNet
  发帖称愿购买关于韦斯纳领导人的内部信息（We are KillNet 2022）。尽管如此，它并未挖掘出任何足以让用户震惊的独特信息。显然，一旦当局开始施压该运动，KillNet
  对韦斯纳的兴趣便迅速消退。2022 年 9 月 24 日，圣彼得堡警方突击搜查了多名韦斯纳成员的公寓，十天后，该市检察院提起诉讼，寻求取缔这一公民运动（圣彼得堡检察院
  2022）。


  对于“人民网络军”团队而言，与韦斯纳组织的对抗成了一项原则性问题。黑客们对局部动员感到振奋，辩称新生力量将“迅速终结乌克兰”，并迅速盯上了韦斯纳的网站（人民网络军
  2022）。发起网络攻势时，“人民网络军”写道：“动员令一宣布，许多腐败的自由派就从藏身处钻了出来。‘韦斯纳’组织就是他们的代表之一。我们必须干掉它的网站！”（人民网络军
  2022）。不到一小时，其网站就停止运行（人民网络军 2022）。然而，该组织准备追击更多意识形态对手。正如前述，“人民网络军”黑客协助达吉斯坦警方抓捕了与 Telegram
  频道“达吉斯坦早报”有关的反动员活动人士（人民网络军 2022）。考虑到 KillNet 的高调姿态，其成员投入大量时间挖掘“达吉斯坦早报”媒体的财务背景，得出结论称其管理员是叛徒和北约间谍（We
  are KillNet 2022）。^(13)


  与“人民网络军”和 KillNet 形成对比的是，XakNet 并未对反动员倡议表现出公开的负面态度。其成员感到有义务引导俄罗斯公民穿越不可信的网络环境。在动员令发布后，XakNet
  成员监测社交媒体平台的发展动向，发现许多蜜罐账号开始流传。据黑客称，未知人员建立了关于动员的聊天群，已动员人员及其家属可在其中交流和分享信息（XakNet 2022）。这些绝望的人在寻求帮助时将个人信息发布在这些群组中，使自己及亲属陷入险境（XakNet
  2022）。在解释这些渠道的危险性时，XakNet 指出，它们成为了“乌克兰分析师和其他敌手”的有用情报来源：


  > 由于你们加入了这些渠道，敌人将知晓谁被动员了，并会调查你们亲属的信息。你们觉得你们亲属会遭遇什么？他们将成为骚扰的受害者。有人会打他们的手机，发送恐怖视频，并对他们进行敲诈……我们恳请俄罗斯媒体最大程度地报道这一重要信息……请告知我们的民众这一严重问题。（XakNet
  2022）


  大多数黑客组织对动员保持沉默，并未试图追捕反动员活动人士。尽管如此，他们在网络空间领域参与战争的时间由来已久；此外，他们之前的活动以及公开的爱国好战态度，足以佐证他们支持动员并谴责其反对者。虽然
  FRWL 黑客让受众知晓了他们对动员的看法，XakNet 则关注公民的数字安全，警告他们注意活跃的蜜罐陷阱。最直言不讳的组织是 KillNet 和“人民网络军”，它们不仅谴责反战倡议，还攻击活动人士及其数字资源。


  ### 俄罗斯黑客与俄罗斯政府


  在干预乌克兰之初，俄罗斯政府并未准备好进行网络战，尤其是当前这种规模的网络战。此外，战争七个月后，它仍未制定出明确的网络空间军事化方针。俄罗斯官员曾试图弥补这一缺口；然而，迄今为止，他们零星的尝试未能在统治精英中生根发芽。


  据称，战争伊始，一群高素质 IT 专家联系了俄罗斯高层官僚体系中的官员，提议在网络战线上提供技术援助。这些专家强调愿免费工作，请求政府协调或以某种方式指导他们的网络进攻行动（杰利亚金
  2022）。当时，俄罗斯社会正试图适应针对每一个俄罗斯数字实体的密集黑客攻击。然而，官员们并不认为该提议有吸引力或属于高优先级事项，将其推给官僚迷宫处理，并强调这项“服务”必须通过联邦国家采购法来指派。考虑到
  IT 专家并未为其主动提出的倡议要求经济补偿，官员们仅因其不符合联邦法律便将该提议搁置一旁。此外，官员们告知这些专业人士，他们无法保证其安全，因为黑客属于网络罪犯，其活动被定性为非法。


  受挫的 IT 专家将他们的困惑反映给国家杜马副手米哈伊尔·杰利亚金，后者将这一情况及官员们的反应公之于众（杰利亚金 2022）。俄罗斯社会在只有有限数量 IT
  专家能够实施复杂网络攻击的情况下步入网络战；杰利亚金指责俄罗斯政府与美国当局结盟，追捕并引渡涉嫌非法活动的本国黑客（杰利亚金 2022）。


  另一次阐述这一问题的尝试发生在 2022 年 11 月。每年，“公正俄罗斯”党都会组织各种讨论，探讨国家面临的最关键问题。2022 年 11 月 23 日，该党召集官员和
  IT 专业人士，就俄罗斯联邦的网络安全和数字经济交换意见（“公正俄罗斯”党 2022）。在 XakNet 声称攻破乌克兰财政部后，国家杜马副手德米特里·古谢夫联系了该组织。鉴于即将举行的党内讨论，古谢夫提议黑客们向俄罗斯政府陈述并解释他们的议程、关切和目标。为了避免遭受迫害，XakNet
  黑客意识到他们无法参加公开会议。





  ## XakNet 描述网络战场的严峻形势


  分散的亲俄黑客被迫面对乌克兰网络战线，后者拥有大量志愿者、高度协调且获得政府支持（XakNet Team 2022）。与乌克兰形成对比的是，俄罗斯网络“军队”遭受缺乏协调、通用规则和保护之苦。在寻找有效目标时，该黑客组织强调了一个复杂问题：“很难确定我们可以攻击哪些目标，以及哪些目标应该移交。”（XakNet
  Team 2022）。出于爱国主义驱动并试图发挥作用，XakNet 强调了其困惑，因为该组织不确定其工作是否对政府和俄罗斯军队有用。因此，XakNet 成员经历了动力下降，而这一动力早已因俄罗斯应美国政府要求拘留
  REvil 黑客而受到动摇（XakNet Team 2022）。此外，该组织打破了关于拥有全能黑客的强大俄罗斯网络部门的流行迷思：


  > 我们希望与俄罗斯当局建立直接联系，这对双方都有利。我们的国家没有保护政府数字资源的总体战略。没有关于如何以及由谁来做这项工作的具体建议。但这些建议必须立即制定。（XakNet
  Team 2022）


  2022 年春季，大量来自俄罗斯私营公司和地区政府部门的求助信息涌入 XakNet 邮箱。这些实体感到迷茫和无力，请求关于如何保护其网站的指导。XakNet 专家在下班回家后，提供免费咨询。尽管政府数字系统具有相互关联性，但许多部门拒绝任何技术援助，即使是免费的。XakNet
  明确解释道：“人们不想修复网络防护中存在的巨大、现存的问题。整个地区数字系统必须重塑……我们是从政府雇员那里了解到这一主要问题的”（XakNet Team 2022）。


  ### 党内讨论与 Gusev 的提案


  在党内讨论中，Dmitry Gusev 阐述了 XakNet 声明的要点。首先，这位国家杜马副主席遗憾地指出，俄罗斯政府缺乏一个不可或缺的网络防御实体，无法在发生外国网络攻击时保护每一位俄罗斯公民。随后，他感谢黑客们的“非凡行动”，并承认许多
  IT 专家因担心被征召入伍并被派往顿巴斯地区而离开俄罗斯（The Fair Russia Party 2022）。Gusev 的提案旨在将现有黑客组织纳入“俄罗斯网络战线”并授予其军衔；建立该实体将有助于协调黑客活动、为黑客制定法律依据，并与政府和军队建立紧密联系。


  2022 年 11 月 25 日，为了激发关于亲俄黑客的讨论，国家杜马副主席 Gusev 发表新声明，请其他黑客团队就其倡议提供意见。有趣的是，Gusev 呼吁了几个组织——KillNet、JokerDPR、Zarya
  和 Bear.IT.Army，这些名称显然由 XakNet 提供（Gusev 2022）。这意味着在战争爆发七个月后，俄罗斯官员仍未全面掌握国内黑客及其组织的情况。这一领域一直被其忽视。


  另一个重大问题是黑客的定义；据他称，正在进行的网络战改变了俄罗斯联邦对黑客的看法：“对于国际社会而言，俄罗斯黑客被视为罪犯和攻击者。对于俄罗斯来说，在 2022
  年 2 月 24 日之后，黑客成为了为公平而战、采用特殊手段的英雄。他们正在做我们国家现在需要的事”（SHOT 2022）。事实上，这位副主席强调了俄罗斯社会内部正在进行的转型过程，该过程始于黑客组织开始在网络上占据公共空间并建立其品牌。


  ### 黑客组织的回应与法律地位担忧


  大多数黑客组织无法错过这一可能扭转其未来的关键且充满希望的事件。KillMilk 以阴郁的讽刺态度赞同了俄罗斯官员的倡议，强调俄罗斯当局长期忽视这一突破性想法，因此可能为时已晚，无法改善局势（KillMilk
  2022）。KillNet 管理员欣然响应这一想法，热情地表示愿意立即加入 Gusev 的“网络战线”（We are KillNet 2022）。分享 KillNet
  的喜悦，NoName057(16) 表示，因接管立陶宛、拉脱维亚、爱沙尼亚、挪威及其他该组织实施网络攻击的国家，他们将乐于接受荣誉勋章。“我们在网络战线上战斗不是为了勋章，而是为了祖国！俄罗斯公民对我们关键且严肃工作的钦佩、支持和接纳，对我们来说无价，”NoName057(16)
  组织继续说道，强调其愿自费实施网络打击（NoName057(16) 2022）。这一声明暗示了对黑客当前活动及其与当局合作的法律基础的严重担忧。必须重申的是，亲俄黑客继续在其半地下现实中平衡，既向其他国家机构隐藏身份，也向俄罗斯政府隐藏身份。


  ### 官方倡议的前景与分歧


  无法预测 Gusev 的倡议是否会获得政府官员的支持。然而，考虑到特殊形势和 Michael Delyagin 此前的批评，即使这一非同寻常的想法也可能在法律上得以实施。此外，另一位雄辩的官员、国家杜马成员
  Oleg Matveychev 提出了在俄罗斯武装部队内部建立网络部队的想法。支持利用黑客爱国情怀的观点，他强调：


  > 我们有许多脱离专业市场的 IT 专家……许多有 IT 倾向的应征青年可以在网络部队服役。在这些部队中，我们可以聚集那些不想在常规军队服役的人。但如果他们继续从事计算机工作而不是常规兵役，这些人可以加入军事服务。我们将把这些人培养成俄罗斯爱国者。（Matveychev
  2022）


  有趣的是，这位副主席提到了他的黑客朋友，该朋友受过良好教育并拥有 IT 技能，曾在官方面前入侵一些美国政府网站（Matveychev 2022）。


  因此，针对黑客的提案，Delyagin 批评了无法适应极端形势的行政机构。Dmitry Gusev 的项目看起来相对完整，建议通过在俄罗斯武装部队内建立网络部队，来调和网络罪犯身份与其爱国主义之间的法律冲突。相比之下，Oleg
  Matveychev 的想法显得不严肃且不相关；他仅讨论了让兵役对年轻人更具吸引力的方式之一，但他对正在进行的网络战问题的理解充其量只是肤浅。到目前为止，这些想法听起来更像是民粹主义的口号，而非严肃的项目。值得注意的是，这些官员没有联合起来，甚至没有重视彼此的倡议，而是无视了之前为使这一网络部队成为现实所做的努力。国防部未对此发表评论或采取措施落实这些想法，缺乏持续的政治意愿来推进和实现这些倡议。





  自乌克兰战争爆发以来，关于黑客与克里姆林宫关系的问题再次浮现，并仍是一个极具争议的话题。确实，在未对特定黑客组织进行区分的情况下，Politico 上的文章笼统地将俄罗斯黑客团队称为“与克里姆林宫有关联的团体”，并认为其专业技能一般，因为乌克兰志愿者组成的
  IT 军队有效地对抗了他们 (Scott 2022)。强调部分俄罗斯黑客攻击手段不够复杂，网络安全和基础设施安全局 (CISA) 特别指出 XakNet 和 KillNet
  为网络犯罪团体，其主要驱动力为经济利益，尽管战争爆发后它们宣誓效忠俄罗斯或俄罗斯人民；但不能排除它们与克里姆林宫合作的可能性 (CISA 2022)。Mandiant
  报告发现 XakNet 和 People’s Cyber Army 为与政府机构的密切合作奠定了基础 (Mandiant 2022)。


  最终，可以辨别出三种可能性。第一，亲俄黑客团队在当局控制下运作；第二种可能性是，在受审查的黑客实体中，少数团体保持了独立地位。第三种理论是，独立黑客团队与政府合作，因为后者在尝试联系他们时，可以利用黑客团体的爱国性质。这些选项并非互斥。


  在这方面，研究考察了公开的在线资源。每个黑客组织在公共空间露面时，都被迫阐明其针对乌克兰正在进行的军事干预的政治立场。部分原因是受众压力，关心的订阅者向黑客的支持机器人或账号转发了大量信息。考虑到充斥着大量虚假信息和来自反对派信息的现代政治环境，这种需求是意料之中的：人们不想浪费时间去弄清楚一个频道站在战争的哪一边。因此，一方面，随着各种新闻媒体传播的增加，信息空间变得极其复杂。另一方面，这个空间变得简单化：要么是亲俄议程的媒体，要么是反俄议程的媒体。对于黑客品牌而言，增加频道受众的有效方式之一就是宣布其归属。KillNet
  确立了这一流行模式，通过持续展示政治观点来确认其立场。例如，2022 年 2 月 26 日，KillNet 置顶了其自我介绍，公开表明该组织为“不支持由西方盟友煽动的战争”的“黑客”。随着
  KillNet 品牌受众的扩大，订阅者采纳了这一模式，要求新的黑客品牌进行同样的自我认同。


  从黑客的角度来看，归属意味着政府通过意识形态和/或法律操纵、财政支持对独立黑客团队进行控制，且政府部门是该团队的创建者。XakNet、KillNet 及其关联团体——所有这些团体都反复拒绝承认与俄罗斯政府有任何关联。其他团体——People’s
  Cyber Army、FRWL、RaHDIt、NoName057(16)、Joker DPR 和 Beregini，则未提及此问题。事实上，XakNet 以讽刺的方式嘲讽知名资源关于其本身的结论，其
  Telegram 账号用这样的留言欢迎关注者：“据 Bloomberg 称，我们是俄罗斯情报机构实施网络进攻行动的门面。据 Mandiant 称，我们的管理员是
  GRU 军官。” 实际上，XakNet 经常强调该团体不与政府和联邦安全局 (FSB) 保持联系，但 XakNet 强调了其建立此类联系的意愿。2022 年 5
  月，该黑客团队阐述称政府实体未表现出对 XakNet 的兴趣：“没人请我们帮忙。所以我们没有开始针对西方对手的行动，因为我们担心因鲁莽行动造成损害”(XakNet
  Team 2022)。如前所述，5 月底，军方代表通过 Telegram 联系 XakNet，请求针对乌克兰“Kropyva”系统的技术协助。XakNet 表现出惊人的透明度，向追随者提供了关于此次打击的信息，并于
  6 月接受了俄罗斯新闻频道的采访 (Russian OSTIN 2022; XakNet 2022)。正如 XakNet Telegram 账号的内容线索所示，完成此任务后，XakNet
  结束了与陆军的合作；然而，对该合作是否具有官方性质存在相当大的疑虑。


  与寻求协调的 XakNet 形成对比，KillNet 宣称已准备好接受政府的财政支持，强调该团体未获得任何政府支持。确实，2022 年 9 月，在公开多个加密货币账户后，KillNet
  团队专门请求官员和俄罗斯商人赞助 KillNet 的进一步网络活动 (We are KillNet 2022)。然而，这一期望毫无根据，因为后来该黑客团队开始出售窃取的数据，并开始与
  Deanon Club 合作打击一个在线毒品交易平台。显然，黑客可以通过获取毒品平台的某些信息来获利。据 KillNet 管理员称，大量有用信息已移交俄罗斯警方，因为
  KillNet 无意扣留警方的请求。


  遵循相同模式，Anonymous Russia 也强调该团体不与政府合作，因此其成员不在“俄罗斯总统的薪资单”上 (Anonymous Russia 2022)。为方便订阅者，它在以下帖子下列出了五个加密货币账户、一个
  QIWI 钱包和一张 Gazprombank 卡^(14)：“官员和商人们，别忘了我们！你们生活在俄罗斯，我们也是，我们需要财政支持来完成我们的关键任务”(Anonymous
  Russia 2022)。值得注意的是，Anonymous Russia 是第一个要求追随者通过 QIWI 平台和普通银行捐款的黑客团体。显然，作为 KillNet
  的关联组织，Anonymous 曾与其领导层讨论过这一金融创新。


  如前所述，KillNet 拒绝承认与俄罗斯政府有任何关联，其管理员极其关注团体的声誉。他们的执着甚至迫使 KillNet 团队用英语发表声明。针对诸多指控，2022
  年 4 月，该团体向欧洲媒体呼吁：“你们在全球范围内误认了我们。我们不是亲克里姆林宫项目。我们是准备揍扁你们的普通俄罗斯人。我们的国家不仅仅是你们如此恐惧的强大政府。我们的国家拥有精神最强大的人，请记住这一点”(We
  are KillNet 2022)。随着财务问题不断堆积，KillNet 团体越来越不坚持自己的原则。


  因此，国外最著名的黑客团体 XakNet 和 KillNet 反复阐述了他们与俄罗斯政府的关系。然而，他们的方式不同；XakNet 寻求政府部门的合作与协调，而
  KillNet 则强调其愿意向俄罗斯当局或寡头出售其独立地位。其他亲俄黑客团体——People’s Cyber Army、FRWL、RaHDIt、NoName057(16)、Joker
  DPR 和 Beregini——未受媒体关注，因此其团队未回应这一问题。





  ## 俄罗斯黑客组织对军方的支持与合作顾虑


  ### 公开支持俄罗斯武装力量


  另一个必须考虑的方面是俄罗斯黑客组织对俄罗斯武装力量及克里姆林宫在乌克兰行动的支持。摒弃“我为俄罗斯人而感到羞耻”这一反战修辞，黑客组织公开并全面地宣布支持和认可克里姆林宫及其军队的任何行动。例如，`FRWL`
  通过开设其官方 Telegram 账号，直接宣布了其对俄罗斯武装力量的巨大支持。为了表达对俄罗斯总统和俄罗斯武装力量的崇敬，`People’s Cyber Army`
  团队在其于 2022 年 7 月上传的新徽标中嵌入了总统的名言：“如果战斗不可避免，你必须先发制人！”（People’s Cyber Army 2022）。此外，`People’s
  Cyber Army` 还向与俄罗斯武装力量并肩在乌克兰作战的私人武装组织“瓦格纳”表示了赞赏。通常，黑客的赞赏以特定方式表达，这一次也不例外；他们宣布决定攻击
  `Mozart Group` 的网站。这并非 `People’s Cyber Army` 首次入侵该网站。该网站于 2022 年 9 月 27 日曾遭受其打击（People’s
  Cyber Army 2022）。这个美国数字资源属于私人军事公司 `Mozart Group`，该公司参与了乌克兰战争，为乌克兰政府作战。在亲俄黑客收到关于美国退伍军人
  `Andy Milburn` 出现在乌克兰的新闻报道后，决定攻击该网站（People’s Cyber Army 2022）。如果黑客重返曾经的受害者，或许是因为其防御更容易攻破，且黑客渴望完成他们开始的工作。该网站的象征意义只会增加其再次成为目标的几率。


  ### 以网络攻击庆祝军事节日


  许多黑客组织以传统方式或发动网络打击来庆祝专业军事节日。2022 年 8 月 2 日，波兰航空公司 `SprintAir` 的网站遭遇了由 `NoName057(16)`
  团队发起的网络攻击，以纪念空降兵日（NoName057(16) 2022）。11 月 5 日俄罗斯情报机关的专业节日，成为了 `KillNet` 及其关联组织对波罗的海国家国家安全委员会和情报部门发动打击的信号。“祝贺！向我们的情报人员致敬，我们将在腐败的波罗的海地区制造巨大声响，”`KillNet`
  在其官方渠道强调道（We are KillNet 2022）。黑客声称不仅成功攻击了波罗的海国家，还攻击了多个欧洲网站。2022 年 12 月，`KillNet`
  旗下单位 `Zarya` 在联邦安全局（`FSB`）专业节日之际发布温情致辞，强调：“我们知道你们在读我们的帖子。感谢你们守护祖国内部的秩序！”（Zarya 2022）。其追随者也加入了这一致辞，肯定了
  `FSB` 为俄罗斯联邦取得的成就（Zarya 2022）。除了这些信号外，一些组织于 2022 年 10 月 7 日俄罗斯总统生日之际致以最诚挚的问候（Anonymous
  Russia 2022; Bear.IT.Army 2022; We are KillNet 2022）。


  ### 与政府合作的法律顾虑


  与政府的合作涉及黑客近期活动的法律视角。必须指出的是，许多黑客组织公开承认其成员积极从事高度非法的活动，这些活动迟早会受到惩罚，如果俄罗斯当局决定起诉这些组织，他们亲俄的爱国观点将不会被纳入考量。第一个指出这一问题的黑客团队是
  `XakNet`，这是最资深且存续时间最长的组织。


  在集体赞赏 `REvil` 成员技术的同时，没有一个俄罗斯黑客组织愿意重蹈 `REvil` 的覆辙，并带着苦涩承认了俄罗斯政府在制止 `REvil` 活动中所扮演的角色。俄罗斯
  IT 界的整体挫败感和失望情绪由 `XakNet` 组织表达出来，该组织同意 `REvil` 在国外发动了多次非法网络侵略。在网络战的背景下，这种挫败感变得更加尖锐，因为许多黑客定期代表俄罗斯联邦实施攻击。正如
  `XakNet` 所强调的，少数组织公开露面并运作，而许多黑客因担心 `REvil` 成员在全国各地被捕，而不敢宣布他们的行动（Russian OSTIN 2022）。在一次采访中，`XakNet`
  代表澄清道：


  > `REvil` 团队实施了非法行为。然而，他们是在国外实施的，而非在俄罗斯。他们的软件如果检测到突然出现在俄罗斯联邦境内，会自我销毁。然而，黑客还是被拘留了。以前不会发生这种情况，我们的俄罗斯专家自由地为国外目标工作。如果他们在俄罗斯网络空间检测到危险，黑客会警告相关管理员。这是一个双赢的局面。（Russian
  OSTIN 2022）


  根据黑客的说法，存在两个关键问题。第一，俄罗斯政府破坏了长期存在的“默契”，该默契有助于培养拥有独特技能的国内专业人士；当局显露出惩罚黑客在外国犯罪的意愿，导致
  IT 界严重恐慌（Russian OSTIN 2022）。第二，黑客因担心可能的法律后果，决定不与政府合作以保卫祖国（Russian OSTIN 2022）。


  ### 对身份暴露的恐惧与应对


  确实，`FRWL` 组织在回答追随者提问时，透露了其持续“狂躁”地担心被识别身份（FRWL 2022）。基于这种恐惧，`FRWL` 团队没有雇佣外部专家，尽管许多黑客组织这样做，例如
  `KillNet`。为了维持活动，`FRWL` 黑客仅依赖现有成员及其技能。`Zarya` 的领导人也表达了同样的担忧，强调为保护成员身份，被黑数据仅会发布在其官方网站和
  Telegram 频道上。“反驳所有指控，我的组织不会向克里姆林宫成堆地交付被黑文件，因为我们保持匿名并重视我们的安全，”该黑客在接受俄罗斯《报纸报》（Gazeta）采访时继续说道（Kildushkin
  2022）。


  这些组织对失去匿名性后果的警惕是正确的。他们见证了 `REvil`——最多产的勒索软件团伙之一——的下场。`REvil` 主要针对美国数字实体发动勒索软件攻击，其受害者名单包含美国
  `Colonial Pipeline`、软件提供商 `Kaseya`、肉类加工商 `JBS` 等知名企业（CBS News 2021; Hill 2021）。2021
  年 7 月，美国总统 `Biden` 与普京总统通电话，讨论俄罗斯黑客问题后，`REvil` 从暗网消失（Soshnikov 2021）。一些消息来源表明，鉴于广受关注的美俄反黑客合作，黑客们对即将到来的惩罚感到不安（Nefedova
  2022）。2022 年 1 月，`FSB` 特工在多个俄罗斯城市实施突击搜查。随后，俄罗斯媒体报道了在莫斯科、圣彼得堡、利佩茨克州等地拘留了 14 名嫌疑人。在大量现金中，调查人员在
  `REvil` 的加密账户上发现了超过 100 万美元（Nefedova 2022）。


  尽管如此，黑客们意识到，无论他们是在 2022 年 2 月 24 日后出于爱国热情发动攻击与否，总有一天要为黑客攻击负责。确实，`XakNet` 组织在开始对乌克兰的网络侵略时，充分意识到了与这种犯罪行为相关的个人风险：





  > 我们清楚地了解危险。我们不受制裁，也没有人要求我们提供帮助。我们的活动未经协调，我们也不确定我们的打击是否必要。如果我们的执法机关决定对我们提起诉讼，我们已做好准备。（俄罗斯
  OSTIN 2022）


  尽管如此，并非所有团体都意识到，俄罗斯当局终有一天会追捕他们。当俄罗斯今日（Russia Today）主播询问 KillMilk 关于实施网络打击的合法性及其惩罚问题时，KillMilk
  辩称，只要他和他的团体在国外活动，他就认为自己是一名遵纪守法的俄罗斯公民（Russia Today 2022）。因此，无视 REvil 的不幸遭遇和 XakNet
  的警告，他坚信黑客只要遵守所谓的协议，并在全国范围内资助孤儿院（像 KillMilk 所做的那样），就能享有豁免权。自冲突开始以来，俄罗斯情报机构减轻了对 IT
  社区的压力：“至少没有关于黑客被捕的新公告。也许当局太忙了，无暇追捕或与我们合作”（Kildushkin 2022）。因此，黑客们将自己视为网络罪犯，向国内外情报机构隐藏身份。他们因爱国行为而指望在俄罗斯获得豁免，却对本国政府会原谅他们在欧洲、乌克兰和美国所犯罪行缺乏信心。虽然他们在俄罗斯保持着希望，但俄罗斯黑客团体预计会受到外国政府的严厉惩罚。例如，2022
  年 3 月，XakNet 团队强调外国情报机构渴望抓捕他们，等待其成员跨越俄罗斯边境：“我们不打算离开俄罗斯联邦，哪怕是去度假。所以，别浪费时间了；我们不想被国际刑警组织特工拘留”（XakNet
  Team 2022）。


  总之，黑客团体向政府部门发出了明确且大量的信号，表明他们乐意发展任何形式的关系。XakNet 和 FRWL 公开强调他们与军方的短期合作，人民网络军（People’s
  Cyber Army）协助当地 FSB 特工瓦解了 2022 年 9 月反对动员令的当地抗议运动。黑客团体承认自己实施了非法行为，并在俄罗斯寻求合法化，因此公开支持俄罗斯政客反复无常的政治主张。然而，他们与当局合作的意愿及其亲俄政治立场，并不足以让我们断定俄罗斯黑客团体是
  FSB 的项目。可以推测，迟早其中一些团体将处于俄罗斯当局的控制之下。


  ### 俄罗斯黑客的国内受害者


  为提升品牌知名度并吸引新追随者，黑客品牌寻求与报纸头条建立关联。让头条为品牌服务的最佳方式是转发最引人注目的新闻，以抓住公众注意力。此外，黑客团队深知其“客户”最能共鸣的话题，这使他们能预判对受众的影响力。2022
  年 7 月初，关于莫斯科一家汽修店拒绝为来自顿巴斯战区、车辆带有“Z”标识的一名士兵提供服务的消息，引发了公众的广泛关注（MK.ru 2022）。据该士兵称，店主表示其店铺不为军人服务。然而，店主的说法截然不同。该士兵因在俄罗斯军队服役，要求免费维修车辆。修理工试图向士兵解释店铺已关门，而且不提供其车型的维修服务。愤怒的士兵向拥有约
  170 万订阅用户的热门 Telegram 频道“Mash”举报了此事（Mash 2022）。该故事迅速通过 Telegram 新闻媒体传播，随即蔓延至电视新闻和印刷媒体头条。随着该事件广为人知，该企业及其店主成为了普通公民和黑客的攻击目标。KillNet
  组织黑客攻击了该汽修店的网站，并提议其追随者在 Yandex 地图上撰写恶意评价（We are KillNet 2022）。


  2022 年 7 月 7 日，莫斯科另一家企业试图在黑客压力下生存。愤怒的莫斯科居民向 Akim Apachev 的 Telegram 频道报告了一场正在进行的慈善拍卖，参与者出售他们的复古黑胶唱片（Akim
  Apachev 2022）。具体而言，Telegram 订阅者抱怨该拍卖在一家由商人 Pavel Kosov 经营的墨西哥餐厅举行。值得注意的是，这家餐厅距离著名的
  FSB 总部大楼——卢比扬卡——不远。


  人们发送了餐厅入口处拍卖公告的照片：“明天，我吧台将开始慈善黑胶唱片市场……几十位朋友、音乐家、黑胶收藏家和关心此事的人士捐赠了他们的藏品出售……本次活动筹集的资金将发送给
  @kyivangels”（Akim Apachev 2022）。考虑到志愿者组织“Kyiv Angels”是一个帮助乌克兰人民和武装部队的乌克兰实体，Pavel
  Kosov 被贴上了“支持在顿巴斯地区杀害俄罗斯儿童的乌克兰恐怖分子”的标签（Akim Apachev 2022）。


  据称，2022 年 6 月 26 日至 7 月 7 日期间，许多莫斯科休闲吧、酒吧和餐厅都举办了此拍卖。活动发起人不详，但这些人在 2022 年 2 月参与了始于
  2 月 24 日的首都反战会议浪潮，这家墨西哥餐厅的老板也是抗议者之一。抗议第 4 天，警方在莫斯科孔科沃区拘留了 Pavel Kosov 及其他 21 名抗议者（OVD
  News 2022）。


  随着丑闻从 Telegram 蔓延至报纸头条，Pavel Kosov 的个人数据开始在互联网上广泛流传，包括他的家庭住址和手机号码（Troika 2022）。为协助警方，FRWL
  黑客收集了关于 Kosov 及其活动的数据。其订阅者要求黑客对餐厅发起 DDoS 攻击，但 FRWL 解释道：“我们看到了你们的要求，但 DDoS 攻击或其他类型的攻击并不总是必要的。我们认为我们的警方机关会处理得更好，也更痛苦”（FRWL
  2022）。


  毫无疑问，莫斯科餐厅事件不仅引起了警方注意，也引起了其他相关官员的关注。确实，莫斯科市杜马副主席 Andrey Medvedev 表达了严重关切，强调他将联系执法机关，要求其调查涉事人员是否为乌克兰武装部队提供资助（A.
  Medvedev 2022）。


  几天后，沮丧的店主被迫发布视频解释情况。据他称，拍卖组织方未告知他慈善拍卖的真实目的，因此才发生了这一不幸事件，餐厅声誉受损。Pavel Kosov 强调他从未支持过乌克兰士兵（FRWL
  2022）。然而，餐厅的 Instagram 账号发布了一条不同的解释；称餐厅账号被攻陷，未知黑客发布了关于慈善拍卖的帖子（Signal 2022）。对于关心此事的公众而言，这两种解释都显得站不住脚。因此，负面反应不可避免。确实，FRWL
  黑客不仅泄露了关于该企业的信息，还泄露了 Kosov 的商业合作伙伴信息。值得注意的是，因店主和员工收到威胁，餐厅曾暂时关闭。





  ## 黑客组织与亲俄叙事的交织


  ### FRWL 黑客组织的证据收集


  事实上，来自 FRWL 的黑客一直在追踪这场丑闻的发展。尽管他们没有动用专业技能攻击 Pavel Kosov 及其商业伙伴，但 FRWL 黑客仅收集了可用于惩罚这些人的数字证据。


  ### KillNet 针对 Sergey Zhykov 的行动


  2022 年 12 月，克拉斯诺达尔市发生一起事件：俄罗斯士兵试图进入一家酒吧，却因着装规定被保安拒之门外（Rusvesna 2022）。该酒吧老板是 2000
  年代著名歌手兼作曲家 Sergey Zhykov；值得注意的是，自 2022 年 2 月 24 日以来，俄罗斯国内因名人拒绝支持俄罗斯武装部队而引发的公众愤怒日益高涨。在此背景下，有影响力的
  Telegram 新闻频道发布恶意文章，将 Sergey Zhykov 作为名人圈一员进行谴责，指责其暗中支持叛逆名人（Readovka 2022; Rusvesna
  2022）。同日，KillNet 团队要求受众分享 Zhykov 的网站地址，因为愤怒的黑客决定通过瘫痪网站来儆效尤（We are KillNet 2022）。老板反应迅速，但
  KillNet 更快。尽管黑客承诺不攻击俄罗斯数字实体，但该组织破例了：收到地址 30 分钟后，KillNet 的 DDoS 攻击摧毁了歌手的网站。尽管 KillNet
  提供了证据，但不清楚 DDoS 攻击是否真正发起，因为 KillNet、Sergey Zhykov 和俄罗斯新闻门户均未提及该攻击（Izvestia 2022;
  Poplavok 2022; Rychkina 2022）。为平息公众和黑客怒火，Sergey Zhykov 修改了着装规定，并邀请军人及其朋友光顾其旗下一家酒吧（Zhykov
  2022）。满意的 KillNet 停止追逐这位音乐人，但其受众对此反应不一。部分追随者笼统认为所有名人都是潜在叛徒和纳粹支持者，而另一部分则对 Zhykov
  向军人提出的温暖合理建议感到欣慰（We are KillNet 2022）。


  ### Rutor 论坛勒索事件


  Rutor 平台是一个流行的暗网论坛，个人可在上面买卖任何东西。在俄语互联网中，关于 Rutor 所有者存在多种阴谋论。一种理论称论坛被出售给执法机关；传闻毒贩买下了它。2022
  年 8 月，Telegram 因乌克兰情报机构成为 Rutor 新管理层的消息而沸腾（We are KillNet 2022）。因此，KillNet 立即号召黑客合作，发动大规模
  DDoS 攻击。最终，三个组织——Anonymous Russia（KillNet 分支）、Phoenix 和 QBOTDDOS——联手试图瘫痪 Rutor 论坛；此外，KillNet
  发布了 Rutor 的地址并呼吁追随者参与（We are KillNet 2022）。经过四天持续的 DDoS 攻击，Rutor 管理员联系 KillNet，提出支付费用以换取停止攻击并恢复论坛声誉。据黑客在
  Telegram 上透露，Rutor 支付了 15,000 美元加密货币，但 KillNet 欺骗了管理员，宣布三天后发动新攻击。为彰显 KillNet 的爱国意图并平息谣言，KillNet
  团队承诺将这笔金额的 50% 捐赠给孤儿院（KillMilk 2022）。值得注意的是，该组织未提供截图证明来自 Rutor 的交易，也忘记提供承诺的孤儿院收到捐款的证据。


  ### 亲俄政治立场与品牌建设


  从在社交媒体亮相的第一天起，黑客组织就感到有义务向追随者和俄罗斯当局阐述并传播其政治立场，这与官方政府对俄罗斯在乌克兰特别军事行动的看法一致。在监测乌克兰前所未有的危机时，黑客认为有责任在网上为俄罗斯联邦对抗敌人做出贡献。他们的每一个行动都伴随着大量在线帖子，符合其公开的反北约和反乌克兰政府立场。为突显亲政府情绪，许多黑客组织以传统方式或通过网络攻击庆祝专业军事节日。2022
  年秋季俄罗斯政府宣布部分动员令时，两个黑客团队谴责反战倡议。尽管他们公开支持这一不受欢迎的政府举措并攻击反战活动家，但这些黑客组织的声誉和人气并未受损。事实上，这种亲俄议程引起了俄语受众的共鸣，符合其追随者从品牌角度的期望。


  ### 跨界合作与信息网络融合


  同时，亲俄政治观点为黑客组织与 IT 专业圈子外的其他数字实体（如新闻主播、军事单位、慈善组织和志愿者）合作奠定了基础。对黑客而言，连贯的政治议程不仅增强了追随者的认可和信任，还帮助黑客被
  Telegram 上形成的亲俄信息频道网络所接纳。由于认可和信任需要对内容持续关注和品牌管理的严密监督，黑客组织监控模仿其渠道的虚假账号，并强调其能力和技术，通过攻击国内外有意义的目标来给追随者留下深刻印象并激发公众兴趣。


  ### 注释


  1.  **VPN** 指虚拟专用网络，有助于保护用户身份和数据。


  2.  **Eurovision** 是由欧洲广播联盟于 1951 年创办的歌唱比赛。有多个成员国和准成员国。2022 年有 52 个国家参加了这项音乐比赛，俄罗斯联邦除外。


  3.  **Yana Rudkovskaya** 是俄罗斯音乐制作人。她的第一任丈夫是 Viktor Baturin，即 Yelena Baturina 的兄弟，后者是
  Yuri Luzhkov 的遗孀。2007 年，Yana Rudkovskaya 与花样滑冰天才 Alexander Plushenko 结婚。


  4.  **Ivan Urgant** 是俄罗斯联邦最受欢迎的艺术家之一。在俄罗斯入侵乌克兰前，他是第一频道一档热门深夜脱口秀节目的主持人，该节目由俄罗斯政府赞助。


  5.  **Alla Pugacheva** 是 73 岁的苏联和俄罗斯歌手。2022 年 2 月 24 日后，她因乌克兰战争决定离开俄罗斯前往以色列。


  6.  **Maksim Galkin** 是 Alla Pugacheva 的丈夫，知名喜剧演员。随家人在乌克兰战争爆发时迁往以色列。2022 年 9 月，俄罗斯政府认定他为从乌克兰募集资金的外国代理人。


  7.  **Valery Meladze** 是出生于格鲁吉亚巴统的俄罗斯歌手兼作曲家。


  8.  **Aleksander Nevzorov** 是电视记者和前国家杜马代表。2022 年 3 月，Nevzorov 离开俄罗斯；如今他已获得乌克兰公民身份。


  9.  **Andrey Makarevich** 是苏联和俄罗斯音乐家兼作曲家。他是俄罗斯最好的摇滚乐队之一“Time Machine”的创始人。


  10.  **Boris Grebenshchikov** 1953 年出生于列宁格勒。他是一名歌手/词曲作者。现居住在国外并批评俄罗斯在乌克兰的侵略行为。






