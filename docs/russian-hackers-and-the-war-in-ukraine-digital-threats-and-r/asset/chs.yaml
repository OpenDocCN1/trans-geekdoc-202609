  ## 作者简介


  **朱莉娅·斯威特博士**在俄罗斯诺夫哥罗德国立大学获得历史学学位。随后，她在罗格斯大学获得全球事务博士学位。在博士论文研究中，她考察了俄罗斯网络空间中的在线恐怖主义网络（2013–2018）。此前的出版物反映了她对社交媒体、网络犯罪、政治营销、在线极端主义网络和社交媒体运动的兴趣。


  '
