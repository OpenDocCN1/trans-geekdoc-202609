- '## 俄罗斯黑客与乌克兰战争：数字威胁与现实后果




  ![](img/cover.jpg)



















  ![](img/trade.jpg)





  ## 前言


  自 2022 年 2 月俄罗斯对乌克兰发动侵略以来，全球社会已卷入这场持续的网络战争。尽管黑客在全球范围内变得更加活跃，但俄罗斯和乌克兰“网络军队”之间的冲突处于最前沿。本书研究了一个独特的局面：通常隐蔽行事的网络犯罪分子浮出水面，寻求公众关注和认可。关键在于，本书不涉及黑客技术的技术层面。相反，它审视俄罗斯黑客组织的公开活动，包括品牌建设、与支持者的沟通、财务状况及其他关键方面。


  持续的网络战争正在升级，黑客攻击的范围也在扩大。这一课题对于未来研究至关重要。尽管本书聚焦于世界的特定区域，但其发现可推广至全球舞台。这场网络战争仅是我们社会面临的未来网络战争的预演。因此，研究始于澄清“网络战争”这一广泛使用且至关重要的术语。


  在当代世界，任何军事冲突，无论其规模和参与方如何，都有可能转移到网络空间，在那里熟练的 IT 人员可以通过摧毁对手的数字实体来推进其政治立场。之所以会发生这种情况，是因为几十年来，技术突破改变了社会的方方面面，而战争作为人类历史不可否认的一部分，也受到了创新的影响，这些创新不仅被用作工具，更被用作武器。通信技术以惊人的速度发展，且人人可及，不仅限于业内人士，这使得网络空间不仅是娱乐区，更成为了“战争”区。


  自互联网发明以来，将网络战争视为安全威胁的认知不断攀升，对网络安全的高度关注已主导全球安全话语。网络战争和网络安全已成为军队、执法部门和情报机构等国家实体的首要任务。网络空间的武器化已成事实，因为数字化已涵盖每个私人住宅和政府设施。政治或商业网络间谍活动、破坏和网络攻击已成为现代的常态属性。全球民众普遍认为复杂的网络行动在战斗中极为有效。因此，“网络战争”一词在专家和外行中广泛传播。然而，为达成定义共识，本书需探讨并澄清其含义以求精确。


  二十多年来，网络战争话题在公共智库中以话语形式出现。在学术讨论进行期间，该术语的定义问题依然尖锐，只有少数相关国家尝试建立相关机构以应对网络侵略（Liff 2012;
  Zilincik and Duyvesteyn 2023）。2011 年，Lior Tabansky 解释称，缺乏定义源于网络空间的新颖性及其与“物理世界基本概念的有限关联性”（第
  82 页）。此外，2007 年对爱沙尼亚、2008 年对格鲁吉亚以及伊朗纳坦兹铀浓缩设施遭受的引人注目的网络攻击，振奋了讨论，加速了这方面的努力（Corera
  2021; Herzog 2011; Rosenbaum 2012; Shakarian; The 2008 Russian cyber-campaign against
  Georgia 2011）。


  关于网络空间内的侵略行为，文献中包含各种描述性术语，如网络战争、网络战或网络冲突（Arquilla and Ronfeldt 1993; Carr 2012;
  Gartzke 2013; Dombrowski and Demchak 2014; Hughes and Colarik 2017; Kaiser 2015;
  Oakley 2019; Rid 2012; Tabansky 2011）。Hughes 和 Colarik 指出了缺乏单一标准定义的现状（Hughes and
  Colarik 2017）。他们的研究揭示了学术界流传的 56 种显性和 103 种隐性“网络战争”含义（Hughes and Colarik 2017）。最早尝试应对这一新现象的是
  1993 年的工作。John Arquilla 和 David Ronfeldt 区分了两类战争——网络战争和网络战，强调两者都关乎对对手及其防御的战略认知（Arquilla
  and Ronfeldt 1993, 27）。网络战争主要指国家实体间的冲突，而网络战则涵盖非国家和国家行为体。作者承认类别间的界限不清，以及即将到来的网络大冲突的复杂性：“网络战在很大程度上将是非军事的，但它们可能具有重叠到军事战争的维度”（Arquilla
  and Ronfeldt 1993, 28）。尽管 1993 年 John Arquilla 和 David Ronfeldt 尚不知强大的“Industroyer”恶意软件的存在，但他们不仅强调了网络战争严重的防御潜力，还强调了其毁灭性的进攻潜力。作者将网络战争定义为一种极其强大的创新，它包含根据信息相关原则进行的国家军事行动（Arquilla
  and Ronfeldt 1993, 30）。此外，Arquilla 修订了这一定义，强调它是“一种由先进信息系统启用并主要以此进行的冲突新兴模式，这些系统本身既是工具也是目标”（Arquilla
  2011）。






  ## 网络战与黑客行动主义的定义与演变


  ### 网络战的定义


  侧重于国家层面的网络侵略，Clarke 和 Knake 将网络战定义为由国家机构协调并实施的攻击，旨在“渗透另一个国家的计算机或网络，以造成损害或中断”（Clarke
  and Knake 2011, 6）。Jeffrey Carr 提供了另一个定义，侧重于网络战的结果，将其定义为“不战而胜之道；不流血而击败对手之术”（Carr
  2012, 2）。Thomas Rid 否定“网络战”这一术语，指出该术语不具备“成为战争行为的必要特征；如果战争中使用武力是暴力的、工具性的和政治性的，那么没有任何网络攻击符合这三个标准”（Rid
  2012, 9）。与许多其他研究者一样，Clarke 和 Knake 认为网络战是不可避免的，且已经发动。另一群研究者将网络战视为传统军事行动的一部分。Amit
  Sharma 批评这种将网络战理解为“传统行动的增强”的观点，认为它“能够通过诱导战略瘫痪以实现预期目的，迫使敌方屈从于你的意志”，且只需最小程度地使用“物理力量”即可完成（Sharma
  2010, 64）。网络战演变为一种战略学说，不仅要在实地冲突期间，还要在和平时期针对潜在敌人实施复杂的网络行动（Sharma 2010）。网络安全措施指针对网络侵略的防护，已成为备战的隐形且持续的常态。结果，和平时期与战争时期的界限变得模糊。


  ### 术语区分：网络战与网络战术


  在关于网络战的讨论中，“网络战”和“网络战术”有时被交替使用。本研究承认这两个术语的区别：网络战指战争行为，网络战术指破坏、间谍活动或分布式拒绝服务（DDoS）攻击等手段。在本研究中，网络战是一系列持续的网络行动，旨在损害对手的数字实体，由黑客组织或黑客活动家代表国家发动，作为对传统军事行动的直接或间接协助。间接协助意味着任何针对对手数字实体的政治动机网络行动。


  ### 关键术语澄清：“俄罗斯”与“亲俄”黑客


  需要澄清的其他重要术语是“俄罗斯”和“亲俄”黑客。在本书中，俄罗斯或亲俄术语被交替用于指代黑客的政治立场或其支持的冲突一方，而非其公民身份或国籍。


  ### 黑客行动主义


  黑客行动主义是一个相对较新的现象，但因其发表声明的非传统方式（主要是政治性的）而广为人知（Choo 2010; Davis 2012; Dahan 2013;
  Fowler 2016; Illia 2003; Taylor 2001）。各种研究已建立以确定黑客行动主义现象，在其中一些研究中，黑客行动主义被视为一种数字行动主义形式（Coleman
  2011; Dahan 2013; George and Leidner 2019; Jordan and Taylor 2004; Karagiannopoulos
  2020）。与其他形式的数字活动相比，黑客行动主义“体现了直接行动”以影响目标（George and Leidner 2019），涵盖集体抗议活动（Coleman
  2015; Goode 2015; Jordan and Taylor 2004; Samuel 2004）、瘫痪政府网站（Shakarian 2011; Skare
  2019）以及泄露个人或机密数据（Munro 2016）。黑客活动家采用多种手段，包括破坏、流量重定向、DDoS 打击、网站篡改、僵尸网络攻击和社会工程学（诱骗个人泄露安全信息）。


  尽管关于黑客行动主义和黑客组织的研究大量流传（Coleman 2015; Gorham 2019; Holt and Bossler 2020; V. Karagiannopoulos
  2018），但针对那些在法律之外行动、却仍设法将宣传与匿名性结合管理的黑客组织的研究并不多（Bodó 2014; Gillen 2012）。黑客活动家依赖社交媒体动员技术水平不高的个人，而匿名性似乎至少是二维的：（1）针对黑客，（2）针对参与的志愿者（Gillen
  2012）。当一些 Anonymous 爱好者被当局拘留时，这对他们来说是一个沉重的打击，因为 Anonymous 黑客并未试图隐藏真实志愿者的身份（Olson
  2012）。通常，黑客活动家隐秘行动，严格保持匿名以避免法律后果。为隐藏身份并逍遥法外，黑客建立秘密论坛、聊天室、私有群组和其他隐蔽实体（T. Holt 2013;
  Manatova et al. 2022）。


  ### 著名黑客行动主义案例


  目前，著名的黑客行动主义案例列表已相当可观。最早的黑客行动主义案例之一可追溯至 1999 年，当时名为 Electronic Disturbance Theater
  的组织对白宫、五角大楼及全球其他政府网站发起网络攻击（Goode 2015）。2011 年，隶属于 Anonymous 的 LulzSec 黑客对 Fox.com
  发动网络打击。Ghost Squad 对 Trump Hotel Collection 网站实施强力 DDoS 攻击，该网站一度显示黑客的声明。自乌克兰战争爆发以来，几个发动多起政治动机网络侵略的俄罗斯组织必须被加入这份黑客活动家名单。针对
  2008 年格鲁吉亚、2007 年爱沙尼亚以及克里米亚并入后乌克兰基础设施的俄罗斯黑客行动，已有各类研究。也有 2022 年的研究审视国家与黑客的关系、黑客的目标以及俄罗斯网络犯罪分子的危害潜力。值得注意的是，并非所有黑客都是黑客活动家，也非所有黑客活动家都是黑客。本研究试图考察俄罗斯黑客活动家在当下（自乌克兰战争爆发以来）的状态，当时他们寻求来自社会甚至当局的支持、认可和赞赏。在转型为黑客活动家的过程中，黑客们在社交媒体上建立了公众形象，具有一定的可见度，在一定程度上无视了个人匿名性和隐秘性。






  ## 实证研究：黑客组织


  这项关于黑客组织的实证研究主要依赖于对案例研究的详细审查，涵盖的时间段为 2022 年 2 月 24 日至 2023 年 1 月 1 日。研究基于从以下黑客组织收集的数据：Joker
  DPR、Beregini、XakNet、From Russia with Love、NoName057(16)、KillNet、Anonymous Russia、Zarya、RaHDIt
  (Russian Angry Hackers did it) 和 People’s Cyber Army。这些组织必须满足一组条件：(1) 从事黑客活动；(2)
  存在公开的社交媒体账号，并在线持续存在至少三个月；(3) 拥有亲俄政治议程。


  本书呈现的分析主要基于开源情报，例如社交媒体条目（包括文本、视频、图片和聊天评论），这些内容通过对黑客组织活动的每日监控收集而来。数据库包含来自 30 个 Telegram
  账号、12 个 Twitter 账号、5 个 Vkontakte 页面和 2 个网站的 5,000 多条社交媒体条目。研究涵盖了来自联邦媒体（如 Russia
  Today、TASS、Ria News、Vedomosti、Kommersant、Sputnik、RBC 的在线版）、地方媒体（如 Fontanka、Vest、URA、Sakh
  Online 的在线版）、电视媒体（如 TV Rain、TV Center）、俄罗斯和乌克兰政府部门官方网站（如 Gosuslugi、Kremlin、Ministry
  of Defence of Ukraine）、金融机构和官员的社交媒体账号（如 Sberbank、Banki、普斯科夫州长 Michael Vedernikov、前
  Roscosmos 总监 Dmitry Rogozin），以及评论网络安全的媒体来源（Kaspersky Lab、Tadviser、SecurityMag）的信息。此外，黑客接受俄罗斯媒体采访的内容也被发现是有用的信息来源。尽管有几个组织积极寻求宣传并乐于沟通，但本研究并未对受审查实体的成员黑客进行独家采访，因为几乎不可能验证受访者的身份。


  研究聚焦于最活跃和最受关注的黑客组织，并不声称具有整体性，因为无法涵盖在网络空间运作的每一个甚至大多数黑客组织。研究承认许多黑客组织仍隐匿于暗网，同时也认识到对于某些黑客组织而言，宣传和认可已成为其品牌建设的关键补充。此外，并非黑客活动的所有方面都完全呈现在网络上，特别是核心成员、成员间的纠纷和沟通、真实姓名、工作单位、教育水平、地理位置等引人入胜的信息。


  通过在线活动的视角审视乌克兰战争，本书试图揭示网络战和黑客行动主义现象的复杂性。本书探讨了俄罗斯黑客如何建设和推进其品牌并管理其公众形象。鉴于宣传对于受审查的黑客实体而言是相对较新的事物，研究利用这一点尽可能地考察黑客组织、其结构、组间关系、背景、目标、观点、身份、非黑客相关活动、攻击准备、媒体沟通，以及其预算及来源。为此，研究分五章呈现。


  - Chapter 1 描绘了 2022 年 2 月乌克兰战争爆发如何使俄罗斯媒体机构的在线形象在本地和联邦层面（Russia Today、Sputnik、TASS）变得复杂。还包括了关于企业遭遇的多重网络挑战的讨论，这些挑战不仅源于全球公司拒绝与俄罗斯实体合作，还源于外国黑客行动主义者为报复入侵乌克兰而发动的攻击。

  - Chapter 2 提供了从成立至今对每个受审查黑客组织进行研究的结果。

  - Chapters 3 和 4 从不同方面审视黑客组织如何进入并学习社交媒体营销，并在某些情况下将其数字在线形象推进至创建可识别品牌的地步。在此过程中，研究基于
  Kotler 的品牌模型框架和 Aaker 的品牌资产模型，梳理出一套品牌建设维度。在此框架下，章节考察了黑客的社交媒体网络及其如何维护账号可信度、黑客的象征文化与政治观点、黑客组织间的合作及其与俄罗斯政府的关联、与追随者的沟通，以及内容策略。

  - Chapter 5 探讨了俄罗斯黑客声称对欧洲、乌克兰和美国数字实体发动的网络攻击。


