  # 第 3 章：俄罗斯黑客


  ## 社交媒体存在感与品牌建设


  ## 俄罗斯黑客选择 Telegram


  社交媒体领域包含数不胜数的平台、大量的互动方式，以及适合各类实体的多种风格。社交媒体用户需要根据自己的偏好和目标，弄清楚哪些平台最有用。在寻找网络时，媒体运营者通常会通过观察潜在订阅者如何度过他们的在线时间来发掘他们。例如，运营者会观察订阅者是正在学习新技能还是阅读新闻。在制作内容和回复评论之前，媒体团队或所有者不仅应该了解潜在受众，还应该了解主要竞争对手以及相关的可接触影响者。这些指导原则非常笼统、可行，甚至对黑客也适用，仅有一些合理的例外。然而，政治改变了人们与社交媒体互动的大部分方式，如果不是全部方式的话。乌克兰战争的爆发以及对社交媒体使用的限制，预先决定了黑客对社交媒体平台的选择。


  战争爆发后不久，美国科技巨头与俄罗斯政府之间爆发了战斗。2022 年 2 月 25 日，为防止虚假信息涌入，Twitter 在俄罗斯和乌克兰暂停了广告业务，并限制了特定账号的推荐。尽管
  YouTube 自 2018 年起就已将俄罗斯国家支持媒体的视频标记为国家资助，但 Twitter 管理层于 2022 年 2 月 28 日宣布为俄罗斯实体实施类似的标签（Roth
  2022）。同一天，Meta 拒绝了许多俄罗斯宣传媒体，包括“卫星通讯社”和“今日俄罗斯”（RT）。Meta 全球事务总裁尼克·克莱格发推文称，应“多国政府和欧盟”的要求，公司将“暂时限制在欧盟范围内访问
  RT 和卫星通讯社”（Clegg 2022）。


  针对正在进行的战争，Google 更改了 YouTube 对俄罗斯联邦国家资助媒体频道的变现政策，阻止这些频道赚钱（Google Support 2022）。3
  月 1 日，Google 欧洲官方 Twitter 账号宣布关闭两个俄罗斯新闻平台——“今日俄罗斯”和“卫星通讯社”（Vincent 2022）。


  入侵前，俄罗斯当局与科技公司关系复杂。2 月 24 日后，局势恶化。战争第二天，通信监管机构 Roskomnadzor 宣布对 Meta Platforms,
  Inc.实施互联网限制，随后彻底封锁了 Facebook 在俄罗斯联邦境内的访问。Roskomnadzor 指控该公司侵犯俄罗斯法律，引用了 2020 年 10
  月至 2022 年 3 月期间 Facebook 上发生的 26 起歧视俄罗斯媒体资源的记录（Roskomnadzor 2022）。3 月，随着俄罗斯当局越来越多地指责这些平台煽动针对俄罗斯公民的暴力，全球主要社交媒体平台遭遇了类似的限制（Habr
  2022; Roskomnadzor 2022）。


  在这场政府与科技巨头冲突不断升级的背景下，Telegram 被视为俄罗斯受众的避风港。因此，亲俄黑客大举迁移到这个由杜罗夫兄弟于 2013 年创立的即时通讯应用。尽管俄罗斯当局试图将俄罗斯社交媒体用户引导至
  Vkontakte 和 Ok.ru，Telegram 赢得了这场竞争，成为最受欢迎的平台之一。在这里，黑客遇到了他们的受众，后者也在寻找一个稳定的社交媒体领域。


  同时，对于许多寻找战争信息的俄罗斯公民来说，Telegram 开始发挥重要作用。这并不令人惊讶，而是可预见且意料之中的：根据 2021 年的一项调查，受访者中
  77%为俄罗斯和白俄罗斯 Telegram 用户，75%的用户从 Telegram 获取新鲜资讯（Melkadze 2021）。2022 年，这一趋势持续增强，Telegram
  用户群激增 40%，从 2022 年 4 月的 5 亿月活用户增至 11 月的 7 亿（Ceci 2022）。俄罗斯最大移动运营商之一 MegaFon 公司收集的国内统计数据显示了类似趋势。据公司代表称，服务增长始于
  2022 年 2 月 24 日，3 月前两周 Telegram 流量从 48%飙升至 63%（Tyunyaeva 2022）。因此，就其庞大的用户基础和可期的扩张而言，Telegram
  是黑客及其新生倡议的完美平台。


  另一个使 Telegram 对黑客极具吸引力的因素是志同道合的媒体和内容上传者的广泛网络。战地记者鲍里斯·罗任、安德烈·雷登科、亚历山大·斯拉德科夫、谢苗·佩戈夫和叶夫根尼·波杜布内每天发布内容。此外，还有许多拥有大量追随者和可靠声誉的新闻频道，包括
  Rybar、弗拉基米尔·索洛维约夫、Readovka、迈克尔·奥尼弗里恩科和 Anna-News。所有这些账号相互关联，从社交媒体营销角度来看，凭借其可靠的声誉、独特的内容和经验，可被视为社交影响者。他们对黑客媒体的引用或对成功攻击的赞扬，有助于确保黑客频道的真实性并积累追随者。


  考虑到黑客实体内容的高度敏感性，Telegram 为用户提供了安全性和灵活的审查机制。黑客有机会为特定活动建立定制频道。在这个即时通讯平台上，他们找到了一个匿名加密的通讯枢纽，用于相互之间以及与公众收发消息，并上传大量信息文件。Telegram
  的审查不像其他社交媒体平台那样严格。通常，如果账号预期会被关闭，它们会创建一个名称相似的备用实体，这足以绕过 Telegram 的审查并保住客户群。






  ### 俄罗斯黑客品牌


  当时，要建立黑客品牌，Telegram 是完美的社交媒体平台。毫无疑问，由于政治环境，黑客的社交媒体选择有限。俄罗斯用户发现自己身处一个共同且困难的境地：本国政府与科技巨头相互配合，压缩了人们在互联网上的信息空间和通信能力。在
  Telegram 上，它已成为俄罗斯网民的一片净土，黑客们相遇了。双方都发现这是一个所谓“影响者”的网络，他们接纳了这批新来者，并帮助黑客们跟上最新的潮流和热门新闻话题。平台的安全性和便利性是意料之中却令人愉悦的额外收获。如果忘记提及黑客们为将品牌拓展至其他社交媒体平台所做的努力，那将是不公平的。就此而言，XakNet
  成功在 Twitter 上建立了主页，但要在那里建立并维持其存在感却被证明是不可能完成的任务。该主页于 2022 年 6 月开设，其粉丝数很快增长到约 500
  人。8 月，Twitter 管理方因多起投诉和违反 Twitter 规则而将其封禁。在 Telegram 上，XakNet 指责是 Anonymous 组织所为，声称该组织煽动其支持者成群结队地去
  XakNet 的 Twitter 页面投诉。KillNet 组织曾尝试在 2022 年夏季推进其 Twitter 账号。尽管如此，其账号在建立后不久即被封禁。此外，KillNet
  团队还运营着一个 Vkontakte 账号。该账号显然只是补充性的，因为它聚集的人气远不及该团队在 Telegram 上吸引的关注度。这一短暂且无效的经历反而更清晰地阐述了高度依赖
  Telegram 的多重益处。


  总之，现代数字营销高度细分，由多元实体组成——网站、博客和社交媒体平台。试图推广自身的品牌，必须根据所选数字细分领域的关键特性，制定有效的营销策略。从亲俄黑客的视角来看，他们的社交媒体空间被压缩到了
  Telegram。在这一细分领域内，他们的团队能够制定并实施品牌建设策略。


  ### 俄罗斯黑客品牌


  和普通人一样，黑客也曾将社交媒体平台用于个人用途。显然，他们在上面活动时不会让所有人知晓自己的黑客技能，将真实人格与专业领域分隔开来。我们永远无法知道，一个长相帅气的学生、一位热情好客的邻居、一位令人讨厌的同事，或是我们姐妹的新朋友，是否不是一个恶毒的全能网络犯罪分子或黑客。也许，国内或国外的执法机关已经找了他或她好几年了。事实上，我们永远不知道，也极大概率永远不会发现。为了避免法律后果，他们必须隐匿于阴影之中。就个人身份而言，这是黑客必须采取的常规操作方式。


  尽管如此，黑客组织却创建并展示了群体身份，关于 Anonymous（匿名者）、Red Hacker Alliance（红客联盟）、LulzSec 等黑客组织的故事见诸于全球各大新闻门户。俄乌战争爆发后，一些亲俄黑客决定寻求网络曝光并创建自己的品牌。对黑客而言，这种曝光并非新事物，但肯定有其独特的规则。如前所述，黑客在社交媒体平台上拥有个人账号，用于与家人朋友交流。然而从现在起，黑客必须建立并管理一种介于个人与非法之间的存在。


  决定在公开场合活动，意味着黑客组织进入了营销与品牌领域。每个黑客组织仅凭其存在这一事实，就拥有了自己的品牌。在品牌领域内，追求成功的黑客组织必须遵循并理解营销规则与原则，这些规则原则对绝大多数营销主体而言都是相同的。像其他任何群体一样，黑客需要建立并维护品牌、积累受众、树立声誉。


  起初，并非许多黑客团队意识到，网络曝光不仅仅意味着建立社交媒体账号，并在简介中自我揭露为黑客身份。为了使数字化存在富有成效且可见，一些黑客开始创建自己的品牌。他们意识到品牌营销需要持续的社区建设努力和长期的曝光。其他未能成功推广品牌的黑客组织或个人爱好者，要么加入了已建立的实体，要么销声匿迹。


  为了分析黑客创建、管理和传播品牌的策略，研究基于 Kotler 的品牌模型框架和 Aaker 的品牌资产模型，建立了一套品牌建设细分指标体系。该体系包含以下细分领域：品牌识别、品牌定位、品牌知名度和品牌信任。品牌识别是指刻画品牌个性的视觉与内容策略的组合；它涉及品牌使命、名称、象征文化（配色方案、头像、Logo
  等）、座右铭、品牌宗旨等。品牌定位依赖于品牌识别要素，是将被传递并传播给受众的品牌理念或哲学。研究将品牌差异化视为品牌定位细分领域的组成部分，差异化意指品牌相对于其他市场主体或竞争对手的独特性。事实上，品牌定位从广义上直接关联品牌战略，而社交媒体内容则以更具体、聚焦的方式被使用。框架的另一个要素是品牌知名度，意指公众对品牌存在及其产品的认知程度。如今，随着社交媒体平台和众多在线主体的主导地位，建立品牌信任极为重要却也极其困难。客户需要对品牌履行承诺、遵循宣称价值观的能力充满信心。


  当黑客试图通过社交媒体，特别是在 Telegram 上推进其网络存在感时，研究为每个品牌建设细分领域制定了一套指标。品牌识别通过渠道视觉文化、名称的一致性以及使命宣言的存在与否来衡量。品牌定位包含两大类别：社区互动和在线内容。指定以下指标来衡量这些类别：与受众的公开沟通、互动性内容、与影响者的联系，以及品牌的财务基础。





  品牌知名度是指与其他渠道合作并与知名目标建立关联。值得注意的是，品牌认知取决于营销的持久性，这一点通过发帖模式得到了验证。品牌信任意味着品牌的真实性，这将通过监控虚假账号、政治立场以及追随者参与网络攻击的情况来分析。一些俄罗斯黑客组织邀请公众协助发动攻击。网络勒索行为属于违法这一事实并非秘密，因此
  Telegram 用户在参与可被惩处的黑客行动前，应保持一定程度的品牌信任。对于黑客品牌而言，信任是一种多维现象，与受众参与黑客行动和政治观点紧密相关：要成为集体网络犯罪行动的一部分，个人必须了解黑客对针对乌克兰的“特别军事行动”、俄罗斯政府行动等议题的立场。政治观点发挥着根本性作用，因为黑客不是博主，他们不会与粉丝分享生活个人细节、最爱的酒店地址或最近度假的照片。黑客受众深知这场游戏的规则，并不指望黑客表现出寻常博主的行为。然而，即使常规建立信任的方法不再适用，信任也必须建立并维持。


  #### 品牌识别


  黑客的品牌识别建立在俄罗斯军队在乌克兰的行动之上，这成为了品牌发起和发展的触发点。他们宣称的品牌使命显示了他们对正在进行的军事危机的高度关注，以及协助俄罗斯武装力量、在网络空间捍卫俄罗斯联邦及其公民的个人意愿。


  进入公共网络空间后，黑客开始阐述和传播他们的议程与价值观。他们强调保护俄罗斯社会的高度爱国使命，指出俄罗斯已成为全球网络犯罪分子和政府实体的核心攻击目标。考虑到这场持续的战斗，他们无法袖手旁观，置祖国于无保护状态（Russian
  OSTIN 2022）。对于俄罗斯追随者而言，黑客塑造了一个集体品牌人格：一位拥有 IT 技能、每天与众多敌人进行网络战的热情利他爱国者（NoName057(16)
  2022; XakNet Team 2022; We are KillNet 2022）。在其频道的欢迎词中，人民网络军团团队声称他们是关心俄罗斯祖国未来的爱国者（People
  Cyber Army 2022）。


  该品牌形象的另一个重要特征是：黑客不是恶意攻击者，而是捍卫者。为落实这一品牌特质，他们采用了多种方法。首先，KillNet 与 XakNet 之间曾就为何参战进行过讨论。据称，两个组织都是在
  Anonymous 公开针对俄罗斯联邦发动网络战、指责其不公正地侵犯乌克兰主权后，决定加入冲突的（Milmo 2022）。例如，在 XakNet 成员眼中，这一威胁构成了重大危害；他们认为
  Anonymous 的力量是真实存在且可能对俄罗斯公民造成损害的（XakNet Team 2022）。黑客辩称，Anonymous 有能力摧毁小企业并掏空普通俄罗斯公民的银行账户。在
  Anonymous 发布威胁声明后不久，KillNet 组织愤怒回应，称 Anonymous 作为一个被遗忘的、曾经著名的实体，决定利用局势重返巅峰（We are
  KillNet 2022）。KillNet 团队将 Anonymous 标记为“美国傀儡”，并对公众会相信“冒牌 Anonymous”的言论感到愤怒（We are
  KillNet 2022）。出于挫败感，KillNet 于 2022 年 2 月 26 日通过强大的分布式拒绝服务（DDoS）攻击瘫痪了 Anonymous 网站（We
  are KillNet 2022）。


  如前所述，Anonymous 对俄罗斯国防部、国家杜马和政府控制的网络俄罗斯今日（Russia Today）实施了成功打击（Galimova, Chebakova,
  and Yasakova 2022; Milmo 2022）。克里姆林宫网站一度离线。甚至亲政府媒体当时也报道该网站无法访问。然而，据塔斯社采访，克里姆林宫新闻秘书德米特里·佩斯科夫否认了
  Kremlin.ru 瘫痪的说法，声称网站运行完好（Interfax 2022）。这些攻击影响重大且痛苦，因为多个网站瘫痪了数小时。2022 年 2 月 27
  日，Anonymous 组织公布了其攻击的初步成果：“……过去 48 小时内，300 多个俄罗斯政府、国家媒体和银行网站，其中大多数目前处于离线状态”（Anonymous
  2022）。在这 300 个网站中，至少有三家白俄罗斯银行遭受了 Anonymous 的攻击：belarusbank.by、priorbank.by 和 belinvestbank.by（Anonymous
  2022）。在这些有效打击之后，XakNet 于 2022 年 3 月发布新声明；再次强调该组织并未发起这场网络战，而是对 Anonymous 的攻击做出回应（XakNet
  Team 2022）。一旦确立，该组织便大力推广其无可挑剔的品牌形象。


  其次，遵循“黑客即捍卫者”的品牌叙事，XakNet 强调了对乌克兰平民的尊重和感激，表示该组织无意以此为目标并造成伤害。2022 年 3 月 6 日，其团队报告称已获得包括
  vinfast.net 在内的多家乌克兰互联网服务商的访问权限，并有能力切断乌克兰公民的互联网接入（XakNet Team 2022; XakNet Team
  2022）。例如，vinfast.net 网站被黑客入侵，以报复乌克兰近期对俄罗斯互联网服务商 Beeline 的攻击。其设置被恢复为出厂设置。XakNet 解释其选择目标的原因是“不会给乌克兰人造成严重损害”以及“网站设置可在短时间内恢复”（XakNet
  Team 2022）。表达出对对其他互联网服务商采取激烈行动的犹豫，黑客继续说道：


  > 我们不断强调，我们与乌克兰人没有过节。我们爱戴、尊重并珍视他们。早些时候，我们团队有一半成员来自乌克兰。我们专门与法西斯分子作战，我们极其痛恨他们……我们是在回应乌克兰的网络侵略。乌克兰的附属黑客尚未理清攻击俄罗斯的方法和目标。鉴于这些情况，我们想问问我们的人民，我们是否必须切断乌克兰的互联网。（XakNet
  Team 2022）


  此外，其 Telegram 频道发起了一项投票，追随者可在一小时内为 XakNet 的未来行动投票。尽管绝大多数（超过 60%）赞成切断乌克兰的在线通信，XakNet
  同意了少数派的意见，决定保持互联网服务开启（XakNet Team 2022）。





  ## 亲俄黑客组织的品牌身份与象征文化分析


  ### 使命宣言与敌对叙事


  NoName057(16) 和 People’s Cyber Army 组织在内容产出方面不如 XakNet 或 KillNet 那样多产。它们的使命宣言在 Telegram
  活动伊始发布，之后极少再回到这些声明上。


  这些组织的声明与 XakNet 关于“保护俄罗斯社会免受‘乌克兰法西斯分子’和‘班德拉追随者’侵害”的主张保持一致，同样指明了敌人：“夺取乌克兰政权的新法西斯分子”（NoName057(16)
  2022）。NoName057(16) 以“法西斯主义去死”开篇，自诩为对抗乌克兰黑客、“新法西斯思想崇拜者”的战士（NoName057(16) 2022）。声明承诺攻击“乌克兰虚假信息源头”，这些源头试图散布关于俄罗斯在乌克兰特别军事行动的虚假信息并“恐吓俄罗斯公民”，攻击“个人社交媒体账户及其他通讯渠道”（NoName057(16)
  2022）。黑客们频繁暗示美国和欧盟直接卷入这场冲突，People’s Cyber Army 团队也加入了这一叙事：“在美国协助下，乌克兰对我们的人民发动了信息战”（People’s
  Cyber Army 2022）。


  黑客组织 “From Russia with Love”（FRWL） 于 2022 年 6 月加入黑客运动和对乌克兰的网络战。解释其晚到的“入会”，该团队写道成员曾监控亲俄黑客行动并对其成果印象深刻，因此决定公开亮相。其使命宣言呼应了先前黑客的使命宣言，符合整体黑客品牌形象：“我们是
  FRwL。我们不能躲在阴影中，看着乌克兰的恐怖……我们反对纳粹主义！我们的战士在地面战斗，我们全心全意支持他们。干得好，兄弟们！我们将在这里战斗”（FRWL 2022）。


  ### 象征文化要素：视觉识别与 Logo


  在高度多元且竞争激烈的在线市场中，象征文化身份至关重要，尤其是对新建立的品牌。品牌象征文化包含出现在社交媒体、邮件、网站、广播、视频等渠道的视觉元素，涉及 Logo、配色方案、排版和信息布局。总体而言，黑客的象征文化发展不足、表现欠佳。大多数黑客认为对网络宣传唯一有意义的元素是他们的
  Logo，其他品牌象征文化要素被大多数团队忽视。


  进入 Telegram 空间，每个群组都展示了 Logo，但群组在 Logo 的含义或视觉外观上投入不多。


  - **Joker DPR 团队** 使用好莱坞小丑图片作为 Logo，将形象与群组名称关联。但该组随机、不一致地使用小丑图片，发布了许多不同的照片。因此，虽用鲜活角色作象征是好主意，但
  Joker DPR 实际上没有任何单一可识别的 Logo 供追随者辨识。

  - **XakNet** 直到有追随者为其创作 Logo 才拥有独特标识。

  - **People’s Cyber Army** 自 2022 年 3 月 2 日起更换了三次个人资料标识，配色方案甚至群组名称均不同。

  - **Anonymous Russia** 采用了 2014 年成立的旧 Anonymous 组织设计的 Logo。加入 KillNet 后，该 Logo 通过添加
  KillNet 名称进行了修改。

  - **NoName057(16)** 的 Logo 是带有数字行的黑白图像，难以记忆或辨识。


  相比之下，**Beregini、KillNet 和 RaHDIt** 拥有突出的视觉识别和精心设计的 Logo。


  - **Beregini** 选用黑白配色并在圆圈内插入符号。

  - **KillNet** 的 Logo 非常基础，以基础黑红配色呈现其名称。

  - **RaHDIt** 的“Nemesis”项目 Logo 为盾牌形状，手持天平，天平连接一把顶部系有格鲁吉亚丝带的剑。


  值得注意的是，尽管每个群组都在 Telegram 个人资料中放置了 Logo，但没有任何一个群组推广其象征符号。极少数情况下，当黑客组织制作视频时，XakNet、KillNet
  和 FRWL 会插入 Logo 以强调内容创作者身份。


  ### 信息布局与账号运营一致性


  在十个黑客品牌中，有四个群组尝试维护信息或账号布局的一致性。


  - **Joker DPR 群组** 几乎在每条帖子末尾添加标志性的小丑大笑 “Ha-Ha-Ha”。

  - **Beregini 群组** 以 “We are Beregini! We remember everything” 作为 Telegram 帖子的结语。

  - **KillNet** 展示了有效的账号布局策略。每日向追随者发布 “Good morning” 和 “Good night”，用 “comrades”（同志）、“my
  hackers”（我的黑客）、“colonists”（殖民者）或 “occupants”（占领者）等趣味称呼指代追随者。通过讨论串观察到增长趋势：KillNet
  追随者开始用 KillNet 称呼他们的方式来指代自己和彼此。这些帖子在 KillNet 受众中广受欢迎，引来大量回复（往往毫无意义）。

  - **NoName057(16)** 用一张带有嵌入群组名称的熊和熊足迹图片装饰每条帖子。


  ### 群组名称的文化、政治与专业隐喻


  每个黑客组织的名称选择揭示了文化、政治和专业层面的隐喻。在整个品牌身份体系中，这是与黑客最相关的要素。


  - **XakNet 和 KillNet** 的名称可读作 “hack a net” 和 “kill a net”，指涉成员的专业技能和群组目标。

  - **FRWL** 命名源自 1964 年同名好莱坞电影。名称的讽刺意味显而易见，且凸显了黑客组织的渊源。

  - **Beregini** 具有斯拉夫起源和女性色彩，即使不了解斯拉夫神话，该名称也散发出俄语中 “keep” 或 “protect”（守护/保护）的含义。这个富有表现力的名称进一步强调了该组织由女性创建、建立于某斯拉夫国家的事实。

  - **Joker DPR** 中的 “DPR” 指顿涅茨克人民共和国，体现了群组渊源或行动地域。

  - 针对乌克兰黑客组织 “IT Army of Ukraine” 的出现，俄罗斯仿制品以相似名称 **People’s Cyber Army** 出现。

  - **NoName057(16)** 在含义上保持中立。

  - **RaHDIt** 的 “Nemesis” 项目采用希腊正义与惩罚女神之名。

  - **RaHDIt** 名称的文化隐喻显而易见，意为 “Russian angry hackers did it”（俄罗斯愤怒的黑客干的）。

  - **Anonymous Russia** 以 2000 年代活跃的著名 Anonymous 组织命名，采用其座右铭，并添加 “Russia” 一词以区别于其著名前身。





  分析表明，70% 的黑客组织投入时间制定其使命宣言。因此，大多数组织将该宣言视为品牌建设过程的基石，这不仅有助于吸引潜在受众的关注，也能引起其他持相似议程的黑客组织和常规媒体的注意。Beregini
  和 Joker DPR 属于特殊情况，因为他们在 2022 年 2 月 24 日之前就因亲俄活动而成名。对他们而言，无需再次阐述其使命。在考察所有黑客组织使命宣言的构建时，研究发现它们呈现形式各异：一条或多条帖子，有时甚至未置顶，但主要涵盖相同要点：(1)
  组织的活动（黑客攻击）和动机，(2) 计划打击的对手，以及 (3) 政治立场，包括对俄罗斯政府和军队的支持。通过这些要点，黑客将自己描绘成俄罗斯社会的捍卫者，抵御逼迫他们参与这场展开战争的狂妄外国黑客。通常，品牌建设始于寻找和评估潜在竞争对手，但黑客团队并未试图竞争粉丝、赞助商或认可度。相反，他们有意或无意地寻求建立一个志同道合的黑客网络，以便相互合作并与共同受众沟通。这在一定程度上解释了缺乏精心设计的象征性品牌属性，以及推广品牌独特外观的连贯策略。虽然每个黑客组织进入网络空间时都有自己的徽标和名称，但两个组织——NoName057(16)
  和 Zarya——选择名称时未赋予隐含的加密含义；黑客受众通常希望其组织选择能反映其意识形态的名称。总体而言，黑客团队在视觉形象上投入不大。70% 的团队未通过产品或社交媒体内容推广其标识，而
  30% 的团队极少这样做。研究发现消息或账号布局缺乏一致性：仅 40% 的黑客账号具有统一布局。尽管大多数黑客组织饱受糟糕的象征性外观和不连贯甚至完全缺失的使命宣言之苦，但
  KillNet 的社交媒体管理维护并精心打造了其品牌形象，使该组织在向公众传达所谓的“集体黑客身份”方面成为领跑者。


  #### 品牌定位


  品牌定位是品牌能向特定市场领域和公众呈现的价值的聚合。在品牌定位中，可确定两大类别——社区互动和内容。根据这些类别，确定了一组用于评估品牌定位过程的指标：与受众的开放沟通（包括参与网络攻击）、互动内容（提问和调查）、与影响力人物的联系，以及财务基础。


  ##### 黑客与追随者：沟通


  无论黑客产品多么独特，黑客团队都需要寻找市场和受群。为此，在线品牌需通过社交媒体互动定制其关系建设活动。值得注意的是，虽然黑客组织可以在没有开放沟通的情况下生存甚至壮大，但黑客品牌若无开放沟通则无法立足和发展实体。这可由两个原因解释。首先，通过与追随者和支持者的开放联系，黑客可积累技术力量，尤其是用于
  DDoS 攻击。参与者越多，造成的破坏越大。其次，与追随者的沟通能提升品牌知名度。总体而言，社区互动是一个持续过程，互动程度会随时间增减。在 Telegram
  上，亲俄黑客为追随者提供了不同的沟通渠道：电子邮件、表情回复、调查、评论和聊天。


  为维持与追随者的直接沟通，少数黑客组织设立了电子邮箱，可在其 Telegram 频道的欢迎语中找到。大多数团队倾向于接收来自追随者、其他关心人士和组织的直接消息。例如，2022
  年 3 月，XakNet 组织至少管理两个邮箱和一个 Bot，服务于其特定目的。通常，该组织引导追随者写下关切和建议。其中一个邮箱用于沟通、富有成效的合作，以及明显与其他黑客组织协调共同行动（XakNet
  Team 2022）。除了邮箱，XakNet 组织还管理一个用于直接通信的 Bot，以实现各种目标（XakNet Team 2022）。XakNet 准备与其他亲俄黑客组织合作，组织针对乌克兰更有效的攻击。


  在发布欢迎帖子几天内，其邮箱被黑客的消息挤爆。这给 XakNet 带来巨大惊喜，因为他们未预料到会获得快速且信息丰富的回复（XakNet Team 2022）。此外，2022
  年 3 月 6 日，XakNet 团队发布另一个邮箱，寻求与俄罗斯媒体代表和主播的联系（XakNet Team 2022）。该黑客团队承认其成员无法妥善传递从黑客攻击中获取的信息：“我们是搞科学的人。我们写得不太好。我们在寻找该领域的媒体专业人士。班德拉分子在这方面做得很好，所以社交媒体充斥着虚假信息”（XakNet
  Team 2022）。令人惊讶的是，黑客渴望合作，而媒体对黑客的兴趣却很低。在那个动荡时期，俄罗斯社会步入新现实，大多数新闻来自乌克兰且关乎乌克兰，俄罗斯媒体资源忽视了拥有独特信息的黑客。XakNet
  继续徒劳地寻找记者数月，最终在 2022 年秋天有几位开始与 XakNet 合作。然而，他们只找到一两位记者，且这些记者显然未能对 XakNet 的发现提供分析。


  对 KillNet 组织而言，沟通至关重要，但其建立渠道的方式比其他黑客更简单。KillNet 拒绝建立 Telegram Bot，并多次强调这一做法。其受众可通过一个单独的支持频道联系他们，该频道显然属于
  KillNet 成员之一（We are KillNet 2022）。此外，团队通过 KillNet 创始人之一的账号“KillMilk”与追随者沟通，该账号回复追随者评论并发布自己的内容。


  FRWL 成员遵循 KillNet 的路径；黑客指定其个人账号之一作为支持服务。在其准则中，FRWL 阐明了该支持的目的，范围涵盖内容建议、未来攻击目标、FRWL
  会员申请和技术援助（FRWL 2022）。他们通过建立的支持渠道收到的回复显著且意外。FRWL 管理员惊呼：


  > 发布我们的支持渠道 10 分钟后，我们收到无数提供所需帮助的消息和大量感谢信。此外，我们的战士联系了我们并向我们表示赞赏！他们感谢我们上次对乌克兰交通基础设施的攻击；我们当时不知道，但我们扰乱了……扎波罗热地区的军事后勤！我们很兴奋！（FRWL
  2022）




  显然，FRWL 组织并未意识到该支持账号会对其品牌产生何种影响，这反而促进了其与追随者之间建立开放、直接的沟通。许多黑客品牌是在实践中学会了有效的营销方法。


  对于女性黑客组织“Beregini”而言，管理多种不同的沟通渠道已成为不可或缺的日常工作。针对不愿使用 Telegram 即时消息的个人，Beregini 提供了加密的
  Proton 邮箱；而其他追随者则可通过其在 Telegram 上的关联账号联系该组织。该组织利用开放的沟通渠道，不仅用于接收线索、媒体联络或与其他组织合作，还用于与潜在间谍沟通，后者意图泄露情报。战争伊始，Beregini
  就在乌克兰军队中积极推广其沟通渠道。事实上，在战争爆发当天，它发布了一条激励乌克兰士兵投降的消息：


  > 我们呼吁士兵和军官……如果你们不想重蹈那些无视我们先前提议者的覆辙^1，你们有机会放下武器投降。Beregini 将把你们的信息转交给主管部门。如需联系我们，可通过
  Telegram 账号和邮箱。我们将讨论你们投降的条件……我们了解你们所有人。我们知道你们的地址。我们知道你们的亲属。投降吧！（Beregini 2022）


  该组织提到其与俄罗斯军方精英有特殊联系，后者决定俄罗斯针对乌克兰目标的打击行动。此外，如果他们能在收到乌克兰士兵回复后立即向军方领导层发送报告，其与俄罗斯军方的联系将令人印象深刻。基于这些联系，该组织不能被简单视为“自由职业者”或利他主义爱好者的松散组合。


  战争爆发后，许多黑客收到了来自各方通讯者持续不断的邮件和消息，主要来自支持者，他们向组织提供各种协助和帮助。Beregini 团队也强调了这一相同趋势，该团队不仅对乌克兰数字实体实施黑客攻击，还披露了所谓间谍或支持者发送的文件。Joker
  DPR 渠道则强调了他们与间谍的合作，后者为金钱或特定利益泄露情报。


  2022 年 8 月 18 日，Beregini 发起了一项新的搜寻行动，旨在获取乌克兰前线作战局势的关键情报（Beregini 2022）。据称，许多乌克兰士兵提供了关于人员伤亡、士气环境、腐败及其军队其他不利事实的信息。尽管
  Beregini 在寻找来自战场的最新情报，但俄军已开始从乌克兰领土撤退。为了激励来自“乌克兰安全局（SBU）”、“国民警卫队”、“政客”及其他相关人员的潜在间谍，黑客们承诺提供“安全的通讯手段”、保护“间谍身份”以及在“自由乌克兰”未来的声誉管控。为此次活动，一个名为“Tell
  to Beregini”的新机器人和一个邮箱被建立并在 Telegram 上公开（Beregini 2022）。为启动此次搜寻，Beregini 宣布其目标为旅长维克托·霍连科（Viktor
  Khorenko）准将及其家庭成员。


  专注于收集和存储个人信息，RaHDIt 的“Nemesis”项目设立了一个单独的 Telegram 账号处理通讯事务。部分乌克兰武装人员数据是通过黑客手段获取的，而另一些信息则来自了解目标人物的个人。例如，2022
  年 6 月 4 日，Nemesis 团队对一名提供俄罗斯公民尤里·斯卡奇科夫（Yuriy Skachkov）信息的追随者表示感谢（Nemesis 2022）。5
  月，Facebook 用户将“SS Bear”部队指挥官的个人资料链接发送给 Nemesis，后者将其添加到了其网站数据库中（Nemesis 2022）。


  增强社区参与度的另一种方式是通过聊天室、评论和表情符号反应，这些方式促进了品牌传播，并允许监控追随者与品牌的连接度。XakNet、People’s Cyber
  Army、KillNet 和 NoName057(16) 等组织在拥有主渠道的基础上，还开设了聊天室。此处提到的七个黑客组织倾向于让追随者在每条帖子下发表评论。XakNet
  和 NoName057(16) 聊天室的主要目标是促进社区相关讨论并聚集志同道合者。在这些聊天室中，追随者讨论的话题广泛，涵盖黑客事件、黑客个人生活、俄罗斯政治以及核战争的可能性。NoName057(16)、KillNet
  和 XakNet 的聊天室版主通过发布相关内容来维系社区讨论。版主们尽职尽责，但不如组织追随者那般活跃。为维护组织议程，版主不仅筛除不可接受的用户生成内容，还鼓励他人保持警惕并自我约束，通过标记不当评论进行自我管理。此外，考虑到组织的特殊性及其政治处境，黑客版主会严格审查聊天参与者。例如，NoName057(16)
  团队警告聊天访客在该聊天室内交流时保持警惕，因为其版主在每次例行检查中都会发现许多对手（NoName057(16) 2022）。


  黑客组织 People’s Cyber Army 不接受其聊天室内的无关闲聊，强调“此交流空间不是给家庭主妇的”（People’s Cyber Army 2022）。其参与者若讨论政治问题，将面临被踢出聊天室的风险。


  People’s Cyber Army 组织主要实施 DDoS 攻击，其建立聊天室是为希望按照组织指导和时间框架实施网络攻击的追随者服务。因此，聊天空间被用于协调攻击，成员可在此提问并获得所需协助（People’s
  Cyber Army 2022）。在管理聊天讨论串时，黑客采取了极其严格的成员准入机制。这一机制源于一次不良经历：该组织刚在 Telegram 上出现不久，亲乌克兰用户便阻断了其运营，迫使团队迁移至另一渠道。为强化管控，People’s
  Cyber Army 开始筛选追随者，想要加入聊天室的潜在成员必须向机器人发送消息以获批准。作为额外安全措施，自 2022 年 7 月起，聊天记录每三天删除一次（People’s
  Cyber Army 2022）。显然，该组织在管理聊天参与者方面遇到严重问题，有人泄露内部聊天信息，并试图攻击其他目标，无视组织既定目标。


  截至 2022 年 12 月 18 日，XakNet 聊天渠道聚集了超过 22,000 名用户。其版主实施了以下聊天规则：禁止语音消息、诽谤性标签、攻击种族的评论、贴纸或表情符号刷屏、广告，以及展示尸体照片或链接的资源（XakNet
  Team 2022）。从内容串来看，XakNet 团队并未实施严厉的内容审核，聊天室包含大量与 XakNet 品牌理念无关的无意义评论。然而，聊天室中没有亲乌克兰言论，表明管理员会每日清理聊天室。此外，自
  12 月 25 日起，每位用户要想获批成为聊天成员，必须回答以下问题：克里米亚属于哪里？若在 30 秒内未选择正确答案，潜在用户将被自动拒绝加入。




  黑客组织允许在帖子下使用表情符号作为反应。这是一种让品牌传播更生动、更形象化的有效方式。值得注意的是，黑客帖子下绝大多数表情符号反应都是积极的，而消极反应虽然反复出现，但比例很小。


  如前所述，有七个黑客品牌开放了其渠道内容供评论。只有两个例外——Joker DPR 和 People’s Cyber Army 频道，它们的团队有意屏蔽了帖子下的评论功能。有趣的是，Beregini
  允许其追随者留言，但其品牌对话更像是一场品牌独白，追随者选择象征性的表情符号反应，而不是发表评论。其他品牌——KillNet、FRWL、XakNet、Nemesis、Anonymous
  Russia 和 NoName057(16) 则鼓励追随者评论，且它们的团队经常给予回复。为了让品牌更人性化并凸显其真实性，KillNet 和 FRWL 参与在线讨论并倾听追随者的声音。例如，通过参与交谈，KillNet
  版主管理其内容，屏蔽或训斥恶意评论者。


  每个黑客组织利用品牌传播和与成员通信的程度各不相同。最流行且最省力的沟通方式是表情符号反应，而聊天室并不流行。管理讨论线程和成员需要大量时间和持续关注。尽管如此，聊天室及其规则有助于传达黑客品牌议程的含义。在聊天室中定制对话使黑客能够找到忠诚的活跃用户，他们将帮助组织实施网络攻击。此外，他们还建立并公开了群组邮箱、机器人、单独的
  Telegram 账号和网站。正如黑客所述，这些通信渠道因大量涌入的通信而不堪重负。此外，开放的品牌传播可能导致各种变化，包括意想不到的变化。首先，聚集在 Telegram
  上的黑客组织寻求来自更有经验的 IT 专家的专业联系或指导。其次，一些追随者不理解黑客议程，并出于个人原因要求他们入侵俄罗斯境内的俄罗斯公民。尽管如此，黑客们意识到了品牌传播的重要性及其利弊。他们学会了应对崇拜者、其他黑客实体、媒体和对手的方法。


  ##### 调查与提问


  增加追随者数量从而提高社交媒体参与度的另一种方式是提问和进行调查。帖子的质量在这方面起着至关重要的作用。品牌需要创建相关、引人入胜且有趣的问题，以激发受众发表评论或参与调查。确实，美妆博主可能会让受众对比两款面部爽肤水；然而，黑客的“产品”截然不同。通过提问，黑客组织必须在不失去与追随者玩味互动方式的前提下，融入其特定议题。提问不仅有助于凸显黑客关心受众的意见，还能通过展示其技能和能力来取悦追随者。同时，带有激励和启发性重点的精心设计的问题有助于为追随者提供深度，让他们对组织的信仰、思想和行动有更深刻的见解。提问不仅有助于加强品牌与受众的沟通，还能鼓励受众内部的对话。


  在俄罗斯黑客组织中，顽皮的 KillNet 团队成为了提问策略中无可匹敌的领跑者。2022 年 7 月 8 日，该组织声称对立陶宛电力和天然气配送公司“Energijos
  Skirstymo Operatorius AB”（ESO）发动了拒绝服务攻击（RIA News 2022）。这次袭击是在立陶宛政府于 2022 年 6 月 18
  日决定停止过境受制裁产品前往俄罗斯加里宁格勒州后，针对立陶宛网站的众多网络攻击之一。俄罗斯官员向立陶宛当局表达了强烈不满，后者拒绝承认违反过境协议，强调立陶宛必须遵守欧盟法规。鉴于政治僵局，KillNet
  黑客将立陶宛国家视为合法目标，并入侵了私营和政府数字实体。


  随着 ESO 网站及其关联数字实体停止响应，黑客制作了攻击的视频证据。为庆祝成功，KillNet 团队联系其受众：“Hello! . . . You should
  buy beer”（We are KillNet 2022）。此外，当 Ria.ru 新闻门户网站出现关于此次攻击的新报道，消息开始在俄语互联网中传播时，KillNet
  感到兴奋不已。于是，该团队决定询问是否有俄罗斯主播潜入了 KillNet 渠道。20 分钟内，关于成功攻击的帖子链以一条极其顽皮的条目结束：“Who is from
  Vilnius here? There is a need to piss on The Seimas of Lithuania and record it.
  The reward is 0.2 BTC”（We are KillNet 2022）。尽管这些帖子是在夜间发布的，KillNet 组织通过在其频道提出引起共鸣且有趣的问题，刺激了与受众的互动：帖子获得了
  2,000 到 3,200 个赞。


  然而，传达议程和与追随者互动既可以是严肃的，也可以是玩味的。7 月底，随着加里宁格勒地区的过境问题得到解决，KillNet 重新对波兰发动攻击。在针对波兰数字实体发起大规模攻击时，该组织声明：


  > Nowadays, we cannot make posts because our attacks will be in vain. Also, we are
  not going to pick our goals; we will attack every possible target. So, DDoS will
  strike on the healthcare system, including intensive care facilities . . . They
  have to think before delivering weapons to Ukraine. They want to see many Russian
  deaths!? After you . . . (We are KillNet 2022)


  第二天，关于针对重症监护设施的网络攻击的报道发布了，尽管没有附带截图或视频记录（We are KillNet 2022）。由于缺乏惯常的证据，攻击可能从未发动或未成功。然而，KillNet
  追随者并未质疑该组织的声誉。聊天参与者大多理所当然地认为袭击成功，并热烈表达负面看法。根据大多数聊天成员的说法，攻击不应杀害平民，尤其是儿童；聊天成员坚持认为任何医疗机构都不应成为黑客的目标（We
  are KillNet 2022）。KillNet 的反应是即时且强硬的：


  > Do not condemn these ways to fight against Russophobia . . . If someone does not
  like our methods, sign out of our channel. Your comments do not have an impact on
  our actions. We work for the glory of Russia, rather than for you (we are talking
  about the individuals who criticize us). And our posts are a declaration about actions
  we have conducted (some of our actions). (We are KillNet 2022)


  追随者认为，在持续战争的背景下，这一解释是充分的。尽管第一条帖子收到了许多谴责评论，但 KillNet 的解释帖子获得了大量点赞和评论。于是，满意的 KillNet
  团队决定与追随者的冲突已解决，转而以波兰警察局为下一个目标。KillNet 组织甚至从负面名声中获益，因为其渠道的社交媒体参与度是平时的两倍，战争贬低了道德价值观。负面名声也是名声，这一事实通过统计数据得到证明，显示
  KillNet 的成员在 2022 年 7 月扩展到 4,000 多人（TGStat 2022）。





  为了增加社区参与度并了解受众情况，FRWL 组织于 2022 年 7 月 4 日发起了一项调查（FRWL 2022）。该调查包含九个问题，旨在确定 FRWL 追随者的身份。所有参与者均被要求选择一项答案。截至
  2022 年 12 月，该帖浏览量超过 2,500 次，但仅有 803 人参与了调查（FRWL 2022）。根据调查结果，55% 的受访者选择了以下答案：“我是一名热爱俄罗斯并支持黑客活动家的普通公民”，约
  30% 的人承认他们学到了新信息并为黑客的成功感到高兴。值得注意的是，FRWL 受众中不属于黑客组织的 IT 专家约占 15%（FRWL 2022）。在评论区，一些追随者提到他们的社会或职业群体未包含在调查选项中。这些人员包括一名军职人员、一名护士、一名数学教师、一名薪资专员和一名退休人员（FRWL
  2022）。FRWL 聊天管理员对每条评论都给予了礼貌且个性化的回复。


  黑客品牌的公开亮相结合政治势头，塑造了公众对黑客及其活动的看法。2022 年 8 月 4 日，FRWL 提出了一个简单但极具意义的问题：“黑客与普通人有何不同？”（FRWL
  2022）。总体而言，参与者强调了由于战争展开和乌克兰局势恶化，"黑客"一词含义正在发生显著的当前蜕变。获赞最多的评论指出：“如今，俄罗斯黑客是光明战士，对抗网络邪恶。他是我们祖国的捍卫者！他是一名志愿者，决定为我们而战”（FRWL
  2022）。此外，该评论作者表达了希望亲俄黑客能联合组建“俄罗斯网络军”，对敌人发动果断而强大的网络攻势（FRWL 2022）。在 FRWL 受众眼中，黑客被描述为“热爱俄罗斯的好人”、“独特的人类”以及“非常聪明勇敢的
  IT 专家”。作为爱国战士的密集品牌定位对俄语受众产生了重大影响。活跃的 Telegram 用户开始修正他们对黑客原本负面和恐惧的看法：这些描述的内涵积极且富有情感。


  亲俄黑客在发布鼓舞人心的内容时，喜欢提问受众关于未来攻击目标的问题。通常这类问题能引起极大关注并获得大量评论，公众在其中分享猜测和线索。在对乌克兰政府设施实施数次攻击后，XakNet
  组织将目标转向私营实体。2022 年 5 月 5 日，其频道发起一项调查，询问哪个“乌克兰寡头企业”将成为 XakNet 的下一个目标（XakNet Team
  2022）。每位追随者需从福布斯榜单上的十位著名富商中选择一位：Rinat Akhmetov、Victor Pinchuk、Kostyantyn Zhevago、Ihor
  Kolomoisky、Gennadiy Bogolyubov、Aleksander Geregi、Petro Poroshenko、Vadym Novynskyi、Oleksandr
  Yaroslavskyi 和 Yuriy Kosiuk。调查参与总人数为 8,669 人，其中 3,368 名追随者（39%）选择了 Ihor Kolomoisky，2,365
  名追随者（27%）投票给前乌克兰总统 Poroshenko（XakNet Team 2022）。Rinat Akhmetov 以 2,263 票（26%）位居第三（XakNet
  Team 2022）。XakNet 聊天区因涌入大量评论者而异常活跃。有人建议改攻击乌克兰记者 Dmitry Gordon；也有人提议攻击担任乌克兰总统办公室顾问的
  Oleksii Arestovych（XakNet Team 2022）。


  尽管 Ihor Kolomoisky 获得最高票数，但 2022 年 6 月 28 日，XakNet 宣布成功攻入 Rinat Akhmetov 旗下的 DTEK
  集团^[2]（XakNet Team 2022）。在该帖子的评论中，有追随者对调查目的表示担忧，因为主要目标本应是 Kolomoisky。尽管如此，聊天区的整体态度依然积极，弱化了负面评论的影响。


  据 XakNet 称，其黑客曾进入并潜伏在 DTEK 集团分支机构一段时间。在一份将此次攻击称为“道德黑客行为”的声明中，黑客宣称：


  > 我们没有接管控制权。我们没有加密数据和备份。我们没有干扰发电厂运行。我们没有瘫痪他们的工作。我们只是监视你们，以展示我们的渗透能力……我们不是恐怖分子或罪犯。我们不想从你们这里得到任何东西。（XakNet
  Team 2022）


  此外，黑客组织承诺移交所有后门并修复黑客行为造成的任何损害，但提出了一个条件：“Rinat Akhmetov 应发表声明，包含‘荣耀属于俄罗斯’和‘阿赫马德万岁！’等措辞”^[3]（XakNet
  Team 2022）。为证明攻击属实，XakNet 在其 Telegram 频道发布了数份包含 DTEK 信息的文件。黑客期望在一周内满足其条件，否则威胁将后门公开发布到互联网。作为回应，2022
  年 7 月 1 日，DTEK 集团发布声明，指责俄罗斯联邦应对黑客攻击负责。声明总结称，敌人试图：


  > 破坏发电和配电工艺流程，削弱乌克兰能源安全，并通过国家宣传散布关于企业运作的虚假信息，结果导致乌克兰消费者断电。（DTEK 2022）


  此外，DTEK 声明强调了该网络攻击与第聂伯罗彼得罗夫斯克州导弹袭击的同步性，特别是 2022 年 6 月 28 日对克里维里赫热电厂区域的袭击（DTEK 2022;
  TCH 2022）。XakNet 的最后通牒被无视，该组织未再提及此事，而且自 7 月 18 日起，XakNet Telegram 频道一直处于不活跃状态。该组织直到
  2022 年 9 月才重新出现。


  为了激发社区参与，NoName057(16) 于 2022 年 9 月采用了调查做法。在发布关于 DDoS 攻击下一个目标国家的问题后，团队因获得追随者的巨大回应而备受鼓舞。10
  月期间，NoName057(16) 追随者针对同一问题回答了五次。显著的参与度或许可归因于提问时间：10 月黑客在周末发布问题。相比之下，11 月发布模式不同，问题出现在工作日。结果，帖子获得的评论和表情符号反应数量较少。分析评论发现，追随者倾向于根据俄罗斯新闻头条中的热度选择目标国家。2022
  年 11 月 3 日，俄罗斯媒体传播消息称捷克议会将俄罗斯联邦指定为恐怖主义国家赞助者（Ura News 2022; RIA 2022）。两天后，NoName057(16)
  组织询问受众想攻击哪个国家。在波兰、美国、英国等传统目标之外，追随者点名了捷克共和国。





  2022 年 6 月 10 日，弗拉基米尔·泽连斯基签署了一项法律，授权领土防御部队在战区开展行动（乌克兰最高拉达 2022）。针对这一法律倡议，几天后，“FRWL”组织的成员——他们显然从乌克兰政府机构窃取了一些文件——决定询问其追随者是否批准泄露加入领土防御部队的乌克兰战士的姓名（FRWL
  2022）。在这份提议中，FRWL 声称，该法律颁布后，领土防御战士成为了黑客的合法目标和敌人。毫不意外的是，97% 的受访者要求推进这一举措（FRWL 2022）。2022
  年 6 月 24 日，数页包含日托米尔州乌克兰战士全名和家庭住址的信息出现在 FRWL 的发布渠道上（FRWL 2022）。据黑客称，FRWL 掌握更多信息，但决定暂时保留（FRWL
  2022）。


  主要而言，调查和提问帖子与黑客活动相关。然而，这不一定总是一种固定模式。事实上，随着亲俄黑客公开露面，各路国内外记者纷纷联系他们以争取独家采访。2022 年 8
  月，“FRWL”组织请求其追随者就以下问题投票：“FRWL 是否应该接受挪威主播托马斯·弗里加德的采访”（FRWL 2022）。为了在国际层面推广其黑客品牌，该组织强调了其与这位看起来像“一位好人”的记者对话的意愿（FRWL
  2022）。六百五十六名追随者参与了此次调查，其中 70% 的受访者鼓励黑客接受采访（FRWL 2022）。并非所有 FRWL 追随者都分享该组织的热情。在这项调查下，爆发了一场讨论，追随者表达了对几个问题的深切担忧。首先，有几位严谨的用户决定对这位挪威主播进行网络搜索；挖掘出的关于托马斯·弗里加德的信息可疑，他们得出结论认为此人看起来既不严肃也不真实（FRWL
  2022）。其次，在采访过程中，黑客可能会意外泄露他们的身份和位置（FRWL 2022）。第三，在聊天中，追随者辩称这次采访将被西方主播利用，以推动针对俄罗斯联邦的虚假信息运动（FRWL
  2022）。有趣的是，支持采访的追随者的声音几乎听不见，听起来大致是这样的：“我们可以接受，但前提是由任何俄罗斯媒体代表进行”（FRWL 2022）。截至 2022
  年 12 月，FRWL 组织并未接受外国媒体的公开采访。也许，少数追随者发出的警告具有说服力，促使该组织决定不再推进采访事宜。


  对于黑客组织而言，这一策略在激发社区参与度方面非常流行且行之有效。对追随者而言，这些帖子获得的调查结果不如帖子本身重要，因为在这些帖子中，用户可以表达观点，并直接与黑客及其他关心人士交流。调查参与者并未跟进结果，要求黑客根据投票结果兑现承诺。发布调查或提出与黑客活动相关的问题，对品牌建设有效且对追随者极具吸引力，后者将自己视为黑客行动中不可或缺的一部分。从普通互联网用户的角度来看，黑客攻击是一个独特的技术过程，虽然它是非法的，但黑客通常不受惩罚，能逃脱其罪行。由于正在进行的战争为黑客的网络侵略提供了理由，这一过程的非法性在俄语追随者眼中消失了。此外，这种网络侵略被广泛视为针对那些对抗俄罗斯社会势力的网络防御。


  ##### 参与网络打击与招募新成员


  结合之前的社区参与策略，分析两种有效方法至关重要：Telegram 用户参与由黑客品牌协调发起的网络攻击，以及在与 Telegram 相关联的群体内开展招募活动。


  通常情况下，黑客发动攻击不依赖不知名个人。然而，在 2008 年俄格冲突爆发时，黑客呼吁互联网用户动员，在俄语网络空间招募志愿者参与针对格鲁吉亚网站的网络攻击（Smith
  2014）。沿用相同的操作模式，亲俄组织积极动员其 Telegram 追随者以及其他志同道合的黑客组织和独狼黑客。虽然 Joker DPR、Beregini、RaHDIt、Zarya、Anonymous
  Russia 和 FRWL 未提及利用任何外部力量，但 People’s Cyber Army（人民网络军）、NoName057(16)、KillNet 和 XakNet
  与其追随者合作。KillNet 和 XakNet 组织仅寻求过几次追随者帮助，而其他提到的组织则定期使用这一策略。有趣的是，XakNet 声称其成员曾积极参与
  2008 年针对格鲁吉亚网站的网络勒索。如果属实，他们当时可能从事编写脚本或培训 IT 新手的工作。然而，目前 XakNet 倾向于依赖自身人力资源，将与公众的外部接触降至最低。


  KillNet 积极与追随者沟通并推广品牌，但极少呼吁追随者协助即将进行的网络行动。这可以解释为：KillNet 组织建立了一个伞状品牌，主要寻求与其他黑客组织或独狼
  IT 专业人士建立长期或临时合作。因此，考虑到 KillNet 庞大的追随者数量，该团队找到了其他有效方式来维持与受众的高效关系。


  在 XakNet 入驻 Telegram 的初期，该组织收到了许多普通追随者愿意协助黑客的请求。2022 年 3 月 4 日，针对非 IT 专业人士，XakNet
  在其网站 `xaknet.team` 上创建并推出了一个特殊资源。在其 Telegram 频道中，该组织发布了以下指引：


  > 你们问如何能帮助我们。感谢这份心意！如今，人人都能帮忙！提供的页面是为那些对当前局势不漠不关心的爱好者创建的。你只需从浏览器打开它，乌克兰法西斯的在线资源将自动遭到攻击，拖慢其运行。（XakNet
  Team 2022）


  该指引强调，用户可能会感到自家浏览器变慢，但无需关闭页面；只要这个 XakNet 页面保持打开，攻击和定向的正常流量就会持续（XakNet Team 2022）。XakNet
  将该网站宣传为一个安全有效的攻击平台，鼓励访客将此资源分享给朋友。不清楚有多少人敢于使用此资源，但显然，部分 XakNet 追随者促成了乌克兰网站的瘫痪。


  2022 年 5 月 22 日和 23 日，XakNet 联合 KillNet、DDoS Service 及其志愿追随者，对乌克兰火炮控制系统“克罗皮瓦”（Kropyva，意为“荨麻”）发动了大规模网络攻击（Defence
  Express 2022）。乌克兰 IT 专家开发“克罗皮瓦”以适配平板电脑，现已被乌克兰部队广泛使用。2022 年 5 月 18 日，多家俄罗斯新闻源开始传播一篇帖子，警告俄罗斯军人不要在其设备上下载“克罗皮瓦”应用程序（Neoficialniy
  Bezsonov 2022）。曾发生几起士兵下载乌克兰软件并将其地图导入其中的案例。





  ##### 招募行动


  寻求技术援助的、来自自称卢甘斯克人民共和国（LNR）的俄罗斯军人——该组织位于克拉斯内·利曼镇附近——联系了 `XakNet` 组织。随后，`XakNet` 的内容主题帖呈现了几篇帖子，包含一段致
  `XakNet` 的视频感谢信，以及印有 `XakNet` 名称的导弹照片。通过这些帖子，该组织暗示了与乌克兰境内俄罗斯武装力量关系的新层级（`XakNet Team
  2022`）。很可能是因为俄罗斯军方关于 `Kropyva` 的呼吁，`XakNet` 自 5 月 21 日起开始招募新成员和志愿者（`XakNet Team
  2022`）。其招募活动可分为两大类：无经验人员和 IT 专家。`XakNet` 团队强调，他们寻找的是热情的志愿者，这些人不会因活动获得报酬，而是获得独特的体验：“你们在这里赚不到钱。此外，我们也不会收取你们的教育费用。你们教育的代价是：在特别军事行动进行期间，与我们团队一起为国家利益工作”（`XakNet
  Team 2022`）。第二天，`XakNet` 报告称两类申请者均有大量报名（`XakNet Team 2022`）。毫无疑问，部分新成员被选中参与了针对 `Kropyva`
  资源的攻击。


  第一次攻击发生在第二次攻击前几小时，由 `KillNet`、`XakNet` 和 `DDoS Service` 的黑客力量实施。正如一位 `XakNet` 代表在后来的采访中所说，此次攻击暴露出这些组织没有足够的资源来破坏
  `Kropyva` 的稳定。为下一次尝试，`XakNet` 购买了必不可少的设备，并很快恢复了对 `Kropyva` 在线资源及相关 Telegram 频道的攻击（`Russian
  OSTIN 2022`）。`XakNet` 通过在其 Telegram 频道发帖发起了攻击。当黑客实施其部分攻击时，`KillNet` 和 `XakNet` 频道的关注者被引导通过加入系统的请求，使
  `Kropyva` 的 Telegram 出口和电话服务过载（`Legion 2022`）。持续数小时、来自不同方向的大规模协同 DDoS 攻击导致资源耗尽。在总结性帖子中，团队声明：“来自战场的朋友们说我们的攻击成功了……我们帮助挽救了生命。知道这一点比金钱更有价值”（`XakNet
  2022`）。有趣的是，2022 年 5 月 28 日，米哈伊尔·捷普林斯基上将授予 `XakNet` 组织荣誉，表彰其协助解放克拉斯内·利曼镇（`Russian
  OSTIN 2022`）。即使对黑客自己而言，这次攻击也是一个意外的积极现实结果：他们观察到了其在线行动的真实后果。网络战能够并确实对我们的现实产生可见且关键的影响，有时甚至人命都取决于它。此后，该组织暂时停止了让关注者参与网络攻击，转而专注于与其他黑客组织合作及自身目标。


  2022 年 3 月初，`NoName057(16)` 组织在发动攻击时并未依赖 Telegram 用户。然而到了 7 月，其团队建立了“`DDosia Project`”聊天群，并开始积极与关注者建立工作联系。在该群组中，参与者相互交流，也与
  `NoName057(16)` 团队沟通。要加入该项目，每位用户需通过 `NoName057(16)` Telegram 机器人完成注册流程，该机器人为注册参与者提供工作统计数据，监控排名靠前的志愿者参与者，并允许修改个人数据。为给志愿者提供经济激励，`NoName057(16)`
  要求每位群成员建立加密钱包。黑客证实，该组织试图寻找可持续的资金来源以激励志愿者（`DDosia Project 2022`）。到 2022 年 9 月，财务状况趋于稳定，当时该组织宣布奖励其十名志愿者。获得第一、二名的个人分别应获得
  80,000 卢布（约 1,000 美元）和 50,000 卢布（710 美元）（`NoName057(16) 2022`）。排名第三的人将获得 20,000
  卢布（290 美元）存入其加密账户（`NoName057(16) 2022`）。其余七人各获得 100 美元。10 月和 11 月，`NoName057(16)`
  提供了相同数额的奖金，二十名志愿者因实施 DDoS 攻击而获得加密货币。目前不清楚黑客将延续这一做法多久，以及他们从何处获得资金支持这些志愿者。考虑到同一参与者在这几个月中获得了激励，这些月度竞赛的可靠性便成疑。


  与 `NoName057(16)` 形成对比的是，`People’s Cyber Army` 黑客带着准备好的说明和 DDoS 攻击软件包进入公众视野。3 月，他们建立了一个用于讨论正在进行和未来打击行动的聊天群，通过
  `People’s Cyber Army` 机器人邀请 Telegram 用户加入。一个有趣的细节是，群组管理员准备了目标，予以发布，并规定了打击开始的确切时间。


  显然，有机会与真正的黑客一起参与网络攻击吸引了一些 Telegram 用户。其中一些人能定期参与打击；另一些人则通过一次性参与来娱乐自己。这种网络志愿服务的真实影响无法评估，因为正如预期的那样，这些组织并未披露关于其成员和新人的信息，而实际志愿者也避免分享这一有争议的经历。


  更活跃的成员意味着更多潜在的有用志愿者，尽管他们的投入程度因人而异。在与志愿者合作的团队中，`KillNet` 拥有最大且增长最快的追随者群体，人数从 2022
  年 4 月的 39,350 跃升至 12 月的 94,288。与 `KillNet` 形成对比的是，`XakNet` 的追随者规模在 2022 年保持稳定但不算大，徘徊在
  35,000 左右。成立后不久，即 2022 年 4 月，`NoName057(16)` 和 `People’s Cyber Army` 分别吸引了 2,370
  和 5,890 人。八个月内，`NoName057(16)` 的成员数激增 150% 以上（达到 17,000 追随者），而 `People’s Cyber Army`
  的追随者数量没有显著增加，略超 7,000。两个组织都运营着仅限志愿者的封闭聊天群。无法接触 `People’s Cyber Army` 的聊天群，但到 2022
  年 12 月底，`NoName057(16)` 实体拥抱了约 10,000 人。尽管战争期间出现了同情黑客人数上升的信号，但粗略估计，准备协助黑客的铁杆追随者勉强超过
  10,000 人。


  在某种程度上，这种社区参与方式与众包模式有相似之处：初始核心群体通过数字平台提出问题，期望充满热情、志同道合的个人为解决方案做出贡献。尽管如此，可以得出结论：进入正在进行的网络战，黑客必须依靠自身能力实施打击，而非依赖
  Telegram 受众，但邀请追随者参与打击是获取 Telegram 受众和提升品牌知名度的流行方式。所有实际工作均由组织内部的 IT 专业人员在幕后完成。






  ## 社区参与与招聘活动


  ### 通过招聘活动激发社区参与


  宣布招聘活动是激发社区参与的另一种方式。对于个人招募而言，Telegram 是完美场所，黑客们在此推进品牌建设并展示其价值观与议程。考虑到黑客的品牌声誉和持续的网络战，许多申请者虽认真对待，但未必忠诚于黑客的品牌与议程。因此，假定每个黑客品牌都试图利用此法是不恰当的，因为这伴随高风险，且要求实施安全措施——而黑客通常不屑于此。


  ### KillNet 的招聘活动与组织架构演变


  KillNet 反复组织招聘活动；网络攻击数量日益增长，群体架构呈指数级扩张。同时，KillNet 自身也成为目标，急需招募新成员和支持者以发动协同攻击。2022
  年 3 月，该群体面临劳动力短缺。鉴于此，KillNet 发起调查，测试其 Telegram 追随者作为“网络战士”加入团队的意愿。该投票于 3 月 4 日发布，吸引约
  6,000 人参与（We are KillNet 2022）。88% 的参与者表示愿意提供帮助，但大多数人不具备相应能力或必要技能。12% 的人承认缺乏参与 KillNet
  攻击的动力。许多追随者列出技能，提议为推动群体发展做志愿者。例如，几位使用女性昵称的用户表达了协助并学习不可或缺 IT 技能的意愿（We are KillNet
  2022）。其他用户则担心法律起诉和网络防护问题（We are KillNet 2022）。总体而言，招聘活动成效显著，因为 3 月 9 日发布的声明称参与人数跃升至
  1,780 人（We are KillNet 2022）。


  #### 组织架构细分与人员管理


  2022 年 3 月至 6 月间，KillNet 反复发起招聘活动，寻找 IT 专业人士和拥有必备设备的同情者。2022 年 3 月 4 日，KillNet 设立三大主要分部：攻击组、技术支持组和传播组。攻击分部下辖四个单元：“Mirai”、“Jacky”、“Sakurajima”
  和 “DdosGung”（Sweet, Author’s Archive 2022）。随后，群体内部涌现新单元（例如 Zarya），而其他单元则解散或变得不活跃。每个单元均有领导者，表面上协调该单元活动。其职责或包括接受和终止个人的单元成员资格。随着群体接纳缺乏技能的新成员，建立了学习“中心”。在该板块，新成员学习
  DDoS 攻击基础（We are KillNet 2022）。为追踪媒体报道并完成其他管理职能，KillNet 启用志愿者。群体主管是否领取薪酬不得而知。至少直到
  7 月，其财务状况未定或不稳定。然而在 6 月，KillNet 领导层以承诺支付报酬为诱饵招募潜在候选人。


  #### 招聘流程与人员流动


  群体采用不同工作模式。首先，KillNet 从其 Telegram 和 Vkontakte 频道招募任何热情支持者。随后，群体收窄需求，仅接受 IT 专业人士或具有一定
  IT 经验者。候选人需向 KillNet 群体发送简历，入选者再经背景调查。正如 KillNet 帖子所反映，许多新成员在获批后自愿或被迫离开群体。显然，KillNet
  经历显著人员流动和持续劳动力短缺。


  #### 渗透事件与内部整顿


  2022 年 6 月和 7 月，因群体成为乌克兰活动家关注目标，KillNet 领导层采取措施重组人员。曾发生多次渗透尝试。据推测，一名来自哈尔科夫的新成员渗透团队，并形容
  KillNet 招聘流程原始随意，仅包含篡改其自选成员网站这一环节。为混淆视听，该渗透成员致电其客户，请求对方协助——更改网站外观。这种原始操纵被认定为合法，KillNet
  据称批准其成为团队一员（Deanon Club 2022）。该间谍嘲笑 KillNet 缺乏警惕且 IT 知识低下，在 KillNet 某据点植入恶意软件，据称许多人争相下载运行。这位哈尔科夫
  IT 专家不屑于 KillNet，强调其成员资质低劣。KillNet 未就该视频证词向在线用户做出澄清。此次事件中，KillNet 选择无视；但黑客们承认其分支机构存在乌克兰渗透者。


  2022 年 7 月初，KillNet 捕获亲乌克兰间谍，被迫暂停正在进行的招聘流程（We are KillNet 2022）。严重的攻击目标、高人员流动率、亲乌克兰间谍渗透以及缺乏可持续财务支持，导致短期内部混乱。困难周期中，黑客持续与受众沟通，承诺恢复攻击并请求他们留守品牌。作为回报，追随者未大量流失，KillNet
  受众保持稳定。结果，KillNet 品牌未受严重削弱，迅速再次扩大影响力。


  ### XakNet 的招聘策略与教育体系


  XakNet 群体内至少存在两大分部：XakNet 核心群体和志愿者。为加速分部活动，XakNet 利用其 Telegram 出口作为招聘工具，群体认为这既有益又便捷。如前所述，2022
  年 5 月，群体发起招聘活动。针对缺乏 IT 经验和教育的新成员，团队组织在线学校，由志愿者教师培训新手（XakNet Team 2022）。志愿教师单元由 IT
  专家组成，他们能以优异成绩通过 XakNet 考试。所有软件、设备及其他教学材料由 XakNet 团队免费提供。因此，XakNet 老成员不直接与新手合作或沟通。在
  XakNet 达成自身目标的同时，新成员获得并塑造 IT 技能。在寻找 IT 专业人士和其他领域热情人士时，XakNet 发布三条招聘帖，面向非 IT 人员的帖子获关注度最高。甚至居住在欧洲的俄语移民也表达协助黑客的意愿（XakNet
  Team 2022）。此外，XakNet 还招募垃圾邮件发送者、社会工程学专家以及钓鱼和 DDoS 攻击专家（XakNet Team 2022）。


  #### 组织架构扩张与 DDoS 分部遭袭


  2022 年秋季，XakNet 结构扩张，除聊天室和主渠道外，团队建立多个其他分支。据称 XakNet 与另一名为 DDoS Service 的群体合并后，DDoS
  分支开始运作（XakNet [DDoS] 2022）。该分支名为 XakNet DDoS，于 2022 年 10 月建立 Telegram 频道，但不足一个月，即成为乌克兰用户协同大规模攻击的受害者。





  随着乌克兰危机恶化和网络战持续，DDoS 活动成为亲俄黑客组织中的流行趋势。专注于其他类型打击的 XakNet 和 FRWL 组织开始涉足这一新领域（FRWL
  2022）。为组建 DDoS 团队，XakNet 发起了一项新的招募行动，从对决定加入的追随者进行调查开始。此次投票旨在确定 XakNet 追随者是否有过 DDoS
  经验。结果显示，70% 的受访者不具备实施 DDoS 攻击所需的经验，而 21% 的参与者表示仅拥有基本的 DDoS 技能（XakNet [DDoS] 2022）。仅有
  9% 的受访追随者技术娴熟，能立即加入网络攻势（XakNet [DDoS] 2022）。调查共涵盖 740 人，其中许多人可能经历了招聘的所有阶段。基于这些发现，XakNet
  列出了候选人的一般要求：年满 18 岁的支持者，“不一定具备 IT 技能”，但需具备“基础英语水平”。候选人在向组织发送必需信息时，必须提供一封求职信，其中需阐述“为何适合该职位”、“克里米亚的地位”以及他们对“俄军事行动”的立场（XakNet
  [DDoS] 2022）。此外，求职信还应包含他们的“IT 经验水平”、年龄、地址和英语水平（XakNet [DDoS] 2022）。这些有争议的要求在潜在候选人和追随者中引发了激烈讨论。例如，许多人怀疑关于克里米亚的问题是否旨在筛选亲乌克兰间谍。他们建议
  XakNet 团队修改该问题，改问赫尔松的地位。其他聊天成员则要求澄清新成员的年龄限制。


  ##### 社区互动与黑客的挫折


  正如任何希望吸引追随者并激发与受众关系的品牌建设者一样，KillNet 组织试图通过其他来源的帖子丰富其内容。鉴于黑客活动的特殊性，KillNet 的原创独特内容无法日产。因此，KillNet
  黑客在不懈地在其他俄罗斯来源中搜寻相关且有趣的新闻。


  确实，KillNet 账号发布了一条贬低俄罗斯东正教会领袖、牧首基里尔及其关于俄罗斯言论的评论。2022 年 11 月 6 日，牧首基里尔在莫斯科近郊巴拉希哈的俄罗斯近卫军主教堂举行周日布道时，警告称强大的外部势力试图破坏神圣俄罗斯（牧首新闻处
  2022）。这些势力挑战俄罗斯联邦和俄罗斯社会的生存根基。他还提到为俄罗斯土地上的和平、坚定的斯拉夫团结和兄弟情谊祈祷。


  嘲讽牧首基里尔时，KillNet 创始人 KillMilk 指出，牧首过多谈论政治，而非关注东正教信仰（We are KillNet 2022）。尽管该帖子获得许多“点赞”，但绝大多数
  KillNet 聊天参与者指出了他在这一问题上的立场不当。追随者强调 KillNet 应更仔细地聆听牧首基里尔的言论，因为黑客们未理解其言辞的意义。一些参与者高呼政教分离，强调教会官员此类言论是负面信号，政教分离原则正受攻击（KillNet
  Chat 2022）。尽管如此，这一争议性议题和 KillMilk 的评论在 KillNet 追随者中引发了热烈且富有成果的争论，这与大多数其他 KillNet
  帖子仅引来一堆无意义的感叹词和表情符号形成鲜明对比。


  与知名人士建立困难或积极的联系能为新品牌带来公众关注。2022 年 7 月，XakNet 组织便发生了此事。克谢尼娅·索布恰克关联的新闻媒体“Careful!
  News”在 Telegram 上传播消息称“亲政府的 XakNet 黑客对乌克兰电视频道 Dom 发动了进攻性网络攻击”（Careful! News 2022）。XakNet
  成员入侵了该电视频道流并上传了带有俄罗斯国旗和国歌的视频。在俄罗斯联邦，克谢尼娅·索布恰克是知名媒体人，也是 1990 年代著名俄罗斯政治家阿纳托利·索布恰克的女儿。因此，与这位重要影响者建立关联将大有裨益。XakNet
  不愿错失良机，借此发泄不满，讲述了这段经历：


  > 克谢尼娅·阿纳托利耶夫娜，你是个幸运儿，你生活在俄罗斯。若非如此，“亲政府”黑客就会查你的银行账户和财务文件……“亲政府黑客”并不真正喜欢你这种低级主播……他们试图利用政治观点将其转化为纯生意。（XakNet
  Team 2022）


  值得注意的是，还有许多其他新闻来源和主播给该组织贴上“亲政府”标签。然而，这些来源是外国的。确实，在接受彭博社采访时，美国网络安全公司 Mandiant Inc.
  的代表强调了 XakNet 与克里姆林宫的可能联系，称该组织可能与政府协调某些行动（Gillum 2022）。2022 年 10 月 26 日，以色列新闻门户在报道
  XakNet 入侵议会网站时，重申了 Mandiant 对 XakNet 团队和俄罗斯政府的看法。文章强调“此次网络攻击发生之际，以色列情报界发出警告”，称俄罗斯和伊朗黑客可能攻击该网站，且俄罗斯代表警告不要“向乌克兰提供防空系统”（Israel
  National News 2022）。在全球范围内，XakNet 监控关于其活动的文章和研究，转发并评论最有趣或最具争议的内容。例如，其媒体转发了彭博社文章，随后于
  2022 年 9 月 25 日发布了对 Mandiant 报告的评论（XakNet Team 2022）。然而，只有克谢尼娅·索布恰克媒体的新闻报道引发了强烈公众反响：获得
  1,600 多个点赞和 120 条评论。相比之下，彭博社文章报道仅获约 600 个点赞和 10 条评论（XakNet Team 2022）。总体而言，2022
  年 6 月 29 日至 9 月 11 日期间，XakNet 平均每帖获赞 789 个。此时，该组织专注于最大程度扩大受众，通过与深受 XakNet 受众熟知的克谢尼娅·索布恰克建立关联，增强了其最宝贵的资产。与外国来源（即使是彭博社等声誉良好的来源）建立关联，在品牌建设和社区互动方面的影响力均较为有限。


  ##### 黑客的预算


  社交媒体和建立网络声量耗时费力，因此社交媒体平台成为开展各类筹款任务的有用工具。与其他数字实体一样，黑客通过品牌建设和分享议程吸引大量志同道合的在线用户。这群人将成为资金捐助的基础。




  进入公共领域后，亲俄黑客组织意识到了这一机遇，但并非所有组织都加以利用。在赚钱方面，存在两个筹款目标。第一，黑客品牌需要为自身需求筹集资金。第二，他们组织或支持符合并传达黑客品牌形象的其他实体的活动。Joker
  DPR、KillNet、Anonymous Russia、XakNet 和 FRWL 偶尔发起或支持筹款行动，而 RaHDIt、NoName057(16)、Beregini、Zarya
  和 People’s Cyber Army 未参与此类活动。具体而言，三个黑客组织——Joker DPR、KillNet 和 Anonymous Russia——筹集资金以刺激其进一步发展（购买设备、支付账单）。XakNet、FRWL
  和 KillNet 则呼吁追随者向军事或民用必需品捐款。


  黑客组织将自己包装为爱国且非营利性质，坚称其网络攻击是出于政治动机，由当前地缘政治局势所决定。尽管如此，有几个组织抱怨其支持渠道被大量信息耗尽，其中 Telegram
  用户请求黑客提供非法服务并承诺丰厚报酬。例如，为深化黑客行动主义理念，XakNet 团队反复阐述其非营利原则。连同 FRWL，XakNet 拒绝接受捐赠、出售频道广告位以及开展个人营利性黑客服务（FRWL
  2022；XakNet Team 2022）。要做到爱国、非营利且拥有高技术能力，黑客组织需要大量资金援助。确实，XakNet 和 FRWL 强调其成员拥有高薪职位。例如，自
  2022 年春季以来，XakNet 与在顿巴斯地区工作的军事媒体主播保持密切联系。9 月，黑客宣布直接向该单位提供个人支持，转账 200,000 卢布（约合 2,700
  美元）（XakNet Team 2022）。在俄罗斯，能负担得起这种慷慨捐赠的人不多。显然，黑客利用休息日和假期发动网络攻击。People’s Cyber Army、RaHDIt、NoName057(16)、Beregini，或许还有
  Joker DPR 等其他亲俄组织的成员也可能存在这种情况。


  相比之下，KillNet 及其关联组织 Anonymous Russia 似乎依赖捐赠、销售品牌商品和外部随机资金来源。自出现以来，KillNet 通过以下加密货币向追随者募集资金：Bitcoin、USDT
  TRC20、Monero、Ethereum 和 Tether。此外，KillNet 还通过 TON 账户^(4) 募集捐款，该账户于 2022 年 9 月开设。然而，2022
  年 9 月 25 日，Telegram 审核员因违反 Telegram 规则封禁了 KillNet 账户（We are KillNet 2022）。根据 Telegram
  说明，其渠道包含违禁信息，导致 150,000 卢布（近 2,000 美元）无法提取。愤怒的组织通知追随者账户出现问题。为避免不良后果，部分聊天参与者决定向 KillNet
  的其他加密货币钱包捐款。许多用户认为 Telegram 审核背后有政治考量，而非单纯违反用户政策。鉴于黑客此后未再提及此事，显然问题已解决，KillNet 继续通过
  Telegram 募集捐款。


  通过媒体监测，该组织试图维护其声誉，这与组织财务状况直接相关。2022 年 4 月，部分媒体将 KillNet 描述为政府倡议，获得国家预算拨款（We are
  KillNet 2022）。对此，KillNet 发布情绪化帖子予以驳斥，否认是政府创建或受政府控制。为证明其非政府地位，KillNet 强调其财务独立性，称成员被迫贷款维持组织运转（We
  are KillNet 2022）。2022 年 12 月 10 日，美国政府拨款近 110 亿美元用于防御网络攻击的消息传入俄罗斯网络空间（Statista.com
  2022）。KillNet 团队满怀苦涩地评论道：“在俄罗斯，爱国黑客不受政府重视，被迫自筹资金攻击欧洲。窃取和贩卖情报会导致入狱”（We are KillNet
  2022）。事实上，该组织承认成员不仅贷款，还积极从事非法活动以筹集资金用于政治动机的攻击。KillNet 并非孤例。2022 年 12 月，XakNet 公开设立在线拍卖，出售对乌克兰政府某部门的访问权限（XakNet
  2022）。声明称拍卖目的是慈善，所得款项将转给战乱地区的“有需要的人”。为潜在买家，黑客阐明了一些关键信息：


  > 我们拥有乌克兰各类国家设施的访问权限。我们准备出售此权限。你们会喜欢的！它将超越我们之前的两个目标——财政部和外交部。你们如何管理访问权限由你们决定。你们可以加密，也可以保持开放（我们可以提供文件连同访问权限，尽管我们需要几周时间——肯定要）。如果你们想声称完成了这次黑客攻击，我们不介意；如果发现秘密信息，你们可以勒索相关个人。随你们怎么做。该目标的权利完全归你们，我们的黑客不会泄露与此目标相关的任何信息。如果你们想让我们发布所有从中下载的文件，我们也可以做到。（XakNet
  2022）


  该拍卖品起拍价 27,000 美元，一口价约 81,000 美元（XakNet 2022）。很快，拍卖品迎来首位竞标者，出价略高于起拍价。


  KillNet 在许多方面都是独特的黑客品牌。它是唯一发起销售品牌产品的黑客团队，承诺将部分利润转给俄罗斯士兵（We are KillNet 2022）。为扩大品牌知名度，该黑客组织通过互联网销售纯银首饰。首饰由一位拥有网站和
  Vkontakte 账号的俄罗斯珠宝商制作（HooliganZ 2022）。有两款印有 KillNet 名称的商品：一枚戒指和一对耳环。购买 KillNet 纪念品的支持者人数未知。鉴于购买
  KillNet 首饰的客户未在社交媒体晒出购买产品照片，考虑到高昂价格，人们购买这些商品的兴趣不大。确实，印有 KillNet 标志的戒指售价约 250 美元，耳环售价
  95 美元（HooliganZ 2022）。


  正如许多其他组织一样，KillNet 从未披露其财务运作细节；未报告过收到或支出捐款的情况。然而，一些财务提议有助于估算其大致财务基础。3 月，KillNet
  为在乌克兰摧毁班德拉纪念碑提议约 3,000 美元报酬（We are KillNet 2022）。领取款项需提供行动视频证据（We are KillNet 2022）。尽管报酬丰厚，KillNet
  追随者未满足要求。组织保留了这笔钱，此后避免类似行动。因此，至少最初 KillNet 管理层拥有资金储备用于组织运作和随机资助追随者。然而，储备终将耗尽。开展黑客活动需要稳定收入来源，否则可能面临解散。对
  KillNet 而言，局势在 2022 年秋季发生剧变。




  2022 年 9 月 27 日，KillNet 创始人 KillMilk 公开向 KillNet 受众表达了不满（We are KillNet 2022）。显然，他的挫败感源于
  Telegram 封锁了 KillNet 拥有 2000 多美元的加密货币账户。在为俄罗斯联邦而战的过程中，他遭遇了俄罗斯商人缺乏持续的资金支持，以及政府官员缺乏行政支持。随着
  KillNet 团体从一个小型非法 DDoS 业务发展而来（该业务在战争初期被关闭），KillMilk 动用了个人积蓄和贷款为 KillNet 的活动提供资金。此外，其他人（显然是他的亲密朋友和家人）也向他提供了资金：“我搁置了我的暗网活动，开始保卫祖国！感谢几位在网络战中帮助我的人；我非常感激他们的资助！然而，无论是政府官员还是商人都没有表示赞赏！他们根本不在乎！”（We
  are KillNet 2022）。KillMilk 强调全世界都在帮助乌克兰，质问商业精英和官员在这场战争中到底帮了谁。此外，他还解释了向 Telegram
  粉丝募捐在道德上有多么困难，并描述了组织筹款活动的艰辛：


  > 我七次三番克服自我，在粉丝中宣布筹款活动！然而，俄罗斯银行封锁了我所有的账户，随后 Telegram 也对我做了同样的事:) 为什么？因为我与我们的敌人作战？……不公平的待遇……请引以为戒。（We
  are KillNet 2022）


  声明最后，KillMilk 鼓励“资本家”和政府雇员向 KillNet 团体捐款。


  通常情况下，粉丝会跳过捐款信息和链接，但这次情况非同寻常，粉丝们成群结队地做出了反应。该声明浏览量超过 60,000 次，获得了约 5,500 个“点赞”、“分享”和评论（We
  are KillNet 2022）。与 KillMilk 声明引发的强烈反响不同，2022 年 11 月《Gazeta.ru》对 KillNet 关联团体“Zarya”领导人的采访，仅获得了
  2,000 个点赞和 18 条评论（We are KillNet 2022）。显然，这种情感充沛且高度个性化的声明，被证明是与品牌粉丝建立联系、提升品牌知名度的绝佳方式，且无需对政治对手发动黑客攻击。


  无法确定这番愤懑的声明是否带来了任何捐款。然而，KillNet 聊天室的访客积极讨论汇款方式。在 KillNet 聊天室中，绝大多数参与者表示无法通过加密货币服务转账；一些人强调他们没有账户，而拥有加密货币账户的其他参与者则抱怨缺乏转账知识。这两类人都请求
  KillNet 提供详细指南。其他人则承诺，如果 KillNet 提供 Sberbank 银行卡（一种广泛使用的支付系统），他们就会捐款。


  KillNet 的追随者明白，该帖子的内容不是另一个编造的故事，而是真实的，且符合俄罗斯社会公众对政治局势的认知。鉴于俄罗斯军队在乌克兰持续失利，网络空间充斥着各种谣言和猜测，将军队撤退归咎于政府官员的背叛。尽管普京支持率高企，但俄罗斯社会对地方官僚及其糟糕表现缺乏信任，且不愿改变看法。


  毫不奇怪，KillNet 受众支持 KillMilk。虽然聊天参与者得出结论认为 KillNet 团体实际上只有一个人，但他们同意以下评论：


  > 天哪，KillMilk 说得对！寡头们脑子里装的都是垃圾？！他们挥霍巨资在毒品和妓女身上，却不愿为那些作为我们唯一网络防线的人提供资金。这太糟糕了。（KillNet
  Chat 2022）


  针对 KillMilk 的担忧，用户“Stishka”发表了一条激励性评论，获得了大量“点赞”：


  > 我亲爱的 KillMilk 和 KillNet。我会把我所有的钱都转给你们。然而，我是一名家庭主妇。我和丈夫在服务业工作……我们努力生存，抚养两个孩子（两个儿子）。我希望他们成为好公民，所以我给他们讲
  KillNet、它的行动，以及你们对俄罗斯的奉献和热爱。如果你们放弃，我们就完了！我确信我的 500 卢布无法帮你们购买所需设备或其他任何东西。但我担心你们会放弃，回到以前有利可图的活动中去。坚强点！我相信你们的团体很快会获得认可！（KillNet
  Chat 2022）


  通过聊天，许多参与者表达了相同的担忧：担心 KillMilk 因无法解决财务困境而解散 KillNet。一些脑洞大开的参建议他向瓦格纳军事集团创始人叶夫根尼·普里戈任寻求资金。^(5)


  为了培养社区并加强 KillNet 品牌与追随者之间的联系，几小时后，其创始人发布了一条关于诈骗风险的警告。试图利用 KillMilk 声明的 Telegram
  用户建立了包含 KillNet 名称的虚假账户。通过这些账户，KillNet 追随者开始收到请求协助交易的消息，进而被索要个人财务信息（信用卡号、姓名等）。黑客们识破了骗子并警告受众：“我们不通过私信沟通。这是诈骗！”（We
  are KillNet 2022）。


  第二天，KillNet 团体用一条积极的消息让追随者感到惊讶，黑客们向人们保证他们继续代表俄罗斯作战（We are KillNet 2022）。对收到的捐款表示感谢，团体表示已达到目标。2022
  年 9 月 29 日，KillMilk 购买并安装了必不可少的设备（We are KillNet 2022）。作为回报，支持者们对前一天捐款的金额感到好奇。然而，KillNet
  没有回应他们，也没有发布任何关于筹款结果的评论。如前所述，为了寻找解决财务困境的决定性方案，KillNet 利用了各种选项：出售被黑数据和品牌周边，并定期在追随者中开展筹款活动。


  KillNet 很少在暗网出售被黑数据，因为它建立了筹款活动。11 月，KillNet 与 Deanon Club 合作，黑入了俄罗斯最大的在线毒品交易平台之一——BlackSprut。11
  月 28 日，应大量警方请求，KillNet 发布了约 2,000 名客户和贩毒者的姓名，导致俄罗斯联邦至少六个地区遭到警方突击搜查（KillMilk 2022）。随后，黑客宣布在线出售该平台数据：虚拟毒品店售价
  10,000 美元；1,000 人的个人数据售价 50,000 美元；Telegram 上一串关联账号售价 3,000 至 150,000 美元，包括活跃账户在内的收款站起价
  8,000 美元（KillMilk 2022）。据 KillNet 称，最有价值的信息是平台所有者和管理层的个人数据，估价 100 万美元（KillMilk 2022）。KillNet
  和 Deanon Club 总共收集的金额未知，但他们收到了几位俄罗斯买家非常慷慨的报价。尽管 KillNet 主动将数据移交警方，但 Deanon Club
  团体反对这一想法，倾向于更务实的方法：俄罗斯执法机构仅获得了极小部分信息。





  ## 亲俄黑客组织的筹款与品牌建设


  尽管面临持续的财务困境，KillNet 仍支持并发起了为其他团体筹集资金的活动。其慈善活动始于 2022 年 3 月，当时 KillNet 支持为俄罗斯志愿者
  Elena Labutina 募集资金（We are KillNet 2022）。目前不清楚 KillNet 成员是否提供了资金或其他形式的帮助。次月，KillNet
  发起募捐，为在乌克兰作战的某俄罗斯部队购买军装和军事装备（We are KillNet 2022）。2022 年 12 月，KillNet 账号上发起了另一项筹款活动（We
  are KillNet 2022），旨在为俄罗斯联邦的孤儿募集捐款。许多追随者被 KillNet 的主动行动所感动，决定支持此次募捐，向 KillNet 关联的
  QIWI^(6)、Sberbank、Tinkoff 账户及加密货币钱包转账。KillNet 黑客从其预算中拨出 20,000 欧元捐赠给孤儿；显然，这笔资金来自出售
  BlackSprut 数据的收益（We are KillNet 2022）。为增强社区参与度，KillNet 管理员请求受众提供俄罗斯联邦各地孤儿院的地址、网站和电话号码。


  Joker DPR 偶尔会请求捐款，声称是为其特工筹集资金；而与 KillNet 有关联的“Anonymous Russia”则发布了一系列直接消息，大力推动特定的筹款目标。Anonymous
  Russia 强调其独立性，试图激励受众，写道：


  > 我们是一个非政府组织，俄罗斯联邦总统不为我们的活动买单。尊敬的官员和商人们，你们和我们一样生活在俄罗斯。请不要忘记我们。我们需要资金来支持我们的使命。（Anonymous
  Russia 2022）


  与 KillNet 和 XakNet 一样，Joker DPR 和 Anonymous Russia 管理着多个加密货币账户，如 Monero、Bitcoin、Tether
  等（Joker DPR 2022）。此外，Anonymous 的追随者还可向其 QIWI 页面存款。


  因此，亲俄黑客广泛依赖加密货币，极少数情况下使用 Sberbank、Tinkoff 和 QIWI。有几个团体完全未参与筹款活动，既不参与也不支持为其他黑客团体或志愿者的筹款倡议——至少它们未公开宣传参与情况。显然，一些团体自给自足；另一些则面临资金短缺。结果，黑客们积极出售被盗数据以补充团体预算。当筹款活动表述清晰、解释详尽（如为孤儿捐款或
  KillMilk 的声明）时，受众会在资金上支持黑客的筹款活动。然而，由于缺乏财务透明度，无法确定黑客的预算或追随者通过捐款向团体提供的资金数额。关于所谓的自给自足团体，其资金来源有：薪资、赞助商、政府支持、数据出售、传播勒索软件及其他传统盈利方式。令人钦佩的是，出于爱国主义，少数在正规岗位工作的黑客愿意花费薪资和业余时间从事政治动机的攻击。此外，黑客可能有赞助商。最有可能的是，当地商人会为知名的社区
  IT 专家提供资金支持。这种赞助对双方都有利，尤其是在激烈的网络战期间。恶劣的经济环境迫使商人制定生存策略。抛开爱国主义不谈，许多商人会考虑打击竞争对手、收集敏感信息以便日后勒索等。持续的网络战和关于外国网络攻击俄罗斯数字实体的日常新闻，将提供完美的掩护。这种情景极具可行性。俄罗斯政府是否支持黑客无法确定。尽管如此，无论亲俄黑客是在合法公司担任常规
  IT 专家，还是长期活跃于暗网，他们都愿意出售被盗数据或利用其他阴暗手段赚钱。


  从亲俄黑客的视角来看，他们的社交媒体空间主要局限于 Telegram。Telegram 为用户提供安全性、灵活的审查机制，以及一个匿名加密的通信枢纽，用于收发消息。在此平台上，黑客团队能够制定并实施品牌建设策略，推进其象征性特征和议程。一切品牌始于名称。分析显示，俄罗斯黑客偏好具有文化、政治和专业内涵的名称。


  与受众沟通对大多数黑客组织至关重要。虽然只有七个黑客组织开放了评论功能，但每个黑客组织都允许使用表情符号，这是丰富和可视化品牌传播的有效方式。有趣的是，聊天功能在黑客团队中并不流行，他们更倾向于使用群组邮件、机器人、单独的
  Telegram 账号和网站。由于黑客的安全顾虑，与公众的沟通存在不容忽视的界限。并非所有黑客都邀请公众参与其网络攻击。少数团体在其 Telegram 追随者中开展公开招聘活动，寻找不可或缺的专业人才。尽管如此，真正的核心工作仍由高度可信、知名的团体成员在幕后完成。


