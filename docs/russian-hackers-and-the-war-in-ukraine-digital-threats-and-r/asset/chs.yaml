  # 结论


  以往，国家间的冲突总是通过各种适时的武器进行的，从大炮和弓箭到现代导弹和火器。然而，技术突破为现代地缘政治冲突增添了网络维度。俄罗斯和乌克兰之间的当前战争引发了大量网络攻击，这些攻击由国家控制和非国家的黑客组织及单位实施。乌克兰和俄罗斯的媒体门户、银行系统、政府和商业网站反复遭到破坏和瘫痪，其数据被窃取并随后出现在社交媒体或暗网市场上的可能性非常大。因为网络世界不受任何物理边界的限制，来自全球各地的黑客团队和独狼黑客积极参与了这场危机，他们被混乱的在线环境和可以逍遥法外地犯罪的潜力所吸引。他们的动机可以是纯粹意识形态和半利他主义的，也可以是极其务实和逐利的；乌克兰战争帮助许多黑客团队在以财务获利为名实施攻击时，将其真实意图隐藏在对乌克兰或俄罗斯花哨的支持背后。“网络战士”的格局是多元的，许多参与者仍隐匿在阴影中，身份未知。必须再次强调，本书仅考察了符合研究分析框架的那部分俄罗斯黑客社区。因此，鉴于在线行动者的复杂图景，双方的网络空间成为了黑客的练兵场，黑客们在那里学习新技能并大显身手。这场网络战争的后果波及数十个国家的商业和政府部门，无法保证这些黑客在获得大量实战演练后，不会决定将目标转向欧洲和美国更有利可图的靶子。不仅俄罗斯黑客团队会发动袭击，来自世界各地（包括欧盟和美国）的黑客也会如此。此外，从现在起，黑客活动家参与全球军事冲突将成为标准惯例。


  自冲突最初几个月起，对黑客狂热活动的担忧便与日俱增。2022 年 5 月，澳大利亚网络安全中心负责人阿比盖尔·布拉德肖强调，冲突双方参与的黑客实体数量呈指数级增长，并警告全球社会：


  > 行动者公开参与该事业，以及这种参与实际上引入极端不可预测性、溢出机会、错误归因——以及报复和升级的机会……在我们的世界里……是高度成问题的。（Schwartz
  2022）


  作为对这场冲突展开的回应，网络犯罪统计数据显示非法在线活动显著激增（Belson and Woolbright 2022; CrowdStrike 2023;
  Lopez and Shattuck 2022; Radware 2022）。事实上，在 2022 年之前，全球网络犯罪持续增加，但乌克兰的“特别军事行动”进一步助长了这一趋势。针对令人不安的网络趋势，2023
  年 1 月在瑞士达沃斯举行的世界经济论坛将网络安全视为最关键的领域之一，要求全球做出回应。此外，根据《2023 年全球网络安全展望》报告，93%的受访网络安全领导者和
  86%的商业领袖预计未来两年将发生“灾难性”的网络雪崩（Dal Cin and Jurgens 2023)。2020 年做出的先前估计预计全球网络犯罪成本将从
  2015 年的 3 万亿美元飙升至 2025 年的 10.5 万亿美元，这一估计不仅因新冠疫情和经济困难而需要修正，也因乌克兰战争而需要修正（Fareed 2022）。2022
  年 2 月 24 日后活动增加的黑客活动家和黑客，通过迫使不仅是在线政府网络扩大网络安全开支，还迫使远离冲突地区的偏远农村地区的小企业扩大开支，使这一局势更加复杂。毫无疑问，对于许多本已艰难求生的小企业主来说，这些开支将难以负担，尤其是从长远来看。





  ## 2022 年俄罗斯黑客组织的全球扩张与品牌化运作


  到 2022 年底，这些俄罗斯黑客组织已将活动扩展至全球，并增强了对俄罗斯社会的影响力。他们不仅掌握了与公众沟通和动员的最有效方式，还主动与媒体保持联系，并公开与政界人士探讨政府“网络部队”的问题。部分黑客组织建立了清晰的品牌形象，拥有可识别的象征文化和及时的品牌承诺。由于这些品牌承诺得到了针对欧洲、乌克兰和美国数字实体的广为人知的网络打击的支撑，黑客组织获得了更高的公众知名度和信任度。因此，Telegram
  用户乐于协助黑客发动网络攻击，并参与黑客的筹款活动。部分组织以加密货币支付参与网络打击的志愿者报酬，而其他组织则不支付志愿者报酬，且很少寻求公众协助。攻击发起前，发起者会向每位志愿者提供打击工具包。例如，2022
  年 5 月，由 KillNet 带来的 Telegram 志愿者协助 XakNet 对乌克兰数字系统 Kropyva 发动了强大的 DDoS 打击。响应黑客将自己包装为非营利和爱国实体的形象，2022
  年其追随者响应了多项为在乌克兰作战的军事单位和俄罗斯孤儿院筹集资金的倡议。显然，协助网络攻击的志愿者人数远多于捐款人数。事实上，2022 年随着公众对其活动的兴趣持续高涨，黑客组织的成员规模实现了大幅增长。


  必须强调的是，虽然乌克兰拥有自己的网络战线和网络志愿者，其努力受到西方和乌克兰媒体的赞扬和推广，但俄罗斯社会缺乏类似的网络“战士”，这一空白由 KillNet、People’s
  Cyber Army、NoName057(16)等黑客实体等网络犯罪分子填补。


  在俄罗斯网络空间内，出现了几个黑客品牌；部分团队未能推进品牌建设，而其他团队则蓬勃发展。在成功发展的品牌中，KillNet 可谓最具辨识度的黑客品牌，成为其他品牌建设不力的黑客团队的保护伞。拥有超过
  90,000 名追随者，且欧洲和美国媒体大量报道其打击行动，KillNet 试图与 Anonymous 的全球知名度竞争，是暗网中的重要参与者。其团队积极管理社交媒体形象，维护一致的象征文化，与追随者和影响者保持紧密互动，总体上制定了有效的品牌战略。KillNet
  并非俄罗斯社会所知的第一个黑客团队。在其出现之前，Conti、REvil、Fancy Bear 等黑客团队曾登上报纸头条，震撼普通人的想象力。然而，抛开生产力和技术水平不谈，之前那些著名的黑客组织都未能留在社会的集体记忆中。相反，KillNet
  成为了一个品牌和虚拟爱国主义的象征。它在恰当的时间以华丽的方式出现并展示自己。通过揭开围绕黑客的部分神秘面纱，并利用公众认为黑客全能的观念，该团队为其“客户”提供了价值。尽管该组织作为黑客实体的效力极其存疑，但俄罗斯社会会记住
  KillNet，或许还有其他几个组织，而非 Conti、REvil 或 Fancy Bear。


  从政府视角来看，在俄罗斯社会内部，一种被称为“黑客行动主义”的新型行动主义形成了，并被赋予了意识形态，积累了认可度、影响力和财务基础。目前，黑客们明确表达了对国家及其军队的支持。然而，这种支持并非无条件，特别是对政府和众多官僚而言，正如充满对俄罗斯官员不满的帖子所显示的那样。此外，值得回顾的是，尽管公众要求澄清，政客们仍避而不谈黑客行动主义者的法律地位。如果政府决定起诉黑客行动主义者，此举将导致不可预测的后果，黑客行动主义者可能会转而对抗当局。


  有趣的是，在加入创建可识别黑客品牌的竞赛中，黑客组织在没有竞争态度的情况下建立了黑客行动主义者联盟。主要表现为：它们不愿在单一名称下联合，但愿意相互协助和合作。此外，通过将自己定位为爱国实体，这些团体通过相互转发和宣传，为彼此聚集并维持了大量支持。这使得黑客团队能够推进其品牌名称和议程，获得大量追随者，并在某些情况下改善其财务状况。


  在受审查的黑客组织或 IT 导向社区中，KillNet 是唯一一个有意且不懈地寻求群体间合作的品牌。它提出意识形态统一和对网络攻势的支持，通过私信联系 Telegram
  上出现的每一个黑客实体，并强调其亲俄政治立场。如果 KillNet 找到技术娴熟或富有创造力的 IT 合作伙伴，这种建立合作的意愿可能会产生危险的高效性。


  研究表明，许多组织实施了相互配合的网络打击，以专业知识和技术能力互补，但这种群体间合作在 2022 年呈现随机和临时性的特征。值得注意的是，2022 年黑客网络勒索的全面协调不存在，因此俄罗斯黑客的攻击主要是自发和随机的。这一结论源于对研究对象黑客组织的分析，这些组织非国家资助，也非俄罗斯情报机构的一部分。然而，这一结论并不与关于存在实施针对乌克兰及其盟友网络勒索的俄罗斯政府网络部队的广泛说法相矛盾。尽管研究对象群体因合作有限和缺乏协调不能被视为“网络战线”，但黑客并未降低网络侵略的强度，发动了大量打击并试图获得战略优势。


  此外，其目标选择策略由新闻、俄罗斯宣传、欧洲或美国政界人士关于俄罗斯的声明、包含不愉快事实和批评内容的文章以及其他非计划事件驱动。对大多数黑客而言，与俄罗斯、其政府或“特别军事行动”相关的任何事件的情境细节，均构成发动网络攻击的适当动机。在冲动性打击中，XakNet、From
  Russia with Love、Beregini、Joker DPR、KillNet 和 Zarya 等黑客团队对乌克兰、欧洲和美国网站实施了严肃的、预谋的攻击。





  ## 黑客行动主义网络行动分析


  许多官员和 IT 分析师强调，针对乌克兰、欧洲及其他目标发起的网络勒索行动，在专业性方面微不足道，因此效果也不甚理想（Recorded Future 2023；Lewis
  2022）。权衡黑客行动主义者实施网络打击的风险，即使是俄罗斯公司“卡巴斯基”也指出：“大多数情况下，这些组织实施的攻击对运营的影响非常有限，但可能会被错误地报告为严重事件，从而造成声誉损害”（Kaspersky
  Lab 2022）。这些网络攻势的实际影响迄今可能尚未显现。此外，在 2022 年，黑客们持续塑造并提升其 IT 技能，以至于因对俄制裁而导致的即将到来的计算机设备短缺，对他们而言也不会构成严重障碍。考虑到他们因参与当前网络战而巩固的敏锐反西方态度，其中一些人将构成非常严重且危险的威胁。


  黑客组织公开承认，其成员积极从事高度非法的活动，迟早会受到惩罚，如果俄罗斯当局决定迫害这些组织，他们亲俄的爱国观点将不被纳入考量。尽管如此，为了在俄罗斯寻求合法化地位，黑客组织向政府部门发出了大量明确信号，表示他们乐于建立关系。遵循相同的逻辑，他们公开支持俄罗斯政客将活跃黑客组织纳入法律框架的反复无常的政治倡议。


  研究表明，他们与当局合作的意愿及亲俄政治立场，不足以让我们得出俄罗斯黑客组织是 FSB（联邦安全局）项目的结论。这些组织迟早可能会被置于当局的控制之下，这似乎是合情合理的。


