  1.  安德烈·马萨洛维奇是俄罗斯网络安全专家，也是热门俄罗斯 YouTube 频道“Cyber Grandfather”（赛伯爷爷）的创始人。他是电视和广播节目的常客。


  2.  鲍里斯·A·罗任是一名记者和博主，创立并运营着著名新闻品牌“上校卡萨德”。2015 年，他的名字出现在乌克兰网站“Myrotvorets”（和平缔造者）上。


  3.  卢森尼亚人是居住在乌克兰、匈牙利和其他一些欧洲国家的少数民族。其中一些人信奉天主教；另一些人则信奉东正教。


