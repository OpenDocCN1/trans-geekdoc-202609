  # 第 2 章 黑客组织


  ## 活跃危险还是幼稚烦人


  对于俄罗斯社会而言，乌克兰战争蔓延至网络空间、并几乎波及每一个本地数字网站（包括农村报社、农场、手工业者、杂货店等的网站），这成为了一个意外且有害的揭示。一方面，政府和私营在线实体加强了防御，并聘请`IT`专家修复损害、预防未来的黑客攻击。另一方面，社交媒体用户开始发现黑客组织建立的公开渠道，其中一些组织向俄罗斯宣称发动网络战，另一些则高调承诺代表俄罗斯社会作战。这双方黑客实体都让普通民众感到恐惧和困惑。


  战争爆发前，有两个长期运作的黑客组织——“Beregini”和“顿涅茨克人民共和国小丑”（`Joker DPR`）——它们行事缜密却鲜少登上头条。因缺乏公众关注，关于它们成就的故事逐渐湮灭。在
  2022 年 2 月 24 日之前，对俄罗斯社会而言，乌克兰和顿巴斯地区并非首要关切。持续的大流行、对俄罗斯体育的限制、喀山和彼尔姆的校园枪击案及其他事件，才是主要的讨论和担忧主题。战争彻底颠覆了一切。在这一关键时刻，知名黑客品牌“KillNet”组织走出了暗网的阴影。幸运的时机将该组织推至俄语网络空间的顶端，进而登上全国头条。坦率说，时机具有不可思议的强大效力，但这并非
  KillNet 壮大的唯一原因；现实更为复杂，其他关键因素也促成了其成功。


  通常，黑客隐蔽行事，不建立公开频道，也不直接以黑客身份示人。为吸引公众注意，KillNet 组织广泛宣示其对俄罗斯的爱国情怀及其在不断升级的冲突中选择的立场。与此同时，与
  KillNet 形成对比的是，Beregini 和 Joker DPR 倾向顿巴斯，而非张扬地亲俄。在适应这场持续血腥战争的观念过程中，俄罗斯社会寻找明确的盟友。KillNet
  符合这一叙事。突然之间，一直将黑客视为犯罪世界固有组成部分的普通公民，看到了黑客的另一面。他们不仅是以银行账户为攻击目标的罪犯，也可以是爱国且利他的人。尽管 Joker
  DPR 和 Beregini 并未从黑客行为中谋取经济利益，但 KillNet 却巧妙地将其品牌定位为无私且献身于俄罗斯。KillNet 将自己推广为在互联网上保护国家的网络战士。因此，该组织为黑客引入了一种新的行为模式，以积极且社会可接受的方式推广黑客及其活动。





  到 2022 年底，出现了其他几个黑客组织。其中一些加入了 KillNet 品牌，其他则消失或独立工作。这些黑客组织将自己包装为俄罗斯非政府网络战线或爱国志愿者大军。必须指出的是，并非所有俄罗斯黑客都跟随这一潮流；许多人决定搬迁到国外、隐姓埋名，或远离无利可图的爱国行动。这部分黑客群体不在本研究范围内。本研究聚焦于最活跃和最受关注的黑客组织：Joker
  DPR、Beregini、XakNet、From Russia with Love (FRWL)、NoName057(16)、KillNet、Zarya、Anonymous
  Russia、Russian Angry Hackers did it (RaHDIt) 和 People’s Cyber Army。


  此外，还提供了每个黑客组织的摘要，包括其创建和运营时间、议程、目标、背景、核心成员、成员昵称、社交媒体存在情况以及关于黑客组织的其他关键事实。


  ## Joker DPR


  如前所述，Joker DPR 在 2022 年 2 月俄罗斯干预乌克兰之前就已出现并运作。隐藏在这个名字背后的个人数量未知。在 Joker 宣布攻破乌克兰 Delta
  系统后，俄罗斯 IT 专家 Andrey Masalovich^1 接受了多家俄罗斯新闻媒体的采访，被要求澄清 Delta 平台的情况（Batman and Zakharov
  2022; Radio of Russia 2022）。在这些采访中，Masalovich 自相矛盾。起初，他声称 Joker DPR 是一名多年前离开俄罗斯前往所谓“顿涅茨克人民共和国”的熟练个人（Batman
  and Zakharov 2022）。后来，Andrey Masalovich 改变了说法，强调黑客 Joker DPR 是一个团队，因为对 Delta 交互系统的复杂攻击必定是团队合作的结果，而非个人所为（Radio
  of Russia 2022）。因此，有理由怀疑这位俄罗斯专家是基于自身经验而非事实，对黑客身份进行推测。品牌名称 Joker DPR 可能掩盖了一支有动机的
  IT 专业人员团队，也可能只是一个人。


  2019 年秋季，Joker DPR 频道在 Telegram 上建立，并开始发布一系列有争议的帖子。其活动瞬间引起了乌克兰人和分离主义者的关注。2019 年
  11 月 2 日，Boris Rozhin^2 警告其 Telegram 受众：


  > 一个新的军事媒体在此平台播出。乍一看，它非常有吸引力，因为有许多看似可信的乌克兰信息泄露。如果这个媒体为我们工作，一切都好……记住，我们的敌人狡猾！在真实但无用的信息中，敌人可以插入极其危险的虚假信息。（Rozhin
  2019）


  该频道创建者受著名好莱坞电影《小丑》启发，该角色的面孔和名字成为了黑客品牌的象征。为了阐述这一象征意义，作者在几乎每篇帖子的末尾都放置了“ha-ha-ha”，即小丑标志性的笑声。此外，频道帖子还包含以下短语：“我是一个理念”、“我是混沌的本质”以及电影中的其他台词。


  自 2019 年 Joker DPR 频道建立以来，同一个人一直控制着该品牌。这一结论源于 Joker 的定位从频道在 Telegram 上的首批帖子开始就一直持续。显然，隐藏在该品牌背后的人在其出现在社交媒体之前，就精心策划了品牌定位；因此，许多包含内部信息泄露和作者介绍的初始帖子都为耀眼的开场做好了准备。


  准备工作没有白费。2019 年 12 月，Joker DPR 接受了 News-Front.info 的 Yulya Vitiazeva 和 Riafan.ru
  的 Natalya Makeeva 的两次采访（JokerDPR 2019; Polykazakova 2019）。Joker DPR 否认乌克兰作为一个主权国家的地位，强调该实体没有未来，尤其是在现政府领导下（JokerDPR
  2019）。他极度的厌世情绪与对乌克兰反对派政治家 Anatoly Anatoliyevich Shariy 的尊重和钦佩交织在一起（Joker DPR 2019）。Joker
  DPR 认为他与这位政治家有很多共同点：都是体制的反叛者。2022 年，黑客的政治倾向没有太大变化。尽管 Anatoly Shariy 发布了关于 Valery
  Zaluzhnyi 的 Instagram 被黑事件的负面分析，称其为毫无意义的行为，Joker DPR 仍提供了 Shariy 帖子的链接，并赞扬了他的智慧和胆量（Joker
  DPR 2022, Shariy 2022）。


  必须强调的是，在这些采访中，黑客大量使用了象征性的 Joker 短语，并通过改述电影或编造类似电影情节的叙事来回避棘手问题。例如，当记者 Vitiazeva 问他关于个人敌人或激怒他的人时，他回答道：


  > 我给你讲个故事。那时我在马戏团工作。我喜欢逗观众笑。我有自己的小丑乐队。我们周游世界……我的团队出现分歧，导致分裂。一些小丑背叛我并逃跑了……其中一个成了总统，其他人成了议员和将军。这伤透了我的脑子，我的灵魂。我像条落水狗一样流浪世界。但我很快意识到我需要一个目标……现在，复仇和仇恨让我活着。不，我没疯！我完全正常。我要找到我以前的小丑伙伴，惩罚他们的背叛。他们试图杀我……但他们的杀手开始为我效力。他们杀不了我，因为我没有身体和血肉，我是一个理念！。（Joker
  DPR 2019）


  该频道发布了许多关于乌克兰军队的重要内部文件，如武器装备和地图。泄露信息的有效性引出了一个问题：Joker DPR 如何获取这些信息。俄罗斯电视上流传着一些猜测。2019
  年，俄罗斯主播 Yuriy Kot 假设 Joker DPR 是一名 40 多岁或 50 多岁的俄罗斯族男性，受过军事教育（Polykazakova 2019）。苏联解体后，该黑客留下来为乌克兰武装部队服务；要获得这种级别的数据，他的军衔不应低于中校（Polykazakova
  2019）。然而，《周论据》记者 Sergey Sreda 认为 Joker DPR 是一名年轻男子（约三十岁），在各个乌克兰政府部门管理着他的线人网络（Polykazakova
  2019）。在采访中，Joker DPR 公开声明了他的来源：


  > 我有许多来源，但最有趣的数据是由我的间谍带来的，他们在执法机关工作。不是每个人都能成为间谍。间谍必须是聪明果断的人。在执法机关，一些人感到不被重视，这使他们成为招募的易攻击目标。他们每个人都认为自己的上司不公平，把所有人都当奴隶对待……一些间谍出于意识形态原因帮助我：他们不想为新政府效力。但他们是少数。此外，一些匿名间谍出于职业野心帮助我。例如，某人的副手向我泄露文件，发布后其上司受到处罚，下一次，这位副手自己接替上司的位置并继续渴望更多。我不在乎是什么驱动这些人，对我来说他们只是工具……
  （Joker DPR 2019）






  ## 从表面上看，采访中的每一个字都经过精心准备和计算


  因此，这种说法充其量只是虚张声势，是一种恐吓和削弱乌克兰武装部队士气的伎俩。由于缺乏可验证的来源，很难判断这些猜测是否属实。然而，这名黑客可能是一名前高级军官，拥有关系网（情报线人链）、IT
  技能和/或为其工作的 IT 团队。推测他可能是被不名誉地开除或被迫辞职。


  随着知名度的提升，黑客团队开始收到来自各类人士和组织的大量信息，包括国内外情报机构（Joker DPR 2019）。令人惊讶的是，Joker DPR 并不隐藏其专业邮箱，任何人都能找到并直接联系该频道。据该黑客称，情报机构索要个人信息或发送虚假信息，一旦发布就会毁掉
  Joker 的名声；他们不断试图用恶意软件感染黑客的电脑。此外，乌克兰军人和普通民众也给他写邮件，分享他们的生活故事和担忧（Joker DPR 2019）。


  乌克兰冲突爆发后不久，Telegram 官方封禁了 Joker DPR 频道。截至 2022 年 3 月关闭时，约有 60,000 名关注者加入。其团队于 2022
  年 3 月 25 日立即开设了新频道，并继续工作。


  因此，自 2019 年以来，Joker DPR 团体通过电影角色的品牌定位保持了严格的管控。这是其生存战术之一，有助于推广品牌并保护团队免受鲁莽的自我暴露。即使是接受两家俄罗斯媒体采访，也是遵循这种品牌定位方式进行的。每一个字都经过计算。所有不想回答的问题都被拒绝。考虑到这一点，Joker
  DPR 对乌克兰反对派人物 A. Shariy 公开且长久的崇拜，看起来像是另一个误导性的伎俩。


  ## Beregini


  这个自称由女性运营的黑客组织，将自己命名为“Beregini（贝雷吉尼）”。根据斯拉夫神话，Bereginya 是一位异教女神或精灵，其主要职能是保护人类免受邪恶力量侵害。在公共网络空间中，该组织于
  2016 年随着其 Twitter、YouTube 和 Facebook 账号的创建而出现。其初始网站托管在 WorldPress.com 上，但 2017 年，Beregini
  开设了新网站——bg14.org，并沿用至今。为了向乌克兰公众介绍自己，该团队发布了以下声明，由俄语撰写：


  > 亲爱的乌克兰人！我们是“Beregini”，乌克兰女性黑客运动。我们主张乌克兰和平，反对这场战争。寡头们将我们的国家推向崩溃，散播混乱与毁灭。贫穷和饥饿是每个乌克兰家庭的常态……他们通过电视屏幕对我们进行洗脑，将俄罗斯描述为敌人并指责其挑起冲突。与此同时，前匪徒和其他罪犯结成帮派，自称爱国者。他们杀人、强奸、抢劫平民。而这所有恐怖的背后，是总统及其政府、内务部、安全局和国防部。吸血鬼掌权了。（Beregini
  Group 2016）


  这段信息揭示了占据 Beregini 成员内心的悲伤与挫败感，她们热爱祖国乌克兰，却无法接受政府及其所作所为。这种分歧激励女性们团结起来创建了该组织。值得注意的是，Beregini
  黑客反复强调，广场革命以及敖德萨和顿巴斯地区的阴郁事件让她们意识到国家发生了严重的问题，她们必须帮助乌克兰人（Fedotova 2022）。女性黑客越深入地渗透政府机密、了解第
  72 信息心理作战中心，该组织就能对该部门——其信息操纵、信息行动及影响思想的方法——揭露得越多（Fedotova 2022）。


  如前所述，该黑客组织将自己包装为女性实体。在接受 MK.ru 报纸采访时，一名 Beregini 代表确认，其核心团队完全由拥有 IT 学位的女性组成（Fedotova
  2022）。然而，Beregini 团队目前也包含男性成员。他们最初偶尔协助 Beregini，随后决定加入。该组织不仅接纳 IT 专业人士，还接纳翻译、社交媒体管理员、记者等其他专业人士，他们主要是志愿者。一名代表提到一位来自俄罗斯联邦的女性志愿者（“灰姑娘”是她的昵称），她将泄露的信息从俄语翻译成英语（Fedotova
  2022）。2022 年 2 月，一名自称是该组织领导人之一的女性 Olga Vatslavskaya 接受了俄罗斯报纸的采访（Rozanov 2022）。据她称，她生活在一个欧洲国家，但祖国是乌克兰，并坚称自己是地道的鲁辛人^(3)。关于这位女性的信息并未出现在
  Beregini 的 Telegram 频道和网站上。这篇文章可能是记者捏造的虚假故事。有趣的是，IT 专家 Masalovich 在其关于 Beregini
  的视频中采信了关于 Olga Vatslavskaya 的信息。此外，他指出了一组特定特征——该组织行动的方式、精准度及其他虚拟特征，表明了该组织的女性本质（Masalovich
  2022）。


  ## XakNet


  与其他呈现的组织不同，XakNet 是最古老、最成熟的爱好者团体，其成员曾在 2008 年格鲁吉亚战争期间实施过攻击（Russian OSTIN 2022）。


  在 Telegram 上，其公开频道以声称成功攻击乌克兰总统网站（`President.gov.ua`）于 2022 年 3 月 1 日亮相（XakNet Team
  2022）。此外，为了公开沟通，该组织创建了一个专用邮箱供关注者联系。XakNet 最初并未阐明其目标和价值观，因此关注者开始联系黑客寻求专业但有时非法的服务。为了阐明其议程和动机，XakNet
  宣布该团队不提供商业服务，如入侵社交媒体个人账户、金融诈骗和/或其他以牟利为目的的黑客服务（XakNet Team 2022）。在其声明中，该组织强调他们不追求任何经济利益：“我们不是商业企业。我们不募集捐款。我们不出售任何服务，也不找工作。我们不为俄罗斯情报机构或任何其他政府部门工作”（XakNet
  Team 2022）。相反，该团体试图说服人们，其黑客是在试图帮助祖国、保护公民（XakNet Team 2022）。






  ## XakNet 和 KillNet 分析


  ### XakNet 组织


  在这些声明中，XakNet 组织直接表达了其合理的疑虑和愤懑，这揭示了该组织成员的丰富经验和高超智慧。其主要关切在于其与俄罗斯政府的法律关系。据该组织称，战争爆发后，许多俄罗斯
  IT 专家决定不再寻求出国谋生。其中一些人在业余时间成为了正在进行的网络战的一部分。尽管俄罗斯身处网络战之中，他们仍不得不秘密地对对手发动网络攻击；黑客们担心俄罗斯当局可能的法律后果，因此只有少数黑客组织公开活动（XakNet
  Team 2022）。


  对 XakNet 而言，俄罗斯当局在 2021 年和 2022 年拘留黑客组织 REvil 成员是一个重大错误：REvil 黑客针对的是外国目标，从未在俄罗斯联邦境内活动（XakNet
  Team 2022）。因此，根据 XakNet 的逻辑，这些黑客并未违反任何俄罗斯法律，不应被起诉。黑客们警告俄罗斯当局，因在国外犯罪而引渡俄罗斯黑客将破坏 IT
  社区与俄罗斯政府之间的合作与信任（XakNet Team 2022）。XakNet 要求政府与 IT 专家就这一棘手局面进行谈判：


  > 我们不呼吁释放他们（REvil 成员）。我们要求你们仔细审视这一问题，并制定出有效的应对政策……我们仅凭对这个世界的“理解”行事，并作为专家传达我们的观点……
  （XakNet Team 2022）


  遵循黑客的“传统”，该组织未披露其成员信息。尽管如此，接受俄罗斯频道“Russian OSTIN”采访的 XakNet 成员提到，其所有成员均为俄罗斯公民，拥有不同的宗教信仰。他还强调，其成员中无人被征召或在俄罗斯武装部队服役。显然，XakNet
  汇聚了 40 岁左右、拥有 IT 高等教育、目前拥有稳定工作且经济状况良好的个体。


  因此，拥有光明前景和职业发展空间的 XakNet IT 专业人士，出于爱国主义和对同胞的同情，投身于当前的网络战。他们担心受到政府惩罚，而该政府未能建立实质性的网络力量，却让网络战掌握在私人黑客组织手中。XakNet
  正积极寻求与政府部门的对话或联系，以成为官方实体。2022 年 11 月，国家杜马副主席德米特里·古谢夫联系了该团队，讨论其活动和地位。古谢夫拥有推动和改善国内黑客活动家现状的政治意愿和权力。尽管如此，很难预测这种“国家-黑客”对话的进一步发展。


  ### KillNet 及其附属组织


  KillNet 最初是一个由至少六名 IT 专家组成的爱好者团体；他们在 Telegram 上以以下昵称为人所知：Xeshi、Rati、KillMilk、Alpham65
  和 BTK。第六名成员的昵称仍不详。随后，每位成员都建立了自己的分队实施网络攻击。黑客品牌 KillNet 由 KillMilk 掌控，后者于 2022 年 7
  月决定离开该组织。在其告别声明中，KillMilk 写道：“为了我的国家，我将从事一些对我的 KillNet 团队非常危险的事情。所以，我决定为了团队的安全而离开
  KillNet 组织。然而，我将在未来帮助 KillNet。一切都不会改变！”（We are KillNet 2022）。KillMilk 由昵称为 BlackSide
  的个人接替，后者自称黑客和暗网论坛的所有者（We are KillNet 2022）。据 KillNet 官方渠道称，新领导人 BlackSide 专攻勒索软件和加密货币钓鱼，目标瞄准美国和欧洲的加密货币资源。


  KillNet 组织于 2022 年 1 月底向俄语受众亮相。在 Telegram 和 YouTube 上，其团队创建了公开账号并上传了一个视频广告。视频显示，最初其创始人计划将新品牌定位为一家提供黑客攻击工具的企业。据称，客户将能在
  KillNet 网站上根据目标选择套餐，该网站计划于 2 月上线。主要业务将通过网站进行，但客户服务将通过一系列私有和公开的 Telegram 频道运作。


  显然，KillNet 团队在宣布成立前很久就开始开发其网站。2022 年 2 月期间，其 Telegram 频道上零星出现关于 KillNet 发展的帖子，维持了公众对这一新企业的关注（Galeev
  2022）。最终，KillNet 网站于 2 月 22 日上线。两天后，全球局势开始以前所未有的速度变化：俄罗斯武装部队进入乌克兰。鉴于政治形势，KillNet
  创始人改变了最初目标，将其商业企业转变为一个具有政治动机的组织，并随后发展为一场运动。据其管理员称，截至 2022 年 4 月，该组织已吸纳多达 4,500 人（Galeev
  2022）。


  KillNet 出现六个月后，该组织由十四个团体组成，如 Anonymous Russia、Zarya、Legion、A Writer from a Center、RadiS、Bear.IT.Army、Mirai、Russian
  Hackers Team 等。在 2022 年 9 月 29 日发布的一份声明中，KillNet 团队宣布：“KillNet 不再是一个团体！现在，KillNet
  是一个新的全球黑客宗教，捍卫俄罗斯联邦的利益！”（We are KillNet 2022）。重要的是要强调，对于许多黑客团体而言，聚集在 KillNet 旗下并与该品牌建立关联，使其更容易发展壮大并扩大队伍。值得注意的是，KillNet
  包含两类团队。第一类是指在 KillNet 内部创建、后来独立运作的团体。第二类包括在加入 KillNet 之前就已创建并活跃的实体。


  如前所述，KillNet 品牌团队最初有六名 IT 专家。为扩大 KillNet 的架构，他们开始创建专注于不同领域的新单元。虽然 Xeshi 成为了新单元 Zarya
  的创建者，昵称为“Rati”的个人建立了 Anonymous Russia，而 KillMilk 成立了 Legion 分部。随着时间的推移，Zarya 开始阐述其独立地位。相反，作为一个独立实体出现的
  Anonymous 组织，试图强调其与 KillNet 的隶属关系。


  #### Anonymous Russia 和 Zarya


  自 2022 年 2 月 24 日以来，渴望曝光和认可的黑客团体数量大幅增加。Anonymous Russia 便是其中之一。为光荣地宣布其诞生，该组织入侵了知名乌克兰公司
  Roshen（Roshen.com），并在其全新的 Telegram 账号上宣称了此事（Anonymous Russia 2022）。然而，其他来源未证实此次攻击。显然，如果确实发生了入侵，那只是一个低级别的分布式拒绝服务（DDoS）攻击，仅持续了很短时间。


  对于这个新的黑客实体，其创建者简单地模仿了成立于 2003 年的著名组织 Anonymous。利用其品牌名称和标志，这个亲俄组织将自己介绍为 Anonymous
  的俄罗斯分支：





  > 嗨，世界！我们是匿名者。我们是黑客、攻击者、间谍、挑衅者，或是寻常邻里里的家伙。匿名者是一种理念。匿名者不是一个组织、俱乐部或政党。我们没有中心化的层级架构。所以，它没有领袖。此外，匿名者也没有工作协调中心。我们接纳来自各国、老少不一的成员。我们无处不在……加入我们的运动。成为匿名者的一部分。（匿名者俄罗斯
  2022）


  在这份声明的末尾，附上了老牌匿名者组织的座右铭：“我们是匿名者。我们是军团。我们不宽恕。我们不遗忘。敬请期待。”


  鉴于政治局势，这个黑客组织宣称，世界上许多不支持俄罗斯及其在乌克兰军事行动的匿名者成员是叛徒和政府特工（匿名者俄罗斯 2022）。这些虚假的匿名者成员散布争端，破坏了组织的团结和议程。据匿名者俄罗斯称，来自德国、匈牙利、瑞士和奥地利的匿名者分支支持俄罗斯政府（匿名者俄罗斯
  2022）。


  自建立其 Telegram 频道以来，匿名者俄罗斯声称对乌克兰、波兰、哈萨克斯坦及其他数字实体发动了多起攻击。其于 2022 年 7 月和 9 月对俄罗斯 Vk.com
  的攻击，被包装为一场为言论自由而战的行动。尽管针对 Vkontakte 的网络攻击奏效了，但匿名者决定在 Tik-Tok 上一试身手。其“自豪”的声明宣称，匿名者组织让
  Tik-Tok 瘫痪了一到三分钟（匿名者俄罗斯 2022）。有趣的是，在其运营的第一个月里，该组织攻击了白俄罗斯的网站，如国内连锁鞋店 (belwest.by)、联邦教育部门
  (edu.gov.by) 和一家出租车服务 (taximaxim.by)。一些白俄罗斯实体被关停是因为匿名者团队在练习如何使用其黑客软件，而其他网站则因个人原因成为目标。例如，位于白俄罗斯戈梅利的一家城市环卫部门被关停，因为匿名者黑客家里没热水（匿名者俄罗斯
  2022）。在另一个案例中，一名匿名黑客过马路时差点被一家当地汽车服务公司的车撞到。这名愤怒的黑客决定发动 DDoS 攻击惩罚该服务（匿名者俄罗斯 2022）。总的来说，从
  2022 年 7 月到 8 月，至少有三十六个白俄罗斯网站成为匿名者的受害者，但该组织在 2022 年秋季停止攻击白俄罗斯实体。其中大多数位于戈梅利这一事实，意味着该组织的几名成员是白俄罗斯戈梅利的居民。


  为实施其行动，匿名者俄罗斯与 NBP Hackers、DeaDNET 等多个黑客组织联手。其中一些联系昙花一现，团队通过 Telegram 账号上的相互声明宣布分道扬镳。然而，在
  2022 年 7 月 23 日，匿名者俄罗斯宣布与 KillNet 结成紧密联盟，这种合作似乎是长久且互利的。为改善财务状况，11 月，匿名者俄罗斯宣布与一个名为
  Zero Day 的黑客组织合作，后者提供 DDoS 服务（Zero Day 2022）。


  一名拥有 IT 技能、隐藏在“Xeshi”昵称下的 KillNet 品牌联合创始人建立了“Zarya”（曙光）单元，该单元后来转型为独立团体。2022 年夏天，Xeshi
  召集了他自己的黑客团队，成员此前均为 Zarya 的追随者。新成员的选拔标准是其 IT 技能，因为 Zarya 团队的行动已超越简单的 DDoS 打击。该组织主要针对乌克兰资源，有时也会攻击其他国家。在其使命宣言中，Zarya
  组织强调其主要目标是与军事和情报机构相关的政府设施。“我们不妨碍医疗、消防和警察部门等关键社会服务。我们不发布公民个人数据，也不从慈善组织窃取资金，”Zarya
  继续说道（Zarya 2022）。


  为了在 Telegram 受众眼中重塑 Zarya 的独立地位，Zarya 的领导层并未广泛宣传其与 KillNet 的合作。尽管如此，它光荣地推广了与 XakNet
  和 Beregini 的团队合作，这为这个年轻、鲜为人知的品牌增添了价值。为了与 KillNet 保持距离并推广自己的黑客品牌，Zarya 管理员为其 Telegram
  频道创建了一个独特的标志。此外，Zarya 黑客保持其内容主线的原创性，避免转发 KillNet 的素材或提及它。品牌建设的另一关键步骤是在 2022 年 11
  月 30 日推出 Zarya 网站。在设计该网站时，该组织坚持使用了 Zarya 的标志和配色方案。


  KillNet 最初是一个爱好者团体。然而，随着“KillNet”品牌的壮大，新手和不太成功的黑客组织加入了它，并在其旗下运作。


  ### FRWL 和 NoName057(16)


  NoName057(16) 组织通过 Telegram 宣布亮相，其成员于 2022 年 3 月 11 日建立了一个频道。在其开篇声明中，NoName057(16)
  自称是一个黑客单位，是对抗现代新纳粹的战士。此外，他们的声明宣称：


  > 窃取乌克兰政权的新法西斯分子试图攻击俄罗斯网络空间并恐吓我们的公民……作为对他们可悲尝试的回应，我们已对散布关于俄罗斯在乌克兰特别军事行动虚假信息的极端宣传资源发动了大规模攻击……我们对乌克兰来源进行了几次成功的攻击……这仅仅是开始。（NoName057(16)
  2022）


  该黑客组织建立并管理其频道，服务于不同目标。主 Telegram 频道报道 NoName057(16) 在网络空间的活动。它于 2022 年 8 月创建了一个聊天群。然而，到
  2022 年 11 月，该聊天群仅吸引了约 110 名成员。其活跃度似乎有所放缓；人员进进出出。聊天群管理员不与参与者交流，仅简单转发主 NoName057(16)
  频道的内容。显然，聊天访客期待实时对话和新信息，但 NoName057(16) 未能满足用户期望。因此，聊天群正在流失成员。


  为方便联系，黑客在频道简介中提供了他们的 Proton 邮箱。显然，NoName057(16) 收到了许多来自粉丝、记者、关心人士和对手的邮件。然而，黑客从未回复、发布或引用过其邮件通信内容。这个
  Proton 邮箱用于所谓的官方通信，但用于工作（例如向乌克兰媒体发送恐吓邮件）时，该组织使用一组通过 Mail.ru 开设的邮箱。


  此外，该组织还运营另一个名为“DDosia Project”的频道，于 2022 年 7 月底启动。根据其介绍信息，NoName057(16) 黑客计划利用这个空间聚集志同道合的人，他们准备好学习如何使用
  NoName057(16) 的独特软件。该软件是为实施集体 DDoS 攻击而创建的。为新手提供了详细指南。与聊天群不同，这个“Project”拥有非常活跃且支持性的管理员，他们密切关注正在进行的交流并回应参与者。




  另一个黑客组织于 2022 年 6 月 11 日以“From Russia with love”（FRWL）之名开设了其 Telegram 账号。然而，其成员在官方渠道出现之前，就已对乌克兰在线实体发动了攻击。事实上，早在
  2022 年 5 月初，新闻 Telegram 频道就传播了关于哈尔科夫坦克厂遭受网络攻击的信息。不清楚这是否是其首次行动。6 月，该组织通过攻击位于利沃夫的一处乌克兰设施，庆祝其正式亮相。


  在其介绍性声明中，FRWL 黑客强调，自战争伊始，该团队就一直在监控乌克兰战争，以及针对俄罗斯联邦的持续网络战（FRWL 2022）。FRWL 强调其与 KillNet、XakNet、Beregini、RaHDIt
  及其他组织的紧密联系，这些组织的成功活动成为了他们的灵感和动力来源。事实上，该黑客组织在建立 Telegram 账号之前就已实施攻击，并承诺将继续实施。发布这份公开声明后，该组织进入了一个新领域：它需要为其行动制作多媒体视觉材料，与追随者进行话语交流，并安全运营
  FRWL 社交媒体品牌。


  FRWL 和 NoName057(16) 的创始人追随 XakNet、KillNet 及其他实施连环攻击组织的脚步。关于其成员知之甚少。然而，他们分享并推广的政治观点让人联想到
  KillNet 组织。在回答发送至其支持渠道的问题时，FRWL 提到其团队此前曾以不同名称活动并实施黑客攻击。这导致政府特工开始追查该组织，以确定其发动了哪些攻击（FRWL
  2022）。黑客们并未澄清追捕者是外国还是本国特工。


  ### RaHDIt 或 Russian Angry Hackers Did It


  RaHDIt 的创建者或创建者隐藏在简短的名字背后，其含义颇为张扬：“Russian angry hackers did it”（是俄罗斯愤怒的黑客干的）。RaHDIt
  组织显然在 2022 年 2 月 24 日之前就已活跃。在接受俄罗斯电台采访时，该组织代表将 RaHDIt 描述为一个志同道合的 IT 专业人士社区，他们相识已久，并保持着高度的群体内部信任（俄罗斯电台
  2022）。与其他黑客组织不同，RaHDIt 并未通过互联网或其他渠道招募新成员。为防止间谍渗透，RaHDIt 作为一个封闭的 IT 俱乐部运作。毫无疑问，黑客们完全意识到其活动的本质、法律后果，以及来自国内外特工对其组织的高度关注。


  根据 IT Reserve 合伙人兼 IT 专家 Pavel Miasoedov 的推测，RaHDIt 是一个“白帽”或道德黑客组织，显然在俄罗斯从事道德黑客服务（俄罗斯电台
  2022）。有许多此类公司专门测试数字系统的漏洞和弱点。许多商界人士毫无疑问地认为自己及其公司是黑客的常见目标，因此聘请道德黑客服务从外部测试其系统。考虑到道德黑客获取并拥有与其他黑客相同的增强技能，但他们合法工作并报告活动，Pavel
  Miasoedov 的猜测或许是正确的。


  RaHDIt 表现得富有动力且组织严密，因此该组织通过建立 Nemediza（Nemesis）网站及相应的 Telegram 账号向公众亮相。在这些实体上，RaHDIt
  成员发布了关于乌克兰士兵的个人信息，范围涵盖信用卡号、军事单位、家庭住址和家庭照片。黑客必需的信息已发布在公开网络和暗网来源上。据 RaHDIt 报告，2022
  年 3 月，其黑客已访问超过 700 个乌克兰政府网站，数据被部分或完全下载。有时，该组织会请求追随者提供关于个人的线索。因此，该组织并非“杂食性”的；它追求特定目标，并使用多种方法达成。此外，RaHDIt
  并非以经济利益为动机；其从黑客攻击中收集的任何信息通常都会在免费公开的 RaHDIt 来源上发布。


  除了“Nemesis”项目外，关于该组织的活动和成员知之甚少。尽管如此，其成员无疑对乌克兰数字实体发动了黑客攻击，但很难确定他们是否对欧盟和美国网站发动了网络勒索。值得注意的是，他们关于对乌克兰、欧洲和美国网站实施网络打击的声称并不存在。


  ### People’s Cyber Army


  People’s Cyber Army（人民网络军）组织于 2022 年 3 月 2 日加入网络战。在频道描述中，其团队自称“一群关心祖国的俄罗斯爱国者”，旨在保护公民免受危险外部势力侵害（People
  Cyber Army 2022）。从一开始，黑客们就计划依靠公众力量。也许，为了发动有效攻击，其自身不具备足够能力。


  为了吸引尽可能多的人，团队成员制定了一份主要文件，帮助任何没有专业 IT 知识和设备的人参与该组织的协同攻击。显然，这份文件在 People’s Cyber Army
  公开亮相并建立 Telegram 渠道之前就已起草。DDoS 指南详细解释了如何从浏览器和手机发动此类攻击（People Cyber Army 2022）。


  凭借有效利用团队协作的能力，2022 年 3 月 5 日，该组织告知追随者，集体 DDoS 行动将持续至少 1.5 到 2 小时，并要求他们遵循集体行动时间表。


  创建 Telegram 频道一周后，意外的新成员激增迫使 People’s Cyber Army 团队开发新的内部群组结构，包含以下五个分部：大群聊、攻击协调、渗透测试人员、创意团队和网页开发人员（People
  Cyber Army 2022）。每个分部服务于各自目标。例如，大群聊是“和平且富有成效的交流”场所。此外，组织创始人敦促参与者在此发布潜在目标。该群聊对公众开放，任何人均可通过链接加入。另一方面，其他分部为封闭实体，个人需联系其指挥官并申请许可才能成为成员（People
  Cyber Army 2022）。


  自入驻 Telegram 第一天起，People’s Cyber Army 就成为亲乌克兰用户的攻击目标，他们极度厌恶该组织帖子，并持续在群聊中发送和发布亲乌克兰信息。黑客组织的重组正是由这些活动引发的。为遏制亲乌克兰成员的活动，组织创始人开始审核群聊内容并筛选追随者，封禁最活跃的个人。然而，所有预防措施均无效，该组织放弃了第一个渠道，于
  2022 年 4 月 1 日起在新渠道运营。该组织高度组织化，每天持续针对一到三个数字实体发动攻击。攻击前，其团队会了解目标的技术和意识形态视角。





  这些黑客组织是亲俄黑客运动的先驱，该运动于 2022 年 2 月 24 日后开始成形。出于好奇并受到鼓舞的追随者加入了他们的渠道，并在俄罗斯网络空间内讨论黑客的成功攻击。抛开他们的出身和与政府的联系不谈，这些群体学会了如何与受众沟通并相互合作。在战争的前四个月里，最活跃的黑客领袖提出了创建所谓的黑客联盟或网络军队的想法。然而，到了
  2022 年夏季中旬，黑客们完全放弃了这一想法，因为在最初提出想法后，后续的讨论寥寥无几，且他们确实进行的任何讨论都缺乏最初的热情。显然，这些群体意识到了联盟的无效。在新老群体的加入下，黑客运动得以发展并持续运作，但它是由多个独立的群体推动的，这些群体相互合作、沟通，而不是在一个旗帜下统一行动。凸显亲俄立场的是，两个老牌实体——Beregini
  和 Joker DPR——从这场“运动”中脱颖而出。对他们而言，这场网络战争在地面战争爆发前几年就已开始。作为乌克兰群体，他们的主要关注点是乌克兰及其人民，尽管这些黑客将乌克兰视为俄罗斯联邦的一部分。


