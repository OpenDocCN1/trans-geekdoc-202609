  # 第 5 章：黑客攻击


  ## 主要目标是谁——乌克兰、欧洲还是美国？


  网络战主要由俄罗斯和乌克兰这两大阵营进行。虽然有几个国际黑客组织公开宣布站在乌克兰一边参与这场冲突，但对立面的网络战线则由 KillNet、XakNet、From
  Russia with Love (FRWL)、People’s Cyber Army 及其他组织构成，这些组织可能对西方国家和乌克兰数字实体构成真正的威胁。


  如前所述，研究主要依赖于八个黑客账户发布的信息。关于实施的网络攻势统计数据，是从这些黑客在 Telegram 上的社交媒体账户收集的：Joker DPR、XakNet、FRWL、People’s
  Cyber Army、NoName057(16)、KillNet 及其附属组织。鉴于 RaHDIt 未在其 Telegram 账户上提供关于网络攻击的公开信息，该组织被排除在研究之外。研究也没有采用
  Beregini 组的数据；该团队主要泄露文件并隐瞒已实施黑客攻击的信息。毫无疑问，该组织对私营和国营的乌克兰数字实体发动了网络攻击，但无法追踪 Beregini
  网络打击的时间线。尽管收集了 Joker DPR 的数据，但由于其宣布攻击的方式不明确，缺乏参考或与日期的关联，其准确性存疑。在某些情况下，难以确定 Joker
  打击的具体受害者。因此，研究仅纳入了能够找到日期和目标的网络攻击。


  有必要澄清 KillNet 两个关联组织——Zarya 和 Anonymous Russia 的情况。前者退出了 KillNet，后者在独立活动几个月后加入了
  KillNet 品牌。研究在 Zarya 宣布与 KillNet 分离后，将其攻击单独归类；在此分离之前的每一次网络攻势均视为 KillNet 的行动。Anonymous
  的数据采取了类似方法：该组织在与 KillNet 合并前发动的每起网络事件均计为 Anonymous 的攻击，而在该日期之后实施的任何打击则被认定为 KillNet
  的打击。


  统计时间范围为 2022 年 2 月 24 日至 2022 年 12 月 31 日。由于黑客反复声称他们并未暴露其每一次打击的信息，研究收集了黑客 Telegram
  账户上的公开记录或帖子；完全采信黑客之词，研究未搜寻网络事件发生的证据，也未检查受害者网站以查看其是否正常运行。


  黑客目标主要分为五大类：美国、乌克兰、欧盟 (EU)、英国和其他国家。“其他国家”类别包括除美国、欧盟、英国和乌克兰以外的任何国家。此外，研究还追踪了针对这五大类目标的网络攻击频率、攻击类型，以及可能造成的受害者损失。


  在八个黑客组织中，有三个组织——Joker DPR、XakNet 和 Zarya——专门选择乌克兰目标进行网络袭击。值得注意的是，前 KillNet 关联组织
  Zarya 仅在作为 KillNet 一部分时参与过针对外国的攻击。分离后，Zarya 团队专注于乌克兰数字实体。Anonymous 在关联 KillNet 品牌之前，仅是一名网络流氓，^(1)
  曾恶作剧式地攻击过白俄罗斯甚至俄罗斯联邦的网站。五个俄罗斯黑客组织——FRWL、NoName057(16)、KillNet、People’s Cyber Army
  和 Anonymous Russia——出于其政治议程和政治势头，青睐多元化的网络活动版图。它们针对来自欧盟、美国和其他外国的网站。


  然而，这些组织之间存在必须提及的显著差异：它们的网络打击工具。KillNet 和 Anonymous Russia 依赖 DDoS 攻击。除了 DDoS 打击，People’s
  Cyber Army、NoName057(16)、FRWL 和 Zarya 还部署了更复杂的攻击。2022 年夏天，FRWL 向 Telegram 受众展示了其新创建但尚未使用的病毒，随后该黑客团队未提供关于该恶意软件的进一步更新。另一个黑客团队
  XakNet 被认为是最先进、经验最丰富的组织之一，专门实施破坏性更大的网络黑客攻击。


  ## 目标 #1：乌克兰


  此前，乌克兰曾面临来自俄罗斯黑客的多次网络勒索，因此 2022 年冬天局势的升级迫使其采取安全措施，保护国家免受网络打击。在解决技术漏洞方面，2 月 17 日，乌克兰议会修订了关于数据保护的国家法律，允许将关键政府信息迁移至公共云服务，包括外国云服务
  (Smith 2022)。在军队地面入侵之前，乌克兰数字实体遭受了名为 FoxBlade 的破坏性恶意软件的袭击，这是一种数据擦除器 (Lakshmanan 2022)。





  ### 战争初期的网络防御与攻击态势


  战争爆发数日内，Google 免费向乌克兰的私营和国家机构提供 Project Shield 和 Cloudflare 等防护服务。作为对来自俄罗斯不断扩大的网络威胁的回应，这些服务保护了乌克兰用户免受
  DDoS 攻击。根据 Cloudflare 数据，超过 50 个拥有约 130 个国内域名的国家实体、54 个为难民提供援助、食品救助、记录战争罪行的调查记者及其他组织的非营利本地组织，持续承受来自网络犯罪分子的压力
  (Starzak 2022)。2022 年 3 月，Google DDoS 防护注册了超过 150 个乌克兰组织，包括内政部、外交部、Liveuamap 等实体
  (Lapienyte 2022)。乌克兰用户数量每日增加，因为正如俄罗斯联邦一样，网络无政府状态已成为乌克兰不可否认的一部分。自 2022 年 2 月 24 日起，据乌克兰当局统计，俄罗斯黑客总共对各类乌克兰网站发动了
  1,655 次攻势，其中 557 次针对在线政府部门 (Reuters 2023)。乌克兰国家网络保护中心检测到，与 2021 年网络统计数据相比，2022 年网络攻势数量为
  2.8 倍，其中“归属于恶意代码和网络钓鱼类别的信息安全事件分别增长了 18.3 倍和 2.2 倍”(State Cyber Protection Center
  2023)。


  #### 俄罗斯黑客组织对乌克兰的攻击模式


  事实上，乌克兰是每个俄罗斯黑客组织的目标，它们定期发动攻击，以向 Telegram 受众强调其真实意图。2022 年 2 月 24 日至 12 月 31 日期间，受审查的黑客组织对乌克兰实体发动了
  1,610 次打击，占黑客实施的所有网络攻击的 37%。这意味着乌克兰是俄罗斯黑客的第二大最爱目标，但并非第一。这些黑客团队在春季非常活跃，部署了总网络打击数的
  35%。夏季和秋季约占 27%，但其活动在 2022 年 12 月显著放缓（10%）。考虑到欧洲遭受网络攻击呈现类似下降趋势，这种下降可归因于即将到来的假期，因为许多黑客团队忙于准备庆祝新年和圣诞节。三个黑客团队比其他组织更积极地针对乌克兰网站：People''s
  Cyber Army、KillNet 和 NoName057(16)。针对乌克兰的所有网络勒索中，57% 由 People''s Cyber Army 发起，KillNet
  品牌声称占 23%，NoName057(16) 组织占 12%。XakNet、Joker DPR、Zarya 和 FRWL 共同实施了约 8% 的乌克兰网络攻击。


  #### 战争早期的关键攻击事件


  战争前几天，俄罗斯网络部队在 2 月应用其网络武器，Beregini 对某些乌克兰目标协调导弹袭击，而 KillNet 和其他一些黑客组织在 Telegram
  上建立了社交媒体账号。事实上，首个公开亮相并宣布成立的黑客组织是 KillNet。其成员连同强大的装备，原本准备提供非法 IT 服务，但冲突的爆发改变了该组织的优先级。KillNet
  向 Anonymous 发布大量挑衅声明，成为 2022 年 2 月 27 日首个开始对乌克兰实体发动 DDoS 攻击的组织。其黑客辩称攻击瘫痪了七个网站，包括
  Pravy Sektor (Right Sector)、乌克兰国民议会 (unso.in.ua) 和乌克兰总统网站 (president.gov.ua) (KillNet
  2022)。据称，这些因 DDoS 打击而关闭的网站瘫痪了 1 至 12 小时。


  为测试能力极限，KillNet 于 2022 年 3 月 6 日声称对乌克兰网络警察网站 (cyberpolice.gov.ua) 发动 DDoS 打击 (We
  are KillNet 2022)。为用恶意请求淹没该数字平台，包括 KillNet 和 Zarya 创始人在内的黑客团队，联合了其他三名俄罗斯黑客；其中一名身份未知，除非他更改了初始名称，否则未隶属于其他打击。另外两名参与者为互联网用户提供
  DDoS 服务并管理其 Telegram 频道。据黑客称，他们的打击于 3 月 6 日下午 5 点左右开始，当天即瘫痪了 cyberpolice.gov.ua，网站不可用长达
  24 小时。乌克兰网络部门未对此次攻击发表评论。


  #### 媒体成为重点打击目标


  2022 年 3 月，People''s Cyber Army、NoName057(16) 和 XakNet 加入了这场反乌克兰网络狩猎。与俄罗斯媒体网站被篡改并向受众展示反战声明不同，NoName057(16)
  攻击的乌克兰网站在无任何攻击者声明的情况下下线。2022 年 3 月，NoName057(16) 声称对 segodnya.ua、RBC Ukraine、urk.net、u24.ua、dou.ua
  等新闻门户实施了多次破坏。许多媒体平台在 3 月多次面临网络勒索。受到针对媒体门户的大量成功打击鼓舞，NoName057(16) 向乌克兰和美国网站发出威胁：


  > 谣言四起：欧洲对失控的俄罗斯黑客深感忧虑。我们的组织并非孤军奋战，对抗乌克兰的恐俄宣传……我们的 DDoS 能力呈指数级增长。我们的组织将触达所有在基辅或华盛顿仇视俄罗斯的人。我们将找到每一个有毒谎言和宣传的源头。(NoName057(16)
  2022)


  全球趋势显示 DDoS 攻击潜力变得更强，最强攻击的威力在 2017 年至 2020 年间增长了 2.851% (Palmer 2020)。通常，俄罗斯黑客不披露关于其攻击的有用信息，主要通过宣布成功打击、有时展示新服务（恶意软件）或询问资金支持来减少与受众的沟通。然而，关于
  NoName057(16) 僵尸网络军团威力的信息是由其受害者披露的。2022 年 3 月 24 日，一个名为 Charter97 的乌克兰热门媒体网站被关闭。其
  Facebook 页面告知公众，当地时间上午 8 点，不明黑客从各种联网设备导入巨量流量，该网站在不到 24 小时内收到约 7,000 万次请求 (Charter97
  2022)。据攻击者称，该网站瘫痪超过一天 (NoName057(16) 2022)。


  总计 2022 年 3 月，该黑客团队在该月专门针对乌克兰媒体源，攻击了 47 个乌克兰媒体源。显然这些黑客行动取得了成功。例如，3 月 12 日，成为 NoName057(16)
  目标的网站 fakty.ua 警告其读者：


  > 亲爱的读者，我们的网站连同其他试图提供关于俄罗斯全面入侵乌克兰及乌克兰军队勇气的真实信息的新闻媒体，正持续遭受强大的 DDoS 攻击。俄罗斯人应对这些攻击负责。作为混合战争的一部分，这些打击旨在阻止乌克兰人获取可靠新闻。(NoName057(16)
  2022)


  随后，一个涵盖乌克兰法律体系新闻和更新的国内司法门户 (sud.ua) 将其受众重定向到该门户的 Telegram 和 Facebook 社交媒体账号：“我们的门户因
  DDoS 攻击遇到技术问题”(NoName057(16) 2022)。






  #### 2022 年 5 月：NoName057(16)攻击工业设施网站


  5 月，NoName057(16)导致两家工业设施的网站关闭。5 月 16 日，乌克兰国有公司安东诺夫（Antonov）成为 DDoS 攻击的受害者。该公司是
  Ukroboronprom 公司的分支机构，专门从事航空货运。其网站（`antonov.com`）停止运行，并需要技术援助（NoName057(16) 2022）。四天后，位于切尔尼戈夫的另一家乌克兰工厂“RaPiD”（生产无线电设备、传感器和变压器）因网络攻击失去了对其网站的控制权，数日后，IT
  专业人员修复了俄罗斯黑客造成的损害（NoName057(16) 2022）。


  #### 2022 年全年：NoName057(16)的攻击态势


  2022 年，NoName057(16)团队反复对乌克兰发起网络攻势，目标涵盖从新闻和国家政治运动门户到工业设施等多个领域。从 2022 年 3 月在 Telegram
  上成立至 5 月 31 日，NoName057(16)公开声称已对乌克兰网站发动了 113 次打击。自 2022 年 6 月起，该组织将其 DDoS 僵尸网络用于攻击欧洲在线实体，受害者地域范围随之扩大。结果，NoName057(16)团队对乌克兰的关注度下降。7
  月，该组织完全未干扰乌克兰网站。然而，2022 年 11 月，NoName057(16)重返乌克兰目标，黑客声称已关闭了四十七个网站。


  #### KillNet 及其附属组织的活动（3 月至 7 月）


  从 3 月至 2022 年 7 月，KillNet 及其附属组织 Legion 和 Zarya 对乌克兰组织和服务发动了 105 多次勒索活动。例如，3 月 3
  日，乌克兰第二大电信运营商“Vodafone”遭受 KillNet 的 DDoS 打击，KillNet 告知其追随者 Vodafone 网站离线了四小时（We
  are KillNet 2022）。值得注意的是，电信运营商始终是网络犯罪分子的目标，战争始于 2 月后，网络勒索行为进一步升级。然而，网络攻击给小型乌克兰运营商如
  Triolan、Vinasterisk、Viasat 等造成了严重技术问题（Brewster 2022）。如前所述，3 月 XakNet 入侵了四家电信运营商，包括
  Viasat，其数据库严重受损（XakNet 2022）。


  #### Zarya 团队的深度渗透与数据窃取


  随着地面战事展开，俄罗斯黑客未放弃摧毁乌克兰互联网连接的企图。据称，7 月数周内，Zarya 团队获得了乌克兰互联网提供商“UarNet”（`uar.net`）的访问权限。Zarya
  于 7 月 25 日宣布结束对该提供商的勒索，声称：“我们已完成对 UarNet 的行动。并可宣布我们成功实施了打击，通过多次篡改攻击瘫痪了 100 多个乌克兰私人和政府网站”（Zarya
  2022）。根据 Zarya 的 Telegram 帖子，约 300 GB 数据被窃取，但威胁行为者未阐明数据来源平台。随后，Zarya 的追随者在 7 月 25
  日至 27 日期间分两批观察到了部分 UarNet 数据库泄露。


  #### Zarya 的独立化进程与合作


  在脱离 KillNet 独立的道路上，Zarya 团队开始与其他黑客团队建立直接联系。对 Zarya 而言，XakNet 成为其与俄语网络空间最显著的连接。2022
  年 7 月 12 日，双方声称成功入侵乌克兰国家档案局，其官网（`archives.gov.ua`）被篡改，并展示了一段俄罗斯博主冒充乌克兰总统的视频（Zarya
  2022）。据肇事者称，他们甚至入侵了国家部门的子域名。他们从官网成功提取了大量档案数据，但 XakNet 和 Zarya 未披露被盗数据的确切大小。承诺发布更多信息，五个总计超过
  1,500 MB 的数据文件被发布在黑客的 Telegram 渠道供公众访问（Zarya 2022）。KillNet 专注于 DDoS 攻击，而这个起步于 DDoS
  打击的团队转向了更复杂的入侵。显然，这种操作转变与 Zarya 黑客技能的激增直接相关。


  #### People’s Cyber Army 的数据泄露行动


  如前所述，乌克兰相当一部分网络勒索由 People’s Cyber Army 组织。该组织利用 DDoS 攻击作为掩护，邀请追随者参与攻击，其黑客有时能渗透受害者系统并窃取信息。该组织对多起数据泄露负责。活动初期，People’s
  Cyber Army 声称首次数据泄露，其与 XakNet 联合对政府联络中心（`ukc.gov.ua`）发动网络攻击。结果，该组织发布了数份包含中心员工个人详细信息及该国家设施描述的文件，包括员工登录名和密码。最新记录制作于
  2022 年 4 月。除中心员工个人数据库外，泄露内容还包含客户记录，如姓名、电话、邮箱、地址，甚至民众请求（People’s Cyber Army 2022）。


  成立于 2001 年、提供国内及国际服务的乌克兰快递服务商 Nova Poshta（`novaposhta.ua`）于 5 月 31 日成为 People’s
  Cyber Army 的目标（Leaks 2022）。被盗信息量巨大——40,881 个唯一邮箱地址和 68,707 个电话号码，以及地址和其他个人记录（Leaks
  2022）。部分信息近期刚发布，可追溯至 2022 年 1 月，其他记录与早期泄露记录吻合。此前，Nova Poshta 公司数据库曾现身暗网，有人试图出售两个包含用户记录的文件，一个含
  500,000 条记录，另一个含 1,800 万条（Tsentsura 2018）。People’s Cyber Army 未试图将窃取数据货币化，而是通过 Telegram
  传播。


  #### 后续攻击：票务系统遭袭


  2022 年，受害者名单持续扩大，10 月 3 日，国家票务服务 Maestro Ticket System 和 Kontramarka 被加入名单（People’s
  Cyber Army 2022）。最初，Kontramarka 公司未确认影响其大多数客户账户的攻击。但黑客向公司保证已部分销毁网站信息，并传播了一封包含黑客留言的邮件：


  > Hi, a no longer respected MTicket user. As the company representative, we are
  hurrying to inform every user about the cyber breach of our servers by the pro-Russian
  hacking group People’s Cyber Army. Users’ personal data was leaked to the Internet
  . . . We are asking you to stop contacting the company! The defeat of Ukraine is
  around the corner . . . Best regards, Maestro Ticket System. (People’s Cyber Army
  2022)


  结果，公司确认了网络勒索但否认数据泄露：


  > Dear friends, at this very moment, we are fighting back against the hacker attack
  from incompetent Russians . . . you may have received a letter of questionable content.
  But there is no reason to worry: your ticket data is stored on Amazon servers. (People’s
  Cyber Army 2022)


  黑客声称泄露约四百万笔交易及部分信用卡号，公司向客户保证敏感财务信息未存储于网站，攻击者无法触及。


  People’s Cyber Army 打包了约 200 万注册用户的个人信息，包括姓名、电话、地址、出生日期和邮箱；被盗数据库约 30 MB，16 MB 数据免费在
  Telegram 发布（Leaks 2022）。此外，该黑客团队将此数据库存放在其专门建立的封闭 Telegram 账户中。数日内，乌克兰 IT 专家恢复了两个网站。





  XakNet，这个经验最丰富、技术最娴熟的黑客组织，开设了其公开的 Telegram 频道，并宣布已完全掌控三十九个乌克兰政府机构的权限，其中许多位于敖德萨地区
  (XakNet 2022)。伴随完全控制权而来的，是 XakNet 篡改了这些网站，并留下了如下信息：


  > 我们铭记 2014 年 5 月 2 日敖德萨的悲剧。^(2) 我们也铭记顿涅茨克和卢甘斯克人民共和国长达八年的折磨。我们敦促乌克兰当局不要重蹈这血腥的覆辙！乌克兰人，别再被西方宣传迷惑！许多乌克兰军人和平民已丧生，乌克兰武装部队拿乌克兰公民当盾牌抵挡俄罗斯军队。
  (XakNet 2022)


  该黑客团队并未从受害实体中窃取大量数据，因为该组织仅将敖德萨当局的密码和登录凭证发布到了互联网上。显然，XakNet 试图借此引发公众对其政治声明的关注，而非破坏数字实体。尽管
  XakNet 完全控制了地方政府网站，但其黑客未能攻破两个政府网站——乌克兰总统网站和国防部网站，仅能通过大规模 DDoS 攻击干扰其运行。


  在对乌克兰总统和国防部网站发动网络攻击不到两周后，XakNet 对“乌克兰资本”银行实施了篡改攻击 (XakNet 2022)。该银行网站 `ukrcapital.com.ua`
  显示了 XakNet 的视频留言，黑客在视频中宣称对该次攻击负责，并强调 XakNet 发动此次打击是“针对法西斯分子要求窃取俄罗斯公民资金的报复” (XakNet
  2022)。此外，若俄罗斯公民账户中的资金被没收，XakNet 扬言将攻击每一家乌克兰银行并掏空每一个银行账户。几小时内，该银行 IT 团队移除了该视频，取而代之的是一份亲乌克兰声明，呼吁支持军队
  (XakNet 2022)。


  从 2022 年 3 月 17 日至 5 月 20 日，XakNet 潜伏在 `court.gov.ua` 网站（乌克兰最高法院）内部。当 XakNet 团队正在攻击该目标时，另一个未透露名称的俄罗斯黑客团队对该平台实施了篡改攻击。然而，处理该事件并删除黑客留言的
  IT 专家并未察觉 XakNet 的存在 (XakNet 2022)。出于未知原因，XakNet 尽管声称窃取了大量敏感数据，却未在 2022 年泄露法院数据库。其
  Telegram 账号仅发布了几张用乌克兰语书写的文件截图。然而，半年后，该黑客组织泄露了从乌克兰财政部窃取的数据 (XakNet 2022)。此次泄露包含超过一百万份文件，标志着大规模数据泄露漫长名单中的新一笔记录。据
  XakNet 称，他们在该部门潜伏了数月，泄露内容包括官方邮件、密码、登录凭证、员工个人信息、指示、与外国政府实体的通信及其他信息。除了这些泄露，该组织还对证券市场机构
  (`smida.gov.ua`)、保险公司“Express Insurance” (`e-insurance.in.ua`) 和信贷公司“Express Credit”
  (`express-credit.in.ua`) 实施了另外三起数据泄露。


  尽管研究将 RaHDIt 排除在统计之外，但其活动仍须提及。该黑客组织公开了与各类军事设施相关的乌克兰人个人信息。正如黑客在其 Telegram 帖子中所述，该组织攻破了乌克兰国家部门，如国民警卫队、国防部、网络警察、乌克兰安全局及军事教育机构，以获取所需个人详细信息。尽管如此，2022
  年 3 月初，俄罗斯媒体报道了 RaHDIt 黑客的“巨大网络成功”，称其“攻陷 755 个政府网站”，包括第聂伯罗彼得罗夫斯克、顿涅茨克和敖德萨地区的农村当局
  (Gafyrova 2022)。在俄语网络空间内，至少流传着三张 RaHDIt 向乌克兰武装部队和平民发表声明的截图，内容有俄语和乌克兰语版本。在第聂伯罗彼得罗夫斯克地区的一个政府网站上，黑客张贴了以下声明，伪装成俄罗斯军队的声明：


  > 当前事件将被几代人讨论，但真理只有一个。显而易见，这场战争是腐败、贪婪和鲁莽的政客涉足政治的结果，他们漠视自己的人民及其需求……如今，我们有机会夺回八年来失去的一切，消除新法西斯的包袱与虚伪，为我们光明的未来奠定基础……我们呼吁当地居民停止支持激进和民族主义团体，保全性命。乌克兰军人！放下武器！别向俄罗斯军队开枪，保全性命……我们保证礼貌对待。
  (Yaplakal 2022)


  然而，该组织没有公开账号，也不认领其黑客行径，这使得追踪其网络行动成为不可能。2022 年 6 月，多个 Telegram 渠道在其境外论坛之一发现了包含 701
  名 SBU（乌克兰安全局）军官个人信息的文件 (Leaks 2022)。该文件含 11,055 条记录，涵盖电话号码、姓名、地址、军衔、职位及军官社交媒体账号链接，这些信息此前曾发布在黑客组织网站
  `NemeZida` 上 (Leaks 2022)。


  2022 年，RaHDIt 还收集并发布了约 1,500 名乌克兰外交情报局工作人员的照片和个人信息、数千条被俄军俘虏的乌克兰士兵记录、乌克兰 IT 军成员及其他敏感信息。


  #### 攻击乌克兰“德尔塔”系统


  如前所述，Joker DPR 专注于攻击乌克兰数字实体。对 Joker 频道内容的分析表明，该黑客通过开源渠道收集了大量信息。除了攻击国家和私人网站，Joker
  DPR 还入侵了各平台上的社交媒体账号和聊天群组。据称，Joker DPR 维护着一个由各类男女性个人档案组成的网络，这些档案在乌克兰聊天群（包括封闭群组）中拥有长期成员身份。通过这些聊天群、开源渠道及其他资源，Joker
  DPR 收集并生成了关于乌克兰军事人员的个人信息，并将其传递给关联的 Telegram 频道“Solnzepek”。





  ### Joker DPR 声称攻击乌克兰“德尔塔”系统


  #### “德尔塔”系统的背景


  2022 年 11 月，Joker DPR 凭借其 2022 年最重大的成就，给俄语受众留下了深刻印象。2022 年 11 月 1 日，DPR 黑客 Joker
  声称成功攻击了“德尔塔”态势感知系统。一个乌克兰 IT 团队为此系统工作了数月，并于 10 月 25 日在弗吉尼亚海滩举行的 TIDE Sprint 活动上展示了成果。其团队成员包含国防部、创新与国防技术发展中心以及数字化转型部的代表。在特定的发展阶段，北约
  IT 专家加入了该项目（Urbanska 2022）。鉴于此，重要的是要强调，2022 年 7 月，在与北约专家会晤后，乌克兰获得了多边互操作性计划（MIP）成员资格，这使乌克兰有机会成为与北约国家技术合作的一部分（乌克兰国防部
  2022）。显然，从那时起，外国 IT 专家便与乌克兰“德尔塔”团队建立了紧密联系。值得注意的是，“德尔塔”系统的创建者使其兼容北约技术标准。此外，该平台曾在
  2019 年和 2020 年的北约 CWIX 活动中进行测试（Halchynskyi 2021）。尽管如此，这一创新项目并未获得军方官员的支持，于 2021 年被搁置。


  在 TIDE Sprint 活动的介绍性致辞中，数字化转型部长米哈伊洛·费多罗夫强调，乌克兰 IT 团队一直致力于推进数字战争技术，并取得了前所未有的突破（Fedorov
  2022）。其目标是实现战场上的“完全信息感知”（Fedorov 2022）。这种“感知”指的是实时更新的地图、敌军兵力数量、其位置、军事能力、加油站、工事及其他关键信息。


  值得注意的是，该交互式系统包含有关乌克兰武装部队、其单位和战略目标的信息。在其协助下，每个军事旅均可相互连接并协作。该系统收集的信息对军事单位、指挥官、飞行员甚至机动医疗队至关重要。军方获得了查看交互式实时战场视图的机会，这增强了规划能力并加快了战术决策。这是相对于俄军的一个显著优势。


  自战争开始以来，“德尔塔”平台已在对抗俄军的实战中成功接受检验。最初，“德尔塔”团队为乌克兰首都基辅提供防御（Urbanska 2022）。随着其技术能力和有效性的增强，系统开始覆盖其他地区并扩大参与者数量。


  #### 黑客的挑衅与声称


  如前所述，费多罗夫于 10 月 25 日就“德尔塔”系统进行了演示。随后，10 月 31 日，黑客“Joker DPR”因乌克兰的一段视频素材而感到愤怒。不清楚这段素材何时录制，黑客是如何获得的。视频中，一名乌克兰军人宣传“德尔塔”系统的独特特性（Joker
  DPR 2022）。该军官通过地图的缩放操作，羞辱其俄军对手——后者仍使用老式纸质地图，而乌克兰武装部队依赖现代技术。黑客认为这种暗示具有冒犯性，并承诺很快向其
  Telegram 追随者透露一些令人振奋的消息。第二天，Joker DPR 宣布对战场实时监控系统实施了有效打击（Joker DPR 2022）。


  为证明攻击，黑客播放了一段视频，展示了他在疑似“德尔塔”程序内部的在线操作（Joker DPR 2022）。在该视频下方，Joker DPR 发布了一条长消息，披露了“德尔塔”系统主管的姓名、个人信息（电子邮件、护照号码和地址）、位置及一些技术参数。黑客称该基地位于乌克兰第聂伯罗彼得罗夫斯克。据称，该系统依赖
  Google 认证，并使用了两个开源应用：文件同步与共享应用 Nextcloud 和 Element（RIA News 2022）。


  此外，Joker 称他并非唯一试图入侵“德尔塔”监控平台的人。据他称，KillNet 组织也将“德尔塔”列入了打击名单。从声明来看，这次攻击并非 Joker 专业技能的唯一展示。他意在支持在战场上接连遭遇失败的俄军。Joker
  DPR 提到是他实施了攻击，但未透露任何细节。目前未知黑客是否真将“德尔塔”密钥提供给军方，因为俄方官员保持沉默。


  #### 事件分析


  关于此次黑客攻击，有几个问题浮现：攻击何时实施？俄军使用该系统有多久了？黑客为何宣布攻击？这些问题颇具吸引力。合乎逻辑地，存在两种情景：黑客捏造了攻击，或 Joker
  DPR 在失去对“德尔塔”系统的访问权限后才宣布了入侵。如果攻击确实发生，其持续时间问题便变得至关重要。


  也许他仅入侵“德尔塔”平台很短一段时间，随后其踪迹被迅速发现，乌克兰“德尔塔”专家恢复了其安全性。黑客随即宣称成功。另一种情景是，Joker DPR 很久以前就入侵了该资源，并将其密钥提供给俄军（当地军事单位、指挥官等）。当失去对“德尔塔”系统的访问权限时，黑客宣扬了他的成就。


  对于这位爱国的亲俄黑客而言，为名声或自我满足而宣布入侵似乎存疑。然而，可以肯定的是，此次黑客攻击绝非为了追求个人目标。


  #### 乌克兰当局的回应


  乌克兰当局对攻击信息的反应迅速且直接。在 Joker DPR 宣布行动的当天，国防部发布声明否认了入侵事件：“未记录到未经授权的渗透”（乌克兰国防部 2022）。该部门将该指控定性为反乌克兰信息战的一部分。根据声明，这是在
  TIDE Sprint 会议于美国举行演示后，针对“德尔塔”系统预谋的心理“虚假信息攻击”（乌克兰国防部 2022）。此外，乌克兰国防部向公民保证，“德尔塔”平台正按常规时间表不间断运行。





  尽管国防部否认了被黑客攻击的指控，但乌克兰记者、《Cenzor.net》主编尤里·布图索夫的 Facebook 帖子披露了关于隐秘网络战更多引人入胜的细节。他的说法与国防部的解释一致，他指出了
  2022 年 8 月发生在 `Delta` 平台内的两次短暂但成功的敌方安全漏洞。这位记者陈述了显而易见的事实——俄罗斯情报机构特工持续试图入侵乌克兰军方人员的手机和电脑；据他称，俄罗斯特工反复利用社交媒体和电子邮件钓鱼，传播带毒链接（Butusov
  2022）。来自哈尔科夫和克里沃伊罗格地区的两名乌克兰军人设备感染了俄罗斯恶意软件，为黑客进入 `Delta` 监控系统提供了入口。然而，为防止未经授权的访问，`Delta`
  创始人建立了多层防护，每个用户拥有各自的访问级别；部分信息仅对指挥官可见，而对普通士兵不可见（Butusov 2022）。8 月期间，亲俄黑客在 `Delta`
  内部停留了十三分钟，但他们只能在受害者的数据访问权限范围内活动（Butusov 2022）。因此，泄露的关键信息不多；而且，由于战场局势高度动态，这些信息迅速过时了。然而，布图索夫的说法缺乏其他证据或乌克兰官方人士的证词支持。


  “小丑 DPR”在声称入侵了 `Delta` 系统一事上自食其果，但他仍然称尤里·布图索夫为骗子。不过，这名黑客也承认该记者总体上承认了网络攻击的存在（JokerDPR,
  Butusov’s statement 2022）。两天后，又发布了一份回应，其中“小丑 DPR”同意布图索夫的观点，承认 8 月确实发生了针对 `Delta`
  的攻击。然而，攻击者声称系统对黑客开放的时间远超十三分钟：“我的黑客在 8 月入侵了 `Delta`。所有其他信息都是厚颜无耻的谎言……布图索夫撒谎称他们只获得了
  13 分钟的访问权限，且仅涉及乌克兰南部地区”（JokerDPR 2022）。此外，“小丑 DPR”否认了成功实施钓鱼攻击及两名乌克兰军官涉事的说法：


  > 我们并未像你所写的那样使用钓鱼手段进行黑客攻击……我们渗透了 `Delta` 平台，进而我们在 `Delta` 内部发现了这些人……此外，我们去拜访并给其他拥有以下登录名的
  `Delta` 用户留下了“礼物”：VadimFox, Santiago, Boris, Metodist, Balamut, Odessa, ofelia20
  等（JokerDPR 2022）


  声明末尾，他留下了挑衅性言辞，建议“美国专家对该平台进行调查”，因为其阿喀琉斯之踵在于乌克兰一方。几天后，大量 `Delta` 据称的内部信息页面在 Telegram
  上公开可用。通过泄露这些文件，“小丑 DPR”试图消除外界对入侵真实性的质疑，避免自己沦为笑柄。


  俄罗斯方面的反应是兴高采烈且鼓舞人心的，但也并非没有尖锐的批评。为厘清俄罗斯媒体对该网络攻击的立场，本研究选取并审视了六家最受欢迎的媒体资源：*Vzglyad*
  (Vz.ru)、*Moscovsky Komsomolets* (MK)、*Lenta.ru*、*Russia Today* (俄语版)、*RIA News*
  和 *Rossiyskaya Gazeta* (RG)。测试了以下问题：它们关于该攻击的主要信息来源是什么？`Delta` 系统由哪个国家开发？哪方实体从这次黑客攻击中获益？


  在俄罗斯官方缺乏关于 `Delta` 入侵的正式表态的情况下，这些媒体关于黑客事件的文章大量引用了广为流传的“小丑”接受 *RIA News* 采访的内容和丹尼尔·贝索诺夫的帖子，彼此雷同（RIA
  News 2022）。在这些媒体中，关于 `Delta` 系统的起源并无共识。顺应“小丑”的说法，六家媒体中有五家强调被入侵的乌克兰平台源自美国。例如，*MK*
  记者达里娅·费多托娃写道：“‘小丑 DPR’ 组织宣布攻击了美军方积极使用的美国 DELTA 指挥控制程序”（Fedotova, Hackers reported
  about an attack on the Delta system 2022）。*RG* 网站的文章将 `Delta` 平台称为美国送给乌克兰的“礼物”，并强调“盟军”的网络行动人员破坏了其可靠性和声誉（Valagin
  2022）。文章作者最后得出了一个轻率的结论：乌克兰军队应改用老式方法（电话、纸质地图等），而非过度依赖现代技术（Valagin 2022）。有趣的是，唯一宣称
  `Delta` 系统源自乌克兰的新闻资源是 *RIA News* (RIA News 2022)。尽管其他报纸引用了这篇 *RIA* 文章，但主要忽略了这一事实（Fedotova,
  Hackers reported about an attack on the Delta system 2022; Ivanova 2022; Russia
  Today 2022）。正如预期，俄罗斯媒体平台强调此次网络攻击给俄罗斯军队带来了巨大利益。在接受 *MK* 报纸采访时，军事专家阿列克谢·列翁科夫表示，俄罗斯军队获得了大量有用信息，但不包含未来行动计划（Fedotova,
  Interview with A. Leonkov 2022）。通过这次成功的入侵，俄罗斯军事专家获得了了解这套美国制造系统的机会，而乌克兰正是在其全球推广前拿来试验的（Fedotova,
  Interview with A. Leonkov 2022）。


  尽管如此，俄罗斯媒体并未开始拼凑“小丑”说法背后的幕后事实（Ivanova 2022; Russia Today 2022; Valagin 2022）。当俄罗斯媒体搁置批判性思维时，其读者和
  Telegram 用户却提出了一些问题（Russia Today 2022）。人们在 *Russia Today*、*Vzlyad.ru*、奥列格·扎廖夫、“瓦格纳俱乐部”、*IzoLenta*、罗戈津及其他
  Telegram 和 VKontakte 社交媒体账号的评论区撰文并对该说法做出反应。前乌克兰议员、地区党成员奥列格·扎廖夫，以及来自“公正俄罗斯”党的国家杜马议员阿纳托利·瓦塞尔曼公开表达了担忧。两位政治人物均否定了公开
  `Delta` 攻击事件背后的基本原理（Tzaryov 2022; Wasserman 2022）。这位前乌克兰政界人士承认入侵是极好的消息，但不必要的宣传可能会削弱其效益（Tzaryov
  2022）。


  奥列格·扎廖夫仅就入侵发布了一篇简短帖子，而阿纳托利·瓦塞尔曼则不仅限于简短记录。瓦塞尔曼发表文章强调道：


  > 我唯一的希望是 `Delta` 的信息已被用于我方利益。为了未来，我坚持认为，我们平民只有在所有获取的信息均已应用并失去时效性后，才应得知针对敌人的成功网络攻击。（Wasserman
  2022）


  字里行间透着苦涩的悲哀，作者强调拉丁语成语“praemonitus, praemunitus”（预则立，不预则废）原来是必须遵循的绝妙建议：“对手越少知道我们的成功，我军就能越有效地粉碎他们。现在，公开声称之后，对手团队正努力加强
  `Delta` 的防护及其信息流”（Wasserman 2022）。再无其他来自学界或政界的知名人士试图审视此次攻击并表达意见。





  ## 目标 # 2 欧洲、英国和美国


  总体而言，亲俄 Telegram 博主和新闻频道表现出了相似的做法。值得注意的是，这种侵略行为不仅增加了亲战媒体和电视人物（如弗拉基米尔·索洛维约夫和阿尔缅·加斯帕良）的知名度，也提升了许多此前不为人知或不太受欢迎的博主和个人（其中许多人是专业记者甚至政治家）的知名度；他们是战地记者和分析师，如谢苗·佩戈夫、德米特里·瓦西列茨、波多利亚卡、弗拉德连·塔塔尔斯基等。为了确定他们对
  Delta 系统被黑事件的立场，本研究审查了以下 Telegram 频道：鲁坚科、谢姆琴科、塔季扬娜·蒙特扬、加斯帕良、WarGonza（谢苗·佩戈夫）、弗拉德连·塔塔尔斯基、德米特里·瓦西列茨、尤里·波多利亚卡、索洛维约夫、斯拉德科夫、科茨新闻、瓦格纳俱乐部、Mria、Anna-News、雷巴尔、Readovka、奥斯塔什科重要、波杜布内和
  IzoLenta。


  其中一些实体是主要来源，另一些则是次要来源。此外，绝大多数频道相互关联，这有助于其管理员以惊人的速度接收和传播信息。在十九个 Telegram 频道中，有九个频道互相转发，或转发了
  Joker’s 或 Bezsonov’s 的 Telegram 频道。三个频道在原帖基础上添加了自己的描述，而另外五个频道则完全未改动原始消息。然而，这三个修改过帖子的账号均未在其修改后的帖子中包含新细节。与引用主要来源刊登文章的俄罗斯报纸相比，Telegram
  频道进行转发时极少修改或完全不修改。值得注意的是，无论是报纸还是 Telegram 新闻源，都没有对这一重要新闻进行后续跟进，也没有对乌克兰、全球或国内实体进行额外调查。尽管乌克兰国防部声称遭受了俄罗斯协同信息攻击，但这一新闻并未得到充分准备、呈现或传播。俄罗斯官员在其账号中忽略了这一新闻，未对这一关键问题发表评论。乌克兰战争每天都产生大量新闻；对于俄语受众而言，Delta
  系统被黑事件仅仅是信息洪流中另一个昙花一现的插曲。


  有趣的是，对这一黑客事件相对有限且浅显的报道，反而被俄罗斯消息源对瓦列里·F·扎卢日内 Instagram 账号被盗事件的广泛关注所掩盖。对俄罗斯媒体而言，乌克兰总司令有争议的通信泄露似乎比前者更重要，至少更引人好奇。2022
  年 11 月 3 日，亲俄黑客声称攻破了扎卢日内的 Instagram 页面。总司令的粉丝被两张新照片搞得一头雾水。首先，Joker DPR 将头像改为普京总统骑熊且背景为俄罗斯国旗的流行照片
  (Joker DPR 2022)。随后，粉丝们惊讶地看到了 Joker 身穿军装的照片，配文称：我确认 Joker DPR 攻破了 Delta 系统。起初，困惑的粉丝们以为这是个玩笑。这条有争议的帖子甚至收获了
  594 个“赞”和大量好评 (Joker DPR 2022)。过了一会，Instagram 用户意识到扎卢日内的账号是由他人而非账号所有者运营的。为证实入侵，黑客制作了数段账号内容视频。他录制了扎卢日内与三名女性的私信，以及
  Joker 照片下的评论。对 Joker DPR 而言，此举是为了修复其动摇的声誉；通过这场声势浩大的攻击，黑客公开宣示了其或其团队的能力。


  不幸的是，瓦列里·F·扎卢日内对这一泄露事件的情绪化反应证实了 Joker 的说法。反应极不理性，以至于当扎卢日内重新掌控账号后，一段时间内并未移除指向 Joker
  DPR 账号的 Telegram 链接 (Joker DPR 2022)。在宣布被黑事件时，扎卢日内写道：


  > 愤世嫉俗的畜生没有道德底线！既然在战场上打不赢我们，就对我们的孩子和家庭下手。最容易的方式就是黑掉我的个人账号，这与我的工作无关。这里只有孩子和家庭的照片。你们以此为荣。你们不是展示孩子和家庭，而是展示了你们自己——杀人犯。这次攻击证明了兽人必须被消灭！我们会杀光他们！(Beregini
  2022)。


  回到 Delta 系统被黑事件，50% 的亲俄黑客组织也错过了关于 Delta 系统遭攻击的信息。然而，KillNet 及其附属组织 Legion 和 Anonymous
  Russia，以及 Beregini 表达了他们的观点。Anonymous Russia 的反应中立，Beregini 强调了其与 Joker DPR 过往的合作，并增加了关于乌克兰
  Delta 团队的新细节。相比之下，KillNet 组织账号对 Joker DPR 发起了严厉批评：


  > 我反复研究过黑客数据泄露。躲在 Joker 昵称背后的人确实很厉害，为我们的胜利做出的贡献比所有黑客活动家加起来还大。但我必须表达我的遗憾……任何数据一旦泄露就不再有价值。它的价值消失了……你们在顿涅茨克疯了吗？如果一个部门全盘使用了这些数据，并不意味着数据对其他部门就没用了……任何信息都可以被多次利用……学会隐蔽工作，别搞那些无脑的宣传……我再重申一次：你们确实很厉害（总体上）；但在这件事上，你们是白痴……(Pisar
  iz Shtaba 2022)


  显然，这种反应是 Joker 嘲讽 KillNet 所引发的，后者试图攻破 Delta 系统但以失败告终。KillNet 这种情绪化、幼稚的回应，伴随着大骂脏话，阻碍了未来的合作与行动协调。因此，亲俄黑客“社区”并未展现出团结，而是表现出竞争、紧张和嫉妒。






  ### 俄罗斯黑客将欧盟成员国作为主要攻击目标


  对于俄罗斯黑客而言，欧盟成员国已成为最令人垂涎的目标。在 2022 年 2 月 24 日至 12 月 31 日期间，他们对欧洲数字实体发动了 2,448 次网络打击。这占俄罗斯黑客发动的所有攻击的
  57%，比同期针对乌克兰的网络攻势数量高出约 20%。如前所述，并非所有黑客组织都对外国网站实施打击；例如，XakNet 在其公开帖子和采访中特别强调了这一特点。Beregini
  和 Joker DPR 也是如此。另一个黑客组织 Zarya 在从 KillNet 获得独立地位后，专门针对乌克兰实体。相反，从 KillNet 的品牌建设角度来看，欧盟至关重要，因此欧盟目标在
  KillNet 的攻击概况中占比显著（1,640 个网站）。KillNet 声称对黑客组织在欧洲数字平台上发动的所有网络攻势中的 67% 负责；NoName057(16)
  以 723 次打击（29.5%）位居第二。在该时间范围内，另外两个组织——People’s Cyber Army 和 FRWL——合计负责的网络攻击不足 3%。值得一提的是
  Anonymous 在隶属于 KillNet 之前的活动。其黑客团队成立后不久便开始尝试攻击欧洲目标，截至 2022 年 9 月，Anonymous Russia
  共攻击了 24 个（0.9%）欧洲数字实体。作为 KillNet 的一个分支，该组织成为在 KillNet 品牌旗帜下在欧盟发动网络勒索的先锋。


  与乌克兰的情况类似，绝大多数网络攻击（46%）发生在 2022 年春季，而在夏季和秋季，黑客对欧盟的施压强度降低了 20% 以上。2022 年 3 月 1 日至
  5 月 31 日期间共发生 1,137 次打击，而 2022 年 6 月 1 日至 11 月 30 日期间，俄罗斯黑客组织组织了 1,147 次攻击。2022
  年 12 月，其活动相对放缓，降至 6.6%（即 164 次打击），主要由 NoName057(16) 实施。2022 年秋季，People’s Cyber Army
  平均每月攻击 7 个欧洲网站，但 2022 年 12 月仅声称实施了 4 次攻击。KillNet 呈现出类似的下降趋势：2022 年 9 月 1 日至 11 月
  30 日期间，其平均每月攻击 98 个网站，然而 12 月仅有 13 个欧盟网站遭到 KillNet 团队攻击。如前所述，这一趋势可归因于即将到来的假日季，即便是俄罗斯的宣传机器也会从持续向民众灌输政治新闻、观点和分析中转移注意力。


  ### Kill Net 在欧盟的首个受害者：波兰


  KillNet 在欧盟的首个受害者是波兰。冲突爆发两天后，一个名为 `polandhub.pl` 的新闻门户网站遭到攻击（We are KillNet 2022）。KillNet
  声称其黑客攻击该新闻网站，是因为波兰政府决定自 2022 年 2 月 25 日起关闭领空，禁止俄罗斯航空公司进入（Wilczek 2022）。波兰总理莫拉维茨基在
  Facebook 上表示：“我已下令准备部长会议决议，这将导致波兰领空对俄罗斯航空公司关闭”（Reuters 2022）。KillNet 为何决定攻击一个用俄语发布波兰新闻和广告的网站尚不清楚，显然波兰社会几乎对此次报复性网络攻击一无所知。


  在针对波兰发布数条公开挑衅帖子后，该黑客组织在不到二十天内重返对波兰网站的网络勒索行动。3 月 23 日，KillNet 发布视频称，如果波兰将北约拖入俄乌之间的这场持续冲突，它将“加密该国的信息系统”（We
  are KillNet 2022）。这一威胁视频得到了对波兰国家银行实施网络打击的佐证（We are KillNet 2022）。事实上，在此视频发布后，KillNet
  对波兰发起了一连串网络攻击。3 月 25 日和 26 日，波兰最高法院和投资贸易局的官方网站遭受网络攻击。据该黑客团队声称，从 `paih.gov.pl` 服务器窃取了超过
  20 GB 的数据并发布在网络存储空间上（We are KillNet 2022）。


  ### 攻击范围扩大至多个欧洲国家


  4 月，KillNet 黑客瞄准了包括法国、德国、拉脱维亚在内的多个欧洲国家。为寻求广泛关注，黑客向欧洲发布声明：


  > 十天内我们在十个国家（波兰、德国、捷克共和国、爱沙尼亚、美国、英国、法国等）发动了攻击。在这些国家，关键基础设施的安全已成为一个问题。这无法在一个月甚至一年内解决。欧洲网络安全专家无法控制局势，他们未做好网络对抗的准备。我们展示了在普通公民生活中制造混乱和不便是多么容易。欧洲当局未采取任何行动保护敏感信息……明天我们将找上你的国家！（We
  are KillNet 2022）


  显然，成功的攻击让黑客信心大增，他们强调将继续攻击欧洲的私营和国营组织。


  有趣的是，KillNet 强调其黑客攻击了法国数字实体，但该组织未提供截图证明这一说法。然而，2022 年 3 月 3 日，KillNet 对埃马纽埃尔·马克龙的平台（`en-marche.fr`）实施了
  DDoS 攻击，导致其瘫痪数小时。KillNet 团队强调，法国 IT 专家在 19 小时后阻止了此次攻击（We are KillNet 2022）。


  ### 针对波罗的海国家的政治动机攻击


  针对波罗的海国家的政治动机攻击始于对拉脱维亚外交部的 DDoS 攻击（We are KillNet 2022）。该攻击于 3 月 21 日发动，此前拉脱维亚首都里加警方于
  3 月 17 日拘留了当地俄裔博主基里尔·费多罗夫（TASS 2022）。当黑客攻击国家实体时，俄罗斯当局试图于 2022 年 3 月 17 日就费多罗夫被捕表达关切：


  > 我们对拉脱维亚再次发生严重侵犯基本人权的事实感到愤慨，当地知名网络博主基里尔·费多罗夫因对俄罗斯在乌克兰的特别军事行动发表评价而被拘留。里加再次表明，其签署的关于言论自由和获取信息的国际承诺，实际上对其毫无意义。（TASS
  2022）


  经过数月拘留，2023 年 3 月，俄罗斯媒体资源发现该博主在莫斯科行走（News.ru 2023）。






  ### 俄罗斯黑客对波罗的海国家、英国、美国及其他国家的网络攻击


  #### 波罗的海国家遭受的持续攻击


  波罗的海国家反复成为俄罗斯黑客的攻击目标。5 月，KillNet 的一个分支 `Legion` 协调了一次针对拉脱维亚高校、出租车服务、旅游机构、健身俱乐部、国内互联网服务商以及以下国家部门的政治动机打击：外交部
  (`mfa.gov.lv`)、宪法法院 (`satv.tiesa.gov.lv`) 和最高法院 (`at.gov.lv`) (We are KillNet 2022)。


  2022 年夏季，由于波罗的海国家政府采取措施移除苏联纪念碑，并阻碍部分货物运往俄罗斯加里宁格勒州，该地区发生了大量网络勒索事件 (Hoppner 2022;
  Rosenberg 2022)。8 月，当爱沙尼亚当局开始移除苏联纪念碑时，KillNet 发起了另一场网络勒索活动，作为对爱沙尼亚政府决定的报复行动 (Euronews
  2022)。其黑客声称攻击了由私营和国家组织运营的 200 多个爱沙尼亚数字平台。经济事务和通信部数字化转型次长 `Luukas Ilves` 证实了 KillNet
  的 DDoS 洪峰攻击，并强调这些网络打击“在很大程度上未被察觉”，尽管存在“一些短暂且轻微的例外，网站全天保持完全可用” (Luukas Ilves 2022)。


  #### FRWL 和 NoName057(16) 加入反波罗的海任务


  `FRWL` 和 `NoName057(16)` 当时加入了 KillNet 的反波罗的海任务。因加里宁格勒州被封锁而愤怒，`NoName057(16)` 在波罗的海国家传播英文邮件：


  > 作为俄罗斯黑客社区的一部分，我们强烈建议你们向你们国家的政治家和当局发送信息。信息内容是关于解决从俄罗斯到俄罗斯加里宁格勒州的过境货运问题。否则，立陶宛将成为
  IT“保留地”。我们绝对拥有足够的技能和知识，将你们的信息基础设施送回石器时代。请三思并找到正确的解决方案。此致，@NoName057(16).^(22) (FRWL
  2022)


  黑客将这封邮件发给了立陶宛国家铁路公司 `LTG`（一家国家所有企业），时间为 2022 年 6 月。据 `NoName057(16)` 黑客称，该公司回复道：


  > 关于贵方要求 LGT 公司影响立陶宛共和国政府以撤销欧盟关于向加里宁格勒转运货运的制裁，我们恭敬地通知你们：所谓的“俄罗斯黑客社区”去 f . . . 你自己^(23)
  (FRWL 2022)。


  这一回复激怒了发件人和其他俄罗斯黑客，他们决定加速对该国数字实体的网络攻击。值得注意的是 `Avast` 关于 `NoName057(16)` 攻击欧洲网站的研究，其效果并不显著，“该组织的成功率”仅为
  40%：


  > 我们将 C&C 服务器发送给 `Bobik` 僵尸网络的目标列表与该组织发布在其 Telegram 频道的内容进行了比对。托管在安全防护完善的服务器上的网站可以抵御攻击。该组织声称负责的攻击中，约
  20% 与其配置文件中列出的目标不符。 (Avast 2022)


  #### 对挪威的威胁


  2022 年 7 月 1 日，`FRWL`（于 2022 年 6 月出现在俄语网络空间）警告挪威当局，他们将发布一款名为 `Somnya` 的加密病毒，该病毒由
  `FRWL` 团队创建 (FRWL 2022)。这一威胁声明是在挪威当局于 2022 年 6 月确认向乌克兰移交另一批军事装备后发布的 (CNN 2022)。该黑客组织是否释放了此恶意软件仍不得而知。此外，`FRWL`
  在其公开帖子中未提及该加密病毒。


  #### 英国遭受的攻击


  鉴于英国持续支持乌克兰及英国官方的政治声明，英国本可能成为俄罗斯黑客的诱人目标。然而，在所呈现的时间范围内，仅有两个黑客组织——`KillNet` 和 `NoName057(16)`——公开宣布对英国网站发动网络攻击。这两个黑客团队共实施了
  11 次 DDoS 打击 (0.25%)，而俄罗斯黑客组织总共实施了 4,295 次网络攻势。


  #### 美国遭受的攻击


  2022 年 2 月 24 日至 12 月 31 日期间，四个黑客组织——`KillNet`、`NoName057(16)`、`People’s Cyber Army`
  和 `FRWL`——决定对美国网站实施网络攻势。`NoName057(16)`、`People’s Cyber Army` 和 `FRWL` 负责 8 次行动，而
  `KillNet` 组织了另外 196 次网络打击，以 DDoS 攻击为主。事实上，所分析的黑客团队在该时期发起的所有网络攻击中，有 5% 以美国私营和国营组织为目标。


  为兑现其反美宿怨，`KillNet`^(24) 于 2022 年 3 月 28 日对康涅狄格州温莎洛克斯的 `Bradley International Airport`
  发动了 DDoS 攻击。在一篇英文 Telegram 帖子中，黑客声称他们扰乱了其运营：


  > 暂时无法购买机票，向 Joe Biden 道歉。此举并非恐怖袭击，而是暗示美国政府并非欧洲数百万生命的主宰。当向乌克兰的武器供应停止时，对贵国信息结构的攻击将立即停止！美国，没人怕你们。^(25)
  (We are KillNet 2022)


  值得注意的是，2022 年 5 月 11 日，在攻击利沃夫地方政府网站后，`People’s Cyber Army` 宣布对白宫发动 DDoS 攻击，要求其聊天成员做好集体行动准备
  (People’s Cyber Army 2022)。然而，黑客并未像往常那样公布网站瘫痪的截图，且此后数月 `People’s Cyber Army` 未对美国网站发动网络攻势；直到
  2022 年 11 月，其黑客团队才宣布对美国的第二次攻击。此时，`People’s Cyber Army` 暂时关闭了私营军事公司“Mozart”运营的一个网站，其成员在乌克兰与俄军作战
  (Newton 2022)。`The Mozart Group` 未证实该网络攻击。因此，这两点观察表明，对白宫官方网站的攻击对 `People’s Cyber
  Army` 黑客而言是一次不幸的经历，他们显然吸取了教训，转而倾向于攻击美国境外的目标。


  #### 其他国家遭受的攻击


  除了美国、乌克兰、欧盟和英国，黑客团队有时也会对其他国家实施攻击。然而，此类攻击的比例微不足道，不足 1%。例如，2022 年夏季，`KillNet` 的附属组织
  `Zarya` 宣布成功攻击哥伦比亚多个网站，包括其国立学院 (`casb.edu.co`)。`Zarya` 通过该学院网站获取了大量有价值数据，并于 2022
  年 7 月在 Telegram 上发布 (Zarya 2022)。9 月，轮到日本成为俄罗斯黑客的目标。`KillNet` 黑客声称攻击了 23 个日本网站，包括在线社交网络服务
  `Mixi` 和国家门户网站 `e-Gov` (`e-gov.go.jp`) (We are KillNet 2022)。





  ## 俄罗斯黑客攻击目标分析


  对于俄罗斯黑客而言，欧盟的数字实体似乎是最理想的目标。在 2022 年 2 月 24 日至 12 月 31 日期间，俄罗斯黑客团队共实施了 4,295 次网络攻击，其中针对欧盟的攻击高达
  2,448 次，占比 57%。乌克兰成为第二大目标，其网络空间遭受了 1,610 次攻击，占所有网络攻击的 37%。相比之下，英国的在线平台对黑客吸引力不大，而美国的国家和私人网站仅遭受了
  204 次打击（占比 5%）。


  俄罗斯黑客大多忽视英国的原因尚不清楚。就美国而言，大多数黑客团队倾向于避免攻击其网站，因为美国并非一个容易得手的目标。由于几十年来一直是各类黑客的热门目标，美国国内的
  IT 专家经过良好训练，已做好保护美国网络空间的准备。


