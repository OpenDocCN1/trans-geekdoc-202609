    **Yuntao Wu** (M’12) received the Ph.D. degree in information and communication
    engineering from the National Key Lab. for Radar Signal Processing at Xidian University
    in December 2003. From April 2004 to September 2006, he was a Post-Doctoral Researcher
    at Institute of Acoustics, Chinese Academy of Sciences, Beijing, China. From Oct.
    2006 to Feb. 2008, he was a Senior Research Fellow at the City University of Hong
    Kong. From April 2013 to March 2014, he was a Visiting Researcher in the Faculty
    of Engineering, Bar-Ilan University, Israel. Currently, he is a Full-Time Professor
    at the Wuhan Institute of Technology. At the same time, he is also a Chutian Scholar
    Project in Hubei Province Distinguished Professor at the same university. He has
    published over 60 journal and conference papers. He is a senior member of the
    Chinese Institute of Electronic Engineers (CIE), and an Associate Editor of Multidimensional
    Systems and Signal Processing (an international journal of Springer). His research
    interests include signal detection, parameter estimation in array signal processing
    and source localization for wireless sensor networks, biomedicine signal analysis,
    etc.

