    ## III. 所提方法


    ### A. 单基频情况下的空时信号模型


    为了清晰地阐述所提方法，我们首先关注单基频情况下的参数估计问题，即信号模型(1)中 \(P = 1\) 的情况。在信号模型(1)中，对于 \(P = 1\)，接收阵列数据可写为


    \[

    x_r(n) = s_r(n) + q_r(n), \quad n = 0,1,\ldots,N-1,

    \]


    \[

    s_r(n) = \sum_{l=1}^{L} \alpha_l e^{j(\omega l n + \varphi l r)} \tag{3}

    \]


    在这种情况下，只需从观测信号中估计一对未知参数 \((\omega, \varphi)\)。基于上述模型，首先定义如下的空时矩阵信号模型


    \[

    X(n) = S(n) + Q(n), \quad n = 0,1,\ldots,N-M, \tag{4}

    \]


    其中


    \[

    X(n) = \begin{bmatrix}

    x_0(n) & \cdots & x_0(n+M-1)\\

    \vdots & \ddots & \vdots\\

    x_{R-1}(n) & \cdots & x_{R-1}(n+M-1)

    \end{bmatrix}, \tag{5}

    \]


    且 \(S(n)\) 和 \(Q(n)\) 的定义与 \(X(n)\) 类似。此外，\(M\) 是一个给定的正整数，其小于 \(N\) 且满足 \(MR >
    L\)。所关注的信号矩阵 \(S(n)\) 可通过(3)改写为


    \[

    S(n) = \sum_{l=1}^{L} \beta_l(n) \mathbf{a}_s(l\varphi) \mathbf{a}_t^T(l\omega),
    \tag{6}

    \]


    其中


    \[

    \beta_l(n) = \alpha_l e^{j l \omega n}, \tag{7}

    \]


    \[

    \mathbf{a}_s(\varphi) = [1 \ e^{j\varphi} \ \cdots \ e^{j(R-1)\varphi}]^T, \tag{8}

    \]


    \[

    \mathbf{a}_t(\omega) = [1 \ e^{j\omega} \ \cdots \ e^{j(M-1)\omega}]^T. \tag{9}

    \]


    通过将 \(X(n)\) 的列堆叠，定义一个新的向量模型 \(x(n)\) 为


    \[

    \mathbf{x}(n) = \operatorname{vec}\{X(n)\} = \mathbf{s}(n) + \mathbf{q}(n) = \mathbf{A}\mathbf{z}(n)
    + \mathbf{q}(n), \tag{10}

    \]


    因此有


    \[

    \mathbf{s}(n) = \operatorname{vec}\{S(n)\}, \tag{11}

    \]


    \[

    \mathbf{q}(n) = \operatorname{vec}\{Q(n)\}, \tag{12}

    \]


    \[

    \mathbf{A} = [\mathbf{a}(\omega,\varphi), \ldots, \mathbf{a}(L\omega,L\varphi)],
    \tag{13}

    \]


    \[

    \mathbf{a}(l\omega,l\varphi) = \mathbf{a}_t(l\omega) \otimes \mathbf{a}_s(l\varphi),
    \tag{14}

    \]


    \[

    \mathbf{z}(n) = [\alpha_1 e^{j\omega n}, \ldots, \alpha_L e^{j L \omega n}]^T.
    \tag{15}

    \]


    基于上述数据模型(10)，文献[36]最近报道了一种在单基频情况下用于DOA和基频估计的非线性最小二乘方法，其中需要二维搜索计算以及相对精细的未知参数候选网格才能获得准确的DOA和基频估计，这会导致较高的计算负荷。在接下来的III-B节中，基于前一小节的空时模型推导了一种低复杂度的基于ESPRIT的方法，并在III-C节中给出了所提方法对多基频情况的推广。


    ### B. 单基频情况下DOA与基频的联合估计：多通道单基频ESPRIT（MSP-ESPRIT）


    对于 \(n = 0,1,\ldots,N-M\)，首先利用 \(\mathbf{x}(n)\) 定义如下矩阵：


    \[

    \mathbf{Y}_{RM\times(N-M+1)} = [\mathbf{x}(0)\ \mathbf{x}(1)\ \cdots\ \mathbf{x}(N-M)]
    = \mathbf{A}[\mathbf{z}(0)\ \cdots\ \mathbf{z}(N-M)] + [\mathbf{q}(0)\ \cdots\
    \mathbf{q}(N-M)] \tag{16}

    \]


    在矩阵 \(\mathbf{A}\) 满列秩的条件下，可以通过奇异值分解（SVD）或等价地通过对 \(\mathbf{Y}\) 的协方差矩阵进行特征值分解来获得信号子空间。信号子空间矩阵
    \(\mathbf{U}_s\) 由与 \(\mathbf{Y}\) 的最大奇异值相关联的 \(L\) 个奇异向量组成。众所周知，由 \(\mathbf{U}_s\)
    的列向量张成的信号子空间与矩阵 \(\mathbf{A}\) 中所有列向量张成的子空间相同；因此，存在唯一的非奇异矩阵 \(\mathbf{T}\)，使得
    \(\mathbf{U}_s = \mathbf{A}\mathbf{T}\)。利用 \(\mathbf{a}_t(\omega)\) 和 \(\mathbf{a}_s(\varphi)\)
    的固有结构，可以找到 \(\mathbf{A}\) 的平移不变性，从而利用经典的ESPRIT方法[19]分别估计DOA和基频参数。为此，我们首先定义以下四个选择矩阵：


    \[

    \mathbf{W}_1 = \begin{bmatrix} \mathbf{I}_{M-1} \\ \mathbf{0}_{1\times(M-1)} \end{bmatrix}
    \otimes \mathbf{I}_R, \quad

    \mathbf{W}_2 = \begin{bmatrix} \mathbf{0}_{1\times(M-1)} \\ \mathbf{I}_{M-1} \end{bmatrix}
    \otimes \mathbf{I}_R,

    \]


    \[

    \mathbf{W}_3 = \mathbf{I}_M \otimes \begin{bmatrix} \mathbf{I}_{R-1} \\ \mathbf{0}_{1\times(R-1)}
    \end{bmatrix}, \quad

    \mathbf{W}_4 = \mathbf{I}_M \otimes \begin{bmatrix} \mathbf{0}_{1\times(R-1)}
    \\ \mathbf{I}_{R-1} \end{bmatrix},

    \]


    其中 \(\mathbf{0}\) 是零向量。\(\mathbf{A}\) 的子矩阵 \(\mathbf{A}_i\) 进一步由上述选择矩阵 \(\mathbf{W}_i\)
    定义为


    \[

    \mathbf{A}_i = \mathbf{W}_i^T \mathbf{A}, \quad i = 1,2,3,4. \tag{17}

    \]


    根据上述定义和 \(\mathbf{A}\) 的结构，容易证明我们有以下方程


    \[

    \mathbf{A}_1 \boldsymbol{\Psi}_t(\omega) = \mathbf{A}_2, \tag{18}

    \]


    \[

    \mathbf{A}_3 \boldsymbol{\Psi}_s(\varphi) = \mathbf{A}_4, \tag{19}

    \]


    其中


    \[

    \boldsymbol{\Psi}_t(\omega) = \operatorname{diag}\{e^{j\omega}, \ldots, e^{jL\omega}\},
    \quad

    \boldsymbol{\Psi}_s(\varphi) = \operatorname{diag}\{e^{j\varphi}, \ldots, e^{jL\varphi}\}.
    \tag{20}

    \]


    设 \(\mathbf{U}_1,\mathbf{U}_2\) 和 \(\mathbf{U}_3,\mathbf{U}_4\) 是以与 \(\mathbf{A}_i\)
    由 \(\mathbf{A}\) 形成相同的方式从 \(\mathbf{U}_s\) 形成的子矩阵。根据ESPRIT方法的原理，\(\boldsymbol{\Psi}_t(\omega)\)
    和 \(\boldsymbol{\Psi}_s(\varphi)\) 的对角元素是 \(\boldsymbol{\Phi}_t =\) 的相应特征值。

