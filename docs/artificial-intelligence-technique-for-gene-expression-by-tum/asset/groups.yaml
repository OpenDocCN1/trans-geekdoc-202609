    # IV. ALGORITHM SUMMARIZATION AND COMPUTATIONAL COMPLEXITY ANALYSIS


    In this section we analyze the computational complexity of the proposed algorithms.
    To that end, Table I provides a detailed description of the three algorithms.


    In contrast to the NLS-based method for single pitch and the available MC-HMUSIC
    method for multi-pitch case, the main computational load of the proposed method
    is dominated by the computation of both the SVD of data matrix $\mathbf{Y}$ and
    the EVDs of the matrix pair $(\Phi_s,\Phi_t)$, which is around $O((RM)^2(N-M+1)+(L_1+L_2+\cdots+L_P)^3)$
    for the MMP-ESPRIT method and $O((RM)^2(N-M+1)+(LP)^3)$ for the MSP-MP-ESPRIT
    method, respectively, while the computation of the NLS-based method requires $O(NRL^2+L^3)$
    for per point in the search grid of 2-D parameters. Therefore, the whole computational
    load of the 2-D searching computation in the NLS-based method for single-pitch
    case is $O((NRL^2+L^3)g_\omega g_\theta)$, where $g_\omega$ and $g_\theta$ are
    the numbers of searches conducted along the frequency axis and DOA axis. The first
    part of the computational load of the MC-HMUSIC method is about $O((RM)^2(N-M+1))$,
    which is similar to the SVD computation of the proposed MSP-MP-ESPRIT method,
    but in addition, it needs $P$ 2-D searching computations to obtain the estimates
    of pitch and DOA for multi-pitch case. The 2-D searches in the MC-MUSIC method
