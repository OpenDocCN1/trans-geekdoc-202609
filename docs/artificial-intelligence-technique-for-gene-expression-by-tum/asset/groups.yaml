    \ 的 SVD。<br>3. 计算式 (60) 中两个矩阵 $\\Phi_t$ 和 $\\Phi_s$ 的特征值。<br>4. 使用式 (62) 估计音高和\
    \ DOA。 |\n\n## IV. 算法总结和计算复杂度分析\n\n在本节中，我们分析了所提算法的计算复杂度。为此，表 I 提供了三种算法的详细描述。\n\
    \n与针对单音情况的基于 NLS 的方法和针对多音情况可用的 MC-HMUSIC 方法相比，所提方法的主要计算负载集中在数据矩阵 $\\mathbf{Y}$\
    \ 的 SVD 计算以及矩阵对 $(\\Phi_s,\\Phi_t)$ 的 EVD 计算上，对于 MMP-ESPRIT 方法约为 $O((RM)^2(N-M+1)+(L_1+L_2+\\\
    cdots+L_P)^3)$，对于 MSP-MP-ESPRIT 方法约为 $O((RM)^2(N-M+1)+(LP)^3)$；而基于 NLS 的方法在二维参数搜索网格中的每个点上需要\
