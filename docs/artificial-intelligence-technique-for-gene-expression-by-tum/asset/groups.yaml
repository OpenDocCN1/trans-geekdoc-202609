    ## III. PROPOSED METHOD


    ### A. Spatial-Temporal Signal Model in the Single-Pitch Case


    To present the proposed method clearly, we first focus on the problem of parameter
    estimation in the single-pitch case, that is where \(P = 1\) in the signal model
    (1). In the signal model (1), for \(P = 1\), the received array data can be written
    as


    \[

    x_r(n) = s_r(n) + q_r(n), \quad n = 0,1,\ldots,N-1,

    \]


    \[

    s_r(n) = \sum_{l=1}^{L} \alpha_l e^{j(\omega l n + \varphi l r)} \tag{3}

    \]


    In this case, only a pair of unknown parameters \((\omega, \varphi)\) is estimated
    from the observed signal. Based on the above model, a spatio-temporal matrix signal
    model is first defined as follows


    \[

    X(n) = S(n) + Q(n), \quad n = 0,1,\ldots,N-M, \tag{4}

    \]


    where


    \[

    X(n) = \begin{bmatrix}

    x_0(n) & \cdots & x_0(n+M-1)\\

    \vdots & \ddots & \vdots\\

    x_{R-1}(n) & \cdots & x_{R-1}(n+M-1)

    \end{bmatrix}, \tag{5}

    \]


    and \(S(n)\) and \(Q(n)\) are defined similarly to \(X(n)\). In addition, \(M\)
    is a given positive integer, which is smaller than \(N\) and satisfies \(MR >
    L\). The signal matrix of interest \(S(n)\) can be rewritten by (3) as


    \[

    S(n) = \sum_{l=1}^{L} \beta_l(n) \mathbf{a}_s(l\varphi) \mathbf{a}_t^T(l\omega),
    \tag{6}

    \]


    where


    \[

    \beta_l(n) = \alpha_l e^{j l \omega n}, \tag{7}

    \]


    \[

    \mathbf{a}_s(\varphi) = [1 \ e^{j\varphi} \ \cdots \ e^{j(R-1)\varphi}]^T, \tag{8}

    \]


    \[

    \mathbf{a}_t(\omega) = [1 \ e^{j\omega} \ \cdots \ e^{j(M-1)\omega}]^T. \tag{9}

    \]


    Define a new vector model \(x(n)\) by stacking the columns of \(X(n)\) as


    \[

    \mathbf{x}(n) = \operatorname{vec}\{X(n)\} = \mathbf{s}(n) + \mathbf{q}(n) = \mathbf{A}\mathbf{z}(n)
    + \mathbf{q}(n), \tag{10}

    \]


    and hence we have


    \[

    \mathbf{s}(n) = \operatorname{vec}\{S(n)\}, \tag{11}

    \]


    \[

    \mathbf{q}(n) = \operatorname{vec}\{Q(n)\}, \tag{12}

    \]


    \[

    \mathbf{A} = [\mathbf{a}(\omega,\varphi), \ldots, \mathbf{a}(L\omega,L\varphi)],
    \tag{13}

    \]


    \[

    \mathbf{a}(l\omega,l\varphi) = \mathbf{a}_t(l\omega) \otimes \mathbf{a}_s(l\varphi),
    \tag{14}

    \]


    \[

    \mathbf{z}(n) = [\alpha_1 e^{j\omega n}, \ldots, \alpha_L e^{j L \omega n}]^T.
    \tag{15}

    \]


    Based on the data model (10), a nonlinear least squares method for DOA and pitch
    estimation in the case of single pitch was recently reported in [36], where the
    2-D search computation as well as relatively fine candidate grids for the unknown
    parameters are required to obtain accurate DOA and pitch estimates, which thus
    results in a high computational load. In the following Section III-B, a lower-complexity
    ESPRIT-based method is derived based on the spatio-temporal model in the previous
    subsection, and a generalization of the proposed method to the multi-pitch case
    is suggested in Section III-C.


    ### B. Joint Estimation of DOA and Pitch in the Single-pitch Case: Multichannel
    Single-pitch ESPRIT (MSP-ESPRIT)


    For \(n = 0,1,\ldots,N-M\), one first defines the following matrix with \(\mathbf{x}(n)\),


    \[

    \mathbf{Y}_{RM\times(N-M+1)} = [\mathbf{x}(0)\ \mathbf{x}(1)\ \cdots\ \mathbf{x}(N-M)]
    = \mathbf{A}[\mathbf{z}(0)\ \cdots\ \mathbf{z}(N-M)] + [\mathbf{q}(0)\ \cdots\
    \mathbf{q}(N-M)] \tag{16}

    \]


    Under the condition of full column rank of matrix \(\mathbf{A}\), one can obtain
    the signal subspace from the singular-value decomposition (SVD) or equivalent
    eigenvalue decompositions of the covariance matrix of \(\mathbf{Y}\). The signal
    subspace matrix \(\mathbf{U}_s\) is then composed of the \(L\) singular vectors
    associated with the largest singular values of \(\mathbf{Y}\). It is well-known
    that the signal subspace spanned by the column vectors of \(\mathbf{U}_s\) is
    the same subspace as that spanned by all the column vectors in matrix \(\mathbf{A}\);
    therefore, there exists a unique nonsingular matrix \(\mathbf{T}\) such that \(\mathbf{U}_s
    = \mathbf{A}\mathbf{T}\). Using the inherent structure of \(\mathbf{a}_t(\omega)\)
    and \(\mathbf{a}_s(\varphi)\), the shift invariance property of \(\mathbf{A}\)
    can be found so that the classic ESPRIT method [19] is exploited to estimate the
    DOA and pitch parameters, respectively. In so doing, we first define the following
    four selection matrices


    \[

    \mathbf{W}_1 = \begin{bmatrix} \mathbf{I}_{M-1} \\ \mathbf{0}_{1\times(M-1)} \end{bmatrix}
    \otimes \mathbf{I}_R, \quad

    \mathbf{W}_2 = \begin{bmatrix} \mathbf{0}_{1\times(M-1)} \\ \mathbf{I}_{M-1} \end{bmatrix}
    \otimes \mathbf{I}_R,

    \]


    \[

    \mathbf{W}_3 = \mathbf{I}_M \otimes \begin{bmatrix} \mathbf{I}_{R-1} \\ \mathbf{0}_{1\times(R-1)}
    \end{bmatrix}, \quad

    \mathbf{W}_4 = \mathbf{I}_M \otimes \begin{bmatrix} \mathbf{0}_{1\times(R-1)}
    \\ \mathbf{I}_{R-1} \end{bmatrix},

    \]


    where \(\mathbf{0}\) is the vector of zeros. The submatrices \(\mathbf{A}_i\)
    of \(\mathbf{A}\) are further defined by the above selection matrix \(\mathbf{W}_i\)
    as


    \[

    \mathbf{A}_i = \mathbf{W}_i^T \mathbf{A}, \quad i = 1,2,3,4. \tag{17}

    \]


    With the above definition and the structure of \(\mathbf{A}\), it is easily shown
    that we have the following equations


    \[

    \mathbf{A}_1 \boldsymbol{\Psi}_t(\omega) = \mathbf{A}_2, \tag{18}

    \]


    \[

    \mathbf{A}_3 \boldsymbol{\Psi}_s(\varphi) = \mathbf{A}_4, \tag{19}

    \]


    where


    \[

    \boldsymbol{\Psi}_t(\omega) = \operatorname{diag}\{e^{j\omega}, \ldots, e^{jL\omega}\},
    \quad

    \boldsymbol{\Psi}_s(\varphi) = \operatorname{diag}\{e^{j\varphi}, \ldots, e^{jL\varphi}\}.
    \tag{20}

    \]


