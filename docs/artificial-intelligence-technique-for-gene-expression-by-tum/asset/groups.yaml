    **Yuntao Wu**（M’12）于2003年12月在西安电子科技大学雷达信号处理国家重点实验室获得信息与通信工程博士学位。2004年4月至2006年9月，他在中国科学院声学研究所（北京）担任博士后研究员。2006年10月至2008年2月，他在香港城市大学担任高级研究员。2013年4月至2014年3月，他在以色列巴伊兰大学工程学院担任访问研究员。目前，他是武汉工程大学的全职教授，同时也是该校的湖北省楚天学者计划特聘教授。他已发表期刊和会议论文60余篇。他是中国电子工程师学会（CIE）高级会员，也是《Multidimensional
    Systems and Signal Processing》（施普林格国际期刊）的副主编。他的研究方向包括信号检测、阵列信号处理中的参数估计、无线传感器网络中的源定位、生物医学信号分析等。

