    # F. Joint DOA and Single Pitch Estimation Using ESPRIT in the presence of Multi-path
    Propagation: Multichannel Single-pitch Multi-path ESPRIT (MSP-MP-ESPRIT)


    Based on the constructed spatio-temporal smoothed data matrix $\mathbf{X}_{M,R_0}$,
    the noise subspace and signal subspace can be obtained from the SVD of $\mathbf{X}_{M,R_0}$,
    which is defined as


    $$\mathbf{X}_{M,R_0}=[\mathbf{U}_s\ \mathbf{U}_n]\mathbf{\Sigma}\mathbf{V}^H.$$
    (59)


    where the columns of $\mathbf{U}_s$ and $\mathbf{U}_n$ are the singular vectors
    associated with the $P_0(=LP)$ largest values and the remaining $MR_0-P_0$ least
    singular values, respectively. Using the noise subspace of $\mathbf{X}_{M,R_0}$,
    a MUSIC-based method for joint multi-pitch and DOA estimation was presented in
    [34], where a 2-D grid search is required to obtain the estimates of parameter
    pairs $(\omega,\theta_p)$, $p=1,2,\ldots,P$. In this section, using the spatio-temporal
    shift invariance structure of $\mathbf{A}_M^{(R_0)}$, the ESPRIT-based method
    is exploited to give the estimates of $\{\omega,\theta_p\}$. One can obtain the
    following two equations with the signal subspace matrix $\mathbf{U}_s$


    $$\mathbf{U}_2=\mathbf{U}_1\Phi_t\quad\text{and}\quad\mathbf{U}_4=\mathbf{U}_3\Phi_s.$$
    (60)


    where


    $$\mathbf{U}_1=\mathbf{W}_1\mathbf{U}_s\quad\text{and}\quad\mathbf{U}_2=\mathbf{W}_2\mathbf{U}_s,$$

    $$\mathbf{U}_3=\mathbf{W}_3\mathbf{U}_s\quad\text{and}\quad\mathbf{U}_4=\mathbf{W}_4\mathbf{U}_s.$$
    (61)


    where the selection matrices $\mathbf{W}_i$, $i=1,2,3,4$, are defined as follows


    $$\mathbf{W}_1=\begin{bmatrix}\mathbf{I}_{M-1}\\\mathbf{0}_{1\times(M-1)}\end{bmatrix}\otimes\mathbf{I}_{R_0},\quad

    \mathbf{W}_2=\begin{bmatrix}\mathbf{0}_{1\times(M-1)}\\\mathbf{I}_{M-1}\end{bmatrix}\otimes\mathbf{I}_{R_0},$$

    $$\mathbf{W}_3=\mathbf{I}_M\otimes[\mathbf{I}_{R_0-1}\ \mathbf{0}_{1\times(R_0-1)}],\quad

    \mathbf{W}_4=\mathbf{I}_M\otimes[\mathbf{0}_{1\times(R_0-1)}\ \mathbf{I}_{R_0-1}].$$


    Thus, the estimates of $\omega$ and $\theta_p$ can be obtained from the eigenvalues
    $\mu_l$ and $\nu_l^{(p)}$ of $\Phi_t$ and $\Phi_s$ as


    $$\hat{\omega}=\frac{2}{L(L+1)}\sum_{l=1}^{L}\angle\mu_l,$$

    $$\hat{\theta}_p=\arcsin\left(\frac{2c\sum_{l=1}^{L}\angle\nu_l^{(p)}}{L(L+1)\hat{\omega}f_s
    d}\right),\quad p=1,2,\ldots,P.$$ (62)


