    # VII. CONCLUSION


    In this paper, the ESPRIT algorithm was used for joint pitch and DOA estimation
    of multiple channel multi-pitch with a ULA. Based on a constructed spatio-temporal
    signal model, the invariance property in both the time-domain and the spatial
    domain was exploited to estimate the pitch and DOA parameters using the ESPRIT
    method. We also demonstrated that the spatio-temporal smoothing technique can
    be used to solve the single-pitch multi-path propagation case. Compared to the
    available state-of-the-art algorithms, the proposed method based on ESPRIT without
    2-D searching is computationally more efficient. The asymptotic performance of
    the estimated pitch and DOA for multi-pitch case was also analyzed. Finally, numerous
    simulations using synthetic data were conducted to compare the performance of
    the proposed method with both the NLS-based method and the MC-HMUSIC method for
    the single pitch case and the MC-HUMUSIC method for the multi-pitch case. The
    results show that the performance of the proposed estimator is not only comparable
    to the other methods for both pitch and DOA estimation in terms of the root mean
    square error but is also close to the corresponding CRLB. Furthermore, the experimental
