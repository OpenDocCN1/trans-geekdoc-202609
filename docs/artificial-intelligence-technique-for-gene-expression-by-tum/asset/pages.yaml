    Similar to the above experiment on resolvability performance in frequency, both
    parameters of source 1 and the pitch of source 2 were now fixed in this experiment,
    while the DOA of source 2 varied with different $\Delta\theta = |\theta_1 - \theta_2|$.
    It is seen from the Fig. 6 that the resolvability performance in the spatial angle
    of the two methods is also similar, but with a 2 dB gap between their RMSEs and
    the corresponding CRLB. In addition, it is worthy to note that both the MC-HMUSIC
    estimator and the proposed estimators can still perform well when the DOAs of
    the two sources are identical, i.e., $\Delta\theta = 0$, due to the fact that
    the two sources have different pitches and the estimations of DOA are dependent
    on the pitch parameters. However, the pitch estimates of the two sources are directly
    obtained from the eigenvalues of constructed matrices; therefore, the two sources
    cannot be resolved in the case of the same pitch (i.e., $\Delta\omega = 0$) without
    using the spatio-temporal smoothing technique to restore the rank of $A$.


    In the last simulation experiment, we show an example of joint DOA and single-pitch
    estimation in the presence of multipath propagation. The harmonic signal consisted
    of $L$ sinusoids with a pitch of $f_0 = 343$ Hz and assumed that there were 3
    multi-path signals with DOAs $= [-60^\circ, 10^\circ, 45^\circ]$ received at the
    array, which the parameter setting is listed in Table IV. The number of microphones
    was set $R = 16$, SNR was set as


    SNR = 30 dB, and the number of samples was $N = 120$. The smoothed parameters
    in the spatio-temporal domain were taken as $M = 80$ and $R_0 = 8$. The results
    for 50 independent trials are shown in Fig. 7, which shows that the proposed method
    can still give accurate DOA and pitch estimation in the multi-path propagation
    case, and that the result for $L = 5$ is better than the result for $L = 2$ in
    same conditions.


    # **B. Real-life Data Results**


    In this subsection, an experiment was conducted to also evaluate the performance
    of the proposed method on real-life signals. The real-life data were also used
    to measure the performance of the NLS-based method [36] for the single pitch case.
    The experiment took place in a meeting room and the experimental environment was
    depicted in [36]. In the experiment, the sampling frequency was $f_s = 44.1$ kHz,
    the speed of sound was assumed to be $c = 343$ m/s, and the room reverberation
    time at 1 kHz was $T_{60} \approx 0.53$ s, the receiving array was a uniform and
    linear array with an inter-element spacing of $d = 4$ cm and the number of sensors
    was $R = 8$. We assumed that there was no attenuation across the sensors such
    that $\alpha_{p,l} = 1$, and the desired signal was assumed to consist of $L =
    8$ harmonics. In addition, $N = 100$ was used for each parameter estimation.'
