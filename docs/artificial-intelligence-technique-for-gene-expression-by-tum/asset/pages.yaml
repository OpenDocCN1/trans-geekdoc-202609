- pgno: 0
  md: '# Joint Pitch and DOA Estimation

    Using the ESPRIT Method


    Yuntao Wu, Member, IEEE, Amir Leshem, Senior Member, IEEE, Jesper Rindom Jensen,
    Member, IEEE, and Guisheng Liao


    Abstract—In this paper, the problem of joint multi-pitch and direction-of-arrival
    (DOA) estimation for multichannel harmonic sinusoidal signals is considered. A
    spatio-temporal matrix signal model for a uniform linear array is defined, and
    then the ESPRIT method based on subspace techniques that exploits the invariance
    property in the time domain is first used to estimate the multi pitch frequencies
    of multiple harmonic signals. Followed by the estimated pitch frequencies, the
    DOA estimations based on the ESPRIT method are also presented by using the shift
    invariance structure in the spatial domain. Compared to the existing state-of-the-art
    algorithms, the proposed method based on ESPRIT without 2-D searching is computationally
    more efficient but performs similarly. An asymptotic performance analysis of the
    DOA and pitch estimation of the proposed method are also presented. Finally, the
    effectiveness of the proposed method is illustrated on a synthetic signal as well
    as real-life recorded data.


    Index Terms—DOA estimation, ESPRIT, performance analysis, pitch estimation.


    # I. INTRODUCTION


    THE problem of estimating the pitch of a periodic signal is a fundamental problem
    that has received considerable attention for many years due to its wide application
    in areas such as audio and speech coding, compression, enhancement and classification
    of music, and speech analysis [1]–[5]. Many methods for parameter estimation in
    both single-pitch and multi-pitch scenarios have been reported (see [6]–[8] for
    an overview of existing pitch estimation methods). Direction-of-arrival (DOA)
    estimation with an array of spatially separated sensors is another key research
    topic in the field of


    signal processing [10], [11], which has been widely studied in the past decades.
    Its application areas include radar [12], sonar [13], radio astronomy [14], geophysics
    [15], and speech processing with a microphone array [16]. In recent years, the
    problem of joint estimation of pitch and DOA of audio and speech signals received
    by multiple sensors has been extensively discussed for both single-pitch and multi-pitch
    scenarios in the literature [17]–[36]. Some of the key examples of applications
    that could benefit from this includes teleconferencing, surveillance applications,
    hands-free communication, and hearing aids, and so on.


    The problem of single-pitch estimation has been researched thoroughly, but the
    multi-pitch scenario occurs more often in real-life applications. The performance
    of multi-pitch estimators designed for single channel recording is seriously degraded
    in the presence of frequency overlapping of sources, reverberation, and strong
    noise environments. For these reasons, the problem can be solved using a multi-channel
    receiver approach to obtain an accurate pitch estimation in such cases. Some robust
    multi-pitch estimation methods have been proposed by


    using joint spatio-temporal processing [17], [18], where joint parameter estimation
    is performed, and hence the sources are still resolvable even in the case of a
    similar source parameter in one dimension for both sources; i.e., with nearly
    same DOA or pitch. For example, if the pitch of two periodic sources, such as
    many audio and voiced speech, is similar, we can use the distinct spatial information
    to first estimate the DOA and then extract the pitch from the spatially separated
    sources [33]. Most of the methods for joint DOA and pitch estimation focus on
    the frequency and the DOA estimation of a single sinusoid defined in two dimensions,
    such as the state-space realization approach [31], the 2-D minimum variance distortionless
    response (MVDR) method [22], [23], [24], the 2-D ESPRIT method [40], and so on.
    Generally, these methods are based on the assumption of a narrow-band signal model,
    therefore, these methods are not suitable for the speech and audio processing
    since the problem of parameter estimation of audio and speech recorded using a
    microphone array is considered as a broadband case.


    Other methods can be considered as a generalization of the previous methods by
    assuming that desired sources are modelled as sums of harmonically related sinusoids,
    which is a good fit for many musical instruments and voiced speech. In other words,
    the traditional broadband case is transformed into multiple narrow-band cases.
    Some classic methods include the ML-based method [28], subspace-based methods
    [27], and the linearly constrained minimum variance (LCMV) beamformer


