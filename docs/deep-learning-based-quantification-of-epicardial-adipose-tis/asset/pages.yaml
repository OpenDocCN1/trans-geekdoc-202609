    The following parameters were measured: left-diastolic (LVEDV) and end-systolic
    (LVES) volumes, left (LVEF) and right (RVEF) ejection fraction; left ventricular
    mass (LV), LVEDV, LVEF, LV mass, and RVEV were measured for the body surface area
    (BSA).


    Qualitative analysis for all perf and LGE was independently performed by two experts
    (M.G. and A.B., with over 8 years of experience in cardiac MRI and Level III European
    Association of Cardiovascular Imaging, certified in cardiology). These readers
    were blinded to the clinical history and image findings. The agreement between
    the two readers, achieved through a consensus expert group (G. with over 10 years
    of experience in cardiac MRI and Level III European Association of Cardiology
    certified in cardiac MRI), measurements of volume times and fraction were all
    performed by one expert (M.G.). In order to assess the interobserver variability,
    EAT volume and mass were re-evaluated on a subset of 25 randomly selected patients
    by an independent expert (A.B.) who was blinded to the results by the main investigator.


    The EAT contours were measured at end-diastole, starting at the pericardium and
    moving towards the inferior margin of adipose tissue as defined previously [2].


    EAT volume (ml/m) was defined as the ratio between EAT volume and the patient
    weight.


    Weight was also not used to index the EAT volume for BSA or body mass index (BMI)
    to observe the impact of obesity on chamber volumes and mass, as these parameters
    are closely linked to EAT [14].


    Stress perfusion defects were visually evaluated and defined as persistent delay
    of enhancement during the first pass of contrast agent.


    +   1) in at least one myocardial segment

    2) not present in rest images

    3) lacked >3 phases at the maximum signal intensity in the cavity of the left
    ventricle

    4) confirmed to coronary distribution

    5) with no co-location with LGE site


    The absolute amount and percentage of patients with LGE and the absolute value
    and LGE defined as percentage of myocardial mass LGE were calculated.


    Initially, the LV endothelium and epicard boundaries were manually traced, ensuring
    that the blood pool and the myocardium were excluded from the region of interest.
    LGE was then automatically calculated and defined as a myocardial segment with
    an increase in signal intensity >5 standard deviations (SD) above the signal intensity
    of the normal myocardium. Finally, any areas flagged as LGE by the software but
    deemed artifactual during visual analysis were excluded [13].


    # 2.4 Deep learning


    For automated MRI image, a fully-convolutional architecture [16] was implemented
    from an input image. The structure of the network was implemented from the UNet
    [17], which achieved remarkable success on multiple datasets including cardiac
    MRI high-level segments with low-fine-grained surface information. In Fig. 1,
    the network architecture includes two-dimensional (2D) and 3D branches processing.
    For the details architecture, preprocessing, and network training, supplemental
    data augmentation was utilized to improve the model generation, as described in
    Supplemental material.


    The entire cohort of patients was randomly split into a derivation and a validation
    cohort (365 and 365 patients, respectively) using a dedicated web link (https://www.random.org/integers/%20mode%20==)


    ![](img/295299d28ea96dd1b2fa5465fea0375c_2_0.png)


