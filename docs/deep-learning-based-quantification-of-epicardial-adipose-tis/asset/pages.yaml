    # 4.1. Summary of results


    The main findings of the study are that in patients with known or suspected CAD
    under stress CMR:


    +   1) EAT volume index is an independent predictor of MACE with an incremental
    risk reduction on top of standard clinical and CMR parameters such as SVF, stress
    ventricular function and LGE even after adjusting for sex, diabetes and obesity.

    2) EAT can be automatically and accurately quantified using a new deep DL algorithm
    on short-axis care CMR images with performance comparable to human expert assessment.


