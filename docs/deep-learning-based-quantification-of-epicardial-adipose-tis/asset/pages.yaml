    All patients were followed for the duration of CMR imaging. Outcomes were measured
    by clinical visits and telephone interviews, with the contact with the patient''s
    cardiologist or cardiologistologist and reevaluation.


    Major adverse cardiac events (MACE) were defined as a combined endpoint:


    +   1) Non-fatal myocardial infarction detected by the 4th ventricular definition
    of myocardial infarction [13] and rise/or fall of troponin levels with above the
    99th percentile above baseline and at least one of:

    - symptoms of acute myocardial ischemia;

    - new ischemic electrocardiogram (ECG) changes;

    - development of pathological waves;

    - imaging evidence of new myocardial or regional wall abnormality in a pattern
    consistent with ischemic event;

    - identification of a thrombosis by including angiography [14]

    2) Cardiac death with symptoms of acute ischemia ischemia presented by new ischemic
    ECG changes or ventricular fibrillation, with death before blood samples for biomarkers
    can be identified, or increases in biomarkers detected by autopsy examination
    [15].


    # 2. Patients and methods


    # 2.1. Study population


    This was a retrospective study in a cohort of patients with known or suspected
    CAD who were referred for clinically stressed CMR in our institution. Between
    January 2011 and December 2014, patients were evaluated for the study. Exclusion
    included known hypertrophic or restrictive cardiomyopathy (n = 12), severe claustrophobia
    (n = 10), or presence of an implantable device (n = 13)


    # 2.2. CMR protocol and analysis


    All patients were evaluated in a T-1.5 Tesla scanner (GE MR450, GE Healthcare,
    Milwaukee WI, USA). The CMR protocol is described in Supplemental Material A.


    Pulse sequences are presented in Supplemental Table 1.


    # 2.3. CMR imaging analysis


    CMR datasets were processed to a dedicated workstation and analyzed with a commercially
    available cardiac software (Circle CV142*5.13.9 software).


