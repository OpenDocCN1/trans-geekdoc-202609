    # 4.4. Strengths and limitations


    Our study presents elements of novelty in comparison to previous works.


    Firstly, we showed for the first time that CMR-derived EAT volume was an independent
    predictive factor for MACE and above standard clinical and damaging parameters
    in a large population of patients with known or suspected CAD under CMR. In particular,
    we tested the effectiveness of EAT measurements in comparison of other methods
    including CMR perfusion and characterization with LGE technique.


    Secondly, it is first to demonstrate that the EAT can be accurately measured and
    segmented with fully automated algorithms on images without manual effort for
    scanning or analysis.


    The results of our study have many important clinical implications. EAT may aid
    in the identification of patients with higher risk of future events, promoting
    the initiation of risk-reducing interventions, including in women with inflammatory
    therapy.


    By incorporating this DL algorithm into CMR, EAT could be used as a robust quantitative
    method to assess patient’s risk. It was measured using short-axis cine-CMR stacks,
    which are routinely recorded in any CMR for calculating biventricular dimension
    and without the need for contrast. Furthermore, unlike manual quantification of
    EAT, which is time-consuming, our proposed algorithm allows epic fat to be quantified
    within few seconds.


    EAT volume measured with a DL algorithm in standard CMR represents a robust independent
    predictor of MACE in patients with known or suspected CAD under stress CMR. EAT
    volume also provides an independent prognostic over top of standard clinical and
    imaging parameters.


