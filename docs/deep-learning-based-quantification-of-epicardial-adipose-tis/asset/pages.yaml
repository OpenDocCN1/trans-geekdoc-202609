    # 4.2. Existing research on this topic


    EAT covers 80 % of the heart surface and is more represented in atrioventricular
    and interventricular grooves around the epicardial coronary arteries [21]. Different
    from adipose tissue of other organs, the EAT has specific anatomical and functional
    characteristics. It consists of adipocytes with better and denser features [21].


    A growing body of evidence suggests that EAT may contribute to developing CAD
    [22] and even acute coronary syndromes [23]. As a result of remodeling and proinflammatory
    cytokines released that inflammation is widely associated with all phases of CAD,
    from early atherogenesis to atherosclerotic progression and ultimately plaque
    rupture [23].


    CMR is the most effective non-invasive method for measuring EAT and to distinguish
    it from adipose [2]. In contrast to echocardiography, CMR allows 3D analysis of
    the EAT volume, distribution, and characteristics [21].


