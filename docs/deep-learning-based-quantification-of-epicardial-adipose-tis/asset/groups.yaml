    MACE 发生在 24 名 (75%) 男性和 8 名 (25%) 女性中。EAT 体积指数与男性的较高 MACE 风险相关 (HR 1.086 [95 %
    CI, 1.045–1.128]; p<0.001)，但女性没有 (HR 1.067 [95 % CI, 0.987–1.153]; p=0.103)。然而，实际上男女之间的
    EAT 体积指数没有显著差异 (p=0.525)。


    ### 3.4. EAT 与密度

    多变量分析中，调整密度后 EAT 体积指数是 MACE 的独立预测因子 (HR 1.079 [95 % CI, 1.040–1.120]; p<0.001)，如表
    3 所示（模型 5）。EAT 体积指数在有密度的患者中与较高的 MACE 风险相关 (HR 1.106 [95 % CI, 1.033–1.187]; p=0.005)，在无密度的患者中也相关
    (HR 1.066 [95 % CI, 1.021–1.118]; p=0.004)。


    ### 3.5. 验证队列分析

    验证队列将 365 名患者的特征（表 6，补充表 2）与衍生队列进行了比较。中位随访时间为 2177 天（25-75位数：1848–2437）。与风险评分相比，EAT
    体积指数显示出较低的 MACE 风险 (HR 0.638 [95 % CI, 0.524–0.792]; p<0.001) 和更高的 C 指数 (0.76
    对 0.59; p<0.001)。Kaplan-Meier 曲线基于高 EAT 体积指数 (<24.6 ml/m) 和高风险评分显示。验证队列的多变量分析结果与衍生队列相当（补充表
    3）。


    研究的主要发现汇总在图摘要（图 8）中。


    ## 4. 讨论

    本研究的目的是评估额外的


    ![](img/295299d28ea96dd1b2fa5465fea0375c_6_0.png)


    图 5. 风险评分数值值与风险评分相比的心外脂肪组织容积指数。


    ### 4.1. 结果总结

    研究的主要发现是，在已知或怀疑患有压力下冠心病 (CAD) 的患者中：

    - 1) EAT 体积指数是 MACE 的独立预测因子，在调整性别、糖尿病和肥胖后，比标准的 CMR 参数（如 SVF、心功能和 LGE）具有额外的风险降低作用。

    - 2) 使用新的深度学习 (DL) 算法可以自动且准确地量化 EAT，其性能与专家评估相当。


    ![](img/295299d28ea96dd1b2fa5465fea0375c_6_1.png)


    图 4  队列主要不良事件 (MACE) 的 Kaplan-Meier 曲线，基于低 EAT 体积 <24.6 ml/m 和高 EAT 体积 ≥24.6 ml/m。


    ### 4.2. 该主题的现有研究

    EAT 覆盖了心外和冠状动脉周围 80% 的心脏表面。越来越多的证据表明 EAT 可能导致动脉粥硬化各个阶段的发展，并释放促炎细胞因子。在体内量化 EAT
    方面，最有效的非侵入性方法是使用改进的辛普森规则。受试者工作特征 (ROC) 曲线显示，风险评分 (854) 高于 EAT 体积指数 (739)。


