    EAT ≥24.6 mL/m。


    ![](img/29529928ea96dd1bfa465fea0375c_1.png)


    图 8. 图形摘要。

    使用深度学习（DL）算法测量的标准心脏磁共振（CMR）心外脂肪体积，代表了已知或疑似冠心病（CAD）压力测试下患者 MACE 的稳健独立预测因子。


    心脏映射。在一项针对 64 名左心室射血分数（LVEF）>40% 并接受心脏磁共振（CMR）的心衰患者进行的研究中，无需对比剂，EAT 体积与心房颤动（AF）的存在相关，并与炎症相关的生物标志物有关
    [25]。此外，在 110 名发生心肌梗死的患者研究中，EAT 体积与较大的梗死面积、微血管阻塞和较大的 ST 段偏移相关 [27]。为了此目的，在心脏磁共振（CMR）中手动定量心外脂肪（EAT）所需的时间是限制性的
    [28]。


    与计算机断层扫描（CT）相关的因素 [29]，关于使用人工智能在心脏磁共振（CMR）中定量心外脂肪（EAT）的数据及其潜在预后作用。

    Ding 等人证明了基于脂肪加权心脏磁共振造影的自动定量心外脂肪的算法 [30]。在本研究中，仅分析了十名患者。专家阅读者对心脏磁共振（CMR）图像进行了分割，算法被应用于剩余六名受试者。最近，提出了一种用于标准心脏磁共振（CMR）全自动定量心外脂肪（EAT）的深度学习（DL）算法
    [31]。该算法随后被应用于心脏磁共振（CMR）测量的心外脂肪（EAT）与心室重构（更肥大的左心室）、左心室功能和较低的清除率之间的关联。心外脂肪（EAT）与糖尿病、血糖控制不佳、血脂和促炎标志物相关
    [32]。性别之间的发病率、患病率和疾病结局的潜在差异。本研究忽略了女性的代表性不足。我们的发现表明，研究需要共同努力以确保心脏事件结局的更公平代表。


    此外，心脏磁共振（CMR）平均比 CT 更难获取，需要更长的扫描时间，且缺乏 CT 的空间分辨率。然而，心脏磁共振（CMR）相对于 CT 的主要优势是不使用电离辐射。


    ## 4.4. 优势与局限性


    我们的研究与以往工作相比具有新颖性。


    首先，我们首次证明了心脏磁共振（CMR）衍生的 EAT 体积在大量已知或疑似冠心病（CAD）患者群体中，是 MACE 和标准临床及损伤参数的独立预测因子。特别是，我们测试了与心脏磁共振（CMR）灌注和延迟增强期成像（LGE）技术相比，EAT
    测量的有效性。


    其次，首次证明了可以通过全自动算法在图像上对 EAT 进行准确测量和分割，而无需人工进行扫描或分析。


    我们研究的结果具有重要的临床意义。EAT 可能有助于识别未来事件风险较高的患者，促进启动风险的干预措施，包括抗炎治疗。


    通过将这种深度学习（DL）算法整合到心脏磁共振（CMR）中，EAT 可以作为评估患者风险的稳健定量方法。它是使用短轴心磁共振层进行测量的，这些层在任何用于计算双室尺寸的
    CMR 中都会常规记录，且不需要对比剂。此外，与耗时的 EAT 手动定量不同，我们提出的算法可以在几秒钟内完成心脂肪的定量。


    标准心脏磁共振（CMR）中用深度学习（DL）算法测量的 EAT 体积代表了已知或疑似冠心病（CAD）压力测试下 MACE 的稳健独立预测因子。EAT 体积还比标准临床和影像参数提供了独立的预后价值。


    ## 数据可用性


    本文涉及的基础数据将根据合理要求向通讯作者共享。


