    HR (3.550 95% CI 1.765-3.381; p = 0.001), late gadolinium enhancement (LGE) (4.928
    95% CI 1.822-7.759; p = 0.001) and heart volume index (1.082 95% CI 1.045-1.210;
    p = 0.001) were independent predictors of MAC. In a multivariate regression, adding
    heart volume index to a risk score including LVF, previous strain and LGE provided
    additional value for MAC predictions with a net reclassification improvement (0.648
    95% CI 0.565-0.731; p < 0.001). HR and heart volume index showed a higher C statistic
    compared to risk score (0.85 95% CI 0.76; p = 0.001) and heart volume index (0.85
    vs 0.74; p = 0.001). These findings were validated by the cohort. Conclusions:
    In patients with clinically stressed CMR, fully automated heart volume index by
    measurement can provide additional clinical information on top of standard and
    cardiac imaging parameters.


    # 1. Introduction


    Stress cardiac magnetic resonance (CMR) is a powerful diagnostic tool with remarkable
    ability to objectively assess function and stress pressure for cardiovascular
    patients with known or suspected coronary artery disease (CAD).


    Myocardial wall motion and late gadolinium enhancement (LGE) have been identified
    as key predictors. A significant correlation was demonstrated with mortality and
    risks of adverse events. Normal normal stress response during CMR is associated
    with a good prognosis for at least 3.5 years [1].


    Assessment of thickening between the visceral and parietal layers of the pericardium
    during stress is performed by epicardial adipose thickness [2].


    However, IF quantification is not yet practical in patients under stress, CMR
    remains the prominent tool.


    CMR has been extensively studied using non-invasive imaging. We established the
    first method to quantify heart volume by measuring its thickness and length of
    the right ventricle [3]. Subthree-dimensional techniques for assessing heart have
    been proposed, such as CMR and computed tomography (CT) [4]. We used CNN access
    to quantify pericardial volume [5] and CNN ability to detect lesions by coronary
    artery characteristics [6].


    The accuracy of myocardial wall thickness makes it a stable indicator for validating
    heart function and partial pericardial volume [7], which enables precise volumetric
    quantification of the ventricle.


    With volumetric assessment of EAT can be performed manually by tracing the thickness
    of the pericardium from the interventricular ventricle to the base. Then, the
    software calculate volume based on the sum of all images, taking into account
    slice thickness and gaps [8]. However, these methods have not been applied into
    clinical routine assessments with CMR. With the development of artificial intelligence
    applications that enable EAT to be quantified [9,10].


    Our study aims to evaluate the prognostic value of EAT in patients clinically
    stressed CMR through the utilization of a newly developed deep learning (DL) algorithm,
    designed for the fully automated segmentation of EAT.


    estimated flow rate < 30 ml/min (n = 14), and image quality of CMR (n = 11). Moreover,
