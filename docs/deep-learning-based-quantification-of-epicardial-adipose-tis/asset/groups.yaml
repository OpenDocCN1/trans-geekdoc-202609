    # 2. Discussion


    On the derivation cohort, the set of 300 randomly selected and manually annotated
    patients (ground truth) reached validation (n = 240; 80% and n = 60), with respect
    to sex, and BMI as discussed in the Table of both derivation and validation cohorts.


    Continuous variables were presented as mean ± SD or median (25th, percentile)
    and categorical variables as numbers and frequencies. Independent student''s t,
    Mann-Whitney test, Chi-square, or Fisher''s test were used to compare the distribution
    of variables between groups. Inter-rater reliability of segmentation was assessed
    using intraclass correlation (ICC).


    The ability of the score to predict events was evaluated by the area under the
    curve (AUC). The 95% confidence interval (CI) was calculated using the bootstrap
    method.


    predictive risk was dichotomized using a threshold determined by Maximum Index
    (sensitivity - specificity). - 1


    Continuous negative regression (NRI) was used to determine the value of EAT volume
    index in predicting MACE. The incremental power of EAT volume in predicting MACE
    was assessed by the chi-square test of model coefficient and by Harrell C statistics
    analysis and the De-Long test.


    The ability of the score to predict events was also tested using the calibration
    curve.


    Statistical analyses were performed on Python with scikit-learn package (version
    0.22.2; https://scikit-learn.org/) and R (version 4.3.1 (R Foundation for Statistical
    Computing). p-value < 0.05 was considered statistically significant.


