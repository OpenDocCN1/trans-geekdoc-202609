    # 待发表文章


    测量了以下参数：左心舒张末容积（LVEDV）和收缩末容积（LVES），左心射血分数（LVEF）和右射血分数（RVEF）；左心室质量（LV）、LVEDV、LVEF、LV质量和RVEV根据体表面积（BSA）进行了测量。


    所有灌注（perf）和延迟间期强化（LGE）的定性分析由两位专家独立完成（M.G. 和 A.B.，具有超过8年的心脏磁共共振经验，并获得欧洲心血管影像学会三级心脏学认证）。这些阅读者对临床史和影像发现设盲。两位阅读者之间的一致通过共识专家小组达成（G，具有超过10年的心脏磁共共振经验，并获得欧洲心脏学会三级心脏磁共共振认证），体积时间和分数的测量均由一位专家（M.G.）完成。为了评估观察者间的变异，由独立专家（A.B.，对主研究者的结果盲）对随机选择的25名患者子集重新评估了EAT体积和质量。


    EAT轮廓在舒张末进行测量，从心膜开始并向此前定义的脂肪组织下缘移动 [2]。


    EAT体积（ml/m²）被定义为EAT体积与患者体重的比值。


    体重也未用于BSA或体重质量指数（BMI）的EAT体积指数化，以观察肥胖对腔室体积和质量的影响，因为这些参数与EAT密切相关 [14]。


    应激灌注缺损通过视觉评估评估，并定义为对比剂首次通过期间强化的持续延迟：


    - 1) 至少在一个心肌节段内

    - 2) 在静息图像上不存在

    - 3) 在左心室腔内最大信号强度下缺乏>3个阶段

    - 4) 确认为冠脉分布

    - 5) 与LGE位点无重叠


    计算了LGE患者的绝对数量和百分比，以及LGE的绝对值和占心肌质量的百分比。


    最初，手动追踪左心室内皮和心外膜边界，确保血池和心肌排除在感兴趣区域之外。随后自动计算LGE，并定义为信号强度比正常心肌信号强度增加超过5标准差（SD）的心肌节段。最后，排除了软件标记为LGE但在视觉分析期间被认为是伪影的任何区域
    [13]。


    ## 2.4 深度学习


    对于自动MRI图像，从输入图像实现了一个全卷积架构 [16]。网络结构基于UNet [17] 实现，该架构在多个数据集上取得了显著成功，包括具有低细粒度表面信息的心脏磁共共振高层分割。在图1中，网络架构包括二维（2D）和三维（3D）分支处理。对于详细架构、预处理和网络训练，利用补充的数据增强来改进模型生成，如补充材料所述。


    整个患者队列使用专用网页链接（https://www.random.org/integers/%20mode%20==）随机分为推导队列和验证队列（分别为365名和365名患者）。


    ![](img/295299d28ea96dd1b2fa5465fea0375c_2_0.png)


    图 (1) 结合2D和3D卷积的主架构，用于从心血管共振环像图像进行心外膜脂肪组织分割。最后一层生成输入切片的最终分割图。(B) 使用其2D和3D分支的BiFusion块。(C)
