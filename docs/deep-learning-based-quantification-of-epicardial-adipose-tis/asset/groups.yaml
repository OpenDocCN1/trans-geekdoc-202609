    Marco Gigliotto：概念化、方法论、调查、草撰、数据分析。Visanco Porto：方法论、软件、可视化、数据整理、审稿。Marco Gigliotto：审稿、可视化。Alessandro
    Leone：草撰、调查、审稿。Andrea Baglio：数据整理、形式分析、草撰、监督。Antonio Serra：监督、验证。Francesco Canassa：可视化、方法论。Francesco
    Cali：软件、形式分析。Alberto Del Toro：数据获取采集、方法论、形式分析、可视化、审稿。Frampentina：方法论。Paola Grioli：可视化、初稿撰。文章。Daniele
