    ## ABSTRACT


    Background: This study investigates the added prognostic value of epicardial adipose
    tissue (EAT) volume for major adverse cardiovascular events (MACE) in patients
    under stress CMR (imaging).


    Methods: We studied 730 patients (mean age: 63 ± 10 years; 516 men) who underwent
    stress CMR for coronary artery assessment (n = 365 ± 30) cohorts. MACE were defined
    as a non-fatal myocardial infarction or cardiac death. A deep learning model was
    developed and trained to quantify EAT volume from CMR. EAT volume was adjusted
    for heart volume volume index. A component-based risk score by Cox identified
    variables of the MACE was created.


    Results: In the derivation, 32 patients (8.7%) developed MACE during follow-up
    of 2103 days. Left stress perfusion left ventricular ejection function (LVEF)
    = 59 (± 4.8) HR (95% CI: 1.90–3.202; p<0.001), stress perfusion deficit


