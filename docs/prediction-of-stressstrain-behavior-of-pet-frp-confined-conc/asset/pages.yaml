  md: '# 3.2 Data Preprocessing


    # 3.2.1 Data Scaling


    The dataset displays a significant variance in the scales of different input attributes
    within the original database. The presence of significant differences in the scales
    of features might have a notable negative impact on the accuracy and performance
    of the model. Therefore, it is essential and non-negotiable to include the data
    scaling process as a crucial stage in the analysis. Data scaling is indispensable
    due to the magnitude differences observed in input features. By applying the Z-score
    technique for data scaling and effectively normalizing the range of the dataset
    across features, mitigating the impact of these magnitude disparities. This vital
    preprocessing step ensures that each feature contributes equitably to the model’s
    performance, ultimately enhancing its accuracy, robustness, and interpretability.


    # 3.2.2 Outliers and Z-Score


    Outliers can significantly affect values. Hence, datasets containing a significant
    number of outliers may likewise produce imprecise results. The Z-score approach
    was employed to eliminate outliers. The Z-score, or standard score, is a statistical
    technique used to detect outliers in a dataset by quantifying the extent to which
    each data point deviates from the mean in terms of standard deviations. The standardized
    measure quantifies the degree of extremity or uniqueness exhibited by a specific
    data point in relation to the overall distribution of the dataset. The Z-score
    can be calculated using Eq. 1.


    Z = (X - μ) / σ

    (1)


    In the above equation, Z denotes the Z-score associated with the given data point.
    The variable X represents the numerical value of a certain data point that is
    being evaluated. The symbol μ represents the arithmetic mean, often known as the
    average, of the given dataset. The symbol σ represents the standard deviation
    of the dataset.


    The Z-score quantifies how many standard deviations a data point is away from
    the mean. However, one of the limitations of the Z-score is that it may provide
    inaccurate results for smaller datasets. Nevertheless, the sample size is unlikely
    to pose a concern in our specific scenario, as a sample size exceeding 30 is generally
    considered adequate for ensuring precise Z-score computations [69]. Z-score threshold
    of 3 was used to identify outliers as Z-scores with an absolute value exceeding
    3 are typically regarded as outliers [70].


    After the removal of the outliers, the dataset was reduced to


    43 data points for noncircular and 91 data points for circular specimens.


    # 3.2.3 Hyperparameters


    Hyperparameters play a crucial role in determining the effectiveness of ML algorithms,
    especially in the context of supervised learning. As stated by the study [71],
    the accurate determination of hyperparameter values has great importance due to
    its substantial impact on the model’s performance. The selection of suitable values
    for these hyperparameters can significantly enhance the performance of the model.
    Likewise, it has been emphasized that in the context of supervised learning, the
    attainment of optimal algorithmic performance is greatly contingent upon the appropriate
    selection and tuning of hyperparameters [72].


    # 3.2.4 Grid Search


    In this study, the grid search method was employed to determine the optimal configuration
    for a model for increasing the performance of ML models. The grid search method
    is a fundamental and influential methodology in the domain of ML, serving as a
    crucial tool for increasing the performance of models through hyperparameter modification
    [73]. By conducting a thorough investigation of various combinations of hyperparameters,
    grid search facilitates the determination of the optimal configuration for a model,
    hence exerting a substantial influence on the performance of ML models [74]. Furthermore,
    grid search is particularly useful in situations when the precise values of hyperparameters
    are unknown. It provides a systematic method for exploring different parameter
    configurations while employing cross-validation to determine the optimal set of
    hyperparameters [75].


    When compared to alternative hyperparameter tuning methods such as Random Search,
    Bayesian Optimization, Gradient-based optimization, and Evolutionary algorithms,
    grid search excels in its comprehensive examination of all possible combinations
    [76]. This comprehensive approach has the potential to achieve higher accuracy,
    provided that time constraints are not the primary consideration. Despite the
    possible computing requirements, grid search is considered a powerful method for
    accomplishing model optimization in machine learning applications [77].


