    errors (SSE) value of the node is computed, as described in the reference [93].


    # 4.1.3 K-Nearest Neighbors (KNN)


    KNN algorithm is a well-established nonparametric method that aims to point the
    k-nearest data points to a query and categorize them using a majority vote. [94].
    The method is widely recognized and utilized in modern computer programming techniques
    due to its efficacy, simplicity, and intuitive nature [95, 96]. A significant
    benefit of the KNN algorithm is its independence from a dedicated training phase
    as it highlights the capacity of KNN to classify data points without prior knowledge
    of the statistical properties of the training examples [97, 98].


