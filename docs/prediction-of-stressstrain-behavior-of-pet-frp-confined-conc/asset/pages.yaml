    XGBoost is a powerful gradient boosting library that improves the gradient-boosting
    decision method, offering efficiency, versatility, and scalability [87–89]. This
    approach improves upon conventional gradient boosting algorithms by integrating
    multiple enhancements and regularization techniques to mitigate the issue of overfitting.
    The XGBoost loss function incorporates a loss term, Ψ(*), to quantify the discrepancy
    between predicted and actual labels, and a regularization term, Ω(f), that discourages
    complex models by penalizing the number of leaves and the output of each leaf
