    The schematic representation of the stress–strain behavior of PET FRP-confined
    concrete is illustrated in Fig. 2. Based on the findings of several empirical
    and theoretical investigations [8, 16, 29, 57, 66], the stress–strain behavior
    of PET FRP-confined concrete is impacted by multiple constituents, depending on
    the shape of the specimens. Circular specimens typically encompass peak compressive
    stress (f_c1), peak compressive strain (ε_c1), compressive strength (f_c2), compressive
    strain (ε_c2), ultimate compressive strength (f_cu), and ultimate compressive
    strain (ε_cu). The stress–strain curve, as seen in Fig. 2, exhibits a downward
    slope shift in the noncircular case, indicating the influence of strength (f_cs)
    and strain (ε_cs), associated with the same constituents observed in circular
    PET FRP-confined concrete. The structural integrity of the confined PET FRP concrete
    section is primarily impacted by factors such as the cross-sectional shape of
    the specimens, the properties of the concrete material, the corner radius of the
    noncircular specimens, and the number of PET FRP layers used for confinement.


    # 2 Research Methodology


    The primary focus of the present study is to develop a co-driven model based on
    data and comparison with mechanism models for the prediction of the stress–strain
    curve of PET FRP-confined concrete. Subsequently, the performance assessment and
    interpretation analysis of the predicted results are conducted. As seen in Fig.
    1, the initial step is the establishment of the experimental database, encompassing
    the processes of feature selection and data collecting for both PET FRP-confined
    circular and noncircular specimens. The determination of the input characteristics
    was done by using feature selection separately for both PET FRP-confined circular
    and noncircular specimens. According to the facts in the database, the subsequent
    objective entails the acquisition of the model that exhibits the utmost precision
    in prediction. This will be accomplished by means of training and assessing three
    conventional ML models. Further, the performance of the optimal model acquired
    in this work is contrasted with that of the empirical model proposed by Pimanmas
    et al. [57]. The empirical model in their study outperformed previously proposed
    models in predicting the stress–strain mechanism of PET-FRP-confined concrete.


    The analysis in the present study aims to predict the stress–strain mechanism
    of PET-FRP-confined concrete using ML and showcase the effectiveness of the ML
    model in terms of its predictive accuracy, generalizability, and the impact of
    crucial input characteristics. Lastly, the study involves verification of the
    decision-making foundation and predicted values of the acquired model align with
    the stress–strain mechanism, as determined by empirical analysis in earlier studies.
