    training 2.450 and testing 2.970, implying less accurate predictions with higher
    absolute errors as compared to XGBoost and RFR.


    In summary, XGBoost demonstrated the most promising performance among the models
    for predicting stress–strain curves of circular specimens. It offered superior
    predictive accuracy and minimal errors, making it a suitable choice for accurate
