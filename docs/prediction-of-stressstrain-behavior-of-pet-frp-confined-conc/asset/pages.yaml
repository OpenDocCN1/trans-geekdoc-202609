    # 4.1.2 Random Forest Regression (RFR)


    RFR was initially proposed by Breiman [91] and adds a randomization layer to the
    bagging technique. Due to the Law of Large Numbers, this method’s strength rests
    in its reduced susceptibility to overfitting, making it a valuable instrument
    for predictive modeling. RFR excels at both classification and regression tasks
    through the intelligent incorporation of controlled variance. It constructs each
    tree of the ensemble using a distinct data aggregation approach.


    RFR relies on bootstrap aggregation for decision trees. RFR differs from previous
    approaches that examine the optimum split across all variables. It randomly chooses
    a subset of predictors and finds the optimal split at each node. This novel'
