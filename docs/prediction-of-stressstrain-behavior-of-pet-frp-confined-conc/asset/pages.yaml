  md: 'composites offer greater benefits in promoting ductility in confined concrete
    compared to standard FRP materials. This implies that using LRS FRP composites
    offers more benefits in terms of promoting a more ductile response in the restricted
    concrete [12–15]. Furthermore, LRS FRP composites have shown promise in enhancing
    the deformation capacity of high- and ultra-high-strength concrete, particularly
    in applications exposed to substantial deformations such as impact, blast, and
    earthquakes [16, 17]. This makes them favorable for use in specialized constructions
    like protective and subterranean facilities that require high ductility [10, 18].


    Polyethylene terephthalate (PET) FRP, a type of LRS FRP composite made from recycled
    PET materials, has shown promise with a tensile rupture strain of over 7% and
    a relatively low elastic modulus. It offers a cost-effective solution for retrofitting
    existing reinforced concrete columns, especially when high deformation capacity
    is required [16, 18–20]. Extensive research has been conducted on the compressive
    behavior of FRP-confined concrete columns, both circular and noncircular, taking
    advantage of FRP’s high strength-to-weight ratio and shape flexibility [21–28].
    Circular columns benefit significantly from FRP confinement, while noncircular
    columns exhibit half-effective confinement, with square columns showing smaller
    strength enhancements compared to circular ones [23, 25, 29]. The corner radius
    in noncircular columns plays a crucial role in the effectiveness of FRP confinement,
    as a larger corner radius leads to a more uniform confining pressure and enhanced
    compressive strength [7, 25, 29–31].


    Various predictive models have been developed to estimate the mechanical response
    of concrete under FRP confinement, categorized into design-oriented [32–41] and
    complete analysis models [42–50]. Ozbakkaloglu et al. [51] conducted a comprehensive
    assessment whereby they methodically analyzed a total of 88 stress–strain models
    specifically designed for circular cross-section FRP-confined concrete specimens.
    The models provided by Al-Salloum [52] and Lam and Teng [53] performed well on
    limited specimens with varying corner radius ratios. Wu and Wei’s model [54] accurately
    predicted the material’s ultimate strength. In another study, Dong et al. [55]
    calculated circular section ultimate strains. Shehata et al. [56] model predicted
    final strength well. However, it tended to overstate strength in specimens with
    low confinement. In another study, a number of mechanical models were used and
    compared to estimate the stress–strain properties of PET FRP-confined concrete
    [57]. The predictive model by Pimanmas et al. [57] outperformed others. It accurately
    predicted the ultimate strength of specimens with sharp edges and correlates with
    stress–strain responses. This model performed well on PET and PEN FRP-confined
    circular concrete samples. These design-oriented and analysis-oriented models
    anticipate material behavior using mathematical models


    and experiments. This context includes examining, observing, establishing, predicting,
    and modifying models based on predictions. These approaches depend on detailed
    models, involve assumptions, and take a long time to produce elaborate composites.
    Integrating heterogeneous material behavior into a single model is difficult.
    There is no model that can accurately anticipate the ultimate circumstances and
    stress–strain response for FRP-confined composites, despite much study [1].


    The application of artificial intelligence (AI) has become increasingly popular
    in civil engineering for predicting concrete’s mechanical properties, resulting
    in time, effort, and cost savings. Several researchers have utilized machine learning
    (ML) methods to predict the compressive strength of geopolymer concrete [58–60].
    Several other studies employed ML models to predict the shear strength of RC deep
    beams [61–63]. In their study, Keshtegar et al. [64] utilized a hybrid regression
    and ML model to accurately predict the ultimate condition of FRP-confined concrete.
    In another study, Zhang et al. [65] utilized AI techniques to forecast stress–strain
    curves of FRP materials. Jiang et al. [1] conducted a study that demonstrated
    the superior performance of data-driven ML models compared to traditional mathematical
    models in predicting stress–strain curves for FRP-confined concrete. This finding
    emphasizes the potential of ML models in accurately predicting the stress–strain
    behavior of PET FRP-confined concrete, particularly in the context of structural
    design and response prediction.


    Therefore, in this study, a novel approach for accurately predicting the stress–strain
    curve of PET FRP-confined concrete using ML techniques was presented. The study
    mainly focused on predicting the key parameters in the stress–strain curve, including
    peak, slope change, end of transition, and maximum values. At first, a complete
    dataset including 154 axial compression test specimens of PET FRP-confined concrete
    was compiled and systematically arranged. The dataset consisted of 103 circular
    specimens and 51 noncircular specimens, which were utilized for the purpose of
    model training and testing. Three advanced ML models, namely extreme gradient
    boosting (XGBoost), random forest regression (RFR), and k-nearest neighbors (KNN),
    were employed in this study to predict the mechanical properties of PET FRP-confined
    concrete for both circular and noncircular specimens. To evaluate the evaluation
    performance of three ML models, four key evaluation metrics, coefficient of determination
    (R²), mean square error (MSE), root mean square error (RMSE), and mean absolute
    error (MAE), were utilized. Based on the evaluation metrics, the XGBoost model
    was found to be the most accurate in predicting mechanical properties compared
    to RFR and KNN. Furthermore, the complete stress–strain curve of PET FRP-confined
    concrete for both circular and noncircular specimens predicted by the XGBoost
    was compared with the experimental curve'
