    with higher values indicating a better fit. The $MAE$ matric quantifies the average
    magnitude of errors between predicted and actual values, offering a straightforward
    measure of accuracy. A lower $MAE$ implies better model performance. On the other
    hand, $MSE$ matric represents the average of the squared difference between the
    original and predicted values in the data set. It measures the variance of the
    residuals. Lastly, the $RMSE$ is similar to $MAE$ but places a greater penalty
    on larger errors, providing insights into the spread of prediction errors. A lower
    value of $MSE$ and $RMSE$ suggests that the model''s predictions are generally
    close to actual values. These metrics collectively help evaluate the model''s
    explanatory power, accuracy, and precision, enabling informed decisions about
    its effectiveness. Equations 8–11 illustrate the expressions'
