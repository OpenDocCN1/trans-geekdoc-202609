    # 3 Data Collection and Preprocessing


    # 3.1 Data Collection


    In this study, to predict the stress–strain behavior of PET FRP-confined concrete,
    21 specimens with a height of 300 mm were tested under monotonic axial compression.
    Several key variables were considered during the testing phase. These variables
    included the cross-sectional shape of the specimens, which could either be circular
    or noncircular (square or rectangular). Additionally, the corner radius of the
    noncircular specimens was varied, with values of 0, 13, and 26 mm. The number
    of PET FRP layers used for confinement was also varied, with choices of one, two,
    and three layers. The specific details of each specimen, including its geometry,
    dimensions, and mechanical properties, are provided in Table 1. A comprehensive
    description of the specimen design, the materials utilized, the process of wrapping
    concrete with PET FRP, the instrumentation used to collect data during testing,
    and the testing procedures can be found in [17].


    Furthermore, to ensure the comprehensiveness and reliability of the ML methods
    used in this study, a substantial amount of existing data related to PET FRP-confined
    concrete was collected from [8, 10, 16, 20, 29, 30, 66–68]. In total, a collection
    of 154 data points was obtained in its entirety. Out of these data points, 103
    were associated with circular specimens, while the remaining 51 data points pertained
    to noncircular specimens.'
