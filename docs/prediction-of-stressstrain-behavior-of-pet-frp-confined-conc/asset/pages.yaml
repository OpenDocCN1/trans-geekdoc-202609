    The SHAP methodology, as described by Lundberg and Lee [81], is an interpretable
    technique that draws upon game theory and the concept of Shapley value [82]. The
    Tree-SHAP method was introduced as a means of elucidating the inner workings of
    tree-based machine learning models, namely those employing gradient-boosting methods
    [83]. The Shapley value φj(i) denotes the incremental contribution of individual
    input features toward the projected value. The establishment of the weighted linear
    regression model is as follows:


    y''i = ybase + Σ_{j=1}^M φ_j^{(i)}  (2)


