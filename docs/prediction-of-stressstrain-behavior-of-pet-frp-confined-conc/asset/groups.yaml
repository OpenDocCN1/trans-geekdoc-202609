    ### 5.1 机器学习模型性能评估


    本节概述了三种广泛认可的机器学习模型的性能：XGBoost、KNN 和 RFR。用于预测方形和矩形试件应力-应变曲线的三种不同机器学习模型的性能指标总结于表
    5 中。评估标准包括训练和测试数据集的 $R^2$ 值、训练和测试的 $RMSE$ 值以及训练和测试的 $MAE$ 值。


