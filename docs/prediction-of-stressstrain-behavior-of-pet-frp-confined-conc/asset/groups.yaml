    # Prediction of Stress–Strain Behavior of PET FRP-Confined Concrete Using Machine
    Learning Models


    Arslan Qayyum Khan¹ · Muhammad Huzaifa Naveed² · Muhammad Dawood Rasheed² · Amorn
    Pimanmas³


    Received: 13 January 2024 / Accepted: 16 April 2024


    © King Fahd University of Petroleum & Minerals 2024


    # Abstract


    Polyethylene terephthalate (PET) fiber-reinforced polymer (FRR) has been recently
    developed, which possesses a bilinear tensile stress–strain relationship and a
    large rupture strain (LRS) capacity. This study presents a novel approach for
    accurately predicting the stress–strain behavior of PET FRP-confined concrete
    using machine learning (ML) techniques. A comprehensive dataset comprising 154
    axial compression test specimens, including both circular and noncircular cases,
    was utilized for training and testing ML models. Three advanced ML models, namely
    extreme gradient boosting (XGBoost), random forest regression (RFR), and k-nearest
    neighbors (KNN), were applied to predict mechanical properties for both circular
    and noncircular specimens. XGBoost consistently outperformed RFR and KNN, demonstrating
    superior accuracy in predicting stress–strain curves for both specimen types.
    Performance evaluation relied on key metrics such as coefficient of determination
    (R²), mean square error (MSE), root mean square error (RMSE), and mean absolute
    error (MAE). Furthermore, the predicted stress–strain curves generated by XGBoost
    were compared to experimental data and a mechanism model, highlighting the superiority
    of XGBoost in capturing critical curve points and emphasizing its accuracy and
    consistency. Moreover, feature importance analysis was carried out and it revealed
    that parameters like the number of PET FRP layers, fiber thickness, and corner
    radius significantly influenced the stress–strain behavior.


    # Keywords


    Stress–strain curve · PET FRP · Machine learning · Extreme gradient boosting ·
    Random forest regression · K-nearest neighbors


    # 1 Introduction


    Researchers have explored the use of fiber-reinforced polymer (FRP) materials,
    such as carbon FRP (CFRP), glass


    FRP (GFRP), and aramid FRP (AFRP), to confine concrete columns, aiming to enhance
    their strength and deformation characteristics [1–7]. However, one key challenge
    in FRP-confined concrete is the potential for the FRP sheet to fracture when the
    internal concrete expands, which is strongly influenced by the tensile properties
    of the FRP material [8, 9].


    Commonly utilized FRP materials for concrete column confinement, such as CFRP,
    GFRP, and AFRP, exhibit a linear elastic stress–strain behavior and are susceptible
    to brittle failure at relatively low rupture strains [10]. However, when FRP-confined
    concrete is effectively confined, it indicates a greater capacity for ductility
    in comparison with ordinary concrete. Nevertheless, the ductile behavior of the
    material comes to an end when the FRP sheet experiences tensile rupture. Significantly,
    the rupture strains of FRP in confined concrete columns are frequently considerably
    lower than the tensile rupture strains measured through tensile strip testing
    [11]. The efficiency of FRP strain is quantified by dividing the effective rupture
    strain by the tensile rupture strain, and it has been observed that large rupture
    strain (LRS) FRP


