    ## 6 特征重要性与依赖性分析


    ### 6.1 特征重要性


    SHAP 特征重要性的利用为复杂模型的学习过程和输入特征的重要性提供了重要见解。为了在特征之间实现一致性，通过归一化计算了相对重要性。圆形和非圆形试件输入特征的相对相关性排名如图
    8 所示。


    图 8a 说明了若干特征在预测圆形试件 PET FRP 约束混凝土应力-应变行为中的重要性。f_co 被确定为最显著的参数，其次是 PET FRP 层数。PET
    FRP 层数对应力-应变特性产生影响的重要性很明显。此外，层数参数之后是代表纤维厚度的参数 t_f，这表明纤维厚度的变化会影响应力-应变特性的性质。最后，注意到与圆形试件中的其他变量相比，面积参数对应力-应变特性的影响相对较小。


    另一方面，图 8b 展示了非圆形试件的特征重要性概览。值得注意的是，圆角半径占据了最相关组成部分的首要位置，其次是 t_f。参数 t_f 在圆形和非圆形试件中都发挥了实质性作用。t_f
    之后是代表 PET FRP 层数的参数，这表明层数的变化放大了纤维厚度对应力-应变特性的影响。最后，观察到在所讨论的参数中，参数 f_co 对非圆形试件的影响最小。


    ### 6.2 特征依赖性分析


    #### 6.2.1 圆形试件


    在本节中，特征依赖性分析专门针对圆形 PET FRP 试件。调查的重点在于了解各种输入变量如何影响试件的行为。为此，采用了 SHAP 分析，这是一种揭示输入特征与模型预测之间复杂关系的强大技术。图
    9 中的插图显示了圆形试件的特征依赖性。随着 PET FRP 层数的增加，输出 f_cu 的层数 SHAP 值也增加，表明两者之间存在线性关系。同样，图 9c
    显示输出 ε_cu 的层数 SHAP 值随着 PET FRP 层数增加而增加，表明两者之间存在线性关系。


    这些分析结果与 [17] 中提出的重要发现一致。发现圆形试件的 f_cu 和 ε_cu 随着 PET FRP 层数的增加而线性增加。此外，f_c1 也随着
    PET FRP 层数近似线性增加 [17]。


    #### 6.2.2 非圆形试件


    首先，发现非圆形试件的 PET FRP 层数与 f_cs 之间存在显著的正相关。图 10a 显示，随着层数的增加，f_cs 表现出一致且线性的改善。同样，层数与
    f_cu 之间也出现了线性关系，表明层数的增加对 f_cu 有积极影响。此外，层数与 ε_cu 之间也发现了相同的线性关系。

