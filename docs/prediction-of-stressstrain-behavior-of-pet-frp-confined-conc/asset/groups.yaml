    以及由于其相对于其他机理模型表现出的卓越性能而被选为基准的机理模型。研究结果揭示了 XGBoost 在预测圆形和非圆形 PET FRP 约束试件的应力-应变曲线方面优于机理模型。最后，还进行了全面的特征重要性和特征依赖性分析，使用
    SHAP（SHapley Additive exPlanations）分析。SHAP 分析突出了诸如 PET FRP 层数、圆角半径、纤维厚度以及混凝土抗压强度等参数对试件行为的显著影响，为结构设计和响应预测提供了宝贵的见解。


    表现出更高性能并纳入应力-应变机理的模型最终被提出。


    PET FRP 约束混凝土的应力-应变行为示意表示如图 2 所示。根据多项经验和理论研究的结果 [8, 16, 29, 57, 66]，PET FRP 约束混凝土的应力-应变行为受多种因素影响，取决于试件的形状。圆形试件通常包括峰值抗压应力
    (f_c1)、峰值抗压应变 (ε_c1)、抗压强度 (f_c2)、抗压应变 (ε_c2)、极限抗压强度 (f_cu) 和极限抗压应变 (ε_cu)。如图 2
    所示，应力-应变曲线在非圆形情况下表现出向下斜率偏移，表明强度 (f_cs) 和应变 (ε_cs) 的影响，与圆形 PET FRP 约束混凝土中观察到的相同组分相关。约束
    PET FRP 混凝土截面的结构完整性主要受试件截面形状、混凝土材料性能、非圆形试件的圆角半径以及用于约束的 PET FRP 层数等因素影响。


    ## 2 研究方法


    本研究的重点是开发一种基于数据并与机理模型对比的协同驱动模型，用于预测 PET FRP 约束混凝土的应力-应变曲线。随后，对预测结果进行性能评估和解释分析。如图
    1 所示，第一步是建立实验数据库，包括对 PET FRP 约束圆形和非圆形试件进行特征选择和数据收集的过程。对输入特征的确定是通过对 PET FRP 约束圆形和非圆形试件分别进行特征选择来完成的。根据数据库中的事实，随后的目标是获取预测精度最高的模型。这将通过训练和评估三种传统
    ML 模型来实现。此外，本工作中获得的最佳模型的性能与 Pimanmas 等人 [57] 提出的经验模型进行对比。他们研究中的经验模型在预测 PET-FRP
    约束混凝土的应力-应变机理方面优于之前提出的模型。


    本研究中的分析旨在使用 ML 预测 PET-FRP 约束混凝土的应力-应变机理，并展示 ML 模型在预测精度、泛化能力以及关键输入特征影响方面的有效性。最后，研究涉及验证所获得模型的决策基础和预测值是否与应力-应变机理一致，该机理由早期研究的经验分析确定。所得模型结果的定性讨论基于
