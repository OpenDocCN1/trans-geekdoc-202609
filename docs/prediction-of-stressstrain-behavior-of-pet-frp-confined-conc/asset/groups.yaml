    Python 中的 Scikit-learn 库构建。在此框架内，超参数优化过程是通过采用网格搜索交叉验证来实现的，这是一种系统化的参数微调方法。预测框架包括两个不同的子模块的开发，每个子模块都精心针对试件的特定几何形状——圆形或非圆形。子模型经过精心设计，以有效描述其对应试件类型固有的复杂性。此外，还开发了一个全面的最终预测模型。集成模型展示了独立识别输入试件几何特征的能力，区分圆形和非圆形形状，然后将输入定向到适当的子模块。本研究中使用双子模块技术旨在提高模型的通用性和适应性，从而在各种试件几何形状上提供准确的预测。最终预测模型结合了机器学习模型产生的圆形试件的六个输出和非圆形试件的八个输出。该过程如图
