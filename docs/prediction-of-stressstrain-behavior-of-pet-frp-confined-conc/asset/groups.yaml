    此外，特征依赖性分析表明，如图 11 所示，角半径对非圆形试件具有明显影响。角半径的增加对 ε_cu 产生负面影响，表明对该预测输出产生不利影响。相反，角半径对特征
    f_cu 产生积极影响，较高的角半径值与增加的 f_cu 值相关，表明非圆形试件的强度损失减少，如图 11b 所示。此外，分析还强调，角半径对特征 f_cs
    的 SHAP 值也表现出正相关关系，表明角半径值增加会导致 f_cs 值增加。


    总体而言，特征依赖性分析补充了 [17] 和 [57] 的研究结果，突出了输入变量与圆形和非圆形 PET FRP 试件行为之间复杂的相互关系。


    ## 7 结论


    本研究对用于预测 PET FRP 约束混凝土试件应力-应变行为的机器学习模型进行了全面分析，包括圆形和非圆形试件。评估了三种机器学习模型 XGBoost、KNN
    和 RFR，


    其在预测应力-应变曲线各种性能方面的表现。


    - 1. 对于圆形试件，XGBoost 表现出最有前景的性能，训练和测试数据集的 R² 值均很高，RMSE 和 MAE 值较低，表明预测具有出色的准确性和最小的误差。RFR
    也表现良好，但略逊于 XGBoost，而 KNN 的准确性最低，绝对误差较高。

    - 2. 对于非圆形试件，XGBoost 再次表现出优越的性能，R² 值高，RMSE 和 MAE 值低，展示了其准确性和一致性。RFR 表现良好，但 KNN
    显示出潜在的过拟合倾向。

    - 3. 对于圆形和非圆形试件，XGBoost 模型在预测应力-应变曲线的各种参数方面表现出令人印象深刻的准确性，MAE 和 RMSE 值较低。预测与实验值密切吻合，突出了模型的精确性。

    - 4. XGBoost 模型在准确捕捉圆形和非圆形试件的关键曲线点，例如极限应力和应变方面，优于 [57] 提出的机理模型。XGBoost 模型在预测不同试件的应力-应变曲线方面表现出更大的一致性和可靠性。

    - 5. 压缩应力和应变预测性能的比较分析显示，XGBoost 模型在预测 PET FRP 约束混凝土的极限压缩应变和应变方面表现出优越的准确性、一致性和可靠性，优于比较分析中考虑的多个其他机理模型。

    - 6. 特征重要性分析显示，PET FRP 层数、纤维厚度（t_f）和角半径等参数显著影响应力-应变行为。特征依赖性分析突出了这些输入特征与输出参数之间的线性关系，提供了对其影响的见解。


    总之，XGBoost 模型被证明是预测 PET FRP 约束混凝土试件应力-应变行为的稳健而准确的工具。其优越的性能、一致性和精确性使其成为复合材料领域宝贵的资产。此外，特征重要性和依赖性分析揭示了驱动这些试件行为的关键因素。本研究为土木工程和材料科学中的预测建模的进步做出了贡献，为该领域进一步研究奠定了基础。


