    ## 3.2 数据预处理


    ### 3.2.1 数据缩放

    数据集在原始数据库中显示出不同输入属性尺度存在显著差异。特征尺度存在显著差异可能会对模型的准确性和性能产生显著负面影响。因此，将数据缩放过程作为分析中的关键阶段包含在内是必不可少且不可协商的。由于输入特征中观察到的幅度差异，数据缩放不可或缺。通过应用
    Z-score 技术进行数据缩放并有效规范化数据集中各特征的范围，减轻这些幅度差异的影响。这一重要的预处理步骤确保每个特征对模型性能做出公平贡献，最终提高其准确性、稳健性和可解释性。


    ### 3.2.2 异常值和 Z-Score

    异常值会显著影响数值。因此，包含大量异常值的数据集也可能产生不精确的结果。采用 Z-score 方法来消除异常值。Z-score，即标准分数，是一种统计技术，用于通过量化每个数据点相对于标准差与均值的偏离程度来检测数据集中的异常值。该标准化度量量化了特定数据点相对于数据集整体分布所表现出的极端程度或独特性。Z-score
    可使用公式 1 计算。


    Z = (X - μ) / σ

    (1)


    在上述公式中，Z 表示给定数据点的 Z-score。变量 X 表示正在评估的某个数据点的数值。符号 μ 表示给定数据集的算术平均值，通常称为平均值。符号 σ
    表示数据集的标准差。


    Z-score 量化了数据点与均值相差多少个标准差。然而，Z-score 的局限之一是它可能对较小的数据集提供不准确的结果。尽管如此，在我们特定的场景中，样本量不太可能成为问题，因为样本量超过
    30 通常被认为足以确保精确的 Z-score 计算 [69]。Z-score 阈值 3 用于识别异常值，因为绝对值超过 3 的 Z-score 通常被视为异常值
    [70]。


    在去除异常值后，数据集减少到非圆形样本 43 个数据点，圆形样本 91 个数据点。


    ### 3.2.3 超参数

    超参数在决定机器学习算法的有效性方面发挥着关键作用，尤其是在监督学习背景下。如研究 [71] 所述，超参数值的准确确定具有重要意义，因为它对模型性能有实质性影响。选择这些超参数的合适值可以显著提高模型的性能。同样，已强调在监督学习背景下，获得最佳算法性能在很大程度上取决于超参数的适当选择和调优
    [72]。


    ### 3.2.4 网格搜索

    在本研究中，采用网格搜索方法来确定模型的最佳配置以提高机器学习模型的性能。网格搜索方法是在机器学习领域一种基础且有影响力的方法论，作为通过超参数修改提高模型性能的关键工具
    [73]。通过对超参数的各种组合进行彻底调查，网格搜索有助于确定模型的最佳配置，从而对机器学习模型的性能产生实质性影响 [74]。此外，当超参数的精确值未知时，网格搜索特别有用。它提供了一种系统的方法来探索不同的参数配置，同时采用交叉验证来确定最佳超参数集
    [75]。


    与随机搜索、贝叶斯优化、基于梯度的优化和进化算法等替代超参数调优方法相比，网格搜索在其对所有可能组合的全面检查方面表现出色 [76]。这种全面方法有可能实现更高的准确性，前提是时间限制不是主要考虑因素。尽管可能存在计算需求，网格搜索仍被认为是在机器学习应用中实现模型优化的强大方法
    [77]。


    ### 3.2.5 SHAP 特征选择

    特征选择是机器学习模型开发中的关键步骤。特征选择有助于减少特征空间的维度 [78–80]。这是有利的，因为高维数据可能导致模型在训练数据上表现良好，但在未观察到的数据上表现不佳，这种情况称为过拟合
    [80]。通过减少特征数量，模型的计算复杂度降低，从而使学习算法运行更快。与不相关或仅部分相关的特征可能会对模型的性能产生负面影响 [79]。特征选择提高了分类算法的预测精度。当特征空间的维度降低时，学习过程的结果更容易解释
    [80]。


    对每个数据点的预测的特征影响。它封装了复杂的特征交互和依赖关系，超越了传统相关性技术的局限性 [85]。


