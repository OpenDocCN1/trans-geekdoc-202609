    RFR 也表现良好，测试的 $R^2$ 值高达 0.922，尽管略低于 XGBoost。与 XGBoost 相比，其训练和测试的 $RMSE$ 值分别更高，为
    2.071 和 3.129，表明拟合精度略低。此外，RFR 的 $MAE$ 值在训练 1.161 和测试 1.600 时也高于 XGBoost 的相应值。


    KNN 在三个模型中表现最差，训练和测试的 $R^2$ 值分别较低，为 0.689 和 0.677，表明可能存在过拟合。其 $RMSE$ 值明显更高，训练为
