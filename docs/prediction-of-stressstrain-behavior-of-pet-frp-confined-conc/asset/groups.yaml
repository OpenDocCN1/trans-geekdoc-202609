    # 7 Conclusions


    This study presents a comprehensive analysis of ML models for predicting the stress–strain
    behavior of PET FRP-confined concrete specimens, both circular and noncircular.
    Three ML models, XGBoost, KNN, and RFR, were evaluated'
  - '[PAGE 17]


    for their performance in predicting various properties of the stress–strain curves.


    +   1. For circular specimens, XGBoost demonstrated the most promising performance
    with high R²-values for both training and testing datasets, low RMSE, and MAE-values,
    indicating excellent accuracy and minimal errors in predictions. RFR also performed
    well but slightly lagged behind XGBoost, while KNN showed the least accuracy with
    higher absolute errors.

    +   2. For noncircular specimens, XGBoost again exhibited superior performance,
    with high R²-values, low RMSE, and MAE-values, showcasing its accuracy and consistency.
    RFR performed well, but KNN showed potential overfitting tendencies.

    +   3. For both circular and noncircular specimens, the XGBoost model showed impressive
    accuracy in predicting various parameters of the stress–strain curves, with low
    MAE and RMSE-values. The predictions closely aligned with the experimental values,
    highlighting the model’s precision.

    +   4. The XGBoost model outperformed a mechanism model proposed by [57] in accurately
    capturing essential curve points, such as ultimate stress and strain, for both
    circular and noncircular specimens. The XGBoost model showed greater consistency
    and reliability in predicting the stress–strain curves across a diverse range
    of specimens.

    +   5. The comparative analysis of predictive performance for compressive stress
    and strain revealed that the XGBoost model exhibited superior accuracy, consistency,
    and reliability in predicting ultimate compressive strain and strain for PET FRP-confined
    concrete, outperforming several other mechanism models considered in the comparative
    analysis.

    +   6. Feature importance analysis revealed that parameters like the number of
    PET FRP layers, fiber thickness (t_f), and corner radius significantly influenced
    stress–strain behavior. The feature dependency analysis highlighted linear relationships
    between these input features and output parameters, providing insights into their
    impact.


    In conclusion, the XGBoost model proved to be a robust and accurate tool for predicting
    the stress–strain behavior of PET FRP-confined concrete specimens. Its superior
    performance, consistency, and precision make it a valuable asset in the field
    of composite materials. Additionally, feature importance and dependency analysis
    shed light on the key factors driving the behavior of these specimens. This research
    contributes to the advancement of predictive modeling in civil engineering and
