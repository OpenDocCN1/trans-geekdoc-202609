    指标量化预测值与实际值之间误差的平均幅度，提供了一个简单准确度的度量。$MAE$ 越低表示模型性能越好。另一方面，$MSE$ 指标表示数据集中原始值与预测值之间平方差的平均值。它衡量残差的方差。最后，$RMSE$
