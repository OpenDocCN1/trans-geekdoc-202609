    [90]。


    ### 4.1.2 随机森林回归 (RFR)


    RFR 最初由 Breiman [91] 提出，并在 Bagging 技术上增加了一层随机化。由于大数定律，该方法的优势在于其对过拟合的抵抗力降低，使其成为预测建模的有价值工具。RFR
    通过智能地引入受控方差，在分类和回归任务中均表现出色。它使用不同的数据聚合方法为集成中的每棵树构建。


    RFR 依赖于决策树的自助聚合。RFR 与之前在所有变量上检查最佳分割的方法不同。它随机选择一组预测变量，并在每个节点找到最佳分割。这种新颖的方法改变了分类和回归树的构建。RFR
    优于支持向量机 (SVM) 和其他机器学习模型 [91]。它只需要两个参数：每个节点随机子集中变量的数量和森林中树的数量，使其用户友好且抗过拟合。这些参数的值很少重要
    [92]。在实际实现中，数据集被划分为与每个输入变量相对应的不同段。平方误差和 (SSE) 的计算涉及在每个给定位置对预期值和实际值的评估。随后，如参考文献
    [93] 中所述，计算节点的最小平方误差和 (SSE) 值。


    ### 4.1.3 K-最近邻 (KNN)


    KNN 算法是一种成熟的非参数方法，旨在找到查询的 k 个最近数据点并使用多数投票对其进行分类。 [94]。该方法因其有效性、简单性和直观性而被广泛认可并在现代计算机编程技术中得到应用
    [95, 96]。KNN 算法的一个显著优点是其独立于专门的训练阶段，因为它突出了 KNN 在不知道训练示例统计属性的情况下对数据点进行分类的能力 [97,
    98]。


