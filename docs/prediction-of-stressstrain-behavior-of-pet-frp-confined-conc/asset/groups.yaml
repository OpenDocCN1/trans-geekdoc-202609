    ## 5.4 Comparison with Existing Stress and Strain Models


    To further assess the performance of the XGBoost in predicting ultimate compressive
    stress (f_cu) and strain (ε_cu) for PET FRP-confined concrete, a comprehensive
    comparison was made. In addition to the selected mechanism model proposed by Pimanmas
    et al. [57], the predictions generated by XGBoost were compared with several other
    mechanism models [37, 53, 54, 56]. The objective was to provide a thorough evaluation
    of the XGBoost model’s accuracy and consistency in the predictive task.


    Table 8 provides detailed insights and a comprehensive view of this comparative
    analysis. The table offered a meticulous examination of the results, allowing
    for a comprehensive evaluation of the XGBoost model’s performance in the context
    of f_cu and ε_cu. The data in each cell of the table represent the ratio of predicted
    value by the model to the experimental value. A ratio of 1.00 indicates accurate
    predictions, while values greater or less than 1.00 indicate overestimation or
    underestimation, respectively. Notably, the XGBoost model in the present study
    demonstrates strong performance, with an average ratio close to 1.00, indicating
    accurate predictions. Furthermore, it displays a low standard deviation, implying
    consistent performance across various concrete classes and loading conditions.
    When compared to the other mechanism models, the XGBoost model stands out as a
    reliable performer, with a relatively high degree of accuracy and consistency.
    The coefficient of variation (COV) values offer insights into the relative variability
    of predictions, highlighting the XGBoost model’s advantage in terms of stability
    and reliability.


    ## 6 Feature Importance and Dependency Analysis


    ### 6.1 Feature Importance


    The utilization of SHAP feature importance offers significant insights into the
    learning process of complex models and the significance of input characteristics.
    In order to achieve consistency across characteristics, the calculation of relative
    importance was conducted through normalization. The relative relevance ranking
    of input characteristics for both circular and noncircular specimens is depicted
    in Fig. 8.


    Figure 8a illustrates the importance of several features in predicting the stress–strain
    behavior of PET FRP-confined concrete for circular specimens. The f_co was identified
    as the most significant parameter, followed closely by the number of PET FRP layers.
    The significance of the number of PET FRP layers in influencing the stress–strain
    characteristics was clear. Moreover, the parameter number of layers was followed
    by the parameter t_f representing the thickness of the fiber, which signifies
    that change in the fiber thickness influences the properties of the stress–strain
    characteristics. Lastly, it was noticed the area parameter has a comparatively
    lesser influence on the stress–strain characteristics when compared to other variables
    in circular specimens.


    On the other hand, Fig. 8b presents an overview of feature importance for noncircular
    specimens. It is noteworthy that the corner radius occupied the primary position
    as the most relevant component, followed by t_f. The parameter t_f played a substantial
    role in both circular and noncircular specimens. The t_f was followed by the parameter
    representing the number of layers of PET FRP, which signifies that changes in
    the number of layers magnify the impact of fiber thickness on the stress–strain
    characteristics. Finally, it was observed that the parameter f_co had the least
    impact on noncircular specimens among the parameters that have been addressed.


    ### 6.2 Feature Dependency Analysis


    ### 6.2.1 Circular Specimens


    In this section, the feature dependency analysis was delved specifically tailored
    to circular PET FRP specimens. The focus of this investigation lay in understanding
    how various input variables influenced the specimens’ behavior. To achieve this,
    SHAP analysis, a powerful technique for unveiling the intricate relationships
    between input features and model predictions, was employed. The illustrations
    in Fig. 9 show the feature dependency of circular specimens. The SHAP values of
    layers for the output f_cu increased with the increase in the layers of PET FRP
    indicating a linear relationship between them. Similarly, Fig. 9c shows the SHAP
    values of layers for the output of ε_cu increases with the increase in the number
    of layers of PET FRP indicating a linear relationship between these two.


    These analysis results were found to be aligned with the notable findings presented
    by [17]. It was found that the circular specimens’ f_cu and ε_cu increased linearly
    with the increase in the PET FRP layers. Furthermore, f_c1 was also increased
    approximately linearly with PET FRP layers [17].


    ### 6.2.2 Noncircular Specimens


    Firstly, a notable positive correlation was found between the number of PET FRP
    layers and the f_cs for noncircular specimens. Figure 10a presents that as the
    layers increased, f_cs exhibited a consistent and linear improvement. Similarly,
    a linear relationship emerged between the number of layers and the f_cu, indicating
    that increased layers positively influenced f_cu. Furthermore, the same linear
    relationship was found between the number of layers and the ε_cu.

