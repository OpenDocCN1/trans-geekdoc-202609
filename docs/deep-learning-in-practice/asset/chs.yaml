  \ 10)\nx_train = x_train / 255.0\nx_test = x_test / 255.0\n```\n\n**步骤 4：** **构建模型**\n\
  ```\nmodel = keras.Sequential([\n   keras.layers.Flatten(input_shape=(28,28)),\n\
  \   keras.layers.Dense(256, activation='relu'),\n   keras.layers.Dense(32, activation='relu'),\n\
  \   keras.layers.Dense(10, activation='softmax')])\n```\n\n**步骤 5：** **模型摘要**\n\
