  ```\n\n## 6.6 图像分割\n\n图像分割是将图像分割有意义的部分，有助于更好地更好地分析图像。多种传统的图像分割方法根据图像颜色、强度或纹理进行分割。图像分割是\
  \ CNN 的图像分析应用之一。在这里，我们实现一个示例来展示 CNN 如何帮助我们进行图像分割。\n\n### 6.6.1 导入库\n\n在本节中，我们使用\
  \ TensorFlow、python 和 matplotlib 库来完成模型的生成和可视化。\n\n```python\n#导入库\nfrom tensorflow_examples.models.pix2pix\
  \ import pix2pix\nimport tensorflow_datasets as tfds\nfrom IPython.display import\
  \ clear_output\nimport matplotlib.pyplot as plt\n```\n\n### 6.6.2 加载数据并生成数据集\n\n\
  在这一步中，我们应该加载并将其划分为训练和测试数据，调整数据大小，找到正确的掩码并归一化数据。\n\n\n\n\n\n```\n# load the data\n\
  def load_image_train(datapoint):\n input_image1 = tf.image.resize(datapoint['image'],\
  \ (128, 128))\ninput_mask1 = tf.image.resize(datapoint['segmentation_mask'], (128,\
  \ 128))\n if tf.random.uniform(()) > 0.5:\n input_image1 = tf.image.flip_left_right(input_image1)\n\
  \ input_mask1 = tf.image.flip_left_right(input_mask1)\n input_image1, input_mask1\
  \ = normalize(input_image1, input_mask1)\n return input_image1, input_mask1\ntrain_lenght1\
  \ = info.splits['train'].num:examples\n# define the dataset categories\nbatch_size=\
  \ 64\nbuffer_size = 1000\nsteps_per_epoch = train_lenght1 // batch_size\ntrain =\
  \ dataset['train'].map(load_image_train, num:parallel_calls=tf.data.experimental.AUTOTUNE)\n\
  test = dataset['test'].map(load_image_test)\ntrain_dataset = train.cache().shuffle(BUFFER_SIZE).batch(BATCH_SIZE).repeat()\n\
  train_dataset = train_dataset.prefetch(buffer_size=tf.data.experimental.AUTOTUNE)\n\
  test_dataset = test.batch(BATCH_SIZE)\n```\n\n### 6.6.3 分割图 (Segmentation Map)\n\
  \n在这里我们根据输入图像定义真实掩码（mask）。图 6.18 显示了图像的原始和真实掩码。\n\n```\n#set the output display\n\
  def display(display_list):\n plt.figure(figsize=(15, 15))\n title1 = ['Input Image',\
  \ 'True Mask', 'Predicted Mask']\n for i in range(len(display_list)):\n plt.subplot(1,\
  \ len(display_list), i+1)\n plt.title1(title1[i])\n plt.imshow(tf.keras.preprocessing.image.array_to_img(display_list[i]))\n\
  \ plt.axis('off')\n plt.show()\nfor image, mask in train.take(24):\n sample_image,\
  \ sample_mask = image, mask\ndisplay([sample_image, sample_mask])\n```\n\n![图 6.18\
  \ 输入图像的掩码值。](img/fig6_18_B.jpg)\n\n图 6.18 输入图像的掩码值\n\n### 6.6.4 构建模型 (Make the Model)\n\
  \n现在我们定义一个包含卷积层和池化层的模型。输入图像有三个通道，尺寸为 128×128。\n\n```\nOUTPUT_CHANNELS = 3\nbase_model\
  \ = tf.keras.applications.MobileNetV2(input_shape=[128, 128, 3], include_top=False)\n\
  # Use the activations of these layers\nlayer_names = [\n 'block_1_expand_relu',\n\
  \ 'block_3_expand_relu'\n 'block_6_expand_relu',\n 'block_13_expand_relu'\n 'block_16_project'\n\
  ]\nlayers = [base_model.get_layer(name).output for name in layer_names]\n# Create\
  \ the feature extraction model\ndown_stack = tf.keras.Model(inputs=base_model.input,\
  \ outputs=layers)\ndown_stack.trainable = False\nup_stack = [\n pix2pix.upsample(512,\
  \ 3),\npix2pix.upsample(256, 3),\n pix2pix.upsample(128, 3),\n pix2pix.upsample(64,\
  \ 3),\n]\ndef unet_model(output_channels):\n inputs = tf.keras.layers.Input(shape=[128,128,3\
  \ ])\n x = inputs\n# Downsampling\n skips = down_stack(x)\n x = skips[-1]\n skips\
  \ = reversed(skips[:-1])\n# Upsampling\n for up, skip in zip(up_stack, skips):\n\
  \ x = up(x)\n concat = tf.keras.layers.Concatenate()\n x = concat([x, skip])\n#\
  \ This is the last layer\n last = tf.keras.layers.Conv2DTranspose(\n output_channels,\
  \ 3, strides= 2,\n padding= 'same' )\n x = last(x)\n return tf.keras.Model(inputs=inputs,\
  \ outputs=x)\nbase_model.summary()\n```\n\n模型摘要显示了网络架构以及可训练参数和总参数的数量。这里的网络很大，但追踪其结构非常有意思。\n\
