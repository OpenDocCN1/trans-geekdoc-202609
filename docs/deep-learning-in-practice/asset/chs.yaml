  ```\n\n### 4.7.2 反向传播\n\n反向传播是一种监督学习算法，需要通过训练数据进行训练。以下是实现反向传播算法的步骤：\n\n1. **步骤 1：**\
  \ **前向传播**：数据向量 `x` 通过通过神经网络并产生输出 `f(x)`。每一层的激活函数可以不同也可以相同，但最后一层除外，它根据模型和问题类型（分类或回归）控制输出类型。图\
  \ 4.20 展示了一个反向传播网络的示例。\n\n![图 4.20 反向传播架构。](img/fig4_20_B.jpg)\n\n\n\n\n## 2. 第\
  \ 2 步：反向传播：使用梯度更新所有层的权重（使用第 1 步输出的误差来更新所有网络权重，从最后一层到前面的层）。最后一层使用链式法则和梯度计算新权重，并一直持续到第一层（输入层\
  \ (`w[1]`））。\n\n## 4.7.3 单层感知机\n它由 Frank Rosenblatt 于 1964 年在康奈尔大学发明。它是最简单的前馈神经网络，且不包含任何隐藏层。单层感知机只能学习线性函数。图\
