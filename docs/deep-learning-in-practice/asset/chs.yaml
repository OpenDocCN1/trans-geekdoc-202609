  \ metrics=['accuracy'], optimizer='adam')\n```\n\n**步骤 7：** **训练模型**\n```\nn_val\
  \ = 5000\nn_train = 60000\nn_test = 10000\nbatch_size = 100\nepochs = 100\nsteps_per_epoch\
