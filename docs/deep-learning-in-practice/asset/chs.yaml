  Total params: 1,169,336\nTrainable params: 1,169,336\nNon-trainable params: 0\n\
  ```\n\n#### 5. 合并生成器与判别器\n\n在这一步，你需要定义合并生成器和判别器的函数：\n\n```python\ndef create_gan(generator,\
  \ discriminator, label_smoothing=0):\n   discriminator.trainable = False\n   generator_input\
  \ = generator.input\n   generator_output = generator.output\n   gan_output = discriminator([generator_input,\
  \ generator_output])\n   opt = Adam(lr = 0.0001)\n   loss = BinaryCrossentropy(label=label_smoothing)\n\
  \   gan.compile(loss = loss, optimizer = opt, metrics = ['accuracy'])\n   return\
  \ gan\n```\n\n你可以看到 GAN 的摘要：\n\n```python\ngan = create_gan(generator, discriminator)\n\
  gan.summary()\n```\n\nGAN 模型是：\n\n\n\n\n\n```python\ndef train_gan(gan, generator,\
  \ discriminator, latent_dim, epochs, batches_per_epoch, batch_size, initial_image_noise,\
  \ verbose=1):\n   image_noise_decrement = initial_image_noise / epochs\n   image_noise_magnitude\
  \ = initial_image_noise\n   if verbose > 0:\n   print(f\"Beginning training... {epochs}\
  \ epochs, each with {batches_per_epoch} batches of {batch_size}\")\n   print(f\"\
  Latent vector size {latent_dim}\")\n   print(f\"Image noise initial magnitude: {image_noise_magnitude},\
  \ decay: {image_noise_decrement}\")\n   print(\"Training... \")\n   print(\"Metrics:\
  \ Discriminator Real, Discriminator Fake, Generator\")\n   for i in range(epochs):\n\
  \   train_gan_single_epoch(gan, generator, discriminator, latent_dim, batches_per_epoch,\
  \ batch_size, image_noise_magnitude, verbose=verbose)\n   print('the epoch is: ',\
  \ i)\n   image_noise_magnitude -= image_noise_decrement\n   if verbose >= 1:\n \
  \  fake_images, fake_labels, fake_classes = generate_fake_batch(generator, latent_dim,\
  \ N_CLASSES, 10)\n   disc_fake_classifications = discriminator.predict([fake_images,\
  \ fake_classes])\nfake_images = (fake_images + 1) / 2\n   print(f'After {(i+1)*BATCHES*BATCH_SIZE}\
  \ samples.')\n   print('Image labels are D(image) and Class(image)')\n   print('\
  \ Generated Images and Discriminator Output:')\n   for i in range(10):\n   ax =\
  \ plt.subplot(2, 5, i+1)\n   ax.axis('off')\n   ax.set_title(f'{disc_fake_classifications[i][0]:.2f},\
  \ {fake_classes[i]}')\n   plt.imshow(fake_images[i].reshape(INPUT_SHAPE[0], INPUT_SHAPE[1]))\n\
  \   plt.tight_layout()\n   plt.show()\n   print(' Real Images and Discriminator\
  \ Output:')\n   real_images, real_batch_labels, real_classes = generate_real_batch(prepared_real_images,\
  \ real_train_labels, 10)\n   disc_real_classifications = discriminator.predict([real_images,\
  \ real_classes])\n   real_images = (real_images + 1) / 2\n   for i in range(10):\n\
  \   ax = plt.subplot(2, 5, i+1)\n   ax.axis('off')\n   ax.set_title(f\"{disc_real_classifications[i][0]:.2f}\
  \ {real_classes[i]}\")\n   plt.imshow(real_images[i])\n   plt.tight_layout()\n \
  \  plt.show()\n```\n\n现在你可以训练模型了：\n\n```python\nEPOCHS = 50\nBATCHES = 50\nBATCH_SIZE\
  \ = 128\nIMAGE_NOISE_START = .1\nLABEL_SMOOTHING_MAGNITUDE = .1\n# 训练 50 个 epoch\n\
  discriminator = create_discriminator(INPUT_SHAPE, N_CLASSES, label_smoothing = LABEL_SMOOTHING_MAGNITUDE)\n\
  generator = create_generator(NOISE_DIM, LATENT_DENSE_SIZE, N_CLASSES)\ngan = create_gan(generator,\
  \ discriminator, label_smoothing = LABEL_SMOOTHING_MAGNITUDE)\ntrain_gan(\n   gan,\n\
  \   generator,\n   discriminator,\n   NOISE_DIM,\n   EPOCHS,\n   BATCHES,\n   BATCH_SIZE,\n\
  \   IMAGE_NOISE_START,\n   verbose=2\n)\nsave_model(generator, 'cgan_model100.h5')\n\
  ```\n\n### 5.6.2.7 预测（生成数据）\n\n```python\nmodel = load_model('cgan_model100.h5')\n\
  fig = plt.figure()\nfig.set_size_inches(16, 16)\n# 显示图像\ndef plot(examples, n):\n\
  \   for i in range(n * n):\n   plt.subplot(n, n, 1 + i)\n   plt.axis('off')\n```\n\
  \n\n\n\n\n如果每一层中存在某些模式，它们的输出值就会较高；如果模式不存在，每层的输出值就会较小。值越高，概率就越大。例如，假设我们正在开发一个脸识别系统；某一层会在输出中寻找如鼻子、嘴唇、眼睛和嘴巴等脸部区域模式。如果网络发现更多模式，那么将图像分类为脸的概率就会增加。相反，缺少这些模式会降低图像中存在脸的概率。图\
  \ 6.4 显示了从原始图像中提取的不同特征图（8 张特征图）。更多的层和更多的滤波器会产生更多的特征图并提高准确率（并非总是如此！）。\n\n![图 6.4\
  \ 图像中的不同模式。](img/fig6_4_B.jpg)\n\n图像中的不同模式\n\n用于图像分析应用的深度学习（DL）方法主要有两种类型：监督学习和无监督学习。此外，我们根据这两种学习方法对图像分析中最常用的深度学习进行了分类：\n\
  \n1. **监督学习**\n    * 目标检测，\n    * 图像分类，以及\n    * 图像分割。\n2. **无监督学习**\n    * 图像生成\n\
  \n这些应用有不同的算法。表 6.1 显示了其中一些方法和算法。\n\n图像分析最常用的深度学习方法表](#ch6.xhtml#R_t6_1)\n\n| 任务\
  \ || 模型架构 | 框架 |\n| --- | --- | --- |\n| 目标检测 | R-FCN, Faster R-CNN | TensorFlow\
  \ |\n| 图像分类 | VGG, Inception, ResNet | TensorFlow, PyTorch, Keras |\n| 图像分割 | 通用分割：DeepLab,\
  \ PSPNet 医疗图像分割：U-Net, HyperDense-Net 分割：Mask RCNN | TensorFlow, PyTorch |\n| 图像生成\
  \ | DCGAN, CycleGAN, ProGAN, BigGAN | \\- |\n\n### 6.2.1 滤波器参数\n\n某些滤波器参数如尺寸、类型和步长可以更改，并影响学习过程和网络性能。在这里我们更详细地回顾这些参数，以了解它们是如何改变网络性能的。\n\
  \n### 6.2.1.1 滤波器的数量和类型\n\n正如我们所提到的，滤波器的输出是特征图。每个滤波器都设计用于提取和检测特定的模式。例如，某些滤波器用于提取线条，而另一些用于提取颜色。滤波器可以更具定制性，例如提取垂直线或水平线。滤波器的类型（提取特征的类型）取决于问题类型和数据类型。我们可以在每层中使用尽可能多的滤波器，但关键点在于每层滤波器越多，分类就越准确（并非总是如此），但另一方面，它会增加计算成本。目前还没有任何经验法则可以表明滤波器数量与性能之间的关系。这来自于实验，并且在不同问题之间可能会有所不同。你可以通过更多的测试来为你的架构（基于你的问题）找到这些数值。当你开始创建架构时，可以从基础网络架构开始，然后通过添加和更改滤波器的数量和类型，为你的问题找到最佳架构。请记住，CNN\
  \ 中有一些经过验证且广为人知的架构，你可以用于你的问题。出于学习目的，我们建议你针对一个问题，然后创建基础网络并尝试寻找它的瓶颈以提高其性能。现在，尝试使用一种流行的训练好的\
  \ CNN 算法或预训练网络进行结果，并比较你的结果。\n\n### 6.2.1.2 滤波器尺寸\n\n滤波器的尺寸可以小也可以大！最流行的尺寸是`3×3`。通过选择更大的尺寸，可能会找到更大的模式（为了保持输出尺寸）。滤波器可以更具定制性，例如提取垂直线或水平线。滤波器的类型（提取特征的类型）取决于问题和数据类型。我们可以在每层中使用尽可能多的滤波器，但关键点在于每层滤波器越多，分类就越准确（并非总是如此），但另一方面，它会增加计算成本。目前还没有任何经验法则可以表明滤波器数量与性能之间的关系。这来自于实验，并且在不同问题之间可能会有所不同。你可以通过更多的测试来为你的架构（基于你的问题）找到这些数值。当你开始创建架构时，可以从基础网络架构开始，然后通过添加和更改滤波器的数量和类型，为你的问题找到最佳架构。请记住，CNN\
  \ 中有一些经过验证且广为人知的架构，你可以用于你的问题。出于学习目的，我们建议你针对一个问题，然后创建基础网络并尝试寻找它的瓶颈以提高其性能。现在，尝试使用一种流行的训练好的\
  \ CNN 算法或预训练网络进行结果，并比较你的结果。\n\n（注：原文 Stride and Padding 处存在部分重复和逻辑混乱，翻译已根据语意对齐）\n\
  \n### 6.2.1.3 步长与填充\n\n步长是滤波器在图像上移动的步数。填充是在图像边缘添加像素的操作，以防止在卷积过程中图像尺寸缩小，并允许滤波器提取边缘的特征。\n\
  \n\n\n\n\n该层没有学习参数，但具有计算开销，可能会影响学习性能。因此，明智地选择池化层的大小并将其正确地放在架构中的合适位置可以提高性能。\n\n###\
  \ 6.2.2.4 全连接层 (FC)\n\n所有的输入和输出都有可分离的权重。因此，基于输入和输出加上偏置的权重数为：\n\n```\n((C × P) +\
  \ 1 × C)\n```\n\n当前层的神经元数量为 `C` 或输出 `(O)`，前一层的神经元数量为 `P` 或输入 `(I)`。每一层的输出为：\n\n\
  ```\ninput_size 减 (filter_size 减 1)\n```\n\n例如，如果输入是一个图像且图像大小为 `28×28`，滤波器大小为 `3×3`，那么该层的输出为：\n\
  \n```\n(28 − (3 − 1)) = 26\n```\n\n让我们来看一个通用的模型示例。如果输入是一个大小为 `28×28` 形状为 `28×28×1`\
  \ 的图像，它没有参数。\n\n假设这些值为：\n\n```\nstride=1,\nkernel_ size=3×3,\n第一层的滤波器数量 =32,\n那么参数的数量为：\n\
  ((kernel_size) × stride + 1) × number of filters)\nC1: 3×3×1+1×32\n= 320\n```\n\n\
  在下一层中，我们已经从上一层获得了 32 个学习到的滤波器，那么可训练参数的数量为：\n\n$$\\begin{array}{l} {C\\_{2}:3\\\\\
  mspace{9mu} \\times \\\\mspace{9mu} 3\\\\mspace{9mu} \\times \\\\mspace{9mu} 32\\\
  \\mspace{9mu} + \\\\mspace{9mu} 1\\\\mspace{9mu} \\times \\\\mspace{9mu} 32\\\\\
  mspace{9mu} = \\\\mspace{9mu} 9,248} \\\\\\\\ {C\\_{3}:3\\\\mspace{9mu} \\times\
  \ \\\\mspace{9mu} 3\\\\mspace{9mu} \\times \\\\mspace{9mu} 32\\\\mspace{9mu} + \\\
  \\mspace{9mu} 1\\\\mspace{9mu} \\times \\\\mspace{9mu} 64\\\\mspace{9mu} = \\\\\
  mspace{9mu} 18,496} \\\\\\\\ \\\\end{array}$$\n\n<img src=\"images/eqni6\\_1.jpg\"\
  />\n\n以此此类推。总参数是所有这些值的总和。例如，在这三层中，有 28,064 个参数：\n\n```\nC1 + C2 + C3 = 320 + 9,248\
  \ + 18,496 = 28,064\n```\n\n计算网络参数的数量是验证良好网络架构的一部分。使用摘要构建模型后，你可以在 `TensorFlow` 中详细检查每一层的参数数量。我们计划回顾最流行的\
  \ CNN 架构类型。如前所述，你可以从零开始创建架构，然后将你的结果与这些常见架构进行比较，并选择最好的。\n\n### 6.2.3 Imagenet 挑战\n\
  \n自 2010 年以来，一项名为 `ImageNet 大规模视觉识别挑战` (`ILSVRC`) 的竞赛被设计用于测试不同的算法。首次分类率为 25%，最佳成绩属于\
  \ `AlexNet`，它实现了 10% 的错误率（然而，最近的先进算法显示了更好的结果）。此外，还有一个包含超过 1400 万张图像的视觉数据库，人们用它比较自己的结果。\n\
  \n### 6.2.4 CNN 架构\n\n本节介绍了一些最流行的 CNN 算法。有几种性能不同的架构。这些架构之间最显著的区别在于：\n\n* 层数\n* 每层中的元素\n\
  * 层之间的连接\n\n这三个参数定义了你的模型，并包含了网络参数和超参数。\n\n### 6.2.4.1 LeNet-5 (1998)\n\n该网络是 1998\
  \ 年提出的最简单的深度神经网络之一，共有七层：\n\n* 两个卷积层\n* 三个全连接层\n* 两个池化层\n\n它的第一个应用是手写识别（`3+2=7` 层），它大约有\
  \ 6,000 个参数（`6×32=6,144`）。`图 6.8` 详细展示了它的架构。让我们进一步讨论它的滤波器和参数。如果 `stride` 为 1，总参数为：\n\
  \n```\n(n + 2p − f)/s + 1 × (n + 2p − f)/s + 1 × Nc\n```\n\n其中：\n\n* `Nc`: 是通道数（用于卷积的滤波器数量）\n\
  * `p`: 填充（LeNet-5 中没有填充）\n* `s`: 步长\n\n![图 6.8 LeNet5 架构。](img/fig6_8.jpg)\n\n那么参数的数量为：\n\
  \n$$\\begin{array}{l} \\left. \\left( {32 + 0 - 5} \\right)/1 + 1 \\times \\left(\
  \ {32 + 0 - 5} \\right)/1 + 1 \\times 6 \\right. \\\\ {= 28 \\times 28 \\times 6\
  \ = 4,704} \\\\ \\end{array}$$\n\n<img src=\"images/eqni6\\_2.jpg\"/>\n\n### 6.2.4.2\
  \ AlexNet (2012)\n\nAlex 是在 ImageNet 中提出的第一个并在 2012 年赢得该比赛的深度学习方法之一。你可以在 `图 6.9`\
  \ 中看到它的 DL 架构。它的架构类似于 `LeNet`，但层更多（更深）。\n\n他们提出了丢弃（dropout）技术来降低计算开销，并与其他方法相比取得了更好的结果。他们还在方法中使用了\
  \ `ReLU` 来提高性能。他们使用了最大池化层来使方法运行更快。它的架构有八层，包括：\n\n* 五个卷积层\n* 三个具有 6000 万个参数的全连接层\n\
  * `ReLU`\n\n![图 6.9 AlexNet 网络架构。](img/fig6_9.jpg)\n\n### 6.2.4.3 GoogleNet/Inception-v1\
  \ (2014)\n\nGoogleNet 是一个总共 22 层的 CNN。提供了预训练版本，你可以下载并使用。`图 6.10` 展示了它的架构。\n\n![图\
  \ 6.10 GoogleNet。](img/fig6_10.jpg)\n\n它以少于 7% 的错误率获得了 ILSVRC 2014。它的架构使用了诸如批归一化等技术将参数减少到\
  \ 400 万到 500 万。此外，它包含了一些 `inception`（来自下一个版本）模块，每层包含并行卷积滤波器。如 `图 6.10` 所示，它的网络非常深，准确率更高，但计算开销更高。\n\
  \n### 6.2.4.4 VGGNet-16 (2014)\n\nVGGNet-16 是一种 2014 年提出的 CNN，其架构包含 16 层。它在 ImageNet\
  \ 测试图像上实现了 92.7% 的准确率。它是通过替换大卷积滤波器对 `AlexNet` 的改进。它的训练非常慢，权重很大。它已被用于许多图像分类问题并显示了非常的结果。你可以使用当前的深度学习平台如\
  \ `TensorFlow`、`Keras` 或 `Pytorch` 实现它。`图 6.11` 展示了它的架构。它的架构包括：\n\n* 13 个卷积层\n*\
  \ 三个全连接层\n\n它有 1.3 亿个参数，占用 500 MB 空间（提高性能最简单的方法可能是增加层数）。\n\n![图 6.11 VGGNet-16 网络。](img/fig6_11.jpg)\n\
  \n### 6.2.4.5 Inception-v3 (2015)\n\n它是 `Inception-v1` 的下一代（在 `Inception-v2` 在对损失函数进行微调并使用批归一化等其他技术之后）。它有\
  \ 2400 万个参数，是一种用于图像分析和物体分类的 CNN。由 Google 在 2015 年提出，并在 ImageNet 数据集上显示了非常的结果。`图\
  \ 6.12` 展示了它的架构，是 Google 提出的第一个算法的第三个版本。\n\n\n\n\n它包含 46 个卷积层、两个全连接层以及两个 SoftMax\
  \ 层。尽管，如你在图 6.12 中所示，架构中某些部分的卷积层具有不同层次，它们的输出总和构成了下一层的输入。此外，还有一个连接层为下一层准备了这些输入。\n\
  \n### 6.2.4.6 ResNet (2015)\n\n仅通过增加网络深度，准确率的提升无法超过一个阈值。这个由微软提出的网络通过捷径连接（残差）来解决\
  \ ResNet 问题，以构建更深的网络。ResNet 在 2015 年的 ILSVC 中获得冠军，其 152 层的网络错误率低于 3.6%。这是一种非常深的\
  \ CNN 方法。图 6.13 展示了三种架构，并将 VGG-19 与 34 层平层网络和 34 层残差网络进行比较，以说明这种复杂性。它已应用于多个计算机视觉领域。\n\
  \n![图 6.13 ResNet 网络。](img/fig6_13_B.jpg)\n\n图 6.13 ResNet 网络。\n\n### 6.2.4.7 Inception-v4\
  \ (2016)\n\nInception-v3 的改进版是谷歌在 2016 年提出的 Inception-v4，其架构具有以下变化：\n\n* stem 模块变化，\n\
  * 更多的 inception 模块，以及\n* 每个模块使用相同数量的过滤器。\n\n这是一种卷积神经网络架构，降低了 inception-v3 的复杂性，但其性能与\
  \ V3 相当。它在 2016 年的 ImageNet 上实现了 3.08% 的 top-5 错误率。它已应用于多个计算机视觉领域并取得了良好的结果。你可以使用\
  \ TensorFlow、Keras 和 Pytorch 等多个 DL 平台实现它。图 6.14 展示了它的架构。\n\n![图 6.14 Inception-v4\
  \ 网络。](img/fig6_14_B.jpg)\n\n图 6.14 Inception-v4 网络。\n\n## 6.3 使用 CNN 实现模型的通用策略\n\
  \n使用深度学习（DL）构建模型有一些通用的步骤，首先我们回顾一下这些步骤。现在，你应该考虑计划在模型中使用的架构。我们在上一节中讨论了最流行的 CNN 架构。然后，你可以轻松地使用\
  \ Keras 部署所有模型，比较结果，并在你的模型中选择合适的架构。使用 CNN 实现模型分为五个步骤：\n\n1. **第 1 步**：导入库，\n2. **第\
  \ 2 步**：加载数据，\n3. **第 3 步**：定义模型，\n4. **第 4 步**：训练模型，以及\n5. **第 5 步**：测试模型。\n\n\
  ### 6.3.1 导入库\n\n在任何程序中，第一步都是导入库以便在程序中使用它们的方法。\n\n### 6.3.2 加载数据并创建数据\n\n在任何程序中，第一步都是导入库以便在程序中使用它们的方法。（此处省略了原文中大量重复的句子）\n\
  \n### 6.3.3 构建模型\n\n### 6.3.4 训练模型\n\n### 6.3.5 测试模型\n\n## 6.4 使用 CNN 进行目标识别\n\n\
  ### 6.4.1 导入库\n\n### 6.4.2 加载数据并生成数据集\n\n### 6.4.3 构建模型\n\n\n\n\n```\nmodel = Sequential()\n\
  model.add(Conv2D(filters=32, kernel_size=(4,4), strides=(1,1), padding='valid',\
  \ input_shape=(32,32,3), activation=\"relu\"))\nmodel.add(Conv2D(filters=32, kernel_size=(4,4),\
  \ strides=(1,1), padding='valid', input_shape=(32,32,3), activation=\"relu\"))\n\
  model.add(MaxPool2D(pool_size=(2, 2)))\nmodel.add(Flatten())\nmodel.add(Dense(256,activation=\"\
  relu\"))\nmodel.add(Dense(10, activation=\"softmax\"))\nmodel.compile(loss=\"categorical_crossentropy\"\
  , optimizer=\"adam\", metrics=['accuracy'])\n```\n\n我们可以如下如下检查模型架构和参数：\n\n```\n\
