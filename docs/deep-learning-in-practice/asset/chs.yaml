  ```\n\n# 第 5 章 深度神经网络 (DNN) 基础与架构\n\nDOI: [10.1201/978100302518](https://doi.org/10.1201/978100302518)\n\
  \n## 5.1 深度神经网络\n在你从事深度学习时，有一些概念是你需要了解的。本章将回顾深度学习模型、概念和定义。\n\n### 5.1.1 什么是深度学习？\n\
  深度学习算法（人工神经网络的一个子集）处理不同的数据类型。深度学习通过不同的单元（神经元）来处理数据。深度学习算法（人工神经网络的一个子集）通过不同的层来处理数据。“深度”指的是层数。深度学习具有许多层和超参数，有助于更好地学习。深度学习结构通过许多层（通常是深度）来解决现实问题。\n\
  \n### 5.1.2 深度学习需要\n深度学习需要大量的数据，计算成本很高。通过解决这两个挑战（大量数据和高计算成本），我们可以更有效地部署深度学习。\n\n\
  ### 5.1.3 如何高效部署 DL？\n在训练好模型后，有一些高效部署的关键点：\n1. 拥有正确且适当的数据，\n2. 进行正确且必要的数据预处理，\n\
  3. 选择正确的特征，\n4. 选择合适的算法，\n5. 设置正确的网络参数，\n6. 设置正确的超参数，\n7. 定义正确的层。\n\n在这里，我们介绍了一些开始从事深度学习前需要了解的定义和概念。\n\
  \n### 5.1.4 梯度消失\n使用深度学习的挑战之一是梯度消失问题。梯度是一种优化技术，当网络权重变为负值时，随着时间的推移，权重值将变得非常小并接近零（对于接近零的权重值，它们的梯度为零）。这就是问题所在：网络无法更新，并会停留在某一点。因此，它的名字梯度消失，因为在这种情况下梯度不再起！有几种解决方案，例如使用消除负值的整流线性单元\
  \ (`ReLU`)。\n\n### 5.1.5 通道\n深度学习中的输入数据可能有不同的通道。例如，如果数据是图像并使用 RGB（彩色图像的标准），这些数据就有三个通道（红、绿、蓝）。\n\
  \n### 5.1.6 嵌入\n嵌入将输入数据（如图像、文本和音频）表示为向量。例如，我们将图像等数据嵌入到公共空间，而在情感分析中，嵌入过程将单词转换为向量。\n\
  \n### 5.1.7 微调\n这是一种为任务初始化网络参数的方法，然后用新任务更新这些参数。例如，NLP 系统中有预训练的词嵌入（如词到向量），其参数可以针对特定任务（如内容分析或情感分析）进行更新。\n\
  \n### 5.1.8 数据增强\n使用某些方法（取决于数据类型）从原始数据生成新数据是深度学习的挑战之一。例如，翻转和旋转是创建新数据的两种方法。\n\n###\
  \ 5.1.9 泛化\n\n\n\n\n\nNN 的性能主要取决于其泛化潜力，这有助于模型泛化，并赋予其处理新数据的能力。作为人工神经网络（ANN），深度学习网络更好地涵盖泛化以提高模型的灵活性。有几种方法如正则化可以增加泛化能力。\n\
  \n### 5.1.10 正则化\n\n这是一种通过在学习过程中进行一些微调，使模型泛化得更好且更灵活的方法。我们在接下来的章节中讨论的某些正则化方法包括 `L[1]`、`L[2]`\
  \ 和 dropout。\n\n## 5.1.11 L[1] 和 L[2]\n\n这些是最流行的正则化方法。在这里，通常我们会添加一个正则化项（regularization\
  \ term）并更新代价函数。\n\n```\nCost function = Loss + Regularization term\n```\n\n通过增加这些值，权重值将会降低，以使模型更简单并泛化得更好。有两个主要的项：`L[1]`\
  \ 和 `L[2]`。`L[2]` 是：\n\n```\nCost function = Loss + Lambda/2m × ∑ ||w||2\n```\n\n\
  lambda 是超参数。`L[2]` 被称为权重衰减方法。它使权重趋于零但不为零。此外，`L[1]` 是：\n\n```\nCost function = Loss\
  \ + lambda/2m × ∑ ||w||\n```\n\n通常，我们更倾向于使用 `L[2]` 而不是 `L[1]`，除非我们计划进一步压缩模型（因为在\
  \ `L[1]` 中，权重可能会减至零）。\n\n## 5.1.12 Dropout\n\nDropout 的原理是在训练步骤中掩码（丢弃）网络中的某些节点（我们将在本章稍后详细解释这一概念）。\n\
  \n## 5.1.13 端到端学习\n\n深度学习支持端到端学习，有助于更有效地解决问题。例如，使用传统的 AI 方法或人工神经网络识别脸部需要经过裁剪、平移、检测和识别等步骤。然而，当你使用深度学习时，不需要这些步骤，网络中的层会自动从数据中提取特征（第\
  \ 7 章 提供了深度学习进行人脸识别的实现示例）。\n\n## 5.2 深度学习应用\n\n深度学习具有为复杂的现实问题建模的能力。它的算法不仅用于图像、音频或某些信号数据的分类。深度学习算法被应用于许多领域，如：\n\
  \n* 自驾驶汽车，\n* 自然语言处理，\n* 内容分析，\n* 视觉识别，\n* 时尚，\n* 聊天机器人，\n* 虚拟代理，\n* 文本生成，\n* 手写体生成和机器翻译，\n\
  * 广告，以及\n* 欺诈检测。\n\n有很多部署深度学习的研究和项目，从医学图像分析到药物发现和基因组分析。根据数据的性质，问题的现实问题可以通过深度学习解决；例如进行实时人类行为分析、语言翻译和预测自然灾害。自动驾驶是\
  \ `google`、`apple`、`tesla` 和 `uber` 等许多大型投资的热点之一。金融行业是另一个使用深度学习进行交易欺诈检测的领域。它为金融和保险机构节省了数十。通过使用客户交易和信用评分等信息，系统分类并检测欺诈（图\
  \ 5.1）。\n\n![图 5.1 深度学习技术的若干应用。](img/fig5_1_B.jpg)\n\n图 5.1 深度学习技术的若干应用。\n\n如今，我们在日常生活中使用了如\
  \ `Alexa`、`Siri` 和 `google assistance` 等虚拟助手服务。这些产品为你提供如所需的歌曲或餐厅等智能服务，并以智能的方式与你互动。它们理解人类语言并为你提供智能且自主的响应。它们还为你提供一些服务，如阅读或撰写电子邮件以及整理文档（图\
  \ 5.2）。\n\n![图 5.2 医疗保健是深度学习的新应用之一。](img/fig5_2_B.jpg)\n\n图 5.2 医疗保健是深度学习的新应用之一。\n\
  \n我们在第 7 章中回顾虚拟助手机器人的实现步骤（图 5.3）。\n\n![图 5.3 虚拟助手机器人使用深度学习方法。](img/fig5_3_B.jpg)\n\
  \n图 5.3 虚拟助手机器人使用深度学习方法。\n\n## 5.3 深度学习算法与体系\n\n当我们有一个具有多层隐藏层的简单神经网络时，我们就有了深度神经网络（DNN）。\n\
  \n图 5.4 显示了一个 DNN 示例。它包含一个输入层、一个输出层四个隐藏层。在这里，我们展示了一个使用 `TensorFlow` 处理 MNIST 数据集的\
  \ DNN 示例。图像大小为 28×28，隐藏激活函数为 `ReLU`，输出激活函数为 `SoftMax`。\n\n```\n#MNIST 示例\n# 输入数据以及网络参数和超参数\n\
  input_data_shape = (28, 28)\nhidden_activation_function = ReLU\noutput_activation_function\
  \ = SoftMax\n# 定义模型\ndnn_model = models.Sequential()\n### 输入层\ndnn_model.add(layers.Flatten(input_shape=(28,\
  \ 28), name='Input_layer'))\n# 第一层隐藏层\ndnn_model.add(layers.Dense(256, activation='relu',\
  \ name='Hidden_layer_1'))\n# 第二层隐藏层\ndnn_model.add(layers.Dense(192, activation='relu',\
  \ name='Hidden_layer_2'))\n# 第三层隐藏层\ndnn_model.add(layers.Dense(128, activation='relu',\
  \ name='Hidden_layer_3'))\n# 第四层隐藏层\ndnn_model.add(layers.Dense(64, activation='relu',\
  \ name='Hidden_layer_4'))\n### 输出层\ndnn_model.add(layers.Dense(10, activation='softmax',\
  \ name='Output_layer'))\n### 模型摘要\ndnn_model.summary()\n```\n\n![图 5.4 具有四个隐藏层的\
  \ DNN](img/fig5_4_B.jpg)\n\n图 5.4 具有四个隐藏层的 DNN\n\n### 5.3.1 卷积神经网络 (CNN)\n\nCNN\
  \ 是流行的深度学习算法之一，包含四个主要部分：\n\n* 卷积滤波器，\n* 池化或下采样，\n* 激活（转换）函数，\n* 全连接层。\n\n它在视觉分类中表现出良好的的结果。它的基础是卷积函数（滤波器），其中每个神经元连接到这些滤波器的输出作为感受野。我们将在本章后续详细讨论这类深度学习算法（图\
  \ 5.5）。\n\n![图 5.5 CNN 寻找数据的特征。](img/fig5_5_B.jpg)\n\n图 5.5 CNN 寻找数据的特征。\n\n###\
  \ 5.3.2 循环神经网络 (RNN)\n\nRNN 是一种通常用于时间序列预测问题的神经网络。它使用随机梯度下降进行训练。RNN 通过前馈处理数据并通过反向传播将输出值返回给隐藏层和输入层（存储过去的数据用于预测）。\n\
  \nRNN 有许多应用，例如根据之前的事件和数据预测事件（如股市数据），并有两个主要类型：\n\n* 双向 RNN，\n* 深度 RNN。\n\nRNN 在所有层共享相同的参数。它在长期处理方面表现并不理想，且不能具有深度层。图\
  \ 5.6 显示了一个 RNN 架构，并展示了输出层如何与隐藏层连接。\n\n![图 5.6 RNN 使用之前的层特征。](img/fig5_6_B.jpg)\n\
  \n图 5.6 RNN 使用之前的层特征\n\n\n\n\n\n正如我们在上一节中提到的，`RNN` 在长期处理中无法正常工作。`LSTM` 是 `RNNs`\
  \ 的一种，它使用反向传播并使用内存块而不是神经元来连接层层。它适用于语言翻译、情感分析、股市预测和图像描述等许多应用（图 5.7）。\n\n![图 5.7 LSTM\
  \ 是一种使用反向传播并具有记忆的 RNNs](img/fig5_7_B.jpg)\n\n图 5.7 LSTM 是一种使用反向传播并具有记忆的 RNNs\n\n\
  ### 5.3.4 生成对抗网络 (GANs)\n\n`GAN` 是一种通过自学习生成新数据的无监督学习算法。它的算法有两个模块：第一个是`generator`，用于生成新样本；第二个是`discriminator`，用于对原始数据和新数据（假数据）进行分类（这两个模块相互竞争）。\n\
  \n这些模型使用不同的损失函数（其计算量很高），如果其中一个失败，整个网络就会失败。`generator` 和 `discriminator` 的权重可以通过迭代进行更新。图\
  \ 5.8 显示了 `GAN` 网络的通用结构。\n\n![图 5.8 GAN 网络架构](img/fig5_8_B.jpg)\n\n图 5.8 GAN 网络架构\n\
  \n### 5.3.5 残差神经网络学习 (ResNets)\n\n`ResNet` 用于一些其他方法（如 `CNNs`）无法很好处理复杂问题。它有几个残差模块（层），这些层具有多个对输入数据进行操作的功能。与\
  \ `RNNs` 相比，它更准确、更轻量。图 5.9 和 图 5.10 显示了普通网络和 `ResNet` 网络的架构。你可以看到这两个网络有多不同。\n\n\
  ![图 5.9 普通网络架构](img/fig5_9_B.jpg)\n\n图 5.9 普通网络架构\n\n![图 5.10 ResNet 网络架构](img/fig5_10_B.jpg)\n\
  \n图 5.10 ResNet 网络架构\n\n## 5.4 卷积神经网络 (CNNs)\n\n### 5.4.1 CNN 层\n\n#### 5.4.1.1\
  \ 卷积层\n\n`CNN` 的主要部分是卷积层。当卷积函数处理并移动过整个数据矩阵（例如图像）时，输出会被卷积（过滤）。`stride` 是卷积函数每次移动的数值（特定的滑进距离）。例如，`stride`\
  \ 为 `2` 意味着卷积窗口向右或向下移动两个元素（这里是像素）（默认是从左到右、从上到下移动）。`CNN` 通过使用 `kernels`（与卷积窗口大小相同）并将窗口中的图像像素值乘以\
  \ `kernel` 值来执行过滤。要创建一个 `CNN`，你需要知道并确定滤波器的数量、`kernel size` 和 `strides`。\n\n如果 `kernel`\
  \ 滤波器的大小为 `4×4=16`，那么每个神经元（有一个偏置加 16 个权重）都会连接到感受野。它可以有几个卷积层，其输出是特征图。图 5.11 显示了 `3×3`\
  \ 过滤器是如何工作的。它在原始输入图像上移动，其值与图像值的掩码部分相乘。例如，这里第一个输出的卷积结果为 `-2`。此外，图 5.12](#ch5.xhtml#f5_12)\
  \ 显示了原始图像的最终输出。你可以看到每一层滤波器的输出。\n\n![图 5.11 使用 3×3 过滤器卷积](img/fig5_11_B.jpg)\n\n\
  图 5.11 使用 3×3 过滤器卷积\n\n![图 5.12 滤波器的输出](img/fig5_12_B.jpg)\n\n图 5.12 滤波器的输出\n\n\
  #### 5.4.1.2 池化层\n\n`CNNs` 还有池化层（例如 `max-pooling`、`min pooling` 和 `average pooling`），用于寻找子区域并减少计算时间（图\
  \ 5.13）。\n\n![图 5.13 最大池化](img/fig5_13_B.jpg)\n\n图 5.13 最大池化\n\n池化层的功能取决于池化窗口的大小和池化的类型。它在卷积输出上操作以减小尺寸，从而减少后续的操作量。\n\
  \n#### 5.4.1.3 Dropout\n\n它有助于网络进行记忆和泛化，以便用于不同的应用。有时，通过移除一些神经元，在保持模式的同时的同时保持泛化能力，有助于网络性能。这些节点可以通过将它们关闭来移除。这种方法通过创建一个随机矩阵并将其相乘来关闭或开启节点（图\
  \ 5.14）。\n\n![图 5.14 Dropout 示例](img/fig5_14_B.jpg)\n\n图 5.14 Dropout 示例\n\n####\
  \ 5.4.1.4 归一化\n\n归一化技术用于使算法更具泛化性。例如，如果数据呈正态分布，通过减去均值然后除以标准差来处理数据。深度网络数据处于四维向量 `(N,\
  \ C, H, W)`，其中 `N` 是批量，`C` 是通道，`H` 和 `W` 是空间宽高（图 5.15）。\n\n![图 5.15 批量归一化与归一化](img/fig5_15_B.jpg)\n\
  \n图 5.15 批量归一化与归一化\n\n#### 5.4.1.5 全连接层\n\n连接层是指当前层的所有节点都连接到下一层。在 `DL` 模型中，最后几层全连接以构建输出，通常是概率值（例如\
  \ `SoftMax` 激活）。图 5.16 显示了 `CNN` 中的层（最后一个全连接层也是分类层）。\n\n![图 5.16 全连接层](img/fig5_16_B.jpg)\n\
  \n图 5.16 全连接层\n\n### 5.4.2 设计 CNN\n\n在这里我们实现 `LeNet5` 架构。让我们解释一下 `LeNet5`。它有一系列卷积和池化层。它有两个全连接层和一个分类层。所有其他\
  \ `CNN` 架构几乎都有这些实现步骤。让我们代码步骤：\n\n1. **第一步**：在第一步中，你需要确定实现所需的库并导入它们。这些库可以帮助你的代码更健壮、更准确，并降低计算成本。\n\
  \n```\nimport TensorFlow as tf\nimport NumPy as np\nfrom tensorflow.examples.tutorials.mnist\
  \ import input_data\n```\n\n2. **第二步**：设置训练和测试步骤的样本数、图像大小以及类别数量。\n\n```python\n\
  batch_size = 128\ntest_size = 256\nimg_size = 28\nnum:classes = 10\n# 定义数据的占位符和标签的\
  \ y\nX = tf.placeholder(\"float\", [None, img_size, img_size, 1])\nY = tf.placeholder(\"\
  float\", [None, num:classes])\n```\n\n3. **第三步**：收集数据并创建训练和测试分类。\n\n\n\n\n\n```python\n\
  mnist = mnist_data.read_data_sets(\"data/\")\nXtr, Ytr, Xte, Yte = mnist.train.images,\
  \ mnist.train.labels, mnist.test.images, mnist.test.labels\nXtr = Xtr.reshape(-1,\
  \ img_size, img_size, 1)\nXte = Xte.reshape(-1, img_size, img_size, 1)\n#Initialize\
  \ the weights\ndef init_weights(shape):\n    return tf.Variable(tf.random:normal(shape,\
  \ stddev=0.01))\n#Weights for layer 1-4\nw1 = init_weights([3, 3, 1, 32])\nw2 =\
  \ init_weights([3, 3, 32, 64])\nw3 = init_weights([3, 3, 64, 128])\nw4 = init_weights([128\
  \ * 4 * 4, 625])\n#The output layer is\nw_o = init_weights([625, num:classes])\n\
  ```\n\n### 步骤 4: 定义模型。\n\n```python\np_keep_conv = tf.placeholder(\"float\")\np_keep_hidden\
  \ = tf.placeholder(\"float\")\ndef model(X, w, w2, w3, w4, w_o, p_keep_conv, p_keep_hidden):\n\
  \   conv1 = tf.nn.conv2d(X, w,strides=[1, 1, 1, 1], padding='SAME')\n   conv1 =\
  \ tf.nn.relu(conv1)\n   conv1 = tf.nn.max_pool(conv1, ksize=[1, 2, 2, 1] ,strides=[1,\
  \ 2, 2, 1], padding='SAME')\n   conv1 = tf.nn.dropout(conv1, p_keep_conv)\n   conv2\
  \ = tf.nn.conv2d(conv1, w2,strides=[1, 1, 1, 1],padding='SAME')\n   conv2 = tf.nn.relu(conv2)\n\
  \   conv2 = tf.nn.max_pool(conv2, ksize=[1, 2, 2, 1],strides=[1, 2, 2, 1],padding='SAME')\n\
  \   conv2 = tf.nn.dropout(conv2, p_keep_conv)\n   conv3 = tf.nn.conv2d(conv2, w3,strides=[1,\
  \ 1, 1, 1],padding='SAME')\n   conv3_a = tf.nn.relu(conv3)\n   FC_layer = tf.nn.max_pool(conv3,\
  \ ksize=[1, 2, 2, 1],strides=[1, 2, 2, 1], padding='SAME')\n   FC_layer = tf.reshape(FC_layer,\
  \ [-1,w4.get_shape().as_list()[0]])\n   FC_layer = tf.nn.dropout(FC_layer, p_keep_conv)\n\
  \   output_layer = tf.nn.relu(tf.matmul(FC_layer, w4))\n   output_layer = tf.nn.dropout(output_layer,\
  \ p_keep_hidden)\n   result = tf.matmul(output_layer, w_o)\n   return result\n```\n\
  \n### 步骤 5: 训练并评估模型。\n\n```python\npy_x = model(X, w, w2, w3, w4, w_o, p_keep_conv,\
  \ p_keep_hidden)\nY_ = tf.nn.softmax_cross_entropy_with_logits(py_x, Y)\ncost =\
  \ tf.reduce_mean(Y_)\noptimizer = tf.train.RMSPropOptimizer(0.001, 0.9).minimize(cost)\n\
  predict_op = tf.argmax(py_x, 1)\nwith tf.Session() as sess:\n   tf.initialize_all_variables().run()\n\
  \   for i in range(100):\n       training_batch = zip(range(0, len(Xtr), batch_size),\
  \ range(batch_size, len(Xtr)+1, batch_size))\n       for start, end in training_batch:\n\
  \       sess.run(optimizer, feed_dict={Xtr[start:end],Ytr[start:end],p_keep_conv:\
  \ 0.8, p_keep_hidden: 0.5})\n       test_indices = np.arange(len(Xte))\n       np.random.shuffle(test_indices)\n\
  \       test_indices = test_indices[0:batch_size]\n       print(i, np.mean(tf.argmax(Yte[test_indices],\
  \ axis=1) == sess.run(predict_op, feed_dict={Xte[test_indices], Yte[test_indices],\
  \ p_keep_conv: 1.0, p_keep_hidden: 1.0}))\n```\n\n## 5.5 循环神经网络 (RNN)\n\n对于序列数据问题，使用神经网络不是很好的解决方案，而\
  \ RNN 是很好的答案。RNN 的应用之一是判断句子的情感极性。\n\n### 5.5.1 循环网络架构\n\n深度学习结构的发展使得 RNN 架构成为最有趣的神经网络之一。RNN\
  \ 处理序列中的每个元素，将其保持在内存中，然后处理序列中的下一个元素。RNN 中的神经元单元连接到自身。\n\n### 5.5.2 长短期记忆 (LSTM)\n\
  \nRNN 在迭代一个节点时遇到的挑战之一是权重变小，导致梯度消失。此外，短期记忆是另一个挑战：\n\n- 短记忆（输入数据）\n- 长记忆（从内存中选择数据）\n\
  \n通过这种，LSTM 可以消除梯度消失。\n\n### 5.5.3 设计 RNN (LSTM)\n\n在这里，我们使用 TensorFlow 和 Keras\
  \ 实现 MNIST 分类的 RNN (LSTM)。实现步骤如下：\n\n### 5.5.3.1 导入库\n\n第一步是导入 `NumPy`、`TensorFlow`\
  \ 和 `Keras` 等库。\n\n```python\nimport numpy as np\nimport tensorflow as tf\nfrom\
  \ tensorflow import keras\nfrom tensorflow.keras import layers\n```\n\n### 5.5.3.2\
  \ 加载并归一化数据集\n\n使用 `MNIST` 作为数据库，加载它进行训练和测试，然后进行归一化（这里的最大值为 255）。\n\n```python\n\
  #加载数据\nmnist = keras.datasets.mnist\n#找到训练和测试数据\n(x_train, y_train), (x_test, y_test)\
  \ = mnist.load_data()\n#归一化数据\nx_train, x_test = x_train / 255.0, x_test / 255.0\n\
  sample, sample_label = x_train[3], y_train[3]\n```\n\n### 5.5.3.3 构建模型\n\n每个 MNIST\
  \ 数据（这里的图像数据）大小为 28×28，数据集中的任何 batch 都是形状为 (batch_size, 28, 28) 的张量。这里的标签在 0 到 9\
  \ 之间（10 个标签）。\n\n```python\nbatch_size = 64\ninput_dim = 28\nunits = 64\noutput_size\
  \ = 10\ndef build_model(allow_cudnn_kernel=True):\n   if allow_cudnn_kernel:\n \
  \  lstm_layer = keras.layers.LSTM(units, input_shape=(None, input_dim))\n   else:\n\
  \   lstm_layer = keras.layers.RNN(keras.layers.LSTMCell(units), input_shape=(None,\
  \ input_dim) )\n   model = keras.models.Sequential([ lstm_layer, keras.layers.BatchNormalization(),\
  \ keras.layers.Dense(output_size),])\n   return model\n```\n\n### 5.5.3.4 训练模型\n\
  \n使用所需的参数（如损失函数、优化器和指标）编译模型，然后使用测试数据值训练模型。\n\n```python\nmodel = build_model(allow_cudnn_kernel=True)\n\
  model.compile(loss=keras.losses.SparseCategoricalCrossentropy(from_logits=True),optimizer=\"\
  adam\",metrics=[\"accuracy\"])\nmodel.fit(x_train, y_train, validation_data=(x_test,\
  \ y_test), batch_size=batch_size, epochs=100)\n```\n\n**输出**:\n\n```\nEpoch 1/10\n\
  938/938 [==============================] - 12s 13ms/step - loss: 0.3543 - accuracy:\
  \ 0.8882 - val_loss: 0.1381 - val_accuracy: 0.9555\n…\n```\n\n### 5.5.3.5 评估模型\n\
  \n使用一些样本数据检查并评估模型（图 5.17）。\n\n```python\nimport matplotlib.pyplot as plt\nwith tf.device(\"\
  CPU:0\"):\n   cpu_model = build_model(allow_cudnn_kernel)\n   cpu_model.set_weights(model.get_weights())\n\
  \   result = tf.argmax(cpu_model.predict_on_batch(tf.expand_dims(sample, 0)), axis=1)\n\
  \   print( \"预测结果是: %s, 目标结果是: %s\" % (result.numpy(), sample_label)\n   plt.imshow(sample,\
  \ cmap=plt.get_cmap(\"gray\"))\n```\n\n![图 5.17 预测输出](img/fig5_17_B.jpg)\n\n图 5.17\
  \ 预测输出\n\n**输出**:\n\n```\n预测结果是: [3], 目标结果是: 3\n```\n\n## 5.6 生成对抗网络 (GAN)\n\n对于具有顺序数据数据的问题，使用普通神经网络不是很好的解决方案，而\
  \ RNN 是很好的答案。RNN 的应用之一是判断句子的情感是积极的还是消极的。\n\n### 5.5.1 循环网络架构\n\n深度学习结构的发展使得 RNN\
  \ 架构成为最有趣的神经网络之一。RNN 处理序列中的每个元素，将其保持在内存中，然后处理序列中的下一个元素。RNN 中的神经元单元连接到自身。\n\n###\
  \ 5.5.2 长短期记忆 (LSTM)\n\nRNN 在迭代一个节点时遇到的挑战之一是权重变小，导致梯度消失。此外，短期记忆是另一个挑战：\n\n- 短记忆（输入数据）\n\
  - 长记忆（从内存中选择数据）\n\n通过这种，LSTM 可以消除梯度消失。\n\n### 5.5.3 设计 RNN (LSTM)\n\n在这里，我们使用 TensorFlow\
  \ 和 Keras 实现 MNIST 分类的 RNN (LSTM)。实现步骤如下：\n\n### 5.5.3.1 导入库\n\n第一步是导入如 `NumPy`、`TensorFlow`\
  \ 和 `Keras` 等库。\n\n```python\nimport numpy as np\nimport tensorflow as tf\nfrom\
  \ tensorflow import keras\nfrom tensorflow.keras import layers\n```\n\n### 5.5.3.2\
  \ 加载并归一化数据集\n\n使用 `MNIST` 作为数据库，加载它进行训练和测试，然后进行归一化（这里的最大值为 255）。\n\n```python\n\
  #加载数据\nmnist = keras.datasets.mnist\n#找到训练和测试数据\n(x_train, y_train), (x_test, y_test)\
  \ = mnist.load_data()\n#归一化数据\nx_train, x_test = x_train / 255.0, x_test / 255.0\n\
  sample, sample_label = x_train[3], y_train[3]\n```\n\n\n\n\n3. 训练学习算法以找到训练模型，\n\
  4. 使用验证数据找到更好的模型，以及\n5. 使用测试数据对模型进行测试。\n\n判别模型学习如何寻找类别之间的边界，而生成模型学习每个类别的分布。判别模型不适用于无监督学习，并且需要更多数据来进行更好的训练，而生成模型可以用于无监督学习。我们可以将生成目标和判别目标总结如下：\n\
  \n1. **生成目标**：\n   * 最大化使判别器将伪数据误分类为真实数据的相似性。\n2. **判别目标**：\n   * 优化真实数据与伪数据之间的差异（训练损失接近\
  \ 0.5）。\n\n这些是生成器的工作步骤：\n\n1. 生成一些样本（例如，一些初始噪声数据），\n2. 选择一种神经网络算法（例如 `CNN`），以及\n\
  3. 训练生成器。\n\n卷积神经网络（`CNN`）可以作为一个判别器，你可以按照如下方式实现：\n\n1. 选择 `CNN` 来分类真伪，\n2. 拥有一个真实数据集并从生成器获取伪数据，\n\
  - 在真实数据和伪数据上训练 `CNN`，以及\n- 学习平衡判别器训练与生成器训练——如果判别器非常强大，生成器将会发散。\n\n### 5.6.2 用于时尚数据集的\
  \ GAN\n\n在这里我们展示一个 GAN 以学习它的工作原理。这些是通用步骤：\n\n1. 加载数据集，\n2. 数据预处理，\n3. 定义判别器模型，\n\
  4. 定义生成器模型，\n5. 组合生成器和判别器模型，\n6. 训练模型，以及\n7. 预测（生成数据）。\n\n在开始第一步之前，如之前提到的最好导入一些库和平台以方便计算，如\
  \ NumPy、TensorFlow 和 Keras。\n\n```python\nimport numpy as np\nfrom matplotlib import\
  \ pyplot as plt\nfrom tensorflow.keras.models import Model, save_model, load_model\n\
  from tensorflow.keras.layers import Conv2D, Conv2DTranspose, BatchNormalization,\
  \ LeakyReLU, Dropout, Flatten, Dense, Reshape, Input, Embedding, Concatenate\nfrom\
  \ tensorflow.keras.utils import plot_model\nfrom tensorflow.keras.optimizers import\
  \ Adam\nfrom tensorflow.keras.losses import BinaryCrossentropy\n```\n\n### 5.6.2.1\
  \ 加载数据集\n\n我们在这里使用的数据集 fashion MNIST。\n\n```python\nfrom keras.datasets.fashion_mnist\
  \ import load_data\n(real_train_images, real_train_labels), (real_test_images, real_test_labels)\
  \ = load_data()\nprint('Train', real_train_images.shape, real_train_labels.shape)\n\
  print('Test', real_test_images.shape, real_test_labels.shape)\n```\n\n输出为：\n\n```\n\
  Train (60000, 28, 28) (60000,)\nTest (10000, 28, 28) (10000,)\n```\n\n### 5.6.2.2\
  \ 数据预处理\n\n在这步中，你应该对数据进行一些处理，如归一化数据、选择真实数据、生成随机噪声和选择伪数据。\n\n1. 归一化处于 `0` 到 `255`\
  \ 之间和 `-1` 到 `1` 之间的数据：\n```python\ndef prepare_real_samples(samples):\n   prepared_samples\
  \ = samples.astype('float32')\n   prepared_samples = (prepared_samples - 127.5)\
  \ / 127.5\n   return prepared_samples\n```\n2. 选择真实样本：\n```python\ndef generate_real_batch(samples,\
  \ orig_labels, n_samples):\n   indices = np.random.randint(0, samples.shape[0],\
  \ n_samples)\n   batch_images = samples[indices]\n   batch_labels = orig_labels[indices]\n\
  \   batch_labels = np.full(n_samples, REAL_LABEL_VALUE)\n   return batch_images,\
  \ batch_labels\n```\n3. 生成随机噪声作为生成器的输入：\n```python\ndef generate_noise_vector(noise_dim,\
  \ n_samples):\n   noise_vector = np.random.normal(size=(n_samples, noise_dim))\n\
  \   return noise_vector\n```\n4. 选择伪样本：\n```python\ndef generate_fake_batch(generator,\
  \ noise_dim, n_classes, n_samples):\n   noise_vector, original_classes = generate_noise_vector(noise_dim,\
  \ n_samples)\n   batch_images = generator.predict([noise_vector, original_classes])\n\
  \   batch_labels = np.full(n_samples, FAKE_LABEL_VALUE)\n   return batch_images,\
  \ batch_labels\n```\n\n### 5.6.2.3 定义判别器模型\n\n你应该在这一步中定义判别器。\n\n```python\ndef create_discriminator(in_shape=(28,\
  \ 28, 1), n_classes=10, label_smoothing=0):\n   label_input = Input(shape=(1,))\n\
  \   embedding_input = Embedding(n_classes, LABEL_EMBEDDING_SIZE)(label_input)\n\
  \   embedding_input = Dense(in_shape[0] * in_shape[1])(embedding_input)\n   embedding_input\
  \ = Reshape((in_shape[0], in_shape[1], 1))(embedding_input)\n   image_input = Input(shape=in_shape)\n\
  \   merge = Concatenate()([image_input, embedding_input])\n   feature_extractor\
  \ = Conv2D(128, (3, 3), strides=(2, 2), padding='same')(merge)\n   feature_extractor\
  \ = LeakyReLU(alpha=0.2)(feature_extractor)\n   feature_extractor = Conv2D(128,\
  \ (3, 3), strides=(2, 2), padding='same')(feature_extractor)\n   feature_extractor\
  \ = LeakyReLU(alpha=0.2)(feature_extractor)\n   feature_extractor = Flatten()(feature_extractor)\n\
  \   feature_extractor = Dropout(0.4)(feature_extractor)\n   out_layer = Dense(1,\
  \ activation='sigmoid')(feature_extractor)\n   model = Model([image_input, label_input],\
  \ out_layer)\n   opt = Adam(learning_rate=0.0002, beta_1=.5)\n   loss = BinaryCrossentropy(label_smoothing=label_smoothing)\n\
  \   model.compile(loss=loss, optimizer=opt, metrics=['accuracy'])\n   return model\n\
  ```\n\n你可以看到模型摘要：\n\n```python\ndiscriminator = create_discriminator(INPUT_SHAPE,\
  \ N_CLASSES)\ndiscriminator.summary()\n```\n\nLayer (type) | Output Shape | Param\
  \ # | Connected to\n============================================================\n\
  input_1 (InputLayer) | [(None, 1)] | 0 |\nembedding (Embedding) | (None, 1, 50)\
  \ | 500 | input_1[0][0]\ndense (Dense) | (None, 1, 784) | 9984 | embedding[0][0]\n\
  input_2 (InputLayer) | [(None, 28, 28, 1)] | 0 |\nreshape (Reshape) | (None, 28,\
  \ 28, 1) | 0 | dense[0][0]\nconcatenate (Concatenate) | (None, 28, 28, 2) | 0 |\
  \ input_2[0][0]\nconv2d (Conv2D) | (None, 14, 14, 128) | 2432 | concatenate[0][0]\n\
  leaky_re_lu (LeakyReLU) | (None, 14, 14, 128) | 0 | conv2d[0][0]\nconv2d_1 (Conv2D)\
  \ | (None, 7, 7, 128) | 147584 | leaky_re_lu[0][0]\nleaky_re_lu_1 (LeakyReLU) |\
  \ (None, 7, 7, 128) | 0 | conv2d_1[0][0]\nflatten (Flatten) | (None, 6272) | 0 |\
  \ leaky_re_lu_1[0][0]\ndropout (Dropout) | (None, 6272) | 0 | flatten[0][0]\ndense_1\
  \ (Dense) | (None, 1) | 6273 | dropout[0][0]\n\n### 5.6.2.4 定义生成器模型\n\n\n\n\n\n\
  ```python\ndef create_generator(noise_dim = 100, dense_layer_nodes = LATENT_DENSE_SIZE,\
  \ n_classes = 10):\n   label_input = Input(shape = (1,))\n   embedding_input = Embedding(n_classes,\
  \ LABEL_EMBEDDING_SIZE)(label_input)\n   embedding_input = Dense(LATENT_LOW_RES_VALUE\
  \ * LATENT_LOW_RES_VALUE)(embedding_input)\n   embedding_input = Reshape((LATENT_LOW_RES_VALUE,\
  \ LATENT_LOW_RES_VALUE, 1))(embedding_input)\n   latent_input = Input(shape=(noise_dim,))\n\
  \   noise_input = Dense(dense_layer_nodes)(latent_input)\n   noise_input = LeakyReLU(alpha\
  \ = 0.2)(noise_input)\n   noise_input = Reshape(GENERATOR_INITIAL_SHAPE)(noise_input)\n\
  \   merge = Concatenate()([noise_input, embedding_input])\n   gen = Conv2DTranspose(128,\
  \ (4,4), strides = (2,2), padding = 'same')(merge)\n   gen = LeakyReLU(alpha = 0.2)(gen)\n\
  \   gen = Conv2DTranspose(128, (4,4), strides = (2,2), padding = 'same')(gen)\n\
  \   gen = LeakyReLU(alpha = 0.2)(gen)\n   out_layer = Conv2D(1, (7, 7), activation\
  \ = 'tanh', padding = 'same')(gen)\n   return Model([latent_input, label_input],\
  \ out_layer)\n```\n\n你可以看到模型摘要：\n\n```python\ngenerator = create_generator(NOISE_DIM,\
  \ LATENT_DENSE_SIZE, N_CLASSES)\ngenerator.summary()\nplot_model(generator, to_file\
  \ = 'generator_plot.png', show_shapes = True, show_layer_names = True)\n```\n\n\
  该模型是：\n\n```\nLayer (type)\tOutput Shape\tParam #\tConnected to\n=============================================================================\n\
