  \ verbose = 0)\npredictions = model.predict_classes(X_test)\nplt.figure(figsize=(12,10))\n\
  sns.heatmap(confusion_matrix(y_test, predictions), annot=True)\n```\n\n图 6.16 显示了通过测试数据测试的训练模型的混淆矩阵。![图\
  \ 6.16](img/fig616.jpg) 图 6.16\n\n## 6.5 使用 CNN 进行图像分类\n\nCNN 的另一个应用是图像分类。在这里，我们通过示例解释使用\
  \ CNN 进行图像分类的步骤。\n\n### 6.5.1 导入库\n\n在示例中，我们使用 TensorFlow、Keras 和 matplotlib 来实现网络和可视化。\n\
  \n```\nimport tensorflow as tf\nfrom tensorflow.keras import datasets, models\n\
  import matplotlib.pyplot as plt\n```\n\n### 6.5.2 加载数据\n\n在这一步中，我们加载数据库 `cifar10`\
  \ 分类（训练数据和测试数据）并归一化。\n\n```\n(train_images, train_labels), (test_images, test_labels)\
  \ = datasets.cifar10.load_data()\n# 将像素值归一化到 0 和 1 之间\ntrain_images, test_images\
  \ = train_images / 255.0, test_images / 255.0\nclass_names = ['airplane', 'bird',\
  \ 'cat', 'deer', 'frog', 'horse', 'ship', 'truck']\nplt.figure(figsize=(10,10))\n\
  for i in range(25):\n    plt.subplot(5,5,i+1)\n    plt.xticks([])\n    plt.yticks([])\n\
  \    plt.grid(False)\n    plt.imshow(train_images[i], cmap=plt.cm.binary)\n    plt.xlabel(class_names[train_labels[i][0]])\n\
  plt.show()\n```\n\n### 6.5.3 构建模型\n\n我们的模型有三个卷积层，我们使用最大池化和 ReLU 作为下采样方法和激活函数。\n\n\
  ```\nmodel = models.Sequential()\nmodel.add(layers.Conv2D(32, kernel_size=(3, 3),\
  \ activation='relu', input_shape=(32, 32,3)))\nmodel.add(layers.MaxPooling2D(pool_size=(2,\
  \ 2)))\nmodel.add(layers.Conv2D(64, kernel_size=(3, 3), activation='relu'))\nmodel.add(layers.MaxPooling2D(pool_size=(2,\
  \ 2)))\nmodel.add(layers.Conv2D(128, kernel_size=(3, 3), activation='relu'))\nmodel.add(layers.MaxPooling2D(pool_size=(2,\
  \ 2)))\nmodel.add(layers.Dropout(0.2))\nmodel.add(layers.Flatten())\nmodel.add(layers.Dense(256,\
  \ activation='relu'))\nmodel.add(layers.Dense(128, activation='relu'))\nmodel.add(layers.Dense(10,\
  \ activation='softmax'))\n```\n\n这里是模型的摘要，显示了网络结构、总参数和可训练参数。\n\n```\nmodel.summary()\n\
