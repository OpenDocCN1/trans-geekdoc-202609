- "# 深度学习实战\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 前言\n\n深度学习是机器学习领域最前沿且最先进的话题之一，在许多领域都有多种应用。从计算机视觉到药物发现和股市预测，它在许多领域展示了令人期待的结果。关于深度学习有很多书籍和文章讨论了它的算法、理论和应用。此外，由于其通过部署不同的数据类型解决不同问题的能力和潜力，许多研究人员以及计算机科学或相关领域的人士对在自己的项目中学习和使用深度学习架构感兴趣。\n\
  \n本书——**《深度学习实践》（Deep Learning in Practice）**——回顾了个人（机器学习和深度学习的初学者）在启动和实施新的深度学习项目时需要学习的基础知识和概念。这是一本实用书籍，包含许多编程代码示例和图表，帮助你更好地理解这些概念。书中介绍了在实现深度学习项目时\
  \ Python、NumPy、TensorFlow 和 Keras 中最需要的话题回顾。接下来，本书回顾了人工神经网络的基础以及一些最流行且令人兴奋的深度学习算法。第\
  \ 7 章 展示了一个项目，该项目部署书中介绍的一些方法和算法来实现虚拟助手机器人。最后一章为你提供了一份指南，以探索适用于你项目的最优模型。\n\n我希望本书的内容受到全球深度学习领域本科生、研究生和研究人员的欢迎，包括学术界和工业界的从业者。此外，我希望读者会发现书中章节有趣且具有启发性，引导他们学习更高级的概念（理论和实践观点）并发现更多深度学习的奥秘。\n\
  \n**Mehdi Ghayoumi**\n\n**美国加州，洛杉矶**\n\n**2021 年 8 月**\n\n# 致谢\n\n我首先想感谢我的家人。在某些日子，我觉得如果没有他们，我将无法完成这本书。\n\
  \n感谢所有分享反馈和灵感的老师和同事。\n\n重要的是，如果没有我母亲 Khadijeh Ghayoumi 的祝福和支持，这本书是不可能的。\n\n这本书献给我亲爱的父亲\
  \ Aliasghar Ghayoumi 的灵魂。\n\n# 作者\n\n**Mehdi Ghayoumi 博士**是康奈尔大学的课程导师，圣地亚哥大学计算机科学兼任教授。在此之前，他是比明顿州立大学助理教授，媒体实验室的动态负责人。他曾是肯基州大学的讲师，并在\
  \ 2016 和 2017 年连续获得教学奖。\n\nGhayoumi 博士的研究领域包括机器学习、机器视觉、机器人和人机交互。他的研究重点是构建现实系统，他的项目应用于人机交互、制造业、生物识别和医疗保健。\n\
  \n他是多个会议、研讨会的技术委员会成员，以及机器学习、数学和机器人领域若干期刊的编辑成员，如 ICML、ICPR、HRI、FG、WACV、IROS、CIBCB\
  \ 和 JAI。他的研究论文发表在以下领域的会议和期刊上，包括人机交互（HRI）、机器人科学与系统（RSS）、机器学习与应用国际会议（ICMLA）等。\n\n\
  # 第 1 章 引言\n\n\n## 1.1 什么是学习？\n\n对于学习有几种定义，也许我们可以说：“学习是通过学习或经验获得知识或技能。”人类需要提升自己的社交和个人状况与条件。为了这个目的，人们在每一刻都面临决策局面。对于每个人来说，获取新知识和学习新技能有助于做出更好的决策，并帮助人们在个人和职业取得成功。有许多关于人类学习过程的研究。这些研究中最重要的部分是发现如何在机器中模拟学习，以及如何使其更准确、更有效。\n\
  \n## 1.2 什么是机器学习？\n\n\n\n\n\n如今以及在过去的几十年里，机器极大地帮助人类让生活更加舒适。人类总是想要解决的挑战之一是让机器更智能以更好地协助人类，研究人员正致力于这一目标，并试图找到让机器比以前更智能的方法。这些方法和研究包含了机器学习，它是计算机科学中近期受学术界和工业界人士关注的领域之一。在该领域已经发现并开发了许多算法和方法：一些传统的，如`支持向量机`\
  \ (`SVM`) 或 `决策树` (`DT`)，以及一些新的，如`深度学习` (`DL`）。\n\n## 1.3 什么是深度学习？\n\n人工智能的研究方法之一是模仿人类行为，例如人类通过学习来构建可以学习的系统。因此，该领域的研究人员试图找到并设计模仿人类学习的方法。为了这一目的，研究人员和工程师开始研究以理解机器如何通过学习来使其功能更加智能。`人工神经网络`\
  \ (`ANN`）是这些尝试中最著名的例子。例如，感知机（最早的 `ANN` 方法之一）模仿了人类的神经网络形成和处理过程。它被用作一些高级 `ANN` 方法（如深度学习\
  \ `DL`）的基础。\n\n`DL` 是近期先进的机器学习算法之一。它的方法在许多领域显示了迷人的结果，特别是在数据为图像和音频的应用中。它模拟了人类大脑的学习风格。它的之所以被称为“深度”，是因为它使用了若干层并部署了更多数据特征细节进行学习。它的结构总共包含三部分：输入层、输出层和隐藏层。输出取决于架构中的几个参数，如：每层神经元的组合、权重、偏置和激活函数。所有的学习过程步骤分为两个主要阶段：通过将数据转换为线性或非线性模型来寻找模型，然后改进模型。\n\
  \n## 1.4 关于本书！\n\n本书书回顾了 `DL` 算法的基础，并结合一些示例展示了主要的 `DL` 方法。它的设计目的是向你提供关于 `DL` 方法和算法的信息，并在最后介绍几个项目，帮助你学习并了解如何实现你的项目。我们在本书书中较少关注\
  \ `DL` 的数学和理论部分，而是向你展示如何在现实项目中使用 `DL` 算法。本书适合那些想要在项目中开始使用 `DL` 的人。全书共有八章，涵盖了以下目标：\n\
  \n### 1.4.1 引言\n\n本章（当前章节）回顾了书的章节并对每章的内容进行了简要描述。\n\n### 1.4.2 Python/NumPy\n\n`Python`\
  \ 是最有趣的编程语言之一，拥有许多用于应用的库，并且容易学习。此外，`NumPy` 的某些特性（特别是针对数组和矩阵）使得计算更快、更简单。本书对这些工具进行了快速回顾，以帮助读者更好地理解项目。\n\
  \n### 1.4.3 TensorFlow 和 Keras 基础\n\n`TensorFlow` 是 Google 提供的著名的 `DL` 平台之一。本书对该平台进行了快速回顾，并通过一些示例学习如何定义\
  \ `tensors` 并简化实现。我们还通过示例快速回顾了 `Keras`。\n\n### 1.4.4 人工神经网络 (ANNs)\n\n为了学习，你应该了解\
  \ `ANNs` 的基础。我们回顾了一些 `ANNs` 并展示了相关架构。\n\n### 1.4.5 深度神经网络 (DNNs)\n\n本章提供了 `DNNs`\
  \ 的基础和架构。\n\n### 1.4.6 用于图像和数据的深度网络\n\n本章提供了用于图像和数据的 `DL` 细节。\n\n### 1.4.7 用于虚拟助手的深度网络\n\
  \n本章提供了用于虚拟助手应用的 `DL`。\n\n### 1.4.8 寻找最佳模型\n\n本章展示了如何寻找最佳模型。\n\n# 第 2 章 Python/NumPy\
  \ 基础\n\n## 2.1 变量\n\n`variable` 是存储数据的地方。它有一个名称来改变。语法如下：\n\n```\nvariable = expression\n\
  ```\n\n有四种主要的变量类型：\n\n### 2.1.1 Python 中的数据类型\n\n| 类型 | 示例 1 | 示例 2 | 示例 3 |\n|\
  \ --- | --- | --- | --- |\n| 整数 | 30 | 0 | -10 |\n| 实数 | 3.14 | | |\n| 字符串 | “Hello”\
  \ | | |\n| 布尔 | True | False | |\n\n变量命名基于以下规则：\n1. 只能包含数字、字母和下划线。\n2. 不能以数字开头。\n\
  3. 区分大小写 (`caseSensitive`)。\n4. 使用驼峰命名法 (`camelCase`)。\n5. 永远不包含空格。\n6. 多个单词经常使用下划线。\n\
  \n如果你不遵守这些规则，将会得到错误。在你的模块和项目中，变量名应该与其值具有某种意义。\n\n### 2.1.2 关键字\n\n你不能使用关键字命名变量。然而，当解释器给你错误时，你可以记住这些单词并检查列表。\n\
  \n表 2.2 Python 中的关键字\n\n| Python 保留关键字 |\n| --- |\n| and | as | assert | break |\
  \ class | continue |\n| def | del | elif | else | except | exec |\n| finally | for\
  \ | from | global | if | import |\n| in | is | lambda | nonlocal | not | or |\n\
  | pass | raise | return | try | while | with |\n| yield | True | False | None |\n\
  \n### 2.1.3 运算符和操作数\n\n我们用于计算的特殊符号是运算符，它们作用的值是操作数。数据类型有几种操作操作如下：\n\n表 2.3 运算符及其操作\n\
  \n| 运算符 | 描述 | 示例 | 结果为 |\n| --- | --- | --- | --- |\n| + | 加法 | 7 + 3 | 10 |\n\
  | – | 减法 | 7–3 | 4 |\n| \\* | 乘法 | 7 * 3 | 21 |\n| / | 除法（真） | 7 / 3 | 2.333333\
  \ |\n| // | 除法（整） | 7 // 3 | 2 |\n| % | 取模 | 7 % 3 | 1 |\n| \\*\\* | 幂 | 7 \\*\\\
  * 3 | 343 |\n\n\n\n\n\n此外，运算符的优先级顺序如下：\n\n表 2.4 优先级顺序\n\n| 类别 | 示例 |\n| --- | ---\
  \ |\n| 括号（分组） | `()` |\n| 幂运算 | `a**b` |\n| 正数、负数 | `+a`, `–a` |\n| 乘法、除法、模 | `a\
  \ * b`, `a / b`, `a // b`, `a % b` |\n| 加法、减法 | `a + b`, `a – b` |\n\n还有比较运算符，它们的输出为布尔值。以下是比较运算符：\n\
  \n表 2.5 比较运算符\n\n| 运算符 | 含义 | 示例条件 | 结果 |\n| --- | --- | --- | --- |\n| `==` | 等于\
  \ | `5 == 5` | True |\n| `!=` | 不等于 | `8!= 5` | True |\n| `>` | 大于 | `3 > 10` |\
  \ False |\n| `<` | 小于 | `5 < 8` | True |\n| `>=` | 大于或等于 | `5 >= 10` | False |\n\
  | `<=` | 小于或等于 | `5 <= 5` | True |\n\n### 2.1.4 语句与表达式\n\n由 Python 解释器执行的指令称为语句。某些示例如下：\n\
  \n1. `import` 语句，\n2. 赋值语句，\n3. `if` 语句，\n4. `for` 和 `while` 语句。\n\n变量、运算符和值（也包括函数）的组合需要被求值为表达式（解释器打印结果）。在这里，赋值是一个语句，对\
  \ `x` 和 `y` 有两次求值。对于赋值语句，如 `x = 7`，没有求值（这些是语句，直接执行）。此外，它的结果会创建一个从变量的引用。例如，`x` 指向\
  \ `7`，当我们使用 `print` 函数处理 `y` 时（Python 中一切皆为函数），我们可以看到它的值。\n\n还有一些方法，如 `input` 函数（它允许提供一个提示字符串），可以用于获取用户数据以使程序更具交互性。\n\
  \n**示例**：\n\n```python\nm = input (\"Please enter your favorite number\")\n```\n\
  \n在这里，这一行之后，解释器会等待输入值并将该值存入 `m`。\n\ninput 返回字符串（即使用户输入的是数字）。解决方案是使用 `int` 或 `float`\
  \ 强制转换将字符串转换为整数或浮点数。\n\n**示例**：\n\n```python\nn=int(m)\nprint(n)\n```\n\n`m` 的类型是字符串（即使用户输入数字），而\
  \ `n` 的类型是整数。你不能将字符转换为整数或浮点数。多次给变量赋值是有效的（当前值是最后一次赋值的值）。不同的变量可以引用内存中的同一位置。\n\n###\
  \ 2.1.5 序列\n\n序列是“一组有序的元素”，或者“一组共同存储在集合中的项目项目”。\n\n**示例**：\n\n* 一组“范围”（range）数字，\n\
  * 字符串变量，\n* 列表，\n* 元组。\n\n这些结构可以是序列也可以是非序列。\n\n* 序列（可迭代类型）：\n    * 字符串，\n    * 列表、字典，\n\
  * 非序列（不可迭代类型）：\n    * 布尔值，\n    * 整数、浮点数。\n\n### 2.1.6 For 循环\n\n这种技术允许我们针对特定次数重复一段代码块（set）。这是一种确定循环，程序员在代码开始处定义循环的迭代次数。其语法如下：\n\
  \n```python\nfor a variable in sequence:\n # 每次循环执行的代码行\n …\n # 循环结束后的代码行\n …\n\
  ```\n\n总而言之，`for` 有两种类型：\n\n1. for 循环（遍历序列/“可迭代对象”中的每一个项目）\n2. 基于范围的 for 循环（遍历范围内的每一个项目）\n\
  \n对于 `range ()`，这些是参数：\n\n```python\nrange () 根据某些参数生成一个数字序列。\nrange (int start,\
  \ int stop, int step)\nstart: 开始于，\nstep: 每次的变化量，\nstop: 直到但不包含。\n```\n\n`range()`\
  \ 有三种类型：\n\n* 单参数 `range` ➔ 结束值，\n* 两个参数 `range` ➔ 起始值、结束值，\n* 三参数 `range` ➔ 起始值、结束值和增量。\n\
  \n有两种变化类型：\n\n* 正增量向前移动，\n* 负增量向后移动。\n\n### 2.1.7 While 循环\n\n这是一种不确定循环，其迭代在循环块中检查。其语法如下：\n\
  \n（循环块将持续执行直到条件为真）\n\n```python\nwhile condition:\n\t\tstatements\n\t\t…\n```\n\n\
  ### 2.1.8 字符串\n\n字符串是由于一些片段（即字符）组成的数据类型之一。它是字符序列（如果长度为零，则为空字符串）。即使字符串的形式像数字，数学运算也对字符串不起作用（除\
  \ `+` 和 `*` 外，它们分别用于连接两个字符串和重复）。可以通过索引访问字符。从左到右从 `0` 开始，从右到左访问则从 `-1` 开始。字符串是 Python\
  \ 中的一个对象，与其他对象一样，拥有一些方法。例如，`upper` 和 `lower` 是将字符串转换为大写和小写字符的方法。\n\n表 2.6 字符串常用方法\n\
  \n| 方法 | 参数 | 描述 |\n| --- | --- | --- |\n| `upper` | 无 | 返回全大写的字符串 |\n| `lower`\
  \ | 无 | 返回全小写的字符串 |\n| `capitalize` | 无 | 返回首字母大写的字符串 |\n| `strip` | 无 | 移除首尾空白\
  \ |\n| `lstrip` | 无 | 移除头部空白 |\n| `rstrip` | 无 | 移除尾部空白 |\n| `count` | 项目 | 返回项目出现的次数\
  \ |\n| `replace` | 旧, 新 | 替换所有出现的项目 |\n| `center` | 宽度 | 返回居中指定的字符串 |\n| `ljust`\
  \ | 宽度 | 返回左对齐的字符串 |\n| `rjust` | 宽度 | 返回右对齐的字符串 |\n| `find` | 项目 | 返回项目首次出现的索引，若未找到则返回\
  \ -1 |\n\n我们使用比较运算符来比较字符串。输出为真或假。字符串是不可变的，你不能为它们赋值。然而，你可以通过使用 `+` 运算符来操作字符串。单词 `in`\
  \ 和 `not in` 用于检查字符串是否是另一个字符串的子字符串。\n\n### 2.1.9 列表\n\n列表是带索引的数据（元素）集合。它类似于字符串，但这里的元素可以是\
  \ Python 中的任何类型。创建列表时，你可以使用方括号 `[]`。你可以通过索引访问列表元素，索引从 0 开始。你也可以像字符串一样使用负索引。你可以使用\
  \ `in` 和 `not in` 检查元素是否存在列表中。`+` 连接两个列表，`*` 实现列表重复。切片概念与字符串相同。通过使用 `del`，你可以从列表中删除元素。你可以使用比较运算符\
  \ `is` 或 `is not` 进行比较。你可以对列表名使用 `+` 和 `*` 来引用列表。有一些方法可以更方便地处理列表。表 2.7 显示了你在处理列表时可以使用的方法。\n\
  \n表 2.7 常用列表方法\n\n| 方法 | 参数 | 结果 |\n| --- | --- | --- |\n| `append` | 项目 | 在末尾添加项目\
  \ |\n| `insert` | 位置, 项目 | 在指定位置插入新项目 |\n| `pop` | 无 | 删除并返回列表最后一个元素 |\n| `pop`\
  \ | 位置 | 删除并返回位置的元素 |\n| `sort` | 无 | 修改为排序后的列表 |\n| `reverse` | 无 | 按反顺序修改列表 |\n\
  | `index` | 项目 | 返回项目首次出现的位置 |\n| `count` | 项目 | 返回项目出现的次数 |\n\n\n\n\n\n| `remove`\
  \ || `item` | 移除列表中第一次出现的元素 |\n\n### 2.1.10 字典 (Dictionary)\n\n它是一个无序、可变且索引的集合。你可以用花括号来表示它，键（key）和值（values）可以代表它的元素。\n\
  \n**示例**：\n\n```\nmydict = {\n \"python\": \"best\",\n \"Programming\": \"1\",\n\
  \ \"language\": 1999\n}\nprint(mydict)\n```\n\n**输出**：\n\n```\n{'language': 1999,\
  \ 'Programming': '1', 'python': 'best'}\n```\n\n你可以通过键的值或使用 `get()` 来访问字典的值。\n\n\
  **示例**：\n\n```python\nprint(mydict[\"python\"])\n```\n\n**输出**：\n\n```\nbest\n```\n\
  \n通过键名，你可以为键分配新值：\n\n**示例**：\n\n```python\nmydict[\"python\"] = 1999\nprint(mydict[\"\
  python\"])\n```\n\n**输出**：\n\n```\n1999\n```\n\n你可以使用 `for` 循环来访问字典的键和值。\n\n**示例**：\n\
  \n```python\nfor x in mydict:\n print(x)\n```\n\n**输出**：\n\n```\nProgramming\npython\n\
  language\n```\n\n### 2.1.11 元组 (Tuple)\n\n`tuple` 是 Python 的一种集合，具有以下特征：有序的、不可变的，且你可以用圆括号\
  \ `()` 来表示它。\n\n**示例**：\n\n```python\nmytuple = (\"test\", 7, \"tuple\")\nprint(mytuple)\n\
