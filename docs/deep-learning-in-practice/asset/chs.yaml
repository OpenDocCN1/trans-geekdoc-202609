  \n有几个步骤：\n\n1. `步骤 1`：特征提取，\n2. `步骤 2`：构建模型，\n3. `步骤 3`：解码。\n\n![图 7.9 文本](img/fig7_9.jpg)\n\
  \n### 7.4.1 特征提取\n\n你可以使用验证集和测试数据集验证你的模型。你可以更改之前步骤（1-3）中的不同参数和超参数，以达到所需的准确率、优化模型并移动到下一步。\n\
  \nRNN 的输出是包含所有输入的概率向量。可以使用之前步骤中的 `librosa` 等库来提取特征。这里的特征是 `频谱图` 和 `梅尔频率谱系数 (MFCCs)`。输出是一个\
  \ `二维张量`，其中第一维度是`时间`，第二维度是`频率`。\n\n### 7.4.2 深度神经网络建模\n\n如果你了解网络的基本设计，就可以为你的项目创建自己的模型。它是序列化的，如果我们有\
  \ `n` 个时间槽，说话者每次都会发字母中的一个。共有 28 个字符，包括 26 个字母、一个空格字符 (\" \") 和一个单引号 (`'`)。图 7.10\
  \ 展示了输出层的详细描述。\n\n### 7.4.3 解码\n\n在这一步中，编码数据需要转换为第一步中编码的原始格式。以下是使用 `Keras` 构建 RNN\
  \ 的示例代码。\n\n```\nfrom keras import backend as K\nfrom keras.models import Model\n\
  from keras.layers import (BatchNormalization, Conv1D, Dense, Input, TimeDistributed,\
  \ Activation, Bidirectional, SimpleRNN, GRU, LSTM)\ndef rnn_model(input_dim, output_dim\
  \ = 26):\n# 主音频输入\ninput_data = Input(name='the_input', shape = (None, input_dim))\n\
  # 添加递归层\nsimp_rnn = GRU(output_dim, return_sequences = True, implementation = 2,\
  \ name = 'rnn')(input_data)\n# 添加 softmax 激活层\ny_pred = Activation('softmax', name\
  \ = 'softmax')(simp_rnn)\n# 指定模型\n model = Model(inputs = input_data, outputs =\
  \ y_pred)\n model.output_length = lambda x: x\n print(model.summary())\n return\
  \ model\n```\n\n### 7.4.4 预测计算\n\n你可以写一个函数来解码你的音频模型的预测结果。\n\n## 7.5 情感分析\n\n\n\n\
  \n情感分析有许多应用。例如，假设一家公司创建了一个产品，他们想了解用户反馈以改进他们的产品。方法之一是通过 Twitter 和 Facebook 等社交媒体评论来检查客户反馈。例如，如果有成千上万关于客户反馈的文字，进行情感分析有助于获得关于产品正面或负面的总体意见。为了进行情感分析，你应该了解文本处理。文本是另一种类型的数据（在这里是输出）。在这一步中，我们使用这些文本数据（在上一步提取的）来进行一些情感分析，以决定或生成报告。你需要了解两个定义：a)\
  \ 词袋（bag of the word）：它是词的序列；b) 词嵌入（word embedding）：它是将词向量的过程。如果你有一个词袋，使用像 `MLP`\
  \ 等方法对于这个目的并不好。你可以使用深度神经网络将词的序列转换为向量（编码），然后将向量转换为所需格式的序列（解码）。将每个词转换为向量后，对于一组词，有一个矩阵（矩阵的每一行都是表示一个词的向量）。现在算法寻找词出现的概率以及该词周围的词。然后通过使用\
  \ `SoftMax`，它将每个词的值和概率转换为一个概率。相同语境中的词具有相似的向量。例如，与 kitchen 和 history 相比，kitchen 和\
  \ oven 是相似的。\n\nDAN 有两个主要部分：\n\n- `encoder`（编码器）：根据编码类型将输入序列转换为向量，以及\n- `decoder`（解码器）：编码器将向量传递给解码器，由它将向量转换为所需的输出。\n\
  \n实现此目的有多种方法，其中一种是深度平均网络（DAN）。该网络对句子中的所有词进行词嵌入，平均这些向量（编码），然后将它们放入网络中。网络的输出是一个标量（解码），决定句子的值是正面还是负面。在\
  \ DAN 中，我们首先得到词序列，然后将这些词转换为向量，找到这些向量的平均值，并将该向量传递给网络，使用随机梯度下降 (`SGD`）等方法进行训练。然而，DAN\
  \ 在输出上有一个问题，它没有考虑顺序。例如，当句子为：The fire destroyed the houses，输出可能是：The houses destroyed\
  \ fire，这两者的概念是不同的。为了这个目的，我们可以使用神经网络。\n\n使用 DAN 进行情感分析的步骤如下：\n\n1. 加载数据集，\n2. 创建\
  \ DAN 网络，\n3. 训练网络，以及\n4. 评估模型。\n\n### 7.5.1 加载数据集\n\n这一步中，加载数据集，将数据放入训练和测试类别中，并将它们标记为正面和负面。为词嵌入过程创建一个词字典。你需要一个函数将词转换为向量。评论的训练和测试可以存储为数据框（data\
  \ frame），词汇存储为具有键（词）和值（索引）的字典。词汇用于寻找词袋特征。\n\n例如，对于负面评论和正面评论：\n\n```\nmy_vocab =\
  \ {'Deep': 0, 'learning': 1, 'in': 2, 'practice': 3}\nmy_sentence = ' I love to\
  \ learn deep learning in practice and do my machine learning project.'\n```\n\n\
  你可以创建一个函数来提取特征，例如词在句子中的出现次数。\n\n```\nmy_featurs = generate_featur(my_vocab)\n```\n\
  这里的输出应该是：\n```\narray (1, 2, 1, 1)\n```\n\n这意味着句子中有**一个** deep、**两个** learning、**一个**\
  \ in 和**一个** practice。\n\n### 7.5.2 创建一个 DAN 网络\n\n定义两个函数：\n\n1. `average` 函数接收张量作为输入，每个张量是评论的词袋表示，其输出是平均评论的张量。\n\
  2. `forward` 函数接收作为评论词袋表示的张量并调用 `average` 函数找到平均评论，将其发送到层以寻找模型。\n\n### 7.5.3 训练网络\n\
  \n在此阶段，你可以通过训练数据调用 DAN 网络来找到训练好的网络。\n\n### 7.5.4 评估模型\n\n现在，你可以使用测试数据评估你训练的模型。\n\
  \n# 第 8 章 寻找最佳模型\n\nDOI: [10.1201/9781003025818-8](https://doi.org/10.1201/9781003025818-8)\n\
  \n## 8.1 数据预处理\n\n本章的目标是学习如何找到误差最小的最佳模型。在第一步中，让我们回顾一下项目中需要的数据类别。总而言之，我们可以将原始数据分为三类：\n\
  \n1. 训练数据，\n2. 验证数据，以及\n3. 测试数据。\n\n我们已经讨论了这三类，并且你知道它们的定义。这里的关键点是每个类别的比例，例如有 70%的训练、15%的验证和\
  \ 15%的测试。如果在测试数据上测试的模型达到了理想的准确率，我们就可以在新的现实数据中使用它。这些比例不是固定的，你可以更改并检查结果以找到最佳比例。图 8.1\n\
  \n## 8.2 什么是好模型？\n\n评估模型的第一步是计算准确率或找出误差。当误差很高（准确率很低）时，意味着模型运行不正常且没有覆盖目标。有多种方法和标准寻找准确率（找出误差）。检查模型有两种类型的误差：验证误差和测试误差。为了判断一个模型是否良好，你可以从验证误差入手。它取决于你拥有的数据，并检查这些数据评估模型有多有效。在开始，最好使用验证误差来检查模型，以找到测试的最佳模型。如果验证误差很高或不满足你的需求，那么该模型还不够好。为了解决这个问题，你应该在第一步中对验证误差进行分解：\n\
  \n```\nValidation Error = Noise + Bias + Variance\n```\n\n\n\n\n\n$$\\begin{matrix}\
  \ {\\\\mathbb{E}\\\\left\\\\lbrack \\\\left( {h\\\\_{D}\\\\left( X \\\\right) -\
  \ y} \\\\right)^{2} \\\\right\\\\rbrack\\\\mspace{9mu} = \\\\mspace{9mu}\\\\mathbb{E}\\\
  \\left\\\\lbrack \\\\left( {h\\\\_{D}\\\\left( X \\\\right) - \\\\overline{h}\\\\\
  left( X \\\\right)} \\\\right)^{2} \\\\right\\\\rbrack + \\\\mathbb{E}\\\\left\\\
  \\lbrack \\\\left( {\\\\overline{h}\\\\left( X \\\\right) - \\\\overline{y}\\\\\
  left( X \\\\right)} \\\\right)^{2} \\\\right\\\\rbrack} \\\\ {+ \\\\mspace{9mu}\\\
  \\mathbb{E}\\\\left\\\\lbrack \\\\left( {\\\\overline{y}\\\\left( X \\\\right) -\
  \ y\\\\left( X \\\\right)} \\\\right)^{2} \\\\right\\\\rbrack} \\\\ \\\\end{matrix}$$\
  \ \n\n## 8.3 什么是噪声？\n\n大量的无意义信息使得数据不可靠。这是是因为数据损坏以及用户无法感知或解释的数据。这些信息会影响训练过程，并导致训练出的模型和结果不准确。\n\
  \n问题是：我们如何找到原因，解决方案又是什么？当噪声非常高或达到不可接受的值时，它的重要性有多大（请记住，通常问题中的噪声大致是常数）。在第一步中，让我们计算噪声。\n\
  \n为了计算噪声，请看以下内容：\n\n`Note=\U0001D53C[(y^−X)−y(X))²]=1/n*(∑[i =0 : m]) (y−x[i])−y(x[i]))²)`\n\
  \n其中：\n\n`y−X = 1 * p(y=1|X) + 2 * p(y=2|X)`\n\n为了更好地理解，假设有一个数据库 `D={(x[1],y[1]),...,(x[n],y[n])}`，其分布为\
  \ `P(X,Y)`。这里每一对 `(x[i], y[i])`（对于 `i=1…n`）都是每个样本的特征向量，其中 `x[1]…x[n]` 是样本数据，`y[i]`\
  \ 是标签。\n\n例如，如果样本是苹果，那么 `x[1]` 就是第一个样本，`y[1]` 是显示该样本是或否苹果的值。`x[1]` 是特征向量，在这里例如是价格、形状和颜色（所以这里的\
  \ `x` 维度是 `3`）。`y¯(x)` 是期望标签，`y(x)` 是标签，而 `x ={x[1],…x[n]}`。有时噪声存在于数据中，在这种情况下，你可以在使用数据训练之前对数据进行一些预处理（如去噪）。但如果你在完成所有预处理后发现噪声值仍然很高，你就应该寻找其他原因来减少或消除噪声。\n\
  \n导致高噪声的两个主要原因是：\n\n* 错误的标注和\n* 错误的特征提取。\n\n针对这两个原因，有两个解决方案：\n\n* 重新标注数据和\n* 更改特征并进行特征提取。\n\
  \n记住，这里的定义是针对单个数据样本的，而不是关于数据的本质。图 8.3 显示了完全损坏图像的图像数据噪声。\n\n![图 8.3 数据上的噪声可以改变结果（这里，噪声是数据的本质，可以通过对数据进行一些预处理来消除）。](img/fig8_3_B.jpg)\n\
  \n图 8.3 数据上的噪声可以改变结果（这里，噪声是数据的本质，可以通过对数据进行一些预处理来消除）。\n\n### 8.3.1 标注\n\n当噪声很高时，可能是标注不正确，你需要重新标注。让我们通过一个例子来详细说明。如果你把橙子数据标注为苹果，你就有了错误的标注数据，这会导致训练出现问题，就像噪声一样导致模型不准确。要解决这个问题，请采取以下步骤：\n\
  \n* 检查标签\n* 找到错误的标注数据\n* 重新标注数据\n* 计算噪声以检查噪声值的变化\n\n如果你在最后一步之后发现噪声发生了变化并减少，那么标注就是主因；否则，我们应该寻找其他消除噪声的原因。图\
  \ 8.4 显示了错误的标注如何产生噪声并增加误差值。\n\n![图 8.4 错误的标注数据可以使噪声值很高（这是我们讨论的内容）。](img/fig8_4_B.jpg)\n\
  \n图 8.4 错误的标注数据可以使噪声值很高（这是我们讨论的内容）。\n\n### 8.3.2 特征\n\n导致高噪声的另一个原因是错误的特征提取。当噪声很高时，可能是特征不正确，你需要更改特征。让我们通过一个例子来详细说明。如果你选择了错误的特征，你就有了错误的特征提取，会导致训练出现问题。要解决这个问题，请采取以下步骤：\n\
  \n* 检查特征\n* 找到错误的特征提取\n* 重新提取特征\n* 计算噪声以检查噪声值的变化\n\n如果你在最后一步之后发现噪声发生了变化并减少，那么特征提取就是主因；否则，我们应该寻找其他消除噪声的原因。\n\
  \n## 8.4 什么是偏差？\n\n偏差是误差的另一个。当我们讨论偏差时，意味着模型没有准确地表示底层数据。这可能是因为模型太简单或特征错误。\n\n## 8.5\
  \ 什么是方差？\n\n方差指的是模型预测随不同训练集变化的程度。高方差表明模型过拟合了训练数据中的特定噪声。\n\n\n\n\n\n方差 `(σ2)` 是误差的另一部分。方差是衡量数据中样本每个值离整个数据集平均值远程度的方法。通常情况下，在计算时，首先从每个样本值中减去平均值，然后将平方和除以整个数据中样本值的个数。在这里，我们将方差视为误差的一部分，如果方差很高，则意味着很大一部分误差是由此引起的，然后尝试寻找方法来它（图\
  \ 8.8）。有一些减少方差的方法，例如装袋法（bagging）或选择良好的数据集。`y¯(\U0001D431)` 是期望标签，`y(cX)` 是标签，`\U0001D431\
  ={x[1],…,o[n]}` 和 `m` 是分类器的数量，`D[i]` 是数据集，而 `h[Di]` 是 `Di` 的训练分类器。详细查看公式：\n\n![图\
  \ 8.8 高方差改变了准确率。](img/fig8_8_B.jpg)\n\n图 8.8 高方差改变了准确率。\n\n`Variance` = `\U0001D53C\
  (h[D−h^−(X))²]`\n\n$$\\\\mathbb{E}\\_{D}\\leftlbrack \\left( {h\\_{D}\\left( X \\\
  right) - h^{-}\\left( X \\right)} \\right)^{2} \\rightrbrack \\approx 1/m\\left(\
  \ {\\\\sum\\limits\\_{i = 1:m}\\left( {h\\_{Dj}\\left( X_{i} \\right) - h^{-}\\\
  left( X_{i} \\right)} \\right)^{2}} \\right)$$\n\n其中：\n\n$$h^{-}\\left( X \\right)\
  \ \\approx 1/m\\left( {\\\\sum\\limits\\_{i = 1:m}h\\_{Di}\\left( X \\right)} \\\
  right)$$\n\n`y^−(X)` = 1 * `p(y=1|X)` + 2 * `p(y=2|X)`\n\n### 8.5.1 新数据集\n\n你可以更改数据集并找到不同的数据集，或者对数据进行更多预处理，如数据增强和其他处理。然后计算方差，检查新数据如何改变方差，并检查这种变化如何使训练后的模型更好（图\
  \ 8.9）。\n\n![图 8.9 不同的数据集或进行数据增强等数据预处理可以改变方差。](img/fig8_9_B.jpg)\n\n图 8.9 不同的数据集或进行数据增强等数据预处理可以改变方差。\n\
  \n### 8.6 偏差/方差\n\n现在让我们看看偏差与方差之间的关系，以及它们的值如何接近目标。总之，偏差与方差的权衡有四种主要状态（`L: 低, B: 偏差,\
  \ V: Variance, H: 高`）。\n\n1. LB/LV\n2. HB/LV\n3. LB/HV\n4. HB/HV\n\n图 8.10 显示了这四种状态。问题是，噪声值是多少，它与这两个参数之间是什么关系？噪声是数据的一部分，正如第一步提到的，你可以对数据进行一些预处理以消除或减少噪声，然后检查特征或标签等其他原因，查看它们是否被正确选择并采取正确的行动。正如在图\
  \ 8.10 所示所示，最佳状态是 LB/LV（低偏差和低方差），此时值非常接近目标。\n\n![图 8.10 偏差/方差的变化。](img/fig8_10_B.jpg)\n\
  \n图 8.10 偏差/方差的变化。\n\n另一个问题是我们如何找到偏差和方差的最佳值？图 8.11 展示了偏差与方差之间的权衡以及它们与模型复杂性的关系。\n\
  \n![图 8.11 偏差/方差权衡。](img/fig8_11_B.jpg)\n\n图 8.11 偏差/方差权衡。\n\n这对应于最小总值，总值等于偏差和方差之和。虚线显示了最优模型复杂性的点。图\
  \ 8.11 中的点是总误差的最佳值。因此，你可以在模型中找到偏差和方差值，然后找到总误差开始增加的点。\n\n根据之前的讨论，在找到偏差和方差值以及这两个值之间的关系后，如果方差或偏差很高，你应该根据数值采取适当的行动。\n\
  \n图 8.12\n\n![图 8.12.](img/fig8_12_B.jpg)\n\n图 8.12\n\n### 8.7.1 高方差\n\n当数据分散时会发生高方差。当方差很高时，意味着很大一部分误差是由此引起的，然后尝试寻找方法减少它。有一些减少方差的方法，例如装袋法（bagging）或选择良好的数据集。\n\
  \n### 8.7.2 高偏差\n\n当偏差很高时，模型太简单，无法捕捉潜在模式。你可以通过增加模型复杂性或添加更多特征来解决这个问题。\n\n\n\n\n\n\
