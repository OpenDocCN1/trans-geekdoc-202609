  \ (\"Epoch: %(epoch).0f Loss: %(loss)2.2f\")\n  bar = util.create_progress_bar (custom:msg)\n\
  \  for idx in bar (range (loader.get_train_size ()//batch_size)):\n# convert the\
  \ images to tensors\n  x, y = loader.get_batch (batch_size)\n  x = tf.convert_to_tensor\
  \ (x, dtype=tf.float32)\n  y = tf.convert_to_tensor (x, dtype=tf.float32)\n  with\
  \ tf.GradientTape () as tape:\n  logits = standard_classifier (x)\n # compute the\
  \ loss\n  loss_value = tf.nn.sigmoid_cross_entropy_with_logits(labels = y, logits\
  \ = logits)\n  custom:msg.update_mapping(epoch = epoch, loss = loss_value.numpy().mean())\n\
  # backpropagation\n  grads = tape.gradient(loss_value, standard_classifier.variables)\n\
  \  optimizer.apply_gradients (zip(grads,standard_classifier.variables) global_step\
  \ = tf.train.get_or_create_global_step())\n  loss_history.append(loss_value.numpy().mean())\n\
  \  return loss_history.get()\n```\n\n### 7.2.2.5 评估性能\n\n使用验证数据来评估模型的性能。\n\n```\n\
  # 在数据集的一个子集上评估\n(batch_x, batch_y) = loader.get_batch(5000)\ny_pred_standard = tf.round(tf.nn.sigmoid(standard_classifier.predict(batch_x)))\n\
  acc_standard = tf.reduce_mean(tf.cast(tf.equal(batch_y, y_pred_standard), tf.float32))\n\
