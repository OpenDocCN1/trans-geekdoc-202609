  trans: "\n\n此外，运算符的优先级顺序如下：\n\n表 2.4 优先级顺序\n\n| 类别 | 示例 |\n| --- | --- |\n| 括号（分组）\
    \ | `()` |\n| 幂运算 | `a**b` |\n| 正数、负数 | `+a`, `–a` |\n| 乘法、除法、模 | `a * b`, `a\
    \ / b`, `a // b`, `a % b` |\n| 加法、减法 | `a + b`, `a – b` |\n\n还有比较运算符，它们的输出为布尔值。以下是比较运算符：\n\
    \n表 2.5 比较运算符\n\n| 运算符 | 含义 | 示例条件 | 结果 |\n| --- | --- | --- | --- |\n| `==` |\
    \ 等于 | `5 == 5` | True |\n| `!=` | 不等于 | `8!= 5` | True |\n| `>` | 大于 | `3 > 10`\
    \ | False |\n| `<` | 小于 | `5 < 8` | True |\n| `>=` | 大于或等于 | `5 >= 10` | False\
    \ |\n| `<=` | 小于或等于 | `5 <= 5` | True |\n\n### 2.1.4 语句与表达式\n\n由 Python 解释器执行的指令称为语句。某些示例如下：\n\
    \n1. `import` 语句，\n2. 赋值语句，\n3. `if` 语句，\n4. `for` 和 `while` 语句。\n\n变量、运算符和值（也包括函数）的组合需要被求值为表达式（解释器打印结果）。在这里，赋值是一个语句，对\
    \ `x` 和 `y` 有两次求值。对于赋值语句，如 `x = 7`，没有求值（这些是语句，直接执行）。此外，它的结果会创建一个从变量的引用。例如，`x`\
    \ 指向 `7`，当我们使用 `print` 函数处理 `y` 时（Python 中一切皆为函数），我们可以看到它的值。\n\n还有一些方法，如 `input`\
    \ 函数（它允许提供一个提示字符串），可以用于获取用户数据以使程序更具交互性。\n\n**示例**：\n\n```python\nm = input (\"\
    Please enter your favorite number\")\n```\n\n在这里，这一行之后，解释器会等待输入值并将该值存入 `m`。\n\n\
    input 返回字符串（即使用户输入的是数字）。解决方案是使用 `int` 或 `float` 强制转换将字符串转换为整数或浮点数。\n\n**示例**：\n\
    \n```python\nn=int(m)\nprint(n)\n```\n\n`m` 的类型是字符串（即使用户输入数字），而 `n` 的类型是整数。你不能将字符转换为整数或浮点数。多次给变量赋值是有效的（当前值是最后一次赋值的值）。不同的变量可以引用内存中的同一位置。\n\
    \n### 2.1.5 序列\n\n序列是“一组有序的元素”，或者“一组共同存储在集合中的项目项目”。\n\n**示例**：\n\n* 一组“范围”（range）数字，\n\
    * 字符串变量，\n* 列表，\n* 元组。\n\n这些结构可以是序列也可以是非序列。\n\n* 序列（可迭代类型）：\n    * 字符串，\n    *\
    \ 列表、字典，\n* 非序列（不可迭代类型）：\n    * 布尔值，\n    * 整数、浮点数。\n\n### 2.1.6 For 循环\n\n这种技术允许我们针对特定次数重复一段代码块（set）。这是一种确定循环，程序员在代码开始处定义循环的迭代次数。其语法如下：\n\
    \n```python\nfor a variable in sequence:\n # 每次循环执行的代码行\n …\n # 循环结束后的代码行\n …\n\
    ```\n\n总而言之，`for` 有两种类型：\n\n1. for 循环（遍历序列/“可迭代对象”中的每一个项目）\n2. 基于范围的 for 循环（遍历范围内的每一个项目）\n\
    \n对于 `range ()`，这些是参数：\n\n```python\nrange () 根据某些参数生成一个数字序列。\nrange (int start,\
    \ int stop, int step)\nstart: 开始于，\nstep: 每次的变化量，\nstop: 直到但不包含。\n```\n\n`range()`\
    \ 有三种类型：\n\n* 单参数 `range` ➔ 结束值，\n* 两个参数 `range` ➔ 起始值、结束值，\n* 三参数 `range` ➔ 起始值、结束值和增量。\n\
    \n有两种变化类型：\n\n* 正增量向前移动，\n* 负增量向后移动。\n\n### 2.1.7 While 循环\n\n这是一种不确定循环，其迭代在循环块中检查。其语法如下：\n\
    \n（循环块将持续执行直到条件为真）\n\n```python\nwhile condition:\n\t\tstatements\n\t\t…\n```\n\
    \n### 2.1.8 字符串\n\n字符串是由于一些片段（即字符）组成的数据类型之一。它是字符序列（如果长度为零，则为空字符串）。即使字符串的形式像数字，数学运算也对字符串不起作用（除\
    \ `+` 和 `*` 外，它们分别用于连接两个字符串和重复）。可以通过索引访问字符。从左到右从 `0` 开始，从右到左访问则从 `-1` 开始。字符串是\
    \ Python 中的一个对象，与其他对象一样，拥有一些方法。例如，`upper` 和 `lower` 是将字符串转换为大写和小写字符的方法。\n\n表 2.6\
    \ 字符串常用方法\n\n| 方法 | 参数 | 描述 |\n| --- | --- | --- |\n| `upper` | 无 | 返回全大写的字符串\
    \ |\n| `lower` | 无 | 返回全小写的字符串 |\n| `capitalize` | 无 | 返回首字母大写的字符串 |\n| `strip`\
    \ | 无 | 移除首尾空白 |\n| `lstrip` | 无 | 移除头部空白 |\n| `rstrip` | 无 | 移除尾部空白 |\n| `count`\
    \ | 项目 | 返回项目出现的次数 |\n| `replace` | 旧, 新 | 替换所有出现的项目 |\n| `center` | 宽度 | 返回居中指定的字符串\
    \ |\n| `ljust` | 宽度 | 返回左对齐的字符串 |\n| `rjust` | 宽度 | 返回右对齐的字符串 |\n| `find` | 项目\
    \ | 返回项目首次出现的索引，若未找到则返回 -1 |\n\n我们使用比较运算符来比较字符串。输出为真或假。字符串是不可变的，你不能为它们赋值。然而，你可以通过使用\
    \ `+` 运算符来操作字符串。单词 `in` 和 `not in` 用于检查字符串是否是另一个字符串的子字符串。\n\n### 2.1.9 列表\n\n\
    列表是带索引的数据（元素）集合。它类似于字符串，但这里的元素可以是 Python 中的任何类型。创建列表时，你可以使用方括号 `[]`。你可以通过索引访问列表元素，索引从\
    \ 0 开始。你也可以像字符串一样使用负索引。你可以使用 `in` 和 `not in` 检查元素是否存在列表中。`+` 连接两个列表，`*` 实现列表重复。切片概念与字符串相同。通过使用\
    \ `del`，你可以从列表中删除元素。你可以使用比较运算符 `is` 或 `is not` 进行比较。你可以对列表名使用 `+` 和 `*` 来引用列表。有一些方法可以更方便地处理列表。表\
    \ 2.7 显示了你在处理列表时可以使用的方法。\n\n表 2.7 常用列表方法\n\n| 方法 | 参数 | 结果 |\n| --- | --- | ---\
    \ |\n| `append` | 项目 | 在末尾添加项目 |\n| `insert` | 位置, 项目 | 在指定位置插入新项目 |\n| `pop`\
    \ | 无 | 删除并返回列表最后一个元素 |\n| `pop` | 位置 | 删除并返回位置的元素 |\n| `sort` | 无 | 修改为排序后的列表\
    \ |\n| `reverse` | 无 | 按反顺序修改列表 |\n| `index` | 项目 | 返回项目首次出现的位置 |\n| `count` |\
    \ 项目 | 返回项目出现的次数 |\n\n"
- fmt: "\n| `remove` || `item` || removes the first occurrence of an item |\n\n###\
    \ 2.1.10 Dictionary\n\nIt is an unordered, changeable, and indexed collection.\
    \ You can demonstrate it with curly brackets, and the key and values can represent\
    \ its elements.\n\n**Example**:\n\n```\nmydict = {\n \"python\": \"best\",\n \"\
    Programming\": \"1\",\n \"language\": 1999\n}\nprint(mydict)\n```\n\n**Output**:\n\
    \n```\n{'language': 1999, 'Programming': '1', 'python': 'best'}\n```\n\nYou can\
    \ access the dictionary values by putting the value of key or `get()`.\n\n**Example**:\n\
    \n```python\nprint(mydict[\"python\"])\n```\n\n**Output**:\n\n```\nbest\n```\n\
    \nBy using the key name, you can assign a new value to the key:\n\n**Example**:\n\
    \n```python\nmydict[\"python\"] = 1999\nprint(mydict[\"python\"])\n```\n\n**Output**:\n\
    \n```\n1999\n```\n\nYou can use the `for` loop to access the keys and values of\
    \ a dictionary.\n\n**Example**:\n\n```python\nfor x in mydict:\n print(x)\n```\n\
    \n**Output**:\n\n```\nProgramming\npython\nlanguage\n```\n\n### 2.1.11 Tuple\n\
    \nA `tuple` is a python collection with these features: ordered, unchangeable,\
    \ and you can demonstrate it with round brackets `()`.\n\n**Example**:\n\n```python\n\
    mytuple = (\"test\", 7, \"tuple\")\nprint(mytuple)\n```\n\n**Output**:\n\n```\n\
    ('test', 7, 'tuple')\n```\n\nThe instruction for indexing is the same as the list.\n\
    \n**Example**:\n\n```python\nmytuple = (\"test\", 7, \"tuple\")\nprint(mytuple[-1])\n\
    ```\n\n**Output**:\n\n```\ntuple\n```\n\nThe indexing range can be positive or\
    \ negative. It has `start` (included) and `end` (is not included).\n\n**Example**:\n\
    \n```python\nmytuple = (\"test\", 7, \"tuple\")\nprint(mytuple[1:3])\n```\n\n\
    **Output**:\n\n```\n(7, 'tuple')\n```\n\nThere is a trick to change the values\
    \ of a tuple.\n\n**Example**:\n\n```python\nmytuple = (\"test\", 7, \"tuple\"\
    )\nnew_mytuple = list(mytuple)\nnew_mytuple[0] = \"change\"\nmytuple = tuple(new_mytuple)\n\
    print(mytuple)\n```\n\n**Output**:\n\n```\n('change', 7, 'tuple')\n```\n\nYou\
    \ can access the tuple element using a loop.\n\n**Example**:\n\n```python\nmytuple\
    \ = (\"test\", 7, \"tuple\")\nfor x in mytuple:\n print(x)\n```\n\n**Output**:\n\
    \n```\ntest\n7\ntuple\n```\n\nYou cannot remove an item of a tuple, but you can\
    \ delete it completely.\n\n**Example**:\n\n```python\nmytuple = (\"test\", 7,\
    \ \"tuple\")\ndel mytuple\nprint(mytuple)\n```\n\n**Output**:\n\n```\nTraceback\
    \ (most recent call last): File \"./program.py\", line 3, in NameError: name 'mytuple'\
    \ is not defined\n```\n\nYou can add tuples to each other using the `+` operator.\n\
    \n**Example**:\n\n```python\ntuple1 = (\"test\")\ntuple2 = (\"7\")\ntuple3= (\"\
    tuple\")\ntuple4= tuple1 + tuple2 + tuple3\nprint(tuple4)\n```\n\n**Output**:\n\
    \n```\ntest7tuple\n```\n\nYou can use `if` and `in` to check if an item exist\
    \ in a tuple or not.\n\n**Example**:\n\n```python\nmytuple = (\"test\", 7, \"\
    tuple\")\nif \"test\" in mytuple:\n print (\"Yes, the item is in the tuple\")\n\
    ```\n\n**Output**:\n\n```\nYes, the item is in the tuple\n```\n\n### 2.1.12 Sets\n\
    \nSet is a collection of data that has these features: unordered, unindexed, and\
    \ written with curly brackets `{}`.\n\n**Example**:\n\n```python\nmyset = {\"\
    test\", 7, \"set\"}\nprint(myset)\n```\n\n**Output**:\n\n```\n{'test', 'set',\
    \ 7}\n```\n\nYou cannot access the elements of a set using an index because it\
    \ is unordered and unindexed. However, you can use the `for` loop for accessing\
    \ set values.\n\n**Example**:\n\n```python\nmyset = {\"test\", 7, \"set\"}\nfor\
    \ x in myset:\n print(x)\n```\n\n**Output**:\n\n```\nset\ntest\n7\n```\n\nFor\
    \ adding one item, you can use `add()`.\n\n**Example**:\n\n```python\nmyset =\
    \ {\"test\", 7, \"set\"}\nmyset.add(\"learning\")\nprint(myset)\n```\n\n**Output**:\n\
    \n```\n{'learning', 'test', 'set', 7}\n```\n\nFor adding more than one item, you\
    \ can use `update()`. We remove an item of a set by using `remove()` or `discard()`.\
    \ The `remove()` raises an error if the item does not exist, but the `discard()`\
    \ does not.\n\n**Example**:\n\n```python\nmyset = {\"test\", 7, \"set\"}\nmyset.remove(\"\
    test\")\nprint(myset)\n```\n\n**Output**:\n\n```\n{'set', 7}\n```\n\nWe remove\
    \ an item of a set by using `remove()` or `discard()`. The `remove()` raises an\
    \ error if the item does not exist, but the `discard()` does not.\n\n**Example**:\n\
    \n```python\nmyset = {\"test\", 7, \"set\"}\nmyset.remove(\"test\")\nprint(myset)\n\
    ```\n\n**Output**:\n\n```\n{'set', 7}\n```\n\nFor adding one item, you can use\
    \ `add()`.\n\n**Example**:\n\n```python\nmyset = {\"test\", 7, \"set\"}\nmyset.add(\"\
    learning\")\nprint(myset)\n```\n\n**Output**:\n\n```\n{'learning', 'test', 'set',\
    \ 7}\n```\n\nFor adding more than one item, you can use `update()`.\n\nThe `clear()`\
    \ empties the set.\n\n**Example**:\n\n```python\nmyset = {\"test\", 7, \"set\"\
    }\nmyset.clear()\n```\n\n### 2.1.13 Function\n\nA function is a block of code\
    \ which only runs when it is called. You can define a function using the `def`\
    \ keyword.\n\n**Example**:\n\n```python\ndef myfunction():\n  print(\"Hello\"\
    )\n\nmyfunction()\n```\n\nYou can pass arguments into a function.\n\n**Example**:\n\
    \n```python\ndef myfunction(name):\n  print(\"Hello \" + name)\n\nmyfunction(\"\
    John\")\n```\n\nA function can return a value using the `return` statement.\n\n\
    **Example**:\n\n```python\ndef myfunction(x, y):\n  return x + y\n\nprint(myfunction(5,\
    \ 6))\n```\n\nYou can have default value parameter values.\n\n**Example**:\n\n\
    ```python\ndef myfunction(country = \"Norway\"):\n  print(\"I love food in \"\
    \ + country)\n\nmyfunction()\nmyfunction(\"Brazil\")\n```\n\nIf you don't know\
    \ how many arguments will be passed to the function, use arbitrary `*args`.\n\n\
