- fmt: "\nKeras is one of the easy platforms to use python libraries and is on top\
    \ of some machine learning platforms like `TensorFlow` to create deep learning\
    \ models. The `CNN` and `RNN` models are easy to use and quick to implement. `TensorFlow`\
    \ provides both low- and high-level APIs, and `Keras` provides the low level.\
    \ It also helps to reduce the computation costs. Here, we review some fundamentals\
    \ and main concepts of the `Keras` and explain them with some examples. You also\
    \ can use the `Keras` website ([https://keras.io/](https://keras.io)) for more\
    \ details and examples. There are some requirements to start using `Keras` as\
    \ follows:\n\n1. Python 3.5 or higher\n2. `SciPy` with `NumPy`\n3. `TensorFlow`\n\
    4. Any OS (Windows, Linux, or Mac)\n\n### 3.6.1 Create a Virtual Environment\n\
    \nCreating a virtual environment helps you to set up different installed packages\
    \ for different projects separately. For example, you can install it on `python3`:\n\
    \n```\npython3 -m venv kerasenv\n```\n\n### 3.6.2 Activate the Environment\n\n\
    After creating the virtual environment, you should activate it if you like to\
    \ use it.\n\n* Linux/Mac\n\n```\n$ cd kerasvenv kerasvenv $ source bin/activate\n\
    ```\n\n* Windows\n\n```\n.\\env\\Scripts\\activate\n```\n\n### 3.6.3 Python Libraries\n\
    \nYou may need these python dependencies in your project to install them by using\
    \ `pip` or `pip3`. Here we review some of these requirements with examples to\
    \ install `Keras` and use it and its libraries.\n\n* `Numpy`\n```\npip install\
    \ numpy\n```\n\n* `Pandas`\n```\npip install pandas\n```\n\n* `Scikit-learn`\n\
    ```\npip install -U scikit-learn\n```\n\n* `Matplotlib`\n```\npip install matplotlib\n\
    ```\n\n* `Scipy`\n```\npip install scipy\n```\n\n* `Seaborn`\n```\npip pip install\
    \ seaborninstall -U scikit-learn\n```\n\nNow you can install `Keras`\n\n```\n\
    pip install keras\n```\n\nIf `TensorFlow` is not installed on your system, please\
    \ install it.\n\n```\npip install TensorFlow\n```\n\nafter finishing all parts\
    \ of your project, you can quit the environment.\n\n```\ndeactivate\n```\n\nPlease\
    \ check your python version and its requirements for using `pip` or `pip3`. Creating,\
    \ activating, and deactivating the virtual environment helps you organize your\
    \ codes and modules for different projects.\n\n### 3.6.4 Available Modules\n\n\
    These are available modules in `Keras` that you should learn to use and set when\
    \ you plan to create a model with `Keras`:\n\n* `Regularizes`: A list of regularizers.\n\
    * `Constraints`: A list of constraints.\n* `Activations`: A list of activator\
    \ functions.\n* `Losses`: A list of the loss functions.\n* `Metrics`: A list of\
    \ metrics functions.\n* `Optimizers`: A list of optimizer functions.\n* `Callback`:\
    \ A list of the callback functions.\n* `Text processing`: functions to convert\
    \ text into `NumPy` array.\n* `Image processing`: functions to convert images\
    \ into `NumPy`.\n* `Sequence processing`: functions to generate time-based data\
    \ from the given input data.\n* `Backend`: function of the backend library like\
    \ `TensorFlow`.\n* `Utilities`: many utility functions are useful in deep learning.\n\
    \n### 3.6.5 Import Libraries and Modules\n\nHere are some of the libraries and\
    \ modules and the commands for importing. Please try these codes on your computer.\n\
    \n* `NumPy`\n```\nImport numpy as np\n```\n\n* `Keras model module`\n```\nfrom\
    \ keras.models import Sequential\n```\n\n* `Keras core layers`\n```\nfrom keras.layers\
    \ import Dense, Dropout, Activation, Flatten\n```\n\n* `Keras CNN Layers`\n```\n\
    from keras.layers import Convoluton2D, MaxPooling2D\n```\n\n* `Utilities`\n```\n\
    from keras.utils import np_utils\n```\n\nThese are the most important libraries\
    \ that we almost use in all our projects when we are using `Keras`.\n\n### 3.6.6\
    \ Train and Predict the Model\n\nAfter importing the libraries, we should train\
    \ the model and test it. Here are some modules in `Keras` that we can use.\n\n\
    * `Compile`:\n    It is used to configure the\n    ```\n    model.compile(loss='mean_squared_error',\
    \ optimizer='sgd', metrics=['accuracy'])\n    ```\n\n* `Fit`:\n    Use to train.\n\
    \    ```\n    model.fit(x_train, y_train, epochs=10, batch_size=32)\n    ```\n\
    \n* `Evaluate`:\n    Use to.\n    ```\n    model.evaluate(x_test, y_test)\n  \
    \  ```\n\n* `Predict`:\n    Use it to.\n    ```\n    model.predict(x_test)\n \
    \   ```\n"
