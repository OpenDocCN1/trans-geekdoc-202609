    ### 3.4.2 加载并归一化数据


    现在加载数据集并对数据进行归一化以获得训练效果。数据的归一化有助于计算并降低计算成本。它还可以提高结果的准确性。


    ```

    from sklearn.preprocessing import MinMaxScaler

    (training_images, training_labels), (test_images, test_labels) = ks.datasets.fashion_mnist.load_data()y_train
