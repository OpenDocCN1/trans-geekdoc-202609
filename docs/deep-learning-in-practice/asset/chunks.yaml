    \ True |\n\n| \\> || Greater than || 3 > 10 || False |\n\n| < || Less than ||\
    \ 5 < 8 || True |\n\n| \\>= || Greater than or equal to || 5 >= 10 || False |\n\
    \n| <= || Less than or equal to || 5 <= 5 || True |\n\n### 2.1.4 Statements and\
    \ Expressions\n\nAn instruction that executes by the python interpreter is a statement.\
    \ Some examples are as follows:\n\n1.  import statements,\n\n2.  assignment statement,\n\
    \n3.  if statements,\n\n4.  for and while statements.\n\nA combination of variables,\
    \ operators, and values (also function) needs to be evaluated as an expression\
    \ (interpreter print the results). Here the assignment is a statement, and there\
    \ are two evaluations for **x** and **y**. With an assignment statement, like\
    \ **x = 7**, there is no evaluation (these are statements and just execute). Furthermore,\
    \ its results create a reference from a variable. For example, **x** to **7**,\
    \ and when we use a print function for **y** (everything in python is a function),\
    \ we can see its value.\n\nThere are some methods like **input** function (it\
    \ allows providing a prompt string) to get user data for making the program more\
    \ interactive.\n\n**Example**:\n\n```\nm = input (\"Please enter your favorite\
    \ number\")\n```\n\nHere, after this line, the interpreter waits for the input\
    \ value and puts the value in **m**.\n\nThe input returns string (even if the\
    \ user puts the number). The solution is to convert the string to integer or float\
    \ using **int** or **float** casting.\n\n**Example**:\n\n```\nn=int(m)\nprint(n)\n\
    ```\n\nThe type of **m** is string (even if the user enters the number), and the\
    \ type of **n** is an integer. You cannot cast character to int or float. It is\
    \ valid to assign variables several times (the current value is the last assigned\
    \ value). The different variables can refer to the same place of the memory.\n\
    \n### 2.1.5 Sequence\n\nA sequence is an “ordered set of things,” Or “a group\
    \ of items stored together in a collection.”\n\n**Examples**:\n\n*   a \"range\"\
    \ of numbers,\n\n*   string variables,\n\n*   lists,\n\n*   tuples.\n\nAnd the\
    \ structures can be sequence or non-sequence.\n\n*   sequences (iterable types):\n\
    \n    *   strings,\n\n    *   lists, dictionaries,\n\n*   non-sequences (non-iterable\
    \ types):\n\n    *   boolean,\n\n    *   int, float.\n\n### 2.1.6 For Loop\n\n\
    This technique allows us to repeat a block (set) of the codes for a specific time.\
    \ It is a determined loop in which the programmer defines the loop iteration at\
    \ the beginning of the code. Its syntax is as follows:\n\n```\nfor a variable\
    \ in sequence:\n # lines codes execute in every loop\n …\n # lines code after\
    \ the loop\n …\n```\n\nIn total, there are two types of **for**:\n\n1.  for each\
    \ (goes through every item in the sequence(\"iterable\"))\n\n2.  range-based for\
    \ loop (goes through every item in a range)\n\nfor range (), these are the parameters:\n\
    \n```\nrange () generates a sequence of numbers based on some parameters.\nrange\
    \ (int start, int stop, int step)\nstart: begins at,\nstep: change each time,\n\
    stop: up to but not including.\n```\n\nThere are three types for **range ()**:\n\
    \n*   single parameterrange**➔** ending value,\n\n*   two parametersrange **➔**\
    \ starting value, ending value,\n\n*   three parametersrange **➔** starting value,\
    \ ending value, and increment.\n\nAnd there are two types of changes:\n\n*   positive\
    \ increment moves forward,\n\n*   negative increment moves backward.\n\n### 2.1.7\
    \ While Loop\n\nIt is an undetermined loop that its iteration checks in the block\
    \ of the loop. This is the syntax:\n\n(The block of the loop will continue until\
    \ the conditions are true)\n\n```\nwhile condition:\n\t\tstatements\n\t\t…\n```\n\
    \n### 2.1.8 String\n\nThe string is one of the data types that consist of some\
    \ pieces, which are characters. It is a sequence of characters (there is an empty\
    \ string if its length is zero). Mathematical operations do not work on strings\
    \ even if their forms are like numbers (Except for **+** and **\\***, which concatenates\
    \ two strings and repetition). The characters can be accessed by their index.\
    \ From left to right, it starts at **0**, and for accessing from right to left,\
    \ it starts with **–1**. The string is an object in python that, same as other\
    \ objects, has some methods. For example, upper and lower are the methods that\
    \ convert a string to the uppercase and lowercase characters. Here are some string\
    \ methods that are used more.\n\nTable 2.6 Most Popular Methods for Strings\n\n\
    | Method || Parameters || Description |\n\n| --- | --- | --- |\n\n| upper || none\
    \ || returns a string in all uppercase |\n\n| --- | --- | --- |\n\n| lower ||\
    \ none || returns a string in all lowercase |\n\n| capitalize || none || the first\
    \ character is capitalized |\n\n| strip || none || leading and trailing whitespace\
    \ is removed |\n\n| lstrip || none || leading whitespace is removed |\n\n| rstrip\
    \ || none || whitespace is removed |\n\n| count || item || number of occurrences\
    \ of an item |\n\n| replace || old, new || replaces all occurrences of a substring\
    \ |\n\n| center || width || in a field of width return, a string centered |\n\n\
    | ljust || width || in a field of width, spaces return a string left-justified\
    \ |\n\n| rjust || width || in a field of width, spaces return a string right-justified\
    \ |\n\n| find || item || returns the leftmost index where substring item is found,\
    \ or –1 if the item is not |\n\n| index || item || if an item is not found, it\
    \ is Like find except causes a runtime error |\n\nWe use a comparison operator\
    \ to compare strings. The outputs are true or false. Strings are immutable, and\
    \ you cannot assign the values to the current space. However, you can play with\
    \ the strings, for example, by using the **+** operator and a slice of string.\
    \ You can traverse string by using loops and the items. Words **in** and **not\
    \ in** are used to check if a string is a substring (even a single character is\
    \ a substring) of another one.\n\n### 2.1.9 List\n\nIt is a collection of the\
    \ data (elements) that are indexed. It is like a string, but here the elements\
    \ can be any type of data in python. For creating a list, you can use a square\
    \ bracket **\\[\\]**. You can access the list elements by using the index that\
    \ it starts with **0**. You can also access using negative indexing like the string.\
    \ You can use **in** and **not in** to check an element that exists or not in\
    \ a list. **+** makes concatenation of two lists and **\\*** makes repetition\
    \ of lists. There are the same concepts as the string for slicing. By using the\
    \ **del**, you can remove elements from a list. You can use comparison operators\
    \ either **is** or **is not** for making comparisons. You can use **+** and **\\\
    *** on the list name as references to the list. There are some methods for lists\
    \ that process the lists easier. [Table 2.7](#ch2.xhtml#t2_7) shows the methods\
    \ that you can use when you are working with lists.\n\n[Table 2.7 Most Popular\
    \ Methods for List](#ch2.xhtml#R_t2_7)\n\n| Method || Parameters || Result |\n\
    \n| --- | --- | --- |\n\n| append || Item || adding an item to the end |\n\n|\
    \ --- | --- | --- |\n\n| insert || position, item || inserts a new item at the\
    \ position |\n\n| pop || none || removes and then returns the last item of the\
    \ list |\n\n| pop || position || removes and then returns the item |\n\n| sort\
    \ || none || modifies to a sorted list |\n\n| reverse || none || modifies in reverse\
    \ order a list |\n\n| index || item || returns the position of the first occurrence\
    \ of an |\n\n| count || item || returns the number of occurrences of an item |"
