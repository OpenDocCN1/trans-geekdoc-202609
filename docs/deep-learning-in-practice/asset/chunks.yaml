  raw: "3.  train the learning algorithm to find the trained model,\n\n4.  find the\
    \ better model using validation data, and\n\n5.  test the model using testing\
    \ data.\n\nThe discriminative model learns how to find the boundaries between\
    \ classes, and the generative model learns each class’s distribution. The discriminative\
    \ model does not work in unsupervised learning and needs more data for better\
    \ training, and the generative works in unsupervised learning. We can summarize\
    \ the generative and discriminative goals as follows:\n\n1.  **Generative Goal**:\n\
    \n    *   maximize the similarities that make the discriminator misclassify the\
    \ fake data as real.\n\n2.  **Discriminative Goal**:\n\n    *   optimizing the\
    \ differences between real and fake data (training loss close to 0.5).\n\nThese\
    \ are the steps how the generator works:\n\n1.  generate some samples (for example,\
    \ some initial noise data),\n\n2.  chose a neural network algorithm (for example,\
    \ CNN), and\n\n3.  train the generator.\n\n    A Convolution Neural Network (CNN)\
    \ can be a discriminator, and you can implement it as follows:\n\n    1.  chooses\
    \ a CNN to classify real or fake,\n\n    2.  has a real dataset and get fake data\
    \ from a generator,\n\n    3.  train the CNN on the real and fake data, and,\n\
    \n    4.  learns to balance the discriminator training with the generator training\
    \ – if the discriminator is very good, the generator will diverge.\n\n### 5.6.2\
    \ A GAN for Fashion Dataset\n\nHere we present a GAN to learn how it works. These\
