    \ LATENT_DENSE_SIZE, N_CLASSES)\ngan = create_gan(generator, discriminator, label_smoothing\
    \ = LABEL_SMOOTHING_MAGNITUDE)\ntrain_gan(\n   gan,\n   generator,\n   discriminator,\n\
    \   NOISE_DIM,\n   EPOCHS,\n   BATCHES,\n   BATCH_SIZE,\n   IMAGE_NOISE_START,\n\
    \   verbose=2\n)\nsave_model(generator, 'cgan_model100.h5')\n```\n\n#### 5.6.2.7\
    \ Predict (Generate Data)\n\n```\nmodel = load_model('cgan_model100.h5')\nfig\
    \ = plt.figure()\nfig.set_size_inches(16, 16)\n#display images\ndef plot(examples,\
    \ n):\n   for i in range(n * n):\n   plt.subplot(n, n, 1 + i)\n   plt.axis('off')\n\
    \   plt.imshow(examples[i, :, :, 0], cmap='gray_r')\n   plt.show()\n#generate\
    \ random noise and labels\nlatent_points, labels = generate_noise_vector(100,\
    \ 100, 10)\n#generating labels according to the category\nlabels = np.asarray([x\
    \ for _ in range(10) for x in range(10)])\n#predicting\nX = model.predict([latent_points,\
    \ labels])\n#rescaling the predicted image from [-1, 1] to [0, 1]\nX = (X + 1)\
    \ / 2.0\n# plot the result\nplot(X, 10)\n```\n\n# Chapter 6 Deep Neural Networks\
    \ (DNNs) for Images Analysis\n\nDOI: [10.1201/9781003025818-6](https://doi.org/10.1201/9781003025818-6)\n\
    \n## 6.1 Deep Learning and Image Analysis\n\nDeep learning (DL) algorithms have\
    \ shown promising results in many applications using different data types, from\
    \ images to stock market data. The published results of using DL in image analysis\
    \ show very good performance compared to traditional machine learning methods.\
    \ DL’s algorithms use some visual data features that help to do better training\
    \ and achieve better models. There are several applications for using DL in image\
    \ analysis, like autonomous vehicles, medical imaging, privacy, security, and\
    \ entertainment. In this chapter, we review how to deploy DL’s methods for image\
    \ analysis. We discuss and implement image analysis, object recognition, image\
    \ classification, image segmentation, and generation projects using DL’s algorithms.\
    \ In each of these examples, we review the problem, then define the model, and,\
    \ in the end, implement it on a particular dataset ([Figure 6.1](#ch6.xhtml#f6_1)).\n\
    \n![Figure 6.1 One of the most interesting DL applications is image analysis.](images/fig6_1_B.jpg)\n\
    \n[Figure 6.1 One of the most interesting DL applications is image analysis.](#ch6.xhtml#R_f6_1)\n\
    \n## 6.2 Convolutional Neural Networks (CNNs) and Image Analysis\n\nThis section\
    \ explains some critical concepts, such as convolution, pooling, and finding patterns\
    \ in the images. Usually, the image data have high dimensions; for example, a\
    \ small image with 28**×**28 size has 784 pixels. Also, there are different standards\
    \ for colored images that make their dimension higher. As a standard for colored\
    \ images, RGB has three basic channels (R=red, G= green, and B=blue). So, if we\
    \ have a small image (28**×**28) with three channels, then its dimension is:\n\
    \n```\n28 × 28 × 3 = 2352\n```\n\nHere, the feature vector dimension is 2352 for\
    \ small image data, and it shows how the computation cost goes very high when\
    \ we work with large databases. However, some people prefer to use the grayscale\
    \ image in their works because, in the grayscale images, there is just one channel.\
    \ For example, in the previous example, it changed the dimension to 784. If we\
    \ have 10,000 images in our dataset, then:\n\n*   Three channels: 2,352**×**10,000=\
    \ 23,520,000\n\n*   One channel: 784**×**10,000 = 7,840,000\n\n[Figure 6.2](#ch6.xhtml#f6_2)\
    \ shows a CNN that extracts different features of the images from different patches\
    \ in different layers in the **N** dimension space. Several image data patches\
    \ also show that all their values get a 3D matrix after convolving filters on\
    \ the image in each layer. If you look at a pixel in an image, you cannot recognize\
    \ what the image is about, but maybe a set of pixels (a block or patch) give you\
    \ some information about the picture. Also, each image has several patterns that\
    \ create its context. [Figure 6.3](#ch6.xhtml#f6_3) shows an example that the\
    \ CNN is looking for the patterns in images (maybe one pixel or even one patch\
    \ does not show any patterns). The patterns come from any changes in color density\
    \ and other image data values, and the CNNs filters detect different patterns\
    \ in the images. They extract these patterns as feature vectors for training the\
    \ network model. Different filters in different layers provide different feature\
    \ maps that present different data features. More features make the trained network\
    \ more accurate for testing its model with real-world problems. When we train\
    \ a CNN model, there is a type of hierarchical representation: In the different\
    \ layers, the different features will be extracted; for example, the early layers\
    \ extract some patterns like lines and edges, and the last layers extract complex\
    \ patterns like textures, motif, and the parts of the objects. Sometimes, the\
    \ trained model can be trained with new data and is used for new tasks. This type\
    \ of learning is transfer learning that makes the accuracy high and keeps the\
    \ computation cost reasonable.\n\n![Figure 6.2 Image analysis using CNNs.](images/fig6_2_B.jpg)\n\
    \n[Figure 6.2 Image analysis using CNNs.](#ch6.xhtml#R_f6_2)\n\n![Figure 6.3 A\
    \ pattern in images.](images/fig6_3_B.jpg)\n\n[Figure 6.3 A pattern in images.](#ch6.xhtml#R_f6_3)"
