    \n### 7.4.1 特征提取\n\n你可以使用验证集和测试数据集验证你的模型。你可以更改之前步骤（1-3）中的不同参数和超参数，以达到所需的准确率、优化模型并移动到下一步。\n\
    \nRNN 的输出是包含所有输入的概率向量。可以使用之前步骤中的 `librosa` 等库来提取特征。这里的特征是 `频谱图` 和 `梅尔频率谱系数 (MFCCs)`。输出是一个\
    \ `二维张量`，其中第一维度是`时间`，第二维度是`频率`。\n\n### 7.4.2 深度神经网络建模\n\n如果你了解网络的基本设计，就可以为你的项目创建自己的模型。它是序列化的，如果我们有\
    \ `n` 个时间槽，说话者每次都会发字母中的一个。共有 28 个字符，包括 26 个字母、一个空格字符 (\" \") 和一个单引号 (`'`)。图 7.10\
    \ 展示了输出层的详细描述。\n\n### 7.4.3 解码\n\n在这一步中，编码数据需要转换为第一步中编码的原始格式。以下是使用 `Keras` 构建\
    \ RNN 的示例代码。\n\n```\nfrom keras import backend as K\nfrom keras.models import\
    \ Model\nfrom keras.layers import (BatchNormalization, Conv1D, Dense, Input, TimeDistributed,\
    \ Activation, Bidirectional, SimpleRNN, GRU, LSTM)\ndef rnn_model(input_dim, output_dim\
    \ = 26):\n# 主音频输入\ninput_data = Input(name='the_input', shape = (None, input_dim))\n\
    # 添加递归层\nsimp_rnn = GRU(output_dim, return_sequences = True, implementation =\
    \ 2, name = 'rnn')(input_data)\n# 添加 softmax 激活层\ny_pred = Activation('softmax',\
    \ name = 'softmax')(simp_rnn)\n# 指定模型\n model = Model(inputs = input_data, outputs\
    \ = y_pred)\n model.output_length = lambda x: x\n print(model.summary())\n return\
    \ model\n```\n\n### 7.4.4 预测计算\n\n你可以写一个函数来解码你的音频模型的预测结果。\n\n## 7.5 情感分析\n\n"
