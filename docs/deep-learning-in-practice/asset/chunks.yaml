    There are many applications for sentiment analysis. For example, suppose a company
    created a product, and they would like to know about the user feedback to improve
    their product. One of the methods is to check customer feedback through social
    media comments like Twitter and Facebook. For example, if there are thousands
    of words on customer feedback, doing sentiment analysis helps get a general opinion
    about the positive or negative of a product. For doing sentiment analysis, you
    should know about text processing. Text is another type of data (that is the output
    here). In this step, we use these text data (extracted in the previous step) to
    do some sentiment analysis to decide or generate a report. You should know two
    definitions: a) bag of the word: it is a sequence of the word and b) word embedding:
    it is the process of converting word to vector. If you have a bag of words, using
    some methods like `MLP` is not good for this purpose. You can use a deep neural
    network to convert a sequence of the words to a vector (encoding) and then convert
    the vector to a sequence of the desired format (decoding). After converting each
    word to a vector, there is a matrix (each row in this matrix is a vector that
    represents a word) for a set of the word. Now the algorithm finds the probability
    of the word''s occurrence and the words around this word. Then by using `SoftMax`,
    it converts each word value and probabilities to one probability. Each word in
    the same context has a similar vector. For example, the words kitchen and oven
    are similar in comparison to kitchen and history.


    There are two main parts in DAN:


    - `an encoder`: converts the input sequence to a vector depends on the type of
    coding, and

    - `a decoder`: the encoder passes the vector to the decoder, and it converts the
    vector to the desire outputs.


    There are several methods for this purpose, and one of them is the deep averaging
    network (DAN). This network does word embeddings for all words in the sentence,
    averaging these vectors (encoding) and then putting them in the network. The network''s
    output is a scalar (decoding) that determines the sentence''s value as positive
    or negative. In DAN, at first, we get a sequence of words and then convert these
    words to the vectors and then find the average of these vectors and pass this
    vector to the network and do training by using some methods like Stochastic Gradient
    Descent (`SGD). However, DAN has a problem in the output that it does not do order
    in the sequence. For example, when the sentence be: The fire destroyed the houses,
    maybe the output be: The houses destroyed fire, that the concepts are different.
    For this purpose, we can use a recurrent neural network.


    These are the steps for sentiment analysis using DAN:


    1. load dataset,

    2. create DAN network,

    3. train the network, and

    4. evaluate model.


    ### 7.5.1 Load Dataset


    In this step, load the dataset, put data in the training and testing category,
    and label them positively and negatively. Create a dictionary of the words for
    the word embedding process. You need a function to convert the words to the vector.
    Train and test review can be stored as a data frame and the vocabulary as a dictionary
    with key (word) and value(index). The vocabulary is used to find a bag of word
    features.


    For example, for negative review and positive review:


    ```

    my_vocab = {''Deep'': 0, ''learning'': 1, ''in'': 2, ''practice'': 3}

    my_sentence = '' I love to learn deep learning in practice and do my machine learning
    project.''

    ```


    You can create a function to extract the features, such as the word''s occurrence
    in a sentence.


    ```

    my_featurs = generate_featur(my_vocab)

    ```

    the output here should be:

    ```

    array (1, 2, 1, 1)

    ```


    It means the sentence has **one** deep, **two** learning, **one** in, and **one**
    practice.


    ### 7.5.2 Create a DAN Network


    Define two functions:


    1. The `average` function takes tensors as inputs which each one is a bag of the
    word representation of reviews that its output is tensor for the averaged review.

    2. The `forward` function takes tensor as a bag of word representation of reviews
    and calls the `average` function to find the averaged review and send it to the
    layer to find the model.


    ### 7.5.3 Train the Network


    In this stage, you can call the DAN network by training data to find the trained
    network.


    ### 7.5.4 Evaluate the Model


    Now, you can evaluate your trained model using the test data.


    # Chapter 8 Finding the Best Model


    DOI: [10.1201/9781003025818-8](https://doi.org/10.1201/9781003025818-8)


    ## 8.1 Data Preprocessing


    The goal of this chapter is to learn how to find the best-trained model with the
    minimum error. In the first step, let us review the data categories that we need
    in our projects. In total, we can divide the original data into three categories:


    1. training data,

    2. validation data, and

    3. test data.


    We have discussed about these three categories, and you know their definitions.
    The key point here is the percentage of each category that there are some numbers
    like 70% for training, 15% for validation, and 15% for testing. If the tested
    model on the test data reached the desired accuracy, we can utilize it with new
    real-world data. These ratios are not fixed, and you can change and check the
    results to find the best percentages. [Figure 8.1](#ch8.1)


    ## 8.2 What Is a Good Model?


    The first step to evaluate the model is calculating the accuracy or finding out
    the error. When the error is high (accuracy is low), it means the model does not
    work properly and does not cover the goal. There are several methods and measurements
    to find the accuracy (finding the error). There are two types of errors for checking
    the model: validation error and test error. For finding out whether a model is
    good or not, you can work on the validation error. It depends on the data you
    have and checks how much they are valid to evaluate the model. In the beginning,
    it is better to check the model with validation error to find the best model for
    testing. If the validation error is high or does not meet your needs, then the
    model is not good enough to use. To solve the problem, you should decompose the
    validation error at the first step:


    ```

    Validation Error = Noise + Bias + Variance

    ```

