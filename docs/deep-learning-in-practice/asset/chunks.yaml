  trans: "\nSoftmax 通常用于最后一层或输出层。它的输出是多个值，并且可以处理多分类问题。图 4.8 显示了 softmax 的工作原理。\n\n\
    ![图 4.8 softmax 的工作原理！](img/fig4_8_B.jpg)\n\n图 4.8 softmax 的工作原理！\n\nSoftmax 将每个类别的输出归一化到\
    \ 0 到 1 之间（概率值除以总和）。\n\n$$\\left. S\\left( y\\_{i} \\right) = e^{yi}/\\\\sum\\\
    limits\\_{j = 1..n}e^{yj} \\right.$$  \n\n`S` 是 softmax 函数，`y` 是 `S` 的输入向量，具有\
    \ `n` 个元素（例如 `y`[`i]` 的值介于 (-inf, +inf) 之间），对应 `n` 个类别。`e` 是标准指数函数。\n\n## 4.4\
    \ 损失函数\n\n损失函数（代价函数）是一个显示我们的预测模型与期望模型之间差异的函数。它通过计算损失值（预测输出与期望（目标）值之间的差）来提取。几种类型的损失函数分为三大类：\n\
    \n1. **回归损失函数**：如均方误差 `M`ean `S`quare `E`rror (MSE) 和绝对误差 `A`AE，\n\n2. **分类损失函数**：如二分类交叉熵\
    \ (BCE)、负对数似然 (NL)、软间隔分类器 (SMC) 以及\n\n3. **嵌入损失函数**：如平均绝对误差-MAE (`L[1]`)、均方误差-\
    \ MSE (`L[2]`) 和余弦误差 `C`osine Error (CE)。\n\n最流行的是交叉熵损失和均方误差- MSE (`L[2]`) 损失。\n\
    \n### 4.4.1 交叉熵损失\n\n它是一个概率值，是预测代价与实际代价之间的差异。图 4.9 显示了它的图表。\n\n![图 4.9 交叉熵损失图。](img/fig4_9_B.jpg)\n\
    \n图 4.9 交叉熵损失图。\n\n### 4.4.2 MSE (L[2]) 损失\n\n`L2` 的计算方式如下：\n\n$$MSE = \\frac{\\\
    \\sum\\limits\\_{i = 1}^{n}\\left( {y - y\\_{i}^{p}} \\right)^{2}}{n}$$  \n\n\
    图 4.10 显示了代表 `MSE` 函数的 `L`[`2]` 图形，其中 `MSE` 损失在预测 = 100 时达到最小值。\n\n![图 4.10 MSE\
    \ (L2) 损失图。](img/fig4_10_B.jpg)\n\n[图 4.10 MSE (L[2]) 损失图。](#ch4.xhtml#R_f4_10)\n\
    \n## 4.5 优化函数\n\n三种最流行的优化算法是随机梯度下降 (SGD)、`Adagrad` 和 `Adam`。总来说，`SGD` 比其他算法快得多。速度和更好的结果（准确性）之间存在权衡。当数据增长时，模型变得更加复杂，此时选择优化函数就具有挑战性。在学习某些优化方法之前，我们应该了解两个概念：学习率和凸。\n\
    \n### 4.5.1 学习率\n\n优化算法更新网络的权重和偏置，分为两类：固定学习率和自适应学习率。学习率是优化算法在训练阶段训练权重时使用的步长。其值很小，通常介于\
    \ 0.0 到 1.0 之间，选择不当的值会影响训练。图 4.11 显示了其中一些情况。\n\n![图 11 不同的学习率值。](img/fig4_11.jpg)\n\
    \n图 11 不同的学习率值。\n\n### 4.5.2 凸\n\n如果我们在图上的任意两点之间连一条线，那么该线位于两点之间图形的上方或下方（图 4.12）。\n\
    \n![图 12 部的曲线是非凸的，底部的曲线是凸的。](img/fig4_12.jpg)\n\n图 12 顶部曲线是非凸的，底部的曲线是凸的。\n\n###\
    \ 4.5.3 梯度下降\n\n梯度下降是最流行的优化方法之一，它沿着梯度方向给出最优值。当目标函数是凸时，这种方法是最通用且最流行的解决方案。它的问题之一是每一步的更新过程。当计算所有数据的梯度时，`GD`\
    \ 的计算成本会变得很高，特别是当数据量很大时。包含噪声或偏置数据时，收敛也需要更多的时间。\n\n### 4.5.4 随机梯度下降\n\n梯度下降 (GD)\
    \ 计算梯度以寻找局部最小值，而随机梯度下降 (SGD) 则随机更新训练样本的参数。它的计算效率很高，并不一定依赖于整个数据。它的问题是选择合适的学习率。\n\
    \n### 4.5.5 Adagrad\n\nAdagrad 方法通过根据过去的梯度平方来自适应地调整学习率，不需要手动调整参数。这种方法对于处理稀疏数据非常有效。它的问题是学习率可能会不断减小，导致到后期可能停止学习。\n\
    \n### 4.5.6 Adam\n\n`Adam` 结合了动量和自适应学习率，是目前深度学习中最常用的优化器之一。它通过计算梯度的一阶和二阶矩的移动平均来更新参数。这种方法在许多问题上都表现良好。\n"
- fmt: "\nWhen we choose the linear activation function, it does not work for the\
    \ backpropagation because the derivative is constant, and it cannot help us update\
    \ the weights in returning to the inputs and find the best weights. It does not\
    \ work for nonlinear problems because the output is linear in any architecture\
    \ (even with several neurons and layers). Therefore, it cannot simulate the nonlinear\
    \ behavior of a problem. [Figure 4.15](#ch4.xhtml#f4_15) demonstrates the linear\
    \ function that its derivative is constant and cannot simulate the nonlinear models.\n\
    \n![Figure 4.15 Linear function and its derivative.](images/fig4_15_B.jpg)\n\n\
    [Figure 4.15 Linear function and its derivative.](#ch4.xhtml#R_f4_15)\n\n### 4.6.2\
    \ Nonlinear Functions\n\nIn a real-world problem, there are some problems with\
    \ nonlinearity in their behaviors. Deploying nonlinear functions (Activation Function\
    \ (AF)) helps to simulate this type of model. We discussed some of them in the\
    \ previous section. Here, we have one of the most popular ones in a neural network\
    \ (the sigmoid function):\n\n`f(x) = s(w×x+b)`\n\n[Figure 4.16](#ch4.xhtml#f4_16)\
    \ shows how to use sigmoid for nonlinearity simulation. It gives us a smooth gradient,\
    \ besides its clear prediction (its values are limited between 0 and 1).\n\n![Figure\
    \ 4.16 Using sigmoid for nonlinearity modeling.](images/fig4_16_B.jpg)\n\n[Figure\
    \ 4.16 Using sigmoid for nonlinearity modeling.](#ch4.xhtml#R_f4_16)\n\nThe nonlinear\
    \ activation function covers two problems mentioned in the previous section to\
    \ deploy in backpropagation and demonstrate the effect of more neurons and layers\
    \ in the training process, especially in deep neural networks. However, its computation\
    \ cost is high, and the gradients do not change in the high value of `x` (vanishing\
    \ gradient problem). We can use the `ReLU` function that covers nonlinearity and\
    \ is cost-efficient. Its problem is just about the negative value that the network\
    \ cannot learn for these data. However, `Leaky ReLU` does not provide clear predictions\
    \ for negative values; it solves this issue.\n\nYou can see the vanishing gradient\
    \ problem in [Figure 4.17](#ch4.xhtml#f4_17) and the learning problem for negative\
    \ values in [Figure 4.18](#ch4.xhtml#f4_18).\n\n![Figure 4.17 Derivatives for\
    \ sigmoid.](images/fig4_17_B.jpg)\n\n[Figure 4.17 Derivatives for sigmoid.](#ch4.xhtml#R_f4_17)\n\
    \n![Figure 4.18 Derivatives for ReLU.](images/fig4_18_B.jpg)\n\n[Figure 4.18 Derivatives\
    \ for ReLU.](#ch4.xhtml#R_f4_18)\n\nAs you can see, it is also possible that `ReLU`\
    \ includes some issues and problems, and maybe `leaky ReLU` solves them.\n\n##\
    \ 4.7 ANNs Architectures\n\n### 4.7.1 Feed Forward Neural Networks (FFNNs)\n\n\
    An FFNN is an artificial neural network without any form of a cycle in connections\
    \ between nodes. It flows the information from one direction (input to the hidden\
    \ layer and then output layer). FFNN is the simplest form of NNs that the information\
    \ is processed only in one direction. [Figure 4.18](#ch4.xhtml#f4_18) shows the\
    \ architecture of FFNN.\n\nFFNN is a simple network that has input, hidden, and\
    \ output layers. The combination of neurons in each layer will forward propagate\
    \ to the next layer. Then it goes to the activation function, and the outputs\
    \ and their combinations are the inputs of the next layer, and it will continue\
    \ for all layers, up to the last layer that gives the final outputs. For example,\
    \ if the network has one input, one hidden, and one output layer as shown in [Figure\
    \ 4.19](#ch4.xhtml#f4_19) and the `X` be the sample input vector, `X = (x[1],\
    \ x[2])` and `W[h]=(w[h11],w[h12],w[h21],w[h22])` be the weights of the hidden\
    \ layer and `Wo=(w[o11], w[o12], w[o13], w[o21], w[o22], w[o23], w[o31], w[o32],\
    \ w[o33])` be the weights of the output layer and `a` be the activation function\
    \ then the prediction is equal to:\n\n```\nprediction=a(a(X*Wh)*Wo)\n```\n\n![Figure\
    \ 4.19 FFNN architecture.](images/fig4_19_B.jpg)\n\n[Figure 4.19 FFNN architecture.](#ch4.xhtml#R_f4_19)\n\
    \nThese are the steps:\n\n1. **Step 1:** Calculate the weighted input to the hidden\
    \ layer by multiplying `X` by hidden weight `W[h]`.\n2. **Step 2:** Apply the\
    \ activation function and pass the results to the next layer.\n3. **Step 3:**\
    \ Repeat steps 1 and 2 for all layers.\n\nThe algorithm uses the `X` data to calculate\
    \ the combination of data `(X)` and weights `(W)` and bias `(b)` and applies activation\
    \ function on it through all layers to get the output.\n\n#### 4.7.1.1 Example\
    \ with TensorFlow\n\n**Step 1:** **Import Libraries**\n```\nimport tensorflow\
    \ as tf\nimport numpy as np\nfrom tensorflow import keras\n```\n\n**Step 2:**\
    \ **Load Data**\n```\n(x_train, y_train), (x_test, y_test) = keras.datasets.mnist.load_data()\n\
    ```\n\n**Step 3:** **One Hot and Normalization**\n```\ny_train = tf.to_hot(y_train,\
    \ 10)\ny_test = tf.to_hot(y_test, 10)\nx_train = x_train / 255.0\nx_test = x_test\
    \ / 255.0\n```\n\n**Step 4:** **Making Model**\n```\nmodel = keras.Sequential([\n\
    \   keras.layers.Flatten(input_shape=(28,28)),\n   keras.layers.Dense(256, activation='relu'),\n\
    \   keras.layers.Dense(32, activation='relu'),\n   keras.layers.Dense(10, activation='softmax')])\n\
    ```\n\n**Step 5:** **Model Summary**\n```\nmodel.summary()\n```\n\n**Step 6:**\
    \ **Compile the Model**\n```\nmodel.compile(loss='categorical_crossentropy', metrics=['accuracy'],\
    \ optimizer='adam')\n```\n\n**Step 7:** **Train the Model**\n```\nn_val = 5000\n\
    n_train = 60000\nn_test = 10000\nbatch_size = 100\nepochs = 100\nsteps_per_epoch\
    \ = (n_train-n_val)/batch_size\nvalidation_split = n_val/n_train\nvalidation_steps\
    \ = int(n_val / batch_size)\ntest_steps = int(n_test/batch_size)\nhistory = model.fit(x_train,\
    \ y_train, epochs=epochs, steps_per_epoch=steps_per_epoch, validation_split=validation_split,\
    \ validation_steps=validation_steps, callbacks=[tensorboard_callback])\n```\n\n\
    **Step 8:** **Test the Model**\n```\nscore = model.evaluate(x_test, y_test, steps=test_steps,\
    \ verbose=0)\nprint('Test loss:', score[0])\nprint('Test accuracy:', score[1])\n\
    ```\n\n### 4.7.2 Backpropagation\n\nBackpropagation is a supervised learning algorithm,\
    \ and it needs to be trained by training sample data. Here are the steps of implementing\
    \ backpropagation algorithm:\n\n1. **Step 1:** **Forward Propagation**: data vector\
    \ `x` passes through the neural network and gives output `f(x)`. Each layer’s\
    \ activation function can be different or the same, except for the last layer,\
    \ which controls the output type based on the model and problem types (classification\
    \ or regression). [Figure 4.20](#ch4.xhtml#f4_20) shows an example of the backpropagation\
    \ network.\n\n![Figure 4.20 Backpropagation architecture.](images/fig4_20_B.jpg)\n\
    \n[Figure 4.20 Backpropagation architecture.](#ch4.xhtml#R_f4_20)\n"
  raw: "When we choose the linear activation function, it does not work for the backpropagation\
    \ because the derivative is constant, and it cannot help us update the weights\
    \ in returning to the inputs and find the best weights. It does not work for nonlinear\
    \ problems because the output is linear in any architecture (even with several\
    \ neurons and layers). Therefore, it cannot simulate the nonlinear behavior of\
    \ a problem. [Figure 4.15](#ch4.xhtml#f4_15) demonstrates the linear function\
    \ that its derivative is constant and cannot simulate the nonlinear models.\n\n\
    ![Figure 4.15 Linear function and its derivative.](images/fig4_15_B.jpg)\n\n[Figure\
    \ 4.15 Linear function and its derivative.](#ch4.xhtml#R_f4_15)\n\n### 4.6.2 Nonlinear\
    \ Functions\n\nIn a real-world problem, there are some problems with nonlinearity\
    \ in their behaviors. Deploying nonlinear functions (Activation Function (AF))\
    \ helps to simulate this type of model. We discussed some of them in the previous\
    \ section. Here, we have one of the most popular ones in a neural network (the\
    \ sigmoid function):\n\n*f*(*x*) = *s**i**g* (*w*×*x*+*b*)  \n\n[Figure 4.16](#ch4.xhtml#f4_16)\
    \ shows how to use sigmoid for nonlinearity simulation. It gives us a smooth gradient,\
    \ besides its clear prediction (its values are limited between 0 and 1).\n\n![Figure\
    \ 4.16 Using sigmoid for nonlinearity modeling.](images/fig4_16_B.jpg)\n\n[Figure\
    \ 4.16 Using sigmoid for nonlinearity modeling.](#ch4.xhtml#R_f4_16)\n\nThe nonlinear\
    \ activation function covers two problems mentioned in the previous section to\
    \ deploy in backpropagation and demonstrate the effect of more neurons and layers\
    \ in the training process, especially in deep neural networks. However, its computation\
    \ cost is high, and the gradients do not change in the high value of **x** (vanishing\
    \ gradient problem). We can use the **ReLU** function that covers nonlinearity\
    \ and is cost-efficient. Its problem is just about the negative value that the\
    \ network cannot learn for these data. However, **Leaky ReLU** does not provide\
    \ clear predictions for negative values; it solves this issue.\n\nYou can see\
    \ the vanishing gradient problem in [Figure 4.17](#ch4.xhtml#f4_17) and the learning\
    \ problem for negative values in [Figure 4.18](#ch4.xhtml#f4_18).\n\n![Figure\
    \ 4.17 Derivatives for sigmoid.](images/fig4_17_B.jpg)\n\n[Figure 4.17 Derivatives\
    \ for sigmoid.](#ch4.xhtml#R_f4_17)\n\n![Figure 4.18 Derivatives for ReLU.](images/fig4_18_B.jpg)\n\
    \n[Figure 4.18 Derivatives for ReLU.](#ch4.xhtml#R_f4_18)\n\nAs you can see, it\
    \ is also possible that **ReLU** includes some issues and problems, and maybe\
    \ **leaky ReLU** solves them.\n\n## 4.7 ANNs Architectures\n\n### 4.7.1 Feed Forward\
    \ Neural Networks (FFNNs)\n\nAn FFNN is an artificial neural network without any\
    \ form of a cycle in connections between nodes. It flows the information from\
    \ one direction (input to the hidden layer and then output layer). FFNN is the\
    \ simplest form of NNs that the information is processed only in one direction.\
    \ [Figure 4.18](#ch4.xhtml#f4_18) shows the architecture of FFNN.\n\nFFNN is a\
    \ simple network that has input, hidden, and output layers. The combination of\
    \ neurons in each layer will forward propagate to the next layer. Then it goes\
    \ to the activation function, and the outputs and their combinations are the inputs\
    \ of the next layer, and it will continue for all layers, up to the last layer\
    \ that gives the final outputs. For example, if the network has one input, one\
    \ hidden, and one output layer as shown in [Figure 4.19](#ch4.xhtml#f4_19) and\
    \ the **X** be the sample input vector, **X**\\= (x[1], x[2]) and **W**[**h**]\\\
    =(w[h11],w[h12],w[h21],w[h22]) be the weights of the hidden layer and **Wo**\\\
    =(w[o11], w[o12], w[o13], w[o21], w[o22], w[o23], w[o31], w[o32], w[o33]) be the\
    \ weights of the output layer and **a** be the activation function then the prediction\
    \ is equal to:\n\n```\nprediction=a(a(X*Wh)*Wo)\n```\n\n![Figure 4.19 FFNN architecture.](images/fig4_19_B.jpg)\n\
    \n[Figure 4.19 FFNN architecture.](#ch4.xhtml#R_f4_19)\n\nThese are the steps:\n\
    \n1.  **Step 1:** Calculate the weighted input to the hidden layer by multiplying\
    \ **X** by hidden weight **W**[**h**].\n\n2.  **Step 2:** Apply the activation\
    \ function and pass the results to the next layer.\n\n3.  **Step 3:** Repeat steps\
    \ 1 and 2 for all layers.\n\nThe algorithm uses the **X** data to calculate the\
    \ combination of data **(X)** and weights **(W)** and bias **(b)** and applies\
    \ activation function on it through all layers to get output. Two famous types\
    \ of feedforwards networks are single- and multi-layer perceptron. The pseudo\
    \ of the algorithm is:\n\n```\nForward (x):\ny0=x\nfor l=1: L do:\n cl=wlTyl-1\
    \ + bl\n yl= a(cl)\nend\nreturn (yl)\n```\n\n#### 4.7.1.1 FFN Example with TensorFlow\n\
    \n1.  **Step 1:** **Import Libraries**\n\n    ```\n    import tensorflow as tf\n\
    \    import numpy as np\n    from tensorflow import keras\n    ```\n\n2.  **Step\
    \ 2:** **Load Data**\n\n    ```\n    from keras.datasets import mnist\n    (x_train,\
    \ y_train), (x_test, y_test) = mnist.load_data()\n    ```\n\n3.  **Step 3:** **One\
    \ Hot and Normalization Data**\n\n    ```\n    y_train = tf.one_hot(y_train, 10)\n\
    \    y_test = tf.one_hot(y_test, 10)\n    x_train = x_train / 255.0\n    x_test\
    \ = x_test / 255.0\n    ```\n\n4.  **Step 4:** **Making Model**\n\n    ```\n \
    \   model = keras.Sequential([\n       keras.layers.Flatten(input_shape=(28, 28)),\n\
    \       keras.layers.Dense(256, activation='relu'),\n       keras.layers.Dense(32,\
    \ activation='relu'),\n       keras.layers.Dense(10, activation='softmax')\n \
    \   ])\n    ```\n\n5.  **Step 5:** **Model Summary**\n\n    ```\n    model.summary()\n\
    \    Model: \"sequential\"\n    Layer (type) Output Shape Param #\n    ====================================================\n\
    \    flatten_2 (Flatten) (None, 784) 0\n    ____________________________________________________\n\
    \    dense_6 (Dense) (None, 256) 200960\n    ____________________________________________________\n\
    \    dense_7 (Dense) (None, 32) 8224\n    ____________________________________________________\n\
    \    dense_8 (Dense) (None, 10) 330\n    ====================================================\n\
    \    Total params: 209,514\n    Trainable params: 209,514\n    Non-trainable params:\
    \ 0\n    ```\n\n6.  **Step 6:** **Compile the Model**\n\n    ```\n    model.compile(loss='categorical_crossentropy',\
    \ metrics=&[apos;accuracy'], optimizer='adam')\n    ```\n\n7.  **Step 7:** **Train\
    \ the Model**\n\n    ```\n    n_val = 5000\n    n_train = 60000\n    n_test =\
    \ 10000\n    batch_size=100\n    epochs=100\n    steps_per_epoch = int((n_train-n_val)/batch_size)\n\
    \    n_val = 5000\n    validation_split = n_val/n_train\n    validation_steps\
    \ = int(n_val / batch_size)\n    test_steps = int(n_test/batch_size)\n    history\
    \ = model.fit(x_train, y_train, epochs=epochs, steps_per_epoch=steps_per_epoch,\
    \ validation_split= validation_split, validation_steps=validation_steps, callbacks=[tensorboard_callback])\n\
    \    ```\n\n8.  **Step 8:** **Test the Model**\n\n    ```\n    score = model.evaluate(x_test,\
    \ y_test, steps=test_steps, verbose=0)\n    print('Test loss:', score[0])\n  \
    \  print('Test accuracy:', score[1])\n    ```\n\n### 4.7.2 Backpropagation\n\n\
    Backpropagation is a supervised learning algorithm, and it needs to be trained\
    \ by training sample data. Here are the steps of implementing backpropagation\
    \ algorithm:\n\n1.  **Step 1:** **Forward Propagation**: data vector **x** passes\
    \ through the neural network and gives output **f(x)**. Each layer’s activation\
    \ function can be different or the same, except for the last layer, which controls\
    \ the output type based on the model and problem types (classification or regression).\
    \ [Figure 4.20](#ch4.xhtml#f4_20) shows an example of the backpropagation network.\n\
    \n    ![Figure 4.20 Backpropagation architecture.](images/fig4_20_B.jpg)\n\n \
    \   [Figure 4.20 Backpropagation architecture.](#ch4.xhtml#R_f4_20)"
