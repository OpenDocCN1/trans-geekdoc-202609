    \n1. `Step 1`: feature extraction,\n2. `Step 2`: making the model,\n3. `Step 3`:\
    \ decoding.\n\n![Figure 7.9 Speech to text.](images/fig7_9.jpg)\n\n### 7.4.1 Feature\
    \ Extraction\n\nYou can validate your model using the validation and test dataset.\
    \ You can change different parameters and hyperparameters in the previous steps\
    \ (1-3) to achieve the desired accuracy, optimize the model, and move to the next\
    \ step.\n\nThe output of the RNN is a vector that contains probabilities of all\
    \ inputs. Several libraries like `librosa` (used in the previous step) can be\
    \ used here to extract features. The features here are `spectrogram` and `Mel-Frequency\
    \ Cepstral Coefficients (MFCCs)`. The output is a `2D tensor` where the first\
    \ dimension is `time`, and the second is `frequency`.\n\n### 7.4.2 Deep Neural\
    \ Networks Modeling\n\nIf you know the basic design of a network, you can create\
    \ your own model for your project. It is sequential, and if we have `n` time slot,\
    \ every time the speaker pronounces one of the alphabet. There are 28 characters,\
    \ including 26 letters, a space character (\" \"), and an apostrophe (`'`). Figure\
    \ 7.10 shows an depiction of the RNN that shows the output layer in greater detail.\n\
    \n### 7.4.3 Decoder\n\nIn this step, the coded data should convert to the original\
    \ text format coded in the first step. Here is the sample code for the RNN model\
    \ using `Keras`.\n\n```\nfrom keras import backend as K\nfrom keras.models import\
    \ Model\nfrom keras.layers import (BatchNormalization, Conv1D, Dense, Input, TimeDistributed,\
    \ Activation, Bidirectional, SimpleRNN, GRU, LSTM)\ndef rnn_model(input_dim, output_dim\
    \ = 26):\n# Main acoustic input\ninput_data = Input(name='the_input', shape =\
    \ (None, input_dim))\n# Add recurrent layer\nsimp_rnn = GRU(output_dim, return_sequences\
    \ = True, implementation = 2, name = 'rnn')(input_data)\n# Add softmax activation\
    \ layer\ny_pred = Activation('softmax', name = 'softmax')(simp_rnn)\n# Specify\
    \ the model\n model = Model(inputs = input_data, outputs = y_pred)\n model.output_length\
    \ = lambda x: x\n print(model.summary())\n return model\n```\n\n### 7.4.4 Predictions\
    \ Calculation\n\nYou can write a function to decode the predictions of your acoustic\
    \ model.\n\n## 7.5 Sentiment Analysis\n"
