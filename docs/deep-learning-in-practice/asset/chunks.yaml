  trans: "\n当我们选择线性激活函数时，它对反向传播不起作用，因为其导数是常数，它无法帮助我们在返回输入时更新权重并找到最佳权重。它对于非线性问题也不起作用，因为在任何架构中输出都是线性的（即使有多个神经元和层）。因此，它无法模拟问题的非线性行为。图\
    \ 4.15 展示了其导数是常数且无法模拟非线性模型的线性函数。\n\n![图 4.15 线性函数及其导数。](img/fig4_15_B.jpg)\n\n\
    图 4.15 线性函数及其导数。\n\n### 4.6.2 非线性函数\n\n在现实世界的问题中，某些问题的行为具有非线性特征。部署非线性函数（激活函数 (AF)）有助于模拟这类模型。我们在上一节中讨论了其中一些。这里，我们介绍一种在神经网络中最流行的函数之一（sigmoid\
    \ 函数）：\n\n`f(x) = s(w×x+b)`\n\n图 4.16 显示了如何使用 sigmoid 进行非线性模拟。除了提供平滑的梯度外，它还提供了清晰的预测（其值限制在\
    \ 0 和 1 之间）。\n\n![图 4.16 使用 sigmoid 进行非线性建模。](img/fig4_16_B.jpg)\n\n图 4.16 使用\
    \ sigmoid 进行非线性建模。\n\n非线性激活函数涵盖了上一节提到的两个问题，以便部署于反向传播中并展示训练过程中更多神经元和层的效果，特别是在深度神经网络中。然而，它的计算成本很高，且在\
    \ `x` 的高值处梯度不发生（梯度消失问题）。我们可以使用 `ReLU` 函数，它涵盖了非线性且具有成本效益。它的问题仅在于网络无法学习这些数据的负值。然而，`Leaky\
    \ ReLU` 没有为负值提供清晰的预测；而它解决了这个问题。\n\n你可以在 图 4.17 中看到梯度消失问题，在 图 4.18 中看到负值的学习问题。\n\
    \n![图 4.17 sigmoid 的导数。](img/fig4_17_B.jpg)\n\n图 4.17 sigmoid 的导数。\n\n![图 4.18\
    \ ReLU 的导数。](img/fig4_18_B.jpg)\n\n图 4.18 ReLU 的导数。\n\n如你所见，`ReLU` 也可能包含一些问题和缺陷，而\
    \ `leaky ReLU` 可能解决了这些问题。\n\n## 4.7 ANN 架构\n\n### 4.7.1 前馈神经网络 (FFNNs)\n\nFFNN\
    \ 是一种在节点间连接中没有任何形式循环的人工神经网络。它的信息从一个方向流动（从输入层到隐藏层，再到输出层）。FFNN 是神经网络最简单的形式，信息仅在一个方向上进行处理。图\
    \ 4.18 展示了 FFNN 的架构。\n\nFFNN 是一个包含输入层、隐藏层和输出层的简单网络。每层神经元的组合将前向传播到下一层。然后它进入激活函数，输出及其组合是下一层的输入，该过程将持续于所有层，直到给出最终输出的最后一层。例如，如果网络如\
    \ 图 4.19 所示有一个输入层、一个隐藏层和一个输出层，`X` 为样本输入向量，`X = (x[1], x[2])`，`W[h]=(w[h11],w[h12],w[h21],w[h22])`\
    \ 为隐藏层的权重，`Wo=(w[o11], w[o12], w[o13], w[o21], w[o22], w[o23], w[o31], w[o32],\
    \ w[o33])` 为输出层的权重，`a` 为激活函数，那么预测等于：\n\n```\nprediction=a(a(X*Wh)*Wo)\n```\n\n\
    ![图 4.19 FFNN 架构。](img/fig4_19_B.jpg)\n\n图 4.19 FFNN 架构。\n\n这些是步骤：\n\n1. **步骤\
    \ 1：** 通过将 `X` 乘以隐藏权重 `W[h]` 计算进入隐藏层的加权输入。\n2. **步骤 2：** 应用激活函数并将结果传递给下一层。\n3.\
    \ **步骤 3：** 对所有层重复步骤 1 和步骤 2。\n\n该算法使用 `X` 数据计算数据组合 `(X)`、权重 `(W)` 和偏置 `(b)`，并通过所有层对其应用激活函数以获得输出。\n\
    \n#### 4.7.1.1 TensorFlow 示例\n\n**步骤 1：** **导入库**\n```\nimport tensorflow as tf\n\
    import numpy as np\nfrom tensorflow import keras\n```\n\n**步骤 2：** **加载数据**\n\
    ```\n(x_train, y_train), (x_test, y_test) = keras.datasets.mnist.load_data()\n\
    ```\n\n**步骤 3：** **独热编码与归一化**\n```\ny_train = tf.to_hot(y_train, 10)\ny_test =\
    \ tf.to_hot(y_test, 10)\nx_train = x_train / 255.0\nx_test = x_test / 255.0\n\
    ```\n\n**步骤 4：** **构建模型**\n```\nmodel = keras.Sequential([\n   keras.layers.Flatten(input_shape=(28,28)),\n\
    \   keras.layers.Dense(256, activation='relu'),\n   keras.layers.Dense(32, activation='relu'),\n\
    \   keras.layers.Dense(10, activation='softmax')])\n```\n\n**步骤 5：** **模型摘要**\n\
    ```\nmodel.summary()\n```\n\n**步骤 6：** **编译模型**\n```\nmodel.compile(loss='categorical_crossentropy',\
    \ metrics=['accuracy'], optimizer='adam')\n```\n\n**步骤 7：** **训练模型**\n```\nn_val\
    \ = 5000\nn_train = 60000\nn_test = 10000\nbatch_size = 100\nepochs = 100\nsteps_per_epoch\
    \ = (n_train-n_val)/batch_size\nvalidation_split = n_val/n_train\nvalidation_steps\
    \ = int(n_val / batch_size)\ntest_steps = int(n_test/batch_size)\nhistory = model.fit(x_train,\
    \ y_train, epochs=epochs, steps_per_epoch=steps_per_epoch, validation_split=validation_split,\
    \ validation_steps=validation_steps, callbacks=[tensorboard_callback])\n```\n\n\
    **步骤 8：** **测试模型**\n```\nscore = model.evaluate(x_test, y_test, steps=test_steps,\
    \ verbose=0)\nprint('Test loss:', score[0])\nprint('Test accuracy:', score[1])\n\
    ```\n\n### 4.7.2 反向传播\n\n反向传播是一种监督学习算法，需要通过训练数据进行训练。以下是实现反向传播算法的步骤：\n\n1. **步骤\
    \ 1：** **前向传播**：数据向量 `x` 通过通过神经网络并产生输出 `f(x)`。每一层的激活函数可以不同也可以相同，但最后一层除外，它根据模型和问题类型（分类或回归）控制输出类型。图\
    \ 4.20 展示了一个反向传播网络的示例。\n\n![图 4.20 反向传播架构。](img/fig4_20_B.jpg)\n"
- fmt: "\n## 2. Step 2: Backpropagation: using a gradient for all layers to update\
    \ the weights (using the error from the output of step 1 to update all the network\
    \ weights, from the last layer to the earlier ones). The final layer uses a chain\
    \ rule with a gradient to calculate new weights, and it continues to the first\
    \ layer (input layer (`w[1]`)).\n\n## 4.7.3 Single-Layer Perceptron\nIt was invented\
    \ in 1964 by Frank Rosenblatt at Cornell university. It is the simplest feedforward\
    \ neural network and does not contain any hidden layer. A single-layer perceptron\
    \ can only learn linear functions. [Figure 4.21](#ch4.xhtml#f4_21) shows its architecture.\n\
    \n![Figure 4.21 Single-layer perceptron.](images/fig4_21_B.jpg)\n\n[Figure 4.21\
    \ Single-layer perceptron.](#ch4.xhtml#R_f4_21)\n\n## 4.7.4 Multi-Layer Perceptron\
    \ (MLP)\nMLP has more than one hidden layer and is mostly used in classification\
    \ problems. It is used to learn nonlinear functions. There are three parts to\
    \ these networks: the input layer, hidden layer, and output layer ([Figure 4.22](#ch4.xhtml#f4_22)).\n\
    \n![Figure 4.22 Multi-layer perceptron.](images/fig4_22_B.jpg)\n\n[Figure 4.22\
    \ Multi-layer perceptron.](#ch4.xhtml#R_f4_22)\n\n### 4.7.4.1 MLP Example in TensorFlow\n\
    \n1. **Step 1: Import Libraries**\n```\nimport tensorflow as tf\nimport numpy\
    \ as np\nfrom tensorflow import keras\n```\n\n2. **Step 2: Load Data**\n```\n\
    from keras.datasets import mnist\n(x_train, y_train), (x_test, y_test) = mnist.load_data()\n\
    ```\n\n3. **Step 3: One Hot and Normalization Data**\n```\ny_train = tf.one_hot(y_train,\
    \ 10)\ny_test = tf.one_hot(y_test, 10)\nx_train = x_train / 255.0\nx_test = x_test\
    \ / 255.0\n```\n\n4. **Step 4: Making Model**\n```\nmodel = keras.Sequential([\n\
    \   keras.layers.Flatten(input_shape=(28, 28)),\n   keras.layers.Dense(128, activation='relu'),\n\
    \   keras.layers.Dropout(.2, input_shape=(2,)),\n   keras.layers.Dense(32, activation='relu'),\n\
    \   keras.layers.Dropout(.2, input_shape=(2,)),\n   keras.layers.Dense(10, activation='softmax')])\n\
    ```\n\n5. **Step 5: Model Summary**\n```\nmodel.summary()\nModel: \"sequential\"\
    \nLayer (type) Output Shape Param #\n====================================================\n\
    flatten_4 (Flatten) (None, 784) 0\n____________________________________________________\n\
    dense_12 (Dense) (None, 128) 100480\n____________________________________________________\n\
    dropout_5 (Dropout) (None, 128) 0\n____________________________________________________\n\
    dense_13 (Dense) (None, 32) 4128\n____________________________________________________\n\
    dropout_6 (Dropout) (None, 32) 0\n____________________________________________________\n\
    dense_14 (Dense) (None, 10) 330\n====================================================\n\
    Total params: 104,938\nTrainable params: 104,938\nNon-trainable params: 0\n```\n\
    \n6. **Step 6: Compile the Model**\n```\nmodel.compile(loss='categorical_crossentropy',\
    \ metrics=['accuracy'])\n```\n\n7. **Step 7: Train the Model**\n```\nn_val = 5000\n\
    n_train = 60000\nn_test = 10000\nbatch_size = 100\nepochs = 100\nsteps_per_epoch\
    \ = int((n_train-n_val)/batch_size\nvalidation_split = n_val/n_train\nvalidation_steps\
    \ = int(n_val / batch_size)\ntest_steps = int(n_test/batch_size)\nhistory = model.fit(x_train,\
    \ y_train, epochs=epochs, steps_per_epoch=steps_per_epoch, validation_split=validation_split,\
    \ validation_steps=validation_steps, callbacks=[tensorboard])\n```\n\n8. **Step\
    \ 8: Test the Model**\n```\nscore = model.evaluate(x_test, y_test, steps=test_steps,\
    \ verbose=0)\nprint('Test loss:', score[0])\nprint('Test accuracy:', score[1])\n\
    ```\n\n# Chapter 5 Deep Neural Networks (DNNs) Fundamentals and Architectures\n\
    \nDOI: [10.1201/978100302518](https://doi.org/10.1201/978100302518)\n\n## 5.1\
    \ Deep Neural Networks\nThere are some concepts that you should know you are working\
    \ with deep learning. This chapter reviews the DL models, concepts, and definitions.\n\
    \n### 5.1.1 What Is Deep Learning?\nDeep learning algorithms (a subset of artificial\
    \ neural networks (a subset of machine learning)) work with different data types.\
    \ It processes data through units (neurons) in different ordered sections (layers)\
    \ by using techniques in each layer (it imitates the human brain structure and\
    \ operations). A deep learning structure has several major parameters and hyperparameters\
    \ to change the learning features, like speed and accuracy. The word “deep” refers\
    \ to the number of layers (usually, DL architectures have several layers (mostly\
    \ large) to make it strong and robust to solve real-world problems), which helps\
    \ the network find more features of the data and help the network to train better.\n\
    \n### 5.1.2 Deep Learning Needs!\nDL algorithms need a large volume of data for\
    \ training, and the computation costs of making DL model is very high. By solving\
    \ these two challenges (large data and high computation cost), we can deploy DL\
    \ algorithms more efficiently.\n\n### 5.1.3 How to Deploy DL Efficiently?\nThere\
    \ are several important key points to choose and deploy DL architectures correctly\
    \ and accurately. However, after finding the first trained model, you can optimize\
