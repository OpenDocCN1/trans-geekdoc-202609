    \ = Dense(in_shape[0] * in_shape[1])(embedding_input)\n   embedding_input = Reshape((in_shape[0],\
    \ in_shape[1], 1))(embedding_input)\n   image_input = Input(shape = in_shape)\n\
    \   merge = Concatenate()([image_input, embedding_input])\n   feature_extractor\
