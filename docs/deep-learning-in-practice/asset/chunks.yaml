  raw: "Let us see how to deploy deep learning for emotion recognition using audio\
    \ (speech) data. The output of this step transfers to the next step for sentiment\
    \ analysis. It would help when you do some preprocessing on the data and then\
    \ create an initial trained model. After importing the necessary libraries, there\
    \ are five major steps for creating architecture:\n\n1.  dataset collection,\n\
    \n2.  data preprocessing,\n\n3.  model training,\n\n4.  model evaluation, and\n\
    \n5.  evaluate the trained model.\n\n### 7.3.1 Dataset Collection\n\nThere are\
    \ several verified datasets like the RAVDESS (audiovisual dataset). However, if\
    \ you plan to run a specific project, it is better to collect your own dataset.\
    \ Depending on the output and the features you plan to classify (your data should\
    \ have those features), you can decide about the data collection type. For example,\
    \ there are some criteria like 3D data or indoor and outdoor data for the image\
    \ (this step extracts the data values). For instance, in the RAVDESS dataset ([Figure\
    \ 7.9](#ch7.xhtml#f7_9)), the values are path, actor, gender, intensity, repetition,\
    \ and emotion states. Here the basic emotion states are happiness, sadness, disgust,\
    \ anger, calm, fear, surprise, and neutral.\n\n```\ndata_df = pd.DataFrame (columns\
    \ = &[apos;path', 'src', 'actor', 'gender','intensity', 'statement', 'repetition',\
    \ 'emotion'])\ncount = 0\nfor i in dir_list1:\n file_list = os.listdir('path'\
    \ + i)\n for f in file_list:\n nm = f.split('.')[0].split('-')\n path = ‘path’\
    \ + i + '/' + f\n if int(actor)%2 == 0:\n gender = \"female\"\n else:\n gender\
    \ = \"male\"\n src = int(nm[1])\n emotion = int(nm[2])\n if nm[3] == '01':\n intensity\
    \ = 0\n else:\n intensity = 1\n if nm[4] == '01':\n statement = 0\n else:\n statement\
    \ = 1\n if nm[5] == '01':\n repeat = 0\nelse:\n repeat = 1\n actor = int(nm[6])\n\
    data_df.loc[count] = [path, src, actor, gender, intensity, statement, repeat,\
    \ emotion]\n count += 1\n```\n\n![Figure 7.9. RAVDESS dataset data sample.](images/fig7_9a_B.jpg)\n\
    \n[Figure 7.9. RAVDESS dataset data sample.](#ch7.xhtml#R_f7_9)\n\n### 7.3.2 Data\
    \ Preprocessing\n\nIn this step, do some preprocessing on the data to make data\
    \ ready for training. It may include data cleaning, feature extraction, labeling,\
    \ and data augmenting.\n\n#### 7.3.2.1 Labeling\n\nIf the data are from databases,\
    \ they are usually annotated and if you plan to collect your data, you should\
    \ label them. The labeling is depending on the type of the problem and the feature\
    \ you would like to classify. For example, in this project, the labels are male\
    \ or females, positive or negative, and there are seven different emotion states:\n\
    \n```\nlabel_list = []\nfor i in range(len(data_df)):\n if data_df.emotion[i]\
    \ == 1:\n lb = \"_neutral\"\n elif data_df.emotion[i] == 2:\n lb = \"_calm\"\n\
    \ elif data_df.emotion[i] == 3:\n lb = \"_happy\"\n elif data_df.emotion[i] ==\
    \ 4:\n lb = \"_sad\"\n elif data_df.emotion[i] == 5:\n lb = \"_angry\"\n elif\
    \ data_df.emotion[i] == 6:\n lb = \"_fearful\"\n elif data_df.emotion[i] == 7:\n\
    \ lb = \"_disgust\"\n elif data_df.emotion[i] == 8:\n lb = \"_surprised\"\n else:\n\
    \ lb = \"_none\"\n label_list.append(data_df.gender[i] + lb)\n```\n\n### 7.3.3\
    \ Feature Extraction\n\nFor training, extract some audio features that make the\
    \ differences between sounds. The raw data in audio are in the time domain, and\
    \ with some functions like FFT, you can transfer them to the frequency domain.\
    \ The audio signals have some features like frequency (frequency domain), mel-frequency\
    \ cepstrum (MFC), or mel-frequency cepstral coefficients (MFCCs) (texture of the\
    \ sound), which you can extract them to use as a feature vector for training.\
    \ Standard libraries like librosa help you to do some signal analysis, like loading\
    \ the data and finding a sample rate:\n\n```\ndata = pd.DataFrame(columns=&[apos;feature'])\n\
    for i in tqdm(range(len(data_df))):\n X, sample_rate = librosa.load(data_df.path[i],\
    \ res_type = 'kaiser_fast',duration = input_duration,sr = 22050*2, offset = 0.5)\n\
    \ sample_rate = np.array(sample_rate)\n mfccs = np.mean(librosa.feature.mfcc(y\
    \ = X, sr = sample_rate, n_mfcc = 13), axis = 0)\n feature = mfccs\n data.loc[i]\
    \ = [feature]\n```\n\n#### 7.3.3.1 Data Augmentation\n\nIn deep learning, you\
    \ need a large amount of data to train the model (there are always some limitations\
    \ for data). You can use data augmentation techniques to generate new data and\
    \ increase the database size. Here for the audio signals, you can do some tasks\
    \ like adding noise, shifting time using NumPy, changing pitch, and changing speed\
    \ using Librosa.\n\n```\ndef noise(data)\n noise_amp = 0.005*np.random.uniform()*np.amax(data)\n\
    \ data = data.astype('float64') + noise_amp * np.random.normal(size = data.shape[0])\n\
    \ return data\ndef shift(data):\n s_range = int(np.random.uniform(low = -5, high\
    \ = 5)*500)\n return np.roll(data, s_range)\ndef speedNpitch(data):\n length_change\
    \ = np.random.uniform(low = 0.8, high = 1)\n speed_fac = 1.0 / length_change\n\
    tmp = np.interp(np.arange(0,len(data),speed_fac),np.arange(0,len(data)),data)\n\
    \ minlen = min(data.shape[0], tmp.shape[0])\n data *= 0\n data[0:minlen] = tmp[0:minlen]\n\
    \ return data\n```\n\n### 7.3.4 Model Training\n\nIn this step, you can define\
    \ the model and optimizer, for CNN model. Now you can train the model with a part\
    \ of the dataset (training data about 70 to 80 percent of the original dataset):\n\
    \n```\nmodel = Sequential()\nmodel.add(Conv1D(256, 5, padding = 'same',input_shape\
    \ = (X_train.shape[1],1)))\nmodel.add(Activation('relu'))\nmodel.add(Conv1D(256,\
    \ 5, padding = 'same'))\nmodel.add(BatchNormalization())\nmodel.add(Activation('relu'))\n\
    model.add(Dropout(0.25))\nmodel.add(MaxPooling1D(pool_size = (8)))\nmodel.add(Conv1D(128,\
    \ 5, padding = 'same'))\nmodel.add(Activation('relu'))\nmodel.add(Conv1D(128,\
    \ 5, padding = 'same'))\nmodel.add(Activation('relu'))\nmodel.add(Conv1D(128,\
    \ 5, padding = 'same'))\nmodel.add(Activation('relu'))\nmodel.add(Conv1D(128,\
    \ 5, padding = 'same'))\nmodel.add(BatchNormalization())\nmodel.add(Activation('relu'))\n\
    model.add(Dropout(0.25))\nmodel.add(MaxPooling1D(pool_size = (8)))\nmodel.add(Conv1D(64,\
    \ 5, padding = 'same'))\nmodel.add(Activation('relu'))\nmodel.add(Conv1D(64, 5,\
    \ padding = 'same'))\nmodel.add(Activation('relu'))\nmodel.add(Flatten())\nmodel.add(Dense(14))\n\
    model.add(Activation('softmax'))\nopt = keras.optimizers.SGD(lr = 0.0001, momentum\
    \ = 0.0, decay = 0.0, nesterov = False)\n```\n\nand here is the model summary:"
