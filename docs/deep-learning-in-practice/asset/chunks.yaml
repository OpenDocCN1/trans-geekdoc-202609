    \n图 6.20 3000 次迭代后使用 CNN 的预测掩码。\n\n## 6.7 使用 CNN 进行目标识别\n\n目标识别是图像分析的一个领域，其目标是找到图像中的物体。人类可以轻松识别图像中的不同物体，但要让机器的准确率达到接受水平需要大量的努力。\n\
    \n### 6.7.1 导入库\n\n在这里，我们使用 python、NumPy、matplotlib 和 TensorFlow 库进行计算、可视化和网络建模。\n\
    \n```python\nfrom IPython import display\nfrom matplotlib import pyplot as plt\n\
    import numpy as np\nimport os\nimport pandas as pd\nfrom skimage.transform import\
    \ resize\nimport tarfile\nimport sys\nsys.path.append(\"..\")\nimport tensorflow\
    \ as tf\nfrom tensorflow import keras\nfrom tensorflow.keras import activations,\
    \ layers, losses, optimizers, regularizers\n```\n\n### 6.7.2 加载数据并生成数据集\n\n这里从一个链接加载数据集，然后设置数据数据的大小。\n\
    \n```python\nlfw_url = \"http://vis-www.cs.umass.edu/lfw/lfw-deepfunneled.tgz\"\
    \n```\n\n### 6.7.3 构建模型\n\n在此步中，我们通过添加层来创建模型。有两个函数：生成器（generator）和判别器（discriminator）。\n\
    \n#### 6.7.3.1 生成器函数\n\n现在，我们创建生成器：\n\n```python\nCODE_SIZE = 256\ndef generator():\n\
    \ model = keras.Sequential()\n model.add(layers.Input(shape=(CODE_SIZE,)))\n model.add(layers.Dense(1152))\n\
    \ model.add(layers.ReLU())\n model.add(layers.Reshape((6, 6, 32)))\n model.add(layers.Conv2DTranspose(64,\
    \ (3, 3), strides=2, padding='same', activation='relu'))\n model.add(layers.Conv2DTranspose(128,\
    \ (3, 3), strides=2, padding='same', activation='relu'))\n model.add(layers.Conv2DTranspose(32,\
    \ (3, 3), strides=2, padding='same', activation='relu'))\n model.add(layers.Conv2DTranspose(3,\
    \ (3, 3), strides=1, padding='same', activation='sigmoid'))\n return model\n```\n\
    \n#### 6.7.3.2 判别器函数\n\n现在，我们创建判别器：\n\n```python\ndef discriminator():\n model\
    \ = keras.Sequential()\n model.add(layers.Input(shape=IMAGE_SHAPE))\n model.add(layers.Conv2D(32,\
    \ (3, 3), strides=2, padding='same', activation='relu'))\n model.add(layers.MaxPool2D())\n\
    \ model.add(layers.Conv2D(64, (3, 3), strides=2, padding='same', activation='relu'))\n\
    \ model.add(layers.MaxPool2D())\n model.add(layers.Conv2D(128, (3, 3), strides=2,\
    \ padding='same', activation='relu'))\n model.add(layers.Flatten())\n model.add(layers.Dense(256,\
    \ activation='tanh'))\n model.add(layers.Dense(1, activation='sigmoid'))\n return\
    \ model\n```\n\n最后，你可以调用生成器并检查其摘要。\n\n```python\nkeras.backend.clear_session()\n\
    gen = generator()\ngen.summary()\nprint(\"Inputs :\", gen.inputs)\nprint(\"Outputs:\"\
    , gen.outputs)\nassert gen.output_shape[1:] == IMAGE_SHAPE, \"generator must output\
    \ an image of %s, but instead it produces %s\"%(IMAGE_SHAPE,gen.output_shape[1:])\n\
    ```\n\n"
