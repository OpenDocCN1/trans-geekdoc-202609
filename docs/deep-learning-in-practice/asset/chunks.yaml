  raw: 'The NN performance mostly depends on generalization potential that it helps
    generalize the model and gives it this ability to operate with new data. As ANNs,
    a DL network is better to cover generalization to increase the model flexibility.
    There are several methods like regularization to increase the generalization.


    ### 5.1.10 Regularization


    It is a method that, by doing some minor changes in the learning process, generalizes
    the model better and makes it more flexible. Some of the regularization methods
    are **L**[**1**], **L**[**2**], and dropout that we discuss in the next sections.


    ### 5.1.11 L[1] and L[2]


    These are the most popular kinds of regularization methods. Here, in general,
    we add a term to regularize (regularization term) and update the cost function.


    ```

    Cost function = Loss + Regularization term

    ```


    By increasing these values, the weight value will be decreased to make the model
    simpler and generalize the model better. There are two main terms as **L**[**1**]
    and **L**[**2**]**. L**[**2**] is:


    ```

    Cost function = Loss + Lambda/2m × ∑ ||w||2

    ```


    The lambda is the hyperparameter. **L**[**2**] is known as a weight decay method.
    It reduces the weights close to zero but not zero. Also, the **L**[**1**] is:


    ```

    Cost function = Loss + lambda/2m × ∑ ||w||

    ```


    Usually, we prefer **L**[**2**] to **L**[**1**], except when we plan to compress
    the model more (because in **L**[**1**], the weights may be reduced to zero).


    ### 5.1.12 Dropout


    Dropout works by masking (dropping) some nodes in the network in the training
    step (we will explain in more detail this concept later in this chapter).


    ### 5.1.13 End-to-End Learning


    Deep learning supports end-to-end learning that helps solves problems more efficiently.
    For example, recognizing the face using the traditional AI methods or artificial
    neural networks has some steps such as cropping, translation, detection, and recognition.
    However, when you are using deep learning, it does not need these steps, and the
    layers in the network extract the features from data automatically ([Chapter 7](#ch7.xhtml)
    provides an implementation example for face recognition by DL).


    ## 5.2 Deep Learning Applications


    Deep learning has the capability to model complicated real-world problems. Its
    algorithms are not used just for image and audio or some signal data classification.
    Deep learning algorithms are used in many applications like:


    *   self-driving cars,


    *   natural language processing,


    *   content analysis,


    *   visual recognition,


    *   fashion,


    *   chatbots,


    *   virtual agents,


    *   text generation,


    *   handwritten generation and machine translation,


    *   advertising, and


    *   fraud detection.


    There are many research and projects for deploying deep learning, from medical
    image analysis to drug discovery and genomes analysis. Also, based on the data
    nature and type of the problems, some real-world problems can be solved by deep
    learning; for example, performing real-time human behavior analysis, translating
    languages, and forecasting natural catastrophes. The autonomous vehicle is one
    of the hot topics that many large companies like google, apple, tesla, and uber
    invest in. The financial industry is another area that used deep learning for
    fraud detection of money transactions. It saved billions for financial and insurance
    institutes. By using some information like customer transactions and credit scores,
    systems classify and detect fraud ([Figure 5.1](#ch5.xhtml#f5_1)).


    ![Figure 5.1 There are several applications for deep learning techniques.](images/fig5_1_B.jpg)


    [Figure 5.1 There are several applications for deep learning techniques.](#ch5.xhtml#R_f5_1)


    These days we use several virtual assistance services like Alexa, Siri, and google
    assistance in our daily life. These products give you smart services like desired
    songs or restaurants and interact with you smartly and intelligently. They understand
    human language and provide you smart and autonomous responses. They also give
    you some services, like reading or writing your email and organizing your documents
    ([Figure 5.2](#ch5.xhtml#f5_2)).


    ![Figure 5.2 Healthcare is one of the new applications of deep learning.](images/fig5_2_B.jpg)


    [Figure 5.2 Healthcare is one of the new applications of deep learning.](#ch5.xhtml#R_f5_2)


    We review the implementation steps of a virtual assistant robot in [Chapter 7](#ch7.xhtml)
    ([Figure 5.3](#ch5.xhtml#f5_3)).


    ![Figure 5.3 Virtual assistant robots use deep learning methods.](images/fig5_3_B.jpg)


    [Figure 5.3 Virtual assistant robots use deep learning methods.](#ch5.xhtml#R_f5_3)


    ## 5.3 Deep Learning Algorithms and Architectures


    When we have a simple neural network with more than one hidden layer, we have
    deep neural networks (DNNs).


    [Figure 5.4](#ch5.xhtml#f5_4) shows an example of DNN. It has one input layer,
    one output layer, and four hidden layers. Here, we present an example for DNN
    with TensorFlow for the MNIST dataset. The input image size is 28**×**28, the
    hidden activation function is ReLU, and the output activation function is SoftMax.


    ```

    #MNIST Example

    #input data and setting the network parameters and hyper parameters

    input_data_shape = (28, 28)

    hidden_activation_function = ''relu''

    output_activation_function = ''softmax''

    # define the model

    dnn_Model = models.Sequential()

    # input layer

    dnn_model.add(ks.layers.Flatten(input_shape = input_data_shape, name = ''Input_layer''))

    # first hidden layer

    dnn_model.add(ks.layers.Dense(256, activation = hidden_activation_function, name
    = ''Hidden_layer_1''))

    # second hidden layer

    dnn_model.add(ks.layers.Dense(192, activation = hidden_activation_function, name
    = ''Hidden_layer_2''))

    # third hidden layer

    dnn_model.add(ks.layers.Dense(128, activation = hidden_activation_function, name
    = ''Hidden_layer_3''))

    # forth hidden layer

    dnn_model.add(ks.layers.Dense(64, activation = hidden_activation_function, name
    = ''Hidden_layer_4''))

    # output hidden layer

    dnn_model.add(ks.layers.Dense(10, activation = output_activation_function, name
    = ''Output_layer''))

    # model summary

    dnn_model.summary()

    ```


    ![Figure 5.4 DNN with four hidden layers.](images/fig5_4_B.jpg)


    [Figure 5.4 DNN with four hidden layers.](#ch5.xhtml#R_f5_4)


    ### 5.3.1 Convolutional Neural Networks (CNNs)


    CNN is one of the most popular deep learning algorithms with four main parts:


    *   convolution filters,


    *   pooling or subsampling,


    *   activation (transition) function, and


    *   fullyconnected layer.


    It shows promising results in visual classification problems. Its base is convolution
    functions (filters), in which each neuron will connect to the output of these
    filters as the receptive field. We will discuss more in detail about this type
    of deep learning algorithm in this chapter ([Figure 5.5](#ch5.xhtml#f5_5)).


    ![Figure 5.5 CNN looks for the features of the data for training.](images/fig5_5_B.jpg)


    [Figure 5.5 CNN looks for the features of the data for training.](#ch5.xhtml#R_f5_5)


    ### 5.3.2 Recurrent Neural Networks (RNNs)


    RNN is a neural network that usually is used for time series prediction problems.
    It uses stochastic gradient descent for training. RNNs process the data using
    feedforward and return the output values to the hidden and input layer through
    the backpropagation (storing past data and using them for forecasting).


    RNN has several applications, such as predicting an event based on the previous
    events and data (like the stock market data), and has two main types:


    *   bidirectional RNN, and


    *   deep RNN.


    RNN shares the same parameters for all layers. It does not work very well in long-term
    processing and cannot have intense layers. [Figure 5.6](#ch5.xhtml#f5_6) shows
    an RNN architecture and shows how the output layer has a connection with the hidden
    layer.


    ![Figure 5.6 RNN uses the features of previous layers.](images/fig5_6_B.jpg)


    [Figure 5.6 RNN uses the features of previous layers.](#ch5.xhtml#R_f5_6)


