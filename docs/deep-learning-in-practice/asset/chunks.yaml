    该层没有学习参数，但具有计算开销，可能会影响学习性能。因此，明智地选择池化层的大小并将其正确地放在架构中的合适位置可以提高性能。


    ## 6.2.2.4 全连接层 (FC)


    所有的输入和输出都有可分离的权重。因此，基于输入和输出加上偏置的权重数为：


    ```

    ((C × P) + 1 × C)

    ```


    当前层的神经元数量为 `C` 或输出 `(O)`，前一层的神经元数量为 `P` 或输入 `(I)`。每一层的输出为：


    ```

    input_size 减 (filter_size 减 1)

    ```


    例如，如果输入是一个图像且图像大小为 `28×28`，滤波器大小为 `3×3`，那么该层的输出为：


    ```

    (28 − (3 − 1)) = 26

    ```


    让我们来看一个通用的模型示例。如果输入是一个大小为 `28×28` 形状为 `28×28×1` 的图像，它没有参数。


    假设这些值为：


    ```

    stride=1,

    kernel_ size=3×3,

    第一层的滤波器数量 =32,

    那么参数的数量为：

    ((kernel_size) × stride + 1) × number of filters)

    C1: 3×3×1+1×32

    = 320

    ```


    在下一层中，我们已经从上一层获得了 32 个学习到的滤波器，那么可训练参数的数量为：


    $$\begin{array}{l} {C\_{2}:3\\mspace{9mu} \times \\mspace{9mu} 3\\mspace{9mu}
    \times \\mspace{9mu} 32\\mspace{9mu} + \\mspace{9mu} 1\\mspace{9mu} \times \\mspace{9mu}
    32\\mspace{9mu} = \\mspace{9mu} 9,248} \\\\ {C\_{3}:3\\mspace{9mu} \times \\mspace{9mu}
    3\\mspace{9mu} \times \\mspace{9mu} 32\\mspace{9mu} + \\mspace{9mu} 1\\mspace{9mu}
    \times \\mspace{9mu} 64\\mspace{9mu} = \\mspace{9mu} 18,496} \\\\ \\end{array}$$


    <img src="images/eqni6\_1.jpg"/>


    以此此类推。总参数是所有这些值的总和。例如，在这三层中，有 28,064 个参数：


    ```

    C1 + C2 + C3 = 320 + 9,248 + 18,496 = 28,064

    ```


    计算网络参数的数量是验证良好网络架构的一部分。使用摘要构建模型后，你可以在 `TensorFlow` 中详细检查每一层的参数数量。我们计划回顾最流行的 CNN
    架构类型。如前所述，你可以从零开始创建架构，然后将你的结果与这些常见架构进行比较，并选择最好的。


    ### 6.2.3 Imagenet 挑战


    自 2010 年以来，一项名为 `ImageNet 大规模视觉识别挑战` (`ILSVRC`) 的竞赛被设计用于测试不同的算法。首次分类率为 25%，最佳成绩属于
    `AlexNet`，它实现了 10% 的错误率（然而，最近的先进算法显示了更好的结果）。此外，还有一个包含超过 1400 万张图像的视觉数据库，人们用它比较自己的结果。


    ### 6.2.4 CNN 架构


    本节介绍了一些最流行的 CNN 算法。有几种性能不同的架构。这些架构之间最显著的区别在于：


    * 层数

    * 每层中的元素

    * 层之间的连接


    这三个参数定义了你的模型，并包含了网络参数和超参数。


    #### 6.2.4.1 LeNet-5 (1998)


    该网络是 1998 年提出的最简单的深度神经网络之一，共有七层：


    * 两个卷积层

    * 三个全连接层

    * 两个池化层


    它的第一个应用是手写识别（`3+2=7` 层），它大约有 6,000 个参数（`6×32=6,144`）。`图 6.8` 详细展示了它的架构。让我们进一步讨论它的滤波器和参数。如果
    `stride` 为 1，总参数为：


    ```

    (n + 2p − f)/s + 1 × (n + 2p − f)/s + 1 × Nc

    ```


    其中：


    * `Nc`: 是通道数（用于卷积的滤波器数量）

    * `p`: 填充（LeNet-5 中没有填充）

    * `s`: 步长


    ![图 6.8 LeNet5 架构。](img/fig6_8.jpg)


    那么参数的数量为：


    $$\begin{array}{l} \left. \left( {32 + 0 - 5} \right)/1 + 1 \times \left( {32
    + 0 - 5} \right)/1 + 1 \times 6 \right. \\ {= 28 \times 28 \times 6 = 4,704} \\
    \end{array}$$


    <img src="images/eqni6\_2.jpg"/>


    #### 6.2.4.2 AlexNet (2012)


    Alex 是在 ImageNet 中提出的第一个并在 2012 年赢得该比赛的深度学习方法之一。你可以在 `图 6.9` 中看到它的 DL 架构。它的架构类似于
    `LeNet`，但层更多（更深）。


    他们提出了丢弃（dropout）技术来降低计算开销，并与其他方法相比取得了更好的结果。他们还在方法中使用了 `ReLU` 来提高性能。他们使用了最大池化层来使方法运行更快。它的架构有八层，包括：


    * 五个卷积层

    * 三个具有 6000 万个参数的全连接层

    * `ReLU`


    ![图 6.9 AlexNet 网络架构。](img/fig6_9.jpg)


    #### 6.2.4.3 GoogleNet/Inception-v1 (2014)


    GoogleNet 是一个总共 22 层的 CNN。提供了预训练版本，你可以下载并使用。`图 6.10` 展示了它的架构。


    ![图 6.10 GoogleNet。](img/fig6_10.jpg)


    它以少于 7% 的错误率获得了 ILSVRC 2014。它的架构使用了诸如批归一化等技术将参数减少到 400 万到 500 万。此外，它包含了一些 `inception`（来自下一个版本）模块，每层包含并行卷积滤波器。如
    `图 6.10` 所示，它的网络非常深，准确率更高，但计算开销更高。


    #### 6.2.4.4 VGGNet-16 (2014)


    VGGNet-16 是一种 2014 年提出的 CNN，其架构包含 16 层。它在 ImageNet 测试图像上实现了 92.7% 的准确率。它是通过替换大卷积滤波器对
    `AlexNet` 的改进。它的训练非常慢，权重很大。它已被用于许多图像分类问题并显示了非常的结果。你可以使用当前的深度学习平台如 `TensorFlow`、`Keras`
    或 `Pytorch` 实现它。`图 6.11` 展示了它的架构。它的架构包括：


    * 13 个卷积层

    * 三个全连接层


    它有 1.3 亿个参数，占用 500 MB 空间（提高性能最简单的方法可能是增加层数）。


    ![图 6.11 VGGNet-16 网络。](img/fig6_11.jpg)


    #### 6.2.4.5 Inception-v3 (2015)


    它是 `Inception-v1` 的下一代（在 `Inception-v2` 在对损失函数进行微调并使用批归一化等其他技术之后）。它有 2400 万个参数，是一种用于图像分析和物体分类的
    CNN。由 Google 在 2015 年提出，并在 ImageNet 数据集上显示了非常的结果。`图 6.12` 展示了它的架构，是 Google 提出的第一个算法的第三个版本。


