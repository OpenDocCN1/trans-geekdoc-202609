    \ 中的神经元单元连接到自身。\n\n### 5.5.2 长短期记忆 (LSTM)\n\nRNN 在迭代一个节点时遇到的挑战之一是权重变小，导致梯度消失。此外，短期记忆是另一个挑战：\n\
