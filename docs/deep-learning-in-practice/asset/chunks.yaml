    ..\")\nimport tensorflow as tf\nfrom tensorflow import keras\nfrom tensorflow.keras\
    \ import activations, layers, losses, optimizers, regularizers\n```\n\n### 6.7.2\
    \ Load the Data and Generate a Dataset\n\nHere load the dataset from a link and\
    \ then set the size of the data in the dataset.\n\n```python\nlfw_url = \"http://vis-www.cs.umass.edu/lfw/lfw-deepfunneled.tgz\"\
    \n```\n\n### 6.7.3 Make the Model\n\nIn this step, we create the model by adding\
    \ layers. There are two functions: the generator and discriminator.\n\n#### 6.7.3.1\
    \ Generator Function\n\nNow, we create the generator:\n\n```python\nCODE_SIZE\
    \ = 256\ndef generator():\n model = keras.Sequential()\n model.add(layers.Input(shape=(CODE_SIZE,)))\n\
    \ model.add(layers.Dense(1152))\n model.add(layers.ReLU())\n model.add(layers.Reshape((6,\
    \ 6, 32)))\n model.add(layers.Conv2DTranspose(64, (3, 3), strides=2, padding='same',\
    \ activation='relu'))\n model.add(layers.Conv2DTranspose(128, (3, 3), strides=2,\
    \ padding='same', activation='relu'))\n model.add(layers.Conv2DTranspose(32, (3,\
    \ 3), strides=2, padding='same', activation='relu'))\n model.add(layers.Conv2DTranspose(3,\
    \ (3, 3), strides=1, padding='same', activation='sigmoid'))\n return model\n```\n\
    \n#### 6.7.3.2 Discriminator Function\n\nNow, we create the discriminator:\n\n\
    ```python\ndef discriminator():\n model = keras.Sequential()\n model.add(layers.Input(shape=IMAGE_SHAPE))\n\
    \ model.add(layers.Conv2D(32, (3, 3), strides=2, padding='same', activation='relu'))\n\
    \ model.add(layers.MaxPool2D())\n model.add(layers.Conv2D(64, (3, 3), strides=2,\
    \ padding='same', activation='relu'))\n model.add(layers.MaxPool2D())\n model.add(layers.Conv2D(128,\
    \ (3, 3), strides=2, padding='same', activation='relu'))\n model.add(layers.Flatten())\n\
    \ model.add(layers.Dense(256, activation='tanh'))\n model.add(layers.Dense(1,\
    \ activation='sigmoid'))\n return model\n```\n\nFinally, you can call the generator\
    \ and check its summary.\n\n```python\nkeras.backend.clear_session()\ngen = generator()\n\
    gen.summary()\nprint(\"Inputs :\", gen.inputs)\nprint(\"Outputs:\", gen.outputs)\n\
    assert gen.output_shape[1:] == IMAGE_SHAPE, \"generator must output an image of\
    \ %s, but instead it produces %s\"%(IMAGE_SHAPE,gen.output_shape[1:])\n\n"
