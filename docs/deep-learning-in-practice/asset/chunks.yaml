    \ = 64\ninput_dim = 28\nunits = 64\noutput_size = 10\ndef build_model(allow_cudnn_kernel=True):\n\
    \   if allow_cudnn_kernel:\n   lstm:layer = keras.layers.LSTM(units, input_shape=(None,\
