    \n[Figure 5.7 LSTM is a type of RNNs that uses backpropagation and has memory.](#ch5.xhtml#R_f5_7)\n\
    \n### 5.3.4 Generative Adversarial Networks (GANs)\n\nGAN is an unsupervised learning\
    \ algorithm that generates new data by self-learning. Its algorithm has two modules:\
    \ the first one is the generator, which generates a new sample, and the second\
    \ one is a discriminator to classify original from new data (fake data) (these\
    \ two modules compete with each other).\n\nThese models use different loss functions\
    \ (its computation is very high), and if one of them fails, the whole network\
    \ fails. The generator and discriminator weights can be updated through iterations.\
    \ [Figure 5.8](#ch5.xhtml#f5_8) shows a general structure of the GAN networks.\n\
    \n![Figure 5.8 GAN networks architecture.](images/fig5_8_B.jpg)\n\n[Figure 5.8\
    \ GAN networks architecture.](#ch5.xhtml#R_f5_8)\n\n### 5.3.5 Residual Neural\
    \ Network Learning (ResNets)\n\nResNet is used for some complicated problems that\
    \ other methods like CNNs do not work probably. It has several residual modules\
    \ (layers) that these layers have several functions to operate on input data.\
    \ In comparison to RNNs, it is more accurate and lighter. [Figures 5.9](#ch5.xhtml#f5_9)\
    \ and [Figure 5.10](#ch5.xhtml#f5_10) show the regular networks and ResNet networks\
    \ architecture. You can see how these two networks are different.\n\n![Figure\
    \ 5.9 Regular networks architecture.](images/fig5_9_B.jpg)\n\n[Figure 5.9 Regular\
    \ networks architecture.](#ch5.xhtml#R_f5_9)\n\n![Figure 5.10 ResNet networks\
    \ architecture.](images/fig5_10_B.jpg)\n\n[Figure 5.10 ResNet networks architecture.](#ch5.xhtml#R_f5_10)\n\
    \n## 5.4 Convolutional Neural Networks (CNNs)\n\n### 5.4.1 CNN Layers\n\n####\
    \ 5.4.1.1 Convolution Layers\n\nThe main part of a CNN is convolution layers.\
    \ When a convolution function processes and moves over the whole data matrix (for\
    \ example, an image), the output is convolved (filtered). A stride is a value\
    \ (specific slide) that each time the convolution function moves. For example,\
    \ stride 2 means the convolution window moves two elements (here it is a pixel)\
    \ along right or bottom (default is moving from left to right and top to bottom).\
    \ CNN does filter by using kernels (same size as convolution windows) and multiplying\
    \ the image pixel values in windows by kernel values. To create a CNN, you should\
    \ know and determine the number of filters, kernel size, and strides.\n\nIf the\
    \ kernel filter size is 4×4=16, then each neuron (has one bias plus 16 weights)\
    \ connects to the receptive field. It can have several convolutions layers, which\
    \ outputs are feature maps. [Figure 5.11](#ch5.xhtml#f5_11) shows how a 3×3 filter\
    \ works. It moves over the original input image, and its values multiply by the\
    \ masked part of the image’s values. For example, here, the convolution output\
    \ for the first output is -2. Also, [Figure 5.12](#ch5.xhtml#f5_12) shows the\
    \ final output of an original image. You can see the outputs of the filters in\
    \ each layer.\n\n![Figure 5.11 Convolving by 3×3 filter.](images/fig5_11_B.jpg)\n\
    \n[Figure 5.11 Convolving by 3×3 filter.](#ch5.xhtml#R_f5_11)\n\n![Figure 5.12\
    \ The outputs of filters.](images/fig5_12_B.jpg)\n\n[Figure 5.12 The outputs of\
    \ filters.](#ch5.xhtml#R_f5_12)\n\n#### 5.4.1.2 Pooling Layers\n\nCNNs also have\
    \ pooling (ex. max-pooling, min pooling, and average pooling) layers to find subregions\
    \ and decrease computational time ([Figure 5.13](#ch5.xhtml#f5_13)).\n\n![Figure\
    \ 5.13 Max pooling.](images/fig5_13_B.jpg)\n\n[Figure 5.13 Max pooling.](#ch5.xhtml#R_f5_13)\n\
    \nThe pooling layer functionality depends on the size of the pooling windows and\
    \ the type of pooling. It operates on the convolution outputs to reduce the size\
    \ for less operation in the next step.\n\n#### 5.4.1.3 Dropout\n\nIt helps networks\
    \ to memorize and generalize networks for using in different applications. Sometimes\
    \ removing some neurons, by maintaining the generalization besides keeping the\
    \ patterns, helps the network performance. These nodes can be removed by making\
    \ them off. For this purpose, one of the popular ways is to make a random matrix\
    \ of zero and multiply it by the nodes’ values to make them off or on ([Figure\
    \ 5.14](#ch5.xhtml#f5_14)).\n\n![Figure 5.14 Dropout example.](images/fig5_14_B.jpg)\n\
    \n[Figure 5.14 Dropout example.](#ch5.xhtml#R_f5_14)\n\nRandom dropout does not\
    \ change the weights, and it does mask over the network to drop some nodes. Also,\
    \ it is used during the training step.\n\n#### 5.4.1.4 Batch Normalization\n\n\
    Normalization techniques are using to make machine learning algorithms more generalized\
    \ to new sample data. For example, if data have a normal distribution, then centroid\
    \ the data by subtracting from the mean, and then dividing the result by standard\
    \ deviation is normalization. Batch normalization is a method that helps to have\
    \ a deeper network. In batch normalization, the features are normalized by feeding\
    \ to the batch normalization layer. In general, it has a significant effect on\
    \ improving training and convergence of speed. However, it is based on the batch’s\
    \ dimension, which leads to a strong dependence on the batch size setting. The\
    \ deep network data is in a four-dimensional (4D) vector (N, C, H, W) order, where\
    \ **N** is the batch axis, **C** is the channel axis, **H** and **W** are the\
    \ spatial height and width axes ([Figure 5.15](#ch5.xhtml#f5_15)).\n\n![Figure\
    \ 5.15 Batch normalization vs. group normalization.](images/fig5_15_B.jpg)\n\n\
    [Figure 5.15 Batch normalization vs. group normalization.](#ch5.xhtml#R_f5_15)\n\
    \n#### 5.4.1.5 Fully Connected Layer\n\nFully connected layers are those layers\
    \ that all nodes in the current layer are connected to the next layer. In DL models,\
    \ the last few layers are fully connected to construct the output, usually a set\
    \ of probability values (for example, SoftMax activation). [Figure 5.16](#ch5.xhtml#f5_16)\
    \ shows the layers in CNN (the last fully connected layer is also the classification\
    \ layer).\n\n![Figure 5.16 Fully connected layer.](images/fig5_16_B.jpg)\n\n[Figure\
    \ 5.16 Fully connected layer.](#ch5.xhtml#R_f5_16)\n\n### 5.4.2 Design a CNN\n\
    \nHere we implement a LeNet5 architecture. Let us explain LeNet5. It has a sequence\
    \ of convolution and pooling layers. It has two fully connected layers and one\
    \ classifier layer. All other CNNs architecture has almost these implementation\
    \ steps. Let us go to the coding steps:\n\n1.  **Step 1:** In the first step,\
    \ you should determine the libraries you need for implementation and import them.\
    \ These libraries help you make your code more robust and accurate and make the\
    \ computation cost less.\n\n    ```\n    import TensorFlow as tf\n    import NumPy\
    \ as np\n    from tensorflow.examples.tutorials.mnist import input_data\n    ```\n\
    \n2.  **Step 2:** Setting up the number of samples for the training and testing\
    \ step and the image size and the number of classes.\n\n    ```\n    batch_size\
    \ = 128\n    test_size = 256\n    img_size = 28\n    num:classes = 10\n    # define\
    \ a placeholder for data and y for labels\n    X = tf.placeholder(\"float\", [None,\
    \ img_size, img_size, 1])\n    Y = tf.placeholder(\"float\", [None, num:classes])\n\
    \    ```\n\n3.  **Step 3:** Collecting data and creating training and testing\
    \ category."
