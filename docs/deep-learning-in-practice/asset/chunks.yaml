  trans: '


    如今以及在过去的几十年里，机器极大地帮助人类让生活更加舒适。人类总是想要解决的挑战之一是让机器更智能以更好地协助人类，研究人员正致力于这一目标，并试图找到让机器比以前更智能的方法。这些方法和研究包含了机器学习，它是计算机科学中近期受学术界和工业界人士关注的领域之一。在该领域已经发现并开发了许多算法和方法：一些传统的，如`支持向量机`
    (`SVM`) 或 `决策树` (`DT`)，以及一些新的，如`深度学习` (`DL`）。


    ## 1.3 什么是深度学习？


    人工智能的研究方法之一是模仿人类行为，例如人类通过学习来构建可以学习的系统。因此，该领域的研究人员试图找到并设计模仿人类学习的方法。为了这一目的，研究人员和工程师开始研究以理解机器如何通过学习来使其功能更加智能。`人工神经网络`
    (`ANN`）是这些尝试中最著名的例子。例如，感知机（最早的 `ANN` 方法之一）模仿了人类的神经网络形成和处理过程。它被用作一些高级 `ANN` 方法（如深度学习
    `DL`）的基础。


    `DL` 是近期先进的机器学习算法之一。它的方法在许多领域显示了迷人的结果，特别是在数据为图像和音频的应用中。它模拟了人类大脑的学习风格。它的之所以被称为“深度”，是因为它使用了若干层并部署了更多数据特征细节进行学习。它的结构总共包含三部分：输入层、输出层和隐藏层。输出取决于架构中的几个参数，如：每层神经元的组合、权重、偏置和激活函数。所有的学习过程步骤分为两个主要阶段：通过将数据转换为线性或非线性模型来寻找模型，然后改进模型。


    ## 1.4 关于本书！


    本书书回顾了 `DL` 算法的基础，并结合一些示例展示了主要的 `DL` 方法。它的设计目的是向你提供关于 `DL` 方法和算法的信息，并在最后介绍几个项目，帮助你学习并了解如何实现你的项目。我们在本书书中较少关注
    `DL` 的数学和理论部分，而是向你展示如何在现实项目中使用 `DL` 算法。本书适合那些想要在项目中开始使用 `DL` 的人。全书共有八章，涵盖了以下目标：


    ### 1.4.1 引言


    本章（当前章节）回顾了书的章节并对每章的内容进行了简要描述。


    ### 1.4.2 Python/NumPy


    `Python` 是最有趣的编程语言之一，拥有许多用于应用的库，并且容易学习。此外，`NumPy` 的某些特性（特别是针对数组和矩阵）使得计算更快、更简单。本书对这些工具进行了快速回顾，以帮助读者更好地理解项目。


    ### 1.4.3 TensorFlow 和 Keras 基础


    `TensorFlow` 是 Google 提供的著名的 `DL` 平台之一。本书对该平台进行了快速回顾，并通过一些示例学习如何定义 `tensors` 并简化实现。我们还通过示例快速回顾了
    `Keras`。


    ### 1.4.4 人工神经网络 (ANNs)


    为了学习，你应该了解 `ANNs` 的基础。我们回顾了一些 `ANNs` 并展示了相关架构。


    ### 1.4.5 深度神经网络 (DNNs)


    本章提供了 `DNNs` 的基础和架构。


    ### 1.4.6 用于图像和数据的深度网络


    本章提供了用于图像和数据的 `DL` 细节。


    ### 1.4.7 用于虚拟助手的深度网络


    本章提供了用于虚拟助手应用的 `DL`。


    ### 1.4.8 寻找最佳模型


    本章展示了如何寻找最佳模型。


    # 第 2 章 Python/NumPy 基础


    ## 2.1 变量


    `variable` 是存储数据的地方。它有一个名称来改变。语法如下：


    ```

    variable = expression

    ```


    有四种主要的变量类型：


    ### 2.1.1 Python 中的数据类型


    | 类型 | 示例 1 | 示例 2 | 示例 3 |

    | --- | --- | --- | --- |

    | 整数 | 30 | 0 | -10 |

    | 实数 | 3.14 | | |

    | 字符串 | “Hello” | | |

    | 布尔 | True | False | |


    变量命名基于以下规则：

    1. 只能包含数字、字母和下划线。

    2. 不能以数字开头。

    3. 区分大小写 (`caseSensitive`)。

    4. 使用驼峰命名法 (`camelCase`)。

    5. 永远不包含空格。

    6. 多个单词经常使用下划线。


    如果你不遵守这些规则，将会得到错误。在你的模块和项目中，变量名应该与其值具有某种意义。


    ### 2.1.2 关键字


    你不能使用关键字命名变量。然而，当解释器给你错误时，你可以记住这些单词并检查列表。


    表 2.2 Python 中的关键字


    | Python 保留关键字 |

    | --- |

    | and | as | assert | break | class | continue |

    | def | del | elif | else | except | exec |

    | finally | for | from | global | if | import |

    | in | is | lambda | nonlocal | not | or |

    | pass | raise | return | try | while | with |

    | yield | True | False | None |


    ### 2.1.3 运算符和操作数


    我们用于计算的特殊符号是运算符，它们作用的值是操作数。数据类型有几种操作操作如下：


    表 2.3 运算符及其操作


    | 运算符 | 描述 | 示例 | 结果为 |

    | --- | --- | --- | --- |

    | + | 加法 | 7 + 3 | 10 |

    | – | 减法 | 7–3 | 4 |

    | \* | 乘法 | 7 * 3 | 21 |

    | / | 除法（真） | 7 / 3 | 2.333333 |

    | // | 除法（整） | 7 // 3 | 2 |

    | % | 取模 | 7 % 3 | 1 |

    | \*\* | 幂 | 7 \*\* 3 | 343 |


