    方差 `(σ2)` 是误差的另一部分。方差是衡量数据中样本每个值离整个数据集平均值远程度的方法。通常情况下，在计算时，首先从每个样本值中减去平均值，然后将平方和除以整个数据中样本值的个数。在这里，我们将方差视为误差的一部分，如果方差很高，则意味着很大一部分误差是由此引起的，然后尝试寻找方法来它（图
    8.8）。有一些减少方差的方法，例如装袋法（bagging）或选择良好的数据集。`y¯(𝐱)` 是期望标签，`y(cX)` 是标签，`𝐱={x[1],…,o[n]}`
    和 `m` 是分类器的数量，`D[i]` 是数据集，而 `h[Di]` 是 `Di` 的训练分类器。详细查看公式：


    ![图 8.8 高方差改变了准确率。](img/fig8_8_B.jpg)


    图 8.8 高方差改变了准确率。


    `Variance` = `𝔼(h[D−h^−(X))²]`


    $$\\mathbb{E}\_{D}\leftlbrack \left( {h\_{D}\left( X \right) - h^{-}\left( X \right)}
    \right)^{2} \rightrbrack \approx 1/m\left( {\\sum\limits\_{i = 1:m}\left( {h\_{Dj}\left(
    X_{i} \right) - h^{-}\left( X_{i} \right)} \right)^{2}} \right)$$


    其中：


    $$h^{-}\left( X \right) \approx 1/m\left( {\\sum\limits\_{i = 1:m}h\_{Di}\left(
    X \right)} \right)$$


    `y^−(X)` = 1 * `p(y=1|X)` + 2 * `p(y=2|X)`


    ### 8.5.1 新数据集


    你可以更改数据集并找到不同的数据集，或者对数据进行更多预处理，如数据增强和其他处理。然后计算方差，检查新数据如何改变方差，并检查这种变化如何使训练后的模型更好（图
    8.9）。


    ![图 8.9 不同的数据集或进行数据增强等数据预处理可以改变方差。](img/fig8_9_B.jpg)


    图 8.9 不同的数据集或进行数据增强等数据预处理可以改变方差。


    ### 8.6 偏差/方差


    现在让我们看看偏差与方差之间的关系，以及它们的值如何接近目标。总之，偏差与方差的权衡有四种主要状态（`L: 低, B: 偏差, V: Variance, H:
    高`）。


    1. LB/LV

    2. HB/LV

    3. LB/HV

    4. HB/HV


    图 8.10 显示了这四种状态。问题是，噪声值是多少，它与这两个参数之间是什么关系？噪声是数据的一部分，正如第一步提到的，你可以对数据进行一些预处理以消除或减少噪声，然后检查特征或标签等其他原因，查看它们是否被正确选择并采取正确的行动。正如在图
    8.10 所示所示，最佳状态是 LB/LV（低偏差和低方差），此时值非常接近目标。


    ![图 8.10 偏差/方差的变化。](img/fig8_10_B.jpg)


    图 8.10 偏差/方差的变化。


    另一个问题是我们如何找到偏差和方差的最佳值？图 8.11 展示了偏差与方差之间的权衡以及它们与模型复杂性的关系。


    ![图 8.11 偏差/方差权衡。](img/fig8_11_B.jpg)


    图 8.11 偏差/方差权衡。


    这对应于最小总值，总值等于偏差和方差之和。虚线显示了最优模型复杂性的点。图 8.11 中的点是总误差的最佳值。因此，你可以在模型中找到偏差和方差值，然后找到总误差开始增加的点。


    根据之前的讨论，在找到偏差和方差值以及这两个值之间的关系后，如果方差或偏差很高，你应该根据数值采取适当的行动。


    图 8.12


    ![图 8.12.](img/fig8_12_B.jpg)


    图 8.12


    ### 8.7.1 高方差


    当数据分散时会发生高方差。当方差很高时，意味着很大一部分误差是由此引起的，然后尝试寻找方法减少它。有一些减少方差的方法，例如装袋法（bagging）或选择良好的数据集。


    ### 8.7.2 高偏差


    当偏差很高时，模型太简单，无法捕捉潜在模式。你可以通过增加模型复杂性或添加更多特征来解决这个问题。


