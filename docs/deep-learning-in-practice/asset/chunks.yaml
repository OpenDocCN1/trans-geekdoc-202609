    \ 6.17](#ch6.xhtml#f6_17)).\n\n![Figure 6.17 The CIFAR10 data.](images/fig6_17_B.jpg)\n\
    \n[Figure 6.17 The CIFAR10 data.](#ch6.xhtml#R_f6_17)\n\n```\n(train_images, train_labels),\
    \ (test_images, test_labels) = datasets.cifar10.load_data()\n# Normalize pixel\
    \ values to be between 0 and 1\ntrain_images, test_images = train_images / 255.0,\
    \ test_images / 255.0\nclass_names = &[apos;airplane', 'automobile', 'bird', 'cat',\
    \ 'deer','dog', 'frog', 'horse', 'ship', 'truck']\nplt.figure(figsize=(10,10))\n\
    for i in range(25):\n plt.subplot(5,5,i+1)\n plt.xticks([])\n plt.yticks([])\n\
    \ plt.grid(False)\n plt.imshow(train_images[i], cmap=plt.cm.binary)\n plt.xlabel(class_names[train_labels[i][0]])\n\
    plt.show()\n```\n\n### 6.5.3 Make the Model\n\nOur model has three convolution\
    \ layers, and we are using max-pooling and ReLU in this example for subsampling\
    \ and activation function.\n\n```\nmodel = models.Sequential()\nmodel.add(layers.Conv2D(32,\
    \ kernel_size=(3, 3), activation='relu', input_shape=(32, 32, 3)))\nmodel.add(layers.MaxPooling2D(pool_size=(2,\
    \ 2)))\nmodel.add(layers.Conv2D(64, kernel_size=(3, 3), activation='relu'))\n\
    model.add(layers.MaxPooling2D(pool_size=(2, 2)))\nmodel.add(layers.Conv2D(128,\
    \ kernel_size=(3, 3), activation='relu'))\nmodel.add(layers.MaxPooling2D(pool_size=(2,\
    \ 2)))\nmodel.add(layers.Dropout(0.2))\nmodel.add(layers.Flatten())\nmodel.add(layers.Dense(256,\
    \ activation='relu'))\nmodel.add(layers.Dense(128, activation='relu'))\nmodel.add(layers.Dense(10,\
    \ activation='softmax'))\nmodel.summary()\n```\n\nHere is the summary of the model\
