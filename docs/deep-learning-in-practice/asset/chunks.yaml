    \ (60000,)\nTest (10000, 28, 28) (10000,)\n```\n\n#### 5.6.2.2 Data Preprocessing\n\
    \nIn this step, you should do some processes on data like normalizing the data,\
    \ selecting the real data, generating random noise, and selecting the fake data.\n\
    \n1.  normalize the data which are between \\[0, 255\\] and \\[-1, 1\\]\n\n  \
    \  ```\n    def prepare_real_samples(samples):\n       prepared_samples = samples.astype('float32')\n\
    \       prepared_samples = (prepared_samples - 127.5) / 127.5\n       return prepared_samples\n\
    \    ```\n\n2.  selecting real samples\n\n    ```\n    def generate_real_batch(samples,\
    \ orig_labels, n_samples):\n       indices = np.random.randint(0, samples.shape[0],\
    \ n_samples)\n       batch_images = samples[indices]\n       batch_orig_labels\
    \ = orig_labels[indices]\n       batch_labels = np.full(n_samples, REAL_LABEL_VALUE)\n\
    \       return batch_images, batch_labels, batch_orig_labels.flatten()\n    ```\n\
    \n3.  generating random noise as input of the generator\n\n    ```\n    def generate_noise_vector(noise_dim,\
    \ n_samples, n_classes):\n       noise_vector = np.random.normal(size = (n_samples,\
    \ noise_dim))\n       return noise_vector, np.random.randint(0, n_classes, size\
    \ = n_samples)\n    ```\n\n4.  selecting fake samples\n\n    ```\n    def generate_fake_batch(generator,\
    \ noise_dim, n_classes, n_samples):\n       noise_vector, original_classes = generate_noise_vector(noise_dim,\
    \ n_samples, n_classes)\n       batch_images = generator.predict([noise_vector,\
    \ original_classes])\n       batch_labels = np.full(n_samples, FAKE_LABEL_VALUE)\n\
    \    return batch_images, batch_labels, original_classes\n    ```\n\n#### 5.6.2.3\
    \ Defining the Discriminator Model\n\nYou should define the discriminator in this\
    \ step.\n\n```\ndef create_discriminator(in_shape = (28, 28, 1), n_classes = 10,\
    \ label_smoothing = 0):\n   label_input = Input(shape = (1,))\n   embedding_input\
