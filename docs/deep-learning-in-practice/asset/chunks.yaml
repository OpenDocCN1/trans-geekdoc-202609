    \ [3], the target result is: 3\n```\n\n## 5.6 Generative Adversarial Network (GANs)\n\
    \nHere, we review the GAN definition, concepts, algorithm and implement an example\
    \ by GAN to learn how it works.\n\n### 5.6.1 What is a GAN?\n\nGenerative Adversarial\
    \ Network (GAN) is one of the most recent network architectures in deep learning\
    \ that; its concept and method give some new advantages in using deep learning\
    \ algorithms. There are several advantages to use GAN:\n\n- with limited data,\
    \ it generalizes well,\n- it creates some new scenes, and\n- it makes more realistic\
