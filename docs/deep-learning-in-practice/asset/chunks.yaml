    Variance `(σ2)` is another part of the error. Variance is a way to measure how
    far each value of the sample in the data is from the whole dataset’s mean value.
    In general, for its calculation, at first, subtract the mean from each of the
    sample values, then divide the sum of the squares by the number of sample values
    in the whole data. Here, we calculate the variance as a part of the error, and
    then if it is high, it means a big part of the error is because of it, and then
    try to find ways to reduce it ([Figure 8.8](#ch8.xhtml#f8_8)). There are some
    methods for reducing the variance, like bagging or choosing a good dataset. The
    `y¯(𝐱)` is the expected label, and `y(𝐱)` is the label, the `𝐱={x[1],…,o[n]}`
    and `m` is the number of classifiers, `D[i]` is a dataset, and `h[Di]` is `Di`’s
    trained classifier. Look at the formula in more detail:


    ![Figure 8.8 High variance changes the accuracy.](images/fig8_8_B.jpg)


    [Figure 8.8 High variance changes the accuracy.](#ch8.xhtml#R_f8_8)


    `Variance` = `𝔼[(h[D](X)−h^−(X))²]`


    $$\\mathbb{E}\_{D}\leftlbrack \left( {h\_{D}\left( X \right) - h^{-}\left( X \right)}
    \right)^{2} \rightrbrack \approx 1/m\left( {\\sum\limits\_{i = 1:m}\left( {h\_{Dj}\left(
    X_{i} \right) - h^{-}\left( X_{i} \right)} \right)^{2}} \right)$$


    Where:


    $$h^{-}\left( X \right) \approx 1/m\left( {\\sum\limits\_{i = 1:m}h\_{Di}\left(
    X \right)} \right)$$


    `y^−(X)` = 1 * `p(y=1|X)` + 2 * `p(y=2|X)`


    ### 8.5.1 New Dataset


    You can change your dataset and find a different dataset or do more preprocessing
    like data augmentation and other processes on your data. Then, calculate the variance,
    check how new data change the variance, and check how this change can make the
    trained model better ([Figure 8.9](#ch8.xhtml#f8_9)).


    ![Figure 8.9 Different datasets or doing data preprocessing like data augmentation
    can change the variance.](images/fig8_9_B.jpg)


    [Figure 8.9 Different datasets or doing data preprocessing like data augmentation
    can change the variance.](#ch8.xhtml#R_f8_9)


    ### 8.6 Bias/Variance


    Now let us see the relationship between bias and variance and how their values
    can be closed to the target. In total, there are four main states for the tradeoff
    between bias and variance `(L: Low, B: Bias, V: Variance, H: High)`.


    1. LB/LV

    2. HB/LV

    3. LB/HV

    4. HB/HV


    [Figure 8.10](#ch8.xhtml#f8_10) shows these four states. The question is, what
    is the noise value and its relations to these two parameters? Noises are a part
    of the data, and as mentioned in the first step, you can do some preprocessing
    on the data to remove or decrease the noise and then check some other reasons
    like the features or labels to see that they have been chosen correctly or not
    and do the right action. As you can see in [Figure 8.10](#ch8.xhtml#f8_10), the
    best state is LB/LV (Low Bias and Low Variance), that the values are very close
    to the target.


    ![Figure 8.10 Bias/Variance changes.](images/fig8_10_B.jpg)


    [Figure 8.10 Bias/Variance changes.](#ch8.xhtml#R_f8_10)


    Another question is how we can find the best values for bias and variance? [Figure
    8.11](#ch8.xhtml#f8_11) demonstrates the tradeoff between bias and variance and
    their relations to model complexity.


    ![Figure 8.11 Bias/Variance tradeoff.](images/fig8_11_B.jpg)


    [Figure 8.11 Bias/Variance tradeoff.](#ch8.xhtml#R_f8_11)


    It corresponds to minimizing the total value that is equal to the summation of
    bias and variance. The dotted vertical line shows the point for optimum model
    complexity. The point in Figure 8.11 is the best value for the total error. Thus,
    you can find the bias and variance values in your model and then find the point
    that the total error value starts to increase.


    ### 8.7 How Can We Find the Problems in a Model?


    Based on the previous discussion, after finding the bias and variance values and
    the relations between these two values, you should take the proper action based
    on values if the variance or the bias is high.


    [Figure 8.12](#ch8.xhtml#f8_12)


    ![Figure 8.12.](images/fig8_12_B.jpg)


    [Figure 8.12](#ch8.xhtml#R_f8_12)


    ### 8.7.1 High Variance


    High variance happens when the data are spread out. When the variance is high,
    it means a big part of the error is because of it, and then try to find ways to
    reduce it. There are some methods for reducing the variance, like bagging or choosing
    a good dataset.


    ### 8.7.2 High Bias


    When the bias is high, the model is too simple to capture the underlying patterns.
    You can address this by increasing model complexity or adding more features.

