- fmt: "\nIf in each layer some patterns exist, their outputs have a higher value,\
    \ and each layer outputs have less value if the patterns do not exist. The higher\
    \ values make the probability higher. For example, suppose we are working on a\
    \ facial recognition system; a layer looks for face segments like nose, lips,\
    \ eyes, and mouth patterns in their output. If the network finds more patterns,\
    \ then the probability goes higher for classifying the image as the face. On the\
    \ other hand, missing these patterns makes the probability of existing a face\
    \ on an image less. [Figure 6.4](#ch6.xhtml#f6_4) shows the different feature\
    \ maps extracted from the original images (eight feature maps). More layers and\
    \ more filters make more feature map and make the accuracy better (not always!).\n\
    \n![Figure 6.4 Different patterns in images.](images/fig6_4_B.jpg)\n\n[Figure\
    \ 6.4 Different patterns in images.](#ch6.xhtml#R_f6_4)\n\nThe DL methods for\
    \ image analysis applications have two main types supervised and unsupervised\
    \ learning. Also, we categorize the most popular DL applications in image analysis\
    \ based on these two types of learning methods:\n\n1. **supervised learning**\n\
    \    * object detection,\n    * image classification, and\n    * image segmentation.\n\
    2. **unsupervised learning**\n    * image generation\n\nThere are different algorithms\
    \ for these applications. [Table 6.1](#ch6.xhtml#t6_1) shows some of these methods\
    \ and algorithms.\n\n[Table 6.1 Most Popular DL Methods for Image Analysis](#ch6.xhtml#R_t6_1)\n\
    \n| Task || Model Architectures | Frameworks |\n| --- | --- | --- |\n| object\
    \ detection | R-FCN, Faster R-CNN | TensorFlow |\n| image classification | VGG,\
    \ Inception, ResNet | TensorFlow, PyTorch, Keras |\n| image segmentation | Generic\
    \ segmentation: DeepLab, PSPNetMedical image segmentation: U-Net, HyperDense-Netsegmentation:\
    \ Mask RCNN | TensorFlow, PyTorch |\n| image generation | DCGAN, CycleGAN, ProGAN,\
    \ BigGAN | \\- |\n\n### 6.2.1 Filter Parameters\n\nSome filter parameters like\
    \ size, type, and stride can be changed and affect the learning process and the\
    \ network’s performance. Here we review these parameters in more detail to learn\
    \ how they can change the network performance.\n\n#### 6.2.1.1 Number and Type\
    \ of the Filters\n\nAs we mentioned, the outputs of the filters are the feature\
    \ maps. Each filter is designed to extract and detect a specific pattern. For\
    \ example, some filters are for extracting the lines, and some of them are for\
    \ extracting the colors. The filters can be more customized, for example, extracting\
    \ vertical or horizontal lines. The type of filter (which extracts the features)\
    \ has a dependency on the problem and the kind of data. We can use as many filters\
    \ as possible in each layer, but the point is more filters in each layer, making\
    \ the classification more accurate (not always), but on the other side, it makes\
    \ the computation cost higher. There is not any rule of thumb that shows the relations\
    \ between the number of filters and performance. It is coming from the experiments,\
    \ and it can be different from one problem to another. You can find these numbers\
    \ for your architecture (based on your problem) by doing more tests. When you\
    \ start creating your architecture, you can start with basic network architecture\
    \ and then, by adding and changing the number and type of the filters, find the\
    \ best architecture for your problem. Please keep in mind that there are some\
    \ verified and well-known architectures in CNN that you can use for your problem.\
    \ For learning purposes, we suggest you target a problem and then create your\
    \ basic network and try to find its bottlenecks to make its performance better.\
    \ Now try the results with one of the popular trained CNN algorithms or pre-trained\
    \ networks and compare your results.\n\n#### 6.2.1.2 Filters Size\n\nThe size\
    \ of the filters can be small or large! The most popular size is `3×3`. By choosing\
    \ a larger size, finding larger patterns is possible (for keeping the output size\
    \ in each layer, you can pad the image with some zero value around it ([Figure\
    \ 6.5](#ch6.xhtml#f6_5))). For example, if we use `5×5` with the same stride,\
    \ it makes the computation cost higher because it should multiply with more pixels,\
    \ and it does not make the process faster when the stride is the same. Also, we\
    \ should keep the symmetry, and by choosing some even numbers like 2 and 4, it\
    \ does not cover the symmetry (for dividing the previous layer pixels over the\
    \ output pixel). On the other hand, in the last layer, some distortion across\
    \ the layer can happen. So, among these numbers for filter size (2, 3, 4, and\
    \ 5), the best value is 3.\n\n![Figure 6.5 Padding one around the image with zero\
    \ values.](images/fig6_5_B.jpg)\n\n[Figure 6.5 Padding one around the image with\
    \ zero values.](#ch6.xhtml#R_f6_5)\n\n#### 6.2.1.3 Stride and Padding Size\n\n\
    Stride is the value that filters move over the image in each processing step.\
    \ For example, if the stride is one, then the kernel window moves one pixel each\
    \ time (the stride values are integer and the minimum, and the most popular value\
    \ is one). The larger value for stride makes the output smaller (we discuss its\
    \ size more in the next section), and there are possibilities to lose some patterns\
    \ and information on data.\n\nAnother concept is padding, which is adding blank\
    \ pixels to the image frame. Padding increases the image size and prevents losing\
    \ information in the image frame when the kernel moves over the image. If you\
    \ choose the stride large, it may make the computation cost less, but it also\
    \ affects the filter performance. You can see how padding works in [Figure 6.5](#ch6.xhtml#f6_5).\n\
    \n### 6.2.2 Number of Parameters\n\nHere we review the number of parameters in\
    \ each layer and explain how many exist in each layer. We check the input, convolutional,\
    \ pooling, and fully connected layer.\n\n#### 6.2.2.1 Input Layer\n\nThere are\
    \ no parameters in this layer for learning. However, there are some discussions\
    \ about the input data and their size. Also, sometimes before passing the data\
    \ to the network, after preprocessing, you can add a dimension to the data to\
    \ make a tensor (matrix) for easier computation. [Figure 6.6](#ch6.xhtml#f6_6)\
    \ shows the main steps in converting an image to a vector. The feature vectors\
    \ are the value that the learning models deploy for training.\n\n![Figure 6.6\
    \ Input images to vector.](images/fig6_6_B.jpg)\n\n[Figure 6.6 Input images to\
    \ vector.](#ch6.xhtml#R_f6_6)\n\n#### 6.2.2.2 Convolutional Layer\n\nThere are\
    \ different convolutional layers in the CNN architectures. If `I` be the number\
    \ of input feature maps (previous layer filters) and `O` is the number of output\
    \ feature maps (current layer filters), and `n×m` is the filter size, then the\
    \ total number of parameters are:\n\n```\ntotal parameters = ((n × m × I) + 1)\
    \ × O\n```\n\n+1 is added because of the bias. For example: if `I =32` and `O=\
    \ 64` if the `n=3` and `m=3`, then the total parameters for one convolution layer\
    \ with these values are:\n\n```\n((3 × 3 × 32) + 1) × 64 = 18,496\n```\n\n[Figure\
    \ 6.7](#ch6.xhtml#f6_7) shows four different feature maps from four filters. You\
    \ can see how these four filters extract different feature maps and what the differences\
    \ are.\n\n![Figure 6.7 Four different filters on one image.](images/fig6_7_B.jpg)\n\
    \n[Figure 6.7 Four different filters on one image.](#ch6.xhtml#R_f6_7)\n\n####\
    \ 6.2.2.3 Pooling Layer\n"
