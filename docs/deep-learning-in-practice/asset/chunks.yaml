  trans: "\n\nKeras 是一个易于使用的 Python 库，它构建在 `TensorFlow` 等一些机器学习平台之上，用于创建深度学习模型。`CNN`\
    \ 和 `RNN` 模型易用且实现快速。`TensorFlow` 同时提供了低层和高层 API，而 `Keras` 提供了底层支持。它还有助于减少计算成本。在这里，我们将回顾\
    \ `Keras` 的一些基础知识和核心概念，并通过示例进行解释。你也可以访问 `Keras` 网站 ([`keras.io/`](https://keras.io))\
    \ 获取更多细节和示例。开始使用 `Keras` 的要求如下：\n\n1. Python 3.5 或更高版本\n2. 带有 `NumPy` 的 `SciPy`\n\
    3. `TensorFlow`\n4. 任意操作系统（Windows, Linux 或 Mac）\n\n### 3.6.1 创建虚拟环境\n\n创建虚拟环境有助于为不同的项目单独设置不同的安装包。例如，你可以在\
    \ `python3` 上安装它：\n\n```\npython3 -m venv kerasenv\n```\n\n### 3.6.2 激活环境\n\n\
    创建虚拟环境后，如果你想使用它，应该将其激活。\n\n* Linux/Mac\n\n```\n$ cd kerasvenv kerasvenv $ source\
    \ bin/activate\n```\n\n* Windows\n\n```\n.\\env\\Scripts\\activate\n```\n\n###\
    \ 3.6.3 Python 库\n\n你可能在项目中需要这些 Python 依赖，并可以使用 `pip` 或 `pip3` 进行安装。在这里，我们通过示例回顾这些要求，并安装和使用\
    \ `Keras` 及其库。\n\n* `Numpy`\n```\npip install numpy\n```\n\n* `Pandas`\n```\n\
    pip install pandas\n```\n\n* `Scikit-learn`\n```\npip install -U scikit-learn\n\
    ```\n\n* `Matplotlib`\n```\npip install matplotlib\n```\n\n* `Scipy`\n```\npip\
    \ install scipy\n```\n\n* `Seaborn`\n```\npip pip install seaborninstall -U scikit-learn\n\
    ```\n\n现在你可以安装 `Keras` 了\n\n```\npip install keras\n```\n\n如果你的系统中没有安装 `TensorFlow`，请安装它。\n\
    \n```\npip install TensorFlow\n```\n\n在完成项目的所有部分后，你可以退出环境。\n\n```\ndeactivate\n\
    ```\n\n请检查你的 Python 版本以及使用 `pip` 或 `pip3` 的要求。创建、激活和退出虚拟环境有助于你为不同的项目组织代码和模块。\n\
    \n### 3.6.4 可用模块\n\n当你计划使用 `Keras` 创建模型时，这些是 `Keras` 中你应该学习使用和设置的可用模块：\n\n* `Regularizes`：正则化器列表。\n\
    * `Constraints`：约束条件列表。\n* `Activations`：激活函数列表。\n* `Losses`：损失函数列表。\n* `Metrics`：指标函数列表。\n\
    * `Optimizers`：优化器函数列表。\n* `Callback`：回调函数列表。\n* `Text processing`：将文本转换为 `NumPy`\
    \ 数组的函数。\n* `Image processing`：将图像转换为 `NumPy` 的函数。\n* `Sequence processing`：从给定输入数据生成基于时间的数据函数。\n\
    * `Backend`：后端库的功能（如 `TensorFlow`）。\n* `Utilities`：深度学习中非常有用的工具函数。\n\n### 3.6.5\
    \ 导入库和模块\n\n这里是一些库、模块以及导入命令。请在你的电脑上尝试这些代码。\n\n* `NumPy`\n```\nImport numpy as\
    \ np\n```\n\n* `Keras model module`\n```\nfrom keras.models import Sequential\n\
    ```\n\n* `Keras core layers`\n```\nfrom keras.layers import Dense, Dropout, Activation,\
    \ Flatten\n```\n\n* `Keras CNN Layers`\n```\nfrom keras.layers import Convoluton2D,\
    \ MaxPooling2D\n```\n\n* `Utilities`\n```\nfrom keras.utils import np_utils\n\
    ```\n\n这些是在使用 `Keras` 时我们几乎在所有项目中都会使用的最重要的库。\n\n### 3.6.6 训练和预测模型\n\n导入库后，我们应该训练并测试模型。这里是我们在\
    \ `Keras` 中可以使用的一些模块。\n\n* `Compile`：\n    它用于配置\n    ```\n    model.compile(loss='mean_squared_error',\
    \ optimizer='sgd', metrics=['accuracy'])\n    ```\n\n* `Fit`：\n    用于训练。\n   \
    \ ```\n    model.fit(x_train, y_train, epochs=10, batch_size=32)\n    ```\n\n\
    * `Evaluate`：\n    用于。\n    ```\n    model.evaluate(x_test, y_test)\n    ```\n\
    \n* `Predict`：\n    用它。\n    ```\n    model.predict(x_test)\n    ```\n\n"
- fmt: "\nDefine the loss function, optimizer, and metric to compile and prepare the\
    \ model for training.\n\n```\nmodel.compile(loss = keras.losses.categorical_crossentropy,\
    \ optimizer = keras.optimizers.Adadelta(), metrics = ['accuracy'])\n```\n\n###\
    \ Step 6: Train the Model\n\nTrain the model using training data.\n\n```\nmodel.fit(\n\
    \ x_train, y_train,\n batch_size = 128,\n epochs = 12,\nverbose = 1,\n validation_data\
    \ = (x_test, y_test)\n)\n```\n\n### Step 7: Evaluate the Model\n\nEvaluate the\
    \ trained model using evaluation data to check the model.\n\n```\nscore = model.evaluate(x_test,\
    \ y_test, verbose = 0)\nprint('Test loss:', score[0])\nprint('Test accuracy:',\
    \ score[1])\n```\n\n### Step 8: Test the Model\n\nTest the evaluated model using\
    \ test data before using the model for real-world problem and data.\n\n```\npred\
    \ = model.predict(x_test)\npred = np.argmax(pred, axis = 1)[:5]\nlabel = np.argmax(y_test,axis\
    \ = 1)[:5]\nprint(pred)\nprint(label)\n```\n\n# Chapter 4 Artificial Neural Networks\
    \ (ANNs) Fundamentals and Architectures\n\nDOI: [10.1201/9781003025818-4](https://doi.org/10.1201/9781003025818-4)\n\
    \n## 4.1 Terminology\n\nHere, we review some terminologies that we use in [Chapters\
    \ 4](#ch4.xhtml)-8](#ch8.xhtml).\n\n### 4.1.1 Inputs\n\nThe learning algorithms\
    \ (here, NNs) use data for training the models. These data are input data, and\
    \ usually, we show them as a vector of data sample with `x`. A set of `x` vectors\
    \ gives us `X` as a matrix of inputs (`N`). Each vector sample `x` has `1…m` features\
    \ that are the data values of each vector. For example, suppose we have `N=1000`\
    \ apples, and each sample represents a vector of data `X = [x[1]=price x[2]=color\
    \ x[3]=shape]`. The `m` is the number of features in the vector data sample that\
    \ its value is `3`.\n\n### 4.1.2 Weights\n\nThe weights are the values that are\
    \ updated by the learning algorithms to train the model. Usually, each `w[ij]`\
    \ is the vector weights between two nodes (`i` and `j`). The set of weights gives\
    \ us a matrix that we show by `W`.\n\n### 4.1.3 Outputs\n\nThe learning algorithms\
    \ in the last step give us a set of data as outputs. We usually show these values\
    \ using `y` as a vector of output values `y[j]`, (`j =1…k`). For example, if the\
    \ outputs are `0` (apple) and `1` (non-apple), the `y` dimension is `k=2`, and\
    \ it is a classification problem.\n\n### 4.1.4 Targets\n\nThese are the values\
    \ that their dimension is the same as outputs (`k`), and we need them in supervised\
    \ learning. Moreover, they give us the correct values that the model should provide\
    \ as outputs (target).\n\n### 4.1.5 Activation Function\n\nWe use some mathematical\
    \ functions to let the input of each layer pass (make output) and, after reaching\
    \ a value more than threshold, go to the next layer. We discuss this concept in\
    \ detail.\n\n### 4.1.6 Error\n\nThe error is the difference between the output\
    \ value and the target. We show it with `E`, and the learning goal is to make\
    \ it small or as much as possible.\n\n### 4.1.7 Training, Testing, and Validation\
    \ Sets\n\nWe divide database into three main categories: training data to teach\
    \ the model, validation data to certify the model, and testing data to examine\
    \ the model.\n\n### 4.1.8 Overfitting\n\nWhen we train the model, we should care\
    \ about generalization. If we train the model lot and make it complicated, there\
    \ is a possibility that the model does not generalize well, then it cannot fit\
    \ the data correctly. We cannot use training data because we already used them\
    \ to train the model. We also need testing data for testing (we can use validation\
    \ data for this purpose).\n\n### 4.1.9 Underfitting\n\nUnderfitting is another\
    \ concept that is the opposite of overfitting, and happens when a learning model\
    \ cannot simulate the behavior and relationships between dataset’s values and\
    \ the target.\n\n![Figure 4.1 Underfitting(left), normal(middle), and overfitting(right).](images/fig4_1_B.jpg)\n\
    \n[Figure 4.1 Underfitting(left), normal(middle), and overfitting(right).](#ch4.xhtml#f4_1)\n\
    \n### 4.1.10 Confusion Matrix\n\nThere are several methods for finding the accuracy\
    \ of algorithms. The confusion matrix is the method that we can use for classification\
    \ problems. To find confusion matrix, you can create a square matrix that, on\
    \ horizontal and vertical directions, has both classes’ values. We can assume\
    \ the top of table as predicted values and the left-hand side as targets. For\
    \ example, the values at position `(i, j)` tell us the number of times output\
    \ predicted as class `j` when the target was `i`. Let me explain with an example\
    \ (if we have two classes, then we have 2×2 [Table 4.1](#ch4.xhtml#t4_1) as follows).\n\
    \n[Table 4.1 Confusion Matrix for Two Classes](#ch4.xhtml#R_t4_1)\n\n| | | |\n\
    | :--- | :--- | :--- |\n| **Targets** | **C1** | **C2** |\n| **C1** | 4 | 1 |\n\
    | **C2** | 2 | 7 |\n\nThe value of `t(1,1) =4` means four times that the output\
    \ predicted as class `C1` when the target was `C1`. For `t(2,1) =2`, when the\
    \ output was predicted two times as `C1`, the target was `C2`. Also, the value\
    \ of `t(1,2)=1` means one time that the output predicted as `C2` when the target\
    \ was `C1`. If you are looking for one number, you can sum the values leading\
    \ diagonal and divide it by the sum of all values. For example, here the value\
    \ is:\n\n```\nvalues leading diagonal= 4+7=11\nwhole values=4+1+2+7=14\n```\n\n\
    then we have:\n\n```\n11/14=.785\n```\n\nYou can multiply this number by 100 and\
    \ find a percentage:\n\n```\n.785×100=78.5 %\n```\n\n### 4.1.11 Accuracy Metrics\n\
    \nThere are four definitions as accuracy metrics that you should know:\n\n- **True\
    \ positive (TP)**: the observation that is correctly classified (for example,\
    \ to class 1). For instance, if the classification is based on the apple and not\
    \ apple, if the object is apple and classified as apple, it is `TP`.\n- **False\
    \ positive (FP)**: the observation is not correctly classified (for example, to\
    \ class 1). For instance, if the object is not apple and classified as apple,\
    \ it is `FP`.\n- **True negative (TN)**: the observation that correctly is not\
    \ classified (for example, to class 1). For instance, if the object is not an\
    \ apple and classified as not an apple, it is `TN`.\n- **False negative (FN)**:\
    \ the observation that mistake is not classified (for example, class 1). For instance,\
    \ if the object is not apple and is classified as apple, it is `FN` ([Table 4.2](#ch4.xhtml#t4_2)).\n\
    \n[Table 4.2 Accuracy Metrics](#ch4.xhtml#R_t4_2)\n\n| | Actual | |\n| :--- |\
    \ :--- | :--- |\n| **Predicted** | Positive | Negative |\n| Positive | TP | FP\
    \ |\n| Negative | FN | TN |\n\nThere are five definitions to find the accuracy\
    \ based on these four values:\n\n- `Accuracy = (TP+TN) / (TP+FP+TN+FN)`\n- `Sensitivity\
    \ = TP / (TP+FN)`\n- `Specificity = TN / (TN+FP)`\n- `Precision = TP / (TP+FP)`\n\
    - `Recall = TP / (TP+FN)`\n\nEach of these values shows different aspects of model\
    \ accuracy.\n\n### 4.1.12 Balanced and Unbalanced Datasets\n\nThe dataset is balanced\
    \ if the positive and negative examples have the same number in the dataset. We\
    \ usually assumed that the dataset is balanced, but in the real-world dataset,\
    \ they are not balanced (unbalanced datasets). For finding the accuracy in the\
    \ balanced dataset, we can calculate and use this value:\n"
