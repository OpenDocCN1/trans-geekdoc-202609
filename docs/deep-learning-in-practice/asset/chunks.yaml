    ## 6.3 General Strategy to Implement Model Using CNNs


    There are some common steps for making a model using DL that, at first, we review
    these steps. Now, you should think about the architecture that you plan to use
    in your model. We discussed the most popular CNN architectures in the previous
    lesson. Then, you can easily deploy all models using Keras, compare the results,
    and choose the proper architecture in your model. The model implementation using
    CNN has five steps:


    1.  **Step 1:** import libraries,


    2.  **Step 2:** load the data,


    3.  **Step 3:** define model,


    4.  **Step 4:** train the model, and


    5.  **Step 5:** test the model.


    ### 6.3.1 Import Libraries


    In any program, the first step is to import libraries to use their methods in
    our program. These libraries help us to do computing and plotting easier. For
    example, NumPy, panda, TensorFlow, and Keras are the most popular libraries used
    in DL modeling (here CNN) using python.


    ### 6.3.2 Load the Data and Create the Data Categories


    Here, at the first step, we create two folders for data type to process the data.
    Some preprocessing on the data can make computation costs less. For example, cropping
    (for removing unnecessary parts of the image) or changing contrast (to make the
    image quality better). If the problem is supervised learning, we need labeled
    data (like the dataset with cat and dog data and are already labeled).


    We can split the dataset into the training, validation, and testing data (there
    are some common ratios for data splitting percentage):


    *   70% train, 15% validation, and 15% test;


    *   80% train, 10% validation, and 10% test; and


    *   60% train, 20% validation, and 20% test.


    In the model implementation, we may check all these values and see the model’s
    performance.


    ### 6.3.3 Make the Model


    Choosing or defining the right model is very important. At first, we should decide
    about the type of architecture. It depends on the type of the problem and the
    nature of the data in the problem. In the next step, after choosing the right
    DL architecture, we should define the architecture parameters and hyperparameters.
    Some of them can be defined at the start of the design, like the number and the
    type of layers, and some of them, like learning rates, can be defined and fixed
    through the implementation.


    ### 6.3.4 Train the Model


    After designing the model, a part of the data (training data) should be used to
    train the first model. The key point in the training step is the number of data
    and iteration. The data and their features are very important in the training
    step. If we extract the correct feature and define the proper architecture, the
    model can be trained correctly and reasonably. One needs to get better results
    in DL is the need to a large amount of data in the case of a low volume of data;
    some methods like data augmentation can be used to generate data (data augmentation
    has shown its positive effect on the performance, even in case we have a large
    amount of data).


    ### 6.3.5 Test the Model


    Testing is one of the main steps in generating any final model. We test each module
    in the software production steps in the machine learning modeling and implementation
    steps (like other software production). After training the model and finding the
    first model, we should test it before using the trained model with the new real-world
    data. There are still two steps here, validation and testing. In the validation
    step, we check the model performance with a part of the original data (in the
    case we did not get our desire performance, modify the model), and in the end,
    test it with the test data.


    ## 6.4 Object Recognition Using CNNs


    Object recognition is one of the best examples of using CNN for a real-life problem.
    Before feeding data to the CNN, we should collect or choose the database and then
    do some preprocessing on data to prepare them and then use them for our learning
    algorithm. Also, we deploy several frameworks and libraries to define the CNN
    model.


    ### 6.4.1 Import Libraries


    Importing libraries, as the first step, helps us to make the computation easier.
    In this example, we use TensorFlow and Keras libraries to import.


    ```

    import numpy as np

    import pandas as pd

    import matplotlib.pyplot as plt

    from tensorflow.keras.utils import to_categorical

    from tensorflow.keras.models import Sequential

    from tensorflow.keras.layers import Dense,Conv2D,MaxPool2D,Flatten

    from tensorflow.keras.callbacks import EarlyStopping

    from sklearn.metrics import classification_report, confusion_matrix

    from PIL import Image

    import seaborn as sns

    ```


    ### 6.4.2 Load the Data and Generate a Dataset


    These are some available datasets. At first, load the dataset and split them into
    three parts (training, validation, and testing). These are the objects in the
    CIFAR10: airplane, automobile, bird, cat, deer, dog, frog, horse, ship, and truck
    ([Figure 6.15](#ch6.xhtml#f6_15)).


    ```

    (X_train, y_train), (X_test, y_test) = cifar10.load_data()

    y_cat_test = to_categorical(y_test, num:classes=10)

    y_cat_train = to_categorical(y_train, num:classes=10)

    ```


    ![Figure 6.15 The images on the dataset.](images/fig6_15_B.jpg)


    [Figure 6.15 The images on the dataset.](#ch6.xhtml#R_f6_15)


    One good coding practice and habit is to write some tests for each part of code
    to check code. You can also do some data visualization to see the data samples
    (to see some features like quality and distribution of data) and use some data
    augmentation methods to generate data variations, which may help train the model
    better and increase the accuracy.


    ### 6.4.3 Make the Model


    Now we can define the model architecture. We can add the convolution, pooling,
    ReLU, and SoftMax layers. In this example, there are two convolution layers, one
    Max pooling layer, one ReLU, and one SoftMax layer. The input size data are 32×32
    in three channels. The pooling windows size is 2**×**2.'
