    # 作者


    **Mehdi Ghayoumi 博士**是康奈尔大学的课程导师，圣地亚哥大学计算机科学兼任教授。在此之前，他是比明顿州立大学助理教授，媒体实验室的动态负责人。他曾是肯基州大学的讲师，并在
    2016 和 2017 年连续获得教学奖。


    Ghayoumi 博士的研究领域包括机器学习、机器视觉、机器人和人机交互。他的研究重点是构建现实系统，他的项目应用于人机交互、制造业、生物识别和医疗保健。


    他是多个会议、研讨会的技术委员会成员，以及机器学习、数学和机器人领域若干期刊的编辑成员，如 ICML、ICPR、HRI、FG、WACV、IROS、CIBCB
    和 JAI。他的研究论文发表在以下领域的会议和期刊上，包括人机交互（HRI）、机器人科学与系统（RSS）、机器学习与应用国际会议（ICMLA）等。


    # 第 1 章 引言


    DOI: [10.1201/9781003025818-1](https://doi.org/10.1201/9781003025818-1)


    ## 1.1 什么是学习？


    对于学习有几种定义，也许我们可以说：“学习是通过学习或经验获得知识或技能。”人类需要提升自己的社交和个人状况与条件。为了这个目的，人们在每一刻都面临决策局面。对于每个人来说，获取新知识和学习新技能有助于做出更好的决策，并帮助人们在个人和职业取得成功。有许多关于人类学习过程的研究。这些研究中最重要的部分是发现如何在机器中模拟学习，以及如何使其更准确、更有效。


    ## 1.2 什么是机器学习？


    '
- fmt: '

    Nowadays and through the last decades, machines help a lot to make human life
    more comfortable. One challenge that humans always like to solve is making machines
    smarter to assist humans better, and researchers are working on this goal and
    trying to find methods to make machines smarter than before. These methods and
    research are included in machine learning, as one of the areas in computer science
    that recently got the most interest from people who are working in the academy
    and industry. Many algorithms and methods have discovered and developed in this
    field: some traditional ones like `Support Vector Machine` (`SVM`) or `Decision
    Tree` (`DT`), and some new one like `Deep Learning` (`DL`).


    ## 1.3 What Is Deep Learning?


    One of the research methods in artificial intelligence is to imitate human behavior,
    like human learning to build systems that can learn. Therefore, the researchers
    in this field try to find methods and design algorithms that imitate human learning.
    For this purpose, researchers and engineers started to research to understand
    how machines can learn to make their functionalities smarter. `Artificial Neural
    Networks` (`ANN`s) are the most famous examples of these attempts. For instance,
    the perceptron (one of the first `ANN`s methods) imitates the human’s neural network
    formation and processes. It is used as the base of some advanced `ANN`s methods
    like deep learning (`DL`).


    `DL` is one of the recent and advanced machine learning algorithms. Its methods
    showed fascinating results in many areas, especially in the applications where
    their data are image and audio. It simulates the learning style in the human brain.
    Its name is deep because of using several layers and deploying more details of
    the data features for learning. Its structure in total has three parts: input,
    output, and hidden layers. The outputs depend on several parameters in architecture
    like: the neurons’ combination in each layer, weights, bias, and activation function.
    All the learning process steps occur in two main stages: finding a model by transforming
    data to a linear or nonlinear model and then improving the model.


    ## 1.4 About This Book!


    This book reviews the fundamentals of `DL` algorithms and presents the main `DL`
    methods with some examples. It has been designed to give you some information
    about the `DL` methods and algorithms and, in the end, presents several projects
    to help you learn and know how to implement your project. We have less focus on
    the math and the theory parts of `DL` in this book and show you how to use the
    `DL` algorithm in real-world projects. The book is suitable for people who would
    like to start using `DL` in their projects. The book has eight chapters to cover
    these goals as follows:


    ### 1.4.1 Introduction


    This chapter (current chapter) reviews the book chapters and gives brief descriptions
    of each chapter’s contents.


    ### 1.4.2 Python/NumPy


    `Python` is one of the most interesting programming languages with several libraries
    for many applications, and it is easy to learn. Also, `NumPy` has some features
    (especially for arrays and matrices) that make the computation faster and easier.
    This book has a quick review of these tools to help reader understand the projects
    better.


    ### 1.4.3 TensorFlow and Keras Fundamentals


    `TensorFlow` is one of the most famous platforms for `DL` presented by Google.
    This book has a quick review on this platform with some examples to learn how
    to define the `tensors` and ease implementations. We also have a quick review
    of `Keras` with examples.


    ### 1.4.4 Artificial Neural Networks (ANNs)


    For learning, you should know the fundamentals of `ANNs`. We review some `ANNs`
    and present architectures.


    ### 1.4.5 Deep Neural Networks (DNNs)


    This chapter provides the fundamentals of `DNNs` and architectures.


    ### 1.4.6 Deep Networks for Images and Data


    This chapter provides details of `DL` for image and data.


    ### 1.4.7 Deep Networks for Virtual Assistant


    This chapter provides `DL` for virtual assistant applications.


    ### 1.4.8 Finding the Best Model


    This chapter shows how to find the best model.


    # Chapter 2 Python/NumPy Fundamentals


    ## 2.1 Variables


    A `variable` is a place to store data. It has a name to change it. The syntax
    is:


    ```

    variable = expression

    ```


    There are four main types of variables:


    ### 2.1.1 Data Types in Python


    | Type | Example 1 | Example 2 | Example 3 |

    | --- | --- | --- | --- |

    | Integers | 30 | 0 | -10 |

    | Real number | 3.14 | 0.0 | |

    | Strings | “Hello” | “” | | |

    | Boolean | True | False | |


    Naming variables is based on these rules:

    1. It can contain only numbers, letters, and underscores.

    2. It cannot start with a number.

    3. It is `caseSensitive`.

    4. It uses `camelCase`.

    5. It never contains spaces.

    6. It often uses underscore in multiple words.


    If you don’t follow these rules, you will get some errors. In your module and
    projects, the variable name should have some meaning related to its values.


    ### 2.1.2 Keywords


    You cannot use keywords for naming variables. However, you can remember these
    words when the interpreter gives you an error and then check the list.


    Table 2.2 Keywords in Python


    | Reserved Keywords in Python |

    | --- |

    | and | as | assert | break | class | continue |

    | def | del | elif | else | except | exec |

    | finally | for | from | global | if | import |

    | in | is | lambda | nonlocal | not | or |

