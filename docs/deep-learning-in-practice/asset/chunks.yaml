    There are no parameters for learning in this layer, but it has computation cost,
    which can affect the learning performance. Therefore, choosing the pooling layer
    size wisely and putting it correctly in the architecture and the right place can
    improve performance.


    ## 6.2.2.4 Fully Connected Layer (FC)


    All inputs and outputs have separable weights. Therefore, the number of weights
    based on the inputs and outputs plus the bias is:


    ```

    ((C × P) + 1 × C)

    ```


    The current layer neuron number is `C` or output `(O)`, and the previous layer
    neuron number is `P` or input `(I)`. The output of each layer is:


    ```

    input_size ‐ (filter_size ‐ 1)

    ```


    For example, if the input is an image and the image size is `28×28`, and the filter
    size is `3×3`, then the output of the layer is:


    ```

    (28 − (3 − 1)) = 26

    ```


    Let us have a general example of a model. If the input is an image with a size
    of `28×28` and the shape of `28×28×1`, it has no parameters.


    Assume these values:


    ```

    stride=1,

    kernel_ size=3×3,

    number of filters in the first layer =32,

    then the number of the parameters are:

    ((kernel_size) × stride + 1) × number of filters)

    C1: 3×3×1+1×32

    = 320

    ```


    In the next layer, we already have 32 learned filters from the previous layer,
    and then the number of trainable parameters is:


    $$\begin{array}{l} {C\_{2}:3\\mspace{9mu} \times \\mspace{9mu} 3\\mspace{9mu}
    \times \\mspace{9mu} 32\\mspace{9mu} + \\mspace{9mu} 1\\mspace{9mu} \times \\mspace{9mu}
    32\\mspace{9mu} = \\mspace{9mu} 9,248} \\\\ {C\_{3}:3\\mspace{9mu} \times \\mspace{9mu}
    3\\mspace{9mu} \times \\mspace{9mu} 32\\mspace{9mu} + \\mspace{9mu} 1\\mspace{9mu}
    \times \\mspace{9mu} 64\\mspace{9mu} = \\mspace{9mu} 18,496} \\\\ \\end{array}$$


    <img src="images/eqni6\_1.jpg"/>


    And so on. The total parameters are the sum of all these values. For example,
    in these three layers, there are 28,064 parameters:


    ```

    C1 + C2 + C3 = 320 + 9,248 + 18,496 = 28,064

    ```


    Calculating the number of network parameters is a part of validating a good network
    architecture. After making your model by using the summary, you can check the
    number of the parameters in each layer in detail in `TensorFlow`. We plan to review
    the most popular types of CNN architecture. As mentioned before, you can create
    your architecture from scratch and then compare your results with these common
    architectures and choose the best one.


    ### 6.2.3 Imagenet Challenge


    Since 2010, a contest: `ImageNet Large-Scale Visual Recognition Challenge` (`ILSVRC`),
    has been designed for testing different algorithms. The first classification rate
    was 25%, and the best achievement was belonging to `AlexNet`, which achieved 10%
    error rate (however, the recent advanced algorithms show better results). Also,
    there is visual database with more than 14 million images for a recognition project
    that people use to compare their results.


    ### 6.2.4 CNN Architecture


    This section presents some of the most popular CNN algorithms. There are several
    architectures with different performances. The most significant differences between
    these architectures are:


    * number of layers

    * elements in each layer

    * the connection between the layers


    These three parameters define your model and include the network parameters and
    hyperparameters.


    #### 6.2.4.1 LeNet-5 (1998)


    This network is one of the simplest deep neural networks presented in 1998 and
    has seven layers:


    * two convolutional

    * three fully connected layers

    * two pooling layers


    Its first application was for handwritten recognition (`3+2=7` layers), and it
    had about 6,000 parameters (`6×32=6,144`). `Figure 6.8` shows its architecture
    in more detail. Let’s discuss more about its filters and parameters. If the `stride`
    is one, the total parameters are:


    ```

    (n + 2p − f)/s + 1 × (n + 2p − f)/s + 1 × Nc

    ```


    where:


    * `Nc`: is the number of channels (number of filters used to convolve)

    * `p`: padding (no padding in `LeNet-5`)

    * `s`: stride


    ![Figure 6.8 The LeNet5 architecture.](images/fig6_8.jpg)


    Then the number of the parameters is:


    $$\begin{array}{l} \left. \left( {32 + 0 - 5} \right)/1 + 1 \times \left( {32
    + 0 - 5} \right)/1 + 1 \times 6 \right. \\ {= 28 \times 28 \times 6 = 4,704} \\
    \end{array}$$


    <img src="images/eqni6\_2.jpg"/>


    #### 6.2.4.2 AlexNet (2012)


    Alex is one of the first deep learning methods presented in ImageNet that won
    it in 2012. You can see its DL architecture in `Figure 6.9`. Its architecture
    is like `LeNet` with more layers (deeper).


    They presented dropout techniques for making the computation cost less and achieved
    better results in comparison to other methods. They also used `ReLU` in their
    methods to make the performance better. They used max-pooling layers to make their
    methods faster. Its architecture has eight layers and include:


    * five convolutional layers

    * three fully connected layers with 60 million parameters

    * `ReLU`


    ![Figure 6.9 The AlexNet network architecture.](images/fig6_9.jpg)


    #### 6.2.4.3 GoogleNet/Inception-v1 (2014)


    GoogleNet is a CNN with 22 layers in total. Its pretrained version is available,
    and you can download and use it. `Figure 6.10` shows its architecture.


    ![Figure 6.10 The GoogleNet network.](images/fig6_10.jpg)


    It won ILSVRC 2014 with an error rate of less than 7%. Its architecture uses some
    techniques such as batch normalization to reduce the parameters to 4–5 million.
    In addition, it has some `inception` (used from the next version) modules, consisting
    of parallel convolutional filters in each layer. As you can see in `Figure 6.10`,
    its network is very deep that it makes the accuracy higher, but its computation
    cost is also high on the other side.


    #### 6.2.4.4 VGGNet-16 (2014)


    VGGNet-16 is a CNN that was presented in 2014 and had 16 layers in its architecture.
    It achieved 92.7% accuracy on the test image on ImageNet. It is an improvement
    of `AlexNet` by replacing large kernel filters. It is very slow to train, and
    its weights are very large. It has been used for many image classification problems
    and has shown very interesting results. You can implement it with the current
    DL platforms like `TensorFlow`, `Keras`, or `Pytorch`. `Figure 6.11` shows its
    architecture. Its architecture includes:


    * 13 convolutional layers

    * three fully connected layers


    It has 138M parameters that take about 500 MB space (maybe the simplest way to
    improve performance is increasing the layers).


    ![Figure 6.11 The VGGNet-16 network.](images/fig6_11.jpg)


    #### 6.2.4.5 Inception-v3 (2015)


    It is the next generation of `Inception-v1` (after `Inception-v2` with some tweaks
    in loss function and using some other techniques like batch normalization). It
    has 24M parameters, and it is a CNN that is used for image analysis and object
    classification. It has presented by google in 2015 and showed very good results
    on the ImageNet dataset. `Figure 6.12` shows its architecture and is the third
    version of the first algorithm presented by google.

