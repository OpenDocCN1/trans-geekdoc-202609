    img_size = 28

    num:classes = 10

    # define a placeholder for data and y for labels

    X = tf.placeholder("float", [None, img_size, img_size, 1])

    Y = tf.placeholder("float", [None, num:classes])

    ```


    3. **Step 3**: Collecting data and creating training and testing category.

