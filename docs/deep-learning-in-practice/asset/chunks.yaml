    \ normalizing it (here, the maximum value is 255).\n\n```\n#loading the data\n\
    mnist = keras.datasets.mnist\n#find the training and testing data\n(x_train, y_train),\
    \ (x_test, y_test) = mnist.load_data()\n#normalizing the data\nx_train, x_test\
    \ = x_train / 255.0, x_test / 255.0\nsample, sample_label = x_train[3], y_train[3]\n\
