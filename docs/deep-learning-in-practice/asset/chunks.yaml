    \ is sentiment analysis to determine whether a sentence or phrase is positive\
    \ or negative.\n\n### 5.5.1 Recurrent Neural Network Architecture\n\nDevelopment\
    \ in deep learning structure and improving computation power make RNN architecture\
    \ one of the most interesting deep neural networks. RNNs process each element\
    \ of the sequence, keep its features in its memory, and then process the next\
    \ element in a sequence. The neuron cell or node in RNNs is connected to another\
    \ node and to itself.\n\n### 5.5.2 Long Short-Term Memory (LSTM)\n\nOne of the\
    \ challenges for RNNs happens when iterates over one node in a recursive process,\
    \ and the weights go small, and then the vanishing gradient happens. In addition,\
    \ short-term memory is another challenging problem, and these two problems make\
    \ RNNs improper for long sequence or series processing.\n\nLSTM helps RNNs separate\
    \ two terms:\n\n*   short (input data is mixed of data in sequence) and\n\n* \
    \  long (choosing data from short memory and addition and multiplication on data).\n\
    \nBy doing this, you can remove the vanishing gradient. LSTM is different from\
    \ RNNs in these three main aspects of controlling:\n\n*   inputs data,\n\n*  \
    \ remembering sample data, and\n\n*   outputs.\n\n### 5.5.3 Designing an RNN (LSTM)\n\
    \nHere, we implement an RNN model (LSTM) using TensorFlow and Keras for MNIST\
