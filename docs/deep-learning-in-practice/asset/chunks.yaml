    # Preface


    Deep learning is one of the most recent nd advanced topics in machine learning,
    with several applications in many fields. It shows promising results in many areas,
    from computer vision to drug discovery and stock market prediction. There are
    many books and articles in deep learning that discuss its algorithms, theories,
    and applications. Also, because of its capabilities and potentials in solving
    different problems by deploying different data types, many researchers and people
    who are not in computer science or related fields are interested in learning and
    using deep learning architectures in their projects.


    This book – **Deep Learning in Practice** – reviews the fundamentals and concepts
    that a person (who is new in machine learning and deep learning) needs to learn
    to start and implement a new project in deep learning. It is a practical book
    with many programming code examples and figures to help you understand the concepts
    better. The book presents some reviews on the most required topics in python,
    NumPy, TensorFlow, and Keras to implement a deep learning project. Next, the book
    reviews the fundamentals of artificial neural networks and some most popular and
    exciting deep learning algorithms. [Chapter 7](#ch7.xhtml) presents a project
    that deploys some methods and algorithms presented in the book to implement a
    virtual assistant robot. The final chapter gives you a guideline to explore the
    most optimized model for your project.


    I would expect this book’s contents to be welcomed worldwide by undergraduate
    and graduate students and researchers in deep learning, including practitioners
    in academia and industry. Furthermore, I hope that readers would find the presented
    chapters in this book interesting and inspiring to learn more advanced concepts
    (theoretical and practical viewpoints) and discovering more secrets of deep learning.


    **Mehdi Ghayoumi**


    **Los Angeles, CA, USA**


    **August, 2021**


    # Acknowledgments


    I want to thank my family most of all. Some days I felt as though I would not
    finish this book without their.


    Thank you to all friends and colleagues who shared their feedbacks and inspiration.


    Most importantly, this book would not be possible without the wishes, love, and
    supports of my mother, Khadijeh Ghayoumi.


    This book is dedicated to the soul of my kind-hearted father, Aliasghar Ghayoumi.


    # Author


    **Dr. Mehdi Ghayoumi** is a course facilitator at Cornell University and adjunct
    faculty of Computer Science at the University of San Diego. Prior to this, he
    was a research assistant professor at SUNY Binghamton, where he was the Media
    Lab’s dynamic leader. He was also a lecturer at Kent State University, where he
    received the Teaching Award for two consecutive years in 2016 and 2017.


    Dr. Ghayoumi'' research interests are in Machine Learning, Machine Vision, Robotics,
    and Human-Robot Interaction. His research focuses are on building real systems
    for realistic environment, and his current projects have applications in Human-Robot
    Interaction, manufacturing, biometric, and healthcare.


    He is a technical program committee member of several conferences, workshops,
    and editorial board member of several journals in machine learning, mathematics,
    and robotics, like ICML, ICPR, HRI, FG, WACV, IROS, CIBCB, and JAI. In addition,
    his research papers have been published at conferences and journals in the fields,
    including **H**uman-**C**puter **I**naction (`HRI`), **R**obotics **S**cience
    and **S**ystems (`RSS`), **I**nternational **C**onference on **M**achine **L**earning
    and **A**pplications (`ICMLA`), and others.


    # Chapter 1 Introduction


    DOI: [10.1201/9781003025818-1](https://doi.org/10.1201/9781003025818-1)


    ## 1.1 What Is Learning?


    There are several definitions for learning, and maybe we can say, “Learning is
    the achievement of knowledge or skills through study or getting experience.” Humans
    need to promote their social and personal situations and conditions to make their
    life better. For this purpose, in every moment, people face a decision-making
    situation. For everyone, getting new knowledge and learning new skills help make
    better decisions and help people be more successful in their personal and professional
    life. There are several research and studies to know about the humans learning
    process. One of the most important parts of these research and studies is discovering
    how learning can be simulated in machines and how it can be more accurate and
    effective.


    ## 1.2 What Is Machine Learning?

