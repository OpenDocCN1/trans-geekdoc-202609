    \n## 5.1 Deep Neural Networks\n\nThere are some concepts that you should know\
    \ when you are working with deep learning algorithms. This chapter reviews the\
    \ DL models, concepts, and definitions.\n\n### 5.1.1 What, Is Deep Learning?\n\
    \nDeep learning algorithms (a subset of artificial neural networks (a subset of\
    \ machine learning)) work with different data types. It processes data through\
    \ units (neurons) in different ordered sections (layers) by using different techniques\
    \ in each layer (it imitates the human brain structure and operations). A deep\
    \ learning structure has several major parameters and hyperparameters to change\
    \ the learning features, like speed and accuracy. The word “deep” refers to the\
    \ number of layers (usually, DL architectures have several layers (mostly large)\
    \ to make it strong and robust to solve complicated real-world problems), which\
    \ helps the network find more features of the data and help the network to train\
    \ better.\n\n### 5.1.2 Deep Learning Needs!\n\nDL algorithms need a large volume\
    \ of data for training, and the computation costs of making DL model is very high.\
    \ By solving these two challenges (large data and high computation cost), we can\
    \ deploy DL algorithms more efficiently.\n\n### 5.1.3 How to Deploy DL More Efficiently?\n\
    \nThere are several important key points to choose and deploy DL architectures\
    \ correctly and accurately. However, after finding the first trained model, you\
    \ can optimize it (we discuss it in [Chapter 8](#ch8.xhtml)). These are the most\
    \ important key points to know how to use DL more efficient:\n\n1.  have a right\
    \ and proper dataset,\n\n2.  doing the correct and necessary data preprocessing,\n\
