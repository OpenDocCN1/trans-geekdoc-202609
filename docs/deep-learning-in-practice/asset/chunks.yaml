    \n else:\n  lb = \"_none\"\n label_list.append(data_df.gender[i] + lb)\n```\n\n\
    ### 7.3.3 特征提取\n\n为了训练，提取一些区分声音差异的音频特征。音频中的原始数据在时域中，通过如 `FFT` 等函数，你可以将其转换到频域。音频信号具有一些特征，如频率（频域）、梅尔频率倒谱\
