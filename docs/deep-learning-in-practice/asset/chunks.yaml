    test_valid = np.expand_dims(test_valid, axis=2)\n```\n\n### 7.3.6 Test the Trained\
    \ Model\n\nAfter getting the desired accuracy, you can save the trained model\
    \ for testing with new data.\n\n## 7.4 Speech to Text\n\nYou can do the speech-to-text\
    \ in these steps by using different deep learning models. Here the model input\
    \ is raw audio data, and the output is the transcription of the person's spoken\
    \ data. In this section, some parts like loading or splitting data have been skipped.\
    \ There are several databases that you can use for this purpose. For example,\
    \ LibriSpeech contains 1000 hours of speech, and the data derived from some audiobooks\
    \ is one choice. You can define three main steps here:\n\n1.  **Step 1:** feature\
    \ extraction,\n\n2.  **Step 2:** making the model using a deep learning algorithm,\
    \ and\n\n3.  **Step 3:** decoding and find the output.\n\n![Figure 7.9 Speech\
    \ to text steps.](images/fig7_9b_B.jpg)\n\nFigure 7.9 Speech to text steps.\n\n\
    ### 7.4.1 Feature Extraction\n\nDoing some popular processing on speech to extract\
    \ the features. Here, we extract two features: spectrograms and MFCC. There are\
    \ several references if you would like to learn more about these features. Here,\
    \ the spectrogram function's output is a 2D tensor where the first dimension is\
    \ the time, and the second dimension is the frequency values. The second feature\
    \ MFCC has the same concept as the spectrogram, and its feature vector has lower\
    \ dimensions than the spectrogram. The features here are spectrograms and Mel-Frequency\
    \ Cepstral Coefficients (MFCCs). Several libraries like librosa (we used in the\
    \ previous section) can be used here to extract these features.\n\n### 7.4.2 Deep\
    \ Neural Networks Modeling\n\nIf you know the basic design of a network for acoustic\
    \ data, you can create your own model for your project. It is sequential, and\
    \ if we have **n** time slot, every time, the input of the RNN is one of the alphabet\
    \ characters. There are 28 characters, including 26 letters, a space character\
    \ (\" \"), and an apostrophe ('), that every time the speaker pronounces one of\
    \ these sets. The [Figure 7.10](#ch7.xhtml#f7_10) shows an equivalent, rolled\
    \ depiction of the RNN that shows the output layer in greater detail. The output\
    \ of the RNN is also a vector that contains the probabilities of all inputs.\n\
    \n![Figure 7.10 Shows the RNN architecture.](images/fig7_10_B.jpg)\n\n[Figure\
    \ 7.10 Shows the RNN architecture.](#ch7.xhtml#R_f7_10)\n\n### 7.4.3 Decoder\n\
    \nIn this step, the coded data should convert to the original text format coded\
    \ in the first step. Here is the sample code for the RNN model using Keras.\n\n\
    ```\nfrom keras import backend as K\nfrom keras.models import Model\nfrom keras.layers\
    \ import (BatchNormalization, Conv1D, Dense, Input, TimeDistributed, Activation,\
    \ Bidirectional, SimpleRNN, GRU, LSTM)\ndef rnn_model(input_dim, output_dim =\
    \ 26):\n# Main acoustic input\n input_data = Input(name='the_input', shape = (None,\
    \ input_dim))\n# Add recurrent layer\n simp_rnn = GRU(output_dim, return_sequences\
    \ = True, implementation = 2, name = 'rnn')(input_data)\n# Add softmax activation\
    \ layer\n y_pred = Activation('softmax', name = 'softmax')(simp_rnn)\n# Specify\
    \ the model\n model = Model(inputs = input_data, outputs = y_pred)\n model.output_length\
    \ = lambda x: x\n print(model.summary())\n return model\n```\n\n### 7.4.4 Predictions\
    \ Calculation\n\nYou can write a function to decode the predictions of your acoustic\
    \ model.\n\n## 7.5 Sentiment Analysis"
