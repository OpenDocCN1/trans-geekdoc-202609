    \n## 6.7 Object Recognition Using CNNs\n\nObject recognition is a field of image\
    \ analysis that its goal is to find the object on the images. Humans can easily\
    \ recognize different objects on an image, but it needs many efforts to make the\
    \ accuracy acceptable for machines.\n\n### 6.7.1 Import Libraries\n\nHere, we\
