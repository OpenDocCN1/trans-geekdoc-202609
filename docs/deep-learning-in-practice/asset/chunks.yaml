    # 前言


    深度学习是机器学习领域最前沿且最先进的话题之一，在许多领域都有多种应用。从计算机视觉到药物发现和股市预测，它在许多领域展示了令人期待的结果。关于深度学习有很多书籍和文章讨论了它的算法、理论和应用。此外，由于其通过部署不同的数据类型解决不同问题的能力和潜力，许多研究人员以及计算机科学或相关领域的人士对在自己的项目中学习和使用深度学习架构感兴趣。


    本书——**《深度学习实践》（Deep Learning in Practice）**——回顾了个人（机器学习和深度学习的初学者）在启动和实施新的深度学习项目时需要学习的基础知识和概念。这是一本实用书籍，包含许多编程代码示例和图表，帮助你更好地理解这些概念。书中介绍了在实现深度学习项目时
    Python、NumPy、TensorFlow 和 Keras 中最需要的话题回顾。接下来，本书回顾了人工神经网络的基础以及一些最流行且令人兴奋的深度学习算法。第
    7 章 展示了一个项目，该项目部署书中介绍的一些方法和算法来实现虚拟助手机器人。最后一章为你提供了一份指南，以探索适用于你项目的最优模型。


    我希望本书的内容受到全球深度学习领域本科生、研究生和研究人员的欢迎，包括学术界和工业界的从业者。此外，我希望读者会发现书中章节有趣且具有启发性，引导他们学习更高级的概念（理论和实践观点）并发现更多深度学习的奥秘。


    **Mehdi Ghayoumi**


    **美国加州，洛杉矶**


    **2021 年 8 月**


