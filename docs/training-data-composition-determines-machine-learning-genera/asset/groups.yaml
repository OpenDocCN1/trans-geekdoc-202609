    ML 模型，并评估训练数据组成如何影响泛化和生物学规则恢复（图 1d,e）。规则恢复使用可解释性方法46–48进行，旨在通过识别对输出影响最大的数据特征来揭示模型预测背后的推理。我们使用来自文献
    49 的大规模实验 HER2 亲和力标记抗体序列数据集验证了我们的发现。我们的结果表明，泛化和生物学规则发现都关键地依赖于训练数据集组成——包括负例的选择（图
    1f）。


    ## 结果


    ### 训练数据集序列组成影响 ID 和 OOD 二元分类任务中的预测性能


    合成和实验数据的 ML 设置。我们首先研究了负数据组成如何影响监督二元分类中抗体–抗原结合预测的性能和泛化能力。使用 Absolut!27 框架，我们模拟了一大批
    CDRH3 序列与十种抗原的结合。对每种抗原，我们定义了四个分类任务（表 1 和图 2a），所有任务共享相同的正数据（前 1% 亲和力序列），但具有不同类型的负例：


    1. ‘vs non-binder’（底部 95%）

    2. ‘vs weak’（1%–5% 范围）

    3. ‘vs 1’（对另一种抗原的前 1% 结合者）

    4. ‘vs 9’（对另外九种抗原中任意一种的前 1% 结合者）。


    每个数据集包含 20,000 个正序列和 20,000 个负序列，其中各 10,000 个用于测试。ML 任务根据抗原和数据集类型命名。


    我们训练了一个简单的全连接神经网络，包含十个隐藏神经元（SN10），以实现可解释性。为确保稳健性，我们使用多个随机训练-测试划分和权重初始化重复训练，并监控验证集上的性能以避免过拟合（补充图
    3f）。该架构和流程被默认用于所有涉及 SN10 模型的分析。我们还将 SN10 与逻辑回归（LR）和 Transformer 模型进行了比较（补充图 3c,e
    和补充表 4），显示出没有性能优势，与类似设置中的先前发现一致27。


    最后，我们使用来自文献 49 的 24,790 个 CDRH3 序列的实验数据集复制了内分布（ID）和外分布（OOD）性能分析，这些序列标记了与抗原 HER2
    的结合亲和力，其结构与合成数据相似。


    ### ID 预测准确性是训练数据集组成的功能


    为评估模型学习可泛化规则的能力，我们在与训练数据分布匹配的 ID 测试集上评估了其性能（图 2a）。在此设置下，模型在所有任务上均实现了较高的中位准确率（>0.85），呈现出明显的性能趋势：‘vs
    non-binder’最高（范围：0.97–1.00；中位数：0.99），其次是‘vs 1’（0.94–1.00；中位数：0.98）和‘vs 9’（0.91–0.98；中位数：0.94），‘vs
    weak’最低（0.85–0.98；中位数：0.92；图 2b），确定‘vs weak’为最具挑战性的任务。


    如预期，训练于洗牌对照数据集的模型准确率为 0.5，证实原始数据包含可学习模式（补充表 1）。SN10 超过了 LR 模型


    ### 负数据影响规则学习


    我们发现负数据集的组成影响了模型在序列和残基水平上学习结合规则的能力（图 3）。模型对数与抗体结合能之间的相关性在‘vs weak’和‘vs non-binder’任务中最强，每残基能量贡献与模型归因之间的相关性也是如此。相比之下，‘vs
    1’和‘vs 9’中的规则学习变化更大，失真的归因提示了混杂负例的干扰（图 3d）。这表明尽管仅正数据可能足以学习，但负数据可以支持或损害规则发现。


    一个根本性的挑战是如何完全破译模型归因所捕获的信息。我们没有观察到归因-能量相关性超过 -0.6 至 -0.7，可能由于归因方法的局限性、能量建模不完整（例如仅
    CDRH3）或残基水平效应的内在复杂性。有趣的是，使用 DeepLIFT 获得的归因与 LR 权重表现出不同程度的相关性（补充图 7c）。‘vs non-binder’任务的归因与
    LR 权重相关性更强，而‘vs weak’任务的归因在不同抗原间显示出混合相关性。这表明 DeepLIFT 捕获了一些非加性规则，但缺乏特征交互的显式可解释性。在分析基于表位的数据集时出现了进一步的复杂性，其中阳性结合特定表位而非整个抗原（补充文本
    2 和补充图 9）。虽然这些在对数水平上改善了规则发现，但在基于归因的分析中没有一致的优势。因此，尽管结合规则可以在两个水平上学习，但每残基规则更难以分离。


    ### ML 规则学习与预测性能


    我们没有发现规则学习与高预测性能之间的明确依赖。例如，训练于‘vs 9’和‘vs 1’的模型通常比训练于‘vs weak’的模型实现更高的 ID 性能，尽管后者在所有抗原上更有效地学习结合规则。这为来自
    TCR 领域的一项研究提出的假设提供了一个反例，即性能更高的模型更可能依赖生物学规则37。我们的发现表明，虽然 ID 性能可能对规则发现是必要的，但单独不足。相反，模型学习详细结合信息的能力代表了其整体性能的额外维度。


    对这一解释的细微改进是，具有更高 OOD 性能的模型更可能依赖稳健的生物学规则。尽管我们的结果显示训练于‘vs non-binder’和‘vs weak’的模型表现出相似水平的结合规则学习，但
    OOD 性能在所有任务中对‘vs non-binder’最低，对‘vs weak’最高（图 2d 和补充图 3d）。这种差异源于每个任务捕获特征交互方式的不同；如前所述，‘vs
    weak’任务允许更大程度地考虑氨基酸贡献之间的相互作用。我们建议 OOD 性能应作为基准测试规则恢复方法的正交指标，其中成功的规则集和模型可解释性方法将捕获
    OOD 稳健性。


    ## 合成抗体–抗原结合数据使训练数据集组成对 ML 性能影响的详细研究成为可能


    合成数据使我们能够系统地研究训练数据集组成如何影响 ML 性能，特别是在基于亲和力构建的任务中。单序列亲和力注释的实验数据集，如本工作所用，仅开始变得可用49,58。可用的实验数据集规模低一到两个数量级（我们的合成数据集有
    ~700k 序列，而实验约为 ~25k），并且合成数据集涵盖了更多抗原。


    Absolut! 之前已被证明可指导实验数据的 ML 开发27，可被视为抗体–抗原数据集复杂性的下限。它通过保留真实蛋白质的表面氨基酸组成并探索 CDRH3
    的多种结构构象来保持生物学相关性，从而将非线性纳入序列到亲和力的对应关系。所使用的 CDRH3 数据源自小鼠库，并表现出生理氨基酸组成和位置依赖性。


    此外，合成数据具有避免可解释性研究中确认偏误的优势41,59,60，因为存在真实值。事实上，数据分布于一系列特征中，其中一些与给定预测任务相关，其他则不相关。这些特征可能是结构属性、亲和力、k-mer
    分布、氨基酸组成和 CDRH3 长度。通常事先不知道哪些特征无关，因此在训练数据（正负）中应平衡哪些特征。一旦识别，无关特征可在正负数据集之间平衡，以防止模型学习虚假相关性。作为实现这一目标的第一步，我们探讨了负类别对正数据学习的影响。


    ## ML 考虑


    在本研究中，我们专注于反映最常见免疫受体数据集的分类任务，这些数据集通常是二元或半定量的22,61,62（即根据结合强度分为类别）。此外，‘vs 1’和‘vs
    9’数据集中的负例通常未按对阳性类别靶标的亲和力注释12,29,30。因此，我们将连续亲和力值二值化以创建半定量类别，并评估这些是否足以学习结合规则等亲和力属性。然而，当亲和力注释数据可用时，可能可行采用两步方法：初始分类后在连续标签上微调63,64。


    在分类框架内，我们评估了几种 ML 模型。我们专注于 SN10，因其可解释性直接且已知其性能67。我们还测试了基于 Transformer 的模型和基于蛋白质语言模型嵌入的模型，但这些没有提高性能。SN10
    作为神经网络，可以捕获位置间依赖性，这通过相对于 LR 的性能提升得到说明（补充表 4 和 5）。因此，对于我们的任务，SN10 提供了模型复杂性和可解释性的实用平衡。


    未来的工作可以探讨规则学习如何同时受类别平衡和负类别类型、输入表示（序列与结构）以及模型架构的影响。最近的研究65,66表明，更简单的模型通常捕获结合相互作用，而更复杂的模型倾向于反映更广泛的生物物理属性，例如蛋白质折叠。


    ## 结论


    构建负数据时存在两种主要实践方法：（1）对现有非特异性（负）数据进行子采样和（2）实验生成负数据。基于我们的发现，我们建议在应用子采样策略时使用选择‘困难’或‘半困难’负例的方法14,67，从未标记数据中选择。然而，我们的工作主要推进了第二种方法——在对数据生成过程有控制时构建负数据。在这种情况下，我们建议收集在感兴趣的度量（例如结合亲和力）上接近的分类或连续数据，以创建更具挑战性的训练集。在此情景下，正负数据源自同一实验和同一序列分布。然而，如果正负数据通过单独的实验生成，实验特异性偏差可能会掩盖细微差异

