    | 数据集类型 | 正数据集 | 负数据集 | 实际相关性 |

    |---|---|---|---|

    | ‘vs non-binder’ | 具有高亲和力的结合序列，针对目标抗原（范围：零至第一百分位） | 对阳性类别抗原亲和力低至无（第五至第一百百分位）的序列，即非结合者。
