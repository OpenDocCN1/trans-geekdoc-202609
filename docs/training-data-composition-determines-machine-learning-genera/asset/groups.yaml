    ## 扩展数据图 1 | ID 和 OOD 性能随亲和力空间中正负数据分离的变化


    该图显示了 SN10 模型在亲和力方面与正数据逐渐更远的负数据分区上训练后的 ID 和 OOD 性能。x 轴表示分区编号，每个分区包含 20,000 条序列，其中较高的分区编号表示与目标抗原亲和力较低的一组序列。分区
    0–10 对应“弱”负样本，而分区 11–25 对应“非结合物”，一条虚线垂直线标记了它们之间的分隔。负数据分区的图形解释在图底部提供。y 轴显示 ID 和
    OOD 性能。棕色线显示 ID 性能。其他线条（蓝色、红色和黄色）表示主图（图 2a）中使用的任务上的 OOD 性能。蓝色线显示“vs Non-binder”任务上的
    OOD 性能，仅针对对应‘弱’负样本的分区定义（虚线之前）。黄色线表示“vs Weak”任务上的 OOD 性能，仅针对对应‘非结合物’负样本的分区定义（虚线垂直线之后）。每个模型均使用单一种子和数据分割进行训练。


