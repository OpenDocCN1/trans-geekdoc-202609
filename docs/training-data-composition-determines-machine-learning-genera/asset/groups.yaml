    在具有相似结合亲和力的序列之间。这也解释了为什么‘vs I’和‘vs 9’负数据集可能不可靠。因此，在正负数据通过不同实验生成时，我们建议谨慎。


    深度突变扫描方法允许创建在序列和亲和力上接近的正负数据集 56,68,69 并提供关于上位性相互作用的信息 51。 我们的工作表明，深度突变扫描数据集对于向机器学习模型教授序列到功能的映射至关重要，其中非常小的序列差异可能产生大的功能效应（补充图
    2）。


    我们的发现虽然源于基于序列的免疫受体-抗原相互作用，但对其他涉及二元分类且依赖于难以定义的负样本的生物学机器学习任务具有更广泛的相关性，例如小分子药物发现和基于转录组学的表型分析。关键信息可以概念上推广：使用硬负样本进行训练（即在特征或标签空间中与正样本相似的样本）可促进分布外泛化和生物学上有意义的规则学习。我们的结果表明，使用具有低但可测量的活性（例如弱抑制剂）的化合物作为负样本，可以产生对未见化合物泛化更好且避免过度拟合过于简单决策边界的模型。同样，在从转录组特征预测表型时，从表型上接近的条件构建负样本集可以创建更具生物学基础且更稳健的分类器。总的来说，通过在训练中减小类别之间的间隔来增加分类任务的难度，会促使机器学习模型学习更细致且可迁移的规则。我们认为这是在生物学基础机器学习中广泛适用的原则，值得进一步的领域特异性验证。


    ## Methods


    ### 使用 Absolut! 生成的合成抗体-抗原结合数据集


    我们使用了之前生成的半合成抗体-抗原结合数据集 27,45。简而言之，该数据集包含真实世界的抗原和抗体（CDRH3）蛋白，抗体序列来自小鼠库 70，抗原的三维结构来源于蛋白质数据库并转化为三维晶格格式。这些数据集的作者应用了穷举对接方法来评估离散刚性抗原与抗体侧长度为
    11 的柔性 CDRH3 的结合。结果包括结合能值、最小化自由能的结合位置，以及抗原（表位）和 CDRH3（抗原结合位点）之间相互作用氨基酸的鉴定。每个抗原都与一组源自
    CDRH3 的 11-mer 相关，并根据结合能进行排序。最低的第一百分位内的序列，平均为 51,814.7 个序列，被标记为高亲和力结合体（或简称为‘结合体’）。第一到第五百分位的序列，平均为
    205,069.3 个序列，被标记为弱亲和力结合体。最后，最高九十五百分位的序列，平均为 391,498.8 个序列，被标记为非结合体。这种标记方案与参考文献
    27 中使用的方法一致。对于我们的研究，我们使用了来自十种抗原的抗体结合数据，其蛋白质数据库 ID 为 3VRL、1NSN、3RAJ、5E94、1HOD、1WEJ、1ADQ、1FBI、2YPV
    和 1OB1。


    ### 预测任务及训练和测试数据集


    我们使用了平衡的 CDRH3 数据集（训练用 30k 个抗体序列（15k 个正类和 15k 个负类）和测试用 10k 个抗体序列（5k 个正类和 5k 个负类）），其根据正类抗原和负数据集类型而变化（表
    1）。数据集的正类由结合体序列组成，即结合能介于零到第一百分位之间的序列。


    每个数据集的负类根据结合预测任务类型构建如下：


    - ‘vs I’：对另一抗原为结合体但对正类抗原不是结合体的序列。

    - ‘vs 9’：结合九种其他抗原中的一种且不结合正类抗原的序列，按相等比例表示。举例来说，在训练集中总共 15,000 个序列中，每种抗原约有 1,666（±1）个相关序列（~15,000/9）。

    - ‘vs weak’：结合正类抗原但结合能在第一到第五百分位内的序列。

    - ‘vs non-binder’：对正类抗原结合能处于 >第五百分位的序列。


    我们生成了重复实验以确保实验的可重复性。具体而言，对每个预测任务和正抗原生成了六个不同的训练-测试划分。对于其中一个划分，我们使用不同的种子训练并评估模型四次，从而控制模型初始化和训练的随机性。数据集的正类在任务和每次重复实验中保持不变。例如，1ADQ
    结合体‘vs weak’中的正类数据与 1ADQ 结合体‘vs 9’中的正类数据相同。每个正负数据集对应的序列均随机抽样以达到前述数据集大小。在整个工作中，我们通过随机打乱每个任务序列的类别标签来使用负对照。预测性能在留出测试数据集上使用准确率指标进行评估，计算为正确预测数除以预测总数。分布外性能通过计算在其他任务的测试集上的性能来评估，例如‘vs
    9’在‘vs weak’测试集上的性能。分布外估计在与内部情况相同的重复集上进行。


    ### 机器学习模型架构、训练和评估


    我们训练了一个简单的神经网络，之前称为 27，此后称为 SN10（参考文献 27），用于使用 CDRH3 序列的结合预测任务。序列每个由 11 个氨基酸组成，经过独热编码后，维度为
    220。神经网络架构由输入层 220 个神经元、隐藏层 10 个神经元（激活函数为整流线性单元）和 1 个输出神经元（激活函数为 S 型）组成。对于训练，在探索参数空间后，我们使用二元交叉熵损失、Adam
