    # Negative data influence rule learning


    We found that the composition of the negative dataset influenced the model’s ability
    to learn binding rules at both the sequence and residue levels (Fig. 3). Correlations
    between model logits and antibody binding energy were the strongest in the ‘versus
    weak and ‘vs non-binder’ tasks, as were correlations between per-residue energy
    contributions and model attributions. In contrast, rule learning varied more in
    ‘vs I’ and ‘vs 9’, where distorted attributions suggested interference from confounding
    negatives (Fig. 3d). This suggests that although positive data alone may suffice
    for learning, negative data can either support or impair rule discovery.


    A fundamental challenge is to fully decipher the information captured by model
    attributions. We did not observe attribution–energy correlations beyond −0.6 to
    −0.7, probably due to limitations in attribution methods, incomplete energy modelling
    (for example, CDRH3 only) or the intrinsic complexity of residue-level effects.
    Interestingly, attributions obtained with DeepLIFT exhibited varying degrees of
    correlation with LR weights (Supplementary Fig. 7c). Attributions from the ‘vs
    non-binder’ task correlated more strongly with LR weights, whereas those from
    the ‘vs weak’ task showed mixed correlations across antigens. This suggests that
    DeepLIFT captures some non-additive rules but lacks the explicit interpretability
    of feature interactions. Further complexity emerged when analysing epitope-based
    datasets, where positives bind a specific epitope rather than an entire antigen
    (Supplementary Text 2 and Supplementary Fig. 9). While these improved rule discovery
    at the logit level, they showed no consistent advantage in attribution-based analysis.
    Thus, although binding rules can be learned at both levels, per-residue rules
    remain more difficult to disentangle.


    # ML rule learning and prediction performance


    We found no clear dependence between rule learning and high prediction performance.
    For instance, models trained on ‘vs 9’ and ‘vs I’ generally achieve higher ID
    performance than those trained on ‘vs’ weak, despite the latter learning binding
    rules more effectively across all antigens. This presents a counterexample to
    a hypothesis from a TCR field study suggesting that models with higher performance
    are more likely to rely on biological rules37. Our findings suggest that while
    ID performance may be necessary for rule discovery, it is not sufficient on its
    own. Instead, a model’s ability to learn detailed binding information represents
    an additional dimension of its overall performance.


    A slight refinement to this interpretation is that models with higher OOD performance
    are more likely to rely on robust biological rules. Despite our results showing
    that models trained on ‘vs non-binder’ and ‘vs weak’ exhibit similar levels of
    binding rule learning, OOD performance is the lowest for ‘vs non-binder’ and the
    highest for ‘vs weak’ among all the tasks (Fig. 2d and Supplementary Fig. 3d).
    This discrepancy arises from differences in how each task captures feature interactions;
    as discussed before, the ‘vs weak’ task permits a greater consideration of interactions
    between amino acid contributions. We suggest that OOD performance should serve
    as an orthogonal metric for benchmarking rule recovery methods, where a successful
    rule set and model interpretability approach will capture OOD robustness.


    # Synthetic antibody–antigen binding data enable a detailed study of the impact
    of training dataset composition on ML performance


    Synthetic data enabled us to systematically investigate how the composition of
    the training dataset affects ML performance, particularly in tasks constructed
    based on affinity. Single-sequence affinity-annotated experimental datasets, as
    used in this work, have only started to become available49,58. The available experimental
    dataset size is one to two orders of magnitude lower (our synthetic dataset has
    ~700k sequences compared with ~25k for experimental), and the synthetic dataset
    covers more antigens.


    Absolut! was previously shown to guide ML development on experimental data27 and
    can be viewed as a lower bound for the complexity of antibody–antigen datasets.
    It retains biological relevance by preserving the surface amino acid composition
    of real proteins and explores multiple structural conformations of CDRH3, thereby
    incorporating nonlinearity into sequence-to-affinity correspondence. The used
    CDRH3 data are derived from the murine repertoire and exhibit a physiological
    amino acid composition and positional dependencies.


    Furthermore, synthetic data have the advantage of avoiding confirmation bias in
    explainability studies41,59,60 as ground truth is available. Indeed, data are
    distributed over an array of features, some relevant and others irrelevant for
    a given prediction task. These features may be structural properties, affinity,
    k-mer distributions, amino acid composition and CDRH3 length. It is generally
    not known in advance which features are irrelevant and, thus, which should be
    balanced in the training data (both positive and negative). Once identified, the
    irrelevant features could be balanced between the positive and negative datasets
    to prevent the model from learning spurious correlations. As the first step towards
    this goal, we explored the impact of negative class on positive data learning.


    # ML considerations


    In this study, we focused on classification tasks that reflect the most common
    immune receptor datasets, which are typically binary or semi-quantitative22,61,62
    (that is, divided into categories based on binding strength). Moreover, the negatives
    in the ‘vs I’ and ‘vs 9’ datasets are often not annotated by affinity to a positive
    class target12,29,30. We, therefore, binarized the continuous affinity values
    to create semi-quantitative categories and assessed whether these were sufficient
    for learning binding rules such as affinity properties. However, when affinity-annotated
    data are available, it may be feasible to take a two-step approach: initial classification
    followed by fine tuning on continuous labels63,64.


    Within the classification framework, we evaluated several ML models. We focused
    on SN10 due to its straightforward explainability and prior knowledge of its performance67.
    We also tested a transformer-based model and models based on protein language
    model embeddings, but these did not improve performance. SN10, as a neural network,
    can capture interpositional dependencies, which is illustrated by improved performance
    over LR (Supplementary Tables 4 and 5). Thus, for our tasks, SN10 offered a practical
    balance of model complexity and explainability.


    Future work could explore how rule learning is influenced by class balance and
    the type of negative class simultaneously, by input representation (sequence versus
    structure), and by model architecture. Recent studies65,66 suggest that simpler
    models often capture binding interactions, whereas more complex models tend to
    reflect broader biophysical properties, such as protein folding.


    # Conclusion


    When constructing negative data, two main practical approaches exist: (1) subsampling
    existing non-specific (negative) data and (2) generating negative data experimentally.
    On the basis of our findings, we recommend using methods14,67 that select ‘hard’
    or ‘semi-hard’ negatives from unlabelled data when applying the subsampling strategy.
    However, our work primarily advances the second approach—constructing negative
    data when there is control over the data generation process. In such cases, we
    recommend collecting categorical or continuous data that are close in terms of
    the metric of interest (for example, binding affinity) to create a more challenging
    training set. In this scenario, positive and negative data originate from the
    same experiment and the same sequence distribution. However, if positive and negative
    data are generated through separate experiments, experiment-specific biases might
