    \n## Acknowledgments\n\nDespite the controversies that crop up around security\
    \ issues, it has been our experience that people in the security community are\
    \ generally generous with their wisdom and time. It’s always a little scary thanking\
    \ specific people, for fear we’ll leave someone out, but leaving everyone out\
    \ seems wrong. It’s not even the fair thing to do, since some people would be\
    \ more egregiously wronged by being left out than others.\n\nWe’d like to thank\
    \ the reviewers of various chapters of this book, which include Luís T. A. N.\
    \ Brandão, Bill Burr, Lisa Carnahan, Lily Chen, David Cooper, Joan Daemen, Michael\
    \ Davidson, Morrie Dworkin, Ned Freed, Simson Garfinkel, Jonathan Katz, John Kelsey,\
    \ Yi-Kai Liu, Kerry McKay, Carl Miller, Dustin Moody, Nicky ...\n\n## About the\
    \ Authors\n\n**Charlie Kaufman** is currently Security Architect for Dell Storage\
    \ Systems. Previously, he was the Security Architect for Microsoft Azure and before\
    \ that for Lotus Notes. He has contributed to a number of IETF standards efforts\
    \ including IPsec, S/MIME, and DNSSEC and served as a member of the Internet Architecture\
    \ Board. He served on the National Academy of Sciences expert panel that wrote\
    \ the book *Trust In Cyberspace*.\n\n**Radia Perlman** is currently a Fellow at\
    \ Dell Technologies. She is known for her contributions to bridging (spanning\
    \ tree algorithm), routing (link state routing), and security (distributed systems\
    \ robust despite malicious participants). She’s the author of *Interconnections:\
    \ Bridges, Routers, Switches, and Internetworking ...*\n\n## 1 Introduction\n\n\
    It was a dark and stormy night. Somewhere in the distance a dog howled. A shiny\
    \ object caught Alice’s eye. A diamond cufflink! Only one person in the household\
    \ could afford diamond cufflinks! So it was the butler, after all! Alice had to\
    \ warn Bob. But how could she get a message to him without alerting the butler?\
    \ If she phoned Bob, the butler might listen on an extension. If she sent a carrier\
    \ pigeon out the window with the message taped to its foot, how would Bob know\
    \ it was Alice that was sending the message and not Trudy attempting to frame\
    \ the butler because he spurned her advances?\n\nThat’s what this book is about.\
    \ Not much character development for Alice and Bob, we’re afraid; nor do we really\
    \ get to know the butler. But ...\n\n## 2 Introduction to Cryptography\n\n###\
    \ 2.1 Introduction\n\nThe word *[cryptography](#gloss.xhtml#gloss_050)* comes\
    \ from the Greek words κρυπτο (*hidden* or *secret*) and γραϕη (*writing*). So,\
    \ cryptography is the art of secret writing. More generally, people think of cryptography\
    \ as the art of mangling information into apparent unintelligibility in a manner\
    \ allowing a secret method of unmangling. The basic service provided by cryptography\
    \ is the ability to send information between participants in a way that prevents\
    \ others from reading it. In this book, we will concentrate on the kind of cryptography\
    \ that is based on representing information as numbers and mathematically manipulating\
    \ those numbers. This kind of cryptography can provide other services, such as\n\
    \n*   integrity checking—reassuring ...\n\n## 3 Secret Key Cryptography\n\n###\
