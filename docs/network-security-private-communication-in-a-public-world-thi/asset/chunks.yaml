    本补遗仅由我[3]（Mike Speciner）编写，旨在提供材料以拓展和深化您对书中许多技术背后的数学和算法的理解。即使没有这些知识，您也应能理解本书其余部分，但我认为[3]这些知识仍可能有帮助，至少能启发思考。本补遗（含习题）：`https://github.com/ms0/docs/blob/main/math.pdf`。


