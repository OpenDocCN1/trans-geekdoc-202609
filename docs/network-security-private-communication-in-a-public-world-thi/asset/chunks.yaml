    ## 分组密码


    **分组密码**。它以密钥和固定大小的明文分组作为输入（旧密码使用 64 位分组，现代密码使用 128 位分组）。它生成的密文分组与明文分组大小相同。要加密大于分组大小的消息，分组密码会与称为*工作模式*的算法一起迭代使用，这是下一章的主题。分组密码还具有解密操作，执行反向计算。


    ## 流密码


    **流密码**。它使用密钥……


    ## 4 工作模式


    ### 4.1 简介


    我们已经介绍了如何使用 AES 加密 128 位分组，或使用 DES 加密 64 位分组，这些原语有一个很好的特性：如果攻击者修改了密文的任何部分，解密的结果实际上将是一个随机数。遗憾的是，大多数有用的消息都超过
    128 位。**工作模式**是使用分组加密算法作为原语进行迭代应用，从而加密任意大小消息的技术。此类算法可以具有其他理想特性。如果我们多次发送相同的消息，最好每次加密后的消息都不同，这样窃听者就无法判断我们在发送相同的消息……


    ## 5 密码学哈希


    ### 5.1 简介


    哈希函数输入任意大小的比特串，输出固定大小的比特串，理想情况下所有输出值出现的概率均等。**密码学哈希**（也称为**消息摘要**）具有一些额外的安全属性：


    *   **原像抗性**：给定一个预先指定的哈希值，应该无法在计算上找到具有该哈希值的消息。

    *   **抗碰撞性**：应该无法在计算上找到具有相同哈希值的两条消息。

    *   **第二原像抗性**：给定一条消息，应该无法在计算上找到具有相同哈希值的第二条消息。


    术语*消息摘要*最初更流行，但如今*哈希*更常用。作为证据表明世界……


    ## 6 第一代公钥算法


    ### 6.1 简介


    本章介绍截至 2022 年已部署的最常见公钥算法，这些算法在未来几年内可能仍将是使用中最常见的公钥算法。正如我们将在第 7 章 *量子计算* 中所示，如果有人能够构建足够规模的量子计算机，本章中的算法将不再安全。世界很快将转向不同的公钥算法（参见第
    8 章 *后量子密码学*)。但本章重点介绍的当前算法已广泛部署，且非常值得理解。


    公钥算法是一群形形色色的算法。所有哈希算法做的都是同一件事——它们接收一条消息并执行……


    ## 7 量子计算


    ### 7.1 什么是量子计算机？


    量子力学预测，应该有可能构建一种计算机，能以比传统（经典）计算机快得多的速度进行某些计算。量子力学的某些方面可能看似违反直觉，但所有证据都支持它。在本章中，我们将描述量子计算机与经典计算机的区别，并直观地介绍与密码学最相关的量子算法。


    关于量子力学有整整一架子的书。我们的目标不是将数年的物理和数学知识塞进几页纸里，而是让读者对概念、术语和符号，以及在量子计算机上运行的算法有所了解。对于那些……的读者来说……


    ## 8 后量子密码学


    正如我们在第 7 章 *量子计算* 中所述，实现 Shor 算法的足够大规模的量子计算机将攻破我们当前部署的公钥算法。然而，在发生这种情况之前很久，世界（希望）将已经转向替代算法。替代算法将基于（希望）即使是经典和量子计算机的组合也无法在合理时间内解决的数学问题。


    这些新算法有几个同义名称：抗量子、量子安全或后量子密码学（PQC）。世界似乎已确定使用*后量子*这一术语，因此我们也将使用该术语，尽管我们注意到该术语……


    ## 9 人员认证


    > *人类无法存储高质量的加密密钥，在执行加密操作时速度和准确性都不可接受。他们还体积庞大、维护成本高、难以管理，并会污染环境。令人惊讶的是，这些设备仍在持续制造和部署，但它们普及程度足够高，以至于我们必须围绕其局限性来设计系统。*

    >

    > ——Radia Perlman


    认证是可靠验证某人（或某物）身份的过程。人类互动中有很多认证的例子。认识你的人可以根据你的外貌或声音认出你。卫兵可能会通过将你与……进行比较来认证你。


    ## 10 可信中介


    ### 10.1 简介


    如果节点 Alice 和 Bob 想要安全通信，它们需要知道彼此的密钥。为每个节点配置与其他所有节点的密钥无法扩展到少量节点之外，因此需要**可信第三方**（Alice
    和 Bob 都信任的人）来为 Alice 和 Bob 互相介绍。


    在本章中，我们将介绍基于可信第三方的不同类型系统。一种是仅使用密钥的系统，在这种情况下，可信第三方通常称为**KDC**（**密钥分发中心**）。在公钥系统中，可信第三方通常称为**认证机构**（**CA**），它签署**证书**，断言诸如……之类的映射关系。


    ## 11 通信会话建立


    > *敲敲！*

    >

    > *谁啊？*

    >

    > *Alice。*

    >

    > *Alice 谁？*

    >

    > ……你得继续往下读才能找到安全的延续方式……


    本章分析设计实时通信握手时的各种考量。我们从仅进行认证（而不是同时创建会话密钥并对数据进行加密保护）的非常简单的示例握手开始。这类协议适用于简单场景，例如开门，在人们只想以最小的代价用更安全的方式替代明文发送密码时很常见。尽管当今大多数互联网通信都通过
    TLS 完成，但从分析非常简单的握手开始仍然很有启发性。后半部分……


    ## 12 IPsec


    正如我们在第 11 章 *通信会话建立* 中所述，IPsec 是一种运行在网络层第 3 层之上的安全会话协议（参见§11.7 *哪一层？*）。直接运行在第
    3 层（*例如*，IP）上的含义是每个数据包都独立受到加密保护。IPsec 不保证所有数据包都会到达，也不保证到达的数据包会按发送顺序交付。IPsec 只保证未通过完整性检查的数据包将被丢弃，重复的数据包将被丢弃。这种设计使其易于在网络适配器中实现。IPsec
    不需要缓冲数据包。即使数据包乱序到达，IPsec 也能独立处理和交付数据包。IPsec……


