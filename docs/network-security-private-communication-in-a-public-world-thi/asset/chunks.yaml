    \ Bridges, Routers, Switches, and Internetworking ...》的作者。\n\n# 1 简介\n\n那是一个黑暗而多风暴的夜晚。远处传来狗吠声。一个闪亮的物体引起了\
    \ Alice 的注意。一枚钻石袖扣！家里只有一个人买得起钻石袖扣！所以果然是管家干的！Alice 必须警告 Bob。但她如何能在不惊动管家的情况下给 Bob\
