    ## 4 Modes of Operation


    ### 4.1 Introduction


    We’ve covered how to encrypt a 128-bit block with AES, or a 64-bit block with
    DES, and these primitives have the nice property that if an attacker changes any
    part of the ciphertext, the result of a decryption will be effectively a random
    number. Sadly, most useful messages are longer than 128 bits. **Modes of operation**
    are techniques for encrypting arbitrary-sized messages using the block encryption
    algorithms as primitives to be applied iteratively. There are additional desirable
    properties that such algorithms can have. If we send the same message multiple
    times, it would be desirable to have the encrypted message be different each time
    so that an eavesdropper can’t tell that we’re sending the same message ...


    ## 5 Cryptographic Hashes


    ### 5.1 Introduction


    A hash function inputs an arbitrary-sized bitstring and outputs a fixed-size bitstring,
    ideally so that all output values are equally likely. **A cryptographic hash**
    (also known as a **[message digest](#gloss.xhtml#gloss_112)**) has some extra
    security properties:


    *   **preimage resistance**: It should be computationally infeasible to find a
    message that has a given pre-specified hash.


    *   **collision resistance**: It should be computationally infeasible to find
    two messages that have the same hash.


    *   **second preimage resistance**: It should be computationally infeasible to
    find a second message that has the same hash as a given message.


    The term *message digest* was originally more popular, but *[hash](#gloss.xhtml#gloss_084)*
