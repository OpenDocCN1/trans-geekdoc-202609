    ## 14 Electronic Mail Security


    The first thing that springs to mind with the phrase *email security* is a message
    from Alice to Bob signed by Alice with her private key and encrypted with Bob’s
    public key. Lotus Notes had a proprietary, widely deployed implementation of encrypted
    email in 1989. PGP was created and released as open source by Phil Zimmermann
    in 1991. Various email standards for user-to-user signed and encrypted email were
    developed over twenty years ago, including


    *   PEM [RFC 1421—Feb 1993]

    *   PGP/GPG [RFC 2015—October 1996]

    *   S/MIME [RFC 2311—March 1998]


    In the early 1990s, there were deployment barriers such as export controls and
    patents, but these have been resolved. So it is somewhat astonishing that none
    of these, or anything implementing ...


    ## 15 Electronic Money


    Money has a long and storied history as a medium of exchange and a mechanism for
    measuring and storing wealth. Nations control the minting of coins, the printing
    of paper currency, and the quantity of money in circulation, trying hard through
    physical means to avoid counterfeit bills and coins. Nowadays, almost all but
    the smallest payments are made using credit cards, checks, and electronic funds
    transfers. Large cash transactions (suitcases full of money) are usually used
    only for illicit or illegal transactions.


    Forms of electronic money have been common for many years. The Internet is used
    to manage bank accounts, make purchases with credit cards, do wire transfers,
    and pay bills.


