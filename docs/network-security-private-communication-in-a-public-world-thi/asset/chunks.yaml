    ## 12 IPsec


    As we said in [Chapter 11](#ch11.xhtml#ch11) *[Communication Session Establishment](#ch11.xhtml#ch11)*,
    IPsec is a secure session protocol that runs on top of network layer 3 (see§[11.7](#ch11.xhtml#sec11_7)
    *[What Layer?](#ch11.xhtml#sec11_7)*). The implication of running directly on
    layer 3 (*e.g.*, IP) is that each packet is independently cryptographically protected.
    IPsec does not guarantee that all packets will arrive or that those that do arrive
    will be delivered in the order they were sent. IPsec only guarantees that packets
    that do not meet the integrity check will be discarded, and packets that are duplicates
    will be discarded. This design makes it easy to implement in network adapters.
    IPsec does not need to buffer packets. IPsec can process and deliver packets independently,
    even if they arrive out of order. IPsec ...


