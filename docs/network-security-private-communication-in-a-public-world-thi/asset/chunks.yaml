    TLS（传输层安全）中的概念已在第 11 章 *通信会话建立* 中介绍，这些概念与 IPsec 类似。Alice 和 Bob 进行身份认证并为会话建立加密密钥。


    TLS 起源于 Netscape 的 SSL（安全套接字层）协议。当 IETF 接管它以进行改进和标准化时，将其重命名为 TLS（传输层安全）。自称为 TLS
    以来，它已历经三个修订版本，因此最新版本是 1.3（RFC 8446）。TLS 版本为何被命名为 TLS 1.0、TLS 1.1、TLS 1.2 和 TLS
    1.3，而不是 TLS 版本 1、TLS 版本 2、TLS 版本 3 和 TLS 版本 4，甚至为何 TLS 1.0 未被命名为 SSL 版本 4，并没有真正的逻辑可言。大多数……


    ## 14 电子邮件安全


    提到 *电子邮件安全* 一词，首先浮现在脑海中的场景是：Alice 给 Bob 发送一条消息，用她的私钥签名，并用 Bob 的公钥加密。Lotus Notes
    在 1989 年就拥有了加密电子邮件的专有且广泛部署的实现。PGP 由 Phil Zimmermann 于 1991 年创建并作为开源软件发布。二十多年前就开发了多种用于用户间签名和加密电子邮件的标准，包括


    *   PEM [RFC 1421—1993 年 2 月]

    *   PGP/GPG [RFC 2015—1996 年 10 月]

    *   S/MIME [RFC 2311—1998 年 3 月]


    在 1990 年代初期，存在出口管制和专利等部署障碍，但这些问题现已解决。因此，这些标准（或实现……）均未得到广泛部署，这多少令人惊讶。


    ## 15 电子货币


    货币作为交换媒介以及衡量和存储财富的机制，拥有悠久而传奇的历史。国家控制铸币、印制纸币以及货币流通量，并通过物理手段努力防止假钞和假币。如今，除最小额支付外，几乎所有支付均使用信用卡、支票和电子资金转账。大额现金交易（装满钱的手提箱）通常仅用于非法或违法交易。


    电子货币的形式已普及多年。互联网被用于管理银行账户、信用卡购物、电汇和支付账单。


    用于处理货币的新协议……


    ## 16 密码学技巧


    我们已介绍主要的密码学构建模块，如密钥加密和完整性校验、公钥加密和签名、哈希/消息摘要。在本章中，我们将讨论其他一些功能。我们不会深入探讨数学原理或证明，但至少会揭示这些功能试图实现的目标，给出一些关于它们如何实现的直观理解，并列举实际协议中使用的示例。


    ### 16.1 秘密分享


    秘密分享是一种方法，让某人（例如 Alice）存储一段必须对除 Alice 之外的所有人保密、但 Alice 必须能够检索的信息（例如 `S`）。在健壮地存储
    `S` 以便……


    ## 17 通俗认知


    *每次烤肉时，我总是先切掉两头，就像我见祖母那样做。有人曾问我为什么这么做，我意识到我完全不知道。我从未想过要质疑。这只是惯例。后来我终于想起问祖母：“为什么烤肉总要切掉两头？”她回答：“因为我的锅小，否则烤肉放不下。”*


    ——佚名


    许多做法已成为公认的安全实践。大多数是为了避免那些如果你真懂行、可以用其他方式避免的问题。养成这些习惯固然好，但至少知道 *为什么* 这么做会更好。这些问题中有许多……


    ## 术语表


    **访问控制——**一种将某资源的使用限制为授权用户的机制。


    **访问控制集——**访问控制列表的同义词；有人区分二者，认为访问控制集中条目的顺序不重要，而访问控制列表中条目的顺序可能重要。


    **ACL（访问控制列表）——**与资源关联的数据结构，指定授权用户。


    **主动攻击——**攻击者执行除单纯窃听以外的操作，例如发送数据、修改数据或颠覆系统以冒充某个地址。


    **辅助量子比特——**量子计算使用的量子比特，其初始值独立于计算的输入。


    **ANSI—— ……**


