    ## 8 Post-Quantum Cryptography


    As we described in [Chapter 7](#ch07.xhtml#ch07) *[Quantum Computing](#ch07.xhtml#ch07)*,
    a sufficiently large quantum computer implementing Shor’s algorithm would break
    our currently deployed public key algorithms. However, long before that can happen,
    the world will (hopefully) have converted to replacement algorithms. The replacement
    algorithms will be based on math problems that (hopefully) not even a combination
    of classical and quantum computers would be able to solve in a reasonable amount
    of time.


