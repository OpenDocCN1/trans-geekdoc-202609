  \n## 强化学习\n\n强化学习（Reinforcement Learning）关注产生试图实现某些预定义目标的算法（代理）。该目标的实现取决于选择一组动作——对好的行为给予奖励，对坏的行为给予惩罚——“强化”部分源于此。代理在具有状态的环境中行动，给出奖励和一组动作。\n\
  \n![](img/ml-scratch-8----reinforcement-learning.png)\n\n图片来源：[`phrasee.co/`](https://phrasee.co/)*\n\
  \n深度强化学习（使用深度神经网络选择动作）最近取得了一些伟大的成就：\n\n*   [玩 Atari 游戏](https://www.cs.toronto.edu/~vmnih/docs/dqn.pdf)\n\
  *   [玩毁灭战士](https://www.youtube.com/watch?v=oo0TraGu6QY)\n*   [主宰围棋](https://deepmind.com/blog/alphago-zero-learning-scratch/)\n\
  \n### 马尔可夫决策过程\n\n马尔可夫决策过程（MDP）是强化学习问题的数学公式。MDP 满足马尔可夫属性：未来仅取决于现在。\n\n一个 MDP 可以\
  \ `(S, A, R, P, gamma)` 定义，其中：\n\n*   `S`：状态集\n*   `A`：动作集\n*   `R`：奖励\n*   `P`：下一状态的概率分布\n\
  *   `gamma`：折扣因子\n\n折扣因子 `gamma` 让我们认为未来比现在更有价值。\n\n### 学习\n\n强化学习中的学习是这样发生的：\n\n\
  1.  环境给出一个状态。\n2.  代理选择一个动作。\n3.  环境给出一个奖励。\n4.  持续直到达到目标。\n\n目标是找到一个使累积奖励最大最优策略\
  \ `pi*`。策略 `pi` 是将状态 `s` 映射到动作 `a` 的函数。\n\n### 价值函数\n\n价值函数给出代理从状态 `s` 开始并遵循策略 `pi`\
  \ 所获得的期望回报。\n\n```\nV_pi(s) = E_pi[sum_{k=0}^{infinity} gamma^k R_{t+k} | S_t =\
  \ s]\n```\n\n存在一个最优价值函数，它对所有状态都具有最高值。定义为：\n\n```\nV*(s) = max_pi V_pi(s) for all\
  \ s in S\n```\n\n### Q 函数\n\n同样，让我们定义另一个名为 `Q` 函数（状态-动作值），它给出从状态 `s` 开始采取动作 `a`\
  \ 并遵循策略 `pi` 的期望回报。\n\n```\nQ_pi(s, a) = E_pi[sum_{k=0}^{infinity} gamma^k R_{t+k}\
  \ | S_t = s, A_t = a]\n```\n\n你可以将 `Q` 函数看作给定状态下动作的质量。我们可以定义最优 `Q` 函数为：\n\n```\n\
  Q*(s, a) = max_pi Q_pi(s, a) for all s in S\n```\n\n两个最优函数 `V*` 和 `Q*` 之间存在关系。它由下给出：\n\
  \n```\nV*(s) = max_a Q*(s, a) for all s in S\n```\n\n\n\n\n我们可以通过选择能为状态 ![s](img/equation167.png)\
  \ 提供最大奖励 ![Q*(s, a)](img/equation166.png) 的动作 ![a](img/equation165.png) 来找到最优策略\
  \ ![pi^*](img/equation164.png)：images/equation168.png\n\n这似乎是目前定义的所有函数之间的协同。更重要的是，我们现在可以为给定环境构建一个最优智能体。这在实践中可以实现吗？\n\
  \n## ![Q](img/equation169.png)-学习\n\n`Q-Learning` 是一种用于[时序差分学习](https://en.wikipedia.org/wiki/Temporal_difference_learning)\
  \ 的离策略算法。事实证明，通过足够的训练，它以概率 1 收敛到任意目标策略的动作值函数的近似。即使在使用探索性（随机）策略选择动作时，它也能学习最优策略。\n\
  \n给定一个状态 ![s](img/equation170.png) 和动作 ![a](img/equation171.png)，我们可以递归地表示 ![Q(s,\
  \ a)](img/equation172.png)：\n\nQ(s, a) = r + \\gamma \\max_{a'}Q(s', a')/equation173.png\n\
  \n这是**贝尔曼方程**。它将未来奖励定义为智能体在状态 ![s](img/equation175.png) 时获得的奖励 ![r]，加上对于状态 ![s'](img/equation176.png)\
  \ 的最大未来奖励。\n\n我们将 ![Q](img/equation177.png)-学习定义为 ![Q^*](img/equation178.png) 的迭代近似，使用贝尔曼方程：\n\
  \nQ_{t+1}(s\\_t, a\\_t) = Q\\_t(s\\_t, a\\_t) + \\alpha(r_{t+1} + \\gamma \\max_{a}Q\\\
  _t(s_{t + 1}, a) - Q\\_t(s\\_t, a\\_t))/images/equation179.png\n\n其中 ![alpha](img/equation180.png)\
  \ 是学习率，控制旧 Q 值与新值之间差异的大小。\n\n这是我们要实现的通用算法：\n\n1. 初始化 ![Q](img/equation181.png)-值表\n\
  2. 观察初始状态 ![s](img/equation182.png)\n3. 选择动作 ![a](img/equation183.png) 并执行\n4. 观察奖励\
  \ ![r](img/equation184.png) 和新状态 ![s'](img/equation185.png)\n5. 使用 ![r](img/equation187.png)\
  \ 和来自 ![s'](img/equation188.png) 的最大奖励更新 ![Q](img/equation186.png) 表\n6. 将当前状态设置为新状态，并从\
  \ `第 2 步` 重复直到达到终止状态\n\n注意，![Q](img/equation189.png)-学习只是解决强化学习问题的可能算法之一。[这是其中一些算法的对比](https://en.wikipedia.org/wiki/Reinforcement_learning#Comparison_of_reinforcement_learning_algorithms)。\n\
  \n## 探索 vs 开发\n\n你可能已经注意到我们简述了选择动作的策略。你实现的任何策略都必须选择尝试新事物或使用已知内容的频率。这被称为探索与开发的权衡。\n\
  \n- 探索（Exploration）：寻找有关环境的新信息。\n- 开发（Exploitation）：利用现有信息最大化奖励。\n\n记住，我们强化学习智能体的目标是最大化期望累计奖励。这对我们的自动驾驶出租意味着什么？\n\
  \n最初，我们的驾驶智能体对于接送乘客的最优驾驶路线几乎一无所知。它还应该学会避免异常区域，因为那些地方对生意不利（乘客在那些往往消失甚至糟糕）！期间，我们预计会进行大量的探索。\n\
  \n在获得一些经验后，智能体可以使用它更频繁地选择动作。最终，所有选择将基于所学知识。\n\n### 在末日世界中驾驶\n\n![](img/ml-scratch-8----environment.png)\n\
  \n你的伙伴勾画了这张地图。每个区块代表城市的一个小区域。异常区域用亮圈标记。这四个字母是发生接客和送客的“安全区域”。\n\n假设你的车是城市里唯一的车辆。我们可以将其分解为\
  \ 5x5 的网格，共有 25 个单元格。每个区块代表城市的小区域。\n\n## 什么是 Gym？\n\n> Gym 是一个用于开发和比较强化学习算法的工具包。它提供了一个统一且易于使用的接口。在这里，我们将查看注册：\n\
  \n```python\nregister(\n    id='SafeCab-v0',\n    entry_point=f\"{__name__}:SafeCab\"\
  ,\n    timestep_limit=100,\n )\n```\n\n## 环境\n\n`Gym` 提供了一个统一且易于使用的接口。让我们来看看编码后的环境：\n\
  \n```python\nenv.reset()\nenv.render()\n\nprint(\"Action Space {}\".format(env.action_space))\n\
  print(\"State Space {}\".format(env.observation_space))\n```\n\nimages/ml-scratch-8----environment.png)\n\
  \n```\nAction Space Discrete(6)\nState Space Discrete(500)\n```\n\n\n\n\n```python\n\
  \ def __init__(\n   self,\n   n_states,\n   n_actions,\n   decay_rate=0.0001,\n\
  \   learning_rate=0.7,\n   gamma=0.618\n ):\n   self.n_actions = n_actions\n   self.q_table\
  \ = np.zeros((n_states, n_actions))\n   self.max_epsilon = 1.0\n   self.min_epsilon\
  \ = 0.01\n   self.epsilon = self.max_epsilon\n   self.decay_rate = decay_rate\n\
  \   self.learning_rate = learning_rate\n   self.gamma = gamma # discount rate\n\
  \   self.epsilons_ = []\n```\n\n`__init__` 中有趣的部分是初始化我们的 ![Q](img/leanpub_equation_190.png)表。初始情况下，它全为零。我们可以用其他方式初始化它吗？\n\
  \n```python\n def choose_action(self, explore=True):\n   exploration_tradeoff =\
  \ np.random.uniform(0, 1)\n\n   if explore and exploration_tradeoff < self.epsilon:\n\
  \     # 探索\n     return np.random.randint(self.n_actions)\n   else:\n     # 利用（针对该状态获取最大的\
  \ Q 值）\n     return np.argmax(self.q_table[state, :])\n```\n\n我们的策略相当简单。我们从 ![0](img/leanpub_equation_191.png)\
  \ 到 ![1](img/leanpub_equation_192.png) 之间的均匀分布中抽取一个随机数。如果这个数字小于 `epsilon` 且我们想要探索，我们就采取一个随机动作。否则，我们根据当前的知识采取最佳动作。\n\
  \n```python\n def learn(\n   self,\n   state,\n   action,\n   reward,\n   next_state,\n\
  \   done,\n   episode\n ):\n   # Update Q(s,a):= Q(s,a) + lr [R(s,a) + gamma * max\
  \ Q(s',a') - Q(s,a)]\n   self.q_table[state, action] = self.q_table[state, action]\
  \ + \\\n     self.learning_rate * (reward + self.gamma * \\\n       np.max(self.q_table[new_state,\
  \ :]) - self.q_table[state, action])\n\n   if done:\n     # 随着时间的推移减少探索率\n     self.epsilon\
  \ = self.min_epsilon + (self.max_epsilon - self.min_epsilon) * \\\n       np.exp(-self.decay_rate\
  \ * episode)\n     self.epsilons_.append(self.epsilon)\n```\n\n学习涉及使用 ![Q](img/leanpub_equation_194.png)\
  \ 来更新 ![Q](img/leanpub_equation_193.png)表，并降低 `epsilon`](images/leanpub_equation_195.png)\
  \ 速率。\n\n### 训练\n\n现在智能体已经就绪，我们可以训练它了。以下是注册环境并对其训练 5000 个回合的方法：\n\n```python\n total_episodes\
  \ = 5000\n test_episodes = 10\n agent = Agent(env.observation_space, env.action_space)\n\
  \n for episode in range(total_episodes):\n    state = env.reset()\n    episode_rewards\
  \ = []\n    while True:\n        action = agent.choose_action()\n        new_state,\
  \ reward, done, info = env.step(action)\n        agent.learn(\n            state,\n\
  \            action,\n            reward,\n            new_state,\n            done,\n\
  \            episode\n        )\n        state = new_state\n        episode_rewards.append(reward)\n\
  \        if done:\n            break\n    rewards.append(np.mean(episode_rewards))\n\
  ```\n\n注意，学习曲线随着训练的进行变得更加平滑。请看：\n\n![images/ml-scratch-8.png\n\n### \n\n注意，我们希望智能体只使用它已有的经验，因此我们设置了\
  \ `explore=False`。以下是每个回合的总奖励情况：\n\n![images/ml-scratch-8.png\n\n我知道这张图可能无法让你直观地了解智能体的能力。这里有一段它在城市中行驶的视频：\n\
