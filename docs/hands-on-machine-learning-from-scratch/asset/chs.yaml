  | Thalía || 2071 || 792 || 324663 |\n| U2 || 1094 || 511 || 320725 |\n| Blur ||\
  \ 1905 || 203 || 257978 |\n| Paramore || 1664 || 498 || 227829 |\n\n### 探索\n\n让我们看看每个艺术家被用户播放的次数：\n\
