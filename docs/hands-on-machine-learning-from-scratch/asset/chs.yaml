  \ Regression` 笔记本](https://colab.research.google.com/drive/1DXkpo9PmH9_HiCSz9NQlZ9vGQtMIYqmF)\
  \ 源代码。\n\n\n\n\n\n```python\nclass Node:\n    def __init__(self, x, y, idxs, min_leaf=5):\n\
  \        self.x = x\n        self.y = y\n        self.idxs = idxs\n        self.min_leaf\
  \ = min_leaf\n        self.row_count = len(idxs)\n        self.col_count = x.shape[1]\n\
  \        self.val = np.mean(y[idxs])\n        self.score = float('inf')\n      \
  \  self.find_varsplit()\n```\n\n树是递归数据结构，而我们将充分利用这一点。我们的 `Node` 类代表了模型中的某一个决策点。模型中的每个划分都有寻找解决方案的\
  \ 2 种可能结果——向左走或向右走。该决策点还会将我们的数据划分为两个集合。\n\n属性 `idxs` 存储了该 `Node` 正在处理的数据子集的索引。\n\
  \n决策（预测）是基于 `Node` 持有的值。为了做出该预测，我们只需要取该 `Node` 依赖变量数据的平均值即可。\n\n`find_varsplit`\
  \ 方法寻找我们应该在哪里划分数据。让我们来看它：\n\n```python\ndef find_varsplit(self):\n    for c in range(self.col_count):\
  \ self.find_better_split(c)\n    if self.is_leaf: return\n    x = self.split_col\n\
  \    lhs = np.nonzero(x <= self.split)[0]\n    rhs = np.nonzero(x > self.split)[0]\n\
  \    self.lhs = Node(self.x, self.y, self.idxs[lhs], self.min_leaf)\n    self.rhs\
  \ = Node(self.x, self.y, self.idxs[rhs], self.min_leaf)\n```\n\n首先，我们尝试寻找一个更好的特征进行划分。如果没有找到这样的特征（即我们处于叶子节点），我们什么都不做。然后，我们使用由\
  \ `find_better_split` 找到的划分值，创建左右节点的数据，并使用数据的子集创建每一个节点。\n\n以下是 `split_col` 和 `is_leaf`\
  \ 的实现：\n\n```python\n@property\ndef split_col(self): return self.x.values[self.idxs,self.var_idx]\n\
  \n@property\ndef is_leaf(self): return self.score == float('inf')\n```\n\n现在是时候实现我们算法的核心骨架\
  \ `find_better_split` 方法了：\n\n```python\ndef find_better_split(self, var_idx):\n\
  \    x = self.x.values[self.idxs, var_idx]\n\n    for r in range(self.row_count):\n\
  \        lhs = x <= x[r]\n        rhs = x > x[r]\n        if rhs.sum() < self.min_leaf\
  \ or lhs.sum() < self.min_leaf: continue\n\n        curr_score = self.find_score(lhs,\
  \ rhs)\n        if curr_score < self.score:\n            self.var_idx = var_idx\n\
  \            self.score = curr_score\n            self.split = x[r]\n\ndef find_score(self,\
  \ lhs, rhs):\n    y = self.y[self.idxs]\n    lhs_std = y[lhs].std()\n    rhs_std\
  \ = y[rhs].std()\n    return lhs_std * lhs.sum() + rhs_std * rhs.sum()\n```\n\n\
  我们正尝试对每个数据点进行划分，并让最好的划分胜出。\n\n我们将创建一个划分，使其标准差尽可能低。我们找到使标准差加权平均最小的划分，这等同于最小化 RMSE。\n\
  \n如果我们找到了更好的划分，就会存储以下信息：变量索引、划分得分和划分值。\n\n得分是一个告诉我们划分有效性的指标（注意，叶子节点没有分数，因此它将是无穷大）。`find_score`\
  \ 方法计算数据的加权平均值。如果得分低于之前的，说明我们有了更好的划分。注意，分数最初被设置为无穷大 -> 只有叶子节点和非常浅的树（以及灭霸 Thanos）会有无穷大的分数。\n\
  \n最后，让我们看看如何利用所有这一切来做预测：\n\n```python\ndef predict(self, x):\n    return np.array([self.predict_row(xi)\
  \ for xi in x])\n\ndef predict_row(self, xi):\n    if self.is_leaf: return self.val\n\
  \    node = self.lhs if xi[self.var_idx] <= self.split else self.rhs\n    return\
  \ node.predict_row(xi)\n```\n\n再次，我们正在利用生命的递归特性。从树根开始，`predict_row` 根据我们找到的划分值检查我们需要向左节点还是右节点移动。一旦遇到叶子节点，递归就会结束。在此时，答案/预测被存储在\
  \ `val` 属性中。\n\n这是我们 `Node` 类的完整源码：\n\n```python\nclass Node:\n    def __init__(self,\
  \ x, y, idxs, min_leaf=5):\n        self.x = x\n        self.y = y\n        self.idxs\
  \ = idxs\n        self.min_leaf = min_leaf\n        self.row_count = len(idxs)\n\
  \        self.col_count = x.shape[1]\n        self.val = np.mean(y[idxs])\n    \
  \    self.score = float('inf')\n        self.find_varsplit()\n\n    def find_varsplit(self):\n\
  \        for c in range(self.col_count): self.find_better_split(c)\n        if self.is_leaf:\
  \ return\n        x = self.split_col\n        lhs = np.nonzero(x <= self.split)[0]\n\
  \        rhs = np.nonzero(x > self.split)[0]\n        self.lhs = Node(self.x, self.y,\
  \ self.idxs[lhs], self.min_leaf)\n        self.rhs = Node(self.x, self.y, self.idxs[rhs],\
  \ self.min_leaf)\n\n    def find_better_split(self, var_idx):\n        x = self.x.values[self.idxs,\
  \ var_idx]\n\n        for r in range(self.row_count):\n            lhs = x <= x[r]\n\
  \            rhs = x > x[r]\n            if rhs.sum() < self.min_leaf or lhs.sum()\
  \ < self.min_leaf: continue\n\n            curr_score = self.find_score(lhs, rhs)\n\
  \            if curr_score < self.score:\n                self.var_idx = var_idx\n\
  \                self.score = curr_score\n                self.split = x[r]\n\n\
  \    def find_score(self, lhs, rhs):\n        y = self.y[self.idxs]\n        lhs_std\
  \ = y[lhs].std()\n        rhs_std = y[rhs].std()\n        return lhs_std * lhs.sum()\
  \ + rhs_std * rhs.sum()\n\n    @property\n    def split_col(self): return self.x.values[self.idxs,self.var_idx]\n\
  \n    @property\n    def is_leaf(self): return self.score == float('inf')\n\n  \
  \  def predict(self, x):\n        return np.array([self.predict_row(xi) for xi in\
  \ x])\n\n    def predict_row(self, xi):\n        if self.is_leaf: return self.val\n\
  \        node = self.lhs if xi[self.var_idx] <= self.split else self.rhs\n     \
  \   return node.predict_row(xi)\n```\n\n\n\n\n\n一种方法是前往 `PROs` 分享作品的地方。像 [Dribbble](https://dribbble.com/)、[uplabs](https://www.uplabs.com/)\
  \ 和 [Behance](https://www.behance.net/) 这样的页面有很多优秀素材。\n\n在找到你喜欢的模型稿后，你可能想从中提取颜色并使用它们。这可能需要打开专门的软件，使用某些工具手动挑选颜色，以及其他现成的小技巧。让我们使用机器学习来让你的生活变得简单吧。\n\
  \n[**完整源代码笔记本**](https://colab.research.google.com/drive/1_p1nptDfvJhcSvprmi1WtoIugsCI40Xa)\n\
  \n## 无监督学习\n\n到目前为止，我们只看了需要特征和标签形式的训练数据的模型。换句话说，对于每个示例，我们都需要对应的正确答案。\n\n通常，这种训练数据很难获得，需要人类花费许多小时的人工工作（是的，我们已经在服务于“终结者”了）。我们可以跳过所有这一切吗？\n\
  \n可以，至少对于某些问题，我们可以在不知道正确答案的情况下使用示例数据。其中一个问题就是 `聚类`。\n\n### 什么是聚类？\n\n给定一组数据点向量 ![X](img/leanpub_equation_48.png)，聚类方法允许你将每个点放入一个组中。换句话说，你可以根据它们的属性自动对一组实体进行分类。\n\
  \n是的，这在实践中非常有用。通常，你在一组数据点上运行算法并指定你想要的组数。例如，你的收件箱包含两类邮件：垃圾邮件和非垃圾邮件（你还在等别的吗？）。你可以让聚类算法从你的邮件创建两个组，然后用你聪明的大脑来分类哪些是什么。\n\
  \n聚类算法的其他应用：\n\n*   `客户细分` - 寻找消费/行为相同的用户群体\n*   `欺诈交易` - 寻找属于不同簇的银行交易并将其识别为欺诈交易\n\
  *   `文档分析` - 将相似的文档分组\n\n### 数据\n\n![](img/4_data-preview.png) *来源：https://www.uplabs.com/\
  \ 上的作者*\n\n这一次，我们的数据并非来自某些预定义的或著名的数据集。由于无监督学习不需要标记数据，互联网可以成为你的舞台。\n\n在这里，我们将使用来自不同作者的\
  \ 3 个移动 UI 设计。我们的模型将在每个截图上运行，并尝试为每个设计提取色板。\n\n### 什么是 K-Means 聚类？\n\nK-Means 聚类由\
  \ [Wikipedia](https://en.wikipedia.org/wiki/K-means_clustering) 定义为：\n\n> 均聚类是一种向量量化方法，源自信号处理，在数据挖掘的聚类分析中非常流行。k\
  \ 聚类的目标是将 n 个观测值划分 k 个簇，其中每个观测属于均值最近的簇，该均值作为簇的原型。这导致数据空间被划分为沃罗伊单元。\n\n维基百科还告诉我们，解决\
  \ K-Means 聚类是困难的（实际上是 [NP-hard](https://en.wikipedia.org/wiki/NP-hardness)），但我们可以使用一些启发式方法找到局部最优解。\n\
  \n但 `K-Means 聚类` 是如何工作的？\n\n假设你有一些向量 ![X](img/leanpub_equation_49.png)，其中包含 ![n](img/leanpub_equation_50.png)\
  \ 个数据点。运行我们的算法包含以下步骤：\n\n1.  从 ![X](img/leanpub_equation_52.png) 中随机选取 ![k](img/leanpub_equation_51.png)\
  \ 个点（称为 `centroids`）\n2.  将每个点分配给最近的质心。新形成的点集被称为 `cluster`。\n3.  对于每个簇，通过从点计算新中心来找到新的质心\n\
  4.  重复步骤 2-3 直到质心停止变化\n\n让我们看看如何使用它从移动 UI 截图中提取色板。\n\n### 数据预处理\n\n由于我们的数据存储在原始像素中（称为图像），我们需要一种方法将其转换为聚类算法可以使用的点。\n\
  \n让我们先定义两个类来表示点和簇：\n\n```\n1 class Point:\n2 \n3   def __init__(self, coordinates):\n\
  4     self.coordinates = coordinates\n```\n\n我们的 `Point` 只是每个点坐标的容器。\n\n```\n1 class\
  \ Point:\n2 \n3   def __init__(self, coordinates):\n4     self.coordinates = coordinates\n\
  ```\n\n`Cluster` 由其中心定义。\n\n```\n1 class Cluster:\n2 \n3   def __init__(self, center):\n\
  4     self.center = center\n```\n\n给定一个路径，我们可以如下创建点：\n\n```\n1 def get_points(path):\n\
  2   img = Image.open(path)\n3   w, h = img.size\n4   points = []\n5   for x in range(w):\n\
  6     for y in range(h):\n7       points.append(img.getpixel((x, y)))\n8   return\
  \ points\n```\n\n发生了几件事：\n\n*   `load` 加载图像\n*   `resize` 透明度\n*   `drop` 信息\n\n\
  ### 距离函数\n\n注意，虽然 `Euclidean` 距离很简单，但它可能不是最好的方法。这里是 Python 的实现：\n\n```\n1 def euclidean(p,\
  \ q):\n2   n_dim = len(p.coordinates)\n3   return sqrt(sum([\n4       p.coordinates[i]\
  \ - q.coordinates[i]) ** 2 for i in range(n_dim))\n5   \n```\n\n### 实现 K-Means 聚类\n\
  \n现在你已经有了拼图的碎片，可以实现 K-Means 算法了。让我们从寻找点中心的方法开始：\n\n```\n1 def calculate_center(self,\
  \ points):\n2   n_dim = len(points[0].coordinates)\n3   vals = [0.0 for i in range(n_dim)]\n\
  4   for p in points:\n5     for i in range(n_dim):\n6       vals[i] += p.coordinates[i]\n\
  7   coords = [v / len(points) for v in vals]\n8   return Point(coords)\n```为了找到点的中心，我们将每个维度的值相加并除以点的数量。\n\
  \n现在寻找实际的簇：\n\n```\n1 def assign_points(self, clusters, points):\n2   plists = [[]\
  \ for i in range(self.n_clusters)]\n3 \n4   for p in points:\n5     smallest_distance\
  \ = float('inf')\n6 \n7     for i in range(self.n_clusters):\n8       distance =\
  \ euclidean(p, clusters[i].center)\n9       if distance < smallest_distance:\n10\
  \         smallest_distance = distance\n11         idx = i\n12 \n13     plists[idx].append(p)\n\
  14 \n15   return plists\n16 \n17 def fit(self, points):\n18   clusters = [Cluster(center=p,\
  \ points=[p]) for p in random.sample(points, self.n_clusters)]\n20 \n21   while\
  \ True:\n22 \n23     plists = self.assign_points(clusters, points)\n24 \n25    \
  \ diff = 0\n26 \n27     for i in range(self.n_clusters):\n28       if not plists[i]:\n\
  29         continue\n30       old = clusters[i]\n31       center = self.calculate_center(plists[i])\n\
  32       new = Cluster(center, plists[i])\n33       clusters[i] = new\n34      \
  \ diff = max(diff, euclidean(old.center, new.center))\n35 \n36     if diff < self.min_diff:\n\
  37       break\n38 \n39   return clusters\n```\n\n实现遵循了上述算法的描述。注意，当颜色差异低于我们设置的数值时，我们将退出训练循环。\n\
  \n\n\n\n\n### 评估 (Evaluation)\n\n现在你已经实现了一个 K-Means 聚类，可以将其用于 UI 截图了。我们需要编写少量的“胶水代码”为了更容易提取调色板：\n\
  \n```\n1 def rgb_to_hex(rgb):\n2   return '#%s' % ''.join(('%02x' % p for p in rgb))\n\
  3 \n4 def get_colors(filename, n_colors=3):\n5   points = get_points(filename)\n\
  6   clusters = KMeans(n_clusters=n_colors).fit(points)\n7   clusters.sort(key=lambda\
  \ c: len(c.points), reverse = True)\n8   rgbs = [map(int, c.center.coordinates)\
  \ for c in clusters]\n9   return list(map(rgb_to_hex, rgbs))\n```\n\n`get_colors`\
  \ 函数接收图像文件的路径以及你想从图像中提取的颜色数量。我们根据算法获得的聚类按照每个类中的点进行排序（降序）。最后，我们将 RGB 颜色转换为十六进制值。\n\
  \n让我们从数据中提取第一个 UI 截图的调色板：\n\n```\n1 colors = get_colors('ui1.png', n_colors=5)\n\
  2 \", \".join(colors)\n```\n\n这里是十六进制颜色值：\n\n```\n1 #f9f8fa, #4252a6, #fc6693, #bdbcd0,\
  \ #374698\n```\n\n这里是我们结果的可视化表示：\n\n![](img/4_palette-1.png)\n\n对接下来两张图像运行聚类，我们得到了以下结果：\n\
  \n![](img/4_palette-2.png)\n\n最后一张截图：\n\n![](img/4_palette-3.png)\n\n嗯，看起来很酷，对吧？去在你自己的图片上试试吧！\n\
