  \n## 推荐系统\n\n推荐系统（RS）几乎应用于任何有一系列物品供选择的地方。它们通过提供建议来工作，帮助你做出更好的选择。你可能觉得这很神奇，但 RS 利用了用户之间的共同模式来推荐东西。\n\
  \n最常用的推荐系统类型是基于内容的（Content-Based）和协同过滤（Collaborative Filtering）。\n\n### 协同过滤 (CF)\n\
  \n协同过滤（CF）是推荐引擎的核心。该算法的优点在于它可以进行特征学习。CF 可以分为：基于内存的协同过滤（Memory-Based）和基于模型的协同过滤（Model-Based）。\n\
  \n#### 基于内存的协同过滤\n\n基于内存的 CF 方法分为两个部分：用户过滤和物品过滤。这里的区别如下：\n\n* 物品过滤：“喜欢此物品的用户也喜欢……”\n\
  * 用户过滤：“与你相似的用户（你从未认识的朋友）也喜欢……”这两种方法都需要包含评分的用户-物品矩阵。由此，你可以计算相似性矩阵。\n\n物品协同过滤的相似性值通过考虑评分过该物品的所有用户来计算。\n\
  \n用户协同过滤的相似性值通过观察用户评分的所有物品来计算。\n\n#### 基于模型的协同过滤\n\n基于模型的 CF 方法基于矩阵分解 [MF](https://en.wikipedia.org/wiki/Matrix_factorization_(recommender_systems)。它们比基于内存的方法更好地处理扩展性和稀疏性问题。MF\
  \ 的目标是从已知评分中学习用户的偏好和物品属性，然后通过用户和物品特征的点积预测未知评分。\n\n矩阵分解将用户-物品矩阵重构为低秩矩阵。你可以通过两个低秩矩阵的乘积来表示它。你希望这个矩阵尽可能地接近原始矩阵。这样，你就可以预测原始矩阵中的缺失项。\n\
  \n###### 奇异值分解\n\n协同过滤可以通过使用奇异值分解（SVD）来近似矩阵 ![X](img/leanpub_equation_72.png)。在\
  \ [Netflix 赛赛](https://medium.com/netflix-techblog/netflix-recommendations-beyond-the-5-stars-part-1-55838468f429)中，获胜团队使用了\
  \ SVD 矩阵分解模型。SVD 可以表示为：\n\n![X = USV^T](img/leanpub_equation_73.png)\n\n给定 ![m \\\
  times n](img/leanpub_equation_74.png)矩阵 ![X](img/leanpub_equation_75.png)：\n\n*\
  \ ![U](img/leanpub_equation_76.png)是 ![(m \\times r)](img/leanpub_equation_77.png)正交矩阵\n\
  \n\n\n\n\n*   ![S](img/leanpub_equation_78.png)是一个 ![(r \\times r)](img/leanpub_equation_79.png)对角线上为非负实数的对角矩阵\n\
  *   ![V^T](img/leanpub_equation_80.png)是一个 ![(r \\times n)](img/leanpub_equation_81.png)正交矩阵\n\
  \n其中 ![U](img/leanpub_equation_82.png)代表用户的特征向量，![V](img/leanpub_equation_83.png)代表物品的特征向量，![S](img/leanpub_equation_84.png)对角线上的元素被称为`奇异值`。\n\
  \n你可以通过取 ![U](img/leanpub_equation_85.png)、![S](img/leanpub_equation_86.png)和![V^T](img/leanpub_equation_87.png)的点积来预测。这是一个在\
  \ Python 中实现 SVD 的快速示例：\n\n```\n1 import scipy.sparse as sp\n2 from scipy.sparse.linalg\
  \ import svds\n3 \n4 U, S, VT = svds(user_item_ratings, k =20)\n5 S_diagonal = np.diag(S)\n\
  6 Y_hat = np.dot(np.dot(U, S_diagonal), VT)\n```\n\n##推荐艺术家\n\n虽然互联网上的大多数教程关注基于内存的方法，但它们在实践中并不常用。尽管它们能产生良好的结果，但扩展性不好，并且受到[冷启动](https://en.wikipedia.org/wiki/Cold_start)问题的影响。\n\
  \n另一方面，应用 `SVD` 需要对用户物品矩阵进行分解，当矩阵非常稀疏时（缺失大量的用户物品评分），这种开销很大。此外，经常需要填充缺失值，因为当数据缺失时\
  \ `SVD` 无法工作。这会显著增加数据量和算法的运行时间。\n\n最近的方法关注通过最小化关于隐含特征矩阵 $P$ 和 $Q$ 的正则误差来预测评分：\n\n\
  $$\\displaystyle \\min_{Q*, P*} \\sum_{(u, i) \\in K}(r_{ui} - P_{u}^{T}Q_i)² +\
  \ \\lambda(||Q\\_i||² + ||P\\_u||²)(images/leanpub_equation_88.png)$$\n\n其中 ![K](img/leanpub_equation_89.png)是一组\
  \ (u, i)对，![r(u, i)](img/leanpub_equation_91.png)是用户 ![u](img/leanpub_equation_92.png)对物品\
  \ ![i] 的评分，![lambda](img/94.png) 是正则化项（用于防止过拟合）。我们的模型训练包括最小化正则误差。在估计 ![P](img/leanpub_equation_95.png)和\
  \ ![Q](img/leanpub_equation_96.png)后，你可以通过用户和物品隐含特征的点积来预测未知评分。\n\n我们可以应用[随机梯度下降\
  \ (SGD)](https://en.wikipedia.org/wiki/Stochastic_gradient_descent)或[交替最小二乘法 (ALS)](https://www.quora.com/What-is-the-Alternating-Least-Squares-method-in-recommendation-systems-And-why-does-this-algorithm-work-intuition-behind-this)来最小化损失函数。两种方法都可以在新评分进入时增量地更新我们的模型（在线学习）。\n\
  \n在这里我们将实现 `SGD`，因为它似乎比 ALS](http://cs229.stanford.edu/proj2014/Christopher%20Aberger,%20Recommender.pdf)[通常更快且更准确]。作为一个额外的奖励，`SGD`\
  \ 被广泛用于训练深度神经网络（我们稍后会讨论）。因此，该算法有很多高质量的实现。\n\n### 预处理\n\n为了应用 CF 算法，我们需要将数据集转换为用户-艺术家计数矩阵。让我们先进行数据缩放到处理：\n\
  \n```\n1 pc = ap.playCount\n2 play_count_scaled = (pc - pc.min()) / (pc.max() -\
  \ pc.min())\n3 \n4 ap = ap.assign(playCountScaled=play_count_scaled)\n```\n\n这将播放次数压缩到\
  \ [0 - 1] 范围内并为我们的数据框添加了新列。让我们构建“评分”数据框：\n\n```\n1 ratings_df = ap.pivot(\n2   \
  \  index='userID',\n3     columns='artistID',\n4     values='playCountScaled'\n\
  5 )\n6 \n7 ratings = ratings_df.fillna(0).values\n```\n\n我们使用 Pandas 的 [pivot](https://pandas.pydata.org/pandas-docs/stable/reference/api/pandas.DataFrame.pivot.html)\
  \ 方法创建索引/列数据框，并用 `0` 填充缺失的播放次数。\n\n让我们看看数据框有多稀疏：\n\n```\n1 sparsity = float(len(ratings.nonzero()[0]))\n\
  2 sparsity /= (ratings.shape[0] * ratings.shape[1])\n3 sparsity *= 100\n4 print('{:.2f}%'.format(sparsity))\n\
  ```\n\n```\n1 0.28%\n```\n\n我们的数据集看起来非常稀疏。接下来，将数据分为训练集和验证集：\n\n```\n1 train, val\
  \ = train_test_split(ratings)\n```\n\n在这里，我们稍微不同地定义了 `train_test_split` 函数：\n\n\
  ```\n 1 MIN_USER_RATINGS = 35\n 2 DELETE_RATING_COUNT = 15\n 3 \n 4 def train_test_split(ratings):\n\
  \ 5     validation = np.zeros(ratings.shape)\n 6     train = ratings.copy()\n 7\
  \ \n 8     for user in range(ratings.shape[0]):\n 9         if len(ratings[user,:].nonzero()[0])\
  \ >= MIN_USER_RATINGS:\n10             val_ratings = np.random.choice(\n11     \
  \          ratings[user,:].nonzero()[0],\n12               size=DELETE_RATING_COUNT,\n\
  13               replace=False\n14             )\n15             train[user,val_ratings]\
  \ = 0\n16             validation[user,val_ratings]\n```\n\n这和你预期的不同。我们通过替换移除部分现有评分。\n\
  \n### 测量误差\n\n评估推荐系统准确性的最流行的指标之一是均方根误差 (RMSE)，定义为：\n\n$$\\text{RMSE} = \\sqrt{\\\
  frac{1}{N}\\sum(y_i - \\hat{y}_i)²}(images/leanpub_equation_97.png)$$\n\n其中 ![y](img/leanpub_equation_98.png)\
  \ 是物品的真实值，![hat{y}_i](img/leanpub_equation_99.png) 是预测值，$N$ 是训练集的大小。[关于更多指标的讨论可以在这里找到](https://www.microsoft.com/en-us/research/evaluating-recommender-systems/)。\n\
  \n这是 Python 版的 *RMSE*：\n\n```python\ndef rmse(prediction, ground_truth):\n    prediction\
  \ = prediction[ground_truth.nonzero()[0]]\n    ground_truth = ground_truth[ground_truth.nonzero()[0]]\n\
  \    return sqrt(mean_squared_error(prediction, ground_truth))\n```\n\n### 训练\n\n\
  让我们 SGD 训练我们的推荐系统：\n\n```\n 1 fit(self, X_train, X_val):\n 2   m, n = X_train.shape\n\
  \ 3 \n 4   self.P = 3 * np.random.rand(self.n_latent_features, m)\n 5   self.Q =\
  \ 3 * np.random.rand(self.n_latent_features, n)\n 6 \n 7   self.train_error = []\n\
  \ 8   self.val_error = []\n 9 \n10   users, items = X_train.nonzero()\n 11   \n\
  12   for epoch in range(self.n_epochs):\n 13       for u, i in zip(users, items):\n\
  \ 14           error = X_train[u, i] - self.predictions(self.P[:,u], self.Q[:,i])\n\
  \ 15           self.P[:, u] += self.learning_rate * \\\n 16               (error\
  \ * self.Q[:, i] - self.lmbda * self.P[:, u])\n 17           self.Q[:, i] += self.learning_rate\
  \ * \\\n 18               (error * self.P[:, u] - self.lmbda * self.Q[:, i])\n 19\
  \   \n 20       train_rmse = rmse(self.predictions(self.P, self.Q), X_train)\n 21\
  \       val_rmse = rmse(self.predictions(self.P, self.Q), X_val)\n 22       self.train_error.append(train_rmse)\n\
  \ 23       self.val_error.append(val_rmse)\n```\n\n\n\n\n正如我们之前讨论的，我们通过对转置后的 ![P](img/leanpub_equation_103.png)矩阵与\
  \ ![Q](img/ml-scratch-7----train-error.png)\n\n我们的模型似乎在逐渐训练，随着 epoch 数量的增加，误差都在下降。请注意，你可能想花费更多时间来训练模型，因为它可能会变得更好。\n\
  \n## 生成推荐\n\n最后，我们准备好为用户提供一些建议。以下是 `predict` 方法的实现：\n\n```\n1 def predict(self,\
  \ X_train, user_index):\n2   y_hat = self.predictions(self.P, self.Q)\n3   predictions_index\
  \ = np.where(X_train[user_index, :] == 0)[0]\n4   return y_hat[user_index, predictions_index].flatten()\n\
  ```\n\n首先，我们获取包含所有预测播放次数的矩阵。其次，我们获取所有未知播放次数的索引，并仅返回这些索引作为预测。让我们为特定用户生成推荐：\n\n```\n\
  1 user_id = 1236\n2 user_index = ratings_df.index.get_loc(user_id)\n3 predictions_index\
  \ = np.where(train[user_index, :] == 0)[0]\n4 \n5 rating_predictions = recommender.predict(train,\
  \ user_index)\n```\n\n在查看推荐列表之前，让我们先看看用户目前的偏好是什么：\n\n```\n1 existing_ratings_index\
  \ = np.where(train[user_index, :] > 0)[0]\n2 existing_ratings = train[user_index,\
  \ existing_ratings_index]\n3 \n4 create_artist_ratings(\n5   artists,\n6   existing_ratings_index,\n\
  7   existing_ratings\n8 )\n```\n\n| name | rating |\n| --- | --- |\n| Marilyn Manson\
  \ | 0.196486 |\n| 3 Doors Down | 0.043204 |\n| Pearl Jam | 0.042016 |\n| Children\
  \ of Bodom | 0.025657 |\n| Disturbed | 0.021690 |\n| Rammstein | 0.021562 |\n| A\
  \ Perfect Circle | 0.020879 |\n| Gojira | 0.017051 |\n| Rob Zombie | 0.016280 |\n\
  | D12 | 0.010990 |\n\n以下是我们的模型生成的推荐：\n\n```\n1 create_artist_ratings(\n2   artists,\n\
  3   predictions_index,\n4   rating_predictions\n5 )\n```\n\n| name | rating |\n\
  | --- | --- |\n| Sander van Doorn | 0.559202 |\n| Jacob Miller | 0.552893 |\n| Celtas\
  \ Cortos | 0.552142 |\n| Camisa de Vênus | 0.546361 |\n| Ella Fitzgerald & Louis\
  \ Armstrong | 0.541477 |\n| The Answer | 0.537367 |\n| Anjelika Akbar | 0.536756\
