  \ / 2.0) * (np.abs(w1).sum() + self.abs(w2).sum())\n```\n\n### 进行预测\n\n现在我们的模型可以从数据中学习了，是时候对它未见过的数据进行预测了。我们将实现两个预测方法——`predict`\
  \ 和 `predict_proba`：\n\n```python\ndef predict(self, X):\n    Xt = X.copy()\n  \
  \  _, _, _, net_out, _ = self._forward(Xt)\n    return mle(net_out.T)\n```\n\n回想起神经网络中的预测（通常）是相似的。让我们实现\
