    \ calculate the first derivative using `sigmoid_prime` to update ![W\\_{\\\\text{hidden}}](images/leanpub_equation_120.png).\n\
    \nIn order to make an inference (predictions) we’ll do just the forward step (since\
    \ we won’t adjust ![W](images/leanpub_equation_121.png)based on the result):\n\
    \n```\n1 test_data = X[1] # [0, 1]\n2 \n3 act_hidden = sigmoid(np.dot(test_data,\
    \ w_hidden))\n4 np.dot(act_hidden, w_output)\n```\n\n```\n1 array([ 1.])\n```\n\
    \nOur sorcery seems to be working! The prediction is correct!\n\n### Classifying\
