    \nFirst, a smaller learning rate a :\n\n```python\n 1 def fit(X, y, n_iter=100000,\
    \ lr=0.001):\n 2 \n 3   W = np.zeros(X.shape[1])\n 4 \n 5   for i in range(n_iter):\n\
    \ 6       z = np.dot(X, W)\n 7       h = sigmoid(z)\n 8       gradient = np.dot(X.T,\
