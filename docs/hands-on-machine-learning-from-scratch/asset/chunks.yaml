- raw: "[Complete source code in Google Colaboratory Notebook](https://colab.research.google.com/drive/1kmtjoULbyRtAtDPKYlhWSwATLpF7PQd8)\n\
    \nComing up next, you will implement a Linear regression model from scratch :)\n\
    \n## Predicting House Prices with Linear Regression\n\n> TL;DR Use a test-driven\
    \ approach to build a Linear Regression model using Python from scratch. You will\
    \ use your trained model to predict house sale prices and extend it to a multivariate\
    \ Linear Regression.\n\nI know that you’ve always dreamed of dominating the housing\
    \ market. Until now, that was impossible. But with this limited offer you can…\
    \ got a bit sidetracked there.\n\nLet’s start building our model with Python,\
    \ but this time we will use it on a more realistic dataset.\n\n***[Complete source\
    \ code notebook](https://colab.research.google.com/drive/1DXkpo9PmH9_HiCSz9NQlZ9vGQtMIYqmF)***\n\
    \n### The Data\n\nOur data comes from a Kaggle competition named “[House Prices:\
    \ Advanced Regression Techniques](https://www.kaggle.com/c/house-prices-advanced-regression-techniques)”.\
    \ It contains *1460* training data points and 80 features that might help us predict\
    \ the selling price of a house.\n\n### Load the data\n\nLet’s load the Kaggle\
    \ dataset into a Pandas data frame:\n\n```\n1 df_train = pd.read_csv('house_prices_train.csv')\n\
    ```\n\n### Exploration — getting a feel for our data\n\nWe’re going to predict\
    \ the SalePrice column ($ USD), let’s start with it:\n\n```\n1 count      1460.000000\n\
    2 mean     180921.195890\n3 std       79442.502883\n4 min       34900.000000\n\
    5 25%      129975.000000\n6 50%      163000.000000\n7 75%      214000.000000\n\
    8 max      755000.000000\n9 Name: SalePrice, dtype: float64\n```\n\n![](images/2_sale-price.png)\n\
    \nMost of the density lies between 100k and 250k, but there appears to be a lot\
    \ of outliers on the pricier side.\n\nNext, let’s have a look at the greater living\
    \ area (square feet) against the sale price:\n\n![](images/2_sale-living.png)\n\
    \nYou might’ve expected that larger living area should mean a higher price. This\
    \ chart shows you’re generally correct. But what are those 2–3 “cheap” houses\
    \ offering huge living area?\n\nOne column you might not think about exploring\
    \ is the “TotalBsmtSF” — Total square feet of the basement area, but let’s do\
    \ it anyway:\n\n![](images/2_sale-base.png)\n\nIntriguing, isn’t it? The basement\
    \ area seems like it might have a lot of predictive power for our model.\n\nOk,\
    \ last one. Let’s look at “OverallQual” — overall material and finish quality.\
    \ Of course, this one seems like a much more subjective feature, so it might provide\
    \ a bit different perspective on the sale price.\n\n![](images/2_sale-qual.png)\n\
    \nEverything seems fine for this one, except that when you look to the right things\
    \ start getting much more nuanced. Will that “confuse” our model?\n\nLet’s have\
    \ a more general view on the *top 8* correlated features with the sale price:\n\
    \n![](images/2_sale-cor.png)\n\nSurprised? All the features we discussed so far\
    \ appear to be present. Its almost like we knew them from the start…\n\n#### Do\
    \ we have missing data?\n\nWe still haven’t discussed ways to “handle” missing\
    \ data, so we’ll handle them like a boss — just not use those features:\n\n|  \
    \ || Row count || Percentage |\n\n| --- | --- | --- |\n\n| PoolQC || 1453 || 0.995205\
    \ |\n\n| --- | --- | --- |\n\n| MiscFeature || 1406 || 0.963014 |\n\n| Alley ||\
    \ 1369 || 0.937671 |\n\n| Fence || 1179 || 0.807534 |\n\n| FireplaceQu || 690\
    \ || 0.472603 |\n\n| LotFrontage || 259 || 0.177397 |\n\n| GarageCond || 81 ||\
    \ 0.055479 |\n\n| GarageType || 81 || 0.055479 |\n\n| GarageYrBlt || 81 || 0.055479\
    \ |\n\n| GarageFinish || 81 || 0.055479 |\n\n| GarageQual || 81 || 0.055479 |\n\
    \n| BsmtExposure || 38 || 0.026027 |\n\n| BsmtFinType2 || 38 || 0.026027 |\n\n\
    | BsmtFinType1 || 37 || 0.025342 |\n\n| BsmtCond || 37 || 0.025342 |\n\nYes, we’re\
    \ not going to use any of those.\n\n### Predicting the sale price\n\nNow that\
    \ we have some feel of the data we’re playing with we can start our plan of attack\
    \ — how to predict the sale price for a given house?\n\n#### Using Linear Regression\n\
    \nLinear regression models assume that the relationship between a dependent continuous\
    \ variable Y and one or more explanatory (independent) variables X is linear (that\
    \ is, a straight line). It’s used to predict values within a continuous range\
    \ (e.g. sales, price) rather than trying to classify them into categories (e.g.\
    \ cat, dog). Linear regression models can be divided into two main types:\n\n\
    #### Simple Linear Regression\n\nSimple linear regression uses a traditional slope-intercept\
    \ form, where *a* and *b* are the coefficients that we try to “learn” and produce\
    \ the most accurate predictions. *X* represents our input data and *Y* is our\
    \ prediction.\n\n![Y = bX + a](images/leanpub_equation_32.png)\n\n#### Multivariable\
    \ Regression\n\nA more complex, multi-variable linear equation might look like\
    \ this, where *w* represents the coefficients or weights, our model will try to\
    \ learn.\n\n![Y(x\\_1,x\\_2,x\\_3) = w\\_1 x\\_1 + w\\_2 x\\_2 + w\\_3 x\\_3 +\
    \ w\\_0](images/leanpub_equation_33.png)\n\nThe variables ![x\\_1, x\\_2, x\\\
    _3](images/leanpub_equation_34.png)represent the attributes or distinct pieces\
    \ of information, we have about each observation.\n\n### Loss function\n\nGiven\
    \ our Simple Linear Regression equation:\n\n![Y = bX + a](images/leanpub_equation_35.png)\n\
    \nWe can use the following cost function to find the coefficients/parameters for\
    \ our model:\n\n#### Mean Squared Error (MSE) Cost Function\n\nThe MSE is defined\
    \ as:\n\n![MSE = J(W) = \\\\frac{1}{m} \\\\sum\\_{i=1}^{m} (y^{(i)} - h\\_w(x^{(i)}))^2](images/leanpub_equation_36.png)\n\
    \nwhere\n\n![h\\_w(x) = g(w^Tx)](images/leanpub_equation_37.png)\n\nThe MSE measures\
    \ how much the average model predictions vary from the correct values. The number\
    \ is higher when the model is performing “bad” on our training data.\n\nThe first\
    \ derivative of MSE is given by:\n\n![MSE' = J'(W) = \\\\frac{2}{m} \\\\sum\\\
    _{i=1}^{m} (h\\_w(x^{(i)}) - y^{(i)})](images/leanpub_equation_38.png)\n\n####\
    \ One Half Mean Squared Error (OHMSE)\n\nWe will apply a small modification to\
    \ the MSE — multiply by *1/2* so when we take the derivative, the *2s* cancel\
    \ out:\n\n![OHMSE = J(W) = \\\\frac{1}{2m} \\\\sum\\_{i=1}^{m} (y^{(i)} - h\\\
    _w(x^{(i)}))^2](images/leanpub_equation_39.png)\n\nThe first derivative of OHMSE\
    \ is given by:\n\n![OHMSE' = J'(W) = \\\\frac{1}{m} \\\\sum\\_{i=1}^{m} (h\\_w(x^{(i)})\
    \ - y^{(i)})](images/leanpub_equation_40.png)\n\nLet’s implement it in Python\
    \ (yes, we’re going TDD style!)\n\n```\n 1 class TestLoss(unittest.TestCase):\n\
    \ 2 \n 3   def test_zero_h_zero_y(self):\n 4     self.assertAlmostEqual(loss(h=np.array([0]),\
    \ y=np.array([0])), 0)\n 5 \n 6   def test_one_h_zero_y(self):\n 7     self.assertAlmostEqual(loss(h=np.array([1]),\
    \ y=np.array([0])), 0.5)\n 8 \n 9   def test_two_h_zero_y(self):\n10     self.assertAlmostEqual(loss(h=np.array([2]),\
    \ y=np.array([0])), 2)\n11 \n12   def test_zero_h_one_y(self):\n13     self.assertAlmostEqual(loss(h=np.array([0]),\
    \ y=np.array([1])), 0.5)\n14 \n15   def test_zero_h_two_y(self):\n16     self.assertAlmostEqual(loss(h=np.array([0]),\
    \ y=np.array([2])), 2)\n```\n\nNow that we have the tests ready, we can implement\
    \ the loss function:\n\n```\n1 def loss(h, y):\n2   sq_error = (h - y)**2\n3 \
    \  n = len(y)\n4   return 1.0 / (2*n) * sq_error.sum()\n```\n\n`run_tests()`\n\
    \ntime for the results:\n\n```\n1 .....\n2 --------------------------------------------------------------\n\
    3 Ran 5 tests in 0.007s\n4 \n5 OK\n```\n\n#### Data preprocessing\n\nWe will do\
    \ a little preprocessing to our data using the following formula (standardization):\n\
    \n![x'= \\\\frac{x - \\\\mu}{\\\\sigma}](images/leanpub_equation_41.png)\n\nwhere\
    \ ![\\\\mu](images/leanpub_equation_42.png)is the population mean and ![\\\\sigma](images/leanpub_equation_43.png)is\
    \ the standard deviation.\n\nBut why? Why would we want to do that? The following\
    \ chart might help you out:\n\nWhat the doodle shows us that our old friend —\
    \ the gradient descent algorithm, might converge (find good parameters) faster\
    \ when our training data is scaled. Shall we?\n\n```\n1 x = df_train['GrLivArea']\n\
    2 y = df_train['SalePrice']\n3 \n4 x = (x - x.mean()) / x.std()\n5 x = np.c_[np.ones(x.shape[0]),\
    \ x]\n```"
