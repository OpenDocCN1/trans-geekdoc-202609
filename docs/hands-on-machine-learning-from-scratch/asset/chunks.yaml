    \ 1)\n\n   if explore and exploration_tradeoff < self.epsilon:\n     # exploration\n\
    \     return np.random.randint(self.n_actions)\n   else:\n     # exploitation\
    \ (taking the biggest Q value for this state)\n     return np.argmax(self.q_table[state,\
    \ :])\n```\n\nOur strategy is rather simple. We draw a random number from a uniform\
    \ distribution between ![0](images/leanpub_equation_191.png) and ![1](images/leanpub_equation_192.png).\
    \ If this number is smaller than `epsilon` and we want to explore, we take a random\
    \ action. Otherwise, we take the best action based on our current knowledge.\n\
