- raw: "Machine Learning (ML) is the art and science of teaching machines to do complex\
    \ tasks without explicitly programming them. Your job, as a hacker, is to:\n\n\
    *   Define the problem in a way that a computer can understand it\n\n*   Choose\
    \ a set of possible models that could solve it\n\n*   Feed the data\n\n*   Evaluate\
    \ the performance and improve\n\nThere are 3 main types of learning: supervised,\
    \ unsupervised and reinforcement\n\n#### Supervised Learning\n\nIn *Supervised\
    \ Learning* setting, you have a dataset, which is a collection of ![N](images/leanpub_equation_0.png)labeled\
