  trans: "\n\n![W := W - \\\\alpha (\\\\frac{1}{m}(y - h\\_w)x)](img/leanpub_equation_31.png)\n\
    \n参数 `a` 被称为*学习率*。高 `learning rate` 可以快速收敛，但存在越过最低点的风险。低 `learning rate` 允许在负梯度的方向上进行更有信心的移动。然而，它是耗时的，因此会花费我们很多时间才能收敛。\n\
    \n![](img/1_big-small-lr.png)\n\n*图片来源：[Towards Data Science](https://towardsdatascience.com/)*\n\
    \n## 梯度下降算法\n\n我们将使用的算法工作如下：\n\n```\n1 重复直到收敛 {\n2   1. 计算平均梯度\n3   2 乘以学习率\n\
    3   3 从权重中减去\n5 }\n```\n\n让我们用 Python 来实现它：\n\n```python\n 1 def predict(X, W):\n\
    \ 2   return sigmoid(np.dot(X, W))\n 3 \n 4 def fit(X, y, n_iter=100000, lr=0.01):\n\
    \ 5 \n 6   W = np.zeros(X.shape[1])\n 7 \n 8   for i in range(n_iter):\n 9   \
    \    z = np.dot(X, W)\n10       h = sigmoid(z)\n11       gradient = np.dot(X.T,\
    \ (h - y)) / y.size\n12       W -= lr * gradient\n13   return W\n```\n\n关于“直到收敛”这部分。你可能会注意到我们有点是用暴力的方法解决的。也就是说，我们将按照预设的迭代次数运行算法。另一个有趣点是我们的权重\
    \ `W` 的初始化——最初设置为零。\n\n让我们从字面上测试一下我们的实现。但首先，我们需要一个函数来根据某些数据 `X` 预测 `y`（根据客户的支出情况判断是否应该给其发送折扣）：\n\
    \n```python\n1 def predict(X, W):\n2   return sigmoid(np.dot(X, W))\n```\n\n现在来做我们的简单测试：\n\
    \n```python\n 1 class TestGradientDescent(unittest.TestCase):\n 2 \n 3     def\
    \ test_correct_prediction(self):\n 4       global X\n 5       global y\n 6   \
    \    if len(X.shape) != 2:\n 7         X = X.reshape(X.shape[0], 1)\n 8      \
    \ w = fit(X, y)\n 9       y_hat = predict(X, w).round()\n10       self.assertTrue((y_hat\
    \ == y).all())\n```\n\n注意我们使用 `reshape` 为 `X` 增加了一个伪维度。此外，在调用 `predict` 之后，我们对结果进行了舍入。记住\
    \ `sigmoid` 函数输出的是（就像胃不舒服的龙一样）`[0; 1]`范围内的数字。我们只需要对结果进行舍入，以获得 0 或 1（是或否）的答案。\n\
    \n`run_tests()`\n\n这是我们运行测试用例的结果：\n\nF\n\n嗯，这不太好，在忙了之后，我们完全没有达到为模型找到良好参数的目标。但是，哪里出问题了？\n\
    \n欢迎来到你的首次模型调试！让我们先看看我们的算法是否随着时间的推移而有所改进。我们可以使用损失指标来实现这一点：\n\n```python\n 1 def\
    \ fit(X, y, n_iter=100000, lr=0.01):\n 2 \n 3   W = np.zeros(X.shape[1])\n 4 \n\
    \ 5   for i in range(n_iter):\n 6       z = np.dot(X, W)\n 7       h = sigmoid(z)\n\
    \ 8       gradient = np.dot(X.T, (h - y)) / y.size\n 9       W -= lr * gradient\n\
    10 \n11       if(i % 10000 == 0):\n12           e = loss(h, y)\n13           print(f'loss:\
    \ {e} \\t')\n14 \n15   return W\n```\n\n`run_tests()`\n\n我们几乎是复制粘贴了训练代码，不同的是我们每\
    \ *10,000* 次迭代打印一次训练损失。让我们来看：\n\n```text\n 1     loss: 0.6931471805599453\n 2\
    \     loss: 0.41899283818630056\n 3     loss: 0.41899283818630056\n 4     loss:\
    \ 0.41899283818630056\n 5     loss: 0.41899283818630056\n 6     loss: 0.41899283818630056\n\
    \ 7     loss: 0.41899283818630056\n 8     loss: 0.41899283818630056\n 9     loss:\
    \ 0.41899283818630056\n10     loss: 0.41899283818630056\n```\n\nF\n\n![](img/1.png)\n\
    \n可疑的是，我们在第一次尝试就找到了问题的可能原因！我们的损失没有足够低，换句话说，我们的算法卡在一个对我们来说不够好的点上。如何修复？？尝试不同的学习率或用不同的值初始化参数？\n\
    \n首先，较小的学习率：\n\n```python\n 1 def fit(X, y, n_iter=100000, lr=0.001):\n 2 \n 3\
    \   W = np.zeros(X.shape[1])\n 4 \n 5   for i in range(n_iter):\n 6       z =\
    \ np.dot(X, W)\n 7       h = sigmoid(z)\n 8       gradient = np.dot(X.T, (h -\
    \ y)) / y.size\n 9       W -= lr * gradient\n10 \n11       if(i % 10000 == 0):\n\
    12           e = loss(h, y)\n13           print(f'loss: {e} \\t')\n14 \n15   return\
    \ W\n```\n\n使用 `0.001` 时我们得到了：\n\n```text\n 1 loss: 0.423513562384554\n 2 loss:\
    \ 0.41899283818630056\n 3 loss: 0.41899283818630056\n 4 loss: 0.41899283818630056\n\
    \ 5 loss: 0.41899283818630056\n 6 loss: 0.41899283818630056\n 7 loss: 0.41899283818630056\n\
    \ 8 loss: 0.41899283818630056\n 9 loss: 0.41899283818630056\n```\n\n"
