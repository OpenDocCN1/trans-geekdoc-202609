- raw: "### Evaluation\n\nNow that you have an implementation of K-Means clustering\
    \ you can use it on the UI screenshots. We need a little more glue code to make\
    \ it easier to extract color palettes:\n\n```\n1 def rgb_to_hex(rgb):\n2   return\
    \ '#%s' % ''.join(('%02x' % p for p in rgb))\n3 \n4 def get_colors(filename, n_colors=3):\n\
    5   points = get_points(filename)\n6   clusters = KMeans(n_clusters=n_colors).fit(points)\n\
    7   clusters.sort(key=lambda c: len(c.points), reverse = True)\n8   rgbs = [map(int,\
    \ c.center.coordinates) for c in clusters]\n9   return list(map(rgb_to_hex, rgbs))\n\
    ```\n\nThe `get_colors` function takes a path to an image file and the number\
    \ of colors you want to extract from the image. We sort the clusters obtained\
    \ from our algorithm based on the points in each (in descending order). Finally,\
    \ we convert the RGB colors to hexadecimal values.\n\nLet’s extract the palette\
    \ for the first UI screenshot from our data:\n\n```\n1 colors = get_colors('ui1.png',\
    \ n_colors=5)\n2 \", \".join(colors)\n```\n\nand here are the hexadecimal color\
    \ values:\n\n```\n1 #f9f8fa, #4252a6, #fc6693, #bdbcd0, #374698\n```\n\nAnd for\
    \ a visual representation of our results:\n\n![](images/4_palette-1.png)\n\nRunning\
    \ the clustering on the next two images, we obtain the following:\n\n![](images/4_palette-2.png)\n\
    \nThe last screenshot:\n\n![](images/4_palette-3.png)\n\nWell, that looks cool,\
    \ right? Go on try it on your own images!\n\n[**Complete source code notebook\
    \ on Google Colaboratory**](https://colab.research.google.com/drive/1_p1nptDfvJhcSvprmi1WtoIugsCI40Xa)\n\
    \n### Conclusion\n\nCongratulations, you just implemented your first unsupervised\
    \ algorithm from scratch! It also appears that it obtains good results when trying\
    \ to extract a color palette from images.\n\nNext up, we’re going to do sentiment\
    \ analysis on short phrases and learn a bit more how we can handle text data.\n\
    \n## Movie review sentiment analysis with Naive Bayes\n\n> TL;DR Build Naive Bayes\
    \ text classification model using Python from Scratch. Use the model to classify\
    \ IMDB movie reviews as positive or negative.\n\nTextual data dominates our world\
    \ from the tweets you read to the timeless writings of Seneca. And while we’re\
    \ consuming images (looking at you Instagram) and videos at increasing rates,\
    \ you still read Google search results multiple times per daily.\n\nOne frequently\
    \ recurring problem with text data is [Sentiment analysis](https://en.wikipedia.org/wiki/Sentiment_analysis)\
    \ (classification). Imagine you’re a big sugar + water beverage company. You want\
    \ to know what people think of your products. You’ll search for texts with some\
    \ tags, logos or names. You can then use Sentiment analysis to figure out if the\
    \ opinions are positive or negative. Of course, you’ll send the negative ones\
    \ to your highly underpaid support center in India to sort things out.\n\nHere,\
    \ we’ll build a generic text classifier that puts movie review texts into one\
    \ of two categories - negative or positive sentiment. We’re going to have a brief\
    \ look at the Bayes theorem and relax its requirements using the Naive assumption.\n\
    \n[Complete source code in Google Colaboratory Notebook](https://colab.research.google.com/drive/1OPQDDJTKy0b40pziZWSsoBCmQV6HyXsm)\n\
    \n### Dealing with Text\n\nComputers don’t understand text data, though they do\
    \ well with numbers. [Natural Language Processing (NLP)](https://en.wikipedia.org/wiki/Natural_language_processing)\
    \ offers a set of approaches to solve text-related problems and represent text\
    \ as numbers. While NLP is a vast field, we’ll use some simple preprocessing techniques\
    \ and [Bag of Words](https://en.wikipedia.org/wiki/Bag-of-words_model) model.\n\
    \n#### The Data\n\nOur data comes from a Kaggle challenge - [“Bag of Words Meets\
    \ Bags of Popcorn”](https://www.kaggle.com/c/word2vec-nlp-tutorial).\n\nWe have\
    \ 25,000 movie reviews from IMDB labeled as positive or negative. You might know\
    \ that IMDB ratings are in the 0-10 range. An additional preprocessing step, done\
    \ by the dataset authors, converts the rating to binary sentiment (<5 - negative\
    \ ). Of course, a single movie can have multiple reviews, but no more than 30.\n\
    \n#### Reading the reviews\n\nLet’s load the training and test data in Pandas\
    \ data frames:\n\n```\n1 train = pd.read_csv(\"imdb_review_train.tsv\", delimiter=\"\
    \\t\")\n2 test = pd.read_csv(\"imdb_review_test.tsv\", delimiter=\"\\t\")\n```\n\
    \n#### Exploration\n\nLet’s get a feel for our data. Here are the first 5 rows\
    \ of the training data:\n\n| id || sentiment || review |\n\n| --- | --- | ---\
    \ |\n\n| 5814\\_8 || 1 || With all this stuff going down at the moment w… |\n\n\
    | --- | --- | --- |\n\n| 2381\\_9 || 1 || The Classic War of the Worlds\" by Timothy\
    \ Hi… |\n\n| 7759\\_3 || 0 || The film starts with a manager (Nicholas Bell)…\
    \ |\n\n| 3630\\_4 || 0 || It must be assumed that those who praised this… |\n\n\
    | 9495\\_8 || 1 || Superbly trashy and wondrously unpretentious 8… |\n\nWe’re\
    \ going to focus on the sentiment and review columns. The id column is combining\
    \ the movie id with a unique number of a review. This might be a piece of important\
    \ information in real-world scenarios, but we’re going to keep it simple.\n\n\
    ![](images/5_sentiment-dist.png)\n\nBoth positive and negative sentiments have\
    \ an equal presence. No need for additional gimmicks to fix that!\n\nHere are\
    \ the most common words in the training dataset reviews:\n\n![](images/5_word-cloud.png)\n\
    \nHmm, that **br** looks weird, right?\n\n#### Cleaning\n\nReal-world text data\
    \ is really messy. It can contain excessive punctuation, HTML tags (including\
    \ that br), multiple spaces, etc. We’ll try to remove/normalize most of it.\n\n\
    Most of the cleaning we’ll do using [Regular Expressions](https://en.wikipedia.org/wiki/Regular_expression),\
    \ but we’ll use two libraries to handle HTML tags (surprisingly hard to remove)\
    \ and removing common (stop) words:\n\n```\n1 def clean(self, text):\n2     no_html\
    \ = BeautifulSoup(text).get_text()\n3     clean = re.sub(\"[^a-z\\s]+\", \" \"\
    , no_html, flags=re.IGNORECASE)\n4     return re.sub(\"(\\s+)\", \" \", clean)\n\
    ```\n\nFirst, we use [BeautifulSoup](https://www.crummy.com/software/BeautifulSoup/bs4/doc/)\
    \ to remove HTML tags from our text. Second, we remove anything that is not a\
    \ letter or space (note the ignoring of uppercase characters). Finally, we replace\
    \ excessive spacing with a single one.\n\n#### Tokenization\n\nNow that our reviews\
    \ are “clean”, we can further prepare them for our Bag of Words model. Let’s them\
    \ to lowercase letters and split them into individual words. This process is known\
    \ as [tokenization](https://en.wikipedia.org/wiki/Lexical_analysis#Tokenization):\n\
    \n```\n1 def tokenize(self, text):\n2     clean = self.clean(text).lower()\n3\
