    \ 发生的情况下，事件 ![A](img/leanpub_equation_60.png) 发生的条件概率。为了找到这一点，我们需要计算在 ![A](img/leanpub_equation_63.png)\
    \ 发生的情况下，![B](img/leanpub_equation_62.png) 发生的概率，并将其乘以 ![A](img/leanpub_equation_64.png)\
    \ 发生的概率（即 `Prior`，先验概率）。所有所有内容都除以 ![B](img/leanpub_equation_65.png) 独立发生的概率。\n\
    \n朴素假设（naive assumption）允许我们将该示例的贝叶斯定理重新表述为：\n\n![P(Sentiment|w\\_1,\\dots,w\\\
    _n)=\\frac{P(Sentiment) \\displaystyle \\prod\\_{i=1}^{n}{P(w\\_i|Sentiment)}}{P(w\\\
    _1,\\dots,w\\_n)}](img/leanpub_equation_66.png)\n\n我们并不真正关心概率。我们只想知道给定的文本是正面还是负面情感。我们可以完全跳过分母，因为它只是缩放了分子：\n\
    \n![P(Sentiment|w\\_1,\\dots,w\\_n) \\propto P(Sentiment) \\prod\\_{i=1}^{n}{P(w\\\
    _i|Sentiment)}](img/leanpub_equation_67.png)\n\n为了选择情感，我们将比较每个情感的分，并选择得分较高的一个。\n\
    \n### 实现多项朴素贝叶斯\n\n正如你现在可能猜到的那样，我们正在将文本分为两个组/类别——正面情感和负面情感。\n\n多项朴素贝叶斯（Multinomial\
    \ Naive Bayes）允许我们把模型的特征表示为它们出现的频率（某个词在我们的评论中出现的次数）。换句话说，它告诉我们正在使用的概率分布是[多项分布](https://en.wikipedia.org/wiki/Multinomial_distribution)。\n\
    \n#### 关于数值稳定性的注意\n\n我们的模型依赖于许多概率相乘。这些概率可能会变得越来越小，我们的计算机可能会将它们舍入为零。为了对抗这个问题，我们将通过对方程的两边取对数来使用对数概率：\n\
    \n![\\\\log{P(Sentiment|w\\_1,\\dots,w\\_n)} = \\log{P(Sentiment)} + \\log{\\\
    prod\\_{i=1}^{n}{P(w\\_i|Sentiment)}}](img/leanpub_equation_68.png)\n\n注意我们仍然可以使用模型的最高分来预测情感，因为对数是[单调的](https://en.wikipedia.org/wiki/Monotonic_function)。\n\
    \n#### 构建我们的模型\n\n最后，是是在 Python 中实现我们的模型了。让我们先定义一些变量并按类别对数据分组，这样我们的训练代码会整洁一些：\n\
    \n```python\n1 def fit(self, X, y):\n2     self.n_class_items = {}\n3     self.log_class_priors\
    \ = {}\n4     self.word_counts = {}\n5     self.vocab = set()\n6     n = len(X)\n\
    7     grouped_data = self.group_by_class(X, y)\n8     ...\n```\n\n我们将实现一个通用的文本分类器，它不假设类别的数量。你可以将其用于新闻分类、情感分析等。\n\
    \n对于每个类别，我们将找到它中的示例数量和对数概率（先验概率）。我们还将记录每个词出现的次数并创建一个词汇表——我们在训练数据中见过的所有词的集合：\n\n\
    ```python\n1 for c, data in grouped_data.items():\n2       self.n_class_items[c]\
    \ = len(data)\n3       self.log_class_priors[c] = math.log(self.n_class_items[c]\
    \ / n)\n4       self.word_counts[c] = defaultdict(lambda: 0)\n5 \n6       for\
    \ text in data:\n7         counts = self.tokenizer.tokenize(text)\n8         for\
    \ word, count in counts.items():\n9             if word not in self.vocab:\n10\
    \                 self.vocab.add(word)\n11 \n12             self.word_counts[c][word]\
    \ += count\n```\n\n注意我们使用了 `Tokenizer` 和内置的 [Counter](https://docs.python.org/3/library/Counter)\
    \ 类将评论转换为词袋（bag of words）。\n\n如果你感兴趣，`group_by_class` 的工作如下：\n\n```python\n1 def\
    \ group_by_class(self, X, y):\n2   data = dict()\n3   for c in self.classes:\n\
    4     data[c] = X[np.where(y == c)]\n5   data\n```\n\n#### 预测\n\n为了从文本数据预测情感，我们将使用类先验概率和词汇表：\n\
    \n```python\n1 def predict(self, X):\n2     result = []\n3     for text in X:\n\
    4 \n5       class_scores = {c: self.log_class_priors[c] for c in self.classes}\n\
    6       words = set(self.tokenizer.tokenize(text))\n7 \n8       for word in words:\n\
    9           if word not in self.vocab: continue\n10 \n11           for c in self.classes:\n\
    12 \n13             log_w_given_c = self.laplace_smoothing(word, c)\n14      \
    \       class_scores[c] += log_w_given_c\n15 \n16       result.append(max(class_scores,\
    \ key=class_scores.get))\n17 \n18     return result\n```\n\n对于每条评论，我们使用正面和负面情感的对数概率并对文本进行分词。对于每个词，我们检查它是否在词汇表中，不在则跳过。然后我们计算该词在每个类别中的对数概率。我们将类别得分并选择得分最高的类别作为预测。\n\
    \n##### 拉普拉斯平滑\n\n注意 ![log(0)](img/leanpub_equation_69.png) `undefined`（而且我们没有使用\
    \ JavaScript）。词汇表中的词可能出现在一个类别中而不是另一个——在该类别中找到该词的概率为 0！我们可以使用[拉普拉斯平滑](https://en.wikipedia.org/wiki/Additive_smoothing）来解决这个问题。我们将只需在分子中加\
    \ 1，同时在分母中加上词汇表的大小：\n\n```python\n1 def laplace_smoothing(self, word, text_class):\n\
    2   num = self.word_counts[text_class][word] + 1\n3   denom = self.n_class_items[text_class]\
    \ + len(self.vocab)\n4   return math.log(num / denom)\n```\n\n### 预测情感\n\n现在你的模型可以进行训练和预测了，让我们用它预测电影评论的情感。\n\
    \n#### 数据准备\n\n如之前讨论的，我们将只使用训练数据中的 review 和 sentiment 列。将其分为训练和测试：\n\n```python\n\
    1 X = train['review'].values\n2 y = train['sentiment'].values\n3 \n4 X_train,\
    \ X_test, y_train, y_test = train_test_split(\n5   X, y,\n6   test_size=0.2,\n\
    7   random_state=RANDOM_SEED\n8 )\n```\n\n#### 评估\n\n我们将 `fit` 和 `predict` 函数封装进名为\
    \ `MultinomialNaiveBayes` 的类中。让我们使用它：\n\n```python\n1 MNB = MultinomialNaiveBayes(\n\
    2     classes=np.unique(y),\n3     tokenizer=Tokenizer()\n4 ).fit(X_train, y_train)\n\
    ```\n\n我们的分类器接受可能的类别列表和 `Tokenizer` 作为参数。此外，API 非常漂亮（感谢 scikit-learn！）：\n\n```python\n\
    1 y_hat = MNB.predict(X_test)\n2 accuracy_score(y_test, y_hat)\n```\n\n```\n1\
    \ 0.8556\n```\n\n这看起来不错，我们在测试集上获得了 ~86% 的准确率。\n\n这里是分类报告：\n\n```\n1          \
    \     precision    recall  f1-score   support\n2 \n3            0       0.89 \
    \     0.81      0.85      2481\n4            1       0.83      0.90      0.86\
    \      2519\n5 \n6     accuracy                           0.86      5000\n7  \
    \  macro avg       0.86      0.86      0.86      5000\n8 weighted avg       0.86\
    \      0.86      0.86      5000\n```\n\n以及混淆矩阵：\n\n![](img/5_confusion-matrix.png)\n\
    \n总体而言，我们的分类器表现得很好。将预测结果提交到 Kaggle，看看你在排行榜上获得第几。\n\n### 结论\n\n做得好！你刚刚构建了一个在情感预测上表现良好的多项朴素贝叶斯分类器。你还学习了贝叶斯定理、文本处理和拉普拉斯平滑！其他版本的朴素贝叶斯分类器会表现更好吗？\n\
