    \n## Guide\n\n1.  [Begin Reading](#chap00.xhtml)\n\n## Machine Learning fundamentals\n\
    \n> TL;DR Learn about the basics of Machine Learning - what types of learning\
    \ exist, why implement algorithms from scratch and can you really trust your models?\n\
    \n### Sick of being a lamer?\n\nHere’s a definition for “lamer” from urban dictionary:\n\
    \n> **Lamer** is someone who thinks they are smart, yet are really a loser. E.g.\
    \ **that hacker wannabe is really just a lamer**.\n\nYou might’ve noticed that\
    \ reading through Deep Learning and TensorFlow/PyTorch tutorials might give you\
    \ an idea of how to do a specific task, but fall short if you want to apply it\
    \ to your own problems. Importing a library and calling 4-5 methods might get\
    \ the job done but leave you clueless about why it works. Can you solve this problem?\n\
    \n> “What I cannot create, I do not understand” - Richard Feynman\n\nDifferent\
    \ people learn in different styles, but all hackers learn the same way - we build\
    \ stuff!\n\n#### How this book helps?\n\n*   Provide a clear path to learning\
    \ (reduce choice overload and paralysis by analysis) increasingly complex Machine\
    \ Learning models\n\n*   Succinct implementations of Machine Learning algorithms\
    \ solving real-world problems you can tinker with\n\n*   Just enough theory +\
    \ math that helps you understand why things work after you understand what problem\
    \ you have to solve\n\n### What is Machine Learning?"
