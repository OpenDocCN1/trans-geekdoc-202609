    \ = decay_rate\n   self.learning_rate = learning_rate\n   self.gamma = gamma #\
    \ discount rate\n   self.epsilons_ = []\n```\n\nThe interesting part of the `__init__`\
    \ is the initialization of our ![Q](images/leanpub_equation_190.png)-table. Initially,\
    \ it is all zeros. Can we initialize it in some other way?\n\n```python\n def\
