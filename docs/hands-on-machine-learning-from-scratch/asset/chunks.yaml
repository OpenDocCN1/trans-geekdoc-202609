  trans: "\n\n![](img/title_page.jpg)\n\n![从零开始上手机器学习](img/title_page.jpg)\n\n# 从零开始上手机器学习\n\
    \n### 通过在 Python 中从零实现模型，对机器学习模型建立深入的理解\n\n#### Venelin Valkov\n\n本书可在 [`leanpub.com/hmls`](http://leanpub.com/hmls)\
    \ 购买\n\n此版本发布于 2019-06-29\n\n![出版者标志](img/leanpub-logo.png)\n\n* * * * * *\n\n\
    这是一本来自 [Leanpub](http://leanpub.com) 的书籍。Leanpub 通过精益出版（Lean Publishing）流程为作者和出版社支持。[精益出版](http://leanpub.com/manifesto)\
    \ 是使用轻量级工具和多次迭代来发布进行中的电子书，以获取读者反馈，不断调整直到获得正确的书籍，并在一旦成功后建立影响力。\n\n* * * * * *\n\
    \n© 2019 Venelin Valkov\n\n## 目录\n\n1. 机器学习基础\n    * 受够了菜鸟了吗？\n    * 什么是机器学习？\n\
    \    * 学习算法是由什么组成的？\n    * 做预测\n    * 行业工具\n    * 准备开始开始？\n2. 逻辑回归与智能折扣\n    *\
    \ 数据\n    * 使用逻辑回归做决策\n    * 逻辑回归模型\n    * 我们如何为模型寻找参数？\n    * 附赠——构建你自己的 LogisticRegressor\n\
    \    * 结论\n3. 使用线性回归预测房价\n    * 数据\n    * 加载数据](#chap02.xhtml#leanpub-auto-load-the-data)\n\
    \    * 探索——直感受我们的数据](#chap02.xhtml#leanpub-auto-exploration--getting-a-feel-for-our-data)\n\
    \    * 预测销售价格](#chap02.xhtml#leanpub-auto-predicting-the-sale-price)\n    * 损失函数](#chap02.xhtml#leanpub-auto-loss-function-1)\n\
    \    * 多变量线性回归](#chap02.xhtml#leanpub-auto-multivariable-linear-regression)\n\
    \    * 结论\n4. 构建决策树\n    * 数据\n    * 决策树\n    * 预处理\n    * 代代价函数](#chap03.xhtml#leanpub-auto-cost)\n\
    \    * 使用预构建模型](#chap03.xhtml#leanpub-auto-using-prebuild-model)\n    * 构建你自己的决策树](#chap03.xhtml#leanpub-auto-building-your-own-decision-tree)\n\
    \    * 评估\n    * 发送到 Kaggle\n    * 结论\n5. 使用 K-means 提取颜色\n    * 无监督学习\n    *\
    \ 数据\n    * 什么是 K-means？\n    * 预处理\n    * 实现 K-means\n    * 评估\n    * 结论\n6.\
    \ 使用朴素贝叶斯进行电影情感分析\n    * 处理文本\n    * 朴素贝叶斯\n    * 实现多项式朴素贝叶斯\n    * 预测情感\n   \
    \ * 结论\n7. 使用随机梯度的音乐艺术家推荐系统\n    * 用户评分\n    * 推荐系统\n    * 推荐音乐艺术家\n    * 结论\n\
    8. 使用神经网络进行服装分类\n    * 图像数据\n    * 神经网络\n    * 分类图像\n    * 提高精度\n    * 结论\n9.\
    \ 使用强化学习在末日世界构建一个驾驶代理\n    * 强化学习\n    * 在末日世界驾驶\n    * 评估\n    * 结论\n\n## 机器学习基础\n\
    \n> 摘要：了解机器学习的基础知识——存在哪些学习类型、为什么要从零实现以及你真的信任你的模型吗？\n\n### 受够了菜鸟了吗？\n\n这里是城市词典对“lamer”的定义：\n\
    \n> **Lamer** 是一个认为自己很聪明其实是个失败者的人。例如：**那个想黑客其实只是个菜鸟**。\n\n你可能注意到，阅读深度学习和 TensorFlow/PyTorch\
    \ 教程可能会让你了解如何完成特定任务，但当你想要将其应用于自己的问题时就不够了。导入库并调用 4-5 个方法可能完成工作，但会让你对它为什么有效一无所知。你能解决这个问题吗？\n\
    \n> “我无法创造的东西，我不理解” —— 理查德·费曼\n\n不同的人学习风格不同，但所有黑客的学习方式都是一样的——我们构建东西！\n\n#### 本书有什么帮助？\n\
    \n*   提供一条清晰的路径（减少选择过载和分析瘫痪）来学习日益复杂的机器学习模型。\n*   机器学习算法的简洁实现，解决你可以进行优化的真实世界问题。\n\
    *   提供足够的理论+数学知识，帮助你在理解了解决什么问题之后，理解它们为什么有效。\n\n"
