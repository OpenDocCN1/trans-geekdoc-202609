    ```\n\n### Cost function\n\nWe’re going to use a new cost function — Root Mean\
    \ Square Error (RMSE). It is the standard deviation of how far from the regression\
    \ line data points are. In other words, it tells you how concentrated the data\
    \ is around the line of best fit.\n\nRMSE is given by the formula:\n\n![RMSE =\
    \ \\\\sqrt{\\\\frac{1}{m} \\\\sum\\_{i=1}^{m} (y^{(i)} - h(x^{(i)}))^2}](images/leanpub_equation_44.png)\n\
