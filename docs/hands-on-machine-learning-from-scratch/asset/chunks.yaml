- raw: "One approach is to head over to a place where the *PROs* share their work.\
    \ Pages like [Dribbble](https://dribbble.com/), [uplabs](https://www.uplabs.com/)\
    \ and [Behance](https://www.behance.net/) have the goods.\n\nAfter finding mockups\
    \ you like, you might want to extract colors from them and use those. This might\
    \ require opening specialized software, manually picking color with some tool(s)\
    \ and other over-the-counter hacks. Let’s use Machine Learning to make your life\
    \ easier.\n\n[**Complete source code notebook**](https://colab.research.google.com/drive/1_p1nptDfvJhcSvprmi1WtoIugsCI40Xa)\n\
    \n### Unsupervised Learning\n\nUp until now we only looked at models that require\
    \ training data in the form of features and labels. In other words, for each example,\
    \ we need to have the correct answer, too.\n\nUsually, such training data is hard\
    \ to obtain and requires many hours of manual work done by humans (yes, we’re\
    \ already serving “The Terminators”). Can we skip all that?\n\nYes, at least for\
    \ some problems we can use example data without knowing the correct answer for\
    \ it. One such problem is *clustering*.\n\n#### What is clustering?\n\nGiven some\
    \ vector of data points ![X](images/leanpub_equation_48.png), clustering methods\
    \ allow you to put each point in a group. In other words, you can categorize a\
    \ set of entities, based on their properties, automatically.\n\nYes, that is very\
    \ useful in practice. Usually, you run the algorithm on a bunch of data points\
    \ and specify how much groups you want. For example, your inbox contains two main\
    \ groups of e-mail: spam and not-spam (were you waiting for something else?).\
    \ You can let the clustering algorithm create two groups from your emails and\
    \ use your beautiful brain to classify which is which.\n\nMore applications of\
    \ clustering algorithms:\n\n*   *Customer segmentation* - find groups of users\
    \ that spend/behave the same way\n\n*   *Fraudulent transactions* - find bank\
    \ transactions that belong to different clusters and identify them as fraudulent\n\
    \n*   *Document analysis* - group similar documents\n\n### The Data\n\n![](images/4_data-preview.png)*source:\
    \ various authors on https://www.uplabs.com/*\n\nThis time, our data doesn’t come\
    \ from some predefined or well-known dataset. Since Unsupervised learning does\
    \ not require labeled data, the Internet can be your oyster.\n\nHere, we’ll use\
    \ 3 mobile UI designs from various authors. Our model will run on each shot and\
    \ try to extract the color palette for each.\n\n### What is K-Means Clustering?\n\
    \nK-Means Clustering is defined by [Wikipedia](https://en.wikipedia.org/wiki/K-means_clustering)\
    \ as:\n\n> k-means clustering is a method of vector quantization, originally from\
    \ signal processing, that is popular for cluster analysis in data mining. k-means\
    \ clustering aims to partition n observations into k clusters in which each observation\
    \ belongs to the cluster with the nearest mean, serving as a prototype of the\
    \ cluster. This results in a partitioning of the data space into Voronoi cells.\n\
    \nWikipedia also tells us that solving K-Means clustering is difficult (in fact,\
    \ [NP-hard](https://en.wikipedia.org/wiki/NP-hardness)) but we can find local\
    \ optimum solutions using some heuristics.\n\nBut how do *K-Means Clustering*\
    \ works?\n\nLet’s say you have some vector ![X](images/leanpub_equation_49.png)that\
    \ contains ![n](images/leanpub_equation_50.png)data points. Running our algorithm\
    \ consists of the following steps:\n\n1.  Take random ![k](images/leanpub_equation_51.png)points\
    \ (called *centroids*) from ![X](images/leanpub_equation_52.png)\n\n2.  Assign\
    \ every point to the closest centroid. The newly formed bunch of points is called\
    \ *cluster*.\n\n3.  For each cluster, find new centroid by calculating a new center\
    \ from the points\n\n4.  Repeat steps 2-3 until centroids stop changing\n\nLet’s\
    \ see how can we use it to extract color palettes from mobile UI screenshots.\n\
    \n### Data Preprocessing\n\nGiven our data is stored in raw pixels (called images),\
    \ we need a way to convert it to points that our clustering algorithm can use.\n\
    \nLet’s first define two classes that represent a point and cluster:\n\n```\n\
    1 class Point:\n2 \n3   def __init__(self, coordinates):\n4     self.coordinates\
    \ = coordinates\n```\n\nOur `Point` is just a holder to the coordinates for each\
    \ dimension in our space.\n\n```\n1 class Cluster:\n2 \n3   def __init__(self,\
    \ center, points):\n4     self.center = center\n5     self.points = points\n```\n\
    \nThe `Cluster` is defined by its center and all other points it contains.\n\n\
    Given a path to image file we can create the points as follows:\n\n```\n 1 def\
    \ get_points(image_path):\n 2   img = Image.open(image_path)\n 3   img.thumbnail((200,\
    \ 400))\n 4   img = img.convert(\"RGB\")\n 5   w, h = img.size\n 6 \n 7   points\
    \ = []\n 8   for count, color in img.getcolors(w * h):\n 9     for _ in range(count):\n\
    10       points.append(Point(color))\n11 \n12   return points\n```\n\nA couple\
    \ of things are happening here:\n\n*   load the image into memory\n\n*   resize\
    \ it to smaller image (mobile UX requires big elements on the screen, so we aren’t\
    \ losing much color information)\n\n*   drop the alpha (transparency) information\n\
    \nNote that we’re creating a `Point` for each pixel in our image.\n\nAlright!\
    \ You can now extract points from an image. But how can we calculate the distance\
    \ between points in our clusters?\n\n#### Distance function\n\nSimilar to the\
    \ cost function in our supervised algorithm examples, we need a function that\
    \ tells us how well we’re doing. The objective of our algorithm is to minimize\
    \ the distance between the points in each centroid.\n\nOne of the simplest distance\
    \ functions we can use is the Euclidean distance, defined by:\n\n![d(p, q) = \\\
    \\sqrt{\\\\sum\\_{i=1}^n{(q\\_i - p\\_i)^2}}](images/leanpub_equation_53.png)\n\
    \nwhere ![p](images/leanpub_equation_54.png)and ![q](images/leanpub_equation_55.png)are\
    \ two points from our space.\n\nNote that while Euclidean distance is simple to\
    \ implement it might not be the best way to calculate the [color difference](https://en.wikipedia.org/wiki/Color_difference).\n\
    \nHere is the Python implementation:\n\n```\n1 def euclidean(p, q):\n2   n_dim\
    \ = len(p.coordinates)\n3   return sqrt(sum([\n4       (p.coordinates[i] - q.coordinates[i])\
    \ ** 2 for i in range(n_dim)\n5   ]))\n```\n\n### Implementing K-Means clustering\n\
    \nNow that you have all pieces of the puzzle you can implement the K-Means clustering\
    \ algorithm. Let’s start with the method that finds the center for a set of points:\n\
    \n```\n1 def calculate_center(self, points):\n2   n_dim = len(points[0].coordinates)\n\
    3   vals = [0.0 for i in range(n_dim)]\n4   for p in points:\n5     for i in range(n_dim):\n\
    6       vals[i] += p.coordinates[i]\n7   coords = [(v / len(points)) for v in\
    \ vals]\n8   return Point(coords)\n```\n\nTo find the center of a set of points,\
    \ we add the values for each dimension and divide by the number of points.\n\n\
    Now for finding the actual clusters:\n\n```\n 1 def assign_points(self, clusters,\
    \ points):\n 2   plists = [[] for i in range(self.n_clusters)]\n 3 \n 4   for\
    \ p in points:\n 5     smallest_distance = float('inf')\n 6 \n 7     for i in\
    \ range(self.n_clusters):\n 8       distance = euclidean(p, clusters[i].center)\n\
    \ 9       if distance < smallest_distance:\n10         smallest_distance = distance\n\
    11         idx = i\n12 \n13     plists[idx].append(p)\n14 \n15   return plists\n\
    16 \n17 def fit(self, points):\n18   clusters = [Cluster(center=p, points=[p])\
    \ for p in random.sample(points, self.n_cl\\\n19 usters)]\n20 \n21   while True:\n\
    22 \n23     plists = self.assign_points(clusters, points)\n24 \n25     diff =\
    \ 0\n26 \n27     for i in range(self.n_clusters):\n28       if not plists[i]:\n\
    29         continue\n30       old = clusters[i]\n31       center = self.calculate_center(plists[i])\n\
    32       new = Cluster(center, plists[i])\n33       clusters[i] = new\n34    \
    \   diff = max(diff, euclidean(old.center, new.center))\n35 \n36     if diff <\
    \ self.min_diff:\n37       break\n38 \n39   return clusters\n```\n\nThe implementation\
