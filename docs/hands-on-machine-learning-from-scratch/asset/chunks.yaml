- raw: "```\n 1 def __init__(\n 2   self,\n 3   n_states,\n 4   n_actions,\n 5   decay_rate=0.0001,\n\
    \ 6   learning_rate=0.7,\n 7   gamma=0.618\n 8 ):\n 9   self.n_actions = n_actions\n\
    10   self.q_table = np.zeros((n_states, n_actions))\n11   self.max_epsilon = 1.0\n\
    12   self.min_epsilon = 0.01\n13   self.epsilon = self.max_epsilon\n14   self.decay_rate\
    \ = decay_rate\n15   self.learning_rate = learning_rate\n16   self.gamma = gamma\
    \ # discount rate\n17   self.epsilons_ = []\n```\n\nThe interesting part of the\
    \ `__init__` is the initialization of our ![Q](images/leanpub_equation_190.png)\\\
    -table. Initially, it is all zeros. Can we initialize it in some other way?\n\n\
    ```\n1 def choose_action(self, explore=True):\n2   exploration_tradeoff = np.random.uniform(0,\
    \ 1)\n3 \n4   if explore and exploration_tradeoff < self.epsilon:\n5     # exploration\n\
    6     return np.random.randint(self.n_actions)\n7   else:\n8     # exploitation\
    \ (taking the biggest Q value for this state)\n9     return np.argmax(self.q_table[state,\
    \ :])\n```\n\nOur strategy is rather simple. We draw a random number from a uniform\
    \ distribution between ![0](images/leanpub_equation_191.png)and ![1](images/leanpub_equation_192.png).\
    \ If this number is smaller than epsilon and we want to explore, we take a random\
    \ action. Otherwise, we take the best action based on our current knowledge.\n\
    \n```\n 1 def learn(\n 2   self,\n 3   state,\n 4   action,\n 5   reward,\n 6\
    \   next_state,\n 7   done,\n 8   episode\n 9 ):\n10   # Update Q(s,a):= Q(s,a)\
    \ + lr [R(s,a) + gamma * max Q(s',a') - Q(s,a)]\n11   self.q_table[state, action]\
    \ = self.q_table[state, action] + \\\n12     self.learning_rate * (reward + self.gamma\
    \ * \\\n13       np.max(self.q_table[new_state, :]) - self.q_table[state, action])\n\
    14 \n15   if done:\n16     # Reduce epsilon to decrease the exploration over time\n\
    17     self.epsilon = self.min_epsilon + (self.max_epsilon - self.min_epsilon)\
    \ * \\\n18       np.exp(-self.decay_rate * episode)\n19     self.epsilons_.append(self.epsilon)\n\
    ```\n\nLearning involves the update of the ![Q](images/leanpub_equation_193.png)\\\
    -table using the ![Q](images/leanpub_equation_194.png)\\-learning equation and\
    \ reducing the exploration rate ![\\\\epsilon](images/leanpub_equation_195.png)if\
    \ the episode is complete.\n\n#### Training\n\nNow that our agent is ready for\
    \ action, we can train it on the environment we’ve created. Let’s train our agent\
    \ for 50k episodes and record episode rewards over time:\n\n```\n1 total_episodes\
    \ = 60000\n2 total_test_episodes = 10\n3 \n4 agent = Agent(env.observation_space.n,\
    \ env.action_space.n)\n```\n\nLet’s have a look at our agent driving **before\
    \ learning anything about the environment**:\n\n[See YouTube video](https://www.youtube.com/watch?v=CHayUf_IoUc)\n\
    \n```\n 1 rewards = []\n 2 \n 3 for episode in range(total_episodes):\n 4    \
    \ state = env.reset()\n 5     episode_rewards = []\n 6 \n 7     while True:\n\
    \ 8 \n 9         action = agent.choose_action()\n10 \n11         # Take the action\
    \ (a) and observe the outcome state(s') and reward (r)\n12         new_state,\
    \ reward, done, info = env.step(action)\n13 \n14         agent.learn(\n15    \
    \       state,\n16           action,\n17           reward,\n18           new_state,\n\
    19           done,\n20           episode\n21         )\n22 \n23         state\
    \ = new_state\n24 \n25         episode_rewards.append(reward)\n26 \n27       \
    \  if done == True:\n28           break\n29 \n30     rewards.append(np.mean(episode_rewards))\n\
