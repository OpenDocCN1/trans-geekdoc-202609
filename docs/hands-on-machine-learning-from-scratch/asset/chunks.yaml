    ### Reinforcement Learning


    Reinforcement Learning (RL) is concerned with producing algorithms (agents) that
    try to achieve some predefined goal. The achievement of this objective is dependent
    on choosing a set of actions - receiving rewards for the good ones and punishment
    for the bad ones - the reinforcement bit comes from this. The agent act, in environments
    that have a state, gives rewards, and a set of actions.


    ![](images/ml-scratch-8----reinforcement-learning.png)


    *Image credit: [https://phrasee.co/](https://phrasee.co/)*


    Deep Reinforcement Learning (using Deep Neural Networks for choosing actions)
    achieved some great things lately:


    *   [Play Atari games](https://www.cs.toronto.edu/~vmnih/docs/dqn.pdf)


    *   [Play Doom](https://www.youtube.com/watch?v=oo0TraGu6QY)


    *   [Dominate the game of Go](https://deepmind.com/blog/alphago-zero-learning-scratch/)


    #### Markov Decision Processes


    Markov Decision Process (MDP) is a mathematical formulation of the RL problem.
    MDPs satisfy the Markov property:


    **Markov property** - the current state completely represents the state of the
    environment (world). That is, the future depends only on the present.


    An MDP can be defined by ![(S, A, R, P, \\gamma)](images/leanpub_equation_129.png)where:


    *   ![S](images/leanpub_equation_130.png)\- set of possible states


    *   ![A](images/leanpub_equation_131.png)\- set of possible actions


    *   ![R](images/leanpub_equation_132.png)\- probability distribution of reward
    given (state, action) pair


    *   ![P](images/leanpub_equation_133.png)\- probability distribution over how
    likely any of the states is to be the new states, given (state, action) pair.
    Also known as transition probability.


    *   ![\\gamma](images/leanpub_equation_134.png)\- reward discount factor


    The discount factor ![\\gamma](images/leanpub_equation_135.png)allows us to inject
    the heuristic that 100 bucks now are more valuable than 100 bucks in 30 days.
    A discount factor of 1 would make future rewards worth just as much as immediate
    rewards.


    Another reason to discount future rewards:


    > In the long run we are all dead - J. M. Keynes


    #### Learning


    Here is how learning happens in RL context:


    for time step ![t=0](images/leanpub_equation_136.png)until done:


    1.  The environment gives your agent a state


    2.  Your agent chooses an action (from a set of possible ones)


    3.  The environment gives a reward along with a new state


    4.  Continue until the goal or other condition is met


    What is the objective of all this? Find a function ![\\pi^\*](images/leanpub_equation_137.png),
    known as optimal policy, that maximizes the cumulative discounted reward:


    ![\\sum\_{t \\geq 0}\\gamma^t r\_t](images/leanpub_equation_138.png)


    where ![r\_t](images/leanpub_equation_139.png)is the reward received at step ![t](images/leanpub_equation_140.png)and
    ![\\gamma^t](images/leanpub_equation_141.png)is the discount factor at step ![t](images/leanpub_equation_142.png).


    A policy ![\\pi](images/leanpub_equation_143.png)is a function that maps state
    ![s](images/leanpub_equation_144.png)to action ![a](images/leanpub_equation_145.png),
    that our agent believes is the best given that state.


    #### Value function


    The value function gives you the maximum expected future reward the agent will
    get, starting from some state ![s](images/leanpub_equation_146.png)and following
    some policy ![\\pi](images/leanpub_equation_147.png).


    ![V\_{\\pi}(s) = \\mathop{\\mathbb{E}}\_{\\pi}\[\\sum\_{k=0}^{\\infty} \\gamma^k
    R\_{t + k + 1} | S\_t = s\]](images/leanpub_equation_148.png)


    There exists an **optimal value function** that has the highest value for all
    states. Defined as:


    ![V^\*(s) = \\max\_{\\pi}V^{\\pi}(s) \\quad \\forall s \\in \\mathbb{S}](images/leanpub_equation_149.png)


    #### ![Q](images/leanpub_equation_150.png)\-function


    Similarly, let’s define another function known as ![Q](images/leanpub_equation_151.png)\-function
    (state-action value function) that gives the expected return starting from state
    ![s](images/leanpub_equation_152.png), taking action ![a](images/leanpub_equation_153.png),
    and following policy ![\\pi](images/leanpub_equation_154.png).


    ![Q\_{\\pi}(s, a) = \\mathop{\\mathbb{E}}\_{\\pi}\[\\sum\_{k=0}^{\\infty} \\gamma^k
    R\_{t + k + 1} | S\_t = s, A\_t = a\]](images/leanpub_equation_155.png)


    You can think of the ![Q](images/leanpub_equation_156.png)\-function as the “quality”
    of a certain action given a state. We can define the optimal ![Q](images/leanpub_equation_157.png)\-function
    as:


    ![Q^\*(s, a) = \\max\_{\\pi}Q^{\\pi}(s, a) \\quad \\forall s \\in \\mathbb{S}](images/leanpub_equation_158.png)


    There is a relationship between the two optimal functions ![V^\*](images/leanpub_equation_159.png)and
    ![Q^\*](images/leanpub_equation_160.png). It is given by:


    ![V^\*(s) = \\max\_aQ^\*(s, a) \\quad \\forall s \\in \\mathbb{S}](images/leanpub_equation_161.png)


    That is, the maximum expected total reward when starting at ![s](images/leanpub_equation_162.png)is
    the maximum of ![Q^\*(s, a)](images/leanpub_equation_163.png)over all possible
    actions.'
