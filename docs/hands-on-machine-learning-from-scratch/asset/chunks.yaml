    \ It contains *1460* training data points and 80 features that might help us predict\
    \ the selling price of a house.\n\n### Decision Trees\n\nDecision tree models\
    \ build structures like this:\n\n![](images/3_tree-structure.png)\n\n*Image credit:\
    \ [xoriant.com](https://www.xoriant.com/)*\n\nThe algorithms for building trees\
    \ breaks down a data set into smaller and smaller subsets while an associated\
    \ decision tree is incrementally developed. The final result is a tree with decision\
    \ nodes and leaf nodes. A decision node has two or more branches. Leaf node represents\
    \ a classification or decision (used for regression). The topmost decision node\
    \ in a tree which corresponds to the best predictor (most important feature) is\
