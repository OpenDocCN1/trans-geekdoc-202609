    \ = x <= x[r]\n29             rhs = x > x[r]\n30             if rhs.sum() < self.min_leaf\
    \ or lhs.sum() < self.min_leaf: continue\n31 \n32             curr_score = self.find_score(lhs,\
    \ rhs)\n33             if curr_score < self.score:\n34                 self.var_idx\
    \ = var_idx\n35                 self.score = curr_score\n36                 self.split\
    \ = x[r]\n37 \n38     def find_score(self, lhs, rhs):\n39         y = self.y[self.idxs]\n\
    40         lhs_std = y[lhs].std()\n41         rhs_std = y[rhs].std()\n42     \
    \    return lhs_std * lhs.sum() + rhs_std * rhs.sum()\n43 \n44     @property\n\
    45     def split_col(self): return self.x.values[self.idxs,self.var_idx]\n46 \n\
    47     @property\n48     def is_leaf(self): return self.score == float('inf')\n\
    49 \n50     def predict(self, x):\n51         return np.array([self.predict_row(xi)\
    \ for xi in x])\n52 \n53     def predict_row(self, xi):\n54         if self.is_leaf:\
    \ return self.val\n55         node = self.lhs if xi[self.var_idx] <= self.split\
    \ else self.rhs\n56         return node.predict_row(xi)\n```\n\n### Evaluation\n\
