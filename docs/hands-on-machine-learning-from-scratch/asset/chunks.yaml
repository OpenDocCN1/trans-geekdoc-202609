  fmt: "\nOne approach is to head over to a place where the `PROs` share their work.\
    \ Pages like [Dribbble](https://dribbble.com/), [uplabs](https://www.uplabs.com/)\
    \ and [Behance](https://www.behance.net/) have the goods.\n\nAfter finding mockups\
    \ you like, you might want to extract colors from them and use those. This might\
    \ require opening specialized software, manually picking color with some tool(s)\
    \ and other over-the-counter hacks. Let’s use Machine Learning to make your life\
    \ easier.\n\n[**Complete source code notebook**](https://colab.research.google.com/drive/1_p1nptDfvJhcSvprmi1WtoIugsCI40Xa)\n\
    \n## Unsupervised Learning\n\nUp until now we only looked at models that require\
    \ training data in the form of features and labels. In other words, for each example,\
    \ we need to have the correct answer, too.\n\nUsually, such training data is hard\
    \ to obtain and requires many hours of manual work done by humans (yes, we’re\
    \ already serving “The Terminators”). Can we skip all that?\n\nYes, at least for\
    \ some problems we can use example data without knowing the correct answer for\
    \ it. One such problem is `clustering`.\n\n### What is clustering?\n\nGiven some\
    \ vector of data points ![X](images/leanpub_equation_48.png), clustering methods\
    \ allow you to put each point in a group. In other words, you can categorize a\
    \ set of entities, based on their properties, automatically.\n\nYes, that is very\
    \ useful in practice. Usually, you run the algorithm on a bunch of data points\
    \ and specify how much groups you want. For example, your inbox contains two main\
    \ groups of e-mail: spam and not-spam (were you waiting for something else?).\
    \ You can let the clustering algorithm create two groups from your emails and\
    \ use your beautiful brain to classify which is which.\n\nMore applications of\
    \ clustering algorithms:\n\n*   `Customer segmentation` - find groups of users\
    \ that spend/behave the same way\n*   `Fraudulent transactions` - find bank transactions\
    \ that belong to different clusters and identify them as fraudulent\n*   `Document\
    \ analysis` - group similar documents\n\n### The Data\n\n![](images/4_data-preview.png)\
    \ *source: various authors on https://www.uplabs.com/*\n\nThis time, our data\
    \ doesn’t come from some predefined or well-known dataset. Since Unsupervised\
    \ learning does not require labeled data, the Internet can be your oyster.\n\n\
    Here, we’ll use 3 mobile UI designs from various authors. Our model will run on\
    \ each shot and try to extract the color palette for each.\n\n### What is K-Means\
    \ Clustering?\n\nK-Means Clustering is defined by [Wikipedia](https://en.wikipedia.org/wiki/K-means_clustering)\
    \ as:\n\n> k-means clustering is a method of vector quantization, originally from\
    \ signal processing, that is popular for cluster analysis in data mining. k-means\
    \ clustering aims to partition n observations into k clusters in which each observation\
    \ belongs to the cluster with the nearest mean, serving as a prototype of the\
    \ cluster. This results in a partitioning of the data space into Voronoi cells.\n\
    \nWikipedia also tells us that solving K-Means clustering is difficult (in fact,\
    \ [NP-hard](https://en.wikipedia.org/wiki/NP-hardness)) but we can find local\
    \ optimum solutions using some heuristics.\n\nBut how do `K-Means Clustering`\
    \ works?\n\nLet’s say you have some vector ![X](images/leanpub_equation_49.png)that\
    \ contains ![n](images/leanpub_equation_50.png)data points. Running our algorithm\
    \ consists of the following steps:\n\n1.  Take random ![k](images/leanpub_equation_51.png)points\
    \ (called `centroids`) from ![X](images/leanpub_equation_52.png)\n2.  Assign every\
    \ point to the closest centroid. The newly formed bunch of points is called `cluster`.\n\
    3.  For each cluster, find new centroid by calculating a new center from the points\n\
    4.  Repeat steps 2-3 until centroids stop changing\n\nLet’s see how can we use\
    \ it to extract color palettes from mobile UI screenshots.\n\n### Data Preprocessing\n\
    \nGiven our data is stored in raw pixels (called images), we need a way to convert\
    \ it to points that our clustering algorithm can use.\n\nLet’s first define two\
    \ classes that represent a point and cluster:\n\n```\n1 class Point:\n2 \n3  \
    \ def __init__(self, coordinates):\n4     self.coordinates = coordinates\n```\n\
    \nOur `Point` is just a holder to the coordinates for each.\n\n```\n1 class Point:\n\
    2 \n3   def __init__(self, coordinates):\n4     self.coordinates = coordinates\n\
    ```\n\nThe `Cluster` is defined by its center.\n\n```\n1 class Cluster:\n2 \n\
    3   def __init__(self, center):\n4     self.center = center\n```\n\nGiven a path\
    \ we can create the points as follows:\n\n```\n1 def get_points(path):\n2   img\
    \ = Image.open(path)\n3   w, h = img.size\n4   points = []\n5   for x in range(w):\n\
    6     for y in range(h):\n7       points.append(img.getpixel((x, y)))\n8   return\
    \ points\n```\n\nCouple of things are happening:\n\n*   `load` the image\n*  \
    \ `resize` transparency\n*   `drop` information\n\n### Distance function\n\nNote\
    \ that while `Euclidean` distance is simple it might not be the best way. Here\
    \ is the Python implementation:\n\n```\n1 def euclidean(p, q):\n2   n_dim = len(p.coordinates)\n\
    3    return sqrt(sum([\n4       (p.coordinates[i] - q.coordinates[i]) ** 2 for\
    \ i in range(n_dim))\n5   \n```\n\n### Implementing K-Means clustering\n\nNow\
    \ that you have all pieces of the puzzle you can implement the K-Means algorithm.\
    \ Let’s start with the method that finds the center for a set of points:\n\n```\n\
    1 def calculate_center(self, points):\n2   n_dim = len(points[0].coordinates)\n\
    3   vals = [0.0 for i in range(n_dim)]\n4   for p in points:\n5     for i in range(n_dim):\n\
    6       vals[i] += p.coordinates[i]\n7   coords = [v / len(points) for v in vals]\n\
    8   return Point(coords)\n```To find the center of a set of points, we add the\
    \ values for each dimension and divide by the number of points.\n\nNow for finding\
    \ the actual clusters:\n\n```\n1 def assign_points(self, clusters, points):\n\
    2   plists = [[] for i in range(self.n_clusters)]\n3 \n4   for p in points:\n\
    5     smallest_distance = float('inf')\n6 \n7     for i in range(self.n_clusters):\n\
    8       distance = euclidean(p, clusters[i].center)\n9       if distance < smallest_distance:\n\
    10         smallest_distance = distance\n11         idx = i\n12 \n13     plists[idx].append(p)\n\
    14 \n15   return plists\n16 \n17 def fit(self, points):\n18   clusters = [Cluster(center=p,\
    \ points=[p]) for p in random.sample(points, self.n_clusters)]\n20 \n21   while\
    \ True:\n22 \n23     plists = self.assign_points(clusters, points)\n24 \n25  \
    \   diff = 0\n26 \n27     for i in range(self.n_clusters):\n28       if not plists[i]:\n\
    29         continue\n30       old = clusters[i]\n31       center = self.calculate_center(plists[i])\n\
    32       new = Cluster(center, plists[i])\n33       clusters[i] = new\n34    \
    \   diff = max(diff, euclidean(old.center, new.center))\n35 \n36     if diff <\
    \ self.min_diff:\n37       break\n38 \n39   return clusters\n```\n\nThe implementation\
    \ follows the description of the algorithm given above. Note that we exit the\
    \ training loop when the color difference is lower than the one set by us.\n"
  trans: "\n\n一种方法是前往 `PROs` 分享作品的地方。像 [Dribbble](https://dribbble.com/)、[uplabs](https://www.uplabs.com/)\
    \ 和 [Behance](https://www.behance.net/) 这样的页面有很多优秀素材。\n\n在找到你喜欢的模型稿后，你可能想从中提取颜色并使用它们。这可能需要打开专门的软件，使用某些工具手动挑选颜色，以及其他现成的小技巧。让我们使用机器学习来让你的生活变得简单吧。\n\
    \n[**完整源代码笔记本**](https://colab.research.google.com/drive/1_p1nptDfvJhcSvprmi1WtoIugsCI40Xa)\n\
    \n## 无监督学习\n\n到目前为止，我们只看了需要特征和标签形式的训练数据的模型。换句话说，对于每个示例，我们都需要对应的正确答案。\n\n通常，这种训练数据很难获得，需要人类花费许多小时的人工工作（是的，我们已经在服务于“终结者”了）。我们可以跳过所有这一切吗？\n\
    \n可以，至少对于某些问题，我们可以在不知道正确答案的情况下使用示例数据。其中一个问题就是 `聚类`。\n\n### 什么是聚类？\n\n给定一组数据点向量\
    \ ![X](img/leanpub_equation_48.png)，聚类方法允许你将每个点放入一个组中。换句话说，你可以根据它们的属性自动对一组实体进行分类。\n\
    \n是的，这在实践中非常有用。通常，你在一组数据点上运行算法并指定你想要的组数。例如，你的收件箱包含两类邮件：垃圾邮件和非垃圾邮件（你还在等别的吗？）。你可以让聚类算法从你的邮件创建两个组，然后用你聪明的大脑来分类哪些是什么。\n\
    \n聚类算法的其他应用：\n\n*   `客户细分` - 寻找消费/行为相同的用户群体\n*   `欺诈交易` - 寻找属于不同簇的银行交易并将其识别为欺诈交易\n\
    *   `文档分析` - 将相似的文档分组\n\n### 数据\n\n![](img/4_data-preview.png) *来源：https://www.uplabs.com/\
