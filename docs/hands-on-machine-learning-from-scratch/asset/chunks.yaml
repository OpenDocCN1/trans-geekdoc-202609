- raw: "![W := W - \\\\alpha (\\\\frac{1}{m}(y - h\\_w)x)](images/leanpub_equation_31.png)\n\
    \nThe parameter a is known as *learning rate*. High learning rate can converge\
    \ quickly, but risks overshooting the lowest point. Low learning rate allows for\
    \ confident moves in the direction of the negative gradient. However, it time-consuming\
    \ so it will take us a lot of time to get to converge.\n\n![](images/1_big-small-lr.png)\n\
    \n*Image credit: [Towards Data Science](https://towardsdatascience.com/)*\n\n\
    #### The Gradient descent algorithm\n\nThe algorithm we’re going to use works\
    \ as follows:\n\n```\n1 Repeat until convergence {\n2   1. Calculate gradient\
    \ average\n3   2. Multiply by learning rate\n4   3. Subtract from weights\n5 }\n\
    ```\n\nLet’s do this in Python:\n\n```\n 1 def predict(X, W):\n 2   return sigmoid(np.dot(X,\
    \ W))\n 3 \n 4 def fit(X, y, n_iter=100000, lr=0.01):\n 5 \n 6   W = np.zeros(X.shape[1])\n\
    \ 7 \n 8   for i in range(n_iter):\n 9       z = np.dot(X, W)\n10       h = sigmoid(z)\n\
    11       gradient = np.dot(X.T, (h - y)) / y.size\n12       W -= lr * gradient\n\
    13   return W\n```\n\nAbout that until convergence part. You might notice that\
    \ we kinda brute-force our way around it. That is, we will run the algorithm for\
    \ a preset amount of iterations. Another interesting point is the initialization\
    \ of our weights W — initially set at zero.\n\nLet’s put our implementation to\
    \ the test, literally. But first, we need a function that helps us predict y given\
    \ some data X (predict whether or not we should send a discount to a customer\
    \ based on its spending):\n\n```\n1 def predict(X, W):\n2   return sigmoid(np.dot(X,\
    \ W))\n```\n\nNow for our simple test:\n\n```\n 1 class TestGradientDescent(unittest.TestCase):\n\
    \ 2 \n 3     def test_correct_prediction(self):\n 4       global X\n 5       global\
    \ y\n 6       if len(X.shape) != 2:\n 7         X = X.reshape(X.shape[0], 1)\n\
    \ 8       w = fit(X, y)\n 9       y_hat = predict(X, w).round()\n10       self.assertTrue((y_hat\
    \ == y).all())\n```\n\nNote that we use reshape to add a dummy dimension to X.\
    \ Further, after our call to predict, we round the results. Recall that the sigmoid\
    \ function spits out (kinda like a dragon with an upset stomach) numbers in the\
    \ \\[0; 1\\] range. We’re just going to round the result in order to obtain our\
    \ 0 or 1 (yes or no) answers.\n\nrun\\_tests()\n\nHere is the result of running\
    \ our test case:\n\nF\n\nWell, that’s not good, after all that hustling we’re\
    \ nowhere near achieving our goal of finding good parameters for our model. But,\
    \ what went wrong?\n\nWelcome to your first model debugging session! Let’s start\
    \ by finding whether our algorithm improves over time. We can use our loss metric\
    \ for that:\n\n```\n 1 def fit(X, y, n_iter=100000, lr=0.01):\n 2 \n 3   W = np.zeros(X.shape[1])\n\
    \ 4 \n 5   for i in range(n_iter):\n 6       z = np.dot(X, W)\n 7       h = sigmoid(z)\n\
    \ 8       gradient = np.dot(X.T, (h - y)) / y.size\n 9       W -= lr * gradient\n\
    10 \n11       if(i % 10000 == 0):\n12           e = loss(h, y)\n13           print(f'loss:\
    \ {e} \\t')\n14 \n15   return W\n```\n\nrun\\_tests()\n\nWe pretty much copy &\
    \ pasted our training code except that we’re printing the training loss every\
    \ *10,000* iterations. Let’s have a look:\n\n```\n 1     loss: 0.6931471805599453\n\
    \ 2     loss: 0.41899283818630056\n 3     loss: 0.41899283818630056\n 4     loss:\
    \ 0.41899283818630056\n 5     loss: 0.41899283818630056\n 6     loss: 0.41899283818630056\n\
    \ 7     loss: 0.41899283818630056\n 8     loss: 0.41899283818630056\n 9     loss:\
    \ 0.41899283818630056\n10     loss: 0.41899283818630056\n```\n\nF……..\n\n![](images/1_gd.png)\n\
    \nSuspiciously enough, we found a possible cause for our problem on the first\
    \ try! Our loss doesn’t get low enough, in other words, our algorithm gets stuck\
    \ at some point that is not a good enough minimum for us. How can we fix this?\
    \ Perhaps, try out different learning rate or initializing our parameter with\
    \ a different value?\n\nFirst, a smaller learning rate a :\n\n```\n 1 def fit(X,\
    \ y, n_iter=100000, lr=0.001):\n 2 \n 3   W = np.zeros(X.shape[1])\n 4 \n 5  \
    \ for i in range(n_iter):\n 6       z = np.dot(X, W)\n 7       h = sigmoid(z)\n\
    \ 8       gradient = np.dot(X.T, (h - y)) / y.size\n 9       W -= lr * gradient\n\
    10 \n11       if(i % 10000 == 0):\n12         e = loss(h, y)\n13         print(f'loss:\
    \ {e} \\t')\n14 \n15   return W\n```\n\n```\n1 run_tests()\n```\n\nWith a=0.001\
    \ we obtain this:\n\n```\n 1 loss: 0.42351356323845546\n 2 loss: 0.41899283818630056\n\
    \ 3 loss: 0.41899283818630056\n 4 loss: 0.41899283818630056\n 5 loss: 0.41899283818630056\n\
    \ 6 loss: 0.41899283818630056\n 7 loss: 0.41899283818630056\n 8 loss: 0.41899283818630056\n\
    \ 9 loss: 0.41899283818630056\n10 loss: 0.41899283818630056\n11 \n12 F.......\n\
    ```\n\nNot so successful, are we? How about adding one more parameter for our\
    \ model to find/learn?\n\n```\n 1 def add_intercept(X):\n 2   intercept = np.ones((X.shape[0],\
    \ 1))\n 3   return np.concatenate((intercept, X), axis=1)\n 4 \n 5 def predict(X,\
    \ W):\n 6   X = add_intercept(X)\n 7   return sigmoid(np.dot(X, W))\n 8 \n 9 def\
    \ fit(X, y, n_iter=100000, lr=0.01):\n10 \n11   X = add_intercept(X)\n12   W =\
    \ np.zeros(X.shape[1])\n13 \n14   for i in range(n_iter):\n15       z = np.dot(X,\
    \ W)\n16       h = sigmoid(z)\n17       gradient = np.dot(X.T, (h - y)) / y.size\n\
    18       W -= lr * gradient\n19   return W\n```\n\n```\n1 run_tests()\n```\n\n\
    And for the results:\n\n```\n1 ........\n2 ---------------------------------------------------------\n\
    3 Ran 8 tests in 0.686s\n4 \n5 OK\n```\n\n![](images/1_gd-params.png)\n\nWhat\
    \ we did here? We added a new element to our parameter vector W and set it’s initial\
    \ value to 1. Seems like this turn things into our favor!\n\n### Bonus — building\
    \ your own LogisticRegressor\n\nKnowing all of the details of the inner workings\
    \ of the Gradient descent is good, but when solving problems in the wild, we might\
    \ be hard pressed for time. In those situations, a simple & easy to use interface\
    \ for fitting a Logistic Regression model might save us a lot of time. So, let’s\
    \ build one!\n\nBut first, let’s write some tests:\n\n```\n1 class TestLogisticRegressor(unittest.TestCase):\n\
    2 \n3     def test_correct_prediction(self):\n4       global X\n5       global\
    \ y\n6       X = X.reshape(X.shape[0], 1)\n7       clf = LogisticRegressor()\n\
    8       y_hat = clf.fit(X, y).predict(X)\n9       self.assertTrue((y_hat == y).all())\n\
    ```\n\n```\n 1 class LogisticRegressor:\n 2 \n 3   def _add_intercept(self, X):\n\
    \ 4     intercept = np.ones((X.shape[0], 1))\n 5     return np.concatenate((intercept,\
    \ X), axis=1)\n 6 \n 7   def predict_probs(self, X):\n 8     X = self._add_intercept(X)\n\
    \ 9     return sigmoid(np.dot(X, self.W))\n10 \n11   def predict(self, X):\n12\
    \     return self.predict_probs(X).round()\n13 \n14   def fit(self, X, y, n_iter=100000,\
    \ lr=0.01):\n15 \n16     X = self._add_intercept(X)\n17     self.W = np.zeros(X.shape[1])\n\
    18 \n19     for i in range(n_iter):\n20         z = np.dot(X, self.W)\n21    \
    \     h = sigmoid(z)\n22         gradient = np.dot(X.T, (h - y)) / y.size\n23\
    \         self.W -= lr * gradient\n24     return self\n```\n\n```\n1 run_tests()\n\
    ```\n\nWe just packed all previously written functions into a tiny class. One\
    \ huge advantage of this approach is the fact that we hide the complexity of the\
    \ Gradient descent algorithm and the use of the parameters ***W***.\n\n#### Using\
    \ our Regressor to decide who should receive discount codes\n\nNow that you’re\
    \ done with the “hard” part let’s use the model to predict whether or not we should\
    \ send discount codes.\n\nLet’s recall our initial data:\n\n![](images/1_data.png)\n\
    \nNow let’s try our model on data obtained from 2 new customers:\n\n```\n1 Customer\
    \ 1 - $10\n2 Customer 2 - $250\n```\n\n```\n1 X_test = np.array([10, 250])\n2\
    \ X_test = X_test.reshape(X_test.shape[0], 1)\n3 y_test = LogisticRegressor().fit(X,\
    \ y).predict(X_test)\n```\n\n```\n1 y_test\n```\n\nRecall that 1 means send code\
    \ and 0 means do not send:\n\n```\n1 array([1., 0.])\n```\n\nLooks reasonable\
    \ enough. Care to try out more cases?\n\n### Conclusion\n\nWell done! You have\
    \ a complete (albeit simple) LogisticRegressor implementation that you can play\
    \ with. Go on, have some fun with it!"
