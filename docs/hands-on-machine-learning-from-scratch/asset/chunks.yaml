- raw: "> TL;DR Build a Recommender System in Python from scratch. Create a *ratings*\
    \ matrix from last.fm dataset and preprocess the data. Train the model using Stochastic\
    \ Gradient Descent (SGD) and use it to recommend music artists.\n\nRecommender\
    \ Systems are becoming more and more relevant as the amount of information on\
    \ “The Internets” is exponentially increasing:\n\n![](images/ml-scratch-7----internet-data.png)\n\
    \nFinding what you might enjoy from books, movies, games to who to follow on Instagram\
    \ becomes increasingly difficult. Moreover, we (the users) require faster interactions\
    \ with the products we use on a daily basis, so we don’t feel like we waste time\
    \ (even though we do it more than ever before in human history). As the amounts\
    \ of data increase, your computational resources might have a hard time to produce\
    \ fast enough results.\n\nHere, we’ll have a look at a succinct implementation\
    \ of a Recommender System that is both the basis of many real-world implementations\
    \ and is easy to understand. I can highly recommend you to read this through :)\n\
    \n[Complete source code in Google Colaboratory Notebook](https://colab.research.google.com/drive/1_WxDPLGkJY3qJ-PK0J1YjATaZz35efmk)\n\
    \n### User Ratings\n\nTraditionally, recommender systems are built around user\
    \ ratings given for a set of items, e.g. movie ratings on IMDB. Here, we’ll have\
    \ a look at using another metric for making recommendations.\n\nOur data comes\
    \ from [last.fm](https://www.last.fm/), hosted by GroupLens (download from [here](https://grouplens.org/datasets/hetrec-2011/)).\
    \ It contains the following:\n\n*   **user\\_artists.dat** - userID, artistID,\
    \ weight - plays of artist by user.\n\n*   **artists.dat** - id, name, url, pictureURL\n\
    \n*   **tags.dat** - tagID, tagValue\n\n*   **user\\_taggedartists.dat** - userID,\
    \ artistID, tagID, day, month, year\n\n*   **user\\_taggedartists-timestamps.dat**\
    \ - userID, artistID, tagID, timestamp\n\n*   **user\\_friends.dat** - userID,\
    \ friendID. User/friend relationships.\n\nWe’ll focus on **user\\_artists.dat**\
    \ and **artists.dat** as they contain all data required to make recommendations\
    \ for new music artists to a user. Instead of ratings, we’re going to use the\
    \ play count by a user for each artist.\n\n#### Loading the data\n\nLet’s load\
    \ the data into Pandas data frames:\n\n```\n1 plays = pd.read_csv('user_artists.dat',\
    \ sep='\\t')\n2 artists = pd.read_csv(\n3   'artists.dat',\n4   sep='\\t',\n5\
    \   usecols=['id','name']\n6 )\n```\n\n#### Data wrangling\n\nYou need to do a\
    \ bit of wrangling before working with the data:\n\n```\n1 ap = pd.merge(\n2 \
    \  artists, plays,\n3   how=\"inner\",\n4   left_on=\"id\",\n5   right_on=\"artistID\"\
    \n6 )\n7 ap = ap.rename(columns={\"weight\": \"playCount\"})\n```\n\nWe merge\
    \ the artists and user plays and rename the weight column to *playCount*. Let’s\
    \ rank the artists based on how much they were played by the users:\n\n```\n1\
    \ artist_rank = ap.groupby(['name']) \\\n2   .agg({'userID' : 'count', 'playCount'\
    \ : 'sum'}) \\\n3   .rename(columns={\"userID\" : 'totalUniqueUsers', \"playCount\"\
    \ : \"totalArtistPlays\"})\\\n4  \\\n5   .sort_values(['totalArtistPlays'], ascending=False)\n\
    6 \n7 artist_rank['avgUserPlays'] = artist_rank['totalArtistPlays'] / artist_rank['totalUn\\\
    \n8 iqueUsers']\n```\n\nAnd merge the results with the previous data frame:\n\n\
    ```\n1 ap = ap.join(artist_rank, on=\"name\", how=\"inner\") \\\n2   .sort_values(['playCount'],\
    \ ascending=False)\n```\n\nHere is a subset of the data:\n\n| name || userID ||\
    \ artistID || playCount |\n\n| --- | --- | --- | --- |\n\n| Depeche Mode || 1642\
    \ || 72 || 352698 |\n\n| --- | --- | --- | --- |\n\n| Thalía || 2071 || 792 ||\
    \ 324663 |\n\n| U2 || 1094 || 511 || 320725 |\n\n| Blur || 1905 || 203 || 257978\
    \ |\n\n| Paramore || 1664 || 498 || 227829 |\n\n#### Exploration\n\nLet’s look\
    \ at how much each artist is played by users:\n\n![](images/ml-scratch-7----artist-played-count.png)\n\
    \nand the names of the artists that were played most:\n\n![](images/ml-scratch-7----plays-by-artist.png)\n\
    \nhow much of the users play the artist:\n\n![](images/ml-scratch-7----users-by-artist.png)\n\
    \nhere’s another look at artist popularity:\n\n![](images/ml-scratch-7----artist-popularity.png)\n\
    \nNo surprises here, popular artists are taking the majority of the plays. Good\
    \ thing that “The Beatles” still hold strong, though :)\n\n### Recommender Systems\n\
    \nRecommender systems (RS) are used pretty much everywhere where you have an array\
    \ of items to choose from. They work by making suggestions that might help you\
    \ make better/faster choices.\n\nYou might think that you’re a special snowflake,\
    \ but RS exploit behavior patterns that are shared between users (you and other\
    \ people). For example, you and your friends might have similar tastes for some\
    \ stuff. RS try to find “friends” within other users and recommend things you\
    \ haven’t tried that.\n\nThe two most used types of RS are Content-Based and Collaborative\
    \ Filtering (CF). Collaborative filtering produces recommendations based on the\
    \ knowledge of users’ preference to items, that is it uses the “wisdom of the\
    \ crowd” to recommend items. In contrast, content-based recommender systems focus\
    \ on the properties of the items and give you recommendations based on the similarity\
    \ between them.\n\n#### Collaborative Filtering (CF)\n\nCollaborative filtering\
    \ (CF) is the workhorse of recommender engines. What is good about the algorithm\
    \ is its property of being able to do feature learning, which allows it to start\
    \ to learn which features to use. CF can be divided into *Memory-Based Collaborative\
    \ Filtering* and *Model-Based Collaborative Filtering*.\n\n##### Memory-Based\
    \ Collaborative Filtering\n\nMemory-Based CF methods can be divided into two sections:\
    \ user-item filtering and item-item filtering. Here is the difference:\n\n*  \
    \ Item-Item Collaborative Filtering: “Users who liked this item also liked …”\n\
    \n*   User-Item Collaborative Filtering: “Users who are similar to you (kinda\
    \ like the twin you never knew you had) also liked …”\n\nBoth methods require\
    \ user-item matrix that contain the ratings for user ![u](images/leanpub_equation_70.png)for\
    \ item ![i](images/leanpub_equation_71.png). From that, you can calculate the\
    \ similarity matrix.\n\nThe similarity values in Item-Item Collaborative Filtering\
    \ are calculated by taking into account all users who have rated a pair of items.\n\
    \nFor User-Item Collaborative Filtering, the similarity values are calculated\
    \ by observing all items that are rated by a pair of users.\n\n##### Model-Based\
    \ Collaborative Filtering\n\nModel-based CF methods are based on [matrix factorization\
    \ (MF)](https://en.wikipedia.org/wiki/Matrix_factorization_\\(recommender_systems\\\
    )). MF methods are used as an unsupervised learning method for latent variable\
    \ decomposition and dimensionality reduction. They can handle scalability and\
    \ sparsity problems better than Memory-based CF.\n\nThe goal of MF is to learn\
    \ latent user preferences and item attributes from known ratings. Then use those\
    \ variable to predict unknown ratings through the dot product of the latent features\
    \ of users and items.\n\nMatrix factorization restructures the user-item matrix\
    \ into a low-rank matrix. You can represent it by the multiplication of two low-rank\
    \ matrices, where the rows contain a vector of latent variables. You want this\
    \ matrix to approximate the original matrix, as closely as possible, by multiplying\
    \ the low-rank matrices together. That way, you predict the missing entries in\
    \ the original matrix.\n\n###### Singular Value Decomposition\n\nCollaborative\
    \ Filtering can be formulated by approximating a matrix ![X](images/leanpub_equation_72.png)by\
    \ using Singular Value Decomposition (SVD). The winning team at the [Netflix Prize\
    \ competition](https://medium.com/netflix-techblog/netflix-recommendations-beyond-the-5-stars-part-1-55838468f429)\
    \ used SVD matrix factorization models to win the prize. SVD can be expressed\
    \ as:\n\n![X = USV^T](images/leanpub_equation_73.png)\n\nGiven ![m \\\\times n](images/leanpub_equation_74.png)matrix\
    \ ![X](images/leanpub_equation_75.png):\n\n*   ![U](images/leanpub_equation_76.png)is\
    \ ![(m \\\\times r)](images/leanpub_equation_77.png)orthogonal matrix"
  fmt: "\n> TL;DR Build a Recommender System in Python from scratch. Create a `ratings`\
    \ matrix from last.fm dataset and preprocess the data. Train the model using Stochastic\
    \ Gradient Descent (SGD) and use it to recommend music artists.\n\nRecommender\
