  fmt: "\nwhere ![A](images/leanpub_equation_57.png) and ![B](images/leanpub_equation_58.png)\
    \ are some events and ![P(.)](images/leanpub_equation_59.png) is probability.\n\
    \nThis equation gives us the conditional probability of event ![A](images/leanpub_equation_60.png)\
    \ occurring given ![B](images/leanpub_equation_61.png) has happened. In order\
    \ to find this, we need to calculate the probability of ![B](images/leanpub_equation_62.png)\
    \ happening given ![A](images/leanpub_equation_63.png) has happened and multiply\
    \ that by the probability of ![A](images/leanpub_equation_64.png) (known as `Prior`)\
    \ happening. All of this is divided by the probability of ![B](images/leanpub_equation_65.png)\
    \ happening on its own.\n\nThe naive assumption allows us to reformulate the Bayes\
    \ theorem for our example as:\n\n![P(Sentiment|w\\_1,\\dots,w\\_n)=\\frac{P(Sentiment)\
    \ \\displaystyle \\prod\\_{i=1}^{n}{P(w\\_i|Sentiment)}}{P(w\\_1,\\dots,w\\_n)}](images/leanpub_equation_66.png)\n\
    \nWe don’t really care about probabilities. We only want to know whether a given\
    \ text has a positive or negative sentiment. We can skip the denominator entirely\
    \ since it just scales the numerator:\n\n![P(Sentiment|w\\_1,\\dots,w\\_n) \\\
    propto P(Sentiment) \\prod\\_{i=1}^{n}{P(w\\_i|Sentiment)}](images/leanpub_equation_67.png)\n\
    \nTo choose the sentiment, we’ll compare the scores for each sentiment and pick\
    \ the one with a higher score.\n\n### Implementing Multinomial Naive Bayes\n\n\
    As you might’ve guessed by now, we’re classifying text into one of two groups/categories\
    \ - positive and negative sentiment.\n\nMultinomial Naive Bayes allows us to represent\
    \ the features of the model as frequencies of their occurrences (how often some\
    \ word is present in our review). In other words, it tells us that the probability\
    \ distributions we’re using are [multinomial](https://en.wikipedia.org/wiki/Multinomial_distribution).\n\
    \n#### Note on numerical stability\n\nOur model relies on multiplying many probabilities.\
    \ Those might become increasingly small and our computer might round them down\
    \ to zero. To combat this, we’re going to use log probability by taking log of\
    \ each side in our equation:\n\n![\\\\log{P(Sentiment|w\\_1,\\dots,w\\_n)} = \\\
    log{P(Sentiment)} + \\log{\\prod\\_{i=1}^{n}{P(w\\_i|Sentiment)}}](images/leanpub_equation_68.png)\n\
    \nNote that we can still use the highest score of our model to predict the sentiment\
    \ since log is [monotonic](https://en.wikipedia.org/wiki/Monotonic_function).\n\
    \n#### Building our model\n\nFinally, time to implement our model in Python. Let’s\
    \ start by defining some variables and group the data by class, so our training\
    \ code is a bit tidier:\n\n```python\n1 def fit(self, X, y):\n2     self.n_class_items\
    \ = {}\n3     self.log_class_priors = {}\n4     self.word_counts = {}\n5     self.vocab\
    \ = set()\n6     n = len(X)\n7     grouped_data = self.group_by_class(X, y)\n\
    8     ...\n```\n\nWe’re going to implement a generic text classifier that’t assume\
    \ the number of classes. You can use it for news category, sentiment analysis,\
    \ etc.\n\nFor each class, we’ll find the number of examples in it and the log\
    \ probability (prior). We’ll also record the number of occurrences of each word\
    \ and create a vocabulary - set of all words we’ve seen in the training data:\n\
    \n```python\n1 for c, data in grouped_data.items():\n2       self.n_class_items[c]\
    \ = len(data)\n3       self.log_class_priors[c] = math.log(self.n_class_items[c]\
    \ / n)\n4       self.word_counts[c] = defaultdict(lambda: 0)\n5 \n6       for\
    \ text in data:\n7         counts = self.tokenizer.tokenize(text)\n8         for\
    \ word, count in counts.items():\n9             if word not in self.vocab:\n10\
    \                 self.vocab.add(word)\n11 \n12             self.word_counts[c][word]\
    \ += count\n```\n\nNote that we use our `Tokenizer` and the built-in class [Counter](https://docs.python.org/3/library/collections.Counter)\
    \ to convert a review to a bag of words.\n\nIn case you’re interested, here’s\
    \ how `group_by_class` works:\n\n```python\n1 def group_by_class(self, X, y):\n\
    2   data = dict()\n3   for c in self.classes:\n4     data[c] = X[np.where(y ==\
    \ c)]\n5   return data\n```\n\n#### Making predictions\n\nIn order to predict\
    \ sentiment from text data, we’ll use our class priors and vocabulary:\n\n```python\n\
    1 def predict(self, X):\n2     result = []\n3     for text in X:\n4 \n5      \
    \ class_scores = {c: self.log_class_priors[c] for c in self.classes}\n6      \
    \ words = set(self.tokenizer.tokenize(text))\n7 \n8       for word in words:\n\
    9           if word not in self.vocab: continue\n10 \n11           for c in self.classes:\n\
    12 \n13             log_w_given_c = self.laplace_smoothing(word, c)\n14      \
    \       class_scores[c] += log_w_given_c\n15 \n16       result.append(max(class_scores,\
    \ key=class_scores.get))\n17 \n18     return result\n```\n\nFor each review, we\
    \ use the log priors for positive and negative sentiment and tokenize the text.\
    \ For each word, we check if it in the vocabulary and skip it if it is not. Then\
    \ we calculate the log probability of this word for each class. We add the class\
    \ scores and pick the class with a max score as our prediction.\n\n##### Laplace\
    \ smoothing\n\nNote that ![log(0)](images/leanpub_equation_69.png) `undefined`\
    \ (and no, we’re not using JavaScript). It is entirely possible for a word in\
    \ our vocabulary to be present in one class but not another - the probability\
    \ of finding this word in that class will be 0! We can use [Laplace smoothing](https://en.wikipedia.org/wiki/Additive_smoothing)\
    \ to fix this problem. We’ll simply add 1 to the numerator but also add the size\
    \ of our vocabulary to the denominator:\n\n```python\n1 def laplace_smoothing(self,\
    \ word, text_class):\n2   num = self.word_counts[text_class][word] + 1\n3   denom\
    \ = self.n_class_items[text_class] + len(self.vocab)\n4   return math.log(num\
    \ / denom)\n```\n\n### Predicting sentiment\n\nNow that your model can be trained\
    \ and make predictions, let’s use it to predict sentiment from movie reviews.\n\
    \n#### Data preparation\n\nAs discussed previously, we’ll use only the review\
    \ and sentiment columns from the training data. Let split it for training and\
    \ testing:\n\n```python\n1 X = train['review'].values\n2 y = train['sentiment'].values\n\
    3 \n4 X_train, X_test, y_train, y_test = train_test_split(\n5   X, y,\n6   test_size=0.2,\n\
    7   random_state=RANDOM_SEED\n8 )\n```\n\n#### Evaluation\n\nWe’ll pack our `fit`\
    \ and `predict` functions into a class called `MultinomialNaiveBayes`. Let’s use\
    \ it:\n\n```python\n1 MNB = MultinomialNaiveBayes(\n2     classes=np.unique(y),\n\
    3     tokenizer=Tokenizer()\n4 ).fit(X_train, y_train)\n```\n\nOur classifier\
    \ takes a list of possible classes and a `Tokenizer` as parameters. Also, the\
    \ API is quite nice (thanks scikit-learn!)\n\n```python\n1 y_hat = MNB.predict(X_test)\n\
    2 accuracy_score(y_test, y_hat)\n```\n\n```\n1 0.8556\n```\n\nThis looks nice\
    \ we got an accuracy of ~86% on the test set.\n\nHere is the classification report:\n\
    \n```\n1               precision    recall  f1-score   support\n2 \n3        \
    \    0       0.89      0.81      0.85      2481\n4            1       0.83   \
    \   0.90      0.86      2519\n5 \n6     accuracy                           0.86\
    \      5000\n7    macro avg       0.86      0.86      0.86      5000\n8 weighted\
    \ avg       0.86      0.86      0.86      5000\n```\n\nAnd the confusion matrix:\n\
    \n![](images/5_confusion-matrix.png)\n\nOverall, our classifier does pretty well\
    \ for himself. Submit the predictions to Kaggle and find out what place you’ll\
    \ get on the leaderboard.\n\n### Conclusion\n\nWell done! You just built a Multinomial\
    \ Naive Bayes classifier that does pretty well on sentiment prediction. You also\
    \ learned about Bayes theorem, text processing, and Laplace smoothing! Will another\
    \ flavor of the Naive Bayes classifier perform better?\n\n[Complete source code\
    \ in Google Colaboratory Notebook](https://colab.research.google.com/drive/1OPQDDJTKy0b40pziZWSsoBCmQV6HyXsm)\n\
    \nNext up, you’ll build a recommender system from scratch!\n"
  trans: "\n\n其中 ![A](img/leanpub_equation_57.png) 和 ![B](img/leanpub_equation_58.png)\
