- raw: "*   ![S](images/leanpub_equation_78.png)is ![(r \\\\times r)](images/leanpub_equation_79.png)diagonal\
    \ matrix with non-negative real numbers on the diagonal\n\n*   ![V^T](images/leanpub_equation_80.png)is\
    \ ![(r \\\\times n)](images/leanpub_equation_81.png)orthogonal matrix\n\nwhere\
    \ ![U](images/leanpub_equation_82.png)represents feature vectors of the users,\
    \ ![V](images/leanpub_equation_83.png)represents feature vectors of the items\
    \ and the elements on the diagonal of ![S](images/leanpub_equation_84.png)are\
    \ known as *singular values*.\n\nYou can make a prediction by taking the dot product\
    \ of ![U](images/leanpub_equation_85.png), ![S](images/leanpub_equation_86.png)and\
    \ ![V^T](images/leanpub_equation_87.png). Here is a quick example of how you can\
    \ implement SVD in Python:\n\n```\n1 import scipy.sparse as sp\n2 from scipy.sparse.linalg\
    \ import svds\n3 \n4 U, S, VT = svds(user_item_ratings, k = 20)\n5 S_diagonal\
    \ = np.diag(S)\n6 Y_hat = np.dot(np.dot(U, S_diagonal), VT)\n```\n\n### Recommending\
    \ music artists\n\nWhile most tutorials on “the Internets” focus on memory-based\
    \ approaches, they don’t seem to be used in practice. Although they produce good\
    \ results, they do not scale well and suffer from the [“cold-start”](https://en.wikipedia.org/wiki/Cold_start_\\\
    (computing\\)) problem.\n\nOn the other hand, applying **SVD** requires factorization\
    \ of the user-item matrix which can be expensive when the matrix is very sparse\
    \ (lots of user-item ratings are missing). Also, imputing missing values is often\
    \ used, since **SVD** doesn’t work when data is missing. This can significantly\
    \ increase the amount of data and runtime performance of the algorithm.\n\nMore\
    \ recent approaches have focused on predicting ratings by minimizing the regularized\
    \ squared error with respect to a latent user feature matrix $P$ and a latent\
    \ item feature matrix $Q$:\n\n![\\\\displaystyle \\\\min\\_{Q\\*, P\\*} \\\\sum\\\
    _{(u, i) \\\\in K}(r\\_{ui} - P\\_{u}^{T}Q\\_i)^2 + \\\\lambda(||Q\\_i||^2 + ||P\\\
    _u||^2)](images/leanpub_equation_88.png)\n\nWhere ![K](images/leanpub_equation_89.png)is\
    \ a set of ![(u, i)](images/leanpub_equation_90.png)pairs, ![r(u, i)](images/leanpub_equation_91.png)is\
    \ the rating for item ![i](images/leanpub_equation_92.png)by user ![u](images/leanpub_equation_93.png)and\
    \ ![\\\\lambda](images/leanpub_equation_94.png)is a regularization term (used\
    \ to avoid overfitting). The training of our model consists of minimizing the\
    \ regularized squared error. After an estimate of ![P](images/leanpub_equation_95.png)and\
