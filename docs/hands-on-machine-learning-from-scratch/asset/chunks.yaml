  trans: "\n逻辑回归用于因变量/目标变量为二分类时的分类问题。也就是说，它的值为真（true）或假（false）。`回归` 是实践中最流行和使用最广泛的算法之一（[参见此处](https://www.kaggle.com/surveys/2017)）。\n\
    \n可以使用逻辑回归解决的问题包括：\n\n*   **邮件** — 判断是否为垃圾邮件\n*   **在线交易** — 是否为欺诈\n*   **肿瘤分类**\
    \ — 恶性还是良性\n*   **客户升级** — 是否会购买高级升级\n\n我们想要预测变量 `y` 的结果，使得：\n\n![y \\\\in \\\\\
    {0, 1\\\\}](img/leanpub_equation_8.png)\n\n并将 `0` 设置为负类（例如：邮件不是垃圾邮件）或 `1` 设置为正类（例如：邮件是垃圾邮件）。\n\
    \n## 我们不能直接使用线性回归吗？\n\n![](img/1_linear-vs-logistic-regression.jpg)\n\n*图片来源：[machinelearningplus.com](https://machinelearningplus.com/)*\n\
    \n线性回归另一种非常流行的模型。它的工作假设是观测到的现象（你的数据）可以用直线来解释。\n\n线性回归的响应变量 `y` 在 \\[0, 1\\] 范围内是**不受限制**。这使得很难根据它的输出做出二分类决策。因此，不符合我们的需求。\n\
    \n## 逻辑回归模型\n\n针对我们的问题，我们想要一个使用 1 个变量（预测器）(![x\\_1](img/leanpub_equation_9.png)\\\
    -支出金额）的模型来预测我们是否应该给客户提供折扣。\n\n![h\\_w(x) = w\\_1x\\_1 + w\\_0](img/leanpub_equation_10.png)\n\
    \n其中系数 ![w\\_i](img/leanpub_equation_11.png) 是模型的参数。令系数向量 ![W](img/leanpub_equation_12.png)\
    \ 为：\n\n![W = \\\\begin{pmatrix} w\\_1 \\\\ w\\_0 \\\\ \\\\end{pmatrix}](img/leanpub_equation_13.png)\n\
    \n然后我们可以用更紧凑的形式表示 ![h\\_w(x)](img/leanpub_equation_14.png)：\n\n![h\\_w(x) = w^Tx](img/leanpub_equation_15.png)\n\
    \n这就是`线性回归` 模型。\n\n我们想要构建一个输出值为 0 到 1 之间的模型，因此我们想要得到一个满足以下条件的的假设：\n\n![0 \\\\\
    leq h\\_w(x) \\leq 1](img/leanpub_equation_16.png)\n\n对于`逻辑回归`，我们想要修改这一点并引入另一个函数\
    \ `g`：\n\n![h\\_w(x) = g(w^Tx)](img/leanpub_equation_17.png)\n\n我们将 `g` 定义为：\n\
    \n![g(z) = \\\\frac{1}{1 + e ^{-z}}](img/leanpub_equation_18.png)\n\n其中\n\n![z\
    \ \\in \\mathbb{R}](img/leanpub_equation_19.png)\n\n`g` 也称为 `sigmoid 函数`或 `logistic\
    \ 函数`。代入后，我们得到：\n\n![h\\_w(x) = \\\\frac{1}{1 + e^{-(w^Tx)}}](img/leanpub_equation_20.png)\n\
    \n作为我们的假设。\n\n### 深入观察 sigmoid 函数\n\n直观上，我们将使用 sigmoid 函数“覆盖在”线性回归模型上，将其限制在 \\\
    [0;1\\] 之间。记得 sigmoid 函数定义为：\n\n![g(z) = \\\\frac{1}{1 + e ^{-z}}](img/leanpub_equation_21.png)\n\
    \n让我们将其转换为 Python 函数：\n\n```python\ndef sigmoid(z):\n    return 1 / (1 + np.exp(-z))\n\
    ```\n\nsigmoid 函数的图形表示：\n\n![](img/1_sigmoid.png)\n\n看起来很眼熟，对吧？注意它收敛到 -1 或 +1\
    \ 有有多快。\n\n## 我们如何为模型寻找参数？\n\n让我们检查一些为模型寻找良好参数的方法。但在语境中，“好”意味着什么呢？\n\n### 损失函数\n\
    \n我们有一个可以用来决策的模型，但我们仍然需要找到参数 `W`。为了做到，我们需要一个目标来衡量一组参数有多好。为了这个目的，我们将使用一个`代价`函数：\n\
    \n![J(W) = \\\\frac{1}{m}\\\\sum_{i = 1}Cost(h\\_w^{(i)}, y^{(i)})](img/leanpub_equation_22.png)\n\
    \n![Cost(h\\_w(x), y) = \\\\begin{cases} -log(h\\_w(x)) &\\\\text{if} y = 1 \\\
    \\ -log(h\\_w(x)) &\\\\text{if} y = 0 \\\\end{cases}](img/leanpub_equation_23.png)\n\
    \n这也被称为`对数损失`或[`交叉熵损失`](https://mlcheatsheet.readthedocs.io/latest/loss_functions)。\n\
    \n![](img/1_cost.png)\n\n*图片来源：[mlcheatsheet](https://mlcheatsheet.readthedocs.io/)*\n\
    \n我们可以将上面的函数压缩成一个：\n\n![J(W) = \\\\frac{1}{m}(-y \\\\log{(h\\_w)} - (1 - y) \\\
    \\log{(h\\_w)})](img/leanpub_equation_24.png)\n\n其中\n\n![h\\_w(x) = g(w^Tx)](img/255.png)\n\
    \n让我们在 Python 中实现它：\n\n```python\ndef loss(h, y):\n    return (-y * np.log(h)\
    \ - (1 - y) * np.log(h)).mean()\n```\n\n### 方法 1 — 尝试一个数字\n\n让我们想想代表系数 `w_0, w_1,\
    \ w_2` 的三个数字](images/leanpub_equation_26.png)。\n\n```python\nX = df['amount_spent'].astype('float').values\n\
    y = df['discount'].astype('float').values\n\ndef predict(x, w):\n    return sigmoid(x\
    \ * w)\n\ndef print_result(y_hat, y):\n    print(f'loss: {np.round(loss(y_hat,\
    \ y), 5)} predicted: {y_hat} actual: {y}')\n\ny_hat = predict(X[0], .5)\n```\n\
    \n`loss: 25.0 predicted: 0.999999999986112 actual: 0.0`\n\n遗憾的是，我很懒，这个方法看起来太费力了。我们看下一个：\n\
    \n### 方法 2 — 尝试很多数字\n\n好了，现在的计算机运行很快。手机性能也可以！让我们利用这种力量，通过尝试很多数字来寻找那些讨厌的参数：\n\n\
    ```python\nfor w in np.arange(-1, 1, 0.1):\n    y_hat = predict(X[0], w)\n   \
    \ print(loss(y_hat, y))\n```\n\n```text\n0.0\n0.0\n0.0\n6.661338147750941e-16\n\
    9.359180097590508e-14\n1.3887890837434982e-11\n2.0611535832696244e-09\n3.059022736706331e-07\n\
    4.539889921682063e-05\n0.006715348489118056\n0.6931471805599397\n```\n"
