- raw: "```\n 1 class Node:\n 2 \n 3     def __init__(self, x, y, idxs, min_leaf=5):\n\
    \ 4         self.x = x\n 5         self.y = y\n 6         self.idxs = idxs\n 7\
    \         self.min_leaf = min_leaf\n 8         self.row_count = len(idxs)\n 9\
    \         self.col_count = x.shape[1]\n10         self.val = np.mean(y[idxs])\n\
    11         self.score = float('inf')\n12         self.find_varsplit()\n```\n\n\
    Trees are recursive data structures and we’re going to take full advantage of\
    \ that. Our Node class represents one decision point in our model. Each division\
    \ within the model has 2 possible outcomes for finding a solution — go to the\
    \ left or go to the right. That decision point also divides our data into two\
    \ sets.\n\nThe property idxs stores indexes of the subset of the data that this\
    \ Node is working with.\n\nThe decision (prediction) is based on the value that\
    \ Node holds. To make that prediction we’re just going to take the average of\
    \ the data of the dependent variable for this Node.\n\nThe method `find_varsplit`\
    \ finds where should we split the data. Let’s have a look at it:\n\n```\n1 def\
    \ find_varsplit(self):\n2     for c in range(self.col_count): self.find_better_split(c)\n\
    3     if self.is_leaf: return\n4     x = self.split_col\n5     lhs = np.nonzero(x\
    \ <= self.split)[0]\n6     rhs = np.nonzero(x > self.split)[0]\n7     self.lhs\
    \ = Node(self.x, self.y, self.idxs[lhs], self.min_leaf)\n8     self.rhs = Node(self.x,\
    \ self.y, self.idxs[rhs], self.min_leaf)\n```\n\nFirst, we try to find a better\
    \ feature to split on. If no such feature is found (we’re at a leaf node) we do\
    \ nothing. Then we use the split value found by find\\_better\\_split, create\
    \ the data for the left and right nodes and create each one using a subset of\
    \ the data.\n\nHere are the `split_col` and `is_leaf` implementations:\n\n```\n\
    1 @property\n2 def split_col(self): return self.x.values[self.idxs,self.var_idx]\n\
    3 \n4 @property\n5 def is_leaf(self): return self.score == float('inf')\n```\n\
    \nIt is time to implement the workhorse of our algorithm `find_better_split` method:\n\
    \n```\n 1 def find_better_split(self, var_idx):\n 2     x = self.x.values[self.idxs,\
    \ var_idx]\n 3 \n 4     for r in range(self.row_count):\n 5         lhs = x <=\
    \ x[r]\n 6         rhs = x > x[r]\n 7         if rhs.sum() < self.min_leaf or\
    \ lhs.sum() < self.min_leaf: continue\n 8 \n 9         curr_score = self.find_score(lhs,\
    \ rhs)\n10         if curr_score < self.score:\n11             self.var_idx =\
    \ var_idx\n12             self.score = curr_score\n13             self.split =\
    \ x[r]\n14 \n15 def find_score(self, lhs, rhs):\n16     y = self.y[self.idxs]\n\
    17     lhs_std = y[lhs].std()\n18     rhs_std = y[rhs].std()\n19     return lhs_std\
    \ * lhs.sum() + rhs_std * rhs.sum()\n```\n\nWe are trying to split on each data\
    \ point and let the best split wins.\n\nWe’re going to create our split such that\
    \ it has as low standard deviation as possible. We find the split that minimizes\
    \ the weighted averages of the standard deviations which is equivalent to minimizing\
    \ RMSE.\n\nIf we find a better split we store the following information: index\
    \ of the variable, split score and value of the split.\n\nThe score is a metric\
    \ that tells us how effective the split was (note that leaf nodes do not have\
    \ scores, so it will be infinity). The method find\\_score calculates a weighted\
    \ average of the data. If the score is lower than the previous we have a better\
    \ split. Note that the score is initially set to infinity -> only leaf nodes and\
    \ really shallow trees (and Thanos) have a score of infinity.\n\nFinally, let’s\
    \ look at how we use all this to make predictions:\n\n```\n1 def predict(self,\
    \ x):\n2     return np.array([self.predict_row(xi) for xi in x])\n3 \n4 def predict_row(self,\
    \ xi):\n5     if self.is_leaf: return self.val\n6     node = self.lhs if xi[self.var_idx]\
    \ <= self.split else self.rhs\n7     return node.predict_row(xi)\n```\n\nOnce\
    \ again, we’re exploiting the recursive nature of life. Starting at the tree root,\
    \ predict\\_row checks if we need to go left or right node based on the split\
    \ value we found. The recursion ends once we hit a leaf node. At that point, the\
    \ answer/prediction is stored in the val property.\n\nHere is the complete source\
    \ of our Node class:\n\n```\n 1 class Node:\n 2 \n 3     def __init__(self, x,\
    \ y, idxs, min_leaf=5):\n 4         self.x = x\n 5         self.y = y\n 6    \
    \     self.idxs = idxs\n 7         self.min_leaf = min_leaf\n 8         self.row_count\
