    ## Reinforcement Learning


    Reinforcement Learning (RL) is concerned with producing algorithms (agents) that
    try to achieve some predefined goal. The achievement of this objective is dependent
    on choosing a set of actions - receiving rewards for the good ones and punishment
    for the bad ones - the reinforcement bit comes from this. The agent act, in environments
    that have a state, gives rewards, and a set of actions.


    ![](images/ml-scratch-8----reinforcement-learning.png)


    Image credit: [https://phrasee.co/](https://phrasee.co/)*


    Deep Reinforcement Learning (using Deep Neural Networks for choosing actions)
    achieved some great things lately:


    *   [Play Atari games](https://www.cs.toronto.edu/~vmnih/docs/dqn.pdf)

    *   [Play Doom](https://www.youtube.com/watch?v=oo0TraGu6QY)

    *   [Dominate the game of Go](https://deepmind.com/blog/alphago-zero-learning-scratch/)


    ### Markov Decision Processes


    Markov Decision Process (MDP) is a mathematical formulation of the RL problem.
    MDPs satisfy the Markov property: the future depends only on the present.


    An MDP can be defined by `(S, A, R, P, gamma)` where:


    *   `S`: set of states

    *   `A`: set of actions

    *   `R`: reward

    *   `P`: probability distribution of the next state

    *   `gamma`: discount factor


    The discount factor `gamma` allows us that future is more valuable than now.


    ### Learning


    Here is how learning happens in RL:


    1.  The environment gives a state.

    2.  The agent chooses an action.

    3.  The environment gives a reward.

    4.  Continue until the goal is met.


    The objective is to find an optimal policy `pi*` that maximizes the cumulative
    reward. A policy `pi` is a function that maps state `s` to action `a`.


    ### Value function


    The value function gives you the expected return the agent will get starting from
    state `s` and following policy `pi`.


    ```

    V_pi(s) = E_pi[sum_{k=0}^{infinity} gamma^k R_{t+k} | S_t = s]

    ```


    There exists an optimal value function that has the highest value for all states.
    Defined as:


    ```

    V*(s) = max_pi V_pi(s) for all s in S

    ```


    ### Q-function


    Similarly, let’s define another function known as `Q`-function (state-action value)
    that gives the expected return starting from state `s`, taking action `a`, and
    following policy `pi`.


    ```

    Q_pi(s, a) = E_pi[sum_{k=0}^{infinity} gamma^k R_{t+k} | S_t = s, A_t = a]

    ```


    You can think of the `Q`-function as the quality of a certain action given a state.
    We can define the optimal `Q`-function as:


    ```

    Q*(s, a) = max_pi Q_pi(s, a) for all s in S

    ```


    There is a relationship between the two optimal functions `V*` and `Q*`. It is
    given by:


    ```

    V*(s) = max_a Q*(s, a) for all s in S

    ```

