    \ month, year\n* `user_taggedartists-timestamps.dat` - userID, artistID, tagID,\
    \ timestamp\n* `user_friends.dat` - userID, friendID. User/friend relationships.\n\
    \nWe’ll focus on `user_artists.dat` and `artists.dat` as they contain all data\
