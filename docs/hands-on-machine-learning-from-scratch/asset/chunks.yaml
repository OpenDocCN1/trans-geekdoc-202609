    \ __init__(self, center):\n4     self.center = center\n```\n\n给定一个路径，我们可以如下创建点：\n\
    \n```\n1 def get_points(path):\n2   img = Image.open(path)\n3   w, h = img.size\n\
    4   points = []\n5   for x in range(w):\n6     for y in range(h):\n7       points.append(img.getpixel((x,\
    \ y)))\n8   return points\n```\n\n发生了几件事：\n\n*   `load` 加载图像\n*   `resize` 透明度\n\
    *   `drop` 信息\n\n### 距离函数\n\n注意，虽然 `Euclidean` 距离很简单，但它可能不是最好的方法。这里是 Python 的实现：\n\
    \n```\n1 def euclidean(p, q):\n2   n_dim = len(p.coordinates)\n3   return sqrt(sum([\n\
    4       p.coordinates[i] - q.coordinates[i]) ** 2 for i in range(n_dim))\n5  \
