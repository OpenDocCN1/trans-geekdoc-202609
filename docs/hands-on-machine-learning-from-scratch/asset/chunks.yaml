    \ / artist_rank['totalUn\\\n8 iqueUsers']\n```\n\nAnd merge the results with the\
    \ previous data frame:\n\n```\n1 ap = ap.join(artist_rank, on=\"name\", how=\"\
    inner\") \\\n2   .sort_values(['playCount'], ascending=False)\n```\n\nHere is\
    \ a subset of the data:\n\n| name || userID || artistID || playCount |\n| ---\
    \ | --- | --- | --- |\n| Depeche Mode || 1642 || 72 | 352698 |\n| --- | --- |\
    \ --- | --- |\n| Thalía || 2071 || 792 || 324663 |\n| U2 || 1094 || 511 || 320725\
    \ |\n| Blur || 1905 || 203 || 257978 |\n| Paramore || 1664 || 498 || 227829 |\n\
    \n### Exploration\n\nLet’s look at how much each artist is played by users:\n\n\
    ![](images/ml-scratch-7----artist-played-count.png)\n\nand the names of the artists\
    \ that were played most:\n\n![](images/ml-scratch-7----plays-by-artist.png)\n\n\
    how much of the users play the artist:\n\n![](images/ml-scratch-7----users-by-artist.png)\n\
    \nhere’s another look at artist popularity:\n\n![](images/ml-scratch-7----artist-popularity.png)\n\
    \nNo surprises here, popular artists are taking the majority of the plays. Good\
    \ thing that “The Beatles” still hold strong, though :)\n\n## Recommender Systems\n\
    \nRecommender systems (RS) are used pretty much everywhere where you have an array\
    \ of items to choose from. They work by making suggestions that might help you\
    \ make better/faster choices.\n\nYou might think that you’re a special snowflake,\
    \ but RS exploit behavior patterns that are shared between users (you and other\
    \ people). For example, you and your friends might have similar tastes for some\
    \ stuff. RS try to find “friends” within other users and recommend things you\
    \ haven’t tried that.\n\nThe two most used types of RS are Content-Based and Collaborative\
    \ Filtering (CF). Collaborative filtering produces recommendations based on the\
    \ knowledge of users’ preference to items, that is it uses the “wisdom of the\
    \ crowd” to recommend items. In contrast, content-based recommender systems focus\
    \ on the properties of the items and give you recommendations based on the similarity\
    \ between them.\n\n### Collaborative Filtering (CF)\n\nCollaborative filtering\
    \ (CF) is the workhorse of recommender engines. What is good about the algorithm\
    \ is its property of being able to do feature learning, which allows it to start\
    \ to learn which features to use. CF can be divided into `Memory-Based Collaborative\
    \ Filtering` and `Model-Based Collaborative Filtering`.\n\n#### Memory-Based Collaborative\
    \ Filtering\n\nMemory-Based CF methods can be divided into two sections: user-item\
    \ filtering and item-item filtering. Here is the difference:\n\n* Item-Item Collaborative\
    \ Filtering: “Users who liked this item also liked …”\n* User-Item Collaborative\
    \ Filtering: “Users who are similar to you (kinda like the twin you never knew\
    \ you) also liked …”\n\nBoth methods require user-item matrix that contain the\
    \ ratings for user ![u](images/leanpub_equation_70.png)item ![i](images/leanpub_equation_71.png).\
    \ From that, you can calculate the similarity matrix.\n\nThe similarity values\
    \ in Item-Item Collaborative Filtering are calculated by taking into account all\
    \ users who have rated a pair of items.\n\nFor User-Item Collaborative Filtering,\
    \ the similarity values are calculated by observing all items that are rated by\
    \ a pair of users.\n\n#### Model-Based Collaborative Filtering\n\nModel-based\
    \ CF methods are based on [matrix factorization (MF)](https://en.wikipedia.org/wiki/Matrix_factorization_(recommender_systems)).\
    \ MF methods are used as an unsupervised method for latent variable decomposition\
    \ and dimensionality reduction. They can handle scalability and sparsity problems\
    \ better than Memory-based CF.\n\nThe goal of MF is to learn latent user preferences\
    \ and item attributes from known ratings. Then use those variable to predict unknown\
    \ ratings through the dot product of the latent features of users and items.\n\
    \nMatrix factorization restructures the user-item matrix into a low-rank matrix.\
    \ You can represent it by the multiplication of two low-rank matrices, where the\
    \ rows contain a vector of latent variables. You want this matrix to approximate\
    \ the original matrix, as closely as possible, by multiplying the low-rank matrices.\
    \ That way, you predict the missing entries in the original matrix.\n\n######\
    \ Singular Value Decomposition\n\nCollaborative Filtering can be formulated by\
