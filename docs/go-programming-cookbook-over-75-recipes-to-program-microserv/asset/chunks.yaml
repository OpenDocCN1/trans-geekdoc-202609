    \     books = append(books, Book{\n            Title: record[0],\n           \
    \ Author: record[1],\n            Pages: pages,\n        })\n    }\n    return\
    \ books, nil\n}\n```\n\n### Exporting Books to a CSV File\nConversely, to write\
    \ a slice of `Book` structs to a CSV file, the following function outlines a practical\
