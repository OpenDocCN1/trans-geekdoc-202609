- raw: "Recipe 5: Implementing Streaming Data with gRPC Situation Users of \"LibraGo\"\
    \ will always have access to the most recent data without having to refresh or\
    \ poll the server manually because of the system's ability to transmit updates\
    \ to clients in real-time.  The difficulty lies in developing a dependable streaming\
    \ system that can manage constant data transfers between the client and server.\
    \ Practical Solution gRPC supports four types of streaming: server streaming,\
    \ client streaming, bidirectional streaming, and no streaming (simple RPC).  For\
    \ \"LibraGo\", we will focus on server streaming to push book updates to clients,\
    \ and bidirectional streaming for a more interactive communication pattern. Server\
    \ Streaming RPC Server streaming RPCs allow the server to send multiple messages\
    \ to the client after receiving a client's request.  This is suitable for scenarios\
    \ like sending live updates to clients.  ●              Define the Server Streaming\
    \ Service in Protobuf: Update your    book.proto    file to define a server streaming\
    \ RPC method:  service BookService { rpc ListBookUpdates(BookUpdatesRequest) returns\
    \ (stream Book) {} }  ●              Implement the Server Streaming Method: On\
    \ the server, implement the    ListBookUpdates    method to stream book updates\
    \ to the client.  func (s \\*server) ListBookUpdates(req \\*pb.BookUpdatesRequest,\
    \ stream pb.BookService\\_ListBookUpdatesServer) error { // Example: stream updates\
    \ for a book for \\_, book := range books { // Assume books is a slice of Book\
    \ objects if err := stream.Send(&book); err != nil { return err } } return nil\
    \ } Bidirectional Streaming RPC Bidirectional streaming allows both the client\
    \ and server to send a stream of messages independently, enabling interactive\
    \ communication.  ●              Define the Bidirectional Streaming Service in\
    \ Protobuf:  service BookService { rpc Chat(stream ChatMessage) returns (stream\
    \ ChatMessage) {} }  ●              Implement the Bidirectional Streaming Method:\
    \ Implement a method where both the server and client can send messages back and\
    \ forth.  func (s \\*server) Chat(stream pb.BookService\\_ChatServer) error {\
    \ for { in, err := stream.Recv() if err == io.EOF { return nil } if err != nil\
    \ { return err } // Process incoming message and respond responseMessage := processMessage(in)\
    \ if err := stream.Send(responseMessage); err != nil { return err } } } With streaming\
    \ implemented in \"LibraGo\", the application can now offer live updates and interactive\
    \ features, significantly enhancing user engagement and the overall user experience.\
    \ \n\nRecipe 6: Ensuring gRPC Connection Security Situation Even though gRPC allows\
    \ for versatile and efficient communication between the \"LibraGo\" app's parts,\
    \ data transmitted over the network can be vulnerable to eavesdropping, manipulation,\
    \ or man-in-the-middle attacks if not secured properly.  Making sure gRPC connections\
    \ are secure without making the system slower or more complicated is the real\
    \ challenge.  Let’s see. Practical Solution TLS (Transport Layer Security) provides\
    \ an encrypted communication channel between clients and servers, which is crucial\
    \ for maintaining the confidentiality and integrity of the data being exchanged.\
    \  Implementing TLS in gRPC involves generating SSL certificates and modifying\
    \ both the client and server configurations to use these certificates. Generate\
    \ SSL Certificates Use OpenSSL or any other SSL tool to generate a self-signed\
    \ certificate for testing purposes.  For production, consider acquiring certificates\
    \ from a trusted CA (Certificate Authority). openssl genrsa -out server.key 2048\
    \ openssl req -new -x509 -sha256 -key server.key -out server.crt -days 3650 Configure\
    \ the gRPC Server for TLS Modify the server initialization code to load the SSL\
    \ certificates and start the server with TLS. import \"google.golang.org/grpc/credentials\"\
    \ func main() { lis, err := net.Listen(\"tcp\", \":50051\") if err != nil { log.Fatalf(\"\
    failed to listen: %v\", err) } creds, err := credentials.NewServerTLSFromFile(\"\
    server.crt\", \"server.key\") if err != nil { log.Fatalf(\"Failed to generate\
    \ credentials %v\", err) } s := grpc.NewServer(grpc.Creds(creds)) pb.RegisterBookServiceServer(s,\
    \ &server{}) //... } Configure the gRPC Client for TLS The client also needs to\
    \ be aware of the TLS configuration to securely connect to the server. creds,\
    \ err := credentials.NewClientTLSFromFile(\"server.crt\", \"\") if err != nil\
    \ { log.Fatalf(\"Failed to create TLS credentials %v\", err) } conn, err := grpc.Dial(\"\
    localhost:50051\", grpc.WithTransportCredentials(creds)) if err != nil { log.Fatalf(\"\
    did not connect: %v\", err) } defer conn.Close() //... TLS encrypts all gRPC communication\
    \ in \"LibraGo\" to protect user data and interactions.  Enhancing the entire\
    \ security posture of the \"LibraGo\" application and building trust with users\
    \ by protecting their data integrity and privacy is the goal of this strategy.\
    \ \n\nRecipe 7: Adding Logging to gRPC Services Situation With the addition of\
    \ gRPC services, \"LibraGo\" gets more complicated, and it's clear that thorough\
    \ logging is necessary.  Data regarding gRPC calls, including as requests, responses,\
    \ error messages, and execution times, as well as other relevant information,\
    \ must be captured by the application's logging solution.  The trick is to implement\
    \ the logging in a manner that gives you the information you need while causing\
    \ the application's performance as little disruption as possible. Practical Solution\
    \ For this purpose, we will introduce Zap, a high-performance logging tool designed\
    \ for Go applications.  Zap provides a perfect balance between speed and ease\
    \ of use, offering structured logging with a simple API and advanced features\
    \ like levelled logging and structured contexts. Install Zap Logger Begin by adding\
    \ Zap to your project dependencies: go get -u go.uber.org/zap Setting up Zap Logger\
    \ Initialize Zap in your application to start logging gRPC requests and responses.\
    \ import \"go.uber.org/zap\" var logger \\*zap.Logger func init() { // For production,\
    \ use zap.NewProduction() for a sensible default // configuration. Here, we're\
    \ using a development config for // rich, human-readable logs. logger, \\_ = zap.NewDevelopment()\
    \ } Integrating Logging with gRPC Interceptors Utilize gRPC interceptors to automatically\
    \ log details about each gRPC call.  Interceptors are special functions that gRPC\
    \ executes for every incoming or outgoing call, providing a convenient hook for\
    \ logging. import ( \"context\" \"google.golang.org/grpc\" \"google.golang.org/grpc/status\"\
    \ ) // UnaryServerInterceptor returns a new unary server interceptors that adds\
    \ zap log. func UnaryServerInterceptor(logger \\*zap.Logger) grpc.UnaryServerInterceptor\
    \ { return func( ctx context.Context, req interface{}, info \\*grpc.UnaryServerInfo,\
    \ handler grpc.UnaryHandler, ) (resp interface{}, err error) { // Log request\
    \ logger.Info(\"gRPC request\", zap.String(\"method\", info.FullMethod), zap.Any(\"\
    request\", req)) // Handle request resp, err = handler(ctx, req) // Log response\
    \ st, \\_ := status.FromError(err) logger.Info(\"gRPC response\", zap.String(\"\
    method\", info.FullMethod), zap.Any(\"response\", resp), zap.String(\"status\"\
    , st.Code().String())) return resp, err } } Applying the Interceptor to the gRPC\
    \ Server When initializing your gRPC server, add the interceptor to capture and\
    \ log all incoming requests. func main() { lis, err := net.Listen(\"tcp\", \"\
    :50051\") if err != nil { logger.Fatal(\"failed to listen\", zap.Error(err)) }\
    \ s := grpc.NewServer( grpc.UnaryInterceptor(UnaryServerInterceptor(logger)),\
    \ ) // Register services and start server } With Zap logger integrated into \"\
    LibraGo\" through gRPC interceptors, every aspect of the gRPC communication is\
    \ logged, providing valuable insights into the system's behavior. "
  fmt: "\n# Recipe 5: Implementing Streaming Data with gRPC\n\n## Situation\nUsers\
    \ of \"LibraGo\" will always have access to the most recent data without having\
    \ to refresh or poll the server manually because of the system's ability to transmit\
    \ updates to clients in real-time. The difficulty lies in developing a dependable\
    \ streaming system that can manage constant data transfers between the client\
    \ and server.\n\n## Practical Solution\ngRPC supports four types of streaming:\
    \ server streaming, client streaming, bidirectional streaming, and no streaming\
    \ (simple RPC). For \"LibraGo\", we will focus on server streaming to push updates\
    \ to clients, and bidirectional streaming for a more interactive communication.\n\
    \n### Server Streaming RPC\nServer streaming RPCs allow the server to send multiple\
    \ messages to the client after receiving a client's request. This is suitable\
    \ for scenarios like sending live updates to clients.\n\n- Define the Server Streaming\
    \ Service in `book.proto`:\n```proto\nservice BookService {\n  rpc ListUpdates(BookUpdatesRequest)\
    \ returns (stream Book) {}\n}\n```\n- Implement the Server Streaming Method: On\
    \ the server, implement `ListUpdates` method to stream updates to the client.\n\
    ```go\nfunc (s *server) ListUpdates(req *pb.BookUpdatesRequest, stream pb.BookService_ListUpdatesServer)\
    \ error {\n    // Example: stream updates for a slice of Book\n    for _, book\
    \ := range books {\n        if err := stream.Send(&book); err != nil {\n     \
    \       return err\n        }\n    }\n    return nil\n}\n```\n\n### Bidirectional\
    \ Streaming RPC\nBidirectional streaming allows both the client and server to\
    \ send a stream of messages independently, enabling interactive communication.\n\
    \n- Define the Bidirectional Streaming Service in Protobuf:\n```proto\nservice\
    \ BookService {\n  rpc Chat(stream ChatMessage) returns (stream ChatMessage) {}\n\
    }\n```\n- Implement the Bidirectional Streaming Method: Implement a method where\
    \ both the server and client can send messages back forth.\n```go\nfunc (s *server)\
    \ Chat(stream pb.BookService_ChatServer) error {\n    for {\n        in, err :=\
    \ stream.Recv()\n        if err == io.EOF {\n            return nil\n        }\n\
    \        if err != nil {\n            return err\n        }\n        // Process\
    \ incoming message and respond\n        responseMessage := processMessage(in)\n\
    \        if err := stream.Send(responseMessage); err != nil {\n            return\
    \ err\n        }\n    }\n}\n```\nWith streaming implemented in \"LibraGo\", the\
    \ application can now offer live updates and interactive features, significantly\
    \ enhancing user engagement.\n\n# Recipe 6: Ensuring gRPC Connection Security\n\
    \n## Situation\nEven though gRPC allows for versatile communication between the\
    \ \"LibraGo\" app's parts, data transmitted over the network can be vulnerable\
    \ to eavesdropping, manipulation, or man-in-the-middle attacks if secured properly.\
    \ Making gRPC connections secure without making the system slower or complicated\
    \ is the real challenge.\n\n## Practical Solution\nTLS (Transport Layer Security)\
    \ provides an encrypted communication channel between clients and servers, which\
    \ is crucial for maintaining the confidentiality and integrity of the data being\
    \ exchanged. Implementing TLS in gRPC involves generating certificates and modifying\
    \ both the client and server configurations to use these certificates.\n\n###\
    \ Generate SSL Certificates\nUse OpenSSL or any SSL tool to generate a self-signed\
    \ certificate for testing purposes. For production, consider acquiring certificates\
    \ from a trusted CA (Certificate Authority).\n```bash\nopenssl genrsa -out server.key\
    \ 2048\nopenssl req -new -x509 -key server.key -out server.crt -days 365\n```\n\
    \n### Configure gRPC Server for TLS\nModify the server initialization to load\
    \ the SSL certificates and start the server with TLS.\n```go\nimport \"google.golang.org/grpc/credentials\"\
    \n\nfunc main() {\n    lis, err := net.Listen(\"tcp\", \":50051\")\n    if err\
    \ != nil {\n        log.Fatalf(\"failed to listen: %v\", err)\n    }\n    creds,\
    \ err := credentials.NewServerFromFile(\"server.crt\", \"server.key\")\n    if\
    \ err != nil {\n        log.Fatalf(\"Failed to generate credentials: %v\", err)\n\
    \    }\n    s := grpc.NewServer(grpc.Creds(creds))\n    pb.RegisterBookServer(s,\
    \ &server{})\n}\n```\n\n### Configure gRPC Client for TLS\nThe client also needs\
    \ to be aware of the TLS configuration to securely connect to the server.\n```go\n\
    creds, err := credentials.NewClientTLSFromFile(\"server.crt\", \"\")\nif err !=\
    \ nil {\n    log.Fatalf(\"Failed to create TLS: %v\", err)\n}\nconn, err := grpc.Dial(\"\
    localhost:50051\", grpc.WithTransportCredentials(creds))\nif err != nil {\n  \
    \  log.Fatalf(\"did not connect: %v\", err)\n}\ndefer conn.Close()\n```\nTLS encrypts\
    \ all gRPC communication in \"LibraGo\" to protect user data and interactions.\
    \ Enhancing the entire security posture of the \"LibraGo\" application and building\
    \ trust with users by protecting their data integrity and privacy is the goal\
    \ of this strategy.\n\n# Recipe 7: Adding Logging to gRPC Services\n\n## Situation\n\
    With the addition of gRPC services, \"LibraGo\" gets more complicated, and it's\
    \ clear that thorough logging is necessary. Data regarding gRPC calls, including\
    \ requests, responses, error messages, and execution times, as well as other relevant\
    \ information, must be captured by the application's logging solution. The trick\
    \ is to implement the logging in a manner that gives you the information you need\
    \ while causing the application's performance as little disruption as possible.\n\
    \n## Practical Solution\nFor this purpose, we will introduce Zap, a high-performance\
    \ logging tool designed for Go applications. Zap provides a perfect balance between\
    \ speed and ease of use, offering structured logging with a simple API and advanced\
    \ features like levelled logging and structured contexts.\n\n### Install Zap Logger\n\
    Begin by adding Zap to your project dependencies:\n```bash\ngo get -u go.uber.org/zap\n\
    ```\n\n### Setting up Zap Logger\nInitialize Zap in your application to start\
    \ logging gRPC requests and responses.\n```go\nimport \"go.uber.org/zap\"\n\n\
    var logger *zap.Logger\nfunc init() {\n    // For production, use zap.NewProduction()\
    \ for a sensible default configuration\n    // Here, we're using a development\
    \ config for rich, human-readable logs.\n    logger, _ = zap.NewDevelopment()\n\
    }\n```\n\n### Integrating Logging with gRPC Interceptors\nUtilize gRPC interceptors\
    \ to automatically log details about each gRPC call. Interceptors are special\
    \ functions that gRPC executes for every incoming or outgoing call, providing\
    \ a convenient hook for logging.\n```go\nimport (\n    \"context\"\n    \"google.golang.org/grpc\"\
    \n    \"google.golang.org/grpc/status\"\n)\n\n// UnaryServerInterceptor returns\
    \ a new unary server interceptor that adds zap log.\nfunc UnaryServerInterceptor(logger\
    \ *zap.Logger) grpc.UnaryServerInterceptor {\n    return func(\n        ctx context.Context,\n\
    \        req interface{},\n        info *grpc.UnaryServerInfo,\n        handler\
    \ grpc.UnaryHandler,\n    ) (resp interface{}, err error) {\n        // Log request\n\
    \        logger.Info(\"gRPC request\", zap.String(\"method\", info.FullMethod),\
    \ zap.Any(\"request\", req))\n        // Handle request\n        resp, err = handler(ctx,\
    \ req)\n        // Log response\n        st, _ := status.FromError(err)\n    \
    \    logger.Info(\"gRPC response\", zap.String(\"method\", info.FullMethod), zap.Any(\"\
    response\", resp), zap.String(\"status\", st.Code().String()))\n        return\
    \ resp, err\n    }\n}\n```\n\n### Applying the Interceptor to the gRPC Server\n\
    When initializing your gRPC server, add the interceptor to capture and log all\
    \ incoming requests.\n```go\nfunc main() {\n    lis, err := net.Listen(\"tcp\"\
    , \":50051\")\n    if err != nil {\n        logger.Fatal(\"failed to listen\"\
    , zap.Error(err))\n    }\n    s := grpc.NewServer(\n        grpc.UnaryInterceptor(UnaryServerInterceptor(logger)),\n\
    \    )\n    // Register services and start server\n}\n```\nWith Zap logger integrated\
    \ into \"LibraGo\" through gRPC interceptors, every aspect of the gRPC communication\
    \ is logged, providing valuable insights into the system's behavior.\n"
  trans: "\n\n# 方案 5：使用 gRPC 实现流式数据\n\n## 场景\n由于系统具备实时向客户端传输更新的能力，“LibraGo”的用户无需手动刷新或轮询服务器，即可始终访问最新数据。其难点在于如何开发一个可靠的流式系统，能够管理客户端和服务器之间持续的数据传输。\n\
    \n## 实践解决方案\ngRPC 支持四种流式类型：服务端流、客户端流、双向流式和无流式（简单 RPC）。对于“LibraGo”，我们将重点关注通过服务端流向客户端推送更新，以及通过双向流式来实现更具交互性的通信。\n\
    \n### 服务端流 RPC (Server Streaming RPC)\n服务端流 RPC 允许服务器在接收到客户端请求后向客户端发送多个消息。这适用于向客户端发送实时更新等场景。\n\
    \n- 在 `book.proto` 中定义服务端流服务：\n```proto\nservice BookService {\n  rpc ListUpdates(BookUpdatesRequest)\
    \ returns (stream Book) {}\n}\n```\n- 实现服务端流方法：在服务器上实现 `ListUpdates` 方法以向客户端流式传输更新。\n\
    ```go\nfunc (s *server) ListUpdates(req *pb.BookUpdatesRequest, stream pb.BookService_ListUpdatesServer)\
    \ error {\n    // 示例：为切片 Book 流式传输更新\n    for _, book := range books {\n     \
    \   if err := stream.Send(&book); err != nil {\n            return err\n     \
    \   }\n    }\n    return nil\n}\n```\n\n### 双向流 RPC (Bidirectional Streaming RPC)\n\
    双向流允许客户端和服务器独立发送消息流，实现交互式通信。\n\n- 在 Protobuf 中定义双向流服务：\n```proto\nservice BookService\
    \ {\n  rpc Chat(stream ChatMessage) returns (stream ChatMessage) {}\n}\n```\n\
    - 实现双向流方法：实现一个服务器和客户端都能互相发送消息的方法。\n```go\nfunc (s *server) Chat(stream pb.BookService_ChatServer)\
    \ error {\n    for {\n        in, err := stream.Recv()\n        if err == io.EOF\
    \ {\n            return nil\n        }\n        if err != nil {\n            return\
    \ err\n        }\n        // 处理传入的消息并响应\n        responseMessage := processMessage(in)\n\
    \        if err := stream.Send(responseMessage); err != nil {\n            return\
    \ err\n        }\n    }\n}\n```\n在“LibraGo”中实现流式传输后，应用程序现在可以提供实时更新和交互功能，显著提升了用户参与度。\n\
    \n# 方案 6：确保 gRPC 连接安全\n\n## 场景\n尽管 gRPC 允许“LibraGo”应用部分之间进行灵活的通信，但如果不妥善保护，通过网络传输的数据可能会受到窃听、篡改或中间人攻击。在不降低系统速度或复杂性的情况下确保\
    \ gRPC 连接的安全是真正的挑战。\n\n## 实践解决方案\nTLS（传输层安全）在客户端和服务器之间提供了加密的通信通道，这对于维护交换数据的机性和完整性至关重要。在\
    \ gRPC 中实现 TLS 生成证书并修改客户端和服务器配置以使用这些证书。\n\n### 生成 SSL 证书\n使用 OpenSSL 或任何 SSL 工具生成测试目的自签名证书。对于生产环境，请考虑从信任的\
    \ CA（证书颁发机构）获取证书。\n```bash\nopenssl genrsa -out server.key 2048\nopenssl req -new\
    \ -x509 -key server.key -out server.crt -days 365\n```\n\n### 为 gRPC 服务器配置 TLS\n\
    修改服务器初始化以加载 SSL 证书并带 TLS 启动服务器。\n```go\nimport \"google.golang.org/grpc/credentials\"\
    \n\nfunc main() {\n    lis, err := net.Listen(\"tcp\", \":50051\")\n    if err\
    \ != nil {\n        log.Fatalf(\"failed to listen: %v\", err)\n    }\n    creds,\
    \ err := credentials.NewServerFromFile(\"server.crt\", \"server.key\")\n    if\
    \ err != nil {\n        log.Fatalf(\"Failed to generate credentials: %v\", err)\n\
    \    }\n    s := grpc.NewServer(grpc.Creds(creds))\n    pb.RegisterBookServer(s,\
    \ &server{})\n}\n```\n\n### 为 gRPC 客户端配置 TLS\n客户端也需要感知 TLS 以安全地连接到服务器。\n```go\n\
    creds, err := credentials.NewClientTLSFromFile(\"server.crt\", \"\")\nif err !=\
    \ nil {\n    log.Fatalf(\"Failed to create TLS: %v\", err)\n}\nconn, err := grpc.Dial(\"\
    localhost:50051\", grpc.WithTransportCredentials(creds))\nif err != nil {\n  \
    \  log.Fatalf(\"did not connect: %v\", err)\n}\ndefer conn.Close()\n```\nTLS 加密了“LibraGo”中所有的\
    \ gRPC 通信，以保护用户数据和交互。该策略的目标是增强“LibraGo”应用程序整体的安全态，并通过保护用户的数据完整性和隐私来建立用户信任。\n\n\
    # 方案 7：为 gRPC 服务添加日志\n\n## 场景\n随着 gRPC 服务的增加，“LibraGo”变得更加复杂，显然详尽的日志记录是必要的。关于\
    \ gRPC 调用的数据（包括请求、响应、错误消息和执行时间）以及其他相关信息必须由应用程序的日志解决方案捕获。关键在于如何实现日志记录，既能提供你所需的信息，又能尽可能地减少对应用程序性能的影响。\n\
    \n## 实践解决方案\n为此，我们将引入 Zap，这是一个专为 Go 应用设计的高性能日志工具。Zap 在速度和易用性之间提供了完美的平衡，提供了结构化日志功能。\n\
    \n### 安装 Logger\n首先将 Zap 添加到你的项目中：\n```bash\ngo get -u go.uber.org/zap\n```\n\n\
    ### 设置 Logger\n在应用程序中初始化 Zap 以开始记录 gRPC 请求和响应。\n```go\nimport \"go.uber.org/zap\"\
    \n\nvar logger *zap.Logger\nfunc init() {\n    // 生产环境使用 zap.NewProduction()\n\
    \    // 这里我们使用开发配置以获得易读日志\n    logger, _ = zap.NewDevelopment()\n}\n```\n\n###\
    \ 使用拦截器集成日志\n利用 gRPC 拦截器自动记录每次 gRPC 用的细节。拦截器是 gRPC 在每个传入或出的调用时执行的特殊函数，提供了方便的日志钩子。\n\
    ```go\nimport (\n    \"context\"\n    \"google.golang.org/grpc\"\n    \"google.golang.org/grpc/status\"\
    \n)\n\n// UnaryServerInterceptor 返回一个新的带有日志功能的单服务端拦截器\nfunc UnaryServerInterceptor(logger\
    \ *zap.Logger) grpc.UnaryServerInterceptor {\n    return func(\n        ctx context.Context,\n\
    \        req interface{},\n        info *grpc.UnaryServerInfo,\n        handler\
    \ grpc.UnaryHandler,\n    ) (resp interface{}, err error) {\n        // 记录请求\n\
    \        logger.Info(\"gRPC request\", zap.String(\"method\", info.FullMethod),\
    \ zap.Any(\"request\", req))\n        // 处理请求\n        resp, err = handler(ctx,\
    \ req)\n        // 记录响应\n        st, _ := status.FromError(err)\n        logger.Info(\"\
    gRPC response\", zap.String(\"method\", info.FullMethod), zap.Any(\"response\"\
    , resp), zap.String(\"status\", st.Code().String()))\n        return resp, err\n\
    \    }\n}\n```\n\n### 将拦截器应用到 gRPC 服务器\n在初始化 gRPC 服务器时，添加拦截器以捕获并记录所有请求。\n```go\n\
    func main() {\n    lis, err := net.Listen(\"tcp\", \":50051\")\n    if err !=\
    \ nil {\n        logger.Fatal(\"failed to listen\", zap.Error(err))\n    }\n \
    \   s := grpc.NewServer(\n        grpc.UnaryInterceptor(UnaryServerInterceptor(logger)),\n\
    \    )\n    // 注册服务并启动服务器\n}\n```\n通过 gRPC 拦截器将 Zap 集成到“LibraGo”中，gRPC 通信的各个方面都被记录下来，为系统行为提供了宝贵的见解。\n\
    \n"
