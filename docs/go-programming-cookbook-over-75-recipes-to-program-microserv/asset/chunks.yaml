  trans: "\n\n# 食谱 5：使用 TLS/SSL 进行安全通信\n\n## 场景\n我们的图书库应用正在通过 `WebSockets` 集成实时功能，因此，确保这些连接对于用户数据和隐私至关重要。同样，在我们部署的任何\
