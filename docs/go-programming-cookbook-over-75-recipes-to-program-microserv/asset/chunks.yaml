    \ \"log\" \"os\" ) func main() { config := &ssh.ClientConfig{ User: \"user\",\
    \ Auth: \\[\\]ssh.AuthMethod{ ssh.Password(\"password\"), }, HostKeyCallback:\
    \ ssh.InsecureIgnoreHostKey(), } conn, err := ssh.Dial(\"tcp\", \"example.com:22\"\
    , config) if err != nil { log.Fatal(err) } defer conn.Close() session, err :=\
    \ conn.NewSession() if err != nil { log.Fatal(err) } defer session.Close() session.Stdout\
