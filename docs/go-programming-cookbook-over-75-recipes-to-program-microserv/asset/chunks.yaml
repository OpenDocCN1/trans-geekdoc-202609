    \ '%s': %s\\n\", title, err)\n                continue\n            }\n      \
    \      books = append(books, Book{Title: title, Author: author, Pages: pages})\n\
    \        }\n    }\n    if err := scanner.Err(); err != nil {\n        return nil,\
    \ err\n    }\n    return books, nil\n}\n```\n\nThis function uses `bufio.Scanner`\
    \ to read the file line by line, applying the `bookDetailsPattern` regular expression\
    \ to each line. The `FindStringSubmatch` method extracts the title, author, and\
    \ page count from each matching line. These extracted values are then used to\
