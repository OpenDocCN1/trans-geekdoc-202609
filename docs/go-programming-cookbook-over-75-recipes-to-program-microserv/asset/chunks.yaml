    \ there might be empty directories left behind.  Given below is how to clean those\
    \ up: func CleanupEmptyDirectories(rootDir string) error { return filepath.Walk(rootDir,\
    \ func(path string, info os.FileInfo, err error) error { if err != nil { return\
    \ err } if info.IsDir() { entries, err := os.ReadDir(path) if err != nil { return\
    \ err } if len(entries) == 0 && path != rootDir { if err := os.Remove(path); err\
    \ != nil { return err } } } return nil }) } Incorporating these directory management\
