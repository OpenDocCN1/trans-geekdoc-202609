    \ {\n    file, err := os.Create(filename)\n    if err != nil {\n        return\
    \ err\n    }\n    defer file.Close()\n    writer := csv.NewWriter(file)\n    defer\
    \ writer.Flush()\n    for _, book := range books {\n        record := []string{book.Title,\
    \ book.Author, strconv.Itoa(book.Pages)}\n        if err := writer.Write(record);\
    \ err != nil {\n            // Handle error\n            return err\n        }\n\
