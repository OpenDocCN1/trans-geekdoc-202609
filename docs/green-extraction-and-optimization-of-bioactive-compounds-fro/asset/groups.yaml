    ## 2.15 验证实验

    为了确保实验有效，研究了优化结果的有效性。比较平均实验结果以评估模型的效率。在这种情况下，对不同响应进行了三次重复实验。


    ## 2.16 GC-MS 和 LC-MS 分析

    气相色谱质谱法 (GC-MS) 分析使用非极性 RTX95 柱和岛津 Q-2010 GC-MS 系统进行，以氦作为载气，压力恒定为 15 psi。识别并描述了优化提取物中的生物活性化合物。通过将四极管检测器的色谱峰结果与美国标准与技术研究院
    (2014) 库比较，确定了从 *S. swrv* 提取的化学化合物。从获得的质谱中识别了 62,509 个图谱。液相色谱质谱法 (LC-MS) 分析使用带有
    Chorus 的 1290 UHPLC 和 6500 Ion QTOF (Agilent Technologies, USA) 根据之前描述的协议 (Chowdhury
    等，2018) 进行。


    ## 2.17 统计分析

    所有调查均基于 RSM BCC 进行并重复三次。使用实验设计软件（版本 8.0.7.1, Stat-Ease, Inc.,227 Hennepin Ave,
    Suite 480, Minneapolis, MN 55413, USA）处理从提取过程中收集的所有实验数据。使用单因素方差分析 (ANOVA) 和 Duncan
    检验评估分析强度。所有收集的数据以平均值 $\pm$ 标准差表示。使用等高线和三维 (3D) 曲面图确定提取条件。使用 Microsoft Excel 2010
    配合 MATLAB v2013a 中的自适应神经模糊工具箱进行统计分析。


    ## 3 结果与结论


    ### 3.1 拟合模型

    使用 RSM BCC 成功优化了实验参数。该实验设计基于超声辅助提取参数的线性、交互和二次因子条件，以获得从 *S. swrv* 中产量生物活性化合物。表
    3 预测了 *S. swrv* 的实验 $DPPH\%$、$ABTS\%$ 和 $H_2O_2$ 清除活性。超声辅助溶剂提取表明，多酚化合物、总胡萝卜素含量和黄酮的预测值在65%
    介质、60 $cm^{-2}$ 超声强度、45 °C、15 分钟和 0.5 mm 粒径下达到优化值。发现优化条件下产量分别为 83.66 mg/mL、53.38
    mg/mL、77.52 $DPPH\%$、81.12 $ABTS\%$ 和 85.02 $H_2O_2\%$。结果与早期的研究工作一致，这些工作证明了从 *Garcinia
    indica* (Kanjappan 等，2020) 和 *Azolla mylla* (Selvaraj 等，2014) 中含有最多的生物活性化合物。通过检查多因素的影响并进行方差分析，实验数据拟合描述了


    ### 3.2 曲面研究

    表 3 给出了使用超声辅助溶剂提取获得总多酚化合物的实验值和结果。进行方差分析 (ANOVA) 以估计回归模型的显著性。从表 4 的数据和方程 (7) 可以清楚地看出甲醇浓度
    (X1) 和粒径 (X2) 是显著的，而超声强度 (X3) 和时间 (X4) 的影响不显著。此外，超声辅助提取总多酚模型的回归系数显示拟合欠缺 ($R =
    0.2704; R^2 = 0.01$)。总多酚超声辅助提取模型的模型通过以下方程给出：


    $Y_2 = 26.939 + 16.296X_1 + 6.91X_2 + 3.113X_3 + 17.4X_4 - 17.16X_5 - 5.84X_6
    - 5.00X_7 - 8.46X_8 - 2.693X_9 - 2.212X_{10} + 0.814X_{11} + 8.444X_{12} - 6.828X_{13}
    - 3.36X_{14} + 6.78X_{15} + 19.18X_{16} - 13.5X_{17} + 7.62X_{18} + 5.05X_{19}$


    图 (2a) 显示了 $X_1, X_2, X_3$ 和 $X_4$ 的残差，它们呈正态分布。图 (2b) 显示了预测值与实验值之间的差异。图 (2c) 显示了甲醇浓度
    (X1) 和超声强度 (X3) 的等高线图。图 (2d) 显示了总多酚的响应曲面，其在 $R^2 = 0.711$ 的情况下拟合良好。总黄酮的二次模型显示
    $0.008 \text{ unit}$。


    ### 3.3 抗氧化能力 (%DPPH%, %ABTS% 和 %H2O2%)

    根据表 3 的 RSM 设计统计分析和方程 (9)-(11)，甲醇浓度 (X1)、粒径 (X3)、交互项 X1X3 以及二次项 X1² 的线性项对三种抗氧化能力均有显著影响。


