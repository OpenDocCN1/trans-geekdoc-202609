    基于表3，共有 50 个实验结果，包括 8 次中心点重复、距离中心 ±2.37 的 10 个轴向点 (ai) 以及 32 个因子点。独立参数根据下方的公式
    (4) 进行编码：


    ```

    xi = \frac{Xi-Xl}{\Delta XI} = 1, 2, 3,...,K

    ```


    其中，$Xi$ 是独立参数的无量纲值，$X_1$ 是独立参数的真实值，$X_2$ 是中心点独立参数的真实值；$\Delta XI$ 是参数 $i$ 值的真实变化，代表参数
    $i$ 的无量纲值的单位。总实验次数通过下述公式 (5) 计算：


    ```

    N = 2^k (axial points) + 2k (axial points) + n0 (central points)

    ```


    其中 $N$ 是实验总数，$k$ 是自变量，$n_0$ 是中心点的重复次数，最终形成 50 次的实验设计。因变量与自变量之间的相关性通过将实验数据拟合二阶回归模型来确定。


    以下是使用响应分析重建的二阶多项式模型：


    ```

    $Y = a_0 + \sum_{i=1}^{k} a_iX_i + \sum_{i=1}^{k} a_{ii}X_i^2 + \sum_{i=1}^{k}\sum_{j=i+1}^{k}
    a_{ij}X_iX_j + \epsilon$

    ```


    上述方程 (6) 根据下面的参数值编码：


    ```

    $Y = a_0 + a_1X_1 + a_2X_2 + a_3X_3 + a_4X_4 + a_5X_5 + a_{11}X_1^2 + a_{22}X_2^2
    + a_{33}X_3^2 + a_{44}X_4^2 + a_{55}X_5^2 + a_{12}X_1X_2 + a_{13}X_1X_3 + a_{14}X_1X_4
    + a_{15}X_1X_5 + a_{23}X_2X_3 + a_{24}X_2X_4 + a_{25}X_2X_5 + a_{34}X_3X_4 + a_{35}X_3X_5
    + a_{45}X_4X_5$

    ```


    其中 $Y$ 是因变量，$a_0$ 是常数，$a_{ii}$ 是模型系数，$X_{ij}$ 是编码后的因变量，$\epsilon$ 是误差。随后进行了进一步分析以确定实验结果的准确性。


    ## 2.3. 使用 ANFIS 建模进行优化


    ANFIS（人工神经模糊推理系统）是 ANN（人工神经网络）的强大与 FIS（模糊推理系统）的高级人脑推理能力的结合（Tasadi and Pourirez,
    2010）。换句话说，ANFIS 可以通过将 FIS 集成到神经网络框架中对结果进行建模。由于其有效性和推理能力，ANFIS 建模在许多工程和科学领域都有应用（Yuan
    et al., 2014）。它在分析输入与输出变量之间的线性和非线性关系方面非常有效。此外，ANN 的反向传播是训练基于 ANN 的模糊推理系统的首选技术（Azadeh
    et al., 2020）。考虑到方法构建的输入参数（聚类算法）、学习时间以及粒径，ANFIS 的输出将通过遗传算法进行优化。


    - 规则 1：如果 X 处于 a1 和 a2 之间，则 f1 = p1x + q1y

    - 规则 2：如果 X 处于 a2 和 b2 之间，则 f2 = p2x + q2y


    使用试错法确定每个输入变量的特征数量。实验数据被分为网络模型的训练、测试和验证，以预测 *S. solymum* 中提取活性活性的植物化学成分。


    ## 2.4. 机器学习算法


    一种涉及自动学习的技术，即随机森林，可用于分类和回归任务。随机森林将对数据进行分类和预测（Park et al., 2022）。随机森林回归器将选择连续的目标值。它是一种集成学习技术，利用多种决策树来产生更准确的模型。每棵决策树都是使用训练数据特征的随机子集训练的。这种方法减少了过拟合，并通过组合创建更精确、更可靠的预测。随机森林回归器的主要优势是它能够处理输入与目标值之间存在非线性连接的高维数据。实验变量
    $X_1, X_2, X_3, X_4$ 和 $X_5$ 被用输入 $y_1, y_2$。


