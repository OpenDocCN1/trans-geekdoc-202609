    for all three analyses and have no deviation, as shown in Fig. 2(a), (b), and
    (c). In (d) and (e), the predicted values for all three analyses (%DPPH, %ABTSC,
    and %H2O2) showed higher R² values of 0.7677, 0.7774, and 0.7711, respectively.
    High values of the regression coefficient (R² > 0.7) indicate a good fit, Fig.
    2(f–j). The 2D and 3D surface response plots for four different antioxidant activities
    with material concentration (X) and particle size (Y) as the relevant variables.
    Figures show that the maximum antioxidant activities (%DPPH, %ABTSC and FRAP)
    correspond to the material composition and plant material size of 0.5 mg. The
    highest antioxidants were 75.22% for %DPPH; 84.12% for %ABTSC and 85.02% for %H2O2.


    # 3.4. ANFIS modeling


    Using the same 50 experimental data, ANFIS modeling was used to extract the parameters,
    and to define the effective extraction methods of bioactive compounds from S.
    ruber. The results were obtained using ANFIS techniques. All the data were randomly
    ordered, and were grouped into three sets as data for model training, testing,
    and validation. The results were analyzed in MATLAB V.2013 using fuzzy logic toolbox.
    The construction of an ANFIS model with membership functions, five inputs, and
    five outputs is used in the verification of many parameters, one to ensure accuracy.
    There are three fuzzy sets: low, medium, and high for each of the input variables,
    as methanol concentration (X1), ultrasonic intensity (X2), temperature (X3), and
    particle size (X4). According to the experimental data, the projected output for
    antioxidant activities (381 mg/g; TG (35 mg/g); %DPPH (75.2%); %ABTS (84.1%);
    %H2O2 (85%) were specified in five fuzzy sets, ‘very’, ‘high’, ‘medium’, ‘low’,
    and ‘very low’. There were 222 nodes and 45 rules in the fuzzy system order. The
    result data from experiments and observations of people used were used to enhance
    the fuzzy rules.


    # 3.6. Validation of the model


    The results were used to validate the optimized parameters for total phenols,
    flavonoids content, and antioxidant activities (scavenging of H2O2, DPPH, and
    radicals). Using Expert software, which could identify the most effective methods
    and their combinations, trials were carried out. The ANFIS and machine learning
    model was used for the identical data, which verified the optimized conditions.
    The outcomes of validated studies'
