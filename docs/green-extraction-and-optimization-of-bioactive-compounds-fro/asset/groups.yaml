    cancer is treated by various therapeutic strategies, chemotherapy, hormonal therapy,
    immunotherapy, and followed by radiation therapy (Yang et al., 2005). Though chemotherapics
    have potential solutions in reducing cancer symptoms and help to extend the lives
    of the patients, many of the chemotherapics have undesirable side effects (Brianis,
    2023). Use of natural, particularly bioactive compounds from plants enhance the
    area of drug discovery. Naturally, plant provide a wide range of secondary metabolites
    in the phenolic compounds in their tissues to protect themselves against various
    pathogens, pathogens, and diseases (Ganes et 2018). Recently, bioactive compounds
    from plants gained more attention due to their therapeutic potential (Chandrasekhar,
    2020).


    Several research works have shown excessive levels of reactive oxygen species
    (ROS), reactive nitrogen species (RNS) and DNA damage are responsible for various
    cellular functions (Veller et al., 2013; Kalimathu et al., 2021; Giringding et
    al., 2016). In reality, free radicals play a dual role with both benefit (at low
    concentrations) and toxic effects (at high concentrations)(Poprac et al., 2017).
    Plants with secondary metabolites may act as antioxidants to neutralize the level
    of free radicals generated in the human body (Rajkumar et al., 2022). The secondary
    metabolites of polyphenolic compounds are attractive because of their biological
    properties antioxidant activities and the suppression of reactive oxygen species.
    Antioxidants have been shown to inhibit oxidative stress and prevent the consumption
    of oxidant, sparing the target molecules that may be damaged. Particularly phytochemical
    compounds help to prevent, or inhibit various health complications including cancer
    (Tungmunthim et al., 2018). In fruits, vegetables, leaves, and grains, more than
    300 phytochemicals have been identified and quantified (Igbal et al., 2015). Capsaicin,
    flavonoids, kaempferol, quercetin, niacin, ellagic acid, curcumin, are some of
    the well-known bioactive compounds from plants.


    Solanum swertum, as Turkey berry, is a small plant found in many countries and
    around 5 leaves and branch (Goussaut et al., 2005; Saha and Dutta, 2017). The
    fruits and leaves are abundant in bioactive compounds and exhibit antioxidant,
    neuroprotective, anti-microbial, anti-inflammatory, antiseptic and anticancer
    activities (Saha et al., 2022). The plant also contains various compounds such
    as solanine, 3-β-D-glucopyranoside, 2-o-β-D-glucopyranosyl(1→2)-β-L-rhamnopyranosyloxy3-β-D-glucopyraninoside,
    6-o-β-D-glucopyranosyl(1→6)-β-L-rhamnopyranosyloxy)-3-β-D-glucopyraninoside, isquercetin,
    rutin, 6-o-β-D-glucopyranoside, 6-o-β-D-rhamnopyranosyl(1→6)-3-β-D-glucopyraninoside,
    isquercetin, kaempferol and quercetin (Ismail and Tuar, 2023). The extraction
    of bioactive compounds from plants is a very important source in the isolation
    of bioactive phytochemicals. In plant tissues these bioactive compounds are present
    in various locations and therefore the selection of an ideal extraction technique
    is essential for the recovery of these bioactive compounds from plant sources.
    Some extraction techniques such as conventional, blending, dection/distillation,
    stir bar probe ultrasonic extraction, pressurless ultrasound solvent extraction,
    microwave-assisted extraction, ultrasound-assisted carbon dioxide supercritical
    extraction, were formulated in laboratories and to study the properties of compounds
    (Choi and Verrier, 2001). Some of these extraction techniques require more amount
    of solvents, longer time, require high energy, and may damage the thermo-sensitive
    compounds, which are driven by research results. For effective extraction, the
    interaction between solvent and ultrasound waves (ultrasound assisted extraction
    (UAE)) has been used to enhance the yield of bioactive compounds from plants.
    The heat generated by the solvent system to enhance the solubility of bioactive
    compounds from plants. The heat could potentially destroy the thermosensitive
    compounds. This is the major disadvantage of UAE for thermosensitive compounds
    (Selvari et al., 2022). Another effective extraction technique compared is ultrasound-assisted
    solvent extraction (UAE) (Kuan et al., 2020). The positive aspects of UAE increase
    yield, shorten extraction time, requiring lower temperature and solvent consumption
    compared to other methods. By increasing mass transport, ultrasonic vibrations
    speed up the release of reactive bubbles in the solvent and create damage to plant
    cells through high pressure pressures generated during ultrasound cavitation (Alessandro
    et al., 2012). While Supercritical extraction is better among all the three, ultrasound-assisted-extraction
    technique is not suitable for thermosensitive compounds.


    The objective of the present study is the maximal extraction of bioactive compounds
    from S. swertum, while also considering the extraction parameters such as solvent
    concentration, particle size, temperature, pulse cycle, and mode/pH, etc., would
    significantly impact the yield of phytochemicals and their antioxidant potentials.
    To achieve the highest yield, a combination of these extraction parameters must
    be optimized. Response surface methodology (RSM), as an efficient statistical
    method, was used in this study to enhance the condition to increase the yield
    of bioactive compounds. Furthermore experimental design-based methodology has
    been employed to address the factors affecting aqueous-ultrasound solvent extraction
    (Yolmdeh et al., 2015). One of the statistical methods and techniques that is
    frequently used for the optimization of efficient extraction parameters is RSM
    (Aydar, 2018). RSM was used in the chemical, food, and pharmaceutical industry
    to enhance efficiency. The advantages of RSM are in the use of fewer experimental
    parameters to obtain more results (Sanjaka et al., 2019). The central composite
    design (CCD) and the Box-Behnken design (BBD) are the designs used frequently
    for the optimization of RSM to achieve the optimal conditions for bioactive compounds
    from plant sources (Xi et al., 2016). Additionally, ANFIS (artificial neural-fuzzy
    inference system) and machine learning approaches are implemented and used to
    investigate the interaction of the variables and the nonlinear effects compared
    with the RSM output (Sarayari et al., 2017). In order to assess the experimental
    data, the RSM and ANFIS prediction models were constructed and Machine learning
    is used to tailor the most effective extraction parameters (Fan et al., 2017).
