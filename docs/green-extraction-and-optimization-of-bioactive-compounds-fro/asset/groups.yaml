    # 利用超声辅助溶剂提取法通过 RFS 和机器学习算法对矮氏茄属（Solanum Swartz）中的生物活性化合物进行绿色提取与优化


    Priya Pethichuma a, Gorla Bhuchayagari Sumanth b, Selvaraj Kunjiappian a, Suthendran
    Kannan a, Suresh Babu Ram Panderian b, Krishnan Sundar a, c


    - + a 生物技术系，Kalsakalai Academy of Research and Education, 626126, Tamil Nadu,
    印度

    - b 计算机科学与工程系，Kalsakalai Academy of Research and Education, 626126, Tamil Nadu,
    印度

    - c 信息技术系，Kalsakalai Academy of Research and Education, 626126, Tamil Nadu, 印度


    ## 文章信息


    ## 摘要


    处理稿人：Vania Zuin


    - + + 关键词：

    - 矮氏茄（Solanum swartz*）

    - 响应面分析法

    - ANFIS

    - 机器学习

    - PCCD

    - 超声辅助溶剂提取


    通过超声辅助溶剂提取（UAE）方法从矮氏茄（Solanum swartz）中提取了具有生物学意义的酚类黄酮类类化合物及其自由基清除能力。采用响应面分析法中的自由基中心化中心设计（FCCD）来优化提取参数，并利用自适应模糊人工智能系统（ANFIS）以及机器学习算法模型来预测生物活性植物化学产物的产量。研究了提取参数——甲醇浓度（X₁:
    55-66% v/w）、超声强度（X₂: 50-60 cm²）、温度（X₃: 30-45 °C）、时间（X₄: 15-25 min）以及颗粒大小（X₅: 0.5-1.5
    mm）在每个水平（+2.3）对总酚（TP; y₁）、总黄酮类化合物（y₂）及其自由基清除能力（%DPPH% (y₃)、%ABTS% (y₄) 和 %ORAC%
    (y₅₅））优化产量的影响。最佳条件出现在 X₁: 65%、X₂: 40 cm²、X₄: 25 min 和 X₅: 1.5 mm，其中获得没食酸（GAE）最高含量
    5.38 mg/g (y₇)，y₈ = 75.22%，y₉ = 85.02%。大部分实验结果与 RSM 模型的预测吻合良好。此外，还利用 ANFIS 和随机森林机器学习算法对优化的提取参数进行了比较和验证。同时，使用
    GC-MS 和 LC-MS 研究了提取物中各种生物活性植物化学物质的存在。


    ## 1. 引言


    癌症是最可怕的疾病，能够显著降低个体的生活质量，是导致死亡的主要原因（Stucker and Basu, 2011）。根据调查和数据收集，国际癌症研究机构（IARC）报告显示，2019
    年有 1000 万死亡，2020 年有 1930 万死亡（Morgan et al., 2023）。预计 2040 年全球癌症病例数将达到 2840 万，比
    2020 年增长了 47%（Yan et al., 2023）。目前，癌症治疗通过多种治疗策略进行，包括化疗、激素疗法、免疫疗法，以及随后的放射治疗（Yang
    et al., 2005）。尽管化疗药物在减轻癌症症状和延长患者寿命方面具有潜力，但许多化疗药物具有不良的副作用（Brianis, 2023）。利用天然、尤其是植物中的生物活性化合物可以增强药物发现领域。自然地，植物在其组织中提供了广泛的酚类次生代谢物，以保护自身免受各种病原体和疾病的影响（Ganes
    et al. 2018）。最近，植物活性化合物因其治疗潜力而受到更多关注（Chandrasekhar, 2020）。


    多项研究表明，活性氧物（ROS）、活性氮物（RNS）水平过高以及 DNA 损伤会导致多种细胞功能异常（Veller et al., 2013; Kalimathu
    et al., 2021; Giringding et al. 2016）。事实上，自由基具有有益和损害的双重作用。


