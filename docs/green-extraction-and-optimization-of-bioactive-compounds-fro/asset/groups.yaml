    $ABTS\%$ and $H_2O_2$ scavenging activities of *S. swrv*. Extraction from ultrasound-assisted
    solvent extraction showed that the predicted values of polyphenolic compounds,
    total carotene content, flavonoid showed that the optimized values were achieved
    at 65% of medium, 60 $cm^{-2}$ ultrasound intensity, 45 °C, 15 minutes, and 0.5
    mm particle size. The optimization condition, the optimal yield of $Y_p$ and antioxidant
    activities were found to be 83.66 mg/mL, 53.38 mg/mL, 77.52 $DPPH\%$, 81.12 $ABTS\%$,
    85.02 $H_2O_2\%$, respectively. The results are consistent with earlier research
