    # Green extraction and optimization of bioactive compounds from Solanum Swartz.
    using ultrasound-aided solvent extraction method through RFS, and machine learning
    algorithm


    Priya Pethichuma a, Gorla Bhuchayagari Sumanth b, Selvaraj Kunjiappian a, Suthendran
    Kannan a, Suresh Babu Ram Panderian b, Krishnan Sundar a, c


    +   a Department of Biotechnology, Kalsakalai Academy of Research and Education,
    626126, Tamil Nadu, India

    b Department of Computer Science and Engineering, Kalsakalai Academy of Research
    and Education, 626126, Tamil Nadu, India

    c Department of Information Technology, Kalsakalai Academy of Research and Education,
    626126, Tamil Nadu, India


    # ARTICLE INFO


    # ABSTRACT


    Handling Order: Vania Zuin


    +   Keywords:

    Solanum swartz

    Response surface methodology

    ANFIS

    Machine learning

    PCCD

    Ultrasound-aided solvent extraction


    Biologically important compounds based on phenolic flavonoids and their free radical
    scavenging potential were harvested from Solanum swartz through ultrasound-aided
    solvent extraction (UAE) method. The free-centered central design (FCCD) in response
    surface methodology was applied to optimize the extraction parameters, and adaptive-fuzzy
    artificial intelligence system (ANFIS), as well as machine learning algorithm
    models were used to predict the yield of bioactive phytochemicals. The effect
    of extraction parameters, methanol concentration (X₁: 55-66% in v/w), ultrasound-intensity
    (X₂: 50-60 cm²), temperature (X₃: 30-45 °C), time (X₄: 15-25 min) and particle
    size (X₅: 0.5-1.5 mm) for each level (+2.3) were studied for optimized yields
    of total phenolic (TP; y₁), total flavonoid compounds (y₂), and their free radical
    scavenging abilities (%DPPH% (y₃), %ABTS% (y₄), and %ORAC% (y₅₅). The optimal
    condition was achieved at X₁: 65%, X₂: 40 cm², X₄: 25 min, and X₅: 1.5 mm, where
    the highest content of gallic acid (GAE) was 5.38 mg/g (y₇); y₈ = 75.22%, and
    y₉ = 85.02% was obtained. Most of the experimental results were well matched with
    the predictions of the RSM model. Further, ANFIS and random forest machine learning
    algorithm were utilised to compare and validate the optimized extraction parameters.
    Also, GC-MS and LC-MS were used to investigate the presence of various bioactive
    phytochemicals in the extract.


    # 1. Introduction


    Cancer is the most dreadful disease that can significantly reduce the quality
    of life of an individual, and is the leading cause of mortality (Stucker and Basu,
    2011). Based on survey and data collection, International Agency for Research
    and Cancer (IARC) reported 10 million deaths in 2019 and 19.3 million deaths in
    2020 (Morgan et al., 2023). The number of cancer worldwide is predicted to reach
    28.4 million in 2040, an is 47 percent increase from 2020 (Yan et al., 2023).
