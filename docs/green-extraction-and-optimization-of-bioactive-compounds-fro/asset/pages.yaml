    # 2.7. Determination of total polyphenols (TPF)


    Spectrophotometric analysis was used to determine the total polyphenol content
    using the Folin-Ciocalteu reagent (Medina, 2011). Briefly, 5 ml of 10 diluted
    Folin-Ciocalteu reagent was mixed with 0.2 ml of each extract, individually. 2
    ml of 7.5% sodium carbonate (Na$_2$CO$_3$) was added to the mixture for 5 minutes,
    and the mixture was then left in dark for an hour. After turn results were measured
    by measuring the absorbance at 765 nm using the spectrophotometer. The results
    were expressed as mg of gallic acid per gram of sample using gallic acid as the
    reference.


    # 2.8. Determination of total flavonoids (TF)


    One ml of each sample was mixed with 0.3 ml of 5% sodium methanol, and the mixture
    was incubated for 5 min under dark conditions. The reaction was stirred vigorously
    for 6 minutes at room temperature and then, 0.3 ml of 10% aluminum solution was
    used. A 3 ml of 1 M sodium hydroxide was added to the reaction and the incubation
    was carried for an additional 10 min. A UV-visible spectrophotometer was used
    to measure the absorbance at 510 nm. Rutin was used as a standard and the results
    were expressed as mg of rutin equivalent (da Silva et al., 2015).


    # 2.9..DPPH radical scavenging assay


    DPPH radical scavenging assay was performed as described earlier (Musa et al.,
    2016). Briefly, 3 ml of 0.1 ml DPPH in ethanol was mixed with 0.1 ml of each extract,
    and the mixture was incubated at 37 °C for 30 min. Methanol and DPPH were both
    used as controls. After incubation, the absorbance was measured at 517 nm. The
    formula (1) was used to estimate the radical scavenging activity:


    > $DPPH radical scavenging activity = $((A_0-A_1) \times 100)/A_0$


    Where $A_0$ - absorbance of the control and $A_1$ - absorbance of the sample.


    # 2.10..ABTS radical scavenging assay


    The ABTS radical scavenging was carried out according to the method reported (Canady-Rochelle
    et al., 2015). Briefly, 2.45 ml of potassium persulfate (K$_2$S$_2$) was mixed
    with 7 ml of ABTS solution and the resulting mixture was stored in the dark for
    16 h at room temperature. Then, ethanol was used to adjust the reaction mixture
    to an absorbance of 0.70 $\pm$ 0.05 at 734 nm. One ml of this reaction was mixed
    with 10 ml of S. tur extract, at different concentrations. The absorbance was
    measured against the blank at 734 nm. The inhibition activity was determined by
    the formula (2):


    > ABTS radical inhibition activity = $((A_0-A_1) \times 100)/A_0$


    Where $A_0$ - absorbance of the control and $A_1$ - absorbance of the sample.


    # 2.11..H$_2$O$_2$ radical scavenging assay


    Phosphate buffer solution (pH 7.4) of 50 mM hydrogen peroxide was prepared and
    0.6 ml of 50 mM peroxide solution was added to 0.1 ml of each extract. After 10
    min incubation, the absorbance of hydrogen peroxide was measured at 230 nm in
    a blank solution of phosphate buffer (Fernando and Soysa, 2015). The following
    equation (3) was used to determine each sample''s capacity


    > $H$_2$O$_2$ radical scavenging activity = $((A_0-A_1) \times 100)/A_0$


    Where $A_0$ - absorbance of the control, $A_1$ - absorbance of the sample.


