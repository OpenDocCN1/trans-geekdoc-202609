    # 2.6. Ultrasound-assisted solvent extraction of bioactive compounds


    An adjustable ultrasonic bath, as described, was performed using experiments with
    2 g of finely powdered sample of S. torvam Sw. in 20 ml of water at varied conditions
    and different conditions such as particle size of plant powder, temperature, time
    and ultrasound intensity. All the experiments were performed in triplicate according
    to face-centered composite design (CCD) of Response Surface Methodology (RSM).
    The extraction were concentrated at 40 °C using a rotary vacuum dryer (Buchi rotary
    evaporator, Mumbai, India) and filtered with No 1 paper. The extracts from preliminary
    experiments to identify the TP, TF, and antioxidant scavenging.'
