  md: '# 3.2. Investigation of the response surfaces


    # 3.2.1. Total polyhenols


    The experimental values and results for total polyphenolic compounds using ultrasound-aided
    solvent extraction at variations are presented in Table 3. Analysis of variance
    (ANOVA) was performed to estimate the significance of regression model using the
    observed experimental values. From data of Table 4 and Equation (7), it was clearly
    showed that for the highest yield of total polyphenols through ultrasound-aided
    solvent extraction (p = 0.0003) the effect of methanol concentration (X1), and
    particle size (X2) are significant while the effect of ultrasound intensity (X3)
    and time (X4) are not significant. Furthermore, the regression coefficient of
    model of ultrasound-aided solvent extraction of total polyphenols showed a lack
    of fit (R = 0.2704; R² = 0.0137, and AdR² = 0.008). The empirical model for the
    highest yield of total polyphenols with content extraction parameter is given
    in the following equation:


    ```

    TF(Y3) = 46.5 + 30.181X1 + 8.221X2 + 1.457X3 + 11.593X4 + 6.815X5 + 19.941X6 -
    51.22X7 - 6.74X3 + 0.8265X4 + 9.955X5 + 14.214X6 - 15.615X7 - 13.5X8 + 27.2X9
    + 11.852X10 + 72.538X11

    ```


    The data were further examined in order to determine a difference between experimental
    values and the value predicted by the model. Residuals were calculated and the
    distribution of residuals of X1, X2, X3 and X4 are shown in Fig. (2a) as a normal
    probability plot. There are no deviations from the normal distribution of detected
    residuals. Fig. (2b) shows the residuals versus predicted values, which indicates
    that the model is fit for the data. The effect of methanol concentration (X1)
    and ultrasound intensity (X3) on the extent of maximum content of total polyphenolic
    compounds were further illustrated by the 3D response surface and contour plot
    in Fig. (2c) and (2d), which show the effect of the three variables-(X3), time
    (X4) and particle size (X2) were well-held (constant) at 37°C, 20 min, and 3 mm,
    respectively. Table 3 shows that the total phenolic concentrations ranging from
    314.737 to 830.667 mg/G. At 65% methanol concentration, 60 cm v⁻² ultrasound intensity,
    45°C, 15 min, and 5 mm particle size, the highest yield of total polyphenolic
    was obtained.


    # 3.2.2. Total flavonoids


