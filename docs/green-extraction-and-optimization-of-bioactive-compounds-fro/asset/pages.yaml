    # 2. Experimental section


    # 2.1. Solanum tor Sw. Fruits


    The fruits of S. torvam Sw. were collected from shelves of the Western Ghats in
    near Shenbagathoppu Hills (at long- tudi: 7.6225; 9.5225); Srivilliputh, Virunagagar,
    Tamil Nadu, India. The surface of the fruits was washed with water and dried at
    shade for two weeks. The dried fruits were ground into fine powder using mesh
    grinder (Greenree Elects Ltd., Chennai, India). The powder was then screened to
    vary particle size powders (0.5, 0.75, 1.0, 1.5 mm) using several sieves (Mesh
    No. 35, 25, 18, 16, and 2). The samples were stored under air condi- tenter until
    the start of the experiment (moisture content: 10 ± 2%).


    # 2.2. Chemicals and reagents


    Solvent colorimetric reagents, ABTS, DPPH were supplied by Sigma Aldrich, Bengaluru,
    India. Methanol, Folin-Ciocalteu reagent, sodium carbonate, sodium hydride, aluminum
    chloride, hydrogen peroxide (H2O2) were purchased from HiMedia Pt. Ltd., Mumbai,
    India. All other chemicals and reagents were of analytical or equivalent grade
    and obtained from Merck and SRL, Ltd., India.


    # 2.3. Ultrasound-assisted solvent extraction


    Using an ultrasound-assisted solvent extraction (UAE), the bioactive phytochemicals
    were extracted from the fine powder of S. torvam Sw. The experimental apparatus
    had an ultrasonic water bath (temperature precision of ±1.0 °C, 220 V, and continu-
    us at 20 kHz intensity ultrasonic processor) including a jacketed reactor with
    25 ml capacity (capacity assessed by AC Pharma, India). The concentration of phytochemicals
    were measured using a Shimadzu UV-1800 series UV-Visible spectrophotometer using
    UV Probe 262 software from Japan.


    # 2.4. Preliminary experiments for identification of ideal solvent system


    The preliminary experiments were conducted to identify the ideal solvent system
    based on the concentration of TF, TP and DPPH* using S. torvam Sw. The solvents
    such as methanol, ethanol, ethyl acetate, diethyl ether, chloro- form, and n-hexane
    were used for the preliminary experiments. The extraction was carried out in each
    solvent system (20 ml of 70% v/w in water) with 2 g of powdered S. torvam Sw.
    with the extraction conditions of particle size: 0.5 mm, ultrasound intensity:
    60 W, and temperature: 65 °C.


    # 2.5. Selection of process parameters


    The five extraction parameters (ordered parameters) were selected as solvent concentration
    (55-66% v/w in water), ultrasound intensity (50-60 W cm⁻2), temperature (30-45
    °C), and time (1.5-25 min) were selected for the ma- yield of bioactive phytochemicals
    based on the dependent parameters, such as total phenols (TP), total flavonoids
    (TF), 2,2''-2,1''-diphenylhydrazyl (DPPH*), 2,2''-bis(3-sulfonopropyl)-6-ionic
    acid (ABTS), and hydrogen peroxide (H2O₂) measuring antioxidant ability of S.
    torvam Sw. Further in comparison the optimal solvent was chosen as the best solvent
    based on the results of preliminary experimental studies (Table 1). Five values
    (-2.37 (very low), -1 (low), 0 (medium), +1 (high), and +2.37 (very high)) were
    fixed for five extraction parameters as in Table 2.


