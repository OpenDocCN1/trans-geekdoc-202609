    X2² are significant (at α=0.05) for determining the maximum yield of total flavonoids
    and is presented in the second-order polynomial equation (8). The experimental
    model successfully fits the data, as evidenced by the response surface analysis
    of the total content of the flavonoids, which had a high regression coefficient
    of R² = 0.7119 and a lack of fit of 0.001. The second-order polynomial equation
    for the total content of flavonoids in coded variables is provided by the following
    equation (8):


