    # 3.7. GC-MS and LC-MS analysis


    A total of 25 peaks were found in the GC-MS chromatogram (Fig. 5) of the optimized
    extract of S. swarm. The phytocompounds were identified by comparing their retention,
    retention times, peak percentages and mass spectral fragmentation patterns to
    those of compounds listed in the National Institute of Standards and Technology
    (NIST). Among the 25 peaks, eleven of bioactive compounds (based on the active
    nucleus of the structure) were identified. The major phytochemical compounds were
    alpha-beta-sitosterol, campferol gallicoside, quercetin, kaempferol, rutin, vanillic,
    methyl alcohol, d-rhamnopyranoside, 3-ethylthio-1-propane, ethyl p-methoxycinnamate,
    (4-methylphenyl) acetate, vanillin, and cis-vaccic acid. The identified phytochemical
    compounds and their molecular formula, mass and structures are presented in Table
    6. The LC-MS chromatogram of optimized extract of S. swarm showed the presence
    of several compounds: quercetin (retention time not specified), rutin (retention
    time 23.6 min; molecular formula C27H30O16; 285.6 mg/g), neochlorogenic acid (retention
    time 25.1 min; molecular formula C16H18O9; 354.3 mg/g), chlorogenic acid (retention
    time 29.32 min; molecular formula C16H18O9; 354.3 mg/g), caffeic acid (retention
    time 34.08 min; molecular formula C9H8O4; 376.4 mg/g), quinic acid (


    7.321 min; molecular formula C8H12O7; 552.9 mg/g).


    # 4. Conclusions


    The objective of the research was successfully achieved in this study and effectively
    extracted the parameters for the highest yield of total polyphenols, total flavonoid
    compounds and their antioxidant potentials from S. swarm. Using methanol was identified
    as a suitable solvent for highest yield of phytochemical compounds. The statistical
    technique of RSM based on face-central composite design, coupled with ANFIS and
    machine learning were effective in identifying the optimal parameters. In the
    independent experiment, parameters like methanol concentration, ultrasound intensity,
    temperature, and particle size significantly influenced the yield of phytochemical
    compounds. The linear parameters, and their interactions as well as quadratic
    terms also predicted the highest yield of phytochemicals. The high R^2 value (0.97)
    showed the reliability of the result. The optimized condition was obtained at
    65% methanol, 600 mL of ultrasound intensity, temperature at 45 C for 15 min,
    and particle size of 0.5 mm, which resulted in the highest yield of flavonoids
    (g, 75.22% of DDPHC, 84.12% of ABTSC, and 85.02% of H2O2Osc). The optimized flavonoid
    values were well predicted with RSM, ANFIS and machine learning models. Furthermore,
    12 1 bioactive phytochemicals were identified from the optimized extract of S.
    swarm. Through GC-MS and LC-MS respectively, RSM combined with ANFIS and machine
    learning models can be applied for designing and effective extraction of bioactive
    phytochemicals from plant sources on an industrial scale.


