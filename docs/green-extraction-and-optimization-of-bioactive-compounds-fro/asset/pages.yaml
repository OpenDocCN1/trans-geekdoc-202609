    # 2.3. Optimization using ANFIS modeling


    ANFIS (artificial neural-fuzzy inference system) is a combination of the power
    of ANN (artificial neural networks) and the high-level human brain reasoning capability
    of FIS (fuzzy inference systems) (Tasadi and Pourirez, 2010). In other words,
    ANFIS can model results from integrating the FIS into the framework of neural
    network. ANFIS modeling has applications in many engineering and scientific fields
    as a result of its effectiveness and reasoning capabilities (Yuan et al., 2014).
    It is highly effective in analyzing relationships between input and output variables
    that are both linear and nonlinear. In addition the backpropagation of ANN is
    the first technique used to train the ANN-based fuzzy inference system (Azadeh
    et al., 2020). Considering the input parameters of method construction (clustering
    algorithm), (learning time) and particle size, the output of ANFIS will be optimized
    by genetic algorithm.


    +   Rule 1: If X is between a1 and a2, then f1 = p1x + q1y

    Rule 2: If X is between a2 and b2, then f2 = p2x + q2y


    Trial and error method was used to determine the number of features for each input
    variable. The experimental data was split into training, testing, and validation
    of the network model in order to forecast the extraction of the most bioactive
    phytochemicals from S. solymum.


    # 2.4. Machine learning algorithm


    A technique involving automated learning, known as Random Forest, can be used
    for both classification and regression tasks. Both the random forest will categorize
    the data and predict (Park et al., 2022). The random forest regressor will select
    the target''s values which are continuous. It is an ensemble learning technique
    that utilizes various decision trees to produce a more accurate model. Each decision
    tree is trained using a randomly subset of the features of the training data.
    This method reduces overfitting and combines to create a more precise and reliable
    prediction. The random forest regressor''s main advantage is that it has the capacity
    to handle high-dimensional data with a nonlinear connection between input and
    target values. Experimental variables X1, X2, X3, X4, and X5 are used as inputs
