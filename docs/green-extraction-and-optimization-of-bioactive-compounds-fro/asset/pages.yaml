    3. The independent parameters were coded based on the below equation (4):


    ```

    xi = \frac{Xi-Xl}{\Delta XI} = 1, 2, 3,...,K

    ```


    Where Xi, the dimensionless value of the independent parameter, X1, the real value
    of an independent parameter, X2, the real value of an independent parameter at
    the center point; and $\Delta XI$, the real change of the value of the parameter
    i representing to a unit for the dimensionless value of the parameter i. The total
    number of experiments was calculated from equation (5) that is given below:


    ```

    N = 2^k (axial points) + 2k (axial points) + n0 (central points)

    ```


    Where N is the total number of experiments, k is the independent variable, and
    n0 is replicate at the central points, which resulted in an experimental design
    of 50 runs. The correlation between dependent and independent variable was determined
    by fitting experimental data to a second order regression model.


    The following is the second-order polynomial model reconstructed using response
    analysis:


    ```

    $Y = a_0 + \sum_{i=1}^{k} a_iX_i + \sum_{i=1}^{k} a_{ii}X_i^2 + \sum_{i=1}^{k}\sum_{j=i+1}^{k}
    a_{ij}X_iX_j + \epsilon$

    ```


    The above equation (6) is coded based on the below value of parameters:


    ```

    $Y = a_0 + a_1X_1 + a_2X_2 + a_3X_3 + a_4X_4 + a_5X_5 + a_{11}X_1^2 + a_{22}X_2^2
