    \ the graph declaration and construction (and optimization) from outside of the\
    \ loop to inside the loop\n+     - Perform single instance training because it\
    \ is hard to batch\n\n```\n/* (a) static declaration */\n// all samples must share\
    \ one graph\ndeclare a static data flow graph \U0001D49F.\nfor t = 1 → T:\n  \
    \  read the tth data batch {xᵢᵗ}ᵢ₌₁ᴷ.\n    batched computation: \U0001D49F({xᵢᵗ}ᵢ₌₁ᴷ).\n\
    ```\n\n```\n/* (b) dynamic declaration */\nfor t = 1 → T:\n    read the tth data\
    \ batch {xᵢᵗ}ᵢ₌₁ᴷ.\n    for k = 1 → K:\n        declare a data flow graph \U0001D49F\
    ᵗᵢ for xᵢᵗ.\n        single instance computation: \U0001D49Fᵢᵗ(xᵢᵗ)\n```"
