  - '[PAGE 290]


    # Convergence Guarantee


    +   - Assumptions

    +     - Bridging model

    +       - Staleness Synchronous Parallel (SSP) with staleness parameter s

    +       - Bulk Synchronous Parallel is a special case of SSP when s = 0

    +     - Communication methods

    +       - Partial broadcast (PB): sending messages to a subset of Q (Q < P − 1)
    machines

    +       - Full broadcast is a special case of PB when Q = P − 1

    +     - Assumption 1. (1) For all j, f_j is continuously differentiable and F
    is bounded from below; (2) ∇F, ∇F_p are Lipschitz continuous with constants L_F
    and L_p, respectively, and let L = Σ_{p=1}^P L_p; (3) There exists G, σ² such
    that for all p and c, we have (almost surely) ||U_p(W_p^c, I_p^c)|| ≤ Gη and 𝔼||
    |S_p| Σ_{j∈I_p} ∇f_j(W) − ∇F_p(W) ||_2² ≤ σ².'
  - '[PAGE 291]


    # Convergence Guarantee


    # Results


    Theorem 1. Let Assumption 1 hold, and let {W_p^c}, p = 1, ..., P, {W^c} be the
    local sequences and the auxiliary sequence, respectively.


    Under full broadcasting (i.e., Q = P - 1) and set the learning rate η := η_c =
    O(√(1/(Lσ² P s_c))), we have


    +   - lim inf_{c→∞} E‖∇F(W^c)‖ = 0, hence there exists a subsequence of ∇F(W^c)
    that almost surely vanishes;

    +   - lim_{c→∞} max_p ‖W^c - W_p^c‖ = 0, i.e., the maximal disagreement between
    all local sequences and the auxiliary sequence converges to 0 (almost surely);

    +   - There exists a common subsequence of {W_p^c} and {W^c} that converges almost
    surely to a stationary point of F, with the rate min_{c≤C} E‖∑_{p=1}^P ∇F_p(W_p^c)‖₂²
    ≤ O(√(Lσ² P s / C))


    Under partial broadcasting (i.e., Q < P - 1) and set a constant learning rate
    η = 1/(C L G(P - Q)), where C is the total number of iterations. Then we have


    min_{c≤C} E[‖∑_{p=1}^P ∇F_p(W_p^c)‖₂²] ≤ O( L G(P - Q) + P(s G + σ²)/(C G(P -
    Q)) ).


    Hence, the algorithm converges to a O(L G(P - Q)) neighbourhood if C → ∞.'
  - '[PAGE 292]


    # Convergence Guarantee


    +   - Take-home message:

    +     - Under full broadcasting, given a properly-chosen learning rate, all local
    worker parameters $W_p^c$ eventually converge to stationary points (i.e. local
    minima) of the objective function, despite the fact that SV transmission can be
    delayed by up to $s$ iterations.

    +     - Under partial broadcasting, the algorithm converges to a $O(LG(P - Q))$
    neighbourhood if $C \to \infty$.'
