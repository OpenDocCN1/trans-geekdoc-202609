    \n- 目标：\n  $$\n  \\max_{\\theta,\\eta} \\mathcal{L}^{\\text{vae}}_{\\theta,\\\
    eta} = \\mathbb{E}_{p_{data}(x)} \\big[ \\mathbb{E}_{\\tilde{q}_\\eta(z|x)} [\\\
    log \\tilde{p}_\\theta(x|z)] - \\mathrm{KL}(\\tilde{q}_\\eta(z|x) \\parallel \\\
    tilde{p}(z)) \\big]\n  $$\n  - \\(\\tilde{p}(z)\\)：\\(z\\) 的先验\n  - \\(\\tilde{p}_\\\
    theta(x|z)\\)：生成模型\n  - \\(\\tilde{q}_\\eta(z|x)\\)：推断模型\n  - 仅使用来自 \\(p_{data}(x)\\\
    ) 的真实样本，缺少对抗机制\n- 为了与 GAN 对齐，我们引入真实/虚假指示变量 \\(y\\) 和对抗判别器\n\n## GAN 与 VAE 并排对比\n\
    \n|  | GAN（InfoGAN） | VAE |\n|---|---|---|\n| 生成分布 | \\(p_\\theta(x\\mid y)=\\\
    begin{cases}p_{g_\\theta}(x)&y=0\\\\p_{data}(x)&y=1.\\end{cases}\\) | \\(p_\\\
    theta(x\\mid z,y)=\\begin{cases}p_\\theta(x\\mid z)&y=0\\\\p_{data}(x)&y=1.\\\
    end{cases}\\) |\n| 判别器分布 | \\(q_\\phi(y\\mid x)\\) | \\(q_*(y\\mid x)\\)，完美、退化的\
    \ |\n| \\(z\\)-推断模型 | InfoGAN 的 \\(q_\\eta(z\\mid x,y)\\) | \\(q_\\eta(z\\mid\
    \ x,y)\\) |\n| 要最小化的 KLD | \\(\\min_\\theta \\mathrm{KL}\\left(p_\\theta(x\\mid\
    \ y)\\parallel q^r(x\\mid z,y)\\right)\\)<br>\\(\\sim \\min_\\theta \\mathrm{KL}(P_\\\
    theta\\parallel Q)\\) | \\(\\min_\\theta \\mathrm{KL}\\left(q_\\eta(z\\mid x,y)q_*(y\\\
    mid x)\\parallel p_\\theta(z,y\\mid x)\\right)\\)<br>\\(\\sim \\min_\\theta \\\
    mathrm{KL}(Q\\parallel P_\\theta)\\) |\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_159_0.png)\n\
    \n## VAE 与 Wake-sleep\n\n- Wake-sleep 算法\n  - Wake：\\(\\max_{\\theta} \\mathbb{E}_{q_{\\\
    lambda}(h|x)p_{data}(x)} [\\log p_{\\theta}(x|h)]\\)\n  - Sleep：\\(\\max_{\\lambda}\
    \ \\mathbb{E}_{p_{\\theta}(x|h)p(h)} [\\log q_{\\lambda}(h|x)]\\)\n- 令 \\(h\\\
    ) 为 \\(z\\)，\\(\\lambda\\) 为 \\(\\eta\\)\n  - \\(\\Rightarrow \\max_{\\theta}\
    \ \\mathbb{E}_{q_{\\eta}(z|x)p_{data}(x)} [\\log p_{\\theta}(x|z)]\\)，这恢复了 VAE\
    \ 目标中优化 \\(\\theta\\) 的部分\n- VAE 通过同时学习推断模型（\\(\\eta\\)）扩展了 wake 阶段\n  $$\n  \\\
    max_{\\theta,\\eta} \\mathcal{L}^{vae}_{\\theta,\\eta} = \\mathbb{E}_{q_{\\eta}(z|x)p_{data}(x)}\
    \ [\\log p_{\\theta}(x|z)] - \\mathbb{E}_{p_{data}(x)} [\\mathrm{KL}(q_{\\eta}(z|x)\\\
    parallel p(z))]\n  $$\n  - 相对于 \\(\\eta\\) 最小化原始变分自由能中的 KLD\n  - 坚持相对于 \\(\\theta\\\
    ) 和 \\(\\eta\\) 同时最小化 wake 阶段的 KLD\n  - 不涉及 sleep 阶段的目标\n  - 回忆：sleep 阶段最小化的是变分自由能中的*反向*\
    \ KLD\n\n## GAN 与 Wake-sleep\n\n- Wake-sleep 算法\n  - Wake：\\(\\max_\\theta \\\
    mathbb{E}_{q_\\lambda(h|x)p_{data}(x)} [\\log p_\\theta(x|h)]\\)\n  - Sleep：\\\
    (\\max_\\lambda \\mathbb{E}_{p_\\theta(x|h)p(h)} [\\log q_\\lambda(h|x)]\\)\n\
    - 令 \\(h\\) 为 \\(y\\)，\\(\\lambda\\) 为 \\(\\phi\\)\n  - \\(\\Rightarrow \\max_\\\
    phi \\mathbb{E}_{p_\\theta(x|y)p(y)} [\\log q_\\phi(y|x)]\\)，这恢复了 GAN 目标中优化 \\\
    (\\phi\\) 的部分\n- GAN 通过同时学习生成模型（\\(\\theta\\)）扩展了 sleep 阶段\n  - 直接扩展 sleep 阶段：\\\
    (\\max_\\phi \\mathcal{L}_\\phi = \\mathbb{E}_{p_\\theta(x|y)p(y)} [\\log q_\\\
    phi(y|x)]\\)\n  - GAN：\\(\\max_\\theta \\mathcal{L}_\\theta = \\mathbb{E}_{p_\\\
    theta(x|y)p(y)} [\\log q_\\phi^r(y|x)]\\)\n  - 唯一区别是用 \\(q_\\phi^r\\) 替换了 \\(q_\\\
    phi\\)\n  - 这正是对抗机制产生的地方！\n  - GAN 坚持最小化 sleep 阶段的 KLD\n  - 不涉及 wake 阶段的目标\n\n\
    ## 思想互鉴：增强损失函数\n\n|  | GAN（InfoGAN） | VAE |\n|---|---|---|\n| 要最小化的 KLD | \\(\\\
    min_{\\theta} \\mathrm{KL}\\left(p_{\\theta}(\\boldsymbol{x}|y) \\parallel q^{r}(\\\
    boldsymbol{x}|\\mathbf{z},y)\\right)\\)<br>\\(\\sim \\min_{\\theta}\\mathrm{KL}(P_{\\\
    theta} \\parallel Q)\\) | \\(\\min_{\\theta}\\mathrm{KL}\\left(q_{\\eta}(\\mathbf{z}|\\\
    boldsymbol{x},y)q_{*}^{r}(y|\\boldsymbol{x}) \\parallel p_{\\theta}(\\mathbf{z},y|\\\
    boldsymbol{x})\\right)\\)<br>\\(\\sim \\min_{\\theta}\\mathrm{KL}(Q \\parallel\
    \ P_{\\theta})\\) |\n\n- KLD 的不对称性启发了 GAN 与 VAE 的结合\n  - GAN：\\(\\min_{\\theta}\\\
    mathrm{KL}(P_{\\theta}\\parallel Q)\\) 倾向于缺失模式（mode missing）\n  - VAE：\\(\\min_{\\\
    theta}\\mathrm{KL}(Q\\parallel P_{\\theta})\\) 倾向于覆盖 \\(p_{data}\\) 取值较小的区域\n\n\
    ![](img/cb490ed30bca4eda5fbba81c52a2c173_164_0.png)\n\n模式覆盖\n模式缺失\n\n[图片致谢：PRML]\n\
    \n## AAVAE：自适应数据选择\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_168_0.png)\n\n\
    $$\n\\max_{\\theta,\\eta} \\mathcal{L}^{aavae}_{\\theta,\\eta} = \\mathbb{E}_{p_{\\\
    theta_0}(x)} \\left[ \\mathbb{E}_{q_\\eta(z|x,y) q_\\phi^r(y|x)} [\\log p_\\theta(x|z,y)]\
    \ - \\mathrm{KL}(q_\\eta(z|x,y) q_\\phi^r(y|x) \\parallel p(z|y) p(y)) \\right]\n\
    $$\n\n- 一种有效的数据选择机制：\n  - 生成的样本和真实样本都按 \\(q_\\phi^r(y=0|x) = q_\\phi(y=1|x)\\\
    ) 加权\n  - 只有那些看起来像真实数据并能欺骗判别器的样本才会被用于训练\n  - 一个真实样本获得较大的权重 \\(q_\\phi^r(y|x)\\\
    )\n    - \\(\\Rightarrow\\) 容易被判别器识别为真实\n    - \\(\\Rightarrow\\) 难以从生成器中模拟出来\n\
    \    - \\(\\Rightarrow\\) 困难样本获得更大的权重\n\n## 思想互鉴\n\n- AAVAE 用 GAN 的思想增强了 VAE\n\
    - 我们也可以用 VAE 的思想增强 GAN\n- VAE 最大化对数似然的变分下界\n- 重要性加权 VAE（IWAE）[Burda et al., 2016]\n\
    \  - 通过重要性采样最大化一个更紧的下界\n- GAN 的变分推断解释使得重要性加权方法可以直接应用于 GAN\n  - 只需将 IWAE 的推导过程逐行复制，稍作调整即可！\n\
    \n![](img/cb490ed30bca4eda5fbba81c52a2c173_177_0.png)\n\n## 回顾：变分推断\n\n最大化变分下界\
    \ \\(\\mathcal{L}(\\boldsymbol{\\theta}, \\boldsymbol{\\phi}; \\boldsymbol{x})\\\
    )，或者等价地，最小化自由能\n\n$$\nF(\\boldsymbol{\\theta}, \\boldsymbol{\\phi}; \\boldsymbol{x})\
    \ = -\\log p(\\boldsymbol{x}) + \\mathrm{KL}(q_{\\phi}(\\boldsymbol{z}|\\boldsymbol{x})\
    \ \\parallel p_{\\theta}(\\boldsymbol{z}|\\boldsymbol{x}))\n$$\n\n- E 步：固定 \\\
    (\\boldsymbol{\\theta}\\)，相对于 \\(\\phi\\) 最大化 \\(\\mathcal{L}\\)\n  $$\n  \\max_{\\\
    phi}\\mathcal{L}(\\boldsymbol{\\theta}, \\boldsymbol{\\phi}; \\boldsymbol{x})\
    \ = \\mathbb{E}_{q_{\\phi}(\\boldsymbol{z}|\\boldsymbol{x})}[\\log p_{\\theta}(x|\\\
    boldsymbol{z})] - \\mathrm{KL}(q_{\\phi}(\\boldsymbol{z}|x)\\parallel p(z))\n\
    \  $$\n  - 如果存在闭式解：\n    $$\n    q_{\\phi}^*(z|x) \\propto \\exp[\\log p_{\\theta}(x,z)]\n\
    \    $$\n- M 步：固定 \\(\\phi\\)，相对于 \\(\\boldsymbol{\\theta}\\) 最大化 \\(\\mathcal{L}\\\
    )\n  $$\n  \\max_{\\theta}\\mathcal{L}(\\boldsymbol{\\theta}, \\boldsymbol{\\\
    phi}; \\boldsymbol{x}) = \\mathbb{E}_{q_{\\phi}(\\boldsymbol{z}|\\boldsymbol{x})}[\\\
    log p_{\\theta}(x|\\boldsymbol{z})] - \\mathrm{KL}(q_{\\phi}(\\boldsymbol{z}|x)\\\
    parallel p(z))\n  $$\n\n"
