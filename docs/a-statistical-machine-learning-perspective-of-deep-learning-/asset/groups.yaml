    q_{\eta_0}(\boldsymbol{z}|\boldsymbol{x},y) q_{\phi_0}^r(y|\boldsymbol{x})] \big]|_{\boldsymbol{\theta}=\boldsymbol{\theta}_0}
    =$

    +       $\nabla_\theta\big[ \mathbb{E}_{p(y)} [\mathrm{KL}(p_\theta(\boldsymbol{x}|y)
    \| q^r(\boldsymbol{x}|\boldsymbol{z},y))] - \mathrm{JSD}(p_\theta(\boldsymbol{x}|y=0)
    \| p_\theta(\boldsymbol{x}|y=1)) \big]|_{\boldsymbol{\theta}=\boldsymbol{\theta}_0}$

    +   - Next we show correspondences between GANs/InfoGAN and VAEs


