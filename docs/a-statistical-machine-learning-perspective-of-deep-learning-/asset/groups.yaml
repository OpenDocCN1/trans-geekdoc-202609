    \ {x_i^t}_{i=1}^K.\n  batched computation: \U0001D49F({x_i^t}_{i=1}^K).\n```\n\
    \n在静态声明中：批处理是自然的\n\n```\n/* (b) dynamic declaration */\nfor t = 1 → T:\n  read\
