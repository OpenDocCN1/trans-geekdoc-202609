    反向模式微分\n\n- 人工神经网络不过是复杂的函数组合，可以用 **计算图** 表示：\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_21_0.png)\n\
    \n## 反向传播:  \n反向模式微分\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_22_0.png)\n\n\
