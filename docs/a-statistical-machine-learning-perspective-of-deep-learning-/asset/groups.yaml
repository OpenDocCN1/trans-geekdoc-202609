    \ |\n| VGG19 | 16 | 10MB | <1.2G | 10.8G |\n\n## Why Memory is an Issue?\n\n-\
    \ Intermediate states occupy 90% of the GPU memory\n- Intermediate states is proportional\
    \ to input batch size\n\n- However,\n  - If you want high throughput, you must\
    \ have large batch size (because of the SIMD nature of GPUs)\n  - If you have\
    \ large batch size, your GPU will be occupied by intermediate states, which thereby\
    \ limits your model size/depth\n\n## Saving Memory: A Simple Trick\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_320_0.png)\n\
    \n- Basic idea\n  - The fact: intermediate states are proportional to the batch\
    \ size K\n  - Idea: achieve large batch size by accumulating gradients generated\
    \ by smaller batch sizes which are affordable in the GPU memory\n- Solution:\n\
    \  - Partition K into M parts, every part has K/M samples\n  - For iter = 1:M\n\
    \    - Train with mini-batchsize K/M\n    - Accumulate the gradient on GPU w/o\
    \ updating model parameters\n  - Update the model parameter all together when\
    \ all M parts finished\n- Drawbacks\n  - What if the GPU still cannot afford the\
    \ intermediate states even if K=1?\n  - Small batch size usually leads to insufficient\
    \ use of GPUs’ computational capability\n\n## Memory Management using CPU Memory\n\
    \n- Core ideas\n  - If the memory is limited, trade something for memory\n   \
    \ - Trade extra computations for memory\n    - Trade other cost (e.g. memory exchange)\
    \ for more available memory\n  - If the memory is limited, then get more\n   \
