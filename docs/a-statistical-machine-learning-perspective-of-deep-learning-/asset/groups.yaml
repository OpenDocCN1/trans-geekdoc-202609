    # Dynamic Batching: Memory Management Challenge


    +   - Batched computational kernels on CPU/CPUs requires the inputs to a batched
    computation kernel locate continuously on memory

    +     - In Dynamic Declaration, this is usually not the case due to the dynamic-varying
    input structures.

    +     - To achieve memory continuity, one has to frequently re-arrange memory
    layouts (memcpy) of the inputs to each batched operation.

    +   - Cavs proposes a new data structure, DynamicTensor, to **ensure memory continuity**,
    at the same time **minimize memory movement overhead**'
