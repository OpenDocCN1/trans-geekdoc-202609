    min_{\\mathbf{y}} E(\\mathbf{y}, \\mathbf{x}; \\mathbf{w})$$\n+   \n+   - Unroll\
    \ the optimization algorithm for a fixed number of steps (Domke, 2012)\n+   \n\
    +     $$\\mathbf{y}^*(\\mathbf{x}; \\mathbf{w}) = \\text{opt-alg}_{\\mathbf{y}}\
    \ E(\\mathbf{y}, \\mathbf{x}; \\mathbf{w})$$\n+   \n+   - We can think of y* as\
    \ some non-linear differentiable function of the inputs and weights → impose some\
