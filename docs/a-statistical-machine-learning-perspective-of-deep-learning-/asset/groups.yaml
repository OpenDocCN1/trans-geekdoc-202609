  - '[PAGE 22]


    # Backpropagation:

    Reverse-mode differentiation


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_22_0.png)


    +   - Artificial neural networks are nothing more than complex functional compositions
    that can be represented by computation graphs:

    +   - By applying the chain rule and using reverse accumulation, we get

    +     $$\frac{\partial f_n}{\partial x} = \sum_{i_1 \in \pi(n)} \frac{\partial
    f_n}{\partial f_{i_1}} \frac{\partial f_{i_1}}{\partial x} = \sum_{i_1 \in \pi(n)}
    \frac{\partial f_n}{\partial f_{i_1}} \sum_{i_2 \in \pi(i_1)} \frac{\partial f_{i_1}}{\partial
    f_{i_2}} \frac{\partial f_{i_1}}{\partial x} = \dots$$

    +   - The algorithm is commonly known as backpropagation

    +   - What if some of the functions are stochastic?

    +   - Then use stochastic backpropagation!

    +     (to be covered in the next part)

    +   - Modern packages can do this automatically (more later)'
