  - '[PAGE 81]


    # Gaussian Process and Deep Kernel Learning


    +   - Consider a neural network with a Gaussian prior on its weights an infinitely
    many hidden neurons in the intermediate layer.

    +   - Certain classes of Gaussian priors for neural networks with infinitely many
    hidden units converge to Gaussian processes [Neal 1996]

    +   - Deep kernel [Wilson et al., 2016]

    +     - Combines the inductive biases of deep model architectures with the non-parametric
    flexibility of Gaussian processes

    +       $k(x_i, x_j | \phi) \rightarrow k(g(x_i, \theta), g(x_j, \theta) | \phi,
    \theta)$ where $K_{ij} = k(x_i, x_j)$

    +     - Starting from a base kernel $k(x_i, x_j | \phi)$, transform the inputs
    $x$ as

    +       $p(f | \phi) = \mathcal{N}(f | m(x), K)$

    +       $p(y | f) = \mathcal{N}(y | f, \beta^{-1})$

    +     - Learn both kernel and neural parameters $\{\phi, \theta\}$ jointly by
    optimizing marginal log-likelihood (or its variational lower-bound).

    +     - Fast learning and inference with local kernel interpolation, structured
    inducing points, and Monte Carlo approximations


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_81_0.png)'
  - '[PAGE 82]


    # Gaussian Process and Deep Kernel Learning


    +   - By adding GP as a layer to a deep neural net, we can think of it as adding
    an infinite hidden layer with a particular prior on the weights

    +   - Deep kernel learning [Wilson et al., 2016]

    +     - Combines the inductive biases of deep models with the non-parametric flexibility
    of Gaussian processes

    +     - GPs add powerful regularization to the network

    +     - Additionally, they provide predictive uncertainty estimates


