    \ | Many tricks | More or less standardized |\n| Experiments: | Massive, real\
    \ data (GT unknown) | Modest, often simulated data (GT known) |\n\n## Graphical\
    \ Models vs. Deep Nets\n- So far:\n  - Graphical models are representations of\
    \ probability distributions\n  - Neural networks are function approximators (with\
    \ no probabilistic meaning)\n- Some of the neural nets are in fact proper graphical\
    \ models (i.e., units/neurons represent random variables):\n  - Boltzmann machines\
    \ (Hinton & Sejnowsky, 1983)\n  - Restricted Boltzmann machines (Smolensky, 1986)\n\
