  - '[PAGE 138]


    # GANs: new formulation


    +   - Again, rewrite GAN objectives in the "variational-EM" format

    +   - Recap: conventional formulation:

    +     $$\max_{\phi} \mathcal{L}_{\phi} = \mathbb{E}_{\boldsymbol{x}=G_{\theta}(\boldsymbol{z}),\boldsymbol{z}\sim
    p(\boldsymbol{z}|y=0)}[\log(1 - D_{\phi}(\boldsymbol{x}))] + \mathbb{E}_{\boldsymbol{x}\sim
    p_{data}(\boldsymbol{x})}[\log D_{\phi}(\boldsymbol{x})]$$

    +     $$\max_{\theta} \mathcal{L}_{\theta} = \mathbb{E}_{\boldsymbol{x}=G_{\theta}(\boldsymbol{z}),\boldsymbol{z}\sim
    p(\boldsymbol{z}|y=0)}[\log D_{\phi}(\boldsymbol{x})] + \mathbb{E}_{\boldsymbol{x}\sim
    p_{data}(\boldsymbol{x})}[\log(1 - D_{\phi}(\boldsymbol{x}))]$$

    +     $$= \mathbb{E}_{\boldsymbol{x}=G_{\theta}(\boldsymbol{z}),\boldsymbol{z}\sim
    p(\boldsymbol{z}|y=0)}[\log D_{\phi}(\boldsymbol{x})]$$

    +   - Rewrite in the new form

    +     $$\max_{\phi} \mathcal{L}_{\phi} = \mathbb{E}_{p_{\theta}(\boldsymbol{x}|y)p(y)}[\log
    q_{\phi}(y|\boldsymbol{x})]$$

    +     $$\max_{\theta} \mathcal{L}_{\theta} = \mathbb{E}_{p_{\theta}(\boldsymbol{x}|y)p(y)}[\log
    q_{\phi}^{r}(y|\boldsymbol{x})]$$

    +   - Exact the same with ADA !

    +   - The same correspondence to variational EM !


