  - '[PAGE 194]


    # From Layers to Networks


    +   - A neural network is thus a few stacked layers $l = 1, ..., L$, where every
    layer represents a function transform $f_l$

    +   - The forward computation proceeds by sequentially executing $f_1, f_2, f_3,
    ..., f_L$


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_194_0.png)


    +   - Training the neural network involves deriving the gradient of its parameters
    with a backward pass (next slides)'
  - '[PAGE 195]


    # A Computational Layer in DL


    +   - Denote the backward pass through a layer $l$ as $b_l$

    +   - $b_l$ derives the gradients of the input $x$(d$x$), given the gradient of
    $z$ as d$z$, as well as the gradients of the parameters W, b

    +   - d$x$ will be the backward input of its previous layer $l-1$

    +   - Backward pass can be thought as a backward dataflow where the gradient flow
    through the layer


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_195_0.png)'
