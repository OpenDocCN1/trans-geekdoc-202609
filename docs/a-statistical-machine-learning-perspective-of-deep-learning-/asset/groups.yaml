  - '[PAGE 141]


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_141_0.png)


    # # GANs: minimizing KLD


    +   - As in Variational EM, we can further rewrite in the form of **minimizing
    KLD** to reveal more insights into the optimization problem


    +   - For each optimization step of $p_{\theta}(x|y)$ at point $(\theta=\theta_0,\phi=\phi_0)$,
    let

    +     - $p(y)$: a uniform distribution

    +     - $p_{\theta=\theta_0}(x)=\mathbb{E}_{p(y)}[p_{\theta=\theta_0}(x|y)]$:
    prior distribution over $x$

    +     - $q^r(x|y)\propto q^r_{\phi=\phi_0}(y|x)p_{\theta=\theta_0}(x)$: posterior
    distribution over $x$


    +   - **Lemma 1:** The updates of $\theta$ at $\theta_0$ have


    $$

    \left.\nabla_{\theta}\left[-\mathbb{E}_{p_{\theta}(x|y)p(y)}\left[\log q^r_{\phi=\phi_0}(y|x)\right]\right]\right|_{\theta=\theta_0}

    =

    \left.\nabla_{\theta}\left[\mathbb{E}_{p(y)}\left[KL\left(p_{\theta}(x|y)\|q^r(x|y)\right)-JSD\left(p_{\theta}(x|y=0)\|p_{\theta}(x|y=1)\right)\right]\right]\right|_{\theta=\theta_0}

    $$


    +   - KL: KL divergence

    +   - JSD: Jensen-Shannon divergence'
  - '[PAGE 142]


    # GANs: minimizing KLD


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_142_0.png)


    +   - *Lemma 1*: The updates of θ at θ₀ have

    +     ∇_θ[ - 𝔼_{p_θ(x|y)p(y)}[log q^r_{φ=φ₀}(y|x)] ]|_{θ=θ₀} =

    +     ∇_θ[ 𝔼_{p(y)}[KL(p_θ(x|y)||q^r(x|y))] - JSD(p_θ(x|y=0)||p_θ(x|y=1)) ]|_{θ=θ₀}

    +   - Connection to variational inference

    +     - See x as latent variables, y as visible

    +     - p_{θ=θ₀}(x): prior distribution

    +     - q^r(x|y) ∝ q^r_{φ=φ₀}(y|x)p_{θ=θ₀}(x) : posterior distribution

    +     - p_θ(x|y): variational distribution

    +       - Amortized inference: updates model parameter θ

    +   - Suggests relations to VAEs, as we will explore shortly'
  - "[PAGE 143]\n\n# GANs: minimizing KLD\n\n$p_{\\theta=\\theta_0}(\\mathbf{x}|y=1)=p_{data}(\\\
    mathbf{x})$  $p_{\\theta=\\theta_0}(\\mathbf{x}|y=0)=p_{g\\,\\theta=\\theta_0}(\\\
    mathbf{x})$  $q^r(\\mathbf{x}|y=0)$  $p_{\\theta=\\theta^{new}}(\\mathbf{x}|y=0)=p_{g\\\
    ,\\theta=\\theta^{new}}(\\mathbf{x})$\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_143_0.png)\n\
    \n+   - Minimizing the KLD drives $p_{g_\\theta}(\\mathbf{x})$ to $p_{data}(\\\
    mathbf{x})$  \n+     - By definition: $p_{\\theta=\\theta_0}(\\mathbf{x}) = E_{p(y)}[p_{\\\
    theta=\\theta_0}(\\mathbf{x}|y)] = (p_{g\\,\\theta=\\theta_0}(\\mathbf{x}) + p_{data}(\\\
    mathbf{x}))/2$  \n+     - KL$(p_\\theta(x|y=1)||q^r(x|y=1)) = KL(p_{data}(x)||q^r(x|y=1))$\
    \ : constant, no free parameters  \n+     - KL$(p_\\theta(x|y=0)||q^r(x|y=0))\
    \ = KL(p_{g_\\theta}(x)||q^r(x|y=0))$ : parameter $\\theta$ to optimize  \n+ \
    \      - $q^r(\\mathbf{x}|y=0) \\propto q^r_{\\phi=\\phi_0}(y=0|\\mathbf{x})p_{\\\
    theta=\\theta_0}(\\mathbf{x})$  \n+         - seen as a mixture of $p_{g\\,\\\
    theta=\\theta_0}(\\mathbf{x})$ and $p_{data}(\\mathbf{x})$  \n+         - mixing\
    \ weights induced from $q^r_{\\phi=\\phi_0}(y=0|\\mathbf{x})$  \n+     - Drives\
    \ $p_{g_\\theta}(\\mathbf{x}|y)$ to mixture of $p_{g\\,\\theta=\\theta_0}(\\mathbf{x})$\
    \ and $p_{data}(\\mathbf{x})$  \n+       - $\\Rightarrow$ Drives $p_{g_\\theta}(\\\
    mathbf{x})$ to $p_{data}(\\mathbf{x})$\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_143_1.png)"
  - '[PAGE 144]


    # GANs: minimizing KLD


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_144_0.png)


    p_{θ=θ₀}(x|y = 1) = p_{data}(x)


    p_{θ=θ₀}(x|y = 0) = p_{gθ=θ₀}(x)


    q^r(x|y = 0)


    missed mode


    p_{θ=θ^{new}}(x|y = 0) = p_{gθ=θ^{new}}(x)


    +   - Missing mode phenomena of GANs

    +     - Asymmetry of KLD

    +       - Concentrates $p_\theta(x|y = 0)$ to large modes of $q^r(x|y)$

    +         $\Rightarrow p_{g\theta}(x)$ misses modes of $p_{data}(x)$

    +     - Symmetry of JSD

    +     - Does not affect the behavior of mode missing


    KL($p_{g\theta}(x)||q^r(x|y = 0)$)

    = $\int p_{g\theta}(x) \log \frac{p_{g\theta}(x)}{q^r(x|y = 0)} dx$


    +   - Large positive contribution to the KLD in the regions of $x$ space where
    $q^r(x|y = 0)$ is small, unless $p_{g\theta}(x)$ is also small

    +   - $\Rightarrow p_{g\theta}(x)$ tends to avoid regions where $q^r(x|y = 0)$
    is small'
