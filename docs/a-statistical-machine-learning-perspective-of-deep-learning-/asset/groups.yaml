    \n![](img/cb490ed30bca4eda5fbba81c52a2c173_337_2.png)\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_337_3.png)\n\
    \n## Petuum 愿景\n\n数据\n\n任务\n\n模型\n\n算法\n\n实现\n\n系统\n\n平台\n和硬件\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_338_0.png)\n\
    \n- 全源（任意数据）\n- 全语言（任意编程语言）\n- 全挂载（任意硬件）\n\n- 网络交换机\n- Infiniband\n\n- 网络附加存储\n\
