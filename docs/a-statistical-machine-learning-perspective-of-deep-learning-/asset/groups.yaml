    \ 1992\n- Sigmoid belief nets are simply Bayesian networks over binary variables\
    \ with conditional probabilities represented by sigmoid functions:\n$$P(x_i|\\\
    pi(x_i)) = \\sigma\\left(x_i \\sum_{x_j \\in \\pi(x_i)} w_{ij}x_j\\right)$$\n\
    - Bayesian networks exhibit a phenomenon called “explain away effect”\n![](img/cb490ed30bca4eda5fbba81c52a2c173_39_1.png)\n\
