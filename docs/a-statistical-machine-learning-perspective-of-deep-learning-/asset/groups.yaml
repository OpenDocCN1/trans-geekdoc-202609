    \ $f_1, f_2, f_3, ..., f_L$\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_194_0.png)\n\
    \n- Training the neural network involves deriving the gradient of its parameters\
    \ with a backward pass (next slides)\n\n## A Computational Layer in DL\n\n- Denote\
    \ the backward pass through a layer $l$ as $b_l$\n- $b_l$ derives the gradients\
    \ of the input $x$(d$x$), given the gradient of $z$ as d$z$, as well as the gradients\
    \ of the parameters W, b\n- d$x$ will be the backward input of its previous layer\
    \ $l-1$\n- Backward pass can be thought as a backward dataflow where the gradient\
    \ flow through the layer\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_195_0.png)\n\
    \n![](img/cb490ed30bca4eda5fbba81c52a2c173_196_0.png)\n\n## Backpropagation through\
    \ a NN\n\n- The backward computation proceeds by sequentially executing  \n  \\\
    (b_L, b_{L-1}, b_{L-2}, \\ldots, b_1\\)\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_196_1.png)\n\
    \n## A Layer as a Dataflow Graph\n\n- Given the forward computation flow, gradients\
    \ can be computed by auto differentiation\n- Automatically derive the backward\
    \ gradient flow graph from the forward dataflow graph\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_197_0.png)\n\
    \nPhoto from TensorFlow website\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_197_1.png)\n\
    \n## A Network as a Dataflow Graph\n\n- Gradients can be computed by auto differentiation\n\
    - Automatically derive the gradient flow graph from the forward dataflow graph\n\
    \n![](img/cb490ed30bca4eda5fbba81c52a2c173_198_0.png)\n\nPhoto from TensorFlow\
    \ website\n\n## Gradient Descent via Backpropagation\n\n- The computational workflow\
    \ of deep learning\n  - Forward, which we usually also call inference: forward\
    \ dataflow\n  - Backward, which derives the gradients: backward gradient flow\n\
    \  - Apply/update gradients and repeat\n- Mathematically,\n\n```\n$\\theta^{(t)}\
    \ = \\theta^{(t-1)} + \\varepsilon \\cdot \\nabla_{\\mathcal{L}}(\\theta^{(t-1)},\
    \ D^{(t)})$\n```\n\nBackward\n\nModel parameters\n\nForward\n\nData\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_199_0.png)\n\
    \n## Auto-differential Libraries\n\n- Auto-diff libraries automatically derive\
    \ the gradients following the back-propagation rule.\n- A lot of auto-differentiation\
    \ libraries have been developed:\n- So-called Deep Learning toolkits\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_201_0.png)\n"
  mdcn: "\n\n## 讨论：潜变量与可见变量的建模\n\n- 潜变量和可见变量传统上被明确区分，并以非常不同的方式建模\n- 新公式中的一个关键思想：\n\
    \  - 不必在潜变量与可见变量之间划出明确界限\n  - 也不必区分推理和生成\n  - 而是将它们视为对称的一对\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_178_0.png)\n\
    \n![](img/cb490ed30bca4eda5fbba81c52a2c173_180_0.png)\n\n## 潜变量与可见变量的对称建模\n\n\
    - 有助于建模和理解：\n  - 将GAN中的生成空间x视为潜变量\n  - 揭示了GAN与ADA之间的联系\n  - 为生成提供了变分推断的解释\n- 唤醒睡眠算法\n\
    \  - 唤醒阶段基于潜变量重建可见变量\n  - 睡眠阶段基于可见变量重建潜变量\n  - 潜变量和可见变量以完全对称的方式处理\n\n唤醒： max_θ\
    \ E_{q_φ(z|x)} [log p_θ(x, z)]\n\n睡眠： max_φ E_{p_θ(z,x)} [log q_φ(z|x)]\n\n##\
    \ 潜变量与可见变量的对称建模\n\n新的建模方法缩小了差距\n\n## 可见变量上的经验分布\n\n- 不可能是显式分布\n  - 我们拥有的唯一信息是观察到的数据样本\n\
    \  - 不知道数据分布的真实参数形式\n- 天然是一种隐式分布\n  - 容易采样，难以评估似然\n\n## 潜变量上的先验分布\n\n- 传统上定义为显式分布，例如高斯先验分布\n\
    \  - 便于似然评估\n  - 我们可以根据先验知识假设参数形式\n- 允许隐式先验和模型的新工具\n  - GANs、密度比估计、近似贝叶斯计算\n \
    \ - 例如，对抗自编码器 [Makhzani et al., 2015] 用隐式先验替代了普通VAE的高斯先验\n\n## 潜变量与可见变量的对称建模\n\
    \n- 在公式表述上没有差异\n  - 使用隐式分布和黑盒神经网络模型\n  - 只需交换符号 $x$ 和 $z$\n\n$z \\sim p_{prior}(z)$\n\
    $x \\sim f_{black-box}(z)$\n\n$x \\sim p_{data}(x)$\n$z \\sim f'_{black-box}(x)$\n\
    \n![](img/cb490ed30bca4eda5fbba81c52a2c173_182_0.png)\n\n## 潜变量与可见变量的对称建模\n\n\
    - 在公式表述上没有差异\n  - 使用隐式分布和黑盒神经网络模型\n- 在空间复杂度上有差异\n  - 取决于具体问题\n  - 选择合适的工具：\n \
    \   - 隐式/显式分布、对抗/最大似然优化等\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_183_0.png)\n\
    \n## 生成空间中的损失\n\n- 生成逼真的句子/图像\n  - => **生成分布**与**真实数据分布**保持“接近”\n  - 用于文本的Control-gen：在*x*空间上的最大似然损失\n\
    \  - 用于图像的SGAN：在联合(*x*, *z*)和(*x*, *c*)空间上的对抗损失\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_185_0.png)\n\
    \n## 潜空间中的损失\n\n- 控制用户指定的属性\n  - => **推理分布**与**真实后验分布**保持接近\n    & **推理分布** $p_φ(c|x)$\
    \ 与**数据标签分布**保持接近\n  - 用于文本的Control-gen：在$z$和$c$空间上的最大似然损失\n  - 用于图像的SGAN：在联合$(x,z)$和$(x,c)$空间上的对抗损失\n\
    \  - 两者：在$c$空间上的最大似然损失\n\n### 文本生成\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_186_0.png)\n\
    \n### 图像生成\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_186_1.png)\n\n## 第二部分：结论\n\
    \nZ Hu, Z YANG, R Salakhutdinov, E Xing,\n“On Unifying Deep Generative Models”,\
    \ arxiv 1706.00550\n\n- 深度生成模型研究历史悠久\n  - 深度置信网络 / Helmholtz机 / 预测编码 / ...\n-\
    \ 深度生成模型的统一\n  - GAN和VAE本质上是在相反方向上最小化KLD\n    - 分别扩展了经典唤醒睡眠算法的两个阶段\n  - 一个通用的公式框架，适用于：\n\
    \    - 分析广泛类别的现有DGM及其变体：ADA/InfoGAN/联合模型/...\n    - 通过跨领域借鉴思想来启发新模型和新算法\n- 潜/可见变量的对称视角\n\
    \  - 在隐式先验分布和黑盒神经网络变换下，公式上没有差异\n  - 空间复杂度上的差异：选择合适的工具\n- 潜空间的结构化建模\n\n## 计划\n\n\
    - 深度学习的统计与算法基础和洞见\n- 深度生成模型的统一框架\n- 计算机制：分布式深度学习架构\n\n## 大纲\n\n- 深度学习作为数据流图\n\
    - 自动微分库\n- 静态和动态神经网络\n- DyNet\n- Cavs\n\n## 大纲\n\n- 深度学习作为数据流图\n- 自动微分库\n- 静态和动态神经网络\n\
    - DyNet\n- Cavs\n\n## 从层到网络\n\n- 神经网络因此是由多个堆叠的层 $l = 1, ..., L$ 组成，其中每一层表示一个函数变换\
    \ $f_l$\n- 前向计算通过依次执行 $f_1, f_2, f_3, ..., f_L$ 进行\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_194_0.png)\n\
    \n- 训练神经网络涉及通过反向传播（下一张幻灯片）计算其参数的梯度\n\n## 深度学习中的计算层\n\n- 将层 $l$ 的反向传播记为 $b_l$\n\
    - $b_l$ 根据 $z$ 的梯度 d$z$ 推导输入 $x$ 的梯度 d$x$，以及参数 W、b 的梯度\n- d$x$ 将作为其前一层 $l-1$ 的反向输入\n\
    - 反向传播可以看作是一种反向数据流，梯度流过该层\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_195_0.png)\n\
    \n![](img/cb490ed30bca4eda5fbba81c52a2c173_196_0.png)\n\n## 通过神经网络的反向传播\n\n- 反向计算通过依次执行\
    \ \\(b_L, b_{L-1}, b_{L-2}, \\ldots, b_1\\) 进行\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_196_1.png)\n\
    \n## 层作为数据流图\n\n- 给定前向计算流，可以通过自动微分计算梯度\n- 从正向数据流图自动推导反向梯度流图\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_197_0.png)\n\
    \n图片来源：TensorFlow网站\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_197_1.png)\n\n\
    ## 网络作为数据流图\n\n- 可以通过自动微分计算梯度\n- 从正向数据流图自动推导梯度流图\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_198_0.png)\n\
    \n图片来源：TensorFlow网站\n\n## 通过反向传播的梯度下降\n\n- 深度学习的计算工作流\n  - 前向，通常也称为推理：正向数据流\n\
    \  - 反向，推导梯度：反向梯度流\n  - 应用/更新梯度并重复\n- 数学上，\n\n```\n$\\theta^{(t)} = \\theta^{(t-1)}\
    \ + \\varepsilon \\cdot \\nabla_{\\mathcal{L}}(\\theta^{(t-1)}, D^{(t)})$\n```\n\
    \n反向\n\n模型参数\n\n前向\n\n数据\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_199_0.png)\n\
    \n## 自动微分库\n\n- 自动微分库根据反向传播规则自动推导梯度。\n- 已经开发了许多自动微分库：\n- 即所谓的深度学习工具包\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_201_0.png)\n\
    \n"
