    \  # scatter c, h to parent vertices\n    push(h)                     # push to\
    \ external connectors\n```\n\n## 表达反向传播\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_238_0.png)\n\
    \n- 它将一批数据流图的正向-反向计算转换为\n  - 正向：调度顶点函数 F 在一批输入图上的执行\n  - 反向：以相反顺序调度 ∂F 在同一批输入图上的执行\n\
    \n```\n/* (c) our proposed vertex-centric model */\ndeclare a symbolic vertex\
    \ function ℱ.\nfor t = 1 → T:\n  read the tth data batch {x_i^t}_{i=1}^K.\n  read\
    \ their associated graphs {\U0001D4A2_i^t}_{i=1}^K.\n  compute ℱ over {\U0001D4A2\
    _i^t}_{i=1}^K with inputs {x_i^t}_{i=1}^K.\n```\n\n## Cavs 绕过图构建开销\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_239_0.png)\n\
    \n- 无重复图构建开销！\n- 图构建开销是恒定的——我们只需要构建 F，而 F 通常是一个小规模的数据流图\n- 绕过重复的数据流图构建\n- 而是读取输入图\
    \ G，这可以通过 I/O 函数实现\n\n```\n/* (c) our proposed vertex-centric model */\ndeclare\
    \ a symbolic vertex function ℱ.\nfor t = 1 → T:\n  read the tth data batch {x_i^t}_{i=1}^K.\n\
    \  read their associated graphs {\U0001D4A2_i^t}_{i=1}^K.\n  compute ℱ over {\U0001D4A2\
    _i^t}_{i=1}^K with inputs {x_i^t}_{i=1}^K.\n```\n\n仅声明一次 → 恒定的图构建成本\n\n通过 I/O\
    \ 读取，不再涉及图构建。\n\n## 实验结果：图构建成本\n\n- Cavs 具有恒定的图构建时间\n- 曲线（左轴）：绝对时间；条形（右轴）：时间百分比\n\
    - Cavs 在很大程度上优于 TensorFlow-Fold\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_240_0.png)\n\
    \n## Cavs 启用批处理计算\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_241_0.png)\n\n-\
    \ 批处理计算是深度学习的关键\n- 回顾动态声明问题 #2\n- 动态图上的批处理计算很困难：\n  - 难以找到批处理机会\n    - 需要分析图\n\
    \    - 需要手动编写代码进行额外处理\n  - 即使有批处理机会，重排内存内容也很困难\n    - 为了使批处理计算高效，其输入/输出需要在内存上合并\n\
    \    - 如何高效地重新排列内存布局以保证连续性？\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_242_0.png)\n\
    \n- 在 Cavs 中，批处理计算是自然且自动的\n  - Cavs 将反向传播转换为 **在输入图批次的节点上评估 F**，见下图。\n- 然后，批处理计算可以通过以下方式实现\n\
    \  - 确定一组准备对其评估 F 的顶点\n  - 对这组顶点上的 F 评估进行批处理\n  - 将 F 的输出传递给它们的父顶点\n\n"
