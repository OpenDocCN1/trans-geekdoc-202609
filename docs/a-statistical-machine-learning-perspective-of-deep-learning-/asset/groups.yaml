    \nZ Hu, Z Yang, R Salakhutdinov, E Xing,\n“On Unifying Deep Generative Models”,\
    \ arxiv 1706.00550\n\n## 对抗域适应 (ADA)\n- 让我们从 ADA 开始\n  - 对抗方法在域适应上的应用\n  - 我们随后展示\
    \ GANs 可以被视为 ADA 的特例\n  - 元素对应关系：\n\n| 元素 | GANs | ADA |\n|---|---|---|\n| *x*\
    \ | 数据/生成 | 特征 |\n| *z* | 代码向量 | 源/目标域数据 |\n| *y* | 真/假指示器 | 源/目标域指示器 |\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_128_0.png)\n\
    \n## ADA：传统表述\n- 训练 $D_\\phi$ 以区分域\n\n$\\max_\\phi \\mathcal{L}_\\phi = \\mathbb{E}_{\\\
    boldsymbol{x}=G_\\theta(\\boldsymbol{z}),\\boldsymbol{z}\\sim p(\\boldsymbol{z}|y=1)}[\\\
    log D_\\phi(\\boldsymbol{x})] + \\mathbb{E}_{\\boldsymbol{x}=G_\\theta(\\boldsymbol{z}),\\\
    boldsymbol{z}\\sim p(\\boldsymbol{z}|y=0)}[\\log(1 - D_\\phi(\\boldsymbol{x}))]$\n\
    \n- 训练 $G_\\theta$ 以欺骗 $D_\\phi$\n\n$\\max_\\theta \\mathcal{L}_\\theta = \\mathbb{E}_{\\\
    boldsymbol{x}=G_\\theta(\\boldsymbol{z}),\\boldsymbol{z}\\sim p(\\boldsymbol{z}|y=1)}[\\\
    log(1 - D_\\phi(\\boldsymbol{x}))] + \\mathbb{E}_{\\boldsymbol{x}=G_\\theta(\\\
    boldsymbol{z}),\\boldsymbol{z}\\sim p(\\boldsymbol{z}|y=0)}[\\log D_\\phi(\\boldsymbol{x})]$\n\
    \n## ADA：新表述\n- 为了揭示与传统变分方法的联系，让我们以类似变分 EM 的格式重写目标\n- $\\boldsymbol{x}$ 上的隐式分布\
    \ $\\boldsymbol{x} \\sim p_\\theta(\\boldsymbol{x}|y)$\n  $\\boldsymbol{x} = G_\\\
    theta(\\boldsymbol{z}), \\ \\boldsymbol{z} \\sim p(\\boldsymbol{z}|y)$\n- 判别器分布\
    \ $q_\\phi(y|\\boldsymbol{x})$\n  $q_\\phi^r(y|\\boldsymbol{x}) = q_\\phi(1 -\
    \ y|\\boldsymbol{x})$\n- 以新形式重写目标（在常数尺度因子范围内）\n  $\\max_\\phi \\mathcal{L}_\\\
    phi = \\mathbb{E}_{p_\\theta(\\boldsymbol{x}|y)p(y)}[\\log q_\\phi(y|\\boldsymbol{x})]$\n\
    \  $\\max_\\theta \\mathcal{L}_\\theta = \\mathbb{E}_{p_\\theta(\\boldsymbol{x}|y)p(y)}[\\\
    log q_\\phi^r(y|\\boldsymbol{x})]$\n  - $\\boldsymbol{z}$ 被封装在隐式分布 $p_\\theta(\\\
    boldsymbol{x}|y)$ 中\n    $\\max_\\phi \\mathcal{L}_\\phi = \\mathbb{E}_{p_\\theta(\\\
    boldsymbol{x}|y=0)p(y=0)}[\\log q_\\phi(y=0|\\boldsymbol{x})] + \\mathbb{E}_{p_\\\
    theta(\\boldsymbol{x}|y=1)p(y=1)}[\\log q_\\phi(y=1|\\boldsymbol{x})]$\n    $=\
    \ \\frac{1}{2}\\mathbb{E}_{\\boldsymbol{x}=G_\\theta(\\boldsymbol{z}),\\boldsymbol{z}\\\
    sim p(\\boldsymbol{z}|y=0)}[\\log(1 - D_\\phi(\\boldsymbol{x}))] + \\frac{1}{2}\\\
    mathbb{E}_{\\boldsymbol{x}=G_\\theta(\\boldsymbol{z}),\\boldsymbol{z}\\sim p(\\\
    boldsymbol{z}|y=1)}[\\log D_\\phi(\\boldsymbol{x})]$\n  - （忽略常数尺度因子 1/2）\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_132_0.png)\n\
    \n## ADA：新表述\n- 新表述\n\n$$\\max_{\\phi}\\mathcal{L}_{\\phi}=\\mathbb{E}_{p_{\\\
    theta}(x\\mid y)p(y)}\\left[\\log q_{\\phi}(y\\mid x)\\right]$$\n\n$$\\max_{\\\
    theta}\\mathcal{L}_{\\theta}=\\mathbb{E}_{p_{\\theta}(x\\mid y)p(y)}\\left[\\\
    log q_{\\phi}^{r}(y\\mid x)\\right]$$\n\n- 优化 $\\theta$ 和 $\\phi$ 之间唯一的 **区别**：$q$\
    \ 与 $q^{r}$\n\n- 这就是 **对抗** 机制产生的所在\n\n## ADA 与变分 EM\n### 变分 EM\n- **目标**\n  -\
    \ $$\\max_{\\phi}\\mathcal{L}_{\\phi,\\theta}=\\mathbb{E}_{q_{\\phi}(z|x)}[\\\
    log p_{\\theta}(x|z)]+KL\\left(q_{\\phi}(z|x)\\|p(z)\\right)$$\n  - $$\\max_{\\\
    theta}\\mathcal{L}_{\\phi,\\theta}=\\mathbb{E}_{q_{\\phi}(z|x)}[\\log p_{\\theta}(x|z)]+KL\\\
    left(q_{\\phi}(z|x)\\|p(z)\\right)$$\n- θ 和 φ 共享单一目标\n- 通过 $p(z)$ 的额外先验正则化\n\n\
    ### ADA\n- **目标**\n  - $$\\max_{\\phi}\\mathcal{L}_{\\phi}=\\mathbb{E}_{p_{\\\
    theta}(x|y)p(y)}\\left[\\log q_{\\phi}(y|x)\\right]$$\n  - $$\\max_{\\theta}\\\
    mathcal{L}_{\\theta}=\\mathbb{E}_{p_{\\theta}(x|y)p(y)}\\left[\\log q_{\\phi}^{r}(y|x)\\\
    right]$$\n- 两个目标\n- 在博弈论视角下具有全局最优状态\n\n## ADA 与变分 EM\n### 变分 EM\n- 目标\n  max_φ\
    \ L_{φ,θ} = E_{q_φ(z|x)}[log p_θ(x|z)] + KL(q_φ(z|x)||p(z))\n  max_θ L_{φ,θ} =\
    \ E_{q_φ(z|x)}[log p_θ(x|z)] + KL(q_φ(z|x)||p(z))\n- θ 和 φ 共享单一目标\n- 通过 p(z) 的额外先验正则化\n\
    - 重构项：最大化 x 的条件对数似然，使用生成分布 p_θ(x|z)，条件于由 q_φ(z|x) 推断的潜代码 z\n- p_θ(x|z) 是生成模型\n\
    - q_φ(z|x) 是推理模型\n\n### ADA\n- 目标\n  max_φ L_φ = E_{p_θ(x|y)p(y)}[log q_φ(y|x)]\n\
    \  max_θ L_θ = E_{p_θ(x|y)p(y)}[log q_φ^r(y|x)]\n- 两个目标\n- 在博弈论视角下具有全局最优状态\n-\
    \ 目标：最大化 y（或 1 − y）的条件对数似然，使用分布 q_φ(y|x)，条件于由 p_θ(x|y) 推断的潜特征 x\n- 将 q_φ(y|x)\
    \ 解释为生成模型\n- 将 p_θ(x|y) 解释为推理模型\n\n## ADA：图形模型\n定义：\n- 实线箭头 ($x \\to y$)：\n  -\
    \ 生成过程\n- 虚线箭头 (y, z -> $x$)：\n  - 推理\n- 空心箭头 (z -> $x$)：\n  - 确定性变换\n  - 导致隐式分布\n\
    - 蓝色箭头 ($x \\to y$)：\n  - 对抗机制\n  - 涉及 $q_\\phi(y|\\boldsymbol{x})$ 和 $q_\\phi^r(y|\\\
    boldsymbol{x})$\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_135_0.png)\n\nmax$_\\\
    phi$ $\\mathcal{L}_\\phi$ = $\\mathbb{E}_{p_\\theta(\\boldsymbol{x}|y)p(y)}$ [$\\\
    log q_\\phi(y|\\boldsymbol{x})$]\nmax$_\\theta$ $\\mathcal{L}_\\theta$ = $\\mathbb{E}_{p_\\\
    theta(\\boldsymbol{x}|y)p(y)}$ [$\\log q_\\phi^r(y|\\boldsymbol{x})$]\n\n"
