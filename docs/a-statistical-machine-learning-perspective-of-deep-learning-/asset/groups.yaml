  mdcn: "\n## 生成对抗网络 (GANs)\n- [Goodfellow et al., 2014]\n- 生成模型 $x = G_\\theta(z),\\\
    \ z \\sim p(z)$\n  - 将噪声变量 $z$ 映射到数据空间 $x$\n  - 定义 $x$ 上的 *隐式分布*：$p_{g_\\theta}(x)$\n\
    \    - 一个模拟数据 $x$ 的随机过程\n    - 难以评估似然\n- 判别器 $D_\\phi(x)$\n  - 输出 $x$ 来自数据而非生成器的概率\n\
