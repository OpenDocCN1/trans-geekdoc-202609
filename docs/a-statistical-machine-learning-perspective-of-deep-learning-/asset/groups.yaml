    theta} = \\mathbb{E}_{\\boldsymbol{x}=G_{\\theta}(\\boldsymbol{z}),\\boldsymbol{z}\\\
    sim p(\\boldsymbol{z}|y=0)}[\\log D_{\\phi}(\\boldsymbol{x})] + \\mathbb{E}_{\\\
    boldsymbol{x}\\sim p_{data}(\\boldsymbol{x})}[\\log(1 - D_{\\phi}(\\boldsymbol{x}))]$$\n\
    \  $$= \\mathbb{E}_{\\boldsymbol{x}=G_{\\theta}(\\boldsymbol{z}),\\boldsymbol{z}\\\
    sim p(\\boldsymbol{z}|y=0)}[\\log D_{\\phi}(\\boldsymbol{x})]$$\n- Rewrite in\
    \ the new form\n  $$\\max_{\\phi} \\mathcal{L}_{\\phi} = \\mathbb{E}_{p_{\\theta}(\\\
    boldsymbol{x}|y)p(y)}[\\log q_{\\phi}(y|\\boldsymbol{x})]$$\n  $$\\max_{\\theta}\
    \ \\mathcal{L}_{\\theta} = \\mathbb{E}_{p_{\\theta}(\\boldsymbol{x}|y)p(y)}[\\\
    log q_{\\phi}^{r}(y|\\boldsymbol{x})]$$\n- Exactly the same with ADA !\n- The\
    \ same correspondence to variational EM !\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_138_0.png)\n\
    \n![](img/cb490ed30bca4eda5fbba81c52a2c173_141_0.png)\n\n## GANs: minimizing KLD\n\
    - As in Variational EM, we can further rewrite in the form of **minimizing KLD**\
