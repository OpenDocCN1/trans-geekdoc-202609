    - A vehicle for monitoring theoretical and empirical behavior and accuracy of\
    \ inference\n#### Utility of the loss function\n- A major measure of quality of\
    \ the learning algorithm and the model\n### Deep neural networks\n#### Utility\
    \ of the network\n- A vehicle to conceptually synthesize complex decision hypothesis\n\
    \  - stage-wise projection and aggregation\n- A vehicle for organizing computational\
