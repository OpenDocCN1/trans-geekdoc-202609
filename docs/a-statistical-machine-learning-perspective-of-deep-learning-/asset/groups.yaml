  - '[PAGE 116]


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_116_0.png)


    # Reparameterized gradient


    +   - Optimize \(\mathcal{L}(\boldsymbol{\theta}, \boldsymbol{\phi}; x)\) wrt.
    \(\boldsymbol{\phi}\) of \(q_{\boldsymbol{\phi}}(z\mid x)\)

    +     - Recap: gradient estimate with log-derivative trick:


    \[\nabla_{\boldsymbol{\phi}}\mathbb{E}_{q_{\boldsymbol{\phi}}}[\log p_{\boldsymbol{\theta}}(x,z)]
    = \mathbb{E}_{q_{\boldsymbol{\phi}}}[\log p_{\boldsymbol{\theta}}(x,z)\,\nabla_{\boldsymbol{\phi}}\log
    q_{\boldsymbol{\phi}}]\]


    +   - High variance: \(\nabla_{\boldsymbol{\phi}}\mathbb{E}_{q_{\boldsymbol{\phi}}}[\log
    p_{\boldsymbol{\theta}}] \approx \mathbb{E}_{z_i\sim q_{\boldsymbol{\phi}}}[\log
    p_{\boldsymbol{\theta}}(x,z_i)\,\nabla_{\boldsymbol{\phi}}q_{\boldsymbol{\phi}}(z_i\mid
    x)]\)

    +     - The scale factor \(\log p_{\boldsymbol{\theta}}(x,z_i)\) can have arbitrary
    large magnitude


    +   - gradient estimate with *reparameterization trick*


    \[z \sim q_{\boldsymbol{\phi}}(z\mid x) \quad\Longleftrightarrow\quad z=g_{\boldsymbol{\phi}}(\epsilon,x),
    \qquad \epsilon\sim p(\epsilon)\]


    \[\nabla_{\boldsymbol{\phi}}\mathbb{E}_{q_{\boldsymbol{\phi}}(z\mid x)}[\log p_{\boldsymbol{\theta}}(x,z)]
    = \mathbb{E}_{\epsilon\sim p(\epsilon)}\left[\nabla_{\boldsymbol{\phi}}\log p_{\boldsymbol{\theta}}\left(x,z_{\boldsymbol{\phi}}(\epsilon)\right)\right]\]


    +   - (Empirically) lower variance of the gradient estimate

    +   - E.g., \(z\sim\mathcal{N}(\boldsymbol{\mu}(x),L(x)L(x)^T)\quad\Longleftrightarrow\quad\epsilon\sim\mathcal{N}(0,1),\;z=\boldsymbol{\mu}(x)+L(x)\epsilon\)'
  md: "\n## Resurgence of deep generative models\n\n- Variational autoencoders (VAEs)\
    \ [Kingma & Welling, 2014] / Neural Variational Inference and Learning (NVIL)\
    \ [Mnih & Gregor, 2014]\n- Generative adversarial networks (GANs) [Goodfellow\
    \ et al., 2014]\n- Generative moment matching networks (GMMNs) [Li et al., 2015;\
    \ Dziugaite et al., 2015]\n- Autoregressive neural networks\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_102_0.png)\n\
    \n![](img/cb490ed30bca4eda5fbba81c52a2c173_102_1.png)\n\n## Outline\n\n- Overview\
    \ of advances in deep generative models\n- Theoretical Basis of deep generative\
    \ models\n  - Wake sleep algorithm\n  - Variational autoencoders\n  - Generative\
    \ adversarial networks\n- A unified view of deep generative models\n  - New formulations\
    \ of deep generative models\n  - Symmetric modeling of latent and visible variables\n\
    \n## Recap: Variational Inference\n\n- Consider a generative model \\(p_\\theta(\\\
    boldsymbol{x}|\\boldsymbol{z})\\), and prior \\(p(\\boldsymbol{z})\\)\n  - Joint\
    \ distribution: \\(p_\\theta(\\boldsymbol{x},\\boldsymbol{z}) = p_\\theta(\\boldsymbol{x}|\\\
    boldsymbol{z})p(\\boldsymbol{z})\\)\n- Assume variational distribution \\(q_\\\
    phi(\\boldsymbol{z}|\\boldsymbol{x})\\)\n- Objective: Maximize lower bound for\
    \ log likelihood\n\n\\[\n\\begin{aligned}\n\\log p(\\boldsymbol{x})\n&= \\mathrm{KL}\\\
    left(q_\\phi(\\boldsymbol{z}|\\boldsymbol{x}) \\| p_\\theta(\\boldsymbol{z}|\\\
    boldsymbol{x})\\right)\n + \\int_{\\boldsymbol{z}} q_\\phi(\\boldsymbol{z}|\\\
    boldsymbol{x}) \\log\\frac{p_\\theta(\\boldsymbol{x},\\boldsymbol{z})}{q_\\phi(\\\
    boldsymbol{z}|\\boldsymbol{x})} \\\\\n&\\ge \\int_{\\boldsymbol{z}} q_\\phi(\\\
    boldsymbol{z}|\\boldsymbol{x}) \\log\\frac{p_\\theta(\\boldsymbol{x},\\boldsymbol{z})}{q_\\\
    phi(\\boldsymbol{z}|\\boldsymbol{x})}\n := \\mathcal{L}(\\boldsymbol{\\theta},\\\
    boldsymbol{\\phi};\\boldsymbol{x})\n\\end{aligned}\n\\]\n\n- Equivalently, minimize\
    \ free energy\n\n\\[\nF(\\boldsymbol{\\theta},\\boldsymbol{\\phi};\\boldsymbol{x})\
    \ = -\\log p(\\boldsymbol{x}) + \\mathrm{KL}\\left(q_\\phi(\\boldsymbol{z}|\\\
    boldsymbol{x}) \\| p_\\theta(\\boldsymbol{z}|\\boldsymbol{x})\\right)\n\\]\n\n\
    ![](img/cb490ed30bca4eda5fbba81c52a2c173_108_0.png)\n\n## Deep generative models\
    \ with amortized inference\n\n- Helmholtz machines\n- Variational autoencoders\
    \ (VAEs) / Neural Variational Inference and Learning (NVIL)\n- We will see later\
    \ that *adversarial approaches* are also included in the list\n  - Predictability\
    \ minimization (PM)\n  - Generative adversarial networks (GANs)\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_109_0.png)\n\
    \n## Wake Sleep Algorithm\n\n- [Hinton et al., Science 1995]\n- Train a separate\
    \ inference model along with the generative model\n  - Generally applicable to\
    \ a wide range of generative models, e.g., Helmholtz machines\n- Consider a generative\
    \ model \\(p_\\theta(x|z)\\) and prior \\(p(z)\\)\n  - Joint distribution \\(p_\\\
    theta(x,z) = p_\\theta(x|z)p(z)\\)\n  - E.g., multi-layer belief nets\n- Inference\
    \ model \\(q_\\phi(z|x)\\)\n- Maximize data log-likelihood with two steps of loss\
    \ relaxation:\n  - Maximize the variational lower bound of log-likelihood, or\
    \ equivalently, minimize the free energy\n\n    \\[\n    F(\\theta, \\phi; x)\
    \ = -\\log p(x) + \\mathrm{KL}\\left(q_\\phi(z|x) \\| p_\\theta(z|x)\\right)\n\
    \    \\]\n\n  - Minimize a different objective (reversed KLD) wrt \\(\\phi\\)\
    \ to ease the optimization\n    - Disconnected from the original variational lower\
    \ bound loss\n\n      \\[\n      F'(\\theta, \\phi; x) = -\\log p(x) + \\mathrm{KL}\\\
    left(p_\\theta(z|x) \\| q_\\phi(z|x)\\right)\n      \\]\n\n- Free energy:\n\n\
    \  \\[\n  F(\\boldsymbol{\\theta}, \\boldsymbol{\\phi}; \\boldsymbol{x}) = -\\\
    log p(\\boldsymbol{x}) + \\mathrm{KL}\\left(q_{\\phi}(\\boldsymbol{z}|\\boldsymbol{x})\
    \ \\| p_{\\theta}(\\boldsymbol{z}|\\boldsymbol{x})\\right)\n  \\]\n\n- Minimize\
    \ the free energy wrt \\(\\boldsymbol{\\theta}\\) of \\(p_{\\theta}\\) \\(\\rightarrow\\\
    ) *wake phase*\n\n  \\[\n  \\max_{\\boldsymbol{\\theta}} \\mathbb{E}_{q_{\\phi}(\\\
    boldsymbol{z}|\\boldsymbol{x})} \\left[\\log p_{\\boldsymbol{\\theta}}(\\boldsymbol{x},\
    \ \\boldsymbol{z})\\right]\n  \\]\n\n  - Get samples from \\(q_\\phi(z|x)\\) through\
    \ inference on hidden variables\n  - Use the samples as targets for updating the\
    \ generative model \\(p_\\theta(z|x)\\)\n  - Correspond to the variational M step\n\
    \n![](img/cb490ed30bca4eda5fbba81c52a2c173_110_0.png)\n\n- WS works around the\
    \ difficulties with the sleep phase approximation\n- Minimize the following objective\
    \ \\(\\rightarrow\\) sleep phase\n\n  \\[\n  F'(\\theta, \\phi; x) = -\\log p(x)\
    \ + \\mathrm{KL}\\left(p_\\theta(z|x) \\| q_\\phi(z|x)\\right)\n  \\]\n\n  \\\
    [\n  \\max_{\\phi} \\mathbb{E}_{p_\\theta(z,x)} \\left[\\log q_\\phi(z|x)\\right]\n\
    \  \\]\n\n  - “Dreaming” up samples from \\(p_\\theta(x|z)\\) through top-down\
    \ pass\n  - Use the samples as targets for updating the inference model\n- (Recent\
    \ approaches other than sleep phase are developed to reduce the variance of gradient\
    \ estimate: slides later)\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_112_0.png)\n\
    \n[Figure courtesy: Maei’s slides]\n\n### Wake sleep\n\n- Parametrized inference\
    \ model \\(q_\\phi(\\mathbf{z}|\\mathbf{x})\\)\n  - Wake phase:\n    - Minimize\
    \ \\(\\mathrm{KL}\\left(q_\\phi(\\mathbf{z}|\\mathbf{x}) \\| p_\\theta(\\mathbf{z}|\\\
    mathbf{x})\\right)\\) wrt \\(\\theta\\)\n    - \\(\\mathbb{E}_{q_\\phi(\\mathbf{z}|\\\
    mathbf{x})}\\left[\\nabla_\\theta \\log p_\\theta(\\mathbf{x}|\\mathbf{z})\\right]\\\
    )\n  - Sleep phase:\n    - Minimize \\(\\mathrm{KL}\\left(p_\\theta(\\mathbf{z}|\\\
    mathbf{x}) \\| q_\\phi(\\mathbf{z}|\\mathbf{x})\\right)\\) wrt \\(\\phi\\)\n \
    \   - \\(\\mathbb{E}_{p_\\theta(\\mathbf{z},\\mathbf{x})}\\left[\\nabla_\\phi\
    \ \\log q_\\phi(\\mathbf{z}|\\mathbf{x})\\right]\\)\n    - Low variance\n    -\
    \ Learning with generated samples of \\(\\mathbf{x}\\)\n- Two objectives, not\
    \ guaranteed to converge\n\n### Variational EM\n\n- Variational distribution \\\
    (q_\\phi(\\mathbf{z}|\\mathbf{x})\\)\n  - Variational M step:\n    - Minimize\
    \ \\(\\mathrm{KL}\\left(q_\\phi(\\mathbf{z}|\\mathbf{x}) \\| p_\\theta(\\mathbf{z}|\\\
    mathbf{x})\\right)\\) wrt \\(\\theta\\)\n    - \\(\\mathbb{E}_{q_\\phi(\\mathbf{z}|\\\
    mathbf{x})}\\left[\\nabla_\\theta \\log p_\\theta(\\mathbf{x}|\\mathbf{z})\\right]\\\
    )\n  - Variational E step:\n    - Minimize \\(\\mathrm{KL}\\left(q_\\phi(\\mathbf{z}|\\\
    mathbf{x}) \\| p_\\theta(\\mathbf{z}|\\mathbf{x})\\right)\\) wrt \\(\\phi\\)\n\
    \    - \\(q_\\phi^* \\propto \\exp[\\log p_\\theta]\\) if closed-form is available\n\
    \    - \\(\\nabla_\\phi \\mathbb{E}_{q_\\phi}\\left[\\log p_\\theta(\\mathbf{z},\\\
    mathbf{x})\\right]\\)\n      - Need variance reduction in practice\n    - Learning\
    \ with real data \\(\\mathbf{x}\\)\n- Single objective, guaranteed to converge\n\
    \n## Variational Autoencoders (VAEs)\n\n- [Kingma & Welling, 2014]\n- Use variational\
    \ inference with an inference model\n  - Enjoy similar applicability with wake-sleep\
    \ algorithm\n- Generative model \\(p_\\theta(\\mathbf{x}|\\mathbf{z})\\), and\
    \ prior \\(p(\\mathbf{z})\\)\n  - Joint distribution \\(p_\\theta(\\mathbf{x},\\\
    mathbf{z}) = p_\\theta(\\mathbf{x}|\\mathbf{z})p(\\mathbf{z})\\)\n- Inference\
    \ model \\(q_\\phi(\\mathbf{z}|\\mathbf{x})\\)\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_114_0.png)\n\
    \nFigure courtesy: Kingma & Welling, 2014\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_116_0.png)\n\
    \n## Reparameterized gradient\n\n- Optimize \\(\\mathcal{L}(\\boldsymbol{\\theta},\
    \ \\boldsymbol{\\phi}; x)\\) wrt \\(\\boldsymbol{\\phi}\\) of \\(q_{\\boldsymbol{\\\
    phi}}(z\\mid x)\\)\n  - Recap: gradient estimate with log-derivative trick:\n\n\
    \    \\[\n    \\nabla_{\\boldsymbol{\\phi}}\\mathbb{E}_{q_{\\boldsymbol{\\phi}}}\\\
    left[\\log p_{\\boldsymbol{\\theta}}(x,z)\\right]\n    = \\mathbb{E}_{q_{\\boldsymbol{\\\
    phi}}}\\left[\\log p_{\\boldsymbol{\\theta}}(x,z)\\,\\nabla_{\\boldsymbol{\\phi}}\\\
    log q_{\\boldsymbol{\\phi}}(z\\mid x)\\right]\n    \\]\n\n- High variance:\n\n\
    \  \\[\n  \\nabla_{\\boldsymbol{\\phi}}\\mathbb{E}_{q_{\\boldsymbol{\\phi}}}\\\
    left[\\log p_{\\boldsymbol{\\theta}}(x,z)\\right]\n  \\approx \\mathbb{E}_{z_i\\\
    sim q_{\\boldsymbol{\\phi}}}\\left[\\log p_{\\boldsymbol{\\theta}}(x,z_i)\\,\\\
    nabla_{\\boldsymbol{\\phi}}\\log q_{\\boldsymbol{\\phi}}(z_i\\mid x)\\right]\n\
    \  \\]\n\n  - The scale factor \\(\\log p_{\\boldsymbol{\\theta}}(x,z_i)\\) can\
    \ have arbitrarily large magnitude\n\n- Gradient estimate with the *reparameterization\
    \ trick*\n\n  \\[\n  z \\sim q_{\\boldsymbol{\\phi}}(z\\mid x) \\quad\\Longleftrightarrow\\\
    quad z = g_{\\boldsymbol{\\phi}}(\\epsilon,x), \\qquad \\epsilon \\sim p(\\epsilon)\n\
    \  \\]\n\n  \\[\n  \\nabla_{\\boldsymbol{\\phi}}\\mathbb{E}_{q_{\\boldsymbol{\\\
    phi}}(z\\mid x)}\\left[\\log p_{\\boldsymbol{\\theta}}(x,z)\\right]\n  = \\mathbb{E}_{\\\
    epsilon\\sim p(\\epsilon)}\\left[\\nabla_{\\boldsymbol{\\phi}}\\log p_{\\boldsymbol{\\\
    theta}}\\left(x,z_{\\boldsymbol{\\phi}}(\\epsilon)\\right)\\right]\n  \\]\n\n\
    - (Empirically) lower variance of the gradient estimate\n- E.g., \\(z\\sim\\mathcal{N}(\\\
    boldsymbol{\\mu}(x), L(x)L(x)^T) \\quad\\Longleftrightarrow\\quad \\epsilon\\\
    sim\\mathcal{N}(0,1),\\; z=\\boldsymbol{\\mu}(x)+L(x)\\epsilon\\)\n"
  mdcn: "\n\n## 深度生成模型的复兴\n\n- 变分自编码器（VAEs）[Kingma & Welling, 2014] / 神经变分推断与学习（NVIL）[Mnih\
    \ & Gregor, 2014]\n- 生成对抗网络（GANs）[Goodfellow et al., 2014]\n- 生成矩匹配网络（GMMNs）[Li\
    \ et al., 2015; Dziugaite et al., 2015]\n- 自回归神经网络\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_102_0.png)\n\
    \n![](img/cb490ed30bca4eda5fbba81c52a2c173_102_1.png)\n\n## 大纲\n\n- 深度生成模型研究进展概述\n\
    - 深度生成模型的理论基础\n  - 唤醒-睡眠算法\n  - 变分自编码器\n  - 生成对抗网络\n- 深度生成模型的统一视角\n  - 深度生成模型的新公式化表述\n\
    \  - 隐变量与可见变量的对称建模\n\n## 回顾：变分推断\n\n- 考虑生成模型 \\(p_\\theta(\\boldsymbol{x}|\\boldsymbol{z})\\\
    ) 和先验 \\(p(\\boldsymbol{z})\\)\n  - 联合分布：\\(p_\\theta(\\boldsymbol{x},\\boldsymbol{z})\
    \ = p_\\theta(\\boldsymbol{x}|\\boldsymbol{z})p(\\boldsymbol{z})\\)\n- 假设变分分布\
    \ \\(q_\\phi(\\boldsymbol{z}|\\boldsymbol{x})\\)\n- 目标：最大化对数似然的变分下界\n\n\\[\n\\\
    begin{aligned}\n\\log p(\\boldsymbol{x})\n&= \\mathrm{KL}\\left(q_\\phi(\\boldsymbol{z}|\\\
    boldsymbol{x}) \\| p_\\theta(\\boldsymbol{z}|\\boldsymbol{x})\\right)\n + \\int_{\\\
    boldsymbol{z}} q_\\phi(\\boldsymbol{z}|\\boldsymbol{x}) \\log\\frac{p_\\theta(\\\
    boldsymbol{x},\\boldsymbol{z})}{q_\\phi(\\boldsymbol{z}|\\boldsymbol{x})} \\\\\
    \n&\\ge \\int_{\\boldsymbol{z}} q_\\phi(\\boldsymbol{z}|\\boldsymbol{x}) \\log\\\
    frac{p_\\theta(\\boldsymbol{x},\\boldsymbol{z})}{q_\\phi(\\boldsymbol{z}|\\boldsymbol{x})}\n\
    \ := \\mathcal{L}(\\boldsymbol{\\theta},\\boldsymbol{\\phi};\\boldsymbol{x})\n\
    \\end{aligned}\n\\]\n\n- 等价地，最小化自由能\n\n\\[\nF(\\boldsymbol{\\theta},\\boldsymbol{\\\
    phi};\\boldsymbol{x}) = -\\log p(\\boldsymbol{x}) + \\mathrm{KL}\\left(q_\\phi(\\\
    boldsymbol{z}|\\boldsymbol{x}) \\| p_\\theta(\\boldsymbol{z}|\\boldsymbol{x})\\\
    right)\n\\]\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_108_0.png)\n\n## 基于摊销推断的深度生成模型\n\
    \n- 亥姆霍兹机\n- 变分自编码器（VAEs）/ 神经变分推断与学习（NVIL）\n- 我们稍后将看到，*对抗方法*也包含在这个列表中\n  - 可预测性最小化（PM）\n\
    \  - 生成对抗网络（GANs）\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_109_0.png)\n\n##\
    \ 唤醒-睡眠算法\n\n- [Hinton et al., Science 1995]\n- 与生成模型一起训练一个独立的推断模型\n  - 通常适用于多种生成模型，例如亥姆霍兹机\n\
    - 考虑生成模型 \\(p_\\theta(x|z)\\) 和先验 \\(p(z)\\)\n  - 联合分布 \\(p_\\theta(x,z) = p_\\\
    theta(x|z)p(z)\\)\n  - 例如，多层信念网络\n- 推断模型 \\(q_\\phi(z|x)\\)\n- 通过两步损失松弛最大化数据的对数似然：\n\
    \  - 最大化对数似然的变分下界，或等价地，最小化自由能\n\n    \\[\n    F(\\theta, \\phi; x) = -\\log p(x)\
    \ + \\mathrm{KL}\\left(q_\\phi(z|x) \\| p_\\theta(z|x)\\right)\n    \\]\n\n  -\
    \ 关于 \\(\\phi\\) 最小化一个不同的目标（反向 KLD），以简化优化\n    - 与原始的变分下界损失无关\n\n      \\[\n \
    \     F'(\\theta, \\phi; x) = -\\log p(x) + \\mathrm{KL}\\left(p_\\theta(z|x)\
    \ \\| q_\\phi(z|x)\\right)\n      \\]\n\n- 自由能：\n\n  \\[\n  F(\\boldsymbol{\\\
    theta}, \\boldsymbol{\\phi}; \\boldsymbol{x}) = -\\log p(\\boldsymbol{x}) + \\\
    mathrm{KL}\\left(q_{\\phi}(\\boldsymbol{z}|\\boldsymbol{x}) \\| p_{\\theta}(\\\
    boldsymbol{z}|\\boldsymbol{x})\\right)\n  \\]\n\n- 关于 \\(p_{\\theta}\\) 的参数 \\\
    (\\boldsymbol{\\theta}\\) 最小化自由能 \\(\\rightarrow\\) *唤醒阶段*\n\n  \\[\n  \\max_{\\\
    boldsymbol{\\theta}} \\mathbb{E}_{q_{\\phi}(\\boldsymbol{z}|\\boldsymbol{x})}\
    \ \\left[\\log p_{\\boldsymbol{\\theta}}(\\boldsymbol{x}, \\boldsymbol{z})\\right]\n\
    \  \\]\n\n  - 通过对隐变量进行推断，从 \\(q_\\phi(z|x)\\) 中获取样本\n  - 使用这些样本作为更新生成模型 \\(p_\\\
    theta(z|x)\\) 的目标\n  - 对应于变分 M 步\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_110_0.png)\n\
    \n- WS 绕过了睡眠阶段近似带来的困难\n- 最小化以下目标 \\(\\rightarrow\\) 睡眠阶段\n\n  \\[\n  F'(\\theta,\
    \ \\phi; x) = -\\log p(x) + \\mathrm{KL}\\left(p_\\theta(z|x) \\| q_\\phi(z|x)\\\
    right)\n  \\]\n\n  \\[\n  \\max_{\\phi} \\mathbb{E}_{p_\\theta(z,x)} \\left[\\\
    log q_\\phi(z|x)\\right]\n  \\]\n\n  - 通过自顶向下的过程从 \\(p_\\theta(x|z)\\) “想象”出样本\n\
    \  - 使用这些样本作为更新推断模型的目标\n- （除了睡眠阶段之外，近期方法的发展旨在减少梯度估计的方差：见后续幻灯片）\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_112_0.png)\n\
    \n[图片来源：Maei 的幻灯片]\n\n### 唤醒-睡眠\n\n- 参数化的推断模型 \\(q_\\phi(\\mathbf{z}|\\mathbf{x})\\\
    )\n  - 唤醒阶段：\n    - 关于 \\(\\theta\\) 最小化 \\(\\mathrm{KL}\\left(q_\\phi(\\mathbf{z}|\\\
    mathbf{x}) \\| p_\\theta(\\mathbf{z}|\\mathbf{x})\\right)\\)\n    - \\(\\mathbb{E}_{q_\\\
    phi(\\mathbf{z}|\\mathbf{x})}\\left[\\nabla_\\theta \\log p_\\theta(\\mathbf{x}|\\\
    mathbf{z})\\right]\\)\n  - 睡眠阶段：\n    - 关于 \\(\\phi\\) 最小化 \\(\\mathrm{KL}\\left(p_\\\
    theta(\\mathbf{z}|\\mathbf{x}) \\| q_\\phi(\\mathbf{z}|\\mathbf{x})\\right)\\\
    )\n    - \\(\\mathbb{E}_{p_\\theta(\\mathbf{z},\\mathbf{x})}\\left[\\nabla_\\\
    phi \\log q_\\phi(\\mathbf{z}|\\mathbf{x})\\right]\\)\n    - 低方差\n    - 使用生成的\
    \ \\(\\mathbf{x}\\) 样本进行学习\n- 两个目标，不保证收敛\n\n### 变分 EM\n\n- 变分分布 \\(q_\\phi(\\\
    mathbf{z}|\\mathbf{x})\\)\n  - 变分 M 步：\n    - 关于 \\(\\theta\\) 最小化 \\(\\mathrm{KL}\\\
    left(q_\\phi(\\mathbf{z}|\\mathbf{x}) \\| p_\\theta(\\mathbf{z}|\\mathbf{x})\\\
    right)\\)\n    - \\(\\mathbb{E}_{q_\\phi(\\mathbf{z}|\\mathbf{x})}\\left[\\nabla_\\\
    theta \\log p_\\theta(\\mathbf{x}|\\mathbf{z})\\right]\\)\n  - 变分 E 步：\n    -\
    \ 关于 \\(\\phi\\) 最小化 \\(\\mathrm{KL}\\left(q_\\phi(\\mathbf{z}|\\mathbf{x}) \\\
    | p_\\theta(\\mathbf{z}|\\mathbf{x})\\right)\\)\n    - 若存在闭式解，则 \\(q_\\phi^* \\\
    propto \\exp[\\log p_\\theta]\\)\n    - \\(\\nabla_\\phi \\mathbb{E}_{q_\\phi}\\\
    left[\\log p_\\theta(\\mathbf{z},\\mathbf{x})\\right]\\)\n      - 在实践中需要降低方差\n\
    \    - 使用真实数据 \\(\\mathbf{x}\\) 进行学习\n- 单一目标，保证收敛\n\n## 变分自编码器（VAEs）\n\n- [Kingma\
    \ & Welling, 2014]\n- 使用带推断模型的变分推断\n  - 具有与唤醒-睡眠算法类似的广泛适用性\n- 生成模型 \\(p_\\theta(\\\
    mathbf{x}|\\mathbf{z})\\) 和先验 \\(p(\\mathbf{z})\\)\n  - 联合分布 \\(p_\\theta(\\mathbf{x},\\\
    mathbf{z}) = p_\\theta(\\mathbf{x}|\\mathbf{z})p(\\mathbf{z})\\)\n- 推断模型 \\(q_\\\
    phi(\\mathbf{z}|\\mathbf{x})\\)\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_114_0.png)\n\
    \n图片来源：Kingma & Welling, 2014\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_116_0.png)\n\
    \n## 重参数化梯度\n\n- 关于 \\(q_{\\boldsymbol{\\phi}}(z\\mid x)\\) 的参数 \\(\\boldsymbol{\\\
    phi}\\) 优化 \\(\\mathcal{L}(\\boldsymbol{\\theta}, \\boldsymbol{\\phi}; x)\\)\n\
    \  - 回顾：使用对数导数技巧的梯度估计：\n\n    \\[\n    \\nabla_{\\boldsymbol{\\phi}}\\mathbb{E}_{q_{\\\
    boldsymbol{\\phi}}}\\left[\\log p_{\\boldsymbol{\\theta}}(x,z)\\right]\n    =\
    \ \\mathbb{E}_{q_{\\boldsymbol{\\phi}}}\\left[\\log p_{\\boldsymbol{\\theta}}(x,z)\\\
    ,\\nabla_{\\boldsymbol{\\phi}}\\log q_{\\boldsymbol{\\phi}}(z\\mid x)\\right]\n\
    \    \\]\n\n- 高方差：\n\n  \\[\n  \\nabla_{\\boldsymbol{\\phi}}\\mathbb{E}_{q_{\\\
    boldsymbol{\\phi}}}\\left[\\log p_{\\boldsymbol{\\theta}}(x,z)\\right]\n  \\approx\
    \ \\mathbb{E}_{z_i\\sim q_{\\boldsymbol{\\phi}}}\\left[\\log p_{\\boldsymbol{\\\
    theta}}(x,z_i)\\,\\nabla_{\\boldsymbol{\\phi}}\\log q_{\\boldsymbol{\\phi}}(z_i\\\
    mid x)\\right]\n  \\]\n\n  - 缩放因子 \\(\\log p_{\\boldsymbol{\\theta}}(x,z_i)\\\
    ) 可能具有任意大的量级\n\n- 使用*重参数化技巧*的梯度估计\n\n  \\[\n  z \\sim q_{\\boldsymbol{\\phi}}(z\\\
    mid x) \\quad\\Longleftrightarrow\\quad z = g_{\\boldsymbol{\\phi}}(\\epsilon,x),\
    \ \\qquad \\epsilon \\sim p(\\epsilon)\n  \\]\n\n  \\[\n  \\nabla_{\\boldsymbol{\\\
    phi}}\\mathbb{E}_{q_{\\boldsymbol{\\phi}}(z\\mid x)}\\left[\\log p_{\\boldsymbol{\\\
    theta}}(x,z)\\right]\n  = \\mathbb{E}_{\\epsilon\\sim p(\\epsilon)}\\left[\\nabla_{\\\
    boldsymbol{\\phi}}\\log p_{\\boldsymbol{\\theta}}\\left(x,z_{\\boldsymbol{\\phi}}(\\\
    epsilon)\\right)\\right]\n  \\]\n\n- （经验上）梯度估计的方差更低\n- 例如，\\(z\\sim\\mathcal{N}(\\\
    boldsymbol{\\mu}(x), L(x)L(x)^T) \\quad\\Longleftrightarrow\\quad \\epsilon\\\
    sim\\mathcal{N}(0,1),\\; z=\\boldsymbol{\\mu}(x)+L(x)\\epsilon\\)\n\n"
