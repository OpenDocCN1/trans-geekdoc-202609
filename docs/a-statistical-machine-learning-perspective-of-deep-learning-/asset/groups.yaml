  mdcn: "\n## 混合通信\n\n- 讨论：利用 SFs 并非新想法，实际上\n- Microsoft Adam 使用第三种策略 (c)\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_304_0.png)\n\
    \n## 混合通信\n\n- Adam 的策略导致通信瓶颈\n  - 将 SFs 推送到服务器是可以的\n  - 将完整矩阵拉回会造成服务器节点的瓶颈。\n\
    \n![](img/cb490ed30bca4eda5fbba81c52a2c173_305_0.png)\n\n图 10：使用 TF-WFBP、Adam\
    \ 和 Poseidon（TensorFlow 引擎）训练 VGG19 时的平均通信负载。每个条形代表节点上的网络流量。\n\n- 混合通信实现通信负载均衡\n\
    \  - 这对于解决突发通信问题很重要。\n\n## 介绍 Poseidon\n\n- Poseidon：一种高效的通信架构\n- 一个用于放大现有深度学习工具包的分布式平台\n\
    \n工具包\n\n平台\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_306_0.png)\n\n## 使用 Poseidon\n\
    \n- Poseidon：一种高效的通信架构\n- 保留任何高级工具包的编程接口\n- 即 分发深度学习程序 **不更改任何一行应用程序代码**\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_311_0.png)\n\
    \n## 概要\n\n- 概述：GPU 上的分布式深度学习\n- 挑战 1：解决通信瓶颈\n- 挑战 2：处理有限的 GPU 内存\n\n## 无 GPU\
    \ 的机器\n\nCPU 核心\n\n网络\n\nNIC\n\n本地存储\n\nDRAM\n(CPU 内存)\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_314_0.png)\n\
    \n## 带 GPU 的机器\n\nCPU 核心\n\n网络\n\nNIC\n\n本地\n存储\n\nDRAM\n(CPU 内存)\n\n小 GPU 内存\n\
    在 GPU/CPU 内存之间复制成本高\n\nGPU 设备\n\nGPU 核心\n\nGPU\n内存\n(几个 GB)\n\n## 数据\n\n最大可用 GPU\
    \ 内存：12G\n\n训练批次\n\n参数\n\nGPU 内存\n\n中间状态\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_318_0.png)\n\
    \n| 网络 | 批大小 | 输入大小 | 参数 + 梯度 | 中间状态 |\n|---|---|---|---|---|\n| AlexNet | 256\
    \ | 150MB | <500M | 4.5G |\n| GoogLeNet | 64 | 19MB | <40M | 10G |\n| VGG19 |\
    \ 16 | 10MB | <1.2G | 10.8G |\n\n## 为什么内存是个问题？\n\n- 中间状态占用 90% 的 GPU 内存\n- 中间状态与输入批大小成正比\n\
    \n- 然而，\n  - 如果你想要高吞吐量，必须有大的批大小（因为 GPU 的 SIMD 性质）\n  - 如果批大小很大，你的 GPU 将被中间状态占用，从而限制你的模型大小/深度\n\
    \n## 节省内存：一个简单技巧\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_320_0.png)\n\n- 基本思想\n\
    \  - 事实：中间状态与批大小 K 成正比\n  - 思路：通过累积在 GPU 内存中可负担的小批大小产生的梯度来实现大批大小\n- 解决方案：\n  -\
    \ 将 K 分成 M 部分，每部分有 K/M 个样本\n  - 对于 iter = 1:M\n    - 使用迷你批大小 K/M 训练\n    - 在 GPU\
    \ 上累积梯度而不更新模型参数\n  - 当所有 M 部分完成后一起更新模型参数\n- 缺点\n  - 如果 GPU 即使在 K=1 时仍无法承受中间状态怎么办？\n\
    \  - 小批大小通常会导致 GPU 计算能力利用不足\n\n## 使用 CPU 内存进行内存管理\n\n- 核心思想\n  - 如果内存有限，用其他东西换取内存\n\
    \    - 用额外计算换取内存\n    - 用其他成本（如内存交换）换取更多可用内存\n  - 如果内存有限，那就获取更多\n    - 模型并行\n\
    \    - CPU 内存\n\n## 使用 CPU 内存进行内存管理\n\n类别概率\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_324_0.png)\n\
    \n训练图像\n\n- 对于每次迭代（迷你批）\n- 一次前向传播\n- 然后一次反向传播\n- 每次仅使用两层的数据\n\n## 使用 CPU 内存进行内存管理\n\
    \n类别概率\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_325_0.png)\n\n训练图像\n\n- 对于每次迭代（迷你批）\n\
    \  - 一次前向传播\n  - 然后一次反向传播\n\n- 每次仅使用两层的数据\n\n## 使用 CPU 内存进行内存管理\n\n类别概率\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_327_0.png)\n\
    \n训练图像\n\n- 对于每次迭代（迷你批）\n  - 一次前向传播\n  - 然后一次反向传播\n- 每次仅使用两层的数据\n\n思路\n\n- 将 GPU\
    \ 内存用作缓存以保留活动使用的数据\n- 将剩余部分存储在 CPU 内存中\n\n## 使用 CPU 内存进行内存管理\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_328_0.png)\n\
    \n## 使用 CPU 内存进行内存管理\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_329_0.png)\n\n\
    Cui et al., 2016\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_330_0.png)\n\n##\
    \ 使用 CPU 内存进行内存管理\n\n- 控制器\n  - 事实：内存访问顺序是确定性的，可以通过一次前向和反向传播精确得知\n  - 思路：\n  \
    \  - 通过虚拟迭代获得内存访问顺序\n    - 预取内存块从 CPU 到 GPU\n    - 将内存交换开销与计算重叠\n\n## 吞吐量 vs.\
    \ 内存预算\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_332_0.png)\n\n所有数据在 GPU 内存中\n\
    \n仅缓冲池在 GPU 内存中\n双缓冲的峰值大小的两倍\n\n- 仅 35% 内存时吞吐量减少 27%\n- 可以以很少的开销处理 3 倍更大的问题\n\n\
    ## 更大的模型\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_333_0.png)\n\n- 模型高达 20 GB\n\
    \n## 总结\n\n- 将深度学习视为数据流图\n- 已开发了大量自动微分库来训练神经网络\n  - 不同的采用方式、优点、缺点\n  - DyNet 是下一代动态神经网络的新框架\n\
    - 使用分布式 GPU 扩展深度学习时会出现困难\n  - 通信瓶颈\n  - 内存限制\n- Poseidon 作为支持和放大不同类型深度学习工具箱的平台\n\
    \n## 系统-算法协同设计！\n\n数据\n\n任务\n\n我们的 “VML”\n软件层\n\n模型\n\n算法\n\n实现\n\n系统\n\n平台\n\
    和硬件\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_336_0.png)\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_337_0.png)\n\
    \n## 更佳性能\n\n- **快速且实时**\n  - 比 Spark 和 TensorFlow 快数个数量级\n  - 与手工打造的系统一样快\n\n\
    - **任意规模**\n  - 随着计算设备增多实现完美的线性加速\n  - Spark、TensorFlow 在设备增多时可能会变慢\n\n- **低资源**\n\
    \  - **将普通集群转变为超级计算机：**\n    - 使用更少的计算设备实现更多数据的 AI 结果\n    - Google Brain 使用约\
