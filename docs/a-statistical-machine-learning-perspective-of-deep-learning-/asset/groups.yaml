  - "[PAGE 130]\n\n# ADA: conventional formulation\n\n+   - Train $D_\\phi$ to distinguish\
    \ between domains\n+   \n+     $\\max_\\phi \\mathcal{L}_\\phi = \\mathbb{E}_{\\\
    boldsymbol{x}=G_\\theta(\\boldsymbol{z}),\\boldsymbol{z}\\sim p(\\boldsymbol{z}|y=1)}[\\\
    log D_\\phi(\\boldsymbol{x})] + \\mathbb{E}_{\\boldsymbol{x}=G_\\theta(\\boldsymbol{z}),\\\
    boldsymbol{z}\\sim p(\\boldsymbol{z}|y=0)}[\\log(1 - D_\\phi(\\boldsymbol{x}))]$\n\
    +   \n+   - Train $G_\\theta$ to fool $D_\\phi$\n+   \n+     $\\max_\\theta \\\
    mathcal{L}_\\theta = \\mathbb{E}_{\\boldsymbol{x}=G_\\theta(\\boldsymbol{z}),\\\
    boldsymbol{z}\\sim p(\\boldsymbol{z}|y=1)}[\\log(1 - D_\\phi(\\boldsymbol{x}))]\
    \ + \\mathbb{E}_{\\boldsymbol{x}=G_\\theta(\\boldsymbol{z}),\\boldsymbol{z}\\\
    sim p(\\boldsymbol{z}|y=0)}[\\log D_\\phi(\\boldsymbol{x})]$"
  - '[PAGE 131]


    # ADA: new formulation


    +   - To reveal the connections to conventional variational approaches, let’s
    rewrite the objectives in a format that resembles variational EM

    +   - Implicit distribution over $\boldsymbol{x} \sim p_\theta(\boldsymbol{x}|y)$

    +     $\boldsymbol{x} = G_\theta(\boldsymbol{z}), \ \boldsymbol{z} \sim p(\boldsymbol{z}|y)$

    +   - Discriminator distribution $q_\phi(y|\boldsymbol{x})$

    +     $q_\phi^r(y|\boldsymbol{x}) = q_\phi(1 - y|\boldsymbol{x})$

    +   - Rewrite the objective in the new form (up to constant scale factor)

    +     $\max_\phi \mathcal{L}_\phi = \mathbb{E}_{p_\theta(\boldsymbol{x}|y)p(y)}[\log
    q_\phi(y|\boldsymbol{x})]$

    +     $\max_\theta \mathcal{L}_\theta = \mathbb{E}_{p_\theta(\boldsymbol{x}|y)p(y)}[\log
    q_\phi^r(y|\boldsymbol{x})]$

    +     - $\boldsymbol{z}$ is encapsulated in the implicit distribution $p_\theta(\boldsymbol{x}|y)$

    +       $\max_\phi \mathcal{L}_\phi = \mathbb{E}_{p_\theta(\boldsymbol{x}|y=0)p(y=0)}[\log
    q_\phi(y=0|\boldsymbol{x})] + \mathbb{E}_{p_\theta(\boldsymbol{x}|y=1)p(y=1)}[\log
    q_\phi(y=1|\boldsymbol{x})]$

    +       $= \frac{1}{2}\mathbb{E}_{\boldsymbol{x}=G_\theta(\boldsymbol{z}),\boldsymbol{z}\sim
    p(\boldsymbol{z}|y=0)}[\log(1 - D_\phi(\boldsymbol{x}))] + \frac{1}{2}\mathbb{E}_{\boldsymbol{x}=G_\theta(\boldsymbol{z}),\boldsymbol{z}\sim
    p(\boldsymbol{z}|y=1)}[\log D_\phi(\boldsymbol{x})]$

    +     - (Ignore the constant scale factor 1/2)'
  - '[PAGE 132]


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_132_0.png)


    # # ADA: new formulation


    +   - New formulation


    $$\max_{\phi}\mathcal{L}_{\phi}=\mathbb{E}_{p_{\theta}(x\mid y)p(y)}\left[\log
    q_{\phi}(y\mid x)\right]$$


    $$\max_{\theta}\mathcal{L}_{\theta}=\mathbb{E}_{p_{\theta}(x\mid y)p(y)}\left[\log
    q_{\phi}^{r}(y\mid x)\right]$$


    +   - The only **difference** between optimizing $\theta$ and $\phi$: $q$ vs.
    $q^{r}$


    +   - This is where the **adversarial** mechanism comes about'
  - '[PAGE 133]


    # # ADA vs. Variational EM


    # ## Variational EM


    +   - **Objectives**

    +     - $$\max_{\phi}\mathcal{L}_{\phi,\theta}=\mathbb{E}_{q_{\phi}(z|x)}[\log
    p_{\theta}(x|z)]+KL\left(q_{\phi}(z|x)\|p(z)\right)$$

    +     - $$\max_{\theta}\mathcal{L}_{\phi,\theta}=\mathbb{E}_{q_{\phi}(z|x)}[\log
    p_{\theta}(x|z)]+KL\left(q_{\phi}(z|x)\|p(z)\right)$$

    +   - Single objective for both $\theta$ and $\phi$

    +   - Extra prior regularization by $p(z)$


    # ## ADA


    +   - **Objectives**

    +     - $$\max_{\phi}\mathcal{L}_{\phi}=\mathbb{E}_{p_{\theta}(x|y)p(y)}\left[\log
    q_{\phi}(y|x)\right]$$

    +     - $$\max_{\theta}\mathcal{L}_{\theta}=\mathbb{E}_{p_{\theta}(x|y)p(y)}\left[\log
    q_{\phi}^{r}(y|x)\right]$$

    +   - Two objectives

    +   - Have global optimal state in the game theoretic view'
  - '[PAGE 134]


    # ADA vs. Variational EM


    # Variational EM


    +   - Objectives

    +     max_φ L_{φ,θ} = E_{q_φ(z|x)}[log p_θ(x|z)] + KL(q_φ(z|x)||p(z))

    +     max_θ L_{φ,θ} = E_{q_φ(z|x)}[log p_θ(x|z)] + KL(q_φ(z|x)||p(z))

    +   - Single objective for both θ and φ

    +   - Extra prior regularization by p(z)

    +   - The reconstruction term: maximize the conditional log-likelihood of x with
    the generative distribution p_θ(x|z) conditioning on the latent code z inferred
    by q_φ(z|x)

    +   - p_θ(x|z) is the generative model

    +   - q_φ(z|x) is the inference model


    # ADA


    +   - Objectives

    +     max_φ L_φ = E_{p_θ(x|y)p(y)}[log q_φ(y|x)]

    +     max_θ L_θ = E_{p_θ(x|y)p(y)}[log q_φ^r(y|x)]

    +   - Two objectives

    +   - Have global optimal state in the game theoretic view

    +   - The objectives: maximize the conditional log-likelihood of y (or 1 − y)
    with the distribution q_φ(y|x) conditioning on latent feature x inferred by p_θ(x|y)

    +   - Interpret q_φ(y|x) as the generative model

    +   - Interpret p_θ(x|y) as the inference model'
  - '[PAGE 135]


    # ADA: graphical model


    Define:


    +   - Solid-line arrows ($x \to y$):

    +     - generative process

    +   - Dashed-line arrows (y, z -> $x$):

    +     - inference

    +   - Hollow arrows (z -> $x$):

    +     - deterministic transformation

    +     - leading to implicit distributions

    +   - Blue arrows ($x \to y$):

    +     - adversarial mechanism

    +     - involves both $q_\phi(y|\boldsymbol{x})$ and $q_\phi^r(y|\boldsymbol{x})$


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_135_0.png)


    max$_\phi$ $\mathcal{L}_\phi$ = $\mathbb{E}_{p_\theta(\boldsymbol{x}|y)p(y)}$
    [$\log q_\phi(y|\boldsymbol{x})$]

    max$_\theta$ $\mathcal{L}_\theta$ = $\mathbb{E}_{p_\theta(\boldsymbol{x}|y)p(y)}$
    [$\log q_\phi^r(y|\boldsymbol{x})$]'
