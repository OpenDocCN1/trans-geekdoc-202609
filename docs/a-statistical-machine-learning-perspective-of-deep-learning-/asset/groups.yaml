    \ Updates\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_286_0.png)\n\n## Convergence\
    \ Guarantee\n\n- Assumptions\n  - Bridging model\n    - Staleness Synchronous\
    \ Parallel (SSP) with staleness parameter s\n    - Bulk Synchronous Parallel is\
    \ a special case of SSP when s = 0\n  - Communication methods\n    - Partial broadcast\
    \ (PB): sending messages to a subset of Q (Q < P − 1) machines\n    - Full broadcast\
    \ is a special case of PB when Q = P − 1\n  - Assumption 1. (1) For all j, f_j\
    \ is continuously differentiable and F is bounded from below; (2) ∇F, ∇F_p are\
    \ Lipschitz continuous with constants L_F and L_p, respectively, and let L = Σ_{p=1}^P\
    \ L_p; (3) There exists G, σ² such that for all p and c, we have (almost surely)\
    \ ||U_p(W_p^c, I_p^c)|| ≤ Gη and \U0001D53C|| |S_p| Σ_{j∈I_p} ∇f_j(W) − ∇F_p(W)\
    \ ||_2² ≤ σ².\n\n## Convergence Guarantee\n\n### Results\n\nTheorem 1. Let Assumption\
    \ 1 hold, and let {W_p^c}, p = 1, ..., P, {W^c} be the local sequences and the\
    \ auxiliary sequence, respectively.\n\nUnder full broadcasting (i.e., Q = P -\
    \ 1) and set the learning rate η := η_c = O(√(1/(Lσ² P s_c))), we have\n\n- lim\
    \ inf_{c→∞} E‖∇F(W^c)‖ = 0, hence there exists a subsequence of ∇F(W^c) that almost\
    \ surely vanishes;\n- lim_{c→∞} max_p ‖W^c - W_p^c‖ = 0, i.e., the maximal disagreement\
    \ between all local sequences and the auxiliary sequence converges to 0 (almost\
    \ surely);\n- There exists a common subsequence of {W_p^c} and {W^c} that converges\
    \ almost surely to a stationary point of F, with the rate min_{c≤C} E‖∑_{p=1}^P\
    \ ∇F_p(W_p^c)‖₂² ≤ O(√(Lσ² P s / C))\n\nUnder partial broadcasting (i.e., Q <\
    \ P - 1) and set a constant learning rate η = 1/(C L G(P - Q)), where C is the\
    \ total number of iterations. Then we have\n\nmin_{c≤C} E[‖∑_{p=1}^P ∇F_p(W_p^c)‖₂²]\
    \ ≤ O( L G(P - Q) + P(s G + σ²)/(C G(P - Q)) ).\n\nHence, the algorithm converges\
    \ to a O(L G(P - Q)) neighbourhood if C → ∞.\n\n## Convergence Guarantee\n\n-\
    \ Take-home message:\n  - Under full broadcasting, given a properly-chosen learning\
    \ rate, all local worker parameters $W_p^c$ eventually converge to stationary\
    \ points (i.e. local minima) of the objective function, despite the fact that\
    \ SV transmission can be delayed by up to $s$ iterations.\n  - Under partial broadcasting,\
    \ the algorithm converges to a $O(LG(P - Q))$ neighbourhood if $C \\to \\infty$.\n\
    \n## Parameter Storage and Communication Paradigms\n\n### Centralized Storage\n\
    \n### Decentralized Storage\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_293_0.png)\n\
    \n- **Centralized:** send parameter $W$ itself from server to worker\n  - Advantage:\
    \ allows compact comms topology, e.g. bipartite\n- **Decentralized:** always send\
    \ changes $\\Delta W$ between workers\n  - Advantage: more robust, homogeneous\
    \ code, low communication (?)\n\n## Topologies: Master-Slave versus P2P?\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_294_0.png)\n\
    \n![](img/cb490ed30bca4eda5fbba81c52a2c173_294_1.png)\n\n### Master-slave\n\n\
    - Used with **centralized storage** paradigm\n- **Disadvantage:** need to code/manage\
    \ clients and servers separately\n- **Advantage:** bipartite topology is comms-efficient\n\
    - Popular for Parameter Servers: Yahoo LDA, Google DistBelief, Petuum PS, Project\
    \ Adam, Li&Smola PS, ...\n\n### P2P\n\n- Used with **decentralized storage**\n\
    - **Disadvantage (?)**: high comms volume for large # of workers\n- **Advantage:**\
    \ same code for all workers; no single point of failure, high elasticity to resource\
    \ adjustment\n- Less well-explored due to perception of high communication overhead?\n\
    \n## Hybrid Updates: PS + SFB\n\n- Hybrid communications:\n  Parameter Server\
    \ +\n  Sufficient Factor\n  Broadcasting\n  - Parameter Server: Master-Slave topology\n\
    \  - Sufficient factor broadcasting: P2P topology\n- For problems with a mix of\
    \ large and small matrices,\n  - Send small matrices via PS\n  - Send large matrices\
    \ via SFB\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_295_0.png)\n\n## Hybrid\
    \ Communication\n\n- Idea\n  - Sync FC layers using SFB\n  - Sync Conv layer using\
    \ PS\n- Effectiveness\n  - It directly reduces the size of messages in many situations\n\
    - Is SFB always optimal?\n  - No, its communication load increases quadratically\n\
    \  - The right strategy: choose PS whenever it results in less communication\n\
    \n![](img/cb490ed30bca4eda5fbba81c52a2c173_298_0.png)\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_300_0.png)\n\
    \n## Hybrid Communication\n\n- How to choose? Where is the threshold?\n- Determine\
    \ the best strategy depending on\n  - Layer type: CONV or FC?\n  - Layer size\n\
    \  - Batch size\n  - # of Cluster nodes\n\n| Method | Server | Worker | Server\
    \ & Worker |\n|---|---|---|---|\n| PS | $2P_1 MN / P_2$ | $2MN$ | $2MN(P_1 + P_2\
    \ - 2)/P_2$ |\n| SFB | N/A | $2K(P_1 - 1)(M + N)$ | N/A |\n| Adam (max) | $P_1\
    \ MN + P_1 K(M + N)$ | $K(M + N) + MN$ | $(P_1 - 1)(MN + KM + KN)$ |\n\nTable\
    \ 1: Estimated communication cost of PS, SFB and Adam for synchronizing the parameters\
    \ of a M × N FC layer on a cluster with P₁ workers and P₂ servers, when batchsize\
    \ is K.\n"
  mdcn: "\n## GPU 上的参数服务器\n\n问题比上述描述的更严重\n\n- 我们仅使用 8 个节点（这很小）。那 32、128 甚至 256 呢？\n\
    - 我们尚未考虑其他问题（这些也可能很麻烦），例如\n  - DRAM 与 GPU 之间的内存拷贝将产生不可忽略的开销\n  - 以太网可能与其他任务共享，即可用带宽更少。\n\
    \  - 在 GPU 上突发通信经常发生（稍后会解释）。\n\n## 缓解通信瓶颈\n\n- 一个简单的事实：\n  - 通信时间可以减少，但无法消除（当然）\n\
    - 因此，解决通信瓶颈的**可能**思路\n  - 通过将其与计算时间重叠来隐藏通信时间\n  - 减少需要通信的消息大小\n\n## WFBP：无等待反向传播\n\
    \n- 思路：利用并发重叠计算和通信\n- 通信开销被隐藏在计算之下\n- 结果：单位时间内完成更多计算\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_278_0.png)\n\
    \n## WFBP：分布式无等待反向传播\n\n- 观察：为什么 DWBP 会有效\n  - 现代 CNN 的更多统计数据\n\n### 现代 CNN 的参数/FLOP\
    \ 分布\n\n| 参数 | CONV 层（#/％） | FC 层（#/％） |\n|---|---|---|\n| AlexNet | 2.3M / 3.75\
    \ | 59M / 96.25 |\n| VGG-16 | 7.15M / 5.58 | 121.1M / 94.42 |\n| FLOPs | CONV\
    \ 层（#/％） | FC 层（#/％） |\n| AlexNet | 1,352M / 92.0 | 117M / 8.0 |\n| VGG-16 | 10,937M\
    \ / 91.3 | 121.1M / 8.7 |\n\n- 90% 的计算发生在底层\n- 90% 的通信发生在顶层\n- WFBP 重叠 90% 和 90%\n\
    \n## 引入充分因子广播\n\n- 矩阵参数化模型\n\n### 多类逻辑回归\n\n特征维。\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_283_0.png)\n\
    \n类别数\n\n### 距离度量学习\n\n特征维。\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_283_1.png)\n\
    \n潜在维。\n\n### 稀疏编码\n\n特征维。\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_283_2.png)\n\
    \n字典大小\n\n### 神经网络\n\n第 l-1 层中的神经元数\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_283_3.png)\n\
    \n第 l 层中的神经元数\n\n## 充分因子广播：P2P 拓扑 + SF 更新\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_286_0.png)\n\
    \n## 收敛保证\n\n- 假设\n  - 桥接模型\n    - 具有陈旧参数 s 的陈旧同步并行（SSP）\n    - 当 s = 0 时，批量同步并行是\
    \ SSP 的特例\n  - 通信方法\n    - 部分广播（PB）：向 Q 台（Q < P − 1）机器的子集发送消息\n    - 当 Q = P −\
    \ 1 时，全广播是 PB 的特例\n  - 假设 1. (1) 对所有 j，f_j 是连续可微的且 F 有下界；(2) ∇F, ∇F_p 分别以常数 L_F\
    \ 和 L_p 为 Lipschitz 连续，且令 L = Σ_{p=1}^P L_p；(3) 存在 G, σ² 使得对所有 p 和 c，我们有（几乎必然）||U_p(W_p^c,\
    \ I_p^c)|| ≤ Gη 且 \U0001D53C|| |S_p| Σ_{j∈I_p} ∇f_j(W) − ∇F_p(W) ||_2² ≤ σ²。\n\
    \n## 收敛保证\n\n### 结果\n\n定理 1. 设假设 1 成立，且 {W_p^c}, p = 1, ..., P, {W^c} 分别为局部序列和辅助序列。\n\
    \n在全广播（即 Q = P - 1）下并设学习率 η := η_c = O(√(1/(Lσ² P s_c)))，我们有\n\n- lim inf_{c→∞}\
    \ E‖∇F(W^c)‖ = 0，因此存在 ∇F(W^c) 的子序列几乎必然消失；\n- lim_{c→∞} max_p ‖W^c - W_p^c‖ = 0，即所有局部序列与辅助序列之间的最大不一致收敛到\
    \ 0（几乎必然）；\n- 存在 {W_p^c} 和 {W^c} 的公共子序列几乎必然收敛到 F 的平稳点，收敛速率为 min_{c≤C} E‖∑_{p=1}^P\
    \ ∇F_p(W_p^c)‖₂² ≤ O(√(Lσ² P s / C))\n\n在部分广播（即 Q < P - 1）下并设常数学习率 η = 1/(C L\
    \ G(P - Q))，其中 C 为总迭代次数。则我们有\n\nmin_{c≤C} E[‖∑_{p=1}^P ∇F_p(W_p^c)‖₂²] ≤ O( L\
    \ G(P - Q) + P(s G + σ²)/(C G(P - Q)) ).\n\n因此，当 C → ∞ 时，算法收敛到 O(L G(P - Q)) 邻域。\n\
    \n## 收敛保证\n\n- 核心要点：\n  - 在全广播下，给定适当选择的学习率，所有局部工作参数 $W_p^c$ 最终会收敛到目标函数的平稳点（即局部极小值），尽管\
    \ SV 传输可能延迟多达 $s$ 次迭代。\n  - 在部分广播下，若 $C \\to \\infty$，算法收敛到 $O(LG(P - Q))$ 邻域。\n\
    \n## 参数存储和通信范式\n\n### 集中式存储\n\n### 分布式存储\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_293_0.png)\n\
    \n- **集中式：** 从服务器向工作节点发送参数 $W$ 本身\n  - 优点：允许紧凑的通信拓扑，例如二分图\n- **分布式：** 总是在工作节点之间发送变化\
    \ $\\Delta W$\n  - 优点：更健壮、代码同质、通信量低（？）\n\n## 拓扑：主从 vs P2P？\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_294_0.png)\n\
    \n![](img/cb490ed30bca4eda5fbba81c52a2c173_294_1.png)\n\n### 主从\n\n- 与 **集中式存储**\
    \ 范式一起使用\n- **缺点：** 需要分别编码/管理客户端和服务器\n- **优点：** 二分拓扑通信高效\n- 参数服务器的流行实现：Yahoo LDA,\
    \ Google DistBelief, Petuum PS, Project Adam, Li&Smola PS, ...\n\n### P2P\n\n\
    - 与 **分布式存储** 一起使用\n- **缺点（？）：** 工作节点数量大时通信量高\n- **优点：** 所有工作节点使用相同代码；无单点故障，对资源调整具有高弹性\n\
    - 由于对高通信开销的认知而研究较少？\n\n## 混合更新：PS + SFB\n\n- 混合通信：\n  参数服务器 +\n  充分因子\n  广播\n\
    \  - 参数服务器：主从拓扑\n  - 充分因子广播：P2P 拓扑\n- 对于包含大矩阵和小矩阵混合的问题，\n  - 通过 PS 发送小矩阵\n  -\
    \ 通过 SFB 发送大矩阵\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_295_0.png)\n\n## 混合通信\n\
    \n- 思路\n  - 使用 SFB 同步 FC 层\n  - 使用 PS 同步 Conv 层\n- 有效性\n  - 它在许多情况下直接减少了消息的大小\n\
    - SFB 总是最优的吗？\n  - 不，它的通信负载呈二次增长\n  - 正确策略：只要 PS 导致通信更少就选择 PS\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_298_0.png)\n\
    \n![](img/cb490ed30bca4eda5fbba81c52a2c173_300_0.png)\n\n## 混合通信\n\n- 如何选择？阈值在哪里？\n\
    - 根据以下因素确定最佳策略\n  - 层类型：CONV 或 FC？\n  - 层大小\n  - 批大小\n  - 集群节点数\n\n| 方法 | 服务器\
    \ | 工作节点 | 服务器与工作节点 |\n|---|---|---|---|\n| PS | $2P_1 MN / P_2$ | $2MN$ | $2MN(P_1\
    \ + P_2 - 2)/P_2$ |\n| SFB | N/A | $2K(P_1 - 1)(M + N)$ | N/A |\n| Adam (max)\
    \ | $P_1 MN + P_1 K(M + N)$ | $K(M + N) + MN$ | $(P_1 - 1)(MN + KM + KN)$ |\n\n\
    表 1：估计在具有 P₁ 个工作节点和 P₂ 个服务器的集群上同步 M × N FC 层参数时，PS、SFB 和 Adam 的通信开销，其中批大小为 K。\n"
