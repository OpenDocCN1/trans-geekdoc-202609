    \nClass probabilities\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_324_0.png)\n\
    \nTraining images\n\n- For each iteration (mini-batch)\n- A forward pass\n- Then\
    \ a backward pass\n- Each time only data of two layers are used\n\n## Memory Management\
    \ using CPU Memory\n\nClass probabilities\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_325_0.png)\n\
    \nTraining images\n\n- For each iteration (mini-batch)\n  - A forward pass\n \
    \ - Then a backward pass\n\n- Each time only data of two layers are used\n\n##\
    \ Memory Management using CPU Memory\n\nClass probabilities\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_327_0.png)\n\
    \nTraining images\n\n- For each iteration (mini-batch)\n  - A forward pass\n \
    \ - Then a backward pass\n- Each time only data of two layers are used\n\nThe\
    \ idea\n\n- Use GPU mem as a cache to keep actively used data\n- Store the remaining\
    \ in CPU memory\n\n## Memory Management using CPU Memory\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_328_0.png)\n\
    \n## Memory Management using CPU Memory\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_329_0.png)\n\
    \nCui et al., 2016\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_330_0.png)\n\n\
    ## Memory Management using CPU Memory\n\n- Controller\n  - The fact: the memory\
    \ access order is deterministic and can be exactly known by a single forward and\
    \ backward pass\n  - Idea:\n    - Obtain the memory access order by a virtual\
    \ iteration\n    - Pre-fetch memory blocks from CPU to GPU\n    - Overlap memory\
    \ swap overhead with computation\n\n## Throughput vs. memory budget\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_332_0.png)\n\
    \nAll data in GPU memory\n\nOnly buffer pool in GPU memory\nTwice the peak size\
