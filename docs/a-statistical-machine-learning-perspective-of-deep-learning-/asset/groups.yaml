    \n## I: Restricted Boltzmann Machines\n- RBM is a Markov random field represented\
    \ with a bi-partite graph\n- All nodes in one layer/part of the graph are connected\
    \ to all in the other; no inter-layer connections\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_35_0.png)\n\
    Joint distribution\nP(v, h) = 1/Z exp{ Σ_{i,j} w_{ij} v_i h_i + Σ_i b_i v_i +\
    \ Σ_j c_j h_j }\n\n## I: Restricted Boltzmann Machines\nGradient of the log-likelihood\
    \ w.r.t. the parameters (alternative form):\n$\\frac{\\partial}{\\partial w_{ij}}\
    \ \\log L(v) = \\mathbb{E}_{P(h|v)} \\left[ \\frac{\\partial}{\\partial w_{ij}}\
    \ P(v,h) \\right] - \\mathbb{E}_{P(v,h)} \\left[ \\frac{\\partial}{\\partial w_{ij}}\
    \ P(v,h) \\right]$\n- Both expectations can be approximated via sampling\n- Sampling\
    \ from the posterior is exact (RBM factorizes over h given v)\n- Sampling from\
    \ the joint is done via MCMC (e.g., Gibbs sampling)\n- In the neural networks\
    \ literature:\n  - computing the first term is called the clamped / wake / positive\
    \ phase (the network is “awake” since it conditions on the visible variables)\n\
    \  - Computing the second term is called the unclamped / sleep / free / negative\
    \ phase (the network is “asleep” since it samples the visible variables from the\
    \ joint; metaphorically, it is \"dreaming\" the visible inputs)\n\n## II: Sigmoid\
