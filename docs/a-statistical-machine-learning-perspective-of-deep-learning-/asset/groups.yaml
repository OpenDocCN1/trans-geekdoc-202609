    \ points, and Monte Carlo approximations\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_81_0.png)\n\
    \n## Gaussian Process and Deep Kernel Learning\n\n- By adding GP as a layer to\
    \ a deep neural net, we can think of it as adding an infinite hidden layer with\
    \ a particular prior on the weights\n- Deep kernel learning [Wilson et al., 2016]\n\
    \  - Combines the inductive biases of deep models with the non-parametric flexibility\
    \ of Gaussian processes\n  - GPs add powerful regularization to the network\n\
    \  - Additionally, they provide predictive uncertainty estimates\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_82_0.png)\n\
    \n## Deep kernel learning on sequential data\n\nThe answer is YES!\n\nBy adding\
    \ a GP layer to a recurrent network, we effectively correlate samples across time\
    \ and get predictions along with well calibrated uncertainty estimates.\n\nTo\
    \ train such a model using stochastic techniques however requires some additional\
    \ care (see our paper).\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_84_0.png)\n\
    \n## Deep kernel learning on sequential data\n\nLead vehicle prediction: LSTM\
    \ vs GP-LSTM\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_86_0.png)\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_87_0.png)\n\
    \n## Conclusion\n\n- DL & GM: the fields are similar in the beginning (structure,\
    \ energy, etc.), and then diverge to their own signature pipelines\n- DL: most\
    \ effort is directed to comparing different architectures and their components\
    \ (models are driven by evaluating empirical performance on downstream tasks)\n\
    \  - DL models are good at learning robust hierarchical representations from the\
    \ data and suitable for simple reasoning (call it “low-level cognition”)\n- GM:\
    \ the effort is directed towards improving inference accuracy and convergence\
    \ speed\n  - GMs are best for provably correct inference and suitable for high-level\
    \ complex reasoning tasks (call it “high-level cognition”)\n- Convergence of both\
    \ fields is very promising!\n  - Next part: a unified view of deep generative\
    \ models in the GM interpretation\n\n## Part-II\n\nA Unified Framework of Deep\
    \ Generative Models\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_89_0.png)\n\n\
    ## Plan\n\n- Statistical And Algorithmic Foundation and Insight of Deep Learning\n\
    - A Unified Framework of Deep Generative Models\n- Computational Mechanisms: Programming\
    \ Platforms and Distributed Deep Learning Architectures\n\n## Outline\n\n- Overview\
    \ of advances in deep generative models\n- Theoretical Basis of deep generative\
    \ models\n  - Wake sleep algorithm\n  - Variational autoencoders\n  - Generative\
