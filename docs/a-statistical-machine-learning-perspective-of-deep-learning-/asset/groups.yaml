    ## 生成对抗网络 (GANs)\n- 学习\n  - 训练 $G$ 以欺骗判别器\n  - 当 $D$ 过强时，原始损失会遭受梯度消失\n  - 实践中改用以下公式\n\
    \    $\\max_G \\mathcal{L}_G = \\mathbb{E}_{\\boldsymbol{x}\\sim G(\\boldsymbol{z}),\\\
    boldsymbol{z}\\sim p(\\boldsymbol{z})} [\\log D(\\boldsymbol{x})]$\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_121_0.png)\n\
