    # AAVAE: adaptive data selection


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_168_0.png)


    max_{θ,η} L^{aavae}_{θ,η} = E_{p_{θ0}(x)} [ E_{q_η(z|x,y) q_φ^r(y|x)} [log p_θ(x|z,y)]
    − KL(q_η(z|x,y) q_φ^r(y|x) || p(z|y) p(y)) ]


    +   - An effective data selection mechanism:

    +     - Both generated samples and real examples are weighted by

    +       $q_φ^r(y = 0|x) = q_φ(y = 1|x)$

    +     - Only samples that resembles real data and fool the discriminator will
    be used for training

    +     - A real example receiving large weight $q_φ^r(y|x)$

    +       - ⇒ Easily recognized by the discriminator as real

    +       - ⇒ Hard to be simulated from the generator

    +       - ⇒ Hard examples get larger weights'
