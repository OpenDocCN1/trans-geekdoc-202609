  - '[PAGE 79]


    # Bayesian learning of NNs


    +   - Variational inference (in a nutshell):

    +     $$\min_q F(D, \boldsymbol{\theta}) = \mathrm{KL}(q(\boldsymbol{\theta})
    \| p(\boldsymbol{\theta}|D)) - \mathbb{E}_{q(\boldsymbol{\theta})}[\log p(D|\boldsymbol{\theta})]$$

    +     $$\min_q F(D, \boldsymbol{\theta}) = \mathrm{KL}(q(\boldsymbol{\theta})
    \| p(\boldsymbol{\theta}|D)) - \sum_i \log p(D|\boldsymbol{\theta}_i)$$

    +     where $\boldsymbol{\theta}_i \sim q(\boldsymbol{\theta})$; KL term can be
    approximated similarly

    +   - We can define $q(\boldsymbol{\theta})$ as a diagonal Gaussian or full-covariance
    Gaussian

    +   - Alternatively, $q(\boldsymbol{\theta})$ can be defined implicitly, e.g.
    via dropout [Gal & Ghahramani, 2016]

    +     $$\boldsymbol{\theta} = \boldsymbol{M} \cdot \mathrm{diag}(\boldsymbol{z}),$$

    +     $$\boldsymbol{z} \sim \mathrm{Bernoulli}(p)$$

    +   - Dropping out neurons is equivalent to zeroing out columns of the parameter
    matrices (i.e., weights)

    +   - $z_i = 0$ corresponds to $i$-th column of $\boldsymbol{M}$ being dropped
    out

    +     $\Rightarrow$ the procedure is equivalent to dropout of unit $i$ [Hinton
    et al., 2012]

    +   - Variational parameters are $\{\boldsymbol{M}, \boldsymbol{p}\}$


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_79_0.png)


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_79_1.png)'
  - '[PAGE 80]


    # “Infinitely Wide” Deep Models


    +   - We have seen that an “infinitely deep” network can be explained by a proper
    GM, How about an “infinitely wide” one?

    +   - Consider a neural network with a Gaussian prior on its weights an infinitely
    many hidden neurons in the intermediate layer.

    +   - Turns out, if we have a certain Gaussian prior on the weights of such infinite
    network, it will be equivalent to a Gaussian process [Neal 1996].

    +   - Gaussian process (GP) is a distribution over functions:

    +     $$m(\mathbf{x}) = \mathbb{E}[f(\mathbf{x})],$$

    +     $$k(\mathbf{x}, \mathbf{x}'') = \mathbb{E}[(f(\mathbf{x}) - m(\mathbf{x}))(f(\mathbf{x}'')
    - m(\mathbf{x}''))],$$

    +     $$f(\mathbf{x}) \sim \mathcal{GP}(m(\mathbf{x}), k(\mathbf{x}, \mathbf{x}'')).$$

    +   - When used for prediction, GPs account for correlations between the data
    points and can output well-calibrated predictive uncertainty estimates.


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_80_0.png)


