    \ modules\n  - Layer-wise parallelization\n- No obvious utility in evaluating\
    \ DL inference algorithms\n#### Utility of the Loss Function\n- Global loss? Well\
    \ it is complex and non-convex...\n\nImages from Distill.pub\n\n## Graphical models\
    \ vs. Deep nets\n### Graphical models\n#### Utility of the graph\n- A vehicle\
    \ for synthesizing a global loss function from local structure\n  - potential\
    \ function, feature function, etc.\n- A vehicle for designing sound and efficient\
    \ inference algorithms\n  - Sum-product, mean-field, etc.\n- A vehicle to inspire\
