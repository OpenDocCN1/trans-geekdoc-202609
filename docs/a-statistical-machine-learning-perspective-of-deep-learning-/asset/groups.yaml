  - '[PAGE 87]


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_87_0.png)


    # Conclusion


    +   - DL & GM: the fields are similar in the beginning (structure, energy, etc.),
    and then diverge to their own signature pipelines

    +   - DL: most effort is directed to comparing different architectures and their
    components (models are driven by evaluating empirical performance on a downstream
    tasks)

    +     - DL models are good at learning robust hierarchical representations from
    the data and suitable for simple reasoning (call it “low-level cognition”)

    +   - GM: the effort is directed towards improving inference accuracy and convergence
    speed

    +     - GMs are best for provably correct inference and suitable for high-level
    complex reasoning tasks (call it “high-level cognition”)

    +   - Convergence of both fields is very promising!

    +     - Next part: a unified view of deep generative models in the GM interpretation'
