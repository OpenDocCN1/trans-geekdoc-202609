    (CPU memory)\n\nSmall GPU memory\nExpensive to copy between GPU/CPU mem\n\nGPU\
    \ device\n\nGPU cores\n\nGPU\nmemory\n(a few GB)\n\n## Numbers\n\nMax available\
    \ GPU memory: 12G\n\nTraining batch\n\nparameters\n\nGPU memory\n\nIntermediate\
    \ states\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_318_0.png)\n\n| Network |\
