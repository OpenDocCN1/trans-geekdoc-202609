    \ step of $p_{\\theta}(x|y)$ at point $(\\theta=\\theta_0,\\phi=\\phi_0)$, let\n\
    \  - $p(y)$: a uniform distribution\n  - $p_{\\theta=\\theta_0}(x)=\\mathbb{E}_{p(y)}[p_{\\\
    theta=\\theta_0}(x|y)]$: prior distribution over $x$\n  - $q^r(x|y)\\propto q^r_{\\\
    phi=\\phi_0}(y|x)p_{\\theta=\\theta_0}(x)$: posterior distribution over $x$\n\n\
    - **Lemma 1:** The updates of $\\theta$ at $\\theta_0$ have\n\n$$\n\\left.\\nabla_{\\\
    theta}\\left[-\\mathbb{E}_{p_{\\theta}(x|y)p(y)}\\left[\\log q^r_{\\phi=\\phi_0}(y|x)\\\
