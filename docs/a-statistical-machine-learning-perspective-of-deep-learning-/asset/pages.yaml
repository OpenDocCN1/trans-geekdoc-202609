- pgno: 7
  md: "# Fundamental questions of probabilistic modeling\n\n+   - **Representation:**\
    \ what is the joint probability distr. on multiple variables?\n+   \n+     $P(X_1,\
    \ X_2, X_3, ..., X_d)$\n+   \n+     - How many state configurations are there?\n\
    +     - Do they all need to be represented?\n+     - Can we incorporate any domain-specific\
    \ insights into the representation?\n+   - **Learning:** where do we get the probabilities\
    \ from?\n+     - Maximum likelihood estimation? How much data do we need?\n+ \
    \    - Are there any other established principles?\n+   - **Inference:** if not\
    \ all variables are observable, how to compute the conditional distribution of\
    \ latent variables given evidence?\n+     - Computing $P(H|A)$ would require summing\
    \ over $2^6$ configurations of the unobserved variables\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_7_0.png)"
