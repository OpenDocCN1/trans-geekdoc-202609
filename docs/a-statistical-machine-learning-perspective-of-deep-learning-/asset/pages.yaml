- pgno: 29
  md: '![](img/cb490ed30bca4eda5fbba81c52a2c173_29_0.png)


    # Graphical models vs. Deep nets


    # Graphical models


    # Deep neural networks


    +   - Representation for encoding meaningful knowledge and the associated uncertainty
    in a graphical form

    +   - Learning and inference are based on a rich toolbox of well-studied (structure-dependent)
    techniques (e.g., EM, message passing, VI, MCMC, etc.)

    +   - Graphs represent models


    +   - Learn representations that facilitate computation and performance on the
    end-metric (intermediate representations are not guaranteed to be meaningful)

    +   - Learning is predominantly based on the gradient descent method (aka backpropagation);
    Inference is often trivial and done via a “forward pass”

    +   - Graphs represent computation'
