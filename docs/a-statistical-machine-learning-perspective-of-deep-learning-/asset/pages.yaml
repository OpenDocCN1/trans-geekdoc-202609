  md: '# Contextual Explanation Networks (CENs)


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_70_0.png)


    +   - **General idea:** Use deep neural nets to **generate parameters** for graphical
    models applicable in a given context (e.g., for a given patient).

    +   - Produced GMs are used to make the final prediction ⇒ 100% fidelity and consistency.

    +   - GMs are built on top of semantically meaningful variables (not deep embeddings!)
    and can be used as **explanations** for each prediction.'
  merge: -1
