- pgno: 269
  md: '# Parameter Server on GPUs


    +   - Directly applying parameter server for GPU-based distributed deep learning
    will underperform (as will show later).

    +     - GPU is too fast

    +     - Ethernet bandwidth is limited, and has latency

    +   - For example

    +     - AlexNet: 61.5M float parameters, 0.25s/iteration on Geforce Titan X (batchsize
    = 256)

    +       - Gradient generation rate: 240M float/(s*GPU)

    +     - Parallelize it over 8 machines each w/ one GPU using PS.

    +     - To ensure the computation not blocked on GPU (i.e. linear speed-up with
    additional nodes)

    +       - As a worker: send 240M floats/s and pull back 240M floats/s (at least)

    +       - As a server: receive 240M * 8 floats/s and send back 240M * 8/s (at
    least)'
  merge: -1
  img_proc: true
