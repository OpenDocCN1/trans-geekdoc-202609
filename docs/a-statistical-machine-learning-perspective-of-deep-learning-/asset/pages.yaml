  md: '# Generative Adversarial Nets (GANs)


    +   - Learning

    +     - Train $G$ to fool the discriminator

    +     - The original loss suffers from vanishing gradients when $D$ is too strong

    +     - Instead use the following in practice

    +       $\max_G \mathcal{L}_G = \mathbb{E}_{\boldsymbol{x}\sim G(\boldsymbol{z}),\boldsymbol{z}\sim
    p(\boldsymbol{z})} [\log D(\boldsymbol{x})]$


