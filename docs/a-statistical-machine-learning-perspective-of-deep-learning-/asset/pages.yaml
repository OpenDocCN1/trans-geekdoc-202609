- pgno: 131
  md: '# ADA: new formulation


    +   - To reveal the connections to conventional variational approaches, let’s
    rewrite the objectives in a format that resembles variational EM

    +   - Implicit distribution over $\boldsymbol{x} \sim p_\theta(\boldsymbol{x}|y)$

    +     $\boldsymbol{x} = G_\theta(\boldsymbol{z}), \ \boldsymbol{z} \sim p(\boldsymbol{z}|y)$

    +   - Discriminator distribution $q_\phi(y|\boldsymbol{x})$

    +     $q_\phi^r(y|\boldsymbol{x}) = q_\phi(1 - y|\boldsymbol{x})$

    +   - Rewrite the objective in the new form (up to constant scale factor)

    +     $\max_\phi \mathcal{L}_\phi = \mathbb{E}_{p_\theta(\boldsymbol{x}|y)p(y)}[\log
    q_\phi(y|\boldsymbol{x})]$

    +     $\max_\theta \mathcal{L}_\theta = \mathbb{E}_{p_\theta(\boldsymbol{x}|y)p(y)}[\log
    q_\phi^r(y|\boldsymbol{x})]$

    +     - $\boldsymbol{z}$ is encapsulated in the implicit distribution $p_\theta(\boldsymbol{x}|y)$

    +       $\max_\phi \mathcal{L}_\phi = \mathbb{E}_{p_\theta(\boldsymbol{x}|y=0)p(y=0)}[\log
    q_\phi(y=0|\boldsymbol{x})] + \mathbb{E}_{p_\theta(\boldsymbol{x}|y=1)p(y=1)}[\log
    q_\phi(y=1|\boldsymbol{x})]$

    +       $= \frac{1}{2}\mathbb{E}_{\boldsymbol{x}=G_\theta(\boldsymbol{z}),\boldsymbol{z}\sim
    p(\boldsymbol{z}|y=0)}[\log(1 - D_\phi(\boldsymbol{x}))] + \frac{1}{2}\mathbb{E}_{\boldsymbol{x}=G_\theta(\boldsymbol{z}),\boldsymbol{z}\sim
    p(\boldsymbol{z}|y=1)}[\log D_\phi(\boldsymbol{x})]$

    +     - (Ignore the constant scale factor 1/2)'
