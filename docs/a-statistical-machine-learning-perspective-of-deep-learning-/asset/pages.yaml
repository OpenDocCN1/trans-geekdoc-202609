- pgno: 109
  md: "![](img/cb490ed30bca4eda5fbba81c52a2c173_109_0.png)\n\n# Wake Sleep Algorithm\n\
    \n+   - [Hinton et al., Science 1995]\n+   - Train a separate inference model\
    \ along with the generative model\n+     - Generally applicable to a wide range\
    \ of generative models, e.g., Helmholtz machines\n+   - Consider a generative\
    \ model $p_\\theta(x|z)$ and prior $p(z)$\n+     - Joint distribution $p_\\theta(x,z)\
    \ = p_\\theta(x|z)p(z)$\n+     - E.g., multi-layer belief nets\n+   - Inference\
    \ model $q_\\phi(z|x)$\n+   - Maximize data log-likelihood with two steps of loss\
    \ relaxation:\n+     - Maximize the variational lower bound of log-likelihood,\
    \ or equivalently, minimize the free energy\n+   \n+       $F(\\theta, \\phi;\
    \ x) = -\\log p(x) + KL(q_\\phi(z|x) \\| p_\\theta(z|x))$\n+   - Minimize a different\
    \ objective (reversed KLD) wrt $\\phi$ to ease the optimization\n+     - Disconnect\
    \ to the original variational lower bound loss\n+   \n+       $F'(\\theta, \\\
    phi; x) = -\\log p(x) + KL(p_\\theta(z|x) \\| q_\\phi(z|x))$"
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Wake Sleep Algorithm


    +   - Free energy:

    +     $$F(\boldsymbol{\theta}, \boldsymbol{\phi}; \boldsymbol{x}) = -\log p(\boldsymbol{x})
    + KL(q_{\phi}(\boldsymbol{z}|\boldsymbol{x}) \|\| p_{\theta}(\boldsymbol{z}|\boldsymbol{x}))$$

    +   - Minimize the free energy wrt. $\boldsymbol{\theta}$ of $p_{\theta}$ $\rightarrow$
    *wake phase*

    +     $$\max_{\boldsymbol{\theta}} \mathbb{E}_{q_{\phi}(\boldsymbol{z}|\boldsymbol{x})}
    [\log p_{\boldsymbol{\theta}}(\boldsymbol{x}, \boldsymbol{z})]$$

    +     - Get samples from $q_{\phi}(z|x)$ through inference on hidden variables

    +     - Use the samples as targets for updating the generative model $p_{\theta}(\boldsymbol{z}|\boldsymbol{x})$

    +     - Correspond to the variational M step


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_110_0.png)'
  merge: -1
  img_proc: true
