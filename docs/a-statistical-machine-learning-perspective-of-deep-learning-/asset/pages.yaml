- pgno: 159
  md: '![](img/cb490ed30bca4eda5fbba81c52a2c173_159_0.png)


    # VAEs vs. Wake-sleep


    +   - Wake sleep algorithm

    +     Wake : $\max_{\theta} \mathbb{E}_{q_{\lambda}(h|x)p_{data}(x)} [\log p_{\theta}(x|h)]$

    +     Sleep : $\max_{\lambda} \mathbb{E}_{p_{\theta}(x|h)p(h)} [\log q_{\lambda}(h|x)]$

    +   - Let $h$ be $z$, and $\lambda$ be $\eta$

    +     $\Rightarrow \max_{\theta} \mathbb{E}_{q_{\eta}(z|x)p_{data}(x)} [\log p_{\theta}(x|z)]$,
    recovers VAE objective of optimizing $\theta$

    +   - VAEs extend wake phase by also learning the inference model ($\eta$)

    +     $\max_{\theta,\eta} \mathcal{L}^{vae}_{\theta,\eta} = \mathbb{E}_{q_{\eta}(z|x)p_{data}(x)}
    [\log p_{\theta}(x|z)] - \mathbb{E}_{p_{data}(x)} [\text{KL}(q_{\eta}(z|x)||p(z))]$

    +     - Minimize the KLD in the original variational free energy wrt. $\eta$

    +     - Stick to minimizing the wake-phase KLD wrt. both $\theta$ and $\eta$

    +     - Do not involve sleep-phase objective

    +     - Recall: sleep phase minimizes the *reverse* KLD in the variational free
    energy'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# GANs vs. Wake-sleep


    +   - Wake sleep algorithm

    +     Wake : max_θ E_{q_λ(h|x)p_data(x)} [log p_θ(x|h)]

    +     Sleep : max_λ E_{p_θ(x|h)p(h)} [log q_λ(h|x)]

    +   - Let h be y, and λ be φ

    +     ⇒ max_φ E_{p_θ(x|y)p(y)} [log q_φ(y|x)], recovers GAN objective of optimizing
    φ

    +   - GANs extend sleep phase by also learning the generative model (θ)

    +     - Directly extending sleep phase: max_φ L_φ = E_{p_θ(x|y)p(y)} [log q_φ(y|x)]

    +     - GANs: max_θ L_θ = E_{p_θ(x|y)p(y)} [log q_φ^r(y|x)]

    +     - The only difference is replacing q_φ with q_φ^r

    +     - This is where adversarial mechanism come about !

    +     - GANs stick to minimizing the sleep-phase KLD

    +     - Do not involve wake-phase objective'
