- pgno: 148
  md: '# Variant of GAN: InfoGAN


    +   - GANs don’t offer the functionality of inferring code **z** given data

    +   - InfoGAN [Chen et al., 2016]

    +   - Introduce inference model $Q_{\eta}(\mathbf{z}|\mathbf{x})$ with parameters
    $\boldsymbol{\eta}$

    +   - Augment the objectives of GANs by additionally inferring **z**


    $\max_D \mathcal{L}_D = \mathbb{E}_{\mathbf{x}\sim p_{data}(\mathbf{x})}[\log
    D(\mathbf{x})] + \mathbb{E}_{\mathbf{x}\sim G(\mathbf{z}),\mathbf{z}\sim p(\mathbf{z})}[\log(1
    - D(\mathbf{x}))],$

    $\max_{G,Q} \mathcal{L}_{G,Q} = \mathbb{E}_{\mathbf{x}\sim G(\mathbf{z}),\mathbf{z}\sim
    p(\mathbf{z})}[\log D(\mathbf{x}) + \log Q(\mathbf{z}|\mathbf{x})].$


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_148_0.png)


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_148_1.png)


