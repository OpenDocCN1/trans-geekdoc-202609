- pgno: 319
  md: '# Why Memory is an Issue?


    +   - Intermediate states occupy 90% of the GPU memory

    +   - Intermediate states is proportional to input batch size


    +   - However,

    +     - If you want high throughput, you must have large batch size (because of
    the SIMD nature of GPUs)

    +     - If you have large batch size, your GPU will be occupied by intermediate
    states, which thereby limits your model size/depth'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# Saving Memory: A Simple Trick


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_320_0.png)


    +   - Basic idea

    +     - The fact: intermediate states are proportional to the batch size K

    +     - Idea: achieve large batch size by accumulating gradients generated by
    smaller batch sizes which are affordable in the GPU memory

    +   - Solution:

    +     - Parition K into M parts, every part has K/M samples

    +     - For iter = 1:M

    +       - Train with mini-batchsize K/M

    +       - Accumulate the gradient on GPU w/o updating model parameters

    +     - Update the model parameter all together when all M parts finished

    +   - Drawbacks

    +     - What if the GPU still cannot afford the intermediate states even if K=1?

    +     - Small batch size usually leads to insufficient use of GPUs’ computational
    capability'
  merge: -1
  img_proc: true
