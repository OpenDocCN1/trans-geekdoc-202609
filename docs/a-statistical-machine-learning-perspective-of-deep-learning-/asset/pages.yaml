- pgno: 133
  md: '# # ADA vs. Variational EM


    # ## Variational EM


    +   - **Objectives**

    +     - $$\max_{\phi}\mathcal{L}_{\phi,\theta}=\mathbb{E}_{q_{\phi}(z|x)}[\log
    p_{\theta}(x|z)]+KL\left(q_{\phi}(z|x)\|p(z)\right)$$

    +     - $$\max_{\theta}\mathcal{L}_{\phi,\theta}=\mathbb{E}_{q_{\phi}(z|x)}[\log
    p_{\theta}(x|z)]+KL\left(q_{\phi}(z|x)\|p(z)\right)$$

    +   - Single objective for both $\theta$ and $\phi$

    +   - Extra prior regularization by $p(z)$


    # ## ADA


    +   - **Objectives**

    +     - $$\max_{\phi}\mathcal{L}_{\phi}=\mathbb{E}_{p_{\theta}(x|y)p(y)}\left[\log
    q_{\phi}(y|x)\right]$$

    +     - $$\max_{\theta}\mathcal{L}_{\theta}=\mathbb{E}_{p_{\theta}(x|y)p(y)}\left[\log
    q_{\phi}^{r}(y|x)\right]$$

    +   - Two objectives

    +   - Have global optimal state in the game theoretic view'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# ADA vs. Variational EM


    # Variational EM


    +   - Objectives

    +     max_φ L_{φ,θ} = E_{q_φ(z|x)}[log p_θ(x|z)] + KL(q_φ(z|x)||p(z))

    +     max_θ L_{φ,θ} = E_{q_φ(z|x)}[log p_θ(x|z)] + KL(q_φ(z|x)||p(z))

    +   - Single objective for both θ and φ

    +   - Extra prior regularization by p(z)

    +   - The reconstruction term: maximize the conditional log-likelihood of x with
    the generative distribution p_θ(x|z) conditioning on the latent code z inferred
    by q_φ(z|x)

    +   - p_θ(x|z) is the generative model

    +   - q_φ(z|x) is the inference model


    # ADA


    +   - Objectives

    +     max_φ L_φ = E_{p_θ(x|y)p(y)}[log q_φ(y|x)]

    +     max_θ L_θ = E_{p_θ(x|y)p(y)}[log q_φ^r(y|x)]

    +   - Two objectives

    +   - Have global optimal state in the game theoretic view

    +   - The objectives: maximize the conditional log-likelihood of y (or 1 − y)
    with the distribution q_φ(y|x) conditioning on latent feature x inferred by p_θ(x|y)

    +   - Interpret q_φ(y|x) as the generative model

    +   - Interpret p_θ(x|y) as the inference model'
  merge: -1
  img_proc: true
