- pgno: 229
  md: "# Problem #3: Unavailable to Graph Optimizations\n\n+   - Graph optimization\
    \ itself has a overhead (growing with the size of the graph)\n+   - In static\
    \ declaration, we optimize the graph only once, and apply for all input data points\
    \ – graph optimization overhead is constant, and the gain is mostly positive\n\
    +   - In dynamic declaration, if we want to incorporate these optimization, we\
    \ need to optimize for each declared graph\n+   - Therefore, linear graph optimization\
    \ overhead\n+   - As a result: the optimization overhead might cost more than\
    \ gained\n\n```\n/* (b) dynamic declaration */\nfor t = 1 → T:\n  read the tth\
    \ data batch {x_i^t}_{i=1}^K.\nfor k = 1 → K:\n  declare a data flow graph D_i^t\
    \ for x_i^t.\n  single-instance computation: D_i^t(x_i^t).\n```\n\nGraph optimization\
    \ happens here: inside the loops!"
  merge: -1
  img_proc: true
