- pgno: 105
  md: "# Recap: Variational Inference\n\n+   - Consider a generative model $p_\\theta(\\\
    boldsymbol{x}|\\boldsymbol{z})$, and prior $p(\\boldsymbol{z})$  \n+     - Joint\
    \ distribution: $p_\\theta(\\boldsymbol{x},\\boldsymbol{z}) = p_\\theta(\\boldsymbol{x}|\\\
    boldsymbol{z})p(\\boldsymbol{z})$  \n+   - Assume variational distribution $q_\\\
    phi(\\boldsymbol{z}|\\boldsymbol{x})$  \n+   - Objective: Maximize lower bound\
    \ for log likelihood  \n+     $\\log p(\\boldsymbol{x})$  \n+     $= KL\\left(q_\\\
    phi(\\boldsymbol{z}|\\boldsymbol{x}) \\| p_\\theta(\\boldsymbol{z}|\\boldsymbol{x})\\\
    right) + \\int_{\\boldsymbol{z}} q_\\phi(\\boldsymbol{z}|\\boldsymbol{x}) \\log\\\
    frac{p_\\theta(\\boldsymbol{x},\\boldsymbol{z})}{q_\\phi(\\boldsymbol{z}|\\boldsymbol{x})}$\
    \  \n+     $\\ge \\int_{\\boldsymbol{z}} q_\\phi(\\boldsymbol{z}|\\boldsymbol{x})\
    \ \\log\\frac{p_\\theta(\\boldsymbol{x},\\boldsymbol{z})}{q_\\phi(\\boldsymbol{z}|\\\
    boldsymbol{x})}$  \n+     $:= \\mathcal{L}(\\boldsymbol{\\theta},\\boldsymbol{\\\
    phi};\\boldsymbol{x})$  \n+   - Equivalently, minimize free energy  \n+     $F(\\\
    boldsymbol{\\theta},\\boldsymbol{\\phi};\\boldsymbol{x}) = -\\log p(\\boldsymbol{x})\
    \ + KL\\left(q_\\phi(\\boldsymbol{z}|\\boldsymbol{x}) \\| p_\\theta(\\boldsymbol{z}|\\\
    boldsymbol{x})\\right)$"
