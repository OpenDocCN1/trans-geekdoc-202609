    $$\max_{\theta}\mathcal{L}_{\theta}=\mathbb{E}_{p_{\theta}(x\mid y)p(y)}\left[\log
    q_{\phi}^{r}(y\mid x)\right]$$


    +   - The only **difference** between optimizing $\theta$ and $\phi$: $q$ vs.
