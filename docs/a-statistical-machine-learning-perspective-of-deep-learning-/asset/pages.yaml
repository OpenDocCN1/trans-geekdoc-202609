- pgno: 39
  md: "# II: Sigmoid Belief Networks\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_39_0.png)\n\
    \nfrom Neal, 1992\n\n+   - Sigmoid belief nets are simply Bayesian networks over\
    \ binary variables with conditional probabilities represented by sigmoid functions:\n\
    +   \n+   $$P(x_i|\\pi(x_i)) = \\sigma\\left(x_i \\sum_{x_j \\in \\pi(x_i)} w_{ij}x_j\\\
    right)$$ \n+   \n+   - Bayesian networks exhibit a phenomenon called “explain\
    \ away effect”\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_39_1.png)\n\nIf A correlates\
    \ with C, then the chance of B correlating with C decreases. ⇒ A and B become\
    \ correlated given C."
  merge: -1
  img_proc: true
- pgno: 40
  md: "# II: Sigmoid Belief Networks\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_40_0.png)\n\
    \n+   - Sigmoid belief nets are simply Bayesian networks over binary variables\
    \ with conditional probabilities represented by sigmoid functions:\n+   \n+  \
    \   $$P(x_i \\mid \\pi(x_i)) = \\sigma\\left(x_i \\sum_{x_j \\in \\pi(x_i)} w_{ij}x_j\\\
    right)$$\n\n+   - Bayesian networks exhibit a phenomenon called “explain away\
    \ effect”\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_40_1.png)\n\n> **Note:**\n\
    > \n> Due to the “explain away effect,” when we condition on the visible layer\
    \ in belief networks, hidden variables all become dependent."
  merge: -1
  img_proc: true
- pgno: 41
  md: "# Sigmoid Belief Networks:\nLearning and Inference\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_41_0.png)\n\
    \n+   - Neal proposed Monte Carlo methods for learning and inference (Neal, 1992):\n\
    +   - Approximated with Gibbs sampling\n+   - Conditional distributions:\n+  \
    \   $P(S_i = x \\mid S_j = s_j : j \\neq i)$\n+     $\\propto \\sigma\\left(x^*\
    \ \\sum_{j<i} s_j w_{ij}\\right) \\prod_{j>i} \\sigma\\left(s_j^*\\left(x w_{ji}\
    \ + \\sum_{k<j, k\\neq i} s_k w_{jk}\\right)\\right)$\n+   - No negative phase\
    \ as in RBM!\n+   - Convergence is very slow, especially for large belief nets,\
    \ due to the intricate “explain-away” effects...\n\nEquations from Neal, 1992\n\
    \n$\\frac{\\partial L}{\\partial w_{ij}} = \\sum_{\\tilde{v}\\in T} \\frac{1}{P(\\\
    tilde{V}=\\tilde{v})} \\frac{\\partial P(\\tilde{V}=\\tilde{v})}{\\partial w_{ij}}$\
    \ \n$= \\sum_{\\tilde{v}\\in T} \\frac{1}{P(\\tilde{V}=\\tilde{v})} \\sum_{\\\
    tilde{h}} \\frac{\\partial P(\\tilde{S}=\\langle\\tilde{h},\\tilde{v}\\rangle)}{\\\
    partial w_{ij}}$ \n$= \\sum_{\\tilde{v}\\in T} \\sum_{\\tilde{h}} P(\\tilde{S}=\\\
    langle\\tilde{h},\\tilde{v}\\rangle \\mid \\tilde{V}=\\tilde{v}) \\cdot \\frac{1}{P(\\\
    tilde{S}=\\langle\\tilde{h},\\tilde{v}\\rangle)} \\frac{\\partial P(\\tilde{S}=\\\
    langle\\tilde{h},\\tilde{v}\\rangle)}{\\partial w_{ij}}$ \n$= \\sum_{\\tilde{v}\\\
    in T} \\sum_{\\tilde{s}} P(\\tilde{S}=\\tilde{s} \\mid \\tilde{V}=\\tilde{v})\
    \ \\frac{1}{P(\\tilde{S}=\\tilde{s})} \\frac{\\partial P(\\tilde{S}=\\tilde{s})}{\\\
    partial w_{ij}}$ \n$= \\sum_{\\tilde{v}\\in T} \\sum_{\\tilde{s}} P(\\tilde{S}=\\\
    tilde{s} \\mid \\tilde{V}=\\tilde{v}) \\frac{1}{\\sigma\\left(s_i^* \\sum_{k<i}\
    \ s_k w_{ik}\\right)} \\frac{\\partial \\sigma\\left(s_i^* \\sum_{k<i} s_k w_{ik}\\\
    right)}{\\partial w_{ij}}$ \n$= \\sum_{\\tilde{v}\\in T} \\sum_{\\tilde{s}} P(\\\
    tilde{S}=\\tilde{s} \\mid \\tilde{V}=\\tilde{v}) s_i^* s_j \\sigma\\left(-s_i^*\
    \ \\sum_{k<i} s_k w_{ik}\\right).$\n\nlog derivative\n\nprob. of the visibles\
    \ via marginalization\n\nBayes rule + rearrange sums\n\nPlug-in the actual sigmoid\
    \ form of the conditional prob."
  merge: -1
  img_proc: true
