- pgno: 205
  md: '# Deep Learning Toolkits


    +   - Symbolic

    +     - Good

    +       - easy to optimize (e.g. batching, parallelization, kernel fusion) for
    developers

    +       - More efficient

    +     - Bad

    +       - The way of programming might be counter-intuitive

    +       - Harder to debug for user programs

    +       - Less flexible: you need to write symbols before actually doing anything

    +   - Imperative:

    +     - Good

    +       - More flexible: write one line, evaluate/execute one line

    +       - Easy to program and easy to debug: because it matches the way we use
    in most programming languages

    +     - Bad

    +       - Less efficient

    +       - More difficult to optimize'
