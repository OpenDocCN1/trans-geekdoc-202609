- pgno: 37
  md: '# I: Restricted Boltzmann Machines


    Gradient of the log-likelihood w.r.t. the parameters (alternative form):


    $\frac{\partial}{\partial w_{ij}} \log L(v) = \mathbb{E}_{P(h|v)} \left[ \frac{\partial}{\partial
    w_{ij}} P(v,h) \right] - \mathbb{E}_{P(v,h)} \left[ \frac{\partial}{\partial w_{ij}}
    P(v,h) \right]$


    +   - Both expectations can be approximated via sampling

    +   - Sampling from the posterior is exact (RBM factorizes over h given v)

    +   - Sampling from the joint is done via MCMC (e.g., Gibbs sampling)

    +   - In the neural networks literature:

    +     - computing the first term is called the clamped / wake / positive phase
    (the network is “awake” since it conditions on the visible variables)

    +     - Computing the second term is called the unclamped / sleep / free / negative
    phase (the network is “asleep” since it samples the visible variables from the
    joint; metaphorically, it is "dreaming" the visible inputs)'
  merge: -1
  img_proc: true
