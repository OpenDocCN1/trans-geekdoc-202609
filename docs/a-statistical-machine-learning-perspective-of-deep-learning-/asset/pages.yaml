  md: '# The two types of GMs


    P(H|V)

    θ = argmax_θ P_θ(V)


    +   - **Directed edges** assign causal meaning to the relationships (Bayesian
    Networks or Directed Graphical Models)

    +     P(X₁,X₂,X₃,X₄,X₅,X₆,X₇,X₈) =

    +     P(X₁)P(X₂)P(X₃|X₁)P(X₄|X₂)P(X₅|X₂)

    +     P(X₆|X₃,X₄)P(X₇|X₆)P(X₈|X₅,X₆)

    +   - **Undirected edges** represent correlations between the variables (Markov
    Random Field or Undirected Graphical Models)

    +     P(X₁,X₂,X₃,X₄,X₅,X₆,X₇,X₈) =

    +     1/Z exp{E(X₁)+E(X₂)+E(X₁,X₃)+E(X₂,X₄)+E(X₅,X₂)+

    +     E(X₃,X₄,X₆)+E(X₆,X₇)+E(X₅,X₆,X₈)}


