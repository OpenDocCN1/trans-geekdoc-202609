    \ with wake-sleep algorithm\n+   - Generative model $p_\\theta(\\mathbf{x}|\\\
    mathbf{z})$, and prior $p(\\mathbf{z})$  \n+     - Joint distribution $p_\\theta(\\\
    mathbf{x},\\mathbf{z}) = p_\\theta(\\mathbf{x}|\\mathbf{z})p(\\mathbf{z})$\n+\
    \   - Inference model $q_\\phi(\\mathbf{z}|\\mathbf{x})$\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_114_0.png)\n\
