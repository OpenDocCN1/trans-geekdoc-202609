- pgno: 294
  md: '# Topologies:

    Master-Slave versus P2P?


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_294_0.png)


    ![](img/cb490ed30bca4eda5fbba81c52a2c173_294_1.png)


    # Master-slave


    +   - Used with **centralized storage** paradigm

    +   - **Disadvantage:** need to code/manage clients and servers separately

    +   - **Advantage:** bipartite topology is comms-efficient

    +   - Popular for Parameter Servers: Yahoo LDA, Google DistBelief, Petuum PS,
    Project Adam, Li&Smola PS, ...


    # P2P


    +   - Used with **decentralized storage**

    +   - **Disadvantage (?)**: high comms volume for large # of workers

    +   - **Advantage:** same code for all workers; no single point of failure, high
    elasticity to resource adjustment

    +   - Less well-explored due to perception of high communication overhead?'
  merge: -1
  img_proc: true
