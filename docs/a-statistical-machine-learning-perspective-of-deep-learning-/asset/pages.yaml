- pgno: 57
  md: '# Graphical models vs. Deep networks


    +   - A few critical points to note about all these models:

    +     - The primary goal of deep generative models is to represent the distribution
    of the observable variables. Adding layers of hidden variables allows to represent
    increasingly more complex distributions.

    +     - Hidden variables are secondary (auxiliary) elements used to facilitate
    learning of complex dependencies between the observables.

    +     - Training of the model is ad-hoc, but what matters is the quality of learned
    hidden representations.

    +     - Representations are judged by their usefulness on a downstream task (the
    probabilistic meaning of the model is often discarded at the end).

    +   - In contrast, classical graphical models are often concerned with the correctness
    of learning and inference of all variables'
  merge: -1
  img_proc: true
