    \   \n+     $$\\mathbf{y}^*(\\mathbf{x}; \\mathbf{w}) := \\arg\\min_{\\mathbf{y}}\
    \ E(\\mathbf{y}, \\mathbf{x}; \\mathbf{w})$$\n+   \n+   - Unroll the optimization\
    \ algorithm for a fixed number of steps (Domke, 2012)\n+   \n+     $$\\mathbf{y}^*(\\\
    mathbf{x}; \\mathbf{w}) = \\text{opt-alg}_{\\mathbf{y}} E(\\mathbf{y}, \\mathbf{x};\
    \ \\mathbf{w})$$\n+   \n+   - We can think of y* as some non-linear differentiable\
    \ function of the inputs and weights → impose some loss and optimize it as any\
    \ other standard computation graph using backprop!\n+   \n+   - Similarly, message\
    \ passing based inference algorithms can be truncated and converted into computational\
    \ graphs (Domke, 2011; Stoyanov et al., 2011)"
