- pgno: 112
  md: "# Wake Sleep Algorithm\n\n+   - Free energy:\n+   \n+     $F(\\boldsymbol{\\\
    theta}, \\boldsymbol{\\phi}; \\boldsymbol{x}) = -\\log p(\\boldsymbol{x}) + KL(q_{\\\
    phi}(\\mathbf{z}|\\boldsymbol{x}) \\| p_{\\theta}(\\mathbf{z}|\\boldsymbol{x}))$\n\
    +   - WS works around the difficulties with the sleep phase approximation\n+ \
    \  - Minimize the following objective → sleep phase\n+   \n+     $F'(\\boldsymbol{\\\
    theta}, \\boldsymbol{\\phi}; \\boldsymbol{x}) = -\\log p(\\boldsymbol{x}) + KL(p_{\\\
    theta}(\\mathbf{z}|\\boldsymbol{x}) \\| q_{\\phi}(\\mathbf{z}|\\boldsymbol{x}))$\n\
    +   \n+     $\\max_{\\phi} \\mathbb{E}_{p_{\\theta}(z,x)} [\\log q_{\\phi}(\\\
    mathbf{z}|\\boldsymbol{x})]$\n+   \n+     $\\max_{\\phi} \\mathbb{E}_{q_{\\phi}(z|x)}\
    \ [\\log p_{\\theta}(\\boldsymbol{x},\\mathbf{z})]$  \n+     - “Dreaming” up samples\
    \ from $p_{\\theta}(\\boldsymbol{x}|\\mathbf{z})$ through top-down pass\n+   \
    \  - Use the samples as targets for updating the inference model\n+   - (Recent\
    \ approaches other than sleep phase are developed to reduce the variance of gradient\
    \ estimate: slides later)\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_112_0.png)\n\
    \n[Figure courtesy: Maei’s slides]"
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Wake Sleep Algorithm


    # Wake sleep


    +   - Parametrized inference model $q_{\phi}(\mathbf{z}|\mathbf{x})$\n- Wake phase:\n  -
    minimize $KL(q_{\phi}(\mathbf{z}|\mathbf{x}) || p_{\theta}(\mathbf{z}|\mathbf{x}))$
    wrt. $\theta$\n  - $\mathbb{E}_{q_{\phi}(\mathbf{z}|\mathbf{x})} [\nabla_{\theta}
    \log p_{\theta}(\mathbf{x}|\mathbf{z})]$\n- Sleep phase:\n  - minimize $KL(p_{\theta}(\mathbf{z}|\mathbf{x})
    || q_{\phi}(\mathbf{z}|\mathbf{x}))$ wrt. $\phi$\n  - $\mathbb{E}_{p_{\theta}(\mathbf{z},\mathbf{x})}
    [\nabla_{\phi} \log q_{\phi}(\mathbf{z},\mathbf{x})]$\n  - low variance\n  - Learning
    with generated samples of $\mathbf{x}$\n- Two objective, not guaranteed to converge


    # Variational EM


    +   - Variational distribution $q_{\phi}(\mathbf{z}|\mathbf{x})$\n- Variational
    M step:\n  - minimize $KL(q_{\phi}(\mathbf{z}|\mathbf{x}) || p_{\theta}(\mathbf{z}|\mathbf{x}))$
    wrt. $\theta$\n  - $\mathbb{E}_{q_{\phi}(\mathbf{z}|\mathbf{x})} [\nabla_{\theta}
    \log p_{\theta}(\mathbf{x}|\mathbf{z})]$\n- Variational E step:\n  - minimize
    $KL(q_{\phi}(\mathbf{z}|\mathbf{x}) || p_{\theta}(\mathbf{z}|\mathbf{x}))$ wrt.
    $\phi$\n  - $q_{\phi}^* \propto \exp[\log p_{\theta}]$ if with closed-form\n  -
    $\nabla_{\phi} \mathbb{E}_{q_{\phi}} [\log p_{\theta}(z, x)]$\n    - need variance-reduce
    in practice\n  - Learning with real data $\mathbf{x}$\n- Single objective, guaranteed
    to converge'
  merge: -1
  img_proc: true
