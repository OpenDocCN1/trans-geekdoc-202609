- pgno: 237
  md: "![](img/cb490ed30bca4eda5fbba81c52a2c173_237_0.png)\n\n# Cavs: Four APIs\n\n\
    +   - An example: expressing Tree-LSTM using the four APIs\n\n```\ndef F():\n\
    \    S = gather()               # gather states of child vertices\n    for k in\
    \ range(N):\n        c_k, h_k = split(S[k], 2)  # get hidden states c and h\n\
    \    x = pull({0})              # pull the first external input x\n\n    # specify\
    \ the computation\n    h = ∑_{k=0}^{N-1} h_k\n    i = sigmoid(W^{(i)} × x + U^{(i)}\
    \ × h + b^{(i)})\n    for k in range(N):\n        f_k = sigmoid(W^{(f)} × x +\
    \ U^{(f)} × h_k + b^{(f)})\n    o = sigmoid(W^{(o)} × x + U^{(o)} × h + b^{(o)})\n\
    \    u = tanh(W^{(u)} × x + U^{(u)} × h + b^{(u)})\n    c = i ⊗ u + ∑_{k=0}^{N-1}\
    \ f_k ⊗ c_k\n    h = o ⊗ tanh(c)\n\n    scatter(concat([c, h], 1))  # scatter\
    \ c, h to parent vertices\n    push(h)                     # push to external\
    \ connectors\n```"
  merge: -1
  img_proc: true
- pgno: 238
  md: "# Expressing Backpropagation\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_238_0.png)\n\
    \n+   - It transforms the forward-backward computation on batch of dataflow graphs\
    \ as\n+     - Forward: schedule the execution of the vertex function F through\
    \ a batch of input graphs\n+     - Backward: schedule the execution of ∂F through\
    \ the same batch of input graphs, in a reverse order\n\n```\n/* (c) our proposed\
    \ vertex-centric model */\ndeclare a symbolic vertex function ℱ.\nfor t = 1 →\
    \ T:\n  read the tth data batch {x_i^t}_{i=1}^K.\n  read their associated graphs\
    \ {\U0001D4A2_i^t}_{i=1}^K.\n  compute ℱ over {\U0001D4A2_i^t}_{i=1}^K with inputs\
    \ {x_i^t}_{i=1}^K.\n```"
  merge: -1
  img_proc: true
- pgno: 239
  md: "# Cavs Bypass Graph Construction Overhead\n\n![](img/cb490ed30bca4eda5fbba81c52a2c173_239_0.png)\n\
    \n+   - No repeated graph construction overhead!\n+   - The graph construction\
    \ overhead is constant – we only need to construction F, which is usually a small-scale\
    \ dataflow graph\n+   - Bypass the repeated dataflow graph construction\n+   -\
    \ Instead, read the input graph G, which could be achieved by an I/O function\n\
    \n```\n/* (c) our proposed vertex-centric model */\ndeclare a symbolic vertex\
    \ function ℱ.\nfor t = 1 → T:\n  read the tth data batch {x_i^t}_{i=1}^K\n  read\
    \ their associated graphs {\U0001D4A2_i^t}_{i=1}^K\n  compute ℱ over {\U0001D4A2\
    _i^t}_{i=1}^K with inputs {x_i^t}_{i=1}^K.\n```\n\nDeclare only once → constant\
    \ graph construction cost\n\nRead through I/O, no graph construction involved\
    \ any more."
  merge: -1
  img_proc: true
