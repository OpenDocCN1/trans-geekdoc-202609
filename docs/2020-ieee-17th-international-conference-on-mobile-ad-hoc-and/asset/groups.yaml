    - Constraint 2 indicates that each task can be executed at most one server.

    - Constraint 3 defines the capacity limit of fog server.

    - Constraint 4 represents the size of task i.


    In order to solve this optimization problem, the key is to find the suitable values
    O, C, M and F. The challenge for solving the problem is complex and the number
    of states increases. The mathematical problem is non-convex and NP hard. Therefore,
    we utilize a DRL-based algorithm, DDPG, to simplify the challenge and find the
    optimal solution.


    ## V. REINFORCEMENT LEARNING APPROACH


    User demands on constrained resources in terms of computation making it difficult
    to minimize the system cost. DRL is viewed as an effective way to solve complex
    problem. In DRL, an agent needs information about resources in the network and
    diverse demands of users. Then, the agent acts to manage caching decisions and
    optimize resource allocation. In this paper, we use reinforcement learning algorithm
    called deterministic policy gradient (DDPG) to solve the optimization of the problem
    (18).


    ### A. Problem formulation based on DRL


    The motivation of using DRL is to improve flexibility of our system in dynamic
    environment. Tasks emerge and are offloaded to fog servers. Servers process these
    tasks and forward them to the cloud, and send results back to the users. These
    processes can be regarded as Markov Decision Process (MDP) where the state of
    the system depends only on the last state. Let $S = \{s_1, s_2, ..., s_n\}$, action
    space $A = \{a_1, a_2, ..., a_m\}$, transition probability $P = \{p(s_j|s_i, a_k)\}$,
    and reward function $R = \{r(s_i, a_k)\}$ is the system function that can maximize
    rewards and choose the best actions in dynamic states.


    **State:** The state is used to reflect the environment. Here it is represented
    by available resources, including computing and caching capacities. The state
    space is defined as $S = \{M_1, M_2, ..., M_n\}$, $V = \{v_1, v_2, ..., v_n\}$,
    $C = \{c_1, c_2, ..., c_n\}$, $B = \{b_1, b_2, ..., b_n\}$, $U = \{u_1, u_2, ...,
    u_n\}$, and $L = \{l_1, l_2, ..., l_n\}$.


    **Reward:** The reward is used to reflect the benefit of a current state and the
    consuming objective. The objective of the formulated problem is to minimize the
    total delay and energy consumption for task processing. Thus, we set the reward
    as $R = -\sum_{i=1}^{n} (delay_{i} + \beta energy_{i})$.


    ### B. DDPG based on state space, action space, and reward


    After defining the state space, action space, and reward, we utilize DRL to solve
    the optimization problem. For reinforcement learning, one representative is Q-learning.
    Q-learning uses Q-table to record the Q values with different kinds of state and
    action. However, it may not be suitable for scenarios with large state and action
    spaces. Deep Q-Network (DQN) uses a deep neural network to estimate the Q values,
    which can support dimensional states and action spaces, but with a slow speed
    of convergence. In case, we exploit the deterministic policy gradient (DDPG),
    a model-free and actor-critic algorithm to solve the computation off and caching
    problem.


    We can regard the DDPG algorithm as a combination of DRL algorithms [38]. The
    DDPG algorithm consists of three parts: the primary network, the target network
    and the memory. For the primary network and the target network, each has two networks,
    actor and critic, totaling in four networks. We utilize the actor network to explore
    the policies and the critic network to criticize the policies. The critic also
    provides critical values to update the policy memory. By storing the state-action
    pairs, and the reward during training, the agent will select these samples to
    reduce data correlation effects. In this, we follow the deep neural network approach.


    The primary actor is used to update the policy network $\theta$. It interacts
    with the environments and generates the next state $S''$ and rewards $R$ according
    to the current action $A$. The critic is responsible for choosing the optimal
    action $A''$ to update the next state $S''$ in the policy''s memory. Its network
    $\theta''$ is copied from $\theta$ from the primary critic to update the value
    network parameter $\theta$ and calculate, but they are updated as follows:


    ```

    $Y_t = R + \gamma Q''(S'', A'') \quad (19)$

    ```


    $\gamma$ represents the discount factor with $(0, 1)$. $Q''(S'', A'')$ is calculated
