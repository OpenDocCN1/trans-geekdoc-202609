    a variety of applications that demand high computing resources and low latency,
    such as connected and autonomous driving rely on computation offloading and service
    caching resource-intensive services in vehicular networks. Fog computing has a
    limited amount of computing resources. While computation offloading and caching
    can maximize the system performance time, the heterogeneity, density, and stochastic
    properties of vehicular networks pose challenges on resource allocation. In this
    paper, we propose an intelligent offloading architecture with service caching,
    considering both energy efficiency and the problem of computation offloading and
    service caching. For energy efficiency, we propose an algorithm based on deep
    reinforcement learning to solve this complex problem, ensuring feasibility of
    our proposal. The results show that our proposed scheme exhibits an effective
    performance improvement over others compared to the chosen baseline.


