    increases more computational resources in fog servers contribute to lower, resulting
    in better results. The Local policy has the highest cost as it does not use any
    resources in fog, as shown in this case. Figure 2(d) illustrates the effectiveness
    of caching capacity of fog servers on the total cost among all schemes. Local
    and Offloading-only schemes show that they do not rely on caching capacity of
    fog servers. Offloading-only scheme has a lower cost than others because fog servers
    are able to assign the tasks to caching services; otherwise, they need to solicit
    from the Cloud, contributing to a higher cost. Figure 2(e) represents the delay
    among all schemes in terms of computational resources of fog servers. Local policy
    exhibits the highest delay when executing tasks. In DDPG, DQN and Offloading-only
    schemes, the delay for task processing is reduced when the computational capacity
    of fog servers increases. However our proposed scheme achieves better performance
    than Offloading-only schemes. This is because Offloading-only method does not
    use caching, which results in higher communication delay. If a server has no needed
    service(s) for the assigned task, it has to offload the task to Remote Cloud with
    offloading delay. Figure 2(f) represents the average energy consumption for each
    task versus RSU capacity. The offloading-only scheme has the highest energy consumption
    per task. The energy consumption is related to power consumption of devices, and
    communication and computational resources. DDPG and DQN schemes have lower energy
    consumption because offloaded tasks to fog servers do not use caching, they obtain
    stable values in this case. The energy consumption of DDPG and DQN schemes decreases
    with the increasing capacity of RSUs. An evaluation result shows that the deep
    reinforcement learning algorithm has the advantage of offloading policies with
    lower total cost in dynamic vehicle environments.


