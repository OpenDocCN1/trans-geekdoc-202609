    - C2: $C_j \leq 1, i \in T$

    - C3: $c_{ij} \leq m_j, i \in T$

    - C4: $f_j \leq F_j, i \in J$


    $O = \{\alpha_{ij}\}, C = \{C_j\}, M = \{m_j\}, F = \{F_j\}$. Let $\lambda_{ij}$
    represent the weight of energy cost, and $\mu_{ij}$ the weight of latency. To
