    # 基于雾的车辆网络计算卸载与缓存深度强化学习


    Dapen Lam, Amin Taherkordi, 和 Frank Eliassen

    信息科学系

    奥斯陆大学

    挪威，奥斯陆

    (dapen.lam;frank@ifi.uio.no)


    Lei Liu

    西安电子科技大学

    集成服务国家重点实验室

    中国，西安

    tntianjialulei@163.com


    **摘要—** 车辆网络中的雾计算变得至关重要，许多对高计算资源和低延迟有需求的应用（如联网与自动驾驶）依赖于在车辆网络中计算卸载和服务缓存来处理资源密集型服务。雾计算的计算资源数量是有限的。虽然计算卸载和缓存可以最大化系统性能时间，但车辆网络的异构性、密度和随机特性给资源分配带来了挑战。在本文中，我们提出了一种带有服务缓存的智能卸载架构，同时考虑了能量效率以及计算卸载与服务缓存问题。为了提高能量效率，我们提出了一种基于深度强化学习的算法来解决这一复杂问题，确保了我们方案的可行性。结果表明，与所选的基准方案相比，我们提出的方案展现了有效的性能提升。


    车辆网络中的节点。[11], [5]–8]。车辆用户可以将任务卸载到具有中等计算资源的雾节点以降低延迟。如果处理需求超过了雾平台的容量，这些任务将被卸载到云端，这相对于卸载到其他雾节点属于垂直卸载，从而形成了一种水平卸载方法。


    此外，车辆用户的卸载任务往往依赖于其他服务。例如，为了确保自动驾驶系统中进行更准确的检测，需要高分辨率的目标检测。在检测任务中，需要一个具有足够计算资源的雾节点来处理传感器数据，例如来自视频传感器和雷达传感器的数据。为了提高效率，地图服务和相关数据库必须缓存在雾节点本身。然而，如果雾节点在卸载时（即目标检测时）没有缓存所请求的服务（即地图服务），则任务可以进一步卸载到其他雾节点，从而影响服务交付的质量。


    **索引术—** 车辆计算、计算卸载、服务缓存、强化学习。


    # I. 引言


    随着云计算和蜂窝网络等先进通信技术的出现，车辆网络及其应用正变得可行。车辆网络的显著发展使得大量应用成为可能，如增强现实（AR）和自动驾驶，这些应用都有复杂的处理需求和高可靠性要求
    [1], [2]。然而，将所有任务卸载到云端会导致沉重的后端负载和不可接受的延迟 [3]。车辆计算（VFC）（又称为边缘计算）被提出作为有前景的解决方案，以解决从远程云到雾节点计算引起的问题。


    因此，缓存服务是实现卸载到雾节点任务效率的重要因素。缓存以两种不同的形式出现：内容缓存和服务缓存。例如，内容缓存将高频使用的媒体数据存储在雾中供用户使用 [11]。服务缓存是在执行计算任务时存储程序代码的元数据以及相关的数据库/文件
    [14]–16。在一个场景中，目标检测所需的地图被缓存在雾节点中。


    最优计算卸载和服务缓存的设计面临许多挑战。存储空间的限制使得雾节点在本地缓存所有应用服务变得是不切行的。如何缓存所需的服务（即缓存哪些服务）至关重要，影响着基于雾的车辆系统的卸载。不同雾节点上的计算资源可能分布不均。通过实现不同雾节点之间的协作来平衡计算负载是至关重要的。车辆的异构性增加了实现最优计算卸载和调度策略的难度。


    # II. 相关工作


    任务卸载。许多人员对移动云计算 [27], [28]、移动边缘计算（MEC）和泛在计算中的卸载投入了大量工作，主要集中在如何将任务从端到端卸载到雾服务器或云端。最近，许多人研究了
    VFC 中任务卸载的各种因素。在工作 [17] 中，作者提出了一种利用队列论通过划分和移动节点来利用 VFC 的方法，以最小化响应延迟。在工作 [18] 中，作者设计了一种基于游戏的算法对车辆网络中的任务卸载进行建模，以将价格无政府降低到纳什均衡。


    雾计算中的计算卸载已已有一些研究 [17–21]，但它们没有考虑服务缓存问题。少数工作 [14–16] 解决了计算卸载问题，包括任务优化、本地决策设计和服务缓存。然而，与我们提出的方案相比，我们提供了一个更全面的系统架构，它包含了雾与池化卸载，包括任务优化和服务缓存管理。


    同样地，在工作 [19] 中，考虑到车辆的移动性和负载的延迟对 VFC 中的任务卸载建模建模并解决了可靠性问题。在工作 [25] 中，作者提出了一种用于具有额外可靠性和低延迟
    V2 基础设施的方法，利用了多服务器和网络传输延迟。工作 [29] 考虑了多边缘服务器场景。在 [31] 中，作者发现网络中的车辆可以从邻居处学习卸载策略。这项工作进一步设计了卸载策略并解决了最小化平均延迟的优化问题。


    我们设计了基于强化学习（DRL）的深度策略梯度（DPG）[22] 来实现目标。


    - 我们提出了一种基于雾的服务缓存车辆架构计算卸载。该架构采用雾-池计算管理来最大化系统效率。

    - 我们将联合计算卸载和服务缓存的优化问题形式化，以降低任务复杂度。

    - 我们基于算法 DPG [22] 设计了卸载策略，以获得该问题的解决方案。该策略允许对计算卸载和服务缓存进行高效决策。


    实现任务性能和长期能耗的最小化。这促使我们开发一种新型架构来优化计算卸载和服务缓存，总结如下：


    我们进行了实验和实际研究以评估所提算法的性能。


    本文的其余部分结构如下：第二节讨论了任务卸载、服务缓存和基于 AI 的任务卸载的相关工作。我们在第三节介绍了带有服务缓存的架构。在第四节中，我们将联合计算卸载和服务缓存的优化问题形式化。第五节介绍了用于解决该问题的
    DRL 算法。最后，在第六节评估了我们所提系统的性能。我们在第七节总结全文和未来工作。


    服务缓存。服务缓存及其数据库/文件预存储在雾服务器中以便快速访问。这种方法减少了当相关任务卸载到雾服务器时获取服务的延迟和带宽消耗。例如，在工作 [32]
    中，作者在网络中使用缓存来最小化流量负载。[33] 提出了一种用于 MEC 中请求路由框架。它进一步利用边缘缓存来最小化请求数量。更重要的是，工作 [34]
    考虑了通信和计算，并将问题建模为混合整数非凸凸优化。


