    ## D. 问题公式


    我们工作的主要目标是为雾环境设计卸载调度方案，以最小化处理时间和长期能量消耗。方案优化卸载决策 O、缓存 C、计算资源分配 M 和雾卸载能力，以最小化系统的加权终端卸载延迟和能量成本：


    ```

    $\sum_{i \in T} \sum_{j \in J} (\lambda_{ij} T_{ij} + \mu_{ij} E_{ij})$

    s.t.

    - C1: $\alpha_{ij} \in \{0, 1\}, i \in T, j \in J$

    - C2: $C_j \leq 1, i \in T$

    - C3: $c_{ij} \leq m_j, i \in T$

    - C4: $f_j \leq F_j, i \in J$


    $O = \{\alpha_{ij}\}, C = \{C_j\}, M = \{m_j\}, F = \{F_j\}$。让 $\lambda_{ij}$
    代表能量成本，$\mu_{ij}$ 代表延迟。为了简化模型，我们设置 $\lambda_{ij} = 1$，且 $\mu_{ij} = 1$：

    - 约束 1 表示任务可以通过雾节点卸载。

    - 约束 2 表示任务最多在一个服务器执行。

    - 约束 3 定义了雾服务器的限制。

    - 约束 4 代表任务的大小。


    为了解决这个优化问题，关键找到合适的 O、C、M 和 F。解决问题的挑战在于状态数量的增加。数学问题是非凸 NP 的。因此，我们利用基于 DRL 的算法 DDPG
    来简化挑战并找到解决方案。


    ## V. 强化学习方法


    对资源的约束使得最小化系统成本变得困难。DRL 被视为解决复杂问题的有效方法。在 DRL 中，代理需要关于网络资源和多样化需求的信息。然后代理执行缓存决策并优化资源分配。在本文中，我们使用名为确定性策略梯度（DDPG）的强化学习算法来解决问题
    (18)。


    ### A. 基于 DRL的问题公式


    使用 DRL 的动机是提高动态环境中系统的灵活性。任务出现并卸载到雾服务器。服务器处理这些任务并转发到云端，并将结果发回用户。这些过程可以被视为马尔可夫决策过程
    (MDP)，系统的状态仅取决于上一个状态。令 $S = \{s_1, s_2, ..., s_n\}$，动作空间 $A = \{a_1, a_2, ...,
    a_m\}$，转移概率 $P = \{p(s_j|s_i, a_k)\}$，奖励函数 $R = \{r(s_i, a_k)\}$ 是可以在动态状态下最大化奖励并选择最佳动作的系统函数。


    **状态**：状态用于反映环境。在这里由可用资源表示，包括计算缓存容量。状态空间定义为 $S = \{M_1, M_2, ..., M_n\}$，$V =
    \{v_1, v_2, ..., v_n\}$，$C = \{c_1, c_2, ..., c_n\}$，$B = \{b_1, b_2, ..., b_n\}$，$U
    = \{u_1, u_2, ..., u_n\}$ 以及 $L = \{l_1, l_2, ..., l_n\}$。


    **奖励**：奖励用于反映当前状态的收益和消耗目标。公式问题的目标是最小化任务处理的总延迟和能耗。因此，我们将奖励设置为 $R = -\sum_{i=1}^{n}
    (delay_{i} + \beta energy_{i})$。


    ### B. 基于状态空间、动作空间和奖励的 DDPG


    在定义状态空间、动作空间和奖励后，我们利用 DRL 来解决优化问题。对于强化学习，一个代表是 Q-learning。Q-learning 使用 Q 表记录不同状态和动作的
    Q 值。然而，它可能不适用于动作空间很大的场景。深度 Q 网络 (DQN) 使用神经网络估计 Q 值，可以支持维度状态动作空间，但收敛速度慢。在这种情况下，我们利用确定性策略梯度（DDPG）无模型
    actor-critic 算法来解决计算卸载和缓存问题。


    我们可以将 DDPG 算法视为 DRL 算法的结合 [38]。DDPG 算法由三部分组成：主网络、目标网络和内存。主网络和目标网络每个包含两个网络（actor
    和 critic），总共四个网络。我们利用 actor 网络探索策略，并利用 critic 网络评价策略。critic 还为更新策略内存提供关键值。通过存储训练期间的状态-动作对和奖励，代理将选择这些样本以减少数据相关性影响。在这一点中，我们遵循深度神经网络的方法。

