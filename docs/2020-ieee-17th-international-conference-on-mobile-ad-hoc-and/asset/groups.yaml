    tasks [14]–16. In an example in the scenario, the maps needed for object detection
    are cached in the fog node.


    The design of optimal computation offloading and service caching faces many challenges.
    The limited storage space makes it impractical for fog nodes to cache all the
    application services locally. How to cache the required services, i.e., which
    services to cache, is of paramount importance, impacting offloading on fog-based
    vehicular systems. The computing resources on different fog nodes may be uneven
    distributed. It is crucial to balance the computation load by realizing cooperation
    among different fog nodes. The heterogeneous nature of vehicles raise the level
    of difficulty in achieving an optimal computation offloading and service strategy.


