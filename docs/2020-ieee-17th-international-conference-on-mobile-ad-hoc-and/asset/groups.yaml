    # Algorithm 1: DRL-based joint computation offloading and service caching decision
    algorithm


    | Parameter | Value |

    |---|---|---|

    | Number of RSU | M |

    | Number of vehicles | N |

    | Computation capacity of RSU | 2 Cycles/sec |

    | Caching capacity of RSU | 200 GB |

    | Local computing capacity | [300, 500] Cycles/sec |

    | Storage units | 29.72 Cycles/bits |

    | Computation intensity for each task | [2*10^2, 2*10^3] bits/sec |


    **Input:** The initial state $S_0$ for available resources, computing and caching
    capacities; the parameters about the tested events; the initial parameters: $\theta_0,
    \omega_0, \alpha, m, n$; the target network offloading capacity $Q$


    **Output:** optimal actor parameter $\theta$; current optimal critic parameter
    $\omega$; the optimal action for computing and service caching:


    1. Initialize parameters: $i=0, \theta=\theta_0, \omega=\omega_0$;

    2. Clear up memory set $D$;

    3. For $i$ from 1 to $T$:

    4. Initialize environment state $S_i$, get $\pi(S_i)$;

    5. Take action $A_i$, get new state $S''$, reward $R$, and end index $end\_idx$;

    6. Store $(S_i, A_i, R, S'', end\_idx)$ in memory set;

    7. $S=S'';

    8. Take samples from memory set $D$, and calculate current target $Q$ if $end\_idx=0$:

    9. $y_i = R_i + \gamma Q''(S'', \pi(S''))$;

    10. else $y_i = R_i$;

    11. Update critic network parameter $\omega$

    12. $J(\omega) = \sum_{i=1}^m (y_i - Q(s_i, a_i))^2$;

    13. Update actor network parameter $\theta$ by the policy gradient function (21):

    14. If $T\% < C$, update current actor and network parameters

    15. $\omega \leftarrow \alpha\omega + (1-\alpha)\omega$;

    16. $\theta \leftarrow \alpha\theta + (1-\alpha)\theta$;

    17. If $S''$ is the end state, finish iteration, then;

    18. go back to Step (4).


    RSUs are located in a $200 \times 200$ square area. The distance between each
    vehicle and its associated RSU is within 100 meters. The scenarios we tested are
    motivated by the real life scenario in which the density of users will not be
    large in the computationally-limited fog scenario. RSUs are moving at different
    speeds. In our evaluation, scaling the number of RSUs and their services makes
    it faster.


    For each experiment, the caching capacity is set to 200 GB. The local computing
    capacity of vehicles is unfinished over the interval [300, 500] Cycles/sec. The
    computation intensity for each task is 29.72 Cycles/bits. The computation for
    each task is offloaded to fog services is uniformly distributed throughout the
    simulation.


    - We use the method with the following algorithms to control total cost, time
    and energy cost:

    - DQN: This algorithm utilizes Q-Network to optimize computation offloading and
    service caching.

    - Local: executes all tasks in the vehicles without any offloading.

    - Offloading: This offloads all the tasks to fog servers without service caching.


    We choose cumulative reward as the metric for performance as performed on the
    delay and energy consumption cost which will lead to an increase of reward.


    # B. Simulation Results


    In this section, we evaluate the performance of the algorithm for computation
    offloading and service caching. We compare the performance of several existing
    algorithms considering total cost, service delay and energy cost.


    # A. Experimental Settings and Metrics


    Our tested settings are based on the related work [39] and consider a fog-based
    vehicular network system that consists of one cloud, $M=3$ RSUs and $N=6$ vehicles.
    The three are


    In Figure 2(a), we plot the curve of cumulative reward using TensorFlow for a
