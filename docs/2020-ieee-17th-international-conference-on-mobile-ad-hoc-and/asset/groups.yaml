    DRL 算法。


    而 AI 任务卸载作为一个新兴领域，越来越多地应用于解决 VFC 中的优化问题。[23] 中的 VFC 使用双重解码深度 Q 网络（Double-Decoding
    Deep Q-Network）在一种可以动态重构网络和计算资源的框架下解决优化问题。[24] 中的作者使用了基于 DRL 的方法作为用户的卸载方案，并在考虑请求约束和通信信道约束的情况下解决优化问题。此外，我们的目标是计算卸载和服务缓存，针对服务器的对等雾网和雾网池协作，使用基于
    DRL 的更合适且可靠的算法。


    ## III. 架构概述


    在本节中，我们提出了一种高层架构，作为我们在 VFC 中计算卸载和服务缓存方案设计的基石。


    - **架构层级。** 所提架构如图 1 所示，它包含三层：端设备 (ED)、雾网层和云层。

    - **端设备：** 在 VFC 场景下，端设备主要是车辆和汽车。它们通常具有本地计算和存储资源，可以管理诸如机器学习和视频处理等高计算量任务的需求。

    - **雾网层：** 该层由一组雾服务器（如路侧单元 RSU）组成，这些服务器之间互相连接。这些雾服务器提供中等的计算能力和容量，不仅处理它们自身的任务，还接收来自端设备的卸载任务。它们分布密集，并覆盖整个区域。

    - **云层（Cloud）。** 云层通常拥有丰富的计算和存储资源，可以处理高计算需求的任务。在我们的系统中，雾网池连接了雾服务器中的计算资源和缓存服务。


    卸载方法。在我们的架构中，我们的目标是通过引入两种类型来利用计算和缓存卸载：对等雾协作和雾网池协作。


    - 对等雾协作（Peer-fog cooperation）。在对等雾场景下，计算资源有限的端设备可以将任务卸载到雾网池中的雾服务器。然而，由于雾网池中的计算资源有限，这可能会引入额外成本。在这种情况下，任务将卸载到资源丰富的云端，导致更高的成本。这样，在计算卸载和通信之间存在权衡。

    - 雾网池协作（Fog-pool cooperation）：在雾网池协作场景下，雾服务器可以相互通信并互相帮助。雾网的资源可以处理来自端设备的异构请求。


    服务缓存（Service Caching）。基于 AR 的驾驶辅助多种应用包括目标识别和 3D 投影。为了执行这些任务，如图 1 所示，在雾网层进行服务缓存是必要的。鉴于缓存节点资源有限，缓存和存储数据库是不现实的。因此，一个关键问题是确定哪些服务应该被缓存。我们下一节中通过模型解决这个问题。


