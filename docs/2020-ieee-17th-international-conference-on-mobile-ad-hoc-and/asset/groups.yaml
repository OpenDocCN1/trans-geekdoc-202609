    of China under No. 6200137.


    # VII. CONCLUSION


    In this paper, we designed a vehicle network architecture to minimize the cost
    of task offloading and service delivery in terms of delay and energy consumption.
    Our architecture combines peer-and-fog-pool cooperation to optimize offloading
    while considering service delivery in the cache network.


    We employed a DRL algorithm called DDPG to solve the problem. Extensive simulation
    results prove effectiveness. For future work, we will explore social relationship
    between user terminals as well as aware services in the joint offloading framework.


