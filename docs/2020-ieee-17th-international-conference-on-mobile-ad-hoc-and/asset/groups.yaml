    ## D. Problem Formulation


    The main goal of our work is to design an offloading scheduling scheme for the
    fog environment to minimize processing time and long-term energy usage. The designed
    scheme optimizes offloading decisions O, service caching C, computational resource
    allocation M and the Fog-offloading capacity to minimize total cost and maximum
    of the system, we design to reduce the weighted-sum of end tasks offloading cost
    with weighted latency and energy costs:


    ```

    $\sum_{i \in T} \sum_{j \in J} (\lambda_{ij} T_{ij} + \mu_{ij} E_{ij})$

