    图 2：延迟和能量消耗的评估结果。另一方面，DDPG 算法在获取总和 RSU 计算资源方面优于 DQN。图 2(c) 描述了我们系统中总成本与 RSU 计算资源之间的关系。随着雾服务器计算能力的增加，DDPG、DQN
    和仅卸载方案的总成本降低，产生了更好的结果。本地策略由于不使用雾中的任何资源，成本最高。图 2(e) 表示了所有方案在雾服务器计算资源方面的延迟。本地和仅卸载方案显示它们不依赖于雾服务器的缓存容量。仅卸载方案的成本比其他方案低，因为雾服务器能够将任务分配给缓存服务；否则，它们需要从云端请求，导致成本增加。在
    DDPG、DQN 和仅卸载方案中，当雾服务器计算能力增加时，任务处理的延迟减少。然而，我们提出的方案比仅卸载方案性能更好。这是因为仅卸载方法不使用缓存，导致了较高的通信延迟。如果服务器对分配的任务没有所需的服务，它必须将任务卸载到远程云并产生卸载延迟。图
    2(f) 表示每个任务的平均能量消耗与 RSU 容量的关系。仅卸载方案的任务能量消耗最高。能量消耗与设备功耗以及通信和计算资源有关。DDPG 和 DQN 方案的能量消耗较低，卸载到雾服务器的任务未使用缓存，它们获得了稳定的值。DDPG
    和 DQN 方案的能量消耗随着 RSU 容量的增加而减少。评估结果显示深度强化学习算法在动态车辆环境中具有低总成本卸载策略优势。


