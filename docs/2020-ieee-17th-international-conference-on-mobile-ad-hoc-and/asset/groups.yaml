    ```


    $\tau$ represents updating parameters, with small values such as 0.1 or 0.01.
    $\theta$ is updated by the loss function:


    ```

    $J(\theta) = \frac{1}{m} \sum_{i=1}^{m} (y_i - Q(\hat{S}_i, A_i))^2 \quad (21)$

    ```


