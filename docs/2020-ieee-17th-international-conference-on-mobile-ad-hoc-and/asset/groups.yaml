    # VII. 结论


    在本文中，我们设计了一种车辆网络架构，以延迟和能量消耗最小化任务卸载和服务交付的成本。我们的架构结合了节点池协作，在考虑缓存网络服务交付的同时优化卸载。


    我们采用名为 DDPG 的 DRL 算法来解决该问题。大量的结果结果证明了有效性。在未来，我们将探索用户终端之间的社交关系以及联合卸载框架中的感知服务。


