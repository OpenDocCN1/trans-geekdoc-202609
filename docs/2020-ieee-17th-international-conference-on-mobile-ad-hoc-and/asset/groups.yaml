    automobiles. They usually have local computing and storage resources, which can
    manage the demand of high computation tasks such as machine learning and video
    processing.

    - **Fog-network layer:** This layer consists of a set of fog servers, such as
    RSUs, which interconnect with each other. These fog servers offer moderate computing
    and capacities, not only processing their own tasks but also receiving offloaded
    tasks from end devices. They are densely distributed and cover the entire area.

    - **Cloud.** The Cloud layer usually possesses abundant computing and storage
    resources, which can handle high computational tasks. In our system, the fog-pool
    network connects with computing resources and caching services in fog servers.


    Offloading Methods. In our architecture, we aim to utilize the computing and caching
    offloading by introducing two kinds: peer-fog cooperation and fog-pool cooperation.


    - Peer-fog cooperation. In the peer-fog scenario, the end devices with limited
    computing resources can offload tasks to the fog servers in the fog-pool. However,
    it may introduce extra cost because computing resources in the fog-pool are limited.
