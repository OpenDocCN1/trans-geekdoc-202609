  md: '# Deep Reinforcement Learning for Computation

    Offloading and Caching in Fog-Based Vehicular

    Networks


    Dapen Lam, Amin Taherkordi, and Frank Eliassen

    Department of Informatics

    University of Oslo

    Oslo, Norway

    (dapen.lamrost;frank@ifi.uio.no)


    Lei Liu

    State Key Library of Integrated Services

    Xidian University

    Xidian, China

    tntianjialulei@163.com


    **Abstract—**The fog of computing in vehicular networks is becoming significant,
    a variety of applications that demand high computing resources and low latency,
    such as connected and autonomous driving rely on computation offloading and service
    caching resource-intensive services in vehicular networks. Fog computing has a
    limited amount of computing resources. While computation offloading and caching
    can maximize the system performance time, the heterogeneity, density, and stochastic
    properties of vehicular networks pose challenges on resource allocation. In this
    paper, we propose an intelligent offloading architecture with service caching,
    considering both energy efficiency and the problem of computation offloading and
    service caching. For energy efficiency, we propose an algorithm based on deep
    reinforcement learning to solve this complex problem, ensuring feasibility of
    our proposal. The results show that our proposed scheme exhibits an effective
    performance improvement over others compared to the chosen baseline.


    nodes in vehicular networks. [11], [5]–8]. Vehicular users can offload tasks to
    the fog nodes with moderate computational resources to reduce latency. If the
    processing demands exceed the fog platforms'' capacity, they will be offloaded
    to the Cloud, which is relative to vertical offloading to other fog nodes, resulting
    in a horizontal offloading method.


    Moreover, offloaded tasks of vehicular users often depend on other services. For
    example, to ensure more accurate detections in driving-autonomous systems, high-resolution
    object detection is required. In detection, a fog node with sufficient computing
    resources is needed to process the sensor data, e.g., from video sensors and radar
    sensors. To make efficient, map services and related databases have to be cached
    in the fog node itself. However, if the fog node has not cached the requested
    services (i.e., map services) when offloaded (i.e., object detection), the tasks
    can be further offloaded to other fog nodes, affecting the quality of service
    delivery.


    ***Index Terms—**Vehicular computing, computation offloading, service caching,
    reinforcement learning.


    # I. INTRODUCTION


    With the emergence of advanced communication technologies, such as cloud computing
    and cellular networks, vehicular networks and applications are becoming applicable.
    The remarkable development of vehicular networks enables a large number of applications,
    such as augmented reality (AR) and autonomous driving, all with complex processing
    and high reliability requirements [1], [2]. However, offloading all tasks to the
    Cloud results in a heavy backend load and unacceptable latency [3]. Vehicular
    computing (VFC) (a.k.a. edge computing) has been proposed as a promising solution
    to solve the issues caused by computation from the remote cloud to fog


    Therefore, caching services is an important factor to achieve efficiency of tasks
    offloaded to fog nodes. Caching appears in two different forms: content caching
    and service caching. For example, content caching stores used-frequency media
    data in a fog to be used by the user [11]. Service caching stores the metadata
    of the program code and the related databases/files when performing computation
    tasks [14]–16. In an example in the scenario, the maps needed for object detection
    are cached in the fog node.


    The design of optimal computation offloading and service caching faces many challenges.
    The limited storage space makes it impractical for fog nodes to cache all the
