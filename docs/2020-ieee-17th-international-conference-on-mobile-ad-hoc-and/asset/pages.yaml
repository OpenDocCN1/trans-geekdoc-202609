    # II. RELATED WORK


    Task Offloading. Many efforts have been made to investi- gate offloading in mobile
    cloud computing [27], [28], mobile edge computing (MEC) and where- computing are
    mainly focused on how to offload tasks from end-to-end to the fog servers or to
    the cloud. Recently, many have studied various factors for task offloading in
    VFC. In the work [17], the authors proposed a method that can utilize VFC by partitioning
    and moving nodes using the queuing theory, to minimize the response latency. In
    the work [18], the authors designed a game-based algorithm to model task offloading
    in vehicular networks to reduce price anarchy to the Nash equilibrium.


    Some efforts have been made on computation offloading in fog computing [17–21],
    but they do not consider the service caching issue. A few works [14–16] have addressed
    the problem of computation offloading, including task optimization, local decision
    design, and service caching. However, compared to what we propose a more comprehensive
    system architecture that includes both fog-and-pool offloading, including task
    optimization and service caching management.


    Similarly, in the work [19] formulated task offloading in VFC considering the
    mobility of the vehicles and the delay of the workload, and solve the reliability
    reliability problem. In the work [25], the authors proposed a method for extra
    reliability and low latency V2 infrastructures using a multi-server and transmission
    latency in the network. The work [29] by considering the multi-edge server scenario.
    In [31], the authors found that the vehicles in the network can learn the task
    offloading policies from neighbors. This work further designs the offloading strategy
    and solves the optimization problem of minimizing the average latency.


    We design the deep policy gradient (DPG) [22] based on reinforcement learning
    (DRL) to achieve our goal.


    +   * We propose a fog-based vehicular architecture computation offloading with
    service caching. This architecture adopts fog-and-pool computation management
    to maximize system efficiency.

    * We formalize the optimization problem of joint computation offloading and service
    caching to reduce the task complexity.

    * We design the offloading strategies based on a algorithm, DPG [22], to obtain
    a solution to the formulated problem. The strategy allows efficient decision making
    for computation offloading and service caching.


