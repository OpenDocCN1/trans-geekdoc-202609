    \ of vehicles | N |\n| Computation capacity of RSU | 2 Cycles/sec |\n| Caching\
    \ capacity of RSU | 200 GB |\n| Local computing capacity | [300, 500]Cycles/sec\
    \ |\n| Storage units | 29.72 Cycles/bits |\n| Computation intensity for each task\
    \ | [2*10^2, 2*10^3] bits/sec\n\n**Input:** The initial state $S_0$ for available\
    \ resources, computing and caching capacities; the parameters about the tested\
    \ events; the initial parameters: $\theta_0, \\omega_0, \tau, m, n$; the target\
    \ network offloading capacity $Q$\n\n**Output:** optimal actor parameter $\theta$;\
    \ current optimal critic parameter $\\omega$; the optimal action for computing\
    \ and service caching:\n\n+   1. Initialize parameters: $i=0, \theta=\theta_0,\
    \ \\omega=\\omega_0$;\n2. Clear up memory set $D$;\n3. For $i$ from 1 to $T$:\n\
    4. Initialize environment state $S_i$, get $\\pi(S_i)$;\n5. Take action $A_i$,\
    \ get new state $S'$, reward $R$, and end index $end\\_idx$;\n6. Store $(S_i,\
    \ A_i, R, S', end\\_idx)$ in memory set;\n7. $S=S';\n8. Take samples from memory\
    \ set $D$, and calculate current target $Q$ if $end\\_idx=0$:\n9. $y_i = R_i +\
    \ \\gamma Q'(S', \\pi(S'))$;\n10. else $y_i = R_i$;\n11. Update critic network\
    \ parameter $\\omega$\n12. $J(\\omega) = \\sum_{i=1}^m (y_i - Q(s_i, a_i))^2$;n13.\
    \ Update actor network parameter $\theta$ by the policy gradient function (21):\n\
    14. If $T\\% < C$, update current actor and network parameters\n15. $\\omega \\\
    leftarrow \tau\\omega + (1-\tau)\\omega$;\n16. $\theta \\leftarrow \tau\theta\
    \ + (1-\tau)\theta$;\n17. If $S'$ is the end state, finish iteration, then;\n\
    18. go back to Step (4).\n\nRSUs are located in a $200 \times 200$ square area.\
    \ The distance between each vehicle and its associated RSU is within 100 meters.\
