    The rest of this paper is organized as follows: II discusses the related work
    on task offloading, service caching and AI-based task offloading. We present an
    architecture with service caching in Section III. In IV, we formulate the optimization
    problem of joint computation offloading and service caching is formulated. In
    V, the DRL algorithm leveraged to solve this problem is presented in Section V.
    Finally, the performance of our proposed system is evaluated in Section VI. We
    conclude the paper and future work in Section VII.


    Service Caching. Service caching, and its databases/files, are pre-stored in fog
    servers for faster access. This method reduces the latency and bandwidth consumption
    on acquiring services when related tasks are offloaded to fog servers. For instance,
    in the work [32], the authors use cache in the network to minimize the traffic
    loads. In [33] proposed a framework for request routing in MEC. It further utilized
    the edge cache to minimize the number of requests. More importantly, the work
    [34] take into account communication, computation and formulated the problem as
    a mixed-integer and nonconvex convex optimization.'
