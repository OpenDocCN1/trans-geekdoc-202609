    \nIn this section, we propose a high-level architecture which serves as a basis\
    \ for the design of our computation offloading and service caching scheme in VFC.\n\
    \n+   **Architectural Layers.** The proposed architecture is illustrated in Fig.\
    \ 1, which contains three layers: The End Device (ED), the Fog-Network layer,\
    \ and the Cloud layer.\n\n+   - **End Device:** In the VFC scenario, the end devices\
    \ are mainly vehicles and automobiles. The devices usually have local computing\
    \ and storage resources, which can hardly manage the demand of high computation\
    \ tasks such as machine learning and video processing.\n\n+   - **Fog-network\
    \ layer:** This layer consists of a set of fog servers, such as RSUs, which interconnect\
    \ with\n\neach other. These fog servers offer moderate computing and caching capacities,\
    \ not only processing their own tasks but also receiving offloaded tasks from\
    \ end devices. They are densely distributed and seamlessly cover the entire area.\n\
    \n+   - **Cloud.** The Cloud layer usually possesses abundant computing and storage\
    \ resources, which can handle high computational tasks. In our system, the fog-pool\
    \ network connects with computing resources and caching services in the fog servers.\
    \ However, despite the communication delay between end devices and the Cloud,\
    \ the Cloud layer processes real-time applications.\n\nOffloading Methods. In\
    \ our architecture, we aim to utilize the computing and caching offloading by\
    \ introducing two kinds of: peer-fog cooperation and fog-pool cooperation. The\
    \ peer-fog cooperation can fully utilize the resources of three layers in the\
    \ architecture while the fog-pool cooperation makes use of the fog pool.\n\nPeer-fog\
    \ cooperation. In the peer-fog cooperation scenario, the end devices with limited\
    \ computing resources can offload tasks to the fog servers in the fog-pool. However,\
    \ it may introduce extra communication cost. That is because computing resources\
    \ in the fog-pool are limited. In this case, tasks will be offloaded to the Cloud\
    \ with rich computing resources, resulting in higher cost. In this way, there\
    \ is a trade-off between computation offloading and communication costs. \n\n\
    +   - **Fog-pool cooperation:** In the fog-pool cooperation scenario, the fog\
    \ servers can communicate with each other and help each other, resulting in a\
    \ fog-based resource pool. The resources of the fog network are unevenly distributed\
    \ among the fog servers. This model of resource pool can handle the heterogeneous\
    \ requests from end devices and balance resource\n\n**Service Caching.** Various\
    \ applications may be implemented of AR-based driver assistance consisting of\
    \ object recognition and 3D projection. In order to execute these tasks, service\
    \ caching in the Fog-Network layer is necessary as mentioned above. In Fig. 1,\
    \ the services need to be cached in the Fog-Network layer. Given the limited resources\
    \ for caching on the fog nodes, it is impractical to cache and store databases/libraries\
    \ for all nodes. Thus, one key issue is to determine which services should be\
    \ cached. This will be addressed by our model in the next section."
