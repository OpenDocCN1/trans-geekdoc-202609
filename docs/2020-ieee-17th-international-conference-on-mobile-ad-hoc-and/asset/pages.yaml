    Figure 2(c) describes the relationship between the total cost and RSU computational
    resources in our system. The total cost of DDPG, DQN and Offloading-only schemes
    decreases as computational capacity increases because more computational resources
    in fog servers contribute to lower, resulting in better results. The Local policy
    has the highest cost as it does not use any resources in fog, as shown in this
    case.


    Figure 2(d) illustrates the effectiveness of caching capacity of fog servers on
    the total cost among all the schemes. Local and Offloading-only schemes show that
    they do not rely on caching capacity of fog servers. The Offloading-only scheme
    has a lower cost than others. This is because fog servers are able to assign the
    tasks to the caching services available; otherwise, they need to solicit from
    the Cloud, contributing to a higher cost. This is because when the capacity of
    fog servers is increased, more tasks can be processed on fog servers without offloading
    tasks to the remote Cloud, thereby reducing the total cost.


    Figure 2(e) represents the delay among all schemes in terms of the computational
    resources of fog servers. The Local policy exhibits the highest delay when executing
    tasks. In the DDPG, DQN and Offloading-only schemes, the delay for task processing
    is reduced when the computational capacity of fog servers increases. However our
    proposed scheme achieves better performance than the Offloading-only schemes.
    This is because the Offloading-only processing method does not use caching, which
    results in higher communication delay. If a server has no needed service(s) for
    the assigned task, it has to offload the task to the Remote Cloud with delay for
    offloading delay.


    Figure 2(f) represents the average energy consumption for each task versus RSU
    capacity. The offloading-only scheme has the highest energy consumption per task.
    The energy consumption is related to the power consumption of devices, and communication
    and computational resources. The DDPG and DQN schemes have lower energy consumption
