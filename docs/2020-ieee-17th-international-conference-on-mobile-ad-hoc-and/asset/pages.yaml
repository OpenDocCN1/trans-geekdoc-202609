    \ RSUs and their services makes it faster.\n\nFor each experiment, the caching\
    \ capacity is set to 200 GB. The local computing capacity of vehicles is unfinished\
    \ over the interval [300, 500] Cycles/sec. The computation intensity for each\
    \ task is 29.72 Cycles/bits. The computation for each task is offloaded to fog\
    \ services is uniformly distributed throughout the simulation.\n\n+   We use the\
    \ method with the following algorithms to control total cost, time and energy\
    \ cost:\n- DQN: This algorithm utilizes Q-Network to optimize computation offloading\
