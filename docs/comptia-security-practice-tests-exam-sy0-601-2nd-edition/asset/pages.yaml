- pgno: 27
  md: '1. Ahmed is a sales manager with a major insurance company. He has received
    an email that is encouraging him to click on a link and fill out a survey. He
    is suspicious of the email, but it does mention a major insurance association,
    and that makes him think it might be legitimate. Which of the following best describes
    this attack?


    +   - **A.** Phishing

    +   - **B.** Social engineering

    +   - **C.** Spear phishing

    +   - **D.** Trojan horse


    2. You are a security administrator for a medium-sized bank. You have discovered
    a piece of software on your bank’s database server that is not supposed to be
    there. It appears that the software will begin deleting database files if a specific
    employee is terminated. What best describes this?


    +   - **A.** Worm

    +   - **B.** Logic bomb

    +   - **C.** Trojan horse

    +   - **D.** Rootkit


    3. You are responsible for incident response at Acme Bank. The Acme Bank website
    has been attacked. The attacker used the login screen, but rather than enter login
    credentials, they entered some odd text: '' or ''1'' = ''1. What is the best description
    for this attack?


    +   - **A.** Cross-site scripting

    +   - **B.** Cross-site request forgery

    +   - **C.** SQL injection

    +   - **D.** ARP poisoning


    4. Users are complaining that they cannot connect to the wireless network. You
    discover that the WAPs are being subjected to a wireless attack designed to block
    their Wi-Fi signals. Which of the following is the best label for this attack?


    +   - **A.** IV attack

    +   - **B.** Jamming

    +   - **C.** WPS attack

    +   - **D.** Botnet


    5. Frank is deeply concerned about attacks to his company’s e-commerce server.
    He is particularly worried about cross-site scripting and SQL injection. Which
    of the following would best defend against these two specific attacks?


    +   - **A.** Encrypted web traffic

    +   - **B.** Input validation

    +   - **C.** A firewall

    +   - **D.** An IDS'
  merge: -1
  img_proc: true
