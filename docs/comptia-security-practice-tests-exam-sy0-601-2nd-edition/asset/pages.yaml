- pgno: 22
  md: '# Taking the Exam


    Once you are fully prepared to take the exam, you can visit the CompTIA website
    to purchase your exam voucher:


    ```

    www.comptiastore.com/Articles.asp?ID=265&category=vouchers

    ```


    CompTIA partners with Pearson VUE’s testing centers, so your next step will be
    to locate a testing center near you. In the United States, you can do this based
    on your address or your ZIP code, whereas non-U.S. test takers may find it easier
    to enter their city and country. You can search for a test center near you at
    the Pearson Vue website, where you will need to navigate to “Find a test center.”


    ```

    www.pearsonvue.com/comptia

    ```


    Now that you know where you’d like to take the exam, simply set up a Pearson VUE
    testing account and schedule an exam:


    ```

    home.pearsonvue.com/comptia/onvue

    ```


    On the day of the test, take two forms of identification, and make sure to show
    up with plenty of time before the exam starts. Remember that you will not be able
    to take your notes, electronic devices (including smartphones and watches), or
    other materials in with you, and that other requirements may exist for the test.
    Make sure you review those requirements before the day of your test so you’re
    fully prepared for both the test itself as well as the testing process and facility
    rules.


    # After the Security+ Exam


    Once you have taken the exam, you will be notified of your score immediately,
    so you’ll know if you passed the test right away. You should keep track of your
    score report with your exam registration records and the email address you used
    to register for the exam.


    # Maintaining Your Certification


    CompTIA certifications must be renewed on a periodic basis. To renew your certification,
    you can pass the most current version of the exam, earn a qualifying higher-level
    CompTIA or industry certification, or complete sufficient continuing education
    activities to earn enough continuing education units (CEUs) to renew it.


    CompTIA provides information on renewals via their website at:


    ```

    www.comptia.org/continuing-education

    ```


    When you sign up to renew your certification, you will be asked to agree to the
    CE program’s Code of Ethics, to pay a renewal fee, and to submit the materials
    required for your chosen renewal method.


    A full list of the industry certifications you can use to acquire CEUs toward
    renewing the Security+ can be found at:


    ```

    www.comptia.org/continuing-education/choose/renew-with-a-single-activity/earn-a-higher-level-comptia-certification

    ```'
  merge: -1
  img_proc: true
