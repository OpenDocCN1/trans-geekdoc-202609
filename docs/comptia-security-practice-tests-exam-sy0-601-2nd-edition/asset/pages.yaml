- pgno: 29
  md: '11. Teresa is the security manager for a mid-sized insurance company. She receives
    a call from law enforcement, telling her that some computers on her network participated
    in a massive denial-of-service (DoS) attack. Teresa is certain that none of the
    employees at her company would be involved in a cybercrime. What would best explain
    this scenario?


    +   A. It is a result of social engineering.

    +   B. The machines all have backdoors.

    +   C. The machines are bots.

    +   D. The machines are infected with crypto-viruses.


    12. Unusual outbound network traffic, geographical irregularities, and increases
    in database read volumes are all examples of what key element of threat intelligence?


    +   A. Predictive analysis

    +   B. OSINT

    +   C. Indicators of compromise

    +   D. Threat maps


    13. Chris needs visibility into connection attempts through a firewall because
    he believes that a TCP handshake is not properly occurring. What security information
    and event management (SIEM) capability is best suited to troubleshooting this
    issue?


    +   A. Reviewing reports

    +   B. Packet capture

    +   C. Sentiment analysis

    +   D. Log collection and analysis


    14. Chris wants to detect a potential insider threat using his security information
    and event management (SIEM) system. What capability best matches his needs?


    +   A. Sentiment analysis

    +   B. Log aggregation

    +   C. Security monitoring

    +   D. User behavior analysis


    15. Chris has hundreds of systems spread across multiple locations and wants to
    better handle the amount of data that they create. What two technologies can help
    with this?


    +   A. Log aggregation and log collectors

    +   B. Packet capture and log aggregation

    +   C. Security monitoring and log collectors

    +   D. Sentiment analysis and user behavior analysis


    16. What type of security team establishes the rules of engagement for a cybersecurity
    exercise?


    +   A. Blue team

    +   B. White team'
