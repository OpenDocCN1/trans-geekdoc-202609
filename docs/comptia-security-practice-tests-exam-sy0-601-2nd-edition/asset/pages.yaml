- pgno: 238
  md: '+   3. **B.** Vendor diversity gives two security benefits. The first is that
    there is no single point of failure should one vendor cease operations. The second
    benefit is that each vendor has a specific methodology and algorithms used for
    detecting malware. If you use the same vendor at all points where you need malware
    detection, any flaw or weakness in that vendor’s methodology will persist across
    the network. Using a single vendor means that any weakness in that vendor’s methodology
    or technology could impact the entire system or network. Vendor forking is not
    a term in the industry, and this is not a neutral act; vendor diversity improves
    security.


    +   4. **B.** In this scenario, the best fit to Scott’s needs is a second network
    attached storage (NAS) device with a full copy of the primary NAS. In a failure
    scenario, the secondary NAS can simply take the place of the primary NAS while
    individual disks or even the whole NAS is replaced. Tape-based backups take longer
    to restore, regardless of whether they are full or incremental backups, although
    incremental backups can take more time in some cases since swapping tapes in order
    can add time to the restoration process. Finally, a cloud-based backup system
    would be useful if Scott was worried about a local disaster but would be slower
    than a local identical NAS, thus not meeting Scott’s primary requirement.


    +   5. **C.** Restoration order can be very important in a complex environment
    due to system dependencies. Restoration order can also ensure that the proper
    security controls are in place before systems are online. A datacenter should
    be able to handle systems coming online without failing if its power systems are
    properly designed. A second outage due to failed systems would mean that Yasmine
    has not determined why the outage has occurred, making restoration potentially
    dangerous or problematic. Finally, fire suppression systems should only activate
    for an actual fire or when fire precursors like smoke are detected, not for increased
    heat load.


    +   6. **B.** Air gapping refers to the server not being on a network. This means
    literally that there is “air” between the server and the network. This prevents
    malware from infecting the backup server. A separate VLAN or physical network
    segment can enhance security but is not as effective as air gapping. A honeypot
    is used to detect attacks against a network, but it doesn’t provide effective
    defense against malware in this scenario.


    +   7. **C.** Windows picture passwords require you to click on specific locations
    on a picture. This is an example of a something-you-can-do factor. Geolocation
    or a network location are examples of somewhere you are, whereas something you
    exhibit is often a personality trait, and someone you know is exactly what it
    sounds like: someone who can identify you as an individual.


    +   8. **C.** Hash functions convert variable-length inputs into fixed-length
    outputs while minimizing the chances of multiple inputs, resulting in the same
    output (collisions). They also need to be fast to compute. Hashes should not be
    reversible; they are a one-way function!


    +   9. **B.** The most common way to ensure that third-party secure destruction
    companies perform their tasks properly is to sign a contract with appropriate
