  md: '**140. C.** This is an example of an online brute-force dictionary attack.
    Dictionary attacks use common passwords as well as common substitutions to attempt
    to break into a system or service. Back-off algorithms that lock out attackers
    after a small number of incorrect password attempts can help slow or stop dictionary
    attacks and other brute-force password attacks. Rainbow tables are tables of precomputed
    hashes. The birthday attack is a method for generating collisions of hashes. Finally,
    no spoofing is indicated in this scenario.


    **141. C.** Jim has discovered a skimmer, a device used for skimming attacks that
    capture credit and debit card information. Skimmers may be able to wirelessly
    upload the information they capture, or they may require attackers to retrieve
    data in person. Some skimmers include cameras to capture keystrokes for PINs and
    other data. A replay attack would reuse credentials or other information to act
    like a legitimate user, a race condition occurs when the time of use and time
    of check of data can be exploited, and a card cloner would be used after cards
    were skimmed to duplicate them.


    **142. D.** Active reconnaissance connects to the network using techniques such
    as port scanning. Both active and passive reconnaissance can be done manually
    or with tools. Black-box and white-box refer to the amount of information the
    tester is given. Attackers and testers use both types of reconnaissance.


    **143. D.** Browser toolbars are sometimes examples of PUPs, or potentially unwanted
