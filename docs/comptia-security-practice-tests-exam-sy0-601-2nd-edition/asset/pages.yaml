    +   16. **B.** White teams act as judges and observers during cybersecurity exercises.
    Blue teams act as defenders, red teams act as attackers, and purple teams are
    composed of both blue and red team members to combine attack and defense knowledge
    to improve organizational security.


    +   17. **A.** The simplest way to ensure that APIs are only used by legitimate
    users is to require the use of authentication. API keys are one of the most frequently
    used methods for this. If an API key is lost or stolen, the key can be invalidated
    and reissued, and since API keys can be matched to usage, Cynthia’s company can
    also bill customers based on their usage patterns if they want to. A firewall
    or IP restrictions may be able to help, but they can be fragile; customer IP addresses
    may change. An intrusion prevention system (IPS) can detect and prevent attacks,
    but legitimate usage would be hard to tell from those who are not customers using
    an IPS.


    +   18. **B.** Buffer overflow attacks cram more data into a field or buffer than
    they can accept, overflowing into other memory locations and either crashing the
    system or application, or potentially allowing code to be inserted into executable
    locations. Bluesnarfing and bluejacking are both Bluetooth attacks. Cross-site
    scripting attacks allow attackers to inject scripts into pages viewed by other
    users.


    +   19. **A.** Attackers are attempting to influence Gurvinder with a combination
    of scarcity and urgency. Thus, for this question you should answer scarcity since
    urgency is not listed. In many social engineering principle questions, more than
