- pgno: 33
  md: '+   - **C.** An unknown environment test

    +   - **D.** Threat test


    **33.** You work for a security company that performs penetration testing for
    clients. You are conducting a test of an e-commerce company. You discover that
    after compromising the web server, you can use the web server to launch a second
    attack into the company’s internal network. What best describes this?


    +   - **A.** Internal attack

    +   - **B.** Known environment testing

    +   - **C.** Unknown environment testing

    +   - **D.** A pivot


    **34.** While investigating a malware outbreak on your company network, you discover
    something very odd. There is a file that has the same name as a Windows system
    DLL, and it even has the same API interface, but it handles input very differently,
    in a manner to help compromise the system, and it appears that applications have
    been attaching to this file, rather than the real system DLL. What best describes
    this?


    +   - **A.** Shimming

    +   - **B.** Trojan horse

    +   - **C.** Backdoor

    +   - **D.** Refactoring


    **35.** Which of the following capabilities is not a key part of a SOAR (security
