  md: '# About the Author


    David Seidl is vice president for information technology and CIO at Miami University,
    where he is responsible for IT for Miami University. During his IT career, he
    has served in a variety of technical and information security roles, including
    serving as the senior director for Campus Technology Services at the University
    of Notre Dame, where he co-led Notre Dame’s move to the cloud and oversaw cloud
    operations, ERP, databases, identity management, and a broad range of other technologies
    and service. Prior to his senior leadership roles at Notre Dame, he served as
    Notre Dame’s director of information security and led Notre Dame’s information
    security program. He taught information security and networking undergraduate
    courses as an instructor for Notre Dame’s Mendoza College of Business and has
    written books on security certification and cyberwarfare, including coauthoring
    CISSP (ISC)² Official Practice Tests (Sybex, 2018) as well as the current and
    previous editions of the CompTIA CySA+ Study Guide: Exam CS0-002 (Wiley, 2020,
    Chapple/Seidl) and CompTIA CySA+ Practice Tests: Exam CS0-002 (Wiley, 2020, Chapple/Seidl).


    David holds a bachelor’s degree in communication technology and a master’s degree
    in information security from Eastern Michigan University, as well as CISSP, CySA+,
    Pentest+, GPEN, and GCIH certifications.'
