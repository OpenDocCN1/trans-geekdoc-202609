- pgno: 20
  md: '# Introduction


    CompTIA Security+ Practice Tests: Exam SY0-601, Second Edition is the perfect
    companion volume to the CompTIA Security+ Study Guide: Exam SY0-601, Eighth Edition
    (Wiley, 2020, Chapple/Seidl). If you’re looking to test your knowledge before
    you take the Security+ exam, this book will help you by providing a combination
    of 1,100 questions that cover the Security+ domains and easy-to-understand explanations
    of both right and wrong answers.


    If you’re just starting to prepare for the Security+ exam, we highly recommend
    that you use the CompTIA Security+ Study Guide, Eighth Edition to help you learn
    about each of the domains covered by the Security+ exam. Once you’re ready to
    test your knowledge, use this book to help find places where you may need to study
    more or to practice for the exam itself.


    Since this is a companion to the Security+ Study Guide, this book is designed
    to be similar to taking the Security+ exam. The book itself is broken up into
    seven chapters: five domain-centric chapters with questions about each domain,
    and two chapters that contain 100-question practice tests to simulate taking the
    Security+ exam itself.


    If you can answer 90 percent or more of the questions for a domain correctly,
    you can feel safe moving on to the next chapter. If you’re unable to answer that
    many correctly, reread the chapter and try the questions again. Your score should
    improve.


    ![](img/a9d117a1cc3b6e0dee61fc3cc6c7b63e_20_0.png)


    Don’t just study the questions and answers! The questions on the actual exam will
    be different from the practice questions included in this book. The exam is designed
    to test your knowledge of a concept or objective, so use this book to learn the
    objectives behind the questions.


    # The Security+ Exam


    The Security+ exam is designed to be a vendor-neutral certification for cybersecurity
    professionals and those seeking to enter the field. CompTIA recommends this certification
    for those currently working, or aspiring to work, in roles, including:


    +   - Systems administrator

    +   - Security administrator

    +   - Security specialist

    +   - Security engineer

    +   - Network administrator

    +   - Junior IT auditor/penetration tester

    +   - Security consultant'
  merge: -1
  img_proc: true
