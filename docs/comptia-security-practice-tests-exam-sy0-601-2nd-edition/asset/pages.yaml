  md: '+   27. Which of the following best describes a collection of computers that
    have been compromised and are being controlled from one central point?

    +      A. Zombienet

    +      B. Botnet

    +      C. Nullnet

    +      D. Attacknet


    +   28. Selah includes a question in her procurement request-for-proposal process
    that asks how long the vendor has been in business and how many existing clients
    the vendor has. What common issue is this practice intended to help prevent?

    +      A. Supply chain security issues

    +      B. Lack of vendor support

    +      C. Outsourced code development issues

    +      D. System integration problems


    +   29. John is conducting a penetration test of a client’s network. He is currently
    gathering information from sources such as archive.org, netcraft.com, social media,
    and information websites. What best describes this stage?

    +      A. Active reconnaissance

    +      B. Passive reconnaissance

    +      C. Initial exploitation

    +      D. Pivot


    +   30. Alice wants to prevent SSRF attacks. Which of the following will not be
    helpful for preventing them?

    +      A. Removing all SQL code from submitted HTTP queries

    +      B. Blocking hostnames like 127.0.01 and localhost

    +      C. Blocking sensitive URLs like /admin

    +      D. Applying whitelist-based input filters


    +   31. What type of attack is based on entering fake entries into a target network’s
    domain name server?

    +      A. DNS poisoning

    +      B. ARP poisoning

    +      C. XSS poisoning

    +      D. CSRF poisoning


    +   32. Frank has been asked to conduct a penetration test of a small bookkeeping
    firm. For the test, he has only been given the company name, the domain name for
    their website, and the IP address of their gateway router. What best describes
    this type of test?

    +      A. A known environment test

    +      B. External test'
