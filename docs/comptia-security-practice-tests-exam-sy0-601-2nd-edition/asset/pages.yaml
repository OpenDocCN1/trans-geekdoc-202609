    times an event will occur in a year. Wayne has estimated that the risk event that
    is being assessed will happen three times a year.


    +   106. **D.** Although humans can create fires or floods, industrial accidents
    are the only item on the list that are exclusively person-made disasters.


    +   107. **C.** Information on a website made available to customers is typically
    classified as public information because it is easily available and intentionally
    exposed to them. Confidential, sensitive, or critical information is unlikely
    to be exposed to customers without a specific data handling agreement and additional
    security layers.


    +   108. **D.** Data processors are service providers that process data for data
    controllers. A data controller or data owner is the organization or individual
    who collects and controls data. A data steward carries out the intent of the data
    controller and is delegated responsibility for the data. Data custodians are those
    who are entrusted with the data to store, manage, or secure the data.


    +   109. **D.** Data masking partially redacts sensitive data by replacing some
    or all information in a sensitive data field with blanks or other replacement
    characters. Tokenization replaces sensitive data with unique identifiers using
    a lookup table. Hashing performs a one-way function on a value to get a unique
    hash, and encryption protects data using an algorithm that can be reversed to
    restore the original data while allowing for confidentiality and integrity validation.


    +   110. **C.** The Cloud Security Alliance’s reference architecture includes
    information about tools in a vendor-neutral manner. CIS provides vendor specific
    benchmarks for AWS, Azure, and Oracle’s cloud offerings. The International Organization
    for Standardization (ISO) and the National Institute of Standards and Technology
    (NIST) do not offer this type of resource.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '111. C. Locks are physical controls. An example of a managerial control would
    be a policy or practice, a technical control can include things like firewalls
    or antivirus, and corrective controls are put in place to ensure that a problem
    or gap in another control is fixed.


    112. C. Control risk is a term used in public accounting. It is the risk that
    arises from a potential lack of internal controls within an organization that
    may cause a material misstatement in the organization’s financial reports. In
    this case, the lack of controls that would validate the financial system’s data
    and function is a control risk.


    113. C. Although fires, oil spills, and wars are all potential examples of person-made
    disasters, hurricanes remain solely a natural disaster. Some disasters could be
    either a person-made or natural disaster. For example, fires can be caused by
    humans or by nature, as can floods, and even chemical spills when an earthquake
    occurs.


    114. C. Confidential information is classified by the U.S. government as information
    that requires some protection and that if disclosed without authorization, would
    cause identifiable harm to national security. Top Secret information requires
    the highest degree of protection and would cause exceptionally grave harm if exposed
    without authorization. Secret information requires a substantial degree of protection
    and would cause serious damage if exposed. Business Sensitive is not a U.S. government
    classification but is a term commonly used in businesses.


    115. C. Phone numbers uniquely identify individuals, making them an example of
    personally identifiable information, or PII. PHI is protected health information,
    financial information includes financial records of all types, and government
    information is information that belongs to the government or may be classified
    by the government and entrusted to an organization.


    116. B. Tokenization is an ideal option for this scenario. Tokenization replaces
    a sensitive value with an alternative value that can be looked up in a table when
    the value needs to be referenced back to its original form. Encryption does not
    meet this need, data masking only hides part of the value, and data washing is
    not a commonly used term for techniques of this nature.


    117. C. Privacy notices are often included on websites to meet the requirements
    of laws or regulations like the General Data Protection Regulation (GDPR) or state
    privacy laws.


    118. C. Nicole is a data controller, sometimes called a data owner. She determines
    the reasons for processing personal information and how it is processed. A data
    steward carries out the intents of the data controller, data custodians are charged
    with safeguarding information, and data consumer is not a common data privacy
    role.


    119. B. This is an internal disaster—one in which internal issues have led to
    a problem. An external disaster would be caused by forces outside the organization
    like a natural disaster, malicious activity, or other outside forces. An RTO,
    or recovery time objective, is not a type of disaster, and a MRO disaster was
    made up for this question.


    120. C. Minimizing the amount of data that is collected is the first step in ensuring
    that organizations can handle the volume and types of data that they work with.
    After that, classifying it and then determining how long you retain it are also
    important parts of the data life cycle.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '121. D. Kirk has mitigated the risk to his organization by increasing the resources
    targeted by the DoS attack in an attempt to ensure that the attack will not be
    successful. Acceptance would involve simply letting the attacks occur knowing
    they are likely to stop, avoidance might involve finding a way to ensure the attacks
    cannot occur, and transfer could leverage a third-party mirror or anti-DoS hosting
    service.


    122. A. A multiparty risk involves multiple organizations. Since there are multiple
    customers and organizations involved, this is an example of multiparty risk. An
    internal risk originates inside an organization—instead, this is an external risk.
    A legacy system risk is created by a system or process that is no longer supported
    or updated. An intellectual property (IP) theft risk occurs when proprietary information
    or trade secrets might be exposed or lost.


    123. B. EOL, or end of life, occurs when a service or system is no longer supported,
    available, or does not function. Natasha needs to plan to transition smoothly
    away from the service, either to a replacement service or to stop using the service
    itself. An MOU is a memorandum of understanding, and an NDA is a nondisclosure
    agreement, neither of which is directly relevant here. A last will and testament
    is not used for a service EOL.


    124. C. The Center for Internet Security (CIS) provides a wide range of OS, application,
    server, and other benchmarks. Microsoft provides benchmarks for their own operating
    systems but does not provide Linux benchmarks. The National Institute of Standards
    and Technology (NIST) does not provide benchmarks, but the National Security Agency
    (NSA) does.


    125. C. Offboarding processes are conducted to ensure that accounts and access
    is removed and that materials, computers, and data are all recovered from the
    staff member when a member of an organization leaves. Exit interviews are an HR
    process, job rotation helps to prevent an individual from conducting fraudulent
    activities over time, and governance helps to manage and maintain data by establishing
    high level control over the processes, procedures, and classification of the data
    an organization uses.


    126. D. Public, private, sensitive, confidential, critical, and proprietary are
    all commonly used data classification labels for business. Secret, however, is
    more commonly used in government classification schemes.


    127. D. Privacy notices are frequently provided as part of license or contractual
    terms, as well as in website usage agreements.'
  merge: -1
  img_proc: true
