    are a way to connect to services inside a cloud provider without an Internet gateway.
    Finally, instance awareness is a concept that means that tools know about the
    differences between instances, rather than treating each instance in a scaling
    group as the same. This can be important during incident response processes and
    security monitoring for scaled groups, where resources may all appear identical
    without instance awareness.


