  md: '+   205. **C.** The code is an example of a PowerShell script that downloads
    a file into memory. You can rule out the upload options by reading the script
    since it mentions a download in the script example. Since we see a string being
    downloaded, rather than a file and location, you may be able to guess that this
    is a fileless malware example.


    +   206. **C.** Session IDs should be unique for distinct users and systems. A
    very basic type of session replay attack involves providing a victim with a session
    ID and then using that session ID once they have used the link and authenticated
    themselves. Protections such as session time-outs and encrypting session data,
    as well as encoding the source IP, hostname, or other identifying information
    in the session key, can all help prevent session replay attacks.


    +   207. **B.** The Security+ exam outline lists seven major impact categories,
    including data loss, data breaches, and data exfiltration. Data modification is
    not listed, but it is a concern as part of the integrity leg of the CIA triad.


    +   208. **C.** Academic journals are the slowest of the items listed because
    of the review processes involved with most reputable journals. Although academic
    journals can be useful resources, they are typically not up-to-the-minute sources.
    Other resources you should be aware of are vendor websites, conferences, social
    media, and RFCs (requests for comments).


    +   209. **C.** Vulnerability scans and port scans can often be detected in logs
    by looking for a series of ports being connected to. In this case, the log was
    created by scanning a system with an OpenVAS scanner. There is no indication of
    a successful login or other hacking attempt, and a service startup would show
    in the messages log, not the auth log. A reboot would also show in the messages
    log rather than the auth log.


    +   210. **C.** Although it may be tempting to immediately upgrade, reading and
    understanding the CVEs for a vulnerability is a good best practice. Once Charles
    understands the issue, he can then remediate it based on the recommendations for
    that specific problem. Disabling PHP or the web server would break the service,
    and in this case, only newer versions of PHP than 5.4 have the patch Charles needs.


    +   211. **D.** Although 80 and 443 are the most common HTTP ports, it is common
    practice to run additional web servers on port 8080 when a nonstandard port is
    needed. SSH would be expected to be on port 22, RDP on 3389, and MySQL on 3306.


    +   212. **B.** Once this issue is remediated, Rick should investigate why the
    system was running a plug-in from 2007. In many cases, when you discover a vulnerable
