  - 总结
- - '##'
  - 除了美学，这种实践的政治意义是什么？当今的新媒体艺术提供了最后的堡垒之一，用于进行既拥抱技术又反对技术乌托邦主义和技术决定论的研究。毫无疑问，只要给予时间和资源，AI
    技术将越来越多地提供改善日常生活的产品和服务，而且消费者市场很快将充斥自动驾驶汽车、自主健康系统以及处理枯燥任务的有用机器人。然而，正如近期社交媒体危机所示，新技术的往往与公共利益背道而驰。历史真正的挑战不是技术进步：这是一个成为的过程，关乎我们想要作为一个物种开发什么样的人类特质，以及我们想要实现的各种。
