    Rule-based machine learning is a general term for any machine learning method
    that identifies, learns, or evolves “rules” to store, manipulate or apply knowledge.
    The defining characteristic of a rule-based machine learning algorithm is the
    identification and utilization of a set of relational rules that collectively
    represent the knowledge captured by the system. This is in contrast to other machine
    learning algorithms that commonly identify a singular model that can be universally
    applied to any instance in order to make a prediction. Rule-based machine learning
    approaches include learning classifier systems, association rule learning, and
    artificial immune systems.


    For example, the rule {onions, potatoes} => {burger} found in the sales data of
    a supermarket would indicate that if a customer buys onions and potatoes together,
