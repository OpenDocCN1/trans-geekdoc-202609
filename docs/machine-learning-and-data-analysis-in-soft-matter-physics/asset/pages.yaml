- pgno: 193
  md: 'Let’s take an example to understand how LSTM works. Here we have two sentences
    separated by a full stop. The first sentence is “Bob is a nice person,” and the
    second sentence is “Dan, on the Other hand, is evil”. It is very clear, in the
    first sentence, we are talking about Bob, and as soon as we encounter the full
    stop(,) we started talking about Dan.


    As we move from the first sentence to the second sentence, our network should
    realize that we are no more talking about Bob. Now our subject is Dan. Here, the
    Forget gate of the network allows it to forget about it. Let’s understand the
    roles played by these gates in LSTM architecture.


    # # Forget Gate


    In a cell of the LSTM neural network, the first step is to decide whether we should
    keep the information from the previous time step or forget it. Here is the equation
    for forget gate.


    ```

    f_t = σ(x_t * U_t + H_{t-1} * W_f)

    ```


    Let’s try to understand the equation, here


    +   - X_t: input to the current timestamp.

    +   - U_f: weight associated with the input

    +   - H_{t-1}: The hidden state of the previous timestamp

    +   - W_f: It is the weight matrix associated with the hidden state


    Later, a sigmoid function is applied to it. That will make f_t a number between
    0 and 1. This f_t is later multiplied with the cell state of the previous timestamp,
    as shown below.


    ```

    C_{t-1} * f_t = 0 ....if f_t = 0 (forget everything)

    C_{t-1} * f_t = C_{t-1} ....if f_t = 1 (forget nothing)

    ```


    # # New Information


    Now the new information that needed to be passed to the cell state is a function
    of a hidden state at the previous timestamp t-1 and input x at timestamp t. The
    activation function here is tanh. Due to the tanh function, the value of new information
    will be between -1 and 1. If the value of Nt is negative, the information is subtracted
    from the cell state, and if the value is positive, the information is added to
    the cell state at the current timestamp.'
  merge: -1
  img_proc: true
