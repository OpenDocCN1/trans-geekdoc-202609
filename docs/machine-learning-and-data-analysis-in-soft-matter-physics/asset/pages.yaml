  md: '# 4. Distribution-Based Clustering:-


    Until now, the clustering techniques as we know them are based on either proximity
    (similarity/distance) or composition (density). There is a family of clustering
    algorithms that take a totally different metric into consideration – probability.


    Distribution-based clustering creates and groups data points based on their likely
    hood of belonging to the same probability distribution (Gaussian, Binomial, etc.)
    in the data.


    ![](img/c4a53cbbd40023d194b7887dddf3293b_115_0.png)


    It is a probability-based distribution that uses statistical distributions to
    cluster the data objects. The cluster includes data objects that have a higher
    probability to be in it. Each cluster has a central point, the higher the distance
    to the data point from the central point, the lesser will be its probability to
    get included in the cluster.


    A major drawback of density and boundary-based approaches is in specifying the
    clusters apriori to some of the algorithms and mostly the definition of the shape
    of the clusters for most of the algorithms. There is at least one tuning or hyper-parameter
    which needs to be selected and not only that is trivial but also any inconsistency
    in that would lead to unwanted results.


    Distribution-based clustering has a vivid advantage over the proximity and centroid-based
    clustering methods in terms of flexibility, correctness, and shape of the clusters
    formed. The major problem however is that these clustering methods work well only
    with synthetic or simulated data or with data where most of the data points most
    certainly belong to a predefined distribution, if not, the results will overfit.'
