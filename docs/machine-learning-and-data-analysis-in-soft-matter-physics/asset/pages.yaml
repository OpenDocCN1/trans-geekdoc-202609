    +   Random forest: Random forest is another flexible supervised machine learning
    algorithm used for both classification and regression purposes. The “forest” references
    a collection of uncorrelated decision trees, which are then merged together to
    reduce variance and create more accurate data predictions.


    # 3.1.3 Supervised Learning Examples


    Supervised learning models can be used to build and advance a number of business
    applications, including the following:


    +   Image-and object-recognition: Supervised learning algorithms can be used to
    locate, isolate, and categorize objects out of videos or images, making them useful
    when applied to various computer vision techniques and imagery analysis.


    +   Predictive analytics: A widespread use case for supervised learning models
    is in creating predictive analytics systems to provide deep insights into various
    business data points. This allows enterprises to anticipate certain results based
    on a given output variable, helping business leaders justify decisions or pivot
    for the benefit of the organization.


    +   Customer sentiment analysis: Using supervised machine learning algorithms,
    organizations can extract and classify important pieces of information from large
    volumes of data—including context, emotion, and intent—with very little human
    intervention. This can be incredibly useful when gaining a better understanding
    of customer interactions and can be used to improve brand engagement efforts.


    +   Spam detection: Spam detection is another example of a supervised learning
    model. Using supervised classification algorithms, organizations can train databases
    to recognize patterns or anomalies in new data to organize spam and non-spam-related
    correspondences effectively.'
