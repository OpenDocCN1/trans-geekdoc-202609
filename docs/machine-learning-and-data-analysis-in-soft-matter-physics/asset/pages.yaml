    # Self-learning


    Self-learning, as a machine learning paradigm was introduced in 1982 along with
    a neural network capable of self-learning, named *crossbar adaptive array* (CAA).
    It is learning with no external rewards and no external teacher advice. The CAA
    self-learning algorithm computes, in a crossbar fashion, both decisions about
    actions and emotions (feelings) about consequence situations. The system is driven
    by the interaction between cognition and emotion. The self-learning algorithm
    updates a memory matrix W = ||w(a,s)|| such that in each iteration executes the
    following machine learning routine:


    +   - in situation s perform action a

    +   - receive consequence situation s''

    +   - compute emotion of being in consequence situation v(s'')

    +   - update crossbar memory w''(a,s) = w(a,s) + v(s'')


    It is a system with only one input, situation, and only one output, action (or
    behavior) a. There is neither a separate reinforcement input nor an advice input
    from the environment. The back propagated value (secondary reinforcement) is the
    emotion toward the consequence situation. The CAA exists in two environments,
    one is the behavioral environment where it behaves, and the other is the genetic
    environment, wherefrom it initially and only once receives initial emotions about
    situations to be encountered in the behavioral environment. After receiving the
    genome (species) vector from the genetic environment, the CAA learns a goal-seeking
    behavior, in an environment that contains both desirable and undesirable situations.


