  md: '# 3.1.1 How Supervised Learning Works


    Supervised learning uses a training set to teach models to yield the desired output.
    This training dataset includes inputs and correct outputs, which allow the model
    to learn over time. The algorithm measures its accuracy through the loss function,
    adjusting until the error has been sufficiently minimized.


    Supervised learning can be separated into two types of problems when data mining—classification
    and regression:


    +   Classification uses an algorithm to accurately assign test data into specific
    categories. It recognizes specific entities within the dataset and attempts to
    draw some conclusions on how those entities should be labeled or defined. Common
    classification algorithms are linear classifiers, support vector machines (SVM),
    decision trees, k-nearest neighbor, and random forest, which are described in
    more detail below.


    +   Regression is used to understand the relationship between dependent and independent
    variables. It is commonly used to make projections, such as for sales revenue
    for a given business. Linear regression, logistic regression, and polynomial regression
    are popular regression algorithms.


    # 3.1.2 Supervised Learning Algorithms


    Various algorithms and computations techniques are used in supervised machine
    learning processes. Below are brief explanations of some of the most commonly
    used learning methods, typically calculated through use of programs like R or
    Python:


    +   **Neural networks:** Primarily leveraged for deep learning algorithms, neural
    networks process training data by mimicking the interconnectivity of the human
    brain through layers of nodes. Each node is made up of inputs, weights, a bias
    (or threshold), and an output. If that output value exceeds a given threshold,
    it “fires” or activates the node, passing data to the next layer in the network.
    Neural networks learn this mapping function through supervised learning, adjusting
    based on the loss function through the process of gradient descent. When the cost
    function is at or near zero, we can be confident in the model’s accuracy to yield
    the correct answer.


    +   **Naive bayes:** Naive Bayes is classification approach that adopts the principle
    of class conditional independence from the Bayes'
