  md: 'The basic principle of the algorithm is to assign the data points to the specified
    clusters recursively by shifting points towards the peak or highest density of
    data points. It is used in the image segmentation process.


    # Algorithm:


    +   - Step 1 – Creating a cluster for every data point

    +   - Step 2 – Computation of the centroids

    +   - Step 3 – Update the location of the new centroids

    +   - Step 4 – Moving the data points to higher density regions, iteratively.

    +   - Step 5 – Terminates when the centroids reach a position where they don’t
    move further.


    # 3. Gaussian Mixture Model


    The gaussian mixture model (GMM) is a distribution-based clustering technique.
    It is based on the assumption that the data comprises Gaussian distributions.
    It is a statistical inference clustering technique. The probability of a point
    being a part of a cluster is inversely dependent on distance, as the distance
    from distribution increases, the probability of a point belonging to the cluster
    decreases. The GM model trains the dataset and assumes a cluster for every object
    in the dataset. Later, a scatter plot is created with data points with different
    colors assigned to each cluster.


    GMM determines probabilities and allocates them to data points in the ‘K’ number
    of clusters. Each of which has three parameters: Mean, Covariance and mixing probability.


    The optimization function initiates the randomly selected Gaussian parameters
    and checks whether the hypothesis belongs to the chosen cluster. Then, the maximization
    step updates the parameters to fit the points into the cluster. The algorithm
    aims at raising the likelihood of the data sample associated with the cluster
    distribution which states that the cluster distributions have high peaks (closely
    connected cluster data) and the mixture model captures the dominant pattern data
    objects by component distribution).


    # 4. DBSCAN


    DBSCAN – Density-Based Spatial Clustering of Applications with Noise identifies
    discrete groups in data. The algorithm aims to cluster the'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'data as contiguous regions having high point density. Each cluster is separated
    from the others by points of low density. In simpler words, the cluster covers
    the data points that fit the density criteria which is the minimum number of data
    objects in a given radius.


    # Terms used in DBSCAN:


    +   - **Core**: Point having least points within the distance from itself

    +   - **Border**: Point having at least one core point from a given distance.

    +   - **Noise**: Having less than m points within a given distance. This point
    is neither the core nor the border.

    +   - **minPts**: A threshold value of a minimum number of points that considers
    the cluster to be dense.

    +   - **eps ε**: The distance measure used to put the points in the region of
    any other data point.

    +   - **Reachability**: Density distribution identifying whether a point is reachable
    from other points if it lies at a distance eps from it.

    +   - **Connectivity**: Transitivity-based chaining approach that establishes
    the location of any point in a specified cluster.


    For implementing DBSCAN, we first begin with defining two important parameters
    – a radius parameter eps (ε) and a minimum number of points within the radius
    (m).


    ![](img/c4a53cbbd40023d194b7887dddf3293b_120_0.png)


    +   - The algorithm starts with a random data point that has not been accessed
    before and its neighborhood is marked according to ε.

    +   - If this contains all the m minimum points, then cluster formation begins
    – hence marking it as “visited” – if not, then it is labeled as “noise” for that
    iteration, which can get changed later.'
