  md: '![](img/c4a53cbbd40023d194b7887dddf3293b_227_0.png)


    Figure 9: Graphical representation of the multi-objective reward function.


    # Transition Probability Function


    Given the state, $s_v$, at the current time step, the agent needs to select the
    action, $a_v$, within the action space, that will lead to the largest value, $Q(s_t,
    a_t)$, where $Q(s_t, a_t)$, is defined as the total expected future reward if
    $a_t$ is chosen. The transition probability function, also called the value function,
    maps state-action tuples, $(s_t, a_t)$, to values for each action. If $Q(s_t,
    a_t)$, is known for all actions at a given state, then selecting the argmax($a_t$)
    is the best action. However, even for a simple representation of the TO environment
    with 6x6 topologies, the number of possible states for a single load case is large
    (≈6.87×10^10) which makes the value function challenging to model. Therefore,
    $Q(s_t, a_t)$ is approximated using a deep neural network (DNN). The value function
    is found using the Double Q-learning algorithm , as shown in Eq. (9):


    ```

    $Q(s_t, a_t) = r(s_t, a_t) + \gamma max_a Q(s_{t+1}, argmax Q(s_{t+1}, a_t))$

    (9)

    ```


    where $r(s_v, a_v)$ is the reward for taking the action, $a_v$ at the current
    state, $s_v$ and $G$ is the future reward discount factor. Double Q learning uses
    two DNN models, a main and an auxiliary model. The main model selects the action
    to take by predicting the action with the largest value, $Q(s_t, a_t)$. The auxiliary
    model predicts the value of the next state if that maximum value action was taken,
    $max_a Q''(s_{t+1}, argmax Q(s_{t+1}, a_t))$. The auxiliary model helps to address
    the overestimation of future value,'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'which is commonly seen in the generic Q learning algorithm. This change in
    Double Q learning has been shown to improve algorithm stability .


    The main and auxiliary models consist of four convolutional neural networks (CNN)
    layers, each with a varying number of 3x3 convolutional filters. The results for
    each layer are passed through a ReLU activation function before proceeding to
    the subsequent layer. The CNN architecture, shows that the agent''s NxNx3 observation
    of the current state is passed through four convolutional layers comprising 16,
    8, 4, and 1 convolutional filters to produce an output of the predicted value
    of taking each action. The action associated with the highest value is selected,
    and the element corresponding to that action is removed, resulting in a new topology
    and corresponding next observation.


    ![](img/c4a53cbbd40023d194b7887dddf3293b_228_0.png)


    Figure 10: Deep convolutional neural network architecture.


    # 7.4.2 Training the Agent


    Earlier section defined the TO problem as an MDP, and therefore, the RL agent
    should be able to learn to design optimized topologies. The agent''s performance
    is dependent on its ability to approximate the value function in Eq. (9). The
    agent needs to undergo episodic interactions with the proposed environment to
    collect experiences and update its DNN weights for better value approximations.
    The DNN weights are updated to minimize the error between the agent''s prediction
    of Q(s_t, a_t) and the actual value, which is realized after the agent has taken
    a_t. An episode in this environment is defined as a sequence of element removal
    actions starting at the initial solid block topology and continuing until one
    of the illegal moves of Fig. 8 is made. In this section, ''training'' means the
    agent''s episodic interactions with the environment to collect experiences to
    improve value predictions. During training, so long as the agent does not attempt
    to remove a bounded, loaded, or voided element, the agent can continue to take
    actions to remove elements from the topology until a non-singular body is ultimately
    produced.'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'All training was completed on a 6x6 topology size to limit the computational
    cost of running the FEAs needed to produce the first observation channel at each
    step. The RL agent is trained to design topologies with randomly generated load
    cases to ensure thorough state-space exploration. The load cases were introduced
    for each episode by randomly assigning two elements on the exterior edge of the
    topology to act as bounded elements. A bounded element was represented by providing
    a static displacement boundary condition on the two exterior nodes of the selected
    element. If a corner element was selected, the single exterior corner node was
    assigned the boundary condition. Additionally, a single element was randomly selected
    to serve as the loaded element.


    The selected element could be any random element in the 6x6 topology that was
    not already selected to serve as a bounded element. The direction (horizontal
    or vertical) and type (tensile or compressive) of the load were also randomly
    selected. If the selected element was exterior, the load was distributed between
    the two exterior elemental nodes. If a corner element was selected, the load was
    applied to the singular exterior corner node. Finally, if the element was in the
    interior, the load was randomly distributed between two elemental nodes defining
    one of the edges.


    A fundamental dilemma of RL training is the tradeoff between exploration and exploitation.
    The agent explores the environment by taking random actions to compile diverse
    experiences needed to build a sufficiently accurate mapping between actions and
    values. However, to ensure efficiency, the agent should not strictly rely on random
    actions and instead should exploit the value mappings it has already learned.
    Therefore, to balance proper exploration and exploitation, random behavior should
    be more frequently used at the beginning of training when the value predictions
    are poor. As training continues and the value predictions improve, random behavior
    should be replaced by exploiting the maximum value action, argmax(a.). This method
    is referred to as the ε -greedy method . The probability of taking a random is
    dependent on a decaying ε value. At the start of the training process, the ε value
    is 1 and decays for each episode following Eq. (10):


    ```

    ε = max(1 - E · ε_decay, ε_min) (10)

    ```


    where ε_decay is the rate at which ε decreases per episode (ε_decay=3.5e-4) until
    ε reaches its minimal allowable value, ε_min (ε_min=0.01), and ε is the current
    episode number. ε_min is greater than zero to ensure exploration continues during
    the later stages of training.'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'Whether randomly or strategically taken, the action will remove the corresponding
    element. This action will lead to a new topology and, using FEA, a new observation
    will be produced. Based on the results of the FEA, the agent will receive a reward
    for taking that action. After each action, the previous observation, new observation,
    action, and reward are recorded in a replay buffer. Taking advantage of topological
    symmetry, set the agent to store the equivalent x and y-axis flipped observations,
    corresponding flipped actions, and reward in the replay buffer. This technique
    allowed four experiences to be captured from a single FEA call for each step and
    is essentially a simple data augmentation method. Once an episode is complete
    and the buffer size is at least 128, a batch of 128 past experiences is randomly
    selected to train the DNN. The main model weights were updated using the stochastic
    gradient descent ADAM optimizer with a learning rate of 2.5e-3. The auxiliary
    model weights are replaced with the current main model weights after every 100
    episodes to maintain relevant value predictions. A flowchart of a training episode
