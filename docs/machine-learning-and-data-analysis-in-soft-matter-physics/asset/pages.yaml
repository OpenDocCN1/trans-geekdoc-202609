  md: 'n entries. Let those data-points be p₁,p₂,.........,pₙ. This could be closing
    prices of a stock. The mean over the last k data-points (days in this example)
    is denoted as


    SMAₖ and calculated as:


    SMAₖ = \frac{1}{k} \sum_{i=n-k+1}^{n} pᵢ

    = \frac{1}{k} \left( p_{n-k+2} + \dots + p_n + p_{n+1} + \underbrace{p_{n-k+1}
    - p_{n-k+1}}_{=0} \right)

    = \frac{1}{k} \left( \sum_{i=n-k+2}^{n+1} p_i \right) - \frac{p_{n-k+1}}{k} +
    \frac{p_{n+1}}{k}

    = \underbrace{\frac{1}{k} \left( p_{n-k+1} + p_{n-k+2} + \dots + p_n \right)}_{=SMA_{k,
    prev}} - \frac{p_{n-k+1}}{k} + \frac{p_{n+1}}{k}

    = SMA_{k, prev} + \frac{1}{k} \left( p_{n+1} - p_{n-k+1} \right)


    This means that the moving average filter can be computed quite cheaply on real
    time data with a FIFO / circular buffer and only 3 arithmetic steps.


    During the initial filling of the FIFO / circular buffer the sampling window is
    equal to the data-set size thus k=n and the average calculation is performed as
    a cumulative moving average.


    The period selected k depends on the type of movement of interest, such as short,
    intermediate, or long-term.


    If the data used are not centered around the mean, a simple moving average lags
    behind the latest datum by half the sample width. An SMA can also be disproportionately
    influenced by old data dropping out or new data coming in. One characteristic
    of the SMA is that if the data has a periodic fluctuation, then applying an SMA
    of that period will eliminate that variation (the average always containing one
    complete cycle). But a perfectly regular cycle is rarely encountered.


    For a number of applications, it is advantageous to avoid the shifting induced
    by using only “past” data. Hence a central moving average can be computed, using
    data equally spaced on either side of the point in the series where the mean is
    calculated. This requires using an odd number of points in the sample window.


    A major drawback of the SMA is that it lets through a significant amount of the
    signal shorter than the window length. Worse, it actually inverts it. This can
    lead to unexpected artifacts, such as peaks in the smoothed result appearing where
    there were troughs in the data. It also'
