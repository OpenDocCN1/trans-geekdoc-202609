    plt.ylabel(irisdata["feature_names"][1])

    plt.title("Two features from the iris dataset")

    plt.show()


    # Show the principal components

    pca = PCA().fit(X)

    print("Principal components:")

    print(pca.components_)


    # Remove PC1

    Xmean = X - X.mean(axis=0)

