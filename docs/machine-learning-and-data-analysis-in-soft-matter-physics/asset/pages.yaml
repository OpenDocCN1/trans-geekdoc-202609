    # 2.3.2 Wavelet Transforms


    The discrete wavelet transform (DWT) is a linear signal processing technique that,
    when applied to a data vector X, transforms it to a numerically different vector,
    X'', of wavelet coefficients. The two vectors are of the same length. When applying
    this technique to data reduction, we consider each tuple as an n-dimensional data
    vector, that is, X = (x₁, x₂ ... xₙ), depicting n measurements made on the tuple
    from n database attributes.


    “How can this technique be useful for data reduction if the wavelet transformed
    data are of the same length as the original data?” The usefulness lies in the
    fact that the wavelet transformed data can be truncated. A compressed approximation
    of the data can be retained by storing only a small fraction of the strongest
    of the wavelet coefficients. For example, all wavelet coefficients larger than
    some user-specified threshold can be retained. All other coefficients are set
    to 0. The resulting data representation is therefore very sparse, so that operations
    that can take advantage of data sparsity are computationally very fast if performed
    in wavelet space. The technique also works to remove noise without smoothing out
    the main features of the data, making it effective for data cleaning as well.
    Given a set of coefficients, an approximation of the original data can be constructed
    by applying the inverse of the DWT used.


    The DWT is closely related to the discrete Fourier transform (DFT), a signal processing
    technique involving sines and cosines. In general, however, the DWT achieves better
    lossy compression. That is, if the same number of coefficients is retained for
    a DWT and a DFT of a given data vector, the DWT version will provide a more accurate
    approximation of the original data. Hence, for an equivalent approximation, the
    DWT requires less space than the DFT.


    There is only one DFT, yet there are several families of DWTs. Figure 1 shows
    some wavelet families. Popular wavelet transforms include the Haar-2, Daubechies-4,
    and Daubechies-6 transforms. The general procedure for applying a discrete wavelet
    transform uses a hierarchical pyramid algorithm that halves the data at each iteration,
    resulting in fast computational speed. The method is as follows:'
