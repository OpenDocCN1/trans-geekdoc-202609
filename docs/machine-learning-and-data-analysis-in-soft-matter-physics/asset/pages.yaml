  md: '# # UNSUPERVISED LEARNING TECHNIQUES


    # ## INTRODUCTION


    Unsupervised learning, also known as unsupervised machine learning, uses machine
    learning algorithms to analyze and cluster unlabeled datasets. These algorithms
    discover hidden patterns or data groupings without the need for human intervention.
    Its ability to discover similarities and differences in information make it the
    ideal solution for exploratory data analysis, cross-selling strategies, customer
    segmentation, and image recognition.


    # ### 4.1 CLUSTERING ALGORITHMS FOR PATTERN RECOGNITION AND DATA EXPLORATION


    Clustering is a technique for identifying similarity groups in data, called clusters.
    i.e., it groups data instances that are similar to (near) each other in one cluster
    and data instances that are very different (far away) from each other into different
    clusters. Clustering is often called an unsupervised learning task as no class
    values denoting an a priori grouping of the data instances are specified beforehand,
    as is done in supervised learning. Due to historical reasons, clustering is often
    considered synonymous with unsupervised learning.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 4.1.1 What is Clustering?


    Clustering or Cluster analysis is the method of grouping the entities based on
    similarities. Defined as an unsupervised learning problem that aims to make training
    data with a given set of inputs but without any target values. It is the process
    of finding similar structures in a set of unlabeled data to make it more understandable
    and manipulative.


    It reveals subgroups in the available heterogeneous datasets such that every individual
    cluster has greater homogeneity than the whole. In simpler words, these clusters
    are groups of like objects that differ from the objects in other clusters.


    In clustering, the machine learns the attributes and trends by itself without
    any provided input-output mapping. The clustering algorithms extract patterns
    and inferences from the type of data objects and then make discrete classes of
    clustering them suitably.


    ![](img/c4a53cbbd40023d194b7887dddf3293b_111_0.png)


    # 4.1.2 Types of Clustering Methods


    Clustering helps in performing surface-level analyses of the unstructured data.
    The cluster formation depends upon different parameters like shortest distance,
    graphs, and density of the data points. Grouping into clusters is conducted by
    finding the measure of similarity between the objects based on some metric called
    the similarity measure. It is easier to find similarity measures in a lesser number
    of features. Creating similarity measures becomes a complex process as the number
    of features increases. Different types of clustering approaches in data mining
    use different methods to group the data from the datasets. The various types of
    clustering are:


    +   - Connectivity-based Clustering (Hierarchical clustering)

    +   - Centroids-based Clustering (Partitioning methods)'
