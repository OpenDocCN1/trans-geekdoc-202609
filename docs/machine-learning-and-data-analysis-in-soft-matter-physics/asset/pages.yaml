    are used as pseudo-labels for the particles. These pseudo-labels are essentially
    the model’s estimated locations and trajectories for the particles in the unlabeled
    images.


    +   4. **Incorporation of Pseudo-labels**: The pseudo-labeled data is combined
    with the original labeled dataset, creating a larger, augmented dataset with both
