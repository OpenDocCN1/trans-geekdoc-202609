  md: '# REINFORCEMENT LEARNING


    # INTRODUCTION


    Reinforcement learning is a machine learning training method based on rewarding
    desired behaviors and/or punishing undesired ones. In general, a reinforcement
    learning agent is able to perceive and interpret its environment, take actions
    and learn through trial and error.


    In reinforcement learning, developers devise a method of rewarding desired behaviors
    and punishing negative behaviors. This method assigns positive values to the desired
    actions to encourage the agent and negative values to undesired behaviors. This
    programs the agent to seek long-term and maximum overall reward to achieve an
    optimal solution.


    These long-term goals help prevent the agent from stalling on lesser goals. With
    time, the agent learns to avoid the negative and seek the positive. This learning
    method has been adopted in artificial intelligence (AI) as a way of directing
    unsupervised machine learning through rewards and penalties.


    # 7.1 REINFORCEMENT LEARNING AND ITS APPLICATION IN SOFT MATTER PHYSICS


    Reinforcement learning is the closest to human learning as digital systems and
