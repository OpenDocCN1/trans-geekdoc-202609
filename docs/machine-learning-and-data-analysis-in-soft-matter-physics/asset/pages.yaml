    # One-Hot Encoding


    Categorical values (often referred to as nominal) such as gender, seasons, pets,
    brand names, or age groups often require transformation, depending on the ML algorithm
    used. For example, decision trees can work with categorical data. However, many
    others need the introduction of additional artificial categories with a binary
    representation.'
