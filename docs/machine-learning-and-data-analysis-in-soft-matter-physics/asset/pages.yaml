    1. **Connectivity-based Clustering (Hierarchical Clustering):**- Hierarchical
    clustering, also known as connectivity-based clustering, is based on the principle
    that every object is connected to its neighbors depending on their proximity distance
    (degree of relationship). The clusters are represented in extensive hierarchical
    structures separated by a maximum distance required to connect the cluster parts.
    The clusters are represented as Dendrograms, where X-axis represents the objects
    that do not merge while Y-axis is the distance at which clusters merge. The similar
    data objects have minimal distance falling in the same cluster, and the dissimilar
    data objects are placed farther in the hierarchy. Mapped data objects correspond
    to a Cluster amid discrete qualities concerning the multidimensional scaling,
    quantitative relationships among data variables, or cross-tabulation in some aspects.
    The hierarchical clustering may vary in the data flow chosen in the following
    categories.


    # *Divisive Approach*


    This approach of hierarchical clustering follows a top-down approach where we
    consider that all the data points belong to one large cluster and try to divide
    the data into smaller groups based on a termination logic or a point beyond which
    there will be no further division of data points. This termination logic can be
    based on the minimum sum of squares of error inside a cluster, or for categorical
    data, the metric can be the GINI coeficient inside a cluster.


    Hence, iteratively, we are splitting the data, which was once grouped as a single
    large cluster, into “n” number of smaller clusters to which the data points now
    belong. It must be taken into account that this algorithm is highly “rigid” when
    splitting the clusters – meaning, once a clustering is done inside a loop, there
    is no way that the task can be undone.


    # *Agglomerative Approach*


    Agglomerative is quite the contrary to Divisive, where all the “N” data points
    are considered to be a single member of “N” clusters that the data'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'is comprised into. We iteratively combine these numerous “N” clusters to a
    fewer number of clusters, let’s say “k” clusters, and hence assign the data points
    to each of these clusters accordingly. This approach is a bottom-up one, and also
    uses a termination logic in combining the clusters. This logic can be a number-based
    criterion (no more clusters beyond this point) or a distance criterion (clusters
    should not be too far apart to be merged) or a variance criterion (increase in
    the variance of the cluster being merged should not exceed a threshold, Ward Method)


    # 2. Centroid-based or Partition Clustering:-


    Centroid-based clustering is the easiest of all the clustering types in data mining.
    It works on the closeness of the data points to the chosen central value. The
    datasets are divided into a given number of clusters, and a vector of values references
    every cluster. The input data variable is compared to the vector value and enters
    the cluster with minimal difference.


    Pre-defining the number of clusters at the initial stage is the most crucial yet
    most complicated stage for the clustering approach. Despite the drawback, it is
    a vastly used clustering approach for surfacing and optimizing large datasets.
    The K-Means algorithm lies in this category.


    These groups of clustering methods iteratively measure the distance between the
    clusters and the characteristic centroids using various distance metrics. These
    are either Euclidian distance, Manhattan Distance or Minkowski Distance.


    ![](img/c4a53cbbd40023d194b7887dddf3293b_113_0.png)'
