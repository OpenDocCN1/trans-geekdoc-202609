    # 8.2.5 Sampling and Thermodynamics


    MD time steps are on the order of one femtosecond (10^-15s), while configuration
    changes governing molecular function are often rare events that may take 10^-3
    to 10^3s. Even when the potential and the forces generated by single-protein folding
    and unfolding are evaluated quickly, simulating these processes by direct MD simulation
    may take years to centuries on a supercomputer. To avoid this sampling problem,
    ML methods can be employed to learn generation of equilibrium samples from \(\mu(x)\)
    more efficiently, or even to generate statistically independent samples in one
    shot.


    Learning to sample probability distributions is the realm of generative learning
    In the past few years, directed generative networks, such as variational autoencoders,
    generative adversarial networks, and flows, have received a particular surge of
    interest. Such networks are trained to'
