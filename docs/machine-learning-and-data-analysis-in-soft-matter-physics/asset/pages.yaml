  md: '![](img/c4a53cbbd40023d194b7887dddf3293b_132_0.png)


    The numpy array Xmean is to shift the features of X to centered at zero. This
    is required for PCA. Then the array value is computed by matrix-vector multiplication.


    The array value is the magnitude of each data point mapped on the principal axis.
    So if we multiply this value to the principal axis vector we get back an array
    pc1. Removing this from the original dataset X, we get a new array Xremove. In
    the plot we observed that the points on the scatter plot crumbled together and
    the cluster of each class is less distinctive than before. This means we removed
    a lot of information by removing the first principal component. If we repeat the
    same process again, the points are further crumbled:


    ```

    ... Remove PC2

    value = Xmean @ pca.components_[1]

    pc2 = value.reshape(-1,1) @ pca.components_[1].reshape(1,-1)

    Xremove = Xremove - pc2

    plt.scatter(Xremove[:,0], Xremove[:,1], c=y)

    plt.show()

    ```


    ![](img/c4a53cbbd40023d194b7887dddf3293b_132_1.png)'
