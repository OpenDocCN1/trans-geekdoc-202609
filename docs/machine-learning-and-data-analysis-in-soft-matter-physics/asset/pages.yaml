    Learning the embedding E is more difficult than learning P, as optimizing E by
    maximum likelihood or minimal regression error in latent space leads to a collapse
    of E to trivial, uninteresting solutions. This problem can be avoided by following
    a variational approach to approximating the leading terms of the spectral decomposition
    (Equation 10). The variational approach for conformation dynamics states that
    for dynamics obeying detailed balance, the eigenvalues \(\lambda_k\) of a propagator
    matrix P via any encoding y = E(x) are, in the statistical limit, lower bounds
