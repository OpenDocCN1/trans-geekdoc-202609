- pgno: 73
  md: '# 3. Feature Extraction


    Feature Extraction is the process of creating new features from existing ones
    to provide more relevant information to the machine learning model. This is done
    by transforming, combining, or aggregating existing features.


    # Types of Feature Extraction:


    +   1. Dimensionality Reduction: Reducing the number of features by transforming
    the data into a lower-dimensional space while retaining important information.
    Examples are PCA and t-SNE.

    +   2. Feature Combination: Combining two or more existing features to create
    a new one. For example, the interaction between two features.

    +   3. Feature Aggregation: Aggregating features to create a new one. For example,
    calculating the mean, sum, or count of a set of features.

    +   4. Feature Transformation: Transforming existing features into a new representation.
    For example, log transformation of a feature with a skewed distribution.


    # Benefits of Feature Extraction:


    +   1. Improves Model Performance: By creating new and more relevant features,
    the model can learn more meaningful patterns in the data.

    +   2. Reduces Overfitting: By reducing the dimensionality of the data, the model
    is less likely to overfit the training data.

    +   3. Improves Computational Efficiency: The transformed features often require
    fewer computational resources.

    +   4. Improves Model Interpretability: By creating new features, it can be easier
    to understand the model’s predictions.


    # 4. Feature Selection


    Feature Selection is the process of selecting a subset of relevant features from
    the dataset to be used in a machine-learning model. It is an important step in
    the feature engineering process as it can have a significant impact on the model’s
    performance.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Types of Feature Selection:


    +   - Filter Method: Based on the statistical measure of the relationship between
    the feature and the target variable. Features with a high correlation are selected.

    +   - Wrapper Method: Based on the evaluation of the feature subset using a specific
    machine learning algorithm. The feature subset that results in the best performance
    is selected.

    +   - Embedded Method: Based on the feature selection as part of the training
    process of the machine learning algorithm.


    # Benefits of Feature Selection:


    +   - Reduces Overfitting: By using only the most relevant features, the model
    can generalize better to new data.

    +   - Improves Model Performance: Selecting the right features can improve the
    accuracy, precision, and recall of the model.

    +   - Decreases Computational Costs: A smaller number of features requires less
    computation and storage resources.

    +   - Improves Interpretability: By reducing the number of features, it is easier
    to understand and interpret the results of the model.


    # 5. Feature Scaling


    Feature Scaling is the process of transforming the features so that they have
    a similar scale. This is important in machine learning because the scale of the
    features can affect the performance of the model.


    # Types of Feature Scaling:


    +   - Min-Max Scaling: Rescaling the features to a specific range, such as between
    0 and 1, by subtracting the minimum value and dividing by the range. Standard
    Scaling: Rescaling the features to have a mean of 0 and a standard deviation of
    1 by subtracting the mean and dividing by the standard deviation.

    +   - Robust Scaling: Rescaling the features to be robust to outliers by dividing
    them by the interquartile range.


    # Benefits of Feature Scaling:


    +   1. Improves Model Performance: By transforming the features to have a similar
    scale, the model can learn from all features equally and avoid being dominated
    by a few large features.'
  merge: -1
  img_proc: true
