    # # Recursive


    A recursive neural network is created by applying the same set of weights recursively
    over a differentiable graph-like structure by traversing the structure in topological
    order. Such networks are typically also trained by the reverse mode of automatic
    differentiation. They can process distributed representations of structure, such
    as logical terms. A special case of recursive neural networks is the RNN whose
    structure corresponds to a linear chain. Recursive neural networks have been applied
    to natural language processing. The Recursive Neural Tensor Network uses a tensor-based
    composition function for all nodes in the tree.


    # # Neural history compressor


    The neural history compressor is an unsupervised stack of RNNs. At the input level,
    it learns to predict its next input from the previous inputs. Only unpredictable
    inputs of some RNN in the hierarchy become inputs to the next higher level RNN,
    which therefore recomputes its internal state only rarely. Each higher level RNN
    thus studies a compressed representation of the information in the RNN below.
    This is done such that the input sequence can be precisely reconstructed from
    the representation at the highest level.


    The system effectively minimizes the description length or the negative logarithm
    of the probability of the data. Given a lot of learnable predictability in the
    incoming data sequence, the highest level RNN can use supervised learning to easily
    classify even deep sequences with long intervals between important events.


    It is possible to distill the RNN hierarchy into two RNNs: the “conscious” chunker
    (higher level) and the “subconscious” automatizer (lower level). Once the chunker
    has learned to predict and compress inputs that are unpredictable by the automatizer,
    then the automatizer can be forced in the next learning phase to predict or imitate
    through additional units the hidden units of the more slowly changing chunker.
    This makes it easy for the automatizer to learn appropriate, rarely changing memories
    across long intervals. In turn, this helps the automatizer to make many of its
    once unpredictable inputs predictable, such that the chunker can focus on the
    remaining unpredictable events.'
