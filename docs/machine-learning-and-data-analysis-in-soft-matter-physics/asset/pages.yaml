    # 7.2 REINFORCEMENT LEARNING REVEALS FUNDAMENTAL LIMITS ON THE MIXING OF ACTIVE
    PARTICLES


    Mixing is crucial in applications ranging from large-scale chemical processes
    in industries such as petroleum or food down to microscopic scales, including
    microfluidic applications in medicine.


    However, microscopic mixing is challenging because microscale systems are typically
    drag-dominated, therefore, efficient mixing strategies are not obvious.


    While current microfluidic solutions exist for microscopic mixing and material
    transport, they rely on external pumps, prefabricated device geometries, and (active)
    additives so that they are limited in their reconfigurability. In contrast, natural
    cells use the self-organization of interacting components to make microscopic
    transport and mixing more compact and energy-efficient.


    To better understand nature, and to replicate it for applications, researchers
    started to study so-called active matter. Here, active matter refers to systems
    of proteins or other particles that continuously consume energy to achieve non-equilibrium
    dynamics, which can self-organize to achieve specific tasks.


    In particular, recent work suggested using active matter to achieve macroscopic
    tasks, such as generating fluid flows, flow rectification, and equilibration of
    glassy systems. The unsolved scientific challenge is how to assemble the existing
    (microscopic) active matter systems to achieve macroscopic results such as mixing
    and material transport.


