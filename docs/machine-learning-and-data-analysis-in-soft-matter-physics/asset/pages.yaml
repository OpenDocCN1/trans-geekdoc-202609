  md: 'A generative model partially overcame the vanishing gradient problem of automatic
    differentiation or backpropagation in neural networks in 1992. In 1993, such a
    system solved a “Very Deep Learning” task that required more than 1000 subsequent
    layers in an RNN unfolded in time.


    # Second order RNNs


    Second order RNNs use higher order weights w_jk instead of the standard w_ij weights,
    and states can be a product. This allows a direct mapping to a finite-state machine
    both in training, stability, and representation. Long short-term memory is an
    example of this but has no such formal mappings or proof of stability.


    # 6.5 LONG SHORT-TERM MEMORY


    Long short-term memory (LSTM) is a deep learning system that avoids the vanishing
    gradient problem. LSTM is normally augmented by recurrent gates called “forget
    gates”.


    LSTM prevents backpropagated errors from vanishing or exploding. Instead, errors
    can flow backwards through unlimited numbers of virtual layers unfolded in space.
    That is, LSTM can learn tasks that require memories of events that happened thousands
    or even millions of discrete time steps earlier.


    Problem-specific LSTM-like topologies can be evolved. LSTM works even given long
    delays between significant events and can handle signals that mix low and high
    frequency components.


    Many applications use stacks of LSTM RNNs and train them by Connectionist Temporal
    Classification (CTC) to find an RNN weight matrix that maximizes the probability
    of the label sequences in a training set, given the corresponding input sequences.
    CTC achieves both alignment and recognition. LSTM can learn to recognize context-sensitive
    languages unlike previous models based on hidden Markov models (HMM) and similar
    concepts.


    # LSTM Architecture


    In the introduction to long short-term memory, we learned that it resolves the
    vanishing gradient problem faced by RNN, so now, we will see how'
