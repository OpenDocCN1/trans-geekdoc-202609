    # 5.3 TRAINING AND OPTIMIZATION TECHNIQUES FOR DEEP LEARNING MODELS


    Deep learning relies on optimization methods. Training a complicated deep learning
    model, on the other hand, might take hours, days, or even weeks. The training
    efficiency of the model is directly influenced by the optimization algorithm''s
    performance. Understanding the fundamentals of different optimization algorithms
    and the function of their hyperparameters, on the other hand, will allow us to
    modify hyperparameters in a targeted manner to improve deep learning model performance.


    # The Goal of Optimization in Deep Learning


    Although optimization may help deep learning by lowering the loss function, the
    aims of optimization and deep learning are fundamentally different. The former
    is more focused on minimizing an objective, whereas the latter is more concerned
    with finding a good model given a finite quantity of data.


    Training error and generalization error, for example, vary in that the optimization
    algorithm''s objective function is usually a loss function based on the training
    dataset, and the purpose of optimization is to minimize training error. Deep learning
    (or, to put it another way, statistical inference) aims to decrease generalization
    error. In order to'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'achieve the latter, we must be aware of over fitting as well as use the optimization
    procedure to lower the training error.


    The optimization process involves the following key steps:


    +   1. **Initialization**: The model''s parameters are initialized randomly or
    using predefined methods before training begins.

    +   2. **Forward Propagation**: Input data is passed through the neural network,
    and the model makes predictions based on the current parameter values.

    +   3. **Loss Calculation**: The loss function is computed to quantify the error
    between the model''s predictions and the true target values.

    +   4. **Backpropagation**: The gradients of the loss function with respect to
    each parameter are computed using the chain rule of calculus. This step determines
    how much each parameter contributes to the overall loss.

    +   5. **Parameter Update**: The optimization algorithm updates the parameters
    based on the computed gradients. The goal is to adjust the parameters in a way
    that decreases the loss, moving the model closer to the optimal parameter values.

    +   6. **Repeat**: Steps 2 to 5 are repeated for multiple iterations or epochs
    until the model converges to a point where the loss is minimized and the model''s
    predictions are accurate.


    The optimization process is often iterative and computationally intensive, especially
    for deep neural networks with numerous parameters. Therefore, various optimization
    algorithms and techniques, such as stochastic gradient descent (SGD), momentum,
    adaptive learning rates, and regularization, are used to speed up convergence,
    improve stability, and prevent over fitting.


    By optimizing the deep learning model, the goal is to create a model that can
    generalize well to new, unseen data, accurately solving the problem it was designed
    for. This allows deep learning models to excel in various tasks, such as image
    recognition, natural language processing, speech recognition, and much more, making
    them powerful tools in modern artificial intelligence applications.


    # Gradient Descent Deep Learning Optimizer


    Gradient Descent is the most common optimizer in the class. Calculus is used in
    this optimization process to make consistent changes to the'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'parameters and reach the local minimum. Before you go any further, you might
    be wondering what a gradient is?


    Consider that you are holding a ball that is lying on the rim of a bowl. When
    you lose the ball, it travels in the steepest direction until it reaches the bowl''s
    bottom. A gradient directs the ball in the steepest way possible to the local
    minimum, which is the bowl''s bottom.


    Gradient descent works with a set of coefficients, calculates their cost, and
    looks for a cost value that is lower than the current one. It shifts to a lesser
    weight and updates the values of the coefficients. The procedure continues until
    the local minimum is found. A local minimum is a point beyond which it is impossible
    to go any farther.


    For the most part, gradient descent is the best option. It does, however, have
    significant drawbacks. Calculating the gradients is time-consuming when the data
    is large. For convex functions, gradient descent works well, but it doesn''t know
    how far to travel down the gradient for non-convex functions. Gradient descent
    works well for convex functions.


    # Stochastic Gradient Descent Deep Learning Optimizer


    On large datasets, gradient descent may not be the best solution. We use stochastic
    gradient descent to solve the problem. The word stochastic refers to the algorithm''s
    underlying unpredictability. Instead of using the entire dataset for each iteration,
    we use a random selection of data batches in stochastic gradient descent. As a
    result, we only sample a small portion of the dataset. The first step in this
    technique is to choose the starting parameters and learning rate. Then, in each
    iteration, mix the data at random to get an estimated minimum. When compared to
    the gradient descent approach, the path taken by the algorithm is full of noise
    since we are not using the entire dataset but only chunks of it for each iteration.
    As a result, SGD requires more iterations to attain the local minimum. The overall
    computing time increases as the number of iterations increases. However, even
    when the number of iterations is increased, the computation cost remains lower
    than that of the gradient descent optimizer. As a result, if the data is large
    and the processing time is a consideration, stochastic gradient descent should
    be favored over batch gradient descent.


    # Mini-batch Stochastic Gradient Descent


    Mini batch SGD straddles the two preceding concepts, incorporating the best of
    both worlds. It takes training samples at random from the'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'entire dataset (the so-called mini-batch) and computes gradients just from
    these. By sampling only a fraction of the data, it aims to approach Batch Gradient
    Descent. We require fewer rounds because we’re utilizing a chunk of data rather
    than the entire dataset. As a result, the mini-batch gradient descent technique
    outperforms both stochastic and batch gradient descent algorithms. This approach
    is more efficient and reliable than previous gradient descent variations. Because
    the method employs batching, all of the training data does not need to be placed
    into memory, making the process more efficient. In addition, the cost function
    in mini-batch gradient descent is noisier than that in batch gradient descent
    but smoother than that in stochastic gradient descent. Mini-batch gradient descent
    is therefore excellent and delivers a nice mix of speed and precision.


    Mini-batch SGD is the most often utilized version in practice since it is both
    computationally inexpensive and produces more stable convergence.


    # Adagrad (Adaptive Gradient Descent) Optimizer -


    Adagrad keeps a running total of the squares of the gradient in each dimension,
    and we adjust the learning rate depending on that total in each update. As a result,
    each parameter has a variable learning rate (or an adaptive learning rate). Furthermore,
    when we use the root of the squared gradients, we only consider the magnitude
    of the gradients, not the sign. We can observe that the learning rate is reduced
    when the gradient changes rapidly. The learning rate will be higher when the gradient
    changes slowly. Due to the monotonic growth of the running squared sum, one of
    Adagrad’s major flaws is that the learning rate decreases with time.


    # RMSprop (Root Mean Square) Optimizer


    Among deep learning aficionados, the RMS prop is a popular optimizer. This might
    be due to the fact that it hasn’t been published but is nonetheless well-known
    in the community. RMS prop is a natural extension of RPPROP’s work. The problem
    of fluctuating gradients is solved by RPPROP. The issue with the gradients is
    that some were modest while others may be rather large. As a result, establishing
    a single learning rate may not be the ideal option. RPPROP adjusts the step size
    for each weight based on the sign of the gradient. The two gradients are initially
    compared for signs in this technique.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Adam Deep Learning Optimizer


    Adam (short for Adaptive Moment Estimation) is a popular and highly effective
    optimization algorithm used in deep learning to update the model''s parameters
    during training. It combines the benefits of both stochastic gradient descent
    (SGD) and adaptive learning rate methods, making it a powerful and robust optimizer
    for a wide range of neural network architectures.


    The key idea behind the Adam optimizer is to adjust the learning rate for each
    parameter individually based on the historical information of the gradients and
    the squared gradients. This adaptability allows Adam to converge quickly and efficiently
    while handling sparse gradients and different scales of parameters.


    The optimization process in Adam involves the following steps:


    +   1. Initialization: The model''s parameters (weights and biases) and two momentum
    variables, m and v, are initialized to zero.


    +   2. Forward Propagation: Input data is passed through the neural network, and
    the model makes predictions based on the current parameter values.


    +   3. Loss Calculation: The loss function, which quantifies the error between
    the model''s predictions and the true target values, is computed.


    +   4. Backpropagation: The gradients of the loss function with respect to each
    parameter are computed using the chain rule of calculus.


    +   5. Parameter Update: The Adam optimizer updates the model''s parameters using
    the following formulas:


    ```

    m = beta1 * m + (1 - beta1) * gradient

    v = beta2 * v + (1 - beta2) * gradient^2

    m_hat = m / (1 - beta1^t) # Bias-corrected momentum estimate

    v_hat = v / (1 - beta2^t) # Bias-corrected squared gradient estimate

    parameter = parameter - learning_rate * m_hat / (sqrt(v_hat) + epsilon)

    ```


    where:


    +   parameter is a specific parameter of the model (weight or bias).


    +   learning_rate is the step size that controls the size of the parameter updates.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '+   * beta1 and beta2 are hyperparameters that control the exponential decay
    rates of the moving averages of the gradients and squared gradients, respectively.
    Typical values are 0.9 for beta1 and 0.999 for beta2.

    +   * m and v are the first and second moment estimates of the gradients and squared
    gradients, respectively.

    +   * m_hat and v_hat are the bias-corrected moment estimates, accounting for
    the fact that m and v are initialized to zero at the start of training.

    +   * t is the time step or iteration number, starting from 1.

    +   * epsilon is a small constant (e.g., 1e-8) added to the denominator to prevent
    division by zero.


    Adam has shown superior performance in various deep learning tasks and is widely
    used in state-of-the-art neural network architectures. Its adaptive learning rate
    mechanism, combined with momentum, makes it well-suited for handling sparse gradients,
    converging faster, and providing better generalization in complex optimization
    landscapes.


    # AdaDelta Deep Learning Optimizer


    AdaDelta can be seen as a more robust version of the AdaGrad optimizer. It is
    based upon adaptive learning and is designed to deal with significant drawbacks
    of AdaGrad and RMS prop optimizer. The main problem with the above two optimizers
    is that the initial learning rate must be defined manually. One other problem
    is the decaying learning rate which becomes infinitesimally small at some point.
    Due to this, a certain number of iterations later, the model can no longer learn
    new knowledge.


    ![](img/c4a53cbbd40023d194b7887dddf3293b_155_0.png)'
