    # 6.4.2 Architectures


    RNNs come in many variants.


    # Fully Recurrent


    Fully recurrent neural networks (FRNN) connect the outputs of all neurons to the
    inputs of all neurons. This is the most general neural network topology because
    all other topologies can be represented by setting some connection weights to
    zero to simulate the lack of connections between those neurons. The illustration
