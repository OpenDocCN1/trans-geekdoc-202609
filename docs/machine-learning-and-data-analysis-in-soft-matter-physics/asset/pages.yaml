  md: '# # TIME-SERIES ANALYSIS AND FORECASTING


    # ## INTRODUCTION


    Time series analysis is a way of studying the characteristics of the response
    variable with respect to time as the independent variable. To estimate the target
    variable in the name of predicting or forecasting, use the time variable as the
    point of reference. A Time-Series represents a series of time-based orders. It
    would be years, months, weeks, days, hours, minutes, and seconds. It is an observation
    from the sequence of discrete time of successive intervals.


    The time variable/feature is the independent variable and supports the target
    variable to predict the results. Time Series Analysis (TSA) is used in different
    fields for time-based predictions – like Weather Forecasting models, Stock market
    predictions, Signal processing, engineering domain – Control Systems, and Communications
    Systems. Since TSA involves producing the set of information in a particular sequence,
    this makes it distinct from spatial and other analyses.


    Time-series analysis is the process of extracting useful information from time-series
    data to forecast and gain insights from it. It consists of a series of data that
    varies with time, hence continuous and non-static in nature. It may vary from
    hours to minutes and even seconds (milliseconds to microseconds). Due to its non-static
    and continuous nature, working with time-series data is indeed difficult even
    today!'
