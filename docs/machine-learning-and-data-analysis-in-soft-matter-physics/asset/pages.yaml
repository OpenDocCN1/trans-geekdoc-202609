    # Regression Analysis


    Regression analysis encompasses a large variety of statistical methods to estimate
    the relationship between input variables and their associated features. Its most
    common form is linear regression, where a single line is drawn to best fit the
    given data according to a mathematical criterion such as ordinary least squares.
    The latter is often extended by regularization methods to mitigate over fitting
    and bias, as in ridge regression. When dealing with non-linear problems, go-to
    models include polynomial regression (for example, used for trendline fitting
    in Microsoft Excel), logistic regression (often used in statistical classification)
    or even kernel regression, which introduces non-linearity by taking advantage
    of the kernel trick to implicitly map input variables to higher-dimensional space.


    # Bayesian networks


    A Bayesian network, belief network, or directed acyclic graphical model is a probabilistic
    graphical model that represents a set of random variables and their conditional
    independence with a directed acyclic graph (DAG). For example, a Bayesian network
    could represent the probabilistic relationships between diseases and symptoms.
    Given symptoms, the network can be used to compute the probabilities of the presence
    of various diseases. Efficient algorithms exist that perform inference and learning.
    Bayesian networks that model sequences of variables, like speech signals or protein
    sequences, are called dynamic Bayesian networks. Generalizations of Bayesian networks
    that can represent and solve decision problems under uncertainty are called influence
    diagrams.


    # Gaussian processes


    A Gaussian process is a stochastic process in which every finite collection of
    the random variables in the process has a multivariate normal distribution, and
    it relies on a pre-defined covariance function, or kernel, that models how pairs
    of points relate to each other depending on their locations.


