    # Hopfield


    The Hopfield network is an RNN in which all connections across layers are equally
    sized. It requires stationary inputs and is thus not a general RNN, as it does
    not process sequences of patterns. However, it guarantees that it will converge.
    If the connections are trained using Hebbian learning then the Hopfield network
    can perform as robust content-addressable memory, resistant to connection alteration.


    # Bidirectional associative memory


    Introduced by Bart Kosko, a bidirectional associative memory (BAM) network is
    a variant of a Hopfield network that stores associative data as a vector. The
    bi-directionality comes from passing information through a matrix and its transpose.
    Typically, bipolar encoding is preferred to binary encoding of the associative
    pairs. Recently, stochastic BAM models using Markov stepping were optimized for
    increased network stability and relevance to real-world applications.


    A BAM network has two layers, either of which can be driven as an input to recall
    an association and produce an output on the other layer.


    # Echo state


    The echo state network (ESN) has a sparsely connected random hidden layer. The
    weights of output neurons are the only part of the network that can change (be
    trained). ESNs are good at reproducing certain time series. A variant for spiking
    neurons is known as a liquid state machine.


    # Independently RNN (IndRNN)


    The Independently recurrent neural network (IndRNN) addresses the gradient vanishing
    and exploding problems in the traditional fully connected RNN. Each neuron in
    one layer only receives its own past state as context information (instead of
    full connectivity to all other neurons in this layer) and thus neurons are independent
    of each other’s history. The gradient backpropagation can be regulated to avoid
    gradient vanishing and exploding in order to keep long or short-term memory. The
    cross-neuron information is explored in the next layers. IndRNN'
