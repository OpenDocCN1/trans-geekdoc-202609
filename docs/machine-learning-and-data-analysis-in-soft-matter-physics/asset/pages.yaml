  md: '# Action Space


    The action space defines all the possible actions the agent can take at each time
    step. Actions define how an agent can interact with an environment, taking the
    agent from its current observation to the next. Within the TO environment, an
    action corresponds to toggling an element from material to void, leading to a
    new topology. For an NxN topology environment, the action space size is N². The
    action of toggling an element from material to void can be represented as changing
    an element’s modulus of elasticity from 1 to 1⁻⁴.


    ![](img/c4a53cbbd40023d194b7887dddf3293b_225_0.png)


    Figure 7: Element removal sequence of 6 × 6 topology.


    Designing topologies (Fig. 7) is accomplished by sequentially selecting elements
    for removal from a starting solid block topology until a termination criterion
    is reached or the agent attempts an illegal action. The illegal actions, illustrated
    in Fig. 8, include removing a bounded, loaded, or previously voided element, or
    trying to remove an element that would lead to a non-singular body. A non-singular
    body arises when the topology is held together by a hinge point. This single-node
    connection at a hinge point artificially inflates the stiffness of the topology
    and does not represent a feasible part of the design solution.


    ![](img/c4a53cbbd40023d194b7887dddf3293b_225_1.png)


    Figure 8: Illegal actions (a) Removing voided, loaded, and bounded elements (b)
    Action results in a non-singular body.'
