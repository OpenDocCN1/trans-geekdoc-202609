- pgno: 226
  md: '# Reward


    Formulating the reward function of an MDP can be difficult and is the subject
    of considerable research. The reward function controls the feedback given to an
    agent after taking an action. Therefore, the RL agent seeks to maximize its reward
    and should learn what action sequences need to be taken to accumulate the most
    reward while avoiding penalties. In the presented environment, the reward function
    should be built to minimize structural compliance under certain volume constraints.


    Minimizing the compliance is accomplished by minimizing the increase in strain
    energy of the current topology compared to the starting solid block topology.
    Strain energy is a standard measurement in traditional TO methods to assess compliance.
    The strain energy of a topology increases as more elements are removed, so the
    agent should receive more reward if it removes elements that lead to a minimal
    increase. The quadratic mathematical function used to represent this proposed
    reward function, \( r_t \), at a time step, \( t \), is shown in Eq. (8):


    \( r_t = \left( \frac{c_s}{c_t} \right)^2 + \left( \frac{\alpha_t}{N^2} \right)^2
    \) (8)


    where \( c_s \) is the initial strain energy of the solid block topology, \( c_t
    \) is the strain energy of the current topology at the time step, \( t \), and
    \( \alpha_t \) is the number of voided elements at timestep \( t \).


    Eq. (8) shows that the agent is assigned more reward if the topology exhibits
    minimal increases in strain energy while reducing volume fraction. The quadratic
    representation of the function was selected through experimentation to help magnify
    the optimal rewards during the later stages of the design process.


    While other reward function alternatives are possible, the effectiveness of the
    function in Eq. (8) is demonstrated in the following sections. A graphical representation
    of Eq. (8) can be found in Fig. 9.


    The reward function of Eq. (8) was only used if the agent takes an action that
    is deemed "legal." If one of the illegal actions in Fig. 9 is taken, the agent
    is penalized -1.


    This penalty teaches the agent to avoid taking illegal steps as it diminishes
    the accumulated reward of a designing episode. A magnified salatory reward algorithm
    was utilized to account for the threat of reward saltation brought on by combining
    positive and negative rewards. The reader is direct to for a detailed description
    of this algorithm.'
  merge: -1
  img_proc: true
