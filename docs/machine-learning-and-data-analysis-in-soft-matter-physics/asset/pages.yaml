- pgno: 222
  md: 'Formally, the TO problem can be viewed as finding the material distribution
    G that minimizes an objective function, F, subject to a volume constraint G₀≤0
    and possibly M other constraints Gᵢ≤0, i=1⋯M. The material distribution is described
    by the density variable r that can take either the value 0 (void) or 1 (solid
    material) at any point in the design domain Ω. The mathematical form of this optimization
    problem is shown in Eq. (5) :


    ```

    min F

    F(u(ρ), ρ) = ∫_Ω f(u(ρ), ρ)dV

    s.t. : G₀(ρ) = ∫_Ω ρdV - V₀ ≤ 0

    : ρ(x) = 0or1, ∀x ∈ Ω

    (5)

    ```


    where the state field u satisfies a linear or nonlinear state equation. For this
    application, the objective function, F(u(ρ), ρ), is compliance, where minimizing
    compliance leads to maximizing the stiffness of the structure. The objective function
    is dependent on the density of the material at each location, u(ρ), which will
    take the value of 1 (material) or 0 (void). The objective function is also dependent
    on predetermined constraints, Gᵢ(u(ρ), ρ), which can be subject to change for
    different applications. Finally, the design space, Ω, indicates the allowable
    volume, V, within which the design can exist.


    ![](img/c4a53cbbd40023d194b7887dddf3293b_222_0.png)


    Figure 5: 2D representation of an elementally discretized starting topology of
    a 12 × 12 cantilever beam (b) Corresponding optimal topology.


    The details of the agent''s interactions with the environment are in the following
    sections, but a brief overview helps guide the description of the details. The
    environment starts as a solid material block (Fig. 5a), and the agent must decide
    which elements to remove to best achieve the design objective. After removing
    an element, FEA provides the stress'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'distribution throughout the structure and gives the agent feedback on the current
    performance of the design. The agent uses this feedback to make intelligent decisions
    about which elements to remove until convergence is achieved (Fig. 5b). The elementally
    discretized environment defining the MDP is represented in Fig. 5 and consists
    of an N-by-N grid of discrete elements that can be toggled on or off, representing
    material (light grey) or voided (white), respectively. The material elements are
    assigned a modulus of elasticity of 1 and Poisson’s ratio of 0.33. For convenience
    and to avoid remeshing, the voided elements are assigned a modulus of 1-4 rather
    than removing them from the design. Dirichlet boundary conditions are applied
    to the nodes of certain bounded elements (black), while loaded elements (dark
    grey) have a force value applied to their nodes.


    # State Space


    The state-space, S, of an environment represents all the combinations of observations
    that an agent can experience while interacting with the environment. The agent’s
    current observation depends on the boundary conditions, loading conditions, and
    current topology. The individual observations that comprise the state-space were
    built as N x N x 3 arrays, where N represents the number of elements in one dimension.


    The first channel of the observation array is the normalized inverse Von Mises
    Stress, \(\sigma_{VM}\), of each element. This channel describes the current stress
    distribution within the topology. The Von Mises stress is commonly used in engineering
    design to describe an object’s current stress state. The Von Mises stress for
    each 2D element can be found under any load case using Eq. (6):


    ```

    \(\sigma_{VM} = \sqrt{\sigma_x^2 + \sigma_y^2 - \sigma_x\sigma_y + 3\tau_{xy}}\)
    (6)

    ```


    where \(\sigma_x\), \(\sigma_y\), and \(\tau_{xy}\) are found using a 2D plane
    stress FEA solver. The FEA solver automatically calculates the Von Mises stress
    at each design step by calling the current topology’s stiffness matrix and bounded
    and loaded elements. The stiffness matrix is defined by assigning each element
    the material or void modulus of elasticity depending on the current topology.
    This “in the loop” FEA solver could be replaced by a trained surrogate model to
    improve computational efficiency. Eq. (6) is only used for material elements within
    the topology. Voided elements are assigned a value of 0 to isolate the location
    of the voided elements. The inverse Von Mises stress of each element was used
    to help the agent’s deep neural network decipher between minimally loaded'
