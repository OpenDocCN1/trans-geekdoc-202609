    agent and the simulation interact by exchanging information. In

    particular, the reinforcement learning system controls the simulation

    by providing the activations for each bin A. The simulation performs

    an update and provides the reinforcement learning algorithm with

    the measurement tensor M, which is additionally used to compute the

    rewards. In this section, we will describe this process in more detail.'
