    achieving macroscopic behavior is challenging.


    Indeed, while some limited control was achieved, such as the ability

    to generate simple fluid flows, achieve global particle momentum, and

    accelerated equilibration of otherwise glassy systems, control strategies

    for more complex scenarios are absent.


    The reason for this challenging behavior is that active matter

    systems are interaction-dominated, so strategies have to exert indirect

    control via agent–agent interactions rather than single–agent properties.

    Therefore, finding successful strategies to achieve macroscopic

    goals requires advanced control methods, including policy-based

    reinforcement learning.


    The key question we address in this section is finding control

    strategies for the macroscopic task of mixing using protein-based active

    matter systems. In particular, we focus on finding mixing strategies of

    active particles by applying RL to our recent numerical active matter

    model. If we find good mixing solutions for the active particles, these

    strategies could then be implemented experimentally to induce mixing

    in the surrounding medium, for example, via fluid–matter interactions.

    For our model of active particles, we observe that while RL fails to learn

    good strategies if only attractive or repulsive interactions are available,

    RL finds good strategies if attractive and repulsive interactions can be

    combined.


    We analyze this puzzling behavior using dynamical systems theory,

    particularly theory to hyperbolic dynamics and Anosov diffeomorphisms,

    to prove that mixed interactions are indeed necessary to render the

    problem solvable. Our results, therefore, provide a guideline to make

    protein-based active matter applicable and answer the question of how

    different interactions can lead to macroscopic behavior asked in a recent

    review.


