  md: '# 6.3.1 Intertemporal Effect of Shocks


    In an AR process, a one-time shock affects values of the evolving variable infinitely
    far into the future. For example, consider the AR(1) model $X_t = \phi_1 X_{t-1}
    + \epsilon_t$. A non-zero value for $\epsilon_t$ at say time t=1 affects $X_1$
    by the amount $\epsilon_1$. Then by the AR equation for $X_2$ in terms of $X_1$,
    this affects $X_2$ by the amount $\phi_1 \epsilon_1$. Then by the AR equation
    for $X_3$ in terms of $X_2$, this affects $X_3$ by the amount $\phi_1^2 \epsilon_1$.
    Continuing this process shows that the effect of $\epsilon_t$ never ends, although
    if the process is stationary then the effect diminishes toward zero in the limit.


    Because each shock affects X values infinitely far into the future from when they
    occur, any given value $X_t$ is affected by shocks occurring infinitely far into
    the past. This can also be seen by rewriting the autoregression


    $\phi(B)X_t = \epsilon_t$


    (where the constant term has been suppressed by assuming that the variable has
    been measured as deviations from its mean) as


    $X_t = \frac{1}{\phi(B)}\epsilon_t.$


    When the polynomial division on the right side is carried out, the polynomial
    in the backshift operator applied to $\epsilon_t$ has an infinite order—that is,
    an infinite number of lagged values of $\epsilon_t$ appear on the right side of
    the equation.


    # 6.3.2 Characteristic Polynomial


    The autocorrelation function of an AR(p) process can be expressed as


    \(\rho(\tau) = \sum_{k=1}^p a_k y_k^{-\tau},\)


    where yk are the roots of the polynomial


    \(\phi(B) = 1 - \sum_{k=1}^p \phi_k B^k\)


    where B is the backshift operator, where \(\phi(.)\) is the function defining
    the autoregression, and where'
