    # ## 6.2 MOVING AVERAGE


    A moving average is a calculation to analyze data points by creating a series
    of averages of different selections of the full data set. It is also called a
    moving mean (MM) or rolling mean and is a type of finite impulse response filter.
    Variations include: simple, cumulative, or weighted forms.


    A moving average filter is sometimes called a boxcar filter, especially when followed
    by decimation.


    Given a series of numbers and a fixed subset size, the first element of the moving
    average is obtained by taking the average of the initial fixed subset of the number
    series. Then the subset is modified by “shifting forward”; that is, excluding
    the first number of the series and including the next value in the subset.


    A moving average is commonly used with time series data to smooth out short-term
    fluctuations and highlight longer-term trends or cycles. The threshold between
    short-term and long term depends on the application, and the parameters of the
    moving average will be set accordingly. It is also used in economics to examine
    gross domestic product, employment or other macroeconomic time series. Mathematically,
    a moving average is a type of convolution and so it can be viewed as an example
    of a low-pass filter used in signal processing. When used with non-time series
    data, a moving average filters higher frequency components without any specific
    connection to time, although typically some kind of ordering is implied. Viewed
    simplistically it can be regarded as smoothing the data.


    # ### 6.2.1 Simple Moving Average


    In science and engineering, the mean is normally taken from an equal number of
    data on either side of a central value. This ensures that variations in the mean
    are aligned with the variations in the data rather than being shifted in time.
    An example of a simple equally weighted running mean is the mean over the last
    k entries of a data-set containing'
