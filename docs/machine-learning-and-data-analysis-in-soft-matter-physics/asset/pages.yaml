    +   3. Density-based Clustering (Model-based Methods):- The first two methods
    discussed above depend on a distance (similarity/proximity) metric. The very definition
    of a cluster is based on this metric.


    Density-based clustering method considers density ahead of distance. Data is clustered
    by regions of high concentrations of data objects bounded by areas of low concentrations
    of data objects. The clusters formed are grouped as a maximal set of connected
    data points.


    The clusters formed vary in arbitrary shapes and sizes and contain a maximum degree
    of homogeneity due to similar density. This clustering approach includes the noise
    and outliers in the datasets effectively.


    When performing most of the clustering, we take two major assumptions: the data
    is devoid of any noise and the shape of the cluster so formed is purely geometrical
    (circular or elliptical).


    The fact is, data always has some extent of inconsistency (noise) which cannot
    be ignored. Added to that, we must not limit ourselves to a fixed attribute shape.


    It is desirable to have arbitrary shapes to not to ignore any data points. These
    are the areas where density-based algorithms have proven their worth!


