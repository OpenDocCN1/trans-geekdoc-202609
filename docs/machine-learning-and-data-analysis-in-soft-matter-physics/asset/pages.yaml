  md: '# 7.4.3 Testing the Agent with Progressive refinement


    The trained agent was tested to validate its accuracy and generalization. The
    agent was trained to design 6 × 6 topologies to limit the computational cost of
    running the FEA calculations. However, designing an optimal topology at the coarse
    6x6 level does not offer sufficient design detail. For this reason, testing on
    a finer mesh size will result in a more meaningful evaluation of the agent’s abilities.
    The RL agent can interact with topologies larger than it is trained on because
    the value function DNNs are built solely on convolutional filters. Convolutional
    filters are not size-dependent and can be passed along any input size. Therefore,
    the agent could interact directly with a larger topology size (e.g., 24 × 24 or
    beyond) without retraining. However, the computational cost of interacting directly
    with a larger topology from starting solid block to optimal topology is significantly
    larger than interacting with the 6×6 size. Therefore, it propose implementing
    progressive refinement to help improve the computational efficiency of the RL
    agent.


    Progressive refinement is the process of sequentially increasing the complexity
    of an object from “coarse” to “fine.” Regarding topology design, progressive refinement
    increases the topology detail over sequential steps instead of all at once . As
    a result, the number of elements used to define an equivalent topology shape increases
    through intermediate steps, as seen in Fig. 12. In this work, progressive refinement
    was carried out from a starting 6x6 topology to an intermediate 12 × 12 topology
    to a final 24 × 24 topology which was used to define the agent’s proposed optimal
    topology for each load case.


    ![](img/c4a53cbbd40023d194b7887dddf3293b_231_0.png)


    Figure 12: Two-step progressive refinement from 6 × 6 to 24 × 24 topology.


    Progressive refinement improves computational efficiency by allowing the agent
    to start taking actions and removing elements in the coarse 6x6 topology until
    an intermediate volume fraction (VF) or stress-based termination criterion is
    met. The intermediate termination criteria'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'for the $6 \times 6$ and $12 \times 12$ sizes are with respect to a global
    termination criterion for the $24 \times 24$ size, as seen in eqs (11) and (12).
    The agent begins by removing elements from the 6x6 topology until the initial
    intermediate termination criterion is met.


    Next, the agent interacts with an equivalent $12 \times 12$ topology and continues
    to remove elements until a second intermediate termination criterion is met. Finally,
    the agent interacts with the equivalent $24 \times 24$ topology until the final,
    user-specified termination criterion is satisfied. An example of this sequence
    is represented in Fig. 13, where the final termination criterion is $VF_{24\times24}=0.25$.
    It should be noted that Eqs (11) and (12) would need to be adjusted if the final
    topology refinement were to extend to 48x48 or 96x96 and should be addressed as
    future work.


    $VF_{6\times6} = 1 - \left( \frac{1 - VF_{24\times24}}{2.5} \right)$ (11)


    $VF_{12\times12} = 1 - \left( \frac{1 - VF_{24\times24}}{1.5} \right)$ (12)


    ![](img/c4a53cbbd40023d194b7887dddf3293b_232_0.png)


    Figure 13: Sequential element removal using progressive refinement.


    The sequential decrease in allowable VF follows the work, found that the optimization
    method works better by gradually tightening the criteria with increasing refinement.


    Removing a single coarse element from the $6 \times 6$ topology is equivalent
    to removing the 4 or 16 corresponding elements from the $12 \times 12$ or $24
    \times 24$ topologies, respectively.


    Therefore, the agent interacts with the intermediate $6 \times 6$ topology to
    produce a general, non-detailed shape that can be formed into an equivalent $12
    \times 12$ topology. The agent can begin to produce low-level details at the $12
    \times 12$ topology but will ultimately achieve its sufficiently detailed optimal
    design at the $24 \times 24$ topology size.'
