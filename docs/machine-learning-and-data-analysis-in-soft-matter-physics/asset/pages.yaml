  md: '5. Fuzzy Clustering:- Fuzzy clustering generalizes the partition-based clustering
    method by allowing a data object to be a part of more than one cluster. The process
    uses a weighted centroid based on the spatial probabilities.


    The steps include initialization, iteration, and termination, generating clusters
    optimally analyzed as probabilistic distributions instead of a hard assignment
    of labels.


    The algorithm works by assigning membership values to all the data points linked
    to each cluster center. It is computed from a distance between the cluster center
    and the data point. If the membership value of the object is closer to the cluster
    center, it has a high probability of being in the specific cluster.


    At the end iteration, associated values of membership and cluster centers are
    reorganized. Fuzzy clustering handles the situations where data points are somewhat
    in between the cluster centers or ambiguous. This is done by choosing the probability
    rather than distance.


    6. Constraint-based (Supervised Clustering):- The clustering process, in general,
    is based on the approach that the data can be divided into an optimal number of
    “unknown” groups. The underlying stages of all the clustering algorithms are to
    find those hidden patterns and similarities without intervention or predefined
    conditions. However, in certain business scenarios, we might be required to partition
    the data based on certain constraints. Here is where a supervised version of clustering
    machine learning techniques comes into play.


    A constraint is defined as the desired properties of the clustering results or
    a user’s expectation of the clusters so formed – this can be in terms of a fixed
    number of clusters, the cluster size, or important dimensions (variables) that
    are required for the clustering process.


    # Constraint-Based Clustering Analysis


    **Clustering analysis:** Less parameters but more user-desired constraints, e.g;
