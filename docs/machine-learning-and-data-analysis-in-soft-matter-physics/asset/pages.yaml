    # ## 7.2.3 Reinforcement Learning Framework


    Because the action space is large (\(3^{4 \times 4} \approx 43 \times 10^6\) for
    combined interactions), conventional control theory techniques are intractable
    due to Bellman\`s curse of dimensionality. Similarly, the action space is also
    too large for value-based RL methods, so that we use a policy-based algorithm.
    In particular, we use the rllib implementation of Proximal Policy Optimization
    (PPO).


    In the RL agents, we use a neural network, which gets as input the tensor M. The
    neural network itself then consists of three convolutional layers (with 32, 64,
    and 256 channels, and kernel sizes 3, 3, and 4, respectively), and a dense layer
    with \(N_g \times N_g\) output neurons. The simulation uses the value of these
    output neurons to determine if a bin should be activated by thresholding.


