  md: '\(\phi_k\) are the coefficients in the autoregression. The formula is valid
    only if all the roots have multiplicity 1.


    The autocorrelation function of an AR(p) process is a sum of decaying exponentials.


    +   - Each real root contributes a component to the autocorrelation function that
    decays exponentially.

    +   - Similarly, each pair of complex conjugate roots contributes an exponentially
    damped oscillation.


    # 6.3.3 Graphs of AR(p) Processes


    The simplest AR process is AR(0), which has no dependence between the terms. Only
    the error/innovation/noise term contributes to the output of the process, so in
    the figure, AR(0) corresponds to white noise. For an AR(1) process with a positive
    \(\phi\), only the previous term in the process and the noise term contribute
    to the output. If \(\phi\) is close to 0, then the process still looks like white
    noise, but as \(\phi\) approaches 1, the output gets a larger contribution from
    the previous term relative to the noise. This results in a “smoothing” or integration
    of the output, similar to a low pass filter. For an AR(2) process, the previous
    two terms and the noise term contribute to the output. If both


    \(\phi_1\) and \(\phi_2\) are positive, the output will resemble a low pass filter,
    with the high frequency part of the noise decreased. If \(\phi_1\)is positive
    while \(\phi_2\) is negative, then the process favors changes in sign between
    terms of the process. The output oscillates. This can be likened to edge detection
    or detection of change in direction.


    # 6.3.4 Calculation of the AR Parameters


    There are many ways to estimate the coefficients, such as the ordinary least squares
    procedure or method of moments (through Yule–Walker equations).


    The AR(p) model is given by the equation


    ```

    X_t = \sum_{i=1}^p \phi_i X_{t-i} + \epsilon_t.

    ```


    It is based on parameters \(\phi_i\) where \(i = 1, ..., p\). There is a direct
    correspondence between these parameters and the covariance function of the process,
    and this correspondence can be inverted to determine the'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'parameters from the autocorrelation function (which is itself obtained from
    the covariances). This is done using the Yule–Walker equations.


    # # Yule-Walker equations


    The Yule-Walker equations, named for Udny Yule and Gilbert Walker, are the following
    set of equations.


    ```

    $$\gamma_m = \sum_{k=1}^P \phi_k \gamma_{m-k} + \sigma_\epsilon^2 \delta_{m,0},$$

    ```


    where m = 0, ..., p, yielding p + 1 equations. Here


    $\gamma_m$ is the autocovariance function of $X_t$, $\sigma_\epsilon$ is the standard
    deviation of the input noise process, and $\delta_{m,0}$ is the Kronecker delta
    function.


    Because the last part of an individual equation is non-zero only if m = 0, the
    set of equations can be solved by representing the equations for m > 0 in matrix
    form, thus getting the equation


    ```

    $$\begin{bmatrix} \gamma_1 \\ \gamma_2 \\ \gamma_3 \\ \vdots \\ \gamma_P \end{bmatrix}
    = \begin{bmatrix} \gamma_0 & \gamma_{-1} & \gamma_{-2} & \cdots \\ \gamma_1 &
    \gamma_0 & \gamma_{-1} & \cdots \\ \gamma_2 & \gamma_1 & \gamma_0 & \cdots \\
    \vdots & \vdots & \vdots & \ddots \\ \gamma_{p-1} & \gamma_{p-2} & \gamma_{p-3}
    & \cdots \end{bmatrix} \begin{bmatrix} \phi_1 \\ \phi_2 \\ \phi_3 \\ \vdots \\
    \phi_p \end{bmatrix}$$

    ```


    which can be solved for all


    \(\{\phi_m; m = 1, 2, ..., p\}\). The remaining equation for m = 0 is


    ```

    $$\gamma_0 = \sum_{k=1}^P \phi_k \gamma_{-k} + \sigma_\epsilon^2,$$

    ```


    which, once \(\{\phi_m; m = 1, 2, ..., p\}\) are known, can be solved for \(\sigma_\epsilon^2\).


    An alternative formulation is in terms of the autocorrelation function. The AR
    parameters are determined by the first p+1 elements \(\rho(\tau)\) of the autocorrelation
    function. The full autocorrelation function can then be derived by recursively
    calculating


    ```

    $$\rho(\tau) = \sum_{k=1}^P \phi_k \rho(k - \tau)$$

    ```'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Estimation of AR parameters


    The above equations (the Yule–Walker equations) provide several routes to estimating
    the parameters of an AR(p) model, by replacing the theoretical covariances with
    estimated values. Some of these variants can be described as follows:


    +   Estimation of autocovariances or autocorrelations. Here each of these terms
    is estimated separately, using conventional estimates. There are different ways
    of doing this and the choice between these affects the properties of the estimation
    scheme. For example, negative estimates of the variance can be produced by some
    choices.


    +   Formulation as a least squares regression problem in which an ordinary least
    squares prediction is constructed, basing prediction values of X_t on the p previous
    values of the same series. This can be thought of as a forward-prediction scheme.
    The normal equations for this problem can be seen to correspond to an approximation
    of the matrix form of the Yule–Walker equations in which each appearance of an
    autocovariance of the same lag is replaced by a slightly different estimate.


    +   Formulation as an extended form of ordinary least squares prediction problem.
    Here two sets of prediction equations are combined into a single estimation scheme
    and a single set of normal equations. One set is the set of forward-prediction
    equations and the other is a corresponding set of backward prediction equations,
    relating to the backward representation of the AR model:


    ```

    X_t = \sum_{i=1}^p \phi_i X_{t-i} + \varepsilon_t^*.

    ```


    Here predicted values of X_t would be based on the p future values of the same
    series. This way of estimating the AR parameters is due to John Parker Burg, and
    is called the Burg method: Burg and later authors called these particular estimates
    “maximum entropy estimates”, but the reasoning behind this applies to the use
    of any set of estimated AR parameters. Compared to the estimation scheme using
    only the forward prediction equations, different estimates of the autocovariances
    are produced, and the estimates have different stability properties. Burg estimates
    are particularly associated with maximum entropy spectral estimation.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'Other possible approaches to estimation include maximum likelihood estimation.
    Two distinct variants of maximum likelihood are available: in one (broadly equivalent
    to the forward prediction least squares scheme) the likelihood function considered
    is that corresponding to the conditional distribution of later values in the series
    given the initial p values in the series; in the second, the likelihood function
    considered is that corresponding to the unconditional joint distribution of all
    the values in the observed series. Substantial differences in the results of these
    approaches can occur if the observed series is short, or if the process is close
    to non-stationarity.


    # 6.4 RECURRENT NEURAL NETWORKS (RNN)


    A recurrent neural network (RNN) is a type of neural network well-suited to time
    series data. RNNs process a time series step-by-step, maintaining an internal
    state from time-step to time-step.


    A recurrent neural network (RNN) is a class of artificial neural networks where
    connections between nodes can create a cycle, allowing output from some nodes
    to affect subsequent input to the same nodes. This allows it to exhibit temporal
    dynamic behavior. Derived from feed forward neural networks, RNNs can use their
    internal state (memory) to process variable length sequences of inputs. This makes
    them applicable to tasks such as unsegmented, connected handwriting recognition
    or speech recognition. Recurrent neural networks are theoretically Turing complete
    and can run arbitrary programs to process arbitrary sequences of inputs. The term
    “recurrent neural network” is used to refer to the class of networks with an infinite
    impulse response, whereas “convolutional neural network” refers to the class of
    finite impulse response. Both classes of networks exhibit temporal dynamic behavior.
    A finite impulse recurrent network is a directed acyclic graph that can be unrolled
    and replaced with a strictly feed forward neural network, while an infinite impulse
    recurrent network is a directed cyclic graph that cannot be unrolled.


    Both finite impulse and infinite impulse recurrent networks can have additional
    stored states, and the storage can be under direct control by the neural network.
    The storage can also be replaced by another network or graph if that incorporates
    time delays or has feedback loops. Such controlled states are referred to as gated
    state or gated memory, and are part of long short-term memory networks (LSTMs)
    and gated recurrent units. This is also called Feedback Neural Network (FNN).'
