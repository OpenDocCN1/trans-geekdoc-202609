  md: '# # 4.2 PRINCIPAL COMPONENT ANALYSIS FOR DATA VISUALIZATION


    Principal component analysis (PCA) is an unsupervised machine learning technique.
    Perhaps the most popular use of principal component analysis is dimensionality
    reduction. Besides using PCA as a data preparation technique, we can also use
    it to help visualize data. A picture is worth a thousand words. With the data
    visualized, it is easier for us to get some insights and decide on the next step
    in our machine learning models.


    ![](img/c4a53cbbd40023d194b7887dddf3293b_124_0.png)


    # ## 4.2.1 Scatter Plot of High Dimensional Data


    Visualization is a crucial step to get insights from data. We can learn from the
    visualization that whether a pattern can be observed and hence estimate which
    machine learning model is suitable.


    It is easy to depict things in two dimension. Normally a scatter plot with x-
    and y-axis are in two dimensional. Depicting things in three dimensional is a
    bit challenging but not impossible. In matplotlib, for example, can plot in 3D.
    The only problem is on paper or on screen, we can only look at a 3D plot at one
    viewport or projection at a time. In matplotlib, this is controlled by the degree
    of elevation and azimuth. Depicting things in four or five dimensions is impossible
    because we live in a three-dimensional world and have no idea of how things in
    such a high dimension would look like. This is where a dimensionality reduction
    technique such as PCA comes into play. We can reduce the dimension to two or three
    so we can visualize it. Let''s start with an example.


    We start with the wine dataset, which is a classification dataset with 13 features
    (i.e., the dataset is 13 dimensional) and 3 classes. There are 178 samples:'
