    # ## 3.2.1 Linear Regression


    Linear Regression is known as one of the simplest Machine learning algorithms
    that branch from Supervised Learning and is primarily used to solve regression
    problems.


    The use of Linear Regression is to make predictions on continuous dependent variables
    with the assistance and knowledge from independent variables. The overall goal
    of Linear Regression is to find the line of best fit, which can accurately predict
    the output for continuous dependent variables. Examples of continuous values are
    house prices, age, and salary.


    Simple Linear Regression is a regression model that estimates the relationship
    between one single independent variable and one dependent variable using a straight
    line. If there are more than two independent variables, we then call this Multiple
    Linear Regression.


    Using the strategy of the line of best fits helps us to understand the relationship
    between the dependent and independent variable; which should be of linear nature.


    # ### The Formula for Linear Regression


    If you remember high school Mathematics, you will remember the formula: y = mx
    + b and represents the slope-intercept of a straight line. ‘y’ and ‘x’ represent
    variables, ‘m’ describes the slope of the line and ‘b’ describe the y-intercept,
    where the line crosses the y-axis.'
