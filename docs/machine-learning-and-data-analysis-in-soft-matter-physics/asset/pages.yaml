  md: 'it resolves this problem by learning the architecture of the LSTM. At a high
    level, LSTM works very much like an RNN cell. Here is the internal functioning
    of the LSTM network.


    The LSTM network architecture consists of three parts, as shown in the image below,
    and each part performs an individual function.


    ![](img/c4a53cbbd40023d194b7887dddf3293b_192_0.png)


    Just like a simple RNN, an LSTM also has a hidden state where H(t-1) represents
    the hidden state of the previous timestamp and Ht is the hidden state of the current
    timestamp. In addition to that, LSTM also has a cell state represented by C(t-1)
    and C(t) for the previous and current timestamps, respectively.


    Here the hidden state is known as Short term memory, and the cell state is known
    as Long term memory.


    ![](img/c4a53cbbd40023d194b7887dddf3293b_192_1.png)


    It is interesting to note that the cell state carries the information along with
    all the timestamps.


    ![](img/c4a53cbbd40023d194b7887dddf3293b_192_2.png)'
