    # 2.3.4 Attribute Subset Selection


    Data sets for analysis may contain hundreds of attributes, many of which may be
    irrelevant to the mining task or redundant. For example, If the task is to classify
    customers based on a probability of positive reaction on a discount offer of a
    music CD, attributes such as the customer’s telephone number are likely to be
    irrelevant, unlike attributes such as age or music taste. Although it may be possible
    for a domain expert'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'to pick out some of the useful attributes, this can be a difficult and time-consuming
    task, especially when the behavior of the data is not well known (hence, a reason
    behind its analysis!). Leaving out relevant attributes or keeping irrelevant attributes
    may be detrimental, causing confusion for the mining algorithm employed. This
    can result in discovered patterns of poor quality. In addition, the added volume
    of irrelevant or redundant attributes can slow down the mining process.


    Attribute subset selection reduces the data set size by removing irrelevant or
    redundant attributes (or dimensions). The goal of attribute subset selection is
    to find a minimum set of attributes such that the resulting probability distribution
    of the data classes is as close as possible to the original distribution obtained
    using all attributes. Mining on a reduced set of attributes has an additional
    benefit. It reduces the number of attributes appearing in the discovered patterns,
    helping to make the patterns easier to understand.


    “How can we find a ‘good’ subset of the original attributes?” For n attributes,
    there are 2n possible subsets. An exhaustive search for the optimal subset of
    attributes can be prohibitively expensive, especially as n and the number of data
    classes increase. Therefore, heuristic methods that explore a reduced search space
    are commonly used for attribute subset selection. These methods are typically
    greedy in that, while searching through attribute space, they always make what
    looks to be the best choice at the time. Their strategy is to make a locally optimal
    choice in the hope that this will lead to a globally optimal solution. Such greedy
    methods are effective in practice and may come close to estimating an optimal
    solution


    | Forward selection | Backward elimination | Decision tree induction |

