  md: '# 8.2.1 Potential Energy Surfaces


    MD and Markov chain Monte Carlo simulations employing classical force fields within
    the Born–Oppenheimer approximation constitute the cornerstone of contemporary
    atomistic modeling in chemistry, biology, and materials science. These methods
    perform importance sampling; that is, in the long run, they sample states x from
    the molecular system''s equilibrium distribution, which has the general form


    ```

    \mu(\mathbf{x}) \propto e^{-u(\mathbf{x})}.

    (1)

    ```


    The reduced potential u(x) contains terms that depend on the thermodynamic constraints
    (e.g., fixed temperature, pressure). In the canonical ensemble (fixed number of
    particles, volume, and temperature), u(x) = U(x)/k_B T, where k_B T is the thermal
    energy at temperature T.


    However, the predictive power of these simulations is only as good as the underlying
    potential energy surface (PES). Hence, predictive simulations of properties and
    functions of molecular systems require an accurate description of the global PES,
    U(x), where x indicates the nuclear Cartesian coordinates. All many-body interactions
    between electrons are encoded in the U (x) function. Although U (x) could be obtained
    on the fly using explicit ab initio calculations, more efficient approaches that
    can access long timescales are required to understand relevant phenomena in large
    molecular systems. A plethora of classical mechanistic approximations to U(x)
    exist, in which the parameters are typically fitted to a small set of ab initio
    calculations or experimental data. Unfortunately, these classical approximations
    often suffer from a lack of transferability and can yield accurate results only
    close to the conditions (geometries) they have been fitted to.


    Alternatively, sophisticated ML approaches that can accurately reproduce the global
    PES for elemental materials and small molecules have recently been developed (see
    Figure 1). Such methods learn a model of the PES, U(x, θ), where the parameters
    θ are optimized by energy matching and/or by force matching. In energy matching,
    an ML model is trained to minimize the loss function


    ```

    L_{\text{ene}} = \sum_i [\hat{U}(\mathbf{x}_i, \theta) - U_i]^2,

    (2)

    ```


    where U_i are energy values obtained by QM calculations at specific configurations
    (see Figure 1). For force matching, we compute the QM forces at specified configurations'
  merge: -1
  img_proc: true
- pgno: 246
  md: '![](img/c4a53cbbd40023d194b7887dddf3293b_246_0.png)


    Figure 1. Constructing force field models with machine learning. (a) Reference
    geometries are sampled from a molecular dynamics trajectory that is sufficiently
    long to ensure optimal coverage of the configuration space. (b) For a small subset
    of geometries, energy and force labels are then computed at a high level of theory
    to form the training, validation, and test data sets. A globally consistent atom–atom
    assignment across the whole training set enables the identification and reconstructive
    exploitation of relevant spatial and temporal physical symmetries of the molecular
    dynamics. (c) The resulting machine learning model of the potential energy surface
    is finally used to speed up sampling-intensive path-integral molecular dynamics
    simulations at the accuracy of the reference electronic structure method (10).
    (d) An interatomic distance distribution, sampled with classical and path-integral
    molecular dynamics, is shown. Abbreviations: CCSD (T), coupled-cluster single
