    # 6.2.2 Cumulative Average


    In a cumulative average (CA), the data arrive in an ordered datum stream, and
    the user would like to get the average of all of the data up until the current
    datum.


    For example, an investor may want the average price of all of the stock transactions
    for a particular stock up until the current time. As each new transaction occurs,
    the average price at the time of the transaction can be calculated for all of
    the transactions up to that point using the cumulative average, typically an equally
    weighted average of the sequence of n values x₁,...,xₙ up to the current time:


    CAₙ = (x₁ + ⋯ + xₙ) / n .


    The brute-force method to calculate this would be to store all of the data and
    calculate the sum and divide by the number of points every time a new datum arrived.
    However, it is possible to simply update cumulative average as a new value, xₙ₊₁
    becomes available, using the formula


    CAₙ₊₁ = (xₙ₊₁ + n·CAₙ) / (n + 1) .


    Thus the current cumulative average for a new datum is equal to the previous cumulative
    average, times n, plus the latest datum, all divided by the number of points received
    so far, n+1.


    When all of the data arrive (n = N), then the cumulative average will equal the
    final average. It is also possible to store a running total of the data as well
    as the number of points and dividing the total by the number of points to get
    the CA each time a new datum arrives.


    The derivation of the cumulative average formula is straightforward. Using


    x₁ + ⋯ + xₙ = n·CAₙ


    and similarly for n + 1, it is seen that


    xₙ₊₁ = (x₁ + ⋯ + xₙ₊₁) - (x₁ + ⋯ + xₙ)


    Solving this equation for CAₙ₊₁ results in'
