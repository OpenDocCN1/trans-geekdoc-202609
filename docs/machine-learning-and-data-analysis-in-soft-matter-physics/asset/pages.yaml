    # 4.2.2 Visualizing the Explained Variance


    PCA in essence is to rearrange the features by their linear combinations. Hence
    it is called a feature extraction technique. One characteristic of PCA is that
    the first principal component holds the most information about the dataset. The
    second principal component is more informative than the third, and so on.


    To illustrate this idea, we can remove the principal components from the original
    dataset in steps and see how the dataset looks like. Let’s consider a dataset
    with fewer features, and show two features in a plot:


    ```

    from sklearn.datasets import load_iris

    irisdata = load_iris()

    X, y = irisdata[''data''], irisdata[''target'']

    plt.figure(figsize=(8,6))

    plt.scatter(X[:,0], X[:,1], c=y)

    plt.show()

    ```


    ![](img/c4a53cbbd40023d194b7887dddf3293b_130_1.png)'
  merge: -1
  img_proc: true
- pgno: 131
  md: "This is the iris dataset which has only four features. The features are in\
    \ comparable scales and hence we can skip the scaler. With a 4-features data,\
    \ the PCA can produce at most 4 principal components:\n\n```\n...\npca = PCA().fit(X)\n\
    print(pca.components_)\n```\n\n```\n[[ 0.36138659 -0.08452251 0.85667061 0.3582892\
    \ ]\n [ 0.65658877 0.73016143 -0.17337266 -0.07548102]\n [-0.58202985 0.59791083\
    \ 0.07623608 0.54583143]\n [-0.31548719 0.3197231 0.47983899 -0.75365743]]\n```\n\
    \nFor example, the first row is the first principal axis on which the first principal\
    \ component is created. For any data point p with features p =(a,b,c,d), since\
    \ the principal axis is denoted by the vector v =(0.36,-0.08,0.86,0.36), the first\
    \ principal component of this data point has the value 0.36×a–0.08×b+0.86×c+0.36×d\
    \ on the principal axis. Using vector dot product, this value can be denoted by\n\
    \np · v\n\nTherefore, with the dataset X as a 150 × 4 matrix (150 data points,\
    \ each has 4 features), we can map each data point into to the value on this principal\
    \ axis by matrix-vector multiplication:\n\nX · v\n\nand the result is a vector\
    \ of length 150. Now if we remove from each data point the corresponding value\
    \ along the principal axis vector, that would be\n\nX−(X · v) · vᵀ\n\nwhere the\
    \ transposed vector vᵀ is a row and X · v is a column. The product (X · v) · vᵀ\
    \ follows matrix-matrix multiplication and the result is a 150×4 matrix, same\
    \ dimension as X.\n\nIf we plot the first two feature of (X · v) · vᵀ, it looks\
    \ like this:\n\n```\n...\n# Remove PC1\nXmean = X - X.mean(axis=0)\nvalue = Xmean\
    \ @ pca.components_[0]\npc1 = value.reshape(-1,1) @ pca.components_[0].reshape(1,-1)\n\
    Xremove = X - pc1\nplt.scatter(Xremove[:,0], Xremove[:,1], c=y)\nplt.show()\n\
    ```"
