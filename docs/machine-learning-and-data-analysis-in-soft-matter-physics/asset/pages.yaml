    # ## 2.1 DATA CLEANING


    Data cleaning is a crucial process in Data Mining. It carries an important part
    in the building of a model. Data Cleaning can be regarded as the process needed,
    but everyone often neglects it. Data quality is the main issue in quality information
    management.


    Data quality problems occur anywhere in information systems. These problems are
    solved by data cleaning. Data cleaning is fixing or removing incorrect, corrupted,
    incorrectly formatted, duplicate, or incomplete data within a dataset. If data
    is incorrect, outcomes and algorithms are unreliable, even though they may look
    correct. When combining multiple data sources, there are many opportunities for
    data to be duplicated or mislabeled.


    Generally, data cleaning reduces errors and improves data quality. Correcting
    errors in data and eliminating bad records can be a time-consuming and tedious
    process, but it cannot be ignored. Data mining is a key technique for data cleaning.


    Data mining is a technique for discovering interesting information in data. Data
    quality mining is a recent approach applying data mining techniques to identify
    and recover data quality problems in large databases. Data mining automatically
    extracts hidden and intrinsic information from the collections of data. Data mining
    has various techniques that are suitable for data cleaning.


    Understanding and correcting the quality of your data is imperative in getting
    to an accurate final analysis. The data needs to be prepared to discover crucial
    patterns.


    Data mining is considered exploratory. Data cleaning in data mining allows the
    user to discover inaccurate or incomplete data before the business analysis and
    insights.Data cleaning in data mining can be a laborious process and typically
    requires IT resources to help in the initial step of evaluating your data because
    data cleaning before data mining is so time-consuming. But without proper data
    quality, your final analysis will suffer inaccuracy, or you could potentially
    arrive at the wrong conclusion.'
