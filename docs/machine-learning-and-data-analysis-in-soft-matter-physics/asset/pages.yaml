    # Anomaly detection


    In data mining, anomaly detection, also known as outlier detection, is the identification
    of rare items, events or observations which raise suspicions by differing significantly
    from the majority of the data. Typically, the anomalous items represent an issue
    such as bank fraud, a structural defect, medical problems or errors in a text.


    Anomalies are referred to as outliers, novelties, noise, deviations and exceptions.


    In particular, in the context of abuse and network intrusion detection, the interesting
    objects are often not rare objects, but unexpected bursts of inactivity.


    This pattern does not adhere to the common statistical definition of an outlier
    as a rare object. Many outlier detection methods (in particular, unsupervised
    algorithms) will fail on such data unless aggregated appropriately. Instead, a
    cluster analysis algorithm may be able to detect the micro-clusters formed by
    these patterns.


    Three broad categories of anomaly detection techniques exist. Unsupervised anomaly
    detection techniques detect anomalies in an unlabeled test data set under the
    assumption that the majority of the instances in the data set are normal, by looking
    for instances that seem to fit the least to the remainder of the data set.


    Supervised anomaly detection techniques require a data set that has been labeled
    as “normal” and “abnormal” and involves training a classifier (the key difference
    to many other statistical classification problems is the inherently unbalanced
    nature of outlier detection). Semi-supervised anomaly detection techniques construct
    a model representing normal behavior from a given normal training data set and
    then test the likelihood of a test instance to be generated by the model.


