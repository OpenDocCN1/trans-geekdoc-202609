    # 2.5.4 Feature Engineering Methods


    ![](img/c4a53cbbd40023d194b7887dddf3293b_75_0.png)


    # Imputation


    Imputation is the process of managing missing values, which is one of the most
    common problems when it comes to preparing data for machine learning. By missing
    values, we mean places where information is missing in some cells of a respective
    row.


    There may be different causes for missing values, including human error, data
    flow interruptions, cross-datasets errors, etc. Since data completeness impacts
    how well machine learning models perform, imputation is quite important.


    Here are some ways how you can solve the issue of missing values:


    +   - If a row is less than 20-30% complete, it’s recommended to dismiss such
    a record.


    +   - A standard approach to assigning values to the missing cells is to calculate
    a mode, mean, or median for a column and replace the missing values with it.'
  merge: -1
  img_proc: true
