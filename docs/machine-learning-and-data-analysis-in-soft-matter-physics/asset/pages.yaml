    The term *inductive* here refers to philosophical induction, suggesting a theory
    to explain observed facts, rather than mathematical induction, proving a property
    for all members of a well-ordered set.


    # Models


    Performing machine learning can involve creating a model, which is trained on
    some training data and then can process additional data to make predictions. Various
    types of models have been used and researched for machine learning systems.


    # Artificial neural networks


    Artificial neural networks (ANNs), or connectionist systems, are computing systems
    vaguely inspired by the biological neural networks that constitute animal brains.
    Such systems “learn” to perform tasks by considering examples, generally without
    being programmed with any task-specific rules.


    An ANN is a model based on a collection of connected units or nodes called “artificial
    neurons”, which loosely model the neurons in a biological brain. Each connection,
    like the synapses in a biological brain, can transmit information, a “signal”,
    from one artificial neuron to another. An artificial neuron that receives a signal
    can process it and then signal additional artificial neurons connected to it.
    In common ANN implementations, the signal at a connection between artificial neurons
    is a real number, and the output of each artificial neuron is computed by some
    non-linear function of the sum of its inputs. The connections between artificial
    neurons are called “edges”. Artificial neurons and edges typically have a weight
    that adjusts as learning proceeds. The weight increases or decreases the strength
    of the signal at a connection. Artificial neurons may have a threshold such that
    the signal is only sent if the aggregate signal crosses that threshold. Typically,
    artificial neurons'
  merge: -1
  img_proc: true
