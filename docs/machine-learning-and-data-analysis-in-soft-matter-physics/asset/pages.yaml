- pgno: 64
  md: 'The “best” (and “worst”) attributes are typically determined using tests of
    statistical significance, which assume that the attributes are independent of
    one another. Many other attribute evaluation measures can be used, such as the
    information gain measure used in building decision trees for classification. Basic
    heuristic methods of attribute subset selection include the following techniques,
    some of which are illustrated in Figure 3.


    +   1. Stepwise forward selection: The procedure starts with an empty set of attributes
    as the reduced set. The best of the original attributes is determined and added
    to the reduced set. At each subsequent iteration or step, the best of the remaining
    original attributes is added to the set.


    +   2. Stepwise backward elimination: The procedure starts with the full set of
    attributes. At each step, it removes the worst attribute remaining in the set.


    +   3. Combination of forward selection and backward elimination: The stepwise
    forward selection and backward elimination methods can be combined so that, at
    each step, the procedure selects the best attribute and removes the worst from
    among the remaining attributes.


    +   4. Decision tree induction: Decision tree algorithms, such as ID3, C4.5, and
    CART, were originally intended for classification. Decision tree induction constructs
    a flowchart-like structure where each internal (nonleaf) node denotes a test on
    an attribute, each branch corresponds to an outcome of the test, and each external
    (leaf) node denotes a class prediction. At each node, the algorithm chooses the
    “best” attribute to partition the data into individual classes.


