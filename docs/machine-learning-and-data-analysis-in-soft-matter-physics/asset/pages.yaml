  md: 'are aggregated into layers. Different layers may perform different kinds of
    transformations on their inputs. Signals travel from the first layer (the input
    layer) to the last layer (the output layer), possibly after traversing the layers
    multiple times.


    The original goal of the ANN approach was to solve problems in the same way that
    a human brain would. However, over time, attention moved to performing specific
    tasks, leading to deviations from biology. Artificial neural networks have been
    used on a variety of tasks, including computer vision, speech recognition, machine
    translation, social network filtering, playing board and video games and medical
    diagnosis.


    Deep learning consists of multiple hidden layers in an artificial neural network.
    This approach tries to model the way the human brain processes light and sound
    into vision and hearing. Some successful applications of deep learning are computer
    vision and speech recognition.


    # Decision trees


    Decision tree learning uses a decision tree as a predictive model to go from observations
    about an item (represented in the branches) to conclusions about the item''s target
    value (represented in the leaves). It is one of the predictive modeling approaches
    used in statistics, data mining, and machine learning. Tree models where the target
    variable can take a discrete set of values are called classification trees; in
    these tree structures, leaves represent class labels, and branches represent conjunctions
    of features that lead to those class labels. Decision trees where the target variable
    can take continuous values (typically real numbers) are called regression trees.
    In decision analysis, a decision tree can be used to visually and explicitly represent
    decisions and decision making. In data mining, a decision tree describes data,
    but the resulting classification tree can be an input for decision-making.


    # Support-vector machines


    Support-vector machines (SVMs), also known as support-vector networks, are a set
    of related supervised learning methods used for classification and regression.
    Given a set of training examples, each marked as belonging to one of two categories,
    an SVM training algorithm builds a model that predicts whether a new example falls
    into one category. An SVM training algorithm is a non-probabilistic, binary, linear
    classifier, although methods such as Platt scaling exist to use SVM in a probabilistic
    classification setting. In addition to performing linear'
  merge: -1
