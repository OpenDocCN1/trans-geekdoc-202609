    # ## 6.2.3 Weighted Moving Average


    A weighted average is an average that has multiplying factors to give different
    weights to data at different positions in the sample window. Mathematically, the
    weighted moving average is the convolution of the data with a fixed weighting
    function. One application is removing pixelization from a digital graphical image.


    In the financial field, and more specifically in the analyses of financial data,
    a weighted moving average (WMA) has the specific meaning of weights that decrease
    in arithmetical progression. In an n-day WMA the latest day has weight n, the
    second latest n-1, etc., down to one.


    WMA_M = \frac{np_M + (n-1)p_{M-1} + \cdots + 2p_{((M-n)+2)} + p_{((M-n)+1)}}{n
    + (n-1) + \cdots + 2 + 1}


    The denominator is a triangle number equal to \frac{n(n+1)}{2}. In the more general
    case the denominator will always be the sum of the individual weights.


    When calculating the WMA across successive values, the difference between the
    numerators of


    WMA_{M+1} and WMA_M is np_{M+1} - p_M - \cdots - p_{M-n+1}. If we denote the sum
    p_M + \cdots + p_{M-n+1} by Total_M, then


    Total_{M+1} = Total_M + p_{M+1} - p_{M-n+1}

    Numerator_{M+1} = Numerator_M + np_{M+1} - Total_M


    WMA_{M+1} = \frac{Numerator_{M+1}}{n + (n-1) + \cdots + 2 + 1}'
