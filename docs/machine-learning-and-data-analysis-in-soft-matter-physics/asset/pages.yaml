  md: '# 5. BIRCH Algorithm


    Balanced Iterative Reducing and Clustering using Hierarchies, or BIRCH is a clustering
    technique used for very large datasets. A fast algorithm that scans the entire
    dataset in a single pass. It is dedicated to solving the issues of large dataset
    clustering by focusing on densely occupied spaces and creating a precise summary.


    BIRCH fits in with any provided amount of memory and minimizes the I/O complexity.
    The algorithm only works to process metric attributes, which means the one with
    no categorical variables or the attribute whose value can be represented by explicit
    coordinates in a Euclidean space. The main parameters of the algorithm are the
    CR tree and the threshold.


    +   CF tree: The clustering Feature tree is a tree in which each leaf node consists
    of a sub-cluster. Each entry in a CF tree holds a pointer to a child node. The
    CF entry is made up of the sum of CF entries in the child nodes.


    +   Threshold: A maximum number of entries in each leaf node


    # Steps of BIRCH Algorithm


    +   Step 1- Building the Clustering feature (CF) Tree: Building small and dense
    regions from the large datasets. Optionally, in phase 2 condensing the CF tree
    into further small CF.


    +   Step 2 – Global clustering: Applying clustering algorithm to leaf nodes of
    the CF tree.


    +   Step 3 – Refining the clusters, if required.


    # 4.1.4 Applications of Clustering


    Clustering is applied in various fields to prepare the data for various machine
    learning processes. Some of the applications of clustering are as follows.


    +   Market segmentation: Businesses need to segment their market into smaller
    groups to understand the target audience. Clustering groups the like-minded people
    considering the neighborhood to generate similar recommendations, and it helps
    in pattern building and insight development.


    +   Retail marketing and sales: Marketing utilizes clustering to understand the
    customers’ purchase behavior to regulate the supply chain and recommendations.
    It groups people with similar traits and probability of purchase. It helps in
    reaching'
  merge: -1
  img_proc: true
