    # 2.3.1 Data Reduction Strategies


    Data reduction strategies include dimensionality reduction, numerosity reduction,
    and data compression.


    # Dimensionality Reduction


    Dimensionality reduction is the process of reducing the number of random variables
    or attributes under consideration. Dimensionality reduction methods include wavelet
    transforms and principal components analysis, which transform or project the original
    data onto a smaller space. Attribute subset selection is a method of dimensionality
    reduction in which irrelevant, weakly relevant, or redundant attributes or dimensions
    are detected and removed.


    # Numerosity Reduction


    Techniques of numerosity reduction replace the original data volume by alternative,
    smaller forms of data representation. These techniques may be parametric or nonparametric.


    For parametric methods, a model is used to estimate the data, so that typically
    only the data parameters need to be stored, instead of the actual data. (Outliers
    may also be stored.) Regression and log-linear models are examples. Nonparametric
    methods for storing reduced representations of the data include histograms, clustering,
    sampling, and data cube aggregation.


    # Data Compression


    In data compression, transformations are applied so as to obtain a reduced or
    “compressed” representation of the original data. If the original data can be
    reconstructed from the compressed data without any loss of information, the data
    reduction is called lossless. If, instead, we can reconstruct only an approximation
    of the original data, then the data reduction is called lossy. There are several
    lossless algorithms for string compression, however, they typically allow only
    limited manipulation of the data. Dimensionality reduction and numerosity reduction
    techniques can also be considered forms of data compression.'
  merge: -1
  img_proc: true
