- pgno: 50
  md: '# 2.1.1 Steps of Data Cleaning


    While the techniques used for data cleaning may vary according to the types of
    data your company stores, you can follow these basic steps to cleaning your data,
    such as:


    # 1. Remove Duplicate or Irrelevant Observations


    Remove unwanted observations from your dataset, including duplicate observations
    or irrelevant observations. Duplicate observations will happen most often during
    data collection. When you combine data sets from multiple places, scrape data,
    or receive data from clients or multiple departments, there are opportunities
    to create duplicate data. De-duplication is one of the largest areas to be considered
    in this process. Irrelevant observations are when you notice observations that
    do not fit into the specific problem you are trying to analyze.


    For example, if you want to analyze data regarding millennial customers, but your
    dataset includes older generations, you might remove those irrelevant observations.
    This can make analysis more efficient, minimize distraction from your primary
    target, and create a more manageable and performable dataset.


    # 2. Fix Structural Errors


    Structural errors are when you measure or transfer data and notice strange naming
    conventions, typos, or incorrect capitalization. These inconsistencies can cause
    mislabeled categories or classes. For example, you may find “N/A” and “Not Applicable”
    in any sheet, but they should be analyzed in the same category.


    # 3. Filter Unwanted Outliers


    Often, there will be one-off observations where, at a glance, they do not appear
    to fit within the data you are analyzing. If you have a legitimate reason to remove
    an outlier, like improper data entry, doing so will help the performance of the
    data you are working with.


    However, sometimes, the appearance of an outlier will prove a theory you are working
    on. And just because an outlier exists doesn’t mean it is incorrect. This step
    is needed to determine the validity of that number. If an outlier proves to be
    irrelevant for analysis or is a mistake, consider removing it.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# 4. Handle Missing Data


    You can''t ignore missing data because many algorithms will not accept missing
    values. There are a couple of ways to deal with missing data. Neither is optimal,
    but both can be considered, such as:


    +   - You can drop observations with missing values, but this will drop or lose
    information, so be careful before removing it.

    +   - You can input missing values based on other observations; again there is
    an opportunity to lose the integrity of the data because you may be operating
    from assumptions and not actual observations.

    +   - You might alter how the data is used to navigate null values effectively.


    # 5. Validate and QA


    At the end of the data cleaning process, you should be able to answer these questions
    as a part of basic validation, such as:


    +   - Does the data make sense?

    +   - Does the data follow the appropriate rules for its field?

    +   - Does it prove or disprove your working theory or bring any insight to light?

