    # 4.1.3 Types of Clustering Algorithms


    Clustering algorithms are used in exploring data, anomaly detection, finding outliers,
    or detecting patterns in the data. Clustering is an unsupervised learning technique
    like neural network and reinforcement learning. The available data is highly unstructured,
    heterogeneous, and contains noise. So the choice of algorithm depends upon how
    the data looks like. A suitable clustering algorithm helps in finding valuable
    insights for the industry. Let’s explore the different types of clustering in
    machine learning in detail.


    +   - K-Means clustering

    +   - Mini batch K-Means clustering algorithm

    +   - Mean Shift

    +   - Divisive Hierarchical Clustering

    +   - Hierarchical Agglomerative clustering

    +   - Gaussian Mixture Model

    +   - DBSCAN

    +   - OPTICS

    +   - BIRCH Algorithm


    # 1. K-Means Clustering


    K-Means is a partition-based clustering technique that uses the distance between
    the Euclidean distances between the points as a criterion for cluster formation.
    Assuming there are ‘n’ numbers of data objects, K-Means groups them into a predetermined
    ‘k’ number of clusters.


    Each cluster has a cluster center allocated and each of them is placed at farther
    distances. Every incoming data point gets placed in the cluster with the closest
    cluster center. This process is repeated until all the data points get assigned
    to any cluster. Once all the data points are covered the cluster centers or centroids
    are recalculated. After having these ‘k’ new centroids, a new grouping is done
    between the nearest new centroid and the same data set points. Iteratively, there
    may be a change'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'in the k centroid values and their location this loop continues until the cluster
    centers do not change or in other words, centroids do not move anymore. The algorithm
    aims to minimize the objective function


    ```

    J = \sum_{j=1}^{k} \sum_{i=1}^{n} \| x_i^{(j)} - c_j \|^2

    ```


    Where J, is the chosen distance between cluster center c_j and data point x_i


    The correct value of K can be chosen using the Silhouette method and Elbow method.
    The Silhouette method calculates the distance using the mean intra-cluster distance
    along with an average of the closest cluster distance for each data point. While
    the Elbow method uses the sum of squared data points and computes the average
    distance.


    # Implementation: K-Means clustering algorithm


    +   - Select ‘k’ number of clusters and centroids for each cluster.

    +   - Shuffle the data points in the dataset and initialize the selected centroid.

    +   - Assign the clusters to the data points without replacement.

    +   - Create new centroids by calculating the mean value of the samples.

    +   - Reinitialize the cluster centers until there is no change in the clusters.


    # 2. Mean Shift Clustering Algorithm


    Mean shift clustering is a nonparametric, simple, and flexible clustering technique.
    It is based upon a method to estimate the essential distribution for a given dataset
    known as kernel density estimation.


