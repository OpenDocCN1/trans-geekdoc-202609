    Naïve Bayes, Bernoulli Naïve Bayes, and Gaussian Naïve Bayes. This technique is
    primarily used in text classification, spam identification, and recommendation
    systems.


    +   **Linear regression:** Linear regression is used to identify the relationship
    between a dependent variable and one or more independent variables and is typically
    leveraged to make predictions about future outcomes.


    When there is only one independent variable and one dependent variable, it is
    known as simple linear regression. As the number of independent variables increases,
    it is referred to as multiple linear regression. For each type of linear regression,
    it seeks to plot a line of best fit, which is calculated through the method of
    least squares. However, unlike other regression models, this line is straight
    when plotted on a graph.


    +   **Logistic regression:** While linear regression is leveraged when dependent
    variables are continuous, logistic regression is selected when the dependent variable
    is categorical, meaning they have binary outputs, such as “true” and “false” or
    “yes” and “no.” While both regression models seek to understand relationships
    between data inputs, logistic regression is mainly used to solve binary classification
    problems, such as spam identification.


    +   **Support vector machines (SVM):** A support vector machine is a popular supervised
    learning model developed by Vladimir Vapnik, used for both data classification
    and regression. That said, it is typically leveraged for classification problems,
    constructing a hyperplane where the distance between two classes of data points
    is at its maximum.


    This hyperplane is known as the decision boundary, separating the classes of data
    points (e.g., oranges vs. apples) on either side of the plane.


    +   **K-nearest neighbor:** K-nearest neighbor, also known as the KNN algorithm,
    is a non-parametric algorithm that classifies data points based on their proximity
    and association to other available data. This algorithm assumes that similar data'
