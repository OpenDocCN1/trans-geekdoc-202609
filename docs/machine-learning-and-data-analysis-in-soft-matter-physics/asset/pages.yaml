- pgno: 84
  md: '# SUPERVISED LEARNING METHODS


    # INTRODUCTION


    Supervised learning is the types of machine learning in which machines are trained
    using well “labelled” training data, and on basis of that data, machines predict
    the output. The labelled data means some input data is already tagged with the
    correct output.


    In supervised learning, the training data provided to the machines work as the
    supervisor that teaches the machines to predict the output correctly. It applies
    the same concept as a student learns in the supervision of the teacher.


    Supervised learning is a process of providing input data as well as correct output
    data to the machine learning model. The aim of a supervised learning algorithm
    is to find a mapping function to map the input variable(x) with the output variable(y).


    In the real-world, supervised learning can be used for Risk Assessment, Image
    classification, Fraud Detection, spam filtering, etc.


    # 3.1 DEFINITION SUPERVISED LEARNING


    Supervised Learning is a machine learning paradigm for acquiring the input-output
    relationship information of a system based on a given set of paired input-output
    training samples. As the output is regarded'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'as the label of the input data or the supervision, an input-output training
    sample is also called labelled training data, or supervised data. Occasionally,
    it is also referred to as Learning with a Teacher (Haykin 1998), Learning from
    Labelled Data, or Inductive Machine Learning. The goal of supervised learning
    is to build an artificial system that can learn the mapping between the input
    and the output, and can predict the output of the system given new inputs. If
    the output takes a finite set of discrete values that indicate the class labels
    of the input, the learned mapping leads to the classification of the input data.
    If the output takes continuous values, it leads to a regression of the input.
    The input-output relationship information is frequently represented with learning-model
    parameters. When these parameters are not directly available from training samples,
    a learning system needs to go through an estimation process to obtain these parameters.
    Different form Unsupervised Learning, the training data for Supervised Learning
    need supervised or labelled information, while the training data for unsupervised
    learning are unsupervised as they are not labelled (i.e., merely the inputs).
    If an algorithm uses both supervised and unsupervised training data, it is called
    a Semi-supervised Learning algorithm. If an algorithm actively queries a user/teacher
    for labels in the training process, the iterative supervised learning is called
    Active Learning.


    ![](img/c4a53cbbd40023d194b7887dddf3293b_85_0.png)


    # Figure 1. Block diagram that illustrates the form of Supervised Learning


    Figure 1 shows a block diagram that illustrates the form of Supervised Learning.
    In this diagram, (xi, yi ) is a supervised training sample, where ‘x’ represents
    system input, ‘y’ represents the system output (i.e., the supervision or labelling
    of the input x), and ‘i’ is the index of the training sample. During a Supervised
    Learning process, a training input xi is fed to the Learning System, and the Learning
    System generates an output Ŷi . The Learning System output Ŷi is then compared
    with the ground truth labeling yi by an arbitraor that computes the difference
    between them. The difference, termed Error Signal in this diagram, is then sent
    to the Learning System for adjusting the parameters of the learner. The goal of
    this learning process is to obtain a set of optimal Learning System'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'parameters that can minimize the differences between \(\tilde{\mathbf{Y}}_i\)
    and \(y_i\) for all i, i.e., minimizing the total error over the entire training
    data set.


    A notable phenomenon is that a minimum training error does not necessarily indicate
    a good performance in testing. Training is referred to as the learning process
    that estimates the parameters of the learner based on the ground truth supervised
    data seen, while testing is to evaluate the predictions of the learner for the
    data unseen, i.e., the data used in testing have not been included in the training
    process. Therefore, even if a learner achieves a minimum error on the set of training
    data, it does not guarantee to perform well to the data unseen. The reason for
    this is mainly due to the possible overfitting to the training data, i.e., the
    learner has an unnecessary order of complexity in learning the mapping.


    This issue is referred to as the generalizablity. A good learning algorithm must
    have a good generalizablity. To take into consideration of the generalizablity
    in designing the learner, a learning algorithm needs to balance the objective
    of minimizing the training error and the complexity of the learner (e.g., the
    strucutre and the order of the learner). For example, in the Support Vector Machine,
    the generalizablity of the learner is charaterized by the margin of the learned
    discrimination boundary. The larger the margin, the better the generalization.
    The support vector machine learns a maximum margin classifier over the training
    set, and thus it naturally leads to a good generalization performance.


    The Supervised Learning paradigm does not restrict the sources of the input or
    output data. The input or output may belong to a vector space or a set of discrete
    values. The learning paradigm does not have special restrictions on the arbitrator
    either. If \(y_i\) is drawn from a continuous space, the error signal is usually
    computed via \(y_i - \tilde{\mathbf{Y}}_i\) . If \(y_i\) belongs to a set of discrete
    values, the arbitrator usually outputs the error signal based on the equality
    between \(y_i\) and \(\tilde{\mathbf{Y}}_i\) . For example, the arbitrator may
    output 0 for equalled \(y_i\) and \(\tilde{\mathbf{Y}}_i\) and output 1 for different
    \(y_i\) and \(\tilde{\mathbf{Y}}_i\) .


    There are different approaches to the design of the Learning System in Supervised
    Learning. Some wellknown approaches include the logic-based approach, the multi-layer
    perceptron approach, the statistical learning approach, the instance-based learning
    approach, the Support Vector Machines, and Boosting.'
  merge: -1
