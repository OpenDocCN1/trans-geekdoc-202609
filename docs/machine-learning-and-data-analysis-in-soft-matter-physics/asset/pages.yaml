    | Initial attribute set: {A1, A2, A3, A4, A5, A6} Initial reduced set: {} => {A1}
    => {A1, A4} => Reduced attribute set: {A1, A4, A6} | Initial attribute set: {A1,
    A2, A3, A4, A5, A6} => {A1, A3, A4, A5, A6} => {A1, A4, A5, A6} => Reduced attribute
    set: {A1, A4, A6} | Initial attribute set: {A1, A2, A3, A4, A5, A6} => Reduced
    attribute set: {A1, A4, A6} |


    Figure 3. Greedy (heuristic) methods for attribute subset selection.'
