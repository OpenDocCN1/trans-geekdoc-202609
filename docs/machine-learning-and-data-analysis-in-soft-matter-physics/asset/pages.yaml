    a reward, it reinforces the behavior and signals the agent to employ the same
    tactics again next time.


    # 7.1.1 History & Background


    The foundations for reinforcement learning were laid over 100 years ago, and it
    is actually said to have a two-pronged origin. The first is rooted in animal learning
    and the “Law of Effect,” coined by Edward Thorndike. Thorndike described the Law
    of Effect in 1911 as the notion that an animal will repeat actions if they produce
    satisfaction, and it will be deterred from actions that produce discomfort. Furthermore,
    the greater the level of pleasure or pain, the greater the pursuit or deterrence
    from the action. The Law of Effect combines both selectional and associative learning;
    with selectional learning, the animal will try to try a few different options
    and routes and select among them based on how they went. In associative learning,
    the animal chooses its options based on what situations they associate them with,
    and whether they’re positive or negative.


    Although Thorndike established the essence of reinforcement learning, the term
    “reinforcement” wasn’t formally used until 1927 by Ivan Pavlov. He described reinforcement
    as “the strengthening of a pattern of behavior due to an animal receiving a stimulus—a
    reinforcer— in a time-dependent relationship with another stimulus or with a response.”
    In other words, when animals receive a reaction to something they’ve done shortly
    after they’ve done it, it affects whether or not they’ll do it again, in the same
    way, in the future.


    The second origin, optimal control, is more rooted in mathematics and algorithms
    than animal learning. Starting in the 1950s, researchers began to define optimization
    methods to derive control policies in continuous time control problems. Building
    on this, Richard Bellman developed programming that defines a functional equation
    using a dynamic system’s state and returns an optimal value function (commonly
    referred to as the Bellman equation). Bellman then went on to introduce'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'the Markovian Decision Process (MDP), which he defines as “a discrete stochastic
    version of the optimal control problem”. MDPs helped create solution methods that
