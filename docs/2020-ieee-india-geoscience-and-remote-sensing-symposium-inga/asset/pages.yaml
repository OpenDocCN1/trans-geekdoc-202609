    # 3. METHODOLOGY


    In order to train a multi-class segmentation network, the model requires mult-class
    masks as input. To achieve this, the class masks were merged to create a multi-class
    mask for training. Further, the multispectral images, as well as the combined
    mask, were split into grids of size 256 x256 pixels to generate training, validation
    and test samples as depicted in Fig. 2.


    # 3.1. Dataset Preprocessing


    The acquired LULC shapefile for the region of Mandya consists of 50 classes at
    a higher granularity than the consideration of this. To conform to the proposed
    scheme, these classes were combined into five high-level classes using relevant
    tasks, and masks were generated for these classes.


