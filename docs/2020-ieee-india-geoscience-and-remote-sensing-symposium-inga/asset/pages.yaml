    access to large remote sensing data. The main challenges with remote sensing are
    image interpretation and pattern recognition which are not straightforward surveying
    methods of analysis are tedious. Recent developments in Deep Learning (DL) [3,
    4] show its potential in remote sensing classification and object detection.


    One of the major aspects of satellite data is generation of Land Use / Land Cover
    (LUC) maps. LUC refers to the natural cover on the ground forest, water, bare
    soil. Identification of land classes establishes the baseline information for
    thematic mapping and change detection analysis. Land use refers to the purpose
    such as agriculture, buildings, rectify habitat. These features can be represented
    in


    The objective of this study is to create a “Proof of concept” on the ability to
    automate mapping of multispectral data using existing LUC map to generate major
    maps for the region of Mandya, Karnataka, India. Croplands, forests, built-up
    areas and water bodies are the major classes of interest in this study.


