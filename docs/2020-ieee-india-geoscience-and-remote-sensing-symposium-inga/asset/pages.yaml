    # ABSTRACT


    In general, a visual interpretation technique is adopted for mapping of Use /
    Land Cover (LUC) using temporal satellite data. Although highly accurate, the
    process is tedious, consuming and requires a significant amount of domain knowledge.
    This limitation introduces a scope for automation to reduce manual effort involved
    in interpretation. The research explores a multi-class training using a Deep Learning
    (DL) model to generate major LUC classes. Five bands, namely Blue, Green, Red,
    Near-Infrared (NIR) and Short Wave Infrared (SWIR) from the satellite, covering
    Mandya, Karnataka, India was used to train the method. An existing LUC mapping
    of the region was used as input for automated generated labeling tasks. Four LUC
    classes of- water bodies, forests, grasslands, built-up were classified with an
    average F1 score of 0.8. The trained model applied to objects has shown encouraging
    results which makes this an effective method to produce the generation of LUC
    maps.


    **Index Terms**- Sentinel-2, Satellite Imagery, Multispectral Images, Remote Sensing,
    Land Use Cover, Deep Learning (DL), Segmentation, Classification, SegNet


    # 1. INTRODUCTION


    Remote sensing is the science of acquiring information about the physical characteristics
    of an area by measuring emitted or reflected radiation, typically from aerial
    or space platforms. The discipline found us partly due to increasing ease of data
    availability, with access to over satellite datasets like Landsat [1] and Sentinel
    [2] providing free


