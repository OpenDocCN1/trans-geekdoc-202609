    indices using Like Normalized Vegetation Index (NDVI) [5] and Modified Normalized
    Water Index (MNDWI) [6], which are mathematical representations of physical information
    present in combinations of bands. The values captured by these indices consistently
    show variation in spectral characteristics, aiding satellite image classification
    and segmentation with reasonable accuracy.


    Further exploration in the use of spectral characteristics leads us to identify
    homogeneous areas within a satellite image [7]. This grouping based on similarity
    eliminates a large number of intermediate classes, generating a robust set of
    classes which are lesser in number. A more recent study explores the use of discrete
    transforms in improving LULC classification [8]. These techniques though quite
    sufficient, still require a significant amount of manual effort for the creation
    of LULC maps. Also, such techniques only take into account spectral values, omitting
    contextual, texture and geometric features. DL models are capable of understanding
    position, shape and scale, which makes them an excellent option for automation.


