    # 5. CONCLUSION


    This research presents a DL methodology for LULC classification through images
    multi-class segmentation using a single model. A major challenge for the remote
    sensing community is the labeling of training classes, which has been addressed
    in this study using existing LULC map of scale:150. The results are highly promising
    with an average F1 Score of 0.84 with accuracy for classes forests and croplands.
    Although accuracy was for


    water and built-up, lower number of support pixels accounts for this difference.
    These results support the SegNet model as a fast feasible solution for generation
    of LULC maps. In the study, single date Sentinel-2A multispectral data was used
    for production of broad LULC map. Machine learning, and in particular, fast evolving
    sub-disciplines like DL with the promise of analysis of satellite images, more
    scalable and scope for full or partial automation of spectral data analysis.


