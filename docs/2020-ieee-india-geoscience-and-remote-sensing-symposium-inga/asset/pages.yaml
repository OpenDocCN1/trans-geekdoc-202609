    # ##2. DATASET


    Multpectral Sentinel-2 satellite images are chosen as the dataset for this study.
    This satellite was set up with the intention of monitoring changes on the Earth''s
    surface. Sentinel-2 captures images in 13 bands with spatial resolution of 10m,
    20m and 60m. Due to poor resolution the 60 bands are not taken into consideration
    for the study.


