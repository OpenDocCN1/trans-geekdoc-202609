    developments in Deep Learning (DL) [3, 4] show its potential in remote sensing
    classification and object detection.


    One of the major aspects of satellite data is generation of Land Use / Land Cover
    (LUC) maps. LUC refers to the natural cover on the ground—forest, water, bare
    soil. Identification of land classes establishes the baseline information for
    thematic mapping and change detection analysis. Land use refers to the purpose
