    Water Index (MNDWI) [6], which are mathematical representations of physical information
    present in combinations of bands. The values captured by these indices consistently
    show variation in spectral characteristics, aiding satellite image classification
    and segmentation with reasonable accuracy.


    Further exploration in the use of spectral characteristics leads us to identify
