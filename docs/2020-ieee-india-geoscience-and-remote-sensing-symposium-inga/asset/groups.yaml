    ## 5. 结论


    本研究提出了一种通过单一模型进行图像多类别分割的土地利用与覆盖（LULC）分类的深度学习方法。遥感领域面临的一个大挑战是训练类别的标注，本研究利用现有的比例为
    1:150 的 LULC 地图解决了这个问题。结果非常令人满意，森林和农田类别的平均 F1 分数准确率为 0.84。虽然水体和建筑区的准确率较低，但支持像素较少解释了这一差异。这些结果证明
    SegNet 模型是生成 LULC 地图的快速可行解决方案。在研究中，使用了单日期 Sentinel-2A 多光谱数据来制作广泛的 LULC 地图。机器学习，特别是深度学习等快速发展的子学科，具有卫星图像分析的潜力，更具扩展性，并有利于光谱数据分析的全自动化或部分自动化。


