    \ Karnataka, India\n\n# 摘要\n\n通常，采用视觉解释技术利用时间序列卫星数据进行土地利用/覆盖（LUC）制图。尽管该过程非常准确，但其过程枯燥、耗时，且需要大量的领域专业知识。这种局限性为自动化提供了空间，以减少解释过程中涉及的人工工作。本研究探索了使用深度学习（DL）模型进行多分类训练，以生成主要的\
    \ LUC 类。使用了涵盖印度卡纳塔克邦曼德亚（Mandya）地区的卫星五个波段，即蓝、绿、红、近红外（NIR）和短波红外（SWIR）来训练该方法。该地区现有的\
    \ LUC 地图用作自动生成标签任务的输入。对四类 LUC——水体、森林、草地、建成区进行了分类，平均 F1 分数为 0.8。训练后的模型应用于对象后显示出令人鼓舞的结果，这使其成为生成\
    \ LUC 地图的有效方法。\n\n**索引术**\n- Sentinel-2、卫星图像、多光谱图像、遥感、土地利用覆盖、深度学习（DL）、分割、分类、SegNet\n\
    \n# 1. 引言\n\n遥感是一门通过测量发射或反射的辐射（通常来自航空或空间平台）来获取有关区域物理特征信息的科学。这门学科的出现部分归功于数据可用性的日益提高，通过访问诸如\
    \ Landsat [1] 和 Sentinel [2] 等多个卫星数据集，提供了对大量遥感数据的免费访问。\n\n> *本工作得到了印度政府空间部印度遥感研究组织南部区域遥感中心（RRSC）南的支持。*\n\
    \n遥感面临的主要挑战是图像解释和模式识别，这些并不是简单的测量方法；分析过程是枯燥的。深度学习（DL）[3, 4] 的最新进展展示了其在遥感分类和目标检测方面的潜力。\n\
    \n卫星数据的主要方面之一是生成土地利用/土地覆盖（LUC）地图。LUC 指地面的自然覆盖——森林、水体、裸土。土地类别的识别为主题制图和变化检测分析建立了基础信息。土地利用是指用途，如农业、建筑、恢复栖息地。这些特征可以在……中表示\n\
    \n本研究的目标是创建一个“概念验证”，利用现有的 LUC 地图实现多光谱数据自动制图的能力，为印度卡纳塔克邦曼德亚地区生成主要地图。农田、森林、建成区和水体是本研究关注的主要类别。\n\
    \n## 1.1. 先前方法\n\n各种研究人员已经探索了多种方法从多光谱卫星图像生成 LUC 地图，结果不异。其中，一种流行技术是使用如归一化植被指数（NDVI）[5]\
    \ 和改进归一化水体指数（MNDWI）[6] 等定量指数，这些是波段组合中物理信息的数学表示。这些指数捕获的值一致显示出光谱特征的变化，有助于以合理的准确率进行卫星图像的分类和分割。\n\
    \n对光谱特征使用的进一步探索引导我们识别卫星图像中的同质区域 [7]。这种基于相似性的分组消除了大量的中间类别，生成了一组数量较少但稳健的类别。最近的研究探索了使用离散变换来改进\
    \ LULC 分类 [8]。这些技术虽然相当充分，但创建 LULC 地图仍需要大量的人工工作。此外，此类技术只考虑了光谱值，忽略了上下文、纹理和几何特征。DL\
    \ 模型能够理解位置、形状和比例，这使其成为自动化的极佳选择。\n\n![](img/9cc93e1db3a9f18c04a85008592e6b_1)\n\
    \n图 1. 自然类别的地图：(a) 建成区、(b) 森林；(c) 农田；(d) 水体\n\n## 2. 数据集\n\n选择 Sentinel-2 卫星图像作为本研究的数据集。该卫星的目的是监测地表变化。Sentinel-2\
    \ 获取 13 个波段，空间分辨率分别为 10m、20m 和 60m。由于分辨率问题，未考虑 60m 的波段。\n\n![](img/9cc93e1db3a9f18c04a85008592e6b_2)\n\
    \n图 2. 数据集生成 - 分割固定大小的矢量文件\n\n研究目标区域是曼德亚，它是卡纳塔克邦一个农业密集的地区。曼德亚位于北纬 12.52 度，平均海拔\
    \ 67 米。对于本研究，使用了 2018 年 12 月至 2019 年 1 月的卫星图像。\n\n随后这些这些掩码并分配了相应的属性值。属性包含特定图层或掩码的信息，每个属性捕捉一个单元区域。在\
    \ LULC 的背景下，可以将 50 个类别合并为水体、农田、森林和建成区的掩码，如……\n\n## 3. 方法论\n\n本研究采用三层方法以准确分割卫星图像并生成\
    \ LULC 地图。它从处理卫星图像以生成 LULC 地图开始。\n\n## 3.1. 数据集\n\n本研究采用三层方法以准确分割卫星图像并生成 LULC\
    \ 地图。它从处理卫星图像以生成 LULC 地图开始。\n\n## 3.2. 预处理\n\n本研究采用三层方法以准确分割卫星图像并生成 LULC 地图。它从处理卫星图像以生成\
