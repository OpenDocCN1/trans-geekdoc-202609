    # A MULTICLASS DEEP LEARNING APPROACH FOR LUC CLASSIFICATION OF MULTISPECTRAL
    SATELLITE IMAGES


    Dinesh Sathanayarayanan, V Anudeep C, Ananja Keshav, Santh Bahadur, Uma D R Hebbar,
