    ## 使用 GMM 进行无监督聚类


    对于分类为非 RE 的 CCDG 样本，可能仍然找到同质的祖先群体，以用于 HWE 测试。我们利用 1000 基因组数据，依赖无监督学习来寻找这些群体。Unscrucca
    等人的 GMM[13] 使用来自 TRACE 的调整后 15 个 PC。从 BC 来看，最佳聚类数量为九。为了确定每个簇的祖先标签，我们在图 4 中绘制了具有定义高相似性的
    RF 预测概率热图。对于任何在不同祖先之间显示出预测预测概率的簇，我们将其视为“其他类”（cluster-other），这些类是高度混合的，不适用于 HWE。


    ## 半监督祖先群体


    我们的半监督方法结合了 RE 和 GMM 结果，共产生了 18 组同质祖先群体——其中 11 个来自基于 1000 基因组群体 Fst 的层次聚类，7 个来自
    G 簇。我们使用我们的半监督方法为大多数样本（95%，即 57,628/60,545）分配了同质祖先。


    ## HWE 测试结果比较


    我们使用基于 PLINK22 的 Witten 等人的 HWE 检验方法进行 HWE 子集分析。为了分析基于报告和预测的祖先的结论，我们使用了 RE 和 HARE
    标签。我们使用了一组由 Konow[23] 定义为“高质量”的变异。在祖先研究中，Konow 等人将高质量变异定义为 HapMap[3] 中 20 号染色体的非同源性位点，并证明了在调整群体异质性时，这些位点可以用于
    HWE。具体而言，在合适的群体异质性计数下，失败 HWE 测试的变异更少，例如与祖先样本相比。因此，我们采用了他们的策略，以及 HapMap[3] 与 CCDG
    的重叠部分，来评估我们的祖先标签在 HWE 测试中解释群体异质性的倾向。当每个祖先群体中的少数等位基因计数少于 100 时，我们展示了基于不同 p 值计数的显著变异比例。在这些
    14,393 个变异中，我们观察到的总体趋势是：基于我们方法的 HWE 测试在统计学上拒绝的预测祖先变异少于自报告的祖先民族和 HARE 标签。我们比较了我们的半监督方法移除的变异比例与自报告祖先民族和
    HARE 标签的比例。在任何具有统计学显著 p 值的变异中，我们的半监督方法移除的变异至少包含了一个祖先群体。在半监督 HWE 测试的变异中，我们观察到比例分别为
    0.3% 到 22%，且在 p 值阈值为 0.05 时增加了。然而，我们的优化方法使用了两种方法进行 HWE 测试，并预计在使用我们的半监督祖先标签时，HWE
    不会被移除。


    对于使用自报告种族和民族或 HARE 标签进行 HWE 测试的变异，我们观察到 p 值阈值为 0.05 时，分别有 44% 和 29% 的西班牙裔和亚洲裔标签被移除。两种标签都是异质的；此外，两种标签也包含了东亚和南亚。因为我们的祖先群体符合
    HWE 测试的可能假设；因此，使用我们方法的许多此类变异失败了测试。


    此外，我们将半监督 HWE 分析应用于无监督 RE。总体而言，与无监督标签相比，我们观察到基于 HWE 测试的显著变异更少。使用 1e-05 的 p 值阈值，分别有
    42% 的变异解释了统计学显著变异。这种差异归于半监督聚类步骤，该方法发现了最初被分类为“其他”的同质簇。作为簇，这些方法允许我们对 95% 的 CCDG
