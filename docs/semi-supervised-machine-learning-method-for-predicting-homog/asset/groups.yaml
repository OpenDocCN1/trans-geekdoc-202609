    ## 表 2. 合并组中 CCDG 染色体 20 号与 HapMap3 重叠且 HWE 精确 p 值小于 1e-05 和 1e-04 的高质量变异数量


    | 祖源群 | p < 1e-05 的变异数量 | p < 1e-04 的变异数量 |

    |---|---|---|

    | R-MXLC-MXL | 7 | 28 |

    | MXL 合并 | 15 | 54 |

    | R-AFRJC-AFRI/3 | 17 | 75 |

    | AFR 合并 | 10 | 20 |

    | R-EAS2JC-EAS | 0 | 5 |

    | EAS 合并 | 0 | 5 |

    | R-PUR/CLMCJ-EUR/PUR/CLM | 0 | 5 |

    | EUR/PUR/CLM 合并 | 0 | 5 |


    > *“R-” 指代来自随机森林的群组，“C-” 指来自 GMM 聚类。*


    基因型数据的削减。未来的一个潜在方向是考虑细粒度的人群结构，这可以捕捉更适用于 HWE 子集测试的高度同质祖源。虽然观察祖源是可以的，但由于遗传变异，某些个体可能无法归入任何类别。因此，与其将变异标记为祖源类别，不如将祖源视为连续体，这能更好地反映所有个体遗传变异的真实分布。虽然在这种情况下，HWE
    子集是不可行的，但这为未来开发一种能够作为连续体适当调整群体结构的 HWE 方法提供了机会。


