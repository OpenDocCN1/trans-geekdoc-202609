    总而言之，我们的四个步骤如下：


    - (1) 从多样化的参考面板中获取祖先同质性群组。

    - (2) 计算参考面板的祖先主成分（PCs）。训练一个分类模型（例如 RF^1），将祖先回归到相应的祖先分组中。

    - (3) 使用 TRACE 将样本投影到参考面板的 PC 空间，从而计算样本的祖先 PC。

    - (4) 应用训练好的分类模型研究样本，根据预测的祖先 PC 预测同质性祖先分组。


    ![](img/7593f00bc7da5cac8436fdf8d5192a63_3_0.png)


    # 聚类步骤


    来自不同研究的研究可能比参考面板更具异质性，或者无法归类为参考人群中的任何一类。如果样本不能以高确定性属于某一特定人群，我们将其归为离群值，这违反了传统哈德代伯平衡（HW）的同质性假设。为了解决这个问题，我们通过聚类步骤与其他采样样本构建同质群组。


    具体而言，我们采用了 Srcrua 等人的基于参数高斯混合模型（GMM）的模型聚类方法，将个体分为同质子群；该方法通过层次模型聚类进行初始化，并使用期望极大化（EM）算法进行估计。我们将分类后的祖先
    PC 作为输入，根据贝叶斯信息准则（BIC）选择最优模型和簇数量。最后，我们利用 RF（步骤 1）对每个聚类预测的概率来确定聚类分配。


    图 1. CDCG 数据集的自报告种族和民族（n=60,545）。参与者在 CDCG 中报告了他们自我认同的种族和民族。“其他”组包括非西班牙裔、美国/阿拉斯加非西班牙裔、印度裔/亚洲原住民非西班牙裔、其他非西班牙裔、多族裔-西班牙裔/拉丁裔、未报告或多族裔-非西班牙裔。


    # 结合 RF 和聚类群组


    如果值低于特定阈值，将 RF 组和聚类组结合进行 HWE 子集测试可能是合理的。根据我们的敏感性分析，我们建议在 10000 数据集中使用 0.008 的截止值来创建同质祖先群组（见注
    2）。虽然结合这些可以增加检测偏离 HWE 的能力，但也存在包含异质性的风险。考虑到这些权衡，我们由用户决定是否在祖先分组测试中包含此项。


    # HWE 子集测试


    在缺乏祖先力量的情况下，频率随代际保持不变的变异被认为符合 HWE。这在以下假设下成立：随机交配、自然选择的本质、大群体规模、无基因流或迁移以及突变。在像
    CDCG 等多样化研究中，异质性或人群结构会违反在整个人群上进行 HWE 的假设。我们在已知的同质子群或人群内进行 HWE 分析。移除至少一个子集 p 值小于阈值的样本。我们利用预测的祖先作为子集，采用评估
    HWE 的方法。


    # CDCG WGS 数据


    美国人类基因组研究所测序的 CDCG 数据集有 60,545 个样本，包含许多常见疾病表型，包括心血管、免疫相关和神经系统疾病，以及全基因组测序（WGS）。测序在
    Illumina Seq (Hi6000) 上完成，平均深度为 30x。CDCG 样本在波士顿学院、哈佛学院、纽约基因组测序中心和圣路易斯华中心进行了测序，随后由
    Broad 研究所汇总。CDCG 的目标是确定遗传架构以理解复杂遗传疾病。包括 CDCG WGS 数据集在内的所有程序均符合相应的伦理和法律标准。CDCG
    仅包含样本，并根据各自的研究进行独立考虑。研究人员可以访问 CDCG，更多信息请见 project.org/CDCG。约 4% 的样本已注册在 ANVIL，样本注册正在进行中。


    CDCG 队列非常多样，自报告的人群最多为白人、非洲裔美国人、西班牙裔、亚洲、波多黎哥人和其他（如图1 所示）。自报告的种族和民族通常不是同质的。18% 的个体没有报告其种族和民族。这两个特征可以用于子集测试和
    QC 流程；相反，CDCG 数据集的预测同质性将是一个实用且合理的方法。对于我们的分析，我们预处理了 CDCG 数据集中的变异，去除了低质量变异，例如读取深度小于
    4、等位基因计数为 0 以及调用率小于 0.98。落在位数加六倍绝对偏差范围的离群值，未通过样本 QC。


    # 结果


    ## 使用 1000 Genomes 数据寻找同质祖先群组


    为了量化人群分化，我们处理了 1000 Genomes WGS 数据，专注于常染色体和 LD 输出（即成对阈值为 0.5 的变异）以计算 fst。我们识别了
    26 个人群，并在敏感性分析后选择了 0.08 的低 fst 截止值，以确保结果不受低质量影响（如图 2 所示）。该截止值识别了 11 个祖先分组：三个非洲裔（AFR）、两个东亚裔（EAS）、三个美洲裔（AMR）、一个南亚裔（SAS）和两个欧洲裔（EUR）。在
    AFR 子群中，我们将其分为西非（AFR）、尼日利亚东（ESN）、尼日利亚约鲁巴（YRI）、高高（GWD）和塞内尔曼德（MSL）；我们识别了 AFR2：利马秘鲁（PEL）、非洲裔美国人/加勒比（AF3）、美国西南部非洲裔（ASW）和巴哈多加勒比（ACB）。在
    EAS 子群中，我们将其分为 EAS1：日本（JPT）和越南（EAS2）；EAS2：中国南方（CHS）、北京中国（CHB）、台湾中国（HTB）、新庄中国（CDX）和胡志明市京（KHM）。在
    AMR 子群中，我们有利马秘鲁（PEL）、墨西哥裔等。

