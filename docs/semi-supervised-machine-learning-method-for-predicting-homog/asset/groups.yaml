    \ based on parameterized GMMs to group individuals into homogeneous subgroups,\
    \ initialized by hierarchical model-based clustering and estimated using expectation\
    \ maximization (EM) algorithm. We input the ancestry PCs as classified and then\
    \ selected the optimal model and the number of clusters based on Bayesian information\
    \ criterion (BIC). Finally, we utilized the predicted probabilities from the RF\
