    We developed a semi-supervised machine learning method for predicting homogeneous
    ancestry groups in diverse whole-genome sequencing studies to facilitate valid
    Hardy-Weinberg equilibrium (HWE) subset testing. Compared to previous approaches,
    our method provided substantially better HWE subset testing performance, which
    can benefit downstream genetic association analyses.


