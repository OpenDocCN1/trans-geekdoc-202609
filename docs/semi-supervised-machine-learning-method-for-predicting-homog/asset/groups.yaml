    \ ancestry PCs.\n\n![](img/7593f00bc7da5cac8436fdf8d5192a63_3_0.png)\n\n## Clustering\
    \ step\n\nSamples from diverse studies can be more heterogeneous than the reference\
    \ panel or cannot be classified as one of the reference's populations. If samples\
    \ do not belong to a specific population with high certainty, we classify them\
    \ as outliers, violating the homogeneity assumption of traditional HW. To address\
    \ this we construct homogeneous groups with other sampled samples using the clustering\
