    # Summary


    Large-scale, multi-ethnic whole-genome sequencing (WGS) studies, such as the National
    Human Genome Research Institute Sequencing Program''s Centers for Common Diseases
    (CCDG), play an important role in increasing genetic research. After performing
    analysis, Hardy-Weinberg equilibrium (HWE) is a crucial step in quality control
    to remove low quality variants and ensure downstream analysis. Diverse WGS studies
    contain ancestrally heterogeneous samples; however, commonly used HWE methods
    assume that the samples are homogeneous. Directly applying them may statistically
    invalid results. To account for this heterogeneity, HWE can be tested on subsets
    of samples, and results aggregated at each variant. To validate HWE subset testing,
    a semi-supervised learning approach predicts heterogeneity based on the genome.
    This provides a method for estimating HWE in the presence of population structure
    and ancestry in diverse WGS studies. In addition, HWE filtering provides reliable
    HWE results that directly benefit downstream analyses, including in WGS studies.
    We applied our method on the CCDG dataset, predicting negative genetic ancestry
    across 60,545 multi-ethnic WGS samples to assess HWE within group.


    # Introduction


    Large-scale, multi-ethnic whole-genome sequencing (WGS) studies play a crucial
    role in understanding the genetic underpinnings of common diseases for diverse
    populations. Examples of these studies include the National Heart, Lung, and Blood
    Institute''s Program for Precision Medicine (TPMed), the National Human Genome
    Research Institute Sequencing Program''s Centers for Common Diseases (CCDG, https://www.genome.gov/Funding-Projects/Sequencing-Program/Centers-Common-Diseases),
    and the All of Us Research, which have sequenced 190,000–140,000, and 245–250
    genomes, respectively. These diverse studies have provided unprecedented opportunities
    for identifying common and rare genetic variants associated with a wide range
    of diseases and traits.


    To ensure downstream genetic association analysis, it is vital to perform quality
    control (QC) to remove low quality variants. A key procedure is Hardy-Weinberg
