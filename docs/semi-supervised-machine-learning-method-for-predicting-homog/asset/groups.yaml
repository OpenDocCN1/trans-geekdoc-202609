    # 用于预测跨测序异质性的半监督机器学习，旨在评估多样化全基因组研究中的哈尔迪-维恩伯格平衡


    Derek Shyr,$1 Xihao Li,$2 Hefeng Zhou,$1 Eric Boerwinkelte,$3 Steve Buyesha,$4
    Mark Daly,$5,6 Richard A. Gibbs,$2 Ira Matish,$7 Hall Kara,$8,9 Catherine Neves,$10
    Nathan O. Stietzel,$11,12 Michael Zody,$10 Benjamin M. Neale,$5,6 and Xihong Lin,$13,14


    # 摘要（注：原文为Summary）


    大规模、多族裔全基因组测序（WGS）研究，例如美国国立人类基因组研究所测序计划的常见疾病中心（CCDG），在增加遗传研究方面发挥着重要作用。在分析之后，哈尔迪-维恩伯格平衡（HWE）是质量控制中的关键步骤，用于去除低质量变异并确保下游分析。多样化的
    WGS 研究包含具有祖先异质性的样本；然而，常用的 HWE 方法假设样本是同质的。直接应用这些方法可能会导致统计学上无效的结论。为了考虑到这种异质性，可以在样本子集上进行
    HWE 测试，并在每个变异处聚合结果。为了验证 HWE 子集测试，一种半监督学习方法根据基因组预测预测异质性。这为在多样化 WGS 研究中存在群体结构和祖先的情况下估计
    HWE 提供了一种方法。此外，HWE 过滤提供了可靠的 HWE 结果，直接有利于包括 WGS 研究在内的下游分析。我们将我们的方法应用于 CCDG 数据集，对
    60,545 个多族裔 WGS 样本预测负性遗传祖先，以评估组内 HWE。


