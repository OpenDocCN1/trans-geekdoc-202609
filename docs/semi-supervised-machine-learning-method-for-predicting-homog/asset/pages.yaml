    supervised test requires a high-quality reference dataset that is relatively diverse,
    but also contains population labels. We assumed our reference dataset, the 1000
    Genomes, satisfies these two requirements given that populationlevel information
    was collected across the globe. While we could have predicted ancestry based on
    each of the 26 populations, we ultimately decided to combine these labels in order
    to increase the size of each sample and statistical power; however, the combined
    subpopulations are still representable given the low Fst cutoff.


    # # Discussion


    We propose a semi-supervised machine learning approach to predict homogenous ancestry
    groups for assessing HWE in large, diverse WGS studies. Applying the method to
    handle the ancestry data could potentially yield results that negatively impact
    downstream analysis. To address this, HWE can be tested on subsets of samples
    that are ancestral homogeneous. Our method predicts homogenous ancestry based
    on the genotype, leading to substantially better HWE testing performance than
    self-reported race and ethnicities and HARE samples.


