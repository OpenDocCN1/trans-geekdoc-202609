    complex patterns in the data. Insufficient capacity can lead to underfitting,
    where the model fails to capture the underlying structure of the data. Conversely,
    excessive capacity can lead to overfitting, where the model learns the noise in
    the training data instead of the actual patterns. Adjusting the model''s capacity
    by varying the number of layers'
