    In this example, the initial DataFrame had one partition, which was then repartitioned
    into ten partitions. With only one partition, parallel processing is limited because
    Spark can only process one chunk of data at a time. If the cluster has more available
    cores, they may remain underutilized since only one task is executed. By increasing
    the number of partitions from one to ten using the repartition(10) function, the
    Tesla stock price data is redistributed across ten partitions, making each partition
    smaller. Spark can now execute up to ten tasks in parallel. This means more data
    is processed simultaneously, reducing the overall time required to complete the
    analysis.'
