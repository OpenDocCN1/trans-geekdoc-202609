- pgno: 727
  md: "how to define tasks, set task dependencies, and execute Python functions within\
    \ Airflow.\n\nThe DAG below defines default arguments, the DAG itself, Python\
    \ functions for tasks, and tasks and sets task dependencies. The DAG executes\
    \ two Python tasks: one to print the current date and time and another to print\
    \ a predefined message. When orchestrated by Airflow, these tasks ensure that\
    \ they execute in a defined sequence:\n\n```\n[In]: from airflow import DAG\n\n\
    [In]: from airflow.operators.python_operator import\n    PythonOperator\n\n[In]:\
    \ from datetime import datetime, timedelta\n\n# Define default arguments\n\n[In]:\
    \ default_args = {\n        'owner': 'airflow',\n        'depends_on_past': False,\n\
    \        'start_date': datetime(2023, 1, 1),\n        'email_on_failure': False,\n\
    \        'email_on_retry': False,\n        'retries': 1,\n        'retry_delay':\
    \ timedelta(minutes=5),\n    }\n\n# Define the DAG\n\n[In]: dag = DAG(\n     \
    \   'simple_mwaa_dag',\n        default_args=default_args,\n        description='A\
    \ simple DAG for MWAA',\n        schedule_interval=timedelta(days=1),\n    )\n\
    ```"
  merge: -1
