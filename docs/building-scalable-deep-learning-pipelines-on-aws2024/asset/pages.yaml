    # **Figure 6-6. Age Histogram**


    The histograms indicate that Glucose and BloodPressure appear to be somewhat normally
    distributed, while the other features are skewed to the right. A right-skewed
    distribution (also known as positively skewed) means that the majority of the
    data points are clustered toward the left side of the histogram, with a tail extending
    toward the right. In other words, the distribution is asymmetric, with a longer
    tail on the right side.


    Having skewed data can impact the performance and training dynamics of deep learning
    models in a number of ways:


    +   - Model Bias: Skewed data can introduce bias in the trained model, as the
    model may become more biased toward the majority class (in classification tasks)
    or toward the predominant patterns in the data. This can result in poorer generalization
    performance, especially for minority classes or less frequent patterns.'
  merge: -1
  img_proc: true
- pgno: 370
  md: '+   * Model Learning: Deep learning models trained on skewed data may prioritize
    learning features and patterns that are more prevalent in the majority class,
    potentially ignoring or under-representing minority classes or less common patterns.
    As a result, the model may struggle to generalize well to new, unseen data points,
    particularly those from under-represented classes.


    +   * Loss Function Imbalance: In classification tasks, imbalanced classes can
    lead to an imbalance in the loss function during training. This imbalance can
    cause the model to prioritize minimizing the loss for the majority class at the
    expense of the minority class, further exacerbat ing the bias in the trained model.


    In reality, addressing skewed data in deep learning often involves employing specialized
    sampling strategies, such as oversampling minority classes or undersampling majority
    classes. These strategies aim to balance the class distribution in the training
    data and mitigate the impact of skewness on model training.


    While addressing these issues falls beyond the scope of this book, when evaluating
    the performance of our deep learning model trained on this skewed data, we will
    use appropriate evaluation metrics that account for class imbalance, namely, precision,
    recall, and F1 score. These metrics provide a more comprehensive assessment of
    model performance across all classes, rather than relying solely on accuracy.'
  merge: -1
  img_proc: true
