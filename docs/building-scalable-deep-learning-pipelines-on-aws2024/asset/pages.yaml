    virtual servers, known as instances, to run your applications and workloads. Provisioning
    EC2 instances is the first step in setting up your deep learning environment,
    providing the computational power needed for training and inference tasks.


    In this section, we will explore both manual provisioning methods and automated
    provisioning using AWS CloudFormation.


    Here are the steps to provision an EC2 instance manually:


    +   Navigate to the EC2 Dashboard: Sign in to the AWS Management Console, click
    the “Services” dropdown menu, select “EC2,” and then click “EC2 Dashboard” from
    the EC2 service page.


    +   Launch Instance: Click the “Launch Instance” button to initiate the instance
    creation process.'
  merge: -1
