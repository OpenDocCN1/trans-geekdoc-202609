  md: 'Below is an explanation of this output:


    +   - [Epoch 87: early stopping] means that early stopping was activated because
    the validation metric did not improve for the specified patience period. The patience
    period is the number of epochs to wait for an improvement in the validation metric
    before stopping the training. For example, a patience of ten epochs means the
    training will stop if the validation metric does not improve for ten consecutive
    epochs.


    +   - [Restoring model weights from the end of the best epoch: 77] means that
    the best model (with the lowest validation loss or highest validation metric R-squared)
    was found at epoch 77. The model weights were restored from this epoch. Restoring
    weights means reverting the model to the state it was in at the specified epoch,
    ensuring that the model parameters used for further evaluation are those that
    yielded the best validation performance.


    +   - [Epochs completed: 87] means 87 epochs were completed, including the patience
    period (i.e., 10 patience period + 77) before early stopping was triggered.


