    A better solution is to use IAM roles, which AWS manages securely without needing
    to specify the credentials required to access S3 in your code. This approach is
    more secure and scalable, especially in production environments.


    An IAM role is an AWS identity that you can create and assign specific permissions
    to, allowing trusted entities (such as EC2 instances running Databricks) to assume
    the role and perform actions in AWS. When an IAM role is attached to the EC2 instances
    hosting your Databricks cluster,'
