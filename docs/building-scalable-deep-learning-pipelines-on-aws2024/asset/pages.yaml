- pgno: 97
  md: 'The python3 -m venv myenv command creates a virtual environment named “myenv.”
    A virtual environment is an isolated Python environment for your project. You
    can access this environment from any directory on your EC2 instance. Once activated,
    you’ll be able to use the Python interpreter and any installed packages from within
    the “myenv” virtual environment regardless of your current working directory.
    This flexibility allows you to work on your Python projects from any location
    on your EC2 instance, providing convenience and ease of use.


    Let’s check what’s inside the virtual environment, myenv:


    ```

    ```

    [In] : ls myenv

    [Out] : bin include lib lib64 pyvenv.cfg

    ```

    ```


    These are the standard directories and files created within a Python virtual.


    Let’s break down what each of these items is:


    +   - bin: This directory contains the executable files for the virtual environment.
    When you activate the virtual environment, these binaries are added to your PATH
    so that the Python interpreter, pip, and other tools within the virtual environment
    take precedence over the global ones.


    +   - include: This directory contains C header files that are needed for compiling
    certain Python packages that include C extensions.


    +   - lib: This directory contains the Python standard library and other shared
    libraries needed for running Python scripts within the virtual environment.


    Let’s look inside the directory:


    ```

    ```

    [In] : ls myenv/lib

    [Out] : python3.9

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 98
  md: '+   lib64: This directory is a symbolic link to the lib directory. This is
    done for compatibility with systems that use a lib64 directory for 64-bit libraries.


    +   pyvenv.cfg: This is a configuration file for the virtual environment. It stores
    settings and metadata related to the virtual environment.


    These directories and files collectively make up the structure of a Python virtual
    environment. When you activate the virtual environment, the bin directory is added
    to the beginning of your PATH, ensuring that the Python interpreter and other
    tools from the virtual environment take precedence.


    Step 3: Activate the virtual environment:


    ```

    [In]: source myenv/bin/activate

    ```


    This command activates the virtual environment. When activated, your shell prompt
    changes to indicate that you are now working within the “myenv” virtual environment.


    Step 4: Deactivate the virtual environment:


    ```

    [In]: deactivate

    ```


    You use the deactivate command when you want to exit or deactivate the currently
    activated virtual environment and return to the global Python environment. This
    is useful when you’ve finished working on a project or when you want to switch
    to a different virtual environment or the global Python environment.'
  merge: -1
