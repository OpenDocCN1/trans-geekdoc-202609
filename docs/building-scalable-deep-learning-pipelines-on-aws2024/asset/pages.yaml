- pgno: 596
  md: '# CHAPTER 9


    # Techniques for

    Improving Model

    Performance


    In the preceding chapters, we trained and evaluated models with default parameters
    and had no attempt to improve their performance. In this chapter, we examine various
    techniques to improve the performance of deep learning models. Achieving a model
    that generalizes well to unseen data is a critical goal in machine learning. Overfitting,
    a common issue, occurs when a model performs well on training data but poorly
    on validation or test datasets.


    We will explore techniques to address overfitting, including dropout, early stopping,
    and L1 and L2 regularization, which impose constraints on the model''s parameters
    to prevent overfitting. Dropout involves randomly “dropping out” (i.e., setting
    to zero) a subset of neurons during the training process, which helps prevent
    the network from becoming too reliant on specific neurons and encourages the network
    to generalize better. Early stopping involves monitoring the model''s performance
    on a validation set during training and stopping the training process once the
    performance stops improving.'
  merge: -1
  img_proc: true
- pgno: 597
  md: 'L1 and L2 regularization add a penalty term to the loss function used to train
    the model. L1 regularization (known in linear models as Lasso) adds the absolute
    value of the weights to the loss function, encouraging sparsity. In neural networks,
    this encourages sparsity in the weights, leading to fewer connections and potentially
    simpler models. L2 regularization (known in linear models as Ridge) adds the squared
    value of the weights to the loss function, encouraging smaller weights overall.
    In neural networks, L2 regularization helps prevent overfitting by penalizing
    large weights, although its effect on sparsity may be less pronounced compared
    with L1 regularization.


    Additionally, we will cover hyperparameter optimization, including fine-tuning
    the learning rate and network architecture, to identify the best-performing model
    on the validation set. This will be done both manually and automatically using
    Keras Tuner.


    The chapter begins with an examination of the baseline model, which will serve
    as a benchmark for comparing the results of regularization and hyperparameter
    fine-tuning. We will then delve into each technique in detail: dropout, early
    stopping, L1 and L2 regularization, learning rate adjustments, and modifying model
    capacity by varying the number of layers and neurons. Before combining all the
    code used throughout the chapter into a unified section, we will demonstrate how
    to use Keras Tuner for automatic hyperparameter optimization. The chapter concludes
    with a final section highlighting key takeaways.


