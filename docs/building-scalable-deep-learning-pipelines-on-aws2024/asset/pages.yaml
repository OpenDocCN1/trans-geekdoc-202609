    # Creating a Virtual Environment


    In addition to establishing a well-defined project structure, it’s advisable to
    create a virtual environment (e.g., myenv) for managing dependencies and ensuring
    reproducibility across various environments. This practice isolates the project’s
    dependencies from other Python projects on the system, thereby preventing conflicts
    and ensuring consistent execution regardless of the system’s configuration. Once
    your EC2 instance is up and running, follow the steps below to create, activate,
    and deactivate a virtual environment on an Ubuntu operating system:


    Step 1: Navigate to your home directory:


    ```

    [In]: cd /home/ubuntu

    ```


    Step 2: Create a virtual environment:


    ```

    [In]: python3 -m venv myenv

    ```


    This command assumes that Python 3 is installed on your system. Some systems might
    still default to Python 2.7, which is not compatible with the venv module. You
    can check your Python version by running


    ```

    [In]: python3 -version

    ```


    If Python 3 is not installed, you can install it, e.g., using the following commands
    on Ubuntu:


    ```

    [In]: sudo apt-get update

    [In]: sudo apt-get install python3

    ```


    On Amazon Linux:


    ```

    [In]: sudo yum update

    [In]: sudo yum install python3

    ```


    80'
  merge: -1
