- pgno: 612
  md: '![](img/1c89d4486f90c87568fa6a42d46ae02a_612_0.png)


    **Figure 9-1. Model Loss**


    The training loss plot shows a horizontal line beyond epoch 10 (denoted with the
    dashed vertical line), indicating that the training loss values do not decrease
    further and remain relatively constant. This typically signifies that the model
    has reached a plateau in its learning.


    This could mean the following:


    +   - The model has converged to a local minimum,

    meaning it has found a set of weights where further

    training does not significantly reduce the loss.

    - The learning rate may be too low to escape a local

    minimum, or it might be just right, indicating the

    model has adequately learned from the data.'
  merge: -1
  img_proc: true
- pgno: 613
  md: '+   - The model''s capacity to learn from the given data might be saturated,
    meaning it has learned as much as it can from the training data given its architecture
    and hyperparameters.


    In other words, the current performance level is likely the best the model can
    achieve with the existing architecture, training data, and hyperparameters. Alternatively,
    it may indicate overfitting, suggesting that the model is fitting too closely
    to the training data and may not generalize well to unseen data.


    In our case, since the model''s performance on the validation set is satisfactory,
    the plateau in the training loss may indicate that the model''s learning process
    has stabilized for the training data. This can be a sign of successful training
    since the loss values are low and the model performs well on validation data (as
    judged by low test loss and high R2 Score).


    In a production setting, the following actions are normally taken when the model
    is suspected to be overfitting:


    +   - Review the Plateau: Confirm if both training and validation losses have
    plateaued, which can be visualized by plotting both losses.


    +   - Adjust Hyperparameters: Experiment with different learning rates, batch
    sizes, or training durations.


    +   - Model Simplification: Consider simplifying the model architecture by reducing
    the number of layers or neurons if the model seems to overfit. Alternatively,
    consider deeper or more complex architectures if the model seems to underfit.


    +   - Data Augmentation: Use data augmentation techniques to artificially increase
    the size and variability of the training dataset.'
  merge: -1
  img_proc: true
