    section in the left navigation pane, click “Security Groups.”


    +   • Create a New Security Group: If you don’t have an existing security group
    suitable for your deep learning environment, you can create a new one by clicking
    the “Create Security Group” button.


    +   • Define Inbound Rules: In the newly created or selected security group, define
    inbound rules to control incoming traffic to your EC2 instance. For example, you
    might want to allow SSH access (port 22) for remote administration, access to
    Jupyter notebooks or JupyterLab (port 8888), and Apache Airflow’s web interface
    (default port 8080). You can also open additional ports as needed for communication
    with other services or applications.


    +   • Define Outbound Rules: Similarly, define outbound rules to control outgoing
