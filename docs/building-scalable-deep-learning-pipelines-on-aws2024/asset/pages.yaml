    through a main() function, orchestrating the execution of various tasks (preprocessing,
    model training, and model evaluation). In the current subsection, we''ll convert
    this main() function into an Apache Airflow DAG. When integrating code into a
    DAG, a separate main() function isn''t necessary to orchestrate tasks. Instead,
    tasks are explicitly defined within the Airflow DAG using operators such as PythonOperator'
