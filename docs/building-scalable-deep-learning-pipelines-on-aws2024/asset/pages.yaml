- pgno: 398
  md: 'Let''s explain these metrics one by one:


    Accuracy: Accuracy measures the proportion of correctly classified instances out
    of all instances in the test dataset. Mathematically, it is calculated as the
    ratio of the number of correctly predicted instances to the total number of instances.
    For example, an accuracy of 0.7607 means that approximately 76.07% of the instances
    in the test dataset were correctly classified by the model.


    Precision: Precision measures the proportion of true positive predictions out
    of all positive predictions made by the model. It focuses on the correctness of
    positive predictions and is calculated as the ratio of true positives to the sum
    of true positives and false positives. A precision score of 0.6585 indicates that
    approximately 65.85% of the instances predicted as positive by the model were
    actually positive.


    Recall: Recall, also known as sensitivity, measures the proportion of true positive
    predictions out of all actual positive instances in the test dataset. It focuses
    on capturing all positive instances and is calculated as the ratio of true positives
    to the sum of true positives and false negatives. A recall score of 0.6585 means
    that approximately 65.85% of all actual positive instances were correctly identified
    by the model.


    F1 Score: The F1 score is the harmonic or weighted mean of precision and recall,
    providing a balance between these two metrics. It takes into account both false
    positives and false negatives and is calculated as 2 * (precision * recall) /
    (precision + recall). An F1 score of 0.6585 indicates the overall effectiveness
    of the model in terms of both precision and recall, with higher scores indicating
    better performance.


    ROC-AUC Score: The ROC-AUC score measures the model''s ability to distinguish
    between positive and negative instances across different thresholds. A score of
    0.8135 indicates a high level of distinction between the classes, with the model
    performing well in distinguishing between them.'
