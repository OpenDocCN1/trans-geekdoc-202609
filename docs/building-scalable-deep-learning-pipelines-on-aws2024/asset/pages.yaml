- pgno: 17
  md: '# # CHAPTER 1


    # # Overview of Scalable Deep Learning Pipelines on AWS


    As data volumes surge and the demand for sophisticated AI applications increases,
    traditional on-premises infrastructure often falls short in providing the computational
    power and scalability required for modern deep learning workflows. Consequently,
    cloud-based deep learning is becoming increasingly vital.


    In this chapter, we introduce a deep learning pipeline that leverages these cloud-based
    solutions effectively by integrating key technologies and services. This pipeline,
    which will be detailed throughout the book, incorporates popular big data frameworks—PySpark,
    PyTorch, TensorFlow, and Apache Airflow (as a standalone deployment, Docker containerized
    setup, or managed service through Amazon Managed Workflows for Apache Airflow
    (MWAA))—with Amazon Web Services (AWS) cloud solutions, including Amazon Simple
    Storage Service (S3) and Amazon Elastic Compute Cloud (EC2). AWS, the leading
    cloud service provider with the largest market share, provides a robust infrastructure
    for efficiently executing these tasks.


    The first section of this chapter provides a detailed examination of the main
    components of this deep learning workflow on AWS. It covers the'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'entire pipeline, from data ingestion using S3 to scheduling model runs with
    Apache Airflow. Subsequent chapters will delve deeper into each stage of this
    pipeline, offering clear explanations, hands-on examples, and insights from real-world
    applications.


    # ## Components of a Deep Learning Workflow on AWS


    Figure 1-1 illustrates a comprehensive deep learning pipeline leveraging the power
    of Amazon Web Services (AWS) to handle large-scale data processing, model training,
    evaluation, and deployment tasks. At the heart of this pipeline lies Amazon S3,
    serving as the centralized data source for storing raw datasets, preprocessed
    data, and model artifacts. Data preprocessing is facilitated by PySpark, enabling
    distributed data processing on large datasets stored in S3. The pipeline utilizes
    both PyTorch and TensorFlow for building and training deep learning models, harnessing
    their flexibility and scalability. Amazon EC2 instances provide the necessary
    computational resources for model training, ensuring efficient utilization of
    cloud resources. Apache Airflow, as a standalone deployment, Docker containerized
    setup, or managed service through Amazon MWAA, orchestrates the deployment of
    trained models onto production environments, streamlining the deployment process
    and ensuring smooth execution of tasks.


    Let''s break down the figure in detail, starting with the data source.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '![](img/1c89d4486f90c87568fa6a42d46ae02a_19_0.png)


    *Figure 1-1. Components of a Deep Learning Workflow on AWS*


    # ## Data Source (S3)


    This represents the initial point where data is sourced from Amazon S3, which
    is a cloud-based storage service provided by AWS. S3 is commonly used for storing
    various types of data, including raw datasets, preprocessed data, and model checkpoints
    (such as weights). Data stored in S3 can be'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'accessed and utilized by other components in the pipeline including data preprocessing,
    model training, model evaluation, model deployment, and monitoring and maintenance.


    Source data in S3 could be copied to a local directory on EC2 and then fed into
    the deep learning model, or it can be copied as part of the pipeline, meaning
    that the retrieval and integration of data from S3 into various stages of the
    machine learning (ML) pipeline are automated for efficiency and scalability.


    Below are two examples (using AWS Command Line Interface (CLI) with subprocess
    and Boto3) of how a CSV file named “TLSA_stock.csv” (which will be used in Chapters
    4 and 5 to predict Tesla stock prices with PyTorch and TensorFlow, respectively)
    is copied from an S3 bucket named “instance1bucket” to a local directory on EC2
    named “/home/ubuntu/airflow/dags”.


    Using AWS CLI with subprocess:


    ```

    [In]: import subprocess

    ```


    ```

    [In]: try:

    subprocess.run([

    "aws" , "s3" , "cp" ,

    "s3://instance1bucket/TLSA_stock.csv" ,

    "/home/ubuntu/airflow/dags/"

    ] , check=True)

    print("Download successful.")

    except subprocess.CalledProcessError as e:

    print(f"Error occurred: {e}")

    ```


    ```

    [Out]: Download successful.

    ```


    This code utilizes the AWS Command Line Interface (CLI) through the subprocess
    module in Python to copy the file “TLSA_stock.csv” from the S3 bucket “instance1bucket”
    to the local directory'
  merge: -1
  img_proc: true
- pgno: 21
  md: "\"/home/ubuntu/airflow/dags/\" on EC2 instance. The subprocess.run() function\
    \ executes the AWS CLI command \"aws s3 cp\" with the specified source and destination\
    \ paths.\n\nThe try/except block is used to handle potential errors that might\
    \ occur during the execution of the command. If the command is successful, the\
    \ try block prints \"Download successful.\" If the command fails and raises a\
    \ subprocess.CalledProcessError, the except block catches the error and prints\
    \ a message indicating that an error occurred, along with the error details.\n\
    \nThe check=True parameter in subprocess.run() ensures that a CalledProcessError\
    \ is raised if the command returns a non-zero exit status, triggering the except\
    \ block. In this example, the output indicates that the file has been successfully\
    \ downloaded from the S3 bucket to the local directory.\n\nAfter running this\
