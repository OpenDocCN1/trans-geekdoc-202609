    with dates and times, and timedelta is particularly useful for adding or subtracting
    time intervals.

    * from airflow import DAG: This line imports the DAG class from the airflow module.
    DAG is a fundamental concept in Apache Airflow, representing a collection of tasks
    with dependencies.'
