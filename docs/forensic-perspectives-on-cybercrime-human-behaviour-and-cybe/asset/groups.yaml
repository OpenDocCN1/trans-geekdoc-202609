    等人（2015）观察到的培训练习中产生问题的心理因素包括注意力需求、认知过载、情绪唤醒、角色模糊和决策偏偏。Aoyama、Naruoka、Kojijima
    和 Watanabe（2015）结合**情境控制模型（COCOM）**对这些发现讨论了讨论，Hollnagel 和 Woods（2005）在该模型中对“控制”的概念进行了操作化处理。该模型描述了


    # 80 文化


    四种控制模式：战略、战术、机会和混乱。在**战略控制模式**下，多个目标正在被处理；有充足的时间来实现这些目标；有机会对结果进行详尽评估；行动是根据模型和预测选择的。**战术控制模式**具有某些相似之处，但限制更多。组织试图实现的目标更加有限；可用时间可能足够但不充裕；行动是根据计划和以往经验选择的。接下来，**机会控制模式**可能有一个或多个竞争性目标，只有足够的时间来实现这些目标，并对结果进行具体的评估。在这种控制模型中，行动是根据习惯和关联选择的。最后，在**混乱控制模式**下，组织试图实现一个目标，该目标可能与所需任务无关。实现该目标的时间不足，目标的评估非常原始，行动的选择是随机的。


    Aoyama、Naruoka、Koshijima 和 Watanabe（2015）将 COCOM 应用于网络处理事件中防御团队的管理，指出控制风格在事件期间会发生变化，通常是无意中，从战略转变为混乱。这是通过几种机制发生的。例如，在战略控制模式下，角色模糊的情况较少，但随着控制模式转向机会或混乱模式，模糊性会增加，个人不确定自己在应对该事件时的确切角色是什么。同样，在战略控制模式下，沟通很少，在战术控制模式下少见，在机会控制模式下频繁，而在混乱控制模式下则变得混乱。这种压力下行为和决策风格的转变与对认知的心理研究一致，特别是对启发式法和认知偏误的使用。正如第
    2 章所述，这指的是个体根据有限的信息和先前的假设做出快速决策。在此过程中，他们采用的是**认知吝啬者（cognitive miser）**方法，而不是**天真科学家（naive
    scientist）**方法，后者个体会做出更全面、更理性的决策（Fiske & Taylor, 2008）。个体用于确定哪种认知风格最适合现状的策略被称为**谦虚的战术家（modest
    tactician）**（Kruglan-1996）。有趣的是，钓鱼邮件和其他社交工程攻击等网络攻击旨在将目标从“天真科学家”风格的决策推向“认知吝啬者”风格（Montanez,
    Golob, & Xu, 2020），从而增加人为错误发生的概率（Bullee, Montoya, Junger, & Hartel, 2017）。可以观察到，微观个体层面的韧性失败与宏观组织层面的韧性失败之间存在相似之处。这表明，旨在减少对社交


    # 81 文化


    工程攻击敏感性的行为改变策略，可能在促进组织韧性方面大有益，因为在提高组织韧性方面有一个共同目标，即鼓励个体使用更全面的“天真科学家”方法进行决策。


    正如评论所言，并非大公司是网络犯罪的受害者。据报道，英国的初创公司已成为网络攻击的目标，通过建立几乎完全相同的网站并利用社交工程欺骗员工进行错误支付（Burgess,
    2015）。虽然小型初创公司可能没有大公司那么多资金，但社交工程攻击的实施相对容易，这意味着针对它们仍然是一种具有成本效益的策略。这与**日常活动理论（Cohen
    & Felson, 1979）**一致，即“有效保护者的缺失”增加了受害者成为目标的概率。这是因为在网络安全的背景下，初创公司不太可能拥有足够且经验丰富的
    IT 人员来提供保护。这在小型企业（SMEs）中也显而易见，尽管他们理解这一点的重要性，但缺乏时间、资金和资源（Fagule, 2023）。此外，据报道，不同文化下的小型企业网络安全方法有所不同。例如，据报道，小型企业网络安全的障碍可能包括组织因素、预算、管理支持和态度（Kabanda,
    Tanner, & Kent, 2018）。当然，正如第 1 章概述，非常大且资源丰富的公司并不能免受网络攻击，已有许多知名科技公司沦为 victim。


    有趣的是，组织和企业面临的一些问题在网络犯罪中存在相似之处。其中之一就是被称为 Zeus 的恶意软件（或其他名称），它是由一个代号 Slavic 的黑客创建的。Zeus
