    identified under each of these resilience factors. For example, security activities
    under prevention include threat analysis and forecast, with the appropriate resilience
    factor being to anticipate. Detection cyber security activities include monitoring
    and intrusion detection, which come under the resilience factor of monitoring.
    Finally, cyber resilience related to response includes activities such as incident
    reports and impact analysis, with regard to the two resilience factors of responding
    and learning. This point of learning from a cybersecurity incident is something
    that ethical social engineers stress is an extremely important post for organisations
    to engage with, although they also note that this does not always seem to happen
    (Radcliffe, 2023). By constructing mapping, Aoyama, Naruoka, Kojishima, Machii,
    and Seki (2015) also note that the human contribution of cyber resilience is limited,
    which they propose due to the difficulties in observing organisations'' responses
    to actual cyber-attacks. As they comment, training exercises are instead used
    to explore cyber resilience. However, despite this great focus on human factors,
    the classification they propose of cyber resilience is still primarily on technical
    and systems aspects.


    Overall, the literature on the conceptualisation of resilience could be split
    into research that considers resilience as an individual, psychological construct,
    and research that considers resilience in terms of the system in which humans
    operate, with a focus on technological elements. Not surprisingly, research that
    uses the former conceptualisation from social sciences disciplines, whereas the
    latter conceptualisations are more evident in computing and IT sources. The research
    specifically on cybersecurity resilience is a small subset of the wider research
    on organisational resilience and is based primarily on the technology and systems
    focussed conceptualisations of resilience. Aspects of how to increase resilience
    of both types will be discussed in further detail in Chapter 6.


