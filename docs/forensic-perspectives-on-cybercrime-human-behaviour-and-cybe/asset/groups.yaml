    in Public Health, 9, doi:10.3389/fbpub.2021.634099


    ## 社会工程学


    ## 背景


    网络安全背景下的社会工程学是指利用心理操纵来影响目标人物，使其执行导致系统泄露的行为。许多人可能熟悉的一个例子是网络钓鱼邮件，它利用一系列心理操纵来鼓励目标点击链接或打开附件，例如使用紧迫感、情感诉求或权威性。例子包括声称来自税务机关的邮件，声称收件者违反了某项税法，并且如果不立即采取行动，将面临惩罚性措施。这通常会要求目标点击链接或打开附件，这两者都包含会感染人员所用设备和系统的恶意软件。


    钓鱼攻击作为一种社会工程技术之所以流行，是因为它们对攻击者来说所需的精力或成本很低，而且只需要目标群体中的一人参与即可成功。换句话说，目标组织是有 10 名员工还是
    10 万名员工并不重要——只要有一个人点击了链接或文件，攻击者就有可能访问系统。防火墙和防病毒软件等技术手段可以阻止钓鱼攻击带来的部分风险，但不能阻止所有风险。此外，钓鱼只是社会工程学的一个例子，本章将讨论其他类型的攻击。


    人们认为，社会工程学是网络安全中单一最大的威胁（Salahdine & Kaab, 2019）。社会工程学不仅限于网络犯罪。例如，2016 年，美国几家快餐店的员工成为目标，他们由于相信建筑内有燃气泄漏，被诱骗打破了窗户（Almay）。


    关于社会工程学的已学术研究非常有限，关于社会工程工程师的生活和特征的描述也极少。一些知名的社会工程工程师撰写了一些书籍，讨论了他们的观点和经历过的经验。其中一个比较著名的例子是
    Chris Hadnagy（2011）著的《社会工程学：黑客艺术》（Social Engineering: The Art of Hacking）。该书于
    2018 年出版了修订版，名为《社会工程学：人类黑客科学》（Social Engineering: The Science of Human Hacking）（Hadnagy）。正如
    Hadnagy 在最新的文本中所解释的那样，从“艺术”到“科学”的这一转变，是对支撑社会工程学的心理过程日益增多的证据的认可。尽管如此，研究在现实社会工程学领域的应用仍然令人惊讶地匮乏。


    这是一种渗透测试的形式，是网络安全中的常见活动（Hujainah & Zheng, 2015）。“寻找敞门的艺术”仍然经常被认为仅是指技术测试手段，而非社会工程学。Hadnagy
    (2018) 指出，人们对社会工程学的意识日益增强，既将其视为来自恶意者的威胁，也视为渗透测试的重要组成部分。在 Hadnagy 和 Radcliffe 的情况下，社会工程师用于帮助组织保护自己所需的服务被称为“伦理社会工程学”。Radcliffe
    (2018) 认为社会工程攻击由以下步骤组成：


    - OSINT（开源情报）

    - 预设开发（Pretext development）

    - 攻击计划

    - 攻击启动

    - 报告


    OSINT，或称开源情报，是指为了实施攻击而从目标或其他相关人员收集的信息。正如其名称所示，这种情报收集通常通过公开渠道进行。这可以包括在在网上搜索目标，以了解他们的兴趣和爱好。社交媒体平台上这类信息的日益增加，是社会工程师承认在活动中极其有用的（Radcliffe,
    2023）。此外，OSINT 可以包括查看公司网站上显示的管理结构，以确定应该针对哪些个人。这可以是公司任何级别的任何人，从 CEO 到低薪员工，取决于社会工程师的计划。例如，清洁人员在表面上对组织的权力很小，但他们通常进入公司内的每个办公室。社会工程师还可能访问目标公司的物理场所，观察员工的服装类型、入口位置、是否有进入安全要求以及大厅的布置情况。根据业务性质，可能还可以进入场所并在其中移动。社会工程师评论了如何做到，特别是当他们配备了一些道具和合适的服装，如剪贴板或反光背心（Radcliffe,
    2023; Rhysder, 2023）。正如本章后面将详细讨论的，这反映了人类在导航社交世界时使用的认知偏差，并导致人们对所看到的社会工程师是否有权合法进入该建筑得出错误结论。


