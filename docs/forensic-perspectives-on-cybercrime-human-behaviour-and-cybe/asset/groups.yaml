    ![](img/51ad8f410e6da2f4318cde34a8193915_3_0.png)'
  - '[PAGE 4]


    # New Frontiers in Forensic Psychology


    # Series Editors


    Grahaml is Professor of Forensic Psychology at Durham University and was formerly
    Chief Psychologist at the Ministry of Justice, UK. He is the recipient of the
    British Psychological Society Awards for Distinguished Contributions to Professional
    Practice and forensic academic knowledge.


    Tammi Walker is Professor of Forensic Psychology and Principal of St Cuthbert’s
    Durham University. She is a Chartered Psychologist and Fellow of the British Psychological
    Society. Her research interests are gendered interventions for managing self-harm
    and suicide in prisons, mental health, physical health and addressing sexual violence
    in universities.


    New Frontiers in Forensic Psychology is a new series of forensic psychology books,
    which brings the most contemporary research in core and emerging topics in the
    field, providing a comprehensive review of new areas of investigation in forensic
    psychology, and new perspectives on existing topics of enquiry. The series includes
    original volumes where the authors are encouraged to explore uncharted territory,
    cross-disciplinary evaluations, and where possible break ground. The series is
    an essential resource for senior undergraduates, postgraduates, researchers and
    practitioners across forensic psychology, criminology, and social policy.


