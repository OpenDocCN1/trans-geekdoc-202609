    ## 系列前言


    我们非常幸地介绍 John McAlaney 教授、Terri Cole 博士和 Peter J. Hills 教授为我们的“法庭心理学新前沿”（New Frontiers
    in Forensic Psychology）系列编写的新书：《网络犯罪的法庭视角》。本书探讨了影响所有网络安全相关人员行为的心理因素，借鉴了法庭、社会和网络心理学等领域的研究文献。


    计算机和互联网已应用于人类社会的几乎每一个领域，涵盖家庭、学校、大学、工厂或企业。这些数字技术为个人和组织提供了许多便利；然而，它们也助了犯罪活动。网络犯罪发生在网上，接管电子通信或信息系统。本书从介绍快速演变的网络犯罪生态系统开始。接着讨论了社会工程流程，这些流程通过心理操纵人类使其犯下安全错误或泄露敏感信息。书中探讨了参与黑客攻击的个人的动机，并回顾了关于成为网络犯罪受害者风险因素的研究文献结果，以及韧性的概念。书中还考虑了国家和组织文化与网络攻击者可能如何利用这些因素的关系。在在线环境背景下评估了行为改变和预防策略。最后，考虑了眼球追踪和人工智能等新兴技术在网络安全方面的作用。


    《法庭心理学新前沿》系列汇了了领域核心及新兴主题的最前沿研究，为法庭心理学的新调查领域提供了全面回顾，并对现有研究课题提供了新视角。


    该系列包含原创卷著作，鼓励作者探索未知领域，进行跨学科评估，并在可能的情况下实现突破。


    该系列是法庭心理学、犯罪学和社会政策领域高年级本科、研究生、研究人员和从业人员不可或缺的资源。


    作者们将所有版税捐赠给了 STARS Dorset。


    Tammi Walker 教授和 Graham Tow 教授

    系列主编

    杜伦大学心理系


    ## 网络犯罪导论


    ### 背景


    我们生活在一个日益互联的世界里。支撑这些社会变化的数字技术为个人和组织提供了许多便利，然而，它们也助长了犯罪活动。公众对网络安全事件在现实世界产生的影响意识有所增强，这在很大归功于知名案例，例如
    WannaCry 勒索病毒，它曾对英国国家医疗服务体系（NHS）产生了巨大影响（BBC News, 2017）。2022 年，4 亿 Twitter 用户的数据被盗，其中包括与账户关联的电子邮件地址和电话号码，这些信息可能被使用或卖给网络犯罪分子以便利进一步的入侵（Newman,
    2023）。这类数据泄露还会导致人们的真实身份暴露，对于某些在在线上使用化名保护身份的个人来说，这可能是害害的。此外，网络攻击日益影响民众的日常生活，例如
    2021 年对殖民管道公司（Colonial Pipeline）的勒索软件攻击。这是一个从美国向该国东运输汽油和航空燃料的油管道系统。由于网络攻击，该公司停止了管道的所有运行，导致了燃料短缺、恐慌性抢购以及航班表的变更。这导致美国总统乔·拜登宣布进入紧急状态，殖民管道公司向攻击者支付了
    75 个比特币（价值 440 万美元）以重新获得对其系统的访问权限（Kerner, 2022）。


    心理因素是网络安全领域所有参与者认知和行为的基础。这包括导致攻击者选择目标的决策过程；以及随后对攻击中所用方法的选择。


    ## 2 网络犯罪导论


    这与法庭心理学中针对离线犯罪所确定的决策过程具有相似之处，例如入室窃窃决定进入哪栋房屋的流程（Nee & Meaghan, 2020）。这些决策可能受到攻击者对目标如何应对攻击的感知的影响。更广泛地说，网络安全事件改变了更广泛公众与在线技术互动的方式，例如他们对在线投票系统的信任或对在线购物的参与。


    在第一章中，我们概述了这一网络犯罪格局，重点关注来自法庭、网络、社会和其他心理学理论，这些理论可以帮助我们理解所有参与网络犯罪人员的行为和概念。技术的日常使用涉及反映社会过程的基本互动。例如，密码被描述为“信任的令牌”（Marshall
    & Stephens, 2008），个人通过提供身份证明来换取服务的访问权限。然而，这种互动容易受到人们在日常生活其他方面所做妥协的影响，以便他们能够以有限资源应对复杂的社会世界。例如，Tam、Glassman
    和 Vandenwaer (2010) 注意到便利与安全之间的权衡，人们倾向于选择比安全专家建议更简单的密码，因为对人们来说，选择和记住更复杂的密码往往具有挑战性。这与理性选择理论一致，个人根据对每个行动成本和收益的判断来决定采取什么行动（Ostrom,
    1998）。这种趋势是密码需要具有特定复杂度的原因，例如密码必须包含大写字母、数字、特殊字符等。虽然从网络安全的角度来看，设置此类要求可能并不直观，但它会给作为社会技术系统用户的人类带来问题。贯穿全书的一个反复出现的主题是：人类为了规避网络风险理想上应该的行为，与人类经常表现出的实际、不那么理想的网络安全行为之间的冲突。


    理解在线环境中人类行为的一个挑战在于，人们的行为是否从根本上是不同的，还是说在线技术仅仅提供了一种在其他情况下无法表达自己的机会。这涉及到 Suler (2004)
    提出的互联网是“改变”还是“增强”的问题。例如，某人在在线互动中表现出侵略性，如果他们进行类似的在线互动，是否也会这样做（即在线环境改变了那种行为），还是说在线环境只是放大了那人的行为侵略性（即它增强了现有的行为）？这反过来与“数字漂移”（digital
    drift）的概念有关。这指的是技术如何导致个体放宽对主流规范的遵循（Brewer, Fox, & Miller, 2019）。这可以在数字语境下通过提供亲和力（即财务和社会奖励）和归属感（即与他人联系）来实现。Goldsmith
    和 Brewer (2015) 认为，人们可以利用互联网表达在线身份，并逃避到一个社会规范较少从的虚拟世界。这种存在于主流社会之外并创造新身份的主题，显然在几位作者报道的对话中是显而易见的（Coleman,
    2014; Olson, 2012）。


    在线技术在我们许多人生活中的普及便利了网络分子的行动。在英国，大多数人（62%）拥有多达九个包含敏感数据的账户（包括社交媒体平台、在线银行、在线等），超过三分之一（38%）的人拥有十个或更多（CyberSafe,
    2022）。此外，个人通常可以访问其工作场所其他计算机系统的敏感数据。这就是为什么许多网络安全漏洞被发现是人为错误导致的原因之一，通常由于第 2 章讨论的类型的社会工程攻击（CyberSafe,
    2022）。理解人类因素的重要性被网络安全专家和从业人员认为是网络安全的关键方面（Kerney & Kruger, 2016）。然而，正如后续章节中所探讨的，通常存在一种将人类视为网络安全“薄弱环节”的认知。这是一种潜在的有害信念，因为它让网络安全的所有利益相关者——目标、攻击者和寻求保护系统的
    IT 专业人员——产生了一种预期，即用户是故障点。失败可能导致几个意外之外的后果，例如整个心理学研究记录的“习得性无助”（Abramson, Seligman,
    & Teasdale, 1978），即个人认为他们无所能能防止负面情况的发生。这反映了网络安全专业人员常用的信息：不是你是否会被黑，而是何时会被黑。这一信息背后的逻辑可能是为了鼓励潜在受害者更加警惕，并克服对网络风险的任何麻痹心理。


    成功的入侵使攻击者能够从事除窃取敏感数据之外的其他活动。这包括网站篡改、干扰计算机的合法使用以及传播恶意软件。


