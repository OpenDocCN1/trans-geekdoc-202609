    ## 文化 85


    基于对权威的某种表达的钓鱼邮件之所以成功，这通常是通过将钓鱼邮件伪装成来自某类政府机构（例如 FBI 或税务局）发送，并威胁如果收件者不点击链接或打开附件，将采取法律行动。同样，“仁爱”这一维度也可能影响基于慈善的诈骗行为成功的概率。有人认为，施瓦尔茨模型（Schwartz
    model）提供了一种灵活且详细的方法，承认了文化维度之间的重叠。尽管如此，该模型似乎并不是在网络安全研究文献中被广泛使用的模型。


    相反，在网络安全以及更广泛的商业领域最流行的文化模型是霍夫斯泰德模型（Hofstede’s model）（Hofstede, Hofstede, & Minkov,
    2010）。该模型提出了六个文化维度，如下：


    - 权力距离——权力拥有者与公众之间的差距。

    - 个人主义与集体主义——人们是强调个人的福祉与成功，还是强调朋友、家庭和更广泛社区的福祉与成功。

    - 男性化与女性化——传统性别角色在文化中存在的程度。

    - 不确定性规避——文化可以忍的风险程度，高不确定性规避的文化会试图避免任何可能存在风险的事。

    - 长期导向——文化对未来的规划程度。

    - 放纵与克制——文化对追求享乐的重视程度，这也可以根据一种文化的保守程度来衡量。


    与其他文化模型一样，目前对于霍夫斯泰德模型所确定的维度如何应用于网络安全信念和行为的研究仍然缺乏。尽管如此，可以推测其中可能产生的一些影响。例如，处于不确定性规避文化中的成员被认为不太可能打开未知发送者邮件的风险。同样，一个具有高度长期导向文化的组织预计会投入更多的时间资源来识别威胁，并确保其网络安全实践安全且可持续。然而，在假设文化维度对行为的因果关系时存在风险的。之前提到的影响是复杂的，而且对许多人来说，不仅限于单一文化的影响。事实上，霍夫斯泰德模型的流行可能部分源于其相对简单性，以及存在：


    ## 86 文化


    提供国家间比较及其在这些维度上得分的在线服务（例如 https://www.hofstede-insights.com/product/compare-countries/）。该模型在几个点上受到了批评，例如基于某些国家内部的样本（如
    IBM 员工），而不能代表这些国家的一般人口（Shaiq, Khalid, Akram, & Ali, 2011）。Vignoles 等人（2016）也评论说，该模型没有捕捉文化内部的差异，尽管这种批评也适用于其他文化模型。


    总的来说，组织文化和国家文化都是网络安全行为的重要影响因素——不仅是网络攻击预期目标的行为，也包括其背后的人。理论上，组织文化是组织可以施加影响以改进网络安全实践的东西。政府对一个国家的文化的影响可能较小；但仍有可能引入文化变革来减少网络攻击造成的伤害。在组织和国家背景下，挑战在于文化的复杂性，以及试图改变这些文化时产生意外后果的风险。这些预防和行为的问题将在下一章进行更深入的讨论。


