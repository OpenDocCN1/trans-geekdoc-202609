    ## 网络犯罪简介 7


    其手段与传统金融系统中看到的相似，例如套利，即某人利用不同市场之间的价格差异来获利（Kabasinskas & Sutiene, 2021）。


    然而，加密货币并不一定能提供某些加密货币用户希望的安全性和隐私水平。Greenberg 在《黑暗中的追踪者：对加密货币犯罪头目的全球追捕》（*Tracers
    in the Dark: The Global Hunt for the Crime Lords of Cryptocurrency*）中指出关于加密货币的一些误解。尽管该技术的可能会认为它是匿名的，但区块链的本质是每笔交易都会被记录。虽然加密货币背后者的线下身份可能并非显而易见，但有许多许多执法部门成功识别出使用加密货币进行犯罪的个人。此外，还发生过加密货币交易所被黑，或者加密货币交易所背后的人员转移资金的情况。比特客（Mt.
    Gox）曾处理过全球超过 70% 的比特币交易。它在 2014 年突然停止交易，导致令牌所有者无法获得价值数亿美元的加密货币，这相当于当时存在的所有比特币的
    7%。比特客的首席执行官当时 30 岁的 Karpeles 被日本警察逮捕并指控欺诈和挪用资金。他后承认自己对用户的信任造成了巨大的伤害。在《失踪的加密女王：十亿美元加密货币与逃脱的女人》（*The
    Missing Cryptoqueen: The Billion Dollar Cryptocurrency and the Woman Who Got Away
    With It*）中，Jamie Bartlett 描述了一个名为 Ruja Ignatova 的加密货币诈骗案（Bartlett, 2022），她是该计划的创始人。这种加密货币是旧骗局——金字塔骗的新形式。与其他加密货币不同，OneCoin
    使用的是中心化模型而非去中心化模型。该公司利用多级营销策略，通过承诺高回报并向招募他人加入计划的人提供佣金来吸引投资者。这些案例展示了网络犯罪分子寻找利用新技术的巧妙手段。


    ## 网络犯罪的类型


    有许多类型的网络犯罪，以及许多不同的犯罪行为。英国刑事检察局（Crown Prosecution Service）将网络犯罪分为网络依赖型犯罪和网络赋能型犯罪（Crown
    Prosecution Service, 2023）。网络依赖型犯罪是指那些通过使用信息技术（IT）实施的犯罪，包括为了获取利益而创建和传播恶意软件，以及为了窃取、破坏或扭曲网络而进行的黑客。


    另一方面，网络赋能型犯罪是通过 IT 增加规模的传统犯罪，包括欺诈行为、非法物品的在线市场以及在线性掠猎者对儿童的诱导。网络依赖型犯罪与网络赋能型犯罪之间的界限有助于理解网络犯罪，但可能会变得模糊。这反映了互联网技术在日常生活中日益普遍的渗透。在线和线下活动之间的界限不再像以前那样清晰。


    与与增加，技术设备可以通过互联网或其他手段建立远程连接，这为网络犯罪分子创造了新的机会，超越了盗取银行账户详情等刻板行为。社会技术系统的互联本质意味着网络攻击可能产生多重影响。例如，黑客能够破解汽车（Kelion,
    2016），并通过破解出租车系统导致莫斯科交通堵塞（Holroyd, 2022），而在 2016 年，在网络犯罪分子攻击一家非洲手机公司后，利利亚的互联网崩溃了（Casciani,
    2017）。互联网还可以用于购买毒品等非法材料。这凸显了在线犯罪与线下犯罪发生时可能存在的不同态度，以及两者之间可能重叠之处。例如，BBC 的一项调查报告了在线（包括通过暗网）购买毒品的易易性。报告还提到了邮政工作人员的观点，认为试图阻止这种做法很大程度上是徒劳的（Connolly
    & Doble, 2017）。此类示例虽然有趣，但挑战了我们作为一个社会，如何决定哪些形式的网络犯罪是我们可以应对的，并优先考虑哪些预防和缓解策略，同时考虑到支持这些策略的资源是有限的。


    在下文中，我们将探讨网络犯罪的一些大类，但需要说明的是，其中许多活动之间存在重叠。


    ## 黑客攻击（Hacking）


    黑客攻击可能是与网络犯罪最相关的单一活动。“Hacking”一词让人联想到好莱坞式的形象：一个穿着黑色连帽衫的人坐在昏暗房间的电脑显示器前，屏幕上滚动着编程代码。这是一种被多种方式定义的现象，其负面内涵将黑客行为与犯罪活动联系在一起。例如，黑客攻击被定义为带有犯罪意图的对系统的未经访问（Grabovsky,
    2016）。反之，“黑客”一词已演变为涵盖比攻击行为本身更多的含义。Maimon 和 Loubacker (2019) 认为，黑客攻击不同于网络入侵，后者被定义为跨越在线环境的不可见边界（Walls,
    2001），而黑客攻击涵盖了更广泛的行为和对黑客文化的参与。这种黑客文化在在线和线下空间都显而易见，例如每年夏天在拉斯维加斯举行的 DEF CON 活动（defcon.org）。该活动经常吸引超过
    20,000 名参与者（DEF CON, 2023），并提供丰富多样的讲座、演示、讨论和社交活动计划。世界各地发生的类似活动凸显了黑客社区已超越了人们对黑客攻击是由不满分子者坐在黑房间里进行的小众活动的流行观念。事实上，黑客文化中进行的许多活动可以被认为对社会有直接贡献。DEF
    CON 年度活动上的一项常规活动是公开演示设备是如何——或至少是希望如何——被破解的，包括安全系统和电子投票机。在拉斯维加斯的一个大厅里展示漏洞可能看起来不像是一项负责任的活动，但这些活动为公司确保产品尽可能安全提供了动力。同样，还有人作为道德黑客工作。这些人受雇于组织进行渗透测试，通过尝试入侵来测试组织的网络安全。关于这种类型黑客攻击的进一步将在第三节给出。


    观察发现，成功的黑客攻击需要一系列连续活动（Steinetz, 2014），包括对目标的技术和社交特征收集初步情报、利用发现的漏洞、提升权限（增加数据访问权限），然后试图掩盖攻击痕迹。Maimon
    和 Loubacker (2019) 认为，黑客攻击是大多数网络依赖型犯罪的起点。然而，黑客攻击本身并不一定需要大量的技能或技术知识。例如，“脚本小子”（script
    kiddies）指的是使用软件工具执行黑客行为的人，他们技术能力有限，但仍会导致广泛的干扰。在一个案例中，34 个人（许多是青少年）来自 13 个国家被捕，作为调查
    Netproof DDoS 攻击工具行动的一部分。该在线服务允许用户部署 DDoS 软件并发动网络攻击（Khandwal, 2016）。如上所述，DDoS
    攻击（分布式拒绝服务）通过向网站或在线服务发送大量请求来使其无法运行——类似于在浏览器页面上反复点击刷新按钮，但每秒有数百万次请求。这通常由本章前面讨论过的机器人协助完成。这种黑客攻击行为是有效的，因为它是一个如此粗糙的工具。尽管如此，它仍然是一种有效的工具，特别是当目标是给组织造成干扰时。这证明了本书的另一个核心主题——黑客攻击不仅限于获取财务利益的动机。正如第三节所述的，参与黑客攻击有多种动机，包括主要目标是意识形态性质的黑客主义（hacktivism）。


