    ## 104 行为改变与预防


    责任推卸（并非他们的错；是由于他们无法控制的因素造成的）；伤害否认（将偏离行为视为无受害者的）；受害者否认（通过认为受害者理应遭受此类伤害，从而剥夺受害者的“受害者”身份）；谴责谴责者（试图将注意力从犯罪者的行为转移到谴责者的虚伪上）；最后是诉诸更高忠忠诚（优先考虑家庭需求并遵循法律）。黑客和网络犯罪分子确实有很多利用这些技术的案例。在黑客攻击案例中，受害者否认是显而易见的，攻击者在讨论其目标时，认为目标由于网络安全松散而对攻击负责任，这在黑客小组内部的在线对话中可见（G.
    Coleman, 2014）。如前所述，已观察到网络犯罪分子使用去人性化和魔化受害者的语言（M. Rogers, 2010）。同样，谴责谴责者在黑客因犯罪被起诉的情况下也被观察到，他们声称惩罚与造成的损害不成比例，并意图对他们所针对的组织进行报复（Hutchings,
    2013; Knappenberger, 2012）。伤害否认在黑客中也已有记录，Hutchings (2013) 报告说黑客经常否认他们的计算机入侵造成了任何伤害；作为一种中化技术，诉诸更高忠诚是显而易见的，黑客认为他们的行为是为了更大的利益（Chua
    & Holt, 2016）。这类例子包括活动分子“匿名”（Anonymous）在2011年革命期间突尼斯政府限制网络访问后，向突尼斯公民提供如何访问互联网的建议（DeTardo-Bora,
    & Gardner, 2019; Olson, 2012）。


    正如 Bossler (2021) 指出的，文献中进一步提出了其他中化技术，例如 Sykes 和 Matza (1975) 最初识别的五种技术。这些包括必要性防御（因为该行为在特定情况下是必要的），由
    Minor (1981) 确认为；账本比喻（人们认为自己一一生中所做的善多于恶），由 Klockars (1975) 确认为；常态与权利（个人从事类似的行为，并且他们应该偶尔获得奖励），由
    J. W. Coleman (1985) 提出。最后，Cromwell 和 Thurman (2003) 建议通过比较来正当化（犯罪者称这些技术可以适用于网络事件）。黑客活动分子（Hackivists）经常承认他们的行为是非法的，但将其框架化为解决组织和政府不道德道德行为的必要手段（Olson,
    2012）。同样，观察到黑客会辩称，与严重的离线犯罪相比，他们的犯罪通过比较通常是相对轻微的（Olson, 2012）。这些中化技术已针对几种网络偏离行为接受了研究，包括数字盗版（Popham
    & Volpe, 2018）、性信息短信（Renfrow & Rollo, 2014）和黑客攻击（Morris, 2020）。Brewer、Fox 和 Miller
    (2020) 注意到，网络犯罪中使用中化技术的证据很高，这强调了在该领域进行更多研究的必要性。更具体地观察黑客攻击，Hutchings (2013) 报告说与其他类型的网络犯罪（如数字盗版）相比，黑客并不否认其行为的责任，而是认为这与某些工作一致，这些工作表明获得声望和优越知识是参与黑客社区的重要动力（Mclaney
    et al., 2020; Seebruck, 2015）。Bossler 探讨了中化技术在大学生实施网络攻击意愿中的作用，发现在同伴影响、计算机技能、在线时长和性别之后，这些技术是显著的预测因素。在这些结果中，特定的中化技术与特定类型的网络犯罪之间存在某些关系，或缺乏关系。例如，伤害否认与黑入政府服务的意愿之间没有显著相关，因为研究给出的示例中的政府被定性为造成伤害的方式。正如
    Bossler (2021) 观察到的，某些作为活动主义的黑客行为被归因于故意造成伤害的这种。


    对中化技术的研究已用作严厉刑事司法创新的基础，即情境预防（Cornish, 2003）。这种方法涉及多种策略，包括挑战犯罪者用来正当化其行为的借口。这旨在促使犯罪者在处于犯罪边缘时考虑他们的行为。Bossler
    (2021) 建议，通过教育黑客了解遭受损害可能给个人和组织带来的财务和情感后果可以进一步实现这一点。这与为网络犯罪潜在受害者建议的预防方法相似，对于那些可能成为网络钓鱼邮件或社会工程攻击目标的人——最终目标是鼓励个人更深层地思考他们的行为（如第5章所讨论的，即作为一个“天真的科学家”而非“认知吝啬者”）。此外，另一种方法是让个人明确意识到他们可能如何使用中化技术来为自己的行为自我正当化。在赋能个人挑战虚假新闻方面，这项工作具有一些先例。这涉及激发个体的认知认知（元认知），指的是个体对自身知识的认知（Barzili
    & Zohar, 2012; Mason, Junetty, & Tornatora, 2014）。换句话说，如果黑客能被促使考虑他们是否相信自己用来正当化行为而使用的中化技术，那么他们可能会意识到这些正当化理由是错误的。


    ## 105 行为改变与预防


    作为情境预防（Cornish, 2003），中化技术的研究已用作严厉刑事司法创新的基础。这种方法涉及多种策略，包括挑战犯罪者用来正当化其行为的借口。这旨在促使犯罪者在处于犯罪边缘时考虑他们的行为。Bossler
    (2021) 建议，通过教育黑客了解遭受损害可能给个人和组织带来的财务和情感后果可以进一步实现这一点。这与为网络犯罪潜在受害者建议的预防方法相似，对于那些可能成为网络钓鱼邮件或社会工程攻击目标的人——最终目标是鼓励个人更深层地思考他们的行为（如第5章所讨论的，即作为一个“天真的科学家”而非“认知吝啬者”）。此外，另一种方法是让个人明确意识到他们可能如何使用中化技术来为自己的行为自我正当化。在赋能个人挑战虚假新闻方面，这项工作具有一些先例。这涉及激发个体的认知认知（元认知），指的是个体对自身知识的认知（Barzili
    & Zohar, 2012; Mason, Junetty, & Tornatora, 2014）。换句话说，如果黑客能被促使考虑他们是否相信自己用来正当化行为而使用的中化技术，那么他们可能会意识到这些正当化理由是错误的。


    ## 105 行为改变与预防


    利用此类方法来应对黑客。如前所述，黑客社区对改变其行为具有很强的抵抗力。Bossler (2021) 承认，黑客活动分子特别渴望实现他们的目标，并意识地希望伤害目标。广泛地说，Chung、Chen
    和 Chou (2006) 为打击犯罪提出了四项建议：

    - 定期更新现有法律

    - 强化专业工作组

    - 利用民用资源

    - 促进网络研究


    第一点确实需要改变。正如其他地方评论的，网络行为法律往往过时且不符合目的（Halder, 2022）。然而，也承认在技术快速演进时面临着挑战。这表明需要更灵活的法律。在写作期间，联合国正在成立特别委员会以制定一项反对利用信息通信技术的国际公约（联合国毒品和犯罪问题办公室,
    2023）。鉴于网络犯罪的独特特征，正如 An 和 Kim (2018) 所建议的，专业工作组也将是有益的。网络执法系统的复杂性可能对不熟悉网络犯罪的执法人员来说构成障碍。为了支持这一点，An
    和 Kim (2018) 认为，更大的分类和定义将使政府能够改进国防和安全。政府、执法机构、安全供应商和软件供应商之间的密切合作也将有助于预防和干预策略（Chung
    et al., 2006）。人们注意到这种类型的合作对于处理风险情况下的网络威胁可能特别有益（Majzrak & Janveaa, 2010）。人们注意到网络空间出现了一个“新型”私人安全行业和私人执法的增长（Button,
    2020）。许多大型公司以提供网络安全服务而闻名，


