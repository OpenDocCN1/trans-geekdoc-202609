    & Postmanes, 2005）。然而，在对参与基于小组的网络犯罪活动做出假设时应保持谨慎。例如，哈萨克斯坦的警察逮捕了一个团伙，发现他们正强迫 IT
    专家运行加密货币交易所（Tassev, 2022）。


    类别模型（Doise, 1978）认为，将群体识别为此类（类别）可以增强群体归属感。我们可能有不同的角色，如“朋友”、“父母”、“员工”、“运动团队成员”，在每个角色中我们都可能以不同程度扮演许多部分。然而，在每个角色中，我们会有不同的身份。根据社会认同理论，群体动态模型表明人们可能会从他们所属的群体中获得自尊（Marques,
    Abrams, & Serif, 2001）。这在街头帮派中得到了很好的证明，帮派可能充当替代家庭，声称从内部（内群体）提供同伴认可、安全、尊重和支持，并引发他人（外群体）的恐惧——尽管预期的保护并未实现（Level,
    2012）。有趣的是，个人为了被接受并加入帮派（成为内群体的一员）而被要求完成的“入会”挑战——例如某些体罚惩（Murer & Schwarze, 2022）——这是一种极端但相似的想法，与为了让个人进入受限网站和论坛（例如在暗网上）而使用的“挑战”非常相似——例如知道如何发布一个格式正确的
    Triforce 标志，这是一种与《塞尔达传说》视频游戏相关的图像（Bernstein et al., 2011）。然而，参与网络小组及其相关的犯罪活动可能并非自愿。正如我们所讨论的，如果参与黑客活动的个人沉浸在黑客论坛和交流的社交世界中，那么社会认同感可能是自尊的重要来源。在试图防止人们参与犯罪活动时，应该考虑这一点。成为该群体的一员对该个人可能非常重要，消除这种支持来源可能会产生意外的后果。观察发现，在表面网黑客论坛上进行的大多数讨论都强调论坛成员——尤其是较年轻和经验较少的黑客——不应参与非法活动（McAlaney
