    Halder (2022) 所言，这些问题的法律问题可能是复杂的。


    在对行为改变运动的审查中，Bada 等人 (2015) 确定了网络安全行为运动失败的几个原因：


    - 解决方案与业务规则不匹配。

    - 没有衡量进展或价值。

    - 对人们及其动机做出了错误的假设。

    - 设置了不切实际的预期。

    - 未部署正确的技能。

    - 意识仅仅是背景噪音。


    这些因素与行为改变理论一致，特别是计划行为理论 (Ajzen, 1991) 和 COM-B (Michie et al., 2011) 中描述的能力、自我效能、机会和动机的概念。不切实际的预期和技能未部署的问题与第
    5 章讨论的组织文化因素有关。


