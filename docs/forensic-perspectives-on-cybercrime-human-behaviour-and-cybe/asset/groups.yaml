    ## 66 受害者学与心理韧性


    研究文献中存在多种定义方式，但大多数定义对韧性的概念化观点一致，即在面对逆境时的积极适应（Sutcliffe & Vogus, 2003）。韧性在个人层面被视为一种稳定的性格特质、一种状态性的可发展能力或一个过程（Kossek
    & Perrignano, 2016）。值得注意的是，后者的这些概念化表明韧性是可塑的，而非固定的特质，这与第 6 章将讨论的行为改变主题相吻合。这些不同的概念反映在用于衡量韧性的量表的多样性上（Hartmann,
    Weiss, Newman, & Hoeg, 2010）。同样，Fisher、Ragsdale 和 Fisher (2019) 认为，韧性机制最好被理解为个体在面对逆境时所采取的经历、反应和行为，例如应对策略或情绪反应。为了支持这些观点，研究文献中确定了几个可能与韧性相关的个体因素。这些包括责任心和自我效能感（Lyons,
    Schweizer, & Ng, 2015）、商业信心（Yang & Danes, 2014）、控制源（Stevenson, Phillips, & Anderson,
    2011）、反思能力（Kinman & Grant, 2010）、情绪智能（Förster & Duche, 2017）以及工作相关属性（Badran &
    Youssef-Morgan, 2015）。在军事背景下，Lee、Sudom 和 Zamorski (2013) 注意到，加拿大军事人员的心理韧性与潜在保护因素之间似乎存在复杂的关系，尽管责任心、情绪稳定性和积极社交互动似乎是重要的。


    团队韧性将韧性视为一种集体现象，在概念上与个人韧性有所区别（Carmeli, Friedman, & Tishler, 2013）。由于它似乎与组织文化和组织级行为改变策略特别相关，尽管与个人韧性相比，团队韧性的概念发展尚不完善（Bowers,
    Kreutzer, Cannon-Bowers, & Lamb, 2017）。Hartmann 等人 (2020) 认为，团队韧性的预测因子可以根据情绪、人际过程和小组结构方面进行分类。他们还指出，一个由具有个人韧性的团队成员组成的小并不一定会导致团队韧性，这凸显了组织文化以及组织成员之间如何沟通和互动的重要性。虽然缺乏专门针对团队韧性的研究，但对其他集体层面构念（如集体效能感或集体创造力）的研究已经证明了显式考虑团队的情境、关系和互动方面的重要性（Bandura,
    2000）。


    进一步有观点认为，应该在韧性被激发的特定背景下考虑韧性。这可能包括由高强度环境的孤立引起（例如网络攻击等危机事件），也可能由高频率、长持续的环境组成，例如持续的工作压力（Hartmann
    et al., 2020）。这与文献中的研究一致，该研究表明韧性的体验特定于其发生的领域和语境，例如在职场中或人的个人生活中（Todt, Weiss, &
    Hoegl, 2018）。为了梳理这些多样化的、跨学科的研究文献，Linnennecke 根据文献的文献学制图识别了组织韧性的五个研究方向（Linnencke,
    2017）：


    - 与危机管理相关的组织韧性，例如 Williams, Gruber, Stutcliffe, Shepherd, and Zhao (2017)

    - 员工韧性的职业特定方面，例如 Kosek and Perrigo (2016)

    - 员工韧性与韧性建设计划的不同概念化，例如 Britt, Shen, Sinclair, Grossman, and Klierger (2016)

    - 韧性作为一种能力的开发，例如 Kuntz, Malinen (2017)

    - 韧性计划的有效性，例如 Vanhoe, Harms (2016)


    这五个分支展示了韧性研究中的不同侧重点。首先，韧性在组织韧性与团队韧性之间存在差异；其次，韧性作为固定性格特质与作为可塑能力之间存在差异；最后，韧性作为对危机的反应与作为长期策略之间存在差异。这些差异导致了韧性在这一领域面临的挑战。Hartmann
    等人 (2020) 指出，在如何应用韧性理论方面缺乏清晰的理解，正如第 6 章将讨论的，这与行为改变具有相似之处。此外，在衡量组织韧性的工具的可靠性和效度方面也存在问题。


    专门针对网络背景的韧性研究相对较少，其内容集中在网络安全领域，只有少数作者承担了大部分实质性工作。韧性在文献中被讨论为一种技术过程。例如，Petrenko
    (2019) 提出了以下定义：“网络韧性是系统根据特定算法运行的能力，以实现运营目的”。Petrenko (2019) 指出，网络系统的韧性可以从主动韧性和被动韧性的方面进一步考虑。主动韧性由可靠性、响应恢复和生存能力等因素组成。它存在于复杂的系统中，这些行为基于决策。另一方面，被动韧性由强度、平衡和稳态等因素组成。它存在于简单的系统中，决策越少，社交工程师和攻击者操纵决策过程的机会越小。然而，企业必须经常改变做法以适应社会和财务需求以及技术变化。因此，组织寻求抵抗网络攻击，这是一个需要持续审查和修订的要求。


    Wood 和 Hollnagel (2006) 提出了一种基于工程的韧性观点，该观点适用于网络背景，并基于用户参与的系统的内在四个因素：


    - 1. 学习能力：从过去的事件中学习（事实性的），理解发生了什么以及为什么；

    - 2. 响应能力：以有效、灵活的方式对行动（常规和不规则情况）做出反应；

    - 3. 监测能力：监测短期发展和威胁（关键性的），并修订模型；

    - 4. 预测能力：预测长期的威胁和机会（潜性的）。


    这种概念化通过承认从过去事件中学习的重要性承认了韧性中的人为因素，但尽管如此，该概念化主要关注技术和系统问题。这与军事背景下关于网络安全韧性的少数研究之一一致，即北约发起的一项关于北极网络安全韧性的研究（Tross,
    Hossain, & Linkov, 2020）。在该研究中，人类因素的作用再次得到承认，但并未被视为可以发展的资源。这与人们观察到的结果一致，网络安全研究通常将人类视为问题所在，而不是解决网络安全挑战的潜在解决方案（Zimmermann
    & Renaud, 2019）。Aoyama, Naruoka, Koshijima, Machii, and Seki (2015a)


