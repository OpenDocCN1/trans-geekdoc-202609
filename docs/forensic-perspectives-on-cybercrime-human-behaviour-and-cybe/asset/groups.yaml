    ## 76 文化


    一种倾向于将网络安全方案的细节信任并推给 IT 人员和外部提供商的趋势，导致领导团队对网络安全缺乏详细了解。这种态度导致网络安全专业人员认为，组织往往没有充分认识到网络安全所带来的威胁。网络安全专家指出，他们经常告诉客户黑客已经侵入了他们的系统（Frenkel,
    2016），以促使组织对系统中采取网络安全措施。这呼应了第 1 章中提到的格言，即“不是是否会被黑客攻击，而是何时会被黑客攻击”。


    对许多企业而言，首要任务是其竞争对手、投资者、客户、监管机构以及自身员工的看法。这也是为什么网络攻击造成的声誉损害是许多组织主要关注的原因之一。在个人层面，组织会进行印象管理，即组织试图塑造其在内外部的形象。这包括他们希望如何被自己的员工看待。Jones
    & Pittman (1982) 识别了印象管理的五种策略：讨好（为了被视为亲和）、自我促销（为了被视为有能力）、榜样（如留加班被视为奉业）、恐吓（为了被视为威胁性）和假设（为了被视为需要）。组织使用的策略取决于它们想要投射的印象，例如，慈善机构不太可能想使用恐吓这种印象管理技术，但可能会使用假设，作为其向受助人士征求捐款的一部分。因为社会工程师可能会选择将攻击框架化为求助，这与慈善机构希望呈现的形象是一致的。在对研究文献的回顾中，Bolino、Long
    和 Turnley (2016) 识别了组织内部使用的印象管理行为，并对其证据基础进行了评估。他们报告说，讨好的结果参差不齐，例如员工试图讨好组织中的资深成员。虽然这起初可能是成功的，但反复使用讨好策略可能会产生负面结果。同样，文献表明，自我促销在某些语境下是有效的印象管理策略，但在其他语境下可能显得傲慢或自夸。作者们以
    Cialdini (2001) 的研究为例，他发现患者更倾向于医生在候诊室墙上展示自己的资和证书。再次，这种印象管理行为可能会适得其反——个人和组织所使用的信息，正是攻击者和社交工程师能够利用的信息。


    ## 77 文化


    组织面临的挑战是技术发展的速度，以及网络威胁的复杂性和流动性。由于缺乏相关的资源和专业知识，这对于小型公司来说是一个尤为棘手的问题（Fagble, 2023）。然而，大型组织也无法免受这些挣扎。组织还报告从广泛的来源接收有关网络安全的信息和指导，对威胁情报的使用程度不一（文化、媒体和体育部,
    2022）。这些来源包括由网络安全社区个人提供的来源，例如 Hackaged (https://www.hackagedaddon.com)，它记录了高知名网络安全泄露事件的细节，以及
    PhishTank (https://phishtank.org)，它策划了钓鱼邮件的示例。这些信息的可用性是积极的，尽管应该考虑个人和组织如何处理这些信息，这有助于理解重点在哪里。正如
    ISACA 所报告的，网络安全挑战由于公司在留住合格网络安全人员方面面临的困难而进一步复杂，这种状况似乎被 COVID-19 大疫情加剧了（ISACA, 2022）。这些人员流失在
    35 到 44 岁的中职业员工中尤为显著，职业倦怠在网络安全人员中也十分可见。此外，大约三分之二的组织报告需要三到六个月才能填补空缺。54% 的员工提到他们认为最大的差距是沟通、灵活性和领导力方面的软技能。在威胁格局方面，超过一半的受访组织认为，大多数组织在未来一年可能或极有可能会遭受网络攻击。然而，也有注意到，尽管招聘存在缺口，但大多数组织（82%）对他们检测和响应网络攻击的能力充满信心。这再次凸显了网络安全威胁的现实与组织对自身保护能力所表现出的过度乐观的观点之间的脱节。还发现
    80% 的组织报告教育和意识计划产生了积极影响，尽管在这些案例中，影响是如何衡量和量化的可能存疑。正如将在第 6 章中讨论的那样，假设网络安全培训的初步积极影响会导致有意义的长期变化是有风险的。


    研究人员提出了更深层次的内部威胁子类型，它们超越了故意和无意内部威胁这两个大类，例如 CERT 国家内部威胁中心提出的分类法（Capelli, Moore,
    & Trzeciak, 2012）。该分类法的组件如下：


    - 信息技术 (IT) 破坏：利用 IT 技术对组织或个人实施特定伤害

    - 知识产权 (IP) 盗取：故意滥用个人权限从组织中窃取机密或专有信息

    - 权利赋予（Entitled Endowment）：内部人员主要通过个人行为窃取信息，带到新工作或其私营业务

    - 野心勃勃的领导者：内部犯罪的领导者，为了某些更大的目标招募内部人员窃取信息

    - 欺诈：未经授权对组织的个人数据进行修改、添加或删除，获取导致身份犯罪的信息（例如，身份盗窃、信用卡欺诈）


