    vary in terms of the resources and skills they have in relation to cybersecurity.
    It could be argued that much of the research literature has focussed on cybersecurity
    behaviour in large organisations. In this, Bada and Nurse (2019) identify five
    key points from the literature on cybersecurity in small and medium-sized enterprises
    (SMEs). Firstly, they note that it is vital that there is a good security culture
    in the SME. This is of course a point that applies to all organisations, as discussed
