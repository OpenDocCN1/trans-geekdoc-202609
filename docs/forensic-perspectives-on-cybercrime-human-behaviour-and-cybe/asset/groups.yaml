    ## 受害者学与韧性 63


    对于其他风险因素作用的研究相对较少。Lin 等人（2019）没有发现种族或族群与受害概率之间存在任何关系。研究发现，自我控制力低的人更有可能泄露密码，但在面临其他类型攻击的风险上并不增加（Maimon
    & Louderback, 2019）。认知决策似乎也与受害概率有关。Jones、Towse、Race 和 Harrison（2019） 认为，工作记忆的差异（被某些研究人员认为与短期记忆相似）可能是导致某些人在阅读网络钓鱼邮件时使用启发式法，而另一些人则不会的原因之一。Jones
    等人（2019）进一步指出，与之前的研究不同，他们没有发现证据表明人格特征或自我控制力对易感性有任何影响。然而，Kleitman、Law 和 Kay（2018）报告了某些关于人格作为风险因素的证据，在某些研究中，开放性与网络钓鱼邮件的易感性呈正相关。在
    Kleitman 等人（2018）的研究中，他们发现母语为英语的人更有可能发现网络钓鱼邮件中的语言错误，这并不意外。这凸显了英语在世界许多地区作为国际商务交易事实语言所面临的风险。Kleitman
    等人（2018）还注意到，自报告的识别网络钓鱼邮件能力与实际能力之间存在显著相关性。结合之前讨论的启发式法和偏差，这可能导致人们对自己的能力过度自信，从而降低了网络受害的风险。这种过度自信正是社会工程工程师和其他攻击者经常利用的这一点。


    Lin 等人（2019）建议，风险因素结果不一致的原因之一是之前的研究中使用了自报告法，因为在某些语境下，这可能不是一种可靠的数据收集方法论。他们报告了人们感知易感性与实际易感性之间存在差异，这种差距在老年人中更为明显。另一个相关的方法论问题是，个体可能会感知自己的能力以及他们所处风险的程度。Rifon、LaRose
    和 Choi（2005）指出，如果用户认为自己能够有效缓解隐私漏洞的影响，他们更有可能忽略危险的警告。这是一个挑战，因为发现人们倾向于认为自己的风险比同龄人低。Nieto
    和 Rios（2019） 认为，网络犯罪产生的数据可以用于生成受害者的画像，作为网络安全因素（HFC）的一部分。然而，识别网络犯罪受害风险因素的一个基本挑战是，这需要对个人所参与的活动以及这些活动的风险性充分了解


    ## 64 受害者学与韧性


    网络犯罪分子通常试图隐盖他们正试图攻击受害者的事实；在社会工程的情况下，他们理想上希望永远不会被检测到。然而，风险因素在组织环境中可能更容易被识别，因为组织可以直接观察到个体的行为。这可能与使用大数据的分析方法相结合，将在第
    6 和第 7 章中详细讨论。


    特定类型的网络犯罪似乎与特定的风险因素有关。Whitty（2018）研究了约会诈骗受害者的心理特征。约会诈骗涉及心理操纵，使目标相信自己与诈骗者处于恋爱关系，一旦这种关系开始，就会要求财务支持或获取社会安全证等个人详情。这可能涉及创建虚假的个人资料。大多数受害者是中青年、受过良好教育的女性，正如
    Whitty（2018）所指出的，约会诈骗的后果不仅是财务损失，还有由于背叛和羞辱造成的心理创伤。同样，研究还注意到，网络仇恨等攻击的受害者更有可能是女性，即作为内容创作者或创业者的女性（Halder,
    2022），以及被男性主管和同事针对的女性（Tenório Júnior & Bjorn, 2019）。这受到文化的影响，非西方文化由于缺乏意识、对禁忌的恐惧以及缺乏数字赋权，不像西方女性更容易寻求公正（Halder
    & Jaashankar, 2012）。相比之下，研究建议男性更有可能是性勒索的受害者，受害者被胁迫在摄像头前进行性行为，随后被威胁将这些视频发布给朋友、家人和同事（Aitken,
    Gasket, & Hodgson, 2018）。总体而言，Halder（2022）报告说，女性更有可能经历严重的网络犯罪，包括人际网络犯罪、约会诈骗、网络性犯罪、数据隐私侵犯、名誉损害和网络攻击。相反，男性更有可能经历网络犯罪，包括彩票诈骗、电子商务欺诈、为恐怖目的招募、在线种族仇恨和仇恨言论以及性勒索。在两种情况下，50岁以上的女性可能面临更高的银行欺诈风险（Halder,
    2022）。


