    ## 新兴技术与未来方向


    返回初始状态（一种回归），Guo (2012) 指出，这表明信息在第一次没有被完全处理，需要重新编码——这可能是由于刺激物的新颖性、惊讶性，或者是处理过程涉及的难度。扫视长度（在两个或多个注视点之间的快速眼动）已知受参与者内部状态的影响，例如处于压力下的参与者扫视距离较短（Nam
    et al., 2022），或者处理可预测性较低的信息（Liu, Tong & Su, 2020）。事实上，通过马尔可夫链模型测量的眼动模式不可预测性，可以用于衡量一个人对刺激物编码的熟悉程度，这为了解他们如何感知和处理呈现给他们的信息提供了见（Shang,
    Lu, Wu, & Wei, 2021）。此外，眼动差异可用于区分抑郁症与非抑郁症患者（Zhang et al., 2022），以及识别出模拟驾驶事故风险高于他人的人员（Li,
    Fan, Ren, Zheng, & Yang, 2021）。


    传统上，眼动追踪是使用实验室追踪设备完成的。这些设备非常精确；然而，这些追踪要求参与者坐在屏幕前的固定位置上，通常需要前往专业机构。最近，出现了一种趋势，通过笔记本电脑、PC
    网页摄像头或手机摄像头进行眼动追踪。这是一种新兴技术，利用网络摄像头提供的较高分辨率，在个人家庭或工作场所内进行眼动追踪；这样做可能创造出一个更自然的环境。这与网络安全高度相关，在网络安全领域，已经证明了网络安全行为（如与钓鱼邮件的互动）取决于个人所处的社会环境（da
    Veiga, Astakhova, Botha, & Hershelman, 2020）。基于网络摄像头的眼动追踪潜力用于更好地理解个体如何与钓鱼邮件互动。然而，关于该主题的研究仍存在若干局限性。缺乏探索基于网络摄像头的眼动追踪应用在手机钓鱼邮件方面的研究。此外，缺乏对比笔记本电脑/PC/手机上的网络摄像头眼动追踪与实验室眼动追踪设备效能的研究。已进行的研究通常使用的样本量较小，少于
    50 人，这限制了发现的普遍性。最后，研究往往从计算的角度出发，缺乏通过引入心理学理论可以获得的跨学科见解。


    ## 大数据、机器学习与人工智能


    大数据是指体量巨大以至于无法通过传统手段在合理的时间范围内进行存储、处理、共享和分析的数据。


    然而，这在某种程度上取决于背景。例如，一个 50mb 的文件考虑到人们每天使用的数据量，可能并不算大文件，但许多电子邮件系统将不允许附件这种大小的文件。尽管如此，大数据指的是海量数据，由个体参与的产生数据的活动所生成。例如，一个群体中使用的所有健身设备收集的集体数据提供了大量信息，这些信息可能为研究人员和医疗保健提供提供关于健康行为的见解，而这些行为通过传统方式是非常难以收集的。大数据的另一个常见来源是员工与公司
    IT 系统互动的方式。这可能包括多种类型的信息，例如员工在系统上的活跃时间、他们发送的邮件和消息、他们执行的功能以及全天生产力的变化。对于网络安全而言，这些数据可能包括此类指标：如打开邮件到回复之间的时间、员工是否尝试访问他们不应访问的文件，以及某些员工点击钓鱼链接的模式是否高于其他人。大数据的一种形式是由社交媒体生成的。正如第
    1、2 和 3 章所讨论的，社交媒体信息为网络安全和网络战争攻击提供了许多机会，例如使用社交媒体机器人传播虚假新闻。Erole, Gibson-Robinson,
    Goldsmith 和 Creese (2016) 探索了通过观察某人在不同平台提供信息的一致性，是否可能将真人与虚假账户区分开。他们发现这确实是可能的，证明了人类软件机器人的表现方式是有局限性的。Adjer
    和 Kelley (2018) 注意到，心理学家尚未充分利用大数据和机器学习带来的益处，部分是因为在使用这些技术时存在不确定性和感知风险。他们还认为，开源研究工具的可用性日益提高，使得使用大数据和机器学习比大多数心理学家意识到的要容易得多，而且使用这些技术的机会多样性更大且往往未被重视。


    Landers, Brusso, Cavanaugh 和 Colmus (2016) 认为大数据相比通过更传统方法收集的数据具有优势。首先，这些数据主要是行为数据的，而不是来自调查和问卷的自我报告数据。这在观察网络行为时可能特别有益。这些许多行为是个体可能知道自己正在做的（例如设置复杂密码）或没有在做的（例如在正确检查发件人地址之前点击链接）。因此，自我报告测量可能并不完全可靠，特别是在员工被组织质问的情况下。其次，从大数据源可以获取的样本量远大于通过传统数据收集手段通常能实现的量。无论是学术研究还是内部研究，招募足够的样本来理解一种现象是一项经常的挑战。即使个体有动力提供数据，他们可能没有时间充分投入。由于大数据通常由已经收集的信息组成（如员工行为的计算机记录），不需要个体采取额外行动。这对于可能使用更少的时间和更少的资源（即使用已有的次级数据）也具有吸引力。第三，收集数据的人对此并无知情，从而减少了诸如需求特征（demand
    characteristics）等问题。需求特征的概念源于研究，，参与者意识到研究人员正在调查什么或预期发现什么。这可能导致参与者做他们认为应该做的事（例如，口头上说他们不会点击未知邮件，但实际上可能会点），或以取悦研究人员的方式行动（Orne,
    1996）。或者，参与者可能会以取悦研究人员的方式做出，这种现象被 Masling (1966) 识别为“去你的”效应（screw you effect）。这些过程主要在参与学术研究的方面被研究，以观察当个体就网络安全信念和行为接受调查时，这些现象可能是如何产生的。第四，数据可以以通常情况下可行的速度进行收集。在许多情况下，数据可能已经存在。例如，如果想探索某条假新闻是否在社交媒体上传播，通常可以通过可以访问社交媒体平台数据的软件工具立即获取这些数据。最后，在可能存在物流和实际挑战的人群中收集大数据，例如在农村地区。在农村地区实地收集数据可能可能是耗时且昂贵的，但——只要该地区拥有在线连接——在线数据就可以快速收集。


