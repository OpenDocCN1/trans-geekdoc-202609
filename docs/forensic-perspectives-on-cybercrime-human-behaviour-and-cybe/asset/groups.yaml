    ## 16 网络犯罪简介


    连接到互联网以便在食物耗尽时通知用户使用的智能冰箱，也可能被攻击者胁迫成为僵尸网络的一部分。


    网络战（Cyberfare）可以包括影响力行动，即将虚假新闻、错误信息和误导性信息传播到目标国家，旨在影响其行为（Atrews, 2020）。这涉及计算宣传（computational
    propaganda），即利用自动化、算法和大数据分析来影响和欺骗社交媒体用户（Woolley & Howard, 2016）。新闻、错误信息（misinformation）和误导性信息（disinformation）这三个术语经常互换使用；但它们之间存在区别：错误信息是指无意中分享虚假新闻（例如，在相信内容属真的的情况下在社交媒体上转发虚假内容），而误导性信息是指故意分享虚假新闻的行为（美国精神医学协会，2023）。在本文，“虚假新闻”被广泛指代以改变公众舆论为目标的操纵。应注意不要假设哪些国家参与了虚假新闻的传播，或者如果他们参与了，是如何做的。例如，Bolsov
    和 Howard (2019) 报告说，与预期相反，他们没有发现机器人在 Twitter 上发布亲中国国家言论的证据，而这些内容似乎是针对海外华人以及那些有办法绕过限制使用
    Twitter 的国内人士的。该研究还强调了虚假新闻的传播在不同平台之间存在差异，几乎没有证据表明人在微博（一个与 Twitter 有某些相似之处的中国微博客网站）上运行。


    战争行为不仅限于针对其他国家。据发现，政府利用私营公司对公民进行间谍活动，包括使用恶意软件（Frenkel, 2015）。政府和政党还投入大量资源利用社交媒体来影响国内外民众的观点（Bradshaw
    & Howard, 2017）。Bradshaw 和 Howard (2018) 将散发虚假新闻的国家支持组织称为“网络士兵”（cyber-troops）。正如他们所指出的，这些组织与个人黑客或活动分子小组的不同之处在于，它们由公共资金资助且高度协调，并并有其他政府参与者的支持。有人认为，威权政权利用社交媒体和其他互联网技术对其公民施加控制和信息管理（Peirce
    & Kendzir, 2012）。也观察到了针对其他国家使用虚假新闻的行为，包括著名的案例，例如据指俄罗斯政府涉嫌英国脱欧公投，以及 2016 年美国大选（Bradshaw
    & Howard, 2018）。虽然数据窃取和试图破坏关键基础设施的行为被称为“硬实力”能力，但利用社交媒体影响行为和观点的做法被描述为“软实力”（Bradshaw
    & Howard, 2018）。


    ## 网络犯罪理论


    正如 Bossler (2017) 所观察到的，顶尖犯罪学期刊上发表的与网络犯罪相关的犯罪学研究数量有限，Diamond 和 Bachmann (2015)
    将此归因于犯罪学家对在线网络犯罪生态系统的缺乏熟悉。Maimon 和 Loudback (2019) 注意到，关于网络依赖型犯罪者（cyber-dependent
    offenders）的大部分研究基于学生或组织样本，这些样本主要从事低级网络犯罪，并不是众多且多样的网络犯罪分子形象的代表性样本。应用于网络依赖犯罪的犯罪学理论包括犯罪一般理论（Gottfredson
    & Hirshi, 1990）、社会学习理论（Akers, 1973）、社会控制理论（Hirshi, 2017）和震慑理论（Gibbs, 1968）。


    犯罪一般理论区分了“犯罪性”（犯罪行为的倾向或趋势）和“犯罪”（违反法律的实际行为）。Gottfredson 和 Hirshi (1990) 指出，只有当犯罪倾向与犯罪机会相重合时，犯罪才会发生。鉴于我们每天通常遇到许多犯罪机会，个人的犯罪性就成了关键因素。Gottfredson
    和 Hirshi (1990) 认为，这种自控通常是在生命早期学到的。尽管有证据通过离线犯罪者支持自控与犯罪性之间的这种关系（Pratt & Cullen,
    2000），但针对在线犯罪者的研究更为显著（Marcum, Higgins, Ricketts & Wolfe, 2014）。这种被提议的关系也是社会控制理论（Hirshi,
    2017）的一部分，该理论被描述为犯罪学历史上的转折点之一（Costello & Laub, 2020）。与关注青少年犯罪的犯罪学理论不同，社会控制理论侧关注防止青少年犯罪的约束和环境。该理论认为，犯罪性源于个人缺乏亲密依恋、抱负和道德信念，这些因素将人们束缚主流、合法的生活方式。在涉及网络犯罪时，这是一个有趣的考虑点。正如第
    3 章将再次讨论的，参与网络犯罪的个人通常作为群体的一部分这样做。网络犯罪集团成员之间存在信任关系，即使他们不知道彼此的真实世界身份。黑客论坛似乎是论坛成员自尊心、自我认同和社交关系的重要来源，对黑客论坛（即使是浅层网络论坛）的分析表明，成员关注道德问题（McAlaney,
    Hambidge, Kipton, & Thackray, 2020）。


    与犯罪相关的社会学习理论（Akers, 1973）指的是行为如何通过社会过程得到强化。这与 Bandura (1977) 的社会学习理论有关，但侧重于操作性条件作为犯罪行为的动力。操作性条件（也被称为工具性条件）认为，如果行为得到某种奖励的正向强化，可能会重复，而如果受到惩罚则不太可能重复。负强化也可能发生，通过消除负面刺激来增加行为的频率（Skinner,
    1963）。例如，如果孩子在用餐时拒绝吃某种食物，而父母鼓励并移走了该食物，就会产生强化，导致孩子在未来更有可能拒绝食物。正如 Akers (1973) 所建议的，个人长期参与犯罪取决于他们的最初犯罪经历，以及与参与犯罪活动者的互动。如果他们因为这些行为受到惩罚，他们参与犯罪的可能性就会降低；但如果他们获得奖励，参与犯罪的可能性就会增加。可以想象这些过程在网络空间是如何运作的。正如所指出的，人们对许多形式的网络犯罪缺乏理解和公众意识，这可能也适用于执法的某些方面（Halder,
    2022）。有关网络犯罪的立法往往过时且不符合实际（Mishra, 2022）。因为参与犯罪活动的人能够在不被发现的情况下这样做，或者在被捕时可能不会面临惩罚。正如第
    3 章将讨论的，此类个人还可能通过加入黑客社区获得社交支持和认可。他们也通过参与其他社区进入这些黑客社区。为了支持这一点，Hutchings 和 Clayton
    (2016) 显示，对游戏社区的认同会导致参与黑客活动。同样，发现在聊天室和社交媒体上花费时间意味着他们会面对更多在线偏离行为的强化，并获得偏离社会规范（Donner,
    2016; Weulen Kranenberg, Holt, & van Gelder, 2019）。


    震慑理论假设人们根据利益最大化和成本最小化做出犯罪或放弃犯罪的决策（Beccaria, 1963）。正如 D’Arcy & Herath (2011) 所观察到的，经典震慑理论关注正式的（法律）制裁，并认为制裁越迅速越严厉，个人就越


