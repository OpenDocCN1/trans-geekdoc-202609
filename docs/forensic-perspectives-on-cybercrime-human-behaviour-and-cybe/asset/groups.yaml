    # Social engineering 29


    that the social engineer was able to determine version of the PDF software the
    theme park was currently using by calling them directly and pretending to be a
    salesman who was selling an alternative software. The theme park employee who
    spoke to the social engineer presumably freely provided this information because
    the question did not seem to be sensitive. This is a common theme in social engineering
    attacks – each individual step or interaction with the target does not, by itself,
    to be posing a threat. It is only when the information is gathered together that
    the true risk is apparent.


    The plan for attacks such as the one above is broken down into what, when, and
    who. This is of interest as it aligns to the common policing investigation technique
    of considering the SWH of an offence – what, when, where, who, why and how (College
    of Policing, 2013). In relation to penetration testing, ‘what’ refers to what
    will happen in the attack, and what the goals are. Radcliffe (2023) observes that
    there can be tensions when setting goals with an organisation when social engineering
    penetration test is being planned. The organisation may feel that some assets
    are too sensitive to be exposed to someone external to that organisation, even
    if person is brought in by a security advisor. Similarly, there may be debates
    about how many people within the organisation will be informed in advance that
    a penetration test is going to occur. To be a true test of the security of an
    organisation as few people should be aware that the test is occurring, but organisations
    may not feel comfortable with some individuals, such as members of management,
    not having advanced knowledge (Radcliffe, 2023). Finally, organisations are unlikely
    to leave behind a calling card, or sending an email from a device inside the organisation
    (Radcliffe, 2023). Once the tests are set, the next step is to decide upon when
    to launch the attack. This is linked to the ‘who’ in the attack plan, which refers
    to who needs to be available to implement or assist with the plan – often without
    realising that their actions are in facilitating an attack. The plan is set and
    the attack is launched, although social engineers note that an overly detailed
    plan can act as an impediment when facilitating an attack. (Hadnagy, 2018; Radcliffe,
    2023). In ethical social engineering the final stage is to report the findings
    of the attack to the client, with advice on how to change their practices to reduce
    the risk of becoming the victim of a criminal social engineering attack. A recurring
    theme in accounts given by ethical social engineers and penetration testers is
    overconfident organisations often are that their systems are secure; and in turn
    how shocked they are with the ease with which they have been breached (Hadnagy,
    2018; Radcliffe, 2023; Rhysider, 2023).


    # 30 Social engineering


    The trickery used by social engineers and hackers does not need to be complicated.
    For example, it has been reported that hackers send USB sticks infected with malware
    to U.S. companies disguised as gifts (Rope, 2022). As with phishing emails, it
    does not matter if most of these USB sticks are not plugged in – it only requires
    one employee to insert the USB stick into a company device for the attack to potentially
    be successful. The ease with which people can be manipulated into facilitating
    cyber-attacks can be surprising. In one study, psychology students were approached
    and asked them if they would participate in a short survey on IT behaviour, conducted
    by the local university (Happ, Melzer, & Steffen, 2016). As part of this, participants
    were asked to tell the interviewer what their password was to their computer or
    device. Participants were also offered a chocolate, either at the start of the
    interview, directly before being asked for their password, or at the end of the
    interview. One of three participants provided their password on request. Of those
    who did not provide so 58% provided some hint of their password. Of those who
    were given the chocolate immediately before being asked for their password provided
    it, in contrast to those who were given the chocolate at the start of the interview
    (40%) nor given one at all (30%). However, the effect of being given a chocolate
    was only significant for male participants. Female participants were not influenced
    by this. In addition, other participants were likely to reveal their password.
    It should be noted that research into who is most likely to be a victim of cybercrime
    has produced conflicting results, as is expanded on in Chapter 4.


    Social engineering exploits heuristics and cognitive biases. These are the mental
    shortcuts that we use as humans to cope with the vast amount of information that
    we process daily to navigate our social worlds. For instance, we will typically
    assume that anyone wearing the uniform or clothing of an organisation is a part
    of that organisation, as if someone wearing the overalls associated with a cleaning
