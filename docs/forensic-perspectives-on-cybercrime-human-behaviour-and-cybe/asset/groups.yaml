    HBGary 的高管 Aaron Barr 决定通过渗透 Anonymous 来展示他的技能（Olson, 2012）。他的意图是揭露成员的真实身份，即“人肉”（doxing），尽管后来发现他误认了几个家庭成员。这促使
    Anonymous 针对 Aaron Barr，并在此过程中他们破解了 HBGary 的系统。这允许他们识别出 Barr 的密码，他们还确定这也是 Facebook
    的密码。随后，该小组劫持了 Barr 的社交媒体账户并发布了各种尴尬的评论，包括他本人的引言。从心理学角度来说，这可以被描述为消除 Barr 的印象管理（Goffman,
    1959），即控制他如何被世界看待。Anonymous 然后发布了 Barr 的家庭地址、社会安全号码和手机号码，之后他便遭受了一系列升级的攻击。在 Barr
    的妻子发出请求后，攻击才开始停止，她谈到了这种情况带给她自己和孩子们遭受的痛苦（Olson, 2012）。这种与外部威胁的冲突似乎加强了 Anonymous
