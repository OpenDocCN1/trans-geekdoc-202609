    ## 50 攻击者


    一种群体观点，因此如果他们目睹有人违背这种社会习俗，他们会假设对方这样做是有正当理由的。反映这一点的是，观察到在黑客论坛上，那些对自己的观点表现自信的个人会对群体共识产生争论（McAlaney
    et al., 2020）。个人的观点是否正确则是另一个问题。总的来说，黑客组织和网络犯罪集团所涉及的冲突，似乎与整个社会心理学研究的冲突类型一致，例如谢里夫在
    20 世纪 50 年代进行的著名实验，在该实验中，两组男孩被操纵表现出群体间的冲突（Sherif, White, & Harvey, 1995）。


    在另一个群体冲突的案例中，观察到黑客会因为对其他小组的运作方式产生异议而针对其他黑客小组。例如，据报道后文讨论的 Kiwi Farms 遭受了网络骚扰和跟踪，该网站被黑，用户的个人信息被泄（Holt,
    2022）。这似乎引发了一些群体间的冲突，该论坛的用户对其创始人乔舒亚·月（Joshua Moon）表达了愤怒。黑客的身份和动机尚不清楚，但可以评论的是，这种针对个人的行为非常吸引某些那些以骚扰他人为傲的黑客小组。更广泛地说，黑客可能针对他人，是因为他们存在于另一个国家或文化中，而黑客认为这些在某些方面是低劣或不道德的。例如，据报道，个人对外国政府造成伤害的意愿比对本国政府更高（Bossler,
    2021）。这涉及到“爱国黑客”的概念，即针对他们认为与本国利益相冲突的外国政府和组织的群体或个人（Dahan, 2013）。


    虽然黑客（特别是黑客行动主义者 hacktists）经常与特定类型的外部组织发生群体冲突，但也有其他小组将他们的攻击性集中在更具体的目标上。这些极端组织尽管其观点极度极端，但通常共享着排外信仰，认为种族、种族或宗教群体构成了威胁（Perry
    & Blazak, 2010）。T. J. Holt、J. D. Frederik 和 S. M. Chermak (2017) 认为，这些群体运动面临着快速证明其对该运动忠诚的压力，部分原因是他们意识到了与主流社会之间的冲突，以及被执法执法渗透的风险。然而，个人缺乏了在面对面互动中可以用来标识群体身份的相同选择。由于他们更依赖于在小组内部使用独特的语言，被称为“行话”（argot）。这种行话在某些在线小组中非常明显，例如在“非愿单身男汉”（incel）论坛上的讨论。incel
    论坛用户被认为主要是男性异性恋者，但正如文献所述，对这些身份存在一些不确定性（Jaki et al., Sugiura, 2019）。Sugiura (2021)
    识别了 incel 论坛内使用的广泛词汇，包括 Chads（非愿单身男汉的对立面；指在性关系上成功的男性）、Fem（对女性的去人性化称呼）、JBW（只是个白人，认为女性会主要选择白人男性作为浪漫或性伴侣的信念）以及
    Trucel（真正的 incel，指从未碰过女性且无法性交）。在这些论坛上认同为 incel 的人通过讨论服用“红药丸”（以及其他颜色）并觉醒到“女性统治世界且他们永远无法与女性建立浪漫或性关系”的“现实”，进一步将自己与主流社会区分开。“红药丸”一词源于最初建立在
    Reddit 上的社区，这本身引用了 1999 年电影《矩阵》中的经典场景，在电影中，基努·瑞维斯饰演的角色被要求在两种药丸之间做出选择：一种让他继续虚假模拟生活的蓝药丸，另一种是让他看到真实世界的红药丸。


    一个相关现象是对在线人物和社区的骚扰。促进这种骚扰的知名在线论坛之一是 Kiwi Farms，它曾被称为 CWKi Forums。该社区组织钓鱼和言论，并揭露在线人物的（现实世界身份）。它针对女性、LGBTQIA+
    群体和神经多样性群体。这包括一些离线环境下的骚扰事件（Plex, 2016）。该小组将 2019 年新西兰基督城两座清真寺的大枪杀击等悲剧作为其钓鱼和骚扰的基础。该小组的行为被指控是三个人自杀的因素之一（Dress,
    2022）。导致个人自杀是该小组声称的目标之一，他们在自己的网站上记录了他们认为负责的死亡人数（Veale, 2020）。该论坛因内容引起互联网提供商反对而被从互联网上移除，尽管在写作时，它已经能够重新获得在线存在。


    群体内部冲突也可以塑造小组的行为。匿名者（Anonymous）的一名高级成员是 FBI 线人的这一事实被披露，这似乎对该小组造成了巨大损害（Coleman,
    2014）。第一章讨论类型的网络犯罪网络也有重要的社会依赖关系（Leukfeldt et al., 2017），黑客小组似乎也高度依赖成员之间的信任感（Thackray
    & McAlaney, 2018）。Nurse 和 Bada (2019) 观察到，尽管是网络犯罪分子，但成员之间往往存在某种程度的离线互动。这支持了关于网络犯罪分子之间


    ## 52 攻击者


    离线关系并不仅仅因为互动主要发生在在线上就认为不存在（观点）。这些小组似乎经历着与离线小组中记录的所有全方位冲突。事实上，网络犯罪调查人员评论说，黑客的“戏码”可以被用来诱成员透露信息（Troia,
    2020）。考虑到此类小组必须在限制条件下运行，这种冲突和戏码可能并不意外。这包括确认合作者身份的困难，以及执法执行的限制，特别是在在线环境中（Dupont
    & Lusthaus, 2022; Lusthaus, 2018）。正如 Lusthaus, Kleemans, Leukfeld, Levi 和 Holt
    (2023) 所讨论的，网络犯罪分子似乎开发了各种策略来克服这些问题。这包括使用封闭论坛、由现有成员进行担保，以及让成员提供被盗信用卡等证据来证明他们很活跃（Dupont,
    Côté, Boutin, & Fernandez, 2017；Holt, Smirnova, Chua, & Copes, 2015; Soudijen
    & Zegers, 2012; Yip, Webber, & Shadbolt, 2013）。人们注意到，这些策略并不总是有效，例如缺乏所需技能的成员从未能进入臭名昭著的暗网市场
    Darkode（Dupont et al., 2017）。此类案例展示了网络犯罪论坛和市场面临的根本冲突——它们需要提供服务并招募新成员，但希望避免执法人员和具有恶意的竞争者的渗透。


    网络犯罪生态系统的互连性为研究和调查提供了机会。例如，Lu、Luo、Polgar 和 Cao (2010) 展示了如何将社交网络分析应用于理解一个黑客网络
    Shadowcrew。他们注意到网络中存在派系，某些成员比其他人更参与子小组。他们还观察到，尽管是一个去中心化的网络，Shadowcrew 的成员地位并不平等。相反，存在不同的角色和权力等级，例如管理员、审核员、管理员、供应商和普通成员，这表明了复杂的分工。这类似于
    Bent 和 Luckenbach (1994) 定义的团队组织结构。其他用于研究网络犯罪系统的技术包括访谈罪犯和调查人员（Hutchings & Clayton,
    2016; Lusthaus, 2018）、受害者调查（Williams, Lee, Burnap, & Gundur, 2019）、网络犯罪市场和论坛分析（Décary-Hét
