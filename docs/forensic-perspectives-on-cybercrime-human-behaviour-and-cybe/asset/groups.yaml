    # 社会工程学


    在线元素。在讨论法医心理学在网络空间的作用时，Kirwan 和 Power (2013) 观察到，心理画像分析中经常使用两种底层假设。首先是**一致性假设**（consistency
    assumption），该假设认为犯罪者在所有犯罪中都会表现出相似的行为（这使得犯罪可以被“关联”到同一个人实施）；其次是**同质性假设**（homology
    assumption），认为相似的犯罪倾向与与相似的犯罪特征相关（允许我们根据对以前以类似方式犯罪的犯罪者的了解，推断出当前犯罪者的画像）。


    正如 Kirwan 和 Power (2013) 所评论的，关于网络犯罪的一致性假设存在一些问题；技术变化如此迅速，所使用的方法也可能随之改变，尽管也发现黑客组织所使用的方法在数几年内仍可能存在争议（Preuß,
    Furnell, & Papadaki, 2007）。一致性假设的另一个困难在于，个人或群体的行为是一致的——他们可能以相似的方式行为——因此可能并不具有独特性，从而在使用的方法上无法相互区分。如果所有的黑客组织都使用相似的方法，那么对于网络空间中的同质性假设来说也是一个困难。如果大多数黑客都是受过良好教育、在某些论坛可以访问互联网和特定软件的年轻男性——正如在某些论坛上呈现的形象那样（Thackray,
    2019）——那么无论他们的方法或犯罪风格是否相似，典型的犯罪者画像可能都是相同的。这无法区分个体。


    此外，对更广义的画像分析本身提出的批评是，画像包含的主要是是人口统计学特征，而非更细致的性格或动机方面。由于执法部门缺乏大型数据集，获取相关数据的困难以及主要使用案例研究的局限性也引起了关注（Bada
    & Nurse, 2021）。例如，他们的论文强调了“行为欺诈”（action fraud）以及用于收集受害者相关信息的国家数据库，但目前还没有一个专门收集犯罪者特征的数据库（Bada
    & Nurse, 2021）。考虑到攻击发生的不同动机、风格和背景，仍需要更多的研究，以识别不同类型犯罪者之间的差异（Bada & Nurse, 2021）。然而，Nykodym、Taylor
    和 Viela (2005) 认为，在处理内部威胁时，网络犯罪画像可能特别别有用，这与社会工程学有关，因为社会工程学通常涉及操纵公司员工，使其在无意中以便利攻击的方式，从而对情况获得更全面的理解。


    Jenny Radcliffe 的书《*People Hacker: Confessions of a Burglar for Hire*》（“人类黑客：雇佣窃盗者的自白”）概述了她作为一名伦理社会工程工程师的生活经历。Radcliffe
    讨论了她对这一职业的兴趣是如何从一个小女孩时期开始的，那时她会探索家乡的废弃建筑。这种活动现在被称为“城市探险”（urban exploring），是几个热门
    YouTube 频道的基础。Radcliffe 讨论了在尝试进入建筑时拥有计划以及若干个备选方案的重要性。在此过程中，她在职业生涯早期经历了一次“险之又差”，当时一个提早开始的冲动决定差点导致她被抓获并遭受重伤。这以及其他讨论说明了他们在工作中投入了何种的准备和规划。事实上，他们投入的精力往往比人们要多，以保护自己。Radcliffe
    强调，安全往往是一种幻象，并指出房屋中许多不合门的门只要使用正确的技巧，就可以从门框中直接取出。Radcliffe 还讨论了刻板印象和感知如何帮助她的工作。正如她所说：“我不看锁。我看着那个负责锁好锁的人，然后说服他们打开。”尽管如此，物理锁也有其用处。在《黑暗日记》的“The
    Deviant”一章中，同笔名的伦理渗透测试员讨论了他作为服务的物理安全测试工作（Riley, 2023）。他还注意到这种事的完成非常容易，当需要时，它通常对富裕公司的内部几乎没有挑战，而产品通常被锁在廉价的锁后面。提出的问题是，为什么公司不直接雇佣像
    The Deviant 那样的专业渗透测试人员？采访给出的回答是，专业测试人员的角色之一是编写一份报告，解释他们是如何获得访问的，但透明文化是网络安全领域反复出现的主题。在黑客论坛上，分享不同技术是互动的主要方式之一（McAlaney,
    Hambidge, Kimpton, 2020），尽管应当说明，这并不代表他们认可自己尝试使用这些技术。事实上，很多讨论的语调是论坛用户——通常是那些经验较少的人——不应尝试使用这些技术，以免被捕获并起诉。尽管如此，某些个人获取这些知识并用于恶意目的是不可避免的。因此，赋予人们关于网络犯罪分子手段的知识可以让他们更具洞察力，反过来提高了保护自己的能力，但这样做可能会促使他人以此方式探索犯罪活动。


