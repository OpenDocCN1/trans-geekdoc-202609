    # Scams


    Cybercrimes reflect offline crimes, especially those with a financial element
    as scams. One of the most common approaches used are phishing emails, which can
    include several elements such as links or files that, if opened, will install
    malicious software on a computer system. Alternatively, phishing emails or online
    messages may be used to establish a personal relationship with the target for
    the purposes of coercion, such as in the case of romance scams. Many of us will
    have experience of receiving an email that is easily identifiable as a phishing
    due to its dubious claims (such as a lottery win) and grammatical errors, while
    phishing emails have become substantially more sophisticated and tailored since
    their earlier iterations (Nurse, 2015), Iuga, Nurse, and Erola (2016) note that
    technological solutions to preventing the harms associated with phishing emails
    are but limited, emphas the need for better understanding of the human element
    of phishing emails. Phishing can also take place through malicious websites. Facebook
    groups have been used to scam individuals, as a group named the Total Wipeout
    Tour that presented itself as being associated with the TV show, albeit with a
    non-description statement confirming that this is not the case (BBC News, 2016).
    Individuals who wished to participate in this were asked to complete forms that
    requested their email address, date of birth and Facebook profile. No financial
    or banking details were requested. As it may be that people engaged with these
    emails did not perceive there to be any threat, which would be as predicted by
    Protection Motivation Theory (Rogers, 1975). However, a threat is still present.
    Information provided to pages such as this one could be a case of data mining,
    in which the information collected is sold to marketing companies. In addition,
    the page may prompt individuals to share and like it, gathering users until it
    is then sold to a business and undergoes a name change. This creates a deception
    in which a company is perceived to have a better reputation than would otherwise
    be the case.


