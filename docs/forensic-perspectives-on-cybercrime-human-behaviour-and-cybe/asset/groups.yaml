    ## 攻击者 53


    Clayton, 2018。Lusthaus 等人 (2023) 通过对十项结案调查进行案例研究分析，识别了犯罪网络的若干特征。该研究记录了案例研究涉及的群体内部不同类型的网络结构，其中一些的特点是具有松散的小组结构和定义模糊的角色，而另一些则具有更清晰的分层制度和职责分配。在所选的许多案例中，线下元素显而易见，这强调了网络犯罪与传统线下犯罪之间并不总是存在界限。随着技术在生活中变得无处不在，我们继续考虑这些可能被视为网络犯罪的活动中线下与在线部分之间的互动是至关重要的。


