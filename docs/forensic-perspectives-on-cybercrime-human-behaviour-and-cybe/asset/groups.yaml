    5 章和第 6 章中进行更详细的讨论。大规模黑客画像尝试是“黑客画像项目”（Chiesa 等人，2008）。这项工作利用了多种数据收集方法，包括对被识别为参与黑客活动的个人进行直接调查。作者指出，“黑客”的形象是模糊的，但从他们收集的数据中识别出了一些共同点。这包括观察到黑客是智能、有创意且果决的，具有强烈的好奇心并寻找应对挑战的新方法。这与
