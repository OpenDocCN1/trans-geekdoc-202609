  mdcn: "\n\n# 网络犯罪的取证视角\n\n人类行为与网络安全\n\nJohn McAlaney, Peter J. Hills, Terri Cole\n\
    \n取证心理学的新前沿\n\n![](img/51ad8f410e6da2f4318cde34a8193915_0_0.png)\n\n# 网络犯罪的取证视角\n\
    \n*网络犯罪的取证视角*（Forensic Perspectives on Cybercrime）是首本将网络心理学与取证心理学学科相结合的书，有助于定义这一新兴领域。它探讨了影响所有网络安全相关行为的心理因素，并参考了包括取证、社会和网络心理学在内的相关领域的研究文献。\n\
    \n本书由该领域的领军人物撰写，首先介绍了网络犯罪生态系统，随后讨论了如何通过社会工程技术对目标进行心理操纵，并强调了此类攻击带来的独特威胁。书中探讨了人们参与黑客活动的原因，作者们回顾了关于成为网络犯罪受害者风险因素的文献，以及“韧性”的概念。书中还评估了行为改变和预防策略，以及人工智能等新兴技术的作用，以及这些可能对人类在网络安全中所扮演的角色意味着什么。书中贯穿了案例研究和现实实例，用以说明关键问题、机会和挑战。\n\
    \n**John McAlaney** 是伯恩茅斯大学的注册心理学家和科学家。他的研究关注风险行为的心理决定因素，包括在线赌博、数字成瘾和网络安全。他与慈善机构、企业和政策制定者合作，帮助个人保护自己和他人免受网络伤害的侵害。\n\
    \nPeter J. Hills 接受过认知心理学训练，已发表了 60 多篇经过同行评审的研究论文，使用多种实验和非实验方法，研究了与取证领域相关的心理学方面，包括人脸识别、减少性暴力以及在线/线下的厌女女性主义和性别歧视。\n\
    \nTerri Cole 曾在国家犯罪局（NCA）工作多年，为重大犯罪案件调查提供行为调查建议。她目前任教于伯恩茅斯大学，研究如何将心理学知识应用于犯罪调查。她此前撰写过两本书，其中一本荣获英国心理学会（BPS）年度教科书。\n\
    \n![](img/51ad8f410e6da2f4318cde34a8193915_3_0.png)\n\n# 取证心理学的新前沿\n\n## 系列编辑\n\
    \nGraham Ellis 是达勒姆大学取证心理学教授，曾任英国司法部首席心理学家。他是英国心理学会颁发的的对专业实践和取证学术知识做出卓越贡献的获得者。\n\
    \nTammi Walker 是达勒姆大学取证心理学教授兼圣库伯特学院学院院长。她是注册心理学家，也是英国心理学会会员。她的研究兴趣包括管理监狱内自残和自杀的性别化干预、心理健康、身体健康以及解决大学内的性暴力问题。\n\
    \n《取证心理学的新前沿》（New Frontiers in Forensic Psychology）是一部全新的取证心理学书籍系列，它带来了该领域核心及新兴主题的最新研究，对取证心理学中的新调查领域进行了全面回顾，并对现有研究课题提供了新视角。该系列包含原创著作，鼓励作者探索未知领域、进行跨学科评估，并在可能的情况下突破。该系列对于取证心理学、犯罪学和社会政策领域的高年级、研究生、研究人员和从业人员来说是不可或缺的资源。\n\
    \n# 纵火与点火的新视角\n\n人类与火的使用关系\nFaye K. Horsley\n\n# 取证实践中的风险评估\n\nDavid Crighton\n\
