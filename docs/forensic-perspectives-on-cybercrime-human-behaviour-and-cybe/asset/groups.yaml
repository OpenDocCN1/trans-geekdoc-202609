    # Culture 5


    # Context


    Culture has been referred to as ''a slippery and ubiquitous concept'' (Birukou,
    Blanzieri, Giorgini, & Giunchiglia, 2009). It is a concept that it could be argued
    people easily recognise but struggle to vocalise. This chapter discusses the cultures
    that exist in an organisation and the national culture(s) that the organisation
    within, along with sub-cultures that may influence how an individual behaves in
    relation to cybersecurity.


    # Organisational culture


    As discussed throughout this text, humans are both the victims and instigators
    of cybercrime. This can create a multitude of challenges for organisations, in
    the form of both unintentional and intentional threats. For instance, AT&T employees
    took bribes to plant malware on the company''s network, resulting in a data breach
    (Cimpanu, 2019). Part of the reason that organisations are at risk of cybercrime
    is that internet technologies is a fundamental aspect of their business practice.
    Nine out of ten UK businesses and eight out of ten UK charities have some form
    of online presence, including bank accounts, customer data, or online payment
    processes (Department for Culture, Media and Sport, 2022). Even if an organisation
    protects itself from external online threats, it still likely employs individuals
    who themselves make use of the internet, and as are a potential threat. An example
    of this would be the case of a member of the Air National Guard in the USA who
    was arrested in relation


