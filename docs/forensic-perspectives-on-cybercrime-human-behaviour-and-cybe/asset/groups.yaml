    Seebruck（2015）的工作一致，说明了黑客身份的复杂性，以及试图构建能够总结黑客态度和行为的画像所面临的挑战。令人深味的是黑客自己对“黑客”一词表示沮丧，因为它涵盖了如此广泛的活动和身份，以至于毫无意义（Thackray
    等人，2017）。这反映了黑客对刻板印象和媒体对黑客描绘更广泛的不满——例如电视剧《火线调查》（NCIS）中被黑客社区称为“两个傻瓜，一个键盘”的著名场景，两个角色试图同时在同一个电脑键盘上打字来阻止网络攻击。这一场景可能是为了描绘“流”（flow）的概念，这在媒体描绘黑客和网络安全专业人员时似乎是一个热门概念。流是指个体完全投入某项任务时感受到的毫不费力的行动状态，并失去时间感和对干扰的感知（Csikzentmihalyi,
    1990）——这种状态在运动中被称为进入状态。Brewer（2001）认为，流状态是人们参与黑客活动的原因之一，并将黑客动机分为四个主题：i) 黑客的冲动，ii)
    好奇，iii) 控制和注意力，iv) 认可和群体归属。此外，Brewer（2001）建议，当黑客满足以下条件时，流可能发生在黑客活动中：i) 感知到控制交互，ii)
