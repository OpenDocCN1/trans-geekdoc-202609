    recurrent theme in cybersecurity. Sharing knowledge on different techniques is
    one of the main ways of interaction on hacking forums (McAlaney, Hambidge, Kimpton,
    & Thackeray, 2020), although it should be commented that this does not necessarily
    come with an endorsement that they then attempt to use that technique themselves.
    Indeed, many times the tone of the discussion is how forum users – typically those
    with less experience – should not attempt to use these techniques, may be caught
    and prosecuted. Nevertheless, it is inevitable that some individuals will take
