    # 80 Culture


    four control modes: strategic, tactical, opportunistic, and scrambled. Under the
    strategic control mode, several goals are tackled; there is abundant time available
    to meet these goals; there is the opportunity for an elaborate evaluation of the
    outcome; and actions are selected based on models and predictions. The tactical
    control mode has some similarities, but greater constraints. The goals that the
    organisation is trying to achieve be more limited; the time available may be adequate,
    not abundant; and actions are selected based plans and previous experiences. Next,
    the opportunistic control mode can have one or competing goals, with just adequate
    time to achieve these goals and the opportunity for a concrete evaluation of the
    outcome. In this control model, actions are selected based habit and associations.
    Finally, in the scrambled control mode, the organisation is trying to achieve
    one goal, which might not be relevant to the required tasks. There is inadequate
    time to achieve this goal, the evaluation of the goal is rudimentary, and the
    selection of actions is random.


    Aoyama, Naruoka, Koshijima, and Watanabe (2015) applied COCOM to the management
    of a defence team in a cyber handling incident, noting that the control style
    changes during an incident, often unintentionally, moving from strategic to scrambled.
    This occurs through several mechanisms. For example, in the strategic control
    mode there are fewer cases of role ambiguity, but as the control mode moves to
    opportunistic or scrambled there is greater ambiguity, with individuals being
    unsure what their exact role should be in response to that incident. Similarly,
    communication is rare in a strategic control mode, less rare in the tactical control
    mode, frequent in the opportunistic control mode and confused in the scrambled
    control mode. This shift in behaviours and decision-making style under pressure
    is consistent with psychological research into cognition, specifically the use
    of heuristics and cognitive biases. As discussed in Chapter 2, this refers to
    when individuals make quick decisions based on limited information and prior assumptions.
