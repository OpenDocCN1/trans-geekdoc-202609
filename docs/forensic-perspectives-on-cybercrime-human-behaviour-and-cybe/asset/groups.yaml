    Identifying motivations of hackers is more difficult than conflicting reports
    and studies into the personality and demeanour of those involved in hacking. For
    example Woo (2003) observed high levels of narcissism and aggression in hackers,
    whereas Platt (1994) noted that as group hackers appeared to be quite amiable.
    Similarly, Bachmann (2010) states hackers appear to prefer rational thinking styles
    and problem solving, which contrasts the image—albeit curated by hacking group
    themselves—of hackers as unpredictable anarchists (Coleman, 2014). This perception
    of hackers as socially maladjust malcontents is partly due to the way in which
    hackers sometimes interact with each other. When looking online at discussions
    around hacking and activism, it is evident that many users communicate in an aggressive
    way (Olson, 2012). However, this may just be the way in which these groups communicate.
    Online interactions have been criticised as prone to several specific interpretations.
    For example, Poe''s Law has been described as an adage that any parodic or sarcastic
    statement made will be taken as sincere, unless the author''s intent is made explicit
    clear (Aikin, 2009). Nevertheless, in some cases it seems cyberattacks on some
    individuals and organisations are a case of displaced aggression (Pedersen, Bushman,
    Vasquez, & Miller, 2008). Motivations can also be fluid, and sometimes conflicting
    motivations for the same group or collective have involved in attacks. For instance,
    the distinction between targeting an organisation to address a perceived social
    injustice and doing it for personal enjoyment (i.e. for thelul) became a reason
    for in-group conflict in Anonymous (Coleman, 2014). In addition, more than one
    motivation could be present in the same individual. Whilst the members of Anonymous
    could be considered to be primarily motivated by activism, it has been reported
    that some members of the group also engaged in credit card fraud as a means of
    income. Of course, caution should also be taken when categorising hackers based
    on self-report of their identity and motivations. Presenting oneself as an ideologically
    motivated hacker fighting the greed of a large corporation is more socially acceptable
    than being a criminal who steals money. This reflects the observation by Rogers
    (2010) that those who engage in cybercrime cope with the cognitive dissonance
    this creates in four ways:


    +   - Using euphemistic language that minimises and distances actions

    - Blaming their actions on social pressures and claiming that, in the case of
    group actions, their individual contribution was minimal

    - Minimising or disregarding the negative consequences of their actions

    - Vilifying and dehumanising their targets, and stating that they deserved to
    be attacked'
