    of online services that provide comparisons between countries and how they score
    on these dimensions (e.g. https://www.hofstede-insights.com/product/compare-countries/).
    The model has been criticised on several points, such as being based on samples
    within some countries (such as IBM employees) and not representative of the general
    populations of those countries (Shaiq, Khalid, Akram, & Ali, 2011). Vignoles et
    al. (2016) also comment that the model does not capture the diversity within cultures,
    although this is a criticism that could be applied to other models of culture.


    Overall, both organisational culture and national culture are important influences
    on behaviour in cybersecurity – not just the behaviour of the intended targets
    of cyber-attacks, but also who are behind them. Organisational culture is something
    that organisations can, in theory, exert influence over improve cybersecurity
    practices. Governments have arguably less influence over the national culture
    of a country; but there remains the potential for culture change to be introduced
    to reduce the harm caused by cyber-attacks. In the case of both organisational
    and national contexts the challenge is the complexity of cultures, and the risk
    of unintended consequences from attempting to change these cultures. These issues
