    ## 44 攻击者


    最后，还有一种刻板印象，认为黑客社交无能，或者比普通大众更容易处于自闭症谱系。这种刻板印象应当以批判性的观点来看。Rogers（2010）指出，社交技能可以有多种形式，在现实生活中可能不擅长社交的人在某些方面可能社交。黑客论坛中明显的社交网络是复杂且微妙的（McAlaney
    等人，2020），而那些在在线和线下都使用社会工程技术的黑客展现了高超的社交技巧。尽管如此，关于黑客是否比其他人更容易经历心理障碍，以及如果是，是否是这种障碍导致了个人参与黑客活动，仍然存在争论。Kirwan
    和 Power（2013）认为，在判断一名犯罪者是否表现出心理障碍时，通常会考虑三个因素——不适（discomfort）、功能障碍（dysfunction）和偏离（deviance），他们注意到这些因素很难应用于实际案例。不适指的是个体是否正在经历可能作为其行为促成因素的痛苦。如果他们没有感到不适，但行为异常，那么这可能是心理障碍的指标；如果他们感到不适，但没有表现出心理痛苦的迹象，他们也会被视为异常。这是否可以应用于网络犯罪分子是复杂的。例如，一个黑客行动主义（hackivist）对大型跨国公司的行为感到不适，可能会使用黑客技术对其造成伤害。在此过程中，他们表现出旨在减少自身不适的行为，但所涉及的行为本身是非法的。功能障碍指的是一个人是否能有效管理他们的日常生活。如所述，某些黑客可能没有完全参与主流社会，他们通常与黑客世界的其他人保持着丰富且广泛的社交关系。在网络犯罪分子的案例中，他们利用技能和知识产生收入——尽管这是非法收入。最后，偏离指的是任何形式的反常行为。这同样很难容易应用于网络犯罪，因为其演变迅速，而且对数字技术感兴趣的人的正常行为对于不理解这些技术的人来说可能非常异常。例如，现已成为伦理黑客的凯文·米特尼（Kevin
    Mitnik）年轻时曾入狱，当时控方错误地声称可以通过对着电话吹哨来发射核武器（Burkman, 2002）。总体而言，在判断网络犯罪分子是否表现出任何形式的心理障碍方面，面临的挑战与传统犯罪者面临的一样多。


