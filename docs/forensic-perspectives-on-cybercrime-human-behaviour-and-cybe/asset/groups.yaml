    ## 受害者学与韧性 4


    #### 背景


    网络安全泄露通常被认为是具有技术性质的，然而，它们不可避免地影响了个人。最明显的例子是个人通过某种银行账户泄露损失了资金。然而，还存在其他形式的网络受害化。例如，在社会工程攻击中无意中导致组织网络泄露的员工可能会感到羞愧和内疚。这将在第六章中进一步讨论；他们还可能因为参与攻击而受到组织的惩罚。即使没有指责任何个人，组织的员工也可能因为发生泄露而感到更加焦虑和脆弱。更广泛地说，组织和系统的网络泄露会破坏公众对社会技术系统的信任，包括在线购物（可能影响未来的销售）或电子投票（影响未来的参与度）。因此，网络犯罪具有多重社会影响，超出了对目标受害者的直接伤害。尽管如此，与传统犯罪形式相比，受害者学研究仍然相对较少（Halder,
    2022）。


