    # Theories of cybercrime


    As Bossler (2017) observes, only a limited number of criminological studies relating
    to cybercrime have been published in the top criminology journals, which Diamond
    and Bachmann (2015) have attributed to criminologists’ lack of familiarity with
    the online cybercrime ecosystem. Maimon and Loudback (2019) note that much of
    the research on cyber-dependent offenders is based on student or organisational
    samples, which primarily conduct low-level cybercrimes, and are not a representative
    sample of the many and varied profiles of cybercriminals. The criminological theories
    that have been applied to cyber dependent crimes include the General Theory of
    Crime ( Gottfredson & Hirshi, 1990), Social Learning Theory (Akers, 1973), Social
    Control Theory (Hirshi, 2017) and deterrence theories (Gibbs, 1968).


    The General Theory of Crime distinguishes criminality (the inclination or tendency
    to criminal behaviour) and crime (the actual act by which the law is broken).
    Gottfredson and Hirshi (1990) note that a crime can only take place when the propensity
    for crime coincides with an opportunity to commit a crime. Given the number of
    opportunities to commit crime that we typically encounter daily, it is the criminality
    of the individual that becomes the key factor. Gottfredson and Hirshi (1990) argue
    that this self-control is typically learned in early life. There is evidence to
    support this relationship between self-control and criminality against offline
    offenders (Pratt & Cullen, 2000), however research relating to online offenders
    is more marked (Marcum, Higgins, Ricketts & Wolfe, 2014). This proposed relationship
    is also part of Social Control Theory (Hirshi, 2017), which has been described
    as one of the turning points in the history of criminology (Costello & Laub, 2020).
    In contrast to criminological theories that focus on delinquency, Social Control
    Theory instead focuses on the restraints and circumstances that prevent delinquency.
    The theory states that criminality comes from an individual having a lack of intimate
    attachments, aspirations, and moral beliefs that bind people to mainstream, legitimate
    lifestyles. This is an interesting point to consider in relation to cybercrime.
    As will again be discussed as part of Chapter 3, individuals who become involved
    in cybercrime often do as part of a group. Trust relationships between the members
    of cybercriminal groups, even if they do not know each other’s real-world identity.
    Hacking forums appear to be important sources of self-esteem, self-identity,'
  - '[PAGE 30]


    # 18 Introduction to cybercrime


    and social relationships to forum members, and analyses of hacking forums, albeit
    surface web ones, suggest that members are concerned with questions of morality
    McAlaney, Hambidge, Kipton, & Thackray, 2020).


    Social learning theory in relation to crime (Akers, 1973) refers to how behaviour
    is reinforced through social processes. This is related to Bandura’s (1977) social
    learning theory, but with a focus on operant conditioning as the driver of criminal
    behaviour. Operant conditioning, also known as instrumental conditioning, states
    that behaviour is positively reinforced with some type of reward is likely to
    be repeated, whereas behaviour is punished and will less likely to be repeated.
    Negative reinforcement can also occur, where the frequency of a behaviour is increased
    through the removal of a negative stimulus (Skinner, 1963). For example, if a
    child refuses to eat a certain food item at mealtimes, and the parent encourages
    and removes that food item, then reinforcement may occur where the child is more
    likely to refuse food in future. As, Akers (1973) suggests that individuals become
    involved in the long term depends on their initial experiences of criminal activities,
    as well as their interactions with others who are engaged in criminal activities.
    If they are punished because of these actions then their involvement in criminal
    activity becomes less likely, but if they are rewarded their involvement becomes
    more likely. It is possible to envisage how these processes operate in relation
    to cyberspace. As noted, there is a lack of understanding and public awareness
    of many forms of cybercrime, something that may also be applied to some elements
    of law enforcement (Halder, 2022). Legislation pertaining to cybercrime is often
    outdated, and not fit for purpose (Mishra, 2022, #9918). As the people who get
