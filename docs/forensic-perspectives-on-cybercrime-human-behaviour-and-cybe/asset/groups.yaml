    ## 攻击者 3


    ### 攻击者的类型与动机


    正如 Chng, Lu, Kumar 和 Yau (2022) 所言，“黑客”一词在过去被用来暗示黑客由一个群体组成。目前已提出了几种攻击者的分类法和类型学。例如，Seebruck
    (2015) 提供了一个模型，将攻击者归类为追求声望、娱乐、意识形态或利润。这并不意味着缺乏技术技能是威胁的指标。正如第2章所示，技术技能并不要求更简单的黑客形式。同样，较高的技术水平似乎与更复杂的黑客形式有关。


    ## 攻击者类型


    Seebruck 模型中确定的几个领域是公众可能熟悉的，另一些则较陌生。


    - 利润：那些为了经济利益而进行黑客活动的人，例如访问银行账户或信用卡。

    - 黑客行动主义者（Hacktivists）：为了意识形态目的实施网络攻击，例如抗议他们认为不可接受的公司或政府。首个有案记录的黑客行动主义案例是1995年意大利艺术家发起的，他们为了抗议核测试关闭了法国政府网站（Milan,
    2015）。

    - 匿名者（Anonymous）：该集体在 2000 年代和 2010 年代通过一系列高关注度事件崛起，包括与科学教会的冲突（Knappenberger,
    2012）。该组织以佩戴盖·福克斯面具作为符号闻名，这一形象源自漫画小说《V 的仇》（Moore, 1982-1989），后在2005 年被拍成电影。匿名者作为一个黑客行动主义小组值得关注，因为他们的在线活动导致了线下聚会，包括每年
    11 月 5 日举行的“百万面具游行”，该日期是盖·福克斯试图炸毁英国议会上院的纪念日（BBC News, 2016）。近期，匿名者对入侵乌克兰的行为发动了攻击，包括关闭俄罗斯国家新闻网站（Pertull,
    2022）。

    - 报复：指的是在感知受到他人不公正对待后，协助进行网络攻击。这种类型的威胁通常与不满的员工有关，并在第 6 章中进行进一步讨论。


    声望和娱乐是参与黑客活动较少为人知的原因。出于声望的动机，人们注意到黑客论坛讨论的主要主题之一是知识，用户在其中分享专业知识并提供


