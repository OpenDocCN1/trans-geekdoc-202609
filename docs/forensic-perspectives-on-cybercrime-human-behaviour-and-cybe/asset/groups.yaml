    # 行为改变预防 95


    - 对抗（Confront）——抑制盲目活动、提醒后果、制造摩擦、提供多视角

    - 欺骗（Deceive）—— 增加劣质替代方案、偏向过去经验的记忆、安慰剂、欺骗性视觉化

    - 社会影响（Social influence）—— 唤起互惠情感、利用公开承诺、提高用户行为可见性、实现社会比较

    - 恐惧（Fear）——使资源稀缺、缩短距离

    - 强化（Reinforce）——即时提示、环境反馈、诱发共情、潜意识引导


    这些类别为改进网络安全提供了多种方法。例如，对用户选择的密码提供替代方案，可以帮助解决用户选择易于记忆但不够符合系统要求的密码的问题（例如，建议用户将密码改为‘Gr23nfly!’
    而不是‘Greenfly’）。尽管听起来相当有威胁性，但抑制盲目活动的机制通过提示个人在继续之前停下来思考某个操作，可以是有效的，特别是当他们可能在没有太多意识思考的情况下行动时。Konstantinou、Karaban
    和 Karapanos (2019) 举出的示例是一个系统，通过向社交媒体用户展示如下类型的通知来抑制虚假信息的无意传播：“我们估计该文章包含虚假信息的概率为
    90%。”通过这样做，鼓励个人表现得像一个“真的科学家”（例如，深度思考），而不是“认知吝啬者”（即立即得出结论）。同样，在社会技术系统中使用摩擦可能是一个简单的操作，例如当用户尝试点击来自该组织外部的电子邮件链接时，出现一个确认提示。研究文献中也有在网络安全背景下应用助推（nudge）之方法的案例。例如，Harbach、Hettig、Weber
    和 Smith (2014) 将助推理论应用于智能手机应用程序的下载，以帮助用户理解为什么赋予应用 权限可能是危险的。


    助推中还使用了其他机制，这些可能适用于网络安全，尽管对于任何行为改变策略，都应该考虑潜在的无意后果。正如所讨论的，恐惧可以作为一种助推，通过增加人们对网络攻击是真实且真正的威胁的感知，但如果只提供恐惧感而不提供任何关于如何规避威胁的信息，可能会适得其反。Gutek
    和 Winter (1990) 认为，对用户表现产生过大情感影响的恐惧诉求会有负面影响。社会影响可能是塑造行为的强大因素，正如第 5 章讨论组织文化时提到的那样。然而，不当应用基于社会影响的助推机制存在风险。例如，在鼓励组织员工在每位员工都有平等公平机会完成的任务上竞争时，启用社会比较可能是有益的。但是，公开分享哪些员工是钓鱼邮件受害者的比较可能不会产生积极的情绪，并与“任何组织都不可能完全避免网络攻击”的思想冲突。同样，基于欺骗的助推机制可能是有效的，但可能不受公司员工的欢迎。通常情况下，人们对他们认为试图操纵其行为的行为反反
    (Steindl, Jonas, Sittenhalen, Trautt-Mautsch, & Greenberg, 2015)。


    COM-B 模型 (Michie et al., 2011) 为理解使行为有效需要哪些条件提供了一种方法。它认为必须具备三个要素：能力（capability）、机会（opportunity）和动机（motivation）。该模型能力和机会影响动机与行为之间的关系，而不是行为本身。该模型还指出能力和机会会影响动机，因为如果个人相信他们可以执行某项行动，他们就会动力这样做。相反，如果一个行为被认为难以实现，个人尝试去做的动力就会减少。此外，还会形成正向和负向的反馈循环，例如这可能会提高一个个人的技能水平（能力），并以此增加他们对任务的动机。同样，如果个人没有改变机会的能力（例如在稳态系统中），他们参与某种行为的动机可能会减少。最后，模型指出个人在任何给定情况下都可能有执行大量行为的能力和机会，但倾向于只考虑其中的极少数。这种选择可能是意识的，也可能是无意识的。结果是，个人可能更有动力做出错误的选择，仅仅是因为它更熟悉或更符合习惯。与讨论的所有其他行为改变理论相比，COM-B
    模型最密切地包含了认知、道德和真的科学家形式的决策内容，这些形式分别指的是快速的、很大程度上更有理性和更全面的决策制定。


    COM-B 将干预措施（旨在改变的活动）与政策（负责当局采取的能够实现或支持干预措施的行动）区分开来。这已被纳入行为改变轮盘 (Michie, van Stralen,
    & West, 2011)。通过将政策作为行为改变轮盘的一部分，可以认为 COM-B 是与文化最对齐的行为模型。例如，通过包括财政措施在等政策，该模型承认了中小企业在做出网络安全实践决策时经常经历的限制之一，即金钱和资源
    (Fagble, 2023)。同样，行为改变轮盘将立法作为一个政策类别。文化和行为在某种程度上受到法律的塑造。虽然存在国际法律公约（如欧盟的《通用数据保护条例》），但尚无与互联网用户权利相关的通用法律。Halder
