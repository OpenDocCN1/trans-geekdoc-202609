    ## Culture 85


    the success of phishing emails that are based on some expression of authority.
    This is typically done by framing the phishing email as being from some type of
    government organisation, such as the FBI or tax revenue, with a threat of legal
    action if the recipient does not click on a link or open an attached file. Similarly,
    the dimension of benevolence could influence how likely scams based on charity
    appear to be successful. It has been argued the Schwartz model provides a fluid
    and detailed approach that recognises the overlap in cultural dimensions. Despite
    this, it does not appear to be a model that is widely used in the cybersecurity
    research literature.


    Instead, the most popular cultural model that appears to be used in cybersecurity,
    and in business more broadly, is Hofstede’s model (Hofstede, Hofstede, & Minkov,
    2010). This model proposes six dimensions of culture, as follows:


    - Power distance – how the gap is between the people in power and the public.

    - Individualism versus collectivism – whether people place emphasis on the individual
    well-being and success, or they put put emphasis on the well-being and success
    of their friends, family, and wider community.

    - Masculinity as femininity – the extent to which traditional gender roles are
    present within the culture.

    - Uncertainty avoidance – the degree of risk that a culture can tolerate, a culture
    with high uncertainty avoidance will try to avoid anything that might have a risk.

    - Long-term orientation – the extent to which a culture plans for the long-term
    future.

    - Indulgence versus restraint – how much emphasis the culture places on having
    fun, which could also be considered in terms of how conservative a culture is.


    As with other cultural models, there is a lack of research into how the dimensions
    identified by Hofstede’s model could be applied to cybersecurity beliefs and behaviours.
    Nevertheless, it is possible to speculate that some of the impacts might be. For
    instance, members of a culture that is in uncertainty avoidance would be considered
    less likely to take risks in opening emails from unknown senders. Similarly, an
    organisation in a culture with a high degree of long-term orientation could be
    expected to invest more time and resources into identifying threats and ensuring
    their cyber practices are safe and sustainable. However, there is a risk in making
    assumptions concerning the cause and effect of cultural dimensions on behaviour.
    Previously commented influences are complicated, and for many people are not limited
    to influence from a single culture. Indeed, the popularity of the Hofstede model
    may in part be due to its relative simplicity, along with the existence


