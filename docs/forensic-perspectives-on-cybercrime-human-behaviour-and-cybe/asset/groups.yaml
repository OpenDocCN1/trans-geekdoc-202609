    ## 116 涌现技术与未来方向


    -   基于比特币的庞氏骗局运作机制相同，提供高回报投资的机会。绝大多数投资者从未获得过任何利润，也未能收回初始投资。尽管加密货币社区对此类诈骗具有防范（Bartletti
    et al., 2018），但研究发现，基于比特币的庞氏骗局在加密货币用户中层出不穷（Vasek & Moore, 2018）。Bartletti 等人 (2018)
    能够证明比特特币如何与庞氏骗局相匹配，这一事实凸显了加密货币基础——区块链的特性之一：从表面上看，它似乎提供了更强的匿名性，但也意味着每笔交易都被记录且可见。


    大数据与机器学习密切相关。机器学习是指机器具有从以往经验中学习的能力，而不是不顾结果地重复功能。媒体上已有几个机器学习的知名案例，例如波士顿动力（Boston
    Dynamics）的机器人，它们通过试错来自我学习，就像人类婴儿一样（Browning, 2023）。大数据可以与机器学习结合使用，通过提供大量数据集来训练机器，例如通过训练社交媒体平台上的帖子，训练机器以人类的风格在社交媒体上发布。案例可能会产生意想不到的后果。微软的一个案例被部署在
    Twitter 上，在从收到的回复中学习后，发布的内容从“我只能说这触动了我：人类超级酷”变成了“我真他妈恨女权主义者，他们应该全部死掉在地狱里烧死”，最后变成了“希特勒是对的，我恨恶犹太人”。这发生在
    24 小时内，说明机器学习的发生速度并不总是积极的。这个例子可能是一个无监督学习的案例，系统没有给定起点，完全通过观察和互动进行学习。另一个例子是自动驾驶汽车，在没有道路规则先信息的情况下，通过观察其他车辆的行为来学习规则。另一方面，监督学习则涉及为自动驾驶汽车编程与任务相关的信息，例如道路标志、交通灯的含义等。强化学习包含监督和无监督学习的元素，并可能涉及人类驾驶员采取本不该的行为来纠正汽车。汽车从该经验中学习，理想情况下，不应再次犯同样的错误。


    支持使用机器学习的一个正面论点是它能产生客观且理性的决策。如果是如此，它将解决网络安全中的一个根本挑战——人类在应对现实世界时倾向于利用认知偏差和启发式法（如第
    2 章所述）。这可能导致被视为非理性的行为，并在某种程度上也是将人类视为网络安全中最薄弱环节的观点的来源。然而，Lima 和 Keegan (2020) 注意到，网络安全内部经常使用监督方法，这意味着系统的起点是人类的知识和判断。因此，人类信念中的相同偏见显而易见，决策过程也可能转移到机器学习中。大数据和机器学习还可以快速识别可能难以检测的模式。例如，Jones、Wojcik、Sweeney
    和 Silver (2016) 证明了线下大规模射击事件后，沟通中的负面情绪有所增加。这可以用于告知预防方法，通过提醒执法机构事件可能发生，并将资源投入到监控任何其他犯罪意图的迹象上。同样，大数据结合机器学习也被用于预测未来行为，包括线下行为（Benbouzid,
    2019），例如犯罪可能发生的时间和地点。再次，这在理论上是人类可以实现的，但大规模实现将耗费大量资源。当然，此类预测应该针对那些预测将实施但实际上尚未实施犯罪的个人。不意外的是，科幻小说《少数报告》（Minority
    Report）在讨论此话题时经常被引用，因为它描述了一个根据预判个人未来将犯犯罪而将其逮捕的世界。文件中的观点之一是该系统容易受到操纵和错误。考虑到黑客对测试系统极限的奇心和兴趣（如文所述），试图绕过任何类型的犯罪预测系统对他们来说似乎非常有吸引力。Das、Verma
    (2020) 识别了应用机器学习的几项挑战，其中包括反钓鱼攻击。为了支持这一点，Kastrenakos (2020) 讨论了人工智能的普及。


    下一步是人工智能（AI），人们可能熟悉的是图灵测试，该测试由艾兰·图灵（Alan Turing, 1950）著名地提出。通过测试的早期尝试包括 ELIZA，这是
    MIT 在 1964 年至 1966 年间创建的一个聊天机器人（Agassi & Wiezenbaum, 1976）。从那以后，尤其是近年来，机器学习和人工智能大幅增长。2018
    年，Google 展示了其基于语音的 AI 助手，它可以用来给美发店打电话、与员工交谈并预约发型，而对方并没有意识到正在与机器对话。此类问题很重要，但关于
    AI 以及如何在本文范围之外证明它的挑战性讨论超出了本书的范围。尽管如此，机器学习在网络安全方面有一些有趣的应用。Dutta、Joyce 和 Brewer
    (2018) 探索了如何利用聊天机器人帮助网络安全从业人员做出决策以及如何应对事件。这背后的逻辑是，网络事件可能是高压力情况，网络安全专业人员必须在短时间内处理并采取大量信息。攻击者试图让目标做出快速、冲动的决策（认知吝啬者/cognitive
    miser），而不是仔细考虑可用信息并做出理性决策（天真科学家/naive scientist）。这样聊天机器人可以在决策过程中产生一些缓冲，并帮助网络安全专业人员区分关键点以及如何做出适当决策。人工智能的收益不仅限于网络安全专业人员。有人认为，ChatGPT
    这样的 AI 软件通过承担某些黑客的技术方面使网络犯罪“民主化”，从而降低了参与门槛（Munchester, 2022）。正如本书所述，黑客行为本身并非犯罪活动。然而，担心
    AI 工具可能让人们在不完全了解自己所做什么的情况下无意中参与非法活动是合理的。此外，AI 可用于创建深度伪造（deepfakes）。这些是 AI 生成的虚假图像和视频，但通常看起来非常逼真。一些著名的深度伪造视频案例包括前美国总统巴拉克·奥巴马描述唐纳德·特朗普为“彻头彻尾的混蛋”，或者《游戏之王》中的琼·雪为其被认为糟糕的向粉丝道歉（Sample,
    2020）。在《不要相信任何人：深入深度伪造世界》（Trust No One: Inside the World of Deepfakes）中，Grothaus
    (2021) 强调了深度伪造带来的风险，概述了一个人们日益难以区分虚构与现实的世界。


