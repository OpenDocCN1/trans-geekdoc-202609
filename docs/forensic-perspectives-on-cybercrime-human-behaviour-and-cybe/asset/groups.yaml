    ## 行为改变与预防 107


    例如 PWC、BAE、IBM、Symantec、RSA 和 Kaspersky，以及服务于较小企业的其他公司，以及如 Bulletproof 这样提供渗透服务的专业公司（Button,
    2020）。预防和调查也越来越多地由志愿者部门承担，例如通过网站为人们提供监控摄像头（CCTV）和报告潜在事件的机会（Button, 2020）。更具主动性的志愿者团体承担了各种网络私刑主义的形式，例如在
    919eater.com 上，他们试图通过与诈骗者接触来浪费他们的时间，并防止他们诈骗真正的受害者。这些私刑者小组较为极端的例子之一是被称为“恋童癖猎人”的群体，这些群体在线上结识儿童，目的是暴露试图与他们进行性活动的恋童癖者。小组成员对峙据称为恋童癖者的视频被发布在社交媒体平台上，据
    2018 年报道，仅英国就有超过 75 个这样的小组（Evans, 2018）。（2020）观察到，对这种新的私人安全系统缺乏理解和监管。也有人认为，某些国家网络犯罪公司的持续存在是因为警察对网络犯罪的努力不足（Lusthaus,
    Klelemans, Leukfeldt, Levi, & Holt, 2023）。


