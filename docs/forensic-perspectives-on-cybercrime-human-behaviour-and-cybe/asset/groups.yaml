    web and the dark web lie beneath the surface web, which could be described as
    the normal, everyday internet that most people are familiar with. One of the most-known
    tools used to access the dark web is The Onion Router (Tor), which provides a
    web browser through which dark sites can be accessed. Despite the negative connotations
    associated with Tor and use of the dark web in general it is important to note
    that use of Tor is not illegal. Indeed, the software was developed by the United
    States Naval Research Laboratory, for the purpose of protecting online American
    intelligence communications (Lawrence, 2014). The software is used for many purposes
    beyond would be considered criminal activity, such as for example by journalists
    reporting from oppressive regimes who wish to protect themselves (Bartlett, 2024).
    Nevertheless, the dark web has garnered a near-mythical status of being a lawless
    and sinister online space where any act of depravity can be found. It is the case
    however the dark web and Tor have been used to disseminate extreme materials such
    as child pornography, likely in the belief by those creating and sharing materials
    that the technology reduces their risk of being identified.


    The cyberspace ecosystem revolves around money. Increasingly, these financial
    transactions make use of cryptocurrencies another technology that has risen from
    the internet. This is a type of digital currency that uses cryptography to ensure
    secure and easily verifiable financial transactions. In contrast to mainstream,
    traditional banking cryptocurrencies are decentralised. There is no single agency
    or organisation that manages the cryptocurrency. This lack of regulation centralised
    has prompted wary reactions from governments across the world. For example, it
