    challenges in implementing these approaches in real-world settings. Nevertheless,
    we would argue that the recommendations put forward by experts with lived experience
    such as Hadnagy (2018) and Radcliffe (2023) are highly valuable, and provide insights
    that cannot necessarily be gained from the academic research literature.


