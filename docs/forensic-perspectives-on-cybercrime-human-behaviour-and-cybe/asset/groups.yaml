    # 32 Social engineering


    our social world. The key point identified by Hasleton et al. (2009) however is
    that we have evolved this system of heuristics and cognitive biases and continue
    because, more often than not, they provide us with an advantage. As will be discussed
    in greater detail in Chapter 6, this is something that should be recognised when
    attempts are being made to change human behaviour. In brief, behaviour change
    and prevention campaigns aim to stop humans from making any use of heuristics
    and cognitive biases are very unlikely to be successful.


    As noted by Workman (2008), many of the techniques used by social engineers are
    similar to those used within marketing. This is perhaps surprising. Both social
    engineering and marketing are based on the principles of persuasion put forward
    by Cialdini (2001). For instance, Happ et al. (2016) explored the role of the
    norm of reciprocity in social engineering, noting the norm of reciprocity is a
    very ingrained one. People will feel to return a favour, even if they did not
    invite the favour in the first place. In cybersecurity this reciprocity can take
    the form of the exchange of information (Tamjidamcolo, Bin Baba, Tamjid, & Gholipur,
    2013). Other cognitive processes are exploited by social engineers, such as confirmation
    bias (Nickerson, 1998). Many phishing emails appear in formats that match what
    we expect to see, such as the use of logos. This approach also utilizes the representativeness
    heuristic (Kahneman & Tversky, 1972), in which we are more likely to judge something
    as legitimate if it is familiar. As several ethical social engineers have noted,
    these biases can be exploited in offline settings as well. For instance, wearing
    a high visibility jacket and other suitable clothing can be used to gain access
    to a site, with renowned social engineer Jenny Radcliffe making use of this strategy
    to attend the Glastonbury music festival for free in her earlier days (Radcliffe,
    2023).


    # Social engineers


    Whilst the techniques used by social engineers have been studied (Mouton, Leenen,
    Mal & Venter, 2014), there is limited research on social engineers. Instead, knowledge
    about the life experiences and characteristics of social engineers primarily comes
    directly from autobiographical accounts, by which their nature may be biased.
    There have been several books written by social engineers, including Social Engineering:
    The Science of Human Hacking (Hadnagy, 2018) and People Hacker: Confessions of
    a Burglar for Hire (Radcliffe, 2023), as well as people podcasts that include
    interviews with social engineers, such as Darknet Diaries (Rhysider, 2017–). These
    sources provide valuable insights into the psyche of social engineers, although
    some have re-labelled the discipline from an ‘art’ to a ‘science’ (Hadnagy, 2011,
    2018), there remains a need for empirical research to better understand this population.
    Doing so will help'
