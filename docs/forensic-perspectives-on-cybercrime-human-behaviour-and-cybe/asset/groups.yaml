    ## 新兴技术与未来方向


    网络攻击者利用深度伪造（deepfakes）进行各种活动无疑具有巨大的潜力，包括制造虚假新闻、生成钓鱼邮件，并通过利用语音聊天机器人等技术实施其他直到目前为止需要人类攻击者才能完成的社会工程形式。这些问题促使
    Guitton (2020) 等研究人员将人工智能识别为一种新兴且可能重大的网络安全风险。


    目前已发现具体的案例，证明了机器学习和人工智能可以被攻击者利用。例如，Baki、Verma、Mukherjee 和 Gawali (2017) 演示了这些技术在电子邮件伪装中的作用。这指的是攻击者获取电子邮件账户的访问权限（例如在第3章中讨论的涉及
    Anonymous 和 HBGary 的事件），然后利用该账户内的邮件来学习该账户所有者的写作风格。攻击者还可以获取有关目标联系人的信息，以及之前对话发生的背景情况。这使得攻击者能够发送伪装成目标的新邮件，用于多种目的，包括进行通信、造成扰乱和不和谐、发送钓鱼邮件以及传播恶意软件。这种攻击完全可以通过人工努力完成，但这项任务可以通过人工智能在规模得多的水平上完成。换句话说，人工智能可能扫描目标所有的电子邮件和其他电子通信内容（如社交媒体帖子），并快速生成一封以目标风格编写的虚假邮件。Baki
    等人 (2017) 测试了伪装邮件，发现参与者区分真伪伪装邮件的能力接近其真实能力水平。此类研究凸显了个人和组织在尝试安全地使用计算机系统时所面临的不断演变的挑战。结合深度伪造等人工智能赋能的技术，攻击者手中拥有了越来越多的工具，用来寻找他们的目标。


    大数据、机器学习和人工智能也被用于理解和定位黑客。正如 Lima 和 Keegan (2020) 所指出的，在线黑客论坛和社交媒体账户产生了大量文本，还有关于黑客信息以及已发现的安全漏洞的共享。这些数据量远超任何人类在防止攻击的极短窗口内能够以现实方式进行监控和审查。此外，从理论上讲，大数据和机器学习方法可以用于识别计划进行攻击的个人或群体。此外，该方法还可以用于更好地理解黑客群体内部的结构和流程。Lippmann
    等人 (2016) 在其对社交媒体和 Reddit 帖子的研究中尝试了这一点。他们的分析支持了 Benjamin、Zhang、Nunamaker 和 Chen
    (2016) 的早期研究，他们认为黑客社区内部往往存在领导者和有影响力的人物。这与黑客群体自身的声称形成对比——此类群体通常会说他们没有领导者（Olson,
    2012）。最近，Marin、Shakarian 和 Shakarian (2018) 证明机器学习可以用于识别暗网论坛上的黑客。然而，Lima 和 Keegan
    (2020) 指出了在使用大数据和机器学习识别和预测黑客行为时面临的若干挑战。首先，黑客词汇频繁变化（如第3章中讨论的），不同论坛之间使用的表达方式存在差异。其次，缺乏“真值”（ground
    truth）数据集。在人工智能的背景下，真值指的是分配给训练机器学习模型的数据集中的标签，用于将新输入连接起来并验证其性能（Levowitz, Levina,
    & Lifshitz-Assaf, 2021）。换句话说，真值是通过直接观察和证据验证的已知真实、准确的信息。获取真值在许多领域都是一项挑战，但在涉及黑客时可能尤为困难。毕竟，这是一个往往倾向于掩盖身份和动机的群体。这并不是局限于机器学习的问题。例如，媒体对网络犯罪和战争的报道也面临着挑战（Lee,
    2015），特别是在验证事件是否发生，以及如果发生了，究竟发生了什么方面。情报机构和其他政府机构也可能在防御性和进攻网络安全领域使用人工智能，但并不意外的是，关于此类实践的信息有限。


