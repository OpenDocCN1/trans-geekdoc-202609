    # 42 Attackers


    broader criminality were stealing from a large company may be seen as more acceptable
    than robbing an elderly female; or murdering a bank employee in an armed robbery
    is viewed as far more ‘acceptable’ than sexually abusing and killing a child.
    Chiesa, Ducci, and Ciai (2008) describe hackers in terms of the belief that systems
    which have been breached should not be damaged, data should not be stolen or modified,
    that information should be shared with other members of the hacking community,
    and that access to the system should be given to all. This is consistent with
    research that found people who identify as hackers have mixed opinions on what
    is acceptable in terms of hacking, although it has been noted there is greater
    consensus on the view that cybersecurity gaps should be exposed, if not exploited
    (Thackary et al., 2017). This reflects the frustrations expressed by hackers whose
    large organisations have basic gaps in their cybersecurity (Chua & Holt, 2016),
    despite having the resources to easily address these issues (Gode & Cruise, 2006).
    Further there are complex relationships between motivation, systems, the type
    of hacker, and the type of attack committed. For instance, Holt et al. (2015)
    found that a perception that there are clear rules on what is acceptable online
    is predictive of being less likely to engage in website defacement, but not predictive
    of other types of cyber-attack. Similarly, a bit of individuals are able to view
    any information about them that is held by government, school, or business was
    found to be predictive of viewing website defacement and accessing government
    servers, but not predictive of a view that it is ok to compromise military servers.


    Chng et al. (2022) propose a further framework for hacker types, motivation, and
    strategies, echoing the point that cybersecurity research to date has focussed
    more on the technological aspects of cybersecurity than the human element. The
    framework overlaps with Seebruck’s (2015) complex model but suggests additional
    types of hacker including old guards (established and experienced hackers), insiders
    (internal members of an organisation), petty thieves, crowdsources, and crime
    facilitators. Crime facilitators relate to CaaS, as discussed in Chapter 1. The
    model deliberately does not include the term of hacker, identified by Barber (2001)
    and used to refer to hackers who intentionally cause damage, on the basis that
    this is a broad concept that could be applied to several types of hacker. Chng
    et al. (2022) note that the terms they reflect the terms that have been used in
    the literature, including nation states (Hald & Pedersen, 2012) and online sex
    offenders as criminal types. The latter inclusion is interesting. Even on forums
    and sites that identify themselves as being opposed to mainstream society there
    is often a quick and severe response to anyone who appears to be endorsing or
    seeking child pornography (Coleman, 2014).'
