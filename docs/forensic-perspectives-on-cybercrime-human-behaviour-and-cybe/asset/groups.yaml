    # Series Foreword


    We are delighted to introduce the new book by Professor John McAlaney, Dr Terri
    Cole, and Professor Peter J. Hills entitled Forensic Perspectives on Cyber-crime
    for our New Frontiers in Forensic Psychology series. This book explores the psychological
    factors that influence the behaviour of all those involved in cybersecurity, drawing
    upon the research literatures in relevant areas including forensic, social, and
    cyber psychology.


    Computers and the internet are used in almost every field of human society in
    homes, schools, colleges, factories, or businesses. These digital technologies
    provide many benefits to individuals and organisations; however, they also facilitate
    criminal activities. Cybercrimes take place online and take over electronic communications
    or information systems. This book begins with an introduction on the rapidly evolving
    ecosystem of cybercrime. It moves onto discussing the social engineering processes
    that are used to psychologically manipulate people to make security mistakes or
    give away sensitive information. The motives for why individuals involved in hacking
    are explored and a review is presented of the results from the research literature
    on risk factors of being a victim of cybercrime, along with the concept of resilience.
    National and organisational culture are considered in relation to how cyber attackers
