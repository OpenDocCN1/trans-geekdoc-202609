    # Social engineering


    # Context


    Social engineering within the context of cybersecurity refers to the use of psychological
    manipulation to influence the target into conducting an action that contributes
    to the breach of a system. An example of this that many will be familiar with
    phishing emails, which make use of a range of psychological manipulations to encourage
    the target to click on a link or to open an attachment, as the use of urgency,
    emotional appeals, or authority. Examples of this would be emails that claim to
    be from a tax authority, stating that the recipient is in breach of some tax law
    and will face punitive measures if they do not urgently act. This will typically
    invoke the target being asked to click on a link or open an attachment, both of
    which will contain malicious software that will infect the device and system the
    person is using. Reason why phishing is popular as a social engineering technique
    is that they require little effort or cost to the attacker, and only require engagement
    by one in the target population to potentially be successful. In other words,
    it not matter if a target organisation has 10 employees or 100,000 employees –
    only one employee must click on the malicious link or file for the attacker to
    potentially access the system. Technological approaches such as firewalls and
    anti-virus software can block some of the risks posed by phishing emails, but
    not all of them. In addition, phishing exists are one example of social engineering,
    but other types of attack exist, as will be discussed in this chapter.


    Social engineering has been argued to be the single biggest threat in cybersecurity
    (Salahahdine & Kaabouch, 2019). Social engineering is not limited to cybercrime.
    For example in 2016, employees in several fast food restaurants in'
  - '[PAGE 39]


    # Social engineering 27


    the USA were targeted and tricked into smashing the restaurant windows on the
    basis of believing there was a gas leak within the building (Almay, 2016). There
    is limited published academic research on social engineering, and very little
    about the life experiences and characteristics of social engineers. There are
    some books written by high profile social engineers which discuss their perspectives
    on social engineering and the experiences they have had led them into social engineering.
    One of the more well-known examples of this is Social Engineering: The Art of
    Human Hacking, authored by the high-profile social engineer Chris Hadnagy in 2011.
