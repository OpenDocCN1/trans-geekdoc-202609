    ## 60 受害者学与心理韧性


    个人（如员工）在点击钓鱼邮件中的恶意链接时，往往并没有意识到这会使组织暴露在风险之中。同样，如果一名员工在无意中通过向社会工程工程师提供有关公司当前使用的采集服务状态的信息，从而助长了社会工程学攻击，这可能被视为内部威胁。人为失误案例也可能产生内部威胁，例如，某日本金融公司的一名员工在彻夜畅饮后，丢失了一个存有天神崎市（Amagasaki）居民信息的USB优盘（引自：BBC新闻，2022年）。防止无意内部威胁面临的挑战之一是该问题的规模。正如前面提到的，公司中只需有一名员工产生瞬间念头并点击钓鱼链接，攻击就可能成功。另一方面，蓄意的内部威胁是指个人故意采取对组织造成伤害的行为。这包括第2章中讨论的报复行为或工业间谍活动。CERT国家内部威胁中心（CERT
    National Insider Threat Center）对这两种内部威胁提供了详细定义：


    > [内部威胁是指当前或前任员工、承包商或业务伙伴，他们拥有或被授权访问组织的网络、系统或数据，并故意超出范围或故意利用访问权限，其方式负面影响了组织信息、信息系统或员工的机密性、完整性、可用性或健康状况。内部人员是指当前或前任员工、承包商或其他业务伙伴，他们拥有或曾拥有授权访问组织的网络、系统或数据，并通过其行为/在无恶意的情况下造成了损害，或实质上增加了未来组织信息或信息系统的机密性、完整性或可用性发生严重损害的概率。(Brackney
    & Anderson, 2004)]


    威胁所带来的风险和伤害可能会因为检测缺失、响应缓慢和补救政策不一致而加剧（Ko, Divakaran, Liao, & Thing, 2017）。尽管如此，仍有观点认为，内部威胁是组织的一种被低估且未得到充分解决的网络安全威胁（Ponemon
    Institute，2020年）。据报道，由于远程办公的兴起，对这种风险的担忧在新冠肺炎肺炎期间也有所增加（Tessian, 2020）。联合国报告称，疫情期间恶意邮件增加了600%（Leader,
    2020）。然而，Kemp, Bu-Gil, Moneva, Miro-Linas 和 Diaz-Castano (2021) 观察到，疫情期间在线犯罪减少之间的关系是复杂且微妙的。例如，据观察，在疫情高峰期间，由于企业忙于应对日常挑战，发生的网络攻击可能未被发现和报告（英国数字、文化、媒体和体育部，2021年）。


    正如 Bossler 和 Holt (2013) 所指出的，由于几个问题，很难感知到网络受害者的规模。首先，受害者可能并没有意识到自己是受害者。例如，一次成功的社会工程学攻击的具体实施手段，可能是某公司永远无法确立的，前提是他们甚至意识到了攻击已经发生。其次，那些意识到自己受害的人可能不会报告事件，因为不相信当局会采取任何行动，或者认为自己会因为落入骗阱或被钓鱼邮件骗而受到审判。有研究建议，如果男性认为自己在遭受网络攻击后正经历“受害者责备”，他们可能会退出刑事司法系统；而女性往往因为担心遭受受害者责备而完全不举报犯罪行为（Halder,
    2022）。这可能是个人的一种合理担忧——据观察，当局往往认为网络诈骗的受害者应该自负其责（Villiers, 2009）。


