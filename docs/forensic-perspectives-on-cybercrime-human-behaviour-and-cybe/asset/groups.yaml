    # Introduction to cybercrime 19


    deterred from engaging in the relevant behaviour (Gibbs, 1975). Revisions to the
    original theory include informal sanctions such as social disapproval, self-disapproval
    (i.e., feelings of shame), and moral inhibition (Piquero & Tibbetts, 1996). More,
    deterrence theory has included perceived risks and costs of both informal and
    formal sanctions as the decision-making process an individual uses when considering
    whether to engage in criminal activity (Pratt, Clevens, Daigle, & Madsen, 2006).
    This theory has been applied within cybersecurity, with D''Arcy & Herath (2011)
    commenting that it is one of the more widely used theories in the field. Nevertheless,
    they also note that the evidence base for the application of deterrence theory
    to cybersecurity contains mixed results, in part due to methodological inconsistencies
    in how sanctions have been conceptualized and measured.


    Routine activity theory (Cohen & Olson, 1979) has been stated that crime is likely
    to occur when there are three elements: a motivated offender, an attractive target,
    and an absence of capable guardianship. As will discussed in greater detail in
    Chapter 3, there are many varied motivations for individuals to engage in criminal
    acts. There is also a surplus of attractive targets, which within the context
    of routine activities refers to a target that the attacker perceives to be vulnerable
    and from whom something can – relatively easily obtained. The lack of capable
    guardianship in the offline context could mean that for instance the lack of security
    guards in a store to deter shoplifting. For example, the IT staff within an organisation
    could be guardians of the workplace IT systems. Similarly, the use of firewalls
    and up to date software could be considered as a form of technological guardianship.
    In both cases this guardianship is only effective if the human undertakes certain
    required actions to engage with those guardians, or indeed not to circumvent restrictions
    imposed by guardians, such as bypassing software updates. These tensions whose
    responsibility it is to ensure protection from cybercrime reflect the larger perception
    of humans as the weak link of cybersecurity. This is discussed in greater detail
    in Chapter 4.


    Protection Motivation Theory (Rogers, 1975) has also been applied to cybersecurity
    behaviours (Hassandourt & Techatassanoortorn, 2020). This theory relates to how
    people respond when they feel threatened, and based on two elements – how likely
    they think they are to be exposed to that threat, and how that threat could be
    if it occurred. Based on these factors, the individual decides whether they need
    to take action to avoid this threat. For example, we may recognise that it is
    a common experience to catch the flu, but many people perceive this as having
    a low severity, as is being unlikely to cause serious harm. A plane crash on the
    other hand is something that potentially has a'
