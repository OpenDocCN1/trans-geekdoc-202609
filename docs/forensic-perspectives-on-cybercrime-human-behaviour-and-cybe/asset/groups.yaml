    - Priority of entire game vs priority of market: when the situation becomes intense,
    management often lose their ability to foresee the long-term goal.


    The findings of Aoyama et al. (2015) are largely consistent with the conceptualisation
    of resilience in the previous chapter, as they incorporate short-term and long-term
    adversity, and highlight the importance of learning from past events and predicting
    future events. However, the findings also demonstrate the role of human factors
    in cyber resilience, and a system that is intended to be resilient can become
    derailed when human capacities and cognitions are not considered. The psychological
    factors that created issues in the training exercise observed by Aoyama et al.
    (2015) include attentional demands, cognitive overload, emotional arousal, role
    ambiguity, and decision making biases. Aoyama, Naruoka, Kojijima, and Watanabe
    (2015) discuss these findings in relation to the Context Control Model (COCOM),
    in which Hollnagel and Woods (2005) operationalised the concept of control. This
    model describes


    # 80 Culture


    four control modes: strategic, tactical, opportunistic, and scrambled. Under the
    strategic control mode, several goals are tackledled; there is abundant time available
    to meet these goals; there is the opportunity for an elaborate evaluation of the
    outcome; and actions are selected based on models and predictions. The tactical
    control mode has some similarities, but greater constraints. The goals that the
    organisation is trying to achieve be more limited; the time available may be adequate,
    not abundant; and actions are selected based on plans and previous experiences.
    Next, the opportunistic control mode can have one or competing goals, with just
    adequate time to achieve these goals and the opportunity for a concrete evaluation
    of the outcome. In this control model, actions are selected based on habit and
    associations. Finally, in the scrambled control mode, the organisation is trying
    to achieve one goal, which might not be relevant to the required tasks. There
    is inadequate time to achieve this goal, the evaluation of the goal is rudimentary,
    and the selection of actions is random.


    Aoyama, Naruoka, Koshijima, and Watanabe (2015) applied COCOM to the management
    of a defence team in a cyber handling incident, noting that the control style
    changes during an incident, often unintentionally, moving from strategic to scrambled.
    This occurs through several mechanisms. For example, in the strategic control
    mode there are fewer cases of role ambiguity, but as the control mode moves to
    opportunistic or scrambled there is greater ambiguity, with individuals being
    unsure what their exact role should be in response to that incident. Similarly,
    communication is rare in a strategic control mode, less rare in the tactical control
    mode, frequent in the opportunistic control mode and confused in the scrambled
    control mode. This shift in behaviours and decision-making style under pressure
    is consistent with psychological research into cognition, specifically the use
    of heuristics and cognitive biases. As discussed in Chapter 2, this refers to
    when individuals make quick decisions based on limited information and prior assumptions.
    In doing so they are employing the cognitive miser approach, as opposed to the
    naive scientist approach in which individuals make more comprehensive and rational
    decisions (Fiske & Taylor, 2008). The strategy that individuals use to determine
    which of these cognitive styles is most appropriate to the situation is referred
    to as being a modest tactician (Kruglan-1996). It is interesting to note that
    cyber-attacks such as phishing emails and other social engineering attacks are
    designed to push the targets from a naive scientist style of decision to a cognitive
    miser one (Montanez, Golob, & Xu, 2020), and in so increase the probability of
    human error occurring (Bullee, Montoya, Junger, & Hartel, 2017). As it could be
    observed that there are parallels between the failure of resilience at a micro,
    individual level, and the failure of resilience at the macro, organisational level.
    It also suggests that behaviour change strategies that are designed to reduce
    susceptibility to social


    # 81 Culture


    engineering attacks may be beneficial in promoting resilience in organisations,
    as there is a shared goal to encourage individuals to use the more comprehensive,
    naive scientist approach towards decision making.


    As commented, it is not only large companies who are victims of cyber-crime. It
    has been reported that start-up companies in the UK have been targeted by cyber-attacks,
    through the setting up of nearly identical websites and tricking employees with
    social engineering to make erroneous payments (Burgess, 2015). While a small,
    start-up company may not have the same funds as a large company, the relative
    ease in which a social engineering attack can be conducted can mean that it is
    still a cost-effective strategy to target them. This is consistent with Routine
    Activities Theory (Cohen & Felson, 1979), in an ‘absence of capable guardianship’
    increases the likelihood of a victim being targeted. This is because in the context
    of cybersecurity this concept of capable startup company is less likely to have
    sufficiently qualified and experienced IT staff who can protect against attack.
    This is also evident in small to medium sized enterprises (SMEs), where companies
    lack the time, money, and resources to invest in cybersecurity, despite understanding
    how important this is (Fagule, 2023). In addition, it has been noted that there
    can be different approaches to cybersecurity in SMEs among different cultures.
    For instance, it has been noted that a barrier to cybersecurity in SMEs can include
    international organisational factors, budget, management support, and attitudes
    (Kabanda, Tanner, & Kent, 2018). Of course, as outlined in Chapter 1, very large
    and well-resourced companies are not immune to cyber-attacks, with many cases
    of high-profile technology companies falling victim.


    It is interesting to note that some of the problems faced in organisations and
    businesses have parallels in cybercrime. One of these is the malware known as
    Zeus, amongst other names, which was created by a hacker who went the name Slavic.
    Zeus is one of the most widespread and damaging pieces of malware known to, and
    has been used fraudulently gain access to bank accounts and to compromise accounts
    including the Bank of America and NASA (Rhider, 2022). Slavic took advantage of
    the growth of internet banking when it started to become mainstream in the late
    2000s to introduce malware into people’s computers, where it could collect personal
    information, including bank account login details. However, the malware went further
    than that. It also turned any computer that it infected into being part of a botnet,
    meaning that computer would now be used to conduct further acts of cybercrime.
    It has been commented that Slavic chose the final name of Zeus for the malware
    that Zeus is the king of the Greek gods in Greek mythology (Rhysider, 2022). Slavic
    approached his activities very much in the style of an entrepreneur.

