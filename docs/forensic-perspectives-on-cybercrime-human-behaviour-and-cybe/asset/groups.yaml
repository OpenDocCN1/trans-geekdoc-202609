    behaviours. For example, Selim (2019) observed that there is a relationship between
    culture and self-disclosure. That, people in some cultures are more likely to
    share information about themselves to others than in other cultures. Many social
    engineering attacks contain an element of information gathering (open-source intelligence,
    or OSINT) about the targeted individual or organisation. As such individuals who
    more share information about themselves may be at greater risk of social engineering
    attacks. As was highlighted in Chapter 2, the information that is sought by social
    engineers is often that, on the surface, can appear to be trivial. However, commented
    by Bagh, McKenna, and Fitzsimmons (2002) we should be cautious in making assumptions
    about the relationship between culture and self-disclosure on the internet, where
    anonymous communication is possible.


    There have been several models proposed that have attempted to characterise the
    different components of culture. One of the first models of culture was put forward
    by E. T. Hall (1976). This model describes culture in terms of high and low contexts,
    with in this case referring to anything that shapes the communication within the
    culture, such as social norms, shared history, and the environment. A high culture
    context is one in which people tend to have close, long-standing relationships.
    Edward T. Hall and Mildred R. Hall (1990) identify Japan as being an example of
    one of the highest culture contexts, mentioning that people in culture rarely
    say what they think and instead use a complex system of strategic politeness.
    They also note that Germany is an example of a low culture context, where people
    are more direct in their communications. There is a lack of research on how if
    social engineers and other cyber-adversaries tailor their attacks to the culture
    of the target, but it would seem like, a more direct approach to information gathering
    (e.g., calling a query to what PDF software they use, as per the example given
    in Chapter 2) may be more effective in Germany than Japan, as in the latter there
    could be more resistance to disclosing information to a stranger.


    An alternative model was put forward by Schwartz (2012), which proposes four cultural
    categories: openness to change, self-transcendence, self-enhancement, and conservation.
    Contained within these are 10 dimensions, one of which is security. This refers
    broadly to people’s sense of security in terms of safety and well-being but does
    of course appear to be highly relevant to cybersecurity. Other dimensions in this
    model may also be relevant. For example, the dimension of power is something that
