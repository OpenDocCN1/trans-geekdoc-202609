    ## 4 网络犯罪简介


    (Grabosky, 2016)。黑客攻击也可被用于创建僵尸网络，其中其他设备被劫持——通常在所有者不知情的情况下——并被用于进一步的黑客活动（Kremlin
    & Parker, 2017）。这可能包括分布式拒绝服务 (DDoS) 攻击，通过涌入大量的连接请求，使网站和其他在线服务离线。网络犯罪的规模难以想象。网络犯罪分子的大部分工作涉及使用软件来实现其目标。例如，网络犯罪分子每天进行
    800 亿次自动扫描，旨在识别有漏洞的目标（Lewis, 2015）。近几十年来网络犯罪的增加（Furnell, Emm, & Papadaki, 2015）与
    20 世纪 90 年以来全球线下犯罪下降形成对比（Tseloni, Mailley, Farrell, & Tilley, 2010）。此外，正如第 3 章将讨论的，网络犯罪中潜在嫌疑人的范围可能比线下犯罪更广泛。作为一个基本示例，任何如人攻击等人际间犯罪都需要犯罪者和受害者在时间和空间上处于同一位置。因此，嫌疑人仅限于在案发时可能出现在犯罪物理现场的人。然而，网络犯罪可以由规模更大的嫌疑人池实施，这些人可以位于世界上任何地方。例如，一个
    10 岁的男孩在发现 Instagram 的一个重大安全漏洞后获得了 10,000 美元（Lee, 2016）。同样，正如第 4 章将讨论的，文献中关于网络犯罪最可能受者的研究存在不一致的结果。


    与任何行为一样，参与网络安全事件的所有人员的行为都可能受到他们所处文化的影响。这可能与其个人所属组织的文化以及所有组织或部分组织运营的国家文化有关。在英国，文化、媒体和体育部（2022）的一份报告指出，最常见的威胁向量是钓鱼攻击。员工是否点击钓鱼邮件中的恶意链接或附件将取决于多个国家、组织和文化因素，包括他们对风险的感知以及对预期生产率的感知（即处理电子邮件的速度）。该报告还发现，54%
    的企业在过去的 12 个月内采取了行动识别网络安全风险，尽管访谈发现，管理层的理解会导致责任转嫁给外部提供商或内部同事。这是一个问题，公司的管理层设定了所有员工应对潜在网络威胁的基调。这些网络安全文化因素代表了在组织内部改变风险行为方面面临的复杂挑战，正如第
    5 章所讨论的。


    鉴于人类行为和认知在网络安全事件中的作用，人们对应用行为改变和预防策略的有效性有了日益增长的认识。在线环境为鼓励人们改变行为提供了独特的机会，但也引入了新的挑战。许多在线操作（例如员工在组织内使用工作电脑）可以被监控和记录。这可以深入了解可能导致员工成为网络犯罪受害者的因素。同样的技术也可用于提供个性化的、数据驱动的行为改变和预防策略。然而，正如第
    6 章将讨论的，其他领域的营销活动有许多案例被证明是无效或适得其反的。因此，需要使用基于证据的策略来促进行为改变和预防网络犯罪，这也反映了在线和线下犯罪之间的区别。


    最近，大数据、机器学习和人工智能 (AI) 已被试图实施网络犯罪的人和试图防止网络犯罪的人共同利用。例如，在线技术产生的个人数据极其庞大，Facebook
    在 2019 年每天产生的数据相当于超过 2000 亿页印刷文本（Brandwach, 2019）。这些丰富的数据可能为犯罪分子和网络安全专家提供了实现目标的手段。大数据的挑战之一是其规模超过了传统方法可以分析的范围。这就是机器学习和人工智能在网络安全中日益应用的地方。人工智能的一个潜力是可以做出无偏见的决策，这在对抗社会工程攻击时可能非常有用。已经证明，在网络安全中使用的机器学习和人工智能技术中，人类偏见仍然显而易见（Lima
    & Keegan, 2020）。这些新兴技术引起的影响和问题将在第 7 章中探讨。


    网络安全领域面临的一个持续性挑战是，技术在设计上被设定为使用户尽可能匿名。例如，暗网由无法通过标准网络浏览器访问的网站组成。人们对暗网通常有意识，但难以完全想象其规模。这部分归因于暗网与深网
    (deep web) 的混淆。深网是指以在线格式可用，但未被搜索引擎使用的网络浏览器所索引的信息。深层数据的示例包括大学的学生记录等信息。此类信息是在线状态，相关人员和学生可以通过组织的内网访问，但通过
    Google 搜索无法找到这些信息。另一方面，暗网是指深网中被故意隐藏的部分，只能通过在线工具访问。深网和暗网都位于表面网之下，表面网可以描述为大多数人所熟悉的正常、日常互联网。访问暗网最著名的工具之一是洋葱路由
    (The Onion Router, Tor)，它提供了一个可以通过其访问暗网网站的网络浏览器。尽管 Tor 和泛指暗网带有负面含义，但重要的是，使用 Tor
    并不是非法的。事实上，该软件是由美国海军研究实验室开发的，目的是保护美国在线的情报通信（Lawrence, 2014）。该软件被用于许多被认为是犯罪活动之外的用途，例如在压迫政权下进行报道并希望保护自己的记者（Bartlett,
    2024）。尽管如此，暗网已获得了一种近乎神话的地位，被认为是一个法外且阴险的在线空间，可以在那里找到任何堕落的行为。然而，暗网和 Tor 的被用于传播儿童色情等极端材料，这可能是因为创建和分享材料的人认为这种技术降低了他们被识别的风险。


    网络空间生态系统围绕钱旋转。越来越多，这些金融交易利用了加密货币，这是另一种从互联网兴起的技术。这是一种数字货币，使用加密技术来确保安全且易于验证的金融交易。与主流传统银行相比，加密货币是去中心化的。没有单一机构或组织管理加密货币。这种缺乏中心化监管引发了全球政府的警惕反应。例如，有建议美国政府正积极寻求限制在美国使用加密货币（Reynolds,
    2023）。加密货币通过名为区块链的技术运行，区块链使用分布式账本，所有交易都记录在多台计算机或节点上。第一个广泛使用的加密货币是比特币，它创建于 2009
    年。之后创建了其他加密货币，被称为替代币 (altcoins)。这些示例包括以太坊和莱币。加密货币通过货币交易所（通常被称为比特币交易所）交易，用户可以用加密货币交易其他数字货币或法定货币。加密货币具有许多优点，包括更快更便宜的跨境交易，以及为没有银行账户的人提供金融服务。由于缺乏任何中央监管或监督，它是网络犯罪分子喜欢的技术。更广泛地说，它们吸引了更重视发现新事物方法的广泛黑客文化——在这种情况下，是一个不包含传统银行中存在的各种问题、争议和不伦理商业行为的金融系统。加密货币还为个人提供了获利的机会。


