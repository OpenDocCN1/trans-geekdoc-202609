    ## 32 社会工程学


    我们的社会世界。然而，Hasleton 等人 (2009) 指出的关键点是，我们进化出了这套启发式算法和认知偏差系统，并一直保留它们，是因为在大多数情况下，它们能为我们提供优势。正如第
    6 章将详细讨论的那样，在尝试改变人类行为时，应该意识到这一点。简而言之，行为改变和预防活动如果旨在阻止人类利用任何启发式算法和认知偏差，成功的可能性非常小。


    正如 Workman (2008) 所指出的，社会工程师使用的许多技术与营销领域使用的技术相似。这或许令人们感到惊讶。社会工程和营销其实都基于 Cialdini
    (2001) 提出的说服原则。例如，Happ 等人 (2016) 探索了互惠准则在社会工程中的作用，注意到互惠准则是一种根深蒂固的准则。人们会想要报恩，即使他们起初并没有请求这份恩惠。在网络安全中，这种互惠可以以信息交换的形式存在（Tamjidamcolo,
    Bin Baba, Tamjid, & Gholipur, 2013）。社会工程师还利用了其他认知过程，例如确认偏差（Nickerson, 1998）。许多钓鱼邮件的格式符合我们预期的视觉内容，例如对
    Logo 使用。这种方法还利用了代表性启发式算法（Kahneman & Tversky, 1972），即如果某个事物是熟悉的，我们更倾向于将其判断为合法的。正如几位合理的社会工程师所指出的，这些偏差在线下环境中也可以被利用。例如，穿上高能见光背心和其他合适的服装可以用于进入某个场所，著名的社会工程师
    Jenny Radcliffe 在其早年时期曾利用这种策略免费参加了格拉斯拉斯里音乐节（Radcliffe, 2023）。


    ## 社会工程师


    虽然社会工程师所使用的技术已经得到过研究（Mouton, Leenen, Mal & Venter, 2014），但对社会工程师本身的研究非常有限。相反，关于社会工程师生活经历和特征的知识主要直接来自他们的自传叙述，而这些叙述可能带有主观偏差。社会工程师写过几本书，包括《社会工程学：人类黑客攻击科学》（Hadnagy,
    2018）和《黑客人：受雇窃盗的自白》（Radcliffe, 2023），以及包含社会工程师采访的播客节目，如《暗网日志》（Rhysider, 2017–）。这些来源为社会工程师的心理提供了宝有价值的见解，尽管一些人将该学科从“艺术”重新定义为“科学”（Hadnagy,
    2011, 2018），但仍然需要进行实证研究以更好地了解这一群体。此举有助于制定针对社会工程攻击的预防和缓解策略。它也可能提供一些方法，鼓励人们将道德社会工程视为一种合法的网络安全职业道路，有助于解决网络安全人才招聘危机（ISACA,
    2022）。为了支持这一点，人们注意到，来自非 IT 背景（如心理学）的学生所展示的许多技能与社会工程攻击中使用的技术特别相关。这与来自 IT 背景的学生通常展示的技能组形成对比，后者的教育更多侧重于网络安全的技术方面（Taylor
    et al., 2017），而不是对行为的考虑和深度分析。


    在理解社会工程师在网络犯罪生态系统中角色时，面临的挑战之一是术语。黑客（Hacking）广义是指为了设计之外的目的而使用系统。这本身并不意味着黑客行为就是犯罪的，尽管它具有此类内涵（Thackray,
    2019）。这种改变系统的概念可以应用于社会技术系统，因此包含了经常被社会工程师针对的人为元素。然而，我们认为“黑客”（hacker）通常是指基于技术手段的攻击，而社会工程被视为一个相关但独立的学科。这些不同类型黑客活动之间模糊的界限反映了黑客社区中更广泛的辩论和讨论，其中包括“黑客”是否还是一个有意义的标签（Thackray,
    Richardson, Dogan, Taylor, & McAlaney, 2017）。这些讨论由于对黑客的刻板印象和偏见而变得复杂，而这一问题也无济于此。例如，Woo
    (2003) 观察到黑客具有高水平的自恋倾向和攻击性，而 Platt (1994) 则注意到，作为一个整体，黑客看起来相当温和。


    正如文献中关于黑帽和白帽黑客的概述（McAlaney, Kimpton, & Thackray, 2019），出于犯罪目的实施社会工程行为的人（黑帽）与出于合法原因实施此类行为的人（白帽）之间存在区别。后者是渗透测试的一种，例如，公司可能会聘佣一名社会工程师来调查其访问该公司内部敏感数据的难易程度。再次，正如本章早期提到的，描述这种白帽社会工程方法的术语并不统一，此类人员被称为“道德社会工程师”。由知名的道德社会工程师（如
    Chris Hardy (2018) 和 Jenny Radcliffe (2023)）编写的故事展示了熟练的社会工程师能够轻而易举地实现目标。这些文本中反复出现的一个主题是目标公司往往对其保护自己免受此类攻击的能力过度自信。可以推测，这是因为我们组织通常将网络安全攻击等同于技术突破，而不是利用对人类进行欺诈和心理操纵的东西。事实上，个人持有的这些先入为主的想法正是社会工程师所利用的手段。


    作为理解社会工程师经历和动机的起点，我们可以考虑针对黑客的工作，尽管承认了社会工程与黑客之间的混淆。Seebruck (2015) 在第 3 章中详细讨论的循环模型识别了网络犯罪的五大动机：名声、娱乐、意识形态、报复和利润。在这些动机中，利润可能最适用于道德社会工程师，在生活中这是他们获得报的活动。然而，从道德社会工程师的叙述来看，似乎还存在名声和娱乐的元素。通常，人们会谈论他们在尝试进入某栋安全建筑时感到的兴奋感，以及成功后的成就感。我们认为在考虑道德社会工程时，背景中存在一个很少讨论的问题——道德社会工程师是否曾实施过违法行为。这与黑客的讨论有相似之处。这正是学术研究可以贡献的地方。例如，已发现黑客会对学术研究人员相对坦诚，只要他们信任提供的信息将得到妥善对待（Thackray
    et al., 2017）。


