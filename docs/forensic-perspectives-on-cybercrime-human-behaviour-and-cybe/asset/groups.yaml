    in cybersecurity. Sharing knowledge on different techniques is one of the main
    ways of interaction on hacking forums (McAlaney, Hambidge, Kimpton, 2020), although
    it should be commented that this does not come with an endorsement that they attempt
    to use technique themselves. Indeed, many times the tone of the discussion is
    how forum users – typically those with less experience – should not attempt to
    use these techniques, be caught and prosecuted. Nevertheless, it is inevitable
    that some individuals will take this knowledge and use it for malicious purposes.
    As such, empowering people with knowledge on how cybercriminals gives them greater
    insight and in turn ability to protect themselves, but in doing so may prompt
    others to explore criminal activities in such ways.


