  - "[PAGE 25]\n\n# Introduction to cybercrime 13\n\nAs noted, cybercriminal gangs\
    \ use of hacking tools that can be purchased on cybercrime black markets. There\
    \ has been a move within cybercrime Tang from being product-oriented to service\
    \ oriented, although the different temporal and spatial characteristics of the\
    \ online space creates challenges in comparisons to traditional, legitimate business\
    \ models (An & Kim, 2018). As such cybercriminals are highly dependent on closed\
    \ underground communities such as Hackforums and Crackingzilla. It has been observed\
    \ that the anonymity that is available in these cybercrime networks results in\
    \ different group structures than are observed in offline networks, such as the\
    \ Mafia (Brenner, 2003). While traditional crime structures are vertical, concentrated,\
    \ rigid, and fixed, cybercriminal group structures are more lateral, fluid, diffuse,\
    \ and evolve more rapidly (An & Kim, 2018). In addition, the popularity of different\
    \ products and services changes over time (An & Kim, 2018). Monitoring of these\
    \ marketplaces provides opportunities for threat intelligence and prevention strategies.\
    \ As offline criminal networks, these market places have occasion infiltrated\
    \ by law enforcement agents, with a view to shutting them down (Chen, Qi & Storey,\
    \ 2012). This reflects the broader cybercrime ecosystem, which has been proposed\
    \ to consist of cyber criminals, enablers who support the online operations, guardians\
    \ (law enforcement and IT professionals who strive to protect systems), and targets\
    \ (Kraemer-Mbula, Tang, & Rush, 2013).\n\nMcGuire (2012) makes a distinction between\
    \ disorganised groups of cyber criminals that communicate online but have no chain\
    \ of command (the swarm structure) and organised groups with a clear organisational\
    \ hierarchy (the hub structure). Hackers also have different levels of socialisation,\
    \ from small and intimate peers to the broader community of hackers (Macdonald\
    \ & Frank, 2017). Individuals who share information are central to both groups\
    \ (Holt, Bossler, & May, 2012), which is one of the ways in which novice hackers\
    \ learn new skills (Décary-Hétu & Dupont, 2012). Choo and Smith (2008) further\
    \ argue there are three types of cybercrime groups:\n\n+   * Traditional organised\
    \ criminals\n  * Using crime as a service (CaaS) models\n* Organised cybercriminal\
    \ groups (for example groups such as LulzSec)\n  * Distinguished from the previous\
    \ type by members having shared goals and communicating with each other, but without\
    \ necessarily revealing their identity\n* Ideologically and politically motivated\
    \ groups (for example Anonymous)\n  * Groups who engage in activism and may commit\
    \ crimes, but who are not necessarily criminally motivated"
