    ## 92 行为改变预防


    提高网络安全的行为改变概念是一个宽泛的话题，也是该领域一个公认的挑战。从计算和 IT 的角度来看，这个问题通常倾向于上述观点，即将人类视为问题所在，而非解决方案的一部分（Zimmermann
    & Renaud, 2019）。然而，许多行为改变的文献是基于社会心理学和健康心理学的研究应用的，这些研究通常采用更整体的方法，承认并理解人类行为的独特性性（Adams,
    Cost, Jung & Choudhary, 2015）。Adams 等人（2015）还观察到，人机交互中大多数行为改变方法都依赖于他所谓的“反思性思维”（reflective
    mind），即假设个人会对自己的行为进行仔细且深层的思考。这与之前讨论的启发式和认知偏差概念有关，并在考虑网络安全变化研究时提出了一个重要的点：可能是网络安全领域内通常使用的行为改变策略假设个人是“天真科学家”风格（即理性和深思熟虑），而网络攻击本身却迫使目标陷入“认知吝啬者”式的决策模式（即快速且浅层）。


    尽管健康心理学和社会心理学在行为改变方面有大量的证据支持，但在将其应用于网络安全时，仍需考虑方法论和理论上的问题。Davis, Campbell, Hilden,
    Hobbs 和 Michie（2015）认为，文献中报告的许多行为改变干预可能基于理论，但在许多研究中对该理论的应用非常糟糕。这与 Michie、van Stral
    和 West（2011）的观点相似，他们观察到行为改变干预往往看起来是一种常识方法，而非深度基于心理学理论。Davis 等人（2015）发现，跨行为领域的行为改变研究发现了
    82 种不同的理论。在这些理论中，有四个被发现是最广泛使用的：跨阶段变化模型（Prochaska, Johnson, & Lee, 2009）；计划行为理论（Aizen,
    1991）；社会认知理论（Bandura, 2003）；以及信息-动机-行为-技能模型（Fisher & Fisher, 1996）。


    这些理论之间存在重叠，且每个理论都包含似乎与网络安全相关的元素。跨阶段变化模型（Prochaska 等人，2009）指出，行为改变通过一系列步骤发生，包括前期考虑、考虑、准备、行动和维持。这种线性且按顺序的方法对于希望以有序方式引发行为变化的组织来说可能是理想的。然而，该模型确实假设一旦实现了预期变化，就不再需要进一步采取。这在网络威胁的情况下可能是不妥的，因为攻击的性质和攻击者是在不断演变的。计划行为理论认为，行为是态度、主观规范、感知行为控制和意图的结果。这种行为控制的概念与上述研究相一致，该研究将控制源（个人感知对其自身行为控制的程度）与网络韧性联系起来。它还与行为改变的
    COM-B 模型（Michie 等人，2011）有关，正如所述，该模型认为行为受到个人感知自身拥有的能力和机会的影响。最后，计划行为理论区分了个人执行行为的意图与行为的实际执行。正如进一步讨论的，这是一个重要的区分，因为研究证据表明，网络行为改变活动虽然成功提高了意识和知识，但随后并未产生行为改变。社会认知理论（Bandura,
    2003）也将能力作为一个组成部分，并将其与自我效能区分开来，自我效能涉及个人感知自己能够改变行为的程度。需要强调的是，个人的感知可能与其实际能力不匹配，事实上，许多基于社会认知理论的行为改变活动旨在追求那些他们可能感知为的对自身行动拥有更多控制权的目标受众。最后，信息-动机-行为-技能模型认为，行为是个人技能、知识和动机的结果。虽然该模型是为了理解健康行为而开发的，但它可能适用于网络安全行为，特别是通过“网络卫生”来描述保护性网络安全行为的方式（Nckubei,
    Mwansa, & Rocaries, 2020）。网络卫生是指个人为了确保计算机系统保持健康安全可以采取的实践和步骤（Kioski, Fotis, Nakos,
    & Mouridis, 2023）。这种对网络安全的重新表述可以被视为鼓励个人将网络安全视为一个他们投入其中的个人化问题，而不是仅仅是 IT 部门负责处理的事情。这可能有助于将健康心理学研究的广泛证据库应用于网络安全中的行为改变中，尽管这还有待观察。作为一个观察，似乎网络安全领域——或至少是那些背景主要为计算的人员——并没有充分理解心理学可以提供的知识和专业知识。这在一定程度上是因为具有计算背景的人对心理学存在误解，正如在对完成计算学位的学生教育中所提到的（Taylor-Jackson
    et al., 2020）。


    Bada 等人（2015）识别了用于指导网络安全行为改变的心理学理论。在这些文献中，计划行为理论和社会认知理论被发现都有使用。此外，理性行动理论（Ajzen
    & Fishbein, 1980）被识别为作为网络行为的基础。理性行动理论与计划行为理论密切相关，并认为个人有一种内部机制，其中意图的形成先于行为并在两者之间起到介作用。根据该理论，预期行为的心理需求是态度和感知规范。对感知规范的纳入与组织文化有关，因为它表明个人行为受到他们感知的规范的影响很大。Bada
    等人（2015）还注意到保护动机理论（Rogers, 1975）被作为某些行为改变策略的基础。该理论认为，个人是否采取保护行动取决于他们对威胁的感知以及他们对自己应对该威胁能力的感知。由于该理论与其他作为行为改变基础的心理学理论中的能力和自我效能概念重叠，Johnston、Sarkentin
    和 Sipoonen（2015）指出，在将保护动机理论应用于安全行为时，教育个人如何采取保护所需的步骤是重要的。换句话说，如果你向目标群体提供有关威胁的信息，你必须提供关于避免该威胁步骤的清晰说明。这与第
    4 章中关于术语和韧性的讨论一致。


    助推理论（Nudge Theory）近年来成为一种流行的行为改变策略。它旨在通过引导人们做出预期选择来改变行为，而实际上并不移除选择（Thaler & Sunstein,
    2009）。在此过程中，它可能会增加个人对其行为的控制感，这与与其他行为改变理论中包含的控制源概念有关。助推文献的优势在于，它通常包含了该理论如何应用的实际案例，事实上可以认为比其他行为改变理论更有针对性。Cara、Karapanos、Gonçalves
    和 Campos（2019）观察到，助推方法在人机交互（HCI）中变得流行，但有时应用不当。在对助推理论在 HCI 中应用的评审中，Caraban 等人发现了
    23 种助推机制，归类为六大类：


    - 促进 – 默认选项、退出政策、定位、隐藏、建议替代方案


