    ## 10 网络犯罪导论


    ## 诈骗


    网络犯罪反映了线下犯罪，特别是那些具有金融元素的犯罪，如诈骗。目前最常用的方法之一是钓鱼邮件，这些邮件可能包含多个元素，例如链接或文件，一旦打开，就会在计算机系统上安装恶意软件。此外，钓鱼邮件或在线消息可能被用于与目标建立个人关系以达到胁迫目的，例如情感诈骗中的案例。我们中的许多人都有收到此类邮件的经历，这些邮件由于其可疑的声明（如中彩票）和语法错误，很容易识别为钓鱼邮件；尽管与早期的版本相比，钓鱼邮件已变得更加复杂且更具针对性（Nurse,
    2015），但 Iuga、Nurse 和 Erola (2016) 指出，防止与钓鱼邮件相关危害的技术解决方案是有限的，这强调了需要更好地理解钓鱼邮件中“人”的因素。


    钓鱼也可能通过恶意网站发生。Facebook 小组曾被用于诈骗个人，一个名为“Total Wipeout Tour”的小组自称与某电视节目有关，尽管它附带了一份说明性声明确认事实并非如此（BBC
    News, 2016）。想要参与的个人被要求填写表格，提供其电子邮件地址、出生日期和 Facebook 个人资料。并没有请求任何财务或银行详情。因为参与这些邮件的人可能没有感知到任何威胁，这正如保护动机理论（Rogers,
    1975）所预测。然而，威胁仍然存在。向此类页面提供的信息可能是数据挖掘案例，其中收集的信息会被卖给营销公司。此外，该页面可能会提示个人分享并点赞它，收集用户，直到将其出售给某家公司并更改名称。这产生了一种欺骗，使得某家公司的声誉看起来比实际情况要好。


    ## 网络欺凌与在线骚扰


    网络欺凌是指通过电子手段进行欺凌的行为，尽管正如 Zhu、Huang、Evans 和 Zhang (2021) 指出的，这是一个相对新的研究领域。网络欺凌的一个成因素可能是儿童和青少年难以理解行为与后果之间的联系（Agastonson
    & Limber, 2018），这种现象可能会因网络去抑制效应（Suler, 2004）而加剧。这指的是个人可能认为在线互动不如线下互动那样真实。尽管如此，人们认为网络欺凌的影响可能比线下欺凌更糟，因为实施者可以匿名地在一天中的任何时间、从任何地理位置接触受害者（Hutson,
    Kelly, & Militello, 2018）。


    网络欺凌对目标群体的影响可能是广泛的，并导致抑郁、焦虑、情绪痛苦、自杀念头和自残、躯体不适、身体健康下降、旷勤、自尊心问题、犯罪行为增加以及物质滥用增加（illancourt,
    Faris, & Mishra, 2017）。网络欺凌是否构成犯罪因国家而异。在英国，没有专门涵盖网络欺凌的法律。相反，任何被起诉的罪行都必须诉诸于通用且往往过时的法律，例如《2003年通信法》，该法禁止发送具有“严重冒犯性或具有猥亵、淫秽或威胁性特征”的消息。进一步的法律复杂性在于，网络欺凌的实施者特别可能是未成年人，尽管当然，成人也可以是网络欺凌的策划者和目标。有人认为，COVID-19
    疫情期间向在线教学的转变增加了额外的网络欺凌风险，因为老师通常对课堂的直接控制较少，且网络摄像头的使用提供了更多获取目标图像以进行攻击目的的机会（Halder,
    2022）。


    还存在其他形式的在线骚扰，因为网络欺凌通常利用技术来促进同样在线下发生的有害行为。一个例子来自被称为“非自愿禁身者”（incels）的群体。这源于“自愿禁身”，指的是那些（主要是男性）尽管渴望伴侣，但认为自己无法找到浪漫或性伴侣的人。Lisa
    Sugiura 在《非自愿禁身者反叛：男权世界的崛起与针对女性的虚拟战争》（Sugiura, 2021）中记录了针对女性实施的许多且多样的厌视女性行为，包括在线和线下。高知名度的案例包括
    Jason Davison 案件案，他在 2021 年 8 月在英国普利茅斯枪杀了五个人。当时的媒体报道称，Davison 的动机源于网络上的意识形态，以及该运动中主张对女性实施暴力的“英雄们”（Morris,
    2021）。


    ## 服务化犯罪


    为了获取利益向网络犯罪分子提供黑客工具和其他类型的恶意软件的行为被称为“犯罪软件服务”（Crimeware-as-a-Service, CaaS）。网络犯罪分子将他们的专业知识、知识和对特殊工具的访问卖给那些没有能力或倾向实施网络犯罪的人。这种业务模式与合法业务中广泛使用的其他“即服务”（AAS）模型没有本质区别，例如软件即服务，公司并不直接拥有其所使用的软件，而是使用由外部公司提供的软件。对于网络犯罪分子来说，使用
    AAS 方法的益处与合法业务一样：准入门槛被消除了，个人可以专注于核心活动和目标，即使在网络犯罪的案例中，也可以获得客户支持。通过 Tor 访问暗网，人们可以发现许多广告，列出了诸如黑客攻取社交媒体账号、对指定目标进行
    DDoS 攻击或更改社交或大学成绩等服务。需要注意的是，在黑客和网络犯罪分子中，有人认为这些许多服务本身就是一种诈骗（Bartlett, 2014）。


    CaaS 被认为对政府和执法机构在很大程度上是见的（An & Kim, 2018）。人们在 CaaS 和犯罪行为之间进行了区分，前者被描述为“代办”服务，而后者被描述为“自助型”产品（An
    & Kim, 2018）。同样有人注意到对 CaaS 的研究不足（An & Kim, 2018），考虑到访问这些网络时涉及的方法论挑战和伦理考量，这并不意外。尽管如此，我们需要更好地理解
    CaaS。这些服务是网络犯罪生态系统的关键组成，了解如何破坏 CaaS 活动可能为该生态系统中的操作者制造障碍。CaaS 在网络犯罪生态系统中的作用将在第三章详细讨论。


    ## 网络犯罪生态系统


    网络犯罪业务系统随着时间的发展，人们意识到他们在编程、营销和技术平台开发方面的技能已经商业化（Hol, 2007）。有人评论说，这种业务模式实际上是非常专业化的（An
    & Kim, 2018）。Sood 和 Enbody (2013) 同意网络市场有三个关键要素——参与者、价值链和运作模式。An 和 Kim (2018)
    对地下网络提供的两种产品或服务进行了区分，尽管他们注意到文献中 CaaS 的定义和概念化并不相同。第一类是与攻击策略相关的产品或服务，包括钓鱼、暴力破解攻击、DDoS
    攻击和勒索软件。第二类攻击涉及针对和中和组织使用的预防措施，如防火墙或防病毒软件。有趣的是，产生社会工程学的产品和服务——即基于心理操纵的攻击——在地下网络犯罪网络中似乎很少交易（An
    & Kim, 2018）。


