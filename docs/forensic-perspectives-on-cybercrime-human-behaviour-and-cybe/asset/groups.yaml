    as the target, for a range of purposes including communication, causing disruption
    and disharmony, sending phishing emails, and spreading malware. This attack can
    be conducted entirely through human effort, but it is a task that could be undertaken
    on a far greater scale by AI. In other words, AI may be able to scan all the emails
    and other electronic communications (such as social media posts) by a target and
    quickly be generate a fake email that is written in the style of the target. Baki
    et al. (2017) tested masquerade emails and found that participants performed close
