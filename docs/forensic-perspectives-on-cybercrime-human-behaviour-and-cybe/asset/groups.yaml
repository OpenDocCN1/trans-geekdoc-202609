    Ransomware Malicious software that is designed to encrypt the data held by an
    organisation, preventing that organisation from accessing their own data until
    a ransom is paid and the attackers provide the decryption key.


    **Script-kiddie** A type of **hacker** who relies on software written by others
    to hack. Such an individual may be lacking in a fundamental understanding of the
    technologies they are using to enable their hacking activities.


    **Server** A computer program or device that provides a service to other computers
    or their users, such as for example a bank server that operates the software and
    systems that the staff of that bank use for their daily work activities.


    **Spear-phishing** A phishing **email** that is specifically targeted at an individual
    or individuals, such as the senior management of a company.


    **Tor (The Onion Router)**** Open source and free software that enables anonymous
    internet communication. Often used in association with the **dark web.**


    **Virtual Private Network (VPN)** Software that protects users by encrypting their
    data and masks the physical location of the device being used.'
