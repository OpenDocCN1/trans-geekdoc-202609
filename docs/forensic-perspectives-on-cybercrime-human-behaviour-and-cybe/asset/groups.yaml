    的黑客将 Zeus 引入了一种新的恶意软件 SpyEye。与 Zeus 相比，其初始版本非常糟糕，但售价为 400 美元。这产生了一场权力斗争，类似于两个竞争企业之间的斗争。出乎意料的是，Zeus
    和 SpyEye 都宣布 Zeus 将更名为 SpyEye。在事件发生期间，例如 Slavik 决定隐退（Rysider, 2022）。然而，合并从未真正发生。这个新的
    Slavik 版本 3 后来被称为 Gameover Zeus。这个新的恶意软件即服务（MaaS）版本最终由一名俄罗斯公民 Evgeny Mikhailovich
    Bagley 交付。在本文写作时，他仍在逃外，并被列在 FBI 的网络头号通犯名单（https://www.fbi.gov/wanted/cyber）上，提供
    300 万美元悬金以逮捕并定罪。此案例说明了第 1 章中提出的挑战之一，即某些国家的个人很难被该国以外的人员起诉。研究以更好地理解网络生态系统内部组织文化将是非常意义的，尽管此类工作确实面临许多挑战。


    组织尝试改进组织安全的一种方法是在内部发送自己的钓鱼邮件，例如互联网域名注册公司 GoDaddy 的员工曾接受一封关于奖金的假邮件测试（Longhi, 2020）。这引发了关于员工如何看待这种持续测试的问题，以及这可能对组织文化产生的影响。学术界还对员工对钓鱼邮件的敏感性进行了研究（Kearney
    & Kruger, 2016），测试了向公司内部成员发送以下钓鱼邮件的成效如何，该邮件在员工被要求点击的链接中故意拼写错误了公司名称。


    由于我们的后端安全系统发生意外变化，我们要求您今天验证您的用户名和密码。感谢所有已验证详细信息的人。


    发现 83% 的受访者在回复这封钓鱼邮件时提供了他们的用户名和密码。邮件中的情感和说服性元素包括合法性（信息来源是合法的）、权威性（信息由具有权威的人发布）、稀缺性（时间有限）和从同性（相信其他人已经完成了请求）。这些内容与社会心理学研究以及社会工程人员使用的利用类型相一致，正如第
    2 章所讨论的那样。关于行为改变和预防策略的进一步讨论将在第 6 章提供。


    ## 国家文化


    如果尝试定义一个组织的文化很困难，那么尝试在国家层面上定义文化甚至更加困难。但是，为了理解个人和组织的网络安全行为，这是必要的，因为所有这些行为都存在于更广泛的国家文化之中。在某些情况下，它们可能受到多种文化的影响，或者在跨国运营的情况下，必须了解如何在全球多个国家进行安全运营。这是在考虑任何单一国家是否具有单一文化，或者在线技术在人们感知自身以及与他人互动的方式上可能起的作用的角色之前。人们注意到，互联网可以为人们提供超越其自身文化的方式进行交流和行为的机会（Pflug,
    2011）。文化差异可能是细微的，并且在此之外，似乎也令人困惑。例如，西方媒体注意到，在 2022 年中国全国人民大会期间，中国主席习近平面前摆放了两杯茶，这被认为是一个意为之的行为，旨在传达权力信息（Bubalo,
    2023）。在评估网络安全威胁和设计预防及行为改变策略时，需要处理这些文化的复杂性和细微差别。还应该注意公司规模的不断扩大如何开始模糊组织文化与国家文化之间的界限——例如，2017
    年记录显示沃尔玛的营业额超过了比利时国（Belinchon & Moynihan, 2018）。


    ## 84 文化


    研究突显了国家文化影响网络安全行为的一些方式。例如，Selim (2019) 观察到文化与自我披露之间存在关系，即某些文化背景下的人比其他文化的人更有可能分享自己的信息。许多社会工程攻击都包含对目标个人或组织的信息收集（开源情报，或
    OSINT）。因此，那些分享更多信息的人面临着更大的社会工程攻击风险。正如第 2 章所强调的，社会工程人员寻求的信息在表面上可能是微不足道的。然而，根据 Bagh,
    McKenna 和 Fitzsimmons (2002) 的评论，在可以匿名通信的网上，我们对文化与自我披露之间的关系做出假设应当谨慎。


    已经提出了几种试图刻画文化不同组成部分的模型。文化模型之一是由 E. T. Hall（1976）提出的。该模型从高语境和低语境的角度描述文化，在这种情况下指的是任何塑造文化交流的因素，例如社会规范、共同历史和环境。高文化背景是指人们倾向于拥有长期密切的关系。Edward
    T. Hall 和 Mildred R. Hall (1990) 将日本确定为最高语境背景的示例，提到该文化背景的人很少说出他们的想法，而是使用一套复杂的策略性礼貌系统。他们还指出德国是低语境背景的示例，人们在交流中更加直接。目前缺乏关于社会工程人员和其他网络攻击者如何根据目标的文化定制其攻击的研究，但似乎，一种更直接的信息搜集方法（例如，致电询问他们使用何种
    PDF 软件，如第 2 章示例所示）在德国可能比在日本更有效，因为在后者，向陌生人披露信息可能会受到更多抵制。


    另一种替代模型是由 Schwartz (2012) 提出的，该模型提出了四类文化类别：对变化的开放、自我超越、自我增强和保护。这些类别包含了 10 个维度，其中一个就是安全。这广泛指的是人们在安全和健康方面的安全感，但显然与网络安全高度相关。该模型中的其他维度也可能相关。例如，权力维度是一个可以影响的


