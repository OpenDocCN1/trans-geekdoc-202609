    ## 网络犯罪简介


    个体被威慑而不再从事相关行为（Gibbs, 1975）。对原始理论的修订包括了非正式制裁，例如社会不认可、自我不认可（即羞耻感）和道德抑制（Piquero
    & Tibbetts, 1996）。此外，威慑理论还包含了个人在考虑是否参与犯罪活动时所采用的决策过程中，对非正式和非正式制裁的感知风险和成本也纳入了考量（Pratt,
    Clevens, Daigle, & Madsen, 2006）。该理论已应用于网络安全领域，D''Arcy & Herath (2011) 评论道它是该领域应用最广泛的理论之一。尽管如此，他们也指出，威慑理论在网络安全中的应用证据结果差不齐，这在某种程度上是由于制裁在概念化和衡量方面存在方法论上的不一致性。


    日常活动理论（Cohen & Olson, 1979）指出，当具备三个要素时，犯罪就可能发生：有动机的犯罪者、有吸引力的目标以及有效保护者的缺失。正如第 3
    章将详细讨论的那样，个人参与犯罪行为有许多多样的动机。此外还存在大量有吸引力的目标，在日常活动的语境下，这指的是攻击者认为具有脆弱性且可以相对容易从中获取某些东西的目标。在离线环境中，有效保护者的缺失可能意味着，例如商店缺乏保安人员来威慑偷窃行为。例如，组织内部的
    IT 员工可以是场所 IT 系统的保护者。同样，使用防火墙和更新的软件可以被视为一种技术保护形式。在这两种情况下，只有当人类采取某些必要行动与这些保护者互动，或者实际上确保不绕过保护者施加的限制（如跳过软件更新）时，这种保护才是有效的。这些关于谁负责确保不受网络犯罪侵害的紧张关系反映了人们认为人类是网络安全中最弱环节的观点。这将在第
    4 章中进行详细讨论。


    保护动机理论（Rogers, 1975）也应用于网络安全行为（Hassandourt & Techatassanoortorn, 2020）。该理论涉及人们在感到受到威胁时如何反应，并基于两个要素：他们认为自己暴露于该威胁的概率，以及该威胁一旦发生可能造成的严重程度。基于这些因素，个人决定是否需要采取行动来规避这种威胁。例如，我们可能意识到患流感是一种很常见的经历，但许多人认为其严重性较低，因为不太可能造成严重伤害。另一方面，飞机坠毁虽然可能导致非常严重的结果，但个人极极可能经历这种情况。当然，个体的特征和信念与这些过程有关。虽然大多数人可能不认为流感是一种威胁，但确实有一些免疫功能低下或患有其他健康问题的人，对他们来说，任何呼吸道感染都是严重的威胁。呼吸道疾病严重性的感知在新冠肺炎（COVID-19）疫情期间可能发生了变化，这凸显了更广泛社会环境的时间性变化如何影响对可能性和威胁的感知。同样，恐空症患者可能会认为飞行是最安全的旅行方式之一，但他们仍然会经历飞行体验并在情感上感到受到威胁。保护动机理论在网络安全行为中的应用将在第
    6 章中进行详细讨论。


    总的来说，这些理论具有一些共同点，如社会环境、自我控制、风险感知和自我认同。没有哪种理论可以被普遍接受并理解网络犯罪行为，尽管没有哪种理论是专门用来解释犯罪行为的。尽管如此，这些理论为如何预测、识别和预防网络犯罪提供了有用的见解，尽管在网络犯罪的心理方面仍需进一步研究。这包括更好地理解网络犯罪如何与离线犯罪有所不同。这可能是一个不断变化的过程，因为技术正在以无法预测的方式不断演进和发展。


