    # 62 Victimology and resilience


    if they are aware they are at risk. It has been found for instance that people
    do not tend to alter their use of social network sites even if they have been
    hacked (O''Connell & Kirwan, 2014). This could reflect a conflict between the
    motivation to protect oneself and the motivation to impression management. Impression
    management was first described in 1959 (Goffman, 1959) and states that we all
    aim to influence others to see us in our desired way. It has been studied extensively
    in psychological research (Bolino, Long, & Turnbull, 2016), and as discussed in
    Chapter 3 is something that is heavily exploited by social engineers. This need
    to show how one is seen by the world through the sharing of information, and the
    desire to protect oneself from intrusion, is the privacy paradox (Utz & Kramer,
    2009). As technology becomes increasingly inter-connected and greater use is made
    of social media platforms it seems inevitable that people will feel pressured
    to manage how their identity is seen, which in turn provides with information
    that can be used as the basis for an attack. The permanency of information posted
    online can also be a factor – for example a post made by someone in their youth
    could potentially be used against them later in life when they are in a senior
    or sensitive position. It is interesting to note that companies now allow an individual
    pay to review and, if necessary, remove posts that individual has made over their
    life and which could be considered offensive.


    Research into demographics of cyber victimology has produced conflicting results.
    For example, studies have found both younger and older people to be at greatest
    risk (Sheng et al., 2010), with contradictory results found in other research
    studies (Maimon & Louderback, 2009), in relation to phishing emails (Lichtenberg,
    Sugarman, Paulson, Ficker, & Rahman-Filipak, 2016). In contrast, Reyns (2013)
    identified those at risk in the UK to be older, elderly or in one of the higher
    socio-economic groups. Lin et al. (2019) explored why older adults appear to be
    more) vulnerable to phishing emails. They note that older people are the fastest
    growing demographic group in many countries, such as the USA; they have accumulated
    wealth; and are more likely to be in positions of power and influence. This latter
    point relates to spear-phishing, in which senior members of a company are specifically
    targeted by social engineers and hackers, on the basis that such individuals have
    the most access to company systems. As such, the apparent increased rate of victimisation
    of older adults may least in part be an artefact of being at a disproportionate
    risk of being targeted by cyber-attacks. Cognitive processing in older adults
    may be reduced, although it is important to stress that there is a distinction
    between normal changes in cognitive processes with age and the development of
    medical conditions such as Alzheimer’s disease. In addition, older adults are
    naturally less likely to have experience of computers in their youth.'
