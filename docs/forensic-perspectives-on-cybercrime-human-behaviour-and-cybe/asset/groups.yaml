    individuals often have access to sensitive data from other computer systems in
    their workplaces. This is one of the reasons why many cybersecurity breaches have
    been found to be a result of human error, typically due to a social engineering
    attack (CyberSafe, 2022) of the types that are discussed in Chapter 2. The importance
    of understanding human factors is recognised as a key aspect of cybersecurity
    by cybersecurity experts and practitioners (Kerney & Kruger, 2016). However, as
    explored in later chapters, often exists a perception of humans as the ‘weak link’
    of cybersecurity. This is potentially a harmful belief as it creates the expectation
    for all stakeholders in cybersecurity – the targets, attackers and the IT professionals
    who seek to protect systems – that it is the users who are the point of failure.
    Failure may lead to several unintended consequences, such as learned helplessness
