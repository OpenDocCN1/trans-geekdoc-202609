    cybercrime prevention and investigation strategies are already being handled by
    agencies outside of government and law enforcement. Sikra, Renaud, and Thomas
    (2023) propose the term Responsisable Non-Policing Agencies (RNAPs) to refer to
    such agencies, which are identified as commonly consisting of a mixture of charities
    and banks. These RNAPs place a buffer between the victims of cybercrimes and the
    state and police. As Sikra, Renaud, and Thomas (2023) observe there are both costs
    and opportunities associated with this role of RNAPs in cybercrime victimisation
    and reporting. RNAPs may have more expertise and greater experience of cybercrimes
    and may have lower costs than the police, but victims themselves feel support
    from specialised police officers over RNAPs. Overall, they characterise the use
    of RNAPs as resulting in higher volumes of lower quality work done, and the use
    of specialised policing as resulting in lower volumes of higher quality work done.
    Seems to be a recurrent theme throughout all aspects of cybersecurity, there is
    an unavoidable trade-off between efficiency and cost.


    Overall, there are many challenges in reducing the risk that people face becoming
    a victim of cyber-attack. Given the scope of cyber-attacks and the skill of attackers
    in targeting them, there is an argument that it is not fact possible to completely
    remove risk. The former CEO of Equifax, Richard Smith, faced criticism when testifying
    to Congress following a serious customer data breach at the company, with the
    comment that “I don’t think we can pass a law that fixes stupid” (Rushe, 2017).
    Whilst it is not constructive to label people who have been a victim of a cyber-attack
    as lacking intelligence – keeping in mind that the victims of cybercrime have
    senior staff at technology companies — there is a broader point that human error
    will always occur. As discussed in Chapter 2, the cognitive biases and heuristics
    that humans use to navigate our social world, and which social engineers seek
    to manipulate, have evolved to serve a purpose. As will be discussed further in
    Chapter 6, it is important that prevention and behaviour-change strategies aim
    to reduce the risk of cyber victimisation taking into consideration the underlying
    reasons for risk factors.


