    实施变革的个体似乎是一个重要因素，并与个体所运行的系统中关于自主性的组织文化因素有关。行为改变理论与韧性之间似乎也存在联系。正如前面提到的，网络韧性的一个核心概念——即防止个体在面对网络威胁时做出仓促或不确定的决策，这与促进更具意识感和反思性决策风格的行为改变理论是一致的。也可以认为，能力和自我效能的概念与韧性高度相关——如果一个具有韧性的人是指能够积极适应逆境的人，那么这个个体首先需要相信适应是可能的。然而，必须承认，韧性与行为改变之间的这些潜在联系在很大程度上是推测性的。尽管它们在关注现实世界挑战方面存在重叠，但文献关于两者之间联系的讨论很少。


    培训的交付方式也可能是行为改变的因素，特别是当这种方式不适合目标受众时。例如，Taylor 等人 (2017) 报告，向计算机学生教授心理学与向心理学学生教授心理学非常不同，因为计算机学生：


    -   更强调解决问题、逻辑思维和未来的收入；

    -   不太可能考虑人在解决问题中的作用；

    -   期望对心理现象有单一的、公认的解释。


    可以假设在工作场所引入网络安全培训时可能存在类似的障碍。事实上，那些在更偏向业务部门工作的人可能难以参与以人为中心的方法进行的培训，即使对人类因素的更深入了解是该培训的重要部分。这与
    Le、Kies 和 Forlizli (2011) 的观点一致，他们认为网络安全中使用的许多行为改变是以信息为中心的。因此，他们假设人们未能改变网络行为是因为他们缺乏如何改变的知识。这与行为改变理论的某些元素一致，例如
    COM-B 中的能力部分。然而，它没有考虑到行为改变理论的共同元素，例如个体需要动力。Drew (2020) 也呼应了这一观点，他在网络犯罪预防方面观察到，赋予更多关于网络威胁的知识并不一定会导致行为的改变。


    在讨论社会工程攻击时，Hadnagy (2018) 建议创建缓解和预防计划的四个步骤：


    -   学习识别社会工程攻击。

    -   制定可操作且现实的政策。

    -   进行定期的现实世界检查。

    -   实施适用的安全意识计划。


    这些步骤可以被视为在组织层面培养韧性（或至少是对社会工程攻击的韧性）的实际示例。这些步骤涉及到识别逆境并采取积极措施来预防和缓解逆境，这与韧性的概念化是一致的。然而，基于学术研究的行为改变活动在现实环境中实施这些方法可能会面临挑战。尽管如此，我们认为，像
    Hadnagy (2018) 和 Radcliffe (2023) 这样具有实践经验的专家所提出的建议非常有价值，并提供了从学术研究文献中无法一定获得的见解。


    正如第 5 章在组织文化方面讨论的那样，不同组织在网络安全方面的资源和技能上存在差异。可以认为，大部分研究文献都关注大型组织的网络安全行为。在这方面，Bada
    和 Nurse (2019) 从关于中小型企业（SMEs）网络安全的文献中识别了五个关键点。首先，他们指出，中小企业拥有良好的安全文化至关重要。正如第 5
    章讨论的，这适用于所有组织。其次，网络安全计划需要与中小企业的资源相。换句话说，一个在大型组织中全面且有效的安全计划，如果其成功实施所需的资源超过了中小企业的承受能力，那么可能几乎毫无用处。第三，识别中小企业内部的重要资产并理解这些资产可能造成的损害是重要的。这证明了网络安全风险的一个关键方面——中小企业持有的数据（如客户银行详情）与大得多的组织持有的数据一样敏感。第四，政府需要参与协助中小企业进行网络安全。政府可以提供资源和信息，并设定基本安全目标，例如英国运营的
    Cyber Essential 计划。最后，需要与中小企业进行更好的沟通和参与。


    ## 行为改变与预防 99


    ## 预防


    正如所讨论，在网络安全的背景下，真正讨论“预防”可能是困难的，因为这个术语假设问题尚未发生。然而，在社会技术系统中，存在带来变化的机会，以防止网络风险演变得更加严重。为了这一点，已经开发了一系列技术方法，其中结合了机器学习、使用个性化和用户特定的登录过程、双因素身份验证以及创建已知钓鱼网站列表
    (Luga, Nurse, & Erola, 2016)。组织还可以利用各种系统监控员工和客户的行为，并注意任何异常行为都可能预示着网络安全入侵。这可能是防止某些网络犯罪发生的重要因素，尽管网络罪分子也意识到了并尝试寻找替代方法来实现目标
