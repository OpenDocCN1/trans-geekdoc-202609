    社会工程师能够通过直接拨打主题公园的电话并假装成推销替代软件的销售员，从而判断出该主题公园正在使用的 PDF 软件版本。与社会工程师交的主题公园员工推测是自由地提供了这些信息，因为该问题看起来并不敏感。这是社会工程攻击中的一个常见主题——与目标的每一个单独步骤或交互本身并不构成威胁。只有当这些信息被汇总在一起时，真正的风险才会显现。


    像上述那样的攻击计划被分为“什么”、“何时”和“谁”。这值得关注，因为它符合常见的执法调查技术，即考虑犯罪的 SWH 因素：什么（what）、何时（when）、哪里（where）、谁（who）、为什么（why）以及如何（how）（College
    of Policing, 2013）。在渗透测试中，“什么”指的是攻击中将发生什么，以及目标是什么。Radcliffe (2023) 观察到在计划社会工程渗透测试时，与组织设定目标可能会产生紧张。组织可能认为某些资产过于敏感，不能暴露给组织外部人员，即使该人员是由安全顾问引入的。同样，对于组织内有多少人会被预先告知将进行渗透测试可能存在争议。为了对组织的安全性进行真实测试，应该让尽可能少知道测试正在进行，但组织可能认为让某些个人（如管理层成员）提前获知并不舒服（Radcliffe,
    2023）。最后，组织不太可能会留下名片或从组织内部的设备发送电子邮件（Radcliffe, 2023）。一旦设定了测试，下一步就是决定何时发起攻击。这与攻击计划中的“谁”有关，指的是谁需要到场以执行或协助计划——而他们往往没有意识到自己的行为正在协助攻击。计划制定好后，攻击便启动了，尽管社会工程师指出，过于详细的计划在协助攻击时可能成为阻碍（Hadnagy,
    2018; Radcliffe, 2023）。在伦理社会工程中，最后阶段是向客户报告攻击结果，并就如何改变他们的做法以降低成为犯罪社会工程攻击受害者的风险提供建议。伦理社会工程师和渗透测试人员提供的描述中，一个反复出现的主题是组织往往过度自信自己的系统是安全的；反之，他们对系统轻易被攻破感到如此震惊（Hadnagy,
