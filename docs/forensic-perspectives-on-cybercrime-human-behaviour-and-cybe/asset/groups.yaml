    # 攻击者 41


    对所有黑客相关话题的观点（Thackray, 2019）。这反映了黑客作为一种亚文化的客观事实（Holt, 2007; Steinmetz, 2014）。在这些黑客论坛内部，存在着成为最有学识最有技能的人的竞争。其中一部分是个人从黑客活动获得的乐趣，这强调了黑客可以作为一种娱乐活动进行。Steinmetz
    (2014) 报告了黑客在整个过程中经历的一系列情绪，包括挫败和无聊，以及在黑客攻击完成后体验到的愉悦和兴奋。需要注意的是，在所有的黑客案例中，为了娱乐而黑客并不一定意味着所进行的行为在本质上是犯罪性的。作为娱乐的黑客可能是人们终生从事的事情。尽管存在黑客都是青少年的刻板印象，但从事黑客活动的人年龄范围很大（Thackray,
    Richardson, Dolan, Taylor, & McAlaney, 2017）。那些在 20 世纪 80 年代和 90 年代就开始接触黑客活动的人现在已经年纪增长了，他们可能拥有合法的全职工作，并面临家庭、社区工作以及中年人常见的其他责任，但他们继续为了乐趣而进行黑客活动。为了娱乐而黑客与攻击目标相重叠，因为攻击者认为这样做很有趣，这在黑客论坛的术语中被称为“为了看（lur）”（Olson,
    2012）。参与黑客活动的另一个动机似乎是好奇心（Hutchings, 2013; McAlaney, Hambidge, Kempton, & Thackray,
    2020），黑客浏览互联网和计算机系统是因为他们对这些系统感兴趣，而不是出于任何实施犯罪的愿望。这与第 1 章讨论的“数字漂移”（digital drift）概念有关，在那种概念中，人们可能觉得主流规范在互联网上适用。这也反映了第
    2 章中讨论的社会工程工程师所报告的经历经历，他们经常描述自己如何由于探索未知环境的渴望而开始他们的社会工程活动。


    有证据表明，不同类型黑客的行为与他们认同和描述自己的方式相符。例如，人们注意到，黑客行动主义者（hackivists）更有可能针对与其观点相悖的网站（例如针对黑客行动主义者认为不道德的大型公司），而不是出于好奇心或财务目的（Holt
    et al., 2017; Holt et al., 2016）。黑客的确切动机可能难以识别，部分原因是他们有时表现出矛盾的行为和态度。例如，在对加密货币进行攻击后，黑客归还了他们盗取的
    6 亿美元中的近一半（Kharpal & Browne, 2021）。同样，有报道说一个勒索软件组织向一家儿童医院道歉，并为他们提供了解密软件标准（Abrams,
    2023）。在线攻击者似乎有自己的一套关于什么是不可接受的标准和信念。这类似于在更广泛的犯罪中见证的“道德准则”：


    # 42 攻击者


    从大公司偷东西可能被认为比抢劫一名老年女性更可以接受；或者，在武装抢劫中杀害银行员工被认为比性侵犯和杀死儿童要“可以接受”得多。Chiesa, Ducci,
    和 Ciai (2008) 描述黑客时，基于这样一种信念：被破解的系统不应被破坏，数据不应被盗取或修改，信息应该与黑客社区的其他成员共享，并且应该赋予所有人对系统的访问权限。这与研究一致，该研究发现认同为黑客的人对黑客活动中什么是可以接受持有混合意见，尽管人们注意到，在以下观点上存在更强的共识：即应该暴露网络安全漏洞，而不是利用它们（Thackary
    et al., 2017）。这反映了大型组织的黑客的沮丧，因为这些组织在网络安全方面存在基础漏洞（Chua & Holt, 2016），尽管他们拥有轻松解决这些问题的资源（Gode
    & Cruise, 2006）。此外，动机、系统、黑客的类型与所实施的攻击类型之间存在着复杂的关系。例如，Holt et al. (2015) 发现，如果认为在线上可接受的内容有明确规则，可以预测其不太可能参与网站篡改，但不能预测其他类型的网络攻击。同样，发现某些个人能够查看政府、学校或企业持有的关于他们的任何信息，这可以预测他们会进行网站篡改和访问政府服务器，但不能预测他们认为破坏军事服务器是可以接受的观点。


    Chng et al. (2022) 为黑客类型、动机和策略提出了一个进一步的框架，呼应了迄为止的网络安全研究更多关注网络安全的技术方面而非人为因素的观点。该框架与
    Seebruck (2015) 的复杂模型重叠，但建议了额外的黑客类型，包括老兵（资深且丰富的黑客）、内部人员（组织的内部成员）、小偷、众包者和犯罪协助者。犯罪协助者与第
    1 章讨论的 CaaS（攻击即服务）有关。该模型刻意不包含“黑客”这一术语（Barber (2001) 定义了该词并指代故意造成破坏的黑客），原因是这是一个可以应用于多种类型黑客的广泛概念。Chng
    et al. (2022) 注意到他们使用的术语反映了文献中使用的术语，包括国家力量（Hald & Pedersen, 2012）和在线性犯罪者等犯罪类型。后者的加入很有趣。即使在那些自认为反对主流的论坛和网站上，对于任何似乎在支持儿童色情的人，通常也会快速且严厉的反应（Coleman,
    2014）。


    # 55 识别黑客的动机比对相关人员的人格和行为进行冲突性报告和研究更为困难。例如，Woo (2003) 在黑客中观察到高水平的自恋和攻击性，而 Platt
    (1994) 注意到该群体看起来相当友善。同样，Bachmann (2010) 指出黑客似乎倾向于理性思维风格和解决问题，这与黑客作为无政府主义者的形象——尽管那是他们群体自己塑造的——形成对比（Coleman,
    2014）。这种对黑客社交不适应的认知部分归于黑客有时互动的方式。当在网上查看有关黑客和行动主义的讨论时，显而易见许多用户以攻击性的方式进行交流（Olson,
    2012）。然而，这可能只是这些群体交流的方式。在线互动被批评容易产生几种特定的解释。例如，波普定律（Poe''s Law）被描述为一种格言，除非作者的意图明确清晰，否则任何带有讽刺或讽刺的陈述都将被视为真心的（Aikin,
    2009）。然而，在某些情况下，对某些个人和组织的网络攻击似乎是位移攻击（Pedersen, Bushman, Vasquez, & Miller, 2008）。动机也可以流动的，有时同一群体或集体参与的攻击涉及冲突的动机。例如，针对某个组织以解决感知社会不公与为了个人娱乐（即为了好笑）之间的区别，成为了匿名组织（Anonymous）内部冲突的原因（Coleman,
    2014）。此外，同一个人身上可能存在多种动机。虽然匿名组织的成员可以被认为主要受行动主义驱动，但有报道说该小组的某些成员还参与了信用卡欺诈作为收入来源。当然，在根据自我报告的身份和动机对黑客进行分类时也应该保持谨慎。将自己描述为对抗大公司贪婪的意识形态驱动的黑客，比作为一个偷钱的罪犯更容易被社会接受。这反映了
    Rogers (2010) 的观察，从事网络犯罪的人通过四种方式来应对这种行为造成的认知失调：


    - 使用委婉语言来淡化和远离行为

    - 将他们的行为归咎于社会压力，并声称在群体行动中他们的个人贡献是微不足道的

    - 缩小或忽视行为的负面后果

    - 丑化和非人性化他们的目标，并认为他们应该受到攻击


