    # Behaviour change and prevention


    # Context


    Having established the range of factors that may cause and influence cybercrime,
    the next step is to consider how to address these challenges. Whilst there are
    technological approaches that can improve cybersecurity, it is ultimately human
    behaviour that determines the safety of socio-technical systems. Excluding the
    debatable case of artificial intelligence, which will be discussed in Chapter
    7, all cases of cyber-attack require some element of action and decision-making
    by the attacker. Most cyber-attacks also require the victim to do something, such
    as clicking on a link in a phishing email or divulging sensitive information in
    some way. As such, robust cybersecurity requires an understanding of behaviour.
    There are decades of research from psychology and other science areas that can
    be used to not only understand how and why people act and interact in different
    ways and make different decisions, but can inform how to change human behaviour.
    Social psychologists consider the nature of interactions between individuals and
    groups; investigative psychologists consider choice of victim and different types
    of offending; cognitive psychologists study decision making, heuristics and biases;
    and forensic psychologists may attempt to reduce future offending, for example.
    This encompasses others used in psychology such as prevention and harm reduction.
    These concepts can overlap, and in real-world practice may not have a clear distinction.
    Prevention refers to the strategy of preventing harm from occurring in the first
    instance. An example of this would be how governments encouraged and/or mandated
    to wear face masks during the COVID-19 pandemic, to prevent those individuals


    DOI: 10.4324/9781003300359-6'
  - '[PAGE 102]


    from becoming infected. However, wearing masks and other preventive measures such
    as hand washing only reduced the spread of the virus, they did not eliminate the
    risk. As these measures could also be thought of as harm reduction. Other examples
    of harm reduction would include strategies such as ensuring there are licensed
    taxis available at a taxi rank on weekend nights in city centres, on the basis
    that this would reduce the risk of individuals who have been drinking alcohol
    from home. There is an underlying acceptance in this approach that it is unrealistic
    to expect complete behaviour to occur, i.e., for people not to drink alcohol in
    pubs and clubs at weekends. As such, the focus becomes what can be done to lessen
    some of the risks. Finally, behaviour change involves techniques that are designed
    to change the behaviours of the target population. An example of this would be
    public health campaigns that seek to promote giving up smoking. In this case the
    goal is behaviour change, and not harm reduction – it would be unusual for a health
    authority to promote that some smoking is ok. Nevertheless, there are often elements
    of prevention, harm reduction, and behaviour change in any campaign that seeks
    to address some type of problem that is at least caused by human behaviour. For
    instance, the wearing of masks during COVID-19 may be seen as a preventive and
    harm reduction measure, but to occur it needed the target to change their behaviour.


    These concepts of behaviour change, harm reduction, and prevention can also be
    blurred by cybersecurity. If, as discussed in previous chapters, it is a case
    of ‘when you get hacked, not if you get ‘hacked’ the concept of prevention is
    not applicable. After all, being victimised is inevitable then there is no point
    in wasting time and resources into preventing this happening. Instead, the only
    option would appear to be harm reduction, where attempts are made to lessen the
    risk and the subsequent harm it may cause. This reflects the concept of target
    hardening in security, which refers to the idea of making a potential target less
    desirable to an attacker by making it harder to conduct an attack, in the case
    of how residential properties can be made to be less appealing to burglars (Montoya,
    Junger, & Ongena, 2016). Drew (2020) further notes that target hardening in cybersecurity
    can take the form of self-protective behaviours, as learning not to disclose sensitive
    information to seemingly appropriate external parties (a common technique used
    by social engineers) unless their identity has been clearly established. It is
    also supported by Routine Activities Theory (Cohen & Colson, 1979), which states
    that a target is at greater risk when it is attractive to the attacker. In other
    words, the attacker may be encouraged to attack someone else instead of if you
    perceive that other target to be weaker. This does not course the problem, but
    just moves the problem to someone else. In criminological terms this is a form
    of crime displacement (Hesseling, 2006). This argument suggests that if an area'
  - '[PAGE 103]


    # Behaviour change and prevention 91


    is flooded by police officers or CCTV, offenders may displace their criminal activity
    and move it elsewhere. Similarly, if a company has security systems, or an individual
    does not easily disclose information, the attacker may simply move somewhere else.
    However as discussed in Chapter 3 there is often frustration amongst cybersecurity
    practitioners that large and well-resourced companies have very basic flaws in
    their cybersecurity. As this concept of target hardening is a useful one. Nevertheless,
    prevention remains something organisations are invested in. There may be a public
    relationship between them after organisations may not want to admit to their customers
    they have accepted that it is inevitable they will experience cyber-breaches.
    In this book we broadly separate our discussion of the research literature into
    relating to behaviour change (i.e., addressing problematic cyber behaviours which
    are already occurring) and that relating to prevention (i.e., efforts to prevent
    problematic cyber behaviours from developing in the first place).


    # Behaviour change


    A key finding from the research literature on cybersecurity behaviour change is
    that providing security alone is insufficient to increase awareness or change
    behaviour (Bada, Sasse, Nurse, 2015). This highlights the point that threat messages
    alone are not an adequate technique for encouraging individuals and organisations
    to protect themselves, as would appear to be the assumption of various official
    bodies (Williams, 2012). Instead, as Bada and Nurse (2019) argue from their review
    of the literature, there is a need to provide organisations with simple and practical
    advice that is relevant to the organisation''s mission and resources. It has also
    been noted that it is important to have measurement tools that record both behaviour
    change and compliance (Bada et al., 2015). This reflects a behaviour challenge
    that exists across all domains – simply asking the target population if they have
    changed their behaviour is unlikely to be a robust measure of whether behaviour
    change has actually occurred. In the case of an organisation for example, employees
    may not wish to admit their behaviour has not changed following cybersecurity
    training because they do not wish to be penalised.


    If cyber resilience of the type discussed in Chapter 4 is lacking in an organisation,
    or if resilient behaviours and attitudes are not evident when the organisation
    is under attack, then change must occur. Such attempts to bring about change are
    often referred to in the literature as behaviour change as an umbrella term, but
    this is done with the knowledge that attitudes, cognitions, and emotions are components
    of behaviour and behaviour change strategies.'
