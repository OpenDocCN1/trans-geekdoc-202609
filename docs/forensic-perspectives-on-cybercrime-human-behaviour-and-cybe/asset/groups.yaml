    # 14 Introduction to cybercrime


    Group structures and processes are discussed in more detail in Chapter 3.

    Huang, Guo, Guo, and Li (2021) have demonstrated that it is possible to identify
    hackers on underground forums using a tool called HackerRank, which utilises automated
    social network analysis and content analysis. It could be argued that this shows
    a greater ease in identifying hackers on underground forums than those hackers
    may realise.


    # Cyberwarfare and fake news


    Cyberwarfare broadly refers to the use of internet technologies to cause harm
    and disruption against a nation state, although it has been noted that definitions
    of this phenomenon vary (Wilcox, 2018). One of the first examples of an act of
    cyberwarfare was the Stuxnet incident (Atrews, 2020), in which a computer worm
    (a type of malicious software) caused centrifuges at nuclear facilities in Iran
    to spin so quickly they tore themselves apart. Cyberwarfare has been identified
    by the Director of U.S. National Intelligence as a top threat to U.S. national
    security, in part due to incidents such as a data breach in which the records
    of nearly 14 current and former U.S. government employees were stolen (Bremmer,
    2015). In The Hacker and the State, Buchanan discusses the substantial damage
    to financial systems and critical infrastructure. The people and organisations
    involved in such acts of cyberwarfare are often difficult to identify, or at least
    difficult for the government of the targeted country to publicly accuse within
    the constraints of international diplomacy. Nevertheless, there are some more
    well-known groups suspected to be responsible for high-profile acts of cyberwarfare.
    The Lazarus Group for instance is a cyber organisation that became in 2009. They
    are believed to operate primarily out of North Korea, although the exact status
    of the organisation and relationship with the North Korean government is not clear
    (White, 2022). They are alleged to be behind a large hack of Sony Pictures in
    2014, an attack it has been suggested was prompted by a Sony movie The Interview,
    which depicted a fictitious attempt to assassinate North Korean leader Kim Jong
    Un. The Lazarus Group have also been associated with the WannaCry ransomware of
