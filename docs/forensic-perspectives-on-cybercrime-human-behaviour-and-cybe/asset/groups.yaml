    # 130 Glossary


    legitimate purposes such as communication by journalists reporting from oppressive
    regimes. This is distinct from the **deep web**.


    **Data mining** The process of sorting through **big data** sets to identify patterns
    and relationships, which utilises techniques from **machine learning.**


    **DDoS (Distributed Denial of Service)** A type of cyber-attack in which the targeted
    computer system is overwhelmed and made inoperable by a high volume of internet
    requests, akin to attempting to refresh a webpage thousands of times per section.
    Often achieved through use of a **botnet**.


    **Deepfake** Fake but highly realistic images or videos created with the use of
    **artificial intelligence**. Often used as part of a scam or act of cyber warfare.


    **Deep web** Internet content that cannot be located or accessed using standard
    search engines, such as example databases containing medical records or school
    grades. This is distinct from the **dark web**.


    **Fake news** False or misleading information that is presented as fact, created,
    and disseminated with the intention of causing disruption, changing behaviour,
    shaping beliefs, or generating profit through advertising revenue. Often used
    as a tool for **cyber warfare**.


    **Hacker** An individual with knowledge of information technology and the skills
    necessary to use, and challenge, a computer system to achieve a goal or overcome
    obstacle. This is often with criminal intent.


    **Insider threat** The threat caused by the actions of a member of an organisation
    that either facilitates or causes a cybersecurity incident. This can be in the
    form of an unintentional insider threat (e.g., an employee clicking on a malicious
    link in a phishing email) or intentional insider threat (e.g., an employee deliberately
    stealing company secrets and selling them to a competitor).


    **Machine learning (ML)** A branch of **artificial intelligence** that involves
    using data and algorithms to imitate how humans learn, with the goal of improving
    accuracy over time.


    **Malware** Malicious software that is intentionally designed to cause harm to
    a computer system, by accessing sensitive data.


    **Penetration testing** A simulated cyber-attack on an organisation that helps
    organisation understand the gaps and weaknesses in their defences.


    **Phishing email** An email that attempts to trick or scam the receiver into performing
    an action that will facilitate a cyber-breach, such as disclosing sensitive information
    or clicking on a malicious link/ attachment that will install **malware** and
    compromise the targeted computer system.


    **Phishing website** A website designed to collect sensitive information from
    a target, which may also infect the target''s device with **malware**. Often these
    sites are set up to resemble a genuine and well-known website, such as a major
    social media platform.'
