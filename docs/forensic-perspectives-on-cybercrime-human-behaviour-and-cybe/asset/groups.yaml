    ## Emergent technologies and future directions


    There is undoubtedly great potential for cyber adversaries to use deepfakes for
    a range of activities, including fake news, the generation of phishing emails
    and – by making use of technologies such as voice chatbots – even other forms
    of social engineering that have until now required a human attacker. These issues
    have led researchers such as Guitton (2020) to identify AI as an emergent and
    potentially major cybersecurity risk.


    Specific examples have been identified that demonstrate machine learning and AI
    can be used by attackers. Baki, Verma, Mukherjee, and Gawali (2017) for example
    demonstrated the role of these technologies in email masquerade. This refers to
