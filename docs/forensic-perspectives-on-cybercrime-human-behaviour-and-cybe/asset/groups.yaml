    ## 受害者学与韧性


    文中描绘了网络韧性因素、常见的安全活动以及更广泛的韧性因素。网络韧性因素分为预防、检测和响应。在每一个韧性因素下，都识别了常见的安全活动和相应的韧性因素。例如，预防下的安全活动包括威胁分析和预测，相应的韧性因素是预测。检测类网络安全活动包括监控和入侵检测，它们属于监控韧性因素。最后，与响应相关的网络韧性包括事件报告和影响分析等活动，涉及“响应”和“学习”这两个韧性因素。从网络安全事件中学习的这一点，是伦理社会工程师强调的组织必须参与的极其重要的后期工作，尽管他们也注意到这并不总是会发生
    (Radcliffe, 2023)。Aoyama、Naruoka、Kojishima、Machii 和 Seki (2015) 通过构建映射也指出，网络韧性的人类贡献是有限的，他们认为由于难以观察组织对实际网络攻击的反应。正如他们所评论，他们使用的是培训演练来探索网络韧性。然而，尽管对人类因素了高度关注，他们提出的网络韧性分类仍然主要集中在技术和系统层面。


    总体而言，关于韧性概念化的文献可以分为两类：一类将韧性视为个人心理建构的研究；另一类则从人类运行的系统角度考虑韧性，并侧重于技术元素。不出的是，使用前者社会科学学科概念的研究更多，而后者的概念在计算和
    IT 资源中更为明显。专门针对网络安全韧性的研究是广泛的组织韧性研究的一个小子集，并且主要基于关注技术和系统的韧性概念。关于如何提高这两种韧性的方面将在第
    6 章进行更详细的讨论。


