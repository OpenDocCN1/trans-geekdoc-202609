    require little effort or cost to the attacker, and only require engagement by
    one in the target population to be successful. In other words, it does not matter
    if a target organisation has 10 employees or 100,000 employees – only one must
    click on a link or file for the attacker to potentially access the system. Technological
    approaches such as firewalls and anti-virus software can block some of the risks
    posed by phishing, but not all of them. In addition, phishing is one example of
    social engineering, but other types of attack exist as will be discussed in this
    chapter.


