    # Types and motivations of attackers


    As commented by Chng, Lu, Kumar, and Yau (2022), the phrase ‘hackers’ has been
    used in the past in a way that suggests that hackers (or cybercriminals more broadly)
    consist of one generic group, which would be akin to considering all traditional
    criminals to have the same characteristics. Several taxonomies and typologies
    of cyber-attackers have been proposed within the literature. For example, Seebruck
    (2015) provides a circumplex model, within which attackers are classed as having
    a primary motivation of either prestige, recreation, revenge, ideology, or profit.
    Individual types of attackers exist within one of these segments, with varying
    degrees of technological skill. This highlights the point made in Chapter 1, where
    there is marked variation in how much technological skill hackers have (NCA, 2016),
    with less than 5% engaging in what would be considered as sophisticated hacking
    (Holt & Bossler, 2014). This does not mean that lacking technological skills are
    low threat. As demonstrated in Chapter 2 psychological manipulation of targets,
    or social engineering, provides a significant threat but does not necessarily
    require technological ability. Topological skill is not necessarily an indicator
    of the threat that a hacker poses, with Chua and Holt (2016) reporting that they
    did not find a relationship between technical computer skills and simpler forms
    of hacking, although there was such a relationship evident with regards to more
    complex forms of hacking. Similarly, it appears that higher technological skill
    is associated with stronger willingness to engage in website defacement, searching
    of bank or government servers, or the breaching of military servers (Bossler,


