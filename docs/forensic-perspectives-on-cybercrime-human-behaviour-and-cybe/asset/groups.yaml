    ## 行为改变与预防 101


    关于在线性捕猎者的教育宣传活动，其中包含了此前仅邀请儿童父母和其他相关成年人参加的意识会议（Gibson, 2016）。这种方法使用了恐惧诉求，正如演讲者指出的，在线捕猎者将自己描述为“正忙于狩猎”。并不意外的是，此类活动往往会引发关于向儿童提供多少关于他们可能面临的网络风险信息合适的讨论。部分这与一种认知有关：儿童和青少年学习如何使用数字技术非常重要，因为这些技术已无处不在，并日益成为日常生活的重要组成部分。因此，通过完全不使用数字设备的禁欲方式来预防伤害是不可行的。这里采用的是减害方法，赋予儿童和青少年识别并保护自己免受网络风险的能力。这导致了一些机构和资源的建立，它们旨在帮助父母和孩子应对网络风险并制定保护策略，例如
    [Internet Matters](https://www.internetmatters.org)。


    预防策略不仅局限于可能成为网络攻击受害者的人。也可以开展工作以防止个人参与犯罪活动。正如第3章所讨论的，参与黑客活动的人往往是因为对计算机和互联网有与生俱来的兴趣而这样做的。他们可能会参与犯罪活动，对许多人来说，这是他们行为的偶然结果，而非他们的目标。这并不是为了削弱或消除犯罪分子造成的伤害，而且当然也有网络犯罪分子的动机是渴望参与明显非法且不道德的行为，例如共享虐待儿童的图像。相反，观点在于，应该鼓励某些个人将他们理解计算机系统的技能和热情用于积极的用途。正如第3章所讨论的，发现黑客对于网络安全系统中存在可被利用的漏洞持有不同意见（Thackray,
    Richardson, Dogan, Taylor, & McAlaney, 2017），而表面黑客论坛上的讨论通常会阻碍经验较少的成员参与非法活动（McAlaney,
    Hambidge, Kimpton, & Hackacker, 2020）。也就是说，人们被鼓励成为**白帽**（合乎伦理且合法工作的黑客），并远离成为**黑帽**（犯罪黑客）——尽管人们认识到，黑客如果没有经历过一些包含非法元素的活动经验（被称为**灰帽**），可能很难完全在黑客技术领域成为专家。在某项针对人的调查中，9%的受访者描述自己为黑帽黑客，其余的人描述自己为白帽黑客（38%）、灰帽黑客（49%）或其他较少术语，如赛博朋克（Thackray
    et al., 2017）。新加坡曾讨论过对黑客进行许可（Wong, 2017），基于是为黑客对其角色的正式认可将导致更强的监管并减少犯罪。然而，这种方法可能面临一些障碍。观察发现，黑客亚文化对执法部门和整个政府存在强烈的不信任，这部分是因为过去曾试图识别和起诉黑客（T.
    J. Holt, 2007）。总体而言，据报道，黑客认为刑事司法系统具有敌对性并偏向黑客，这在黑客社区内部产生了一种不公感（T. Holt, Brewer,
    & Goldsmith, 2018; T. J. Holt, Stonereich, Felich, & Chermak, 2021）。


    针对其他可能参与犯罪黑客活动的人预防策略可能同样重要，因为这些人并不完全理解黑客活动涉及的风险。2016年，英国国家安全中心时任首席技术官评论道黑客“并没有他们想象的那么复杂”（Levy,
    2016），这意味着他们暴露在身份识别和起诉风险中的程度远比一些黑客可能意识到的要得多。尽管如此，仍需要鼓励对计算机感兴趣的人在这一领域发展职业，以解决网络安全招聘危机。或许可以采取的方法是考虑教育人们（特别是年轻人）将黑客行为视为一种可能包含风险的行为。这在学校的健康和社会教育中已经广泛进行，例如酒精和安全性等话题，是受监管的体育和健身活动（如体育联赛）培训的重要部分。


    Rennie 和 Shore (2007) 认为可以采取步骤来减少对犯罪黑客的参与，包括：


    - 父母和同伴的干预，向青少年教授黑客活动的犯罪本质。

    - 减少新黑客标志的吸引力，并以警告和行为合约的形式进行早期干预。

    - 限制黑客工具的可用性，以 i) fact更高的准入门槛和 ii) 防止心流体验。


    这些建议反映了在其他领域使用的预防和干预策略元素，尽管考虑到黑客和网络犯罪的独特特性，应采取谨慎态度。例如，同伴教育（由与目标群体年龄相仿的青少年提供的意识会议）已被证明是减少其他领域健康风险有害行为的有效策略（Abdi
    & Simbar, 2013），父母影响对青少年健康和社交行为的作用也已确立（Beck & Treiman, 1996）。然而，当涉及同伴和父母教育目标群体关于黑客的法律问题时，可能会出现问题，因为许多国家存在着大量的法律灰色地带和关于计算的过时法律。此外，父母自己可能没有知识与孩子讨论黑客问题。这是英国国家犯罪调查局（NCA）的目标之一，该局发起了一项活动，赋予父母能够与孩子就黑客进行有意义的讨论，包括该领域存在的合法且积极的职业（National
    Crime Agency, 2023）。NCA 还使用了一个康复营，在其中鼓励犯人（特别是青少年）将他们的技能用于社会福祉（Ward, 2017）。


    正如 Rennie 和 Shore (2007) 所言，减少犯罪黑客的吸引力也可以降低对网络犯罪的参与，尽管考虑到媒体对黑客的描绘通常带有幽默和刺激，这可能是一个挑战，例如由克里斯·海姆斯沃斯主演的电影《黑客》。有一些相对真实的黑客描写深入探讨了黑、白、灰客的微妙之处以及黑客面临的困境，例如剧集《机器人》。可以认为，媒体对黑客和黑客的描绘本身并不是问题，只要努力传达网络安全领域的合法职业路径——包括伦理黑客，以及非法黑客可能导致的起诉和犯罪记录事实。正如第3章所讨论的，这将有助于解决网络安全招聘危机。警察对潜在黑客的监控以及限制黑客工具的可用性可能会防止人们参与黑客活动，但这些方法的挑战在于问题的规模以及所需的时间和资源。执法部门和情报机构可能也不对其访问和监控在线通信的能力发表评论，尽管据报道英国情报机构
