    We live in an increasingly inter-connected world. The digital technologies that
    underpin these societal changes provide many benefits to individuals and organisations,
    however, they also facilitate criminal activities. There is enhanced public awareness
    of the real-world impact of cybersecurity incidents, in part due to high-profile
    cases such as the WannaCry ransomware worm that had a large impact on the National
    Health Service (NHS) in the UK (BBC News, 2017). In 2022, the data of 400 million
    Twitter users was stolen, which included email addresses and phone numbers linked
    to accounts, information which could be used or sold to cybercriminals to facilitate
    further breaches (Newman, 2023). Data breaches of this type can also result in
    the real-life identity of people being revealed, which for some individuals may
    be harmful if they use pseudonym online to protect their identity. In addition,
    cyber-attacks increasingly impact the daily lives of members of the public, such
    as the ransomware-attack on the Colonial Pipeline in 2021. This is an oil pipeline
    system that transports gasoline and jet fuel from the USA to the southeast of
    the country. Due to the cyber-attack, the company ceased all operations of the
    pipeline, resulting in fuel shortages, panic buying, and changes to flight schedules.
    This led US President Joe Biden to declare a state of emergency, with the Colonial
    Pipeline Company paying the attackers 75 Bitcoin ($4.4 million) to regain access
    to their systems (Kerner, 2022).


    Psychological factors underlie the cognitions and behaviours of all the actors
    within cybersecurity. This includes the decision-making process that leads the
    attackers to choose their targets; and then the choice of methods used in the
    attack.


    ## 2 Introduction to cybercrime


    This has parallels with the decision-making processes identified in forensic psychology
    with reference to offline crimes, such as the processes used by burglars to decide
    which house to burgle (Nee & Meaghan, 2020). These decisions may be influenced
    by the perceptions that the attackers have of how the targets respond to the attack.
    More broadly, cybersecurity incidents change how the wider public interacts with
    online technologies, as their trust in online voting systems or engagement with
    online shopping.


    In this opening chapter we outline this cybercrime landscape, with a focus on
    the theories from forensic, cyber, social, and other areas of psychology that
    can help us understand the behaviours and conceptions of all those involved in
    cybercrime. Everyday use of technology involves basic interactions that reflect
    social processes. Passwords for example have been described as trusted tokens
    (Marshall & Stephens, 2008), in which individuals provide proof of identity in
    exchange for access to services. However, such interactions are prone to the same
    compromises that people make in other aspects of their daily lives so that they
    are able to navigate a complex social world with finite resources. Tam, Glassman,
    and Vandenwaer (2010) for instance note the convenience-security trade-off, in
    which people opt for simpler passwords than be recommended by security experts,
    as it is often challenging for people to choose and recall more complex passwords.
    This is consistent with rational choice theory, in which individuals decide what
    action to take based on their judgement of the costs and benefits of each action
    (Ostrom, 1998). This tendency is the reason behind passwords being required to
    have a certain level of complexity, such as for the example that a password must
    include a capital letter, number, special character etc. Whilst setting such a
    requirement may feel not intuitive from a cybersecurity perspective it can create
    issues for the humans who are users of socio-technical systems. A recurrent theme
    throughout this book will be the clash between how humans should ideally behave
    to avoid cyber-risks versus the actual, less ideal cybersecurity behaviours that
    humans often exhibit.


    A challenge in understanding human behaviour in online settings is whether people
    behave in a fundamentally different way, or if online technologies just provide
    the opportunity to express themselves in ways that would not otherwise be possible.
    This relates to the question put by Suler (2004) on whether the internet transforms
    or enhances. An example would be whether someone behaves aggressively in an online
    interaction would also do so if they were having a similar online interaction
    (i.e., the online setting transforms that behaviour), or if the online setting
    just exaggerates how aggressively that person behaves (i.e., it enhances an existing
    behaviour). This is in turn linked to the concept of digital drift. This refers
    to how technology can lead individuals to loosen their adherence to mainstream
    norms (Brewer, Fox, & Miller, 2019). This can happen in the digital context by
    providing affinity (i.e., financial and social rewards) and affiliation (i.e.,
    associating with others). Goldsmith and Brewer (2015) argue that people can take
    advantage of the internet to express online identities and escape into a virtual
