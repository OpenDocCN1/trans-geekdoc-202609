    # Attackers 53


    Clayton, 2018. Lusthaus et al. (2023) identified several characteristics of criminal
    networks through case-studied analysis of ten closed investigations. This study
    documented varying types of network structure within the groups involved in the
    case studies, some being characterised by looser group structure and less-defined
    roles, and with others having a clearer hierarchy and allocation of duties. Offline
    elements were evident across many of the chosen cases, highlighting the point
    that there is not always a clear division between cybercrime and traditional,
    offline crimes. As technology becomes increasingly pervasive in daily life it
    is important that we continue to consider this interaction between offline and
    online components of what we may have otherwise considered to be cybercrime.


