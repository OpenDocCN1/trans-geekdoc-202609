    2012）。正如 Deutsch & Gérard (1955) 所指出的，我们既受到信息影响也受到规范影响，这意味着我们受到渴望被群体接受的愿望驱动，并接受该群体所提出的现实愿景的驱动。因此，黑客小组的人参与了他们原本不会采取的行动，特别是当他们被其他群体成员积极针对和塑造时。


