    key points from the literature on cybersecurity in small and medium-sized enterprises
    (SMEs). Firstly, they note that it is vital that there is a good security culture
    in the SME. This is of course a point that applies to all organisations, as discussed
    in Chapter 5. Secondly, the cybersecurity programme needs to align with the SME''s
    resources. In other words, a security programme that is comprehensive and effective
    in large organisations may be of little use if it requires for successful implementation
    beyond that of an SME. Thirdly, it is important to identify the important assets
    within the SME and understand the harms that could be caused by a breach of those
    assets. This demonstrates a key aspect of cybersecurity risk – SMEs can hold data
    (such as customer bank details) that are as sensitive as that which a much larger
    organisation can hold. Fourthly, there is a need for governments to be involved
    in assisting SMEs in cybersecurity. Governments can provide resources and information,
    as well as setting basic security goals, such as the Cyber Essential scheme that
    is operated in the UK. Finally, there is a need for better communication and engagement
