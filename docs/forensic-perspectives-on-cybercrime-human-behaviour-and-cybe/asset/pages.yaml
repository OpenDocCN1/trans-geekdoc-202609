  md: '# Conclusions and recommendations


    # Opportunities and challenges in cybersecurity


    Humans are complicated. Technology adds further unknowns in predicting behaviour
    by providing people with the ability to communicate in ways that have not previously
    been possible. This has created new opportunities and challenges, the extent of
    which are not fully understood. One way in which approach this is perhaps to consider
    the fundamental question posed by Suler (2004) – does the internet enhance, or
    transform? Does the freedom and anonymity provided by the internet allow us to
    express ourselves more openly, or do we become a different person? This relates
    to the classification of cybercrime as being cyber-enabled or cyber-dependent.
    A cyber-enabled crime involves the individual using technology to commit a crime
    that could have also been committed offline, whereas cyber-dependent crimes are
    those which can only be committed by using technology. Hacking falls into the
    latter category, but can be debated whether it really is a new behaviour. The
    stories of engineers such as Jenny Radcliffe (Radcliffe, 2023) make it clear that
    gaining access to places was something they developed great skill at before the
    internet was widely available. Computer systems and the internet provide new spaces
    to explore.


    Psychology research from within and outside cybercrime can provide some insights
    into why people behave as they do when using socio-technical systems, and how
    harmful behaviours can be changed. It would be overly optimistic to say that psychology
    research solve all the problems associated with cybercrime, but we would argue
    that there are significant benefits to have had greater utilisation of psychological
    approaches in the prevention of'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# 124 Conclusions and recommendations


    cybercrime. This would help facilitate a shift away from the view that humans
    are the weak link in cybersecurity, which is not a productive way of engaging
    with people to understand and change behaviour. Increasing the role of psychology
    in cybersecurity may also aid in prompting greater recognition and understanding
    of the risks of social engineering. Ethical social engineers provide insight into
    how such criminal acts can be mitigated or prevented, but to date much of this
    understanding comes from media sources and personal accounts. We call for more
    empirical research that engages with social engineers to develop an evidence base
    to improve cybersecurity practices. We argue that academic research is a strong
    position from which to follow this line of inquiry, due to the standards to which
    we adhere and the experiences in disciplines such as psychology in investigating
    behaviors where there may be hesitancy on the part of study participants.


    The motivations and techniques used by cybercriminals are diverse and linked to
    their sense of self-identity. The stereotype of a hacker as a teenage boy working
    from his mother''s basement is inaccurate and counterproductive, as it can lead
    to assumptions that undermine prevention and intervention approaches. Hackers
    and cybercriminals are fully aware of these stereotypes and the preconceptions
    that people have about them obfuscate who they are and what their aims. In keeping
    with a population that is so deeply immersed in internet culture, hackers are
    often very aware of their perceived position, expressed through discussions on
    hacking forums and self-referential jokes and memes. Nevertheless, for a population
    that seems to make an effort to portray itself as anarchic and anti-social it
    is evident that socialisation and trust relationships are key element of hacker
    activities. The role of hacking communities in providing people, including young
    people, with a sense of self-worth and social identity should not be underestimated,
    and of course again the point must be made that being a hacker does not equate
    to being a criminal.


    The research on who is most likely to be a victim of different types of cyberspace
    is mixed. Given the breadth of types of cybercrime, and the skill of attackers
    such as social engineers, it is difficult to envisage a situation where an organisation
    or any individual is completely free of any type of cyber-risk. As it is important
    for individuals and organisations to develop resilience, in which they are aided
    and supported to make positive adaptations after they have experienced a cyber-attack.
    Much of research literature focuses on resilience at an organisational level,
    but there is potential to apply these concepts at the individual level as well.
    The victims of romance scams for example report extreme feelings of shame for
    having fallen the scam, and discussing concepts of resilience with such individuals
    may be an act of empowerment. It has been shown that the internet can enable those
    who have been the victim'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# Conclusions and recommendations 125


    of a cybercrime to express their experiences, such as in the #MeToo movement (Clark-Parsons,
    2021). There are barriers and risks inherent in any online act, but the potential
    of the internet in enabling people to express their agency and respond, even indirectly,
    to those who have attacked them is worthy of further exploration.


    The online environment also provides unique opportunities for behaviour and prevention
    strategies. This includes for example the monitoring of employee use of computer
    systems in the workplace, which provides the opportunity to deliver personalised,
    real-time behaviour change interventions. However, these possibilities also raise
    questions and debates on how such information is used, and whether individuals
    will be unfairly penalised for being a victim of cybercrime. One of the recurrent
    themes the book has been the surprising ease with which many cyber-attacks can
    be conducted, and the sophisticated psychological manipulations that social engineers
    and other attackers use to secure systems. Further, it could be argued that cybersecurity
    behaviour change and prevention strategies do not make full use of the extensive
    evidence base that is available from psychology literature. This does not mean
    of course that behaviour change and prevention strategies that have been successful
    in other domains should be equally applicable to cybersecurity – the nature of
    the internet and the speed with which digital technologies evolve us cautious
    about such assumptions. This is why needed to understand the unique characteristics
    of digital technologies, and how these influence behaviour and decision making
    in cybersecurity. Behaviour change and prevention also need to be considered in
    relation not just to the targets of cybercrime, but also the instigators. Curiosity
    of computing systems and a desire to test the limits of what is possible appear
    to be the starting point for many of those who become involved in hacking, but
    these are not in themselves negative traits. Encouraging such individuals to work
    towards legitimate careers in cybersecurity can provide the resources and skills
    that will be needed if society is to be resilient against cybersecurity threats.


    # Recommendations for research, policy, and practice


    Based on the research discussed in this book, the following recommendations are
    made:


    +   * The concept of humans as the weak link in cybersecurity is not productive.
    If a system is repeatedly breached due to actions that an individual is taking
    (such as clicking on a malicious link in a phishing email) then'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Conclusions and recommendations


    consideration needs to be given as to what it is about the design of that system
    that is facilitating the individual being influenced into taking the correction.
    For instance employees of an organisation in high-pressure roles are required
    to have complex passwords that are frequently changed then it should not come
    as a surprise to that organisation when employees start writing these passwords.


    +   - The manta of ''it''s not if you get hacked, when you get hacked'' serves
    a purpose of highlighting the risks of cyber-attack, but it also sends a message
    of being futile to try and protect yourself. Awareness and education campaigns
    need to provide the target audience with practical advice and sources for support
    that demonstrate cybersecurity threats can be avoided or at least mitigated through
    taking appropriate action.


    +   - Given the high volume of cyber-attacks that organisations are subjected
    to, and the fact that attackers often need one person in an organisation to engage
    with something like a phishing email for an attack to be selective, organisations
    need to create a culture where people feel they can safely report breaches. This
    type of organisational culture is partly set by the actions and statements of
    those in the leadership. Having a CEO disclose to employees that they themselves
    fell for a phishing email – then quickly notified IT when they had realised the
    mistake – would help create an organisational culture that supports reporting
    of cyber-risks.


    +   - Whilst allowing for the fact that it is impossible to completely prevent
    any cyber-attacks from occurring it is also the case that many, well-funded organisations
    continue to be the victim of cyber-attacks due to very basic gaps in their security.
    This is something that is frequently a cause of frustration for the hacking community,
    who feel these organisations should be putting more effort into protecting their
    security. This is particularly the case when the organisation holds data about
    members of the public. There is a need for organisations to understand the seriousness
    of cyber-risks, and to prioritise resources appropriately. It is telling that
    the Chief Technology Officer (typically the most senior person directly responsible
    for cybersecurity) is often not included on the Board of Directors of large organisations.


    +   - It is important to promote the concept of resilience, and to support individuals
    and organisations to develop relevant skills that empower them to adapt to any
    cybersecurity incident they experience in a way that will lead to a more positive
    outcome in future incidents.


    +   - Young people and others with an interest in hacking should be encouraged
    to develop these skills in a safe and legal way. There are legitimate resources
    available to support this, although at present there remain negative'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Conclusions and recommendations 127


    connotations about hacking, in which it is often assumed to be a criminal activity.
    This would help address the cybersecurity recruitment crisis, which refers to
    the lack of trained and qualified cybersecurity practitioners that has been documented
    in many countries.


    +   - There is a need for greater awareness of social engineering, which can be
    achieved through education and training campaigns in public and organisational
    settings. We would note that stories and examples of social engineering attacks
    can be as entertaining and of interest to people, as evidenced by popular books
    such as People Hacker: Confessions of a Burglar for Hire by Jenny Radcliffe (2023).
    As educating people about social engineering may be an easier task than attempting
    to engage with them on the more technical aspects of cybersecurity.


    +   - Prevention, harm reduction, and behaviour change campaigns can be successful.
    It is vital however that such campaigns are based on evidence from the research
    literature. Care should be taken not to implement for a behaviour change technique
    just because intuitively feels that it will be effective. Fear appeals for instance
    may be effective in some contexts, but in others may have the unintended consequence
    of causing employees to conclude that there is nothing they can do to avoid a
    cyber-attack, and therefore there is no point in even trying. In other words,
    behaviour change by itself is not necessarily difficult – it is changing the behaviour
    in the desired direction that is the hard part.


