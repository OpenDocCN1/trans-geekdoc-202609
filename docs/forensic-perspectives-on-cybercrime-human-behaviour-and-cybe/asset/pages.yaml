- pgno: 64
  md: '# 52 Attackers


    offline relationships just because the interactions primarily take place online.
    These groups appear to experience the same full range or group processes and conflicts
    have been recorded in offline groups. Indeed, it has been commented by cybercrime
    investigators that hacker ''drama'' can be leveraged to coax group members into
    revealing information that can then be used by law enforcement to identify and
    arrest group members (Troia, 2020). This type of conflict and drama are perhaps
    not surprising, considering the constraints that such groups must operate under
    compared to offline criminal groups. This includes difficulties in confirming
    the identity of their collaborators and limits to the enforcement of agreements,
    particularly because threats of physical violence may not be applicable in the
    online environment (Dupont & Lusthaus, 2022; Lusthaus, 2018). As discussed by
    Lusthaus, Kleemans, Leukfeld, Levi, and Holt (2023), it appears that cybercriminals
    have developed various strategies to attempt to overcome these barriers. This
    includes using closed forums, having members vouched for by existing members,
    and for members to provide evidence such as stolen credit cards to prove they
    are an active cyber (Dupont, Côté, Boutin, & Fernandez, 2017); Holt, Smirnova,
    Chua, & Copes, 2015; Soudijen & Zegers, 2012; Yip, Webber, & Shadbolt, 2013).
    It has been noted that these strategies do not always be effective, with instance
    members who lacked the requisite skillset never better able to gain access to
    the notorious dark web forum marketplace Darkode (Dupont et al., 2017). Cases
    such as this demonstrate a fundamental conflict experienced by cybercriminal forums
    and marketplaces – they need to provide their services and recruit new members,
    but also wish to avoid infiltration by law enforcement officials and competitors
    with malicious intent.


    The interconnectedness of the cybercriminal ecosystem provides opportunities for
    research and investigation. Lu, Luo, Polgar, and Cao (2010) demonstrated for example
    how social network analysis could be applied to understanding the characteristics
    of one hacker network Shadowcrew. They noted the presence of cliques in the network,
    with some members more involved in sub-groups than others. They also observed
    that despite being a decentralized network, members of Shadowcrew do not have
    equal status. Instead, different roles and power levels were evident, such as
    administrators, reviewers, moderators, vendors, and general members, indicating
    elaborate divisions of labour. This is similar to a team organisation structure,
    as defined by Bent and Luckenbach (1994). Other techniques have been used to study
    the cybercrime system include interviewing offenders and investigators (Hutchings
    & Clayton, 2016; Lusthaus, 2018), victim surveys (Williams, Lee, Burnap, & Gundur,
    2019), analysis of cybercriminal marketplaces and forums (Décary-Hét & Dupont,
    2012; Dupont et al., 2017) and employing data science and machine learning to
    collect data from cybercriminal settings (Pastrana, Thomas, Hutchings, &'
