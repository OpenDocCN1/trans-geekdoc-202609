- pgno: 55
  md: 'Identifying motivations of hackers is more difficult than conflicting reports
    and studies into the personality and demeanour of those involved in hacking. For
    example Woo (2003) observed high levels of narcissism and aggression in hackers,
    whereas Platt (1994) noted that as group hackers appeared to be quite amiable.
    Similarly, Bachmann (2010) states hackers appear to prefer rational thinking styles
    and problem solving, which contrasts the image—albeit curated by hacking group
    themselves—of hackers as unpredictable anarchists (Coleman, 2014). This perception
    of hackers as socially maladjust malcontents is partly due to the way in which
    hackers sometimes interact with each other. When looking online at discussions
    around hacking and activism, it is evident that many users communicate in an aggressive
    way (Olson, 2012). However, this may just be the way in which these groups communicate.
    Online interactions have been criticised as prone to several specific interpretations.
    For example, Poe''s Law has been described as an adage that any parodic or sarcastic
    statement made will be taken as sincere, unless the author''s intent is made explicit
    clear (Aikin, 2009). Nevertheless, in some cases it seems cyberattacks on some
    individuals and organisations are a case of displaced aggression (Pedersen, Bushman,
    Vasquez, & Miller, 2008). Motivations can also be fluid, and sometimes conflicting
    motivations for the same group or collective have involved in attacks. For instance,
    the distinction between targeting an organisation to address a perceived social
    injustice and doing it for personal enjoyment (i.e. for thelul) became a reason
    for in-group conflict in Anonymous (Coleman, 2014). In addition, more than one
    motivation could be present in the same individual. Whilst the members of Anonymous
    could be considered to be primarily motivated by activism, it has been reported
    that some members of the group also engaged in credit card fraud as a means of
    income. Of course, caution should also be taken when categorising hackers based
    on self-report of their identity and motivations. Presenting oneself as an ideologically
    motivated hacker fighting the greed of a large corporation is more socially acceptable
    than being a criminal who steals money. This reflects the observation by Rogers
    (2010) that those who engage in cybercrime cope with the cognitive dissonance
    this creates in four ways:


    +   - Using euphemistic language that minimises and distances actions

    - Blaming their actions on social pressures and claiming that, in the case of
    group actions, their individual contribution was minimal

    - Minimising or disregarding the negative consequences of their actions

    - Vilifying and dehumanising their targets, and stating that they deserved to
    be attacked'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# 44 Attackers


    Finally, there is the stereotype of hackers as being socially inept or being more
    likely than members of the general population to be on the autism scale. Such
    stereotypes should be viewed with some criticality. Rogers (2010) points out that
    social skills can take many forms, and people who may not be socially adept offline
    are. The social networks evident of hacking forums are complex and nuanced (McAlaney
    et., 2020), and those hackers who make use of social engineering techniques both
    offline and online demonstrate great social skills. Still, there continues to
    be debate on whether hackers are more likely than others to experiencing a psychological
    disorder and if so it is the presence of this disorder which leads to the individual
    becoming involved in hacking. Kirwan and Power (2013) argue that three factors
    are typically considered when determining if an offender is displaying a psychological
    disorder – discomfort, dysfunction, and deviance, which they note can be difficult
    to apply to real examples. Discomfort refers to whether the individual is experiencing
    distress that could be a contributory factor to their behaviour. If they are not
    experiencing discomfort, but are behaving in an abnormal way, then this could
    be an indicator of a psychological disorder, if they are experiencing discomfort,
    but not show signs of psychological distress, then they would also be considered
    as abnormal. Whether this can be applied to cybercriminals is complex. For example,
    a hackivist feels discomfort at the actions of a large multi-national company
    may use hacking techniques to cause harm to that. In doing so they are exhibiting
    a behaviour that is intended to decrease their discomfort, but the behaviour in
    question is an illegal. Dysfunction refers to if a person can manage their daily
    life effectively. As noted, some hackers may not engage fully with mainstream
    society, they can often have rich and extensive social relationships with others
    in the hacking world. In the case of cybercriminals, they use their skills and
    knowledge to generate an income – albeit an illegal one. Finally, deviance refers
    to any form of unusual behaviour. This is again difficult to easily apply to cybercrime,
    as it evolves rapidly, and the normal behaviours of someone with an interest in
    digital technologies may seem very unusual to someone who does not understand
    these technologies. For instance, the now ethical hacker Kevin Mitnik was imprisoned
    in his younger years in which it was erroneously claimed by the prosecution in
    his case that he could launch nuclear weapons by whistling into a phone (Burkman,
    2002). Overall, there are as many challenges in determining if cybercriminals
    exhibit any form of psychological disorder as those who commit traditional crimes.


    One potential avenue to better understand cybercriminals is to apply research
    into profiling, as has been done in forensic psychology to traditional forms of'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'crime. Nykodim, Taylor, and Vilela (2005) argue cybercrime profiling may be
    especially useful when dealing with insider threat, which refers to employees
    of an organisation acting in within to facilitate cybercrime intention-ally or
    unintentionally. This potential for increased profiling with members of an organisation
    is due to the increased information that is available in an organisation as opposed
    to public settings, as organisations are typically to monitor the device usage
    of their members more closely. This will be discussed in greater detail in Chapters
    5 and 6. One larger scale attempt to profile hackers were the Hackers Profiling
    Project (Chiesa et al., 2008). This work used a variety of data collection methods,
    including direct surveying of individuals identified as engaging in hacking. The
    authors note that the image of a ‘hacker’ is a blurry one but identify some commonalities
    from the data they collected. This included the observation that hackers are intelligent,
    creative, and resolute, with a high sense of curiosity and to find new ways of
    approaching challenges. This is consistent with work by McAlaney et al. (2020),
    who found that hackers appear to be primarily driven by a wish to understand online
    technologies and to test their boundaries, rather than by any fundamental to commit
    crime. Chiesa et al. (2008) also report that there are mixed motivations for engaging
    with hackers, and a range of systems on which it is acceptable to target cyber-attack.
    This is consistent with the work of Seebruck (2015), and illustrates the complexity
    of hacker identity and the challenges in attempting to construct profiles that
    can summarise hacker attitudes and behaviours. It is telling that hackers themselves
    express frustration with the term ‘hacker’, on the basis that it covers such a
    range of activities and identities to be meaningless (Thackray et al., 2017).
    This reflects wider frustrations that hackers have with stereotypes and media
    portrayals of hacking-such as the infamous scene from the television show NCIS
    dubbed by the hacking community as “Two idiots, one keyboard” which two characters
    attempt to prevent a cyber-attack by simultaneously typing on the same computer
    keyboard. This scene may have been attempt to portray the concept of flow, which
    appears to be a popular concept when hackers and cybersecurity professionals are
    depicted in the media. Flow refers to a state of effortless action that is felt
    when an individual is completely engaged in a task, and lose track of time and
    awareness of distractions (Csikzentmihalyi, 1990)–a state described in sports
    for example as being in the zone. Brewer (2001) argues that the flow state is
    part of the reason why people become involved in hacking, and further divides
    hacker motivation into four themes: i) compulsion to hack, ii) curiosity, iii)
    control and attention, and iv recognition and belonging to a group. Further, Brewer
    (2001) suggests that flow can occur in hacking when the hacker: i) perceives control
    over the interaction, ii) the hacker is paying full attention to the interactions,
    iii) the hacker is experiencing curiosity'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# 46 Attackers


    about the interaction, and iv) the hacker finds the interaction to be intrinsically
    interesting. Again, it is difficult to evaluate theories such given one against
    the reality of how hackers behave and communicate with the nature of the population.
    However, concepts of control and being in a flow state (albeit with the acknowledgment
    that this is not a phrase hackers themselves may use) would appear to be evident
    from the interactions that can be observed on hacking forums.


    # Group processes


    Hackers often begin by working on their own (Jones & Carroll, 2007), but soon
    develop relationships with other hackers (Scheell & Dodge, 2002). As discussed
    in Chapter 1, this can include participation in cybercriminal gangs and the wider
    cybercrime ecosystem. Most research on attackers within the cybersecurity space
    focuses on hackers, and to a lesser extent, social engineers. However, there are
    other types of cyber-attacks, such as harassment and bullying. Cyberpace has been
    described from the early days of the internet as a network of networks, highlighting
    how both processes within and between groups shape behaviour (Hughes, 1994). It
    has been established that associating with deviant peers is one of the strongest
    predictors of engaging in crime, both traditional crime (Pratt et al., 2010) and
    cybercrime (Holt, Russ & Bottler, 2010). This is consistent with social psychological
    research, in which it has been observed that a member of a group can influence
    an individual in several ways. People will tend to alter their behaviour and cognition
    to match the group (Kelman, 2006), which may be a factor in why hackers groups,
    particularly activists act collectively against the same target. Online groups
    also develop their own language and norms that are used to membership (Dobusch
    & Schoenborn, 2015), which is evident in the use of jargon, and memes within hacking
    groups (Coleman, 2014). Emotions can spread through a group to an individual,
    even if the individual was not involved in the original situation that caused
    that emotion (Smith, Geiger, & Mackie, 2007). This is again something that has
    been documented in hacking groups, especially activist collectives (Coleman, 2014).
    In those cases, the shared emotion often spreads through a sense of anger at a
    perceived injustice, such as businesses acting in an unethical manner. People
    are also more likely to conform to the viewpoints of others when they are in novel
    or uncertain situations (Spears, 2021). This could be argued to be the case with
    cybercriminal activities, where some group members – especially those who are
    younger, or less experienced in hacking – may not fully understand the situation
    they are involved in. However, relying on a group to'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Attackers 47


    determine the best action to take in an uncertain situation may not be wise. Individuals
    are known to make riskier decisions in groups than when alone (Wallach, Kogan,
    & Bem, 1962), but at the same time people also tend to underestimate how much
    they are influenced by the group (Darley, 1992). Whilst there is limited research
    in this area, it could be expected that people who become involved in hacking
    are especially vulnerable to underestimating how much they are influenced by others.
    The rhetoric amongst hackers often tends to be framed in terms of the hacker arresting
    an individual with anarchist qualities who are anti-Establishment. Somewhat counterintuitively,
    anonymity can also increase one''s sense of membership in online groups (Tanis
    & Postmanes, 2005). Caution should be taken however in making assumptions about
    participation in group-based cybercriminal activities. For example, police in
    Kazakhstan arrested a gang who were found to be forcing IT specialists to run
    cryptocurrency fashions (Tassev, 2022).


    The category model (Doise, 1978) suggests that identifying groups as being such
    (categories) can strengthen the sense of group membership. We may have different
    roles ''friend'', ''parent'', ''employee'', sports team member'', and in each
    we may play many parts to varying degrees. In each however we will have a different
    identity. Based on social identity theory, the group dynamics model suggests that
    people may derive self-esteem from the groups to which they belong (Marques, Abrams,
    & Serif, 2001). This is clearly demonstrated in street gangs where the gang may
    act as a surrogate-family purporting to provide peer acceptance, security, respect,
    and support from within (the in-group) and potentially inciting fear from others
    (the out-group) – although the anticipated protection does not materialise (Level,
    2012). Interestingly, ''initiation'' challenges individuals are asked to complete
    in order to be accepted and join a gang (to become part of the in-group) – such
    as some beating (Murer & Schwarze, 2022) – are an extreme, yet similar idea to
    ''challenges'' used in order for individuals to gain access to restricted sites
    and forums (e.g. on the dark web) – as knowing how to post a correctly formatted
    Triforce sign, an image that is associated with the Legend of Zelda videogame
    games (Bernstein et al., 2011). However, participation in cyber groups and their
    related criminal activities might not be voluntary. If, as discussed, individuals
    who get involved in hacking become immersed in the social world of hacking forums
    and communications then the sense of social identity may be an important source
    of self-esteem. This is something that should be considered when attempts are
    made to prevent people from becoming involved in criminal activities. Being part
    of that group may be very important to that individual and removing that source
    of support could have unintended consequences. It has been observed that most
    discussions that take place on surface web hacking forums stress to'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# 48 Attackers


    forum members – especially younger and less experienced hackers – that should
    not engage in illegal activities (McAlaney et al., 2020). The rhetoric used amongst
    hacking forums often tends to be framed in terms of the hacker being an individual
    with anarchist qualities who is anti-Establishment (Coleman, 2014). This may reinforce
    the affinity that group members feel with their hacking group, as it further signifies
    the idea of the group being distinct from mainstream society. Nevertheless, there
    are also cases where it has been alleged that group members have manipulated inexperienced
    hackers into committingcrime without fully understanding what they are doing or
    being able to provide an informed defence of their actions when identified by
    law enforcement. For instance, in the documentary We Are Legion it is suggested
    that less knowledgeable members of the hacktivist collective Anonymous were manipulated
    into taking the blame for cyber-attacks against the Church of Scientology (Knappenberger,
    2012). As identified by Deutsch & Gérard (1955) we are subject to both informational
    and normative influence, which means that we are driven to conform by a desire
    to be accepted by a group, and to accept the vision of reality put forward by
    that group. As such, people of hacking groups take part in actions that they would
    not have other wise done, particularly if they are actively targeted and moulded
    by other group members.


    Cybercriminal networks have important social dependency relationships (Leukfeldt,
    Kleemans, & Stol, 2017). Nurse and Bada (2019) observe that, despite being primarily
    identified as cybercriminal gangs, there often appears to be a degree of offline
    interaction between members. Hacking groups appear to be highly reliant on a sense
    of trust between members. Intergroup conflict can have a strong influence on the
    behaviour and self-identity of a group. In 2011 Aaron Barr, an executive at a
    digital security company HBGary, decided to demonstrate his skills by infiltrating
    Anonymous (Olson, 2012). His intention was to reveal the real-world identity of
    the group members, known as doxing, although it was later found that he had misidentified
    several family members. This prompted Anonymous to target Aaron Barr, and in doing
    so were able to hack into the HBGary system. This allowed them to identify Barr’s
    password, which they also ascertained as password for his Facebook. The group
    then hijacked Barr’s social media account and posted various embarrassing comments,
    including quotes from himself. In psychological terms this could be described
    as removing Barr’s impression to manage (Goffman, 1959), as controlling how he
    was seen by the world. Anonymous then released Barr’s home address, social security
    number and mobile phone number, after which he became subject to an escalating
    series of attacks. The attacks only began to cease after an appeal from Barr’s
    wife, who spoke about the distress that the situation was causing'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Attackers 49


    herself and their children (Olson, 2012). This conflict with an external threat
    appeared to reinforce Anonymous’ sense of cohesion and identity, and as such had
    the opposite effect intended by Barr – rather than disrupting the group caused
    them to act more cohesively and efficiently. In the same way that we make attributions
    at an individual level it has also been suggested that we make intergroup attributions
    (Hewstone & Jarspars, 1982). This could include attributing the success of the
    group to the skills and abilities of the members and attributing the success of
    the other group to external factors and luck. This could partly account for the
    confidence that Barr felt he believed he could successfully infiltrate Anonymous.
    It may also explain why members of Anonymous in turn felt safe in retaliating
    against Barr, in that they perceived themselves to be more skilled. While this
    may indeed have been the case, these members still exposed themselves to risk,
    with several individuals later arrested for their actions (Olson, 2012).


    The case of the conflict between HBGary and Anonymous – the numerous other examples
    of conflict between hacking groups, organizations and other hacking groups – involves
    several psychological processes. Given that most of the conflict happens online
    it is possible that a degree of disinhibition is present, which refers to how
    actions online do not feel as individuals actions offline (Suler, 2004). This
    may prompt individuals to act more aggressively than they would if they were engaging
    with that person face to face – a tendency otherwise known as being a keyboard
    warrior. Deinhibition may also be a factor, which refers to how individuals may
    have a reduced sense of individuality and autonomy in a group, although it has
    been observed that this can be a complex and unpredictable phenomenon (Reicher,
    Spears, & Postmes, 1995). Perceived social norms may be a further factor in shaping
    hacker behaviour. Social norms, in one form or another, are elements of several
    broad psychological theories of behaviour, including the Theory of Planned Behaviour
    (Ajzen, 1991) and social learning theories (Bandura, 1986). They are the perceptions
    and beliefs that we hold about us. This aspect of perception is an important one
    to note, as research has demonstrated that people often perceive social norms,
    with a tendency towards assuming their peers behave and think in ways that are
    more socially responsible than the case (Macaney, Bewick, & Hughes, 2011). These
    perceptions can also be fueled by minority influence, in which an individual is
    able to convince a group to adhere to the individual’s views and decisions, in
    contrast to the most expected process where the individual conforms to the group
    (Wood, Lundgren, Oulette, Busceme, & Blackstone, 1994). This can occur when the
    individual concerned is consistent and adamant in their view, which prompts the
    group to consider that the individual must be correct. In other words, people
    are aware that the norm is to conform'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# 50 Attackers


    a group opinion, so if they witness someone defying this social convention, they
    assume that they are doing so for a good reason. Reflecting this, it has been
    observed that individuals who appear to be confident in their opinions will argue
    against group consensus on hacking forums (McAlaney et al., 2020). Whether or
    not individuals are correct in their views is, another question. Overall, the
    conflicts that hacking and cybercriminal groups involve in appear to be in keeping
    with the type of conflicts studied throughout social psychology, such as the famous
    experiment by Sheriff in the 1950s, in which two groups of boys were manipulated
    into exhibiting inter-group conflict (Sherif, White, & Harvey, 1995).


    In another example of intergroup conflict, hackers have been observed to target
    other hacking groups due to their objections about how other group operates. For
    example, it has been reported the online harassment and stalking Kiwi Farms discussed
    later the that has been hacked, with the personal information of users released
    (Holt, 2022). This appeared to prompt some intergroup conflict, with users of
    the forum expressing their anger at the forum founder, Joshua Moon. The identity
    and motivation of the hackers are not known, but it could be commented that the
    act of doing individuals is something that would very much appeal to certain hacking
    groups who pride themselves on harassing people with. More broadly, hackers may
    target others because they exist in another country or culture that the hacker
    perceives as somehow inferior or amoral. It has been reported for instance that
    individuals express more willingness to hack and cause harm to foreign governments
    than their own (Bossler, 2021). This relates to the concept of patriotic hackers,
    who are groups or individuals who target foreign governments and organisations
    whom they perceive to be in conflict with their home country (Dahan, 2013).


    Whilst hackers, and particularly hacktists, are often involved in intergroup conflicts
    with external organisations of certain types there are other groups who focus
    their aggression being characterised at more specific targets. This extremist
    groups who, despite being characterised by views that are as far as it is possible
    to be, typically share xenophobic beliefs that there is a threat posed by ethnic,
    race, or religious groups (Perry & Blazak, 2010). T. J. Holt, J. D. Frederik,
    and S. M. Chermak (2017) argue that these movements of groups are under pressure
    to quickly demonstrate their adherence to the movement, partly due to their awareness
    of the conflict with that of mainstream society and the risk of infiltration by
    law enforcement agents. However, individuals lack the same options to signify
    group membership that are available in face-to-face interactions. As there is
    a greater reliance on using unique language within the groups, known as argot.
    This type of argot can be very evidence in some online groups, such as discussion
    on incel forums. Incel forum users'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'are assumed to be primarily male heterosexuals, but as noted in the literature
    there is some uncertainty over these (Jaki et al., Sugiura, 2019). Sugiura (2021)
    identifies the extensive vocabulary used within incel forums, which include Chads
    (the antithesis of an incel; a man who is sexually successful with women), Fem
    (a dehumanising term for women), JBW (just a white, a belief that women will primarily
    choose white males as romantic or sexual partners), and Trucel (a true incel,
    who has never touched a woman and is unable to have sex). Those who identify as
    incel on these forums further distinguishes them from mainstream society by discussing
    taking the red pill (among other colours) and awaken to the ‘reality’ that women
    run the world and they themselves will never be able to have a romantic or sexual
    relationship with a woman. The term ‘red pill’ comes from a community initially
    established on Reddit, which itself was a reference to the famous scene in the
    1999 film The Matrix, in which Keanu Reeves’ character is asked to choose between
    taking two pills – a blue pill, which will allow him to continue in his fake,
    simulated life, or a red pill that will show him the real world.


    A related phenomenon is the harassment of online figures and communities. One
    of the well-known online forums that facilitated this harassment was Kiwi Farms,
    which has previously been known as CWKi Forums. This community organised trolling
    and talking, and revealed (the real-world identity) of online personalities. It
    targeted women, LGBTQIA+ people, and neurodivergent people. This included some
    instances of harassment in offline settings (Plex, 2016). The group made of tragedies
    as the mass shootings in two mosques in Christchurch, New Zealand, in 2019 as
    the basis for their trolling and harassment. The actions of the group have been
    alleged to be a factor in the suicide of three individuals (Dress, 2022). Causing
    individuals to commit suicide over one of the stated aims to the group, with a
    counter of deaths they felt responsible for on their website (Veale, 2020). The
    forum was removed from the internet by internet providers who objected to its
    content, although at the time of writing it has also been able to regain an online
    presence.


    Intragroup conflict can also shape the actions of a group. This is exemplified
    by the revelation that a senior member of Anonymous was an informant for the FBI,
    which appeared to do extensive damage to the group (Coleman, 2014). Cybercriminal
    networks of the type discussed in Chapter 1 also have important social dependency
    relationships (Leukfeldt et al., 2017), with hacking groups also appearing to
    be highly reliant on a sense of trust between members (Thackray & McAlaney, 2018).
    Nurse and Bada (2019) observe that, despite being cybercriminals, there often
    appear to be a degree of offline interactions between members. This supports the
    argument between hackers and cybercriminals should not be seen as less valid or
    meaningful than'
