  md: '# Glossary


    **Artificial intelligence (AI)** Computer systems that can perform tasks normally
    requiring human intelligence, such as visual perception, decision-making, and
    participating in conversations in a meaningful way.


    **Big data** Data of size and complexity that it cannot be analysed using conventional
    means, such as the vast amounts of data generated every day by social media platforms.


    **Black/ grey/ white hat** Terms used to indicate the motivations and boundaries
    of hackers, from those who are criminals who will break into and/ or damage a
    computer system with malicious intent (black hat); those who will test computer
    systems for legitimate and ethical reasons (white hat); and those who combine
    legitimate and illegitimate practices (grey hat).


    **Botnet** A group of internet-connected devices that is used, often without the
    knowledge of the device owners, by attackers to carry out powerful attacks by
    cyber-adversaries such as the execution of a DDoS attack.


    **CaaS (Criminalware-as-a-Service)** A criminal business model in which criminals
    provide their knowledge, services, infrastructures, and software tools to other
    criminals.


    **Cryptocurrency** Decentralised digital currency that can be used as a form of
    payment online, with a greater degree of anonymity than in traditional currencies.
    One of the well-known cryptocurrencies is Bitcoin.


    **Cyberwarfare** Using hacking and/ social engineering approaches to cause harm
    and disruption among a population. This can include the creation and dissemination
    of **fake news**.


    **Dark web** Internet content that can only be accessed using specialised software
    such as **Tor**. Often associated with criminality but can also be used for'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# 130 Glossary


    legitimate purposes such as communication by journalists reporting from oppressive
    regimes. This is distinct from the **deep web**.


    **Data mining** The process of sorting through **big data** sets to identify patterns
    and relationships, which utilises techniques from **machine learning.**


    **DDoS (Distributed Denial of Service)** A type of cyber-attack in which the targeted
    computer system is overwhelmed and made inoperable by a high volume of internet
    requests, akin to attempting to refresh a webpage thousands of times per section.
    Often achieved through use of a **botnet**.


    **Deepfake** Fake but highly realistic images or videos created with the use of
    **artificial intelligence**. Often used as part of a scam or act of cyber warfare.


    **Deep web** Internet content that cannot be located or accessed using standard
    search engines, such as example databases containing medical records or school
    grades. This is distinct from the **dark web**.


    **Fake news** False or misleading information that is presented as fact, created,
    and disseminated with the intention of causing disruption, changing behaviour,
    shaping beliefs, or generating profit through advertising revenue. Often used
    as a tool for **cyber warfare**.


    **Hacker** An individual with knowledge of information technology and the skills
    necessary to use, and challenge, a computer system to achieve a goal or overcome
    obstacle. This is often with criminal intent.


    **Insider threat** The threat caused by the actions of a member of an organisation
    that either facilitates or causes a cybersecurity incident. This can be in the
    form of an unintentional insider threat (e.g., an employee clicking on a malicious
    link in a phishing email) or intentional insider threat (e.g., an employee deliberately
    stealing company secrets and selling them to a competitor).


    **Machine learning (ML)** A branch of **artificial intelligence** that involves
    using data and algorithms to imitate how humans learn, with the goal of improving
    accuracy over time.


    **Malware** Malicious software that is intentionally designed to cause harm to
    a computer system, by accessing sensitive data.


    **Penetration testing** A simulated cyber-attack on an organisation that helps
    organisation understand the gaps and weaknesses in their defences.


    **Phishing email** An email that attempts to trick or scam the receiver into performing
    an action that will facilitate a cyber-breach, such as disclosing sensitive information
    or clicking on a malicious link/ attachment that will install **malware** and
    compromise the targeted computer system.


    **Phishing website** A website designed to collect sensitive information from
    a target, which may also infect the target''s device with **malware**. Often these
    sites are set up to resemble a genuine and well-known website, such as a major
    social media platform.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'Ransomware Malicious software that is designed to encrypt the data held by
    an organisation, preventing that organisation from accessing their own data until
    a ransom is paid and the attackers provide the decryption key.


    **Script-kiddie** A type of **hacker** who relies on software written by others
    to hack. Such an individual may be lacking in a fundamental understanding of the
    technologies they are using to enable their hacking activities.


    **Server** A computer program or device that provides a service to other computers
    or their users, such as for example a bank server that operates the software and
    systems that the staff of that bank use for their daily work activities.


    **Spear-phishing** A phishing **email** that is specifically targeted at an individual
    or individuals, such as the senior management of a company.


    **Tor (The Onion Router)**** Open source and free software that enables anonymous
    internet communication. Often used in association with the **dark web.**


    **Virtual Private Network (VPN)** Software that protects users by encrypting their
    data and masks the physical location of the device being used.'
  merge: -1
  img_proc: true
