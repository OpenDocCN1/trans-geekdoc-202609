- pgno: 86
  md: '# Culture 5


    # Context


    Culture has been referred to as ''a slippery and ubiquitous concept'' (Birukou,
    Blanzieri, Giorgini, & Giunchiglia, 2009). It is a concept that it could be argued
    people easily recognise but struggle to vocalise. This chapter discusses the cultures
    that exist in an organisation and the national culture(s) that the organisation
    within, along with sub-cultures that may influence how an individual behaves in
    relation to cybersecurity.


    # Organisational culture


    As discussed throughout this text, humans are both the victims and instigators
    of cybercrime. This can create a multitude of challenges for organisations, in
    the form of both unintentional and intentional threats. For instance, AT&T employees
    took bribes to plant malware on the company''s network, resulting in a data breach
    (Cimpanu, 2019). Part of the reason that organisations are at risk of cybercrime
    is that internet technologies is a fundamental aspect of their business practice.
    Nine out of ten UK businesses and eight out of ten UK charities have some form
    of online presence, including bank accounts, customer data, or online payment
    processes (Department for Culture, Media and Sport, 2022). Even if an organisation
    protects itself from external online threats, it still likely employs individuals
    who themselves make use of the internet, and as are a potential threat. An example
    of this would be the case of a member of the Air National Guard in the USA who
    was arrested in relation


    DOI: 10.4324/9781003300359-5'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Culture 75


    to the leak of classified information from the US military (Matza, 2023). The
    information that leaked included US assessments of the war between Russia and
    the Ukraine, and sensitive information about American allies including Egypt,
    South Korea, and the UAE. The information was shared on a Discord server used
    by people to discuss video games. It has been reported that the airtight in question
    had been warned repeatedly about his handling of classified information, with
    prosecutors in trial claiming that the airman ''simply did not care'' about the
    instructions he received from his superiors (Halpert, 2023). It was also reported
    that the air would brag online about how he would violate rules on classified.
    Following this incident, the Pentagon announced greater security controls to prevent
    similar incidents happening in future (Bowden, 2023). This example raises questions
    on how the culture of that organisation enabled this individual to become an insider
    threat, and why swift action was not taken when he first breached security rules.
    It also demonstrates how challenging it can be to ensure that an organisation
    is secure – if a well-funded government agency with a high awareness of the importance
    of cybersecurity can experience such issues, then other organisations may face
    greater struggles. Overall, the factors that contribute to the cybersecurity of
    an organisation have been termed security culture (da Veiga, Astakhova, Botha,
    & Herselman, 2020).


    The leadership of an organisation can have a strong influence on organisational
    culture (Carpenter & Roer, 2022). There is the stereotype of the CEO of large
    organisations being confident to the point of arrogance and even to psychopathy
    (Babiak & Hare, 2006), something that social engineers have mastered is a factor
    they exploit and use against such CEOs (Hadnagy, 2018; Radcliffe, 2023). It should
    be noted that the relationship between leadership and personality is debated (Ykul,
    2002). It can also be challenging to ascertain how much importance the leadership
    of an organisation place on cybersecurity. Given the frequent reports of cybersecurity
    breaches in the media it is hard to imagine that the potential damage caused by
    a cybersecurity breach. This damage is not limited to the financial, but also
    include the reputation of the organisation. This can occur even if the actual
    data breach of the organisation is relatively harmless – for instance the IT system
    of a bank may have caused concern amongst customers of that bank, even if customer
    data was not part of the breach. Repeated reputational damage is one of the top
    cybersecurity concerns, along with data breaches and supply chain disruption (ISACA,
    2022). Therefore, if questioned, the leadership of organisations may feel that
    they are expected to demonstrate that they emphas the importance of cybersecurity.
    In support of this, it has been stated that out of ten businesses report that
    cybersecurity is a high priority for their senior management. However, it was
    also noted'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# 76 Culture


    a trend towards trusting and deferring details of cybersecurity approaches to
    IT staff and external providers, resulting in a lack of detailed understanding
    of cybersecurity within the leadership team. This type of attitude contributes
    to the perception of cybersecurity professionals that organisations often do not
    fully appreciate the threat posed by cybersecurity. Cybersecurity experts have
    noted that they often tell their clients that hackers are already in their system
    (Frenkel, 2016), as prompt the organisation to take cybersecurity measures in
    the system. This echoes the refrain mentioned in Chapter 1, namely that ''it is
    not if you get hacked, it is when you get hacked''.


    A priority for many businesses is how they are perceived by their competitors,
    investors, customers, regulators, and their own employees. This is one reason
    reputational damage from a cyber-attack is a major concern for many organisations.
    With individuals, organisations engage in impression management, in which the
    organisation attempts to shape how it is seen internally and externally. This
    includes which how they aim to be seen by their own employees. Jones & Pittman
    (1982) identified five tactics of impression management – ingratiation (to be
    seen as likable), self-promotion (to be seen as competent), exemplification (as
    staying at work, to be seen as dedicated), intimidation (to be seen as menacing),
    and supposition (to be seen as needed). The tactics used by an organisation depend
    on the impression they want to project, for example, a charity is unlikely to
    want to use the impression management technique of intimidation but may use supposition,
    as part of their appeal for donations to help those in need. As a social engineer
    may choose to frame their attack as a plea for help, as would be consistent with
    the charity wishes to project. In their review of the research literature, Bolino,
    Long, and Turnley (2016) identify the impression management behaviours that are
    used and within organisations, and assess the evidence base for them. They reported
    that ingratiation appeared to have mixed results, such as an employee attempts
    to ingratiate themselves with a more senior member of the organisation. While
    this may be initially successful, repeated use of ingratiation tactics can have
    a negative outcome. Similarly, the literature suggests self-promotion to appear
    an effective impression management tactic in some contexts but can come across
    as arrogance or bragging in other contexts. The authors give the example of the
    study by Cialdini (2001), who found that patients prefer it when doctors display
    their credentials and certificates on the wall of their waiting rooms. Again,
    such acts of impression management could be counterproductive – the information
    that individuals and organisations use is the same information that attackers
    and social engineers will be able to exploit.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Culture 77


    A challenge for organisations is the speed with which technology develops, and
    the complexity and fluidity of cyber-threats. This is something that smaller companies
    can find especially problematic, due to the lack of relevant resources and expertise
    (Fagble, 2023). However, larger organisations are not immune to these struggles.
    Organisations have also reported receiving information and guidance about cybersecurity
    from a wide range of sources, with varying use of threat intelligence (Department
    for Culture, Media and Sport, 2022). These sources include those provided by individuals
    in the cybersecurity community, such as Hackaged (https://www.hackagedaddon.com),
    which records details of high profile cybersecurity breaches, and PhishTank (https://phishtank.org),
    which curates examples of phishing emails. The availability of this information
    is positive, although it should be considered how individuals and organisations
    navigate this information can help understand what it is important to focus on.
    This, as reported by ISACA, cybersecurity challenges are further compounded by
    the difficulties companies have experienced in retaining qualified cybersecurity
    staff, a situation that appears to have been exacerbated by the COVID-19 pandemic
    (ISACA, 2022). These staff losses are especially notable in midcareer employees
    aged 35 to 44, with burnout also being evident among cybersecurity staff. In addition,
    approximately two thirds of organisations report taking three to six months to
    fill. The biggest gaps seen by employees, cited by 54% of them, are soft skills
    around communication, flexibility, and leadership. In relation to the threat landscape,
    over half of organisations surveyed believed it to be likely or very likely that
    most organisations would experience a cyber-attack in the coming year. However,
    it has also been noted that most organisations (82%) are confident in their ability
    to detect and respond to cyber-attacks, despite the gaps in recruitment. This
    again highlights a disconnect between the reality of cybersecurity threats and
    what appears to be the overly optimistic view that organisations have about their
    ability to protect themselves. It was also found that 80% of organisations reported
    a positive impact from education and awareness-programs, although it could be
    queried how impact is measured and quantified in these cases. As will be discussed
    in Chapter 6, there be a risk in assuming that an initial positive impact of cybersecurity
    training leads to meaningful, long-term change.


    Further sub-types of insider threat have been proposed that go beyond the two
    broad categories of intentional and unintentional insider threat, such as the
    taxonomy proposed by the CERT National Insider Threat Center (Capelli, Moore,
    & Trzeciak, 2012). The components of this taxonomy are as follows:'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# 78 Culture


    +   Information Technology (IT) Sabotage: use of IT to direct specific harm toward
    an organization or an individual


    +   Intellectual Property (IP) Theft: purposely abusing one’s credentials to steal
    confidential or proprietary information from the organization


    +   Entitled Endowment: an insider acting primarily alone to steal information
    to take to a new job or to / her side business


    +   Ambitious Leader: a leader of an insider crime who recruits insiders to steal
    information for some larger purpose


    +   Fraud: unauthorised modification, addition, or deletion of organisation’s
    personal data, gain of information that leads to an identity crime (e.g., identity
    theft, credit card fraud)


    Following a review of the literature, Georgiadou, Mouzakidis, and Askoun (2021)
    proposed key indicators for different types of insider threats, based on prior
    work by the CERT National Insider Threat Center (Cappelli et al., 2012). Dissatisfaction
    for example was identified in this model as being a motivating factor for becoming
    an insider threat. This policy and role awareness and situational awareness were
    found to be predictive of unintentional insider threat. This could suggest that
    a behaviour campaign designed to address these points could reduce the risk of
    unintentional insider threat. However it has been reported that surveyed most
    employees within an organisation understand cybersecurity policies and procedures,
    yet will continue to make errors (Tessian, 2020). Interest is to note how few
    of the identified factors for insider threat are individual and malleable behaviours.
    For instance, if individual resilience is, as previously discussed, an innate
    personality trait, then it could be challenging to change this in individual employees.


    Implicit in many of the studies of organisational resilience of the type described
    in Chapter 4 – often not directly stated – is the role of organisational culture.
    With resilience, organisational culture is a complex construct that has been defined
    and conceptualised in a multitude of ways in the research literature, with a high
    number of diverse components identified that can influence the culture of an organisation.
    This broader organisational culture strongly influences the information security
    culture or, in turn the cybersecurity behaviours and attitudes of members of that
    organisation (da Veiga, Astakhova, Botha, & Hershelman, 2020; Hassan, Ismail,
    & Maaroop, 2015); Mahfuth, Yussef, Abu Baker, & Ali, 2017). Aoyama, Naruoka, Kojishima,
    Machii, & Seki (2015) examined the role of leadership in resilience during a cyber
    incident handling task, in one of the limited examples of research that'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Culture 79


    directly links a component of organisation culture to cyber resilience. Following
    observations taken during a cyber incident handling training event, the authors
    reported that:


    +   - Complete assigned tasks vs overtake new events: the execution of the original
    task is often interrupted by another event.

    - Miscommunication: communication between task groups and managers increases the
    frustration, and leads to misunderstandings. The communication path prepared for
    normal operations is not enough in a crisis. Being stuck in a communication path
    can affect critical decision making too. A predesigned protocol for communication
    is key to control the situation. Also, over-communication should be avoided.

    - Prevention vs response task priority: the resources of the team should be allocated
    to prevention, detection, and response tasks in a balanced way. It is notable
    that the allocation should not be static.

    - Fix big security hole vs protect the critical production path: defence teams
    have a tendency to use quick fixes of easily noticeable security holes. The management
    must conduct risk/ impact analysis to determine the significance to the production
    line. In addition, with limited resources in the team, sometimes there is not
    enough resources to address two critical breaches.

    - Ambiguous responsibility of role (assumption): this challenge is highly related
    to the game''s nature. Even though rules are given to each participant at the
    beginning of the exercise, the responsibility to complete the task is up to them.
    Ambiguity of role definition leads to a gap or overlap between task groups. This
    challenge is linked to miscommunication.

    - Priority of entire game vs priority of market: when the situation becomes intense,
    management often lose their ability to foresee the long-term goal.


    The findings of Aoyama et al. (2015) are largely consistent with the conceptualisation
    of resilience in the previous chapter, as they incorporate short-term and long-term
    adversity, and highlight the importance of learning from past events and predicting
    future events. However, the findings also demonstrate the role of human factors
    in cyber resilience, and a system that is intended to be resilient can become
    derailed when human capacities and cognitions are not considered. The psychological
    factors that created issues in the training exercise observed by Aoyama et al.
    (2015) include attentional demands, cognitive overload, emotional arousal, role
    ambiguity, and decision making biases. Aoyama, Naruoka, Kojijima, and Watanabe
    (2015) discuss these findings in relation to the Context Control Model (COCOM),
    in which Hollnagel and Woods (2005) operationalised the concept of control. This
    model describes'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# 80 Culture


    four control modes: strategic, tactical, opportunistic, and scrambled. Under the
    strategic control mode, several goals are tackled; there is abundant time available
    to meet these goals; there is the opportunity for an elaborate evaluation of the
    outcome; and actions are selected based on models and predictions. The tactical
    control mode has some similarities, but greater constraints. The goals that the
    organisation is trying to achieve be more limited; the time available may be adequate,
    not abundant; and actions are selected based plans and previous experiences. Next,
    the opportunistic control mode can have one or competing goals, with just adequate
    time to achieve these goals and the opportunity for a concrete evaluation of the
    outcome. In this control model, actions are selected based habit and associations.
    Finally, in the scrambled control mode, the organisation is trying to achieve
    one goal, which might not be relevant to the required tasks. There is inadequate
    time to achieve this goal, the evaluation of the goal is rudimentary, and the
    selection of actions is random.


    Aoyama, Naruoka, Koshijima, and Watanabe (2015) applied COCOM to the management
    of a defence team in a cyber handling incident, noting that the control style
    changes during an incident, often unintentionally, moving from strategic to scrambled.
    This occurs through several mechanisms. For example, in the strategic control
    mode there are fewer cases of role ambiguity, but as the control mode moves to
    opportunistic or scrambled there is greater ambiguity, with individuals being
    unsure what their exact role should be in response to that incident. Similarly,
    communication is rare in a strategic control mode, less rare in the tactical control
    mode, frequent in the opportunistic control mode and confused in the scrambled
    control mode. This shift in behaviours and decision-making style under pressure
    is consistent with psychological research into cognition, specifically the use
    of heuristics and cognitive biases. As discussed in Chapter 2, this refers to
    when individuals make quick decisions based on limited information and prior assumptions.
    In doing so they are employing the cognitive miser approach, as opposed to the
    naive scientist approach in which individuals make more comprehensive and rational
    decisions (Fiske & Taylor, 2008). The strategy that individuals use to determine
    which of these cognitive styles is most appropriate to the situation is referred
    to as being a modest tactician (Kruglan-1996). It is interesting to note that
    cyber-attacks such as phishing emails and other social engineering attacks are
    designed to push the targets from a naive scientist style of decision to a cognitive
    miser one (Montanez, Golob, & Xu, 2020), and in so increase the probability of
    human error occurring (Bullee, Montoya, Junger, & Hartel, 2017). As it could be
    observed that there are parallels between the failure of resilience at a micro,
    individual level, and the failure of resilience at the macro, organisational level.
    It also suggests that behaviour change strategies that are designed to reduce
    susceptibility to social'
