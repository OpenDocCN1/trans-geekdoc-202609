- pgno: 71
  md: '# # Victimology and resilience 4


    # ## Context


    Cybersecurity breaches may often be seen as being technical in nature, however
    they invariably impact on people. The most obvious example is when an individual
    loses money through some type of breach of their bank accounts. However other
    forms of cyber victimisation exist. For example, an employee who unintentionally
    facilitates a cyber breach at an organisation during a social engineering attack
    may feel shame and guilt at it the breach. This will be discussed further in Chapter
    6 they may also be penalised by their organisation for their part in the attack.
    Even if no blame is placed on any individuals, employees in the organisation may
    feel increased anxiety and vulnerability over having been a breach. More broadly,
    cyber breaches of organisations and systems can undermine public trust in socio-technical
    systems, including online shopping, potentially affecting future sales, or electronic
    voting, impacting future engagement. As such can be multiple societal impacts
    of cybercrime that extend beyond the immediate harms to the targeted victims.
    Nevertheless, there remains relatively little research on victimology compared
    to traditional forms of crime (Halder, 2022). It has been argued that women and
    children can be considered the most vulnerable victims in cybercrime. This includes
    women from lower socio-economic backgrounds who are targeted by porn content dealers,
    a form of abuse that continues to impact the victim indefinitely beyond the creation
    of the materials. This impacts not only the individual victim, but also their
    friends and family (Halder, 2022).


    The role of employees in cyber breaches can broadly be separated into unintentional
    and intentional insider threat.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 60 Victimology and resilience


    an individual such as an employee clicks on a malicious link within a phishing
    email without realising they are exposing the organisation to risk. Similarly,
    an employee who unknowingly facilitates a social engineering attack by giving
    a social engineer information about the current state collection services used
    by a company could be considered an insider threat. Cases of human error can also
    potentially create insider threats, such as with the incident of a Japanese employee
    of a financial company, following a night of heavy drinking, lost a USB stick
    with the residents of the city of Amagasaki (it: BBC News, 2022). One of the challenges
    in preventing unintentional insider threat is the scale of the issue. As previously
    noted, it only takes one employee in a company to have a moment of intention and
    click on a phishing link for an attack to potentially be successful. Intentional
    insider threat on the other hand refers to when an individual deliberately takes
    action that causes harm to the organisation. This includes acts of revenge or
    industrial espionage of the type discussed in Chapter 2. The CERT National Insider
    Threat Center provides detailed definitions of these two types of insider threat:


    > [An insider threat is a current or former employee, contractor, or business
    partner who has or authorized access to an organization''s network, system, or
    data and has intentionally exceeded or intentionally used access in a manner that
    negatively affected the confidentiality, integrity, availability, or well-being
    of the organization''s information, information systems, or workforce. An insider
    is a current or former employee, contractor, or other business partner who has
    or had authorized access to an organization''s network, system, or data and who,
    through their action/without malicious intent causes harm or substantially increases
    the probability of future serious harm to the confidentiality, integrity, or availability
    of the organization''s information or information systems. (Brackney & Anderson,
    2004)


    The risk and harms caused by threat can be worsened by a lack of detection, slow
    response, and inconsistent remediation policies (Ko, Divakaran, Liao, & Thing,
    2017). Despite this, it has been argued that insider threats are an underestimated
    and under-addressed cybersecurity threat to organisations (Ponemon Institute,
    2020). Concern about this risk is also reported to have increased during the COVID-19
    pandemic, due to the rise of remote working (Tessian, 2020). The United Nations
    reported a 600% increase in malicious emails during the pandemic (Leader, 2020).
    Kemp, Bu-Gil, Moneva, Miro-Linas, and Diaz-Castano (2021) observe however that
    the relationship between reductions in online crime and in online crime during
    the pandemic were complex and nuanced. For example, it has been observed that
    cyber-attacks occurred during the height of the pandemic may have been undetected
    and'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'unreported as businesses dealt with daily challenges (Department for Digital,
    Culture, Media and Sport, 2021).


    As noted by Bossler and Holt (2013) it is difficult to get a sense of the scale
    of cyber victim due to several issues. Firstly, victims may not realise that they
    are victims. For example, the exact means by which a successful social engineering
    attack was conducted be something that a company is unable to ever establish,
    assuming that they are even aware that an attack has taken place. Secondly, those
    who are aware have been victimised may not report the incident and not believe
    the authorities will do anything, or think that they will be judged for having
    fallen for a scam or being caught by a phishing email. It has been suggested that
    men are likely to disengage with the criminal justice system if they perceive
    they are experiencing victim blaming following a cyber-attack, and women will
    often not report the crime at all, due to concerns of victim blaming (Halder,
    2022). This may be a valid concern for individuals to have – it has been observed
    that this is often a view by the authorities that victims of online fraud have
    themselves to blame (Villiers, 2009).


    # Risk factors


    There has been research into why people are tricked by social engineering attacks,
    with most work focussing on characteristics and individual differences that predict
    how people react to phishing emails. Early work in this field demonstrated that
    individuals do not look at key indicators of the legitimacy of a website, such
    as the address bar (Dhamjia, Tygar, & Hearst, 2006). In a study of 382 participants,
    Dhamjia et al. (2006) found a phishing rate detection rate of 65.63%, with only
    six participants achieving a 100% detection rate. There was a statistically significant
    correlation between participants'' confidence in their ability to detect a phishing
    email and their success rate at doing so, although many of those who were highly
    confident in their abilities were still fooled. Research has also found that there
    are factors which are predictive of cybersecurity behaviours that would occur
    unless practitioners take into consideration, as religious beliefs (Kelecha &
    Belanger, 2013). This reflects the fundamental challenge in assessing how much
    risk an individual is being a victim of cybercrime – humans are complex and predicting
    who will be a victim is no less challenging than predicting how an individual
    will behave in any situation.


    A further challenge in preventing people from becoming a victim of cybercrime
    is that digital technologies provide services and opportunities with an ease that
    is not always available offline, or even available at all. The benefits that these
    technologies bring could lead people to continue using them, even'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# 62 Victimology and resilience


    if they are aware they are at risk. It has been found for instance that people
    do not tend to alter their use of social network sites even if they have been
    hacked (O''Connell & Kirwan, 2014). This could reflect a conflict between the
    motivation to protect oneself and the motivation to impression management. Impression
    management was first described in 1959 (Goffman, 1959) and states that we all
    aim to influence others to see us in our desired way. It has been studied extensively
    in psychological research (Bolino, Long, & Turnbull, 2016), and as discussed in
    Chapter 3 is something that is heavily exploited by social engineers. This need
    to show how one is seen by the world through the sharing of information, and the
    desire to protect oneself from intrusion, is the privacy paradox (Utz & Kramer,
    2009). As technology becomes increasingly inter-connected and greater use is made
    of social media platforms it seems inevitable that people will feel pressured
    to manage how their identity is seen, which in turn provides with information
    that can be used as the basis for an attack. The permanency of information posted
    online can also be a factor – for example a post made by someone in their youth
    could potentially be used against them later in life when they are in a senior
    or sensitive position. It is interesting to note that companies now allow an individual
    pay to review and, if necessary, remove posts that individual has made over their
    life and which could be considered offensive.


    Research into demographics of cyber victimology has produced conflicting results.
    For example, studies have found both younger and older people to be at greatest
    risk (Sheng et al., 2010), with contradictory results found in other research
    studies (Maimon & Louderback, 2009), in relation to phishing emails (Lichtenberg,
    Sugarman, Paulson, Ficker, & Rahman-Filipak, 2016). In contrast, Reyns (2013)
    identified those at risk in the UK to be older, elderly or in one of the higher
    socio-economic groups. Lin et al. (2019) explored why older adults appear to be
    more) vulnerable to phishing emails. They note that older people are the fastest
    growing demographic group in many countries, such as the USA; they have accumulated
    wealth; and are more likely to be in positions of power and influence. This latter
    point relates to spear-phishing, in which senior members of a company are specifically
    targeted by social engineers and hackers, on the basis that such individuals have
    the most access to company systems. As such, the apparent increased rate of victimisation
    of older adults may least in part be an artefact of being at a disproportionate
    risk of being targeted by cyber-attacks. Cognitive processing in older adults
    may be reduced, although it is important to stress that there is a distinction
    between normal changes in cognitive processes with age and the development of
    medical conditions such as Alzheimer’s disease. In addition, older adults are
    naturally less likely to have experience of computers in their youth.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Victimology and resilience 63


    There is less research on the role of other risk factors. Lin et al. (2019) did
    not for find any relationship between race or ethnicity and likelihood of victimisation.
    It has been found that people who exhibit low self-control are more likely to
    have their password compromised, but are not at any different risk for other types
    of attack (Maimon & Louderback, 2019). Cognitive decision-making also appears
    to be related to likelihood of victimisation. Jones, Towse, Race, and Harrison
    (2019) argue that differences in working memory —ised by some researchers as being
    similar to short term memory — may be one reason why some people employ heuristics
    when reading a phishing email while others not. Jones et al. (2019) further note
    that in contrast to previous research they found no evidence that either personality
    traits or self-control have any influence on susceptibility. However, Kleitman,
    Law, and Kay (2018) have reported some evidence of personality being a risk factor,
    with openness being positively associated with susceptibility to phishing emails
    in some studies. In their study Kleitman et (2018) found that people whose first
    language is English were more likely to spot language mistakes in phishing emails
    which is not surprising. This highlights a risk in English being the facto language
    used for international business transactions in many parts of the world. Kleitman
    et al. (2018) also noted a significant correlation between self-reported ability
    to spot phishing emails and actual ability. Coupled with the heuristics and biases
    discussed previously, this could lead to peopleconfident about their ability to
    reduce their risk of cyber victimisation. This overconfidence is of course something
    that is often exploited by social engineers and other attackers.


    Lin et al. (2019) suggest that one of the reasons for the inconsistent results
    in risk factor is the use of self-report in previous studies, as this may not
    be a reliable methodological approach with which to collect data in some contexts.
    They report a discrepancy between people''s perceived and actual susceptibility
    to phishing emails, a gap that was more pronounced in older adults. A related
    methodological issue is that individuals may perceive their own abilities as well
    as how much risk they are. Rifon, LaRose, and Choi (2005) noted that users were
    more likely to ignore warnings about potential dangers if they deemed themselves
    to be effective at mitigating the effects of privacy breaches. This is a challenge,
    as it has also been found people tend to perceive themselves to be less risk than
    their peers (Schmidt & Arnett, 2005). Nieto and Rios (2019) argue that the data
    generated in cybercrime can be used to generate profiles of victims, as part of
    Human Factors Cybersecurity (HFC). However, one of the fundamental challenges
    in identifying risk factors for being a victim of cybercrime is that this requires
    complete and full knowledge of the activities that a person engages in, and how
    objectively risky these activities are.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# 64 Victimology and resilience


    Cybercriminals do of course often seek to hide the fact that they are trying to
    attack a victim, and in the case of social engineering, ideally wish their crime
    is never detected at all. Nevertheless, it may be that risk factors can be more
    easily identified in organisational settings, where the organisation can directly
    observe the behaviour of individuals. This can potentially be combined with analytical
    approaches using big data, as will be discussed in more detail in Chapters 6 and
    7.


    Specific types of cybercrime appear to be associated with specific risk factors.
    Whitty (2018) examined the psychological characteristics of people who have been
    victims of romance scams. A romance scam involves use of psychological manipulation
    to make the target believe that they are in a romantic relationship with the scammer.
    The scammer reigns an emotional relationship with the target, and then once this
    has begun to make requests for financial support, or access personal details such
    as social security credentials that can be used for identity theft and fraud.
    This can involve the creation of fake dating profiles. The majority of victims
    were to be middle aged, highly educated, and female, as noted by Whitty (2018)
    there are some conflicts in the literature. The consequences of being a victim
    of romance scams are not just financial losses but also the emotional trauma caused
    by betrayal and humiliation. Similarly, it has also noted that the victims of
    types of cyber-attack such as online hate are more likely to be women, those women
    with a public profile as content creators or entrepreneurs (Halder, 2022) and
    women who are targeted by male supervisors and colleagues (Tenório Júnior & Bjorn,
    2019). This can be impacted by culture, with women from non-Western cultures being
    less likely to seek justice for being a victim of cybercrime compared to their
    Western counterparts, due to lack of awareness, fear of social taboos, and lack
    of digital empowerment (Halder & Jaashankar, 2012). In contrast, it has been suggested
    that men are more likely to be victims of sextortion, where the victim is coerced
    into committing sexual acts on webcam and subsequently blackmailed with threats
    of release of this footage to friends, family, and colleagues (Aitken, Gaskell,
    & Hodgson, 2018). Overall, Halder (2022) report that women are more likely to
    experience severe forms of cybercrime including interpersonal cybercrimes, dating
    scams, cyber sexual offences, data privacy infringement, reputational damage,
    and physical assault on the basis of cyber. Conversely, men are more likely to
    experience cybercrimes that include lottery scams, e-commerce frauds, recruitment
    for terrorism purposes, online racial hatred and hate speech, and sextortion.
    In both cases, men and women aged over 50 may be at an increased risk of banking
    frauds (Halder, 2022).


    Jeffries and Apeh (2020) note that there are several differences in investigating
    crime online as opposed to offline crimes. This is complicated by lack of'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Victimology and resilience 65


    standard operating procedures for investigation and training for police officers,
    along with a focus on child protection topics and work on other forms of cybercrimes.
    The inclusion of civil resources may also be something that could be done to a
    greater extent, as proposed by Chung et al. (2006). It has been suggested that
    cybercrime prevention and investigation strategies are already being handled by
    agencies outside of government and law enforcement. Sikra, Renaud, and Thomas
    (2023) propose the term Responsisable Non-Policing Agencies (RNAPs) to refer to
    such agencies, which are identified as commonly consisting of a mixture of charities
    and banks. These RNAPs place a buffer between the victims of cybercrimes and the
    state and police. As Sikra, Renaud, and Thomas (2023) observe there are both costs
    and opportunities associated with this role of RNAPs in cybercrime victimisation
    and reporting. RNAPs may have more expertise and greater experience of cybercrimes
    and may have lower costs than the police, but victims themselves feel support
    from specialised police officers over RNAPs. Overall, they characterise the use
    of RNAPs as resulting in higher volumes of lower quality work done, and the use
    of specialised policing as resulting in lower volumes of higher quality work done.
    Seems to be a recurrent theme throughout all aspects of cybersecurity, there is
    an unavoidable trade-off between efficiency and cost.


    Overall, there are many challenges in reducing the risk that people face becoming
    a victim of cyber-attack. Given the scope of cyber-attacks and the skill of attackers
    in targeting them, there is an argument that it is not fact possible to completely
    remove risk. The former CEO of Equifax, Richard Smith, faced criticism when testifying
    to Congress following a serious customer data breach at the company, with the
    comment that “I don’t think we can pass a law that fixes stupid” (Rushe, 2017).
    Whilst it is not constructive to label people who have been a victim of a cyber-attack
    as lacking intelligence – keeping in mind that the victims of cybercrime have
    senior staff at technology companies — there is a broader point that human error
    will always occur. As discussed in Chapter 2, the cognitive biases and heuristics
    that humans use to navigate our social world, and which social engineers seek
    to manipulate, have evolved to serve a purpose. As will be discussed further in
    Chapter 6, it is important that prevention and behaviour-change strategies aim
    to reduce the risk of cyber victimisation taking into consideration the underlying
    reasons for risk factors.


    # Resilience


    If it is accepted that cyber-attacks are common, and that anyone can potentially
    become a victim, then the next step is considering how individuals and organisations
    can be resilient to these threats. Resilience has been defined in various'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# 66 Victimology and resilience


    ways in the research literature, but most definitions share the same conceptualisation
    of resilience as being a positive adaptation in the face of adversity (Sutcliffe
    & Vogus, 2003). Resilience has been considered at an individual level as a stable
    personality trait, state-like developable capacity, or a process (Kossek & Perrignano,
    2016). It is of note that these latter conceptualisations suggest that resilience
    is malleable, as opposed to a fixed trait, which the topic of behaviour change,
    which will be discussed in Chapter 6. These differing concepts are reflected in
    the diversity of scales that have been developed to measure resilience (Hartmann,
    Weiss, Newman, & Hoeg, 2010). Similarly, Fisher, Ragsdale, and Fisher (2019) argue
    that resilience mechanisms can be best understood as those experiences, reactions,
    and behaviours that individuals apply in the face of adversity, such as coping
    strategies or emotional responses. In support of these arguments, several individual
    factors have been identified in the research literature that could be linked to
    resilience. These include conscientiousness and self-efficacy (Lyons, Schweizer,
    & Ng, 2015), business confidence (Yang & Danes, 2014), locus of control (Stevenson,
    Phillips, & Anderson, 2011), reflective ability (Kinman & Grant, 2010), emotional
    intelligence (Förster & Duche, 2017), and work related attributes (Badran & Youssef-Morgan,
    2015). Working in a military context, Lee, Sudom, and Zamorski (2013) noted that
    there appears to be complex relationships between psychological resilience and
    potential protective factors in Canadian military personnel, although conscientiousness,
    emotional stability, and positive social interactions appeared to be important.


    Team resilience considers resilience as a collective phenomenon that is conceptually
    distinct from individual resilience (Carmeli, Friedman, & Tishler, 2013). As it
    is something that would appear to be especially relevant to organisational culture
    and organisational-level behaviour change strategies, although it compared to
    individual resilience, the concept of team resilience is less developed (Bowers,
    Kreutzer, Cannon-Bowers, & Lamb, 2017). Hartmann et al. (2020) argued that predictors
    of team resilience can be grouped in terms of emotions, interpersonal processes,
    and structural aspects of the group. They also note that a group consisting of
    individually resilient team members does not necessarily result in team resilience,
    which highlights the important of organisational culture and how the members of
    an organisation communicate and interact with one another. Although research specifically
    on team resilience is lacking, research on other collective-level constructs,
    such as collective efficacy or collective creativity, has demonstrated the importance
    of explicitly accounting for contextual, relational, and interactive aspects of
    teams (Bandura, 2000).


    It has further argued that resilience should be considered in the context of the
    circumstances in which resilience is being evoked. This could'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Victimology and resilience 67


    consist of isolated by high-intensity circumstances (for example a crisis such
    as a cyber-attack), or may consist of high-frequency, high-duration circumstances,
    such as ongoing work stress (Hartmann et al., 2020). This is consistent with research
    in the literature that suggests the experience of resilience is specific to the
    domain and context in which it occurs, for example in the work-place or one’s
    personal life (Todt, Weiss, & Hoegl, 2018). In an attempt to chart this diverse,
    interdisciplinary research literature, Linnennecke identified five streams of
    research into organisational resilience, as based on bibliographic mapping of
    the literature (Linnencke, 2017);


    +   - Organisational resilience in relation to crisis management, e.g., Williams,
    Gruber, Stutcliffe, Shepherd, and Zhao (2017)

    - Occupation specific aspects of employee resilience, e.g., Kosek and Perrigo
    (2016)

    - Differing conceptualisations of employee resilience and resilience building
    programmes, e.g., Britt, Shen, Sinclair, Grossman, and Klierger (2016)

    - The development of resilience as a behavioural capability, e.g., Kuntz, Malinen,
    and Näsväll (2017)

    - The effectiveness of resilience-building programmes in organisations, e.g.,
    Vanhoe, Herian, Perez, Harms, and Lester (2016)


    These five strands of resilience demonstrate the differing focuses and underlying
    positions of studies in this field. Firstly, there is difference between resilience
    vs organisational/ team-based resilience. Secondly, there is difference between
    resilience as an individual and fixed personality trait vs resilience as a malleable
    capability. Finally, there is difference between resilience as a response to a
    crisis vs resilience as a long-term strategy. These differences create challenges
    in coming to a cohesive view on what resilience is, and how it should be applied
    to behaviour change and harm reduction in cybersecurity. Methodological limitations
    have also been identified within the literature. As Hartmann et al. (2020) state
    there is a lack of clear understanding on how the theories often cited in relation
    to organisational resilience underpin the process of developing resilience. As
    discussed in Chapter 6 this has parallels with the research relating to behaviour
    change, where it has been observed that it is not always clear how theories of
    behaviour are used to implement behaviour-change strategies. In addition, there
    are issues around the reliability and validity of the instruments used to measure
    organisational resilience, which is in part due to the different ways resilience
    has been conceptualised.


    There is relatively little research on resilience specifically in the content
    found to focus on cybersecurity contexts, with a handful of authors being responsible
    for most of the substantive work that has been undertaken. Resilience is'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# 68 Victimology and resilience


    discussed in this literature as a technological process. For example, Petrenko
    (2019) proposes the following definition: “Cyber Resilience is an ability of the
    cyber-system functioning, according to a certain algorithm, in order to achieve
    the operational purpose under the intruder information and technical influences”.
    Petrenko (2019) states that resilience in cyber systems can further be considered
    in terms of active and passive resilience. Active resilience is composed of factors
    such as reliability, response and recovery, and survivability. It is inherent
    in complex systems where behaviours are based on a decision to act. That, there
    is a preferred state of system which is achieved through purposeful behaviour.
    Passive resilience on the other hand is composed of factors such as strength,
    balance, and homeostasis. It is inherent in a simple system, where that the fewer
    decisions required the less of an opportunity there for social engineers and attackers
    to manipulate decision making processes to their advantage. However, businesses
    must often change their practices to adapt to societal and financial demands,
    as well as changes in technology. As such, an organisation seeks to be resilient
    to the impact of cyber-attacks to consider this as being a long-term requirement
    that requires continual review and revision.


    Wood and Hollnagel (2006) put forward an engineering-based view of resilience
    that is relevant to the cyber context and is based upon four factors that are
    intrinsic to the system that users are engaging with:


    +   1. Ability to learn: learn from past events (factual), understand what happened
    and why;

    2. Ability to respond: respond to act (regular and irregular conditions) in an
    effective, flexible manner;

    3. Ability to monitor: monitor short-term developments and threats (critical),
    as well as revise models; and

    4. Ability to anticipate: anticipate long-term threats and opportunities (potential).


    This conceptualisation does acknowledge the human factors in resilience through
    recognition of the importance of the ability to learn from past events, but nevertheless
    the conceptualisation is focussed primarily on technical and systems issues. This
    is consistent with one of the few studies on cybersecurity resilience in a military
    setting, namely a NATO founded study on cybersecurity resilience in the Arctic
    (Tross, Hossain, & Linkov, 2020). In that the role of human factors was again
    acknowledged, but not seen as a resource to be built upon. This is consistent
    with observations that have been made that cybersecurity research often treats
    humans as the problem rather than being part of a potential solution to cybersecurity
    challenges (Zimmermann & Renaud, 2019). Aoyama, Naruoka, Koshijima, Machii, and
    Seki (2015a)'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Victimology and resilience 69


    mapped cyber resilience factors, common security activities, and broader resilience
    factors. Cyber resilience factors were grouped into prevention, detection, and
    response. Common security activities and corresponding resilience factors are
    identified under each of these resilience factors. For example, security activities
    under prevention include threat analysis and forecast, with the appropriate resilience
    factor being to anticipate. Detection cyber security activities include monitoring
    and intrusion detection, which come under the resilience factor of monitoring.
    Finally, cyber resilience related to response includes activities such as incident
    reports and impact analysis, with regard to the two resilience factors of responding
    and learning. This point of learning from a cybersecurity incident is something
    that ethical social engineers stress is an extremely important post for organisations
    to engage with, although they also note that this does not always seem to happen
    (Radcliffe, 2023). By constructing mapping, Aoyama, Naruoka, Kojishima, Machii,
    and Seki (2015) also note that the human contribution of cyber resilience is limited,
    which they propose due to the difficulties in observing organisations'' responses
    to actual cyber-attacks. As they comment, training exercises are instead used
    to explore cyber resilience. However, despite this great focus on human factors,
    the classification they propose of cyber resilience is still primarily on technical
    and systems aspects.


    Overall, the literature on the conceptualisation of resilience could be split
    into research that considers resilience as an individual, psychological construct,
    and research that considers resilience in terms of the system in which humans
    operate, with a focus on technological elements. Not surprisingly, research that
    uses the former conceptualisation from social sciences disciplines, whereas the
    latter conceptualisations are more evident in computing and IT sources. The research
    specifically on cybersecurity resilience is a small subset of the wider research
    on organisational resilience and is based primarily on the technology and systems
    focussed conceptualisations of resilience. Aspects of how to increase resilience
    of both types will be discussed in further detail in Chapter 6.


