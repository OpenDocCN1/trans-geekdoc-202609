- pgno: 104
  md: '# 92 Behaviour change prevention


    The concept of behaviour change to improve cybersecurity is of a broad topic and
    a recognised challenge in the field. It is also an issue that, from a computing
    and IT perspective, often takes the aforementioned position of viewing humans
    as the problem rather than part of the solution (Zimmermann & Renaud, 2019). However,
    much of the behaviour change literature has been applied based upon studies from
    social and health psychology, which typically take a more holistic approach in
    the idiosyncrasies of human behaviour are acknowledged and understood (Adams,
    Cost, Jung & Choudhary, 2015). Adams et al. (2015) also observe that most behaviour
    change approaches in human computer interactions rely on what he terms ‘reflective
    mind’, where the person is assumed to think carefully and deeply about their behaviours.
    This relates to the previously discussed concept of heuristics and cognitive biases
    raises an important point when considering research into cyber change. It may
    be that the behaviour change strategies typically used within cybersecurity assume
    individuals are a naïve scientist style (i.e., rational and contemplative) when
    the cyber-attack itself is pushing the targets to the cognitive miser style of
    decision-making (i.e., quick and superficial).


    Despite the extensive evidence base for behaviour change in health and social
    psychology there are methodological and theoretical issues to consider when applying
    this to cybersecurity. Davis, Campbell, Hilden, Hobbs, and Michie (2015) argue
    that many behaviour change interventions reported in the literature may be on
    a theory, but in many studies the application of the theory is poorly done. This
    is similar to the comment of Michie, van Stral, and West (2011), who observe that
    behaviour change interventions often appear to be a common-sense approach, rather
    than being based heavily on psychological theory. Davis et al. (2015) found that
    82 different theories have been found in the behaviour change research, across
    a range of behavioural domains. Of these theories four were found to be the most
    widely used: The Transtoretical Model of Change (Prochaska, Johnson, & Lee, 2009);
    the Theory of Planned Behaviour (Aizen, 1991); Social Cognitive Theory (Bandura,
    2003); and the Information-Motivation-Behavioural-Skills Model (Fisher & Fisher,
    1996).


    There is overlap between these theories, and elements in each that would appear
    to be relevant to cybersecurity. The Transtoretical Model of Change (Prochaska
    et al., 2009) states that behaviour change occurs through a series of steps, including
    pre-contemplation, contemplation, preparation, action, and maintenance. This linear
    and sequential approach may be desirable for organisations who wish to bring about
    behaviour change in an ordered manner. However, the model does assume that no
    further action is required once the desired change is achieved. This may not be
    advisable in the case of cyber threats, where the nature of the attacks and the
    attackers are continually evolving. The Theory'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Behaviour change prevention 93


    of Planned Behaviour states that behaviour is a result of attitudes, subjective
    norms, perceived behavioural control, and intention. This concept of behavioural
    control fits with the aforementioned research that has linked locus of control
    (the degree to which individuals perceive they have control over their own actions)
    to cyber resilience. It also relates to the COM-B model of behaviour change (Michie
    et al., 2011), which, as discussed, argues that behaviour is influenced by the
    capability and opportunity that the individual perceives themselves to have. Finally,
    the Theory of Planned Behaviour differentiates between the intention an individual
    has to conduct a behaviour and the actual execution of behaviour. As be discussed
    further, this could be an important distinction, given the research evidence that
    suggests cyber behaviour change campaigns are successful in raising awareness
    and knowledge do not subsequently produce behaviour change. Social Cognitive Theory
    (Bandura, 2003) also includes capability as a component, which it differentiates
    from self-efficacy, which relates to how much an individual perceives themselves
    to be able to change their behaviour. It is important to highlight that the individual''s
    perception may not match their actual ability, and indeed many behaviour change
    campaigns are based upon Social Cognitive Theory aim to pursue the target audience
    that have more control over their own actions they may perceive. Finally, the
    Information-Motivation-Behavioural-Skills Model states that behaviour is a result
    of the skills, knowledge, and motivation of the individual. While this model was
    developed to understand health behaviours may be applicable to cybersecurity behaviours,
    particularly given the ways towards describing protective cybersecurity behaviours
    in terms of cyber hygiene (Nckubei, Mwansa, & Rocaries, 2020). Cyber hygiene refers
    to the practices and steps that individuals can take to ensure that a computer
    system remains healthy and safe (Kioski, Fotis, Nakos, & Mouridis, 2023). This
    rephrasing of cybersecurity could be considered an attempt to encourage individuals
    to see cybersecurity as a more personal issue that they have an investment in,
    as opposed to something that is solely the responsibility of the IT department
    to deal with. It may also help encourage the application of the extensive evidence
    base from health psychology research to behaviour changes within cybersecurity,
    although this remains to be. As an observation, it does seem that the cybersecurity
    profession – or at least those whose background is primarily in computing – do
    not fully appreciate the knowledge and expertise that can be provided by psychology.
    This is in part due to the misconceptions that those from computing backgrounds
    have about psychology, as has been noted in relation to the education of students
    who are completing computing degrees (Taylor-Jackson et al., 2020).


    Bada et al. (2015) identified the psychological theories that have been used to
    inform cybersecurity behaviour change. Both the Theory of Planned Behaviour'
