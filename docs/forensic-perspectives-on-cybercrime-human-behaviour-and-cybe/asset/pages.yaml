  md: '# # Emergent technologies and future directions


    # ## Context


    As discussed throughout this book, an ongoing challenge in cybersecurity is that
    technology continues to evolve and change. At times this can seem to happen very
    rapidly, such the sharp rise in prominence of artificial intelligence (AI) in
    2023 (Heilweil, 2023). As will be explored in this chapter however, opportunities
    can also be provided by such technological advances.


    # ## Eye tracking


    One example of how technology could be used to enhance cybersecurity is eye-tracking.
    Eye movements can reveal a great deal of information about the cognitive state
    of an individual, what they are looking at (endogenous cueing), what attracts
    attention (exogenous cueing), and the interaction between these components. While
    there is no one-to-one mapping between where someone is looking and the intention
    to process it the correlation between is very high, especially for reading. Different
    eye movement metrics measure different aspects of cognitive/ emotional processing
    (Nam, Hong, Chung, & Noh, 2022). ''Dwell time'' measures how long a participant
    focuses on a particular point and typically indicates its importance to the current
    task. ''Fixation count'' is the number of times a particular part of a stimulus
    is looked at. The more fixations, the more active processing is engaged in. However,
    the longer the individual fixation (glance duration), the more holistic the processing.
    When a participant looks at an area, then looks away, then'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Emergent technologies and future directions 113


    returns to it (a regression), this suggests Guo, (2012) that it was not fully
    pro- cessed the first time and requires re-encoding-potentially due to the novelty,
    sur- rising nature of the stimulus, or the difficulty which processing entails.
    Sacc length (quick eye movement between two or more fixation points) is known
    to be affected by participants'' internal states, such as those under stress have
    shorter saccades (Nam et al., 2022), or processing less predictable information
    (Liu, Tong & Su, 2020). Indeed, unpredictability of eye movement patterns mea-
    ured through Markov chain models can be used to establish how well someone knows
    to code a stimulus, which provides insight into how that person has perceived
    processed the information presented to them (Shang, Lu, Wu, & Wei, 2021). Further,
    eye movement differences can be used to classify depressed people from non-depressed
    people (Zhang et al., 2022) and those at risk of simulated driving accidents than
    others (Li, Fan, Ren, Zheng, & Yang, 2021).


    Traditionally, eye tracking has been done using laboratory-based track- ing equipment.
    Equipment is highly accurate; however, these track- require the participant to
    sit in a fixed position in front of a screen, often entails a visit to a specialist
    site. Most recently, there has been a move towards conducting eye tracking through
    laptop and PC webams, or smartphone cam- eras. This is an emergent technology
    that utilises the higher resolution available in web cameras to conduct eye tracking
    within an individual''s home or workplace; doing so it potentially creates a more
    natural setting. This is highly relevant to cybersecurity, where it has been demonstrated
    that cyber- security behaviours such as engagement with phishing emails is dependent
    on the social environment in which a person is placed (da Veiga, Astakhova, Botha,
    & Hershelman, 2020). As there is potential for webcam-based eye tracking to be
    used better understand how individuals engage with phishing emails. However, the
    research on this topic to has several limitations. There is a lack of research
    that has explored the use of webcam-based eye tracking application in relation
    to phishing emails on smartphones. In addition, there is a lack of research that
    has compared the efficacy of webcam-based eye track- ing on laptops/ PCs/ smartphones
    with lab-based eye tracking equipment. The research that has been done typically
    used relatively small sample sizes of less than 50 people, which limits the generality
    of the findings. Finally, research has often been from a computing perspective,
    lacking the interdisci- disciplinary insights that can be obtained by including
    psychological theories.


    # Big data, machine learning, and artificial intelligence


    Big data refers to data that is so extensive that it cannot be stored, processed,
    shared, and analysed by conventional means and in a reasonable timescale.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Emergent technologies and future directions


    This is however somewhat context dependent. A 50mb file for example may not be
    a particularly large file in light of the amount of data people use on a daily
    basis, yet many email systems will not permit a file of that size to be attached.
    Often though big data is used to refer to data that is vast, generated by activities
    individuals engage in which generate data. For example, the collective data from
    all fitness devices used in a population provides a large amount of information
    which could potentially provide researchers and healthcare providers with insights
    into health behaviours that would be very difficult to collect in traditional
    ways. Another common source of big data is how employees engage with a company
    with their IT systems. This can include a multitude of different types of information,
    such as the times that employees are active on the system, and the emails and
    messages they send, the functions they perform, and their productivity varies
    throughout the day. For cybersecurity, this data could include metrics such as
    the time between an email opened and responded to, whether employees are attempting
    to access files they should not, and if there are patterns of certain employees
    clicking on phishing links than others. One form of big data is generated by social
    media. As was discussed in Chapters 1, 2, and 3, social media information provides
    many opportunities for cybersecurity and cyber warfare attacks, such as the use
    of social media bots to spread fake news. Erole, Gibson-Robinson, Goldsmith, and
    Creese (2016) explored whether it is possible to separate real people from fake
    accounts by looking at the consistency of information provided by that person
    across different platforms. They found that this was indeed possible, demonstrating
    there are limits to how human software bots appear to be. Adjer and Kelley (2018)
    note that psychologists have not taken full advantage of the benefits offered
    by big data and machine learning, in part because of the uncertainty and perceived
    risks around using these technologies. They also argue that the increasing availability
    of open-source research tools makes it easier than most psychologists realise
    to use big data and machine learning, and that there is a greater diversity of
    opportunities for using these technologies to tend to be appreciated.

    Landers, Brusso, Cavanaugh, and Colmus (2016) argue big data has advantages to
    data collected through more traditional methods. Firstly, the data is primarily
    behavioural, instead of self-report data from surveys and questionnaires. This
    is something that may be especially beneficial when looking at cyber behaviours.
    Many of these behaviours are things individuals could know either they are doing
    (e.g., having complex passwords) or not doing (e.g., clicking on links before
    properly checking the sender address). As such, self-report measures may not be
    entirely reliable, particularly in the case of employees being questioned by their
    organisation. Secondly, the sample size that can be obtained from big data sources
    is substantially larger than that which'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Emergent technologies and future directions 115


    can typically be achieved through traditional data collection means. Recruiting
    a sufficient sample to understand a phenomenon, whether for academic research
    or for internal research for an organisation, is a frequent challenge. Even when
    individuals are motivated to provide data, they may not have the time to be fully
    engaged with the data collection process. As big data is typically composed of
    information that has already been collected, such as computer records of employee
    behaviour within an organisation, no additional action on the part of the individuals
    to be required. As it is also attractive to potentially using less time and fewer
    resources, instead using secondary data which is already available. Thirdly, the
    people from whom the data is collected are not aware of this, and a consequence
    issues such as demand characteristics are reduced. The concept of demand characteristics
    comes from research studies and to participants being aware of what a researcher
    is investigating or expects to find. This can lead to the participant doing what
    they think they should (e.g., saying they would not click on an unknown email
    in reality they may) or acting in a way that they will please the researcher (Orne,
    1996). Alternatively the participant may respond in a way that counts to please
    the researcher addresses, a phenomenon identified by Masling (1966) as the ‘screw
    you’ effect. These processes have primarily studied in relation to participation
    in academic research studies, it is possible to see how they may arise when individuals
    are surveyed about their cybersecurity beliefs and behaviours. Fourthly, data
    can be collected at a speed that would normally be possible. In many cases, the
    data may already exist. For instance, if there is a desire to explore whether
    a piece of fake news is spreading on social media then it is often possible to
    access this data immediately through software tools that can access the data from
    social media platforms. Finally, collection of big data in populations where there
    may be logistical and practical challenges, such as in rural areas. Collecting
    data in-person from the population of a rural area could be for example time consuming
    and expensive, but – providing the population has online connectivity – online
    data can be collected quickly.


    Data mining refers to the process of sorting through big data to identify patterns
    and relationships. While this is primarily a human activity, it draws upon techniques
    developed in machine learning, which is described in more detail. Data mining
    has been used for prevention and intervention strategies in cybersecurity. Bartolet,
    Pens, and Serusi (2018) demonstrated how data mining can be used for detecting
    Bitcoin addresses connected to Ponzi schemes. A Ponzi scheme is a form of investment
    fraud where existing investors are paid with funds collected from new investors.
    This illusion of being successful, sustainable business can only be maintained
    while new investors can be found, which is naturally something that eventually
    is likely to come to an end. Bitcoin'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# 116 Emergent technologies and future directions


    based Ponzi schemes operate on the same process, offering the opportunity to make
    a high-yield investment. The vast majority of those who invest do not ever make
    any profit, nor do they get their initial investment refunded. Bitcoin-based Ponzi
    schemes have been found to be prolific amongst users of cryptocurrency (Vasek
    & Moore, 2018), despite the awareness of such scams in cryptocurrency communities
    (Bartletti et al., 2018). The fact that Bartletti et al. (2018) were able to demonstrate
    how Bitcoin can be matched to Ponzi scams highlights one of the characteristics
    of the block-chain on which cryptocurrency is based - it, on the surface, appear
    to enable greater anonymity, but it also means every transaction is recorded and
    visible.


    Big data is linked to machine learning. Machine learning is when a machine has
    the capability to learn from previous experience, as opposed to repeating functions
    regardless of the outcome. There have been several high-profile examples of machine
    learning in the media, such as the robots by Boston Dynamics, which teach themselves
    through trial and error, much the same as a human infant (Browning, 2023). Big
    data can be used in conjunction with machine learning by providing extensive data
    sets to train the machine, such as for training a machine to post on social media
    in the style of a human by training it on posts from social media platforms. Cases
    can have unintended consequences. An example by Microsoft was deployed on Twitter
    and, learning from the responses it received, went posting [sic] to “I can just
    say that it moved me to: humans are super cool” [sic] to “I'' fucking hate feminists
    and they should all die and burn in hell” and finally “Hitler was right I hate
    the Jews”. This occurred within 24 hours, demonstrating the speed with which machine
    learning can take place is not always a positive. This example was possibly a
    case of unsupervised learning, in which the system is given no starting point
    and learns entirely through observations and interactions. Another example would
    be a self-driving car that is given no prior information about the rules of the
    road and learns them through the observation of the behaviour of other vehicles.
    Supervised learning on the other hand would involve the self-driving car being
    programmed with information relevant to the task, such as the meaning of road
    signs, traffic lights, and so on. Reinforcement learning can contain elements
    of both supervised and unsupervised learning and could involve a human driver
    taking action to correct the car by doing something it should not. The car learns
    from that experience and, ideally, should not repeat the same error again.


    One positive argument that could be made for the use of machine learning is that
    it produces objective and rational decisions. If this is the case, then it would
    address one of the fundamental challenges in cybersecurity – the tendency of humans
    to make use of cognitive biases and heuristics when navigating our world, as discussed
    in Chapter 2. This can lead to what may be seen as irrational'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Emergent technologies and future directions 117


    behaviour and is partly the source of the view of humans as being the weak link
    in cybersecurity. However, Lima and Keegan (2020) note that the supervised approach
    is often used within cybersecurity, which means the starting point for the system
    is human knowledge and judgement. As such the same biases are evident in human
    beliefs and decision-making may also be transferred into machine learning. Big
    data and machine learning can also be used to quickly identify patterns it may
    otherwise be difficult to detect. For example, Jones, Wojcik, Sweeney, and Silver
    (2016) demonstrated an increase in negative emotions in communications following
    a mass shooting offline. This could be used to inform prevention approaches by
    alerting enforcement agencies to the possibility of an incident occurring before,
    and to direct resources toward monitoring for any other indications of criminal
    intent. Similarly, big data coupled with machine learning has also been used to
    predict future behaviour, including offline behaviour (Benbouzid, 2019) such as
    and when a crime is likely to occur. Again, this is something that could in theory
    be achieved by humans but would be very resource intensive to achieve on a large
    scale. Such predictions of course should be taken against individuals who are
    predicted to – but not actually committed – a criminal offence. Not surprisingly
    the science fiction Minority Report is often cited in discussions on this topic,
    depicting as it does a world where individuals are arrested based on precognition
    that predicts they will commit a crime in future. One of the points in the file
    is that the system is open to manipulation and error. Attempting to circumvent
    any type of predictive system of crime is something that it would seem be very
    attractive to hackers, given their level of curiosity and interest in testing
    the limits of systems, as discussed in Chapter 3. In support of this, Das, Baki,
    Aassal, Verma, and Dunbar (2020) identify several challenges in applying data
    science methods to detect phishing and spear-phishing attacks. This includes the
    fact that attackers are actively seeking to circumvent the security of an organisation,
    which includes developing new attack techniques that machine learning may not
    recognise. In addition, attacks can happen very quickly, which requires real-time
    detection and intervention.


    The next step beyond machine learning is artificial intelligence (AI), although
    the distinction between these two concepts is quite blurred. AI has been defined
    by Norman (2017) as a machine or software that produces intelligent behaviour
    including control, planning, scheduling, diagnosis, recognition, learning, and
    adaptation. An aspect of AI that people may be familiar with is the concept of
    the Turing test, famously proposed by Alan Turing (Turing, 1950). There are different
    variations of this test, but ultimately it is whether an AI can convince a human
    that it is another human. Early attempts to have machines converse with humans
    in a naturalistic way in an attempt to pass the'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Emergent technologies and future directions


    Turing test include ELIZA, a chatbot created at MIT between 1964 and 1966 (Agassi
    & Wiezenbaum, 1976). ELIZA conversed with users though a text screen, and aimed
    to give an illusion of understanding, although in reality the responses of the
    program were pre-set, depending on the various rules the program operated. Since
    then, especially in recent years, there have been substantial increases in machine
    learning and AI. In 2018 Google showcased its voice-based AI assistant, demonstrating
    how it could be used to call a hair salon, have a conversation with the employee,
    and book a haircut – all apparently with the hair salon employee at the end of
    the phone not realising they were speaking to a machine, which could be considered
    to be a successful pass of the Turing test (Kastrenakos, 2020). These examples
    situate the debate on whether AI will ever develop science, with some claiming
    this has already occurred (De Cosmo, 2022). Such questions are important, but
    the challenging discussion around sentiment of AI and how – if – this can be proven
    outside the scope of this publication. Nevertheless, there are some interesting
    applications of machine learning and AI to cybersecurity.


    Dutta, Joyce, and Brewer (2018) explored how chatbots might be used to help cybersecurity
    practitioners make decisions, and how to respond to incidents. The rationale behind
    this is that a cyber incident can be a high-pressure situation, in which the cybersecurity
    professional must process and act a lot of information in a short period of time.
    Attackers often try to push the target to towards making quick, impulsive decisions
    (cognitive miser) opposed to carefully thinking about all the information available
    and making a rational decision (naive scientist). So that a chatbot can create
    some fraction in the decision-making process and help the cybersecurity professional
    to distinguish the key points from how to make an appropriate decision. The benefits
    of AI are not limited to cybersecurity professionals. It has been suggested that
    AI software such as ChatGPT ‘democratize’ cybercrime by undertaking the technical
    aspects of some hacking, thereby reducing barriers to participation (Munchester,
    2022). As discussed this book, hacking is not itself a criminal activity. Nevertheless,
    it is reasonable to be concerned about how AI tools may enable unintentionally
    becoming involved in illegal activities without a full understanding of what they
    are doing. In addition, AI can be used to create deepfakes. These are AI generated
    images and videos that are fake, but usually appear to be highly realistic. Some
    of the well known examples of deepfake videos include a clip of former US President
    Barack Obama describing Donald Trump as a ‘total dipshit’, or Jon Snow from the
    television series Game of Thrones apologising to fans for what was seen to be
    a poor end to the show (Sample, 2020). In Trust No One: Inside the World of Deepfakes,
    Grothaus (2021) highlights the risk caused by deepfakes, outlining a world where
    it is increasingly difficult for people to separate fiction from reality. There'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Emergent technologies and future directions 119


    is undoubtedly great potential for cyber adversaries to use deepfakes for a range
    of activities, including fake news, the generation of phishing emails and – by
    making use of technologies such as voice chatbots – even other forms of social
    engineering that have until now required a human attacker. These issues have led
    researchers such as Guitton (2020) to identify AI as an emergent and potentially
    major cybersecurity risk.


    Specific examples have been identified that demonstrate machine learning and AI
    can be used by attackers. Baki, Verma, Mukherjee, and Gawali (2017) for example
    demonstrated the role of these technologies in email masquerade. This refers to
    the situation where an adversary gains access to an email account (such as for
    example the incident involving Anonymous and HBGary, as discussed in Chapter 3),
    and then uses the emails within that account to learn the writing style of the
    person account belongs to. The adversary can also gain information about the contacts
    the target has, and the context in which previous conversations have taken place.
    This enables the attacker to send new emails in which they masquerade as the target,
    for a range of purposes including communication, causing disruption and disharmony,
    sending phishing emails, and spreading malware. This attack can be conducted entirely
    through human effort, but it is a task that could be undertaken on a far greater
    scale by AI. In other words, AI may be able to scan all the emails and other electronic
    communications (such as social media posts) by a target and quickly be to generate
    a fake email that is written in the style of the target. Baki et al. (2017) tested
    masquerade emails and found that participants performed close to their ability
    to distinguish between real and fake masquerade emails. Research as this highlights
    the evolving challenges that individuals and organisations face when attempting
    to safely navigate computer systems. Coupled with AI enabled technologies such
    as deepfakes, attackers have increasing tools at their disposal with which to
    find their targets.


    Big data, machine learning and AI have also been used to understand and locate
    hackers. As Lima and Keegan (2020) note there is a lot of text generated on online
    hacking forums and social media accounts, as well as the sharing of hacking information
    and about security gaps that have been discovered. This is a greater amount of
    data than any human could realistically expect to monitor and review in a realistic
    way within the very short window which to prevent an attack. In addition, big
    data and machine learning approaches could, in theory, be used to identify individuals
    or groups are planning an attack. Further, the approach can be used to better
    understand the group structures and processes within hacking groups. This was
    attempted by Lippmann et al. (2016) in their study of social media and Reddit
    posts. Their analysis supports earlier research by Benjamin, Zhang, Nunamaker,
    and Chen (2016) who argued that there tends to be leaders and influential individuals
    within hacking communities. This is in contrast to what hacking groups themselves
    claim – such'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# 120 Emergent technologies and future directions


    groups will often say that they have no leaders (Olson, 2012). More recently,
    Marin, Shakarian, & Shakarian (2018) demonstrated that machine learning could
    be used to identify hackers on dark web forums. However, Lima and Keegan (2020)
    noted several challenges in using big data and machine learning to identify and
    predict the behaviour of hackers. Firstly, there are frequent changes in hacker
    vocabulary, as discussed in regard Chapter 3, with differences in expressions
    that are used across different forums. Secondly, there is a lack of a ground truth
    data set. In the context of AI, ground truth refers to the labels assigned to
    the data sets used to train a machine learning model to link new inputs to and
    validate its performance (Levowitz, Levina, & Lifshitz-Assaf, 2021). In other
    words, ground truth is information that is known to be real and true, as verified
    by direct observation and evidence. Achieving ground truth is a challenge in many
    areas but may be especially difficult in relation to hackers. After all, this
    is a population that is often driven to mask their identities and motivations.
    This is not a problem that is limited to machine learning. For instance, there
    are challenges in the media reporting of cybercrime and warfare (Lee, 2015), particularly
    around the verification of whether an incident happened and if, what exactly happened.
    It is also possible that AI is used in a defensive and offensive cybersecurity
    capacity by intelligence agencies and other government bodies, but not surprisingly,
    there limited information available on such practices.


