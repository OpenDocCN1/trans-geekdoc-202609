- pgno: 106
  md: '# 94 Behaviour change prevention


    and Social Cognitive Theory were found to be used within this literature. In addition,
    the Theory of Reasoned Action (Ajzen & Fishbein, 1980) was identified as having
    been used as the theoretical basis for cyber behaviour. The Theory of Reasoned
    Action is closely linked to the Theory of Planned Behaviour and argues that individuals
    have an internal decision mechanism in which the formation of intention immediately
    precedes the behaviour and mediates between that and the impact of other variables.
    According to this theory, the psychological requirements of intended behaviour
    are attitudes and perceived norms. This inclusion of perceived norms is relevant
    to organisational culture, as it suggests that individual behaviour is strongly
    influenced by what individuals perceive to be the norm amongst their peers. Bada
    et al. (2015) also noted that Protection Motivation Theory (Rogers, 1975) was
    cited as the basis for some cyber behaviour change strategies. The theory states
    that whether an individual takes action to protect them is determined by how they
    perceive the threat to be and if how they perceive themselves to be in coping
    with that threat. As the theory has overlap with the concepts of capability and
    self-efficacy contained within other psychological theories that have been used
    as the basis for cyber behaviour change strategies. Johnston, Sarkentin, and Sipoonen
    (2015) note when applying Protection Motivation Theory to cybersecurity behaviours
    that it is important to educate individuals on how to take the steps needed to
    protect themselves. In other words, if you present the target population with
    information about a threat you must also provide a clear explanation of the steps
    that can be taken to avoid that threat. This is consistent with the discussions
    on terminology and resilience in Chapter 4.


    The Nudge Theory approach has become a popular behaviour change strategy in recent
    years. It aims to change behaviour by steering people towards a desired choice,
    without actually removing the choice (Thaler & Sunstein, 2009). In doing so it
    may potentially increase an individual’s sense of the control they have over their
    actions, which is pertinent to the concept of locus of control included within
    other behaviour change theories. An advantage of the nudge literature is that
    it often includes practical examples of how the theory can be applied, and indeed
    could argued to be more focussed than other theories of behaviour change. Caravan,
    Karapanos, Gonçalves, and Campos (2019) observes that the nudge approach has become
    popular in human-computer interaction (HCI) but is sometimes applied inappropriately.
    In their review of the application of nudge theory in HCI, Caraban et al. found
    23 mechanisms for nudging grouped across six overall categories:


    +   - Facilitate – default options, opt-out policies, positioning, hiding, suggesting
    alternatives'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Behaviour change prevention 95


    +   - Confront – throttling mindless activity, reminding of the consequences,
    creating friction, providing multiple viewpoints

    - Deceive – adding inferior alternatives, biasing the memory of past experiences,
    placebos, deceptive visualisations

    - Social influence – invoking feelings of reciprocity, leveraging public commitment,
    raising the visibility users'' actions, enabling social comparison

    - Fear – making resources scarce, reducing the distance

    - Reinforce – just in time prompts, ambient feedback, instigating empathy, subliminal
    priming


    These categories provide multiple ways in which cybersecurity could be improved.
    For instance, suggesting alternative versions of a password chosen by a user could
    help address the issue of users choosing a password that is memorable but not
    complicated enough for the system requirements (e.g., suggesting to a user that
    their password be ‘Gr23nfly!’ rather than ‘Greenfly’). Despite sounding rather
    menacing, the mechanism of throttling mindless activity can be effective through
    prompting individuals to stop and think about an action before proceeding, especially
    when they may be acting without much conscious thought. An example given by Konstantinou,
    Karaban, and Karapanos (2019) is a system that curbs the unintentional spread
    of fake news by presenting social media users with a notification of the type
    ‘We estimate a 90% chance of the article containing false information. Doing so
    the individual is encouraged to act as a naive scientist (e.g., in-depth thinking)
    rather than a cognitive miser (i.e., coming to conclusions). Similarly, the use
    of friction in a socio-technical system could be something simple as a prompt
    for confirmation that appears when a user attempts to click on a link in an email
    that has originated from outside that organisation. There are examples in the
    research literature of the nudge approach in cybersecurity contexts. Harbach,
    Hettig, Weber, and Smith (2014) for example applied Nudge Theory to the downloading
    of smartphone apps, to help users understand why giving permissions to apps could
    be dangerous.


    There are other mechanisms used in the nudge that have the potential to be applicable
    to cybersecurity, although with any behaviour change strategy, consideration should
    be given to potential unintended consequences. As discussed, fear can be used
    as a nudge by increasing the perception that people have fear of cyber-attacks
    being a real and genuine threat, but only providing a sense of fear with no information
    about how to avoid a threat can be counterproductive. Gutek and Winter (1990)
    argue that fear appeals which create too much emotional impact negatively on user
    performance. Social influence can be a powerful factor in shaping behaviour, as
    discussed in relation to organisational culture in Chapter 5. However, there can
    be risks in'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'the inappropriate application of nudge mechanisms based on social influence.
    For instance, enabling social comparisons may be beneficial when encouraging the
    employees of an organisation to compete on tasks that every employee has an equal
    and fair chance to achieve. However publicly sharing comparisons of which employees
    have been the victim of a phishing email may not engender positive morale and
    conflicts with the idea that it is impossible for any organisation to completely
    avoid cyber-attacks. Similarly, nudge mechanisms based on deception may be effective
    but may not be welcomed by the employees of that company. In general people do
    not respond to what they perceive to be attempts to manipulate their behaviour
    (Steindl, Jonas, Sittenhalen, Trautt-Mautsch, & Greenberg, 2015).


    The COM-B model (Michie et al., 2011) provides an approach for understanding what
    needs to be in place for behaviour to be effective. It argues that three components
    must be present: capability, opportunity, and motivation. This model capability
    and opportunity influence the relationship between motivation and behaviour, rather
    than the behaviour itself. This model also states that capability and opportunity
    influence motivation, in that if individuals believe they can perform an action
    then they will be motivated to do so. Conversely, if a behaviour is perceived
    to be difficult to achieve the individual will feel less motivated to try to do
    so. In addition both positive and negative feedback cycles develop, which for
    example may develop an individual''s skill level (capability), and in doing so
    increase their motivation for a task. Similarly, if an individual does not have
    any ability to change opportunity, such as in a homeostatic system, their motivation
    to engage in a behaviour may decrease. Finally, the model states that individuals
    may have the capability and opportunity to execute a high number of behaviours
    in any given situation but tend to only consider a small number of these. This
    choice may be made consciously or unconsciously. A consequence of this is that
    an individual may feel more motivated to make an incorrect choice, simply because
    it is more familiar or habitual. As compared to all the other behaviour change
    theories discussed, the COM-B model is the one that most closely includes the
    content of the cognitive moral and naive scientist forms of decision making, which
    respectively refer to quick, largely more reasoned and comprehensive decision
    making.


    COM-B differentiates between interventions (activities aimed at changing) and
    policies (actions on the part of responsible authorities that enable or support
    interventions). This has been incorporated into the Behaviour Change Wheel (Michie,
    van Stralen, & West, 2011). By including policies as part of the Behaviour Change
    Wheel, COM-B could be argued to be the most closely aligned behaviour model to
    culture. For example, by including policies such as fiscal measures the model
    acknowledges one of the constraints'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Behaviour change and prevention 97


    that small to medium businesses often experience when making decisions on cybersecurity
    practices, namely money and resources (Fagble, 2023). Similarly, the Behaviour
    Change Wheel includes legislation as a policy category. Culture and behaviour
    are in part shaped by legislation. Whilst there are international legal conventions,
    such as the General Data Protection Regulations in the European Union, there are
    no universal laws that relate to the rights of internet users. Halder (2022) suggests
    that rights in cyberspace can be classified into two categories – the rights of
    users in cyberspace, and the rights of the victims of cybercrime. These can be
    considered in terms of freedom of speech, the right to privacy, the right to be
    protected against crimes, and the right to justice. Freedom of speech is a topic
    that is particularly subject to debate on the internet. This right may be evoked
    by those who want to be free to engage in hate speech or cyberbullying. As Halder
    (2022) comments, the legalities around these issues can be complex.


    In a review of behaviour change campaigns Bada et al. (2015) identified several
    reasons why cybersecurity behaviour campaigns fail:


    +   - Solutions are not aligned to business rules.

    - Neither progress nor value are measured.

    - Incorrect assumptions are made about people and their motivations.

    - Unrealistic expectations are set.

    - The correct skills are not deployed.

    - Awareness is just background noise.


    These factors are consistent with theories of behaviour change, in particular
    concepts of capability, self-efficacy, opportunity and motivation, as described
    in the Theory of Planned Behaviour (Ajzen, 1991) and COM-B (Michie et al., 2011).
    Issues such as unrealistic expectations and correct skills not being deployed
    are linked to the types of organisational culture factors discussed in Chapter
    5. The findings by Bada et al. (2015) highlight the conflict that can occur between
    behaviour change campaigns should be implemented – based on the research evidence
    – and how they are actually implemented within the constraints of a busy organisation.


    Overall, theories of behaviour and behaviour change are diverse and multi-faceted.
    There is no single theory that could be identified as being dominant; nor is there
    sufficient evidence within the cyber behaviour literature to be able to say that
    any one theory is superior to the others for being used as the basis for intervention
    strategies. However, it is evident that there are some shared elements between
    the theories that may be relevant to cyber behaviour change strategies. This includes
    the psychological constructs of control, capability (self-efficacy), and motivation.
    In addition, the opportunities available to'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'individuals to implement changes appear to be an important factor and relate
    to organisational culture factors around autonomy in the systems in which the
    individual operates. There would also appear to be links between behaviour change
    theories and resilience. As discussed, the key concept in cyber resilience of
    discouraging individuals from making hasty or uncertain decisions in the face
    of a cyber threat is consistent with behaviour change theories that promote a
    more conscious and reflective decision style. It could also be argued that the
    concepts of capability and self-efficacy are highly relevant to resilience – if
    a resilient individual is one who positively adapts to adversity, then the individual
    needs to believe in the first place that adaptation is possible. However, it must
    be acknowledged that these potential linkages between resilience and behaviour
    change are largely speculative. There have been little discussion in the literature
    about the connection between resilience and behaviour change, despite their overlap
    in relation to being concerned with real world challenges.


    The style in which the training is delivered may also be a factor in behaviour
    change, especially if this is not suitable for the target audience. For example,
    Taylor et al. (2017) reported that teaching psychology to computing students can
    be quite different from teaching psychology students, in that computing students:


    +   * Place more emphasis on problem solving, logical thinking and future earning;

    * Are less likely to consider the role of people in problem solving;

    * Expect there be single, universally agreed explanations of psychological phenomena.


    It is feasible to assume that similar barriers may exist in introducing cybersecurity
    training in a workplace. It is, individuals who work in the more of the business
    may struggle to engage with training that takes a more person-centered approach,
    if even greater knowledge of human factors is an important part of that training.
    This is consistent with the position of Le, Kies, and Forlizli (2011), who argue
    that many behaviour changes used in cybersecurity are information-centric. As
    such, they assume that people fail to change their cyber behaviour because they
    do not have the knowledge of how to do so. This is consistent with some elements
    of behaviour change theories, such as the capability component of the COM-B. However,
    it does not account for common elements of behaviour change theories, such as
    the need for the individual to be motivated. This view is echoed by Drew (2020)
    who observes, in relation to cybercrime victimisation prevention,'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Behaviour change and prevention 99


    that giving individuals more knowledge about cyber threats does not necessarily
    lead to a change in behaviour.


    Discussing social engineering attacks, Hadnagy (2018) recommends four steps to
    creating a mitigation and prevention plan:


    +   - Learn to identify social engineering attacks.

    - Develop actionable and realistic policies.

    - Perform regular real-world check-ups.

    - Implement applicable security-awareness programmes.


    These steps could be viewed as practical examples of how to develop resilience
    at an organisational level, or at least resilience to social engineering attacks.
    The steps refer to identifying adversity and taking positive steps to prevent
    and mitigate adversity, which is consistent with the conceptualisation of resilience.
    As behaviour change campaigns based on academic research however there may be
    challenges in implementing these approaches in real-world settings. Nevertheless,
    we would argue that the recommendations put forward by experts with lived experience
    such as Hadnagy (2018) and Radcliffe (2023) are highly valuable, and provide insights
    that cannot necessarily be gained from the academic research literature.


    As discussed in Chapter 5 in relation to organisational culture, organisations
    vary in terms of the resources and skills they have in relation to cybersecurity.
    It could be argued that much of the research literature has focussed on cybersecurity
    behaviour in large organisations. In this, Bada and Nurse (2019) identify five
    key points from the literature on cybersecurity in small and medium-sized enterprises
    (SMEs). Firstly, they note that it is vital that there is a good security culture
    in the SME. This is of course a point that applies to all organisations, as discussed
    in Chapter 5. Secondly, the cybersecurity programme needs to align with the SME''s
    resources. In other words, a security programme that is comprehensive and effective
    in large organisations may be of little use if it requires for successful implementation
    beyond that of an SME. Thirdly, it is important to identify the important assets
    within the SME and understand the harms that could be caused by a breach of those
    assets. This demonstrates a key aspect of cybersecurity risk – SMEs can hold data
    (such as customer bank details) that are as sensitive as that which a much larger
    organisation can hold. Fourthly, there is a need for governments to be involved
    in assisting SMEs in cybersecurity. Governments can provide resources and information,
    as well as setting basic security goals, such as the Cyber Essential scheme that
    is operated in the UK. Finally, there is a need for better communication and engagement
    with SMEs.'
