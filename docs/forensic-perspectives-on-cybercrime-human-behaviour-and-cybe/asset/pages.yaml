  md: '# Social engineering 35


    online element. In discussing the role of forensic psychology in online spaces
    Kirwan and Power (2013) observe that there are two underlying assum-tions often
    used in psychological profiling. Firstly, the consistency-tion, which states that
    offenders will exhibit similar behaviours throughout all their crimes (and allows
    for offences to be ‘linked’ to being undertaken by the same individual), the homology
    assumption, states that similar offence styles tend to be associated with similar
    offender character-teristics (allowing profiles of current offenders to be gleaned
    from what we know of previous offenders who have offended in similar ways). As
    Kirwan and Power (2013) comment there are some questions around the consistency
    assumption in relation to cybercrime; how rapidly technology changes it may be
    that methods used also change, although it has also been found that methods used
    by hacking groups can be contested over several years (Preuß, Furnell, & Papadaki,
    2007). Another potential difficulty with the consistency hypotheses that individuals
