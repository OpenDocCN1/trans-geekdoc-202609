  md: '# 10 Introduction to cybercrime


    # Scams


    Cybercrimes reflect offline crimes, especially those with a financial element
    as scams. One of the most common approaches used are phishing emails, which can
    include several elements such as links or files that, if opened, will install
    malicious software on a computer system. Alternatively, phishing emails or online
    messages may be used to establish a personal relationship with the target for
    the purposes of coercion, such as in the case of romance scams. Many of us will
    have experience of receiving an email that is easily identifiable as a phishing
    due to its dubious claims (such as a lottery win) and grammatical errors, while
    phishing emails have become substantially more sophisticated and tailored since
    their earlier iterations (Nurse, 2015), Iuga, Nurse, and Erola (2016) note that
    technological solutions to preventing the harms associated with phishing emails
    are but limited, emphas the need for better understanding of the human element
    of phishing emails. Phishing can also take place through malicious websites. Facebook
    groups have been used to scam individuals, as a group named the Total Wipeout
    Tour that presented itself as being associated with the TV show, albeit with a
    non-description statement confirming that this is not the case (BBC News, 2016).
    Individuals who wished to participate in this were asked to complete forms that
    requested their email address, date of birth and Facebook profile. No financial
    or banking details were requested. As it may be that people engaged with these
    emails did not perceive there to be any threat, which would be as predicted by
    Protection Motivation Theory (Rogers, 1975). However, a threat is still present.
    Information provided to pages such as this one could be a case of data mining,
    in which the information collected is sold to marketing companies. In addition,
    the page may prompt individuals to share and like it, gathering users until it
    is then sold to a business and undergoes a name change. This creates a deception
    in which a company is perceived to have a better reputation than would otherwise
    be the case.


    # Cyberbullying and online harassment


    Cyberbullying refers to the act of bullying through electronic means, although
    as Zhu, Huang, Evans, and Zhang (2021) note it is a relatively new field of research.
    A contributing factor to cyberbullying may be that children and adolescents struggle
    to understand the connection between behaviours and consequences (Agastonson &
    Limber, 2018), something which may be exacerbated by the online disinhibition
    effect (Suler, 2004). This refers to the feeling that individuals may have that
    online interactions are not as real as offline interactions. Despite this, it
    has been suggested that the impact of cyberbullying can'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Introduction to cybercrime 11


    better than offline bullying, as the preparators can access the victim anonymously,
    at any time of day and from any geographical location (Hutson, Kelly, & Militello,
    2018). The impact of cyberbullying can be extensive on those who are targeted,
    and can cause depression, anxiety, emotional distress, suicidal ideation and self-harm,
    somatic complaints, reduced physical health, absenteeism, self-esteem problems,
    increased delinquency, and increased substance use (illancourt, Faris, & Mishra,
    2017). Whether or not cyberbullying is a crime is something that varies by country.
    In the UK for there are no specific laws that cover cyberbullying. Instead, any
    offences that are prosecuted must draw upon generic and often outdated laws, such
    as the Communication Act 2003 which prohibits the sending of messages that are
    ''grossely offensive or of an indecent, obscene or menacing character''. A further
    legal complication is that the perpetrators of cyberbullying may be especially
    likely to minors, although of course adults can be the instigators and target
    of cyberbullying as well. It has been suggested that the move towards online teaching
    during the COVID-19 pandemic created additional cyberbullying risks as teachers
    often had less direct control over their classrooms, and that the use of webcams
    bullies greater opportunities to take images of their targets for aggressive purposes
    (Halder, 2022).


    Other forms of online harassment exist, as cyberbullying, often using technology
    to facilitate harmful actions that also take place offline. An example of this
    comes from the group who are known as incels. This originates from ''voluntary
    celibate'' and refers to individuals – primarily male – consider themselves unable
    to find a romantic or sexual partners, despite the desire for one. The Incel phenomenon
    is documented by Lisa Sugiura in The Incel Rebellion: The Rise of the Manosphere
    and the Virtual War Against Women (Sugiura, 2021), which notes the many and varied
    misogynistic acts, online and offline, that are committed against women. High
    profile examples include the case of Jason Davison, who shot and killed five people
    in Plymouth, UK, in August 2021. Media reports the time stated that Davison was
    motivated by ideology online, and the ''heroes'' of the movement who advocate
    violence against women (Morris, 2021).


    # Crime as a service


    The provision of hacking tools and other types of malware cybercriminals for financial
    gain has been labelled Crimeware-as-a-Service (CaaS). The cybercriminals sell
    their expertise, knowledge, and access to specialist tools to those who do not
    have the ability or inclination to commit cybercrimes. This business model is
    not fundamentally different from other ‘as-a-service’ (AAS) models'
  merge: -1
