- pgno: 13
  md: '# Introduction to cybercrime


    # Context


    We live in an increasingly inter-connected world. The digital technologies that
    underpin these societal changes provide many benefits to individuals and organisations,
    however they also facilitate criminal activities. There is enhanced public awareness
    of the real-world impact of cybersecurity incidents, in part due to high profile
    cases such as the WannaCry ransomware worm that had a large impact on the National
    Health Service (NHS) in the UK (BBC News, 2017). In 2022, the data of 400 million
    Twitter users was stolen, which included email addresses and phone numbers linked
    to accounts, information which could be used or sold to cybercriminals to facilitate
    further breaches (Newman, 2023). Data breaches of this type can also result in
    the real-life identity of people being revealed, which for some individuals may
    be harmful if they use of pseudonym online to protect their identity. In addition,
    cyber-attacks increasingly impact the daily lives of members of the public, such
    as the ransomware-attack on the Colonial Pipeline in 2021. This is an oil pipeline
    system that transports gasoline and jet fuel from the USA to the southeast of
    the country. Due to the cyber-attack, the company ceased all operations of the
    pipeline, resulting in fuel shortages, panic buying, and changes to flight schedules.
    This led US President Joe Biden to declare a state of emergency, with the Colonial
    Pipeline Company paying the attackers 75 Bitcoin ($4.4 million) to regain access
    to their systems (Kerner, 2022).


    Psychological factors underlie the cognitions and behaviours of all the actors
    within cybersecurity. This includes the decision-making process that leads the
    attackers to choose their targets; and then the choice of methods used in the


    DOI: 10.4324/9781003300359-1'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# 2 Introduction to cybercrime


    attack. This has parallels with the decision-making processes identified in forensic
    psychology with reference to offline crimes, such as the processes used by burglars
    to decide which house to burgle (Nee & Meaghan, 2020). These decisions may be
    influenced by the perceptions that the attackers have of how the targets respond
    to the attack. More broadly, cybersecurity incidents change how the wider public
    interacts with online technologies, as their trust in online voting systems or
    engagement with online shopping.


    In this opening chapter we outline this cybercrime landscape, with a focus on
    the theories from forensic, cyber, social, and other areas of psychology that
    can help us understand the behaviours and conceptions of all those involved in
    cybercrime. Everyday use of technology involves basic interactions that reflect
    social processes. Passwords for example have been described as trusted tokens
    (Marshall & Stephens, 2008), in which individuals provide proof of identity in
    exchange for access to services. However, such interactions are prone to the same
    compromises that people make in other aspects of their daily lives so that they
    are able to navigate a complex social world with finite resources. Tam, Glassman,
    and Vandenwaer(2010) for instance note the convenience-security trade-off, in
    which people opt for simpler passwords than be recommended by security experts,
    as it is often challenging for people to choose and recall more complex passwords.
    This is consistent with rational choice theory, in which individuals decide what
    action to take based on their judgement of the costs and benefits of each action
    (Ostrom, 1998). This tendency is the reason behind passwords being required to
    have a certain level of complexity, such as for the example that a password must
    include a capital letter, number, special character etc. Whilst setting such a
    requirement may feel not intuitive from a cybersecurity perspective it can create
    issues for the humans who are users of socio-technical systems. A recurrent theme
    throughout this book will be the clash between how humans should ideally behave
    to avoid cyber-risks versus the actual, less ideal cybersecurity behaviours that
    humans often exhibit.


    A challenge in understanding human behaviour in online settings is whether people
    behave in a fundamentally different way, or if online technologies just provide
    the opportunity to express themselves in ways that would not otherwise be possible.
    This relates to the question put by Suler (2004) on whether the internet transforms
    or enhances. An example would be whether someone behaves aggressively in an online
    interaction would also do so if they were having a similar online interaction
    (i.e., the online setting transforms that behaviour), or if the online setting
    just exaggerates how aggressively that person behaves (i.e., it enhances an existing
    behaviour). This is in turn linked to the concept of digital drift. This refers
    to how technology can lead individuals to loosen their adherence to mainstream
    norms (Brewer, Fox, & Miller, 2019). This can happen in the digital context by
    providing affinity'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Introduction to cybercrime 3


    (i.e., financial and social rewards) and affiliation (i.e., associating with others).
    Goldsmith and Brewer (2015) argue that people can take advantage of the internet
    to express online identities and escape into a virtual world with less conforming
    social norms. This theme of existing outside mainstream society and creating a
    new or curated identity is certainly something that would appear to be evident
    in the conversations that have been reported to take place between members of
    hacking groups, as documented by several authors (Coleman, 2014; Olson, 2012).


    The pervasiveness of online technologies in the lives of many of us facilitates
    the actions of cybercriminals. In the UK, most (62%) have up to nine online accounts
    (including social media platforms, online banking, online shopping etc.) that
    contain sensitive data, with more than a third (38%) having ten or more (CyberSafe,
    2022). In addition, individuals often have access to sensitive data from other
    computer systems in their workplaces. This is one of the reasons why many cybersecurity
    breaches have been found to be a result of human error, typically due to a social
    engineering attack (CyberSafe, 2022) of the types that are discussed in Chapter
    2. The importance of understanding human factors is recognised as a key aspect
    of cybersecurity by cybersecurity experts and practitioners (Kerney & Kruger,
    2016). However, as explored in later chapters, often exists a perception of humans
    as the ‘weak link’ of cybersecurity. This is potentially a harmful belief as it
    creates the expectation for all stakeholders in cybersecurity – the targets, attackers
    and the IT professionals who seek to protect systems – that it is the users who
    are the point of failure. Failure may lead to several unintended consequences,
    such as learned helplessness of the type documented throughout psychological research
    (Abramson, Seligman, & Teasdale, 1978), where individuals come believe that there
    is nothing they can do to prevent a negative situation from arising. This reflects
    the common message used by cybersecurity professionals as a question of if you
    got hacked, but when. The rationale behind this message is presumably to encourage
    potential victims to be more vigilant and overcome any complacency they hold over
    cyber-risks. It is understandable that it is felt there is a need to emphasise
    the risks. Throughout this book examples be given of how large, well-resourced
    companies, including technology companies, have been breached using surprisingly
    simple social engineering attacks and hacking techniques. Nevertheless, it must
    be considered that this narrative of humans being the weak link and cyber-attacks
    as inescapable counter-productive and self-fulfilling by leading some to believe
    that whatever they do can be hacked, it is pointless to even try to avoid this.


    A successful hack enables the attackers to engage in other activities beyond the
    theft of sensitive data. This includes website defacement, interference with the
    lawful use of computers, and the dissemination of malicious software'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 4 Introduction to cybercrime


    (Grabosky, 2016). Hacking can also be used to create botnets, in which other devices
    are hijacked – typically without the knowledge of the owners – and used to commit
    further acts of hacking (Kremlin & Parker, 2017). This can include Distributed
    Denial of Service (DDoS) attacks, in which websites and other online services
    are taken offline by being inundated with connection requests. The scale of cybercrime
    is difficult to envisage. Much of the work of cybercriminals involves the use
    of software to facilitate their goals. For example, 80 billion automated scans
    are made daily by cybercriminals, aimed at identifying vulnerable targets (Lewis,
    2015). The increase in cybercrime in recent decades (Furnell, Emm, & Papadaki,
    2015) contrasts with the decrease globally since the 1990s in offline crime (Tseloni,
    Mailley, Farrell, & Tilley, 2010). In addition, as will be discussed in Chapter
    3, the range of potential suspects in cybercrime can be more varied than the case
    with offline crime. As a basic example, any interpersonal crime such as an assault
    needs an offender and victim to be in the same location in time and space. Suspects
    are therefore limited to individuals who could feasibly have been in the physical
    location of the crime at the time occurred. Cybercrime however can be committed
    by a substantially larger pool of suspects, who could be located anywhere in the
    world. For example, a 10 year old boy was rewarded with $10,000 after finding
    a major security flaw in Instagram (Lee, 2016). Similarly, as will be discussed
    in Chapter 4, there are inconsistent results in the literature up to the most
    likely victims of cybercrime.


    As with any behaviour, the actions of all involved in a cybersecurity incident
    can be influenced by the cultures in which these individuals exist. This can relate
    to the culture of the organisation that an individual is part of, and the national
    cultures that all or parts of the organisations operate in. Within the UK, the
    most common identified threat vector are phishing attacks, as identified in a
    report by the Department of Culture Media and Sport (2022). Whether or not an
    employee clicks on a malicious link or attachment in a phishing email will be
    determined by several national organisational and cultural factors, including
    their perception of risk and perceptions of expected productivity (i.e., the speed
    at which emails should be processed). This report also found that 54% of businesses
    have acted in the previous 12 months to identify cybersecurity risks, although
    interviews found that understanding at the board level led to responsibility being
    passed onto external providers or internal colleagues. This is an issue, the management
    of a company set the tone for how all employees respond to potential cyber threats.
    These cybersecurity culture factors represent a complex challenge in how change
    risk behaviours in an organisation, as discussed in Chapter 5.


    Given the role of human behaviour and cognition in cybersecurity incidents there
    has been an increasing recognition of the importance of applying'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Introduction to cybercrime 5


    behaviour change and prevention strategies. The online environment creates unique
    opportunities to encourage people to change their behaviour, but also adds novel
    challenges. Many online actions, such as for example an employee''s use of a work
    computer in an organisation, can be monitored, and recorded. This can provide
    insights into the factors that may lead to an employee becoming a victim of cybercrime.
    The same technology can be used to deliver personalised data-driven behaviour
    change and prevention strategies. Yet as will be discussed in Chapter 6 there
    are many examples through campaigns in other domains that have been ineffective
    or counterproductive. As such, there need for evidence-based techniques to be
    used to promote behaviour change and prevention of cybercrime, which also reflects
    the differences between online and offline crime.


    More recently, in big data, machine learning, and artificial intelligence (AI)
    have been exploited by both those who seek to commit cybercrime and those who
    seek to prevent it. For example, the amount of personal data produced by online
    technologies is extensive, with Facebook generating the equivalent of over 2,000
    billion pages of printed text every day in 2019 (Brandwach, 2019). This wealth
    of data potentially provides criminals and cybersecurity experts with means means
    which to achieve their goals. A challenge of big data is that it is more extensive
    than can be analysed using conventional methods. This is where machine learning
    and artificial intelligence are increasingly utilised, within cybersecurity. One
    potential promise of AI is for unbiased decision making to be made, which would
    potentially be very useful when combating social engineering attacks. It has been
    demonstrated that human biases can still be evident in the machine learning and
    AI technologies that have been used in cybersecurity (Lima & Keegan, 2020). The
    implications and questions caused by these emergent technologies are explored
    in Chapter 7.


    An ongoing challenge in cybersecurity is that technology, by design, be set up
    in a way that makes the user as anonymous as possible. For example, the dark web
    consists of internet sites that cannot be accessed through standard web browsers.
    The dark web is something people often have an awareness but struggle to fully
    envisage. This can be partly due to conflation between the dark web and the deep
    web. The deep web refers to information that is available in an online format,
    but is not indexed by the web browsers used by search engines. An example of deep
    data would include information such as student records at a university. Such information
    is online and accessible to relevant staff and students through the intranet of
    the organisation, but this information cannot be located by searching on Google.
    The dark web on the other hand refers to a section of the deep web that is deliberately
    hidden and which can only be accessed with online tools. Both the deep'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 6 Introduction to cybercrime


    web and the dark web lie beneath the surface web, which could be described as
    the normal, everyday internet that most people are familiar with. One of the most-known
    tools used to access the dark web is The Onion Router (Tor), which provides a
    web browser through which dark sites can be accessed. Despite the negative connotations
    associated with Tor and use of the dark web in general it is important to note
    that use of Tor is not illegal. Indeed, the software was developed by the United
    States Naval Research Laboratory, for the purpose of protecting online American
    intelligence communications (Lawrence, 2014). The software is used for many purposes
    beyond would be considered criminal activity, such as for example by journalists
    reporting from oppressive regimes who wish to protect themselves (Bartlett, 2024).
    Nevertheless, the dark web has garnered a near-mythical status of being a lawless
    and sinister online space where any act of depravity can be found. It is the case
    however the dark web and Tor have been used to disseminate extreme materials such
    as child pornography, likely in the belief by those creating and sharing materials
    that the technology reduces their risk of being identified.


    The cyberspace ecosystem revolves around money. Increasingly, these financial
    transactions make use of cryptocurrencies another technology that has risen from
    the internet. This is a type of digital currency that uses cryptography to ensure
    secure and easily verifiable financial transactions. In contrast to mainstream,
    traditional banking cryptocurrencies are decentralised. There is no single agency
    or organisation that manages the cryptocurrency. This lack of regulation centralised
    has prompted wary reactions from governments across the world. For example, it
    has been suggested that the US administration is actively seeking to suppress
    the use of cryptocurrencies in the USA (Reynolds, 2023). Cryptocurrencies operate
    through a technology called the blockchain, which uses a distributed ledger in
    all transactions are recorded across multiple computers, or nodes. The first widely
    used cryptocurrency was Bitcoin, which was created in 2009. Since then, other
    cryptocurrencies have been created, known as altcoins. Examples of these include
    Ethereum and Litecoin. Cryptocurrencies are traded through cryptocurrency exchanges,
    often referred to as bitcoin exchanges, where users can trade their cryptocurrency
    for other digital currencies, or conventional currencies. These cryptocurrencies
    have several benefits, including faster and cheaper cross-country transactions,
    as well as providing access to financial services for people who do not have a
    bank account. Given the lack of any central regulation or oversight is a popular
    technology with cybercriminals. More broadly, they appeal to the wider hacker
    culture that places value on finding new ways to do things – in this case a financial
    system that does not include the various issues, controversies and unethical business
    practices found in traditional banking. Cryptocurrencies also provide opportunities
    for individuals to make profit'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Introduction to cybercrime 7


    through the same means seen in traditional financial systems, such as arbitrage,
    in which someone can take advantage of price differences across markets to make
    money (Kabasinskas & Sutiene, 2021).


    However, cryptocurrencies do not necessarily provide the level of security and
    privacy that some cryptocurrency users may hope. Tracers in the Dark: The Global
    Hunt for the Crime Lords of Cryptocurrency, Greenberg (2022) identifies some of
    the misperceptions that are held about cryptocurrencies. Despite being seen by
    users of the technology as anonymous, the nature of the blockchain is that every
    transaction is recorded. Whilst the offline affordity of those behind cryptocurrency
    may not be immediately apparent, there are numerous examples where law enforcement
    has successfully identified individuals who have used cryptocurrency for criminal
    minds. In addition, there have been cases of cryptocurrency exchanges being hacked,
    or the people behind the cryptocurrency exchanging the money. It was Mt. Cox,
    a cryptocurrency exchange at one point processed over 70% of all Bitcoin transactions
    worldwide. It suddenly ceased trading in 2014, with cryptocurrency the equivalent
    of hundreds of millions of US dollars unavailable to the owners of those tokens,
    equating to 7% of all bitcoins in existence at the time. The CEO of Mt. Cox, a
    then 30 year old named Karpeles, was arrested and charged with fraud and embezzlement
    by Japanese police. He later acquitted that he had inflicted extensive harm on
    the trust of users. In The Missing Cryptoquen: The Billion Dollar Cryptocurrency
    and the Woman Who Got Away With It, Jamie Bartlett describes the case of a fraudulent
    cryptocurrency scheme called Ruja Ignatova (Bartlett, 2022), who is the founder
    of the scheme. This cryptocurrency was a new manifestation of an old scam, a pyramid
    scheme. In contrast to other cryptocurrencies, OneCoin used a centralised model
    rather than a decentralised one. The company used multi-level marketing tactics
    to attract investors by promising high returns and offering commission to those
    who recruited others to join the scheme. These cases demonstrate the ingenuity
    with which cybercriminals can find ways to exploit new technologies.


    # Types of cybercrime


    There are many different types of cybercrime, and many different criminal actions.
    The Crown Prosecution Service in the UK makes a distinction between cyber-dependent
    crimes and cyber-enabled crimes (Crown Prosecution Service, 2023). Cyber-dependent
    crimes are those that can only be committed using information technologies (IT),
    which includes the creation and dissemination of malware for financial gain, and
    hacking to steal, damage, or distort and'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Introduction to cybercrime


    networks. Cyber-enabled crimes on the other hand are traditional crimes that can
    be increased through IT, which includes acts of fraud, online marketplaces for
    illicit items, and the grooming of children by online sexual predators. This boundary
    between cyber-dependent and cyber-enabled crimes is helpful in understanding cybercrime
    but can be blurred. This reflects the increasing pervasiveness of internet technologies
    in daily life. The distinction between online and offline activities is no longer
    clear as it was once.


    Increasingly, technological devices can make remote connections through the internet
    or other means, which creates new opportunities for cybercriminals that go beyond
    the stereotypical act of stealing bank account details. The interconnected nature
    of socio-technical systems means that a cyber-attack can have multiple implications.
    For example, hackers have been able to hack cars (Kelion, 2016) and cause gridlock
    in Moscow by hacking a taxi system (Holroyd, 2022), and in the 2016 the internet
    of Liberia crashed after a cybercriminal attacked an African phone company (Casciani,
    2017). The internet can also be used for the purchase of illicit materials as
    drugs. This highlights the differing attitudes that can exist when a crime is
    committed online as opposed to offline, and the overlap that can exist between
    the two. For instance, an investigation by the BBC reported the perceived ease
    of purchasing drugs online, including through the dark web. The report also noted
    the views of postal workers that attempting to prevent this practice was largely
    futile (Connolly & Doble, 2017). Examples such as this are interesting but challenging
    questions how we, as a society, decide what forms of cybercrime we can and prioritise
    for prevention and mitigation strategies, allowing for the fact that there are
    finite resources with to support these strategies.


    In the text below we explore some of the broad categories of cybercrime, with
    the caveat that there is overlap between many of these activities.


    # Hacking


    Hacking is the single activity that is perhaps most associated with cybercrime.
    The term ''hacking'' invokes the Hollywood imagery of a figure in a black hoodie,
    sitting in front of a computer monitor in a dark room which lines of programming
    scroll across the screen. It is a phenomenon that has been defined in multiple
    ways, with negative connotations conflate hacking with criminality. For instance,
    hacking has been defined as an unauthorised access of a computer system with criminal
    intent (Grabovsky, 2016). In turn, the term ''hacker'' has evolved to encompass
    more than the act of hacking itself. Maimon and Loubacker (2019) argue that hacking
    is distinct from cyber-trespassing, defined as crossing of the invisible boundaries
    of online environments (Walls, 2001), with hacking encompassing a wider range
    of behaviour and participation in hacker culture. This'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Introduction to cybercrime


    hacker culture is evident in both online and offline spaces, such as the DEF CON
    events that take place in Las Vegas each summer (defcon.org). The event regularly
    attracts in excess of 20,000 attendees (DEF CON, 2023), and provides a rich and
    varied programme of talks, demonstrations, discussions, and social activities.
    And the similar events that take place across the world highlight communities
    of hackers go beyond the popular conceptions of hacking as niche activity conducted
    by malcontents, sitting in a dark room. Indeed, many of the activities undertaken
    in hacking culture could be argued to directly benefit society. A regular exercise
    at the annual DEF CON event is publicly demonstrating how devices that are—or
    at least hoped—to be breached, including secure access systems and electronic
    voting machines. Highlighting vulnerabilities on the stage in a large ballroom
    in Las Vegas may not seem like a socially responsible activity, but these activities
    provide an impetus for companies to ensure that their products are as secure as
    possible. Similarly, there are individuals who work as ethical hackers. These
    individuals are employed by organisations to conduct penetration testing, which
    they will test the cybersecurity of an organisation by attempting to breach cybersecurity.
    Further discussion of this type of hacking is given in Chapter 3.


    It has observed that successful hacking requires a series of consecutive activities
    (Steinetz, 2014), which includes gathering preliminary intelligence on the technical
    and social characteristics of their targets, exploiting the identified vulnerabilities,
    the elevation of privileges (increasing access to data), and then the attempt
    to cover evidence of their hack. Maimon and Loubacker (2019) argue that hacking
    is the starting point for most types of cyber-dependent crimes. Hacking does not
    in itself however necessarily require extensive skills or technological knowledge.
    For example, script kiddies, which refer to individuals who may use of software
    tools to perform hacking acts, have little technical ability but still cause widespread
    disruption. In one case 34 individuals, many of them teenagers, were arrested
    from 13 different countries as part of an operation investigating the Netproof
    DDoS attack tool. This online service enabled users to deploy DDoS-for software
    and launch cyberattacks (Khandwal, 2016). As outlined above, a DDoS attack (distributed
    denial of service) can cause a website or online service to function by overwhelming
    that website or service with requests—akin to repeatedly pressing the refresh
    button on a page of a web browser, but with millions of requests per second. This
    is often facilitated by bots, of the type discussed earlier in this chapter. This
    act of hacking is effective, because it is such a crude tool. Nevertheless, it
    is one that can be effective, especially when the goal is to cause disruption
    to an organisation. This demonstrates another key theme of the book—that hacking
    is not limited to motivations of financial gain. As discussed in Chapter 3, there
    are various motivations for engaging in hacking, including hacktivism where the
    main goal is ideological in nature.'
