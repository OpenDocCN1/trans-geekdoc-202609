    # Theories of cybercrime


    As Bossler (2017) observes, only a limited number of criminological studies relating
    to cybercrime have been published in the top criminology journals, which Diamond
    and Bachmann (2015) have attributed to criminologists’ lack of familiarity with
    the online cybercrime ecosystem. Maimon and Loudback (2019) note that much of
    the research on cyber-dependent offenders is based on student or organisational
    samples, which primarily conduct low-level cybercrimes, and are not a representative
    sample of the many and varied profiles of cybercriminals. The criminological theories
    that have been applied to cyber dependent crimes include the General Theory of
    Crime ( Gottfredson & Hirshi, 1990), Social Learning Theory (Akers, 1973), Social
    Control Theory (Hirshi, 2017) and deterrence theories (Gibbs, 1968).


    The General Theory of Crime distinguishes criminality (the inclination or tendency
    to criminal behaviour) and crime (the actual act by which the law is broken).
    Gottfredson and Hirshi (1990) note that a crime can only take place when the propensity
    for crime coincides with an opportunity to commit a crime. Given the number of
    opportunities to commit crime that we typically encounter daily, it is the criminality
    of the individual that becomes the key factor. Gottfredson and Hirshi (1990) argue
    that this self-control is typically learned in early life. There is evidence to
    support this relationship between self-control and criminality against offline
    offenders (Pratt & Cullen, 2000), however research relating to online offenders
    is more marked (Marcum, Higgins, Ricketts & Wolfe, 2014). This proposed relationship
    is also part of Social Control Theory (Hirshi, 2017), which has been described
    as one of the turning points in the history of criminology (Costello & Laub, 2020).
    In contrast to criminological theories that focus on delinquency, Social Control
    Theory instead focuses on the restraints and circumstances that prevent delinquency.
    The theory states that criminality comes from an individual having a lack of intimate
    attachments, aspirations, and moral beliefs that bind people to mainstream, legitimate
    lifestyles. This is an interesting point to consider in relation to cybercrime.
    As will again be discussed as part of Chapter 3, individuals who become involved
    in cybercrime often do as part of a group. Trust relationships between the members
    of cybercriminal groups, even if they do not know each other’s real-world identity.
    Hacking forums appear to be important sources of self-esteem, self-identity,'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# 18 Introduction to cybercrime


    and social relationships to forum members, and analyses of hacking forums, albeit
    surface web ones, suggest that members are concerned with questions of morality
    McAlaney, Hambidge, Kipton, & Thackray, 2020).


    Social learning theory in relation to crime (Akers, 1973) refers to how behaviour
    is reinforced through social processes. This is related to Bandura’s (1977) social
    learning theory, but with a focus on operant conditioning as the driver of criminal
    behaviour. Operant conditioning, also known as instrumental conditioning, states
    that behaviour is positively reinforced with some type of reward is likely to
    be repeated, whereas behaviour is punished and will less likely to be repeated.
    Negative reinforcement can also occur, where the frequency of a behaviour is increased
    through the removal of a negative stimulus (Skinner, 1963). For example, if a
    child refuses to eat a certain food item at mealtimes, and the parent encourages
    and removes that food item, then reinforcement may occur where the child is more
    likely to refuse food in future. As, Akers (1973) suggests that individuals become
    involved in the long term depends on their initial experiences of criminal activities,
    as well as their interactions with others who are engaged in criminal activities.
    If they are punished because of these actions then their involvement in criminal
    activity becomes less likely, but if they are rewarded their involvement becomes
    more likely. It is possible to envisage how these processes operate in relation
    to cyberspace. As noted, there is a lack of understanding and public awareness
    of many forms of cybercrime, something that may also be applied to some elements
    of law enforcement (Halder, 2022). Legislation pertaining to cybercrime is often
    outdated, and not fit for purpose (Mishra, 2022, #9918). As the people who get
    involved in criminal activities be able to do so without being detected or may
    not face punishment if they are caught. As will be discussed in Chapter 3, such
    individuals may also be rewarded with the social support and approval they can
    receive through becoming part of hacking communities. They may also come to these
    hacking communities through engagement in other communities. In support of this,
    Hutchings and Clayton (2016) show that identification in gaming communities can
    result in participation in hacking. Similarly, it has been found that spending
    time in chatrooms and social media may mean that they are presented with more
    reinforcement of online deviance, as well as being provided with a social norm
    of deviance (Donner, 2016; Weulen Kranenberg, Holt, & van Gelder, 2019).


    Deterrence theory assumes that people made decisions towards committing or abstaining
    from crime based on the maximisation of their benefits and minimisation of their
    costs (Beccaria, 1963). As observed by D’Arcy & Herath (2011), classic deterrence
    theory focuses on formal (legal) sanctions and argues that the swifter and more
    severe the sanctions, the more individuals are'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Introduction to cybercrime 19


    deterred from engaging in the relevant behaviour (Gibbs, 1975). Revisions to the
    original theory include informal sanctions such as social disapproval, self-disapproval
    (i.e., feelings of shame), and moral inhibition (Piquero & Tibbetts, 1996). More,
    deterrence theory has included perceived risks and costs of both informal and
    formal sanctions as the decision-making process an individual uses when considering
    whether to engage in criminal activity (Pratt, Clevens, Daigle, & Madsen, 2006).
    This theory has been applied within cybersecurity, with D''Arcy & Herath (2011)
    commenting that it is one of the more widely used theories in the field. Nevertheless,
    they also note that the evidence base for the application of deterrence theory
    to cybersecurity contains mixed results, in part due to methodological inconsistencies
    in how sanctions have been conceptualized and measured.


    Routine activity theory (Cohen & Olson, 1979) has been stated that crime is likely
    to occur when there are three elements: a motivated offender, an attractive target,
    and an absence of capable guardianship. As will discussed in greater detail in
    Chapter 3, there are many varied motivations for individuals to engage in criminal
    acts. There is also a surplus of attractive targets, which within the context
    of routine activities refers to a target that the attacker perceives to be vulnerable
    and from whom something can – relatively easily obtained. The lack of capable
    guardianship in the offline context could mean that for instance the lack of security
    guards in a store to deter shoplifting. For example, the IT staff within an organisation
    could be guardians of the workplace IT systems. Similarly, the use of firewalls
    and up to date software could be considered as a form of technological guardianship.
    In both cases this guardianship is only effective if the human undertakes certain
    required actions to engage with those guardians, or indeed not to circumvent restrictions
    imposed by guardians, such as bypassing software updates. These tensions whose
    responsibility it is to ensure protection from cybercrime reflect the larger perception
    of humans as the weak link of cybersecurity. This is discussed in greater detail
    in Chapter 4.


    Protection Motivation Theory (Rogers, 1975) has also been applied to cybersecurity
    behaviours (Hassandourt & Techatassanoortorn, 2020). This theory relates to how
    people respond when they feel threatened, and based on two elements – how likely
    they think they are to be exposed to that threat, and how that threat could be
    if it occurred. Based on these factors, the individual decides whether they need
    to take action to avoid this threat. For example, we may recognise that it is
    a common experience to catch the flu, but many people perceive this as having
    a low severity, as is being unlikely to cause serious harm. A plane crash on the
    other hand is something that potentially has a'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 20 Introduction to cybercrime


    very severe outcome but is something that an individual is extremely unlikely
    to experience. Of course, individual characteristics and beliefs are relevant
    to these processes. Whilst most people may not perceive the flu to be a threat
    there are individuals who immunocompromised or who have other health issues from
    whom any respiratory infection be a serious threat. It is likely that perceptions
    of the severity of respiratory illness also changed during the COVID-19 pandemic,
    highlighting temporal changes in the broader social environment can influence
    perceptions of likelihood and threat. Similarly, an individual with a fear of
    flying may object that flying is one of the safest forms of travel, but they stillget
    and emotionally feel threatened by the experience of flying. The use of Protection
    Motivation Theory in cybersecurity behaviours is discussed in more detail in Chapter
    6.


    Overall, these theories share some commonalities as the social environment, self-control,
    the perception of risk, and self-identity. No single theory could be universally
    accepted and to understanding cybercriminal behaviour, although neither is any
    such theory that is solely used to explain criminal behaviour. Nevertheless, these
    theories provide useful insights into how to predict, identify, and predict cybercrime,
    although there remains a need for further research into the psychological aspects
    of cybercrime. This includes a better understanding of how cybercrime can differ
    from offline crime. This is something that is likely to always be a moving, as
    technologies continue to evolve and develop in ways that cannot be predicted.


