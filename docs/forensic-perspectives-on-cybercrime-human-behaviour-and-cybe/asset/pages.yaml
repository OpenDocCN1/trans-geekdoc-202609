- pgno: 24
  md: '# 12 Introduction to cybercrime


    that are used extensively throughout legitimate businesses, such as software as
    a service where a company does not directly own the software it uses, but instead
    uses software provided by an external company. The benefits of using the AAS approach
    is for cybercriminals as it is for legitimate business. Barriers to entry are
    removed, individuals can focus on the core activities and goals, and – even in
    cybercriminal examples – access to customer support can available. A courtesy
    visit to the dark web by Tor will enable someone to find many adverts that list
    services such as hacking of social media accounts, DDoSing of nominated targets
    or the changing of social or university grades. It should be noted that among
    hackers and cybercriminals there is a perception that many of these services on
    are themselves a scam (Bartlett, 2014).


    CaaS has been argued to be largely invisible to governments and law enforcement
    agencies (An & Kim, 2018). A distinction has been made between CaaS and criminality,
    with the former described as a do-for-me service, and the latter as a do-it-yourself
    product (An & Kim, 2018). It has similarly been noted that there is a lack of
    research into CaaS (An & Kim, 2018), perhaps not surprising given methodological
    challenges and ethical considerations involved in accessing these networks. Nevertheless,
    a better understanding of CaaS is needed. These services are a key component of
    the cybercriminal ecosystem, and as knowing how to disrupt CaaS activities has
    the potential to create barriers for actors operating in cybercriminal ecosystem.
    The role of CaaS in the cybercrime ecosystem is discussed in further detail in
    Chapter 3.


    # Cybercriminal ecosystems


    A cybercriminal business ecosystem has evolved over time, as individuals realised
    that their skills around programming, marketing, and the development of technology
    platforms have been commercialised (Holt, 2007). It has been commented that this
    business model is in fact a highly professional one (An & Kim, 2018). Sood and
    Enbody (2013) agree that there are three key elements in the cyber marketplace
    – actors, value chains, and modes of operation. An and Kim (2018) make a distinction
    between two types of products or service that are available in the cyber underground,
    although they note that definitions and conceptualisations of CaaS vary in the
    literature. The first of these are products or services that relate attack strategies.
    This includes phishing, brute force attacks, DDoS attacks, and ransomware. The
    second type of attack involves targeting and neutralising the preventative measures
    used by organisations, such as firewalls or anti-virus software. It is interesting
    to note that social engineering producing products and services – that is attacks
    based on psychological manipulation – appear to be rarely traded on underground
    cybercriminal networks (An & Kim, 2018).'
