  md: '# Forensic Perspectives on Cybercrime


    *Forensic Perspectives on Cybercrime* is the first book to combine the disciplines
    of cyberpsychology and forensic psychology, helping to define this emergent area.
    It explores the psychological factors that influence the behaviour of all those
    involved in cybersecurity, drawing upon the research literatures in relevant areas
    including forensic, social, and cyberpsychology.


    Written by leading figures in the field, the book provides an introduction to
    the cybercrime ecosystem, before discussing the psychological manipulation of
    targets through social engineering techniques and highlighting the unique threats
    that this type of attack presents. The reasons why people become involved in hacking
    are explored, and the authors review literature on risk factors of being a victim
    of cybercrime, along with the concept of resilience. Behaviour change and prevention
    strategies are also evaluated, as well as the role of emergent technologies such
    as artificial intelligence and what this may mean for the role of humans in cybersecurity.
    Case studies and real-world examples are woven throughout to illustrate key issues,
    opportunities, and challenges.


    This unique text is a must-read for students undertaking any degree that relates
    to behaviour and cybersecurity, including psychology, computing, law, and business
    management. It is also highly relevant to researchers, practitioners, and policymakers
    who work in cybersecurity and/or have an interest in empowering individuals to
    be safe online.


    **John McLeaney** is a Chartered Psychologist anded Scientist at Bournemouth University.
    His research looks at psychological determinants of risk behaviours including
    online gambling, digital addiction, and cybersecurity. He engages with charities,
    businesses, and policymakers to help empower individuals to protect themselves
    and others from online harms.'
  merge: -1
  img_proc: true
