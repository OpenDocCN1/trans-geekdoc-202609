  md: '# 100 Behaviour change and prevention


    # Prevention


    As discussed, it can be difficult to truly discuss prevention in the context of
    cybersecurity, as this term presumes that the problem is not already occurring.
    However, there can be opportunities in socio-technical systems to bring about
    changes that may prevent cyber-risks from becoming more severe. A range of technological
    approaches have been developed for this, which incorporate machine learning, the
    use of personalised and user-specific sign in processes, two-factor authentication,
    and the creation of lists of known phishing sites (Luga, Nurse, & Erola, 2016).
    Organisations can also make use of various systems to monitor employee and customer
    behaviour and note that any unusual behaviour may be indicative of a cybersecurity
    breach. This is likely an important factor in preventing some instances of cybercrime,
    although cybercriminals are aware of this and attempt to find alternative ways
    to achieve their goals (Rhysider, 2022). Nevertheless, monitoring of this type
    contributes to the target hardening of the organisation, meaning that the attackers
    may decide to focus on a different target who are not as efficient in their monitoring.
    It may be expected that becoming a victim of cybercrime in the past would make
    the individual be better equipped to identify risks and take preventive actions.
    Drew (2020) examined self-protective behaviours and perceptions of cyber risk
    in a sample of 595 adults in Australia but found no significant connection between
    whether someone had previously been a victim of cybercrime and their self-protective
    behaviours. Drew (2020) speculated that there could be several reasons for this
    unexpected result, as individuals not knowing how to develop self-protective cyber
    behaviours.


    Various techniques have been proposed to mitigate the harms caused by phishing
    emails, including legal processes, educational initiatives (Mohammad, Thabth,
    & McCluskey, 2015), and gamification techniques (Hale, Gamble, & Gamble, 2015).
    This latter technique of gamification - using elements of gameplay to make an
    activity such as employee training more fun - is an example of an attempt to encourage
    people to be engaged with cybersecurity materials. Similarly, Khalid and El-Maliki
    (2020) demonstrated that a storytelling approach can be an effective technique
    for improving cybersecurity awareness and understanding. These approaches recognise
    that many people do not have a strong intrinsic motivation to understand cybersecurity
    or do appreciate that this is an important but struggle to read cybersecurity
    policies that are written in an obtuse way. Nearly every organisation has a cybersecurity
    policy, yet it is difficult to imagine that these are read by most of the employees
    and members of that organisation.


    Prevention strategies have been applied to other forms of cyber-risk. In the USA
    for example children aged 11 and 12 years old have been included in'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Behaviour change and prevention 101


    education campaigns about online sexual predators, which include awareness sessions
    that previously only parents of children and other relevant adults were invited
    to (Gibson, 2016). This approach uses fears appeal, as the speaker noting that
    online predators refer to them as busy hunting. Not surprisingly, such campaigns
    often provoke discussion around how much information it is appropriate to give
    children about the risks they may experience online. Part of this relates to recognition
    that it is important for children and young people to learn how to use digital
    technologies as these technologies are ubiquitous and an increasing part of everyday
    life. As such, prevention of harm through abstinence as no use of digital devices
    at all is not feasible. Here a harm reduction approach is used in which children
    and young people are empowered to identify and protect themselves from cyber-risks.
    This has led to the creation of organisations and resources that seek to help
    parents and children in standing cyber-risks and protective strategies, as such
    Internet Matters (https://www.internetmatters.org).


    Prevention strategies are not limited to who may become victims of cyber-attacks.
    Work can also be done to prevent individuals from becoming involved in criminal
    activities. As discussed in Chapter 3, people who became involved in hacking often
    seek to do so because of their innate of computers and the internet. They may
    engage in criminal activities, for many this is an incidental outcome of their
    actions, rather than being their goal. This is not meant to diminish or erase
    the harms caused by criminals, and there of course examples of cybercriminals
    that are motivated by a desire to engage with clearly illegal and immoral actions,
    as the sharing of child abuse imagery. The point instead is that there be some
    individuals who could be encouraged to use their skills and passions for understanding
    computer systems for positive uses. As discussed in Chapter 3, it has been found
    that hackers have differing opinions on gaps in cybersecurity systems could be
    exploited (Thackray, Richardson, Dogan, Taylor, & McAlaney, 2017), and discussions
    on surface hacking forums typically discourage less experienced members from engaging
    in illegal activities (McAlaney, Hambidge, Kimpton, & Hackacker, 2020). That is,
    people are encouraged towards being a white hat (a hacker who works ethically
    and legally), and away from being a black hat (a criminal hacker)— albeit with
    recognition that it may be difficult for a hacker to become fully expert in hacking
    without some experience of activities that include an element of illegality (known
    as being a grey hat). In a survey of people nine percent of respondents described
    themselves as a black hacker, with the remainder describing themselves as a white
    hat hacker (38%), grey hacker (49%), or another lesser term such as a cyberpunk
    (Thackray et al., 2017). There has been discussion about licensing hackers in
    Singapore (Wong, 2017), on the basis of providing hackers with formal recognition
    of their role will result in greater regulation and reduced'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# 102 Behaviour change and prevention


    criminality. This could though be some barriers in such an approach. It has been
    observed that hacker subcultures have a strong distrust of law enforcement and
    governments in general, in part because of past attempts to identify and prosecute
    hackers (T. J. Holt, 2007). Overall, hackers have been reported to perceive the
    criminal justice system as antagonistic and biased towards hackers, creating a
    sense of injustice within hacker communities (T. Holt, Brewer, & Goldsmith, 2018;
    T. J. Holt, Stonereich, Felich, & Chermak, 2021).


    Prevention strategies aimed at people who otherwise become involved in criminal
    hacking may also be important because such individuals do not fully understand
    the risks involved in hacking activities. In 2016, the then Chief Technology Officer
    of the National Security Centre of the UK commented that hackers are ‘not as sophisticated
    as they think they are’ (Levy, 2016), meaning that they expose themselves to risk
    of identification and prosecution to a far greater degree than some hackers may
    realize. Nevertheless there is, a need to encourage people with an interest in
    computers to develop careers in this area, so as to address the cybersecurity
    recruitment crisis. Perhaps the approach to take is to consider educating people,
    particularly young adults, to approach hacking as which can include risks. This
    is already done extensively throughout health and social education in schools
    for topics such as alcohol and safe sex is far part of the training for regulated
    sports and fitness activities such as sports leagues.

    Rennie and Shore (2007) argue that there are steps that could be taken to reduce
    engagement in criminal hacking, including:


    +   - Interventions by parents and peers to teach young people about the criminal
    nature of hacking.

    - Reducing the attractiveness of signs of new hackers and early interventions
    in the form of warnings and behavioural contracts.

    - Curailing the availability of hacking tools, to i) create a higher entry barrier
    and ii) to prevent the flow experience.


    These recommendations reflect elements of prevention and intervention strategies
    that have been used in other domains, although some caution should be applied
    given the unique characteristics of hacking and cybercrime. For instance, peer
    education (as an awareness session delivered by an adolescent of the same age
    as the target group) has been found to be an effective strategy in reducing harmful
    behaviours in health risks in other domains (Abdi & Simbar, 2013), and the role
    of parental influence in adolescent health and social behaviours has also been
    established (Beck & Treiman, 1996). However, problems may arise when it comes
    to peers and parents educating the target population about'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Behaviour change and prevention 103


    legalities of hacking, given the number of legislative grey areas and outdated
    laws around computing that exist in many countries. In addition, parents may not
    themselves have the knowledge to speak to their children about hacking. This is
    something that has been targeted by the National Crime Agency in the UK, which
    has a campaign to empower parents into having meaningful discussions with their
    children about hacking, including the legitimate and positive careers that exist
    in this area (National Crime Agency, 2023). The NCA also uses a rehab camp in
    which offenders, particularly teenagers, are encouraged to use their skills for
    the social good (Ward, 2017).


    As commented by Rennie and Shore (2007) engagement in cybercrime could also be
    lowered by reducing the attractiveness of criminal hacking, although this could
    be a challenge given media depictions of hacking that often contain humour and
    excitement, such as the movie Blackhat, featuring Marvel Chris Hemsworth. There
    are examples of relatively realistic depictions of hackers that deeply explore
    the nuances of black, white, and grey hacking and the dilemmas faced by hackers,
    as the television show Mr. Robot. It could be argued that media depictions of
    hacking and hackers are not in themselves an issue, provided a clear effort is
    made to convey the many often high opportunities to have legitimate career paths
    in cybersecurity – including ethical hacking, and the reality of prosecution and
    criminal records that can result from illegal hacking. As discussed in Chapter
    3, this would help address the cybersecurity recruitment crisis. Both police monitoring
    of potential hackers and curtailing the availability of hacking tools would likely
    prevent people from becoming involved in hacking, but the challenge with each
    of these is the scale of the problem and the amount of time and resources required.
    Law enforcement and intelligence agencies may also be reluctant to comment on
    the ability they have to access and monitor online communications, although it
    has been reported that the UK intelligence agency MI5 has a Behavioural Science
    Institute that aims to identify individuals who may engage in terrorism (Gardner,
    2016).


    It has been suggested Sykes and Matza’s (1957) neutralisation theory could be
    applied to better understand and prevent cybercrime (Bossler, 2021). This theory
    explains why juveniles who otherwise appear to conform to societal norms commit
    acts of deviance, despite being part of a deviant sub-culture or believing themselves
    to be a deviant. It states that the juveniles in question will seek to use techniques
    of neutralisation to justify the acceptability of their behaviour, and in doing
    so avoid any feeling of conflict with their overall general belief system. In
    other words, they try to find a way to tell themselves that they are not a bad
    person, despite engaging in activities that would be viewed as negative in mainstream
    society. Sykes and Matza (1957) identify five techniques that individuals use
    to achieve this neutralisation: denial of'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# 104 Behaviour change and prevention


    responsibility (not their fault; it occurred due to forces outside of their control);
    denial of injury (viewing the deviant behaviour as victimless); denial of the
    victim (removing the victim''s ''victimhood'' status by perceiving the victim
    as deserving of the harm inflicted); condemnation of the condemers (attempts to
    shift the focus away from the offender behaviour and onto the hypocrisy of the
    condemers); and finally appeal to higher loyalties (prioritising the needs of
    family and following the law). There are certainly many cases where these techniques
    are utilised by hackers and cybercriminals. Denial of the victim is evident in
    cases of hacking where attackers discuss their targets as being responsible for
    the attack due to lax cybersecurity, as seen in online conversations within hacking
    groups (G. Coleman, 2014). As previously stated, it has been observed that cybercriminals
    use language that dehumanises and demonises their victims (M. Rogers, 2010). Similarly,
    condemnation of the condemers is something that has been observed in situations
    where hackers are prosecuted for crimes and claim that the punishment is disproportionate
    to the harm caused and intended the need for revenge by the organisation they
    targeted (Hutchings, 2013; Knappenberger, 2012). Denial of injury has also been
    documented amongst hackers, with Hutchings (2013) reporting that hackers often
    deny that their computer intrusions caused any harm, an appeal to higher loyalties
    as a neutralisation technique is evident, with hackers viewing their actions as
    for the greater good (Chua & Holt, 2016). Examples of this would be the activist
    Anonymous providing advice to citizens in Tunisia on how to access the internet
    after the Tunisian Government restricted online access during the revolution of
    2011 (DeTardo-Bora, & Gardner, 2019); Olson, 2012).


    As Bossler (2021) notes here have been further techniques of neutralisation suggested
    in the literature such Sykes and Matza''s (1975) initial identification of five
    techniques. These include the defence of necessity (because the action was necessary
    in a specific situation) which was identified by Minor (1981); metaphor of the
    ledger (one''s belief that one has done more good than bad in life) as identified
    by Klockars (1975); normality and entitlement (where individuals engage in a similar
    behaviour and they deserve to be occasionally awarded), suggested by J. W. Coleman
    (1985). Finally, Cromwell and Thurman (2003) suggest justification by comparison
    (the offender stating that these techniques could be applied to cyber incidents.
    Hackivists frequently acknowledge that their actions are illegal, but frame these
    as being a necessity in addressing the unethical practices of organisations and
    governments (Olson, 2012). Similarly, hackers have been observed to argue that
    their crimes are often, by comparison, relatively minor compared to serious offline
    crimes (Olson, 2012). These techniques of neutralisation have been studied in
    relation to several cyber-deviant behaviours,'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Behaviour change and prevention 105


    including digital piracy (Popham & Volpe, 2018), sexting (Renfrow & Rollo, 2014),
    and hacking (Morris, 2020). Brewer, Fox, and Miller (2020) note that the evidence
    for the use of neutralisation techniques in cybercrime is high, highlighting the
    need for more research in this area. Looking more specifically at hacking, Hutchings
    (2013) reported that, in comparison to other types of cybercrime (e.g., digital
    piracy), hackers do not deny responsibility for their actions and instead argue
    that they are consistent with work that has demonstrated gaining prestige and
    superior knowledge are are important motivators for engaging with hacking communities
    (Mclaney et al., 2020; Seebruck, 2015). Bossler explored the role of neutralisation
    techniques in the willingness of college students to commit cyber-attacks, finding
    that these techniques were significant predictors after peer influence, computer
    skills, time spent online, and gender. In these results, there were some relationships,
    or lack of relationships, between specific neutralisation techniques and specific
    types of cybercrime. In instance, denial of injury was not significantly related
    to willingness to hack government services, with the governments in the examples
    given in the study framed as ways that were causing harm. As Bossler (2021) observes,
    some acts of hacking as activism are credited to the deliberate act of causing
    harm.


    Research into neutralisation techniques has been used as the basis of severe criminal
    justice innovations, as situational prevention (Cornish, 2003). This approach
    involves several strategies, as challenging the excuses that offenders use to
    justify their actions. This is intended to prompt the offender to consider their
    actions at the point when they are on the verge of committing a crime. Bossler
    (2021) suggests that this can be further achieved through educating hackers on
    the financial and emotional consequences to individuals and organisations that
    can result from being harmed. This parallels with prevention approaches that have
    been suggested for the potential victims of cybercrime, as those who may be targeted
    by phishing emails or social engineering attacks— ultimately the goal is to encourage
    the individual to think more deeply about their actions (i.e., a naive scientist
    as opposed to being a cognitive miser, as discussed in Chapter 5). In addition,
    another approach is making individuals explicitly aware of how they may be using
    neutralisation techniques to justify their behaviour to themselves. There is some
    precedence for this work on how to empower individuals to challenge fake news.
    This involves prompting cognition in individuals, which refers to an individual’s
    knowledge about their own knowledge (Barzili & Zohar, 2012; Mason, Junetty, &
    Tornatora, 2014). In other words, if hackers can be prompted to consider whether
    they believe in the neutralisation techniques they use to justify attacks, then
    they may realise that justifications are erroneous. However, caution should'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# 106 Behaviour change and prevention


    taken in using such approaches with hackers. As previously noted, hacking communities
    are particularly resistant to attempts to change their behaviour or beliefs. Bossler
    (2021) acknowledges, hacktivists in particular have a strong desire to achieve
    their goal, and consciously wish to harm their targets.


    Broadly, Chung, Chen, Chang, and Chou (2006) make four recommendations to combat
    cybercrime – i) regularly update existing laws; ii) enhance specialised task forces;
    iii) use civil resources; and iv) promote cybersecurity research. The first point
    is that certainly needs to be changed. As has been commented elsewhere, legislation
    over cyber behaviours is frequently outdated and not for purpose (Halder, 2022).
    However, it is also acknowledged that there is a challenge in keeping legislation
    up to date when technologies evolve so quickly. This suggests the need for more
    flexible legislation that can be adapted to new technologies and methods of online
    crime. At the time of writing, the United Nations are ad hoc committee to develop
    an international convention on countering the use of information and communication
    technologies for criminal purposes (United Nations Office on Drug and Crime, 2023).
    Specialist task forces also be beneficial, given the unique characteristics of
    cybercrime, as suggested by An and Kim (2018). The complexity of the cyber enforcement
    ecosystem could pose a barrier to investigation for the law enforcement agents
    who are not familiar with cybercrime. In support of this, An and Kim (2018) argue
    that greater classification and definition will enable governments to improve
    national defence and security, by shaping roles and the adoption of regulatory
    practices. Greater collaboration between governments, law enforcement agencies,
    security providers and software vendors will also aide prevention and intervention
    strategies (Chung et al., 2006). It has been noted that this type of collaboration
    may be especially beneficial for addressing cyber-threats in risky situations
    (Majzrak & Janveaa, 2010).


    It has been noted that there has been a growth of a ''new'' private security industry
    and private policing in cyberspace (Button, 2020). As the author notes, this parallels
    to the ''quiet revolution'' that occurred in the 1970s and 1980s in private security
    in North America, which was prompted by under-funding of the police. Many online
    services are regulated by the companies who provide online services, such as social
    media platforms or gaming. This can involve partnerships with the police for criminal
    investigations. There is through a lack of preventive policing. Within large organisations
    the cybersecurity is typically the responsibility of what is called the Chief
    Information Security Officer (CISO). Facebook as a Community Operations Team who
    investigate complaints and moderate content, although concerns have been raised
    about the workload and mental health of those who are employed in this role (Newton,
    2019). Several large companies are known for providing cybersecurity services,'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Behaviour change and prevention 107


    such as PWC, BAE, IBM, Symantec, RSA and Kapersky, as well as smaller companies
    that cater to smaller firms, and specialist companies such as Bulletproof to offer
    penetration services (Button, 2020). Prevention and investigation are also increasingly
    undertaken by the voluntary section, as through websites provide people with the
    opportunity to watch CCTV and report potential incidents (Button, 2020). More
    proactive voluntary groups take on forms of online vigilantism, such as on 919eater.com,
    where attempts are made to engage with scammers to waste their time and prevent
    them from scamming a real victim. One of the more extreme examples of these vigilante
    groups are those who have been termed pedophile hunters, who are groups as children
    online with the aim of exposing pedophiles who attempt to engage them in sexual
    activity. Videos of the alleged pedophile confronted by group members are posted
    on social media platforms, with it being reported in 2018 that there were over
    75 such groups in the UK alone (Evans, 2018). (2020) observes that there is a
    lack of understanding and regulation of this new private security system. It has
    also been argued that the continued existence of cybercriminal firms in some countries
    is due to a lack of police efforts against cybercrime (Lusthaus, Klelemans, Leukfeldt,
    Levi, & Holt, 2023).


