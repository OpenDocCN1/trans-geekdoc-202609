  md: '# Social engineering


    # Context


    Social engineering within the context of cybersecurity refers to the use of psychological
    manipulation to influence the target into conducting an action that contributes
    to the breach of a system. An example of this that many will be familiar with
    phishing emails, which make use of a range of psychological manipulations to encourage
    the target to click on a link or to open an attachment, as the use of urgency,
    emotional appeals, or authority. Examples of this would be emails that claim to
    be from a tax authority, stating that the recipient is in breach of some tax law
    and will face punitive measures if they do not urgently act. This will typically
    invoke the target being asked to click on a link or open an attachment, both of
    which will contain malicious software that will infect the device and system the
    person is using. Reason why phishing is popular as a social engineering technique
    is that they require little effort or cost to the attacker, and only require engagement
    by one in the target population to potentially be successful. In other words,
    it not matter if a target organisation has 10 employees or 100,000 employees –
    only one employee must click on the malicious link or file for the attacker to
    potentially access the system. Technological approaches such as firewalls and
    anti-virus software can block some of the risks posed by phishing emails, but
    not all of them. In addition, phishing exists are one example of social engineering,
    but other types of attack exist, as will be discussed in this chapter.


    Social engineering has been argued to be the single biggest threat in cybersecurity
    (Salahahdine & Kaabouch, 2019). Social engineering is not limited to cybercrime.
    For example in 2016, employees in several fast food restaurants in'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Social engineering 27


    the USA were targeted and tricked into smashing the restaurant windows on the
    basis of believing there was a gas leak within the building (Almay, 2016). There
    is limited published academic research on social engineering, and very little
    about the life experiences and characteristics of social engineers. There are
    some books written by high profile social engineers which discuss their perspectives
    on social engineering and the experiences they have had led them into social engineering.
    One of the more well-known examples of this is Social Engineering: The Art of
    Human Hacking, authored by the high-profile social engineer Chris Hadnagy in 2011.
    A revised version of this book was published in 2018, entitled Social Engineering:
    The Science of Human Hacking (Hadnary, 2018). This change in ‘Art’ to ‘Science’
    was, as Hadnagy explains in the most recent text, a recognition of the growing
    evidence on the psychological processes that underpin social engineering techniques.
    Nevertheless, there remains a surprising lack of application of the research literature
    to real worlds of social engineering techniques.


    Hadnary (2018) and other social engineers provides services in which they test
    resilient an organisation is to a social engineering attack. This is a form of
    penetration testing, which is a common activity in cybersecurity (Al-Ahmad, Kahtan,
    Hujainah, & Jabab, 2019). It involves a post deployment vulnerability assessment
    task that is conducted as an isolated test process in a manual and sometimes hoc
    manner (Zhao, Shang, Wan, & Zheng, 2015), or ‘the art of finding an open door’
    is still often assumed to refer solely to technological means of testing testing
    (e.g., through what might traditionally considered to be hacking) rather than
    through social engineering. Hadnagy (2018) notes that there is increasing awareness
    of social engineering, both as a threat from malicious actors and as an important
    component of a comprehensive penetration test. This is in due to increased media
    attention, and to the interesting experiences and stories described by social
    engineers (Radcliffe, 2023). In the case of Hadnagy and Radcliffe, the service
    they and other similar professionals offer is referred to as ethical social engineering,
    in which they apply the technique used by criminal social engineers to help organisations
    understand how to protect themselves.


    # Social engineering techniques


    Hadnagy (2018) argues that a social engineering attack is composed of the following
    steps:


    +   * OSINT (Open-Source Intelligence)

    * Pretext development'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 28 Social engineering


    +   - Attack plan

    - Attack launch

    - Reporting


    OSINT, or open-source intelligence, refers to the information that the social
    engineer collects about the target or other relevant actors to be able to conduct
    the attack. As the name suggests, this intelligence gathering is typically done
    through open sources which are readily available in the public domain. This can
    include simply searching for the target online, to find out for example their
    interests and hobbies. The increasing availability of this type of information
    through social media platforms is something that social engineers have acknowledged
    as being enormously useful in their activities (Radcliffe, 2023). Alternatively,
    OSINT could include looking at the management structure displayed on a company
    website, to ascertain which individuals should be targeted. This could be anyone
    at any level of the company from the CEO to lower paid employees, depending on
    the plan that the social engineer has in mind. Cleaning staff for example may,
    on the surface, have little power within an organisation, but they typically have
    access to every office within a company. The social engineer may also visit the
    physical premises of a company that is to be targeted, to observe what type of
    clothing employees wear, where the entry and doors are, whether there are security
    requirements for entry, and the lobby is set up. Depending on the nature of the
    business it may also be possible to enter the premises and around. Social engineers
    comment how this can be done, particularly if they equip themselves with some
    props and appropriate clothing such as a clipboard or high visibility jacket (Radcliffe,
    2023; Rhysder, 2023). As discussed in more detail later in this chapter, this
    reflects the cognitive biases that humans use to navigate their social world and
    leads people to come to erroneous conclusions about whether the social engineer
    they have seen has a legitimate right to be in that building.


    This OSINT contributes to the development of the pretext, which is the backstory
    that the individuals present themselves with. An example given by Hadnagy (2021)
    is that of a social engineer who was employed by a well-known theme park. After
    using OSINT to determine some basic aspects of the theme park and the software
    they used, the social engineer arrived at the ticket desk with his family in attendance.
    By presenting a pretext of being on holiday and having experienced issues with
    printing out their tickets, the social engineer was able to persuade the person
    behind the ticket desk to open a PDF file from his email account, using the PC
    at the ticket desk. This PDF contained the malicious software that was needed
    to demonstrate to the theme their systems could have been breached, although as
    this was a case of penetration testing so no actual harm was done. An interesting
    point of this case study was'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Social engineering 29


    that the social engineer was able to determine version of the PDF software the
    theme park was currently using by phoned them directly and pretending to be salesman
    who was selling an alternative software. The theme park employee who spoke to
    the social engineer presumably freely provided this information because the question
    did not seem to be sensitive. This is a common theme in social engineering attacks
    – each individual step or interaction with the target does not, by itself, to
    be posing a threat. It is only when the information is gathered together that
    the true risk is apparent.


    The plan for attacks such as the one above is broken down into what, when, and
    who. This is of interest as aligns to the common policing investigation technique
    of considering the SWH of an offence – what, when, where, who, why and how (College
    of Policing, 2013). In relation to penetration testing, ‘what’ refers to what
    will happen in the attack, and what the goals are. Radcliffe (2023) observes that
    there can be tensions when setting goals with an organisation when social engineering
    penetration test is being planned. The organisation may feel that some assets
    are too sensitive to be exposed to someone external to that organisation, even
    if person is brought in by a security advisor. Similarly, there may be debates
    about how many people within the organisation will be informed in advance that
    a penetration test is going to occur. To be a true test of the security of an
    organisation as few people should be aware that the test is occurring, but organisations
    may not feel comfortable with some individuals, such as members of management,
    not having advanced knowledge (Radcliffe, 2023). Finally, organisations are unlikely
    to leave behind a calling card, or sending an email from a device inside the organisation
    (Radcliffe, 2023). Once the tests are set, the next step is to decide upon when
    launch the attack. This is linked to the ‘who’ in the attack plan, which refers
    to who needs to be available to implement or assist with the plan – often without
    realising that their actions are in facilitating an attack. The plan is set and
    the attack is launched, although social engineers note that an overly detailed
    plan can act as an impediment when facilitating an attack. (Hadnagy, 2018; Radcliffe,
    2023). In ethical social engineering the final stage is to report the findings
    of the attack to the client, with advice on how to change their practices to reduce
    the risk of becoming the victim of a criminal social engineering attack. A recurring
    theme in accounts given by ethical social engineers and penetration testers is
    overconfident organisations often are that their systems are secure; and in turn
    how shocked they are with the ease with which they have been breached (Hadnagy,
    2018; Radcliffe, 2023; Rhysider, 2023).'
