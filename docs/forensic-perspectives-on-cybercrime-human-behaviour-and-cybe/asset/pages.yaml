    # National culture


    If trying to define the culture of an organisation is difficult, attempting to
    define culture on a national level is even so. It is though necessary if the cyber-security
    behaviours of both individuals and organisations are to be understood, as all
    these exist within a broader national culture. In some cases, they may be influenced
    by several cultures, or in the case of multinational operations, must understand
    how to operate securely in multiple countries across the world. This is before
    considering whether any single country has a singular culture, or the role that
    online technologies may play in ways people perceive themselves and interact with
    others. It has been noted that the internet can provide people with the opportunity
    to communicate and behave in ways that transcend that person''s culture (Pflug,
    2011). Cultural differences can be subtle and, outside of that, seem perplexing.
    For example, it was noted by Western media that China''s President Xi had two
    cups of tea in front of him at the National People''s Congress in China  202,,
    that was believed to be a deliberate act intended to convey power (Bubalo, 2023).
    These complexities and nuances of culture are something which need to be addressed
    when assessing cybersecurity threats and designing prevention and behaviour change
    strategies. It should also be noted how the increasing size of'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# 84 Culture


    companies can begin to blur the lines between organisational and national culture
    – for instance in 2017 it was recorded that Walmart had a greater financial tumour
    than the country of Belgium (Belinchon & Moynihan, 2018).


    Research highlights some of the ways that national culture can influence cybersecurity
    behaviours. For example, Selim (2019) observed that there is a relationship between
    culture and self-disclosure. That, people in some cultures are more likely to
    share information about themselves to others than in other cultures. Many social
    engineering attacks contain an element of information gathering (open-source intelligence,
    or OSINT) about the targeted individual or organisation. As such individuals who
    more share information about themselves may be at greater risk of social engineering
    attacks. As was highlighted in Chapter 2, the information that is sought by social
    engineers is often that which, on the surface, can appear to be very trivial.
    However, commented by Bagh, McKenna, and Fitzsimmons (2002) we should be cautious
    in making assumptions about the relationship between culture and self-disclosure
    on the internet, where anonymous communication is possible.


    There have been several models proposed that have attempted to characterise the
    different components of culture. One of the first models of culture was put forward
    by E. T. Hall (1976). This model describes culture in terms of high and low contexts,
    with in this case referring to anything that shapes the communication within the
    culture, such as social norms, shared history, and the environment. A high culture
    context is one in which people tend to have close, long-standing relationships.
    Edward T. Hall and Mildred R. Hall (1990) identify Japan as being an example of
    one of the highest culture contexts, mentioning that people in culture rarely
    say what they think and instead use a complex system of strategic politeness”.
    They also note that Germany is an example of a low culture context, where people
    are more direct in their communications. There is a lack of research on how if
    social engineers and other cyber-adversaries tailor their attacks to the culture
    of the target, but it would seem like, a more direct approach to information gathering
    (e.g., calling a query to what PDF software they use, as per the example given
    in Chapter 2) may be more effective in Germany than Japan, as in the latter there
    could be more resistance to disclosing information to a stranger.


    An alternative model was put forward by Schwartz (2012), which proposes four cultural
    categories: openness to change, self-transcendence, self-enhancement, and conservation.
    Contained within these are 10 dimensions, one of which is security. This refers
    broadly to people’s sense of security in terms of safety and well-being but does
    of course appear to be highly relevant to cybersecurity. Other dimensions in this
    model may also be relevant. For example, the dimension of power is something that
    could influence'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Culture 85


    the success of phishing emails that are based on some expression of authority.
    This is typically done by framing the phishing email as being from some type of
    government organisation, such as the FBI or tax revenue, with a threat of legal
    action if the recipient does not click on a link or open an attached file. Similarly,
    the dimension of benevolence could influence how likely scams based on charity
    appear to be successful. It has been argued the Schwartz model provides a fluid
    and detailed approach that recognises the overlap in cultural dimensions. Despite
    this, it does not appear to be a model that is widely used in the cybersecurity
    research literature.


    Instead, the most popular cultural model that appears to be used in cybersecurity,
    and in business more broadly, is Hofstde’s model (Hofstede, Hofstede, & Minkov,
    2010). This model proposes six dimensions of culture, as follows:


    +   - Power distance – how the gap is between the people in power and the public.


    +   - Individualism versus collectivism – whether people place emphasis on the
    individual well-being and success, or they put put emphasis on the well-being
    and success of their friends, family, and wider community.


    +   - Masculinity as femininity – the extent to which traditional gender roles
    are present within the culture.


    +   - Uncertainty avoidance – the degree of risk that a culture can tolerate,
    a culture with high uncertainty avoidance will try to avoid anything that might
    have a risk.


    +   - Long-term orientation – the extent to which a culture plans for the long-term
    future.


    +   - Indulgence versus restraint – how much emphasis the culture places on having
    fun, which could also be considered in terms of how conservative a culture is.


    As with other cultural models, there is a lack of research into how the dimensions
    identified by Hofstede’s model could be applied to cybersecurity beliefs and behaviours.
    Nevertheless, it is possible to speculate that some of the impacts might be. For
    instance, members of a culture that is in uncertainty avoidance would be considered
    less likely to take risks in opening emails from unknown senders. Similarly, an
    organisation in a culture with a high degree of long-term orientation could be
    expected to invest more time and resources into identifying threats and ensuring
    their cyber practices are safe and sustainable. However, there is a risk in making
    assumptions concerning the cause and effect of cultural dimensions on behaviour.
    Previously commented influences are complicated, and for many people are not limited
    to influence from a single culture. Indeed, the popularity of the Hofstede model
    may in part be due to its relative simplicity, along with the existence'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# 86 Culture


    of online services that provide comparisons between countries and how they score
    on these dimensions (e.g. https://www.hofstede-insights.com/product/compare-countries/).
    The model has been criticised on several points, such as being based on samples
    within some countries (such as IBM employees) and not representative of the general
    populations of those countries (Shaiq, Khalid, Akram, & Ali, 2011). Vignoles et
    al. (2016) also comment that the model does not capture the diversity within cultures,
    although this is a criticism that could be applied to other models of culture.


    Overall, both organisational culture and national culture are important influences
    on behaviour in cybersecurity – not just the behaviour of the intended targets
    of cyber-attacks, but also who are behind them. Organisational culture is something
    that organisations can, in theory, exert influence over improve cybersecurity
    practices. Governments have arguably less influence over the national culture
    of a country; but there remains the potential for culture change to be introduced
    to reduce the harm caused by cyber-attacks. In the case of both organisational
    and national contexts the challenge is the complexity of cultures, and the risk
    of unintended consequences from attempting to change these cultures. These issues
    of prevention and behaviour are discussed in more depth in the next chapter.


