- pgno: 53
  md: '# Attackers 41


    opinions on all hacking related topics (Thackray, 2019). This reflects the fact
    that hacking exists as a subculture (Holt, 2007; Steinmetz, 2014). Within these
    hacking forums there is competition to be the most knowledgeable and the most
    skilled. Part of this is the enjoyment that individuals experience from hacking,
    which highlights that hacking can be done a recreational activity. Steinmetz (2014)
    reports a range of emotions that hackers experience while going through the process,
    including frustration and boredom, with pleasure and euphoria experienced when
    a hack is completed. It is important to note that, with all cases of hacking,
    hacking for recreation does not necessarily mean that the hacking being conducted
    is criminal in nature. Hacking as a recreation may be something that people engage
    in throughout their lives. Despite the stereotype of hackers being teenagers,
    people who engage in hacking have a wide age range (Thackray, Richardson, Dolan,
    Taylor, & McAlaney, 2017). Those individuals who have begun hacking their youth
    in the 1980s and 1990s are now older and may be in legitimate full-time employment
    with families, community work and other commitments that often come with middle-age
    but continue to hack for the pleasure in doing so. Hacking for recreation overlaps
    with attacking a target because the attackers consider it amusing to do so, which
    the parlance of hacking forums is referred to as for the lur (Olson, 2012). Another
    motivator for engagement in hacking appears to be curiosity (Hutchings, 2013;
    McAlaney, Hambidge, Kempton, & Thackray, 2020), that hackers navigate the internet
    and computer systems due to their interest in these systems, rather than to any
    desire to commit criminal actions. This relates to the concept of digital drift
    as discussed in Chapter 1, in which people may feel that mainstream norms do not
    apply on the internet. It also reflects the life experiences reported by social
    engineers, as discussed in Chapter 2, who often describe how they began their
    social engineering activities through a desire to explore an unknown environment.


    There is evidence that the view that the actions of different types of hacker
    match how they identify and describe themselves. For example, it has been noted
    that hackivists are more likely to target websites that are antithetical to their
    views (such as targeting large corporations that the hackivists believe amoral)
    than they are for curiosity or financial purposes (Holt et al., 2017; Holt et
    al., 2016). The exact motivations of hackers can, be difficult to identify, in
    part due to what sometimes be contrasting actions and attitudes. For example,
    following a hack of a cryptocurrency, hackers returned nearly half of the $600
    million that they stole (Kharpal & Browne, 2021). Similarly, it was reported that
    a ransomware gang apologised to a children’s hospital and provided them with decryption
    software sets of standards (Abrams, 2023). It would seem that online attackers
    have their own sets of standards and beliefs about what is not acceptable. This
    is akin to the ‘moral code’ witnessed in'
  merge: -1
