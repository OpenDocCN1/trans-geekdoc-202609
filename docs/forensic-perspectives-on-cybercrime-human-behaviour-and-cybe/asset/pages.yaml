- pgno: 42
  md: '# 30 Social engineering


    The trickery used by social engineers and hackers does not need to be complicated.
    For example, it has been reported that hackers send USB sticks infected with malware
    to U.S. companies disguised as gifts (Rope, 2022). As with phishing emails, it
    does not matter if most of these USB sticks are not plugged in – it only requires
    one employee to insert the USB stick into a company device for the attack to potentially
    be successful. The ease with which people can be manipulated into facilitating
    cyber-attacks can be surprising. In one study, psychology students approached-by
    and asked them if they would participate in a short survey on IT behaviour, conducted
    by the local university (Happ, Melzer, & Steffen, 2016). As part of this, participants
    were asked to tell the interviewer what their password was to their computer or
    device. Participants were also offered a chocolate, either at the start of the
    interview, directly before being asked for their password, or at the end of the
    interview. One of three participants provided their password on request. Of those
    who did not provide so 58% provided some hint of their password. Of those who
    were given the chocolate immediately before being asked for their password provided
    it, in contrast to those who were given the chocolate at the start of the interview
    (40%) nor given one at all (30%). However, the effect of being given a chocolate
    was only significant for male participants. Female participants were not influenced
    by this. In addition, other participants were likely to reveal their password.
    It should be noted that research into who is most likely to be a victim of cybercrime
    has produced conflicting results, as is expanded on in Chapter 4.


    Social engineering exploits heuristics and cognitive biases. These are the mental
    shortcuts that we use as humans to cope with the vast amount of information that
    we process daily to navigate our social worlds. For instance, we will typically
    assume that anyone wearing the uniform or clothing of an organisation is a part
    of that organisation, as if someone wearing the overalls associated with a cleaning
    company is an employee of company. Most of the time this would be a reasonable
    assumption to make, and it would be impractical for employees in a company to
    ask everyone a cleaner''s uniform to prove that they are a legitimate employee
    of cleaning company. This is of course something that is exploited by social engineers,
    who may for instance gain access to an organisation... phishing emails will often
    include a logo that matches the organisation that the phishing email is purporting
    to be, such as the logo of a bank. In both cases the attacker is exploiting the
    fact that individuals come to quick conclusions about the legitimacy of what they
    are seeing, due to these visual cues.


    There have been many specific types of heuristics and cognitive biases identified
    in the psychological literature (Hasenstab, 2013), many of which in turn'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'could feasibly be exploited by social engineers and attackers. These include
    biases and heuristics to influence emotions, memory, and perceptions of risk and
    probability. Due to the lack of psychological research on social engineering however
    there are fewer studies than could be expected to explicitly identify specific
    heuristic and cognitive biases in cases of social engineering. Nevertheless, less
    relevant studies have been conducted. For instance, Luke, Nurse, and Erola (2016)
    found evidence for the anchoring effect in their study of phishing websites. The
    anchoring effect is a cognitive bias identified by Northcraft and Neale (1987),
    in which individuals over-rely on the first piece of information they are presented
    with. Northcraft and Neale''s study for example found that presenting people with
    an erroneous estimation of the value of a property influenced''s valuation of
    the property. This occurred when the individual was a real estate agent, i.e.,
    an expert who could be expected to come to an objective and rational conclusion.
    In the study by lu et al. (2016) a similar phenomenon was observed, in which participants''
    views of the legitimacy of a phishing website were influenced by their initial
    judgement of that website.


    There are some challenges around the terminology used to describe heuristics and
    cognitive biases, which is a representation of the wider views in cybersecurity
    of the challenges inherent in human behaviour. It could be argued that the term
    ''heuristic'' is more often used in an objective manner to refer to any mental
    shortcut that ''cognitive biases'' tend to have more negative connotations, and
    suggests that the use of heuristic has led to an unwanted outcome. In the case
    of the latter, the implication is that cognitive biases are a flaw of human cognition,
    and one which makes difficult for cybersecurity practitioners to ensure that socio-technical
    systems are safe. Simply put, the existence of cognitive biases can lead to the
    view that humans are inherently unpredictable, unreliable, and irrational, and
    a source of irritation to cybersecurity practitioners who despair at the inability
    of humans to behave sensibly when using computer systems. However, the counterview
    from psychological research would be that these heuristics and cognitive purposes
    are not a flaw in humans, but instead serve a purpose. Haselson (2009) ''comment
    From an evolutionary perspective, however, it would be surprising if the mind
    were really so woefully muddled''. Instead, as discussed earlier, we use cognitive
    biases and heuristics to process the extensive amount of information that we are
    presented with as we engage with our environment, which includes our interactions
    with others. Others are also making use of cognitive biases and heuristics, so
    not only must we understand our environment, but we must also account for the
    fact that the people we are interacting with will behave in ways which, on the
    surface, appear to be irrational. Given this, it is not surprising that we make
    mistakes in navigating'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# 32 Social engineering


    our social world. The key point identified by Hasleton et al. (2009) however is
    that we have evolved this system of heuristics and cognitive biases and continue
    because, more often than not, they provide us with an advantage. As will be discussed
    in greater detail in Chapter 6, this is something that should be recognised when
    attempts are being made to change human behaviour. In brief, behaviour change
    and prevention campaigns aim to stop humans from making any use of heuristics
    and cognitive biases are very unlikely to be successful.


    As noted by Workman (2008), many of the techniques used by social engineers are
    similar to those used within marketing. This is perhaps surprising. Both social
    engineering and marketing are based on the principles of persuasion put forward
    by Cialdini (2001). For instance, Happ et al. (2016) explored the role of the
    norm of reciprocity in social engineering, noting the norm of reciprocity is a
    very ingrained one. People will feel to return a favour, even if they did not
    invite the favour in the first place. In cybersecurity this reciprocity can take
    the form of the exchange of information (Tamjidamcolo, Bin Baba, Tamjid, & Gholipur,
    2013). Other cognitive processes are exploited by social engineers, such as confirmation
    bias (Nickerson, 1998). Many phishing emails appear in formats that match what
    we expect to see, such as the use of logos. This approach also utilizes the representativeness
    heuristic (Kahneman & Tversky, 1972), in which we are more likely to judge something
    as legitimate if it is familiar. As several ethical social engineers have noted,
    these biases can be exploited in offline settings as well. For instance, wearing
    a high visibility jacket and other suitable clothing can be used to gain access
    to a site, with renowned social engineer Jenny Radcliffe making use of this strategy
    to attend the Glastonbury music festival for free in her earlier days (Radcliffe,
    2023).


    # Social engineers


    Whilst the techniques used by social engineers have been studied (Mouton, Leenen,
    Mal & Venter, 2014), there is limited research on social engineers. Instead, knowledge
    about the life experiences and characteristics of social engineers primarily comes
    directly from autobiographical accounts, by which their nature may be biased.
    There have been several books written by social engineers, including Social Engineering:
    The Science of Human Hacking (Hadnagy, 2018) and People Hacker: Confessions of
    a Burglar for Hire (Radcliffe, 2023), as well as people podcasts that include
    interviews with social engineers, such as Darknet Diaries (Rhysider, 2017–). These
    sources provide valuable insights into the psyche of social engineers, although
    some have re-labelled the discipline from an ‘art’ to a ‘science’ (Hadnagy, 2011,
    2018), there remains a need for empirical research to better understand this population.
    Doing so will help'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Social engineering 33


    inform prevention and mitigation strategies against social engineering attacks.
    It may also suggest ways in which people can be encouraged to consider ethical
    social engineering as a legitimate cybersecurity career path, which would help
    address the cybersecurity recruitment crises (ISACA, 2022). In support of this,
    it has been noted that many of the skills displayed by students from non-IT backgrounds,
    such as psychology, are especially relevant to the techniques used in social engineering
    attacks. This contrasts with the skillsets often displayed by students from IT
    backgrounds, whose education focuses more on technical aspects of cybersecurity
    (Taylor et al., 2017) rather than consideration of behaviour and in depth analyses.


    One of the challenges in understanding the role of social engineers in the cybercrime
    ecosystem is terminology. Hacking refers broadly to the act of using a system
    for a purpose other than what it was designed for. This does not itself mean that
    the act of hacking is criminal, although it has such connotations (Thackray, 2019).
    This concept of changing a system could be applied to socio-technical systems,
    and therefore include the human elements that are often targeted by social engineers.
    We would argue though ''hacker'' is typically used to mean an attack that is based
    on technological means and that social engineering is seen as a related but separate
    discipline. These blurred lines between different types of hacking activity reflect
    wider debates and discussions in the hacking community, which includes whether
    ''hacker'' is even a meaningful label (Thackray, Richardson, Dogan, Taylor, &
    McAlaney, 2017). These discussions are complicated by stereotypes and prejudices
    of hackers, an issue that is not helped alone. For example Woo (2003) observed
    high levels of narcissism and aggression in hackers, whereas Platt (1994) noted
    that, as a group, hackers appeared to be quite mild-minded.


    As outlined in the literature with reference to black hat and white hat hackers
    (McAlaney, Kimpton, & Thackray, 2019), there is also a distinction between those
    who commit acts of social engineering for criminal purposes (black hat) and those
    who do so for legitimate reasons (white hat). The latter is a form of penetration
    testing, in which example a company may employ a social engineer to investigate
    the ease with which they could access sensitive data within that company. Again,
    there is inconsistent terminology used to describe this white hat approach to
    social engineering, as noted earlier in this chapter, such individuals have been
    referred to as ethical social engineers. The stories written by high profile ethical
    social engineers such as Chris Hardy (2018) and Jenny Radcliffe (2023) demonstrate
    the ease with which a skilled social engineer is able to achieve their goal. A
    recurrent theme throughout these texts is that the target companies are often
    overconfident in their ability to protect themselves against such attacks. It
    could be speculated that because we'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# 34 Social engineering


    these organisations often equate a cybersecurity attack with a technological breach,
    rather than something that utilises trickery and psychological manipulation of
    the humans in the organisation. Indeed, these preconceptions held by individuals
    in the target company are often the very things used against that company by the
    social engineer.


    As a starting point understanding the life and motivation of ethical engineers
    we can consider the work that has been done with hackers, albeit with an acknowledgement
    of the conflation between social engineering and hacking. The circumplex model
    by Seebruck (2015), discussed in more detail in Chapter 3, identifies five broad
    motivations for cybercrime – prestige, recreation, ideology, revenge, and profit.
    Of these, profit could feasibly be the most applicable to ethical social engineers,
    in life it is an activity that they receive payment for. However, from the accounts
    given by ethical social engineers it would appear there are elements of prestige
    and recreation involved so well. Often, individuals talk about the sense of excitement
    they feel when, for instance, trying to gain access to a secure building, and
    the sense of accomplishment they feel when successful. There is further an issue
    we argue appears to be in the background when considering ethical social engineering
    which is rarely discussed – whether ethical social engineers have previously committed
    criminal acts. This has parallels discussions in relation to hackers. As noted
    in previous research, companies will often state that they not employ penetration
    testers who have a criminal record, and yet it appears to be an open secret that
    to be a successful white hacker requires at least some experience of criminal
    behaviour (Thackray, 2019). In other hands, a successful white hacker may in fact
    be more of a grey hacker. From the accounts given by ethical social engineers
    in the media it would appear that many individuals have participated in actions
    that are likely illegal, in their youth before they established themselves as
    an ethical social engineer (Rhysider, 2017). While many of the stories told by
    ethical social engineers suggest criminality may have occurred (such as trespassing)
    there rarely appears to be any real criminal intent behind their; nevertheless,
    there may be a reluctance for ethical social engineers to discuss what experiences
    they have had. This is where academic research can contribute. It has been found
    for example that hackers will speak relatively openly to academic researchers,
    provided that they trust the information they provide will be treated cordially
    (Thackray et al., 2017).


    Another avenue for understanding the experiences and characteristics of social
    engineers is forensic psychology. This discipline has been used to explore the
    identities and motivations of criminals, some of which may be applicable to both
    criminal and ethical social engineers. A challenge exists though in that, whilst
    social engineering includes offline activities, typically also includes an'
