    Jenny Radcliffe''s book People Hacker: Confessions of a Burglar for Hire outlines
    her life experiences as an ethical social engineer (Radcliffe, 2023). Radcliffe
    discusses her interest in this career began as a young girl, when she would explore
    abandoned buildings in her hometown of Liverpool. This is an activity that would
    now be referred to as urban exploring, a hobby that is the basis of several popular
    YouTube channels. Radcliffe discusses the importance of having a plan, along with
    several backups, attempting to access a building. In doing so she creates a near
    miss early in her career when an impulsive decision to start a job earlier than
    originally nearly resulted in her being caught and suffering a severe injury.
    This, and other discussions put forward by ethical social engineers, the degree
    of preparation and planning that they put into a job. Indeed, it would often seem
    that they put in more than people do to protect themselves. A common observation
    made by social engineers is how they by default try to open a door, by all expectations,
    be locked, and on the fact that it is surprising how this is not in the case.
    As Radcliffe highlights, security is often an illusion, pointing out that many
    poorly fitted doors in houses are simply lifted out of the frame, if the correct
    technique is used. Radcliffe also discusses how stereotypes and perceptions can
    aid her in the work. As she puts it, people do not expect a mid-aged woman to
    have any understanding of criminality. These misconceptions, coupled with overconfidence
    of the type that might perhaps be found amongst executives in large corporations,
    would seem to be a factor in why Radcliffe is consistently successful in breaching
    their defences. To quote, ‘I don’t look at picking a lock. I look at the person
    whose job it is to keep the lock closed, then persuade them to open it.


    Physical locking is though not without its uses. In the Dark Diaries episode ‘The
    Deviant’, the ethical penetration tester of the same pseudonym discusses his work
    on testing physical security as a service to companies (Riley, 2023). He also
    notes the ease with which this is done, and often does not require any actual
    lock picking. When this is required, it typically poses little challenge the interiors
    of wealthy companies and products to protect are often secured behind inexpensive
    locks. A question that is raised in this episode is why companies do not simply
    hire locksmiths to test their physical security, rather than professional penetration
    testers like Deviant. The response given in the interview is that part of the
    role of the professional penetration tester is to produce a report that explains
    to the how they were able to gain access, but that the culture amongst professional
    locksmiths would be to treat these insights as protected knowledge. This issue
    of transparency in sharing how buildings and systems can be breached is a'
