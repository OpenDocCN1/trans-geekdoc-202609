  \         object\nStreamingMovies     object\nContract            object\nPaperlessBilling\
  \    object\nPaymentMethod       object\nMonthlyCharges      float64\nTotalCharges\
  \         object\nChurn               object\n```\n`dtype: object`\n\n1. 我们可以看到大多数特征都是\
  \ `object` 类型（字符串），因此我们需要将它们转换为适当类型，即供模型消费的 `int`/`float`。\n2. 首先，`TotalCharges`\
  \ 特征需要转换为 `float`。\n```python\ndata['TotalCharges'] = pd.to_numeric(data['TotalCharges'])\n\
  ```\n3. 为了将类别特征转换为数值，我们可以根据数据使用 `LabelEncoder` 或 `OneHotEncoder`。\n```python\nle_columns\
  \ = [] # 用于 Label Encoding 的列\nohe_columns = [] # 用于 One-Hot Encoding 的列\ncolumns\
  \ = clean_data.columns\nfor col in columns:\n    if clean_data[col].dtype == 'object':\n\
  \        if len(data[col].unique()) <= 2:\n            le_columns.append(col)\n\
  \        else:\n            ohe_columns.append(col)\n# 执行 Label Encoding\nclean_data[le_columns]\
  \ = clean_data[le_columns].apply(LabelEncoder().fit_transform)\n# 执行 One-Hot Encoding\n\
  one_hot_encoded_data = pd.get_dummies(clean_data, columns=ohe_columns, dtype=int,\
  \ drop_first=True)\n```\n\n### 4. 数据分析：现在我们已经准备好了数据，可以进行一些基础分析。\n\n1. **流失分布：**\
  \ 检查到目前为止有多少客户已经流失。从下面的图中可以看到，总客户中约 26% 的客户已经流失。我们在这里需要观察的一点是类别不平衡，即对于建模而言，我们的负类（`churn`）数量较少。在这种情况下，我们可以应用过采样（oversampling）。\n\
  ![](img/Figure-2.4)\n图 2.4：流失分布\n\n2. 同样，我们可以检查流失用户和留存用户的特征整体分布。\n![](img/Figure-2.5)\n\
  图 2.5：流失与月费的关系\n从上一个图表中，我们可以看到月费较高的用户更容易流失。此外，从接下来的图中，我们看到流失用户在公司的时间较短，这在逻辑上是预期的，但我们可以观察到大多数用户是在初期离开的。\n\
  ![](img/Figure-2.6)\n图 2.6：流失与资限的关系\n\n同样，我们可以探索数据并获得更多洞察，这对于构建模型时的决策非常有用，也有助于业务理解流失用户的模式并采取留住这些用户的决策。\n\
  \n### 5. 模型构建与评估\n\n1. 首先，我们需要选取任何简单的分类算法并在我们的数据上构建模型。该模型将被视为基准模型（baseline model）。之后，我们需要评估它并切换到更高级的模型或进行超参数调优。\n\
  2. 对于这个用例，我们将使用逻辑回归算法来构建基准模型。\n逻辑回归模型的性能：\n| class | precision | recall | f1-score\
  \ | support |\n| :--- | :--- | :--- | :--- | :--- |\n| 0 | 0.83 | 0.89 | 0.86 |\
  \ 1033 |\n| 1 | 0.62 | 0.51 | 0.56 | 374 |\n| accuracy | | | 0.79 | 1407 |\n表 2.1：逻辑回归性能\n\
  \n3. 我们还可以测试其他算法并查看效果。让我们测试随机森林算法。\n随机森林模型的性能：\n| class | precision | recall | f1-score\
  \ | support |\n| :--- | :--- | :--- | :--- | :--- |\n| 0 | 0.81 | 0.93 | 0.86 |\
  \ 1033 |\n| 1 | 0.67 | 0.38 | 0.48 | 374 |\n| accuracy | | | 0.78 | 1407 |\n表 2.2：随机森林性能\n\
  \n4. 在这里观察到随机森林的精确率（precision）增加了，但召回率（recall）降低了。根据问题描述，召回率是我们用例中重要的性能指标。\n5. 如果我们希望获得更健壮的模型，可以尝试不同的方法、算法、特征工程等并进行不同的实验。\n\
  6. 目前，让我们采用逻辑回归模型作为最终模型进入下一个阶段。\n\n### 6. 模型部署\n\n1. 开始部署时，首先需要考虑要利用的环境资源。如果模型的延迟要求非常低（实时处理），我们需要考虑可靠的资源。另一方面，如果延迟要求不高，批量处理就足够，我们可以优化资源。\n\
  2. 既然我们已经确定了模型，就需要将其投入生产环境。\n    1. 首先，我们需要将代码转换为生产兼容的结构；为此，我们可以使用基于 Flask 的 API\
  \ 结构。\n    2. 这里，API 将接收用户的输入数据并对其进行预测（是否会流失）。\n    3. 之后，我们可以构建它的 Docker 镜像并将其部署到任何地方（本地、公有云/私有云等）。\n\
  \n\n\n\n1. 在我们的用例中，用户的更新数据（所有 19 个特征的值）将通过（API 调用）传递给模型，而结果（是否流失）将直接更新在数据库中。\n2.\
  \ 可以创建一个独立的仪表板向利益相关者展示结果。或者利益相关者也可以直接从数据库中获取结果。\n\n## 模型监控与维护\n\n1. 我们需要对数据和模型添加监控。以下是一些场景：\n\
  \   1. 检查是否存在空值。\n   2. 接收到每个 `customerID` 的数据。\n   3. 模型性能在整个时间内保持一致。\n   4. 如果数据出现任何错误，应在\
  \ API 异常中处理，并发送邮件/Teams/Slack 告警。\n\n这些是我们考虑的少数情况，但我们需要考虑多种场景，并相应地为整个 ML 流水线添加监控。\n\
  \n2. 模型重训练：\n   1. 为了决定重训练频率，我们需要了解接收新数据的频率。如果是每小时或每天一次，我们需要考虑实时性。\n   2. 如果在月底我们获得了关于用户是否流失的实际数据，我们需要使用这些数据并重训练模型。这将确保我们的模型性能保持一致。\n\
  \   3. ML 流水线是一个迭代过程，因为我们会从利益相关者获得反馈，观察模型/数据的性能，获得新想法等。我们可能需要返回之前的步骤，执行数据收集、数据准备、模型构建、更新模型部署方法、更新部署环境等步骤。\n\
  \      * 例如，如果业务开始收集一个新的数据特征 `age`，在这种情况下我们需要使用添加的特征重新构建模型，并在流水线中进行必要的更改。\n   4.\
  \ 随着每次迭代，整个 ML 流水线将进一步改进。\n\n我们已经详细讨论了某个特定用例的所有阶段，但根据领域和用例类型，我们可能需要以不同的方式执行某些步骤。总体，在开发任何领域和类型的\
  \ ML 解决方案时，我们应该遵循上一节探索的所有观点，这将引导我们开发高效的 ML 流水线。\n\n# 结论\n\n在本章中，我们深入研究了 ML 生命周期的动态过程，它区别于传统的软件开发方法。传统的软件开发遵循规划、开发、测试、部署和维护等定义良好的阶段，而\
  \ ML 生命周期由于其迭代性质和对数据驱动决策的依赖引入了复杂性。\n\n我们揭示了直接将传统的软件开发方法应用于 ML 项目的局限性。ML 由数据、算法和不断演变驱动，其内在差异对传统的顺序方法构成了挑战。数据的动态性质以及持续学习的需求。\n\
  \n我们探索了对成功的 ML 项目至关重要的 ML 生命周期阶段。从理解问题和数据收集，到预处理、模型构建、评估、部署以及持续 ongoing 模型监控和维护，每个阶段都具有重要意义。ML\
  \ 生命周期的迭代性质强调了模型在不断变化的现实场景中保持有效所需的所需的持续精炼和适应。\n\n最后，我们探索了真实世界的案例研究，以理解 ML 生命周期的实际应用。从电信领域的客户流失预测到使用\
  \ `Python` 涵盖数据分析、预处理、模型构建和部署，案例研究揭示了生命周期各个阶段之间的复杂性和相互依赖关系。它展示了彻底的数据分析、细致的准备、模型选择、评估和部署策略在交付有影响的\
  \ ML 解决方案方面的重要性。\n\n在下一章中，我们将探索用于构建高效 MLOps 流水线的不同工具和技术。\n\n# 检验理解\n\n1. 在时间序列预测问题中，需要哪些监控检查？\n\
