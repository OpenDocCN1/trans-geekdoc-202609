  \ 错误\n\n# 第 3 章\n\n## MLOps 中的基本工具和技术\n\n## 引言\n\n本章将介绍 MLOps 的基本支柱，包括版本控制系统、实验管理平台、基础设施管理工具、编排工具以及模型监控与治理工具。这些工具在确保整个机器学习操作生命周期复杂环境中的协作、可重复性、可扩展性和效率方面起着至关重要的作用。版本控制系统能够跟踪代码和模型的更改；实验管理平台简化了实验和协作；基础设施管理工具优化了资源分配；编排工具自动化了部署过程；模型监控与治理工具确保了模型性能和合规性。这些工具共同提高了\
  \ MLOps 生命周期的整体效率和有效性，使组织能够交付稳健且扩展的机器学习解决方案。最后，我们有一些练习来测试我们的理解。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\
  \n* 版本控制系统\n    * 版本控制系统的组成\n    * 版本控制系统的类型\n    * 版本控制系统的重要性\n* 实验管理平台 (EMP)\n\
  \    * EMP 的功能\n    * EMP 的优势\n    * 选择正确的 EMP\n    * EMP 工具\n    * 示例\n* 基础设施管理工具\n\
  \    * 基础设施管理工具的类型\n    * 示例\n    * `Terraform`\n* 编排工具\n    * 编排工具的类型\n    * 示例\n\
  * 模型监控与治理工具\n    * 模型监控工具的类型\n    * 示例\n\n## 版本控制系统\n\n版本控制系统（VCS）是一种软件工具或系统，能够管理和跟踪文件、代码、文档或任何数字内容随时间产生的更改。它是软件开发中的一个核心组件，有助于协作、版本控制、历史跟踪以及维护项目文件的完整性。让我们了解版本控制系统的核心概念：\n\
  \n* **版本控制**：VCS 捕捉文件或代码的不同版本。它维护更改历史，允许用户访问和比较不同的迭代。\n* **更改跟踪**：它记录对文件的修改，包括添加、删除和修改。这种跟踪功能有助于理解发生了哪些更改、何时发生的以及是谁完成的。\n\
  * **协作**：VCS 允许多个用户同时在同一文件或代码库上工作，将更改合并到统一版本中，同时处理并发修改产生的冲突。\n\n\n\n\n*   **恢复到先前的状态：**\
  \ 如果需要，用户可以恢复到文件或代码的早期版本。这种回滚能力对于调试、错误解决或恢复到稳定状态至关重要。\n\n## 版本控制系统的组件\n\n以下是 VCS\
  \ 的组件：\n\n*   **仓库 (Repository)：** 这是一个存储所有版本的文件、代码或 ML 模型的存储空间。根据所使用的 VCS，仓库可以是集中式的也可以是分布式的。\n\
  \n*   **工作副本 (Working Copy)：** 指用户正在处理的文件或代码的本地副本。它与仓库同步，用户在将更改提交到仓库之前，会对该副本进行修改。\n\
  \n*   **提交 (Commits)：** 提交是对文件或代码所做更改的快照。用户将更改提交到仓库，并对修改了的内容提供描述。\n\n*   **分支与合并\
  \ (Branching and Merging)：** 分支是独立的开发线，允许用户独立地进行功能开发或实验。合并将不同分支的更改合并到一个版本中。\n\n\
  ## 版本控制系统的类型\n\nVCS 有两种：\n\n*   **集中式版本控制系统 (CVCS)：** 在 CVCS 中，有一个单一的集中服务器存储所有版本的文件或代码。用户从该服务器检出文件，进行更改，然后将其签回。\n\
  \    *   **示例：** Concurrent Versions System (CVS), Subversion (SVN)。\n    *   **用例：**\
  \ 一个使用集中代码库开发 Web 应用的小型软件开发团队。`SVN` 提供了一种简单且集中的代码更改管理和项目协作方式。\n\n*   **分布式版本控制系统\
  \ (DVCS)：** DVCS 并不依赖于中心服务器。相反，每个用户都拥有仓库的完整副本，允许更大的灵活性、离线工作和更容易的分支。\n\n    *   **示例：**\
  \ Git, Mercurial。\n    *   **用例：** 一个来自世界各贡献者合作开发复杂软件产品的开源项目。`Git` 的分布式特性允许开发者独立工作、提交更改并无缝协作。\n\
  \n    ![](img/figure-3.1.jpg)\n\n    **图 3.1：** 版本控制系统的类型\n\n## 版本控制系统在 MLOps 中的重要\n\
  \n假设我们正在训练一个 ML 模型来预测财务趋势。经过几天细致的数据清洗、复杂的特征工程和超参数调整，最终得到了看似完美的模型。但当它部署到生产环境时，却崩溃了，导致我们手忙脚乱地理解哪里出错。这就是没有版本控制系统\
  \ (VCS) 的 MLOps 的残酷现实。VCS 仔细地跟踪我们模型和数据的每一次更改、变异和迭代，免受灾难性生产事故的影响。以下是强调 VCS 必要性的几个关键点：\n\
  \n*   **协作：** 在软件开发或任何涉及多个贡献者的协作项目中，VCS 允许几名开发者同时处理同一代码库，而不会互相干扰。它为合并不同团队成员所做的更改提供了结构化机制，确保项目的连贯和统一。\n\
  \n*   **历史与跟踪：** VCS 维护了随时间推对文件或代码所做更改的详细历史。这些历史记录包含了做了哪些更改、何时更改以及是谁做的信息。这种跟踪能力对于理解项目演进、识别错误或问题以及需要时追踪特定更改至关重要。\n\
  \n*   **版本控制与回滚：** VCS 允许不同时间点创建和管理项目的不同版本或快照。此功能允许用户在发生错误、实验失败或需要特定版本进行比较或复现时，恢复到之前的代码或\
  \ ML 模型版本。\n\n*   **备份与恢复：** VCS 通过维护所有版本文件或代码的完整历史充当备份系统。这确保了数据的完整性，并防止意外的删除、损坏或数据丢失，为恢复项目的先前状态提供了安全网。\n\
  \n*   **促进实验与并行开发：** VCS 支持创建分支，分支是从主代码库分叉出来的独立开发线。分支允许开发者对新功能进行实验、测试更改或处理项目的不同方面，而不会影响主代码的稳定性。一旦通过验证，来自分支的更改就可以合并回主代码库。\n\
  \n*   **冲突解决：** 当多个用户同时修改同一个文件时，可能会出现冲突。VCS 提供了高效管理和解决这些冲突的工具和机制，允许团队成员之间进行更顺的协作。\n\
  \n*   **审计与合规：** 出于监管合规或审计目的，维护良好的更改历史（包括谁在何时做的）是至关重要的。VCS 提供了审计追踪，有助于满足问责和合规性要求。\n\
  \n让我们来看一个例子来更好地理解 VCS 的用法。考虑：\n\n*   团队 A 正在为订阅服务开发流失预测模型。一名成员调整了特征选择过程，而另一名修改了超参数。VCS\
  \ 允许他们独立工作，并知道他们的更改以后可以轻松合并和测试。\n\n*   团队 B 正在苦生产模型性能下降的难题。VCS 帮助他们通过系统地回滚到之前的版本并分析其影响，找出触发问题的准确代码更改。\n\
  \n*   团队 C 正在准备一项新的营销活动，需要更新需求预测模型。VCS 通过允许他们在部署到生产环境之前在历史数据上测试更新后的模型，促进了平滑过渡。\n\
  \n版本控制系统是 ML 生命周期中必不可少的工具，它们促进协作、跟踪更改、维护历史并确保项目文件或代码库的完整性和可靠性。它们在跨各个行业实现高效、组织的工作流方面发挥着至关重要的作用。\n\
  \n# 实验管理平台\n\n在机器学习项目的动态环境中，高效的实验管理对于成功至关重要。实验是迭代模型开发的核心，通过训练、测试和精炼算法来获得最佳性能。实验管理平台\
  \ (EMP) 在协调这一复杂过程中起着关键作用，为管理实验、跟踪进度以及促进团队之间的协作提供了结构化框架。我们将探索 EMP 在 MLOps 生命周期中的重要性、其关键特性、优势以及最佳实践。\n\
  \n机器学习中的实验涉及许多组件，包括数据集版本控制、超参数调优、模型训练、评估和监控。EMP 作为集中平台，简化了这些组件，允许数据科学家和工程师高效地进行、跟踪和复现实验。\n\
  \n# EMP 的功能\n\n以下是实验管理平台的一些功能：\n\n*   **实验跟踪：** EMP 详尽地记录实验细节，包括超参数、代码版本、数据集、指标和结果。这种全面的跟踪有助于可复现性，并便于不同模型之间的比较。**示例：**\
  \ `MLFlow`, `Weights, and Biases`。\n\n*   **版本控制：** 它们为数据集、代码和模型提供版本控制功能，确保工作流的一致可溯性。版本控制对于维护实验历史记录和跨团队协作至关重要。**示例：**\
  \ `GitHub`, `GitLab`。\n\n\n\n\n\n*   **超参数优化：** EMP 通常提供超参数调优工具，自动搜索最优模型配置。此功能加速了寻找最佳性能模型的过程。**示例：**\
  \ `Optuna`、`Ray Tune`。\n*   **模型服务与部署：** 某些 EMP 与部署流水线集成，实现模型从实验环境到生产环境的无缝过渡。这种集成简化了部署过程，并确保模型在不同环境中性能一致。**示例：**\
  \ `MLFlow`、`DVC`。\n*   **协作与共享：** EMP 通过允许团队共享实验、结果和见解来促进协作。这促进了知识共享并加速了组织内的创新。**示例：**\
  \ `Pachyderm`。\n*   **实验可视化与比较：** EMP 提供仪表板和可视化工具，用于比较模型性能指标。**示例：** `TensorBoard`。\n\
  \n# EMP 的优势\n\n以下是使用 EMP 的一些优势：\n\n*   **提高效率和生产力：** 通过自动化重复任务、标准化工作流以及提供易于跟踪和比较的工具，EMP\
  \ 增强了生产力，让数据科学家能够更多地关注创新和模型改进。\n*   **可复现性与审计：** EMP 通过捕获所有相关细节确保实验的可复现性。这不仅有助于复现结果，还便于审计和符合监管标准。\n\
  *   **优化模型性能：** 凭借超参数调优和强大的实验能力，EMP 能够帮助寻找最优模型配置，从而提高模型性能和准确性。\n*   **促进协作：** 中心化平台促进了数据科学团队之间的协作，鼓励见解、技术和最佳实践的共享。这种协作环境培养了持续学习和改进的文化。\n\
  \n## 采用 EMP 的最佳实践\n\n*   使用一致的命名规范和详细实验文档可以提高可追溯性和可复现性。\n*   对数据集、代码、模型和依赖项进行版本控制，以确保一致性并易于回滚到之前的状态。\n\
  *   利用自动化处理重复任务（如超参数调优、模型训练和部署），以加速实验过程。\n*   鼓励团队在平台内共享实验、见解和最佳实践，以营造协作环境。\n* \
  \  保持 EMP 更新最新功能和安全补丁，以确保最佳性能和数据安全。\n\n# 选择合适的 EMP\n\n选择正确的实验管理平台需要对各种因素进行仔细评估，以确保符合我们的特定需求、工作流和目标。以下是选择合适的\
  \ EMP 的结构化方法：\n\n1.  **定义需求：** 评估当前的机器学习工作流，识别痛点，并确定 EMP 何能产生最大价值。列出所需的功能，如实验跟踪、超参数调优、制品管理、协作工具、扩展性等。\n\
  2.  **评估集成能力：** 确保 EMP 与我们目前的技术栈无缝集成，包括机器学习框架、版本控制系统（如 `Git`）、CI/CD 流水线和云平台。评估平台是否能随增长的需求进行扩展，并适应各种实验需求。\n\
  3.  **考虑用户体验和采用：** 评估平台的用户界面和用户体验。友好的界面可以降低学习曲线并鼓励团队成员采用。检查 EMP 是否提供足够的培训资源、文档和支持，以帮助用户有效利用其功能。\n\
  4.  **安全性与合规：** 确保 EMP 符合安全最佳实践并提供强大的数据隐私措施，特别是在处理敏感数据时。验证平台是否符合监管标准和特定行业的合规性要求。\n\
  5.  **性能与可靠性：** 评估平台在速度、处理大型数据集的效率以及执行实验方面的性能。查找有关平台运行时间和可靠性的评论或信息，以确保对工作流的干扰最小。\n\
  6.  **成本考量：** 评估 EMP 的定价模型——是基于使用情况、功能还是用户/许可——并确保其符合您的预算和预期的投资回报率（ROI）。利用免费试用或演示来测试平台的功能，并在提交之前判断其适用性。\n\
  \n通过根据这些标准系统地评估 EMP 并将其与我们的特定需求和目标对齐，我们可以做出明智的，选择一个能够优化支持您的 MLOps 计划的实验管理平台。\n\n\
  # EMP 工具\n\n以下是不同实验管理平台工具的要概述：\n\n*   **MLFlow**\n    *   **功能：** `MLFlow` 提供端到端的机器学习生命周期管理，包括实验跟踪、代码打包、模型管理和部署。\n\
  \    *   **关键方面：** 它支持多个机器学习库、版本控制集成以及模型打包，以便在各种平台上无缝部署。\n    *   **使用场景：** 适用于需要在统一环境中拥有具有实验跟踪、模型版本控制和部署能力的全面平台的组织。\n\
  *   **Weights and Biases (wandb)**\n    *   **功能：** 专注于实验跟踪、可视化和协作，允许用户高效地记录指标、比较运行情况并共享结果。\n\
  \    *   **关键方面：** 提供丰富的可视化工具、交互式仪表板和协作功能，促进团队成员之间的见解共享。\n    *   **使用场景：** 适用于关注详细实验跟踪、可视化和协作的团队，特别是在研究导向的环境中。\n\
  *   **Optuna**\n    *   **功能：** 一个开源超参数优化框架，采用了如树结构帕森估计器 (`TPE`) ) 和贝叶斯优化等算法。\n\
  \    *   **关键方面：** 提供可扩展且高效的超参数调优，探索大型搜索空间以识别最优配置。\n    *   **使用场景：** 对于自动化超参数调优、优化机器学习模型以及在各种机器学习任务中获得更好的性能非常有价值。\n\
  *   **Data Version Control (DVC)**\n    *   **功能：** 专注于数据版本控制和管理，与 `Git` 无缝集成以对数据集进行版本控制并跟踪更改。\n\
  \    *   **关键方面：** 使数据科学家对大型数据集进行版本控制，促进机器学习项目中的协作和可复现性。\n    *   **使用场景：** 特别适用于跟踪和管理大型数据集的变化对于维护可复现性和协作至关重要的环境。\n\
  *   **Kubeflow**\n    *   **功能：** `Kubeflow` 是一个开源平台，旨在在 `Kubernetes` 集群上编排和管理机器学习工作流。\n\
  \    *   **关键方面：** 允许创建和执行机器学习流水线，允许用户定义和自动化复杂的工作流。\n    *   **使用场景：** `Kubeflow`\
  \ 适用于需要管理整个机器学习生命周期的平台的组织。\n\n![](img/figure-3.2.jpg)\n\n**图 3.2：** EMP 工具\n\n这些平台中的每一个都针对\
  \ MLOps 中实验管理的特定方面，提供了不同的特性和功能，以满足机器学习工作流中的多样化需求。\n\n\n\n\n\n实验管理平台（Experiment Management\
  \ Platforms）是 MLOps 领域不可或缺的工具，它们能够简化实验流程、提高效率，并促进数据科学团队之间的协作。有效率采用和利用 EMP 可以显著增强组织的创新能力，并从机器学习项目中获取价值。\n\
  \n## 示例\n\n考虑这样一种场景：我们正在构建一个机器学习模型，并进行多次实验以微调高效的超参数值。对于此场景，我们将使用 `MLFlow` 来跟踪实验。以下是具体步骤：\n\
  \n1. **安装 MLflow：**\n确保已安装 `mlflow`。使用以下命令：\n```bash\npip install mlflow\n```\n\n\
  2. **初始化 MLflow 实验：**\n首先创建一个 `MLflow` 实验来跟踪机器学习工作流：\n```python\nimport mlflow\n\
  ### 创建或设置活跃的 MLflow 实验\nmlflow.set_experiment(\"LogisticRegression_Tuning\")\n```\n\
  我们将使用上一节中讨论的流失预测案例。\n因此，我们将尝试测试具有多个超参数值的逻辑回归模型，并将各种信息记录到 `mlflow` 中。\n\n3. **记录参数和指标：**\n\
  在你的机器学习代码中，使用 `mlflow` 的跟踪方法记录参数和指标：\n```python\n### 记录模型的参数\nparams = {\n  \"C\"\
  : [0.01, 0.1, 1.0, 10.0],\n  \"penalty\": [\"l1\", \"l2\"]\n}\nmlflow.log_params(params)\n\
  ### 机器学习模型训练代码\n### …\n#记录超参数和指标到 MLflow\nmlflow.log_params({\"penalty\": penalty,\
  \ \"C\": C})\nmlflow.log_metric(\"accuracy\", accuracy)\n```\n\n4. **跟踪模型制品（Artifacts）：**\n\
  保存并记录模型制品，例如训练好的模型或其他文件：\n```python\n### 将训练的模型作为制品记录\nmlflow.sklearn.log_model(lr,\
  \ f\"LogisticRegression_Model_{i+1}\")\n### 记录额外的制品，如可视化结果或文件\nmlflow.log_artifact(\"\
  path/to/file\")\n```\n\n5. **查看结果：**\n要查看记录的实验和指标，请访问 `MLFlow` 界面：\n```bash\nmlflow\
  \ ui\n```\n此命令启动一个本地服务器（默认在 `http://localhost:5000`），你可以在其中查看工作流期间记录的实验、指标、参数和制品。\n\
  \n通过这些步骤，我们使用 `GridSearchCV`跨跨正则惩罚（`penalty`）和正则强度（`C`）进行逻辑回归超参数调优。它运行具有不同超参数的实验，记录参数和指标（`accuracy`），并使用\
  \ `mlflow` 将每个训练模型保存为制品。\n\n登录 `MLFlow` UI 后，我们可以查看详情。在接下来的截图，我们可以看到执行的所有八个实验都已记录。我们可以点击每个实验查看详情，例如指标值、参数值、制品详情等。\n\
  \n![](img/figure-3.3.jpg)\n\n**图 3.3：** MLflow 实验\n\n此外，还可以对比所有实验，并通过可视化来高效地获取洞察。在接下来的图中，我们可以看到显示每次执行实验准确率的图表。\n\
  \n![](img/figure-3.4.jpg)\n\n**图 3.4：** MLFlow 实验图\n\n# 基础设施管理工具\n\n任何成功的 MLOps\
  \ 实践的基础都是可靠且可扩展的基础设施。就像坚固的桥梁允许交通畅通一样，适当的基础设施管理确保了数据、模型和代码在整个机器学习生命周期中的无缝移动。基础设施管理工具是核心组件，专注于机器学习工作流所需的底层基础设施的编排、配置、配置和维护。\n\
  \n与传统的 IT 基础设施相比，MLOps 基础设施面临独特的挑战。机器学习负载的动态性质（不断变化的资源需求和复杂的依赖关系）需要灵活且可扩展的方法。此外，对可复现性、协作和高效资源利用的需求增加了额外的复杂性。\n\
  \n基础设施管理工具通过提供一系列全面的能力来应对这些挑战，提供了支持。它们提供以下功能：\n\n*   **配置与自动化：** 这些工具能够自动配置资源，包括计算实例、存储、网络和软件依赖，以为机器学习任务设置所需的基础设施。\n\
  *   **容器化与编排：** 如 `Docker` 的容器化工具和如 `Kubernetes` 的容器编排平台至关重要。它们允许将机器学习模型及其相关依赖封装到可移植的容器中，并管理它们跨机器集群的部署和扩展。\n\
  *   **可扩展性与资源管理：** 高效管理资源分配的工具对于扩展机器学习实验至关重要，它们在适应波动负载的同时确保了计算资源的最优利用。\n\n## 基础设施管理工具的类型\n\
  \n以下是不同类型的基础设施管理工具：\n\n*   **容器化工具**\n    *   **Docker：** 允许创建和部署轻级、可移植的容器，封装应用程序及其依赖项。\n\
  \    *   **Podman：** 提供与 `Docker` 镜像兼容的安全且无守护的容器引擎，侧重于易用性和安全性。\n*   **容器编排平台**\n\
  \    *   **Kubernetes：** 提供强大的容器编排功能，实现容器化应用的部署、扩展和管理。包括 `Amazon EKS`、`Google Kubernetes\
  \ Engine (GKE)`、`Azure Kubernetes Service (AKS)` 等。这些云托管 `Kubernetes` 服务提供了可扩展性和便捷的部署。\n\
  *   **基础设施配置与配置管理**\n    *   **Terraform：** 一种基础设施即代码 (IaC) 工具，允许跨各种云平台配置基础设施资源。\n\
  \    *   **Ansible：** 自动化配置管理和应用部署，确保环境之间的一致性。\n\n![](img/figure-3.5.jpg)\n\n**图\
  \ 3.5：** 基础设施管理工具\n\n## 基础设施管理工具在 MLOps 中的优势\n\n*   **可扩展性与活性：** 基础设施管理工具能够无缝扩展资源以满足机器学习工作流不断的需求。\n\
  *   **标准化与一致性：** 它们确保基础设施设置和配置的统一，减少不一致并确保实验的可复现性。\n*   **效率与成本优化：** 有效的管理和监控有助于优化资源使用，从而节省成本并提高运营效率。\n\
  *   **可靠性与性能：** 监控工具通过提供基础设施性能的洞察来增强可靠性，允许主动维护和优化。\n\n基础设施管理工具在构建稳健且可扩展的 MLOps 环境方面起着至关重要的作用，确保支持机器学习工作流的基础设施资源的高效编排、配置和优化。仔细选择和实施这些工具对于为成功的\
  \ MLOps 操作建立弹性且高效的基础设施基础至关重要。\n\n## 示例\n\n让我们考虑一个在 MLOps 中使用基础设施管理工具真实场景：\n\n金融机构的数据科学团队正在开发和部署用于欺诈检测的机器学习模型。他们需要可扩展的基础设施来高效处理不断变化的负载。\n\
  \n\n\n\n\n-   **使用 Terraform 进行基础设施配置：** 团队使用 `Terraform` 来定义代码基础设施（IaC），以便在 AWS\
  \ 上设置其云环境。`Terraform` 脚本定义了虚拟机、存储、网络配置以及用于托管机器学习模型和训练数据的其他资源的创建。\n-   **使用 Kubernetes\
  \ 进行容器化和编排：** 基础设施配置完成后，将使用 `Kubernetes` 进行容器编排。`Docker` 容器封装了机器学习模型、依赖项和预处理流水线。`Kubernetes`\
  \ 集群在已配置的基础设施上管理这些容器的部署、扩展和监控。\n-   **针对不同负载的扩展：** 在交易量增加期间（表明存在潜在的欺诈活动），对模型预测的需求会激增。`Kubernetes`\
  \ 的自动伸缩功能根据定义的指标（如 CPU 利用率或请求率）自动扩展容器数量以满足增加的负载，而无需人工干预。`Terraform` 的基础设施定义确保了底层资源可用，以无缝支持增加的容器实例。\n\
  \n在这种场景下，集成 `Terraform` 进行基础设施配置和使用 `Kubernetes` 进行容器编排，数据科学团队能够构建一个可扩展且高效的基础设施，用于部署和管理机器学习模型，专门为处理欺诈检测场景中的不同负载而定制。\n\
  \n### Terraform\n\n假设我们想在 AWS 上部署模型，为此，我们需要设置一些基础设施，例如创建 `IAM roles`、启用服务等。为了完成所有这些工作，我们可以使用\
  \ `Terraform` 并自动化所有这些过程。让我们通过一个 `Terraform` 代码示例，在 AWS（Amazon Web Services）上设置基础设施并创建一个虚拟机（EC2\
  \ 实例）。以下是涉及的步骤：\n\n1.  创建 `main.tf` 文件并编写以下代码：\n\n```terraform\n### 配置 AWS Provider\n\
  provider \"aws\" {\n  region = \"us-west-2\" # 目标 AWS 区域\n}\n### 创建一个新的 EC2 实例\n\
  resource \"aws_instance\" \"ML_server\" {\n  ami= \"ami-12345678\" # AMI ID（Amazon\
  \ 机器镜像）\n  instance_type = \"t2.micro\" # 实例类型（例如，t2.micro）\n  tags = {\n    Name\
  \ = \"example-server\"\n  }\n}\n```\n\n我们也可以创建变量文件来将变量值存储在一个地方，或者像上述代码定义那样静态地定义值。\n\
  \n2.  要运行代码，我们需要执行以下步骤：\n\n   1.  在包含 `.tf` 文件的目录中初始化 `Terraform`：\n```bash\nterraform\
  \ init\n```\n\n   2.  审查并计划 `Terraform` 将执行的更改：\n```bash\nterraform plan\n```\n\n\
  \   3.  应用更改以创建基础设施（在本例中为 EC2 实例）：\n\n```bash\nterraform apply\n```\n\n`Terraform`\
  \ 代码定义了一个 AWS provider 和一个 EC2 实例。我们可以通过将 `ami` 替换为我们所需的 AMI ID，并根据需求自定义其他设置（如实例类型或标签）来对其进行定制。在此之前，我们需要确保已经配置了妥当的\
  \ AWS 凭据（通过 `AWS CLI` 或环境变量）以及拥有创建 EC2 实例所需的权限。务必验证所创建的资源以避免产生意外费用。\n\n# 编排工具\n\n\
  创建和实现机器学习（ML）模型的过程涉及一系列经过仔细协调的任务，包括数据准备、模型训练、评估、部署和监控。如果这些任务没有经过仔细的编排，过程可能会迅速变得无组织且混乱，导致任务被孤立执行且重要的依赖关系被忽视，导致整个系统出现错误和效率低的问题。编排工具为这种混乱带来了秩序。它们提供了一个全面的平台来实现：\n\
  \n-   可视化地设计并自动化您的 ML 流水线的各个阶段，确保任务按照正确的顺序运行并遵循依赖关系。\n-   在 ML 流水线中跟踪、版本化并分发数据及制品（例如、模型、日志），确保每个人都使用正确的版本和依赖项。\n\
  -   根据负载和可用性高效分配资源（计算、存储）并调度任务，最大化提高效率并防止瓶颈。\n-   密切监控 ML 流水线的健康状况，接收错误或异常告警，并快速做出反应以确保运行顺畅。\n\
  -   为团队提供一个中心平台，用于协作、共享工作流和跟踪进度，促进透明度和知识共享。\n\n## 编排工具类型\n\n以下是 MLOps 中常用的几种编排工具：\n\
  \n-   **Apache Airflow**\n  `Airflow` 是一个开源平台，用于通过有向无环图（DAGs）编排复杂的工作流。它允许通过定义任务及其之间的依赖关系来对工作流进行调度、监控和管理。它是管理数据流水线、协调模型训练作业以及编排部署工作流的理想选择。\n\
  \n-   **Kubeflow Pipelines**\n  作为 `Kubeflow` 平台的一部分，`Kubeflow Pipelines` 能够在 `Kubernetes`\
  \ 上创建、共享和执行机器学习工作流。它提供了一个图形界面，可以使用可重用组件来设计工作流，确保可重复性。\n\n-   **Luigi**\n  `Luigi`\
  \ 是由 Spotify 开发的基于 Python 的编排工具，用于构建复杂的流水线。它侧重于数据流水线管理、定义定义并以灵活扩展的方式执行任务。非常适用于管理\
  \ ETL（提取、转换、加载）过程和编排涉及多个任务的流水线。\n\n-   **Prefect**\n  `Prefect` 是一个现代的工作流编排平台，强调简单易用。它提供了一个\
  \ Python 原生的接口来定义和执行工作流、处理依赖关系，并为流水线运行提供可可见性。\n\n-   **Argo Workflows**\n  `Argo\
  \ Workflows` 是一个针对 `Kubernetes` 的开源容器原生工作流引擎。它允许以代码形式定义工作流并在 `Kubernetes` 集群上执行，提供了扩展性和可靠性。\n\
  \n-   **DAGster**\n  `DAGster` 是一个用于编排数据工作流和管理数据质量的数据调度器。它侧重于通过定义 DAG 和确保数据质量检查来构建可靠的数据流水线。对于编排数据流水线并确保机器学习工作流中使用的数据质量和可靠性特别有用。\n\
  \n![](img/figure-3.6.jpg)\n\n**图 3.6:** 编排工具\n\n每种编排工具为 MLOps 中的工作流管理提供了独特的功能、能力和方法。工具的选择取决于组织环境中特定的需求、工作流复杂性、基础设施以及偏好。\n\
  \n### 示例：Airflow\n\n通过 `Airflow` DAG，我们可以定义数据获取、处理、建模等操作，以及它们的执行顺序。我们还可以为每个过程定义特定的调度间隔。以下是一个用于机器学习流水线的简单\
  \ Apache Airflow DAG 步骤示例。该示例演示了涉及数据处理、模型训练和模型评估的任务编排。\n\n1.  **DAG 初始化：**\n\n```python\n\
  from datetime import datetime, timedelta\n```\n\n\n\n\n```python\nfrom airflow import\
  \ DAG\nfrom airflow.operators.python_operator import PythonOperator\n```\n\n定义默认参数和\
  \ DAG 参数，如开始日期、执行操作/代码的调度细节等：\n\n```python\ndefault_args = {\n    'owner': 'airflow',\n\
  \    'depends_on_past': False,\n    'start_date': datetime (2023, 1, 1),\n    'retries':\
  \ 1,\n    'retry_delay': timedelta(minutes=5),\n}\n\ndag = DAG (\n    'ml_pipeline',\n\
  \    default_args=default_args,\n    description='machine learning pipeline',\n\
  \    schedule_interval=timedelta(days=1), # 运行此操作\n)\n```\n\n## 2. 为任务定义 Python\
  \ 函数\n\n为流水线的每个任务定义 Python 函数：\n\n```python\ndef preprocess_data():\n    # 在此处编写数据预处理代码\n\
  \    print(\"Data preprocessing completed successfully!\")\n\ndef train_model():\n\
  \    # 在此处编写模型训练代码\n    print(\"Model training completed successfully!\")\n\ndef\
  \ evaluate_model():\n    # 在此处编写模型评估代码\n    print (\"Model evaluation completed\
  \ successfully!\")\n```\n\n## 3. 为每个任务创建 Operator\n\n为每个任务创建 `PythonOperator` 实例：\n\
  \n```python\npreprocess_data_task = PythonOperator(\n    task_id='data_preprocessing',\n\
  \    python_callable=preprocess_data,\n    dag=dag,\n)\n\ntrain_model_task = PythonOperator(\n\
  \    task_id='model_training',\n    python_callable=train_model,\n    dag=dag,\n\
  )\n\nevaluate_model_task = PythonOperator(\n    task_id='model_evaluation',\n  \
  \  python_callable=evaluate_model,\n    dag=dag,\n)\n```\n\n## 4. 定义任务依赖\n\n设置任务之间的依赖关系：\n\
  \n```python\npreprocess_data_task >> train_model_task >> evaluate_model_task\n```\n\
  \n该 DAG 结构表示 `train_model_task` 依赖于 `preprocess_data_task` 的成功完成，而 `evaluate_model_task`\
  \ 依赖于 `train_model_task` 的完成。\n\n## 5. 执行与运行 DAG\n\n将文件保存到 Airflow 的 DAG 文件夹（通常为\
  \ `$AIRFLOW_HOME/dags`）；如果在云端使用 Airflow（GCP、AWS 等），我们需要将文件保存到相应的 `dags` 。一旦文件上传，启动\
  \ Airflow 调度器和 Web 服务器：\n\n```bash\nairflow scheduler\nairflow webserver -p 8080\n\
  ```\n\n如果是本地部署，可以在浏览器中通过 http://localhost:8080  Airflow UI；如果使用特定的云平台，可以使用 GCP Composer\
  \ 或 AWS 工作流管理。UI 加载后，我们可以触发 DAG 运行代码，或者它将按照调度的时间间隔自动运行。\n\n此示例说明了如何在 Airflow 中定义用于机器学习流水线的\
  \ DAG，其中包含三个任务：数据预处理、模型训练和模型评估。我们可以根据需求和用例添加更多自定义的函数，以创建一个全面的流水线。\n\n# 模型监控与治理工具\n\
  \nMLOps 中的模型监控与治理工具对于确保机器学习模型在整个生命周期内的持续性能、可靠性、合性和伦理使用至关重要。这些工具在管理和监控部署在生产环境的模型方面起着关键作用。部署机器学习模型并不是旅程的终点。现实世界是一个动态阶段，数据不断演变，用户行为发生偏移，并会出现不可预测的情况。如果不加检查，我们曾经表现模型可能会受到几种危险威胁：\n\
  \n*   **模型漂移（Model Drift）：** 随着时间的推移，由于数据或现实世界的变化，模型的性能可能会下降。\n*   **偏差与公平性（Bias\
  \ and Fairness）：** 在缺陷或有偏差的数据上训练的模型可能会延续社会不公，做出歧视某些群体的不公平决策。\n*   **可解释性与信任（Explainability\
  \ and Trust）：** 理解模型如何做出决策对于建立信任和确保负责任的 AI 实践至关重要。\n*   **对抗攻击（Adversarial Attacks）：**\
  \ 恶意攻击者可以操纵数据或利用漏洞产生错误或有害的预测。\n\n这就是模型监控与治理的力量所在。以下是这些工具的一些功能：\n\n*   **性能监控：**\
  \ 实时跟踪模型指标（准确率、精确率、召回率）。\n*   **版本控制与元数据管理：** 管理模型版本、谱和元数据，以实现追溯性和可重复性。\n*   **漂移检测：**\
  \ 识别由于变化导致的概念漂移、数据漂移或模型下降。\n*   **合规性与治理：** 确保模型符合监管标准、伦理考虑和公平性。\n\n## 模型监控工具\n\n\
  有不同的工具可用，以下是 MLOps 中的一些模型监控与治理工具：\n\n*   **Prometheus 和 Grafana：** 这对开源组合提供了强大的监控和可视化能力，允许我们跟踪模型性能并识别异常。\n\
  *   **Amazon SageMaker Model Monitor：** 来自 AWS 的云端解决方案，与您部署的模型无缝集成，提供自动漂移检测、偏差分析和可解释性报告。\n\
  *   **Seldon Core：** 一个允许在 Kubernetes 上部署和监控机器学习模型的平台。Seldon Core 提供了大规模管理模型和监控其性能的工具。\n\
  *   **Fairlearn：** 一个开源库，专注于减轻机器学习模型中的偏差，提供识别和纠正算法中不公平现象的工具。\n\n![](img/figure-3.7.jpg)\n\
  \n**图 3.7：** 模型监控工具\n\n模型监控与治理工具对于确保生产环境中机器学习模型的持续可靠性、合性和伦理使用是不可缺的。理解它们的功能并进行选择有助于组织维护部署模型的有效性和信誉。\n\
  \n## 示例\n\n考虑一家电子商务公司已部署了一个机器学习模型，根据客户的浏览历史向其推荐产品。该模型通过 REST API 提供，是公司产生收入的关键组件。对于监控，他们正在使用\
  \ Prometheus 和 Grafana 监控以下组件：\n\n*   **监控模型指标：** 配置 Prometheus 每隔几秒钟从模型服务的 REST\
  \ API 端点抓取指标。收集的指标包括：\n    *   模型响应传入请求所需的时间。\n    *   推荐产品预测评分的分布。\n    *   错误预测或失败的频率。\n\
  *   **用于模型健康的 Grafana 仪表板：** 创建 Grafana 仪表板以实时可视化所收集的模型指标。\n    *   监控延迟趋势，以确保模型在可接受的时间限制内响应。\n\
  \    *   可视化预测评分的分布，以确保模型推荐的多样性。\n    *   跟踪错误率和失败，以便快速检测和排排除模型问题。\n\n\n\n\n在 `Prometheus`\
  \ 中为关键指标设置阈值（例如，延迟超过定义的限制，错误率增加某一阈值）。`Grafana` 配置为在突破阈值时触发告警，并通过 Teams、`Slack` 或电子邮件发送通知。当模型性能下降或发生错误时，运维团队会收到即时告警，以便快速响应以维护服务可靠性。\n\
  \n### 容量规划与扩展\n`Prometheus` 监控模型托管服务器的服务器资源利用率，如 CPU、内存和网络使用率。`Grafana` 仪表板显示这些指标，帮助运维团队进行容量规划并根据需要扩展资源，确保模型在高峰期间能够处理增加的流量。\n\
  \n### 性能分析与改进\n由 `Prometheus` 收集并在 `Grafana` 中显示的历史数据有助于性能分析以及识别趋势或模式。数据科学家和工程师可以利用\
  \ `Grafana` 的洞察，根据观察到的趋势和用户行为优化模型、微调参数并提高性能。\n\n`Prometheus` 和 `Grafana` 在监控生产环境中机器学习模型的健康状况、性能和资源使用方面起着至关重要的作用。`Grafana`\
  \ 仪表板提供的实时可视化、告警和容量规划，结合 `Prometheus` 收集的指标，能够实现 MLOps 流水线中部署的机器学习模型的主动维护、快速问题解决和持续改进。\n\
  \n# 结论\n在本章中，我们探索了作为成功 MLOps 实践骨柱的核心工具和技术。从使用版本控制系统对代码进行细致组织，到实验管理平台提供的全面监督，我们看到了每种工具如何在优化\
  \ ML 流水线中发挥至关重要的作用。\n\n基础设施管理工具是模型运行的舞台，确保了高效的资源分配和可扩展性。编排工具成为指挥家，精确且优雅地引导数据、任务和模型在流水线中流动。最后，模型监控和治理工具担任守护者，确保部署模型的性能、公平性和可信度，为构建伦理且负责任的\
  \ ML 项目奠基础。在下一章中，我们将介绍构建高效数据流水线和管理数据流的步骤。\n\n# 检验你的理解\n1. 假设我们已经在云平台上创建了用于批量处理预测的\
  \ ML 流水线，在这种情况下：\n    1. 基础设施管理中的哪些过程可以自动化？\n    2. 对于这些过程，我们可以使用什么工具？\n    3. 我们如何让流水线更高效、更可靠？\n\
  2. 在模型监控中我们需要进行哪些重要的检查？\n3. 考虑一种场景：我们部署了一个新版本的 ML 模型但其表现不佳，在这种情况下可以做什么？\n4. 检查以下陈述的对对错：\n\
  \    1. ML 流水线不需要模型版本控制。\n    2. `MLFlow` 有助于跟踪已执行的 ML 实验。\n    3. 在 ML 生命周期中只有基础设施监控是必要的。\n\
  \    4. 我们可以使用 `Git` 进行协作开发。\n\n**4 的答案：** a. 错误；b. 正确；c. 错误；d. 正确\n\n# 第 4 章：MLOps\
  \ 中的数据流水线与管理\n\n## 引言\n本章探讨了关键组件，如数据摄取与集成、特征存储管理、数据质量、监控告警、EDA、数据预处理、特征工程以及数据流水线的编排管理，包括自动化这些流水线的关键实践。理解并优化每个阶段对于在现实应用中创建高效且有影响力的机器学习工作流至关重要。最后，我们还有一些练习来测试我们的理解。\n\
  \n## 结构\n在本章中，我们将讨论以下主题：\n* 数据摄取与集成\n    * 数据摄取\n    * 数据清洗\n    * 数据转换\n    * 数据集成\n\
  * 特征存储管理\n    * 特征存储的优势\n    * 示例\n* 数据质量与监控告警\n    * 数据质量的重要性\n    * 数据质量检查\n \
  \   * 数据告警\n    * 示例\n* 探索性数据分析与数据预处理\n* 特征工程\n* 数据流水线编排\n    * 数据流水线自动化\n\n# 数据摄取与集成\n\
  数据摄取与集成在机器学习生命周期中起着关键作用，确保原始数据被收集、转换，并为分析和模型开发做好准备。这一过程涉及从各种源获取数据、对其进行清洗并集成为适用于机器学习模型的格式。\n\
  \n## 数据摄取\n数据摄取是从各种源收集并将原始数据导入 MLOps 生态系统的过程。这包括来自数据库、数据湖、外部 API、流式源等的数据。数据摄取的主要目标是使多样化的数据集可用于分析、模型训练和决策。该过程可以分为两个类型：批量摄取和实时（流式）摄取。\n\
  \n* **批量摄取：** 在批量摄取中，数据以大块或批次进行收集和处理。这适用于数据更新对时间不敏感且可以定期处理的场景。示例包括数据库的每日转储、日志文件或计划的数据上传。\n\
  * **实时摄取：** 实时摄取在数据生成时对其进行处理，允许近乎瞬时的分析和响应。流式源（如社交媒体馈、IoT 设备或金融交易）受益于实时摄取，以提供及时的洞察。\n\
  \n## 数据摄取工具\n数据摄取工具通过提供高效获取、传输和加载数据到目标系统的能力，促进了从不同源收集原始数据并将其引入中央存储的过程。这些工具通常支持批量和实时数据摄取，以适应不同的数据交付需求。一些常用的数据摄取工具包括：\n\
  \n* **Apache Kafka**: `Apache Kafka` 是一个分布式流处理平台，提供高吞吐量、容错的数据摄取能力。它实现了实时数据流和消息传递，适用于在\
  \ MLOps 环境中构建可扩展且可靠的数据流水线。\n* **AWS Kinesis**: `AWS Kinesis` 是亚马逊云服务 (AWS) 提供的托管流处理服务，允许用户收集、处理和分析实时数据流。它支持流式和批量数据摄取，适用于处理\
  \ MLOps 工作流中的多种数据源。\n* **Google Cloud Pub/Sub**: `Google Cloud Pub/Sub` 是谷歌云平台 (GCP)\
  \ 提供的全托管消息服务，实现应用程序之间的异步消息传递。它为进入 GCP 环境提供了可扩展且可靠的数据摄取能力。\n* **Apache NiFi**: `Apache\
  \ NiFi` 是一个开源数据流管理工具，促进跨系统的数据摄取、转换和路由。它提供图形化界面来设计数据流，并支持从多个源进行实时数据摄取。\n\n## 数据清洗\n\
  一旦数据被摄取，通常需要进行清洗和转换才能用于机器学习。这就是数据清洗（Data Wrangling）发挥作用的地方。数据清洗涉及：\n\n\n\n\n*  \
  \ **数据清洗：** 处理缺失值、纠正错误并移除离群值以确保数据质量。\n*   **数据结构化：** 将原始数据转换为与分析和建模工具兼容的结构化格式。\n\
  *   **数据增强：** 添加额外信息或特征，以增强数据集对于模型的丰富性和相关性。\n\n数据清洗（Data wrangling）为 MLOps 流水线的后续阶段准备原始数据，确保数据是一致的、准确的并符合机器学习模型的需求。\n\
  \n*   **示例：** 在医疗保健领域，数据清洗可能涉及标准化来自不同医疗提供者的电子健康记录 (EHR)。这一过程确保了患者数据的一致性，从而能够开发出预测患者结果的稳健模型。\n\
  \n## 数据转换\n\n数据转换侧重于将预处理后的数据转换为适用于模型训练和分析的格式。数据转换的关键方面包括：\n\n*   **特征工程：** 从现有特征创建新特征，以捕捉模型学习所需的各种信息。\n\
  *   **类别变量编码：** 将分类数据转换为机器学习算法可以理解的数值表示。\n*   **缩放与归一化：** 将数值特征调整为标准比例，以防止某个特征主导学习过程。\n\
  \n数据转换对于从数据提取提取意义的模式和关系至关重要，能够增强模型做出准确预测的能力。\n\n*   **示例：** 在金融领域，数据转换对于欺诈检测模型至关重要。它可能涉及根据交易模式创建新特征、编码商户信息以及对交易金额进行归一化，从而产生更有效的异常检测模型。\n\
  \n## 数据集成\n\n数据集成涉及整合来自各种源的数据创建一个全面的数据集。这可能涉及解决模式冲突和处理不同粒度的数据。不同的数据集成工具、模式映射技术和稳健的验证检查可以帮助应对集成挑战，并确保数据在\
  \ MLOps 流水中无缝流动。\n\n*   **示例：** 在制造业中，整合来自工厂地板传感器的数据涉及处理数据格式和时间戳的差异。集成解决方案确保来自不同传感器的数据正确对齐，为预测性维护模型提供全面的视图。\n\
  \n## 数据集成工具\n\n数据集成工具在将来自多种源的数据无缝集成到机器学习工作流中起着关键作用。MLOps 中使用的一些常用数据集成工具包括：\n\n*\
  \   **Apache Airflow：** Apache Airflow 是一种工作流编排工具，允许用户调度、管理和监控数据工作流。它支持将有向无环图 (DAGs)\
  \ 定义复杂的数据流水线，并为数据集成、转换和工作流自动化提供了丰富的功能。\n*   **Talend Data Integration：** Talend\
  \ Data Integration 是一个全面的数据集成平台，提供了用于设计、部署和管理数据流水线的广泛功能。它支持批处理和实时数据集成，使其适用于具有多种数据处理需求的\
  \ MLOps 环境。\n*   **Azure Data Factory：** Azure Data Factory 是由 Microsoft Azure 提供的云端数据集成服务。它允许用户创建、调度和编排数据流水线，以便跨越本地和云环境摄取、转换和移动数据。\n\
  *   **Informatica：** Informatica 是领先的数据集成平台，为各种数据集成任务提供解决方案，包括数据摄取、数据质量和数据治理。它提供了一套完整的工具，用于在\
  \ MLOps 环境中设计和管理数据流水线。\n\n## 数据质量保证\n\n数据质量保证涉及实施流程以确保采集和转换数据的准确性、完整性和可靠性。质量保证对于防止因数据准确或不完整导致的模型训练错误至关重要。\n\
  \n*   **示例：** 在电信领域，网络性能数据至关重要，数据质量保证包括对信号强度数据进行持续监控。任何差异或异常值都会触发自动流程来重新摄取和处理数据，以维护模型的完整性。\n\
  \n## 最佳实践\n\n在机器学习生命周期中，处理来自各种源和格式的数据是构建成功模型的关键步骤。MLOps 实践强调稳健的数据管理策略，以确保为模型建立清洁、一致且统一的数据基础。在这里，我们将探索应对这一挑战的最佳实践：\n\
  \n*   **标准化数据格式：** 采用 `JSON`、`CSV` 或 `Parquet` 等标准数据格式，以确保不同系统和工具之间的互操作性和易集成性。标准化数据格式简化了数据处理，并减少了对自定义解析和转换逻辑的需求。\n\
  *   **实施数据验证：** 验证输入数据以确保准确性、完整性和一致性，特别是处理来自外部源的数据时。执行模式验证、范围验证和格式验证，以有效检测并处理错误或不完整的数据。\n\
  *   **数据分析与质量检查：** 在摄取过程早期执行数据分析和质量检查，以识别数据中的异常、错误和不一致之处。使用数据分析工具分析数据分布，识别离群值，并评估完整性、准确性和一致性等数据质量指标。\n\
  *   **自动化数据流水线：** 使用工作流编排工具自动化数据流水线，以简化数据摄取、转换和加载任务，并尽可能减少人工干预。使用 `Apache Airflow`、`Apache\
  \ NiFi` 或 `Azure Data Factory` 等工具设计、调度和监控数据工作流，确保效率和可靠性。\n*   **可扩展性与韧性：** 设计具有可扩展性和韧性的数据流水线，以处理大量数据并适应数据量和速度的波动。使用\
  \ Apache Spark 或 Google Dataflow 等分布式式计算框架实现可扩展的数据处理架构，并行处理数据并在需要时水平扩展。\n*   **数据治理与安全：**\
  \ 实施数据治理策略和安全控制，以确保数据隐私、符合法规并防止未经授权的访问和破解。使用加密、访问控制和审计跟踪来保护敏感数据并确保符合法规。\n*   **元数据管理：**\
  \ 维护元数据目录以跟踪数据血缘、版本和使用情况，促进数据资产的可追溯性和审计性。使用元数据管理工具捕获并存储元数据信息（如数据模式、数据转换和数据血缘），以便更好地数据治理和数据血缘分析。\n\
  \n## 示例\n\n一家电子商务公司运营多个在线平台，并接收来自 Web 服务器、移动应用程序、第三方供应商和社交媒体平台等各种源的数据。该公司旨在整合这些多样化数据，以获得对客户行为的洞察，优化营销活动并改进产品推荐。\n\
  \n\n\n\n\n*   使用 `JSON` 格式处理客户数据，使用 `CSV` 格式处理销售交易，使用 `Avro` 格式处理点击流数据。这种标准化确保了不同数据源之间的一性和兼容性。\n\
  \n*   验证客户数据以确保其包含电子邮件地址和电话号码等基本属性。此外，执行模式验证（schema validation）以识别数据中的任何差异或不一致之处。\n\
  \n*   为了自动化数据摄取和集成，可以使用 `Apache NiFi`，这是一种开源数据流管理工具。`Apache NiFi` 允许设计和部署数据管道，将数据从各种源摄取、转换并路由到集中数据湖中。调度这些流水线定期运行，以确保数据的及时更新。\n\
  \n# 特征存储管理 (Feature Store Management)\n\n特征存储是一个集中存储库，能够在整个机器学习（ML）生命周期中高效地管理和组织机器学习模型使用的特征。特征（Features）也被称为输入变量或属性，是机器学习模型用于预测的数据的可测量属性或特征。这些特征可能包括数值值、分类变量或任何影响模型输出的相关数据。\n\
  \n在特征存储中，特征以结构化的方式存储，使得模型训练、验证、测试和部署能够易于访问。特征存储的核心组件包括：\n\n*   特征工程与版本控制：特征工程涉及将原始数据转换为有意义的特征。版本控制确保特征的变化被追踪，从而允许模型训练的可复现性。\n\
  \n*   特征目录（Feature Catalog）：目录提供了每个特征的元数据，包括其定义、数据类型、来源和统计属性。这使得数据科学家更容易发现和理解可用的特征。\n\
  \n*   数据血缘与元数据管理：数据血缘追踪特征的来源和转换历史，提供透明度和可追溯性。元数据管理包含了关于特征的来源、质量以及应用于特征的转换的信息。\n\n\
  *   实时与批处理服务：可以实时访问特征用于生产环境中的预测，并进行批处理以用于历史数据的模型训练。\n\n![](img/figure-4.1.jpg)\n\
  \n**图 4.1:** 特征存储\n\n## 特征存储 (Feature Stores)\n\n以下是 MLOps 中常用的不同特征存储概述，以及其关键特性和比较：\n\
  \n| 特征存储 | 交付模型 | 支持的平台 | 优点 | 缺点 |\n| --- | --- | --- | --- | --- |\n| Feast (开源)\
  \ | 开源 | AWS, GCP, Azure, 本地 | 灵活，与各种 MLOps 工具集成 | 需要运维开销，UI/UX 特性有限 |\n| Hopsworks\
  \ | SaaS, 本地 | 平台无关 | 用户友好的界面，数据治理功能 | 对于大型部署来说成本可能较高 |\n| AWS SageMaker Feature\
  \ Store |托管服务 | AWS | 与 AWS 生态紧密集成，自动伸缩 | 平台独立性有限 |\n| Databricks Feature Store\
  \ |托管服务 | Databricks, MLFlow | 与 Databricks 生态集成，支持实时特征 | 主要面向 Databricks 用户 |\n\
  | Metastore (Meta) |托管服务 | 平台无关 | 可扩展，具备访问控制功能 | 特征工程能力有限 |\n\n*   特征工程支持：某些特征存储提供内置的特征工程功能，而另一些则提供。\n\
  \n*   实时服务：并非所有特征存储都支持实时，而这一点至关重要。\n\n*   成本：开源选项前期成本较低，但托管服务可能有更高的成本。\n\n### 选择合适的特征存储\n\
  \n最佳选择取决于以下因素：\n\n*   项目需求：评估如实时支持、特征工程能力和数据治理等功能。\n\n*   部署平台：选择与你的基础设施兼容的特征存储。\n\
  \n*   团队专业知识：考虑团队对开源或托管服务的熟悉程度。\n\n### 特征存储的优势\n\n使用特征存储有许多益处，例如：\n\n*   可复现性：一旦特征被创建，它们就可以存储在集中存储库中，提高生产力和效率。\n\
  \n*   一致性：了解特征是如何创建的以及是如何计算的至关重要，特别是对于大型组织而言。\n\n*   改进协作：特征存储充当协作枢纽的角色，允许数据科学家共享、发现和重用特征。\n\
  \n*   增强模型监控与调试：特征存储具有详细的元数据和血缘，有助于模型监控和调试。数据科学家可以追溯问题的根源。\n\n*   促进监管合规：在具有严格监管要求的行业中，特征存储确保模型中使用的特征符合隐私和监管标准。\n\
  \n*   高效的实时与批处理服务：特征存储能够实现特征的高效实时服务用于生产预测以及批处理用于模型训练。\n\n*   可扩展性与性能优化：设计良好的特征存储通过处理大量数据来解决扩展性挑战。\n\
  \n### 示例：Uber 的 Michelangelo 特征存储\n\nUber 的 Michelangelo 是一个机器学习平台，包含一个健壮的特征存储组件。在该系统中，与行程、用户及其他方面相关的特征被集中存储和管理。例如：\n\
  \n*   特征：特征可能包括历史行程数据、客户评级、天气状况和交通模式。\n\n*   特征工程：转换可能包括聚合行程数据以计算每个路线的平均行程时长，或提取与高峰时段相关的特征。\n\
  \n*   版本控制：特征存储追踪变化，确保在引入新特征时，不会破坏现有模型。\n\n\n\n\n\n- **目录**：特征存储（Feature Store）的目录提供了关于每个特征的信息，例如其定义、数据类型和来源。这有助于数据科学家理解并选择用于模型开发的特征。\n\
  - **实时与与批量服务**：实时特征（如当前天气状况）用于实时预测，而批量特征（如历史乘车数据）对于训练模型至关重要，能够随着时间的推移改进服务。\n\n在这个示例中，Uber\
  \ 的特征存储在确保特征的一致性、可复性和易于访问方面发挥着关键作用，促进了用于优化其共享出行服务各个领域的机器学习模型的开发和部署。\n\n# 数据质量与监控告警\n\
  \n数据质量指的是数据的准确性、完整性、一致性、可靠性和及时性。在 MLOps 的背景下，机器学习模型严重依赖数据进行训练和预测，因此数据质量至关重要。它涉及确保机器学习流水线中的数据具有高完整性、无错误，并符合预期用途。让我们来看看数据质量的参数：\n\
  \n- **准确性**：数据点必须没有错误、拼写错误和不一致之处。想象一下，使用标记错误的患者记录来训练医疗诊断 AI，后果可能是灾难性的。\n- **完整性**：缺失值或不完整的记录会在你的数据中产生盲点，阻碍模型从全局中学习的能力。\n\
  - **一致性**：数据格式、单位和表示在整个数据集中应该是统一的，避免为模型引入偏差和混淆。\n- **及时性**：过时或陈旧的数据会导致模型做出无关或不准确的预测，特别是在动态环境中。\n\
  - **相关性**：数据应该与当前任务直接相关。向销售预测模型喂送客户支持工单，就像在森林中迷路时试图通过星图导航。\n\n## 数据质量的重要性\n\n数据质量至关重要，因为它直接影响机器学习模型在整个生命周期中的可靠性、性能和有效性。以下是数据质量在\
  \ MLOps 中起关键作用的主要原因：\n\n- **模型准确性**：模型预测的质量直接受其训练数据质量的影响。不准确或不完整的数据会导致不可靠的模型。\n\
  - **模型泛化能力**：高质量的数据有助于模型良好地泛化到新的、未见的数据。在多样化、具有代表性的数据上训练的模型在现实场景中更有可能有效运行。\n- **偏差与公平性**：糟糕的数据质量会向模型引入偏差，导致不公平或歧视性的结果。确保数据质量对于构建公平且无偏的模型至关重要。\n\
  - **效率与成本**：在流水线后期处理糟糕的数据质量既昂贵又耗时。预先投入数据质量可以节省时间和资源，并最终防止昂贵的错误。\n- **信任与透明度**：当模型由于数据问题产生不可靠的结果时，会破坏对\
  \ AI 的信任并阻碍其采用。建立数据质量文化可以确保透明度并增强对技术的信任。\n\n## 数据质量检查\n\n在 MLOps 中，实施强大的数据质量检查和告警机制对于维护机器学习模型的完整性并确保它们在现实场景中有效运行至关重要。这涉及在整个机器学习生命周期内持续监控数据质量并对可能出现的任何问题做出迅速响应。让我们探索如何在\
  \ MLOps 中实现数据质量检查和告警：\n\n### 数据收集阶段\n在数据收集源头实施验证检查。这包括检查数据格式、范围和逻辑一致性。任何差异或错误应在进入\
  \ ML 流水线之前被标记并处理。\n\n## 数据预处理\n- **缺失值处理**：根据数据的性质实施处理缺失值的策略，如插补或删除。监控缺失值的流行程度，以确保它们保持在接受范围内。\n\
  - **离群点检测**：应用离群点检测技术识别并处理可能影响模型训练的异常数据点。\n\n### 特征工程\n进行检查以确保工程特征在不同数据集之间相关且一致的。消除对模型没有意义贡献的特征。\n\
  \n### 数据版本控制\n对数据集进行版本控制，以实现 ML 实验的可追溯和可重复性。跟踪随时间变化的数据并记录这些变化以供参考。\n\n### 自动化测试\n\
  - **集成自动化测试**：将自动化测试集成到数据流水线中，以便在开发早期检测并解决问题。自动化测试确保数据质量检查的一致性和可重复性。\n- **持续集成**：实施持续集成实践，每当数据或\
  \ ML 流水线发生变化时自动运行测试。这有助于在数据质量问题通过整个流水线之前捕捉它们。\n\n## 数据质量告警\n\n实施有效的数据质量告警机制有助于及时识别和解决数据质量问题，防止不准确或不可靠的数据传播到机器学习模型中。以下是\
  \ MLOps 数据质量告警的关键方面和最佳实践：\n\n### 实时监控\n对数据流水线进行实时持续监控，以识别偏差、异常或意外变化。实时监控能够对潜在问题做出快速响应。\n\
  \n### 告警系统\n- **设置阈值**：为关键数据质量指标定义可接受的阈值。这包括缺失值、离群点或数据分布变化的阈值。\n- **告警触发器**：设置告警触发器，当数据质量指标超过预定义的阈值时生成通知。告警可以发送给相关利益者，包括数据科学家和运维团队。\n\
  \n### 自动化与修复\n- **自动化响应**：在可能的情况下，对常见的数据质量问题实现自动化响应。例如，如果超过了预定义的缺失值阈值，可以触发受影响数据的插补或删除。\n\
  - **协作告警**：启用协作告警，确保通知多个利益者。这促进了数据科学家、数据工程师和领域专家解决数据质量问题之间的协作。\n\n### 文档记录\n记录数据质量检查和告警活动。文档应包含有关问题性质、为解决问题采取的行动以及实施的任何预防措施的细节。\n\
  \n# 数据质量检查与告警的益处\n\n在机器学习环境中实施数据质量检查和告警具有多种益处，对机器学习模型的整体成功和可靠性做出贡献。以下是集成数据质量检查和告警机制的主要益处：\n\
  \n- **早期问题检测**：数据质量检查在流水线早期捕捉问题，防止其传播并影响下游流程。\n- **主动监控**：实时监控和告警能够对偏差做出主动响应，确保及时处理潜在问题。\n\
  - **运营效率**\n\n\n\n\n\n针对常见问题的自动化响应可以提高运营效率，减少人工干预并简化 MLOps 工作流。\n\n### 协作与透明度\n\
  协作告警促进了不同团队之间的通信，提高了透明度，并确保相关利益相关者参与解决数据质量问题。\n\n### 文档与审计\n记录和记录数据质量检查以及告警活动有助于审计，并为数据质量管理工作提供历史记录。\n\
  \n在 MLOps 中实施全面的数据质量检查和告警方法，对于维护机器学习模型的可靠性和有效性至关重要。通过持续监控数据质量并及时响应问题，组织可以确保其机器学习系统在现实应用中平稳运行并提供可信赖的结果。\n\
  \n# 示例：电子商务中的需求预测\n\n让我们考虑一个电子商务平台的真实世界案例，该平台利用机器学习进行需求预测以优化库存管理。该系统依赖历史销售数据、产品信息以及季节性和促销等外部因素来做出准确预测。以下是数据质量检查、监控和告警在此场景中如何发挥至关作用的：\n\
  \n## 1. 数据质量检查\n历史销售数据（包括产品销售、价格和客户信息）从各种来源获取，可能面临缺失值、格式不一致和偶发重复等数据质量问题。让我们来看需要实现的各种数据质量检查：\n\
  \n1. 验证每笔交易是否包含基本信息（例如销售数量、产品 ID 和时间戳）。\n2. 确保数据格式（例如日期格式和价格格式）在所有记录中保持一致。\n3. 识别并删除重复项，以防止销售重复计算。\n\
  4. 验证销售数据中的 `product IDs` 与当前产品目录中的有效产品。\n\n## 2. 数据质量监控\n需求预测模型对历史销售模式的变化非常敏感。数据分布的任何异常或偏移都会影响预测的准确性。让我们来看可以实现的各种数据质量监控策略：\n\
  \n1. 持续监控销售数量的分布，以识别突然的变化或异常。\n2. 跟踪价格随时间的变化，以确保一致性并检测意外波动。\n3. 监控产品目录的变化（如产品的添加或删除），以保持与历史数据的一致。\n\
  \n## 3. 数据质量告警\n需求预测过程中不准确或不一致的数据会导致欠佳的库存管理决策，可能导致缺货或积货情况。\n\n让我们来看可以实现的各种数据质量告警：\n\
  \n1. 为销售数量的偏差设置阈值。如果检测到突然增加或减少，则触发告警以便调查。\n2. 为可接受的价格变化建立阈值。如果观察到显著的价格波动，生成告警进行审核。\n\
  3. 对历史销售数据中的 `product IDs` 与当前产品目录之间的不匹配实施告警。这有助于及早发现差异。\n\n## 4. 自动化响应\n如果没有自动化响应，解决数据质量问题可能非常耗时且依赖人工，导致需求预测流水线延迟。让我们来看可以实现的某些自动化响应：\n\
  \n1. 如果在历史销售数据中检测到缺失值，实施基于历史模式补全缺失信息的自动化流程。\n2. 如果检测到显著的数据偏移或异常，触发需求预测模型的自动重训练，确保模型适应不断变化的模式。\n\
  \n通过实施全面的数据质量检查、持续监控和告警机制，电子商务平台可以实现若干积极成果：\n\n* 数据质量检查确保用于训练预测模型的历史销售数据准确且一致，从而获得更准确的预测。\n\
  * 自动化响应和告警机制能够快速识别和解决数据质量问题，减少不准确预测影响库存决策的风险。\n* 随着数据质量的提高，需求预测模型可以做出更有见见的预测，从而优化库存水平、减少缺货并最大限地减少积货情况。\n\
  \n此示例说明了 MLOps 环境中的数据质量检查、监控、告警和自动化响应如何有助于机器学习应用在现实场景中的可靠性和有效性。这些实践的结合确保了数据驱动的决策基于准确可靠的信息，最终提高了业务成果。\n\
  \n# 探索性数据分析与数据预处理\n\n探索性数据分析 (EDA) 和数据预处理是机器学习生命周期中的关键步骤，包括机器学习运营背景下。EDA 和数据预处理在准备和理解数据以进行有效的模型开发和部署方面发挥着不同但相互关联的作用。\n\
  \n### EDA\nEDA 是通过视觉和统计方法分析数据集以发现模式、关系、异常和其他见解的过程。它的目标是在模型开发之前理解数据的底层结构。让我们来看参与\
  \ EDA 的主要涉及的关键活动：\n\n* **描述性统计：** 计算并分析总结统计量（如平均值、中位数、标准差），以理解数据的中心趋势和变异性。\n* **数据可视化：**\
  \ 生成可视化图，包括直方图、散点图、箱图和热图，以直观检查特征分布、变量之间的关系以及潜在离群值。\n* **相关性分析：** 不同特征之间的相关性，识别可能影响模型性能的模式和依赖关系。\n\
  * **缺失值和异常值检测：** 识别缺失值和离群值，因为它们会影响模型训练并在数据预处理期间需要适当的处理。\n\nEDA 为理解用于训练和部署机器学习模型的数据特征提供了基础。EDA\
  \ 的见解可以指导有关数据预处理步骤、特征工程和整体模型开发策略的决策。\n\n## 数据预处理\n数据预处理涉及清理原始数据并转换为适用于机器学习模型的格式。它解决了缺失值、异常值、类别变量编码和特征缩放等问题。让我们来看数据预处理涉及的关键活动：\n\
  \n* **处理缺失数据：** 根据数据的性质和对模型性能的影响，决定处理缺失值的策略（如插值或删除）。\n* **类别变量编码：** 将类别变量转换为机器学习算法可以理解的数值格式。这可能涉及热编码等技术。\n\
  * **特征缩放：** 对数值特征进行归一化或标准化，以确保它们处于相似的范围内，防止某些特征主导学习过程。\n\n\n\n\n\n- **处理离群值：** 通过截断、转换等技术处理离群值，确保它们不会对模型产生不成比例的影响。\n\
  \n数据预处理是 MLOps 流水线中的关键步骤，因为它确保了模型是在清洁、一致且结构良好的数据上进行训练的。预处理步骤需要是重复的并集成到 MLOps 工作流中，以维护开发、测试和生产环境之间的一致性。实施稳健的数据预处理管道对于实时处理新数据至关重要，确保生产环境中模型输入的格式与训练时相同。\n\
  \nEDA（探索性数据分析）的发现通常指导数据预处理阶段的决策。例如，EDA 的洞察可能会影响缺失值填充方法的选择，或对某些特征建议特定的转换。MLOps 中模型开发的迭代性质意味着，当新数据可用或在生产环境中评估模型性能时，可能需要重新进行\
  \ EDA 和数据处理。\n\n## 工具与库\n\n以下是一些用于 EDA 和可视化的常用工具和库：\n\n## Python 库\n\n- **Pandas:**\
  \ `Pandas` 是 Python 中一个强大的数据处理库，提供了用于清理、转换和分析数据的数据结构和函数。\n- **NumPy:** `NumPy` 是\
  \ Python 中数值计算的基础库，提供了对多维数组和数学函数的支持。\n- **Matplotlib:** `Matplotlib` 是 Python 中的绘图库，能够创建静态、交互式和出版级的可视化图。\n\
  - **Seaborn:** `Seaborn` 是基于 `Matplotlib` 的统计数据可视化库，提供了高级函数来创建信息丰富且美统计图表。\n- **Plotly:**\
  \ `Plotly` 是 Python 中一个多功能可视化库，支持用于探索性数据分析的交互式图表和仪表板。\n- **Scikit-learn:** `Scikit-learn`\
  \ 是 Python 中的机器学习库，包含了数据预处理、特征选择和统计建模的函数。\n\n## 数据可视化工具\n\n- **Tableau:** `Tableau`\
  \ 是一种广泛的数据可视化工具，提供了拖放功能来创建交互式仪表板和可视化内容。\n- **Power BI:** `Power BI` 是微软的一项商业分析工具，允许用户通过交互式报告和仪表盘可视化并共享数据中的洞察。\n\
  - **Google Data Studio:** `Google Data Studio` 是一个免费工具，允许用户使用来自各种来源（包括 Google Analytics、Google\
  \ Sheets 和 `BigQuery`）的数据创建自定义的仪表板和报告。\n\n# EDA 最佳实践\n\n探索性数据分析是数据分析过程中的关键步骤，有助于理解数据集内部的模式、关系和分布。在执行\
  \ EDA 时，请遵循以下最佳实践：\n\n- **理解数据集：** 从彻底理解数据集的结构开始，包括特征数量、数据类型和缺失值。熟悉领域背景以及数据集中每个特征的意义意义。\n\
  - **可视化数据分布：** 使用直方图、箱线图和密度图来可视化数值型变量的分布。这有助于识别离群值、偏态和潜在的数据异常。对于类别变量，使用条形图和频率分布表来理解不同类别的分布。\n\
  - **识别缺失值：** 确定数据集中缺失值的程度并理解其模式。使用热力图或条形图对缺失数据可视化，以识别任何系统性的缺失模式。根据数据性质和分析目标决定处理缺失值的适当策略（如填充或删除）。\n\
  - **探索变量之间的关系：** 使用散点图、矩阵图和相关性矩阵探索数值型变量之间的关系。寻找线性或非线性相关性以及潜在的多共线性。对于类别变量，使用交叉分类表和卡方检验来检查不同类别之间的关系。\n\
  - **检测离群值和异常：** 通过箱线图、散点图和直方图可视化识别数据中的离群值和异常。在决定是否处理或删除离群值时，考虑领域知识和背景。使用 `z-scores`、Tukey\
  \ 方法或四分位距 (`IQR`) 等统计方法来定量检测离群值。\n- **特征工程：** 探索潜在的特征转换（例如对数转换或缩放），以解决数据的偏态或非正态性。根据领域知识或在\
  \ EDA 过程中获得的洞察创建新特征。\n- **记录发现：** 记录 EDA 过程中产生的关键洞察、观察和决策。这些文档将作为后续分析和模型构建的参考。创建视觉总结和报告，向利益相关者团队团队有效传播发现。\n\
  - **迭代过程：** EDA 是一个迭代过程，涉及根据新的发现和观察不断探索和完善分析。与领域专家和利益相关者合作，验证基于数据的推假设和解释。\n\n通过遵循这些最佳实践，我们可以进行全面且富有洞察力的\
  \ EDA，为 ML 项目中的进一步分析和模型构建奠定基础。\n\n## 示例\n\n假设我们的电信公司想要建立客户流失预测模型，我们拥有所有流失用户以及活跃用户的历史数据。首先，我们需要对其进行基础\
