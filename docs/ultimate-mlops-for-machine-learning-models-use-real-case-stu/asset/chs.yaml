  \n### 5. 移除不需要的数据：在这里，从建模角度来看 `customerID` 不是一个有用的特征，因此我们需要将其删除。\n\n```python\n\
  clean_data = data.drop('customerID', axis=1)\n```\n\n### 6. 数据类型：检查所有特征的数据类型并将其转换为适当的格式：\n\
  \n```python\ndata.dtypes\n```\n\n`Output:`\n```\ncustomerID          object\ngender\
  \              object\nSeniorCitizen      int64\nPartner             object\nDependents\
