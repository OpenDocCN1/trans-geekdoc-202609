- raw: 'Technological dependence has become an increasingly prevalent phenomenon in
    modern society, marked by constant use of devices and digital systems. While technology
    offers countless benefits, it also poses significant challenges to mental health,
    cognitive abilities, and interpersonal relationships. This section examines how
    this dependence affects psychological well-being and what strategies can be implemented
    to mitigate its negative effects.


    3.3.1​Nature of Technological Dependence


    Technological dependence manifests in behaviors such as the constant need to check
    notifications, an inability to disconnect from devices, and distress when access
    to technology is lost. According to a Pew Research Center report (2021), over
    40% of adults feel they cannot go a day without their mobile phone, reflecting
    the pervasiveness of this dependence in daily life.


    This phenomenon shares characteristics with behavioral addictions, such as impulsivity
    and the pursuit of instant gratification. Studies like Griffiths (1996) suggest
    that excessive technology use activates the brain''s reward circuits, creating
    a reinforcement cycle that can lead to compulsive use.


    3.3.2​Impact on Mental Health


    Excessive use of technology is linked to a range of mental health issues, including
    anxiety, depression, and stress. Social media platforms, in particular, have been
    identified as a risk factor for negative social comparison, where users tend to
    compare themselves to idealized images of others'' lives. This can generate feelings
    of inadequacy and affect self-esteem (Twenge et al., 2017).


    Additionally, technological dependence can contribute to social isolation. While
    digital platforms facilitate communication, they can also replace face-to-face
    interactions, reducing relationship quality and increasing perceived loneliness.
    The lack of clear boundaries between personal and professional time due to remote
    work has also exacerbated these issues.


    3.3.3​Cognitive Consequences


    Overexposure to technology affects cognitive functions in several ways. Digital
    multitasking, for example, decreases cognitive efficiency, as the human brain
    is not designed to process multiple complex tasks simultaneously. Ophir et al.
    (2009) found that frequent multitaskers have a reduced ability to filter distractions
    and focus on relevant tasks.


    Another consequence is reliance on external memory. By depending on devices to
    remember dates, passwords, and important information, users may experience a decline
    in their ability to consolidate long-term memories (Henkel, 2014). This phenomenon,
    known as "memory externalization," highlights how technology can alter fundamental
    cognitive dynamics.


    3.3.4​Strategies to Mitigate Technological Dependence


    Overcoming technological dependence requires a multifaceted approach that combines
    individual behavioral changes with interventions in technology design. Effective
    strategies include:


    *   Establishing clear boundaries: Scheduling device-free moments, especially
    during meals and before bedtime.


    *   Developing digital awareness: Using time-monitoring apps to identify excessive
    usage patterns and adjust habits.


    *   Promoting offline activities: Prioritizing hobbies and social activities that
    do not involve technology.4


    Technology designers also play a crucial role in creating tools that encourage
