  trans: '


    # 未来掌握在我们手中


    本书的目的是为如何应对这种微妙的平衡提供指南。通过探索神经心理学、人工智能与健康福祉之间的交叉领域，我们旨在为读者提供理解和使用科技的工具。现在，当我们合上这些书页时，问题依然存在：我们每个人在塑造这一进程中将扮演怎样的角色？


    ## 读者的邀请：成为迈向以人为本的未来转变的一部分


    改变并非发生在抽象之中。我们作为用户、开发者、教育工作者或仅仅作为公民所做出的每一个决定，都会影响技术的演进。因此，我们邀请你成为这一转变的积极参与者，承担起以优先包容、公平和福祉的方式来影响发展的责任。


    成为改变的一部分也意味着质疑我们与技术互动的方式。我们是在利用数字工具增强自己的能力并加强人与人之间的联系吗？还是已经陷入了削弱我们专注力、创造力和共情能力的依赖模式？反思这些问题不仅有助于我们成为更好的用户，还能激发新技术设计和实施方面的变革。


    ## 迈向跨学科协作


    书中一个反复出现的主题是跨学科方法的必要性。心理学家、工程师、设计师、神经科学家、教育工作者和政策制定者必须合作，以确保技术创新与人类的福祉保持一致。每个学科都带来了独特的视角，丰富了我们对技术如何最好服务服务的理解。


    这种协作的一个例子是包性系统的设计。这些系统不仅考虑了用户的认知和情感局限性，还考虑了无障碍性和文化多样性等因素。为所有人设计并非易事，但它对于确保技术缩小而非扩大社会差距至关重要。


    ## 结论


    归根结底，人工智能的未来及其我们生活的影响将取决于我们的选择。我们可以选择一条以人性为代价优先考虑效率的道路，也可以选择一种兼顾这两个方面的方法，创造出既强大又充满人性的技术。


    这篇结语并非结束，而是一次邀请。邀请你继续探索、学习，并积极参与创造一个技术与人类和谐共处的世界。作为读者、创造者和个体，我们拥有塑造未来的力量。让我们带着意图、责任以及对在数字时代繁荣发展的共同愿景去这样做吧。


    '
