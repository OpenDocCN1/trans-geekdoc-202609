- raw: 'In conclusion, neuropsychological foundations are essential for understanding
    and improving human-AI interaction. By applying this knowledge to the design of
    technologies, we can create systems that are not only functional but also aligned
    with users'' cognitive and emotional well-being.


    2.2​Cognitive and Emotional Processes in Interaction with Technological Systems


    Human-AI interaction is rooted in cognitive and emotional processes that determine
    how we perceive, understand, and respond to technological systems. These dynamics
    significantly impact our daily experiences, from using mobile devices to interacting
    with complex algorithms on social media platforms and virtual assistants. To analyze
    this relationship, it is essential to understand the underlying mechanisms that
    connect our minds to technological tools.


    2.2.1​Cognition and Perception in Technology


    Cognitive processing begins with perception, the entry point for the information
    we receive from the technological environment. The colors, sounds, and visual
    structures of digital interfaces are designed to capture our attention, a limited
    resource that systems aim to maximize. According to Treisman (1964), the attentional
    filter model suggests that the most salient stimuli compete for access to our
    cognitive resources, a principle exploited by technology designers to keep us
    engaged with platforms.


    Once attention is captured, technology influences how we interpret and store information.
    Intuitive interfaces and personalization algorithms facilitate navigation but
    can also foster confirmation bias, where users tend to seek and process information
    that reinforces their preexisting beliefs (Nickerson, 1998). This phenomenon has
    profound implications for opinion formation and social polarization.


    2.2.2​Emotional Impact of Technological Systems


    Interaction with technological systems is not solely cognitive; it also evokes
    emotional responses that range from frustration to satisfaction. Virtual assistants,
    for instance, are designed to respond with simulated empathy to voice commands,
    generating a sense of emotional connection. Nass and Brave (2005) demonstrated
    that users tend to treat machines as if they were social entities, a behavior
    leveraged by developers to enhance user experience.


    However, not all interactions are positive. Algorithms that generate content based
    on our preferences can lead to a negative feedback loop, where constant exposure
    to certain types of information amplifies emotions such as fear or anxiety. This
    is particularly evident in news consumption, where algorithms prioritize alarming
    stories to maximize engagement, exacerbating psychological stress (Bessi & Ferrara,
    2016).


    2.3​Cognitive and Emotional Adaptation to the Digital Environment


    The human brain exhibits a remarkable capacity to adapt to changes in the environment,
    including the incorporation of advanced technologies into daily life. Neuroplasticity,
    the mechanism by which the brain forms and reorganizes synaptic connections in
    response to experiences, plays a crucial role in our relationship with technological
    systems. Recent studies (Small et al., 2009) have shown that regular internet
    use can increase brain activity in regions associated with decision-making and
    problem-solving.


    However, this adaptation is not always beneficial. Prolonged exposure to digital
    stimuli can lead to technological dependency, where individuals feel incapable
    of performing simple tasks without the aid of devices. This phenomenon particularly
    affects younger generations, who have grown up in an omnipresent digital environment.


    2.3.1​Towards a Balance Between Cognition, Emotion, and Technology


    To optimize human-AI interaction, it is essential to design technologies that
    consider both cognitive processes and emotional responses. This includes developing
    interfaces that minimize cognitive overload, algorithms that promote informational
    diversity, and systems that foster emotional well-being. An interdisciplinary
    approach combining neuropsychology, interaction design, and technological ethics
    is fundamental to achieving this balance.


    2.3.2​Adaptation of the Human Brain to the Digital Environment


    The human brain has demonstrated an exceptional capacity to adapt to environmental
    changes, and the digital era is no exception. The integration of advanced technologies
    into daily life has transformed not only our routines but also neuropsychological
    functioning, altering processes such as attention, memory, and decision-making.
    This section explores how the brain responds to the digital environment, both
    in terms of benefits and risks, and examines the implications for designing technological
    systems that respect and promote cognitive well-being.


    2.3.3​Neuroplasticity and Brain Changes in the Digital Age


    Neuroplasticity, defined as the brain''s ability to reorganize itself by forming
    new neural connections, is the foundation of our adaptation to digital technologies.
    Studies such as Small et al. (2009) have shown that regular internet use can increase
    activity in brain regions associated with decision-making and problem-solving.
    This phenomenon underscores how digital interactions can enrich certain cognitive
    abilities.


    On the other hand, prolonged exposure to digital stimuli can also have adverse
    effects. Digital multitasking, common in the use of mobile devices and computers,
    has been linked to a decrease in sustained attention capacity. Ophir et al. (2009)
    found that individuals who engage in extensive digital multitasking tend to show
    greater difficulty filtering out irrelevant distractions, negatively impacting
    their cognitive efficiency.


    2.3.4​Transformations in Memory and Cognition


    The digital environment has redefined how we store and retrieve information. While
    technological tools act as extensions of our memory, freeing cognitive resources
    for other tasks, they can also diminish our ability to remember information independently.
    Henkel (2014) argues that relying on devices to store data reduces long-term memory
    consolidation, a phenomenon known as "memory externalization."


    Furthermore, the overload of digital information can saturate our cognitive resources.
    According to Sweller (1988), cognitive load theory suggests that an excess of
    simultaneous stimuli can hinder effective information processing. This has implications
    for both learning and productivity in digital settings.


    2.3.5​Emotional Impact of Digital Interaction


    Beyond cognitive aspects, interaction with digital technologies also influences
    our emotions. Dependence on constant notifications and updates can create anxiety
    and a state of hyper-alertness. For example, Alkozei et al. (2017) found that
    excessive use of electronic devices before sleep is associated with reduced sleep
    quality, negatively impacting mood and emotional health.


    On the other hand, well-designed technologies can promote emotional well-being.
    Mindfulness applications and educational platforms have proven effective in reducing
    stress and fostering positive emotions, especially when integrated with strategies
    based on neuropsychological evidence.


    2.3.6​Designing a Digital Environment That Respects the Human Brain


    To maximize the benefits and minimize the risks associated with technology use,
    it is essential to design digital environments that respect the limitations and
    strengths of the human brain. This includes creating interfaces that reduce cognitive
    overload, implementing algorithms that promote informational diversity, and considering
    biological and emotional cycles in device design.


    Furthermore, educating users on how to interact healthily with technology is crucial.
    Programs that teach time management skills, strategies to avoid multitasking,
    and relaxation techniques can help mitigate the negative effects of digital interaction.'
