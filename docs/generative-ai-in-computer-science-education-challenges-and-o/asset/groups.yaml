    Automated feedback can be provided in several ways. For general mechanism, we
    first consider how assistance has been provided as class sizes increased, prior
    to LLMs. We then present several projects that evaluated LLMs for providing help
    to students. It is important to note that LLM technology has been improving rapidly
    – a technique evaluated just two years ago may be much more successful today.


