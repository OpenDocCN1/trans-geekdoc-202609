    # Generative AI in Computer Science Education


    # 1 Introduction


    # 1.1 The Rise of Generative AI


    Computer science education is undergoing a transformation as generative AI reshapes
    how we learn, teach, and create knowledge. Generative AI quickly advanced from
    niche to commodity in November 2022 with the launch of ChatGPT by OpenAI (Thorbeck
    2023). At the one-year anniversary of the launch, news outlets categorized ChatGPT
    as “Changing the Tech World” (Edwards 2023b) and starting an “AI Revolution” (Thorbeck
    2023). In that first year, competitors also released AI chatbots, including Google’s
    Bard and Amazon’s Q DeVon (2023). OpenAI also released DALL-E, software that produces
    art work based on user-provided text prompts, in October 2023. More recently,
    the availability of multimodal models, which produce and integrate multiple types
    of input such as text, images, and audio, has expanded rapidly, with closed models
    (developed and maintained by private organizations and accessible only through
    web requests) and open models (freely accessible for and running on local hardware)
    contributing to the fast growing landscape of generative AI tools. The wide availability
    of such a range of generative AI models offers enormous potential for innovation,
    especially within education, but it also raises a number of pressing ethical questions.


    One major concern is the use of copyrighted work to train models. Authors and
    artists have seen their creative works used to train models that then produce
    similar outputs without compensation or credit (Edwards 2023a; Katersky 2023).
    Ethical concerns about generative AI have resulted in the United States’ National
    Science Foundation issuing two major guidelines involving proposal and review
    (Notice to research community: Use of generative artificial intelligence technology
    in the NSF merit review process 2023). First, proponents are now “encouraged to
    disclose the extent to which they used generative AI to develop their proposal.
    Second, reviewers are prohibited from using any content from proposals because
    of concerns that models may use as training text. This could result in the model
    returning that same text to other users as responses to related prompts, breaching
    the confidentiality of the proposals and potentially leading to unintentional
    plagiarism.


    Another major concern is how the use of generative AI may impact professionals,
    particularly regarding authorship and credit in academic and creative fields.
    For instance, the Writers Guild of America had a 148-day strike over disagreements
    related to credit and income due to the increasing use of generative AI in scriptwriting
    (Coyle 2023). In addition, some companies have replaced customer service representatives
    with ChatGPT because it responded'
  - '[PAGE 7]


    # Generative AI in Education


    to customers as well as better than any customer service agents (Verma 2023).
    In the academic sphere, policies are evolving to address these concerns; for example,
    the Association of Computing Machinery (ACM) stipulates that while generative
    tools like ChatGPT can be used to create content, their use must be fully disclosed
    in an acknowledgments section, and they cannot be listed as authors of a published
    work.


    Finally, there are examples from several fields of authors using ChatGPT and passing
    off its output as their own writing, then subsequently discovered due to inaccuracies
    in the information that ChatGPT returns. For example, lawyers and their firm were
    faced for submitting formal court documents generated by ChatGPT that contained
    fictitious research (Neumer 2023). Vanderbilt University faced backlash after
    it sent an email to students reflecting on a tragic shooting at Michigan State
    University, which was later revealed to have been drafted using ChatGPT – a decision
    widely criticized for the perceived lack of genuine human empathy (Powers 2023).
    Similarly, recent controversies have arisen with the use of generative AI tools
    in creative and modern contexts, such as advertisements for Google Gemini (that
    suggested it to draft letters) and for Toys ‘R’ Us (using OpenAI’s Sora model
    to generate a full-length video), both of which sparked debates about the erosion
    of human creativity and authenticity. A judge in Colombia asked ChatGPT for help
    with case law, “Is an autistic minor from paying fees for their therapies?” to
    ChatGPT responded, “Yes, this is correct. According to the regulations in Colombia,
    minors diagnosed with autism are exempt from paying fees for their therapies”
    (Stanly 2023). Although this response agreed the judge’s decision, the use of
    ChatGPT for guiding legal decisions generated criticism at the time.


    # 1.2 Challenges and Opportunities in Education


    In the field of education in general, there are major concerns about students
    using ChatGPT to cheat. A BestCollegeSurveyof10000 current undergraduate and graduate
    students found that 51 percent of college students believe that using such tools
    for assignments and exams is cheating, compared with 20 percent who disagree (Nietzel
    2023). In early 2023, coinciding with the first school term when ChatGPT was widely
    available and well known, concerns were voiced on a national scale. Many instructors
    at Harvard prohibited students from using ChatGPT, considering it a form of academic
    dishonesty (Duffy and Weil 2023), and articles hypothesized about using it for
    cheating (Vice 2023). There may be some data to back up this hypothesis – use
    of ChatGPT tailed off in June 2023, corresponding with summer break, then increased'
