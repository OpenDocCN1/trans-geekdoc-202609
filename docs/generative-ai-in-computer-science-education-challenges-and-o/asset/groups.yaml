    # 计算机科学教育中的生成式 AI 37


    当这一过程完成后，教师仍有工作需要完成。图像的大小可能与原始图像不同，因此教师可能需要更改默认尺寸。此外，新项目中的起始位置和精确移动可能会有所不同，因此教师可以对这些进行调整。然而，这将极大地减少教师创建此类项目所需的时间。


    ## 6.2 集成开发环境 (IDE)


    教育环境中的集成开发环境（IDE）旨在为学生提供一个支持平台，用于编码和测试他们的解决方案。研究已经探索了在 IDE 中直接集成代码生成类大语言模型（LLMs）。Kazemitabar
    等人（2023）探讨了在入门级编程背景下为初级学习者提供 OpenAI Codex 的影响。他们进行了一项受控实验，参与者年龄在 10 至 17 岁之间，且没有先前的文本编程经验。参与者被分为两组：一组可以直接访问集成到编程环境中的
    Codex，另一组则没有。所有参与者都完成了一组 Python 代码编写任务，随后是代码修改任务。


    他们发现，使用 Codex 显著提升了代码编写性能，且对手动代码修改任务没有负面影响。有趣的是，具有先前编程能力（通过脚手架过程确定）的学习者从访问 AI
    生成器中受益更多，这通过他们在留存测试中的表现衡量得出的。然而，鉴于学生在提交代码时，约一半的代码是在提交前不久生成的且未对其进行任何更改，因此人们对可能过度依赖
    AI 生成的代码表示了担忧。


    尽管将 GitHub Copilot 等工具集成到 IDE 中已显示出前景，但这些工具主要是为经验丰富的程序员设计的。它们目前的设计假设了初学者不具备的熟练水平，这可能会给初学者带来挫败感或困惑体验。因此，调整这些工具以更好地适应初学者的需求至关重要。


    Prather, Reeves 等人（2023）概述了一套全面的设计建议以解决这一担忧，并提出了几项增强方案使这些工具对初学者更友好。识别出的一个关键问题是，初学者很容易被立即生成并显示的代码建议分心或感到压力巨大，尤其是当这些建议包含多行代码时。这通常会导致认知负荷增加，因为学生在努力理解建议的同时，还要尝试学习底层的概念。为了缓解这一点，Prather
    等人认为，应该有一种机制允许学生对他们收到的建议类型以及建议呈现的时机拥有更大的控制权。例如，学生可以受益于某功能，该功能允许他们在认为需要时请求帮助，而不是被动地接收实时提供的建议。


    Prather 等人确定的其他设计建议强调了将元认知脚手架整合到工具中的重要性。这可能涉及特殊的 AI UI 元素，引导学生完成解决问题的步骤，或对替代解决方案提供更清晰的理解。此外，改进这些工具以帮助学生建立更好的心理模型是另一个重要意义。许多初学者在理解
    Copilot 等工具如何以及为何生成某些代码时遇到困难。在这些系统中引入可解释 AI (XAI) 元素，使建议背后的逻辑透明化，可以帮助学生更深地理解他们正在处理的代码的逻辑和结构。


    还有研究致力于通过 LLMs 为语法和编译错误提供纯英语解释，以增强学生的开发环境。初级程序员的一个常见诉求是，由于编程环境产生的歧义或晦涩的错误信息所带来的挫败感和困惑，例如，缺少一个括号这样的小错误也会产生长而复杂的错误信息。通过利用
    LLMs 理解和翻译计算机程序的能力，这些环境可以显著减轻学生的认知负荷，让他们更容易专注于所教授的基础概念，而不是去解读复杂的错误信息。


