    considered “good answers.”


    More recently, the use of LLMs to assist with discussion forums has been explored
    (Zhang et al. 2023). The authors used an LLM to classify questions as conceptual,
    homework, logistics, and not answerable (by the LLM). Using GPT-3, they achieved
    81% classification accuracy overall, extending to 93% accuracy for classifying
    unanswerable questions, meaning the approach can effectively ignore questions
    it cannot answer, which could reduce the occurrence of unhelpful responses or
    hallucinations.


    Liu and Hiri (2024) took this one step further by simulating LLM-powered teaching
    assistant on questions collected from the discussion board of a massive introductory
    programming course. Using LLM chains – a prompt engineering technique where several
    different prompts iteratively build toward final solution: to first classify the
    question being answered, then uses classification to inform what model/parameters/prompt
    to generate a candidate answer. Another prompt assesses the quality of the answer.
    The authors ran a series of student questions through the model and found that
    the LLM-powered virtual TA:


    - was proficient at categorizing questions as either homework questions, coding
    feedback requests, or explanation requests;

    - provided more detailed responses than those provided by the human TAs;

    - matched the accuracy of TA responses with regard to non-assignment-specific
    questions;

    - had a tendency to include an overwhelming amount of information.


    They concluded that while their findings are promising, human oversight is still
    required.


    ## Automated Test Suites and Feedback


    Another automated approach is to provide a test suite that generates feedback
    for students in the form of which tests their solution passed and failed. While
    this is useful in supporting students in some ways, creating test cases is a critical
    skill, for test-driven development and debugging. In test-driven development,
    test cases are created before the main code in order to help the programmer test
    code as it is developed. It can also be a useful metacognitive technique to help
    students form a correct model of the problem they are working on. One study found
    that students in an intervention group that created test cases prior to coding
    exhibited completion rates as the control group but significantly fewer errors
    related to incorrect mental models (Denny et al. 2019). This provides support
    for the design decision in 2005 for Web-CAT (a popular automated assessment tool)
    to support student submission of test cases in addition to their solution code
    (Allowatt and Edwards 2005).


    The advantage of automated test suites, with respect to the features of effective
    feedback, is that it is timely. The responses are often nearly instantaneous.
    Unfortunately, the form of the feedback is nonspecific and the information returned
    can vary greatly. The least information that could be provided would just a final
    numeric score, giving the student an indication of how correct their code is.
    Other instructors may provide information about every test case, highlighting
    which ones failed (e.g., the test inputs and desired outputs). While this allows
    the student to start “debug their program into existence” whereby students lose
    track of the learning goals and focus exclusively on passing the automated test-cases
    (Zamrogno, Holmes, and Baniassad 2020).


    In practice, however, students are unlikely to have automated suites that provide
    them a numerical quality score when developing code in the real world. LLMs have
    the potential to unlock an entirely new type of automated feedback that more closely
    aligns with real-world coding practices. They can provide students with suggested
    code edits/next steps, meaningful feedback on code readability, efficiency, and
    design patterns. This type of feedback, which is often overlooked in traditional
    education settings where class sizes commonly reach hundreds of students, can
    help bridge the gap between academic learning and industry practices.


    Nguyen and Allan (2024) explored the potential of generating this type of “formative”
    feedback using LLMs. The authors used GPT-4 and “few-shot learning” – providing
    the model with some examples of the expected input and output within the prompt
    – to generate individualized feedback for 113 student submissions. They prompted
    the model to generate feedback on the student’s conceptual understanding, syntax,
    and time complexity and also had the model guiding questions or suggest follow-up
    actions. The group that found the feedback provided by the LLM was generally correct.
    The model provided correct evaluations of conceptual understanding for 92% of
    the submissions, syntax for 89% of submissions, and time complexity for 90% of
    submissions. The model was also found to be useful at generating code suggestions
    and hints (92% of submissions and 95% of hints were conceptually correct). Despite
    these results, the authors also identified several issues including a significant
    difference in model performance across different programming assignments and a
    tendency for GPT''s suggestions to lead to a suboptimal solution.


    ## Code Explanations


    We previously discussed using LLMs to generate code explanations for textbooks
    (MacNeil 2023, Leinonen, Denny, 2023). One intriguing possibility is to leverage
    this functionality to generate explanations of a student''s own code in order
    to help them understand and debug code they have written.


    Balse et. (2023) used an LLM, specifically GPT-3-turbo, to generate explanations
    for logical errors in code written by students in an introductory programming
    course (CS1). The authors aimed to determine if LLM-generated explanations could
    support teaching assistants (TAs) in providing feedback to students efficiently.
    The quality of LLM-generated explanations was evaluated in two ways: the TA''s
    perception of explanation quality and a detailed manual analysis of the generated
    solutions. They found that TAs rated the quality of LLM-generated explanations
    comparably to generated explanations, although 50% of contained at least one incorrect
    statement.


    ## Synchronous Assistance


    LLMs show great promise for providing on-demand help at a large scale, especially
    if they can be designed to respond to student queries. This idea has significant
    interest in the computing education community.


    Liffiton et al. (2024) describe a novel tool CodeHelp, which incorporates “guardrails”
    to avoid directly revealing solutions. Deployed in a first-year course and data
    science course, the tool''s effectiveness, student usage patterns, and perceptions
    were analyzed over a 12-week period. Rather than replacing existing instructional
    support, the goal of the work was to complement mentor help by offloading simple
    tasks and being available at times that would be inconvenient for the teacher
    or teaching assistants.


    A follow-up study by Sheese et al. (2024), investigated students'' patterns of
    help-seeking when utilizing CodeHelp, analysing more than 2,500 student queries.
    The study involved manual categorization of the queries into the types of assistance
    sought (e.g., debugging, implementation, conceptual understanding), alongside
    analysis of query characteristics (e.g., information provided by students). The
    authors found that the majority of queries were seeking immediate help with programming
    assignments rather than focusing on in-depth conceptual understanding. In addition,
    students often provided minimal information in their queries, pointing to a need
    for further instruction on how to effectively communicate with the tool.


    Yang et al. (2024) expanded on this work by introducing correct were more relevant
    to the content covered by the specific course. The authors identified several
    broad categories of help-seeking behavior exhibited by students when interacting
    with their chatbot:


    - Code Comprehension Instances when a student asked the chatbot to explain a snippet
    of code or its expected output

    - Error Comprehension Asking for a plain English explanation of an error message,
    for example: What is a segmentation fault?

    - Hypothesis Testing When a student inquires about methods to test a hypothesis
    regarding the location or cause of a bug

    - Implementing a Solution for the proper code or syntax to fix an identified bug

    - Broad Debugging Question Providing code to the chatbot and asking it to identify
    or solve the bug


    The authors observed that student help-seeking behaviors were not novel or unique
    but corresponded with previously identified web-search debugging


    2 Test-driven development is a software development practice that focuses on creating
    unit test cases before developing the actual code. It is an iterative approach
    combining programming, unit test creation, and refactoring.

