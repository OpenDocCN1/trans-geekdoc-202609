    # 计算机科学教育中的生成式 AI


    然而，这并未回答关于教学人员回答问题花费的时间是否比没有论坛时更少，同伴是否提供了高质量的帮助的问题。


    早期的工作提出了一种自动讨论机器人，用于在讨论论坛上回答学生的问题（Feng 等人 2006）。该机器人没有使用在互联网海量数据上训练的大型语言模型，而是利用信息检索和自然语言处理技术，从一个包含
    1236 篇存档讨论和 279 份课程文档的注释语料库中生成答案。他们用 66 个问题测试了机器人，发现仅有 14 个答案完全正确，而另一半的答案被认为是“良好的答案”。


    最近，研究人员还探索了使用大语言模型（LLMs）来协助讨论论坛（Zhang 等人 2023）。作者使用 LLM 将问题分类为概念类、作业类、后勤类以及（由
    LLM）无法回答类。通过使用 GPT-3，他们的整体分类准确率达到了 81%，在分类不可回答的问题时准确率达到了 93%，这意味着该方法可以有效忽略其无法回答的问题，从而减少无用回复或幻觉的发生。


    Liu 和 Hiri (2024) 更进了一步，针对从一门大型入门编程课程讨论板收集的问题，模拟了 LLM 驱动的助教。他们使用了 LLM 链——这是一种提示工程技术，通过多个不同的提示词迭代构建出最终解决方案：首先对要回答的问题进行分类，然后利用分类结果来决定生成候选答案所需的模型/参数/提示词。另一个提示词则评估答案的质量。作者对模型运行了一系列学生问题，发现由
    LLM 驱动的虚拟助教：


    - 擅长将问题分类为作业问题、代码反馈请求或解释请求；

    - 提供的响应比人类助教提供的响应更详细；

    - 在非特定作业的问题上，其回答准确性与助教持平；

    - 倾向于包含极其海量的信息。


    他们得出结论，尽管这些发现很有前景，但仍然需要人工监督。


    ## 自动化测试套件与反馈


    另一种自动化方法是提供测试套件，以解决方案通过或失败了哪些测试的形式为学生提供反馈。虽然这在某些方面对支持学生很有帮助，但创建测试用例是测试驱动开发和调试的一关键技能。在测试驱动开发中，在主代码编写之前创建测试用例，以便程序员在开发代码的同时进行测试。这也可以是一种非常有用的元认知技术，帮助学生对他们正在的问题建立正确的模型。一项研究发现，干预组中在编码前创建测试用例的学生，其完成率与控制组相当，但与错误心理模型相关的错误显著减少（Denny
    等人 2019）。这为 2005 年 Web-CAT（一种流行的自动化评估工具）的设计决策提供了支持，允许学生在提交解决方案代码之外也提交测试用例（Allowatt
    和 Edwards 2005）。


    与有效反馈的特征相比，自动化测试套件的优势在于其及时性。响应往往是近乎瞬间。遗憾的是，反馈的形式缺乏特异性，返回的信息可能差异很大。提供的最少信息可能只是一个最终的数字分数，给学生关于其代码正确性的指示。其他老师可能会提供关于每个测试用例的信息，突出哪些用例失败了（例如测试输入和预期输出）。虽然这允许学生开始“通过调试来编写程序”，但学生可能会丢失学习目标，完全专注于通过自动化测试用例（Zamrogno,
    Holmes 和 Baniassad 2020）。


    但在实践中，学生在现实世界中开发代码时，不太可能拥有提供数字质量分的自动化套件。LLM 有潜力解锁一种完全全新的自动化反馈类型，这种类型与真实的编码实践更加紧密。它们可以为学生提供建议的代码修改/下一步，以及关于代码可读性、效率和设计模式的有意义的反馈。这种类型的反馈……

