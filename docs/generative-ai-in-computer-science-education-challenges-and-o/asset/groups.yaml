    # Generative AI in Computer Science Education


    The compiler embeds run-time error detection tools (i.e., Valgrind, Address-Sanitizer,
    and GDB) into the executables it compiles so to provide additional error explanations
    as stack printouts and has enhanced, hand-crafted explanations for a range of
    common errors. For their study the authors created the ''--help'' command which
    used gpt-3.5-turbo-0301 to ''consume source code, error messages, and locations
    to generate contextual, novice-friendly error and warning explanations designed
    to augment typical compiler output.'' The authors evaluated the LLM enhanced help
    by collecting 400 error/explanation pairs (200 compile time errors and 200 runtime
    errors) generated by students enrolled in their institution''s CS1/2 courses and
    evaluated each pair for conceptual accuracy, correctness, relevance, and completeness.
    Additionally, the authors evaluated whether the generated response''s overall
    quality would be commensurate to that of either a peer or a tutor. The study found
    that the LLM-generated explanations for compile-time errors consistently outperformed
    those for runtime errors. Specifically, compile-time explanations were considered
    conceptually accurate 90% of the time while only 75% of runtime explanations were
    conceptually accurate. With regard to correctness the authors found that 90% of
    compile-time explanations were correct versus 66% of runtime errors. The authors
    also found compile-time explanations to be more relevant (92% relevancy vs.75%)
    and complete (72% vs.39%) than runtime explanations. Similarly 72% of compile-time
    explanations were found to be of ''tutor'' quality compared to 45% of runtime
    explanations.


    # 6.3 Personalized Tutors


    In Ender''s Game, a book by Orson Scott Card, the main character, Ender, has an
    AI-powered tutor throughout his life. While computer science education is not
    training a child to save his species, the characteristics of this tutor are intriguing.
    It had full autonomy to pose problems and discussions with Ender. It is worth
    exploring what research has been done toward this end and where generative AI
    may fit in.


    However, we want to make it clear that in this discussion, we are not proposing
    that we replace teachers with a computer. We believe that teachers are incredibly
    valuable, and no computer will be able to replace many of the attributes that
    teachers have. Students on infants and toddlers have shown that babies do not
    learn as well as people in videos speaking to them compared to when their in-person
    caret speak to them, even when they use the same words and way of speaking. While
    we can talk about technical capabilities, we do not fully understand the emotional
    aspects of learning, that is just as more important than the technical aspects.'
