    Generative AI can also be used to provide help directly to learners in ways that
    enhance learning. As class sizes increase, the opportunities students have for
    synchronous help from instructional staff decrease.


    The integration of AI directly into development environments, and as digital teaching
    assistants (Hicke et al. 2023), represents a significant shift in educational
    support. Such tools can provide instant and personalized support outside the traditional
    classroom setting. Furthermore, the adaptation of curriculum and teaching methods,
    innovative textbooks like that of Porter and Zingaro (2023), teaches Python programming
    using tools like Copilot and ChatGPT, illustrates the evolving nature of educational
    delivery. The advent of generative AI in computing education represents both a
    challenge and an opportunity. Educators are tasked with integrating these technologies
    into the curriculum in a way that enhances learning while preparing students for
    a future where AI is a fundamental aspect of problem-solving.


    In this section, we explore how class instruction can be enhanced through generative
    AI techniques. We divide this discussion into two types. First, we consider ways
    a student, on their own, could use generative AI to assist in tasks they have
    traditionally completed on their own. Next, we consider instances where they would
    traditionally reach out to instructional staff (when they are stuck). We recognize
    that is not a hard and fast line; it is merely a way of organizing the many ideas
    on how to leverage generative AI technology. Finally, we explore a more transformative
    idea, in which generative AI is provided more autonomy in directing the learning
    process.


    ## 5.1 Student Resources


    ### Explaining example code


    While textbooks provide high-quality instruction, students supplement formal instruction
    with searches on the internet. The code they find online may be related to the
    topic, but it may be poorly documented, and include neither high-level explanation
    nor line-by-line comments. The same approach that was previously described to
    generate explanations for online textbooks could also be used directly by students
    to enhance the learning potential of code on the internet.


    ### Explaining Concepts


    Analogies can be a particularly effective type of explanation, as they help students
    bridge the gap between existing knowledge and unfamiliar concepts. The flexibility
    of LLMs has shown they are capable of generating cross-domain analogies which
    could be applied in a range of contexts (Ding et al. 2023). This is especially
    important in educational contexts, where creating effective analogies is difficult
    even for experienced instructors.


