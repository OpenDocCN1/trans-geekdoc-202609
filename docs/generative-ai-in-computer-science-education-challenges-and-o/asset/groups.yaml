    # Generative AI in Education


    An LLM is able to predict the most likely next word (token) to follow the sequence
    “The cat sat on the”. It does this by considering the context and calculating
    the probability distribution for all possible next words it has learned from its
    training. Based on the patterns it has learned, the model might generate a frequency
    distribution like “mat”: 60 percent, “floor”: 20 percent, “chair”: 10 percent,
    “table”: 5 percent, “roof”: 3 percent, and so on.


    In this example, the word “mat” has the highest probability (60 percent) because
    the phrase “The cat sat on the mat” is a common phrase seen many times in its
    training data. Therefore, the model is most likely to select “mat” as the next
    word. However, one parameter of an LLM is the “temperature” value, and this setting
    controls the randomness of the output. Thus, it might choose another word “floor”
    or “chair,” and would be more likely to do so with a higher “temperature” setting.
    Finally, after selecting “mat,” the LLM can repeat the process all again–generating
    a coherent sentence that aligns with the patterns it has learned from its training
    data.


    During training, an LLM analyzes large datasets comprising diverse types of text,
    such as books, articles, and web content. LLMs are trained to predict tokens based
    on their context, they can generate a wide range of text outputs, from simple
    answers to more complex tasks like writing essays, generating code, or summarizing
    long documents. However, they are not perfect; their outputs are based on probabilities
    derived from their training data, which means they can sometimes generate inaccurate
    or nonsensical responses, often referred to as “hallucinations.”


    One of the most well-known tools that uses an LLM to generate text is ChatGPT,
    developed by OpenAI. ChatGPT leverages the LLM architecture and generates human-like
    responses by predicting tokens that fit well in a conversation. To make its responses
    more useful, safe, and aligned with what a human would expect, OpenAI used a technique
    called Reinforcement Learning from Human Feedback (RLHF). In this process, human
    trainers rated the model’s responses, giving positive feedback for answers that
    align well with conversational norms and factual accuracy, and negative feedback
    for responses that were misleading or unhelpful.


    The probabilistic generation of tokens helps explain some of the strengths and
    weaknesses of ChatGPT. If there are many examples in the training set similar
    to what is being generated, the model can draw from a robust probability distribution,
    resulting in highly accurate and predictable outputs. For example, the question
    “is the world round?” will likely result in the output “Yes,” as this is a common
    question-answer pair in the training data. Similarly, asking ChatGPT to finish
