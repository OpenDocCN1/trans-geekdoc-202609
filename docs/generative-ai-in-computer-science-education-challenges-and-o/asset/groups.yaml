    # 教育领域的生成式 AI


    智能辅导系统（ITS）已经研究了数十年；然而，对其用途的讨论有时存在争议，因为 (a) 一些人将其作为教师的替代品，没有充分尊重和认可教师拥有的独特且重要的属性；(b)
    它们一直无法实现全职导师这一不切实际的目标；(c) 创建题库、相关反馈和决策机制需要大量时间——尽管决定何时以及如何增加难度是极度耗时且昂贵的。尽管尽管有这些缺点，它们仍然在自动化、个性化教育方面做出了重大贡献，因此它们必须被认为是生成式
    AI 之前的相关先驱。


    智能导师有两个不同的角色。首先，它们根据学习者在之前问题上的表现来决定其下一个要求其解决的问题。其次，它们为解决当前问题提供指导/帮助/反馈。ITS 广泛可用，并被应用于正式教育和非正式教育中，主要用于数学和语言学科。


    学校作业：可以在学习事实时将其分配为作业，例如记忆基础加、减、乘、除法因数。ITS 先对学习者进行简单问题的测验，对于他们任何错误的答案，系统会提供答案并频繁地对类似问题进行测验。最终，学习者表现出精通，ITS
    就会转向更难的问题。


    非正式数学学习：在非正式空间，有诸如 Prodigy 之类的应用程序，用户是冒险游戏中的角色，在游戏中他们探索不同的地方、执行任务并战斗怪物。战斗涉及解决数学题来增强攻击能量。与数学系统一样，当玩家出错时，系统会重复相同水平的问题，并在他们表现出精通时提高等级。然而，它内容丰富，远超事实的记忆。


    非正式语言学习：一种流行的语言学习应用是 Duolingo，它拥有数百万非正式用户。它不仅能根据用户的错误动态决定提供什么，还整合了广泛的反馈和奖励系统。如果用户在同一类型的问题出错次数足够，它会提供指导（例如展示变位规则和几个示例）。奖励系统特别广泛。有一种通过每天至少完成一节课程来维持的连续胜击”。此外，如果有人在晚上完成了课程，那么早晨完成课程就会触发
    15 分钟的双倍奖励，反之亦然。


    因此，如果有人每天早晚使用该系统 15 分钟，他们的积分就会大幅增加。积分用于在“联赛”中晋级，用户与同一联赛的陌生人竞争，力争每周获得最多积分。


    # 计算机科学教育中的生成式 AI


    ## 支持计算机科学 ITS 的开发


    已经创建了用于教学编码的 ITS，但它们的质量参不齐（Crow, Luxton-Reilly, 和 Wuenche 2018），且没有一个被广泛使用。生成式
    AI 可用于支持基于编码的 ITS 开发的许多步骤。创建一个用于计算机科学的 ITS 需要执行以下步骤：


    - ITS 问题通常足够小，可以在一分钟内回答，而计算机科学的作业和练习通常需要几分钟到几个小时。因此，第一步将是创建可以*快速解决并引导至可应用于更大问题中的学习*的问题类型。生成式
    AI 可用于合成各种类型的问题，包括帕森问题（Parsons problems）、代码追踪问题和代码解释问题，所有这些问题都可以通过快速反馈迅速解决，使它们适合集成到
    ITS 中。


    - 需要创建**大型题库**，并按难度和涵盖的概念分为等效类进行组织，且具有逐渐渐进的难度增加机制。给定一个问题，可以使用生成式 AI 创建许多不同的、等效的问题来填充此题库。


    - 需要创建**反馈和解释**并将其与一组问题绑定。关于使用生成式 AI 创建反馈和解释，已有大量研究。


    - 系统需要经过调整，以提供一条*高效、有效的学习最佳路径*。过多的相似水平的问题可能会导致学习者在系统中花费过多时间或失去动力，但进展太快会让他们感到困惑。问题需要适应学习者的**近侧发展区（ZPD）**，该区域是指学习者在指导下能够执行但尚不能独立完成的任务范围。


    # 学习者滥用生成式 AI 带来的挑战


    虽然 AI 生成器是一项新技术，但抄袭在基础科学课程中绝不是问题。在互联网出现之前，常见的作弊方法包括从另一个学生那里抄袭解决方案（无论是通过串结还是从外部获取解决方案，例如从收集往届学生作业的组织或档案——例如兄弟会和女生会维护的资料——中获取）。


    一旦互联网被广泛使用，常见编程问题的解决方案变得轻而易得。LLM 之所以能够胜任基础编程任务的原因之一，是因为互联网上存在无数的解决方案示例。旨在教授编程的网站数量以及发布常见问题解决方案的人的增加，使得寻找标准问题变得异常简单。


    最近，基础编程课程规模的扩大以及在线评分平台的可用改变了学生完成作业和评估的方式。在教学人员与学生比例很小的时代，在线系统可以提供即时反馈，支持学生。在线评估可以自动评分，减轻教学人员的负担。然而，很少大学拥有设施让整个数百人的班级在大学计算机上同时考试，因此学生可能会在不同的时间考试，这增加了学生在考试前找到考题的概率。


    正如第 2 节所述，生成式 AI 为基础编码课程产生的内容日益准确，尽管并不完美。因此，我们将讨论放在这一难度的编码问题上。


    LLM 的引入引起了高度警觉，因为它是一项新技术，将大大增加基础学生的抄袭行为，从而导致学习损失。然而，了解此类行为与以前相比增加了何种程度是有用的。总的，作弊是普遍的——65–75%
    的本科生至少承认过一次，19–20% 的人承认至少作弊过五次。研究发现，学生作弊在过去 30 年中剧增（McCabe et al. 2001）。


