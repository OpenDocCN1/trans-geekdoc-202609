    # 计算机科学教育中的生成式 AI


    他们将无法使用 ChatGPT 等工具，他们可能不太可能使用这些工具到产生对它们产生依赖的程度，即使他们认为被抓包的风险很小。这种方法早在在 1982 年就被提出用于打击抄袭（Hwang
    and Gibson 1982）。如果考试的权重增加，有两种处理方法。


    第一种是欧洲大学已经在采用的方法——学期的大部分时间都在执行旨在为学期末学生做准备的任务。遗憾的是，这种要求学生投入大量工作却获得很少回报、所有准备都是为了期末一个大奖励做准备的模式，并不符合与动机相关的行为理论。目标设定理论认为，困难、具体、内容相关且即时的目标，而非长期目标，更能激励学习者取得更大的成就（Ling
    et al. 2005）。此外，它减少了学生表现的样本量，并可能增加焦虑（Zeidler 1998）。因此，学习目标需要切分成小块，并为中间进度提供积分和勋章。此外，有效的反馈应该是及时的，等到学期末才提供实质性反馈将使学生无法进行高效调整。


    第二种模式是频繁测试；然而，这会给教学人员带来负担。除了编写额外评估题的挑战外，还存在预留测试空间安排的后勤挑战。纸笔测试是防止使用在线资源的主要机制，因为它们排除了学生作弊，但阅卷非常耗时。人们对专用计算机化测试设施的兴趣日益增加，这种设施可以克服后勤挑战（Zilles
    2023）。Emeka 等人（2024）描述了大规模进行计算机化测试的三种不同方法的比较：(1) 专用的计算机化测试中心 (CBTC)，在教室内人工监考的考试，以及
    (3) 通过 Zoom 在线监考的 BYOD（自带设备）模式考试。通过随机实验，他们发现测试模式对学生的考试表现或学习行为没有显著影响。然而，他们注意到，不同的模式提供了不同的后勤效益和潜在挑战。例如，CBTC
    提供了一个受控的环境，使测试体验标准化，而 BYOD 选项虽然更灵活，但引入了安全忧虑和作弊增加的可能。


    # 调整评估方法


    专用的计算机化测试设施依赖大型题库，每个学生都会从中抽取随机子集。使用生成式 AI（GenAI）可以高效地生成此类大型题库，它可以创建针对不同难度和主题的各种问题。在通用设计（Universal
    Design）的一个极佳示例中，一个问题可以引发许多意料之外的功能，生成个性化测试题的能力不仅能对抗考试期间的传统作弊（即学生互相偷看答案），它还能实现许多新的测试模式，这些模式已被证明能够带来积极的学生成果，例如：


    - **异步测试：** 通过让每项测试对每个学生来说都是唯一的，就不需要通过确保所有学生同一时间考试来保护测试的完整性；相反，教师可以定义一个时间窗口，学生可以在此期间自行在测试中心安排自己的考试。这种增加的灵活性使学生能够在最适合他们日程的时间参加考试。更重要的是，这意味着在进行任何测试时都不需要牺牲教学时间。


    - **多次测试尝试：** 鉴于每项测试都是唯一的，允许学生多次参加测试，每次尝试都会生成新一批问题。这允许学生从初次测试的错误中学习，并在重新尝试之前提高理解，并已被证明大大减轻了与考试相关的压力。


    - **增加测试频率：** 鉴于测试不再占用教学时间，教师可以在整个学期内安排较小的测试，而不是像传统那样只进行期中期末。通过更频繁的测试，学生对他们知道什么以及在哪些困难会有更规律的反馈，减少了他们在课程结束时出现重大知识缺口的机会。此外，较小、更频繁的测试比处理高风险评估更不容易引起焦虑。


    - **精通学习（Mastery Learning）：** 基于多次测试尝试的想法，教师可以设定一个学生通过课程所需的格分阈值，并给予学生多次机会达到这种精通水平。这种方法鼓励更深层次的理解和学习，而不是死记硬背。


    # 8 种新型和新兴教学方法


    传统的教学方法，特别是入门课程，重点在于帮助学生学习如何编写代码。这通常涉及脚手架任务，例如 Parsons 问题（Parsons problems）（Denny,
    Luxton-Reilly, and Simon 2008）、通过代码追踪进行代码阅读练习（Venables, Tan, and Lister 2009）或“用白话解释”问题（Murphy,
    McCauley, and Fitzgerald 2012），以及通过“许多小问题”频繁练习编写代码（Allen et al. 2019）。本单元之前的章节关注了在保持相同学习目标时
    GenAI 的影响。在本节中，我们考虑了随着 GenAI 的出现，学习目标或不同技能之间的优先级是否会发生变化。我们提出问题：鉴于从自然语言提示生成代码变得如此容易，这将改变我们的教学内容？


    # 8.1 变化的行业格局


    为了回答这个问题，我们首先考虑 GenAI 如何已经以及并将进一步改变软件开发人员的工作。GitHub 调查报告显示，美国 92% 的开发者正在使用 GenAI
    工具，70% 的人认为益处在于技能提升和提高提高（Shani 2023）。


    当 GenAI 助手作为 Copilot 时，编码如何发生变化？使用 Copilot 编码主要有两个阶段。首先，开发者需要制定提示词（prompt），以便
    Copilot 产生尽可能符合所需的功能。Copilot 可以创建代码草稿，尽管可能存在 Bug 或不满足预期需求。其次，一旦生成草稿，开发者的主要工作就是评估并可能修改代码。因此，代码阅读、理解和调试技能至关重要——比从空白屏幕编写代码更为重要。因此，不仅代码修改技能变得更加重要，在没有
    GenAI 助手的情况下编码的技能也变得不那么重要。


    我们探索了由这些需求驱动的两种新型教学方法。我们还强调了它们对无障碍的影响，以及大模型处理不同语言编写的提示词的能力。


    # 8.2 通过提示编写和解释代码


    我们认为，两个主要的教学变化是教授面向代码生成 GenAI 工具的提示工程，并强调阅读（理解）代码而非编写代码。


    训练学生如何为代码生成模型编写有效的提示词是一项新技能。开发这种技能的一种方法由 Denny, Leononen 等人（2024）描述，他们引入了“提示问题”（Prompt
    Problems）的概念，这是一种训练学生掌握提示创建艺术的创新练习。提示问题要求学生分析编程任务的视觉或描述性表示，制定自然语言提示词（这些提示词被 LLM
    用于生成代码），并对生成的代码进行验证。


