    - *技能发展*：学生报告说，活动增强了他们的计算思维能力，让他们接触新的编程结构，并强化了他们逻辑拆解问题的能力。许多人感谢“提示词问题”（Prompt
    Problems）帮助他们关注编程的高层逻辑，而非低层语法。

    - *学生感知*：尽管总体，一些学生表达了对过度依赖 AI 工具的担忧，并在观察到模型生成代码的强大能力后，对自己的未来感到焦虑。这一发现特别有助于强调教师需要教学生如何适应不断变化的所需技能的重要性。


    阅读和调试代码并不是新技能，但在生成式 AI 时代，它们重要性日益凸显。如前所述，编程课程中使用了四种问题类型——追踪（tracing）、用简单的英语解释（EiPE）、Parsons
    问题和编码（代码编写）。目前，追踪、EiPE 和编码题通常用于测验和考试，而 Parsons 问题和编码主要用作家庭作业练习。在每种情况下，从零开始编写代码通常是为了确保序列的最终目标。随着生成式
    AI 的出现，追踪和调试的重要性大幅增加。


    用简单的英语解释（EiPE）问题传统上用于培养代码理解能力，现在获得了新的意义。在这些任务中，学生用自然语言描述给定代码段的作用。部署 EiPE 问题最大的问题之一是需要对学生的解决方案进行评分（通常是短文本片段）。Smith
    等人（2024）提出了一个系统，将学生生成的解释作为 LLM 的提示来生成等效代码，并针对定义的测试用例进行测试。这种方法在保持透明性的同时实现了自动化评估和反馈。对近
    900 名学生对该方法进行评估的主要发现包括：


    - *增强反馈*：学生受益于查看生成的代码和测试结果，这有助于完善他们的解释。

    - *提高参与度*：学生非常看重将他们的自然语言理解与计算逻辑对齐的机会。例如，许多人注意到措辞的小幅变化会导致生成输出的显著差异，从而促进对问题陈述与代码之间关系的深层理解。

    - *教学影响*：反馈的即时性和对解决方案迭代开发的支持，支持了从评估理解到主动教学理解的转变，使得这些问题适用于形成性学习。


    这些教学方法的一个主要优势是它们能够让计算教育对非英语母语的学习者更容易触及。鉴于 LLM 的自然语言翻译能力，提示问题和 EiPE 任务都可以支持用多种语言编写的程序，允许学生用母语参与编程概念（D.
    H. Smith, Kumar, and Denny 2024）。这一特性显著降低了非英语母语者的入门门槛，为更广泛、更多元的学习者打开了计算机科学和编程的大门。


    ## 9 CS1-LLM：入门编程课程中集成 LLM 的案例研究


    我们现在介绍由 Vadaparty 等人（2024）描述的全新设计的入门编程课程案例研究。这门课程重新想象了在拥抱 GitHub Copilot 等生成式
    AI 工具时，计算机科学教育可能面貌，并刻意与输出结果进行区分。作者通过强调围绕 LLM 重新设计入门编程课程的两个关键原因，描述了这种新方法的原理。首先，随着
    LLM 生成代码的能力不断增强，从零开始编写代码等传统技能可能不再具有同等优先级。GitHub Copilot 等工具现在工业界被广泛采用，显式地使用此类工具将更好地为学生做好职场准备。其次，集成
    LLM 让学生能够更快地参与与个人相关的较大的、开放式项目，从而提高参与度。这与更传统的 CS1 方法形成对比，后者在早期大量关注语法和低级细节，这限制了学生只能处理较少反映真实软件开发的小型问题。


    > 5 https://github.blog/news-insights/research/survey-reveals-ais-impact-on-the-developer-experience/


    CS1-LLM 方法让学生能够更多地关注核心计算思维技能，如分解、代码分析和调试，同时学习如何与 LLM 交互——这种技能在现代软件开发中正变得至关重要。


    ## 设计原则


    Vadaparty 等人（2024）描述了支持 CS1-LLM 方法的几个设计原则。这些包括在整个课程工作中引入 LLM，包括某些期末评估。请注意，社区对于在有
    LLM 和没有 LLM 的情况下应该学习哪些基本技能尚未达成共识，因此课程的某些方面仍要求学生在没有 LLM 支持的情况下编写代码。然而，鉴于阅读和修改代码是工业界的一项基本技能，大多数评估允许学生从使用
    GitHub Copilot 生成代码开始。该课程还通过计算教育文献中的最佳实践来支持多样化的学习者，例如使用同伴教学（Peer Instruction）、媒体计算和结对编程，这些方法众之能增强参与度和留存率。另一个核心原则是通过提供学生参与个人相关的开放式项目的机会来培养创造力。最后，这门课程的设计旨在服务于将继续学习计算机科学的学生以及那些可能……


    ## 工具支持


    GitHub Copilot 的一个有趣方面（与第一个设计原则一致）是从从开始就引入了 Copilot。学生在课程的第一周就学习了如何在 VS Code IDE
    中安装和使用 Copilot。他们通过输入英文注释让 Copilot 生成相应的代码。这种方法本质上与 Alves 和 Cipriano（2023）提出的人机协作“草图模型”相同，即程序员提供大纲，而
    AI 填补空白。


    ## 学习目标与资源


    课程的学习目标设计旨在反映 LLM 的集成。修订后的目标重点关注提示工程、代码分析、测试、调试和问题分解等技能。传统的从零编写代码的目标被弱化，而引入了如应用提示工程来影响
    AI 生成代码的新目标（Denny, Kumar, and Giacaman 2023）。课程的一个新颖组件是了“函数设计循环”，它概述了学生编写提示词、使用
    Copilot 生成代码以及评估和调试代码的过程。该课程还利用了 Porter 和 Zingaro（2023）编写的教材，名为《使用 GitHub Copilot
    和 ChatGPT 辅助 Python 编程》，该书是配合课程编写的。


    Vadaparty 等人（2024）展示了对 500 多名学生进行的该方法的评估。该评估涉及对学生对新课程结构的感知调查。尽管大多数学生给出了积极反馈并赞赏项目的创意规模，但也提到了一些挑战。这些包括对过度依赖
    Copilot 的担忧，以及学生对于在没有 LLM 支持的情况下应该做什么感到有些困惑。


    ## 开放式项目


    Copilot 的使得学生能够完成比他们通常在入门编程课程中完成的更有雄心、有趣的项目。学生参与了跨越不同领域的开放式项目：


    - *数据科学*学生的任务是在 Kaggle 上找到一个数据集，确定一个可以用该数据回答的问题，并编写代码探索答案。


    > 6 www.kaggle.com/


