    LLM 在 K–12 计算机科学（CS）教育中的这一新颖应用提供了宝贵的见解。


    ## 4.5 评估问题


    创建等效问题不仅对于文化能力有用，还能随着大学班级规模的扩大，为大规模运行测试设施提供解决方案。


    人们希望在考试期间进行实时编码练习。允许学生使用自己的设备可能具有挑战性，因为可能无法监控他们使用互联网查阅参考文献甚至是考试题的答案。另一方面，建立足够大的测试设施费用可能极其昂贵。Fowler
    等人（2024）研究了动态创建等效编码问题，以便一个计算机实验室就可以供一个班级的学生使用，每位学生都为自己的考试进行预约。由于问题是动态生成的（带有约束条件），向他人报告确切的问题不太可能给他们带来显著优势。在这项工作中，作者选择了非常具体的的问题（例如，在数组中寻找最大值），并确定了哪些其他密切相关但并不完全相同的问题（例如，在数组中寻找最小值）具有等效难度。一旦一个问题有了足够的变体，它就可以被存入题库，并在考试时刻选择其中一个变体。


    创建和验证具有细微差异的相同问题的过程非常耗时，且前项研究的作者并未利用生成式 AI。相反，他们分析了常见的问题类型，并手动编写了转换过程，从一个初始问题生成不同版本的问题。


    ## 教育中的生成式 AI


    因此，一种潜在的方法是利用将编程练习量化个人兴趣的工作（Del Carpio Gutierrez et al. 2024; Leonen et al. 2021），应用于评估问题，以掩盖问题在技术上完全相同的事实。这种方法一旦在子集上通过验证，就可以导致更多潜在的等效问题。手动编写每种可能性是不可行的，但使用生成式
    AI 可以非常快速地提供丰富的创意、有趣的问题，即使是按需提供。


    ## 5 课堂教学


    生成式 AI 还可以直接向学习者提供帮助，以增强学习。随着班级规模的扩大，学生获得教学人员同步帮助的机会在减少。


    将 AI 直接集成到开发环境中并作为数字助教（Hicke et al. 2023），代表了教育支持的重大转变。这些工具可以在传统教室环境之外提供即时且个性化的支持。此外，课程和教学方法的调整，例如
    Porter 和 Zingaro（2023）的创新性教材——使用 Copilot 和 ChatGPT 等工具教授 Python 编程，说明了教育交付的演变本质。计算教育中生成式
    AI 的出现既是挑战也是机会。教育工作者的任务是将这些技术整合到课程中，既要增强学习，又要为学生做好准备，使 AI 成为解决问题的基本方面。


    在本节中，我们将探索如何通过生成式 AI 技术增强课堂教学。我们将此讨论分为两类。首先，我们考虑学生如何独立使用生成式 AI 来协助完成他们通常独立完成的任务。其次，我们考虑了他们通常会寻求教学人员帮助的情况（当他们遇到困难时）。最后，我们探讨了生成式
    AI 如何以更具自主性的方式辅助学习。


    ## 5.1 学生资源


    ### 解释代码


    虽然教科书可以提供指导，但学生通过互联网搜索来补充正式教学。他们在网上找到的代码可能与主题相关，但缺乏详细的行间注释。在这种情况下，生成式 AI 的方法可以被学生直接使用以增强学习潜力。


    ### 解释概念


    类比是一种特别有效的解释类型，因为它们帮助学生弥合现有知识与陌生概念之间的鸿沟。LLM 的灵活性表明它们能够生成跨领域的类比（Ding et al. 2023）。Bernstein
    等人（2024）在计算机科学入门背景下探索了这一想法，让学生使用 ChatGPT 生成类比。他们的研究涉及 385 名一年级学生，他们被提供了一个代码片段并被要求创建类比，并在提示词中加入了加入了个人相关的话题。


    ## 5.2 作业协助


    在作业协助方面，我们考虑两个方面：反馈如何提供以及要求是什么。提供反馈对学生的学习至关重要。研究表明，最有效的反馈是具体的（Hattie and Timperley
    2007）、及时的（Opitz, Ferdinand and Mecklinger 2011）并且与目标一致的。有些学生只需要确认他们的方向是否正确。有些学生只需要关键词或概念的提醒。有些学生可能需要重学整个集合。


    自动反馈可以通过多种方式提供。对于通用机制，我们首先考虑在班级规模扩大之前是如何提供帮助的。然后，我们展示了几项评估 LLM 为学生提供帮助的项目。注意的是，LLM
    技术一直在飞速进步——两年前评估的技术现在可能有效得多。


    讨论板块


    讨论板块是一个在线论坛，学生可以在那里向全班提问，也可以向教学人员提问。虽然它既不是同步的也不是交互性的，但讨论板块有两个益处。首先，同伴可以回答其他人的问题，减轻教学人员的负担并提供更快的响应。其次，学生可以查看之前的帖子并找到答案，而无需提问。


    之前对讨论板块使用情况的研究分析了两个课程中395 名学生的帖子，揭示了三个主要结果（Vellukanel et al. 2017）。首先，许多帖子与后勤或较浅的问题有关。这是积极的，因为讨论减轻了教学人员回答简单问题的负担，使面对面时间能够关注更深入的问题。其次，大部分问题反映了某种程度的建设性解决问题活动，表明学生获得了实质性的帮助。最后，在论坛上提问与课程成绩呈正相关。

