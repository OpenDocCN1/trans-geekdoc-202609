    (2024). The motivation for this work stems from the challenge that beginner-level
    programming problems in competitive contexts often become trivial when participants
    use tools like GitHub Copilot or ChatGPT. The basic idea behind probable problems
    is that certain details are deliberately omitted from the problem statement, making
    it difficult for an LLM to solve the task simply by analyzing the provided prompt.
    Instead, a mechanism that allows students to probe or query the problem to uncover
    additional information about the desired behavior, what the authors call “clarifying
    questions.” This approach not only hinders the straightforward use of AI tools
    but also encourages students to engage more deeply with the problem, much like
    a developer would need to elicit specific requirements from a client in real-world
    scenarios. A trivial example might be to ask students to write a function (that
    takes an a and b list of integers as input, as well as two inputs, a and b) “Counts
    how many values are between ‘a’ and ‘b’ in the array”. In this case, the problem
    does not specify whether to count a value must be strictly greater than a and
    strictly less than b (or strictly greater than b and strictly less than a), or
    whether they can be equal to these boundary values. The student can find to answer
    these questions by submitting clarifying questions in the way of test cases that
    are given to an oracle (a model solution to the problem) and for which the output
    can be observed.


    In their paper, Pawagi and Kumar (2024) evaluated this approach by conducting
    a programming contest with undergraduate students. They found that popular AI
    tools were unable to generate correct solutions for the probable problems due
