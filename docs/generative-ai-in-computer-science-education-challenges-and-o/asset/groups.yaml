    that just happen to be in the pictures. For example, if someone trained the animal
    classifier on snakes that all live in the desert and squirrels that all live in
    the forest, then a picture of a snake in a forest might be identified as a squirrel,
    and a picture of a squirrel in a desert might be identified as a snake.


    Some databases may contain pictures that have been labeled unknowingly. For example,
    to automatically tag a particular friend when a picture is uploaded to Facebook®,
    Facebook needs an image classifier. Its training data on a specific friend would
    consist of all the pictures of that friend that have been labeled by users. Additionally,
    completing puzzles by Captcha, as clicking on all the boxes in a picture that
    contains traffic lights, motorcycles, or trucks, contributes labeled images to
    improve an image classifier.


    There are many ethical concerns with image recognition being used for facial recognition
    of humans because of the interaction between people of color, the inaccuracy of
    models on those people, and historical injustices. Clearview AI has gone a step
    further than Facebook, using social media to create an extensive database of images
    and names, leading to a fine by the Netherlands (Corder 2024). The database is
    marketed to law enforcement to identify suspects, which raises ethical questions,
    since the data is not verified to be correct, and arrests of innocent civilians
    have occurred because of misidentification in such systems (Johnson 2023). Facial
    recognition has been shown to be especially poor on individuals with darker skin
    (Sanford 2024); this could be because of either poor training sets or the challenge
    of distinguishing features in poor lighting. Therefore, one must consider not
    only the technological perspective of AI, but also its impact on different populations.


    ## 2.2 Large Language Models


    Large language models are a type of artificial intelligence model designed to
    generate text by predicting the next word, or “token,” in a sequence. Unlike image
    classifiers, which rely on labeled datasets to learn, LLMs use a method called
    self-supervised learning. In self-supervised learning, the model learns from vast
    amounts of data without needing explicit labels. Instead, the model uses parts
    of the text to predict other parts (enabling it to verify these predictions automatically),
    making the process of data preparation more scalable and efficient.


    So, in essence, LLM simply predicts tokens (or words). Consider a very basic sentence
    (which we can think of as a “prompt”), which is incomplete:

