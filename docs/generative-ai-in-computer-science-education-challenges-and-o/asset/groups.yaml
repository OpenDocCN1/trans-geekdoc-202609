    # Generative AI in Computer Science Education


    high-level explanation nor line-by-line comments. The same approach that was previously
    described to generate explanations for online textbooks could also be used directly
    by students to enhance the learning potential of code on the internet.


    # Explaining Concepts


    Analogies can be a particularly effective type of explanation, as they help students
    bridge the gap between existing knowledge and unfamiliar concepts. The flexibility
    of LLMs has shown they are capable of generating cross-domain analogies which
    could be applied in a range of contexts (Ding et al. 2023). This is especially
    important in educational contexts, where creating effective analogies is difficult
    even for experienced instructors.


    Bernstein et al. (2024) explored this idea in an introductory programming context
    by having challenging threshold concept in computer science (Sanders and McCarthy
    2016). Their study involved 385 first-year students who were asked to generate
    their own analogies using ChatGPT. The students were provided a code snippet and
    were tasked with creating recursion-based analogies, optionally including personally
    relevant topics in their prompts. A wide range of topics were specified by students,
    including common topics such as cooking, books, and sports, which also appeared
    in ChatGPT-generated analogies where a topic was not specified. Other topics specified
    by students, such as video games and board games, were not present in the themes
    that were generated by ChatGPT. This suggests that while LLMs can generate bespoke
    analogies on-demand, the inclusion of "in-the-loop", of their personal interests
    and experiences can lead to more diverse and engaging analogies. Students reported
    enjoying the activity and indicated that the generated analogies improved their
    understanding and retention of recursion. This approach underscores how generative
    AI can be leveraged in computing education: not just as a tool for generating
    explanations, but as a means of empowering students to create their own, tailored
    learning resources.


    # 5.2 Assignment Assistance


