    ## 7.2 滥用对学习的影响


    滥用生成式 AI 工具对学习的潜在影响不容低估。与任何领域一样，课程通过精心设计的任务序列来逐步建立知识和技能。学生通过任何一种在没有获得相关知识和技能的情况下完成任务的方法，都会导致他们在未来的课程中处于劣势，使他们更依赖于抄袭来获得成功。这种恶性循环一旦陷入其中时间越长，就越难以打破，他们的技能与预期技能水平之间的差距也会随之扩大。


    我们可以想象一种学生的积极学习路径：当任务被提出时，他们无法准确地生成代码。他们可以生成代码并对其索引以理解它，识别出哪些是他们无法生成的。如果仅看到代码是不够的，他们可以让生成式
    AI 提供代码解释，也许这就能提供他们所需的额外信息。这是一种可能的情况吗？


    我们首先来看 GenAI 出现之前抄袭与学习损失之间的关系。在计算机科学课程中，由于抄袭导致的检测学习损失很小，但在统计学上具有显著性。Pierce 和 Ziel
    (2017) 发现学习损失非常有限，尽管在统计学上是显著的（在 0–12 分的分制中为 0.89 分）。然而，当根据学生抄袭作业的数量对结果进行分类时，他们发现抄袭至少四次作业的学生受影响更大。同样，在对学生作业的大规模数据分析中，在
    GenAI 出现之前，所有作业在期末考试中的表现预计会低 40 分，在此之后则低 36 分（47 分与 36 分 之间的差异在统计学上并不显著）。Kazamitabaar
    等人 (2023) 的研究也显示出一个明显的趋势：学生使用 Codex（集成在 IDE 中）提交 AI 生成代码时，有一半的时间没有对其进行任何修改。如果一个学生仅仅生成代码并在不检查的情况下提交（例如，通过一个提供评分的自动化测试系统），他们可能从这次练习中什么也学不到。


    然而，近期研究的证据表明现实可能更加复杂。Prather 等人 (2024) 观察到，虽然有些学生利用 GitHub Copilot 和 ChatGPT 等生成式
    AI 工具来加速学习和解决问题的过程，但另一些人则非常挣扎，往往导致“能力错觉”。依赖 AI 输出的学生可能会加剧现有的元认知困难，甚至引入新的困难。因此，生成式
    AI 并没有促进学习，反而可能无意中扩大了表现优异和表现差的学生之间的差距。


    计算机科学教育中的生成式 AI 47


    因此，尽管关于基于 GenAI 的抄袭对学习的确切影响还没有定论，但基于学生行为（不修改收到的内容）、学生注意力结果（能力错觉）以及大规模数据分析（考试表现）的证据表明，当学生不恰当使用
    GenAI 时，会导致大量的学习损失。


    ## 7.3 设计课程以避免滥用


    课程设计涉及许多元素——作业、评估和整体课程政策。在本节中，我们考虑了研究人员提出的鼓励生产性使用 GenAI 的方法。


