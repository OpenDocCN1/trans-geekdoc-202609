    # 计算机科学教育中的生成式 AI 43


    0–12 分制的评分。研究发现这些差异在统计学上是显著的（p = 0.00019）。


    一项较新的研究试图量化生成式 AI（GenAI）出现导致的作弊增加以及对学习的影响（B. Chen 等，2024）。他们利用多种信息来源得出结论：作弊数量已经增加。首先，无监控测验与监考考试之间的分差增加了具有统计学意义的幅度（p
    < 0.001）。其次，更大比例的学生在编程作业中存在抄袭指标。他们计算了抄袭率来捕获每个学生抄袭的作业百分比，并得出由于抄袭导致的学习损失增加的结论。


    在本节中，我们考虑了滥用的三个独立方面：检测、对学习的影响以及作业设计。对于每个元素，我们首先介绍了广泛开发的用于解决未经授权使用他人解决方案（无论是来自互联网还是同学）的技术。然后，我们考虑了大语言模型（LLMs）可能带来的任何额外挑战。


    ## 7.1 检测未经授权的使用


    在计算机教育中，最常用的检测抄袭的工具可能是 MOSS（软件相似性测量）。MOSS 由 Alex Aiken（n.d.）于1994年开发，是一种通过比较多个提交版本来识别程序对之间相似性的工具。与文本比较不同，MOSS
    使用了一种技术，通过分析重叠的文本块（称为 kgrams）并选择关键特征进行比较来生成代码的指纹。这种方法使得 MOSS 即使在变量和函数名已更改或注释已被重写的情况下也能检测相似性，而这些都是学生用来掩盖抄袭的常用技术。通过关注代码的结构和逻辑，MOSS
    提供了一种识别未经授权复用的稳健方法。


    一种较新的检测器 JPl 是为了检测作弊而创建的（Pierce and Zilles 2017）。它有几个不同的检测器，分别检测常见的模式。每个检测器通过转换每个文件生成单个数字。任何两个具有相同数字的文件都被视为相同。


    - 几乎相同（懒惰型）：执行比 MOSS 更简单的方法。它将所有内容转换为大写并移除所有注释、空白和一些多余的标点符号。

    - 相同流（令牌型）：执行额外的转换，以忽略唯一名称（如变量名）。

    - 修改编辑距离（MTED）：执行转换，然后根据令牌数量对函数重新排序，并仅分析函数内部的代码。

    - 反转令牌（IT）：执行转换，但它寻找的是匹配的子字符串而不是相同的令牌流。它对相同的子字符串进行加权。

    - 反转索引（IDT）：搜索相似的变量和函数名。所有名称都转换为小写，删除下划线并进行重写。它寻找最相似的文件。

    - 统计不相似（混淆型）：寻找软件混淆的指标。它收集诸如最长行长度、平均标识符和其他指标。对于每个统计量，都会计算平均值和标准差，如果一个提交的 z 分数绝对值之和超过特定阈值，则该提交将被标记。


    Pierce 和 Zilles 发现，IT 发现的抄袭实例最多为 73%，紧随其后的是 IDT 的 67%，重叠仅为 50%，这意味着所有实例都被这些工具中的一种检测到。这使得这些工具的结合在检测抄袭方面非常有效。


    类似 MOSS 工具最大的限制性因素是，它们仅将提交内容与讲师提供的数据库内容进行比较（通常由当前学生的作业以及往年的历史提交组成）。这忽略了两个重要的抄袭来源。首先，学生仍然可以雇佣其他学生（本地或互联网上）来完成他们的工作。其次，他们可以从未包含在数据库中的源获取代码。重要的是（如
    MOSS 网站所述）“Moss 不是一个完全检测抄袭的系统。抄袭是指有人在没有注明来源的情况下复制了代码；虽然 MOSS 会自动检测程序的相似性，但它无法知道代码为何相似”（Alex
    Aiken）。JPl 具有相同的局限性——它们都是对提交之间进行比较。


    尽管有此局限性，检测器在检测可能的抄袭实例方面是有效的。例如，Chen 等（2024）发现，在生成式 AI 出现之前，约 20% 的学生作业中存在抄袭指标，而在生成式
    AI 出现后，这一比例上升到了 35%。


    # 计算机教育中的生成式 AI


    考虑到 MOSS 类工具的行为（特别是检查代码相似性），作业必须具有足够的复杂度，以预计解决方案会有广泛的变化。对于非常简单的编程练习，许多学生可能会独立地生成相同的解决方案，特别是与课堂教学内容一致的内容。


    然而，生成式 AI 有一个特征可能使 MOSS 类工具检测面临挑战——结果的差异。之前的工作发现，MOSS 在检测早期作业中使用未经授权的 AI 并不有效（Biderman
    and Raff 2022）。这与通过不同技术检测更多抄袭形成对比。学生经常采用 MOSS 可以检测的混淆技术（移动代码和更改名称），但 AI 生成代码的真实差异使得这变得困难。为了理解为什么，我们必须记住
    LLM 本质上是非确定性的（即使温度设置为零），而且模型对提示的差异极其敏感。需要进一步的研究来发现 AI 编程结果与学生解决方案自然变化之间的本质。


    抄袭检测领域一种很有前景的替代方法（更有效地检测未经授权的 AI 代码）是将注意力从提交的最终成品转移到生成解决方案的代码开发过程。特别是当学生使用抄袭代码（无论是来自
    AI 还是传统来源）时，他们倾向于一次性复制大段完成的代码，而不是逐步构建解决方案。通过分析学生得出最终实现之前的中间步骤，无论是以代码提交的形式（Reid
    and Wilson 2005）还是击键数据的形式（Hart, Mano, and Edwards 2023），都可以发现大段精炼代码出现并进行深层审查。然而，这种类型的监控引发了隐私担忧，并已被证明会增加学生的压力（Hart
    等，2023）。


    专门为识别大模型生成的解决方案而设计的深度学习方法也显示了前景。Ho 等（2024）探索了深度学习模型检测 CS1 作业中 ChatGPT 生成代码的效性，并发现这些模型是有效的，准确率在
    90% 以上。然而，作者指出，模型倾向于关注超出新手程序员可能掌握的编程模式，并质疑该方法在更高级的课程中是否有效。


