    # 词汇


    **图像分类器 (Image Classifier):** 一种机器学习模型，旨在通过分析视觉特征（如长颈鹿、巴士或人脸）来分类或识别图像中的物体、动物或其他实体。


    **生成式 AI (Generative AI):** 一种根据从大型数据中学到的模式生成新内容（如文本、图像、音频或视频）的人工智能模型。


    **大语言模型 (LLMs):** 一种生成式 AI 模型，在大型数据集上进行训练，通过生成“标记”（token，即单词或短语）序列来产生连贯且符合上下文的文本输出。


    **ChatGPT:** 由 OpenAI 开发的对话式语言模型，旨在以对话格式生成类人类的回答。


    **幻觉 (Hallucination):** 指大语言模型生成错误或无意义回答的现象，这些回答看起来合理，但并非以其训练数据或事实性信息为依据。


    ## 2.1 图像分类器


    图像分类器是一种可以识别图像的程序，例如长颈鹿、巴士或人脸。创建图像分类器包括两个阶段：训练和使用。


    训练阶段是分类器学习如何将图像属性与结果相关起来。为了训练分类器，需要一个已经过“标记”（标记了图片内容）的图片数据库。例如，如果想要识别“动物”，则需要一个包含不同类型动物图片的数据库，每张图片都标记了图中动物的类型。对于车辆分类器，则需要一个包含不同类型车辆图片的数据库，每张图片都标记了车辆的类型。程序分析图片数据库，确定区分（例如）摩托车照片与卡车照片的特征。


    训练训练集的属性是决定训练后模型准确性的关键因素。一个“良好”的训练集应该包含每种类型对象的各种实例——包括不同的颜色、摄像角度和其他特征。不意外，图像分类器拥有的标记图像越多，其分类就越准确。此外，如果没有额外的额外计算，图像分类器无法将某物放入其未曾训练过的类别中。如果训练集太小，分类器可能会基于“红�鱼”进行训练——即恰好出现在图片中的属性。例如，如果有人用生活在沙漠的蛇和生活在森林的松鼠来训练动物分类器，那么森林中的蛇照片可能被识别为松鼠，而沙漠中的松鼠可能被识别为蛇。


    某些数据库可能包含无意中被标记的图片。例如，在向 Facebook 上传照片时自动标记某个特定朋友，Facebook 需要一个图像分类器。它对特定朋友的训练数据将包含由用户标记过的该朋友的所有照片。此外，通过验证码完成谜题（例如点击包含交通灯、摩托车或卡车的图片中的所有方格）为改进图像分类器贡献了标记图像。


    图像识别用于人类人脸识别存在许多伦理考量，因为这涉及到有色人种之间的互动、模型对这些人群的识别准确性以及历史性的不公。Clearview AI 比 Facebook
    更进了一，利用社交媒体创建了一个庞大的图像和姓名数据库，导致被荷兰罚款（Corder 2024）。该数据库向执法部门推销以识别嫌疑人，这引发了伦理问题，因为数据并未经过正确验证，且已经发生了由于此类系统的识别错误导致无辜平民被捕的情况（Johnson
    2023）。事实识别在肤色深的人身上表现特别差（Sanford 2024）；这可能是因为训练集较差，或者是因为在光线不足的情况下区分特征存在挑战。因此，人们不仅必须考虑
    AI 的技术角度，还必须考虑它对不同人群的影响。


    ## 2.2 大语言模型


    语言模型是一种人工智能模型，旨在通过预测序列中的下一个单词或“标记”（token）来生成文本。与依赖标记数据集学习的图像分类器不同，LLM 使用了一种名为“自监督学习”的方法。在自监督学习中，模型从海量数据中学习，而不需要式标记。相反，模型使用文本的一部分来预测其他部分（使其能够自动验证这些预测），使得数据准备过程更具可扩展性和效率。


    因此，本质上，LLM 仅仅是预测标记（或单词）。考虑一个非常基础句子（我们可以将其视为一个“提示词”，prompt），它是不完整的：

    Prompt: “The cat sat on”


