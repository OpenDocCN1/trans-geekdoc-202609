    # 教育中的生成式 AI


    - 图像处理：学生通过处理图像创建了一幅拼贴画，展示了他们对 Python 图像处理能力的理解。

    - 游戏设计：学生设计并实现了一个基于文本的游戏或游戏模拟，展示了他们的创造力和编程技能。


    这些项目与文化相关教学法相契合，允许学生选择对个人有意义的主题。学生通常报告说，这些项目对他们的学习很有帮助，学生的反馈表明，尽管项目有时具有挑战性，但它们让他们*记忆深刻*。


    # 评估方法论


    在 CS1-LLM 中，测验主要排除了 Copilot，侧重于代码追踪、解释和小型编码任务等基础技能。期末考试中，第三部分集成了 Copilot 用于解决一个大型的开放式问题，而第二部分则要求学生在没有
    Copilot 的情况下完成四个难度递增的代码编写任务，这强调了传统编码技能与有效使用 AI 工具之间的平衡。


    在 CS1-LLM 课程引入的最重大变化之一是编程项目评估方法的变动。传统上，入门编程课程中的编程作业使用自动化测试用例进行评分。在这种传统方法中，教学人员投入时间设置这些测试用例，但实际评分过程在很大程度上是自动化的，并关注学生代码在预定义一组条件下是否产生正确输出。


    然而，随着 GitHub Copilot 等工具的集成（它们可以为 CS1 级别的项目生成代码），这种传统的评分方法变得不再那么有效。学生正在使用 Copilot
    生成代码，仅通过自动化测试检查输出的正确性已无法评估学生的理解能力和技能。意识到这一点，评估方法被重新设计，更加侧重于学生解释和论证其工作的能力，而不仅仅是他们的产物。


    在新的评估框架中，学生不仅需要提交代码，还需要提交一份说明其程序分解的详细图表。该图表作为他们解决问题过程的可视化表示，展示了他们如何将问题分解为易管理的函数，以及这些函数如何与程序的整体结构相互作用。


    # 计算机科学教育中的生成式 AI


    除了图表，学生还被要求对他们的项目制作一段一分钟的视频演示。这段视频必须包含至少三分钟的内容，用于解释代码中一个特定函数的细节。评估的这一部分至关重要，因为它允许学生展示他们对代码底层逻辑和功能的理解，而不是仅仅依赖代码的输出。


    因此，每个项目的评分是一个更全面的过程，不仅考虑了代码的正确性，还考虑了学生有效交流其思维过程和解决方案结构的能力。每个项目的评分大约需要 10-15 分钟，在此期间教师会仔细审查代码，评估分解图，并评估学生在视频中解释的清晰度和深度。这种方法在技术熟练之外，还强调了批判性思维和解决问题能力的发展。


    展望未来，作者建议在 CS1-LLM 课程未来的迭代中改进几个领域。这包括对学生何时以及如何使用 Copilot 提供更的说明，完善 AI 辅助与独立编码任务之间的平衡，并继续探索更好地支持多样化学习者的方法。


    # 与先前研究的对齐


    生成式 AI 在 CS1-LLM 课程评估和教学中的整合，与本单元（Element）中全文概述的原则和挑战密切契合。首先，项目的开放性与第 7.3 节讨论的指导意见一致，特别是考虑到
    LLM 在处理未详细说明的问题方面存在局限性。评估方法包括学生为他们独特的项目准备视频演示，强调了沟通和解决问题等关键技能，而不仅仅是产生满足预定义要求的代码。


    CS1-LLM 中的生成式 AI 设计反映了促进传统编程技能与策略性使用 Copilot 之间的平衡。测验排除了 Copilot，侧重于代码追踪、解释、Parsons
    问题（排序问题）和小型编码任务等基础技能。期末考试包含了四个在没有 Copilot 的情况下完成的代码编写任务，以及可以使用 Copilot 完成的大型问题。这种频繁的短测验和结构化的受控考试解决了第
    3 节讨论的关于过度依赖 AI 的担忧。


    最后，对提示词工程（prompt engineering）和调试教学强调直接应对了第 8 节中确定的演进技能集。通过意识到在生成式 AI 存在的情况下这些技能日益增长的重要性，CS1-LLM
    证明了课程设计的一种前瞻性方法，为学生应对当前行业需求和未来发展做准备。


    # 10 结论


    在本单元中，我们探索了大语言模型已经并将继续影响计算机科学教育的许多方式之一。我们看到 LLM（以及一组新兴的 LLM 驱动工具）能够生成高质量的教学材料，并为学生提供全天候的支持。然而，它们也引发了重大关注，包括潜在的误用，如过度依赖和抄袭。


    大语言模型在变革教育者准备和交付课程的方式方面具有巨大前景。例如，LLM 可以动态创建与文化相关的作业，高效地修改问题以实现重复利用，并提供符合不同学生需求和兴趣的个性化学习资源。这些能力预示着未来教育材料可以具有高度的自适应性、相关性和吸引力，同时缩短教育者的准备时间。


    然而，我们还讨论了许多需要深思熟虑的挑战。学术诚信处于首位，因为 LLM 让学生更有意地或由于元认知能力较差而绕过学习过程。对于正式课程或自学，像 ChatGPT
    这样的聊天型代理在解释不同复杂程度的概念、帮助学生识别和诊断工作中的错误以及将内容进行情境化以适应个人兴趣方面具有广阔前景。CS1-LLM 的案例表明，在入门编程环境中以学习者欢迎的方式接受
    LLM 是可行的。


    大语言模型显然是一项变革性技术，但它们也影响计算机科学教育的一系列技术创新中的一步——个人电脑、互联网、大规模自动化以及现在的 LLM。每项技术都通过使信息和教学材料更易获取和更易创建提供了益处，同时也为学术不端提供了新途径。LLM
    最终能够自主引导学生完成复杂的编码任务，对学习进展提供详细且个性化的反馈，甚至以高准确率检测抄袭吗？LLM 从根本上重塑学习环境的潜力是巨大的，但这需要共同努力来探索和建立最佳实践。


    正如 CS1-LLM 案例研究所示，充分拥抱 LLM 会导致课程发生各种变化，特别是从学生的角度来看。然而，CS1-LLM 作品的创建者指出，这些变化并没有他们最初预想的那么广泛（Vadaparty
    et al. 2024）。在正确的技术帮助下，大学和教师是否会投入时间和资金来重新构想计算机科学教学，从学习目标到作业再到评估技术？只有时间能给出答案。


