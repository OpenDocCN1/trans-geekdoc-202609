    # 计算机科学教育中的生成式 AI


    ## 1 引言


    ### 1.1 生成式 AI 的兴起


    计算机科学教育正经历着变革，生成式 AI 正在重塑我们的学习、教学和创作方式。生成式 AI 的普及带来了巨大的潜力，但也带来了严峻的挑战。一个主要的担忧是学术环境在使用生成式
    AI，这可能导致无意的抄袭。另一个主要的担忧是创意领域在使用生成式 AI，例如，一些公司用 ChatGPT 替代了客服代表。


    生成式 AI 的使用还导致了关于版权的问题。例如，艺术家发现他们的创作作品被用于训练模型而没有获得补偿。同样，生成式 AI 在广告背景下的使用也引发了争议，例如
    Google Gemini 的广告（它建议用它撰写信函）以及 Toys ‘R’ Us 的广告（使用 OpenAI 的 Sora 模型生成了长视频），这些都引发了关于人类创造力和真实性的讨论。


    另一个主要的担忧是法律背景下使用生成式 AI。例如，哥伦比亚的一位法官向 ChatGPT 协助法律案件：“患有自闭症的儿童需要支付治疗费用吗？” ChatGPT
    回答道：“是的，正确的。根据哥伦比亚的规定，诊断为自闭症的未成年人免治疗费。”尽管这一回答支持了法官的决定，但使用 ChatGPT 进行指导引发了批评。


    生成式 AI 的使用还导致了职业违规行为。例如，律师及其律所在提交包含虚假研究的法庭文件而面临指控。范德堡大学在发送一封关于密歇根州立大学枪击事件的学生邮件后遭到了反对，随后被证实该邮件是用
    ChatGPT 起草的——这一决定被广泛批评缺乏同理心。


    在学术界，政策正在演变以应对这些问题。例如，计算机协会（ACM）规定，虽然可以使用 ChatGPT 等生成式工具创建内容，但必须完全披露，且不能将其列为作者。


    ### 1.2 教育中的挑战与机遇


    在整个教育领域，人们对学生使用 ChatGPT 作弊存在极大忧虑。一项针对 10,000 名在读本科和研究生的调查显示，51% 的大学生认为将此类工具用于作业和考试属于作弊，而有
    20% 的人认为不属于。在 2023 年初，即 ChatGPT 普及并广为人知的第一个学期，全国范围内表达了这些担忧。

