    # 计算机科学教育中的生成式 AI 13


    采取措施，包括更加强调考试分数、禁止 AI 工具，并让学生接触这些工具的能力和局限性。长远来看，讲师们分为两个主要阵营：一类抵制 AI 使用，专注于教授编程基础；另一类拥抱
    AI 工具，将其视为为未来工作环境做准备。这种分歧凸显了当前计算教育中 AI 应用方法缺乏共识，且具有探索性质。


    抵制 AI 工具使用的策略包括设计“防 AI”作业、恢复到纸质考试，以及在编程任务中对代码审查进行批判性对待。而更开放于整合 AI 工具的讲师，则利用这些技术提供个性化的学习体验、协助任务，并重新定义课程，更加强调软件设计、与
    AI 协作以及创造性项目工作。总的来说，研究结果表明，需要适应性的教学策略，要么将 AI 作为学习和发展的工具，要么以新颖的方式强化传统的编码技能，以抵御肤浅的
    LLM 生成的解决方案。Lau 和 Guo 还提出了一系列丰富的开放开放问题，有助于社区内对相关课程进行持续调查。


    在较最近的工作中，Sheard 等人（2024）对来自澳大利亚、芬兰和新西兰的 12 名讲师进行了采访。这些采访旨在捕捉对计算教育中使用 AI 工具的多样化观点，包括当前的实践以及响应
    AI 工具的可能调整。总的来说，讲师承认 AI 工具通过生成代码示例和提供个性化反馈来支持和增强学习的潜力。然而，人们也担心学生可能会跳过关键的学习过程并过度依赖这些工具，这可能导致对编程概念的理解浅薄。参与者还注意到传统评估方法面临着巨大挑战，并对学术诚信和潜在的作弊表示担忧。这些担忧在研究中一位参与者的引言中得到了证证：“我们显然生活在一个必须重新思考计算教育、特别是计算教育评估的时代，因为我们无法再以以前所尝试的任何方式来评估学生了。”
    这项采访研究的参与者达成了共识，即 AI 工具的整合应该放在课程中学生已经掌握基础编程技能的阶段。请注意，这种观点在社区内并非通用，一些研究人员建议采用“提示优先”的方法，即学生从学习如何提示
    AI 模型开始，而这正是所需的（Reeves 等人 2024）。


    # 教育中的生成式 AI


    ## 3.2 学生感知


    学生的观点似乎与教育者有些相似之处。Prather、Reeves 等人（2023）对初级程序员与 GitHub Copilot 的交互进行了深入的探索。学生报告了敬畏与不安交织的复杂情感，发现该工具的预测性既有帮助又令人不安。后者的情绪引发了论文的标题，并在一位学生的评论中得到了典型体现：“我觉得它知道我想什么，这感觉很奇怪。”
    虽然 Copilot 在简化编码任务方面的能力受到了赞誉，但人们对过度依赖该工具以及学习基础问题解决能力方面的潜在障碍表示担忧。一位参与者担心，随着他们对工具依赖程度的增加，这将使他们成为“更糟糕的问题解决者”。此外，该研究揭示了学生面临的认知和元认知挑战，引发了对教育工具需要更好地支持学习过程的讨论。


    一份 ITICSE 工作组于 2023 年 7 月召开的综合报告，结合了来自 17 个国家的教育工作者和学生的广泛调查见解（Prather, Denny 等人
    2023）。针对学生和讲师分别开发了两个独立的调查，涵盖了从生成式 AI 使用和伦理考量到对教育和未来就业感知影响等主题。两组在利用生成式 AI 编写代码和执行文本任务方面报告了相似的模式，表明对这些技术的熟悉程度日益增加。尽管承认生成式
    AI 工具在计算教育和未来职业中的相关性日益增强，但对于人类讲师不可替代的作用，他们也达成了强有共识。特别是高年级学生，生成式 AI 工具似乎是学生辅助的重要资源，表明了求助偏好的转变。正如报告作者所指，这项工作的意义之一是，教育者应该关注技术进步，以便他们将生成式
    AI 工具有效地整合到他们的教学实践中。


    # 4 课程准备


    计算教育者可以明确利用生成式 AI 的一种方法是创建高质量的学习资源。此类资源可以是静态的（即批量生成并通过适当平台发布），也可以是动态的（即学生按需生成）。在生成式
    AI 工具可以产生的许多资源中，代码解释、编程练习和工作示例最近被提出并研究。在本节中，我们介绍了传统的教学技术，随后介绍了 LLM 可以提供帮助的方式。


    # 计算机科学教育中的生成式 AI


    ## 4.1 代码解释示例


    我们首先考虑教科书示例。MacNeil 等人（2023）将 LLM 生成的代码解释集成到一本 Web 软件开发的交互式电子书中。针对代码片段，生成了三种类型的解释：逐行解释、重要概念列表和高层总结。表
    1 显示了 GPT-3 为一个用于计算 POST 请求数量的简单服务器代码片段生成的解释示例。逐行解释 (a) 突出了代码中每一行的语法和术语，列出的重要列表
    (b) 是对代码中使用的重要概念的解释，而总结 (c) 则提供了代码目的的高层解释。


    他们发现，学生的参与度根据代码的复杂度、类型和长度而异，但大多数学生都认为代码解释很有帮助。类似地，Leinonen、Denny 等人（2023）在 CS1
    课程背景下比较了学生和 LLM 生成的代码解释质量，发现学生认为 LLM 创建的解释比学生创建的更易理解，且对代码的总结更准确。这两项研究都强调了 LLM
    作为计算课程生成教学内容工具的潜力。然而，对于 LLM 生成的代码解释的准确性和完整性仍然存在一些担忧，表明在将这些解释呈现学习者之前，需要进行监督或额外的处理。


    ## 4.2 工作示例


    工作示例在入门编程课程中已得到研究（Muldner, Jennings 和 Chiararelli (2022)）。工作示例包含一个问题陈述和一个带有逐步注释的解决方案，说明了解决问题的过程（见表
    2）。工作示例可以采取多种形式。


    建模示例发生在讲座期间。讲师编写代码，边写边叙述他们的思维过程。他们可能会犯错，因此需要实时进行修改。另一种方法是一次性提供静态代码，在显示后解释其工作原理。这种建模的有效性尚不清楚。在一项研究中，建模示例导致小组在考试、作业和课程总分上没有差异；仅在期末课程项目中观察到了益处（Rubin
    2013）。在另一项研究中，没有显著差异（Raj 等人 2020）。鉴于 LLM 生成的是，它们可能并不适用于这种建模。


