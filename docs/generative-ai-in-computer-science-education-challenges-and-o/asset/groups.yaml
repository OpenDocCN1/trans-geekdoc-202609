    # 计算机科学教育中的生成式 AI


    诸如使用 Stack Overflow 测试假设等行为。至关重要的是，作者指出，虽然学生认为聊天机器人是领域知识和经验知识的有用来源，但他们并未将其视为学习调试策略的主要来源，而是选择依赖于人类导师（助教、讲师、同伴等）来获取策略性和程序性知识。


    近期，对编程课程中 AI 助教理想特征的关注，强调了支持有意义的学习体验的重要性，而非仅仅提供直接答案（Denny, MacNeil et al., 2024）。作者发现，学生更倾向于在评估截止日期前等高峰时期提供重要且具有参与感的支持的数字助教。学生识别出的关键特征包括
    AI 通过引导他们解决问题的步骤并提供解释而非直接解决方案来为学习提供脚手架的能力。此外，学生强调了在学习过程中保持自主性的重要性，倾向于使用鼓励他们开发自己解决方案的工具，而不是过度依赖助教。


    ## 5.2.1 评估学生学习


    大语言模型可能会使评分不再那么耗时，从而允许使用某些在大班教学中因评分困难而未被充分利用的题型。尽管“用英语解释”（Explain in Plain English,
    EPE）课程在培养代码理解方面的价值被广泛认可，但评分学生主观回答的困难使其在大规模教学中不可行。一个典型的 EPE 题目向学生展示一小段代码，学生的任务是用抽象术语解释该代码片段的作用。


    Smith 等人（2023）描述了一种使用大语言模型评判 EPE 题目的创新方法，学生阅读并尝试理解显示的代码片段，然后用自然语言编写一个解释。然后将该解释作为输入提示（prompt）提供给代码生成型
    LLM，生成的代码将使用测试套件自动与原始代码进行等效测试。Denny 等人对此进行了评估，如图 9 所示，在一个拥有约 900 名学生的入门编程课程中进行了测试（Denny,
    Smith et al. 2024; D. H. Smith, Denny, and Foweler 2024）。他们分析了成功率和提示长度，并根据观察学习结果结构（SOLO）分类法（Lister
    et al. 2006）对提示进行了分类。还通过问调查和主题分析收集了学生对这些任务的感知，以了解他们对使用 LLM 评估代码理解教育用途的观点。


    # 教育中的生成式 AI


    ![](img/b3c4128584a21a9796cd13e052035ee1_39_0.png)


    **图 9** 使用 LLM 为纯英语任务提供自动反馈，正如 Denny, Smith 等人（2024）所描述。


    学生在编写提示方面取得了很大成功，这些提示生成的代码在功能上与其被要求解释的代码等效。关系型回答（Relational responses）展示了对代码片段用途的高级理解最最生成正确的代码。研究指出，学生提示的成功与他们在
    SOLO 分类法中较高类别的分类之间存在正相关。


    学生反馈显示，他们发现这项活动很有趣，并认为它增强了他们的代码理解能力。然而，一些人对这种教学方法在处理更复杂的编码任务时的有效性以及其与传统编码实践的比较表示担忧。作者建议教育者将提示编写练习与更多传统的编码练习相结合，以涵盖更广泛的学习目标，包括为更复杂的任务开发编程技能。然而，这项研究展示了
    LLM 作为教学和评估编程技能工具的潜力。


    ## 6 面向用户的设计


    我们回顾了许多独立、单独的方法，通过这些方法可以使用 LLM 为各种准备和教学任务提供支持。这些方法倾向于技术视角——换句话说，就是 LLM 能够做什么。然而，我们回顾的每篇研究论文都花费了数小时进行提示工程（prompt
    engineering），以确定如何创建一个提供最佳可能结果的一致提示。有些任务需要花费大量时间来生成准确且完整的信息响应，而某些任务可能不需要大量的工程。


    本节讨论了如何将 LLM 驱动的工具呈现给用户。我们展示了三个示例：一个是现有的，两个是未来工作的重点。


    ## 6.1 准备材料


    在第 4 节中，我们描述了 LLM 如何帮助教师创建课堂材料。从教育者的角度来看，这个过程会是怎样的？让我们考虑创建作业。在自定义 Scratch 项目的过程中，我们假设教育者是从课程开始的。给定一个作业，可能他们想要一个特定的主题。提示是作业和原始项目的结合。


    人们对如何设计用户界面日益感兴趣。最近，Pozniakov 等人（2024）提出了一个 AI 集成工作流框架。问题在于给予多少自主权。我们可以将提示暴露给他们以便直接编辑，或者我们可以提供一个询问他们想要的属性的用户界面。该图描绘了不同的步骤。我们首先协助教师关于课程中发生的情况提供一些建议。


    ![](img/b3c4128584a21a9796cd13e052035ee1_40_0.png)


    **图 10** 生成式 AI 辅助创建项目的工作流


    ### 头脑项目创意


    具体的想法是原始项目属性的结合。教师可能会看到 10-15 个想法并从中选择。然后教师可以选择其中一个建议的主题，或者输入他们自己的。


    ### 生成精灵和背景图片


    下一步是为教师创建图片。获取图像有三种可能的机制。首先，我们可以利用 Scratch 库，该库对所有 Scratch 项目都是免费提供的。其次，我们可以从生成式
    AI 生成器（如 DALL-E）生成一些建议。最后，我们可以赋予教师更多自主权，让他们输入更具体的图片属性。首次尝试将是默认结合 Scratch 图像和来自我们提示的图像。


    ### 生成项目材料


    最后一步将精灵整合到项目和面向学生的材料中，可以通过代码实现，尽管不是生成式 AI。我们有起始文档，新图像可以替换旧图像，为教师提供最终材料的草稿。生成项目是简单的，只需替换文件中的图像。创建项目材料则困难得多，因为有许多可能的格式（Google
    Forms、Google Docs、PDF），而且这些格式都没有存储在易于自动操作的公开格式中。


    '
