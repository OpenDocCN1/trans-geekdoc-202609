    # 7.2 Learning Impacts from Misuse


    The potential learning impacts from misuse of Gen AI tools cannot be under-estimated.
    As with any field, courses build up knowledge and skills gradually through a carefully
    designed sequence of tasks. Any method by which a student completes tasks without
    gaining the associated knowledge and skills place them at a disadvantage in future
    courses, making them more reliant on plagiarism to succeed. This vicious cycle
    becomes more difficult to break the longer they stay in it, the gap between their
    skills and the expected set of skills grows.


    One could imagine a positive learning path for a student who, when the task was
    posed, was unable to generate the code accurately. They could generate the code
    and index it to understand it, identifying what they were unable to generate.
    If seeing the code was not sufficient, they could then ask GenAI for a code explanation,
    and perhaps that would provide the extra information they needed. Is this a likely
    scenario?


    We first look at the relationship between plagiarism and learning loss prior to
    GenAI. Detected learning loss due to plagiarism within computer science courses
    was small but statistically significant. Pierce and Ziel (2017) found only marginal,
    though statistically significant, learning loss (0.89 points on a 0–12 point scale).
    However, when breaking down the results by the number of assignments students
    plagiarized, they found a greater impact for students who plagiarized at least
    four assignments. Similarly, in a large-scale data analysis of student work, all
    assignments would be expected to perform 40 points lower on the final exam prior
    to GenAI and 36 points lower afterwards (the difference between the 47 and 36
    points was not statistically significant). Kazamitabaar et al.’s study (2023)
    also shows a clear trend that students use of Codex (integrated within an IDE)
    submitted AI-generated code half of the time without making any changes to it.
    It is likely that a student who merely generated the code and submitted without
    inspecting it (say, by an automated testing system that provided a score) would
    learn nothing from the exercise.


    However, evidence from recent studies suggests that the reality might be more
    complex. Prather et al. (2024) observed that while some students leverage GenAI
    tools like GitHub Copilot and ChatGPT to accelerate their learning and problem-solving
    processes, others struggle significantly, often leading to an “illusion of competence.”
    Students reliant on the AI’s output, potentially compounding existing metacognitive
    difficulties and even introducing new ones. As a result, rather than facilitating
    learning, GenAI could inadvertently widen the gap between well-performing and
    poorly performing students.'
