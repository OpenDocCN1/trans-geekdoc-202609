    such as high-level programming languages and block-based programming languages,
    generative AI lowers the technical expertise necessary to create working programs,
    bringing the power of computation to more people. The programming process is already
    changing as a result of its presence, even for experts programmers. It also poses
    significant challenges to educators around rethinking assessment as well-established
    approaches no longer be viable. Many traditional programming assignments can be
