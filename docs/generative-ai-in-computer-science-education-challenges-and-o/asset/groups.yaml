    # Generative AI in Computer Science Education 47


    Therefore, while there is no definitive answer on the exact effect of GenAI-based
    plagiarism on learning, there is evidence based on student behavior (not modifying
    what they receive), student attentional outcomes (illusion of competence), and
    large-scale data analyses (exam performance) that indicates substantial learning
    loss when students utilize GenAI inappropriately.


    # 7.3 Designing Courses to Avoid Misuse


    Course design involves a plethora of elements – assignments, assessments, and
    overall course policies. In this subsection, we consider what researchers have
    proposed to encourage productive use of GenAI.


    # ChatGPT-Proofing Assignments


    A common reaction to the challenges posed by unauthorized use of GenAI is the
    idea of “ChatGPT-Proofing” assignments: by identifying tasks at LLMs have been
    observed to perform poorly and incorporating these into assignments, educators
    hope to discourage unauthorized use of GenAI or at the very least ensure that
    students are able to earn full credit solely by relying on code generated through
    GenAI. Unfortunately, the rapid improvement of them in recent years, coupled with
    the diverse range of problems they can solve, makes it difficult to devise challenges
    that are consistently beyond the capabilities of these methods.


    Using CS-1 tasks as an example: Savelka, Agarwal, An et al. (2023) analyzed the
    performance of GPT-3, GPT-3.5, and GPT-4 using actual CS-1 material and while
    prior generations of GPT were unable to earn passing grades, GPT-4 was able consistently
    earn scores on assignments to extent students who relied exclusively on GenAI
    for their solutions would have been able to score a passing grade. Therefore,
    while it might be possible to redesign elements of a course to be “ChatGPT-proof,”
    having to redesign a course every time there is an improvement in GenAI technology
    is not sustainable.


    Alternative approaches recognize the futility of trying to “outsmart” GenAI systems.
    Instead, propose changing the nature of the assignments themselves to create tasks
    where the use of GenAI would not be advantageous, or even possible. These changes
    could include emphasizing outcomes that can’t be achieved by copying code. This
    could include focusing on outcomes such as understanding software development
    processes, conceptual knowledge, problem-solving skills, and other areas that
    require active student engagement.'
