    # Generative AI in Education


    about drug information; ChatGPT''s answers to nearly three-quarters of drug-related
    questions reviewed by pharmacists were incomplete or wrong. In one case, researchers
    asked ChatGPT whether a drug interaction exists between the COVID-19 antiviral
    Paxlovid and the blood-pressure-lowering medication verapamil, and ChatGPT indicated
    no interactions had been reported for this combination of drugs (ASHP 2023).


    While LLMs like ChatGPT are updated periodically, they do not continuously scrape
    the internet for new information. Instead, they are retrained on new datasets
    at regular intervals, incorporating updated knowledge and fine-tuning through
    user interactions and feedback. However, promising techniques are emerging for
    improving the accuracy of LLM-generated responses in specific contexts. One effective
    approach is Retrieval-Augmented Generation (RAG), which combines the power of
    LLMs with external databases. Unlike traditional LLMs, which rely solely on their
    training data, RAG allows the model to retrieve relevant information from an external
    database before generating a response. This means that instead of guessing based
    on patterns it has seen during training, the model can refer to up-to-date or
    domain-specific information to provide more accurate and contextually relevant
    answers. For example, a model enhanced with RAG could retrieve the latest medical
    guidelines to answer a question about drug interactions reliably. Another advancement
    in LLM technology is the use of chain-of-thought prompting, a method inspired
    by how humans approach complex problems. Instead of generating a simple, immediate
    answer, the model explicitly articulates its reasoning process by step before
    arriving at its final output. Such an approach can improve the ability of the
    model for tackling difficult or multistep problems, and by showing these steps
    it makes its reasoning more apparent to users.


    # 2.3 LLMs for Coding


    What about generating source code for a program? Large language models have been
    trained on enormous quantities of publicly accessible code from GitHub repositories
    and programming tutorials on the web (M. Chen et al. 2021). Given that programming
    languages have a much smaller set of grammatical rules than say, natural languages,
    LLMs are especially good at producing code that is syntactically correct. In addition,
    their ability to make predictions based on context (such as detailed problem specifications)
    means they are often highly capable of producing correct solutions to programming
    problems.


    A focus of much of the early work within the computing community involved exploring
    the breadth of problems to which generative AI'
