    # 剑桥元素


    # 教育中的生成式 AI


    Mark Warschauer


    加州大学欧尔湾分校


    Mark Warschauer 是加州大学欧尔湾分校的教育特级教授，并在信息学、语言科学系和心理科学系兼任教职。他是美国教育科学院的成员，UCI 数字实验室的主任。Warschauer
    教授是全球数字学习和数字素养领域影响力最大的学者之一。他已就这些主题出版了 12 本书籍（包括 MIT 出版社、剑桥大学出版社、教师学院和耶鲁大学出版社），以及约
    300 篇科学文章和论文。他的工作被引用了 48,000 多，成为教育技术领域被引用次数的研究者之一。他曾担任《语言学习与技术》的创刊编辑以及《AERA Open》的首任编辑。


    Tamara Tate


    加州大学欧尔湾分校


    Tamara Tate 是加州大学欧尔湾分校的首席科学家，数字实验室的副主任。她领导与学区、大学、非营利组织、媒体和技术开发人员合作，开展支持教学的数字和在线工具（包括生成式
    AI）的迭代开发与评估。作为美国科学基金会（NSF）资助项目的负责人（PI），她正在研究生成式 AI 在本科写作课程中的应用。作为 IES 资助的国家 WRITE
    Center 的成员，她还研究写作。她在加州大学欧尔湾分校获得英语学士学位和教育学博士，并在加州大学伯克利分校获得法博士。


