    by having challenging threshold concept in computer science (Sanders and McCarthy
    2016). Their study involved 385 first-year students who were asked to generate
    their own analogies using ChatGPT. The students were provided with a code snippet
    and were tasked with creating recursion-based analogies, optionally including
    personally relevant topics in their prompts. A wide range of topics were specified
    by students, including common topics such as cooking, books, and sports, which
    also appeared in ChatGPT.


