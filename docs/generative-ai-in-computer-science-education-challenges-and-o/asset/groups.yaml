    # # 10 Conclusions


    In this Element, we have explored some of the many ways that large language models
    have and will continue to impact computer science education. We have seen that
    LLMs (and an emerging suite of LLM-powered tools) are capable of generating high-quality
    instructional materials and providing round-the-clock support to students. However,
    they also raise significant concerns, including potential misuse such as over-reliance
    and plagiarism.


    Large language models show great promise for transforming how educators prepare
    and deliver their courses. For instance, LLMs can dynamically create culturally
    relevant assignments, efficiently modify problems to enable reuse, and provide
    personalized learning resources that align with diverse student needs and interests.
    These capabilities suggest a future where educational materials can be highly
    adaptive, relevant, and engaging, while reducing the preparation time for educators.


    However, we have also discussed a number of challenges that require thoughtful
    consideration. Academic integrity is at the forefront, as LLMs make it easier
    for students to bypass learning processes either deliberately or as a result of
    poor metacognitive skills. For formal classes or learning on their own, chat-based
    agents like ChatGPT are promising in their ability to explain concepts at different
    levels of complexity, help students identify and diagnose errors in their work,
    and contextualize content to suit individual interests. The CS1-LLM case demonstrated
    that it is possible to embrace LLMs in an introductory programming setting in
    a way that is well received by learners.


    Large language models are clearly a transformative technology, but they are also
    just one more step in a line of technological innovations that have affected computer
    science education – personal computers, the internet, large-scale automation,
    and now LLMs. Each technology has provided benefits by making information and
    instructional materials more accessible and easier to create, while at the same
    time providing new avenues for academic misconduct. Will LLMs eventually become
    capable of autonomously guiding students through complex coding tasks, providing
    detailed and personalized feedback on learning progression, and even detecting
    plagiarism with high accuracy? The potential for LLMs to fundamentally reshape
    learning environments is vast, but this requires a collective effort to explore
    and establish best practices.'
