    a range of uses of AI tools during instruction. Finally, we discuss how to integrate
    these capabilities into end-user tools in Section 6.


    The final part of this Element tackles bigger implications of the technology.
    Section 7 discusses how learners and educators may be impacted by students'' misuse
    of generative AI tools. Then, in Section 8, we look to the future and how computer
    science education might change in response to the adoption of GenAI in industry.
    If industry is embracing generative AI coding tools, what different skills should
    we be teaching to help computer science students be the most efficient, skilled
    software developers upon graduation? Finally, we present a case study of a course
    designed and piloted at the University of California, San Diego, which fully embraces
    the use of generative AI. This innovative course defines learning goals that match
    industry in the presence of generative AI tools and includes training for students
    on GitHub Copilot, as well as the integration of more ambitious and interesting
    coding projects made possible by the availability of Copilot. The course also
    adjusts how assessments are run and graded to provide a balance between encouraging
    the use of Copilot and ensuring that students are still learning the necessary
    technical material.


