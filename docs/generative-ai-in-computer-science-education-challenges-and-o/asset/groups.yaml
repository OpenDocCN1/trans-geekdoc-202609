    # Generative AI in Computer Science Education 43


    points on a 0–12 point scale. The differences were found to be statistically significant
    (p = 0.00019).


    A newer study has attempted to quantify the increase in cheating and the effects
    on learning as a result of the advent of GenAI (B. Chen et al. 2024). They used
    a variety of sources of information to conclude that the quantity of cheating
    has increased. First, the difference in scores between unproctored quizzes and
    proctored exams has increased by a statistically significant amount (p < 0.001).
    A second, larger proportion of students have plagiarism indicators present in
    their coding assignments. They calculate a plagiarism ratio to capture the percentage
    of assignments each student has plagiarized, and conclude that the learning loss
    due to plagiarism has increased.


    In this section we consider three separate aspects of misuse – detection, learning
    impacts, and assignment design. For each element, we first present techniques
    widely developed to address unauthorized use of others’ solutions – either from
    the internet or from peers. We then consider any additional challenges that LLMs
    may pose.


    ## 7.1 Detecting Unauthorized Use


    Perhaps the most commonly used tool to detect plagiarism in computing education
    is MOSS (Measure of Software Similarity). Developed in 1994 by Alex Aiken (n.d.),
    MOSS is a tool that compares multiple subsubmissions to identify similarities
    between pairs of programs. Unlike a text comparison, MOSS uses a technique, which
    generates fingerprints of the code by analyzing overlapping chunks of text (called
    kgrams) and selecting key features for comparison. This method allows MOSS to
    detect similarities even when variable and function names have changed or comments
    have been rewritten, which are common techniques students use to obscure plagiarism.
    By focusing on the structure and logic of code rather MOSS provides a robust way
    to identify unauthorized reuse.


    A more recent detector, JPl, was created for detecting cheating (Pierce and Zilles
    2017). It has several different detectors that separately detect common patterns.
    Each detector transforms to generate a single number for each file. Any two files
    with the same number are considered identical.


    - Near-identical (Lazy) performs a simpler method than MOSS. It converts all to
    uppercase and removes all comments, whitespace, and some extraneous punctuation.

    - Identical Stream (Token) performs additional transformations so that unique
    names, such as variable names, are ignored.

    - Modified Edit Distance (MTED) performs transformations, then it reorders functions
    for number of tokens and only analyzes code within functions.

    - Inverted Token (IT) performs transformations, but it looks for matching substrings
    rather than identical token streams. It weights identical substrings by.

    - Inverted Index (IDT) searches for similar variable and function names. All names
    are converted to lower case, underscores removed, and written. It looks for the
    most similar files.

    - Statistical Dissimilar (Obfuscation) looks for indicators of software obfuscation.
    It collects information such as the length of the longest line, average identifier,
    and other metrics. For each statistical, the mean and standard deviation are computed,
    and a submission is flagged if its sum of absolute value of z-scores exceeds a
    specific threshold.


    Pierce and Zilles found that IT found the most instances of plagiarism at 73%,
    followed closely by IDT at 67%, overlap was only 50%, meaning that all instances
    were detected by one of those tools. That makes the combination of those tools
    very effective in detecting plagiarism.


    The biggest limiting factor of MOSS-like tools is that they only compare submissions
    against the contents of a database provided by the instructor (usually consisting
    of current student assignments as well as historical submissions from prior years).
    This neglects two important sources of plagiarism. First, a student can still
    hire another student (locally or on the internet) to complete their work. Second,
    they could obtain code from a source not included in the database. It is important
    to remember (as stated on the MOSS website) “Moss is not a system for completely
    detecting plagiarism. Plagiarism is a statement that someone copied code without
    attribution; while MOSS automatically detects program similarity, it has no way
    of knowing why codes are similar” (Alex Aiken (n.d.)). JPl has the same limitation
    – they all compare between-submission.


    Despite this limitation, detectors are effective at detecting many instances of
    possible plagiarism. For example, Chen et al. (2024) found that about 20% of students
    had plagiarism indicators present in 10% of their submissions prior to GenAI,
    with that rising to about 35% afterwards.


    # Generative AI in Computer Education


    In light of MOSS-like tools'' behavior, specifically checking for code similarity,
    assignments must be of sufficient complexity that wide variation in solutions
    is expected. For very simple coding exercises, it is likely that many students
    will independently generate the same solution, especially one that aligns with
    the material taught in class.


    However, there is one characteristic of GenAI that could make detection challenging
    for MOSS-like tools – the variation in results. Prior work found that MOSS was
    not effective at detecting unauthorized use of GenAI on early coding assignments
    (Biderman and Raff 2022). This is in contrast to Chen detecting more plagiarism
    with varied techniques. Students often employ obfuscation techniques that MOSS
    can detect (moving code and changing names), the authentic variation within code
    produced by GenAI tools makes this more difficult. To understand why, we must
    recall that LLMs are essentially nondeterministic (even when their temperature
    values are set to zero) and the models are extremely sensitive to differences
    in prompts. Further research is warranted to discover the nature of variance in
    GenAI coding results compared with the natural variation in student solutions.


    A promising alternative approach from the realm of plagiarism detection that might
    be more effective at detecting unauthorized use of GenAI code is to shift the
    focus from the final artifact submitted to the code development process through
    which students generated the solutions. In particular, when students useiarized
    code (whether from GenAI or traditional sources), they tend to copy large segments
    of completed code at a time rather than building up to a solution. By analyzing
    the intermediate steps before a student arrived at the final implementation, whether
    in the form of code commits (Reid and Wilson 2005) or keystroke data (Hart, Mano,
    and Edwards 2023), it is possible to find instances of large segments of polished
    code materializing for deeper scrutiny. However, this type of surveillance raises
    privacy concerns and has been shown to increase student stress (Hart et al. 2023).


    Deep learning approaches specifically crafted to identify LLM-generated solutions
    have also shown promise. Ho et al. (2024) explored the efficacy of deep learning
    models to detect ChatGPT-generated code for CS1 assignments and found them to
    be effective with an accuracy of above 90%. However, the authors note that the
    model tended to focus on programming patterns playing knowledge beyond what a
    novice programmer might be familiar with and question whether the approach would
    be effective in more advanced courses.

