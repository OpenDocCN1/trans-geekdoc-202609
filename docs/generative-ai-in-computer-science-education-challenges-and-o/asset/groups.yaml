    # Generative AI in Computer Science Education


    ## 1 Introduction


    ### 1.1 The Rise of Generative AI


    Computer science education is undergoing a transformation as generative AI reshapes
    how we learn, teach, and create. The wide availability of generative AI offers
    enormous potential, but it also poses significant challenges. One major concern
    is the use of generative AI in academic settings, which could result in unintentional
    plagiarism. Another major concern is the use of generative AI in creative fields,
    particularly regarding authorship. For instance, some companies have replaced
    customer service representatives with ChatGPT, which has expanded to better than
    human agents.


    The use of generative AI has also led to concerns about copyright. For example,
    the Writers Guild of America had a 148-day strike over disagreements regarding
    credit and income. Similarly, artists have seen their creative works used to train
    models without compensation. The National Science Foundation has also issued following
    guidelines regarding the use of generative AI in research, requiring researchers
    to disclose.


    The use of generative AI has also led to recent controversies in creative and
    modern contexts, such as advertisements for Google Gemini (that suggested it to
    draft letters) and for Toys ‘R’ Us (using OpenAI’s Sora model to generate a full-length
    video), both of which sparked debates about the erosion of human creativity and
    authenticity.


    Another major concern is the use of generative AI in legal contexts. For example,
    a judge in Colombia asked ChatGPT for help with case law: "Is an autistic minor
    from paying fees for their therapies?" ChatGPT responded, "Yes, this is correct.
    According to the regulations in Colombia, minors diagnosed with autism are exempt
    from paying fees for therapies." Although this response agreed the judge’s decision,
    the use of ChatGPT for guiding legal decisions generated criticism.


    The use of generative AI has also led to instances of professional misconduct.
    For example, lawyers and their firm were faced for submitting court documents
    that contained fictitious research. Vanderbilt University faced backlash after
    it sent an email to students reflecting on a tragic shooting at Michigan State
    University, which was later revealed to have been drafted using ChatGPT—a decision
    widely criticized for the perceived lack of human empathy.


    In academia, policies are evolving to address these concerns. For example, the
    Association of Computing Machinery (ACM) stipulates that while generative tools
    like ChatGPT can be used to create content, their use must be fully disclosed,
    and they cannot be listed as authors of work.


    ### 1.2 Challenges and Opportunities in Education


    In the field of education in general, there are major concerns about students
    using ChatGPT to cheat. A survey of 10,000 current undergraduate and graduate
    students found that 51 percent of college students believe that using such tools
    for assignments and exams is cheating, compared with 20 percent who disagree.
    In early 2023, coinciding with the first school term when ChatGPT was widely available
    and well known, concerns were voiced on a national scale. Many instructors at
    Harvard prohibited students from using ChatGPT, considering it a form of academic
    dishonesty. There may be some data to back up this hypothesis—use of ChatGPT tailed
    off in June 2023, corresponding with summer break, then increased.

