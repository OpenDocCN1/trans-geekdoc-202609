    # 4.5 Assessment Questions


    Creating equivalent problems is not only useful for cultural competence. It also
    provides a solution for running testing facilities at scale as university class
    sizes grow.


    There is a desire to have live coding exercises during exams. Allowing students
    to use their own devices can be challenging, because it may be impossible to monitor
    their use of the internet to look up references or even solutions to the exam
    questions. On the other hand, testing facilities large enough to be prohibitively
    expensive. Fowler et al. (2024) studied dynamically creating equivalent coding
    problems so that a single computer lab could be used for a class of students,
    with each student making an appointment for their exam. Since the questions are
    dynamically generated (with constraints), reporting exact questions to others
    is unlikely to give them a significant advantage. In this work, the authors chose
    very specific problems (e.g., find the largest in an array) and determined which
    other closely related, but not identical, problems (e.g., find the smallest in
    an array) were of equivalent difficulty. Once a problem has enough variations,
    it can be put into the bank, and one of the variations is chosen at the moment
    of exam.


    The process of creating and validating identical problems with slight variations
    is very time consuming, and authors of the previous study did not utilize generative
    AI. Instead, they analyzed common problem types and hand-coded the transformation
    that generated different versions of the problem from one starting problem.'
