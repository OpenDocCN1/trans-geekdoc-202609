    Specifically, the authors qualitatively evaluated each generated idea for quality
    of alignment with the base project''s code and found 81% of the generated ideas
    satisfied their evaluation metrics. At the same time, they identified two shortcomings:
    the presence of potentially insensitive and inaccurate elements and code when
    implementing the generated ideas in Scratch; both can be resolved with minimal
    modifications by teachers.


    Further, text-to-image generative AI could potentially be used to generate starting
    sprite and backdrop images, allowing teachers to spend less time searching the
    internet for appropriate media. Relatively straightforward prompt engineering
    could used to produce images that are suitable for Scratch: two-dimensional, cartoon-like,
    and with white backgrounds.


    While existing research has shown the promising application of LLMs in the creation
    of culturally competent projects, it is critical to further approach this direction
    with caution due to the impressionable nature of young children and the well-documented
    evidence of cultural and social biases in LLM outputs (Kotek Dockum, and Sun 2023;
    Liang et al. 2021; Nadeem et al. 2020; Tao et al. 2024). Tran et al., in their
    later study (2025), have concluded that LLM-generated content is not as student-facing
    materials at the K-8 level, and emphasized the important role of teachers in performing
    human filtering before bringing LLM-generated materials into the classroom. Teachers
    should review LLM-generated content for culturally insensitive elements that do
    not align with their expertise, and perform a thorough review to filter out or
    adjust inappropriate projects; additional training and scaffolds may be needed
    to support teachers in handling this.


