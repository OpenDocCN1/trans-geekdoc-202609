- pgno: 80
  md: '# Cambridge Elements


    # Generative AI in Education


    Mark Warschauer


    University of California, Irvine


    Mark Warschauer is a Distinguished Professor of Education at the University of
    California, Irvine, with affiliated faculty appointments in the Departments of
    Informatics, Language Science, and Psychological Science. He is a member of the
    National Academy of Education and the director of the UCI Digital Learning Lab.
    Professor Warschauer is one of the most influential scholars in the world on digital
    learning, digital literacy, and the US of AI in Education. He has published 12
    books on these topics including MIT Press, Cambridge University Press, Teachers
    College Press, and Yale University Press, some 300 scientific articles and papers.
    His work has been cited more than 48,000 times, making him one of the most cited
    researchers in the world of educational technology. He previously served as founding
    editor of Language Learning & Technology and inaugural editor of AERA Open.


    Tamara Tate


    University of California, Irvine


    Tamara Tate is a Project Scientist at the University of California, Irvine, and
    Associate Director of the Digital Learning Lab. She leads the work on digital
    and online tools to support teaching and learning including generative AI, with
    school districts, universities, nonprofit organizations, media and tech developers,
    and others in iterative development and evaluation. As the PI of an NSF-funded
    grant she is studying the use of generative AI in undergraduate writing courses.
    She also studies writing as a member of the IES-funded national WRITE Center.
    She received her B.A. in English and her Ph.D. in Education at U.C. Irvine and
    her J.D. at U.C. Berkeley.


