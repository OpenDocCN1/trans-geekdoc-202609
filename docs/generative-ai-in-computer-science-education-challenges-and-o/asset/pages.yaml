    USER What is the equivalent of 1010100111 in decimal?


    ASSISTANT 695


    USER Are you sure?


    ASSISTANT Yes, I’m sure. In binary, 1010100111 converts to 695 in decimal.


    **Figure 1** A modern LLM appearing “confidently incorrect” (screenshot from March
