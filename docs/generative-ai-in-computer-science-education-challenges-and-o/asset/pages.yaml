    Early work proposed an automated discussion-bot that answered student questions
    on discussion forums (Feng et al. 2006). Instead of using a large language model
    trained on vast amounts of data on the internet, the bot used information retrieval
    and natural language processing techniques to make answers from an annotated corpus
    of 1236 archived discussions and 279 course documents. They tested their bot with
    66 questions, finding only 14 answers were exactly correct, whereas half were
    considered “good answers.”


    More recently, the use of LLMs to assist with discussion forums has been explored
    (Zhang et al. 2023). The authors used an LLM to classify questions as conceptual,
    homework, logistics, and not answerable (by the LLM). Using GPT-3, they achieved
    81% classification accuracy overall, extending to 93% accuracy for classifying
    unanswerable questions, meaning the approach can effectively ignore questions
    it cannot answer, which could reduce the occurrence of unhelpful responses or
    hallucinations.


    Liu and Hiri (2024) took this one step further by simulating LLM-powered teaching
    assistant on questions collected from the discussion board of a massive introductory
    programming course. Using LLM chains – a prompt engineering technique where several
    different prompts iteratively build toward final solution: to first classify the
    question being answered, then uses classification to inform what model/parameters/prompt
    to generate a candidate answer. Another prompt assesses the quality of the answer.
    The authors ran a series of student questions through the model and found that
    the LLM-powered virtual TA:


    +   * was proficient at categorizing questions as either homework questions, coding
