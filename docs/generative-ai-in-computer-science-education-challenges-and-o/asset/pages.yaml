    # 3 Educator and Student Perceptions


    Given the rapidly evolving capabilities of generative AI tools, it is essential
    to understand how they are perceived by both educators and students within the
    context of computing education. Several studies have shed light on these perceptions
    revealing a complex landscape of excitement, concern, and adaptation strategies.


    # 3.1 Educator Perceptions


    Educator views on generative AI span a spectrum that is nearly captured in the
    title of the paper by Lau and Guo: “Ban It Till We Understand It’ to ‘Resistance
    is Futile.” (Lau and Guo 2023). In this work, they investigated the perspectives
    of university programming instructors on adapting their courses in response to
    the increasing use of students of AI code generation and explanation tools like
    ChatGPT and GitHub Copilot. Conducted in early 2023, this research involved semistructured
    interviews with 20 introductory programming instructors from diverse geographic
    locations and institution types. By focusing on exploring immediate reactions
    and longer-term plans, the study aimed to gather a broad spectrum of strategies
    and viewpoints on integrating or resisting AI coding tools in educational settings.
    In the short term, instructors were predominantly concerned about AI-assisted
    cheating, leading'
