    # Assessment Methodology


    In CS1-LLM, quizzes primarily excluded the Copilot, focusing on foundational skills
    like code tracing, explanation, and small coding tasks. The final exam, Copilot
    was integrated into the third section for solving a large, open-ended problem,
    while the second section required students to complete four code-writing tasks
    of increasing difficulty without Copilot, emphasizing a balance between traditional
    coding skills and effective AI tool usage.


    One of the most significant changes introduced in the CS1-LLM course was in the
    assessment methods for coding projects. Traditionally, coding assignments in introductory
    programming courses are graded using automated test cases. In this conventional
    approach, instructional staff invest time in setting up these test cases, but
    the actual grading process is largely automated and focuses on whether the student’s
    code produces the correct output under a predefined set of conditions.


    However, with the integration of tools like GitHub Copilot, which can generate
    code for projects at the CS1 level, this traditional approach to grading becomes
    less effective. Students are using Copilot to generate code, simply checking the
    correctness of outputs through automated tests no longer assesses the students’
    understanding and skills. Recognizing this, the assessment methods were redesigned
    to focus more on the students’ ability to explain and justify their work, rather
    than just their product.


    In the new assessment framework, students were required to submit not only their
    code but also a comprehensive diagram illustrating the decomposition of their
    program. This diagram served as a visual representation of their problemsolving
    process, showing how they broke down the problem into manageable functions and
    how those functions interacted with the overall structure of the program.'
