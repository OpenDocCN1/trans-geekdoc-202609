    of coding solutions and the evaluation of student projects, from a teacher''s
    perspective. The major difference between the K–12 and the college settings is
    the use of block-based rather than text-based programming languages.


    Given that block-based languages are precluded from the text-based nature of available
    LLM code-generation tools, researchers have attempted to use commercially available
    LLM models to perform two tasks: (1) creating sample solutions to block-based
    assignments and (2) automatically analyzing student'
