- pgno: 11
  md: '# VOCABULARY


    **Image Classifier:** A machine learning model designed to classify or recognize
    objects, animals, or other entities in images by analyzing their visual features,
    such as a giraffe, bus, or person’s face.


    **Generative AI:** Artificial intelligence models that generate new content, such
    as text, images, audio, or video, based on learned patterns from large datasets.


    **Large Language Models (LLMs):** A type of generative AI model trained on large
    datasets to produce coherent and contextually appropriate text outputs by generating
    sequences of “tokens” (words or phrases).


    **ChatGPT:** A conversational language model developed by OpenAI and designed
    to generate human-like responses in a dialogue format.


    **Hallucination:** A phenomenon when a large language model generates incorrect
    or nonsensical responses that appear plausible but are not grounded in its training
    data or factual information.


    # 2.1 Image Classifier


    An image classifier is a program that can recognize images, such as a giraffe,
    bus, or person’s face. Creating an image classifier consists of two phases: training
    and use.


    The training phase is how the classifier learns to associate attributes of the
    image with the results. In order to train a classifier, a database of pictures
    that have already been “labeled”(tagged with what is in the picture) is needed.
    For example, if an “animal” is wanted, then a database of pictures with different
    types of animals is required, each labeled with the type of animal in the picture.
    For a vehicle classifier, a database of pictures with different types of vehicles
    is needed, each labeled with the type of vehicle in the picture. A program analyzes
    the database of pictures, determining the characteristics that distinguish, say,
    pictures of motorcycles from pictures of trucks.


    The attributes of the training set are a critical component of the accuracy of
    the trained model. A “good” training set would include a wide variety of instances
    for each type of item – including different colors, camera angles, and other features.
    Not surprisingly, the more labeled images an image classifier has, the more accurate
    it is at classifying. In addition, an image classifier is unable to place something
    in a category for which it was not trained without extra computation. If the training
    set is too small, then the classifier might get'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Generative AI in Computer Science Education


    trained on “red herrings” – attributes that just happen to be in the pictures.
    For example, if someone trained the animal classifier on snakes that all live
    in the desert and squirrels that all live in the forest, then a picture of a snake
    in a forest might be identified as a squirrel, and a picture of a squirrel in
    a desert might be identified as a snake.


    Some databases may contain pictures that have been labeled unknowingly. For example,
    to automatically tag a particular friend when a picture is uploaded to Facebook®,
    Facebook needs an image classifier. Its training data on a specific friend would
    consist of all the pictures of that friend that have been labeled by users. Additionally,
    completing puzzles by Captcha, as clicking on all the boxes in a picture that
    contains traffic lights, motorcycles, or trucks, contributes labeled images to
    improve an image classifier.


    There are many ethical concerns with image recognition being used for facial recognition
    of humans because of the interaction between people of color, the inaccuracy of
    models on those people, and historical injustices. Clearview AI has gone a step
    further than Facebook, using social media to create an extensive database of images
    and names, leading to a fine by the Netherlands (Corder 2024). The database is
    marketed to law enforcement to identify suspects, which raises ethical questions,
    since the data is not verified to be correct, and arrests of innocent civilians
    have occurred because of misidentification in such systems (Johnson 2023). Facial
    recognition has been shown to be especially poor on individuals with darker skin
    (Sanford 2024); this could be because of either poor training sets or the challenge
    of distinguishing features in poor lighting. Therefore, one must consider not
    only the technological perspective of AI, but also its impact on different populations.


    # 2.2 Large Language Models


    Large language models are a type of artificial intelligence model designed to
    generate text by predicting the next word, or “token,” in a sequence. Unlike image
    classifiers, which rely on labeled datasets to learn, LLMs use a method called
    self-supervised learning. In self-supervised learning, the model learns from vast
    amounts of data without needing explicit labels. Instead, the model uses parts
    of the text to predict other parts (enabling it to verify these predictions automatically),
    making the process of data preparation more scalable and efficient.


    So, in essence, LLM simply predicts tokens (or words). Consider a very basic sentence
    (which we can think of as a “prompt”), which is incomplete:

    Prompt: “The cat sat on the”'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Generative AI in Education


    An LLM is able to predict the most likely next word (token) to follow the sequence
    “The cat sat on the”. It does this by considering the context and calculating
    the probability distribution for all possible next words it has learned from its
    training. Based on the patterns it has learned, the model might generate a frequency
    distribution like “mat”: 60 percent, “floor”: 20 percent, “chair”: 10 percent,
    “table”: 5 percent, “roof”: 3 percent, and so on.


    In this example, the word “mat” has the highest probability (60 percent) because
    the phrase “The cat sat on the mat” is a common phrase seen many times in its
    training data. Therefore, the model is most likely to select “mat” as the next
    word. However, one parameter of an LLM is the “temperature” value, and this setting
    controls the randomness of the output. Thus, it might choose another word “floor”
    or “chair,” and would be more likely to do so with a higher “temperature” setting.
    Finally, after selecting “mat,” the LLM can repeat the process all again–generating
    a coherent sentence that aligns with the patterns it has learned from its training
    data.


    During training, an LLM analyzes large datasets comprising diverse types of text,
    such as books, articles, and web content. LLMs are trained to predict tokens based
    on their context, they can generate a wide range of text outputs, from simple
    answers to more complex tasks like writing essays, generating code, or summarizing
    long documents. However, they are not perfect; their outputs are based on probabilities
    derived from their training data, which means they can sometimes generate inaccurate
    or nonsensical responses, often referred to as “hallucinations.”


    One of the most well-known tools that uses an LLM to generate text is ChatGPT,
    developed by OpenAI. ChatGPT leverages the LLM architecture and generates human-like
    responses by predicting tokens that fit well in a conversation. To make its responses
    more useful, safe, and aligned with what a human would expect, OpenAI used a technique
    called Reinforcement Learning from Human Feedback (RLHF). In this process, human
    trainers rated the model’s responses, giving positive feedback for answers that
    align well with conversational norms and factual accuracy, and negative feedback
    for responses that were misleading or unhelpful.


    The probabilistic generation of tokens helps explain some of the strengths and
    weaknesses of ChatGPT. If there are many examples in the training set similar
    to what is being generated, the model can draw from a robust probability distribution,
    resulting in highly accurate and predictable outputs. For example, the question
    “is the world round?” will likely result in the output “Yes,” as this is a common
    question-answer pair in the training data. Similarly, asking ChatGPT to finish
    a series of fairly unique, famous quotes that would have appeared'
  merge: -1
  img_proc: true
