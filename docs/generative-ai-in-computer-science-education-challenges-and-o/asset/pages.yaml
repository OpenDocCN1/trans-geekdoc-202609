    Large language models may also prove helpful in customizing existing assignments
    to an instructor’s local population (creating culturally competent projects).
    Cultural competence is an aspect of culturally responsive pedagogy (CRP). It facilitates
    students to honor their cultural backgrounds while developing understanding in
    at least one other culture through learning materials and activities (Davis et
    al. 2021). At the K–8 level, the literature clearly emphasizes the value and importance
    of CRP (Gay 2018; Ladson-Billings 1995) and students’ sense of belonging (Maslow
    1958, 1962), especially in teaching disciplines and among learners from under-represented
    groups in computing. While there are several existing culturally responsive curricula,
    a fixed set of materials will not stay responsive across time, location, and population.
    Thus, empowering teachers to created localized instructional materials is the
    next essential step.


