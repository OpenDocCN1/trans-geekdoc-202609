    # 5.2.1 Assessing Student Learning


    Large language models may make grading less time-consuming, permitting the use
    of question types that are under-utilized due to difficulties in grading in large
    classes. Despite, the widely acknowledged value of Explain in Plain English classes
    for developing code comprehension, the difficulty in grading students'' subjective
    responses makes them infeasible for large class sizes. A typical EPE question
    presents a student with a small fragment of code, and the task for the student
    is to explain the purpose of the code fragment in abstract terms.


    Smith et al. (2023) describe an innovative approach for grading EPE questions
    using large language models, whereby the student reads and attempts to understand
    a shown fragment of code, and then crafts an explanation in natural language.
    This explanation is then provided as the input prompt to a code-generating LLM,
    and the code that is automatically tested for equivalence with the original code
    using a test suite. Denny et al. evaluate this, as illustrated in Figure 9, in
    an introductory programming course with approximately 900 students (Denny, Smith
    et al. 2024; D. H. Smith, Denny, and Foweler 2024). They analysed success rates
    and prompt lengths, and classified prompts according to the Structure of Observed
    Learning Outcomes (SOLO) taxonomy (Lister et al. 2006). Student perceptions of
    these tasks were also gathered through surveys and thematic analysis to understand
    their views on the educational utility of using LLMs for assessing code comprehension.'
