    # Explaining Concepts


    Analogies can be a particularly effective type of explanation, as they help students
    bridge the gap between existing knowledge and unfamiliar concepts. The flexibility
    of LLMs has shown they are capable of generating cross-domain analogies which
    could be applied in a range of contexts (Ding et al. 2023). This is especially
    important in educational contexts, where creating effective analogies is difficult
    even for experienced instructors.


    Bernstein et al. (2024) explored this idea in an introductory programming context
    by having challenging threshold concept in computer science (Sanders and McCarthy
    2016). Their study involved 385 first-year students who were asked to generate
    their own analogies using ChatGPT. The students were provided a code snippet and
    were tasked with creating recursion-based analogies, optionally including personally
    relevant topics in their prompts. A wide range of topics were specified by students,
    including common topics such as cooking, books, and sports, which also appeared
    in ChatGPT-generated analogies where a topic was not specified. Other topics specified
    by students, such as video games and board games, were not present in the themes
    that were generated by ChatGPT. This suggests that while LLMs can generate bespoke
    analogies on-demand, the inclusion of "in-the-loop", of their personal interests
    and experiences can lead to more diverse and engaging analogies. Students reported
    enjoying the activity and indicated that the generated analogies improved their
    understanding and retention of recursion. This approach underscores how generative
    AI can be leveraged in computing education: not just as a tool for generating
    explanations, but as a means of empowering students to create their own, tailored
    learning resources.


    # 5.2 Assignment Assistance


    With respect to assignment assistance, we consider two aspects: how the feedback
    is provided and what is required.


    Providing feedback is critical for student learning. Research on practices show
    that the most effective feedback is specific (Hattie and Timperley 2007), timely
    (Opitz, Ferdinand, and Mecklinger 2011), aligned towards a student goal (Hattie
    and Timperley 2007), and surprising (Malone 1981).'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'In addition, it is helpful to think about several different types of help a
    student might need (Franklin et al. 2013), “help me finish this assignment.\”
    Some students merely need confirmation that they are on the right track, especially
    if they are not confident in their abilities. Others just need a reminder of a
    keyword or concept, allowing them to look at their notes or elsewhere to put that
    concept into practice. Some students know what concept to use but have a small
    conceptual barrier that needs to be resolved before they can move on. Finally,
    some may need to have an entire set of concepts retaught to them.


    With synchronous, interactive support, a human teaching assistant can provide
    the right level of help – asking a vride of probing questions to hone in on the
    topic and on the level of the learner needs. However, in large classes, human
    TAS may not always be available, with scheduled office hours at inconvenient times
    for some learners or not used when they are offered (M. Smith et al. 2017). Face-to-face
    support also doesn’t always serve students fairly, with some students reluctant
    to ask for help, while others may dominate the available time (A. J. Smith et
    al. 2017).


    Automated feedback can be provided in several ways. For general mechanism, we
    first consider how assistance has been provided as class sizes increased, prior
    to LLMs. We then present several projects that evaluated LLMs for providing help
    to students. It is important to note that LLM technology has been improving rapidly
    – a technique evaluated just two years ago may be much more successful today.


    # Discussion Boards


    A discussion board is an online forum where students can ask questions of the
    entire class or just to the instructional staff. While neither synchronous nor
    interactive, a discussion board has two benefits. First, peers can answer others’
    questions, lowering the burden for instructional staff and providing potentially
    faster responses. Second, students can look at previous posts and find answers
    to their questions without needing to ask.


    Prior research analyzing use of a discussion board examined posts from 395 students
    across two courses, revealing three major results (Vellukanel et al. 2017). First,
    many posts related to logistical or relatively shallow questions. This is positive,
    because the discussion relieved instructional staff of the burden of answering
    simple questions while allowing in-person hours to focus more on deep questions
    related to understanding. Second, the largest portion of questions reflected some
    level of constructive problem-solving activity, indicating that students were
    receiving substantive help. Finally, asking questions on the forum was positively
    correlated with course grades. The study'
