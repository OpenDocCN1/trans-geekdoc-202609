    # Learning Objectives and Resources


    The learning goals of the course were designed to reflect the integration of LLMs.
    The revised goals focused on skills such as prompt engineering, code analysis,
    testing, debugging, and problem decomposition. Traditional objectives like writing
    code from scratch were de-emphasized, while new objectives like applying prompt
    engineering to influence AI-generated code were introduced (Denny, Kumar, and
    Giacaman 2023).


    A novel component of the course was the introduction of a “function design cycle,”
    which outlines a process for students to crafting a prompt, generating code with
    Copilot, and evaluating and debugging code. The course also utilized the textbook
    by Porter and Zingaro (2023), titled Learn AI-Assisted Python Programming with
    GitHub Copilot and ChatGPT, which was written to accompany the course.


    Vadaparty et al. (2024) present an evaluation of this approach with more than
    500 students. The evaluation involved surveying students on their perceptions
    of the new course structure. While the majority of students responded positively,
    appreciating the creativity and scale of the projects, some challenges were noted.
    These included concerns about over-reliance on Copilot and some confusion from
    students about what they should be able to do with and without the support of
    an LLM.


