  md: '# Generative AI in Computer Science Education


    Lister 2009 or ‘Explain in Plain English’ problems (Murphy, McCauley, and Fitzgerald
    2012), and frequent practice at writing code with ‘many small problems’ (Allen
    et al. 2019). Previous sections of this Element focused on the impacts of GenAI
    when retaining the same learning goals. In this section, we consider whether the
    learning goals, or the priorities among different skills, might change with the
    emergence of GenAI. We ask the question, Given the ease with which code can be
    generated from natural language prompts, how does that change what we should teach?


    # 8.1 The Changing Industry Landscape


    To answer this question, we first consider how GenAI is already changing, and
    will further change, software developers’ jobs. A GitHub survey report 92% of
    developers in the United States are using GenAI tools, and 70% of perceive benefits
    as upkilling and increased productivity (Shani 2023).


    How does coding change when a GenAI helper acts as Copilot? There are two main
    phases when coding with Copilot. First, the developer needs to formulate a prompt
    so that Copilot can produce code that matches the desired functionality as closely
    as possible. Copilot can create a draft of the code, albeit with bugs or otherwise
    not satisfying the desired requirements. Second, once the draft has been produced,
    the developer’s primary job is to assess and potentially modify the code. Thus,
    code reading, comprehension, and debugging skills are essential – more essential
    than writing code from a blank screen. So, not only do code modification skills
    become more important, skills applicable only to coding without a GenAI helper
    become less important.


    We explore two novel pedagogical approaches driven by these changing needs. We
    also highlight their impact on accessibility, the capabilities of LLMs for translating
    prompts written in a range of different languages.


    # 8.2 Writing and Explaining Code by Prompting


    We argue that the two major pedagogical changes are to teach prompt engineering
    for code-generating GenAI tools and emphasizing reading (and understanding) code
    over writing it.


    Training students on how to craft effective prompts for code-generating models
    is a new skill. One approach for developing this skill is described by Denny,
    Leononen et al. (2024) who introduce the idea of “Prompt Problems,” a novel exercise
    designed to train students in the art of prompt creation. Prompt Problems require
    students to analyze visual or descriptive representations of programming tasks,
    formulate natural language prompts (which are used by an LLM to generate code),
    and validate the generated code against automated'
