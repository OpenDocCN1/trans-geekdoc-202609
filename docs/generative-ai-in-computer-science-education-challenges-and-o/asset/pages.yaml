    at the time of the working group''s replication) exhibited dramatic improvement,
    scoring an average of 97% over two programming exams.


    In general, LLMs have shown considerable proficiency in programming tasks, even
    beyond typical CS1-type problems. For example, Cipiano and Alves (2023) explored
    object-oriented programming (OOP) assignments, where students are typically asked
