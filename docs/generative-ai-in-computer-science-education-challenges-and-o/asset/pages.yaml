  md: '# Generative AI in Computer Science Education


    # Challenges and Opportunities


    Elements in Generative AI in Education


    DOI: 10.1017/97810009581738

    First published online: April 2025


    Diana Franklin

    University of Chicago

    Paul Denny

    The University of Auckland

    David A. Gonzalez-Maldonado

    The University of Chicago

    Minh Tran

    The University of Chicago


    **Author for correspondence: Diana Franklin, dmfranklin@uchicago.edu**


    > **Abstract:** Generative AI is a disruptive technology that has the potential
    to transform many aspects of how computer science is taught. Like previous innovations
    such as high-level programming languages and block-based programming languages,
    generative AI lowers the technical expertise necessary to create working programs,
    bringing the power of computation to more people. The programming process is already
    changing as a result of its presence, even for experts programmers. It also poses
    significant challenges to educators around rethinking assessment as well-established
    approaches no longer be viable. Many traditional programming assignments can be
    completed using generative AI tools with minimal effort, thus potentially undermining
    learning. In this Element, the authors explore both the opportunities and the
    challenges for computer science education resulting from the widespread availability
    of generative AI.


    **Keywords:** computer science education, computing education, generative AI (GenAI),
    large language models (LLMs)


    © Diana Franklin, Paul Denny, David A. Gonzalez-Maldonado, and Minh Tran 2025


