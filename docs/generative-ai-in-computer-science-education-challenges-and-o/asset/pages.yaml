    # About the Series


    Generative AI is one of the most disruptive technologies in modern history, with
    the potential to dramatically transform education for better or worse. This series
    will address cutting-edge topics on the intersection of generative AI with educational
    research and practice for diverse learners from early childhood to adult.'
