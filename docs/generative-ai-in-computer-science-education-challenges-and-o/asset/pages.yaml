    # 6 Designing for the User


    We have reviewed a number of independent, separate ways that LLMs can be used
    to provide support for a variety of preparation and teaching tasks. These have
    tended to focus on the technical point of view – in other words, what LLMs are
    capable of. However, each research paper we reviewed have many hours of prompt
    engineering to determine how to create a consistent prompt that provides the best
    possible results. Some tasks may not need a great deal of engineering, whereas,
    like the work to generate ideas for themed Scratch projects, take a substantial
    amount of time to produce responses that contain accurate and complete information.


    This section discusses how LLM-powered tools should be presented to the user.
    We present three examples: one that exists and two that are the focus of future
    work.'
