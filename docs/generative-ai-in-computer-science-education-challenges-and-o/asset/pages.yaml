  md: '# Generative AI in Computer Science Education 13


    to immediate measures placing a greater emphasis on exam scores, banning AI tools,
    and exposing students to the tools’ capabilities and limitations. Looking further
    ahead, instructors diverged into two main camps: those resisting AI usage, focusing
    on teaching programming fundamentals, and those embracing AI tools, viewing them
    as preparation for future job environments. This division underscores the lack
    of consensus and the exploratory nature of current approaches to AI in computing
    education.


    Strategies to resist AI tool usage designed “AI-proof” assignments, reverting
    to paper-based exams, and criticizing code review over programming tasks. Instructors
    who were more open to integrating AI tools using these technologies to offer personalized
    learning experiences, assisting with tasks, and redefining the curriculum with
    a greater emphasis on software design, collaboration with AI, and creative project
    work. Overall, the findings suggest a need for adaptive teaching strategies that
    either incorporate AI as a tool for learning and development or reinforce traditional
    coding skills in novel ways that are resistant to trivial LLM-generated solutions.
    Lau and Guo also proposed a diverse set of open research questions that help a
    course for continued investigation within the community.


    In more recent work, Sheard et al. (2024) conducted interviews with 12 instructors
    from Australia, Finland, and New Zealand. These interviews aimed to capture a
    diverse set of perspectives on the use of AI tools in computing education, including
    current practices and potential modifications in response to AI tools. In general,
    instructors acknowledged the potential of AI tools to support and enhance learning
    by generating code examples and providing personalized feedback. However, concerns
    were raised about students potentially bypassing crucial learning processes and
    over-relying on these tools, which could lead to a shallow understanding of programming
    concepts. Participants also noted significant challenges to traditional assessment
    methods, raising concerns about academic integrity and the potential for cheating.
    Such concerns are exemplified in the following quote from one participant in the
    study: “we are clearly living in a time in which we have to rethink computing
    education, and particularly the assessment of computing education, because we
    can no longer assess students in any of the ways we have been trying to assess
    them.” There was general agreement from the participants of this interview study
    that the integration of AI tools should be a point in the curriculum where students
    have already acquired foundational programming skills. Note, this view is not
    universal within the community, with some researchers suggesting a “prompts first”
    approach, which students begin by learning to prompt AI models, and what is needed
