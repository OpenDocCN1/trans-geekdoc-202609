    # 4.1 Example Code Explanations


    We first consider textbook examples. MacNeil et al. (2023), integrated LLM-generated
    code explanations into an interactive e-book on web software development. Three
    types of explanations were generated for code snippets: line-by-line explanations,
    a list of important concepts, and a high-level summary. Table 1 shows examples
    of explanations generated by GPT-3 for a code snippet to create a simple server
    that counts the number of POST requests. The line-by-line explanation (a) highlights
    the syntax and terminology in every line of code, listing the concepts (b) are
    explanations of important concepts used in the code, whereas the summarization
    (c) provides a high-level explanation of the purpose of the code.


    They found that student engagement varied based on code complexity, type, and
    length, but although the majority of students found the code explanations helpful.
    Similarly, Leinonen, Denny, et al. (2023) compared the quality of code explanations
    generated by students and LLMs in a CS1 course context, finding that students
    rated LLM-created explanations as easier to understand and more accurate summaries
    of code than those created by students. Both studies highlight the potential of
    LLMs as tools for generating educational content in computing courses. They remain
    however, some concerns regarding the accuracy and completeness of LLM-generated
    code explanations, indicating the need for oversight or additional processing
    before these explanations are presented to learners.


    # 4.2 Worked Examples


    Worked examples have been well researched in introductory programming courses
    (Muldner, Jennings, and Chiararelli (2022)). Worked examples involve a problem
    statement with a step-by-step annotated solution that illustrates the problem-solving
    process (see Table 2). Worked examples can take several forms.


    Modeled examples occur during a lecture. An instructor writes code, narrating
    their thought process as they do. They may make mistakes, requiring them to make
    modifications in real-time. The alternative is to provide static code all at once,
    explaining how it works after it is displayed. The effectiveness of such modeling
    is unclear. In one study, modeling examples led to no differences between groups
    on exams, assignments, and overall course scores; a benefit was only observed
    on the final course project (Rubin 2013). In another study, there were no significant
    differences (Raj et al. 2020). LLMs may not be obviously appropriate for this
    kind of modeling, given that they generate'
