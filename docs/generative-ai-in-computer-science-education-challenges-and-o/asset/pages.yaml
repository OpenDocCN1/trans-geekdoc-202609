    many times in its training set typically results in the expected output. For example:
    “With great power” …comes great responsibility (Spider-Man): “Don’t let the muggles”
    “…get you down” (Harry Potter). For more complex tasks that do not have matches
    in the training data, ChatGPT relies on its ability to detect and combine patterns
    it has learned during training. For instance, if asked to generate a response
    for a specific computer scientist, ChatGPT might draw on general information about
    typical resume structures and content it has seen, as well as any relevant information
    it has learned about computer scientists in general. The result is a result that
    appears plausible and well-structured. However, because ChatGPT generates content
    based on patterns rather than specific knowledge, the output may contain a mix
    of both accurate and inaccurate information. This blending of learned patterns
    allows ChatGPT to produce creative and contextually appropriate text, but it also
    means that users need to verify the details to ensure they are correct.


    As mentioned earlier, when an LLM provides an incorrect answer to a factual question,
    it is sometimes a *hallucination*. Another interesting characteristic of LLMs
    is that they are characterized as producing responses that are *confidently incorrect*.
    This refers to ChatGPT answering a question incorrectly with the same wording
    and confidence as answering a question accurately, with no mitigating language
    that a human might use (e.g., “I’m not sure, but this might be the answer”). See,
    for example, the output in Figure 1. Viewing LLMs as probabilistically generating
    answers that fit the pattern explains this trend. ChatGPT was built to generate
    *likely* answers that fit a pattern, not *factual* answers. Therefore, it is always
    necessary to fact-check what an LLM produces, even when it does not “admit” to
    being unsure. This can have negative effects if people are not aware of these
    limitations. For example, ChatGPT has been shown to produce inaccurate responses
    when asked questions'
