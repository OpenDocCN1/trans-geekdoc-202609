    # Design Principles


    Vadaparty et al. (2024) describe several design principles underpinning the CS1-LLM
    approach. These include incorporating LLMs throughout the course-work, including
    on some final assessments. Note that there is not yet consensus in the community
    about the fundamental skills that should be learned with and without LLMs, and
    thus remain some aspects of the course in which students are expected to write
    code without the support of LLMs. However, given that reading and modifying code
    is an essential skill in industry, most assessments allowed students to start
    by generating code using Github Copilot. The course was also designed to support
    diverse learners by leveraging best practices from computing education literature,
    such as the use of Peer Instruction, media computation, and pair programming,
    which are known to enhance engagement and retention. Another core principle was
    to foster creativity by providing students with opportunities to engage in open-ended
    projects that are personally relevant. Finally, the course was crafted to serve
    both students who would continue in computer science and those who might not take
    further computing courses, but who would benefit from being able to write programs
    to solve real problems in other domains. This resulted in a course that focused
    on low-level syntax, and on providing students the skills to leverage powerful
    libraries for automating mundane tasks such as processing large quantities of
    data.


    # Tool Support


    An interesting aspect of the GitHub Copilot, aligned with the first design principle,
    was the introduction of Copilot from the very beginning. Students were taught
    how to install and use Copilot within the Visual Studio Code IDE during the first
    week of the course. They began programs by typing English comments and allowing
    Copilot to generate the corresponding Python code. This approach is essentially
    the same as the “sketch model” of collaboration between humans and AI as proposed
    by Alves and Cipriano (2023), where the'
