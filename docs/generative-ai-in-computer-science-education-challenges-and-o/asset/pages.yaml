    # 6.1 Preparatory Materials


    In Section 4, we described different ways LLMs could help teachers create materials
    for their classrooms. What would this process look like from the educator''s perspective?
    Let''s consider creating assignments. As described in the process of customizing
    a Scratch project, we will assume that educators are starting from a curriculum.
    Given an assignment, perhaps they want a technically equivalent assignment with
    a creative scenario / theme. Then, the LLM needs two pieces of information: the
    original assignment and the desired theme. However, with integration, the LLM
    can also generate themes.


    There is growing interest in how to design user interfaces for educational applications
    that incorporate generative AI, especially for users with little technical experience.
    Recently, Pozdniakov et al. (2024) proposed a framework for user-centric applications
    to make generative AI more accessible and effective in educational settings. One
    significant design decision is how much autonomy to give the educator and how
    much to abstract away. Let''s consider the scenario in which a K–8 teacher, perhaps
    without a computer science degree and limited experience working with generative
    AI tools, wants creating a project. We could create a system that integrates all
    of the steps, providing support and guidance throughout the process.


    Figure 10 depicts such a system. Each box represents a phase that is active step
    with a specific prompt for an AI tool, and the output is to it. We now describe
    the different steps, how the interface would be for the teacher, and how we balance
    teacher agency and control with hiding the technical details. The figure depicts
    the customization of a single project, drawn from the Animation Module of the
    Scratch Encore curriculum. The information for the Animation Module has already
    been encoded in the system – including the prompt from 8 and the original project
    code.


    Brainstorm Themes We first assist the teacher in brainstorming possible themes.
    We ask the teacher a variety of questions about their classrooms, including the
    countries their students come from, the town and state of their


    ![](img/b3c4128584a21a9796cd13e052035ee1_40_0.png)


