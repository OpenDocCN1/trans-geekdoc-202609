  md: '# Generative AI in Education


    # 3.2 Student Perceptions


    Students appear to share some of the concerns as educators. Prather, Reeves, et
    al. (2023) provide an insightful exploration of novice programmers'' interactions
    with GitHub Copilot. Students reported a mix of awe and unease, with finding the
    tool''s predictiveness both helpful and unsettling. This latter, which inspired
    the title of the paper, was typified in the comment from one student: "I thought
    it was weird that it knew what I want." While Copilot was praised for its ability
    to streamline coding tasks, concerns were raised regarding overreliance on the
    tool and potential barriers to learning fundamental problem-solving skills. One
    participant expressed concern that the tool would make them a "worse problem solver"
    as they begin to rely on it more. Additionally, the study unveiled cognitive and
    metacognitive challenges students face, prompting a discussion on the need for
    educational tools to better support learning processes.


    A comprehensive report of an ITICSE Working Group that convened in July 2023 combined
    insights from a broad survey involving both educators and students across 17 countries
    (Prather, Denny et al. 2023). Two separate surveys were developed for students
    and instructors, covering topics from generative AI use and ethical considerations
    to perceived impacts on education and future employment. Both groups reported
    similar patterns in using generative AI for code writing and for text-based tasks,
    indicating a growing familiarity with these technologies. There was also a strong
    consensus on the irreplaceable role of human instructors despite acknowledging
    the growing relevance of generative AI tools in computing education and future
    careers. Especially upper-level students, generative AI tools appear to be a significant
    resource for student assistance, indicating a shift in help-seeking preferences.
    Among the implications of this work, as identified by the report authors, is that
    educators should be aware of technological advancements so that they can effectively
    integrate generative AI tools into their teaching practices.


    # 4 Class Preparation


    One way that computing educators can clearly leverage generative AI is in the
    creation of high-quality learning resources. Such resources can be static (i.e.
    generated in bulk and distributed via an appropriate platform) or dynamic (i.e.
    generated on demand by students). Among the many possible resources that can be
    produced by generative AI tools, code explanations, programming exercises, and
    worked examples have recently been proposed and studied. In this section, we present
    traditional teaching techniques, followed by the ways in which LLMs can assist.'
