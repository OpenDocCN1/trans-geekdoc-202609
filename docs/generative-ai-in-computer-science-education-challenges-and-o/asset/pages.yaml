    Culturally Responsive Pedogy: A learner-centered approach to teach-ing incorporates
    students'' cultural identities and lived experiences into the classroom to facilitate
    their engagement and academic success.

    Cultural Competence: The ability of an individual to honor their cultural backgrounds
    while developing understanding in at least one other culture.

    Reskinning: The process of modifying the visual presentation of a Scratch project
    by changing the sprites and backdrop to match with a new theme while keeping the
    code untouched.'
