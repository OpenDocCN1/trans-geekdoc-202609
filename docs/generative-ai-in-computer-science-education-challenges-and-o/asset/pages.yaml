  md: '# Generative AI in Computer Science Education


    # 1 Introduction


    # 1.1 The Rise of Generative AI


    Computer science education is undergoing a transformation as generative AI reshapes
    how we learn, teach, and create knowledge. Generative AI quickly advanced from
    niche to commodity in November 2022 with the launch of ChatGPT by OpenAI (Thorbeck
    2023). At the one-year anniversary of the launch, news outlets categorized ChatGPT
    as “Changing the Tech World” (Edwards 2023b) and starting an “AI Revolution” (Thorbeck
    2023). In that first year, competitors also released AI chatbots, including Google’s
    Bard and Amazon’s Q DeVon (2023). OpenAI also released DALL-E, software that produces
    art work based on user-provided text prompts, in October 2023. More recently,
    the availability of multimodal models, which produce and integrate multiple types
    of input such as text, images, and audio, has expanded rapidly, with closed models
    (developed and maintained by private organizations and accessible only through
    web requests) and open models (freely accessible for and running on local hardware)
    contributing to the fast growing landscape of generative AI tools. The wide availability
    of such a range of generative AI models offers enormous potential for innovation,
    especially within education, but it also raises a number of pressing ethical questions.


    One major concern is the use of copyrighted work to train models. Authors and
    artists have seen their creative works used to train models that then produce
    similar outputs without compensation or credit (Edwards 2023a; Katersky 2023).
    Ethical concerns about generative AI have resulted in the United States’ National
    Science Foundation issuing two major guidelines involving proposal and review
    (Notice to research community: Use of generative artificial intelligence technology
    in the NSF merit review process 2023). First, proponents are now “encouraged to
    disclose the extent to which they used generative AI to develop their proposal.
    Second, reviewers are prohibited from using any content from proposals because
    of concerns that models may use as training text. This could result in the model
    returning that same text to other users as responses to related prompts, breaching
    the confidentiality of the proposals and potentially leading to unintentional
    plagiarism.


    Another major concern is how the use of generative AI may impact professionals,
    particularly regarding authorship and credit in academic and creative fields.
    For instance, the Writers Guild of America had a 148-day strike over disagreements
    related to credit and income due to the increasing use of generative AI in scriptwriting
    (Coyle 2023). In addition, some companies have replaced customer service representatives
    with ChatGPT because it responded'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# Generative AI in Education


    to customers as well as better than any customer service agents (Verma 2023).
    In the academic sphere, policies are evolving to address these concerns; for example,
    the Association of Computing Machinery (ACM) stipulates that while generative
    tools like ChatGPT can be used to create content, their use must be fully disclosed
    in an acknowledgments section, and they cannot be listed as authors of a published
    work.


    Finally, there are examples from several fields of authors using ChatGPT and passing
    off its output as their own writing, then subsequently discovered due to inaccuracies
    in the information that ChatGPT returns. For example, lawyers and their firm were
    faced for submitting formal court documents generated by ChatGPT that contained
    fictitious research (Neumer 2023). Vanderbilt University faced backlash after
    it sent an email to students reflecting on a tragic shooting at Michigan State
    University, which was later revealed to have been drafted using ChatGPT – a decision
    widely criticized for the perceived lack of genuine human empathy (Powers 2023).
    Similarly, recent controversies have arisen with the use of generative AI tools
    in creative and modern contexts, such as advertisements for Google Gemini (that
    suggested it to draft letters) and for Toys ‘R’ Us (using OpenAI’s Sora model
    to generate a full-length video), both of which sparked debates about the erosion
    of human creativity and authenticity. A judge in Colombia asked ChatGPT for help
    with case law, “Is an autistic minor from paying fees for their therapies?” to
    ChatGPT responded, “Yes, this is correct. According to the regulations in Colombia,
    minors diagnosed with autism are exempt from paying fees for their therapies”
    (Stanly 2023). Although this response agreed the judge’s decision, the use of
    ChatGPT for guiding legal decisions generated criticism at the time.


    # 1.2 Challenges and Opportunities in Education


    In the field of education in general, there are major concerns about students
    using ChatGPT to cheat. A BestCollegeSurveyof10000 current undergraduate and graduate
    students found that 51 percent of college students believe that using such tools
    for assignments and exams is cheating, compared with 20 percent who disagree (Nietzel
    2023). In early 2023, coinciding with the first school term when ChatGPT was widely
    available and well known, concerns were voiced on a national scale. Many instructors
    at Harvard prohibited students from using ChatGPT, considering it a form of academic
    dishonesty (Duffy and Weil 2023), and articles hypothesized about using it for
    cheating (Vice 2023). There may be some data to back up this hypothesis – use
    of ChatGPT tailed off in June 2023, corresponding with summer break, then increased'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Generative AI in Computer Science Education 3


    again in September (Barr 2023). Some good news, however, is that an annual survey
    by Stanford researchers showed that the percentage of high school students reporting
    they engaged in at least one “cheating” behavior in the past month had remained
    unchanged (Spector 2023). This suggests that while the tools may change, new technologies
    may not necessarily be encouraging a greater proportion of students to use them
    dishonestly.


    The field of computer science has not been immune to legal controversies regarding
    AI-based code generation. For instance a class lawsuit was filed in November 2022
    against GitHub Copilot by a group of software engineers, alleging that GitHub,
    Microsoft, and OpenAI violated copyright, privacy, and business laws by using
    copyrighted developer source code without permission to train their models (Park
    et al. 2023). The plaintiffs argued that Copilot often produced code suggestions
    that were identical to the original copyrighted works without proper attribution
    or consent. Although GitHub and its partners contested these claims, raised ethical
    and legal questions about AI’s reliance on publicly available code. Despite these
    controversies, discussions in the popular media around tools like GitHub Copilot
    and ChatGPT often focus on their performance and providing guidance on their use,
    rather than focusing on the ethical implications of AI-generated code or predicting
    significant job losses within the computing industry.


    From an academic perspective, large language models (LLMs) were first considered
    by the computer science education community in the Australasian Computing Education
    conference, when February 2022, Finnie-Ansley et al. presented their paper “The
    Robots are Coming: Exploring the Implications of OpenAI Codex on Introductory
    Programming” (Finnie-Ansley et al. 2022). This was the first paper published in
    a computing education venue that assessed the capabilities of an LLM for code
    generation, OpenAI’s Codex, when compared to standard introductory programming
    (CS1) problems. The paper compared the performance of the Codex model to the performance
    of a cohort of students on the same set of programming problems, finding that
    the model’s performance would rank it in the 17th position out of a class of 71
    students. In addition, an analysis involving several variations of the classic
    “Rainfall” problem (Fiser 2014) revealed that from the same input, the Codex model
    would produce multiple unique solutions varied in length, syntax, and algorithmic
    approach. The authors concluded this by stating


    > “we have examined what could be considered an emergent threat to the teaching
    and learning of introductory programming. With some hesitation we have decided
    to state how truly we feel – the results are stunning – demonstrating capability
    far beyond that expected by the authors.” (p. 18).'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Generative AI in Education


    This paper appeared at a time when awareness of generative AI was not yet widespread
    in the academic community, and thus set the stage for a broader discussion of
    the implications of this new technology for educators and for classroom practice.


    Subsequent discussion and position papers, including those by Denny, Prather,
    et al. (2024), Becker et al. (2023) and Prather, Denny et al. (2023), have further
    explored both the opportunities and challenges that LLMs present to computing
    education. Among the challenges highlighted are concerns related to academic integrity,
    such as the potential for increased plagiarism and unauthorized code use; the
    danger of students becoming reliant on AI, which might hinder their understanding
    of core programming concepts; the risk of novices being misled by inappropriate
    or confusing outputs. In contrast, the opportunities presented by LLMs may be
    transformative. The ability to generate high-quality educational resources, provide
    instant feedback, and shift the educational focus toward solving more complex,
    engaging problems rather than a narrower focus on low-level coding and related
    syntax represents potentially significant positive changes for computing education.


    # 1.3 Stucture and Audience


    In this Element, we consider and discuss the ways in which generative AI (GenAI)
    could be used in computer science education, both positive and negative. While
    computer science instruction covers a broad set of topics, but not limited to
    how hardware and networks work, how to code, how to analyze code, and how to prove
    properties of code, much of the existing efforts and literature have focused on
    tertiary-level coding courses. As a result, the related work focuses on the use
    of LLMs in such contexts. We do, however, provide some insights into the challenges
    and opportunities for using LLMs more broadly, as in K–12 education or for instruction
    on specific topics such as formal proofs.


    This Element is written with several audiences in mind. Educators not unfamiliar
    with large language models gain insight into the aspects, both positive and negative,
    of their uses, as well as some of the strategies people are exploring that range
    from embracing their use to mitigating the dangers of their use. For this audience,
    we have included some background on how large language models work, and we define
    vocabulary as it arises. Computer science education researchers who are interested
    in entering this emerging research area will learn about the latest research and
    where to seek additional information.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Generative AI in Computer Science Education


    For this audience, we have carefully cited the research we describe, including
    much of the most recent work published as August 2024.


    We begin in Section 2 by providing insight into how large language models work,
    starting with more simple technologies that are easier to reason about and ending
    with their current capabilities with respect to computer science education. We
    then describe the key findings of studies on both instructor and student perceptions
    of the use of generative AI in computer science classrooms in Section 3.


    The next part of the Element explores uses of generative AI. First, we present
    a variety of ways instructors could use generative AI tools to improve the way
    that they prepare for instruction (Section 4). Then, in Section 5, we explore
    a range of uses of AI tools during instruction. Finally, we discuss how to integrate
    these capabilities into end-user tools in Section 6.


    The final part of this Element tackles bigger implications of the technology.
    Section 7 discusses how learners and educators may be impacted by students'' misuse
    of generative AI tools. Then, in Section 8, we look to the future and how computer
    science education might change in response to the adoption of GenAI in industry.
    If industry is embracing generative AI coding tools, what different skills should
    we be teaching to help computer science students be the most efficient, skilled
    software developers upon graduation? Finally, we present a case study of a course
    designed and piloted at the University of California, San Diego, which fully embraces
    the use of generative AI. This innovative course defines learning goals that match
    industry in the presence of generative AI tools and includes training for students
    on GitHub Copilot, as well as the integration of more ambitious and interesting
    coding projects made possible by the availability of Copilot. The course also
    adjusts how assessments are run and graded to provide a balance between encouraging
    the use of Copilot and ensuring that students are still learning the necessary
    technical material.


    # 2 Understanding Large Language Models and ChatGPT


    To better understand the strengths and weaknesses of chatbots as ChatGPT, we begin
    by providing a brief introduction to the technology. We start by presenting a
    related technology — a machine learning classifier. We then discuss LLMs, along
    with some of their common behaviors. Finally, we provide a summary of evaluations
    of the capabilities of LLMs for performing coding-related tasks.'
  merge: -1
