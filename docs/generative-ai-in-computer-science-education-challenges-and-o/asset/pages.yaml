    a model in which students are expected to perform a lot of work with little reward,
    all preparation for a large reward at the end, does not follow behavioral theories
    related to motivation. Goal-setting theory claims claims difficult, specific,
    content-appropriate, and immediate goals, rather than long-term goals, motivates
    learners to achieve more (Ling et al. 2005). In addition, it reduces the number
    of samples of student performance and can increase anxiety (Zeidler 1998). Therefore,
    learning goals needs to be cut up into small chunks, with points and badges for
    intermediate progress. In addition, effective feedback is timely, and waiting
    until the end of the term to provide substantive feedback would not allow students
    to adjust efficiently.


    The second model is frequent testing; however, this can be a burden on instructional
    staff. On top of the challenge related writing additional assessment questions,
    there is the logistical challenge of booking spaces for administering the tests.
    Paper-and-pencil tests are the primary mechanism for preventing use of online
    resources, as they eliminate students but are time-consuming to grade. There has
    been growing interest in the idea of dedicated computer-based testing facilities
    which can overcome the logistical challenges (Zilles 2023). Emeka et al. (2024)
    describe a comparison of three different methods for administering computer-based
    tests at scale: (1) a dedicated Computer-Based Testing Center (CBTC), exams proctored
    in person in the classroom, and (3) BYOD exams proctored online via Zoom. Through
    randomized experiments, they found that the testing modality did not significantly
    impact students’ exam performance or study behaviors. However, they noted that
    different modalities offered varied logistical benefits and potential challenges.
    For instance, CBTCs provide a controlled environment that standardizes the testing
    experience, while BYOD options, though more flexible, introduce security concerns
    and potential for increased cheating.


    # Adjusting Assessment Methodology


    Dedicated computer-based testing facilities rely on large banks of questions from
    which a random subset is drawn for each individual student. Generating such large
    banks can be efficiently achieved using GenAI, which can create'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'a wide variety of questions tailored to different levels of difficulty and
    top-ics. In a wonderful example of Universal Design, in which a problem leads
    to many unanticipated affordances, the capacity to generate individualized test
    questions enables much more than combating traditional cheating during an exam
    (i.e. students looking over each other’s shoulders); it also enables a multitude
    of new testing modalities that have been shown to lead to positive student outcomes
    such as:


    +   **Asynchronous Testing:** By making it that each test is unique to a student,
    there is no need to protect the integrity of the test by ensuring all students
    take the test at the same time; instead, instructors are able to define a time
    window during which students can schedule their own test at the testing facility.
    This added flexibility enables students to take tests at whatever time works best
    for their schedules. More significantly, however, this makes it so that instructional
    time does not need to be sacrificed when any test is administered.


    +   **Multiple Testing Attempts:** Given that each test is unique, students can
    be allowed to take the test multiple times, with each attempt generating a new
    batch of questions. This allows students to learn from their mistakes on the initial
    test and improve their understanding before reattempting and has been shown to
    greatly reduce the stress associated with tests.


    +   **Increasing Testing Frequency:** Given that tests no longer get away at instructional
    time, instructors can schedule smaller tests throughout the semester rather than
    midterm and final as is conventional. By testing more often, students have more
    regular feedback about what they know and what they are struggling with, reducing
    the chance that they will have significant knowledge gaps by the end of the course.
    Furthermore, smaller, more frequent tests can be less anxiety-inducing than handling
    of high-stakes assessments.


    +   **Mastery Learning:** Building on the idea of multiple testing attempts, instructors
    can set a grade threshold that students need to pass the course, with students
    given multiple opportunities to reach this mastery level. This approach encourages
    deeper understanding and learning, rather than rote memorization.


    # 8 New and Emerging Pedagogical Approaches


    Traditional pedagogical approaches, especially in introductory courses, have focused
