    # 7.1 Detecting Unauthorized Use


    Perhaps the most commonly used tool to detect plagiarism in computing education
    is MOSS (Measure of Software Similarity). Developed in 1994 by Alex Aiken (n.d.),
    MOSS is a tool that compares multiple subsubmissions to identify similarities
    between pairs of programs. Unlike a text comparison, MOSS uses a technique winning,
    which generates fingerprints of the code by analyzing overlapping chunks of text
    (called kgrams) and selecting key features for comparison. This method allows
    Moss to detect similarities even when variable and function names have been changed
    or comments have been rewritten, which are common techniques students use to obscure
    plagiarism. By focusing on the structure and logic of the code rather MOSS provides
    a robust way to identify unauthorized reuse of code.


    A more recent detector, Algae, was created for detecting cheating in the previously
    described study (Pierce and Zilles 2017). It has several different detectors that
    separately detect common cheating patterns. Each detector forms a set of transforms
    to remove superficial differences from code and hash the result using SHA-256
    to generate a single number for each file. Any two files with the same name are
    considered identical.


    +   - Near-Identical (Lazy) This performs a simpler method than MOSS. It converts
    all to uppercase and removes all comments, whitespace, and some extraneous punctuation.'
