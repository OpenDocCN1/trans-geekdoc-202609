    in programming courses—tracing, EiPE, Parsons Problems,

    and coding (code writing). Currently, tracing, EiPE, and coding questions are
    commonly used for quizzes and exams, whereas Parsons Problems and coding are primarily
    used as homework exercises. In each case, writing code from scratch is often to
