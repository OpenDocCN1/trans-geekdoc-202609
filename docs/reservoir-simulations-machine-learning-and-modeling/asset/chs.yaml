  \ \\mathbf{v}.$ (5.133)\n\n![image](img/F000058si539.png)(5.133)\n\n我们还定义\n\n$\\\
  mathbf{Q}^{(0)} = \\sum\\limits_{i}f_{i}^{\\text{eq}}\\mathbf{e}_{i} \\otimes \\\
