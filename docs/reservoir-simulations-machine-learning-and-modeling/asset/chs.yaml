  | --- | --- | --- | --- |\n| C[1] | 0.0115 | 190.6 | 46 |\n\n\n\n\n| C[2] || 0.0908\
  \ || 305.4 || 48.84 |\n| C[3] || 0.1454 || 369.8 || 42.46 |\n| C[4] || 0.1886 ||\
  \ 421.09 || 37.69 |\n| C[5] || 0.2257 || 467.85 || 34.24 |\n| C[6] || 0.2564 ||\
