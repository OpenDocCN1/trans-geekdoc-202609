  \ \\right)}{\\partial n\\_{i}^{L}\\\\partial n\\_{j}^{L}}\\\\frac{1}{V^{L}} \\\\\
  \\\\ \\\\end{matrix}$ (3.76)\n\n![image](img/F000034si336.png)(3.76)\n\n由于 `f`^(convex)![image](img/F000034si337.png)\
  \ 的凸性，利用正定矩阵的性质，我们可以得出 `F`[`c]`![image](img/F000034si338.png) 关于 `N`^(*G*)![image](img/F000034si339.png)\
