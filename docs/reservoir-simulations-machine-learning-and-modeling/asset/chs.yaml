  | 临界物性 | `T`[`c`], `p`[`c`], `v`[`c`], `Z`[`c]`![image](img/F000034si20.png) |\n\
  | 正常沸点 | `T`[`b]`![image](img/F000034si21.png) |\n| 偏心因子 | `ω`![image](img/F000034si22.png)\
