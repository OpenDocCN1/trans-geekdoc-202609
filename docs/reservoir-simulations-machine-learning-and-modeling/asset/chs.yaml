  _{V}^{L}V^{t}}{C\\_{V}^{L}p\\_{G}^{k} + C\\_{V}^{G}p\\_{L}^{k}}\\\\left( {p\\_{G}^{k\
  \ + (1/2)}-p\\_{L}^{k + (1/2)}-p\\_{c}^{k + (1/2)}} \\\\right)^{2}} \\\\\\\\ {leq\
  \ 0.} \\\\end{matrix}$ (3.92)\n\n![image](img/F000034si389.png)(3.92)\n\n从等式 (3.92)\
  \ 很容易看出，熵随时间步增加直到达到最大值。当熵达到最大值时，系统达到平衡态。这意味着所提格式遵循热力学第二定律，具有热力学稳定性（熵稳定性）。\n\n###\
  \ 3.2.6 相分析\n\n所提动力学需要合适的初始条件。为了确定初始条件，我们需要进行相分析。相分析的目标是确定在指定的摩尔量、体积和温度下，流体是保持单相还是分裂为多相。\n\
  \n在单相变为两相的情况下，总熵的变化`Δ**S`![image](img/F000034si390.png) 根据热力学第二定律应该是正的。同样，熵的变化可以分为两部分：系统的变化`Δ**S`![image](img/F000034si391.png)\
  \ 和环境的变化`Δ**S`![image](img/F000034si392.png)，后者可以通过以下公式计算：\n\n$\\\\begin{matrix}\
  \ {\\\\Delta S_{env} = -\\\\frac{\\\\Delta\\\\mathit{Q}}{T}.} & & \\\\end{matrix}$\
  \ (3.93)\n\n![image](img/F000034si393.png)(3.93)\n\n从热力学第一定律可以得出：\n\n$\\\\begin{matrix}\
  \ {\\\\Delta U = \\\\Delta\\\\mathit{Q} + \\\\Delta W.} & & \\\\end{matrix}$ (3.94)\n\
  \n![image](img/F000034si394.png)(3.94)\n\n这可以很容易以另一种形式表示为：\n\n$\\\\begin{matrix}\
  \ {\\\\Delta\\\\mathit{Q} = \\\\Delta F + T\\\\Delta S_{sys} + p_{c}\\\\Delta V^{G},}\
  \ & & \\\\end{matrix}$ (3.95)\n\n![image](img/F000034si395.png)(3.95)\n\n总熵的变化可以推导为：\n\
  \n$\\\\begin{matrix} {\\\\Delta S = \\\\Delta S_{sys}-\\\\frac{1}{T}\\\\Delta\\\\\
  mathit{Q} = -\\\\frac{1}{T}\\\\Delta F-\\\\\\frac{p_{c}}{T}\\\\Delta V^{G}.} & &\
  \ \\\\end{matrix}$ (3.96)\n\n![image](img/F000034si396.png)(3.96)\n\n如果假设混合物为气体，则试验相为液体。在这种情况下，取\
  \ `V` = `V`[`L`]` > 0![image](img/F000034si397.png) 和 `**N**` = `**N**[`L`]` > 0（此处原文符号有误），总亥姆霍兹自由能的变化可以表示为：\n\
  \n$\\\\begin{matrix} {\\\\Delta F = F\\\\left( {V^{L},T,\\\\mathbf{N}^{L}} \\\\\
  right) + F\\\\left( {V^{t}-V^{L},T,\\\\mathbf{N}^{t}-\\\\mathbf{N}^{L}} \\\\right)-F\\\
  \\left( {V^{t},T,\\\\mathbf{N}^{t}} \\\\right)} \\\\\\\\ {= \\\\sum\\\\limits\\\
  _{i = 1}^{M}{\\\\left( {\\\\mu\\_{i}\\\\left( {V^{L},T,\\\\mathbf{N}^{L}} \\\\right)-\\\
  \\mu\\_{i}\\\\left( {V^{t},T,\\\\mathbf{N}^{t}} \\\\right)} \\\\right)N\\_{i}^{L}}}\
  \ \\\\\\\\ {-\\\\left( {p\\\\left( {V^{L},T,\\\\mathbf{N}^{L}} \\\\right)-p\\\\\
  left( {V^{t},T,\\\\mathbf{N}^{t}} \\\\right)} \\\\right)V^{L} + R_{1}\\\\left( {V^{L},T,\\\
  \\mathbf{N}^{L}} \\\\right),} \\\\\\\\ \\\\end{matrix}$ (3.97)\n\n![image](img/F000034si399.png)(3.97)\n\
  \n其中压力 `p`![image](img/F000034si400.png) 和化学势 `μ``i`![image 被视为体积、温度的函数，而 `R_1`![image](img/F000034si402.png)\
  \ 代表一阶项后的泰勒展开余项。如果假设混合物为液体，则试验相为气体。在这种情况下，取 `V` = `V`[`G`]` > 0![image](img/F000034si403.png)\
  \ 和 `**N**` = `**N**[`G`]` > 0![image](img/F000034si404.png)，总亥姆霍兹自由能的变化相似推导为：\n\
