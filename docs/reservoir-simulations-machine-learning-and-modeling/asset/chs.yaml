  \ method*. 1977.\n\n# 第五章 多尺度与介观油藏模拟的进展\n\n## 摘要\n物理现象可以在不同的复杂程度和尺度上进行建模。多尺度建模和计算为这类现象的数学和计算模型提供了一个框架，通过基于基本原理和数学理论的模型之间的联系。近期，介观算法被提出并在石油工业得到广泛接受，其中格子玻兹曼方法（`LBM`）是最著名的。“介观”一词用于描述与特定克努森数相关的流动性质，以及捕捉宏观现象和微观相互作用的能力。`LBM`\
  \ 被证明具有卓越的并行性，并且易于使用全显式方案实现。同时，广尺度有限元方法也通过使用某些尺度技术（如适当正交分解）得到了发展。在本章中，我们将从尺度技术的概念和属性开始，然后探讨在离散数值方法中的应用。多点通量法也是在方案中总结多尺度属性的一种选择。\n\
