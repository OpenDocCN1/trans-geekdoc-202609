  \ 和 `n`[`L]` k* (1/2)![image](img/F000034si354.png) 用于：\n```\n\\mathbf{n}^{G, \\\
  frac{1}{2}} = \\frac{\\mathbf{N}^{G}}{V^{G}}, \\mathbf{n}^{L, \\frac{1}{2}} = \\\
  frac{\\mathbf{N}^{L}}{V^{L}}.\n```\n![image](img/F000034si355.png)(3.78) 成分 `i`![image](img/F000034si356.png)\
  \ (`i` =,...,*)![image](img/F000034si357.png) 的摩尔时间离散方程表示为：\n\n```\n\\begin{matrix}\
  \ \\frac{N_{i}^{G, 1}-N_{i}^{G,k}}{\\delta t_{k}} & & \\frac{D_{i}N_{i}^{t}}{RT}}\\\
  left( \\mu_{i}^{L, (1/2)}-\\mu_{i}^{G, (1/2)} \\right), \\\\ \\end{matrix}\n```\n\
  (3.79) ![image](img/F000034si358.png)(3.79) 其中 `μ`[`G]` k* (1/2)) = `μ`[`i]`^(convex(`n`[`G]` k* (1/2))) + `μ`[`i]`^(concave(`n`[`G]` k* (1/2))))![image](img/F000034si360.png)\
  \ 这是一个非线性方程，其未知数是 `k`+1*th*![image](img/F000034si361.png) 时间步的所有组气态摩尔 `N`[`G]` k* (1+1)![image](img/F000034si362.png)，但该系统独立于\
