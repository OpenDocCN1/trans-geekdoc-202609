  \ 有限元法：一般陈述\n我们考虑一个二维稳态问题：\n\n$-\\Delta p = f, i \\in \\Omega$,\n\n![image](img/F000046si1.png)\n\
  \n$p = 0, \\text{on } \\Gamma$,\n\n![image](img/F000046si2.png)(4.1)\n\n其中 $\\Omega$![image](img/F000046si3.png)\
  \ 是具有边界 $\\Gamma$![image](img/F000046si4.png) 的平面有界区域，$f$![image](img/F000046si5.png)\
  \ 是 $\\Omega$ 上![image](img/F000046si6.png) 分段连续的实函数，拉普拉斯算子 $\\Delta$![image](img/F000046si7.png)\
  \ 定义为：\n$\\Delta p = \\frac{\\partial² p}{\\partial x_1²} + \\frac{\\partial² p}{\\\
  partial x_2²}.$ (4.2)\n\n![image](img/F000046si8.png)(4.2)\n这是一个在边界固定并受到强度为 $f$![image](img/F000046si9.png)\
  \ 横载的弹性膜。\n我们定义线性空间：\n$V = \\{v : \\text{在 } \\Omega \\text{ 上连续},\\frac{\\partial\
  \ v}{\\partial x_1} \\text{ 和 } \\frac{\\partial v}{\\partial x_2} \\text{ 在 } \\\
  Omega \\text{ 上分段连续且在 } \\Gamma \\text{ 上 } v=0\\}.$ (4.3)\n\n![image](img/F000046si10.png)(4.3)\n\
  \n让我们回顾 Green 公式。对于向量值函数 $b = (b_1, b_2)$![image](img/F000046si11.png)，散度定理为：\n\
  $\\int_{\\Omega} \\nabla \\cdot b = \\int_{\\Gamma} b \\cdot n$ (4.4)\n\n![image](img/F000046si12.png)(4.4)\n\
  使用 Green 公式：\n$\\int_{\\Omega} \\Delta v dx = \\int_{\\Gamma} \\frac{\\partial v}{\\\
  partial n} dx - \\int_{\\Omega} \\nabla v \\cdot \\nabla v,$ (4.5)\n\n![image](img/F000046si13.png)(4.5)\n\
  其中法向导数由 $\\frac{\\partial v}{\\partial n} = \\frac{\\partial v}{\\partial x_1} n_1\
  \ + \\frac{\\partial v}{\\partial x_2} n_2.$![image](img/F000046si14.png)\n\n我们引入符号：\n\
  $a(p, v) = \\int_{\\Omega} \\nabla p \\cdot \\nabla v, L(v) = a(f, v) = \\int_{\\\
  Omega} f v dx.$ (4.6)\n\n![image](img/F000046si15.png)(4.6)\n\n形式 $a(\\cdot, \\\
  cdot)$![image](img/F000046si16.png) 称为 $V \\times V$ 上的双线性形式![image](img/F000046si17.png)。我们还定义泛函\
  \ $F^*: V \\to \\mathbb{R}$![image](img/F000046si18.png) 为\n$F(v) = \\frac{1}{2}a(v,\
  \ v) - L(v), v \\in V.$ (4.7)\n\n![image](img/F000046si19.png)(4.7)\nPDE（偏微分方程）可以表述为最小化问题：\n\
  寻找 $p \\in V$ 使得 $F(p) \\le F(v), \\forall v \\in V.$ (4.8)\n\n![image](img/F000046si20.png)(4.8)\n\
  将 PDE 乘以 $v \\in V$![image](img/F000046si21.png) 并在 $\\Omega$ 上积分![image](img/F000046si22.png)，我们看到：\n\
  $-\\int_{\\Omega} \\Delta p v dx = \\int_{\\Omega} f v dx.$ (4.9)\n\n![image](img/F000046si23.png)(4.9)\n\
  对该方程应用 Green 公式并使用齐次边界条件，得到：\n$\\int_{\\Omega} \\nabla p \\cdot \\nabla v dx = \\\
  int_{\\Omega} f v dx, \\forall v \\in V.$ (10)\n\n![image](img/F000046si24.png)(10)\n\
  因此我们得到了 Galerkin 变分形式：\n寻找 $p \\in V$ 使得 $a(p, v) = L(v), \\forall v \\in V.$ (11)\n\
  \n![image](img/F000046si25.png)(11)\n我们现在构造有限元法 (FEM)\n$\\text{diam}(K_h) = \\{\\\
  text{\\overline{K} \\text{ 的最长边}\\} = \\max_{K \\in K_h} \\text{diam}(K).$ (12)\n\
  \n![image](img/F000046si32.png)(12)\n且有限元空间可以定义为\n$V_h = \\{v : \\text{在 } \\Omega\
  \ \\text{ 上连续}, v \\text{ 在每个三角形 } K \\text{ 上是线性的且在 } \\Gamma \\text{ 上 } v=0\\\
  }.$ (13)\n\n![image](img/F000046si33.png)(13)\n注意 $V_h \\subset V$![image](img/F000046si34.png)。PDE\
  \ 的表述为：\n寻找 $p_h \\in V_h$ 使得 $a(p_h, v) = L(v), \\forall v \\in V.$ (14)\n\n![image](img/F000046si35.png)(14)\n\
  可以检查上述有限元表述等价于一个离散最小化问题：\n寻找 $p_h \\in V_h$ 使得 $F(p_h) \\le F(v), \\forall v \\\
  in V_h.$ (15)\n\n![image](img/F000046si36.png)(15)\n这也被称为 Ritz FEM。将三角形 $K_h$ 中的顶点（节点）![image](img/F000046si37.png)\
  \ 记为 $x_1, x_2, \\dots, x_N$。$V_h$ 中的基函数 $\\phi_i$![image](img/F000046si41.png)，$i\
  \ = 1, 2, \\dots, N$ 定义为：\n$\\phi_i(x_j) = 1 \\text{ 若 } i = j, \\phi_i(x_j) = 0\
  \ \\text{ 若 } i \\neq j.$ (4.16)\n\n![image](img/F000046si44.png)(4.16)\n$\\phi_i$\
  \ 的支撑![image](img/F000046si45.png)，即 $x$![image](img/F000046si46.png) 使得 $\\phi_i(x)\
  \ \\neq 0$ 的集合包含公共节点 $x_i$ 的三角形![image](img/F000046si48.png)，且函数 $\\phi_i$![image](img/F000046si49.png)\
  \ 也称为帽形函数或 chapeau 函数。\n令 $N$![image](img/F000046si50.png) 为 $K_h$ 中内部顶点的数量。任何函数\
  \ $v \\in V_h$![image](img/F000046si51.png) 都有唯一的表示：\n$v(x) = \\sum_{i=1}^{N} v_i\
  \ \\phi_i(x), x \\in \\Omega,$ (4.17)\n\n![image](img/F000046si53.png)(4.17)\n\n\
  \n\n\n\n其中 `v[i]` = `v(x[i])`![image](img/F000046si54.png) 由于边界条件，我们排除了 `Ω` 边界上的顶点![image](img/F000046si55.png)。\n\
  \nGalerkin 方程可以写成矩阵形式 `Ap = f`![image](img/F000046si56.png)，其中刚度矩阵 `A`![image](img/F000046si57.png)\
  \ 和向量 `p`![image](img/F000046si58.png) 和 `f`![image](img/F000046si59.png) 由如下给出：\n\
  \n`A = (a[ij])`, `p = (p[j])`, `f = (f[j])`, (4.18)\n\n![image](img/F000046si60.png)(4.18)\
  \ \n\n可以检查出刚度矩阵 `A`![image](img/F000046si61.png) 是对称正定的。特别是，它是奇异的。因此，有限元方法（FEM）有唯一解。此外，注意由于基函数的构造，`A`![image](img/F000046si62.png)\
