  \ \\\\mathbf{v} = 0,} & {in} & \\\\Omega \\\\ \\\\end{matrix}$ (2.70b)\n\n![image](img/F000022si214.png)(2.70b)\n\
  \n$\\begin{matrix} {\\\\frac{\\\\partial\\\\phi}{\\\\partial t} + \\\\mathbf{v}\
  \ \\\\cdot \\\\nabla\\\\phi = L_{d}\\\\nabla^{2}\\\\mu,} & {in} & \\\\Omega \\\\\
  \ \\\\end{matrix}$ (2.70c)\n\n![image](img/F000022si215.png)(2.70c)\n\n$\\begin{matrix}\
  \ {\\\\mu = \\\\frac{1}{\\\\mathit{\\epsilon}}\\\\left( {\\\\phi^{3} - \\\\phi \\\
  \\right) - \\\\mathit{\\epsilon}\\\\nabla^{2}\\\\phi,} & {in} & \\\\Omega \\\\ \\\
  \\end{matrix}$ (2.70d)\n\n![image](img/F000022si216.png)(2.70d)\n\n其中 `ϵ`![image](img/F000022si217.png)\
  \ 是界面厚度 `ζ`![image](img/F000022si218.png) 与参考长度 `L0`![image](img/F000022si219.png)\
  \ 的比例。\n\n缩放后，沿固体滑移边界的边界条件变为：\n\n$\\begin{matrix} {\\\\nu\\\\_{\\\\tau}^{slip}/L_{S}}\
  \ = - \\\\eta\\\\left( {\\\\partial\\\\_{n}\\\\nu\\\\_{\\\\tau} + \\\\partial\\\\\
  _{\\\\tau}\\\\nu\\\\_{n}} \\\\right) + \\\\lambda\\\\left( \\\\phi \\\\right)\\\\\
  partial\\\\_{\\\\tau}\\\\phi,} & \\\\begin{matrix} {on} & \\\\Gamma\\\\_{slip} \\\
  \\\\\\ \\\\end{matrix} \\\\ \\\\end{matrix}$ (2.71a)\n\n![image](img/F000022si220.png)(2.71a)\n\
  \n$\\begin{matrix} {\\\\frac{\\\\partial\\\\phi}{\\\\partial t} + u_{\\\\tau}\\\\\
  partial\\\\_{\\\\tau}\\\\phi = - V_{S}L\\\\left( \\\\phi \\\\right),} & \\\\begin{matrix}\
  \ {on} & \\\\Gamma\\\\_{slip} \\\\\\\\ \\\\end{matrix} \\\\ \\\\end{matrix}$ (2.71b)\n\
  \n![image](img/F000022si221.png)(2.71b)\n\n$\\begin{matrix} {\\\\nu\\\\_{n} = 0,}\
  \ & {\\\\partial\\\\_{n}\\\\mu = 0,} \\\\\\\\ \\\\end{matrix}\\\\begin{matrix} \\\
  \\\\\\ \\\\end{matrix}\\\\begin{matrix} {on} & \\\\Gamma\\\\_{slip} \\\\\\\\ \\\\\
  end{matrix}$ (2.71c)\n\n![image](img/F000022si222.png)(2.71c)\n\n其中 $L(\\phi) =\
  \ \\mathit{\\epsilon}\\partial_{n}\\phi - \\left( {\\\\sqrt{2}/6} \\right)\\pi\\\
  cos\\theta_{s}\\cos\\left( {\\\\left( \\\\pi/2} \\\\right)\\\\phi} \\right)$![image](img/F000022si223.png)。\n\
  \n上述方程涉及以下六个无量纲参数：\n\n$L_{d}: := \\frac{3M\\gamma}{2\\sqrt{2}VL_{0}^{2}}, R: = \\\
  frac{\\rho VL_{0}}{\\eta},\\\\lambda: = \\frac{3\\gamma}{2\\sqrt{2}\\eta V}, V_{s}:\
  \ = \\frac{c_{I}\\Gamma}{V}, L_{S}: = \\frac{\\eta}{\\beta L_{0}},\\mathit{\\epsilon}:\
  \ = \\frac{\\zeta}{L_{0}}$ (2.72)\n\n![image](img/F000022si224.png)(2.72)\n\n其中\
  \ `R` 是著名的雷诺数，流体内部惯性力和粘性力的之比。该参数与毛细数 `Ca` 成反比![image](img/F000022si225.png)。\n\n\
  ## 2.3 动态范德华理论\n\n### 2.3.1 动机\n\n在大多数相变理论中，温度 *T* 是一个给定的参数，与空间无关，且假设 *T* 的波动很小，可以忽略。例如，金斯堡-兰道理论基于均匀温度\
  \ *T* 的自由能泛函。然而，存在相变发生在不均匀温度的情况。例如，气液临界点润润性质对热流非常敏感；沸过程和液滴运动受热流的影响很大。为了考虑温度非均匀分布的影响，\n\
  \n### 2.3.2 动态范德华理论的引入\n\n范德华理论对单组分流体的气液相变进行了简要描述，它是具有长程吸引相互作用的硬球的平均场理论。在 1893 年的一篇开创性论文中，范德华在亥姆霍兹自由能密度中引入了一项来描述气液界面。这种梯度项开始在非均匀态统计力学中被广泛采用。在本部分中，我们将首先回顾范德华理论的基本概念，然后引入御野提出的梯度理论和平衡条件。\n\
  \n#### 2.3.2.1 范德华理论\n\n对于单原子分子，亥姆霍兹自由密度 $f(n,T)$![image](img/F000022si226.png)\
  \ 可以写成温度 *T* 和数密度 *n* 的函数，\n\n\n\n\n\n`f` = `k[B]T^n[ln(λ[th]^(d)n)−1−ln(1−v[0]n)]`\
  \ − `ϵv[0]n²` (2.73)\n\n![image](img/F000022si227.png)(2.73) \n\n其中 `v[0]`![image](img/F000022si228.png)\
  \ 是分子体积，`v[0]` = `a^(d)`![image](img/F000022si229.png)，具有分子半径 `a` 和空间维度 `d`![image](img/F000022si230.png);`ϵ`![image](img/F000022si231.png)\
  \ 是引势能的大小；`k[B]` 是玻尔兹曼系数；`λ[th]`![image](img/F000022si232.png) 是热德布罗意长度，`λ[th]`\
  \ = `h*(2*π/*mT)^(1/2)`![image](img/F000022si233.png)，`m`![image](img/F000022si234.png)\
  \ 是分子质量。\n\n作为 `n` 和 `T` 的函数，内能密度 `e`、每个粒子的熵 `s` 和压力 `p` 分别计算为：\n\n`e` = `dnk[B]T*/2−ϵv[0]n²`\
  \ (2.74)\n\n![image](img/F000022si235.png)(2.74) \n\n`s` = − `k[B]ln[λ[th]^(d)n]/(1−v[0]n)]`\
  \ + `kB/2` (2.75)\n\n![image](img/F000022si236.png)(2.75) \n\n`p` = `nk[B]T*/1−v[0]n)−ϵv[0]n²`\
  \ (2.76)\n\n![image](img/F000022si237.png)(2.76) \n\n范德华尔引入了梯度自由能密度：\n\n$f_{gra}\
  \ = \\frac{1}{2}M\\left| {\\\\nabla n} \\right|^{2}$ (2.77)\n\n![image](img/F000022si238.png)(2.77)\
  \ \n\n考虑沿 `x` 轴变化的平衡界面密度分布 `n` = `n(x)`![image](img/F000022si239.png)，每个粒子的化学势 `μ(n,T)`\
  \ = `(∂f/∂n)[T]`![image](img/F000022si240.png) 变化如下：\n\n$\\mu - \\mu_{cx} = \\frac{M}{2}\\\
  frac{d^{2}n}{dx^{2}} + \\frac{d}{dx}\\frac{M}{2}\\frac{dn}{dx}$ (2.78)\n\n![image](img/F000022si241.png)(2.78)\
  \ \n\n其中 `μ[cx]`![image](img/F000022si242.png) 是共存曲线上的化学势。\n\n由于在恒定 `T` 下有 `dp =\
  \ ndμ`![image](img/F000022si243.png)，等式 (2.76) 中的范德华尔压力可以表示为：\n\n$p - p_{cx} = \\\
  frac{M}{2}n\\frac{d^{2}n}{dx^{2}} + \\frac{d}{dx}\\frac{M}{2}n\\frac{dn}{dx} - M\\\
  left( \\frac{dn}{dx} \\right)^{2}$ (2.79)\n\n![image](img/F000022si244.png)(2.79)\
  \ \n\n其中 `p[cx]`![image](img/F000022si245.png) 是共存曲线上的化学势。\n\n表面张力 `γ(T)`![image](img/F000022si246.png)\
  \ 值为：\n\n$\\gamma = {\\\\int\\_{- \\\\infty}^{+ \\\\infty}{dxM\\left( \\frac{dn}{dx}\
  \ \\right)}}^{2}$ (2.80)\n\n![image](img/F000022si247.png)(2.80) \n\n在等式 (2.77)–(2.80)\
  \ 中，`M` 是平衡态下定义的亥姆霍兹自由能中梯度项的系数，定义为 `M=CT+K`。取决于密度梯度的毛细压力张量 `C` 包含了总压力张量。梯度项代表密度非均匀性对压力张量的贡献，解释了形成和维持密度非均匀性所需的能量。\n\
  \n### 2.3.2 梯度理论\n\n范德华尔理论中熵和内能的梯度贡献通过下式计算：\n\n$S_{b} = \\int{d\\mathbf{r}}\\left\
  \ [{ns\\left( {n,e} \\right) - \\frac{1}{2}C\\left| {\\nabla n} \\right|^{2}}\\\
  right]$ (2.81)\n\n![image](img/F000022si248.png)(2.81)\n\n$\\varepsilon_{b} = \\\
  int_{d\\mathbf{r}}\\left [{e + \\frac{1}{2}K\\left| {\\nabla n} \\right|^{2}}\\\
  right]$ (2.82)\n\n![image](img/F000022si249.png)(2.82)\n\n其中系数 `K` 和 `C` 通常设置为 `K=0`\
  \ 且 `C` 与 `n` 无关，但为了构建通用理论，`C` 和 `K` 可以表示为 `n` 的函数，`C=C(n)`![image](img/F000022si250.png),\
  \ `K=K(n)`![image](img/F000022si251.png)。\n\n从等式 (2.81) 和 (2.82)，熵密度和内能密度可以表示为：\n\
  \n$\\widehat{S} = ns - \\frac{1}{2}C\\left| {\\nabla n} \\right|^{2}$ (2.83)\n\n\
  ![image](img/F000022si252.png)(2.83)\n\n$\\widehat{e} = e + \\frac{1}{2}K\\left|\
  \ {\\nabla n} \\right|^{2}$ (2.84)\n\n![image](img/F000022si253.png)(2.84)\n\n其中梯度项分别代表由于\
  \ `n` 的不均匀性导致的熵减少和能量增加。它们在界面处很重要。注意这里忽略了重力能量。将局部温度 `T(n,e)`![image](img/F000022si254.png)\
  \ 定义如下：\n\n$\\frac{1}{T} = \\left( {\\\\frac{\\delta S_{b}}{\\delta e}}\\right)_{n}\
  \ = n\\left( \\frac{\\partial s}{\\partial e} \\right)_{n}$ (2.85)\n\n![image](img/F000022si255.png)(2.85)\n\
  \n其中导数时 `n` 是固定的。这种 `T` 的定义类似于微正则系综，甚至可以用于非平衡态的 `n` 和 `e` 情况。\n\n同样定义广义化学势：\n\n\
  $\\widehat{\\mu} = - T\\left( \\frac{\\delta S_{b}}{\\delta n} \\right)_{\\widehat{e}}\
  \ = \\mu - T\\nabla \\cdot \\frac{M}{T}\\nabla n + \\frac{M'}{2}\\left| {\\nabla\
  \ n} \\right|^{2}$ (2.86)\n\n![image](img/F000022si256.png)(2.86) \n\n其中内能密度 `widehat{e}`![image](img/F000022si257.png)\
  \ 是固定的，我们在泛变导中设置 `δe=−δ(K|n|2)`；`μ=(e+p)/n`![image](img/F000022si259.png) 是通常每个粒子的化学势。\n\
  \n假设 `Sb`![image](img/F000022si260.png) 是 `widehat{e}`![image](img/F000022si261.png)\
  \ 和 `n` 的函数，`widehat{e}`![image](img/F000022si262.png) 和 `n` 的微小变化将产生 `Sb`![image](img/F000022si263.png)\
  \ 的增量变化：\n\n$\\delta S_{b} = \\int{d\\mathbf{r}}\\left( {\\frac{1}{T}\\delta\\widehat{e}\
  \ - \\frac{\\widehat{\\mu}}{T}\\delta n} \\right) - \\int da\\frac{M}{T}\\left(\
  \ {\\\\mathbf{\\nu} \\cdot \\nabla n} \\right)\\delta n$ (2.87)\n\n![image](img/F000022si264.png)(2.87)\
  \ \n\n其中第二项是表面积分，`da` 是面积元，而 `ν`![image](img/F000022si265.png) 是表面的法单位向量。\n\n在平衡态下，我们在固定的粒子数\
  \ `N`![image](img/F000022si266.png) 和固定的能量 `\\varepsilon_b = \\intd*r*n`![image](img/F000022si267.png)\
  \ 下最大化 `Sb`![image](img/F000022si268.png)，对于限制在单元内的流体，引入：\n\n$W = \\frac{S_{b}}{k_{B}}\
  \ + \\mathbf{\\upsilon}N - \\beta\\varepsilon_{b}$ (2.88)\n\n![image](img/F000022si269.png)(2.88)\
  \ \n\n其中 `υ` 和 `β` 是拉朗日乘子。\n\n在金堡-理论中，对 `n` 进一步最小化 `W` 得到：\n\n`widehat{μ}=k[B]T*ν=const`\
  \ (2.89)\n\n![image](img/F000022si271.png)(2.89) \n\n其中 `widehat{μ}`![image](img/F000022si272.png)\
  \ 由等式 (2.86) 定义。在热力学极限下 `W=p*V/k[B]T`![image](img/F000022si273.png)，其中 `p` 是压力，`V`\
  \ 是流体的总体积。\n\n基于范德华压力的应力量可以表示为：\n\n$\\prod_{ij} = p\\delta_{ij} - CT\\left\\lbrack\
  \ {n\\nabla^{2}n + \\frac{\\left( {\\\\nabla n} \\right)^{2}}{2}}\\right\\rbrack\\\
  delta_{ij} + CT\\nabla_{i}n\\nabla_{j}n$ (2.90)\n\n![image](img/F000022si274.png)(2.90)\
  \  \n\n### 2.3.3 广义流体力学方程\n\n广义流体力学方程由...开发\n\n质量密度 `ρ = m*n`![image](img/F000022si275.png)\
  \ (`m` 是粒子质量）遵循以下连续方程：\n\n\n\n\n\n$\\frac{\\partial\\rho}{\\partial t} = - \\nabla\
  \ \\cdot \\left( {\\rho\\mathbf{\\nu}} \\right)$ (2.91)\n\n![image](img/F000022si276.png)(2.91)\
