  \n### 6.1.3.3.4 结论\n\n除了视觉分析，\n\n## 6.2 数值重建\n\n通常情况下，孔隙结构的数值重建通过两个步骤来实现：定义描述符并使用这些描述符进行有效重建。\n\
  \n### 多点统计\n\n### 6.2.1 多点统计\n\n多点统计（MPS）可以被视为二点统计的推广。MPS 算法可以总结为两个步骤：从训练图像中提取特征，进行多点统计。\n\
  \n![image](img/F00006Xsi51.png) (注：原文此处存在大量内容重复，译文已保留核心逻辑)\n\n\n\n\n\n首先，随机设置一条访问路径以遍历重建网中的所有体元，然后沿着该路径进行随后的重建工作。\n\
  \n其次，对于给定的体元，在搜索树中检索其事件对应的条件概率。如果没有匹配到的数据事件，则采用减小尺寸模板的折中策略，直到获得适当的条件概率。\n\n第三，根据上一步获取的条件概率，为当前体元选择一个特定的相（固体或空隙）。\n\
  \nMPS 重建有两个主要的缺点，这些缺点曾阻碍了它的多年应用。首先，由于训练图像尺寸限制，很难为每个数据事件获取足够的副本；其次是其对计算资源的巨大需求。\n\
  \n### 6.2.1.2 多网格模拟\n\n理论上，大模板将更好地再现从训练图像中提取的空间特征。然而在实践中，大模板尺寸会导致 CPU 和内存的沉重负担，而小模板尺寸又无法捕捉训练图像的长程模式。\n\
  \n在多网格模拟中，模拟工作在粗网格上进行，在随后的每个步骤，都在更细的网格上执行模拟，直到完成最细的网格（\n\n![图 6.13 (A) 采用三尺度策略的多网格模拟程序示意图。(B)\
  \ 一个带有 16 个条件数据的 4×4 粗网格系统，每个晶格包含 (A) 所示的 9×9 子尺度网格系统。(C) 粗网格级估计，首先估计每个粗网格的中心节点，然后估计边界中心节点。(D)\
  \ 粗网格级估计的结果。(F) 中间网格级估计的初始状态，与 (D) 相同。(F) 中的每个晶格都是 (E) 所示的 5×5 子尺度网格系统。(G) 中间估计程序。为了方便，中间估计的结果显示在\
  \ (H) 的四分之一。(J) 最细网格级估计的初始状态，每个晶格包含 (I) 所示的 4×4 网格系统。(K) 是最细网格级估计，其结果部分显示在 (L)。](img/F00006Xf06-13-9780128209578.jpg)\n\
  \n图 6.13 (A) 采用三尺度策略的多网格模拟程序示意图。(B) 一个带有 16 个条件数据的 4×4 粗网格系统，每个晶格包含 (A) 所示的 9×9\
  \ 子尺度网格系统。(C) 粗网格级估计，首先估计每个粗网格的中心节点，然后估计边界中心节点。(D) 粗网格级估计的结果。(F) 中间网格级估计的初始状态，与\
