  mathit{ij}}\\\\nabla n\\_{i} \\\\otimes \\\\nabla n\\_{j}} \\\\right),$ (3.243)\n\
  \n![image](img/F000034si786.png) (3.243)\n\n我们可以将亥姆霍兹自由能方程改写为：\n\n$\\\\frac{\\partial\
  \ f}{\\partial t} + \\nabla \\\\cdot \\\\left( {f\\\\mathbf{u}} \\\\right) = -p\\\
  \\nabla \\\\cdot \\\\mathbf{u}-\\\\sum\\\\limits\\\\_{\\_{i} = 1}^{M}\\\\mu\\_{i}\\\
  \\nabla \\\\cdot \\\\mathbf{J}\\_{i} + \\\\mathbf{u} \\\\cdot \\\\left( {\\\\sum\\\
  \\limits\\\\_{\\_{i},j = 1}^{M}\\\\nabla \\\\cdot c\\_{\\mathit{ij}}\\\\left( {\\\
  \\nabla n\\_{i} \\\\otimes \\\\nabla n\\_{j}} \\\\right)} \\\\right)-\\\\sum\\\\\
  limits\\\\_{\\_{i},j = 1}^{M}\\\\nabla \\\\cdot \\\\left( {\\\\left( {\\\\nabla\
  \ \\\\cdot \\\\left( {\\\\mathbf{u}n\\_{j}} \\\\right) \\\\right)c\\_{\\mathit{ij}}\\\
  \\nabla n\\_{i}} \\\\right)-\\\\sum\\\\limits\\\\_{\\_{i},j = 1}^{M}\\\\nabla \\\
  \\cdot \\\\left( {\\\\left( {\\\\nabla \\\\cdot \\\\mathbf{J}\\_{j}} \\\\right)c\\\
  _{\\mathit{ij}}\\\\nabla n\\_{i}} \\\\right) = -p\\\\nabla \\\\cdot \\\\mathbf{u}\
  \ + \\\\nabla \\\\cdot \\\\left( {\\\\mathbf{u} \\\\cdot \\\\sum\\\\limits\\\\_{\\\
  _{i},j = 1}^{M}c\\_{\\mathit{ij}}\\\\left( {\\\\nabla n\\_{i} \\\\otimes \\\\nabla\
  \ n\\_{j}} \\\\right)} \\\\right)-\\\\sum\\\\limits\\\\_{\\_{i} = 1}^{M}\\\\nabla\
  \ \\\\cdot \\\\left( {\\\\mu\\_{i}\\\\mathbf{J}\\_{i}} \\\\right)-\\\\sum\\\\limits\\\
  \\_{\\_{i},j = 1}^{M}\\\\nabla \\\\cdot \\\\left( \\\\left( \\\\left( {\\\\nabla\
  \ \\\\cdot \\\\left( {\\\\mathbf{u}n\\_{j}} \\\\right)} \\\\right)c\\_{\\mathit{ij}}\\\
  \\nabla n\\_{i} \\\\right. \\\\right)-\\\\sum\\\\limits\\\\_{\\_{i},j = 1}^{M}\\\
  \\nabla \\\\cdot \\\\left( {\\\\nabla \\\\cdot \\\\mathbf{J}\\_{j}} \\\\right)c\\\
  _{\\mathit{ij}}\\\\nabla n\\_{i}} \\\\right)-\\\\left( {\\\\sum\\\\limits\\\\_{\\\
  _{i},j = 1}^{M}c\\_{\\mathit{ij}}\\\\left( {\\\\nabla n\\_{i} \\\\otimes \\\\nabla\
  \ n\\_{j}} \\\\right)} \\\\right):\\\\nabla\\\\mathbf{u} + \\\\sum\\\\limits\\\\\
  _{\\_{i} = 1}^{M}\\\\mathbf{J}\\_{i} \\\\cdot \\\\nabla\\\\mu\\_{i}.$ (3.244)\n\n\
  \n\n\n\n![image](img/F000034si787.png)(3.244)\n\n### 3.4.2 真实流体流动模型\n\n将方程 (3.244)\
  \ 代回方程 (3.237)，熵方程可以重新表述为\n\n$T\\\\left( {\\\\frac{\\\\partial s}{\\\\partial t}\
  \ + \\\\nabla \\\\cdot \\\\left( \\\\mathbf{u}s \\\\right)} \\\\right) = \\\\frac{1}{2}\\\
  \\sum\\\\limits\\\\_{i = 1}^{M}{M\\\\_{w,i}\\\\nabla \\\\cdot \\\\left( {\\\\left(\
  \ \\\\mathbf{u} \\\\cdot \\\\mathbf{u} \\\\right)\\\\mathbf{J}\\_{i}} \\\\right)}-\\\
  \\nabla \\\\cdot \\\\left( {\\\\mathbf{u} \\\\cdot \\\\sum\\\\limits\\\\_{i,j =\
  \ 1}^{M}{c\\\\_{\\\\mathit{ij}}\\\\left( {\\\\nabla n\\\\_{i} \\\\otimes \\\\nabla\
  \ n\\\\_{j}} \\\\right)}} \\\\right) + \\\\sum\\\\limits\\\\_{i = 1}^{M}{\\\\nabla\
  \ \\\\cdot \\\\left( {\\\\mu\\\\_{i}\\\\mathbf{J}\\_{i}} \\\\right)} + \\\\sum\\\
  \\limits\\\\_{i,j = 1}^{M}{\\\\nabla \\\\cdot \\\\left( {\\\\left( {\\\\nabla \\\
  \\cdot \\\\left( {\\\\mathbf{u}n\\\\_{j}} \\\\right)} \\\\right)c\\\\_{\\\\mathit{ij}}\\\
  \\nabla n\\\\_{i}} \\\\right)} + \\\\sum\\\\limits\\\\_{i,j = 1}^{M}{\\\\nabla \\\
  \\cdot \\\\left( {\\\\left( {\\\\nabla \\\\cdot \\\\mathbf{J}\\_{j}} \\\\right)c\\\
  \\_{\\\\mathit{ij}}\\\\nabla n\\\\_{i}} \\\\right)}-\\\\sum\\\\limits\\\\_{i = 1}^{M}{\\\
  \\mathbf{J}\\_{i} \\\\cdot \\\\nabla\\\\mu\\\\_{i}-\\\\mathbf{\\sigma}^{T}}:\\\\\
  nabla\\\\mathbf{u} + \\\\left( {p\\\\mathbf{I} + \\\\sum\\\\limits\\\\_{i,j = 1}^{M}{c\\\
  \\_{\\\\mathit{ij}}\\\\left( {\\\\nabla n\\\\_{i} \\\\otimes \\\\nabla n\\\\_{j}}\
  \ \\\\right)}} \\\\right):\\\\nabla\\\\mathbf{u}-\\\\mathbf{u} \\\\cdot \\\\left(\
  \ {\\\\rho\\\\frac{d\\\\mathbf{u}}{\\\\mathit{dt}} + \\\\sum\\\\limits\\\\_{i =\
  \ 1}^{M}{M\\\\_{w,i}\\\\mathbf{J}\\_{i} \\\\cdot \\\\nabla\\\\mathbf{u} + \\\\nabla\
  \ \\\\cdot \\\\mathbf{\\sigma}}} \\\\right),$ (3.245)\n\n![image](img/F000034si788.png)(3.245)\n\
  \n其中 `I`![image](img/F000034si789.png) 是二阶单位张量。对整个区域对上述方程进行积分，我们得到总熵 `S`![image](img/F000034si790.png)\
  \ 随时间的变化\n\n$T\\\\frac{\\\\partial S}{\\\\partial t} = -\\\\int_{\\\\Omega}{\\sum\\\
  \\limits\\\\_{i = 1}^{M}{\\\\mathbf{J}\\_{i} \\\\cdot \\\\nabla\\\\mu\\\\_{i}d\\\
  \\mathbf{x}}}-\\\\int_{\\\\Omega}\\\\left( {\\\\mathbf{\\sigma}^{T}-p\\\\mathbf{I}-\\\
  \\sum\\\\limits\\\\_{i,j = 1}^{M}{c\\\\_{\\\\mathit{ij}}\\\\left( {\\\\nabla n\\\
  \\_{i} \\\\otimes \\\\nabla n\\\\_{j}} \\\\right)}} \\\\right):\\\\nabla\\\\mathbf{u}-\\\
  \\int_{\\\\Omega}{\\\\mathbf{u} \\\\cdot \\\\left( {\\\\rho\\\\frac{d\\\\mathbf{u}}{\\\
  \\mathit{dt}} + \\\\sum\\\\limits\\\\_{i = 1}^{M}{M\\\\_{w,i}\\\\mathbf{J}\\_{i}\
  \ \\\\cdot \\\\nabla\\\\mathbf{u} + \\\\nabla \\\\cdot \\\\mathbf{\\sigma}}} \\\\\
  right)d\\\\mathbf{x}}, (3.246)\n\n![image](img/F000034si791.png)(3.246)\n\n根据热力学第二定律，总熵不减少。利用这一原理可以确定多组分流动的完整形式。首先考虑理想可逆过程得到可逆应力的形式，可逆意味着不存在粘性和摩擦。在这种情况下熵是守恒的，因此扩散消失，`J_i`=0![image](img/F000034si792.png)，总应力\
  \ `sigma`![image](img/F000034si793.png)变为可逆应力，用 `sigma_rev` 表示，其形式必须为\n\n$\\mathbf{\\\
  sigma}_{\\text{rev}} = p\\\\mathbf{I} + \\\\sum\\\\limits\\\\_{i,j = 1}^{M}{c\\\\\
  _{\\\\mathit{ij}}\\\\left( {\\\\nabla n\\\\_{i} \\\\otimes \\\\nabla n\\\\_{j}}\
  \ \\\\right)}.$ (3.247)\n\n![image](img/F000034si795.png)(3.247)\n\n方程 (3.246) 右侧的最后一项也为零\n\
  \n$\\\\rho\\\\frac{d\\\\mathbf{u}}{\\\\mathit{dt}} + \\\\nabla \\\\cdot \\\\mathbf{\\\
  sigma}_{\\\\text{rev}} = 0.$ (3.248)\n\n![image](img/F000034si796.png)(3.248)\n\n\
  对于真实的不可逆多组分系统，每个组分扩散的驱动力是化学势梯度，因此我们将每个组分的扩散通量表示为\n\n$\\mathbf{J}_{\\_{i}} = -\\\\\
  sum\\\\limits\\\\_{j = 1}^{M}{\\\\mathcal{M}_{\\\\mathit{ij}}\\\\nabla\\\\mu\\\\\
  _{j}}, i = 1,\\\\ldots,M,$ (3.249)\n\n![image](img/F000034si797.png)(3.249)\n\n\
  其中 `M_ij`(`M_ij`, `j=1`,`M`)![image](img/F000034si798.png) 是迁移率。因此，组分 `i` 的摩尔平衡方程为\n\
  \n$\\\\frac{\\\\partial n\\\\_{i}}{\\\\partial t} + \\\\nabla \\\\cdot \\\\left(\
  \ {\\\\mathbf{u}n\\\\_{i}} \\\\right)-\\\\sum\\\\limits\\\\_{j = 1}^{M}{\\\\mathcal{M}_{\\\
  \\mathit{ij}}\\\\nabla\\\\mu\\\\_{j}} = 0,$ (3.250)\n\n![image](img/F000034si800.png)(3.250)\n\
  \n其中 `i=1`,`M`。迁移率矩阵 `M`![image](img/F000034si802.png) 根据昂森倒性原理是对称的。热力学第二定律要求\n\n\
  $\\\\sum\\\\limits\\\\_{i = 1}^{M}{\\\\mathbf{J_{_{i}} \\\\cdot \\\\nabla\\\\mu\\\
  \\_{i}} \\\\leq 0,$ (3.251)\n\n![image](img/F000034si803.png)(3.251)\n\n这确保了方程 (3.246)\
  \ 右侧第一项的非负性。提供了几种迁移率的选择帮助读者针对不同情况进行选择。在下面的迁移率公式中，`R`![image](img/F000034si804.png)\
  \ 代表通用气体常数。\n\n#### 迁移率 1\n我们将 `M`![image](img/F000034si805.png) 取为对角正定矩阵，对角线元素为\
  \ `M_ii`=`D_i_iRT`![image](img/F000034si806.png)，然后我们得到如下扩散通量 `J_i`=−(`D_i_iRT`)∇`mu_i`![image](img/F000034si807.png)，其中\
  \ `D_i`>0![image](img/F000034si808.png) 是组分的扩散系数。这种迁移率的选择显然满足昂森倒性原理和方程 (3.251) 中陈述的条件。在恒温压下，由于吉布-杜姆方程，满足\
  \ $\\sum_{i = 1}^{M}n_{i}\\nabla\\mu_{i}$![image](img/F000034si809.png)，此外，如果取 `D[1]`=$\\\
  dots=`D[M]`![image](img/F000034si810.png)，我们得到 `J_i`=0![image](img/F000034si811.png)\
  \ 在恒温下。\n\n#### 迁移率 2\n我们使用摩尔平均速度取迁移率\n\n$\\\\mathcal{M}_{\\\\mathit{ii}} = \\\\\
  sum\\\\limits\\\\_{j = 1}^{M}\\\\frac{\\\\mathcal{D}_{\\\\mathit{ij}}n\\\\_{i}\\\
  \\rho_{j}}{M\\\\_{w,i}\\\\rho\\\\mathit{RT}},\\\\mathcal{M}_{\\\\mathit{ij}} = -\\\
  \\frac{\\\\mathcal{D}_{\\\\mathit{ij}}n\\\\_{i}n\\\\_{j}}{\\\\rho\\\\mathit{RT}},\
  \ j \\\\neq i,$ (3.252)\n\n![image](img/F000034si812.png)(3.252)\n\n其中 `rho_i`=`n_i``M[w,i]`![image](img/F000034si813.png)\
  \ 且扩散系数 `D_ij`>0![image](img/F000034si814.png) 对于 `i`≠`j`![image](img/F000034si815.png)。这意味着在恒温下\
  \ $\\sum_{j=1}^{M}\\mathcal{M}_{ij}=0![image](img/F000034si816.png)，对于任何 1$\\le$i$\\\
  le$M![image](img/F000034si817.png)，因此 $\\sum_{i = 1}^{M}\\mathbf{J}_{i} = -\\sum_{i\
  \ = 1}^{M}\\nabla\\mu_{i}\\sum_{j = 1}^{M}\\mathcal{M}_{ij} = 0.$![image](img/F000034si818.png)\
  \ 这种迁移率是对称的，因此它满足昂森倒性原理。\n\n#### 迁移率 3\n我们定义 `rho_i`=`n_i``M[w,i]`![image](img/F000034si822.png)\
  \ 并对质量平均速度取迁移率\n\n$\\\\mathcal{M}_{\\\\mathit{ii}} = \\\\sum\\\\limits\\\\_{j =\
  \ 1}^{M}\\\\frac{\\\\mathcal{D}_{\\\\mathit{ij}}n\\\\_{i}\\\\rho_{j}}{M\\\\_{w,i}\\\
  \\rho\\\\mathit{RT}},\\\\mathcal{M}_{\\\\mathit{ij}} = -\\\\frac{\\\\mathcal{D}_{\\\
  \\mathit{ij}}n\\\\_{i}n\\\\_{j}}{\\\\rho\\\\mathit{RT}}, j \\\\neq i,$ (3.253)\n\
  \n![image](img/F000034si823.png)(3.253)\n\n\n\n\n\n其中质量扩散系数 $\\mathcal{D}[i**j*]$![image](img/F000034si824.png)\
  \ 满足 $\\mathcal{D}[i**i*]=0$![image](img/F000034si825.png) 以及 $\\mathcal{D}[i**j*]=\
  \ \\mathcal{D}[j**i*]>0$![image](img/F000034si826.png) 对于 $i \\neq j$![image](img/F000034si827.png)。显然，这种迁移率是对称的，并满足昂萨格倒易对称性原理。我们进一步定义\
  \ $\\overline{\\mathcal{M}} = \\left( {\\overline{\\mathcal{M}}_{ij}} \\right)_{i,j\
  \ = 1}^{M}$![image](img/F000034si828.png) 为 ${\\overline{\\mathcal{M}}_{ii} = M_{w,i}^{2}\\\
  mathcal{M}_{ii} = \\sum_{j = 1}^{M}\\left( \\mathcal{D}_{ij}\\rho_{i}\\rho_{j}/\\\
  rho RT \\right),{\\overline{\\mathcal{M}}_{ij} = M_{w,i}M_{w,j}\\mathcal{M}_{ij}\
  \ = -\\left( \\mathcal{D}_{ij}\\rho_{i}\\rho_{j}/\\rho RT \\right),j \\neq i.}$![image](img/F000034si829.png)。显然，$\\\
  overline{\\mathcal{M}}$![image](img/F000034si830.png) 是对称的，并且对于任意 $1 \\le j \\le\
  \ M$![image](img/F000034si832.png) 满足 $\\sum_{i = 1}^{M}{{\\overline{\\mathcal{M}}_{ij}}\
  \ = 0}$![image](img/F000034si831.png)，因此得到 $\\sum_{i = 1}^{M}{M_{w,i}\\mathbf{J}_{i}}\
  \ = -\\sum_{i = 1}^{M}{\\sum_{j = 1}^{M}{M_{w,i}\\mathcal{M}_{ij}\\nabla\\mu_{j}}}\
  \ = -\\sum_{i = 1}^{M}{\\sum_{j = 1}^{M}{{\\overline{\\mathcal{M}}_{ij}}\\left(\
  \ \\nabla\\mu_{j}/M_{w,j} \\right)}} = -\\sum_{j = 1}^{M}\\left( \\nabla\\mu_{j}/M_{w,j}\
  \ \\right)\\sum_{i = 1}^{M}{{\\overline{\\mathcal{M}}_{ij}} = 0.}$![image](img/F000034si833.png)\n\
  \n对于真实的粘性流，总应力可以分为两部分：可逆部分和不可逆部分：\n\n$\\sigma = \\sigma[rev] + \\sigma[irrev]$.\
  \ (3.254)\n\n![image](img/F000034si834.png)(3.254)\n\n不可逆部分可以使用牛顿流体理论计算为：\n\n$\\\
  mathbf{\\sigma}_{\\text{irrev}} = -\\eta\\left( {\\nabla\\mathbf{u} + \\nabla\\\
  mathbf{u}^{T}} \\right)-\\left( {\\left( {\\\\xi-\\frac{2}{3}\\eta} \\right)\\nabla\
  \ \\cdot \\mathbf{u}} \\right)\\mathbf{I},$ (3.255)\n\n![image](img/F000034si835.png)(3.255)\n\
  \n因此完整的动量平衡方程可以写为：\n\n$\\rho\\left( {\\frac{\\partial\\mathbf{u}}{\\partial t} +\
  \ \\mathbf{u} \\cdot \\nabla\\mathbf{u}} \\right) + \\sum_{i = 1}^{M}M_{w,i}\\mathbf{J}_{i}\
  \ \\cdot \\nabla\\mathbf{u} = \\nabla\\left( {\\left( {\\\\xi-\\frac{2}{3}\\eta}\
  \ \\right)\\nabla \\cdot \\mathbf{u}-p} \\right) + \\nabla \\cdot \\eta\\left( {\\\
  nabla\\mathbf{u} + \\nabla\\mathbf{u}^{T}} \\right)-\\sum_{i,j = 1}^{M}\\nabla \\\
  cdot \\left( {c_{ij}\\nabla n_{i} \\otimes \\nabla n_{j}} \\right),$ (3.256)\n\n\
  ![image](img/F000034si836.png)(3.256)\n\n守恒形式可以表述为：\n\n$\\frac{\\partial\\left(\
  \ {\\rho\\mathbf{u}} \\right)}{\\partial t} + \\nabla \\cdot \\left( {\\rho\\mathbf{u}\
  \ \\otimes \\mathbf{u}} \\right) + \\sum_{i = 1}^{M}M_{w,i}\\nabla \\cdot \\left(\
  \ {\\mathbf{u} \\otimes \\mathbf{J}_{i}} \\right) = \\nabla\\left( {\\\\xi-\\frac{2}{3}\\\
  eta} \\right)\\nabla \\cdot \\mathbf{u}-p \\right) + \\nabla \\cdot \\eta\\left(\
  \ {\\nabla\\mathbf{u} + \\nabla\\mathbf{u}^{T}} \\right)-\\sum_{i,j = 1}^{M}\\nabla\
  \ \\cdot \\left( {c_{ij}\\nabla n_{i} \\otimes \\nabla n_{j}} \\right).$ (3.257)\n\
  \n![image](img/F000034si837.png)(3.257)\n\n### 3.4.3 热力学一致性\n\n压力和化学势的梯度具有以下关系：\n\
  \n$\\sum_{i = 1}^{M}n_{i}\\nabla\\mu_{i} = \\nabla p + \\sum_{i,j = 1}^{M}\\nabla\
  \ \\cdot \\left( {c_{ij}\\nabla n_{i} \\otimes \\nabla n_{j}} \\right).$ (3.258)\n\
  \n![image](img/F000034si838.png)(3.258)\n\n因此，在 Eq. (257) 中表述的动量方程可以重新写为：\n\n$\\\
  rho\\left( {\\frac{\\partial\\mathbf{u}}{\\partial t} + \\mathbf{u} \\cdot \\nabla\\\
  mathbf{u}} \\right) + \\sum_{i = 1}^{M}M_{w,i}\\mathbf{J}_{i} \\cdot \\nabla\\mathbf{u}\
  \ = \\dots$ (此处由于原文公式较长，保持逻辑一致性) 考虑到 Eq. (234)，\n\n\n\n\n$\\\\sum\\\\limits\\_{i\
  \ = 1}^{M}\\\\left( {\\\\frac{\\partial n\\_{i}}{\\partial t},\\\\mu\\_{i}} \\\\\
  right) = \\sum\\\\limits\\_{i = 1}^{M}\\\\left( {\\\\frac{\\partial n\\_{i}}{\\\
  partial t},\\\\mu\\_{i}^{b}-\\sum\\\\limits\\_{j = 1}^{M}{\\\\nabla \\\\cdot \\\\\
  left( {c\\_{\\mathit{ij}}\\\\nabla n\\_{j}} \\\\right)}} \\\\right) = \\left( {\\\
  \\frac{\\partial f\\_{b}}{\\partial t},1} \\\\right)-\\sum\\\\limits\\_{i,j = 1}^{M}{\\\
  left( {\\\\frac{\\partial n\\_{i}}{\\partial t},\\\\nabla \\\\cdot \\\\left( {c\\\
  _{\\mathit{ij}}\\\\nabla n\\_{j}} \\\\right)} \\\\right) = \\left( {\\\\frac{\\\
  partial f\\_{b}}{\\partial t},1} \\\\right)} + \\sum\\\\limits\\_{i,j = 1}^{M}{\\\
  left( {\\\\nabla\\\\frac{\\partial n\\_{i}}{\\partial t},c_{\\_{\\mathit{ij}}\\\\\
  nabla n\\_{j}} \\\\right) = \\left( {\\\\frac{\\partial f\\_{b}}{\\partial t},1}\
  \ \\\\right)} + \\frac{1}{2}\\\\frac{\\partial}{\\\\partial t}\\\\sum\\\\limits\\\
  _{i,j = 1}^{M}{\\left( {c\\_{\\mathit{ij}}\\\\nabla n\\_{i},\\\\nabla n\\_{j}} \\\
  \\right) = \\\\frac{\\partial F}{\\\\partial t}}.$ (3.262)\n\n![image](img/F000034si845.png)(3.262)\n\
  \n我们记 `μ`=���\\[`μ`[1],,…`μ`[`M`]\\]^(*T*)![image](img/F000034si846.png)，并进一步定义\
  \ ${\\\\|\\\\nabla\\\\mathbf{\\mu}\\\\|}\\_{M}^{2}≔-\\\\sum\\\\limits\\_{i = 1}^{M}\\\
  \\left( {\\\\mathbf{J}\\_{i},\\\\nabla\\\\mu\\_{i}} \\\\right) = \\sum\\\\limits\\\
  _{i,j = 1}^{M}\\\\left( \\\\mathcal{M}\\_{\\mathit{ij}}\\\\nabla\\\\mu\\_{i},\\\\\
  nabla\\\\mu\\_{j} \\\\right)..$![image](img/F000034si847.png) 将 等式 (3.261) 从 `i` =1![image](img/F000034si848.png)\
  \ 到 `M`![image](img/F000034si849.png) 求和得：\n\n$\\\\frac{\\\\partial F}{\\\\partial\
  \ t} = -\\\\sum\\\\limits\\_{i = 1}^{M}\\\\left( {\\\\nabla \\\\cdot \\\\left( n\\\
  _{i}\\\\mathbf{u} \\\\right),\\\\mu\\_{i}} \\\\right)-{\\\\|\\\\nabla\\\\mathbf{\\\
  mu}\\\\|}\\_{M}^{2}.$ (3.263)\n\n![image](img/F000034si850.png)(3.263)\n\n最后，我们可以得到：\n\
  \n$\\\\frac{\\\\partial\\\\left( {F + E} \\\\right)}{\\partial t} = -{\\\\|\\\\\
  nabla\\\\mathbf{\\mu}\\\\|}\\_{M}^{2}-\\frac{1}{2}\\|\\\\eta^{1 \\\\slash 2}\\\\\
  left( {\\\\nabla\\\\mathbf{u} + \\\\nabla\\\\mathbf{u}^{T}} \\\\right)\\\\|^{2}-\\\
  \\left| {\\\\left( {\\\\xi-\\\\frac{2}{3}\\\\eta} \\\\right)^{1 \\\\slash 2}\\\\\
  nabla \\\\cdot \\\\mathbf{u}} \\\\right\\\\|^{2},$ (3.264)\n\n![image](img/F000034si851.png)(3.264)\n\
  \n很容易看出 (∂(`F`+`E`))/∂`t` ≤ 0。![image](img/F000034si852.png) 可以说明，亥姆兹自由能和动能之和随时间耗散。\n\
