  \n### 6.2.2 多孔介质的生成对抗网络重建\n\n#### 6.2.2.1 生成对抗网络重建的概览\n\n图 6.16 展示了 GAN 重建的工作流。如前所述，GAN\
  \ 包含两个函数：判别器 `D` 和生成器 `G`。判别器接收“真实”数据集样本（标签 1）和生成器从隐空间 `Z` 创建的“伪”样本 `G(z)`（标签 0）（见图\
  \ 6.16）。隐空间 `Z` 由独立随机变量组成，通常符合正态分布或均匀分布，代表生成器 `G` 的随机输入。生成器 `G` 将来自隐空间的随机变量映射到图像空间。判别器的作用是分配一个随机样本来自真实数据分布\
  \ `p[data]` 的概率。判别器试图正确地标记每个样本，而生成器试图“欺骗”判别器，使其将伪图像标记为真实数据分布的一部分，从而使 `D[G]` 接近 1。\n\
  \n更正式地说，GAN 的损失函数可以定义为最小化-最大化问题：\n\n```\nmin[G]max[D] E[X~P[data]]log[D(X)] + E[Z~P[Z]]log(1-D[G(z)])\n\
  ```\n![OEBPS/images/F0000Xsi74.png](img/624)\n\n在实践中，`G` 和 `D` 表示为通过梯度下降方法训练的 CNN。训练分为两个步骤。首先，训练判别器以最大化\n\
  \n```\nJ(D) = E[X~P[data]]log[D(X)] + E[Z~P[Z]]log(1-D[G)])\n```\n![OEBPS/images/F0000Xsi75.png](img/625)\n\
  \n同时固定生成器的参数。这提高了判别器区分真图像的能力。其次，我们通过从 N 维正态分布隐空间采样 `z` 生成合成样本 `G(z)`，并训练生成器以最小化\n\
  \n```\nJ(G) = E[Z~P[Z]]log(1-D[G)])\n```\n![OEBPS/images/F0000Xsi76.png](img/626)\n\
  \n通过最小化公式(6.26)，生成器试图欺骗判别器，使其认为 `G(z)` 是真实数据样本。通过这种方式，生成器学习表示一个尽可能接近真实数据分布 `pdata`\
  \ 的分布 `pg`。当收敛时，`pg=pdata`，判别器的值变为 1/2，因为它无法再区分两者。\n\n#### 6.2.2.2 结论\n\n## 6.3\
  \ 稀疏表示重建步骤\n\n为了更清晰地描述稀疏表示重建技术，算法伪代码所示：\n\n| 基于局部相似性的稀疏表示重建 |\n| --- |\n| 数据：低分辨率目标图像\
  \ `I`；3D 高分辨率和 3D 低分辨率训练图像 `I`[high]`和 `I`[low]。放大倍数，`s`；低分辨率立方体大小，`cl`；高分辨率立方体大小，`ch`\
  \ (`ch=cl`×`s`)；稀疏阈值，`L`；字典更新循环次数，`K`；PCA 能量阈值，`T`；字典原子数，`N`[d]；训练立方体对数量，`N`[p]\
  \ |\n\n\n\n\n\n# 输出：高分辨率多孔结构 *IH*\n\n## 1. 数据提取\n1. 分别从 `I[low]` 和 `I[high]` 中提取窗口大小为\
  \ `cl³` 和 `ch³` 的 `N[p]` 对训练图像立方体。\n2. 将低分辨率立方体构建为 `cl³×N[p]` 矩阵 `LR`，`LR` 的每一列都是一个向量化的低分辨率图像立方体。\n\
  3. 将高分辨率立方体构建为 `ch³×N[p]` 矩阵 `HR`，`HR` 的每一列都是一个向量化的高分辨率图像立方体。\n\n## 2. 低分辨率字典训练\n\
  1. 随机生成一个 `cl³×N[d]` 矩阵作为低分辨率字典，记为 `D`。\n2. 使用 `K-SVD` 和 `OMP` 算法训练低分辨率字典和稀疏系数：\n\
  \n```\nfor m=1 to K, do\n    初始化稀疏系数矩阵为 N[p]×N[d] 零矩阵;\n    使用 OMMP 进行稀疏编码:\n  \
  \  for n=1 to N[p], do\n        初始化基矩阵 B0={r0(n)}; (`r0(n)` 是 `LR` 的第 n 列);\n  \
  \      计算 `r0(n)` 与 `D` 中每个原子的内积导导，选择最相关的原子 `α0` 并记录其列索引 `p0`;\n        更新 B1=B0∪{α0};\n\
  \        通过 `Cn=B1^+r0(n)` 计算在基矩阵 `B1` 下 `r0(n)` 的系数；(`B1^+` 是 `B1` 的伪逆`);\n   \
  \     计算 `r0(n)` 的残差向量 `r1(n)` (`r1(n)=r0(n)—B1Cn`);\n        计算 `r1(n)` 与 `D` 中每个原子的内积导导，选择最（相似）的原子\
  \ `α1` 并记录其列索引 `p1`;\n        更新 B0=B1∪{α1} 并令 `r0(n)=r1(n)`;\n        重复步骤 (ii)\
  \ 到 (vii) 直到 `Cn` 的维度等于 `L`（稀疏阈值）。\n        根据对应的列索引 `p0` 到 `L`，将 `Cn` 的每个元素放入 `C`\
  \ 的第 n 列\nend\n```\n\n使用 K-SVD 更新字典：\n```\nfor n=1 to N[d], do\n    找到稀疏系数矩阵 `C`\
  \ 中第 n 行的非零元素，该位置记录了哪一个低分辨率图像立方体使用了字典中的第 n 个原子；\n    提取这些使用了第 n 个原子的列并将其组织为 `k×cl³`\
  \ 矩阵 `LR[t]` (`k` 是符合条件的列数);\n    提取与 `LR[t]` 对应的系数列并将其组织为 `k×N[d]` 矩阵 `C[t]`；\n\
  \    通过 `E[n]=LR[t]-DC[t]` 计算误差矩阵 `E[n]`；\n    通过 SVD 算法分解 `E[n]`，`En=USV^T`；\n\
  \    使用 `U` 的第一列（对应于最大的奇异值）替换字典中的第 n 个原子\nend\n```\n\n## 3. 通过 PCA 降维\n1. 计算 HR\
  \ 的自协方差矩阵（均值残留归一化），记为 `C[x]`（`N[p]×N[p]` 矩阵）。\n2. 通过 SVD 算法分解 `C[x]`，`C[x]=PSP^T`\
  \ (`S=diag(σ1², σ2², σ3²,,…σNp²)` 且 `σ1²≥σ2²≥σ3²…≥σNp²`)。\n3. 选择 `P` 的前 `m` 列 (`m`\
  \ 满足 $\\frac{\\sum_{i=1}^{m}\\sigma_{i}^{2}}{\\sum_{i=1}^{\\infty}\\sigma_{i}^{2}}\
  \ = T$）记为 `K[t]`，其为降维矩阵。\n4. 通过 `HR[r]=K[t]` 获取降维的高分辨率训练立方体 `HR[r]`。\n\n## 4. 高分辨率字典计算\n\
  计算高分辨率字典 `D[h]`，`D[h]=HR*AC+=HR*CC^T` (`C` 为满秩)。\n\n## 5. 分解与重构\n1. 对目标低分辨率图像 `I`\
  \ 进行栅格扫描，并将其分为大小为 `cl×cl×cl` 的小立方体，使相邻立方体具有重叠。\n2. 将这些低分辨率立方体组织为 `cl³×N` 矩阵 `LRt`\
  \ (`N` 是立方体数量)，`LRt` 的每一列是一个低分辨率立方体。\n3. 通过步骤 4 获取 `LRt` 的稀疏系数矩阵 `Ct`。\n4. 通过 `HR[t]=D[h]×Ct`\
  \ 获取高分辨率立方体 `HR[t]`。\n5. 将这些高分辨率立方体合并得到高分辨率图像 `H[f]`，重叠部分取平均值。\n\n## 参考文献\n1. Aharon\
