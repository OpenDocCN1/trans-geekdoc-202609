  \ 2014. 用于相平衡建模的深度学习。*ArXiv e-prints* 1412.\n\n\n\n\n气液平衡（VLE）对于许多工程过程的多相和多组分流模拟建模具有至关重要的意义。混合物平衡条件的知识可以从直接实验收集的数据或热力学模型中，包括低系统压力下的活性系数或高系统压力下的逸度系数。在过去的二十年里，使用带有经验系数的混合规则的状态方程（EOSs）进行平衡计算被提出并广泛讨论。例如，一种真实的\
  \ `EOS`（如 Peng–Robinson 方程）由于在不同领域应用中得到了长期的改进，通常被认为是关联和预测 VLE 条件的合适热力学模型。使用 `EOS`\
  \ 的计算过程已经得到了广泛的研究和改进。描述二元混合物之间浓度、组合和相互作用的 `EOS` 参数可以决定关联 VLE 过程的准确性。在实践中，此类参数通常通过在所需\
  \ VLE 条件的温度下拟合实验数据来获得。然而，在大多数 `EOS` 计算中，需要迭代，这使其不太适用于对时间敏感的应用。对于地下加热流流中的相平衡等情况，由于许多可能组分的浓度在很大范围内变化很大，很难通过实验对它们进行关联并精确预测参数。某些极低浓度的组分是关键部分，这使得参数计算更加困难。现实中，一种烃混合物可能由几十到数百种物质组成，远多数值模拟中的组分数量。因此，为了加速相平衡计算，首先想到的是将流体混合物归为少量伪组分，且不丢失\
  \ `EOS` 模型的准确性。显然，组分数量越少，节省的计算时间越多，同时丢失的准确性也越高。尽管如此，减少组分数量带来的加速并不令人满意，因此促使过去二十年来大量研究人员开发相平衡计算的加速策略。\n\
  \n自 2012 年 `AlexNet` 突破以来，深度学习对工业和学术界产生了深远影响。它不仅彻底改变了计算机视觉领域（极大提高了图像识别和目标检测性能）以及自然语言处理领域（为速度识别和翻译创造了新记录），还使机器在某些任务（如围棋）中达到了人类智能水平。除了这些深度学习特别擅长的已知任务外，深度学习已应用于广泛的问题，例如蛋白质结合亲和力预测、酶功能预测、结构超分辨率重建、第三代测序建模、粒子加速器数据分析以及脑电路建模。深度学习的巨大潜力源于其相对于传统机器学习算法（如支持向量机）的显著性能提升。传统的机器学习方法通常只考虑输入特征单层非线性组合，而深度学习方法可以通过利用多个隐藏层考虑输入特征的超复杂非线性组合。在训练过程中，反向传播算法增加对最终分类或回归问题有用的特征组合的权重，以强调有用特征，同时减小那些无关特征组合的权重。尽管存在通用近似定理（该定理规定可以使用包含有限数量神经元的单隐藏层前馈网络来拟近任何连续函数），但深度学习的成功展示了使用多层神经网络拟合\
  \ VLE 的潜力。原则上，深度学习可以作为一种通用函数近似器，以隐式的方法拟近 VLE 的底层物理过程。同时，通过这种近似方法，深度学习领域硬件和软件开发的成熟将极大地有助于加速原始复杂的闪计算。\n\
  \n人工神经网络（ANNs）是设计用于整合和提取原始输入关键特征的计算模型。深度神经网络通常指由多个隐藏层组成的 ANN。深度全连接神经网络被应用于 VLE 建模。在输入层之后，若干层具有特定节点数量的全连接隐藏层相互堆叠，其最终输出进入另一个全连接层。\n\
  \n7.1.1 人工神经网络简介\n\n自 2012 年 `AlexNet` 突破以来，深度学习对工业和学术界产生了深远影响。它不仅彻底改变了计算机视觉领域（极大提高了图像识别和目标检测性能）以及自然语言处理领域（为速度识别和翻译创造了新记录），还使机器在某些任务（如围棋）中达到了人类智能水平。除了这些深度学习特别擅长的已知任务外，深度学习已应用于广泛的问题，例如蛋白质结合亲和力预测、酶功能预测、结构超分辨率重建、第三代测序建模、粒子加速器数据分析以及脑电路建模。深度学习的巨大潜力源于其相对于传统机器学习算法（如支持向量机）的显著性能提升。传统的机器学习方法通常只考虑输入特征单层非线性组合，而深度学习方法可以通过利用多个隐藏层考虑输入特征的超复杂非线性组合。在训练过程中，反向传播算法增加对最终分类或回归问题有用的特征组合的权重，以强调有用特征，同时减小那些无关特征组合的权重。尽管存在通用近似定理（该定理规定可以使用包含有限数量神经元的单隐藏层前馈网络来拟近任何连续函数），但深度学习的成功展示了使用多层神经网络拟合\
  \ VLE 的潜力。原则上，深度学习可以作为一种通用函数近似器，以隐式的方法拟近 VLE 的底层物理过程。同时，通过这种近似方法，深度学习领域硬件和软件开发的成熟将极大地有助于加速原始复杂的闪计算。\n\
  \n人工神经网络（ANN）是设计用于整合和提取原始输入关键特征的计算模型。深度神经网络通常指由多个隐藏层组成的 ANN。深度全连接神经网络被应用于 VLE 建模。在输入层之后，若干层具有特定节点数量的全连接隐藏层相互堆叠，其最终输出进入另一个全连接层。由于我们正在拟合\
  \ `X` 和 `Y`，最终输出层包含两个节点，每个节点预测一个值。所提出的 ANN 输入变量包括临界压力 `P[c]`、临界温度 `T[c]` 和混合物的偏心因子\
  \ `ω`。如图 7 所示，二元混合物的 VLE 实验数据收集自韩国物理性质数据库（KDB），共 1332 个数据点，并经过了一致性选择。该层的激活函数固定为线性。\n\
  \n由于神经网络模型的高复杂性和数据量的有限（仅 1332 条记录），训练模型容易出现过拟合。为了解决深度学习领域常见且最严重的问题，我们采用了权重衰减和丢弃（dropout）来处理该问题。模型初始化也会影响最终结果。我们利用\
  \ Xavier 初始化器进行模型初始化。整个包使用 `TFlearn` 开发。在带有一块 Titan X 卡的工作站上训练，模型在 10 分钟内收敛。我们网络模型在每个节点中的简化工作流程如图\
  \ 7.2 所示。\n\n\n\n其中 `W``i` 是权重；`b``i` 是偏置；`f``i` 是第 `i` 层的激活函数。对于多层网络，一个隐藏层的输出是下一层的输入。例如，我们可以将如图\
  \ 7.1 所示的网络表示为：\n\n`o = f``3`)+b`3`(7.2)\n\n其中 `o = f``3``![image](img/F000071si10.png);`f`[`1`],`f`[`2`],`f`[`3`]`![image](img/F000071si11.png)\
  \ 是激活函数；`W`[`1`],`W`[`2`],`W`[`3`]`![image](img/F000071si12.png) 是每层的权重；`b`[`1`],`b`[`2`],`b`[`3`]`![image](img/F000071si13.png)\
  \ 是每层的偏置项。\n\n### 7.1.2 人工网络中的技术解释\n\n以下是用于获取实际网络的技术的简要说明：\n\n1. **权重衰减（Weight decay）**：过拟合在深度学习领域是一个严重的问题，这意味着学习到的模型在训练数据上的性能近乎完美，但在验证或测试数据上的表现很差。该领域过拟合的主要原因是模型本身由过多的参数组成，而我们没有足够的训练数据，即模型是过度参数化的。为了防止过拟合问题损害模型性能，我们通常对模型参数实施额外的约束，以减少模型的自由度。通常情况下，如果模型过拟合，权重参数的范数通常很大。因此，避免过拟合的一种方法是对权重参数的范数添加额外约束并惩罚大权重。在实践中，我们可以在损失函数中添加与权重范数相关的正则项，使模型在拟合训练数据的同时惩罚大权重。从形式上，深度学习的原始损失函数（在我们问题中是方误差）可以表示为：\n\
  \n$L = \\frac{1}{N}\\sum_{n = 1}^{N}\\| o - \\widehat{o}\\|^{2},$7.3)\n\n![image](img/F000071si14.png)(7.3)\n\
  \n其中 `N` 是训练数据的总数；`o` 是模型的输出；`\\hat{o}`![image](img/F000071si15.png) 是观测值。添加 L2\
  \ 权重衰减项后，损失函数变为：\n\n$L = \\frac{1}{N}\\sum_{n = 1}^{N}(\\| o - \\widehat{o}\\|^{2}\
  \ + \\lambda \\|\\mathbf{W}\\|_{2}^{2}),$(7.4)\n\n![image](img/F000071si16.png)(7.4)\n\
  \n其中 `mathbf{W}` 是模型的所有权重参数集；`\\lambda` 是正则化系数。\n\n2. **丢弃（Dropout）**：丢弃是处理神经网络过拟合的一种非常有效的方法。它在训练期间通过丢弃节点和连接来减少模型的自由度。例如，如果我们以概率\
  \ `P`![image](img/F000071si18.png) 对某层应用丢弃技术，那么在每个训练阶段，每个节点将以概率 `1-P`![image](img/F000071si19.png)\
  \ 独立地进行评估。如果节点被丢弃，则在训练阶段对模型处理。\n\n3. **Xavier 初始化（Xavier initializer）**：神经网络的初始化至关重要，会影响收敛速度甚至模型性能。如果用很小的值初始化权重，信号的方差会在层之间消失并最终下降到极低的值，这会损害模型。由于我们通常用高斯分布初始化权重，以防止方差消失或爆炸。\n\
  \n4. **批量归一化（Batch normalization）**：由于参数数量巨大，深度学习训练非常耗时。不仅如此数量参数的优化很耗时，而且输入在训练过程中可能会发生某些变化，这通常被称为“内部拷贝偏移”。为了解决这个问题，提出了批量归一化。除了归一化模型的原始输入（即第一层的输入）外，该技术还对每个批次的隐藏层进行归一化，可以加速\
  \ 10 倍。\n\n5. **激活函数（Activation functions）**：激活函数是深度网络非线性和表达能力的来源。有许多激活函数：`整流线性单元\
  \ (ReLU)`、`参数 ReLU (PReLU)`、`TanH`、`sigmoid`、`softplus`、`softsign`、`leaky ReLU`、`指数线性单元\
  \ (ELU)` 以及`缩放线性单元 (SELU)`。\n\n### 7.1.3 案例研究\n\n为了加速和优化使用迭代替换法（SSM）的光闪计算，尝试使用深度学习方法对\
  \ C1–C7 混合物的气液平衡（VLE）计算进行处理。还引入了两种加速方法——牛顿法和稀疏网格法作为对比。每个组分的物理属性列如表 7.1 所示。基本上，根据吉布斯相规则，需要两个强度属性来完全描述平衡状态下的二相系统。温度和压力是传统选择的两种热力学强度属性，因为它们相对容易测量。\n\
