  \ `p[`w]` 是线性的![image](img/F000022si340.png)。\n\n### 2.4.1.4 双相流饱和度方程\n\n回想分流函数\
  \ $\\begin{matrix} {f_{\\_{\\alpha}: := \\\\lambda\\\\_{\\alpha}/\\\\lambda_{t}},}\
  \ & {\\\\alpha = n,w} \\\\ \\\\end{matrix}$![image](img/F000022si341.png)。对于非湿相速度，我们有：\n\
  \n`u[`n]`=``k`*`λ`[`n`g) (2.121)![image](img/F000022si342.png)(2.121)\n\n注意到 `λ`[`w`]*f[`n]`=`λ`[`n`]*f[`w]`![image](img/F000022si343.png)，我们有\
  \ `u[`n]`=`f[`n`]*u[`t]`-\\nabla\\cdot$`k`*`λ`\\nabla*p[`c]+[`λ`[`w`]*f`n`g (2.122)![image](img/F000022si344.png)(2.122)。同样，对于湿相速度，我们有\
  \ `u[`w]`=`f[`w`]*u[`t]`+[`k`*`λ`[`n`]*f[`w]`]\\nabla*p[`c]+[`λ`[`n`]*f`w`g (2.23)![image](img/F000022si345.png)。假设孔隙率与时间无关，我们得到湿相体积守恒方程：$\\\
  phi\\frac{\\partial S_{w}}{\\partial t}+\\nabla\\cdot\\mathbf{u}_{w}=q_{w}$ (2.124)![image](img/F000022si346.png)(2.124)。将\
  \ (2.23) 代入 (2.24) 得到饱和度方程：$\\phi\\frac{\\partial S_{w}}{\\partial t}+\\nabla\\\
  cdot(f_{w}\\mathbf{u}_{t})+\\nabla\\cdot(\\mathbf{k}f_{w}\\lambda_{n}(\\nabla p_{c}+(\\\
  rho_{w}-\\rho_{n}))g)=q_{w}$ (2.125)![image](img/F000022si347.png)(2.125)。我们注意到\
  \ $\\nabla p_{c}=\\left(\\frac{dp_{c}(S_{w})}{dS_{w}}\\right)\\nabla S_{w}$ (2.126)![image](img/F000022si348.png)(2.126)。将\
  \ (2.126) 代入 (2.125)，饱和度方程变为：$\\phi\\frac{\\partial S_{w}}{\\partial t}=RHS_{sat}(p_{n},S_{w})$\
  \ (2.127)![image](img/F000022si349.png)(2.127)，其中 $RHS_{sat}(p_{n},S_{w})=q_{w}(p_{n},S_{w})-\\\
  nabla\\cdot[f_{w}(S_{w})\\mathbf{u}_{t}(p_{n},S_{w})]-\\nabla\\cdot[\\mathbf{k}f_{w}(S_{w})\\\
  lambda_{n}(S_{w})\\left(\\frac{dp_{c}}{dS_{w}}\\right)\\nabla S_{w}+\\left(\\rho_{w}-\\\
  rho_{n}\\right)g\\right]$![image](img/F000022si350.png)。\n\n### 2.4.1.5 不压缩双相流的隐式压力显式饱和度格式\n\
  \nIMPES（隐式压力、显式饱和度）方法由不压缩双相流的相格式（压力-饱和度格式）开发，包含两个两个未知的主要方程（非湿相压力 `p[`n]`![image](img/F000022si352.png)）。压力方程为：$-\\\
  nabla\\cdot$`k`*`λ`\\nabla*p[`n]`=`R``H[`r` (2.128)![image](img/F000022si353.png)(2.128)。饱和度方程为：$\\\
  phi\\frac{\\partial S_{w}}{\\partial t}=RHS_{sat}(p_{n},S_{w})$ (2.129)![image](img/F000022si354.png)(2.129)。标准的\
  \ IMPES 格式如下：令 $J=(0,T)$![image](img/F000022si355.png) 为感兴趣的时间间隔，对于 $N\\in N$![image](img/F000022si356.png)，令\
  \ $0=t[0]<t[1]\\dots<t[N]=T$ 是 $J$ 的划分。在 IMPES 算法的压力计算中，饱和度 `S[`w]`![image](img/F000022si357.png)\
  \ 应该是已知的，并且隐式求解压力方程得到 `p[`w]`![image](img/F000022si358.png)。也就是说，对于每个 `n`=0, 1,\
  \ …,，$-\\nabla\\cdot$`k`*`λ`\\nabla*p[`n]`=`R``H[`r` (2.130)![image](img/F000022si359.png)(2.130)。在这个经典的\
  \ IMPES 中，饱和度方程是显式求解 `S[`w]`![image](img/F000022si360.png) 的；也就是说，对于每个 `n`=0, 1,\
  \ …,\n\n\n\n\n\n$\\phi\\frac{S_{w}^{({n + 1})} - S_{w}^{(n)}}{t_{n + 1} - t_{n}}\
  \ = {RHS}_{sat}\\left( {p_{n}^{(n)},S_{w}^{(n)}} \\right)$ (2.131)\n\n![image](img/F000022si361.png)(2.131)\n\
  \nIMPES 公式具有若干优点，它比全隐式方案更易于实现。它基于压力对饱和度的影响很微，以及压力随时间变化缓慢的这一事实，成功地将压力与饱和度解耦。总速度 `u`[*t*]![image](img/F000022si362.png)具有连续的法向分量，这在标准的\
  \ IMPES 公式中被保留了（这在混合有限元 IMPES 公式中是明显的）。IMPES 方案对于湿相是局部质量和体积守恒的，如果时间步长小于某个值，它会产生非负的湿相饱和度。这里列出了\
  \ IMPES 方法的一些缺点，例如它为了数值稳定性（以及正值性）需要非常小的时间步长。它无法（局部或全局）保持非湿相的守恒，因此无法（局部或全局）保持总流体混合物的守恒。IMPES\
  \ 方案可能会产生大于 1 的湿相饱和度。对于不同的毛细压力函数，它无法重现不连续的正确饱和解。\n\n### 2.4.1.6 Hoteit 和 Firoozabadi\
  \ 改进的隐式压力、显式饱和度公式\n\n为了处理非均匀渗透介质中毛细力的差异（这对两相不相流流径产生显著影响），Hoteit 和 Firoozabadi 提出了改进的\
  \ IMPES 公式，即 Hoteit–Firoozabadi (HF) IMPES 方案。首先定义相 `α` 的流势 `Φ`[*α*]![image](img/F000022si363.png)\
  \ 相 `α`![image](img/F000022si364.png) 如下：\n\n$\\begin{matrix} {\\\\Phi_{\\alpha}:\
  \ := p_{\\_{\\} + \\\\rho_{\\alpha}gz,} & {\\\\alpha = n,w} \\\\\\\\ \\\\end{matrix}$\
  \ (2.132)\n\n![image](img/F000022si365.png)(2.132)\n\n将毛细势定义为两个流势之差，\n\n`Φ`[*c*] :  = `Φ`[*n*] − `Φ`[*w*] = `p`[*c*] + (*ρ*[*n*]−*ρ*[*w*])*g**z*\
  \ (2.133)\n\n![image](img/F000022si366.png)(2.133)\n\n利用流势，两相的达西定律变为：\n\n$\\begin{matrix}\
  \ {\\\\mathbf{u}_{\\alpha} = - \\\\lambda_{\\alpha}\\\\left( S_{w} \\right)\\mathbf{k}\\\
  nabla\\\\Phi_{\\alpha},} & {\\\\alpha = n,w} \\\\\\\\ \\\\end{matrix}$ (2.134)\n\
  \n![image](img/F000022si367.png)(2.134)\n\n如果两个流势都取值 `Φ`[*w*]![image](img/F000022si368.png)，则“表观”速度\
  \ `u`[*α*]![image](img/F000022si369.png) 为总达西速度：\n\n`u`[*α*] : = − `λ`[*t*]  **k**∇`Φ`[*w*]\
  \ (2.135)\n\n![image](img/F000022si370.png)(2.135)\n\n注意，表观速度 `u`[*α*]![image](img/F000022si371.png)\
  \ 与湿相速度具有相同的驱动力，但具有更平滑的迁移率 `λ`[*t*]![image](img/F000022si372.png) (`λ`[*t*] = `λ`[*n*]− `λ`[*w*]`)。将“毛细”速度\
  \ `u`[*c*]![image](img/F000022si374.png) 定义为：\n\n`u`[*c*] : = − `λ`[*n*] **k**∇`Φ`[*c*]\
  \ (2.136)\n\n![image](img/F000022si375.png)(2.136)\n\n很容易得到：\n\n`u`[*t*] = `u`[*n*] + `u`[*w*] = `u`[*a*] + `u`[*c*]\
  \ (2.137)\n\n![image](img/F000022si376.png)(2.137)\n\n在 HF-IMPES 方案中，每个时间步应进行三个计算步骤：\n\
  \n1.  给定 `S`[*w*]![image](img/F000022si377.png) 并找到 `u`[*c*] ∈ `V`[*h*]![image](img/F000022si378.png)\
  \ 使得：\n    $\\begin{matrix} {\\\\left( \\mathbf{u}_{c},\\\\mathbf{v} \\right) =\
  \ \\\\left( {-lambda_{n}\\\\mathbf{k}\\nabla\\\\Phi_{c}\\\\left( S_{w} \\right),\\\
  \\mathbf{v} \\right),} & \\\\forall \\\\mathbf{v} \\in V_{h} \\end{matrix}$ (2.138)\n\
  ![image](img/F000022si379.png)(2.138)\n    这是标准有限元法 (FEM) 的一半。\n\n2.  给定 `S`[*w*]![image](img/F000022si380.png)\
  \ 和 `u`[*c*]![image](img/F000022si381.png)，并求解 `u`[*α*]![image](img/F000022si382.png)\
  \ 和 `Φ`[*w*]![image](img/F000022si383.png)：\n    $\\begin{matrix} {\\\\nabla \\\
  cdot \\\\mathbf{u}_{a} = q_{t} - \\\\nabla \\cdot \\\\mathbf{u}_{c},} & {\\\\mathbf{u}_{a}\
  \ = - \\\\lambda_{t}\\\\left( S_{w} \\\\right)\\\\mathbf{k}\\\\nabla\\\\Phi_{w}}\
  \ \\\\\\\\ \\\\end{matrix}$ (2.139)\n![image](img/F000022si384.png)(2.139)\n\n3.\
  \  给定 `u`[*α*]![image](img/F000022si385.png)、`Φ`[*w*]![image](img/F000022si386.png)\
  \ 和当前的 `S`[*w*]![image](img/F000022si387.png)，求解下一个时刻的 `S`[*w*]![image](img/F000022si388.png)：\n\
  \    $\\phi\\frac{\\partial S_{w}}{\\partial t} + \\nabla \\cdot \\left( {f_{w}\\\
  left( S_{w} \\right)\\\\mathbf{u}_{a}} \\right) = q_{w}\\left( {S_{w},\\\\Phi_{w}}\
  \ \\right)$ (2.140)\n![image](img/F000022si389.png)(2.140)\n\n对于不同的毛细压力函数，它重现了具有预期不连续性的饱和解。与标准的\
  \ IMPES 一样，HF-IMPES 公式比全隐式方案更易于实现。它成功地将流势与饱和度解耦，且总速度 `u`[*t*]![image](img/F000022si390.png)\
  \ 位于 `H(div)`![image](img/F000022si391.png) 空间。HF-IMPES 方案对于湿相是局部质量守恒的。然而，为了数值稳定正值性，它仍然需要很小的时间步长，且“毛细”速度\
  \ `u`[*c*] = − `λ`[*t*] **k**∇`Φ`[*w*]  与湿相速度具有相同的驱动力，但具有更平滑的迁移率 `λ`[*t*]![image](img/F000022si372.png)。与标准\
  \ IMPES 类似，HF-IMPES 方案无法（局部或全局）保持非湿相的守恒。结果是它无法（局部或全局）保持总流体混合物的守恒。IMPES 方案可能会产生大于\
  \ 1 的湿相饱和度。\n\n### 2.4.2 隐式压力、显式饱和度方法用于可压缩流\n\n#### 2.4.2.1 可压缩两相流\n\n对于孔介质中的不相凝两相压缩流（等热），质量守恒方程为：\n\
  \n$\\begin{matrix} {\\\\frac{\\partial\\left( \\\\phi S_{\\alpha}\\\\rho_{\\alpha}\
  \ \\\\right)}{\\partial t} + \\\\nabla \\cdot \\\\left( \\\\rho_{\\alpha}\\\\mathbf{u}_{\\\
  alpha}} \\\\right) = q_{m,\\\\alpha},} & {\\\\alpha = n,w} \\\\\\\\ \\\\end{matrix}$\
  \ (2.141)\n\n![image](img/F000022si393.png)(2.141)\n\n扩展达西定律：\n\n$\\mathbf{u}_{\\\
  alpha} = - \\\\frac{k_{r\\alpha}(S_{w})}{\\mu_{\\alpha}}\\\\mathbf{k}(\\nabla p_{\\\
  alpha} - \\rho_{\\alpha}\\\\mathbf{g}),\\quad\\alpha = n,w$ (2.142)\n\n![image](img/F000022si394.png)(2.142)\n\
  \n毛细压力：\n\n`p`[*n*] − `p`[*w*] = `p`*c* (2.143)\n\n![image](img/F000022si395.png)(2.143)\n\
  \n状态方程 (EOS)：\n\n$\\begin{matrix} {\\\\rho_{w} = \\\\rho_{w}\\\\left( {p_{w},T \\\
  \\right),} & {\\\\rho_{n} = \\\\rho_{n}\\\\left( {p_{n},T \\\\right)} \\\\\\\\ \\\
  \\end{matrix}$ (2.144)\n\n![image](img/F000022si396.png)(2.144)\n\n饱和度约束：\n\n`S`[*w*] + `S`[*n*] = 1\
  \ (2.145)\n\n![image](img/F000022si397.png)(2.145)\n\n结合适当的边界条件 (B.Cs) 和初始条件 (I.Cs)。\n\
  \n#### 2.4.2.2 两相流体压缩性\n\n每相的流体压缩性为：\n\n$c_{f,w} = - \\frac{1}{V_{w}}\\left( \\\
  frac{\\partial V_{w}}{\\partial p_{w}} \\right)_{T} = \\frac{1}{\\rho_{w}}\\left(\
  \ \\frac{\\partial\\rho_{w}}{\\partial p_{w}} \\right)_{T}$ (2.146)\n\n![image](img/F000022si398.png)(2.146)\n\
  \n\n\n\n\n$c_{f,n} = - \\frac{1}{V_{n}}\\left( \\frac{\\partial V_{n}}{\\partial\
  \ p_{n}} \\right)_{T} = \\frac{1}{\\rho_{n}}\\left( \\frac{\\partial\\rho_{n}}{\\\
  partial p_{n}} \\right)_{T}$ (2.147)\n\n![image](img/F000022si399.png)(2.147) \n\
  \n回想岩石性，\n\n$R = \\frac{1}{\\phi}\\left( \\frac{\\partial\\phi}{\\partial p} \\\
  right)_{T}$ (2.148)\n\n![image](img/F000022si400.png)(2.148) \n\n其中应选择某一相的压力。\n\n\
  忽略毛细压力，流体混合物的等温压缩性可以定义为\n\n$c_{f} = - \\frac{1}{V_{f}}\\left( \\frac{\\partial V_{f}}{\\\
  partial p} \\right)_{T}$ (2.149)\n\n![image](img/F000022si401.png)(2.149) \n\n通过简单的变形可以发现\n\
  \n$c_{f} = - \\frac{1}{V_{w} + V_{n}}\\left( \\frac{\\partial\\left( {V_{w} + V_{n}}\
  \ \\right)}{\\partial p} \\right)_{T} = - \\frac{V_{w}}{V_{w} + V_{n}}\\frac{\\\
  left( {{\\{\\partial V_{w}}/{\\partial p}} \\right)_{T}}{V_{w}} - \\frac{V_{n}}{V_{w}\
  \ + V_{n}}\\frac{\\left( {{\\{\\partial V_{n}}/{\\partial p}} \\right)_{T}}{V_{n}}\
  \ = c_{f,w}S_{w} + c_{f,n}S_{n}$ (2.150)\n\n![image](img/F000022si402.png)(2.150)\
  \ \n\n其中每一相的流体压缩性为 `c[f,α]`= = − (1/*V[α]*])(∂V[α]/∂p)[T] = (1/*ρ[α]*])(∂ρ[α]/∂p)[T], `α` = `w`, `n`![image](img/F000022si403.png).\n\
  \n### 2.4.2.3 两相流的压力方程\n\n对于 IMPES 方法也可以推导出以下压力方程：\n\n$\\phi c_{tot}\\frac{\\partial\
  \ p}{\\partial t} + {\\sum_{\\alpha = n,w}{\\frac{1}{\\rho_{\\alpha}}}\\nabla \\\
  cdot \\left( {\\\\rho_{\\alpha}\\mathbf{u}_{\\alpha}}} \\right) = q_{tot}}}$ (2.151)\n\
  \n![image](img/F000022si404.png)(2.151) \n\n其中 `c[tot]` = `c[f,w]S[w]` + `c[f,n]S[n]` + `c[R]`![image](img/F000022si405.png);\
  \ 岩石压缩性 `c[R]` = (1/*ϕ*)(∂ϕ*/∂p)[T]![image](img/F000022si406.png); `q[tot]` = `q[m,w]/ρ[w]` + `q[m,n]/ρ[n]`![image](img/F000022si407.png).\n\
  \n注意的是，通过简单的求和来形成压力方程是错误的：\n\n${\\sum_{\\alpha = w,n}\\frac{\\partial\\left( {\\\
  \\phi S_{\\alpha}\\rho_{\\alpha}} \\right)}{\\partial t} + {\\sum_{\\alpha = w,n}{\\\
  nabla \\cdot \\left( {\\\\rho_{\\alpha}\\mathbf{u}_{\\alpha}}} \\right)}} = {\\\
  sum_{\\alpha = w,n}q_{m,\\alpha}}$ (2.152)![image](img/F000022si408.png)\n\n${\\\
  sum_{\\alpha = w,n}\\frac{\\partial\\left( {\\\\phi S_{\\alpha}c_{\\alpha}} \\right)}{\\\
  partial t} + {\\sum_{\\alpha = w,n}{\\nabla \\cdot \\left( {\\\\rho_{\\alpha}\\\
  mathbf{u}_{\\alpha}}} \\right)}} = {\\sum_{\\alpha = w,n}q_{\\alpha}}$ (2.153)![image](img/F000022si409.png)\n\
  \n形成压力方程正确的方法是应用权重 $\\overline{V}_{i}$![image](img/F000022si410.png)。注意不相容两相油（水）的摩尔体积与纯油（水）的摩尔体积相同：\n\
  \n${\\sum_{\\alpha = w,n}\\frac{1}{c_{\\alpha}}\\frac{\\partial\\left( {\\\\phi\
  \ S_{\\alpha}c_{\\alpha}} \\right)}{\\partial t} + {\\sum_{\\alpha = w,n}\\frac{1}{c_{\\\
  alpha}}\\nabla \\cdot \\left( {\\\\c_{\\alpha}\\mathbf{u}_{\\alpha}} \\right)}}\
  \ = {\\sum_{\\alpha = w,n}\\frac{1}{c_{\\alpha}}q_{\\alpha}}$ (2.154)![image](img/F000022si411.png)\n\
  \n在这种情况下，饱和度的导数不再出现。为了简化，首先假设压力为零，摩尔体积加权求和等于 `方程 (2.151)`。在非零毛细力的一般形式下，压力方程为：\n\n\
  $\\begin{array}{l} {\\frac{\\partial\\left( {\\\\phi\\rho_{\\alpha}S_{\\alpha}}\
  \ \\right)}{\\partial t} = \\left( {\\\\frac{\\partial\\phi}{\\partial p_{\\alpha}}}\\\
  rho_{\\alpha} \\\\ \\phi\\frac{\\partial\\rho_{\\alpha}}{\\partial p_{\\alpha}}}\
  \ \\right)\\frac{\\partial p_{\\alpha}}{\\partial t}S_{\\alpha} + \\\\phi\\rho_{\\\
  alpha}\\frac{\\partial S_{\\alpha}}{\\partial t}} \\\\ {= \\\\phi\\rho_{\\alpha}\\\
  left( {c_{R} + c_{f,\\\\alpha}} \\right)\\frac{\\partial p_{\\alpha}}{\\partial\
  \ t}S_{\\alpha} + \\\\ \\phi\\rho_{\\alpha}\\frac{\\partial S_{\\alpha}}{\\partial\
  \ t}} \\\\ {= q_{m,a} - \\\\nabla \\cdot \\left( {\\\\rho_{\\alpha}\\mathbf{u}_{\\\
  alpha}} \\right)} \\\\ \\end{array}$ (2.155)![image](img/F000022si412.png)\n\n加权求和得到：\n\
  \n$\\phi\\left( {c_{R} + c_{f,w}S_{w} + c_{f,n}S_{n}} \\right)\\frac{\\partial p_{w}}{\\\
  partial t} = {\\sum_{\\alpha = n,w}q_{\\alpha}} - \\phi c_{f,n}S_{n}\\frac{\\partial\
  \ p_{c}}{\\partial t} - {\\sum_{\\alpha = n,w}\\frac{1}{\\rho_{\\alpha}}}\\nabla\
  \ \\cdot \\left( {\\\\rho_{\\alpha}\\mathbf{u}_{\\alpha}} \\right)$ (2.156)![image](img/F000022si413.png)(2.156)\
  \ \n\n因此得到了下面的压力方程：\n\n$\\phi c_{tot}\\frac{\\partial p_{w}}{\\partial t} + {\\\
  sum_{\\alpha = n,w}\\frac{1}{\\rho_{\\alpha}}}\\nabla \\cdot \\left( {\\\\rho_{\\\
  alpha}\\mathbf{u}_{\\alpha}} \\right) = q_{tot}$ (2.157)![image](img/F000022si414.png)(2.157)\
  \ \n\n其中 $q_{tot} = {\\sum_{\\alpha = n,w}q_{\\alpha}} - \\phi c_{f,n}S_{n}\\left(\
  \ {{\\{\\partial p_{c}}/{\\partial t}} \\right)$![image](img/F000022si415.png).\n\
  \n将扩展达西定律 `[(2.72)]` 代入 `[方程 (2.158)]` 得：\n\n$\\phi c_{tot}\\frac{\\partial p_{w}}{\\\
  partial t} - {\\sum_{\\alpha = n,w}\\frac{1}{\\rho_{\\alpha}}}\\nabla \\cdot \\\
  left\\lbrack {\\\\rho_{\\alpha}\\mathbf{k}\\left( {\\\\nabla p_{\\alpha}} - \\\\\
  rho_{\\alpha}\\mathbf{g}} \\right)} \\right\\rbrack = q_{tot}$ (2.158)![image](img/F000022si416.png)(2.158)\
  \ \n\n重组 `[方程 (2.158)]` 得：\n\n$\\phi c_{tot}\\frac{\\partial p_{w}}{\\partial t}\
  \ - {\\sum_{\\alpha = n,w}\\frac{1}{\\rho_{\\alpha}}}\\nabla \\cdot \\left( {\\\\\
  rho_{\\alpha}\\mathbf{k}\\nabla p_{w}} \\right) = {RHS}\\left( {p_{w},S_{w}} \\\
  right)$ (2.159)![image](img/F000022si417.png) \n\n其中 `RHS_pres` = $q_{tot} + \\\
  left( {{\\rho_{n}\\mathbf{k}\\nabla p_{c}} \\right)}/\\rho_{n} \\right) - {\\sum_{\\\
  alpha = n,w}\\left( {1/\\rho_{\\alpha}} \\right)}\\nabla \\cdot \\left( {\\\\rho_{\\\
  alpha}\\mathbf{g}} \\right)$![image](img/F000022si418.png).\n\n### 2.4.2.4 两相流的饱和方程\n\
  \n回想饱和方程，我们有：\n\n$\\frac{\\partial\\left( {\\\\phi\\rho_{w}S_{w}} \\right)}{\\partial\
  \ t} = {RHS}\\left( {p_{w},S_{w}} \\right)$ (2.160)\n\n![image](img/F000022si419.png)(2.160)\
  \ \n\n其中 $\\begin{array}{l} {{RHS}_{sat}\\left( {p_{w},S_{w}} \\right) = q_{m,w}\\\
  left( {p_{w},S_{w}} \\right) - \\nabla \\cdot \\left( {f_{w}\\left( S_{w}} \\right)\\\
  rho_{w}\\mathbf{u}_{t}(p_{w},S_{w})} \\right)} \\\\\\\\ {- \\nabla \\cdot \\left(\
  \ {\\\\mathbf{k}f_{w}\\left( S_{w}} \\right)\\rho_{w}\\lambda_{n}(S_{w})\\left\\\
  lbrack {\\\\left({{dp_{c}}/{dS_{w}}} \\right)\\nabla S_{w} + (\\rho_{w} - \\rho_{n})\\\
  mathbf{g}} \\right\\rbrack} \\right)} \\\\\\\\ \\end{array}$![image](img/F000022si420.png).\n\
  \n可压缩两相流的隐式压力、显式饱和度表述\n\n对于压缩两相流的 IMPES 方法与不压缩两相流相同。压缩两相流的相表述由关于两个主要未知量 *p*[*n*]\
  \ 和 *S*[*w*] 的两个主方程组成。\n\n\n\n\n\n$\\phi c\\_{tot}\\frac{\\partial p\\_{w}}{\\partial\
  \ t} - {\\sum\\limits\\_{\\alpha = n,w}\\frac{1}{\\rho\\_{\\alpha}}}\\\\nabla \\\
  cdot \\left( {\\rho\\_{\\alpha}\\lambda\\_{\\alpha}\\mathbf{k}\\nabla p\\_{w}} \\\
  right) = {RHS}\\_{pres}\\left( {p\\_{w},S\\_{w}} \\right)$ (2.161)\n\n![image](img/F000022si421.png)(2.161)\n\
  \n饱和度方程：\n\n$\\frac{\\partial\\left( {\\\\phi\\rho\\_{w}S\\_{w}} \\right)}{\\partial\
  \ t} = {RHS}\\_{sat}\\left( {p\\_{w},S\\_{w}} \\right)$ (2.162)\n\n![image](img/F000022si422.png)(2.162)\n\
  \n在 IMPES 方法的压力计算中，对于每个 `n`=0, 1,…\n\n$\\phi^{(n)}c\\_{tot}^{(n)}\\frac{p\\_{w}^{({n\
  \ + 1})} - p\\_{w}^{(n)}}{t\\_{n + 1} - t\\_{n}} - {\\sum\\limits\\_{\\alpha = n,w}\\\
  frac{1}{\\rho\\_{\\alpha}^{(n)}}}\\\\nabla \\cdot \\left( {\\rho\\_{\\alpha}^{(n)}\\\
  lambda\\_{\\alpha}^{(n)}\\mathbf{k}\\nabla p\\_{w}^{({n + 1})}} \\right) = {RHS}\\\
  _{pres}\\left( {p\\_{w}^{({n + 1})},S\\_{w}^{(n)}} \\right)$ (2.163)\n\n![image](img/F000022si423.png)(2.163)\n\
  \n在这种经典的 IMPES 方法中，饱和度方程是针对 `S[`w`] 显式求解的；也就是说，对于每个 `n`=0, 1,…\n\n$\\frac{\\phi^{({n\
  \ + 1})}\\rho\\_{w}^{({n + 1})}S\\_{w}^{({n + 1})} - \\phi^{(n)}\\rho\\_{w}^{(n)}S\\\
  _{w}^{(n)}}{t\\_{n + 1} - t\\_{n}} = {RHS}\\_{sat}\\left( {p\\_{w}^{({n + 1})},S\\\
  _{w}^{(n)}} \\right)$ (2.164)\n\n![image](img/F000022si424.png)(2.164)\n\n## 2.5\
  \ 井筒建模\n\n### 2.5.1 井建模概述\n\n油层模拟是预测流体流过多隙介质（通常是油、水和气）的重要方法，它已广泛应用于石油行业的新油田开发和老油田增采。从油井管理的角度来看，（1）对于新油田，油层模拟可以通过识别所需的井数、最优的完井方案以及预期的油、水、气产量来帮助开发；（2）对于正在进行的油层管理，油层模拟可以帮助通过水力压裂等方法提高采收率，并表示高倾斜井或水平井。\n\
  \n井建模的基本任务包括对进入/流井筒的流动进行精确建模，以及建立精确的井方程，以便在给定产量或注水率时计算井底压力（BHP），或在已知井底压力时计算速率。在现场尺度数值模拟中，井建模的难度在于，压力梯度最大的区域离井最近，且其尺寸远小于网格块的空间尺寸。在井筒周围使用局部网格细化（local\
  \ grid refinement）可以缓解这个问题，但可能导致油层模拟中时间步长受到不实际的限制。此外还存在一些巨大的计算挑战。（1）不同尺度的三个区域（参见图\
  \ 2.5）：（a）井筒（由函数建模）、（b）近井区域，以及（c）远场区域。（2）空间多尺度物理场：近井附近微小区域的流动与远离井的区域的流动不同。（3）时间多尺度物理场：井附近的流动很快，而远处的流动很慢。（4）需要解决以下两种物理场的耦合：（a）近井附近微小区域的快速流动和（b）远离井的大区域的缓慢流动。（5）需要一种算法来处理多尺度物理场：在井附近使用解析解；在远离井的地方使用数值方法，例如单元中心有限差（CCFD）方法（其他数值方法，如\
  \ FEM 也适用）。\n\n![图 2.5 不同尺度的三个区域示意图。](img/F000022f02-05-978012820978.jpg)\n\n图 2.5\
  \ 不同尺度的三个区域示意图。\n\n### 2.5.2 井附近流动的解析解\n\n通常，井流方程是基于井附近流动为径向的假设建立的。这需要使用径向流的解析公式。这里考虑均质各向同性油层中的不可压缩单相稳态流。建模方程（不含重力项）为：\n\
  \n$\\nabla \\cdot u = q\\delta$ (2.165)\n\n![image](img/F000022si425.png)(2.165)\n\
  \n$u = -\\frac{k}{\\mu}\\nabla p$ (2.166)\n\n![image](img/F000022si426.png)(2.166)\n\
  \n其中 $\\delta$ 是狄拉克函数，代表位于井处；$\\hat{q}$ 是产量。为了获得方程 (2.165) 和方程 (2.166) 在井附近区域的解析解，采用了以下假设：\n\
  \n1. 井是二维的。\n2. 油层是均质各向同性的。\n3. 动力粘度 $\\mu$ 和密度 $\\rho$ 为常数。\n4. 井附近的流动是径向的。\n5.\
  \ 狄拉克函数 $\\delta$ 用于表示井。\n\n首先回顾圆坐标系，假设点 `P` 的三个坐标 (`r`, `phi`, `z`) 分别定义为径向距离、方位角和高度。圆坐标系中的算算子给出了梯度、散度和拉普拉斯算子的以下表达式：\n\
  \n$\\nabla f = \\frac{\\partial f}{\\partial r}\\mathbf{r} + \\frac{1}{r}\\frac{\\\
  partial f}{\\partial\\varphi}\\mathbf{\\varphi} + \\frac{\\partial f}{\\partial\
  \ z}\\mathbf{z}$ (2.167)\n\n![image](img/F000022si435.png)(2.167)\n\n$\\nabla \\\
  cdot A = \\frac{1}{r}\\frac{\\partial}{\\partial r}(rA_{r}) + \\frac{1}{r}\\frac{\\\
  partial A_{\\varphi}}{\\partial\\varphi} + \\frac{\\partial A_{z}}{\\partial z}$\
  \ (2.168)\n\n![image](img/F000022si436.png)(2.168)\n\n$\\nabla^{2}f = \\frac{1}{r}\\\
  frac{\\partial}{\\partial r}(r\\frac{\\partial f}{\\partial r}) + \\frac{1}{r^{2}}\\\
  frac{\\partial^{2}f}{\\partial\\varphi^{2}} + \\frac{\\partial^{2}f}{\\partial z^{2}}$\
  \ (2.169)\n\n![image](img/F000022si437.png)(2.169)\n\n由于单相流动被假设在井附近是径向的，井附近速度具有以下形式：\n\
  \n$u(r,\\theta) = u(r)\\left( \\begin{array}{l} \\cos\\theta \\\\ \\sin\\theta \\\
  \\ \\end{array} \\right)$ (2.170)\n\n![image](img/F000022si438.png)(2.170)\n\n其中\
  \ (`cos\\theta`,`sin\\theta`) 表示极坐标系。\n\n由于井位于原点，将方程 [(2.170)] 代入守恒律得到：\n\n$\\frac{1}{r}\\\
  frac{d}{dr}(ru) = 0,r > 0$ (2.171)\n\n![image](img/F000022si440.png)(2.171)\n\n\
  其解为 $u = C/r$，$C$ 为常数，且与 $\\hat{q}$ 成比，其中 $\\hat{q}$ 代表质量产量/注水率。例如，当井是注水井时，对于原点的任何小邻域\
  \ `B`（一个小圆），$\\hat{q}$ 是质量通量：\n\n$\\hat{q} = h[z]\\int_B \\rho u \\cdot n da(x)\
  \ = 2\\pi\\rho h[z]C$ (2.172)\n\n![image](img/F000022si445.png)(2.172)\n\n\n\n\n\
  \n其中 `n` 是垂直于 `B` 的外向单位法向量，`h[z]`![image](img/F000022si446.png) 是储层厚度（或含井网格的高度）。\n\
  \n很容易得到积分常数，\n\n$C = \\frac{\\widehat{q}}{2\\pi\\rho h_{z}}$ (2.173)\n\n![image](img/F000022si447.png)(2.173)\
  \ \n\n有了积分常数，达西速度的模值（等于达西速度的分量）具有以下解：\n\n$u = \\frac{\\widehat{q}}{2\\pi\\rho h_{z}r}$\
  \ (2.174)\n\n![image](img/F000022si448.png)(2.174) \n\n那么，达西速度具有以下解：\n\n$\\mathbf{u}\
  \ = u\\mathbf{n} = \\frac{\\widehat{q}}{2\\pi\\rho h_{z}r}\\left( {\\cos\\theta,\\\
  sin\\theta} \\right)^{T}$ (2.175)\n\n![image](img/F000022si449.png)(2.175) \n\n\
  其中 `u = C/rB n = r/|r| = r/*r`![image](img/F000022si450.png)。\n\n回想达西定律的分量，\n\n\
  $u = - \\frac{k}{\\mu}\\frac{\\partial p}{\\partial r}$ (2.176)\n\n![image](img/F000022si451.png)(2.176)\
  \ \n\n通过将 Eq. (2.175) 代入 Eq. (2.176) 并积分，可以得到以下方程：\n\n$p\\left( r \\right) = p\\\
  left( r^{O} \\right) - \\frac{\\mu\\widehat{q}}{2\\pi\\rho kh_{z}}\\ln\\frac{r}{r^{O}}$\
  \ (2.177)\n\n![image](img/F000022si452.png)(2.177) \n\n其中 `(r^(O),0)`![image](img/F000022si453.png)\
  \ 是参考点。上述方程是井附近的解析流体模型，在该方程的基础上，开发了适用于各种数值方法的井方程。\n\n### 2.5.3 使用网格中心有限差法进行井建模\n\
  \n#### 2.5.3.1 Peaceman 研究概述：三种不同的方法\n\n对于单相流，\n\n#### 2.5.3.2 正方形网格上的各向同性质：通过对称性简化\n\
  \n对于正方形网格，假设单相方程的求解时井位于网格中心，例如位于 `C = (i-0.5, j-0.5)`![image](img/F000022si460.png)。相邻的网格分别是四个中心位于\
  \ `W = (i-1.5, j-0.5)`![image](img/F000022si461.png)、`E = (i+0.5, j-0.5)`![image](img/F000022si462.png)、`S\
  \ = (i-0.5, j-1.5)`![image](img/F000022si463.png) 和 `N = (i-0.5, j+0.5)`![image](img/F000022si464.png)。\n\
  \n应用 CCFD（五点格式）得到：\n\n$\\begin{array}{l} \\frac{\\rho k}{\\mu}\\frac{p_{C} - p_{E}}{h_{x}}h_{z}\
  \ + \\frac{\\rho k}{\\mu}\\frac{p_{C} - p_{W}}{h_{x}}h_{z} + \\frac{\\rho k}{\\\
  mu}\\frac{p_{C} - p_{S}}{h_{x}}h_{z} + \\frac{\\rho k}{\\mu}\\frac{p_{C} - p_{N}}{h_{x}}h_{z}\
  \ = \\int_{S = h_{x}h_{y}}\\delta\\widehat{q}dA = \\widehat{q} \\end{array}$ (2.178)\n\
  \n![image](img/F000022si465.png)(2.178) \n\n假设正方形网格 `h[x] = h[y]`![image](img/F000022si466.png)，可以得到以下方程：\n\
  \n$\\frac{\\rho kh_{z}}{\\mu}\\left( 4p_{i-0.5,j-0.5} - p_{i-1.5,j-0.5} - p_{i+0.5,j-0.5}\
  \ - p_{i-0.5,j-1.5} - p_{i-0.5,j+0.5} \\right) = \\widehat{q}$ (2.179)\n\n![image](img/F000022si467.png)(2.179)\
  \ \n\n利用解 `p` 的对称性：\n\n`p[i-1.5,j-0.5] = p[i+0.5,j-0.5] = p[i-0.5,j-1.5] = p[i-0.5,j+0.5]`\
  \ (2.180)\n\n![image](img/F000022si468.png)(2.180) \n\nEq. (2.179) 可以简化为：\n\n$\\\
  frac{\\rho kh_{z}}{\\mu}\\left( p_{i-0.5,j-0.5} - p_{i+0.5,j-0.5} \\right) = \\\
  frac{\\widehat{q}}{4}$, 或 $p_{C} - p_{E} = \\frac{\\mu\\widehat{q}}{4\\rho kh_{z}}$\
  \ (2.181)\n\n![image](img/F000022si469.png)(2.181) \n\n#### 2.5.3.3 井压\n\nBHP 或底压是井底压力，通常以每平方英寸（psi）为单位。在静态流体填充井中，BHP\
  \ 可以通过公式计算：\n\n`BHP = MW * depth * 0.052` (2.182)\n\n![image](img/F000022si470.png)(2.182)\n\
  \n其中 `MW` 是每加仑泥重，`depth`![image](img/F000022si471.png) 是英尺深度，如果使用这些单位，0.052 是转换因子。\n\
  \n#### 2.5.3.4 底压与网格中心压力的关系\n\n假设精确计算了相邻网格的压力，这意味着解析井模型在 `E` 处是精确近似。如果给出 `r[w]`![image](img/F000022si472.png)（井半径）和\
  \ `BHP`![image](img/F000022si473.png)，则根据解析方程：\n\n$p_{E} = p_{bh} - \\frac{\\mu\\\
  widehat{q}}{2\\pi\\rho kh_{z}}\\left( \\frac{h}{r_{w}} \\right)$ (2.183)\n\n![image](img/F000022si474.png)(2.183)\n\
  \n应该注意，BHP 应超过地层压力以避免地层流进入井筒。然而，如果 BHP 太高，弱地层可能会破裂导致井筒流失。现在得到以下方程：\n\n$p_{C} - p_{E}\
  \ = \\frac{\\mu\\widehat{q}}{4\\rho kh_{z}}$ (2.184)\n\n![image](img/F000022si475.png)(2.184)\
  \ \n\n$p_{E} = p_{bh} - \\frac{\\mu\\widehat{q}}{2\\pi\\rho kh_{z}}\\left( \\frac{h}{r_{w}}\
  \ \\right)$ (2.185)\n\n![image](img/F000022si476.png)(2.185) \n\n相加 Eqs. (2.184)\
  \ 和 (2.185) 得：\n\n$p_{C} = p_{bh} + \\frac{\\mu\\widehat{q}}{2\\pi\\rho kh_{z}}\\\
  left( \\ln\\left( \\frac{r_{w}}{h} \\right) + \\frac{\\pi}{2} \\right)$ (2.186)\n\
  \n![image](img/F000022si477.png)(2.186) \n\n如果引入等效半径，上述方程可以写为 $p_{C} = p_{bh} +\
  \ \\frac{\\mu\\widehat{q}}{2\\pi\\rho kh_{z}}\\ln\\left( \\frac{r_{w}}{r_{e}} \\\
  right)$![image](img/F000022si478.png)，\n\n`r[e] = alpha[1]*h = e^(-pi/2)*h \\approx\
  \ 0.20788h \\approx 0.2h` (2.187)\n\n![image](img/F000022si479.png)(2.187) \n\n\
  那么对于注井：\n\n$\\widehat{q} = \\frac{2\\pi\\rho kh_{z}}{\\mu\\ln\\left( \\frac{r_{e}}{r_{w}}\
  \ \\right)}\\left( p_{bh} - p \\right)$ (2.188)\n\n![image](img/F000022si480.png)(2.188)\
  \ \n\n当井为生产井时，井量为：\n\n$\\left |\\widehat{q}\\right| = -\\widehat{q} = \\frac{2\\\
  pi\\rho kh_{z}}{\\mu\\ln\\left( \\frac{r_{e}}{r_{w}} \\right)}\\left( p - p_{bh}\
  \ \\right)$ (2.189)\n\n![image](img/F000022si481.png)(2.189)\n\n### 2.5.4 井建模的扩展\n\
  \n#### 2.5.4.1 扩展到各向异性介质\n\n上述井模型可以扩展到矩形网格，结合重力影响、各向异性储层、皮效应、水平井和多相流的影响。这里考虑井模型向前四种效应的扩展。带有这些单相流效应以及各向异性（但仍是对角阵，而非完整张量）渗透率\
  \ `k = diag(k[11],k[22],k[33])![image](img/F000022si482.png)，井模型扩展为：\n\n$\\widehat{q}\
  \ = \\frac{2\\pi\\rho h_{z}\\sqrt{k_{11}k_{22}}}{\\mu\\left( \\ln\\left( \\frac{r_{e}}{r_{w}}\
  \ \\right) + s_{k} \\right)}\\left( p_{bh} - p - \\rho g\\left( z_{bh} - z \\right)\
  \ \\right)$ (2.190)\n\n![image](img/F000022si483.png)(2.190)\n\n\n\n\n\n其中 `g` 是重力加速度；`z`\
  \ 是深度；`z[bh]`![image](img/F000022si484.png) 是井底水位深度；`r[e]`![image](img/F000022si485.png)\
  \ 是等效半径，本文针对非正方形网格或各向异性介质；$\\sqrt{k_{11}k_{22}}$![image](img/F000022si486.png) 是由于坐标变换产生的因子：${x_{1}}^{\\\
  prime} = x_{1}/\\sqrt{k_{11}}$![image](img/F000022si487.png) 和 ${x_{2}}^{\\prime}\
  \ = x_{2}/\\sqrt{k_{22}}$![image](img/F000022si488.png);以及 `s[k]`![image](img/F000022si489.png)\
  \ 是阻皮系数。\n\n## 2.5.4.2 等效半径与井指数\n\n在非正方形网格和各向异性介质的情况下，等效半径 `r[e]`![image](img/F000022si490.png)可以通过下公式计算：\n\
  \n$r_{e} = \\frac{0.14\\left( {left( {k_{22}/k_{11}} \\right)^{1/2}h_{1}^{2} + \\\
  left( {k_{11}/k_{22}} \\right)^{1/2}h_{2}^{2}} \\right)^{1/2}}{0.5\\left( {left(\
  \ {k_{22}/k_{11}} \\right)^{1/4} + \\left( {k_{11}/k_{22}} \\right)^{1/4}} \\right)}$\
  \ (2.191)\n\n![image](img/F000022si491.png)(2.191) \n\n其中 `h[1]`![image](img/F000022si492.png)\
  \ 和 `h[2]`![image](img/F000022si493.png) 是包含垂直井的网格单元的`x[1]`和`x[2]`方向网格尺寸。\n\n定义如下井指数：\n\
  \n$WΙ = \\frac{2\\pi h_{z}\\sqrt{k_{11}k_{22}}}{\\ln\\left( {r_{e}/r_{w}} \\right)\
  \ + s_{k}}$ (2.192)\n\n![image](img/F000022si494.png)(2.192) \n\n利用 `WI` 可以得到以下方程：\n\
  \n$\\widehat{q} = WΙ\\frac{\\rho}{\\mu}\\left( {p_{bh} - p - \\rho g\\left( {z_{bh}\
  \ - z} \\right)} \\right)$ (2.193)\n\n![image](img/F000022si495.png)\n\n其他扩展还包括水平井、多相流、偏井和多层模型。\n\
  \n## 2.6 多孔介质中的溶质传输\n\n### 2.6.1 多孔介质中溶质传输简介\n\n#### 2.6.1.1 术语\n\n在介绍多孔介质中的溶质传输之前，首先给出基本定义。通常，溶液是两种或多种物质形成的单相均匀混合物，可以分为固溶和流溶液（液/气）。溶质是溶液中质量占比较小的物质，溶剂是质量占比较大的物质，溶质和溶剂都是溶液的组分。在此部分，使用“溶液”而非“流体”表示关注化学方面而非物理方面。\n\
  \n![image](img/F000022f02-97812809578.jpg)\n\n多孔介质中的传输是指流体及其组分通过地壳或在不发生化学反应的情况下进行传输。建立各种传输模型至关重要，以便更好地理解生活和工程中的某些现象，包括天然水的组成、矿床的成因、地质层中岩石响应工业废物、蒸汽或二氧化碳注入的形成和溶解、酸性水的产生以及金属浸出。例如，依靠传输模型预测污染物羽云和放射性核素在废物库中的迁移性。\n\
  \n#### 2.6.1.2 多孔介质溶质传输的子过程\n\n多孔介质中的溶质传输包含两个方面：(1) 随流运动。它源于流体的流动，而流动由流体的物理性质、几何形状以及边界固体的物理化学性质决定，在多相系统中由流体的性质决定。这一过程称为对流（或平流）；(2)\
  \ 流体内部运动。它源于较小实体的运动，包括分子扩散（热运动）和色散（或机械色散）。\n\n色散与明确表示的流之间的区别取决于尺度，因为对流在大尺度上可能仍然变化。在溶质传输物理研究中，确定对流与色散分离的最佳尺度并量化后者仍然具有挑战。分子扩散总是活跃的，本质上是随时间扩散，它是各向同性的；相比之下，色散是多孔介质中流动的直接结果，基本上是距离和平均速度的函数。它是各向异性的。\n\
  \n#### 2.6.1.3 溶质传输建模\n\n反应传输模型源于几种不同的学派（水文学模型、地球化学模型、多组分反应传输模型）。水文学家主要关注具有线性衰变项假设的质量传输的物理性质。例如，对流-色散方程可以通过阻滞因子修正并在假设线性吸附的情况下解析求解。然而，解析解仅限于简单的系统。\n\
  \n通常，现代反应传输建模涉及复杂的物理和化学过程：(1) 质量传输：对流、分子扩散、水力色散、胶体辅助传输；(2) 热传输：对流、传导；(3) 介质变形：区域的压缩或扩张、裂隙形成；(4)\
  \ 地球化学反应：酸碱反应；水合物络合；矿物溶解和沉淀；氧化还原（氧化 ox）；吸附、离子交换和表面络合；气体溶解和析出；稳定同位素分配；放射性衰变。\n\n\
  ### 2.6.2 多孔介质溶质传输建模方程\n\n#### 2.6.2.1 简化溶质传输场景\n\n我们考虑占据多孔介质整个孔隙空间的流相中的溶质传输。显然，这是与多孔介质中单相流的质量传输。为了简化溶质传输过程，这里忽略了流相不同组分之间的化学反应、生物降解或细菌活动导致的成分数量减少或增加。吸附、脱吸和放射性衰变将在书中考虑。\n\
  \n#### 2.6.2.2 溶质传输方程：对流与扩散-色散\n\n1. 溶质传输方程\n\n流相中溶质的质量守恒由下式给出：\n\n```\n\\frac{\\\
  partial\\left( {\\phi c\\rho} \\right)}{\\partial t} + \\nabla \\cdot \\left( {c\\\
  rho\\mathbf{u} - \\rho\\mathbf{D}\\nabla c} \\right) = q_{c}^{-} + q_{c}^{+} (2.194)\n\
  ```\n\n![image](img/F000022si496.png)(2.194) \n\n其中 `c` 是组分浓度（流相中的体分数）；`**D**` 是扩散-色散张量：\n\
  \n```\n\\mathbf{D}(u) = *ϕ*(*d*[*m*]**Ι**+|**u**|(*d*[*l*]**E**(**u**)+*d*[*t*]**E**^⊥(**u**)))\
  \ (2.195)\n```\n\n![image](img/F000022si497.png)(2.195) \n\n\n\n\n\n其中 `d``m`, `d``l`,\
  \ 和 `d``t` 分别是分子、纵向和横向扩散系数。从物理上讲，`d``l` 通常大于 `d``t`，因为张量扩散比分子扩散更为显著；|`u`|image 是\
  \ `u` = (`u`[1],`u`[2],`u`[3])![image](img/F000022si504.png), $\\left| \\mathbf{u}\
  \ \\right| = \\sqrt{u\\_{1}^{2} + u\\_{2}^{2} + u\\_{3}^{2}}$![image](img/F000022si505.png);\
  \ `E`^⊥(`u`) = `I` − `E`(`u`)![image](img/F000022si506.png), `E`(`u`)![image](img/F000022si507.png)\
  \ 是沿速度方向的正交投影，\n\n$\\mathbf{E}\\left( \\mathbf{u} \\right) = \\frac{1}{\\\\left|\
  \ \\mathbf{u} \\right|^{2}}\\left( \\begin{array}{l} {u\\_{1}^{2}u\\_{1}u\\_{2}u\\\
  _{1}u\\_{3}} \\\\\\\\ {u\\_{2}u\\_{1}u\\_{2}^{2}u\\_{2}u\\_{3}} \\\\\\\\ {u\\_{3}u\\\
  _{1}u\\_{3}u\\_{2}u\\_{3}^{2}} \\\\\\\\ \\\\end{array} \\right)$ (2.196)\n\n![image](img/F000022si508.png)(2.196)\n\
  \n`q`[`c`]^−![image](img/F000022si509.png) 和 `q`[`c`]^+![image](img/F000022si510.png)\
  \ 在 公式 (2.194) 中通过下式计算\n\n$q\\_{c}^{-} = - {\\\\sum\\\\limits\\_{i}q\\_{1}^{(i)}}\\\
  left( {\\\\mathbf{x}^{(i)},t} \\\\right)\\delta\\\\left( {\\\\mathbf{x} - \\\\mathbf{x}^{(i)}}\
  \ \\\\right)\\left( {\\\\rho c} \\\\right)\\left( {\\\\mathbf{x},t} \\\\right)$\
  \ (2.197)\n\n![image](img/F000022si511.png)(2.197)\n\n$q\\_{c}^{+} = {\\\\sum\\\\\
  limits\\_{j}q\\_{2}^{(i)}}\\left( {\\\\mathbf{x}^{(j)},t} \\\\right)\\delta\\\\\
  left( {\\\\mathbf{x} - \\\\mathbf{x}^{(j)}} \\\\right)\\left( {\\\\rho^{(j)}c^{(j)}}\
  \ \\\\right)\\left( {\\\\mathbf{x},t} \\\\right)$ (2.198)\n\n![image](img/F000022si512.png)(2.198)\n\
  \n其中 `q`[1]^(`i`))![image](img/F000022si513.png) 是产率；`q`[2]^(`j`))![image](img/F000022si514.png)\
  \ 是注入率；`c`^(`j`))![image](img/F000022si515.png) 是源点处的指定浓度。\n\n## 2. 控制方程\n\n流体的达西定律为：\n\
  \n$\\mathbf{u} = - \\frac{1}{\\\\mu}\\\\mathbf{k}\\\\left( {\\\\nabla p - \\\\rho\
  \ g} \\\\right)$ (2.199)\n\n![image](img/F000022si516.png)(2.199)\n\n流体的质量平衡通过下式计算\n\
  \n$\\frac{\\\\partial\\\\left( {\\\\phi\\\\rho} \\\\right)}{\\partial t} + \\nabla\
  \ \\cdot \\left( {\\\\rho\\\\mathbf{u}} \\\\right) = q^{-} + q^{+}$ (2.200)\n\n\
  ![image](img/F000022si517.png)(2.200)\n\n其中 $q^{-} = - {\\\\sum\\\\limits\\_{i}{\\\
  rho q\\_{1}^{(i)}}\\}\\\\left( {\\\\mathbf{x}^{(i)},t} \\\\right)\\delta\\\\left(\
  \ {\\\\mathbf{x} - \\\\mathbf{x}^{(i)}} \\\\right)$![image](img/F000022si518.png),\
  \ $q^{+} = {\\\\sum\\\\limits\\_{j}{\\rho^{(j)}q\\_{2}^{(j)}}\\}\\\\left( {\\\\\
  mathbf{x}^{(j)},t} \\\\right)\\delta\\\\left( {\\\\mathbf{x} - \\\\mathbf{x}^{(j)}}\
  \ \\\\right)$![image](img/F000022si519.png)。\n\n### 2.6.2.3 `c` 和 `p` 的耦合系统\n\n\
  密度和粘度与 `p` 和 `c` 的关系如下：\n\n`ρ` = `ρ`(`p`,`c``), `μ` = `μ`(`p`,`c``) (2.201)\n\n\
  ![image](img/F000022si520.png)(2.201)\n\n在将达西定律代入守恒方程后，可以建立 `c` 和 `p` 的两个方程的耦合系统。\n\
  \n### 2.6.3 对流 \n\n#### 2.6.3.1 对流及其性质\n\n在工程、物理和地球科学中，对流指的是物质通过整体运动进行的输运。对流的一个生动例子是河流中污染物的输运。在对流过程中，流体携带了守恒量。通常情况下，任何物质或量都可以通过对流传输。\n\
  \n#### 2.6.3.2 守恒量的对流方程\n\n对于守恒量的对流方程在数学上通过下式表示（对于标量场![image](img/F000022si51.png)):\n\
  \n$\\frac{\\\\partial\\\\psi}{\\partial t} + \\nabla \\cdot \\left( {\\\\mathbf{u}\\\
  \\psi} \\\\right) = q$ (2.02)\n\n![image](img/F000022si52.png)(2.02)\n\n#### 2.6.3.3\
  \ 不压缩流的对流方程\n\n由于在大多数情况下流体是不压缩的，对流方程可以为：\n\n![image](img/F000022si53.png)(2.03)\n\
  \n$\\frac{\\\\partial\\\\psi}{\\partial t} + \\\\mathbf{u} \\cdot \\\\nabla\\\\\
  psi = q$ (2.03)\n\n![image](img/F000022si54.png)(2.03)\n\n如果流是稳态的，则![image](img/F000022si55.png)(2.04)\n\
  \n$\\\\mathbf{u} \\cdot \\\\nabla\\\\psi = q$ (2.04)\n\n![image](img/F000022si56.png)(2.04)\n\
  \n#### 2.6.3.4 求解对流方程的困难\n\n应当注意的是，由于双曲方程组，求解对流方程并不容易，关注通常集中在“冲击波”解。即使在一维恒定速度场中，$\\\
  frac{\\\\partial\\\\psi}{\\partial t} + u_{x}\\\\frac{\\\\partial\\\\psi}{\\partial\
  \ x} = 0$ (2.06)\n\n![image](img/F000022si33.png)(2.06)\n\n其中 `ψ`=`ψ`(`x`,`t`) 是被对流的标量场，`u`[`x]`\
  \ 是 `u` 的分量。![image](img/F000022si36.png)。\n\n### 2.6.4 迎流格式\n\n#### 2.6.4.1 迎流格式\n\
  \n在计算流体力学中，迎流格式表示求解双曲方程的一类数值离散方法。通常，迎流偏差格式或简单的迎流格式使用自适应或解敏感的有限差格式来数值模拟流场中的信息传播方向。这种格式试图通过使用特征速度符号决定的偏置差分来离散化双曲方程。\n\
  \n接下来考虑一维线性对流方程：\n\n$\\frac{\\\\partial c}{\\partial t} + u\\\\frac{\\\\partial\
  \ c}{\\partial x} = 0$ (2.07)\n\n![image](img/F000022si37.png)(2.07)\n\n它描述了沿 `x`\
  \ 轴以速度 `u` 传播的波。如果 `u` 为正，上述方程的传播波向右传播，`i` 的左侧被称为迎流侧，右侧是下游侧。同样，如果 `u` 为负，传播波则向左传播（此时左侧为下游侧，右侧为迎流侧）（参见图\
  \ 2.7）。\n\n![图 2.7 迎流格式示意图](img/F000022f02-07-9780128209578.jpg)\n\n图 2.7 迎流格式示意图。\n\
  \n\n\n\n由于波是从其上风侧传播的，因此认为上风侧包含比下风侧更多的信息更为合理。因此，使用上风侧更多的点来近似 `∂*u*/∂*x*![image](img/F000022si538.png)`\
  \ 也比使用下风侧更合理。如果用于空间导数 `∂*u*/∂*x*![image](img/F000022si539.png)` 的有限差分格式包含更多上风侧的点则该格式被称为上迎格式。\n\
  \n### 2.6.4.2 一阶上迎有限差分格式\n\n一阶上迎格式是最简单的上迎格式，其表达式如下：\n\n$\\frac{c\\_{i}^{n + 1} -\
  \ c\\_{i}^{n}}{\\Delta t} + u\\frac{c\\_{i}^{n} - c\\_{i - 1}^{n}}{\\Delta x} =\
  \ 0\\quad{for} u > 0$ (2.208a)\n\n![image](img/F000022si540.png)(2.208a) \n\n$\\\
  frac{c\\_{i}^{n + 1} - c\\_{i}^{n}}{\\Delta t} + u\\frac{c\\_{i + 1}^{n} - c\\_{i}^{n}}{\\\
  Delta x} = 0\\quad{for} u < 0$ (2.208b)\n\n![image](img/F000022si541.png)(2.208b)\
  \ \n\n一阶上迎格式的紧凑形式为\n\n`c*[*i*]^(*n* + 1) = *c*[*i*]^(*n*) ��−− *Δ**t*(*u*^+*c*[*x*]^−+*u*^−*c*[*x*]^+)`\
  \ (2.209)\n\n![image](img/F000022si542.png)(2.209) \n\n其中 `u*^+ = maxↆ(*u*,0)`![image](img/F000022si543.png),\
  \ `u*^− = minↆ(*u*,0)`![image](img/F000022si544.png), `c*[*x*]^− = (*c*[*i*]^(*n*)−*c*[*i* − 1]^(*n*))/*Δ**x*`![image](img/F000022si545.png)\
  \ 以及 `c*[*x*]^+ = (*c*[*i* + 1]^(*n*)−*c*[*i*]^(*n*))/*Δ**x*`![image](img/F000022si546.png).\n\
  \n格式 `(2.209` 具有以下性质：\n\n1. 如果满足下文给出的 CFL 条件，则格式稳定的：\n$\\alpha = \\left| \\frac{u\\\
  Delta t}{\\Delta x} \\right| \\leq 1$ (2.210)\n![image](img/F000022si547.png)(2.210)\
  \ \n\n2. 泰勒级数分析表明该格式在空间和时间上是一阶精度的。\n\n3. 修改波数分析表明，在存在大梯度的地方（由于需要高波数来表示陡峭），该格式会在解中引入严重的数值扩散/耗散。\n\
  \n## 2.7 多孔介质中的动态吸附\n\n### 2.7.1 吸附现象\n\n#### 2.7.1.1 吸附\n\n吸附是指流体中存在的某种化学种类（吸附质）的部分质量占据空隙现象。它是脱附的反过程。\n\
  \n![image](img/F000022si548.png)\n\n#### 2.7.1.2 平衡吸附与动力学吸附\n\n研究吸附的一种常用方法是使用吸附线。在平衡状态下，只要固体上的浓度不变化，该假设就成立。\n\
  \n#### 2.7.1.3 影响吸附的因素\n\n影响吸附的因素包括种类对固体的亲和力和温度。\n\n#### 2.7.1.4 扩散的作用\n\n在讨论吸附速率时，限制步骤通常是穿过膜的扩散。\n\
  \n\n\n\n其中 `K[d]`![image](img/F000022si550.png) 是分配系数或分配系数，代表物种对固体相对于对流体的亲和力。它表示在每一时刻，单位固体质量上单位液相物种浓度下的物种质量。\n\
  \n有时，吸附过程的 `K[d]`![image](img/F000022si551.png) 与脱附过程的系数不同，这表明吸附过程并非完全可逆，这通常是由于表面催化引起的。另一个观察结果是固体表面的吸附能力存在极限，特别是在化学吸中，这需要修改等吸线形式。在非饱和流中，由于较大的孔隙被空气占据，固体的部分表面不易被孔水接触。在这种情况下，`K[d]`![image](img/F000022si552.png)可能是饱和度的函数。另一方面，众所周知水是润湿液体，它处处相邻固体表面，尽管在某些地方以极薄膜的形式存在，化学物种通过其进行扩散。\n\
  \n### 2.7.2.3 Freundlich 等吸线\n\n`F`  = `b*c^(*m*)` (2.212)\n\n![image](img/F000022si553.png)(2.212)\
  \ \n\n其中 `c` 是溶液中的吸附质浓度；`b` 和 `m` 是取决于温度的常数系数。`m<1`的情况意味着随着`F`的增加，吸附额外的吸附质变得更加困难。相反的情况由\
  \ `m>1` 描述，当 `m>1` 时，等吸线简化为线性等吸线。\n\n### 2.7.2.4 Langmuir 等吸线\n\n$F = \\frac{k\\\
  _{3}c}{1 + k\\_{4}c}$ (2.213)\n\n![image](img/F000022si554.png)(2.213) \n\n其中 `k[3]`![image](img/F000022si555.png)\
  \ 和 `k[4]`![image](img/F000022si556.png) 是常数系数，通常 `k[3]`  > 0![image](img/F000022si557.png)\
  \ 且 `k[4]`  > 0![image](img/F000022si558.png)。因此，随着`F`的增加，吸附额外的吸附质变得更加困难。需要注意的是，当\
  \ `c→∞`![image](img/F000022si560.png) 时，`F→const`![image](img/F000022si559.png)，与\
  \ Freundlich 等吸线不同，Langmuir 等吸线中的吸附可以达到特定的饱和值。\n\n### 2.7.2.5 Lindstrom–van Genuchten\
  \ 等吸线\n\n`F`  = `k[5]*cexp (−2*k[6]*F*)` (2.214)\n\n![image](img/F000022si561.png)(2.214)\
  \ \n\n其中 `k[5]`![image](img/F000022si562.png) 和 `k[6]`![image](img/F000022si563.png)\
  \ 是常数系数。它表明 `k[d]`  = `F/c`![image](img/F000022si564.png) 是固体中浓度的函数。Eq. (2.214)\
  \ 当 `k[6]`  = 0![image](img/F000022si565.png) 时简化为线性等吸线。通常 `k[6]`  > 0![image](img/F000022si566.png)，因此随着`F`![image](img/F000022si567.png)\
  \ 的增加，吸附额外的吸附质变得更加困难。\n\n### 2.7.3 带有吸附的运运建模\n\n#### 2.7.3.1 溶质吸附运运通用方程\n\n在没有吸附的情况下，不可压缩流相中溶质的质量守恒方程为：\n\
  \n$\\frac{\\\\partial\\left( {\\\\phi c} \\right)}{\\partial t} + \\nabla \\cdot\
  \ \\left( {c\\mathbf{u} - \\mathbf{D}\\nabla c} \\right) = q\\_{c}$ (2.215)\n\n\
  ![image](img/F000022si568.png)(2.215) \n\n`q[c] = q[c]^(-c) + q[c]+` (2.216)![image](img/F000022si569.png)\n\
  \n其中 `c` 是组分的浓度（流相中的质量分数）；`D`![image](img/F000022si570.png) 是弥散张量，它是达西速度 `u`![image](img/F000022si571.png)\
  \ 的函数；`q[c]-`![image](img/F000022si572.png) 和 `q[c]+`![image](img/F000022si573.png)\
  \ 是产生和注入项，`q[c]-` 是停留浓度。\n\n考虑吸附，流相中溶质的质量守恒方程为：\n\n$\\frac{\\\\partial\\left( {\\\
  \\phi c} \\right)}{\\partial t} + \\nabla \\cdot \\left( {c\\mathbf{u} - \\mathbf{D}\\\
  nabla c} \\right) = q\\_{c}\\left( c \\right) - r\\_{sorp}\\left( c,c_{s}} \\right)$\
  \ (2.217)\n\n![image](img/F000022si575.png)\n\n其中 `rsorp`![image](img/F000022si576.png)\
  \ 是净吸附速率（使用动力学方法建模），`r[sorp] = r[ads] - r[des]`![image](img/F000022si577.png)。\n\
  \n固相中溶质的质量守恒方程为：\n\n$\\frac{\\\\partial\\left( {\\\\rho_{b}c_{s}} \\right)}{\\partial\
  \ t} = r\\_{sorp}\\left( c,c_{s}} \\right)$ (2.218)\n\n![image](img/F000022si578.png)\n\
  \n在这里为了计算 `rsorp`![image](img/F000022si579.png)，可以使用线性动力学模型 `r[ads] = k[a]*c`![image](img/F000022si580.png)\
  \ 和 `r[des] = k[a]*c[s]`![image](img/F000022si581.png)。\n\n将 Eqs. (2.217) 和 (2.218)\
  \ 相加得到：\n\n$\\frac{\\\\partial\\left( {\\\\phi c + \\\\rho_{b}c_{s}} \\right)}{\\\
  partial t} + \\nabla \\cdot \\left( {c\\mathbf{u} - \\mathbf{D}\\nabla c} \\right)\
  \ = q\\_{c}\\left( c \\right)$ (2.219)\n\n![image](img/F000022si582.png)(2.219)\n\
  \n如果假设吸附为平衡态，则 `c[s] = K[d]*c`![image](img/F000022si583.png)，其中具有分配系数 `K[d]`![image](img/F000022si584.png)。在平衡吸附的假设下，溶质（包括流相和固体）的总质量守恒\
  \ (2.219) 变为：\n\n$\\frac{\\\\partial\\left( {\\\\phi + \\\\rho_{b}K_{d}} \\right)c}{\\\
  partial t} + \\nabla \\cdot \\left( {c\\mathbf{u} - \\mathbf{D}\\nabla c} \\right)\
  \ = q\\_{c}\\left( c \\right)$ (2.220)\n\n![image](img/F000022si585.png)(2.220)\
  \ \n\n定义滞留系数如下：\n\n$R_{d} = 1 + \\\\frac{\\\\rho_{b}K_{d}}{\\\\phi}$ (2.221)\n\n\
  ![image](img/F000022si586.png)\n\n使用滞留系数，Eq. (2.220) 可以简化为：\n\n$\\frac{\\\\partial\\\
  left( {\\\\phi R_{d}}c \\right)}{\\partial t} + \\nabla \\cdot \\left( {c\\mathbf{u}\
  \ - \\mathbf{D}\\nabla c} \\right) = q\\_{c}\\left( c \\right)$ (2.222)\n\n![image](img/F000022si587.png)\n\
  \n看起来对流和扩散都被一个 `R[d] >1` 的倍数减慢了。对于非线性等吸线，`R[d]`![image](img/F000022si588.png) 仍然是\
  \ `c`![image](img/F000022si589.png) 或/或 `c[s]`![image](img/F000022si590.png) 的函数。\n\
  \n#### 2.7.3.2 线性吸附：平衡与动力学\n\n吸附速率和脱附速率的线性动力学模型定义为\n\n`r[ads]`  = `k[a]*c`  < `r[des]`\
  \  = `k[d]*c[s]` (2.223)\n\n![image](img/F000022si592.png)(2.223) \n\n那么净吸附速率可以计算为：\n\
  \n`r[sorp]`  = `r[ads] - r[des]`  = `k[a]*c - k[d]*c[s]` (2.224)\n\n![image](img/F000022si593.png)(2.224)\n\
  \n在平衡状态下，净吸附为零，即 `r[sorp]`  = 0![image](img/F000022si594.png)。因此，我们得到 `k[a]*c`  = `k[d]*c[s]`![image](img/F000022si595.png)，\n\
  \n#### 2.7.3.3 Langmiur 吸附：平衡与动力学\n\n对于 Langmiur 吸附，正向和反向反应速率可以建模为\n\n\n\n\n\n`r[adsorption]\
  \ = k[f]*c*(1−θ)`, `r[desorption] = k[r]*θ` (2.226)\n\n![image](img/F000022si597.png)(2.226)\
  \ \n\n其中 `k[f]`![image](img/F000022si598.png) 和 `k[r]`![image](img/F000022si599.png)\
  \ 分别为速率常数；`θ`![image](img/F000022si600.png) 是表面覆盖率，即固体相上被吸附组分占据的位比例。\n\n在平衡时，净吸附速率\
  \ `r[sorption]`![image](img/F000022si601.png)为零，因此 `r[adsorption] = r[desorption]`![image](img/F000022si602.png)。代入并解出覆盖率得到：\n\
  \n$\\theta = \\frac{\\left( {k_{f}/k\\_{r}} \\right)c}{1 + \\left( {k_{f}/k\\_{r}}\
  \ \\right)c}$ (2.227)\n\n![image](img/F000022si603.png)(2.227) \n\n正向（吸附）速率表达式 `r[adsorption]\
  \ = k[f]*c*(1−θ)`![image](img/F000022si604.png) 表示，脱附速率线性取决于液相中的平衡浓度以及未覆盖（或裸露）位点的密度。不允许在已吸附的位点上再次进行吸附（即所谓的单层覆盖）。脱附反应\
  \ `r[desorption] = k[r]*θ`![image](img/F000022si605.png) 表示，脱附速率仅线性地取决于被占据的位点数量。这两个一个速率表达式都不包含关于吸附组分特定性质（例如其电荷）的信息。线性特征使得\
  \ Langmuir 等温线成为物理吸附的传统替代模型。\n\n### 2.7.4 带有吸附的输运数值方法\n\n为了求解带有平衡吸附的溶质输运方程 (2.222)，我们可以直接使用相同的局部保守算法。需要注意的是，当\
  \ `R[d] = Rd`![image](img/F000022si606.png) 或 `R[d] = Rd`![image](img/F000022si607.png)\
  \ 时，`R[d]` 不能被除。对于带有动力学吸附的溶质输运方程 (2.219)，可以被视为对流-扩散-反应系统。\n\n## 2.8 黑油模型\n\n###\
  \ 2.8.1 黑油模型介绍\n\n#### 2.8.1.1 黑油模型的核心思想\n\n众所周知，在不相溶的两相（例如油-水）流动中，假设相之间之间不发生质量传递。为了放宽这一假设，本文部分引入了黑油模型。在黑油模型中，现在假设在标准压力和温度下的储罐中，碳烃组分分为气组分和油组分，并允许气相与油相之间发生质量传递。然而，水相与其他两相之间不发生质量传递。气组分主要由甲烷和乙烷组成，水相仅为水组分。为了避免混淆，需要区分相和组分。书中分别用小写和大写字母表示相和组分，下标\
  \ `s` 表示标准条件。符号 `ρ[w]`![image](img/F000022si608.png) 代表水的密度；气相 `g`![image](img/F000022si609.png)\
  \ 包含气体组分 `G`；`ρ[g]`![image](img/F000022si611.png) 表示气相密度；油相 `o`![image](img/F000022si612.png)\
  \ 同时包含油组分 `O` 和气组分 `G`；`ρ[Oo]`![image](img/F000022si615.png) 和 `ρ[Go]`![image](img/F000022si616.png)\
  \ 用于表示油相中的油、气组分密度（见图 2.9 [#chp002_b.xhtml#f0050]）。\n\n![图 2.9 黑油模型示意图](img/F000022f02-978012820957.jpg)\n\
  \n#### 2.8.1.2 各组分的质量守恒在黑油模型中，由于油相和气相之间的质量交换，质量内质量不守恒，但每个组分的总质量是守恒的。\n\n水组分：\n$\\\
  frac{\\partial\\left( {\\rho_{w}S_{w}} \\right)}{\\partial t} = - \\nabla \\cdot\
  \ \\left( {\\rho_{w}\\mathbf{u}_{w}} \\right) + q_{W}$ (2.228)\n\n![image](img/F000022si617.png)(2.228)\
  \ \n\n油组分：\n$\\frac{\\partial\\left( {\\rho_{Oo}S_{o}} \\right)}{\\partial t} =\
  \ - \\nabla \\cdot \\left( {\\rho_{Oo}\\mathbf{u}_{o}} \\right) + q_{O}$ (2.229)\n\
  \n![image](img/F000022si618.png)(2.229) \n\n其中 `ρ[Oo]`![image](img/F000022si619.png)\
  \ 表示油相中的油组分密度。\n\n气组分：\n$\\frac{\\partial}{\\partial t}\\left( {\\phi\\left( {\\\
  rho_{Go}S_{o} + \\rho_{g}S_{g}} \\right) } \\right) = - \\nabla \\cdot \\left( {\\\
  rho_{Go}\\mathbf{u}_{o} + \\rho_{g}\\mathbf{u}_{g}} \\right) + q_{G}$ (2.230)\n\n\
  ![image](img/F000022si620.png)(2.230) \n\n其中油相 `o`![image](img/F000022si621.png)\
  \ 包含油组分 `O`![image](img/F000022si622.png) 和气组分 `G`![image](img/F000022si623.png)；也就是说，气组分\
  \ `G`![image](img/F000022si624.png) 同时存在于气相和油相中；`ρ[Go]`![image](img/F000022si625.png)\
  \ 表示油相中的气组分密度。\n\n#### 2.8.1.3 西定律与其他方程\n\n扩展的达西定律为：\n$\\mathbf{u}_{\\alpha} = -\
  \ \\frac{\\mathbf{K}k_{ra}}{\\mu_{\\alpha}}(\\nabla p_{\\alpha} - \\rho_{\\alpha}\\\
  mathbf{g}),\\alpha = w,o,g$ (2.231)\n\n![image](img/F000022si626.png)(2.231) \n\n\
  三相共同填充孔隙空间，因此饱和度方程为：\n`S[w] + S[o] + S[g] = 1` (2.232)\n\n![image](img/F000022si627.png)(2.232)\
  \ \n\n相压力通过毛细管压力相关：\n`p[cow] = p[o] - p[w]`, `p[gow] = p[g] - p[o]` (2.233)\n\n\
  ![image](img/F000022si628.png)(2.233) \n\n#### 2.8.1.4 溶解度\n\n在黑油模型中，使用“标准体积”而非“质量”进行守恒方程更为方便。油相中油气组分的体积分数可以通过溶解度确定，`R[so]`![image](img/F000022si629.png)（也称为溶解油比）。`R[so]`![image](img/F000022si630.png)\
  \ 是在给定压力和地层温度下，单位储罐体积溶解气体体积：\n$R_{so}\\left( {p,T} \\right) = \\frac{V_{GS}}{V_{Os}}$\
  \ (2.234)\n\n![image](img/F000022si631.png)(2.234) \n\n注意：\n$V_{Os} = \\frac{W_{O}}{\\\
  rho_{Os}}, V_{Gs} = \\frac{W_{G}}{\\rho_{Gs}}$ (2.235)\n\n![image](img/F000022si632.png)(2.235)\
  \ \n\n其中 `W[O]`![image](img/F000022si633.png) 是油组分的重量，`W[G]`![image](img/F000022si634.png)\
  \ 是气组分的重量。\n\n将方程 (2.235) 代入(2.236)，溶解油比 `R[so]`![image](img/F000022si635.png) 可以写为：\n\
  $R_{so} = \\frac{W_{G}\\rho_{Os}}{W_{O}\\rho_{Go}}$ (2.236)\n\n![image](img/F000022si636.png)(2.236)\
  \  \n\n#### 2.8.1.5 油地层体积系数\n\n油地层体积系数 `B[o]`![image](img/F000022si637.png) 定义为地层条件下油相的体积\
  \ `V[o]`![image](img/F000022si638.png) 与标准条件下油组分的体积 `V[os]`![image](img/F000022si639.png)\
  \ 之比，\n\n\n\n\n\n$B_{o}\\left( {p,T} \\right) = \\frac{V_{o}\\left( {p,T} \\right)}{V_{Os}}$\
  \ (2.237)\n\n![image](img/F000022si640.png)(2.237) \n\n其中 `V`[o] = (`W`[O]+`W`[G])/*`ρ`[o]![image](img/F000022si641.png)。\n\
  \n也可以推导出：\n\n$B_{o} = \\frac{\\\\left( {W_{O} + W_{G}} \\right)\\rho_{Os}}{W_{O}\\\
  rho_{o}}$ (2.238)\n\n![image](img/F000022si642.png)(2.238)  \n\n### 2.8.1.6 组分的质量分数\n\
  \n油相中油、气组分的质量分数由下式给出：\n\n$C_{Oo} = \\frac{W_{O}}{W_{O} + W_{G}} = \\frac{\\rho_{Os}}{B_{o}\\\
  rho_{o}}, C_{Go} = \\frac{W_{G}}{W_{O} + W_{G}} = \\frac{R_{so}\\rho_{Gs}}{B_{o}\\\
  rho_{o}}$ (2.239)\n\n![image](img/F000022si643.png)(2.239) \n\n上述方程结合 `C`[Oo] + `C`[Go] = 1![image](img/F000022si644.png)\
  \ 得到：\n\n$\\\\rho_{o} = \\frac{R_{so}\\rho_{Gs} + \\rho_{Os}}{B_{o}}$ (2.240)\n\n\
  ![image](img/F000022si645.png)(2.240)  \n\n### 2.8.1.7 气体地层体积系数\n\n类似于 `B`[o]![image](img/F000022si646.png)\
  \ 的定义，气体地层体积系数 `B`[g]![image](img/F000022si647.png) 定义为气相体积（在储层条件下测量）与气体组分体积（在标准条件下测量）的比值：\n\
  \n$B_{g}\\left( {p,T} \\right) = \\frac{V_{g}\\left( {p,T} \\right)}{V_{Gs}}$ (2.241)\n\
  \n![image](img/F000022si648.png)(2.241) \n\n我们有 `V`[g] = `W`[G]/*`*ρ`[g]![image](img/F000022si649.png)\
  \ 和 `V`[Gs] = `W`[G]/*`*ρ`[Gs]![image](img/F000022si650.png)，因此气相密度可以通过以下公式计算：\n\
  \n$\\rho_{g} = \\frac{\\rho_{Gs}}{B_{g}}$ (2.242)\n\n![image](img/F000022si651.png)(2.242)\
  \  \n\n### 2.8.1.8 水地层体积系数\n\n同样，水地层体积系数 `B`[w] 定义为：\n\n$B_{w} = \\frac{\\rho_{Ws}}{\\\
  rho_{w}}$ (2.243)\n\n![image](img/F000022si652.png)(2.243)\n\nEqs. (2.228)–(2.230)\
  \ 中的流率定义为：\n\n$q_{W} = \\frac{q_{Ws}\\rho_{Ws}}{B_{w}}, q_{O} = \\frac{q_{Os}\\\
  rho_{Os}}{B_{o}}, q_{G} = \\frac{q_{Gs}\\rho_{Gs}}{B_{g}} + \\frac{q_{Os}R_{so}\\\
  rho_{Gs}}{B_{o}}$ (2.244)\n\n![image](img/F000022si653.png)(2.244)\n\n其中 `q`[Ws],\
  \ `q`[Os], 和 `q`[Gs] 是标准条件下的流率。\n\n### 2.8.1.9 标准体积下的方程\n\n定义如下流体重：\n\n`γ`[α] = `ρ`[α]g,*`α` = `w`, `o`, `g`\
  \ (2.245)\n\n![image](img/F000022si657.png)(2.245) \n\n此外，引入以下渗透率：\n\n$\\mathbf{T}_{\\\
  alpha} = \\frac{k_{r\\alpha}}{\\mu_{\\alpha}B_{\\alpha}}\\mathbf{k},\\alpha = w,o$![image](img/F000022si658.png)(2.246)\n\
  \n将上述流率、流重和渗透率表达式代入连续方程，并分别除以 `ρ`[Ws]![image](img/F000022si659.png), `ρ`[Os]![image](img/F000022si660.png),\
  \ 和 `ρ`[Gs]![image](img/F000022si661.png)，可以得到标准体积下的连续方程：\n\n$\\frac{\\partial}{\\\
  partial t}\\left( \\frac{\\phi S_{w}}{B_{w}} \\right) = \\nabla \\cdot \\left( \\\
  mathbf{T}_{w}(\\nabla p_{w} - \\gamma_{w}\\nabla z) \\right) + \\frac{q_{Ws}}{B_{w}}$\
  \ (2.247a)![image](img/F000022si662.png)(2.247a)\n\n$\\frac{\\partial}{\\partial\
  \ t}\\left( \\frac{\\phi S_{O}}{B_{o}} \\right) = \\nabla \\cdot \\left( \\mathbf{T}_{o}(\\\
  nabla p_{o} - \\gamma_{o}\\nabla z) \\right) + \\frac{q_{Os}}{B_{o}}$ (2.247b)![image](img/F000022si663.png)(2.247b)\n\
  \n$\\frac{\\partial}{\\partial t}\\left( \\phi\\left( \\frac{S_{g}}{B_{g}} + \\\
  frac{R_{so}S_{O}}{B_{o}} \\right) \\right) = \\nabla \\cdot \\left( \\mathbf{T}_{g}(\\\
  nabla p_{g} - \\gamma_{g}\\nabla z) \\right) + R_{so}\\mathbf{T}_{o}(\\nabla p_{o}\
  \ - \\gamma_{g}\\nabla z) + \\frac{q_{Gs}}{B_{g}} + \\frac{q_{Os}}{B_{o}}$ (2.247c)![image](img/F000022si664.png)(2.247c)\n\
  \n### 2.8.2 黑油模型中的井处理\n\n井处的体积流率（标准条件下）通过以下公式计算：\n\n$q_{Ws} = \\sum_{\\nu = 1}^{N_{w}}\\\
  sum_{m = 1}^{M_{wv}}q_{Ws,m}^{(\\nu)}\\delta(\\mathbf{x} - \\mathbf{x}_{m}^{(\\\
  nu)})$ (2.248a)![image](img/F000022si665.png)(2.248a)\n\n$q_{Os} = \\sum_{\\nu =\
  \ 1}^{N_{w}}\\sum_{m = 1}^{M_{wv}}q_{Os,m}^{(\\nu)}\\delta(\\mathbf{x} - \\mathbf{x}_{m}^{(\\\
  nu)})$ (2.248b)![image](img/F000022si666.png)(2.248b)\n\n$q_{Gs} = \\sum_{\\nu =\
  \ 1}^{N_{w}}\\sum_{m = 1}^{M_{wv}}q_{Gs,m}^{(\\nu)}\\delta(\\mathbf{x} - \\mathbf{x}_{m}^{(\\\
  nu)})$ (2.248c)![image](img/F000022si667.png)(2.248c)\n\n其中：\n\n$q_{Ws,m}^{(\\nu)}\
  \ = WI_{m}^{(\\nu)}\\frac{k_{rw}}{\\mu_{w}}\\left( {p_{bh}^{(\\nu)} - p_{w} - \\\
  gamma_{w}(z_{bh}^{(\\nu)} - z) \\right)$ (2.249a)![image](img/F000022si668.png)(2.249a)\n\
  \n$q_{Os,m}^{(\\nu)} = WI_{m}^{(\\nu)}\\frac{k_{ro}}{\\mu_{o}}\\left( {p_{bh}^{(\\\
  nu)} - p_{o} - \\gamma_{o}(z_{bh}^{(\\nu)} - z) \\right)$ (2.249b)![image](img/F000022si669.png)(2.249b)\n\
  \n$q_{Gs,m}^{(\\nu)} = WI_{m}^{(\\nu)}\\frac{k_{rg}}{\\mu_{g}}\\left( {p_{bh}^{(\\\
  nu)} - p_{g} - \\gamma_{g}(z_{bh}^{(\\nu)} - z) \\right)$ (2.249c)![image](img/F000022si670.png)(2.249c)\n\
  \n其中井参数 ${WI}_{m}^{(\\nu)} = \\left. {{2\\pi\\overline{k}\\Delta h}/{\\ln\\left(\
  \ {r_{e}/r_{w}} \\right)}} \\right|_{m}^{(\\nu)}$![image](img/F000022si671.png);`δ`(`x`)\
  \ 是狄拉克 δ 符号；`N`[w] 是总井数；`M`[wv] 是 `v` 井的射层总数；`Δh`m![image](img/F000022si672.png)\
  \ 和 `x`m![image](img/F000022si673.png) 是 `v` 井第 `m` 个射层的长度和中心位置；$\\overline{k}$![image](img/F000022si674.png)\
  \ 是井处的平均渗透率；`r`w![image](img/F000022si675.png) 代表 `v` 井的井径；`r`e, m![image](img/F000022si676.png)\
  \ 表示 `v` 井在 `x`m![image](img/F000022si677.png) 所在网格的排水半径；`p`bh![image](img/F000022si678.png)\
  \ 表示 `v` 井在基准深度 `z`bh![image](img/F000022si679.png) 处的井底压力。\n\n### 2.8.3 三相相对渗透率模型\n\
  \n许多储层过程涉及三相同时流动。为了模拟这些过程，三相相对渗透率是必不可少的。然而，三相相对渗透率的测量比两相少得多，且报告的数据中不确定性也更大。目前三相相对渗透率的研究重点在于识别将两相相对渗透率数据外推三相应用中的模型。\n\
  \n### 2.8.3.1 三相 Stone I\n\nStone 在 1970 年开启了这一趋势，该模型被称为 Stone I 模型。在这种针对润湿介质的模型中，三相水相对渗透率\
  \ `k`[rw,og]![image](img/F000022si680.png) 仅取决于水饱和度，并且与水油驱替测得的 `k`[rw,wo]![image](img/F000022si681.png)\
  \ 相同：\n\n`k`rw,og = `k`rw,wo (2.250)\n\n![image](img/F000022si682.png)(2.250)\n\n\
  \n\n\n同样，三相相对渗透率 `k[rw,wog]`![image](img/F000022si683.png) 仅取决于气饱和度，并且与气油驱中测得的 `k[rg,go]`![image](img/F000022si684.png)\
  \ 相同，\n\n```\nkrg,wog = krg,go (2.251)\n```\n![image](img/F000022si685.png)(2.251)\n\
  \n水润介质中两相水气渗透率的相等性得到了文献中大量三相数据的支持。另一方面，三相油相对渗透率 `k[ro,wog]`![image](img/F000022si686.png)\
  \ 非线性地取决于水和气饱和度，\n\n```\nk_{ro,wog}(Sw,S) = \\frac{S_{oS}}{k_{ro,wo}(Sw_{wc})}\\\
  frac{k_{ro,wo}(Sw)}{1 - S_{w}}\\frac{k_{ro,og}(S)}{1 - S_{g}} (2.252)\n```\n![image](img/F000022si687.png)(2.252)\n\
  \n油、水和气饱和度的缩放如下：\n\n```\nSos = (So - Om) / (Sw - Om), Sw = (Sw - Swc) / (Sw - Om),\
  \ Sgs = sg / (Sw - Om) (2.253)\n```\n![image](img/F000022si688.png)(2.253)\n\n根据\
  \ Stone 的研究，最小油饱和度 `Som`![image](img/F000022si689.png) 应处于 0.25`Swc`![image](img/F000022si690.png)\
  \ 到 0.5`Swc`![image](img/F000022si691.png) 之间，并且小于等于水驱和气驱的剩余油饱和度 `Sor`![image](img/F000022si692.png)\
  \ 或 `Org`![image](img/F000022si693.png)。最小油饱和度可以通过以下公式计算：\n\n```\nOm = alpha*Sor\
  \ + (1 - alpha)*Org (2.254)\n```\n![image](img/F000022si694.png)(2.254)\n\n其中 `alpha`\
  \ = `1 - sg / (Swc - Org)`![image](img/F000022si695.png)。\n\n或者按照下一个公式计算：\n\n```\n\
  Som = Sor * ((Sw - Swc) / (Swc - Org))^alpha + Org * ((sg / (Swc - Org))^\\beta\
  \ (2.255)\n```\n![image](img/F000022si696.png)(2.255)\n\n注意，为了考虑三相流中的滞后效应，Stone\
  \ 建议使用适当的两相渗透率。\n\n### 2.8.3.2 三相 Stone II\n\n1973 年，Stone 开发了另一种被称为 Stone II 模型。Stone\
  \ II 模型与 Stone I 模型的区别在于相对渗透率。在 Stone II 模型中，油相对渗透率定义为：\n\n```\nk_{ro,wog}(Sw,Sg)\
  \ = k_{ro,wo}(Swc) [ ((k_{ro,wo}/k_{ro,wo}(Swc) + k_{rw,wo})) ((k_{ro,og}/k_{ro,wo}(Swc)\
  \ + k_{rg,go}) - (k_{rw,wo} + k_{rg,go}) ] (2.256)\n```\n![image](img/F000022si697.png)(2.256)\n\
  \n其中公式 (2.257) 中的水油和气油相对渗透率分别是水饱和度和气饱和度的函数。\n\n### 2.8.4 岩石和流体性质\n\n#### 2.8.4.1\
  \ 岩石性质\n\n孔隙率 `phi`![image](img/F000022si698.png) 假设具有以下形式：\n\n```\nphi = phi⁰ [1\
  \ + cR(p - p⁰)] (2.257)\n```\n![image](img/F000022si699.png)(2.257)\n\n其中 `phi⁰`![image](img/F000022si700.png)\
  \ 是参考压力 `p⁰`![image](img/F000022si701.png) 下的孔隙率；`cR`![image](img/F000022si702.png)\
  \ 是岩石压缩性。\n\n#### 2.8.4.2 流体性质\n\n黑油模型包含了三相和三组分。水组分和油组分分别仅存在于水相和油相中。气组分分为两部分：气相中的一部分称为自由气，密度为\
  \ `rho_g`![image](img/F000022si703.png)，油相中的另一部分称为溶解气，密度为 `rho_Go`![image](img/F000022si704.png)。水粘度\
  \ `mu_w`![image](img/F000022si705.png) 被视为常数，标准条件下的水密度 `rho_s`![image](img/F000022si706.png)\
  \ 通过盐度确定，而水相密度 `rho_w` 由下式给出：\n\n```\nrho_w = rho_Ws / B_wi (1 + c_w(p - p^i)) (2.258)\n\
  ```\n![image](img/F000022si708.png)(2.258)\n\n其中 `B_wi`![image](img/F000022si709.png)\
  \ 是初始地层压力 `p^i`![image](img/F000022si710.png) 下的水体积系数，`c_w` 是水的压缩性。油相密度 `rho_o`![image](img/F000022si712.png)\
  \ 由下式确定：\n\n```\nrho_o = rho_Oo + rho_Go (2.259)\n```\n![image](img/F000022si713.png)(2.259)\n\
  \n其中 `rho_Oo` = `rho_Os / B_o`![image](img/F000022si714.png)，`B_o` = `B_ob(p_b)[1\
  \ + c_o(p - p_b)]`![image](img/F000022si715.png)，其中 `B_ob` 是泡点压力 `p_b` 下的体积系数，`c_o`\
  \ 是油压缩性。油粘度 `mu_o`![image](img/F000022si716.png) 通过下式计算：\n\n```\nmu_o = mu_ob(p_b)\
  \ [1 + c_mu(p - p_b)] (2.260)\n```\n![image](img/F000022si717.png)(2.260)\n\n其中\
  \ `mu_ob`![image](img/F000022si718.png) 是 `p_b` 下的油粘度，`c_mu`![image](img/F000022si720.png)\
  \ 表示油粘度压缩性。气粘度 `mu_g`![image](img/F000022si721.png) 是 `p` 的函数：\n\n```\nmu_g = mu_g(p)\
  \ (2.261)\n```\n![image](img/F000022si722.png)(2.261)\n\n溶解气密度 `rho_Go`![image](img/F000022si723.png)\
  \ 由下式确定：\n\n```\nrho_Go = (R_so * rho_Gs) / B_o (2.262)\n```\n![image](img/F000022si724.png)(2.262)\n\
  \n自由气密度 `rho_g`![image](img/F000022si725.png) 的定义为：\n\n```\nrho_g = rho_Gs / B_g\
  \ (2.263)\n```\n![image](img/F000022si726.png)(2.263)\n\n其中 `rho_Gs` = `Y_G * rho_ai_r`![image](img/F000022si727.png)，且\
  \ `B_g` = `(Z*T/p)*(p_s/T_s)`![image](img/F000022si728.png)，其中 `Y_G`![image](img/F000022si729.png)\
  \ 是原气密度，`rho_ai_r`![image](img/F000022si730.png) 是空气密度，`Z` 是气体偏离系数。\n\n### 2.8.5\
  \ 相态和主未知数的选择\n\n#### 2.8.5.1 相态\n\n在油的二次回收过程中，如果储层压力高于油的泡点压力，流处于两相态；然而，当压力低于泡点压力时，流属于黑油型。在实际储层工程中，由于储层注注和生产频繁变化，泡点压力不是常数。如果三相共存，则储层被称为饱和态。\n\
  \n1.1. 对于饱和态：`S[g]` != 0![image](img/F000022si731.png) 且 `p[b]` = `p`![image](img/F000022si732.png)，密度和粘度仅取决于压力\
  \ `p`![image](img/F000022si733.png)，\n\n\n\n\n\n$$\\rho_{Oo}(p) = \\frac{\\rho_{Os}}{B_{ob}(p)},\\\
  rho_{Go}(p) = \\frac{R_{so}(p)\\rho_{Gs}}{B_{ob}(p)},\\rho_{g}(p) = \\frac{\\rho_{Gs}}{B_{g}(p)}$$\
  \ (2.264)\n\n![image](img/F000022si734.png)(2.264)\n\n$\\mu[o] = \\muo, \\mu[g]\
  \ = \\mug$ (2.265)\n\n![image](img/F000022si735.png)(2.265)\n\n## 2. 对于未饱和态：$S[g]\
  \ = 0$![image](img/F000022si736.png)且$p[b] < p$![image](img/F000022si737.png)，油相中的密度和粘度同时取决于$p$![image](img/F000022si738.png)和$p[b]$![image](img/F000022si739.png)，\n\
  \n$$\\rho_{Oo}(p,p_{b}) = \\frac{\\rho_{Os}}{B_{ob}(p_{b})}\\left[ {1 + c_{o}(p\
  \ - p_{b})} \\right]$$ (2.266a)\n\n![image](img/F000022si740.png)(2.266a)\n\n$$\\\
  rho_{Go}(p,p_{b}) = \\frac{R_{so}(p_{b})\\rho_{Gs}}{B_{ob}(p_{b})}(1 + c_{o}(p -\
  \ p_{b}))$$ (2.266b)\n\n![image](img/F000022si741.png)(2.266b)\n\n$$\\rho_{g}(p)\
  \ = \\frac{\\rho_{Gs}}{B_{g}(p)}$$ (2.266c)\n\n![image](img/F000022si742.png)(2.266c)\n\
  \n$\\muo = \\muob1+c[\\mu], \\mu[g] = \\mug$ (2.267)\n\n![image](img/F000022si743.png)(2.267)\n\
  \n### 2.8.5.2 主未知数的选择\n\n主未知数的选择取决于黑油模型 (1) 中的状态。在饱和态下，$p = p[o]$![image](img/F000022si744.png)，$S[w]$![image](img/F000022si745.png)和$S[o]$![image](img/F000022si746.png)可以被选择为主主未知数；而在\
  \ (2)未饱和态下，$p = p[o]$![image](img/F000022si747.png)，$p[b]$![image](img/F000022si748.png)和$S[w]$![image](img/F000022si749.png)始终被选为主主未知数。因此，初始条件（I.C.s）为，\n\
  \n$p(x, 0) = p⁰(x), Sw = S[w]⁰(x), So = S[o]⁰(x), x \\in \\Omega$ (2.268)\n\n![image](img/F000022si750.png)(2.268)\n\
  \n或者\n\n$p(x, 0) = p⁰(x), Sw = S[w]⁰(x), pb = p[b]⁰(x), x \\in \\Omega$ (2.269)\
  \ 取决于储层的初始状态。\n\n### 2.8.6 初始条件的处理\n\n黑油模型的初始条件包括在模拟开始时指定每个网格单元的相压力/饱和度。相重力和毛细管压力的差异会导致流体发生分离，直到储层达到重力/毛细管平衡。从储层顶部到底部最多存在五种流体区域：气顶、气/油过渡带、油层、油/水过渡带和水层。通常情况下，初始数据的指定取决于重力/毛细管平衡以及占据不同区域的流体性质。对于连续相，初始压力直接通过静水压力关系计算；而对于不连续相，初始压力通过在端点饱和度处的压力函数确定。连续相的初始饱和度通过压力函数或饱和度关系计算，而不连续相的初始饱和度由端点饱和度给出。\n\
  \n#### 2.8.6.1 气顶\n\n最初，气顶区域内只有气相是连续的。因此，气压分布可以通过下式计算：\n\n$$\\frac{dp_g}{dz} = \\\
  gamma_g$$ (2.270)\n\n![image](img/F000022si752.png)(2.270)\n\n其中\n\n$S[w] = S[iw],\
  \ S[g] = 0$ (2.271)\n\n![image](img/F000022si753.png)(2.271) 其中$S[iw]$![image](img/F000022si754.png)是剩余水饱和度。其他变量可以通过$S[g]\
  \ = 1 - S[w] - S[o]$和$p[w] = p[o] - pow$![image](img/F000022si755.png)确定。\n\n####\
  \ 2.8.6.2 气/油过渡带\n\n在气/油过渡带中，气油两都是连续的，因此它们的压力分布可以直接从静水关系获得：\n\n$$\\begin{matrix}\
  \ \\frac{dp_g}{dz} = \\gamma_g, & \\frac{dp_o}{dz} = \\gamma_o \\end{matrix}$$ (2.272)\n\
  \n![image](img/F000022si757.png)(2.272) 此外，\n\n$S[w] = S[iw]$ (2.273)\n\n![image](img/F000022si758.png)(2.273)\
  \ 从上述条件可以获得以下变量：\n\n$S[g] = p[cgo^{(1)}(p[g] - p[o]), p[w] = p[o] - pow, S[o] =\
  \ 1 - S[g] - S[w]$ (2.274)\n\n![image](img/F000022si759.png)(2.274) 其中我们假设$p[cgo]$![image](img/F000022si760.png)有一个逆函数$p[cgo]^{(1)}$![image](img/F000022si761.png)。\n\
  \n#### 2.8.6.3 油层\n\n油层中油相是唯一的连续相：\n\n$$\\frac{dp_o}{dz} = \\gamma_o$$ (2.275)\n\
  \n![image](img/F000022si762.png)(2.275) 其中，\n\n$S[w] = S[iw], S[g] = 0$ (2.276)\n\
  \n![image](img/F000022si763.png)(2.276) 然后我们可以得到：\n\n$p[g] = p[o] + pcgo, p[w] =\
  \ p[o] - pow, S[o] = 1 - S[g] - S[w]$ (2.277)\n\n![image](img/F000022si764.png)(2.277)\n\
  \n#### 2.8.6.4 油/水过渡带\n\n油/水过渡带中油相和水相都是连续的：\n\n$$\\begin{matrix} \\frac{dp_o}{dz}\
  \ = \\gamma_o, & \\frac{dp_w}{dz} = \\gamma_w \\end{matrix}$$ (2.278)\n\n![image](img/F000022si765.png)(2.278)\
  \ 此外，\n\n$S[g] = 0$ (2.279)\n\n![image](img/F000022si766.png)(2.279) 从提到的条件可以获得$S[w]\
  \ = p[cgo^{(1)}(p[o] - p[w]), S[o] = 1 - S[g] - S[w], p[g] = p[o] + pcgo$ (2.280)\n\
  \n![image](img/F000022si767.png)(2.280) 其中$p[cgo]$![image](img/F000022si768.png)是可逆的。\n\
  \n#### 2.8.6.5 水层\n\n在水层中，只有水相是连续的：\n\n$$\\frac{dp_w}{dz} = \\gamma_w$$ (2.281)\
  \ ![image](img/F000022si769.png)(2.281) 我们还有$S[g] = S[o] = 0$ (2.282) ![image](img/F000022si770.png)(2.282)\
  \ 从这些初始数据我们可以得到$p[o] = p[w] + pow, S[o] = 1 - S[w], p[g] = p[o] + pcgo$ (2.283)\
  \ ![image](img/F000022si771.png)(2.283) 其中$S[w, \\text{max}]$![image](img/F000022si772.png)是原始水层中的最大水饱和度。\n\
  \n#### 2.8.6.6 初始条件的确定\n\n在储层模拟中，水油界面和气油界面深度是给定的。如果给定了参考压力（例如数据压力）和参考深度（例如数据深度），则所有网格单元的初始压力和饱和度就可以唯一确定。对于未饱和储层，参考深度和压力是任意的，可以在五种流体区域中的任意一个指定。对于饱和储层，参考深度必须是气油深度，参考压力必须是初始泡点压力。\n\
  \n\n\n\n\n当采用静水力条件获取初始压力时，如果初始化部分的深度与储层深度相同，模拟模型将初始化为平衡状态。然而，如果模拟模型处于初始静水力平衡状态，则需要在几个时间步内（不含源项/汇项）执行初始化算法，以允许模型达到平衡状态。如果忽略了毛细压力`p[cow]`![image](img/F000022si773.png)和/或`p[cgo]`![image](img/F000022si774.png))则必须设定初始饱和度，但压力可以从参考压力获取。在这种情况下，通常假设储层中不存在过渡带。\n\
  \n### 2.8.7 求解技术\n\n#### 2.8.7.1 同步求解技术\n同步求解技术是黑油模型最自然的求解方法。它最初由提出\n\n#### 2.8.7.2\
  \ 顺序求解技术\n顺序求解技术的基本思想（\n\n#### 2.8.7.3 迭代隐式压力、显式饱和度求解技术\n针对两相流讨论的 IMPES 方法也适用于黑油系统的求解。当\
  \ IMPES 与牛顿-Raphson 迭代结合时，它被称为迭代 IMPES。在迭代 IMPES 中，压力方程是隐式计算的，而另外两个方程（饱和度和泡点压力）是显式评估的。所有的饱和度函数`k[rw]`![image](img/F000022si780.png)、`k[ro]`![image](img/F000022si781.png)、`k[rg]`![image](img/F000022si782.png)、`p[cw]`![image](img/F000022si783.png)以及`p[cg]`![image](img/F000022si784.png))均在牛顿-Raphson\
  \ 迭代中上一个时间步的饱和值处进行评估，渗透率、相位势和井项中的流体形成体积因子和粘度则使用上一个牛顿-Raphson 迭代值计算。\n\n#### 2.8.7.4\
