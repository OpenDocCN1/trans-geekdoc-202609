  \n### 2.1.1 孔隙尺度下的两相流建模\n在孔隙尺度下精确捕捉多相界面是一项巨大的挑战。锐界面模型将界面定义为具有零厚度的不连续面。这种方法在物理上是直观的，但在数值上需要处理复杂的界面拓扑变化。\n\
  \n### 2.1.2 锐界面模型与界面条件\n#### 2.1.2.1 锐界面模型\n在孔隙尺度下，多相流模拟通常遵循纳维-斯托克斯（N-S）方程。在界面处，需要满足特定的界面条件，如动量守恒和表面张力。\n\
  \n```\n\\rho\\left(\\frac{\\partial \\mathbf{v}}{\\partial t} + \\mathbf{v} \\cdot\
  \ \\nabla\\mathbf{v}\\right) = -\\nabla p + \\mu\\nabla²\\mathbf{v} + \\mathbf{f}\n\
  ```\n结合连续性方程\n\n```\n\\nabla \\cdot \\mathbf{v} = 0\n```\n为了封闭上述方程组，还需要引入。\n\n####\
  \ 2.1.2.2 界面条件\n当流体流过不相容流体的界面时，可以施加三种界面条件：\n\n1. 速度连续性\n```\n\\begin{matrix} v_i\
  \ = \\hat{v}_i, & \\text{on} & \\partial D \\end{matrix}\n```\n其中 $\\hat{v}_i$ 是界面处的流体速度。\n\
  \n2. 运动学条件\n令 $G(\\mathbf{x}, t) = 0$ 表示 $\\partial D$ 的方程。也就是说，任何点 $\\mathbf{x}$\
  \ 的坐标彼此以及与时间相关。考虑在 $\\partial D$ 上以速度 $\\mathbf{v}$ 运动的流体单元，由于该单元保持在界面上，有：\n\n```\n\
  \\begin{matrix} \\frac{dG}{dt} = \\frac{\\partial G}{\\partial t} + v_{j}\\frac{\\\
  partial G}{\\partial x_{j}} = 0, & \\text{on} & \\partial D \\end{matrix}\n```\n\
  此外，由于 $\\nabla G$ 平于 $\\mathbf{n}$，\n\n```\nn_i = \\pm \\frac{\\partial G/\\partial\
  \ x_{i}}{|\\nabla G|}\n```\n结合方程 (2.5) 和 (2.6)，可以得到描述函数 $G$ 变化的方程：\n\n```\n\\begin{matrix}\
  \ \\frac{1}{|\\nabla G|}\\frac{\\partial G}{\\partial t} + n_{j}v_{j} = 0, & \\\
  text{on} & \\partial D \\end{matrix}\n```\n\n\n\n\n公式 (2.7) 被称为运动学条件。特别，稳态下的运动学条件为：\n\
  \n$\\\\begin{matrix} {n\\_{j}v\\_{j} = 0,} & {on} & {\\\\partial D} \\\\ \\\\end{matrix}$\
  \ (2.8)\n\n![image](img/F000022si17.png)(2.8) \n\n## 1. 3. 应力条件\n\n在表面 $\\partial\
  \ D$ 上考虑闭合曲线 `C`![image](img/F000022si18.png)，并令 `m` 为处处切于表面且垂直于 `C` 的单位法向量![image](img/F000022si19.png)。令\
  \ `A` 为 `C` 围成的表面 $\\partial D$ 部分![image](img/F000022si20.png) 的面积，`A` 上的力平衡给出：\n\
  \n$\\int*A**n*[*j*]*d**A* + ∫[*C*]*γ**m*[*i*]*d**l* = 0$ (2.9)\n\n![image](img/F000022si21.png)(2.9)\
  \ \n\n其中 `γ`![image](img/F000022si22.png) 是界面张力，`dl`![image](img/F000022si23.png)\
  \ 是沿 `C` 的弧长度元。\n\n对曲面应用散度定理得到：\n\n$\\\\int\\_{C}\\\\gamma m\\_{i}dl = \\\\int\\\
  _{A}\\\\frac{\\\\partial\\\\gamma}{\\\\partial x\\_{i}}dA - \\\\int\\_{A}{\\\\gamma\
  \ n\\_{i}}\\\\frac{\\\\partial n\\_{j}}}{\\\\partial x\\_{j}}}dA$ (2.10)\n\n![image](img/F000022si24.png)(2.10)\
  \ \n\n应该注意的是，当界面是平面的（即 `n`=const），公式 (2.10) 将还原熟悉的散度定理的二维（2D）形式。据此，力平衡 公式 (2.9)\
  \ 变为：\n\n$\\\\left( {\\\\sigma\\_{ij} - {\\\\widehat{\\sigma}}\\_{ij}} \\\\right)n\\\
  _{j} + \\\\frac{\\\\partial\\\\gamma}{\\\\partial x\\_{i}} = \\\\gamma n\\_{i}\\\
  \\frac{\\\\partial n\\_{j}}}{\\\\partial x\\_{j}}$ (2.11)\n\n![image](img/F000022si25.png)(2.11)\
  \ \n\n由于 `γ`![image](img/F000022si26.png) 仅在 $\\partial D$![image](img/F000022si27.png)\
  \ 上定义，$\\nabla\\gamma$![image](img/F000022si28.png) 沿 $\\partial D$![image](img/F000022si29.png)\
  \ 有分量，但沿沿 `n`![image](img/F000022si30.png)。相比之下，公式 (2.11) 的右侧 `γni`![image](img/F000022si31.png)\
  \ 是平行于 `n`![image](img/F000022si32.png) 的矢量。从内部向外跨越表面 $\\partial D$![image](img/F000022si33.png)\
  \ 时，剪应力产生一个等于 $\\nabla\\gamma$![image](img/F000022si34.png) 的跳跃，而法应力的跳跃等于 $\\nabla\\\
  gamma \\cdot \\mathbf{n}$![image](img/F000022si35.png)。\n\n对于半径为 `R` 的球形液滴![image](img/F000022si36.png)，我们有\
  \ $\\nabla \\cdot \\mathbf{n} = \\partial n[j]/\\partial x[j] = 2/R![image](img/F000022si37.png)。如果\
  \ `γ`![image](img/F000022si38.png) 是常数，公式 (2.11) 可以简化为：\n\n$\\\\left( {\\\\sigma\\\
  _{ij} - {\\\\widehat{\\sigma}}\\_{ij}} \\\\right)n\\_{j} = \\frac{2\\\\gamma n\\\
  _{i}}{R}$ (2.12)\n\n![image](img/F000022si39.png)(2.12) \n\n被称为杨-拉普拉斯方程（静态下），我们得到了毛细现象的杨-拉普拉斯方程：\n\
  \n$p_{c} = \\frac{2\\\\gamma}{R}$ (2.13)\n\n![image](img/F000022si40.png)(2.13)\
  \ \n\n它提供了曲面机械平衡的条件。上述杨-拉普拉斯方程也适用于局部为球形的界面（`R`[1] = `R`[2]![image](img/F000022si41.png)）。一般来说，它具有形式：\n\
  \n$p_{c} = \\gamma\\left( {\\\\frac{1}{R_{1}}} + {\\\\frac{1}{R_{2}}} \\right)$\
  \ (2.14)\n\n\n\n\n需要注意的是，由于标准对流格式的色散过大，通常使用人工压缩法来保留 `ψ` 的跳跃![image](img/F000022si56.png)。在\
  \ VOF 方法中，界面几何形状可以使用分段线性界面构造（PLIC）算法进行重建（见图 2.2），该算法可以按照以下步骤实现：(1) 计算界面的法方向 `m` = ∇`ψ`![image](img/F000022si57.png);(2)\
  \ 假设每个单元内的界面是平面的；(3) 找到一个法于 `m`![image](img/F000022si58.png) 的平面，使其具有液单元体积 `ψ`![image](img/F000022si59.png)。\n\
  \n![图 2.2 通过 PLIC 算法重建的界面几何形状（蓝色：原始界面，红色：通过 PLIC 重建的界面）。PLIC，分段线性界面构造。](img/F000022f02-02-9780128209578.jpg)\n\
  \n图 2.2 通过 PLIC 算法重建的界面几何形状（*蓝色*：原始界面，*红色*：通过 PLIC 重建的界面）。*PLIC*，分段线性界面构造。\n\n执行几何通量计算有两种方法，一种是欧拉法：\n\
  \n```\nf**l**u**x** = ∫[*F*]∫[*t*^(*n*)]^(*t*^(*n*) + *Δ**t*)*ψ***u** ⋅ **n***d**t**d**F*\
  \ (2.18)\n```\n![image](img/F000022si60.png)(2.18)\n\n其中 `F` 是浸湿单元面面积，`n` 是单元面法线。另一种是包含三个步骤的拉格朗日法：(1)\
  \ 执行方向算子分裂；(2) 通过每个单元中线性插值的速度平流平面界面；(3) 计算单元及其邻域中液相体积的变化[Courant–Friedrichs–Lewy\
  \ (CFL) 数≤0.5]。\n\n应该指出的是，VOF 方法并不是精确的体积守恒，在某些极端情况下，可能会在液体中发现 `ψ` > 1![image](img/F000022si61.png)或\
  \ `ψ` < 0![image](img/F000022si62.png)，或者液体中 `ψ` ≠ 1![image](img/F000022si63.png)\
  \ 或气体中 `ψ` ≠ 0![image](img/F000022si64.png)（`ψ` = 1 − `ε`![image](img/F000022si65.png)\
  \ 或 `ψ` = `ε`![image](img/F000022si66.png)）。此外，VOF 方法还存在一些其他问题，例如(1) 低阶界面重建可能较差；(2)\
  \ 不易计算界面曲率；(3) 始终难以结合几何通量计算与界面运动（相变）。\n\n### 2.1.3.2 水平集方法\n\n在 LS 方法中，首先使用 LS 函数\
  \ `G` 定义界面 `Γ`![image](img/F000022si67.png)，\n\n```\nΓ  G = G[0] = const (2.19)\n\
  ```\n![image](img/F000022si68.png)(2.19)\n\n当 `G` > `G[0]`![image](img/F000022si69.png)\
  \ 时表示流体 1，当 `G` < `G[0]`![image](img/F000022si70.png) 时表示流体 2（见图 2.3）。\n\n![图 2.3\
  \ LS 函数。LS，水平集。](img/F000022f02-03-978012820957.jpg)\n\n图 2.3 LS 函数。*LS*，水平集。\n\n\
  然后 LS 方程给出：\n\n```\n∂G/∂t + u·∇G = sp|G| (2.20)\n```\n![image](img/F000022si71.png)(2.20)\n\
  \n其中 `u`![image](img/F000022si72.png) 是速度，`s[p]`![image](img/F000022si73.png) 是相变速度。\n\
  \n`G`![image](img/F000022si74.png) 对于 `G` ≠ `G[0]`![image](img/F000022si75.png)\
  \ 是任意的，通常选择为符号距离函数，`G[0]`![image](img/F000022si76.png)，\n\n```\n|G(x)| = min_{xf∈Γ}|x-xf|,\
  \ |∇G| = 1 (2.21)\n```\n![image](img/F000022si77.png)(2.21)\n\n但也是平滑后的亥维德函数，`G[0]` = 0.5![image](img/F000022si78.png)，\n\
  \n```\nG(x) = { 0, d < -ε; 1/2 + d/2ε + 1/(2π)sin(πd/ε), -ε ≤ d ≤ ε; 1, d > ε }\
  \ (2.22)\n```\n![image](img/F000022si79.png)(2.22)\n\n界面几何属性显示如下：\n\n```\nn = -∇G/|G|,\
  \ κ = ∇·n (2.23)\n```\n![image](img/F000022si80.png)(2.23)\n\n液相体积和相界面面积可以通过下式计算：\n\
  \n```\nVl = ∫Ω H(G-G0)dx, S = ∫Ω δ(G-G0)|∇G|dx (2.24)\n```\n![image](img/F000022si81.png)(2.24)\n\
  \n\n\n\n\n| 方法 | 优点 | 缺点 |\n| --- | --- | --- |\n| VOF | 良好的体积守恒性 | 界面几何重建具有挑战性；法向界面移动并不直接\
  \ |\n| LS | 简单的界面几何重建；自动处理法向界面移动 | 本身不具备体积守恒性 |\n| 移动网格 | 对于小变形非常准确 | 实现复杂；拓扑变化和法向界面移动困难\
  \ |\n| VOSET | 结合了 VOF 和 LS 方法的优点 | |\n| 标记粒子 | 准确 | 三维情况下复杂；在三维中通过人工干预进行拓扑变化具有挑战性\
  \ |\n\n`LS`，水平集；`VOF`，流体法；`VOSET`，流体法与水平集。\n\n## 2.2 基于 Cahn–Hilliard 的扩散界面模型\n\n\
  ### 2.2.1 Cahn–Hilliard 模型的动机与推导\n\n#### 2.2.1.1 背景\n\n为了识别两种流体占据的区域，首先引入相场变量 `ϕ`，使得\n\
  \n$\\phi\\left( {\\\\mathbf{x},t} \\right) = \\left\\{ \\begin{matrix} 1 & {{fluid}\
  \ 1} \\\\ {- 1} & {{fluid} 2} \\\\ \\\\endend{matrix} \\right.$ (2.26)\n\n![image](img/F000022si86.png)(2.26)\n\
  \n相场变量 `ϕ`(`x`,`t`)![image](img/F000022si87.png) 对于系统的体相可以是 1 或 −1，但在界面内部取介于 $\\\
  begin{pmatrix} {- 1,} & 1 \\\\ \\\\end{pmatrix}$![image](img/F000022si88.png) 之间的值，界面被建模为薄但具有非零厚度的瞬态层（参见图\
  \ 2.4）。Cahn–Hilliard 方程是相场变量随时间演化的控制方程。\n\n![图 2.4 相场变量分布。](img/F000022f02-04-9780128209578.jpg)\n\
  \n图 2.4 相场变量分布。\n\n多相流系统的自由能可以关于相场变量表述如下：\n\n`F`(`ϕ`) = `F`[`b`]`(`ϕ`) + `F`[`∇`]`(`ϕ`)\
  \ (2.27)\n\n![image](img/F000022si89.png)(2.27)\n\n其中 `F`[`b`]`(`ϕ`)![image](img/F000022si90.png)\
  \ 是体相自由能；`F`[`∇`]`(`ϕ`)![image](img/F000022si91.png) 是界面自由能。\n\n体相自由能可以通过双井势建模：\n\
  \n$\\begin{matrix} {F\\_{b}\\left( \\phi \\right) = \\int\\_{\\Omega}{f\\_{b}\\\
  left( \\mathbf{x} \\right)d\\mathbf{x},}} & {f\\_{b}\\left( \\phi \\right) = \\\
  frac{c\\_{b}}{4}\\left( {\\\\phi^{2} - 1} \\right)^{2}} \\\\ \\\\ \\end{matrix}$\
  \ (2.28)\n\n![image](img/F000022si92.png)(2.28)\n\n需要注意的是，上述的双井势是自然的，它是具有两个最小值的简单多项式函数之一，一个在\
  \ `ϕ`=1![image](img/F000022si93.png)，另一个在 `ϕ`=-1![image](img/F000022si94.png)。\n\
  \n在 van der Waals–Cahn–Hilliard 理论中，界面自由能具有相场梯度的贡献。虽然梯度定义在整个区域上，但在体相中对自由能的贡献为零：\n\
  \n$F_{\\nabla}\\left( \\phi \\right) = \\int_{\\Omega} \\frac{c_{I}}{2}\\left| \\\
  nabla\\phi \\right|^{2}d\\mathbf{x}$ (2.29)\n\n![image](img/F000022si95.png)(2.29)\n\
  \n其中 `c_I`![image](img/F000022si96.png) 是模型中的参数。`c_I`![image](img/F000022si97.png)\
  \ 一般来说可以是 `ϕ`![image](img/F000022si98.png) 的函数，为了简单起见，这里假设它为常数。将方程 (2.28) 和 (2.29)\
  \ 代入方程 (2.27)，扩散界面的自由能变为：\n\n$F\\left( \\phi \\right) = F_{b}\\left( \\phi \\right)\
  \ + F_{\\nabla}\\left( \\phi \\right) = \\int_{\\Omega} \\left( \\frac{c_{b}}{4}\\\
  left( \\phi^{2} - 1 \\right)^{2} + \\frac{c_{I}}{2}\\left| \\nabla\\phi \\right|^{2}\
  \ \\right)d\\mathbf{x}$ (2.30)\n\n![image](img/F000022si99.png)(2.30)\n\n前面的方程代表了混合物的亲水性和疏水性之间的竞争。亲水性促进相容（从而扩大界面），而疏水性增强分离（从而锐化界面）。因此，随着\
  \ `c_b`![image](img/F000022si100.png) 的减小或 `c_I`![image](img/F000022si101.png) 的增加，界面厚度\
  \ `ζ`![image](img/F000022si102.png) 会增加，实际上对于一维（1D）平衡 $\\zeta = \\sqrt{c_{I}/c_{b}}$![image](img/F000022si103.png)。\n\
  \n根据方程 (2.28) 和 (2.29)，对于流界面的瞬态层，显然：\n\n$\\begin{matrix} {F_{b} \\propto c_{b}\\\
  zeta = \\sqrt{c_{b}c_{I}}, & {F_{\\nabla} \\propto \\frac{c_{I}}{\\zeta^{2}}}\\\\\
  \\\\ \\end{matrix} = \\sqrt{c_{b}c_{I}}$ (2.31)\n\n![image](img/F000022si104.png)(2.31)\n\
  \n例如，对于平衡态的一维流混合物，我们有：\n\n$F_{b} = F_{\\nabla} = \\frac{\\sqrt{2}}{3}\\sqrt{c_{b}c_{I}}$\
  \ (2.32)\n\n![image](img/F000022si105.png)(2.32)\n\n$\\gamma_{I} = F_{I} = F_{b}\
  \ + F_{\\nabla} = \\frac{2\\sqrt{2}}{3}\\sqrt{c_{b}c_{I}}$ (2.33)\n\n![image](img/F000022si106.png)(2.33)\n\
  \n在平衡态下，系统的总体目标是最小化 `F`，这可以分为两个空间尺度上的两个任务：(1) 在 `ζ` 尺度下![image](img/F000022si107.png)，系统试图平衡\
  \ `F_b`![image](img/F000022si108.png) 和 `F_∇`![image](img/F000022si109.png)；(2)\
  \ 在液滴/气泡半径 `R` 尺度下（可以远大于 `ζ`![image](img/F000022si110.png)），系统试图最小化 `F_I`，这通常意味着流界面面积的最小化。相应的瞬态过程（一个在\
  \ `ζ` 尺度![image](img/F000022si111.png)，另一个在 `R` 尺度的动力学）预计也处于不同的时间尺度。\n\n建模瞬态过程的一种常用方法是在方程中引入相场变量对时间的一阶导数。随时间的方程所需的性质包括质量守恒和自由能的衰减（第二定律）。Allen–Cahn\
  \ 方程和 Cahn–Hilliard 方程是两种常用的瞬态相场建模方程，前者不一定守恒，而后者通过设计可以守恒。因此在后续节中，我们将介绍 Cahn–Hilliard\
  \ 方程。\n\n#### 2.2.1.2 （随时间的）Cahn–Hilliard 方程的动机\n\nCahn–Hilliard 方程（John W. Cahn\
  \ 和 John E. Hilliard）从守恒律设计：\n\n$\\frac{\\partial\\phi}{\\partial t} = - \\nabla\
  \ \\cdot \\mathbf{J}$ (2.34)\n\n![image](img/F000022si112.png)(2.34)\n\n这里需要处理 `J`\
  \ 表达式的两个性质：(1) `J` 与 `ϕ`![image](img/F000022si113.png) 之间的本构方程具有自由能衰减性质（第二定律）；(2)\
  \ 为了一致性，当 `μ`=常数时，本构方程也应给出 `J`=0。满足上述两个所需性质的 `J` 与 `ϕ`![image](img/F000022si114.png)之间的本构方程的自然选择是：\n\
  \n`J`(`x*) =  − `M`∇`μ` (2.35)\n\n![image](img/F000022si115.png)(2.35)\n\n其中 `μ` = `δ**F*/*δ**ϕ*` = `c`[`b`]`(`ϕ`³−`ϕ`) − `c`[`I`]∇²*ϕ*![image](img/F000022si116.png);`M`\
  \ 是迁移率。\n\nCahn–Hilliard 方程的能量律读取为\n\n\n\n\n\n$\\frac{\\partial F}{\\partial t}\
  \ = \\left\\langle \\frac{\\partial\\phi}{\\partial t},\\frac{\\delta F}{\\delta\\\
  phi} \\right\\rangle = M\\left\\langle \\nabla\\mu,\\nabla\\mu \\right\\rangle =\
  \ - M\\left|\\nabla\\mu\\right|^{2} \\leq 0$ (2.36) ![image](img/F000022si17)\n\n\
  ## 2.2 N–S/C 模型的正式推导\n\n### 2.2.1 应力张量的各向异性\n回想压力可以被视为流体对容器壁施加的表面力。压力存在于 VOF 内部的每一点，方向\
  \ `n` 压力 `p` 定义为 $p = -\\sigma \\cdot n$![image](img/F000022si18)。我们回想**帕斯卡定律**（Pascal’s\
  \ law）：对于静止流体，某一点的压力在所有方向上都是相同的。它可以应用于平衡态的单流体系统，也可以应用于多相系统的体区域。根据帕斯卡定律，我们知道两相系统的体区域应力张量是各向同性的（即\
  \ `sigma_{ij} = -p\\delta_{ij}`![image](img/F000022si19)，但在瞬态层中 `sigma_{ij}`![image](img/F000022si20)\
  \ 可能是各向异性的。\n\n### 2.2.2 平界面\n我们考虑一个 Cahn–Hilliard 流体混合物，其包含两个体相，由垂直于 `x` 方向的平面界面分隔。我们假设界面跨越从\
  \ `x = -L`![image](img/F000022si21) 到 `x = L`![image](img/F000022si22)。我们假设系统是静态且处于平衡的。在界面的瞬态层中，应力张量\
  \ `sigma_{ij}`![image](img/F000022si23) 可能不是各向同性的。由于界面是平面的且垂直于 `x = 0`![image](img/F000022si24)\
  \ 方向，界面张力必须作用于 `y = 0`![image](img/F000022si25) 和 `z = 0`![image](img/F000022si26)\
  \ 方向，但不作用于 `x = 0`![image](img/F000022si27) 方向，这导致了应力张量的各向异性。\n\n令 `p_x = -\\sigma_{xx}`![image](img/F000022si28)且\
  \ `tau_{ij} = p_x\\delta_{ij} + sigma_{ij}`![image](img/F000022si29)。由于坐标与主方向对齐，`tau_{ij}`![image](img/F000022si30)\
  \ 是对角矩阵。显然，`tau_{xx} = 0`![image](img/F000022si31)，但 `tau_{yy}`![image](img/F000022si32)\
  \ 和 `tau_{zz}`![image](img/F000022si33) 非零的。`tau_{yy}`![image](img/F000022si34)\
  \ 和 `tau_{zz}`![image](img/F000022si35) 与界面张力的关系为：\n\n$\\begin{matrix} \\gamma_{I,y}\
  \ = \\int_{-L}^{L}\\tau_{yy}dx, & \\gamma_{I,z} = \\int_{-L}^{L}\\tau_{zz}dx \\\
  end{matrix}$ (2.37)\n\n![image](img/F000022si136.png)(2.37)\n\n从我们之前对扩散界面模型的 1D\
  \ 解析解中，我们知道界面张力为：\n\n$\\begin{matrix} \\gamma_{I} = \\gamma_{I,y} = \\gamma_{I,z}\
  \ = \\int_{-L}^{L}\\left( f_{b}(\\phi) + \\frac{c_{I}}{2}(\\partial_{x}\\phi)^{2}\\\
  right)dx \\\\ \\int_{-L}^{L}c_{I}(\\partial_{x}\\phi)^{2}dx = \\int_{-L}^{L}2f_{b}(\\\
  phi)dx = \\frac{2\\sqrt{2}}{3}c_{b}c_{I} \\end{matrix}$ (2.38)\n\n![image](img/F000022si37.png)(2.38)\n\
  \n对比之前的方程，假设 `tau_{yy} = tau_{zz} = c_{I}(\\partial_{x}\\phi)²`![image](img/F000022si38)\
  \ 是合理的。因此我们得到了 `tau_{ij}`![image](img/F000022si39)的表达式：\n\n```\n\\tau = c_{I}(\\\
  partial_{x}\\phi)^{2}\\begin{pmatrix} 0 & 0 & 0 \\\\ 0 & 1 & 0 \\\\ 0 & 0 & 1 \\\
  end{pmatrix} = c_{I}(\\nabla\\phi\\cdot\\nabla\\phi)\\mathbf{I} - c_{I}(\\partial_{x}\\\
  phi)^{2}\\begin{pmatrix} 1 & 0 & 0 \\\\ 0 & 0 & 0 \\\\ 0 & 0 & 0 \\end{pmatrix}\
  \ = c_{I}(\\nabla\\phi\\cdot\\nabla\\phi)\\mathbf{I} - c_{I}\\nabla\\phi\\otimes\\\
  nabla\\phi\n```\n\n![image](img/F000022si40.png)(2.39)\n\n通过快速验证，最后最后一行确实是一个张量。从应力\
  \ `sigma = -p_x\\mathbf{I} + \\tau`![image](img/F000022si41)中，我们得到：\n\n$\\sigma\
  \ = (c_{I}(\\nabla\\phi\\cdot\\nabla\\phi) - p_x)\\mathbf{I} + c_{I}\\nabla\\phi\\\
  otimes\\nabla\\phi$ (2.40) ![image](img/F000022si41)\n\n上述应力张量可以分解为各向同性项和各向异性项：\n\
  \n$\\sigma = \\sigma_{iso} + \\sigma_{aniso}$ (2.41) ![image](img/F000022si42)\n\
  \n其中 `sigma_{iso} = (c_{I}(\\nabla\\phi\\cdot\\nabla\\phi) - p_x)\\mathbf{I}`![image](img/F000022si43)且\
  \ `sigma_{aniso} = c_{I}\\nabla\\phi\\otimes\\nabla\\phi`![image](img/F000022si44)。\n\
  \n从之前的方程可以清楚地看到，对于压缩流体，各向同性加各向异性的分解是不唯一的。在不可压缩流中，特定的 `sigma_{iso}`![image](img/F000022si45)\
  \ 形式会被吸收到压力中，这来自于能量的梯度，并且可以模拟界面张力的影响。\n\n回想运动方程 $\\rho\\frac{D_i}{Dt} = \\rho g_i\
  \ + \\frac{\\partial\\sigma_{ij}}{\\partial x_j}$![image](img/F000022si46)，它可以推导出恒定粘度的单相\
  \ N–S 方程：\n\n$\\rho\\left( \\frac{\\partial\\mathbf{v}}{\\partial t} + \\mathbf{v}\
  \ \\cdot \\nabla\\mathbf{v} \\right) = \\rho\\mathbf{g} - \\nabla p + \\eta\\nabla^{2}\\\
  mathbf{v}$ (2.42) ![image](img/F000022si47)\n\n(2.42) 公式不包含建模界面张力的各向异性项 `sigma_{aniso}`\
  \ (2.42)。包含它后，可以得到以下两相 N–S 方：\n\n$\\rho\\left( \\frac{\\partial\\mathbf{v}}{\\partial\
  \ t} + \\mathbf{v} \\cdot \\nabla\\mathbf{v} \\right) = \\rho\\mathbf{g} - \\nabla\
  \ p + \\eta\\nabla^{2}\\mathbf{v} + \\nabla \\cdot \\sigma_{aniso}$ (2.43) ![image](img/F000022si48)\n\
  \n有了结果 `sigma_{aniso} = c_{I}\\nabla\\phi\\otimes\\phi`![image](img/F000022si49)，(2.44)\
  \ 公式变为：\n\n$\\rho\\left( \\frac{\\partial\\mathbf{v}}{\\partial t} + \\mathbf{v}\
  \ \\cdot \\nabla\\mathbf{v} \\right) = \\rho\\mathbf{g} - \\nabla p + \\eta\\nabla^{2}\\\
  mathbf{v}$ (2.44) ![image](img/F000022si50)\n\n定义 `sigma_{vis} = \\eta(\\nabla\\\
  mathbf{v} + \\nabla\\mathbf{v}^T)`![image](img/F000022si51)，(2.45) 公式变为：\n\n$\\\
  rho\\left( \\frac{\\partial\\mathbf{v}}{\\partial t} + \\mathbf{v} \\cdot \\nabla\\\
  mathbf{v} \\right) = \\rho\\mathbf{g} - \\nabla p + \\nabla \\cdot (\\sigma_{vis}\
  \ + \\sigma_{aniso})$ (2.45) ![image](img/F000022si52)\n\n或者\n\n$\\rho\\left( \\\
  frac{\\partial\\mathbf{v}}{\\partial t} + \\mathbf{v} \\cdot \\nabla\\mathbf{v}\
  \ \\right) = \\rho\\mathbf{g} - \\nabla p + \\nabla \\cdot (\\sigma_{vis} - c_{I}\\\
  nabla\\phi\\otimes\\nabla\\phi)$ (2.46) ![image](img/F000022si53)\n\n\n\n\n\n$\\\
  \\nabla \\\\cdot \\\\left( {\\\\nabla\\\\phi \\\\otimes \\\\nabla\\\\phi} \\\\right)\
  \ = \\\\nabla\\\\phi\\\\nabla^{2}\\\\phi + \\\\nabla\\\\left( \\\\frac{\\nabla\\\
  \\phi \\\\cdot \\\\nabla\\\\phi}{2} \\\\right)$ (2.47)\n\n![image](img/F000022si158.png)(2.47)\
  \ \n\n回 ∇ ⋅ `σ`[`aniso]` = ∇ ⋅ (−`c[I]∇ϕ⊗∇ϕ`)![image](img/F000022si159.png)，由于我们可以将\
  \ (`c[I]∇ϕ⋅∇ϕ/2`）![image](img/F000022si160.png) 吸收到压力项中，界面张力的影响也可以写为：\n\n∇ ⋅ `σ`[`aniso]` = − `c[I]∇ϕ∇²ϕ`\
  \ (2.48)\n\n![image](img/F000022si161.png)(2.48) \n\n回 `μ` = `μ`[`b]`���−− `c[I]∇²ϕ`![image](img/F000022si162.png)\
  \ 以及 `μ`[`b]`∇ϕ` = ∇`f`[`b]`![image](img/F000022si163.png)，这意味着 `μ`∇ϕ` = ∇`f`[`b]`����− `c[I]∇ϕ∇²ϕ`![image](img/F000022si164.png)。由于\
  \ `f`[`b]`![image](img/F000022si165.png) 可以被吸收到压力项中，我们同样有：\n\n∇ ⋅ `σ`[`aniso]` = `μ`∇ϕ\
  \ (2.49)\n\n![image](img/F000022si166.png)(2.49)  \n\n### 2.2.3 N–S 界面项与 C–H 模型的一致性\n\
  \n#### 2.2.3.1 来自 Cahn–Hilliard 模型的平衡条件与偏微分方程\n\n回无对流的 Cahn–Hilliard 方程：\n\n$\\\\\
  frac{\\\\partial\\\\phi}{\\\\partial t} = \\\\nabla \\\\cdot \\\\left( {M\\\\nabla\\\
  \\mu} \\\\right)$ (2.50)\n\n![image](img/F000022si167.png)(2.50) \n\n其中 `μ` = `c`[`b]`(`ϕ³−ϕ`)����− `c[I]`∇²ϕ`![image](img/F000022si168.png)\
  \ 且 `M` 是迁移系数。\n\n在平衡状态下，方程 (2.50) 结合齐次纽曼边界条件意味着 `μ` = `cconst`![image](img/F000022si169.png)。很容易看出在体相区域内\
  \ `μ` = `μ`[`b]`����− `μ`[`∇]`����= 0����+ 0![image](img/F000022si170.png)，因此上述常数必须为零；换句话说，`μ`\
  \ 在处处消失：\n\n`μ` = 0 (2.51)\n\n![image](img/F000022si171.png) \n\n因此，平衡态下的 Cahn–Hilliard\
  \ 方程变为：\n\n`c`[`I]`∇²ϕ` = `μ`[`b]`(`ϕ`)����− `c`[`b]`(`ϕ`) (2.52)\n\n![image](img/F000022si172.png)\
  \ \n\n定义：\n\n`p`[`b]` := `μ`[`b]`(`ϕ`)����− `f`[`b]`(`ϕ`) (2.53)\n\n![image](img/F000022si173.png)\n\
  \n此处定义 (2.53) 来自热力学。如果对于压缩流体有一致的状态方程 (EOS)，上述定义提供了体相中的热力学压力。对于 Cahn–Hilliard 模型：\n\
  \n$f = \\frac{c_{b}}{4}(\\phi^{2} - 1)^{2} + \\frac{c_{I}}{2}|\\nabla\\phi|^{2}$\
  \ (2.54)\n\n![image](img/F000022si174.png) \n\n则有：\n\n$\\mu = \\frac{\\delta f}{\\\
  delta\\phi} = c_{b}(\\phi^{2} - 1) - c_{I}\\nabla^{2}\\phi$ (2.55)\n\n![image](img/F000022si175.png)\
  \ \n\n$\\widehat{p} = - f + \\mu\\phi = - \\frac{c_{b}}{4}(\\phi^{2} - 1)^{2} -\
  \ \\frac{c_{I}}{2}|\\nabla\\phi|^{2} + c_{b}\\phi(\\phi^{2} - 1) - c_{I}\\nabla^{2}\\\
  phi$ (2.56)\n\n![image](img/F000022si176.png) \n\n#### 2.2.3.2 平衡方程的含义\n\n平衡态下的\
  \ Cahn–Hilliard 方程意味着：\n\n`μ`[`b]`(`ϕ`)����= `c`[`I]`∇²ϕ (2.57)\n\n![image](img/F000022si177.png)\
  \ \n\n体相自由能 `f`[`b]` 变为：\n\n$\\nabla f_{b} = \\frac{\\partial f_{b}}{\\partial\\\
  phi}\\nabla\\phi = \\mu_{b}\\nabla\\phi = c_{I}\\nabla^{2}\\phi$ (2.58)\n\n![image](img/F000022si178.png)\
  \ \n\n此前定义的 `p`[`b]`![image](img/F000022si179.png) 变为：\n\n`p`[`b]` = `μ`[`b]`����− `f`[`b]`(`ϕ`)����= `c`[`I]`∇²ϕ` − `c`[`I]`∇²ϕ∇ϕ`\
  \ (2.59)\n\n![image](img/F000022si180.png) \n\n方程 (2.59) 可以进一步简化为：\n\n`p`[`b]` − `c`[`I]`∇(∇²ϕ) = 0\
  \ (2.60)\n\n![image](img/F000022si181.png) \n\n#### 2.2.3.3 力学平衡方程\n\n通过一些代数运算（优选使用爱因斯坦求和符号），可以证明以下数学恒等式：\n\
  \n$\\phi\\nabla\\left( \\nabla^{2}\\phi \\right) = \\nabla\\left( \\phi\\nabla^{2}\\\
  phi \\right) + \\nabla\\left( \\frac{\\nabla\\phi \\cdot \\nabla\\phi}{2} \\right)\
  \ - \\nabla \\cdot \\left( \\nabla\\phi \\otimes \\nabla\\phi \\right)$ (2.61)\n\
  \n![image](img/F000022si182.png)(2.61) \n\n将上述恒等式 (2.61) 代入平衡态 方程 (2.60) 得到：\n\n\
  ∇ ⋅ `σ` : = ∇ ⋅ (−`p̂`[`I]`−`c`[`I]`∇ϕ⊗∇ϕ*`) = 0 (2.62)\n\n![image](img/F000022si183.png)(2.62)\
  \ \n\n其中 $\\widehat{p}: := p_{b} - c_{I}\\phi\\nabla^{2}\\phi - \\frac{c_{I}}{2}\\\
  nabla\\phi \\cdot \\nabla\\phi$![image](img/F000022si184.png)。\n\n#### 2.2.3.4 平衡条件致性\n\
  \n回此前得到的应力表达式 (2.2)，我们看到 方程 (2.62) 包含了相同的 `σ`[`aniso]`![image](img/F000022si185.png)。事实上，可以看出：\n\
  \n$\\widehat{p} = p_{b} - c_{I}\\phi\\nabla^{2}\\phi + \\frac{c_{I}}{2}\\nabla\\\
  phi \\cdot \\nabla\\phi$ 之前的推导显示力学平衡 ∇ ⋅ `σ` : = ∇ ⋅ (−`p̂`[`I]`−`c`[`I]`∇ϕ⊗∇ϕ*`) = 0![image](img/F000022si187.png)\
  \ 是化学条件 `μ` = 0![image](img/F000022si189.png) 的结果。换句话说，化学平衡意味着 Cahn–Hilliard 模型。\n\
  \n### 2.2.4 带有边界和初始条件的 N–S/C–H 模型\n\n#### 2.2.4.1 无滑移边界条件\n\n无滑移边界条件（即流体与固体界面处的相对速度为零）是连续体动力学的基石。无滑移边界条件在低流速的宏观流动中效果良好；但众周知，无滑移边界条件不适用于移动接触线。在一个流体取代另一个流体的不相流中，接触线在固体表面似乎在“滑移”，这直接违反了无滑移边界条件。此外，如果在整个固体壁上应用无滑移边界条件，粘性应力会在接触线处发散。\n\
  \n这种应力发散在流体界面不随时间变化的参考系中最为明显，此时壁以速度 `U` 移动。由于流体速度必须从壁处的 `U`（无滑移边界条件的要求）变为流体界面处的零（界面是静态的），粘性应力随\
  \ `η`*U`/*x*![image](img/F000022si190.png) 变化，其中 `η`![image](img/F000022si191.png)\
  \ 是粘度，`x` 是 离接触线的距离。显然，当 `x`→0 时，应力会发散![image](img/F000022si192.png)，因为流体速度从 `U`\
  \ 变为零的距离在接近接触线时趋于消失。特别是，这种应力发散是不可积分的（1/*x* 的积分得到 ln*x*![image](img/F000022si193.png)），这意味着无限粘性耗散。\n\
  \n#### 2.2.4.2 动量和质量平衡\n\n结合结果 ∇ ⋅ `σ`[`aniso]` = `μ`∇ϕ![image](img/F000022si194.png)，（两相）N–S\
  \ 方程为：\n\n\n\n\n$\\begin{matrix} {\\\\rho\\\\left( {\\\\frac{\\partial\\\\mathbf{v}}{\\\
  \\partial t} + \\\\left( {\\\\mathbf{v} \\\\cdot \\\\nabla} \\\\right)\\\\mathbf{v}}\
  \ \\\\right) = \\\\rho\\\\mathbf{g} - \\\\nabla p + \\\\eta\\\\nabla^{2}\\\\mathbf{v}\
  \ + \\\\mu\\\\nabla\\\\phi,} & {in} & \\\\Omega \\\\ \\\\end{matrix}$ (2.64)\n\n\
  ![image](img/F000022si195.png)(2.64)\n\n体积守恒性仍然适用：\n\n$\\begin{matrix} {\\\\nabla\
  \ \\cdot \\\\mathbf{v} = 0,} & {in} & \\\\Omega \\\\ \\\\end{matrix}$ (2.65)\n\n\
  ![image](img/F000022si196.png)(2.65)\n\n界面的传输由 Cahn–Hilliard 方（带对流）建模：\n\n$\\begin{matrix}\
  \ {\\\\frac{\\\\partial\\\\phi}{\\\\partial t} + \\\\mathbf{v} \\\\cdot \\\\nabla\\\
  \\phi = M\\\\nabla^{2}\\\\mu,} & {in} & \\\\Omega \\\\ \\\\end{matrix}$ (2.66)\n\
  \n![image](img/F000022si197.png)(2.66)\n\n### 2.2.4.3 广义 Navier 边界条件\n\n我们应用广义 Navier\
  \ 边界条件：\n\n$\\begin{matrix} {\\\\beta\\\\nu\\\\_{\\\\tau}^{slip} = - \\\\eta\\\\\
  left( {\\\\partial\\\\_{n}\\\\nu\\\\_{\\\\tau} + \\\\partial\\\\_{\\\\tau}\\\\nu\\\
  \\_{n}} \\\\right) + L\\\\left( \\\\phi \\\\right)\\\\partial\\\\_{\\\\tau}\\\\\
  phi,} & \\\\begin{matrix} {on} & \\\\Gamma\\\\_{slip} \\\\\\\\ \\\\end{matrix} \\\
  \\ \\\\end{matrix}$ (2.67)\n\n![image](img/F000022si198.png)(2.67)\n\n其中 `ν`[`τ`]`(`slip`)![image](img/F000022si199.png)\
  \ 是与壁面相关的（切向）滑移速度；`L`(`ϕ`)`∂`[`τ`]`ϕ`![image](img/F000022si200.png) 是未补偿的杨应力，其中\
  \ `L`(`ϕ`) = `c`[`I`]``∂`[`n`]`ϕ` + ((∂`γ`[`w**f**]`(`ϕ`))/∂`ϕ`)`![image](img/F000022si201.png),\
  \ `γ`[`w**f**]`(`ϕ`) =  − (1/2)`γ`cosↆ (`θ`[`S`])sinↆ (*π*/2)*ϕ*)![image](img/F000022si202.png)\
  \ 是流体-固体界面自由能密度，`θ`[`S`]`![image](img/F000022si203.png) 是静态接触角；`v`[`n`]` = **v** ⋅����**n**`![image](img/F000022si204.png)\
  \ 和 `v`[`τ`]` = **v** ⋅����**τ**`![image](img/F000022si205.png) 分别是沿滑移边界法向和切向方向的速度，其中\
  \ **n** 和 **τ**![image](img/F000022si206.png) 是滑移边界的单位法向量和切向向量。\n\n### 2.2.4.4 动态边界条件和非渗透边界条件\n\
  \n对于相场方程，施加以下动态边界条件：\n\n$\\begin{matrix} {\\\\frac{\\\\partial\\\\phi}{\\\\partial\
  \ t} + u_{\\\\tau}\\\\partial\\\\_{\\\\tau}\\\\phi = - \\\\Gamma L\\\\left( \\\\\
  phi \\\\right),} & \\\\begin{matrix} {on} & \\\\Gamma\\\\_{slip} \\\\\\\\ \\\\end{matrix}\
  \ \\\\ \\\\end{matrix}$ (2.68)\n\n![image](img/F000022si207.png)(2.68)\n\n其中 `Γ`![image](img/F000022si208.png)\
  \ 是（正的）现象学参数。\n\n在固体边界上采用以下非渗透边界条件：\n\n$\\begin{matrix} {\\\\nu\\\\_{n} = 0,} &\
  \ \\\\begin{matrix} {on} & {\\\\Gamma\\\\_{slip},} \\\\\\\\ \\\\end{matrix} \\\\\
  \ \\\\end{matrix}\\\\begin{matrix} & \\\\begin{matrix} {\\\\partial\\\\_{n}\\\\\
  mu = 0,} & \\\\begin{matrix} {on} & \\\\Gamma\\\\_{slip} \\\\\\\\ \\\\end{matrix}\
  \ \\\\\\\\ \\\\end{matrix} \\\\ \\\\end{matrix}$ (2.69)\n\n![image](img/F000022si209.png)(2.69)\n\
  \n边界条件对于速度、压力和相场总是给定的。\n\n### 2.2.4.5 无量纲方程和边界条件 当长度通过参考长度 `L0`![image](img/F000022si210.png)\
  \ 缩放，速度通过参考速度 `V` 缩放，时间通过 `L0`/V`![image](img/F000022si211.png) 缩放，压力通过 `V`/L0`![image](img/F000022si212.png)\
  \ 缩放时，可以得到以下无量纲控制方程：\n\n$\\begin{matrix} {\\\\R\\\\left( {\\\\frac{\\\\partial\\\
  \\mathbf{v}}{\\\\partial t} + \\\\left( {\\\\mathbf{v} \\\\cdot \\\\nabla} \\\\\
  right)\\\\mathbf{v}} \\\\right) = \\\\mathbf{g} - \\\\nabla p + \\\\nabla^{2}\\\\\
  mathbf{v} + \\\\lambda\\\\phi,} & {in} & \\\\Omega \\\\ \\\\end{matrix}$ (2.70a)\n\
