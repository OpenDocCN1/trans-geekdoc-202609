  \n必须注意的是，平衡分布仅适用于小速度或小马赫数。\n\n由于单组分流已经有了大量工作，下面将讨论以下 LBM。多组分和多相 LBM 比简单的单组分更具趣味且实用。为了符合当前研究趋势，定义系统中所有组分（即多隙介质壁和多种流体/气体）的集合\
  \ `Ψ`![image](img/F000058si517.png)\n\n$f_{i}^{\\sigma}\\left( \\mathbf{x} + \\\
