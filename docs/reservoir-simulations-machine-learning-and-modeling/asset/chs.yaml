  基于模式的 MPS 重建方法不是逐点重建孔隙结构，而是被用于逐模式地生成实现模式。基于模式的 MPS 重建通过两个步骤进行：模式分类和模式模拟。\n\n首先，使用模板\
  \ `T` 扫描整个训练图像以提取训练图像中所有存在的模式。相同的模式被收集形成一个模式类，并可以计算每个模式类的频率。然后，基于顺序范式进行模拟过程。从模拟场中选择一个非估计点\
  \ ($\\overset{⃑}{\\\\mathbf{r}}$![image](img/F00006Xsi64.png))，并识别其邻域中的约束数据事件 [标记为\
  \ `dev[T]`($\\overset{⃑}{\\\\mathbf{r}}$![image](img/F00006Xsi65.png))]。从模式数据库中选择最匹配的模式并在模拟场所填充。在重建过程中，可能会有多个模式与数据兼容。在这种情况下，根据频率随机选择这些模式中的一个。使用栅格路径访问模拟场，重复执行上述算法，直到重建整个孔隙结构（\n\
  \n\n\n\n\n这种基于模式的重建方法最大的挑战在于如何处理两个模拟块之间潜在的非连续性。一种解决方案是在两个块之间设置一个重叠区域，并将重叠区域内的点作为后续块重建的条件数据。然而，当模板\
  \ `T` 非常大或者当训练图像包含的信息不足以支持条件数据时，可能会出现问题。这可能导致在模式数据库中无法找到匹配的模式。在这种情况下，目标块被分割成更小的数据事件，直到在训练图像中找到与条件数据匹配的模式。图\
  \ 6.14 通过一个包含四个块的模拟场的虚构示例，说明了用于基于模式重建的自适应递归模板拆分方法。图 6.15A 展示了重建的初始状态，其中带有数据事件`devT)`的第一个块已经完成重建，而第二个块`dev[T)]是下一个待估计候选。绿色区域是第一个和第二个块之间的重叠部分，用作第二个块重建的条件数据。假设从数据事件数据库中成功为第二个块找到了匹配模式，然后重建步骤进入带有数据事件`devT)`的第三个块（见图\
  \ 6.15B）。图 6.15C 说明了整个第三个块没有匹配模式的情况，此时目标块被分为更小的块，标记为`dev[T]^(s1)(${\\\\overset{⃑}{\\\
