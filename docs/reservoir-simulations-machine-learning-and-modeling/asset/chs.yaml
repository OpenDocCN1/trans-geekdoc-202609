- "# 储藏模拟：机器学习与建模\n\n\n\n\n\n\n孙曙 (Shuyu Sun)\n沙特阿卜杜拉科学与技术大学，沙特阿拉伯，图瓦\n\n张涛 (Tao Zhang)\n\
  沙特阿卜杜拉科学与技术大学，沙特阿拉伯，图瓦\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n对地质构造中的地下储层进行理解和建模，对于做出储层管理相关的决策至关重要。地下储层是复杂的系统，涉及许多重叠现象，这使得模拟成为一项真正的挑战。多相、多组分流体流动需要通过涉及多物理场、多尺度、多领域和多数值的良好数值模拟来解决。作为一种有效方法，储层模拟已成为石油开采之外许多科学和工程应用组成部分。近年来，随着机器学习和深度学习等各种相关技术的快速发展，该领域比任何时候都要都要。如今，全球许多油公司正致力于开发先进的储层模拟技术，利用最先进的数值方法结合机器学习来处理复杂的实际工程案例。许多新课题涌现出来，包括非常规页页岩和紧密储层、二氧化碳封存、环保型水驱以及人工智能管理和预测系统。\n\
  \n在储层模拟领域拥有了 20 多年的研究经验和 10 多年的教学经验后，作者们意识到该领域的学生和研究人员面临着许多挑战。对于该领域的新学者来说，一个共同问题是被许多极少详细解释的术语和方程所困扰和恐惧。对于具有某些基础知识的学生，他们面临的紧迫问题是选择最佳方向以继续学习和做出贡献。对于在该领域受过良好训练的研究人员，他们面临的关键问题是跟上最先进的发展并避免重复轮子。为了满足这些紧迫需求，作者们决定写一本书，这本书可以作为该领域学生和初学者的教科，帮助他们熟悉基础知识和严谨的数学推导；也可以供熟练的工程师和研究人员使用，帮助他们接触最先进的研究课题。\n\
  \n本书的设计结构如下：在引言中，读者将接触到控制储层模拟中流体流动的基本概念、术语和方程。在[第 2 章](#chp002.xhtml#chp002）经典储层模拟综述中，我们将详细回顾经典的储层模拟方法，并根据我们与全球领先小组的积极互动提出建议。在[第\
  \ 3 章](#chp003.xhtml#chp003）孔隙尺度储层模拟的最新进展中，将介绍储层模拟的孔隙尺度研究，包括相分离的热力学平衡计算，以及使用先进能量稳定算法进行的多组分多相流体流动模拟。在[第\
  \ 4 章](#chp004.xhtml#chp004）达西尺度储层模拟的最新进展中，我们将探讨达西尺度的储层模拟研究，这更直接适用于实际现场。在[第 5 章](#chp005.xhtml#chp005）多尺度和中尺度储层模拟的最新进展中，将介绍中尺度和多尺度技术，包括流行的格子玻尔兹曼方法（LBM）。在[第\
  \ 6 章](#chp006.xhtml#chp006）机器学习在储层模拟中应用的最新进展中，我们将关注机器学习算法在孔隙尺度储层模拟中的应用。在[第 7 章](#chp007.xhtml#chp007）利用深度学习算法加速闪相计算的最新进展中，详细介绍了使用深度学习加速的相平衡计算。每一章都设计了练习和案例研究，帮助读者检查自己的理解情况。\n\
  \n\n\n\n储层模拟的最新进展可以被视为速度与精度；耦合流体流动与地力学应力模型；以及热应力下的流体流动建模。随着计算机速度遵循摩尔定律增长，内存随之增加。对于储层模拟研究，这意味着通过在泰勒级数近似中引入高阶项以及使用大量的网格块（多达十亿个网格）来实现更高的精度。这一进展中最大的困难在于，输入数据的质量并没有随着计算机的速度和内存同步提高。请注意，如果输入数据点的数量按比例增加，引入大量的网格块会导致预测结果比少网格的预测更具随意性。在对裂缝地建模时，这个问题尤为突出。储层岩小于代表性单元体积（`REV`）是一个难题，对于具有较高\
  \ `REV` 的裂缝地，这一问题更加突出。对于裂缝地，只能留下一狭窄的网格带，超出该区域的解要么毫无意义（网格太大），要么不稳定（网格太小）。\n\n在储层模拟器中，耦合不同的流动方程一直是一个挑战。在这种背景下，岩石温度的变化会引起热弹性应力，这种应力可以产生新裂缝，也可以改变现有裂缝的形状，从而改变主要生产的性质。可以注意的是，热应力由于注入流体与储层流体之间的温度差或焦耳-汤姆效应而产生。然而，在未固结砂的研究中，报道称热应力与机械应力相比可以不计。\n\
  \n## 1.2 定义\n\n### 1.2.1 通用定义\n\n`Oilfield units` 的单位是桶（`bbl` 或 `B`）；`1` bbl=`5.615`\
  \ `ft³` 或 `0.159` `m³`。\n\n`A STB` 是在某些表面标准条件下（储罐内）定义的相同体积，通常为 60°F 和 `14.7` `psi`。\n\
  \n`A reservoir barrel`（`RB`）是在储层条件下定义的相同体积，范围可以从浅储层的 ~90°F 和 `1500` `psi` 到极深储层（高温高压，HTHP）的\
  \ >350°F 和 `15,000` `psi`。请注意，当产出 `1` `RB` 油时，其地表体积通常小于 `1` `B`，因为它流失了气体。（参见地层体积系数。）\n\
  \n`Oil types`：干气；湿气；气藏凝胶；挥发性油；“黑”油；重油（粘性油）；参见表 1.1。\n\n#### 表 1.1 从干气到沥青的各种油型描述。\n\
  \n| 储层流体 | 表面外观 | GOR 范围 | API 度 (° | |典型成分 (mol%) |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| --- | --- | --- | --- | --- |\n| C[1] | C[2] | C[3] | C[4] | C[5]\
  \ |\n| 湿气 | 无色气体 | >100 Mscf/bbl | 一些草色液体 | 60-70 | 96.0 | 2.7 | 0.3 | 0.5 | 0.4\
