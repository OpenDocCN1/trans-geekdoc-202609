  partial t^{2}}} \\\\right) = \\\\frac{1}{\\\\tau}\\\\left( {f\\\\_{i}^{\\mathit{eq}}\
  \ - f\\\\_{i}} \\\\right). (5.137)$$\n\n![image](img/F000058si546.png)(5.137)\n\n\
  我们将粒子分布函数展开为平衡态非平衡态分量\n\n`f[i]` = `f[i]^(eq)` + `Kf[i]^(neq)`, `f[i]^(neq)` = `f[i]^((1))` + `Kf[i]^((2))` + `O(K²)`,\
  \ (5.138)\n\n![image](img/F000058si547.png)(5.138)\n\n其中 `K`![image](img/F000058si548.png)\
  \ 是克努森数。\n\n回想克努森数 `Kn`![image](img/F000058si549.png) 或 `K`![image](img/F000058si550.png)\
