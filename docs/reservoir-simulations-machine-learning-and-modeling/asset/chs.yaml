  \ 表示基面深度 `Z`[`bh`]^(`l`)![image](img/F000022si323.png) 处的井底压力 (BHP)；`r`[`e`]^(`l`)![image](img/F000022si324.png)\
  \ 表示等井半径；`r`[`c`]^(`l`)![image](img/F000022si325.png) 是第 `l` 口井的半径；$\\overline{k}$![image](img/F000022si326.png)\
  \ 是井处 `k` 的某种平均值。\n\n对于对角张量 $\\overline{k} = {diag}\\\\left( {k\\\\_{11},k\\\\_{22},k\\\
  \\_{33}} \\\\right)$![image](img/F000022si327.png)，例如，在垂直井处 $\\overline{k} = k_{11}$![image](img/F000022si328.png)，其中\
