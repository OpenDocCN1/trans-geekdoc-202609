  \\partial y} = K\\\\frac{\\\\partial}{\\\\partial y\\_{1}},\\\\cdots\\\\nabla =\
  \ K\\\\nabla\\_{1}.$ (5.141)$$\n\n![image](img/F000058si553.png)(5.141)\n\n通过将展开的平衡态非平衡态代入泰勒展开并分离为不同的\
  \ `K`![image](img/F000058si554.png)阶，即可得到连续方程。将展开代入泰勒展开得到：\n\n$$\\begin{matrix}\
  \ & {\\\\left( K\\\\partial\\\\partial t\\\\_{1}} + K^{2}\\\\partial\\\\partial\
