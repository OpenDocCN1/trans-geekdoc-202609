  \ 的二阶偏导数为：\n\n$\\\\begin{matrix} \\\\frac{\\\\partial^{2}F\\_{c}\\\\left( \\mathbf{N}^{G},V^{G}\
  \ \\right)}{\\partial V^{G}\\\\partial V^{G}} & = & {\\\\sum\\\\limits\\_{i,j =\
  \ 1}^{M}{\\frac{\\\\partial^{2}f^{\\text{convex}}\\\\left( \\mathbf{n}^{G} \\right)}{\\\
  partial n\\_{i}^{G}\\\\partial n\\_{j}^{G}}\\\\frac{n\\_{i}^{G}n\\_{j}^{G}}{V^{G}}}\
  \ + \\\\sum\\\\limits\\_{i,j = 1}^{M}{\\frac{\\\\partial^{2}f^{\\text{convex}}\\\
  \\left( \\mathbf{n}^{L} \\right)}{\\partial n\\_{i}^{L}\\\\partial n\\_{j}^{L}}\\\
  \\frac{n\\_{i}^{L}n\\_{j}^{L}}{V^{L}} \\\\\\\\ \\\\end{matrix}$ (3.77)\n\n![image](img/F000034si344.png)(3.77)\n\
  \n将类似的分析方法应用于 `F`[`a]`![image](img/F000034si345.png)，我们可以推导出它关于 `N`^(*G*)![image](img/F000034si346.png)\
  \ 或 `V`^(*G*)![image](img/F000034si347.png) 是凹的。\n\n### 3.2.4 半隐式数值方案\n\n在半隐式数值方案中，质量守恒方程（摩尔）和体积方程将通过混合显-隐式方案分别求解。总时间间隔选择为\
  \ `I` = (0,*T*[`f]`\\]![image](img/F000034si338.png),其中 `T`[`f]`\\] > 0![image](img/F000034si349.png)。第\
  \ `k`![image](img/F000034si350.png) 时间步的摩尔密度计算为 `n`[`G]` k* (`N`[`G]` k*`V`[`G]` k*)![image](img/F000034si351.png)\
