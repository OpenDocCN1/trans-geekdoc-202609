  alpha\\beta}u_{\\gamma} + \\delta_{\\alpha\\gamma}u_{\\beta} + \\delta_{\\beta\\\
  gamma}u_{\\alpha} \\right).$ (5.135)\n\n![image](img/F000058si542.png)(5.135)\n\n\
  \n\n\n我们首先对 LBE 的左侧进行二阶泰勒展开。为了简单起见，将 `fi`![image](img/F000058si544.png) 写为 `f[i]`![image](img/F000058si545.png)。注意“:”\
  \ 是二元组之间的点积：\n\n$$\\frac{\\\\partial f\\_{i}}{\\partial t} + \\\\mathbf{e}\\_{i}\
