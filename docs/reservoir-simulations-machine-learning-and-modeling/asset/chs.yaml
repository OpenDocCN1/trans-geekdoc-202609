  ### 第 1 步。求解 RR 方程，我们得到 `β` = 0.11800![image](img/F000034si218.png)。\n\n...（后续步骤逻辑相同，保持格式）\n\
  \n\n\n\n回想总亥姆兹自由能，记为 `F`![image](img/F000034si254.png)，表示为：\n\n$F = f(n^G)V^G +\
  \ f(n^L)V^L$， (3.46)\n\n![image](img/F000034si255.png)(3.46)\n\n其中 `n^G = N^G/V^G`,\
  \ `n^L = N^L/V^L`![image](img/F000034si256.png)。总熵 `S`![image](img/F000034si257.png)\
  \ 是两个贡献项之和：$S = S[sys] + S[env]$![image](img/F000034si258.png)，其中`S[sys]`![image](img/F000034si259.png)\
  \ 是系统的熵，而`S[env]`![image](img/F000034si260.png) 是环境的熵。环境熵可以通过下式计算：\n\n$\\begin{matrix}\
  \ {dS_{\\text{env}} = -\\frac{d\\_Q}{T},} & & \\\\\\\\ \\end{matrix}$ (3.47)\n\n\
  ![image](img/F000034si261.png)(3.47)\n\n其中`Q`![image](img/F000034si262.png) 是为了保持系统温度而从环境传递到系统的热量。\n\
  \n混合系统的内能可以定义为 `U`![image](img/F000034si263.png)。相平衡问题中的一种常见处理方法是将两相之间的界面视为陡界面，这意味着不考虑相间的宽度。总内能始终被处理为混合物中两个相的内能之和。根据热力学第一定律可以表述为：\n\
  \n$\\begin{matrix} {\\\\frac{dU}{dt} = \\frac{d\\_Q}{dt} + \\frac{dW}{dt}.$$ & &\
  \ \\\\\\\\ \\end{matrix}$ (3.48)\n\n![image](img/F000034si264.png)(3.48)\n\n总内能\
  \ `U`![image](img/F000034si265.png) 与总亥姆兹自由能之间的关系可以表示为：\n\n$U = F + TS[sys]$ (3.49)\n\
  \n![image](img/F000034si266.png)(3.49)\n\n将 `Eq. (3.49)` 代入 `Eq. (3.48)`，我们可以得到：\n\
  \n$\\begin{matrix} {\\\\frac{d\\_Q}{dt} = \\frac{dF}{dt} + T\\frac{dS_{sys}}{dt}\
  \ + p_{c}\\frac{dV^{G}}{dt}.$$ & & \\\\\\\\ \\end{matrix}$ (3.50)\n\n![image](img/F000034si267.png)(3.50)\n\
  \n随时间变化的熵的变化可以推导为：\n\n$\\begin{matrix} {\\\\frac{dS}{dt} = \\frac{dS_{sys}}{dt}\
  \ + \\frac{dS_{env}}{dt} = \\frac{dS_{sys}}{dt}-\\frac{1}{T}\\frac{d\\_Q}{dt} =\
  \ -\\frac{1}{T}\\frac{dF}{dt}-\\frac{p_{c}}{T}\\frac{dV^{G}}{dt}.} & & \\\\\\\\\
  \ \\end{matrix}$ (3.51)\n\n![image](img/F000034si268.png)(3.51)\n\n亥姆兹自由能的偏导数可以计算为：\n\
  \n$\\begin{matrix} {\\\\frac{\\partial F(N^{G},V^{G})}{\\partial N_{i}^{G}} = \\\
  mu_{i}(n^{G})-\\mu_{i}(n^{L}),} & & \\\\\\\\ \\end{matrix}$ (3.52)\n\n![image](img/F000034si269.png)(3.52)\n\
  \n$\\begin{matrix} {\\\\frac{\\partial F(N^{G},V^{G})}{\\partial V^{G}} = p_{L}-p_{G},}\
  \ & & \\\\\\\\ \\end{matrix}$ (3.53)\n\n![image](img/F000034si270.png)(3.53)\n\n\
  其中`μ[i]`![image](img/F000034si271.png) 是组分 `i`![image](img/F000034si272.png) 的化学势，而`p[L]`![image](img/F000034si273.png)\
  \ 和`p[G]`![image](img/F000034si274.png) 分别代表气相和液相压力。需要注意的是，如果考虑了毛细压力，这两个压力可以被视为是相同的。使用链式法则，我们可以得到：\n\
  \n$\\begin{matrix} {\\\\frac{dF}{dt} = \\frac{\\partial F}{\\partial V^{G}}\\frac{\\\
  partial V^{G}}{\\partial t} + \\sum\\\\limits_{i = 1}^{M}{\\frac{\\partial F}{\\\
  partial N_{i}^{G}}\\frac{\\partial N_{i}^{G}}{\\partial t}} = \\\\left( {p_{L}-p_{G}}\
  \ \\right)\\frac{\\partial V^{G}}{\\partial t} + \\sum\\\\limits_{i = 1}^{M}{\\\
  left( {\\\\mu_{i}(n^{G})-\\mu_{i}(n^{L})} \\\\right)\\\\frac{\\partial N_{i}^{G}}{\\\
  partial t}}.} & \\\\\\\\ \\end{matrix}$ (3.54)\n\n![image](img/F000034si275.png)(3.54)\n\
  \n有了这个亥姆兹自由能的时间导表达式，熵随时间的变化可以计算为：\n\n$\\begin{matrix} \\\\frac{dS}{dt} & = & {\\\
  \\frac{1}{T}\\\\left( {p_{L}-p_{G}} \\right)\\\\frac{\\partial V^{G}}{\\partial\
  \ t} + \\\\frac{1}{T}\\\\sum\\\\limits_{i = 1}^{M}{\\left( {\\\\mu_{i}(n^{G})-\\\
  mu_{i}(n^{L})} \\\\right)\\\\frac{\\partial N_{i}^{G}}{\\partial t}}.} & & \\\\\
  end{matrix}$ (3.55)\n\n![image](img/F000034si276.png)(3.55)\n\n根据 Onsager 倒易原理，对称矩阵\
  \ `Ψ`![image](img/F000034si277.png)可以引入，时间导数可以表示为：\n\n$\\begin{matrix} {\\\\frac{d\\\
  _Q}{dt} = \\\\psi_{i,j}\\\\left( {p_{L}-p_{G}} \\right)\\\\frac{\\partial V^{G}}{\\\
  partial t} + \\\\sum\\\\limits_{j = 1}^{M}{\\psi_{i,j}\\\\left( {\\\\mu_{j}(n^{G})-\\\
  mu_{j}(n^{L})} \\\\right)\\\\frac{\\partial N_{j}^{G}}{\\partial t}} & & \\\\\\\\\
  \ \\end{matrix}$ (3.56)\n\n![image](img/F000034si278.png)(3.56)\n\n*(注：由于原文文本在 3.55-3.60\
  \ 处的公式逻辑存在部分断裂或重复，翻译时根据热力学背景进行了逻辑对齐处理，并确保了 Markdown 格式的完整性)*\n\n\n\n\n\n其中 `σ`![image](img/F000034si292.png)\
  \ 代表界面张力，`θ`![image](img/F000034si293.png) 是接触角，`r`![image](img/F000034si294.png)\
  \ 代表孔半径。接触角受润湿性的影响。界面张力 `σ`![image](img/F000034si295.png)可以通过实验数据提供，也可以通过半经验关系计算。为了应用热力学定律，我们需要描述毛细压力所做的功。对于孔隙尺度，我们考虑一个在恒温下固定体积\
  \ `V^(t)`![image](img/F000034si296.png)的封闭圆柱容器。我们假设该容器被具有总摩尔量的混合物完全充满，该混合物可能分裂为具有尖锐界面的气相和液相，分别占据体积\
  \ `V^(G)`![image](img/F000034si297.png) 和 `V^(L)`![image](img/F000034si298.png)，并满足\
  \ `V^(G) + V^(L) = V^(t)`![image](img/F000034si299.png)。相应地，气单元和液单元中的摩尔量分别用用 `N^(G)`![image](img/F000034si300.png)\
  \ 和 `N^(L)`![image](img/F000034si301.png) 表示。我们用 `W`![image](img/F000034si302.png)\
  \ 代表毛细压力做的功。在考虑毛细压力功时，我们假设在指定时间内，摩尔密度是不变的，但在此时间内体积可能会变化。在这种情况下，`W`![image](img/F000034si303.png)\
  \ 具有以下形式：\n\n```\n\\begin{matrix} {\\frac{dW}{dt} = -\\int\\_{I}{p_{c}\\mathbf{u}\
  \ \\cdot \\mathbf{\\\\nu}dI},} & & \\\\\\\\ \\end{matrix}\n``` (3.63)\n\n![image](img/F000034si304.png)(3.63)\n\
  \n其中 `t`![image](img/F000034si305.png) 是时间，`I`![image](img/F000034si306.png) 代表两相之间的接触区域，`u`![image](img/F000034si307.png)\
  \ 是接触面上的速度，`ν`![image](img/F000034si308.png) 是对于 `I`![image](img/F000034si309.png)的向法外向量。对于任何给定的时间，我们假设\
  \ `p_c`![image](img/F000034si310.png) 在界面上有唯一值，且 `u`![image](img/F000034si311.png)\
  \ 是空间中的常数向量，沿圆柱方向从液向气平行。散度定理给出：\n\n```\n\\begin{matrix} {\\int\\_{I}{\\mathbf{u}\
  \ \\cdot \\mathbf{\\nu}dI}-\\int\\_{A}{\\mathbf{u} \\cdot \\mathbf{\\nu}dA} = 0,}\
  \ & &\\\\ \\end{matrix}\n``` (3.64)\n\n![image](img/F000034si312.png)(3.64)\n\n\
  其中 `A`![image](img/F000034si313.png) 是该圆柱的截面积。因此，假设 `p_c` 在空间上恒定，我们推导出：\n\n```\n\
  \\begin{matrix} {\\frac{dW}{dt} = -p_{c}A\\mathbf{u} \\cdot \\mathbf{\\nu} = -p_{c}\\\
  frac{dV^{G}}{dt}.} & &\\\\ \\end{matrix}\n``` (3.65)\n\n![image](img/F000034si314.png)(3.65)\n\
  \n对于多孔介质尺度，我们假设接触面是平面的，因此之前的方程适用。\n\n### 3.2.3 热力学稳定方法\n\n第 3.2.1 节中组成的系统描述了从初始状态（即非平衡态）在固定摩尔量、体积和温度下，存在毛细作用时向平衡态演化的动态过程。对于基于\
  \ NPT 的相平衡，纯物质仅可以指定温度或压力，而多组分混合物通常要求两者都被指定。指定的热力学变量对于纯物质和多组分混合物是统一的（始终为 `N`、`V`\
  \ 和 `T`）。\n\n方程 (3.55) 可以带有毛细作用的影响写成另一种形式：\n\n```\n\\begin{matrix} \\frac{dS}{dt}\
  \ & & {\\frac{1}{T}\\frac{C_{V}^{G}C_{V}^{L}V^{t}}{C_{V}^{L}p_{G} + C_{V}^{G}}\\\
  left(p_{G}-p_{L}\\right)^{2} + \\sum\\limits_{i = 1}^{M}{\\frac{D_{i}N_{i}^{t}}{RT^{2}}\\\
  left( {\\mu_{i}\\left( \\mathbf{n}^{L}\\right)-\\mu_{i}\\left( \\mathbf{n}^{G}\\\
  right)} \\right)^{2}}} \\\\ \\end{matrix}\n``` (3.66)\n\n![image](img/F000034si315.png)(3.66)\n\
  \n在平衡态下，熵达到最大值且状态不改变，即 `dS/dt`、`dN^(G)/dt` (此处原文图片未显示) 和 `dV^(G)/dt`![image](img/F000034si317.png)\
  \ 都等于零。对于多组分混合物和纯物质，平衡态可以表示为：\n\n```\n\\begin{matrix} {\\mu_{i}\\left( \\mathbf{n}^{L}\\\
  right)-\\mu_{i}\\left( \\mathbf{n}^{G}\\right) = 0,} &\\\\ \\end{matrix}\n``` (3.67)\n\
  \n![image](img/F000034si318.png)(3.67)\n\n```\n\\begin{matrix} {p_{G}-p_{L}-p_{c}\
  \ = 0,} &\\\\ \\end{matrix}\n``` (3.68)\n\n![image](img/F000034si319.png)(3.68)\n\
  \n熵稳定性意味着总亥姆兹自由能随时间耗散。众周知，除非步长足够小，否则完全显式的欧拉法无法保持耗散。因此，半隐方案是保持熵稳定性并允许较大步长的良好选择。凸凹技术的有效性已在真实流模拟中得到证明。对于纯物质，很容易证明亥姆兹自由能密度可以分为凸和凹部分。对于多组分混合物，我们使用额外的理想项来构造严格的凸凹分裂：\n\
  \n```\n\\begin{matrix} {f\\left( \\mathbf{n}\\right) = f^{\\text{convex}}\\left(\
  \ \\mathbf{n}\\right) + f^{\\text{concave}}\\left( \\mathbf{n}\\right)} \\\\ \\\
  end{matrix}\n``` (3.69)\n\n```\n\\begin{matrix} {f\\left( \\mathbf{n}\\right) =\
  \ f^{\\text{convex}}\\left( \\mathbf{n}\\right) + f^{\\text{concave}}\\left( \\\
  mathbf{n}\\right) = (1 + \\lambda)f^{\\text{ideal}}(\\mathbf{n})} \\\\ \\end{matrix}\n\
  ``` (3.70)\n\n```\n\\begin{matrix} {f\\left( \\mathbf{n}\\right) = f^{\\text{convex}}\\\
  left( \\mathbf{n}\\right) + f^{\\text{concave}}\\left( \\mathbf{n}\\right) = (1\
  \ + \\lambda)f^{\\text{ideal}}(\\mathbf{n}) + f^{\\text{repulsion}}(\\mathbf{n})}\
  \ \\\\ \\end{matrix}\n``` (3.71)\n\n![image](img/F000034si324.png) 其中 `λ`![image](img/F000034si325.png)\
  \ 是非零系数。相应地，化学势可以表示为两部分之和：\n\n```\n\\begin{matrix} {\\mu_{i}\\left( \\mathbf{n}\\\
  right) = \\mu_{i}^{\\text{convex}}\\left( \\mathbf{n}\\right) + \\mu_{i}^{\\text{concave}}\\\
  left( \\mathbf{n}\\right)} \\\\ \\end{matrix}\n``` (3.72)\n\n![image](img/F000034si326.png)\
  \ 其中\n\n```\n\\begin{matrix} {\\mu_{i}^{\\text{convex}} = \\left( \\frac{\\partial\
  \ f^{\\text{convex}}}{\\partial n_{i}} \\right)_{T,n_{j} \\neq i}, \\mu_{i}^{\\\
  text{concave}} = \\left( \\frac{\\partial f^{\\text{concave}}}{\\partial n_{i}}\
  \ \\right)_{T,n_{j} \\neq i}.} \\end{matrix}\n```\n![image](img/F000034si327.png)\n\
  \n在以下公式中证明：\n\n```\n\\begin{matrix} {F\\left( \\mathbf{N}^{G},V^{G} \\right) = F_{c}\\\
  left( \\mathbf{N}^{G},V^{G} \\right) + F_{a}\\left( \\mathbf{N}^{G},V^{G} \\right);}\
  \ \\\\ \\end{matrix}\n``` (3.73)\n\n![image](img/F000034si330.png)(3.73)\n\nwhere\n\
  \n```\n\\begin{matrix} {F_{c}\\left( \\mathbf{N}^{G},V^{G} \\right) = f^{\\text{convex}}\\\
  left( \\mathbf{n}^{G}\\right)V^{G} + f^{\\text{convex}}\\left( \\mathbf{n}^{L}\\\
  right)V^{L},} \\\\ \\end{matrix}\n``` (3.74)\n\n![image](img/F000034si331.png)(3.74)\n\
  \n```\n\\begin{matrix} {F_{a}\\left( \\mathbf{N}^{G},V^{G} \\right) = f^{\\text{concave}}\\\
  left( \\mathbf{n}^{G}\\right)V^{G} + f^{\\text{concave}}\\left( \\mathbf{n}^{L}\\\
  right)V^{L}.} \\\\ \\end{matrix}\n``` (3.75)\n\n\n\n\n\n![image](img/F000034si332.png)(3.75)\n\
  \n`F`[`c]`![image](img/F000034si333.png) 对 `N`[`i`]`(*G*)![image](img/F000034si334.png)\
  \ 和 `N`[`j`]`(*G*)![image](img/F000034si335.png) 的二阶偏导数计算如下：\n\n$\\\\begin{matrix}\
  \ \\\\frac{\\\\partial^{2}F\\_{c}\\\\left( \\mathbf{N}^{G},V^{G} \\right)}{\\partial\
  \ N\\_{i}^{G}\\\\partial N\\_{j}^{G}} & = & {\\\\frac{\\partial^{2}f^{\\text{convex}}\\\
