  \n对于 `s_{form}=1`![image](img/F000046si1081.png) `NIPG`（非对称惩罚基法）或 `OBB-DG`（Oden–Babuška–Baumann\
  \ 格式），具有 `s_{form}=1`![image](img/F000046si1082.png) `SIPG`，以及 `s_{form}=0`![image](img/F000046si1083.png)\
  \ `IIPG`（不完全惩罚基法）。\n\n### 4.6.3 自适应网格\n\n基于残差的显式误差估计计算效率高，可用于指示需要细化的单元，从而引导自适应性。然而，这些基于残差的估计每个单元仅产生信息，因此无法提供各向性细化的指导。在本节中，我们使用分层基导出误差估计。与基于残差的误差估计不同，分层误差估计提供了点误差信息，因此可以指导完全各向性的\
  \ $hp$-自适应。为了简单起见，我们只考虑各向性 $h$-自适应。分层误差估计通过使用两种不同精度的离散方案求解感兴趣的问题，并利用近似之间的差作为误差。这种方法的优点包括适用于许多类且实现简单。\n\
  \n对于给定的网格 $\\mathcal{E}_h$![image](img/F000046si1084.png) (此处 si1084.png)，我们通过同向细化\
  \ $\\mathcal{E}_h$ 的每个单元![image](img/F000046si1085.png) (此处 si1085.png) 来构建网格 $\\\
  mathcal{E}_{h/2}$![image](img/F000046si1086.png) (此处 si1086.png)。我们用 $C^{DG}$ 表示粗网格\
  \ $\\mathcal{E}_h$![image](img/F000046si1087.png) (此处 si1087.png) 中的 DG 解，并用 $C^{DG,F}$\
  \ 表示细网格 $\\mathcal{E}_{h/2}$![image](img/F000046si1088.png) (此处 si1088.png) 中的 DG\
  \ 解。可以做出如下饱和假设：\n\n$\\|C^{DG,F}-c\\|_{L^{2}(t)} \\leqslant \\beta\\|C^{DG}-c\\|_{L^{2}(t)},\
  \ 0 \\leqslant \\beta < 1.$ (4.290)\n\n![image](img/F000046si1089.png) (此处 si1089.png)\n\
  \n回想 NIPT、SIPG 和 IIPG 的误差估计：\n\n$\\\\begin{array}{l} \\\\left. C^{DG} - c_{L^{\\\
  \\infty}{({0,T;L^{2}})}} + \\\\middle| \\\\middle| \\\\| \\\\mathbf{D}^{1/2}\\\\\
  left( \\\\mathbf{u} \\\\right)\\\\nabla\\\\left( {C^{DG} - c} \\\\right) \\\\middle|\
  \ \\\\middle| |_{L^{2}{({0,T;L^{2}})}} \\\\right. \\\\\\\\ \\\\left( {\\\\int\\\\\
  _{0}^{T}{J\\\\_{0}^{\\\\sigma}\\\\left( {C^{DG} - c} \\\\right)}} \\\\right)^{1/2}\
  \ \\\\leqslant K\\\\frac{h\\\\\\mu - 1}}{r^{s - \\\\frac{2}{2}}} \\\\ \\\\ \\\\\
  \ \\\\ \\\\ \\\\ \\\\ \\\\ \\\\ \\\\ \\\\ \\\\ \\\\ \\\\ \\\\ \\\\ \\\\middle| \\\
  \\frac{\\\\partial c}{\\\\partial t} \\\\middle| |_{L^{2}{({0,T;H^{s - 1}})}} +\
  \ \\\\middle| \\\\middle| \\\\| c\\\\_{0} \\\\right| |_{s} \\\\1. \\\\right. \\\\\
  } \\\\\\\\ \\\\end{array}$ (4.291)\n\n![image](img/F000046si1090.png) (此处 si1090.png)\n\
  \n以及 OBB-DG 的：\n\n$\\\\begin{matrix} \\\\left. C^{DG} - c_{L^{\\\\infty}{({0,T;L^{2}})}}\
  \ + \\\\middle| \\\\middle| \\\\| \\\\mathbf{D}^{1/2}\\\\left( \\\\mathbf{u} \\\\\
  right)\\\\nabla\\\\left( {C^{DG} - c} \\\\right) \\\\middle| \\\\middle| |_{L^{2}{({0,T;L^{2}})}}\
  \ \\\\right. \\\\\\\\ + \\\\left( {\\\\int\\\\_{0}^{T}{J\\\\_{0}^{\\\\sigma}\\\\\
  left( {C^{DG} - c} \\\\right)}} \\\\right)^{1/2} \\\\leqslant K\\\\frac{h\\\\\\\
  mu - 1}}{r^{s - \\\\frac{2}{2}}} \\\\ \\\\ \\\\ \\\\ \\\\ \\\\ \\\\ \\\\ \\\\ \\\
  \\ \\\\ \\\\ \\\\ \\\\ \\\\ \\\\ \\\\ \\\\ \\\\middle| \\\\frac{\\\\partial c}{\\\
  \\partial t} \\\\middle| |_{L^{2}{({0,T;H^{s - 1}})}} + \\\\middle| \\\\middle|\
  \ \\\\| c\\\\_{0} \\\\right| |_{s} \\\\1. \\\\right. \\\\} \\\\\\\\ \\\\end{matrix}$\
  \ (4.292)\n\n那么我们可以观察到，对于所有四个原始 DG（即 OBB-DG、SIPG、NIPG 和 IIPG），$\\beta$![image](img/F000046si1092.png)\
  \ (此处 si1092.png) 渐近小于或等于以下值：$\\beta\\leqslant\\\\frac{1}{2^{\\\\mu - 1}} = \\\\\
  frac{1}{2^{\\\\min(r,s - 1)}}.$![image](img/F000046si1093.png) (此处 si1093.png) 后验误差估计可以表述为\n\
  \n\n\n\n\n$\\frac{1}{1 + \\beta}\\left( {\\sum\\limits\\_{E \\in \\mathcal{E}\\\
  _{h}}\\eta\\_{E}^{2}} \\right)^{1/2}\\left( t \\right)\\leqslant\\left\\| {C^{DG}\
  \ - c} \\right\\|\\_{L^{2}}\\left( t \\right)\\leqslant\\frac{1}{1 - \\beta}\\left(\
  \ {\\sum\\limits\\_{E \\in \\mathcal{E}\\_{h}}\\eta\\_{E}^{2}} \\right)^{1/2}\\\
  left( t \\right),$ (4.293)\n\n![image](img/F000046si1094.png)(4.293) \n\n其中 `etaE`\
  \ = $||\\hat{C}(DG, F) - \\hat{C}(DG)|[L²(E)]}(t)$![image](img/F000046si1095.png)。\n\
  \n在上述误差指示器中，使用细网格解代替真实解，以估计粗网格解的误差。现在我们使用相同的原理来选择适当的各向异性加密。假设整个区域上的多项式空间具有均匀阶数 `r`![image](img/F000046si1096.png)。每个单元\
  \ `E`![image](img/F000046si1097.png)的局部空间表示为 `Pr`![image](img/F000046si1098.png)。\n\
  \n对于涉及长时间模拟的瞬态问题，生物地球现象的位置通常随时间移动。在前一节中回顾的包括`L²(L²)`![image](img/F000046si1099.png)和`L²(H¹)`![image](img/F000046si1100.png)在大多数瞬态问题的误差指示器提供全局空间时间估计。误差指示器能够仅考虑当前的局部物理特性，因此只在短时间间隔内计算误差指示器更为理想。本节提出的分层误差指示器在时间上是逐点的，并为随变化的网格修改提供指导。由于在每个时间步改变网格的成本很高，我们将整个模拟周期划分为一组时间片，每个时间片反过来可以包含一定数量的时间步。保持单元数量不变可以防止计算工作量随时间步而增加。初始网格被选择为均匀细网格。\n\
  \n### 动态和等同性网格适应策略\n\n我们首先介绍动态和等同性网格适应策略。我们用`#(S)`![image](img/F000046si1101.png)表示集合\
  \ `S`![image](img/F000046si1102.png)中的单元数量。详细的动态和等同性网格适应算法描述如下：\n\n给定初始网格 `E[0]`![image](img/F000046si1103.png)，\n\
  \n**步骤 1.** 令 `m = 1`, `n = 1`![image](img/F000046si1104.png)\n\n**步骤 2.** 使用初始条件（如果\
  \ `n = 1`![image](img/F000046si1107.png)，通过局部投影）计算时间片 `T[n-1], T[n]`![image](img/F000046si1105.png)的初始浓度。\n\
  \n**步骤 3.** 如果 `n = 1` 且 `m = 1`![image](img/F000046si1110.png)，则令 `E[m, n] = E[0]`![image](img/F000046si1108.png)；如果\
  \ `n > 1` 且 `m = 1`![image](img/F000046si1113.png)，则令 `E[m, n] = E[M[n-1]+1, n-1]`![image](img/F000046si1111.png)。\n\
  \n**步骤 4.** 基于网格 `E[m, n]`![image](img/F000046si1115.png)计算时间片 `T[n-1], T[n]`![image](img/F000046si1114.png)的\
  \ PDE 的 DG 近似，并为每个单元 `E \\in E[m, n]`![image](img/F000046si1117.png)计算误差指示器 `eta[E]`。\n\
  \n**步骤 5.** 选择 `E[r] \\in E[m, n]`![image](img/F000046si1118.png)，使得 `#(E[r]) =\
  \ ceil(#(E[m, n]))` 且 `min(eta[E]: E \\in E[r]) \\geq max(eta[E]: E \\in E[m, n])`![image](img/F000046si1120.png)。\n\
  \n**步骤 6.** 选择 `E[c] \\in E[m, n]`![image](img/F000046si1122.png)使得 `max(eta[E]:\
  \ E \\in E[c])` 最小，同时满足 `#(E[c]) = ceil(#(E[m, n]))` 且 `E[c]` 相对于 `E[m, n], E[r]`\
  \ 满足加密兼容条件![image](img/F000046si1125.png)。\n\n**步骤 7.** 加密所有 `E \\in E[r]`![image](img/F000046si1126.png)\
  \ 并粗化所有 `E \\in E[c]`![image](img/F000046si1127.png) 以形成新网格（注：此处原文逻辑略有跳跃，根据上下文推断为形成新网格）。\n\
  \n**步骤 8.** 令 `m = 1`![image](img/F000046si1128.png)。\n\n**步骤 9.** 报告结果并停止。\n\n\
