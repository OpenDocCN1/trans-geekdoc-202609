  \nPR 混合物的亥姆兹自由能可以写为：\n\n`F(T,V) = Fideal + Fexcess`。(3.23)\n\n![image](img/F00034si92.png)(3.23)\
  \ 理想气体贡献可以通过（注意到 $N = \\sum_{i}N_{i}$![image](img/F00034si93.png)）计算：\n\n$F_{ideal}(T,\\\
  mathbf{N}) = RT\\sum_{i = 1}^{M}{N_{i}\\left( \\frac{N_{i}}{V} \\right)} + NC_{int}(T).$\
  \ (3.24)\n\n![image](img/F00034si94.png)(3.24) 亥姆兹自由能的过量部分可以通过计算：\n\n$F_{excess}(T,\\\
  mathbf{N}) = \\frac{a(T)N}{2\\sqrt{2}}\\ln{\\left( \\frac{V + (1-\\sqrt{2})b}{V\
  \ + (1+\\sqrt{2})b} \\right)}-NRT\\ln\\left( \\frac{Nb}{V} \\right).$ (3.25)\n\n\
  ![image](img/F00034si95.png)(3.25) \n\n### 3.1.4 体积平技术\n\n在 PR 和 SRK 方程中，没有用于密度的参数。结果是这两个方程存在密度预测缺陷。SRK\
  \ EOS 低估了许多物质的密度；PR EOS 高估了 $\\omega=0.35$![image](img/F00034si96.png)，然后低估了烷烃的密度。这种偏差在还原温度\
  \ 0.75 之前几乎是常数，这促成了体积平技术的产生。\n\n体积平技术是沿体积轴平移：\n\n$v^{true} = v^{EOS} + c$，(3.26)\n\
  \n![image](img/F00034si97.png)(3.26) 其中 `c`![image](img/F00034si98.png) 是体积平移参数。体积平技术通过混合规则将多组分混合物的气液平衡分离出来：\n\
  \n$c = \\sum_{i = 1}^{M}{x_{i}c_{i}}.$ (3.27)\n\n![image](img/F00034si99.png)(3.27)\
  \ 在文中提出了以下额外的修正：\n\n$v^{true} = v^{EOS} + c + f_{c}\\left( \\frac{\\lambda}{\\lambda-\\\
  left( {v^{2}/RT} \\right)\\left( {{\\partial P}{\\partial v}} \\right)\\_{T}} \\\
  right).$ (3.28)\n\n![image](img/F00034si100.png)(3.28) 项 `(-v²/RT)(∂P/∂v)`![image](img/F00034si101.png)\
  \ 是与压缩倒数相关的无量纲。它在临界点为零，而这种体积平技术![image](img/F00034si102.png) 强制 EOS 通过 `c`![image](img/F00034si103.png)。`c`![image](img/F00034si104.png)\
  \ 的值可以通过对许多物质的数据进行回归来确定，简单的体积平移表达式 `v^{true} = v^{EOS} + c`![image](img/F00034si105.png)\
  \ 不影响相组成。\n\n### 3.1.5 Peng–Robinson 状态的解\n\n要求解 PR-EOS，目前有两种方法。第一种是在方程中求解 `Z`![image](img/F00034si106.png)：\n\
  \n$Z³ - (1-B)Z² + (A-2B-3B²)Z - (AB-B²-B³) = 0.$ (3.29)\n\n![image](img/F00034si109.png)(3.29)\
  \ 第二种是在方程中求解 `v`![image](img/F00034si110.png)：\n\n$(p + \\frac{a(T)}{(v+(1-\\sqrt{2})b)(v+(1+\\\
  sqrt{2})b)}) = \\frac{RT}{v}.$ (3.30)\n\n![image](img/F00034si111.png)(3.30) `p`![image](img/F00034si112.png)\
  \ 关于 `v`![image](img/F00034si113.png) 的函数显示了三个垂直渐近线：`v = b`![image](img/F00034si114.png)、`v\
  \ = (1-\\sqrt{2})b`![image](img/F00034si115.png) 以及 `v = -(1+\\sqrt{2})b`![image](img/F00034si116.png)。对于\
  \ `v < b`![image](img/F00034si117.png) 的分支没有物理意义，引导我们只寻找 `v > b`![image](img/F00034si118.png)\
  \ 的解。\n\n在代数中，三次函数（三次多项式）是形式为 `f(x) = ax³ + bx² + cx + d`![image](img/F00034si119.png)\
  \ 的函数，其中 `a` 不零。令 `f(x) = 0`![image](img/F00034si120.png) 产生了如下方案的三次方程：\n\n$ax³\
  \ + bx² + cx + d = 0.$ (3.31)\n\n![image](img/F00034si122.png)(3.31)\n\n\n\n\n\n\
  如果三次方程的系数 `a`![image](img/F000034si123.png), `b`![image](img/F000034si124.png),\
  \ `c`![image](img/F000034si125.png) 和 `d`![image](img/F000034si126.png) 均为实数，那么它至少有一个实根（根据代数基本定理）。三次方程的所有根都可以通过代数方法找到（根据阿贝尔-鲁菲尼定理）。阿贝尔不可能性定理（也称为阿贝尔-鲁菲尼定理）指出，对于具有任意系数的五次及以上阶般多项式方程，不存在代数解——即不存在根式解。三次公式是三次方程的闭式形式解，类似于二次方程的求根公式。在初等代数中，求根公式是二次方程的解。对于一般的二次方程\n\
  \n$ax² + bx + c = 0,$ (3.32)\n\n![image](img/F000034si127.png)(3.32)\n\n可以将二次公式写为如下方程，通过将前者代入后者满足二次方程：\n\
  \n$x = \\frac{-b \\pm \\sqrt{b^{2}-4ac}}{2a}.$ (3.33)\n\n![image](img/F000034si128.png)(3.33)\n\
  \n### 3.1.6 相分平衡计算\n\n两相（多相）分配是相平衡计算中的一个关键问题。目前，有两种主要方法来实现：NPT 闪计算和 NVT 闪计算。\n\n\
  在 NPT 闪计算中，给定数据为进料摩尔量 `F`![image](img/F000034si129.png), 物料组成 `z[i]`, `i = 1, …,\
  \ M`![image](img/F000034si130.png), 温度 `T`![image](img/F000034si131.png) 以及压力 `p`![image](img/F000034si132.png)，待确定的目标为液相和气相摩尔量\
  \ `L`![image](img/F000034si133.png) 和 `V`![image](img/F000034si134.png), 气相组成 `y[i]`,\
  \ `i = 1, …, M`![image](img/F000034si135.png) 以及液相组成 `x[i]`, `i = 1, …, M`![image](img/F000034si136.png)。\n\
  \n在 NVT 闪计算中，给定数据为进料摩尔量 `F`![image](img/F000034si137.png), 物料组成 `z[i]`, `i = 1,\
  \ …, M`![image](img/F000034si138.png), 温度 `T`![image](img/F000034si139.png) 以及总积\
  \ `V`![image](img/F000034si140.png)，待确定的目标为液相和气相摩尔量 `L`![image](img/F000034si141.png)\
  \ 和 `V`![image](img/F000034si142.png), 气相组成 `y[i]`, `i = 1, …, M`![image](img/F000034si143.png)\
  \ 以及液相组成 `x[i]`, `i = 1, …, M`![image](img/F000034si144.png)。\n\n化学平衡或扩散平衡可以表示为\n\
  \n`fi = fi`, `i = 1, …, M`。(3.34)\n\n![image](img/F000034si145.png)(3.34)\n\n这等同于\
  \ `pxi = pyi`。(3.35)\n\n![image](img/F000034si146.png)(3.35)\n\n并且等价于 `y[i] = K[i]x[i]`,\
  \ `i = 1, …, M`。(3.36)\n\n![image](img/F000034si147.png)(3.36)\n\n其中气液平衡比 `K[i]`![image](img/F000034si148.png)\
  \ 可以写为：\n\n$K_{i} = K_{i}(T,p,x_{1},\\ldots,x_{M},y_{1},\\ldots,y_{M}) = \\frac{\\\
  varphi_{i}^{L}(T,p,x_{1},\\ldots,x_{M})}{\\varphi_{i}^{V}(T,p,y_{1},\\ldots,y_{M})}.$\
  \ (3.37)\n\n![image](img/F000034si149.png)(3.37)\n\n它也被称为 `K` 值、相平衡常数、分配系数或分配系数。回气相和液相的逸度方程：\n\
  \n$\\ln\\varphi_{i}^{L} = \\frac{b_{i}^{L}}{b^{L}}(Z^{L}-1)-\\ln(Z^{L}-B^{L})-\\\
  frac{A^{L}}{2\\sqrt{2}B^{L}}\\left( \\frac{2\\sum_{j = 1}^{M}{x_{j}a_{ij}^{L}}}{a^{L}}-\\\
  frac{b_{i}^{L}}{b^{L}}} \\right)\\ln\\frac{Z^{L} + 2.414B^{L}}{Z^{L}-0.414B^{L}},$\
  \ (3.38)\n\n![image](img/F000034si150.png)(3.38)\n\n$\\ln\\varphi_{i}^{V} = \\frac{b_{i}^{V}}{b^{V}}(Z^{V}-1)-\\\
  ln(Z^{V}-B^{V})-\\frac{A^{V}}{2\\sqrt{2}B^{V}}\\left( \\frac{2\\sum_{j = 1}^{M}{y_{j}a_{ij}^{V}}}{a^{V}}-\\\
  frac{b_{i}^{V}}{b^{V}}} \\right)\\ln\\frac{Z^{V} + 2.414B^{V}}{}$ (3.39)\n\n为了计算\
  \ `x[i]`![image](img/F000034si151.png) 和 `y[i]`![image](img/F000034si152.png)，通常使用以下关联式：\n\
  \n$x_{i} = \\frac{z_{i}}{1 + \\beta(K_{i}-1)}, y_{i} = \\frac{K_{i}z_{i}}{1 + \\\
  beta(K_{i}-1)}.$ (3.40)\n\n![image](img/F000034si154.png)(3.40)\n\n并应用 Rachford–Rice\
  \ (RR) 方程来计算 `beta`：\n\n$\\sum_{i = 1}^{M}\\frac{(K_{i}-1)z_{i}}{1 + \\beta(K_{i}-1)}\
  \ = 0.$ (3.41)\n\n![image](img/F000034si156.png)(3.41)\n\n方程总数可以总结为 `x[i]`, `y[i]`,\
  \ `K[i]`, `i = 1, 2, …, M`![image](img/F000034si157.png)，这与总数 `x[i]`, `y[i]`, `K[i]`,\
  \ `i = 1, 2, …, M`![image](img/F000034si158.png) 相匹配。\n\n逐代代法 (SSM)，也称为逐代迭代，是 NPT\
  \ 类型闪计算的一种常用方法。该迭代方案可以建模为：\n\n步骤 1. 在平衡解附近对 `K` 值进行初值猜测，以加速收敛过程。通常使用 Wilson 关联式（\n\
  \n$K_{i}^{Wilson} = \\frac{p_{c,i}}{p}\\exp\\left( 5.37\\left( 1 + \\omega_{i} \\\
  right)\\left(1-\\frac{T_{c,i}}{T} \\right) \\right).$ (3.42)\n\n![image](img/F000034si161.png)(3.42)\n\
  \n步骤 2. 使用 RR 程序计算 `beta`![image](img/F000034si162.png)。一旦指定了每个组分的 `K` 值，将使用 RR\
  \ 方程估计相摩尔分数。\n\n步骤 3. 计算立方 EOS 参数（例如 `a`![image](img/F000034si163.png) 和 `b`![image](img/F000034si164.png)）。计算\
  \ EOS 参数需要每个组分的临界温度、压力和偏心因子。\n\n\n\n\n\n### 步骤 4. 求解相摩尔体积 `v`^(`L`)![image](img/F000034si165.png)\
  \ 和 `v`^(`V`)![image](img/F000034si166.png)。这一步需要求解气相和液相压缩因子的立方状态方程（EOS）。由于气相和液相的组成不同，需要对立方方程的根进行两个独立的求解。应使用立方方程求解器或迭代法来获得\
  \ EOS 的根。此步骤的程序比纯流体更复杂，因为要计算立方方程的六个根（即液态三个根，气态的三个根）。在六个根中（气态三个；液态三个），气态/液态的中间根会被舍弃，因为它们会导致不稳定的相，这与纯流体类似。剩余的两个液态根中的一个与另一个气态根之一配对，以计算组分逸活度和平衡。如果选择了错误的根配对，解可能是错误的，因为可能会获得不稳定或亚稳态解。正确的平衡解是与其它可能的根配对相比，使总吉布斯能量最小的解。对于大多数情况，正确的液态根是摩尔体积最小的根，而正确的气态根是摩尔体积最大的根。\n\
  \n### 步骤 5. 计算每个相中每个组分的逸活性 `f`[`i`]`^(`V`)![image](img/F000034si167.png) 和 `f`[`i`]`^(`L`)![image](img/F000034si168.png)。\n\
  \n### 步骤 6. 检查是否达到平衡。良好的标准是对于所有组分满足 `|(*f`[`i`]`^(`V`/*f`[`i`]`^(`L`)) − 1| < 10^( − 5)`![image](img/F000034si169.png)。如果满足标准则获得了平衡。\n\
  \n### 步骤 7. 如果未满足标准，则应更新 `K` 值并重复步骤 2–6。这一步也非常重要；它影响收敛速度以及迭代是否会收敛。一种有效的方法是简单的连续代换法，它依赖于\
  \ `φ`[`i`]`^(`V`) = (*f`[`i`]`^(`V`/*y`[`i`]*p*)`![image](img/F000034si170.png)\
  \ 和 `φ`[`i`]`^(`L`) = (*f`[`i`]`^(`L`/*x`[`i`]*p*)`![image](img/F000034si171.png)。我们通过\
  \ `K`[`i`]`^(`n**e**w*)` = (*f`[`i`]`^(`L`/*f`[`i`]`^(`V`))*K`[`i`]`^(`o**l**d*)`![image](img/F000034si172.png)。一旦确定了新的\
  \ `K` 值，就重复步骤 2–6 直到步骤 6 达到收敛。在临界区附近，连续代换的收敛可能很慢。当收敛缓慢时，可能需要其他方法。\n\n除了步骤 6 中述的标准外，其他常用的标准还包括：\n\
  \n$\\frac{1}{M}\\\\sum\\\\limits\\_{i = 1}^{M}\\\\left( {\\\\ln\\\\left( \\frac{f\\\
  _{i}^{L}}{f\\_{i}^{V}} \\right)} \\\\right)^{2} < 10^{-12}.$ (3.43)\n\n![image](img/F000034si173.png)(3.43)\
  \ \n\n$\\sum\\\\limits\\_{i = 1}^{M}\\\\left( {\\\\frac{f\\_{i}^{L}}{f\\_{i}^{V}}-1}\
  \ \\right)^{2} < 10^{-14}.$ (3.44) \n\n![image](img/F000034si174.png)(3.44) \n\n\
  当系统接近临界点且逸活性对组分高度依赖时，预计 SSM（连续代换法）的收敛速度会变慢。为了避免收敛缓慢的问题，提出了一些方法。最流行的是最小变量牛顿-拉夫森法和加速稳定连续代换法\
  \ (ASSM)。实施此类程序是为了加速 `K`[`i]`![image](img/F000034si175.png)-值的计算，特别是在仅使用 SSM 不高效的临界区域。\n\
  \n经典的 ASSM 技术包含以下步骤：\n\n### 步骤 1. 使用 SSM 技术在初始启动 `K`[`i]`![image](img/F000034si176.png)-值的更新。\n\
  \n### 步骤 2. 在迭代的每一步中使用 SSM 检查所有后续标准：$\\left( {{\\sum\\\\limits\\_{i}{R\\\\_{i}^{new}-1}^{2}}/{\\\
  sum\\\\limits\\_{i}{R\\\\_{old}-1}^{2}}} \\\\right) > 0.8,\\\\beta^{new}-\\beta^{old}|\
  \ < 0.1,10^{-5} < \\\\sum\\\\limits\\_{i}\\\\left( R\\\\_{i}^{new}-1 \\\\right)^{2}\
  \ < 10^{-3},$![image](img/F000034si177.png) 和 0 <`β`^(`n**e**`)< 1![image](img/F000034si178.png)\
  \ 这些标准表明你已足够接近确保方法效率条件。`R`[`i]`![image](img/F000034si179.png) 是第 `i` 个组分液活性与气活性的比值。\n\
  \n### 步骤 3. 如果系统满足所有之前的标准，则将迭代技术从 SSM 切换到 ASSM。否则，使用 SSM 更新 `K`[`i]`![image](img/F000034si180.png)-值。在\
  \ ASSM 中使用以下表达式更新 `K`[`i]`![image](img/F000034si181.png)-值：\n\n`K`[`i]`^(`n**e**w*)` = (*K`[`i]`^(`o**l**))*R`[`i]`^(`λ`[`i]`))`\
  \ (3.45)\n\n![image](img/F000034si182.png)(3.45) \n\n其中 `λ`[`i]` = (*R`[`i]`^(`o**l***)` − R`[`i]`^(`o**l***)` − R`[`i]`^(`n**e***)))`![image](img/F000034si183.png)\
  \ 在某些情况下，使用 `λ`[`i]` = 2![image](img/F000034si184.png) 的恒加速度值即可满足精度收敛要求。\n\n###\
  \ 步骤 4. 一旦满足步骤 2 中的所有标准，跳过后续迭代的步骤 2，并使用 ASSM 技术更新 `K`[`i]`![image](img/F000034si185.png)-值，直到达到收敛，除非其估计值不可接受。\n\
  \n### 步骤 5. 使用 ASSM 时，必须测试其是否产生了改进解（即逸活性比更接近 1）。如果不是，必须拒绝并切回 SSM。\n\nNPT 闪所需的数据清单提供在表\
  \ 3.3](#chp003.xhtml#t020) 读者参考。\n\n#### 表 3.3 基于 Peng–Robinson 方程的 NPT 闪数据清单。\n\
