  考虑到以下恒等式：\n\n$\\\\sum\\\\limits\\\\_{\\_{i},j = 1}^{M}\\\\left( {\\\\nabla n\\_{i}}\
  \ \\\\right)\\\\nabla \\\\cdot \\\\left( {c\\_{\\mathit{ij}}\\\\nabla n\\_{j}} \\\
  \\right) + \\\\frac{1}{2}\\\\sum\\\\limits\\\\_{\\_{i},j = 1}^{M}\\\\nabla\\\\left(\
