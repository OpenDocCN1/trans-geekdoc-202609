  \ \\right),} \\\\ \\end{matrix}\n```\n(3.82) ![image](img/F000034si368.png)(3.82)\n\
  \n```\n\\begin{matrix} {p_{c}^{k + \\frac{1}{2}} = p_{c}\\left( \\mathbf{N}^{G,\
