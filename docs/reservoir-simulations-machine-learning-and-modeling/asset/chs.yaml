  \ ↆ*j*]^(*x*)*P*[*b*]\n\n```)\n\n![image](img/F000058si226.png)\n\n如果通量（或面的法向梯度）在边界处被指定，则边界条件表示为纽曼边界条件。在这种情况下，指定的通量如图\
