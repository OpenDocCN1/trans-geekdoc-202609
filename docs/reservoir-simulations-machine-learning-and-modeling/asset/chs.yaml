  \ 根据基函数的定义，我们看到，除非节点 `x[i]`![image](img/F000046si69.png) 和 `x[j]`![image](img/F000046si70.png)\
  \ 均为 `K`![image](img/F000046si71.png) 的顶点，否则 `aij = 0`![image](img/F000046si68.png)。\n\
  \n对于多孔介质中的单相流，问题模型可以写为：\n\n```\n\\begin{matrix} {- \\nabla \\cdot K\\nabla p} &\
  \ {= q{in}\\Omega,} \\\\\\\\ p & {= p\\_{b}{on}\\Gamma_{D},} \\\\\\\\ {- K\\nabla\
  \ p \\cdot \\mathbf{n}} & {= u\\_{b}{on}{\\Gamma}\\_{N}.} \\\\\\\\ \\\\end{matrix}\
  \ (4.20)\n```\n\n![image](img/F000046si72.png)(4.20) \n\n弱形式读作：寻找 `p ∈ H[0, Γ[D]Ω)\
  \ + E(p[b])`![image](img/F000046si73.png) 使得（其中 `p[b]`![image](img/F000046si74.png)\
  \ 为本质边界条件 (BC)，而 `u[b]`![image](img/F000046si75.png) 为自然边界条件）：\n\n```\n(K∇p,∇v)\
  \ + ⟨u[b], v⟩[Γ[N]] = (q,v), ∀v ∈ H[0, Γ[D]Ω). (4.21)\n```\n\n![image](img/F000046si76.png)(4.21)\n\
  \nGalerkin 有限元方法读作：寻找 `p[h] ∈ V[h] + E(p[b])`![image](img/F000046si77.png) 使得\n\n\
  ```\n(K∇p[h],∇v) + ⟨u[b], v⟩[Γ[N]] = (q,v), ∀v ∈ Vh. (4.22)\n```\n\n![image](img/F000046si78.png)(4.22)\n\
  \n### 4.1.2 抽象最小化问题与变分问题\n\n我们考虑两个问题：\n\n1. **抽象最小化表述**：\n寻找 `p ∈ V_h` 使得 `F(p)\
  \ ≤ F(v)`，∀v ∈ V, (4.23)\n\n![image](img/F000046si79.png)(4.23)\n\n2. **抽象变分表述**：\n\
  寻找 `p ∈ V_h` 使得 `a(p,v) = L(v)`，∀v ∈ V. (4.24)\n\n![image](img/F000046si80.png)(4.24)\n\
  \n为了分析这两个问题，我们首先假设以下性质：\n\n- `a(·,⋅)` 是对称的，如果 `a(u,v) = a(v,u)`，∀u, v ∈ V.![image](img/F000046si81.png)\n\
  - `a(·,⋅)` 在范数 `||V||` 下是连续的或有界的，如果存在常数 `a* >0` 使得 `|a(u,v)| ≤ a(*)||u||V`。\n- `a(·,⋅)`\
  \ 是 `V`-椭性的（强制性的），如果存在常数 `a* > 0` 使得 `a(v,v) ≥ a||v||²`，∀v ∈ V.![image](img/F000046si82.png)\n\
  - `L` 在范数 `||V||` 下是有界的，如果 `|L(v)| ≤ L~||v||V`，∀v ∈ V.![image](img/F000046si90.png)\n\
  \n**Riesz 表示定理**：设 `H` 是一个带有内积 `(··)` 的希尔伯特空间，对于 `H` 上的任何连续线性泛函 `L`，存在唯一的 `u ∈ H`\
  \ 使得 `L(v) = [u,v]`。\n\n**Lax-Milgram 定理**：由于线性形式 `a` 是对称且 `V`-椭性的，在满足上述假设的前提下，变分问题具有唯一解。![image](img/F000046si91.png)\n\
  \n为了证明稳定性，我们将 `v = p` 代入有限元表述中，并利用 `a(·,⋅)` 的 `V`-椭性和 `L` 的有界性得到：\n\n```\na[]||p||V²\
  \ ≤ a(p,p) = L(p) ≤ L~||p||V, (4.26)\n```\n\n这意味着 `||p||V ≤ L*/a[]`。\n\n上述四个假设可以证明最小化问题和变分问题是等价的。可以检查即使没有对称假设，变分问题仍然具有唯一解。\n\
  \n假设 `V[h]` 是 `V` 的有限元（有限维）空间![image](img/F000046si124.png)。抽象最小化问题的离散形式为：\n\n```\n\
  find p[h] ∈ V[h] 使得 F(p[h]) ≤ F(v), ∀v ∈ V[h], (4.27)\n```\n\n![image](img/F000046si125.png)(4.27)\
  \ \n\n抽象变分问题的离散形式为：\n\n```\nfind p[h] ∈ V[h] 使得 a(p[h],v) = L(v), ∀v ∈ V[h], (4.28)\n\
  ```\n\n\n\n\n\n在四个假设下，之前的 Lax–Milgram 定理对于离散问题仍然有效。此外，解 `p[h]`∈ `V[h]`![image](img/F000046si127.png)\
  \ 满足 `||p[h]||[V]≤L̃/a[*]![image](img/F000046si128.png)\n\n**Cea 引理（误差估计）**：在上述提及的四个假设下，如果\
  \ `p`![image](img/F000046si129.png) 和 `p[h]`![image](img/F000046si130.png) 分别是抽象变分问题及其离散对应的解，那么：\n\
  \n$\\| p - p\\_{h}\\\\|_{V} \\leq \\\\frac{a^{\\*}}{a_{\\*}}\\\\| p - v\\\\|\\_{V},\\\
  \\forall v \\in V_{h}.$ (4.29)\n\n![image](img/F000046si131.png)(4.29)\n\n**Cea\
  \ 引理的证明**：通过用抽象变分问题减去其离散对应，我们看到：\n\n`a(p−p[h],w*)` = 0, ∀`w` ∈ `V[h]`. (4.30)\n\n\
  ![image](img/F000046si132.png)(4.30)\n\n利用 `a` 的有界性和 `V`![image](img/F000046si133.png)-椭\
  \ ipt 性 `a`![image](img/F000046si134.png)，对于任何 `v` ∈ `V[h]`![image](img/F000046si135.png)，可以得到：\n\
  \n`a[*]∥*p* − *p*[*h*]∥[*V*]² ≤ *a*(*p*−*p*[*h*],*p*−*p*[*h*]) = *a*(*p*−*p*[*h*],*p*−*v*) ≤ *a*^(\\\
  *)∥*p*  − *p*[*h*]∥[*V*]∥*p*  − *v*∥[*V*]`, (4.31),\n\n![image](img/F000046si136.png)(4.31)\n\
  \n这意味着我们得到了结论。\n\n### 4.1.3 Galerkin 有限元方法：设置与符号\n\n#### 黎曼积分\n黎曼积分由伯恩哈德·黎曼（Bernhard\
  \ Riemann, 1826–66）提出，是提供此类基础的一种广泛成功的尝试。黎曼的定义从构造一系列易计算的面积开始，这些面积收敛于给定函数的积分。这个定义的成功之处在于它为许多已解决的问题提供了预期答案，并为许多其他问题提供了有用的结果。然而，黎曼积分与函数取极限的结合并不良好，使得此类过程难以分析。这在研究傅里叶级数、傅里叶变换等课题中非常重要。\n\
  \n#### 勒贝格积分\n勒贝格积分在描述何时以及如何可以在积分号下取极限（通过单调收敛定理和主控制收敛定理）方面更有用。黎曼积分考虑的是由垂直矩形组成的曲线下方的面积，而勒贝格定义考虑的是不一定是矩形的水平条带，因此它更灵活。例如，狄利克雷函数（在参数为无理数时为\
  \ 0，否则为 1）具有勒贝格积分（积为 0），但没有黎曼积分。回想直觉，当从单位区间内均匀选取一个实数时，选取有理数的概率应该是零。\n\n对于 `Ω` 上的实值函数\
  \ `v`![image](img/F000046si137.png)![image](img/F000046si138.png)，我们使用符号 `∫[Ω]v*(x)*dx*`![image](img/F000046si139.png)\
  \ 来表示勒贝格意义上的 `f`![image](img/F000046si140.png) 积分。对于 `1≤q<∞`![image](img/F000046si141.png)，我们定义范数：\n\
  \n`||v||[L^(q)(Ω)]=(∫[Ω]|v*(x)|^qdx)^(1/q)`. (4.32)\n\n![image](img/F000046si142.png)(4.32)\n\
  \n对于 `q=∞`![image](img/F000046si143.png)，我们设置：\n\n`||v||[L^∞(Ω)]=ess{|v*(x)|x∈Ω}`,\
  \ (4.33),\n\n![image](img/F000046si144.png)(4.33)\n\n其中 `ess`![image](img/F000046si145.png)\
  \ 表示本质上上界。对于 `1≤q≤∞`![image](img/F000046si146.png)，我们定义勒贝格空间：\n\n`L^(q)(Ω)={v*:v\
  \ defined on Ω and ||v||[L^(q)(Ω)]<∞}`. (4.34) ![image](img/F000046si147.png)(4.34)\
  \ 对于 `q=2`![image](img/F000046si148.png)，例如 `L²(Ω)`![image](img/F000046si149.png)\
  \ 由 `Ω`![image](img/F000046si150.png) 上的平方可积函数组成（勒贝格意义上）。赋予范数 `||·`![image](img/F000046si151.png)\
  \ 的线性空间 `V`![image](img/F000046si152.png) 称为范线性空间。如果 `V`![image](img/F000046si153.png)\
  \ 是完备的，即 `V` 中的每一个柯西序列 `{v[i]`![image](img/F000046si154.png) 都有一个 `V`![image](img/F000046si155.png)\
  \ 中的极限 `v`![image](img/F000046si156.png)，则称之为完备空间。柯西序列 `{v[i]`![image](img/F000046si158.png)\
  \ 意味着当 `i,j→∞` 时 `||v[i]-v[j]||→0`![image](img/F000046si159.png)，而完备性意味着 `||v[i]-v||→0`![image](img/F000046si162.png)。\n\
  \n线性空间 `V`![image](img/F000046si164.png) 及其定义在其上的内积 `(·,·)`![image](img/F000046si165.png)\
  \ 称为内积空间，并表示为 `(V,)`![image](img/F000046si166.png)。带有内积 `(·,·)`![image](img/F000046si167.png)，在\
  \ `V`![image](img/F000046si168.png) 上有一个相关的范数：`||v||=sqrt{(v,v)},v∈V`。因此，内积空间总可以变成范线性空间。如果范线性空间\
  \ `(V,·)`![image](img/F000046si170.png) 关于范数 `||·`![image](img/F000046si171.png)\
  \ 是完备的，则称为 Banach 空间。对于 `1≤q≤∞`![image](img/F000046si172.png)，空间 `L^(q)(Ω)`![image](img/F000046si173.png)\
  \ 是 Banach 空间。如果内积空间 `(V,·)`![image](img/F000046si174.png) 关于范数 `||v||=sqrt{(v,v)}`![image](img/F000046si175.png)\
  \ 是完备的，则称为 Hilbert 空间。\n\n#### 多指标导数\n我们引入多指标偏导数符号：\n\n```\nD^\\alpha v = \\frac{\\\
  partial^{|\\alpha|}v}{\\partial x_1^{\\alpha_1}\\partial x_2^{\\alpha_2}}\\cdots\\\
  partial x_d^{\\alpha_d}}\n```\n\n(4.35)\n\n![image](img/F000046si176.png)(4.35)\n\
  \n其中 `alpha=(\\alpha[1],\\alpha[2],…\\alpha[d])`![image](img/F000046si177.png) 是一个多指标（称为\
  \ d 元组），其中 `alpha[1]`![image](img/F000046si178.png)、`alpha[2]`![image](img/F000046si179.png)、……\
  \ `alpha[d]`![image](img/F000046si180.png) 是非负整数，且 `|alpha|=alpha[1]+alpha[2]+...+alpha[d]`\
  \ 是 `alpha` 的长度![image](img/F000046si182.png)。在微积分中，函数的导数是逐点定义的。有限元方法中的变分表述是全局给出的，即通过\
  \ `Ω`![image](img/F000046si183.png) 上的积分来表示。因此，引入更适用于勒贝格空间的全局导数定义是自然的。\n\n对于 `Ω\\\
  subset\\mathbb{R}^d`![image](img/F000046si184.png)，我们用 `D(Ω)`![image](img/F000046si185.png)\
  \ 或 `C[0]^\\infty(Ω)`![image](img/F000046si186.png) 表示 `C^\\infty(Ω)`![image](img/F000046si187.png)（即无限次可微）函数的子集，这些函数在\
  \ `Ω`![image](img/F000046si188.png) 中具有紧致（即有界且闭）的支撑。为了引入弱导数，我们定义：\n\n```\nL[loc]1(Ω)={v*:v\
  \ \\in L¹(K) for any compact K inside Ω}\n```\n\n(4.36)\n\n![image](img/F000046si189.png)(4.36)\n\
  \n\n\n\n我们注意到 $C⁰(\\Omega) \\subset L^{loc}¹(\\Omega)$![image](img/F000046si190.png)\
  \ 且 $L^{loc}¹(\\Omega)$ 中的函数![image](img/F000046si191.png) 在边界附近可能表现出任意糟糕性。如果一个函数\
  \ $v \\in L^{loc}¹(\\Omega)$![image](img/F000046si192.png) 具有弱（广义）导数 $D[w]^{\\alpha}v=u![image](img/F000046si193.png)，则存在\
  \ $u \\in L^{loc}¹(\\Omega)$![image](img/F000046si194.png) 使得：\n\n```\n\\int_{\\\
  Omega}u(x)\\phi(x)dx = (− 1)^{|\\alpha|}\\int_{\\Omega}v(x)D^{\\alpha}\\phi(x)dx,\
  \ \\forall \\phi \\in \\mathcal{D}(\\Omega). (4.37)\n```\n\n![image](img/F000046si195.png)(4.37)\n\
  \n对于任何多指标指标 $\\alpha$![image](img/F000046si196.png)，如果 $v \\in C^{|\\alpha|}(\\\
  Omega)$![image](img/F000046si197.png)，则弱导数 $D[w]^{\\alpha}v$![image](img/F000046si198.png)\
  \ 存在并等于 $D^{\\alpha}v$![image](img/F000046si199.png)。因此，我们将忽略 $D[w]^{\\alpha}$![image](img/F000046si200.png)\
  \ 与 $D^{\\alpha}$![image](img/F000046si201.png) 定义上的差异。也就是说，如果经典导数不存在，求分符号 $D^{\\\
  alpha}$![image](img/F000046si202.png) 将代表弱导数。对于 $r \\in \\mathbb{N}$![image](img/F000046si203.png)\
  \ 和 $v \\in L^{loc}¹(\\Omega)$![image](img/F000046si204.png)，我们定义*索伯列范数*：\n\n```\n\
  \\| v\\|_{W^{r,q}(\\Omega)}: = \\left( {\\sum\\limits_{|\\alpha| \\leq r}{\\| D^{\\\
  alpha}v\\|_{L^{q}(\\Omega)}^{q}}} \\right)^{1/q}, (4.38)\n```\n\n![![image](img/F000046si205.png)(4.38)\n\
  \n当 $1 \\leq q < \\infty$![image](img/F000046si206.png)。对于 $q = \\infty$![image](img/F000046si207.png)，我们定义：\n\
  \n```\n\\| v\\|_{W^{r,\\infty}(\\Omega)}: = \\max\\limits_{|\\alpha| \\leq r}\\\
  | D^{\\alpha}v\\|_{L^{\\infty}(\\Omega)}.$ (4.39)\n```\n\n![![image](img/F000046si208.png)(4.39)\
  \ \n\n*索伯列空间*定义为：\n\n```\nW^{(r, q)}(\\Omega) := \\{v \\in L^{loc}¹(\\Omega) : \\\
  |v\\|[W^{(r, q)}(\\Omega)] < \\infty\\}, 1 \\leq q \\leq \\infty. (4.40)\n```\n\n\
  ![![image](img/F000046si209.png)(4.40) \n\n可以检查 $\\|\\cdot\\|[W^{(r, q)}(\\Omega)]$![image](img/F000046si210.png)\
  \ 确实是一个范数；此外，索伯列空间 $W^{(r, q)}(\\Omega)$![image](img/F000046si211.png) 是一个巴赫空间。我们用\
  \ $W_0^{(r, q)}(\\Omega)$![image](img/F000046si212.png) 表示 $\\mathcal{D}(\\Omega)$![image](img/F000046si213.png)\
  \ 相对于范数 $\\|\\cdot\\|[W^{(r, q)}(\\Omega)]$![image](img/F000046si214.png) 的完备。此外，对于\
  \ $q=2$![image](img/F000046si215.png)，我们将利用符号：\n\n```\nH^{(r)}(\\Omega) = W^{(r,\
  \ 2)}(\\Omega), H_0^{(r)}(\\Omega) = W_0^{(r, 2)}(\\Omega), r=1, 2, \\dots. (4.41)\n\
  ```\n\n![![image](img/F000046si216.png)(4.41)\n\n### 4.1 混合元方法\n\n在数值分析中，混合有限元（MFEM），也称为混合有限元，是一种在离散偏微分方程引入额外独立变量作为未知数的有限元类型。这些额外独立变量通过格朗日乘子受到约束。与\
  \ MFEM 不同，不引入此类独立变量的有限元称为不可约有限元（irreducible FEMs）。MFEM 对于某些在使用不可约有限元时会出现数值病态的问题是有效的；此类问题的一个例子是计算近压缩弹性体中的应力场（Galerkin\
  \ 锁定效应）。使用混合方法的原因等是因为在某些应用中，向量变量（例如流速）是有感兴趣的变量。这对于流体问题尤为如此。因此，混合方法同时近似向量变量和标量变量（例如压力），并给出两者的高阶近似。标准有限元使用单个单元空间不同，MFEM\
  \ 使用两个不同的空间，这解释了其名称的由来。对于流体问题，MFEM 的另一个明显优势是每个单元内局部守恒质量（或体积）。也就是说，我们需要一个标量变量（例如压力）的近似空间和一个向量变量（例如流速）的近似空间。为了使混合方法稳定，这两个空间必须满足\
  \ inf-sup 条件。\n\n我们考虑关于未知数 $p$ 的静态问题![image](img/F000046si217.png)：\n\n```\n\\begin{matrix}\
  \ -\\nabla \\cdot (\\mathbf{K}\\nabla p) & = f,{in}\\Omega, \\\\ p & p_{b}{on}\\\
  Gamma, \\\\ \\end{matrix} (4.42)\n```\n\n![![image](img/F000046si218.png)(4.42)\n\
  \n其中 $\\Omega \\subset \\mathbb{R}^d$![image](img/F000046si219.png) ($d=2$![image](img/F000046si220.png)\
  \ 或 3）是具有边界 $\\Gamma$![image](img/F000046si221.png) 的 2D 或 3D 区域，且 $f \\in L²(\\\
  Omega)$![image](img/F000046si222.png) 是一个给定函数。混合变分形式为：寻找 $\\mathbf{u} \\in \\mathbf{V}\
  \ = \\mathbf{H}(div, \\Omega)$![image](img/F000046si223.png) 和 $p \\in W = L²(\\\
  Omega)$![image](img/F000046si224.png)，使得：\n\n```\n\\begin{matrix} (\\mathbf{K}^{-\
  \ 1}\\mathbf{u},\\mathbf{v}) - (\\nabla \\cdot \\mathbf{v},p) & = - \\int_{\\Gamma}{p_{b}\\\
  mathbf{v} \\cdot \\nu}\\mathit{ds},\\\\forall\\mathbf{v} \\in \\mathbf{V}, \\\\\
  \ (\\nabla \\cdot \\mathbf{u},w) & = (f,w),\\\\forall w \\in W. \\\\ \\end{matrix}\
  \ (4.43)\n```\n\n![![image](img/F000046si225.png)(4.43) \n\n假设电导矩阵 $\\mathbf{K}$![image](img/F000046si226.png)\
  \ 是对称的，且在 $\\mathbf{x}$ 上是均匀正定的：$\\forall \\mathbf{x} \\in \\Omega$![image](img/F000046si228.png)\n\
  \n```\n0 < a^* \\leq \\sum_{i,j=1}^{d}{K_{ij}}(\\mathbf{x}) \\leq a. (4.44)\n```\n\
  \n![![image](img/F000046si229.png)(4.44) \n\n由于 $K$ 的性质![image](img/F000046si231.png)\
  \ 和 $p \\in W$![image](img/F000046si232.png)。\n\n令 $\\mathbf{V}^h \\subset \\mathbf{V}$![image](img/F000046si233.png)\
  \ 和 $W^h \\subset W$![image](img/F000046si234.png) 为某些有限维子空间。上述“混合变分形式”的离散版本为：寻找\
  \ $\\mathbf{u}^h \\in \\mathbf{V}^h$ 和 $p^h \\in W^h$\n\n```\n\\begin{matrix} (\\\
  mathbf{K}^{- 1}\\mathbf{u}^h,\\mathbf{v}) - (\\nabla \\cdot \\mathbf{v},p^h) & =\
  \ - \\int_{\\Gamma}{p_{b}\\mathbf{v} \\cdot \\nu}\\mathit{ds},\\\\forall\\mathbf{v}\
  \ \\in \\mathbf{V}^h, \\\\ (\\nabla \\cdot \\mathbf{u}^h,w) & = (f,w),\\\\forall\
  \ w \\in W^h. \\\\ \\end{matrix} (4.45)\n```\n\n![![image](img/F000046si235.png)(4.45)\
  \ \n\n为了使该问题有唯一解，自然需要施加离散的 inf-sup 条件：\n\n```\n\\underset{0 \\neq \\mathbf{v} \\\
  in \\mathbf{V}^h}{\\mathit{\\sup}}\\frac{|(\\nabla \\cdot \\mathbf{v},w)|}{\\|\\\
  mathbf{v}\\|_{\\mathbf{V}}} \\geq C_{2}\\|w\\|_{W},\\\\forall w \\in W^h, (4.46)\n\
  ```\n\n![![image](img/F000046si236.png)(4.46) \n\n\n\n其中 `C[2] > 0` 是一个独立于 `h` 的常数。\n\
  \n下一个条件是 MFEM 的解性条件：\n\n$\\sup\\\\limits\\_{0 \\\\neq \\mathbf{v} \\in \\\\mathbf{V}\\\
  _{h}}\\\\frac{|\\\\left( \\nabla \\cdot \\mathbf{v},w \\right)|}{\\\\|\\\\mathbf{v}\\\
  \\|_{\\\\mathbf{V}}} \\geq C_{2}\\| w\\\\\\|_{W},\\\\forall w \\\\in W\\_{h}.$ (4.48)\n\
  \n该条件可以重写为：\n\n$\\inf\\\\limits\\_{0 \\\\neq w \\in W\\_{h}}\\\\sup\\\\limits\\\
  _{0 \\\\neq \\mathbf{v} \\in \\\\mathbf{V}\\_{h}}\\\\frac{|\\\\left( \\nabla \\\
  cdot \\mathbf{v},w \\right)|}{\\\\|\\\\mathbf{v}\\\\|_{\\_{\\mathbf{V}}\\\\| w\\\
  \\|\\_{W}} \\geq C_{2} > 0.$ (4.49)\n\n这是（离散）稳定性条件，也称为离散 inf–sup 条件（充足条件）。它也被称为\
  \ Babuska–Brezzi 条件，有时被称为 Ladyshenskaja–Babuska–Brezzi 条件。\n\n对于 `Ω ⊂ ℝ²`，令 `\U0001D4A6\
  [h]` 是 `Ω` 的三角形划分，使得相邻单元完全共享它们的公共边。对于三角形 `K ∈ \U0001D4A6[h]`，令\n\n`Pr = {v : v 是在\
  \ K 上次数至多为 r 的多项式}`, (4.50)\n\n其中 `r ≥ 0` 是一个整数。混合有限元空间 `V[h] × W[h]` 在每个单元 `K ∈\
  \ \U0001D4A6[h]` 上局部定义，因此令：\n\n`Vh = V[h]|[K]` (4.51)\n\n（`V[h]` 在 `K` 上的限制）以及\n\
  \n`Wh = W[h]|[K]`. (4.52)\n\n*三角形上的 Raviart-Thomas (RT) 空间* 是引入的第一批混合有限元空间：\n\n\
  `Vh = (Pr)² ⊕ ((x[1],x[2])*Pr), Wh = Pr`, (4.53)\n\n其中符号 `⊕` 表示直接和。对于 `r = 0`，我们观察到\
  \ `Vh` 具有形式：\n\n`Vh = {v : v = a[K]x[1] + b[K]x[2] + c[K], a[K], b[K], c[K] ∈ ℝ}`,\
  \ (4.54)\n\n其维度为三。在 `r = 0` 的情况下，作为描述 `V[h]` 中函数的自由度（DOF），我们使用函数在 `\U0001D4A6[h]`\
  \ 中边中点处的法向分量值，而 `W[h]` 的自由度可以是函数在 `K` 上的平均值。一般而言，对于 `r ≥ 0`，`Vh` 和 `Wh` 的维度为：\n\n\
  $\\dim(\\mathbf{V}_{h}(K)) = (r + 1)(r + 3),\\\\dim(W_{h}(K)) = \\frac{(r + 1)(r\
  \ + 2)}{2}.$ (4.55)\n\n对于 `r ≥ 0`，空间 `Vh` 的自由度由给出：\n\n`(v ⋅ ν, w)[e], ∀ w ∈ Pr,\
  \ e ∈ ∂K`, (4.56),\n\n`(v, w)[K], ∀ w ∈ (Pr−1)²`. (4.57)\n\n这确实是一个合理的选择；即 `Vh` 中的函数由这些自由度唯一确定。这是一个方阵系统，且唯一性意味着存在性。\n\
  \n我们现在考虑 `Ω` 为矩形区域且 `\U0001D4A6[h]` 为 `Ω` 的矩形划分的情况，使得矩形的水平和垂直边分别平行于 `x[1]` 和 `x[2]`\
  \ 坐标轴，且相邻单元完全共享它们的公共边。定义：\n\n$Q_{l,r}(K) := \\{v:v(x) = \\sum\\\\limits\\_{i = 0}^{l}{\\\
  sum\\\\limits\\_{j = 0}^{r}{v_{ij}x_{1}^{i}x_{2}^{j}}},\\\\mathbf{x} = (x_{1},x_{2})\
  \ \\in K,v_{ij} \\in \\mathbb{R}\\}.$ (4.58)\n\n即，`Ql,r` 是关于 `x[1]` 次数至 `l` 且 `x[2]`\
  \ 次数至 `r` 的多项式空间，`r ≥ 0`。\n\n*矩形上的 RT 空间*是三角形 RT 空间向矩形的扩展：\n\n$\\begin{matrix} {\\\
  \\mathbf{V}_{h}(K) = Q_{r + 1}(K) \\\\times Q_{r + 1}(K),}\\\\\\\\ {W_{h}(K) = Q_{r,r}(K)}\\\
  \\ \\\\end{matrix}$ (4.59)\n\n在 `r = 0` 的情况下，`Vh` 采用如下形式：\n\n`Vh = {v : v = a[K]¹\
  \ + b[K]²x[1] + c[K]³ + d[K]⁴x[2]}`, 其中 `a[K], b[K], c[K], d[K] ∈ ℝ`, `i = 1, 2,\
  \ 3, 4`。(4.60)\n\n其维度为四。`Vh` 的自由度是函数在 `\U0001D4A6[h]` 中每条边中点的法向分量。对于一般的 `r ≥ 0`，`Vh`\
  \ 和 `Wh` 的维度为：\n\n$\\begin{array}{l} {\\\\dim(\\mathbf{V}_{h}(K)) = 2(r + 1)(r +\
  \ 2),}\\\\\\\\ {\\\\dim(W_{h}(K)) = {(r + 1)}^{2}.\\\\end{array}$ (4.61)\n\n`Vh`\
  \ 的自由度给出：\n\n$\\begin{matrix} {{(\\mathbf{v} \\cdot \\nu,w)}_{e},\\\\forall w \\\
  in P_{r}(e),e \\in \\partial K},\\\\\\\\ {{(\\mathbf{v},\\\\mathbf{w})}_{K},\\\\\
  forall\\mathbf{w} \\in Q_{r - 1,r}(K) \\times Q_{r,r - 1}(K)}.\\\\\\\\end{matrix}$\
  \ (4.62)\n\n矩形上的 *BDM（或 Brezzi–Douglas–Marini）空间*（Brezzi et al., 1985）与矩形上的 RT 空间有显著不同：向量单元基于通过总次数为\
  \ `r` 的向量多项式空间增加两个额外的向量，而不是通过次数为 `r` 的向量多项式张积空间增加 `2r+2` 个高阶多项式。此外，标量变量使用了低维的空间。对于任何\
  \ `r ≥ 1`，BDM 空间给出：\n\n$\\begin{matrix} {\\\\mathbf{V}_{h}(K) = {(P_{r}(K))}^{2}\
  \ \\\\oplus {span}\\\\left\\\\{ \\mathbf{c}\\mathbf{u}\\mathbf{r}\\mathbf{l}(x_{1}^{r\
  \ + 1}x_{2}),\\\\mathbf{c}\\mathbf{u}\\mathbf{r}\\mathbf{l}(x_{1}x_{2}^{r + 1})\
  \ \\\\right\\\\}} \\\\\\\\ {W_{h}(K) = P_{r - 1}(K)}.\\\\\\\\end{matrix}$ (4.63)\n\
  \n\n\n\n在 `r` = 1![image](img/F000046si308.png) 的情况下，`V`h`![image](img/F000046si309.png)\
  \ 可以表示为\n\n$\\\\begin{matrix} \\\\left\\\\{ \\mathbf{v}:\\\\mathbf{v} = (v\\_{1},v\\\
  _{2}),v\\_{1} = (a\\_{K}^{1} + a\\_{K}^{2}x_{1} + a\\_{K}^{3}x_{2} - a\\_{K}^{4}x_{1}^{2}\
  \ - 2a\\_{K}^{5}x_{1}x_{2}), \\\\right. \\\\\\\\ \\\\left. v\\_{2} = (a\\_{K}^{6}\
  \ + a\\_{K}^{7}x_{1} + a\\_{K}^{8}x_{2} + 2a\\_{K}^{4}x_{1}x_{2} + a\\_{K}^{5}x_{2}^{2}),\
  \ \\\\right\\\\} \\\\\\\\ \\\\end{matrix}$ (4.64)\n\n![image](img/F000046si310.png)(4.64)\
  \ \n\n其维度为八。`V`h`![image](img/F000046si311.png) 的自由度（DOF）是 \U0001D4A6[`h]`![image](img/F000046si312.png)\
  \ 中每条边两个二次高斯点上的函数法向分量的值。对于任意 `r` ≥ 1![image](img/F000046si313.png)，`V`h`![image](img/F000046si314.png)\
  \ 和 `W`h`![image](img/F000046si315.png) 的维度为\n\n$\\\\begin{matrix} {\\\\dim(\\\\\
  mathbf{V}\\_{h}(K)) = (r + 1)(r + 2) + 2,} \\\\\\\\ {\\\\dim(W\\_{h}(K)) = \\\\\
  frac{r(r + 1)}{2}.} \\\\\\\\ \\\\end{matrix}$ (4.65)\n\n![image](img/F000046si316.png)(4.65)\
  \ \n\n`V`h`![image](img/F000046si317.png) 的自由度为\n\n$\\\\begin{matrix} {{(\\\\mathbf{v}\
  \ \\\\cdot \\\\nu,w)}\\_{e},\\\\forall w \\\\in P\\_{r}(e),e \\\\in \\\\partial\
  \ K,} \\\\\\\\ {{(\\\\mathbf{v},\\\\mathbf{w})}\\_{K},\\\\forall\\\\mathbf{w} \\\
  \\in {(P\\_{r - 2}(K))}^{2}.} \\\\\\\\ \\\\end{matrix}$ (4.66)\n\n![image](img/F000046si318.png)(4.66)\
  \ \n\nMFEM 可以重写为矩阵形式：\n\n$\\\\begin{bmatrix} \\\\mathbf{A} & \\\\mathbf{B} \\\\\\\
  \\ \\\\mathbf{B}^{T} & 0 \\\\ \\\\end{bmatrix}\\\\begin{pmatrix} \\\\mathbf{u} \\\
  \\ \\\\mathbf{p} \\\\ \\\\end{pmatrix} = \\\\begin{pmatrix} \\\\mathbf{g} \\\\\\\
  \\ {- \\\\mathbf{f}} \\\\ \\\\end{pmatrix}.$ (4.67)\n\n![image](img/F000046si319.png)(4.67)\
  \ \n\n整体矩阵\n\n$M = \\\\begin{bmatrix} \\\\mathbf{A} & \\\\mathbf{B} \\\\\\\\ \\\\\
  mathbf{B}^{T} & 0 \\\\ \\\\end{bmatrix}$ (4.68)\n\n![image](img/F000046si320.png)(4.68)\
  \ \n\n在 inf–sup 条件下是非奇异的，但它不是正定的。这限制了许多迭代算法应用于所得代数方程的应用。\n\nUzawa 算法（\n\n$\\\\begin{array}{l}\
  \ {\\\\mathbf{A}\\\\mathbf{u}^{k} = \\\\mathbf{g} - \\\\mathbf{B}\\\\mathbf{p}^{k\
  \ - 1},} \\\\\\\\ {\\\\mathbf{p}^{k} = \\\\mathbf{p}^{k - 1} + \\\\alpha(\\\\mathbf{B}^{T}\\\
  \\mathbf{u}^{k} + \\\\mathbf{f}),} \\\\\\\\ \\\\end{array}$ (4.69)\n\n![image](img/F000046si324.png)(4.69)\
  \ \n\n其中 `α`![image](img/F000046si325.png) 是给定的实数。为了观察 Uzawa 算法的收敛性，我们定义残差：\n\n\
  `e^(`k*)` :  = − **B**^(`T*)`**u**^(`k*)` − **f**. (4.70)\n\n![image](img/F000046si326.png)(4.70)\
  \ \n\n我们注意到 `B^(`T*)`**A**(`(`1`)**p**=`B^(`T*)`**A**(`1`)**g**+**f**. (4.71)\n\n\
  ![image](img/F000046si327.png)(4.71) \n\n利用上述方程和算法，我们看到 `e^(`k*)` = − **B**(`T*)`**A**(`1`)(**g**−**p**(`k*)`)) = − **B**(`T*)`**A**(`1`)(**p**(`k*)`)).\
  \ (4.72)\n\n![image](img/F000046si328.png)(4.72) \n\n所以 `p^(`k*)`−**p**(`k*)` = − ***B**(`T*)`**A**(`1`)(**p**(`k*)`)).\
  \ (4.73)\n\n![image](img/F000046si329.png)(4.73)\n\n### 4.1.5 混合混合有限元方法\n\n通常的混合公式需要求解鞍点形式的线性方程，这计算量很大。另一种方法是涉及方程的混合（或拉格朗乘子）形式。在这种方法中，通过拉格朗乘子消去压力和速度。未知数增加了：最低阶\
  \ RT 空间在 `d=2` 时每条边有一个拉格朗乘子未知数，在 `d=3` 时每个面有一个拉格朗乘子未知数。这种方法实现简单，只需要求解一个稀疏半正定线性方程。\n\
  \n为了方便表述，我们在模型问题中假设 `p[`b]`=0![image](img/F000046si332.png)。也就是说，我们现在考虑未知数 `p`![image](img/F000046si333.png)\
  \ 的静态问题：\n\n$\\\\begin{matrix} {- \\\\nabla \\\\cdot \\\\left( \\\\mathbf{K}\\\\\
  nabla p \\\\right)} & {= f,{in}\\\\Omega,} \\\\ p & {= 0{on}\\\\Gamma = \\\\partial\\\
  \\Omega,} \\\\ \\\\end{matrix}$ (4.74)\n\n![image](img/F000046si334.png)(4.74) \n\
  \n其中 `Ω` ⊂ ℝ(`d`) (`d`2 or 3) 是具有边界 `Γ` 的有界区域，且 `f` ∈ L*²(`Ω`)![image](img/F000046si338.png)\
  \ 是给定函数。\n\n我们记得\n\n`V[`h]` : = {**v** ∈ **V**:**v**|K∈**V`h`∀*K*∈ \U0001D4A6[`h`].\
  \ (4.75)\n\n![image](img/F000046si339.png)(4.75) \n\n约束条件 `V[`h]` ⊂ **V**![image](img/F000046si340.png)\
  \ 意味着 `V[`h]`![image](img/F000046si341.png) 中函数的法向分量在 \U0001D4A6[`h]`![image](img/F000046si342.png)\
  \ 的内部边界上是连续的。按照\n\n${\\widetilde{\\mathbf{V}}}\\_{h}: := \\\\left\\\\{ \\\\mathbf{v}\
  \ \\\\in \\\\left( {L^{2}\\\\left( \\\\Omega\\\\right)} \\\\right)^{d}:\\\\mathbf{v}|K\
  \ \\\\in \\\\mathbf{V}_{h} \\forall K \\\\in \\\\mathcal{K}}.$ (4.76)\n\n![image](img/F000046si345.png)(4.76)\
  \ \n\n注意 `V[`h]` ⊂ **V**![image](img/F000046si346.png) 和 `V[`h]` ⊂ **V**![image](img/F000046si347.png)。我们需要引入拉格朗乘子来强制\
  \ `\\widetilde{V}_h` 上的所需连续性。为了这一点，我们定义\n\n$L_{h}:{\\\\mu \\in L^{2}(\\mathcal{E}_{h})}\
  \ \\mathcal{h}$ (4.77)\n\n![image](img/F000046si350.png)(4.77) \n\n其中 $\\mathcal{E}_{h}$\
  \ 是 \U0001D4A6[`h]` 中的边或面![image](img/F000046si351.png)。\n\n混合方法的混合形式为：寻找 (`u[`h]`,\
  \ `p[`h]`, `λ[`h]`![image](img/F000046si352.png) $\\in \\widetilde{V}_h \\times\
  \ W_h \\times L_h$ 使得\n\n$\\\\begin{matrix} {\\\\left( \\\\mathbf{u}_{h},\\\\mathbf{v}_{h}\
  \ \\\\right) - \\\\sum\\\\limits_{K \\\\in \\\\mathcal{K}_{h}}\\\\left( {\\\\nabla\
  \ \\\\cdot \\\\mathbf{u}_{h},p_{h} \\\\right)_{K} - \\\\mathbf{v}_{h} \\\\cdot \\\
  \\nu_{K},\\\\lambda_{h}\\\\partial K \\\\setminus \\\\Gamma} \\\\right) = 0,\\\\\
  quad\\\\forall v \\\\in \\\\widetilde{\\mathbf{V}}_{h}}, \\\\\\\\ {\\\\sum\\\\limits_{K\
  \ \\\\in \\\\mathcal{K}_{h}}\\\\left( {\\\\nabla \\\\cdot \\\\mathbf{u}_{h},w} \\\
  \\right)_{K} = \\\\left( {f,w} \\\\right),\\\\quad\\\\forall w \\\\in W_{h}}, \\\
  \\\\\\ {\\\\sum\\\\limits_{K \\\\in \\\\mathcal{K}_{h}}\\\\left\\\\langle {\\\\\
  mathbf{u}_{h} \\\\cdot \\\\nu_{K},\\\\mu_{h} \\\\right\\\\rangle_{\\\\partial K\
  \ \\\\setminus \\\\Gamma} = 0,\\\\quad\\\\forall\\\\mu \\\\in L_{h},} \\\\ \\\\\
  end{matrix}$ (4.78)\n\n![image](img/F000046si355.png)(4.78) \n\n其中 `ν[`K]` 表示 `K`\
  \ 的外向单位法![image](img/F000046si356.png)。注意上述第三方程强制了 **u[`h]`![image](img/F000046si357.png)\
  \ 的连续性要求。事实上，有 **u[`h]` ∈ **V[`h]`![image](img/F000046si358.png)。矩阵形式可以表示为：\n\n\
  $\\\\begin{bmatrix} \\\\mathbf{A} & \\\\mathbf{B} & \\\\mathbf{C} \\\\\\\\ \\\\\
  mathbf{B}^{T} & 0 & 0 \\\\\\\\ \\\\mathbf{C}^{T} & 0 & 0 \\\\ \\\\end{bmatrix}\\\
  \\begin{pmatrix} \\\\mathbf{u} \\\\ \\\\mathbf{p} \\\\\\\\ \\\\lambda \\\\ \\\\\
  end{pmatrix} = \\\\begin{pmatrix} 0 \\\\\\\\ {- \\\\mathbf{f}} \\\\\\\\ 0 \\\\ \\\
  \\end{pmatrix}.$ (4.79)\n\n![image](img/F000046si360.png)(4.79) \n\n\n\n\n\n其中 `λ`![image](img/F000046si361.png)\
  \ 是 `λ`[`h`]`![image](img/F000046si362.png) 的自由度。之前系统的优势在于矩阵 `A`![image](img/F000046si363.png)\
  \ 是块对角矩阵，每个块对应于单个单元。因此，`A`![image](img/F000046si364.png) 容易在单元级求逆。利用矩阵 `A`![image](img/F000046si365.png)\
  \ 是块对角矩阵的特性（因此 `A^( − 1)`![image](img/F000046si366.png) 可以很容易获得），混合混合有限元（MHFEM）矩阵形式的第一方程导致：\n\
  \n```\nu =  − A^( − 1)B****p** − A^( − 1)C***λ*. (4.80)\n```\n\n![image](img/F000046si367.png)(4.80)\
  \ \n\n将其代入 MFHEM 矩阵形式的第二和第三方程，我们看到：\n\n```\n\\\\begin{matrix} {\\\\mathbf{B}^{T}\\\
  \\mathbf{A}^{- 1}\\\\mathbf{B}\\\\mathbf{p} + \\\\mathbf{B}^{T}\\\\mathbf{A}^{-\
  \ 1}\\\\mathbf{C}\\\\lambda = \\mathbf{f},} \\\\\\\\ {\\\\mathbf{C}^{T}\\\\mathbf{A}^{-\
  \ 1}\\\\mathbf{B}\\\\mathbf{p} + \\\\mathbf{C}^{T}\\\\mathbf{A}^{- 1}\\\\mathbf{C}\\\
  \\lambda = \\mathbf{f}.} \\\\\\\\ \\\\end{matrix}\n```\n(4.81)\n\n![image](img/F000046si368.png)(4.81)\
  \ \n\n我们注意到 `B^(*T*)A^( − 1)B`![image](img/F000046si369.png) 是对称正定的，因此代数方程（AE）方程组在\
  \ Eq. (4.81)中的第一个方程产生：\n\n```\np = (**B^(*T*)A^( − 1)B)^( − 1)**f** − (**B^(*T*)A^( − 1)B)^( − 1)B^(*T*)A^( − 1)C***λ*.\
  \ (4.82)\n```\n\n![image](img/F000046si370.png)(4.82) \n\n将此方程代入 AE 组 Eq. (4.81)中的第二个方程，意味着\
  \ `λ`![image](img/F000046si371.png)的线性方程组：\n\n```\n(**C^(*T*)A^( − 1)C** − (**C^(*T*)A^( − 1)B)B^( − 1)B)^( − 1)B^( − 1)C*)λ* = − (**C^(*T*)A^( − 1)B)B^( − 1)B)^( − 1)**f**.\
  \ (4.83)\n```\n\n![image](img/F000046si372.png)(4.83) \n\n这个关于 `λ`![image](img/F000046si373.png)的方程是对称正定且稀疏的。我们可以（例如通过迭代算法）求解\
  \ `λ`![image](img/F000046si374.png)，然后恢复 `p`![image](img/F000046si375.png)，最后再恢复\
  \ `u`![image](img/F000046si376.png)。\n\n从另一个角度看，我们注意到在重新排列 `u`![image](img/F000046si377.png)和\
  \ `p`![image](img/F000046si378.png)中的未知数后，矩阵 $\\begin{bmatrix} \\mathbf{A} & \\\
  mathbf{B} \\\\ \\mathbf{B}^{T} & 0 \\end{bmatrix}$![image](img/F000046si379.png)\
  \ 变成了块对角矩阵（记为 `D`![image](img/F000046si380.png)），每个块对应于单个单元。因此我们可以在单元级容易地求逆矩阵 `D`![image](img/F000046si381.png)（以及上面的\
  \ 2×2![image](img/F000046si382.png) 块）。如果 `λ`![image](img/F000046si385.png) 已知，可以通过方程组求解未知数\
  \ `u`![image](img/F000046si383.png)和 `p`![image](img/F000046si384.png)：\n\n```\n\
  \\begin{bmatrix} \\mathbf{A} & \\mathbf{B} \\\\ \\mathbf{B}^{T} & 0 \\end{bmatrix}\\\
  begin{pmatrix} \\mathbf{u} \\\\ \\mathbf{p} \\end{pmatrix} + \\begin{bmatrix} \\\
  mathbf{C} \\\\ 0 \\end{bmatrix}\\begin{pmatrix} \\lambda \\end{pmatrix} = \\begin{pmatrix}\
  \ 0 \\\\ -\\mathbf{f} \\end{pmatrix}. (4.84)\n```\n\n![image](img/F000046si386.png)(4.84)\
  \ \n\n在局部计算后，如果 `λ`![image](img/F000046si389.png) 已知，我们可以获得未知数 `u`![image](img/F000046si387.png)和\
  \ `p`![image](img/F000046si388.png)：\n\n```\n\\begin{pmatrix} \\mathbf{u} \\\\ \\\
  mathbf{p} \\end{pmatrix} = - \\begin{bmatrix} \\mathbf{A} & \\mathbf{B} \\\\ \\\
  mathbf{B}^{T} & 0 \\end{bmatrix}^{- 1}\\begin{pmatrix} \\mathbf{C}\\lambda \\\\\
  \ \\mathbf{f} \\end{pmatrix}. (4.85)\n```\n\n![image](img/F000046si390.png)(4.85)\
  \ \n\n可以注意到，逆矩阵 $\\begin{bmatrix} \\mathbf{A} & \\mathbf{B} \\\\ \\mathbf{B}^{T}\
  \ & 0 \\end{bmatrix}$![image](img/F000046si391.png) 仅涉及单元级的局部计算。将此方程代入 AE 组的第三个方程（见\
  \ Eq. 4.81），意味着 `λ`![image](img/F000046si392.png)的线性方程组。\n\n## 4.2 有限差分法与有限元的之间的联系\n\
  \n### 4.2.1 模型\n我们考虑未知数 `p`![image](img/F000046si393.png)的稳态问题：\n\n```\n\\begin{matrix}\
  \ -\\nabla \\cdot \\left( \\mathbf{K}\\nabla p \\right)} &= f,{in}\\Omega \\\\ p\
  \ &= 0{on}\\Gamma \\end{matrix}\n```\n(4.86)\n\n![image](img/F000046si394.png)(4.86)\n\
  \n其中 `Ω`$\\subset\\mathbb{R}^d$![image](img/F000046si395.png) 是具有边界 `Γ`![image](img/F000046si396.png)\
  \ 的有界一维(1D)、二维或三维区域，`f`$\\in L²(\\Omega)$![image](img/F000046si397.png) 是已知函数。假设电导率\
  \ `K`![image](img/F000046si398.png) 在 `x` 上是有界的、对称的且均匀正定的：$\\forall x\\in \\Omega,\
  \ \\forall \\eta\\in \\mathbb{R}^d \\setminus 0, 0 < a^* \\leq |\\eta|^{-2}\\sum_{i,j=1}^{d}K_{ij}(x)\\\
  eta_i\\eta_j \\leq a^* < \\infty.$ (4.87)\n\n![image](img/F000046si401.png)(4.87)\
  \ \n\n我们假设 `Ω`![image](img/F000046si402.png) 是矩形区域。让 `T[h]`![image](img/F000046si403.png)\
  \ 为 `Ω`![image](img/F000046si404.png) 划分为不重叠（开）单元 `E[i]`![image](img/F000046si405.png)\
  \ 的划分，这些单元是区间(1D)、矩形(2D)或矩形(3D)。电导率 `K`![image](img/F000046si406.png) 假设为单元内常数张量。例如，如果是二维，有：\n\
  \n```\n\\mathbf{K} = \\begin{bmatrix} K_{xx} & 0 \\\\ 0 & K_{yy} \\end{bmatrix},\n\
  ```\n(4.88)\n\n![image](img/F000046si407.png)(4.88) \n\n其中 `K^(xx)`![image](img/F000046si408.png)和\
  \ `K^(yy)`![image](img/F000046si409.png) 是单元内常数函数。\n\n### 4.2.2 Galerkin 有限元方法与中心有限差分法的等价（注：此处原文标题为\
  \ Equivalence...））\nGalerkin 有限元方法与中心有限差分法的等价\n我们让 `V=H0`![image](img/F000046si410.png)，且\
  \ Galerkin 弱形式为：\n\n```\n(\\mathbf{K}\\nabla p, \\nabla v) = (f, v), \\forall v\
  \ \\in V.\n```\n(4.89)\n\n![image](img/F000046si411.png)(4.89) \n\n此外，如果我们设置 `V[h]\\\
  subset V`![image](img/F000046si412.png) 为某个有限维子空间。Galerkin FEM 变为：寻找 `p[h]\\in V[h]`![image](img/F000046si414.png)\
  \ 使得：\n\n```\n(\\mathbf{K}\\nabla p[h], \\nabla v) = (f, v), \\forall v \\in V[h].\n\
  ```\n(4.90)\n\n![image](img/F000046si415.png)(4.90) \n\nGalerkin FEM 的解有唯一的表示：\n\
  \n```\n$p(x) = \\sum_{j=1}^{m-1} p_j \\varphi_j(x), x \\in \\Omega.\n```\n(4.91)\n\
  \n![image](img/F000046si416.png)(4.91) \n\n\n\n\n\n其中 $a[i][j]$ = ($K\\phi[j]',\
  \ \\phi[i]'$), $b[i]$ = ($f,\\phi[i]$), $i, j$ = 1, 2, …, $m-1$![image](img/F000046si420.png)\
  \ 我们回想起，如果 $x[i-1] \\le x \\le x[i]$![image](img/F000046si421.png)，$\\phii$ = (($x-x[i-1])/(x[i]-x[i-1])$)![image](img/F000046si422.png),如果\
  \ $x[i] \\le x \\le x[i+1]$![image](img/F000046si423.png),则 $\\phii$ = (($x-x[i+1])/(x[i]-x[i+1])$)![image](img/F000046si424.png),此处\
  \ $\\phii$ = 0![image](img/F000046si425.png)。此后我们可以得到，如果 $x[i-1] \\le x \\le x[i]$![image](img/F000046si426.png)，$\\\
  phi[i]'(x)$ = ($1/(x[i]-x[i-1])$)![image](img/F000046si427.png),如果 $x[i] \\le x\
  \ \\le x[i+1]$![image](img/F000046si428.png),$\\phi[i]'(x)$ = ($1/(x[i+1]-x[i])$)![image](img/F000046si429.png),此处\
  \ $\\phi[i]'(x)$ = 0![image](img/F000046si430.png)。\n\n为了计算系数矩阵，我们令 $h[i-0.5] =\
  \ x[i]-x[i-1]$![image](img/F000046si431.png)然后计算：\n\n```latex\n\\begin{matrix} a_{ii}\
  \ & {(\\mathbf{K}\\varphi'_{i},\\varphi'_{i})_{E_{i-0.5}} + {(\\mathbf{K}\\varphi'_{i},\\\
  varphi'_{i})_{E_{i+0.5}}} \\\\ & \\left| E_{i-0.5} \\right| K_{i-0.5}\\left( \\\
  frac{1}{h_{i-0.5}} \\right)^{2} + \\left| E_{i+0.5} \\right| K_{i+0.5}\\left( -\\\
  frac{1}{h_{i+0.5}} \\right)^{2} \\right. \\\\ &= \\frac{K_{i-0.5}}{h_{i-0.5}} +\
  \ \\frac{K_{i+0.5}}{h_{i+0.5}} \\\\ \\end{matrix}\n```\n(4.94)\n\n![image](img/F000046si432.png)(4.94)\n\
  \n类似，我们有：\n\n```latex\n\\begin{matrix} a_{i,i-1} & {(\\mathbf{K}\\varphi'_{i-1},\\\
  varphi'_{i})_{E_{i-0.5}}} = - \\frac{K_{i-0.5}}{h_{i-0.5}}, \\\\ a_{i,i+1} & {(\\\
  mathbf{K}\\varphi'_{i+1},\\varphi'_{i})_{E_{i+0.5}}} = - \\frac{K_{i+0.5}}{h_{i+0.5}}.\
  \ \\\\ \\end{matrix}\n```\n(4.95)\n\n![image](img/F000046si433.png)(4.95)\n\n为了计算\
  \ 等式 (4.93) 的右侧项，接下来使用梯形积分法则[记作 $(\\cdot,\\cdot)[Q]$![image](img/F000046si434.png)]，我们可以得到：\n\
  \n```latex\nb_{i} = (f,\\varphi_{i}) \\approx (f,\\varphi_{i})_{Q} = \\frac{h_{i-0.5}\
  \ + h_{i+0.5}}{2}f\n```\n(4.96)\n\n![image](img/F000046si435.png)(4.96)\n\n对于 $i=2,\
  \ 3, \\dots, m-2$![image](img/F000046si436.png)，等式 (4.93)变为：\n\n```latex\n-\\frac{K_{i-0.5}}{h_{i-0.5}}p_{i-1}\
  \ + \\left(\\frac{K_{i-0.5}}{h_{i-0.5}} + \\frac{K_{i+0.5}}{h_{i+0.5}}\\right)p_{i}\
  \ - \\frac{K_{i+0.5}}{h_{i+0.5}}p_{i+1} = \\frac{h_{i-0.5} + h_{i+0.5}}{2}f_{i}\n\
  ```\n等等，文中的逻辑是：\n这与点中心有限差分完全一致：\n\n```latex\n-\\frac{K_{i+0.5}(p_{i+1}-p_{i})/(x_{i+1}-x_{i})\
  \ - K_{i-0.5}(p_{i}-p_{i-1})/(x_{i}-x_{i-1})}{x_{i+0.5}-x_{i-0.5}} = f_{i}, i =\
  \ 2,\\dots,m-2.\n```\n(4.98)\n\n![image](img/F000046si438.png)(4.98)\n\n### 4.2.3\
  \ 混合有限元方法与单元中心有限差分方法的等价性\n\n混合变分形式为：寻找 $u \\in H^{div}(\\Omega)$![image](img/F000046si439.png)\
  \ 和 $p \\in L²(\\Omega)$![image](img/F000046si440.png)，使得：\n\n```latex\n\\begin{matrix}\
  \ (\\mathbf{K}^{-1}u,v) - (\\nabla \\cdot v,p) &= 0,\\forall v \\in V \\\\ (\\nabla\
  \ \\cdot u,w) &= (f,w),\\forall w \\in W. \\end{matrix}\n```\n(4.99)\n\n![image](img/F000046si441.png)(4.99)\n\
  \n设 $V_h \\subset V$![image](img/F000046si442.png) 和 $W_h \\subset W$![image](img/F000046si443.png)\
  \ 为某些有限维子空间。混合有限元方法（MFEM）为：寻找 $u_h \\in V_h$![image](img/F000046si444.png) 和 $p_h\
  \ \\in W_h$![image](img/F000046si445.png)，使得：\n\n```latex\n\\begin{matrix} (\\mathbf{K}^{-1}u_h,v)\
  \ - (\\nabla \\cdot v,p_h) &= 0,\\forall v \\in V_h \\\\ (\\nabla \\cdot u_h,w)\
  \ &= (f,w),\\forall w \\in W_h. \\end{matrix}\n```\n(4.100)\n\n![image](img/F000046si446.png)(4.100)\n\
  \ninf-sup 条件为：\n\n*   存在 $C_1 > 0$![image](img/F000046si447.png)，使得：\n    ```latex\n\
  \    \\sup_{0 \\neq \\mathbf{v} \\in \\mathbf{V}}\\frac{|(\\nabla \\cdot \\mathbf{v},w)|}{\\\
  |\\mathbf{v}\\|_{\\mathbf{V}}} \\geq C_{1}\\|w\\|_{W},\\forall w \\in W.\n    ```\n\
  \    (4.101)\n\n![image](img/F000046si448.png)(4.101)\n\n*   存在 $C_2 > 0$![image](img/F000046si450.png)，一个与\
  \ $h$ 无的常数，使得：\n    ```latex\n    \\sup_{0 \\neq \\mathbf{v} \\in \\mathbf{V}_{h}}\\\
  frac{|(\\nabla \\cdot \\mathbf{v},w)|}{\\|\\mathbf{v}\\|_{\\mathbf{V}}} \\geq C_{2}\\\
  |w\\|_{W},\\forall w \\in W_{h}.\n    ```\n    (4.102)–可以重写为：\n    ```latex\n  \
  \  \\inf_{0 \\neq w \\in W_{h}}\\sup_{0 \\neq \\mathbf{v} \\in \\mathbf{V}_{h}}\\\
  frac{|(\\nabla \\cdot \\mathbf{v},w)|}{\\|\\mathbf{v}\\|_{\\mathbf{V}}} \\geq C_{2}\
  \ > 0.\n    ```\n    (4.103)\n\n![image](img/F000046si452.png)(4.103)\n\n我们现在考虑\
  \ $\\Omega$![image](img/F000046si453.png) 为矩形区域且 $\\mathcal{Q}_h$![image](img/F000046si454.png)\
  \ 是 $\\Omega$![image](img/F000046si455.png) 的矩形划分，使得矩形的水平和垂直边分别平行于 $x_1$![image](img/F000046si456.png)\
  \ 和 $x_2$![image](img/F000046si457.png)-坐标轴，且相邻单元共享公共边。定义：\n\n```latex\nQ_{l,r}(K)\
  \ = \\{v:v(\\mathbf{x}) = \\sum_{i=0}^{l}\\sum_{j=0}^{r}v_{ij}x_{1}^{i}x_{2}^{j},\\\
  mathbf{x} = (x_{1},x_{2}) \\in K,v_{ij} \\in \\mathbb{R}\\}.\n```\n(4.104)\n\n![image](img/F000046si458.png)(4.104)\n\
  \n这是在 $x_1$ 上次数最高为 $l$![image](img/F000046si459.png) 在 $x_2$ 上次数最高为 $r$![image](img/F000046si461.png)\
  \ 的多项式空间，其中 $l$![image](img/F000046si463.png), $r \\ge 0$![image](img/F000046si464.png)\n\
  \n这些空间是三角形 RT 空间到矩形的扩展，对于每个 $r \\ge 0$![image](img/F000046si465.png)，定义为：\n\n```latex\n\
  V_h(K) = Qr+1, r \\times Qr, r+1,\n```\n(4.105)\n\n![image](img/F000046si466.png)(4.105)\n\
  \n```latex\nW_h(K) = Qr, r.\n```\n(4.106)\n\n![image](img/F000046si467.png)(4.106)\n\
  \n在 $r=0$![image](img/F000046si468.png) 的情况下，$V_h(K)$![image](img/F000046si469.png)\
  \ 采用形式：\n\n```latex\nV_h(K) = {v:v=(a[1]+a[2]x[1],a[3]+a[4]x[2]),a[i] \\in \\mathbb{R},\
  \ i=1, 2, 3, 4}.\n```\n(4.107)\n\n![image](img/F000046si470.png)(4.107)\n\n混合有限元方法可以重写为矩阵形式：\n\
  \n```latex\n\\begin{bmatrix} \\mathbf{A} & \\mathbf{B} \\\\ \\mathbf{B}^{T} & 0\
  \ \\\\ \\end{bmatrix}\\begin{pmatrix} \\mathbf{u} \\\\ \\mathbf{p} \\\\ \\end{pmatrix}\
  \ = \\begin{pmatrix} 0 \\\\ {- \\mathbf{f}} \\\\ \\end{pmatrix}.\n```\n(4.108)\n\
  \n\n\n\n\n系数矩阵 $\\begin{bmatrix} \\mathbf{A} & \\mathbf{B} \\\\ \\mathbf{B}^{T}\
  \ & 0 \\\\ \\end{bmatrix}$![image](img/F000046si472.png) 在 inf–sup 条件下是非奇异的，但它不是正定的。这限制了许多迭代算法在所得代数方程中的应用。使用梯形求积分法则时，1D\
  \ 问题中的系数变为：\n\n$\\begin{matrix} a\\_{ii} & {= (\\mathbf{K}^{- 1}\\varphi\\_{i},\\\
  \\varphi\\_{i}) \\approx {(\\mathbf{K}^{- 1}\\varphi\\_{i},\\\\varphi\\_{i})}\\\
  _{Q}} \\\\ & {= \\frac{\\\\left| E\\_{i - 0.5} \\middle| K\\_{i - 0.5} \\right.}{2}\
  \ + \\frac{\\\\left| E\\_{i + 0.5} \\middle| K\\_{i + 0.5} \\right.}{2}} \\\\ &\
  \ {= \\frac{h\\_{i - 0.5}K\\_{i - 0.5}}{2} + \\frac{h\\_{i + 0.5}K\\_{i + 0.5}}{2},}\
  \ \\\\ a\\_{i,i - 1} & {= (\\mathbf{K}^{- 1}\\varphi\\_{i - 1},\\\\varphi\\_{i})\
  \ \\approx {(\\mathbf{K}^{- 1}\\varphi\\_{i - 1},\\\\varphi\\_{i})}\\_{Q} = 0} \\\
  \\ a\\_{i,i + 1} & {= (\\mathbf{K}^{- 1}\\varphi\\_{i + 1},\\\\varphi\\_{i}) \\\
  approx {(\\mathbf{K}^{- 1}\\varphi\\_{i + 1},\\\\varphi\\_{i})}\\_{Q} = 0.} \\\\\
  \ \\end{matrix}$ (4.109)\n\n![image](img/F000046si473.png)(4.109) \n\n因此，惊讶的是，矩阵\
  \ `A`![image](img/F000046si474.png) 在梯形求积分法则下变成了对角矩阵。\n\n我们回顾 `b`[`i``j`] = − (∇⋅`φ`[`i`],`ψ`[`j` − \
  \ 0.5]), `i` = 1, …, `m` − 1, `j` = 1, …, `m`.*![image](img/F000046si475.png) 它可以通过以下方式精确计算：\n\
  \n$\\begin{matrix} b\\_{ii} & \\\\left. = - {(\\\\nabla \\\\cdot \\\\varphi\\_{i},\\\
  \\psi\\_{i - 0.5})}\\_{E\\_{i - 0.5}} = - \\\\middle| E\\_{i - 0.5} \\\\middle|\
  \ \\\\frac{1}{h\\_{i - 0.5}} = - 1, \\\\right. \\\\ b\\_{i,i + 1} & \\\\left. =\
  \ - {(\\\\nabla \\\\cdot \\\\varphi\\_{i + 1},\\\\psi\\_{i - 0.5})}\\_{E\\_{i +\
  \ 0.5}} = - \\\\middle| E\\_{i - 0.5} \\\\middle| \\\\frac{- 1}{h\\_{i + 0.5}} =\
  \ 1, \\\\right. \\\\ \\\\\\\\end{matrix}$ (4.110)\n\n![image](img/F000046si476.png)(4.110)\
  \ \n\n在 MFEM 中，离散达西律写为：\n\n$\\sum\\\\limits_{j = 1}^{m - 1}{a\\_{it{ij}}}u\\_{j}}\
  \ + \\sum\\\\limits_{j = 1}^{m}{b\\_{it{ij}}}p\\_{j}} = 0, i = 1,2\\\\ldots,m$ (4.111)\n\
  \n![image](img/F000046si477.png)(4.111) \n\n对于我们得到的系数，当 `i` = 1, 2,… `m` − 1![image](img/F000046si478.png)\
  \ 时，离散达西律变为：\n\n$\\frac{h\\_{i - 0.5}K\\_{i - 0.5} + h\\_{i + 0.5}K\\_{i + 0.5}}{2}u\\\
  _{i} + \\left( - 1 \\right)p\\_{i} + p\\_{i + 1} = 0,$ (4.112)\n\n![image](img/F000046si479.png)(4.112)\
  \ \n\n这是中心差分 (CCFD) 计算达西速度 `u`[`i`]=`K``i`−`p[`i` − 0.5]`(`FD*)))/x[`i` +0.5]`−`x` − 0.5))`![image](img/F000046si480.png)，其中\
  \ `K`[`i`] 由加权调和平均定义，且 `p`[`i`]=`p[`i` − 0.5]`(`FD*)![image](img/F000046si482.png)。\n\
  \n在 MFEM 中，离散守恒律为：\n\n$\\sum\\\\limits_{j = 1}^{m - 1}{b\\_{it{ji}}}u\\_{j}} = -\
  \ f\\_{i}, i = 1,2\\\\ldots,m$ (4.113)\n\n![image](img/F000046si483.png)(4.113)\
  \ \n\n如果使用中点法则，则 `f`[`i`]=(`f`,`ψ`[`i`])≈(`f`,`ψ`[`i`])[`MD*]=`h[`i` − 0.5]`f[`i` − 0.5]`(`FD*)![image](img/F000046si484.png)。对于我们得到的系数，当\
  \ `i` = 2,… `m` − 1![image](img/F000046si485.png) 时，离散守恒律变为：\n\n`b`[`i` − 1,`i`]u[`i` − 1]` + `b`[`i`,`i`]u[`i`] = `u[`i` − 1]-u[`i`]=−(`f`,`ψ`[`i`])≈(`h[`i` − 0.5]`f[`i` − 0.5]`(`FD*)`\
  \ (4.114)\n\n![image](img/F000046si486.png)(4.114) \n\n这是 CCFD 写法表示守恒律的方式 (`u`[`i` − u[`i` − 1]`![image](img/F000046si487.png))/x[`i` − 1]`![image](img/F000046si488.png))=f`[`i` − 0.5]`(`FD*)))\n\
  \n### 4.2.4 混合混合有限元方法与有限差分方法的等效性\n\n混合方法的混合形式为：寻找 (`u`[`h`],`p`[`h`],`lambda`[`h`])![image](img/F000046si490.png)\
  \ $\\in \\widetilde{\\mathbf{V}}_{h} \\times W_{h} \\times L_{h}$![image](img/F000046si491.png)\
  \ 使得：\n\n$\\begin{matrix} {\\left( \\mathbf{u}_{h},\\\\mathbf{v} \\right) - \\sum\\\
  \\limits_{K \\\\in \\\\mathcal{K}_{h}}\\\\left( \\nabla \\\\cdot \\\\mathbf{v},p_{h}\
  \ \\right) - \\mathbf{v} \\cdot \\nu_{K},\\\\lambda_{h}_{\\partial K \\\\setminus\
  \ \\\\Gamma} \\right) = 0,\\\\quadforall v \\\\in \\\\widetilde{\\mathbf{V}}_{h}},\
  \ {\\sum\\\\limits_{K \\\\in \\\\mathcal{K}_{h}}\\\\left( \\nabla \\\\cdot \\\\\
  mathbf{u}_{h},w \\\\right) = \\\\left( {f,w} \\\\right),\\\\forall w \\\\in W_{h}},\
  \ {\\sum\\\\limits_{K \\\\in \\\\mathcal{K}_{h}}\\\\left\\\\langle \\\\mathbf{u}_{h}\
  \ \\\\cdot \\\\nu_{K},\\\\mu \\\\right\\\\rangle_{\\partial K \\\\setminus \\\\\
  Gamma} = 0,\\\\quad\\\\forall\\\\mu \\\\in L_{h}}, \\\\end{matrix}$ (4.115)\n\n\
  ![image](img/F000046si492.png)(4.115) \n\n其中 `nu`[`K`]![image](img/F000046si493.png)\
  \ 表示 `K` 的外单位法向量![image](img/F000046si494.png)。\n\n使用第 4.2.3 节的类似步骤，很容易证明 MEFM 的混合形式等于以下有限差分方法：\n\
  \n$\\begin{matrix} u_{i}^{+} = - K_{i + 0.5}\\frac{p_{i + 0.5} - p_{i}}{x_{i + 0.5}\
  \ - x_{i}}, \\\\ u_{i}^{-} = - K_{i - 0.5}\\frac{p_{i} - p_{i - 0.5}}{x_{i} - x_{i\
  \ - 0.5}}, \\\\ f_{i - 0.5} = \\frac{u_{i}^{-} - u_{i - 1}^{+}}{x_{i} - x_{i - 1}},\
  \ \\\\ u_{i}^{+} = u_{i}^{-}. \\\\end{matrix}$ (4.116)\n\n![image](img/F000046si495.png)(4.116)\
  \ \n\n应该注意到，尽管在离散达西律中使用单侧 FD，但该系统可以通过消除节点（2D 或 3D 中的面）处的压力简化为 CCFD。\n\n## 4.3 改进\
  \ IMPES 方案\n\nIM（隐式压力，显式饱和度）方法最初开发于：\n\n### 4.3.1 经典 IMPES 方案\n\n两个主未知（非润水相压力 `p`[`n`]![image](img/F000046si496.png)\
  \ 和润水相饱和度 `S`[`w`]![image](img/F000046si497.png)）的两个方程（压力方程和饱和度方程）可以写为：\n\n压力方程：\n\
  \n$-\\nabla \\cdot (k\\lambda`t`\\nabla p[`n`]) = RHSS`pres`, (4.117)\n\n![image](img/F000046si498.png)(4.117)\
  \ \n\n饱和度方程：\n\n$\\phi\\frac{\\partial S_{w}}{\\partial t} = RHSS_{sat}(p_{n},S_{w})$\
  \ (4.118)\n\n![image](img/F000046si499.png)(4.118) \n\n其中\n\n`RHS``pres` = `q``t`\
  \ - $\\nabla \\cdot (k`t`u`t` + `lambda``w`(\\rho[`w`]-\\rho[`n`])(g). (4.119)\n\
  \n$\\begin{matrix} \\{RHS_{sat}(p_{n},S_{w}) = q_{w}(p_{n},S_{w}) - \\nabla \\cdot\
  \ (k_{w}(S_{w})u_{t}(p_{n},S_{w})) \\\\ - \\lambda_{w}(S_{w})\\left(\\frac{dp_{c}}{dS_{w}}\
  \ + (\\rho_{w} - \\rho_{n})g\\right)\\} \\end{matrix}$ (4.120)\n\n令 $J=(0,T)$![image](img/F000046si500.png)\
  \ 为时间间隔，对于 $N \\in \\mathbb{N}$![image](img/F000046si503.png)，令 $0=t[0]<t[1]\\dots<t[N]=T$![image](img/F000046si504.png)\
  \ 为 $J$ 的划分![image](img/F000046si505.png)。在压力计算中，在 IMPES 方法中，饱和度 `S``w` 被认为是已知的，并隐式求解压力方程得到\
  \ `p`[`w`]![image](img/F000046si507.png)。也就是说，对于每个 $n=0,1,\\dots$![image](img/F000046si508.png)，\n\
  \n$-\\nabla \\cdot (k\\lambda`t`\\nabla p[`n`[`t[n+1]`]) = RHSS`pres`. (4.121)\n\
  \n\n\n\n\n![image](img/F000046si509.png)(4.121)\n\n在经典的 IMPES 方法中，即饱和度方程对 `S`[`w`]\
  \ 是显式求解的![image](img/F000046si510.png);也就是说，对于每个 `n` = 0, 1, ...![image](img/F000046si511.png)，\n\
  \n$$\\phi\\frac{S_{w}^{(n + 1)} - S_{w}^{(n)}}{t_{n + 1} - t_{n}} = {RH}S_{sat}\\\
  left( p_{n}^{(n + 1)},S_{w}^{(n)} \\right).$$ (4.122)\n\n![image](img/F000046si512.png)(4.122)\n\
  \n基于半个世纪以来 IMPES 方案的经验，其优势已被全球研究人员认可并广泛接受。IMPES 公式比全隐式方案更易实现。由于压力对饱和度的依赖较弱，且压力随时间的变化缓慢，该方案成功地实现了压力与饱和度的解耦。总速度\
  \ `u`[`t`]![image](img/F000046si513.png) 具有连续的法分量并在标准 IMPES 公式中被保留。该方案对于润相相是局部质量和体积守恒的。如果时间步长小于某个值，该方案会产生非负的润相饱和度。\n\
  \n同时，我们仍然可以发现经典 IMPES 方案的一些缺点：它为了数值稳定性（以及正值性）需要非常小的时间步长。全隐式方案通常允许大得步长。在改进的 IMPES\
  \ 中，建议使用比压力步长小的饱和度时间步长。该方案对于非润相在局部或全局都不是守恒的。因此，该方案对于总流体混合物在局部或全局都不是守恒的。该方案可能会产生大于\
  \ 1 的润相饱和度（不边界守恒）。对于不同的毛管压力函数，它无法产生具有不连续性的正确饱和度解。\n\n### 4.3.2 Hoteit–Firoozabadi\
  \ IMPES 方案\n\n为了处理经典 IMPES 方案的缺点，\n\n在该方案中定义了两个势，其中用于相 `α` 的流动势 `Φ`[`α`]![image](img/F000046si514.png)![image](img/F000046si515.png):\n\
  \n`Φ`[`α`] = `p`[`α`] + `ρ`[`α`]g**z**,`α` = `n`, `w`, (4.123)\n\n![image](img/F000046si516.png)(4.123)\n\
  \n毛管势为两个流动势之差：\n\n`Φ`[`c`] = `Φ`[`n`] - `Φ`[`w`] = `p`[`c`] + (`ρ`[`n`]-`ρ`[`w`])*g**z**.\
  \ (4.124)\n\n![image](img/F000046si517.png)(4.124)\n\n利用这两个流动势，两相的达西定律变为：\n\n`u`[`α`]\
  \ = - `λ``α`**k**∇`Φ`[`α`],`α` = `n`, `w`. (4.125)\n\n![image](img/F000046si518.png)(4.125)\n\
  \n此外，该方案中定义了两个速度，其中当两个流动势都取值 `Φ`[`w`]![image](img/F000046si520.png) 时，“表观”速度 `u`[`α`]![image](img/F000046si519.png)\
  \ 为总达西速度：\n\n**u**[`a`] = - `λ`[`t`]**k**∇`Φ`[`w`], (4.126)\n\n![image](img/F000046si521.png)(4.126)\n\
  \n以及“毛管”速度 **u**[`c`]![image](img/F000046si522.png) 为：\n\n**u**[`c`] = - `λ`[`n`]**k**∇`Φ`[`c`].\
  \ (4.127)\n\n![image](img/F000046si523.png)(4.127)\n\n注意的是，表观速度 **u**[`a`]![image](img/F000046si524.png)\
  \ 与润相速度具有相同的驱动力，但具有比润相迁移率更平滑的迁移率 `λ`[`t`]![image](img/F000046si525.png)，即 `λ`[`t`]=`λ`[`n`]+`λ`[`w]`。显而易见：**u**[`t`]=**u**[`n`]+**u**[`w`]=**u**[`a`]+**u**`c`\n\
  \nH-F IMPES 方案的详细迭代步骤可以总结为三步：\n\n**步骤 1.** 给定 `S``w`，我们找到 **u**[`c`]∈ **V**`h`，使得\
  \ (**u**[`c`,`v`))=`λ`[`n`]**k**∇`Φ``c`) 对于所有 `v`∈ **V**`h`![image](img/F000046si530.png)(4.128)\n\
  \n**步骤 2.** 给定 `S``w` 和 **u**`c`，我们求解 **u**`a` 和 `Φ``w`:\n\n∇·**u**[`a`]()=`q`[`t`]-∇·**u**[`c`],u**`a`**k**∇`Φ`[`w`],\
  \ (4.129)![image](img/F000046si535.png)(4.129)\n\n**步骤 3.** 给定 **u**`a`，`Φ``w` 和当前的\
  \ `S``w`，我们在下一个时间步求解 `S``w`:\n\n$$\\phi\\frac{\\partial S_{w}}{\\partial t} + \\\
  nabla \\cdot \\left( f_{w}\\left( S_{w} \\right)\\mathbf{u}_{a} \\right) = q_{w}\\\
  left( S_{w},\\Phi_{w} \\right).$$ (4.130)\n\n![image](img/F000046si540.png)(4.130)\n\
  \nH-F IMPES 方案的优点具有以下几点：(1) 对于不同的毛管压力函数，它能产生预期不连续性的饱和度解；(2) 它定义的表观速度 **u**`a` 与润相速度具有相同的驱动力，但具有比润相迁移率更平滑的迁移率\
  \ `λ``t`；(3) 与标准 IMPES 一样，H-F IMPES 公式比全隐式方案更易实现；(4) 与标准 IMPES 一样，H-F IMPES 公式成功地分离了流动势与饱和度的耦合；(5)\
  \ 与标准 IMPES 一样，H-F IMPES 的总速度 `u``t` 位于 *H(*div*)(![image](img/F000046si544.png)\
  \ 空间；(6) 与标准 IMPES 一样，该方案对于润相是局部体积守恒的。\n\n同时，多年应用也发现了一些缺点，可以总结为：(1) 它仍然需要较小的时间步来保证数值稳定性（以及正值性）；(2)\
  \ 我们假设“毛管”速度 **u**`c` = - `λ`[`n`]**k**∇`Φ``c` 具有连续的法分量（即我们假设它位于 *H(*div*)(![image](img/F000046si547.png)\
  \ 空间），这可能不是的！(3) 与标准 IMPES 一样，该方案对于非润相在局部或全局都不是守恒的；(4) 与标准 IMPES 一样，该方案可能会产生大于 1\
  \ 的润相饱和度。\n\n### 4.3.3 可压缩 IMPES 方案\n\n对于多孔介质中的可压缩不相两相流（等温），控制方程可以写为：\n\n质量守恒：\n\
  \n$$\\frac{\\partial\\phi\\rho_{\\alpha}S_{\\alpha}}{\\partial t} + \\nabla \\cdot\
  \ \\left( \\rho_{\\alpha}\\mathbf{u}_{\\alpha} \\right) = q_{\\alpha},\\alpha =\
  \ n,w.$$ (4.131)\n\n扩展的达西定律：\n\n$$\\mathbf{u}_{\\alpha} = - \\frac{k_{r\\alpha}\\\
  left( S_{w} \\right)}{\\mu_{\\alpha}}\\mathbf{k}\\left( \\nabla p_{\\alpha} - \\\
  rho_{\\alpha}\\mathbf{g} \\rightright),\\alpha = n,w.$$ (4.132)\n\n![image](img/F000046si548.png)(4.132)\n\
  \n毛管压力：\n\n`p`[`n`] - `p`[`w`] = `p``c`. (4.133)\n\n![image](img/F000046si549.png)(4.133)\n\
  \n状态方程：\n\n`p`[`w`] = `p``w`, `p`[`n`] = `p``n`, (4.134)\n\n![image](img/F000046si550.png)(4.135)\n\
  \n加上适当的边界条件 (BC) 和初始条件 (IC)。\n\n我们定义各相的流体压缩性：\n\n\n\n\n\n$c_{f,w} = - \\frac{1}{V_{w}}\\\
  left( \\frac{\\partial V_{w}}{\\partial p_{w}} \\right)_{T} = \\frac{1}{\\rho_{w}}\\\
  left( \\frac{\\partial\\rho_{w}}{\\partial p_{w}} \\right)_{T},$ (4.136)\n\n![image](img/F000046si552.png)(4.136)\
  \ \n\n$c_{f,n} = - \\frac{1}{V_{n}}\\left( \\frac{\\partial V_{n}}{\\partial p_{n}}\
  \ \\right)_{T} = \\frac{1}{\\rho_{n}}\\left( \\frac{\\partial\\rho_{n}}{\\partial\
  \ p_{n}} \\right)_{T}.$ (4.137)\n\n![image](img/F000046si553.png)(4.137) \n\n同样地，我们可以得到岩石压缩性的定义\
  \ `c[R] = (1/\\phi)(\\partial\\phi/\\partial p)[T]$![image](img/F000046si554.png)\
  \ 其中压力可以选择为任相的压力。忽略毛细压力，我们定义流体混合物的压缩性为：\n\n$c_{f} = - \\frac{1}{V_{f}}\\left( \\\
  frac{\\partial V_{f}}{\\partial p} \\right)_{T}.$ (4.138)\n\n![image](img/F000046si555.png)(4.138)\
  \ \n\n快速推导可以发现：\n\n$c_{f} = - \\frac{1}{V_{w} + V_{n}}\\left( \\frac{\\partial V_{w}\
  \ + V_{n}}{\\partial p} \\right)_{T} = - \\frac{V_{w}}{V_{w} + V_{n}}\\frac{\\left(\
  \ \\partial V_{w}/\\partial p \\right)_{T}}{V_{w}} - \\frac{V_{n}}{V_{w} + V_{n}}\\\
  frac{\\left( \\partial V_{n}/\\partial p \\right)_{T}}{V_{n}} = c_{f,w}S_{w} + c_{f,n}S_{n}.$\
  \ (4.139)\n\n![image](img/F000046si556.png)(4.139) \n\nIMPES 方案所需的压力方程可以写为：\n\n\
  $\\phi c_{tot}\\frac{\\partial p}{\\partial t} + \\sum_{\\alpha = n,w}\\frac{1}{\\\
  rho_{\\alpha}}\\nabla \\cdot \\left( \\rho_{\\alpha}\\mathbf{u}_{\\alpha} \\right)\
  \ = q_{tot}.$ (4.140)\n\n![image](img/F000046si557.png)(4.140)\n\n其中 `c[tot] = c[f,w]S[w]\
  \ + c[f,n]S[n] + c[R]`![image](img/F000046si558.png)。\n\n在一般情况下，如果考虑毛细压力，我们有：\n\n\
  ```\n\\begin{matrix} \\frac{\\partial\\phi\\rho_{\\alpha}S_{\\alpha}}{\\partial\
  \ t} & = \\left( \\frac{\\partial\\phi}{\\partial p_{\\alpha}} + \\phi\\frac{\\\
  partial\\rho_{\\alpha}}{\\partial p_{\\alpha}} \\right)\\frac{\\partial p_{\\alpha}}{\\\
  partial t}S_{\\alpha} \\\\ & \\phi\\rho_{\\alpha}\\left( c_{R} + c_{f,\\alpha} \\\
  right)\\frac{\\partial p_{\\alpha}}{\\partial t}S_{\\alpha} \\\\ & q_{m,\\alpha}\
  \ - \\nabla \\cdot \\left( \\rho_{\\alpha}\\mathbf{u}_{\\alpha} \\right). \\end{matrix}\n\
  ```\n(4.141)\n\n![image](img/F000046si559.png)(4.141) \n\n加权求和得到：\n\n$\\phi\\left(\
  \ c_{R} + c_{f,w}S_{w} + c_{f,n}S_{n} \\right)\\frac{\\partial p_{w}}{\\partial\
  \ t} = \\sum_{\\alpha = n,w}q_{\\alpha} - \\phi c_{f,n}S_{n}\\frac{\\partial p_{c}}{\\\
  partial t} - \\sum_{\\alpha = n,w}\\frac{1}{\\rho_{\\alpha}}\\nabla \\cdot \\left(\
  \ \\rho_{\\alpha}\\mathbf{u}_{\\alpha} \\right).$ (4.142)\n\n![image](img/F000046si560.png)(4.142)\
  \ \n\n然后，可以导出：\n\n$\\phi c_{tot}\\frac{\\partial p_{w}}{\\partial t} + \\sum_{\\\
  alpha = n,w}\\frac{1}{\\rho_{\\alpha}}\\nabla \\cdot \\left( \\rho_{\\alpha}\\mathbf{u}_{\\\
  alpha} \\right) = q_{tot},$ (4.143)\n\n![image](img/F000046si561.png)(4.143) \n\n\
  其中 $q_{tot} = \\sum_{\\alpha = n,w}q_{\\alpha} - \\phi c_{f,n}S_{n}\\frac{\\partial\
  \ p_{c}}{\\partial t}$![image](img/F000046si562.png)。\n\n代入达西定律得到：\n\n$\\phi c_{tot}\\\
  frac{\\partial p_{w}}{\\partial t} - \\sum_{\\alpha = n,w}\\frac{1}{\\rho_{\\alpha}}\\\
  nabla \\cdot \\left( \\rho_{\\alpha}\\lambda_{\\alpha}\\mathbf{k}\\left( \\nabla\
  \ p_{\\alpha} - \\rho_{\\alpha}\\mathbf{g} \\right) \\right) = q_{tot}.$ (4.144)\n\
  \n![image](img/F000046si563.png)(4.144) \n\n重排项，我们有：\n\n$\\phi c_{tot}\\frac{\\\
  partial p_{w}}{\\partial t} - \\sum_{\\alpha = n,w}\\frac{1}{\\rho_{\\alpha}}\\\
  nabla \\cdot \\left( \\rho_{\\alpha}\\lambda_{\\alpha}\\mathbf{k}\\nabla p_{w} \\\
  right) = RHS_{S_{pres}}\\left( p_{w},S_{w} \\right),$ (4.145)\n\n![image](img/F000046si564.png)(4.145)\
  \ \n\n其中 $RHS_{S_{pres}} = q_{tot} + \\frac{\\nabla \\cdot (\\rho_{n}\\lambda_{n}\\\
  mathbf{k}\\nabla p_{c})}{\\rho_{n}} - \\sum_{\\alpha = n,w}\\frac{1}{\\rho_{\\alpha}}\\\
  nabla \\cdot \\left( \\rho_{\\alpha}\\mathbf{g} \\right).$ (4.146)\n\n![image](img/F000046si565.png)\
  \ \n\n\n\n为了得到饱和度方程，我们首先定义总速度为：\n\n$u_t = k(\\nabla p_{w} + \\nabla p_{c}) \\right),$\
  \ (4.147)\n\n![image](img/F000046si566.png)\n\n每个相的达西速度可以写为：\n\n$u_n = f_n u_t +\
  \ k\\lambda_n\\mathbf{g},$ (4.148)\n\n![image](img/F000046si567.png)\n\n$u_w = f_w\
  \ u_t + k\\lambda_w\\mathbf{g}.$ (4.149)\n\n![image](img/F000046si568.png) \n\n\
  对于相 $\\alpha$，体积守恒可以写为：\n\n$\\frac{\\partial\\phi\\rho_{\\alpha}S_{\\alpha}}{\\\
  partial t} + \\nabla \\cdot (\\rho_{\\alpha}\\mathbf{u}_{\\alpha}) = q_{\\alpha}.$\
  \ (4.150)\n\n![image](img/F000046si570)\n\n对于湿相（水相），将以下方程 $u_w = f_w u_t + k\\lambda_w\\\
  mathbf{g}$ 代入湿相守恒方程中，得到饱和度方程：\n\n$\\frac{\\partial\\phi\\rho_{w}S_{w}}{\\partial\
  \ t} + \\nabla \\cdot (\\rho_{w}u_t) + \\nabla \\cdot (\\rho_{w}k\\lambda_n(\\nabla\
  \ p_c + (\\rho_w-\\rho_n)\\mathbf{g})) = q_{w}.$ (4.151)\n\n![image](img/F000046si572.png)\
  \ \n\n注意 $\\nabla p_c = \\frac{dp_c}{dS_w}\\nabla S_w$![image](img/F000046si573.png)\
  \ 饱和度方程现在变为：\n\n$\\frac{\\partial\\phi\\rho_{w}S_{w}}{\\partial t} = RHS_{S_{sat}}(p_{w},S_{w}),$\
  \ (4.152)\n\n![image](img/F000046si574.png) \n\n其中：\n\n```\n\\begin{matrix} RHS_{S_{sat}}(p_{w},S_{w})\
  \ &= q_{w} - \\nabla \\cdot (\\rho_{w}u_t) - \\nabla \\cdot (\\rho_{w}k\\lambda_n(\\\
  nabla p_c + (\\rho_w-\\rho_n)\\mathbf{g})) \\end{matrix}\n```\n(4.153)\n\n![image](img/F000046si575.png)\
  \ \n\n现在，为多孔介质中的压缩两相流推导了压力和饱和度方程，我们提供了 $n=0,1,\\dots$ 的详细 IMPES 迭代公式：![image](img/F000046si576.png)\n\
  \n$\\phi^{(n)}c_{tot}^{(n)}\\frac{p_{w}^{(n + 1)} - p_{w}^{(n)}}{t_{n + 1} - t_{n}}\
  \ - \\sum_{\\alpha = n,w}\\frac{1}{\\rho_{\\alpha}^{(n)}}\\nabla \\cdot \\left(\
  \ \\rho_{\\alpha}^{(n)}\\lambda_{\\alpha}^{(n)}\\mathbf{k}\\nabla p_{w}^{(n + 1)}\
  \ \\right) = RHS_{S_{pres}}\\left( p_{w}^{(n + 1)},S_{w}^{(n)} \\right),$ (4.154)\n\
  \n![image](img/F000046si577.png)(4.154) \n\n$\\frac{\\phi^{(n + 1)}\\rho_{w}^{(n\
  \ + 1)}S_{w}^{(n + 1)} - \\phi^{(n)}\\rho_{w}^{(n)}S_{w}^{(n)}}{t_{n + 1} - t_{n}}\
  \ = RHS_{S_{sat}}\\left( p_{w}^{(n + 1)},S_{w}^{(n)} \\right).$ (4.155)\n\n\n\n\n\
  上述基于 IMPES 的方法在饱和度空间连续的情况下是非常成功的。近年来，毛细压力的非均匀性受到了更多的关注，因为它可能对流路径产生显著影响。在渗透率不同的非均匀介质中，毛细压力是连续的，但不同渗透介质的毛细压力函数可能表现出差异。不同渗透类型的岩石中采用了不同的毛细压力函数。这导致了岩石界面处毛细压力函数的不连续。在这种情况下，毛细压力的连续导致了饱和度的不连续。由于跨岩石界面的饱和度不连续，需要空间维度饱和度梯度的方法无法适用于多种岩石毛细压力函数的情况。大多数类\
  \ IMPES 方法的主要缺点是由于毛细压力显式处理导致的不稳定性。在高度非均匀介质中，毛细压力可能在极时间内改变两相的饱和度分布，因此为了稳定性，IMPES\
  \ 需要小得多的步长。为了提高 IMPES 的稳定性，必须对毛细压力进行隐式处理。\n\n## 毛细压力的新处理\n\n提出了一种处理毛细压力的方法。\n\n\
  对两个质量守恒方程分别采用隐式时间离散方案，其中变量 `λ[t]`![image](img/F000046si579.png), `λ[n]`![image](img/F000046si580.png),\
  \ `λ[w]`![image](img/F000046si581.png) 根据上一个时间步的润相饱和度计算，如下：\n\n$$\\phi\\frac{S\\\
  _{\\alpha}^{i + 1} - S\\_{\\alpha}^{i}}{\\Delta t^{i}} - \\nabla\\cdot\\lambda\\\
  _{\\alpha}\\left( S\\_{w}^{i} \\right)\\mathbf{K}\\nabla\\left( \\left( 1 - \\omega\
  \ \\right)\\Phi\\_{\\alpha}^{i} + \\omega\\Phi\\_{\\alpha}^{i + 1} \\right) = q\\\
  _{\\alpha}^{i + 1},\\alpha = w,n,$$ (4.156)\n\n![image](img/F000046si582.png)(4.156)\n\
  \n其中 `ω`![image](img/F000046si583.png) 是正实。代入两个质量守恒方程并考虑饱和度约束和毛细压力，我们得到总质量守恒方程：\n\
  \n − ∇ ⋅ `λ[t]`(`S[w]`(`i`))**K**∇((1−`ω`)*`Φ[w]`(`i`)+`ω**`Φ[w]`(`i` + 1)) − ∇ ⋅ `λ[n]`(`S[w]`(`i`))**K**∇((1−`ω`)*`Φ[c]`(`i`)+`ω**`Φ[c]`(`i` + 1)) =`q[w]`(`i` + 1)+q[n]`(`i` + 1).\
  \ (4.157)\n\n![image](img/F000046si584.png)(4.157)\n\n通常很难提供润相的精确初始压力。因此，我们对 `Φ[w]`![image](img/F000046si585.png)\
  \ 采用后向欧拉方案：\n\n − ∇ ⋅ `λ[t]`(`S[w]`(`i`))**K**∇`Φ[w]`(`i` + 1) − ∇ ⋅ `λ[n]`(`S[w]`(`i`))**K**∇((1−`ω`)*`Φ[c]`(`i`)+`ω**`Φ[c]`(`i` + 1)) =`q[w]`(`i` + 1)`q[n]`(`i` + 1).\
  \ (4.158)\n\n![image](img/F000046si586.png)(4.158)\n\n应用 CCFD 方案得到总质量守恒方程的离散形式：\n\
  \n`A[a]`(`S[w]`(`i`))`Φ[w]`(`i` + 1))`A[c]`(`S[w]`(`i`))((1−`ω`)*`Φ[c]`(`i`))`ω**`Φ[c]`(`i` + 1))`=`Q[ac]`(`i` + 1).\
  \ (4.159)\n\n![image](img/F000046si587.png)(4.159)\n\n显然，当 `ω`= 0![image](img/F000046si588.png)\
  \ 时，它是 IMPES 方程。在我们的方法中，`ω`>0![image](img/F000046si589.png)。在这里，`S[w]`(`i` + 1)\
  \ 是未知的，因此无法直接求解 `Φ[w]`(`i` + 1)![image](img/F000046si591.png)。为了克服这一困难，我们对饱和度方程引入半后向欧拉离散：\n\
  \n$$\\phi\\frac{S_{w}^{i + 1} - S_{w}^{i}}{\\Delta t^{i}} - \\nabla\\cdot\\lambda_{w}\\\
  left( S_{w}^{i} \\right)\\mathbf{K}\\nabla\\Phi_{w}^{i + 1} = q_{w}^{i + 1},$ (4.160)\n\
  \n![image](img/F000046si592.png)(4.160)\n\n其可以通过 CCFD 方法近似为：\n\n$$\\mathbf{M}\\\
  frac{\\mathbf{S}_{w}^{i + 1} - \\mathbf{S}_{w}^{i}}{\\Delta t^{i}} + \\mathbf{A}_{w}\\\
  left( \\mathbf{S}_{w}^{i} \\right)\\Phi_{w}^{i + 1} = \\mathbf{Q}_{w}^{i + 1}.$$\
  \ (4.161)\n\n![image](img/F000046si593.png)(4.161)\n\n注意这种形式的饱和度方程将耦合到压力方程中，而不是用于更新润相饱和度。`S[w]`(`i`)![image](img/F000046si594.png)\
  \ 处的毛细压力 `Φ[c]`(`i` + 1)![image](img/F000046si595.png) 在 `S[w]`(`i`)![image](img/F000046si595.png)\
  \ 处近似为：\n\n$$\\Phic) \\simeq \\Phic) + \\Phi[c]'(`S[w]`(`i`))(`S[w]`(`i` + 1)``S[w]`(`i`)),\
  \ (4.162)\n\n![image](img/F000046si596.png)(4.162)\n\n其中 `Φ[c]'(`S[w]`(`i`))` =\
  \ `dΦ[c]/dS[w]`(`i`))` 对于 `k`=1, 2, ...,서 `N[c]`![image](img/F000046si598.png) 是单元总数。\n\
  \n## 耦合压力方程\n\n根据之前的推导，可以得到耦合压力方程：\n\n`A[t]`(`S[w]`(`i`))`Φ[w]`(`i` + 1))`Q[t]`(`S[w]`(`i`)),\
  \ (4.163)\n\n![image](img/F000046si599.png)(4.163)\n\n其中\n\n`A[t]`(`S[w]`(`i`))`=`A[a]`(`S[w]`(`i`))`−`ω`$\\\
  Delta t$(`i`)`A[c]`(`S[w]`(`i`))`Φ[c]'(`S[w]`(`i`))`M`^{-1}$`A[a]`(`S[w]`(`i`)),\
  \ (4.164)\n\n![image](img/F000046si600.png)(4.164)\n\n`Q[t]`(`S[w]`(`i`))`=`Q[ac]`(`i` + 1))`A[c]`(`S[w]`(`i`))`Φ[c]'(`S[w]`(`i`))`−`ω`$\\\
  Delta t$(`i`)`A[c]`(`S[w]`(`i`))`M`^{-1}$`Q[w]`(`i` + 1). (4.165)\n\n![image](img/F000046si1.png)(4.165)\n\
  \n我们隐式求解该线性方程以获得压力 `Φ[w]`(`i` + 1)![image](img/F000046si602.png)，然后通过达西定律计算速度 `u[a]`(`i` + 1)![image](img/F000046si603.png)。注意\
  \ `M`![image](img/F000046si604.png) 是对角矩阵，因此其逆并不贵。\n\n在新方法中，我们对毛细作用采用隐式方案，然后使用毛细压力函数的近似将隐式饱和度耦合到压力方程中。在上述过程中，压力方程的两个项——润压力和毛细压力都通过无条件稳定的隐式方案处理，而\
  \ IMPES 只对润压力使用隐式公式。结果是该算法比传统的 IMPES 方法更稳定。正参数 `ω`![image](img/F000046si605.png)，本文称为松弛因子，对我们方法的的影响。现在我们讨论稳定性所需的松弛因子。在后续分析中，忽略了饱和度误差对矩阵\
  \ `A[w]`![image](img/F000046si606.png), `A[c]`![image](img/F000046si607.png) 和 `A[a]`![image](img/F000046si608.png)\
  \ 的影响，并专注于毛细压力。关系如下：\n\n`S[w]`(`i` + 1)`=`S[w]`(`i`)+$\\Delta t$(`i`)`M`^{-1}$`Q[w]`(`i` + 1)−$\\\
  Delta t$(`i`)`M`^{-1}$`A[w]``A[a]`^{−1}\\[`Q[ac]`(`i` + 1)−`A[c]`(`Φ[c]`(`S[w]`(`i`))``ω``Φ[c]'(`S[w]`(`i`))(`S[w]`(`i` + 1)`−`S[w]`(`i`))`)\\\
  ]. (4.166)\n\n![image](img/F000046si609.png)(4.166)\n\n\n\n\n我们现在考虑数值误差从时间步 `i`![image](img/F000046si610.png)\
  \ 到时间步 (`i + 1`![image](img/F000046si611.png)) 的传播。我们将第 `i`![image](img/F000046si612.png)\
  \ 步饱和度表示为 `S`[`w]`(`i`)`![image](img/F000046si613.png)，扰动后的饱和度为 ${\\widetilde{\\\
  mathbf{S}}}\\_{w}^{i} = \\mathbf{S}\\_{w}^{i} + \\delta\\mathbf{S}\\_{w}^{i}$![image](img/F000046si614.png)。很容易得到以下关系：\n\
  \n$$\n\\begin{array}{l} {\\\\delta\\mathbf{S}\\_{w}^{i + 1} = \\\\delta\\mathbf{S}\\\
  _{w}^{i} + \\Delta t^{i}\\\\mathbf{H}\\\\left\\\\lbrack {\\\\Phi\\_{c}\\\\left(\
  \ {\\\\widetilde{\\mathbf{S}}}\\_{w}^{i} \\\\right) - \\\\Phi\\_{c}\\\\left( \\\\\
  mathbf{S}\\_{w}^{i} \\\\right) + \\\\omega\\\\Phi\\_{c}^{'}\\\\left( {\\\\widetilde{\\\
  mathbf{S}}}\\_{w}^{i} \\\\right)\\\\left( {{\\\\\\widetilde{\\mathbf{S}}}\\_{w}^{i\
  \ + 1} - {\\\\widetilde{\\mathbf{S}}}\\_{w}^{i}} \\\\right)} \\\\right.} \\\\\\\\\
  \ \\\\left. {- \\\\omega\\\\Phi\\_{c}^{'}\\\\left( \\\\mathbf{S}\\_{w}^{i} \\\\\
  right)\\\\left( {\\\\mathbf{S}\\_{w}^{i + 1} - \\mathbf{S}\\_{w}^{i}} \\\\right)}\
  \ \\\\right\\\\rbrack \\\\\\\\ {\\\\simeq \\\\delta\\mathbf{S}\\_{w}^{i} + \\Delta\
  \ t^{i}\\\\mathbf{H}\\\\left\\\\lbrack {\\\\Phi\\_{c}\\\\left( {\\\\widetilde{\\\
  mathbf{S}}}\\_{w}^{i} \\\\right) - \\\\Phi\\_{c}\\\\left( \\\\mathbf{S}\\_{w}^{i}\
  \ \\\\right) + \\\\omega\\\\Phi\\_{c}^{'}\\\\left( {\\\\widetilde{\\mathbf{S}}}\\\
  _{w}^{i} \\\\right)\\\\left( {\\\\delta\\\\mathbf{S}\\_{w}^{i + 1} - \\\\delta\\\
  \\mathbf{S}\\_{w}^{i}} \\\\right)} \\\\right\\\\rbrack,} \\\\\\\\ \\\\end{array}\n\
  $$\n(4.167)\n\n![image](img/F000046si615.png)(4.167)\n\n其中 `H` = `M`^( − 1)`A`[`w`]``A`[`a`]`^( − 1)`A`[`c`]`![image](img/F000046si616.png)。因此，如果满足以下条件，则所提方案是稳定的：\n\
  \n$$\n\\\\rho\\\\left( {\\\\left( {\\\\mathbf{I} - \\\\omega\\\\Delta t^{i}\\\\\
  mathbf{H}{\\Phi\\\\prime}\\_{c}\\\\left( {\\\\widetilde{\\mathbf{S}}}\\_{w}^{i}\
  \ \\\\right)} \\\\right)^{- 1}\\\\left( {\\\\mathbf{I} + (1 - \\\\omega)\\\\Delta\
  \ t^{i}\\\\mathbf{H}{\\Phi\\\\prime}\\_{c}\\\\left( {\\\\widetilde{\\mathbf{S}}}\\\
  _{w}^{i} \\\\right)} \\\\right)} \\\\right) < 1.\n$$\n(4.168)\n\n![image](img/F000046si617.png)(4.168)\n\
  \n在这里，我们给出一个简单且典型的示例，使用常用的毛细压力函数来展示松弛因子对稳定性的影响：\n\n`p`[`c]`(`S`[`w`]`) =  − `B`[`c]`log (`S`[`w`]`),\
  \ (4.169)\n\n![image](img/F000046si618.png)(4.169)\n\n其中 `B`[`c]`![image](img/F000046si619.png)是一个正参数。假设一个正方形区域被划分为一个单元。根据\
  \ CCFD 的离散化结果，所有矩阵都变成正标量，`H` 也是如此![image](img/F000046si620.png)。稳定条件变为：\n\n$$\n\\\
  \\frac{\\left| {1 - (1 - \\\\omega)\\\\Delta t^{i}\\\\mathbf{H}B\\_{c}/{\\widetilde{S}}\\\
  _{w}^{i}} \\\\right|}{\\left| {1 + \\\\omega\\\\Delta t^{i}\\\\mathbf{H}B\\_{c}/{\\\
  widetilde{S}}\\_{w}^{i}} \\\\right|} < 1.\n$$\n(4.170)\n\n![image](img/F000046si621.png)(4.170)\n\
  \n从等式 (4.170) 中可以得出结论：该方案对于 `ω` ∈0,0.5![image](img/F000046si622.png) 是条件稳定的，对于 `ω`≥0.5![image](img/F000046si623.png)\
  \ 是无条件的。因此，松弛因子应选择为 `ω`≥0.5![image](img/F000046si624.png)，在这种情况下，我们的方案具有无稳定性。\n\n\
  ### 4.3.5 C-S IMPES 方案\n\n经典的 IMPES 方案和 H-IMES 方案只对湿相守恒，因此对流混合物不守恒。此外，两种 IMPES 方案产生的湿相饱和度可能大于\
  \ 1。这促使我们开发用于多孔介质不可压缩不相两流的全质量守恒 IMPES 方案。考虑多孔介质中的不可压缩不相两流：\n\n```\nphi\\frac{\\\
  partial S_{\\alpha}}{\\partial t} + \\nabla \\cdot \\mathbf{u}_{\\alpha} = F_{\\\
  alpha}\n```\n(4.171)\n\n![image](img/F000046si625.png)\n\n```\n\\mathbf{u}_{\\alpha}\
  \ = -\\frac{k_{r\\alpha}}{\\mu_{\\alpha}}\\mathbf{K}\\left( \\nabla p_{\\alpha}\
  \ + \\rho_{\\alpha}g \\right)\n```\n(4.172)\n\n![image](img/F000046si626.png)\n\n\
  ```\nS_{n} + S_{w} = 1\n```\n(4.173)\n\n![image](img/F000046si627.png)\n\n```\n\
  p_{c}(S_{w}) = p_{n} - p_{w}\n```\n(4.174)\n\n![image](img/F000046si628.png)\n\n\
  其中 `ϕ`![image](img/F000046si629.png)是介质的孔隙率，`K`![image](img/F000046si630.png)表示绝对渗透张量，`S`[`α*]`![image](img/F000046si631.png)、`u`[`α*]`![image](img/F000046si632.png)、`p`[`α*]`![image](img/F000046si633.png)、`F`[`α*]`![image](img/F000046si634.png)是各相\
