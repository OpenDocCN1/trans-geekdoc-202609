  \n## 第四章\n\n# 达西尺度油藏模拟的进展\n\n## 摘要\n\n达西尺度油藏模拟为工程应用中涉及的各种过程提供了尺度视角。这种观点极大促进了这一相对直接水平的描述和模拟。石油行业已经提出了多种算法和相应的求解器，用于建模和计算达西尺度上的现象，并利用这些求解器开发了大量软件辅助过程管理和预测。在本章中，我们将首先介绍在达西尺度油藏模拟中广泛接受的有限元法（FEM）符号和模型方程，并展示有限元法与有限差法（FDM）之间的等效性。\n\
