  \n摘要\n\n\n\n\n地质地层中的流动和输运通常在达西尺度下通过连续介质假设进行描述。然而，在许多情况下，达西连续介质假设缺乏从基本原理的严谨推导。为了整合孔隙尺度现象的复杂性，控制方程中引入了许多特有的项和系数，这凸了这一点。最近，大量的研究工作试图弥越尺度之间的差距，并基于孔隙尺度建模来计算这些项。在孔隙尺度上，为了能够模拟，需要克服许多复杂性。例如，涉及具有相变和/或组分分配的多相系统运动的现象尚未得到很好的理解。目前，包括沙特阿美石油（Saudi\
  \ Aramco）和斯伦贝（Schlumberger）在内的许多石油公司正致力于研究地质地层中的孔隙尺度流动和输运。在本章中，我们将从构建控制组分多相流的数学模型开始，确定流混合物的相组分，然后计算其他相关的物理性质。特别是毛细效应，在传统的储层相平衡计算中通常被忽略，但在页岩和致密地层中需要考虑，因为纳米级孔隙会产生巨大的毛细压力和局限效应。将建立基于真实状态方程的新热力学一致扩散界面模型和算法以描述多组分多相流，我们将展示在二氧化碳水注中考虑部分溶性的方法。\n\
