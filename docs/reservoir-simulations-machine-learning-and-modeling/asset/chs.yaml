  \n## 参考文献\n## 延伸阅读\n\n## 5.1 尺度增大技术\n\n### 5.1.1 有限分系统的尺度增大\n\n回想多孔介质流体的质量守恒定律：\n\
  \n$\\frac{\\partial\\left( \\phi\\\\rho \\right)}{\\partial t} + \\nabla \\cdot\
  \ \\left( {\\\\rho\\\\mathbf{u}} \\right) = q\\_{m},$ (5.1)\n\n![image](img/F000058si10.png)(5.1)\n\
  \n其中 `q`[`m`]![image](img/F000058si11.png) 是质量注入速率。对于不可压缩流体，流体密度是常数。对于不可压缩介质中的不可压缩流体，质量守恒意味着体积守恒：\n\
  \n∇ ⋅ `u` = `q`. (5.2)\n\n![image](img/F000058si12.png)(5.2)\n\n将达西定律代入守恒方程得到压力方程：\n\
  \n$\\frac{\\partial\\left( \\phi\\\\rho\\left( p \\right) \\right)}{\\partial t}\
  \ - \\nabla \\cdot \\left( \\rho\\\\mathbf{K}\\\\nabla p \\right) = q\\_{m}.$ (5.3)\n\
  \n![image](img/F000058si13.png)(5.3)\n\n之前的压力方程也可以写成：\n\n$\\phi\\\\rho c\\_{t}\\\
  \\frac{\\partial p}{\\partial t} - \\nabla \\cdot \\left( \\rho\\\\mathbf{K}\\\\\
  nabla p \\right) = q\\_{m}.$ (5.4)\n\n![image](img/F000058si14.png)(5.4)\n\n总压缩性具有流体和介质的贡献。对于不可压缩流体和介质，它变为：\n\
  \n − ∇ ⋅ (**K**∇`p*`) = `q`. (5.5)\n\n![image](img/F000058si15.png)(5.5)\n\n流体压缩性\
  \ `c`[`f`]![image](img/F000058si16.png) 定义为 `c`[`f`] =  − 1/*V*[`f*]∂*V*[`f*]/∂*p*!.![image](img/F000058si17.png)\
  \ 。由于 `m`[`f`]![image](img/F000058si18.png) 不独立于 `p`![image](img/F000058si19.png)，\
  \ 我们可以很容易得到：\n\n$c\\_{f} = - \\frac{m\\_{f}}{V\\_{f}}\\\\frac{\\partial\\left( V\\\
  _{f}/m\\_{f} \\right)}{\\partial p} = \\frac{1}{\\\\rho}\\frac{\\partial\\rho}{\\\
  partial p}.$ (5.6)\n\n![image](img/F000058si20.png)(5.6)\n\n岩石压缩性 `c`[`R`]![image](img/F000058si21.png)\
  \ 可以定义为 `c`[`R`] = 1/*ϕ*∂*ϕ*/∂*p*![image](img/F000058si22.png) 很容易从压力方程推导出总压缩性：\n\
  \n`c`[`t`] = `c`[`f`]+ `c`[`R`] (5.7)\n\n![image](img/F23si23.png)\n\n通常孔隙率 `ϕ`![image](img/F000058si24.png)\
  \ 假设具有形式 `ϕ` = `ϕ`(1+`c``R`)![image](img/F000058si25.png)，其中 `ϕ`[`0`]![image](img/F000058si26.png)\
  \ 是参考压力 `p`[`0`]![image](img/F000058si27.png) 下的孔隙率。在这种情况下，总压缩性为：\n\n`c`[`t`] =\
  \ `c`[`f`] + $\\frac{\\phi^{0}}{\\phi}$`c`[`R`] (5.8)\n\n![image](img/F000058si28.png)\n\
  \n有限差 (FD) 方法在第三章介绍，现在我们简要介绍涉及的数值误差。FD 方法中的数值误差分为两部分：舍入误差（由于计算机舍入数值导致的精度损失）和截断误差（假设算术完美的原始方程与精确值之间的差异）。感兴趣的表达式是截断误差。通常使用\
  \ O 表示，局部截断误差是指单次应用方法的误差，即 `f'`[`i]`−`f`[`i]`![image](img/F000058si29.png) 指精确值，而\
  \ `f'`[`i]`![image](img/F000058si30.png) 指数值近似。泰勒多项式的余项对于分析截断误差非常方便。使用泰勒多项式的拉格朗形式，得到：\n\
  \n$R_{n}\\left( x_{0} + h \\right) = \\frac{f^{({n + 1})}\\left( \\xi \\right)}{\\\
  left( {n + 1} \\right)!}\\left( h \\right)^{n +1 其中 $x_{0} < \\xi < x_{0} + h,$\
  \ (5.9)\n\n![image](img/F000058si33.png)\n\n其中可以发现局部截断误差的主导项。对于中心有限差分 (CCFD)（在第三章介绍），在孔隙尺度模拟中应用于达西定律和离散压力方程，我们需要二维\
  \ (2D) 边缘中心或三维 (3D) 面的导率 `K`![image](img/F000058si34.png)。如果导率 `K` 是空间位置的平滑函数，我们可以简单地在边缘\
  \ (2D) 或面 (3D) 上对其进行评估：\n\n`K`[`i`,`j`−0.5]`x`[`x`] = `K`[`x[`i`,`j`−0.5]), `K`[`i`−0.5`,`j]`[`y`]\
  \ = `K`[`y[`i`−0.5`,`j]`。(5.10)\n\n![image](img/F000058si36.png)(5.10)\n\n离散达西定律可以写为：\n\
  \n$\\frac{\\left( {- K_{i,j - 0.5}^{\\mathit{xx}}\\left( {p_{i + 0.5,j - 0.5} -\
  \ p_{i - 0.5,j - 0.5}}/{x_{i + 0.5} - x_{i - 0.5}} \\right) \\right) - \\left( {-\
  \ K_{i - 1,j - 0.5}^{\\mathit{xx}}\\left( {p_{i - 0.5,j - 0.5} - p_{i - 1.5,j -\
  \ 0.5}}/{x_{i - 0.5} - x_{i - 1.5}} \\right) \\right)}{x_{i} - x_{i - 1}} + \\frac{\\\
  left( {- K_{i - 0.5,j}^{\\mathit{yy}}\\left( {p_{i - 0.5,j + 0.5} - p_{i - 0.5,j\
  \ - 0.5}}/{y_{j + 0.5} - y_{j - 0.5}} \\right) \\right) - \\left( {- K_{i - 0.5,j\
  \ - 1}^{\\mathit{yy}}\\left( {p_{i - 0.5,j - 0.5} - p_{i - 0.5,j - 1.5}}/{y_{j -\
  \ 0.5} - y_{j - 1.5}} \\right) \\right)}{y_{j} - y_{j - 1}} = q_{i - 0.5,j - 0.5}.$\
  \ (5.11)\n\n![image](img/F000058si37.png)(5.11)\n\n在数学中，调和平均数（或调和平均值，有时也称为反对平均数）是多种平均值之一，它可以表示为给定观测值倒数的算术平均数\
  \ (AM) 的倒数。正实数 `x`[`1],`x`[`2],...,`x`[`n`]![image](img/F000058si39.png) 的调和平均数\
  \ `H` 定义为：\n\n$H = \\frac{n}{\\left( {1/x_{1}} \\right) + \\left( {1/x_{2}} \\right)\
  \ + \\cdots + \\left( {1/x_{n}} \\right)} = \\frac{n}{\\\\sum\\_{i = 1}^{n}{1/x_{i}}}\
  \ = \\left( \\frac{\\\\sum\\_{i = 1}^{n}x_{i}^{- 1}}{n} \\right)^{- 1}.$ (5.12)\n\
  \n![image](img/F000058si40.png)(5.12)\n\n\n\n\n\n如果一组权重 `w`[1], `w`[2], …, `w`[*n*]![image](img/F000058si41.png)\
  \ 对应数据集 `x`[1], …, `x`[*n*]![image](img/F000058si42.png)，则加权谐波平均定义为：\n\n$H = \\\
  frac{\\sum\\_{i = 1}^{n}w\\_{i}}{\\sum\\_{i = 1}^{n}{w\\_{i}/x\\_{i}}} = \\left(\
  \ \\frac{\\sum\\_{i = 1}^{n}{w\\_{i}x\\_{i}^{- 1}}}{\\sum\\\\limits\\_{i = 1}^{n}w\\\
  _{i}} \\right)^{- 1}.$ (5.13)\n\n![image](img/F000058si43.png)(5.13) \n\n未加权谐波平均可以被视为所有权重都相特殊情况。对于电导率\
  \ `K`，我们使用由单元尺寸加权的谐波平均：\n\n$K\\_{i,j - 0.5}^{\\mathit{xx}} = \\frac{h\\_{i - 0.5}^{x}\
  \ + h\\_{i + 0.5}^{x}}{\\left( {h\\_{i - 0.5}^{x}/K\\_{i - 0.5,j - 0.5}^{\\mathit{xx}}}\
  \ \\right) + \\left( {h\\_{i + 0.5}^{x}/K\\_{i + 0.5,j - 0.5}^{\\mathit{xx}}} \\\
  right)},$ (5.14)\n\n![image](img/F000058si44.png)(5.14) \n\n$K\\_{i - 0.5,j}^{\\\
  mathit{yy}} = \\frac{h\\_{j - 0.5}^{y} + h\\_{j + 0.5}^{y}}{\\left( {h\\_{j - 0.5}^{y}/K\\\
  _{i - 0.5,j - 0.5}^{\\mathit{yy}}} \\right) + \\left( {h\\_{j + 0.5}^{y}/K\\_{i\
  \ - 0.5,j + 0.5}^{\\mathit{yy}}} \\right)},$ (5.15)\n\n![image](img/F000058si45.png)(5.15)\
  \ \n\n其中 `h`[*i* − 0.5]^(*x*) = `x`[*i*] − `x`[*i* − 1]![image](img/F000058si46.png)\
  \ 和 `h`[*j* − 0.5]^(*y*) = `y`[*j*] − `y`[*j* − 1]!![image](img/F000058si47.png).\n\
  \n我们考虑两个相邻的单元 `C`[*i* − 0.5, *j* − 0.5]![image](img/F000058si48.png) 和 `C`[*i* − 0.5, *j* − 0.5]![image](img/F000058si49.png)。我们假设每个单元内的电导率是恒定的。回想离散达西定律：\n\
  \n$u\\_{i,j - 0.5}^{x} = - K\\_{i,j - 0.5}^{\\mathit{xx}}\\frac{p\\_{i + 0.5,j -\
  \ 0.5} - p\\_{i - 0.5,j - 0.5}}{x\\_{i + 0.5} - x\\_{i - 0.5}}.$ (5.16)\n\n![image](img/F000058si50.png)(5.16)\
  \ \n\n在 `C`[*i* − 0.5, *j* − 0.5]![image](img/F000058si51.png) 内对达西定律应用单侧有限差分：\n\
  \n$u\\_{i,j - 0.5}^{x} = - K\\_{i - 0.5,j - 0.5}^{\\mathit{xx}}\\frac{p\\_{i,j -\
  \ 0.5} - p\\_{i - 0.5,j - 0.5}}{x\\_{i} - x\\_{i - 0.5}}.$ (5.17)\n\n![image](img/F000058si52.png)(5.17)\
  \ \n\n同样，在单元 `C`[*i* + 0.5, *j* − 0.5]![image](img/F000058si53.png) 中有：\n\n$u\\\
  _{i,j - 0.5}^{x} = - K\\_{i + 0.5,j - 0.5}^{\\mathit{xx}}\\frac{p\\_{i + 0.5,j -\
  \ 0.5} - p\\_{i,j - 0.5}}{x\\_{i + 0.5} - x\\_{i}}.$ (5.18)\n\n![image](img/F000058si54.png)(5.18)\
  \ \n\n从离散达西定律可以很容易地推出：\n\n$\\frac{x\\_{i + 0.5} - x\\_{i}}{K\\_{i,j - 0.5}^{\\mathit{xx}}}\
  \ = - \\frac{p\\_{i + 0.5,j - 0.5} - p\\_{i,j - 0.5}}{u\\_{i,j - 0.5}}.$ (5.19)\n\
  \n![image](img/F000058si55.png)(5.19) \n\n$\\frac{x\\_{i} - x\\_{i - 0.5}}{K\\_{i\
  \ - 0.5,j - 0.5}^{\\mathit{xx}}} = - \\frac{p\\_{i,j - 0.5} - p\\_{i - 0.5,j - 0.5}}{u\\\
  _{i,j - 0.5}}.$ (5.20)\n\n![image](img/F000058si56.png)(5.20) \n\n$\\frac{x\\_{i\
  \ + 0.5} - x\\_{i}}{K\\_{i + 0.5,j - 0.5}^{\\mathit{xx}}} = - \\frac{p\\_{i + 0.5,j\
  \ - 0.5} - p\\_{i,j - 0.5}}{u\\_{i,j - 0.5}}.$ (5.21)\n\n![image](img/F000058si57.png)(5.21)\
  \ \n\n从第一个方程减去第二个和第三个方程，得出：\n\n$\\frac{x\\_{i + 0.5} - x\\_{i - 0.5}}{K\\_{i,j -\
  \ 0.5}^{\\mathit{xx}}} = \\frac{x\\_{i} - x\\_{i - 0.5}}{K\\_{i - 0.5,j - 0.5}^{\\\
  mathit{xx}}} + \\frac{x\\_{i + 0.5} - x\\_{i}}{K\\_{i + 0.5,j - 0.5}^{\\mathit{xx}}}.$\
  \ (5.22)\n\n![image](img/F000058si58.png)(5.22)  \n\n### 5.1.2 显式平均方案\n\n在离散达西定律和\
  \ CCFD 离散压力方程中，我们需要在`x`![image](img/F000058si59.png) 方向方向的边缘（2D 或 3D）中心获取电导率 `K(`xx*)`![image](img/F000058si60.png)。如果电导率\
  \ `K`![image](img/F000058si61.png) 是空间平滑函数，我们可以简单地在边缘中心对其赋值。在实践中，电导率 `K` 可能在边缘（或面）上存在跳跃![image](img/F000058si62.png)，在这种情况下建议对边缘使用加权算术平均![image](img/F000058si63.png)。这可以从线性\
  \ Galerkin 有限元法导出。在数学和统计学中，算术平均（AM）或在语境明确时的平均是指一组数字之和除以数字个数。在某些数学和统计语境下，使用“算术平均”有助于将其与其他平均值（如几何平均\
  \ GM 和谐波平均）区分开。正实数 `x`[1], `x`[2], …, `x`[*n*]![image](img/F000058si64.png) 的算术平均\
  \ `A` 定义为：\n\n$A_{n}: := \\frac{1}{n}\\sum\\limits\\_{i = 1}^{n}x\\_{i} = \\frac{x\\\
  _{1} + x\\_{2} + \\cdots + x\\_{n}}{n}$ (5.23)\n\n![image](img/F000058si66.png)(5.23)\
  \ \n\n如果一组权重 `w`[1], `w`[2], …, `w`[*n*]![image](img/F000058si67.png) 对应数据集 `x`[1],\
  \ …, `x`[*n*]![image](img/F000058si68.png)，则加权算术平均定义为：\n\n$A_{n}: := \\frac{\\sum\\\
  _{i = 1}^{n}w\\_{i}x\\_{i}}{\\sum\\limits\\_{i = 1}^{n}w\\_{i}} = \\frac{w\\_{1}x\\\
  _{1} + w\\_{2}x\\_{2} + \\cdots + w\\_{n}x\\_{n}}{w\\_{1} + w\\_{2} + \\cdots +\
  \ w\\_{n}}$ (5.24)\n\n![image](img/F000058si69.png)(5.24) \n\n未加权的算术平均可以被视为所有权重都等的特殊情况。对于电导率\
  \ `K`，我们使用由单元尺寸加权的算术平均：\n\n$K\\_{i,j - 0.5}^{\\mathit{xx}} = \\frac{h\\_{j - 0.5}^{y}K\\\
  _{i - 0.5,j - 0.5}^{\\mathit{xx}} + h\\_{j + 0.5}^{y}K_{i + 0.5,j - 0.5}^{\\mathit{xx}}}{h\\\
  _{j - 0.5}^{y} + h\\_{j + 0.5}^{y}}$ (5.25)\n\n![image](img/F000058si70.png)(5.25)\
  \ \n\n$K\\_{i - 0.5,j}^{\\mathit{yy}} = \\frac{h\\_{i - 0.5}^{x}K\\_{i - 0.5,j -\
  \ 0.5}^{\\mathit{yy}} + h\\_{i + 0.5}^{x}K_{i + 0.5,j + 0.5}^{\\mathit{yy}}}{h\\\
  _{i - 0.5}^{x} + h\\_{i + 0.5}^{x}}$ (5.26)\n\n![image](img/F000058si71.png)(5.26)\
  \ \n\n其中 `h`[*i* − 0.5]^(*x*) = `x`[*i*] − `x`[*i* − 1]![image](img/F000058si46.png)\
  \ 和 `h`[*j* − 0.5]^(*y*) = `y`[*j*] − `y`[*j* − 1]!![image](img/F000058si47.png)\
  \ （注：此处原文与前文重复，已按要求翻译并保持格式）\n\n\n\n\n\n$\\sqrt{A_{2}H_{2}} = \\sqrt{\\frac{x_{1}\
  \ + x_{2}}{2}\\frac{2}{1/x_{1} + 1/x_{2}}} = \\sqrt{x_{1}x_{2}}$ (5.28)\n\n![image](img/F000058si87.png)(5.28)\
  \ \n\n在数学中，几何平均值（GM）是一种平均值，它通过数值的乘积（与使用和的算术平均值 AM 相）指示一组数字的中心趋势或典型值。几何平均值定义为 $n$\
  \ 个数字![image](img/F000058si88.png) 积方根，即对于一组（非负）数字，几何平均值的定义为：\n\n$G_{n}: := \\left(\
  \ \\prod\\limits_{i = 1}^{n}x_{i} \\right)^{1/n} = \\sqrt[n]{x_{1}x_{2}\\cdots x_{n}}$\
  \ (5.29)\n\n![image](img/F000058si89.png)(5.29) \n\n几何平均值也可以表示为对数算术平均值的指数。通过使用对数等式转换公式，可以将乘法表示为和，幂表示为乘法：当\
  \ $a[1]$，$a[2]$ $\\dots$，$a[n]$  > 0![image](img/F000058si90.png)，\n\n$\\left( \\\
  prod\\limits_{i = 1}^{n}a_{i} \\right)^{1/n} = \\exp\\left\\lbrack {\\frac{1}{n}\\\
  sum\\limits_{i = 1}^{n}{\\ln a_{i}}} \\right\\rbrack.$ (5.30)\n\n![image](img/F000058si91.png)(5.30)\
  \ \n\n有时被称为对数平均（不要与对数平均数混淆）。它简单地计算 $a[i]$ 进行对数变换后的值的算术平均值（即对数刻度上的算术平均值），然后使用幂运算将计算返回到原始尺度，即它是\
  \ $f(x)$  = log $x$ 的广义 $f$-平均值![image](img/F000058si92.png)。\n\n如果一组权重 $w[1]$，$w[2]$\
  \ $\\dots$，$w[n]$![image](img/F000058si93.png) 与数据集 $x[1]$ $\\dots$，$x[n]$![image](img/F000058si94.png)\
  \ 相关（假设权重是归一化的；即 $\\sum_{k = 1}^{n}w_{k} = 1}$![image](img/F000058si95.png)），加权几何平均值的定义为：\n\
  \n$G_{n}: := \\prod\\limits_{i = 1}^{n}x_{i}^{w_{i}} = x_{1}^{w_{1}}x_{2}^{w_{2}}\\\
  cdots x_{n}^{w_{n}}$ (5.31)\n\n![image](img/F000058si96.png)(5.31) \n\n未加权的几何平均值可以视为所有权重都相等的特例。很容易得出，对于\
  \ $x[n]$  ∈ $\\mathbb{R}$  > 0![image](img/F000058si98.png)，$A[n]$  ≥ $G[n]$![image](img/F000058si97.png)。这一不等式广为人知的柯西不等式（Cauchy’s\
  \ Mean）或算术平均值-几何平均值不等式（AM–GM 不等式）。某些来源将其称为柯西公式。对于在 $x$ 和 $y$ 方向上均具有非均匀性的渗透率分布（二维），数值模拟显示，调和平均值通常会低估真实渗透率，而算术平均值通常会高估真实渗透率。使用蒙特卡洛技术，无论渗透率分布的类型如何，有效渗透率都可以通过该分布的几何平均值得到最佳近似。几何平均值也可以表示为对数算术平均值的指数。渗透率的对数（而非渗透率本身）遵循高斯分布。（多元）正态向量的线性变换也具有正态分布。高斯变量通常带有算术平均值。注意有时算术平均值有效，而有时调和平均值有效。为了将三种平均值统一到一个框架中，提出了幂平均值。在数学中，广义平均值用于聚合一组数字的函数族，其特例是勾几得平均值（算术、几何和调和）。广义平均值也称为幂平均值或霍尔德平均值（以奥托命名）。在油藏模拟中，也称为幂律平均值。\n\
  \n定义：如果 $p$![image](img/F000058si99.png)是非零数，且 $x[1]$ $\\dots$，$x[n]$![image](img/F000058si100.png)\
  \ 是正实数，那么指数为 $p$ 的这些正实数的广义平均值或幂平均值为：\n\n$M_{p}(x_{1},\\ldots,x_{n}) = \\left( {\\\
  frac{1}{n}\\sum\\limits_{i = 1}^{n}x_{i}^{p}} \\right)^{1/p}.$ (5.32)\n\n![image](img/F000058si101.png)(5.32)\n\
  \n以这种方式，三种平均值可以像表 5.1 所示的形式的形式出，以及广义平均值的其他特例：\n\n表 5.1 广义平均值的特例公式\n\n| 特例 | $p$\
  \ | 公式 |\n| :--- | :--- | :--- |\n| 调和平均值 | –1 | $M_{-1}(x_{1},\\ldots,x_{n}) =\
  \ \\frac{n}{\\left( 1/x_{1} \\right) + \\cdots + \\left( 1/x_{n} \\right)}![image](img/F000058si4)\
  \ |\n| 几何平均值 | 0 | $M_{0}(x_{1},\\ldots,x_{n}) = \\lim\\limits_{p\\rightarrow 0}M_{p}(x_{1},\\\
  ldots,x_{n}) = \\sqrt[n]{x_{1} \\cdot \\cdots \\cdot x_{n}}![image](img/F000058si2)\
  \ |\n| 算术平均值 | 1 | $M_{1}(x_{1},\\ldots,x_{n}) = \\frac{x_{1} + \\cdots + x_{n}}{n}$![image](img/F000058si3)\
  \ |\n| 最小值 | $-\\infty$ | $M_{-\\infty}(x_{1},\\ldots,x_{n}) = \\lim\\limits_{p\\\
  rightarrow -infty}M_{p}(x_{1},\\ldots,x_{n}) = \\min\\{ x_{1},\\ldots,x_{n}\\}$![image](img/F000058si4)\
  \ |\n| 均方根 | 2 | $M_{2}(x_{1},\\ldots,x_{n}) = \\sqrt{\\left( x_{1}^{2} + \\cdots\
  \ + x_{n}^{2} \\right)/n}$![image](img/F000058si6) |\n| 立方平均值 | 3 | $M_{3}(x_{1},\\\
  ldots,x_{n}) = \\sqrt[3]{\\left( x_{1}^{3} + \\cdots + x_{n}^{3} \\right)/n}$![image](img/F000058si7)\
  \ |\n| 最大值 | $+\\infty$ | $M_{+\\infty}(x_{1},\\ldots,x_{n}) = \\lim\\limits_{p\\\
  rightarrow\\infty}M_{p}(x_{1},\\ldots,x_{n}) = \\max\\{ x_{1},\\ldots,x_{n}\\}$![image](img/F000058si9)\
  \ |\n\n![Image](img/T000058tabt010.png)\n\n每个广义平均值始终位于 $x$![image](img/F000058si102.png)\
  \ 值的最小值和值之间。每个广义平均值都是其参数的对称函数；排列广义平均值的参数不会改变其值。与大多数平均值一样，广义平均值是其参数的齐次函数，即 $Mp =\
  \ bMp$![image](img/F000058si103.png)。平均值的计算可以分为等大小块的计算（因此我们可以对尺度缩放应用“分治（D&C）”算法）：\n\
  \n$Mp = M[p]M[p,Mp,\\dots,Mp \\cdot k+1], \\dots, x[n \\cdot k])]$. (5.33)\n\n![image](img/F000058si104.png)(5.33)\n\
  \n用于尺度缩放的**分治（D&C）算法**是重正化方法的本质，即将一个大问题分解为一系列更小、更容易管理的阶段。在每个阶段，当前网格被划分为单元，每个单元由少量网格块组成，并确定每个单元的有效渗透率。这些单元成为下一个粗网格的网格块，并重复整个过程。实际上，重复应用重缩放操作可以连续捕捉日益增大的尺度异质性对感兴趣的大尺度流动行为的影响。\n\
  \n对于正正权重序列 $w[i]$![image](img/F000058si105.png) 且 $\\sum w[i]$  = 1![image](img/F000058si106.png)，我们定义加权幂平均值为\n\
  \n\n\n\n\n$\\\\begin{matrix} {M\\_{p}\\\\left( x\\_{1},\\\\ldots,x\\_{n} \\right)}\
  \ & {= \\\\left( {\\\\sum\\\\limits\\_{i = 1}^{n}{w\\_{i}x\\_{i}^{p}}} \\\\right)^{1/p}}\
  \ \\\\ {M\\_{0}\\\\left( x\\_{1},\\\\ldots,x\\_{n} \\right)} & {= \\\\prod\\\\limits\\\
  _{i = 1}^{n}x\\_{i}^{w\\_{i}}} \\\\ \\\\end{matrix}$ (5.34)\n\n![image](img/F000058si107.png)(5.34)\
  \ \n\n幂平均值可以进一步推广为广义的 $f$![image](img/F000058si108.png)-平均：\n\n$M\\_{f}\\\\left(\
  \ x\\_{1},\\\\ldots,x\\_{n} \\right) = f^{- 1}\\\\left( {\\\\frac{1}{n} \\cdot \\\
  \\sum\\\\limits\\_{i = 1}^{n}{f\\\\left( x\\_{i} \\\\right)}} \\\\right).$ (5.35)\n\
  \n![image](img/F000058si109.png)(5.35) \n\n这在不使用 $f(x)$ = log ($x$)极限的情况下涵盖了几何平均值（GM）![image](img/F000058si110.png)。\n\
  \n考虑一个由 3 × 3![image](img/F000058si111.png)等大的子块 $B[*i**j*]$，$i$  = 1, ��2, ��3,\
  \  $j$  = 1, ��2, ��3![image](img/F000058si112.png)相应的渗透率为 $K[*i**j*]$  = $K[*i**j*]^{(*x**x*)}$\
  \  = $K[*i**j*]^{(*y**y*)}$![image](img/F000058si113.png)。底层（水平切片）包含 $B[11]$![image](img/F000058si114.png)，$B[21]$![image](img/F000058si115.png)和\
  \ $B[31]$![image](img/F000058si116.png)，而第一个垂直切片包含 $B[11]$![image](img/F000058si117.png)，$B[12]$![image](img/F000058si118.png)\
  \ 和 $B[13]$![image](img/F000058si119.png)。调和-算术平均值定义为：\n\n$K[*e**f**f*, $h$  − $a$]^{(*x**x*)}$ := $M*1,*M* − −1,*M* − −1)$.\
  \ (5.36)\n\n![image](img/F000058si120.png)(5.36)\n\n算术-调和平均值定义为：\n\n$K[*e**f**f*, $a$\
  \  − $h$]^{(*x**x*)}$ := $M*1,*M*1,*M*1)$. (5.37)\n\n![image](img/F000058si121.png)(5.37)\n\
  \n在物理建模中，调和-算术平均值将块视为三个独立的层，每层由三个子块；而算术-调和平均值将块视为由两个导体（裂缝）连接的三个垂直切片，每个切片由三个子块。对这两种平均值进行快速比较可以：在导出\
  \ $K[*e**f**f*, $h$  − $a$]^{(*x**x*)}$![image](img/F000058si122.png)，我们添加人工隔障。在导出\
  \ $K[*e**f**f*, $a$  − $h$]^{(*x**x*)}$![image](img/F000058si123.png)，我们添加人工导体。渗透率\
  \ $K[*e**f**f*, $s**e**a**l**e**d**S**i**d**e**sB]^{(****)}$![image](img/F000058si124.png)是通过带有密封边界条件的流基方法得到的。因此我们可以说\
  \ $K[*e**f**f*, $h$  − $a$]^{(*x**x*)}$ ≤ $K[*e**f**f*, $s**e**a**l**e**d**S**i**d**e**sB]^{(****)}$ ≤ $K[*e**f**f*, $a$\
  \  − $h$]^{(*x**x*)}$ (5.38)\n\n![image](img/F000058si125.png)(5.38)\n\n### 5.1.3\
  \ 基于模拟的尺度化\n\nCCFD 可以应用于定义渗透率的相同网格；CCFD 也可以应用于比定义渗透率网格更精细的网格；但两者的代价都很。我们希望在粗网格上应用\
  \ CCFD 以降低计算成本。但每当我们使用比定义渗透率网格更粗时，就需要特定的尺度化算法将渗透率从细网格转换为粗网格。\n\n注意，粗网格有限元方法（FEMs）（在细网格上进行精确积分或数值积分）可以直接处理定义细网格上的渗透率。它定义了一种渗透率尺度化方案\
  \ [权重 AM 的 GFEM，而权重 HM 的 MsFEM]。尺度化技术的主要动力是地统计储层描述的发展。这些算法现在通常产生数十亿单元网格上的细尺度储层孔隙渗透率描述。这些描述符合已知和推断的储层统计数据。这些储层描述网格太细了，无法用于储层模拟器。尽管计算机硬件有所进步，大多数全场储层模型仍使用百万或更少的单元，相比地质网格缩小了\
  \ 1000 倍。需要尺度化来弥补这两个尺度之间的差距。\n\n给定细尺度储层描述和模拟网格，尺度化算法为粗网格上的单元分配孔隙率、渗透率和其他函数的合适值。目标仅仅是保留模拟网格上流的宏观特征。算法计算“有效渗透率”，使得通过粗均匀块的单相流体总流量与从细非均匀块获得的流量相同。尺度化已成为将详细地质模型转换为模拟网格日益重要的工具。\n\
  \n基于模拟的尺度化方法是估计网格块有效渗透率的标准方法。基于模拟的尺度化方案也称为流基尺度化方法或压力求解方法，是基于流模拟的算法，通常使用 CCFD 或有限体积法。两相流需要有效绝对渗透率，但使用基于模拟的方法获取有效绝对渗透率时，我们只运行单相流模拟。在压力求解方法中，我们设置带边界条件的单相流计算，然后询问相同的渗透率值。我们得到的结果取决于所做的假设，特别是关于边界条件。\n\
  \n\n\n\n\n⟨*K*(x)∇*p*⟩ = `K`[*eff`]⟨∇*p*⟩ = `K`[*eff]`G`. (5.41)\n\n![image](img/F000058si128.png)(5.41)\
  \ \n\n这是理想的，因为我们希望 ⟨uu⟩![image](img/F000058si129.png) 和 ⟨∇*p*⟩![image](img/F000058si130.png)\
  \ 满足具有有效水力渗透性的宏观达西定律。狄利克边界条件可以表示为：\n\np(x) = G ⋅ x, x ∈ ∂Ω (5.42)\n\n![image](img/F000058si131.png)(5.42)\
  \ \n\n其中 G ∈ ℝ^(d)![image](img/F000058si132.png) 是一个给定的常数向量。很容易看出 ⟨∇*p*⟩ = G![image](img/F000058si133.png)\
  \ 即 |Ω|⟨∇*p*⟩ = ∫[*Ω]∇*p*dx = ∫[∂Ω]*p*n*dS = ∫[∂Ω]G ⋅ x*n*dS = ∫[*Ω]∇(G⋅ x)*dx =\
  \ ∫[*Ω]G ⋅ ∇*x*dx = ∫[*Ω]GI*dx = ∫[*Ω]G*dx = G∫[*Ω]1*dx = |Ω|G.![image](img/F000058si134.png)\n\
  \n我们不需要对所有的 G ∈ ℝ^(d)![image](img/F000058si135.png) 进行求解。由于该问题（流体模拟）是线性的，我们只需要对\
  \ G 的每个基求解![image](img/F000058si136.png)。对于二维问题，我们可以选择两个单位向量作为基：G = (1,0)![image](img/F000058si137.png)\
  \ 和 G = (0,1)![image](img/F000058si138.png)。如果区域 Ω = (0,1)²![image](img/F000058si139.png)，选择\
  \ G = (1,0)![image](img/F000058si140.png) 对应于边界条件 p[w] = 0![image](img/F000058si141.png),\
  \ p[e] = 1![image](img/F000058si142.png), 以及 p![image](img/F000058si143.png) 在另外两个边界上是线性的（n![image](img/F000058si144.png)\
  \ 和 s![image](img/F000058si145.png)）；选择 G = (0,1)![image](img/F000058si146.png)\
  \ 对应于边界条件 p[s] = 0![image](img/F000058si147.png), p[n] = 1![image](img/F000058si148.png),\
  \ 以及 p![image](img/F000058si149.png) 在另外两个边界上（w![image](img/F000058si150.png) 和\
  \ e![image](img/F000058si151.png)是线性的。显然，狄利克雷格式等同于基于流的开放边界条件方法。对于周期性边界条件 p(x) =\
  \ G ⋅ x![image](img/F000058si152.png)，我们也可以得到 ⟨∇*p*⟩ = G![image](img/F000058si153.png)。对于诺曼边界条件\
  \ − K*(x)∇*p* ⋅ n = v ⋅ n, x ∈ ∂Ω![image](img/F000058si154.png)，诺曼格式与无流边界条件相似，我们将入口/出口边界上的施加压力条件替换为施加速度。为了方便分析，我们还考虑另一种与上述诺曼格式等效的格式，其中\
  \ v ∈ ℝ^(d)![image](img/F000058si155.png) 是 ⟨∇*p*⟩ = G 的格朗日乘子![image](img/F000058si156.png)，其中\
  \ G ∈ ℝ^(d)![image](img/F000058si157.png) 是给定的常数向量。\n\n通过数值模拟，人们观察到通常情况下狄利克雷格式提供的渗透性是高估，而诺曼格式给出低估。对于这三种格式的每种，我们都获得一个（可能不同的）有效水力渗透性\
  \ K[*eff]![image](img/F000058si158.png)。让我们分别标记为来自狄利克雷格式![image](img/F000058si159.png)的\
  \ K[*eff]^(D)、周期性格式![image](img/F000058si160.png)的 K[*eff]^(P) 以及诺曼格式![image](img/F000058si161.png)的\
  \ K[*eff]^(N)。\n\n### 定理 5.1\n对于三个有效张量，以下关系成立：\n\n```K[*eff]^(N) ≤ K[*eff]^(P) ≤\
  \ K[*eff]^(D).\n```\n(5.43) ![image](img/F000058si162.png)\n\n为了证明这个定理，我们首先注意到 K[*eff]^(N)\
  \ 有变分格式：对于任意 G ∈ ℝ^(d)![image](img/F000058si164.png)，\n\n```\nG^T K_{eff}^N G =\
  \ min_{p(x) ∈ W_N} ⟨ K(x)∇ p ⟩.\n```\n(5.44) ![image](img/F000058si165.png)\n\n\
  其中允许函数空间为：\n\n```\nW_N = {p(x) ∈ H¹(Ω) : ⟨∇*p*⟩ = G}.\n```\n(5.45) ![image](img/F000058si166.png)\n\
  \n为了看到上述变分格式，我们令 p(x)![image](img/F000058si167.png) 为带有适当约束的诺曼问题的解。我们知道 p(x)![image](img/F000058si168.png)\
  \ 满足：\n\n```\n∫[Ω]K(x)∇p*dw = min_{w ∈ W_N} ∫[Ω]K(x)∇wdw.\n```\n(5.46) ![image](img/F000058si169.png)\n\
  \n我们随后有：\n\n```\n∫[*Ω]G^T K[*eff]^(N)Gdx = ∫[*Ω]K(x)∇p*dx = ∫[*Ω]K(x)∇p*dx + ∫[*Ω]K(x)∇p*∇(G⋅\
  \ x*)dx.\n```\n(5.47) ![image](img/F000058si170.png)\n\n剩下的只需要证明：\n\n```\n∫[*Ω]K(x)∇p*∇(G⋅\
  \ x*)dx = 0.\n```\n(5.48) ![image](img/F000058si171.png)\n\n事实上，根据格林公式：\n\n```\n\
  ∫[Ω]K(x)∇p ∇(G ⋅ x - p)dx = ∫[∂Ω]K(x)∇p ⋅n(G ⋅ x - p)dS - ∫[Ω]∇·(K(x)∇p)(G ⋅ x -\
  \ p)dx = ∫[∂Ω]K(x)∇p ⋅n(G ⋅ x - p)dS.\n```\n(5.49) ![image](img/F000058si172.png)\n\
  \n我们回忆格朗日乘子 v ∈ ℝ^(d)![image](img/F000058si173.png) 并看到：\n\n```\n∫[∂Ω]K(x)∇p ⋅n(G\
  \ ⋅ x - p)dS = ∫[∂Ω]v ⋅n(G ⋅ x - p)dS = ∫[Ω]∇·(K(x)∇p)(G ⋅ x - p)dx = v ⋅ ∫Ωdx =\
  \ 0.\n```\n(5.50) ![image](img/F000058si174.png)\n\n其中我们使用了 ∇x = I。\n\n同样，我们可以证明\
  \ K[*eff]^(D) 和 K[*eff]^(P) 有变分格式：\n\n```\nG^T K_{eff}^P G = min_{p(x) ∈ W_P} ⟨\
  \ K(x)∇ p ⟩.\n```\n(5.51) ![image](img/F000058si179.png)\n\n```\nG^T K_{eff}^D G\
  \ = min_{p(x) ∈ W_D} ⟨ K(x)∇ p ⟩.\n```\n(5.52) ![image](img/F000058si180.png)\n\n\
  其中允许函数空间为\n\n\n\n\n\n$W[P] = \\{p(x) \\in H¹(\\mathbb{R}^d) : p(x) - G \\cdot x\
  \ \\text{ 是周期为 } \\Omega \\text{ 的周期函数}\\}$. (5.53)\n\n![image](img/F000058si181.png)(5.53)\n\
  \n$W[D] = \\{p(x) \\in H¹(\\Omega) : p(x) = G \\cdot x \\on \\partial\\Omega\\}$.\
  \ (5.54)\n\n![image](img/F000058si182.png)(5.54)\n\n显而易见\n\n$W[D] \\subset W[P]\
  \ \\subset W[N]$. (5.55)\n\n![image](img/F000058si183.png)(5.55)\n\n因此，不等式已经证明。对于\
  \ $K[eff]^N$![image](img/F000058si184.png), $K[eff]^P$![image](img/F000058si185.png),\
  \ 以及 $K[eff]^D$![image](img/F000058si186.png)，以及它们通过 GFEM 的数值解 $K[eff, h]^N$![image](img/F000058si187.png),\
  \ $K[eff, h]^P$![image](img/F000058si188.png), 和 $K[eff, h]^D$![image](img/F000058si189.png)，我们有\n\
  \n$0 \\le K[eff, h]^N - K[eff]^N \\le ChI$, (5.56)\n\n![image](img/F000058si190.png)(5.56)\n\
  \n$0 \\le K[eff, h]^P - K[eff]^P \\le ChI$, (5.57)\n\n![image](img/F000058si191.png)(5.57)\n\
  \n$0 \\le K[eff, h]^D - K[eff]^D \\le ChI$. (5.58)\n\n![image](img/F000058si192.png)(5.58)\n\
  \n### 5.1.4 有效渗透率上尺度方法的示例\n\n对于一个 $10\\times6$![image](img/F000058si193.png) 均匀网格，渗透率场如图图\
  \ 5.1 所示。\n\n![图 5.1 渗透率场。](img/F000058f05-01-9780128209578.jpg) 图 5.1 渗透率场。\n\n\
  有效渗透率通过加权平均值计算：\n\n$K_A^{eff} = \\begin{bmatrix} 4.37 & 0 \\\\ 0 & 4.37 \\end{bmatrix}$\n\
  \n![image](img/F000058si194.png)\n\n如果一组权重 $w[1], w[2], \\dots, w[n]$![image](img/F000058si195.png)\
  \ 与数据集 $x[1], x[2], \\dots, x[n]$![image](img/F000058si196.png) 关联，则加权调和平均值定义为：\n\
  \n$H_n = \\frac{\\sum_{i=1}^{n}w_i}{\\sum_{i=1}^{n}w_i/x_i} = \\left( \\frac{\\\
  sum_{i=1}^{n}w_ix_i^{-1}}{\\sum_{i=1}^{n}w_i} \\right)^{-1}$\n\n![image](img/F000058si197.png)\n\
  \n该渗透率场的加权算术平均值可以计算为：\n\n$K_H^{eff} = \\begin{bmatrix} 3.27 & 0 \\\\ 0 & 3.27 \\\
  end{bmatrix}$\n\n![image](img/F000058si198.png)\n\n如果一组权重 $w[1], w[2], \\dots, w[n]$![image](img/F000058si199.png)\
  \ 与数据集 $x[1], x[2], \\dots, x[n]$![image](img/F000058si200.png) 关联（假设权重是归一化的，即 $\\\
  sum w[i]=1$![image](img/F000058si201.png)），则加权几何平均值（GM）定义为：\n\n$G_n = \\prod_{i=1}^{n}x_i^{w_i}\
  \ = x_1^{w_1}x_2^{w_2}\\cdots x_n^{w_n}$\n\n![image](img/F000058si202.png)\n\n那么通过加权平均值计算的有效渗透率为：\n\
  \n$K_G^{eff} = \\begin{bmatrix} 3.83 & 0 \\\\ 0 & 3.83 \\end{bmatrix}$\n\n![image](img/F000058si203.png)\n\
  \n对于加权幂律平均，同样可以计算为：\n\n$M_p(x_1,\\dots,x_n) = \\left( \\sum_{i=1}^{n}w_ix^p \\right)^{1/p}$\n\
  \n![image](img/F000058si204.png)\n\n那么，在 $p=1$![image](img/F000058si205.png) 的下：\n\
  \n$K_{p=1}^{eff} = \\begin{bmatrix} 4.37 & 0 \\\\ 0 & 4.37 \\end{bmatrix} = K_A^{eff}$\n\
  \n![image](img/F000058si206.png)\n\n同样，在 $p=0$![image](img/F000058si207.png) 的下：\n\
  \n$K_{p=0}^{eff} = \\begin{bmatrix} 3.83 & 0 \\\\ 0 & 3.83 \\end{bmatrix} = K_G^{eff},$\n\
  \n![image](img/F000058si208.png)\n\n以及在 $p=-\\infty$![image](img/F000058si209.png)\
  \ 的下：\n\n$K_{p=-\\infty}^{eff} = \\begin{bmatrix} 3.26 & 0 \\\\ 0 & 3.26 \\end{bmatrix}\
  \ = K_H^{eff}$。\n\n当 $p$ 从 $-\\infty$![image](img/F000058si212.png) 增加到 $+\\infty$![image](img/F000058si212.png)\
  \ 时，平均值从 $\\min(x[1],\\dots,x[n])$![image](img/F000058si214.png) 增加到 $\\max(x[1],\\\
  dots,x[n])$![image](img/F000058si214.png)，如图图 5.2 所示。\n\n![图 5.2 幂律平均。](img/F000058f05-02-9780128209578.jpg)\
