  \ 0.42 | … |\n\n`Phase`：化学均匀的流体区域，通过界面与其他相分离，例如油相（ole）、水相（aqueous phase）、气相和固相（岩石）。没有特定的符号，但通常带有下标\
  \ `o`、`w`、`g`；相是不相溶的。\n\n`Interfacial tension (IFT)`：两之间的 IFT 是产生特定面积界面的所需能量。事实上，IFT\
  \ 以单位面积能量的形式给出。IFT 的符号为 `σ`![image](img/F00010si1.png)，SI 单位中为 `N/m`（牛顿/米）。例如，如果储层中同时存在气体和油，那么气/油\
  \ IFT 可能在 `σ[go] ≈ 0.1–10![image](img/F00010si2.png) mN/m 范围内；同样，油/水值可能在 `σ[go]\
  \ ≈ 15–40![image](img/F00010si3.png) mN/m 范围内。\n\n`Component`：相中存在的单一化学种类，例如水相有很多成分：水（`H[2]O`）、氯化钠（`NaCl`）、溶解氧（`O[2]`）等；在油相中，可能有成百上千种成分——基于\
  \ `C[1]`、`C[2]` 等碳烃。\n\n`Viscosity`：流体的粘度是流体在运动抵抗剪切力时耗散的（摩擦）能量；量纲为 `[force/area\
  \ time]`，单位为 `Pa s`（SI）或泊（公制）。油田应用中最常用的单位是厘泊（`cP`）。对于气体流体，分子间距大，由于其随机运动，流动阻力小。另一方面，致密流体的分子相互靠近，流动阻力较大。标准条件下的水粘度为\
  \ 1 `cp`。在储层条件下（4000–6000 `psi` 和 200°F），油的典型粘度值见表 1.3。沥青的粘度可达 4,500,000 `cp`。通常，流体粘度取决于压力、温度及其组成，通常表示为\
  \ `µ`。\n\n#### 表 1.3 油的典型粘度值。\n\n| 分类 | 粘度范围 (cp) |\n| :--- | :--- |\n| 轻油 | 0.3–1\
  \ |\n| 中油 | 1–6 |\n| 中等油 | 6–50 |\n| 高粘度油 | 50–1000 |\n| 重油 | 1000 以上 |\n\n`Formation\
  \ volume factor`：描述相（例如油和水）在“地层”（即高温高压储层）中的体积与表面体积比例的系数；符号为 `B[w]`、`B[o]` 等。对于油，`B[o]`\
  \ 的典型范围约为 ~1.1 到 1.3，因为在储层条件下，它通常含有大量溶解气体，这些气体在压力下降油收缩时会在表面释放；油田单位为储层桶/储罐桶 (RB/STB)]。\n\
  \n`Gas solubility factor (或溶解气油比)`：该系数描述了在给定储层压力和温度下溶解在单位体积油（通常为 STB）中的气体体积（通常以标准立方英尺\
  \ SCF 计算）；符号为 `R[so]`；单位为 SCF/STB。\n\n\n\n\n\n# 压缩性\n\n流体（油、气和水）的压缩性（`c`）可以定义为固定温度\
  \ `T` 下，体积 `V` 的变化或密度 `ρ` 随压力 `p` 的变化，![image](img/F000010si4.png)所示：\n\n$c_{f}\
  \ = - \\frac{1}{V}\\left. \\frac{\\partial V}{\\partial p} \\right|_{_{T} = \\frac{1}{\\\
  rho}\\left. \\frac{\\partial\\rho}{\\partial p} \\right|_{_{T}$(1.1)\n\n![image](img/F000010si5.png)(1.1)\
  \ \n\n积分后，公式 (1.1) 表示为\n\n*ρ* = *ρ*⁰*e*^(*c**f*) (1.2)\n\n![image](img/F000010si6.png)(1.2)\
  \ \n\n其中 `ρ`⁰![image](img/F000010si7.png) 是参考压力 `p`⁰ 处的密度。使用泰勒级数展开，我们看到：\n\n$\\\\\
  rho = \\\\rho^{0}\\left\\\\lbrack {1 + c_{f}\\\\left( {p - p^{0}} \\\\right) + \\\
  frac{1}{2!}c_{f}^{2}\\\\left( {p - p^{0}} \\right)^{2} + \\cdots} \\right\\\\rbrack$\
  \ (1.3)\n\n![image](img/F000010si8.png)(1.3) \n\n因此，得到了一个近似值：\n\n*ρ* ≈ *ρ*⁰(1+*c**f*)\
  \ (1.4)\n\n![image](img/F000010si9.png)(1.4) \n\n如果使用真实气体状态方程（压力-体积-温度关系），可以推导出公式\
  \ (1.4)的另一种形式：\n\n$\\\\rho = \\frac{pW}{ZRT}$ (1.5)\n\n![image](img/F000010si10.png)(1.5)\
  \ \n\n其中 `W` 是分子量，`Z` 是气体压缩因子，`R` 是`通用气体常数`。如果压力、温度和密度分别以 atm、K 和 g/cm³（物理单位制），则\
  \ `R` 的值为 82.057。对于英制单位（psia, R 和 lbm/ft³），`R`=10.73；对于国际单位制（N/m², K 和 kg/m³），`R`=8.314。将(1.5)代入(1.1)得到（其中\
  \ `c`[*g*] = `c`[*f*]![image](img/F000010si11.png)）：\n\n$c_{g} = \\frac{1}{p} -\
  \ \\frac{1}{Z}\\left. \\frac{\\partial Z}{\\partial p} \\right|_{_{T}$ (1.6)\n\n\
  ![image](img/F000010si12.png)(1.6)\n\n## 1.3 单相岩石性质\n\n### 孔隙与孔喉\n存在于渗透性岩石中的微小连通通道；尺寸通常为\
  \ 1–200 μm；在扫描显微镜下肉眼可见。孔隙边缘可能衬有成岩矿物，例如粘土。孔体之间较窄的收缩部分称为孔喉。\n\n### 孔隙度\n孔隙是岩石中孔隙空间的比例。孔隙度有两种：总孔隙度和有效孔隙。总孔隙包括连通和孤立孔隙，而有效孔隙仅包括前者。由于只有连通孔隙才能储存和传输流体，因此人们主要关注有效孔隙。此后，孔隙度一词将仅指有效孔隙度。从这个意义上说，它衡量了储层在其孔隙中储存可产流体的能力。\n\
  \n孔隙度通常表示为 `ϕ`![image](img/F000010si13.png)（分数），变化范围从相当渗透性岩石的 0.25 到极低渗透岩石的 .1。储层岩石性质（如孔隙度）通常在空间上变化。如果某性质独立于储层位置，则该储层岩石在该性质上是均匀的。如果随位置变化，则称为非质性的。孔隙体积随压力\
  \ `p`的变化可以通过孔隙度的压力依赖性来考虑。孔隙取决于压力取决于岩石压缩性，压缩性通常被认为是常数（通常为 10⁻⁶–10⁻⁷ psi⁻¹），可以定义为：\n\
  \n$c_{R} = - \\frac{1}{\\phi}\\frac{\\partial\\phi}{\\partial p}$ (1.7)\n\n![image](img/F000010si14.png)(1.7)\n\
  \n积分后，其表达式为：\n\n*ϕ* = *ϕ*⁰*e*^(*c**f*) (1.8)\n\n![image](img/F000010si15.png)(1.8)\
  \ \n\n其中 `ϕ`⁰![image](img/F000010si16.png) 是参考压力 `p`⁰ 处的密度。使用泰勒级数展开，我们看到：\n\n$\\\
  \\phi = \\phi^{0}\\left\\\\lbrack {1 + c_{R}\\left( {p - p^{0}} \\right) + \\frac{1}{2!}c_{R}^{2}\\\
  left( {p - p^{0}} \\right)^{2} + \\cdots} \\right\\\\rbrack$ (1.9)\n\n![image](img/F000010si17.png)(1.9)\
  \ \n\n因此得到了一个近似值：\n\n*ϕ* ≈ *ϕ*⁰(1+*c**R*) (1.4)\n\n![image](img/F000010si18.png)(1.4)\
  \ (此处应为 1.4)\n\n![image](img/F000010si19.png)(1.10)\n\n## 渗透率\n渗透率是 `p`⁰ 处的密度。\n\
  渗透率通常以 `k` 表示，它是岩石通过连通孔隙传输的能力，有时称为绝对渗透率，单位为达西（d）或毫西（md）。对于储层工程师来说，渗透率是最最重要的参数。储层岩石的典型渗透率值见表\
  \ 4。\n\n| 分类 | 渗透率范围 (md) |\n| :--- | :--- |\n| 差 | 1–15 |\n| 中等 | 15–50 |\n| 好\
  \ | 50–250 |\n| 极好 | 250–1000 |\n| 优秀 | 1000 |\n\n渗透率通常随位置变化，即使在同一位置，由于薄透层的影响，垂直渗透率\
  \ `k` 也与水平渗透率不同。在许多情况下，假设 `k` 是一个对角张量：\n\n$\\\\mathbf{k} = \\begin{pmatrix} k_{11}\
  \ & &\\\\ & k_{22} &\\\\ & k_{33} \\\\end{pmatrix} = \\text{diag}(k_{11},k_{22},k_{33})$\
  \ (1.11)\n\n![image](img/F000010si22.png)(1.11) \n\n此外，在许多沉积环境中，水平渗透率 `k`[*H]通常大于垂直渗透率\
  \ `k`[*V]。\n\n### 渗透率-孔隙度相关性\n在许多系统中，渗透率 `k` 与孔隙度 `ϕ`![image](img/F000010si21.png)\
  \ 之间存在关系。这并非总是如此，在 `k`/`ϕ` 图中可以看到很大的散点。广的来说，高渗透率岩石具有较高的孔隙度。\n\n### 达西定律\n达西最初是关于单相流的定律，它将流经孔介质的总体积流量\
  \ `Q` 与压力梯度 (∂P/∂x) 以及流体性质（`μ` 为粘度）和孔介质性质（`k` 为渗透率；`A` 为截面积）联系起来：注意，达西定律可以使用以下定义的量来定义渗透率：\n\
  \n```\nQ = - \\left( \\frac{kA}{\\\\mu} \\right)\\left( \\frac{\\partial P}{\\partial\
  \ x} \\right)$ (1.12)\n```\n（注：此处原文编号为 1.12）\n\n达西速度：这是通过 `u=Q/A` 计算出的速度 `u`；这可以表示为：\n\
  \n$u = \\frac{Q}{A} = - \\left( \\frac{k}{\\\\mu} \\right)\\left( \\frac{\\partial\
  \ P}{\\partial x} \\right)$ (1.13)\n\n孔隙速度：这是流体速度 `v`，给定为：\n\n$v = \\frac{Q}{A\\\
  phi} = \\frac{u}{\\phi}$ (1.14)\n\n## 1.4 润湿性\n\n储层岩石的润湿性影响流体驱替过程，特别是相对渗透率和毛细压力函数的形状。\n\
  \n\n\n\n\n`润湿性`。`润湿性`衡量了岩石表面被特定相——油、水或某种混合（中间）组合——润湿的偏好程度。多孔介质的润湿性决定了相对渗透和毛细压力函数的类型。\n\
  \n`水润`。`水润地层`是以水为优先润湿相的地层。水占据较小的孔隙并在整个岩石表面形成膜，即使在含有油的孔隙中也是如此。在这种系统中，注水是一个吸入过程；水自发吸入到含有剩余油饱和度\
  \ `Sor` 的移动油岩心中，从而排出油。\n\n`油润`。`油润地层`是以油为优先润湿相的地层。与上述基本原理相同，油占据了较小的孔隙并在整个岩石表面形成膜，即使在含有水的孔隙中也是如此。在这样的系统中，注水是一个排水过程；油自发吸入到含有剩余水饱和度\
  \ `S[wr]` 的移动水岩心中，从而排出水。\n\n`中等润`。`中等润地层`是指同一块岩石表现出某种程度的水油润湿性的地层。各种类型的中等润湿系统被称为混合润湿或部分润湿。水和油都可以在某种程度上自发地吸入这种系统。\n\
  \n## 1.5 流体位移过程\n\n模拟模型的选择取决于所建模的流体位移过程。\n\n`吸入`。当润湿相增加时，会发生`吸入`位移过程。例如，在水润多孔介质中，吸入是水排出油。\n\
  \n`排水`。当非润湿相增加时，会发生`排水`位移过程。例如，在水润多孔介质中，排水是油排出水。吸入和排水的毛细压力以及相对渗透函数是不同的，因为这些岩石物理函数取决于饱和度变化史。\n\
  \n`自发吸入`。当润湿相在没有任何外部驱动力的情况下侵入多孔介质时，会发生`自发吸入`过程。润湿相在表面力的作用下侵入。例如，对于处于不可压缩水饱和度 `S[wr]`\
  \ 的水润岩，水可能会自发吸入并排出油。\n\n`采油方法`。这些方法包括一级采油、二次采油（通常为注水）和三次采油（或强化采油）。一系列旨在回收一级二次采油方法无法产生的额外油的方法包括热采法（蒸汽注入或原位燃烧）、注气法（`N[2]`、`CO[2]`\
  \ 和烃类气体）、化学注水（碱、表面活性剂、聚合物和/或泡沫注入）以及微生物方法（利用细菌采油）。\n\n`过程模拟模型`。使用各种类型的多相、多组分系统流动和传输方程模型公式来模拟不同的恢复过程。它们包括黑油模型、组分模型、热力和化学模型。\n\
  \n## 1.6 多相岩石/流体性质\n\n`饱和度`：某相（油、水、气）的饱和度是其占据的`孔隙空间`的比例（而非总岩石+孔隙体积的比例）；符号为 `S[w]`、`S[o]`\
  \ 和 `S[g]`；饱和度是一个比例，其中 `S[w]+S[o]+S[g]=1`。多相流变函数（如相对渗透和毛细压力，见下文）强烈取决于局部流体饱和度。\n\n\
  `剩余饱和度`：某相的剩余饱和度是该相（孔隙空间比例）被`捕留`或`不可还原`的量；例如，在许多孔隙体积的水将油从岩石排出后，我们达到了`剩余油饱和度` `S[or]`；相应的`原生（不可还原）水水位`为\
  \ `S[wc]`（或 `S[wi]`）；相关的被捕留气饱和度为 `S[rg]`；在剩余或捕留相饱和度下，该相对应的`相对渗透`（见下文）为零。非润湿相饱和度是被毛细力捕留在孔隙中的——通常在水润砂岩中，`S[or]~0.2–0.35`——取决于岩石的渗透性和润湿性。\n\
  \n`毛细压力`：在两相流中，任何两种不相容流体（例如水和油）界面上的压力不连续。这是界面张力的结果。非润湿相（例如，油）`p[o]` 与润湿相（例如，水）`p[w]`\
  \ 之间的压力差异被称为`毛细压力`，`p[c]`：\n\n```\np[c] = p[o] - p[w]\n```\n\n其中压力是从各自侧取的。毛细压力取决于润湿相的饱和度和饱和变化的方向（吸入或排水）。曲线对饱和度的依赖现象被称为`滞后`。虽然可以开发考虑饱和度滞后的模型，但到目前，毛细压力被假设仅取决于润湿相。通常，它还取决于表面张力\
  \ `σ`、渗透率 `k` 以及与岩石接触角 `θ`：\n\n```\nJ(S) = p[c] cos θ / (σ k)\n```\n\n如果忽略接触角，该函数变为：\n\
  \n```\nJ(S) = p[c] / (σ k)\n```\n\n可以通过实验获得典型的 `p[c]` 曲线。对于三相流，需要两个毛细压力：\n\n```\n\
  p[cow] = p[o] - p[w]\np[cgo] = p[g] - p[o]\n```\n\n注意，第三种毛细压力 `p[cgw]` 可以通过 `p[cow]`\
  \ 和 `p[cgo]` 得到：\n\n```\np[cgw] = p[g] - p[w] = p[cow] + p[cgo]\n```\n\n毛细压力 `p[cow]`\
  \ 和 `p[cgo]` 通常被假设采取形式：\n\n```\np[cow] = pcow\np[cgo] = pcgo\n```\n\n其中 `S[w]` 和\
  \ `S[g]` 分别是水和气的饱和度。\n\n`相对渗透`。`相对渗透`是一个描述一相对另一相流动影响的数量（比例）。在两相流中，它是相饱和度的函数；在三相流中，它可能取决于另一相的饱和度。水、油和气相的相对渗透分别由\
  \ `k[rw]`、`k[ro]` 和 `k[rg]` 表示。\n\n### 1.6.1 两相相对渗透\n\n\n\n\n\n# 相对渗透率的测量\n\n*相对渗透率*的测量主要针对两相流进行。对于水排油的油水系统，典型的曲线如图图\
  \ 1.1 所示。水开始流动的`S[w]` 值被称为*临界饱和度*`S[wc]`，而油停止流动的`S[nc]` 值被称为*剩余饱和度*。类似地，在排吸过程中，`S[nc]`和`S[wc]`\
  \ 分别称为临界饱和度和剩余饱和度。\n\n![图 1.1 典型相对渗透率曲线。](img/F000010f01-01-9780128209578.jpg)\n\
  \n图 1.1 典型相对渗透率曲线。\n\n在数值模拟中，非剩余饱和度处的毛细压力曲线斜率必须是有限，因此这些曲线本身不能用于定义排水相变为静止的饱和度值。该饱和度是通过该相相对渗透率为零的剩余饱和度找到的。达西定律意味着相停止流动是因为迁移率变为零（而不是因为外力变为零）。因此，没有必要区分临界饱和度和剩余饱和度。\n\
  \n至于毛细压力，渗透率不仅取决于润湿相饱和度`S[w]`，还取决于饱和度变化的方向（排水或吸水）。图 1.2 显示了水润系统典型的排水和吸水毛细压力（`P[c]`）以及相对渗透率（`k[rw]`和`k[ro]`）曲线示意图。注意，吸水过程曲线始终低于排水曲线。对于润湿相，相对渗透率不取决于饱和度的历史。\n\
  \n![图 1.2 排水与吸水：（A）毛细压力和（B）相对渗透率。](img/F000010f01-02-9780128209578.jpg)\n\n图 1.2\
  \ 排水与吸水：（A）毛细压力和（B）相对渗透率。\n\n岩石的润湿性也极大地影响相对渗透率：\n\n表 1.5\n水润和油润相对渗透率的典型特征。\n\n|\
  \ ... | 水润 | 油润 |\n| --- | --- | --- |\n| `S[wc]` | 大多大于 20% | 小于 15%（通常小于 10%）\
  \ |\n| --- | --- | --- |\n| `k[rw]`=`k[ro]` 处的`S[w]`（点图 1.4 上的 A 点） | 大于 50% | 小于\
  \ 50% |\n| `S[or]` 处的`k[rw]` | 小于 0.3 | 大于 0.5 |\n\n![图 1.3 润湿性对相对渗透率的影响（在 A 点，`krw`=`kro`）：（A）水润储层和（B）油润储层。](img/F000010f01-03-9780128209578.jpg)\n\
  \n图 1.3 润湿性对相对渗透率的影响（在 A 点，`k[rw]`=`k[ro]`）：（A）水润储层和（B）油润储层。\n\n由于润湿性对渗透率的影响，实验应使用储层流体而非精制流体。必须针对每个感兴趣的多孔介质通过经验或实验确定相对渗透率。然而，文献中充满了关于相对渗透率与润湿相饱和度之间关系的解析表达式。\n\
  \n## Corey 两相相对渗透率模型。\n\nCorey 模型适用于固结岩中的排水过程。归一化润湿相饱和度为：\n\n$S_{nw} = \\frac{S_{w}\
  \ - S_{wc}}{1 - S_{wc}}$ (1.21)\n\n![image](img/F000010si32.png)(1.21)\n\n其相对渗透率给出：\n\
  \n$k[rw] = S[nw]⁴$ (1.22)\n\n![image](img/F000010si33.png)(1.22)\n\n非润湿相的相对渗透率为：\n\
  \n$k[ro] = (1-S[nw])²(1-S[nw]²)$ (1.23)\n\n![image](img/F000010si34.png)(1.23)\n\
  \n## Naar 和 Henderson 的相对渗透率模型。\n\nNaar 和 Henderson 模型适用于油水系统的吸水过程。水相相对渗透率与 1.22\
  \ 相同。\n\n$k[rw] = S[nw]⁴$ (1.24)\n\n![image](img/F000010si35.png)(1.24)\n\n而油相相对渗透率为：\n\
  \n$k_{ro} = \\left(1 - S_{nw}\\right)^{3/2}\\left(1 - S_{nw}²\\right)$ (1.25)\n\n\
  ![image](img/F000010si36.png)(1.25)\n\n## 1.6 三相相对渗透率\n\n相比之下，三相渗透率的确定相当困难。通过此，如图\
  \ 1.4 所示的三元图可以显示不同饱和度下的各相相对渗透率。\n\n![图 1.4 三相图。](img/F000010f01-04-9780128209578.jpg)\n\
  \n## 1.7 术语\n\n*黑油模型*：用于模拟多相/多组分传输方程的各种公式类型；最常见的是*黑油模型*，它可以模拟原生开采和大多数二次恢复。\n\n*网格结构*：指数值模拟中使用的网格几何形状。该网格可以是笛卡尔、径向或变形的，并且可能是\
  \ 1D、2D 或 3D。\n\n*空间离散*：将空间网格划分为Δ*x*、Δ*y*和Δ*z*单元的过程。在储层模拟中，我们总是像下面的网格示例一样将储层“切成”单元块。\n\
  \n*时间离散*：将时间步划分为Δ*t*单元的过程。\n\n*二维平面网格*：如图 1.5 所示的二维网格结构，从俯视角度向下施加。对于笛卡尔系统，它将储层中的\
  \ x 方向和 y 方向划分为Δ*x*和Δ*y*的增量。\n\n\n\n\n\n## 2D 截面模型\n这是一种施加在储层垂直剖面上的 2D 网格结构。对于笛卡尔坐标系，它将储层中的\
  \ `x` 和 `z` 方向划分为增量为 `Δx` 和 `Δz` 的单元。进行截面计算是为了评估系统中垂直分层产生的影响，并为上标计算生成伪函数。图 1.6。\n\
  \n![图 1.6 2D 截面网格。](img/F000010f01-06-9780128209578.jpg)\n图 1.6 2D 截面网格。\n\n## 3D\
  \ 笛卡尔网格\n在构建储层或部分储层部分的相对简单模型时，3D 笛卡尔网格是最常用的网格。这如图图 1.7 所示。\n\n![图 1.7 用于储层模拟的 3D\
  \ 笛卡尔网格。](img/F000010f01-07-9780128209578.jpg)\n图 1.7 用于储层模拟的 3D 笛卡尔网格。\n\n## 渗透率\n\
  两个相邻网格块之间的渗透率衡量了流体在它们之间流动的难易程度。例如，对于两相流，两个块界面水的渗透率为为：\n\n$T\\\\_{w} = \\\\left(\
  \ \\\\frac{kA}{\\\\\\Delta x} \\\\right)\\_{av}\\\\left( \\\\frac{k\\\\_{rw}}{\\\
  \\mu\\\\_{w}B\\\\_{w}} \\\\right)\\_{av}$ (1.28)\n\n![image](img/F000010si39.png)(1.28)\
  \ 其中 `A` 是界面的截面积。该量由两部分组成，每部分都是块之间的平均值：单相部分（`kA/Δx`）[`av`] 和两相部分（`k[rw]/(*µ[w]B[w]*))`[`av`]。单相部分的平均将是块之间的`调和平均值`。两相部分的平均更为复杂。平均相对渗透率将使用`上游加权`，而粘度和体积容数因子之间将使用块之间的`算术平均值`。\n\
  \n## 数值弥散\n在水驱等位移过程中，由于数值效应导致驱替前沿扩散现象被称为`数值弥散`。这是由于网格划分产生空间（`Δx`）和时间（`Δt`）离散化或截断误差引起的。这种波前的扩散往往会导致早突破以及恢复中的其他误差。误差的好坏取决于正在模拟的实际流体恢复情况（例如水驱和水气循环）、空间时间和步长以及所使用的数值方法。\n\
  \n## 网格取向\n当流体流动既沿主网格方向，又对角线跨越该网格时，就会出现`网格取向`问题，如图图 1.8 所示。通过网格的每种流体“路径”数值结果都是不同的。问题的产生是由于在`空间离散化`中使用了`五点差分格式`（在`2D`中）。可以通过使用更复杂的格式，如`九点格式`（在`2D`中）来缓解。\n\
  \n![图 1.8 箭头显示了取向网格中的流体路径，对角线流动导致网格误差。](img/F000010f01-08-9780128209578.jpg)\n图\
  \ 1.8 箭头显示了取向网格中的流体路径，对角线流动导致网格误差。\n\n## 局部网格加密 (LGR)\n`LGR`是指在`LGR`物理量（如压力或饱和度）变化快速的区域使模拟网格变细。其核心思想是在重要的地方提高模拟精度，而不是在储层各处。例如，在井附近或驱替区域使用\
  \ LGR，而在含水层中使用较粗的网格。\n\n## 混合网格 LGR\n`混合网格`是不同几何形状网的组合，用于改进不同区域流动的建模。混合网格最常用的方法是笛卡尔/径向组合，在井附近使用径向网格。混合网格\
  \ LGR 可以与其他 LGR 方案类似的方式使用。`LGR`和混合网格结构的一个简单示例如图图 1.9 所示。\n\n![图 1.9 LGR 示意图。局部网格加密。](img/F000010f01-09-9780128209578.jpg)\n\
  图 1.9 LGR 示意图。`LGR`，局部网格加密。\n\n## 变形网格\n`变形网格`是一种经过“弯曲”的网格结构，以更密切地遵循特定情况下的流线或系统几何形状。\n\
  \n## 角点几何形状\n在某些模拟器（例如 Eclipse）中，存在输入网格块顶点几何的选项。这允许用户定义更好地匹配系统形状的复杂几何结构。这种选项被称为角点几何，它要求相应地修改块与块之间的渗透率。`角点几何`的思想在图\
  \ 1.10 中进行了示意。\n\n![图 1.10 断层和变形网格结构。](img/F000010f01-10-9780128209578.jpg)\n图 1.10\
  \ 断层和变形网格结构。\n\n## 历史匹配\n数值模拟中的历史匹配是调整模拟器输入以更好地拟合储层性能的过程。理想情况下，模拟的变化应最密切地反映地质知识，例如高渗透带和密封断层的存在。通常匹配的观测值是现场和单井产量、水切以及压力。\n\
  \n## 质量守恒\n质量守恒是检查模拟方法准确性的一种通用原理。其简单表述如下：\n\n`块入`` – `块出` = `块内积累`。\n\n![image](img/F000010si40.png)\n\
  \n连续方程可以通过质量守恒律导出。储层模型基本上由质量守恒和将流体速度与压力（或势）联系起来的达西定律组成。对于孔隙尺度模拟，质量守恒与动量守恒结合得到纳维-斯克斯方程。在热力方法中，加入了能量守恒。\n\
  \n### 1.7.1 纳维-斯克斯方程\n虽然纳维-斯克斯名称最初指的是线性动量守恒方程，但现在泛指质量、动量能量守恒方程。这些方程可以描述广泛的流体流动配置，无论是飓风内部还是涡轮内部、飞机还是潜艇周围、动脉还是肺部、泵还是压缩机内部，纳维-斯克斯方程都能描述这些现象。\n\
  \n#### 1.7.1.1 质量守恒（连续方程）\n质量守恒原理表明，在没有质量源和汇的情况下，一个区域在局部上保持其质量。质量守恒或连续方程的微分形式为：\n\
  \n$\\\\frac{\\\\partial\\\\rho}{\\\\partial t} + \\\\nabla \\\\cdot \\\\left\\\\\
  rbrack {\\\\rho\\\\mathbf{v}} \\\\right\\\\rbrack = 0$ (1.29)\n\n在没有显著绝对压力或温度变化的情况下，可以假设流动是不可压缩的；即压力变化对密度没有显著影响。这在液体中几乎总是成立的，在气体速度远小于声速的情况下也是良好的近似。\n\
  \n\n\n\n\n`Eq. (1.30)` 表明对于不可压缩流，通过任何控制体积的净流量为零，即“流出”=“流入”。\n\n### 1.7.1.2 动量守恒\n\
  \n动量守恒原理表明，在没有外力作用于物体的情况下，物体保持其总动量，即质量与速度向量的乘积。由于动量是一个矢量量，它在任何方向上的分量也将守恒。\n\n牛顿流体动量方程的最终保守形式为\n\
  \n```\n\\frac{\\\\partial}{\\partial t}\\left\\lbrack {\\\\rho\\mathbf{v}} \\right\\\
  rbrack + \\nabla \\cdot \\left\\{ {\\\\rho\\mathbf{v}\\\\mathbf{v}} \\right\\} =\
  \ - \\nabla \\cdot p + \\nabla \\cdot \\left\\{ {\\\\mu\\left\\\\lbrack {\\\\nabla\\\
  \\mathbf{v} + \\left( {\\\\nabla\\\\mathbf{v}} \\\\right)^{T}} \\right\\rbrack}\
  \ \\right\\} + \\nabla\\left( {\\\\lambda\\nabla \\cdot \\mathbf{v}} \\right) +\
  \ \\mathbf{f}\\_{b} (1.31)\n```\n\n![image](img/F000010si43.png)(1.31) \n\n对于不可压缩流，速度向量的散度为零，即`∇ ⋅ v` = 0`![image](img/F000010si44.png)，且动量方程简化为\n\
  \n```\n\\frac{\\\\partial}{\\partial t}\\left\\lbrack {\\\\rho\\mathbf{v}} \\right\\\
  rbrack + \\nabla \\cdot \\left\\{ {\\\\rho\\mathbf{v}\\\\mathbf{v}} \\right\\} =\
  \ - \\nabla \\cdot p + \\nabla \\cdot \\left\\{ {\\\\mu\\left\\\\lbrack {\\\\nabla\\\
  \\mathbf{v} + \\left( {\\\\nabla\\\\mathbf{v}} \\\\right)^{T}} \\right\\rbrack}\
  \ \\right\\} + \\mathbf{f}\\_{b} (1.32)\n```\n\n![image](img/F000010si45.png)(1.32)\
  \ \n\n如果粘度为常数，动量方程可以进一步简化为\n\n```\n\\frac{\\\\partial}{\\partial t}\\left\\lbrack\
  \ {\\\\rho\\mathbf{v}} \\right\\rbrack + \\nabla \\cdot \\left\\{ {\\\\rho\\mathbf{v}\\\
  \\mathbf{v}} \\right\\} = - \\nabla \\cdot p + \\mu\\nabla^{2}\\mathbf{v} + \\mathbf{f}\\\
  _{b} (1.33)\n```\n\n![image](img/F000010si46.png)(1.33) \n\n其中 `f`[*b*]`![image](img/F000010si47.png)\
  \ 代表体体力，它以单位体积力的形式表示，也可能由于多种效应引起。\n\n### 1.7.1.3 能量守恒\n\n能量守恒受热力学第一定律支配，该定律规定能量在过程中既不会被创造也不会被破坏；它只能从一种形式（机械、动能、化学等）变为另一种形式。因此，孤立系统中所有形式能量的总和保持不变。\n\
  \n用温度表示，能量方程写为\n\n```\n\\frac{\\\\partial}{\\partial t}\\left( {\\\\rho c\\_{p}T}\
  \ \\right) + \\nabla \\cdot \\left\\lbrack {\\\\rho c\\_{p}\\\\mathbf{v}T} \\right\\\
  rbrack = \\nabla \\cdot \\left\\lbrack {\\\\k\\nabla T} \\right\\rbrack + Q^{T}\
  \ (1.34)\n```\n\n![image](img/F000010si48.png)(1.34)  \n## 参考文献\n\n1. Ashford, F.E.,\
