  \ n_{1} \\times n_{\\mathit{aq}} \\right)$\n\n### 4.5.4 算法\n\n在没有矿物溶解/沉淀的情况下，连续方程可以简化为：\n\
  \n\n\n\n\n$\\frac{\\partial\\left( \\phi u \\right)}{\\partial t} + \\mathit{UL}\
  \ = 0$ (4.252)\n\n![image](img/F000046si905.png)(4.252) \n\n如果矿物溶解或沉淀作用不可忽略不计，则需要将非线性反应传输方程建模为：\n\
  \n$\\frac{\\partial\\left( \\phi u \\right)}{\\partial t} + \\mathit{UL} = U\\left(\
  \ V_{\\_{\\mathit{aq}}^{k} \\right)^{T}r^{k}$ (4.253)\n\n![image](img/F000046si906.png)(4.253)\
  \ \n\n顺序过程的数学描述可以通过`sequential method`（顺序法）通过两个步骤进行建模：\n\n${Transport}{step}\\phi\\\
  frac{u^{\\*} - u^{n}}{\\text{Δ}t} = - \\mathit{UL}$ (4.254)\n\n![image](img/F000046si907.png)(4.254)\
  \ \n\n${Reaction}{step}\\frac{\\left( \\phi u \\right)^{n + 1} - \\left( \\phi u\
  \ \\right)^{\\*}}{\\text{Δ}t} = U\\left( V_{\\_{\\mathit{aq}}^{k} \\right)^{T}r^{k}$\
  \ (4.255)\n\n![image](img/F000046si908.png)(4.255) \n\n在每个时间步内，一旦获得了组分`u`![image](img/F000046si909.png)的浓度，就可以立即计算所有物种`c`![image](img/F000046si910.png)的浓度。该过程被称为物种化计算（speciation\
  \ calculation），通过求解组分定义方程和质量作用律来实现：\n\n`u` = `c*[1] − (*V*[1]^(*e*))^(*T*)*c*[2]`\
  \ (4.256)\n\n![image](img/F000046si911.png)(4.256) \n\nlog `c*[2] = − *V*[1]^(*e*)log *c*[1]\
  \  + log *K*^(*e*) − *V*[1]^(*e*)log *γ*[1]  − log *γ*[2]` (4.257)\n\n![image](img/F000046si912.png)(4.257)\
  \ \n\n一种`global implicit method`（全局隐式法），也称为全耦合法或单步法，其中流场和反应传输方程被同时求解。根据未知数选择的不同，全局隐式法分为两类：一种是在任何迭代中直接求解组分浓度，然后进行物种化计算以确定所有物种的浓度；另一种方法是直接代换法，将平衡方程和动力学速率方程直接代入传输方程，从而得到一组非线性偏微分方程（PDE）。然后使用\
  \ Newton–Raphson 迭代法同时求解这些方程。\n\n## 4.6 不连续 Galerkin 方法\n\nDG 方法最近在各种问题中受到了广泛关注。\n\
  \n### 4.6.1 数学模型\n\n我们假设给定达西（Darcy）速度场`u`![image](img/F000046si916.png)，它是与时间无关的，并且满足\
  \ ∇ ⋅ **u** = `q`![image](img/F000046si917.png)，其中 `q`![image](img/F000046si918.png)\
  \ 是对流-扩散-反应流问题中施加的外部总流量。我们用 `Γ`[*i**n*]![image](img/F000046si919.png) 表示入口边界，用 `Γ`[*o**u*]![image](img/F000046si920.png)\
  \ 表示出口/无流边界，如下：\n\n$\\begin{matrix} & {\\\\Gamma\\_{in} = \\\\mathit{\\\\{ \\\\\
  x} \\in \\\\partial\\\\Omega\\\\text{:}\\\\mathbf{u}\\\\cdot\\\\mathbf{n} < 0\\\\\
  ,} \\\\\\\\ & {\\\\Gamma\\_{out} = \\\\mathit{\\\\{ \\\\x} \\in \\\\partial\\\\\
  Omega\\\\text{:}\\\\mathbf{u}\\\\cdot\\\\mathbf{n}\\\\geqslant 0\\\\,} \\\\\\\\\
  \ \\\\end{matrix}$ (4.258)\n\n![image](img/F000046si921.png)(4.258) \n\n其中 **n**![image](img/F000046si922.png)\
  \ 表示指向 ∂*Ω*![image](img/F000046si923.png) 的单位外法向量，而 *Ω*![image](img/F000046si924.png)\
  \ 是多边形且在 ℝ(*d*) 有界。令 `T`![image](img/F000046si926.png) 为多孔介质中单相的经典对流-扩散-反应方程：\n\n\
  $\\frac{\\partial\\phi c}{\\partial t} + \\nabla\\left( \\mathbf{u}c - \\mathbf{D}\\\
  left( \\mathbf{u} \\right)\\nabla c \\right) = \\mathit{qc*} + r\\left( c \\right),\\\
  left( x,t \\right) \\in \\Omega \\times \\left( 0,T \\right]$ (4.259)\n\n![image](img/F000046si927.png)(4.259)\n\
  \n其中未知变量 `c`![image](img/F000046si928.png) 是物种浓度（单位体积）。此处，`phi`![image](img/F000046si929.png)\
  \ 是孔隙率，假设与时间无关且在上下有界；**D**(**u**)![image](img/F000046si930.png) 是色散/扩散张量，假设是正定的且有界；`r(c)`![image](img/F000046si931.png)\
  \ 是反应项；`qc*`![image](img/F000046si932.png) 是源/汇项，其中施加的外部流量 `q` 是源（注入）和汇（提取）之和；`c^*`![image](img/F000046si933.png)\
  \ 在 `q`geqslant 0 时为注入浓度 `c[*w]`![image](img/F000046si934.png)，在 `q`<0 时为残留浓度 `c`![image](img/F000046si936.png)。我们针对该问题考虑以下边界条件：\n\
  \n(**u***c−**D**(**u**)∇*c*) ⋅ **n** = `c[*B*]u** ⋅ **n**, (*x*,t*) ∈ `Γ`[*i**n*] × (0,*T*],\
  \ (4.260)\n\n![image](img/F000046si938.png)(4.260)\n\n(−**D**(**u**)∇*c*) ⋅ **n** = 0, (*x*,t*) ∈ `Γ`[*o**u*] × (0,*T*],\
  \ (4.261)\n\n![image](img/F000046si939.png)(4.261)\n\n其中 `c[*B*]`![image](img/F000046si940.png)\
  \ 是入口浓度。初始浓度规定为：\n\n`c`(*x*,0) = `c*0), *x* ∈ *Ω*. (4.262)\n\n![image](img/F000046si941.png)(4.262)\
  \ \n\n令 ℰ*h*![image 为 *Ω*![image](img/F000046si943.png) 的一组非退化、准均匀且可能的非共形划分，当 `d`=2![image](img/F000046si944.png)\
  \ 时，由三角形或四边形组成；当 `d`=3![image](img/F000046si945.png) 时，由四面体、棱柱或六面体组成。我们假设没有单元跨越\
  \ `Γ`[*i**n*]![image](img/F000046si946.png) 和 `Γ`[*o**u*]![image](img/F000046si947.png)\
  \ 中的边界。`Γ`*h*![image 的所有内部边（对于 2D 区域）或面（对于 3D 区域）的集合用 `Γ`*h*![image 表示。对于 `s`≥1/2![image](img/F000046si950.png)，我们定义\n\
  \nH^s(Γ[h])`![image](img/F000046si952.png) 上的常规 Sobolev 范数记为 `\\|·\\|_m`。破碎范数（broken\
  \ norms）对于 `m`geqslant0![image](img/F000046si953.png) 定义为：\n\n$\\mathit{|||\\phi|||_{2}\
  \ = \\sum\\limits_{E \\in \\mathcal{E}}}{\\|\\phi\\|_{E}^{2}}$ (4.264)\n\n![image](img/F000046si954.png)(4.264)\
  \ \n\n我们现在对 `phi`∈`H^s(Γ[h])`![image](img/F000046si955.png) 定义平均值和跳跃。令 `E[i], E[j]`∈`Γ[h]`![image](img/F000046si957.png)，我们定义：\n\
  \n$\\{\\phi\\} = \\frac{1}{2}\\left( \\phi|_{E_{i}} \\right)_{\\gamma} + \\left(\
  \ \\phi|_{E_{j}} \\right)_{\\gamma}$ (4.265)\n\n![image](img/F000046si958.png)(4.265)\
  \ \n\n`[phi]` = `(phi|E[i])-(phi|E[j])` (4.266)\n\n![image](img/F000046si959.png)(4.266)\
  \ \n\n将浓度 `c^*)|[*gamma*]`![image](img/F000046si960.png) 的上风值定义如下：\n\n$c^{\\*}|\\\
  _{\\gamma} = \\left\\{ \\begin{matrix} {c|_{E_{i}}} & {{\\text{if}}\\mathbf{u}\\\
  cdot\\mathbf{n}_{\\gamma}\\geqslant 0} \\\\ {c|_{E_{j}}} & {{\\text{if}}\\mathbf{u}\\\
  cdot\\mathbf{n}_{\\gamma} < 0.} \\\\ \\end{matrix} \\right.$ (4.267)\n\n![image](img/F000046si961.png)(4.267)\n\
  \n不连续有限元空间取为\n\n\U0001D49Fr \\equiv \\{\\phi \\in L²(\\Omega) : \\phi|_E \\in \\\
  mathbb{P}^r(E), E \\in \\mathcal{E}_h\\},$ (4.268)\n\n\n\n\n\n![image](img/F000046si962.png)(4.268)\n\
  \n其中 `ℙ*r*`![image](img/F000046si963.png) 表示在 `E` 上（总）度数小于或等于 `r` 的多项式空间![image](img/F000046si964.png)![image](img/F000046si965.png)。“截断”算子\
  \ `ℳ`![image](img/F000046si966.png) 定义为\n\nℳ(*c*)(*x*) = min (*c*(*x*),*M*), (4.269)\n\
  \n![image](img/F000046si967.png)(4.269)\n\n其中 `M`![image](img/F000046si968.png)\
  \ 是一个很大的正数。该算子是一致 Lipschitz 连续的，其 Lipschitz 常数数为 1；即：\n\n∥ℳ(*c*) − ℳ(*w*)∥[*L*^∞(*Ω*)] ≤ ∥*c* − *w*∥[*L*^∞(*Ω*)].\
  \ (4.270)\n\n![image](img/F000046si969.png)(4.270)\n\n令 `E` ∈ `ℰ[*h]`![image](img/F000046si970.png)\
  \ 且 `ϕ` ∈ `H^(*S*)(*E*)`![image](img/F000046si971.png)，并令 `h[*E]`![image](img/F000046si972.png)\
  \ 表示 `E` 的直径![image](img/F000046si973.png)。存在一个常数 `K`![image](img/F000046si974.png)，它独立于\
  \ `ϕ`![image](img/F000046si975.png)、`r`![image](img/F000046si976.png) 和 `h[*E]`![image](img/F000046si977.png)，且存在序列\
  \ `r`=1, 2, …,，使得：\n\n```\n\\left\\{ \\begin{matrix} {\\|\\phi - z_{r}^{h}\\|_{_{q,E}\\\
  leqslant K\\frac{h_{E}^{\\mu - q}}{r^{s - q}}\\|\\phi\\|_{s,E}} & {0\\leqslant q\
  \ < \\mu,} \\\\ {\\|\\phi - z_{r}^{h}\\|_{_{q,\\partial E}\\leqslant K\\frac{h_{E}^{\\\
  mu - q - (1/2)}}{r^{s - q - (1/2)}}\\|\\phi\\|_{s,E}} & {0\\leqslant q < \\mu -\
  \ \\frac{1}{2},} \\\\ \\end{matrix} \\right.\n```\n\n![image](img/F000046si978.png)(4.271)\n\
  \n其中 `μ` = `min(*r*+1,*s*)`![image](img/F000046si979.png)。我们令 `E` ∈ `ℰ[*h]`![image](img/F000046si980.png)\
  \ 且 `v` ∈ `ℙ*r`![image](img/F000046si981.png)。存在一个常数 `K`![image](img/F000046si982.png)，它独立于\
  \ `v`![image](img/F000046si983.png)、`r`![image](img/F000046si984.png) 和 `h[*E]`![image](img/F000046si985.png)，使得：\n\
  \n```\n\\left\\{ \\begin{matrix} {\\|D^{q}v\\|_{_{0,\\partial E}\\leqslant K\\frac{r}{h_{E}^{1/2}}\\\
  | D^{q}v\\|_{_{0,E}},q\\geqslant 0} \\\\ {\\|D^{q + 1}v\\|_{_{0,E}\\leqslant K\\\
  frac{r^{2}}{h_{E}}\\| D^{q}v\\|_{_{0,E}}q\\geqslant 0.} \\\\ \\end{matrix} \\right.\n\
  ```\n\n![image](img/F000046si986.png)(4.272)\n\n我们引入双线性形式 `B(*c*,w*;u)`![image](img/F000046si987.png)，其定义如下：\n\
  \n```\n\\begin{matrix} {B(c,w;\\mathbf{u}) = \\sum_{E \\in \\mathcal{E}\\_{h}}\\\
  int_{E}{(\\mathbf{D}(\\mathbf{u})\\nabla c - c\\mathbf{u}) \\cdot \\nabla wdx -\
  \ \\int_{\\Omega}{cq^{-}wdx} - \\sum_{\\gamma \\in \\Gamma\\_{h}}\\int_{\\gamma}\\\
  left\\{ \\mathbf{D}(\\mathbf{u})\\nabla c \\cdot \\mathbf{n}_{\\gamma} \\right\\\
  }\\left[ w \\right] ds \\\\ {- s_{form}\\sum_{\\gamma \\in \\Gamma\\_{h}}\\int_{\\\
  gamma}\\left\\{ \\mathbf{D}(\\mathbf{u})\\nabla w \\cdot \\mathbf{n}_{\\gamma} \\\
  right\\}\\left[ c \\right] ds + \\sum_{\\gamma \\in \\Gamma\\_{h}}\\int_{\\gamma}c\\\
  mathbf{u} \\cdot \\mathbf{n}_{\\gamma}\\left[ w \\right] ds} +\\\\ {\\sum_{\\gamma\
  \ \\in \\Gamma\\_{out}}}\\int_{\\gamma}c\\mathbf{u} \\cdot \\mathbf{n}_{\\gamma}w\
  \ + J_{0}^{\\sigma}(c,w)},\\\\ \\end{matrix}\n```\n\n![image](img/F000046si988.png)(4.273)\n\
  \n其中对于非对称公式，`s[*form]` =`1`![image](img/F000046si989.png)，对于对称方案，`s[*form]` =`1`![image](img/F000046si990.png)。`q^+`![image](img/F000046si991.png)\
  \ 和 `q^-`![image](img/F000046si992.png) 分别是注入和提取项，即：\n\n```\nq^+ = max(*q*,0), q^-\
  \ = min(*q*,0).\n```\n\n(4.274)\n\n![image](img/F000046si993.png)\n\n根据定义，`q = q^+\
  \ + q^-`![image](img/F000046si994.png)。此外，我们定义内部惩罚项 `J0(c*,w)`![image](img/F000046si995.png)为：\n\
  \n```\nJ_{0}^{\\sigma}(c,w) = \\sum_{\\gamma \\in \\Gamma_{h}}\\frac{r^{2}\\sigma_{\\\
  gamma}}{h_{\\gamma}}\\int_{\\gamma}\\left[ c \\right]\\left[ w \\right]ds,\n```\n\
  \n(4.275)\n\n![image](img/F000046si996.png)\n\n其中 `σ` 是一个离散正函数，在边或面 `γ`![image](img/F000046si997.png)上取常数值\
  \ `σ[*γ]`。线性泛函 `L(*w*;u,*c)`![image](img/F000046si1000.png) 定义为：\n\n```\nL(w;\\\
  mathbf{u},c) = \\int_{\\Omega}r\\left( \\mathcal{M}\\left( c \\right)\\right)w +\
  \ \\int_{\\Omega}c_{w^{+}}w - \\sum_{\\gamma \\in \\Gamma_{h},{in}}}\\int_{\\gamma}c_{B}\\\
  mathbf{u}\\cdot\\mathbf{n}_{\\gamma}wds.\n```\n\n(4.276)\n\n![image](img/F000046si1001.png)\n\
  \n反应传输问题的弱形式可以建模为：\n\n```\n\\left( \\frac{\\partial\\phi c}{\\partial t},w \\right)\
  \ + B\\left( c,w;\\mathbf{u} \\right) = L\\left( w;\\mathbf{u},c \\right)\\forall\
  \ w \\in H^{s}\\left( \\mathcal{E}_{h} \\right),s > \\frac{3}{2}\\forall t \\in\
  \ \\left( {0,T} \\right),\n```\n\n(4.277)\n\n![image](img/F000046si1002.png)\n\n\
  如果 `c` 是 Eq. (4.259) 的解且本质有界，则连续时间 DG 逼解 `C(*DG*)` ∈ `W^(1,∞)(0,*T*;\U0001D49F*r)`![image](img/F000046si1004.png)\
  \ 定义为：\n\n```\n\\left( \\frac{\\partial\\phi C^{DG}}{\\partial t},w \\right) + B\\\
  left( C^{DG},w;\\mathbf{u} \\right) = L\\left( w;\\mathbf{u},C^{DG} \\right),w \\\
  in \\mathcal{D}_{r}\\left( \\mathcal{E}_{h} \\right),t \\in \\left( 0,T \\right],\n\
  ```\n\n(4.278)\n\n![image](img/F000046si1005.png)\n\n`C(*DG*)`, `w`=`σ[0]`, `w`∈`D*r`,\
  \ `t`=0。\n\n(4.279)\n\n![image](img/F000046si110.png)\n\n### 4.6.2 不连续伽辽可金方法的性质\n\
  \n假设反应速率是局部连续函数。则 DG 方案对于所有 `t>0` 都有唯一解。\n\n\n\n\n$\\\\| C^{DG} - c\\\\|\\_{L^{\\\
  \\infty}(0,T\\\\text{;}L^{2})} + \\\\mathit{|||}\\\\mathbf{D}^{1/2}\\\\left( \\\\\
  mathbf{u} \\\\right)\\\\nabla\\\\left( C^{DG} - c \\\\right)\\\\mathit{||}|\\_{L^{2}(0,T\\\
  \\text{;}L^{2})} + \\\\left( {\\\\int\\\\limits\\\\_{0}^{T}{J\\\\_{0}^{\\\\sigma}\\\
  \\left( C^{DG} - c,C^{DG} - c \\\\right)\\\\mathit{dt}}} \\\\right)^{1/2}\\\\leqslant\
  \ K\\\\frac{h^{\\\\mu - 1}}{r^{s - 1 - (\\\\delta/2)}}\\\\mathit{|||c||}|\\_{L^{2}(0,T\\\
  \\text{;}H^{s})} + K\\\\frac{h^{\\\\mu - 1}}{r^{s - 1}}\\\\left( \\\\mathit{|||}\\\
  \\partial c/\\\\partial\\\\mathit{t||}|\\_{L^{2}(0,T\\\\text{;}H^{s - 1})} + \\\\\
