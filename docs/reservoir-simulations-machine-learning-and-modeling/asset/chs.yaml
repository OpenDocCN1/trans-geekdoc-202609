  \ *Annu Rev Fluid Mech.* 1998;30(1):329–364.\n\n\n\n\n# 引言\n\n孔隙尺度储层建模是储层表征的一个分支，侧重于在各种成像设备（如微型\
  \ X 射线计算机层扫描 `µ-CT`、扫描电子显微镜 `SEM`、聚焦离子束扫描电子显微镜 `FIB-SEM` 以及常规光学显微镜）构建储层的内部结构。利用这些成像设备，可以在二维（2D）或三维（3D）空间内建立岩样内部结构的数字化模型，并进一步应用于储层评价。随着人工智能技术的兴起，机器学习在几乎所有工业领域都发挥着日益重要的作用——石油工程也不例外。石油工程是一个巨大的系统，机器学习技术已经渗透到石油工程的大多数分支领域。在本章中，将以孔隙尺度储层建模为例，展示机器学习对石油工程的深远影响。岩样的三维高分辨率内部结构是孔隙尺度储层表征的基础。合格的孔隙结构需要满足两个基本要求：高分辨率和足够的视野（`FOV`）。图像的高分辨率确保了有效捕捉对孔隙网络拓扑特征至关重要的微小结构，而足够的\
  \ `FOV` 则确保了获得的三维模型覆盖了目标岩样的异质性，并确保建立的三维模型是无偏的。目前，数字化获取岩样高分辨率孔隙结构有两种流行方法，包括直接成像和数值重建。\n\
  \n在这些成像技术中，`µ-CT` 被认为是非破坏获取多孔介质三维内部结构的最直接方法。然而，其微米级的分辨率限制了它对纳米通道等对流体传输至关重要的小结构的检测。`SEM`\
  \ 具有数纳米级分辨率扫描样品的能力，但它只提供二维图像，不足以更高维度描述岩样。`FIB-SEM` 平衡了高分辨率和三维，但由于其微米级的 `FOV`，无法满足样品尺寸的要求。如今，解决这一问题的有效方法是通过应用数值重建方法提高\
  \ `µ-CT` 图像的分辨率。\n\n储层岩石三维内部孔隙结构的孔隙尺度数值重建是另一种数字成像技术的有效方法。这种方法使得根据一个或多个二维图像或实验室获得的结构属性（如孔隙度、粒径分布）生成三维孔隙结构成为可能。尽管多种成像设备的通用使用可以直接提供孔隙结构，但孔隙结构的数值建模仍具有某些不可替代的优势。首先，由于之前讨论的一些内在局限性，除了极少数孔喉直径较大的均质储层外，目前没有任何成像设备能提供同时满足分辨率和\
  \ `FOV` 的孔隙结构。其次，在某些情况下，只能获取储层样本的二维图像，例如钻岩碎片，可以使用数值建模来重建三维孔隙结构。第三，数值建模是一种方便且低成本的技术，具有通用适用性。\n\
  \n如上述讨论，孔隙尺度储层建模的研究分为两个分支：(1) 提高 `µ-CT` 图像的分辨率以增强其检测微小结构的能力；(2) 使用局部训练图像（二维或三维）重建三维孔隙结构。在本章的剩余部分，将分别介绍基于局部相似性的孔隙结构重建和数值重建算法，以证明机器学习在孔隙尺度储层建模中的应用。\n\
  \n## 关键词\n`FOV`；`SEM`；卷积神经网络；`max-pooling`；`图像退化机制`；高分辨率和低分辨率图像\n\n## 目录\n\n###\
