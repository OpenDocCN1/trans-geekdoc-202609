  \ 维度。\n\n### 2.4.1.3 双相流压力方程\n\n选择非湿相压力和湿相饱和度作为主变量，双相流压力方程为：\n\n$-\\nabla\\cdot$`k`*`λ`[`t`\\\
  nabla*p`n`=`R`[`H`[`r`` (2.119)![image](img/F000022si334.png)(2.119)\n\n以及\n\n`R``H`[`r`=`q``t`-\\\
  nabla\\cdot$`k`*`λ`\\nabla*p`c`+(`λ`[`w`]*rho[`w`]+`λ`[`n`]*rho[`n`]) (2.120)![image](img/F000022si335.png)(2.120)，其中对于给定的\
