  \ (5.132) 可以推导出平衡态和非平衡态分布与其宏观变量满足以下关系：\n\n$$0 = {\\\\sum\\\\limits\\\\_{i}{f\\\\\
  _{i}^{(k)},0 =}}{\\\\sum\\\\limits\\\\_{i}f\\\\_{i}^{(k)}}\\\\mathbf{e}\\_{mathit{i}},{for}\\\
  \\mathit{k} = 1,2.$ (5.139)$$\n\n![image](img/F000058si551.png)(5.139)\n\n随后将 CE\
  \ 展开转移到：\n\n$$\\frac{\\\\partial}{\\\\partial t} = K\\\\frac{\\\\partial}{\\\\partial\
