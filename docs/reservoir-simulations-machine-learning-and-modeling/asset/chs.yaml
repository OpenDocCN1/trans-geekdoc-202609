  \n### 3.2.5 热力学稳定性\n\n我们首先引入热力学性的定义，这是高效方案所需要的。根据热力学第二定律，熵随时间增加，即 `dS/dt` ≥ 0![image](img/F000034si370.png)，因此推导出：\n\
  \n```\n\\begin{matrix} {\\\\frac{dF}{dt} + p_{c}\\\\frac{dV^{G}}{dt} \\\\leq 0.}\
  \ & & \\end{matrix}\n```\n(3.84) ![image](img/F000034si371.png)(3.84) 对时间间隔 `t`[`k]`,`t`[`k`+1\\\
  ])![image](img/F000034si372.png) 积分得到：\n\n```\n\\begin{matrix} {F^{k + 1}-F^{k}\
  \ + \\\\int\\_{t_{k}}^{t_{k + 1}}{p_{c}\\\\frac{\\partial V^{G}}{\\partial t} \\\
  \\leq 0.} & \\end{matrix}\n```\n(3.85) ![image](img/F000034si373.png)(3.85) 如果 `p`[`c]`\
  \ 是给定的常数，则之前的不等式简化为：\n\n```\n\\begin{matrix} {F^{k + 1}-F^{k} + p_{c}\\\\left( {V^{G,\
  \ k + 1}-V^{G,k}} \\right) \\\\leq 0.} & & \\end{matrix}\n```\n(3.86) ![image](img/F000034si375.png)(3.86)\
  \ 如果 `p`[`c]` 是 `N`[`G]`和 `V`[`G]`的函数，那么对不等式应用求积法则并很容易得到：\n\n```\n\\begin{matrix}\
  \ {F^{k + 1}-F^{k} + p_{c}^{\\*}\\\\left( {V^{G, k + 1}-V^{G,k}} \\right) \\\\leq\
  \ 0,} & & \\end{matrix}\n```\n(3.87) ![image](img/F000034si378.png)(3.87) 其中 `p`[`c]`^(\\\
  *) 是等于 `k`th 时间步和 (`k`+1)*th*![image](img/F000034si380.png) 时间步之间某个值的毛细压力。对于特定的毛细压力离散化，如果离散方案满足该不等式，我们称该方案为热力学稳定方案。如果忽略了毛细作用，则热力学稳定性变为能量稳定性。\n\
  \n\n\n\n将等式 (3.79)乘以 `μ`[`i`]^(`G`,`k`+`(1/2)`)−`μ`[`i`]^(`L`,`k`+`(1/2)`)![image](img/F000034si381.png)，我们可以得到\n\
  \n$\\\\left( {\\\\mu\\_{i}^{G,k + (1/2)}-\\\\mu\\_{i}^{L,k + (1/2)}} \\\\right)\\\
  \\frac{N\\_{i}^{G,k + 1}-N\\_{i}^{G,k}}{\\delta t\\_{k}} = -\\\\frac{D\\_{i}N\\\
  _{i}^{t}}{\\\\mathit{RT}}\\\\left( {\\\\mu\\_{i}^{L,k + (1/2)}-\\\\mu\\_{i}^{G,k\
  \ + (1/2)}} \\\\right)^{2}.$ (3.88)\n\n![image](img/F000034si382.png)(3.88)\n\n\
  将上述方程从 `i` = 1![image](img/F000034si383.png) 到 `M`![image](img/F000034si384.png)\
  \ 求和，并考虑凸-凹性质，很容易得到\n\n$\\\\beginbegin{matrix} {\\\\frac{F\\\\left( \\\\mathbf{N}^{G,k\
  \ + 1},V^{G,k} \\\\right)-F\\\\left( \\\\mathbf{N}^{G,k},V^{G,k} \\\\right)}{\\\
  delta t\\_{k}} \\\\leq -\\\\sum\\\\limits\\_{i = 1}^{M}{\\\\frac{D\\_{i}N\\_{i}^{t}}{\\\
  \\mathit{RT}}\\\\left( {\\\\mu\\_{i}^{L,k + (1/2)}-\\\\mu\\_{i}^{G,k + (1/2)}} \\\
  \\right)^{2}}.} & & \\\\\\\\ \\\\end{matrix}$ (3.89)\n\n![image](img/F000034si385.png)(3.89)\n\
  \n将等式 (3.80)乘以 `p`[`L`]^(`k` + `(1/2)`)−`p`[`G`]^(`k` + `(1/2)`)+`p`[`c`]^(`k` + `(1/2)`)![image](img/F000034si386.png)，我们可以很容易得到\n\
  \n$\\\\begin{matrix} {\\\\left( {p\\_{L}^{k + (1/2)}-p\\_{G}^{k + (1/2)} + p\\_{c}^{k\
  \ + (1/2)}} \\\\right)\\\\frac{V^{G,k + 1}-V^{G,k}}{\\delta t\\_{k}}} & {= -\\\\\
  frac{C\\_{V}^{G}C\\_{V}^{L}V^{t}}{C\\_{V}^{L}p\\_{G}^{k} + C\\_{V}^{G}p\\_{L}^{k}}\\\
  \\left( {p\\_{G}^{k + (1/2)}-p\\_{L}^{k + (1/2)}-p\\_{c}^{k + (1/2)}} \\\\right)^{2}}\
