  \ CPU 时间也被忽略了，但该训练时间仅为 15.72 秒，远低于其他方法。同时，训练后的模型可以针对不同的二元组分以及温度压力条件反复使用。可以得出，深度学习方法比传统的\
  \ `SSM` 高得多，也比另外两种加速方法更快。很容易预期在大规模计算中稀疏网格法和深度学习方法具有更高的效率，因为这两种模型可以在不同案例中重复使用，而在\
  \ `SSM` 和牛顿法中，一切都要重新开始。\n\n除了效率之外，我们优化深度学习模型的准确性在计算中得到了证明。我们收集了特定温度、组成和压力条件下的实验数据作为真值，并与不同计算方法的结果进行了对比。由于，由于稀疏网格法是基于\
  \ `SSM` 生成的代理模型，比较中忽略了其结果。从图 7.3 可以发现，这些方法计算的所有结果都与实验数据吻良好，尽管并非完美。总而言，`SSM` 在某些点会显示出明显的误差，但牛顿法的结果要好得多，因为它们从\
  \ `SSM` 的结果收敛。牛顿法的结果虽然更好，但仍不如深度学习模型准确。总之，优化的深度学习模型在保持与其他闪态计算方法相似准确性的同时，具有高得多的 CPU\
  \ 时间效率。在乙烷和戊烷在恒定温度 310.93K 下随压力变化的二元相平衡计算结果也可以检测到类似的性质（图 7.4）。\n\n![Figure 7.3 不同相平衡计算方法之间的准确性对比。不同计算方法与实验数据（作为真值）之间的关系。](img/F000071f07-03-9780128209578.jpg)\n\
  图 7.3 不同相平衡计算方法之间的准确性对比。不同计算方法与实验数据（作为真值）之间的关系。![Figure 7.4 每个节点回归过程的流程图。](img/F000071f07-04-9780128209578.jpg)\n\
  图 7.4 每个节点回归过程的流程图。\n\n从案例研究可以得出结论，提出的模型可以为更热力学严谨的 VLE 计算程序提供初值估算。然而，在模型构建过程中过拟合现象是明显的，导致在某些情况下预测误差相对较高。因此，仍然有必要构建一个更大的实验二元\
  \ VLE 数据集，这根据目前的数据库很难收集。除了在重复输入上花费了大量时间外，另一个问题是测试数据单位多种，且在某些情况下，相同组分混合物的结果甚至不同。获取大量数据的另一种方法是使用\
  \ EOS 进行闪态计算。然而，人们公认为，目前闪态计算方法的收敛性和准确性无法保证。此外，有时结果甚至没有物理意义，我们需要手动排除它们。因此，将闪态计算结果作为输入数据的应用应基于计算方法的选择和优化进行研究，这仍然是未来的工作。\n\
  \n\n\n\n与经典的 NPT 闪相计算相比，NVT 闪相表现出某些优势，并在近年来引起了研究者的广泛关注。NVT 公式在不需要反演状态方程（EOS）的情况下具有唯一解，从而消除了通常在\
  \ NPT 闪相问题中发生的根根选择程序。此外，无法使用 NPT 公式唯一地确定纯物质在饱和压力下的体积，因为纯物质的所有状态（两相、单气相或单液相）在相边界上具有相同的压力。在具有三相或四相的多组分混合物（multicomponent\
  \ mixtures）中也观察到了类似的行为。尽管 NPT 闪相是组分模拟器中最常用的闪相技术，但人们已做出许多努力来提高 NVT 闪相计算的性能并扩展其应用。为了模拟从任何非平衡态到平衡态的动态过程，Kou（Kou\
  \ and Sun, 2018）建立了摩尔数和体积的演化方程，并通过良好的能量稳定数值算法进行了求解。除了上述本体相闪相问题外，通过考虑流体分子与孔壁之间的相互作用产生的吸附、毛细压力或限域效应，还研究了恒摩尔、恒体积和恒温度下的限域相行为。\n\
  \n在本节中，深度学习模型的训练数据由 NVT 闪相计算提供。研究了三种真实的油藏流，包括五组分的 Bakken 油、八组分的 EagleFord1 油和十四组分的\
  \ EagleFord2 油。每种油藏流的组分参数列在补充信息中。建立了一个具有五个激活层的深度神经网络，每层包含 100 个节点，总共迭代 4000 次。选择\
  \ `ReLU` 作为激活函数。值得提到，该网络配置的性能已在上一节中得到验证。为了研究数据大小对深度神经网络模型性能的影响，我们在相同的计算域上，使用 51×51、71×71、101×101、151×151、201×201\
  \ 和 301×301 均匀网格，计算了 EagleFord1 油的 NVT 闪相平衡结果。此外，在指定的浓度和温度区间内计算了 Bakken 油和 EagleFord2\
  \ 油的结果，这些区间被均匀划分为 301×301 网格。所有八个数据集均用于训练所提出的神经网络，并测试了所训练模型的效率和准确性。本研究的一项关键工作是探索通过单个神经网络模型同时实现稳定性测试和相分计算的可能性，这与以往所有研究基于机器学习模型所遵循的传统两步框架不同。\n\
  \n### 7.2.1 深度学习模型训练\n\n流体组分的组分性质、总摩尔浓度和温度作为输入，所提出的深度神经网络预测气、液相中组分的摩尔分数。模型的关键参数是每个激活层的权重，它们控制给定输入数据下的模型预测。起初，这些权重是随机初始化的，这意味着模型最初的结果是无用的。为了通过深度学习模型近似\
  \ NVT 闪相计算，我们优化了权重参数以拟合气、液组分的平衡摩尔分数。接下来，除非另有说明，90% 的数据用于训练我们的网络模型，其余 10% 的数据用于验证。\n\
  \n[表 7.3] 展示了不同数据集深度神经网络的训练数据大小（`Ntrain`）、测试数据大小（`Ntest`）、训练时间（`ttrain`）和测试时间（`ttest`）。此处\
  \ `ttest` 代表训练后的模型在估计相同数据大小闪相问题的平衡摩尔分数时花费的时间。例如，训练后的模型在 201×201 网格上预测 EagleFord1\
  \ 油摩尔分数需要 7.9 秒。此外，[表 7.1] 中也给出了平均绝对误差（`ε[a]`）和相对误差（`ε[r]`）。很显然，对于 EagleFord1 油，随着输入数据量的增加，训练时间显著增加，而测试时间没有太大变化。此外，我们观察到绝对和相对预测误差都随着数据量的增加而继续减少。在相同的数据量下，涉及的组分越多，深度神经网络模型表现出的预测误差似乎越大。然而，Bakken\
  \ 油是一个例外，产生的误差比 Eagle Ford 油大。这可能归因于不同组分之间的相关性与所研究的流体混合物不同，导致训练的网络模型产生不同的准确性。从本质上，Bakken\
  \ 油的组分与两个 Eagle Ford 样本的组分非常不同，后者在某种程度上具有一些相似性。这可能解释了为什么我们的观察与预期不符。[表 7.4] 比较了不同数据大小下\
  \ EagleFord1 油 NVT 闪相计算的时间与深度神经网络测试的时间。可见，测试时间远于闪相计算的计算时间。当数据大小达到 301×301 时，训练模型的预测速度比迭代闪相计算快\
  \ 244 倍。\n\n表 7.3\n不同数据源大小的性能。\n\n| 训练数据源 | 训练时间 | 测试时间 | 平均绝对误差 | 平均相对误差 |\n| ---\
  \ | --- | --- | --- | --- |\n| EagleFord1 (51×51) | 42 | 4.1 | 0.02946 | 0.03582\
  \ |\n| EagleFord1 (71×71) | 134 | 5.9 | 0.01930 | 0.0241 |\n| EagleFord1 (101×101)\
  \ | 235 | 6.3 | 0.01378 | 0.01723 |\n| EagleFord1 (151×151) | 512 | 7.1 | 0.01301\
  \ | 0.01647 |\n| EagleFord1 (201×201) | 1232 | 7.9 | 0.01261 | 0.01580 |\n| EagleFord1\
  \ (301×301) | 2531 | 8.6 | 0.01252 | 0.01571 |\n| EagleFord2 (301×301) | 2468 |\
  \ 8.9 | 0.01684 | 0.01964 |\n| Bakken (301×301) | 2352 | 9.2 | 0.02362 | 0.02885\
  \ |\n\n### 7.2.2 相分测试\n\n在相分计算中，相稳定性分析始终包含在大多数算法中（\n\n![Figure 7.5 Optimized network\
  \ structure.](img/F000071f07-05-9780128209578.jpg)\n\nFigure 7.5 化的网络结构。\n\n\n\n\
  \n\n我们深度学习算法的一个重要亮点是训练神经网络自动检测在特定热力学环境条件下平衡态下流体混合物存在的总相数，从而避免额外的单独稳定性测试阶段。在预测气、液摩尔组分的同时同时完成相分离和相稳定性测试的指导下，可以通过与闪计算数据（作为真值）进行比较来验证预测的准确性。如图\
  \ 7.6 所示，在指定的总浓度为`10 mol/m³`时，深度学习算法预测的平衡态下流体混合物存在的总相数![image](img/F000071si20.png)与闪计算数据的结果高度吻合。随着温度的升高，两相混合物将转变为单气相，闪计算方案和深度学习算法都能成功捕获这一合理的相变过程。\n\
  \n![图 7.6 在指定总浓度为 10 {mol}/m^{3} 时，平衡态下流体混合物存在的总相数图像。温度单位为“K”。](img/F000071f07-06-9780128209578.jpg)\n\
  \n图 7.6 在指定的总浓度为`10 mol/m³`时，平衡态下流体混合物存在的总相数![image](img/F000071si1.png)。温度单位为“K”。\n\
  \n超临界流是指温度和压力高于其临界点且不存在明显气液分的物质，由于在化学提取、干洗、水氧化气化以及碳捕集与存储具有特定的应用潜力，在目前的研究中变得越来越流行。因为在\
  \ NVT 闪计算方案不需要压力作为常量前提，我们的加速相平衡估计算法能够捕捉这种特殊机制。通过检查`N`和`φ`的值![image](img/F000071si21.png)，我们可以确定某些温度范围内的超临界区域。如图\
  \ 7.7 所示，在指定的总浓度为`5854.15 mol/m³`下![image](img/F000071si22.png)，可以通过特殊的标签`N` 为 3\
  \ 检测出超临界流体，NVT 闪数据与深度学习结果之间的完美匹配验证了我们的深度学习算法检测超临界流现象的能力。\n\n![图 7.7 在指定总浓度为 5854.15\
  \ {mol}/m^{3} 时，平衡态下流体混合物的热力学条件图像。温度单位为“K”。](img/F000071f07-07-9780128209578.jpg)\n\
  \n图 7.7 在指定的总浓度为`5854.15 mol/m³`时，平衡态下流体混合物的热力学条件![image](img/F000071si2.png)。温度单位为“K”。\n\
  \n### 7.2.3 网络优化\n\n首先测试不考虑毛细压力的相平衡计算。然而，为了适应输出参数变化的可能变化，对这些`超参数`进行了优化，并发现隐藏层数量上存在显著差异。如图\
  \ 7.8 所示，七层隐藏层的网络性能远优于五层隐藏层，这表明我们需要更多的隐藏层来准确捕获该结构中的热力学相关性。其他网络配置在使用之前的选择时仍保持相似性能，例如，不同激活函数的深度神经网络的估计误差在图\
  \ 7.9 中所示，`ReLU`在相对误差方面仍然是最好的。有趣的是，使用`ReLU`的网络的绝对估计误差比使用`softplus`的大，但`ReLU`的相对误差较小。这种现象的一种可能解释可以归因于在这两种情况下总数据中对训练样本和测试样本的随机选择。\n\
  \n![图 7.8 使用不同隐藏层的深层神经网络的估计误差。](img/F000071f07-08-9780128209578.jpg)\n\n图 7.8 使用不同隐藏层的深层神经网络的估计误差。\n\
