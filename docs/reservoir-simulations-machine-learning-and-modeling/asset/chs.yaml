  left( \\mathbf{n}^{k + 1} \\right) + n_{j}^{k + (1/2)}\\mu_{j}^{\\text{concave}}\\\
  left( \\mathbf{n}^{k + (1/2)} \\right)} \\right)} \\\\ {-f^{\\text{convex}}\\left(\
