  \ 5.6 所示。\n\n![图 5.6 离散化。](img/F000058f05-06-9780128209578.jpg) 图 5.6 离散化。\n\n让我们引入渗透系数的符号：\n\
  \n$T^x = \\frac{k^x}{\\Delta y},T^y = \\frac{k^y}{\\Delta x}$\n\n![image](img/F000058si222.png)\n\
  \n假设高度 $\\Delta z=1$![image](img/F000058si223.png)。因此我们可以推导出压力方程：\n\n$(T_{in}^x+T_{out}^x+T_{in}^y+T_{out}^y)P_{i,j}\
