  \ 是组分间的相互作用。\n\n### 5.4.2 Chapman–Enskog 扩展到 Navier–Stokes\n\nLBM 研究中的一个关键问题是证明我们的\
  \ Lattice-Boltzmann (LBGK) 方案与广泛接受的模型等效，并验证其有效性。在本节中，我们将经典 LBGK 方案通过 Chapman–Enskog\
  \ (CE) 扩展到 N–S 方程作为示例：\n\n$\\partial_{t}f + \\left( \\mathbf{e} \\cdot \\nabla \\\
  right)f=\\Omega\\left( f \\right) = \\frac{1}{\\tau}\\left( f^{\\text{eq}} - f \\\
  right).$ (5.127)\n\n![image](img/F000058si529.png)(5.127)\n\n使用离散速度得到离散方程：\n\n$\\\
  partial_{t}f_{i} + \\left( \\mathbf{e}_{i} \\cdot \\nabla \\right)f_{i} = \\frac{1}{\\\
  tau}\\left( f_{i}^{\\text{eq}} - f_{i} \\right).$ (5.128)\n\n![image](img/F000058si530.png)(5.128)\n\
  \n对时间积分得到 LBE：\n\n$f_{i}\\left( \\mathbf{x} + \\mathbf{e}_{i}\\delta_{t},t + \\\
  delta_{t} \\right) - f_{i}\\left( \\mathbf{x},t \\right) = \\frac{1}{\\tau}\\left(\
  \ f_{i}^{\\text{eq}} - f_{i} \\right).$ (5.129)\n\n![image](img/F000058si531.png)(5.129)\n\
  \n很容易验证：\n\n$\\rho = \\sum\\limits_{i}f_{i}^{\\text{eq}},\\rho\\mathbf{v} = \\sum\\\
  limits_{i}f_{i}^{\\text{eq}}\\mathbf{e}_{i}.$ (5.130)\n\n![image](img/F000058si532.png)(5.130)\n\
  \n质量守恒和动量守恒要求：\n\n$\\rho = \\sum\\limits_{i}f_{i},\\rho\\mathbf{v} = \\sum\\limits_{i}f_{i}\\\
  mathbf{e}_{i}.$ (5.131)\n\n![image](img/F000058si533.png)(5.131)\n\n如果对于给定参数 `K`\
  \ 将 $f[i]=f[i]^{\\text{eq}} + K f[i]^{\\text{neq}}$![image](img/F000058si535.png)，则必须有：\n\
  \n$0 = \\sum\\limits_{i}f_{i}^{\\text{neq}},0 = \\sum\\limits_{i}f_{i}^{\\text{neq}}\\\
  mathbf{e}_{i}.$ (5.132)\n\n![image](img/F000058si536.png)(5.132)\n\n我们定义 $\\mathbf{\\\
  Pi}^{(0)} = \\sum\\limits_{i}f_{i}^{\\text{eq}}\\mathbf{e}_{i}\\mathbf{e}_{i}$，从表达式中可以证明：\n\
