  \ 6.1.3 流行重建算法\n* 6.2 孔隙结构的数值重建\n    * 6.2.1 多点统计孔隙结构重建\n    * 6.2.2 生成对抗网络对多孔介质重建\n\
  * 6.3 稀疏表示重建的步骤\n* 参考文献\n* 延伸阅读\n\n## 6.1 基于局部相似性的孔隙结构重建\n\n基于局部相似性的孔隙结构重建是提高储层样本微型\
  \ X 射线计算机层扫描（`µ-CT`）图像多孔介质分辨率最流行且最有前景的方法。由于岩样具有破坏性的特殊性，石油工程师可以在相对低分辨率 `µ-CT` 图像之外，从二维（2D）切面或三维（3D）子集中获取更高分辨率的图像。这些高低分辨率图像对为高分辨率结构重建提供了丰富的信息。基于局部相似性的孔隙结构重建技术基于两个假设：局部相似现象普遍存在以及图像退化机制固定的。岩样的局部相似性意味着，如果从样本的任何部分提取出一个小体积（例如\
  \ `10×10×10` 体素），那么在矿物类型和结构方面，在样本的其他部分找到其相似体积的概率很高。固定的图像退化机制确保了如果从高分辨率图像中提取的两个小体积对应的低分辨率伙伴彼此相似，那么它们也是相似的（见\
  \ `图 6.1`）。通常，重建过程可以分为四个步骤：(1) 强度校准，(2) 提取训练图像块（立方体），(3) 训练重建模型，以及 (4) 高分辨率图像重建。\n\
  \n```\n图 6.1 局部相似性现象演示。CT1 和 CT2 是从 µ-CT 切面上提取的两个低分辨率图像块，而 SEM1 和 SEM2 是从 SEM 图像中提取的对应高分辨率图像块。显然，如果\
  \ CT1 和 CT2 是相似的块，那么 SEM1 和 SEM2 彼此也是相似。SEM，扫描电子显微镜。\n```\n\n\n\n\n\n强度校准是为了确保高分辨率和低分辨率训练图像对具有相同的强度分布。例如，µCT（微米级\
  \ CT）和扫描电子显微镜（SEM）的成像机制完全不同。µCT 测量的属性是 X 射线穿透物体的强度，而 SEM 测量的是电子束激发的原子发射的二次电子数量。因此，由于岩石样品的不同成分对这两个物理量的响应不同，在重建之前必须进行灰度级校准以匹配两幅图像的强度分布。校准包含两个步骤：归一化和校准。\n\
  \n### 归一化\n归一化通过线性变换将 µCT 和 SEM 图像的强度调整到给定范围（例如从 0 到 255），式 (6.1) 举了一个将强度从任何范围调整到\
  \ 0–255 的示例。\n\n```\nĨ = 255(I−Min)/(Max−Min) (6.1)\n```\n\n![image](img/F00006Xsi1.png)(6.1)\n\
  \n其中 `I`![image](img/F00006Xsi2.png) 表示 µCT 或 SEM 图像的初始强度，`Max` 和 `Min` 分别表示 µCT\
  \ 或 SEM 图像的最大和最小强度，而 `Ĩ`![image](img/F00006Xsi3.png) 表示范围从 0 到 255 的归一化强度。\n\n###\
  \ 校准\n进行校准工作是为了让高分辨率和低分辨率训练图像对（例如 µCT 和 SEM 图像）具有相同的强度直方图，这是通过非线性变换实现的。图 6.2 展示了校准过程，其中\
  \ µCT 的强度校准到 SEM 图像的强度。首先，对于 µCT 图像的每一个强度值 `I[CT]`，可以从 µCT 图像强度的累积概率分布观察到其对应的累积概率值\
  \ `CPD[CT]`。然后在相同的累积概率值下（`CPD[CT]=CPD[SEM]`），根据 SEM 图像强度的累积概率分布很容易确定 `I[CT]` 的校准值。校准后，这两幅图像呈现出相同的强度直方图分布。\n\
  \n![Figure 6.2 非线性变换的示意图。CDF，累积分布函数。](img/F00006Xf06-02-9780128209578.jpg)\n\n图\
  \ 6.2 非线性变换的示意图。`CDF`，累积分布函数。\n\n### 6.1.2 提取训练图像块（立方体）对\n与随机重建方法类似，基于局部相似性的孔隙结构重建的第一步是从训练图像中提取先验知识。与从一个或多个单分辨率图像提取先验的随机重建方法不同，基于局部相似性的孔隙结构重建的先验来自一个或多对不同分辨率的图像。此外，基于局部相似性的孔隙结构重建的先验是一组小的图像块（立方体）对，而不是随机重建方法中应用的各种相关函数。所有这些图像块（立方体）对组成了一个图像数据库，记录了有助于我们重建高分辨率孔隙结构的图像退化机制，且这些机制依赖于低分辨率图像。与\
  \ `FILTERSIM` 算法相比（\n\n#### 6.1.2.1 二维图像块对数据库的建立\n二维图像块对对数据库（IPPD），包括单尺度 IPPD 和多尺度\
  \ IPPD，可以根据情况通过两种方法建立。\n\n##### 6.1.2.1.1 单尺度图像块对数据库\n在单尺度 IPPD 中，2D 低分辨率 µCT 切片和高分辨率\
  \ SEM 图像均可用（见图 6.3）。以给定的窗口大小从 µCT 图像中随机提取大量的低分辨率图像块，并且它们的所有高分辨率配对图像都从 SEM 图像中提取。例如，在图\
  \ 6.4 中，低图像块的窗口大小为 7×7 像素，高图像块为 14×14 像素，因为训练图像对的分辨率放大倍数为 2（SEM 图像的分分辨率是 µCT 图像的两倍）。但在某些情况下，可用的\
  \ µCT 和 SEM 图像难以获取，或者数量不足以提供足够的图像块对。因此，应用多尺度 IPPD 来丰富数据库。\n\n![Figure 6.3 单尺度图像块对数据库建立的示意图，其中\
  \ µCT 切片和 SEM 图像的分辨分别为 2×2 µm²/pixel 和 1×1 µm²/pixel（分辨率放大因子为 2）。SEM，扫描电子显微镜；µ-CT，微米级\
  \ X 射线计算机扫描。](img/F00006Xf06-03-9780128209578.jpg)\n\n图 6.3 单尺度图像块对数据库建立的示意图，其中\
  \ µCT 切片和 SEM 图像的分辨分别为 2×2 µm²/pixel 和 1×1 µm²/pixel（分辨率放大因子为 2）。`SEM`，扫描电子显微镜；`µ-CT`，微米级\
  \ X 射线计算机扫描。\n\n##### 6.1.2.1.2 多尺度图像对数据库\n多尺度 IPPD 的实现通过两个步骤完成：建立高斯金字塔和提取图像对。开始时，有必要简要介绍图像退化机制：\n\
  \n```\nI[l] = (I[h]*B)↓\n```\n\n![image](img/F00006Xsi4.png)(6.2)\n\n其中![image](img/F00006Xsi5.png)\
  \ 是卷积算子，`B` 表示模糊核，通常为具有给定 `σ`（例如 0.8）的高斯核，而 ↓![image](img/F00006Xsi6.png) 表示缩放因子\
  \ `s` 的下采样。`I[h]` 和 `I[l]` 分别是初始 SEM 图像及其退化版本。\n\n低分辨率 µCT 图像可以被视为由式 (6.2)描述的未知高分辨率图像的模糊和下采样版本。假设高分辨率图像及其低分辨率配对记录了关于图像退化的某些信息，这有助于提高\
  \ µCT 图像的分辨率。为了获得这些潜力，将高分辨率 SEM 图像 `I[0]` 与高斯核 `B` 进行卷积，并用固定的缩放因子 `s` 进行下采样。重复此过程以生成一系列退化版本\
  \ `I[n]`（`n=-1, -2, -3, ...`）。从 `I[0]` 到 `I[n]` 所有不同分辨率的图像（SEM 及其退化版本）组成了一个高斯图像金字塔。金字塔中的任意两个相邻图像组成一对高低分辨率图像对，假设它们包含相同的退化机制。然后从\
  \ `I[-k]` 中提取大小为 `pl`×`pl` 的低分辨率块记为 `NL`，并从 `I[-k+1]` 中提取大小为 `ph`×`ph`（`ph=pl`×`s`）对应的更高分辨率块记为\
  \ `NH`（见图 6.4）。`NL` 和 `NH` 被认为包含了它们所描述的特殊结构的图像退化机制信息。\n\n#### 6.1.2.2 3D 图像立方体对数据库\n\
  \n\n\n\n\n在某些情况下，高分辨率信息由 µ-CT 图像而非 SEM 图像提供。首先，使用低分辨率 µ-CT 对岩石样品进行扫描，然后从样品中钻出一个子样本并以相对高分辨率进行扫描。其次，从同时可以获取高分辨率和低分辨率图像的样品重叠部分提取出大量的小体积体，这确保了每个低分辨率图像体积体都有一个高分辨率的配对。将大量的（例如\
  \ 30,000 个）体积体对组织成一个数据库，其中包含了高分辨率和低分辨率图像之间的关系（参见图 6.5）。\n\n![Figure 6.5 从`16`×`16`×`16`\
  \ `μm/voxel`³分辨率和 `4`×`4`×`4` `μm`³`voxel`分辨率提取的印第安纳石灰岩低、高分辨率训练图像立方体对。(A)–(D) 是尺寸为\
  \ `5`×`5`×`5` voxel³的低分辨率立方体，(E)–(H) 是相应的尺寸为 `20`×`20`×`20` voxel³的高分辨率立方体。绿色、黄色和红色分别代表大孔隙、微孔簇和固体。这些立方体对记录了低分辨率和高分辨率图像之间的结构关系。](img/F00006Xf06-05-9780128209578.jpg)\n\
  \n图 6.5 从`16`×`16`×`16` `μm/voxel`³分辨率和 `4`×`4`×`4` `μm`³`voxel`分辨率提取的印第安纳石灰岩低、高分辨率训练图像立方体对。(A)–(D)\
  \ 是尺寸为 `5`×`5`×`5` voxel³的低分辨率立方体，(E)–(H) 是相应的尺寸为 `20`×`20`×`20` voxel³的高分辨率立方体。`绿色`、`黄色`和`红色`分别代表大孔隙、微孔簇和固体。这些立方体对记录了低分辨率和高分辨率图像之间的结构关系。\n\
  \n### 6.1.3 常用重建算法\n\n在本节中，应用了一些适当的数学算法将从训练图像集中提取的先验信息重现在重建图像中。本节介绍了三种实现高分辨率孔隙结构重建的算法：邻域嵌入算法、稀疏表示算法和卷积神经网络（CNN）方法。\n\
  \n#### 6.1.3.1 基于邻域嵌入的图像重建算法\n\n##### 6.1.3.1 基于邻域嵌入的图像重建步骤\n\n图 6.6 展示了基于多尺度 IPPD\
  \ 的局部相似性邻域嵌入算法的基本步骤。重建过程从低分辨率 µ-CT 图像切片 `H[0]` 开始，在此基础上建立一个更高分辨率的图像 `H[1]`。在这种情况下，`H[0]`\
  \ 被视为 `H[1]` 的模糊和下采样版本，具有模糊核 `B` 和下采样因子 `s`。对于 `H[1]` 中尺寸为 `pl`×`pl` 的任何图像块 `P`，其对应的低分辨率斑块\
  \ `P[l]` 可以在 `H[0]` 中找到。然后在 SEM 图像的高斯图像中（除 `I[0]`）搜索 `P[l]` 的相似斑块（邻域）。例如，对于高斯金字塔\
  \ `NL[1]` 和 `NL[2]` 中的两个邻域（尺寸均为 `pl`×`pl`），其高分辨率斑块 `NH[1]` 和 `NH[2]` 可以从 `I[-1]`\
  \ 和 `I[-2]` 的相邻分辨率层提取。由于 `NL[1]` 和 `NL[2]` 是 `P[l]` 的相似斑块，可以假设 `NH[1]` 和 `NH[2]`\
  \ 也是 `P` 的相似斑块。因此，使用 `NH[1]` 和 `NH[2]` 的加权平均作为 `P` 的合理估计。最后，基于 `H[1]` 应用相同的步骤来重建更高分辨率的图像\
  \ `H[2]`，依此类推。\n\n![Figure 6.6 自相似性邻域嵌入技术示意图，(A) SEM 高斯金字塔和(B) µ-CT 重建。SEM，电子显微镜；µ-CT，微射线断层扫描。](img/F00006Xf06-05-9780128209578.jpg)\n\
  \n图 6.6 自相似性邻域嵌入技术示意图，(A) SEM 高斯金字塔和(B) µ-CT 重建。`SEM`、`电子显微镜`、`µ-CT`。\n\n在实践，图像重建通过三个步骤进行：插值、邻域搜索和加权平均。由于\
  \ SEM 提供了 2D 图像，高分辨率 µ-CT 图像的重建是在 2D 平（例如 `X`–`Y` 平）逐层进行的，然后在第三个方向（`Z` 方向）上将 µ-CT\
  \ 图像插值为高分辨率图像。在随后的节中将演示一个切片的重建步骤。\n\n首先，使用三次插值从低分辨率切片 `H[k-1]` 插值得到原始“高分辨率” µ-CT\
  \ 切片 `H[k]` (`k>1`)。例如，一个 100×100 的图像从低分辨率切片插值得到。首先，一个 100×100×100 的图像插值到 200×100×100。低分辨率斑集由\
  \ `P` 标记，`p[i,j]` 是 `P` 中的元素。由于 µ-CT 图像是逐层处理的，`i,j` 坐标位于 `H[k-1]` 中的配对 `q[m,n]`。因为\
  \ `p[i,j]` 的尺寸为 `ph`×`ph`，但 `q[m,n]` 的尺寸为 `pl`×`pl`。由于 `floor` 算子表示两个图像之间的相似性，`p[i,j]`\
  \ 和 `q[m,n]` 的关系给出：\n\n$m = \\begin{cases} \\text{floor}(i/2) + 1 & i \\text{奇数}\
  \ \\\\ i/2 & i \\text{偶数} \\end{cases}$ (6.3)\n\n![image](img/F00006si7.png)\n\n\
  其中 `floor` 表示向下取整。为了评估两个图像之间的之间的相似，引入了强度差异 `ε`。如果两个图像块之间的强度差异小于 `ε`，可以安全地假设它们表示相同的物体。相似的比例\
  \ `s[p]` 定义为图像中相似斑块的比例\n\n$s[p] = n[1]/n[2]$ (6.4)\n\n![image](img/F00006si8.png)\n\
  \n其中 `n[1]` 是逻辑矩阵 $\\varnothing$ 中的非零元素，`n[2]` 是低分辨率斑块的总像素数（`n[2]`=`pl`×`pl`）。\n\
  \n$\\varnothing\\left( x,y \\right) = \\begin{cases} 1 & |q_{x,y}(m,n) - lr_{x,y}(\\\
  delta)| < \\varepsilon \\\\ 0 & \\text{其他} \\end{cases} \\right. x,y \\in [1,pl]$\
  \ (6.5)\n\n![image](img/F00006si9.png)\n\n其中 `qx,y` 是 `q[m,n]` 的 `x,y` 像素值，`lrx,y`\
  \ 是 `LR` 中第 `δ` 个元素的 `x,y` 像素值。`ε` 是一个正数，且值为 `σ` 的倍数（`σ` 是 µ-CT 图像噪声的标准差）。一旦搜索到邻域，其对应的高分辨率斑块将被加权平均，以替换\
  \ `H[k]` 中的 `p[i,j]`（参见公式 6.6 和 6.7）。\n\n$u(i,j) = \\frac{\\sum[\\delta \\in N(i,j)]\
  \ w[i,j,\\delta] \\cdot h\\text{**r}*\\text{}(\\delta)}{\\sum[\\delta \\in N(i,j)]\
  \ w[i,j,\\delta]}$ (6.6)\n\n![image](img/F00006si10.png)(6.6)\n\n$w[i,j,\\delta]\
  \ = \\exp\\{−||q(m,n) - lr\\text{**r}*\\delta)||[2]²/2\\sigma²\\}$ (6.7)\n\n![image](img/F00006si11.png)(6.7)\n\
  \n\n\n\n其中 `hr(*δ*)` 是 `HR` 的 `δ[*th*]` 元素；`w[*i, j, δ]`![image](img/F00006Xsi13.png)\
  \ 表示其权重；`N(*i,j*)` 是一个包含所有所选邻域的集合。`u(*i,j*)` 是重建的斑块（patch），它用于替换 `H[*k*]` 中对应的斑块。`q(*m,n*)`\
  \ 是低分辨率斑块，`lr(*δ*)` 是 IPPD（检索项目）中的低分辨率斑块，而 `σ` 是噪声的标准差。\n\n在这里，`σ` 是一个与微型（µ-CT）图像噪声相关的参数。通常情况下，包含纯材料的区域在\
  \ SEM 图像中很容易定位，那么其在 µ-CT 图像中对应的区域也就确定了。µ-CT 图像定位区域的光强分布方差近似处理为 `σ`。\n\n图 6.7 简要演示了邻域嵌入算法的过程。对于任何低分辨率目标图像斑块，从\
  \ IPPD 的低分辨率图像斑块组中搜索若干相似的斑块（邻域），然后从高分辨率斑块组中检索对应的高分辨率图像斑块。这些获得的高分辨率图像斑块通过加权平均来构建一个高分辨率图像斑块，以替换目标低分辨率图像斑块。最后，应用立方插值算法在\
  \ `Z` 方向上以 2 倍的放大因子增加分辨率。\n\n![Figure 6.7 邻域嵌入自相似性重建算法示意图。](img/F00006Xf06-07-9780128209578.jpg)\n\
  \n图 6.7 邻域嵌入自相似性重建算法示意图。\n\n### 6.1.3.1.2 结论\n\n重建性能取决于（\n\n1. 由于提取先信息的 SEM 图像是\
  \ 2D 的，后续重建仅在 2D 平面内逐片（在 XY 平面内）进行，这导致 XZ 和 YZ 平面上显示的结构没有 XY 平面的锐利。\n2. 通常，倾向于扫描一组分辨率逐渐增加的\
  \ SEM 图像，然后反复使用单尺度局部相似性逐步提高 µ-CT 图像的分辨率直到达到预期分辨率。然而，在许多情况下，收集这么多 SEM 图像是不现实的，可以使用多尺度局部相似性策略。但是，在多尺度局部相似性策略中，隐含地假设图像退化机制符合高斯分布，这限制了该方法的应用。\n\
  3. 消除棋盘噪声（相邻重建斑块之间的不连续性）并不容易，这在基于模式的图像处理中非常常见，邻域嵌入方法也不例外。\n4. 为了保证重建精度，最好提取大量的训练图像斑块。然而，更多的训练图像斑块会给计算带来更大的负担。因此，如何加速算法运行速度仍然是一个挑战。\n\
  \n### 6.1.3.2 基于稀疏表示的图像重建\n\n为了解决邻域嵌入算法计算繁琐且精度有限的问题，本节提出了基于局部相似性的稀疏重建（LSSRR）方法。\n\
  \n#### 6.1.3.2.1 降维\n\n在这一步中，`C[*l*]` 和 `C[*h*]` 用于表示低分辨率和高分辨率图像立方体的矩阵。然而，`lr` 和\
  \ `hr` 的维度始终非常高。例如，如果使用 `10×10×10 voxel³` 模板扫描低分辨率立方体，且放大因子为 4，则 `lr` 和 `hr` 的维度分别为\
  \ `1×1000` 和 `1×256000`。如果训练图像立方体的数量设置为 30000，`C[*h*]` 的维度将高达 `256000×30000`，这给后续操作带来了沉重负担。因此，在字典学习之前，应用主成分分析（PCA）算法降低高分辨率图像立方体的维度，同时保留大部分（例如\
  \ 95%）的信息，并进一步减少字典学习的计算。降维显著提高了算法效率，避免了对重建产生明显的影响。\n\n```\n\\overset{\\\\sim}{C_{h}}\
  \ = KC_{h}\n```\n\n![image](img/F00006Xsi14.png)(6.8)\n\n其中 `C[*h*]` 是高分辨率训练图像立方体，`\\\
  overset{\\\\sim}{C_{h}}`![image](img/F00006Xsi15.png) 是尺寸为 `m'n` 的降维高分辨率图像立方体矩阵。`K`\
  \ 是 PCA 变换矩阵，可以通过以下方程求解：\n\n```\nKC[*x] = Σ = diag(σ², σ², σ²)\n```\n\n(6.9) 其中\
  \ `C[*x*]` 是对称正差定矩阵，`\\overset{\\\\sim}{C_{h}}`![image](img/F00006Xsi17.png) 是 `K`\
  \ 的共轭转置。\n\n这里的 `C[*x*]` 实际上是 `C[*h*]` 的协方差矩阵。`Σ` 是由 `C[*x*]` 的特征值构成的对角矩阵，`K` 是\
  \ `C[*x*]` 的特征向量。然后，参数 `m'`![image](img/F00006Xsi19.png) 可根据：\n\n```\n\\frac{\\\
  sum_{i = 1}^{m'}\\sigma_{i}^{2}}{\\sum_{i = 1}^{m}\\sigma_{i}^{2}} = T\n```\n\n\
  (6.10) `T` 是一个决定保留能量比例的阈值，前 `m'` 个分量是在最小原始系数均方误差方面最好的。\n\n#### 6.1.3.2.2 字典学习\n\n\
  低分辨率字典的学习过程可以通过以下方程给出：\n\n```\n(D_l,{α_k}) = min_{D_l,{α_k}}\\sum_{k}{\\left( \\\
  left\\| {D_{l}\\alpha_{k} - l_{r}^{k}} \\right\\| \\right)^{2}},s.t.}\\left\\| \\\
  alpha_{k} \\right|^{0} \\leq L\n```\n\n![image](img/F00006Xsi21.png)(6.11)\n\n其中\
  \ `D[*l*]` 是低分辨率字典，`{α[*k]*}`![image](img/F00006Xsi22.png) 是稀疏系数集，`α[*k*]` 表示第 `k`\
  \ 个低分辨率立方体的稀疏系数，`l[*r*^(k)` 表示第 `k` 个低分辨率立方体（`C[*l*]` 的第 `k` 列）。`L` 是一个小的正整数，决定了\
  \ `α[*k*]` 非零元素的数量。\n\n字典学习通过两个步骤进行：稀疏编码和字典更新。这两个步骤分别应用了正交匹配追踪（OMP）和 K-SVD 算法。详细过程将在\
  \ 6.3 节说明，关于 K-SVD 和 OMP 算法的更多细节请参见。\n\n高分辨率字典 `D[*h*]` 通过以下方程计算：\n\n```\nD_h =\
  \ \\overset{\\\\sim}{C_{h}}A^{+} = \\overset{\\\\sim}{C_{h}}A^{T}(AA^{T})^{-1}\n\
  ```\n\n![image](img/F00006Xsi23.png)(6.12)\n\n其中 `\\overset{\\\\sim}{C_{h}}` 是从方程\
  \ (6.1)获得的降维高分辨率训练立方体，`A` 以 `α[*k*]` 为列，`A^(*+)` 是 `A` 的伪逆。\n\n##### 6.1.3.2.3 分解与重建\n\
  \n\n\n\n\n使用大小为 `cl`×`cl`×`cl`（*体素*）的 3D 窗口用于对目标低分辨率图像进行栅格扫描，并提取一组低分辨率立方体以生成低分辨率立方体矩阵，表示为\
  \ `L`[*m*]。`l`[*m*]^(*k*)![![image](img/F00006Xsi25.png) 表示 `L`[*m*]的第 `k`[*th*]\
  \ 列，代表一个低分辨率立方体。然后，应用 OMP 方法根据以下方程获取低分辨率立方体的稀疏系数：\n\n$\\left\\\\{ \\\\overset{\\\
  \\sim}{\\alpha\\_{k}} \\\\right\\\\} = \\\\min{\\\\sum\\\\limits\\\\_{k}{\\\\left.\
  \ \\\\left( \\\\left\\\\| {D\\_{l}\\\\overset{\\\\sim}{\\alpha\\_{k}} - l\\\\_{m}^{k}}\
  \ \\\\right\\\\| \\\\right.^{2} \\\\right),s.t.}}\\\\left\\\\| \\\\overset{\\\\\
  sim}{\\alpha\\_{k}} \\\\right\\\\|^{0} \\leq L$ (6.13)\n\n![image](img/F00006Xsi26.png)(6.13)\n\
  \n其中，$\\overset{\\\\sim}{\\alpha\\_{k}}$![![image](img/F00006Xsi27.png)是稀疏系数，`D`[*l*]是低分辨率字典，其在等式\
  \ (6.4)中训练。`L`[*m*]^(*k*)表示第 `k`[*th*]个低分辨率立方体。`L`是一个正整数，表示`α`[*k*]中非零元素的个数。\n\n\
  然后，通过以下方程重建高分辨率立方体：\n\n$\\overset{\\\\sim}{H\\_{m}} = D\\_{h}\\\\overset{\\\\sim}{A}$\
  \ (6.14)\n\n![image](img/F00006Xsi28.png)(6.14)\n\n其中`D`[*h*]表示高分辨率字典，$\\overset{\\\
  \\sim}{A}$![![image](img/F00006Xsi29.png)包含$\\left\\\\{ \\\\overset{\\\\sim}{\\\
  alpha\\_{k}} \\\\right\\\\}\\_{k}$![![image](img/F00006Xsi30.png)作为其列。$\\overset{\\\
  \\sim}{H\\_{m}}$![![image](img/F00006Xsi31.png)是重建的高分辨率立方体。注意，PCA 被用于降低高分辨率训练立方体的维度，因此最终的高分辨率立方体需要根据以下方程变换回：\n\
  \n$H\\_{m} = K^{+}\\\\overset{\\\\sim}{H\\_{m}}$ (6.15)\n\n![image](img/F00006Xsi32.png)(6.15)\n\
  \n其中`H`[*m*]是最终的高分辨率立方体，`K`^(*+*)是根据等式 (6.8)获得的 PCA 变换矩阵`K`的逆矩阵。\n\n为了消除重建之间的不连续性，每两个相邻的低分辨率立方体包含一个体素重叠区域。在最终重建的像素图像中，每两个高分辨率立方体具有`s`（*s*是分辨率放大因子）体素重叠区域。在重叠部分，体素值通过两个立方体重叠部分的平均值计算。由于重建工作基于浮点数，应该进行适当的分割操作将最终结果恢复为离散值。在这里，我们通过一组阈值对图像进行分段。\n\
  \n### 6.1.3.2 结论\n\n注意，稀疏表示法的引入极大地提高了重建的准确度和运行速度。在实践中，由于低分辨率图像的限制，重建立方体的数量是足够的。为了解决这个问题，LSS\
  \ 通过生成近似的低分辨率立方体来处理相邻问题。在某些情况下，稀疏表示法相较于 MPS 方法显著加速了重建图像的运行速度。在稀疏表示法中，`α`[*k*]中的非零元素是主要的耗时部分。稀疏表示法通过阈值集合来分割图像。\n\
  \n### 6.1.3.3 卷积神经网络\n\n目前重建孔隙图像是困难的。\n\n![image](img/F00006Xsi26.png)\n\n![image](img/F00006Xsi27.png)\n\
  \n![image](img/F00006Xsi28.png)\n\n![image](img/F00006Xsi29.png)\n\n![image](img/F00006Xsi30.png)\n\
  \n![image](img/F00006Xsi31.png)\n\n![image](img/F00006Xsi32.png)\n\nCNN 的架构如下：\n\
  \n1. `28×28×1` 体素图像输入模型。\n2. 然后，16 个`5×5`滤波器与第一层卷积，得到 16 个特征图。这些 16 个滤波器的元素被称为“权重”。例如，第\
  \ m[*th*]特征图的体素值表示为`f*m*，通过稀疏表示法获得。\n\n`f*m* = R((I[*m*]))+b[*m*]` (6.16)\n\n![image](img/F00006Xsi33.png)\n\
  \n3. 然后池化层紧随第一卷积层，将图像从`28×28×16`下采样到`14×14×16`。最大池化和平均池化是最常用的池化方法。\n4. 然后在池化层之后执行第二次卷积过程。在这一步中，使用\
  \ 32 个大小为`5×5`的滤波器与池化层 1 卷积。m[*th*]特征图的体素值表示为`f_m(i,j)`可以通过以下方式计算：\n\n$f_{m}\\left(\
  \ {i,j} \\right) = R\\left( {\\\\sum\\\\limits\\\\_{t = 1}^{T}{\\\\left( {P\\_{t}W\\\
  _{m}} \\\\right)\\\\left( {i,j} \\\\right)} + b_{m}} \\\\right)$ (6.17)\n\n![image](img/F00006Xsi38.png)\n\
  \n其中`R![image](img/F00006Xsi39.png))`是激活函数，`P`[*t*]![image](img/F0006Xsi40.png)表示池化层\
  \ 1 的第`t`[*th*]图像。稀疏表示法在整个训练都是有效。\n5. 之后，根据卷积层 2 进行另一次池化操作。\n6. 由于池化层 2 是 3D 的，因此添加了平坦层将\
  \ 3D 神经节点转换为 1D。\n7. 然后，部署一个包含 100 个元素的全连接层。通常，全连接层贡献了 CNN 模型的大部分参数。\n\n\n\n\n\n\
  ## 8. 最后，全连接层之后紧接着连接的是一个具有三个类别的输出层。\n\n### 6.1.3.3.2 训练\n\n整个网络由具有可学习权重和偏置的神经元组成。学习端到端的映射函数需要对网络参数\
  \ `θ` 进行估计![image](img/F00006Xsi44.png)，描述如下：\n\n`θ` = {`W*[1]``,`W*[2]`,…`W*[n]`,`B*[1]``,`B*[2]`,…`B*[n]]}\
  \ (6.18)\n\n![image](img/F00006Xsi45.png)(6.18)\n\n其中 `W*[i]`![image](img/F00006Xsi46.png)(`i=1,2,…,\
  \ n`) 是第 `i`[`th]` 层的卷积核（例如，在图 6.9 中，第一卷积层卷积核 `W*[1]`![image](img/F00006Xsi47.png)的大小为\
  \ `5`×5××16`）。`B*[i]`![image](img/F00006Xsi48.png)(`i=1,2,…n`) 是第 `i`[`th]` 卷积层的偏置（例如，在图\
  \ 6.9](#chp006.xhtml#f0050)中，`B*[1]`![image](img/F00006Xsi49.png)的大小为 `16`）。`n`\
  \ 是 CNN 模型的深度。\n\n模型的训练通过最小化估计结果与相应标签之间的损失来实现。交叉熵被广泛用作损失函数，其描述如下：\n\n$L\\left( \\\
  theta \\right) = \\left( {- {1/S}} \\right)\\sum\\limits\\_{i = 1}^{S}\\left\\lbrack\
  \ {E\\_{i}\\ln O\\_{i} + \\left( {1 - E\\_{i}} \\right)\\ln\\left( 1 - O\\_{i}}\
  \ \\right)} \\right\\rbrack,$ (6.19)\n\n![image](img/F00006Xsi50.png)(6.19)\n\n\
  其中 `S` 是训练图像的数量，`E*[i]` 表示第 `i`[`th]` 训练图像的标签，`O*[i]` 是预测值。然后使用随机梯度下降和传统的反向传播算法使损失最小化（\n\
  \n```\n\\Delta_{i + 1} = 0.9\\Delta_{i} + \\alpha\\left( \\frac{\\\\partial L}{\\\
  partial W\\_{i}^{l}} \\right)W\\_{i + 1}^{l} = W\\_{i}^{l} + \\Delta_{i + 1}\n```\n\
  (6.20)\n\n![image](img/F00006Xsi51.png)(6.20)\n\n其中 `l` ∈ {1,2,3,…,n}![image](img/F00006Xsi52.png)\
  \ 表示层索引，`i` 表示迭代索引。参数 `α`![image](img/F00006Xsi53.png) 是学习率，`∂L/∂W*[i]^(l)`![image](img/F00006Xsi54.png)\
  \ 表示导数。每层的滤波器权重随机初始化，以符合均值为 0、标准差为 0.001 的高斯分布。所有偏置均初始化为 0。学习率给出 0.001。\n\n### 6.1.3.3.3\
  \ 卷积神经网络重建\n\n因为重建是在二维平面内（例如 `i–j` 平面）逐层进行的。每个二维（2D）层都是独立估计的（见图 6.10）。然后，将这些重建的\
  \ 2D 层堆叠在一起，以生成 3D 高分辨率分割图像。需要注意的是，尽管重建是在二维平面内（`i–j` 平面）执行的，但在重建图像的 `i–k` 和 `j–k`\
  \ 平面上并没有观察到不连续噪声（见图 6.11），这是因为前述插值过程平滑了 `i`、`j` 和 `k` 方向上的初始低分辨率 µ-CT 图像。\n\n![图\
