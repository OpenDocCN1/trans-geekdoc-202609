  \n### 3.1.3 扩展到混合物\n\n对于纯物质，`a(T)` = `a(T)`![image](img/F000034si80.png) 取决于组分类型，`b`![image](img/F000034si81.png)\
  \ 取决于组分类型。对于混合物，很容易理解这些参数取决于组分。混合规则写为：\n\n$a = \\\\sum\\limits_{i = 1}^{M}{\\sum\\\
  limits_{j = 1}^{M}{x\\_{i}x_{j}a\\_{\\mathit{ij}}}, b = \\\\sum\\limits_{i = 1}^{M}{x\\\
  _{i}b\\_{i}}.$ (18)\n\n![image](img/F000034si82.png)(18) \n\n其中 `a[i,j]` = (`1−k[i,j])*(a[i]*a[j])^(1/2)`；ⅅ`k[i,j]` = `k[j,i]`；ⅅ`k[i,i]` = 0,\
  \ (3.19)\n\n![image](img/F000034si83.png)(3.19) \n\n且 `k[i,j]`![image](img/F000034si84.png)\
  \ 是组分 `i`![image](img/F000034si85.png) 和 `j`![image](img/F000034si86.png) 之间的相互参数。二元相互参数假设与压力和组分无关，通常与温度无关。\n\
  \nPR 流混合物中组分 `i`![image](img/F000034si87.png) 的逸度系数可以定义为：\n\n$\\\\ln\\varphi\\_{i}\
  \ = \\frac{b\\_{i}}{b}(Z-1)-\\ln(Z-B)-\\frac{A}{2\\sqrt{2}B}\\left( \\frac{2\\sum\\\
  limits_{j = 1}^{M}{y\\_{j}a\\_{\\mathit{ij}}}}{a}-\\frac{b\\_{i}}{b}} \\right)\\\
  ln\\frac{Z + \\left( \\sqrt{2} + 1 \\right)B}{Z-\\left( \\sqrt{2}-1 \\right)B},$\
  \ (3.20)\n\n![image](img/F000034si88.png)(3.20) \n\n\n\n\n\n其中 `A` = `a(T)p/R²T²`，`B`\
  \ = `b*p/R*T`。\n\n![image](img/F000034si89.png) 该方程在相平衡热力学中非常重要。平衡逸度相等条件提供了相组成。为了方便计算，逸度系数的一个更通用的`V`积分公式为：\n\
  \n$\\\\ln\\\\varphi\\_{i} = \\int\\_{V}^{\\\\infty}\\\\left( {\\\\frac{1}{\\mathit{RT}}\\\
  \\left( \\\\frac{\\partial P}{\\partial N\\_{i}} \\right)\\_{T,V,\\\\mathbf{N}\\\
  _{\\neq \\mathbf{i}}}-\\\\frac{1}{V}} \\right)\\\\mathit{dV}-\\ln Z.$ (3.21)\n\n\
  ![image](img/F000034si90.png)(3.21) \n\n推导以下项然后进行代换：\n\n$\\\\left( \\\\frac{\\partial\
  \ P}{\\partial N\\_{i}} \\right)\\_{T,V,\\\\mathbf{N}\\_{\\neq \\mathbf{i}}} = \\\
  \\frac{\\\\mathit{RT}\\\\left( v-b + b\\_{i} \\\\right)}{N\\\\left( v-b \\\\right)^{2}}-\\\
  \\frac{2\\\\sum\\_{_{j = 1}^{M}{y\\_{j}a\\_{\\mathit{ij}}-\\left( {{ab\\_{i}}/b}\
  \ \\\\right)}}{N\\\\left( v^{2} + 2\\\\mathit{bv}-b^{2} \\\\right)}-\\\\frac{ab\\\
  _{i}\\\\left( v^{2} + b^{2} \\\\right)}{\\mathit{Nb}\\\\left( v^{2} + 2\\\\mathit{bv}-b^{2}\
  \ \\\\right)^{2}}.$ (3.22)\n\n![image](img/F000034si91.png)(3.22) \n\n该参数可以根据表 3.2\
  \ 为储层流中常见的组分进行选择。\n\n### 表 3.2\n常见储层物种参数数据表。\n\n| 组分 || `T`[c] (K) || `P`[c] (MPa)\
