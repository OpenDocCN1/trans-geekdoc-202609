  ## 3.1 地下储层中的相平衡\n\n### 3.1.1 Peng–Robinson 状态方程\n\nPeng–Robinson (PR) 方程于 1976\
  \ 年在阿尔伯塔大学开发出来。\n\n经过长期发展，`PR-EOS` 的典型形式总结如下方程：\n\n```\np = \\frac{RT}{v-b}-\\frac{a}{v^{2}\
  \ + 2bv-b^{2}}\n```\n\n```\np = \\frac{RT}{v-b}-\\frac{a}{(v + b) + b(v-b)}\n```\n\
  \n```\np + \\frac{a}{(v + b) + b(v-b)} = RT\n```\n\n```\np + \\frac{a(T_{c})\\alpha(T_{r},\\\
  omega)}{(v + b) + b(v-b)} = RT\n```\n\n参数可以与临界性质相关，特别是 `Tc` 和 `Pc`：\n\n```\ntext$a(T_{c})\
  \ = \\frac{0.45724R^{2}T_{c}^{2}}{p_{c}};b(T_{c}) = \\frac{0.07780RT_{c}}{p_{c}}\n\
  ```\n\n吸引力可以通过可以通过方式建模：\n\n```\na(T) = a(T_{c})\\alpha(T_{r},\\omega) = a(T_{c})(1+m(1−T_{r}^{0.5}))^{2}\n\
  ```\n\n其中\n\n`m = 0.37464+1.54226ω−0.26992ω^{2}` 当 `ω < 0.5`\n\n`m = 0.3796+1.485ω−0.1644ω^{2}`\
  \ 当 `ω < 2.0`\n\n且偏心因子 `ω` 是 Kenneth Pitzer 在 1955 年引入的一个概念数，被证明在物质描述中非常有用。它已成为单组分和纯组分相表征的标准。偏心因子被认为是分子非球形性（中心性）的量。随着它的增加，蒸气曲线被“拉”低，导致沸点升高。该因子可以计算为：\n\
  \n```\nω = −log10)−1, a*T[r] = 0.7\n```\n\n其中 `T[r] = T/Tc` 是约一温度，`pr = p^(sat)/Pc`\
  \ 是约一饱和蒸压。对于许多单原子流体，`T[r]=0.7` 时的 `pr` 接近 0.1，这将 `ω→0`。事实上，在许多情况下发现 `T[r]=0.7` 高于大气压下液体的沸点。任何流体的\
  \ `ω` 值都可以通过精确的实验蒸压数据确定。理想情况下，这些数据首先应对对可靠的蒸压方程进行回归，例如：\n\n```\nln(p^{sat}) = A +\
  \ B/T + C\\ln(T) + DT^{6}\n```\n\n\n\n\n如果我们假设一个双参数蒸压方程，例如 `ln(p^(sat))` = `A` ⅅ+ⅅ(`B/T*)`![image](img/F000034si53.png)，我们只需要常沸点和临界性质即可确定偏心因子。如果我们假设\
  \ `log10)` = `A` ⅅ+ⅅ(`B/T*)`![image](img/F000034si54.png)，我们可以得到 `log10` = `A` ⅅ+ⅅ(`B/T[b])`![image](img/F000034si55.png),\
  \ `log10` = `A` ⅅ+ⅅ(`B/T[c])`![image](img/F000034si56.png), 以及 `log10|T[r]=0.7])` = `A`\
  \ ⅅ+ⅅ(`B/0.7T[c])`![image](img/F000034si57.png)。由此得出 `log10|T[r]=0.7])` = `B/Tc)`![image](img/F000034si58.png)\
  \ 和 `log10` = (`B/T[c])` ⅅ−ⅅ(`B/T[b])`![image](img/F000034si59.png)。已知常沸点 `T[b]`![image](img/F000034si60.png)，我们可以解出\
  \ `B`![image](img/F000034si61.png) 为：\n\n$B = \\\\frac{T\\_{b}T\\_{c}}{T\\_{b}-T\\\
  _{c}}\\\\log\\_{10}\\\\left( \\frac{p\\_{c}}{p\\_{atm}} \\\\right).$ (3.9)\n\n![image](img/F000034si62.png)(3.9)\
  \ \n\n考虑到 1 atm=14.6959 psi，最后我们可以得到一个更常用的方程对于\n\n$\\\\omega = -\\\\log\\_{10}\\\
  \\left( {p\\_{r}^{sat}|}\\_{T\\_{r} = 0.7} \\\\right)-1 = \\\\log\\_{10}\\\\left(\
  \ \\frac{p\\_{c}}{{p^{sat}|}\\_{T\\_{r} = 0.7}} \\\\right)-1 = \\\\frac{3}{7}\\\\\
  left( \\frac{\\\\log\\_{10}\\\\left( {p\\_{c}/p\\_{atm}} \\\\right)}{\\left( {\\\
  \\mathit{Tc}/T\\_{b}} \\\\right)-1} \\\\right)-1.$ (3.10)\n\n![image](img/F000034si63.png)(3.10)\
  \ \n\n多项式形式通常用于 PR-EOS 的计算，\n\n$Z$³ − (1−B)*Z$² + (A−2B−3B²) ⅅ− (AB−B²−B³)  = 0,\
  \ (3.11)$\n\n![image](img/F000034si64.png)(3.11) \n\n其中\n\n$A = \\\\frac{a\\left(\
  \ T\\_{c} \\right)\\alpha p}{R^{2}T^{2}},B = \\\\frac{\\\\mathit{bp}}{\\mathit{RT}}.$\
  \ (3.12)\n\n![image](img/F000034si65.png)(3.12) \n\n对于单组分流体，临界压缩因子 `Z[c]`![image](img/F000034si66.png)\
  \ 可以通过令压力对摩尔体积的一阶和二阶导数为零来获得，并计算为 `Z[c]` = (`p[c]v[c]/RT[c])` = 0.307![image](img/F000034si67.png)。\n\
  \n使用克劳修斯-克拉珀龙方程，我们可以得到\n\n$\\\\frac{\\\\mathit{dp}}{\\\\mathit{dT}} = \\\\frac{p\\\
  Delta h}{RT^{2}\\\\Delta Z} \\\\approx \\\\frac{p\\\\Delta h}{RT^{2}}.$ (3.13)\n\
  \n![image](img/F000034si68.png)(3.13) \n\n假设 `Δh`![image](img/F000034si69.png) 在不同温度压力下保持不变，我们可以得到\
  \ `dln p` = ⅅ−ⅅ(`Δh/R*)```d*(1/T)`![image](img/F000034si70.png)，由此得出\n\n$\\\\ln\
  \ p\\_{2}-\\ln p\\_{1} = \\frac{\\Delta h}{R}\\\\left( {\\\\frac{1}{T\\_{1}}-\\\
  frac{1}{T\\_{2}}} \\\\right).$ (3.14)\n\n![image](img/F000034si71.png)(3.14)  \n\
  \n### 3.1.2 Redlich–Kwong 和 Soave–Redlich–Kwong 方程\n\n在 1949 年，Redlich–Kwong (RK)-EOS\
  \ 是一项巨大的改进：\n\n$p = \\\\frac{RT}{v-b}-\\frac{a}{\\\\sqrt{T}v\\\\left( {v + b} \\\
  \\right)}$ (15)\n\n其中\n\n$a = \\\\frac{0.42748R^{2}T_{c}^{5/2}}{p_{c}}; b = \\\\\
  frac{0.0864RT_{c}}$ (16)\n\n![image](img/F000034si73.png)(16)\n\n虽然优于 van Waals\
  \ EOS，它在液相方面的表现糟糕，因此无法精确计算气液平衡。然而，它可以结合独立的液相关联式用于气液平衡。1972 年，Soave 用一个函数 `α(T,ω)`![image](img/F000034si74.png)\
  \ 替换了 RK 方程中的 `a/\\sqrt{T}`![image](img/F000034si75.png)：\n\n$p = \\\\frac{RT}{v-b}-\\\
  frac{a(T_{c})\\alpha}{v\\\\left( v + b \\\\right)}$ (17)\n\n![image](img/F000034si76.png)(17)\n\
  \n其中 `a(T[c])` = (`0.427RT[c]²/P[c])`*；`b` = (`0.0864RT[c]/P[c])`![image](img/F000034si77.png)；以及\
  \ `α` = (`1+(0.48508+1.5171ω−0.1563ω²)(1−T[r]^(0.5))`²![image](img/si78.png)。\n\n\
  当比较 PR-EOS 和 Soave–Redlich–Kwong (SRK)-EOS 的性能时，除了 PR-EOS 在临界点表现稍好外，它们非常接近。在临界条件下稍好的表现使得\
  \ PR-EOS 适用于气/液系统。提出了一种通用形式来描述大多数常用的 EOS：\n\n$p = \\\\frac{RT}{v + \\delta_{1}}-\\\
  frac{a(T)}{\\left( v + \\delta_{2} \\\\right)\\\\left( v + \\delta_{3} \\\\right)}.$\
  \ (18)![image](img/F000034si79.png)(18)\n\n参数可以根据 表 3.1 选择以恢复每个 EOS。\n\n表 3.1 状态方程\
