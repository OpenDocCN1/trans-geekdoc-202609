  - 7. 关于合规风险，以下哪个说法是正确的？
- - '###'
  - 8. 一个授权做出风险处理的安全委员会已选择接受某项特定风险。的行动方案是什么？
- - '###'
  - 9. 一个安全委员会已投票缓解某项特定风险。目前仍存在剩余风险。关于剩余风险的行动方案是什么？
- - '###'
  - 10. 安全经理受执行管理层的指示，*不要*在风险注册表中记录某项特定风险。这种做法被称为：
- - '###'
  - 11. 安全经理正在对某个业务应用程序进行风险评估。安全经理确定安全补丁已超过一年未安装。这一发现被称为：
- - '###'
  - 12. 安全经理正在对数据中心进行风险评估。安全经理确定，未经授权的人可能通过装货平台门进入数据中心并关闭建筑的公用。这一发现被称为：
- - '###'
  - 13. 安全经理制定了一项方案，规定使用特定方法来保护静态、移动和传输中的信息。这被称为：
- - '###'
  - 14. 安全经理正在制定一项方案，规定使用特定方法来保护静态、移动和传输中的信息。这被称为：
- - '###'
  - 15. 风险管理的首要目标是什么？
- - '###'
  - 1. 恢复时间目标（RTO）是指从服务开始到恢复服务之间的最长时间。
- - '###'
  - 2. 通常情况下，花 500 美元来保护资产。
- - '###'
  - 3. 风险模型定义了哪些风险？
- - '###'
  - 4. 风险处理的四类方法是缓解、转移和回避。
- - '###'
  - 5. 风险注册表用于记录和跟踪风险。
- - '###'
  - 6. 在大多数情况下，合规只是另一种衡量。
- - '###'
  - 7. 合规可能会导致声誉损害。
- - '###'
  - 8. 被接受的风险。
- - '###'
  - 9. 在通过缓解降低风险。
- - '###'
  - 10. 组织正式考虑某项风险。
- - '###'
  - 11. 系统缺少安全补丁被视为。
- - '###'
  - 12. 任何可能损害资产。
- - '###'
  - 13. 数据分类定义了级别。
- - '###'
  - 14. 结束状态后，必须执行。
