  \ Matthew Hasenjager 提供。](img/chi-Dugatkin-plate09.jpeg)\n\n照片中央的两只蜜蜂正在进行营养交换——将花蜜从采集蜂转移到蜂巢中的蜜蜂。营养交换网络在蜜蜂无法利用相对于蜂巢的太阳位置时非常重要。照片由\
  \ Matthew Hasenjager 提供。\n\n![巴拿马加姆博史密森热带研究所栖息地中的吸血蝙蝠。在吸血蝙蝠的食物分享网络中，饥饿的蝙蝠从其群体成员那里获得的血液量可由它在饥饿时给予该个体的食物量来预测。照片由\
  \ Dr. Simon Ripperger 提供。](img/chi-Dugatkin-plate10.jpeg)\n\n巴拿马加姆博史密森热带研究所栖息地中的吸血蝙蝠。在吸血蝙蝠的食物分享网络中，饥饿的蝙蝠从其群体成员那里获得的血液量可由它在饥饿时给予该个体的食物量来预测。照片由\
  \ Dr. Simon Ripperger 提供。\n\n# 后记\n\n是时候从“人类独特性”清单上划掉另一项了。我们对非人类的社会网络了解得越多，就越意识到这些网络是\
  \ remarkably 复杂的。到处都是，在每种情境下，动物都嵌入在社会网络中。\n\n像所有科学家一样，我怀着极大的忐忑拿出我的水晶球来预测未来。尽管如此，当我拨开迷雾时，某些趋势还是若隐若现。在动物行为领域，没有哪个领域比社会网络的研究更与技术紧密相连。被动集成应答器\
  \ PIT 标签、射频识别 RFID 天线、GPS 追踪、接近传感器，甚至卫星已经通过提供几年前还只是梦想的数据彻底革新了网络研究。随着数据采集技术继续以惊人的速度向前发展，我毫不怀疑研究非人社会网络的同事们会不断采用和改编新技术，以更深入地理解这些网络。技术永远无法取代我们在本书中看到的那么多老式实地工作，但它可以补充和推进它。\n\
  \n新硬件很重要，但它只是一种工具，如果没有新的概念和理论突破，这种工具所告诉我们的就只有这么多。幸运的是，动物行为学家不断提出新的思考非人社会网络的方法。仅举一个例子，我们在讨论獾时提到的多层社会网络分析的工作才刚刚起步。随着时间的推移，该模型及其后继者将成熟，随着这一进程的发生，追踪动物社会网络在时间、跨物种和不同行为方面的能力也会成熟。但这不仅仅是新的追踪方式：多层社会网络分析拓宽了我们对动物所嵌入的不同网络之间相互作用的概念化。这些模型在很大程度上是由新一代数学娴熟的动物行为学家构建的，他们不仅擅长从头构建模型，而且擅长导入和修改最初为研究人类网络而开发的模型，这只会让事情变得更加令人兴奋。\n\
  \n社会网络在动物社会性中很重要这一认识促进了新的合作研究方向。历史上，动物行为、疾病生态学和保护生物学一直是不同且常常脱节的研究事业。社会网络分析的研究是它们之间的理想桥梁。我们在濒危的巴巴里猕猴、北部的穆里基猴和维勒奥克斯长臂猿的网络研究中看到了这一点的迹象，以及在塔斯马尼亚恶魔、獾和萨凡纳狒狒的动物网络中作为微生物高速公路的作用，随着时间的推移，我们对行为、疾病和保护之间联系的理解只会增加。而这三大学科都会因此受益。\n\
  \n从成本效益和认知角度对动物行为的研究早于对动物社会网络的明确研究。现在我们知道，在许多物种和许多情境中，从觅食、交配、权力、安全、旅行/迁徙、交流和文化传播等一切都在网络化社会中进行，这就引发了我们是否需要开发新的方法来衡量直接和间接的成本和收益，以及可能存在什么样的认知机制来应对网络化世界中的生活的问题。时间会告诉我们。\n\
  \n# 致谢\n\n我的社会网络包含许多小团体。每个团体在本书的成书过程中都很重要，但其中最重要的是我为本书研究进行了长时间采访的同事小团体。我深深感激以下慷慨的人士，他们通过\
