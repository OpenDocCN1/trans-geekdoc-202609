- "# 紧密相连的动物：社会网络与动物社会的奇妙复杂性\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n![](img/infinity-symbol.jpg)本纸张符合\
  \ ANSI/NISO Z39.48-1992《纸张耐久性》要求。\n\n献给 Aaron 和 Meena\n\n# 前言\n\n这不是一本关于 Twitter、Facebook\
  \ 或任何其他社交媒体平台的书。它不会给你提供建立自己的朋友圈或业务人脉的技巧。相反，我想向你介绍我们周围的其他网络：渗透自然世界的网络。这是一本关于非人类动物之间形成的网络的书。这些网络是对动物社会中生命的复杂性、深度和奇妙的致敬。\n\
  \n我通往动物社会网络的道路始于 20 世纪 80 年代末我在读研究生时。我的博士论文工作专注于检验合作行为的新模型，而我发现的，简而言之是，孔雀鱼会注意其他孔雀鱼的行为，并根据附近鱼类的行为来调节它们的反捕食行为。\n\
  \n为了彻底了解我的研究物种，我必须在博士毕业时读过用英语写成的关于孔雀鱼的每一篇动物行为论文。其中许多论文都是关于雌性如何选择配偶：一般来说，雌性孔雀鱼偏爱色彩鲜艳且相对无寄生虫的雄性。一个有时被检验、有时未被检验的假设是，雌性交配偏好基于遗传先天倾向，而这无疑是正确的。但我认为可能不止于此。毕竟，如果孔雀鱼在进行反捕食行为时会互相注意，那么雌性可能也在观察其他雌性的配偶选择，并利用这些信息来选择自己的配偶。一系列配偶选择实验表明确实如此。\n\
  \n与反捕食行为一样，在选择配偶时，了解他人的行为信息非常重要。自然选择似乎有利于在信息影响某些任务的成功或失败的复杂社会环境中，获取、处理并利用关于他人的信息的能力。几年后，我的博士生\
  \ Ryan Earley 和我又在另一个行为领域发现了这一点：雄性绿剑尾鱼会偷看其他雄性之间的争斗，并注意可能的未来对手是否已证明自己危险（或不危险）。\n\n\
  几乎所有这些工作都基于成对或三方行为互动。但与此同时，我和其他动物行为学家开始思考，群体中动物的行为可能——至少在原则上——会直接和间接地受到*许多*其他个体的影响，因此成对或三人之间的互动可能只是群体中所有成员之间错综复杂关系关系的冰山一角。问题是，一旦超出成对和三人之间的行为动态，就会变得非常复杂，很快变得难以处理，而当时我还有其他项目在进行，所以没有深入挖掘。幸运的是，其他人做了。过去二十年左右，来自世界各地的动物行为学家——也称为动物学家——一直在研究非人类的*社会网络*。在这些社会网络中，信息在网络成员之间直接和间接流动，个体的行为会产生涟漪效应，波及整个群体。\n\
  \n早期，动物行为研究界对社会网络是否重要持怀疑态度。普遍共识是，非人类表现出丰富多样的复杂社会行为，但并不*那么*复杂：不具备社会网络的复杂性。这种反应与过去多次发生的情况一致。我们假设复杂行为必须是人类独有的，因此很少有研究探索动物中的这种现象。但最终有人会偶然发现一个例子。一旦该例子进入文献，人们便开始意识到达尔文和其他人长期以来所认识到的：许多复杂行为存在于整个动物王国。很快研究人员就会提出重新定义该行为，以便至少在原则上，非人类也可能出现。社会网络不应以\
  \ Facebook 和 Twitter 等来定义，而应以信息是否在群体成员之间直接和间接流动，以及个体是否利用这些信息来行动为标准。\n\n当研究人员在 2000\
  \ 年代初开始发表动物社会网络的例子时，怀疑逐渐消退。从那时起，动物行为研究人员一直在构建模型并在野外检验假设，探讨社会网络*如何*运作、*为什么*有效、谁得到什么、谁最重要谁不那么重要等等。我们发现，动物社会网络中的一些成员扮演着突出的角色，充当信息枢纽；另一些则不然。网络可以很大也可以很小。一些网络主要是雌性，其他主要是雄性，但大多数网络包含两性成员。网络的部分结构可能基于亲缘关系，但通常并非如此。\n\
  \n在同一动物种群中，与一种行为相关的社会网络（例如觅食）可能与另一种行为（例如交配）所依据的社会网络相似，但更常见的是不相似，也就是说，通常同时存在多层、相互连接的社会网络，个体在每个网络中扮演不同的角色。社会网络*分析*的作用是让研究人员能够描绘和理解非人类的社会网络，并生成关于此类网络动态的可检验假设。我将探讨这一切，提供对驱动动物社会网络的引人入胜、常常复杂且微妙的动态的看法。\n\
  \n研究人员发现，嵌入社会网络在动物生活的几乎每一个方面都起着关键作用：它们吃什么、如何保护自己、与谁交配、亲子关系动态、权力斗争、导航、交流、游戏、合作、文化等等。微生物——有些有益，有些不那么有益——也会搭乘这些社会网络中的动物“顺风车”。\n\
  \n\n\n\n\n动物社会网络的研究现在如此前沿，以至于是时候讲述它的故事了，以及所有这些研究背后的科学家的故事。[content]\n\n动物社会网络的研究现在如此前沿，以至于是时候讲述它的故事了，以及所有这些研究背后的科学家的故事。[content]\n\
  动物社会网络的研究现在如此前沿，以至于是时候讲述它的故事了，以及所有这些研究背后的科学家的故事。借鉴动物行为学、进化论、计算机科学、心理学、人类学、遗传学和神经生物学的研究，《*The\
  \ Well-Connected Animal*》将探索长颈鹿、大象、袋鼠、许多灵长类和鸟类物种、塔斯马尼亚恶魔、鲸鱼、蝙蝠、田野蟋蟀、魔鬼鱼等动物的社会网络。在每种情况下，我都会考察科学家如何以及为何检验他们的假设。在此过程中，我们将与研究人员一起环游地球，他们在澳大利亚到亚洲、非洲到欧洲，以及北美和中美洲到南美洲的野外各地研究社会网络。\n\
  \n我与书中介绍的所有研究人员进行了长时间的交谈，并且我刻意努力确保研究动物社会网络的女性科学家的成果得到应有的关注。近 45% 的所涵盖研究是由女性主导或共同主导的。我还介绍了年轻研究人员的成果，这并不困难，因为许多社会网络研究都是由新一代动物行为学家主导的，他们通常是自学成才的。\n\
  \n在了解动物社会网络科学本身之外，我们还将参观进行研究的实地地点，幕后一窥研究人员在野外研究社会网络时发生的事情。我们将体会清晨在乌干达醒来后直接置身于黑猩猩社会网络中的感觉，体会当你试图追踪迁徙数千公里的鸟类的社会网络时会发生什么，为什么有人会去研究魔鬼鱼的社会网络，以及更多内容。伴随着所有的冒险，我们将了解到机缘往往胜过精心制定的计划，探索在野外研究社会动物网络时的起伏和曲折。\n\
  \n# 1. The Networked Animal\n\n在大自然中我们从未看到任何孤立的事物，而是看到一切与别的事物相连接——在其之前、旁边、下方和上方。——约翰·沃尔夫冈·冯·歌德\n\
  \n在波多黎各东部海岸外约 1.5 公里处的 Cayo Santiago 岛，人类与其他灵长类的典型关系被颠倒过来。生活在该岛上的 1,700 只恒河猴（*Macaca\
  \ mulatta*）可以自由地在任何时间、任何地方活动。人类不行。乘坐十五分钟的船程从前渔村 Punta Santiago 的码头出发，最多二十四名人类被允许在上午\
  \ 7:30 开始上岛，届时*他们*会先进入笼子待几分钟，部分是为了放下随身携带的食物，然后才被允许在岛上活动。在人类午餐时间，约中午时分，他们会再次进入笼子吃午饭。另一方面，猴子可以自由地在任何地方进食，包括每天早晨由人类访客填充的食物站。从下午约\
  \ 2:30 开始，所有*Homo sapiens* 都成为不受欢迎的类人猿，必须前往码头，重新登船，驶回大陆，直到第二天早晨才被允许返回。\n\nCayo 的恒河猴种群始于\
  \ 1938 年，当时灵长类学家和探险家 Clarence Carpenter 从印度十二个地区捕获了约 500 只恒河猴。他和这些猴子从加尔各答经波士顿和纽约航行到圣胡安，然后前往\
  \ Cayo Santiago，这是一个最近租借给波多黎各大学热带医学院的 15 公顷岛屿。*《纽约时报》* 用这则故事娱乐了读者，讲述了为期 51 天、22,000\
  \ 公里的旅程，期间 Carpenter 单枪匹马地照顾他的猴子旅伴。甚至*《生活》*杂志也认为有必要派遣其最无畏的摄影师之一 Hansel Mieth 前往\
  \ Cayo，对猴子被释放到岛上的情景进行摄影报道。\n\nLauren Brent 在她的博士导师建议她考虑前往该岛研究猴子的社会动态时开始在 Cayo Santiago\
  \ 与恒河猴合作。她立刻爱上了她研究对象的一切、岛屿以及她很快着手解决的问题。“Cayo 是一个相当完美的研究系统，”Brent 说，“而且这些猕猴是如此高度社会化的小家伙。”她的导师向她推荐了\
  \ Darren Croft、Richard James 和 Jens Krause 的《*Exploring Animal Social Networks*》，这是第一本专门介绍非人类社会网络的书籍，很快\
  \ Brent 就认为她可以用网络思维更好地理解她的猕猴。\n\n完成博士工作后，Brent 加入了神经科学家 Michael Platt 的实验室，他对灵长类大脑感兴趣，并获得了美国国立卫生研究院的研究资助，用于研究\
  \ Cayo Santiago 的恒河猴。他知道 Brent 在那里有恒河猴的经验，于是聘请她加入他的团队，负责工作的行为部分。他们此后一直合作。\n\n恒河猴是研究最充分的灵长类物种之一，可以活到三十年。雄性通常比雌性稍高，体重约为\
  \ 8 公斤，而雌性体重约为 5 公斤。Cayo Santiago 的恒河猴工作起来有点棘手，部分原因是它们社会群体的规模很大。猴子经常在移动，即使不移动时，它们身上用于标记的纹身和耳缺口也可能被灌木遮挡，或被猴子与研究人员之间的角度遮挡。这意味着\
  \ Brent 和其他与恒河猴合作的人不仅必须记录每只猴子的毛色和图案、眼睛特征以及其他有助于区分岛上居民的特征，还必须记住这些信息，并在群体中进行瞬间识别，该群体可能由几十只到一百多只个体组成。随着时间的推移，Brent\
  \ 掌握了这一技能，当她掌握后，她了解到恒河猴的社会网络影响着它们在 Cayo 的生活（和死亡）的方方面面。\n\nBrent 的早期研究之一集中在两组恒河猴的雌性身上，其中一组有五十八只雌性，另一组约二十只。她会从名单中挑选一只猕猴，找到它，跟随它，记录它的行为，然后挑选另一只猴子重复这一过程。猕猴经常互相梳理毛发，这不仅可以清除接受者的寄生虫，还可以降低所有参与者的压力水平。Brent\
  \ 对雌性的梳理网络以及个体在不梳理时的接近网络特别感兴趣。她想看看网络是什么样的，以及它们是否随时间变化：特别是网络结构是否在交配季节，即 3 月下旬至 7\
  \ 月下旬，雌性与雄性进行性互动，以及分娩季节，即 11 月至 12 月，雌性照顾婴儿之间发生变化。为了进行比较，她使用了网络指标，如密度——衡量群体成员连接紧密程度的指标，这将在后续章节中更详细地探讨。\n\
  \nBrent 发现，在交配季节，雌性之间无论是梳理还是接近都比分娩季节更紧密地连接。通过探测网络获取关键个体的信息，她发现交配季节但非分娩季节，梳理和接近网络围绕少数几只雌性展开。所有这一切都说得通，因为在分娩季节，雌性会全神贯注于自己的婴儿。\n\
  \n\n\n\n\n这项研究是关于动物社会网络如何随季节变化的最早研究之一，Brent 将其视为仅是第一步。现在，有了对基本网络结构和动态的认识，她和她的同事们可以深入挖掘。假设，当然，猴子们停止偷他们的\
  \ iPad。Camille Testard 是与 Brent 和 Platt 合作的研究生，她就是一次此类抢劫的受害者。她只是把包放下了一会儿，但这就足够了。当猕猴窃贼爬上树后，Testard\
  \ 追上了他，当她吓到那名强盗时，他把 iPad 掉进了她张开的怀抱中。\n\n抛开猴子的恶作剧不谈，当 Brent 及其团队查看 2010 年至 2017 年的数据时，他们发现，与网络中她们偏爱的伴侣有着牢固友谊（紧密联系）的雌性，其生存概率高于其他雌性。雌性提高生存机会的另一种方式是通过\
  \ *weaker* 联系，但拥有 *lots* 的伴侣。这不仅仅是朋友的数量或特定偏爱友谊的强度：朋友的朋友对雌性猕猴也很重要。雌性拥有的朋友的朋友越多，她产生的后代就越多。\n\
  \n到 2017 年，Brent 及其同事——包括像 Daniel Phillips 这样的研究助理，他每天都在 Cayo Santiago——对 Cayo 上猕猴社会网络的工作方式及其含义有了深入的理解。当然，总是还有更多东西需要学习，但其中很大一部分可能涉及填补细节。然后玛丽亚飓风袭来，摧毁了它所经过的一切，包括猕猴们根植于其中的社会网络。\n\
  \n当玛丽亚飓风猛烈袭击 Cayo 时，Brent 最先想到的是工作人员和研究助理，比如 Phillips，他们全年都住在 Punta Santiago 附近。“\\\
  [I\\] 无法联系上，因为所有的手机信号塔都瘫痪了。 . . . 在玛丽亚飓风之后，没有人听到 Danny 的消息，两周，也许三周。 . . . 这相当可怕。”最终，她还是得知\
  \ Phillips 和项目上的每个人都安全了。然后她的思绪转向了猕猴和岛屿本身。“当我们看到卫星追踪器 . . . 我就想，‘这个野外站点没了；这些猴子都死了。 . . .\
  \ 这是四级飓风，而这些动物只是坐在大海中央这块小岩石上的地面上。’”\n\n它们并非全部死亡，但玛丽亚飓风把猴子的世界彻底颠覆了，这意味着它们需要重新建立自己的社会，以及其中所有错综复杂、复杂的运作部分。而且要迅速。对于\
  \ Brent 及其团队来说，玛丽亚飓风意味着许多事情，包括思考大规模自然灾害对社会网络影响的新方式。为此，他们需要在其他方面，构建在非人类社会网络分析领域一些先驱的工作之上。其中一位先驱就是动物行为学家\
  \ David McDonald。\n\n* * *\n\n哥斯达黎加 Monteverde 的热带山地森林，David McDonald 在那里研究长尾拟鹃\
  \ (*Chiroxiphia linearis*)，景色令人叹为观止。被绞杀藤蔓覆盖的巨大树木为猴子提供食物，而林下层则遍布各种灌木以及咖啡科的树木。在任何时候，你都可能会看到一只美丽的辉凤尾雉\
  \ (*Pharomachrus mocinno*) 从头顶飞过，它有红色腹部和蓝色尾巴，或是一只三肉垂钟鸟 (*Procnias tricarunculatus*)，一半白色一半栗色褐色，肉垂使其看起来像是有胡子。\n\
  \n在将近二十年的时间里，坐在用黑色塑料防水布搭在小木架上的观鸟盲棚里，McDonald 一年又一年地置身于这一切的中心。他和他的同事及助手在这些盲棚里累计记录了超过\
  \ 15,000 小时。McDonald 及其团队在那里，部分是为了观看一场会让任何百老汇编舞家都羡慕的歌舞表演。由五到十五只长尾拟鹃雄鸟组成的集群——身披红、蓝、黑的羽毛——花费时间在有栖木表演以吸引雌性交配的区域。繁殖季节四月和五月之外，集群中的任何雄鸟都可以练习歌唱和舞蹈，而且他们确实这样做。即使在繁殖季节，只要没有雌性在场，每个雄鸟都可以自由地在栖木区歌唱和舞蹈。当雌性在附近时，只有\
  \ alpha 和 beta 雄鸟——群体中排名最高的两个雄鸟——才能在栖木上歌唱和舞蹈。所有其他雄鸟都会被表演的这对驱赶离开栖木。处理完这一切后，alpha\
  \ 和 beta 雄鸟——坐在一个明确的栖木上，披着华丽的羽毛——为雌性表演它们的节目。\n\nMcDonald 的野外站点靠近令人惊叹的 Monteverde\
  \ 云雾森林。大部分白天，从盲棚内部看，那片森林是看不见的。“从距离 10 米的小而拥挤的盲棚观察鸟类，”McDonald 说，“这很像 . . . 一战中的堑壕战。漫长的极度无聊夹杂着短暂的极度恐惧。”这种恐惧通常始于\
  \ alpha 雄鸟发出 *teeamoo* 叫声，吸引 beta 雄鸟来到该区域。然后从树冠上，这对鸟开始进行一套协调一致的歌唱，发出一种对人耳——至少对英语使用者——听起来像单词\
  \ *toledo* (*toe-lee-doe*) 的叫声，第一个音节在 F 降音，中间音节升至 A 降音，最后一个音节再次回到 F 降音。这通常足以引诱雌性到来，但有时会加上一个\
  \ *owng* (*oh-wing*) 叫声。\n\nMcDonald 花了很多时间数 *toledo* 叫声的次数。“它们一个季节可以发出一百万次 \\[*toledo*\
  \ 叫声\\]，”他说。他用在随身索尼盒式录音机上录下的内容——他的博士工作在 20 世纪 80 年代初完成，当时盒式录音机是技术最先进的——来进行歌曲微细节的后续分析。在\
  \ *toledo* 叫声吸引雌性后，雄鸟会降落到一个共同的栖木，最常见的是距离地面约 2 米的树枝或藤蔓。\n\n一旦在栖木上，协调的舞蹈就开始了，偶尔会发出针对雌性的叫声，以确保她们在注意；不过一旦舞蹈加速，很难想象雌性会注意其他任何事情。面对雌性时，雄鸟开始进行跳跃回合，相互之间跳跃。离雌性最近的雄鸟直飞上升约\
  \ 60 厘米，翅膀以惊人的速度拍打。另一只雄鸟随后向雌性滑去，而飞行中的鸟在跳跃伙伴身后着陆。雄鸟轮流扮演角色，一次跳跃回合可能涉及多达 200 次跳跃展示，有时会被“闪电坠落”打断，雄鸟在此过程中比正常下降得更陡峭。\n\
  \n随着跳跃的继续，alpha 雄鸟有时会向 beta 雄鸟发出 *buzz-weent* 叫声。这会导致跳跃加速，而占优势的雄鸟可能会发出缺少 *buzz*\
  \ 部分的 *weent* 叫声，这会导致 beta 雄鸟结束舞蹈。然后占优势的雄鸟开始“蝴蝶飞”，这是一种独飞类型，他在栖木上方盘旋，雌性全神贯注地观看。交配通常在那之后在占优势的雄鸟和雌性之间发生。\n\
  \n年复一年，McDonald 和他的同事，包括动物行为学家 Jill Trainer，会前往哥斯达黎加，给长尾拟鹃戴上带独特颜色编码标签的环以识别鸟类。研究人员在那些盲棚里花费了无数小时，记录拟鹃所做的一切，而他们的录音机收集鸣叫数据。不在森林里时，他们住在附近的贵格会社区，租用当年可用的任何空间。\n\
  \n\n\n\n\n没过多久，麦克唐纳就了解到在繁殖季节，*没有任何*东西能阻碍雄鸟表演它们的歌声和舞蹈。有一年，一场地震引发了森林火灾，火势蔓延到他的研究地点。“我因为\\\
  [地震\\]倒在了地上，”麦克唐纳描述道，“我当时想，也许我吸入了烟雾。”后来，当他与拥有他研究土地的农夫交谈时，麦克唐纳忍不住笑了，因为那位农夫说，在地震和火灾事件中给他印象最深的是，长尾拟鹛只是继续唱歌和跳舞。\n\
  \n麦克唐纳的研究地点包含许多栖枝区，每个区都有自己的一对常驻的阿尔法和贝塔雄鸟。但研究地点的大多数雄鸟，甚至大多数年长的雄鸟，都不是阿尔法或贝塔。麦克唐纳很快就痴迷于弄清楚究竟是谁获得了这两种令人垂涎的角色。解开这个谜团的第一块拼图来自于他了解到拟鹛寿命很长。大多数小型鸟类寿命都不长，很多只能活三四年。拟鹛是个例外（尽管我们不知道为什么），体重只有半盎司，“所以你几乎可以用一枚邮票把两只寄给奶奶，”麦克唐纳说，但“它们可以活二十年。”\n\
  \n交配的雄性拟鹛的平均年龄是十岁。达到贝塔地位大约需要八年，成为阿尔法雄鸟则需要更长时间。阿尔法-贝塔伙伴关系的形成可能需要数年时间，但一旦形成，一对通常会再在一起很多年。这真的很重要，正如麦克唐纳和他的同事们发现的那样，因为这对关系保持在一起的时间越长，它们的同步性就越好，而一对阿尔法和贝塔雄鸟的*toledo*叫声同步性越高，访问它们栖枝的雌鸟就越多；访问栖枝的雌鸟越多，该栖枝的交配次数就越多。几乎所有的交配都发生在阿尔法雄鸟身上，他在一个繁殖季节可以与数十只雌鸟交配。贝塔雄鸟的学徒角色最终会在他继承栖枝区时获得回报，并在与之相关的所有好处中获得回报，当年老的阿尔法死亡或无法再主导他时。\n\
  \n长寿以及沿途形成的深厚社会纽带，麦克唐纳认为，这似乎是最终谁成为阿尔法和贝塔雄鸟的核心。但它是如何运作的呢？他确信*年轻*雄鸟所做的事情在后来获得阿尔法或贝塔等级时很重要，但即使研究这些鸟超过十五年，他也没有理论工具来把所有东西拼凑起来。这在\
  \ 2005 年发生了变化，当时麦克唐纳正在浏览包括*Nature*和*Science*在内的期刊文章。在那里，他读到社会学家如何使用社会网络分析来研究复杂人类社会的动态，麦克唐纳认为这可能正是他理解拟鹛栖枝上生活的工具所需要的。随着他更深入地阅读，麦克唐纳开始理解社会网络分析的工作方式，如何绘制群体成员之间直接和间接的联系，追踪成员之间信息的流动，描述一组个体的整合程度，并辨别驱动网络的核心人物。很快他就确信这种方法将为他提供他需要的信息来回答谁最终成为阿尔法和贝塔的问题。\n\
  \n麦克唐纳知道，成功繁殖的雄鸟平均年龄约为十岁，一只雄鸟在形成期的一到六岁期间会有许多其他雄鸟伴侣。利用他在隐蔽处收集的 9,288 小时数据，麦克唐纳观察了个体在其形成期与多少其他雄鸟交往，以及这些伴侣与周围其他人形成了多少联系。然后他构建了社会网络，看看是否能检测出哪些雄鸟最终成为成功的二重唱歌手。\n\
  \n麦克唐纳发现，年轻时在社会网络中嵌入最深的雄鸟是后来保卫栖枝并表演二重唱的雄鸟。要理解为什么，请记住，虽然每个栖枝区只有两只雄鸟为雌鸟表演二重唱，但有很多其他雄鸟在该区闲逛，在没有雌鸟在附近时练习表演。麦克唐纳发现，一到六岁之间形成的网络是关键预测因子，当雄鸟在栖枝区之间移动并充满其他雄鸟时，这些网络可以预测哪些雄鸟大约五年后会成为阿尔法和贝塔。雄鸟在这些早期在栖枝区与其他雄鸟的联系越多，他成为二重唱者的可能性就越大，通常与朋友（他联系最紧密的雄鸟）或朋友的朋友一起：网络中每增加一个联系单位，雄鸟在五年内达到阿尔法或贝塔地位的机会就会增加五倍。在形成期，雄鸟建立联系，在社会网络中创造并巩固自己的角色，这种角色在多年后会得到回报。\n\
  \n在他的网络研究发表后，麦克唐纳回顾了他研究长尾拟鹛最早期的一些文件。他偶然发现了一张他制作但早已遗忘的老图：他在很久以前就绘制了拟鹛网络，并标出了雄鸟之间的联系，早在他拥有处理它的工具之前——他一直都在思考社会网络，只是他不知道而已。\n\
  \n* * *\n\n当 T. Brandt Ryder 开始研究厄瓜多尔 Yasuní 生物圈保护区中丝尾拟鹛（*Pipra filicauda*）的生活和时代时，他对社会网络了如指掌。在开始这项工作之前，Ryder\
  \ 读过麦克唐纳关于长尾拟鹛的社会网络研究，甚至还招募麦克唐纳作为他的博士委员会成员。\n\n所有五十三种拟鹛物种，包括丝尾拟鹛和长尾拟鹛，都进行夸张的求偶展示，但这一事实掩盖了它们协调展示频率的重要差异。在一些拟鹛物种中，展示是一只鸟的表演，雄鸟在自己的领地里歌唱跳舞：任何雄鸟间的互动在很大程度上是敌对的。在其他物种中，像麦克唐纳的长尾拟鹛，展示几乎总是涉及阿尔法和贝塔雄鸟表演协调和合作的歌舞\
  \ routine，以吸引雌鸟。而像丝尾拟鹛这样的物种中，雄鸟有时表现出协调的展示行为，有时则独自行动：这可能是一个从独唱到强制性成对合作展示的进化路径上的一个进化步骤。对\
  \ Ryder 来说，这意味着一个机会，可以利用社会网络深入研究一个研究不足但可能重要的合作进化阶段。\n\n在基多东南三百公里处，位于低地亚马逊雨林，Ryder\
  \ 在收集博士论文数据时称之为家的 744 公顷联合国教科文组织 Tiputini 生物多样性站，是 Universidad San Francisco de\
  \ Quito 和波士顿大学之间国际合作的成果。该站坐落在 150 万公顷的 Yasuní 生物圈保护区内，是地球上每平方米生物多样性最丰富的生态系统之一。Tiputini\
  \ 和 Yasuní 生物圈保护区栖息着 200 种哺乳动物，包括巨蚁獾（*Myrmecophaga tridactyla*）、金冠绢猴（*Saguinus tripartitus*）和灰褐狨猴（*Callicebus\
  \ discolor*）；150 种两栖动物，包括地图蛙（*Hypsiboas geographicus*）和网纹箭毒蛙（*Ranitomeya ventrimaculata*）；250\
  \ 种鱼类；以及惊人的 610 种鸟类，包括安第斯秃鹫（*Vultur gryphus*）、闪亮紫耳蜂鸟（*Colibri coruscans*）、巨蜂鸟（*Patagona\
  \ gigas*）和丝尾拟鹛。\n\n\n\n\n\n## 丝尾拟王喉鸟雄鸟的合作求偶展示\n\n丝尾拟王喉鸟雄鸟的合作求偶展示仅占所有展示的 30%——其余都是独角戏。当这些展示是合作进行的时，它们与发生的环境一样壮丽。从展示栖枝上，一对雄鸟的体重几乎在邮票上都难以体现——每只都身披如其长尾近亲般华丽的黄色、红色和黑色羽毛——轮流进行同步的炫目展示，以吸引雌鸟，包括左右跳跃、来回跳跃、尾羽抬起时向后侧移、快速悬停，以及“俯冲飞行”，即全速飞起然后在伴侣上方做出\
  \ S 形转弯。\n\n长时间坐在观鸟盲棚内，手持望远镜和录音机，Ryder 观察着丝尾拟王喉鸟的一切。大部分时间里，拟王喉鸟并未展示，这给了他充足的时间思考当它们最终登台时那些歌舞表演的功能。问题是，这也给了他时间去思考蚊子、蚂蚁，特别是汗蜂无休止的攻击，这些家伙最喜欢的就是一个静止、出汗的人类目标。同样令人沮丧，但也是野外工作的必备部分，是当一场过度协调的展示展开时，尽管他能够辨认出一只拟王喉鸟的腿环，从而确定其身份，但另一只的腿环却被一片叶子或类似物遮挡。“令人心碎”就是\
  \ Ryder 用来形容这种命运转折的方式。\n\n### 社会网络与繁殖成功\n\n利用 414 小时的观察信息，Ryder 首先为来自三个群体的雄鸟构建了社会网络，主要基于雄鸟之间协调的合作展示。在最一般层面上，在全部三个丝尾雄鸟网络中，每只鸟的平均连接数相对较低。但鸟只之间的连接数存在很大差异：网络中的大多数互动都由少数领地持有者驱动，他们充当网络枢纽，以及他们互动的雄鸟。\n\
  \n丝尾雄鸟在其领地上的任期是其繁殖成功的最强预测因子：雄鸟拥有领地的每增加一年，其成为雏鸟父亲的几率就会增加四倍。这给雄鸟带来了巨大的压力，使其最终获得领地，而他们实现这一目标的方式就是建立网络。要预测一只雄鸟是否会从非领地持有者的地位上升为领地持有者，你需要知道的是他拥有的网络连接数：个体在合作展示中与之互动的每个额外伙伴，都使其最终获得领地的可能性增加七倍。\n\
  \n令人惊讶的是，Ryder 和动物行为学家 Roslyn Dakin 发现，网络中雄鸟的平均展示伙伴数量越大，该网络随时间推移的稳定性就越低。大多数模型认为，网络成员的连接越紧密，网络就应该越稳定，这符合直觉，因为朋友之间的社会性需要更多的力量才能被破坏。但丝尾拟王喉鸟显示出相反的模式。为什么？起初，Ryder\
  \ 和 Dakin 摇着头，寻找答案。然后，他们终于弄明白了发生了什么：随着个体鸟只与越来越多的其他鸟只互动，可能的伙伴池变得更加丰富。突然之间，一只雄鸟可能会发现一个比他现有的展示伙伴更喜欢的展示伙伴。随着时间的推移，所有这些都会逐渐显现出来，但在这一过程中，网络会经历一段不稳定的时期。\n\
  \n长尾拟王喉鸟和丝尾拟王喉鸟中存在的社会网络表明，网络化不仅在所有展示都是协调的物种中很重要（长尾拟王喉鸟），也在大多数展示为单雄表演的物种中很重要，只有大约十分之三的展示是协调的（就像丝尾拟王喉鸟）：很可能社会网络实际上是从大量雄雄攻击和偶尔的协调展示转变为与更多展示伙伴建立联系并获得可能更大的回报的先决条件。\n\
  \n### 玛丽亚飓风与猕猴社会网络\n\n与圣地亚哥岛上的猕猴相比，长尾拟王喉鸟和丝尾拟王喉鸟已经很幸运，因为它们的社会网络并未被四级飓风撕裂。那么，事实上我们之前了解到的那些高度社会化的小猕猴家伙和姑娘们的网络发生了什么呢？\n\
  \n飓风玛丽亚摧毁了圣地亚哥岛上超过 60%的绿色植被，以及 Cayo 团队建立的大量基础设施——包括为动物提供部分食物的喂食器，而它们现在比以往任何时候都更需要这些——但飓风期间没有一只猕猴被杀，之后大约只有\
  \ 2%的动物死亡，很可能是由于饥饿。“这完全不可思议，” Lauren Brent 说。“它们并不大，对吧？而且所有的树都被吹倒了。就像你能抓住什么东西一样。”起初\
  \ Brent 认为也许猕猴躲在了被称为 Happy Valley 的地方，那里部分免受风力影响，但通常 Happy Valley 只有五十只猕猴，没有办法为\
  \ 1,700 只猴子提供庇护。她和她的团队正在努力拼凑发生了什么，但仍然无法弄清楚每一只猕猴是如何幸存于四级飓风的全部冲击的。\n\n玛丽亚发生大约三个月后，震惊部分消退后，Brent\
  \ 开始认真思考猕猴社会网络的动态，主要是因为她从 Danny Phillips 和其他回到岛上的野外助理那里听到的消息。他们会告诉她“猴子们行为很奇怪”，当\
  \ Brent 问怎么奇怪时，现场团队告诉她它们似乎对彼此特别友好。2018 年初，飓风发生后大约五个月，她下去亲自查看。岛上仍在从玛丽亚的打击中恢复（波多黎各的大部分地区也是如此）。“但当我到达\
  \ Cayo 时，”Brent 说，“我就像‘是的，我看到了。’……它们看起来更宽容了……我从未期望会很酷的猴子就这样并排坐在一起。”\n\n当时，人们对动物在全面自然灾难后如何调整其社会动态知之甚少，而飓风玛丽亚对波多黎各的后果虽然可怕，但也许\
  \ Brent 认为，一个潜在的积极因素可能是这场灾难揭示了这些动态。当她和她的团队更深入地研究这些突然变得更加友好的猕猴时，他们发现玛丽亚从根本上改变了猴子的社会网络。一方面，当他们比较飓风玛丽亚前三年与飓风后一年内两组猕猴的梳理和亲近网络时，数据证实了猴子们变得更友好的轶事观察：飓风后，猕猴被发现彼此靠近的可能性是之前的四倍，它们梳理彼此的可能性增加了\
  \ 50%。更重要的是，在玛丽亚之前梳理最少、在他人附近停留时间最少的猴子，在飓风后这些行为的增加幅度最大。\n\n\n\n\n\n![飓风玛利亚前后，圣地亚哥岛上的恒河猴梳理网络。飓风玛利亚之后，恒河猴的社会伙伴更多，但与之前的伙伴并未形成更牢固的纽带。\
  \ (C. Testard, M. Larson, M. M. Watowich, C. H. Kaplinsky, A. Bernau, M. Faulder,\
  \ H. H. Marshall et al., “Rhesus Macaques Build New Social Connections after a Natural\
  \ Disaster,” Current Biology 31 (2021): 2299–309. 恒河猴图片经 istock.com 许可使用。](img/chi-Dugatkin-fig01_REPLACEMENT-5-15-23.jpeg)\n\
  \n飓风玛利亚前后，圣地亚哥岛上的恒河猴梳理网络。飓风玛利亚之后，恒河猴的社会伙伴更多，但与之前的伙伴并未形成更牢固的纽带。 (C. Testard, M. Larson,\
  \ M. M. Watowich, C. H. Kaplinsky, A. Bernau, M. Faulder, H. H. Marshall et al.,\
  \ “Rhesus Macaques Build New Social Connections after a Natural Disaster,” *Current\
  \ Biology* 31 (2021): 2299–309. 恒河猴图片经许可使用自 [istock.com](http://istock.com)。\n\n\
  聚焦于梳理行为的分析，Brent 及其同事认为网络结构的变化可能源于伙伴数量的增加，或与特定伙伴相处时间的增加。或两者兼有。他们发现的是，玛利亚之后，恒河猴的社会伙伴更多，但与伙伴的梳理关系平均强度并未改变。猴子在网络中结交了更多友谊，而非强化已有的关系：玛利亚让群体中的恒河猴更加紧密，额外的梳理伙伴缓冲了飓风带来的毁灭性影响。而再次，朋友的朋友很重要：猴子在建立新关系时选择阻力最小的路径。如果飓风玛利亚前猴子\
  \ 1 与猴子 2 存在梳理关系，那么飓风后它更可能与猴子 2 的梳理伙伴建立梳理关系。\n\n* * *\n\n在对动物社会网络的外观及其对其中动物的意义有了大致了解后，我们现在可以深入挖掘一下社会网络方法在动物行为学领域发展的历史，包括动物行为学家如何从其他学科引入许多思想并对其进行“进化化”。然后，通过研究从硫冠凤头鹦鹉到魔鬼鱼和\
  \ vervet 猴等各种动物的社会网络，我们将探究社会网络分析背后的理论，并更细致地了解动物行为学家研究网络时使用的理论核心要素。\n\n# 2. 维系的纽带\n\
  \n我坚信，没有推测就没有好的、原创的观察。——查尔斯·达尔文致阿尔弗雷德·拉塞尔·华莱士，1857 年 12 月 22 日\n\n社会网络思维的种子遍布阿尔弗雷德·埃斯皮纳斯的著作中。1877\
  \ 年 6 月，这位 33 岁的 aspiring 社会学家在索邦大学科学学院面前为他的博士论文《Des sociétés animales》答辩。埃斯皮纳斯提出，非人类社会可以并且应该由社会学家来研究。他认为，动物的社会行为“构成了社会学的第一章”。这是一个激进的想法，以至于索邦的一些人认为该主题根本不是科学，但埃斯皮纳斯赢得了这场争论并获得了他的\
  \ *doctorat ès lettres*。埃斯皮纳斯假设，动物社会在时间上持续存在，并具有群体层面的特性，这些特性源于个体之间复杂的社会互动网络。其他社会学家，如拉斐尔·佩特鲁奇，很快也开始倡导类似的观点。\n\
  \n这些思想花了近八十年才迁移到生物学，部分原因是对动物感兴趣的生物学家不知道社会学方面的研究。但不仅仅如此。早期动物行为学家的关注点并不在于群体动态如何影响社会行为。1950\
  \ 年代初的动物行为学工作通常将社会行为视为先天性的，并受大脑中特殊“中枢”的控制。刺激物像钥匙一样打开大脑中的中枢，进而导致动物行动。许多研究者将社会组织视为先天刺激-反应关系的总和。但一些人开始质疑这些行为的机械性解释，并启动了旨在阐明社会和生态因素在群体内部和群体之间塑造行为作用的研究。\n\
  \n到 20 世纪 50 年代末，动物行为学家开始构建动物社会群体的示意图，其中不仅包括个体使用的行为，还包括个体之间的接近程度、群体凝聚力、群体稳定性、群体是否可渗透（对新成员开放）等。很快，动物行为学家就建议扩大范围以包括小团体——作为一个单元行动的子群体，信息在其中从一个成员流向另一个成员。\n\
  \n灵长类动物学家是最早接受这一方法的人，因为他们（错误地）认为这种新方法所固有的复杂动态需要灵长类动物的大脑，而且更重要的是，因为一些社会学家正在研究（非人类）灵长类动物，因此社会学与灵长类动物学之间已经存在一些交流。正因为如此，一些动物行为学家开始使用所谓的社会测量方法，该方法用于描述人类群体的结构以及个体在群体中的位置。社会测量使用数学图论来描述群体中人与人之间社会关系的模式。个体被表示为\
  \ `nodes`，并通过称为 `ties` 的线连接（也称为 `edges`），代表攻击、贸易、合作等互动。这种社会测量方法是对现代社会网络分析的重要先驱。\n\
  \n1965 年，在将社会测量方法应用于非人类的一个非常早期的例子中，灵长类动物学家唐纳德·萨德构建了梳理互动的社会图——今天我们称之为社会网络——这是我们在上一章中了解到的圣地亚哥岛上恒河猴的祖先。萨德的社会图不仅捕捉了梳理行为本身，还通过使用\
  \ `weighted ties` 捕捉了梳理关系的强度，其中纽带的粗细显示了梳理互动的相对频率：线越粗，梳理关系越强。\n\n20 世纪 70 年代中期，动物行为学家罗伯特·欣德开始更认真地思考成对个体之间的互动原则上可以影响群体生活本身动态的观点。欣德意识到，在社会测量模型中，`nodes`\
  \ 同样可以代表任何灵长类物种中的个体，而不仅仅是恒河猴：事实上，鸟类、鱼类、昆虫等群体的个体也可以被表示为 `nodes`。\n\n但存在问题。首先，社会测量研究受制于计算能力的缺乏。社会测量中使用的一些指标手工计算起来很简单。很容易计算一个称为\
  \ `degree` 的指标，它只是统计动物与之互动的个体数量。`Strength`，由 `weighted ties` 衡量，同样可以通过使用网络中成对动物之间互动的相对频率来轻松计算。但我们稍后将深入探讨的许多其他指标的使用，必须等待计算能力的更大可用性。\n\
  \n\n\n\n\n![恒河猴群中的梳理关系（实心圆 = 雌性；虚线圆 = 雄性）。连线——连接猴子的线条——代表梳理关系。这里的连线是有权重的，因此线的粗细显示了梳理关系的相对强度。这里的连线也显示了梳理的方向性。大多数梳理关系是双向的，但有些是单向的。基于\
  \ D. S. Sade，《恒河猴群中亲子及兄弟姐妹关系的某些方面，并讨论梳理》，《美国身体人类学杂志》23（1965）：1–17。恒河猴图片经 istock.com\
  \ 许可使用。](img/chi-Dugatkin-fig02_REPLACEMENT-5-15-23.jpeg)\n\n恒河猴群中的梳理关系（实心圆 = 雌性；虚线圆\
  \ = 雄性）。*连线*——连接猴子的线条——代表梳理关系。这里的连线是*加权*的，因此线的粗细显示了梳理关系的相对强度。这里的连线也显示了梳理的方向性。大多数梳理关系是双向的，但有些是单向的。基于\
  \ D. S. Sade，“Some Aspects of Parent-Offspring and Sibling Relations in a Group\
  \ of Rhesus Monkeys, with a Discussion of Grooming,” *American Journal of Physical\
  \ Anthropology* 23 (1965): 1–17。恒河猴图片经许可来自 [istock.com](http://istock.com)。\n\n\
  当这种计算能力在二十一世纪初变得唾手可得时，社会网络分析应运而生。随之而来的是新的指标，使动物行为学家能够更深入地探究非人类网络的复杂基础。但社会网络分析不仅仅是社会度量的高性能版本。它们寻求超越仅仅描述网络结构：这些分析旨在阐明网络是如何形成的，它们具有哪些属性，以及在动物行为领域，它们在生态和进化背景下的功能是什么。为了了解它们是如何做到这一点的，并深入了解现在动物行为学家可用的社会网络工具，我们将探索西巴布亚拉贾安帕特摄政区令人叹为观止的美丽水域中的蝠鲼网络，以及南非\
  \ Mawana 游戏保护区中 vervet 猴的社会网络。在此之前，我们先去澳大利亚悉尼，了解一个关于硫冠凤头鹦鹉社会网络的公民科学项目。\n\n* * *\n\
  \n“在我年轻的时候，”露西·阿普林回忆道，“在父亲工作的西澳大利亚博物馆的后廊里闲逛基本上就是我的课后托管。我有美好的回忆，就是被允许在展品中自由活动。”二十多年后，阿普林又回到了博物馆，但这次是以一位冉冉升起的动物行为学家的身份执行研究任务。\n\
  \n阿普林年轻时养过一只硫冠凤头鹦鹉（*Cacatua galerita*）作为宠物，她也曾在自己社区看到它们飞来飞去，所以她知道这些鸟有多么驯良。当她在 2015\
  \ 年与哥哥坐在他位于悉尼皇家植物园附近公寓的阳台上时，她再次想起了这一点。那时阿普林正从牛津大学的初级研究员职位休假，她在那里研究社会网络，当时她发现自己正在手喂停在哥哥公寓外的硫冠凤头鹦鹉，因为她了解到它们经常会来。她注意到这些鸟中有些在翅膀上戴着编号的标签，而她的哥哥正用一款名为\
  \ Wingtags 的应用程序报告哪些鸟在那里。“我觉得这太不可思议了，”阿普林说。“你可以用社会网络做这么多事情。”\n\nWingtags 是澳大利亚博物馆\
  \ John Martin 和 Richard Major 的创意，旨在将悉尼居民对凤头鹦鹉的喜爱与收集鸟类行为和生态数据的方式相结合。凤头鹦鹉喜欢在皇家植物园周围徘徊，那里有成千上万种外来和本土植物，包括有洞的本土树木，凤头鹦鹉用它们来筑巢和栖息，因此\
  \ Martin、Major 及其团队在那里捕获了 136 只硫冠凤头鹦鹉，并在每只鸟的翅膀上放置了一个编号标签。绝大多数被标记的鸟仍在花园 10 公里半径范围内活动。\n\
  \nWingtags 应用程序于 2012 年上线，此后它及其分支应用程序 Big City Birds 已从近一千名悉尼居民那里收到超过 27,000 份报告。当发现一只鸟时，公民科学家会拍摄一张包含凤头鹦鹉翅膀标签带的照片并上传图像，应用程序随后会记录鸟的\
  \ GPS 位置。在志愿者检查了超过 8,000 张图像后，很明显大多数鸟在 Wingtag 用户观察到时正在觅食。\n\n阿普林去博物馆与 Major 谈论有一天回来进行为期六个月的访问，使用\
  \ Wingtags 数据构建和分析凤头鹦鹉觅食网络。她于 2016 年抵达，正好也是皇家植物园成立 200 周年，阿普林将她几乎所有的时间都花在两项任务上。首先，她筛选了\
  \ Wingtags 自启动以来积累的大量数字数据，试图弄清楚如何将这些数据转化为可用于研究鸟类社会网络的形式。从与 Major 等人的讨论以及她自己对凤头鹦鹉行为的了解中，阿普林决定如果\
  \ GPS 坐标显示凤头鹦鹉在三十分钟的时间段内彼此相距 100 米以内，它们将被视为在该时间段内属于同一群体。\n\n第二个任务更棘手。如果她要构建一个社会网络，阿普林希望它基于对被标记凤头鹦鹉的代表性采样。“也许……人们只是在报告他们喜欢的[凤头鹦鹉]，”她想，“而不是其他个体”，这并不像看起来那么牵强，因为阿普林知道人们与这些鸟形成了牢固的纽带。“这完全不像你在欧洲和北美所熟悉的那样，”她说。“人们真的能单独识别这些鸟……而且他们确信……鸟能认出他们。”当然，一位公民科学家和凤头鹦鹉编号\
  \ 125 形成了特殊的友谊，阿普林有一天从这位多年来一直在喂养这只凤头鹦鹉的同伴那里收到一封电子邮件时得知了这一点。“每天准时，它就会出现在我厨房的窗户上，”他写道，“我把窗户打开，它走进来，我们在桌子上一起吃早餐……这只鸟和我关系如此密切，我妻子一直称它为[我的]女朋友。”凤头鹦鹉\
  \ 125 来访的大多数年份都在 Wingtags 小组捕获并标记它之前。“想象一下我的惊讶，”发件人写道，“当今天早上它带着这个大塑料标签[在翅膀上]出现时。”他接下来写的内容让阿普林感到惊讶和好笑：“你有我继续[这项工作]的许可，但我可以给这只鸟命名吗？……你能请叫它‘女朋友’吗？”\n\
  \n为了确保 Wingtags 的数据确实没有偏见，阿普林捕获了九只戴翅膀标签的凤头鹦鹉，并为它们配备了太阳能供电的 10 克 GPS 标签，在理想条件下，这些标签可以每秒收集一次鸟类位置的数据。然后，携带可以从\
  \ GPS 标签下载数据的发射器，她会前往皇家植物园和其他鸟类常去的几个地方。一旦她从那九只鸟的 GPS 标签上下载了数据，阿普林就将其与公民科学家在同一时期为同一只鸟上传照片时收集的\
  \ GPS 数据进行了比较，她发现公民科学数据确实与她自己的数据相似，因此可能没有偏见。\n\n\n\n\n\n筛选了几乎所有佩戴翼标的凤头鹦鹉的数据——平均每个个体被观察到\
  \ 147 次——Aplin 及其同事利用群体成员关系为连续六年构建了觅食网络。他们随后分析了众多网络指标，以更好地理解驱动凤头鹦鹉觅食网络结构的原因，包括一只鸟与多少个体关联以及一对凤头鹦鹉互动的频率。\n\
  \nAplin 及其团队发现，平均而言，年轻鸟与更多伙伴形成了更强的联系，而老年鸟则不然。随着个体年龄增长，它们建立的联系强度变得越来越稳定。季节也会影响觅食网络。尽管凤头鹦鹉在冬季（3\
  \ 月至 8 月）食物更难获得时，并没有与网络中更多成员关联，但它们加强了与已有网络伙伴的联系。\n\n![一个社交网络中聚类的示意图。在这个简单、假设的网络中，聚类衡量的是凤头鹦鹉的网络邻居彼此连接的程度。实心黑色圆圈中的鸟聚类值较高，因为它们各自的三个邻居彼此相连。虚线黑色圆圈中的鸟聚类值中等，因为它们的一些邻居彼此相连。中间灰色圆圈中的鸟聚类值为零，因为它的邻居（虚线圆圈中）彼此之间完全没有联系，除了通过它之外。在网络层面，两个派系很明显。技术上，这个聚类度量称为聚类系数。凤头鹦鹉图片经\
  \ istock.com 许可使用。](img/chi-Dugatkin-fig03_REPLACEMENT-5-15-23.jpeg)\n\n一个社交网络中聚类的示意图。在这个简单、假设的网络中，聚类衡量的是凤头鹦鹉的网络邻居彼此连接的程度。实心黑色圆圈中的鸟聚类值较高，因为它们各自的三个邻居彼此相连。虚线黑色圆圈中的鸟聚类值中等，因为它们的一些邻居彼此相连。中间灰色圆圈中的鸟聚类值为零，因为它的邻居（虚线圆圈中）彼此之间完全没有联系，除了通过它之外。在网络层面，两个派系很明显。技术上，这个聚类度量称为聚类系数。凤头鹦鹉图片经\
  \ [istock.com](http://istock.com) 许可使用。\n\n更寒冷、更严酷的时期也迫使凤头鹦鹉以更戏剧化的方式改变其社交习惯。为了了解其如何改变，我们需要介绍一个名为\
  \ *聚类系数* 的社交网络指标，它衡量凤头鹦鹉的邻居彼此连接的程度。当聚类系数在社交网络中的所有鸟类上取平均值时，它提供了网络有多“小圈子化”的度量。在 Aplin\
  \ 的凤头鹦鹉中，网络层面的聚类系数在冬季增加，表明鸟类通过在紧密的小圈子中移动寻找食物来应对艰难时期。\n\nBig City Birds 在 Wingtags\
  \ 之后，允许用户不仅上传图片，还能提供关于鸟类或鸟群正在做什么的详细报告，超出觅食之外。公民科学家现在可以添加关于攻击行为、求偶和其他行为的注释。随着时间的推移，这将使\
  \ Aplin 及其团队能够利用强度和聚类来比较和对比凤头鹦鹉在广泛社交行为中的网络，从而更细致地理解其网络化社会中复杂的互动网络。\n\n* * *\n\n\
  ## 动物社交网络中的强度与聚类\n\n强度和聚类只是衡量动物社交网络中发生的事情的两种方式。还有其他方法，但在深入探讨之前，先多谈谈强度分数的重要性，因为对于在\
  \ Ein Gedi 自然保护区游荡的岩獭（*Procavia capensis*）而言，重要的与其说是某个个体的强度分数，不如说是獭群网络中强度分数的 *分布*。而这种分布对生死有着影响。\n\
  \nAmiyaal Ilany 及其同事一直在研究岩獭——这种体重约 3 公斤、身高 25 厘米的小型毛茸动物，其最近的现存亲戚是象和儒艮——它们生活在 Ein\
  \ Gedi 自然保护区典型的沙漠绿洲中。Ein Gedi 令人惊叹的瀑布从悬崖边倾泻而下，形成泉水，为岩獭、努比亚野山羊（*Capra nubiana*）、扇尾乌鸦（*Corvus\
  \ rhipidurus*）、沙鹑（*Ammoperdix heyi*）和其他动物提供了在正午气温常超过 35°C 的环境中生存的生命之源。\n\nEin Gedi\
  \ 的岩獭生活在点缀在保护区悬崖上的岩石露头上的群体中。它们是一群吵闹的动物。雄性会发出可持续数分钟的鸣唱，充满哀鸣、咕噜、喷鼻、 squeaks 和啁啾。Ilany\
  \ 对岩獭社交生活的首次深入研究是他博士研究中的那些歌曲。但他在 Ein Gedi 与岩獭相处的时间越长，就越对它们的其他社交行为着迷。对 Ilany 来说，Ein\
  \ Gedi 还有一个更个人化的原因。他的父亲曾是以色列最早的动物学家之一，几十年前曾在 Ein Gedi 周围进行长期的豹（*Panthera pardus*）研究，而豹早已消失。\n\
  \nIlany 面临的挑战是如何绘制出他观察到的所有岩獭社交互动。有一天他去理论生态学家 Yael Artzy-Randrup 的博士答辩，听她谈论社交网络模型。“我被击中了，”Ilany\
  \ 说，“真正的尤里卡时刻。”他阅读了能找到的所有关于社交网络建模的资料，随着时间的推移，他做了两次博士后研究，在那里他更深入地研究了这一主题。然后他回到野外，将网络理论应用于岩獭的社交性。\n\
  \nIlany 在 Ein Gedi 的野外季节从三月开始，每年持续约五个月。这是一项体力消耗的工作。他在凌晨 3 点起床，攀爬 David 或 Arugot\
  \ 峡谷，以便在岩獭活跃几个小时直到正午阳光将它们带回洞穴之前到达它们，岩獭在洞穴中待到傍晚，然后再次出现几个小时。Ilany 找到距离岩獭不超过 50 米的地方坐下，手持双筒望远镜和望远镜，收集社交互动数据。每只成年岩獭都有一个独特的识别项圈：幼崽不能佩戴项圈，因为它们在生长过程中可能会窒息，因此\
  \ Ilany 为幼年动物使用颜色编码的耳环。\n\n为了研究社交网络，Ilany 利用了他和同事对两个岩獭种群进行的 1,500 小时观察，重点关注哪些岩獭在悬崖周围紧密同步地一起移动，以及岩獭的抱团行为，白天和动物在洞穴中睡觉时都如此。网络很重要。非常重要。事实上，网络动态预测了岩獭的寿命。\n\
  \nIlany 及其同事计算了网络中每只岩獭的强度分数。但当谈到寿命时，重要的并不是个体层面的强度——由岩獭拥有的连接数量及其强度衡量。相反，网络中平均强度分数周围的分布才是关键。在平等的岩獭网络中，个体之间的强度分数相似，寿命长于那些少数中心个体具有特别高强度分数的网络。当谈到抱团、一起在洞穴中睡觉等合作行为时，生活在平等的社会中胜过生活在少数特权者主导的网络中。\n\
  \n* * *\n\n\n\n\n\n在西巴布亚西北端，远离岩松鼠和硫冠凤头鹦鹉，Rob Perryman 使用了一种名为中介中心性 social network\
  \ measure 的社会网络指标，来帮助他理解其博士项目核心的礁区魔鬼鱼（`Mobula alfredi`）的社会行为。\n\nPerryman 于 2020\
  \ 年获得博士学位，但他对礁区魔鬼鱼的着迷始于大约十年前。童年时观看海洋生物纪录片后，他对这些雄伟的动物产生了热情。不久，Perryman 就在莫桑比克参加了潜水课程，因为他知道那里的水域里充满了魔鬼鱼。在那次潜水课程中，他近距离遇到了不少魔鬼鱼，之后他想要了解更多。“当我在水里与[它们]在一起时，最让我震惊的是它们是多么好奇……它们似乎彼此之间也很社会化。”为了更深入地了解它们究竟有多社会化，他报名参加了欧盟的伊拉斯谟计划，该计划允许学生在地球上的任何地方就自己热衷的主题开展硕士学位研究项目。\n\
  \n这次，Perryman 决定不去莫桑比克，而是在西巴布亚 Raja Ampat 地区的 Dampier Strait 研究魔鬼鱼，那里的魔鬼鱼倾向于出现在浅水中，这使得潜水变得更容易也更安全。更重要的是，该地区拥有蓬勃发展的旅游业，人们会来到地球上最美丽的水域之一观看魔鬼鱼。这意味着\
  \ Perryman 可能能够搭乘旅游船的便车，穿上潜水服，手持水下相机或摄像机从甲板上滚入水中，观察他的研究对象。\n\nPerryman 研究的魔鬼鱼经常出没于“清洁站”，通常位于覆盖着珊瑚的岩石上，小型礁鱼如克氏蝴蝶鱼（`Chaetodon\
  \ kleinii`）会在那里啄食魔鬼鱼体上的寄生虫，甚至游进魔鬼鱼的嘴里清除可能卡在那里的浮游生物碎屑。白天，魔鬼鱼还会造访天然的“觅食站”，通常位于礁区的浅水中，享用各种浮游生物、蠕虫、虾类等。\n\
  \nPerryman 在 Dampier Strait 的工作始于 Arborek 这个小岛：游泳在 Arborek 周围水域的魔鬼鱼种群数量远远超过了岛上约\
  \ 130 名居民。没过多久，Perryman 就发现如果他想观察魔鬼鱼群体互动，最好的两个地点是觅食站和清洁站，因此他会一直留在船上，直到当天搭乘的船只接近其中一个地点。\n\
  \nPerryman 每天会进行两次一小时的潜水。他通常只是前往沙底并坐下来，因为魔鬼鱼对人类坐在那里比对人类游来游去的惊扰更小。在那里他会拍摄静物照片或用水下摄像机记录魔鬼鱼，尽可能多地获取它们行为的信息。他可以根据照片和视频识别魔鬼鱼，因为每条魔鬼鱼的上表面都有独特的斑点图案。潜水间隔期间，他利用魔鬼鱼大约有三分之一的时间似乎毫不费力地在水面游泳这一事实，驾驶他带来的无人机从上方获取一些画面。\n\
  \nPerryman 渴望能够检验关于魔鬼鱼社会行为的假设。在接下来的两年里，他多次自费返回 Arborek，以便更好地准备进入博士项目并提出一些完善的假设。在此期间，在伊拉斯谟计划中一位同学的建议下，他还开始了另一种意义上的深入研究，即深入研究非人类社会网络的文献。当他从这次数学式的深潜中浮出水面时，他获得了所需的概念框架。\n\
  \n在博士阶段，Perryman 与 Culum Brown 合作，后者曾研究过鲨鱼和海豚的社会网络，很高兴有新的学生研究另一个令人兴奋系统的社会网络。现在，他不再以\
  \ Arborek 为基地，而是住在附近较大的 Gam 岛上，Gam 岛是世界上顶级的潜水目的地之一，富裕的游客花大价钱前来参观、潜水并入住高端度假村。Perryman\
  \ 和其他人达成了协议，他偶尔就自己的研究和一般海洋生物做讲座，作为回报，他免费获得食宿。\n\n就像在 Arborek 一样，他在 Gam 附近的水域潜水并使用无人机收集数据，但现在\
  \ Perryman 拥有了另一种工具，因为他已在二十九条魔鬼鱼身上放置了声学标签。这些标签会在一年左右后自行脱落，并且不会对魔鬼鱼造成持久伤害。标签就位后，Perryman\
  \ 在觅食站和清洁站等关键区域布设了声学接收器，以便监测被标记魔鬼鱼的长期移动行为。\n\n为了构建魔鬼鱼社会网络，Perryman 使用了在 Dampier\
  \ Strait 三个觅食站和两个清洁站观察到的近 600 条魔鬼鱼的 3,000 多次观察记录。他研究的一个更有趣的社会网络指标是“中介中心性”，它衡量网络中成对魔鬼鱼之间最短路径中有多少条经过某个个体。中介中心性得分高的个体是信息和其他资源在网络中流动的关键枢纽。\n\
  \n![社会网络中的“中介中心性”。中介中心性高的个体将网络中的许多其他个体联系起来，对信息、疾病或资源在种群中的流动具有重要影响。要计算魔鬼鱼的中介中心性，选择一个个体并询问网络中另一对魔鬼鱼之间的最短路径是否经过该个体。如果经过，则计数加一，然后用同一条魔鬼鱼对网络中每另一对魔鬼鱼重复此过程。例如，要计算实心灰色圆圈中魔鬼鱼的中介中心性，首先询问虚线灰色圆圈中两条魔鬼鱼（最左和最右）之间的最短路径是否经过实心灰色圆圈中的魔鬼鱼。确实经过，因此中介中心性计数设为一。然后对网络中每对魔鬼鱼重复此过程，每当实心灰色圆圈中的魔鬼鱼位于一对魔鬼鱼之间的最短路径上时，计数就增加一。实心灰色圆圈中的魔鬼鱼在此网络中具有最高的中介中心性，虚线黑色圆圈中的魔鬼鱼具有略低的中介中心性，而实心黑色圆圈和虚线灰色圆圈中的魔鬼鱼具有最低的中介中心性得分。魔鬼鱼图片经\
  \ istock.com 许可使用。](img/chi-Dugatkin-fig04_REPLACEMENT-5-15-23.jpeg)\n\n\n\n\n\n\
  ## “Betweenness” in social networks\n\n个体在网络中具有高介数时，会连接许多其他个体，并在信息、疾病或资源在人群中流动的过程中产生重要影响。要计算一条蝠鲼的介数，选择一个个体并询问网络中另一对蝠鲼之间的最短路径是否经过该个体。如果经过，则计数加一，然后用同一条蝠鲼对网络中每对其他蝠鲼重复此过程。例如，要计算实心灰色圆圈中蝠鲼的介数，首先询问虚线灰色圆圈中两条蝠鲼（最左和最右）之间的最短路径是否经过实心灰色圆圈中的蝠鲼。确实经过，因此介数计数设为一。然后对网络中每对蝠鲼重复此过程，每当实心灰色圆圈中的蝠鲼位于一对蝠鲼之间的最短路径上时，就在计数上增加一。实心灰色圆圈中的蝠鲼在此网络中具有最高的介数，虚线黑色圆圈中的蝠鲼介数略低，而实心黑色圆圈和虚线灰色圆圈中的蝠鲼介数最低。蝠鲼图片经[istock.com](http://istock.com)许可使用。\n\
  \n在 Dampier Strait 的蝠鲼中，幼体是枢纽，在网络中具有最高的介数分数。Perryman 不确定原因，但他认为这可能与幼体比成体移动性稍差有关，因此一旦到达觅食或清洁站，它们更可能充当枢纽。相反，在研究期间至少怀孕一次的雌性介数分数最低。“我的想法是，当它们怀孕时，它们更喜欢与较少数量的……其他雌性社交，并尽量避免雄性，”Perryman\
  \ 说。“我们知道雄性会严重骚扰怀孕的雌性，跟随它们并等待幼崽出生，以便它们再次变得性活跃。”\n\n对蝠鲼的社会网络分析还发现网络中嵌套着两个社群：其中一个雌性比例很高，另一个性别比例更均衡。为了看看这两个社群之间是否存在社会动态差异，Perryman\
  \ 使用了一个称为社会分化 的指标，该指标衡量成对蝠鲼之间联系强度存在多少差异。当性别比例偏向雌性时，社群成员之间的联系紧密且在所有配对中相似，并且随时间保持稳定：一个紧密、整合良好的社群，成员长期参与其中。但在性别比例接近均衡的社群中，则存在更分化的社会结构。该社群中的雌性倾向于紧密连接，而雄性虽与子网络中的其他个体相连，但联系较弱。无论雌雄、老幼，蝠鲼在\
  \ Dampier Strait 令人惊叹的水下景观中优雅滑行时，都在社会网络中相互联系。\n\n### Vervet monkeys social networks\n\
  \n南非夸祖鲁-纳塔尔的 vervet monkeys (*Chlorocebus pygerythrus*) 在几乎所有活动中都形成社会网络：玩耍、梳理毛发、争夺权力等。动物行为学家\
  \ Charlotte Canteloup 打算利用 vervet 形成网络的倾向，来理解生活在夸祖鲁-纳塔尔 Mawana Game Reserve 10,000\
  \ 公顷土地上的六个群体——Noha、Baie Dankie、Ankhase、Kubu、Lemon Tree 和 Crossing 群体——的猴子社会生活的动态和复杂性。\n\
  \n像加入长期存在的 Inkawu Vervet Project（IVP：*inkawu* 是祖鲁语中猴子的意思）的每位研究人员一样，Canteloup 于 2017\
  \ 年首次抵达 Mawana Game Reserve 时，需要先熟悉猴子和它们的环境，然后才能开始收集社会网络数据。前两个月，她每天独自外出，学习识别个体 vervet\
  \ 并了解其行为模式。Canteloup 有每只 vervet 的照片可供参考，还有疤痕、毛发图案等的描述，但将这些与特定猴子联系起来，以便即时识别，需要练习。每天花八小时、每周六天与动物相处，不仅让\
  \ Canteloup 认识到具体的 vervet，还让她了解其中一些个体的怪癖。“每个群体中的每个个体 [都] 不同，”Canteloup 说。“在某个时候你知道应该注意这个\
  \ [有点吓人或攻击性或狡猾的] 个体，而那个个体你完全可以信任，没问题，因为他超级好。”那两个月也是对地形的学习。毒蛇眼镜蛇和 boomslange 以及偶尔出现的蜜獾潜伏在周围，“你最好知道自己在哪里以及\
  \ [如何] 找到出路，”Canteloup 说，“尤其是在你独自在丛林中时。”\n\nNoha 群体为 Canteloup 提供了研究社会网络的机会，以解决关于群体生活动态的一些重要但研究不足的问题：动物的位置在不同社会网络中是否一致？例如，如果一只\
  \ vervet 在其梳理网络中扮演特别重要的角色，它在玩耍和权力网络中是否也有类似的角色？此外，Canteloup 知道幼体通常在网络分析中被忽略，她认为这是个错误。Noha\
  \ 群体中有十三到十九只幼体，这意味着它非常适合将幼体加入社会网络研究。\n\nNoha 群体的 vervet 很忙，因此 Canteloup 及其团队也很忙，收集了近\
  \ 800 次攻击性互动的数据，如“chase”、“hit”、“bite”、“grab”、“lunge”和“steal food”，以构建权力网络，7,000\
  \ 多次梳理行为以构建梳理网络，以及 864 轮 vervet 之间的玩耍以组装玩耍网络。为了观察网络间的 consistency 以及幼体在这些网络中的作用，Canteloup\
  \ 及其同事使用了称为 *social capital*（也称为 *weighted centrality*）的指标。社会资本不仅纳入网络成员之间的直接联系和间接联系，还考虑这些联系的强度（通过考虑互动频率）。\n\
  \nCanteloup 及其同事使用社会资本来观察研究两年期间以及不同类型社会网络之间的 consistency。对于每个网络——权力、梳理和玩耍——vervet\
  \ 的社会资本分数在各年间相似。这在 Noha 的群体成员在各年间发生变化的情况下仍然成立：尽管互动的成员池略有不同，但连续两年都属于 Noha 群体的 vervet\
  \ 在第一年和第二年的权力、梳理和玩耍网络中的社会资本分数相似。\n\n社会资本在网络 *之间* 的一致性更为复杂。Vervet 在其梳理和权力网络中的社会资本分数倾向于相似：在一个网络中社会资本高的猴子在另一个网络中也社会资本高。但玩耍网络中的社会资本与梳理或权力网络中的社会资本没有显著相关性。而这正是将幼体纳入社会网络变得非常有用的地方。\n\
  \n\n\n\n\n![中心性衡量的是网络中个体连接的程度，既考虑其与网络中其他个体的直接连接，也考虑间接连接，即考虑该个体邻居的连接程度有多好。本质上，它将直接互动添加到我们之前讨论的聚类模型之上。虚线黑色圆圈中的\
  \ vervet 猴在这个网络中具有最高的中心性，因为它们各自有四个邻居，其中三个与另外三个网络成员相连，一个连接较差。实线黑色圆圈中的 vervet 也具有较高的中心性，因为它们各自有三个邻居，所有邻居都与另外三到四个网络成员相连。灰色圆圈中的\
  \ vervet 具有最低的连通性。严格来说，中心性有多种不同的衡量方法：这种方法称为特征向量中心性。Vervet 图片经 istock.com 许可使用。](img/chi-Dugatkin-fig05_REPLACEMENT-5-15-23.jpeg)\n\
  \n中心性衡量的是网络中个体连接的程度，既考虑其与网络中其他个体的直接连接，也考虑间接连接，即考虑该个体邻居的连接程度有多好。本质上，它将直接互动添加到我们之前讨论的聚类模型之上。虚线黑色圆圈中的\
  \ vervet 猴在这个网络中具有最高的中心性，因为它们各自有四个邻居，其中三个与另外三个网络成员相连，一个连接较差。实线黑色圆圈中的 vervet 也具有较高的中心性，因为它们各自有三个邻居，所有邻居都与另外三到四个网络成员相连。灰色圆圈中的\
  \ vervet 具有最低的连通性。严格来说，中心性有多种不同的衡量方法：这种方法称为特征向量中心性。Vervet 图片经 istock.com 许可使用 from\
  \ [istock.com](http://istock.com)。\n\n幼兽在梳理和权力网络中发挥了作用，但作用相对较小，在权力方面它们处于等级的错误一端。玩耍则另当别论：虽然各个年龄的\
  \ vervet 都会玩耍，但幼年雄性是玩耍网络中的核心角色。玩耍网络可能对幼年雄性尤其重要的一个原因是，当雄性达到性成熟时，它们会从自己的群体中分散开来，通常一起分散，以在另一个群体中寻找配偶。Canteloup\
  \ 及其同事假设，在 Noha 群体中投入玩耍网络的社会资本可能会在雄性作为一个整体分散时促进它们之间的联盟。幼年 vervet 的玩耍也包括玩耍打斗，因此幼兽不仅可能在形成萌芽联盟，还在为未来磨练打斗技巧，当它们遇到试图加入的群体中具有攻击性且相当不欢迎的雄性时。\n\
  \n* * *\n\n二十年前，很少有动物行为学家听说过 `degree`、`social capital`、`centrality`、`clustering\
  \ coefficients` 和 `betweenness`。今天，多亏了社会网络分析，他们知道这些指标有助于在全新层面上阐明动物社会的复杂动态、复杂性和奇妙之处。\n\
  \n# 3. The Food Network\n\nTell me what you eat, and I shall tell you who you are.—Jean\
  \ Anthelme Brillat-Savarin, *The Physiology of Taste* (1825)\n\nDavid Lusseau 一直想成为一名生物学家。“嗯，要么是生物学家，要么是小丑，”他补充道，“但我意识到小丑行业没什么钱。”\
  \ 当 Marie 这头海豚进入 Lusseau 的生活时，她为他成为生物学家敲定了决定。Marie 是一头瓶鼻海豚 (*Tursiops truncatus*)，在\
  \ 1980 年代末游弋于法国与西班牙边境 Cerbère 村附近的水域，17 岁的 Lusseau 因她而踏上了一条道路，这条道路最终会让他研究该物种的社会网络。“当你凝视海豚的眼睛时，你会意识到里面有很多东西，”Lusseau\
  \ 回忆起与他的鲸豚类朋友相处的时间时说。“这很难用事实来表达、把握或解释，但与 [Marie] 相处的时间让我对……试图理解海豚是如何运作的感兴趣，[我认为]\
  \ 这是地球上另一种智慧物种。”\n\n作为一名本科生，Lusseau 花时间担任研究助理，与一个在佛罗里达研究瓶鼻海豚的团队合作。在水上时，他遇到独自游泳或成对游泳的海豚。偶尔他会遇到三只，但海豚似乎总是各做各的事，只是与一两个同伴在一起。当\
  \ Lusseau 在 1990 年代末在新西兰奥塔哥大学开始他的博士研究时，对海豚社会性的这种看法，或缺乏这种看法，发生了戏剧性的变化。他的论文重点关注新西兰一个名为\
  \ Doubtful Sound 的峡湾中瓶鼻海豚的保护生物学，但那里海豚的社会行为让他大吃一惊。他一到那里，就遇到的不是单独的海豚、双人或三人，而是三十只或更多海豚成群结队、协调移动。这些动物与他在佛罗里达研究过的孤独海豚和非常小的海豚群体截然不同。\n\
  \nLusseau 每天早上 4 点起床，吃点早餐，驱赶无休止的叮咬的蠓虫，并在太阳升起前到达 Doubtful Sound。他会登上一艘 14 英尺的船，找到一群海豚，并进行焦点动物取样，轮流观察每只海豚，每只海豚都因背鳍上因鲨鱼攻击而产生的自然标记而可识别。Doubtful\
  \ Sound 可以令人惊叹地美丽，但它位于被称为“咆哮西风带”的纬度，因为西风强劲，有时会有六到八英尺高的波浪，这使得从船上观察海豚变得颠簸。\n\n随着他与海豚相处的时间，Lusseau\
  \ 开始思考如何理解它们复杂的社会动态，但他无法完全弄清楚最好的方法。在他回到奥塔哥大学的一次停留期间，Lusseau 回忆起阅读了物理学家 Mark Newman\
  \ 等人撰写的关于社会网络的《美国国家科学院院刊》论文。不久之后，他给 Newman 发了电子邮件，告诉他：“我认为你在做非常酷的事情，而且我能理解，因为你写得很好。你想看看我们在做什么吗？”\
  \ Newman 感兴趣。没过多久，他和 Lusseau 就开始合著关于海豚社会网络的论文。但在他们撰写任何合著论文之前，Lusseau 发表了一篇 2003\
  \ 年发表在《伦敦皇家学会会刊》上的论文，该论文被广泛认为是第一个明确关于非人类社会网络的研究。\n\n与当今期刊中动物社会网络论文不同，读者已经熟悉网络如何运作，为了让\
  \ 2003 年的读者进入正确的思维框架，Lusseau 在他的《皇家学会》论文中采用了达尔文在《物种起源》中使用过的策略。想法是介绍读者已经知道的现象（在达尔文的例子中是人工选择，如不同品种鸽子的选择），然后论证接下来发生的事情（自然选择），虽然看起来很激进，但实际上只是他刚刚讨论过的另一种变体。在\
  \ Lusseau 的论文中，开头句子写道：“包含许多成员的复杂网络，如人类社会……万维网 (WWW)……或电力电网……允许网络中的所有组件（或顶点）通过短链的中间顶点相互连接。”\
  \ 在读者还没意识到之前，他们就开始了解海豚中的此类社会网络。\n\n\n\n\nLusseau 基于数千次观察构建了海豚网络，他研究的一个指标是网络直径，该指标衡量节点之间平均最短路径。为了向读者介绍网络直径，Lusseau\
  \ 首先讨论了心理学家斯坦利·米尔格拉姆在 20 世纪 60 年代末的“小世界”研究。米尔格拉姆写道：“全球人类人口似乎的直径为六”，“意味着任何两个人类都可以通过五个中间熟人联系起来。”\n\
  \nLusseau 想知道如果海豚网络被削减，例如被鲨鱼捕食会发生什么。为此，利用他收集的网络数据，他构建了一个计算机算法来模拟捕食，将网络规模减少 20%，通过随机移除\
  \ 20% 的海豚。结果发现，海豚的小世界不受这种减少的影响。但如果不是随机选择个体从网络中移除，而是模拟移除与他人联系最多的 20% 的海豚，网络直径就会增加，这会减慢网络内信息传递的速度。\n\
  \n随着他对海豚的了解加深，Lusseau 发现 Doubtful Sound 中的一些个体发出信号，影响与寻找新资源相关的群体移动，包括食物。侧翻，即海豚从水中跃出并侧身着水，仅在雄性发起向新地点移动时才会出现。倒立，即个体翻到腹侧并拍打水面以示群体移动结束，则几乎只在雌性身上看到。但只有少数雄性进行所有侧翻，只有少数雌性进行所有倒立。Lusseau\
  \ 想知道网络分析是否能阐明究竟是哪几只雄性和哪几只雌性。事实证明可以。发起移动的雄性和终止旅行的雌性具有更高的中介中心性——它们是这一旅行/觅食网络中的关键枢纽——高于其不发信号的同类。\n\
  \n在地球另一侧巴西的瓶鼻海豚的几个种群中，信号和网络并非*有时*关乎觅食机会——它们*总是*关乎这一点。而且那里的海豚相当惊人地将人类也纳入了它们的觅食网络。\n\
  \n* * *\n\n鉴于觅食在动物日常生活中如此重要，网络化觅食在众多物种中受到自然选择青睐也就不足为奇了。吸血蝙蝠将食物反刍给网络中饥饿的同伴，毁坏农作物的象群在网络中造成农场破坏，而黑冠山雀则嵌入觅食网络，无论是在农村还是城市环境中。因此，在我们更深入地（并与之并行）探索巴西的海豚/人类网络之前，让我们偷偷看看一些腐烂的树木，探索其中的吸血网络。\n\
  \n坏名声很难摆脱，特别是如果你被描绘成邪恶的化身。但这就是布拉姆·斯托克的*德古拉*——罗马尼亚语意为魔鬼——赋予可怜的吸血蝙蝠（*Desmodus rotundus*）的命运。幸运的是，动物行为学家正在利用蝙蝠自身的社会行为来表明流行文化观点是多么误导。这种康复始于\
  \ 20 世纪 80 年代初，当时行为生态学家杰拉尔德·威尔金森发现吸血蝙蝠在可能救命的方式上相互合作。\n\n威尔金森在哥斯达黎加西北部研究的吸血蝙蝠栖息地居住着大约十几只雌蝙蝠及其幼崽。体重在\
  \ 25 至 40 克之间，吸血蝙蝠确实依赖血液餐，主要来自牛和其他家养物种。吸血蝙蝠的问题在于，与在陆地上活动相比，飞行需要大量能量：多到如果蝙蝠每隔两三天得不到一次血液餐，就会饿死。有两种方法可以获得血液餐：要么飞出去钳住一只毫无防备的牛，要么向另一只吸血蝙蝠乞求将胃中的血液餐反刍直接到你的嘴里并希望它们答应，有时它们会答应。乞求获得良好血液餐的途径就是一种合作形式，即*互惠利他主义*发挥作用的地方。\n\
  \n1971 年，进化生物学家罗伯特·特里弗斯假设在某些条件下，自然选择会青睐互惠利他主义的策略，即两个个体交换合作和利他的行为。特里弗斯提出，这种互惠在动物群居并与同一伴侣互动，并且个体能够记住过去帮助过它们的人时尤其有效。吸血蝙蝠完全符合这一条件。当威尔金森查看蝙蝠是否交换食物分享行为时，他发现了一些证据表明它们确实如此：蝙蝠更有可能给予那些过去曾向它们捐赠过血液餐的个体血液。\n\
  \n吸血蝙蝠显然既能合作，也能进行相当复杂的记分。这些技能，及其他技能，是否创造了一个比成对互动更广泛的食物分享网络？柏林自然博物馆的动物行为学家西蒙·里珀格曾有理由怀疑。里珀格是蝙蝠研究团队的一员，该团队获得了资金用于构建研究社会行为的自动化跟踪系统。他们设计出的一套新一代硬件和软件包，其传感器不仅能实时跟踪蝙蝠，还能“相互交谈”。这些近距离传感器重约\
  \ 2 克，每两秒发出一次信号，被封装在 3D 打印外壳中，配有收发器，允许传感器相互通信并与放置在蝙蝠环境中的各个基站通信。近距离传感器的默认设置是低功耗模式，但当另一只佩戴传感器的蝙蝠在\
  \ 5 米左右范围内时，两个个体的传感器都会“唤醒”，一次“会面”就开始了。当十秒内未接收到信号时，会面结束。此时，会面参与者、会面时间及其持续时间，以及信号的最大强度——用作估计蝙蝠彼此距离有多近的指标——的信息会被存储在传感器的内存中，以供稍后下载。\n\
  \n里珀格和他的同事首先在巴拿马运河附近的史密森尼热带研究所（STRI）甘博亚附近的边缘唇蝠（*Trachops cirrhosus*）身上测试了他们的系统。进展不佳。硬件和软件运行正常，但边缘唇蝠没有配合。“蝙蝠只是带着传感器飞走了，”里珀格说，“然后它们再也没有出现。”幸运的是，STRI\
  \ 是蝙蝠生态学家和动物行为学家的中心，在一次访问中，里珀格遇到了杰拉尔德·卡特，威尔金森的前博士生，他正在做关于互惠和食物分享的工作。\n\n卡特有一个长期研究项目，研究吸血蝙蝠的食物分享和梳理行为，但到那时为止，他的这些研究都是在受控的实验室环境中进行的。“\\\
  [卡特\\]一直想知道他在圈养中研究的是否真实。……在自然界中会怎样？”里珀格回忆道。对他们两人来说，很快就变得显而易见，里珀格拥有的技术非常适合在野外研究吸血蝙蝠。会说话的传感器将提供研究栖息地社会动态的精细监测，从而可能阐明血液餐的分享和其他行为。这些传感器还将允许对食物分享和梳理行为进行社会网络分析，而这在其他情况下是不可能的。里珀格曾在康斯坦茨大学修过计算机科学家转行为动物行为学家的达米安·法林开设的社会网络建模课程，而卡特曾是法林的博士后研究员；他们两人都渴望应用所学到的社会网络技能。\n\
  \n\n\n\n\n## 吸血蝙蝠食物分享研究\n\n### STRI 的圈养群体\n\n当 Ripperger 加入吸血蝙蝠项目时，Carter 已经在史密森热带研究所\
  \ STRI 的实验室里饲养着一个他正在研究的蝙蝠群体。一年前，2015 年底，Carter 向东北方向行驶约 700 公里来到 Tolé，那里遍布牛群牧场，为吸血蝙蝠提供了许多进食目标。在那里，他发现了一棵大空心树，栖息着约\
  \ 200 只吸血蝙蝠。Carter 捕获了 41 只蝙蝠，并从中建立了一个实验群体，包含 17 只雌性蝙蝠和 6 只雌性后代，饲养在 STRI 的一个大型户外围栏中，它们被当地屠宰场提供的血液喂养。Carter\
  \ 和 Ripperger 决定将蝙蝠在 STRI 饲养约两年，然后在安装好“会说话的传感器”后，将它们放归到 Tolé 的那棵捕获树中。\n\n考虑到放归后的情况，Ripperger\
  \ 和 Carter 会在 STRI 将一只蝙蝠系统性地单独隔离，饥饿 26 至 28 小时，然后记录是否有其他蝙蝠将血餐反刍给饥饿的同伴。对 STRI 的食物分享社会网络分析发现，与\
  \ Wilkinson 的原始研究一样，饥饿蝙蝠从同伴那里获得的食物量，可由该蝙蝠在饥饿时给予该个体的食物量来预测。此外，当 Ripperger 和 Carter\
  \ 查看蝙蝠之间的梳理网络时，他们发现蝙蝠 1 从蝙蝠 2 那里获得的梳理量，也可预测蝙蝠 1 在蝙蝠 2 饥饿时喂养蝙蝠 2 的可能性。\n\n### 放归与栖息网络\n\
  \n2017 年 9 月，来自 STRI 的 23 只蝙蝠被带回 Tolé 的家树并放归。当天，从同一棵树捕获的另外 23 只蝙蝠作为对照组，被装上“会说话的传感器”。随着数据从栖息地流出，一些模式开始显现。首先，STRI\
  \ 放归的蝙蝠倾向于与对照组蝙蝠分开，而聚在一起栖息。这并不特别令人惊讶，因为这些蝙蝠在 STRI 一起生活了近两年：尽管如此，看到圈养中的情况与野外生活相关令人安心。但这不仅仅是放归蝙蝠与哪些个体栖息在一起的问题。蝙蝠之间的关联模式与在\
  \ STRI 观察到的非常相似：在 Tolé 的树栖息地中，蝙蝠彼此相处的时间长短，可由吸血蝙蝠在 STRI 实验群体中建立的食物分享和梳理网络来预测。\n\n\
  所有这些都表明，吸血蝙蝠在野外栖息地中嵌入了血分享网络中。但它们分享的血液是在远离栖息地的地点舔食的，Ripperger 或 Carter 或任何人都不知道栖息地的网络动态是否会影响蝙蝠在夜间觅食时的情况。“会说话的传感器”至少在理论上使这成为可能。实际上，在这些传感器能够揭示夜间在牧场吸血蝙蝠寻找牛只吸血时发生的事情之前，必须克服两个相关的后勤障碍。Tolé\
  \ 的牛群往往自由漫游牧场，本身成群的情况很少见。但 Ripperger 和 Carter 需要的是大量牛只集中在局部区域，以便他们知道蝙蝠会去哪里觅食。“我的任务之一是在当地人常去的酒吧里闲逛，”Ripperger\
  \ 说，“我只是问人们，‘你有牛吗？’每个人要么有牛，要么有表亲或兄弟有牛。”最终他们找到了一位同意圈养一百头牛的人，以便 Ripperger 和 Carter\
  \ 进行实验。\n\n栖息地的互动是局部的，但要追踪蝙蝠从栖息地到牛群附近的区域，需要布置一系列接收器，所有接收器都由汽车电池供电，这样 Ripperger 和\
  \ Carter 才能知道蝙蝠的位置，万一它们在觅食时相遇。但接收器证明 notoriously 不可靠：“它们总是坏掉，”Ripperger 笑着说，“我每晚都出去，每两小时检查一次这些站点。我感觉我有个[在外面的]婴儿。”即使接收器在工作时，也似乎被诅咒了。有一次\
  \ Ripperger 看到有人用砍刀砍断一个接收器的天线和硬件，因为据他所知，砍刀使用者认为贩毒者建了它。\n\n### 觅食聚会\n\n当所有故障都解决后，对远离栖息地的夜间会面数据进行分析时，Ripperger\
  \ 和 Carter 发现，在栖息地食物分享网络中中心性得分高的蝙蝠，在觅食时与更多蝙蝠互动。而且栖息地外的互动确实是“聚会”，而不仅仅是蝙蝠离开栖息地时保持在一起。吸血蝙蝠单独离开栖息地，而不是成对或成群。它们也单独返回栖息地。但在觅食时，它们会聚会，进行短暂的互动，有些持续几分钟，有些长达三十分钟。\n\
  \n接近传感器只能检测距离，不能检测行为，但有证据表明，聚会与在田野里抓住一头牛，同时最喜欢的觅食伙伴也这样做有关。对一小部分网络成员一起觅食的录音带显示，聚会是由吸血蝙蝠在栖息地试图寻找偏好伙伴时已知的特定鸣叫声发起的。吸血蝙蝠的觅食网络似乎远远延伸到栖息地之外：谁在觅食外出时聚会，部分取决于它们在树上家园中已建立的可能救命的血分享网络。\n\
  \n---\n\n## 大象毁庄网络\n\n吸血蝙蝠虽然从家养牛身上吸食少量血液，但并不威胁牛场主的经济生计。横冲直撞、建立网络的大象则完全不同。\n\n安博塞利国家公园东南几公里处坐落着马赛人称作\
  \ shamba 的农耕社区。那里的农民种植玉米、洋葱、西红柿、豆类等作物。但他们有一个问题，因为公园里的象群（*Loxodonta africana*）与农民对这些作物的口味相同。为了获取这些美味佳肴，其中一些大象会袭击农场，这妨碍了公园与社区的关系，因为大象几小时内就能毁掉一个农民的作物。Patrick\
  \ Chiyo 想要了解袭击是如何运作的，为此他需要了解这些肆虐巨兽的社会网络动态。\n\n作为他在乌干达 Makerere 大学攻读硕士学位的一部分，Chiyo\
  \ 在乌干达的 Kibale 国家公园做了一些关于毁庄大象的工作，但在那里待的时间里他目睹的袭击非常少。对于他的博士研究，他决定从动物行为学角度研究毁庄。他联系了杜克大学的动物行为学家\
  \ Susan Alberts，她曾在肯尼亚裂谷省的安博塞利国家公园进行过象群研究，是安博塞利大象研究项目的一部分。Alberts 很高兴 Chiyo 能加入她指导的博士生团队。\n\
  \n安博塞利大象研究项目始于 1972 年，由动物行为学家和保护主义者 Cynthia Moss 和 Harvey Croze 密切监督。由于研究人员和游客频繁光顾公园，更重要的是由于当地马赛人民的支持，安博塞利的大象很大程度上免受了非法象牙贸易的毁灭性影响，该贸易在某些时期使非洲象的数量减少了一半。如今，安博塞利国家公园是少数几个象群幼崽自由漫步的地方，雌性接近七十岁高龄，雄性则在四十至五十岁。\n\
  \n\n\n\n\n项目中所有大象的照片记录都可供千代使用，而且这些动物可以通过象牙的大小、形状和自然的身体标记来识别。安博塞利大象研究项目的科研人员还收集了大多数动物的粪便并分析了其中所含的\
  \ DNA，因此他们知道特定大象曾在何处活动，包括它们何时进行作物偷袭，只要它们留下一些粪便即可。而它们*总是*会留下——而且数量充足。正是这种系统让千代能够更深入地探究作物偷袭的行为动态。\n\
  \n大象具有母系社会结构，而安博塞利大象研究项目几乎所有的研究都集中在雌性身上。但从他在基巴莱的研究中，千代获得了作物偷袭者更可能是雄性的线索。为了确定无疑，并更好地理解作物偷袭是如何运作的，他招募了当地的马赛村民，为他们提供手机，并让他们走访当地农田收集作物偷袭的信息。偷袭总是发生在夜间，当他的助手得知一次偷袭后，他们会在早上给千代打电话。然后他就会去收集粪便样本。对这些样本的分析显示他的直觉是正确的：作物偷袭者始终是雄性。\n\
  \n在收集完某次偷袭的所有粪便后，千代会沿着偷袭者返回公园的路径追踪，通过大象留下的折断的树枝和大量粪便来追踪。如果运气好，他会在公园里找到它们。不久他开始发现一种模式：如果一群大象偷袭了某处农场，它们经常会回到公园的同一片区域，于是他就会去那里。\n\
  \n偷袭作物的雄性是一群谨慎的家伙。有时千代在公园里会察觉到一群雄性正要去偷袭的迹象。“单向移动，粪便，粪便，粪便”就是他对这种情形的描述。千代会跟随，有时当他们接近一处沙姆巴时，他会追上这些可能的偷袭者，“它们会站着不动，冻结并等待夜幕降临。”这也是有充分理由的。即使偷袭是在夜幕掩护下进行，仍然很危险。马赛农民完全可以理解地害怕他们的主要生活来源可能在一夜之间被毁掉，因此他们会尽力守护自己的农场。千代曾给一只臭名昭著的作物偷袭者取名亚当，亚当比大多数人都更清楚这一点：亚当侧腹上的伤口来自于一位警惕的农民的长矛，那位农民目睹了偷袭的发生。\n\
  \n在 2005 年至 2007 年的 6 月至 12 月期间，千代和他的同事收集了作物偷袭群体组成的数据，既有对偷袭的直接观察，也有基于粪便 DNA 分析对个体的识别。在同一时期，千代经常在杜克大学待上几个月，在那里他学习了有关社会网络的一切知识。为了构建大象的社会网络，他和同事使用了二十一个已知大象强盗和三十七只从未偷袭过的大象在偷袭期外的关联模式。当他们测量社会网络的密度——即观察到的成对关联数除以所有可能的关联数时，千代和他的团队发现全部五十八只雄性的网络联系薄弱，因此连接松散。但在更深入探究后，他们发现在大网络中嵌入了六个派系。而作物偷袭行为，为偷袭者提供了巨大的回报，在很大程度上塑造了这些派系：每个派系至少有一只已知的作物偷袭者，而其中三个派系的作物偷袭者数量与未偷袭者大致相同。\n\
  \n派系中的网络结构在预测谁会成为偷袭者方面尤其有价值。在一个派系中，最喜欢的伴侣是偷袭者的象，其成为偷袭者的概率显著高于伴侣不是偷袭者时，同样，朋友的朋友是偷袭者的雄性也是如此。但事情不止于此。作物偷袭者平均年龄大于非偷袭者，随着年龄增长成为偷袭者的几率增加，尤其是在雄性达到性成熟年龄时，可能因为寻找配偶的额外能量消耗需要补偿。千代和他的同事发现，年轻雄性成为偷袭者的几率在派系中与年长的偷袭者关系密切时增加，这表明正在训练的年轻作物偷袭者最常从年长、更有经验的个体那里学习这一技艺。考虑到亚当侧腹上的矛伤，这似乎是明智的。\n\
  \n* * *\n\n随着人类似乎占据了地球上的每一平方公里，与当地动物的互动日益增加，而不仅仅是沙姆巴上大象与农民之间的互动。这些互动很少对我们殖民前就存在的居民有利。但有时，人类可能会改善动物生活的某一个或多个方面。例如，在郊区和城市环境中的鸟类喂食器，为许多物种的个体提供了比它们在农村环境中能够获取的更多的食物。动物行为学家朱莉·莫兰-费隆在渥太华周边农村和城市地区研究黑冠山雀（*Poecile\
  \ atricapillus*）时就是这种情况，莫兰-费隆在 2022 年年仅四十四岁时过早去世。\n\n黑冠山雀是鸣禽，当莫兰-费隆于 2012 年来到渥太华大学时，她已经精通与这一类群的工作。作为牛津大学的博士后，她曾在大学附近的威瑟姆森林对另一种鸣禽大山雀（*Parus\
  \ major*）进行研究。莫兰-费隆在威瑟姆的主要研究兴趣是山雀的认知能力，但她也与露西·阿普林和本·谢尔登合作研究这些鸟类的社会网络。“天真地”，莫兰-费隆在\
  \ 2021 年告诉我，“我以为我在大山雀身上学到的东西可以转移到黑冠山雀身上。”不能。大山雀移动很多，即使在冬季，也生活在动物学家所说的“裂变-融合”社会中。渥太华冬季的黑冠山雀群则不然，它们在十月第一场寒流来临时就待在封闭的小群体中不动。\n\
  \n在阅读了苏珊·史密斯 1991 年关于黑冠山雀的著作并自己做了一些基础行为研究后，莫兰-费隆意识到在仅几公里的范围内，城市公园里的山雀在觅食方面过着好日子，至少与附近农村地区的鸟类相比是这样。在城市环境中，食物随时都有，而且比农村环境中更多。很快莫兰-费隆开始在渥太华市中心附近的四个公园研究山雀——所有这些公园都毗邻布满鸟类喂食器的住宅区——以及至少距离市中心\
  \ 16 公里外的四个农村林地。每逢秋季她会用雾网捕捉山雀，为每只佩戴被动集成应答器（PIT）标签，该标签在靠近莫兰-费隆放置在喂食器上的任何射频识别（RFID）接收器时会被激活，而这些喂食器尚未被饥饿的松鼠破坏得面目全非。然后，她会定期补充喂食器并下载山雀访问时间的数据。\n\
  \n\n\n\n\n没过多久，莫兰-费隆就注意到让她思考乡村和城市地点的山雀社会行为有所不同的事情。当她和她的团队外出捕捉山雀以植入 PIT 标签时，他们注意到在城市地点的鸟类一直在不断到来，但在乡村地点时，他们常常找不到山雀，然后突然一大群会造访。更重要的是，乡村地点的鸟群似乎比城市环境中的同类更像一个有凝聚力的整体。当莫兰-费隆开着实验室车——总是同一辆车——驶向乡村地点时，山雀会成群围在喂食器周围，“它们简直会\
  \ literally 要求我们给喂食器加料。”在城郊的公园里则不是这样。“我们想，是的，这说得通……如果你住在城镇里，靠近郊区，有很多喂食器。你不需要依赖社会信息……如果你住在树林里，那么关注社会信息对你的生存就更重要。”\n\
  \n所有这些让莫兰-费隆开始思考她在威瑟姆涉猎过的社会网络。她手头的黑冠山雀是稳定的鸟群，对某个大致区域忠诚，处于两种截然不同的环境中，这给了她一个观察环境如何影响鸟类形成的觅食网络动态的机会。而且有一个理论提出了可检验的预测：当食物更不可靠、更稀少时，如在乡村地点，从觅食网络中的他人那里获取信息将变得尤为重要。\n\
  \n莫兰-费隆和她的同事着手检验这一假设。在夜色的掩护下，以免鸟类注意到，他们将放置在某个领地上的喂食器移动到约 100 米外的新的位置。利用七十三只山雀超过\
  \ 80,000 次访问的数据，他们研究了有关食物新位置的信息在网络中传播的速度。两个环境中的鸟类都找到了被移走的喂食器，但有关新位置的信息传递的 `rate`\
  \ 在乡村地点的山雀网络中高于城市网络：正如理论所预测的那样，当食物不多且难以知道在哪里找到时，社会网络尤其重要。\n\n### 海豚-人类合作\n\n对于人类与非人类社会网络互动的一种更不寻常、事实上独一无二的方式，我们回到本章开头提到的瓶鼻海豚，但从新西兰转移到巴西。在那里，三十多年来，动物行为学家保罗·西蒙斯-洛佩斯一直在研究圣保罗以南约\
  \ 800 公里处拉古纳附近海岸线潟湖系统中海豚种群。那里九个种群的海豚做着其他任何海豚——几乎没有其他动物——都不做的事情。它们不仅彼此建立网络，还与人类合作，为自己和它们的灵长类伙伴获取更多食物。\n\
  \n每年秋季，巴西南部会发生一次巨大的鲻鱼洄游。海豚和渔民都把鱼视为珍贵的猎物。最多五十名渔民，腰深地涉在非常寒冷的水中，等待投掷大型圆形尼龙网 tarrafa\
  \ 覆盖鲻鱼群的机会。渔民的问题是水很浑浊，几乎不可能看到鱼。拉古纳约六十只海豚的问题是，与它们的其他猎物相比，鲻鱼体型大、难以捕捉。但海豚对浑浊的水并不特别困扰，因为它们使用回声定位来探测鲻鱼，这是一种内置的声纳系统，会让大多数工程师羡慕不已。\n\
  \n海豚在鼻囊中产生声波，并通过额头上的脂肪组织和液体聚焦这些声波。一旦声波射入水中，它们就会传播，直到撞到物体，之后会反弹回海豚，海豚利用下颌作为接收器。从下颌，波会传到内耳然后传到大脑。不同大小和密度的物体反射回不同频率的声波，海豚利用这些信息“看到”周围水中的情况。当它们的声纳探测到鲻鱼时，海豚通过拱起背部然后用头部或尾巴拍打水面来向渔民发出信号鱼已在场。渔民随后投掷\
  \ tarrafa 并拉回大量鲻鱼。逃脱 tarrafa 的困惑鲻鱼常常直接游进等待的海豚口中。这是一个完美的双赢局面。\n\n19 世纪 90 年代末的拉古纳报纸刊登了关于这种海豚-人类互利共生的文章，因此西蒙斯-洛佩斯知道，至少这种行为已经持续了\
  \ 130 多年。而且尽管许多海豚不向渔民发出信号，每个渔民都知道哪些海豚会发出信号。“这在巴西南部很有名，”西蒙斯-洛佩斯说。“我长大时看着那些海豚……我会坐在运河里的岩石上看上几个小时。我知道这很不寻常……我知道更南边一个大港里有海豚，那里的海豚和渔民不互动。”\n\
  \n今天西蒙斯-洛佩斯有一个十人团队与他一起工作，但他于 1988 年独自开始。不久之后，他进入博士项目，并以对海豚-人类觅食互利共生的研究为博士论文的基础。每天他都会带一把折叠椅，放在岩石上，用双筒望远镜观察海豚，拍照——他编制了一本包含潟湖中所有海豚照片的“通缉簿”——并用笔记本一本又一本地记录海豚向渔民发出信号的数据。\n\
  \n西蒙斯-洛佩斯开始认识渔民，渔民也开始认识他。他也开始对拉古纳哪些海豚向渔民发出信号、哪些不发出信号有了很好的感觉。毫不奇怪，渔民也在跟踪记录，告诉西蒙斯-洛佩斯关于“好海豚”（向渔民发出信号的）和“坏海豚”（不发信号的）。渔民不仅知道哪些海豚发出信号，还知道哪只海豚会发出哪种信号：“每只海豚发出信号的方式都不同，”一位渔民说，“我们需要知道[不同的信号]才能捕到鱼。”另一位渔民更浪漫一些，告诉西蒙斯-洛佩斯和他的同事，“这很美。它并不发生在每个地方。”\n\
  \n西蒙斯-洛佩斯越是思考那些“好”海豚和“坏”海豚，就越想更好地理解它们。多年后，毛里西奥·坎托尔加入了西蒙斯-洛佩斯的团队；坎托尔曾与社会网络分析早期的领军人物哈尔·怀特海德合作。西蒙斯-洛佩斯和坎托尔决定，网络分析可能有助于他们更深入地探究他们每天观察到的跨物种合作。2008\
  \ 年他们联系了曾在新西兰对瓶鼻海豚进行网络研究的戴维·卢索，询问他是否有兴趣担任专门研究社会网络的概念顾问。卢索很乐意加入他们的团队。\n\n西蒙斯-洛佩斯和他的团队假设海豚从它们交往的发信号者那里学会如何向人类发信号，因此对于他们的社会网络分析，他们特别感兴趣的是发信号的海豚是否更喜欢与其它发信号的海豚共度时光，无论是在将鲻鱼赶入网中时，还是同样重要的是在不这样做时。为了检验是否存在发信号者的小团体和不发信号、不与渔民合作的海豚的小团体，西蒙斯-洛佩斯的团队研究了十六只合作者和十九只不发信号也不与渔民合作的海豚的聚类系数。\n\
  \n\n\n\n\n他们发现的，是在三十五只海豚组成的更大网络中存在三个小团体。第一小团体有十五只海豚：其中每一只都与当地渔民合作。该小团体的海豚彼此之间的交往不仅限于秋季鲻鱼捕鱼季节，而且全年都如此。第二小团体有一打海豚，*没有*一只与渔民合作，而且该小团体内的海豚彼此之间的联系不如第一小团体中的个体那样紧密。第三小团体由八只海豚组成：其中七只从未与渔民合作，但有一只——20\
  \ 号海豚——会合作。而在网络中全部三十五只海豚里，正是 20 号海豚花费了最多的时间在各小团体之间互动，充当着 Simões-Lopes 及其同事所称的“社会中介”，在发信号者和非发信号者之间起桥梁作用。\n\
  \n这种行为是如此奇妙而复杂，我们人类——我不仅仅指的是拉古纳的 artisanal 渔民——应该感激能参与理解它。\n\n* * *\n\n社会网络影响着从大象和山雀到吸血蝙蝠和海豚等所有动物的觅食行为。从进化角度来看，自然选择偏爱获取大量食物的策略的一个原因在于，它们为动物提供了寻找配偶、繁殖，以及在具有亲代抚养的物种中抚养后代所需的能量。因此，交配、亲代抚养等也受到动物所嵌入的社会网络结构的影响也就不足为奇了：事实上，动物会主动操纵网络以提高其繁殖成功率。在下一章中，我们将开始通过观察澳大利亚大桑迪国家公园的一些袋鼠来了解它们是如何做到这一点的。\n\
  \n# 4. 繁殖网络\n\n一个社会的真正品格体现在它如何对待自己的孩子。——纳尔逊·曼德拉，1997 年 9 月 27 日在沃切斯特车站的讲话\n\n从密歇根大学安娜堡分校——安妮·戈尔迪森在那里完成博士工作——到澳大利亚昆士兰州的路途很远。但戈尔迪森在博士后研究期间却来到了那里，在那里她研究塔斯马尼亚本地雉鸡（*Gallinula\
  \ mortierii*）的交配系统。鸟类令人着迷，塔斯马尼亚本身也令人惊叹，除了有一件事：几乎没有其他人在塔斯马尼亚研究动物行为，这可不行。\n\n为了缓解这种智力上的孤独，戈尔迪森联系了位于悉尼西北约\
  \ 500 公里处的动物行为学家和保护生物学家彼得·贾尔曼，他很乐意担任朋友和顾问。在戈尔迪森拜访贾尔曼的一次行程中，他安排她可以在新南威尔士州 Wallaby\
  \ Creek 附近的一个研究地点与他的野外助理共度几天，在那里他正在研究东部灰袋鼠（*Macropus giganteus*）的生态和行为。“彼得的野外助理会告诉我们这是谁，谁与谁互动，”她回忆道，“太棒了。”然后她又回到塔斯马尼亚研究本地雉鸡，但袋鼠从未远离戈尔迪森的思绪。\n\
  \n随着时间的推移，戈尔迪森决定她无法忍受离开澳大利亚，于是决定在那里安顿下来，并在昆士兰获得了一个教职。贾尔曼的野外地点距离那里有八小时车程，但距离她的学术家园以北仅\
  \ 160 公里处，在被大桑迪国家公园环绕的昆士兰湖 Cootharaba 附近的 Elanda Point，有一百只东部灰袋鼠等待被研究。戈尔迪森与她的学生\
  \ Alecia Carter 以及其他人一起，开始研究雌性的社会行为，并考虑在 Elanda Point 深入研究社会网络。\n\n雌性东部灰袋鼠会防御领地，但它们也会以小群体的形式觅食，成员流动性很大。戈尔迪森的团队发现雌性有自己喜爱的觅食伙伴，但在她们能够更深入地了解这些关联之前，丁戈来了。它们非常饥饿。在一次特别严重的干旱期间，饥饿的丁戈在附近的大桑迪国家公园加大了捕猎力度，几乎消灭了戈尔迪森研究的袋鼠种群，杀死了大量成年雌性。尽管戈尔迪森从这一不幸的事件中挽救了一些有趣的发现——丁戈肆虐后，雌性在选择觅食伙伴方面变得不那么挑剔——但如果她想继续深入研究东部灰袋鼠及其社会网络，包括这些网络如何影响亲代抚养，她就必须另寻他处。她确实这样做了，将她的研究工作转移到昆士兰/新南威尔士州边界的\
  \ Sundown 国家公园，距离她的大学向西南行驶四小时。但在我们加入戈尔迪森和她的团队前往 Sundown 国家公园之前，让我们先看看其他几个繁殖网络。\n\
  \n* * *\n\n坦桑尼亚的 Katavi 国家公园并不是动物行为学家斋藤美穂第一次遇到长颈鹿的地方。斋藤对长颈鹿的着迷开始得更早。当她三岁时，她父亲的工作让全家搬到了肯尼亚的内罗毕，年幼的斋藤经常去一个小孩子可以亲手喂长颈鹿的地方。当斋藤一家回到日本时，她会看着在内罗毕拍的照片，梦想着有一天能回到肯尼亚去看野生长颈鹿。2010\
  \ 年，她在京都大学攻读硕士学位，成为 Gen’ichi Idani 的学生时，她终于有机会实现梦想。当时 Idani 以其对黑猩猩和倭黑猩猩的研究而闻名，并在坦桑尼亚的\
  \ Ugalla 运营一个基地营。斋藤对黑猩猩和倭黑猩猩同样着迷，但正是长颈鹿召唤她重返非洲，Idani 很高兴让她追随自己的热情。斋藤于 2010 年随 Idani\
  \ 前往坦桑尼亚。在他向她介绍了当地情况后，她在接下来的五个月里独自一人，带着她在距离 Idani 在 Ugalla 的基地营约 300 公里以南的 Katavi\
  \ 国家公园的研究种群长颈鹿。\n\nKatavi 是该国第三大国家公园，位于坦桑尼亚西南部。那里的木林，称为 miombo，林中遍布 *Grewia*、*Markhamia*\
  \ 和 *Combretum* 属的植物。角马、狮子、大象、斑点鬣狗、非洲野犬、豹子、长颈羚、斑马、 Impala、 Reedbuck，当然还有长颈鹿（*Giraffa\
  \ camelopardalis tippelskirchi*）在 Katavi 的 4,500 平方公里范围内漫游，而非洲鱼鹰、紫胸滚鸽、翡翠斑木鸽、黑腹 bustards\
  \ 和大画鹬在上空翱翔。\n\n在 Katavi，斋藤租住在附近 Sitalike 村一户当地家庭的房间里。每天早上她会步行十分钟到公园总办公室，在那里与一名护林员会面。由于狮子、大象和水牛带来的危险，一名持枪护林员会始终陪同她在公园工作，每天七小时，分早晚两班。斋藤的一天意味着大量的步行——15\
  \ 公里或更多——有些护林员更喜欢他们标准的例行公事，即开车巡逻公园。其他护林员则充分利用了这一点。其中一位曾辍学初中，但重新考虑了青春期的错误并正在为高中入学考试而学习，“只是带上了他的教科书和笔记，”斋藤说，“而我在采集长颈鹿数据时，他在学习。”\n\
  \n起初，斋藤只需要认清一只长颈鹿与另一只的区别。成年个体可以通过其独特的毛皮图案来识别，而幼年个体则可以通过其角状突起 ossicones 的大小和形状来估算年龄。很快斋藤收集了约\
  \ 150 只长颈鹿的体型数据并绘制了草图，并对其中 70 只进行了跟踪。\n\n\n\n\n\n成年雄性长颈鹿花很多时间独处，但成年雌性常被发现成约五只的小群。\
  \ 当斋藤发现一群雌性长颈鹿时，她会通过望远镜观察它们。 彼此相距 200 米以内的任何长颈鹿都被视为同一群的一部分，斋藤会用笔和纸记录群成员所做的一切，包括它们表现出的行为。\n\
  \n从她 2010 年在卡塔维的时间，以及 2011 年再次的类似工作，斋藤了解到雌性群体非常流动，个体经常从一个群体移动到另一个群体，而且雌性对地点并不特别忠诚。\
  \ 但这两条规则都有例外。 在被称为育婴群的群体中，一群哺乳期的雌性，每只带一只小牛，会在同一地点停留一天又一天，约三个月。 斋藤发现，育婴群中的生活为小牛提供了超出其母亲提供的额外保护：当小牛的母亲离开一小时去觅食或饮水时，另一只哺乳期的雌性会挺身而出担任小牛的守护者，尤其是在育婴群位于公园与狮子相关区域时保持高度警惕，长颈鹿的主要捕食者。\
  \ 小牛在育婴群中生活的另一个好处是，尽管雌性表现出只允许自己的小牛吸奶的非常强烈的倾向，但有时小牛会从除母亲以外的雌性那里获得奶水。\n\n斋藤可以看到哺乳期雌性和其他雌性的社会行为存在差异，但她不确定如何更深入地探究育婴群对长颈鹿社会动态的长期影响。\
  \ 直到她开始与动物行为学家 Fred Bercovitch 合作攻读博士学位时情况才改变，Bercovitch 是她的导师之一。 Bercovitch 不仅有与长颈鹿合作的经验，而且还熟悉社会网络理论。\
  \ 不久斋藤开始阅读社会网络文献，并开始思考网络分析可能是理解她的长颈鹿的有力工具。 当她于 2016 年、2017 年和 2019 年重返卡塔维进行博士工作时，她带着社会网络思维出发。\n\
  \n斋藤知道，雌性和其后代在育婴群中的大约三个月里，它们经常互动，并在卡塔维的更大种群中形成明确的集群。 但育婴群解散后会怎样？ 幼年长颈鹿要到大约一岁才断奶，它们倾向于与母亲待到约十八个月大，因此后代与母亲之间的纽带至少会持续这么久。\
  \ 但最近曾一起待在育婴群中的成年雌性之间的互动又如何呢？ 她们在育婴期结束后是否倾向于继续结伴？ 育婴网络的影响是否会超出育婴群本身的存续？\n\n斋藤查看了她在卡塔维工作过的每个野外季节每年的一个育婴群的数据，并计算了该育婴群解散后、但幼崽仍几乎完全与母亲待在一起时，来自同一育婴群的雌性之间的联系平均强度。\
  \ 她在*同一*雌性在后代离开并在约十八个月大时加入同龄群体后，查看了相同的网络指标。 与最近未在育婴群中待过的雌性相比，曾在育婴群中共同度过时间的雌性在幼崽仍与她们在一起时，在整体长颈鹿网络中彼此之间具有显著更大的加权联系值，但在幼崽各自离去后则不然：育婴群中的网络对母亲在育婴群解散后产生影响，但仅持续一段时间。\n\
  \n* * *\n\n与繁殖相关的网络不仅仅关乎亲代抚育。 在行为生态学家 Kevin Oh 研究的家雀 *Haemorhous mexicanus* 中，社会网络也关乎选择配偶。\n\
  \n家雀是一群顽强的鸟类。 在 1930 年代末，它们的分布范围扩展到美国东海岸，最初并非鸟类本意，而是加州的一位鸟类经销商非法将一些家雀运往纽约长岛地区。 然后鸟类就占领了。\
  \ 第一只被发现野生的家雀于 1941 年 4 月 11 日在琼斯海滩被发现：一年的时间里，七只家雀在约 25 公里外的巴比伦被看到，很快更远的地方也发现了家雀巢。\
  \ 长岛的鸟类羽毛看起来比加州的更暗、更阴沉，但最终，当有人想起捕捉并清洗它们时，发现这种阴沉的色泽是煤灰：当鸟类被清理干净后，它们与加州的鸟类一模一样。 到\
  \ 1951 年，长岛四个不同的地区几乎有 300 只家雀生活。 今天，康奈尔鸟类学实验室每周在长岛地区列出约 17,000 次家雀目击记录，纽约州每周几乎有\
  \ 400,000 次目击记录，这一切说明这是一种懂得如何充分利用环境的鸟类。\n\nKevin Oh 回忆起小时候某年圣诞节收到一台小型显微镜作为礼物。 这台小装置还有一个附加功能，即一个适配器可将其变成简易投影仪。\
  \ 将水蚤、植物根系、昆虫等模糊图像投射到他卧室墙上，让 Oh 成为一名有志于科学的人。 十年后，他在缅因州的 Bowdoin College 主修预科医学，并寻找一些研究经验。\
  \ 幸运的是，他上了一门由 Nathaniel Thoreau Wheelwright 教授的鸟类学课程，这真正激发了他的兴趣。\n\nWheelwright\
  \ 和其他人运营着位于芬迪湾对岸加拿大边境的 Bowdoin 科学站 Kent Island，距学院约半天的车程。 不久 Oh 和“他描述的同龄本科生的一群人”\
  \ “会在夏天做项目并与来访的科学家和博士后互动。” 他在草原麻雀 *Passerculus sandwichensis* 的领域性方面做了一些工作，很快意识到动物行为的野外工作使他能够将对科学的热爱与对户外活动的热情结合起来。\n\
  \n当 Oh 于 2003 年开始在亚利桑那大学攻读博士学位时，他的导师 Alexander Badyaev 仅在一年前加入了教职。 Badyaev 自己曾以家雀为研究对象攻读博士学位，当他来到图森后，他决定在新学术家园的校园里数千只家雀上开展一项研究。\
  \ 第一步是给所有雀鸟戴环，以便每只鸟都能被识别。 Badyaev 告诉 Oh，如果他能主导这项工作，可能会帮助他为论文发展想法。 起初，Oh 不确定，因为他认识许多同学正前往世界各地进行研究。\
  \ 但很快他就加入了进来，通过在鸟的一条腿上放置一枚铝环和三枚塑料彩环来捕捉和给家雀戴环。 到他六年后完成博士学位时，Oh 和其他人已给超过 10,000 只鸟戴上了环。\n\
  \n开展大规模野外研究需要的不仅仅是给鸟戴环。 在校园周围按网格放置了喂食站。 并且建造了大量巢箱——大量巢箱——并放置在外。 家雀在校园周围的灌木和树木中繁殖，但它们非常喜欢巢箱。\
  \ 一旦足够多的家雀被戴环，并且足够多的喂食器和巢箱就位，Badyaev 的团队由 Oh 领导，对部分鸟类进行了基本的形态测量并采集了血液样本用于 DNA 分析。\n\
  \n\n\n\n\n## 家雀中的社交网络\n\n在熟悉了这些鸟类之后，Oh 的博士论文项目想法开始围绕家雀的社交网络、配偶选择和繁殖而逐渐成形。动物行为学家\
  \ Geoff Hill 此前的研究发现，羽毛色彩鲜艳的雄性家雀比其黯淡的同类更有可能获得配偶，但 Oh 想知道，黯淡、吸引力较弱的雄性是否有什么办法可以利用鸟类的社交网络系统来提高自身的相对吸引力。这是一项艰巨的任务，不仅涉及测量雄性羽毛的色彩，还需要在非繁殖季节跟踪一岁雄性在混合性别群体中集群和栖息的情况，以便获取繁殖季节外的网络数据，然后在繁殖季节于校园内寻找、或尽量寻找每一个巢，以估算雄性的繁殖成功率。\n\
  \n非繁殖季节混合性别群体的网络数据是在喂食站收集的。Oh 和他的同事在喂食站附近放置了约一立方米大小的“步入式陷阱”。家雀会通过隧道进入，然后被困在里面。Oh\
  \ 随后会取出被困的鸟并将其放入纸袋中。接下来，他们会把装满袋子的笼子放在一辆小儿童拖车上，该拖车连接着他们在校园内骑行的自行车，然后把它们带回实验室。“想象一下这个鸡丝网立方体，”Oh\
  \ 说，“里面有二十到三十个小纸袋在底部上下跳动”，他们边骑车边返回实验室称重鸟类、拍照并收集其他数据。完成所有这些工作后，鸟类会被放回袋子并再次放到儿童拖车上，短途返回被捕捉的地点获得自由。\n\
  \nOh 和 Badyaev 了解到，在非繁殖季节，校园内家雀的社交网络由约二十多个群体组成，平均群体规模约为三十只鸟。许多，但并非全部，行为互动发生在同一群体的家雀之间。雌性倾向于不与其它群体的鸟互动，显示出\
  \ Oh 和 Badyaev 所称的低社交易变性。对于雄性而言，社交易变性取决于羽毛颜色：黯淡的雄性比色彩鲜艳的雄性更具社交易变性。但为什么呢？Oh 和 Badyaev\
  \ 思考过，色彩较少的雄性可能被色彩更鲜艳的雄性赶出群体。他们并非如此：色彩较少的雄性在行为上往往占主导地位，比色彩更鲜艳的雄性更具优势，因此不会被欺负并被迫与群体外的个体互动。相反，社交易变性是黯淡雄性主动的选择。在拼凑出这一块拼图后，Oh\
  \ 能够将他对交配和繁殖的兴趣与已知的网络动态联系起来。为此，他和 Badyaev 将重点放在一月和二月的网络上，此时正值配对形成期。\n\n首次繁殖的雌性会与自己群体内的雄性形成配偶关系，也会与在评估潜在配偶时恰好在附近的来自其他群体的社交易变性雄性形成配偶关系。所有条件相同的情况下，雌性更喜欢羽毛更鲜艳的雄性，但并非所有条件都相同，因为黯淡的雄性更具社交易变性。这意味着易变性对色彩鲜艳雄性的繁殖成功没有影响：他们无论是待在原地还是在群体间互动，表现都一样好。但对于黯淡雄性而言，易变性很重要。黯淡雄性越易变，其繁殖成功率越高，很可能是因为色彩较少的雄性在采样群体，以在雌性最积极选择配偶的时期找到一个其相对吸引力最高的群体。\n\
  \nOh 和 Badyaev 在一个三维图表上绘制了雄性的繁殖成功率，该图表看起来像带有经度、纬度和海拔的地形图。当社交易变性绘制在图表的一个轴上，羽毛颜色绘制在另一个轴上，繁殖成功率绘制在第三个轴上时，有两个峰值从地图上跃然而出：其中一个峰值与黯淡、易变的雄性高繁殖成功率相关，另一个峰值与色彩鲜艳、较不易变的雄性高繁殖成功率相关。\n\
  \n色彩鲜艳的雄性待在原地收获繁殖回报，但黯淡的雄性需要更主动，他们通过重新布线网络来实现这一点，利用社交易变性操纵网络结构来构建自己的繁殖高峰。\n\n##\
  \ 澳大利亚日落公园的袋鼠\n\n澳大利亚日落公园的袋鼠并没有操纵系统，但 Anne Goldizen 决心弄清它们的社交网络发生了什么。即使被 kurrajong\
  \ 树和斑点风铃花的自然美景环绕，bowerbirds、条纹吸蜜鸟、红翅鹦鹉和极乐鸟在头顶飞翔，行程也并不轻松，尤其是在夏季，气温经常达到 40°C。情况也没有好转，因为\
  \ Goldizen 的学生 Emily Best 和 Clementine Menz 居住的护林员小屋没有空调，更不用说其他东西了——除了老鼠。孤独也是一个问题。尽管是国家公园，日落公园的游客很少，几乎没有人靠近\
  \ Best，后来是 Menz 工作所在的公园区域。Goldizen 坚持认为，当她的任何一名学生在公园度过时光时，必须有人陪同，既出于安全原因——周围有许多致命的蛇在游动——也为了提供陪伴。\n\
  \n在夏季，袋鼠和 Best 一样都不喜欢酷热的气温，它们每天清晨活跃约两小时，傍晚又活跃约两小时。而对袋鼠来说，活跃意味着觅食。幸运的是，它们大部分时间觅食的地方离护林员小屋只有几步之遥。日复一日，每个月两周，持续两年，Best\
  \ 收集了哪些袋鼠一起觅食的数据。\n\nBest，后来是 Menz，在收集社交结构数据时，Goldizen 在思考如何分析这些数据。她开始探究社交网络文献，很快意识到其中很大一部分集中在灵长类动物、鸟类和鲸类上。但她知道她和她的团队研究的袋鼠生活在一个复杂的社会中，并且很可能网络结构了这个社会。\n\
  \n与 Elanda Point 的袋鼠一样，日落国家公园的雌性袋鼠会捍卫领地并以小群体觅食，群体组成甚至可能在每小时、甚至每分钟内发生变化。同样，像 Elanda\
  \ Point 的雌性袋鼠一样，一些雌性有自己喜欢的觅食伙伴，Goldizen 和她的团队使用一种称为半权重指数的社交网络指标对其进行了量化。但日落公园的觅食网络动态比\
  \ Elanda Point 更复杂。当计算聚类系数以评估较大网络内的可能小团体时，具有强烈伙伴偏好的雌性往往会聚集在一起。显然，一只雌性经常会被发现靠近她最喜欢的伙伴。这不一定意味着她也会与具有更强伙伴偏好的其他雌性交往。但确实如此。具有强烈伙伴偏好的雌性喜欢其他具有同样倾向于建立亲密友谊的雌性。\n\
  \nGoldizen 及其团队对袋鼠觅食网络的了解越多，他们就越想了解网络化觅食的后果。他们发现的结果令人惊讶，部分原因是觅食伙伴的选择决策如何影响亲代抚育和幼袋鼠的存活。与他们预测的相反，雌性拥有的最爱朋友数量与该雌性幼袋鼠存活到成年的概率呈负相关。特别是，对后代存活最强的负面影响发生在幼袋鼠长到无法再待在母亲育儿袋中到完全断奶的这段时间之间。\n\
  \n\n\n\nGoldizen 认为有两件事可以解释觅食网络中表现出的偏好如何影响幼袋鼠的存活。社交性强的雌性，拥有大量偏好的觅食伙伴，可能更有可能产下更具社交性的后代。如果由于它们与他人互动的倾向，那些后代在断奶前花费更多时间远离母亲，这可能导致被捕食者杀死的几率更大。但与喜爱的伙伴建立联系也需要时间和精力，这些时间和精力本可更好地用于育幼。母亲对某些觅食伙伴有强烈偏好，可能更有可能在寻找偏好伙伴时失去对幼袋鼠的跟踪。这不仅减少了幼袋鼠与其母亲共处的时间，意味着幼袋鼠获得的奶水更少，而且几乎肯定会使幼袋鼠更容易成为捕食者的目标。\n\
  \n* * *\n\n从长颈鹿的育幼所到袋鼠的友谊，再到雄性雀鸟操纵竞争以获得更多配偶，社会网络影响着动物社会中许多繁殖方面的特征。与此同时，只要社会中有生命，就存在权力斗争。权力斗争的影响在社会中蔓延，而社会网络分析是检验其如何发生、为何发生以及其意义何在的完美工具。\n\
  \n作为一个例子，我们将从澳大利亚移至新西兰，并偷看一下澳洲秧鸡，也称为 pūkeko 的社会中正在发生什么。\n\n# 5. 权力网络\n\n党寻求权力完全是为了它自身的目的。我们对他人的福祉不感兴趣；我们只对权力、纯粹的权力感兴趣。……我们知道没有人会带着放弃权力的意图去夺取权力。——乔治·奥威尔，《一九八四》（1949）\n\
  \n毛利民间传说对色彩鲜艳的 pūkeko (*Porphyrio melanotus*) 有很多说法，这种鸟是新西兰的特有鸟类。也被称为澳洲秧鸡，据说 pūkeko\
  \ 拥有深红色的喙是因为一位名叫 Tāwhaki 的高酋长临死时，他的血染上了鸟的喙。另一个传说“如何让几维鸟失去翅膀”讲述了 pūkeko 对沼泽栖息地的偏好。森林之神\
  \ Tänemahuta 愤怒于他的孩子们、树木正被虫子啃食。他请许多不同类型的鸟从树上下来，住在地面上以清除森林中的虫子。当 Tänemahuta 接近一只\
  \ pūkeko 时，这只鸟抬头看了看太阳，又低头看了看森林地面，并告诉森林之神：“不，Tänemahuta，太潮湿了，我不想弄湿我的脚。” Tänemahuta\
  \ 继续寻找，直到最后，几维鸟才同意帮助他。当森林之神对那些拒绝他的人进行惩罚时，pūkeko 的判决与罪行相符：“因为你不想弄湿你的脚，你将永远生活在沼泽中。”\n\
  \n对于一个喜欢沼泽的人来说，新西兰北岛的 Tāwharanui 地区公园有很多可说之处。距离奥克兰向北约一小时车程，距离 Kawau 岛仅 3 公里，该公园东临太平洋，西临\
  \ Tāwharanui 半岛。pūkeko 喜欢公园内遍布的湿地，并乐于在那里形成群体领地。动物行为学家 Cody Dey 同样很高兴研究它们在这些领地上形成的复杂社会网络。\n\
  \n在他的博士工作中，Dey 对合作繁殖感兴趣，其中“助手”协助抚养并非自己所生的幼崽，往往因此推迟了自己繁殖的机会。pūkeko 非常适合研究关于合作繁殖的问题，而不仅仅是因为在地球另一边进行野外工作的诱惑。真正吸引人的地方在于\
  \ pūkeko 的行为。pūkeko 不仅是合作繁殖者，为并非自己所生的后代提供照顾，而且它们还是“联合产卵者”，是最罕见类型的合作繁殖者，其中多只雌性在同一个巢中产卵。\n\
  \nDey 在 Tāwharanui 地区公园与 pūkeko 的第一次工作时间为六个月。尽管 Tāwharanui 是公共公园，但 Dey 很少受到路人的打扰，部分原因是大多数人在公园里冲浪，而\
  \ pūkeko 主要在内陆活动，靠近围栏的牧场，那里放牧着牛。对于公园里那些作为观鸟爱好者而来的新西兰人来说，pūkeko 只是次要考虑。“它们有点像新西兰的加拿大雁，”Dey\
  \ 说。“人们只是想绕过它们去看几维鸟。”\n\npūkeko 的群体，包括联合产卵的雌性，保卫着领地，这些领地通常与公园内的牛牧场相邻。它们激烈地保卫这些领地：有时只是\
  \ pūkeko 站在领地边界上对着邻近群体的鸟做出姿态并鸣叫，但有时也会爆发全面冲突。当不同领地的鸟在同一牧场觅食时，pūkeko 会迎来一个更平静的时光，在那里它们表现出的攻击性与保卫家园时完全不同。\n\
  \n每天日出时，Dey 会搭建一个临时的观察掩体，理想情况下是在山顶，可以俯瞰牧场和周围区域。其他日子他会将掩体设在牧场围栏的另一侧。无论他把掩体设在哪里，Dey\
  \ 都会透过望远镜观察并收集有关权力、求偶、筑巢和其他行为的数据，无论鸟类是在其领地内还是在中立的觅食地上。\n\n没过多久，Dey 就意识到自己带着两个关于\
  \ pūkeko 的误解来到新西兰。首先，他曾以为群体规模相对较小，大约四五只个体：有些确实如此，但许多群体更大，有十多只鸟共享一个领地。此外，由于他对联合产卵的兴趣，他预计生活在同一领地的鸟通常会彼此友好，但他很快了解到权力争夺是关键，而且它经常以相当恶劣的行为表现出来。两只\
  \ pūkeko 中占优势的一只会啄、踢和冲撞，而从属个体则表现出顺从行为，包括从优势 pūkeko 身边退缩，并改变其姿势，使其头部和喙向下指向，而不是像优势鸟那样向上。Dey\
  \ 还了解到，对于雄性来说，位于喙上方的红色肉质“额盾”是一种信号，较大的盾牌不仅表示地位（以及较大的睾丸大小），而且在权力结构中占据更高的位置。\n\nDey\
  \ 对联合产卵与攻击性之间的关系产生了兴趣。当他追踪在多只雌性共同贡献卵的巢中孵化的雏鸟时，他发现母亲的权力很重要：优势雌性的雏鸟孵化最早、生长更快、存活率更高，并且比从属雌性的雏鸟更有可能在成年后成为优势个体。孵化顺序及其对后续优势的影响为理解\
  \ pūkeko 的优势提供了一些见解，但对 Dey 来说还不够，因为它没有捕捉到群体层面的权力动态。幸运的是，Dey 的另一个兴趣——社会网络分析——及时提供了帮助。\n\
  \n\n\n\n\n## Pūkeko 权力等级\n\nDey 对一些社交网络软件进行了调整，使其能够更好地分析他 pūkeko 网络中的权力动态。 他不仅仅计算群体中每对个体中谁占主导、谁处于从属地位，而是调整了软件使其每次查看三个\
  \ pūkeko，并测试三人组中的支配互动是否“传递”。 对于三个个体——1、2 和 3——当 1 对 2 占主导，且 2 对 3 占主导时，权力等级是传递的，那么在闭合权力三角后，1\
  \ 对 3 占主导。 这些传递三人组之所以特别有趣，是因为当大群体由传递三人组组成时，整个群体将具有非常线性的权力结构，其中 1 支配 2，2 支配 3，3 支配\
  \ 4，一直到权力等级中排名最低的成员，而他/她，唉，支配不了任何人。\n\nDey 在十一个不同的 pūkeko 群体中收集了攻击性数据，这些群体的规模从四个不等——其中只有四个三元组——到十三个——其中有许多许多不同的三元组。\
  \ 为了促进攻击性互动，在他收集数据之前，Dey 在鸟类的领地上撒了一些玉米，然后开始记录群体成员表现出的攻击性和顺从行为。\n\n在他的社交网络研究的两年中，三人组最常是传递的，导致所有十一个群体中都形成了明确的权力结构——线性等级。\
  \ 虽然动物行为学家之间对这种大型稳定等级是否能足够减少群体的整体攻击性从而使所有群体成员受益存在争议，但有一点是肯定的：对于 pūkeko 来说，权力的动态至少在一定程度上根植于社交网络。\n\
  \n## 定义权力\n\n在我们查看网络在权力动态中重要的其他方式之前，我们应该对权力有一个更明确的定义。 我所说的权力是指指导、控制或影响他人行为的能力和/或控制资源获取的能力。\
  \ 动物获取权力的方式既微妙又不那么微妙，令人惊叹且富有启发性，因为它们提供了一个进化窗口，通过它我们可以更好地理解群居物种的行为动态。 社交网络分析为动物行为学家提供了一种理解权力复杂性的工具：这是一种已被用于研究田野蟋蟀权力斗争时发挥了良好作用的工具。\n\
  \n## 田野蟋蟀社交网络\n\n如果你在西班牙的草甸上闲逛，碰巧绊倒了其中一个——事实上是 120 个低矮的、对准蟋蟀洞穴的闭路电视摄像机，你如果认为有人在拍摄一部关于昆虫社区生活的真人秀节目，那你也只对了一半。\
  \ 真人秀围绕社交网络展开，如果你想研究蟋蟀社交网络，而 David Fisher 及其同事 Rolando Rodríguez-Muñoz 和 Tom Tregenza\
  \ 最确实现在正在这样做，你就戴上导演帽，开始拍摄。\n\n这些摄像机是为了监视西班牙北部阿斯图里亚斯地区山谷西北坡上草甸中几百只田野蟋蟀 *Gryllus campestris*\
  \ 的日常生活琐事。 2005 年，第一批摄像机被放置在草甸中，每个摄像机都对准至少一个洞穴。 每个洞穴旁边都有一个带三位数字的小旗子，因此研究人员知道哪个洞穴是哪个。\
  \ 他们也知道每只蟋蟀的身份，因为每只蟋蟀都被短暂捕获，取样 DNA，并在放回洞穴前在其背上粘上一个独特的非常小的字母数字标签。 摄像机记录洞穴周围约 60 平方厘米区域内的所有互动，然后通过铺设在田间的复杂光纤电缆系统，所有摄像机将视频传输到附近一间小房子里的计算机组。\
  \ 在交配季节，即从四月下旬到七月初，数万小时的洞穴周围互动被记录下来。\n\n田野蟋蟀寿命一年，只产一次卵。 未成熟的若虫在洞穴中度过冬季，春季完成变态。 作为性成熟的成虫，雄性白天离开洞穴鸣叫以吸引配偶。\
  \ 它们也在草甸中四处移动，寻找可能有独居雌性的洞穴以便交配。 雄性也总是在寻找夺取更好洞穴的方法——洞穴更深、更靠近食物来源，最重要的是有雌性居住在里面，即使里面已经有一个雄性与她同在。\
  \ 毫不奇怪，这类洞穴的雄性居民并不热衷于放弃自己的家或配偶，权力斗争——伴随着张开的大颚、冲撞和缠斗的战斗者——很常见。 幸运的是，雄性争斗通常发生在洞穴入口附近的地面上，因此间谍摄像机可以捕捉到所有动作。\n\
  \nDavid Fisher 于 2012 年加入蟋蟀项目。 当他在寻找博士论文工作的起点时，他看到动物行为学家 Tom Tregenza 在埃克塞特大学发布的广告。\
  \ Tregenza 正在寻找一名博士生加入他和 Rolando Rodríguez-Muñoz 的项目，更具体地说，是研究蟋蟀的社交网络。 Fisher 越深入了解蟋蟀系统，就越感到着迷，因为他开始意识到\
  \ Tregenza 和 Rodríguez-Muñoz “基本上把我们通常在实验室里对蟋蟀和类似模型系统所做的一切都搬到了野外。” 不久 Fisher 就前往埃克塞特学习，在那里他阅读了社交网络文献，然后前往西班牙，在那里他给蟋蟀贴标签并观看录像带。\
  \ 很多录像带。 他特别留意打斗和交配，因为不仅由于洞穴空间狭小，权力斗争发生在地面上，而且所有交配也都在洞穴入口附近的地面上发生。\n\n在蟋蟀交配季节之外，Fisher\
  \ 盯着一排屏幕，抄写上一个交配季节拍摄的看似无尽的视频中的事件。 有些日子他偷偷进行另一项爱好，碰巧关注的是另一种蟋蟀：“英格兰在印度打板球，所以我会在凌晨五点左右起床听[比赛]。”\
  \ 做完这些，就该回到显示器前了。 “一只蟋蟀离开它的洞穴，我会记录为‘A1 于 10:05 离开 32 号洞穴’，”Fisher 描述了这个过程，“然后，一个小时后，我会写‘蟋蟀\
  \ A1 于 11:30 到达 58 号洞穴’……因为它们一直在移动，我们就可以建立起这些网络……雄性打斗网络……雄性/雌性交配网络。” 枯燥的时光有时会被蓝鸟或刺猬抢镜\
  \ CCTV 摄像机打断，但就视频内容而言，大多数情况下要么什么都没有——太常见了——要么是蟋蟀打斗或交配。\n\n如果他不在野外或面前有显示器，Fisher\
  \ 会花时间思考到底使用哪些网络指标以及众多可用的网络模型中的哪一个。 为此，他更深入地研究了文献，最终找到了一些可以在社会学中修改并应用于蟋蟀的模型。\n\n\
  \n\n\n\n## 野外蟋蟀社会网络\n\n所有录音带最终转录完成后，Fisher 及其同事构建了战斗网络和交配网络。他们构建的战斗网络显示，体型更大（更重）的雄性会与更多的对手战斗，而且雄性通常更有可能与自己的洞穴靠近的其他雄性战斗。虽然这两种发现相当直观，但还有另一种并非如此：力量网络中在各自洞穴周围拥有共同对手的雄性，比那些没有共同敌人但洞穴同样靠近的雄性更有可能互相战斗；也就是说，本身的物理间距并不能解释正在发生的事情。但情况甚至比这更微妙和复杂。当\
  \ Fisher 及其同事查看蟋蟀交配网络时，他们发现互相战斗过的雄性，也更有可能与同一只雌性交配并成功使其受精，而那些没有战斗过的雄性则不会：本身的物理间距也无法解释这一结果。谁与谁战斗，谁与谁交配，在西班牙那片草甸的田野中上演的野外蟋蟀真人秀里，所有这些都交织在一个复杂而错综的社会网络中。\n\
  \n在野外蟋蟀活跃的季节，这片举办真人秀的草甸气温很少甚至从未降至冰点以下。那里食物也很丰富，虽然捕食者对于任何地方的任何动物种群来说始终是个问题，但这片草甸大部分时间都是相当舒适的栖息地。Rùm\
  \ 岛上的山脉则并非如此，那里生活的野山羊必须应对*那种*现实。\n\n* * *\n\n## Rùm 岛与 Kinloch 城堡\n\nKinloch 城堡建于维多利亚女王统治末期，在苏格兰西海岸的\
  \ Rùm 岛上，如今依然矗立，尽管需要修缮。它由伦敦建筑事务所 Leeming & Leeming 设计，在鼎盛时期是纺织大亨 Sir George Bullough\
  \ 家族及其富有的朋友们精美的狩猎别墅。Bullough 家族拥有整个岛屿，该岛位于格拉斯哥西北 270 公里处，直到 1950 年代国家自然保护区接管并将其改造成野生动物保护区。今天，岛上的红鹿、Rùm\
  \ 马、苏格兰高地牛和马恩夏尔海燕的数量远远超过二十来位永久人类居民。\n\n过去五十年来，动物行为学家 Tim Clutton-Brock 和他在剑桥的同事一直在研究生活在\
  \ Rùm 北端的红鹿。但吸引进化人类学家 Robin Dunbar 到该岛的是岛屿西海岸，那里地形崎岖多山。在那些山脉中，几百只野山羊生活在勉强维持生计的边缘。Dunbar\
  \ 想知道的一件事是，网络化是否帮助它们应对勉强过活，以及如果是，如何应对。\n\n如果你听说过 Robin Dunbar，那很可能不是因为他对野山羊（*Capra\
  \ hircus*）的研究，而是因为他在 1990 年代初提出的一个相当著名的想法。“三十年前，”Dunbar 在 2021 年为 *The Conversation*\
  \ 写的一篇文章中写道，“我在思考灵长类群体大小与大脑大小的图表：大脑越大，群体越大。……于是‘社会大脑假说’诞生了。” Dunbar 对社会大脑假说的研究使他直接进入了社会网络的世界。当他把这些想法整合在一起时，Dunbar\
  \ 当时在剑桥，与 Clutton-Brock 在同一团队，发现为研究遥远地方的灵长类动物获得资金越来越困难。他的解决方案是：“像 Tim \\[Clutton-Brock\\\
  ] 一样，我决定在家里附近工作是更好的策略，我偶然发现了山羊，因为它是 Rùm 上唯一没有人 \\[研究\\] 的物种。” 不久，Dunbar 开始告诉任何愿意倾听的人山羊有多聪明。\n\
  \n## Rùm 西侧的生活\n\nRùm 的西侧对山羊和人类来说都是严酷之地。狂风从大西洋席卷而来，冬季寒冷刺骨时几乎没有树木可以缓冲。夏季，山羊以及 Dunbar\
  \ 及其团队都饱受昆虫，特别是蠓虫的困扰。Dunbar 的团队住在一座简陋的十九世纪狩猎小屋——bothy——里，有三间房和一个厨房。食物每周运送一次到岛上。取食物意味着要翻越一座国家救援队都在那里训练的崎岖山脉，徒步\
  \ 13 公里到岛的东侧，那里坐落着 Rùm 国家自然保护区办公室。\n\n对于山羊来说，它们每天觅食攀爬 1,000 英尺的突出海崖，冬季尤其残酷。并不是寒冷本身，因为它们可以通过下山到海滩睡觉，或如果幸运的话躲进山洞来稍微抵御严寒。但食物是另一个问题。“真是糟糕透了，”Dunbar\
  \ 说。“对山羊来说，真正的问题是时间……因为白天时间太短，这才是真正打击它们的地方。……如果冬天很冷，它们就根本吃不到足够的食物。”\n\nDunbar 对它们如何应对以及是否利用网络化来应对\
  \ Rùm 生活的挑战感兴趣。他通过毛色和自然标记认出了所有山羊，然后就坐在空地上观察，因为山羊似乎完全不在意。他用一架老式海军上将风格的望远镜观察它们，他形容那是“\\\
  [海军上将 Horatio\\] 尼尔森用能看见的那只眼睛使用的那种”。他和他的团队记录了权力动态、山羊吃什么、群体大小、山羊之间的距离等数据。\n\n## 山羊中的攻击性和亲社会网络\n\
  \n在如此恶劣的环境中生活是否会导致和平的群体动态，还是加剧权力争夺，这是一个棘手的问题。一方面，山羊在冬季时间如此紧张，以至于它们可能需要把所有时间——每一分钟白天时间——都花在觅食上，因此攻击可能很少见。另一方面，由于每一块食物都很宝贵，可能就会为那点可怜的资源展开激烈的权力斗争。幸运的是，社会网络分析可以解决这类问题。当\
  \ Dunbar 和他的同事 Christina Stanley 将他们的数据输入网络模型时，他们发现情况远比后来被证明是错误的两难选择更有趣。\n\nDunbar\
  \ 和 Stanley 专注于两组雌性。当这些群体内部发生攻击时，最常见的是相当温和的类型，一只山羊会朝另一只移动，在发生任何危险之前，被接近的山羊就会离开该区域。有时，这种驱离会包括接近个体的一次恶意的头部冲撞。Dunbar\
  \ 和 Stanley 首先基于攻击性互动构建了一个社会网络，然后他们又构建了另外两个网络——一个基于动物在非争斗时彼此的接近程度，另一个基于“接近行为”，即一只山羊接近另一只，但与驱离不同，被接近的个体继续做它当时正在做的事情。这后两个网络捕捉到了山羊的亲社会行为，对每个群体的分析都揭示了一个由\
  \ 12–13 只雌性组成的核心集群，它们构成了所有这些网络的核心，而其他个体则是与彼此以及核心集群互动较少的离群者。\n\n\n\n\n\n在对所有网络进行第一次遍历时，发现了力量网络与接近行为网络以及亲近网络之间的正相关关系，这导致了一个违反直觉的暗示，即山羊对它们选择作为朋友的个体表现出攻击性。事实证明，在对待“亦敌亦友”关系时，山羊做出了微妙但重要的区分。在对网络数据进行第二次遍历时，邓巴和斯坦利发现，当亲近网络中联系的*强度*——也就是说，不仅仅是山羊与谁互动，而是它们与另一只山羊互动的频率——与力量网络中联系的*强度*进行比较时，山羊对它们花费最多时间在一起的个体表现出更少的攻击性。邓巴从一开始就说得对，山羊确实很聪明。在鲁姆山上，它们不仅仅是在建立网络；它们会区分朋友和熟人。\n\
  \n* * *\n\n山羊生活在寒冷、荒凉的山脉边缘，这是一回事，但当我们想到灵长类动物时，这并不是我们通常会联想到的形象。非洲或南美洲的潮湿雨林，是的，但对于灵长类动物来说，崎岖且多雪的景观则完全是另一回事。然而，对于生活在摩洛哥中阿特拉斯山脉的巴巴里猕猴（*Macaca\
  \ sylvanus*）来说，家，尤其是在冬季，更像是鲁姆，而不是简·古道尔的贡贝。没有人比动物行为学家理查德·麦克法兰更清楚这一点：“我出发去摩洛哥是为了研究巴巴里猕猴的一般行为生态学，”他说。“然后\\\
  [一个冬季\\]降雪摧毁了它们的资源。”不久，麦克法兰发现自己正试图弄清楚在那场可怕的冬季里，这些猕猴的力量网络如何影响它们的生存。\n\n四个巴巴里猕猴群体，生活在阿特拉斯山脉的伊夫兰国家公园，海拔\
  \ 1500 多米，规模从两三打猴子不等。巴巴里猕猴在公园内自由漫游，它们的捕食者也在其中，包括野猪、灵猫、狐狸、豺狼、狼和鹰。成年雄性巴巴里猕猴体重约 16\
  \ 公斤，具有明显且延长的犬齿，在攻击中发挥作用，而雌性体重仅约 9 公斤，犬齿要小得多。从五六岁左右开始，雄性和雌性就具有性成熟，每年秋季至初冬季节繁殖，幼崽在春季出生。冬季气温会下降到冰点以下，而且即使在最温和的冬季，积雪也会覆盖地面约七十天。\n\
  \n巴巴里猕猴项目始于 2008 年，是摩洛哥萨莱国家林业工程师学院生态学家穆罕默德·卡罗和林肯大学麦克法兰的博士导师、灵长类动物学家博纳文图拉·马约洛的构想。马约洛和卡罗发现巴巴里猕猴特别有吸引力，部分原因是它们是生活在亚洲以外唯一的猕猴，并且被国际自然保护联盟（IUCN）列为濒危物种。更重要的是，人们对它们的行为或事实上关于它们的一切知之甚少，而且从后勤角度来看，这里有一个种群，欧洲的准灵长类动物学家研究生可以在不需环游世界进行野外工作的情况下进行研究。\n\
  \n麦克法兰于 2008 年 11 月开始他的博士研究，正值项目启动之初，他还没来得及反应，就已经全职住在阿兹鲁，一个约有 8 万人口的城镇，位于菲斯以南约 100\
  \ 公里，距离山区研究地点车程约三十分钟。首要任务是让猴子习惯他的存在。当他开始时，如果麦克法兰靠近猕猴 100 米内，它们就会拔腿就跑。他博士研究的头五个月每天都开车到现场，花十二个小时“一点一点地靠近，直到它们最终接受\\\
  [我\\]. . . . \\[我\\]从未喂养它们，也没有试图抚摸或触摸它们. . . . 我保持静止，绕着走，只是对它们不感兴趣：我只是成了家具的一部分，一棵会走路的树。”在这一过程中，他学会了通过毛色、面部结构、疤痕以及其他任何能区分一只巴巴里猕猴与另一只的特征来识别个体猴子。\n\
  \n五个月后，驯化过程取得了成效，麦克法兰可以靠近到距离猕猴几米远。他会带着望远镜坐着（为了看更远的猕猴），并使用平板电脑记录攻击性互动、群体大小、谁靠近谁、谁梳理谁、它们吃什么、它们在哪里睡觉等数据。这是一项费力的工作，因为一群猕猴每天为了寻找食物可能要行走\
  \ 10 公里。虽然大部分觅食是在地面进行的，但长距离的移动是在树上进行的，那里的猕猴移动速度比麦克法兰在地面上快得多。他尽力跟上，因为他需要跟随猴子直到它们每晚选择一棵树睡觉：如果他没有把一个群体“安顿”睡觉，那么当它们在下一个日出时醒来并开始移动时，他可能整天都找不到它们。\n\
  \n在夏季跟上猕猴已经够难了，但在冬季的雪中则异常艰苦。“有时候我深陷雪中试图跟上这些猴子——你的脚冻僵了，你的指尖也冻僵了，”麦克法兰说。“你晚上回家 . . . 淋浴，吃尽可能多的食物 . . . 并试图把你的徒步靴晾干在小煤气炉旁。”\n\
  \n在野外工作一年，让动物习惯他的存在，学会谁是谁，并制定了一个包含 200 种不同可能猕猴行为的流程图——即行为谱——之后，麦克法兰感觉更踏实了。凭借对研究对象的更深入了解，他认为自己现在可以全力以赴，真正了解巴巴里猕猴典型的日常生活是什么样的。问题是，就在他准备好时，2008/9\
  \ 年冬季，巴巴里猕猴的生活与典型情况截然不同。\n\n那个冬季是有记录以来最寒冷的，地面从十一月一直被积雪覆盖到三月下旬。对于猕猴来说，这意味着它们在冬季赖以生存的种子、地衣、真菌、叶子和根系在五个月里都被埋在雪下。它们正在努力求生。“一月份的时候，每天都有另一只动物失踪，”麦克法兰说，“或者我会看到一只被捕食者啃食\\\
  [清理\\]干净的猴子骨架。”到冬季结束时，麦克法兰和巴巴里猕猴项目团队追踪的 47 只巴巴里猕猴中有 30 只因饥饿而死亡。\n\n麦克法兰想了解，那个残酷冬季中幸存的猕猴是否有什么特别之处。其中一部分绝对是技能——幸存者是更熟练的觅食者——而一部分可能只是运气：有些找到了食物，而其他人没有。麦克法兰想知道群体权力动态是否也影响了生存。作为一名动物行为学家，他发现这很有趣，但不仅仅如此。对于他来说，这是一种“只是让\\\
  [这些\\]动物容忍我的存在是一种特权”的感受，这关乎理解他关心并像家人一样熟悉的动物们的生与死。\n\n\n\n\n\nMcFarland 和他的导师 Majolo\
  \ 知道社会网络分析是探究群体动态问题的有力工具，但他们两人都没有使用网络模型的工作经验。不过他们的同事 Julia Lehmann 有这方面的经验。到 McFarland\
  \ 和 Majolo 招募她协助进行网络建模时，Lehmann 已经在黑猩猩和狒狒的社会网络方面做了大量研究。他们一起基于那场残酷天气来临前六个月的猕猴行为互动，构建了两种不同的社会网络。其中一个是亲社会网络，基于一对狒狒猕猴相互梳理毛发或身体接触的次数，另一个是权力网络，其条目使用咬、拍、猛冲、抓和追逐等行为。\n\
  \n当他们只看*亲社会*网络时，发现个体的联系数与存活率呈正相关，这与后来的一项研究结果相吻合，该研究发现冬季，白天拥有大量社会伙伴的猕猴夜间会与更多的睡眠伙伴抱团取暖。这种社会性体温调节可减少体热流失，并可能提高存活率。\n\
  \n当 McFarland 及其同事只看*权力*网络时，他们也发现联系数与存活率呈正相关。但权力与存活的故事还有一个有趣的转折。权力网络分析还发现，聚类系数较低的猕猴存活概率更高。回想一下，聚类系数衡量的是个体邻居之间相互连接的程度。在猕猴权力网络中，聚类系数低意味着一只猴子更倾向于将攻击性针对那些与其他个体发生较少攻击互动的个体。这很有道理，但如果没有网络分析，McFarland\
  \ 不会注意到这一点。\n\n一旦 McFarland 及其同事了解了每个网络单独对存活率的说明，他们接下来要问的是：权力网络、亲社会网络，还是网络的组合*最*能解释存活率。拟合度最好的模型是权力网络，而且只有权力网络。在狒狒猕猴中，权力胜过亲社会；至少在冰冻、食物被雪覆盖、你竭尽全力只为活到下一天的情况下如此。\n\
  \n* * *\n\n权力网络很重要。它对西班牙的昆虫种群、新西兰的鸟类群体、英国一座小岛上的山羊群、摩洛哥阿特拉斯山脉的猴群以及更多群体都很重要。在猕猴这样的极端情况下，存活本身至少部分由权力网络的动态决定。尽管如此，一百年才出现一次的严寒冬季，嗯，就是一百年才出现一次的情况。但捕食者及其带来的危险是动物每天都要面对的问题：正如我们将在旱獭、老鼠和斑马等动物身上看到的那样，网络结构在应对对生存的无处不在的威胁时发挥着重要作用。\n\
  \n# 6. 安全网络\n\n我愿意用我所有的名声换一壶麦酒和安全。——莎士比亚，《亨利五世》，III.2\n\n在经典论文《自私的羊群的几何学》中，进化生物学家\
  \ William D. Hamilton 建立了一系列数学模型，表明自然选择在捕食压力面前青睐群体生活，并且动物常常争相进入群体的中间，那里最安全。Hamilton\
  \ 并不是第一个提出群体生活提供一定程度保护的人，自他的论文以来，动物行为学家还提出了除争取进入自私羊群中间之外更多的益处。这些益处包括稀释效应，即更大的群体稀释了个体被捕获的概率，以及“众目睽睽”效应，即群体规模越大，某个群体成员在捕食者攻击前探测到捕食者的概率越高。\n\
  \n数百篇论文检验了这些想法，但就应对危险而言，群体生活不仅仅是稀释几率、争夺位置以及有大量眼睛警戒。对于许多物种来说，还有网络。\n\n为了更好地理解网络在网络成员安全中扮演的角色，让我们来看看瑞士一座特殊谷仓里的老鼠。\n\
  \n* * *\n\n在苏黎世西北约二十五公里处，Illnau 市镇附近的一小片树林的山顶上，坐落着一座谷仓。从外面看，它看起来像任何其他谷仓。但走进这栋 800\
  \ 平方英尺的建筑，你会觉得有人让一支老鼠城市规划师团队自由发挥，建造了四座豪华啮齿动物小区。实际上，是由 Barbara König 领导的一支动物行为学家团队负责设计、建造并维护。“我有兴趣与一种其基因组经历过自然选择的野生哺乳动物合作，”König\
  \ 说。“在欧洲，家鼠总是与人类生活在一起。……它们生活在马厩、谷仓里，我们在那里存放食物。”而且这种情况已经持续了很长时间：考古证据表明，家鼠（*Mus musculus*）自公元前\
  \ 8000 年以来就与人类保持着共栖关系。\n\nKönig 谷仓中的每个老鼠小区都有十个舒适的巢箱，供一只或多只雌鼠及其后代居住，三个饮水喷泉解渴，十个老鼠喂食站提供美味的燕麦和商业鼠粮混合物。砖块和木板提供庇护和娱乐。谷仓里的任何老鼠都可以随意在小区之间移动。小区居民也可以通过墙上的洞或屋顶下离开谷仓，但如果他们这样做，就会进入狐狸、猫、獾和各种饥饿鸟类的领地。大多数情况下，它们会留下。但生活很忙碌。老鼠们总是在移动，嗅探他人的尿液标记。“它们，”König\
  \ 说，“没有实验室老鼠那么多的时间。”\n\nKönig 在谷仓的工作始于 2002 年 11 月，她和 Andrea Weidt 用四只雄性和八只雌性老鼠建立了该设施，所有老鼠都在新家\
  \ 5 公里范围内捕获。今天谷仓里大约有 400 只老鼠，还有一名全职研究技术员驻守在那里，确保一切都在控制之下。König 及其团队知道老鼠的数量，因为他们大约每七周对谷仓里的每只老鼠进行一次普查。这项工作很辛苦，毫无光鲜。“普查时人人都要上阵，”研究团队的博士后\
  \ Julian Evans 说：“我们整天跪着把这些巢箱清空，而这是在数百只老鼠生活在谷仓里的所有肮脏环境中进行的。”\n\n为了帮助自动化数据收集过程，在普查期间，所有体重超过\
  \ 18 克的老鼠都会在皮肤下植入一个微小的 PIT 标签，重量仅为一盎司的十分之一。该标签发出独特的信号，König 及其团队可以用多种方式读取。经过几年的调试，一个强大的监测系统就位了。每个巢箱只能通过一个弯曲\
  \ 45 度角的丙烯酸隧道进入，以减缓冲进来的老鼠。在每个隧道的入口处放置了两个天线，它们会接收任何进出巢的老鼠的信号。天线也放置在饮水站。所有这些都提供了关于谁在巢中、他们何时进出以及他们在巢外（在饮水站）与谁互动的源源不断的数据。仿佛这还不够信息量，数字秤配有红外运动探测器，放置在一些饮水站下方，以便定期更新老鼠的体重。\n\
  \n\n\n\n\n这股数据流沿着埋在谷仓锯末地板下的电缆，通向谷仓里桌子上的一台笔记本电脑。每天结束时，这些信息会自动传输到苏黎世大学的一台服务器上，在那里它会经过一个计算机程序，将所有原始数据转化为对家鼠团队可访问的形式（巢箱的进出、停留在箱内的情况等）。利用所有这些数据来构建家鼠网络，这正是\
  \ Evans 进入画面的地方，他加入 König 的团队时已有建模动物社会网络的经验。\n\nEvans 加入项目时，只要老鼠待在谷仓里，不冒险外出到附近环境，啮齿动物能过上的生活就已经好得不能再好了。然后是\
  \ 2019 年 1 月 19 日的那个周末。Evans 回忆道，技术人员周一早上进去，“发现了惨状”。一只猫，也许不止一只， somehow 在周末期间多次进入谷仓，也许多次进入，并肆虐了种群。在上周有\
  \ 478 只带有 `PIT` 标签的老鼠中，85 只死在谷仓里，夹杂着另外 32 只未标记的受害者。还有一百只左右的老鼠失踪，再也没有找到，尽管进行了大规模搜寻。\n\
  \n猫是如何进入谷仓的，或许是多只猫，并不清楚，但有一些线索。谷仓所在的林地斑块被农田包围，附近有很多农场猫。“我们在谷仓后面这个小洼地里看到几只不同的猫在晃悠，”Evans\
  \ 说，“它们显然只是在等老鼠出来。”原则上，谷仓本应是一种不可渗透的老鼠堡垒，但正如任何养猫的人都会告诉你的那样，给猫一个最小的开口，它 somehow 就能挤过去。\n\
  \n老鼠的世代时间很短，种群恢复也用不了太久。但在此期间，König 和 Evans 决定化不利为利，探索这次大规模捕食事件如何影响幸存者的社会网络。初步浏览数据发现，在灾难发生前构成谷仓完整网络的十七个小团体中，有十四個仍然存在。每一个幸存的小团体都损失了成员：死亡率从一个小团体中的\
  \ 12% 到另一个小团体中毁灭性的 88% 不等。\n\nKönig 和 Evans 从其他工作中知道家鼠网络很复杂，但他们即将发现其复杂程度有多高。让我们回想一下圣地亚哥岛上的猕猴以及它们对玛丽亚飓风灾难的反应。那里，猕猴使用一个简单的规则来调整飓风后的网络：建立更多友谊，但不要加强已有的友谊。家鼠在应对灾难的网络规则上增加了复杂性。在猫袭击前与相对较少其他个体有联系的老鼠在事件后形成了许多新的但较弱的纽带，也许是在寻求安全感。袭击前联系较多的老鼠则以完全不同方式应对灾难。它们在袭击后的关联者更少，但形成的纽带比猫到来前更强。Evans\
  \ 及其同事推测，这些老鼠可能变得更“社会性孤立”，但通过与巢箱同伴进行更多亲社会互动来弥补。\n\n家鼠团队还研究了大规模捕食是否影响了小团体之间的互动。他们查看了事件前后的聚类系数，发现小团体变得不那么“小团体化”，大规模捕食事件后老鼠在小团体之间流动更多。小团体变得有点更具渗透性，也许因为在创伤事件后，靠近任何老鼠，即使是正常小团体之外的老鼠，也能提供安全感。无论如何，很明显，一场在种群层面的\
  \ `cat`astrophe 会对网络结构产生深远影响。\n\n最近，König 及其同事对社会网络动态与其老鼠大脑中正在开启和关闭的基因之间的关系产生了兴趣。但在深入探讨之前，让我们先移步科罗拉多州的山区，看看旱獭如何通过网络保持安全，然后我们将前往肯尼亚的马赛马拉国家保护区，在那里瞪羚、蓝角马、斑马、长颈鹿以及另外八个物种通过窃听彼此的警报声来联手抵御危险。\n\
  \n### Rocky Mountain Biological Laboratory\n\n1919 年夏天，科罗拉多西部学院的生物学教授 John Johnson\
  \ 前往科罗拉多州 Gothic 附近的一个地点进行野外工作，Gothic 是一个废弃的银矿小镇，坐落在落基山脉，海拔略高于 2,700 米。Johnson 对多样化的生态系统印象深刻，很快他就带学生到那里进行野外课程。不到十年后，1928\
  \ 年，落基山生物实验室诞生；今天它是一个拥有七十座建筑的综合体，自豪地宣称它举办着“世界上最大的年度野外生物学家迁徙”。直到最近，研究人员和学生会住在旧矿工小屋和其他较旧的住房单元中，但得益于国家科学基金会的支持，现在已有更现代化的住房可用。\n\
  \n除了所有那些人类之外，落基山生物实验室也是许多黄腹旱獭（*Marmota flaviventer*）的栖息地，这是一种猫大小的松鼠科啮齿动物。这些动物对动物行为学家来说简直是梦想成真。旱獭白天活动，它们居住在易于找到的洞穴中，并且有冬季冬眠和清醒的年度周期，与学年安排非常吻合。\n\
  \n在过去二十年里，落基山生物实验室一直是 Dan Blumstein 的第二个家，黄腹旱獭是他的第二个家庭。旱獭生活在规模较小、以母系群体为主的群落中——雌性和其遗传亲属，外加一到两只雄性，Blumstein\
  \ 和一支庞大的合作者队伍一直在探究旱獭的社会系统。视年份而定，Blumstein 的团队收集有关六十到三百多只动物的信息。\n\n为了区分谁是谁，研究种群中的每只旱獭都戴着一个带识别标签的金属耳环，以及涂在毛发上的临时染料标记。当旱獭从冬眠中醒来时，Blumstein\
  \ 及其团队会滑雪前往该区域，寻找从冬季睡眠中苏醒的动物。从四月中旬开始，他们从滑雪转为步行、骑自行车或开车。使用双筒望远镜和望远镜，工作人员在距离旱獭 18\
  \ 至 140 米之间安营扎寨，并用笔和纸记录所见。他们收集跨年的存活率数据，以及梳理、玩耍、问候、一起坐着、社交觅食等友好行为的数据。他们还在定期捕捉期间从粪便、血液和毛发样本中测量激素水平。日子可能很长，但旱獭可以非常可爱，其中一些非常有趣。Blumstein\
  \ 回忆起一只特别的雄性，它活到了十一岁：“有些雄性有点粗鲁，有些雄性是暖男……这个家伙总是上去迎接他的妻子……每当他迎接 1399 [他交配的雌性] 时，她就会拍他的鼻子。”\n\
  \n\n\n\n## 旱獭社会网络\n\n野外工作每周七天进行，直到大约九月的第二周，旱獭们才宣告一年结束并开始进入冬眠。在冬眠期间，布卢姆斯坦及其团队经常使用社会网络模型来理解旱獭社会中的生活。布卢姆斯坦涉足社会网络始于\
  \ 2004 年，当时他参与了在加利福尼亚州圣巴巴拉国家生态分析与综合中心举办的一系列研讨会。这些研讨会都是关于利用进化原理来帮助国家安全事务，布卢姆斯坦和他人称之为“达尔文式国土安全”：“一群生态学家、进化生物学家、心理学家、安全和国防人员、战士以及其他非常有趣的人”——他就是这样描述与会者的。在为研讨会做准备时，布卢姆斯坦发现自己读到的关于恐怖主义和恐怖分子`networks`的文章越来越多。没过多久，他就开始将网络思维应用于他的旱獭身上。\n\
  \n布卢姆斯坦的想法很快转向了旱獭网络动态与其对捕食者安全的关系。像他研究过的其他旱獭一样，一些黄腹旱獭在发现捕食者时会发出警报叫声。当其他旱獭听到这种叫声时，它们会停止正在做的事情并四处寻找危险，有时还会急忙躲进洞穴里。并非所有警报叫声都相同：有些叫声比其他叫声更吵闹，因此可能提醒到更多群体成员。布卢姆斯坦和他的同事霍莉·福雍想知道，社会网络中的位置是否会影响谁发出那种更响亮的警报叫声。\n\
  \n每隔一周，布卢姆斯坦和福雍都会在靠近洞穴的地方设置用马饲料作诱饵的陷阱，这是旱獭的最爱。当他们把被困的旱獭转移到帆布袋中时，他们会把麦克风放在大约一英尺远的地方并记录任何警报叫声。然后他们查看一个个体的位置在包含许多不同友好以及攻击性互动的网络中是否会影响所产生的警报叫声类型。结果确实如此。社会上更孤立的旱獭，它们参与的社会互动相对较少，会发出更吵闹的叫声。布卢姆斯坦和他的同事认为，这可能是因为社会孤立、可以依靠的伙伴很少的旱獭在面对潜在威胁时更容易被危险激起。\n\
  \n网络动态不仅影响警报是如何发出的，也影响听众如何对它们做出反应。虽然结果尚未达到统计学上的显著性，但在另一项研究中，福雍、布卢姆斯坦及其同事伊丽莎白·帕尔默发现了一些迹象，表明拥有许多朋友和朋友的朋友的旱獭在听到陌生个体发出的警报叫声后，比其他旱獭更快地开始进食，也许是因为它们比联系不那么紧密的旱獭感到更安全。在理解了社会网络方法揭示旱獭社会生活的强大作用后，布卢姆斯坦和他的团队，这次由安妮塔·皮拉尔·蒙特罗带队，接下来将目光转向了网络、捕食和死亡率。\n\
  \n旱獭夏季死亡率几乎总是捕食的结果，因此利用 2002 年至 2015 年间收集的数据，布卢姆斯坦的团队将成年旱獭和一岁幼兽（年幼个体）的夏季存活概率映射到使用该网络中所有社会互动构建的网络上。虽然没有任何社会网络指标与成年的夏季存活率相关，但在雄性和雌性年幼个体之间出现了明显的性别差异。对于年幼雄性而言，没有任何网络指标与夏季存活率相关，但网络中心性更高的年幼雌性比联系较少的同伴更有可能在夏季存活下来。布卢姆斯坦想知道为什么。随着时间的推移，他开始认为扩散行为可能就是答案。\n\
  \n离开群体独自生活，至少在找到可以加入的新群体之前，对旱獭来说是危险的事情。尽管如此，到它们年幼的夏季结束时，几乎所有雄性都会从出生所在的群体中扩散开来，这可能解释了为什么它们在离开`before`之前在社会互动上投入较少。但只有大约一半的年幼雌性会扩散。布卢姆斯坦知道，那些在网络中嵌入更深的年轻雌性才是留下来的人。当他拼凑出这个谜题时，他开始认为，联系紧密的年幼留守雌性选择避免与扩散以重新开始生活相关的危险。而这对它们来说是值得的，因为这换来了进化中最重要的货币之一：生存。\n\
  \n## 马赛马拉的多物种网络\n\n大约一万六千公里，上下浮动，隔开了落基山脉中的黄腹旱獭和雅各布·布罗-约根森在肯尼亚马赛马拉国家保护区的野外工作地点。但分隔这些研究的不仅仅是距离，因为布罗-约根森的工作为我们对社会网络的探索增添了一个新维度。迄今为止，社会网络中的节点代表的是个体，但未必如此。在马赛马拉进行的工作中，研究重点得以拓宽，节点变成了群落中的物种。\n\
  \n在单物种网络中，个体做的几乎任何事情——觅食、梳理、选择配偶、打斗等等——都可能影响网络中的其他个体，也受其影响。当物种成为网络中的节点时，情况更为复杂。物种\
  \ 1 中个体的取食可能会或可能不会影响物种 2 的觅食。物种 1 中个体的配偶选择几乎从不影响物种 2 的配偶选择。这意味着多物种网络的结构需要围绕在不同物种中以相同货币被识别和测量的行为展开。因为群落中的物种常常面临来自共同捕食者群体的危险，而一些反捕食行为可以作为共同货币，因此它们可能在构建网络化群落中尤为重要。\n\
  \n布罗-约根森在伦敦大学学院攻读博士学位时研究了马赛马拉的托皮羚羊（`Damaliscus lunatus`）。由伦敦动物学会资助，他从 1998 年 10\
  \ 月生活在该保护区直至 2000 年 6 月。像所有造访马赛马拉的游客一样，布罗-约根森有时也会惊叹不已地凝视，因为各种哺乳动物物种在他眼前巡游。\n\n马赛马拉国家保护区与坦桑尼亚的塞伦盖蒂保护区接壤，面积约为\
  \ 1,500 平方公里，由桑德河、塔莱克河和马拉河的水源滋养。取决于你在保护区的哪个位置，你可能会看到长颈鹿、河马、水羚、疣猪、羚羊、埃兰羚、托皮、斑马、狒狒、黑犀牛等等。在七月至十月期间，一百多万只蓝角马以及大约十万只汤姆森瞪羚会迁徙穿过塞伦盖蒂-马拉系统。布罗-约根森以动物行为学家的眼光看到了这一切多样性。“我总是环顾这些不同星座的混种群体……但物种实在太多，很难理清[所有事情]，”布罗-约根森说。“我认为深入研究一下会非常有趣。”\n\
  \n当他开始更深入地阅读时，布罗-约根森发现，大多数关于多物种互动的研究都是由生态学家进行的，因此它关注的是环境中的资源而不是动物的社会行为。他认为这需要改变，而一个好的开始方式就是研究马赛马拉上各种动物在发现捕食者时发出的警报叫声。但怎么做呢？他了解社会网络文献，而几乎所有文献的节点都是个体，而不是物种。这在一定程度上是因为大多数动物的多物种群落物种数量不足以进行有力的网络分析：但布罗-约根森认为，在马赛马拉这不是问题。2015\
  \ 年 9 月，他和他的同事克里斯汀·迈斯和丹尼尔·弗兰克斯前往该保护区时，他获得了研究这些多物种网络的机会。\n\n\n\n\nBro-Jørgensen 志向远大。基于他在马赛马拉的先前工作，他决定收集在开阔平原上取食的十二种最常见食草动物的反捕食行为：托皮、汤姆森瞪羚、普通长颈羚、格兰特瞪羚、疣猴、疣猪、哈特比斯特、蓝角马、平原斑马、非洲水牛、长颈鹿，甚至还有一种鸟类，鸵鸟。在任何时候，这些物种中的几乎任何组合都可能在混合兽群中一起取食。但这十二个物种中的个体有时也会在不属于混合兽群时单独取食，这对\
  \ Bro-Jørgensen 及其同事来说是幸运的，因为关于反捕食行为的数据，包括单物种群体中的警戒叫声，可以用作基线，以便与物种属于混合物种兽群的情况进行比较。\n\
  \n为了为这十二个物种收集基线数据，Bro-Jørgensen 及其团队首先测量了个体在仅与同种成员一起取食时的警惕程度。他们将陆地巡洋舰开到约 45 米处的一个群体附近坐下观察，将警惕定义为动物寻找捕食者而非觅食所花费的时间。随着时间的推移，他们在十二个物种的\
  \ 109 个群体中收集了 574 个个体的相关数据。\n\nBro-Jørgensen 及其同事接下来想要了解个体在单物种觅食群体中时的警戒叫声信息。但他们没有等待那些罕见的机会，即他们幸运地在单物种群体觅食且捕食者——狮子、豹子、猎豹、斑鬣狗或黑背胡狼——在场时在场，而是自己动手，制作了每种捕食者的等身大小的纸板模型。动物们显然将模型感知为捕食者。它们并不是唯一这样做的。“很有趣，”Bro-Jørgensen\
  \ 说。“有时会有游客走上来[到车边]……他们想看大场面……然后他们会拍狮子的照片……我们最终会说，对不起，但是…… ”\n\n在 Bro-Jørgensen\
  \ 的团队比较每个物种在单物种群体中与在混合物种兽群中时的警惕性和警戒叫声数据之前，他们还想要一个信息：从物种 1 的角度来看，物种 2 的警戒叫声有多显著？为了弄清楚这一点，他们首先录制了十二个物种中个体发出的警戒叫声，并使用他们放置在野外的扬声器播放了数千次。接下来他们观察了物种\
  \ 1 的成员在暴露于物种 2 的警戒叫声时警惕性的变化，并对十二个物种的每一种配对组合都进行了此操作。当他们发现单物种群体中的个体在吃草时，他们便开车上前放置扬声器。根据叫声物种和接收物种的不同，动物会逃跑或抬头张望——表明它们将信号者的警戒叫声处理为真正的危险信号——或根本不作出反应。\n\
  \nBro-Jørgensen 的团队利用来自单物种群体的数据，结合在混合物种中谁与谁群居的信息，构建了多物种警戒叫声网络。他们发现，成员表现出高警惕性评分的物种往往出现在由其他物种成员也相当警惕的物种组成的兽群中。在这些物种中，许多网络化的眼睛在寻找捕食者，许多网络化的耳朵在倾听捕食者，这在社区层面发挥作用。但有一个问题：在个体发出相对较少警戒叫声的物种中，它们尤其可能花费时间作为混合物种兽群的一部分。这让人联想到寄生——让其他物种的成员做危险的工作——尽管\
  \ Bro-Jørgensen 很快指出，数据并非以能够确定地说出这种方式收集的。无论如何，每个人都喜欢成为多物种警戒叫声网络的一部分，当其他人倾向于发出叫声时：窃听网络化社区在各种方面都有回报。\n\
  \n了解多物种网络如何运作表明，影响一个物种就会影响许多物种。这意味着社会网络的动态具有保护意义，特别是与人为因素有关。考虑一下：Bro-Jørgensen 及其同事的其他工作发现，不同物种在马赛马拉食草动物群落中发挥的相对重要性（以中心性衡量）取决于栖息地结构等生态变量。道路和围栏造成的栖息地破碎化正在将马赛马拉分割成碎片，这将影响物种在多物种群落中互动的方式。如果警戒叫声网络中的一个中心物种被排除在外，甚至如果其相对丰度下降，那可能会影响网络中*所有*物种的安全。\n\
  \n* * *\n\n回到本章开头我们在苏黎世外的谷仓里遇到的那些老鼠，那么在它们的小而复杂的脑子里，至少就社会网络和基因表达（即哪些基因正在开启和关闭）而言，发生了什么？巴巴拉·科宁和她的同事帕特里夏·洛佩斯所做的是测量小鼠大脑三个区域中数百个基因的基因表达水平。然后他们寻找比较具有许多网络联系的小鼠与具有较少联系的小鼠的基因表达模式时的差异。他们事先知道这种方法无法弄清网络中社会互动的差异是否导致了基因表达的差异或反之，但这是一个开始。\n\
  \n雄性在这方面显得相当无趣：在所有脑区，只有三个基因的表达水平会随着雄性拥有的网络联系数量而显示不同。在雌性中，情况则截然不同：谷仓中联系紧密的小鼠与其联系较少的同伴之间，大脑各区域的基因表达水平差异相当明显：180\
  \ 个基因在表达水平上显示出差异。\n\n简单地数一数的做法固然好，但科宁和洛佩斯真正想要的是了解那些差异表达的基因的作用。聚焦于他们从海马体获得的数据，他们发现雌性拥有的联系数量会影响与神经元之间化学通讯相关的基因的表达，这些通讯通过一种称为细胞外蛋白基质（ECP）的结构进行。其他研究小组对\
  \ ECP 的实验操作表明它在学习和记忆中发挥作用。我们已经看到学习在社会网络结构中发挥的作用，而且有大量文献表明小鼠会学习几乎所有对小鼠可能重要的事情：很难想象这种学习不会在家鼠网络中发挥作用。基因表达模式可能有助于我们理解这一点。\n\
  \n* * *\n\n无论是成群的食草动物，还是土拨鼠或老鼠种群，动物如何以及与谁建立网络关系，影响了动物如何应对潜在的危险。当潜在的危险变成真正的危险和死亡来临时，它甚至可以重塑幸存者的社会网络。\n\
  \n当谈到反捕食行为时，网络很重要是有道理的，因为动物总是提防捕食者。动物一直在做的另一件事是穿越它们的栖息环境。正如我们即将看到的那样，有些动物比其他动物更常待在原地，有些是领导者，有些是追随者；所有这些对于它们形成的导航网络都很重要。\n\
  \n# 7. 旅行网络\n\n我第一次在这里看到，信鸽把信件带在尾羽上。——*Pero Tafur 的日记*（约 1435–39）\n\n\n\n\n\n##\
  \ 归巢鸽与社交网络\n\n出生于约 1410 年的安达卢西亚，佩罗·塔富尔有着不可遏制的旅行欲望。在 1435 年至 1496 年间，他游历了热那亚、威尼斯、罗马、巴勒斯坦、埃及、罗得岛、希俄斯、君士坦丁堡等地。在旅途中遇到的众多事物中，塔富尔注意到了一种相当特殊的鸟。归巢鸽在他\
  \ 1435 年启航前很久就已存在，但塔富尔从未见过。直到他抵达埃及城市达米埃塔时才改变了这一状况，在那里他看到它们用尾羽携带信件。“它们把信件从孵育地带到其他地方，一旦信件被取下，它们就会被放飞并返回家中。借此，居民们能够迅速得知海上或陆地上来往的所有人的消息，从而避免被突袭，因为他们生活无防备，既无城墙也无要塞。”\n\
  \n动物行为学家长期以来一直在研究鸽子，包括归巢鸽（*Columba livia domestica*，塔富尔所称的信鸽很可能就是这种鸽子），是否通过地球磁场、太阳、关键地形特征、声音或这些因素的某种组合来导航。他们还研究了可能发挥作用的大脑回路和激素。但安德里亚·弗拉克的兴趣不同。归巢鸽与几乎所有鸽种一样，都是群居动物，而且在导航方面相当执着。它们依赖特定的路线，并竭力每次都走同一条路线。归巢鸽也会一起栖息并成群飞行。在存在这种社会性的地方，网络往往也存在。弗拉克感兴趣的是网络是否在归巢鸽成群返回栖息地时的行为中发挥作用。“如果你有一只\\\
  [归巢\\]鸽子并放飞它，如果周围有其他鸽子，它会试图加入它们；它不会单独飞行，”弗拉克说。“当它们对飞行方向意见不一致时，它们如何做决定？它们会妥协吗？是否有一只会成为领导者，如果是，这又基于什么？”\n\
  \n弗拉克在与牛津导航组（OxNav）成员多拉·比罗的博士工作中承担了这些问题。OxNav 组在外面的怀瑟姆森林建造了两个鸽舍，饲养了约 120 只归巢鸽，我们在第三章中首次遇到了它们。除了实验进行的日子外，鸽舍中的鸽子可以随意进出，而且经常如此，它们成小群进出鸽舍。\n\
  \n弗拉克和她的团队从鸽舍中挑选了三十只鸽子，并将其分成三个各十只的群体。他们研究归巢行为和社交网络的方案优雅而简单。首先，除非太阳在照耀，否则什么都不会发生，因为鸟类依靠太阳导航。如果太阳配合，弗拉克就会去鸽舍，抓捕十只她预先挑选的鸽子，把它们装进箱子，然后开车到放飞地点。该地点距离鸽舍恰好\
  \ 15.1 公里，所有鸽子都有从那么远的地方导航回鸽舍的经验，但对该放飞地点本身却没有经验。\n\n一旦弗拉克到达放飞地点，她就会取出随身携带的微型 GPS\
  \ 设备。每个 GPS 发射器重量不到半盎司，上面有一个小块魔术贴。弗拉克随后将设备附着在粘在每只鸟羽毛上的小魔术贴上。十只鸟随后作为一个群体被放飞。该程序在多天内重复进行，直到三个群体中的每一个都从放飞地点被放飞并被允许在八个不同的场合（希望）找到回家的路。在放飞之间，GPS\
  \ 发射器会被取下。“鸽舍里*非常*脏，”弗拉克说。鸟类很可能会啄掉彼此的 GPS 设备，然后“它们就会在上面拉屎。”\n\n### 群体中的领导网络\n\n\
  归巢鸽的表现符合预期。十五公里对它们找到回栖息地的路来说几乎没有挑战。鸟类通常需要大约十分钟才能飞回栖息地，而且它们经常在弗拉克开车返回之前就已到达。有时一只鸽子可能会迷路，但这种情况很少见。而且更少见，但当你只有这么多鸽子可用时，这仍然是个问题，捕食者可能会在它们飞回鸽舍时杀死一只鸟。弗拉克从未亲眼见过这种情况，但\
  \ GPS 数据为她讲述了故事：当它们成群紧密飞行时，突然鸟群开始朝不同方向飞行，她就知道*发生了什么*。如果一两只鸟从未返回鸽舍，她就假设发生了捕食者捕捉鸽子的情况。\n\
  \n为了探究社交网络的作用以及这些网络中可能存在的领导者和追随者的作用，弗拉克获取了鸽群中每对鸽子的 GPS 坐标，她和她的同事观察鸟 A 在飞行回鸽舍时，鸟\
  \ B 通过对方向变化做出反应而跟随 A 的频率有多高。查看整个鸽群的数据时，“网络显示得非常清晰，”弗拉克指出。每个鸽群中都出现了明显的领导层级，层级顶部的鸟——领导者——在引导群体回家飞行时具有不成比例的影响力。\n\
  \n弗拉克对领导网络和旅行的兴趣在她完成论文后只增不减。包括弗拉克在内的动物行为学家都是勇敢的人，总是乐于接受挑战。即便如此，许多人会说，从研究鸽子在 15 公里导航中的领导网络，转向研究欧洲白鹳（*Ciconia\
  \ ciconia*）群体的领导网络，这些鹳以每小时 100 公里的速度飞行，在地面以上 1200 米高空翱翔，并从欧洲各地迁徙数千公里到非洲的各个地点，这是一个巨大的飞跃。幸运的是，弗拉克、马丁·维克尔斯基以及他们在马克斯·普朗克鸟类研究所的同事——弗拉克作为动物行为学家的学术旅程的下一个站点——并不这么认为。他们想知道领导-追随者网络是否在更大规模的移动中发挥作用，而白鹳的迁徙是观察的完美场所。\n\
  \n### 地面上的网络化社会\n\n在我们加入那些鹳类领导者和追随者进行其史诗般的迁徙之前，让我们先回到地面，窥探中国东部黄山生物圈保护区内的藏酋猴，以及巴西网络中费利西亚诺·米格尔·阿布达拉私人自然遗产保护区内的北墨尔基猴，它们在各自的网络化社会中活动。\n\
  \n黄山由唐玄宗于十三世纪前、747 年命名，传说中不朽的仙丹也在同年于其数十座雄伟山峰中的某处被发现。很快，隐士、诗人、艺术家们来到黄山。在元代（1271–1368）期间，山上建起了\
  \ 64 座寺庙，其中许多用于冥想；其中 20 座寺庙至今仍存在。几个世纪后，山水画派诞生于此。今天，黄山生物圈保护区位于北京东南约 600 公里处，是联合国教科文组织世界遗产地，栖息着\
  \ 2000 多种植物和 417 种不同的脊椎动物，包括云豹（*Neofelis nebulosa*）、东方鹳（*Ciconia boyciana*）和藏酋猴（*Macaca\
  \ thibetana*）。\n\n藏酋猴生活在山脉中被称为野猴谷的区域。在那里，它们在落叶林和常绿林中活动，主要以竹子、草、水果和块茎为食，虽然在食物稀缺时，它们也会吃树皮。夏季，它们在树上过夜，那里有毒蛇的危险最小，而冬季它们更喜欢挤在一起栖息在岩石悬崖的岩壁上。\n\
  \n\n\n\n\n## 西藏猕猴社会网络\n\n西藏猕猴可以活到三十岁，它们将大部分时间花在某种社会互动上：在野猴谷的种群中，已记录到三十三种不同的社会行为——包括玩耍、梳理毛发、拥抱和牙齿碰撞。1986\
  \ 年，李金华和王启山开始研究该谷中玉玲坑（YA1）种群的猴子。在随后的数十年里，夏东波、阿曼达·罗、格雷戈里·弗拉特洛内，以及来自中国、日本、美国、澳大利亚、英国和德国的\
  \ 150 多名研究人员和学生，对西藏猕猴的一切进行了研究。\n\n### 谷中的野外工作\n\n当夏东波在 2000 年代初加入猕猴研究小组时，已有一个设有小屋的野外工作站供他居住，而西藏猕猴早已习惯人类在附近徘徊。这部分归因于保护区内的旅游，但更重要的是，猕猴（现在也是）每天由护林员在远离夏东波和其他人工作的地方进行四次投喂。YA\
  \ 群就住在夏东波小屋几分钟的步行路程之外，每早约 6 点，他手持纸笔和数字录音机出发，研究该群中的 24 只猕猴。夏东波可以根据自然特征识别个体，并迅速指出“我们是在森林中获取行为数据，而不是在投喂区”。他收集数据直到约傍晚\
  \ 6 点，然后跟随该群前往当晚的睡觉地点，以便第二天早上知道在哪里找到它们。\n\n### 梳理网络与雌性社会性\n\n夏东波的博士论文工作聚焦于 YA 群的社交梳理网络。他尤其热衷于利用网络分析来研究雌性之间的梳理关系。在西藏猕猴中，当雄性在\
  \ 6 或 7 岁达到性成熟时，它们会从出生群体中分散并加入，或试图加入另一个群体。雌性一生都生活在它们出生的群体中。这在社交梳理网络中可能产生两种影响。一方面，群体中的成年雌性彼此相处的时间比成年雄性更长，另一方面，群体中的成年雌性通常在遗传上相互关联，而成年雄性则很少如此。由于雌性社会性是西藏猕猴群体生活的核心，夏东波及其同事预测，在梳理网络中，成年雌性的中心性得分——更多朋友和朋友的朋友——会高于成年雄性，并且雌性会在梳理网络中形成小团体。\n\
  \n在 2009 年 5 月至 2010 年 8 月之间，夏东波在保护区居住了 13 个月，每天前往森林收集梳理关系的数据。他会选择一只动物，然后在接下来的 20\
  \ 分钟里，站在目标猴约 7 米外，记录它是否梳理其他 YA 群成员，以及是否有其他个体梳理它。当这 760 小时观察的数据被输入社会网络模型时，成年雌性的中心性指标确实大于成年雄性。夏东波的分析还发现了五个小团体，除了其中一个小团体中唯一的成年雄性外，所有小团体成员均为成年雌性。\n\
  \n### 行动网络与领导力\n\n夏东波对西藏猕猴社会网络的兴趣促使他加入了另一个项目，该项目由阿曼达·罗领导，她正在对 YA 群的行动网络进行研究。这项工作聚焦于领导者和追随者，后者罗将其称为“粉丝”。罗、夏东波及其同事登上可俯视群落并追踪移动的平台开始工作。他们将领导行为定义为一只猴子从其原本静止的群体中移动至少\
  \ 10 米，并且在五分钟内有两只或更多其他猕猴（粉丝/追随者）加入它。网络分析发现，优势雌性是领导者，因此拥有比其他猕猴更多的粉丝。令人意外的是，罗和她的团队发现，由于优势雌性通常是其他优势雌性的遗传亲属，除了拥有更多粉丝外，优势雌性本身也是更多网络成员（其优势亲属）的粉丝，比低等级的猕猴更多。\n\
  \n格雷戈里·弗拉特洛内想要更深入地了解猕猴的行动网络以及它们在野猴谷中如何与梳理网络联系起来。作为他硕士论文的一部分，他与同事一起设想将梳理网络中的中心性信息与行动群体为一次探索而凝聚的速度相结合。他们发现，野猴谷中存在四个\
  \ YA 行动小团体。小团体的大小各不相同，性别比例也不相同。毫不奇怪，较小的团体在准备探索时聚集所需的时间比较大的团体少。而且，就西藏猕猴的几乎所有事情一样，雌性社会性占据主导。当弗拉特洛内的团队研究行动小团体凝聚所需时间与小团体中性别比例的关系时，他们发现，雌性比例更高的团体能够更快地就位并准备好探索。\n\
  \n雌性能够迅速凝聚成行动小团体的部分原因是它们通过梳理网络紧密相连，因此彼此熟悉并建立了信任纽带。尽管如此，可能不止于此。YA 群体的其他研究发现，优势雄性有时会将彼此之间的愤怒转移到婴儿身上。母亲需要准备好迅速离开并探索新选择，当这种情况发生时，她们可能会与自己的雌性亲属同行，后者也在其亲属婴儿的福祉上具有遗传利益。\n\
  \n### 种群融合与分裂\n\n对于西藏猕猴而言，行动网络关乎*种群内部*的小团体形成。然而在灵长类动物中，有时种群会融合，有时也会分裂，从而诞生新群体。对于北部的穆里基猴（*Brachyteles\
  \ hypoxanthus*），这种群体的诞生过程与行动网络的结构密切相关。\n\n巴西动物行为学家和保护主义者马科斯·托库达一直想研究野生猴子，就像他能记得的那样。为了实现这一梦想，在\
  \ 2000 年代初完成本科学习后，他联系了威斯康星大学的人类学家卡伦·斯特里尔。斯特里尔自 1982 年起一直在巴西的森林中研究北部的穆里基猴，并最近出版了专著《森林中的面孔：巴西濒危的穆里基猴》。斯特里尔告诉托库达，她实验室的博士后研究员让·菲利普·布布利获得了国家地理学会的资助，正在寻找一名学生来帮助他研究北部的穆里基猴。托库达抓住机会。很快，他将与社会网络理论合作过的灵长类学家帕特里夏·伊扎尔加入了他的导师团队，并进入圣保罗大学的研究生项目，在那里伊扎尔是心理学系的教授。\n\
  \n\n\n\n\n## 北部墨里奇猴的群体分裂\n\n体重约 9 公斤，身高约 60 厘米的北部墨里奇猴拥有长长的抓握尾巴，这对在森林冠层中穿行尤其有用。它们的面部无毛，却呈现出粉色与黑色交相辉映的美丽组合，并且拥有一个原始的拇指，在采摘果实和种子时十分方便。Tokuda\
  \ 为其论文研究的群体漫游于巴西米纳斯吉拉斯州的费利西亚诺·米格尔·阿卜杜拉私人自然遗产保护区森林中，该保护区位于该国东南部，距大西洋约 200 公里向西，距里约热内卢约\
  \ 1,200 公里向东北。IUCN 红色名录将北部墨里奇猴列为“极危”，全球成年个体数量约为一千且在下降。其中约 20%的个体生活在阿卜杜拉保护区。\n\n\
  北部墨里奇猴在阿卜杜拉保护区与之共享森林的动物包括黄头狨猴（*Callithrix flaviceps*）、豹猫（*Leopardus pardalis*）和鲁氏鼠（*Abrawayaomys\
  \ ruschii*），以及紫胸亚马逊鹦鹉（*Amazona vinacea*）。这是一个美丽的工作地点，但并非没有挑战：白天酷热潮湿，到处都是蜱虫。而且地处偏僻。“远离家人和朋友，”Tokuda\
  \ 说，“你需要有坚强的心理素质。”\n\n这种心理韧性意味着在保护区生活了十八个月，每隔几个月才短暂回一次圣保罗老家。每天清晨 Tokuda 4 点起床前往森林，在那里整天追踪北部墨里奇猴的群体。这些猴子没有标记或佩戴标签，因此在野外最初的六周里，Tokuda\
  \ 每天都在绘制并记录个体猴子面部颜色图案的细节，以便能够识别每只动物。\n\nTokuda 加入项目前不久，一次群体分裂开始了，Jaó猴群分裂成两个，形成了一个新的猴群，被命名为\
  \ Nadir 猴群。当 Tokuda 正在学习猴子的个体身份，随后开始收集行为数据时，他不禁对正在进行的分裂的行为动态着迷，他观察到一些个体从 Jaó猴群中迁移出来，在距离\
  \ Jaó领地中心约一公里多一点的南方形成新的 Nadir 猴群。\n\n每天 Tokuda 都会进行“点名”，记录 Jaó和新生的 Nadir 猴群中每只猴子的身份。他还收集了谁与谁一起行动的信息，并使用手持设备获取\
  \ GPS 坐标，记录猴子的活动位置。随着时间的推移，他进行了 820 次点名，收集了 11,300 个 GPS 测量数据，涵盖保护区两个雨季和两个旱季。\n\n\
  分裂过程是渐进的，大约持续了一年，但一旦完成，Jaó猴群约有三十只成年或亚成年个体，而新的 Nadir 猴群规模稳定在约四十只左右。但 Tokuda 及其同事最感兴趣的并非群体的大小，而是分裂过程的动态，而社会网络分析正是探究这些动态的完美工具。在计算网络指标之前，Tokuda\
  \ 的团队就创建了分裂过程中网络的视觉快照，以及网络*s*。这些可视化结果毋庸置疑，他们可以看到最初的、未分裂的 Jaó网络缓慢而坚定地分裂成 Jaó和 Nadir\
  \ 网络。\n\n通过对移动和关联模式的网络分析，发生的事情变得更加清晰。分裂是由雌性发起的，随着时间的推移，雄性也加入其中。但并非随机选择哪只雌性启动了分裂过程。在原始\
  \ Jaó网络中联系较弱的雌性——那些强度和中心性得分较低的个体——是离开建立 Nadir 群体的个体。在野外实时目睹一个新网络的诞生本就罕见，更罕见的是能够拼凑出祖先网络中的动态如何从根本上影响其“后代”网络的形成。但对于北部墨里奇猴来说，多亏了\
  \ Tokuda 及其同事，我们现在至少知道了一种分裂可能的方式：当一组雌性感觉到自己与网络中其他个体的联系已降至某个最低阈值以下时，她们选择离开并建立自己的群体，雄性最终会跟随。\n\
  \n### 白鹳的迁徙网络\n\n当鸽子、西藏猕猴和北部墨里奇猴建立网络以旅行时，它们移动的距离只有几十公里。Andrea Flack 研究的白鹳将旅行网络提升到了另一个层次，我们之前曾提到过她。\n\
  \n在德国塞韦森的马克斯·普朗克鸟类研究所约 10 公里外，坐落着 Flack 所称的“鹳村”，那里约有二十多个巢穴。2014 年夏季，她和她的同事为该村出生的全部六十一只幼年白鹳佩戴了太阳能\
  \ GPS 记录仪，以追踪其向南迁徙的行为，部分目的是为了看看是否存在领导-跟随的社会网络。与 Flack 之前研究的鸽子相比，为鹳佩戴 GPS 设备有点棘手，但一旦设备佩戴好，它们就会传输鹳所在位置、在群体中的相对位置以及鸟类在三个维度上的移动速度（向前、向侧和上下）。Flack\
  \ 及其团队可以在名为 Animal Tracker 的应用程序上跟踪这些数据。\n\nFlack 追踪的一群二十七只幼年鹳于 2014 年秋季一起向南迁徙。其中一些佩戴\
  \ GPS 设备的鹳偏离路线并加入了不同的群体，留下了一个由十七只佩戴 GPS 的鸟组成的群体。即便如此，当她和她的团队追踪这只十六只鸟迁徙的前五天时，该迁徙将鸟带到西班牙南部，GPS\
  \ 设备已传输了惊人的 1,414,226 个位置坐标。\n\n这十七只幼年鹳并非独自迁徙：它们始终是更大群体的一部分（未佩戴 GPS 设备）。更重要的是，Flack\
  \ 也一路同行。白鹳夜间不迁徙，因此每天大约晚上 7 点，它们会下降，通常避开人类活动频繁的区域，并在夜间栖息。“GPS 数据告诉我它们在哪里，而我实际上也跟着它们迁徙，”她说。“通常我会在傍晚获得数据，然后开车\
  \ 300 公里在半夜找到它们，以便在它们再次起飞的早晨观察它们。”Flack 大多数夜晚都在车里睡觉，条件至少对人类来说通常并不理想，包括在西班牙一家养猪场停留。但这很值得，因为清晨的观察给了她对其\
  \ GPS 标记鸟类所飞行的群体总规模的估计。\n\n与许多长距离迁徙者一样，白鹳总是试图找到热上升气流，这使得它们可以低成本滑翔而不是高成本拍打翅膀。这些上升气流由热对流引起，以及所谓的地形抬升，即水平风经过山丘和山脊时被偏转的结果。利用这些上升气流最终成为鹳类中出现的导航领导网络的关键。\n\
  \n\n\n\n\n使用她在牛津研究信鸽时采用的相同衡量标准，Flack 检验了幼年白鹳中是否存在领导者和追随者。在迁徙最初五天的时间里，十七只佩戴 GPS 的鸟类各自在不同时间处于群体的前部、中部或后部，但总体上出现了一个领导网络，其中七只鸟最常位于群体前方，带领其他鸟。领导者花费在滑翔上的时间更多，花在拍翅上的时间更少，因为它们特别擅长找到上升气流。但上升气流非常动态，会随风漂移，而在上升气流中盘旋的最佳位置始终在变化。为了弥补这一点，领导者表现出一种运动模式，表明它们不断重新评估在任何给定时刻那个不断变化的最佳位置在哪里。\n\
  \n迁徙途中出现领导网络固然好。但这些网络重要吗？领导者承担其角色能获得好处吗？Flack 发现确实如此。鸟类迁徙的距离取决于它滑翔与拍翅所花费的时间比例，而由于领导者滑翔更多、拍翅更少，平均而言它们在这段旅程最初五天中向南迁徙得更远。许多追随者在西班牙结束了迁徙，但大多数领导者继续前行，最终到达非洲，并在春季北返迁徙前一直停留在那里。\n\
  \n* * *\n\n旅行网络及其领导者和追随者决定了个体和群体在环境内部和之间如何移动。而当动物移动时，以及当它们停留不动时，它们会就许多事情相互交流。它们交流的信息沿着网络传播。为了了解其运作方式，我们将从黑猩猩开始，花些时间与它们相处，它们对交流颇有心得。\n\
  \n# 8. 交流网络\n\n他学会了与鸟类交流，并发现它们的对话乏味极了。全部都是关于风速、翼展、功率重量比，以及相当多关于浆果的内容。——道格拉斯·亚当斯，《生命、宇宙以及万物》\
  \ (1982)\n\n从乌干达首都坎帕拉向西北驱车约三小时，布东戈森林位于海拔 1,100 米的悬崖上，引导着流经该地并最终注入阿尔伯特湖的瓦伊索克河、松索河、卡米兰布瓦河和西巴河。该森林年平均降雨量约为\
  \ 160 厘米，是 300 多种鸟类、400 多种蝴蝶和蛾类以及 24 种哺乳动物，包括 9 种灵长类动物的家园。其中，在 1962 年，英国生物人类学家弗农·雷诺兹开始了布东戈森林项目，对生活在该森林中的约\
  \ 800 只黑猩猩 (*Pan troglodytes schweinfurthii*) 进行了长期研究。\n\n在过去二十年里，灵长类学家安娜·罗伯茨和萨姆·罗伯茨一直在布东戈的一群黑猩猩社区中研究交流网络。在她的博士论文工作中，安娜·罗伯茨与构成松索社区的六十多只黑猩猩合作，松索社区是森林中六个黑猩猩社区之一。罗伯茨对非人类的认知和交流感兴趣，认为最好与我们最近的进化亲缘物种合作。而且由于已知非声学手势在黑猩猩交流中发挥重要作用，她将重点放在了这些手势上。萨姆·罗伯茨同样非常认同非声学手势在黑猩猩中的重要性。“群居有好处……但也伴随着许多挑战，”他说。“手势交流是一种可以在非常精细的层面上管理关系的交流方式。”\n\
  \n在她大部分前往森林的访问中，安娜·罗伯茨都住在布东戈保护区野外工作站，那里为访问研究人员提供住宿、食堂、标本馆，甚至还有一个小型图书馆。松索黑猩猩社区就在北边不远处，每早她都会出发，陪同两位乌干达野外助理。整个黑猩猩社区通常约有七十名成员，个体以约五只为一组活动，群体成员的构成有时会日日变化。\n\
  \n每个早晨，罗伯茨都会前往附近的灌木丛。“黑猩猩是很好的研究对象，因为它们移动不多，”她说。“我也研究倭黑猩猩，它们每二十分钟就移动一次……但一旦黑猩猩找到一个好的觅食地，它们可以在那里待一整天。”这使得拍摄工作得以大量进行，手持摄像机的她会挑选一只黑猩猩并跟随其十八分钟。自\
  \ 1990 年以来一直参与松索社区工作的野外助理之一 Geresomu Muhumuza 擅长通过独特的面部和身体特征识别个体黑猩猩，而罗伯茨将摄像机对准研究对象时，Muhumuza\
  \ 会记录在研究对象 10 米范围内有哪些黑猩猩以及这些个体在做什么。然后罗伯茨会挑选另一只黑猩猩并重新开始。\n\n在三年的时间里，随着 Muhumuza 收集谁在附近的信息，罗伯茨拍摄了松索黑猩猩做出的近\
  \ 5,000 个手势。手势交流被严格定义为在观众面前以有意的方式使用四肢、身体或头部。手势必须在观众面向发出信号者时朝向观众发出，并且必须导致观众行为的可预测变化，并且为了被认为是有意的，手势在未能引起典型行为反应时必须重复，但在观众做出反应后停止。\n\
  \n罗伯茨及其团队在松索黑猩猩中识别出惊人的 120 种不同手势，包括表 1 中的视觉、触觉和听觉手势。触觉手势几乎总是与友好的行为相关，例如梳理毛发和玩耍，两者都能减轻压力。听觉和视觉手势与友好的行为相关，如问候、梳理毛发、玩耍、交配、旅行和食物分享，但也与不友好的行为相关，如威胁甚至更具攻击性的行为。\n\
  \n| 手势名称 | 手势类型 | 动作 |\n| --- | --- | --- |\n| Arm beckon | Visual | Fast sweeping\
  \ movement toward self in horizontal plane |\n| --- | --- | --- |\n| Roll over |\
  \ Visual | Lying on surface, whole body rotates on x-axis |\n| Bow | Visual | Upper\
  \ back bends forward from the waist |\n| Kiss | Tactile | Closed mouth brought into\
  \ short contact with another’s body |\n| Embrace | Tactile | Arms placed around\
  \ the torso of another |\n| Hold hands | Tactile | Clasp each other by the hand\
  \ |\n| Tap object | Auditory | Strike object with inner side of open hand, slight\
  \ and rapid |\n| Lip smack | Auditory | Lips make loud sound by clapping upper and\
  \ lower lips together |\n| Drum | Auditory | Feet brought into short, audible contact\
  \ with the buttress while holding onto a tree trunk |\n\n*Note:* Column 3 is quoted\
  \ verbatim from A. I. Roberts, S. G. B. Roberts, and S. J. Vick, “The Repertoire\
  \ and Intentionality of Gestural Communication in Wild Chimpanzee,” *Animal Cognition*\
  \ 17 (2014): 317–36.\n\n\n\n\n\n关于这些手势的细节所知甚少，以至于一份清单，加上可能的用途说明，对动物行为学界来说是有价值的。但安娜·罗伯茨想要做的不仅仅是提供布东戈黑猩猩手势的流水账；她想要理解这些手势如何构建黑猩猩社会，而做到这一点的一种方式就是使用社会网络分析。这正是萨姆·罗伯茨在网络分析方面的经验派上用场的地方。他在安娜完成博士学位前不久就完成了自己的博士学位，并前往安娜所在的斯特灵大学。在那里，他获得了与罗宾·邓巴尔一起的博士后研究金（我们在第\
  \ 5 章中提到过他）。作为该博士后的一部分，萨姆正在研究人类社会网络，这让他意识到这也是研究手势在黑猩猩群体中作用的完美工具。\n\n但在我们深入探讨我们最近的进化亲戚的交流网络之前，让我们先退一步，探索两种与人类关系远不那么密切的物种的网络：遍布全球的西方蜜蜂和银眼鸟（一种分布于澳大利亚的鸣禽）。\n\
  \n* * *\n\n## 蜜蜂觅食的协调\n\n协调一个由数千只蜜蜂组成的蜂巢的觅食行为绝非易事。数百名工蜂，全部为雌性，嗡嗡地寻找它们能找到的花粉和花蜜。它们收集到的东西会带回蜂巢。这个系统给蜜蜂带来了后勤噩梦，包括如何传达有关食物来源的信息，以便更多工蜂加入并带回更多战利品到蜂巢。这一问题部分由摇摆舞解决。\n\
  \n蜜蜂在觅食归来后所表现的舞蹈行为由卡尔·冯·弗里施带入公众视野，他对舞蹈的破译是他与尼古拉斯·廷伯根和康拉德·洛伦茨在 1973 年共同分享诺贝尔奖的原因之一。当花粉和花蜜距离蜂巢很远时，有时远达\
  \ 10 公里——约五十万只蜜蜂体长——觅食者回到家后便开始摇摆舞。专门研究蜜蜂社会行为的动物行为学家托马斯·西利称摇摆舞为“一种独特的觅食行为，其中一只蜜蜂在她蜂巢深处，表演她最近前往花斑旅程的微型重现。跟随这些舞蹈的蜜蜂学会了这些花朵的距离、方向和气味，并可以将此信息转化为飞往指定花朵的飞行。……摇摆舞是一种真正象征性的信息，它在空间和时间上都与产生它的行为以及它将引导的行为分离。”\n\
  \n要了解摇摆舞在蜂巢中是如何进行的，想象一只工蜂刚刚从一个充满花粉、滴着花蜜的遥远花斑归来。假设这个花斑距离蜂巢约 200 米，在蜂巢与太阳之间的一条想象的直线以西\
  \ 40 度。当觅食者返回蜂巢时，她开始在蜂巢内的垂直蜂巢上上下舞蹈，同时摆动腹部，她的姐妹工蜂在过程中与她以及彼此保持身体接触。\n\n在舞蹈时，觅食者传达了她刚刚返回的食物来源的地形信息。与沿蜜蜂巢穴直上直下奔跑相比，返回的雌性舞蹈的角度（在本例中为\
  \ 40 度）提供了有关感兴趣的食物来源相对于蜂巢和太阳的位置的信息。蜜蜂在摇摆舞的特定部分舞蹈的时间越长，丰收地就越远：每 75 毫秒的舞蹈就意味着资源距离蜂巢大约额外\
  \ 100 米。\n\n除了从成功觅食者的摇摆舞中获取信息外，蜂巢中的潜在觅食者也可以通过成功姐妹返回巢穴时它们闻到的气味来了解食物来源，无论是在觅食者向蜂巢中的另一只蜜蜂转移花蜜时（营养交换）还是觅食者用触角摩擦巢友时（触角接触）。马特·哈森雅格和埃莉·利德比特一直在研究与摇摆舞、营养交换和触角接触相关的交流网络。\n\
  \n* * *\n\n## 蜜蜂交流的社会网络分析\n\n我上次拜访马特·哈森雅格时，他是伦敦皇家霍洛威大学的博士后研究员，在利德比特的实验室研究蜜蜂的交流网络，但没过多久，他和我就开始回忆起他在路易斯维尔大学我的实验室读博士的日子。从一开始，马特就热衷于深入研究社会行为的动态。当时我的实验室里满是孔雀鱼（`Poecilia\
  \ reticulata`），它们都是多年前在特立尼达的几次旅行中捕获的鱼的后代。他一头扎进去，设计了一个实验来研究社会网络结构如何影响这些鱼的学习和觅食。为了做到这一点，马特创建了在胆大鱼与羞怯鱼数量上不同的鱼群，然后观察与其他群体成员的熟悉程度以及捕食威胁的存在如何影响有关觅食地点的信息流动。在他进行这些实验，然后观看似乎无穷无尽的录像带时，马特\
  \ somehow 找到了时间掌握社会网络理论的概念和分析基础，在此过程中得到了威尔·霍皮特的重大帮助，霍皮特是非人类社会网络数学方面的专家。\n\n作为皇家霍洛威的博士后，马特和埃莉·利德比特与霍皮特联手使用社会网络分析来检查蜂巢中的工蜂从刚刚带回食物的觅食者那里获取了何种信息。他们的假设是，如果工蜂通过摇摆舞传达的信息了解到一个觅食地点，那么该信息应该沿着与这些舞蹈相关的社会网络扩散。为了检验这一点，他们使用了霍皮特设计的一个模型。该模型考察了摇摆舞网络是否能预测蜜蜂到达觅食地点的顺序。为了研究气味在学习此类地点中的作用，哈森雅格及其团队还研究了蜜蜂的营养交换网络和触角接触网络。\n\
  \n皇家霍洛威的实验蜜蜂蜂巢位于校园中心一栋建筑内的一个房间里。蜂巢中多达 3,000 只蜜蜂的所有互动都使用 strategically 放置的摄像机录像。每个蜂巢都有一个通往外界的隧道，蜜蜂可以自由进出。至少在最初的人为失误导致“蜂巢入口处出现整条交通堵塞”，如马特所说，被纠正之后是这样。\n\
  \n\n\n\n\nMatt 及其同事在校园里设立了两个实验饲喂器，为蜜蜂提供蔗糖，这是蜜蜂最喜欢的食物。他们使用了一种久经考验的方法，自冯·弗里施发现摇摆舞的早期以来就一直在使用，以达到实验可以开始的程度。蜜蜂被训练去识别这两个饲喂器的存在，将它们放置在距离蜂巢仅\
  \ 10 米的短距离处，相对于彼此和蜂巢的角度为 110 度。当蜜蜂到达饲喂器时，蜜蜂团队的一员——通常是 Matt——会在它们的背上画一个小小的数字。这并不像听起来那么困难，因为采集者似乎对采集蔗糖\
  \ laser focused。那些珐琅数字似乎改变了人蜂互动的动态。“一旦你标记了一只蜜蜂，”Matt 说，“你会觉得那只蜜蜂突然变成了一个个体。 . . .\
  \ 当你有 3,000 只未标记的蜜蜂，它们看起来大同小异时，情况就\\[不同\\]. . . . 现在，你会想‘哦，是的，223——你是我可靠的蜜蜂之一。’”无论如何，在蜜蜂被标记后，Matt\
  \ 或他的同事很容易确认它们是否属于实验蜂巢，并确定哪些蜂巢成员专门采集哪个饲喂器。\n\n在接下来的几天里，Matt 将两个饲喂器逐渐移得离蜂巢越来越远（但始终保持相对于彼此和蜂巢相同的角度），直到它们距离蜜蜂居住地\
  \ 200 米飞行距离。此时，在天气允许的情况下，实验操纵就可以开始了。“我们真的想瞄准那些晴朗、平静的好日子，”Matt 笑着说，“但那是在英格兰，所以发生的频率不如人所愿。”两个饲喂器中的每一个都装有相同量的蔗糖。然后，在试验前一天，其中一个饲喂器被清空，而另一个则保持满载。现在，那些日复一日专门采集突然变成空饲喂器的采集者变得“失业”了，这是\
  \ Matt 及其同事使用的一个美妙的描述。这意味着蜜蜂团队可以观察专门采集满饲喂器的采集者与失业工蜂——现在是可能被招募到满饲喂器的候选者——之间的关系，并检查蜂巢中的哪个网络——摇摆舞、饲喂或触角接触——最能预测失业采集者何时会开始到达满饲喂器。\n\
  \n对摇摆舞网络、饲喂网络和触角接触网络重要性的比较发现，舞动网络是三者中唯一能够预测失业采集者何时会再次找到工作并找到生产性食物源的网络。但在蜜蜂世界里，日落和恶劣天气，如雨和阴天，会暂时阻断有关太阳相对于蜂巢位置的信息，而这正是摇摆舞中传递的关键数据。当\
  \ Matt 及其同事设计了一个实验，让蜜蜂工蜂从一个已建立的觅食地取食，该觅食地暂时被耗尽但随后相对迅速地得到补充，模仿恶劣天气和日落时，情况就不同了。现在，饲喂网络和触角接触网络是理解采集者返回补充后的斑块顺序的关键，而舞动网络也发挥了一定作用，尽管较弱。\n\
  \n蜜蜂的通讯网络中内置了一种美妙的战略冗余：如果缺乏有关太阳相对于蜂巢的信息，导致舞动网络关闭，其他网络会填补空缺，以确保花粉和花蜜继续流入蜂巢。无论问题的细节如何，对于蜜蜂来说，关于蜂巢食物的信息都会沿着一个或另一个社会网络传递。\n\
  \n* * *\n\n动物之间就许多事情进行交流：食物、捕食者、交配偏好、支配地位、居住地等等。无论交流是否诚实，无论是视觉、听觉、触觉、化学还是它们的组合，那些信息通常会沿着社会网络传播——包括鸟类的鸣唱网络。\n\
  \n* * *\n\n作为一个群体，鸣禽是非人类中听觉交流的无可争议的冠军。鸣唱的产生是先天倾向、试错学习和社会学习相结合的复杂而远未完全理解的结果。事实上，其复杂程度如此之高，以至于研究人员将鸟鸣用作人类语言进化的动物模型。多年来，鸟鸣一直被博物学家、动物行为学家、进化生物学家、神经生物学家、比较心理学家和语言学家所研究。Dominique\
  \ Potvin 希望为她在澳大利亚各地研究的银眼鸟（*Zosterops lateralis*）的鸟鸣研究增添另一个维度，为此她转向了群体层面的思考和社会网络。\n\
  \n在 chapter 6 关于肯尼亚马赛马拉国家保护区的安全网络的讨论中，我们看到网络中的节点最常表示个体，但它们也可以代表物种。但节点也可以代表其他东西：种群。“我认为如果你可以基于它们共享多少次互动来观察种群中个体之间联系的强度，”Potvin\
  \ 说，“为什么不能用\\[鸣唱\\]词汇来做呢，每个*种群*\\[银眼鸟\\]拥有的词汇以及它们彼此之间共享多少？”\n\n银眼鸟拥有美丽的橄榄色羽毛和独特的白色眼圈，是体型极小的鸟，体重约\
  \ 14 克，头尾长度不到 12 厘米。雄鸟负责鸣唱，这些歌曲由音节组成，每个音节在 2–6 千赫频率范围内具有略微不同的声学特性。一只雄鸟可以产生六十多个不同的音节，但任何给定的歌曲由四个到二十个音节组成。\n\
  \nPotvin 对繁殖季节以外的鸣唱作用感兴趣，并专注于银眼鸟在每日清晨合唱中产生的鸣唱。绝不小打小闹，她在博士论文中研究了澳大利亚近一百万平方公里范围内、七个地点共十四个人群产生的鸣唱——每个地点都包括一个农村和一个城市种群。其中一个种群位于国家植物园，距离\
  \ Potvin 所在的墨尔本大学很近；其他种群则远离她的基地，包括东北部的布里斯班、西北部的阿德莱德，以及南部的塔斯马尼亚岛上的霍巴特。虽然银眼鸟通常留在自己的家种群，但\
  \ Potvin 和其他人知道，偶尔银眼鸟会在霍巴特到布里斯班之间往返飞行，飞行距离约 2,000 公里；鸟类略有不同的羽毛图案以及不同的遗传特征有助于区分它们原本来自哪个地区。\n\
  \n收集来自这些地点银眼鸟的鸣唱数据意味着在路上花费大量时间。Potvin 在每个地点花费约两周时间密集采样遗传和鸣唱。在更偏远的地点她露营，但在城市地点，她会住在朋友家或“朋友的朋友的朋友的房子里 . . .\
  \ 利用我自己的社会网络。”对于这十四个人群，Potvin 在每个地点的前几天致力于捕捉雄性银眼鸟，采集血液样本进行遗传分析，并在每只鸟身上放置独特的彩色腿环组合。颜色环使她确信自己不是日复一日地记录同一只个体，而是获得更广泛的样本。\n\
  \n\n\n\n\n## Silvereye Birdsong Networks\n\n每个清晨，Potvin 都早早起床出发，以便在清晨合唱开始时与鸟儿们在一起。为了获取雄鸟发出的歌声数据，她会透过望远镜寻找一只雄鸟并记录其身份。然后她戴上耳机，耳机连接着“定向麦克风”，这样就能只录下某只雄鸟的歌声，而不会录到其他声音。数月以来，日复一日，从一个地点到另一个地点，从一个种群到另一个种群，Potvin\
  \ 反复进行这一过程。总体而言，她对这些公路旅行的回忆是美好的，但布里斯班一个乡村地点发生的事情至今仍让她感到悲伤。她已经捕捉并标记了所有鸟类，并做了一些录音，但没有获得她想要的所有数据，于是决定在完成布里斯班城市地点的工作后再回来。临走前不久，Potvin\
  \ 被当地的一个施工队告知他们要在该区域开辟一条道路。她便前往城市地点收集所需数据，两周后返回乡村地点。“我是在正确的地方吗？”她问自己。“我几乎认不出这里了。我很沮丧。”在如今荒芜的景色中，她听不到任何歌声。\n\
  \n在路上花费了那么多时间后，Potvin 花了数月时间使用软件分析歌声数据，该软件使她能够测量所有十四个地点的音节和歌曲。一项她在论文研究中感兴趣的问题是，城市种群中演唱的歌曲是否适应了村庄和城市生活的声景（从这个意义上说，她研究的乡村地点充当了一种对照）。确实如此：城市银眼鸟调整了歌曲，使其在城市背景噪音中更容易被听到。但直到几年后，当她在澳大利亚\
  \ Sippy Downs 的阳光海岸大学获得教职时，Potvin 才开始思考如何利用她收集的大量数据来构建鸟鸣网络。\n\n这就是龙进入故事的地方。\n\n\
  Potvin 在大学的一位同事是 Celine Frere，她的兴趣众多，其中包括动物社会网络。2010 年，Potvin 仍在攻读论文期间，Frere 开始了一项长期研究，该研究至今仍在进行中，研究布里斯班一个大型公园里超过\
  \ 350 只东部水龙 (*Intellagama lesueurii*)。除了每年五个月的冬眠期外，Frere 的团队研究这些动物的社会行为。很快他们就发现某些龙之间存在友谊，这促使\
  \ Frere 及其团队研究它们的关系网络。随着 Potvin 和 Frere 越来越了解彼此的研究，Potvin 告诉 Frere 她拥有大量关于银眼鸟歌声的数据，并且可能适合进行社会网络分析。Frere\
  \ 表示同意。\n\n对于网络分析，Potvin 及其同事使用了她为论文研究过的部分种群的数据，并在此基础上补充，使用了总共十一个大陆银眼鸟种群，以及塔斯马尼亚、洛德霍华岛、查塔姆岛和诺福克岛的银眼鸟种群，共计十九个种群成为社会网络中的节点。更具体地说，种群中鸟类所唱的音节，按这些音节的相对出现频率加权，成为歌声网络中的节点，而连接节点的联系则代表种群之间音节类型数量和使用程度相似性。\n\
  \nPotvin 及其团队有兴趣利用网络分析来了解种群之间是否存在联系。一件重要的事情是遗传相关性。当所有血液样本被分析并计算出银眼鸟种群之间的成对遗传相关性时，Potvin\
  \ 的团队发现，两个种群中个体越相关，这些种群在网络中演唱的歌曲就越相似。\n\n银眼鸟团队接下来研究了两个种群之间的距离是否也能解释它们在十九个种群网络中演唱的歌曲。为此，他们首先计算了每个种群的中心性，该指标衡量每个种群的曲目与其他种群的相似程度。接下来，他们计算了种群与其最近邻居之间的地理距离，以查看中心性和最近邻居距离是否呈正相关：网络中居中的种群是否也地理上更接近其最近邻居？事实并非如此。但地理在歌声网络中以另一种方式起作用。\n\
  \n处于相似经度（南北）的种群比处于相似纬度（东西）的种群更可能拥有相似的歌曲，而与它们相距多远无关；两个经度相似但相距遥远的种群比两个纬度相似且地理上接近的种群更可能共享歌曲。“东西方向的移动还有几座山脉以及沙漠等阻碍，”Potvin\
  \ 说，这应该会减缓她鸟鸣网络中信息的传播。但她认为，纬度与歌声网络的故事可能不仅仅是澳大利亚阿尔卑斯山、蓝山和 Tirari-Sturt 石质沙漠带来的障碍，还有更多内容，她仍在继续探究这可能是什么。\n\
  \n所有这些都丝毫没有削弱鸟鸣纯粹无与伦比的美感。它所展示的是，即使是最奇妙的交流形式之一，也沿着社会网络传播。\n\n## Chimpanzee Communication\
  \ Networks\n\n回到乌干达的 Budongo 森林，Anna 和 Sam Roberts 研究的黑猩猩们教会了他们，交流网络不仅仅关乎舞蹈和歌唱：手势交流也嵌入在社会网络中。\n\
  \n利用 Anna Roberts 在博士期间研究的十二只黑猩猩发出的手势，Anna 和 Sam Roberts 在 Sonso 黑猩猩群落中构建了交流网络。对于三十八种视觉、二十种触觉和十四种听觉手势，他们创建了亲近网络——黑猩猩彼此之间的距离有多近——以及行为网络，该网络检查手势显示的频率。\n\
  \n他们网络分析的结果显示了我们对我们最近的进化亲缘所期望的奇妙复杂的社会动态。网络中的首选伙伴——朋友，他们花费大量时间彼此靠近——彼此之间交换了许多视觉手势。之前在黑猩猩中的研究发现，与朋友在一起与心率降低有关。Anna\
  \ 和 Sam Roberts 认为视觉信号也可能与唤醒水平降低有关，使手势发出者能够在相对无压力的情况下向接收者传达情绪状态。\n\n当手势在非朋友黑猩猩之间交换时，情况则不同。在此类互动中，网络成员倾向于依赖听觉和触觉信号。在此，Anna\
  \ 和 Sam Roberts 提出，听觉和触觉手势比视觉手势更不含糊，可能在减少与不太熟悉的伙伴互动后可能发生的事件的不确定性方面尤其重要，这是在 Sonso\
  \ 群落存在的裂变-融合社会中的一个持续挑战。这对于触觉手势可能尤其重要，因为触觉手势几乎总是与亲社会行为相关联，这可能使黑猩猩能够在更大的社会网络中互动，在那里朋友相对于不太熟悉的熟人来说相对稀少。\n\
  \n\n\n\n\n从蜜蜂到银眼鸟再到黑猩猩，动物世界里充满了沿着社会网络传播的复杂信息。在下一章中，我们将提高这种复杂性的难度，并深入探讨文化传播如何沿着社会网络在座头鲸和宽吻海豚到黑猩猩和大山雀等生物中传播新的性状。\n\
  \n# 9. 文化网络\n\n他从我这里接受一个想法，就等于自己获得了教诲，而丝毫不减少我的教诲；正如他在我的灯上点燃自己的蜡烛，接受光明却不会使我变暗。——托马斯·杰斐逊致艾萨克·麦克弗森，1813\
  \ 年 8 月 13 日\n\n进化生物学的一个核心原则是，要使自然选择作用于一种行为性状，必须具备三件事。首先，种群中必须存在不同的行为变异。例如，如果行为是配偶选择，那么有些动物可能更喜欢色彩鲜艳、冒险的配偶，而另一些动物可能更喜欢颜色暗淡、规避风险的配偶。没有行为变异，自然选择就无从*选择*。但仅有变异不足以使自然选择起作用：这种变异必须映射到繁殖成功上，即使是间接的。如果行为变异不能转化为适合度差异，就不会导致进化变化。最后，行为必须以相当高的保真度从一代传到下一代。没有遗传系统，与行为相关的任何适合度差异在下一代都会被抹去。\n\
  \n当奥地利僧侣格雷戈尔·孟德尔在 20 世纪初关于豌豆（以及其他事物）的实验被重新发现时，很明显基因是跨世代传递性状（包括行为性状）的一种方式。的确，在接下来的五十多年里，进化生物学家和动物行为学家认为基因不仅是跨世代传递性状的一种方式——它们是*唯一*的方式。但随着时间的推移，动物行为学家开始了解到另一种传递系统。在一项关于日本猕猴觅食行为的研究中，灵长类学家川村俊三和河合正雄发现，行为可以在非人类中跨世代传递，不仅通过遗传，还通过*文化传播*。更重要的是，文化传播不仅发生在世代之间，从父母到后代，也发生在世代之内，从同伴到同伴。\n\
  \n为了了解这一切是如何运作的，我们简要转向 Imo，一只在 1950 年代生活在日本高岛小岛上的日本猕猴。川村和河合以及其他研究 Imo 猕猴群的学者在沙滩上扔甜薯和麦子，让猴子习惯人类的存在。当\
  \ Imo 一岁时，她开始做岛上从未见过的猕猴会做的事：在吃甜薯之前，她会在水中清洗甜薯，抖掉所有沙子，让甜薯更美味。如果 Imo 是唯一这样做的人，她的创新就会随着她的死亡而消失。相反，Imo\
  \ 的许多同伴和亲戚通过文化传播从 Imo 那里学会了洗土豆的技巧：通过观看她清洗土豆并自己尝试。\n\nImo 在高岛小岛猕猴中的文化偶像地位只会越来越强。当她四岁时，她找到了处理人类放在海滩上的小麦的更好方法。小麦和沙子混合在一起可以吃，但并不特别美味。Imo\
  \ 也为这个问题想出了一个新颖的解决方案。她把小麦和沙子的混合物扔进水里。沙子沉下去，小麦浮起来。这听起来比实际更重要，因为灵长类几乎从不放手一旦它们手里拿到的食物。但为了去掉沙子，Imo\
  \ 必须放开小麦，而她就是这么做的。就像甜薯一样，Imo 的群友从她那里学会了这个新把戏。六十多年后，在 Imo 死去很久之后，高岛小岛上的猕猴仍然清洗它们的甜薯和清理小麦，而它们和我们都应该感谢\
  \ Imo。\n\n川村和河合并没有用社会网络理论来理解 Imo 的觅食创新如何在她的群体中传播，原因很简单，因为社会网络理论本身当时还不存在。但几十年后，当简·曼研究澳大利亚的宽吻海豚的文化和工具使用时，它已经存在了。\n\
  \n* * *\n\n工具使用不一定涉及制造轮子或齿轮——这种定义几乎可以保证它只被认为存在于人类中——它仅仅意味着塑造一个物体使其发挥某种功能。新喀里多尼亚乌鸦（*Corvus\
  \ moneduloides*）使用由小枝制成的工具从树皮下提取昆虫，这些小枝的叶子边缘长着细小的尖刺。昆虫反应并抓住插入的小枝，乌鸦然后拔出工具并吃掉夹住的东西。初学造工具的乌鸦一开始制造简单的工具，随着成熟，它们开始制造更复杂的工具。新喀里多尼亚乌鸦甚至可以用多部分制造工具，值得注意的是它们会保护自己最好的、最喜欢的工具以便重复使用。\n\
  \n工具解决问题的。对于澳大利亚沙鱼湾的宽吻海豚（*Tursiops aduncus*）来说，问题集中在用吻部戳探沙子以吓出像斑头拟鲈（*Parapercis\
  \ clathrata*）这样的鱼从海湾底部出来。这在岩石之间用吻部猛击一点也不愉快，所以沙鱼湾中一小部分海豚，主要是雌性，会用吻部捡起一个篮状海绵，把吻部紧紧塞进海绵里，用它来缓冲探查岩石海底的冲击，有效地把另一种生物变成工具。沙鱼湾的雌性海豚对海绵的选择很认真，常常花十分钟寻找刚好适合吻部的大小和形状，然后游到它们最喜欢的\
  \ 8 到 14 米深的海湾之间水道进行捕猎。如果一个使用海绵的海豚确实摇晃出藏在沙子里的底栖鱼，它们会把海绵扔掉并追逐猎物。当它们完成后，如果海绵特别合适，它们会回去取回它以便进一步使用。\n\
  \n沙鱼湾位于澳大利亚西海岸的猴米亚附近，在珀斯东北约 850 公里处。该湾巨大，覆盖 13,000 平方公里，平均深度约为 9 米，不仅栖息着一千多只宽吻海豚，还有\
  \ 16,000 头 dugong（*Dugong dugon*），这种海洋哺乳动物的最近的现存亲戚是海牛。其水域内还拥有世界上最大的海草床，而位于该湾哈梅林池海洋自然保护区的叠层石化石可追溯到近\
  \ 30 亿年前。当然，沙鱼湾也是许多鲨鱼的家园，其中一些以海豚为食。\n\n自 1984 年沙鱼湾海豚项目开始以来，团队成员收集了超过 1,500 只宽吻海豚的数据。研究人员汇编了一本巨大的海豚证件照簿，根据性别以及鳍的形状，以及鳍和身体上疤痕的形状——通常来自鲨鱼咬伤——来识别个体海豚。\n\
  \n即使在沙鱼湾发现海绵使用行为之前，简·曼就已经在那里研究海豚了。1988 年，她是密歇根大学的博士生，与动物行为学家和灵长类学家芭芭拉·斯穆茨合作。斯穆茨对沙鱼湾海豚的母子互动产生了兴趣。斯穆茨在海豚项目上的一个助手在最后一刻取消了，而由于曼在肯尼亚安博塞利公园的地下工作对狒狒的母婴互动进行了一些本科研究，斯穆茨请她顶上并帮助海豚工作，曼很乐意这样做。\n\
  \n\n\n\n\n## 海豚海绵使用文化与社会网络\n\nMann 是 Shark Bay 研究团队的一员，该团队于 1995 年首次记录了海绵使用行为，近三十年来，她和她的同事们一直在努力拼凑这种行为是如何沿着社会网络传播到海湾中一群海豚的。正如人类文化文献中所描述的，在动物行为文献中，文化的定义特征之一是它使群体彼此区分开来：“我非常感兴趣……海豚是否有一个概念，‘这是我们的做事方式，与其他人做事的方式不同’，”Mann\
  \ 说。“这是否将它们联系在一起？社会网络分析让你可以用数学方法来探究这个问题。”幸运的是，Lisa Singh，Mann 所在机构 Georgetown 的一名计算计算机科学家，已经在与\
  \ Mann 合作开发 Shark Bay 海豚的定制数据库。Singh 也曾从事社会网络的工作，很快她、Mann 及其合作者就开始从网络视角审视文化和海绵使用行为的数据。\n\
  \n### 海绵使用作为觅食技巧\n\n当 Mann 和她的同事开始社会网络分析时，他们对 Shark Bay 的海绵使用行为和海绵使用者已经相当了解。他们确信海绵使用是一种觅食技巧，不仅因为在条件合适时，他们可以从船上观察到海豚使用海绵，而且因为他们自己也尝试过海绵使用。他们会在海绵使用海豚喜欢的区域潜水并拍摄海豚的视频。然后，他们会在同一地点进行第二次潜水，一部分潜水员拍摄视频，其他人则戴着海绵在手上探测海底。当他们比较视频时，他们惊讶地发现，当人类海绵使用者搅动它们原本安全的世界时，有多少底栖鱼被惊扰起来。\n\
  \nMann 知道海绵使用者倾向于为雌性。虽然偶尔有雄性戴上海绵探测海湾底部，但总体而言，雄性更感兴趣的是形成联盟以帮助它们获得交配机会，而不是专门的工具使用。Mann\
  \ 知道，除了可能在母亲身边游泳的依赖幼崽外，雌性海绵使用者在觅食时是独自进行的；而非海绵使用者则倾向于成群结队地寻找食物。她还知道海绵使用者——比如 `Rub-a-Dub`、`Hubba`、`Grub`\
  \ 和 `Pub`——总是有一个也是海绵使用者的母亲，她假设像 `Rub-a-Dub` 这样的幼年海豚是通过模仿——一种文化传递——复制母亲的海绵使用行为。\n\
  \n### 遗传 vs 文化传递\n\n从父母到后代的文化传递很难确定，因为它看起来很像从父母到后代的行为遗传传递。在两者中，*某种东西* 都从父母那里传递下来。在文化传递中，这个东西是一种技能，比如如何使用海绵觅食；在后一种情况下，则是与该行为相关的基因在世代间传递。行为生态学家\
  \ Michael Krützen 领导了一个研究团队，包括 Mann，他们采用分子遗传工具排除了遗传传递：海绵使用确实是一种从母亲文化传递给后代的性状。\n\n\
  ### 海绵使用者之间的网络联系\n\nMann 不知道的是，雌性海绵使用者是否以某种方式相互建立网络。请记住，海绵使用是一项独居活动，除了有时有依赖幼崽的雌性外，这意味着海绵使用者在海绵使用时*不会*建立网络*。但海绵使用行为只占海豚一天中的一小部分。也许成年雌性海绵使用者在不使用海绵时相互建立网络？“海绵使用者[有时]会携带它们的海绵并会与佩戴海绵的其他海绵使用者会合，”Mann\
  \ 说。“那时它们并不是在觅食，只是在闲逛。”更重要的是，使用过一次海绵的雌性往往会专攻海绵使用，这意味着如果你是海绵使用者，即使你在见到另一只海绵使用者时她没有戴海绵，只要你曾在某个时候见过她戴着海绵，你就可以相当确定她仍然是海绵使用者。\n\
  \n### 关联网络构建\n\n为了构建宽吻海豚关联网络，Mann 及其团队寻找在海豚*未*觅食时谁在谁附近游泳的情况。如果海豚彼此相距约 `10 meters`\
  \ 或通过另一只个体以相同的 `10-meter` 规则相互连接，则认为它们在关联。Mann 使用了从 `1989 and 2010` 年间 `15,000 surveys`\
  \ 中得出的 `36 spongers` 和 `105 non-spongers` 的历史关联模式，这些调查详细记录了海豚所在的位置、它们在做什么以及它们与哪些海豚一起游泳。\n\
  \n### 网络发现\n\n对这 `141` 只海豚网络的社会网络分析揭示，非海绵使用者比它们的海绵使用者同伴连接得更好。非海绵使用者拥有更多的关联者，并且与这些关联者的联系比海绵使用者更强。非海绵使用者还拥有更多朋友和朋友的朋友。非海绵使用者在网络中更深层次的连接部分归因于它们倾向于成群觅食：虽然觅食行为本身并不是网络分析的一部分，但非海绵使用者可能在预期群体觅食事件时花费更多时间在他人周围。\n\
  \n海绵使用者在唯一一个主要社会网络指标上数值高于非海绵使用者的是聚类系数，该系数在其他方面衡量了小团体倾向。非海绵使用者可能在整体网络中连接更多，但海绵使用者在该网络中形成了小团体，优先与其他海绵使用者互动而不是非海绵使用者。但为什么呢？海绵使用者从小团体成员身份中获得了什么？如果海绵使用是一项独居活动，为什么还要在其他觅食者周围徘徊？Mann\
  \ 和她的同事认为，答案至少部分在于，虽然海绵使用者总是从母亲那里学习海绵使用技能，并且只从母亲那里学习，但海绵使用者可能可以通过在社会网络小团体中游泳获得另一项重要的与海绵相关的信息——即好的海绵在哪里。\n\
  \n### 跨物种比较\n\n值得注意的是，海豚并不是唯一使用海绵并利用网络联系以有效使用它们的一种动物。黑猩猩也使用海绵，但它们的网络方式与宽吻海豚非常不同。但在我们比较跨物种的海绵使用之前，让我们先看看这些瓶颈海豚的鲸类近亲的文化网络。\n\
  \n“我就是那种孩子，”Jenny Allen 回忆道，“我说我长大后要与鲸鱼工作，每个人都说‘好吧，但你最终会找一份真正的工作。’”最终她确实找到了一份真正的工作——正如她预测的那样，与鲸鱼工作。作为一名本科生，Allen\
  \ 学习海洋生物学并在马萨诸塞州格洛斯特的 Whale Center of New England 实习。不久她就在船上度过时间，研究缅因湾 Stellwagen\
  \ Bank 国家海洋保护区内的座头鲸（`Megaptera novaeangliae`），该保护区位于 Whale Center 东南约 50 公里处。毕业后，Allen\
  \ 在 Whale Center 获得全职职位并继续在 Stellwagen Bank 的工作，观察她深爱的壮丽生物。\n\n鲸鱼研究可能很棘手，因为它通常与生态旅游和观鲸远征有着密切联系。Allen\
  \ 与该地区的观鲸公司有联系，她会作为船上自然学家随他们出海。她会为船上一两百人讲述冒险故事，作为回报，她和她的助手被允许收集鲸鱼的基本信息，包括它们的觅食行为。他们还会拍照，重点拍摄鲸鱼的尾巴——尾巴上的图案相当于鲸鱼的指纹——并将其与他们随身携带的尾巴照片集进行比较。\n\
  \n\n\n\n通常，艾伦与船长的安排运作得很好，但有时这也是一种微妙的平衡行为。在一艘船没有遇到太多鲸鱼的日子里，艾伦可能在遇到一只鲸鱼后十五或二十分钟就准备离开。但她经常不得不花时间说服船长，而船长的职责是最大化乘客在船上与他们花钱来看的鲸鱼共度的时光，让他确实应该继续前进并希望能遇到另一只鲸鱼。除非是恰好合适的船长，心情也恰好合适，否则船只会停留在那只几乎确定的鲸鱼面前。\n\
  \n站在甲板上，艾伦经常被一种奇怪的行为所吸引，这种行为似乎正在她研究的 1,300 头鲸鱼群体中传播。缅因湾及其他地方的鲸鱼长期以来就已知使用一种叫做泡泡捕食的觅食技巧，即鲸鱼潜入水面下\
  \ 20 米，在一群猎物鱼周围释放五六次呼吸。这会在猎物下方和周围形成一个泡泡环，当泡泡环到达水面时，鲸鱼会冲破泡泡环，在此过程中捕获食物。但这一切对一只座头鲸来说还不够，它在\
  \ 1980 年左右为泡泡捕食序列增添了一个新变化。在潜水开始泡泡捕食以捕获一群鱼之前，这只鲸鱼会拍打尾巴击打水面，这种行为被称为尾拍捕食。不久，其他几只鲸鱼也开始这样做——尽管拍打水面的次数因鲸而异——到艾伦在\
  \ 2000 年代初期观察时，近 40%的鲸鱼都在使用尾拍捕食。艾伦认为尾拍行为是通过文化传播在鲸鱼网络中传播的：与尾拍者共度的天真鲸鱼似乎通过观察学会了这种新传统。尽管如此，她知道仅凭自己的观察，她无法对此确信无疑。\n\
  \n艾伦对社会网络在尾拍捕食通过文化传播的扩散中可能扮演的角色的兴趣始于 2010 年，当时她进入苏格兰圣安德鲁斯大学攻读硕士学位。在那里，她与上一章中提到的网络建模专家威尔·霍皮特以及动物文化专家卢克·伦德尔合作。“看，你们有没有适合硕士论文的项目？”艾伦问伦德尔和霍皮特。“如果没有，我可以访问这份数据集——也许我们可以利用它？”艾伦一直与鲸鱼中心保持良好关系，她所指的数据集充满了自\
  \ 1980 年以来缅因湾座头鲸尾拍捕食的信息。幸运的是，霍皮特正在开发一些新的社会网络模型，还没有机会将其应用于野生种群或像艾伦所能访问的那样庞大的数据集，他对此感到兴奋。伦德尔一眼就能看出研究文化传播的绝佳机会，对这个想法也很感兴趣。\n\
  \n艾伦的论文涉及将斯泰尔瓦根银行近三十年的尾拍捕食数据整理成可用于社会网络分析的形式。这并不容易。在三十年间，这些数据是由数十个不同的人收集的，他们对座头鲸觅食行为的专业程度各不相同。“观察者不一定会说，‘这只动物在进行尾拍捕食’，”她指出，“因为我能读懂那份数据收集的语言……我可以说，‘哦，这个行为序列就是尾拍捕食。’”\n\
  \n艾伦搜索了 73,790 条带时间标记的鲸鱼目击记录，涉及 653 个个体，每个个体至少被观察到二十次。她为一只鲸鱼编码为零，如果到那个时间点它从未被观察到进行尾拍觅食，或编码为一，如果它在过去任何时候被观察到进行尾拍捕食。此外，对于涉及多个个体的记录，艾伦还记录了哪些鲸鱼被发现在一起。即使在所有编码完成后，仍存在技术障碍。数据集太大，霍皮特构建的计算机模型无法处理全部数据而崩溃。但霍皮特迎接了挑战，做了必要的调整，很快数据和模型就同步了。\n\
  \n如果不熟悉尾拍捕食的鲸鱼通过观察尾拍者学会了这种技巧——也就是说，如果尾拍行为是通过文化传播在鲸鱼社会网络中传播的——那么作为一般规律，尾拍者应该被看到与尾拍者交往。为了理解原因，想象一组五只鲸鱼，它们倾向于一起度过时间。假设其中三只鲸鱼是尾拍者，两只不是。如果两只天真的鲸鱼从其他鲸鱼那里学会了尾拍觅食，那么下一次观察到这五只鲸鱼的群体时，以及此后每次观察时，它们都将全部是尾拍者。霍皮特构建的社会网络模型旨在询问近\
  \ 74,000 条记录是否确实显示了这种情况。\n\n霍皮特的模型所做的是比较一只天真鲸鱼通过观察尾拍者学习如何尾拍的概率与它通过简单的试错学习自行学会尾拍捕食的概率。为了进行这种比较，模型计算出一个“社会传播效应”，它衡量与知情个体互动如何加速鲸鱼掌握尾拍行为的速度，相对于试错学习而言。社会传播效应巨大，结果令人震惊：震惊到伦德尔不相信自己看到的东西。“卢克基本上是说，‘哦，你做错了什么，’”艾伦说。“‘你必须回去重新分析。’”艾伦、伦德尔和霍皮特对代码和数据进行了反复检查，寻找某种错误或人为因素，但结果依然成立。尽管如此，艾伦和她的同事们仍在思考是否存在另一种可能更简单、不同于文化传播的替代解释，来说明为什么觅食网络中的尾拍者会相互交往。\n\
  \n艾伦知道尾拍捕食最常发生在鲸鱼捕食沙鳗(*Ammodytes americanus*)时，这种鱼生活在缅因湾。也许尾拍者聚集在一起的原因并不是尾拍行为通过文化传播在它们的觅食网络中传播，而是因为尾拍者都被沙鳗种群吸引。为检验这种可能性，艾伦和她的同事丢弃了鲸鱼首次被观察到尾拍捕食之后的所有交往记录。例如，假设鲸鱼\
  \ 1 于 1999 年 12 月 31 日首次被发现对沙鳗进行尾拍捕食。艾伦和她的同事会知道鲸鱼 1 在那之前与谁一起游泳。如果他们专注于那个时间段，他们就可以检验鲸鱼\
  \ 1 在自己成为尾拍者之前是否与尾拍者有过互动。这意味着他们无需担心从 2000 年 1 月 1 日起，尾拍鲸鱼 1 可能会与其它尾拍者交往，因为它们都只是聚集在沙鳗周围。当他们以这种方式分析数据时，他们发现仅仅待在沙鳗所在的地方并不能解释尾拍觅食为何会以这种方式传播。正如艾伦长期以来一直认为但在考虑社会网络之前无法确定一样，关于尾拍捕食的信息是通过文化传播沿着座头鲸觅食网络传播的。\n\
  \n\n\n\n## 大山雀的实验性文化传播\n\n在野外几乎不可能对座头鲸做任何实验——而且很可能也不道德。对牛津附近怀特姆林木的大山雀来说则并非如此。在那里，后来因澳大利亚凤头鹦鹉社会网络而闻名的露西·阿普林\
  \ [Lucy Aplin](https://wiki.example.org/feynmans_learning_method) ，能够教会几只鸟新的觅食创新，并测试这些创新是否会通过文化传播在它们的社会网络中扩散。\n\
  \n从她工作的开始，阿普林就知道大山雀是聪明的鸟类，并且文化传播在信息如何在它们的社会中传播方面发挥了作用。早年，英国人会用带彩色蜡盖的瓶子送牛奶。1949 年，阿普林出生前很久，在伊莫猕猴在苔藓岛传播新的觅食技巧之前多年，动物行为学家詹姆斯·费舍尔和罗伯特·欣德写道：\n\
  \n> 1921 年，在南安普顿斯通哈姆附近的斯韦辛林，有鸟类被描述为山雀，它们被观察到撬开门廊上牛奶瓶的蜡板盖，喝牛奶。这是现在已成为英格兰许多地区以及威尔士、苏格兰和爱尔兰一些地区广泛习惯的行为的第一个已知记录。瓶子通常在放在门口几分钟内就被攻击。甚至有几份报告称，山雀群会跟随牛奶车的马车走在街上，并在牛奶工给各家送牛奶时从车上取下瓶盖。\n\
  \n撬开牛奶盖以获取内容物最常记录在山雀中，包括大山雀（*Parus major*）和蓝山雀（*Parus caeruleus*）。费舍尔和欣德向英国鸟类学会的\
  \ 200 名成员发放了关于开牛奶瓶的调查问卷，并据此拼凑出这种新行为在英国大范围内传播的历史。调查数据表明，有时一只大山雀偶然在它所在社区的一只牛奶瓶中发现了获取牛奶的技巧，而其他鸟类至少部分是通过观察最初的窃贼学会了这种技能。更重要的是，不同品质的牛奶有不同颜色的盖子，而在牛奶瓶被打开的地区，鸟类倾向于偏好相同颜色的盖子，这强烈暗示了文化传播。那些大山雀牛奶窃贼并不生活在怀特姆，但如果大山雀能够弄清楚如何偷走用于泡一杯好茶的牛奶，它们似乎非常适合进行一项明确关于文化传播和社会网络的实验。\n\
  \n### 怀特姆研究系统\n\n阿普林在怀特姆工作的山雀种群是世界上研究最充分的鸟类种群之一，由牛津爱德华·格雷研究所的研究人员监测了数十年。怀特姆山雀项目始于\
  \ 1947 年，当时生态学领域的传奇人物大卫·拉克在那里的林地放置了 100 个巢箱。到 1960 年，巢箱数量已增至 1,000 个，散布在整个 385 公顷的林地中，被称为“有叶子的实验室”。\n\
  \n阿普林抵达前不久，怀特姆的本·谢尔顿团队获得了大额资助，部分资金用于给怀特姆的大山雀添加标签，每个标签都嵌入了微芯片。与通常的做法不同，怀特姆团队没有将这些\
  \ PIT 标签植入体内，而是找到了一种侵入性小得多的办法。所有大山雀都有腿环，让研究人员知道谁是谁，而 PIT 标签被密封在防水外壳中，附着在这些环上。\n\n\
  ### 拼图盒实验\n\n这些 PIT 标签对阿普林关于网络和文化的工作至关重要。她——连同达米安·法林、谢尔顿和其他人一起——向大山雀种群引入了一种新的觅食技巧，并测试它是否会通过文化传播在社会网络中传播。为此，他们建造了一个“拼图盒”，里面装有面包虫，这是大山雀的最爱。面包虫可以通过鸟类*要么*将盒子上的蓝色门从左滑到右*要么*将红色门从右滑到左来获取。\n\
  \n一旦阿普林和她的团队准备好拼图盒，他们就从怀特姆的八个不同山雀种群中捕获了两只雄鸟并带入实验室。其中两个种群的鸟被训练为导师，打开蓝色门（从左到右），三个种群的鸟被训练为导师，打开红色门（从右到左）来解决拼图盒问题。其他三个种群的鸟没有接受训练来解决拼图难题，因此作为对照。\n\
  \n经过四天的训练，阿普林将实验室中的十六只雄鸟放归它们被捕获的种群，但在此之前，她和她的同事在每个种群的家域内放置了三个拼图盒。每个拼图盒都安装了射频识别（RFID）天线，这样每次鸟到达拼图盒时，其\
  \ PIT 标签 ID 就会被记录，同时也会记录它是否将蓝色门从左移到右、红色门从右移到左，或是未能解决拼图而飞走的数据。\n\n在这一切进行的同时，阿普林的团队和项目上的其他人也在收集山雀在另一组喂食器上进食时的群体数据，这些喂食器里装满了向所有鸟类*始终*开放的葵花籽。这些喂食器上的葵花籽可以自由获取——那里不需要解决任何拼图——而鸟类在这些种子喂食器处的互动被用来构建山雀关联网络。\n\
  \n这一切让阿普林和她的同事骑着自行车和摩托车四处奔波。必须从拼图盒下载数据，必须补充（或更换腐烂的）盒子里的面包虫，必须在耗尽时更换为 RFID 天线充电的电池，还必须不断向葵花籽喂食站添加种子。“在林中搬运沉重负载和在黑暗中行走很多，”阿普林说，“但这非常非常有趣。”非常有趣，而且信息量惊人。\n\
  \n### 结果\n\n拼图盒的解决方案通过文化传播沿着社会网络传播的第一个线索是，来自对照种群的鸟类（鸟类被捕获但未接受训练）解决拼图盒问题的频率远低于有导师的种群的鸟类。但远不止于此。在拼图盒在林中放置的二十天后，有导师的种群中平均有\
  \ 75%的鸟类使用该种群导师使用的相同技巧解决拼图。拼图盒被打开超过 57,000 次，从最初五个有导师的种群中的十只导师开始，超过 400 只鸟现在像它们的导师一样打开盒子。\n\
  \n阿普林和她的同事随后利用种子喂食器的社会网络数据查看谁与谁相关联，然后将拼图盒数据映射到该网络上。他们发现，个体在葵花籽喂食器关联网络中与导师联系越紧密，它学会像导师一样打开拼图盒的可能性就越大。事实上，鸟在关联网络中与导师共处的时间每增加一个单位，它能够解决拼图盒的可能性就高十二倍。\n\
  \n\n\n\n\n![牛津附近威瑟姆森林中大山雀觅食网络示意图。两只个体（实心圆圈内）被训练以新方式获取食物后放回其种群。虚线圆圈显示学会了新觅食技术的个体。未在圆圈内的鸟类未能学会新觅食技术。新技术通过与导师互动最多的种群子集扩散。鸟类图片经\
  \ istock.com 许可使用。网络大致基于 L. M. Aplin, D. R. Farine, J. Morand-Ferron, A. Cockburn,\
  \ A. Thornton, and B. C. Sheldon, “Experimentally Induced Innovations Lead to Persistent\
  \ Culture via Conformity in Wild Birds,” Nature 518 (2015): 538–41。大山雀图片经 istock.com\
  \ 许可使用。](img/chi-Dugatkin-fig06_REPLACEMENT-5-15-23.jpeg)\n\n牛津附近威瑟姆森林中大山雀觅食网络示意图。两只个体（实心圆圈内）被训练以新方式获取食物后放回其种群。虚线圆圈显示学会了新觅食技术的个体。未在圆圈内的鸟类未能学会新觅食技术。新技术通过与导师互动最多的种群子集扩散。鸟类图片经\
  \ [istock.com](http://istock.com) 许可使用。网络大致基于 L. M. Aplin, D. R. Farine, J. Morand-Ferron,\
  \ A. Cockburn, A. Thornton, and B. C. Sheldon, “Experimentally Induced Innovations\
  \ Lead to Persistent Culture via Conformity in Wild Birds,” *Nature* 518 (2015):\
  \ 538–41。大山雀图片经 [istock.com](http://istock.com) 许可使用。\n\n很明显，如何解决谜题的信息正沿着山雀关联网络以文化方式传播，但\
  \ Aplin 想要知道更多。这一网络化文化对鸟类有多重要呢？她发现的答案是非常重要。如果一只鸟在学会像其导师一样打开谜题盒后，又偶然发现了打开盒子的另一种方法，它通常会坚持导师教给它的那一种。而且文化传播的觅食传统还有另一种持久性。几乎一年后，在谜题盒被移除后，Aplin\
  \ 又在原本有蓝色门导师的种群的家域和原本有红色门导师的种群的家域各放置了五天谜题盒。尽管那时没有引入*新*导师，而且种群发生了显著更替，但每个种群中的鸟类很快就开始使用导师一年前引入的技术打开谜题盒。其中一些鸟类在前一年从导师那里学会了如何打开谜题盒，只是重新唤起了之前通过文化获得的行为，但其他鸟类则是第一次学习，要么是从仍在的原始导师那里学习，要么是从重新唤起先前从导师那里学到的行为的鸟类那里学习。\n\
  \n* * *\n\n回到工具使用、文化传播和社会网络，回顾一下上章讨论的乌干达布东戈森林的 Sonso 社群黑猩猩。2011 年 11 月 14 日上午 9:05，一项创新诞生于该社群的黑猩猩，当时该群中的一只优势雄性制作了一种新工具。虽然她当时并未意识到，但对灵长类学家\
  \ Cat Hobaiter 来说，这也是一个特别的时刻，她当时正亲眼目睹。Hobaiter 并不是唯一在观看的人：Sonso 群体的其他成员也在观看，在接下来的五天里，一种新的制作工具方法通过文化传播沿着\
  \ Sonso 社会觅食网络传播开来。\n\n并不是黑猩猩的工具、文化或社会网络最初让 Hobaiter 为了她的博士研究来到布东戈森林。相反，正是与 Sam\
  \ 和 Anna Roberts 来到布东戈的原因相同：手势交流。Hobaiter 对这些手势采取了整体视角：“我认为理解一种交流系统需要我理解黑猩猩世界的一切，”她说。“对我来说，了解成为一只黑猩猩意味着什么很重要；否则，为什么我会在乎他们的手势意味着什么呢？”\n\
  \n理解一切意味着早起，拿上她的摄像机，并在那一天尽可能多地跟随黑猩猩，事实上在她在布东戈的每一次十个月的驻扎期间都是如此。幸运的是，野外营地，Hobaiter\
  \ 有一间小房子，就在 Sonso 黑猩猩家域的正中央，她几乎可以从床上滚下来就开始采集数据。当有数据可采集时，也就是说。“我做的百分之九十，”Hobaiter\
  \ 说，“就是等待黑猩猩做点什么，通常是等待它们从树上下来，它们坐在美丽温暖的阳光下，而我却坐在泥泞的黑暗潮湿的森林地面上，浑身布满虫子。”\n\n在那命运多舛的\
  \ 11 月 14 日那天，Hobaiter 跟随 Sonso 黑猩猩的一群，当它们来到一棵树根部的一个新水坑时。水坑在雨林中随处可见，尤其是在雨季，但不知为何，黑猩猩们非常喜欢这个水坑。“它们为此疯狂，”Hobaiter\
  \ 说。“简直是手势的天堂……黑猩猩们互相告诉对方走开、滚开，或与我亲近，或我可以过来接近你。”她连续六天跟随这群黑猩猩，拍摄它们所做的一切。\n\nHobaiter\
  \ 注意到 Nick，这群中的一只优势雄性，正在取一撮苔藓，将它们捏在一起做成海绵并从中吸水。虽然她见过黑猩猩用叶子制作海绵，但 Hobaiter 从未见过布东戈的黑猩猩用苔藓制作海绵。但由于她的关注点集中在手势交流上，她并没有太在意这一点，也没有在意群体中其他个体开始做同样的事情。在那六天结束时，Hobaiter\
  \ 在营地回看录像带，对手势进行编码，就这样结束了。\n\n几个月后，Hobaiter 在森林中与她的同事 Thibaud Gruber 一起，Thibaud\
  \ Gruber 是一位瑞士动物行为学家。他们有充足的时间聊天，Hobaiter 知道 Gruber 不仅研究交流，还对工具使用和文化进化感兴趣。“\\[黑猩猩\\\
  ]一直有这种奇怪的海绵行为，使用苔藓，”她告诉 Gruber，并补充说她有六天的录像带为证。“我们当时在沼泽深处，”Hobaiter 说，“Thibaud  literally\
  \ 把我带回营地看录像带。”看完后，这次关注的是苔藓海绵，而不是手势交流，他们知道自己发现了重要线索。看起来苔藓海绵的使用正通过文化传播在 Sonso 种群的一个子集中传播。但与大山雀、座头鲸和瓶鼻海豚不同，后者通过关联模式推断信息的传播，Hobaiter\
  \ 拥有的录像带有可能追踪这种新工具技术从 Nick 第一次制作苔藓海绵那一刻起的精确传播。\n\n当 Hobaiter 返回她在苏格兰圣安德鲁斯大学的基地时，她招募了当时也在圣安德鲁斯的\
  \ Will Hoppitt，建立一个新的网络模型来看看布东戈苔藓海绵使用情况究竟发生了什么。“我完全是偶然获得了这组数据，”Hobaiter 说。“Thibaud\
  \ 很长时间以来就有这个研究问题，而 Will 想建模类似的东西……我们各种兴趣的美好结合。”\n\n\n\n\n\n随着 Hobaiter 及其同事观看录像带，他们记录了在那个特殊水源地出现的每只黑猩猩的身份以及它们正在或没有做的事情。在\
  \ Nick 第一次制作苔藓海绵后，Hobaiter 记录了在 Nick 以及随后其他个体制作苔藓海绵时在场的观众。观众的标准设得很高：一只黑猩猩只有在距离正在积极制作苔藓海绵的个体\
  \ 1 米范围内，并且是盯着制作者看、将视线转移到制作者身上，或以追踪制作者动作的方式移动头部时，才被视为观众成员。\n\nNambi 是水源地网络中的一只优势雌性，她是第一个通过观察\
  \ Nick 学会制作苔藓海绵的。从那时起，该水源地网络中另外三十只黑猩猩中的七只开始制作苔藓海绵。这七只黑猩猩中有六只只是在观看海绵制作者之后才掌握了这一技能。观众效应非常明显。每当一只非海绵制作者成为观众成员时，它学会使用苔藓作为工具的几率就会增加十五倍：如果一只没有表现出制作海绵行为的黑猩猩两次成为观众成员，它掌握该技能的几率就会增加三十倍。\n\
  \n一切都说得通。除了有一件事。Kwara 是水源地网络中的一只优势雌性，她从未在海绵制作者的观众中出现过，然而她却在制作苔藓海绵。沿着黑猩猩社交网络的文化传播解释了苔藓海绵的使用——除了\
  \ Kwara。Hobaiter 重新查看了录像带，以确保他们没有错过 Kwara 某次在观众中的情况：没有错过，但这次重新观看录像带让 Hobaiter 意识到，文化以及它如何沿着社交网络传播新行为，比她最初认为的还要复杂。\n\
  \n事实证明，就在 Kwara 制作第一个苔藓海绵前的几分钟，她从林地上捡起了一个旧的苔藓海绵并自己使用。她没有看到任何人制作工具，她只是发现一个躺在那里的工具并尝试使用它。\
  \ “[文化] 传播在黑猩猩中，”Hobaiter 意识到，“不仅仅是它们看到了什么，还包括它们是否能与他人行为的产物互动。” 这个产品本身——在这种情况下是被丢弃的苔藓海绵——在网络动态中发挥着间接作用。Kwara\
  \ 是第四只制作苔藓海绵的黑猩猩：Janie 是第五只掌握海绵制作技能的个体，她是通过坐在 Kwara 展示其新工具制作才能的观众中学习的。\n\n如果我们退一步比较海豚和黑猩猩，我们就能看到工具使用、文化传播和社交网络之间的关系有多么复杂和有趣。在黑猩猩的情况下，水源地存在一个网络，关于工具使用的信息通过文化传播沿着该网络传播。在海豚的情况下，工具使用的文化传播要有限得多，只涉及母亲及其后代，而且工具使用是\
  \ solitary 的。工具使用并没有沿着大型既定网络传播。相反，工具使用者会主动选择与使用相同工具的其他个体建立联系。\n\n* * *\n\n无论是 Wytham\
  \ Woods 的大山雀、缅因州的座头鲸、Shark Bay 的瓶鼻海豚，还是乌干达 Budongo 森林的黑猩猩，文化传播都在社交网络动态中发挥作用。但正如动物行为学家和疾病生态学家所了解的那样，允许信息——包括文化传播的信息——沿着社交网络流动的相互联系，也允许微生物——有些对宿主有益，有些寄生——从一个网络成员传到另一个网络成员。在下一章中，我们将探讨这是如何发生的，以及动物社交网络同时被欢迎和不欢迎的客人所导航的影响。\n\
  \n# 10. 健康网络\n\n我们每个人本身就是一个动物园——一个封闭在单一身体内的群落。一个多物种集合体。一个完整的世界。——Ed Yong，《I Contain\
  \ Multitudes》2016\n\n动物行为学家，通常与遗传学家和流行病学家合作，已采取两种不同的方法来研究动物社交网络如何充当微生物从宿主到宿主导航的高速公路。一种方法是关注特定的微生物并检查它如何在一个网络中导航，以及这对被从下方接入网络的动物网络动态意味着什么。另一种不同的方法使用复杂的分子遗传技术，对宿主的微生物组进行尽可能多的序列——所有称该宿主为家，或至少是临时住所的微生物物种——然后探索动物社交网络与其搭便车穿过这些社交网络的微生物组成员之间的关系。Elizabeth\
  \ Archie 及其同事采用了后一种方法来研究撒哈拉以南狒狒 *Papio cynocephalus* 的社交网络，这些狒狒是 Amboseli 狒狒研究项目\
  \ ABRP 的一部分。\n\nABRP 野外研究地点位于 Amboseli 国家公园西南角。在 Archie 所描述的“巨大的天空”下，狒狒在这种短草、稀树草原栖息地中行走，该栖息地大部分是平坦而尘土飞扬的，而且是咸的。这里那里偶尔有一些金合欢树和发烧树。邻国坦桑尼亚的乞力马扎罗山，距离仅约\
  \ 50 公里南方，主宰着地平线。当狒狒或人类穿越 ABRP 区域时，他们可能会看到一群大象、一群狮子、一群鬣狗、各种羚羊物种，也许还有一些斑马。如果他们抬头看，他们可能会看到美丽的椋鸟、环颈鸽或铁匠鸻飞过。\n\
  \nABRP 的诞生始于 1963 年，当时动物行为学家 Jeanne Altmann 和 Stuart Altmann 在东非寻找研究狒狒的完美地点时。当他们参观马赛\
  \ Amboseli 国家保护区——今天的 Amboseli 国家公园——时，他们知道自己找到了想要的东西。在那里研究狒狒十三个月后，他们开始规划一个更长期的项目。他们于\
  \ 1960 年代末返回，出版了 *Baboon Ecology: African Field Research*，现被认为是灵长类学界的经典之作，并在 1971\
  \ 年与芝加哥大学的一个团队一起启动了 Amboseli 狒狒研究项目。在五十多年项目的过程中，ABRP 汇集了关于约 1,300 只狒狒的无与伦比的数据汇编。\n\
  \nArchie 在 Amboseli 国家公园做了关于大象的博士工作，当 Susan Alberts——当时已是 ABRP 的主任之一——提供了一个博士后职位来帮助管理\
  \ ABRP 时，她欣然接受。她通过社交网络工具研究 Amboseli 狒狒微生物组的道路与她最初来到狒狒身边的道路一样曲折。在成为教授之前，她在另一个博士后职位上，她曾在史密森尼国家动物园度过一段时间。在那里，她有机会与许多研究疾病生态学的人互动。在此之前，她并没有太多考虑传染病和社会行为，但基于这些互动，她开始将动物社交网络视为追踪微生物传播的地图。\n\
  \n\n\n\n\n当时，Archie 主要在思考病原体，最终在蒙大拿州的国家野牛保护区开展了关于麋鹿和野牛的疾病生态学研究，“从麋鹿、野牛和大角羊身上捡拾粪便，然后从中提取寄生虫”以研究寄生虫如何在宿主间传播。不久她开始觉得自己只看到了微生物这一枚硬币的一面，那一面全是导致疾病的微生物，但她知道，微生物群也包含对宿主有益的微生物。Archie\
  \ 认为她可以将自己对社会行为和社会网络的兴趣与遗传技术结合起来，研究一个完整的微生物群落，其中既有有益的也有有害的。而安博塞里的狒狒——在那里梳理毛发网络是日常生活的一部分，而且有充足的粪便可供微生物组分析——非常适合开展这项研究。\n\
  \n当 Archie 到达 ABRP 基地营地时，通常每年进行三次每次数周的驻扎，她立刻就置身于朋友之中，这些朋友几乎全是肯尼亚人。“我们的[肯尼亚]数据采集员，”她笑着说，“已经跟了我们几十年了。”无论\
  \ Archie 和她的同事是否在营地，数据采集员都成对工作，由司机带到狒狒群附近，对部队进行普查并收集有关狒狒的一切信息。\n\n营地占地约一公顷，四周环绕着太阳能供电的电围栏，“因为如果你离开营地，”Archie\
  \ 说，“那里有狮子、大象、水牛之类的东西，你可能会撞上去然后被杀死。”该地区周围还有许多营地，每个营地都有自己的太阳能围栏，但那些围栏经常损坏：动物，包括大象，\
  \ constantly 在寻找战利品并测试围栏，看看是否可能突破。\n\nArchie 大约在凌晨 5 点起床，猛灌一杯咖啡，吃点早餐，然后帮助人们把车装好，装上无线电天线、笔记本（最近还加上电子平板）用于收集数据，然后就出发了。从营地到\
  \ Archie 所称的“狒狒之地”的车程大约需要四十五分钟。狒狒之地的每只狒狒都有自己的故事可讲。Flank 是 Archie 最喜欢的动物之一：“她就像狒狒界的《天鹅绒兔》……毛色斑驳，毛发到处乱翘，还有秃斑。”\n\
  \n每个部队都有自己偏好的睡觉栖息地，所以 Archie 和她的团队通常可以猜到部队在哪里，但偶尔它们会让她惊讶，睡在新的地方。无所谓，因为在 ABRP 跟踪的五个部队中，每只部队都有几只个体佩戴着无线电发射器的项圈，所以一旦\
  \ Archie 和她的团队到达狒狒之地，他们就会拿出无线电天线来确定那天早上各群体的确切位置。\n\n一旦找到一个部队，Archie 和她随行的两位助手之一就会下车接近狒狒：在好日子里，他们可以从约\
  \ 5 米远的地方观察部队成员。然后他们拿着望远镜和笔记本或平板电脑坐下来，收集数据。他们认识部队里的每只狒狒，在最初一个小时左右，他们只是对群体进行普查。然后他们开始轮流观察群体，观察一只狒狒十分钟，另一只狒狒十分钟，依此类推。在此过程中，他们始终留意是否有机会\
  \ swoop in 从一只慷慨捐赠粪便样本用于微生物组分析的狒狒那里抓取粪便样本。当这些小瓶最终运回美国时，会从每份样本中提取 DNA，并进行一种称为枪击分析的大型分子遗传学检测，以尽可能多地鉴定样本中的微生物物种。\n\
  \n对于微生物组/社会网络研究，Archie 从两个名为 Mica’s group 和 Viola’s group 的部队中收集了个体的资料，这两个部队的活动范围相互毗邻。在这两个群体的所有狒狒中，粪便样本中共鉴定出\
  \ 925 种微生物（细菌和古菌）物种。预测狒狒微生物组含有什么的最强单一因素是它是否属于 Mica’s 或 Viola’s 部队。\n\n这表明微生物可能沿着\
  \ Mica’s 部队和 Viola’s 部队的某种社会网络移动，但群体成员资格可能因多种与网络无关的原因而导致微生物组相似。群体成员共享相同的饮水点和食物来源，因此\
  \ Mica’s 和 Viola’s 部队之间的饮食差异可能解释了微生物组的差异。鉴于这两个群体生活在相邻的活动范围内，这似乎不太可能，但 Archie 和她的团队还是进行了核实，发现两个群体的饮食非常相似。所以不是这样。另一种可能性是，由于遗传亲属通常具有相似的微生物组，而狒狒群体是基于血缘的，因此亲缘关系解释了他们的发现。事实并非如此。群体在性别比例或年龄结构上也存在差异，每一种都可能在原则上导致群体内部的微生物组相似。\n\
  \n所有这些都强烈表明，狒狒群体内的社会网络可能有助于解释群体间的微生物组差异以及群体内的微生物组同质性。Archie 和 ABRP 其他人收集的有关梳理毛发网络的所有数据非常适合回答这个问题。Archie\
  \ 及其同事发现，在 Mica’s 和 Viola’s 两个群体中，在梳理网络中联系更紧密的梳理伙伴，其微生物组更相似。\n\n但这到底是如何运作的？从微生物的角度来看，是狒狒梳理网络的什么特性使它们能够利用这些网络跳到新的宿主？Archie\
  \ 认为这可能是因为同性梳理涉及大量手口接触，而在性活跃的雄性和雌性之间梳理时，肛生殖区域的接触也相当多，使得粪口传播成为可能。这种宿主之间的亲密接触对于在宿主体外充满氧气的环境中无法长期存活的厌氧微生物可能尤其重要。事实上，当\
  \ Archie 查看那些与梳理网络联系最紧密的狒狒肠道中的微生物时，她发现无法在氧气中长期存活的物种比随机预期更常见。\n\n微生物，特别是那些在狒狒肠道外生存状况不佳的微生物，显然正在利用猴子的梳理网络从一个宿主移动到另一个宿主。Archie\
  \ 和她的团队现在真的很想知道这 925 种微生物中有多少比例对安博塞里的狒狒是有害的，多少是有益的。问题是，虽然他们使用的基因枪击方法在鉴定存在物方面很棒，但仅凭它们本身并不能告诉你微生物如何影响其宿主。为此，这些微生物基因组需要与功能已确定的关键基因的其它微生物基因组进行比较，以便推断它们可能对狒狒是有益还是有害。\n\
  \n虽然微生物学家和进化生物学家需要在微生物基因功能方面做更多工作才能形成完整图景，但 Archie 和她的团队确实发现了有益和有害微生物都沿着狒狒梳理网络传播的一些证据。例如，一种微生物\
  \ *Campylobacter ureolyticus*，它会导致胃肠道问题，存在于狒狒微生物组中，并沿着梳理网络从一只狒狒传播到另一只狒狒（也许还有其他方式）。另一方面，狒狒微生物群落中的一些成员在人类中已知具有益生菌作用，因此也许在狒狒中，它们通过抑制病原体并帮助产生维生素发挥作用。微生物世界的善与恶都沿着狒狒的梳理网络传播。\n\
  \n* * *\n\n\n\n\n\n## 马达加斯加 Verreaux 长臂猿微生物组研究\n\n### 研究地点与背景\n\n在安博塞利东南约 1,600\
  \ 公里处，在被称为马达加斯加这一进化奇境的海岸线上，行为生态学家 Amanda Perofsky 在基林迪·米特亚国家公园对一种名为 Verreaux 长臂猿\
  \ (*Propithecus verreauxi*) 的狐猴的社会网络和微生物组进行了类似的研究。\n\n基林迪·米特亚国家公园位于马达加斯加西南部萨卡拉瓦王国，靠近莫桑比克海峡，面积达\
  \ 6,000 平方公里。作为联合国教科文组织生物圈保护区，该公园是沙漠、干旱多刺森林和沿海红树林生态系统的独特混合体，是八到十种——取决于你咨询哪位分类学家——长臂猿的栖息地，其中包括\
  \ Perofsky 研究的濒危 Verreaux 长臂猿。2006 年，生物人类学家 Rebecca Lewis 开始在基林迪研究 Verreaux 长臂猿的生态、行为、遗传和健康，并在同年于公园的干旱森林区域建立了\
  \ Ankoatsifaka 研究站，以促进该研究。该站配备了一个靠太阳能运行的简易厨房，为像 Perofsky 这样的访问研究人员提供帐篷，并为全职的马达加斯加工作人员提供几间平房，他们负责维持站点的运转。该工作人员包括\
  \ Andriamampiandrisoa Maximain 和 Nihagnandrainy Francisco，他们的工作不仅仅是维护站点——他们在收集长臂猿觅食和社会互动数据方面发挥着不可或缺的作用。\n\
  \n### 研究重点与动机\n\n研究疾病生态学一直是 Perofsky 的热情所在，自她在佐治亚大学本科时修读相关课程以来便如此。随着时间的推移，她联系上了德克萨斯大学奥斯汀分校的长臂猿研究团队，该团队由\
  \ Lewis 领导，Lewis 与计算生物学家 Lauren Meyers 一起担任她的博士主要导师。最初的计划是 Perofsky 研究长臂猿的疾病生态学，但由于野外地点偏远带来的后勤原因，她的研究重点转向了长臂猿微生物组及其与社会网络动态的联系。\n\
  \n当 Perofsky 到达基林迪时，Verreaux 长臂猿以其白色的毛体和斑驳的白黑面部在树与树之间跳跃，而在地面上时，则似乎以一种不寻常而惊人的运动方式——垂直攀附和跳跃——在四处弹跳。尽管观看起来很美妙，Perofsky\
  \ 来这里是为了研究它们的微生物组，然后将其与长臂猿团队其他成员收集的行为工作联系起来。\n\n### 长臂猿生物学与微生物传播\n\n长臂猿体重仅 3–4 公斤，它们会互相梳理毛发，就像狒狒一样，这通常涉及肛生殖区域的接触。雄性和雌性都会通过用肛生殖区域摩擦树木来标记领地。个体经常会在群体中其他个体的标记上再次标记，这与肛生殖梳理相结合，促进了群体内部的微生物传播。还有长臂猿的饮食。长臂猿是叶食动物，主要从叶子中获取营养，它们的肠道专门用于分解这些叶子，利用微生物组中的细菌帮助发酵过程。\n\
  \n### 野外采样方法\n\nPerofsky 及其同事对生活在七个群体中的四十七只长臂猿进行了数据收集，这些群体的规模从四只到九只狐猴不等。其他人，主要是\
  \ Lewis 和研究站的马达加斯加团队，收集了梳理、气味标记、进食和支配行为的数据。为了弄清长臂猿微生物组的居民是谁，Perofsky 和项目上的马达加斯加助理\
  \ Elvis Rakatomalala 所做的是所有野外微生物组研究者都会做的事情：他们在长臂猿“好心”提供后立即收集粪便样本。这项工作并不容易，如果 Lewis\
  \ 和长臂猿团队多年前没有在站点附近的茂密、多刺的森林中开辟出一系列标记小径，这将几乎是不可能的。\n\nPerofsky 每天早早起床，以便她和 Rakatomalala\
  \ 能在当早到达他们关注的群体。所有狐猴都有用于个体识别的项圈，群体中的一只雌性项圈上装有无线电发射器，因此 Perofsky 知道该群体的睡眠树的具体位置。她需要在长臂猿醒来之前到达那里，以便在第一时间收集它们当天的第一次粪便排泄，因为一旦狐猴开始向各个方向移动，就很难同时追踪所有群体成员。Perofsky\
  \ 和 Rakatomalala 收集的样本最终会被转移回德克萨斯大学奥斯汀分校，在那里它们被冷冻，直到其中的所有遗传物质被测序。\n\n### 后勤与出口挑战\n\
  \nPerofsky 在 Ankoatsifaka 研究站进行了两次为期数月的停留，每次返回时，将这些关键的粪便样本运出国都证明极具挑战性。一方面，她必须办理出口许可，但为此她需要手机信号，而信号只能说勉强可用。“有人把一根绳子扔过一根非常高的树枝，并在上面系了一个小袋子，”Perofsky\
  \ 回忆道。“你把手机放进袋子里，拉动绳子，这样就能把手机升到空中以接收信息，然后再拉下来阅读。”但她也需要发送信息。为此，她会从野外站步行约 1.5 公里，那里站里的人把一架梯子绑在一棵树上。Perofsky\
  \ 会爬上去挥动手机，希望能收到信号发送信息。即使在电话最终帮助获得出口许可后，机场的海关官员也始终无法完全理解为什么有人要把两个装满保存粪便的大箱子带出国，这又为回家的旅程增添了一层压力。\n\
  \n### 微生物组组成与社会网络的发现\n\nPerofsky 发现，长臂猿微生物组主要栖息着此前未被记录的微生物：未被记录主要是因为人们对狐猴知之甚少，而狐猴与人类、黑猩猩和狒狒关系较远，而大多数微生物组数据正是来自这些动物。话虽如此，在长臂猿微生物组中最常发现的两个微生物群在其他灵长类动物中已被研究，并已知能维持胃肠道健康、增强免疫系统并抵御感染。\n\
  \n正如安博塞利的狒狒一样，Perofsky 及其团队发现群体成员身份对长臂猿微生物组相似性有强大影响。同一个群体的成员比不同群体的成员更可能具有相似的微生物组。当\
  \ Perofsky 及其同事观察群体内部的情况时，群体内的梳理网络与网络成员之间微生物组相似性之间存在一种清晰的关系。并非群体中每只长臂猿都会梳理另一只，但任选群体中的两只狐猴，从一个到另一个在梳理网络中的链接数越少，它们的微生物组就越相似。换句话说，如果长臂猿\
  \ 1 梳理长臂猿 2，它们具有相对相似的微生物组。但朋友的朋友也很重要。如果长臂猿 1 没有梳理长臂猿 2，但梳理了梳理长臂猿 2 的长臂猿 3，那么长臂猿\
  \ 1 和 2 的微生物组相似，但不如互相梳理的亲密伙伴那样相似。\n\nPerofsky 及其团队在群体内部真正注意到的一个现象是，长臂猿在梳理网络中的中心性越高，气味标记的频率越高，该个体的微生物组多样性就越高。而微生物组多样性对健康很重要，正如其他灵长类动物研究所示，微生物组多样性高的个体往往特别健康：在梳理网络中的中心性不仅维持社会纽带，还促进良好健康。\n\
  \n* * *\n\n\n\n\n\n## Woodchester Park 中的獾-牛结核分枝杆菌传播\n\n### 背景\n\n在伦敦西北约 160 公里处的\
  \ Woodchester Park，关于社会网络和微生物的研究并不是关于构成微生物组的各种物种；它关注的是一个非常具体的微生物，因为那里的居民獾（*Meles\
  \ meles*）存在疾病问题。更糟糕的是，在公园牧场放牧的居民威尔士黑牛也存在疾病问题。而这正是同一个问题：一种令人讨厌的病原体 *Mycobacterium\
  \ bovis*，在牛中引起牛结核病，这是一种英国政府每年花费 1 亿英镑试图控制的疾病。\n\n牛对牛和獾对獾的 *M. bovis* 传播已被充分记录，而且有大量证据表明獾会将\
  \ *M. bovis* 传播给牛：獾和牛携带相同的 *M. bovis* 分子变异体，并且当獾种群居住在牛牧场附近时，牛结核病的爆发更有可能发生。更重要的是，捕杀獾种群会减少牛结核病的发生，但也会造成一些混乱，当獾试图逃离捕杀区时，逃脱的獾往往会导致附近牛群的牛结核病增加。\n\
  \n问题在于：獾和牛几乎从不相互互动。一项使用相机陷阱的研究发现，在超过 64,000 小时的录像中，牛和獾*从未*被看到在近距离出现。那么 *M. bovis*\
  \ 如何从獾传播到牛呢？动物行为学家 Matthew Silk 有一个想法。在他的博士后工作中，他和其他人，包括流行病学家，认为獾对牛的传播可能是间接的，通过獾的粪便坑进行的，这些粪便坑是共同的排泄和排尿坑，有时用来划分群体领地。为了检验这一想法，Silk\
  \ 使用了一种他参与开发的新型社会网络分析。被称为多层社会网络分析，它同时检查多个网络中的互动，Silk 认为这种方法可能有助于弄清獾的粪便坑是否充当连接獾社会网络和牛社会网络的枢纽。\n\
  \n### 研究系统与监测\n\n獾生活在 Woodchester Park 7 平方公里区域内的约二十多个群体中，并自 1976 年以来持续被监测，数十年来收集了超过\
  \ 3,000 个个体的资料。公园内的研究区域坐落在林木茂密的山谷中，点缀着威尔士黑牛放牧的牛牧场。獾会定期被捕捉（然后释放），并收集大小、感染状态、群体成员等信息。\n\
  \nSilk 绘制獾和牛社会网络的关键在于，四十二只獾和二十五头牛佩戴了与前面吸血蝙蝠网络中讨论的类似的接近传感器。在獾的情况下，Silk 需要确保这些接近传感器在工厂中已正确设置，以便当獾相距约一米时它们确实会相互通信，正如他购买时所要求的。这意味着需要进行一些相当不寻常的校准，即将接近传感器放在大型空盐水瓶上以模仿獾，然后躺在埃克塞特大学校园的草地上移动这些盐水瓶/伪獾，以查看它们何时真正开始相互通信。场面相当壮观。“我们有认为我们非常奇怪的人，”Silk\
  \ 笑着说，“也有非常好奇的人会走过来提问。”不过，正如 Silk 所解释的那样，没有人惹麻烦，“在高峰期……我们有五六个人在做这件事，我们躺在草地上移动这些瓶子，可能是一个令人望而生畏的群体。”\n\
  \n校准完成后，獾的接近传感器在两只獾相距半米到一米之间时会相互通信：牛的接近传感器在牛之间距离在 1.5–1.9 米内时会启动。獾和牛的接近传感器也会相互通信，以便可以记录物种间的任何直接接触，尽管根据其他人拍摄的\
  \ 64,000 小时视频，Silk 及其同事几乎没有理由认为会有太多这种情况。接触信息会被存储，并且可以从容纳接近传感器的项圈中下载，除非獾设法取下项圈，这偶尔会发生。研究不仅涉及两种物种的接近传感器，而且\
  \ Silk 及其同事还在十九个獾粪便坑处放置了基站。每个基站都充当粪便坑的一种巨型项圈，因为它与牛和獾上的接近传感器通信，因此研究人员知道哪只獾或哪头牛在哪个粪便坑附近以及何时。更重要的是，基站可用于利用獾和牛在它们之间的移动来构建粪便坑本身之间某种间接网络。\n\
  \n### 多层社会网络分析结果\n\n一旦从獾、牛的项圈以及粪便坑基站下载了所有数据，Silk 就使用多层社会网络分析来拼凑发生了什么。这种分析可能会变得非常复杂，特别是同时查看三个网络（獾、牛和粪便坑）时，但有若干发现浮出水面。\n\
  \n在每个獾群体形成的网络内，雌性獾与其他个体的连接更为紧密（以中心性分数衡量），而雄性则不然。獾是否感染 *M. bovis*，对任何网络指标都没有影响，这表明感染的獾与未感染的同类一样具有社会联系，这在獾群体内部的疾病传播方面不是好消息。接近传感器未检测到不同群体/网络之间獾的直接互动，但这些传感器也显示粪便坑网络间接连接了不同群体的獾，因此充当了\
  \ *M. bovis* 在獾网络*之间*传播的场所。\n\n与先前的工作一致，接近传感器记录到獾和牛之间没有一次直接互动：它们从未足够接近以使它们的接近传感器相互通信。但是，同样，粪便坑网络是关键，因为它促进了\
  \ *M. bovis* 在獾和牛之间的传播。一般来说，牛倾向于避开有獾粪便坑的区域，但如果牧场的质量足够好，它们仍会在那里放牧，即使存在粪便坑。Silk 及其同事发现，牧场中间的少数粪便坑被许多獾和牛访问，并在粪便坑网络中具有较高的中心性分数，充当间接枢纽，连接獾网络和牛网络，使\
  \ *M. bovis* 在物种间传播。\n\n### 相关社会网络疾病传播\n\n在 Woodchester Park 的地球另一侧，在塔斯马尼亚，危险的细胞也在沿着动物社会网络移动，这次是塔斯马尼亚恶魔（*Sarcophilus\
  \ harrisii*）的网络。但这些危险细胞既不是微生物，也不是外来细胞，而是癌症，它沿着塔斯马尼亚恶魔社会网络创造的生物高速公路传播，同时也对其产生巨大影响。\n\
  \n\n\n\n\n## 袋獾面部肿瘤疾病与可传播癌症\n\n大多数癌症无法在个体之间传播，但少数癌症，包括塔斯马尼亚袋獾面部肿瘤疾病（`DFTD`）和犬类可传播性生殖器肿瘤（`CTVT`），是规则的例外。`DFTD`\
  \ 是一种失控的袋獾细胞谱系，增殖迅速。它比 `CTVT` 危险得多，几乎总是导致袋獾在感染一年内死亡，因此，塔斯马尼亚许多袋獾种群急剧下降，`IUCN` 将塔斯马尼亚袋獾列为“濒危”。由于袋獾在塔斯马尼亚被视为某种国家象征，`DFTD`\
  \ 造成的破坏被视为保护紧急事件：塔斯马尼亚自然资源与环境部有一个名为拯救塔斯马尼亚袋獾的公众宣传项目，用以告知澳大利亚人这些动物的 precarious 状况。但要拯救袋獾不仅需要了解\
  \ `DFTD` 本身，还需要了解塔斯马尼亚袋獾的社会网络，因为癌症是在个体互相咬伤时传播的，通常在头部和面部。社会网络方面正是动物行为学家 David Hamilton\
  \ 涉入的故事。\n\n### David Hamilton 的研究背景\n\nHamilton 从爱丁堡大学毕业后，在澳大利亚西北部金伯利边境地区担任了几年野外助理，收集\
  \ Gouldian 雀 `Chloebia gouldiae` 的行为数据，这是一种外表惊艳的鸟，羽毛呈紫色、黄色、绿色、蓝色和白色。吸引 Hamilton\
  \ 加入雀类项目的因素之一是，在二十世纪的大部分时间里，Gouldian 雀种群一直在下降，这是人类导致栖息地丧失以及疾病的结果，Hamilton 认为将行为与疾病和保护生物学联系起来的项目很有趣。\n\
  \n随着他在 2015 年与雀类的时光接近尾声，Hamilton 对行为、疾病和保护生物学的兴趣逐渐成形，他申请了位于霍巴特的塔斯马尼亚大学的博士项目，与 Rodrigo\
  \ Hamede 合作。Hamede 曾对袋獾中的 `DFTD` 进行过研究，其中包括一项非常早期的社会网络分析，研究了袋獾之间的接触。Hamilton 的博士论文将在此早期研究的基础上扩展，使用新的社会网络工具并结合最先进的技术和长期行为数据集。\n\
  \n### 塔斯马尼亚袋獾的生物学与交配行为\n\n成年塔斯马尼亚袋獾体长约 60 厘米，重约 13 公斤，是现存最大的有袋类食肉动物之一，也是任何哺乳动物中最有力的颌部之一。袋獾主要在夜间活动，白天倾向于待在空心原木中。大部分时间它们相当孤僻，但在交配季节，雄性会守护配偶以防被竞争对手夺走。而且它们几乎什么都不做：“袋獾有这种疯狂的交配系统，”Hamilton\
  \ 说，“在那段时期它们除了交配什么都不做。它们几乎不吃东西；完全不照顾自己。”\n\n守护配偶涉及雄性对竞争对手表现出各种攻击性行为。展示有时会升级为全面冲突，包括危险的咬伤，如果咬人一方感染，则可能传播\
  \ `DFTD`，这在一定程度上解释了为什么 `DFTD` 在雄性中更为常见。交配系统也帮助解释了另一个表面上令人困惑的现象，即感染 `DFTD` 的雌性实际上是在感染前最健康的个体。在大多数情况下，状况不佳的动物最容易感染。但由于最健康的雌性袋獾是最值得作为配偶守护的，因此被守护且此前健康的雌性最有可能在求偶配偶守护期间被雄性咬伤，从而在交配季节可能被感染。\n\
  \n### 社会网络与肿瘤进展的研究设计\n\nHamilton 关注的是：`DFTD`，尤其是 `DFTD` 肿瘤的进展，如何影响袋獾的社会网络？他从先前的工作中得知，随着肿瘤增大，袋獾的状况会变弱，其竞争食物和其他资源的能力受损。所有这些如何影响社会网络动态？要回答这些问题，他需要观察一个种群，该种群拥有足够数量的健康和患病个体以进行合法比较。那个袋獾种群约有二十多只成年个体，栖息在塔斯马尼亚西北部的史密斯顿附近，距离塔斯马尼亚大学西北方向约八小时车程。\n\
  \nHamilton 和他的同事租用了一家当地教堂拥有的露营地，开始了为期六个月的关于 `DFTD` 进展和社会网络在袋獾中研究的项目。史密斯顿种群的所有成年袋獾都已佩戴了接近传感器项圈。对于袋獾来说，这些“会说话”的项圈在两只袋獾距离\
  \ 30 厘米以内时会打开——足够近以至于打斗和咬伤是真实可能的。为了获取项圈上记录的数据，Hamilton 需要定期捕获袋獾并从项圈下载数据，以基于接近度构建社会网络。但捕获袋獾不仅仅是为了数据下载：它还允许\
  \ Hamilton 评估感染个体肿瘤的进展。\n\n大约每月两周，每晚 Hamilton 放置四十个陷阱——带门的 PVC 管，当袋獾进入获取美味羊肉诱饵时门会关闭。目标是每月捕获每只成年个体，Hamilton\
  \ 非常成功。“袋獾有一种声名狼藉的形象，横行塔斯马尼亚丛林，”Hamilton 微笑着说。“它们实际上非常、非常胆怯，相当害羞的动物。”但那些颌骨危险到足以让他格外小心地将袋獾从陷阱中取出并装入袋中，只要袋獾被蒙住眼睛，并且\
  \ Hamilton *非常* 确保这一点——它就会暂时瘫软。然后他检查动物是否有咬痕，并检查其面部、头部和口腔内部是否有 `DFTD` 肿瘤的存在，并测量任何存在肿瘤的大小。\n\
  \n### 研究结果\n\nHamilton 的研究持续了六个月。研究开始时，已知有三只袋獾感染了 `DFTD`，另有七只在六个月期间发展出 `DFTD`，十二只袋獾在整个六个月中保持\
  \ `DFTD` 无感染。Hamilton 的捕获-释放系统允许追踪 `DFTD` 肿瘤的进展，并利用从“会说话”项圈下载的数据，他在交配季节和非交配季节都基于接近度构建了社会网络。\n\
  \n“会说话”的项圈共启动了 8,504 次，Hamilton 发现网络密度——袋獾之间观察到的连接数与可能的连接数之比——在交配季节要大得多，当时雄性 tenaciously\
  \ 守护雌性。Hamilton 还发现，感染袋獾中 `DFTD` 的进展影响了社会网络动态。他将肿瘤大小分为四个类别，从小到大，对于从一个类别上升到下一个类别的每一次移动，袋獾与其他个体形成连接的可能性大约降低\
  \ 15%。\n\n\n\n\n\n除了稍后我们会回到的短暂时期外，感染 DFTD 的袋獾在网络中的互动性远低于未感染个体。患有 DFTD 的袋獾不仅联系更少，而且成为网络枢纽的可能性也低于未感染\
  \ DFTD 的动物。造成这种情况至少有两种可能：感染的袋獾可能在寻求与他人减少互动，或者网络中的其他个体可能在主动回避感染的袋獾。排斥在原则上是可能的，因为感染个体的面部和头部上的\
  \ DFTD 肿瘤很明显，而且 DFTD 感染很可能改变了袋獾产生的嗅觉线索，使得谁感染谁未感染变得更加明显。然而，两条证据表明袋獾并未主动回避感染的网络成员。一方面，当其中一方感染\
  \ DFTD 并出现症状时，长期配对互动并不会改变。另一方面，如果排斥行为确实发生，那么 Hamilton 应该会在网络中检测到派系，其中一些由感染个体组成，其他则由未感染个体组成，但在他的网络分析中并未发现此类派系。也就是说，在大多数情况下，患有\
  \ DFTD 的袋獾倾向于在网络中回避他人，无论是在非交配季节还是在交配季节的大部分时间。但并非整个交配季节。\n\n随着交配季节的推进，DFTD 与未感染 DFTD\
  \ 个体在关联数量和中介中心性（网络中多少条最短路径连接个体对）方面的差异减小。起初，Hamilton 对此感到困惑。为什么 DFTD 感染个体会在这段时间内变得更深地嵌入网络？然后他意识到，因为袋獾在交配季节是他所说的能量上“全力以赴”的，所以更健康、未感染\
  \ DFTD 的个体，最有可能在早期进行交配和护偶，会在交配季节后期被耗尽。这就为 DFTD 感染个体提供了至少一点机会来获得交配机会，从而使其在网络中嵌入得更深。\n\
  \n最终 DFTD 会杀死感染的袋獾，但在这一过程中，它扰乱了袋獾的社会生活，沿着袋獾的社会网络传播一种可传染的癌症，并在传播过程中改变了网络动态。\n\n*\
  \ * *\n\n在地面、空中和水中，动物都嵌入在社会网络中。从塔斯马尼亚偏远角落的袋獾、马达加斯加的狐猴，到落基山脉的黄腹旱獭和瑞士的家鼠，社会网络影响着动物社会性的几乎每一个方面。\n\
  \n这是一个奇妙、复杂的网络世界。\n\n# 彩图\n\n![After Hurricane Maria, rhesus macaques on the island\
