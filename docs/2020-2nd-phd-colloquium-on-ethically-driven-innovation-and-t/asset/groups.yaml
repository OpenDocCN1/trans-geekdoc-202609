    spatial correlation


    A cognitive radio scenario consisting of a primary user (PU) and M SUs is the
    test statistic for classification of the sensed primary signal x(n)at the time
    n, it can be formed as


    ```

    y_i(n) = f_i(n)g_i x(n) + w_i(n)  \quad for i = 1\n                                     (1)

    ```


    where, h_ji is that the channel is occupied and h_ji is that channel is for available.
    The fading gain of the channel is presented as f_i(n) and the noise w_i(n) given
    in [5]. The spatial correlation factor is incorporated in g_i(n). In our analysis,
    the coefficient f_i(n) is assumed to follow either Rayleigh or Nakagami-distribution.
    Here, w_i(n) is the white noise. The received signal samples are normalized as
    a part of data pre-processing


    # II. SYSTEM MODEL


    # A. Deep learning architecture


    Since the system model under considerations spatial correlation, CNN can be used
    for our problem to handle the. The number of layers and size of the filters were
    chosen by random to provide better accuracy of classification.


    The CNN architecture for classifying the sensed users is very simple (fig). The
    first layer is the input convolutional layer with ReLU (linear rectified unit)
    activation, which is then followed by max-pooling layers acting on the map to
    help extract the features. ReLU is one of the non-linear activation function.
    Max-pooling layers help in compressing the feature map after application of ReLU.
    The output of size 128 is then fed to a fully connected layer by sigmoid activation.
    The final output layer with softmax activation gives the classification on the
    status of the primary user''s channel. The optimizer is Adam and the loss function
    for optimization is cross-entropy.'
