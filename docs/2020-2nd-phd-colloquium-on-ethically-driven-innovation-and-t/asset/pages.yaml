    **Abstract—the performance of spectrum sensing** has available limitations under
    extreme conditions. With the advent of deep learning results, this paper is an
    attempt to analyze the performance of cooperative spectrum sensing (CSS) where
    deep learning is adopted. We focus on convolutional neural network (CNN) based
    CSS under dynamic channel condition. The system is tested among among secondary
    users, path with temporal shadowing and fading conditions Rayleigh and Nakagami.
    The performance is compared with the hard fusion rules – OR, Majority, in accuracy
    of classification.


    among SUs, log-normal path and two different conditions – Rayleigh and Nakagami.


    The content of the paper follows the discourse below. Under II, the system model
    of the cognitive radio scenario is presented. In III, we discuss the data and
    CNN architecture. Section IV is meant for performance of CNN based soft-fusion
    CSS. In section V, we conclude results are reported.


    **Cooperative spectrum sensing, convolutional neural network, fading.**


    # I. INTRODUCTION


    The expansion of telecommunication industry is driven by various factors which
    the radio spectrum is of importance. To reach the wide range of users, spectrum
    sensing offers a promising solution by harnessing the scarce spectrum resources.
    However, CSS is a viable method when operating under fading and shadowing radio
    environments. In a set of secondary users (SUs) cooperate by sharing their sensed
    data or decision the decision making fusion center. One is referred to


    There is significant amount of analysis existing in the literature on CSS. But
    potential/sub-optimal machine learning/deep learning methods (ML) for CSS was
    used [1]. This work is for the scenario where secondary user (SU) support machine
    learning based classification. In deep deep learning based CNN was used. Dynamic
    channel conditions like multi-fading, shadowing and fading were considered and
    decision methods were used. In [1][2] ML/DL is used to make the decision algorithm
    and the data fusion method. We used Application of k-means clustering algorithm,
    for CSS in generalized fading channel has been proposed to improve in comparison
    to OR-rule. Two-phase SVM (support vector machine) based CSS is proposed in [4]
    to train the test set in models.


    This work is extension of our work carried out previously [5]. The primary focus
    of this paper is that we give a comparative performance of CNN based CSS with
    respect to the well-known decision fusion rules for CSS. The channel characterizes
    spatial correlation


    A cognitive radio scenario consisting of a primary user (PU) and M SUs is the
    test statistic for classification of the sensed primary signal x(n)at the time
    n, it can be formed as


    ```

    y_i(n) = f_i(n)g_i x(n) + w_i(n)  \quad for i = 1\n                                     (1)

    ```


    where, h_ji is that the channel is occupied and h_ji is that channel is for available.
    The fading gain of the channel is presented as f_i(n) and the noise w_i(n) given
    in [5]. The spatial correlation factor is incorporated in g_i(n). In our analysis,
    the coefficient f_i(n) is assumed to follow either Rayleigh or Nakagami-distribution.
    Here, w_i(n) is the white noise. The received signal samples are normalized as
    a part of data pre-processing


    # II. SYSTEM MODEL


    # A. Deep learning architecture


    Since the system model under considerations spatial correlation, CNN can be used
    for our problem to handle the. The number of layers and size of the filters were
    chosen by random to provide better accuracy of classification.


    The CNN architecture for classifying the sensed users is very simple (fig). The
    first layer is the input convolutional layer with ReLU (linear rectified unit)
    activation, which is then followed by max-pooling layers acting on the map to
    help extract the features. ReLU is one of the non-linear activation function.
    Max-pooling layers help in compressing the feature map after application of ReLU.
    The output of size 128 is then fed to a fully connected layer by sigmoid activation.
    The final output layer with softmax activation gives the classification on the
    status of the primary user''s channel. The optimizer is Adam and the loss function
    for optimization is cross-entropy.'
