    # History of the Intel i8087 and IEEE 754 Standard


    Everyone wondered how IBM could enter the personal computing market; it certainly
    did not fit their traditional sales model. IBM did something unprecedented in
    its history: It outsourced both the processor design (Intel) and the creation
    of an operating system (Microsoft). Work began in the late 1970s to create what
    would become the IBM PC.


    In 1976 an Intel engineer, John Palmer, proposed that the `i8086` and `i8088`
    could have a coprocessor, one designed specifically to perform floating-point
    operations, to make the IBM PC more suitable for workstation-style technical computing.


    Intel executives expressed strong skepticism that there was a viable market for
    such a chip, but Palmer was so convinced that he said if he were paid one dollar
    for every such chip sold, he would forgo his salary. The project was finally given
    the green light in 1977, and Palmer frequently told me he wished they had taken
    his offer because it would have made him a very wealthy man.


    The IBM PC was designed with an empty socket for an optional `i8087` right next
    to its main processor, the `i8088`. Microsoft''s Bill Gates expressed his opinion
    to Intel, “You''re not going to fill many of those sockets.” But the `i8087` floating-point
    coprocessor sold many millions of copies for $150 each, continued selling for
    years (unlike most chips), and held its price instead of having to drop in price
    with Moore''s law (also unlike most chips).


    Berkeley professor William “Velvel” Kahan had given a guest lecture at Stanford
    ten years earlier, about the outrageously bad results possible in the floating-point
    arithmetic of some computer makers. It made an impression on Palmer, who heard
    the lecture as a student. Palmer hired Kahan as a consultant for the `i8087` project.


    ![William “Velvel” Kahan, ca. 1980](images/pg85_1.jpg)

    *William “Velvel” Kahan, ca. 1980*


    Kahan (rhymes with “John”; the “h” is silent) had consulted for Hewlett-Packard
    on the algorithms for their scientific handheld calculators that used decimal
    scientific notation with ten decimals of accuracy, and an exponent that ranged
    from `10^(−99)` to `10^(99)`. Decimal arithmetic is the right choice for calculators
    because it eliminates the problem of rounding error when converting numbers from
    decimal (the Human Layer) to binary (the Compute Layer), and although it runs
    slower, speed is not an issue with handheld calculators.


    In his consulting role, Kahan immediately and adamantly set down three ground
    rules for the number format:


    * It would use a decimal scientific notation, not binary.

    * All operations and functions would be reproducible across computer systems.

    * The higher-precision version of the `64-bit` format would be `128-bit` wide.


    He lost all three arguments. Ravenel and Palmer said they were already too far
    down the design path to make design changes. The `64-bit` format would be binary,
    with a `sign bit`, `biased exponent`, and a `fraction` with a `hidden bit` that
    is always `1` just left of the `radix point`. The higher-precision version of
    the format would be `80-bit` wide, and all calculations would covertly be done
    with that `80-bit` “`extended double`” precision. That way, Intel could claim
    that any differences between their `64-bit` computations and that of other vendors
    was because Intel''s were `better`, and this would be a selling point. So, irreproducibility
    and unportability were a key part of Intel''s strategy.


    As Intel''s consultant, Intel tasked Kahan not with making design choices but
    instead with becoming their paid advocate for every design choice that Palmer
    and the chip designers had made. Kahan was stubborn and not given to compromise,
    and the discussions were exasperating to Palmer, but Palmer eventually prevailed.


    Palmer and Kahan published the `i8087` design choices as a proposed “standard”
    way to do floating-point in 1979, and announced the `i8087` chip in April 1980.
    Because of Kahan''s reputation as an expert in computer arithmetic, everyone incorrectly
    assumed he was the architect of the design.


    ![The Intel i8087 floating-point coprocessor chip](images/pg87_1.jpg)

    *The Intel i8087 floating-point coprocessor chip*


    Motorola began designing its own floating-point coprocessor chip, the `Motorola
    68881`, to follow that proposed standard. But computer companies like IBM, Digital
    Equipment Corporation, and others saw the proposal as a threat and asked IEEE
    to form a Standards Committee so they could have input into the proposed standard
    and level the playing field. That was the origin of what we now call `IEEE 754`
    (the official name is `IEEE Std 754™`).


    ## 4.7.3 The Two Kahans


    It is an interesting exercise to go through Kahan''s writings and his (unrefereed)
    web postings to classify his position statements into two categories that are
    perfect opposites. They are:


    * Anything less than perfection in computer arithmetic is not to be tolerated.

    * Perfection is an impractical goal; speed and low cost are more important.


    To pick a few from the first category in his writings:


    > “Almost all True is altogether a Lie.”

    >

    > “Every violation of Mathematics is always punished sooner or later. (The punishment
    does not always befall the perpetrator.)”

    >

    > “This is no place to list all the corrections `Excel` needs. It was cited here
    only to exemplify Errors Designed Not To Be Found.”

    >

    > “Routine use of far more precision than deemed necessary by clever but numerically
    naive programmers, provided it does not run too slowly, is the best way available,
    with today''s mixture of popular programming languages with overtaxed underfunded
    education, to diminish the incidence of roundoff-induced anomalies below any level
    of commercial significance even if we knew about every anomaly.”


    And in the second category:


    > “A machine whose every function rounds correctly is impractical.”

    >

    > “Faster matrix multiplication is usually too valuable to forego for unneeded
    exact reproducibility.”

    >

    > “Rather than waste time testing every element for troubles that almost never
    happen, a program can run faster on average by testing one or two flags after
    the array has been computed and, if a flag was raised, recompute the array some
    better way.”

    >

    > “Consequently numerical anomalies go mostly unobserved or, if observed, routinely
    misdiagnosed. Fortunately, most of them don''t matter. Most computations don''t
    matter.”

    >

    > from `https://people.eecs.berkeley.edu/~wkahan/`


    By flipping between the two extremes, Kahan was able to defeat both those who
    criticized Palmer''s choices for being too-perfect as well as those who thought
    things could be made better (such as by making the math functions correctly rounded,
    as Kahan originally wanted). He was a very effective “hired gun.” His lengthy
    epistle mocking Microsoft `Excel` for using hidden extra precision to reduce rounding
    error in visible digits is followed, on the next page, by a touting of Intel''s
    use of `80-bit` hidden extra precision to reduce rounding error in visible digits.


    ## 4.7.4 The i8087 Design Becomes the IEEE Standard at Last


    ![kludge \[klo͞oj\] NOUN  A workaround or quick-and-dirty solution that is clumsy,
    inelegant, difficult to extend and hard to maintain.](images/pg88_1.jpg)


    `kludge` \[klo͞oj\] NOUN  A workaround or quick-and-dirty solution that is clumsy,
    inelegant, difficult to extend and hard to maintain.

    '
  trans: '


    # Intel i8087 与 IEEE 754 标准的历史


    大家都在猜测 IBM 如何能进入个人计算市场；这当然不符合他们传统的销售模式。IBM 在其历史上做了一件前所未有的事：它将处理器设计（Intel）和操作系统的创建（Microsoft）均外包出去。创建后来成为
    IBM PC 的工作始于 20 世纪 70 年代末。


    1976 年，Intel 工程师 John Palmer 提出 `i8086` 和 `i8088` 可以配备一个协处理器，该协处理器专门用于执行浮点运算，以使
    IBM PC 更适合工作站风格的技术计算。


    Intel 高管们强烈怀疑是否存在该芯片的可行市场，但 Palmer 深信不疑，甚至表示如果每卖出一片此类芯片就给他一美元，他愿意放弃薪水。该项目最终于 1977
    年获得批准，Palmer 经常对我说，他真希望他们当时接受了他的提议，因为那会让他成为一个非常富有的人。


    IBM PC 设计时在其主处理器 `i8088` 旁边预留了一个空插槽，用于可选的 `i8087`。Microsoft 的 Bill Gates 向 Intel
    表达了他的看法：“你们填不满那些插槽的多少。”但 `i8087` 浮点协处理器以每片 150 美元的价格售出了数百万片，持续销售了多年（不同于大多数芯片），并维持了其价格，而不必像大多数芯片那样遵循摩尔定律降价。


    十年前，伯克利教授 William “Velvel” Kahan 在斯坦福大学做过一次客座讲座，内容是关于某些计算机制造商的浮点运算可能产生的极其糟糕的结果。这给作为学生听讲的
    Palmer 留下了深刻印象。Palmer 聘请 Kahan 担任 `i8087` 项目的顾问。


    ![William “Velvel” Kahan, ca. 1980](img/pg85_1.jpg)

    *William “Velvel” Kahan, ca. 1980*


    Kahan（读音与 “John” 押韵；“h” 不发音）曾为惠普的科学手持计算器算法提供咨询，这些计算器使用十位精度的十进制科学计数法，指数范围从 `10^(−99)`
    到 `10⁹⁹`。十进制运算是计算器的正确选择，因为它消除了将数字从十进制（人类层）转换为二进制（计算层）时的舍入误差问题，虽然它运行较慢，但速度对于手持计算器来说不是问题。


    在咨询角色中，Kahan 立即且坚定地为数字格式制定了三条基本规则：


    * 将使用十进制科学计数法，而非二进制。

    * 所有运算和函数将在各计算机系统间可复现。

    * `64-bit` 格式的高精度版本将为 `128-bit` 宽。


    他输掉了所有三场辩论。Ravenel 和 Palmer 称他们在设计路径上已走得太远，无法进行设计变更。`64-bit` 格式将采用二进制，包含 `sign
    bit`（符号位）、`biased exponent`（移码指数）和一个带有 `hidden bit`（隐含位）的 `fraction`（尾数），该隐含位始终为
    `1`，紧邻 `radix point`（基点）左侧。该格式的高精度版本将为 `80-bit` 宽，且所有计算将隐秘地以该 `80-bit` “`extended
    double`”（扩展双精度）精度进行。这样，Intel 就可以声称，他们 `64-bit` 计算与其他厂商之间的任何差异，都是因为 Intel 的更 `better`（优秀），这将成为一个卖点。因此，不可复现性和不可移植性成为
    Intel 战略的关键部分。


    作为 Intel 的顾问，Intel 要求 Kahan 的任务不是做设计选择，而是成为 Palmer 和芯片设计师所做的每一个设计选择的付费辩护者。Kahan
    固执且不妥协，讨论让 Palmer 非常恼火，但 Palmer 最终占了上风。


    Palmer 和 Kahan 于 1979 年将 `i8087` 的设计选择作为一种提议的浮点运算“标准”方式发表，并于 1980 年 4 月宣布了 `i8087`
    芯片。由于 Kahan 作为计算机算术专家的声誉，大家错误地假设他是该设计的架构师。


    ![The Intel i8087 floating-point coprocessor chip](img/pg87_1.jpg)

    *The Intel i8087 floating-point coprocessor chip*


    Motorola 开始设计其自己的浮点协处理器芯片 `Motorola 68881`，以遵循该提议标准。但 IBM、Digital Equipment Corporation
    等计算机公司将该提议视为一种威胁，并请求 IEEE 成立一个标准委员会，以便他们能对提议标准提供意见并使竞争环境公平化。这就是我们现在所称的 `IEEE 754`（官方名称为
    `IEEE Std 754™`）的起源。


    ## 4.7.3 两个 Kahan


    通读 Kahan 的著作和他（未经同行评审的）网络帖子，将他的立场声明归类为两类完美的对立面，是一个有趣的练习。它们是：


    * 计算机算术中任何不完美之处都不容忍。

    * 完美是不切实际的目标；速度和低成本更重要。


    从他的著作中挑选第一类的几条：


    > “几乎全真，完全是谎。”

    >

    > “每一次对数学的违背，终将受到惩罚。（惩罚不总降临在肇事者头上。）”

    >

    > “这里不是列举 `Excel` 所需所有修正的地方。引用它仅是为了体现‘设计成不被发现的错误’。”

    >

    > “在聪明但数值计算天真的程序员认为不必要的情况下，常规使用远超所需的精度，只要速度不太慢，就是在当今流行编程语言与超负荷、资金不足的教育相混合的环境下，将舍入诱导异常的发生率降低到任何商业意义层面以下的最佳可用方法，即使我们知道每一个异常。”


    而在第二类中：


    > “一台每个功能都正确舍入的机器是不切实际的。”

    >

    > “更快的矩阵乘法通常太有价值了，不能为了不需要的精确可复现性而放弃。”

    >

    > “与其浪费时间测试每个元素那些几乎从不发生的麻烦，不如在数组计算完成后测试一两个标志位，如果标志位被置位，再用更好的方法重新计算数组，这样程序平均运行得更快。”

    >

    > “因此，数值异常大多未被观察到，或虽被观察到却常被误诊。幸运的是，它们大多无关紧要。大多数计算无关紧要。”

    >

    > from `https://people.eecs.berkeley.edu/~wkahan/`


    通过在两个极端之间反复横跳，Kahan 既击败了批评 Palmer 选择过于完美的人，也击败了认为事情可以做得更好的人（例如像 Kahan 最初想要的那样，使数学函数正确舍入）。他是一名非常有效的“雇佣枪手”。他冗长的檄文嘲笑
    Microsoft `Excel` 使用隐藏的额外精度来减少可见数字中的舍入误差，而在下一页，他又吹捧 Intel 使用 `80-bit` 隐藏额外精度来减少可见数字中的舍入误差。


    ## 4.7.4 i8087 设计最终成为 IEEE 标准


    ![kludge \[klo͞oj\] NOUN  A workaround or quick-and-dirty solution that is clumsy,
    inelegant, difficult to extend and hard to maintain.](images/pg88_1.jpg)


    `kludge` \[klo͞oj\] NOUN  一种变通方法或速成的粗糙解决方案，笨拙、不雅观、难以扩展且难以维护。


    '
