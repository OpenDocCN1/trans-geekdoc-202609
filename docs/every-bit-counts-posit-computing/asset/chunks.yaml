    ![为不连续而设计的函数，邻域规则不适用于这些函数](img/pg129_1.jpg)


    # 为不连续而设计的函数，邻域规则不适用于这些函数


    邻域规则不适用于这些函数；它们对于实数输入不应返回 `NaR`，因为在不连续点的行为是*明确定义的*。


    `next` 和 `prior` 函数也不在邻域论证的覆盖范围内，因为它们是*位模式*的函数，而非实数。因此，如果程序员真的想做一些像操纵 posit 位模式这样危险的事情，无法保证
    `NaR` 会正确传播。如果你将投影实数环上的 posits 想象一下，`next` 向逆时针方向移动一个位置，而 `prior` 向顺时针方向移动一个位置。因此，`next(NaR)`
    是 `-maxPos`，而 `prior(NaR)` 是 `maxPos`，位于 posit 环的顶部。


    这是在算术标准和语言标准之间划清界限的另一个例子。大多数语言要求将输入提升到最高精度输入的精度，以尽可能保留更多信息。然而，有人可能会争辩说这就像*给猪涂口红*；如果只有一个低精度输入，所有输入都应该*降级*到该低精度，因为低精度反正会传播到输出。Posit
    标准不站队，而只是规定所有 posit 输入必须具有相同的精度，无论该精度是什么，它就是输出的精度。


