    and 0, we insert $- \\frac{1}{4},$ by the second rule. And between ½ and 1, we
    insert ¾, by the last rule. Notice how this set of rules keeps the largest magnitude
    numbers the exact reciprocals of the smallest magnitude numbers.


    The “Flip to Reciprocate” part of the diagram is removed because it is not true
    when the number is not a power of 2. The reciprocal of ³⁄4 = 0.75 is ⁴⁄3= 1.33
    ⋯, but the mirror image in the ring is ³⁄2 = 1.5 instead. There is a way to fix
    that, but it can make the computer hardware more complicated, and that idea will
    be shown later.


    ## 1.5 The Regime


    ![Steel wool grades getting finer and shirt sizes getting larger resemble regime
    notation.](images/pg12_1.jpg)


    Steel wool grades getting finer and shirt sizes getting larger resemble *regime*
    notation.


    The *regime* of a posit is the bits that follow the sign bit that are identical,
    shown in **gold**, until they hit the opposite bit, shown in **brown**.


    For the four-bit posits, their meaning as an integer *r* is as follows (sign bit
    not shown):


    | regime || *r* |


    | --- | --- |


    | **000** || −∞ |


    | --- | --- |


    | **00****1** || −2 |


    | **0****1**. || −1 |


    | **1****0**. || 0 |


    | **11****0** || 1 |


    | **111** || 2 |


    The regime value *r* is determined by the number of identical bits in a row, *k*,
    before hitting an opposite bit, if it occurs in the stored bits. You see, all
    bits after the last bit in a posit are implied **0** bits. Just like when you
    say a number is 1.53, with no other information, you have to treat it as meaning
    1.5300000000⋯. So, if the regime bits are **111** which means they go all the
    way to the last bit, the implied bits that lie beyond are all **0** bits; call
    them *ghost bits*. The very next ghost bit is a **0** that serves as the stop
    bit for the run of **1** bits.


    What if the regime is **000**, going all the way to the end without an opposite
    bit to end the run? Then it represents an *infinitely small integer*, –∞, because
    it never reaches its opposite bit and is an infinite string of **0** bits.


    If there are *k* identical bits in a row, the value of *r* is


    Remember the rule for negating an integer, where you flip all the bits and add
    one to the LSB? It works for the regime notation as well, but in a completely
    different way. Like, if you negate regime **11****0** = 1, flip bits to **00****1**,
    add 1 but read the result as a regime **0****1** **·** where the “**·**” bit is
    not part of the regime since it is after the opposite bit. Or try negating regime
    **1****0** **·** = 0. Flip the regime bits to **0****1** **·** and add 1 to the
    last bit of the regime (which is the second bit, not the third), and you get back
    **1****0** **·**, that is, 0 in regime notation. Similarly, if you try to negate
    the regime for -∞, you get back the same bit pattern, so -∞ acts exactly like
    NaR. It is “the point at infinity.”


    Regime notation works a lot like clothing sizes: L, XL, XXL, XXXL for large, extra-large,
    and so on. Or for small sizes, sizes 0, 00, and 000 indicate smaller and smaller
    clothing sizes.


    The “.” bits after the opposite bit are *fraction bits* representing the fraction
    *f*. There is an implied radix point “.” after the last bit of the regime. So
    far, we only have the possibility of one fraction bit, and in binary, **.0** means
    *f* = 0 and **.1** in binary means *f* =½. “But what if there aren''t any fraction
    bits?” you might ask. The answer is, “There are *always* fraction bits. If they
    are beyond the end of the number, they all have value **0**.” And there is nothing
    wrong with having a fraction value of *f* = 0.


    The value of the sign bit is *s*, that is, 0 if the sign bit is **0** and 1 if
    the sign bit is **1**. We can now give the formula for the value *x* represented
    by a posit from its bit string:


    Let''s practice by decoding **1****0****1****1**. The sign bit is **1**, so *s*
    = 1. The regime is **0****1**, so *k* is one bit in a row and *r* = -1. The fraction
    has one bit showing (a **.1** followed by an implied infinite string of **0**
    bits) so *f* =½. Apply the formula:


    But does the formula work for the case of *x* = 0? Surprisingly, it does. The
    bit string is **0****000**, so *s* = 0, *r* = -∞, and *f* = 0. The formula simplifies
    to 1 × 2^(\-∞), which is 0.


    What happens for NaR, though? Its bit string **1****000** means *s* = 1, *r* =
    −∞, and *f* = 0. The formula simplifies to (−1) × 2^∞ = −∞. That is certainly
    not a real. We simply make the rule that −∞ is our stand-in for anything that
    is not a real, not just −∞.


    That really is the punchline of this chapter, and it works for any posit precision.
    A 1-bit posit is possible, but all it can represent is 0 or NaR.


    As a taste of what is to come, let''s take the format out for a spin, with 16-bit
    posits. What is the largest and smallest magnitude posit values we can represent
    with the same number of bits? Call those extremes *maxPos* and *minPos. maxPos*
    is **0****111111111111111** with *k* = fifteen **1** bits in a row, so *r* = 14;
    *maxPos* = 2^(14) ≈ 1.6 × 10⁴. Reciprocation is perfect; *minPos* is **0****000000000000001**
    with *k* = fourteen **0** bits in a row, so *r* = -14 and *minPos* = 2^(\-14)
    ≈ 6 × 10^(\-5). More than 8 orders of magnitude.


    If you decode **0****11****0****100100100010** you get the rational number $\\frac{3217}{1024}
    \\approx 3.1416,$ that is, *π* accurate to about five decimal places. To put this
    in perspective, the closest that IEEE Standard 16-bit floats can get to π is $\\frac{201}{64}
    = 3.140625,$ with only about three decimals of accuracy. This is a small sampling
    of the advantages of the posit format.


    If we are going to be examining and comparing *error* and *accuracy*, we had better
    do so with careful thinking and clarity. That is the subject of [Chapter 2](#chapter2.xhtml).


