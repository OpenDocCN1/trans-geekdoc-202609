    and used numbers, and how those methods have proved to be far from optimal for
    *machines*. It also will tell the story of where the present-day IEEE Std 754
    definition of floating-point formats actually came from; it''s not what most people
    think.


    ## 4.1 The Amazing Babylonians


    The ancient Babylonians were no slouches at mathematics, even going back as far
    as 1800 BC. They recognized the merits of using 60 as a number base, which persists
    to the present day in the form of 60 seconds per minute and 60 minutes per hour,
    as well as 360° per circle. The Egyptians may have been just as capable, but they
    used ink on papyrus instead of clay tablets left to bake in the sun, so we have
    much less surviving evidence of their skills. Here is a particularly impressive
    Babylonian relic, redrawn for clarity and annotated with modern numbers in white:


    ![Ancient Babylonians knew the square root of 2 to seven decimals.](images/pg62_1.jpg)


    Ancient Babylonians knew the square root of 2 to seven decimals.


    First, notice how logical the Babylonian number notation is. At the lowest level,
    it is unary in that it repeats the ![](images/inline1.jpg)symbol for ten and the
    symbol for one to notate two-digit positional numbers between 1 and 59. If they
    needed a zero, they left that position blank. At the level above that, the system
    uses positional notation from left to right like our modern decimals, but base
    60 instead of base ten. The side of a square is labeled 30 in the upper left.
    Across the diagonal of the square is their notation for $1 + \frac{25}{60} + \frac{51}{60^{2}}
    + \frac{10}{60^{3}}$, which in decimal works out to 1.414213…, which is the square
    root of 2 correct to the first seven decimals! The side of the square is labeled
    as 30, so the length of the diagonal is $30 \times \sqrt{2} \approx 42 + \frac{25}{60}
    + \frac{35}{60^{2}} \approx 42.4264$, again uncanny accuracy to six decimal places.


    The relic is not a “tablet” but someone''s scratch work from almost four thousand
    years ago. They knew how to find the diagonal of a right triangle, so maybe what
    we call the Pythagorean Theorem should be called the Babylonian Theorem. The backside
    of that block of clay has been partly erased but seems to show a 3-4-5 right triangle,
    the simplest case where the diagonal is an integer, $\sqrt{3^{2} + 4^{2}} = 5$.


    The Babylonians also knew how to solve the quadratic equation and compute compound
    interest rates (exponentials), and they could approximate the area under a curve
    by using close-fitting trapezoids (integral calculus). They knew how to solve
    systems of linear equations. I could go on. Somehow, though, their knowledge and
    well-designed number system was lost instead of spreading to the empires that
    followed, like that of the Romans.


    ## 4.2 Roman Numerals


    ![](images/pg63_1.jpg)


    It is amazing that a civilization as successful as the Roman Empire was able to
    thrive with one of the most cumbersome number systems ever devised. Since we still
    see Roman numerals everywhere, from the hour labels on analog clocks to their
    use in numbering sections of publications, perhaps they do not seem that painful.
    But ask yourself this: How would you *multiply* **XIV** by **LXV** by hand, without
    first translating to some other number system?


    Here is a question: Are Roman numerals positional notation, or are they more like
    tally marks and numeral systems that do not use position? I argue that they are
    *slightly* positional, but not all the way there. For example, suppose we write
    the integer 1984 in Roman numerals. The conventional way would be **MCMLXXXIV**,
    with big numbers mostly on the left and small numbers mostly on the right.


    However, if we break that up as **M CM L X X X IV**, they could be written in
    any pattern and it would still mean 1984:


    ![Roman numerals are not positional notation.](images/pg64_1.jpg)


    Roman numerals are not positional notation.


    The only positional thing about Roman numerals is the subtractive pairs **IV,
    IX, XL, XC**, and so on where the value of the first letter is subtracted from
    the value of the second. Otherwise, they might as well be coins thrown on a table
    and added up. Hence, *slightly* positional. There are examples, say of the twenty-second
    Roman Legion writing their number as **IIXX**, since the way they described themselves
    in Latin translates as “the two and twentieth”. Sometimes a scribe would write
    **VXL** for 45 instead of **XLV**, probably an indication that scribes of the
    era found the rules just as confusing and error-prone as we do today.


    It''s not commonly known, since in modern times we only use Roman numerals to
    write positive integers, but the Romans *did* have a way to write fractions.


    ![](images/pg64_2.jpg)


    The system actually almost makes sense, like the pips on dice or dominos. However,
    besides integers divided by 12, they had special fractions with their own symbols,
    like ℈ for $\frac{1}{288}$ and Ƨ for $\frac{1}{72}$. This type of thing is what
    you get when number systems form organically like human language, with people
    making it up as they go along, instead of being *designed* from first principles.


    So how *did* the ancient Romans perform such common tasks as adding up the cost
    of items in a transaction? They converted Roman numerals to an abacus-type representation.
    Not necessarily beads on wires the way we usually picture an abacus, but as simple
    as pebbles lying in a groove that can be slid back and forth. And that''s definitely
    positional and fairly well-suited to adding and subtracting.


    We have no record of their pebble-in-groove type of abacus, but the British Museum
    has an excellent example of a portable Roman mechanical abacus:


    ![Roman abacus](images/pg65_1.jpg)


    Roman abacus


    The results could then be converted back to Roman numerals. The abacus indicates
    symbols for a thousand, ten thousand, one hundred thousand, and a million. The
    rightmost two columns show the fraction counter as the number of twelfths, and
    a way to indicate how many thirds of $\frac{1}{12}$ after that. *That* is positional
    notation, and it is even ordered the same way as our positional numeral system
    today.


    The design of Roman numerals suggests they originated in a medium where it took
    a lot of work just to make a line. Carving **IV** in stone takes three chiseled
    lines, instead of **IIII**. Writing **X** takes only two chisel lines, instead
    of four lines for **VV**. Obviously an **L** is far easier to carve than **XXXXX**.
    Considering how difficult it is to chisel a curve, the notation **C** for one
    hundred and **D** for five hundred suggests they did not expect to use such large-magnitude
    integers very often. For a thousand, Romans eventually used **M** (the most common
    form today) but earlier used this symbol: ↀ. That symbol is clearly not chisel-friendly,
    so it is easy to see how **M** (short for *mille*, Latin for thousand) came to
    be substituted when carving stone. There is also a symbol ↁ for five thousand,
    and ↂ for ten thousand (a ↂ is visible on the abacus above) which appear in the
    present-day Unicode character set.


    Sometimes it is said that the Indians invented the concept of zero. They may have
    been the first to use zero as a numeral, but the above abacus shows a zero: all
    beads down. Any culture that uses an abacus has a representation for zero, and
    it is the starting point for any calculation. The Romans could certainly communicate
    zero as *nullus*, the Latin adjective for “none.”

