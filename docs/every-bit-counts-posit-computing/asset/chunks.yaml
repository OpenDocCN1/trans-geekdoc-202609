    were *so close*. Like, the symbols for 7, 8, and 9 are just the symbol for 6 combined
    with the symbol for 1, 2, and both 1 and 2. They were tantalizingly close to discovering
    a *logical binary encoding*. Suppose the inventors had instead decided to define
    1 through 9 like this, where the new line segments are shown in red and the line
    segments that are dropped are shown in gray:


    ![](images/pg69_1.jpg)


    So, what happened to Cistercian numerals? They are very easy to write, and with
    a little practice, easy to read (certainly easier than reading Roman numerals
    for integers that large). What happened was this man and his invention, around
    1450 AD:


    ![Gutenberg and his invention](images/pg69_2.jpg)


    Gutenberg and his invention


    Johannes Gutenberg''s world-changing invention of a printing press with movable
    type for characters cast in lead. How many bins would be needed to hold every
    Cistercian numeral? *Ten thousand*.


    Unlike the hand-copied Bibles produced by the Cistercian monks, none of the Gutenberg
    Bibles have page numbers. When Hindu-Arabic numerals finally spread throughout
    Europe, printing with just ten characters 0–9 was a thousand times easier than
    printing Cistercian numerals with movable type. Cistercian numerals fell into
    extreme obscurity.


    They had an unusual resurgence among French Freemasons, around 1780. Tight secrecy
    of special knowledge is a hallmark of Freemasonry, and knowledge of how to write
    numbers in a concise way that was utterly baffling to non-members fitted perfectly
    into a group with secret handshakes, secret passwords, and secret oaths.


    Another resurgence almost happened in the 1930s, in Nazi Germany. Perhaps Nazi
    scholars noticed that the 0–9 system came from India via Arab traders and felt
    that system therefore went against German nationalism, whereas Cistercian numerals
    are entirely European in origin. The resurgence did not get far. Besides being
    very impractical to print, just try to imagine how difficult it would be to invent
    a *typewriter* for them. Even with backspacing and over-typing, you would need
    an additional 36 keys to type each of the four corner digits plus a key for the
    central bar.


    Amusingly, Cistercian on a modern display made with light segments would fit the
    (revised) Cistercian system beautifully. Imagine going to an airport and seeing
    flight numbers shown with a single character on a display with just 16 on-off
    segments (in addition to the always-on center stem), yet able to represent any
    of ten thousand flight numbers.


    ![What 4-digit flight numbers would look like had Cistercian survived](images/pg70_1.jpg)


    What 4-digit flight numbers would look like had Cistercian survived


    Who knows; perhaps someday Cistercian will be added to Unicode using a set of
    *composable* characters, which would take up just one Unicode slot (64 characters).


    ## 4.4 Hindu-Arabic Numerals Spread to Europe


    In the 1st century AD, Indian notation for numbers 1–9 looked like this:


    ![](images/pg71_1.jpg)


    Like so many number systems, it starts out as tally marks and switches to something
    easier to write when it reaches four tally marks. It was a positional system like
    we use today. We do not have a record of them using a circle for zero that long
    ago, so they probably used a blank to indicate a zero in a position like the ten''s
    place or the hundred''s place.


    Imagine trying to write those numerals as quickly as possible; that means switching
    to cursive where you avoid taking the marker off the writing medium while writing
    a single numeral. Also, there seems to be some human preference for making characters
    similar in height, so the first three numerals need some vertical padding.


    That would explain how the numerals evolved in India to look like this by the
    9th century, with every numeral taking only a single squiggle to write:


    ![](images/pg71_2.jpg)


    By then there was definitely a small circle to indicate a zero, and it is easy
    to see the tally marks for one, two, and three turned into cursive. It is confusing
    to us that the symbol for five looks exactly like a modern 4, but no, that really
    does mean five.


    Arab traders picked up the Indian system, and as it spread from east to west,
    by the 11th century the numerals evolved into this:


    ![](images/pg71_3.jpg)


    Perhaps because these are recognizable to us now (though the 4 is a little peculiar),
    the numerals became known as “Arabic” despite being an Indian invention. “Hindu”
    used to refer to the region and culture, and only later meant the religion.

    '
  trans: '

    当我们使用现代计算机时，计算机会将我们的十进制输入转换为二进制，执行运算，然后将结果转换回十进制，以便我们更轻松地阅读和理解。欧洲似乎也是这样运作了数百年；他们用罗马数字来*交流*数字，但如果必须进行实际的*算术运算*，他们就会转换为带有位值记数法的算盘格式，进行运算，然后再转换回罗马数字。罗马人并不像他们的数字系统所暗示的那样在算术上受到挑战。他们显然拥有建造斗兽场所需的所有
    10 的幂次方。


    ## 4.3 接近二进制的编码：西多会数字


    ![西多会数字可能是被古腾堡的活字印刷术发明所扼杀的。](img/pg66_1.jpg)


    西多会数字可能是被古腾堡的活字印刷术发明所扼杀的。


    如果计数符号是表达数字最笨重的方式之一，那么*西多会数字*必定是人类有史以来开发出的书写数字最紧凑的方式之一。它们大约在公元 1200 年由西多会修道会引入，作为罗马数字的替代品，并使用了几百年。它们起源于英国店主使用的一种速记形式，因为它们不仅节省面积，还节省笔画。


    它们的定义因修道院而异，但数字 1 到 9 最常见的原始形式如下所示：


    ![](img/pg67_1.jpg)


    对于十位数，关于水平轴反射：


    ![](img/pg67_2.jpg)


    对于百位数，将个位符号关于*垂直*轴翻转：


    ![](img/pg67_3.jpg)


    还剩一个角落，他们用它表示千位：


    ![](img/pg67_4.jpg)


    但他们没有将这些符号视为独立的数字，而是将它们组合成一个单一的字形，如下所示：


    ![](img/pg67_5.jpg)


    如果你想在任何位置表示零，只需让那个角落保持空白即可。虽然一根简单的竖线可以代表零，但没有证据表明曾经使用过简单的、无装饰的竖线。西多会数字用于给事物编号，而非进行算术运算，他们从未想过从
    0 开始编号而不是从 1 开始。


    对于早期的手抄书籍，纸张珍贵，他们充分利用纸张提供的空间。想象一下用罗马数字写页码 1368：**MCCCLXVIII**，十个字符。用西多会数字，你只需四五笔就能写出
    1368，笔离纸三次；但如果用罗马数字，你需要十一下笔画，笔离纸十次。西多会数字的效率大约高出三倍。一旦习惯了它们，西多会数字也更容易、更快地阅读。


    随着演变，使用者开始竖着书写它们，数字 5 通常写作 1 和 4 的组合，而不是一个点：


    ![西多会数字的后期形式，附四个示例](img/pg68_1.jpg)


    西多会数字的后期形式，附四个示例


    这是一种位值记数法，最多四位。事实上，它是*二维*位值记数法，而非我们习惯的一维从左到右的位值记数法。


    西多会数字中包含二进制编码十进制（BCD）的要素。它们*离成功那么近*。比如，7、8、9 的符号就是 6 的符号分别与 1、2、1 和 2 的符号组合而成。他们诱人地接近发现*逻辑二进制编码*。假设发明者当时决定按如下方式定义
    1 到 9，其中新线段用红色显示，被舍弃的线段用灰色显示：


    ![](img/pg69_1.jpg)


    那么，西多会数字后来怎么样了？它们非常容易书写，稍加练习也易于阅读（对于那么大的整数，当然比读罗马数字容易）。发生的事情就是这个人和他的发明，大约在公元 1450
    年：


    ![古腾堡和他的发明](img/pg69_2.jpg)


    古腾堡和他的发明


    约翰内斯·古腾堡改变世界的发明——用铸造铅字的活字印刷机。需要多少个格子来存放每一个西多会数字？*一万个*。


    与西多会修士制作的手抄《圣经》不同，古腾堡版《圣经》没有页码。当印度-阿拉伯数字最终传遍欧洲时，仅用十个字符 0-9 印刷比用活字印刷西多会数字容易一千倍。西多会数字陷入了极度的默默无闻。


    它们在 1780 年左右的法国共济会成员中曾异常复兴。严守特殊知识的秘密是共济会的标志，而用一种简洁的方式书写数字、让非会员完全摸不着头脑的知识，完美契合了一个拥有秘密握手、秘密口令和秘密誓言的团体。


    另一次复兴差点发生在 1930 年代的纳粹德国。也许纳粹学者注意到 0-9 系统经由阿拉伯商人从印度传来，认为该系统因此违背了德国民族主义，而西多会数字完全源于欧洲。这次复兴并未走远。除了印刷极不实用外，光想象为它们发明*打字机*有多难就让人望而却步。即使有退格和重叠打印功能，你也需要额外
    36 个键来输入四个角落的每个数字，外加一个中央竖线的键。


    有趣的是，如果用发光段制成的现代显示器来显示西多会数字，将完美契合（修订后的）西多会系统。想象一下去机场，航班号只用一个字符显示在仅有 16 个开关段（加上始终亮着的中央竖线）的显示器上，却能代表一万个航班号中的任意一个。


    ![如果西多会数字流传至今，4 位航班号将长这样](img/pg70_1.jpg)


    如果西多会数字流传至今，4 位航班号将长这样


    谁知道呢；也许有一天西多会数字会作为一组*可组合*字符被加入 Unicode，这只会占用一个 Unicode 码位（64 个字符）。


    ## 4.4 印度-阿拉伯数字传播至欧洲


    公元 1 世纪，印度表示数字 1-9 的符号如下：


    ![](img/pg71_1.jpg)


    像许多数字系统一样，它开始于计数符号，达到四个计数符号时切换为更易书写的形式。它是一种位值系统，就像我们今天使用的一样。我们没有记录显示他们那么早就用圆圈表示零，所以他们可能用空白来表示十位、百位等位置上的零。


    想象一下试图尽可能快地书写那些数字；这意味着切换到草书，在书写单个数字时避免笔离开书写介质。此外，似乎人类倾向于使字符高度相似，所以前三个数字需要一些垂直填充。


    这可以解释数字在印度如何演变为 9 世纪时的样子，每个数字只需一笔涂鸦即可书写：


    ![](img/pg71_2.jpg)


    那时肯定已经有小圆圈表示零了，很容易看出一、二、三的计数符号是如何变成草书的。让我们困惑的是，五的符号看起来完全像现代的 4，但不，那确实代表五。


    阿拉伯商人采用了印度系统，随着它从东向西传播，到 11 世纪数字演变成了这样：


    ![](img/pg71_3.jpg)


    也许因为这些数字现在我们能认出来了（虽然 4 有点奇特），所以它们被称为“阿拉伯数字”，尽管这是印度的发明。“Hindu”（印度教/印度人）过去指代该地区和文化，后来才指代宗教。

    '
