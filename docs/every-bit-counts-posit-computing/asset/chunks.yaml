    \ 2; 3.072 / 2 = 1.536, and now we know the significand: `y` = 1.536. We are done\
    \ with the regime and exponent bits that determine the power-of-2 scaling.\n\n\
    $$\n\\begin{matrix} p & y \\\\ {\\bullet \\bullet \\underset{\\begin{array}{l}\
