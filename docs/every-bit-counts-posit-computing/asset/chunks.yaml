    ![The ln(x/xexact) relative error is between the traditional and traditional reciprocal
    relative error.](img/pg19_1.jpg)


    `ln(x/x[exact])` 相对误差介于传统相对误差和传统倒数相对误差之间。


    | `ln(x/x[exact])` | 这种情况是“正确处理不准确性”，这是一个具有数学自洽性的定义，且当误差量小时，它与传统相对误差定义非常相似。


    ## 2.3 精度作为误差的倒数


    也就是说，我们能以可证明的方式越严格地限定结果的数值范围，我们就越了解其真实值。


    同样，`accuracy`（精度）是相对误差的倒数，当我们说“答案精确到小数点后五位”时，我们就已经在使用这个概念了。如果相对误差约为 0.001，则我们知道答案约精确到
    3 位小数；如果相对误差为 0.0000001，则我们知道答案精确到 7 位小数。数学上：


