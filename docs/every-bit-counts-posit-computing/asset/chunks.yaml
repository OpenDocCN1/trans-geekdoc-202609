  trans: "\n\n告别 IEEE 浮点数的下一阶段是机器学习 (ML) 的兴起，以及人工智能 (AI) 终于兑现了其数十年前的承诺。但 32 位 IEEE\
    \ 浮点数对于所需用途来说大材小用，而 16 位 IEEE 浮点数的动态范围又不足。于是，各公司开始各自设计表示实数的方式，陷入了一场混战，这非常像 1985\
    \ 年标准出台之前的日子，那时每个厂商都有自己的做法。截至我写下这些文字时，情况依然如此；硬件对 IEEE Std 754 的全面支持几近灭绝。我们无需为此惋惜，因为我们再次有机会为实数格式进行一场*数学*层面的、白纸黑字式的全新设计。\n\
    \n前述大部分历史此前从未以出版形式出现。它源自我与 John Palmer、William Kahan 以及其他参与该过程的人士进行的数小时交谈。\n\n\
    ## 4.8 经验教训\n\n人类记录和处理数字的偏好与机器存储和操作数字的最佳方式之间的错位已持续数百年，最终机器变得更加优化。最近一次插曲是试图用计算机上的比特来模仿人类的科学计数法，而不是采取“每一位都至关重要”的方法。\n\
    \n标准委员会应避免存在利益冲突的成员，如现有产品的大型制造商。这看似常识，但 IEEE 却偏偏反其道而行之，*要求*此类制造商参与。结果是，我们得到的浮点数“标准”实际上是\
    \ 1970 年代 Intel 的专有设计，其中包含大量由利益相关方做出的偏颇选择。\n\n任何工程工作都应始于一份设计目标清单。它们往往相互竞争，但至少可以明确地权衡取舍。用比特串在现代电子计算机中表示实数系统的设计目标应是什么？对于以下目标（按重要性排序）应几乎没有异议：\n\
    \n1.  所表示值的分布应类似于计算中所需数字的分布。即每种比特模式的使用频率应大致相同（这是信息论专家 Claude Shannon 提出的“最大熵”原理）。\n\
    \n2.  不应存在表示同一事物的冗余比特模式；每一位都至关重要。\n\n3.  程序的输出应仅由源代码和输入数据确定，不受不可见的运行“模式”影响。所用精度必须严格符合源代码中的规定，不多也不少。\n\
    \n4.  所有数学运算应正确舍入。这结合**第 3 条**，可确保跨计算机系统的完美可复现性和可移植性。\n\n5.  应易于更改精度，就像更改整数精度一样容易。\n\
    \n6.  如果结果不是实数，它应有一种表示形式，能将该状态通过后续每个运算传播下去，使最终输出反映该状态。\n\n7.  硬件实现应简单且快速。\n\n\
    \    在“锦上添花”类别中：\n\n8.  应易于将精度缩放至任意比特数。\n\n9.  实数应单调映射到有符号整数，以便它们能使用相同的硬件进行比较运算。\n\
    \n10. 同样，对实数表示取反的位运算应与对整数取反的位运算完全相同，以便它们能使用相同的硬件。\n\n11. 应用计算的结果应尽可能接近精确计算的结果。\n\
    \n令人惊讶的是，i8087 以及因此而来的 IEEE Std 754 *未能满足上述任何一个目标*。\n\n下一章将对经 Posit 工作组批准的 12\
    \ 页 *Posit™ 标准 (2022)* 进行带注释的介绍。该标准满足了上述前十项目标，并在目标**第 11 条**上比浮点数表现更好。\n\n# 5\
    \ Posit 标准注释版\n\n![这就是完整的 Posit 标准 (2022)，简单明了到足以容纳在十二页纸上。](img/pg99_1.jpg)\n\n\
    这就是完整的 Posit 标准 (2022)，简单明了到足以容纳在十二页纸上。\n\n编写标准与编写解释截然不同，因为标准应尽可能简洁，这意味着省略示例和决策背后的理由。Peter\
    \ Lindstrom 建议我们编写一份配套文档，提供这些示例和理由，这正是本章的功能。既然上一章解释了 IEEE Std 754 的起源，那么讲述 Posit\
    \ 标准的来龙去脉也只合情合理。\n\n后续章节不依赖于本章，因此如果读者觉得本章枯燥，可以随意略读。\n\n## 5.1 新加坡幕后故事\n\n![新加坡市中心（前景为滨海湾金沙）和融合城，后者是新加坡超级计算中心所在地，也是\
    \ posit 数字格式及其标准文档的诞生地。](img/pg99_2.jpg)\n\n新加坡市中心（前景为滨海湾金沙）和融合城，后者是新加坡超级计算中心所在地，也是\
    \ posit 数字格式及其标准文档的诞生地。\n\n新加坡在向世界引入重大创意方面有着惊人的记录。闪存驱动器、手机摄像头、番茄酱。2015 年，两位技术远见者身处新加坡：物理学家\
    \ Marek Michalewicz 和新加坡 NSCC 超算中心主任 Tin Wee Tan，他们看到了我刚刚发布的 *unum* 数字格式的前景。他们通过新加坡科技研究局\
    \ (A*STAR) 和新加坡国立大学 (NUS) 安排我前往该国，继续开发下一代算术以取代过时的 IEEE Std 754。我们知道 unum 格式有一个劣势需要克服：unum\
    \ 格式*不*利于硬件实现。unum 格式是向 IEEE 浮点数伸出的“橄榄枝”，试图通过创建一个包含三个新字段的 IEEE 浮点数*超集*来修补该设计的缺陷：\n\
    \n![最初的 unum 格式是一个附带元数据的 IEEE 风格浮点数](img/pg100_1.jpg)\n\n最初的 unum 格式是一个附带元数据的\
    \ IEEE 风格浮点数\n\n它是一种区间运算，但经过扩展，允许区间端点可以是闭合或开放的，并允许指数和尾数字段的大小根据计算需要而变化。第 1 章描述了\
    \ ubit：用“⋯”的有无来表示最后一位显示位之后是否还有非零位。这种自描述位使得浮点误差的管理能够实现自动化（或消除）。虽然它们在软件中得到了全面支持，且中国有一个团队成功制造了使用\
    \ unum 运算的定制芯片，但使用 unum 证明很像处理长度可变的字符串，需要动态分配和释放内存。\n\n使用 unum 的一种方法是固定指数和尾数大小并在每次运算后舍入，这使它们能完美模仿\
    \ IEEE 浮点数。但这种“向后兼容性”也阻碍了 unum 满足 第 4 章 末尾列出的设计目标。存在冗余的比特模式，即有两种方式表达同一个实数值。它们不单调映射到有符号整数。\n\
    \n"
