    \ of possible `NaR` or 0 cases before trying to find the regime bits. This also\
    \ takes care of the cases where `y` ≥ `maxPos` or `y` ≤ `minPos`:\n\n```\nIf y\
    \ ≥ maxPos,\n    Return the posit for maxPos times the sign of x,\nElse if y ≤\
    \ minPos,\n    Return the posit for minPos times the sign of x,\nEnd if.\n```\n\
    \nThis also takes care of one of the rounding rules, that magnitudes outside the\
    \ dynamic range saturate to the (signed) largest or smallest value. Also, handling\
    \ these special cases assures that the opposite bit ending the regime will fit\
    \ in the `n`-bit string built in the next subsection.\n\n### 3.4.3 Encode the\
    \ Regime Bits\n\nSince computer environments usually support unsigned integer\
    \ types, it is easy to treat the posit bit string as an unsigned `n`-bit integer.\
    \ Having already dealt with the `NaR` and 0 cases, the regime can be at most `n`\
    \ - 1 bits long. With an `n`-bit unsigned integer `p` we can store the regime\
    \ starting in the Most Significant Bit (`MSB`) since we do not need a sign bit,\
    \ and that will leave an extra bit at the end that we can use to do proper rounding.\n\
    \n```\nIf y ≥ 1, the regime will be a string of 1 bits:\n    Set p = 1 and i =\
    \ 2. The number of posit bits found so far is i.\n    While y ≥ uSeed and i <\
    \ n,\n        shift p left by one place and set the LSB to 1 (lengthen the regime).\n\
    \        Divide y by uSeed and increment i.\n    End while.\n    Shift p left\
    \ by one place to prepare for the next phase, and increment i.\nElse y < 1, so\
    \ the regime will be a string of 0 bits:\n    Set p = 0 and i = 1 (off by 1 from\
    \ the y ≥ 1 case, since we seek 1 ≤ y < uSeed).\n    While y < 1 and i ≤ n,\n\
    \        multiply y by uSeed and increment i.\n    End while.\n    Set p = 1 (the\
    \ opposite bit ending the regime) and increment i.\nEnd if.\n```\n\nThe “Shift\
    \ `p` left by one place” creates a `0` as the `LSB`, which is the opposite bit\
    \ ending the regime in the case where the regime is a string of `1` bits.\n\n\
    ### 3.4.4 Encode the Exponent Bits\n\nConverting `x` to the posit format has proceeded\
    \ from left to right, and finding the exponent bits is no different. We know that\
    \ 1 ≤ `y` < `uSeed`. If the format uses `eS` = 0 then there is nothing to do,\
    \ so skip to finding the fraction bits. Otherwise, continue bisecting to find\
    \ the exponent bits from most significant to least significant. Computing `uSeed`\
    \ = 2²`eS` is actually an easy thing for a computer to do, because a `1` bit shifted\
    \ left by `eS` places is the unsigned integer for 2^(`eS`), and then a `1` bit\
    \ shifted left by that unsigned integer is 2²`eS`. In the C computer language,\
    \ it would be concisely expressed as `1 << (1 << eS)`.\n\nSo the algorithm for\
    \ extracting the exponent bits looks like this:\n\n```\nSet e = eS − 1.\nWhile\
    \ i < n and e > 0,\n    Shift p left by one place to make a place for an exponent\
    \ bit.\n    Set scale = 1 << (1 << e).\n    If y ≥ scale, set the LSB of p to\
    \ 1 and set y = y / scale.\n    Increment i, since we have used another posit\
    \ bit for the exponent.\n    Set e = e − 1.\nEnd while.\nShift p left by one place\
    \ to prepare for the next phase, and increment i.\n```\n\nIf the bit counter `i`\
    \ actually reaches `n` before `e` decrements to 0, the exponent bits will be clipped\
    \ off and the posit will be in the “Twilight Zone.” Otherwise, we will be left\
    \ with the significand `y`, with 1 ≤ `y` < 2.\n\n### 3.4.5 Encode the Fraction\
    \ Bits\n\nSince `y` is now a fixed-point number between 1 and 2, its binary bit\
    \ string always begins with a `1` bit, so there is no need to store that. The\
    \ `1` is implied. Hence, we first find the fraction by subtracting 1 from `y`.\
    \ Then each bit of the fraction is found by doubling the fraction and testing\
    \ if it is larger than 1; if it is, install a `1` bit in the posit bit string,\
    \ subtract 1 from `y`, and repeat until there is no more room for fraction bits.\n\
    \nOnce all `n` + 1 bits are populated, the test of whether the conversion was\
    \ exact is very simple: Is `y` > 0? If it is, then the `ubit` is `1` because there\
    \ are more bits after the last one. But if `y` = 0, then the conversion landed\
    \ exactly on a posit value, so the `ubit` is `0`. Remember, the `ubit` is needed\
    \ for the banker's rounding.\n\n```\nSet y = y − 1.\nWhile i < n,\n    Shift p\
    \ left by one place. This puts a 0 in the LSB position.\n    Set y = 2 × y.\n\
    \    If y ≥ 1, set the LSB of p to 1 and set y = y − 1.\n    Increment i, since\
    \ we've used another posit bit for the fraction.\nEnd while.\n```\n\nAfter this\
    \ step, `i = n`, so we have a bit string with `n` bits. But it does not have the\
    \ sign bit, so we have one more bit than will be in the rounded value. Call it\
    \ `b`[−1].\n\n### 3.4.6 Round and Apply the Sign of `x`\n\n*Banker's rounding*\
    \ is rounding a value `x` to the nearest representable number `p`, and if there\
    \ are two possibilities for `p` equally close to `x`, the rule is to choose the\
    \ one that has *even* representation. In binary, even numbers end in `0` and odd\
    \ numbers end in `1`. The reason for the “ties go to even” rule is that it makes\
    \ the rounding *unbiased*. Imagine a bank that needs to calculate interest to\
    \ the penny on billions of dollars of transactions; even the slightest bias up\
    \ or down could quickly amount to a fortune. There have been schemes to do this,\
    \ using rounding to get something for nothing.\n\nBanker's rounding is the rounding\
    \ mode for the posit format, and it is the *only* rounding mode. No matter whether\
    \ you are rounding integer format, fixed-point, floats, or posits, the principle\
    \ is the same. The algorithm for banker's rounding needs just *three bits*, shown\
    \ in the following figure for the case of an 8-bit format:\n\n![The three bits\
    \ needed for banker's rounding](images/pg51_1.jpg)\n\nThe three bits needed for\
    \ banker's rounding\n\nFor an `n`-bit format, our convention is to label bits\
    \ with subscripts from 0 for the `LSB` up to `n` - 1 for the `MSB`. The three\
    \ bits we need are the `LSB`, a `b`[−1] bit we can call the *rounding bit*, and\
    \ a bit we saw in [Chapter 1](#chapter1.xhtml), the `ubit`. If `ubit` = `1`, that\
    \ indicates there are more significant digits after `b`[−1], like writing “⋯”\
    \ after the last digit of a number.\n\nIf `b`[−1] is `1` and the `ubit` is `0`,\
    \ the value is at the tie point; it is the value that would be represented if\
    \ there were one more bit. To make the rounded value even, if `b`[0] is 0, do\
    \ nothing (that is, round down by ignoring `b`[−1]); but if `b`[0] is `1`, add\
    \ `1` to the `LSB` and propagate the carry to the left. With posit format, there\
    \ is no possibility of overflow.\n\nIf `b`[−1] is `1` and the `ubit` is `1`, meaning\
    \ there are some `1` bits after bit `b`[−1], then the value is above the tie point\
    \ and needs to be rounded up. The four cases for rounding a value `x` to a posit\
    \ are as follows:\n\n*   If `x` is 0 or `NaR`, return the respective posit representing\
    \ that value.\n*   If |`x`| ≥ `maxPos`, return the posit for `maxPos` with the\
    \ same sign as `x`.\n*   If |`x`| ≤ `minPos`, return the posit for `minPos` with\
    \ the same sign as `x`.\n*   If `minPos` < |`x`| < `maxPos`, encode `x` to `n`\
    \ + 1 bits; if that representation is exact, set the `ubit` to `0`, else set the\
    \ `ubit` to `1`. If `b`[−1] is `1` and (`b`[0] is `1` or the `ubit` is `1`), add\
    \ 1 to the `b`[0] position and propagate any carry.\n\nIf you like digital hardware\
    \ design and can read circuit diagrams, the figure below shows what banker's rounding\
    \ looks like for a number with the extra `b`[−1] bit and some trailing bits in\
    \ temporary storage.\n\n![Logic circuit for banker's rounding](images/pg52_1.jpg)\n\
    \nLogic circuit for banker's rounding\n"
  trans: "\n设置 `y` = |`x`| 可以使某些步骤更简单。这不会丢失关于 `x` 是正数、负数（或零）的信息，因为我们不改变输入值 `x`，并且始终可以回溯引用它。\n\
    \n如果 `y` = 0，返回由全 0 位组成的 `n` 位字符串，即 `0000`⋯`000`。在尝试查找阶码位之前，处理可能的 `NaR` 或 0 的情况非常重要。这也处理了\
    \ `y` ≥ `maxPos` 或 `y` ≤ `minPos` 的情况：\n\n```\nIf y ≥ maxPos,\n    Return the\
    \ posit for maxPos times the sign of x,\nElse if y ≤ minPos,\n    Return the posit\
    \ for minPos times the sign of x,\nEnd if.\n```\n\n这也处理了舍入规则之一，即超出动态范围的幅度会饱和到（带符号的）最大值或最小值。此外，处理这些特殊情况可确保结束阶码的相反位能适应下一小节中构建的\
    \ `n` 位字符串。\n\n### 3.4.3 编码阶码位\n\n由于计算机环境通常支持无符号整数类型，因此很容易将 posit 位串视为无符号 `n`\
    \ 位整数。既然已经处理了 `NaR` 和 0 的情况，阶码最多只能有 `n` - 1 位长。利用一个 `n` 位无符号整数 `p`，我们可以从最高有效位（`MSB`）开始存储阶码，因为我们不需要符号位，这样最后会多出一位，可用于正确舍入。\n\
    \n```\nIf y ≥ 1, the regime will be a string of 1 bits:\n    Set p = 1 and i =\
    \ 2. The number of posit bits found so far is i.\n    While y ≥ uSeed and i <\
    \ n,\n        shift p left by one place and set the LSB to 1 (lengthen the regime).\n\
    \        Divide y by uSeed and increment i.\n    End while.\n    Shift p left\
    \ by one place to prepare for the next phase, and increment i.\nElse y < 1, so\
    \ the regime will be a string of 0 bits:\n    Set p = 0 and i = 1 (off by 1 from\
    \ the y ≥ 1 case, since we seek 1 ≤ y < uSeed).\n    While y < 1 and i ≤ n,\n\
    \        multiply y by uSeed and increment i.\n    End while.\n    Set p = 1 (the\
    \ opposite bit ending the regime) and increment i.\nEnd if.\n```\n\n“将 `p` 左移一位”会在最低有效位（`LSB`）处创建一个\
    \ `0`，当阶码是 `1` 位串时，这就是结束阶码的相反位。\n\n### 3.4.4 编码指数位\n\n将 `x` 转换为 posit 格式的过程是从左向右进行的，查找指数位也不例外。我们知道\
    \ 1 ≤ `y` < `uSeed`。如果格式使用 `eS` = 0，则无需操作，直接跳到查找尾数位。否则，继续二分查找，从最高有效位到最低有效位确定指数位。计算\
    \ `uSeed` = 2²`eS` 对计算机来说其实很容易，因为将 `1` 位左移 `eS` 位得到 2^(`eS`) 的无符号整数，然后将 `1` 位左移该无符号整数位即得到\
    \ 2²`eS`。在 C 语言中，可以简洁地表示为 `1 << (1 << eS)`。\n\n因此，提取指数位的算法如下：\n\n```\nSet e =\
    \ eS − 1.\nWhile i < n and e > 0,\n    Shift p left by one place to make a place\
    \ for an exponent bit.\n    Set scale = 1 << (1 << e).\n    If y ≥ scale, set\
    \ the LSB of p to 1 and set y = y / scale.\n    Increment i, since we have used\
    \ another posit bit for the exponent.\n    Set e = e − 1.\nEnd while.\nShift p\
    \ left by one place to prepare for the next phase, and increment i.\n```\n\n如果位计数器\
    \ `i` 在 `e` 递减到 0 之前实际达到了 `n`，指数位将被截断，posit 将处于“暮光区”。否则，我们将得到尾数 `y`，满足 1 ≤ `y`\
    \ < 2。\n\n### 3.4.5 编码尾数位\n\n既然 `y` 现在是介于 1 和 2 之间的定点数，其二进制位串总是以 `1` 位开头，因此无需存储该位。这个\
    \ `1` 是隐含的。因此，我们首先通过从 `y` 中减去 1 来得到尾数。然后通过将尾数加倍并测试其是否大于 1 来找到尾数的每一位；如果大于 1，在 posit\
    \ 位串中安装一个 `1` 位，从 `y` 中减去 1，重复此过程，直到没有更多空间存放尾数位。\n\n一旦填满所有 `n` + 1 位，判断转换是否精确非常简单：`y`\
    \ > 0 吗？如果是，则 `ubit` 为 `1`，因为最后一位之后还有更多位。但如果 `y` = 0，则转换精确落在一个 posit 值上，所以 `ubit`\
    \ 为 `0`。记住，`ubit` 是银行家舍入法所需的。\n\n```\nSet y = y − 1.\nWhile i < n,\n    Shift\
    \ p left by one place. This puts a 0 in the LSB position.\n    Set y = 2 × y.\n\
    \    If y ≥ 1, set the LSB of p to 1 and set y = y − 1.\n    Increment i, since\
    \ we've used another posit bit for the fraction.\nEnd while.\n```\n\n经过此步骤后，`i\
    \ = n`，所以我们得到一个包含 `n` 位的位串。但它没有符号位，所以比舍入后的值多一位。称之为 `b`[−1]。\n\n### 3.4.6 舍入并应用\
    \ `x` 的符号\n\n*银行家舍入法*是将值 `x` 舍入到最近的可表示数 `p`，如果有两个同样接近 `x` 的 `p` 可能性，规则是选择具有*偶数*表示的那个。在二进制中，偶数以\
    \ `0` 结尾，奇数以 `1` 结尾。“遇半进偶”规则的原因是它使舍入*无偏差*。想象一家银行需要计算数十亿美元交易的精确到分的利息；即使是最轻微的向上或向下偏差也可能迅速积累成一笔巨款。曾有利用舍入来“白得”利益的方案。\n\
    \n银行家舍入法是 posit 格式的舍入模式，也是*唯一*的舍入模式。无论你是舍入整数格式、定点数、浮点数还是 posit，原则都是一样的。银行家舍入算法只需要*三个位*，下图展示了\
    \ 8 位格式的情况：\n\n![银行家舍入法所需的三个位](img/pg51_1.jpg)\n\n银行家舍入法所需的三个位\n\n对于 `n` 位格式，我们的约定是用下标从\
    \ 0（`LSB`）到 `n` - 1（`MSB`）标记位。我们需要的三个位是 `LSB`、一个称为*舍入位*的 `b`[−1] 位，以及我们在第 1 章见过的\
    \ `ubit`。如果 `ubit` = `1`，表示在 `b`[−1] 之后还有更多有效数字，就像在数字最后一位后写“⋯”一样。\n\n如果 `b`[−1]\
    \ 是 `1` 且 `ubit` 是 `0`，该值处于临界点；它是如果多一位所能表示的值。为了使舍入值为偶数，如果 `b`[0] 是 0，则不做任何操作（即向下舍入，忽略\
    \ `b`[−1]）；但如果 `b`[0] 是 `1`，则向 `LSB` 加 `1` 并向左传播进位。使用 posit 格式，不存在溢出的可能性。\n\n\
    如果 `b`[−1] 是 `1` 且 `ubit` 是 `1`，意味着在 `b`[−1] 位之后还有 `1` 位，则该值高于临界点，需要向上舍入。将值 `x`\
    \ 舍入为 posit 的四种情况如下：\n\n*   如果 `x` 是 0 或 `NaR`，返回代表该值的相应 posit。\n*   如果 |`x`|\
    \ ≥ `maxPos`，返回带有 `x` 相同符号的 `maxPos` 的 posit。\n*   如果 |`x`| ≤ `minPos`，返回带有 `x`\
    \ 相同符号的 `minPos` 的 posit。\n*   如果 `minPos` < |`x`| < `maxPos`，将 `x` 编码为 `n` +\
    \ 1 位；如果该表示精确，将 `ubit` 设为 `0`，否则设为 `1`。如果 `b`[−1] 是 `1` 且（`b`[0] 是 `1` 或 `ubit`\
    \ 是 `1`），向 `b`[0] 位置加 1 并传播任何进位。\n\n如果你喜欢数字硬件设计并能看懂电路图，下图展示了带有额外 `b`[−1] 位和临时存储中一些尾随位的数字的银行家舍入逻辑。\n\
    \n![银行家舍入法的逻辑电路](img/pg52_1.jpg)\n\n银行家舍入法的逻辑电路\n"
