    strides, from 0 to `2^(eS) - 1`. This seems weird at first, because it mixes two
    different ways to write a number. Imagine writing counting numbers with Roman
    numerals for the ten''s place and 0–9 numerals for the one''s place, so twenty-three
    would be “**XX**3” and thirty-nine would be “**XXX**9”. Or we could use Roman
    numerals for the hundred''s place and 00–99 numeral for the ten''s and one''s
    place, so two hundred seventy-one would be “**CC**71”. That is similar to how
    the regime bits and exponent bits work together.


    For example, if `eS = 2`, each increment of `r` raises the power of two by a stride
    of `2^(eS) = 4`, and the two exponent bits `00`, `01`, `10`, `11` represent `e
    = 0, 1, 2, 3` to fill in the gaps between those multiples of 4. The formula for
    `x` generalizes to


    The function above is the `pToX` function (for posit-to-`X`) and the code for
    it is in [Appendix A](#appA.xhtml#appA). If the formula produces –∞, it returns
    `Indeterminate` to accommodate all the cases where the result is not a real number,
    as the Not-a-Real (`NaR`) value.


    The tent-shaped relative accuracy curves double in width with each increase in
    `eS`, but the top of the fovea drops by about 0.3 decimals because the fraction
    has one less bit.


    Here is a plot of 16-bit posit decimal accuracy with `eS` set to 0, 1, 2, and
    3.


    ![Accuracy plots for 16-bit posits as eS ranges from 0 to 3](images/pg45_1.jpg)


    Accuracy plots for 16-bit posits as `eS` ranges from 0 to 3


    In that figure, the wobble is simplified as a bar, and the annotated accuracy
    refers to the *minimum* accuracy.


    ## 3.2 *Ghost Bits* and the *Twilight Zone*


    As an example, let''s look at the posit ring for 6-bit precision and `eS = 2`:


    ![Ring plot for 6-bit posits with 2 exponent bits](images/pg45_2.jpg)


    Ring plot for 6-bit posits with 2 exponent bits


    We need a notation for the number of bits of precision `n` and the exponent size
    `eS`. Let''s use angle brackets 〈`n, eS`〉, so the above ring shows “`posit〈6,
    2〉`” format.


    The ring plot shows 2 exponent bits, shown in **blue**. But wait, you say; some
    of the values do not have *any* exponent bits, and some have *only one* exponent
    bit. Not true; there are always 2 exponent bits, but any bits beyond the end of
    the number are `0` bits, just as we did for the fraction bits. Ghost bits can
    be exponent bits.


    The area where the exponent bits are partly or entirely beyond the least significant
    bit (LSB) is called the *Twilight Zone* because years of experience has shown
    this slightly-weird region to be the source of most of the bugs in creating a
    posit environment.


    Consider the value 1024 in the ring, with posit representation `011101`. The right
    way to think of that is as six stored (explicit) bits followed by an infinite
    string of ghost bits, and in this case, the first ghost bit is the second bit
    of the two-bit exponent field:


    ```

    011101|000000⋯

    ```


    It is even possible for regime bits to be ghost bits, implied `0` bits beyond
    the stored bits. For example, look at the representation of -1 / 65 536:


    ```

    111111|000000⋯

    ```


    The opposite bit that ends the regime is in the trailing `0` bits, not shown explicitly.


    As an example of the kind of mistake that is easy to make, suppose we want to
    encode the number 600 in the closest `posit〈6, 2〉` form, properly rounded. We
    have a choice between 256 or 1024, both of which are in the Twilight Zone. The
    halfway point between the two numbers is (256 + 1024) / 2 = 640, which might make
    it seem like 600 should round down to 256 as the closer point. However, that is
    not the way rounding works. You instead ask, “If we had `posit〈n + 1, eS〉` format
    instead of `posit〈n, eS〉` format, what would be the new halfway point and which
    side would the value be on?” Bit `n + 1` might be an exponent bit, not a fraction
    bit.


    If we had seven bits instead of six, we could represent `0111011`, which would
    decode as 512. Since 600 is greater than 512, the nearest representation as a
    posit is to round *up*, to 1024. This is consistent with our definition of relative
    error, since the relative error of choosing 1024 is |ln(1024 / 600)| ≈ 0.5 but
    the relative error of choosing 256 is |ln(256 / 600)| ≈ 0.9. On a logarithmic
    scale, 600 is closer to 1024. In the Twilight Zone, the tie point is also a point
    where relative accuracy is continuous instead of having a slight discontinuity
    (see [Section 2.4](#chapter2.xhtml#sec2_4)).


    ## 3.3 Is the Opposite Bit in the Regime “Wasted”?


    Another common initial reaction to the posit format is that the terminating bit
    of the regime is a “wasted” bit, and there ought to be a way to define it differently
    so that every bit counts. So, *is* it wasted?


    In the `posit〈6, 2〉` format, suppose we have `x = 010111` representing 12, and
    we add 2 to that. The result of 14 is midway between representable values 12 and
    16 and the nearest even binary is 16 = `011000`. We need to round *up*. Notice
    what happens to the last four bits when we increment the posit representation
    for 12. Taking the color-coding away, `010111` increments to `011000`. The amazing
    thing is that the carry extends the regime by one more bit, the most-significant
    exponent bit turns into the opposite bit terminating the regime, and the exponent
    shifts over by one place to form the last two represented bits of the posit. All
    fraction bits become ghost bits. This happens *automatically*. The result, 16
    = `011000`, is exactly what it should be. There is no need to check for carry
    overflow in each field. Everything just works.


    The terminating bit of the regime is essential for this to work. It is definitely
    not wasted. Every bit counts.


    A common mistake is to worry about rounding the fraction part, and once that is
    rounded, assemble the parts of the posit (sign bit, regime, exponent, and fraction).
    This will create more bugs than you find in a tropical rainforest. Always assemble
    the parts of the posit, computed with extra bits of precision, and *then* apply
    rounding.


    ## 3.4 Converting Real Numbers to Posits


    [Section 3.1](#chapter3.xhtml#sec3_1) showed how to turn a posit bit string `p`
    into a real number `x` (or `NaR`). This section explains the algorithm that converts
    a real number `x` (in any format) into a posit string `p`. This routine is called
    `xToP`, and the code for it is in [Appendix A](#appA.xhtml#appA). For clarity,
    this method takes the absolute value of the input, but it is also possible to
    directly convert a real value without doing that. Assume the following quantities
    have been defined or computed as global variables based on the requested precision
    `n` and exponent size `eS`:


    *   `uSeed` is `2^(2*eS)`.

    *   `minPos` is the smallest positive posit value, `uSeed^(2-n)`.

    *   `maxPos` is the largest positive posit value, `uSeed^(n-2)`.


    In the following, assume `n > 2`. The algorithm for `n = 2` can be expressed in
    a single sentence: “Any non-real becomes `NaR`, `10`; zero becomes `00`; positive
    reals become `01`; and negative reals become `11`.”


    ### 3.4.1 Check for Non-Real Inputs


    The first step is to determine if the input `x` represents a real number. If it
    is stored in integer format, that works. Integers are real numbers. It could also
    be a complex number `a + b i` where `b` happens to be zero. It could be an input
    string like **“1.6e-19”** that follows the rules of a computer language for expressing
    a real number in scientific notation. If it fails the test of being a real number,
    return the `n`-bit string for `NaR`, `1000⋯000`.


    ### 3.4.2 Take the Absolute Value and Check for Special Cases

