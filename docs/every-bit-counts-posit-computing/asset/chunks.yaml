    ## 2.7 Relative Accuracy in Fixed-Point and Scientific Notation


    Suppose we use `fixed8` and the correct answer is $\frac{1}{8}$ = `0000.0010`,
    but the calculation misses and produces $\frac{3}{16}$ = `0000.0011` instead.
    That is an error of one ULP. As a relative error, though, it is $\left| {\log(\frac{3}{16}/\frac{1}{8})}
    \right| \approx 0.41,$ which is a rather poor result. The result has only about
    0.38 decimals of relative accuracy.


    At the other extreme, suppose the correct answer is $\frac{127}{16}$ = 7.9375
    = `0111.1111` but the calculation is too low by just one ULP, so that we instead
    get $\frac{126}{16}$ = 7.875 = `0111.1110`. The resulting relative error is a
    much smaller number: $\left| {\log\left( {\frac{127}{16}/\frac{126}{16}} \right)}
    \right| \approx 0.008$ and we have about 2.1 decimals of relative accuracy. So,
    fixed-point format suffers a wide range of relative accuracy that becomes smaller
    for small magnitude results.


    In scientific notation, an ULP is an error in the last decimal of the significand,
    assuming the exponent is correct. Like, 2.99 × 10⁸ versus 3.00 × 10⁸ for the speed
    of light in meters per second.


    So “decade” in this context has nothing to do with a 10-year span of time. It
    is a numerical range that spans 10 dB. If a number format has a minimum positive
    value of `10^(-6)` and a maximum positive value of `10^6`, we might say, “the
    format covers twelve decades of dynamic range.” Another common term is *order
    of magnitude*, so if something is off by a factor of a thousand, either too small
    or too large, it is off by “three orders of magnitude” (log base 10 of a thousand).


