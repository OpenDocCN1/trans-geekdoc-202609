    “一切理论的最高目标，是使不可约的基本要素尽可能简单，而又不放弃对任何单一经验事实的充分表达” ¶ —*阿尔伯特·爱因斯坦*，1933


    爱因斯坦这番话的民间意译通常是：“理论应尽可能简单，但不能过度简化。”这更简洁，虽非其原话。


    Posit 的设计秉持爱因斯坦的观点。如果我们能在数学层完成整个计算，而无需担心物理计算机的有限性，那将是美妙的，但这通常要么不可能，要么即便可能（需使用符号方法而非仅数值方法）也会因过于复杂而运行极慢。鉴于我们*必须*在计算层和人类层使用有限精度，且我们希望可表示数字的分布类似于所有计算均精确时值的分布，posit
    就是尽可能简单的了。但不能更简单。


    ## 3.7 非事物的当前状态


