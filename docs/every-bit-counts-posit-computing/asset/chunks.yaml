- raw: '![Functions designed to be discontinuous for which the neighborhood rule does
    not apply](images/pg129_1.jpg)


    Functions designed to be discontinuous for which the neighborhood rule does not
    apply


    The neighborhood rule does not apply to these; they should not return NaR for
    real input because the behavior at the discontinuity is *well-defined*.


    The **next** and **prior** functions are also not covered by the neighborhood
    argument, because they are functions of *bit patterns*, not real numbers. As such,
    there is no guarantee that a NaR will propagate correctly if a programmer really
    wants to do something as dangerous as manipulate posit bit patterns. If you think
    of the posits on the ring of projective reals, **next** moves one position counterclockwise,
    and **prior** moves one position clockwise. So, **next**(NaR) is -maxPos and prior(NaR)
    is maxPos, up at the top of the ring of posits.


    This is another example of drawing the line between being an arithmetic standard
    or a language standard. Most languages require that inputs are promoted to the
    precision of the highest-precision input, to preserve as much information as possible.
    However, one could argue that that is like putting lipstick on a pig; if there
    is just one low-precision input, all inputs should be *demoted* to that low precision
    since the low accuracy will propagate to the output anyway. The Posit Standard
    does not take a side but merely says all posit inputs have to be the same precision,
    and whatever it is, that is the precision of the output.'
