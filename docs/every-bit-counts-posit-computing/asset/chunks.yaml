- raw: 'The **pToX**(*p*) function is the easiest to code and to get right; there
    are 2*^n* possible bit patterns for an *n*\-bit posit, so for small *n* you can
    generate and display the real *x* value and check that the routine is decoding
    every *p* correctly. You do not have to worry about rounding. But the **xToP**(*x*)
    function is more challenging since there are many more possible inputs *x* than
    the number of possible outputs *p*, and there are many opportunities to create
    off-by-one programming errors. Here are example plots of a posit〈6, 1〉 environment
    using the **pToX** and **xToP** functions in [Appendix A](#appA.xhtml#appA).


    ![](images/pg56_1.jpg)


    The plot on the left should always look like a discrete version of *y = x*, where
    the input and output posit bit strings are treated as signed integers. The plot
    on the right is a log-log plot; it uses the log[2] of *x* values from *minPos*
    to *maxPos* (in this case, $2^{- 16} = \\frac{1}{65536}\\,\\text{to}\\, 2^{16}
    = 65536$ ). It should look like a staircase wobbling about the line *y = x*, with
    increased wobble at the smallest and largest magnitudes. If there is a bug in
    either **xToP** or **pToX**, it usually shows up instantly in these “round-trip”
    plots.


    ## 3.5 A Simple Notation for Rounded Arithmetic


    When FORTRAN was introduced in the 1950s, it was touted as “FORmula TRANslation,”
    hence the name. It allowed you to write algorithms with a notation very similar
    to algebraic notation, albeit with an asterisk “**\***” for the multiplication
    operator, and a few other tweaks. You could declare variables a, b, and c to be
    of REAL type and then write a line of code like


    ```

    c=a+b

    ```


    and it looked for all the world like you were computing with real-valued variables.
    But that was a deception. If the variables are *integers*, then it is a fairly
    honest thing to do because you really will get the correct integer unless there
    is underflow or overflow. But with *real* values? Not likely.


    For most of the many possible input values a and b, you will not get a REAL that
    exactly expresses “a + b” nor will the computer tell you anything about how far
    off it is from the correct value. FORTRAN has lost its all-caps look and become
    Fortran, and it is now fading as a computer language. But it made more than one
    generation of programmers highly vulnerable to the surprise that what looks like
    real-number math on a computer is not exact math at all, but instead is an approximation
    that can sometimes go horribly wrong without warning.


    One can imagine a rigorous programming language where you have to write


    ```

    c=ROUND (a+b)

    ```


    or else you get an error message from the language compiler. But that would make
    code look pretty ugly.


    Here is an idea that might at least find its way into Integrated Development Environments
    (IDEs) if not actual source code for a language. IDEs can color-code your program
    with different colors for comments, keywords, and so on, even if that is not part
    of the official language you are programming in. An IDE that understands rounding
    error and makes the hazards visible could be a huge help to the programmer.


    Suppose we compute a value with exact math, convert that to an expressible (exact)
    posit using correct rounding, then convert the posit back to its mathematical
    value? In other words,


    This assumes that the **a** *op* **b** on the right hand side is computed in the
    Math Layer, that is, exactly. Throughout this book, the overbar operator is assigned
    to that composite function **pToX**(**xToP**(…)). So


    means that exact inputs *a* and *b* will be added exactly, rounded to the nearest
    real that posits can represent, and then presented back to the programmer as a
    value that can be expressed without rounding error.


    That is much less intrusive than having to type “**ROUND**” everywhere. Some papers
    on rounding error put a circle around the + - × / operators for their rounded
    versions, like “⊕” for “rounded addition.” But how would you do that for square
    root, or cosine? The overbar works for every operator. And you can use it on constants
    and single-argument operators as well. For example,


    instructs a computer to round the real value 3.1 to the nearest representable
    posit value, then compute the log base 10 of that to enough accuracy that the
    nearest representable posit is known. It still looks a lot like log[10](3.1),
    but the overbar decorations remind you that *you need to be suspicious*. This
    definition of the overbar as an operator is part of the code in [Appendix A](#appA.xhtml#appA),
    and you will see a lot of it in this book.


    ## 3.6 As Simple as Possible, But No Simpler


    ![“The supreme goal of all theory is to make the irreducible basic elements as
    simple as possible without having to surrender the adequate representation of
    a single datum” ¶ —Albert Einstein, 1933](images/pg59_1.jpg)


    “The supreme goal of all theory is to make the irreducible basic elements as simple
    as possible without having to surrender the adequate representation of a single
    datum” ¶ —*Albert Einstein*, 1933


    The folk paraphrasing of Einstein''s words is usually something like, “A theory
    should be as simple as possible, but no simpler.” Which is more succinct, though
    not his exact words.


    Posits are designed with Einstein''s viewpoint. It would be wonderful if we could
    do an entire calculation in the Math Layer and never have to worry about the finite
    nature of physical computers, but that is usually either impossible or is so complicated
    to do (by using symbolic methods, not just numerical methods) that it would run
    very slowly. Given that we *must* use finite precision in the Compute Layer and
    the Human Layer, and that we want the distribution of representable numbers to
    resemble the distribution of values that would occur if all computations are exact,
    posits are about as simple as possible. But no simpler.


