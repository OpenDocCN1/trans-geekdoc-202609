- raw: 'Suppose we use **fixed8** and the correct answer is $\\frac{1}{8}$\= **0****000.0010**,
    but the calculation misses and produces $\\frac{3}{16}$\= **0****000.0011** instead.
    That is an error of one ULP. As a relative error, though, it is $\\left| {\\log(\\frac{3}{16}/\\frac{1}{8})}
    \\right| \\approx 0.41,$ which is a rather poor result. The result has only about
    0.38 decimals of relative accuracy.


    At the other extreme, suppose the correct answer is $\\frac{127}{16}$\= 7.9375
    = **0****111.1111** but the calculation is too low by just one ULP, so that we
    instead get $\\frac{126}{16}$\= 7.875 = **0****111.1110**. The resulting relative
    error is a much smaller number: $\\left| {\\log\\left( {\\frac{127}{16}/\\frac{126}{16}}
    \\right)} \\right| \\approx 0.008$ and we have about 2.1 decimals of relative
    accuracy. So, fixed-point format suffers a wide range of relative accuracy that
    becomes smaller for small magnitude results.


    In scientific notation, an ULP is an error in the last decimal of the significand,
    assuming the exponent is correct. Like, 2.99 × 10⁸ versus 3.00 × 10⁸ for the speed
    of light in meters per second.


    So “decade” in this context has nothing to do with a 10-year span of time. It
    is a numerical range that spans 10 dB. If a number format has a minimum positive
    value of 10^(−6) and a maximum positive value of 10⁶, we might say, “the format
    covers twelve decades of dynamic range.” Another common term is *order of magnitude*,
    so if something is off by a factor of a thousand, either too small or too large,
    it is off by “three orders of magnitude” (log base 10 of a thousand).


    Back to the subject of ULPs: If we have three significant decimals in our scientific
    notation system, a 1-ULP error near the bottom of the decade is 1.01 versus 1.00,
    which has a relative error of about 0.01 and a decimal accuracy of about 2 decimals.
    But at the top of the decade, 9.98 versus 9.99 is instead a relative accuracy
    close to 0.001, ten times smaller, and the decimal accuracy is close to 3 decimals.
    The decimal accuracy ramps up from 2 to 3 decimals for every power of ten in the
    scale factor 10*^n*, producing a decimal accuracy that looks like this sawtooth
    shape:


    ![The “wobble” in relative decimal accuracy for scientific notation is a full
    decimal from worst to best.](images/pg28_1.jpg)


    The “wobble” in relative decimal accuracy for scientific notation is a full decimal
    from worst to best.


    But that is a misnomer. The *precision* is not wobbling at all. The precision
    is a constant three decimals. This phenomenon should be called *wobbling relative
    accuracy* or *wobbling relative error*. Notice that the wobble is not from 2 to
    3 decimals, but from about 2.3 to 3.3 decimals since when used as a number system,
    the worst error happens midway between two representable numbers, as explained
    in [Section 2.4](#chapter2.xhtml#sec2_4).


    One way to reduce wobble is to use base 2 for the scale factor, not base 10 or
    base 16. That reduces the wobble to log[10](2) ≈ 0.3 decimals.


    With some number systems, including posits, the significand digits always represent
    a value between 1 and 2, ignoring the 2*^n* scaling factor and the sign.


    Early IBM mainframes used a form of scientific notation with powers of 16 instead
    of powers of 10, to be more suited to binary computers. But base-16 exponents
    make the wobble even worse than base-10 exponents. A real number slightly greater
    than 1 would be expressed with 16 times less accuracy than a real number slightly
    less than 1. Base-2 has much less wobble, as this figure shows:


    ![Using base 16 reduces relative accuracy and makes the wobble four times worse
    than using base 2.](images/pg29_1.jpg)


    Using base 16 reduces relative accuracy and makes the wobble four times worse
    than using base 2.


    Posits do not work like scientific notation, but they still represent binades
    times scale factors, so you see similar notches in their relative accuracy plots.


    For example, the shape of the sawtooth in the fovea region of **posit8** is exactly
    like the sawtooth shape in the previous accuracy plots:


    ![This is a close-up view of the fovea, overlayed by part of the usual accuracy
    plot.](images/pg30_1.jpg)


    This is a close-up view of the fovea, overlayed by part of the usual accuracy
    plot.


    ## 2.8 Losing Something in Translation


    Here is the picture to keep in mind when using a computer to do calculations on
    real numbers:


    ![These are the three layers to remember when using computers to work with real
    numbers.](images/pg30_2.jpg)


    These are the three layers to remember when using computers to work with real
    numbers.


    The diagram shows three layers: Human, Computer, and Mathematical. It also shows
    an example of how a simple-looking calculation like “1.1 + 1.2” can wind up pretty
    butchered by the three rounding steps. The example in the diagram uses the **posit8**
    set for the compute layer, but the same thing would happen with fixed-point or
    floating-point or any other representation with binary representation. The reason
    is that 1⁄10 = 0.1 in decimal becomes an infinite repeating pattern in binary,
    **0.0001100110011**⋯ the same way ⅓ becomes the infinite repeating pattern 0.333333⋯
    when expressed as a decimal.


    Input rounding occurs when decimals get turned into binary. Here, the closest
    binary to 1.1 is **1.00011** =$\\frac{35}{32}$\= 1.09375. The closest binary to
    1.2 is **1.0011** = $\\frac{19}{16}$\= 1.1875. The only time there is no rounding
    is when a decimal just happens to be exactly expressible as a finite binary string,
    like 0.375 = **0.011**. It is not just fractions that suffer input rounding. If
    you try to add 9 and 11, for example, neither integer is in the vocabulary of
    **posit8**, and a computation will round those inputs. Any number system that
    has a decent dynamic range will have this problem: Large values *sample* the space
    of integers, skipping over swaths of them instead of including all of them in
    an interval by simply counting up.


    The translation *to* the Math Layer is perfect. If you''ve got the time, God''s
    got the integers. The computation in the Math Layer does not need to be perfect.


    That is, the Math Layer takes into account that there will be rounding to go back
    to the Compute Layer and therefore it can perform the *finite* amount of work
    necessary to reach that result. In the example, the rational numbers are added
    correctly to be $\\frac{73}{32}$\= 2.28125. The Math Layer is extra registers
    with more bits, hidden algorithms, and other techniques working with data that
    are not accessible to the user.


    *Compute rounding* is what happens whenever the result of an operation requires
    more bits to express than are available in the Compute Layer. The closest number
    in our vocabulary to $\\frac{73}{32}$ is $\\frac{9}{4}$\= 2.25.


    The final blow to correctness comes in *output rounding*, where a binary number
    is expressed in decimal. It is always possible to do that exactly, but it can
    be quite bulky, and doing so can give you the misimpression that you have far
    more significance in the answer than you actually have. For example, $\\frac{1}{1024}$\=
    0.0009765625 exactly, but if the $\\frac{1}{1024}$ was the result of a calculation
    involving rounding errors, then an output rounding of $\\frac{1}{1024}$≈ 0.001
    conveys the inaccuracy in the output. As a rule of thumb, the significance expressed
    in the output should not exceed (at least not by much) the significance expressed
    in the input, and “1.1 + 1.2” uses two-digit inputs. Hence, rounding the result
    2.25 to a two-digit output would become 2.2 in the Human Layer if we use banker''s
    rounding (ties go to the nearest even).'
