    ## Posit 舍入算法


    这是一个用于 posit 舍入的形式化算法，它表达该过程的方式与 第 3 章 中的描述略有不同。如果 `x` 可以精确表示为 posit，则无需执行任何操作。如果
    `x` 超出动态范围，则饱和到有符号的 `minPos` 或 `maxPos`。否则，`x` 位于两个相邻的 `n` 位 posit 值 `u` 和 `w`
    之间。图示可能有助于直观理解上述算法。回顾 第 1 章 和 第 3 章 中的射影实数与环形图，并放大观察环的其中一部分：


    ![有关的实数值 x 位于由 U 表示的 posit 值与高出 1 ULP 的值之间](img/pg124_1.jpg)


    有关的实数值 `x` 位于由 `U` 表示的 posit 值与高出 1 ULP 的值之间。


    实数值位于环的外侧。值 `u` 和 `w` 是连续的 posit 值（它们之间没有其他 posit）。我们需要舍入到 `u` 或 `w`。


    当你向 posit 追加一个 `0` 位时，它所表示的值不变，但追加一个 `1` 位则表示一个新的中间值；该算法向 `U` 追加一个 `1` 位并将其写为
    `U1`。`U1` 所表示的实数值为 `v`，如下所示：


    ![如果位数是 n + 1 而不是 n，新引入的点会告诉我们该如何舍入 x。](img/pg125_1.jpg)


    如果位数是 `n` + 1 而不是 `n`，新引入的点会告诉我们该如何舍入 `x`。


    在图中，这决定了 `x` 应舍入到 `u`，因为 `x` 位于 `u` 和 `v` 之间。如果 `x` 位于 `v` 和 `w` 之间，则应舍入到 `w`。如果
    `x = v`，平局情况将舍入到 `u` 或 `w` 中以 `0` 位结尾的那个（“舍入到偶数”）。


    科学计算中的许多基本运算可以利用 quire（精度累加器）尽可能长时间地停留在数学层。如果我们用 `i` 表示虚数 `$\sqrt{-1}$`，那么相乘两个复数
    `a + b i` 和 `c + d i` 需要计算实部和虚部的两个表达式：


    `a·c − b·d` 和 `a·d + b·c` 都是点积。在 quire 中完成它们然后再转换回 posit 格式，可将舍入次数从三次减少到一次。


    使用 quire 还解决了一个经典问题，即基于浮点数对的复数运算：程序员发现，如果他们声明一个变量为复数类型并让计算机处理上述乘法等运算，其运行速度会比用实数变量而非复数变量写出乘积表达式（如上所示）显著且莫名其妙地慢得多。为什么？因为复数运算例程试图在计算
    `a·c, b·d` 等时避免灾难性的下溢或上溢。程序员可能知道不存在上溢危险，但数学库例程不知道这一点并假设最坏情况，因此它们会经过大量复杂的操作来避免上溢和下溢并产生正确舍入的答案。


    在并行计算融合运算时，可能会想在将中间结果发送到另一个处理器之前对其进行舍入。这是不允许的，因为它会导致不可重现性。例如，单个处理器可能使用 quire 变量
    `q` 计算 posit 和 `a + b + c + d`，然后将 `q` 舍入为 posit `s`。即 `$s = \overline{a+b+c+d}.`
    如果一个处理器在 quire 变量 `q[0]` 中计算 `a + b`，另一个在 `q[1]` 中计算 `c + d`，它们需要交换 `q[0]` 和 `q[1]`，而不是先将它们舍入为局部和。这使得融合并行运算保持在数学层，直到完成。Posit
    可以恢复加法的结合律，直到极大数量的加法（quire 求和上限）。


    话虽如此，quire 可能有些大材小用。例如，执行融合乘加运算需要少于 `16*n` 位，因此系统设计者可以选择用其他更经济的方式来执行融合乘加运算。Posit
    标准在引用段落的最后一句中明确允许这样做。


    脚注指出，数学函数列表（Posit 标准的下一节）中由复合运算构成的任何运算都必须表现得像融合函数一样。例如，计算 `rSqrt(x)` 意味着 `$\overline{1/\sqrt{x}}`，而不是
    `$\overline{1/\overline{\sqrt{x}}}`。


    许多语言环境提供的优化以牺牲可移植性（以及对标准的遵从性）为代价来提高速度。有时可移植性远不如尽可能快地运行重要，工作组也认识到了这一点。然而，要使计算环境符合
    posit 标准，必须至少有一种遵循 Posit 标准的运行模式。例如，Posit 标准未规定表达式未加括号时的运算顺序，但它确实要求至少有一种模式，其中顺序由源代码和语言的语法规则
    `deterministic`（确定性地）决定，只有这些模式才是符合 posit 标准的。


    ## 5.6 Posit 标准函数


    在不引入微积分概念的情况下编写本节很困难；我们的目标是让受过中学数学教育的任何人都能理解所有内容。“任意接近于一个唯一的实数”这一措辞唤起了 `limit`（极限）的概念。用简单英语表达该规则的一种方式是：我们习惯说实数的
    2 乘 3 等于 6，因为约 2 乘约 3 约等于 6。但零除以零是什么？约零除以约零是 `indeterminate`（不定式）。如果“约零”意味着介于
    −0.001 和 0.001 之间，那么它将包含 `$\frac{-0.001}{0.001} = -1`$、 `$\frac{-0.0001}{0.000001}
    = 100`$ 和 `$\frac{-0.001}{0} = \pm \infty`$。它可以是任何实数，也可以是 ±∞。这就是为什么 `$\frac{0}{0}`$
    必须求值为 `NaR`。当分母为零时，除法运算在其输入上不是 `continuous`（连续）的。


    这里的数学内容稍微有点深奥。我们不说“约”，而说“在复平面上该值的一个 `open neighborhood`（开邻域）内。”下图将邻域显示为圆形，但它们可以是任何开连通区域，即不包含其边界的区域。


    ![输入参数为 x 和 y 的函数 f，及其在复平面上的开邻域](img/pg128_1.jpg)


    输入参数为 `x` 和 `y` 的函数 `f`，及其在复平面上的开邻域。


    如果我们无法通过使输入邻域任意小来使结果区域在实数结果周围任意小，则结果为 `NaR`。称之为“邻域规则”。这不同于说“函数必须连续”，因为它可能在复平面上连续却不是实数，就像
    arcsin 函数在值大于 1 时的情况。


    幂函数是 `pow(x, y) = x^y`。根据邻域规则，`pow(0, 0)` 必须返回 `NaR`。在任何包含 0 的开邻域中，`y` 同时具有负值和正值。零的负数次幂是
    ±∞。


    IEEE Std 754 标准有着截然不同的理念。它规定 `pow(x, ±0) = 1`，即使 `x` 是（安静的）`NaN`。这是浮点数中不定 `NaN`
    结果在计算中消失的几种方式之一，用户永远不会知道出了什么问题。IEEE 标准为幂函数列出了不少于 `twenty` 个例外情况，诸如“`pow(±0, y)
    is ±0 for finite y > 0 an odd integer`”之类。Posit 标准用上述简单规则处理所有这些例外，它更加小心地传播 `NaR`
    值，而不将输入视为精确数字，因为它们通常 `have come from a rounded result`（源自舍入结果）。


    图表显示了“第 5.2 节 不连续函数除外”这一措辞的原因：

    '
