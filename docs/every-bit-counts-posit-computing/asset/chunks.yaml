- raw: "The next stage of the farewell to IEEE floats was the rise of Machine Learning\
    \ (ML), and Artificial Intelligence (AI) that actually lived up to its decades-old\
    \ promise. But 32-bit IEEE floats were overkill for what was needed, and the 16-bit\
    \ IEEE floats had insufficient dynamic range. Thus began a free-for-all with companies\
    \ designing their own ways to represent real numbers, very much like the days\
    \ before the 1985 Standard came out and every vendor had its own way of doing\
    \ things. That is where things stand as I type this; full support for IEEE Std\
    \ 754 in hardware is almost extinct. We need not mourn the loss, because we are\
    \ once again open to a clean-slate, *mathematical* design for a real number format.\n\
    \nMuch of the preceding history is not in previously-published form. It is from\
    \ the many hours of conversations I have had with John Palmer, William Kahan,\
    \ and others who were part of the process.\n\n## 4.8 Lessons Learned\n\nThe mismatch\
    \ between how humans like to record and process numbers and how machines can best\
    \ store and manipulate them has been going on for hundreds of years, with the\
    \ machines eventually becoming optimized. The most recent episode was trying to\
    \ use the bits on a computer to mimic human scientific notation, instead of taking\
    \ the approach that every bit counts.\n\nStandards committees should avoid any\
    \ members who have a conflict of interest, like large manufacturers of existing\
    \ products. This seems like common sense, but IEEE does just the opposite and\
    \ *requires* the presence of such manufacturers. The result is that we have a\
    \ floating-point “standard” that is actually a proprietary Intel design from the\
    \ 1970s, one that includes a raft of choices made by biased parties.\n\nAny engineering\
    \ effort should begin with a list of design goals. They often compete with each\
    \ other, but at least the tradeoffs can be decided with clarity. What should be\
    \ the design goals for a system of representing real numbers with a string of\
    \ bits in a modern electronic computer? There should be very little objection\
    \ to the following goals, starting with the most important ones:\n\n1.  The distribution\
    \ of the values represented should resemble the distribution of numbers needed\
    \ in calculations. That is, each bit pattern should be used approximately the\
    \ same number of times (this is the principal of “maximum entropy” from information\
    \ theorist Claude Shannon).\n\n2.  There should be no redundant bit patterns to\
    \ mean the same thing; every bit counts.\n\n3.  The output of a program should\
    \ be deterministic based on the source code and the input data, not affected by\
    \ invisible “modes” of operation. The precision used must be exactly what is specified\
    \ in the source code, no more and no less.\n\n4.  All math operations should be\
    \ correctly rounded. This, together with **3**, ensures perfect reproducibility\
    \ and portability across computer systems.\n\n5.  It should be easy to change\
    \ precisions, like it is to change integer precisions.\n\n6.  If a result is not\
    \ a real number, it should have a representation that propagates that condition\
    \ through every operation that follows so that the final output reflects the condition.\n\
    \n7.  It should be simple to build in hardware, and fast.\n\n    In the “Nice\
    \ to Have” category:\n\n8.  It should be easy to scale the precision to any number\
    \ of bits.\n\n9.  Real numbers should map monotonically to signed integers so\
    \ that they can use the same hardware for comparison operations.\n\n10.  Similarly,\
    \ the bit operation for negating a real representation should be exactly the same\
    \ as for negating an integer, so they can use the same hardware.\n\n11.  The results\
    \ of application computations should be as close to results for exact computations\
    \ as possible.\n\nRemarkably, the i8087 and thus IEEE Std 754 *failed every single\
    \ one of these goals*.\n\nThe next chapter is an annotated presentation of the\
    \ 12-page *Posit™ Standard (2022)* that was ratified by the Posit Working Group.\
    \ That Standard meets the first ten goals above and does a better job than floats\
    \ on number **11**.\n\n# 5 The Posit Standard, Annotated\n\n![That is the entire\
    \ Posit Standard (2022), simple and concise enough to fit on twelve pages.](images/pg99_1.jpg)\n\
    \nThat is the entire Posit Standard (2022), simple and concise enough to fit on\
    \ twelve pages.\n\nWriting a standard is very different from writing an explanation,\
    \ because the standard should be as concise as possible, and that means leaving\
    \ out examples and the reasons that the decisions were made the way they were.\
    \ Peter Lindstrom recommended that we write a document to accompany the Posit\
    \ Standard that supplies those examples and reasons, which is the function of\
    \ this chapter. Since the previous chapter explained the origins of IEEE Std 754,\
    \ it is only fair to give the backstory on where the Posit Standard came from.\n\
    \nThe chapters that follow do not depend on this chapter, so the reader should\
    \ feel free to skim this chapter if it seems to be getting dull.\n\n## 5.1 Singapore\
    \ Backstory\n\n![Downtown Singapore (the Marina Bay Sands in the foreground),\
    \ and Fusionopolis, home of Singapore's supercomputer centre and also the birthplace\
    \ of the posit number format and its standard document.](images/pg99_2.jpg)\n\n\
    Downtown Singapore (the Marina Bay Sands in the foreground), and Fusionopolis,\
    \ home of Singapore's supercomputer centre and also the birthplace of the posit\
    \ number format and its standard document.\n\nSingapore has an amazing record\
    \ of introducing big ideas to the rest of the world. The flash drive. Cell phone\
    \ cameras. Ketchup. In 2015, there were two technology visionaries in Singapore,\
    \ physicist Marek Michalewicz and the director of Singapore's NSCC supercomputer\
    \ centre Tin Wee Tan, who saw promise in the *unum* number format I had just published.\
    \ They arranged with Singapore's Agency for Science, Technology, and Research\
    \ (A\\*STAR) and the National University of Singapore (NUS) to bring me to that\
    \ country to continue development of next-generation arithmetic to replace the\
    \ outdated IEEE Std 754. We knew there was a disadvantage to overcome in unum\
    \ format: The unum format was *not* hardware-friendly. The unum format was a “peace\
    \ offering” to IEEE floats, an attempt to patch the flaws in that design by creating\
    \ a *superset* of IEEE floats with three new fields:\n\n![The original unum format\
    \ was an IEEE-style float with metadata appended](images/pg100_1.jpg)\n\nThe original\
    \ unum format was an IEEE-style float with metadata appended\n\nIt was a form\
    \ of interval arithmetic, but extended to allow interval endpoints to be closed\
    \ or open, and for the size of the exponent and fraction fields to vary as needed\
    \ by the calculation. The ubit was described in [Chapter 1](#chapter1.xhtml):\
    \ the presence or absence of a “⋯” to indicate there are more nonzero bits after\
    \ the last one shown. This self-descriptive bit allowed the management of floating-point\
    \ error to be automated (or eliminated). While they were fully supported in software\
    \ and one group in China managed to build a custom chip to use unum arithmetic,\
    \ working with unums proved to be much like working with character strings of\
    \ varying length, with a need to allocate and free memory dynamically.\n\nOne\
    \ way to use unums was to fix the exponent and fraction size and round after every\
    \ operation, which allowed them to mimic, perfectly, IEEE floats. But that “backward\
    \ compatibility” also prevented unums from meeting the design goals listed at\
    \ the end of [Chapter 4](#chapter4.xhtml). There were redundant bit patterns,\
    \ two ways of expressing the same real value. They did not map monotonically to\
    \ signed integers."
