- raw: 'You may be thinking, “Why not have the computer do the extra work of computing
    in decimal, eliminating the input and output rounding errors?” It is a great question.
    Sometimes, that is indeed what should be done. There are computer number formats
    that support exact decimal representation. However, the argument for computing
    in binary format goes like this: Typically, you do vastly more compute rounding
    than input rounding or output rounding. Computing with decimal formats is at least
    twice as slow as computing in binary formats. If you enter a number, perform thousands
    of (rounded) calculations, and format the result for output, then using decimal
    format protected you for only two of all of those thousands of calculations. And
    decimal format slowed you down by at least a factor of two. Usually, that is not
    a good tradeoff.


    Before leaving the topic of translation error, there is an important question
    to answer for every binary number format: What is the minimum number of decimals
    needed to express a binary result such that it converts back to that same binary
    result? For example, the smallest positive value in **posit8** is $\\frac{1}{64}$\=
    0.015625, but do you need all those decimals to ensure that when it is converted
    back to a **posit8** value, it converts to $\\frac{1}{64}$? Would 0.0156 suffice?
    How about 0.016?


    It turns out that all you need is 0.02, just a single decimal of significance,
    to make sure it converts back to $\\frac{1}{64}.$ That is economical, *if* you
    are sure that “0.02” in the Human Layer will be converted back to that same low-precision
    format the next time that value is needed.


    Near the middle of the range where **posit8** values have more significance, you
    need as many as three decimals to express them such that they convert back to
    the correct posit. For example, consecutive **posit8** values $\\frac{33}{32},\\frac{17}{16},\\frac{35}{32}$
    are expressible as exact decimals 1.03125, 1.0625, 1.09375, but all you need is
    1.03, 1.06, and 1.09 to make sure they convert back to $\\frac{33}{32},\\frac{17}{16},$
    and $\\frac{35}{32}.$


    A small program lets us test every value to see how many decimals are needed.
    It is related to the decimal accuracy, but it is not the same. It is much more
    chaotic, and it is difficult to find a closed-form equation for how many decimals
    are needed. Here is an empirical plot for the **posit8** values:


    ![For each 8-bit posit, a dark magenta dot shows the number of decimals needed
    to specify it uniquely.](images/pg33_1.jpg)


    For each 8-bit posit, a dark magenta dot shows the number of decimals needed to
    specify it uniquely.


    Perhaps 8 bits is somewhat too low of a precision to show the pattern. Here is
    the plot for the 16-bit posits mentioned at the end of [Chapter 1](#chapter1.xhtml):


    ![For 16-bit posits, a range of 1 to 5 decimals suffice to specify each one.](images/pg33_2.jpg)


    For 16-bit posits, a range of 1 to 5 decimals suffice to specify each one.


    That shows that five decimals suffice to express a **posit16** in a way that re-encodes
    as the same posit. But it also shows one of the advantages of tapered accuracy:
    For large-magnitude and small-magnitude values, it is more economical to express
    numbers with scientific notation, like “−6e−5” (five characters) instead of “−0.00006”
    (eight characters). Even though the “e” notation takes extra characters, it saves
    space for extreme magnitudes. With tapered accuracy, the more you need scientific
    notation, the fewer decimals need to be displayed. The smallest positive **posit16**
    value is $\\frac{1}{16384},$which can be expressed as “+6e−5”. For the higher-accuracy
    values like the ones in the fovea, five decimals are needed but not the “e” notation,
    like 1.0001, 1.0002, 1.0004 for the three **posit16** values that follow 1.0.


    ## 2.9 Defining *Overflow* and *Underflow*


    ### 2.9.1 The Overflow Fallacy


    A common misconception is this one:


    That is not quite true, because a result can legitimately *round down* to the
    largest representable value and thus stay in range. So we offer this definition
    instead:


    For an example with an 8-bit fixed-point format, the negative number of greatest
    magnitude is −8. Numbers are spaced $\\frac{1}{16}$\= 0.0625 apart, so tie points
    are $\\frac{1}{32}$\= 0.03125 from each value in the vocabulary. Any result *x*
    where *x* is in the interval (-8.03125, -8) rounds to -8 without being an “overflow.”
    For positive values, the largest value in **fixed8** is 7.9375, and $\\frac{1}{32}$
    beyond that is 7.96875, so values in (7.9275, 7.95875) do not overflow even though
    they are larger than the maximum representable real number in the format.


    There is a similar definition for underflow. Here we use “too small” to mean “too
    low in magnitude” (that is, too close to zero) and not “too close to −∞.”


    Again using **fixed8**, we could multiply $\\frac{1}{16}$ and $\\frac{9}{16}$
    which has the exact result $\\frac{9}{256},$ but that has to be rounded to the
    smallest positive value $\\frac{1}{16}$ or be classified as underflow. The tie
    point is $\\frac{1}{32} = \\frac{8}{256},$ so it rounds up to $\\frac{1}{16}$
