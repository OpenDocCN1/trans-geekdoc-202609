    # 1 Posit 数字格式


    ## 1.1 思想的本质


    ![无论 x 最终是什么，都有一种方法仅用三位就在计算机上表示它。](img/pg1_1.jpg)


    无论 `x` 最终是什么，都有一种方法仅用三位就在计算机上表示它。


    大多数关于数学思想的书籍都会建立定义基础，让读者等待以了解事态的发展。相反，本第一章将用尽可能少的页数带你直达核心。稍后，我们可以探讨事物运作方式的底层细节和原因。


    这里有一个常见的误区：


    假设计算机使用三位来表示数字。共有八种可能的位模式，如果我们把它们视为普通的基数-2 `unsigned`（无符号）整数，它们在任何传统现代计算机上的含义如下：


    ![](img/pg2_1.jpg)


    这就是你能得到的一切。你可以用三位从零数到七，给最后一位加 `1` 并传播任何进位，就像小学加法一样，只是用二进制（基数二）代替十进制（基数十）。如果你试图给七的表示
    `111` 加 1，会发生溢出，因为你无法存储进位位 `1000`，所以它会绕回零，即 `000`。


    当计算机需要 `signed`（有符号）整数时，最常用的系统是：一旦最左边的位变为 `1`，数字就从正翻转为负，然后它们向上计数回到零，如下所示：


    ![](img/pg2_2.jpg)


    最左边的位（最高有效位，或 `MSB`）能快速告诉我们一个数是否为负，所以它常被称为 `sign bit`（符号位），这里的惯例是将其标为**红色**，因为会计师用这种颜色表示负数金额已久，以至于“入红”成了负债的同义词。


    `unsigned` 整数若从 `111` 向上计数会溢出，但 `signed` 整数若从 `011` 向上计数会溢出，所以这只是不连续点放在哪里的问题。如果你从负一
    `111` 向上计数，会忽略进位溢出得到 `000`，所以系统会自动做正确的事。


    *然而*：假设你改为给位模式赋予以下含义：


    | 位模式 | 含义 |

    | --- | --- |

    | `000` | 0 |

    | `001` | 实数 `x`，满足 0 < `x` < 1 |

    | `010` | 1 |

    | `011` | 实数 `x`，满足 1 < `x` < ∞ |

    | `100` | 任何非实数 |

    | `101` | 实数 `x`，满足 -∞ < `x` < -1 |

    | `110` | -1 |

    | `111` | 实数 `x`，满足 -1 < `x` < 0 |


    这覆盖了整条实数线，-∞ < `x` < ∞，而且如果 `x` 甚至不是实数，它也提供了一种表示方法。我们将其简写为 `NaR`，意为“非实数”，它包括无穷大的形式、$\frac{0}{0}$
    等不定式、$\sqrt{-1}$ 等复数，甚至包括根本不是数字的东西，比如程序员试图将字符串 "zebra" 转换成这种数字格式。它*不是实数*。


    这不是一个非常精确的系统，但它*确实*为每个 `x` 提供了唯一的表示。


    最右边的位（最低有效位，或 `LSB`）标为**品红色**，称为 `ubit`（取自 **u**ncertainty **bit**，不确定性位，与 cubit
    押韵）。精确数用以 `0` 结尾的位串表示。以 `1` 结尾的位串表示精确值之间（或精确值与 ±∞ 之间）的*开区间*。`a` 和 `b` 之间的开区间写作
    (`a`, `b`)。例如，$\sqrt{2}$ 和 π 都用 `011` 表示，因为它们满足 1 < `x` < ∞。`ubit` 是 `unum` 运算的基础思想，`unum`
    是 "**u**niversal **num**ber"（通用数）的缩写。因此，它读作 "yoo-num"，而不是拉丁语 "oo-num"（如 *E Pluribus
    Unum* 中那样）。


    包含 `ubit` 就像写 $\sqrt{2} = 1.414\cdots$，其中 "\cdots" 意味着“最后一位显示的数字后还有非零数字：1.414
    < $\sqrt{2}$ < 1.415。”这在数学上是正确的。如果你说 $\sqrt{2}$ = 1.414，你犯的错误就像说 2 + 2 = 5 一样。"\cdots"
    的有无只需一位来表示，那就是 `ubit`，就像数的符号只需一位来表示一样。


    注意我们没有给 `000` 的符号位着色，以提醒零没有符号。我们也不给 `100` = `NaR` 异常着色，因为异常也是无符号的。我们也不给 `NaR`
    的 `ubit` 着色，因为把“非实数”视为精确量是讲不通的。


    注意 `unums` 映射到一个环上，因为就像 `signed` 整数格式一样，`111` 紧挨着 `000` 完全讲得通。实数值和 `NaR` 以**紫色**显示在环外，位串显示在环内。


    ![这个 unum 环图展示了整条实数线仅用三位映射的情况。](img/pg4_1.jpg)


    这个 `unum` *环图* 展示了整条实数线仅用三位映射的情况。


    有一个概念叫*射影实数*，意思是把实数线看作圆在直线上的投影，光源在圆顶：


    ![射影实数概念将无限直线映射到有限圆上。](img/pg4_2.jpg)


    *射影实数*概念将无限直线映射到有限圆上。


    我给这个古老概念添加了两点。第一是观察到 `signed` 整数以同样的方式优雅地映射到圆上，在圆顶翻转符号。第二是将 -1 和 1 放在圆的左右（东、西）点，使得在取数的*倒数*时关于水平轴对称。


    为节省空间，(`a`, `b`) 表示开区间 `a` < `x` < `b`。三位系统有八项*词汇*：{`NaR`, (-∞, -1), -1, (-1,
    0), 0, (0, 1), 1, (1, ∞)}。作为有序集，我们把 `NaR` 视作 -∞，小于所有其他项，尽管它也充当非实数的“垃圾箱”。


    我们可以对精确数和区间都做运算。例如，区间 (0, 1) 的平方正是同一组值，(0, 1)。这看似不算什么，但其实意味着该系统比任何计算器都强大。试着在计算器应用（或实体计算器，如今那已近乎古董）中输入一个
    0 到 1 之间的数并平方。对结果再平方。反复做下去，最终会发生两种情况之一：显示器错误地称结果恰好是 0，或称它是“非数字”。我刚在笔记本上试了试，得到了后一种情况。


    ![](img/pg5_1.jpg)


    计算器应用的软件肯定用了远不止三位。可它却给不出“1e-50 的平方是多少”这个数学正确答案，因为科学计数法只有两位指数，最小只能到 1e-99（即 10^(-99)）。计算器说
    10^(-100) 是“非数字”；我对此持异议。


    这是另一个不涉及下溢或上溢的例子。输入 2 并开平方。反复按开平方键，你会越来越接近 1。


