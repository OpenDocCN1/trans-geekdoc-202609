    ## 5.1 From Unums to Posits


    The efforts in Singapore soon led to the realization that the last two properties
    could be achieved by discarding IEEE Std 754 altogether and beginning with the
    ring plots shown in [Chapter 1](#chapter1.xhtml). There were elegant ways to keep
    the property that flipping the ring about its horizontal axis produced the reciprocal
    of a number perfectly, making division as easy as multiplication. In early 2016,
    these were introduced as “Type II unums,” rebranding the original as “Type I unums.”


    Type II unums always use the same number of bits, solving the objection to Type
    I, but introducing another difficulty: arithmetic required table look-up instead
    of the usual logic circuits. While Kahan had been characteristically critical
    of the original unum idea, in a public debate (June 2016) he stated this about
    Type II unums:


    [http://www.johngustafson.net/pdfs/DebateTranscription.pdf](http://www.johngustafson.net/pdfs/DebateTranscription.pdf),
    pages 17–18.


    Type II unums have their uses, and [Chapter 8](#chapter8.xhtml) will present one
    version. But it was the idea shown in [Chapter 1](#chapter1.xhtml) (giving up
    the idea of perfect reciprocals), that led to “Type III unums” that map to signed
    integers, are fixed size, and use all the standard logic circuits that chip designers
    presently use to design IEEE floating-point arithmetic. If the `ubit` is used
    to indicate the open interval between exact values, that is branded as a `valid`
    type, which have the error-free capability of Type I unums. If they are rounded
    after every operation, using the default banker''s rounding of IEEE floats, they
    are branded as `posits`. I invented posits in December 2016 with the geometrical
    approach in [Chapter 1](#chapter1.xhtml), with insight from Isaac Yonemoto in
    figuring out how regime bits are decoded, and presented them at Stanford University
    in February 2017. They appeared to be particularly well-suited for Machine Learning,
    as Yonemoto demonstrated live at the end of the Stanford lecture. Credit for the
    creation of posits also goes to DARPA, which provided funding for linear algebra
    solutions using next-generation arithmetic. Hence the footnote in the Posit Standard:


    The result was an international movement. The first paper, *Beating Floating Point
    at its Own Game: Posit Arithmetic* accumulated hundreds of citations as people
    tested the idea and designed hardware and software environments to support it.
    Without experimental data, that first paper made this initial guess:


    Initial guess (2017) regarding how many exponent bits would be best for different
    posit precisions


    A Posit Working Group was formed to establish a standard. It included experts
    from the US, Singapore, Canada, Germany, and the UK, all from universities or
    national research institutions; it *excluded* anyone with a commercial interest
    in selling computing hardware, to avoid the conflicts of interest evinced by IEEE
    committees:


    It took five years to make sure the Posit Standard was as simple as possible,
    but no simpler. During the five years, hundreds of papers were published testing
    posits of various precisions on a wide variety of applications, and they all pointed
    to the same empirical conclusion: The best results are usually for exponent size
    `eS` = 2 or `eS` = 3, for all precisions. That was especially important in testing
    8-bit posits for AI; an exponent size of 0 does not usually have enough dynamic
    range for the Machine Learning part of AI. So we changed the Draft Standard to
    this instead:


    Years of experiments showed all precisions should use the same `eS`.


    Then we realized a huge benefit to always having `eS` = 2 for all precisions:
    Conversion between precisions becomes trivial. Simply append zeros to raise precision,
    or round the least significant bits (as a binary fraction) to lower precision.
