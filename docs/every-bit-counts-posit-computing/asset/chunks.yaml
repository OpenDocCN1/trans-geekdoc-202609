  trans: "\n\n## 2.4 舍入与精度\n\n舍入规则可以总结为：“将实数 `x` 舍入到最近的 posit；如果两个 posit 距离相等，则选择以\
    \ `0` 位结尾的那个。”还有一些重要的额外细节，但目前这条规则足够使用。让我们先研究 `posit8` 集合中的三个连续值：`{7.5, 8, 10}`。`7.5`\
    \ 和 `8` 之间的临界点是 `7.75`。`8` 和 `10` 之间的临界点是 `9`。\n\n如果我们计算出的值恰好是 `7.5`、`8` 或 `10`，则精度为无穷大。在这些精确可表示的值之间，精度在临界点处降至最小。\n\
    \n![峰值实际上延伸至无穷大，因为在精确点 7.5、8.0 和 10.0 处精度为无穷大。](img/pg22_1.jpg)\n\n峰值实际上延伸至无穷大，因为在精确点\
    \ `7.5`、`8.0` 和 `10.0` 处精度为无穷大。\n\n请注意两个极小值处的轻微不连续性。这是由两个值 `x` 和 `y` 的*几何*平均数\
    \ `$\\sqrt{x \\cdot y}$` 与*算术*平均数 `(`x` + `y`)/ 2` 之间的差异引起的。不连续点位于中点，但这些*并非*十进制误差（定义为对数距离）最小化的位置。最小误差应出现在几何平均数处，即\
    \ `$\\sqrt{7.5 \\times 8} = 7.7459669\\cdots$` 和 `$\\sqrt{8 \\times 10} = 8.944\\\
    cdots$`，而不是算术平均数 `7.75` 和 `9`；在如此低的 8 位精度下，这种差异足以在图表中勉强看清。\n\n因此，数制的精度取决于舍入策略。根据我们对相对误差的定义，相邻值\
    \ `x[k]` 和 `x[k+1]` 之间最坏情况下的十进制精度出现在它们的算术平均数 `(`x[k]` + `x[k+1]`)/ 2` 处，相对于幅度较小的\
    \ `x`。\n\n在算术平均数处，最坏情况下的十进制精度为\n\n换句话说，数值词汇表的最坏情况十进制精度非常接近相邻点的十进制精度再加上 `log10(2)\
    \ ≈ 0.3`。\n\n下图展示了将一系列实数值舍入到 `posit8` 词汇表时的十进制精度图：\n\n![8 位 posit 拥有近 4 个数量级的动态范围，但最多只有\
    \ 6 个有效位。](img/pg23_1.jpg)\n\n8 位 posit 拥有近 4 个数量级的动态范围，但最多只有 6 个有效位。\n\n该图详细展示了整个数制在其动态范围内的精度，但精确点处垂直延伸至无穷大的尖峰使其难以阅读。让我们改为悲观地看待数值集合中每个点的*最坏情况十进制精度*。\n\
    \n下图仅显示了每个波谷的底部。如果忽略右半部分的锯齿状，它呈现出一个对称的帐篷形状。相对精度从零点向两侧逐渐降低。\n\n![这是精度图的常见形式：十进制相对精度作为幅度的函数。](img/pg24_1.jpg)\n\
    \n这是精度图的常见形式：十进制相对精度作为幅度的函数。\n\n对于更高精度的 posit，锯齿状不那么明显，十进制精度看起来更像一个在中心达到峰值的对称三角形。\n\
    \n一系列依赖于先前舍入结果的计算，其精度通常仅取决于最不精确的那一步计算，就像链条的强度仅取决于其最薄弱的环节。这就是为什么使用悲观的最小精度是合理的，并假设计算链会跌入每个波谷附近的底部。\n\
    \n还有另一种绘制十进制相对精度的方法，即将其作为 `bit pattern`（位模式）的函数绘制，该位模式被视为二进制整数，而非按 posit 格式规则表示的实数。这说明了有一半的位模式位于最高精度区域，该区域将在下一节定义。\n\
    \n![精度也可以作为 `bit pattern` 的函数绘制，此处展示了正数 8 位 posit 的情况。](img/pg24_2.jpg)\n\n精度也可以作为\
    \ `bit pattern` 的函数绘制，此处展示了正数 8 位 posit 的情况。\n\n## 2.5 中心区\n\n最高精度区域多年来一直被称为 posit\
    \ 用户口中的“最佳区”，但 Will Wray 想出了一个聪明、简短的词来称呼它：`fovea`（中心窝/视网膜中央凹），就像眼睛视网膜上分辨率最高的部分：\n\
    \n正如环形图所示，一半的 posit 都在中心区内。四分之一的 posit 的 regime 长度为三位（`001` 或 `110`），因此比中心区 posit\
    \ 少一位有效数字。八分之一的 posit 的 regime 长度为四位，依此类推。\n\n要获得 posit 的最精确结果，有助于尽量保持在中心区内或不远离它。游离到非常大或非常小的幅度，即使只是暂时的，也会导致相对精度损失，这种损失可能会传播到最终答案，使其精度降低。幸运的是，大多数现代数值方法已经过精心设计，以避免上溢和下溢，从而保持在动态范围的中心附近。这些方法已经非常适合\
    \ posit 了。\n\n![8 位 posit 的中心区范围为 `½ ≤ |x| ≤ 2`。](img/pg25_1.jpg)\n\n8 位 posit\
    \ 的 `fovea` 范围为 `½ ≤ |x| ≤ 2`。\n\n## 2.6 定点精度\n\n将数字按二的整数次幂缩放，就像移动基点位置。如果不必这样做，而是可以直接假设基点位置固定，会怎样？那将腾出用于指示缩放的位，用于增加尾数位。定点格式类似于美元和美分，基点右侧有两位数字。你可以将每个金额视为美分数（即\
    \ `$\\frac{1}{100}$` 美元）的整数倍。\n\n假设我们有一种 8 位格式，视为有符号整数，代表 `$2^{-4} = \\frac{1}{16}$`\
    \ 的倍数。即，它在基点右侧有四位，其能表示的 256 个不同值为：\n\n```\n\\begin{matrix} \n{\\mathbf{0000}\\\
    mathbf{.0000}} & \\text{0} \\\\ \n{\\mathbf{0000}\\mathbf{.}\\,\\mathbf{0001}}\
    \ & {\\frac{1}{16} = \\text{0.0625}} \\\\ \n{\\mathbf{0000}\\mathbf{.0010}} &\
    \ {\\frac{1}{8} = \\text{0.125}} \\\\ \n\\vdots & \\vdots \\\\ \n{\\mathbf{0111}\\\
    mathbf{.1111}} & {\\text{7~+}\\frac{15}{16} = \\text{7.9375}} \\\\ \n{\\mathbf{1000}\\\
    mathbf{.0000}} & {-8} \\\\ \n{\\mathbf{1000}\\mathbf{.0001}} & {- \\left( {7 +\
    \ \\frac{15}{16}} \\right) = - \\text{7.9375}} \\\\ \n\\vdots & \\vdots \\\\ \n\
    {\\mathbf{1111}\\mathbf{.1111}} & {= - \\frac{1}{16} = -0.0625} \\\\ \n\\end{matrix}\n\
    ```\n\n将正值称为 `fixed8` 集合。这些点等距分布。与 `posit8` 的精度图相比，正值集合的十进制精度图会是什么样子？这里它们在同一张图上：\n\
    \n![8 位 posit 与 8 位定点的精度图对比](img/pg26_1.jpg)\n\n8 位 posit 与 8 位定点的精度图对比\n\n图表显示，定点格式不支持宽动态范围，且小幅度值的表示精度远低于大幅度值。这通常不是技术计算所期望的。在某些应用中，定点格式正是所需（如金融程序），这也是绝对误差可能比相对误差更有用的场景。\n\
    \n## 2.7 ULP 与相对精度“摆动”\n\n术语 `ULP` 代表最后一位单位，它在衡量不精确度方面有一些用途。通常发音类似 \"gulp\"（咕噜），而不是\
    \ \"you-ell-P\"。测量 ULP 假设当你按二进制计数递增时，所表示的实数值也随之增加。这并非对所有实数格式都成立。它是衡量计算结果与（正确舍入的）精确结果之间距离的一种方法：它们的位串相距多远？\n\
    \n"
