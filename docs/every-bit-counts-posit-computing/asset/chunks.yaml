- raw: 'John Atanasoff, in late 1937 (independently of Zuse) realized the need for
    binary representation and Boolean arithmetic, but he wanted an all-electronic
    machine so he used vacuum tubes. The machine used 50-bit (equivalent to 15-decimal)
    integers, not floating-point, to solve systems of linear equations. Atanasoff
    conceived of the idea of a data store separate from whatever device performs arithmetic,
    and coined the term “memory” for that part of a computing device.


    ![The reconstructed 1942 Atanasoff-Berry Computer with its unprecedented ideas](images/pg76_1.jpg)


    The reconstructed 1942 Atanasoff-Berry Computer with its unprecedented ideas


    A scaled-down prototype was finished in 1938, and the full-scale design for solving
    up to 29 equations in 29 unknowns was finished in 1942. World War II effectively
    ended the efforts of both Atanasoff and Zuse.


    In 1940, John Mauchly and J. Presper Eckert were planning an *analog* device at
    University of Pennsylvania, but when Atanasoff communicated to Mauchly the idea
    of “true” computing, as he called it (what we now call *digital* computing), Mauchly
    and Eckert pivoted from building an analog Electronic Numerical Integrator (ENI)
    to building a digital Electronic Numerical Integrator And Computer (ENIAC), finished
    in February 1946. Instead of true binary with Boolean logic, they wanted the ENIAC
    to do arithmetic the way people do, so they used the on-off states of vacuum tubes
    to count from 0 to 9 and then do a carry operation, imitative of the classic algorithms
    for elementary school arithmetic that Fibonacci had conveyed from the Indians.
    Constants were ten-digit decimal integers, set by mechanical rotary dials; it
    held twenty such constants.


    ## 4.6 The Emergence of Bit-Field Mentality


    *Bit-field mentality* is a line of reasoning that goes something like this:


    That is what Quevedo and Zuse did. Had Quevedo actually built his design, he would
    have realized that the devil lies in the details. Zuse noticed that representing
    zero was hard, creating an exception to the rules of scientific notation. Bit
    field design stems from the urge to anthropomorphize, and it leads to inefficiency
    and nonmathematical behavior.


    In the early 1950s, when IBM was just introducing electronic (vacuum tube) computing,
    they used bit-field mentality to design their *integers*. “Let''s use the first
    bit to represent the sign of the integer, and the rest of the bits to represent
    the magnitude.” At the time, it seemed as good a way as any. Engineers could look
    at bit patterns and (almost) read the binary, with a little practice, since the
    signmagnitude representation mimicked the human way of writing integers with a
    “+” or “-” in front of positional-notation digits. Like, in six-bit precision,
    **0****00101** means +5 and **1****00101** means -5.


    But what about two ways to write zero, as “positive zero” **0****00000** and “negative
    zero” **1****00000**? Do they represent the same real number, zero? Or is there
    something else going on? If I test **1****00000** < **0****00000**, will the computer
    return True or False? The workaround is, *if the magnitude bits are zero, the
    sign bit does not count.* That means the hardware has to test for a special case,
    which slows things down; it also means “every bit counts” is not true, at least
    not always. It was one of the first cases of a redundant bit pattern: more than
    one bit pattern to represent the same number.


    That was just the beginning of problems with the humanlike sign-magnitude representation.
    Think back to grade school, probably around 5th grade, when you first learned
    about negative numbers and how to add and subtract signed integers. You had to
    master, in your mind, a flowchart that looks like this:


    ![How to add signed integers, elementary school style](images/pg78_1.jpg)


    How to add signed integers, elementary school style


    It was not long before more careful thinkers realized that using 2''s complement
    arithmetic (described in [Chapter 1](#chapter1.xhtml)) makes this entire flowchart
    go away and avoids “negative zero.” The circuits for adding unsigned integers
    and signed integers become one and the same, except for defining where they overflow.
    It was a less human-friendly way to encode integers, but much more computer-friendly,
    and every computer now uses 2''s complement format to store integers.


    When you combine bit-field mentality with anthropomorphized scientific notation,
    you get *floating-point format*. This is quite different from an engineering approach
    of first setting out desirable properties of a format as design goals. It is also
    different from the mathematical approach of asking what is a logical mapping of
    a set of bits to a vocabulary of real numbers.


    The most successful scientific computers of the 1950s were from IBM and a “word”
    of data was 36 bits, not 32 bits. The IBM 704 was the first commercial system
    to support floating-point arithmetic, with vacuum tubes as switching elements.


    ![The IBM 704 was a 1950s vacuum tube computer that supported floating-point arithmetic.
    Photo from Unità Centrale-Museo Scienza Tecnologia Milano](images/pg79_1.jpg)


    The IBM 704 was a 1950s vacuum tube computer that supported floating-point arithmetic.
    Photo from Unità Centrale-Museo Scienza Tecnologia Milano


    It could perform a floating-point add or subtract in 84 microseconds, which was
    quite a respectable speed for that era; to do a multiply or divide took about
    five times as long.


    That model and its more reliable transistor-based successors used this 36-bit
    format for single-precision floating-point numbers:


    ![Early IBM floating-point format](images/pg80_1.jpg)


    Early IBM floating-point format


    The word “Characteristic” is in quotation marks because it was IBM''s term for
    the exponent, but it is not the correct mathematical term. In the days when logarithm
    tables were used to multiply and divide numbers, the fraction part of log(*x*)
    was called the *mantissa*, and if you subtracted the fraction from log(*x*), the
    integer part that was left was the *characteristic*. So if the log(*x*) was 2.30,
    the mantissa was 0.30 (the part you looked up in the tables) and the characteristic
    was 2 (for which you were expected to be able to add or subtract with pencil-and-paper).
    But if the log(*x*) was -2.30, the mantissa was 0.70 and the characteristic was
    -3, always keeping the mantissa as a value between 0 and 1. As the above figure
    shows, that is *not* how IBM''s floating-point worked. The “Characteristic” bit
    field should have been called “Biased Exponent” where the bias is 128. To make
    matters worse, Arthur Burks started calling the fraction part the “mantissa,”
    again confusing floats with logarithms, and the confusion over terminology persists
    to this day.


    In the above example, the exponent bits represent *m* = 6 and the fraction bits
    represent $n = \\frac{18513}{2^{16}} \\approx 0.\\text{282486}$. The sign bit
    being **1** means the value is negative (sign-magnitude representation, like IBM
    used for signed integers in the 1950s). So the value is $- n \\times \\text{2}^{m}
    = - \\text{2}^{\\text{6}} \\times \\frac{18513}{2^{16}} = - \\frac{18513}{1024}
    \\approx - \\text{18}.0\\text{791}0\\text{1}$ (the accuracy was slightly more
    than 8 decimals). The documentation for the computer uses the above example and
    states that the value represented is -18.0790, which suggests that its author
    worked it out manually and made a transcription error or a rounding error.


    Because IBM also introduced Fortran in 1956, the first commercial language of
    higher level than Assembler and one that recognized the floating-point instructions,
    IBM began its path to dominance of scientific computing, with Sperry (the UNIVAC
    series) and Burroughs as its main rivals.


    IBM''s format looks much like the one proposed by Quevedo, with two exceptions:


    *   There is a way to represent negative values.


    *   The base of the scale factor is 2, not 10.'
