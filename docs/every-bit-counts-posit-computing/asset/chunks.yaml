- raw: 'For decades, Kahan raged that computer language standards should provide access
    to the processor flags, and he was ignored. It did not happen. Only in the last
    few years have the C and C++ language standards committees entertained the idea
    of supporting viewable processor flags, but it is probably too late. Legions of
    C and C++ programmers have no idea that there are versions of their language that
    let them know about processor flags. The Java programming language specifically
    *forbids* the use of processor flags, which led Kahan to write an amusing but
    not very mathematical diatribe titled, “How Sun''s Java Hurts Everyone Everywhere.”


    Some have objected to the tapered accuracy of posit format, saying tapered accuracy
    spoils classic theorems about accuracy that apply to floats. The objectors appear
    to be completely ignorant of the fact that IEEE float format has tapered accuracy.
    It is a strange tapering because it is only on one side, and it is steep.


    Researchers at Argonne National Laboratory, late in the 1990s, figured out an
    elegant way to have symmetrical tapered accuracy for large-magnitude numbers instead
    of wasting bit patterns on all the ways to represent NaN, and wrote a very cogent
    proposal to the IEEE 754 Committee to consider for their next revision: “gradual
    overflow.” The committee rejected it immediately. It would spoil backward compatibility.
    The only revisions that tended to be accepted in the 2008 and the 2019 revisions
    of IEEE Std 754 were the inclusions of new precisions, like half-precision and
    quadruple precision. Those were completely new, so they would not spoil the behavior
    of the float types previously specified.


    Speaking of overflow, let''s try Kahan''s $\\left. \\sqrt{x^{2}} = ~ \\middle|
    x \\right|$ claim out on *large* magnitude numbers. Suppose we write a short program
    with *x* = 10^(160) with all variables in IEEE 64-bit (double) precision, something
    resembling this:


    ```

    double x, y, z;

    x = 1.0e160;

    y = x * x;

    z = sqrt(y);

    print z;

    end

    ```


    If you run it a few times on a machine with an Intel or AMD processor, you might
    very well get 1.0e160 for z, that is, 10^(160) as hoped, but you might find that
    it occasionally instead produces Inf to indicate that the answer overflowed to
    infinity.


    *What in the world*? So you might try the quickest type of debugging, that of
    inserting a print statement to see what could possibly be going wrong.


    ```

    double x, y, z;

    x = 1.0e160;

    y = x * x;

    print y;

    z = sqrt(y);

    print z;

    end

    ```


    Now you run it, dozens of times, and it *always* gives the answer Inf. You take
    the “print y” statement out, and it goes back to producing 1.0e160 most of the
    time, but not always. So you get out the low-level debugger and step through the
    code, carefully. It always produces Inf.


    This is one of the most dreaded and exasperating types of programming bugs: The
    act of debugging, that is, observing what is going on, *changes how the program
    behaves*. The bug has a slang term, a “heisenbug,” named after physicist Werner
    Heisenberg who stated the quantum mechanical principle that the act of observing
    an event can change the event. To use an image from the early PC era when the
    electronics were big and clunky:


    ![A 1980s programmer experiencing a heisenbug.](images/pg94_1.jpg)


    A 1980s programmer experiencing a heisenbug.


    As with underflow, finding the source of this bug reveals another consequence
    of the choices Palmer made in designing the i8087. The squaring of 10^(160) is
    being done, *covertly*, in the 80-bit registers even though all the variables
    are declared to be 64-bit precision. The 80-bit registers can handle the square,
    which is 10^(320), and the square root then returns 10^(160) and converts it back
    to 64-bit precision.


    But if you try to observe what is happening, the processor will convert the temporary
    result back to 64-bit precision. IEEE 64-bit precision can only store numbers
    up to about 1.8 × 10^(308), so 10^(320) overflows to infinity. Both print statements
    and debuggers conceal the use of covert 80-bit precision, the feature that was
    supposed to make Intel arithmetic “better” than the competition that actually
    uses 64 bits and 32 bits when that is what the program specifies.


    Why would the original program sometimes produce 10^(160) and sometimes infinity?
    Operating systems occasionally have to swap out a running piece of code by saving
    the state of the processor, doing some housekeeping function, and then restoring
    the state. That state includes the register contents, but anything in the 80-bit
    temporary register is converted on-the-fly to a 64-bit float, causing it to overflow.
    Hence, IEEE arithmetic is not only unportable across systems, but it can also
    produce *different answers on the same computer with the same data*.


    When Sun Microsystems was creating the Java programming language in the 1990s,
    an absolute design requirement was that it produce the same answer on *any* computer.
    A lead engineer on the project, James Gosling, figured that real number operations
    were easily made to behave identically by stating that they follow IEEE Std 754,
    done. After all, it says “Standard” right there on the label. He was horrified
    to discover that it was not that kind of standard at all; the only thing it really
    standardized were the locations and meanings of the bit fields so that float data
    could be interchanged between computers. When it comes to performing arithmetic,
    it should have been called the IEEE 754 *Guidelines*. This forced the Java designers
    to build their own floating-point arithmetic out of integer operations, bypassing
    the IEEE-float-specific hardware in everyone''s processor. Kahan was livid about
    this, but it could have been avoided had he won his argument with Palmer in the
    first place, stipulating that results should be perfectly reproducible.


    ### 4.7.6 Postlude: Farewell to IEEE Floats


    Not many computer technologies last more than a few years, and by the year 2005,
    the IEEE version of scientific notation was looking very long in the tooth, indeed.
    The major chip-makers decided that the exceptions were rare, so they could be
    handled in software instead of hardware. This simplified the hardware to processing
    only *normal* floats, saving chip area and execution time. Sun Microsystems made
    the mistake of trapping NaN exceptions to the operating system, which could take
    millions of times longer to handle NaN than previous versions of their processors.
    High-frequency stock traders found the new processors unusable, since NaN exceptions
    are common when the trading algorithm is missing some vital data and thus no trade
    should occur.


    Intel, AMD, and ARM did better, trapping exceptions to be handled with microcode
    in their processors, which could take 200 clock cycles instead of the usual 3–8
    clock cycles for normal floats. However, taking longer to do something is externally
    viewable, so a third party can use timers to figure out the data being processed
    without having permission to do so. That is called a *side-channel attack*, and
    researchers at UC San Diego were able to use the disparate timing to hack into
    web sites and steal data.


    A fatal blow to IEEE floats was struck with the rise of Graphic Processing Units
    (GPUs), because those not only tend to turn off any exception handling, they flush
    subnormal numbers to zero. That meant that when you port an IEEE float to a GPU,
    it represents a *different number*. The data interchange part of the Standard
    broke.


    There was nothing left to make the word “Standard” applicable.'
