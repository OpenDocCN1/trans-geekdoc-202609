    any exceptions that arise, such as dividing by zero.


    Quevedo also accurately estimated the dynamic range needed for conventional calculations
    as well within `10^(−99) to 10^(99)`. He knew that `10^(−9) to 10⁹` would not
    be sufficient, so he elected a two-digit (decimal) exponent representation, and
    then it became overkill, but sufficient to do the job. There is nothing to indicate
    that he considered number bases other than the number of fingers that humans have.


    In the late 1930s, Konrad Zuse conceived the `Z-1` computer as a *mechanical*
    binary computer that stored its `0` or `1` states using sheet-metal and pin linkages.
    He built it on the family dining room table. Remarkably, it implemented the Quevedo
    idea of a separate significand (`15 bits`) and exponent (`7 bits`). Zuse could
    not get the representation of zero working, though he knew it was needed; he fixed
    that in a later version, the `Z-3`, that used electromechanical relays instead
    of linkages. Both the `Z-1` and `Z-3` computers worked, so they were history''s
    first binary computers capable of floating-point calculations. The only thing
    they lacked was electronic switching speed.

