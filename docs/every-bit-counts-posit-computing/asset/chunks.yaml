    posit `minPos` 总是 `000⋯001`，其连续相同位长度 `k` 为 `n − 2` 位（精度减去 1 个符号位和 1 个编码终止位）。该比特串代表的编码值为
    `r = − (n − 2) = 2 − n`。回顾一下，当 `eS = 2` 时 `uSeed` 为 `2^(2²) = 16`，所以 `minPos =
    16^(2−n) = 2^(4·(2−n)) = 2^(8−4n)`。在计算点积时，我们可能需要累加小至 `minPos² = (2^(8−4n)) ² =
    2^(16−8n)` 的乘积。同理，`maxPos² = 2^(8n−16)`。因此，整数部分 `I` 和小数部分 `F` 长度为 `8 n − 16` 位。


    quire 总是 `16n` 位，所以如果我们减去 `I` 和 `F` 字段的大小，剩下的东西就不依赖于 `n` 了：


