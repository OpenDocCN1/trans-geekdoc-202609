    \ & 1.144 \\\\ \\end{matrix}\n$$\n\n`b[-1]` 是 `0`，所以不需要向上舍入。将 `p` 右移一位，这同时完成两件必要的事：它丢弃\
    \ `b[-1]` 并使 `b[0]` 成为 LSB，同时在左侧移入符号位 `0` 表示正数。\n\n$$\n\\begin{matrix} p \\\\\
    \ {0000\\text{1111}} \\\\ \\end{matrix}\n$$\n\n最后一步是应用 `x` 的符号。如果 `x` 为正，我们就完成了，但因为\
