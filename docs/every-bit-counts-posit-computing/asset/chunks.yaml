- raw: '2.  Failing that, modern languages like C will check inputs to mathematical
    operations and produce error messages when, say, the computer is asked to take
    the square root of a negative number or divide by zero, and the message (via the
    operating system) informs the user what went wrong.


    3.  As a last line of defense, if somehow a processor is asked to do something
    that cannot produce a real number as a result, that can be handled by calling
    it NaR and propagating that invalidity through to the final output. It might happen
    that a programmer, confident the program will never misbehave, asks the compiler
    to disable all the exception handling of line-of-defense **2**, allowing it to
    run slightly faster since the math library routines do not have to first test
    if inputs are valid.


    This is why posits make NaR the only exception that is part of the definition
    of the arithmetic. Some have said they really need positive and negative infinity,
    but that again confuses debugging and computing. It is hard to imagine anyone
    using a finished production code to “compute” infinity as a useful result. Line-of-defense
    **2** will generally provide the information when a result would be some kind
    of infinity, and why it happened. Nothing in the Posit Standard prevents a programmer
    from inserting constructs like


    ```

       if x = 0, print “-Inf”; halt;

       else y = log(x);

    ```


    If you use the *valid* data type where posits ending in a 1 represent the real
    open interval between two exact numbers as described in [Chapter 1](#chapter1.xhtml),
    then you have a way to represent and compute with (*maxPos*, ∞) and (−∞, −*maxPos*).


    Why not allow the number of exponent bits to vary, independently of the precision?
    The main reason is that it makes hardware more complicated, more power-hungry,
    and after years of experimenting with various sizes of the exponent field, the
    value “2 bits” turned out to be optimal for a remarkably large fraction of the
    experiments. Software for posit arithmetic can have this flexibility, and many
    open-source libraries exist that support a variable number of exponent bits.


    In later chapters, we will see quite a few parameters that can be used to make
    posit format more general, not just the precision and number of exponent bits.
    There is a place for both standard posits and generalized posits; standard posits
    always have two exponent bits; they could be explicit bits or ghost bits, but
    as Yoda says, always two there are.


    We are careful not to use *mantissa*, which would be the appropriate term if the
    represented values were logarithms, but within a binade, the values are equispaced
    so the correct mathematical term is *fraction*.


    The fovea, where relative accuracy is maximum, is when there are only two regime
    bits (**0****1** or **1****0**); that happens for fully half of all the bit patterns.
    In that case, taking into account the sign bit and two exponent bits, all but
    5 bits are available for expressing the fraction. If *n* is the precision, the
    fraction has *n −* 5 explicit bits for the central-magnitude values, which is
    almost always the region where most of the computing takes place.


    This may be a place where the Posit Standard is a little *too* terse. Exact evaluation
    is not always necessary nor even possible, because it could require that an infinite
    number of digits be evaluated. Perhaps a better wording would be, “rounded the
    way an exact evaluation of an expression involving more than one operation would
    round” since that means the evaluation need only be accurate enough to determine
    how it rounds. Recall that this was the way the Math Layer was defined.


    There are many more fused operations for posits than there are for IEEE floats,
    which allows calculations to stay in the Math Layer for more of the calculation
    and therefore accumulate less rounding error.


    Binary float formats use a “hidden bit” to the left of the fraction bits; it is
    **1** for normal floats, and **0** for subnormal IEEE floats. But because posits
    are based on 2''s complement arithmetic, the significant digits being scaled represent
    a value that ramps from 1 up to almost 2 for positive values, and from −2 to almost
    −1 for negative values. In 2''s complement, **0****1** is 1 and **1****0** is
    −2.


    For example: If the fraction bits are **011**, that means **0.011** = $0 \\times
    \\frac{1}{2} + 1 \\times \\frac{1}{4} + 1 \\times \\frac{1}{8} = \\frac{3}{8},$
    regardless of the sign. If the sign is positive, the implicit value plus the fraction
    is $1 + \\frac{3}{8} = \\frac{11}{8},$ but if the sign is negative, the implicit
    value plus the fraction is $- 2 + \\frac{3}{8} = - \\frac{5}{8}.$ This is a very
    machine-friendly way to do things, but just as with 2''s complement integers,
    it is not very human-friendly.


    The LSB and MSB need no further explanation. The formulas for *maxPos* and *minPos*
    as a function of the precision *n* are easily explained. The largest positive
    value *maxPos* is **0****111**⋯**111**, where the **1** bits in the regime go
    all the way to the end of the explicit bits (and are then terminated by a **0**
    ghost bit). The *n* - 1 regime bits represent the integer one less than the run
    length, or *n* - 2. The *uSeed* value for standard posits is 2^(2²) = 2⁴, so *maxPos
    = uSeed^n*^(\-2) = 2^(4 ()*^n*^(\-2)) = 2⁴ *^n*^(\-8). We could similarly derive
    the smallest positive value, *minPos*, represented by **0****000**⋯**001**, or
    simply observe that *minPos* = 1 / *maxPos* = 2^(8-4) *^n*.


    Much has already been said about NaR. “Not a Real” corrects the error in the Intel
    i8087 of calling it “Not a Number” when it really means not a *real* number. I
    was amused to see this exceptionally honest airport signage for a time of boarding:


    ![The airport is (unintentionally, I assume) informing us that they have absolutely
    no idea when the plane is going to board. Apparently their software uses IEEE
    floats and converts them to integers for display.](images/pg112_1.jpg)


    The airport is (unintentionally, I assume) informing us that they have *absolutely
    no idea* when the plane is going to board. Apparently their software uses IEEE
    floats and converts them to integers for display.


    The word “NaN” (rhymes with “ran”) is a homophone with a woman''s name “Nan” and
    a child''s name for a grandmother, “nan.” But “NaR” (rhymes with “far”) has the
    advantage of being a unique word in proper English; it has no homophones.


    The Posit Standard refers to the number of (explicit) bits in a posit so often,
    the variable *n* always has that meaning throughout. If you go as low as *n* =
    1, all you have is zero and NaR; that does not seem very useful; there is no *minPos*
    nor *maxPos* value. Hence, the Posit Standard sets 2 as the smallest possible
    number of posit bits.


    As the magnitude of a posit becomes large, the consecutive value spacings become
    larger than 1 and that means skipping over integers. This happens with floats
    as well; for example with 16-bit IEEE floats, you can count from 0 up to 2048,
    but the next larger value is 2050. There is no way to represent 2049. There is
    a non-obvious general formula for *pIntMax* as a function of *n*:


    Let''s plot the exponent, ⌊4(*n*−3)/5⌋, as a function of *n* for *n* from 2 to
    32:


    ![The power of 2 where standard posits start skipping over integers, as a function
    of posit precision](images/pg113_1.jpg)


    The power of 2 where standard posits start skipping over integers, as a function
    of posit precision


    That shows why you need the ceiling function ⌈⋯⌉ in the formula; for the case
    of *n* = 2, it goes to −1 and then $2^{\\lfloor{4(n - 3)/5}\\rfloor} = 2^{- 1}
    = \\frac{1}{2},$ which is not an integer. Rounding that up to 1 with the ceiling
    function gives the correct *pIntMax* for the extreme case of the smallest possible
    number of bits in a posit.'
