  trans: '

    有些文化使用二十进制（手指和脚趾？），而马哈拉施特拉邦的数字是五进制，暗示了单手计数。六十进制和十二进制至今仍用于时间和角度。


    本章考察了人类记录和使用数字的浩瀚历史的一个缩影，以及这些方法如何被证明对于*机器*来说远非最优。它还将讲述现代 IEEE Std 754 浮点格式定义的由来；这并非大多数人所想的那样。


    ## 4.1 令人惊叹的巴比伦人


    古巴比伦人在数学上绝不含糊，甚至可以追溯到公元前 1800 年。他们认识到使用 60 作为数制基数的优点，这以每分钟 60 秒、每小时 60 分钟以及每圆
    360° 的形式延续至今。埃及人可能同样能干，但他们在纸草纸上用墨水书写，而不是使用放在阳光下烘烤的泥板，所以我们留存下来的他们技能的证据少得多。这里有一件特别令人印象深刻的巴比伦文物，为清晰起见重绘，并用白色现代数字标注：


    ![古巴比伦人知道平方根 2 到小数点后七位。](img/pg62_1.jpg)


    古巴比伦人知道平方根 2 到小数点后七位。


    首先，请注意巴比伦数字符号是多么合乎逻辑。在最底层，它是一元的，因为它重复 ![](img/inline1.jpg)十的符号和一的符号来表示 1 到 59
    之间的两位位置数字。如果他们需要零，就将该位置留空。在更高一层，该系统像我们现代的十进制一样使用从左到右的位置记数法，但基数是 60 而不是 10。正方形的边在左上角标记为
    30。正方形对角线上标记的是他们对 $1 + \frac{25}{60} + \frac{51}{60^{2}} + \frac{10}{60^{3}}$
    的表示法，换算成十进制是 1.414213……，这是平方根 2 精确到小数点后前七位！正方形的边标记为 30，所以对角线长度是 $30 \times \sqrt{2}
    \approx 42 + \frac{25}{60} + \frac{35}{60^{2}} \approx 42.4264$，同样达到了令人难以置信的小数点后六位精度。


    这件文物不是“泥板”，而是将近四千年前某人的草稿。他们知道如何求直角三角形的斜边，所以我们称之为勾股定理的或许应该叫巴比伦定理。那块泥土的背面部分被擦除，但似乎显示了一个
    3-4-5 直角三角形，这是斜边为整数的最简单情况，$\sqrt{3^{2} + 4^{2}} = 5$。


    巴比伦人还知道如何解一元二次方程和计算复利（指数），他们能用紧贴的梯形近似曲线下的面积（积分学）。他们知道如何解线性方程组。我还能继续列举。然而不知为何，他们的知识和设计良好的数制系统失传了，没有传播到随后的帝国，比如罗马帝国。


    ## 4.2 罗马数字


    ![](img/pg63_1.jpg)


    令人惊讶的是，罗马帝国这样一个成功的文明，竟然能靠有史以来最笨拙的数字系统之一繁荣发展。既然我们到处都能看到罗马数字，从模拟时钟上的小时标记到出版物章节编号的用途，它们或许看起来不那么痛苦。但问问你自己：不先转换成其他数制，你如何用手工*相乘*
    **XIV** 和 **LXV**？


    这里有个问题：罗马数字是位置记数法，还是更像不使用位置的计数标记和数字系统？我认为它们*略微*具有位置性，但并不完全是。例如，假设我们用罗马数字写整数 1984。常规写法是
    **MCMLXXXIV**，大数字多在左，小数字多在右。


    然而，如果我们将其拆分为 **M CM L X X X IV**，它们可以按任何模式书写，仍然表示 1984：


    ![罗马数字不是位置记数法。](img/pg64_1.jpg)


    罗马数字不是位置记数法。


    罗马数字唯一具有位置性的是减法对 **IV, IX, XL, XC** 等，即第一个字母的值从第二个字母的值中减去。否则，它们不就像扔在桌上加总面值的硬币吗。因此，*略微*具有位置性。有例子显示，第二十二罗马军团把他们的编号写作
    **IIXX**，因为他们用拉丁语自称意为“第二十二”。有时抄写员会把 45 写成 **VXL** 而不是 **XLV**，这大概表明当时的抄写员觉得这些规则和我们今天一样令人困惑且容易出错。


    这不为人所知，因为现代我们只用罗马数字写正整数，但罗马人*确实*有书写分数的方法。


    ![](img/pg64_2.jpg)


    这套系统其实差不多讲得通，像骰子或多米诺骨牌上的点数。然而，除了 12 分之几的整数，他们还有带自己符号的特殊分数，如 ℈ 代表 $\frac{1}{288}$，Ƨ
    代表 $\frac{1}{72}$。这类东西就是当数制像人类语言一样有机形成、人们随用随造，而不是从第一性原理*设计*出来时会得到的结果。


    那么古罗马人究竟*如何*执行交易中加总物品成本这类常见任务？他们将罗马数字转换为算盘类型的表示。不一定是我们通常想象的串在铁丝上的珠子，而可以简单如躺在槽里可来回滑动的鹅卵石。那绝对是位置制的，且相当适合加减法。


    我们没有他们那种槽中鹅卵石式算盘的记录，但大英博物馆有一个精美的便携罗马机械算盘实例：


    ![罗马算盘](img/pg65_1.jpg)


    罗马算盘


    结果随后可转回罗马数字。算盘上标有千、万、十万、百万的符号。最右两列显示分数计数器为十二分之几，以及表示此后有多少个 $\frac{1}{12}$ 的三分之一的方法。*那*才是位置记数法，甚至排序方式与我们今天的位置数制相同。


    罗马数字的设计暗示它们起源于一种仅划一条线就很费力的媒介。在石头上刻 **IV** 要凿三条线，而不是 **IIII**。写 **X** 只需两条凿线，而
    **VV** 需四条。显然 **L** 比 **XXXXX** 容易刻得多。考虑到刻曲线有多难，**C** 代表一百、**D** 代表五百的符号暗示他们不指望经常用这么大的整数。对于一千，罗马人最终用
    **M**（如今最常见形式），但早期用这个符号：ↀ。那符号明显不利于凿刻，所以不难理解为何刻石时 **M**（*mille* 的缩写，拉丁语千）会取而代之。还有符号
    ↁ 代表五千，ↂ 代表一万（上图算盘上可见 ↂ），它们出现在当今 Unicode 字符集中。


    有时说印度人发明了零的概念。他们可能是第一个将零作为数字使用的，但上述算盘显示了零：所有珠子拨下。任何使用算盘的文化都有零的表示，那是任何计算的起点。罗马人当然能用
    *nullus* 表达零，那是拉丁语“无”的形容词。

