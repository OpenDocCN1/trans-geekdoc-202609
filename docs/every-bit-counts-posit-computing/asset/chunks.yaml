    ## 5.1 从 Unums 到 Posits


    新加坡的研究工作很快让人们意识到，完全抛弃 IEEE Std 754 标准，从 第 1 章 所示的环形图入手，可以实现最后两个特性。有优雅的方法可以保持这样一个特性：绕水平轴翻转环形图可完美得到一个数的倒数，使除法像乘法一样简单。2016
    年初，这些被引入为“II 型 unums”，并将原始版本重新命名为“I 型 unums”。


    II 型 unums 始终使用相同数量的位，解决了针对 I 型的异议，但引入了另一个困难：算术运算需要查表，而不是使用常规的逻辑电路。虽然 Kahan 一贯批评最初的
    unum 想法，但在一场公开辩论中（2016 年 6 月），他对 II 型 unums 说道：


