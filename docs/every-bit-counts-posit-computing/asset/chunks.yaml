  trans: '

    就像凯维多的提议一样，有许多不同的方式来表示同一个值，这绝不是好事。每一位都应该算数，但如果尾数位全为零，那么阶码位就不算数了。符号位也不算数。


    更糟糕的是，你可以将尾数除以二（将位右移一位）并将阶码加一，结果却是*完全相同的数字*（如果尾数的最低位是`0`）。左移并减小阶码也是类似的情况。因此，原本可以有
    `2³⁶` 个不同的实数值，实际上却少得多。“每位信息量”因表示同一值的冗余方式而减少。


    ## 4.7 IEEE Std 754 标准的兴衰


    在 1960 年代和 1970 年代，有数十家小公司（或像通用电气这样的大公司的小部门）试图进入计算机行业并取得成功，它们的名字大多已被遗忘。它们拥有截然不同的浮点格式。阶码和尾数的位数（及其位置）各不相同；阶码和尾数符号的编码方式也不同；有的采用基数
    2，有的基数 8，还有的基数 10。


    其中一种基数，即行业霸主所采用的，是基数 16。IBM 在 1964 年推出极其成功的 System/360 大型机系列时，从上述的 704 格式切换到了“十六进制浮点数”（HFP），字长也从
    36 位变为 32 位；采用 16 作为基数导致的精度动摇（参见第 2.7 节）使其格式的相对精度在约 6.3 到 7.5 位十进制数字之间动摇，实际上使得任何长度计算的精度仅为
    6.3 位十进制数字。IBM 704 的单精度至少能产生超过 8 位十进制数字的相对精度作为加减乘除的输出，这通常已足够。许多科学应用在移植到 IBM 的新设计时，产生了无法接受的不准确结果。


    解决方案显而易见：使用双精度（64 位）浮点格式，System/360 从一开始就支持该格式。那是在存取内存数据比对浮点数进行算术运算*快得多*的年代，所以改用双精度是不假思索的决定。技术代码程序员习惯性地将所有实数变量设为双精度，而不考虑哪些变量实际上需要
    15 位左右的十进制精度。


    随着时间的推移，算术运算变得快得多，但跨物理距离的内存访问改善缓慢。“内存墙”——即存取一个浮点数所需时间比对其进行算术运算长数百倍——直到 1970 年代末才变得显而易见。重写软件成本极高，因此我们现在陷入了对许多涉及实数的应用使用过度精度的困境，这主要归因于
    IBM 在 System/360 设计中采用 HFP 的那一决定。


    为什么没有形成某种*事实上的*标准，统一实数的表示方式？拥有独特的格式意味着很难更换供应商，而供应商喜欢这样。现有机器计算出的数据文件可能包含整数、字符和浮点数的混合数据，虽然你或许能将整数和字符数据移植到不同品牌的计算机上，但提取浮点数据并转换它可能是一场噩梦。如果目标格式的动态范围较小，会导致溢出和下溢。如果尾数位数较少，会导致精度降低到不可接受的程度。这是营销人员所谓的“锁定”；一旦成为客户，永远是客户。


    ### 4.7.1 计算机行业获得解放


    芯片设计商 Intel 在 1970 年代如日中天，已从制造首款商用 DRAM 内存芯片转型为制造首款微处理器。其首款微处理器 `Intel 4004` 每次处理
    4 位数据，芯片约含 2300 个晶体管；将设计压缩进单个芯片需要相当大的创新。首次将智能植入微波炉和交通灯控制器变得切实可行，或许还能制造四功能计算器。Intel
    联合创始人戈登·摩尔推测晶体管的最佳密度每年翻倍；他后来将其修正为每*两*年翻倍，芯片设计师卡弗·米德将这一预测称为“摩尔定律”。工程师们正在设计功能强大得多的微处理器，如
    `Intel 8080`，它们能让计算机变得如此便宜，以至于终有朝一日会成为*个人计算机*。


    但计算机行业的巨头们之间还有另一条剧情线：Sperry（斯佩里）、IBM、Honeywell（霍尼韦尔）以及其他 1960 年代大型“主机”计算机制造商。莫克利和埃克特利用他们在政府资助的
    ENIAC 上的经验，开发出了足够实用可通过 Sperry 商业销售的计算机。Sperry 为电子数字计算机的概念申请了专利，并向其他计算机制造商收取专利费。IBM
    与 Sperry 达成了专利共享协议，因此 IBM 实际上也像 Sperry 一样，从专利费造成的市场准入壁垒中获益。


    在 Honeywell，有人偶然发现阿塔纳索夫 1937-1942 年的电子数字计算机在莫克利和埃克特决定从模拟转向数字并开始建造 ENIAC 之前很久就已展示给莫克利看过，这或许能打破
    Sperry 的专利。一场联邦诉讼随之开始，成为美国历史上最漫长、最昂贵的案件之一。历经七年、32,000 件证据和 20,000 页的证词记录，厄尔·拉尔森法官裁定该专利*无效*。其判决书摘录如下：


    引自克拉克·莫伦霍夫所著《阿塔纳索夫：计算机的被遗忘之父》，1988 年，第 210 页。


    判决消息因时机巧合而被掩盖；它发布的当天正是“水门事件”的“周六夜大屠杀”。


    埃克特和莫克利理应因将阿塔纳索夫的想法商业化所付出的巨大努力而获得赞誉，Sperry 仍是最大计算机公司中的强劲竞争者，但准入壁垒已不复存在。无论你是否同意拉尔森法官的结论，你必须承认结果是*无人*拥有电子数字计算的广泛专利；任何人都可进入市场，无需担心侵权或支付高额专利费。而此时
    Intel 和 Motorola 等公司正制造着日益强大的微处理器，晶体管数量每两年翻倍。


    除了法律准入壁垒，设计整机的技术难题对小公司同样令人望而却步。但有了微处理器，这道壁垒也消失了。将处理器、内存、键盘和显示器连接所需的技能，已是电子工程专业学生毕业设计的水平。计算机行业获得了前所未有的解放。


    ### 4.7.2 IEEE Std 754 标准的真正起源


    ![约翰·帕尔默，1946–2017](img/pg84_1.jpg)


    约翰·帕尔默，1946–2017


    竞争对手 Motorola 和 Intel 继续改进其微处理器，晶体管密度提升到足以让它们考虑一次处理超过 8 位数据的地步。Intel 开始研发一款名为
    `i8086` 的 16 位处理器，它能寻址超过 `2¹⁶`（“`64K`”）字节的内存，后者限制了来自 Apple、Commodore 和 Radio Shack
    (Tandy) 的第一代个人计算机。Bruce Ravenel 是 `i8086` 和一个较慢版本 `i8088` 的首席架构师，后者拥有相同的指令集但一次处理
    8 位以降低成本。

    '
