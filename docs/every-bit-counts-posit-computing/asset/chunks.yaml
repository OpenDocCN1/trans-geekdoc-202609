- raw: 'For another, the formula is quite different for numbers and their inverses.
    Suppose *x*[computed] = 0.001 but *x*[exact] = 0.0001. Then the relative error
    is 9. But if we were instead computing the reciprocals of the numbers, the relative
    error would take *x*[computed] = 1000 and *x*[exact] = 10 000 as inputs, and the
    above formula would reassure us that the relative error is only 0.9. It makes
    no sense that an answer can be made to look ten times more accurate simply by
    taking reciprocals. If you knew a wavelength with a relative error of 0.1, would
    it not bother you to know the frequency (inversely related to wavelength) of the
    same component with a relative error of 0.2? These problems go away if instead
    of taking the differences between two numbers, we take the difference of the *logarithm*
    of the two numbers.


    ## 2.2 Three Types of Logarithms


    Engineers who work with signals that have a wide dynamic range (like sound) have
    long had a solution when comparing numbers with ratios, which is to use *decibels*.
    A ratio of 10 is 10 decibels (10 dB), also known as a *bel*, though that word
    is not used very often. A ratio of 1 dB means the ratio is 10^(1/10) = 1.2589
    ⋯. Decibels measure the difference of the logarithms (base 10) of two (positive)
    quantities *x*[1] and *x*[2], which is the same as the logarithm of their ratio:


    The absolute value makes *x*[1] and *x*[2] interchangeable. Hence, it can be used
    to measure experimental errors. Also, it produces the same result whether you
    use *x*[1] and *x*[2] as inputs, or 1 / *x*[1] and 1 / *x*[2]. So *that* looks
    like a mathematically sound definition. But if *x*[exact] is 100, say, and we
    compute *x* = 110, the error is about 4 dB, which looks nothing like the traditional
    relative error value of 0.1. Can we have it both ways, with the elegance of logarithms
    of ratios but also something that resembles traditional relative error?


    There are three types of logarithms we will be using here. Base 10 logarithms
    are good for human understandability since we tend to think in powers of 10 like
    hundreds, thousands, billions, etc. Computer scientists tend to use base 2 logarithms
    more than any other type, so much so that a base 2 logarithm has its own abbreviation:
    log[2](*x*) is often written as lg(*x*). For example, if told that “The memory
    address space is 4096 items,” then a computer scientist immediately infers that
    there are lg(4096) = lg(2^(12)) = 12 bits in the address.


    A third kind, *natural logarithms*, uses *e* = 2.71828 ⋯ as the base because that
    base simplifies expressions that arise in higher math. It also has its own abbreviation:
    log*e*(*x*) = ln(*x*). Here are graphs of those three kinds of logarithm:


    ![log2 is computer-friendly, loge is math-friendly, and log10 is human-friendly.](images/pg17_1.jpg)


    log[2] is computer-friendly, log*e* is math-friendly, and log[10] is human-friendly.


    The decibel-type approach would work with any base logarithm, because log(*a*)
    − log(*b*) = log(*a* / *b*) for any kind of logarithm. There is a subtle reason
    for choosing the *natural logarithm* base *e* = 2.718 ⋯ instead of base 10 to
    measure relative error: as an error becomes small, natural log error becomes close
    to traditional relative error. As the figure shows, the slope of ln(*x*) near
    *x* = 1 is 1.


