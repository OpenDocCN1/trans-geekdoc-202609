    # 3 More Power!


    ![Exponentially increasing power in the classic 1956 sci-fi movie Forbidden Planet](images/pg41_1.jpg)


    Exponentially increasing power in the classic 1956 sci-fi movie *Forbidden Planet*


    The first explanations of the full posit format were published in 2017, and in
    the intervening years much has improved about how to explain it more clearly.
    If you have already seen explanations of the posit format, do not be surprised
    if the following differs slightly from the early papers on the subject.


    ## 3.1 Increasing Posit Dynamic Range


    Start with a three-bit posit ring, but instead of the regime bits representing
    a power of 2, let them represent a power of 2² = 4. That doubles the dynamic range:


    ![Squaring the northwest value (and adjusting the reflected values) doubles dynamic
    range.](images/pg41_2.jpg)


    Squaring the northwest value (and adjusting the reflected values) doubles dynamic
    range.


    It also creates a new rule for inserting values when we append bits. As usual,
    appending a **0** bit does not change the value; but when we append a **1** bit
    we now can insert an integer power of 2 between the values.


    ![Between powers of 2 that differ by more than 1 in the exponent, insert the geometric
    mean.](images/pg42_1.jpg)


    Between powers of 2 that differ by more than 1 in the exponent, insert the geometric
    mean.


    When a bit is appended after a regime termination bit, we call that an *exponent
    bit* and color code it in **blue**. If it is a **1** bit, the flanking values
    are 2*^k* and 2*^m* and the inserted value is 2^((^(*k*+*m*))/2). The regime bits
    now serve as a kind of super-exponent, where the value they represent is a power
    of 4 scaling, not a power of 2. The exponent bit then lets us fill in the gap
    between 1 and 4, or between 1/4 and 1. To make it clearer, we can append one more
    bit so that some fraction bits appear for magnitudes 1/4 to 3 (shown in **black**
    as usual). The exponent bit lets us fill the gap between 4 and 4² = 16 with 4²
    ·2¹ = 8. Integer powers of 2 still have perfect reciprocals, their mirror image
    about the horizontal axis. The mapping to 2''s complement integers is still monotone,
    as shown in this ring plot:


    ![Ring plot of 5-bit posits with 1 exponent bit](images/pg42_2.jpg)


    Ring plot of 5-bit posits with 1 exponent bit


    Suppose we want still more dynamic range. We can square the meaning of each regime
    bit again, to 4² = 16, so the value in the northeast position is 16. To fill in
    between 16⁰ = 1 and 16¹ = 16 means scaling by 1, 2, 4, or 8, that is, 2*^e* where
    *e* ranges from 0 to 3. As an unsigned binary, we can do that with exponent bits
    **00**, **01**, **10**, and **11**. Here is the ring plot for a 5-bit posit with
    a 2-bit exponent field:


    ![Ring plot of 5-bit posits with 2 exponent bits](images/pg43_1.jpg)


    Ring plot of 5-bit posits with 2 exponent bits


    The number of bits in the exponent field is *eS*, short camelCode for *exponentSize*.
