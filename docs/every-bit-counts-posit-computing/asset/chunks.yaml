    第 1 章 解释了 `eS = 0` 的情况，第 3 章 引入了通用的 `eS` 值；那里使用了“显式位”和“幽灵位”方法。Posit 标准使用了一种略有不同的解释，专门针对
    `eS = 2` 的情况。


