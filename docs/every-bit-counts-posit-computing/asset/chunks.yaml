    ## 3.5 一种用于舍入算术的简单符号


    20 世纪 50 年代推出 FORTRAN 时，它被吹捧为“FORmula TRANslation”（公式翻译），因此得名。它允许你用一种非常类似于代数符号的记法来编写算法，尽管乘法运算符用星号
    "`*`" 表示，还有其他一些调整。你可以声明变量 `a`、`b` 和 `c` 为 REAL 类型，然后编写如下代码行：


    ```

    c=a+b

    ```


    乍看之下，这完全像是在用实值变量进行计算。但这是个骗局。如果变量是*整数*，那么这做法还算诚实，因为除非发生下溢或上溢，你真的会得到正确的整数。但如果是*实数*值？恐怕不行。


    对于 `a` 和 `b` 许多可能的输入值，你得到的 REAL 类型值无法精确表达 "`a + b`"，计算机也不会告诉你它偏离正确值有多远。FORTRAN
    失去了全大写的外观变成了 Fortran，且作为一种计算机语言正在逐渐式微。但它让不止一代程序员极易受到这样的惊吓：计算机上看起来像实数运算的东西，根本不是精确数学，而是一种近似，有时会在毫无预警的情况下可怕地出错。


