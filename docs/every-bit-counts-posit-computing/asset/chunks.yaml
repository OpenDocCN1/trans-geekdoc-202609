- raw: 'This is consistent with terms like “single precision” and “double precision”
    or “8-bit precision”: it is the number of bits available to express a number and
    is **not** the same as “accuracy.” This was covered in [Chapter 2](#chapter2.xhtml),
    but it bears repeating because many people who should know better still confuse
    precision and accuracy. For example, the sawtooth pattern of relative accuracy
    in float formats was first called “wobbling precision,” and the term stuck even
    though the *precision* is steady as a rock. The precision of the significant bits
    is also constant; no wobble there. It is the *relative accuracy* that wobbles.
    This was explained in [Chapter 2](#chapter2.xhtml).


    The *quire* is a fixed-point format with enough precision to compute posit dot
    products (a sum of products) **exactly**. It is sufficiently powerful, and important,
    that it has an entire chapter dedicated to the ways it can be used. The idea of
    hardware support for an exact dot product, sometimes called a *scalar* product,
    comes from Karlsruhe professor Ulrich Kulisch, who introduced it in the 1970s
    but has been unsuccessful at getting it into any of the IEEE standards.


    Notice the distinction between *quire* and *quire value*. Whereas *quire* is a
    format (a set of bit fields and their meanings), a *quire value* is the real number
    represented by a bit pattern in quire format. Similar care is taken in the Posit
    Standard to distinguish *posit* (a number format) from *posit value*. Our Working
    Group member Hauke Rehr deserves credit for noticing inconsistent wording in early
    drafts and making sure the wording is consistent. In this book, I frequently use
    “posit” to mean “posit value” where context makes it clear, like “the product
    of two posits.”


    If the quire can store a dot product *a*[1] · *b*[1] + *a*[2] · *b*[2] + … + *a[m]*
    · *b[m]* of two vectors of length *m* (up to some maximum length, which here is
    about two billion elements), then it can also compute sums exactly up to some
    maximum length. Just think of one of the vectors being all 1 values: *b*[1] =
    *b*[2] = … = *b[m]*; then the dot product is the sum of the *a[i]* values. Summing
    numbers is much less demanding than summing *products* of numbers, so the maximum
    length of a sum that can guarantee no possibility of overflow or rounding errors
    is much larger than two billion. You would have to add *maxPos* to the sum, over
    and over, 2^(23+4) *^n* times, to get the sum to overflow. Even for 8-bit posits,
    the quire sum limit is about 36 quadrillion summations. One of the largest sources
    of cumulative rounding error in floating-point programs is summations of many
    numbers, so the Posit Standard makes clear that the quire can eliminate that accumulation
    of rounding error, and also enables parallel processors to perform accumulation
    perfectly so the result matches that of serial execution.


    [Chapters 1](#chapter1.xhtml) and [3](#chapter3.xhtml) have already explained
    the regime and regime bits, but since the Posit Standard fixes the number of exponent
    bits at 2, there is no need to define the *uSeed*, and many of the definitions
    are greatly simplified. In the Posit Standard, the *uSeed* value is always 2^(2²)
    = 16.


    There is no need to use the phrase “correctly rounded” in the Posit Standard,
    since all rounding is required to be correct. Every real number rounds to exactly
    one posit value, and there is only one way to do it.


    Note the distinction between *sign*, which is –1, 0, 1, or NaR, and the *sign
    bit*, which can be **0** or **1**. The Posit Standard avoids oversimplifications
    like treating the sign as (−1)*^s* where *s* is the value of the sign bit.


    Because the implicit value is −2 for negative posit values and 1 for positive
    posit values, the implicit value plus a fraction in \[0, 1) produces a significand
    in either \[−2, −1) or \[1, 2). Unlike floats, the significand includes the sign
    of the value.


    ## 5.4 Posit and Quire Formats Section


    There is a simple reason why computers are usually designed with datum sizes that
    are integer powers of 2, like 16, 32, and 64: It eliminates the cost of multiplying
    two integers when you index into an array. All you have to do is shift the index
    left and add the base address. This is likely to continue to be the case, so the
    Posit Standard gives example sizes of 8, 16, and 32 bits, even though it also
    applies to strange sizes like posit5, for example.


    The 64-bit example is conspicuously absent; this is because there is far less
    need for such high precision with posit format. For the case of two exponent bits,
    the quire is always 16*n* bits long, and every bit counts as a significand bit
    because it is a fixed-point number. That means posit16, which has about 5 decimals
    of accuracy in the fovea, is backed by a quire with 16 × 16 = 256 bits of accuracy,
    which is about 76 decimals. That is more accuracy than an octuple-precision IEEE
    float. When more accuracy is needed, the quire can do more than exact dot products;
    it can also do extended-precision divides and square roots through a technique
    described later on.


    While it is typical to describe a float or a posit as ±(1 + *f*) × 2*^e* where
    *f* is a *fraction* in the range \[0, 1), it is also true that they can be expressed
    with two *integers* as *K* × 2*^M*. Unlike IEEE floats, posits have the elegant
    property that the ranges for *K* and *M* are always symmetric about 0. For example,
    for posit16, *K* goes from -4095 to 4095 and *M* goes from −56 to 56. For precision
    *n* posits with *n* > 4,


    If *n* = 2, 3, or 4, *K* goes from −1 to 1 because the fraction bits are always
    ghost bits, **0**. The *M* range shown above still holds for *n* = 2, 3, or 4.
    The *K* range is important for hardware design because, among other things, it
    tells how large the integer multiplier will have to be. The multiplier is often
    one of the more expensive parts of the arithmetic logic in terms of chip area.


    In contrast, for IEEE binary16 (half-precision floats), *K* goes from −2047 to
    2047 and *M* goes from −24 to 15, and there really is no pattern for the ranges
    for different precisions since the number of exponent bits is not designed as
    a simple mathematical function of the precision.


    One way to describe a fixed-point format with *m* bits to the right of the radix
    point is to say it is an integer that represents a multiple of 2^(\-)*^m*. That
    is like the explanation in the Posit Standard. The footnote was prompted by one
    researcher asking the interesting question, “Does the product of two *n*\-bit
    posits always fit into a posit with 2 *n* bits?” It does, though the proof is
    tricky.


    Some numerical analysts claim dot products of single-precision floats can—*almost*
    always—be made accurate by using double precision to hold the pairwise products
    and for the accumulated sum, then converting the sum back to single precision.
    The argument is, a double-precision IEEE float always has enough fraction bits
    and exponent bits to hold the product of two IEEE single-precision floats, which
    is true, but what about the accumulation?


    Consider the dot product of these two single-precision vectors ***a*** and ***b***:


    Every element of each vector can be expressed with a single-precision float without
    rounding. In fact the values are whole numbers. For example, “8.0 × 10⁷” is just
    the scientific notation for “eighty million.” The pairwise products *a[i]* · *b[i]*
    are


    Try summing the numbers in single precision, and you get 0.0 exactly. Just for
    the sake of caution, use double precision to hold the products, and sum them in
    double precision as well. The straightforward way to add is left to right,


    Again, you get 0.0 exactly. Doing it left-to-right takes three addition steps.
    If there are two hardware adders that we can use in parallel, we might instead
    evaluate it pairwise to do the sum in only two steps:'
