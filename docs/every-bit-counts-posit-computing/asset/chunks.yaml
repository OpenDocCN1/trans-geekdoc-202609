    \ 最接近的 posit 表示。该 posit 解码为 $- \\frac{3}{1024} = - 0.0029296875$，保留一位有效数字即为 −0.003。\n\
    \n关于 posit 编码要注意的一点是，它从 `MSB` 进展到 `LSB`，一次一位。这似乎是合乎逻辑且显而易见的做法，但请注意，这不是传统格式编码实数的常用方式。\n\
