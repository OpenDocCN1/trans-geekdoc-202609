    分别代表 `e = 0, 1, 2, 3`，填补这些 4 的倍数之间的空隙。`x` 的公式可推广为


    上述函数即为 `pToX` 函数（posit-to-`X`），其代码见附录 A。若公式产生 –∞，则返回 `Indeterminate`，以适应结果非实数的所有情况，即非实数（`NaR`）值。


    帐篷状的相对精度曲线随 `eS` 每增加 1 宽度翻倍，但中央凹区的顶部精度会下降约 0.3 个十进制位，因为小数位少了一位。


    下图展示了 16 位 posit 在 `eS` 设为 0、1、2 和 3 时的十进制精度。


    ![16 位 posit 随 eS 从 0 到 3 的精度图](img/pg45_1.jpg)


    16 位 posit 随 `eS` 从 0 到 3 的精度图


    在该图中，摆动被简化为条形，标注的精度指的是*最小*精度。


    ## 3.2 *幽灵位* 与 *暮光区*


    举例来看，让我们观察 6 位精度且 `eS = 2` 的 posit 环：


    ![具有 2 个指数位的 6 位 posit 环图](img/pg45_2.jpg)


    具有 2 个指数位的 6 位 posit 环图


    我们需要一种符号来表示精度位数 `n` 和指数大小 `eS`。我们用尖括号 〈`n, eS`〉 表示，因此上图展示的是 “`posit〈6, 2〉`” 格式。


    环图显示了 2 个指数位，以**蓝色**标示。但等等，你可能会说；有些值根本*没有*指数位，有些*只有一个*指数位。不对；永远有 2 个指数位，但超出数字末尾的任何位都是
    `0` 位，就像我们对小数位所做的那样。幽灵位可以是指数位。


    指数位部分或完全超出最低有效位（LSB）的区域被称为*暮光区*，因为多年的经验表明，这个略显怪异的区域是构建 posit 环境时大多数 bug 的来源。


    考虑环中的值 1024，其 posit 表示为 `011101`。正确的理解方式是将其视为六个存储的（显式）位，后跟一串无限的幽灵位，在这种情况下，第一个幽灵位是两位指数域的第二位：


    ```

    011101|000000⋯

    ```


    运算段位甚至也可能是幽灵位，即存储位之外隐含的 `0` 位。例如，看看 -1 / 65 536 的表示：


    ```

    111111|000000⋯

    ```


    结束运算段的相反位位于尾随的 `0` 位中，并未显式显示。


    举一个容易犯错的例子，假设我们想将数字 600 编码为最近的 `posit〈6, 2〉` 形式，并正确舍入。我们在 256 和 1024 之间选择，两者都在暮光区。两数中点为
    (256 + 1024) / 2 = 640，这可能让人觉得 600 应向下舍入到较近的 256。然而，舍入并非如此工作。你应该问：“如果我们使用 `posit〈n
    + 1, eS〉` 格式而非 `posit〈n, eS〉` 格式，新的中点会是什么，该值会落在哪一侧？”第 `n + 1` 位可能是指数位，而非小数位。


    若我们有七位而非六位，便可表示 `0111011`，解码后为 512。因 600 大于 512，作为 posit 的最近表示应向*上*舍入至 1024。这符合我们的相对误差定义，因为选择
    1024 的相对误差为 |ln(1024 / 600)| ≈ 0.5，而选择 256 的相对误差为 |ln(256 / 600)| ≈ 0.9。在对数刻度上，600
    更接近 1024。在暮光区，中点也是相对精度连续而非略有不连续的点（见第 2.4 节）。


    ## 3.3 运算段中的相反位是否 “被浪费” 了？


    对 posit 格式的另一种常见初步反应是，运算段的结束位是 “被浪费” 的位，理应有办法重新定义它，使每一位都算数。那么，*它*被浪费了吗？


    在 `posit〈6, 2〉` 格式中，假设 `x = 010111` 代表 12，我们给它加 2。结果 14 位于可表示值 12 和 16 的正中间，最近的偶数二进制值是
    16 = `011000`。我们需要向*上*舍入。注意当我们对 12 的 posit 表示加 1 时，最后四位发生了什么。去掉颜色编码，`010111` 变为
    `011000`。神奇的是，进位自动将运算段延长了一位，最高有效指数位变成了结束运算段的相反位，指数整体向右移动一位，形成 posit 最后两个表示位。所有小数位变成了幽灵位。这一切都是*自动*发生的。结果
    16 = `011000` 完全正确。无需检查各字段的进位溢出。一切就绪。


    运算段的结束位对此至关重要。它绝对没有被浪费。每一位都算数。


    常见的错误是担心对小数部分舍入，一旦舍入完成，再组装 posit 的各部分（符号位、运算段、指数、小数）。这产生的 bug 会比热带雨林里的还多。应始终先用更高精度的额外位计算并组装
    posit 的各部分，*然后*再进行舍入。


    ## 3.4 将实数转换为 Posits


    第 3.1 节展示了如何将 posit 位串 `p` 转换为实数 `x`（或 `NaR`）。本节解释将实数 `x`（任何格式）转换为 posit 位串 `p`
    的算法。该例程称为 `xToP`，其代码见附录 A。为清晰起见，此方法取输入的绝对值，但也可直接转换实数值而无需此步。假设根据请求的精度 `n` 和指数大小
    `eS`，以下量已定义或计算为全局变量：


    *   `uSeed` 为 `2^(2*eS)`。

    *   `minPos` 为最小正 posit 值，`uSeed^(2-n)`。

    *   `maxPos` 为最大正 posit 值，`uSeed^(n-2)`。


    以下假设 `n > 2`。`n = 2` 的算法可用一句话表达：“任何非实数变为 `NaR` 即 `10`；零变为 `00`；正实数变为 `01`；负实数变为
    `11`。”


    ### 3.4.1 检查非实数输入


    第一步是确定输入 `x` 是否代表实数。若其以整数格式存储，则符合。整数是实数。也可能是虚部 `b` 恰好为零的复数 `a + b i`。也可能是像 **“1.6e-19”**
    这样的输入字符串，遵循计算机语言用科学计数法表示实数的规则。若未通过实数测试，返回 `NaR` 的 `n` 位串 `1000⋯000`。


    ### 3.4.2 取绝对值并检查特殊情况


