    实际上是指要求计算机执行以下操作：


    `h = round(sqrt(round(round(x * x) + round(y * y))))`。


    使用上标线符号（3.6 节）可以写得更简洁：


    $$h = \overline{sqrt(\overline{\overline{x\cdot x}+\overline{y\cdot y}})}.$$


    无论计算机语言的规则如何，如果它支持 posit，则融合运算或非融合运算的使用必须在代码中可见，绝不能隐蔽进行。稍后我们将看到这为何能防止灾难。


    Posit 标准要求支持科学计算器上的函数：对数、指数、三角和反三角函数。我们并未强制要求支持贝塞尔函数等更复杂的函数。那些功能随时可以添加到 Posit
    标准的未来版本中。


    虽然 posit 可以在程序中替代浮点数，但两种格式似乎很可能会共存一段时间，因此需要一种方法将 posit 转换为 IEEE 754 浮点数，反之亦然。因此，Posit
    标准规定了如何针对 IEEE 754 浮点数的各种舍入模式和异常类型进行转换。


    该标准还解决了一个微妙且长期存在的问题：不确定结果（posit 的 `NaR`，浮点数的 `NaN`）应如何转换为整数，以及如何转换回去？Posit 可以正确处理，保留发生
    `NaR` 结果这一事实。


    在指数位数 `eS` 相同的两种 posit 精度之间转换极其容易，很像在两种整数精度之间转换。无需解码该数值。这是草案 Posit 标准 4.0 将 `eS`
    = 2 规定为任意精度的原因之一。早期草案版本要求精度限制为 `n` = 8, 16, 32, 64, …，对应的 `eS` 值为 `eS` = 0, 1,
    2, 3, …，即 `eS` = log2 - 3。此处描述的批准版 Posit 标准不以那种方式限制 `n`。例如，5 位 posit 等奇怪的精度已被证明对
    AI 的*推理*任务很有用。固定的 `eS` 也简化了硬件设计师的工作。


    解释何时任何运算或函数应返回 `NaR` 的方法是统一应用单一数学原则。这与对不同函数使用不同规则形成对比，后者是 IEEE 754 目前的做法。


    因为这不是语言标准，也不规定数学库中的函数如何标记，我们提及知名数学函数，但仅描述它们应如何表现，而不描述它们应如何拼写或解析。计算机语言当然允许编写类似
    `a = b + c` 的内容，而非 Posit 标准中使用的 `a = addition(b, c)` 形式。


    文档中没有“建议”，因为遵循或不遵循建议会导致不可复现性。包含建议会使文档成为指南，而非标准。


    如果有人想为 9 位 posit 构建计算环境，因为它们适合 AI，那么无需支持任何其他精度即可符合 posit 规范。整个环境可以用软件完成，使用原生整数运算编写，或者（似乎更可能）买加累积的核心运算由尽可能快的硬件完成，而对数等不太常用的操作可以用软件完成。


    ## 5.3 Posit 标准的定义部分


    第 3 章介绍了 posit 末尾之后的“幽灵位”概念，其值始终为 `0`。这里有另一幅图说明该概念，其中“`x`”是显式位，可以是 `0` 或 `1`：


    ![](img/pg107_1.jpg)


    如图所示，虽然幽灵位始终为 `0`，但根据显式位的不同，它们可以扮演不同角色。情况 1 是两个异常值，取决于符号位的值，要么是零，要么是 `NaR`。情况
    2 是如果符号位 `x` 为 `0` 则为 `maxPos`，如果 `x` 为 `1` 则为 −`minPos`。情况 3 是“暮光区”，指数位可能因机制位的长度而被挤出显式位的末端。情况
    4 是正常情况，幽灵位类似于小数“3.75”未表达的位，它等同于“3.7500000”。术语“幽灵位”有助于解释 posit 格式，但为简洁起见，该短语未在
    Posit 标准中定义。


    第 4 章批评了通过将字拆分为类似科学计数法的位字段来设计数字格式的做法。Posit 运算是由第 1 章的几何推理（环图和射影实数）发明的，这随后*决定了*位字段，包括一个具有新含义且长度可变的字段——机制位。


    对于 posit，“异常”并不意味着“将控制权交给异常处理程序”。它意味着软件或电路必须采取不同的做法，因为机制值 −∞ 无法用位置表示法表示。虽然零的公式正确计算结果为
    `2^(-∞)`，但显然实际处理方法是针对所有位为 `0` 的情况使用条件分支。


    对于 `NaR` 的情况，此定义及其脚注代表了与 IEEE Std 754 最深刻的背离之一，后者规定运算还必须扮演调试器的角色，持续监控计算中的不良行为，然后要么停止计算（“信号
    NaN”），要么继续（“静默 NaN”）。但那是调试工具的工作；它们可以在特定值作为结果出现时设置断点。程序调试完成后，你可以关闭“调试模式”并为最大速度编译它；这是标准做法，因为启用调试模式编译会使程序比最优编译慢许多倍。然而，使用
    IEEE 浮点数时，你拥有一个无法关闭的调试器。即使程序员已保证异常不会发生，它仍在每个时钟周期消耗能量检查异常。


    顺便说一段历史，当我们谈论 Bug 时：


    这是一个趣事，格蕾丝·霍珀后来成为海军上将，也是 20 世纪最受尊敬的计算机先驱之一。


    ![Grace Hopper (1906–1992), inventor of the concept of a programming language](img/pg108_1.jpg)


    格蕾丝·霍珀 (1906–1992)，编程语言概念的发明者


    在 IBM 推出 Fortran 多年前，她构想了用高级语言编写可在任何计算机上运行的程序，并构建了一个后来演变为 COBOL 的语言环境。


    我们甚至有那只真蛾，贴在记录该事件的日志本上：


    ![Literally the first computer bug](img/pg109_1.jpg)


    名副其实的第一个计算机 Bug


    然而，其词源（和昆虫学）并不完全准确。几十年前，托马斯·爱迪生就常写关于从他的电气发明中排除“Bug”的内容，所以该俚语早已流行。日志条目显示，他们觉得 Bug
    结果字面上真的是一只虫子，这很有趣。那几乎肯定不是格蕾丝·霍珀的日志本，但她（和她的团队）觉得好玩，并应归功于她们推广了“调试器”一词，用于查找程序错误的软件工具。


    在防止程序陷入不确定的胡乱状态方面，有三道防线：


    1.  程序员小心翼翼地考虑所有可能出错的方式，并确保程序以智能方式处理异常。调试器和自动语言分析器等工具协助程序员完成此任务。优秀的编译器在软件做可疑事情时（如在变量赋值前使用它）也会发出警告。


    '
