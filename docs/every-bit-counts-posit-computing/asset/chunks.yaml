    f) × 2^(e−bias)` 差别很大，因此熟悉浮点数的人往往会感到困惑。因为正数 posit 的隐含值为 1，负数 posit 的隐含值为 -2，所以
    `(1 − 3 s)` 是一个简单的公式，可以将这两个值作为符号位的函数复现出来。缩放因子 `2^((1−2) s ×(4) r+e+s)` 本可以写成 `2^((−1))
    s ×(4 r+e+s)`，但写成 `(−1)^s` 的惯例有点愚蠢，因为它暗示你实际上必须调用幂函数来计算 -1 的 `s` 次方。你只需要一个函数，当
