    ## 2. 数学运算的输入检查


    如果上述方法失效，现代语言（如 `C`）会检查数学运算的输入，并在例如计算机被要求对负数开平方或除以零时产生错误消息，该消息（通过操作系统）告知用户出了什么问题。


    ## 3. 最后一道防线


    作为最后一道防线，如果处理器以某种方式被要求执行无法产生实数作为结果的操作，可以通过调用 `NaR` 并将该无效性传播到最终输出来处理。程序员可能确信程序永远不会出错，从而要求编译器禁用第
    **2** 道防线的所有异常处理，这样运行速度会稍快一些，因为数学库例程不必首先测试输入是否有效。


    这就是为什么 `posits` 将 `NaR` 作为算术定义的一部分中的唯一异常。有人表示他们确实需要正无穷和负无穷，但这又混淆了调试和计算。很难想象有人会使用成品生产代码来“计算”无穷大作为有用结果。第
