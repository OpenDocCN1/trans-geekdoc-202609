    和 posit 方法是从低精度开始，通过逻辑步骤逐步推导得出的，最终形成了一个无异常的定义。


    但在出版之时，处理器硬件为我们提供的实数处理方式并非如此。甚至相去甚远。这意味着我们需要了解我们是如何走到今天这一步的背景故事。在下一章，我几乎可以保证读者会有几个惊喜，并获得一些别处找不到的信息。


