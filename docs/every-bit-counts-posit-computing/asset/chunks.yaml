  trans: "\n# 每一比特皆关键：Posit 计算\n\n![](img/cover.jpg)\n\n![封面：每一比特皆关键：Posit 计算，Chapman\
    \ & Hall/CRC 计算科学丛书，John L. Gustafson 著，CRC Press 出版，Taylor and Francis Group\
    \ 发行，Boca Raton、London、New York，CRC Press 是 Taylor and Francis Group（一个 informa\
    \ 业务）的一个品牌，也是 Chapman and Hall 丛书。](img/cover.jpg)\n\n## Chapman & Hall/CRC 计算科学丛书\n\
    \n**丛书编辑：** Horst Simon 和 Doug Kothe\n\n### 本丛书书目\n\n- **自主实验的方法与应用**  \n  *Daniela\
    \ Ushizima, Marcus M. Noack*\n\n- **数据密集型科学**  \n  Terence Critchlow, Kerstin\
    \ Kleese van Dam\n\n- **网格计算：技术与应用**  \n  *Barry Wilkinson*\n\n- **多核与加速器科学计算**\
    \  \n  *Jakub Kurzak, David A. Bader, Jack Dongarra*\n\n- **使用 Simulink 进行动力学仿真导论**\
    \  \n  *Michael A. Gray*\n\n- **调度导论**  \n  *Yves Robert, Frederic Vivien*\n\n\
    - **使用 MATLAB® 和 Python 进行建模与仿真导论**  \n  *Steven I. Gordon, Brian Guilfoos*\n\n\
    - **多核软件开发基础**  \n  *Victor Pankratius, Ali-Reza Adl-Tabatabai, Walter Tichy*\n\
    \n- **面向混合多核/众核 MPP 系统的编程**  \n  *John Levesque, Aaron Vose*\n\n- **百亿亿次科学应用：可扩展性与性能可移植性**\
    \  \n  *Tjerk P. Straatsma, Katerina B. Antypas, Timothy J. Williams*\n\n- **使用\
    \ CUDA 进行 GPU 并行程序开发**  \n  *Tolga Soyata*\n\n- **使用协同数组进行并行编程**  \n  *Robert\
    \ W. Numrich*\n\n- **当代高性能计算：从千万亿次走向百亿亿次，第 3 卷**  \n  *Jeffrey S. Vetter*\n\n\
    - **无与伦比：超级计算 50 年**  \n  *David Barkai*\n\n有关本丛书的更多信息，请访问：[`www.crcpress.com/Chapman--HallCRC-Computational-Science/book-series/CHCOMPUTSCI`](https://www.crcpress.com/Chapman--HallCRC-Computational-Science/book-series/CHCOMPUTSCI)\n\
