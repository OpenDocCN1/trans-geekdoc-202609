  trans: "\n尾随位下方的结构是一个“或树”，如果任何尾随位非零，则产生一个值为 `1` 的 ubit；如果所有尾随位均为零，则产生 `0`。即使你不看电路图，也能看出银行家舍入法确实需要逻辑门和逻辑延迟。如果你不关心舍入中的偏差，可以直接丢弃\
    \ `b[0]` 之后的所有位。有些处理器选择对传统格式这样做，这可能导致一个隐蔽的问题，其影响超出了结果中偏差误差的累积：缺乏可移植性和可复现性。当程序员发现程序在不同计算机上产生不同结果时，会花费大量无效工时试图找出原因，最终发现规则以一种不可见的方式被“变通”了。这就是为什么\
