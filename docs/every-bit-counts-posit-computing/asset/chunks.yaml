- raw: 'Like Quevedo''s proposal, there are a lot of different ways to represent the
    same value, and that is never a good thing. Every bit should count, but if the
    fraction bits are all zero, then the exponent bits do not count. Nor does the
    sign bit.


    To make matters worse, you can divide the fraction by two (shift the bits right
    by one place) and increase the exponent by one, and it is *exactly the same number*
    (if the rightmost bit of the fraction was a **0**). Similarly with shifting left
    and decreasing the exponent. So, instead of having 2^(36) different real values,
    there are far fewer. The “information per bit” is reduced by redundant ways to
    represent the same value.


    ## 4.7 The Rise and Fall of IEEE Std 754


    There were dozens of small companies (or small divisions of large companies like
    General Electric) trying to enter and succeed in the computer business in the
    1960s and 1970s, with names that are mostly forgotten. They had wildly different
    floating-point formats. The number of bits for exponent and fraction (and where
    they were placed) were different; the way of encoding the signs of exponent and
    fraction were different; some were base-2, some base-8, and some base-10.


    One base, that used by the biggest player in the industry, was base-16. IBM switched
    from the 704 format described above to “Hexadecimal Floating Point” (HFP) when
    it introduced its highly successful System/360 family of mainframes in 1964, and
    the word size was changed from 36-bit to 32-bit; the wobbling accuracy caused
    by using 16 as the number base (see [Section 2.7](#chapter2.xhtml#sec2_7)) caused
    their format to wobble between about 6.3 and 7.5 decimals of relative accuracy,
    effectively making the accuracy only 6.3 decimals in calculations of any length.
    The IBM 704''s single precision at least produced over 8 decimals of relative
    accuracy as the outputs of plus-minus-times-divide, which was frequently sufficient.
    Many scientific applications produced unacceptably inaccurate results when ported
    to IBM''s new design.


    The solution was obvious: Use double-precision (64-bit) float format, which was
    supported on the System/360 from its inception. That was back in the days when
    fetching and storing data to memory was *much* faster than doing an arithmetic
    operation on a floating-point number, so switching to double-precision was a no-brainer.
    It became routine for programmers of technical codes to make all the real variables
    double precision, without thinking about which variables actually needed to have
    around 15 decimals of accuracy.


    Arithmetic operations got dramatically faster over time, but memory access over
    physical distances improved slowly. “The Memory Wall,” where it takes hundreds
    of times longer to fetch or store a float than to do arithmetic with it, did not
    become obvious until the late 1970s. Rewriting software is extremely expensive,
    so we are now trapped in our use of overkill precision for many applications involving
    real numbers, largely because of that one decision by IBM to use HFP in the design
    of the System/360.


    Why did some kind of *de facto* standard not form to coalesce around a single
    way to represent real numbers? Having a unique format means it is very difficult
    to switch vendors, and vendors liked that. The data files computed with the existing
    machine might contain a mix of integer and character and float data, and while
    you might be able to port integer and character data to a different computer brand,
    extracting the float data and converting it could be a nightmare. If the destination
    format had a smaller dynamic range, that would cause overflow and underflow. If
    it had fewer bits of fraction, that could cause accuracy to drop below what was
    acceptable. It was what marketing people call a “lock”; once a customer, always
    a customer.


    ### 4.7.1 The Computing Industry Gets Emancipated


    Chip designer Intel was on a roll in the 1970s, having pivoted from making the
    first commercial DRAM memory chips to making the first microprocessors. Their
    first microprocessor, the Intel 4004, operated on four bits of data at a time,
    and the chip had about 2300 transistors; it took considerable innovation to squeeze
    the design into a single chip. It became practical for the first time to put some
    smarts into microwave ovens and traffic light controllers, and perhaps build four-function
    calculators. Intel co-founder Gordon Moore speculated that the optimal density
    of transistors would double every year; he later revised that to every *two* years,
    and chip designer Carver Mead dubbed that prediction “Moore''s law.” Engineers
    were designing much more capable microprocessors like the Intel 8080, which could
    make computers so cheap that they could one day become *personal computers*.


    But there was another plot arc going on, between the heavy-hitters in the computing
    industry: Sperry, IBM, Honeywell, and other makers of the large-scale “mainframe”
    computers of the 1960s. Mauchly and Eckert had used their experience with the
    government-funded ENIAC to develop computers practical enough to sell commercially
    through Sperry. Sperry had patented the idea of an electronic digital computer
    and was charging royalties from other computer makers. IBM brokered a patent-sharing
    agreement with Sperry, so IBM actually benefited from the barrier to entry into
    the market created by the royalty charges much the way Sperry did.


    At Honeywell, someone stumbled on the fact that Atanasoff''s 1937–1942 electronic
    digital computer was shown to Mauchly well before Mauchly and Eckert decided to
    switch from analog to digital and begin building the ENIAC, and that perhaps it
    was possible to break the Sperry patents. A federal case began, one of the longest
    and most expensive in US history. After seven years, 32,000 exhibits, and a 20,000-page
    transcript of testimonies, Judge Earl Larson ruled that the patents were *invalid*.
    An excerpt from his ruling:


    Cited by Clark Mollenhoff in *Atanasoff: Forgotten Father of the Computer*, 1988,
    page 210.


    The news of the verdict was buried by the timing; it came out the same day as
    the “Saturday Night Massacre” of the Watergate Scandal.


    Eckert and Mauchly certainly deserve credit for the massive amount of work they
    did to commercialize Atanasoff''s ideas, and Sperry remained a powerful contender
    among the largest computer companies, but the barrier to entry was gone. Whether
    you agree with Judge Larson''s conclusion or not, you have to admit that the result
    was that *no one* owned the broad patent on electronic digital computing; anyone
    could enter the market without fear of infringement or having to pay hefty royalty
    payments. And here were Intel and Motorola and other companies making increasingly
    capable microprocessors with transistor counts doubling every two years.


    Besides the legal barriers to entry, the technical problem of designing an entire
    computer had been just as daunting for a small company. But with microprocessors,
    that barrier was also gone. The skill set needed to hook together the processor
    and memory and keyboard and display was something an electrical engineering student
    could do as a senior project. The computing industry was emancipated as it had
    never been before.


    ### 4.7.2 The True Origin of IEEE Std 754


    ![John Palmer, 1946–2017](images/pg84_1.jpg)


    John Palmer, 1946–2017


    Rivals Motorola and Intel continued to improve their microprocessors, with transistor
    density improving to the point where they could consider working with more than
    8 bits of data at a time. Intel started work on a 16-bit processor called the
    i8086 that could address more than the 2^(16) (“64K”) bytes of memory that limited
    the first generation of personal computers from Apple, Commodore, and Radio Shack
    (Tandy). Bruce Ravenel was the lead architect of both the i8086 and a slower version
    called the i8088 that had the same instruction set but worked with 8 bits at a
    time to lower costs.'
