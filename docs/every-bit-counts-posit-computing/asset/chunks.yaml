    # IEEE 754 标准的历史与缺陷


    After many years of intense argument (mostly over Kahan''s insistence on subnormal
    number support, also called "gradual underflow"), IEEE Std 754 was approved and
    published in 1985. It is not free; anyone wanting to use it has to pay $100 to
    IEEE for a copy of the Standard. Palmer once told me, chortling, that "Whatever
    was in the 8087, that''s what''s in the IEEE Standard." Intel had won its battle.
    While IBM and Cray resisted following the Standard for the next decade, most vendors
    adopted (most of) the Standard, believing it would lead to data portability (which
    it did), and identical results on different computer systems (which it did not).


    When a format starts with a few dubious choices, such as underflow to zero, that
    leads to the need for other dubious choices such as "gradual underflow" that complicate
    the circuitry and create numerical hazards. The format ignored the 1950s lesson
    of *not* using sign-magnitude arithmetic, so once again there was "positive zero"
    and "negative zero." Are they equal? Yes, they decided. The two kinds of zero
    should test as equal. But their reciprocals should be *positive infinity* and
    *negative infinity*, so now you have a format where `x` can equal `y` but a function
    `f(x)` can be as far different from `f(y)` as you can get. When an engineer creates
    a hasty solution with flaws and then adds more hasty solutions to patch those
    flaws, it is called a *kludge*.


    Palmer decided to have a special bit pattern for indeterminate results like `0/0`,
    `log(-2)`, and he called it "NaN" for "Not a Number," even though imaginary numbers
    and complex numbers are, well, numbers. The bit test only applied to the exponent
    bits, however, leaving a vast set of bit patterns representing the same NaN. Two
    of the patterns were carved out to mean –∞ and ∞. Here are how many bit patterns
    were wasted saying a result is a NaN (IEEE half was added to the Standard in 2008):


    | **Precision** | **Number of NaN Patterns** |

    | --- | --- |

    | IEEE half (16 bits) | 4094 (over 6 percent of the bit patterns) |

    | IEEE single (32 bits) | 16,777,214 |

    | IEEE double (64 bits) | 9,007,199,254,740,990 (slightly over 9 trillion) |


    How would NaN work in comparison operations if it was not a specific bit string?
    The first axiom of Aristotelian logic is that A is A; a thing is equal to itself.
    But incredibly, the decision was made that NaN is *not* equal to itself. The web
    got ever more tangled. The mathematically absurd concepts of "positive zero" and
    "negative zero" created a mess of contradictory statements about how they should
    be handled. The 754 Standard is almost 100 pages long.


    To support the Standard in hardware, the logic circuitry has to handle this set
    of exception cases:


    ![The IEEE Std 754 format, 32-bit example, and the exception cases in a nutshell](images/pg90_1.jpg)


    While I suspect Kahan was initially appalled at being tasked with defending signed
    zero, he eventually did the mental gymnastics required and pronounced it a Good
    Thing because it could help with a concept called "branch cuts" in complex arithmetic.
    To make this work, the Standard requires yet another counterintuitive exception
    that the square root of "negative zero" should be "negative zero." I am not making
    this up.


    There were originally four rounding modes; more have been added in revisions of
    the Standard, but once you have multiple rounding modes, you remove any hope of
    guaranteeing the same results across different computing systems, even if all
    you do is plus-minus-times-divide. Scientific computing favors banker''s rounding
    (round to nearest, with ties to even), but graphics accelerators favor truncation
    (round toward zero) since it is faster and usually has an imperceptible effect
    on image quality.


    Another guarantee of Never Twice the Same Answer was that the *transcendental*
    math library functions (logarithms, exponentials, trigonometric and inverse trigonometric
    functions) do not have to be correctly rounded, according to the Standard. Correct
    rounding would mean different computing systems would get the same result down
    to the last bit, if they used the same rounding mode.


    Kahan reversed his initial demand for reproducibility and wrote position papers
    about how difficult and utterly impractical it would be to have such a requirement.
    Like a lawyer, he proved able to take either side of any design decision. He advocated
    for Intel by citing mathematics when Intel''s choice improved accuracy or correctness,
    and by citing practicality when the choice worsened either one.


    ## 4.7.5 A Bold Claim of Round-Trip Perfection


    In his 1983 commentary "Mathematics Written in Sand," Kahan boasts that you can
    square an IEEE float, and if it does not overflow or underflow, you can then take
    the square root and get back the absolute value of the original number exactly.
    *Always*. What a marvelous property! Here is the relevant text from that commentary:


    <https://people.eecs.berkeley.edu/~wkahan/MathSand.pdf>


    An overflow would produce infinity and remain infinity when we take the square
    root, letting us know that something went wrong. Similarly, an underflow would
    presumably produce zero, and remain zero when we then take the square root, also
    informing the user that the value is wrong.


    Shall we give it a try?


    Let''s set `x = 2.646978 × 10^(−23)` as a single-precision IEEE float. Now square
    it and round it with the default rounding mode (banker''s rounding), and you get


    `y = x² ≈ 1.401298 × 10^(−45)`.


    So it did not underflow to zero. The Standard states that square roots must be
    correctly rounded, so now try taking the square root and see if we get back `2.646978
    × 10^(−23)`, the `x` we started with, down to the last decimal:


    ```

    z = √y = 3.743392 × 10^(-23)

    ```


    Not a single decimal in the answer is right. How could a mathematician like Kahan
    be *that* wrong? The explanation reveals something about IEEE floats that very
    few computer technologists seem to know: IEEE floats have *tapered accuracy*.
    Not the same kind of tapered accuracy as posits, but it is there.


    Remember the decimal accuracy plots from [Chapter 2](#chapter2.xhtml)? Here is
    what the decimal accuracy plot looks like for IEEE single precision:


    ![Accuracy plot for IEEE standard 32-bit precision floats, with tapered accuracy
    on the left](images/pg92_1.jpg)


    For most of the range (from about `10^(−38)` to `10^38`), decimal accuracy wobbles
    between about 7.2 to 7.5 decimals. But what is that ramp over on the left, from
    about `10^(−45)` to `10^(−38)`? The accuracy ramps down to almost nothing, with
    no decimal digits correct. Those are the *subnormal* floats, and every IEEE precision
    has them. So the `x` that I chose has its square at the low end of that ramp,
    which is why not a single decimal digit was correct in computing `√(x²)`.


    Realizing this could happen, Kahan came up with a "read the fine print" workaround:
    He created his own definition of what "underflow" means. To every other computer
    programmer and user I have known, "underflow" means "what happens when a result
    is too small to represent" and you know it happens by looking at the output, zero.
    But the IEEE Standard says that the underflow flag must also be set if the result
    of an operation lands in the subnormal region *and is not exact*. But it is *not*
    too small to represent; it simply had to be rounded. So now that is "underflow"?
    How is anyone supposed to know that a processor flag was set? By using a low-level
    debugging tool and stepping through the compiled code one machine instruction
    at a time, watching the processor flags?

    '
  trans: '


    # IEEE 754 标准的历史与缺陷


    经过多年的激烈争论（主要围绕 Kahan 坚持要求支持非规格化数，也称为“渐进式下溢”），IEEE Std 754 于 1985 年获批并发布。它不是免费的；任何想要使用它的人都必须向
    IEEE 支付 100 美元购买一份标准副本。Palmer 曾兴高采烈地对我说：“8087 里有什么，IEEE 标准里就有什么。”Intel 赢得了这场战役。虽然
    IBM 和 Cray 在接下来的十年里抵制遵循该标准，但大多数厂商采纳了（大部分）标准，相信它能带来数据可移植性（确实如此），以及不同计算机系统上完全相同的结果（并未实现）。


    当一种格式一开始就做出了一些可疑的选择，例如下溢归零，这就会导致需要其他可疑的选择，例如“渐进式下溢”，从而使电路复杂化并产生数值隐患。该格式无视了 1950
    年代的教训——*不*使用符号-幅度运算，因此再次出现了“正零”和“负零”。它们相等吗？是的，委员会决定相等。这两种零在测试时应判定为相等。但它们的倒数应分别为*正无穷*和*负无穷*，于是你得到了一种格式：`x`
    可以等于 `y`，但函数 `f(x)` 却可能与 `f(y)` 差之毫厘、谬以千里。当工程师创建一个有缺陷的仓促方案，然后再添加更多仓促方案来修补这些缺陷时，这被称为*克鲁奇（kludge，拙劣的修补方案）*。


    Palmer 决定为 `0/0`、`log(-2)` 等不确定结果设置特殊的位模式，并称其为“NaN”，意为“非数字”，尽管虚数和复数嘛，也是数字。然而，位测试仅适用于指数位，留下了大量表示同一个
    NaN 的位模式。其中两个模式被单独划分出来表示 –∞ 和 ∞。下表列出了浪费在表示“结果为 NaN”上的位模式数量（IEEE 半精度于 2008 年加入标准）：


    | **精度** | **NaN 模式数量** |

    | --- | --- |

    | IEEE 半精度（16 位） | 4094（超过 6% 的位模式） |

    | IEEE 单精度（32 位） | 16,777,214 |

    | IEEE 双精度（64 位） | 9,007,199,254,740,990（略超 9 万亿） |


    如果 NaN 不是一个特定的位串，它在比较操作中该如何工作？亚里士多德逻辑的第一公理是 A 即 A；事物等于其本身。但令人难以置信的是，委员会决定 NaN
    *不*等于其本身。网罗越织越密。“正零”和“负零”这些数学上荒谬的概念，造成了关于它们应如何处理的相互矛盾的陈述一团糟。754 标准长达近 100 页。


    为了在硬件中支持该标准，逻辑电路必须处理这一组异常情况：


    ![IEEE Std 754 格式、32 位示例及异常情况概览](img/pg90_1.jpg)


    虽然我怀疑 Kahan 最初被指派捍卫带符号零时感到震惊，但他最终完成了所需的思维体操，并宣称这是一件*好事*，因为它有助于复数运算中称为“分支切割”的概念。为了让这套理论自洽，标准要求另一个违反直觉的例外：即“负零”的平方根应为“负零”。我不是在编造。


    最初有四种舍入模式；标准修订版中又增加了更多，但一旦有了多种舍入模式，你就彻底失去了在不同计算系间保证相同结果的希望，即使你只做加减乘除。科学计算偏爱银行家舍入法（四舍五入到最近，尾数为偶），但图形加速器偏爱截断（向零舍入），因为它更快，且通常对图像质量的影响难以察觉。


    另一个“永不两次相同答案”的保证是，根据标准，*超越*数学库函数（对数、指数、三角和反三角函数）不必正确舍入。正确舍入意味着如果使用相同的舍入模式，不同的计算系统将获得完全相同的结果，精确到最后一位。


    Kahan 推翻了他最初对可复现性的要求，撰写立场文件论证这一要求多么困难且完全不切实际。像律师一样，他证明了自己能为任何设计决策的任何一方辩护。当 Intel
    的选择提高了精度或正确性时，他引用数学为 Intel 辩护；当选择损害了精度或正确性时，他引用实用性为 Intel 辩护。


    ## 4.7.5 关于往返完美的大胆断言


    在 1983 年的评论文章《写在沙子上的数学》中，Kahan 吹嘘道：你可以对一个 IEEE 浮点数求平方，如果它没有上溢或下溢，然后再求平方根，就能精确得到原数的绝对值。*总是*如此。多么美妙的性质！以下是该评论中的相关文本：


    <https://people.eecs.berkeley.edu/~wkahan/MathSand.pdf>


    上溢会产生无穷大，求平方根后仍为无穷大，让我们知道出错了。类似地，下溢推测会产生零，随后求平方根仍为零，也告知用户该值是错误的。


    我们来试一试？


    设 `x = 2.646978 × 10^(−23)` 为单精度 IEEE 浮点数。现在对其求平方并使用默认舍入模式（银行家舍入法）舍入，得到


    `y = x² ≈ 1.401298 × 10^(−45)`。


    所以它没有下溢为零。标准规定平方根必须正确舍入，现在试着求平方根，看看能否精确到最后一位小数地得到我们开始时的 `2.646978 × 10^(−23)`，即
    `x`：


    ```

    z = √y = 3.743392 × 10^(-23)

    ```


    答案中没有一个十进制数字是对的。像 Kahan 这样的数学家怎么能错得*那么离谱*？解释揭示了关于 IEEE 浮点数的一个鲜为计算机技术人员所知的事实：IEEE
    浮点数具有*渐变精度*。不是 posit 那种渐变精度，但它确实存在。


    还记得第 2 章的十进制精度图吗？这是 IEEE 单精度的十进制精度图：


    ![IEEE 标准 32 位精度浮点数精度图，左侧显示渐变精度](img/pg92_1.jpg)


    在大部分范围内（约从 `10^(−38)` 到 `10³⁸`），十进制精度在约 7.2 到 7.5 位小数之间波动。但左侧那条从约 `10^(−45)` 到
    `10^(−38)` 的斜坡是什么？精度斜坡式下降到几乎为零，没有一位正确的十进制数字。那些是*非规格化*浮点数，每种 IEEE 精度都有它们。我选择的 `x`
    其平方处于那条斜坡的低端，这就是为什么计算 `√(x²)` 时没有一位十进制数字是正确的。


    意识到这可能发生后，Kahan 想出了一个“阅读细则”的变通方法：他创造了自己对“下溢”的定义。对每一位我认识的计算机程序员和用户来说，“下溢”意味着“结果太小无法表示”，你通过查看输出（零）就知道它发生了。但
    IEEE 标准规定，如果运算结果落入非规格化区域*且不精确*，也必须置位下溢标志。但它*并非*太小而无法表示；它只是不得不被舍入。所以这现在也算“下溢”？普通人怎么知道处理器标志被置位了？难道要用低级调试工具，逐条机器指令单步执行编译后的代码，盯着处理器标志看吗？


    '
