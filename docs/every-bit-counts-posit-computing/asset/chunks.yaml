    ## 2.1 绝对误差与相对误差


    就像数值分析中的许多事物一样，我们习惯了一些广被接受但逻辑其实相当松散的概念。我们衡量各类*误差*的方式就是其中之一。例如，这是一种广泛使用的衡量实数计算结果误差的方法：


    这没有错；如果值相同，它们的差为 0，所以没有误差。绝对误差适用于某人谎报年龄、驾驶速度或喝了多少杯酒的情况。但如果计算产生 315 而不是 314，这个误差看起来不是很像返回
    3.15 而不是 3.14 吗？为*实数*设计的数制通常跨越很大的动态范围。当被比较的值在同一数量级内时，简单地相减可能是最好的度量。


    对于跨越多个数量级的情况，计算值的*相对误差*传统上定义如下：


    你有理由对这个定义不满意。如果正确答案是 100 而你计算出 −1，上述相对误差公式结果仅为 1.01。如果你甚至不知道一个数的符号，那么你对答案几乎一无所知，因为符号是数字最重要的部分。在这种情况下，误差公式应返回“未定义”。即使宣布相对误差为无穷大，都算过奖了。


    如果你做实验测量得到了两个不同的值 `x[1]` 和 `x[2]`，你可能想谈谈测量中的相对误差。但你不知道 `x[exact]` 值。取决于你将 `x[1]`
    还是 `x[2]` 放在分母上，你会得到不同的相对误差。这似乎不对劲。

