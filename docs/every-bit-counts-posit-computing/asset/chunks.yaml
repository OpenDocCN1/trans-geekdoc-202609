    三位系统会怎么做？`(1, ∞)` 的平方根是同一组实数，`(1, ∞)`。你可以对 `(1, ∞)` 连续开任意次平方根，它永远不会产生数学上错误的结果
    1。


    ## 1.2 提高精度


    如果我们用四位代替三位，现在就可以在之前的值之间插入精确值。有许多可能的取值选择，但这里有一个合乎逻辑的选择：


    ![在 unum 环图上追加一位展示了开区间特异性的增加。](img/pg7_1.jpg)


    在 unum 环图上追加一位展示了开区间特异性的增加。


    在 `0` 和 `1` 之间插入 `½`，并将其映射到负数侧。但我们也可以通过取倒数来绕*水平*轴反射，这样 `2` 就位于 `1` 和 `∞` 之间。注意取倒数对开区间同样适用。唯一的例外是，虽然
    `0` 的倒数是 `NaR`，但 `NaR` 的倒数应保持为 `NaR`。一旦落在无效或不确定的结果上，至关重要的是 `NaR` 在每次运算下都得以保留，以便它出现在最终结果中，提醒出了问题。


    在大多数数制中，取负是完美的，所以一旦你有方法将 `a` 和 `b` 相加，你也就有方法用 `a` 减去 `b`，通过计算 `a × (−b)`。对于上述系统，一旦你有方法将
    `a` 和 `b` 相乘，你也就有方法用 `a` 除以 `b`，通过计算 `a + (1/b)`。如果 `b` 是 `NaR`，这能做正确的事，因为 `1/b`
    也是 `NaR`，而任何数乘以 `NaR` 都是 `NaR`，从而保留了计算中出错的信息。


    如何对有符号二进制整数取负？规则是：*翻转所有位并加 1，忽略任何溢出*。例如，如果整数是八位大小，整数 5 的二进制是


    ```

    00000101

    ```


    翻转所有位得到


    ```

    11111010

    ```


    然后加 1 就完成了。对于 8 位有符号整数，这是 -5 的位模式：


    ```

    11111011

    ```


    唯一会得到进位溢出的情况是当你试图对零取负时。例如，`00000000` 翻转为 `11111111`，给它加 1 应该是 `100000000`（九位），但你只有八位，所以最左边的位被丢弃。这就是为什么零没有符号；如果你用这种方式对零取负，你会得到零。


    `NaR` 也缺乏符号，并具有相同的迷人特性：在环中，将四位值视为整数，所以 `NaR` 是 `1000`。翻转位得到 `0111`，加 1 得到 `1000`，你又回到了
    `NaR`。


    要“绕垂直轴翻转”以将 `x` 变为 `-x`，将位串视为有符号整数并对其取负。要“绕水平轴翻转”以将 `x` 变为 `1/x`，忽略符号位并对其他位取负（即翻转它们并加
    1）。如果有进位，与符号位做逻辑或运算。这样，零 = `0000` 的倒数变为 `NaR` = `1000`。该规则也将 `NaR` 变回 `NaR`，所以没有异常情况。


    我们之所以应该关心最小化异常情况，是因为异常情况使计算机算术硬件变得浪费、混乱（且更慢），并且更难在所有情况下证明其正确性。


    ## 1.3 严谨还是猜测？艰难的抉择


    ![“完美是优秀的敌人。” — 伏尔泰](img/pg9_1.jpg)


    “完美是优秀的敌人。” — 伏尔泰


    这将我们带到了一个艰难的选择面前。对于一个让我们在计算机上处理实数的系统，我们可以继续完善这个*完美*的精确数和精确数之间开区间的系统，或者我们可以接受一个*优秀*的系统，其中只有精确数，我们将每个实数舍入到其中一个，在此过程中产生并累积数学误差。


    这是两个思想流派之间的战斗，有时类似于宗教战争。“足够好”的系统在计算领域最早出现，它是模仿科学计数法来表示实数，比如 `6.022 × 10²³`，我们为一个数字加上小数部分分配固定存储空间，乘以一个数字基数的幂。指数部分的存储量也是固定的。尾数部分可以是负数、零或正数，指数也是如此。用这种格式表示的数称为`浮点数`，简称
    `float`。与整数计算不同，整数计算只要在可表示范围内就是精确的，`float` 计算几乎总是不精确的。但用户发现它们对于我们想用计算机做的许多事情来说“足够好”了。通常是这样。


    `区间运算` 一词用于一种约六十年前引入的方法，其中所有量都被视为实数的闭集合 `[a, b]`，即满足 `a ≤ x ≤ b` 的实数 `x`。精确值表示为
    `[a, a]`。端点用 `float` 表示，在进行运算时，规则始终是严格地*界定*结果，并希望界限足够紧凑以具有实际价值。


    如果你可以选择用计算机获得数学上正确的答案，而不是靠猜测来完成计算且*大概率*足够好，谁会选后者？答案是：*几乎所有人*。在思想市场上，带有舍入误差的近似算术击败了
    `区间运算`。主要原因是除非你*真的*知道自己在做什么，否则在计算中使用区间可能会产生类似 `[-∞, ∞]` 这样的结果。知道如何防止区间界限变得荒谬地保守（比应有的宽得多）的专家群体不大，但这是一个狂热的群体，有时会像复兴会布道者一样充满激情地为严谨计算辩护。在全世界进行的所有技术计算中，如果使用
    `区间运算` 的量超过 1%，我会感到惊讶。


    因此，本书大部分内容将做一些类似于 `float` 的事情，并假设我们在对量执行算术运算后进行*舍入*。但它们将使用上述描述的射影实数框架，而*不是* `float`。我们该叫它们什么？我最初的想法是称它们为
    `guess`（猜测），因为舍入量是靠猜测来完成计算的一种方式。然而，“guess”可能带有贬义，所以让我们用一个更乐观的术语：`posit`。当用作名词时，其定义如下：


    ## 1.4 Posit 格式


    有了这个理由，我们现在用精确值替换环图中的开区间，这样最后一位就不再是 `ubit`。不再有末尾的品红色 `0` 或 `1` 位，但我们引入了两种新的位颜色，**金色**
    和 **棕色**，原因如下所述。我们还恢复了对 `0` 和 `NaR` 符号位的颜色编码，因为事实证明我们可以不再将它们视为“异常”。


    这是 4 位 `posit` 的环图：


    ![Posit 环图用区间内的单个点替换了开区间。](img/pg11_1.jpg)


    Posit 环图用区间内的单个点替换了开区间。


    当最后一位是 `1` 时（我们过去在那里有一个开区间），“插入”规则如下：


    *   在 `NaR` 和一个实数之间，插入该实数的两倍。

    *   在 `0` 和一个实数之间，插入该实数的一半。

    *   否则，在 `x` 和 `y` 之间，插入它们的平均值，`(x + y)/2`。

