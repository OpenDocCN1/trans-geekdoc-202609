    IEEE 浮点运算所用的所有标准逻辑电路。如果使用 `ubit` 来指示精确值之间的开区间，则称为 `valid` 类型，它具有 I 型 unums 的无误差能力。如果在每次运算后进行舍入，使用
    IEEE 浮点数的默认银行家舍入法，则称为 `posits`。我于 2016 年 12 月采用 第 1 章 中的几何方法发明了 posits，得益于 Isaac
    Yonemoto 在解码 regime bits（定标位）方面的见解，并于 2017 年 2 月在斯坦福大学进行了展示。它们似乎特别适合机器学习，正如 Yonemoto
    在斯坦福演讲结束时现场演示的那样。Posits 的创建也归功于 DARPA，该机构为使用下一代算术的线性代数解决方案提供了资金支持。因此，Posit 标准中有如下脚注：


    结果引发了一场国际性运动。第一篇论文，*Beating Floating Point at its Own Game: Posit Arithmetic*（在浮点数的主场击败浮点数：Posit
    算术）积累了数百次引用，因为人们测试该想法并设计硬件和软件环境来支持它。在没有实验数据的情况下，第一篇论文做出了这个初步猜测：


    初步猜测（2017）：关于不同 posit 精度下多少指数位最好


    成立了一个 Posit 工作组来制定标准。它包括来自美国、新加坡、加拿大、德国和英国的专家，均来自大学或国家研究机构；它*排除*了任何在销售计算硬件方面有商业利益的人，以避免
