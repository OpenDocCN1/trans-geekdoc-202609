    \ but it will serve for now. Let's first study three consecutive values in the\
    \ `posit8` set: `{7.5, 8, 10}`. The tie point between `7.5` and `8` is `7.75`.\
    \ The tie point between `8` and `10` is `9`.\n\nIf we happen to compute a value\
    \ that is exactly `7.5`, `8`, or `10`, then the accuracy is infinite. Between\
    \ those exactly-representable values, accuracy dips to a minimum at the tie point.\n\
    \n![The peaks actually go to infinity, since accuracy is infinite at exact points\
    \ 7.5, 8.0, and 10.0.](images/pg22_1.jpg)\n\nThe peaks actually go to infinity,\
    \ since accuracy is infinite at exact points `7.5`, `8.0`, and `10.0`.\n\nNotice\
    \ the slight discontinuity at the two minima. That is caused by the difference\
    \ between the *geometric* mean of two values `x` and `y`, `$\\sqrt{x \\cdot y}$`,\
    \ and the *arithmetic* mean, `(`x` + `y`)/ 2`. The discontinuities are at the\
    \ halfway points, but those are *not* the places where the decimal error (defined\
    \ as a logarithmic distance) is minimized. The minimum error would happen at the\
    \ geometric means, `$\\sqrt{7.5 \\times 8} = 7.7459669\\cdots$` and `$\\sqrt{8\
    \ \\times 10} = 8.944\\cdots$` instead of the arithmetic means, `7.75` and `9`,\
    \ which at this very low 8-bit precision is a large enough discontinuity to see\
    \ in the graph, barely.\n\nHence, the accuracy of a number system depends on the\
    \ rounding policy. By our definition of relative error, the worst-case decimal\
