    # 1 The Posit Number Format


    ## 1.1 The Essence of the Idea


    ![Whatever x turns out to be, there is a way to represent it on a computer using
    only three bits.](images/pg1_1.jpg)


    Whatever *x* turns out to be, there is a way to represent it on a computer using
    only three bits.


    Most books about mathematical ideas build up a foundation of definitions and make
    the reader wait to see where it is all going. Instead, this first chapter will
    get you to the punchline in as few pages as possible. Later, we can look at the
    underlying details and reasons for why the thing works the way it does.


    Here is a common misconception:


    Suppose a computer uses three bits to represent numbers. There are eight possible
    bit patterns, and if we treat them as normal base-2 *unsigned* integers, their
    meanings on any conventional modern computer would be as follows:


    ![](images/pg2_1.jpg)


    That is all you get. You can count from zero to seven with three bits, adding
    **1** to the last bit and propagating any carry bits, just like in grade school
    addition but with base-two (binary) instead of base-ten (decimal). If you try
    to add 1 to the representation of seven, **111**, you get overflow because you
    cannot store the carry bit **1000** so it wraps back to zero, **000**.


    When computers need *signed* integers, the most commonly-used system is that the
    numbers flip from positive to negative as soon as the leftmost bit hits **1**,
    and then they count upward back to zero, like this:


    ![](images/pg2_2.jpg)


    The leftmost bit (the most significant bit, or MSB) quickly informs us if a number
    is negative, so it is often called the *sign bit*, and the convention here is
    to color it **red** since accountants have used that color to indicate negative
    amounts of money for so long that “being in the red” is a synonym for being in
    debt.


    The unsigned integers overflow if you count up from **111**, but the signed integers
    overflow if you count up from **0****11**, so it is a matter of where you put
    the discontinuity. If you count up from negative one, **1****11**, you ignore
    the carry bit overflow and get **0****00**, so the system automatically does the
    right thing.


    *However*: Suppose you instead assigned the following meanings to the bit patterns:


    | **00****0** || 0 |


    | --- | --- |


    | **0****0****1** || Real *x* such that 0 < *x* < 1 |


    | **0****1****0** || 1 |


    | **0****1****1** || Real *x* such that 1 < *x* < ∞ |


    | **100** || Anything that is not a real |


    | **1****01** || Real *x* such that -∞ < *x* < -1 |


    | **1****1****0** || \-1 |


    | **1****1****1** || Real *x* such that -1 < *x* < 0 |


    That covers the entire real number line, -∞ < *x* < ∞, and if *x* is not even
    a real number, it provides a way to represent that as well. We abbreviate that
    as NaR for “Not a Real” and it includes forms of infinity, indeterminate forms
    like $\\frac{0}{0},$ complex numbers like $\\sqrt{- 1},$ and even things that
    are not numbers at all, like if a computer programmer tries to convert the character
    string “zebra” into this number format. It is *not a real*.


    It is not a very precise system, but it *does* provide a unique representation
    for every *x*.


    The rightmost bit (least-significant bit, or LSB) is color-coded **magenta** and
    is called the *ubit* (short for **u**ncertainty **bit**, which rhymes with cubit).
    Exact numbers are represented with bit strings that end in **0**. Bit strings
    that end in a **1** mean the *open interval* between exact values (or between
    an exact value and ±∞). The open interval between *a* and *b* is written (*a,
    b*). Like, $\\sqrt{2}$ and π are both represented by **0****1****1** since they
    satisfy 1 < *x* < ∞. The ubit is the fundamental idea underlying *unum* arithmetic,
    where *unum* is a shortening of “**u**niversal **num**ber.” For that reason, it
    is pronounced “yoo-num” and not Latin “oo-num” as in *E Pluribus Unum*.


    Including the ubit is exactly like writing $\\sqrt{2} = 1.414$ ⋯ where the “⋯”
    means, “There are more nonzero digits after the last one shown: 1.414 <$\\sqrt{2}$
    < 1.415.” That is mathematically true. If you say $\\sqrt{2}$ = 1.414, you are
    making an error just the same as you would be making an error to say 2 + 2 = 5.
    The presence or absence of the “⋯” takes only one bit to represent, and that is
    the ubit, just like the sign of a number takes only one bit to represent.


    Notice that we do not color-code the sign bit for **00****0**, as a reminder that
    zero has no sign. We also do not code it for the **100** = NaR exception since
    exceptions are also unsigned. Nor do we color-code the ubit of NaR since it makes
    no sense to regard “Not a Real” as an exact quantity.


    Notice that the unums map to a ring, because just as with the signed integer format,
    **1****1****1** being right next to **000** makes perfect sense. The real values
    and NaR are shown in **violet** on the outside of the ring, with the bit strings
    shown on the inside.


    ![This unum ring plot shows the entire real number line mapped to only three bits.](images/pg4_1.jpg)


    This unum *ring plot* shows the entire real number line mapped to only three bits.


    There is a concept called the *projective reals*, which means thinking of the
    real number line as a projection of a circle onto a line, with the source of light
    at the top of the circle:


    ![The projective reals concept maps the infinite line to a finite circle.](images/pg4_2.jpg)


    The *projective reals* concept maps the infinite line to a finite circle.


    I have added two things to this very old concept. First is the observation that
    signed integers map elegantly to the circle in the same way, flipping sign at
    the top of the circle. The second is that placing −1 and 1 at the east and west
    points on the circle allows symmetry about the horizontal axis when we take the
    *reciprocal* of a number.


    To save space, (*a, b*) means the open interval *a* < *x* < *b*. The three-bit
    system has a *vocabulary* of eight items: {NaR, (−∞, –1), –1, (–1, 0), 0, (0,
    1), 1, (1, ∞)}. As an ordered set, we treat NaR as if it were −∞, less than all
    the other items, though it also serves as the dumping ground for anything else
    that is not a real number.


    We can do arithmetic on both the exact numbers and the ranges. For instance, the
    square of the interval (0, 1) is exactly the same set of values, (0, 1). That
    may not seem like a big deal, but it actually means that this system is more powerful
    than what any calculator can do. Try entering a number between 0 and 1 into a
    calculator app (or a real calculator, which at this point is something of an antique)
    and square it. Square the result. Keep doing that over and over, and eventually
    one of two things will happen: The display will erroneously say the result is
    exactly 0, or it will say it is “Not a number.” I tried it just now on my laptop,
    and got the second case.


    ![](images/pg5_1.jpg)


    The software for the calculator app is certainly using a lot more than three bits.
    Yet it cannot produce a mathematically correct answer to “What is the square of
    1e–50?” because the power-of-ten notation only has two digits so it goes as small
    as 1e–99 (that is, 10^(\-99)). The calculator is saying that 10^(\-100) is “Not
    a number”; I beg to differ.


    Here is another example that does not involve underflow or overflow. Enter 2 and
    take the square root. Apply the square root button over and over and you get closer
    and closer to 1.


    After entering 2 and pressing the square root 49 times, I see this result:


    ![](images/pg6_1.jpg)'
