    \n*美国国会图书馆版本目录数据*\n\n作者：Gustafson, John L., 1955-\n\n书名：每一比特皆关键：Posit 计算 / John\
    \ L. Gustafson 著。\n\n描述：第一版。| 佛罗里达州 Boca Raton：CRC Press，2025。| 丛书：Chapman & Hall/CRC\
    \ 计算科学 | 包含参考文献和索引。| 摘要：“由高性能计算领域的权威专家、Gustafson 定律的发明者撰写，《每一比特皆关键：Posit 计算》解释了一种计算机计算新方法的基础，该方法通过在每个比特中封装比传统方法更多的信息，从而节省时间、存储、能源和功耗。AI\
    \ 和 HPC 社区越来越多地采用 Gustafson 于 2017 年引入的 Posit 方法，这可能是技术计算的未来。本书通过包含在机器上表示数字的斗争中的人文和历史侧面，使看似枯燥的主题变得引人入胜。本书全彩插图丰富，竭力使材料清晰易懂，甚至幽默风趣。从最简单的思想形式开始，各章根据既定的数学和工程设计原则逐步添加概念，构建了一个用于创建特定应用数制的稳健工具包。此外，还详细解释了\
    \ Posit 标准（2022），并通过动机和示例对该简短的 12 页文档进行了扩展”——出版商提供。\n\n标识符：LCCN 2024036235 (印刷版)\
    \ | LCCN 2024036236 (电子书) | ISBN 9781032738062 (精装) | ISBN 9781032738055 (平装)\
    \ | ISBN 9781003466024 (电子书)\n\n主题：LCSH：计算机科学--数学。\n\n分类：LCC QA76.9.M35 G84 2025\
    \ (印刷版) | LCC QA76.9.M35 (电子书) | DDC 004.01/51--dc23/eng/20240910\n\nLC 记录见 [`lccn.loc.gov/2024036235`](https://lccn.loc.gov/2024036235)\n\
    \nLC 电子书记录见 [`lccn.loc.gov/2024036236`](https://lccn.loc.gov/2024036236)\n\n##\
    \ ISBN\n\n- ISBN：978-1-032-73806-2 (精装)\n- ISBN：978-1-032-73805-5 (平装)\n- ISBN：978-1-003-46602-4\
    \ (电子书)\n\nDOI：[10.1201/9781003466024](https://doi.org/10.1201/9781003466024)\n\
    \n由 KnowledgeWorks Global Ltd. 使用 Source Sans Pro 字体排版\n\n*出版商注：* 本书由作者提供的印刷稿制作而成。\n\
    \n## 献词\n\n献给 Nan Ripley，她绝对不是一个数字。\n\n# 前言\n\n![](img/pgxv_1.jpg)\n\n1920 年，化学家撰写科学论文时可能会使用如下语言：\n\
    \n到 1960 年左右，措辞会变得更像这样：\n\n在当今，我不会惊讶于看到它被写成这样：\n\n技术写作似乎形成了一种风格，其目的不那么是为了与你沟通，而是为了用作者的聪明才智给你留下深刻印象。这不是那种书。爱因斯坦曾说：“除非你能向你的祖母解释清楚，否则你并不真正理解某事。”因此我怀着这个想法写了这本书，并进行了测试。我找了一位没有数学训练的祖母（不是我的）来阅读，她通过了测试。她完全懂了。（谢谢，Levitt\
    \ 女士！）\n\n尽管这是一本关于计算机算术的书，但它面向大众读者。它结合历史记录和我个人的经历，展现了事物的人文一面。阅读本书不需要微积分，也不需要超越\
    \ K-12 数学背景的任何知识。我竭尽全力让这个极其枯燥的主题尽可能清晰有趣。有时甚至幽默，近乎离经叛道。\n"
