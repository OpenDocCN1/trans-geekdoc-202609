    \ to the Compute Layer with the correct rounding.\n\nAnother piece of advice is\
    \ to test the round-trip conversion **pToX** and then **xToP** exhaustively and\
    \ plot **pToX**(**xToP**(*x*)) as a function of *x* with graphics tools. Start\
    \ with very low precision, like *n* = 4 bits, debug, and work up with *eS* values\
    \ from 0 to, say, 3. Also plot the discrete function **xToP**(**pToX**(*p*)) for\
    \ all possible *p* up to a precision *n*, beyond which exhaustive testing becomes\
    \ impractical. Experience shows that this is a quick and effective way to find\
    \ bugs."
  fmt: "\nThe structure under the trailing bits is an “OR tree” that produces a ubit\
    \ of `1` if any trailing bits are nonzero, or `0` if all trailing bits are zero.\
    \ Even if you do not read circuits, you can see that banker's rounding does take\
    \ logic gates and logic delays. If you did not care about bias in rounding, you\
    \ could simply drop all the bits after `b[0]`. Some processors opt to do that\
    \ with legacy formats, which can lead to an insidious problem that goes beyond\
    \ biased errors accumulating in the result: Lack of portability and reproducibility.\
    \ When a programmer discovers that a program produces different results on different\
    \ computers, it leads to many unproductive hours spent trying to figure out why,\
    \ culminating in the discovery that rules were bent in an invisible way. That\
    \ is why there is only one rounding mode for the posit format.\n\n```\nIf b−1\
    \ (the LSB of p) is 1,\n        If b0 (the next-to-last bit of p) is 1 or y >\
    \ 0, set p = p + 1.\nShift p right by one place to discard the b-1 bit and make\
    \ room for the sign bit.\nIf x < 0, return -p, else return p.\n```\n\n### 3.4.7\
    \ An Example\n\nCode-like descriptions can be tedious to read; an example should\
    \ make it easier to see how to turn a real number into posit representation. Let's\
    \ convert the decimal number `x` = −0.003 into an 8-bit posit with `eS` = 2. The\
    \ `uSeed` is 2^(2²) = 16.\n\nSince `x` is a real number and not zero, we do not\
    \ have to worry about those special cases with an infinitely long regime of `0`\
    \ bits. Its magnitude is also between `minPos` and `maxPos`, so there is no saturation.\n\
    \nSet `y` = |`x`| = 0.003. Begin by noticing that the regime will start with a\
    \ `0` bit because `y` is less than 1. In other words, the posit for `y` is in\
    \ the southeast quadrant of the ring. That consumes our first bit, so set `i`\
    \ = 1 to keep track of the number of bits used in `p`.\n\n$$\n\\begin{matrix}\
    \ p & y \\\\ {\\bullet \\bullet \\bullet \\bullet \\bullet \\bullet \\bullet \\\
    underset{\\begin{matrix} \\uparrow \\\\ {i = 1} \\\\ \\end{matrix}}{0}} & 0.003\
    \ \\\\ \\end{matrix}\n$$\n\nShift `p` left to make room for the next bit. Scale\
    \ `y` by multiplying by `uSeed` = 16 and check if it is still less than 1. It\
    \ is, so we have another `0` regime bit. Increment `i`.\n\n$$\n\\begin{matrix}\
    \ p & y \\\\ {\\bullet \\bullet \\bullet \\bullet \\bullet \\bullet \\underset{\\\
    begin{matrix} \\uparrow \\\\ {i = 2} \\\\ \\end{matrix}}{00}} & 0.048 \\\\ \\\
    end{matrix}\n$$\n\nAgain shift `p` and scale `y` by `uSeed`; 0.048 times 16 is\
    \ 0.768, which is still less than 1:\n\n$$\n\\begin{matrix} p & y \\\\ {\\bullet\
    \ \\bullet \\bullet \\bullet \\bullet \\underset{\\begin{matrix} \\uparrow \\\\\
    \ {i = 3} \\\\ \\end{matrix}}{000}} & 0.768 \\\\ \\end{matrix}\n$$\n\nShift `p`\
    \ left to make room for the next regime bit; this time, when we scale `y` by `uSeed`,\
    \ the result 0.768 × 16 = 12.288 is larger than 1, so terminate the regime with\
    \ the opposite bit and move on to finding the exponent bits.\n\n$$\n\\begin{matrix}\
    \ p & y \\\\ {\\bullet \\bullet \\bullet \\bullet \\underset{\\begin{matrix} \\\
    uparrow \\\\ {i~ = ~4} \\\\ \\end{matrix}}{0001}} & 12.288 \\\\ \\end{matrix}\n\
    $$\n\nThe first exponent bit is a scale factor of 2²`eS`\\-1 = 2²1 = 4, and since\
    \ `y` is larger than 4, the most significant exponent bit will be a 1. Shift `p`\
    \ left and OR in the 1 bit. Divide `y` by the scale factor of 4; 12.288 / 4 =\
    \ 3.072.\n\n$$\n\\begin{matrix} p & y \\\\ {\\bullet \\bullet \\bullet \\underset{\\\
    begin{array}{l} \\uparrow \\\\ {i\\operatorname{~=~}5} \\\\ \\end{array}}{00011}}\
    \ & 3.072 \\\\ \\end{matrix}\n$$\n\nThe next (and last) exponent bit is a scale\
    \ factor of 2²`eS`\\-2 = 2²0 = 2. Since `y` > 2, the next exponent bit will again\
