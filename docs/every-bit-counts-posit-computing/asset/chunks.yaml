- raw: "The structure under the trailing bits is an “OR tree” that produces a ubit\
    \ of **1** if any trailing bits are nonzero, or **0** if all trailing bits are\
    \ zero. Even if you do not read circuits, you can see that banker's rounding does\
    \ take logic gates and logic delays. If you did not care about bias in rounding,\
    \ you could simply drop all the bits after *b*[0]. Some processors opt to do that\
    \ with legacy formats, which can lead to an insidious problem that goes beyond\
    \ biased errors accumulating in the result: Lack of *portability* and *reproducibility*.\
    \ When a programmer discovers that a program produces different results on different\
    \ computers, it leads to many unproductive hours spent trying to figure out why,\
    \ culminating in the discovery that rules were bent in an invisible way. That\
    \ is why there is only one rounding mode for the posit format.\n\n```\nIf b−1\
    \ (the LSB of p) is 1,\n         If b0 (the next-to-last bit of p) is 1 or y >\
    \ 0, set p = p + 1.\nShift p right by one place to discard the b-1 bit and make\
    \ room for the sign bit.\nIf x < 0, return -p, else return p.\n```\n\n### 3.4.7 An\
    \ Example\n\nCode-like descriptions can be tedious to read; an example should\
    \ make it easier to see how to turn a real number into posit representation. Let's\
    \ convert the decimal number *x* = −0.003 into an 8-bit posit with *eS* = 2. The\
    \ *uSeed* is 2^(2²) = 16.\n\nSince *x* is a real number and not zero, we do not\
    \ have to worry about those special cases with an infinitely long regime of **0**\
    \ bits. Its magnitude is also between *minPos* and *maxPos*, so there is no saturation.\n\
    \nSet *y* = |*x*| = 0.003. Begin by noticing that the regime will start with a\
    \ **0** bit because *y* is less than 1. In other words, the posit for *y* is in\
    \ the southeast quadrant of the ring. That consumes our first bit, so set *i*\
    \ = 1 to keep track of the number of bits used in *p*.\n\n$$\\\\begin{matrix}\
    \ p & y \\\\\\\\ {\\\\bullet \\\\bullet \\\\bullet \\\\bullet \\\\bullet \\\\\
    bullet \\\\bullet \\\\underset{\\\\begin{matrix} \\\\uparrow \\\\\\\\ {i = 1}\
    \ \\\\\\\\ \\\\end{matrix}}{0}} & 0.003 \\\\\\\\ \\\\end{matrix}$$  \n\nShift\
    \ *p* left to make room for the next bit. Scale *y* by multiplying by *uSeed*\
    \ = 16 and check if it is still less than 1. It is, so we have another **0** regime\
    \ bit. Increment *i*.\n\n$$\\\\begin{matrix} p & y \\\\\\\\ {\\\\bullet \\\\bullet\
    \ \\\\bullet \\\\bullet \\\\bullet \\\\bullet \\\\underset{\\\\begin{matrix} \\\
    \\uparrow \\\\\\\\ {i = 2} \\\\\\\\ \\\\end{matrix}}{00}} & 0.048 \\\\\\\\ \\\\\
    end{matrix}$$  \n\nAgain shift *p* and scale *y* by *uSeed*; 0.048 times 16 is\
    \ 0.768, which is still less than 1:\n\n$$\\\\begin{matrix} p & y \\\\\\\\ {\\\
    \\bullet \\\\bullet \\\\bullet \\\\bullet \\\\bullet \\\\underset{\\\\begin{matrix}\
    \ \\\\uparrow \\\\\\\\ {i = 3} \\\\\\\\ \\\\end{matrix}}{000}} & 0.768 \\\\\\\\\
    \ \\\\end{matrix}$$  \n\nShift *p* left to make room for the next regime bit;\
    \ this time, when we scale *y* by *uSeed*, the result 0.768 × 16 = 12.288 is larger\
    \ than 1, so terminate the regime with the opposite bit and move on to finding\
    \ the exponent bits.\n\n$$\\\\begin{matrix} p & y \\\\\\\\ {\\\\bullet \\\\bullet\
    \ \\\\bullet \\\\bullet \\\\underset{\\\\begin{matrix} \\\\uparrow \\\\\\\\ {i~\
    \ = ~4} \\\\\\\\ \\\\end{matrix}}{0001}} & 12.288 \\\\\\\\ \\\\end{matrix}$$ \
    \ \n\nThe first exponent bit is a scale factor of 2²*eS*\\-1 = 2²1 = 4, and since\
    \ *y* is larger than 4, the most significant exponent bit will be a 1. Shift *p*\
    \ left and OR in the 1 bit. Divide *y* by the scale factor of 4; 12.288 / 4 =\
    \ 3.072.\n\n$$\\\\begin{matrix} p & y \\\\\\\\ {\\\\bullet \\\\bullet \\\\bullet\
    \ \\\\underset{\\\\begin{array}{l} \\\\uparrow \\\\\\\\ {i\\\\operatorname{~=~}5}\
    \ \\\\\\\\ \\\\end{array}}{00011}} & 3.072 \\\\\\\\ \\\\end{matrix}$$  \n\nThe\
    \ next (and last) exponent bit is a scale factor of 2²*eS*\\-2 = 2²0 = 2. Since\
    \ *y* > 2, the next exponent bit will again be a 1. Shift *p* left and OR in the\
    \ 1 bit. Divide *y* by the scale factor of 2; 3.072 / 2 = 1.536, and now we know\
    \ the significand: *y* = 1.536. We are done with the regime and exponent bits\
    \ that determine the power-of-2 scaling.\n\n$$\\\\begin{matrix} p & y \\\\\\\\\
    \ {\\\\bullet \\\\bullet \\\\underset{\\\\begin{array}{l} \\\\uparrow \\\\\\\\\
    \ {i = 6} \\\\\\\\ \\\\end{array}}{000111}} & 1.536 \\\\\\\\ \\\\end{matrix}$$\
    \  \n\nTo find the fraction bits, first subtract the implicit 1 from the significand\
    \ *y* = 1.536 to get just the fraction part, 0.536. Double the fraction to get\
    \ 1.072; since that is greater than 1, the first fraction bit is a **1**:\n\n\
    $$\\\\begin{matrix} p & y \\\\\\\\ {\\\\bullet \\\\underset{\\\\begin{array}{l}\
    \ \\\\uparrow \\\\\\\\ {i = 7} \\\\\\\\ \\\\end{array}}{0001111}} & 1.072 \\\\\
    \\\\ \\\\end{matrix}$$  \n\nThat last bit will be in the *b*[0] position in the\
    \ final posit bit string, but we need one more bit for banker's rounding, the\
    \ *b*[−1] “rounding bit.” Subtract 1 from *y* and double it to get *y* = 0.144.\
    \ That is not greater than 1, so the next fraction bit is **0**, which is in gray\
    \ to remind us that it is a temporary bit beyond the last bit of the posit. And\
    \ that is the *n*^(th) bit, so now we are ready to round.\n\n$$\\\\,\\\\,\\\\\
    begin{matrix} p & y \\\\\\\\ \\\\underset{\\\\begin{array}{l} \\\\uparrow \\\\\
    \\\\ {i = 8} \\\\\\\\ \\\\end{array}}{00011110} & 1.144 \\\\\\\\ \\\\end{matrix}$$\
    \  \n\nThe *b*[−1] is **0**, so there is no need to round up. Shift *p* one place\
    \ to the right, which does two necessary things at once: It discards the *b*[−1]\
    \ and makes *b*[0] the LSB, and it shifts in a sign bit **0** on the left indicating\
    \ a positive number.\n\n$$\\\\begin{matrix} p \\\\\\\\ {0000\\\\text{1111}} \\\
    \\\\\\ \\\\end{matrix}$$  \n\nThe final step is to apply the sign of *x*. If *x*\
    \ were positive, we would be done, but since *x* = −0.003, we need to negate *p*.\
    \ Flip all the bits to **11110000** and add 1 to the LSB:\n\n$$\\\\begin{matrix}\
    \ p \\\\\\\\ {\\\\text{1111}000\\\\text{1}} \\\\\\\\ \\\\end{matrix}$$  \n\nThat\
    \ is the closest posit representation to *x* = -0.003. The posit decodes as $-\
    \ \\\\frac{3}{1024} = - 0.0029296875$ which is −0.003 to one significant digit.\n\
    \nThe thing to notice about encoding a posit is that it progresses from MSB to\
    \ LSB, one bit at a time. That seems like the logical and obvious thing to do,\
    \ but be aware that it is *not* the way reals are commonly encoded using legacy\
    \ formats.\n\n### 3.4.8 Some Advice for Anyone Building a Posit Environment\n\n\
    If you presently have a way to work with real values (such as IEEE floats, which\
    \ will be described in the next chapter), make sure they have enough precision\
    \ to do exact posit calculations. For example, here is a common pitfall:\n\nThe\
    \ problem, and this is perhaps surprising, is that 64-bit floats have insufficient\
    \ precision. The 32-bit posits have significands with as many as 28 bits. When\
    \ multiplied, the product can have 56 significant bits. But a 64-bit IEEE float\
    \ has only 53 significant bits. There are situations where the final conversion\
    \ back to a posit will be off by one in the last bit and that will create incorrect\
    \ experimental results.\n\nA much safer approach is to use integer arithmetic.\
