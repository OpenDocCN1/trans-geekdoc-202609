- raw: 'Setting *y* = |*x*| makes some steps simpler. That does not lose the information
    about whether *x* is positive or negative (or zero), since we do not alter the
    input value *x* and can always refer back to it.


    If *y* = 0, return the *n*\-bit string consisting of all 0 bits, **0000**⋯**000**.
    It is important to take care of possible NaR or 0 cases before trying to find
    the regime bits. This also takes care of the cases where *y* ≥ *maxPos* or *y*
    ≤ *minPos*:


    ```

    If y ≥ maxPos,

             Return the posit for maxPos times the sign of x,

    Else if y ≤ minPos,

             Return the posit for minPos times the sign of x,

    End if.

    ```


    This also takes care of one of the rounding rules, that magnitudes outside the
    dynamic range saturate to the (signed) largest or smallest value. Also, handling
    these special cases assures that the opposite bit ending the regime will fit in
    the *n*\-bit string built in the next subsection.


    ### 3.4.3 Encode the Regime Bits


    Since computer environments usually support unsigned integer types, it is easy
    to treat the posit bit string as an unsigned *n*\-bit integer. Having already
    dealt with the NaR and 0 cases, the regime can be at most *n* - 1 bits long. With
    an *n*\-bit unsigned integer *p* we can store the regime starting in the Most
    Significant Bit (MSB) since we do not need a sign bit, and that will leave an
    extra bit at the end that we can use to do proper rounding.


    ```

    If y ≥ 1, the regime will be a string of 1 bits:

             Set p = 1 and i = 2. The number of posit bits found so far is i.

             While y ≥ uSeed and i < n,

                     shift p left by one place and set the LSB to 1 (lengthen the
    regime).

                     Divide y by uSeed and increment i.

             End while.

             Shift p left by one place to prepare for the next phase, and increment
    i.

    Else y < 1, so the regime will be a string of 0 bits:

             Set p = 0 and i = 1 (off by 1 from the y ≥ 1 case, since we seek 1 ≤
    y < uSeed).

             While y < 1 and i ≤ n,

                     multiply y by uSeed and increment i.

             End while.

             Set p = 1 (the opposite bit ending the regime) and increment i.

    End if.

    ```


    The “Shift *p* left by one place” creates a **0** as the LSB, which is the opposite
    bit ending the regime in the case where the regime is a string of **1** bits.


    ### 3.4.4 Encode the Exponent Bits


    Converting *x* to the posit format has proceeded from left to right, and finding
    the exponent bits is no different. We know that 1 ≤ *y* < *uSeed*. If the format
    uses *eS* = 0 then there is nothing to do, so skip to finding the fraction bits.
    Otherwise, continue bisecting to find the exponent bits from most significant
    to least significant. Computing *uSeed* = 2²*eS* is actually an easy thing for
    a computer to do, because a **1** bit shifted left by *eS* places is the unsigned
    integer for 2*^(eS)*, and then a **1** bit shifted left by that unsigned integer
    is 2²*eS*. In the C computer language, it would be concisely expressed as 1 <<
    (1 << eS).


    So the algorithm for extracting the exponent bits looks like this:


    ```

    Set e = eS − 1.

    While i < n and e > 0,

            Shift p left by one place to make a place for an exponent bit.

            Set scale = 1 << (1 << e).

            If y ≥ scale, set the LSB of p to 1 and set y = y / scale.

            Increment i, since we have used another posit bit for the exponent.

            Set e = e − 1.

    End while.

    Shift p left by one place to prepare for the next phase, and increment i.

    ```


    If the bit counter *i* actually reaches *n* before *e* decrements to 0, the exponent
    bits will be clipped off and the posit will be in the “Twilight Zone.” Otherwise,
    we will be left with the significand *y*, with 1 ≤ *y* < 2.


    ### 3.4.5 Encode the Fraction Bits


    Since *y* is now a fixed-point number between 1 and 2, its binary bit string always
    begins with a **1** bit, so there is no need to store that. The **1** is implied.
    Hence, we first find the fraction by subtracting 1 from *y*. Then each bit of
    the fraction is found by doubling the fraction and testing if it is larger than
    1; if it is, install a **1** bit in the posit bit string, subtract 1 from *y*,
    and repeat until there is no more room for fraction bits.


    Once all *n* + 1 bits are populated, the test of whether the conversion was exact
    is very simple: Is *y* > 0? If it is, then the ubit is **1** because there are
    more bits after the last one. But if *y* = 0, then the conversion landed exactly
    on a posit value, so the ubit is **0**. Remember, the ubit is needed for the banker''s
    rounding.


    ```

    Set y = y − 1.

    While i < n,

            Shift p left by one place. This puts a 0 in the LSB position.

            Set y = 2 × y.

            If y ≥ 1, set the LSB of p to 1 and set y = y − 1.

            Increment i, since we''ve used another posit bit for the fraction.

    End while.

    ```


    After this step, *i = n*, so we have a bit string with *n* bits. But it does not
    have the sign bit, so we have one more bit than will be in the rounded value.
    Call it *b*[−1].


    ### 3.4.6 Round and Apply the Sign of *x*


    *Banker''s rounding* is rounding a value *x* to the nearest representable number
    *p*, and if there are two possibilities for *p* equally close to *x*, the rule
    is to choose the one that has *even* representation. In binary, even numbers end
    in **0** and odd numbers end in **1**. The reason for the “ties go to even” rule
    is that it makes the rounding *unbiased*. Imagine a bank that needs to calculate
    interest to the penny on billions of dollars of transactions; even the slightest
    bias up or down could quickly amount to a fortune. There have been schemes to
    do this, using rounding to get something for nothing.


    Banker''s rounding is the rounding mode for the posit format, and it is the *only*
    rounding mode. No matter whether you are rounding integer format, fixed-point,
    floats, or posits, the principle is the same. The algorithm for banker''s rounding
    needs just *three bits*, shown in the following figure for the case of an 8-bit
    format:


    ![The three bits needed for banker''s rounding](images/pg51_1.jpg)


    The three bits needed for banker''s rounding


    For an *n*\-bit format, our convention is to label bits with subscripts from 0
    for the LSB up to *n* - 1 for the MSB. The three bits we need are the LSB, a “*b*[\-1]”
    bit we can call the *rounding bit*, and a bit we saw in [Chapter 1](#chapter1.xhtml),
    the ubit. If ubit = **1**, that indicates there are more significant digits after
    *b*[\-1], like writing “⋯” after the last digit of a number.


    If *b*[\-1] is **1** and the ubit is **0**, the value is at the tie point; it
    is the value that would be represented if there were one more bit. To make the
    rounded value even, if *b*[0] is 0, do nothing (that is, round down by ignoring
    *b*[\-1]); but if *b*[0] is **1**, add **1** to the LSB and propagate the carry
    to the left. With posit format, there is no possibility of overflow.


    If *b*[\-1] is **1** and the ubit is **1**, meaning there are some **1** bits
    after bit *b*[\-1], then the value is above the tie point and needs to be rounded
    up. The four cases for rounding a value *x* to a posit are as follows:


    *   If *x* is 0 or NaR, return the respective posit representing that value.


    *   If |*x*| ≥ *maxPos*, return the posit for *maxPos* with the same sign as *x.*


    *   If |*x*| ≤ *minPos*, return the posit for *minPos* with the same sign as *x*.


    *   If *minPos* < |*x*| < *maxPos*, encode *x* to *n* + 1 bits; if that representation
    is exact, set the ubit to **0**, else set the ubit to **1**. If *b*[\-1] is **1**
    and (*b*[0] is **1** or the ubit is **1**), add 1 to the *b*[0] position and propagate
    any carry.


    If you like digital hardware design and can read circuit diagrams, the figure
    below shows what banker''s rounding looks like for a number with the extra *b*[\-1]
    bit and some trailing bits in temporary storage.


    ![Logic circuit for banker''s rounding](images/pg52_1.jpg)


    Logic circuit for banker''s rounding'
