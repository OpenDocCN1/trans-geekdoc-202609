    `x[1]` 和 `x[2]` 的对数（以 10 为底）之差，这等同于它们比率的对数：


    绝对值使得 `x[1]` 和 `x[2]` 可以互换。因此，它可用于测量实验误差。此外，无论你使用 `x[1]` 和 `x[2]` 作为输入，还是 1 /
    `x[1]` 和 1 / `x[2]`，它都会产生相同的结果。所以 `that`（这）看起来像是一个数学上合理的定义。但如果 `x[exact]` 是 100，而我们计算出
    `x` = 110，误差约为 4 dB，这看起来完全不像传统的相对误差值 0.1。我们能否两全其美，既拥有比率对数的优雅，又拥有类似传统相对误差的形式？


