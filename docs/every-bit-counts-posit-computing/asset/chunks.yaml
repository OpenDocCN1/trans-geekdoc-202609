- raw: 'The publisher has generously consented to the use of four-color printing on
    every page. Perhaps the hardest thing is all the binary numbers, which even computer
    science majors struggle to read. Color-coding the 0 and 1 bits in long bit strings
    makes them much easier to figure out. Most people are visual learners, and I spent
    more than half the time creating this book in crafting the illustrations that
    explain the concepts. Text backgrounds also are color-coded as guideposts to inform
    you of when there is math, computer code, important points, pitfalls, and so on.


    There is at least one Exercise for the Reader in every chapter, for those who
    are ambitious. If you do not attempt them, you still might want to read the Answers
    to Exercises section because there is new material there that is not found elsewhere
    in the book.


    There are no footnotes, end notes, or even References. Modern web search has made
    it so easy to find a source from the author''s name and subject that a References
    section seems obsolete. There is also no “Theorem-Proof” structure. The opposite
    approach has been used, that of building up to an idea one step at a time, even
    allowing you to see mistakes made along the way. I speak from experience when
    I say that mathematicians will hate this book and its informal style. “Where are
    the Greek letters? Where is the cryptic notation? I feel like you are talking
    down to me.” They are certainly entitled to their opinion.


    # Acknowledgments


    ![The governments of the US and Singapore, my two favorite nations, made this
    book possible.](images/pgxvii_1.jpg)


    The governments of the US and Singapore, my two favorite nations, made this book
    possible.


    Three people stand out as having enabled the research that led to the discovery
    of posit format and thus the contents of this book:


    *   Dr. Marek Michalewicz, former Director of Singapore''s A\*STAR Computational
    Resource Centre (A\*CRC),


    *   Professor Tin Wee Tan, Director of the Singapore National Supercomputing Centre
    (NSCC), and


    *   Professor Weng-Fai Wong of the National University of Singapore''s School
    of Computing.


    After seeing the potential in my earlier efforts to find something better than
    floating-point arithmetic, they set up an incredible arrangement for me to move
    to Singapore and continue the research. Professor Wong also let me co-advise his
    two brilliant graduate students, Elavarasi Manogaran and Himeshi De Silva, who
    did hundreds of hours of experimental computational studies that steered the choices
    made in the design of posit arithmetic.


    I am also at a loss to express my gratitude for those who reviewed my drafts and
    provided detailed (and much-needed) feedback. Hauke Rehr, besides being a crack
    mathematician with a sharp sense of correctness, has a seemingly superhuman ability
    to tell when a comma is in a font one point size too small, that sort of thing.
    Laslo Hunhold not only provided great feedback, but he advanced the state of the
    art with his own “takum” format in time for it to be included in the final chapter.
    My daughter, Janice Marquardt, was of immense help spotting things no other reviewer
    noticed.


    The creation of posit format was triggered by a request from MIT''s Kurt Keville,
    who told me in November 2016 that the RISC-V committee wanted a real number format
    that wasn''t IEEE Std 754, and asked me to design one for them. After three weeks
    of struggling with modifications to Type II unums, I made the hardware-friendly
    break-through on December 3. I am also grateful to Kurt for detailed feedback
    for the draft of this book. Like my Singapore supporters, he is another *raison
    d''être* for the posit arithmetic format.


    Dr. Siew Hoon (Cerlane) Leong of NSCC led the development of the SoftPosit library,
    the establishment of the [posithub.org](http://posithub.org) website, and the
    establishment of the Conference on Next-Generation Arithmetic (CoNGA) series.
    She also helped make many key decisions in the *Posit Standard (2022)*, including
    how the quire should handle exceptions. I do not know how I could have established
    a beachhead for the posit format without her boundless energy and keen eye for
    what needs to be done.


    The cover artwork was done by a remarkable and multitalented Singapore artist,
    Sumei Chew. Without being a mathematician, she managed to capture the sense of
    wonder and genuine fun that exists in mathematics and that I hope readers will
    find in this book. She was a great friend to me during my years in Singapore and
    made my experience even better than it already was.


    To my surprise and delight, cartoonist Sidney Harris allowed me to use his excellent
    cartoons that you will find scattered throughout the book. It is remarkable how
    perfectly many of his punchlines line up with the topic of the section where they
    appear. For a cartoonist, he somehow seems to know an awful lot about how scientists
    act when they''re next to blackboards. Thank you, Sidney.


    # How to Read this Book


    When jargon is introduced (some of it industry-wide and some of it coined in this
    book), the first use is explained in a light-cyan **Definition** box, like this:


    If you forget a definition, check the Glossary (pages 353–361).


    When someone else''s writing or historical work is being cited, it is displayed
    in a parchment-colored box, like this:


    A light red background color is used to signal the reader that something is mathematical,
    like


    It is usually possible to skip over those formula displays without losing the
    flow of the main body text.


    Similarly, you can usually skip over computer code, unless you''re interested.
    It has a light green background. There are two kinds of computer code; one is
    something like C or C++ to show how something might be programmed in general,
    like this:


    ```

    unsigned reverse (unsigned x) {

          x = ((x & 0 x55555555) << 1) | ((x >> 1) & 0 x55555555);

          x = ((x & 0 x33333333) << 2) | ((x >> 2) & 0 x33333333);

          x = ((x & 0 x0F0F0F0F) << 4) | ((x >> 4) & 0 x0F0F0F0F);

          x = (x << 24) | ((x & 0 xFF00) << 8) |

                  ((x >> 8) & 0 xFF00) | (x >> 24);

          return x;

     }

    ```


    The other kind is live code that actually executes. This book was not created
    with a word processing program or LATEX; this entire book is a computer program
    written in *Mathematica*. For example, this code


    ```

    morris8 = Union[morris8];

    Print[“morris8 has ”, Length[morris8], “ unique numbers.”]

    ```


    morris8 has 144 unique numbers


    actually executes; it generates what follows in the text. The input commands to
    *Mathematica* are in boldface **Courier**, a typewriter-like typeface, and the
    text output is in regular Courier, not bold. Sometimes the output is graphical.


    Single-letter variables are concise, but sometimes longer names are better reminders
    of what is being represented. Words or shortened words in phrases are concatenated,
    with capital letters informing you about where a new word begins, a system called
    CamelCase. There is also lower-case camelCase where the first letter is always
    lower-case, and that is what is used in coining variable names like *maxPos* (for
    maximum posit value) and *eS* (for exponent size). Reserved words in *Mathematica*
    use CamelCase, so by using lower-case camelCase there is no chance of colliding
    with a reserved word.


    While the purpose of this book is certainly not to teach *Mathematica*, it is
    helpful to understand that everything is computed with symbolic mathematics until
    you ask for it to be turned into a number with the **N****\[**…\] command, like
    this:


    ```

    Print[π]

    Print[N[π]]

    Print[N[π, 16]]

    ```


    ```

    π

    3.14159 2654

    3.14159 26535 89793

    ```


    Boldfaced **Courier** font is used to display binary numbers like **0101101**.
    Decimal numbers are left in the same font as the main text, like 1000.


    Boxed text with this light blue background is important, not to be skipped:'
  fmt: "\n出版商慷慨同意在每一页使用四色印刷。最难的部分或许是所有的二进制数字，即使是计算机科学专业的学生也难以阅读。对长比特串中的 0 和 1 比特进行颜色编码，使其更容易理解。大多数人是视觉学习者，我在创作本书的过程中花费了一半以上的时间来制作解释概念的插图。文本背景也采用颜色编码作为路标，告知您何时涉及数学、计算机代码、重要要点、陷阱等。\n\
    \n每章至少包含一道“读者练习”，供有进取心的读者挑战。如果您不尝试这些练习，仍建议阅读“练习答案”部分，因为那里包含书中其他地方没有的新内容。\n\n本书没有脚注、尾注，甚至没有参考文献。现代网络搜索使得通过作者姓名和主题查找来源变得极其容易，因此参考文献部分显得过时。也没有“定理-证明”结构。采用的是相反的方法：一步步构建概念，甚至允许您看到过程中犯的错误。凭经验我可以断言，数学家会讨厌这本书及其非正式风格。“希腊字母在哪里？晦涩的符号在哪里？我觉得你在居高临下地跟我说话。”他们当然有权保留自己的观点。\n\
    \n# 致谢\n\n![美国和新加坡政府，我最喜爱的两个国家，使这本书成为可能。](images/pgxvii_1.jpg)\n\n美国和新加坡政府，我最喜爱的两个国家，使这本书成为可能。\n\
    \n有三人因促成了导致 `posit` 格式发现的研究，从而使本书内容得以呈现，特此鸣谢：\n\n*   **Marek Michalewicz** 博士，前新加坡\
    \ `A*STAR` 计算资源中心（`A*CRC`）主任，\n*   **Tin Wee Tan** 教授，新加坡国家超级计算中心（`NSCC`）主任，以及\n\
    *   **Weng-Fai Wong** 教授，新加坡国立大学计算机学院教授。\n\n在看到我早期寻找优于浮点运算的尝试的潜力后，他们为我安排了前往新加坡继续研究的绝佳条件。**Wong**\
    \ 教授还允许我共同指导他的两位优秀研究生 **Elavarasi Manogaran** 和 **Himeshi De Silva**，她们进行了数百小时的实验性计算研究，指导了\
    \ `posit` 算术设计中的选择。\n\n我同样无法言喻地感谢那些审阅我的草稿并提供详细（且极其必要）反馈的人。**Hauke Rehr** 不仅是一位敏锐的数学家，对正确性有着敏锐的洞察力，还拥有近乎超人的能力，能发现逗号字体大小相差一个点这类细节。**Laslo\
    \ Hunhold** 不仅提供了宝贵反馈，还在本书最后一章收录前，凭借他自己的 `takum` 格式推动了技术前沿。我的女儿 **Janice Marquardt**\
    \ 在发现其他审阅者未注意到的问题方面提供了巨大帮助。\n\n`posit` 格式的创建源于 **MIT** 的 **Kurt Keville** 的请求，他在\
    \ 2016 年 11 月告诉我 `RISC-V` 委员会想要一种非 `IEEE Std 754` 的实数格式，并请我为他们设计一种。在与 `Type II\
    \ unums` 的修改斗争了三周后，我在 12 月 3 日实现了硬件友好的突破。我也感谢 **Kurt** 对本书草稿的详细反馈。像我的新加坡支持者一样，他也是\
    \ `posit` 算术格式存在的另一个理由。\n\n**NSCC** 的 **Siew Hoon (Cerlane) Leong** 博士主导了 `SoftPosit`\
    \ 库的开发、[posithub.org](http://posithub.org) 网站的建立以及“下一代算术会议”（`CoNGA`）系列的创办。她还协助在\
    \ `Posit Standard (2022)` 中做出了许多关键决策，包括 `quire` 应如何处理异常。没有她无限的精力和敏锐的洞察力，我不知道如何为\
    \ `posit` 格式建立桥头堡。\n\n封面艺术由杰出且多才多艺的新加坡艺术家 **Sumei Chew** 创作。尽管她不是数学家，却捕捉到了数学中存在的惊奇感和真正的乐趣，这也是我希望读者能在本书中发现的。在我在新加坡的岁月里，她是我的良师益友，让我的体验比原本更美好。\n\
    \n令我惊喜和欣喜的是，漫画家 **Sidney Harris** 允许我使用他优秀的漫画，您将在全书中看到它们。令人惊叹的是，他的许多妙语竟与所在章节的主题完美契合。作为一个漫画家，他似乎对科学家在黑板前的行为了如指掌。谢谢您，**Sidney**。\n\
    \n# 如何阅读本书\n\n当引入术语时（有些是行业通用的，有些是本书创造的），首次使用会在浅青色的 **Definition** 框中解释，如下所示：\n\
    \n如果您忘记了定义，请查阅词汇表（第 353–361 页）。\n\n当引用他人的著作或历史工作时，会显示在羊皮纸色的框中，如下所示：\n\n浅红色背景用于提示读者涉及数学内容，如下所示：\n\
    \n通常可以跳过那些公式展示，而不影响主体文本的阅读流畅性。\n\n同样，除非您感兴趣，通常也可以跳过计算机代码。代码采用浅绿色背景。有两种计算机代码：一种类似\
    \ `C` 或 `C++`，展示如何一般性地编程，如下所示：\n\n```\nunsigned reverse (unsigned x) {\n    x\
    \ = ((x & 0x55555555) << 1) | ((x >> 1) & 0x55555555);\n    x = ((x & 0x33333333)\
    \ << 2) | ((x >> 2) & 0x33333333);\n    x = ((x & 0x0F0F0F0F) << 4) | ((x >> 4)\
    \ & 0x0F0F0F0F);\n    x = (x << 24) | ((x & 0xFF00) << 8) |\n            ((x >>\
    \ 8) & 0xFF00) | (x >> 24);\n    return x;\n}\n```\n\n另一种是实际执行的实时代码。本书不是用文字处理程序或\
    \ `LaTeX` 创建的；整本书是一个用 `Mathematica` 编写的计算机程序。例如，这段代码\n\n```\nmorris8 = Union[morris8];\n\
    Print[\"morris8 has \", Length[morris8], \" unique numbers.\"]\n```\n\n```\nmorris8\
    \ has 144 unique numbers\n```\n\n实际执行；它生成文本中后续的内容。`Mathematica` 的输入命令采用粗体 **Courier**\
    \ 字体（一种打字机风格字体），文本输出采用常规 **Courier** 字体，不加粗。有时输出是图形。\n\n单字母变量简洁，但有时较长的名称能更好地提示所代表的含义。短语中的单词或缩写词连接在一起，用大写字母指示新单词的开始，这种系统称为\
    \ `CamelCase`。也有首字母小写的 `camelCase`，这正是创造变量名如 `maxPos`（最大 `posit` 值）和 `eS`（指数大小）所用的规则。`Mathematica`\
    \ 的保留字使用 `CamelCase`，因此使用小写 `camelCase` 避免了与保留字冲突。\n\n虽然本书目的绝非教授 `Mathematica`，但了解一切皆通过符号数学计算，直到您要求用\
    \ `N[...]` 命令转为数字会有所帮助，如下所示：\n\n```\nPrint[π]\nPrint[N[π]]\nPrint[N[π, 16]]\n\
    ```\n\n```\nπ\n3.14159 2654\n3.14159 26535 89793\n```\n\n粗体 **Courier** 字体用于显示二进制数字，如\
    \ **0101101**。十进制数字保持与主文本相同的字体，如 1000。\n\n这种浅蓝色背景的框内文本很重要，请勿跳过：\n"
