    + s)` 项中，这是因为 posit 基于补码。求反操作是：翻转所有位并加 1。


    十一个人在这个文档上花费了大量时间，但我们没人注意到“integal”应为“integral”；我们的大脑倾向于自动补全那个缺失的“r”，所以研究过 Posit
    标准的人也没发现这个错别字。或者至少，没人向我们报告过。此外，如果 `n = 2`，`I` 和 `F` 字段会完全消失，只剩下符号位和进位保护位。所以我们本该注明这一点，因为当
