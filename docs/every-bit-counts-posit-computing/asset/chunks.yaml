- raw: "The rule for rounding can be summarized as “round a real *x* to the nearest\
    \ posit; if two posits are equally near, choose the one ending in a **0** bit.”\
    \ There are some important additional details, but it will serve for now. Let's\
    \ first study three consecutive values in the **posit8** set: {7.5, 8, 10}. The\
    \ tie point between 7.5 and 8 is 7.75. The tie point between 8 and 10 is 9.\n\n\
    If we happen to compute a value that is exactly 7.5, 8, or 10, then the accuracy\
    \ is infinite. Between those exactly-representable values, accuracy dips to a\
    \ minimum at the tie point.\n\n![The peaks actually go to infinity, since accuracy\
    \ is infinite at exact points 7.5, 8.0, and 10.0.](images/pg22_1.jpg)\n\nThe peaks\
    \ actually go to infinity, since accuracy is infinite at exact points 7.5, 8.0,\
    \ and 10.0.\n\nNotice the slight discontinuity at the two minima. That is caused\
    \ by the difference between the *geometric* mean of two values *x* and *y*, $\\\
    \\sqrt{x \\\\cdot y},$ and the *arithmetic* mean, (*x* + *y*)/ 2. The discontinuities\
    \ are at the halfway points, but those are *not* the places where the decimal\
    \ error (defined as a logarithmic distance) is minimized. The minimum error would\
    \ happen at the geometric means, $\\\\sqrt{7.5 \\\\times 8} = 7.7459669\\\\cdots$and\
    \ $\\\\sqrt{8 \\\\times 10} = 8.944\\\\cdots$instead of the arithmetic means,\
    \ 7.75 and 9, which at this very low 8-bit precision is a large enough discontinuity\
    \ to see in the graph, barely.\n\nHence, the accuracy of a number system depends\
    \ on the rounding policy. By our definition of relative error, the worst-case\
    \ decimal accuracy between adjacent values *x[k]* and *x[k]*[+1] occurs at their\
    \ arithmetic mean, (*x[k]* + *x[k]*[+1])/ 2, relative to the smaller magnitude\
    \ *x*.\n\nAt the arithmetic mean, the worst-case decimal accuracy is\n\nIn other\
    \ words, the worst-case decimal accuracy of a numerical vocabulary is very close\
    \ to the decimal accuracy of the adjacent points and adding log[10](2) ≈ 0.3.\n\
    \nHere is a decimal accuracy plot for a range of real values rounded to the **posit8**\
    \ vocabulary:\n\n![8-bit posits have a dynamic range of almost 4 orders of magnitude,\
    \ but at most 6 significant bits.](images/pg23_1.jpg)\n\n8-bit posits have a dynamic\
    \ range of almost 4 orders of magnitude, but at most 6 significant bits.\n\nThe\
    \ graph is thorough in showing the accuracy of the entire number system over its\
    \ dynamic range, but the vertical spikes to infinity at the exact points make\
    \ it difficult to read. Let's instead be pessimistic and look at the *worst case\
    \ decimal accuracy* for each point in the number set.\n\nThe following graph shows\
    \ just the bottom of each trough. If you ignore the jaggedness of the right half,\
    \ it makes a symmetrical tent shape. The relative accuracy is tapered away from\
    \ zero.\n\n![This is the usual form of an accuracy plot: Decimal relative accuracy\
    \ as a function of magnitude.](images/pg24_1.jpg)\n\nThis is the usual form of\
    \ an accuracy plot: Decimal relative accuracy as a function of magnitude.\n\n\
    For posits of higher precision, the jaggedness is less pronounced and the decimal\
    \ accuracy looks even more like a symmetrical triangular shape that peaks in the\
    \ center.\n\nA sequence of calculations that depend on previous rounded results\
    \ is generally only as accurate as the least-accurate calculation, like a chain\
    \ being only as strong as its weakest link. That is why it makes sense to use\
    \ the pessimistic minimum accuracies and assume a chain of calculations will stumble\
    \ into something near the bottom of each trough.\n\nThere is another way to plot\
    \ the decimal relative accuracy, and that is as a function of the *bit pattern*\
    \ treated as a binary integer instead of as the real value it represents by posit\
    \ format rules. This illustrates how half the bit patterns are in the highest-accuracy\
    \ region, defined in the next Section.\n\n![Accuracy can also be graphed as a\
    \ function of the bit pattern, shown here for positive 8-bit posits.](images/pg24_2.jpg)\n\
    \nAccuracy can also be graphed as a function of the *bit pattern*, shown here\
    \ for positive 8-bit posits.\n\n## 2.5 The *Fovea*\n\nThe highest-accuracy region\
    \ has for years been called the “sweet spot” by posit users, but Will Wray came\
    \ up with a clever, short word for it: The *fovea*, like the part of the retina\
    \ of an eye that has the highest resolution:\n\nHalf of all posits are in the\
    \ fovea, as is evident from the ring plot. One-fourth of all posits have a regime\
    \ length of three bits (**00****1** or **11****0**) and thus have one less bit\
    \ of significance than the fovea posits. One-eighth of all posits have a regime\
    \ length of four bits, and so on.\n\nTo get the most accurate results with posits,\
    \ it helps to try to stay in the fovea or not too far away from it. Wandering\
    \ into very large or very small magnitudes, even temporarily, causes loss of relative\
    \ accuracy that might propagate to the final answer and make it less accurate.\
    \ Fortunately, most modern numerical methods are already carefully designed to\
    \ avoid overflow and underflow and thus stay near the center of the dynamic range.\
    \ Those methods are already well-designed for posits.\n\n![The fovea for 8-bit\
    \ posits is where ½ ≤ |x| ≤ 2.](images/pg25_1.jpg)\n\nThe *fovea* for 8-bit posits\
    \ is where ½ ≤ |*x*| ≤ 2.\n\n## 2.6 Fixed-Point Accuracy\n\nScaling a number by\
    \ an integer power of two is like moving the radix point. What if you did not\
    \ have to do that, but could simply assume a fixed location for the radix point?\
    \ That would free up the bits that we use to indicate scaling, for more signific\
    \ and bits. Fixed-point formats are like dollars and cents, where there are two\
    \ digits to the right of the radix point. You can treat every dollar amount as\
    \ an integer multiple of the number of cents, $\\\\frac{1}{100}$ of a dollar.\n\
    \nSuppose we have an 8-bit format regarded as a signed integer, representing multiples\
    \ of $2^{- 4} = \\\\frac{1}{16}.$ That is, it has four bits to the right of the\
    \ radix point, and the 256 different values it could represent would be\n\n$$\\\
    \\begin{matrix} {\\\\mathbf{0000}\\\\mathbf{.0000}} & \\\\text{0} \\\\\\\\ {\\\
    \\mathbf{0000}\\\\mathbf{.}\\\\,\\\\mathbf{0001}} & {\\\\frac{1}{16} = \\\\text{0}\\\
    \\text{.0625}} \\\\\\\\ {\\\\mathbf{0000}\\\\mathbf{.0010}} & {\\\\frac{1}{8}\
    \ = \\\\text{0}\\\\text{.125}} \\\\\\\\ \\\\vdots & \\\\vdots \\\\\\\\ {\\\\mathbf{0111}\\\
    \\mathbf{.1111}} & {\\\\text{7~+}\\\\frac{15}{16} = \\\\text{7}\\\\text{.9375}}\
    \ \\\\\\\\ {\\\\mathbf{1000}\\\\mathbf{.0000}} & {- 8} \\\\\\\\ {\\\\mathbf{1000}\\\
    \\mathbf{.0001}} & {- \\\\left( {7 + \\\\frac{15}{16}} \\\\right) = - \\\\text{7}\\\
    \\text{.9375}} \\\\\\\\ \\\\vdots & \\\\vdots \\\\\\\\ {\\\\mathbf{1111}\\\\mathbf{.1111}}\
    \ & {= - \\\\frac{1}{16} = - 0.0625} \\\\\\\\ \\\\end{matrix}$$  \n\nCall the\
    \ positive values the **fixed8** set. The points are equispaced. What would the\
    \ decimal accuracy plot look like for the set of positive values, compared with\
    \ the one for **posit8**? Here they are on a single plot:\n\n![Accuracy plot of\
    \ 8-bit posits versus 8-bit fixed point](images/pg26_1.jpg)\n\nAccuracy plot of\
    \ 8-bit posits versus 8-bit fixed point\n\nThe plot shows that fixed-point format\
    \ does not support a wide dynamic range and represents small-magnitude values\
    \ with much less accuracy than large-magnitude values. That is usually not what\
    \ you want for technical computing. There are applications where fixed-point format\
    \ is exactly what you want (like financial programs), which is also where absolute\
    \ error might be more useful than relative error.\n\n## 2.7 ULPs and Relative\
    \ Accuracy “Wobble”\n\nThe term *ULP* is for Unit in the Last Place, and it has\
    \ some uses for measuring inaccuracy. It is usually pronounced to rhyme with “gulp,”\
    \ not as “you-ell-P.” Measuring ULPs assumes that as you count up in binary, the\
    \ real number that is represented also increases in value. This is not true for\
    \ all real number formats. It is one way to measure the distance between a computed\
    \ result and a (correctly rounded) exact result: How far apart are their bit strings?"
  fmt: "\n## 2.4 Rounding and Accuracy\n\nThe rule for rounding can be summarized\
    \ as \"round a real `x` to the nearest posit; if two posits are equally near,\
