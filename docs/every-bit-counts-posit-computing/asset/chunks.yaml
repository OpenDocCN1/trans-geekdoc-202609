  trans: '


    # 4.7.6 后记：告别 IEEE 浮点数


    几十年来，Kahan 一直愤怒地主张计算机语言标准应提供对处理器标志位的访问，却无人理睬。这事从未实现。直到最近几年，C 和 C++ 语言标准委员会才开始考虑支持可查看的处理器标志位，但这恐怕为时已晚。大批
    C 和 C++ 程序员根本不知道，他们的语言其实有版本可以让他们知晓处理器标志位。Java 编程语言明确*禁止*使用处理器标志位，这导致 Kahan 写了一篇诙谐但不太数学化的檄文，标题为《Sun
    的 Java 如何伤害全人类》。


    有人反对 posit 格式的逐渐精度，称逐渐精度破坏了适用于浮点数的经典精度定理。反对者似乎完全不知道 IEEE 浮点格式*本身就具有*逐渐精度。这是一种奇怪的逐渐方式，因为它只出现在一侧，且坡度很陡。


    20 世纪 90 年代末，阿贡国家实验室的研究人员找到了一种优雅的方法，让大数量级数字拥有对称的逐渐精度，而不是浪费位模式来表示各种 `NaN`，并向 IEEE
    754 委员会提交了一份非常有说服力的提案，供其下一次修订参考：“逐渐上溢”。委员会立即予以拒绝。这会破坏向后兼容性。2008 年和 2019 年 IEEE
    Std 754 修订中倾向于被接受的唯一修订，是纳入新精度，如半精度和四倍精度。那些完全是新增的，因此不会破坏先前规定的浮点类型的行为。


    说到上溢，让我们在*大*数量级数字上测试一下 Kahan 的 $\\left. \\sqrt{x^{2}} = ~ \\middle| x \\right|$
    断言。假设我们编写一个短程序，令 *x* = 10¹⁶⁰，所有变量均为 IEEE 64 位（双精度）精度，代码大致如下：


    ```

    double x, y, z;

    x = 1.0e160;

    y = x * x;

    z = sqrt(y);

    print z;

    end

    ```


    如果你在装有 Intel 或 AMD 处理器的机器上运行几次，你很可能会得到 `z` 为 1.0e160，即期望的 10¹⁶⁰，但你可能会发现它偶尔会产生
    `Inf`，表示答案上溢到了无穷大。


    *这究竟是怎么回事*？于是你可能会尝试最快的调试方式，插入打印语句看看究竟哪里出了问题。


    ```

    double x, y, z;

    x = 1.0e160;

    y = x * x;

    print y;

    z = sqrt(y);

    print z;

    end

    ```


    现在运行它，几十次，它*总是*给出答案 `Inf`。你把 "print y" 语句去掉，它又恢复为大多数时候产生 1.0e160，但不总是。于是你拿出低级调试器仔细单步执行代码。它*总是*产生
    `Inf`。


    这是最令人恐惧和恼火的编程 Bug 类型之一：调试这一行为，即观察正在发生的事情，*改变了程序的行为*。这个 Bug 有一个俚语术语，叫“海森堡 Bug”，以物理学家维尔纳·海森堡命名，他提出了量子力学原理：观察事件的行为可以改变该事件。用早期
    PC 时代的一张图来比喻，那时电子设备又大又笨重：


    ![一位 1980 年代程序员遭遇海森堡 Bug。](img/pg94_1.jpg)


    *一位 1980 年代程序员遭遇海森堡 Bug。*


    正如下溢一样，找到这个 Bug 的根源揭示了 Palmer 在设计 `i8087` 时做出的选择的另一个后果。10¹⁶⁰ 的平方运算正在 80 位寄存器中*隐蔽地*进行，尽管所有变量都声明为
    64 位精度。80 位寄存器可以处理这个平方（即 10³²⁰），然后开方运算返回 10¹⁶⁰ 并将其转换回 64 位精度。


    但如果你试图观察发生了什么，处理器会将临时结果转换回 64 位精度。IEEE 64 位精度只能存储高达约 1.8 × 10³⁰⁸ 的数字，所以 10³²⁰
    上溢为无穷大。打印语句和调试器都隐藏了隐蔽 80 位精度的使用，而这一特性本意是让 Intel 运算比实际使用程序指定的 64 位和 32 位的竞争对手“更好”。


    为什么原程序有时产生 10¹⁶⁰ 有时产生无穷大？操作系统偶尔需要通过保存处理器状态、执行一些管家功能、然后恢复状态，来换出一段正在运行的代码。该状态包括寄存器内容，但
    80 位临时寄存器中的任何内容都会即时转换为 64 位浮点数，导致其上溢。因此，IEEE 运算不仅在跨系统移植上不可靠，甚至可能在*同一台计算机上用相同数据产生不同答案*。


    当 Sun Microsystems 在 20 世纪 90 年代创建 Java 编程语言时，一项绝对的设计要求是它能在*任何*计算机上产生相同的答案。项目首席工程师
    James Gosling 认为，只要规定实数运算遵循 IEEE Std 754，就能轻松使其行为完全一致，大功告成。毕竟标签上写着“Standard”（标准）。他惊恐地发现，这根本不是那种标准；它真正标准化的只是位域的位置和含义，以便浮点数据能在计算机间交换。谈到执行运算时，它本该叫
    IEEE 754 *Guidelines*（指南）。这迫使 Java 设计者用整数运算自行构建浮点运算，绕过所有人处理器中针对 IEEE 浮点的专用硬件。Kahan
    对此暴跳如雷，但如果他最初赢了与 Palmer 的争论，规定结果应完全可复现，这本可以避免。


    ## 4.7.6 后记：告别 IEEE 浮点数


    鲜有计算机技术能流行超过几年，到 2005 年，IEEE 版科学记数法确实已显老态龙钟。主要芯片制造商决定异常情况很少见，因此可以用软件而非硬件来处理。这简化了硬件，使其仅处理*正常*浮点数，节省了芯片面积和执行时间。Sun
    Microsystems 犯了个错，将 `NaN` 异常陷入操作系统处理，这比其处理器的前几个版本处理 `NaN` 要慢数百万倍。高频股票交易员发现新处理器无法使用，因为当交易算法缺少某些关键数据从而不应发生交易时，`NaN`
    异常很常见。


    Intel、AMD 和 ARM 做得更好，将异常陷入其处理器中的微代码处理，这可能需要 200 个时钟周期，而正常浮点数通常只需 3-8 个时钟周期。然而，耗时更长是外部可观测的，因此第三方可以利用定时器在未获许可的情况下推断正在处理的数据。这被称为*侧信道攻击*，加州大学圣地亚哥分校的研究人员利用这种时序差异黑入网站并窃取数据。


    随着图形处理单元（GPU）的兴起，IEEE 浮点数遭受了致命一击，因为 GPU 不仅倾向于关闭所有异常处理，还将亚正规数冲刷为零。这意味着当你将 IEEE
    浮点数移植到 GPU 时，它代表的是一个*不同的数字*。标准的数据交换部分失效了。


    已无任何东西能让“Standard”一词依然适用。


    '
