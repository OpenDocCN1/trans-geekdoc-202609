    ## 2.7 定点数与科学计数法中的相对精度


    假设我们使用 `fixed8`，正确答案是 $\frac{1}{8}$ = `0000.0010`，但计算出错，得到 $\frac{3}{16}$ = `0000.0011`。这就是
    1 ULP 的误差。但作为相对误差，它是 $\left| {\log(\frac{3}{16}/\frac{1}{8})} \right| \approx
    0.41$，这是一个相当差的结果。该结果只有约 0.38 位十进制的相对精度。


    另一个极端是，假设正确答案是 $\frac{127}{16}$ = 7.9375 = `0111.1111`，但计算结果仅低了 1 ULP，所以我们得到 $\frac{126}{16}$
    = 7.875 = `0111.1110`。由此产生的相对误差小得多：$\left| {\log\left( {\frac{127}{16}/\frac{126}{16}}
    \right)} \right| \approx 0.008$，我们有约 2.1 位十进制的相对精度。因此，定点数格式的相对精度范围很大，对于小幅度的结果，精度会变小。


    在科学计数法中，假设指数正确，ULP 是尾数最后一位十进制数字的误差。例如，光速在米每秒下的 2.99 × 10⁸ 与 3.00 × 10⁸ 的对比。


    所以这里的“decade”（十进制数量级）与 10 年的时间跨度无关。它是一个跨越 10 dB 的数值范围。如果一种数字格式的最小正值为 `10^(-6)`，最大正值为
    `10⁶`，我们可能会说，“该格式覆盖十二个十进制数量级的动态范围”。另一个常用术语是*数量级*，所以如果某物偏差了 1000 倍，无论是太小还是太大，它就偏差了“三个数量级”（1000
    的以 10 为底的对数）。


    回到 ULP 的主题：如果我们的科学计数法系统有三位有效数字，十进制数量级底部附近的 1 ULP 误差是 1.01 对比 1.00，其相对误差约为 0.01，十进制精度约为
    2 位。但在十进制数量级顶部，9.98 对比 9.99 的相对精度接近 0.001，小十倍，十进制精度接近 3 位。十进制精度随尺度因子 `10^n` 的每个十的幂次从
    2 位增加到 3 位，产生如下锯齿形状的十进制精度：


    ![科学计数法中相对十进制精度的“摆动”从最差到最好相差一个十进制数量级。](img/pg28_1.jpg)


    科学计数法中相对十进制精度的“摆动”从最差到最好相差一个十进制数量级。


    但这是个误称。*精度* 根本没有摆动。精度是恒定的三位十进制数字。这种现象应称为*摆动相对精度* 或*摆动相对误差*。注意，摆动不是从 2 到 3 位，而是从约
    2.3 到 3.3 位，因为当用作数制时，最坏误差发生在两个可表示数字的中点，如 第 2.4 节 所述。


    减少摆动的一种方法是将尺度因子的基数设为 2，而不是 10 或 16。这将摆动减少到 `log10(2)` ≈ 0.3 位十进制数字。


    在某些数制中，包括 posit，尾数数字始终表示 1 到 2 之间的值，忽略 `2^n` 尺度因子和符号。


    早期的 IBM 大型机使用一种以 16 的幂代替 10 的幂的科学计数法形式，以更适合二进制计算机。但 16 为底的指数使摆动比 10 为底的指数更糟。略大于
    1 的实数表示精度会比略小于 1 的实数低 16 倍。基数 2 的摆动小得多，如下图所示：


    ![使用基数 16 会降低相对精度，并使摆动比使用基数 2 糟糕四倍。](img/pg29_1.jpg)


    使用基数 16 会降低相对精度，并使摆动比使用基数 2 糟糕四倍。


    Posit 的工作方式不像科学计数法，但它们仍然表示二进制数量级乘以尺度因子，所以在它们的相对精度图中你会看到类似的缺口。


    例如，`posit8` 中央区（fovea region）锯齿的形状与前面精度图中的锯齿形状完全一样：


    ![这是中央区的特写视图，叠加了部分常规精度图。](img/pg30_1.jpg)


    这是中央区的特写视图，叠加了部分常规精度图。


    ## 2.8 转换中的损失


    这是使用计算机进行实数计算时应牢记的图景：


    ![这是使用计算机处理实数时要记住的三个层次。](img/pg30_2.jpg)


    这是使用计算机处理实数时要记住的三个层次。


    图表显示了三个层次：人类层、计算机层和数学层。它还展示了一个简单的计算“1.1 + 1.2”如何因三个舍入步骤而变得面目全非。图中的示例将 `posit8`
    集用于计算层，但定点数、浮点数或任何其他二进制表示也会发生同样的情况。原因是十进制中的 1⁄10 = 0.1 在二进制中变成了无限循环模式 `0.0001100110011`⋯，就像
    ⅓ 用十进制表示时变成无限循环模式 0.333333⋯ 一样。


    输入舍入发生在十进制转换为二进制时。这里，最接近 1.1 的二进制是 `1.00011` = $\frac{35}{32}$ = 1.09375。最接近 1.2
    的二进制是 `1.0011` = $\frac{19}{16}$ = 1.1875。只有当十进制数恰好能精确表示为有限二进制串时（如 0.375 = `0.011`），才不会发生舍入。不仅分数会遭受输入舍入。例如，如果你尝试添加
    9 和 11，这两个整数都不在 `posit8` 的词汇表中，计算会对这些输入进行舍入。任何具有良好动态范围的数制都会有这个问题：大数值*采样*整数空间，跳过大片整数，而不是通过简单地计数在一个区间内包含所有整数。


    向数学层的*转换*是完美的。如果你有时间，上帝就有整数。数学层中的计算不需要是完美的。


    也就是说，数学层考虑到会有舍入返回计算层，因此它可以执行达到该结果所需的*有限*工作量。在示例中，有理数被正确相加得到 $\frac{73}{32}$ =
    2.28125。数学层是具有更多位的额外寄存器、隐藏算法和其他技术，处理用户无法访问的数据。


    *计算舍入* 是指当运算结果需要的位数超过了计算层可用位数时发生的情况。我们词汇表中最接近 $\frac{73}{32}$ 的数是 $\frac{9}{4}$
    = 2.25。


    正确性的最后一击来自*输出舍入*，即二进制数用十进制表示。虽然总能精确表示，但可能非常冗长，且这样做会给人一种误解，以为答案的有效数字远比实际多得多。例如，$\frac{1}{1024}$
    = 0.0009765625 精确相等，但如果 $\frac{1}{1024}$ 是涉及舍入误差的计算结果，那么 $\frac{1}{1024}$ ≈ 0.001
    的输出舍入能传达输出中的不准确性。经验法则是，输出中表达的有效数字不应超过（至少不应大幅超过）输入中表达的有效数字，“1.1 + 1.2”使用两位数字输入。因此，如果我们使用银行家舍入法（尾数为
    5 时舍入到最近的偶数），将结果 2.25 舍入为两位数字输出，在人类层将变为 2.2。


    '
