    *who is definitely not a number.*


    # Preface


    ![](images/pgxv_1.jpg)


    In 1920, a chemist might write a scientific paper with language like this:


    By around 1960, the wording would be more like this:


    In the present day, I would not be surprised to see it written like this:


    Technical writing seems to have acquired a style designed not so much to communicate
    to you as to impress you with how intelligent the author is. This is not that
    kind of book. Einstein once said, “You do not really understand something unless
    you can explain it to your grandmother.” So I wrote this book with that in mind
    and tested it. I had a grandmother (not mine) with no math training read it, and
    it passed. She totally gets it. (Thank you, Ms. Levitt!)


    Even though this is a book about computer arithmetic, it is aimed at a general
    audience. It presents the human side of things using the historical record along
    with my own personal experiences. You do not need calculus or anything more advanced
    than a K-12 math background to read this book. I have done everything in my power
    to make this very dry subject as clear and interesting as possible. And sometimes
    funny. Borderline outrageous.'
