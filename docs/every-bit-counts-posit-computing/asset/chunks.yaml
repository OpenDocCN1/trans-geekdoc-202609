    of ghost bits, represents an `r` value of -∞, did not occur to me until after
    the Posit Standard was ratified; otherwise this section could have been simplified.
    From the point of view of a designer, however, it is still best to call attention
    to the fact that special handling is needed when `r = -∞`.


    Spelling out the fraction bits with Σ summation notation makes unambiguous what
    they mean, for anyone not familiar with “decimals” that use a base other than
    ten.


    The formula `p = ((1 − 3 s) + f) × 2^((1−2) s ×(4) r+e+s)` looks quite different
    from the formula you usually see for a normal float, which looks like `(−1)^s
    ×(1 + f) × 2^(e−bias)`, so those familiar with floats often react with puzzlement.
    Because the implicit value is 1 for positive posits and −2 for negative posits,
    `(1 − 3 s)` is a simple formula that reproduces those two values as a function
    of the sign bit. The scaling `2^((1−2) s ×(4) r+e+s)` could have been written
    `2^((−1)) s ×(4 r+e+s)`, but the convention of writing `(−1)^s` is a little silly
    since it implies you actually have to call a power function to raise −1 to the
    power of `s`. All you need is a function that returns 1 if `s = 0` and -1 if `s
    = 1`; the function `(1 − 2 s)` is a simple way to accomplish that. The `s` value
    also shows up in the `(4 r + e + s)` term, and that is because posits are based
    on 2''s complement. To negate, flip all the bits and add 1.


    Eleven people spent an enormous amount of time on this document, and not one of
    us noticed that “integal” should be “integral”; our brains tend to fill in that
    missing “r” so those who have studied the Posit Standard also have not noticed
    this typo. Or at least, no one has reported it to us. Also, if `n = 2`, the `I`
    and `F` fields disappear completely and we have nothing but the sign and carry
    guard bits. So we should have noted that, since bit annotations `I[8] [n][−17]`
    and `F[8] [n][−17]` make no sense when `n = 2`.


    The sign `S` is the usual red color-coding, but the remainder of the fields are
    all shown in black, because they are simply positional notation like the fraction
    bit field. The “8 n − 16 bits” deserves an explanation. The smallest positive
    posit, `minPos`, is always `000⋯001` where the run length `k` is `n − 2` bits
    (the precision, less 1 for the sign bit and 1 for the regime termination bit).
    That bit string represents a regime value of `r = − (n − 2) = 2 − n`. Recall that
    the `uSeed` is `2^(2²) = 16` when `eS = 2`, so `minPos = 16^(2−n) = 2^(4·(2−n))
    = 2^(8−4n)`. In computing a dot product, we might have to accumulate products
    that are as small as `minPos² = (2^(8−4n)) ² = 2^(16−8n)`. Similarly, `maxPos²
    = 2^(8n−16)`. Hence, the integral part `I` and fractional part `F` are `8 n −
    16` bits long.


    The quire is always `16n` bits total, so if we subtract the sizes of the `I` and
    `F` fields, we are left with something that does not depend on `n`:


    After allowing for the sign bit, that leaves 31 bits for protection from carry
    overflow. The worst-case scenario is that you accumulate `maxPos²` over and over;
    you could do that up to `2^(31) − 1 = 2 147 483 647` (call it two billion) times
    with no possibility of overflow.


    This is a first in number formats: The “exact dot product” idea also can represent
    `NaR`, and it is the same way posits do it: a `1` bit followed by all `0` bits.
    IEEE floats are ill-suited to something like a quire because of all their exception
    conditions; how would you represent all of the possible IEEE exceptions in a `fixed-point`
    number?


    Saying the value represented by the quire `q` is an integer times `2^(16−8n)`
    is the same as saying the quire is a fixed-point format with the radix point `8
    n − 16` bits to the left of the last bit. Here are some examples of quire values
    for a tiny posit, `n = 3`. The quire is `3 × 16 = 48` bits long, and the entire
    posit vocabulary is just eight items: `{NaR, −16, −1, −1 / 16, 0, 1 / 16, 1, 16}`:


    | Value | | Quire bits (48-bit fixed point) |

    | --- | --- | --- |

    | 1 | | `00000000 00000000 00000000 00000000 00000001.00000000` |

    | -1 | | `11111111 11111111 11111111 11111111 11111111.00000000` |

    | maxPos=16 | | `00000000 00000000 00000000 00000000 00010000.00000000` |

    | maxPos²=256 | | `00000000 00000000 00000000 00000001 00000000.00000000` |

    | minPos=1/16 | | `00000000 00000000 00000000 00000000 00000000.00010000` |

    | minPos²=1/256 | | `00000000 00000000 00000000 00000000 00000000.00000001` |

    | NaR | | `10000000 00000000 00000000 00000000 00000000.00000000` |


    Examples of 48-bit quire representations of various values when the posits have
    only 3 bits


    The quire for 3-bit posits has its radix point just 8 bits left of the LSB.


    ## 5.5 Rounding Section of the Posit Standard

