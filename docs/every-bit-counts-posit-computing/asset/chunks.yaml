- raw: 'The first European to realize and publicize the power of positional notation
    with 0–9 numerals was an Italian named Leonardo Bigollo Pisano (“Leonardo, traveler
    from Pisa”), an accomplished mathematician who published *Liber Abaci* (Book of
    Calculation) in about the year 1200 AD, very close to the time the Cistercian
    monks created their numeral system. Never heard of him, you say?


    ![Leonardo Bigollo Pisano](images/pg72_1.jpg)


    Leonardo Bigollo Pisano


    He was the son (fi, in Italian) of a man named Bonacci, so he is today better
    known by his patronymic name:


    *Fibonacci*.


    Yes, *that* Fibonacci. Besides bringing us the 0–9 positional system, he introduced
    Europe to the “Fibonacci series” 1, 1, 2, 3, 5, 8, 13,… which was known to the
    Indians, where each number is the sum of the two previous numbers.


    The techniques we learn in elementary school for pencil-and-paper arithmetic spread
    quickly, and those using those techniques were called *algorists*, as opposed
    to the *abacists* who still used an abacus to calculate. It was as if a cult of
    warriors trained in Asian martial arts had arisen among a population that only
    knew how to fist-fight, and they knew how much advantage it gave them. Being able
    to use a writing instrument to add, subtract, multiply, and divide very large
    numbers much faster than can be done with an abacus felt like a superpower to
    those who took the time to learn the algorist art. The algorists understood the
    secret power of being able to notate zero in particular, for which the word was
    one that sounds like “cipher”; to this day that word conveys a clandestine way
    of doing things.


    Finally, Western civilization had a number system with mathematical underpinnings
    and one that was easy to write by hand, no pebbles or beads needed. A string of
    numerals *d[i]* that could be any symbol from 0 to 9 was a shorthand for a polynomial
    of the number ten:


    Isaac Newton and Leibniz share credit for the invention of calculus in the 1600s,
    but Leibniz also did something no one else did. He noticed that positional notation
    also worked for bases other than ten, and in particular he found great elegance
    in using just the symbols 0 and 1 to represent any number. Binary arithmetic.
    Leibniz invented it in 1689, though he gave ample credit to the Chinese for ancient
    notations that used a similar idea. An English translation of his introduction
    to the idea follows:


    Explication de l''Arithmétique Binaire, Die Mathematische Schriften, volume 7,
    page 223.


    In seeing the concept of binary, I think Leibniz was the first person who “got
    it” and realized it was a game-changer. It took a few hundred years for the rest
    of the world to catch up with him. But again, binary notation is *not* human-friendly,
    nor is it economical to set in type. To write a number like 72 in decimal is **1001000**
    in binary, seven characters instead of just two characters. The human eye is better
    at pattern-matching alphabet-like symbols than it is at traipsing over a long
    sequence of just two symbols and keeping track of which **0** or **1** digit in
    the list is being viewed. Binary is not as bulky as using tally marks, but still
    bulky compared to decimal.


    Cistercian numerals are super-compact, but were once impractical for typesetting.
    So the Hindu 0–9 positional system won out as the practical middle ground. Perhaps,
    hundreds of years from now, humans will have evolved to use hexadecimal as their
    primary digit system, eliminating the errors in human-computer number conversion.


    ## 4.5 Scientific Notation and Automatic Computing


    The word “anthropomorphize” describes a recurring theme in this chapter. Here
    is the usual dictionary definition:


    It could also mean “to design human characteristics into nonhuman things,” like
    when robots are made to look as much like humans as possible (androids) instead
    of being optimized for their intended purpose. We can talk about doing so as *anthropo-morphization*.
    A seven-syllable mouthful, but a useful word.


    Charles Babbage proposed the Analytical Engine in 1837, and it was to have an
    ingenious (and ambitious) system of mechanical gears that could perform programmable
    computations with *decimal* positional notation. He anthropomorphized the human
    0–9 numeral system into the machine. That made the machine so ambitious that Babbage''s
    plan to actually build it never got off the ground. It was to have had a memory
    of 1000 decimal numbers, with 50 digits each. Why so many digits? Because that
    gives you *dynamic range* of from 1 to 10^(50), using simple integer odometer-like
    hardware. The design predated scientific notation or the concept of a floating
    decimal point, and it greatly complicated the gear-based design.


    It was commonplace to avoid the use of large numbers of zeros in a number using
    phrases like “One followed by twenty zeros,” but what we now call *scientific
    notation* was first specified carefully by Leonardo Torres Quevedo in 1914. He
    wrote a remarkable paper in French, the title of which translates as “Essays on
    Automatics,” about the use of machines to imitate not just the physical actions
    of humans but their reasoning powers as well (that is, he was anthropomorphizing).


    Here is a translated excerpt that laid out a potent idea:


    Reprinted in *The Origins of Digital Computers*, Brian Randell ed., page 102.


    There it is. The invention of floating-point format, and also the invention of
    scientific notation of the form *n* × 10*^m* where the significant digits are
    *n*, and *m* is the exponent. He perceptively said the number of significant digits
    should be six, or eight at most, matching what we now call “single precision”
    floats. What he writes as “341862;–5” is what a modern program would print as
    “0.341862e-5”, very close to current notation. He did not propose a method of
    representing *negative* values, notice; his “n” is a fraction ranging from 0.100000
    to 0.999999, not a signed value. Some people will stop at nothing to avoid dealing
    with negative numbers.


    The “quantities involved in the calculations” correspond to the temporary use
    of higher precision to minimize rounding error, but not as high as double precision.
    He could not have anticipated that programmers would want to over-insure against
    rounding error by using double-precision floats with 15-decimal accuracy for *every*
    real variable.


    Notice that there is no provision for storing the number zero, nor does he consider
    any exceptions that arise, such as dividing by zero.


    Quevedo also accurately estimated the dynamic range needed for conventional calculations
    as well within 10^(−99) to 10^(99). He knew that 10^(−9) to 10⁹ would not be sufficient,
    so he elected a two-digit (decimal) exponent representation, and then it became
    overkill, but sufficient to do the job. There is nothing to indicate that he considered
    number bases other than the number of fingers that humans have.


    In the late 1930s, Konrad Zuse conceived the Z-1 computer as a *mechanical* binary
    computer that stored its **0** or **1** states using sheet-metal and pin linkages.
    He built it on the family dining room table. Remarkably, it implemented the Quevedo
    idea of a separate significand (15 bits) and exponent (7 bits). Zuse could not
    get the representation of zero working, though he knew it was needed; he fixed
    that in a later version, the Z-3, that used electromechanical relays instead of
    linkages. Both the Z-1 and Z-3 computers worked, so they were history''s first
    binary computers capable of floating-point calculations. The only thing they lacked
    was electronic switching speed.'
