    ## 2.1 Absolute versus Relative Error


    Like so many things in numerical analysis, we have become accustomed to some concepts
    that are widely accepted but are actually rather sloppy in their logic. The way
    we measure *error* of various types is one of those concepts. For instance, here
    is a widely-used way of measuring the error of a result computed with real numbers:


    There is nothing wrong with this; if the values are identical, their difference
    is 0 so there is no error. Absolute error is what to use when someone lies about
    their age, say, or how fast they were driving, or how many glasses of wine they
    have had. But if a calculation produces 315 instead of 314, doesn''t the error
    look very similar to returning 3.15 instead of 3.14? A number system designed
    for *real* numbers usually spans a large dynamic range. Simply subtracting numbers
    may be the best measure when the values being compared are within an order of
    magnitude of one another.


    For situations with many orders of magnitude, the *relative error* of a computed
    value is traditionally defined this way:


    There are some reasons you should be dissatisfied with this definition. If you
    compute −1 when the correct answer is 100, then the above relative error formula
    would only be 1.01. If you do not even know the sign of a number, then you know
    essentially nothing about the answer since the sign is the most significant part
    of a number. An error formula should return “indeterminate” in such cases. Even
    declaring the relative error to be infinite is too flattering.


    If you did an experimental measurement that produced two different values *x*[1]
    and *x*[2], you might want to talk about the relative error in the measurement.
    But you do not know the *x*[exact] value. Depending on whether you put *x*[1]
    or *x*[2] in the denominator, you get a different relative error. That does not
    seem right.'
