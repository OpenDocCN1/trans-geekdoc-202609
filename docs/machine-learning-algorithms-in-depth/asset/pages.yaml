    $q(x''|x) = \mathcal{N}(x''|x, \Sigma)$


    (2.21)


    This is known as a random walk Metropolis algorithm. If we use a proposal of the
    form $q(x''|x) = q(x'')$, where the new state is independent of the old state,
    we get an independence sampler, which is similar to the importance sampling we
    will look at in the next section.


    Also, notice that to compute the MH ratio, we don’t need to know the normalization
    constants $Z$ of our distributions, since the ratio and the $Z$s cancel out. There’s
    a connection between the MH algorithm and Gibbs sampling: the Gibbs algorithm
    acceptance ratio is always 1.


    # 2.7 Importance sampling


    Importance sampling (IS) is a Monte Carlo algorithm for estimating integrals of
    the following form.


    $E[f(x)] = \int p(x) f(x) dx$


    (2.22)'
