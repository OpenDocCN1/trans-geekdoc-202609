    # 10.4 Neural network optimizers


    What are some of the most popular optimization algorithms used for training neural
    networks? We will attempt to answer this question using a convolutional neural
    network (CNN) trained on the CIFAR-100 dataset with Keras/TensorFlow.


    Stochastic gradient descent (SGD) updates parameters θ in the negative direction
    of the gradient g by taking a subset or mini-batch of data of size m.


    g = \frac{1}{m}\nabla_{\theta}\sum_i L\bigl(f(x^{(i)};\theta), y^{(i)}\bigr)


    θ = θ - ε_k × g  (10.13)


    Here, f(x_i; θ) is a neural network trained on examples x_i and labels y_i and
    L is the loss function. The gradient of loss L is computed with respect to model
    parameters θ. The learning rate ε_k determines the size of the step that the algorithm
    takes along the'
