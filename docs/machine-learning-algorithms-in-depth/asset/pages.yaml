    Regarding structure learning, we discovered the exponential number of possible
    graph topologies and touched on the topic of causality. We looked at how we could
    construct simpler tree graphs using mutual information between nodes as edge weights
    in the maximum weight spanning tree. We also saw how regularizing the inverse
    covariance matrix for general graphs led to more interpretable topologies with
    fewer edges in the inferred graph.


    Finally, we looked at two unsupervised algorithms inspired by statistical physics
    (simulated annealing) and evolutionary biology (the genetic algorithm). We saw
    how by using the temperature parameter and a cooling schedule, we can modify the
    energy landscape and how selecting unfavorable in the short-term moves can lead
    to better long-term optima. There are many NP-hard problems that can be approximated
    with simulated annealing, including the traveling salesman problem (TSP). We can
    often use several restarts and different initialization points to arrive at better
    optima. Genetic algorithms, on the other hand, although satisfying in their parallelism
    with nature, can take a long time to converge. However, they can lead to several
    interesting applications, such as neural network architecture search.


