- pgno: 300
  md: 'Shifting the spotlight to diffusion models, which gained popularity for their
    ability to generate high resolution images, are parametrized Markov chains trained
    using variational inference to produce samples matching the input data. Diffusion
    models consist of a forward pass, in which an image gets progressively noisier
    via additive Gaussian noise, and a reverse pass, in which the noise is transformed
    back into a sample from the target distribution (Jonathan Ho, Ajay Jain, and Pieter
    Abbeel’s “Denoising Diffusion Probabilistic Models,” Conference and Workshop on
    Neural Information Processing Systems, 2020).


    In the area of natural language processing (NLP), the architecture for machine
    translation, for example, has evolved from Seq2Seq LSTM models to transformer-based
    models, such as BERT (Jacob Devlin et al.’s “BERT: Pre-training of Deep Bidirectional
    Transformers for Language Understanding,” North American Chapter of the Association
    for Computational Linguistics, 2019). The pretrained BERT model can be fine-tuned
    with just one additional output layer to create state-of-the-art models for a
    wide range of tasks, such as question answering and language inference, without
    substantial task-specific architectural modifications. Zero-shot and few-shot
    learning gained popularity with large Transformer models, such as GPT-3, introduced
    by Tom B. Brown et al. in “Language Models are Few-Shot Learners” (Conference
    and Workshop on Neural Information Processing Systems, 2020). The applications
    of GPT-3 range from text completion to code completion. For example, OpenAI’s
    codex model, which is a descendant of the GPT-3 series that’s trained on natural
    language as well as billions of lines of code, serves as an AI pair programmer
    that can turn comments into code and complete the next line or function in context.


    A number of learning tasks require processing graph data that contains rich relational
    information, from modeling social networks to predicting protein structure calls
    for a model that can work with graph data. Graph neural networks (GNNs) are neural
    models that capture dependence relationships via message passing between the nodes
    of the graph (Thomas N. Kipf and Max Welling’s “Semi-Supervised Classification
    with Graph Convolutional Networks,” International Conference on Learning Representations,
    2017). In recent years, variants of GNNs, such as graph convolutional networks
    (GCNs), graph attention networks (GATs), and graph recurrent networks (GRNs),
    have demonstrated groundbreaking performance on many deep learning tasks.


    Finally, amortized variational inference (D. P. Kingma’s “Variational Inference
    and Deep Learning: A New Synthesis,” University of Amsterdam, 2017) is an interesting
    research area, as it combines the expressive power and representation learning
    of deep neural networks with domain knowledge of probabilistic graphical models.
    We saw one such application of MDNs when we used a neural network to map from
    the observation space to the parameters of the approximate posterior distribution.


    Deep learning research is a very active field. For state-of-the-art developments
    and applications, the reader is encouraged to review the Conference and Workshop
    on Neural Information Processing Systems, the International Conference on Learning
    Representations, and the research conferences mentioned in appendix A.'
