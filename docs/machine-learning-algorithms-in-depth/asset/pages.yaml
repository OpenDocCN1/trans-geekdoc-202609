  md: '# 11.6 Exercises


    +   11.1 What is a receptive field in a CNN?

    +   11.2 Explain the benefit of residual connections by deriving the backward
    pass.

    +   11.3 Compare the pros and cons of using CNNs, RNNs, and transformer neural
