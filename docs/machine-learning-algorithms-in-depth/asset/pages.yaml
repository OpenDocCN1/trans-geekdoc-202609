  md: 'we have several possible gradients at that point, which are collectively known
    as subdifferential. Since hinge loss is a piecewise linear function, the gradient
    for z_i > 1 is equal to 0, while the gradient for z_i ≤ 1 is equal to equation
    5.5.


    ∇_θ(1 - y_i(θ·x_i + θ0)) = -y_i x_i

    ∇_{θ0}(1 - y_i(θ·x_i + θ0)) = -y_i  (5.5)


    Combining the expressions in equation 5.5 with a stochastic gradient descent update
    (where eta is the learning rate), we have equation 5.6.


    θ^{(k+1)} = θ^{(k)} - η_k ∇_θ Loss_h(y_i(θ·x_i + θ0))  (5.6)


