    # 3.4 MI maximization


    In this section, we look at mutual information (MI) maximization, which commonly
    occurs in information planning and data communications settings. Consider a wireless
    communications scenario, in which we transmit a signal $x \sim p_X(x)$, it passes
    through a multiple-input, multiple-output (MIMO) channel $H$. At the output, we
    receive our signal, $y = Hx + n$, where $n \sim N(0, \sigma_I^2 I)$ is an additive
    Gaussian noise. We would like to maximize the amount of information transmitted
    over the wireless channel. In other words, we would like to maximize the capacity
    or mutual information between the transmitted signal $X$ and the received signal
    $Y$: $C = \max I(X;Y)$, where the maximization is taken over $p(x)$. To compute
    channel capacity, we discuss a general procedure based on KL divergence to approximately
    maximize mutual information.


    $$I(X;Y) = H(X) - H(X|Y) = -E_{p(x)}[\log p(x)] - E_{p(x,y)}[\log p(x|y)] \tag{3.25}$$


    Let $q(x)$ be an approximating distribution to $p(x)$, and then consider KL divergence
    between the posterior distributions of $p$ and $q$, as shown in equation 3.26.


    $$D_{KL}(p(x|y)\|q(x|y)) \ge 0 \tag{3.26}$$


    We would like to derive a lower bound on mutual information (MI). Expanding the
    expression in equation 3.26, we can proceed as shown in equation 3.27.


    $$\sum_x p(x|y)\log p(x|y) - \sum_x p(x|y)\log q(x|y) \ge 0 \tag{3.27}$$


    Multiplying both sides by $p(y)$, we get the following.


    $$\sum_{x,y} p(y)p(x|y)\log p(x|y) \ge \sum_{x,y} p(x,y)\log q(x|y) \tag{3.28}$$


    Recognizing the left-hand side as $-H(X|Y)$, we obtain the following MI lower
    bound.


    $$I(X;Y) = H(X) - H(X|Y) \ge H(X) - E_{p(x,y)}[\log q(x|y)] = \tilde{I}(X;Y) \tag{3.29}$$


    Using the preceding lower bound, we can describe MI maximization algorithm (see
    figure 3.7).'
