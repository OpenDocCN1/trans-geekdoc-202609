  md: '# 10.3 Describe some of the ways to increase neural model capacity and avoid
    overfitting.


    To increase neural model capacity, we can increase the size and the number of
    layers. This can potentially lead to overfitting. To combat overfitting, we can
    use weight decay, dropout, and early stopping.


    # 10.4 Why does the number of filters increase in LeNet architecture as we go
    from input to output?


    The number of filters increases to capture more complex patterns in the image
    data. The earlier layers are used to extract geometric features, like edges, corners,
    and so on, while subsequent layers combine these patterns into more complex shapes.


    # 10.5 Explain how an Adam optimizer works.


    Adam can be seen as a variant on the combination of RMSProp and momentum optimizers.
    The update looks like RMSProp, except a smooth version of the gradient is used
    instead of the raw stochastic gradient. The full Adam update also includes a bias
    correction mechanism:


    $$\begin{aligned}

    g &= \frac{1}{m}\sum_i \nabla_\theta L\left((x^{(i)};\theta),y^{(i)}\right) \\

    m &= \beta_1m+(1-\beta_1)g \\

    s &= \beta_2v+(1-\beta_2)g^Tg \\

    \theta &= \theta-\epsilon_k\times\frac{m}{\sqrt{s+\epsilon p s}}

    \end{aligned}$$


    # 11.1 What is a receptive field in a CNN?


    A receptive field is the number of input pixels that produce a feature map. It
    is a measure of association of an output feature (of any layer) to the input region.


    # 11.2 Explain the benefit of residual connections by deriving the backward pass.


    The benefit of residual connections is that they allow gradients to flow through
    the network directly, without passing through nonlinear activation functions that
    cause the gradients to explode or vanish (depending on the weights).


