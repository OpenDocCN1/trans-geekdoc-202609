    \n$$\\frac{\\partial}{\\partial w}J(w)=2\\hat{\\Sigma}w-2\\lambda w=0$$\n$$\\\
    hat{\\Sigma}w=\\lambda w$$\n\nThus, the direction that maximizes the variance\
    \ is the eigenvector of the covariance matrix. Left multiplying by $w$ and using\
    \ orthonormality constraint, we get $w^T\\hat{\\Sigma}w=\\lambda$. Therefore,\
    \ to maximize the variance for the first principal component, we want to choose\
    \ an eigenvector that corresponds to the largest eigenvalue. We can repeat the\
    \ above procedure by subtracting the first principal component from $x_i$, and\
    \ we’ll discover that $\\hat{\\Sigma}w^2=\\lambda w^2$. By induction, we can show\
    \ that the PCA matrix $WDL$ consists of $L$ eigenvectors corresponding to the\
    \ $L$ largest eigenvalues of the empirical covariance matrix $\\hat{\\Sigma}$.\
