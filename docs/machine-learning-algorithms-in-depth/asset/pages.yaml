  md: '# Summary


    +   - A data structure is a way of storing and organizing data. Data structures
    can be categorized into linear, nonlinear, and probabilistic.

    +   - We looked at four algorithmic paradigms in this chapter: complete search,
    greedy, divide and conquer, and dynamic programming.

    +   - Complete search (aka brute force) is a method for solving a problem by traversing
    the entire search space to find a solution. During the search, we can prune parts
    of the search space that we are sure do not lead to the required solution.

    +   - A greedy algorithm takes a locally optimum choice at each step, with the
    hope of eventually reaching a globally optimum solution.

    +   - Divide and conquer is a technique that divides a problem into smaller, independent
    subproblems and then combines solutions for each of the subproblems.

    +   - Dynamic programming (DP) is a technique that divides a problem into smaller
    overlapping subproblems, computes a solution for each subproblem, and stores it
    in a DP table. The final solution is read off the DP table.

    +   - Mastery of algorithms and software implementation can be achieved through
    the practice of competitive programming (see appendix A for resources).

    +   - Machine learning mastery requires a solid understanding of fundamentals.
    See the recommended texts section in appendix A for ideas on how to increase the
