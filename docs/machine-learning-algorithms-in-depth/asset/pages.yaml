- pgno: 63
  md: "# # Variational inference\n\n+   **This chapter covers**\n+   \n+   - Introducing\
    \ KL variational inference\n+   - Mean-field approximation\n+   - Image denoising\
    \ in the Ising model\n+   - Mutual information maximization\n\nIn the previous\
    \ chapter, we covered one of the two main camps of Bayesian inference: Markov\
    \ chain Monte Carlo. We examined different sampling algorithms and approximated\
    \ the posterior distribution using samples. In this chapter, we will discuss the\
    \ second camp of Bayesian inference: variational inference. *Variational inference*\
    \ (VI) is an important class of approximate inference algorithms; its basic idea\
    \ is to choose an approximate distribution $q(x)$ from a family of tractable or\
    \ easy-to-compute distributions with trainable parameters and then make this approximation\
    \ as close as possible to the true posterior distribution $p(x)$.\n\nAs we will\
    \ see in the mean-field section, the approximate $q(x)$ can take on a fully factored\
    \ representation of the joint posterior distribution. This factorization significantly\
    \ speeds up computation. We will introduce KL divergence and use it as a way to\
    \ measure the closeness of our approximate distribution to the true posterior.\
    \ By optimizing KL divergence, we will effectively convert VI into an optimization\
    \ problem. In the following section, we will derive the evidence lower bound (ELBO)"
  merge: -1
  img_proc: true
- pgno: 64
  md: "and interpret it in three different ways, which will become handy during our\
    \ implementation of mean-field approximation for image denoising. The image denoising\
    \ algorithm was selected because it illustrates the concepts discussed in this\
    \ section via a visual example.\n\n# 3.1 KL variational inference\n\nWe can use\
    \ KL divergence to measure a distance between probability distributions. This\
    \ is particularly useful when making an approximation to the target distribution,\
    \ since we want to find out how close our approximation is. Let $q(x)$ be our\
    \ approximating distribution and $p(x)$ be the target posterior distribution.\
    \ Then, the reverse KL is defined as follows.\n\n$$KL(q\\|p)=\\sum_x q(x)\\log\\\
    frac{q(x)}{p(x)}$$\n\n*Approximating distribution*\n\n*Log ratio of approximate\
    \ to actual*  \n(3.1)\n\nConsider a simple example, in which our target distribution\
    \ is a standard univariate normal distribution $p(x)\\sim N(0,1)$ and our approximating\
    \ distribution is a univariate normal with a mean $\\mu$ and variance $\\sigma^2$:\
    \ $q(x)\\sim N(\\mu,\\sigma^2)$. We can then compute $KL(q\\|p)$ as follows.\n\
    \n$$\\begin{aligned}\nKL(q\\|p) &= \\int q(x)\\log\\frac{q(x)}{p(x)}\\\\\n&= -\\\
    int q(x)\\log p(x)+\\int q(x)\\log q(x)\\\\\n&= -\\int q(x)\\left[-\\frac{1}{2}\\\
    log 2\\pi-\\frac{1}{2}x^2\\right]\\\\\n&\\quad +\\int q(x)\\left[-\\frac{1}{2}\\\
    log 2\\pi\\sigma^2-\\frac{1}{2\\sigma^2}(x-\\mu)^2\\right]\\\\\n&= \\left[\\frac{1}{2}\\\
    log 2\\pi+\\frac{1}{2}(\\sigma^2+\\mu^2)\\right]+\\left[-\\frac{1}{2}\\log 2\\\
    pi\\sigma^2-\\frac{1}{2}\\right]\\\\\n&= -\\frac{1}{2}\\left(1+\\log\\sigma^2-\\\
    mu^2-\\sigma^2\\right)\n\\end{aligned}$$\n\n(3.2)\n\nWe can visualize how $KL(q\\\
    |p)$ changes as we vary the parameters of our approximate distribution $q(x)$.\
    \ Let’s fix $\\sigma^2=4$ and vary the mean $\\mu\\in[-4,4]$. We obtain figure\
    \ 3.1.\n\nNotice that the KL divergence is nonnegative and is smallest when $\\\
    mu=0$ (i.e., the mean of the approximating distribution is equal to the mean of\
    \ our target distribution $p(x)\\sim N(0,1)$). We can interpret KL divergence\
    \ as a measure of distance between distributions."
