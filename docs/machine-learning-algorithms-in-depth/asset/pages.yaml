- pgno: 207
  md: '# 9.1 Latent Dirichlet allocation


    A topic model is a latent variable model for discrete data, such as text documents.
    Latent dirichlet allocation (LDA) is a topic model that represents each document
    as a finite mixture of topics, where a topic is a distribution over words. The
    objective is to learn the shared topic distribution and topic proportions for
    each document. LDA assumes a bag of words model in which the words are exchangeable
    and, as a result, sentence structure is not preserved (i.e., only the word counts
    matter). Thus, each document is reduced to a vector of counts over the vocabulary
    V and the entire corpus of D documents is summarized in a term-document matrix
    A_{VD}. LDA can be seen as a nonnegative matrix factorization problem that takes
    the term-document matrix and factorizes it into a product of topics W_{VK} and
    topic proportions H_{KD}: A = W H. Term frequency–inverse document frequency (tf-idf)
    is a common method for adjusting the word counts, as it logarithmically drives
    down to zero word counts that occur frequently across documents: A log(D/n_t),
    where D is the total number of documents in the corpus and n_t is the number of
    documents where term t appears. The tf-idf smoothing of word counts identifies
    the sets of words that are discriminative for documents and leads to better model
    performance. The term-document matrix generalizes from counts of individual words
    (unigrams) to larger structural units, such as n-grams. In the case of n-grams,
    different techniques for smoothing word counts (e.g., Laplace smoothing) are used
    to address the lack of observations in a very large feature space. Figure 9.1
    shows the graphical model for the LDA.


    ![](img/325742126d3ff007c6c385f4ffb5c3be_207_0.png)


    Figure 9.1 Latent Dirichlet allocation graphical model


    The LDA topic model associates each word x_{i,d} with a topic label z_{i,d} ∈
    {1, 2, ..., K}. Each document is associated with topic proportions θ_d that could
    be used to measure document similarity. The topics β_k are shared across all documents.
    The hyperparameters α and η capture our prior knowledge of topic proportions and
    topics, respectively (e.g., from past online training of the model). The full
    generative model can be specified as follows.'
