  md: 'that models observed data emitted from each state. Inference is carried out
    using either the EM algorithm or the forward–backward algorithm with a Viterbi
    maximum likelihood sequence decoder.


    +   - There are two main strategies for imbalanced learning: undersampling the
    majority class and oversampling the minority class. An additional method includes
    introducing class weights in the loss function.

    +   - In active learning, the ML algorithm chooses the data samples to train on
    in a way that maximizes learning and requires fewer training examples. There are
    two main query strategies: uncertainty sampling and query by committee.

    +   - Bias–variance tradeoff necessitates that mean squared error is equal to
    bias squared plus variance. The minimum variance is given by the inverse of Fisher
    information, which measures the curvature of log likelihood.

    +   - In model selection, we often want to follow the Occam’s razor principle
    and choose the simplest model that explains the data well. In hyperparameter optimization,
    in addition to grid search and random search, Bayesian Optimization uses an active
    learning approach in a way that reduces uncertainty and provides a balance between
    exploration and exploitation.

    +   - Ensemble methods are meta-algorithms that combine several machine learning
    techniques into one predictive model to decrease variance (bagging), decrease
    bias (boosting), or improve predictions (stacking).'
