    # 7.5 Ensemble methods


    Ensemble methods are meta-algorithms that combine several ML techniques into one
    predictive model to decrease variance (bagging), decrease bias (boosting), or
    improve predictions (stacking). Ensemble methods can be divided into two groups:
    *sequential ensemble methods*, where the base learners are generated sequentially
    (e.g., AdaBoost), and *parallel ensemble methods*, where the base learners are
    generated in parallel (e.g., random forest). The basic motivation of sequential
    methods is to exploit the dependence between the base learners, since the overall
    performance can be boosted by weighing previously mislabeled examples with higher
    weight. The basic motivation of parallel methods is to exploit independence between
    the base learners, since the error can be reduced dramatically by averaging.


    Most ensemble methods use a single base learning algorithm to produce homogeneous
    base learners (i.e., learners of the same type), leading to *homogeneous ensembles*.
    There are also some methods that use heterogeneous learners (i.e., learners of
    different'
