    # 10.2  Convolutional neural nets


    Convolutional neural networks (CNNs) use convolution and pooling operations in
    place of vectorized matrix multiplications. In this section, we’ll motivate the
    use of these operations and describe two architectures: LeNet, for MNIST digit
    classification, and ResNet50, applied to image search.


    CNNs work exceptionally well for image data. Images are high dimensional objects
    of size $W \times H \times C$, where $W$ is the width, $H$ is the height, and
    $C$ is the number of channels (e.g., $C=3$ for RGB image and $C=1$ for grayscale).
    CNNs consist of trainable filters or kernels that get convolved with the input
    to produce a feature map. This results in a vast reduction in the number of parameters
    and ensures invariance to translations of the input (since we would like to classify
    an object at any location of the image). The convolution operation is 2D in the
    case of images, 1D in the case of time series, and 3D in the case of volumetric
    data. A 2D convolution is defined as follows.


    $$(f * g)(i,j) = \sum_a \sum_b f(a,b)g(i-a,i-b) \tag{10.8}$$


    In other words, we slide the kernel across every possible position of the input
    matrix. At each position, we perform a dot-product operation and compute a scalar
    value. Finally, we gather these scalar values in a feature map output.


    Convolutional layers can be stacked. Since convolutions are linear operators,
    we include nonlinear activation functions in between, just as we did in fully
    connected layers.


    Many popular CNN architectures include a pooling layer. Pooling layers down-sample
    the feature maps by aggregating information. For example, max pooling computes
    a maximum over incoming input values, while average pooling replaces the max operation
    with the average. Similarly, global average pooling could be used to reduce a
    $W \times H \times D$ feature map into a $1 \times 1 \times D$ aggregate, which
    can then be reshaped to a $D$-dimensional vector for further processing. Let’s
    look at a few applications of CNNs.'
