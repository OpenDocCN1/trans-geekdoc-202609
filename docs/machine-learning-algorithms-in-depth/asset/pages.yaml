- pgno: 145
  md: 'We are often interested in the long-term behavior of the Markov chain—namely,
    a distribution over states based on the frequency of visits to each state as time
    passes. Such distribution is known as *stationary distribution*. Let’s compute
    it! Let \(\pi_0\) be the initial distribution over the states. Then, after the
    first transition, we have the following.


    $$\pi_1(j)=\sum_i \pi_0(i)A_{ij} \tag{7.4}$$


    Or in matrix notation, we have the following.


    $$\pi_1=\pi_0A \tag{7.5}$$


    We can keep going and write down the second transition as follows.


    $$\pi_2=\pi_1A=\pi_0A^2 \tag{7.6}$$


    We see that raising the transition matrix \(A\) to a power of \(n\) is equivalent
    to modeling \(n\) hops (or transitions) of the Markov chain. After some time,
    we reach a state when left multiplying the row state vector \(\pi\) by the matrix
    \(A\) gives us the same vector \(\pi\).


    $$\pi=\pi A \tag{7.7}$$


    In the preceding case, we found the stationary distribution; it is equal to \(\pi\),
    which is an eigenvector of \(A\) that corresponds to the eigenvalue of 1. We will
    also state here (with proof left as an exercise) that a stationary distribution
    exists if and only if the chain is *recurrent* (i.e., it can return to any state
    with probability 1) and *aperiodic* (i.e., it doesn’t oscillate).


    # 7.1.1  Page rank algorithm


    Google uses a page rank algorithm to order search results from millions of web
    pages. We can formulate a collection of \(n\) web pages as a graph \(G=(V,E)\).
    Let every node \(v\in V\) represent a web page, and let every edge \(e\in E\)
    represent a directed link from one page to another. Then, \(G\) is a sparse graph
    with \(|V|=n\). Intuitively, a web page that receives a lot of incoming links
    from reputable sources should be promoted toward the top of the ranked list. Knowing
    how the pages are linked allows us to construct a giant transition matrix \(A\),
    where \(A_{ij}\) is the probability of following a link from page \(i\) to page
    \(j\). Given this formulation, we can interpret the entry \(\pi_j\) as the importance
    or rank of page \(j\). Considering the Markov chain discussion in the previous
    section, the page rank is the stationary distribution \(\pi\) (i.e., the eigenvector
    of \(A\) corresponding to the eigenvalue of 1).


    $$\pi_j=\sum_i A_{ij}\pi_i \tag{7.8}$$'
