  md: 'Priors that have the same form as the posterior are known as *conjugate priors*,
    which are generally preferred, since they simplify computation by having closed-form
    updates. The denominator Z = p(x) = ∫ p(x|θ) p(θ) dθ is known as the *normalizing
    constant* or the *partition function* and is often intractable to compute, due
    to integration in high dimensional parameter space. In this book, we’ll examine
    several techniques for estimating Z.


    We can model relationships between different random variables in our model as
    a graph as shown in figure 1.5, giving rise to *probabilistic graphical models*.
    Each node in the graph represents a random variable (RV), and each edge represents
    a conditional dependency. The model parameters are represented by clear nodes,
    while shaded nodes represent the observed data, and rectangular plates denote
    a copy or a repetition of the random variable. The topology of the graph itself
    changes depending on the application you are interested in modeling. However,
    the goals of Bayesian inference remain the same: to find the posterior distribution
    over model parameters, given observed data.


    ![](img/325742126d3ff007c6c385f4ffb5c3be_29_0.png)


    Figure 1.5

    A probabilistic graphical model (PGM) for a Gaussian mixture model


    In contrast to PGMs, where the connections are specified by domain experts, *deep
    learning models* learn representations of the world automatically through the
    backpropagation algorithm that minimizes an objective function. *Deep neural networks*
    (DNNs) consist of multiple layers parameterized by weight matrices and bias parameters.
    Mathematically, DNNs can be expressed as a composition of individual layer functions,
    as in equation 1.4.


    DNN(x; θ) = f_L(f_{L-1}(⋯(f_1(x; θ_1))⋯); θ_L)  (1.4)


    Here, f_l(x) = f(x; θ_l) is the function at layer l. The compositional form of
    the DNNs reminds us of the chain rule when it comes to differentiating parameters
    as part of stochastic gradient descent. Throughout this book, we’ll look at several
    different kinds of DNNs, such as convolutional neural networks (CNNs), recurrent
    neural networks (RNNs), as well as transformers and graph neural networks (GNNs),
    with applications ranging from computer vision to finance.


    # 1.4.1 Two main camps of Bayesian inference: MCMC and VI


    *Markov chain Monte Carlo* (MCMC) is a methodology of sampling from high-dimensional
    parameter spaces to approximate the posterior distribution p(θ|x). In statistics,
    *sampling* refers to generating a random sample of values from a given probability
    distribution. There are many approaches to sampling in high-dimensional parameter
    spaces. As we’ll see in later chapters, MCMC is based on constructing a Markov
    chain whose stationary distribution is the target density of interest (i.e., posterior
    distribution). By performing a random walk over the state space, the fraction
    of time we spend in each state θ will be proportional to p(θ|x). As a result,
    we can use Monte Carlo integration to derive the quantities of interest associated
    with our posterior distribution.'
