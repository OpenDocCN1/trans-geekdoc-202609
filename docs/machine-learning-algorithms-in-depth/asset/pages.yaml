- pgno: 132
  md: 'Notice that subscript c indicates a county; thus, we are learning an intercept
    and a slope for each county sampled from a shared Gaussian distribution. Thus,
    we are assuming a hierarchical model in which our parameters (αc and βc) are sampled
    from common distributions. In code listing 6.2, we will define probability distributions
    over regression coefficients and model the data likelihood as the normal distribution
    with uniform standard deviation. Having specified the graphical model, we can
    run inference using the no-U-turn sampler (NUTS), with the help of the PyMC library.
    PyMC is a probabilistic programming library in Python that can be downloaded at
    https://docs.pymc.io/. It is an excellent tool for Bayesian modeling and can be
    considered from scratch, since we are defining the probabilistic graphical model
    from scratch and then using off-the-shelf tools for sampling the posterior distribution.
    If this is your first exposure to probabilistic programming languages, I highly
    recommend completing the PyMC online examples to learn more about its capabilities.


    Let’s examine the pseudo-code in figure 6.4.


    ```

    1: function main(X, y):

    2: with pymc3.Model() as hierarchical_model:

    3:   μa ~ N(0, 100²)

    4:   σa ~ Unif[0, 100]   → Hyperpriors

    5:   μb ~ N(0, 100²)

    6:   σb ~ Unif[0, 100]

    7:   a ~ N(μa, σa²) ← Intercept model

    8:   b ~ N(μb, σb²) ← Slope model

    9:   ε ~ Unif[0, 100] ← Error model

    10:  y_exp = a + b × X ← Expected value

