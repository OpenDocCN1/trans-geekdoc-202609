  md: 'Our goal is to minimize variational free energy $J(q)$ or, equivalently, maximize
    the lower bound.


    $$L(q) = -J(q) = \sum_{x} q(x) \log \frac{\tilde p(x)}{q(x)}\tag{3.10}$$


    We can rewrite the objective for each marginal distribution $q_j$, keeping the
    rest of the terms as constants, as demonstrated in section 21.3 of *Probabilistic
    Machine Learning* by Kevin Murphy (2012).


    $$L(q_j) = \sum_{x} \prod_i q_i(x_i) \left[\log \tilde p(x) - \sum_k \log q_k(x_k)\right]$$
    Mean-field approx


    $$= \sum_{x_j}\sum_{x_{-j}} q_j(x_j)\prod_{i\neq j} q_i(x_i)\left[\log \tilde
    p(x) - \sum_k \log q_k(x_k)\right]$$ Factors out $q_j$


    $$= \sum_{x_j} q_j(x_j)\log f_j(x_j) - \sum_{x_j} q_j(x_j)\sum_{x_{-j}}\prod_{i\neq
    j} q_i(x_i)\left[\sum_{k\neq j}\log q_k(x_k)+\log q_j(x_j)\right]$$


    $$= \sum_{x_j} q_j(x_j)\log f_j(x_j) - \sum_{x_j} q_j(x_j)\log q_j(x_j) + \text{const}$$
    Treats non-$q_j$ terms as constant $\tag{3.11}$


    Here, we defined the following.


    $$\log f_j(x_j) = \sum_{x_{-j}} \prod_{i\neq j} q_i(x_i) \log \tilde p(x) = E_{-q_j}[\log
    \tilde p(x)]\tag{3.12}$$


    Since we are replacing the values by their mean value, the method is known as
    the *mean field*. We can rewrite $L(q_j) = -KL(q_j \| f_j)$ and, therefore, maximize
    the objective by setting $q_j = f_j$ or, equivalently, equation 3.13.


    $$\log q_j(x_j) = \log f_j(x_j) = E_{-q_j}[\log \tilde p(x)]\tag{3.13}$$


    Here, the functional form of $q_j$ will be determined by the type of variables
    $x_j$ and their probability model. We will use this result in the next section
    to derive the image denoising algorithm from scratch.'
