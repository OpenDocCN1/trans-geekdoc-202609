  md: '$$c_t = \sum_s a_{ts}h_s^{enc} \tag{11.10}$$


    Here, $a_{ts}$ are learned attention weights given by the following.


    $$a_{ts} = \frac{\exp\{\operatorname{score}(h_{t-1}^{dec}, h_s^{enc})\}}{\sum_{s''}
    \exp\{\operatorname{score}(h_{t-1}^{dec}, h_{s''}^{enc})\}} \tag{11.11}$$


    There are several ways to learn the scoring function (e.g., the multiplicative
    style).


    $$\operatorname{score}(a,b) = a^T W b \tag{11.12}$$


    Here, $W$ is an intermediate trainable matrix. We can generalize attention as
    a soft dictionary lookup. A soft dictionary lookup refers to a type of search
    in which an exact match is not found. This is useful when searching for words
    that may have been misspelled or are related to the search term. We can think
    of attention as comparing a set of target vectors or queries $q_i$ with a set
    of candidate vectors or keys $k_j$. For each query, we compute how much the query
    is related to every key and then use these scores to weigh and sum the values
    $v_j$ associated with every key. Thus, we can define the attention matrix $A$
    as follows.


    $$A_{ij} = \operatorname{score}(q_i,k_j) \tag{11.13}$$


    Given the attention weights in $A_{ij}$, we compute a weighted combination of
    values $v_j$ associated with each key. As a result, for the $i$-th query, we have
    the following.


    $$r_i = \sum_j A_{ij}v_j = \sum_j \operatorname{score}(q_i,k_j)v_j \tag{11.14}$$


    Here, we can choose a normalized multiplicative score with $W=1$.


    $$\operatorname{score}(q_i,k_j) = \frac{q_i^T k_j}{\sqrt{D}} \tag{11.15}$$


    In matrix notation, where we have $N$ queries ($Q$ of size $N\times D$) and $N$
    key–value pairs ($K$ of size $N\times D$), we can write down the result (weighted
    set of values $V$, whose keys $K$ most resemble the query $Q$).


    $$\begin{aligned} R &= \operatorname{attention}(Q,K,V)=AV \\ &= \operatorname{score}(Q,K)V
    = \operatorname{softmax}\left(\frac{QK^T}{\sqrt{D}}\right)V \end{aligned} \tag{11.16}$$'
