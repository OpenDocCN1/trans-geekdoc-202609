  md: '# Summary


    +   - Latent Dirichlet allocation (LDA) is a topic model that represents each
    document as a finite mixture of topics, where a topic is a distribution over words.
    The objective is to learn the shared topic distribution and topic proportions
    for each document.

    +   - A common method for adjusting the word counts is tf-idf that logarithmically
    drives down to zero word counts that occur frequently across documents: A log
    (D / nₜ), where D is the total number of documents in the corpus and nₜ is the
    number of documents in which the term t appears.

    +   - The goal of density estimation is to model the probability density of data.
    Kernel density estimation (KDE) allocates one cluster center per data point.

    +   - The objective of mean-variance analysis is to maximize the expected return
    of a portfolio for a given level of risk, as measured by the standard deviation
    of past returns.

    +   - Since the problem of structure learning for general graphs is NP-hard, we
    focused on approximate methods. Namely, we looked at the Chow-Liu algorithm for
    tree-based graphs as well as inverse covariance estimation for general graphs.

    +   - Simulated annealing (SA) is a heuristic search method that allows for occasional
    transitions to less favorable states to escape local optima.

    +   - We can formulate simulated annealing as an energy minimization problem with
    temperature parameter T, with which we can modify the energy landscape and select
    moves that are unfavorable in the short term but can lead to better long-term
    optima.

    +   - Genetic algorithms (GA) are inspired by and modeled after evolutionary biology.
    They consist of a population of (randomly initialized) individual genomes that
    are evaluated for their fitness with respect to a target.

    +   - In genetic algorithms, two individuals combine and cross over their genome
    to produce an offspring. This crossover step is followed by a mutation by which
    individual bases can change according to a mutation rate. The resulting offspring
    are added to the population and scored according to their fitness level.'
