  md: '$$\sum_{k=1}^{\infty} \eta_k = \infty$$

    $$\sum_{k=1}^{\infty} \eta_k^2 < \infty \tag{5.27}$$


    We can use the following learning rate schedule, which satisfies the conditions
    in equation 5.27.


    $$\eta_k = (\tau_0 + k)^{-\kappa} \tag{5.28}$$


    Here, $\tau_0 \ge 0$ slows down early iterations of the algorithm and $\kappa
    \in (0.5, 1]$ controls the rate at which old values are forgotten. To compute
    the steepest descent direction $g_k$, we need to differentiate our loss function
    $\text{NLL}(\theta)$.


    $$\frac{d}{d\theta}\log p(D|\theta) = \sum_{i=1}^{n}\left[y_i\frac{d}{d\theta}\log\sigma\left(\theta^T
    x_i\right) + (1-y_i)\frac{d}{d\theta}\log\left(1-\sigma\left(\theta^T x_i\right)\right)\right]$$

    $$= \sum_{i=1}^{n}\left[y_i\frac{\sigma\left(\theta^T x_i\right)\left(1-\sigma\left(\theta^T
    x_i\right)\right)}{\sigma\left(\theta^T x_i\right)}x_i + (1-y_i)\frac{\sigma\left(\theta^T
    x_i\right)\left(1-\sigma\left(\theta^T x_i\right)\right)}{1-\sigma\left(\theta^T
    x_i\right)}(-x_i)\right]$$

    $$= \sum_{i=1}^{n}\left[y_i x_i\left(1-\sigma\left(\theta^T x_i\right)\right)-(1-y_i)x_i\sigma\left(\theta^T
    x_i\right)\right]$$

    $$= \sum_{i=1}^{n}\left[y_i-\sigma\left(\theta^T x_i\right)\right]x_i$$

    $$= \sum_{i=1}^{n}\left[y_i-\mu_i\right]x_i = -X^T(\mu - y) \tag{5.29}$$


    In equation 5.29, we used the fact that $d/dx\,\sigma(x) = (1-\sigma(x))\sigma(x)$
    and the mean of the Bernoulli distribution $\mu_i = \sigma(\theta^T x_i)$. Note
    that there exist a number of autograd libraries to avoid deriving the gradients
    by hand. Furthermore, we can add regularization to control parameter size. Our
    regularized objective and the gradient become the following.


    $$\min_{\theta}\text{Loss}(\theta) = \min_{\theta}\left[\text{NLL}(\theta) + \lambda\theta^T\theta\right]$$

    $$g_k = X^T(\mu - y) + 2\lambda\theta \tag{5.30}$$'
