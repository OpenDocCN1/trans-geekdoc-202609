  md: 'active learner poses queries in the form of unlabeled data instances to be
    labeled by an oracle. In this way, the active learner seeks to achieve high accuracy
    using as few labeled instances as possible. For a review, see “Active Learning
    Literature Survey” by Burr Settles (University of Wisconsin-Madison, Department
    of Computer Sciences, 2009).


    We focus on pool-based sampling that assumes that there is a small set of labeled
    data L and a large pool of unlabeled data U. Queries are selectively drawn from
    the pool according to an informativeness measure. Pool-based methods rank the
    entire collection of unlabeled data to select the best query. Therefore, for very
    large datasets, stream-based sampling, where the data is scanned sequentially
    and query decisions are evaluated individually, may be more appropriate. Figure
    7.9 shows an example of pool-based active learning based on the binary classification
    of a synthetic dataset with two balanced classes using logistic regression (LR).


