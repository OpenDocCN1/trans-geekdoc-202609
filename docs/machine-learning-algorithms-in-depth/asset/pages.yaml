    \n# 11.3 Attention and transformers\n\nAttention allows a model to adaptively\
    \ pay attention to different parts of the input by adjusting attention weights.\
    \ Attention mechanisms can be applied to many kinds of neural networks but were\
    \ first used in the context of recurrent neural networks (RNNs). In Seq2Seq neural\
    \ models, such as those used in machine translation, the output context vector\
    \ that summarizes the input sentence does not have access to individual input\
    \ words. This results in poor performance, as measured by the BLEU score. We can\
    \ avoid this bottleneck by letting the output attend to input words directly,\
    \ in a weighted fashion. In other words, we can compute the context vector as\
    \ a weighted sum of input word vectors h^enc_s."
