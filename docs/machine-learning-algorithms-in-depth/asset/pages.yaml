  md: '![](img/325742126d3ff007c6c385f4ffb5c3be_264_0.png)


    # Figure 10.12 Slowly varying (left) and rapidly varying (right) log likelihood


    quickly reach the optimum. In the case of a rapidly varying objective (right),
    the gradient would typically be very large. Using a large learning rate would
    result in very large, steps, oscillating around but not reaching the optimum.
    These two situations occur because the learning rate is set independently of the
    gradient. AdaGrad solves this by accumulating squared norms of gradients seen
    so far and dividing the learning rate by the square root of the following sum.


    g = \frac{1}{m}\nabla_{\theta}\sum_{i} L\big(f\big(x^{(i)};\theta\big),y^{(i)}\big)

    s = s + g^{T}g

    \theta = \theta - \epsilon_{k}\times\frac{g}{\sqrt{s+eps}}

    (10.17)


    As a result, parameters that receive high gradients have their effective learning
    rate reduced and parameters that receive small gradients have their effective
    learning rate increased. The net effect is greater progress in the more gently
    sloped directions of parameter space and more cautious updates in the presence
    of large gradients.


    RMSProp modifies AdaGrad by changing the gradient accumulation into an exponentially
    weighted moving average (i.e., it discards history from the distant past).


    g = \frac{1}{m}\nabla_{\theta}\sum_{i} L\big(f\big(x^{(i)};\theta\big),y^{(i)}\big)

    s = decay\_rate \times s + (1 - decay\_rate)g^{T}g

    \theta = \theta - \epsilon_{k}\times\frac{g}{\sqrt{s+eps}}

    (10.18)


    Notice that AdaGrad implies a decreasing learning rate, even if the gradients
    remain constant, due to the accumulation of gradients from the beginning of training.
    By introducing an exponentially weighted moving average, we are weighing the recent
    past'
