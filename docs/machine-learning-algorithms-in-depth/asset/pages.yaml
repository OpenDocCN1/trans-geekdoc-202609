- pgno: 241
  md: 'To train the neural network, we need to introduce the loss function. A *loss
    function* tells us how far away the network output is from expected ground truth
    labels. The loss depends on the task we are optimizing for, and in the case of
    our MLP, it can be, for example, cross-entropy $H(p, q)$ loss for classification
    or mean squared error (MSE) loss for regression.


    ```

    $$L_H(y,\hat{y}) = H(p,q) = -\sum_{x\in X} p(x)\log q(x) = -\sum_{k=1}^{K} y_k\log\hat{y}_k$$


    $$L_{MSE}(y,\hat{y}) = \text{MSE}(y,\hat{y}) = \frac{1}{N}\sum_{i=1}^{N}(y_i -
    \hat{y}_i)^2 \tag{10.5}$$

    ```


    Here, $y$ is the true label and $p(x)$ is the true distribution; $\hat{y}$ is
    the predicted label and $q(x)$ is the predicted distribution.


    MLPs are known as feed-forward networks because they have a direct computational
    graph from input to output. A neural network training consists of a forward and
    backward pass. During inference (forward pass), each layer produces a forward
    message $z = f(x; \theta)$ as the output (given the current weights of the network)
    followed by computation of the loss function. During the backward pass, each layer
    takes a backward message $dL/dz$ of the next layer and produces two backward messages
    at the output $dL/dx$ gradient wrt to the previous layer $x$ and $dL/d\theta$
    gradient wrt to parameters of the current layer.


    This backpropagation algorithm is based on the chain rule and can be summarized
    as follows.


    ```

    $$\frac{\partial L}{\partial x_i} = \sum_{j} \frac{\partial L}{\partial z_j} \frac{\partial
    z_j}{\partial x_i}$$


    $$\frac{\partial L}{\partial \theta_i} = \sum_{j} \frac{\partial L}{\partial z_j}
    \frac{\partial z_j}{\partial \theta_i} \tag{10.6}$$

    ```


    Once we know the gradient with respect to parameters for each layer, we can update
    the layer parameters as follows.


    ```

    $$\theta_i^{l} = \theta_i^{l-1} - \lambda \frac{\partial L}{\partial \theta_i}
    \tag{10.7}$$

    ```


    Here, $\lambda$ is the learning rate. Note that the gradients are computed automatically
    by deep learning frameworks, such as TensorFlow/PyTorch.'
