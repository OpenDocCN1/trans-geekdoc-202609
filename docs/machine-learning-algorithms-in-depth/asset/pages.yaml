    # **5.3** Show that the radial basis function kernel is equivalent to the computing
    similarity between two infinite dimensional feature vectors.


    The radial basis function kernel can be expanded using the multinomial theorem,
    as follows. Assuming the sigma is equal to 1, we have the following:


    $$\begin{aligned}

    \kappa(x,x'') &= \exp\left(-\frac{1}{2}\lVert x-x''\rVert^2\right)\\

    &= \exp\left(x^T x'' - \frac{1}{2}\lVert x\rVert^2 - \frac{1}{2}\lVert x''\rVert^2\right)\\

    &= \exp(x^T x'')\exp\left(-\frac{1}{2}\lVert x\rVert^2\right)\exp\left(-\frac{1}{2}\lVert
    x''\rVert^2\right)\\

    &= \sum_{k=0}^{\infty}\frac{(x^T x'')^k}{k!}\exp\left(-\frac{1}{2}\lVert x\rVert^2\right)\exp\left(-\frac{1}{2}\lVert
    x''\rVert^2\right)

    \end{aligned}$$


    This implies that **RBF** expansion has an infinite number of dimensions.


    # **5.4** Verify that the learning rate schedule $\eta_k=(\tau_0+k)^{-\kappa}$
    satisfies Robbins-Monro conditions.


    To show that the learning rate satisfies Robbins-Monro conditions, we need to
