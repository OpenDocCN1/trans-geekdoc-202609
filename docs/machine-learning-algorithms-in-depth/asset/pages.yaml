    # 4.3  ML research: Sampling methods and variational inference


    In this section, we focus on ML research, which is a very important skill to have
    to be current in the field. We focus on the latest developments in the area of
    sampling methods and variational inference. As we observed in this chapter, many
    modern ML algorithms include clever algorithms to approximate hard-to-compute
    posterior densities as a result of intractable, high-dimensional integrals involved
    in the computation of the posterior.


    It is worth spending time to briefly compare the differences between MCMC and
    variational inference. The advantages of variational inference include that for
    small to medium problems, it is usually faster, it is deterministic, it is easy
    to determine when to stop, and it often provides a lower bound on log likelihood.
    The advantages of sampling include that it is often simpler to implement, it is
    applicable to a broader range of problems (e.g., problems without nice conjugate
    priors), and sampling can be faster when applied to very large models or datasets.
    See chapter 24 of *Machine Learning: A Probabilistic Perspective* by Kevin P.
    Murphy for additional discussion on the topic.


    In addition to the classic MCMC sampling algorithms we studied in previous chapters,
    a few others deserving attention are slice sampling (see Radford M. Neal’s, “Slice
    Sampling,” *Annals of Statistics*, 2003), the Hamiltonian Monte Carlo (HMC; see
    Radford M. Neal’s, “MCMC Using Hamiltonian Dynamics,” arXiv, 2012), and the no-U-turn
    sampler (NUTS; see Matthew D. Hoffman and Andrew Gelman’s, “The No-U-Turn Sampler:
    Adaptively Setting Path Lengths in Hamiltonian Monte Carlo,” *Journal of Machine
    Learning Research*, 2014). The state-of-the-art NUTS algorithm is commonly used
    as an MCMC inference method for probabilistic graphical models and is implemented
    in the PyMC3, Stan, TensorFlow Probability, and Pyro probabilistic programming
    libraries.


    There have been several attempts to scale MCMC for big data, leading to Stochastic
    Monte Carlo methods that can be generally grouped into stochastic gradient based
    methods, methods using approximate Metropolis-Hastings with randomly sampled mini-batches,
    and data augmentation. Another popular class of MCMC algorithms is streaming Monte
    Carlo that approximates the posterior for online Bayesian inference. Sequential
    Monte Carlo (SMC) relies on resampling and propagating samples over time with
    a large number of particles.


    Parallelizing Monte Carlo algorithms is another major area of research. If blocks
    of independent samples can be drawn from the posterior or a proposal distribution,
    the sampling algorithm can be parallelized by running multiple independent samplers
    on separate machines and then aggregating the results. Additional methods include'
