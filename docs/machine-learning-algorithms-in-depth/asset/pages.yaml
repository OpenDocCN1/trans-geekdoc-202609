    # 9.3    *Structure learning*


    In this section, we will discover a graph’s structure, given relational data.
    In other words, we would like to evaluate the probability of graph $G=(V,E)$,
    given observed data $D$. One challenge in inferring the graph structure is the
    exponential number of possible graphs. For example, in a directed graph $G$, we
    can have $V$ choose 2 edges; since each edge has two possible directions, we have
    $O(2^{V(V-1)/2})$ possible graphs. Since the problem of structure learning for
    general graphs is $NP$-hard, we will focus on approximate methods. Namely, we’ll
    look at the Chow-Liu algorithm for tree-based graphs as well as inverse covariance
    estimation for general graphs.


    # 9.3.1    *Chow-Liu algorithm*


    We can define the joint probability model for a tree $T$ as follows.


    $$p(x\mid T)=\prod_{t\in V}p(x_t)\prod_{(s,t)\in E}\frac{p(x_s,x_t)}{p(x_s)p(x_t)}
    \tag{9.12}$$


    Here, $p(x_t)$ is a node marginal and $p(x_s,x_t)$ is an edge marginal. For example,
    for a $|V|=3$ node $V$-shaped undirected tree, we have the following.


    $$\begin{aligned} p(x_1,x_2,x_3\mid T) &= p(x_1)p(x_2)p(x_3)\frac{p(x_1,x_2)p(x_2,x_3)}{p(x_1)p(x_2)p(x_2)p(x_3)}
    \\ &= \frac{p(x_1,x_2)p(x_2,x_3)}{p(x_2)} = p(x_2)p(x_1\mid x_2)p(x_3\mid x_2)
    \end{aligned} \tag{9.13}$$'
