  md: "Equation 7.11 is true for some coefficients a_i, and since U is an ortho-normal\
    \ matrix (i.e., U^T U = I) and |λ_k| / |λ_1| < 1 for k > 1, v_t converges to u_1,\
    \ which is equal to our stationary distribution! We can summarize the page rank\
    \ algorithm in the pseudo-code in figure 7.2.\n\n```\n1: class page_rank\n2: function\
    \ power_iteration(A):\n3: v0 ~ Unif[0, 1]^d\n4: while (not converged) and (iter\
    \ ≤ max_iter):\n5:   v_t = A v_{t-1}\n6:   v_t = v_t / ||v_t||\n7:   λ = v_t^T\
    \ A v_t\n8:   converged = ||v_t - v_{t-1}|| ≤ tolerance\n9: end while\n10: return\
    \ λ, v_t\n```\n\n# Figure 7.2 Page rank pseudo-code\n\nWe start by sampling the\
    \ initial value of our vector v from a d-dimensional uniform distribution. Next,\
    \ we iterate by multiplying A and v and renormalizing v. We repeat the process\
    \ until we either converge or exceed the maximum number of iterations. We are\
    \ now ready to implement the power method algorithm for computing page rank from\
    \ scratch in the following listing.\n\n# Listing 7.1 Page rank algorithm\n\n```\n\
    import numpy as np\nfrom numpy.linalg import norm\n\nnp.random.seed(42)\n\nclass\
    \ page_rank():\n    def __init__(self):\n        self.max_iter = 100\n       \
    \ self.tolerance = 1e-5\n\n    def power_iteration(self, A):\n        n = np.shape(A)[0]\n\
    \        v = np.random.rand(n)\n        converged = False\n        iter = 0\n\n\
    \        while (not converged) and (iter < self.max_iter):\n            old_v\
    \ = v\n            v = np.dot(A, v)\n            v = v / norm(v)\n           \
    \ lambd = np.dot(v, np.dot(A, v))\n            converged = norm(v - old_v) < self.tolerance\n\
    \            iter += 1\n        #end while\n```"
