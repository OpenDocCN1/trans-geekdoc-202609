  md: 'q_i(x_i = +1) = \frac{\exp\{m_i + L_i^+\}}{\exp\{m_i + L_i^+\} + \exp\{-m_i
    + L_i^-\}} = \frac{1}{1 + \exp\{-2m_i + L_i^- - L_i^+\}} = \frac{1}{1 + \exp\{-2a_i\}}
    = \sigma(2a_i) \tag{3.20}


    Here, $a_i = m_i + \frac{1}{2}(L_i^+ L_i^-)$ and $\sigma(x)$ is a sigmoid function.
    Since $q_i(x_i = -1) = 1 - q_i(x_i = +1) = 1 - \sigma(2a_i) = \sigma(-2a_i)$,
    we can write the mean of our variational approximation $q_i(x_i)$ as follows.


    \mu_i = E_{q_i}[x_i] = \sigma(2a_i) - \sigma(-2a_i) = \tanh(a_i) \tag{3.21}


    In other words, our mean-field updates of the variational parameters $\mu_i$ at
    iteration $k$ are computed as follows.


    \mu_i^{(k)} = \tanh\left( \sum_{j \in N(i)} w_{ij} \mu_j^{(k-1)} + \frac{1}{2}
    \left[ \log \frac{N(x_i = +1, \sigma^2)}{N(x_i = -1, \sigma^2)} \right] \right)
    \times \lambda + (1 - \lambda) \times \mu_i^{(k-1)} \tag{3.22}


    Here, we added a learning rate parameter $\lambda \in (0, 1]$. We further note
    that we can simplify the computation of the ELBO term by term, as follows.


    \sum_{(s,t) \in E} E_{q(x)}[x_s w_{st} x_t] \quad \text{ELBO first term} \\ =
    \frac{1}{2} \sum_{i=1}^n \sum_{j \in N(i)} \left( \sum_{x_i \in \{-1,+1\}} \sum_{x_j
    \in \{-1,+1\}} q_i(x_i) q_j(x_j) x_i J x_j \right) \quad \text{By definition of
    expectation} \\ = \frac{1}{2} \sum_{i=1}^n \sum_{j \in N(i)} \left( q_i(x_i =
    +1) J E[x_j] - q_i(x_i = -1) J E[x_j] \right) \quad \text{After substitution of
    values for xi and xj} \\ = \frac{1}{2} \sum_{i=1}^n \sum_{j \in N(i)} E[x_i] J
    E[x_j] \quad \text{By definition of expectation} \tag{3.23}


    Equation 3.24 is similar.'
