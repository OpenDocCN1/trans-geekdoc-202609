  md: 'Therefore, we can improve the ELBO by improving the model log evidence log
    p(x) through the prior p(z) or the likelihood p(z|x) or by improving the variational
    posterior approximation q(z).


    Finally, we can write the ELBO as follows.


    ELBO = 1/n Σ_{i=1}^n [ E_{q(z)}[ log p(x_i|z_i) ] - KL(q(z_i)||p(z_i)) ]  (3.8)

    Sample likelihood

    Distance between the approximating q(z) and the prior p(z) for sample i


    This version emphasizes a likelihood term for the i-th observation and KL divergence
    term between each approximating distribution and the prior. In all the preceding
    cases, the expectation with respect to q(z) can be computed by sampling from our
    approximating distribution. Let’s look at one of the most common variational approximations
    in the next section.


    # 3.2 Mean-field approximation


    One of the most popular forms of variational inference is the mean-field approximation,
    where we assume the posterior is a fully factorized approximation of the form.


    q(x) = ∏_i q_i(x_i)  (3.9)


    Here, we optimize over the parameters of each marginal distribution q_i(x_i).
    We can visualize a fully factored distribution, as in figure 3.3.


    ![](img/325742126d3ff007c6c385f4ffb5c3be_67_0.png)


    Figure 3.3 True posterior (left), structured approximation (middle), and fully
    factored approximation (right)


    For a distribution with three random variables, x1, x2, and x3, we have the true
    posterior p(x1, x2, x3) that we are attempting to approximate by a fully factored
    distribution q(x1) q(x2) q(x3).'
