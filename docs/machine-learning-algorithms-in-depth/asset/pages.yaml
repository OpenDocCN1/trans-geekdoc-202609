    # 2.5 Gibbs sampling


    In this section, we introduce one of the fundamental MCMC algorithms, called Gibbs
    sampling. This form of sampling is based on the idea of sampling one variable
    at a time from a multidimensional distribution conditioned on the latest samples
    from all the other variables. For example, for a d = 3 dimensional distribution,
    given a starting sample x^{[k]}, we generate the next sample x^{[k+1]} as follows.


    $$x_1^{k+1} \sim p\left(x_1|x_2^k, x_3^k\right)$$ $$x_2^{k+1} \sim p\left(x_2|x_1^{k+1},
    x_3^k\right)$$ $$x_3^{k+1} \sim p\left(x_3|x_1^{k+1}, x_2^{k+1}\right)\tag{2.14}$$


    The distributions in equation 2.14 are called fully conditional distributions.
    Also, notice that the naive Gibbs sampling algorithm is sequential (with the number
    of steps proportional to the dimensionality of the distribution) and it assumes
    we can easily sample from the fully conditional distributions. The Gibbs sampling
    algorithm is applicable to scenarios in which full conditional distributions in
    equation 2.14 are easy to compute.


    One instance in which the fully conditional distributions are easy to compute
    is in the case of multivariate Gaussians with PDF, defined as follows.


    $$\mathcal{N}(x; \mu, \Sigma) = \frac{1}{(2\pi)^{\frac{d}{2}}|\Sigma|^{\frac{1}{2}}}
    \exp\left[-\frac{1}{2}(x-\mu)^T \Sigma^{-1} (x-\mu)\right]\tag{2.15}$$


    Let’s partition the Gaussian vector into two sets x{1:D} = (x_A, x_B) with the
    parameters shown in equation 2.16.


    $$\mu = \begin{pmatrix} \mu_A \\ \mu_B \end{pmatrix}$$ $$\Sigma = \begin{pmatrix}
    \Sigma_{AA} & \Sigma_{AB} \\ \Sigma_{BA} & \Sigma_{BB} \end{pmatrix}\tag{2.16}$$


    Then, it can be shown, as discussed in section 2.3 of Christopher M. Bishop’s
    Pattern Recognition and Machine Learning (2006), that the full conditionals are
    given by equation 2.17.'
