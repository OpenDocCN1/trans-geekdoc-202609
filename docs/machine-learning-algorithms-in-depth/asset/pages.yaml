  md: "training labels to model selection and ensemble methods used in all data science\
    \ competitions. Finally, we conclude with ML research and exercises. Let’s begin\
    \ by reviewing the fundamentals of Markov models.\n\n# 7.1 Markov models\n\nIn\
    \ this section, we discuss probabilistic models for a sequence of observations.\
    \ Time series models have a wide range of applications, including in computational\
    \ finance, speech recognition, and computational biology. We’ll start by looking\
    \ at two popular algorithms built upon the properties of Markov chains: the page\
    \ rank algorithm and the EM algorithm for hidden Markov models (HMMs).\n\nHowever,\
    \ before we dive into individual algorithms, let’s start with the fundamentals.\
    \ A Markov model for a sequence of random variables x1, ..., xT of order 1 is\
    \ a joint probability model that can be factorized as follows.\n\n$p(x_1, ...,\
    \ x_T) = p(x_1)p(x_2|x_1)\\cdots p(x_T|x_{T-1})$ \n$= p(x_1)\\prod_{t=2}^{T} p(x_t|x_{t-1})$\
    \  (7.1)\n\nNotice that each factor is a conditional distribution conditioned\
    \ by 1 random variable (i.e., each factor only depends on the previous state and,\
    \ therefore, has a memory of 1). We can also say that X_{t-1} serves as a sufficient\
    \ statistic for X_t. A sufficient statistic is a function of sample data (e.g.,\
    \ a summary of the data, such as a sum or a mean) that contains all the information\
    \ needed to estimate an unknown parameter in a statistical model.\n\nLet’s look\
    \ at the transition probability $p(x_t|x_{t-1})$ in more detail. For a discrete\
    \ state sequence $x_t \\in \\{1, ..., K\\}$, we can represent the transition probability\
    \ as a $K \\times K$ stochastic matrix (in which the rows sum to 1).\n\n$A_{ij}\
    \ = p(X_t = j|X_{t-1}=i), \\text{where} \\sum_j A_{ij}=1 \\ \\forall i$  (7.2)\n\
    \nFigure 7.1 shows a simple Markov model with two states.\n\nHere, $\\alpha$ is\
    \ the transition probability out of state 1 and $1-\\alpha$ is the probability\
    \ of staying in state 1. Notice how the transition probabilities out of each state\
    \ add up to 1. We can write down the corresponding transition probability matrix\
    \ as follows.\n\n![](img/325742126d3ff007c6c385f4ffb5c3be_144_0.png)\n\n$A = \\\
    begin{pmatrix} 1-\\alpha & \\alpha \\\\ \\beta & 1-\\beta \\end{pmatrix}$  (7.3)\n\
    \nIf $\\alpha$ and $\\beta$ do not vary over time; in other words, if the transition\
    \ matrix $A$ is independent of time, we call the Markov chain stationary or time\
    \ invariant."
