    ```


    As a result, the optimum maximum likelihood estimate (MLE) value of θ_jc = N_jc
    / N_c where N_c = Σ1[y_i = c], which makes intuitive sense as a ratio of counts.
    Note that it''s straightforward to add a Beta conjugate prior for the Bernoulli
    random variables and a Dirichlet conjugate prior for the class density to smooth
    the MLE counts.


    ```

    p(π|D) = Dir(N_1 + α_1, ..., N_c + α_c) \\

    p(θ_{jc}|D) = Beta([N_c - N_{jc}] + β_0, N_{jc} + β_1) \tag{5.39}

    ```


    Here, we use conjugate prior for computational convenience, since the posterior
    and prior have the same form, which enables closed-form updates.


    During test time, we would like to predict the class label y given the training
    data D and the learned model parameters. Applying the Bayes rule, we get the following.


    ```

    p(y = c | x_{i,1}, ..., x_{i,D}, D) ∝ p(y = c | D) p(x_{i,1}, ..., x_{i,D} | y
    = c, D) \\

    = p(y = c | D) \prod_{j=1}^{D} p(x_{ij} | y = c, D) \tag{5.40}

    ```


    Substituting the distributions for p(y = c | D) and p(x_{ij} | y = c, D) and taking
    the log, we get the following.


    ```

    \log p(y = c | x, D) ∝ \log \hat{π}_c + \sum_{j=1}^{D} \left( 1[x_{ij}=1] \log
    \hat{θ}_{jc} + 1[x_{ij}=0] \log (1 - \hat{θ}_{jc}) \right) \tag{5.41}

    ```


