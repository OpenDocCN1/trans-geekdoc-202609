    # ### 6.2 Derive the Gaussian process update equations based on the rules for
    conditioning multivariate Gaussian random variables.


    Consider the following joint GP distribution:


    $$

    \begin{pmatrix} f \\ f_* \end{pmatrix} \sim \mathcal{N}\left(\begin{pmatrix} \mu
    \\ \mu_* \end{pmatrix}, \begin{pmatrix} K & K_* \\ K_*^T & K_{**} \end{pmatrix}\right)

    $$


    Here, we want to predict the function outputs $y^*=f(x^*)$ (i.e., starred variables
    represent a prediction on test data $X^*$ and $K=K(X,X)$, $K^*=K(X,X^*)$ and $K^{**}=K(X^*,X^*)$).
    Using the following rules for conditional distributions, we have the following:


    $$

    p(x_A\mid x_B)=\mathcal{N}\left(x_A\mid\mu_A+\Sigma_{AB}\Sigma_{BB}^{-1}(x_B-\mu_B),\;\Sigma_{AA}-\Sigma_{AB}\Sigma_{BB}^{-1}\Sigma_{BA}\right)

    $$


    $$

    p(x_B\mid x_A)=\mathcal{N}\left(x_B\mid\mu_B+\Sigma_{BA}\Sigma_{AA}^{-1}(x_A-\mu_A),\;\Sigma_{BB}-\Sigma_{BA}\Sigma_{AA}^{-1}\Sigma_{AB}\right)

    $$


    Here, set $A$ corresponds to $X$ and set $B$ corresponds to $X^*$. We get the
    Gaussian process update equations:


    $$

    p(f_*\mid X_*,X,f) \sim \mathcal{N}(f_*\mid\mu_*,\Sigma_*)

    $$

    $$

    \mu_* = \mu(X_*) + K_*^T K^{-1}(f-\mu(X))

    $$

    $$

    \Sigma_* = K_{**} - K_*^T K^{-1}K_*

    $$'
