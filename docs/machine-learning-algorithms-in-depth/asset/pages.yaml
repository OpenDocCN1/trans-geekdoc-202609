- pgno: 208
  md: 'θ_d | α ~ Dir(α)

    z_{i,d} | θ_d ~ Cat(θ_d)

    β_k | η ~ Dir(η)

    x_{i,d} | z_{i,d}=k, β ~ Cat(β_k) (9.1)


    The joint distribution for a single document d can be written as follows (as discussed
    in David M. Blei, Andrew Y. Ng, and Michael I. Jordan’s “Latent Dirichlet Allocation,”
    Journal of Machine Learning Research, 2003).


    p(x, z, θ | α, β) = p(θ_d | α) ∏_{i=1}^{n_d} p(z_{i,d} | θ_d) p(x_{i,d} | z_{i,d},
    β) (9.2)


    The parameters α and β are corpus-level parameters, the variable θ_d is sampled
    once every document, and z_{i,d} and x_{i,d} are word-level variables sampled
    once for each word in each document. Unlike a multinomial clustering model, where
    each document is associated with a single topic, LDA represents each document
    as a mixture of topics.


    # 9.1.1 Variational Bayes


    The key inference problem we need to solve to use LDA is that of computing the
    posterior distribution of the latent variables for a given document: p(θ, z |
    x, α, β). The posterior can be approximated with the following variational distribution.


    q(θ, z | γ, φ) = q(θ | γ) ∏_{i=1}^{n} q(z_i | φ_i) (9.3)


    The variational parameters are optimized to maximize the evidence lower bound
    (ELBO). Recall from chapter 3 the definition of ELBO as a difference between the
    energy term and the entropy term.


    log p(x | α, η) ≥ L(x, φ, γ, λ)

    = E_q[log p(x, z, θ, β | α, η)] − E_q[log q(z, θ, β)] (9.4)


    We choose a fully factored distribution q of the form.


    q(z_{id}=k) = φ_{dwik};  q(θ_d) ~ Dir(θ_d | γ_d);  q(β_k) ~ Dir(β_k | λ_k) (9.5)'
