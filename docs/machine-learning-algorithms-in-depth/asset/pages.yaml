  md: '# 7.1 Explain how temperature softmax works for different values of the temperature
    parameter T.


    Temperature softmax is defined as follows:


    p_i = softmax(x, T) = \frac{\exp\left(\frac{x_i}{T}\right)}{\sum_{j=1}^{N} \exp\left(\frac{x_j}{T}\right)}


    When T=1, we get the regular soft-max function. As T approaches infinity, the
    output distribution becomes more uniform (all outcomes are more equally likely).
    Thus, heating the distribution increases its entropy. As T approaches 0, we are
    decreasing the entropy of the output distribution, thereby accentuating high probability
    outputs.


