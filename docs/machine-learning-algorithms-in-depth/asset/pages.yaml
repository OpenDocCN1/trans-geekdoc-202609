  md: 'In the following section, we will review deep learning research in the area
    of computer vision and natural language processing.


    # ## 11.5 ML research: Deep learning


    In the area of computer vision (CV), the CNN architecture has evolved from convolutional,
    ReLU, and max pooling operations of LeNet (Yann LeCun et al.’s “Gradient-Based
    Learning Applied to Document Recognition,” In Proceedings of the IEEE, 1998) to
    inception modules of GoogLeNet (Christian Szegedy et al.’s “Going Deeper with
    Convolutions,” *Computer Vision and Pattern Recognition*, 2015). The inception
    module creates variable receptive fields by employing different kernel sizes.
    This, in turn, allows the capturing of sparse correlation patterns in the new
    feature map stack. GoogLeNet offers high accuracy on the ImageNet dataset with
    fewer parameters than AlexNet (Alex Krizhevsky, Ilya Sutskever, and Geoffrey E.
    Hinton’s “ImageNet Classification with Deep Convolutional Neural Networks,” Conference
    on Neural Information Processing Systems, 2012) or VGG (Karen Simonyan and Andrew
    Zisserman’s “Very Deep Convolutional Networks for Large-Scale Image Recognition,”
    International Conference on Learning Representations, 2015). We saw the introduction
    of residual connections in the ResNet model (Kaiming He et al.’s “Deep Residual
    Learning for Image Recognition,” Conference on Computer Vision and Pattern Recognition,
    2015), which became the standard architectural choice for modern neural networks
    of arbitrary depth. Fast-forwarding to vision transformer (ViT) model (Alexey
    Dosovitskiy et al.’s “An Image is Worth 16x16 Words: Transformers for Image Recognition
    at Scale,” International Conference on Learning Representations, 2021) employs
    a transformer-like architecture over patches of the image. The image is divided
    into fixed-size patches, each of which being linearly and positionally embedded
    and the resulting sequence of vectors fed to a standard transformer encoder followed
    by a MLP head for classification.


    In the area of generative models, generative adversarial networks (GANs), introduced
    by Ian Goodfellow et al in “Generative Adversarial Networks” (Conference and Workshop
    on Neural Information Processing Systems, 2014), draw on the ideas from game theory
    and use two networks trained to approximate the distribution of the data: a generator
    to generate images and a discriminator to discriminate between real and fake images.
    On the other hand, likelihood-based generative models model the distribution of
    the data, using a likelihood function. The most popular subclass of likelihood-based
    generative models is the variational autoencoder (VAE), introduced by Diederik
    P. Kingma and Max Welling in “Auto-Encoding Variational Bayes” (International
    Conference on Learning Representations, 2014). A VAE consists of an encoder that
    takes in data as input, transforming it into a latent representation, and a decoder
    that takes a latent representation and returns a reconstruction. A beta-VAE is
    a modification of VAE with a special emphasis on discovering disentangled latent
    factors (Irina Higgins et al.’s “beta-VAE: Learning Basic Visual Concepts with
    a Constrained Variational Framework,” International Conference on Learning Representations,
    2017).'
