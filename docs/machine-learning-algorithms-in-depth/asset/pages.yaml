  md: 'During training, we may want to adopt a learning rate schedule to avoid local
    optima and converge on a solution. We typically start with the learning rate of
    some constant and reduce it according to a schedule over epochs, where one epoch
    is a single pass through the training dataset. Throughout this chapter, we’ll
    be using an exponential learning rate schedule. Other alternatives include a piecewise
    linear schedule with successive halving, cosine annealing schedule, and one-cycle
    schedule.


    Before we get to the implementation of MLP, it’s advantageous to talk about model
    capacity, to avoid underfitting, and regularization, to prevent overfitting. Regularization
    can occur at multiple levels, such as weight decay, early stopping, and dropout.
    At a high level, we would like to increase model capacity by changing the architecture
    (e.g., increasing the number of layers and the number of hidden units per layer)
    if we find that the model is underfitting or not achieving high validation accuracy.
    On the other hand, to avoid overfitting, we can introduce weight decay or l2 regularization
    applied to nonbias weights (W but not b) of each layer. Weight decay encourages
    smaller weights and, therefore, simpler models. Another form of regularization
    is stopping the training early when we notice validation loss is starting to increase
    away from the training loss. This early stopping criterion can be used to save
    time and computational resources, while saving a checkpoint of the model. Finally,
    dropout is an effective regularization technique, where the dense connections
    are dropped or zeroed at random according to a fixed rate, as shown in figure
    10.2. Dropout enables better generalization (see Nitish Srivastava et al.’s “Dropout:
    A Simple Way to Prevent Neural Networks from Overfitting,” JMLR 2014).


    ![](img/325742126d3ff007c6c385f4ffb5c3be_242_0.png)


