- pgno: 281
  md: 'In our example, we assume an isotropic covariance $\Sigma_k = \sigma_k^2 I$;
    thus, we can write a $d$-dimensional Gaussian as a product. Given the multivariate
    Gaussian, we get the following.


    $$N(y_i\mid\mu_k,\Sigma_k)=\frac{1}{(2\pi)^{d/2}|\Sigma_k|^{1/2}}\exp\left(-\frac{1}{2}(y_i-\mu_k)^T\Sigma_k^{-1}(y_i-\mu_k)\right)
    \tag{11.8}$$


    Since the covariance matrix is isotropic, we can rewrite equation 11.8 as follows.


    $$\begin{aligned}

    N(y_i\mid\mu_k,\Sigma_k) &= \frac{1}{(2\pi\sigma_k^2)^{d/2}}\exp\left[-\frac{1}{2\sigma_k^2}\sum_{d=1}^{D}(y_{i,d}-\mu_{k,d})^2\right]\\

    &= \prod_{d=1}^{D}\frac{1}{\sigma_k\sqrt{2\pi}}\exp\left[-\frac{1}{2\sigma_k^2}(y_{i,d}-\mu_{k,d})^2\right]

    \end{aligned} \tag{11.9}$$


    Let’s implement a Gaussian MDN using Keras/TensorFlow. We use synthetic data in
    our example with ground truth mean and covariance. We generate the data by sampling
    from a multivariate distribution. We then define the MDN multioutput architecture
    with constraints on mixing proportions and variance. Finally, we compute the negative
    log likelihood loss, train the model, and display the prediction results on test
    data. You may want to run the code listing in a Google Colab notebook (accessible
    at https://colab.research.google.com/) to understand the code step by step and
    accelerate model training via GPU.


