  md: '+   - The basic idea of the Metropolis-Hastings (MH) algorithm is to propose
    a move from the current state $x$ to a new state $x''$ based on a proposal distribution
    $q(x''|x)$ and then either accept or reject the proposed state according to MH
    ratio that ensures detailed balance is satisfied.

    +   - The idea of importance sampling is to draw samples in interesting regions
    (i.e., where both $p(x)$ and $|f(x)|$ are large). Importance sampling works by
    drawing samples from an easier-to-sample proposal distribution $q(x)$.'
