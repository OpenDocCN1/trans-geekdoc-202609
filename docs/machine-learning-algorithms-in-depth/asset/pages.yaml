  md: '(P, q, G, h, A, b). Let us convert our dual QP into this form. Let $P$ be a
    matrix such that the following is true.


    $$P_{ij}=y_i y_j\left[x_i^T x_j\right]$$  (5.15)


    Then, the optimization program becomes the following.


    $$\max_{\alpha}\sum_{i=1}^{n}\alpha_i-\frac{1}{2}\alpha^T P\alpha\quad\text{subject
    to}\quad \alpha_i\geq 0,\quad \sum_{i=1}^{n}\alpha_i y_i=0$$  (5.16)


    We can further modify the QP by multiplying the objective and the constraint by
    −1, which turns this into a minimization problem and reverses the inequality.
    In addition, we can convert the sum over alphas into a vector form by multiplying
    the alpha vector by an all-ones vector.


    $$\min_{\alpha}\frac{1}{2}\alpha^T P\alpha-\mathbf{1}^T\alpha\quad\text{subject
    to}\quad -\alpha_i\leq 0,\quad y^T\alpha=0$$  (5.17)


    We can now use CVXOPT to solve our SVM quadratic program. Let’s start by looking
    at the pseudo-code in figure 5.9.


    ```

    1: class SupportVectorMachine

