- pgno: 271
  md: 'and implement mixture density networks (MDNs). We will then focus on the concept
    of attention and implement a transformer architecture from scratch for a classification
    task. Finally, we’ll examine graph neural networks (GNNs) and use one to perform
    node classification for a citation graph. We will be using the Keras/TensorFlow
    deep learning library throughout this chapter.


    # 11.1 Autoencoders


    An *autoencoder* is an unsupervised neural network used for dimensionality reduction
    or feature extraction. They consist of an encoder followed by a hidden bottleneck
    layer followed by a decoder, where the encoder and decoder are both trainable
    neural networks, as shown in figure 11.1.


    ![](img/325742126d3ff007c6c385f4ffb5c3be_271_0.png)


    Figure 11.1 Autoencoder architecture, showing an encoder, a bottleneck layer,
    and a decoder


    Autoencoders are trained to reconstruct their input. In other words, an autoencoder
    output should match the input as closely as possible. To prevent the neural network
    from learning a trivial identity function, the hidden layer in the middle is constrained
    to be a narrow bottleneck. Autoencoder training minimizes the reconstruction error
    by ensuring the hidden units capture the most relevant information in the input
    data.


    In practice, autoencoders serve as feature extractors and do not lead to well-structured
    latent spaces. This is where VAEs come in (D. P. Kingma’s “Variational Inference
    and Deep Learning: A New Synthesis,” University of Amsterdam, 2017). A VAE also
    consists of an encoder and a decoder; however, instead of compressing its input
    image into a bottleneck layer, a VAE turns the image into parameters of statistical
    distribution (e.g., the mean and variance of a Gaussian random variable). The
    VAE'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'then draws a sample from this distribution and uses it to decode the sample
    back to its original input. Figure 11.2 shows the architecture of the VAE.


    ![](img/325742126d3ff007c6c385f4ffb5c3be_272_0.png)


    Figure 11.2 Variational autoencoder architecture, showing an encoder, a sampling
    layer, and a decoder


    VAE training imposes a structure on the latent space such that every point can
    be decoded to a valid output. The optimization objective of the variational autoencoder
    is the evidence lower bound (ELBO). Let x represent the input space and z the
    latent space. Let p(x|z) be the decoder distribution parameterized by θ that,
    conditioned on a sample z from the latent space, reconstructs the original input
    x. Similarly, let q(z|x) be the encoder distribution parameterized by φ that takes
    the input x and encodes it into latent variable z. Note that both theta and phi
    parameters are trainable. Finally, let p(z) be the prior distribution over the
    latent space. Since our goal for the variational posterior is to be as close as
    possible to the true posterior, the VAE is trained with the following loss function.


    $$\min_{\theta, \phi} \text{Loss}(x; \theta, \phi) = E_{q_\phi(z|x)}[\log p_\theta(x|z)]
    - D_{KL}\left(q_\phi(z|x) \| p_\theta(z)\right) \tag{11.1}$$


    The first term controls how well the VAE reconstructs a data point x from a sample
    z of the variational posterior, while the second term controls how close the variational
    posterior q(z|x) is to the prior p(z). If we assume the prior distribution p(z)
    is Gaussian, we can write the KL divergence term as follows. In the following
    section, we will examine how we can apply VAE to anomaly detection in time series.'
