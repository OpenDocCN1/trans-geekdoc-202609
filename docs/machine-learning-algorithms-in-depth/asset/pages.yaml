    Any point that lies on the same side as the normal θ is labeled +1, while any
    point on the opposite side is labeled −1. As a result, θ_x + θ_0 = 0 represents
    the decision boundary. Figure 5.2 illustrates these concepts in 2 dimensions.


    ![](img/325742126d3ff007c6c385f4ffb5c3be_95_0.png)


    ![](img/325742126d3ff007c6c385f4ffb5c3be_95_1.png)


