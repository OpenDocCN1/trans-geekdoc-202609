    # 6.3 Hierarchical Bayesian regression


    Hierarchical models enable the sharing of features among groups. The parameters
    of the model are assumed to be sampled from a common distribution that models
    similarity between groups. Figure 6.3 shows three scenarios that illustrate the
    benefit of hierarchical modeling. In the figure on the left, we have a single
    set of parameters θ that model the entire sequence of observations, referred to
    as a pooled model. Here, any variation in data is not modeled explicitly, since
    we are assuming a common set of parameters that give rise to the data. On the
    other hand, we have an unpooled model scenario, in which we model a different
    set of parameters for each observation. In the unpooled case, we assume there
    is no sharing of parameters between groups of observations and each parameter
    is independent. The hierarchical model combines the best of both worlds: it assumes
    there is a common distribution from which individual parameters are sampled and,
    therefore, captures similarities between groups.


    ![](img/325742126d3ff007c6c385f4ffb5c3be_131_0.png)


    Figure 6.3 Pooled, unpooled, and hierarchical graphical models


    In Bayesian hierarchical regression, we can assign priors on model parameters
    and use MCMC sampling to infer posterior distributions. We use the radon dataset
    to regress radon gas levels in houses of different counties, based on the floor
    number (in particular, whether or not there is a basement). Thus, our regression
    model looks like the following.


    α_c ~ N(μ_a, σ_a²)

    β_c ~ N(μ_β, σ_β²)

    radon_c = α_c + β_c × floor_{i,c} + ε_c  (6.10)'
