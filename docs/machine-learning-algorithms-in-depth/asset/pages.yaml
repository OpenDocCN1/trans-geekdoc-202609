  md: '# 9.1 Explain how latent Dirichlet allocation can be interpreted as nonnegative
    matrix factorization.


    Recall the term–document matrix $A_{vd}$, where $V$ is the vocabulary and $D$
    is the number of documents. Since we are interested in finding the number of topics
    $K$, LDA can be interpreted as a matrix factorization problem that takes the term–document
    matrix $A_{vd}$ and factorizes it into a product of topics $W_{vk}$ and topic
    proportions $H_{kd}$: $A = WH$. Since topics and topic proportions are probability
    distributions, the resulting matrices are constrained to be nonnegative:


    $$\min_{W \ge 0, H \ge 0} \|A - WH\|_F$$


    Therefore, LDA can be interpreted as nonnegative matrix factorization that can
    be solved using the alternating least squares (ALS) algorithm.


    # 9.2 Explain why sparsity is desirable in inferring general graph structure.


    Sparsity is a desirable property in graph structure inference because we want
    to be able to interpret our results. A fully connected graph does not provide
    much insight; therefore, we would like to adjust the threshold in the inverse
    covariance matrix estimator until we achieve a sparse graph structure we can draw
    meaningful conclusions from.


    # 9.3 List several NP-hard problems that can be approximated with the simulated
    annealing algorithm.


    Several applications of simulated annealing include the traveling salesman problem
    (TSP), maximum cut, independent set, and many others.


    # 9.4 Brainstorm problems that can be efficiently solved by applying a genetic
    algorithm.


    Some examples of problems that can be solved using genetic algorithms are the
    8 queens problem, the traveling salesman problem, the feature selection problem,
    neural network topology, and many others.


    # 10.1 Explain the purpose of nonlinearities in neural networks.


    The purpose of nonlinearities in neural networks is to model nonlinear relationships
    between the input and output of a network layer. Without nonlinearities, the neural
    network will behave as a single-layer perceptron.


    # 10.2 Explain the vanishing/exploding gradient problem.


    Exploding gradients occur when the gradients get larger and larger with every
    layer during backpropagation. The vanishing gradient problem occurs when the gradients
    approach zero during backpropagation.'
