    # 7.5.3 **Stacking**


    *Stacking* is an ensemble learning technique that combines multiple classification
    or regression models via a meta-classifier or meta-regressor. The base level models
    are trained based on complete training set, and then the meta-model is trained
    on the outputs of base-level model as features. The base level often consists
    of different learning algorithms; therefore, stacking ensembles are often heterogeneous.
    The algorithm in figure 7.17 summarizes stacking.


    ```

    ```text

    1:  Input: training data D = {xᵢ, yᵢ}ᵐᵢ₌₁

    2:  Output: ensemble classifier H

    3:  Step 1: learn base-level classifiers

    4:  for t = 1 to T do

    5:      learn hₜ based on D

    6:  end for

    7:  Step 2: construct new data set of predictions

    8:  for i = 1 to m do

    9:      Dₕ = {x′ᵢ, yᵢ}, where x′ᵢ = {h₁(xᵢ), …, hₜ(xᵢ)}

    10: end for

    11: Step 3: learn a meta-classifier

    12: learn H based on Dₕ

    13: return H

    ```

    ```


