    How do we measure the performance of this classifier? One way is to count the
    number of mistakes it makes compared to ground truth labels y. We can count the
    number of mistakes as follows.


    E_n(θ) = 1/n Σ_{i=1}^n [[y_i ≠ h(x_i;θ)]] = 1/n Σ_{i=1}^n [[y_i(θ·x_i + θ_0) ≤
    0]]  (5.2)


    Here, [[•]] is an indicator function, which is equal to 1 when the expression
    inside is true and 0 otherwise. Notice in equation 5.2, a mistake occurs whenever
    the label y_i ∈ [+1,−1] disagrees with the prediction of the classifier h(x_i;θ)
    ∈ [+1,−1] (i.e., their product is negative).


    Another way to measure the performance of a binary classifier is via a confusion
    matrix.


    |          | Actual |      |

    |----------|--------|------|

    |          | y = 1  | y = 0|

    | Predicted|        |      |

    | ŷ = 1    | TP     | FP   |

    | ŷ = 0    | FN     | TN   |


    Figure 5.3 shows the table of errors called the confusion matrix. The prediction
