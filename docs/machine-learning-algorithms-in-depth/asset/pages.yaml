  md: '# 7.6 ML research: Supervised learning algorithms


    In this section, we cover additional insights and research related to the topics
    presented earlier in the chapter. In the classification section, we derived several
    classic algorithms and built a solid foundation for the design of new algorithms.
    For the perceptron algorithm, we saw how we can modularize the algorithm by introducing
    different loss functions, leading to slightly different update rules. Moreover,
    the loss function itself can be weighted to account for imbalanced datasets. Similarly,
    in the case of SVM, we have the flexibility of choosing the appropriate kernel
    function. We looked at multiclass SVM; however, a one-class SVM with an RBF kernel
    can be used for anomaly detection.


    There are several extensions to solvers other than SGD for logistic regression,
    including liblinear (which uses coordinate descent), newton-cg (a second-order
    method that can lead to faster convergence), and LBFGS (a powerful optimization
    framework that is both memory and computation efficient). Similarly, there are
    several extensions to the Naive Bayes algorithm based on the type of data it models,
    such as multinomial naive Bayes and Gaussian naive Bayes. The derivations for
    these are very similar to the Bernoulli naive Bayes, which we looked at in detail.


    In the section on regression, we had our first encounter with a nonparametric
    model—namely, the KNN regressor. We will explore this rich set of models in chapter
    8, when we discuss Bayesian nonparametric models in which the number of parameters
    grows with data. For example, in the Dirichlet process (DP) HMM, we have a potentially
    infinite number of states, with probability mass concentrated on the few states
    supported by the data (e.g., see Emily B. Fox et al.’s “A Sticky HDP-HMM with
    Application to Speaker Diarization,” Annals of Applied Statistics, 2011).


    We observed the advantages of using hierarchical models. This technique can be
    used whenever different data groups have characteristics in common, which allows
    the sharing of statistical strength from the different data groups. Hierarchical
    models often provide greater accuracy with fewer observations, such as hierarchical
    HMM and hierarchical Dirichlet process mixture models (e.g., see Jason Chang and
    John W. Fisher III’s “Parallel Sampling of HDPs using Sub-Cluster Splits,” Conference
    and Workshop on Neural Information Processing Systems, 2014).


    We touched on scalable ML when we discussed page rank, due to computations on
    millions of web pages. Scalable ML is an important area of research. In the industry,
    Spark ML is typically used to process big data. However, to understand how parallelizable
    algorithms are constructed, it helps to implement them from scratch. For more
    information about scalable algorithms, the reader is encouraged to read Scaling
    Up Machine Learning: Parallel and Distributed Approaches by Ron Bekkerman, Mikhail
    Bilenko, and John Langford (2011).


    There are several generalizations of HMMs. One example is a semi-Markov HMM, which
    models state transitions of variable duration commonly found in genomics data.
    Another example is a hierarchical HMM, which models data with a hierarchical structure
    often present in speech applications. Finally, there are factorial HMMs,'
