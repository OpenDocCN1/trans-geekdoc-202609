    # Figure 9.8 Simulated annealing pseudo-code


    The simulated_annealing class contains the main run function. We begin by initializing
    the annealing temperature T and evaluating our target function at the initial
    location. Recall that we are interested in finding a minimum point in a complex
    energy landscape represented by the target function. We sample from our proposal
    distribution to obtain a new set of coordinates and evaluate the energy of the
    proposed coordinates. We check for convergence to decide whether to break out
    of the loop or continue. Next, we compute the simulated annealing transition probability
    alpha as a difference between old and new energy states divided by the temperature
    T. In the case of r > 1, we accept the low energy state with a probability of
    1, and in the case of 0 < r < 1 (i.e., the energy of the new state is higher),
    we accept the transition with probability r = α. Finally, we adjust the temperature
    according to a cooling schedule, and upon convergence, we return the optimal coordinates
    (those that achieve the minimum energy found by simulated annealing). We are now
