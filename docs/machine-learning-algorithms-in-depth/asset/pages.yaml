    # Summary


    +   - Markov chain Monte Carlo (MCMC) is a methodology of sampling from high dimensional
    parameter spaces to approximate the posterior distribution $p(\theta|x)$.

    +   - Monte Carlo (MC) integration has an advantage over numerical integration
    (which evaluates a function at a fixed grid of points), in that the function is
    only evaluated in places where there is a nonnegligible probability.

    +   - In a binomial tree model of a stock price, we assume that at each time step,
    the stock could be in either up or down states with unequal payoffs characteristic
    of a risky asset.

    +   - Self-avoiding random walks are simply random walks that do not cross themselves.
    We can use Monte Carlo integration to simulate a self-avoiding random walk.

    +   - Gibbs sampling is based on the idea of sampling one variable at a time from
    a multidimensional distribution conditioned on the latest samples from all the
    other variables.'
