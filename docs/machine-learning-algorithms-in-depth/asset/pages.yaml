  md: '# 10.2.1 LeNet on MNIST


    In this section, we will study the classic LeNet architecture (Yann LeCun et al.’s
    “Gradient-Based Learning Applied to Document Recognition,” Proceedings of the
    IEEE, 1998) developed by Yann LeCun for handwritten digit classification trained
    on the MNIST dataset. It follows the design pattern of a convolutional layer,
    followed by ReLU activation, followed by max-pooling operation, as shown in figure
    10.4.


    ![](img/325742126d3ff007c6c385f4ffb5c3be_246_0.png)


    Figure 10.4 LeNet architecture for MNIST digits classification


    This sequence is stacked, and the number of filters is increased as we go from
    the input to the output of the CNN. Notice, that we are both learning more features
    by increasing the number of filters and reducing the feature map dimensions through
    the max-pooling operations. In the last layer, we flatten the feature map and
    add a dense layer followed by a softmax classifier.


    In the following code listing, we start off by loading the MNIST dataset and reshaping
    the images to the correct image size. We define our training parameters and model
    parameters, followed by the definition of CNN architecture. Notice a sequence
    of convolutional, ReLU, and max-pooling operations. We compile the model and define
    a set of callback functions that will be executed during model training. We record
    the training history and evaluate the model on the test dataset. Finally, we save
    the prediction results and generate accuracy and loss plots. We are now ready
    to implement a simple MNIST CNN architecture from scratch using Keras/TensorFlow!


