  md: "RNNs use a hidden layer that incorporates the current input $x_t$ and prior\
    \ state $h_{t-1}$.\n\n$$h_t = f(W_{hh}h_{t-1} + W_{xh}x_t + b_h)$$  \n(10.10)\n\
    \nHere, $W_{hh}$ are the hidden-to-hidden weights, $W_{xh}$ are the input-to-hidden\
    \ weights, and $b_h$ is the bias term. Optionally, the outputs $y_t$ can be produced\
    \ at every step.\n\n$$y_t = g(W_{hy}h_t + b_y)$$  \n(10.11)\n\nThe overall architecture\
    \ is captured in figure 10.8. Let’s look at a few applications of RNNs in the\
    \ next subsection.\n\n![](img/325742126d3ff007c6c385f4ffb5c3be_253_0.png)\n\n\
    Figure 10.8  LSTM recurrent neural network architecture\n\n# 10.3.1  LSTM sequence\
    \ classification\n\nIn this section, our goal is to determine the sentiment of\
    \ IMDb movie reviews. We start by tokenizing each word in the review and converting\
    \ it into a vector via a trainable embedding layer. The sequence of word vectors\
    \ forms the input to a forward LSTM model, which encodes the sequence into a vector.\
    \ In parallel, we input our sequence into a backward LSTM model and concatenate\
    \ its vector output with the forward model to produce a latent representation\
    \ of the movie review.\n\n$$h_t^{\\rightarrow} = f(W_{hh}^{\\rightarrow}h_{t-1}^{\\\
    rightarrow} + W_{xh}^{\\rightarrow}x_t + b_h^{\\rightarrow})$$\n$$h_t^{\\leftarrow}\
    \ = f(W_{hh}^{\\leftarrow}h_{t-1}^{\\leftarrow} + W_{xh}^{\\leftarrow}x_t + b_h^{\\\
    leftarrow})$$\n$$h_t = [h_t^{\\rightarrow}, h_t^{\\leftarrow}]$$  \n(10.12)\n\n\
    Here, $h_t$ takes into account information from the past and the future. Combined,\
    \ the two LSTMs are known as bidirectional LSTM and process input data as if time\
    \ is running forward and backward. Figure 10.9 shows the architecture of bidirectional\
    \ RNN.\n\nHaving encoded our review into a vector, we average several dense layers\
    \ with 12 regularization and dropout to classify the sentiment as positive or\
