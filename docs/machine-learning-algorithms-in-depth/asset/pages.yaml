    ![](img/325742126d3ff007c6c385f4ffb5c3be_156_0.png)


    **Figure 7.6** Tomek links algorithm showing a number of removed samples at the
    classification boundary


    # 7.2.2 Oversampling strategies


    Oversampling methods append data to the minority class of the original dataset,
    as shown in figure 7.7. *Random oversampling* simply adds data points to the minority
    class uniformly at random. The *synthetic minority oversampling technique* (SMOTE)
    generates synthetic examples by finding *K*-nearest neighbors in the feature space
    and generating a new data point along the line segments joining any of the *K*-minority
    class nearest neighbors. Synthetic samples are generated in the following way:
    take the difference between the feature vector (sample) under consideration and
    its nearest neighbor, multiply this difference by a random number between 0 and
    1, and add it to the feature vector under consideration, augmenting the dataset
    with a new data point.


    ![](img/325742126d3ff007c6c385f4ffb5c3be_156_1.png)


    **Figure 7.7** Oversampling strategies'
