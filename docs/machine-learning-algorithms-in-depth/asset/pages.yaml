    Figure 11.10

    Transformer architecture


    The idea of self-attention can be expanded to multihead attention. In essence,
    we run the attention mechanism in parallel and form several output heads, as shown
    in figure 11.11. The heads are then concatenated and transformed using a dense
    layer. With multihead attention, the model has multiple independent ways to understand
    the input.


    For the model to make use of the order of the sequence, we need to inject some
    information about the position of tokens in the sequence. This is precisely the
    purpose of positional encodings that get added to the input embeddings at the
    bottom of the encoder and decoder stacks. The positional encodings have the same
    dimensions as the embeddings so that the two can be summed. Thus,


    ![](img/325742126d3ff007c6c385f4ffb5c3be_288_1.png)


    Figure 11.11  Multihead attention'
