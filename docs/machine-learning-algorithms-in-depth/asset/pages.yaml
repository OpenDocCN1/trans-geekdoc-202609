    Regression algorithms help us predict continuous quantities. Based on the nature
    of data (e.g., linear versus nonlinear relationship between the variables), we
    can choose either a linear algorithm, such as a Bayesian linear regression or
    nonlinear KNN regression. We may benefit from a hierarchical model in which certain
    features are shared among the population. Also, in the case of predicting functional
    relationships between variables, Gaussian process regression provides the answer
    to do so. In the following chapter, we will discuss more advanced supervised learning
    algorithms.


