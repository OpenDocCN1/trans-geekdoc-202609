  md: "# ## 8.1 Dirichlet process *K*-means\n\nDirichlet process (DP) *K*-means is\
    \ a Bayesian nonparametric extension of the *K*-Means algorithm. *K*-means is\
    \ a clustering algorithm that can be applied, for instance, to customer segmentation,\
    \ where customers are grouped by purchase history, interests, and geographical\
    \ location. DP-means is similar to *K*-means except that new clusters are created\
    \ whenever a data point is sufficiently far away from all existing cluster centroids;\
    \ therefore, the number of clusters grows with the data. DP-means converges to\
    \ a local optimum of a *K*-means-like objective that includes a penalty for the\
    \ number of clusters.\n\nWe select the cluster *K* based on the smallest value\
    \ of the following equation.\n\n$$\\underset{k}{\\arg\\min}\\{\\|x_i-\\mu_1\\\
    |^2,\\ldots,\\|x_i-\\mu_k\\|^2,\\lambda\\} \\tag{8.1}$$\n\nThe resulting update\
    \ is analogous to the *K*-means reassignment step, during which we reassign a\
    \ point to the cluster corresponding to the closest mean or start a new cluster\
    \ if the squared Euclidean distance is greater than $\\lambda$. The DP means algorithm\
    \ is summarized in figure 8.1.\n\n```\n1: Init. $K = 1$, $l_1 = \\{x_1,\\ldots,x_n\\\
    }$ and $\\mu_1$ the global mean\n2: Init. labels $z_i = 1$ for all $i = 1,\\ldots,n$\n\
    3: Init. $\\lambda = \\text{kpp\\_init}(X, K_{\\text{init}})$\n4: Repeat until\
    \ convergence:\n5: &nbsp;&nbsp;&nbsp;&nbsp;for each $x_i$:\n6: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;compute\
    \ $d_{ic} = \\|x_i - \\mu_c\\|^2$ for $c = 1,\\ldots,K$\n7: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;if\
    \ $\\min_c d_{ic} > \\lambda$, set $K = K + 1$ and $\\mu_k = x_i$\n8: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;otherwise,\
    \ set $z_i = \\arg\\min_c d_{ic}$\n9: &nbsp;&nbsp;&nbsp;&nbsp;for each cluster\
    \ $l_j = \\{x_i|z_i = j\\}$, compute $\\mu_j = \\frac{1}{|l_j|}\\sum_{x\\in l_j}x$\n\
    10: &nbsp;&nbsp;&nbsp;&nbsp;Compute the objective: $\\sum_{c=1}^{K}\\sum_{x\\\
