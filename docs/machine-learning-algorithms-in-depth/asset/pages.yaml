  md: "# 3.3 Image denoising in an Ising model\n\nThe Ising model is an example of\
    \ a Markov random field (MRF) and has its origins in statistical physics. A Markov\
    \ random field is a set of random variables with a Markov property described by\
    \ an undirected graph, in which the nodes represent random variables and the edges\
    \ encode conditional independence. The Ising model assumes we have a grid of nodes,\
    \ where each node can be in one of two possible states. The state of each node\
    \ depends on the neighboring nodes through interaction potentials. In the case\
    \ of images, this translates to a smoothness constraint (i.e., a pixel prefers\
    \ to be of the same color as the neighboring pixels). In the image denoising problem,\
    \ we assume we have a 2D grid of noisy pixel observations of an underlying true\
    \ image and we would like to recover the true image.\n\nLet y_i be noisy observations\
    \ of binary latent variables x_i ∈ {−1, +1}. We can write down the joint distribution\
    \ as follows.\n\np(x, y) = p(x)p(y|x) = ∏_{(s,t)∈E} Ψ_{st}(x_s, x_t) ∏_{i=1}^n\
    \ p(y_i|x_i)\n= ∏_{(s,t)∈E} exp{x_s w_{st} x_t} ∏_{i=1}^n N(y_i|x_i, σ²)  (3.14)\n\
    \nIn equation 3.14, the interaction potentials are represented by Ψ_{st} for every\
    \ pair of nodes x_s and x_t in a set of edges E, and the observations y_i are\
    \ Gaussian with mean x_i and variance σ². Here, w_{st} is the coupling strength\
    \ and assumed to be constant and equal to J > 0, indicating a preference for the\
    \ same state as neighbors (i.e., the potential Ψ(x_s, x_t) = exp|x_s J x_t| is\
    \ higher when x_s and x_t are both either +1 or −1).\n\nTo fit the model parameters\
    \ using variational inference, we first need to maximize the ELBO.\n\nELBO = E_{q(x)}[log\
    \ p(x, y)] − E_{q(x)}[log q(x)]\n= E_{q(x)}[∑_{(s,t)∈E} x_s w_{st} x_t + ∑_{i=1}^n\
    \ log N(x_i; σ²)]\n  − ∑_{i=1}^n E_{q_i(x)}[log q_i(x)]  (3.15)\n\nHere, we are\
    \ using the mean-field assumption of a fully factored approximation q(x).\n\n\
    q(x) = ∏_{i=1}^n q(x_i; μ_i)  (3.16)"
