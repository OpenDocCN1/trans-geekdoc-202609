    # 6.5 Gaussian process regression


    Gaussian processes (GPs) define a prior over functions that can be updated to
    a posterior once we have observed data (see C. E. Rasmussen and C. K. I. Williams''s,
    Gaussian Processes for Machine Learning, The MIT Press, 2006). In a supervised
    setting, the function gives a mapping between the data points x_i and the target
    value y_i: y_i = f(x_i). Gaussian processes infer a distribution over functions
    given the data p(f|x, y) and then use it to make predictions given new data. A
    GP assumes that the function is defined at a finite and arbitrary chosen set of
    points x_1, ..., x_n, such that p(f(x_1), ..., f(x_n)) is jointly Gaussian with
    mean μ(x) and covariance Σ(x), where Σ_ij = κ(x_i, x_j) and κ is a positive definite
    kernel function. One example that can be solved by Gaussian Process regression
    is predicting the CO₂ level based on observed measurements. In code listing 6.4,
    we will assume a sinusoidal model and a radial basis function kernel.


    Consider a simple regression problem.


    $f(x) = x^T w \quad y = f(x) + \epsilon \quad \epsilon \sim N\left(0, \sigma_n^2\right)$

    (6.12)


    Assuming independent and identically distributed noise, we can write down the
    following likelihood function.


    $p(y|X, w) = \prod_{i=1}^n p(y_i|x_i, w) = \prod_{i=1}^n \frac{1}{\sqrt{2\pi}\sigma_n}
    \exp\left\{ -\frac{(y_i - x_i^T w)^2}{2\sigma_n^2} \right\}$

    $\sim N\left(Xw, \sigma_n^2 I\right)$

    (6.13)


    In the Bayesian framework, we need to specify a prior over the parameters: w ~
    N(0, Σ_p). Writing only the terms of the likelihood and the prior, which depend
    on the weights, we get the following equation.


    $p(w|X, y) \propto \exp\left\{ -\frac{1}{2\sigma_n^2} \|y - Xw\|^2 \right\} \exp\left\{
    -\frac{1}{2} w^T \Sigma_p^{-1} w \right\}$

    $\propto \exp\left\{ -\frac{1}{2} (w - \tilde{w}) \left( \frac{1}{\sigma_n^2}
    X X^T + \Sigma_p^{-1} \right) (w - \tilde{w}) \right\}$

    $\sim N\left( \frac{1}{\sigma_n^2} A^{-1} X y, A^{-1} \right)$

    (6.14)'
