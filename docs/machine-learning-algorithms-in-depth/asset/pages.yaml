  md: 'Let’s now look at how we can decode the maximum likelihood sequence of transitions
    between the latent state variables $z_t$. In other words, we would like to find
    the following.


    $z^* = \arg\max_{z_{1:T}} p(z_{1:T} | x_{1:T}) \quad (7.21)$


    Let $\delta_t(j)$ be the probability of ending up in state $j$ given the most
    probable path sequence $z_{1:t-1}^*$.


    $\delta_t(j) = \max_{z_1,\dots,z_{t-1}} p(z_t = j, z_{1:t-1} | x_{1:t}) \quad
    (7.22)$


    We can represent it recursively as the following.


    $\delta_t(j) = \max_i \delta_{t-1}(i) A(i,j) E_t(j) \quad (7.23)$


    This algorithm is known as the Viterbi algorithm. Let’s summarize what we studied
    so far in the pseudo-code in figure 7.4.


    ```

    1: class HMM

    2: function forward_backward:

    3: for t = 1 to n:

    4:   α_t = normalize(E_t A^T α_{t-1})

    5: end for

    6: for t = n - 1 to 1:

    7:   β_t = normalize(A (E_t β_{t+1}))

    8: end for

    9: γ = α · β

    10: return γ, α, β

    11: function viterbi:

    12: for t = 1 to n:

    13:   δ_t[j] = max_i (δ_{t-1}[i] A[i,j] E_t[j])

    14: end for

    ```


    Figure 7.4 Hidden Markov model pseudo-code


    We have two main functions: forward_backward and viterbi. In the forward_backward
    function, we construct a sparse matrix X of emission indicators and compute the
    forward probabilities α, normalizing in every iteration. Similarly, we compute
    the backward probabilities β as previously derived. Finally, we compute the marginal
    probabilities γ by multiplying α and β. In the viterbi function, we apply the
    log scale for numerical stability and replace multiplication with addition, computing
    the expression for δ as derived earlier. We are now ready to implement the inference
    of the HMM from scratch!'
