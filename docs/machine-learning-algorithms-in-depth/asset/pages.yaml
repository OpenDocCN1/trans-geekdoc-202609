    # 9.4  Simulated annealing


    *Simulated annealing (SA)* is a heuristic search method that allows for occasional
    transitions to less favorable states to escape local optima. We can formulate
    SA as an energy minimization problem with temperature parameter *T* as follows.


    $$\alpha = \exp\left\{\frac{E_{old}-E_{new}}{T}\right\}$$


    $$p = \min(1,\alpha) \tag{9.19}$$


    As we transition to a new state, we would like the energy in the new state to
    be lower—in which case, α > 1 and p = 1—meaning we accept the state transition
    with the probability p = 1. On the other hand, if the energy of the new state
    is higher, this will cause α < 1, and in that case, we accept the transition with
    probability p = α. In other words, we accept unfavorable transitions with probability
    proportional to the difference in energies between states and inversely proportional
    to the temperature parameter T. Initially, the temperature T is high, allowing
    for many random transitions. As the temperature decreases (according to a cooling
    schedule), the difference in energy becomes more pronounced. The formulation in
    equation 9.19 allows simulated annealing to escape local optima. We are now ready
    to look at the pseudo-code in figure 9.8.'
