  md: 'For the stationary distribution π (i.e., page rank) to exist, we need to guarantee
    that the Markov chain described by the transition matrix is recurrent and aperiodic.
    Let’s look at how we can construct such transition matrix. Let’s model the interaction
    with web pages as follows. If we have outgoing links for a specific page, then
    with probability p > 0.5 (p can be chosen using a simulation), we jump to one
    of the outgoing links (decided uniformly at random), and with probability 1−p,
    we open a new page (also uniformly at random). If there are no outgoing links,
    we open a new page (decided uniformly at random). These two conditions ensure
    the Markov chain is recurrent and aperiodic, since random jumps can include self-transitions;
    thus, every state is reachable from every other state. Let G_ij be the adjacency
    matrix and d_j = Σ_i G_ij represent the out-degree of page j. Then, if the out-degree
    is 0, we jump to a random page with probability 1/n. With probability p we follow
    a link with probability equal to the out-degree 1/d_j, and with probability 1−p,
    we jump to a random page. Let’s summarize our transition matrix in the following
    equation.


    ```

    $$A_{ij} = \begin{cases} \frac{p G_{ij}}{d_j} + \frac{1-p}{n} & \text{if } d_j
    \neq 0 \\ \frac{1}{n} & \text{if } d_j = 0 \end{cases}\tag{7.9}$$

    ```


    However, how do we find the eigenvector π given the enormous size of our transition
    matrix A? We will use an iterative algorithm called the power method for computing
    the page rank. Let v0 be an arbitrary vector in the range of A—we can initialize
    v0 at random. Consider now repeatedly multiplying v by A and renormalizing v.


    ```

    $$\begin{aligned} v_t &= A v_{t-1} \\ v_t &= \frac{v_t}{\|v_t\|} \\ \lambda &=
    v_t^T A v_t \end{aligned}\tag{7.10}$$

    ```


    If we repeat this algorithm until convergence ($\|v_t\| \approx \|v_{t-1}\|$)
    or until the maximum number of iterations T is reached, we get our stationary
    distribution π = v_T. The reason this works is that we can write out our matrix
    A = U Λ U^T. Then, we get the following equation.


    ```

    $$\begin{aligned} v_t &= A v_{t-1} = A^t v_0 = (U \Lambda U^T)^t v_0 = U (\Lambda^t
    U^T v_0) \\ &= a_1 \lambda_1^t u_1 + a_2 \lambda_2^t u_2 + \cdots + a_n \lambda_n^t
    u_n \\ &= \lambda_1^t \left(a_1 u_1 + a_2 \left(\frac{\lambda_2}{\lambda_1}\right)^t
    u_2 + \cdots + a_n \left(\frac{\lambda_n}{\lambda_1}\right)^t u_n\right) \\ &\to
    \lambda_1^t a_1 u_1 \end{aligned}\tag{7.11}$$

    ```'
