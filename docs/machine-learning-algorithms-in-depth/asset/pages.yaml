    # 10.3 Recurrent neural nets


    Recurrent neural nets (RNNs) are designed to process sequential data. RNNs maintain
    an internal state of the past and provide a natural way to encode a sequence (Seq)
    into a vector (Vec), and vice versa. Application of RNNs range from language generation
    (Vec2Seq) to sequence classification (Seq2Vec) to sequence translation (Seq2Seq).
    In this section, we’ll focus on sequence classification using bidirectional LSTM
    and sequence similarity using pretrained word embeddings.'
