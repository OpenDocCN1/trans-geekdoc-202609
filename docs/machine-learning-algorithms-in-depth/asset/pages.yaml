  md: '$$ G = \frac{2}{5} G_{left} + \frac{3}{5} G_{right} = \frac{2}{5} \times 0
    + \frac{3}{5} \times \left(1 - \frac{2^2}{3} - \frac{1^2}{3}\right) = 0.27 \tag{5.46}
    $$


    Here, $G_{left}$ is the Gini index of $\{x_i, y_i: x_{ij} \le 2\}$ and is equal
    to zero, since both class labels are equal to 1 (i.e., a pure leaf cluster) and
    $G_{right}$ is the Gini index of $\{x_i, y_i: x_{ij} > 2\}$ and contains a mix
    of class labels $y_{right} = [2,2,3]$.


    The key to CART algorithm is finding the optimal feature and threshold such that
    the cost (e.g., Gini index) is minimized. During training, we’ll need to iterate
    through every feature one by one and compute the Gini cost for all possible thresholds
    for that feature. But how do we compute $\tau_j$ a set of all possible thresholds
    for feature $j$? We can sort the training data $X[:, j]$ in $O(\log n)$ time and
    consider all midpoints between two adjacent data values. Next, we’ll need to compute
    the Gini index for each threshold that can be done as shown in equation 5.47.
    Let $m$ be the size of the node and $m_k$ be the number of points in the node
    that belong to class $k$.


    $$ G = 1 - \sum_{k=1}^{K} \pi_k^2 = 1 - \sum_{k=1}^{k} \left(\frac{m_k}{m}\right)^2
    \tag{5.47} $$


    We can iterate through the sorted thresholds $\tau_j$ in $O(n)$ time and compute
    the Gini index that would result in applying that threshold in each iteration.
    For $i$-th threshold, we get the following.


    $$ G_i = \frac{i}{m} G_i^{left} + \frac{m - i}{m} G_i^{right} $$


    $$ G_i^{left} = 1 - \sum_{k} \left(\frac{m_k^{left}}{i}\right)^2 $$


    $$ G_i^{right} = 1 - \sum_{k} \left(\frac{m_k^{right}}{m - i}\right)^2 \tag{5.48}
    $$


    Having found the optimum feature and threshold, we split each node recursively
    until the maximum depth is reached. Once we’ve constructed a tree during training,
    given test data, we simply traverse the tree from root to leaf, which stores our
    class label. We can summarize the CART algorithm in the pseudo-code in figure
    5.14.


    As we can see from the definition of TreeNode, it stores the predicted class label,
    id of the feature to split on and the best threshold to split on, pointers to
    the left and right subtrees, as well as the Gini cost and size of the node. We
    can grow the decision tree recursively by calling the grow_tree function, as long
    as the depth of the tree is less than the maximum depth determined ahead of time.
