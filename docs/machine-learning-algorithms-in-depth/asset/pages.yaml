  md: 'a multi-input model for sequence similarity. We’ll then discuss different optimization
    algorithms used for training neural networks and conduct a comparative study.
    We will be using the Keras/TensorFlow deep learning library throughout this chapter.


    # 10.1 Multilayer perceptron


    Multilayer perceptron (MLP) is commonly used for classification and regression
    prediction tasks. An MLP consists of multiple densely connected layers that perform
    the following linear (affine) operation.


    $$f(x;\theta)=Wx+b \tag{10.1}$$


    Here, $x$ is the input vector, $W$ is the weight matrix, and $b$ is the bias term.
    While the linearity of the operation makes it easy to compute, it is limiting
    when it comes to stacking multiple layers. Introducing nonlinearity between layers
    via activation functions enables the model to have greater expressive power. One
    common nonlinearity is ReLU, defined as follows.


    $$\operatorname{ReLU}(x)=\max(0,x) \tag{10.2}$$


    We can define MLP with $L$ layers as a composition of $f_l(x;\theta)=\operatorname{ReLU}(W_lx+b_l)$
    functions as follows.


    $$\operatorname{MLP}(x;\theta)=f_L\bigl(f_{L-1}(\cdots(f_1(x;\theta_1))\cdots)\bigr)
    \tag{10.3}$$


    The activation of the last layer function $f_L$ will depend on the task at hand:
    softmax for classification or identity for regression. The softmax activation
    computes class probabilities that sum to 1, based on real-valued input. It is
    defined as follows.


    $$\operatorname{softmax}(x)=\frac{e^x}{\sum_{i=1}^{K}e^{x_i}} \tag{10.4}$$


    Here, $K$ is the number of classes. Figure 10.1 shows an MLP architecture.


    ![](img/325742126d3ff007c6c385f4ffb5c3be_240_0.png)'
