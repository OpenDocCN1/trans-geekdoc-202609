    # 2.1.2  Markov chain for page rank


    Before we dive into MCMC algorithms, we need to introduce the concept of a Markov
    chain. A *Markov chain* is a sequence of possible events, in which the probability
    of the current event depends only on the previous event. A first-order Markov
    chain can be written as shown in equation 2.6. Let $x_1,\ldots,x_t$ be the samples
    from our posterior distribution; then, we can write the joint as follows.


    $$p(x_1,\ldots,x_t)=p(x_1)p(x_2\mid x_1)p(x_3\mid x_2)\cdots p(x_t\mid x_{t-1})$$


    $$=p(x_1)\prod_{i=2}^{t}p(x_i\mid x_{i-1}) \tag{2.6}$$


    Notice how the joint factors as a product of conditional distributions, where
    the current state is conditioned only on the previous state. A Markov chain is
    characterized by the initial distribution over the states $p(x_1=i)$ and a state
    transition matrix $A_{ij}=p(x_t=j\mid x_{t-1}=i)$ from state $i$ to state $j$.


    Let’s motivate Markov chains via a Google page rank example. Google uses a page
    rank algorithm to rank billions of web pages. We can formulate a collection of
    $n$ web pages as a graph $G=(V,E)$. Let every node $v\in V$ represent a web page
    and every edge $e\in E$ represent a link from one page to another. Knowing how
    the pages are linked allows us to construct a giant, sparse transition matrix
    $A$, where $A_{ij}$ is the probability of following a link from page $i$ to page
    $j$, as shown in figure 2.3.


    ![](img/325742126d3ff007c6c385f4ffb5c3be_38_0.png)


    Note that every row in the matrix $A$ sums to 1 (i.e., $\sum_j A_{ij}=1$). A matrix
    with this property is known as a *stochastic matrix*. Note that $A_{ij}$ corresponds
