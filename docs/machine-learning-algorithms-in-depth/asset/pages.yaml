    # ## 8.3 Dimensionality reduction


    It is often useful to project high-dimensional data $x \in \mathbb{R}^{D}$ onto
    lower-dimensional subspace $z \in \mathbb{R}^{L}$ in a way that preserves the
    unique characteristics of the data. In other words, it is desirable to capture
    the essence of the data in the low dimensional projection. For example, if you
    were to train word embeddings on the Wikipedia corpus and you were trying to understand
    the relationships between different word vectors, it would be much easier to visualize
    the relationships in two dimensions by means of dimensionality reduction. In this
    section, we will examine two ML techniques for dimensionality reduction: principal
    component analysis (PCA) and t-SNE.


    # ### 8.3.1 Principal component analysis


    In principal component analysis (PCA), we would like to project our data vector
    $x \in \mathbb{R}^{D}$ onto a lower dimensional vector $z \in \mathbb{R}^{L}$
    with $L < D$ such that the variance of the projected data is maximized. Maximizing
    the variance of the projected data is the core principle of PCA, and it allows
    us to preserve the unique characteristics of our data. We can measure the quality
    of our projection as a reconstruction error.


    $$E = \frac{1}{N}\sum_{i=1}^{N}\lVert x_i - \hat{x}_i \rVert^2 = \lVert X - WZ
    \rVert_F^2 \tag{8.20}$$


    Here, $\hat{x}_i$ of size $D \times 1$ is the reconstructed vector lifted to the
    higher dimensional space, $z_i$ of size $L \times 1$ is the lower dimensional
    principal component vector, and $W$ is an orthonormal matrix of size $D \times
    L$. Recall that an orthonormal matrix is a real square matrix whose transpose
    is equal to its inverse (i.e., $W^T W = W W^T = I$). In other words, if our PCA
    projection is $z_i = W^T x_i$, then $\hat{x}_i = W z_i$. We will show that the
    optimal projection matrix $W$ (one that maximizes the variance of projected data)
    is equal to a matrix of $L$ eigenvectors corresponding to the largest eigenvalues
    of the empirical covariance matrix $\hat{\Sigma} = \frac{1}{N}\sum x_i x_i^T$.


    We can write down the variance of the projected data as follows.


    $$\frac{1}{N}\sum_{i=1}^{N} z_i^2 = \frac{1}{N}\sum_{i=1}^{N} w^T x_i x_i^T w
    = w^T \hat{\Sigma} w \tag{8.21}$$


    We would like to maximize this quantity subject to orthonormal constraint (i.e.,
    $\lVert w \rVert^2 = 1$). We can write down the Lagrangian as follows.


    $$\max J(w) = w^T \hat{\Sigma} w + \lambda\left(w^T w - 1\right) \tag{8.22}$$'
