  md: '# 4.3 Use Jensen’s inequality with $f(x)=\log(x)$ to prove the AM $\ge$ GM
    inequality.


    Since $f(x)=\log(x)$ is a concave function, we can write the Jensen’s inequality
    as follows:


    $f(E[x]) \ge E[f(x)]$

    $\log(E[x]) \ge E[\log(x)]$

    $\log\left(\frac{x_1+\cdots+x_n}{n}\right) \ge \frac{\log x_1+\cdots+\log x_n}{n}$

    $\log\left(\frac{x_1+\cdots+x_n}{n}\right) \ge \log(x_1\times\cdots\times x_n)^{1/n}$

    $AM \ge GM$


    # 4.4 Prove that $I(X;Y)=H(X)-H(X|Y)=H(Y)-H(Y|X)$.


    By the definition of mutual information, we have the following:


    $I(X;Y)=\sum_x\sum_y p(x,y)\log\frac{p(x,y)}{p(x)p(y)}$

    $=E_{p(x,y)}\left[\log\frac{p(x|y)}{p(x)}\right]=E_{p(x,y)}\left[\log\frac{p(y|x)}{p(y)}\right]$

    $=H(X)-H(X|Y)$

    $=H(Y)-H(Y|X)$


    # 5.1 Given a data point $y\in\mathbb{R}^d$ and a hyperplane $\theta\cdot x+\theta_0=0$,
    compute the Euclidean distance from the point to the hyperplane.


    Let $x$ be a point on the hyperplane—in other words, ensure it satisfies the equation
    $\theta\cdot x+\theta_0=0$. To find the Euclidean distance from the point to the
    hyperplane, we construct a vector $y-x$ and project it onto the unique vector
    perpendicular to the plane. Thus, we have the following:


    $d=\|\operatorname{proj}_\theta(y-x)\|$

    $=\left\|\frac{(y-x)\cdot\theta}{\theta\cdot\theta}\theta\right\|=\left|y\cdot\theta-x\cdot\theta\right|\frac{\|\theta\|}{\|\theta\|^2}$

    $=\frac{|y\cdot\theta-x\cdot\theta|}{\|\theta\|}=\frac{|y\cdot\theta+\theta_0|}{\|\theta\|}$


    # 5.2 Given a primal linear program (LP) $\min c^T x$ subject to $Ax<=b$, $x>=0$,
    write down the dual version of the LP.


    Each variable in the primal LP corresponds to a constraint in the dual LP, and
    vice versa. The primal is a minimization problem, so the dual is a maximization
    problem. The primal constraints are less than or equal, so the dual variables
    are greater than or'
