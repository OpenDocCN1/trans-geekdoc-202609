  md: "# ## 11.2  Amortized variational inference\n\nAmortized *variational inference*\
    \ (VI) is the idea that instead of optimizing a set of free parameters, we can\
    \ introduce a parameterized function that maps from observation space to the parameters\
    \ of the approximate posterior distribution. In practice, this could be a neural\
    \ network that takes observations as input and outputs the mean and variance parameters\
    \ for the latent variable associated with that observation (as we encountered\
    \ in the VAE architecture). We can then optimize the parameters of this neural\
    \ network instead of the individual parameters of each observation.\n\nOne advantage\
    \ of amortized VI is memoized reuse of past inference, in a similar way to dynamic\
    \ programming, in which we remember solutions to previously computed subproblems.\
    \ For example, consider the following two queries in figure 11.6 (Samuel J. Gershman\
    \ and Noah D. Goodman’s “Amortized Inference in Probabilistic Reasoning,” *Cognitive\
    \ Science*, 2014).\n\n![](img/325742126d3ff007c6c385f4ffb5c3be_279_0.png)\n\n\
    Query 1:  $P(B\\mid C)=P(C\\mid B)P(B)/P(C)$  \nQuery 2:  $P(A\\mid C)=\\sum_B\
    \ P(A\\mid B)P(B\\mid C)$\n\n**Figure 11.6**  A simple Bayesian network.  \n**Query\
    \ 1 is a subquery of query 2.**\n\nWe can see that query 1 is a subquery of query\
    \ 2. Thus, the conditional distribution computed for query 1 can be reused to\
    \ answer query 2. Another advantage of amortized VI is that it omits the requirement\
    \ to derive the ELBO analytically, since the optimization takes place via stochastic\
    \ gradient descent (SGD). The limitation of amortized VI is that the generalization\
    \ gap depends on the capacity of the chosen neural network as the stochastic function.\n\
    \nLet’s look at one example of amortized VI—namely, the mixture density network\
    \ (MDN), in which we’ll be using a multilayer perceptron (MLP) neural network\
    \ to parameterize a Gaussian mixture model (GMM).\n\n# ### 11.2.1  Mixture density\
    \ networks\n\n*Mixture density networks* (MDNs) are mixture models in which the\
    \ parameters, such as means, covariances, and mixture proportions, are learned\
    \ by a neural network. MDNs combine a structured data representation (a density\
    \ mixture) with unstructured parameter inference (an MLP neural network). MDNs\
    \ learn the mixture parameters by maximizing the log likelihood or, equivalently,\
    \ minimizing a negative log likelihood loss.\n\nAssuming a Gaussian mixture model\
    \ (GMM) with $K$ components, we can write down the probability of a test data\
    \ point $y_i$ conditioned on training data $x$ as follows.\n\n$$p(y_i\\mid x)=\\\
    sum_{k=1}^{K}\\pi_k(x)\\,\\mathcal{N}\\bigl(y_i\\mid\\mu_k(x),\\Sigma_k(x)\\bigr)\
    \ \\tag{11.4}$$"
