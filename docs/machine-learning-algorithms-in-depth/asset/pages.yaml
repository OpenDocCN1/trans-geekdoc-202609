- pgno: 289
  md: 'if the same word appears in a different position, the actual word representation
    will be different, depending on where it appears in the sentence.


    Finally, layer normalization is used to normalize the input by computing mean
    and variance across channels and spatial dimensions and a linear (dense) layer
    is added to complete the encoder. The linear layer comes after multihead self-attention
    to project the representation in higher dimensional space and then back to the
    original space. This helps solve stability issues and counters bad initializations.


    If we look closely at the decoder, we’ll notice it contains all of the earlier
    components, in addition to a masked multihead self-attention layer and a new multihead
    attention layer, known as *encoder-decoder attention*. The final output of the
    decoder is transformed through a final linear layer, and the output probabilities
    that predict the next token in the output sequence are calculated with the standard
    softmax function.


    The purpose of masked attention is to respect causality when generating the output
    sentence. Since the entire sentence is not yet available and is generated one
    token at a time, we mask the output by introducing a mask matrix M that contains
    only two types of values: zero and negative infinity.


    $$\operatorname{MaskedAttention}(Q, K, V) = \operatorname{softmax}\left(\frac{QK^T
    + M}{\sqrt{D}}\right)V \tag{11.17}$$


    Eventually, the zeros will be transformed into ones via softmax, while negative
    infinities will become zero, effectively removing the corresponding connection
    from the output.


    The encoder–decoder attention is simply the multihead self-attention we are already
    familiar with, except the query $Q$ comes from a different source than the keys
    $K$ and values $V$. This attention is also known in the literature as *cross-attention*.
    Remember that in the machine translation example, our target sequence or query
    $Q$ comes from the decoder, while the encoder acts like a database and provides
    us with keys $K$ and values $V$. The intuition behind the encoder–decoder attention
    layer is to combine the input and output sentences. Thus, the encoder–decoder
    attention is trained to associate the input sentence with the corresponding output
    word, determining how related each target word is with respect to the input words.


