    In information retrieval, it is common to use a precision-recall plot, as shown
    on the right-hand side of figure 5.4. The precision is defined as Precision =
    TP / (TP + FP), and the recall is defined as Recall = TP / (TP + FN). A precision-recall
    curve is a plot of precision versus recall as we vary the classification threshold.
    The curve can be summarized by a single number using the mean precision by averaging
    over the recall values, which approximates the area under the curve. Additionally,
    for a fixed threshold, we can summarize performance in a single statistic, called
    the F1 score, which is the harmonic mean of precision and recall: F1 = 2PR / (P
    + R).


    Perceptron is a mistake-driven algorithm: it starts with θ=0 and successively
    adjusts the parameter θ for each training example until there are no more classification
    mistakes, assuming the data is linearly separable. The perceptron update rule
    can be summarized as follows.


    ```

    if y_i ≠ h(x_i; θ^(k)) then

    θ^(k+1) = θ^(k) + y_i x_i

    θ_0^(k+1) = θ_0^(k) + y_i

    (5.3)

    ```


    Here, index k denotes the number of times the parameter updates (aka the number
    of mistakes). You can think of a θ0 update as similar to a θ update but with x
    = 1. If the training examples are linearly separable, then the perceptron algorithm
    in equation 5.3 converges after a finite number of iterations. Notice that the
    order of input data points makes a difference in how parameter θ is learned; therefore,
    we can randomize (shuffle) the training dataset. In addition, we can introduce
    a learning rate to help with θ convergence—the properties of which we’ll discuss
    following the implementation. The perceptron algorithm can be summarized in the
    pseudo-code in figure 5.5.


