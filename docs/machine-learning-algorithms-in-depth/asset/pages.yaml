- pgno: 66
  md: 'known as *moment projection* or *M-projection* is zero avoiding $q(x)$ and
    will overestimate the support of $p(x)$, as shown in figure 3.2.


    ![](img/325742126d3ff007c6c385f4ffb5c3be_66_0.png)


    Figure 3.2 shows samples from a 2D Gaussian mixture with 4 components $p(x)$ as
    well as density ellipses of approximating distribution $q(x)$. We can see that
    optimizing forward KL leads to $q(x)$ centered at zero (in the low-density region),
    as we over-estimate the support of $q(x)$. On the other hand, optimizing reverse
    KL leads to $q(x)$ centered at one of the four modes of the Gaussian mixture.


    We can use Jensen’s inequality to derive the ELBO, an objective that we can maximize
    to learn the variational parameters of our model. Let $x$ be our data and $z$
    be the latent variables, and then we can derive our ELBO objective as follows.


    $$\log p(x) = \log \sum_z p(x,z) = \log \sum_z \frac{q(z)}{q(z)} p(x,z)$$ $$=
    \log E_{q(z)}\left[ \frac{p(x,z)}{q(z)} \right] \ge E_{q(z)}\left[ \log \frac{p(x,z)}{q(z)}
    \right]$$ $$= \underbrace{E_{q(z)}[\log p(x,z)]}_{\text{Energy term}} - \underbrace{E_{q(z)}[\log
    q(z)]}_{\text{Entropy term}} = \text{ELBO} \quad (3.6)$$


    Notice that the first term is the average negative energy, and the second term
    is the entropy: Thus, a good posterior must assign most of its probability mass
    to regions of low energy (i.e., high joint probability density) while also maximizing
    the entropy of $q(z)$. Thus, variational inference, in contrast to the MAP estimator,
    prevents $q(z)$ from collapsing into an atom.


    One form of ELBO emphasizes that the lower bound becomes tighter, as the variational
    distribution better approximates the posterior.


    $$\text{ELBO} = E_{q(z)}\left[ \log \frac{p(x,z)}{q(z)} \right] = E_{q(z)}\left[
    \log \frac{p(z|x)p(x)}{q(z)} \right]$$ $$= \underbrace{-KL(q(z)||p(z|x))}_{\text{Distance
    between the approximating q(z) and the posterior p(z|x)}} + \log p(x) \quad (3.7)$$'
