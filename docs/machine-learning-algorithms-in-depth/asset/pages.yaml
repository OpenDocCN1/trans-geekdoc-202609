- pgno: 119
  md: 'optimum feature and threshold for that feature that results in the split of
    data with minimum cost. Let $j \in \{1, ..., d\}$ represent feature dimension
    and $t \in \tau_j$ represent a threshold for feature $j$ out of all possible thresholds
    $\tau_j$ (constructed by taking midpoints of our data $x_{ij}$). Then, we would
    like to compute the following.


    $j^*, t^* = \arg\min_{j \in \{1,...,d\}} \min_{t \in \tau_j} \text{cost}(\{x_i,
    y_i : x_{ij} \le t\}) + \text{cost}(\{x_i, y_i : x_{ij} > t\})$ (5.42)


    Before we look at an example, let’s look at potential costs we can use for optimizing
    the tree for classification. Our goal in defining a cost function is to evaluate
    how good our data partition is. We would like the leaf nodes to be pure (i.e.,
    contain data from the same class and still be able to generalize to test data).
    In other words, we would like to limit the depth of the tree (to prevent overfitting)
    while minimizing impurity. One notion of impurity is the Gini index.


    $\sum_{k=1}^{K} \pi_k (1 - \pi_k) = \sum_{k} \pi_k - \sum_{k} \pi_k^2 = 1 - \sum_{k}
    \pi_k^2$ (5.43)


    Here, $\pi_k$ is a fraction of points in the region that belongs to cluster $k$.


    $\pi_k = \frac{1}{|D|} \sum_{i \in D} 1[y_i = k]$ (5.44)


    Notice that since $\pi_k$ is the probability of a random point in the leaf belonging
    to class $k$ and $1 - \pi_k$ is the error rate, the Gini index is the expected
    error rate. If the leaf cluster is pure ($\pi_k = 1$), then the Gini index is
    zero. Thus, we are interested in minimizing the Gini index.


    An alternative objective is entropy, as shown in the following equation.


    $H(\pi) = - \sum_{k=1}^{K} \pi_k \log \pi_k$ (5.45)


    *Entropy* measures the amount of uncertainty. If we are certain that the leaf
    cluster is pure (i.e., $\pi_k = 1$), then the entropy is zero. Thus, we are interested
    in minimizing entropy when it comes to CART.


    Let’s look at a one-dimensional example of choosing the optimum splitting feature
    and its threshold. Let $X = [1.5, 1.7, 2.3, 2.7, 2.7]$ and class label $y = [1,
    1, 2, 2, 3]$. Since the data is one-dimensional, our task is to find a threshold
    that will split $X$ in a way that minimizes the Gini index. If we choose a threshold
    $t_1 = 2$ as a midpoint between 1.7 and 2.3 and compute the resulting Gini index,
    we get the following equation.'
