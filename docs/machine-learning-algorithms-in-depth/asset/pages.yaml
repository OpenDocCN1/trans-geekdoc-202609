  md: 'Figure 2.2 shows the probability mass function (PMF) of a Bernoulli RV modeling
    the coin flip. If θ = ½, we have a fair coin with an equal chance of heads (1)
    or tails (0); otherwise, we say that the coin is biased, with a bias equal to
    θ. We can write down the PMF of a Bernoulli RV as follows.


    $$p_x(x|θ) = θ^x (1 - θ)^{1-x},\ x \in \{0, 1\}\tag{2.2}$$


    The mean of the Bernoulli RV is equal to E[X] = Σ_x p_x (x|θ) = 0(1 - θ) + 1(θ)
    = θ, while the variance is equal to VAR(x) = E[x²] - E[x]² = θ - θ² = θ(1 - θ).
    Let’s go back to our coin-tossing example. Let D = {x₁,…,xₙ} be a sequence of
    independent and identically distributed (iid) coin flips. Then, we can compute
    the likelihood as follows.


    $$p_x(D|θ) = p_x(x₁,…,x_n|θ)\\ = \prod_{i=1}^{n} p(x_i|θ) = \prod_{i=1}^{n} θ^{x_i}
    (1 - θ)^{1 - x_i}\\ = θ^{N_1} (1 - θ)^{N_0}\tag{2.3}$$


    Here, we assume N₁ = Σ_{i=1}^n x_i, or the total number of counts for which the
    coin landed heads, and N₀ = n - N₁, or the total number of counts for which the
    coin landed tails.


    Equations 2.2 and 2.3 have the form p(x|θ), which is, by definition, the likelihood
    of data x, given the parameter θ. What if we have some prior information about
    the parameter θ; in other words, what if we know something about p(θ), such as
    the number of heads and tails we obtained in another experiment with the same
    coins? We can capture this prior information as follows.


    $$\text{Beta}(θ|a, b) \propto θ^{a-1} (1 - θ)^{b-1}\tag{2.4}$$


    Here, a is the number of heads and b is the number of tails in our previous experiment.
    When computing the posterior distribution, we are interested in computing p(θ|x).
    We can use the Bayes rule from chapter 1 to express the posterior distribution
