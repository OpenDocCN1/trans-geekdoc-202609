    unbiased estimator satisfies the following.


    $\text{VAR}(\hat{\theta}) \ge \frac{1}{-E\left[\frac{\partial^2 \log p(x|\theta)}{\partial
    \theta^2}\right]} = \frac{1}{I(\theta)}$ (7.30)


    Here, $I(\theta)$ is the Fisher information matrix. Thus, the minimum variance
    unbiased (MVU) estimator achieves the minimum variance equal to the inverse of
    the Fisher information matrix. To minimize the variance of parameter estimates,
    an active learner'
