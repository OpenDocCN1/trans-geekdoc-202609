  md: 'model for the first two timesteps is shown in figure 2.6. Note that the price
    in the next up (down) state is u (d) times the price of the previous state.


    We can use Monte Carlo to generate uncertainty estimates of the terminal stock
    price after some time horizon T. When using a binomial model to describe the price
    process of the stock, we can use the following calibration (the derivation of
    which is outside the scope of this book).


    u = exp( σ sqrt(T/n) ) = 1/d


    p = 1/2 + 1/2 (μ/σ) sqrt(T/n)   (2.12)


    Here, T is the length of the prediction horizon in years and n is the number of
    time steps. We assume 1 year equals 252 trading days, 1 month equals 21 days,
    1 week equals 5 days, and 1 day equals 8 hours. Let''s simulate the stock price
    using the binomial model with a daily time step for two different time horizons:
    1 month from today and 1 year from today. We can summarize the algorithm in the
    pseudo-code shown in figure 2.7.


    ```

    1: function binomial_tree(μ, σ, S0, N, T, step):

    2: u = exp( σ sqrt(T/n) ) ← Up price

    3: d = 1/u ← Down price

    4: p = 1/2 + 1/2 (μ/σ) sqrt(T/n) ← Up-state transition probability

    5: up_times = Binomial( T/step, p, N )

    6: down_times = T/step - up_times

    7: S_T = S0 × u^{up_times} × d^{down_times}

    8: return S_T

    ```


    ![](img/325742126d3ff007c6c385f4ffb5c3be_42_0.png)


    Figure 2.6 Binomial tree model


    Figure 2.7 Binomial tree pseudo-code


    We begin by initializing up price u and down price d, along with up-state transition
    probability p. Next, we simulate all the up-state transitions by sampling from
    a Binomial random variable with the number of trials equal to T/step, the success
    probability p, and the number of Monte Carlo simulations equal to N. The down-state
    transitions are computed by complimenting up-state transitions. Finally, we compute
    the asset price by multiplying the initial price S0 with the price of all the
    up-state transitions and all the down-state transitions.'
