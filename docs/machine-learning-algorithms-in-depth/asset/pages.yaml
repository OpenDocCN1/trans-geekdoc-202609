    # 9.5 Genetic algorithm


    Genetic algorithms (GAs) are inspired by and modeled after evolutionary biology.
    They consists of a population of (randomly initialized) individual genomes that
    are evaluated for their fitness with respect to a target. Two individuals combine
    and cross over their genome to produce offspring. This crossover step is followed
    by a mutation, by which individual bases can change according to a mutation rate.
    These new individuals are added to the population and scored by the fitness function,
    which determines whether the individual survives in the population. Let’s look
    at the pseudo-code in figure 9.10. In this example, we will evolve a random string
    to match a string target.


    The GeneticAlgorithm class consists of the following functions: calculate_fitness,
    mutate, crossover, and run. In the calculate_fitness function, we compute the
    fitness score as 1/loss, where loss is defined as a distance between individual
    and target ASCII string characters. In the mutate function, we randomly change
    string characters of an individual according to a mutation rate. In the crossover
    function, we choose an index at which to cross the parents’ genomes at random
    and then carry out the crossover of the parents’ genomes at the chosen index producing
    two children. Finally, in the run function, we initialize the population and compute
    population fitness. After'
