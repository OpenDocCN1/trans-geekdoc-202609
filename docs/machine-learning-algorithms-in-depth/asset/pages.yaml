- pgno: 193
  md: 'In equation 8.10, \(\pi_k = p(z_i = k)\) are the mixture proportions.


    In the M step, we maximize \(Q\) with respect to model parameters \(\pi\) and
    \(\theta_k\). First, let’s find \(\pi\) that maximizes the Lagrangian.


    $$\frac{\partial Q}{\partial \pi_k}=\frac{\partial}{\partial \pi_k}\left[\sum_i\sum_k
    r_{ik}\log\pi_k+\lambda\left(1-\sum_k\pi_k\right)\right]$$

    $$=\sum_i\frac{r_{ik}}{\pi_k}-\lambda=0 \tag{8.11}$$


    Substituting the expression into the constraint, we get the following equation.


    $$\sum_k\pi_k=1\Rightarrow\sum_k\frac{1}{\lambda}\sum_i r_{ik}=1\Rightarrow\lambda=\sum_i\sum_k
    r_{ik}=\sum_i1=N \tag{8.12}$$


    Therefore, \(\pi_k=1/\lambda\sum_i r_{ik}=1/N\sum_i r_{ik}\). To find the optimum
    parameters \(\theta_k=\{\mu_k,\Sigma_k\}\), we want to optimize the terms of \(Q\)
    that depend on \(\theta_k\).


    $$l(\mu_k,\Sigma_k)=\sum_i r_{ik}\log p(x_i\mid\theta_k)$$

    $$\propto -\frac{1}{2}\sum_i r_{ik}\left[\log|\Sigma_k|+(x_i-\mu_k)^T\Sigma_k^{-1}(x_i-\mu_k)\right]
    \tag{8.13}$$


    To find the optimum \(\mu_k\), we differentiate this expression. First, focusing
    on the second term inside the sum, we can make a substitution \(y_i=x_i-\mu_k\).


    $$\frac{\partial}{\partial\mu_k}(x_i-\mu_k)^T\Sigma_k^{-1}(x_i-\mu_k)=\frac{\partial}{\partial
    y_i}y_i^T\Sigma_k^{-1}y_i\frac{\partial y_i}{\partial\mu_k}$$

    $$=-1\times(\Sigma_k^{-1}+\Sigma_k^{-T})y_i \tag{8.14}$$


    Substituting the expression in equation 8.14, we get the following equation.


    $$\frac{\partial}{\partial\mu_k}l(\mu_k,\Sigma_k)\propto-\frac{1}{2}\sum_i r_{ik}\left[-2\Sigma^{-1}(x_i-\mu_k)\right]$$

    $$=\Sigma^{-1}\sum_i r_{ik}(x_i-\mu_k)=0 \tag{8.15}$$'
