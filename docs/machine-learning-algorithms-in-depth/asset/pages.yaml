- pgno: 49
  md: 'p(x_A|x_B) = N(x_A|μ_{A|B}, Σ_{A|B})

    μ_{A|B} = μ_A + Σ_{AB} Σ_{BB}^{-1} (x_B - μ_B)

    Σ_{A|B} = Σ_{AA} - Σ_{AB} Σ_{BB}^{-1} Σ_{BA}  (2.17)


    Let’s understand the Gibbs sampling algorithm by looking at the pseudo-code in
    figure 2.11.


    ```

    1: class gibbs_gauss

    2: function gauss_conditional(mu, Sigma, setA, x):

    3: setU = set(range(len(mu))) ← Universal set

    4: setB = setU\setA

    5: x_B, μ_A, μ_B = x[setB], mu[setA], mu[setB]

    6: μ_{A|B} = μ_A + Σ_{AB} Σ_{BB}^{-1} (x_B - μ_B)

    7: Σ_{A|B} = Σ_{AA} - Σ_{AB} Σ_{BB}^{-1} Σ_{BA}

    8: return μ_{A|B}, Σ_{A|B}

    9: function sample(mu, Sigma, xinit, num_samples):

    10: x = xinit

    11: dim = len(mu)

    12: for s = 1 to num_samples:

    13:   for d = 1 to dim:

    14:     μ_{A|B}, Σ_{A|B} = gauss_conditional(mu, Sigma, set(d), x)

    15:     x[d] ~ N(x; μ_{A|B}, Σ_{A|B}) ← Gibbs samples

    16:   end for

    17:   samples[s,:] = x

    18: end for

    19: return samples

    ```


    Figure 2.11

    Gibbs sampler pseudo-code


    Our gibbs_gauss class contains two functions: gauss_conditional and sample. The
    gauss_conditional function computes the conditional Gaussian distribution p(x_A|x_B)
    for any sets of variables setA and setB. setA is an input to the function, while
    setB is computed as a set difference between the universal set of dimension D
    and setA. Recall that in Gibbs sampling, we sample one dimension at a time, while
    conditioning the distribution on all the other dimensions. In other words, we
    cycle through available dimensions and compute the conditional distribution in
    each iteration. That’s exactly what the sample function does. For each sample,
    we iterate over each dimension and compute the mean and covariance of the Gaussian
    conditional distribution, from which we then take and record a sample. We repeat
    this process until the maximum number of samples is reached. Let’s see the Gibbs
    sampling algorithm in action for sampling from a 2D Gaussian distribution.


    # Listing 2.4 Gibbs sampling


