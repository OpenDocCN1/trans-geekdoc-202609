  md: '# 4.1.2 Nonlinear


    A data structure is considered nonlinear if its elements do not follow a linear
    order. Examples of nonlinear data structures include a map (dictionary) and a
    set. This is because ordered dictionaries and ordered sets are built on self-balanced
    binary search trees (BST) that guarantee O(n log n) insertion, search, and deletion
    operations. BSTs have the property that the root node value is greater than its
    left child and less than its right child for every subtree. Self-balanced BSTs
    are typically implemented as Adelson-Velskii-Landis (AVL) or red–black (RB) trees
    (see Introduction to Algorithms by Thomas H. Cormen, Charles E. Leiserson, Ronald
    L. Rivest, and Clifford Stein [1990] for details). The difference between an ordered
    map (dictionary) and ordered set data structures is that the map stores (key–value)
    pairs, while the set only stores keys. A heap is another way to organize data
    in a tree representation. For example, an array A = [2,7,26,25,19,17,1,90,3,36]
    can be represented as a tree, as shown in figure 4.1.


    ![](img/325742126d3ff007c6c385f4ffb5c3be_80_0.png)


    Figure 4.1 A binary heap


    We can easily navigate the binary heap A = [90,36,17,25,26,7,1,2,3,19], starting
    with a vertex i and using the simple index arithmetic 2i to access the left child,
    2i+1 to access the right child, and i/2 to access the parent node. Instead of
    enforcing the binary search tree (BST) property, the (max) heap enforces the heap
    property: in each subtree rooted at x, items on the left and right subtrees of
    x are smaller than (or equal to) x. This property guarantees that the top of the
    (max) heap is always the maximum element. Thus, (max) heap allows for fast extraction
    of the maximum element. Indeed, extract max and insert operations are achieved
    in O(log n) tree traversal, performing swapping operations to maintain the heap
    property whenever necessary. A heap forms the basis for a priority queue, which
    is an important data structure in algorithms such as Prim and Kruskal minimum
    spanning trees (MST), Dijkstra''s single-source shortest paths (SSSP), and the
    A* search. Finally, a hash table or unordered map is a very efficient data structure,
    with O(1) access assuming no collisions. One commonly used class of hash tables
    is direct addressing (DA), where the keys themselves are the indices. The goal
