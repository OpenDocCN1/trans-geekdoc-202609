    # 1.4  **Bayesian inference and deep learning**


    *Bayesian inference* allows us to update our beliefs about the world given observed
    data. Our minds hold a variety of mental models explaining different aspects of
    the world, and by observing new data points, we can update our latent representation
    and improve our understanding of reality. Any *probabilistic model* is described
    by a set of parameters θ modeled as random variables, which control the behavior
    of the model, and associated data x.


    The goal of Bayesian inference is to find the posterior distribution *p(θ|x)*
    (distribution over the parameters given the data) to capture a particular aspect
    of reality well. The posterior distribution is proportional to the product of
    the likelihood *p(x|θ)* (distribution over the data given the parameters) and
    the prior *p(θ)* (initial distribution over the parameters), which follows from
    the Bayes rule in equation 1.3.


    ![](img/325742126d3ff007c6c385f4ffb5c3be_28_0.png)


    The prior *p(θ)* is our initial belief and can be either noninformative (e.g.,
    uniform over all possible states) or informative (e.g., based on experience in
    a particular domain). Moreover, our inference results depend on the prior we choose—not
    only the value of prior parameters but also on the functional form of the prior.
    We can imagine a chain of updates in which the prior becomes a posterior as more
    data is obtained in the form of a Bayes engine, as shown in figure 1.4. We can
    see how our prior is updated to a posterior via the Bayes rule as we observe more
    data.


    ![](img/325742126d3ff007c6c385f4ffb5c3be_28_1.png)


    **Figure 1.4**  A Bayes engine showing the transformation of a prior to a posterior
    as more data is observed'
