    # 7.5.2  Boosting


    *Boosting* refers to a family of algorithms that can convert weak learners to
    strong learners. The main principle of boosting is to fit a sequence of weak learners
    (i.e., models that are only slightly better than random guessing, such as small
    decision trees) to weighted versions of the data, where more weight is given to
    examples that were misclassified by earlier rounds. The predictions are then combined
    through a weighted majority vote (classification) or a weighted sum (regression)
    to produce the final prediction. The principal difference between boosting and
    the committee methods, such as bagging, is that base learners are trained in sequence
    on a weighted version of the data.


    The algorithm in figure 7.15 describes the most widely used form of boosting algorithm:
    *AdaBoost*, which stands for adaptive boosting. We see that the first base classifier
    $y_1(x)$ is trained using weighting coefficients $w_n^1$ that are all equal. In
    subsequent boosting rounds, the weighting coefficients $w_n^m$ are increased for
    data points that are misclassified and decreased for data points that are correctly
    classified. The quantity $\epsilon_m$ represents a weighted error rate of each
    of the base classifiers. Therefore, the weighting coefficients $\alpha_m$ give
    greater weight to more accurate classifiers.


    ```

    1: Init data weights $\{w_n\}$ to $\frac{1}{N}$

    2: for $m = 1$ to $M$ do

    3:    if a classifier $y_m(x)$ by minimizing weighted error function $J_m$:

    4:       $J_m = \sum_{n=1}^{N} w_n^{(m)}\,1[y_m(x_n) \ne t_n]$

    5:       compute $\epsilon_m = \frac{\sum_{n=1}^{N} w_n^{(m)}1[y_m(x_n)\ne t_n]}{\sum_{n=1}^{N}
    w_n^{(m)}}$

    6:       evaluate $\alpha_m = \log\left(\frac{1-\epsilon_m}{\epsilon_m}\right)$

    7:       update the data weights: $w_n^{(m+1)} = w_n^{(m)}\exp\{\alpha_m\,1[y_m(x_n)\ne
    t_n]\}$

    8:    end for

    9: Make predictions using the final model: $Y_M(x)=\operatorname{sign}\left(\sum_{m=1}^{M}\alpha_m
    y_m(x)\right)$

    ```


    **Figure 7.15   AdaBoost algorithm pseudo-code**


    The following listing trains the AdaBoost classifier with different numbers of
    learners.'
