    Let’s take a second look at our implementation and understand it a little better.
    The perceptron algorithm can be formulated as stochastic gradient descent that
    minimizes a hinge loss function. Consider a loss function that penalizes the magnitude
    of disagreement z_i = y_i(θ·x_i + θ_0) between the label y_i and the prediction
    h(x_i; θ).


    ```

    Loss_h(z) = 1/n Σ_{i=1}^n max{1 - z_i, 0} = 1/n Σ_{i=1}^n max{1 - y_i(θ·x_i +
    θ_0), 0}  (5.4)

    ```


    This is known as a hinge loss function, as illustrated in figure 5.7.


    ![](img/325742126d3ff007c6c385f4ffb5c3be_99_1.png)


    Figure 5.7 Hinge loss, 0-1 loss, and log-loss functions


    The stochastic gradient descent attempts to minimize the hinge loss by taking
    a gradient with respect to θ. However, the max operator is not differentiable
    at z_i = 1. In fact,'
