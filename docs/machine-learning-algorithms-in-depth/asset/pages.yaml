    +   11.4 Give an example of a neural network that uses amortized variational inference.

    +   11.5 Show via an example the intuition behind the GCN forward equation: $D^{-1/2}(A+I)D^{-1/2}XW
    + b$.


    # Summary


    +   - Autoencoders are unsupervised neural networks trained to reconstruct the
    input. The bottleneck layer of the autoencoder can be used for dimensionality
    reduction or feature extraction.

    +   - A variational autoencoder consists of an encoder that takes in data as input,
    transforming it into a latent representation, and a decoder that takes a latent
    representation, returning a reconstruction.

    +   - Amortized variational inference is the idea that instead of optimizing a
    set of free parameters, we can introduce a parameterized function that maps from
    observation space to the parameters of the approximate posterior distribution.

    +   - Mixture density networks are mixture models in which the parameters, such
    as means, covariances, and mixture proportions, are learned by a neural network.

    +   - Attention allows a model to adaptively focus on different parts of the input
    by adjusting the attention weights.

    +   - A transformer is a Seq2Seq model that uses attention in the encoder as well
    as the decoder. Self-attention is the key component of transformer architecture.

    +   - Graph neural networks are neural models that capture dependence relationships
    via passing messages between the nodes of the graph.'
