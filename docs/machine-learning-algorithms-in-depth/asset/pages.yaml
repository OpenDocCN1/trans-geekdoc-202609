  md: "Adaptive synthetic sampling (ADASYN) uses a weighted distribution for different\
    \ minority class examples according to their level of difficulty in learning,\
    \ where more synthetic data is generated for minority class examples that are\
    \ harder to learn. As a result, the ADASYN approach improves learning of imbalanced\
    \ datasets in two ways: reducing the bias introduced by class imbalance and adaptively\
    \ shifting the classification decision boundary toward the difficult examples.\
    \ Let’s experiment with SMOTE oversampling using the imbalanced-learn library.\n\
    \n# Listing 7.4  SMOTE algorithm\n\n```\n```python\nimport seaborn as sns\nimport\
    \ matplotlib.pyplot as plt\n\nfrom sklearn.datasets import make_classification\n\
    from sklearn.decomposition import PCA\n\nfrom imblearn.over_sampling import SMOTE\n\
    \ndef plot_resampling(ax, X, y, title):\n    c0 = ax.scatter(X[y == 0, 0], X[y\
    \ == 0, 1], label=\"Class #0\", alpha=0.5)\n    c1 = ax.scatter(X[y == 1, 0],\
    \ X[y == 1, 1], label=\"Class #1\", alpha=0.5)\n    ax.set_title(title)\n    ax.spines['top'].set_visible(False)\n\
    \    ax.spines['right'].set_visible(False)\n    ax.get_xaxis().tick_bottom()\n\
    \    ax.get_yaxis().tick_left()\n    ax.spines['left'].set_position(('outward',\
    \ 10))\n    ax.spines['bottom'].set_position(('outward', 10))\n    ax.set_xlim([-6,\
    \ 8])\n    ax.set_ylim([-6, 6])\n\n    return c0, c1\n\ndef main():\n    X, y\
    \ = make_classification(n_classes=2, class_sep=2, weights=[0.3, 0.7],\n      \
    \                         n_informative=3, n_redundant=1, flip_y=0,\n        \
    \                       n_features=20, n_clusters_per_class=1,\n             \
    \                  n_samples=80,\n                               random_state=10)\
