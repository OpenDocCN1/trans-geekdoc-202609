    # 5.6 Compute the runtime and memory complexity of the Bernoulli naive Bayes algorithm.


    The following pseudo-code captures the Bernoulli naive Bayes algorithm:


    ```

    1: Training:

    2:   N_c = 0, N_{jc} = 0

    3:   for i = 1, 2, ..., n do

    4:       c = y_i  // class label for ith example

    5:       N_c = N_c + 1

    6:       for j = 1, ..., D do

    7:           if x_{ij} = 1 then

    8:               N_{jc} = N_{jc} + 1

    9:           end for

    10:      end for

    11:  \hat{\pi}_c = \frac{N_c}{N}, \hat{\theta}_{jc} = \frac{N_{jc}}{N}

    12:  return \hat{\pi}_c, \hat{\theta}_{jc}

    13: Testing (for a single test document):

    14:  for c = 1, 2, ..., C do

    15:      \log p[c] = \log \pi_c

    16:      for j = 1, 2, ..., D do

    17:          if x_j = 1 then

    18:              \log p[c] += \log \hat{\theta}_{jc}

    19:          else

    20:              \log p[c] += \log(1 - \hat{\theta}_{jc})

    21:          end for

    22:      end for

    23:  c = \arg\max_c \log p[c]

    24:  return c

    ```


    Given that we have two nested for loops, the runtime complexity is $O(ND)$, where
    $N$ is the number of training documents and $D$ is the dictionary size. The runtime
    complexity during test time is $O(TCD)$, where $T$ is the number of test documents,
    $C$ is the number of classes, and $D$ is the dictionary size. Similarly, space
    complexity is the size of arrays required to store model parameters that grow
    as $O(DC)$.'
