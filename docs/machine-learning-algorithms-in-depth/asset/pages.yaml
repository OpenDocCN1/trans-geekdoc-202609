- pgno: 56
  md: 'The idea behind importance sampling is to draw samples in interesting regions
    (i.e., where both p(x) and |f(x)| are large). Importance sampling works by drawing
    samples from an easier-to-sample proposal distribution q(x). Thus, we can compute
    the expected value of f(x) with respect to the target distribution p(x) by drawing
    samples from the proposal q(x) and using Monte Carlo integration.


    E[f(x)] = ∫ f(x) p(x)/q(x) q(x) dx ≈ 1/N Σ_{i=1}^N w(x_i) f(x_i), where x_i ~
    q(x) (2.23)


    In equation 2.23, we defined the importance weights as w(x) = p(x) / q(x). Let’s
    look at an example where we use importance sampling to approximate an expected
    value of f(x) = 2 sin(πx/1.5), x ≥ 0. We are asked to take the expectation with
    respect to an unnormalized Chi distribution parameterized by a noninteger degree
    of freedom (DoF) parameter k.


    p(x) ~ x^{(k-1)} exp{ -x²/2 }, x ≥ 0 (2.24)


    We will use an easier-to-sample from proposal distribution q(x):


    q(x) ~ N(x; 0.8, 1.5) (2.25)


    Let’s look at the pseudo-code in figure 2.15.


    ```

    1: class importance_sampler

    2: function sample(N):

    3: for i = 1 to N:

    4: x_i ~ q(x) = N(x; μ, σ²) ← Samples from the proposal

    5: w(x_i) = p(x_i)/q(x_i) ← Computes importance weights

    6: end for

    7: E[f(x)] = 1/N Σ_{i=1}^N w(x_i) f(x_i)

    8: return w(x), E[f(x)]

    ```


    Figure 2.15 Importance sampler pseudo-code


    Our importance_sampler class contains a function called sample that takes the
    number of samples N as its input. Inside the sample function, we loop over the
    number of samples, and for each iteration, we sample from the proposal distribution
    q(x) and compute the importance weight as the ratio of target distribution p(x)
    to the proposal distribution q(x). Finally, we compute the Monte Carlo integral
    by weighting our function of interest f(x) by the importance weights, summing
    over all samples and dividing by N. Let’s look at the following code listing,
    which captures all the details.'
  merge: -1
  img_proc: true
- pgno: 57
  md: "# Listing 2.6 Importance sampling\n\n```\n```python\nimport numpy as np\nimport\
    \ matplotlib.pyplot as plt\n\nfrom scipy.integrate import quad\nfrom scipy.stats\
    \ import multivariate_normal\n\nnp.random.seed(42)\n\nclass importance_sampler:\n\
    \    def __init__(self, k=1.5, mu=0.8, sigma=np.sqrt(1.5), c=3):\n        self.k\
    \ = k                # Target parameters p(x)\n        self.mu = mu          \
    \    # Proposal parameters q(x)\n        self.sigma = sigma\n        self.c =\
    \ c                # Fixes c, s.t. p(x) < c q(x)\n\n    def target_pdf(self, x):\n\
    \        return (x**(self.k-1)) * np.exp(-x**2/2.0)   # p(x) ~ Chi(k=1.5)\n\n\
    \    def proposal_pdf(self, x):\n        return self.c * 1.0/np.sqrt(2*np.pi*1.5)\
    \ *\n            np.exp(-(x-self.mu)**2/(2*self.sigma**2))   # q(x) ~ N(mu,sigma)\n\
    \n    def fx(self, x):\n        return 2*np.sin((np.pi/1.5)*x)   # Function of\
    \ interest f(x), x >= 0\n\n    def sample(self, num_samples):\n        x = multivariate_normal.rvs(self.mu,\n\
    \            self.sigma, num_samples)   # Sample from the proposal\n\n       \
    \ idx = np.where(x >= 0)          # Discards negative samples, since\n       \
    \ x_pos = x[idx]                  # f(x) is defined for x >= 0\n\n        isw\
    \ = self.target_pdf(x_pos) /\n            self.proposal_pdf(x_pos)    # Computes\
    \ importance weights\n\n        fw = (isw/np.sum(isw))*self.fx(x_pos)   # Computes\
    \ E[f(x)] = sum_i f(x_i)\n        f_est = np.sum(fw)                      # w(x_i),\
    \ where x_i ~ q(x)\n\n        return isw, f_est\n\nif __name__ == \"__main__\"\
    :\n\n    num_samples = [10, 100, 1000, 10000, 100000, 1000000]\n\n    F_est_iter,\
    \ IS_weights_var_iter = [], []\n    for k in num_samples:\n        IS = importance_sampler()\n\
    \        IS_weights, F_est = IS.sample(k)\n        IS_weights_var = np.var(IS_weights/np.sum(IS_weights))\n\
    \        F_est_iter.append(F_est)\n        IS_weights_var_iter.append(IS_weights_var)\n\
    \n#ground truth (numerical integration)\nk = 1.5\n```\n```"
