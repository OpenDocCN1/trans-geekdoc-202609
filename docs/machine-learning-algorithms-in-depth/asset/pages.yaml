- pgno: 127
  md: '# 6.1 Introduction to regression


    In supervised learning, we are given a dataset D = {(x₁, y₁), ..., (xₘ, yₘ)} consisting
    of tuples of data x and labels y. The goal of a regression algorithm is to learn
    a mapping from inputs x to outputs y, where y is a continuous quantity (i.e.,
    y ∈ R).


    A regressor f can be viewed as a mapping between a d-dimensional feature vector
    φ(x) and a label y (i.e., f: Rᵈ → R). Regression problems are typically harder
    (to achieve higher accuracy) compared to classification problems because we are
    trying to predict a continuous quantity. Moreover, we are often interested in
    predicting future response variable y based on past training data.


    One of the most widely used models for regression is linear regression, which
    models the response variable y as a linear combination of input feature vectors
    φ(x).


    y(x) = wᵀ φ(x) + ε = Σ_{d=1}^D w_d φ(x_d) + ε  (6.1)

    Features ↑ φ(x) ↓ Gaussian noise

    Regression weights ↓ wᵀ


    Here, ε is the residual error between our linear predictions and the true response.
    We can characterize the quality of our regressor based on the mean squared error
    (MSE).


    MSE(w) = E[(y - f(x;w))²] = 1/N Σ_{i=1}^N (y_i - wᵀ φ(x_i))²  (6.2)

    Prediction ↑ f(x;w)

    Ground truth ↓ y


    In this chapter, we will look at several important regression models, starting
    with Bayesian and KNN regression, and their extensions to hierarchical regression
    models, and concluding with Gaussian process (GP) regression. We''ll focus on
    both the theory and implementation of each model from scratch.


    # 6.2 Bayesian linear regression


    Recall that we can write the linear regression as y(x) = wᵀ x + ε. If we assume
    that ε ~ N(0, σ²) is a zero-mean Gaussian RV with a variance σ², then we can formulate
    linear regression as follows.


    p(y|x, θ) = N(y|wᵀ x, σ²)  (6.3)


    Here, w are regression coefficients. To fit a linear regression model to data,
    we minimize the negative log likelihood.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '$$\begin{aligned}\text{NLL}(w, \sigma^2) &= -\log p(y|x, \theta) \\

    &= -\log \prod_{n=1}^N \left[ \frac{1}{\sqrt{2\pi\sigma^2}} \exp\left[-\frac{1}{2\sigma^2}
    (y_n - w^T x)^2\right] \right] \\

    &= -\sum_{n=1}^N \log\left(\frac{1}{\sqrt{2\pi\sigma^2}}\right) + \sum_{n=1}^N
    \frac{1}{2\sigma^2} (y_n - w^T x)^2 \\

    &= \frac{1}{2\sigma^2} \sum_{n=1}^N (y_n - w^T x)^2 + \frac{N}{2} \log(2\pi\sigma^2)
    \tag{6.4}\end{aligned}$$


    Keeping $\sigma^2$ fixed and differentiating with respect to $w$, we get the following
    equation.


    $$2X^T X w - 2X^T y + 2\lambda w = 0 \tag{6.5}$$


    From equation 6.5, we can write the following.


    $$\hat{w} = (X^T X + \lambda I)^{-1} X^T y \tag{6.6}$$


    One problem with the estimation in equation 6.6 is that it can result in overfitting.
    To make the Bayesian linear regression robust against overfitting, we can encourage
    the parameters to be small by placing a zero-mean Gaussian prior.


    $$p(w) = \prod_{d} N(w_d|0, \tau^2) \tag{6.7}$$


    Thus, we can rewrite our regularized objective as follows.


    $$\min_{w,\sigma^2} \text{NLL}(w, \sigma^2) + \lambda \|w\|_2^2 \tag{6.8}$$


    Solving for $w$ as before, we get the following coefficients.


    $$\hat{w}_{ridge} = (X^T X + \lambda I)^{-1} X^T y \tag{6.9}$$


    We can learn the parameters $w$ using gradient descent! Let’s look at the pseudo-code
    in figure 6.1.'
