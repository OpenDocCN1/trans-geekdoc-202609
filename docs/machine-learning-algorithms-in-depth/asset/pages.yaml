    Divide and conquer is a technique that divides the problem into smaller, independent
    sub-problems and then combines each of their solutions. A machine learning example
    that uses the divide and conquer paradigm can be found in the CART decision tree
    algorithm. As we’ll see in a future chapter, in the CART algorithm, an optimum
    threshold for splitting a decision tree is found by optimizing a classification
    objective (e.g., Gini index). The same procedure is applied to a tree of depth
    one greater, resulting in a recursive algorithm.


    Finally, dynamic programming (DP) is a technique that divides a problem into smaller,
    overlapping subproblems, computes a solution for each, and stores the solution
    in a DP table. A machine learning example that uses dynamic programming occurs
    in reinforcement learning (RL) when finding a solution to Bellman equations. For
    a small number of states, we can compute the Q-function in a tabular way using
    dynamic programming.


