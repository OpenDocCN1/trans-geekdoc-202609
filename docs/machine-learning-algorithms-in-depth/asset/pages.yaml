    # 8.2 Gaussian mixture models


    Mixture models are commonly used to model complex density distributions. For example,
    you may be interested in discovering patterns in census data consisting of information
    about the person''s age, income, occupation, and other dimensions. If we plot
    the resulting data in high-dimensional space, we''ll likely discover nonuniform
    density characterized by groups or clusters of data points. We can model each
    cluster using a base probability distribution. Mixture models consist of a convex
    combination of K base models. In the case of Gaussian mixture models, the base
    distribution is Gaussian and can be written as follows.


    $p(x_i|\theta)=\sum_{k=1}^{K}\pi_k p_k(x_i|\theta)=\sum_{k=1}^{K}\pi_k\mathcal{N}(x_i|\mu_k,\Sigma_k)\tag{8.6}$


    Here, $\pi_k$ are the mixing proportions that satisfy $0 \le \pi_k \le 1$ and
    $\sum\pi_k=1$. In contrast to K-means that only models cluster means, GMM models
    the cluster covariance as well. Thus, GMMs can capture the data more accurately.


    # 8.2.1 Expectation maximization (EM) algorithm


    The expectation maximization (EM) algorithm provides a way of computing ML/MAP
    estimates when we have unobserved latent variables or missing data. EM exploits
    the fact that if the data were fully observed, then the ML/MAP estimates would
    be easy to compute. In particular, EM is an iterative algorithm that alternates
    between inferring the latent variables, given the parameters (E step) and then
    optimizing the parameters given filled-in data (M step).


    In the EM algorithm, we define the complete data log likelihood $l_c(\theta)$,
    where $x_i$ are the observed random variables and $z_i$ are unobserved. Since
    we don''t know $z_i$, we'
