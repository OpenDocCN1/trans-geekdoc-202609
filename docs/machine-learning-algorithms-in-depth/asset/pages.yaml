    ```\n\nAs we can see from the output, we achieve 82% accuracy on the 20 newsgroups\
    \ test dataset.\n\n# 5.6 Decision tree (CART)\n\nThis section focuses on the classification\
    \ and regression trees (CART) algorithm. Tree-based algorithms partition the input\
    \ space into axis parallel regions such that each leaf represents a region. They\
    \ can then be used to either classify the region by taking a majority vote or\
    \ regress the region by computing the expected value. Tree-based models are interpretable\
    \ and provide insight into feature importance. They are based on a greedy, recursive\
    \ algorithm, since the optimum partitioning of space is NP complete.\n\nIn tree-based\
    \ models during training, we are interested in constructing a binary tree in a\
    \ way that optimizes an objective function and does not lead to underfitting or\
    \ overfitting. A key determinant in growing a decision tree is the choice of the\
    \ feature and the threshold to use when classifying the data points. Consider\
    \ an input data matrix X_{n×d} with n data points of dimension (feature size)\
    \ d. We would like to find the"
