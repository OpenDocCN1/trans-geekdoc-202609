  md: "# 5.1 Introduction to classification\n\nIn supervised learning, we are given\
    \ a dataset D = {(x₁, y₁), ..., (xₙ, yₙ)}, consisting of tuples of data x and\
    \ labels y. The goal of a classification algorithm is to learn a mapping from\
    \ inputs x to outputs y, where y is a discrete quantity (i.e., y ∈ {1, ..., K}).\
    \ If K = 2, we have a binary classification problem, while for K > 2, we have\
    \ multiclass classification.\n\nA classifier h can be viewed as a mapping between\
    \ a d-dimensional feature vector φ(x) and a k-dimensional label y (i.e., h: Rᵈ\
    \ → Rᵏ). We often have several models to choose from; let’s call this set of classifier\
    \ models H. Thus, for a given h ∈ H, we can obtain a prediction y = h(φ(x)). We\
    \ are typically interested in predicting new or unseen data—in other words, our\
    \ classifier h must be able to generalize to new data samples.\n\nFinding the\
    \ right classifier is known as model selection. We want to choose a model that\
    \ has a sufficient number of parameters (degrees of freedom) to avoid underfitting\
    \ or overfitting to training data, as shown in figure 5.1.\n\n![](img/325742126d3ff007c6c385f4ffb5c3be_94_0.png)\n\
    \nFigure 5.1 Model selection to avoid overfitting or underfitting to training\
    \ data\n\nFor model classes H = [1, 2, 3], training and test loss functions are\
    \ both decreasing, which indicates that there’s more capacity to learn; as a result,\
    \ these models underfit the data. For model classes H = [6, 7, 8], the training\
    \ loss decreases while the test loss is starting to increase, which indicates\
    \ that we are overfitting the data.\n\n# 5.2 Perceptron\n\nLet’s start with the\
    \ most basic classification model: a linear classifier. We’ll be using the perceptron\
    \ classifier on the iris dataset. We can define a linear classifier as shown in\
    \ equation 5.1.\n\n```\nh(x; θ) = sign(θ₁x₁ + ⋯ + θ_d x_d + θ₀)\n          = sign(θ\
    \ · x + θ₀) = { +1  if θ · x + θ₀ ≥ 0\n                                   -1 \
    \ if θ · x + θ₀ < 0 }  (5.1)\n```"
