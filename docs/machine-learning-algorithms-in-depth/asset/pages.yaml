    \ similarly. Then, we get the following equation.\n\n$$I(X;Y)=\\sum_i\\sum_j p_{XY}(i,j)\\\
    log\\frac{p_{XY}(i,j)}{p_X(i)p_Y(j)} \\tag{8.3}$$\n\nThus, NMI lies between 0\
    \ and 1, with higher values indicating more similar label assignments. The variation\
    \ of information ($VI$) is defined as follows.\n\n$$VI(X;Y)=H(X)+H(Y)-2I(X;Y)=H(X|Y)+H(Y|X)\
