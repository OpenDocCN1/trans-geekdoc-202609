    # VARIANCE REDUCTION


    We can reduce the generalization error by minimizing output variance. Consider
    a regression problem for which the learning objective is to minimize the mean
    squared error. Let $\bar{\theta} = [\hat{\theta}]$ be the expected value of the
    parameter estimate $\hat{\theta}$ and $\theta^*$ be the ground truth. Then, we
    get the following.


    MSE $= E[(\hat{\theta} - \theta^*)^2] = E[((\hat{\theta} - \bar{\theta}) + (\bar{\theta}
    - \theta^*))^2]$


    $= E[(\hat{\theta} - \bar{\theta})^2] + 2(\bar{\theta} - \theta^*)E[\hat{\theta}
    - \bar{\theta}] + (\bar{\theta} - \theta^*)^2$


    $= E[(\hat{\theta} - \bar{\theta})^2] + (\bar{\theta} - \theta^*)^2$


    $= \text{VAR}[\hat{\theta}] + \text{bias}^2(\hat{\theta})$ (7.29)


    This is called the *bias-variance tradeoff*. Thus, it is possible to achieve lower
    MSE with a biased estimator if it reduces the variance. We might then wonder how
    low the variance can be. The answer is given by the Cramer-Rao lower bound, which
    provides a lower bound on the variance of any unbiased estimator.


