- pgno: 107
  md: 'In equation 5.21, $a_k = \ln p(x|C_k) p(C_k)$. This expression is also known
    as a softmax function. The softmax function takes a vector of $K$ real values
    and transforms it into a vector of $K$ real values that sum up to 1. Therefore,
    the output of the softmax function can be interpreted as a probability distribution.
    Now, it’s a matter of choosing conditional densities that model the data well.
    In the case of binary logistic regression parameterized by $\theta$ and with class
    label $y = C_k$, we have the following equation.


    $p(C_k|x) = p(y|x, \theta) = \mathrm{Ber}\left(y \mid \sigma\left(\theta^T x\right)\right)
    \tag{5.22}$


    We can compute the joint distribution as follows.


    $p(x_i, y_i|\theta) = p(y_i|x_i, \theta) p(x_i|\theta) = \mathrm{Ber}\left(y \mid
    \sigma\left(\theta^T x\right)\right) p(x_i|\theta) \tag{5.23}$


    Since we are not modeling the distribution of data $p(x_i|\theta) = p(x_i)$, we
    can write the log likelihood as follows.


    $\log p(D|\theta) = \log \prod_{i=1}^n p(x_i, y_i|\theta) = \sum_{i=1}^n \log
    p(x_i, y_i|\theta)$

    $= \sum_{i=1}^n \log \mathrm{Ber}\left(y \mid \sigma\left(\theta^T x\right)\right)$

    $= \sum_{i=1}^n \log \left[ \sigma\left(\theta^T x_i\right)^{y_i} \left(1 - \sigma\left(\theta^T
    x_i\right)\right)^{1 - y_i} \right]$

    $= \sum_{i=1}^n \left[ y_i \log \sigma\left(\theta^T x_i\right) + (1 - y_i) \log
    \left(1 - \sigma\left(\theta^T x_i\right)\right) \right] \tag{5.24}$


    Note that we are interested in maximizing the log likelihood or, equivalently,
    minimizing the loss or the negative log likelihood (NLL).


    $\min_{\theta} \mathrm{Loss}(\theta) = \min_{\theta} \mathrm{NLL}(\theta) = \max_{\theta}
    \log p(D|\theta) \tag{5.25}$


    We are planning on minimizing the logistic regression loss via stochastic gradient
    descent (SGD), which can be written as follows.


    $\theta_{k+1} = \theta_k - \eta_k g_k \tag{5.26}$


    Here, $g_k$ is the gradient and $\eta_k$ is the step size. To guarantee the convergence
    of SGD, the conditions expressed in the following equation, known as Robbins-Monro
    conditions, on the learning rate must be satisfied.'
