  md: "Here, $\\theta = \\{\\pi, A, E\\}$ are HMM parameters, with $\\pi$ being the\
    \ initial state distribution. The number of states $K$ is often determined by\
    \ the application. For example, we can model the sleep–wake cycle using $K = 2$\
    \ states. The data itself can be either discrete or continuous. We are going to\
    \ focus on the discrete case in which the emission matrix $E_{kl} = p(x_t = l\
    \ \\mid z_t = k)$. The transition matrix is assumed to be time invariant and equal\
    \ to $A_{ij} = p(z_t = j \\mid z_{t-1} = i)$.\n\nWe are typically interested in\
    \ predicting the unobserved latent state $z$ based on emitted observations $x$\
    \ at any given time. In mathematical notation, we are after $p(z_t = j \\mid x_{1:t})$.\
    \ Let’s call this quantity $\\alpha_t(j)$.\n\n$$\\alpha_t(j) = p(z_t = j \\mid\
    \ x_{1:t})$$  \n(7.13)\n\nLet’s compute it! Notice the recurrent relationship\
    \ between successive values of alpha. Let’s develop this recurrence.\n\n$$\\begin{aligned}\n\
    p(z_t = j \\mid x_{1:t-1})\n&= \\sum_{z_{t-1}} p(z_t = j, z_{t-1} \\mid x_{1:t-1})\
    \ \\\\\n&= \\sum_i p(z_t = j \\mid z_{t-1} = i)p(z_{t-1} = i \\mid x_{1:t-1})\
    \ \\\\\n&= \\sum_i A(i,j)\\alpha_{t-1}(i)\n\\end{aligned}$$  \n(7.14)\n\nIn the\
    \ prediction step, we are summing over all possible $i$ states and multiplying\
    \ the alpha by the transition matrix into $j$ state. Let’s use the result of the\
    \ prediction step in the update step.\n\n$$\\begin{aligned}\n\\alpha_t(j)\n&=\
    \ p(z_t = j \\mid x_{1:t}) = p(z_t = j \\mid x_t, x_{1:t-1}) \\\\\n&= \\frac{p(x_t\
    \ \\mid z_t = j, x_{1:t-1})p(z_t = j \\mid x_{1:t-1})}{p(x_t \\mid x_{1:t-1})}\
    \ \\\\\n&= \\frac{p(x_t \\mid z_t = j)p(z_t = j \\mid x_{1:t-1})}{\\sum_{z_t}p(x_t,z_t\
    \ \\mid x_{1:t-1})} \\\\\n&= \\frac{p(x_t \\mid z_t = j)p(z_t = j \\mid x_{1:t-1})}{\\\
    sum_j p(x_t \\mid z_t = j)p(z_t = j \\mid x_{1:t-1})} \\\\\n&= \\frac{1}{Z_t}E_t(j)\\\
    sum_i A(i,j)\\alpha_{t-1}(i)\n\\end{aligned}$$  \n(7.15)\n\nWe can summarize our\
    \ derivation in matrix notation as follows.\n\n$$\\alpha_t \\propto E_t(A^T\\\
    alpha_{t-1})$$  \n(7.16)\n\nGiven the recursion in alpha and the initial condition,\
    \ we can compute the latent state marginals. This algorithm is referred to as\
    \ the *forward algorithm*, due to its forward"
