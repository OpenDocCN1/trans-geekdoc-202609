    as part of active learning. Here, we will look at two query strategies: uncertainty
    sampling and query by committee.


    # UNCERTAINTY SAMPLING


    One of the simplest and most commonly used query frameworks is uncertainty sampling.
    In this framework, an active learner queries the label about which it is least
    certain. For example, in binary logistic regression, uncertainty sampling queries
