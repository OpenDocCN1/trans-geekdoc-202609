  md: 'A natural extension to the binary logistic regression is a multinomial logistic
    regression that handles more than 2 classes.


    # 5.5 Naive Bayes


    This section focuses on understanding, deriving, and implementing the naive Bayes
    algorithm. The fundamental (naive) assumption of the algorithm is that the features
    are conditionally independent, given the class label. This allows us to write
    the class conditional density as a product of one-dimensional densities.


    $p(x_i|y=c,\theta)=\prod_{j=1}^{D}p(x_{ij}|y=c,\theta_{jc})$ (5.31)


    The model is called naive because we don’t expect the features to be conditionally
    independent. However, even if the assumption is false, the model performs well
    in many scenarios. Here, we will focus on Bernoulli Naive Bayes for document classification,
    with the graphical model shown in figure 5.12. Note the shaded nodes represent
    the observed variables.


    ![](img/325742126d3ff007c6c385f4ffb5c3be_113_0.png)


    The choice of class conditional density $p(x|y=c,\theta)$ determines the type
    of Naive Bayes classifier, such as Gaussian, Bernoulli, or multinomial. In this
    section, we focus on Bernoulli naive Bayes, due to its high performance in classifying
    documents.


    Let $x_{ij}$ be Bernoulli random variables indicating the presence ($x_{ij}=1$)
    or absence ($x_{ij}=0$) of a word $j\in\{1,...,D\}$ for document $i\in\{1,...,N\}$,
    parameterized by $\theta_{jc}$ for a given class label $y=c\in\{1,...,C\}$. In
    addition, let $\pi$ be a Dirichlet distribution representing the prior over the
    class labels. Thus, the total number of learnable parameters is $|\theta|+|\pi|=O(DC)+O(C)=O(DC)$,
    where $D$ is the dictionary size and $C$ is the number of classes. Due to the
    small number of parameters, the Naive Bayes model is immune to overfitting.'
