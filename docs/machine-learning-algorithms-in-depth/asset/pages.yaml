    if available. We’ll be using the Python language throughout this book.


    # 1.5.1 Data structures


    A data structure is a way of storing and organizing data. Each data structure
    offers different performance tradeoffs, and some are more suitable for the task
    than others. We’ll be using linear data structures, such as fixed-size arrays,
    primarily in our implementation of ML algorithms, since the time to access an
    element in the array is constant O(1). We’ll also frequently use dynamically resizable
    arrays (e.g., lists in Python) to keep track of data over multiple iterations.


    Throughout the book, we’ll be using nonlinear data structures, such as maps (dictionaries)
    and sets. We’ll use these data structures because ordered dictionaries and ordered
    sets are built upon self-balanced binary search trees (BSTs) that guarantee O(n
    log n) insertion, search, and deletion operations. Finally, a hash table or unordered
    map is another commonly used, efficient data structure with O(1) access time,
    assuming no collisions.


    # 1.5.2 Problem-solving paradigms


    Most of the ML algorithms in this book can be grouped into one of four problem-solving
    paradigms: complete search, greedy, divide and conquer, and dynamic programming.
    Complete search is a method for solving a problem by traversing the entire search
    space, looking for a solution. A machine learning example in which a complete
    search takes place is an exact inference by complete enumeration. During exact
    inference, we must completely specify a number of probability tables to carry
    out our calculations.


