- pgno: 263
  md: "gradient (in the negative direction in the case of minimization and in the\
    \ positive direction in the case of maximization).\n\nThe learning rate is a function\
    \ of iteration $k$ and is the single most important hyperparameter. A learning\
    \ rate that is too high (e.g., $> 0.1$) can lead to parameter updates that miss\
    \ the optimum value; a learning rate that is too low (e.g., $< 1e-5$) will result\
    \ in an unnecessarily long training time. A good strategy is to start with a learning\
    \ rate of $1e-3$ and use a learning rate schedule that reduces the learning rate\
    \ as a function of iterations. In general, we want the learning rate to satisfy\
    \ the Robbins-Monroe conditions.\n\n$$\\sum_{k} \\epsilon_k = \\infty$$\n$$\\\
    sum_{k} \\epsilon_k^2 < \\infty$$  \n(10.14)\n\nThe first condition ensures the\
    \ algorithm will be able to find a locally optimal solution, regardless of the\
    \ starting point, and the second one controls oscillations.\n\nMomentum accumulates\
    \ the exponentially decaying moving average of past gradients and continues to\
    \ move in their direction; thus, the step size depends on how large and aligned\
    \ the sequence of gradients are. Common values of momentum parameter $\\alpha$\
    \ are 0.5 and 0.9.\n\n$$v = \\alpha v - \\epsilon \\nabla_{\\theta} \\left( \\\
    frac{1}{m} \\sum_{i} L\\left( f\\left( x^{(i)}; \\theta \\right), y^{(i)} \\right)\
    \ \\right)$$\n$$\\theta = \\theta + v$$  \n(10.15)\n\nNesterov momentum is inspired\
    \ by Nesterov's accelerated gradient method. The difference between Nesterov and\
    \ standard momentum is where the gradient is evaluated, with the gradient being\
    \ evaluated after the current velocity is applied in Nesterov momentum. Thus,\
    \ Nesterov momentum adds a correction factor to the gradient.\n\n$$v = \\alpha\
    \ v - \\epsilon \\nabla_{\\theta} \\left( \\frac{1}{m} \\sum_{i} L\\left( f\\\
    left( x^{(i)}; \\theta + \\alpha \\times v \\right), y^{(i)} \\right) \\right)$$\n\
    $$\\theta = \\theta + v$$  \n(10.16)\n\nAdaGrad is an adaptive method for setting\
    \ the learning rate (John Duchi, Elad Hazan, and Yoram Singer's “Adaptive Subgradient\
    \ Methods for Online Learning and Stochastic Optimization,” Journal of Machine\
    \ Learning Research, 2011). Consider the two scenarios in figure 10.12.\n\nIn\
    \ the case of a slowly varying objective (left), the gradient would typically\
    \ (at most points) have a small magnitude. As a result, we would need a large\
    \ learning rate to"
