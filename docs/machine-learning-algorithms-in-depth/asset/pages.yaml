- pgno: 192
  md: 'can’t compute $p(x_i, z_i | \theta)$, but we can compute an expectation of
    $\ell_c(\theta)$ wrt to parameters $\theta^{(k-1)}$ from the previous iteration.


    $$l_c(\theta) = \sum_{i=1}^{N} \log p(x_i, z_i | \theta) \tag{8.7}$$


    The goal of the E step is to compute $Q(\theta, \theta^{(k-1)})$, on which the
    ML/MAP estimates depend. The goal of the M step is to recompute $\theta$ by finding
    the ML/MAP estimates.


    $$\text{E-step} : \quad Q\left(\theta, \theta^{(k-1)}\right) = E_{\theta^{(k-1)}}\left[\ell_c(\theta)
    | D, \theta^{(k-1)}\right]$$ $$\text{M-step} : \quad \theta^{(k)} = \arg\max_{\theta}
    Q\left(\theta, \theta^{(k-1)}\right) + \log p(\theta) \tag{8.8}$$


    To derive the EM algorithm for GMM, we first need to compute the expected complete
    data log likelihood.


    $$Q(\theta, \theta^{(k-1)}) = E\left[\sum_i \log p(x_i, z_i | \theta)\right]$$
    $$= \sum_i E\left[\log \prod_{k=1}^{K} \left(\pi_k p(x_i | \theta_k)\right)^{\mathbf{1}\{z_i=k\}}\right]$$
    $$= \sum_i \sum_k E\left[\mathbf{1}\{z_i = k\}\right] \log \left[\pi_k p(x_i |
    \theta_k)\right]$$ $$= \sum_i \sum_k p\left(z_i = k | x_i, \theta^{(k-1)}\right)
    \log \left[\pi_k p(x_i | \theta_k)\right]$$ $$= \sum_i \sum_k r_{ik} \log \pi_k
    + \sum_i \sum_k r_{ik} \log p(x_i | \theta_k) \tag{8.9}$$


    Here, $r_{ik} = p(z_i = k | x_i, \theta^{(k-1)})$ is the soft assignment of point
    $x_i$ to cluster $k$.


    We now start the E step. Given $\theta^{(k-1)}$, we want to compute the soft assignments.


    $$r_{ik} = p\left(z_i = k | x_i, \theta^{(k-1)}\right)$$ $$= \frac{p\left(z_i
    = k, x_i | \theta^{(k-1)}\right)}{\sum_{k=1}^{K} p\left(z_i = k, x_i | \theta^{(k-1)}\right)}$$
    $$= \frac{p\left(x_i | z_i = k, \theta^{(k-1)}\right) \pi_k}{\sum_{k=1}^{K} p\left(x_i
    | z_i = k, \theta^{(k-1)}\right) \pi_k} \tag{8.10}$$'
