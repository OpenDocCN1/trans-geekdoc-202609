  md: '# 2.6 Metropolis-Hastings sampling


    Let’s look at a more general MCMC algorithm for sampling from distributions. Our
    goal is to construct a Markov chain whose stationary distribution is equal to
    our target distribution p(x). The target distribution p(x) is the distribution
    (typically a posterior p(θ|x) or a density function p(θ)) we are interested in
    drawing samples from.


    The basic idea in the Metropolis-Hastings (MH) algorithm is to propose a move
    from the current state x to a new state x′ based on a proposal distribution q(x′|x),
    and then either accept or reject the proposed state according to MH ratio that
    ensures that detailed balance is satisfied, as shown in equation 2.18.


    p(x′) q(x|x′) = p(x) q(x′|x)  (2.18)


    The detailed balance equation states that the probability of transitioning out
    of state x is equal to the probability of transitioning into state x. To derive
    the MH ratio, assume for a moment that the preceding detailed balanced equation
    is not satisfied, and then there must exist a correction factor r(x′|x) such that
    the two sides are equal, and solving for it leads to the following MH ratio.


    p(x′) q(x|x′) = r(x′|x) p(x) q(x′|x)


    r(x′|x) = min[ 1, p(x′) q(x|x′) / p(x) q(x′|x) ]  (2.19)


    We can summarize the Metropolis-Hastings algorithm as shown in figure 2.13.


    +   Sample from the proposal distribution

    +   1: Init x₀ at random

    +   2: for k = 0, 1, 2, … do

    +   3:   propose a new state x′ ~ q(x′|xₖ)

    +   4:   compute metropolis-hastings ratio:

    +   5:   r(x′|x) = min[ 1, p(x′)q(x|x′) / p(x)q(x′|x) ]

    +   6:   set xₖ₊₁ = { x′, with prob. r(x′|x) ← Accepts the sample

    +                   xₖ, with prob. 1 − r(x′|x) ← Rejects the sample }

    +   7: end for


    Figure 2.13 Metropolis-Hastings pseudo-code


    Let’s implement the MH algorithm for a multivariate mixture of Gaussian target
    distribution and a Gaussian proposal distribution.


    p(x) = Σₖ₌₁ᴷ π(k) N(x; μₖ, Σₖ)

    q(x′|x) = N(x′|x, Σ)  (2.20)'
