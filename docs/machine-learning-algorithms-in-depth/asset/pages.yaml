  md: 'choice of data structure can simplify the runtime of an algorithm. Each data
    structure offers different performance tradeoffs. As a result, it’s important
    to understand how data structures work.


    # #### 4.1.1 Linear


    A data structure is considered *linear* if its elements are arranged in a linear
    fashion. The simplest example of a *linear* data structure is a *fixed-size array*
    (where the size of the array may be specified as a constraint of the problem).
    The time it takes to access an element in an array is constant: $O(1)$. If the
    size of the array is not known ahead of time, it’s best to use a *dynamically
    resizable array* (e.g., a List in Python or a Vector in C++), as these data structures
    are designed to handle resizing natively.


    Two common operations applied to arrays are searching and sorting. The simplest
    search is a linear scan through all elements in $O(n)$ time. If the array is sorted,
    we can use binary search in $O(\log n)$ time, which is an example of a divide-and-conquer
    algorithm, which we will discuss soon. Naive array sorting algorithms, such as
    selection sort and insertion sort, have a complexity of $O(n^2)$ and are, therefore,
    only suitable for small inputs. In general, comparison-based sorts where elements
    are compared pairwise, such as merge, heap, or quicksort, have the runtime of
    $O(n \log n)$ because the time complexity can be thought of as traversing a complete
    binary tree, where each leaf represents one sorted ordering. In this representation,
    the height of the tree $h$ is equal to the algorithm runtime. Since there are
    $n!$ possible orderings (leaf nodes), we can bound the runtime as follows.


    $$\begin{aligned}

    h &= \log n! = \log n(n - 1)(n - 2) \times \cdots \times 1 \\

    &= \log n + \log(n - 1) + \cdots + \log 1 \\

    &< \log n + \log n + \cdots + \log n = n \log n = O(n \log n)

    \end{aligned} \tag{4.1}$$


    If we add additional constraints on the input, we can construct linear-time $O(n)$
    sorting algorithms, such as count sort, radix sort, and bucket sort. For example,
    count sort can be applied to integers in a small range, and radix sort works by
    applying count sort digit by digit, as discussed in *Competitive Programming*
    by Steven Halim (2010). Making algorithms distributed can further reduce runtime
    as described in *The Art of Multiprocessor Programming* by Maurice Herlihy and
    Nir Shavit (2012).


    A *linked list* consists of nodes that store a value and a next pointer, starting
    from the head node. It’s usually avoided due to its linear $O(n)$ search time.
    A *stack* allows $O(1)$ insertions (push) and $O(1)$ deletions (pop) in the last-in,
    first-out (LIFO) order. This is particularly useful in algorithms that are implemented
    recursively (e.g., bracket matching or topological sort). A *queue* allows $O(1)$
    insertion (enqueue) from the back and $O(1)$ deletion (dequeue) from the front;
    thus, it follows the first-in, first-out (FIFO) model. It’s a commonly used data
