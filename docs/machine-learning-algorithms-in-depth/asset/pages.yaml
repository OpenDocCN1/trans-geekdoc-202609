    **Figure 11.9**  Attention matrix heatmap for neural machine translation


    Self-attention is the key component of transformer architecture. A *transformer*
    is a Seq2Seq model that uses attention in the encoder as well as the decoder,
    thus eliminating the need for RNNs. Figure 11.10 shows the Transformer architecture
    (Vaswani et al., “Attention Is All You Need,” NeurIPS, 2017). Let’s look more
    closely at the building blocks of transformers.


    At a high level, we see an encoder–decoder architecture with inputs in the left
    branch and outputs in the right branch. We can identify multihead attention, positional
    encodings, dense and normalization layers, and residual connections for ease of
    gradient backpropagation.'
