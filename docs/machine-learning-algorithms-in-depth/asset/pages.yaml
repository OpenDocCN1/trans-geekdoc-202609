    variance of gradient estimates (smaller gradient noise allows for larger learning
    rates and leads to faster convergence). Techniques such as adaptive learning rates
    and minibatch size as well as variance reduction, such as control variates, nonuniform
    sampling, and other approaches, are used to speed up convergence.


    In addition to stochastic optimization, leveraging model structure can help achieve
    the same objective. Examples include collapsed, sparse, parallel, and distributed
    inference. The collapsed VI relies on the idea of analytically integrating out
    certain model parameters. Sparse inference exploits either sparsely distributed
    parameters or datasets that can be summarized by a small number of representative
    points. In addition, structured VI examines variational distributions that are
    not fully factorized, leading to more accurate approximations.


    Finally, amortized variational inference is an interesting research area that
    combines probabilistic graphical models and neural networks. The term *amortized*
    refers to utilizing inference from past computations to support future computations.
    Amortized inference became a popular tool for inference in deep latent variable
    models (DLVM), such as the variational autoencoder (VAE; see Diederik P. Kingma
    and Max Welling’s, “Auto-Encoding Variational Bayes,” arXiv, 2013). Similarly,
    neural networks can be used to learn the parameters of conditional distributions
    in directed probabilistic graphical models (PGM; see Diederik P. Kingma’s, “Variational
    Inference and Deep Learning: A New Synthesis”, PhD Thesis, 2017).


