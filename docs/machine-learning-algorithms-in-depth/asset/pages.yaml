- pgno: 23
  md: '# Machine learning algorithms


    # This chapter covers


    +   - Types of ML algorithms

    +   - The importance of learning algorithms from scratch

    +   - An introduction to Bayesian inference and deep learning

    +   - Software implementation of machine learning algorithms from scratch


    An *algorithm* is a sequence of steps required to achieve a particular task. An
    algorithm takes an input, performs a sequence of operations, and produces a desired
    output. The simplest example of an algorithm is *sorting*, where given a list
    of integers, we perform a sequence of operations to produce a sorted list. A sorted
    list enables us to organize information better and find answers in our data.


    Two popular questions to ask about an algorithm are how fast it runs (runtime
    complexity) and how much memory it takes (memory or space complexity) for an input
    of size *n*. For example, a comparison-based sort, as we’ll see later, has *O(n
    log n)* run-time complexity and requires *O(n)* memory storage.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'There are many approaches to sorting, and in each case, in the classic algorithmic
    paradigm, the algorithm designer creates a set of instructions. Imagine a world
    where you can learn the instructions based on a sequence of input and output examples
    available to you. This is a setting of the ML algorithmic paradigm. Like a human
    brain learns when one plays a connect-the-dots game or sketches a natural landscape,
    we compare the desired output with what we have at each step and fill in the gaps.
    This, in broad strokes, is what (supervised) machine learning (ML) algorithms
    do. During training, ML algorithms learn the rules (e.g., classification boundaries)
    based on training examples by optimizing an objective function. During testing,
    ML algorithms apply previously learned rules to new input data points and provide
    a prediction, as shown in figure 1.1.


    ![](img/325742126d3ff007c6c385f4ffb5c3be_24_0.png)


    Figure 1.1 Supervised learning: training (left) and testing (right)


    # 1.1 Types of ML algorithms


    Let’s unpack the previous paragraph a little bit and introduce some notation.
    This book focuses on ML algorithms that can be grouped together into the following
    categories: supervised learning, unsupervised learning, and deep learning. In
    supervised learning, the task is to learn a mapping f from inputs x to outputs
    y given a training dataset D = {(x₁, y₁), …, (xₙ, yₙ)} of n input–output pairs.
    In other words, we are given n examples of what the output should look like given
    the input. The output y is also often referred to as the label, and it is the
    supervisory signal that tells our algorithm what the correct answer is.


    Supervised learning can be subdivided into classification and regression, depending
    on the quantity we are trying to predict. If our output y is a discrete quantity
    (e.g., K distinct classes), we have a classification problem. On the other hand,
    if our output y is a continuous quantity (e.g., a real number, such as stock price)
    we have a regression problem.


    Thus, the nature of the problem changes based on the quantity y we are trying
    to predict. We want to get as close as possible to the ground truth value of y.


    A common way to measure performance or closeness to ground truth is via the loss
    function. The loss function computes a distance between the prediction and the
    true label. Let y = f(x; θ) be our ML algorithm that maps input examples x to
    output labels y, parameterized by θ, where θ captures all the learnable parameters
    of our ML algorithm.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Then, we can define the classification loss function as the number of misclassified
    samples, as represented by equation 1.1.


    $$L(\theta)=\frac{1}{n}\sum_{i=1}^{n}\mathbf{1}[y_i\ne f(x_i;\theta)] \tag{1.1}$$


    Here, $\mathbf{1}[\,]$ is an indicator function that is equal to 1 when the argument
    inside is true and 0 otherwise. The expression in equation 1.1 denotes that we
    are adding up all the instances in which our prediction $f(x_i;\theta)$ did not
    match the ground truth label $y_i$, and dividing by the total number of examples
    $n$. In other words, we are computing an average misclassification rate. Our goal
    is to minimize the loss function (i.e., find a set of parameters $\theta$ that
    make the misclassification rate as close to zero as possible). Note that there
    are many alternative loss functions for classification, such as cross-entropy,
    which we will examine in later chapters.


    For continuous labels or response variables, a common loss function is the *mean
    squared error* (MSE). The MSE measures how far away our estimate is from the ground
    truth, as illustrated in equation 1.2.


    $$L(\theta)=\frac{1}{n}\sum_{i=1}^{n}[y_i-f(x_i;\theta)]^2 \tag{1.2}$$


    As we can see from the equation, we subtract our prediction from the ground truth
    label, square it, and average the result over the data points. By taking the square
    we eliminate the negative sign and penalize large deviations from the ground truth.


    One of the central goals of ML is to be able to generalize to unseen examples.
    We want to achieve high accuracy (low loss) on not just the training data (which
    is already labeled) but on new, unseen, test data examples. This generalization
    ability is what makes ML so attractive: if we can design ML algorithms that can
    see outside their training box, we’ll be one step closer to artificial general
    intelligence (AGI).


    In *unsupervised learning*, we are not given the label $y$, nor are we learning
    the mapping between input and output examples; instead, we are interested in making
    sense of the data itself. Usually, that implies discovering patterns in data.
    It’s often easier to discover patterns if we project high-dimensional data into
    a lower-dimensional space as shown in figure 1.2. Therefore, in the case of unsupervised
    learning, our training dataset consists of $D=\{x_1,\ldots,x_n\}$ of $n$ input
    examples, without any corresponding labels $y$. The simplest example of unsupervised
    learning is finding clusters within data. Intuitively, we know that data points
    that belong to the same cluster have similar characteristics. In fact, data points
    within a cluster can be represented by the cluster center as an exemplar and used
    as part of a data compression algorithm. Alternatively, we can look at the distances
    between clusters in a projected lower-dimensional space to understand the interrelation
    between different groups. Additionally, a point that’s far away from all the existing
    clusters can be considered an anomaly, leading to an anomaly'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'detection algorithm. As you can see, there’s an infinite number of interesting
    use cases that arise from unsupervised learning, and throughout this book, we’ll
    be learning some of the most intriguing algorithms in that space from scratch.


    ![](img/325742126d3ff007c6c385f4ffb5c3be_26_0.png)


    Figure 1.2 Unsupervised learning: clusters of data points projected onto 2-dimensional
    space


    Another very important area of modern machine algorithms is deep learning. The
    name comes from a stack of computational layers forming a computational graph
    together. The depth of this graph refers to sequential computation and the breadth
    to parallel computation.


    As we’ll see, deep learning models gradually refine their parameters through a
    backpropagation algorithm until they meet the objective function. Deep learning
    models have permeated the industry due to their ability to solve complex problems
    with high accuracy. For example, figure 1.3 shows a deep learning architecture
    for sentiment analysis. We’ll learn more about what individual blocks represent
    in future chapters.


    ![](img/325742126d3ff007c6c385f4ffb5c3be_26_1.png)


    Figure 1.3 Deep neural network (DNN) architecture for sentiment analysis


    Deep learning is a very active research area, and we’ll be focusing on modern
    deep learning algorithms throughout this book. For example, in self-supervised
    learning, used in transformer models, we are using the context and structure of
    the natural'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'language as a supervisory signal, thereby extracting the labels from the data
    itself. In addition to classic applications of deep learning in natural language
    processing (NLP) and computer vision (CV), we’ll discuss generative models, learning
    how to predict time-series data and journey into relational graph data.


    # 1.2 Why learn algorithms from scratch?


    Understanding ML algorithms from scratch has several valuable outcomes for the
    reader. First, we will be able to choose the right algorithm for the task. By
    knowing the inner workings of an algorithm, we can understand its shortcomings,
    assumptions made in the derivation of the algorithm, as well as advantages in
    different data scenarios. This enables us to exercise judgment when selecting
    the right solution to a problem and save time by eliminating approaches that don’t
    work.


    Second, we will be able to explain the results of a given algorithm to stakeholders.
