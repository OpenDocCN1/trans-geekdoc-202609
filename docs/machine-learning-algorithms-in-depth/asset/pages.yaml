  md: 'We can write down the class conditional density as shown in equation 5.32.


    $p(x|y=c,\theta)=\prod_{i=1}^n\prod_{j=1}^D p(x_{ij}|y=c,\theta_{jc})=\prod_{i=1}^n\prod_{j=1}^D
    \text{Bernoulli}(\theta_{jc})$ (5.32)


    We can derive the Naive Bayes inference algorithm by maximizing the log likelihood.
    Consider words $x_i$ in a single document $i$.


    $p(x_i,y_i|\theta)=p(y_i|\pi)\prod_{j=1}^D p(x_{ij}|y_i,\theta)$

    $=\prod_{c=1}^C \pi_c^{1[y_i=c]}\prod_{j=1}^D\prod_{c=1}^C p(x_{ij}|\theta_{jc})^{1[y_i=c]}$
    (5.33)


    Using the Naive Bayes assumption, we can compute the log likelihood objective.


    $\log p(D|\theta)=\log\prod_{i=1}^n p(x_i,y_i|\theta)=\sum_{i=1}^n\log p(x_i,y_i|\theta)$

    $=\sum_{c=1}^C N_c\log\pi_c+\sum_{j=1}^D\sum_{c=1}^C\sum_{i:y_i=c}\log p(x_{ij}|\theta_{jc})$
    (5.34)


    Note this is a constrained optimization program, since the probabilities of class
    labels must sum to one: $\sum\pi_c=1$. We can solve the optimization problem in
    equation 5.34 using a Lagrangian by including the constraint in the objective
    function and setting the gradient of the Lagrangian $L(\theta,\lambda)$ with respect
    to (wrt) model parameters to zero.


    $L(\theta,\lambda)=\log p(D|\theta)+\lambda\left(1-\sum_c\pi_c\right)$ (5.35)


    Differentiating wrt $\pi_c$, we get the following.


    $\frac{d}{d\pi_c}L(\theta,\lambda)=\frac{d}{d\pi_c}\log p(D|\theta)-\lambda=N_c\frac{1}{\pi_c}-\lambda=0$
    (5.36)


    This gives us an expression for $\pi_c$ in terms of $\lambda$: $\pi_c=(1/\lambda)N_c$.
    To solve for $\lambda$, we use our sum to one constraint.


    $\sum_c\pi_c=1\to\sum_c\frac{1}{\lambda}N_c=1\to\lambda=\sum_c N_c$ (5.37)


    Substituting $\lambda$ back into expression for $\pi_c$, we get $\pi_c=N_c/\sum
    N_c=N_c/N_{tot}$. Similarly, we can compute the optimum $\theta_{jc}$ parameters
    by setting the gradient of objective wrt $\theta_{jc}$ to zero.'
