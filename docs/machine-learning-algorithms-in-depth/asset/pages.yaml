    # 8.1 Show that the Dirichlet distribution Dir(θ|α) is a conjugate prior to the
    multinomial likelihood by computing the posterior. How does the shape of the posterior
    vary as a function of the posterior counts?


    Suppose we observe N dice rolls D={x1,...,xn}, where xi in {1,...,K}. If we assume
    the data is independent and identically distributed, the likelihood has the following
    form:


    p(D|θ) = \prod_{k=1}^{K} \theta_k^{N_k}


    Here, N_k is the number of times event k occurred. Since the parameter vector
    lives on a K-dimensional probability simplex, we need a prior that has support
    over this simplex. The Dirichlet distribution satisfies this criterion: Dir(θ|α)
    = \frac{1}{B(α)} \prod_{k=1}^{K} \theta_k^{α_k-1}. Multiplying the likelihood
    and the prior, we see that the posterior is also Dirichlet: p(θ|D) ∝ p(D|θ)p(θ)
    ∝ \prod_{k=1}^{K} \theta_k^{N_k} \theta_k^{α_k-1} = \prod_{k=1}^{K} \theta_k^{α_k+N_k-1}
    = Dir(θ|α_1+N_1, ..., α_K+N_K)'
