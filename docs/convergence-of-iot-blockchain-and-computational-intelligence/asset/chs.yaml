  \ | 用于实时数据采集的物联网系统开发 | 实际消费信息 |\n\n#### 12.6.4 逆向物流\n\n从运营管理的角度来看，逆向物流现象引起了商业界和学术界的广泛关注。进入供应链的商品逆向流动影响了库存管理的动态。这反过来又影响了提交给供应商的订单动态，并因此影响了供应链在订单和库存波动方面的绩效表现\
  \ [[36]](#chapter12.xhtml#ref12_36)。表 12.1 强调了物联网的实施如何使闭环供应链对企业成为可行。研究还介绍了包含存储、感知、数据处理、推理和通信功能的智能产品，及其在产品生命周期管理中的关键作用。更集成的软件系统（如智能嵌入式系统）正在兴起，它们向更高层级的信息管理系统提供实时数据\
  \ [[37]](#chapter12.xhtml#ref12_37)。需要一种逆向管理信息系统，能够垂直和水平地记录产品属性和生命周期，帮助企业改进决策和运营效率\
  \ [[38]](#chapter12.xhtml#ref12_38)。家庭中的物联网在现有商业模式之外也拥有巨大潜力，因为向下的数据提供了对消费者如何消耗资源的洞察，增加了开发新型产品/服务的机会，有利于环境保护，并帮助正向和逆向供应链进行交互以便在特定情境下使用\
  \ [[39]](#chapter12.xhtml#ref12_39)。消费者控制来自物联网的大数据，关于访问此类数据的对话为原始数据市场以及为客户和企业利益而修改数据的应用程序市场奠定了基础。如果企业能以可接受的安全性、隐私和可靠性合规性为交换，与客户交换数据权利，此类信息对企业至关重要\
  \ [[40]](#chapter12.xhtml#ref12_40)。\n\n### 12.7 用于创新供应链管理的 RFID\n\nRFID 技术凭借唯一产品标识、简单连接和实时信息可用性等众多特性，为供应链提供了多种优势\
  \ [[26]](#chapter12.xhtml#ref12_26)。RFID 专门用于获取特定产品的数据。它们通过专用阅读器传输到系统，并包含大量数据。尽管\
  \ RFID 在供应链中的应用并非新事物，但许多专家仍在研究这一主题 [[25]](#chapter12.xhtml#ref12_25)。实际上，还有其他值得研究的领域，包括库存管理、订单管理、仓库管理和生产调度。RFID\
  \ 在 SCM 中实施的总体框架如图 12.3 所示。\n\n![FIGURE 12.3 Usage of RFID in supply-chain management.](img/fig12_3.jpg)\n\
  \n图 12.3 RFID 在供应链管理中的应用。\n\n#### 12.7.1 集成中的 RFID\n\n\n\n\n\n##### 供应链管理中的 RFID\
  \ 和物联网\n\n##### 供应链集成中的 RFID 技术\n\n一个成功的供应链，尤其是全球供应链，依赖于有效的集成——即通信和信息共享。如果您的供应链不是互联的，那么经营您的业务就类似于让服务员填写四份不同的表格，仅仅是为了把订单发送给厨房工作人员。这很荒谬，对您帮助不大。不集成您的供应链是不可理喻的。供应商、仓库和运输公司能够越快地交换信息，您的供应链移动物品的效率就越高。一个更紧密连接的供应链就是一个更强大的供应链。\n\
  \nRFID 技术使数据访问和共享变得更加简单。RFID 标签使企业能够轻松追踪在途商品并收集有关它们的信息，随后将这些信息发送给其他供应链参与者。然而，并非每个行业都能利用\
  \ RFID 技术充分集成供应链活动。例如，沃尔玛在 2003 年要求其前 100 大供应商在 18 个月内在其发货物上贴上 RFID 标签，并要求其他供应商在\
  \ 2006 年底前完成。该计划最终失败了，主要是因为它似乎没有任何优势。RFID 技术承诺的极高扫描准确率并未实现，因为 RFID 无法穿透金属和液体。RFID\
  \ 技术特别适用于时装服装、化妆品、珠宝、医疗保健和制药等产品不阻碍 RFID 可读性的行业。\n\n#### 12.7.2 运营中的 RFID\n\n公司的供应链成败取决于日常运营。一句名言对此总结得最好：“我们是我们反复做的事情的总和。因此，卓越不是一种行为，而是一种习惯。”优先考虑卓越日常运营的供应链管理者创造的供应链超越了其各部分之和，并同时实现两大目标：增加收入和降低运营成本。供应链管理者可以通过使用绩效数据来评估他们每天的表现。哪些程序能提高员工生产力？哪里需要额外的程序？哪里存在未被发掘的机会？\n\
  \n在 RFID 扫描仪的帮助下，公司可以简单地追踪货物在仓库中的流向。由于企业可以获取仓库中有什么、正在运送什么到仓库以及已发送给客户什么的实时数据，库存管理变得相当有效。虽然\
  \ RFID 与仓库控制系统的集成为未来的无人机功能提供了潜力，但 RFID 与 SCM 系统的集成使企业能够获得实时信息。这可能是什么样子？为了追踪货物，无人机基本上会在仓库周围飞行，并在几厘米外收集数据。尽管这种策略的广泛实施还有很长的路要走，但\
  \ RFID 技术在仓库中的潜力极具吸引力。一家利用 RFID 标签实现运营效率的知名企业是 Zara。作为一家快时尚零售商，Zara 的整个商业战略依赖于其提供时尚、昂贵商品的平价替代品的能力。这种商业战略的主要缺点之一是潮流来得快去得也快，但供应商可能需要提前数月通知才能建立足够的库存。\n\
  \n这家大型国际零售商在整个供应链中使用 RFID 标签，以实时追踪其庞大的库存。Zara 从生产过程开始对服装进行加密，以实现端到端的可追溯性。库存管理可以快速确定商品是否缺货，同时也使\
  \ Zara 能够针对快速流动的商品更快地进行生产。值得注意的是，Zara 自己生产衣服。\n\n#### 12.7.3 采购中的 RFID\n\n如果客户无法获得所需的原材料，就无法制造所需的产品。这就是为什么采购是供应链流程中的关键步骤。无论客户是制造计算机、快速消费品还是服装，都需要组件来制造成品。与拥有\
  \ RFID 技术的供应商合作，使客户能够实时查看库存中的原材料和半成品。RFID 还使快速验证每批货物是否包含所购买的物品变得简单，这缩短了接收阶段的等待时间，并加快了货物向生产阶段的转移。\n\
  \n如果原材料存在缺陷，RFID 可以提供一定的保护。例如，假设您的一家食品供应商报告了您使用的一种原料受到污染。如果您和您的供应商都使用 RFID 技术，您的数据可用于识别哪些成品使用了那种特定的原材料。客户得到保护，而向该供应商追偿的流程也得以加速。\n\
  \n#### 12.7.4 配送中的 RFID\n\n从起点到消费点，物品通过物流进行协调和移动。无论是成品分销到仓库、单个商品分销给客户，还是原材料分销给制造商，有效的物流都是必不可少的。对于移动货物的企业来说，坚持质量控制、达到约定的服务标准、降低成本等至关重要。\n\
  \n所有这些都依赖于信息的准确及时传递。如果您的供应商附近有恶劣天气，了解您产品的状况至关重要。它们已经离开危险区了吗，还是您需要立即制定备选计划？运输集装箱有没有发生温度变化，可能会影响药品等精密产品的完整性？实时信息使通过货运进行配送的快速决策成为可能。\n\
  \n### 12.8 用于逆向物流的基于物联网的模糊逻辑决策系统\n\n当清晰量转换为模糊量时，这个过程称为模糊化。隶属度函数作为转换为模糊值的例证。每个输入参与特定集合的程度由隶属度函数以图形方式表示。隶属度函数可以是任何类型，具体取决于问题的性质。模糊化方法可能涉及为给定的清晰量分配不同集合的隶属度值。\n\
  \n模糊系统使用基于规则的推理来选择输出答案。它是一种使用 IF-THEN 规则的特定逻辑。为了执行推理过程，模糊推理系统评估每一条规则 [[49]](#chapter12.xhtml#ref12_49)。模糊推理系统的概念框架如\
  \ 图 12.4 所示。\n\n![图 12.4 模糊推理系统的概念框架。](img/fig12_4.jpg)\n\n图 12.4 模糊推理系统的概念框架。\n\
  \n去模糊化是将模糊值转换为清晰值的过程。产生的结果是模糊的，不能直接使用。因此，为了进一步处理，必须将模糊量转换为清晰量。可以使用多种技术来实现这一点。然而，文献\
  \ [[50]](#chapter12.xhtml#ref12_50) 在其策略中使用了最大隶属度原则法。在这种简单的方法中，输出隶属度函数（针对所有集合）被视为单值。基于模糊逻辑的技术首先建立一个要包含在分析中的前所未有的事件列表，这很像传统的趋势影响分析\
  \ (TIA)。为每个此类事件找到一组相关属性。然后，必须为每个属性建立匹配的特征和模糊值范围。\n\n\n\n\n\n#### 逆向物流\n\n逆向物流是指将货物从最终用户沿供应链向上游送回生产商或零售商的过程。为消费者提供退货服务是明智的商业之举，无论客户是退回不需要的产品、产品已达到其生命周期末期，还是产品损坏或有缺陷。这就是逆向物流发挥作用的地方。当产品需要丢弃或回收时，该程序也适用，它涵盖了最终用户负责产品翻新、处置甚至转售的情况\
  \ [51]。\n\n处理退货商品的方法取决于相关的逆向物流类型、组织的业务类型以及其所在的行业。例如，虽然咖啡胶囊制造商可能会为客户提供废弃胶囊的邮寄回收计划，但服装零售商通常处理一般的客户退货。酿酒厂利用逆向物流回收其桶罐，并对其进行清洗和重新灌装以便继续分销。为了确保最佳效率并利用优化逆向物流流程以促进环境可持续性的任何激励措施，每家企业都应有书面记录的流程\
  \ [52]。\n\n考虑这样一种场景：公司希望利用客户不再使用或需要处置的产品（吸尘器）。公司可以对这些产品进行回收，以获得经济效益并保持环境可持续性。主要挑战在于预测联系客户进行产品处置的正确时机，或产品不再被使用的时机。可以利用模糊化系统，通过安装在产品内部的传感器收集其维护历史、健康状况、利用率和非活跃模式等信息，来预测客户愿意处置产品的场景。\n\
  \n##### 12.8.1 输入 1：维护/维修频率\n\n模糊集用 `F` 表示，集合的元素用 `f[i]` 表示，隶属度函数用 `μF` 表示，并假设为三角形。模糊集\
  \ (`f`) 使用公式 (12.1) 计算。\n\n其图形表示如 图 12.5 所示。\n\n![FIGURE 12.5 Fuzzy Set of μF(fi).](img/fig12_5.jpg)\n\
  \n图 12.5 `μF` 的模糊集。\n\n```\nF = {\\sum_{i = 1}^{n}\\frac{\\mu_{F~}\\left( f_{i}\
  \ \\right)}{\\left( f_{i} \\right)}}\n```\n\n(12.1)\n\n此处 `F = {L,M,H}`，其中 `L` 表示低值，`M`\
  \ 表示中值，`H` 表示高值。维护/维修频率的高值表明客户极有可能购买新产品，并愿意处置旧产品。\n\n##### 12.8.2 输入 2：产品时间利用率\n\
  \n模糊集用 (`U`) 表示，集合的元素用 `u[i]` 表示，隶属度函数用 `μU` 表示，并假设为三角形。模糊集 (`U`) 使用公式 (12.2) 计算。\n\
  \n其图形表示如 图 12.6 所示。\n\n![FIGURE 12.6 Fuzzy set of μU(ui).](img/fig12_6.jpg)\n\n\
  图 12.6 `μU` 的模糊集。\n\n```\nU = {\\sum_{i = 1}^{n}\\frac{\\mu_{U~}\\left( u_{i} \\\
  right)}{\\left( u_{i} \\right)}}\n```\n\n(12.2)\n\n`U={L,M,H}`，其中 `L` 表示低值，`M` 表示中值，`H`\
  \ 表示高值。从产品的时间利用率可以推断，该产品在客户的日常生活中扮演着重要角色。\n\n##### 12.8.3 输入 3：产品非活跃模式\n\n模糊集用 (`M`)\
  \ 表示，集合的元素用 `m[i]` 表示，隶属度函数用 `μM` 表示，并假设为三角形。模糊集 (`M`) 使用公式 (12.3) 计算。\n\n其图形表示如\
  \ 图 12.7 所示。\n\n![FIGURE 12.7 Fuzzy Set of μM(mi).](img/fig12_7.jpg)\n\n图 12.7 `μM`\
  \ 的模糊集。\n\n```\nM = {\\sum_{i = 1}^{n}\\frac{\\mu_{M~}\\left( m_{i} \\right)}{\\\
  left( m_{i} \\right)}}\n```\n\n(12.3)\n\n`M={VL, L, N, H, VH}`，其中 `VL` 表示极低值，`L`\
  \ 表示低值，`N` 表示正常值，`H` 表示高值，`VH` 表示极高值。非活跃模式的值越大，可以推断出客户对该产品的需求不大，可能愿意处置或转售。\n\n#####\
  \ 12.8.4 输出：处置意向\n\n模糊集用 `DI` 表示，集合的元素用 `di[i]` 表示，隶属度函数用 `μDI` 表示，并假设为三角形。模糊集 (`DI`)\
  \ 使用公式 (12.4) 计算。\n\n其图形表示如 图 12.8 所示。\n\n![FIGURE 12.8 Fuzzy Set of μDI(dii).](img/fig12_8.jpg)\n\
  \n图 12.8 `μDI` 的模糊集。\n\n```\nDI = {\\sum_{i = 1}^{n}\\frac{\\mu_{DI~}\\left( {di}_{i}\
  \ \\right)}{\\left( {di}_{i} \\right)}}\n```\n\n(12.4)\n\n此处，`DI={DN, NL, N, L,\
  \ ML}`，其中 `DN` 表示“绝不”值，`NL` 表示“不太可能”值，`N` 表示“中性”值，`L` 表示“可能”值，`ML` 表示“极可能”值。如果非活跃模式值越大，则可以推断出客户对该产品的需求不大，可能愿意处置或转售它。\n\
  \n### 12.9 用于供应链管理的区块链和物联网\n\n区块链技术可为供应链上的所有交易提供永久记录，使企业能够发现问题领域并采取适当行动。经常面临全球供应链问题的跨国公司对这一潜在用例表现出了兴趣。区块链是一个由链接区块组成的链，作为一种分布式数据结构。区块链的基本结构如\
  \ 图 12.9 所示。区块链通过充当分布式数据库或全球账本，记录网络上的所有交易。包含带时间戳交易的区块通过其加密哈希值来识别。区块按线性链（“区块链”）排列，每个区块引用其前一个区块的哈希值。维护区块链的网络中的每个节点都会执行并记录相同的交易。区块链网络中的每个节点都有一份区块链副本。网络中的任何节点都可以读取交易。\n\
  \n![FIGURE 12.9 Basic structure of a blockchain.](img/fig12_9.jpg)\n\n图 12.9 区块链的基本结构。\n\
  \n区块链是一种网络范围的账本，具有安全、加密、不可篡改和可访问的特性。由于产品追踪，这些特性对于必须做出重要采购决策的参与者至关重要 [53, 54]。它已被用于许多供应链行业，包括制药、农食品和海运。该技术实现了安全的产品追溯，因为分布式账本使用的共识技术确保了其中数据保持不可篡改。文献中经常将物联网设备的使用和区块链供应链应用一起提及\
  \ [55]。仅使用 RFID 和物联网基础设施时，存在安全性不足的问题 [56]。\n\n\n\n\n为了验证和授权物理设备的操作，可以使用智能合约来优化整个供应链，从而提高物联网平台的安全性。将追踪工具和区块链技术与智能合约相结合，在供应商完成任务（如将货物交付至仓库或满足预定义的质量和数量规格）后向其付款，是将两者应用于运输和物流的一种方式\
  \ [57]。在此场景中，RFID 传感器用于记录承运商车辆和生产商仓库中物品物理状态的信息。数据必须通过物联网基础设施，从放置在物品旁边的 RFID 传感器传输到分布式账本。最后，区块链确保数据被安全且永久地记录，并且参与者可以查看所有交易。传输的数据是在分布式账本中发送，而不是在中心化的服务器-客户端系统中；因此，在这种情况下使用区块链专门解决了数据管理的关键性问题，并以安全且不可篡改的方式对其进行保存\
  \ [58]。\n\n因此，可以持续追踪由外部因素引起的状况变化。智能合约使得双方参与者能够自动控制订单。商店发起一个智能合约以发送订单请求。通过智能合约，一个密码被同时提供给发送方和接收方。该密码将与生产商的订单关联，零售商需要将其提供给送货司机以提取产品。得益于区块链平台上基于公钥和私钥的认证，接受或拒绝订单的决策变得必要。结果，访问权限得到验证和认证，使得系统无法被篡改。\n\
  \n### 12.10 结论\n\n物理世界与数字世界的融合将为新商业模式带来大量机遇。由于智能技术的引入主要由流程变革驱动，因此需要一种业务流程管理策略，以帮助从业者和学者理解实施先进供应链模式的可能性。本研究通过开展文献研究以全面评估现有研究，综合了物联网应用在智慧城市供应链中的使用情况以提高可视性，从而填补了这一空白。本文详细考察了\
  \ RFID、物联网和区块链等技术的组合使用如何影响供应管理流程。大量文献表明，将供应链管理与超级技术相融合的研究领域正在快速增长。研究还说明了新兴技术可以促进当前供应链流程的时间节约。研究还涵盖了可持续供应链可追溯性对环境和经济的益处。\n\
