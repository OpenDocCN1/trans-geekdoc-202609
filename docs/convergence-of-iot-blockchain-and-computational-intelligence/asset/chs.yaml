  \ 14(1), 183–192.\n\n## 3 面向基于物联网 (IoT) 智慧城市的赋能技术\n\nVelleangiri Vinodhini, B. Sathiyabhama,\
  \ S. Sankar, S. Ramasubbareddy, M. R. Sundarakumar, and B. Balamurugan\n\nDOI: [10.1201/9781003353034-3](https://doi.org/10.1201/9781003353034-3)\n\
  \n### 3.1 介绍\n\n\n\n\n计算机网络的概念源于计算机与通信两大领域的融合。计算机网络是一对机器或硬件设备之间的连接，用于传输数据和访问远程信息。它促进了一组计算机系统上的交互式通信（Samanta\
  \ et al., 2021; Sankar et al., 2021; Sennan et al., 2021a）。其高性能给计算技术带来了重大进步。它将计算分类为不同的环境，如个人、分时、分布式、云、客户端-服务器和集群计算环境。在整个环境中，通信仅由人类进行（Revathi\
  \ et al., 2021; Sankar et al., 2020a; Sennan et al., 2020b）。Kevin Ashton 提出的一个重要概念是物联网。它用机器取代了人类。根据\
  \ Kevin Ashton 的说法，人类的精力、时间和注意力有限。这使得人们难以从现实世界中捕获信息。引入计算机来收集现实世界的数据将减少人类的精力和时间（Sennan\
  \ et al., 2021b; Samanta et al., 2021）。这一创新理念以一种新方式连接了设备。IoT 的定义源于多种技术、设备和装置的融合。它是一种技术，其中所有电子设备都嵌入了传感器，被编程进硬件，并在无需人工干预的情况下运行（Ande\
  \ et al., 2020; Mishra et al., 2020）。IoT 系统基于各种硬件平台和网络，具有异构性。IoT 中的“事物”可以是任何物理对象，如摄像头、手机、汽车、灯光等。IoT\
  \ 的要素包括识别、感知、网络和计算（Sankar et al., 2020b; Sankar and Srinivasan, 2020）。它与异构事物交互。设备或对象可以是不同平台或网络的，其应用包括智能家居和商业自动化、无人驾驶汽车、医疗保健、可穿戴设备、安全与国防、供应链、工业互联网、智慧农业和智慧城市。它通过最大化服务和最小化人力，使人们的生活变得轻松智能。类似于网络中的\
  \ TCP/IP 架构，IoT 由七层架构组成。本章解释了与 IoT 七层架构相关的使能技术。\n\n### 3.2 IoT 架构概述\n\nIoT 具有灵活的分层架构，用于在网络上连接大量异构系统。IoT\
  \ 的使能技术可能因不同领域而异。本节根据功能简要描述七层架构（参见图 3.1）（Aman et al., 2020; HaddadPajouh et al.,\
  \ 2020）。\n\n![图 3.1 IoT 的七层架构。](img/fig3_1.jpg)\n\n图 3.1 IoT 的七层架构。\n\nIoT 环境没有被广泛接受的单一架构。每家公司根据需求设计自己的架构。传感器使用协议跨网络收集和交换信息，并将信息存储在集中式数据中心。如果请求数据，则使用适当的方法或应用程序来检索数据（Sankar\
  \ and Srinivasan, 2019; Sennan et al., 2019）。一致性和可靠性得以保持。顶层是业务层。它管理整个 IoT 生态系统。它提供收益模型；一种将消费者聚集在此框架中的决策机制。下一层是应用层。它直接连接到终端系统。因为\
  \ IoT 支持互操作性，它允许不同用户在终端网络上使用不同的系统。互联网工程任务组（IETF）开发了一系列应用层协议以支持 IoT 应用（Sankar and\
  \ Srinivasan, 2018a）。集成服务跨区域网络框架交付。下一层是数据分析层。它使用户能够轻松监控其应用程序收集的信息中的模式或趋势。分析提供的指导确保客户熟练掌握做出明智决策、建立盈利组织所需的信息。数据分析对于帮助消费者在无需繁重工作的情况下得出重要见解变得至关重要。数据摄入需要从应用程序、IoT\
  \ 应用、网络和服务器日志中收集事件，并将它们传输到数据存储以进行进一步处理（Sankar and Srinivasan, 2018b）。IoT 管道通过传输结构化数据来创建。如果数据实时消费，则主要在数据到达时立即进行调节。随着数据在不同流中处理，数据项以固定时间间隔存储在多个片段中。摄入是将数据移动到数据处理设备的方法。全球基础设施层是对社会全球数据空间的建议。它允许系统基于当前和新兴的可互操作信息和通信技术与事物互连（Sankar\
  \ et al., 2018）。连接层包括通信协议和网络，数据可在其中交换。持续从用户收集数据的智能设备被称为事物层。随着 IoT 更多地融入日常生活，数据分析对于帮助消费者在无需繁重工作的情况下得出重要见解变得至关重要（Washizaki\
  \ et al., 2020）。\n\n### 3.3 使能技术\n\n#### 3.3.1 事物层\n\n##### 3.3.1.1 智能设备\n\n嵌入传感器的物理设备被称为事物。它可以是智能手机、笔记本电脑等。负责在无需人工干预的情况下从用户环境中收集数据的设备被称为智能设备。该技术包括射频识别，可分为无源、有源和半无源技术（RFID），其他类似技术有快速响应（QR\
  \ 码）和红外读取器（IR）。无源应用考虑最少（Sankar and Srinivasan, 2018c）。它们依赖外部电源供电。RFID 是一种用于追踪识别的小芯片。无源\
  \ RFID 能提供短距离信号。半无源 RFID 由电池供电，支持读写。有源 RFID 具有长距离覆盖和额外的电池寿命。它用于实时应用（Wang et al.,\
  \ 2020）。\n\n##### 3.3.1.2 智能传感器\n\n无需人工干预即可运行的传感器称为智能传感器。传感器可以集成到计算机中，也可以是独立传感器，或者是可穿戴传感器。例如，健身手表具有跟踪心率的传感器（Sankar\
  \ and Srinivasan, 2018d）。这些传感器与所有智能设备协作以满足应用需求（Astill et al., 2020; Sankar and Srinivasan,\
  \ 2017; Sennan et al. 2020a; Sankar et al., 2020c）。\n\n##### 3.3.1.3 智能执行器\n\n\n\
  \n无需人工干预即可基于感知数据自动工作的物理机器称为智能执行器。它能使任何应用更加高效，减少员工数量，并节省成本。工业 4.0 基于智能执行器，整个生产工厂的设计采用可消除人工操作的机器。\n\
  \n#### 3.3.2 连接层\n\n##### 3.3.2.1 通信\n\n通过增强功能，电子设备变得更智能。物联网推出了其无线通信标准。物联网的核心在于将应用与网络连接相结合以共享数据。通信协议内置于系统中，用于指导数据交换格式、编码、寻址和路由，同时保持序列控制和流控制。它还为丢失数据的重传提供了灵活性。电气和电子工程师协会\
  \ (IEEE) 制定了无线局域网 (WLAN) 802.11 标准 (Mishra et al., 2020)。\n\n##### 3.3.2.2 IEEE\
  \ 802.11 标准 – WiFi\n\n无线保真 是一种 WLAN。IEEE 802.11 有不同版本，如 a、b、d、e 等。它是一组 WLAN，支持媒体访问控制\
  \ (MAC) 和最底层的物理层规范。它提供 20 至 110 米的最小覆盖范围。它使用正交 FDM（频分复用）。WiFi 路由器大约在 2.3 GHz 和 4\
  \ GHz 频段上运行。802.11g 标准的室内范围为 125 英尺，802.11n 标准为 235 英尺 (Karthiprem et al., 2015;\
  \ Sankar and Srinivasan, 2016)。\n\n##### 3.3.2.3 IEEE 802.16 标准 – Wi-Max\n\n微波接入全球无缝互操作\
  \ 是一种固定、便携且高速的互联网接入技术。它建立在一组 IEEE 802.16 标准之上。它在硬件层 (PHY) 和 MAC 层提供多种选项。无线城域网 (WMAN)\
  \ 通过非授权频段连接到授权频段，如 900 MHz、2.4 和 5.8 GHz、700 MHz、2.5 至 3.6 GHz。这是通过正交 FDM（频分复用）实现的。表\
  \ 3.1 列出了不同协议标准的范围、数据速率和频段。\n\n表 3.1 物联网协议标准\n\n| 协议 | 最小范围 | 功耗优化 | 数据速率 | 频段 |\n\
  | --- | --- | --- | --- | --- |\n| 近场通信 | 个人 (<10 m) | 是 | 2 Mbps | ISM 2.4 GHz\
  \ 非授权 |\n| 蓝牙 | 接触 (<4 cm) | 是 | 100 Kbps | ISM 13.56 MHz 非授权 |\n| WiFi | 局域 (<100\
  \ m) | 否 | >60 Mbps | ISM 2.4 GHz/5 GHz 非授权 |\n| WiMax | 局域 (<50 km) | 否 | >70 Mbps\
  \ | ISM 2.3/2.5/3.5 GHz 授权 |\n| LoRa | 城域 (>10 km) | 是 | <50 Kbps | ISM 900 MHz,\
  \ 868 MHz, 433 MHz 非授权 |\n| 2G/3G | 城域 (>30 km) | 否 | <2 Mbps | 授权蜂窝 |\n| 4G | 城域\
  \ (>30 km) | 否 | >100 Mbps | 授权蜂窝 |\n| 5G | 城域 (>30 km) | 否 | >10 Gbps | 授权蜂窝 |\n\
  \n##### 3.3.2.4 IEEE 802.15.4 标准 – 低速率 – WPAN\n\nIEEE 802.15.4 描述了称为 LR-WPANs 的低速率无线个域网\
  \ (Personal Area Networks) 的应用，并管理 IEEE 802.15 工作组。该协议以较低的功耗和存储连接数百万设备。这些通常用于智慧城市和家庭自动化。\n\
  \n##### 3.3.2.5 2G/3G/4G/5G (未来展望)\n\n电信标准的进步经历了蜂窝区域网的各个代际演进。第二代包含全球移动通信系统 (GSM)\
  \ 和码分多址 (CDMA)。第三代包含通用移动电话系统 (UMTS) 和 CDMA2000。由于 4G、4.5G、4.75G（包括 LTE）提供更好的覆盖，这些技术不太可能被终端用户使用。4G\
  \ 的数据速率范围从 100 Mbps 开始。预计 5G 未来将大规模部署。\n\n##### 3.3.2.6 IEEE 802.15.1 标准 – 蓝牙\n\n\
  蓝牙是一种由 IEEE 802.15.1 标准开发的无线设备。它支持 PAN。它提供约 10 米的极短距离通信，并提供约 1 至 3 Mbps 的相对较低带宽。大多数低功耗手持设备可在此网络中运行。\n\
  \n##### 3.3.2.7 LoRaWAN R1.0 – 长距离\n\nLoRa (Long Range) 是一种采用扩频技术的调制技术，具有长效电池寿命，工作在\
  \ 868 和 900 MHz ISM 频段。ISM 无线电频段在全球范围内保留供工业、科学和医疗 (ISM) 用途。数据速率约为 0.2 至 55 kb/s。LoRa\
  \ 部署于智能供应链、智能物流等领域。它保证了不同运营商之间的互操作性。\n\n##### 3.3.2.8 光保真 – LiFi 技术\n\n光保真 是一种通过可见光通信\
  \ (VLC) 提供无线高速数据的技术。它配合发光二极管 (LED) 工作，可最大限度地降低能耗。由于光信号干扰，其效率受到限制。因此它应用于容错应用中。\n\n\
  ##### 3.3.2.9 软件定义网络 (SDN)\n\nSDN 是一种灵活、稳定、可适应且具有成本效益的网络架构。基于 SDN 的受保护物联网架构使用协议来控制和管理物联网设备、资源和网络实体，如交换机和路由器。SDN\
  \ 为物联网设备提供认证和授权服务 (Bera et al., 2017)。\n\n##### 3.3.2.10 区块链\n\n物联网将数据发送至私有区块链账户，以便在公共交易中插入防篡改记录。IBM\
  \ 区块链即为一例。它使企业客户能够在无需中央管理和监控的情况下控制和分发物联网数据。每份协议都应经过检查以防止冲突，并确保每位合作伙伴对其立场负责。用于人与机器之间价值和数据交换的第一个分布式账本是\
  \ IOTA，它是“万物互联网” (Zheng et al., 2018)。\n\n##### 3.3.2.11 新标准\n\nETSI (欧洲电信标准协会)\
  \ 是一个服务于欧洲和全球商业需求的通信技术领域自主、非营利的标准化机构。总部位于法国索菲亚-安提波利斯。ETSI 促进面向 ICT 系统、软件和服务的全球适用技术标准的开发和测试，这些标准广泛应用于商业和社会的所有领域。\n\
  \n#### 3.3.3 全球基础设施层\n\n全球基础设施层是第三层。每当部署节点时，提供的中心化服务应提升性能。考虑到性能参数，部署在云和雾中进行。每当节点距离云基础设施太远时，可考虑雾计算。\n\
  \n##### 3.3.3.1 云与雾\n\n物联网应用通常在云基础设施上运行。大多数物联网系统与云提供商集成。物联网云作为一系列数字工具，可为公司提供有价值的数据和客户洞察。云技术因使用传感器的实施而受青睐。位于不同位置的传感器将数据发送到中心化云端进行处理。云具有通用性，因为它是按需基础设施。Kaa\
  \ 和 DeviceHive 等云提供商支持物联网即服务平台 (PaaS)。物联网服务提供商使用基础设施即服务 (IaaS) 从客户处获取软件即服务 (SaaS)。雾计算有助于在传输数据时降低延迟，提高可扩展性。如果终端用户距离云太远，则可优先选择雾计算来扩展服务，因为它感知位置和服务分布。它能够连接大量设备，同时保持移动性\
  \ (Osanaiye et al., 2017)。\n\n##### 3.3.3.2 数据交换协议\n\n\n\n为了管理大型网络产生的海量数据，需要一种技术来高效管理传输给接收端的数据。物联网拥有应用层协议来完成这种管理。要交换数据，节点必须注册为网络的成员；这个过程称为订阅。一旦节点完成订阅，发布者就可以获取与服务相关的数据；当数据发布时，这被称为发布/订阅过程。当部署大量节点时，这种方式很合适。对于极少量的节点，可以执行请求/响应过程。在此过程中，汇聚节点通常会显式请求与服务相关的信息，并获得包含所请求数据的响应。当节点进入系统时，它会分配网络服务，并且还可以开始交换数据并作为物联网系统组件发挥作用。表\
  \ 3.2 列出了物联网数据交换协议、部署平台及所提供的安全类型（Sankar and Srinivasan, 2016）。\n\n###### 表 3.2 物联网数据交换协议与物联网平台\n\
  \n| 协议 | 平台 | 集成 | 发布者/订阅者 | 请求/响应 | 传输协议 | 组播 | 安全 |\n| --- | --- | --- | --- |\
  \ --- | --- | --- | --- |\n| CoAP | Thing Worx, EVRYTHNG | Rest API | 是 | 是 | UDP\
  \ | 是 | DTLS |\n| MQTT, MQTT-SN | AWS IoT, IBM Watson, Thing Worx, Bosh IoT Suite,\
  \ Xively, EVRYTHNG, Kaa | Rest API 和实时 API | 是 | 否 | TCP/IP | 是 | SSL |\n| XMPP\
  \ | Thing Worx | Rest API | 是 | 是 | TCP | 是 | SSL |\n| AMQP | Bosh IoT Suite | Rest\
  \ API | 是 | 否 | TCP | 否 | SSL |\n| DDS | Thing Worx | Rest API | 是 | 否 | TCP/UDP\
  \ | 是 | DTLS |\n\n##### 3.3.3.3 受限应用协议\n\nIETF 设计了 CoAP，这是一种用于在受限环境（如较低的 RAM 容量和丢包网络）中工作的协议。它专门设计用于在无线个域网上运行并使用低功耗\
  \ (WPAN)。它是一种基于 Web 的协议，具有 HTTP 接口。它允许机器到机器应用的自动化。它采用客户端-服务器模型，客户端发起请求，服务器进行响应。即使对于大量用户，它也能提供良好的性能。它提供组播通信，消息发送给发布者，订阅者接收消息。\n\
  \nCoAP 是一种可靠且简单的协议，包含两层。顶层由 UDP 构建，称为消息层。另一层称为请求/响应层。它通过请求/响应消息提供可靠通信。图 3.2 显示了\
  \ CoAP 消息格式，图 3.3 显示了 CoAP 的客户端-服务器架构，其中交互通过 REST API 进行。CoAP 通过 UDP 传输。它采用固定大小的二进制消息格式。它包含选项和负载。消息支持可确认、非可确认、确认和重置。数据报传输层安全\
  \ (DTLS) 用作安全协议。它提供高带宽，因此连接到它的设备是可靠的。\n\n![图 3.2 CoAP 消息格式。](img/fig3_2.jpg)\n\n\
  图 3.2 CoAP 消息格式。\n\n![图 3.3 CoAP 架构。](img/fig3_3.jpg)\n\n图 3.3 CoAP 架构。\n\n#####\
  \ 3.3.3.4 消息队列遥测传输协议\n\nMQTT 由 IBM 设计，旨在减少带宽消耗并实现可靠的数据包传输。它通过最小化流量来减少网络协议开销。MQTT\
  \ 通过支持低功耗设备、组播和发布者/订阅者架构，与 CoAP 相似。它构建在 TCP/IP 模型之上。可靠传输通过三个服务质量 (QoS) 级别来考量，即至多一次、至少一次和恰好一次。最低级别是至少传输一个数据包，无需确认。中间级别支持确认，但可能有重复消息。为了仅传输一次消息并带有确认，应使用特殊协议以达到最高\
  \ QoS 级别。图 3.4 显示了 MQTT 代理架构。图 3.4 中的传感器节点可以是温度传感器、湿度传感器等。传感器节点收集的数据发布到 MQTT 代理，而不是直接发送给设备。代理将数据发布给已订阅的设备。因此，大量数据可以通过\
  \ MQTT 代理进行监控和控制。\n\n![图 3.4 MQTT 代理架构。](img/fig3_4.jpg)\n\n图 3.4 MQTT 代理架构。\n\n\
  ##### 3.3.3.5 可扩展消息与 Presence 协议\n\n最常见的通信协议是可扩展消息与 Presence 协议 (XMPP)。其可扩展特性允许根据功能定制协议。它是一种轻量级协议，用于许多实时应用，如多方聊天、即时消息、语音通话、视频通话等。它使用传输控制协议\
  \ (TCP)。它具有高度灵活性，并采用去中心化架构实现可扩展性。发布者和订阅者启用事件通知，并作为社交网络、即时新闻推送和许多其他实时交互的基础。图 3.5\
  \ 表明 XMPP 客户端不直接与另一个客户端交互，而是通过 XMPP 服务器进行交互。每个客户端由一个称为 Jabber ID (JID) 的唯一 ID 标识。它由用户、服务器和资源组成。例如，如果用户访问\
  \ Facebook，则 JID 中的“用户”是“Facebook 账号”，“服务器”代表“Facebook 服务器”，资源代表访问应用程序的“移动端/桌面端”。\n\
  \n![图 3.5 XMPP 客户端与服务器。](img/fig3_5.jpg)\n\n图 3.5 XMPP 客户端与服务器。\n\n##### 3.3.3.6\
  \ 高级消息队列协议\n\nAMQP 是一种开源的异步消息传递标准。它允许应用程序和组织之间进行安全且互操作的通信。该协议用于客户端/服务器通信和物联网应用的管理。它可靠、紧凑、安全且多通道。二进制协议提供\
  \ SASL 或 TLS 认证和加密，依赖于 TCP 等传输协议。\n\n该消息传递协议速度快，具有确保投递并确认消息接收的特性。它由一个庞大且简单的组件组成，该组件在代理操作器中记录和存储通信，以及一组用于连接组件的策略。AMQP\
  \ 协议帮助客户端系统与代理对话并连接到 AMQP 模型。图 3.6 显示了 AMQP 代理将消息从发布者交换给订阅者。代理模型中的队列允许为订阅者提供有保证的服务（Glaroudis\
  \ et al., 2020）。\n\n![图 3.6 AMQP 代理架构。](img/fig3_6.jpg)\n\n图 3.6 AMQP 代理架构。\n\n\
  ##### 3.3.3.7 数据分发服务\n\nDDS 通过发布-订阅技术，实现可扩展、实时、可靠、高性能的系统结果和互操作的数据交换。它采用较少的架构和组播代理，向高质量应用通信\
  \ QoS。图 3.7 显示了发布者在集中式全局数据空间中直接与订阅者通信。DDS 旨在为系统和网络使用最少的资源。\n\n![图 3.7 DDS 架构。](img/fig3_7.jpg)\n\
  \n图 3.7 DDS 架构。\n\n#### 3.3.4 数据摄入层\n\n\n\n数据摄取层是第四层，包括大数据、清洗、流式处理和数据管理。`Apache\
  \ Flume` 和 `Apache NiFi` 是大数据摄取工具的示例。`Apache Flume` 提供分布式服务。大量数据被收集、聚合并传输，同时保持可靠性。从多个来源收集的数据流被存储并在\
  \ `Hadoop` 中进行分析。基于数据流式处理的流向，其架构变得简单。它健壮且具备容错能力，拥有多种故障恢复机制。`Apache NiFi` 是一个易于使用、可靠的系统，广泛用于数据分发和处理。它支持数据流跟踪，为监控和控制提供无缝服务。数据通过\
  \ `SSL`、`HTTPS`、`SSH` 加密，因此是安全的。\n\n##### 3.3.4.1 存储工具\n\n###### 3.3.4.1.1 Hadoop\
  \ 分布式文件系统\n\n一种基于 Java 的文件系统，用于大数据的安全存储，称为 `Hadoop 分布式文件系统 (HDFS)`。它具有可扩展性，可服务大型客户，并允许从大型存储库轻松访问。由于数据的多个副本存储在不同的机器上，因此保持了冗余。它采用主/从架构模型，通过划分数据并将其放置在不同的集群中，实现并行处理（Nazini\
  \ and Sasikala, 2019）。\n\n###### 3.3.4.1.2 Gluster 文件系统\n\n`Gluster 文件系统 (Gluster\
  \ FS)` 是一个开源、可靠的分布式文件系统，在存储方面提供线性扩展性能。它可部署用于非结构化数据。它具有可扩展性并允许分布式存储。`Gluster FS`\
  \ 可用于云计算、媒体流和内容分发。\n\n###### 3.3.4.1.3 Amazon 简单存储服务\n\n`Amazon 简单存储服务 (Amazon S3)`\
  \ 是一种简单的对象存储 Web 服务。它提供最高的持久性，并可大规模扩展。云应用程序使用 `S3` 服务。它允许拥有具备故障恢复能力的大型数据存储库。数据迁移比其他服务更容易。存储在\
  \ `S3` 上时，成本相对降低。\n\n#### 3.3.5 数据分析\n\n数据分析是第五层，涉及数据调查、提取和机器处理。大多数公司使用大数据分析来提高生产力、收入并降低成本。`Apache\
  \ Hive`、`Apache Spark SQL`、`Amazon Redshift`、`Presto SQL 查询引擎` 是大数据查询工具的示例（Kamilaris\
  \ et al., 2017；Samanta et al., 2021；Vinodhini et al., 2020；Karthiprem et al., 2016）。\n\
  \n##### 3.3.5.1 Apache Hive\n\n`Apache Hive` 运行在 `Apache Hadoop` 之上。它为分析提供大型数据集，并支持通过临时查询进行汇总。用于\
  \ Hive 的 `SQL` 查询称为 `HiveQL`。它具有可扩展性；随着数据增长，会添加许多机器以提升性能。\n\n##### 3.3.5.2 Apache\
  \ Spark SQL\n\n`Apache Spark SQL` 拥用用于结构化数据处理的 Spark 模型。它具有基于成本的优化器。它提供代码生成器以实现快速查询。其可扩展性出奇地高，且具备容错能力。\n\
  \n##### 3.3.5.3 Amazon Redshift\n\n`Amazon Redshift` 在云端处理 PB 级数据。它用于查询数据处理。当 `SQL`\
  \ 运行时，可按需创建数据库。可获取客户和业务洞察。整体管理由 `Redshift` 协调。这些任务包括提供集群算力、监控和备份，以及向 `Amazon Redshift`\
  \ 系统部署更新和改进。\n\n##### 3.3.5.4 Presto – SQL 查询引擎\n\n`Presto` 是一个开源 `SQL` 数据库引擎。它以分布式方式运行，对数据源的所有数据量执行交互式分析查询。它专为商业用途设计，可大规模扩展。它从关系数据库查询数据。其目标是面向每分钟需要操作响应的分析师。`Facebook`\
  \ 在许多内部数据存储中使用 `Presto`。员工执行的查询超过 40,000 条，扫描海量数据。`Dropbox` 和 `Airbnb` 是使用 `Presto`\
  \ 的公司示例。\n\n#### 3.3.6 应用层\n\n第 6 层是 `IoT` 应用的基础。该层提供客户端所需的服务。客户端可以使用任何智能应用，如智能手机、智能手表等。该层提供的服务包括身份相关服务、聚合服务和协作服务。提供给系统的身份相关支持会持续受到监控和更新。例如，考虑医疗记录的数字化。`RFID`\
  \ 标签包含患者身份。从标签收集的数据被聚集并存储在数据库中。每次就诊时，记录都会更新。存储的信息通过基于 Web 或移动应用程序提取。智能电网之间的负载分发是数据聚合服务的一个示例。它审查从各种传感器获得的信息。网络分析信息并将数据馈送给\
  \ `IoT` 应用。智能家居自动化要求数据在家中的各种智能设备之间共享。这是协作服务的一个示例。它在任何时间点提供完全的控制和访问（Perez et al.,\
  \ 2019）。\n\n#### 3.3.7 人员与流程层\n\n人员与流程层还涉及基于 `IoT` 计算的业务交互和决策制定。在大规模实施 `IoT` 时，安全性和数据完整性是关注的重点。图\
  \ 3.8 展示了在所有技术中部署安全的情况。应防止安全漏洞，以降低脆弱性风险。`国际电工委员会 (IEC)` 是一个国际标准。它对所有电气和电子技术给出一致性评估。`IoT`\
  \ 设备应遵守 `IEC` 的标准和指南（Ahmed et al., 2018）。\n\n![图 3.8 IoT 安全。](img/fig3_8.jpg)\n\n\
  图 3.8 IoT 安全。\n\n##### 3.3.7.1 人员\n\n`美国国家标准与技术研究院 (NIST)` 持续监控并推广新标准以增强安全性。安全团队是一组为安全紧密协作的专业人员。当检测到漏洞时，安全团队会识别其严重性影响。它调试更新并立即部署给客户。\n\
  \n##### 3.3.7.2 流程\n\n在设备实时部署之前，应建立强有力的安全流程。一旦发现设备存在漏洞，安全流程应立即启动。在任何设备部署中，应考虑 表\
  \ 3.3 中的以下流程来处理安全问题。\n\n表 3.3 安全流程\n\n| 流程 | 描述 |\n| --- | --- |\n| **识别** | 识别漏洞\
  \ |\n| **隔离** | 将其与设备网络分离 |\n| **验证** | 确保真实性 |\n| **处理** | 处理漏洞 |\n\n##### 3.3.7.3\
  \ 技术\n\n业务供应商需要值得信赖的设备和正版软件。信任链始于根部，延伸至应用层。数据安全起着至关重要的作用。供应商确保数据安全的三种形式如 图 3.9 所示。静态数据、使用中数据、传输中数据的安全性分别称为安全存储、安全处理和安全网络。\n\
  \n![图 3.9 数据安全。](img/fig3_9.jpg)\n\n图 3.9 数据安全。\n\n\n\n\n###### 表 3.4 安全问题规范\n\n\
  表 3.4 规定了安全问题。在所有 IoT 基础设施中，应实施各种技术以确保所有连接的安全。SoC 是组织具有集中功能的设施。该安全团队负责安全相关问题。安全供应商从根源提供安全保障。为解决分层安全模型，硬件隔离在处理器和缓存中定义了完整的\
  \ SoC。如果硬件具有允许不同操作系统的管理程序，则 SoC 位于虚拟机 (VM) 上。软件可通过系统内存管理单元 (MMU) 在出现漏洞时进行隔离。用户空间隔离在\
  \ Linux 操作系统的内核中完成。加密数据以变量和文本字符串的形式存储在内存中。为保护数据，开发人员执行网络测试、渗透测试和配置防火墙。发送和接收数据需要数据认证。在网络路由时应实施加密操作。核心处理器设计有加密引擎，并支持加密和解密。它以高速率提供数据安全。\n\
  \n###### 表 3.4 数据安全问题\n\n| 数据状态 | 问题 | 硬件平台提供的安全性 | 软件平台提供的安全性 |\n| :--- | :---\
  \ | :--- | :--- |\n| 静态数据 | 信任根 | SoC (安全运营中心) | 是 |\n| | 信任链 | 引导加载程序经过验证和认证 |\
  \ 操作系统经过验证和认证 |\n| 使用中数据 | 硬件强制隔离 | 实现多个 SoC | 不适用 |\n| | 软件强制分离 | 嵌入式管理程序上的 SoC\
  \ | 支持虚拟化的多核 SoC |\n| | 用户空间隔离 | 不适用 | 基于应用程序的数据内存隔离 |\n| | 信息或数据混淆 | 配置防火墙、网络压力测试和网络渗透分析\
  \ | 不适用 |\n| 运动中数据 | 设备劫持 | 不适用 | 带加密引擎的 SoC |\n\n### 3.4 结论\n\n本章探讨了七层 IoT 框架，这是一种现代且广泛使用的技术。传感器通过事物层的标准化硬件组件传输感知数据。为传输数据，连接层包含在事物层之上。网络层选择用于通信的正确协议并存储在集中式数据存储中。存储的信息可能是非结构化的；数据摄取层支持非结构化数据的传输。通过数据处理层执行数据挖掘和报告。用户可以通过自定义移动应用程序或基于\
  \ Web 的应用程序访问应用程序。这由应用层技术支持。第 7 层业务层由 IoT 环境控制，便于客户进行决策。该层负责向客户交付优质产品。IoT 通过利用多种技术促进行业转型，已成为市场的一部分。技术因众多进步而持续演进；然而，了解当前可用技术的特性和认知至关重要。由于企业在很大程度上由\
  \ IoT 驱动，某些技术的缺陷可在未来得到解决。\n\n### 参考文献\n\n*   Ahmed, S. H.; Rani, S. A hybrid approach,\
