  \ 6 综述：面向 IoT 设备的网络物理系统的最新进展与应用\n\nUmesh Kumar Lilhore, Sarita Simaiya, Martin Margala,\
  \ Prasun Chakrabarti 和 Atul Garg\n\nDOI：[10.1201/9781003353034-6](https://doi.org/10.1201/9781003353034-6)\n\
  \n### 6.1 简介\n\n网络物理系统（CPS）是一种融合了网络空间与物理空间的动态系统。CPS 是一种反馈回路机制，包含一组由基于计算机的算法控制的物理设备（传感器和执行器）。服务提供商利用\
  \ CPS 向客户演示其产品，以便客户更好地理解。它对汽车、工厂、医疗、农业和监控等各种实时应用进行建模。CPS 的主要目标是增强大规模系统的适应性、灵活性、性能、功能性、可靠性、保护性和可访问性，以优化其实施\
  \ [[1]](#chapter6.xhtml#ref6_1)。CPS 是一项融合了我们数字世界与物理世界的革命性技术。它与多个虚拟和基础组件紧密相连，以满足客户需求和质量要求。CPS\
  \ 将网络生态系统定义为一个由软件应用处理、传输和控制的技术时代。随着时间的推移，外部环境通过大量传感器和物联网（IoT）进行监测 [[2]](#chapter6.xhtml#ref6_2)。\n\
  \n因此，CPS 包含相互作用的技术、设备、传感器、控制器和嵌入式设备。框架是一种复杂的技术，它将仪器、执行器和控制器的网络连接起来，以获取、过滤、计算和评估物理环境知识，并将结果应用于外部环境\
  \ [[3]](#chapter6.xhtml#ref6_3)。CPS 是一种与 IoT 设备紧密相关的技术形式。它是一种基于网络的异构分布式解决方案，结合了数学形式化、IoT\
  \ 以及用于管理它的计算组件。因此，它凸显了虚拟现实与真实现实之间的动态交互。CPS 技术进步对于比以往更有效地提高生活质量至关重要。然而，网络安全威胁正变得越来越严重\
  \ [[4]](#chapter6.xhtml#ref6_4)。\n\n此外，CPS 在评估由持续运行过程形成的安全风险方面面临困难，且额外的安全顾虑正在被不断发现和产生。考虑到\
  \ CPS 的多样性及其元素的差异性，要实施和保障 CPS 的安全性与隐私并非易事。许多 CPS 组件和特定的网络攻击也难以确定、监控和调查 [[5]](#chapter6.xhtml#ref6_5)。第一层代表感知层，第二层代表数据传输层。第三层代表应用层\
  \ [[6]](#chapter6.xhtml#ref6_6)，它们构成了 CPS，如图 6.1 所示。第一层包括 GPS、传感器、IoT、RFID、摄像头、执行器和识别设备\
  \ [[7]](#chapter6.xhtml#ref6_7)。\n\n![图 6.1 CPS 概览。](img/fig6_1.jpg)\n\n图 6.1 CPS\
  \ 概览。\n\nCPS 的进步对于比以往更有效地提高生活水平至关重要，但网络安全担忧依然严峻。此外，CPS 在评估复杂连接中的风险和漏洞方面存在困难，且额外的安全挑战已不断演变\
  \ [[8]](#chapter6.xhtml#ref6_8)。连同 CPS 的元素，这种多样性使得验证 CPS 的安全性和机密性、发现、分析和调查 CPS 的各个组件，以及专注于网络攻击变得极具挑战性\
  \ [[9]](#chapter6.xhtml#ref6_9)。CPS 与 IoT 之间的相互关系一直是一个不确定性来源，阻碍了这两个领域之间的强力协作和信息共享。本章解释了这些方面的起源并分析了各种考量因素。它提出了一个统一的观点，即相关性能提升安全性，以鼓励建立一个共享最佳实践、推进共同目标、避免重复工作、减少冗余规范传播、并催化探索与进步的通用框架\
  \ [[10]](#chapter6.xhtml#ref6_10)。\n\n本章概述了面向 IoT 平台的当前 CPS 进展与实施。本章组织为若干类别。第 6.1\
  \ 节介绍 CPS 和 IoT 并涵盖相关工作，而第 6.3 节解释 CPS 和 IoT 架构。第 6.4 节讨论网络安全挑战和进一步研究领域，第 6.5 节讨论\
  \ CPS 适用性，第 6.6 节讨论 CPS 风险与补救措施，第 6.7 节作总结。\n\n### 6.2 相关工作\n\n这是一个重大问题，可能通过直接危害物理世界中的个人生计来破坏\
  \ CPS 的基础。因此，研究人员应调查 CPS 的安全性和机密性控制，以了解这些缺陷、风险和网络攻击 [[11]](#chapter6.xhtml#ref6_11)。本研究的重点是组织系统与\
  \ CPS 在 CPS 基本要素方面的差异。\n\n它可以采集音频、光照、物理、药理、温度、电子、生物和地理信息。传感器可利用节点协作产生事实信息 [[12]](#chapter6.xhtml#ref6_12)。因此，核心网络必须识别和收集数据，通过网络层传输数据，并为站点的\
  \ IoT 连接良好运行 [[13]](#chapter6.xhtml#ref6_13)。信息共享层处理传感器与应用程序之间的数据交换与分析 [[14]](#chapter6.xhtml#ref6_14)。\n\
  \n这种对等交互主要通过有线（如 LAN、WAN）、网络设备（如交换、路由）和移动宽带（如蓝牙、ZigBee、WiFi、4G 和 5G）执行。它成为 CPS 不可或缺的一部分，范围可能从内部延伸至外部\
  \ [[15]](#chapter6.xhtml#ref6_15)。现代技术非凡地易于获取且昂贵，因为它们能有效地跨互联网处理和控制大量数据。收发器也负责完整性，并允许实时流式传输\
  \ [[16]](#chapter6.xhtml#ref6_16)。\n\n\n\n\n基于该服务，一个独特的标签可能寻址应用层。“监控与数据采集”（SCADA）方法是最常见的\
  \ CPS，因此它被用于分布式发电和“工业自动化系统”等重大交通系统项目中 [17]。该层接收输入传输层的源。它包含对实际传感设备执行的指令以及可用于任何部分的指令。此外，还计划了来自多个来源的数据收集、海量信息的智能计算、评估和管理\
  \ [18]。表 6.1 展示了关于 CPS 风险、挑战和 IoT 设备安全性的综述对比。\n\n#### 表 6.1 CPS 风险、挑战和 IoT 设备安全性的综述对比\n\
  \n| 引用 | CPS 安全风险因素 | CPS 挑战 |\n| --- | --- | --- |\n| **[19]** | 计算能力、存储能力、电源容量、可扩展性和便携性\
  \ | 成本效益分析、技术转移、最低功耗协议 |\n| **[20]** | 通信系统和数据安全 | 灵活性、智能医疗系统 |\n| **[21]** | 前端监视器和仪表、通信以及系统的后端设备\
  \ | 技术异构性、节能方法、跨边界数据共享 |\n| **[22]** | 节能方法、通信系统和数据安全 | 无线技术、自组织技能、数据与语义互操作性、管理\
  \ |\n| **[23]** | 物联网连接额外对象、安全性和可信度。 | 规范和可访问性也是复杂性、不一致性和集成性的关注点。 |\n| **[24]**\
  \ | 机密性具有更多去中心化的网络连接。 | 互联网服务和能耗 |\n| **[25]** | 用于识别的应用服务器保护级别低 | 可信度和各种设备增加了系统的功能性和通信问题。\
  \ |\n| **[26]** | 认证和机密性 | 可用性和费用、为确保数据安全的系统自组织以及系统故障。 |\n| **[27]** | 风险包括在使用虚拟专用网络访问用户计算机系统时，将机密材料存储在主机上。\
  \ | 可靠连接和所需频段的可用性。 |\n| **[28]** | 每当围绕用于处理、软件和存储系统的集中控制计算机构建保护系统时，系统故障的风险就会上升。\
  \ | 创新费用。组织支持不足。导致训练有素的人员短缺，IoT 实施缓慢。 |\n| **[29]** | 安全软件、信任与安全以及物理安全都是需要解决的问题。黑客攻击、拒绝服务、更新、病毒、登录信息攻击和网络钓鱼都是网络犯罪的例子。\
  \ | IoT 网络、解决方案和解决方案不为人所知。 |\n\n### 6.3 网络物理系统与 IoT\n\n如今，计算设备轻便且便携，具有物理组件，允许通过适当的动作和实时响应进行跟踪和控制。“网络物理系统”和“物联网”这两个术语有不同的背景，但具有相似的定义，涉及将技术变革（包括数据连接和处理能力）与外部设备和对象相结合的进步\
  \ [30]。特定短语“物联网”的出现归功于 1999 年的“Kevin Ashton”。IoT 可以描述为：“IoT 旨在将物理世界与互联网时代连接起来” [31]。同样，CPS\
  \ 被定义为“一种认知处理计算机系统，可增强产品针对特定任务的学习能力。”\n\n#### 6.3.1 CPS 的物理组件\n\nCPS 的关键组件包括：\n\n\
  *   **网络世界的一个要素：** 嵌入式设备通过互联网共享数据，以自动或通过人机界面（HMI）处理收集的数据。计算单元管理这些嵌入式系统 [32]。\n*\
  \   **物理构成要素：** CPS 系统通过传感器和执行器等物理设备与物理环境交互。系统以电子形式检测捕获的数据，以评估或观察物理世界。假定 CPS 中的执行器根据感知数据启动行为\
  \ [33]。\n*   **物理组件：** 这些也被称为受控对象、过程和系统，而网络组件被称为计算、软件或代码。\n\n#### 6.3.2 网络物理系统架构\n\
  \nCPS 的工作原理包含四个阶段：1) 监测，2) 网络传输，3) 计算处理，和 4) 执行。网络世界和物理空间是 CPS 最显著的两个组成部分 [34]。物理环境中的传感器持续监测物理环境的对象，收集实时数据，并将这些数据传输到网络世界。在网络空间中，根据接收到的原始数据或信息做出决策以执行特定动作。此外，设备的物理状态根据动作从一种状态变为另一种状态。\n\
  \n如图 6.2 所示，物理组件由执行器、计算机系统和传感器组成。然而，网络部分由通信网络组成。CPS 现在基于一种称为“虚拟系统”的信息处理系统，该系统嵌入在产品中。计算机系统中的传感器和设备与物理环境交互。嵌入式系统是一种与计算机系统、执行和传感器通信以完成给定任务的系统。它们不是孤立存在的。它们通过数据传输网络和互联网与云技术共享数据，云技术处理从各种嵌入式系统收集的数据。因此，形成了一种系统的方法\
  \ [35, 36]。\n\n![图 6.2 CSP 的物理组件。](img/fig6_2.jpg)\n\n图 6.2 CSP 的物理组件。\n\n#####\
  \ 6.3.2.1 带有 IoT 设备的 CPS 配置\n\n尽管对这种 CPS 的架构层有许多假设，但它在三个层面上运行。配套设备通过 CPS 架构甚至底层功能区域对层进行分类\
  \ [37]。CPS 架构风格由三层组成（见图 6.3）：\n\n![图 6.3 IoT 架构和 CPS。](img/fig6_3.jpg)\n\n图 6.3\
  \ IoT 架构和 CPS。\n\n1.  物理层\n2.  网络层，和\n3.  应用层\n\n###### 6.3.2.1.1 物理层\n\n\n\n\n\
  ###### 6.3.2.1.2 网络层\n\n网络层负责处理数据传输，并在应用层与物理层之间进行通信。连接基础设施使多个组件能够互联，例如传感器、执行器和其他互联组件。对于无线网络或\
  \ TCP/IP 网络，可能存在异构通信系统。该层管理 CPS 的具有成本效益、可信且实时的通信。该层使用 `Bluetooth`、`ZigBee`、`WiFi`、`4G`、`5G`、局域网（`LAN`）、广域网（`WAN`）、交换机、路由器和其他网络设备\
  \ [40]。\n\n###### 6.3.2.1.3 应用层\n\n在 CPS 中，应用层整合了所有聚类应用。它指的是设计用于执行复杂任务的软件包，例如跟踪和远程控制、网络管理、数据库以及\
  \ HMI 平台。该层通过从网络层收集数据并向物理单元（称为执行器）发送指令来工作，以触发待启动的动作。有许多基于桌面和 Web 的交互可用于管理和监控 CPS\
  \ 功能。用户通过该层向控制层发送指令，由控制层执行 [41, 42]。\n\n#### 6.3.3 物联网设备中 CPS 安全性的影响\n\nCPS 确保几乎所有物理空间和网络空间的安全目标均得以实现。CPS\
  \ 安全的主要目标是机密性、完整性、可用性和真实性。这些安全目标对 CPS 至关重要，但却是不够的。如果网络系统不可用，物理过程将无法被管理。后果将是灾难性的，尤其是对于实时操作而言\
  \ [43]。\n\n*   **机密性：** 指系统防止和避免信息泄露给入侵者，或防止系统自身从外部泄露信息的能力 [44]。\n\n*   **完整性：**\
  \ 保护信息不受入侵者影响的能力。数据完整性对 CPS 的价值高于数据机密性和隐私。CPS 领域的主要目标是完整性，这将通过避免、检测和防止针对创新设备信息交换的虚假攻击来实现。完整性与重放攻击有关。\n\
  \n*   **可用性：** 向特定参与者群体提供服务或系统的能力。CPS 的可用性目标旨在通过避免由纵容引起的计算、控制和通信损坏，保证服务始终可用 [45]。\n\
  \n### 6.4 网络安全问题与研究空白\n\n确保高度多样化的航空和飞机技术（包括信息安全、固件、内存和计算）良好运行至关重要。研究 [46] 强调了依赖未来几十年\
  \ CPS 的重要性，并突出了适应性和内省可观测分析方法（对开发现实的 CPS 至关重要）如何能作为有组织适应性的基础。在使用通信方法论时，该策略从根本上转变了\
  \ CPS 的主动监视、协调和指挥领域。文章 [47] 中开发了计算机编程考量的高层描述。\n\n该方案与应用开发意图的复杂性相关。相比之下，CPS 技术与 CPS\
  \ 的基本性质和类型相关，以确保一致性、评估、架构、实现和验证。论文 [48] 的作者讨论了智能计量活动、网络影响和远程能源控制台，所有这些都直接影响性能和供给终端的最大功率。此外，研究人员在本部分讨论了\
  \ CPS 网络安全的事项和问题，因为这对于实现电力实施和安全架构至关重要。除了 IT 机密性外，如果 CPS 机密性遭到破坏，将对各种公司和行业造成严重后果。因此，在\
  \ CPS 网络安全中应考虑前文提出的担忧和响应计划 [49, 50]。\n\n### 6.5 网络物理安全威胁\n\nCPS 的安全问题可能导致严重的重大暴力破坏。随后，CPS\
  \ 的每个组件都可能面临物理或动态挑战。CPS 上启用的设备和通信也暴露于其他全球网络攻击之下 [51]。因此，所考虑领域的漏洞包括对不同环境（如感知、执行和\
  \ ToT）的挑战；传输层的担忧包括通信漏洞、计算机病毒和系统错误。\n\n#### 6.5.1 CPS 安全威胁分类\n\nCPS 安全威胁可分类如 表 6.2\
  \ 所示。\n\n表 6.2 CPS 安全威胁分类\n\n| CPS 安全威胁 | | | |\n| --- | --- | --- | --- |\n| **物理层威胁**\
  \ | | **网络层威胁** | **应用层威胁** |\n| 物理攻击 | | 重放攻击 | SQL 注入攻击 |\n| 传感器黑客威胁 | | 欺骗攻击\
  \ | 跨站脚本攻击 |\n| 密码攻击 | | 泛洪攻击 | 缓冲区溢出 |\n| 故障注入威胁 | | 路由攻击 | 恶意攻击 |\n| 节点信誉 | |\
  \ 存储攻击 | SQL 注入攻击 |\n| 时序攻击 | | 伪装攻击 | 跨站脚本攻击 |\n| 节点捕获 | | 中间人攻击 | 缓冲区溢出 |\n| 窃听\
  \ | | 选择性转发 | 恶意攻击 |\n| 标签克隆 | | DoS 攻击 | 缓冲区溢出 |\n| 干扰 | | | 恶意攻击 |\n\n##### 6.5.1.1\
  \ 物理层威胁\n\n物理层中的设备通常位于外部和室外环境中，因环境变化、操作不当等原因导致物理损坏。该层包含用于识别对象和收集实时数据的传感器，以及用于测量空气、温度、运动等变化的执行器\
  \ [52]。传感器是想要设计其传感器的攻击者的主要目标。目前正在进行更多研究以寻找这些攻击的替代方案 [53]。以下是物理层的主要威胁：\n\n*   **物理攻击：**\
  \ 当有人获得设备访问权限时，就会发生物理攻击。物联网设备安装在可能发生物理攻击的环境中，这可能导致组件损坏/更换。生物攻击会破坏、损坏或销毁物联网设备、设备组件和数据可用性\
  \ [54]。\n\n*   **传感器黑客风险：** 物联网设备中传感器黑客攻击的主要目标是生成错误数据。传感器是自动驾驶汽车、无人机和医疗设备等安全关键系统所必需的。破坏这些系统的安全性可能导致死亡或事故。基于这些原因，传感器始终被设计为故障或缺陷的替代方案\
  \ [55]。\n\n\n\n\n\n### 6.6 网络物理系统安全解决方案\n\n网络安全架构旨在保护完整的环境，包含数字安全、信息系统、机密性，以及架构和应用周边环境。利用软件定义网络（`SDN`）和工业自动化检测的安全措施和黑洞攻击分类算法，是信息系统互联违规行为的示例。软件定义网络物理系统（`SD-CPS`）由研究[[60]](#chapter6.xhtml#ref6_60)提出，作为解决\
  \ CPS 实现和设计难题的一种方法和框架。\n\n`SD-CPS` 利用 `SDN` 交换和微控制器，在没有 `SDN` 交换时融入 `SDN`。因此，`SD-CPS`\
  \ 与未融入 `SDN` 的当前 CPS 实现兼容，并可与之配合使用。它包含广泛的 `SDN` 部署、设计、增强和替代评估方法的研究途径[[61]](#chapter6.xhtml#ref6_61)，并在其研究中确立了一种新颖的检测技术。\n\
  \n这些信息安全策略如图 6.4 所示，CPS 访问控制分为四类：硬件安全、连接识别、计算机病毒识别和基础设施容量[[62]](#chapter6.xhtml#ref6_62)。\n\
  \n![图 6.4 网络安全方案。](img/fig6_4.jpg)\n\n图 6.4 网络安全方案。\n\n#### 计算机病毒识别\n\n最近，已开发出多种查找漏洞的方法[[63]](#chapter6.xhtml#ref6_63)。这些底层机制被用于识别\
  \ CPS 中黑客的软件传播，因为它们仅描绘了互联网上的识别。研究[[64]](#chapter6.xhtml#ref6_64)、[[65]](#chapter6.xhtml#ref6_65)建议了一种基于每个在线社交网络（`OSN`）属性的预警互联网社区网络蠕虫识别方法。该过程利用距离测量系统，通过将“诱饵好友”与实际\
  \ `OSN` 用户群体关联来确定用户交互。每当有证据时，识别系统便利用网络和局部关联算法，区分有害传播和合法用户信息系统[[66]](#chapter6.xhtml#ref6_66)–[[70]](#chapter6.xhtml#ref6_70)。\n\
  \n### 6.7 结论\n\nCPS 是一项革命性创新，为许多工业创新奠定了基础。它本质上涉及与各种组件和传感器、执行器、实时生成的数据、过程分析以及多种交互式应用程序进行交互。本章旨在聚焦\
  \ CPS 安全的相关性，为未来研究奠定基础。为了深入了解新范式，我们描述了 CPS 的基本方面及其挑战。随后，阐述了针对 CPS 的各种威胁及其解决方案。威胁与\
  \ CPS 安全解决方案密不可分。大多数国家专注于这项新技术以提高生活质量。\n\n由于 CPS 网络安全是一个将自身与当前在线空间区分开来的新领域，因此研究极少。CPS\
  \ 通信通道包含感知、数据类型、实际统计结果、过程分析和实现接口。本章区分了危险、补救措施，并重点介绍了 CPS 保护计划，突出了 CPS 并为每个问题提供了替代方案。CPS\
  \ 模型和网络安全引发了关注和挑战，并展示了现有的安全市场，包括 CPS 相关研究。CPS 专用安全保护程序评估了每一层级的危险和补救措施，提出了未来分析前景。\n\
