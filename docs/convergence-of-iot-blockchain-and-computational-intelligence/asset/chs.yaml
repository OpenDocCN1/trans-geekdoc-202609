  \ Dec. 2019, pp. 99–104.\n\n\n\n\n## 10 利用数据分析设计智能医疗信息系统\n\nP. Nagaraj, V. Muneeswaran\
  \ and Annamalai Pandiaraj\n\nDOI: [10.1201/9781003353034-10](https://doi.org/10.1201/9781003353034-10)\n\
  \n### 10.1 简介\n\n数据分析是对医疗行业产生的数据进行分组和分析，有助于获得更好的洞察并支持决策制定。实时虚拟体征可传输至电子健康记录（EHR）。大数据分析有助于通过各种举措更好地了解医疗组织，包括疾病监测及其预防工作、诊断和临床方法的演变，以及个性化、有效的医疗营销活动的演变。服务的实施，以便更早地识别疾病传播，为疾病监测、监控医疗和卫生组织的质量以及提出更好的治疗方法带来了新的见解。医疗数据管理是从不同来源提取数据并进行存储、保护和分析的过程\
  \ [[1]](#chapter10.xhtml#ref10_1)。控制可用的海量医疗数据，使医疗系统能够创建患者的综合视图、定制治疗方案、改善沟通并提升健康结果。基于医疗系统的数据分析可以深入洞察医疗系统的资源浪费；维护个体从业者绩效、追踪人群健康，并识别患慢性病高风险人群。\n\
  \n医疗系统中的数据分析可被视为将数学工具应用于大量数据，以使其保持完美形式，帮助患者就其健康做出明智决策。图 10.1 展示了在医疗系统和住院治疗中发挥主要作用的四种主要数据分析类型。\n\
  \n![FIGURE 10.1 Different types of data roles in the healthcare system.](img/fig10_1.jpg)\n\
  \n图 10.1 医疗系统中不同类型的数据角色。\n\n它们如下：\n\n*   描述性分析。\n*   诊断性分析。\n*   预测性分析。\n*   处方性分析。\n\
  \n上述四种分析是数据分析中的主要领域，在医疗系统和住院治疗中发挥着重要作用。\n\n### 10.2 描述性分析在医疗系统中的工作\n\n描述性分析是基于数据分析的医疗系统中发生的第一步。描述性分析基于医生将要问患者的问题：“发生了什么？”。描述性分析检查患者“发生了什么？”以及参与医疗系统的提供者。例如，假设一个人有健康问题并来到医院。图\
  \ 10.2 显示登记处会询问患者“发生了什么？”。在那里，该人必须告诉接待员他/她“发生了什么？”。从接待处拿到门诊单后，该人会去找医生，医生会问患者“你发生了什么？”，他/她患有什么健康问题？\n\
  \n![FIGURE 10.2 Examining the patient \"what happened?\" to him/her.](img/fig10_2.jpg)\n\
  \n图 10.2 检查患者“他/她发生了什么？”。\n\n描述性分析始于“发生了什么？”这个问题。这是医疗系统开始的第一步。\n\n### 10.3 诊断性分析在医疗系统中的工作\n\
  \n诊断性分析基于高级分析，通过检查数据或计算来回答“为什么会发生？”这个问题。它通过下钻、数据发现和数据挖掘等技术来识别 [[2]](#chapter10.xhtml#ref10_2)。\n\
  \n诊断性分析基于症状工作，以指示“发生了什么？”的根源。主要在于医生和其他护理人员仍对最终诊断负责；他们可以实施数据分析策略以节省时间并避免可能的判断错误。例如，我们将继续使用描述性分析中使用的同一个例子。诊断性分析在医生询问完患者后开始。患者向医生解释了他/她的健康问题后，医生开始对患者进行诊断，这被称为“诊断性分析”。第二步始于患者向医生解释健康问题之后。然后医生开始诊断患者“为什么会发生？”。通过描述性分析，医生将根据诊断分析开具处方。图\
  \ 10.3 显示根据诊断样本，医生将根据患者的健康问题给出完美的处方。总体而言，诊断性分析回答“为什么会发生？”。诊断性分析主要可通过各种技术描述，包括下钻、数据发现、数据挖掘和相关性分析\
  \ [[3]](#chapter10.xhtml#ref10_3)。\n\n![FIGURE 10.3 Examining the patient \"why\
  \ it happened?\".](img/fig10_3.jpg)\n\n图 10.3 检查患者“为什么会发生？”。\n\n#### 10.3.1 下钻的工作\n\
  \n\n\n\n\n下钻是一种技术，允许用户深入分析数据或事实中更精确的层级。通常，报表中每一层级的格式和外观保持一致，但数据的详细程度各不相同。通过使用该技术，我们可以利用现有的层级结构创建可视化，并将表格转换为矩阵或图表形式以分析策略。\n\
  \n下钻在住院医疗中的应用有助于通过从一层级向更详细层级的计算来探索数据的多个维度。这使患者能够获得更好的知识，查看汇总后的摘要数据，然后以层级方式从数据的顶层深入探索，以进行更深入的生物学分析。\n\
  \n#### 10.3.2 数据发现的工作\n\n数据发现被定义为从各种来源收集和分析各类数据，以从数据的隐藏模式和趋势中获得更好的认知洞察。它是充分利用组织数据以对关键业务决策提供简要说明的第一阶段。\n\
  \n数据发现由商业智能工具（如数据发现软件）提供支持。21 世纪的商业智能工具正无菌地授权全球范围内的医疗体系设施，使其能在宏观和微观层面同样积极地推进超增强规划与渲染。医疗技术系统提供的益处多种多样，范围涵盖从组织和记录医疗资源到提升患者治疗标准。通过主动管理态势，医疗服务提供者可以遵守政府法规要求。这有助于医疗服务提供者避免对态势做出被动反应，转而采取主动措施防止其发生。数据发现工具是跨医疗体系董事会提供特定活动领域中使用的新旧方法体系、以及用于信息存储与检索科学的数据处理能力的“宠儿”。\n\
  \n#### 10.3.3 数据挖掘的工作\n\n数据挖掘是从任意原始数据的大量数据集中提取可用数据的过程。它通过使用不同类型的软件，执行对大批量数据中最佳数据模式的分析。数据挖掘也称为数据知识发现（KDD）。在一个示例过程中，从大量数据中提取新数据被称为数据挖掘，也称为\
  \ KDD。\n\n基于商业智能，数据挖掘包含极佳的透视技术，使医疗系统能够系统地使用数据和分析，以了解低效环节和最佳实践，从而提供最佳护理并降低成本。“数据挖掘”一词在医疗系统中针对特定患者包含不同类型。基于患者的健康报告，不同患者将呈现不同模式。从简单原始数据中提取健康信息在医疗系统中称为数据挖掘。通过数据提取，患者可以获得关于特定患者健康状况的原始报告。在医疗系统中，从大量数据中获取新数据（原始数据）称为数据挖掘。\n\
  \n### 10.4 预测分析在医疗系统中的工作\n\n预测分析基于原始数据的使用、统计算法和机器学习技术，旨在根据历史提供的数据（即为未来使用而存储的历史数据）更好地了解未来结果的可能性。这是基于已发生的事件，为未来将要发生的事情提供更好的预判。\n\
  \n预测分析是数据分析的主要类型之一 [[4]](#chapter10.xhtml#ref10_4)。预测分析通过电子算法对预测数据有用，可实时创建未来事件的预测。该技术使医疗系统承诺具备利用“大数据”或数据分析的能力——海量的实时数据集等，这些数据由`EHR`系统收集和分析，以改善患者预后能力并降低医疗护理成本。这将产生最佳的政策、伦理和法律挑战。\n\
  \n预测模型提出治疗建议，这些建议由开发者启用并设计，旨在改善总体健康人群的整体结果，但这些建议可能会影响医生基于伦理承诺为患者提供最佳个体化治疗的行动。一个系统如果无法避免表达出这样一种关联：即基于医疗机构的法规，由于在向其他可能满意的利益相关者引入新技术时，某些特定条件患者的满意可能性相对较低，因此系统具备生成最优结果以改善这些患者健康问题的能力。预测分析还更强烈地关注这样一个庞大患者群体：那些已经处于弱势地位的人群。\n\
  \n图 10.4 描绘了过去十年间预测分析在医疗领域的重要性如何显著增加，因为实时电子数据集的规模和复杂性已增长到常用数据处理工具证明不再足够的程度。通过利用`EHR`的优势，在医疗系统中实施预测分析变得容易。在医疗系统中使用预测分析有助于计算统计学、计算机科学和临床决策支持领域数十年工作中历史存储的大量数据。在数据分析的这个显著时代，预测分析的使用在获取各种当前或历史信息（如索赔、临床、社会和基因组数据）以做出最佳预测方面发挥着主要作用。\n\
  \n![图 10.4 预测分析技术。](img/fig10_4.jpg)\n\n图 10.4 预测分析技术。\n\n预测分析的格局正在迅速演变，这使得预测技术进步将如何影响医生和患者的反应变得越来越困难。因此，基于这些主要原因，预测分析模型必须在所有后续时间点接受评估、更新、植入和重新评估，且保持一致。图\
  \ 10.5 展示了该过程可通过不仅涉及模型设计者，还涉及所有人的支持来实施，以应对技术凸显的未来法律和伦理问题。\n\n![图 10.5 通过预测分析检查患者数据。](img/fig10_5.jpg)\n\
  \n图 10.5 通过预测分析检查患者数据。\n\n### 10.5 规范分析在医疗系统中的工作\n\n\n\n\n\n#### 医疗保健中的处方分析\n\n\
  处方分析依赖于利用机器学习算法，根据计算机程序做出的预测，确定在商业环境中应采取的适当行动 [5]。处方分析还与预测分析协同工作，后者利用原始数据获取关于近期结果的更好认知\
  \ [6]。处方分析使医疗保健系统决策者能够以最简单的形式获得业务成果，通过为患者或提供者推荐更好的行动方案。他们也可以独立思考，以便对多个“现状”方案进行比较，从而评估选择某一步骤而非另一步骤的影响。医疗保健系统中产生的分析的最后阶段是处方分析。处方分析不同于预测分析，但它不仅仅停留在展示这两种分析之间可能的结果\
  \ [7]，而是继续揭示推荐行动，使医疗服务提供者在商业上或教会层面更加成功，以满足患者需求 [8]。\n\n处方分析可用于分析明年眼科理赔是否会增加。它将帮助人们决定明年是否应保持最低眼科报销费率不变、增加或降低。它帮助每个人做出更明智的决策。处方分析对于使医疗保健系统组织做好准备以应对未来和不可预见的事件也很有用。处方分析将不同于预测分析，因为它将为通常使用它的医疗保健系统带来更多益处。图\
  \ 10.6 显示，预测分析帮助医疗保健系统预测其结果，但处方分析深入挖掘，以便根据这些发现采取完美的分析行动。它帮助医疗保健系统提高结果成果的效率。处方分析消除了决策过程中的所有主观臆测，并对其进行优化，以获得患者护理方面更好的改进。归根结底，一切都是关于医疗保健系统为患者提供最佳可能的护理。\n\
  \n![FIGURE 10.6 Prescriptive analysis techniques based on the healthcare system.](img/fig10_6.jpg)\n\
  \n图 10.6 基于医疗保健系统的处方分析技术。\n\n### 10.6 医疗保健系统中的数据收集\n\n收集数据的行为涉及以结构化的方式组织和分析医疗保健系统数据。解释这些数据对于开发、实施和评估公共卫生预防策略至关重要。许多大国需要加强其信息系统\
  \ [8]。\n\n图 10.7 显示，医疗保健系统中的数据收集用于创建患者的整体视图、个性化治疗、推进治疗方法，并改善医生和患者之间的社交与沟通，以了解特定患者健康问题的最佳结果。\n\
  \n![FIGURE 10.7 Data collection process is done in the healthcare system.](img/fig10_7.jpg)\n\
  \n图 10.7 医疗保健系统中的数据收集过程。\n\n医疗保健系统中使用了各种数据收集方法来收集数据，包括医疗保健系统调查、行政登记和账单记录。医疗记录被各种实体使用，包括医院、社区健康中心、医生和健康计划。\n\
  \n### 10.7 医疗保健系统中的数据提取\n\n数据提取是医疗保健行业中广泛使用的技术之一。从预防性支持的早期阶段开始，它在数据遗传学方面面临着关键斗争。图\
  \ 10.8 显示，数据遗传学是在特定时间从特定系统收集数据的最佳方法。\n\n![FIGURE 10.8 Data extraction is done in\
  \ the healthcare system.](img/fig10_8.jpg)\n\n图 10.8 医疗保健系统中的数据提取过程。\n\n数据提取试图利用患者的相关数据，包括药物史和综合数据，使经批准的用户（如医生）能轻松访问\
  \ [9]。它广播了保持细节安全和可获取的重要性，以防止任何非法访问 [10]。它通过包含所有人口统计学特征、疾病史、预防性检查或体检，创建了自动化的分析历史。如今，医疗保健系统中的数据提取广泛发生在教育环境中\
  \ [11]。将其纳入健康计划并做出**重大**改变**需要**三种方法。它们是分析、最佳实践和采用，以及演进的前因。\n\n### 10.8 医疗保健系统中的数据生成\n\
  \n医疗保健系统中的数据生成是巨大且快速的，涉及安全数据存储和计算方法融合的灵活性 [12]。\n\n图 10.9 显示了这样一个条款：数据分析已被引入，用于描述超出典型硬件属性处理、存储和分析能力的海量数据集\
  \ [13]。\n\n![FIGURE 10.9 Data generation is done by the healthcare system.](img/fig10_9.jpg)\n\
  \n图 10.9 医疗保健系统进行数据生成。\n\n### 10.9 医疗保健系统的分析\n\n分析基于专注于医院管理、患者记录、成本、诊断等方面洞察的原则，通过在医疗保健系统中使用分析技术来完成。分析涵盖了医疗保健系统广泛的社会层面，在宏观和微观参与层面提供洞察\
  \ [14]。图 10.10 显示，医疗保健分析基于数据分析系统，允许医疗保健系统专家获得医疗保健行业管理、患者预约、薪酬和诊断方面改进的可能性 [15]。\n\
  \n![FIGURE 10.10 Analysis of data done by the healthcare system.](img/fig10_10.jpg)\n\
  \n图 10.10 医疗保健系统进行的数据分析。\n\n### 10.10 医疗保健系统中的可视化与报告\n\n数据可视化在医疗保健系统重点中提供了最重要的技术；它对于识别重要模式和相关性非常有用，并使数据分析更加系统化\
  \ [16]。数据可视化是健康指标和衡量最好的机构之一，只是主要共享可视化的重要组织之一 [17]。\n\n医疗保健系统中的事件报告（IR）被规定为提高患者安全专业化的重要手段。IR\
  \ 的目的是识别最佳安全威胁并扩展干预措施以减轻这些威胁，从而减少医疗保健系统中的不道德行为 [18]。仪表板有助于医疗专业人员快速分析海量数据集，以节省时间，甚至通过医疗专业人员挽救患者的生命\
  \ [15]。对可视化 EHL 仪表板的评估使仅在一年内用于数据分析的时间减少了 65%，预计未来将进一步获益。\n\n\n\n\n大量医疗保健组织已经开始以图表形式提供数据，这些图表由客户制作，用于原始数据的展示。图\
  \ 10.11 显示，与数据相比，可视化更具交互性和可定制性，观众希望借此获得更好的健康知识。您正在处理的数据以及您面向的受众将共同决定要使用的最佳演变媒介和数据可视化类型\
  \ [19]。无论在何种情况下，数据可视化都能构建海量数据集，使其更高效并产生最佳感知结果。数据分析可视化有助于专业人士找到分析医疗保健系统中患者健康状况的最佳技术，并根据患者的健康分析做出最佳决策\
  \ [20]。\n\n![图 10.11 医疗保健系统面临的问题和挑战](img/fig10_11.jpg)\n\n图 10.11 医疗保健系统面临的问题和挑战。\n\
  \n### 10.11 医疗保健系统中的问题、挑战、障碍与议题\n\n我们生活在一个数字化世界；每分钟都在产生大量数据。用户每分钟产生的数据使得存储、管理、利用和分析变得极具挑战性\
  \ [21]。即使许多业务管理系统也在努力寻找利用这种海量数据的方法。每年，40%–60% 的数据对专业人士没有用处；他们需要患者的有用数据进行分析。越来越多的组织正在利用数据采集和大数据分析工具，通过大规模准备有用数据来处理数据\
  \ [22]。\n\n此外，医生和专业人士面临的主要挑战如下：\n\n1.  需要在不同数据源之间快速执行一次或多次操作。\n2.  缺乏懂大数据分析的专业医生。\n\
  3.  利用大数据分析产生有用的洞察。\n4.  将海量数据导入大数据平台。\n5.  数据管理环境的不可预测性。\n6.  存储海量有用数据及其质量。\n7.\
  \  保护有用数据并为用户数据提供隐私。\n\n在 图 10.11 中，为克服医疗保健系统组织中的这些分析挑战，它们应在培训项目中更加精准，以分析医疗保健系统中的大数据分析\
  \ [23]。\n\n### 10.12 医疗保健系统中的管理问题\n\n图 10.12 展示了如何剖析货币医疗服务框架，该框架整合了多个部分，例如处理财务、患者信息录入、利用编码服务处理保险或临床担保、临床账单与拒付管理，以及报销安排。\n\
  \n![图 10.12 医疗保健系统面临的管理问题](img/fig10_12.jpg)\n\n图 10.12 医疗保健系统面临的管理问题。\n\n主要问题基于以下方面：\n\
  \n1.  成本与透明度。\n2.  消费者体验。\n3.  交付系统转型。\n4.  数据与分析。\n5.  消费者数据访问的互操作性。\n6.  整体个体健康。\n\
  7.  相关：医疗保健领导力的未来。\n8.  下一代支付模式。\n\n### 10.13 医疗保健系统中的数据质量\n\n医疗保健系统中的数据质量包含基于通用特征的技术，包括精确性、稳定性和相关性\
  \ [24]。通过使用数据质量，医疗保健信息技术通过降低冗余、减少医疗错误和改善健康结果来提升数据质量。\n\n医疗保健系统必须生成高质量数据，并必须以结构化方式的概念为基础，建立长期管理的坚实基础。通过生成这些，我们可以期望加速现有流程，并构建提供更明智政策决策的学习成果，从而满足所有利益相关者。\n\
  \n图 10.13 显示，数据质量可以呈现他人在您的数据中所见的最佳质量图景，并使便携式数据存储可供其他患者、医生或专业人士使用 [25]。我们应始终探索原始数据，以清晰了解健康问题。基于数据质量指标和编码建立单一等级报告系统。\n\
  \n![图 10.13 医疗保健系统中的数据质量](img/fig10_13.jpg)\n\n图 10.13 医疗保健系统中的数据质量。\n\n### 10.14\
  \ 医疗保健系统中的公共报告数据\n\n公共报告广泛用于了解医疗保健系统中护理质量的信息发布与报告，以及长期护理提供者为患者和用户所用 [26]。这主要在社交平台和互联网上开展，也发布在杂志和其他格式中，以发展医疗保健系统设施。公共报告系统不仅帮助患者和用户了解选择，还以不同方式针对不同受众，提供特定医疗保健系统的最佳报告\
  \ [27]。质量以不同方式启动。图 10.14 展示了健康和长期护理的不同报告，意味着这些不同方式在不同领域可能具有不同重要性 [28]。\n\n![图 10.14\
  \ 医疗保健系统中公共报告的示例](img/fig10_14.jpg)\n\n图 10.14 医疗保健系统中公共报告的示例。\n\n可以向指标发出查询和指南，以鼓励其贡献和报告，但也存在担忧，即它们可能导致提供者表现不利。为增加公共报告，医疗保健系统应遵循以下技术：\n\
  \n1.  展示相关信息。\n2.  计算指标以匹配用户技能水平。\n3.  升级演示方法。\n4.  指导患者和用户了解健康与长期护理的质量，并提高患者和用户对公共报告的意识。\n\
  5.  让专业人员参与维护公共报告系统。\n6.  设计决策辅助工具并支持其使用。\n\n因此，在考虑如何应用公共报告时，具体考虑以下因素：\n\n1.  货币与人力设施需求。\n\
  2.  报告对护理人员是强制性的还是自愿的。\n3.  数据是否可能作为监管调查或临床检查的一部分产生。\n4.  解决数据供应中表现不佳的技术。\n\n###\
  \ 10.15 医疗保健系统中的数据隐私与治理\n\n\n\n\n《健康保险流通与责任法案》（HIPAA）是一项于 1996 年颁布的美国法律，用于数据安全监管。HIPAA\
  \ 有助于界定什么构成健康数据或“受保护健康信息”（PHI）。HIPAA 使用 18 个 PHI 标识符：姓名、邮政编码、病历、社会安全号码等。保障隐私可以促进医患之间更有效的沟通，这对护理质量、增强自主权以及避免经济损失、尴尬和歧视至关重要。患有健康问题的患者应确信保密性是医学的一大支柱\
  \ [29]。保护患者的个人详细信息不仅关乎道德尊重；对于维护医患之间基本的信任纽带也是必要的。维护隐私和保密性有助于保护患者免受潜在伤害，包括心理伤害（尴尬或痛苦）；社会伤害（失业或财务状况受损）；以及刑事和民事责任\
  \ [30]。\n\n图 10.15 显示，医疗保健领域的数据治理关注如何保护、保障并准确收集每一条数据 [31]。医疗保健系统中的数据治理是维护数据以支持患者护理决策的重要过程和系统。数据治理有助于防范未经授权访问患者私人健康信息\
  \ [32]。个人健康信息（PHI）已由数据治理明确界定，以制定保护健康数据并确保其安全的策略。\n\n![图 10.15 医疗保健系统中的数据治理与安全。](img/fig10_15.jpg)\n\
  \n图 10.15 医疗保健系统中的数据治理与安全。\n\n### 10.16 结论\n\n根据数据分析产生的结果，可以采取具体步骤或措施来降低医疗保健系统中提供的医疗设施的总体成本。成本降低可能体现为这些医疗设施客户的费用负担减轻。通过分析医疗保健系统中产生的数据，患者将根据其健康问题获得更有用的处方。通过采用多种生成精确数据的分析方法来检查特定患者的健康状况，医疗保健系统可以通过应用四大分析原则：描述性分析、诊断性分析、预测性分析和处方性分析，来改善对患者健康的理解。本章总体阐述了基于医疗保健系统中进行的操作类型，数据如何在医疗保健分析中发挥主要作用。\n\
