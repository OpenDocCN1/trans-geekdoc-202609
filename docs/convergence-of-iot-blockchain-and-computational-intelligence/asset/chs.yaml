  Wai Yie Leong and Rajendra Kumar\n\nDOI: [10.1201/9781003353034-1](https://doi.org/10.1201/9781003353034-1)\n\
  \n### 1.1 简介\n\n利用无线连接，联网车辆是一种新型智能交通系统，旨在提高效率和交通安全。车辆通信是指车辆与基础设施、其他车辆和无线设备建立的无线连接。这些连接也被称为车辆到基础设施、车辆到车辆和定制车辆网络。在过去的\
  \ 10 年里 [[1]](#chapter1.xhtml#ref1_1)，许多学者、工业界（生产商、电信、自动化制造商等）、政府（交通部门）和专业标准协会（如\
  \ ASTM、IET、ISO、IMechE）都对联网车辆通信线路表现出了极大的兴趣。这些各方的相互作用促成了许多研究、创新和开发项目，包括 Intellidrive、CVIS\
  \ 和 AHS。其愿望是开发联网汽车通信技术并提供概念验证。开发和演进联网车辆通信的主要目的，主要是通过为驾驶员提供防止道路事故所需的信息和支持，来维护应用的安全性\
  \ [[1]](#chapter1.xhtml#ref1_1)。无线通信技术必须持续提供适当的质量、覆盖范围、容量和可用性，以便针对延迟执行服务质量 (QoS)。这是因为联网车辆通信应用的公共安全需要可扩展、可靠且负担得起的核心技术方案。尽管可能启用许多非安全方法和应用，但安全应用的延迟和可靠性要求仍可得到满足\
  \ [[1]](#chapter1.xhtml#ref1_1)。\n\n### 1.2 智能交通系统\n\n该系统由复杂且协调的软件和基于传感器的信息传输应用，以及交通管理使用的信息添加过程组成。智能交通利用先进方法，通过信息控制器高效管理交通\
  \ [[2]](#chapter1.xhtml#ref1_2)。\n\n#### 1.2.1 智能交通系统的类型\n\n利益相关方共同使用以下五个类别对智能交通系统\
  \ (ITS) 进行分类：\n\n*   现代交通控制技术。\n*   现代便携式信息系统。\n*   商用车辆运营系统。\n*   现代公共交通基础设施。\n\
  *   复杂的车辆安全与控制系统 [[2]](#chapter1.xhtml#ref1_2)。\n\n该系统的基本组成部分包括：\n\n1.  **信息收集**：在战略研究层面评估方法，作为大众运输的发展战略。因此，它被视为此类研究中最昂贵且最重要的组成部分。为了在交通管理中利用灵敏度并帮助缓解交通拥堵，这一初始阶段包括将它们放置在高速公路的指定位置。此外，它与智能交通标志相关联，后者从这些知识中受益。其次，专门的交通摄像头被用于记录违章、评估安全水平并检查路线的某些方面\
  \ [[2]](#chapter1.xhtml#ref1_2)。\n\n2.  **数据分析与处理技术**：这些技术包括将原始数据转化为驾驟员可用信息的软件和工具，例如根据交通瓶颈的存在降低限速或重新规划交通路线\
  \ [[2]](#chapter1.xhtml#ref1_2)。\n\n3.  **控制与监控方法**：建立控制室、交通和运输信息库、交通状况和警示标志。这些方法还包括根据各种交通事项与公共交通当局进行协调\
  \ [[2]](#chapter1.xhtml#ref1_2)。\n\n### 1.3 车辆连接数据分析\n\n如 图 1.1 所示，预计到 2030 年，全球汽车年产量将达到\
  \ 80 万辆。这种高度的自动化可用于提供无需人类驾驶员的乘客运输 [[3]](#chapter1.xhtml#ref1_3)。\n\n![FIGURE 1.1\
  \ 2023 年至 2030 年汽车产量的预期与估算水平。](img/fig1_1.jpg)\n\n图 1.1 2023 年至 2030 年汽车产量的预期与估算水平。\n\
  \n随着我们逐渐接近许多人预测的无人驾驶交通的未来图景，如 图 1.2 所示，许多企业正积极参与技术竞争，以构建完全自动驾驶汽车。得益于近年来人工智能的快速发展，无人驾驶汽车已成为现实。事实上，在近年来，自动驾驶汽车在美国公共道路上已报告行驶了数百万英里，极少有可怕的事故被报告\
  \ [[4]](#chapter1.xhtml#ref1_4)。\n\n![FIGURE 1.2 加利福尼亚州自动驾驶汽车在公共道路测试的统计数据。](img/fig1_2.jpg)\n\
  \n图 1.2 加利福尼亚州自动驾驶汽车在公共道路测试的统计数据。\n\n图 1.3 对比了国家安全委员会进行的两项民意调查的信息。第一次发生在 1 月，第二次发生在\
  \ 2018 年 3 月底或 4 月初。1 月时，36% 的受访者认为自动驾驶汽车比人类驾驶的汽车不安全。然而，到了 4 月初，在相同的担忧指数下，回复数量增加了\
  \ 14%。由于一些企业（如 Google 分拆出来的 Waymo，见 图 1.3）的推动，公众对自动驾驶汽车的兴趣有所增加 [[5]](#chapter1.xhtml#ref1_5)。\n\
  \n![FIGURE 1.3 致命事故动摇了人们对自动驾驶汽车的信任。](img/fig1_3.jpg)\n\n图 1.3 致命事故动摇了人们对自动驾驶汽车的信任。\n\
  \n美国尚未为自动驾驶汽车做好准备。因为它们将比替代方案更安全，每个人都想拥有一辆自动驾驶汽车。毕竟，图 1.4 描绘了美国每年的汽车死亡人数 [[6]](#chapter1.xhtml#ref1_6)。\n\
  \n![FIGURE 1.4 美国消费者购买自动驾驶汽车的统计数据。](img/fig1_4.jpg)\n\n图 1.4 美国消费者购买自动驾驶汽车的统计数据。\n\
  \n\n\n\n2018 年 4 月 16 日，美国发生两起悲剧性车祸后，自动驾驶汽车成为舆论焦点。另一起事件涉及一辆基于特斯拉 Model-X 改装的自动驾驶汽车，据报撞上了高速公路分隔带。第一起事件是一辆\
  \ Uber 自动驾驶汽车撞死了一名行人。就在这两起事故发生前，益普索（Ipsos）进行了一项关于自动驾驶汽车观点的重要民调，发现发展中国家对其支持程度最高。\n\
  \n自动驾驶汽车在印度受访者中尤为受欢迎。49%的受访者表示支持，并渴望使用；5%表示永远不会使用；另有 46%持怀疑态度但觉得这个概念很有趣。中国也显示出类似的乐观程度；然而在俄罗斯，仅有\
  \ 33%表示支持，59%不确定。\n\n在南美洲，六成巴西受访者仍持怀疑但好奇的态度，而三成表示他们渴望自动驾驶汽车配备驾驶员。在这两起事故发生前，怀疑论在美国已广泛存在。美国受访者中有\
  \ 25%表示永远不会使用自动驾驶技术，54%表示不确定但很好奇。图 1.5 显示，支持自动驾驶考试的比例远低于印度（22%），美国受访者也表示迫不及待想参加考试\
  \ [[7]](#chapter1.xhtml#ref1_7)。\n\n![图 1.5 世界各地对自动驾驶汽车的不同看法。](img/fig1_5.jpg)\n\
  \n图 1.5 世界各地对自动驾驶汽车的不同看法。\n\n### 1.4 演变与历史\n\n20 世纪 90 年代末，汽车开始主要与外部源连接以确保安全。早期车型具备用于紧急通知的蜂窝连接功能。进入新千年，通信在安全性和舒适性方面得到改进，增加了远程功能，并最终连接至手机\
  \ [[8]](#chapter1.xhtml#ref1_8)。G+D Mobile Security 制定的联网汽车保护方案也在相同时间框架内启动。自 2010\
  \ 年以来，扩展网络使得停车与检视功能、自动驾驶模式、远程控制工具和高级安全驾驶功能成为可能。\n\n早期（20 世纪 90 年代末）的主要亮点，即最初的汽车远程信息处理效益，包括碰撞警报触发危机响应、车辆追踪和紧急救援。OnStar\
  \ 的基础蜂窝架构于 1996 年发布。安全气囊系统在展开时与 OnStar 顾问连接，向急救人员提供信息。梅赛德斯-奔驰于 1997 年以“Keyless Go”之名推出首款远程钥匙。在宝马的协助下，数据服务得到发展。1998\
  \ 年，通用汽车通过现代化基础设施改进了 OnStar 管理，并推出具备语音识别和免提通话功能的车辆 [[8]](#chapter1.xhtml#ref1_8)。\n\
  \n1999 年，梅赛德斯-奔驰推出带有紧急救援和寻车功能的 TeleAid 远程援助。该方案推广的服务包括高级诊断、导航、在线连接、行车日志，以及 2000\
  \ 年代具备有限在线和远程功能的手机应用。TeleAid 重点展示了一款新款梅赛德斯 S 级车型规格和车型，可远程解锁车门。2001 年，OnStar 连接数超\
  \ 800 万，开始提供持续交通数据和远程开门服务。2003 年，由通用汽车 Good Wrench 远程诊断服务设计的大陆驱动演示工具可用于远程车辆控制。大陆通过数字化方案获取设备，逐步提供车辆健康和多功能设备。\n\
  \n2005 年，通过分阶段实施激活了导航功能。2007 年，从 OnStar 提取了针对低速车辆的服务。首代 iPhone 发布。在美国，宝马 Assist\
  \ 管理服务随车购买附赠四年免费服务。目前全球运输的大多数 IT 单元源于大陆进入纯信息技术领域，即“机器对机器数据发展” [[8]](#chapter1.xhtml#ref1_8)。2008\
  \ 年，新款 Android 手机发布。克莱斯勒推出由 Autonet Mobile 提供支持的 Pocket Uconnect Web，提供便捷的 3G WiFi\
  \ 热点以实现持续网络连接。该设备必须由供应商安装。\n\n2009 年，梅赛德斯-奔驰推出 mbrace 管理服务，允许车主通过 iPhone 和 BlackBerry\
  \ 进行通信。可实现远程锁门、解锁和定位车辆。2010 年，通过各种设备实现了更多汽车关联。电动汽车的发展仅增加了对无线和远程应用的需求。部分汽车支持在线软件更新。新服务需要更多连接和更新的信息。在\
  \ V2I 和 V2X 创新中，主要车辆已可见，特别是针对新架构中的远程应用和服务扩展。日产聆风（LEAF）由 CarWings iPhone 应用提供支持，可访问电池充电、行驶里程和温度监控。2010\
  \ 年 CES 展会上，发布了 OnStar 移动应用。\n\n该程序不仅能开门，还允许雪佛兰 Volt 车主设定充电时间。2011 年，OnStar 在 FamilyLink\
  \ 上推出新功能，用于定位家庭成员、发送邮件和设置即时通讯警报。他们还推广运行于 Android 和 BlackBerry 上的日产聆风智能手机应用。2012\
  \ 年，梅赛德斯-奔驰 mbrace 拥有多项功能，包括 Facebook、Yelp、互联网浏览器、地理定位、警报，以及与朋友共享位置的扩展功能。纽约车展上，奥迪\
  \ 7 首映 Google Earth 导航、3G 网络连接。首款支持 3G 并可在线更新软件的特斯拉 Model S 原型车发布。\n\n2013 年，奥迪\
  \ A3 凭借 4G LTE 数据连接成为欧洲顶级车型。截至 2014 年，美国大量通用汽车 2015 款车型可接入 WiFi 4G LTE 热点。特斯拉 S\
  \ 车型配备设备，可在未来软件更新后启用自动驾驶功能。2015 年的漏洞表明，ADAC（德国汽车俱乐部）分析师可远程解锁汽车并复制宝马服务器。欧洲议会报告称，2018\
  \ 年新款和轻型车辆在发生车祸时将自动通知救援机构。\n\n这被称为 e-Call。驾驶员可通过梅赛德斯-奔驰远程泊车辅助程序在车外控制车辆驶出。查理·米勒和克里斯·法拉西克从\
  \ 16 公里外的电脑远程入侵并拦截了一辆吉普切诺基的系统。它控制雨刷、收音机、挡风玻璃和加速装置。梅赛德斯-奔驰推出搭载首个量产车型 Car-to-X 兼容系统的新款\
  \ E 级系统。特斯拉汽车发布包含自动驾驶技术的在线 7.2 软件更新。\n\n2016 年，黑客在多款车型中发现若干漏洞，允许程序员接管汽车甚至将其开走。为控制车外退出，特斯拉发布带有“召唤”功能的\
  \ 7.1 版本。针对部分 2017 款奥迪车型，奥迪美国宣布 V2I 创新（红绿灯数据）。宝马 iOS 版 Connected 3.0 搭载 Alexa、首公里路线、车辆服务警报和\
  \ Apple Watch 应用。宝马 Android 版 Connected 1.0 可用。2017 年，G+D Mobile Security 作为受信任的\
  \ e-SIM 管理合作伙伴加入宝马及其 Connected Drive 服务 [[8]](#chapter1.xhtml#ref1_8)。\n\n### 1.5\
  \ 联网汽车如何运作\n\n\n\n仍有大量研究工作待开展，配套车辆框架仍在开发中。专用短程通信（DSRC）是一种类似于 WiFi 的技术，很可能将作为联网车辆创新安全相关框架的基础。DSRC\
  \ 高效、安全、可靠，且以高度承诺运行。不可靠的应用程序可能依赖多种形式的远程创新技术 [9]。\n\n汽车、卡车、公共汽车及其他车辆将具备在车内或通过持续传输关键安全和交通信息的后市场设备相互“通话”的能力。连接基础设施的车辆可与交通信号灯、施工区域、收费亭、校区及其他基础设施进行远程通信\
  \ [9]。\n\n由于所提供车辆数据的神秘性，车辆无法被追踪，且框架正在改变安全性。联网汽车为驾驶员提供约 300 米范围内类似装备车辆的 360 度感知。该安全框架不追踪您的车辆，并隐藏个人信息。驾驶员将通过视觉屏幕显示、警觉性提示、驾驶座振动或特殊音调接收警告，告知潜在威胁。这些仅是提醒，以保持驾驶员对车辆的持续控制。\n\
  \n然而，当驾驶员仅尝试保持对智能车辆的部分控制时，该技术也可支持有限的自动化任务。驾驶员可迅速响应警报以防止危险碰撞。例如，在汇聚开发支持应用中，当接近十字路口不安全时，会向驾驶员提供警告。当超越行驶较慢的车辆不安全时，禁止超车应用会警告驾驶员。紧急电子刹车灯应用会在前方数辆车外的远处车辆减速时提醒驾驶员，帮助他们预判该易受攻击侧的位置。\n\
  \n劝诫软件使公司驾驶员基本能看到其最脆弱区域发生的情况。即使驾驶员无法看见或听到来车，联网汽车也能与敏感基础设施（如铁路平交道口）通信，提醒他们列车即将到达。联网汽车还可协助应对气候引起的交通状况和健康挑战。这在黑冰等情况下尤为明显，天气可能看起来不危险，但路面难以通行。从多辆附近车辆获取的信息有助于判断是否存在风险。\n\
  \n在冬季，交通管理中心（TMC）可从车辆接收路面温度数据，提供颗粒度的持续数据，帮助监控和管理交通框架的执行。中心随后可执行任务，包括改变交通信号和速度限制、通知维护人员、派遣救援车上路，以及向驾驶员广播警告，使其在智能交通系统中获得持续的路面温度数据\
  \ [10]。\n\n### 1.6 智能汽车\n\n智能汽车是众多高科技综合交通企业之一，也是智能交通系统的主要技术和创新，本研究对其进行了回顾。它是综合汽车技术的统称，可完全或部分执行一项或多项驾驶功能。在过去\
  \ 20–25 年中，一个以汽车和智能车辆为重点的机器人应用重要领域已经形成 [11]。20 世纪最重要的发明之一是汽车。它创造了一个庞大的产业，让人们能自由出行，极大地改变了我们的生活方式。是的，考虑到现代经济的建立方式，汽车在巨大变革中发挥了重要作用。\n\
  \n根据统计，道路上有超过 8 亿辆汽车，预计未来十年数量将上升。这一重大障碍实际上促使建立了多项研究计划，旨在开发驾驶员驾驶时执行的通用动作。“智能汽车”指配备操作系统的车辆，可自动执行驾驶活动，如选择安全车道、避障、穿越拥堵路段、跟随前车、评估并避免危险情况、选择车道。提高驾驶效率、舒适性和安全性，通常是智能汽车发展的驱动力\
  \ [11]。\n\n### 1.7 基础自动驾驶汽车技术\n\n“智能车辆技术”通常指自动驾驶汽车功能的进步。感知环境和车辆状态的能力；与环境通信的能力；以及规划并执行最有效动作的能力，是智能汽车的主要特征。\n\
  \n汽车行业、学术界和政府组织都在寻找智能车辆技术这一快速扩展领域的专家。全球举办的大量无人驾驶地面车辆（UGV）竞赛也在激发对智能汽车技术的广泛兴趣 [12]。\n\
  \n尽管自动驾驶汽车尚未进入自动驾驶汽车制造商的视野，但这些技术正迅速创新应用于乘用车，以在生死关头协助驾驶员。汽车行业下一代车辆保护系统将利用联网汽车技术。Richard\
  \ Bishop 将“智能车辆系统”描述为监控交通状况并提供数据或车辆动力以协助驾驶员执行最佳车辆操作的技术发展 [12]。\n\n### 1.8 智能驾驶员模型与方法\n\
  \n智能驾驶员模型（IDM）方法是智能汽车仿真最常采用的模型。IDM 方法无固定反应时间，以连续可微加速函数形式提供。它更类似于自适应巡航控制（ACC）汽车的特征，而非人类驾驶车辆\
  \ [13]。通过改变少量设置，IDM 可用作 ACC 或人类驾驶车辆。此外，CAV 仿真采用修正的 IDM [14]。IDM 的主要目的如下：\n\n```\n\
  a_IDM(s, v, Δv) = dv/dt = a[1 - [ (v/v_0)^δ - (s*(v, Δv)/s) ]² ]\n```\n\n(1.1)\n\
  \n```\ns*(v, Δv) = s_0 + vT + (vΔv) / (2√(ab))\n```\n\n(1.2)\n\n\n\nIDM 在大多数情况下会产生加速度和减速度。当当前车距远小于预期车距时，减速度会变得过高。就人力驾驶车辆而言，即使在最严重的减速度下，前车也不会无缘无故地突然停下。因此，当车距差超过最优差距离时，这种情况被称为某种程度上的温和临界条件\
  \ [15]。Do、Rouhani 和 Miranda-Moreno 通过将 IDM 与恒定加速度启发式算法（CAH）相结合，解决了这一问题，以最大限度地减少过大的减速度。该\
  \ CAH 模型的基本假设是前车不会在几秒钟内突然改变加速度 [16]。\n\n根据研究，CAH 要正常运行必须满足三个特殊条件：(i) 从不需要安全时间间隔或最小距离；(ii)\
  \ 车主必须立即反应（零响应时间）；(iii) 考虑车辆和前车的加速度在适用的未来（通常为几秒钟）内不会改变 [17]。\n\n给出了实际车距、当前车速、前车车速和加速度的数值。避免车辆碰撞的最大加速度率如下：\n\
  \n```\na_CAH(s, v, v_1, a_1) = { (v² * ã_l) / (v_1² - 2s * ã_l)  if v_1 * (v - v_1)\
  \ <= -2s * ã_l\n                          { ã_l * (v - v_1)² * θ(v - v_1) / (2s)\
  \  otherwise\n```\n\n(1.3)\n\n其中有效加速度率 = min（以防止可能由前车引起的缺陷，前车能够更快地加速）。如果车辆在达到最小车距\
  \ `s` = 0 时完全停止，则该断言成立。否则，负接近率将被海维赛阶跃函数 `Q` 消除，因为它们对于 CAH 来说是不可理解的。Leong 和 Ee [17]\
  \ 提出了结合 IDM 和 CAH 加速度的 ACC 模型。\n\n基于以下因素，ACC 模型根据 IDM 或 CAH 生成不同的加速度。如果 IDM 和 CAH\
  \ 得出相同的速度结果，ACC 模型生成相同的加速度。如果 IDM 产生过大的减速度而 CAH 的减速度在可容忍的减速度范围内，情况会变得略微棘手。在这种情况下，减去减速度后，ACC\
  \ 的加速度仍大于 CAH 的加速度。如果 IDM 或 CAH 产生的加速度显著低于 `b`，则存在严重问题。IDM 和 CAH 的最大组合加速度不得超过 ACC\
  \ 的加速度。IDM 和 CAH 的加速度应是 ACC 加速度的可微且连续函数 [16]。\n\n```\na_ACC = { a_IDM          \
  \                            if a_IDM >= a_CAH\n        { (1 - c) * a_IDM + c *\
  \ [a_CAH + b * tanh((a_IDM - a_CAH) / b)]  otherwise\n```\n\n(1.4)\n\n公式 (1.4) 中的\
  \ ACC 模型像 IDM 一样多了一个参数。这个额外的参数被称为冷静关注因子。在极小距离下，ACC 模型与 IDM 相关，距离强度变化但不发生速度差。Al-Khateeb\
  \ 和 Johari [18] 预测 `c` 等于 0.99。\n\n以 IDM 为基准模型，创建了协同智能需求模型（CIDM） [19]。他们研究了 CAV\
  \ 在系统中的功能。人类驾驶员模型（HDM）利用空间预期方法实现 CAV 通信。\n\nCIDM 受制于 HDM 预期，根据公式 (1.1) 将 IDM 划分为公式\
  \ (1.5)。\n\n```\na_n(Δx, v_n, Δv) = a_n^free + Σ_{m}^{n-1} a_nm^int(Δx_nm, v_n,\
  \ Δv_nm)\n```\n\n(1.5)\n\n基础 IDM 公式 (1.1) 由两个基本组成部分构成：(i) 破损项，将当前距离与预期距离进行比较；(ii)\
  \ 加速项，将当前速度与期望速度进行比较。当公式 (1.5) 中确认 V2V 交互时，其描述与公式 (1.5) 相同。\n\n### 1.9 车辆连接与网络\n\
  \n网络可在各种情况下运行，以防止特定车辆之间的碰撞。能够相互通信的车辆可能有助于减少单车事故或大规模连环碰撞 [19]。为了达到最佳效果，事故预防也可利用联网系统和自主独立系统。研究人员已开始将自控框架与机器学习技术相结合，以提升结合自主与集成系统的潜在双系统性能\
  \ [20, 21]。协同自适应巡航控制（CACC）是自适应巡航控制（ACC）的延伸。CACC 在开发仿真方面取得成功，证明了部署自主和集成 CACC 系统的价值。图\
  \ 1.6 展示了供读者参考的 CACC 定义概念图。GPS 从大气层接收信息并对其进行过滤，以便做出必要的调整。通过对基础设施和技术的具体改进，这可以扩展为实际应用\
  \ [19]。\n\n![图 1.6 CACC 布局。](img/fig1_6.jpg)\n\n图 1.6 CACC 布局。\n\n### 1.10 赋能与促进技术\n\
  \n#### 1.10.1 环境状态\n\n感知汽车周围的环境是智能汽车系统的关键组成部分 [11]。在智能汽车中，理解交通状况是最难完成的任务。它涉及识别关键要素，包括车道、其他现场车辆、行走的行人、交通状况、路标和其他临时障碍物。在道路场景中发现事件时的速度控制是最具挑战性的问题。紫外线、超声波、雷达、激光测距仪和计算机视觉是扫描世界的常用传感器，如图\
  \ 1.7 所示。\n\n![图 1.7 环境状态感知。](img/fig1_7.jpg)\n\n图 1.7 环境状态感知。\n\n红外线和超声波常用于检测附近的障碍物，而雷达常用于探测远处的障碍物。频谱、图像采集和分析被用于在各种环境条件下提供关于道路场景的更多信息。只有视觉传感器能检测道路情况的任何要素，如交通状况和路标。传感器融合常用于智能汽车应用，特别是单目视觉和雷达/激光传感器。\n\
  \n在主要汽车制造商的合作下，一级汽车供应商博世、电装、德尔福、Visteon、西门子和 NEC 主要开展这项研究。这些传感器可用于绘制车辆周围区域的地图，然后可结合同步定位与地图构建\
  \ [22] 等方法，创建停车或避障所需的复杂动作 [11]。\n\n#### 1.10.2 车道跟踪\n\n\n\n自 20 世纪 80 年代初的最初实现以来，一些汽车创新配备了车道和障碍物识别及监测设备。因此，计算机视觉至关重要。尽管激光扫描仪也能扫描路径，但计算机视觉和图像处理技术能准确确定车道结构和车道标记。大多数车道监测策略都是围绕识别车道信号并利用局部地形构建的，例如比较左右车道标志、使用预设道路宽度，或预判经常行驶的平坦路面。\n\
  \n这些假设主要用于解决仅提供一台摄像头（一种具有成本效益的方案）的问题。某些利用立体视觉进行车道线识别的设备可能在没有任何限制的情况下运行。商用车道跟踪器的性能见图\
  \ 1.8。虽然车道识别系统通常以 95% 到 99% 的可靠性运行，但这些系统无法保证 100% 的可靠性。由于自动驾驶无法容忍故障，车道检测设备主要用于车道偏离预警系统。正在开发算法，旨在在各种驾驶情况下实现\
  \ 100% 的驾驶效率 [11, 23]。\n\n![FIGURE 1.8 Lane detection.](img/fig1_8.jpg)\n\n图 1.8\
  \ 车道检测。\n\n#### 1.10.3 识别和检测交通信号\n\n识别和辨认路标是机器视觉的另一项应用，专门用于检测交通灯。路标的设计考虑了个体用户的需求。路标使用了明确定义的形状、颜色和图案组合。横幅在合适的高度和位置沿路线放置。机器视觉也能解读交通标志。检测系统与光检测的结合允许进行识别和辨认。\n\
  \n由于路标可能的范围受限且定义明确，此任务通常使用模式识别方法完成，例如照片间的交叉链接、神经网络或支持向量机。图 1.9 说明了基于速度信号检测的超速预警装置的概念。标志识别的可靠性和鲁棒性提出了若干具有挑战性的研究课题。许多汽车制造商目前正在开发新技术\
  \ [24]。\n\n![FIGURE 1.9 Identification of street signs for level warning broadcast.](img/fig1_9.jpg)\n\
  \n图 1.9 用于限速预警广播的街道标志识别。\n\n#### 1.10.4 车辆检测\n\n人们尝试使用各种传感器技术来检测车辆，包括声纳、激光雷达、雷达和视觉。无论物质的形状和色调如何，其特性都是相同的，并且可以通过其巨大的尺寸和半透明表面来识别。此外，只要街道方向跟踪存在，就可以预测车辆的位置。多个独立传感器可以成功自动识别车辆。\n\
  \n存在一种利用视觉识别车辆的技术。尽管这个问题的答案看似简单，但每个传感器都有独特的应用和困难。虽然视觉通常效果良好，但在光线不足、能见度低（如夜间或隧道内）或交通繁忙时可能会遇到困难。由于汽车消音器和轮胎通常表现出较高的温度，因此在图像中容易被识别，红外视觉（热成像）可以高度确定地识别车辆。然而，静止车辆（如拖车）和刚开始移动的车辆不太明显，因为它们比移动车辆更冷。虽然激光雷达通常可靠，但恶劣天气会降低其灵敏度。\n\
  \n虽然雷达价格低廉，但由于附近存在一些反射物体，其内部测量可能会有偏差。声纳仅可用于极短的时间。该工作的目的是引入成功的多传感器融合。雷达与视觉的融合是一种新兴的补救措施\
  \ [21]。\n\n#### 1.10.5 自适应巡航监测与控制\n\n建议的 ACC 是经典巡航控制的功能扩展，用于与前车保持安全距离。当前方没有车辆时，智能汽车使用自动巡航控制保持固定速度。配备\
  \ ACC 的汽车在利用雷达或激光雷达检测到前方较慢移动的车辆后（时距 1.5-2 秒），可能无法保持安全距离。\n\n图 1.10 展示了 ACC 原理的示意图。由于基于\
  \ ACC 的设备主要为驾驶汽车设计，因此检测任务比追尾碰撞对策的难度稍低。使用 ACC 时，所有静止物体均被禁用，从而避免了这一问题。追尾碰撞避免技术面临的最大传感器挑战是区分停止的汽车和路外物体。移动物体根据多个变量被分类为车道内或车道外\
  \ [25]。\n\n![FIGURE 1.10 Adaptive cruise control (ACC).](img/fig1_10.jpg)\n\n图 1.10\
  \ 自适应巡航控制 (ACC)。\n\n为了确认前方车辆是否在给定路线上，智能汽车的转向范围被用作街道弯曲度量规。这些产品专门作为舒适性产品而非安全系统进行宣传，因此它们仅限于处理典型的低速差常规场景，将更具挑战性的场景留给人类驾驶员。驾驶员始终保持警惕，注视道路并观察周围交通。主要汽车制造商均在推出此类举措。\n\
  \n### 1.11 智能汽车调制系统\n\n空间调制 (SM) 最初是为射频通信而创建的，是一种混合 MIMO 和调制技术，它在降低设备复杂性的同时提升了频谱网络性能。智能汽车利用基于\
  \ SM 的 V2V 和 V2I 通信系统。\n\n### 1.12 空间调制 (SM) 的优缺点\n\n以下是 SM 的优势：\n\n*   SM 完全避免了\
  \ ICI 和 IAS [26]。\n\n*   SM 在发射端仅需要一条射频链 [26]。这是由 SM 的运动系统决定的。数据处理由单个发射天线执行，而所有其他天线保持静默。\n\
  \n*   通过按发射天线数量的比例增加对数域，SM 中的 3D 图显示出双重空间增益 [27]。\n\n*   SM 提供了一种高效的基于频谱的符号，其等效符号速率大于\
  \ 1 [27]。\n\n*   与 MIMO 系统的传统空间复用方法不同，不需要干扰消除算法来解决信道间干扰，使得接收机结构简单 [26]。\n\n*   SM\
  \ 将使用单个当前接收机来访问 ML 解码 [26]。\n\n*   当 Nr < Nt 时，SM 将工作良好。\n\n*   SM 可以在各种控制场景下运行。由于不同的发射机和接收机集合，它经常占据各种空间位置。当所有接收机使用所有发射机的信道脉冲阵列响应来检测数据时，其他用户可以访问相同的无线服务（例如，发现许多用户）[27]。\n\
  \n*   SM 在 MIMO 系统中比传统的低复杂度加密方法更强大 [26]。\n\n\n\n\n#### 缺点\n\n*   要使用 SM 原理，至少需要两根发射天线\
  \ [27]。\n*   如果无线电的无线发射机和接收机链路没有足够分离，则可能无法采用 SM 模型或无法产生令人满意的性能。这一限制与传统的空分复用方法非常相似，后者允许丰富的分散环境来大幅提高变化率\
  \ [27]。\n*   信道估计器可能面临某些限制。信道接收器需要了解整个信道才能识别数据 [26]。\n*   SM 仅导致数据速率随发射天线数量呈对数增长（而非线性增长）。对于实际数量的发射天线，SM\
  \ 可能使实现极高的频谱效率变得更加困难 [26]。\n\n### 1.13 工业革命 5.0 的发展\n\n由于城市交通拥堵带来的巨大成本，迫切需要智能出行解决方案，但随着自动驾驶汽车的普及，其需求只会增加。为了在城市层面启用和管理自动化车辆车队，智能出行服务仍需发展并融合云基础设施、5G、物联网、智能传感器和人工智能等技术；自动驾驶汽车将严重依赖\
  \ IT 网络 [28]。\n\n因此，在十年内，智能公共交通网络将作为中枢神经系统，助力建设可持续城市。多伦多和里斯本的案例让我们得以窥见此类网络的运作方式。尽管它们将对发展中社区产生重大影响，智能公共交通网络在改变文化方面也将发挥重要作用。只要\
  \ ITS（智能交通系统）普及，众多行业也将随之改变。首先，拥有完全自动驾驶汽车的科学家将不需要大多数保险类型。\n\n基础设施目前处于失控状态，这将显著改变房地产价格，并迫使警察和其他公共安全机构将资源从汽车相关问题（如交通罚单，可能会消失）上转移开。你需要强大的信息和通信基础设施，而要获取、处理、保留和分析这些数据，需要\
  \ 5G 通信、智能传感器网络、大数据、人工智能和云计算等突破性技术 [23, 24, 29]。\n\n### 1.14 智能交通系统中的关键技术\n\n1.\
  \  **先进且改进的跟踪系统**：如今，大多数汽车都配备了 GPS 系统。GPS 提供双向通信，以协助交通官员查找车辆、监控车辆行驶速度并提供关键服务。手机、多功能应用和\
  \ Google 导航地图已演变成追踪车辆、了解路况和交通流量以及定位不同地点的有用工具 [30]。\n\n2.  **智能传感技术**：这些技术为汽车和街道系统都配备了智能传感器。射频识别\
  \ (RFI) 和传感器架构保障行人安全。街道反光标和感应线圈广泛分布；这些将有助于交通管理和安全驾驶，尤其是在夜间。此外，它们还能预测某一时段的交通量，并能区分快速和缓慢行驶的汽车\
  \ [30]。\n\n3.  **先进车辆检测**：闭路电视 (CCTV) 或外部摄像头将协助交通指挥处理多项事务。如果关键地点和重要十字路口被摄像头拍摄，管理员可能更容易监控交通流、发现危机情况并识别道路阻塞。机器人车牌识别与车辆控制相结合，允许出于安全原因追踪车辆\
  \ [30]。\n\n4.  **先进交通灯系统**：高峰时段的拥堵灯系统通常使用射频识别 (RFID)。当在少数街道、街道交叉口和汽车上使用时，创新提供精确的计算和数据库。这些灯在高峰和重要交通时段可能无需人工干预即可进行调整\
  \ [30]。\n\n5.  **即时紧急 E-call 车辆服务**：在发生事故或其他悲剧等紧急情况时，车内传感器可以联系附近的危机中心。E-call 可让驾驶员与认证管理员通话，并将日期、地点、车辆位置和车辆描述等重要信息正确传输给中心。在整个欧洲，新注册汽车现在强制要求配备\
  \ e-call 管理系统 [30]。\n\n6.  **精确路线信息**：如果驾驶员知道哪条路线最适合他们的行程，对他们来说将轻松愉快，尤其是前往不同区域时。借助交通模式、路线框架、急转弯、停车标志和街道状况的持续信息，出行可以变得更轻松。驾驶员可在出发前通过屏幕、便携设备或在线媒体通信和网络获取此信息。此外，他们还可以利用通信、远程设备和可变情报标志\
  \ (VMS) 监控驾驶时长、交通流水平、备选道路、街道建设项目、交通方式、费率和停车设施 [30]。\n\n7.  **安全与车辆控制**：通过警报和车辆控制细节，管理部门为车辆驾驶员提供安全协助。驾驶员将评估其驾驶技能、路况和车辆效率。通过研究各种车辆的路径，他们在变道或在十字路口转向时，将知晓任何正面或后侧事故。当因极端天气或夜视不良导致能见度差时，汽车上的先进摄像头可定期通过拍摄特定区域图像来协助驾驶员。目的是警告驾驶员和救援车辆工作人员即将发生的事故，以防止事故或事件\
  \ [30]。\n\n### 1.15 智能交通结构与架构\n\n智能交通的基本原则是，个人应能在适当的时间、地点和计算机上获取适当的信息，从而有信心地做出交通决策，并轻松采用更好、更快捷的方法。为实现这一目标，我们需要软件架构。这些系统处理各种任务，包括停车、交通、数据交换、公共广域交通、网络路由和能耗管理。\n\
  \n1.  **利用物联网信息的图形导向交通**：在每个街道交叉口都安装了街道传感器，以测量道路上的交通详情，如车辆数量、平均车速、交通流量、车型大小等。而车辆配置用于收集特定车辆的信息，如位置和速度。它们通过中继节点、网络、网关和分类将来自这两个框架的信息连接到数据库。\n\
  \n\n\n\n\n#### 智能交通架构\n\n本智能交通架构中提到的主要方面用于识别从 A 点到 B 点的最高效路线，具体取决于当前的交通状况，或者可用于提醒交通专家注意街道阻塞、交通流量增加和伤亡事故等情况\
  \ [31]。\n\n### 2. 多站共享车辆系统的交通系统架构\n\n实际上，社区汽车网络由多辆车辆组成，这些车辆在一天中经常被众多个人使用 [31]。图\
  \ 1.11 展示了一个多站共享车辆系统及框架的示例。\n\n该架构由三个主要部分组成：\n\n1.  用户行程登记组件\n2.  系统管理要素\n3.  车辆的部件和组件。\n\
  \n![FIGURE 1.11 Multi-station shared vehicle system and framework.](img/fig1_11.jpg)\n\
  \n图 1.11 多站共享车辆系统和框架。\n\n用户行程登记组件的主要目标是登记一项需要入册的车辆申请（插图底部）。客户必须拥有非接触式卡（每位用户一张）和触摸屏显示器，以便请求车辆。下一部分称为系统管理组件。该系统基于一个包含客户、车辆和网络信息的运行数据库。\n\
  \n智能代理始终在更新此数据库。登记过程、监控过程、系统操作员界面、数据记录和额外的远程处理只是这些敏锐专家中的一部分。电子登记程序负责监控来自网关访问的数据。基础是观察组件，它持续监控来自车辆车队的数据，向指定车辆发送“登记”信号，并例行测量行程结束时的行驶时长和距离。框架管理员通过设备管理员界面以基于地图的方式跟踪每辆车的状况。\n\
  \n车辆细节和登记亭均可被重点关注，以了解更多关于客户驾驶模式、车辆行为以及管理流程可靠性的信息。远程控制允许对设备移动进行程序化控制，在客户到达预定时间时收费，如果车辆未越过预定界限则追踪车辆以保护它们，记录车辆故障警告，记录车辆到达时间，并预测交通需求。\n\
  \nUCR IntelliShare 车辆模块是该设备的第三个组件。无线电应答器曾被用于与框架管理进行通信。它集成了作为协议基础的推理方法，并与车辆控制信号的各部分（如车门锁和启动激活/停止硬件）进行接口连接。为了确定电池的充电状态，辅助电池电压、里程表脉冲估计、车门开/关信号、充电信号以及变速器档位信号范围，与汽车上的多个信号协同工作。该框架的主要要素是例行车队维护。该方法将改善空气质量，减少停车拥堵，并增加地面车辆的吸引力。客户和设备管理员都深感受益\
  \ [31]。\n\n### 3. T-CPS（交通-网络物理系统）架构\n\n该策略的主要目标是将物理对象的发展数据和系统状态传输到数字框架，然后连接专注于计算、通信和控制技术组装的数字框架和物理段，以实现数据交换、设备同步和高效车辆动力学。其模型实施了一种面向\
  \ SOA 的协作编程构建理念 [31]。\n\n感知层是该系统设计中的顶层。该层利用传感器和汇聚枢纽。观察世界上任何物理资源（包括汽车和公用设施）的能力至关重要。网络层包括所有物理站点和枢纽。其功能主要是在将上层解码的初始信息传输到数据中心时确保联接效率。计算层是第三部分。\n\
  \n该层的主要任务是保持持续信息评估和仿真的熟练度。影响层构成了该结构的第四层。该设备可基于交通流量信息提供科学控制算法，向控制枢纽发出指令，或通过执行器传达危机准备信号。接下来是操作表。凭借持续的交通数据办公室，其软件将灵活适配客户终端。\n\
  \n该系统未探究任何纳入常规车辆布局考量的新组件。该系统将实际物理组件连接到数字网络，但存在一些缺点，包括维持极高的可用性、确保该框架的可靠性和一致性以实现足够的控制效能、适当适应异常和交付、以及提高交通数据传送的准确性和实用性\
  \ [31]。\n\n### 1.16 智能交通应用\n\n1.  **电子收费 (ETC)** 通过允许车辆以交通流速通过收费站，减少了收费站的拥堵并实现了收费自动化。随着\
  \ ETC 车道和市中心围栏区域的使用，拥堵收费现在正通过更先进的技术得到实施。ETC 系统最初用于促进通行费收取。直到最近，大多数 ETC 系统都专注于汽车中的无线电技术，利用专有协议在车辆通过门架时对其进行分类\
  \ [32]。\n\n2.  **动态交通信号灯排序**：动态交通信号灯排序利用 RFID 技术，绕过或避免了通常使用图像处理和光束中断技术的系统所遇到的问题。为了提供最佳的时间管理策略，一个拥有众多车辆、车道和道路的区域配备了\
  \ RFID 系统，该系统结合了强大的编程算法和海量数据库。为每个路口的通行制定了一份具有挑战性的时刻表。在某些极端情况下，动态排序算法会进行调整。车辆数量和路由特征可以模拟交通警察的决策\
  \ [18]。图 1.12 展示了多车道交通排序的示意图。\n\n    ![FIGURE 1.12 Flow of multilane traffic sequence.](img/fig1_12.jpg)\n\
  \n    图 1.12 多车道交通流序列。\n\n\n\n\n\n### 3. 紧急车辆警报系统\n\n车载 e-call（紧急呼叫）由车辆乘员手动生成，或在事故发生后由车载传感器激活自动生成，或两者兼有。电子呼叫同时将语音和数据发送至最近的紧急救援地点（通常为公共安全应答点）。语音联系使车辆乘员能够与合格的\
  \ e-call 接线员通话，同时也向接线员提供其采取必要行动所需的最少信息，例如车辆身份、事故详情、事故日期、精确位置和行驶路径。此类场景见 图 1.13。E-call\
  \ 是所有合法类型汽车的热门选项，主要在工业化国家 [33]。\n\n![FIGURE 1.13 Information about emergency vehicles’\
  \ approach.](img/fig1_13.jpg)\n\n图 1.13 紧急车辆接近信息。\n\n### 4. 自动道路执法\n\n图 1.14 所示为一种检测和识别违反限速或其他道路法律车辆的系统。随后，根据车牌号对被告提出指控\
  \ [34]。然后通过电子邮件向车主发送交通罚单。该程序包含：\n\n![FIGURE 1.14 Allocation of ASE camera displayed\
  \ at Dubai Smart City.](img/fig1_14.jpg)\n\n图 1.14 迪拜智慧城市显示的 ASE 摄像头部署。\n\n*   用于检测超速行驶汽车的测速摄像头。各种系统还利用埋设在每条车道中的电磁或雷达线圈来测量车速。\n\
  *   设置在交通灯路口的摄像头，记录车辆在红灯亮起时越过停止线的行为。\n*   安装在公交车道上的摄像头，用于检测占用公交车道的车辆。\n*   检测车辆跨越双实线的设备。\n\
  *   高承载车辆 (HOV) 车道使用摄像头抓捕违反 HOV 规则的车辆 [34]。\n\n**防撞系统：** 每辆车都配备了已被证明可降低事故率的防撞技术。鉴于汽车制造商开始使用前向传感器来辅助车辆检测。防撞系统收集所有数据以识别任何潜在障碍物。\n\
  \n如果汽车与任何其他物体之间的速度差不太大，该系统可能能够完成导致安全驾驶行为的任务。理想的防撞系统仅会发出警告，让驾驶员自行决定是刹车还是远离障碍物 [35]。\n\
  \n### 1.17 结论\n\n智能技术，如车载连接和传感器，将逐渐获得更多公众认知。这是机器人技术在汽车行业广泛应用的唯一迹象。这种方法展示了行业在整体防护方面取得进步的愿景，重点关注拥有安全系统。这些企业的车辆单位安全成本可能远高于车辆本身。工作环境截然不同，因为专家负责操作和处理需求。随着生产商逐渐获得生产可靠质量和成本产品的能力，政府将持续致力于解决责任难题。因此，驾驶员被框架置于特定模式中\
