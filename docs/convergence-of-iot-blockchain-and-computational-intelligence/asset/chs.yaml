  \ 2019.\n\n## 8 利用区块链技术解决物联网系统中的安全与隐私挑战\n\nGauri Shankar, Gaganpreet Kaur and Sukhpreet\
  \ Kaur Gill\n\nDOI: [10.1201/9781003353034-8](https://doi.org/10.1201/9781003353034-8)\n\
  \n### 8.1 简介\n\n#### 8.1.1 物联网\n\n联网设备正在取代或整合其他技术，使系统更快、更高效、更智能。这只有通过物联网网络和设备才能实现。目前，物联网技术正在各个行业领域以及日常生活中被广泛采用。物联网是互联网和智能设备这两种技术的结合，其重要性使其成为数字世界极具前景的未来技术\
  \ [[1]](#chapter8.xhtml#ref8_1)。物联网被用作智慧城市发展的关键工具，其中所有资源都通过智能设备连接到互联网，以提供更好的服务。需要持续评估物联网技术，以了解用户及其设备的共享信息，以及用于此目的的架构和先进技术，从而使信息能够无缝传输\
  \ [[1]](#chapter8.xhtml#ref8_1)。这些功能得益于物联网中使用的基本技术，如图 8.1 所示，详细讨论如下。\n\n![图 8.1\
  \ 物联网的基本技术。](img/fig8_1.jpg)\n\n图 8.1 物联网的基本技术。\n\n##### 8.1.1.1 射频识别 (RFID)\n\n\
  \n\n\n\n###### RFID\n\nRFID 利用无线电波采集数据以实现自动识别；此过程使用两个元素：标签和读取器。标签可以以电子产品代码 (EPC)\
  \ 的形式存储比条形码更多的数据。标签有三种类型：第一种是有源标签，拥有内置电池进行通信；这种标签还可以包含不同种类的传感器以监测不同条件。这种标签的应用包括\
  \ IT 资产管理、制造业、实验室、医院和远程感知。第二种标签是无源标签，由读取器供电，没有自己的内部电池 [2]。这种标签的应用包括护照、物品级追踪、电子收费和供应链。第三种是半有源标签；标签使用电池为微芯片供电，在通信时从读取器汲取电力\
  \ [2]。\n\n##### 8.1.1.2 无线传感器网络 (WSN)\n\nWSN 连接的设备用于监测环境或物理条件，并与 RFID 集成以追踪目标对象或情况。在这种情况下，可以使用不同类型的网络拓扑来建立多跳通信。关于用于无线通信的低功耗小型电路的最新研究正在扩展\
  \ WSN 的应用。WSN 的另一个应用是将其用于追踪和维护系统，这些系统追踪特定时间段内的维护需求，有助于降低非计划性维护的成本 [3]。\n\n#####\
  \ 8.1.1.3 中间件\n\n在 IoT 网络中，帮助为连接设备提供更好通信和 I/O 的软件应用程序称为“中间件”。任何 IoT 系统的开发者都使用特性抽象来隐藏架构中使用的技术细节\
  \ [4]。这涉及分布式计算架构的促进。中间件是为复杂的基于 IoT 的分布式计算架构开发应用程序的最佳选择。\n\n##### 8.1.1.4 云计算\n\n\
  云计算是连接资源（如存储服务器、应用程序等）的架构，用于共享或访问不同类型的系统、服务或任何其他连接的基础设施。在 IoT 基础设施中，云计算至关重要，因为它通过连接设备产生海量数据，而云计算是这些数据流及其前所未有的实时处理的理想后端解决方案\
  \ [5]。\n\n##### 8.1.1.5 IoT 应用软件\n\nIoT 基础设施的开发还涉及应用软件，该软件以可靠且稳健的方式为与连接设备及其用户的交互提供接口。这些应用程序旨在确保以适当的时机从连接设备接收和处理数据\
  \ [6]。应用软件向最终用户呈现数据可视化，帮助理解交互所处的环境。借助应用软件，IoT 设备变得更加先进和智能，使其能够在无需人工干预的情况下进行监控、识别和解决问题。\n\
  \n#### 8.1.2 IoT 特性\n\n##### 8.1.2.1 连接性\n\nIoT 最关键的部分是连接性。如果互联组件或设备之间没有无缝通信，IoT\
  \ 生态系统（传感器、计算引擎、数据中心、传感器等）就无法正常运行。无线电波、蓝牙、Li-Fi 和 Wi-Fi 都是连接 IoT 设备的选项 [4, 5]。\n\
  \n##### 8.1.2.2 分析\n\n下一阶段是分析正在收集的数据，并在连接所有必要对象后将其应用于开发高效的商业智能。从生成的数据中提取洞察至关重要。例如，传感器会产生数据，但除非人类正确理解这些数据，否则它们毫无用处\
  \ [7]。\n\n##### 8.1.2.3 主动参与\n\n被动参与占当今与联网技术交互的很大一部分。多种产品、跨平台技术和服务通过 IoT 基于主动参与的基础进行协作。一般来说，区块链中云计算的使用允许\
  \ IoT 组件之间进行主动交互 [5]。\n\n##### 8.1.2.4 可扩展性\n\n每天都有越来越多的行业启用 IoT 领域。因此，IoT 系统应能够应对大规模扩展。产生的数据量因此而巨大，必须得到妥善管理\
  \ [8]。\n\n##### 8.1.2.5 人工智能\n\nIoT 利用数据收集、人工智能算法和网络技术，使手机、可穿戴设备和汽车等变得智能，改善人们的生活\
  \ [7]。例如，Apple Watch 具有这样的功能：检测其佩戴者是否发生意外，并从附近医院呼叫救护车，通知佩戴者最近的亲戚和朋友。\n\n### 8.2\
  \ IoT 应用\n\n一些 IoT 应用如 图 8.2 所示，并按如下进行讨论。\n\n![图 8.2 IoT 的应用。](img/fig8_2.jpg)\n\
  \n图 8.2 IoT 的应用。\n\n#### 8.2.1 IoT 与医疗保健\n\nIoT 系统，也称为医疗物联网 (IoMT)，现已在医疗保健行业发挥重要作用。IoT\
  \ 在医疗保健行业有许多应用，例如在家中追踪老年患者的健康状况、收集医院患者的健康数据、智能健康监测以及危重患者的警报设备。如今，IoT 被用于远程医疗系统，外科医生可以远程进行手术\
  \ [9, 10]。IoT 系统的另一个关键应用是移动医疗应用或可穿戴设备。这些帮助用户和医生追踪实时医疗数据。目前，IoT 结合智能应用参与不同类型的诊断过程，例如扫描和筛查\
  \ X 光片以轻松识别真实问题。文献 [11] 提出了一种系统，利用集成了 IoT 系统和应用软件的不同种类传感器系统监测患者或用户的全身以收集实时数据，并通过认证流程保障系统安全。文献\
  \ [12, 13] 设计了一种 IoT 系统来监测和追踪患者的健康信息，并结合区块链防止未经授权的用户访问。\n\n#### 8.2.2 工业中的 IoT\n\
  \n\n\n\n\n#### 8.2.3 教育\n\n智能课堂是利用物联网基础设施在教育系统中应用的最佳范例之一。通过使用物联网设备，一个普通校园将转变为智能校园，这意味着运营校园将需要极少的人力\
  \ [18]。智能校园可具备以下设施：\n\n*   **智能教室**：在智能教室中，配备了智能黑板，用于通过收集教师在黑板和字母上书写的课堂数据来辅助教学过程。它们既可在教室内使用，也可在教室外使用。还有许多其他传感器将用于控制教室的噪音和温度，安防摄像头也连接到物联网基础设施，将用于追踪上课期间学生或教职工的移动情况。教室中的智能身份证与智能考勤系统集成，该系统使用\
  \ RFID 为学生和教职工打卡考勤 [19, 20]。\n\n*   **智能实验室**：为实验室配备传感器以预防事故是一个明智的决定，但在实验室中使用基于物联网的智能系统来监控可能导致事故的学生移动情况并提醒教师，则是一个更明智的决定。目前，智能实验室配备了监控设备，当发生任何事故时会自动触发警报，并呼叫相关主管部门\
  \ [19]。\n\n*   **智能操场**：发掘学生的优势涉及在体育活动期间对其动作进行监控和分析，因此物联网在体育中的最佳用途是利用摄像头和物联网应用软件来监控和收集学生数据，然后对其进行分析以促进其进步\
  \ [19, 21]。\n\n在近期趋势中，`Raspberry Pi` 在低成本基于物联网的教学和学习模块开发中发挥了重要作用。学生们正在学习如何使用 `Raspberry\
  \ PI` 并为他们的教室开发新工具 [22, 23]。此外，`5G` 技术的进步将使连接到智能校园的设备上的通信过程比以往任何时候都更快 [24]。\n\n\
  #### 8.2.4 电子政务\n\n电子政务是对所有属于政府职权范围内事务的管理，如资源、技术、流程和人员。当政府使用数字技术为民众处理资源时，称为“电子政务”；但当物联网参与到这一过程中时，它就转变为“智慧治理”\
  \ [25]。智慧城市是智慧治理的最佳例证，因为在智慧城市中，运行城市所需的基本事务（如道路交通、政府服务、办公场所和治安）只需极少的人力。在智慧城市中，自动交通灯控制交通流。连接到物联网系统的摄像头根据交通量计算疏导道路所需时间，并放行需要通行的车流\
  \ [26]。\n\n目前，使用政府服务变得过于简单，因为政府办公室在登记和服务交付中都使用智能设备。最好的例子是集成 Aadhar（印度唯一身份识别号）的注册流程，只需一个\
  \ Aadhar 号码和一个指纹扫描仪即可注册政府服务；无需填写任何表格，因为系统从 Aadhar 存储服务器检索数据 [27]。人们正在使用自来水接驳、燃气接驳等政府服务，并能通过智能手机支付这些服务费用，这得益于统一支付接口（UPI），这是一种由政府提供的基于云的服务，通过安全网络连接企业和银行\
  \ [28, 29]。\n\n在安全方面，执法部门和军队也在使用智能设备进行监控和抓捕罪犯。近年来，当地警方使用无人机监控城市宵禁，因为路径狭窄，短时间内无法到达。安全部队也在做同样的事情，但方式更先进，因为他们使用连接到智能物联网基础设施的先进监控系统\
  \ [30]。这种国防技术用于监控边境的任何入侵行为。在此系统中，无人机或监控摄像头通过互联网或云计算系统与主机系统连接，分析地面和空中的移动情况，如果发现任何未识别或可疑的移动，立即向国防人员发出警报。\n\
  \n### 8.3 物联网基础设施上的网络攻击\n\n网络攻击分为：\n\n*   软件攻击\n*   硬件攻击\n\n#### 8.3.1 物联网软件攻击\n\
  \n在这种情况下，攻击者针对物联网基础设施的软件应用程序，以破坏网络。攻击者试图通过多个步骤操纵设备固件，第一步是分析固件更新流程和设备组件。然后攻击者在固件更新过程中编写代码，该代码可被执行以通过调试通道或联合测试行动组（JTAG）获取设备访问权限（JTAG\
  \ 为扫描和调试印刷电路板提供标准和边界）。\n\n\n\n\n成功访问后，下一步是通过 `JTAG` 或串行控制台从受损设备获取响应 [31, 32]。攻击者通过使用软件破解工具来执行此操作，其中一些工具列在\
  \ 表 8.1 中。\n\n##### 表 8.1 带利用工具的物联网软件攻击类型\n\n| 攻击类型 | 工具名称 |\n| --- | --- |\n| **Web\
  \ 测试** | * `ZAP` * `sqlmap` * `sslyze` * `Gobuster` |\n| **调试** | * `GDB` * `OpenOCD`\
  \ |\n| **漏洞查找** | * `Flawfinder` * `Metasploit Framework` |\n| **二进制逆向** | * `IAD\
  \ Pro` * `Radare2` * `Binaryaninja` |\n| **固件分析** | * `Firmwalker`: `cpu_rec`, `binwalk`\
  \ * `FAT` (`Firmware-Analysis-Toolkit`) * `FACT` (`Firmware Analysis and Comparison\
  \ Tool`) |\n\n#### 8.3.2 物联网硬件攻击\n\n硬件攻击针对物联网基础设施的硬件系统，利用设备漏洞的步骤与软件攻击相同。部分硬件攻击工具如\
  \ 图 8.3 所示，用于攻击物联网基础设施。在“硬件攻击”这一术语中 [31]，它们进一步分为三类：\n\n![图 8.3 硬件攻击工具类型。](img/fig8_3.jpg)\n\
  \n图 8.3 硬件攻击工具类型。\n\n*   非侵入式攻击\n*   半侵入式攻击\n*   全侵入式攻击\n\n##### 8.3.2.1 非侵入式攻击\n\
  \n攻击者无法直接访问设备芯片，但可以监听特定设备的物联网网络流量，并将伪造数据发送到 `JTAG` 或更改固件更新代码以获取访问权限，或向设备发送随机或垃圾数据，使其忙于处理这些数据而无法为预期用户服务\
  \ [31, 33]。\n\n非侵入式攻击通过侧信道攻击执行，其基本用途是拦截网络流量、发现漏洞，然后执行利用。此类攻击有多种类型，例如：\n\n*   **时序攻击**：这些攻击针对设备的计算时序，如果发现漏洞，会将其作为设备安全性的漏洞，专门针对认证。该攻击还可用于监控设备芯片上的未命中缓存和已处理缓存并比较差异；基于此，攻击者能够找出芯片上写入的指令、访问寄存器值或重现设备的内存内容\
  \ [34]。\n*   **硬件故障注入**：攻击者可以操纵设备的电源，通过升高或降低电压来损坏其芯片。此外，攻击者还可以控制控制指令的设备芯片时钟速度，降低芯片性能\
  \ [35]。\n*   **功耗分析**：根据处理的数据和写入的指令，对拦截的设备进行功耗分析。结果是，攻击者可以获得芯片上正在处理的数据信息。这可以通过简单功耗分析、差分功耗分析、电磁辐射信道或声学信道来完成\
  \ [36]。\n\n##### 8.3.2.2 半侵入式攻击\n\n此攻击在物理上针对芯片执行。攻击者首先通过禁用设备并在芯片上发射红外光来分析攻击的目标位置。作为对芯片上此操作的响应，会产生光子发射，基于此，攻击者可以分析芯片并识别要攻击的目标组件。通常，这用于通过改变触发器的位并使用探测器来破解设备的加密\
  \ [31, 33]。\n\n##### 8.3.2.3 完全侵入式攻击\n\n这种设备攻击需要专家知识，且比其他攻击付出更多努力和成本，但成功率 100%。在此攻击中，攻击者使用离子束修改芯片以生成芯片的微探针模式，并可对其重新配置\
  \ [31]。\n\n#### 8.3.3 物联网基础设施攻击类型\n\n基于上述物联网基础设施攻击的分类，针对物联网设备的攻击可分为以下不同类型。\n\n#####\
  \ 8.3.3.1 隐私攻击\n\n此攻击在物联网网络上执行，旨在从网络中收集个人或用户群体的信息。此攻击可用于通过重新生成任何类型的安全访问卡或密码来窃取经过认证用户的身份。该攻击还可用于通过确定目标用户使用了多少设备和昂贵服务，来了解其财务状况和详细信息。由于物联网基础设施中连接了大量用户，因此如果发动任何其他类型的攻击，也可能危及用户隐私\
  \ [37]。\n\n##### 8.3.3.2 设备攻击\n\n在设备攻击中，主要概念是通过攻破网络中的任意设备来获取物联网网络的访问权限。作为传感器，它将被攻破并作为特洛伊木马向物联网网络发送病毒，感染整个网络并为攻击者提供访问权限。这种攻击非常严重，因为如果一台设备被感染，整个网络基础设施都将受到影响。考虑到连接设备数量庞大，检测受感染设备的过程耗时且成本高昂。因此，预防胜于治疗，设备加密和认证可能有所帮助\
  \ [31, 37]。\n\n##### 8.3.3.3 网络攻击\n\n该攻击主要针对物联网网络的通信性能，通过拒绝服务 (`DoS`) 攻击实施。它会导致通信延迟或降低网络计算性能\
  \ [32]。此攻击也称为“网络可用性”。此类攻击的一个例子是向银行物联网网络的处理单元发送虚假信息，这将花费大量时间来验证信息的真实性。对于经过认证的用户，这些类型的攻击会在物联网网络中引起恐慌或通信缓慢。物联网网络中的通信过程至关重要，即使是微小的事件也可能导致高昂的损失和安全入侵。使用加密数据传输和去中心化数据存储系统可以避免此类攻击\
  \ [32, 37]。\n\n##### 8.3.3.4 数据攻击\n\n针对数据的攻击、设备间的传输、以及物联网网络中提供存储或效用的行为，若破坏网络则会削弱或暴露基础设施。这比双工数据通信系统更危险。一个简单的例子是客户操纵智能电表以节省账单金额；这种操纵可能危害整个网络。为防止这种情况，数据完整性在物联网网络中至关重要\
  \ [32]。\n\n基于这些针对物联网基础设施和设备的攻击，可以识别不同攻击的行为及其对物联网基础设施的危害程度。图 8.4 显示了受害者报告的攻击数量，图\
  \ 8.5 显示了近几年报告的损失。该报告基于 表 8.2 中列出的部分攻击以及互联网犯罪投诉中心 (`IC3`) 的数据生成，仅针对美利坚合众国 [42]。\n\
