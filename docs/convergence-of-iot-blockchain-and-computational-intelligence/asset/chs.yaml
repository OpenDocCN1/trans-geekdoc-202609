  \n## 7 基于深度学习的自动驾驶与云交通管理系统用于智慧城市\n\nSoujanya Syamal, Joyatee Datta, Srijita Basu\
  \ and Shuvendu Das\n\nDOI: [10.1201/9781003353034-7](https://doi.org/10.1201/9781003353034-7)\n\
  \n### 7.1 简介\n\n\n\n\n\n#### 智能交通与交通控制系统的发展\n\n智能交通与交通控制系统的发展[1]得益于信息技术和数据通信的快速进步。智能交通控制系统是一种采用复杂技术的集成系统。该交通控制系统结合了新的参数和建议，旨在利用面向自动驾驶的内置云架构[2]简化系统。自动驾驶汽车[3]是指能够在监测周围环境中物体的同时自主安全行驶的车辆。它利用传感器组合和人工驾驶员收集数据，获取实时结果。完全自动驾驶且达到最高效率尚未实现，但该模型是实现自动驾驶的下一步。此前已有多次尝试改进自动驾驶。本章提出了一种旨在使自动驾驶在现实场景中更便捷、更胜任的解决方案。本章提出了一种感知、学习与行动（SLA）模型以改进自动驾驶。SLA\
  \ 模型的灵感源于现代前沿的基于人工智能（AI）的系统，这些系统能持续从环境中学习并做出反应。该研究可被视为一种新智慧城市概念[4]的快速导入，旨在实现更安全、更舒适的交通系统。\n\
  \n本章其余部分安排如下。第 7.2 节阐述相关工作，并突出本工作的创新性与重要性。第 7.3 节和第 7.4 节描述系统架构。第 7.5 节详述工作流程。第\
  \ 7.6 节展示结果，最后第 7.7 节总结本章。\n\n### 7.2 相关工作\n\n关于该主题已有大量现有研究。大多数研究聚焦于自动驾驶汽车的算法效率。在大多数调查工作中，云激活车辆和自动驾驶车辆仍是两个分离的产品。在本研究中，尝试将这两个方面融合为一体，以使其成为一个更高效、动态和响应迅速的系统。\n\
  \n文献[5]中，采用基于三维点云和 `SVM`（支持向量机）的系统来检测道路标志和障碍物，从而实现自动驾驶。文献[6]中，讨论了自动驾驶的不同关键方面，即导航系统、路径规划、环境感知和车辆控制。这些方面已在拟议方案中得到利用。此外，将实时数据输入深度学习模型，以更精确地评估环境。车辆自主系统将随着时间的推移和收集数据量的增加变得更先进、更老练。其他一些相关工作聚焦于利用传感器检测物体或规划路径[7]，但本研究尝试融合各类传感器数据，在车辆内存中创建一个虚拟世界，以更高效地理解环境。文献[8]中引入了一种驾驶模拟器。此处，`CARLA\
  \ 模拟器`[8]将驾驶任务划分为感知、规划和持续控制等不同模块，并采用强化学习训练系统。值得注意的是，现有工作均未针对自动驾驶车辆实施交通管理。传统交通管理系统已相当陈旧。因此，本研究聚焦于云交通管理，旨在将自动驾驶车辆与其他车辆连接，并试图构建一个生态系统，以形成一个管理良好的交通系统。\n\
  \n尽管该主题已有一些研究，但本文尝试处理该领域一些最容易被忽视的问题，这些问题反映了道路连接性巨大且同时在路上行驶车辆数量庞大的场景，即可扩展性。为解决此问题，系统被划分为两部分：局部和全局交通管理系统，它们处理街道层面的精细化交通管理，并利用这些数据管理全城范围内的交通[9]。\n\
  \n### 7.3 系统架构：自动驾驶\n\n基于云连接的交通系统，提出了一种智能自动驾驶模型——即 SLA 模型（见图 7.1）来实现自动驾驶。汽车将感知周边环境，通过其系统进行学习，并根据其经验和学习模型采取行动。通过深度学习算法，汽车将从传感器数据中学习，并依据经验采取行动。\n\
  \n![图 7.1 SLA 模型。](img/fig7_1.jpg)\n\n图 7.1 SLA 模型。\n\n#### 7.3.1 组件\n\n##### 7.3.1.1\
  \ 车辆导航框架\n\n自动驾驶过程中必须解决两个难题：当前位置以及从起点到终点的路线。车辆路线框架由全球定位系统（GPS）、路线规划和地理数据框架等各类组件构成。这些组件旨在为车辆驾驶员提供无偏见的路线信息。车辆导航系统利用\
  \ GPS 从卫星获取经度和纬度等区域数据。这些数据集包括高级向导数据集和区域框架提供的街道数据。它们通常被用于组织不同模型组件的估算，并采用巧妙的计算组织方法（如\
  \ `Dijkstra 算法`、`Bellman-Ford 算法`）来优化路径估算的组织方式。车辆在估算后可定位自身。利用自行收集的数据，可修改驾驶路线以适应模型。\n\
  \n\n\n\n###### 导航定位系统的主要功能是确定车辆位置\n\n导航定位系统的主要功能是确定车辆位置，分为三类：相对区域、绝对区域和融合区域。对于相对区域，自动驾驶车辆的当前位置是通过将移动距离和方位角加到先前位置上来计算的。车辆的陀螺仪传感器和加速度计在惯性导航系统（`INS`）中获取车辆的精确速度和加速度。通过协调这些信息（例如精确速度、加速度），可以确定车辆的总航向点和速度。结合航向点和速度也可用于确定车辆的方位和距离。通过将其与之前的车辆区域关联，可以建立当前车辆区域。尽管如此，由于行驶时的车辆振动，确定区域与真实区域之间存在差异是不可避免的。绝对区域策略根据从定位框架获得的数据来确定车辆位置。基于卫星的定位系统，如\
  \ `GPS`、全球导航卫星系统（`GLONASS`）[10]、伽利略（Galileo）[10]、北斗（Bei-dou）[10] 等，是常见示例。由于气候条件，卫星信号倾向于车辆方向，这可能会在区域信号中产生大量混淆和不准确。融合区域是自动驾驶汽车驾驶员用来定位理想停车位的策略。`GPS/INS`\
  \ 也可用于路由和区域应用。例如，车辆可以通过遵循由线弯拟合创建的地图来转弯。即使 `GPS` 信号被阻挡，该布局仍保持稳定。NovAtel [11] 基于 `SPAN`（同步位置、姿态和导航）创新，拥有两款关键的\
  \ `GPS/IMU`（惯性测量单元）产品：`SPAN-CPT` [12] 集成路线框架和 `SPAN-FSAS` [13] 分段路线框架。Length CPT\
  \ 使用 Novatel 专业高质量 `GPS` 板卡和德国 iMAR 组织的光纤陀螺 `IMU`。其响应精度可用于多种模式，包括 `SBAs`、`L-band`（Omnistar\
  \ 和 `CDGPS`）和 `RTK`（实时动态差分）等。该框架的俯仰滚动精度为 0.015°，航向精度为 0.05°。德国 IMAR 组织的 [14] 高等级（`HD`）闭环创新\
  \ `IMU` 也被 Range `FSAS` 使用，获得的陀螺偏差小于 0.75 度/小时，加速度计偏差小于 1 mg。通过将其与 NovAtel `FlexPak6TM`\
  \ [11] 或 `ProPak6TM` [11] 结合，可以实现组合导航布局。`GNSS+INS` 框架的输出速率高达 200 Hz，而 `IMU-FSAS`\
  \ 将惯性估计数据传输给 `GNSS` 接收机。\n\n##### 7.3.1.2 电子地图（`EM`）\n\n`EM` 用于指导数据存储，主要包括地理属性、交通数据、建筑数据、交通标志、街道设施等。如今，自动驾驶车辆中使用的大多数\
  \ `EM` 都是为人类设计的。目前，面向自动驾驶车辆的高清（`HD`）地图 `EM` 已发布。与传统地图相比，从一方面来看，`HD` 地图的绝对布局精度更优。例如，预计在不久的将来，绘图应用将精确到毫米级，街道交通数据要素将成为通往自动驾驶汽车的五大关键进步，更加丰富和精准。动态层、独特层和逻辑层是构成\
  \ `HD` 地图的三个层：\n\n*   与传统地图不同，动态层包含 `HD` 街道级信息（街道形状、坡度、起伏、铺设、方向等）、车道属性信息（车道类型、车道宽度等）、凸起物体、护栏、树木、路边类型、路边里程碑和其他大量目标数据。\n\
  *   独特层将定期从其他车辆和街道传感器更新交通数据。更新和补充的过程仍在继续。这是高清地图第二阶段的网络集成社区洞察阶段。\n\n逻辑层通过分析人类驾驶记录的海量数据，辅助自动驾驶车辆的训练。因此，`HD`\
  \ 地图进入了动态和控制启用的组织混合的第三时代。\n\n动作层数据目前可在高级驾驶辅助系统（`ADAS`）[15] 地图上获得，精度为 1–5 米。`ASR`（“自适应速度推荐”）[16]\
  \ 在接近街道转弯时，会分析街道宽度、路线数量、道路总体状况和其他标准，以确定车辆的适当速度。如今，高清地图基本上处于 `ADAS` 级别，可用于自动驾驶等级为\
  \ `L2/L3` [17] 的自动驾驶汽车。\n\n##### 7.3.1.3 地图匹配\n\n在图匹配中，车辆的区域是利用来自 `GPS` 或 `INS`\
  \ 的地质数据和来自 `EM` 的导航数据计算的。在估算过程中，利用高级融合程序将经度和其他方向数据交织到 `EM` 中。从务实角度来看，车辆区域的输出应当精确且时间高效。在这种情况下，寻找一种将来自\
  \ `GPS` 和 `INS` 的数据进行良好结合的方法是一个巨大的挑战。因为 `GPS` 或 `INS` 中的卫星信号随时可能丢失，一种结合当前区域和航向情况数据的良好信息融合技术将极大地提高系统的精度、强度和一致性。\n\
  \n##### 7.3.1.4 全局路径规划\n\n全局路径规划用于确定起点和终点之间的最优路径。为了结合 `EM` 数据并计算最优路线，最常用的计算方法包括\
  \ Dijkstra 算法 [18]、Bellman-Ford 算法 [19]、Floyd 算法 [20] 和启发式算法 [21]。\n\n即使自动驾驶汽车是一个已在企业层面开发和应用的重要创新领域，未来仍有许多问题有待解决：\n\
  \n*   成本与精度：在很大程度上，自动驾驶车辆中的当前定位系统基于卫星定位系统；因此，为了大规模商业用途，重要的是在保持定位精度的同时降低成本。\n*  \
  \ 区域精度与速度之间的权衡：重要的是即使在高速移动情况下也能精确定位车辆。因此，在高速条件下获取高精度定位是未来的研究方向。\n\n创建一个考虑人类个性的自动驾驶汽车\
  \ `EM` 是当务之急。现在谈到提出的模型，需要根据 `SLA` 模型做一些感知，以便从传感器输入数据、处理数据，并通过学习传感器数据来采取行动。\n\n####\
  \ 7.3.2 感知\n\n感知是自动驾驶最重要的步骤。当人类驾驶车辆时，人类拥有不同的器官来感知环境以正确驾驶。但谈到自动驾驶时，车辆应包含类似的媒介来理解环境并正确驾驶。\n\
  \n##### 7.3.2.1 环境感知\n\n\n\n行驶车辆的第三个模块是气候辨识。为了向车辆的控制决策提供关键数据，车辆必须自主观测大致气候。激光路径、光学路径和雷达路径是三个重要的气候辨识工具。多传感器（例如激光传感器或雷达传感器）被部署以从气候中检测广泛数据，随后在气候辨识过程中融合这些数据以感知气候。雷达用于距离计算。\n\
  \n##### 7.3.2.2 视觉感知与物体识别\n\n对于自动驾驶车辆而言，视觉辨识至关重要；例如，检测交通灯至关重要。如今，大多数交通信号的设计都考虑了人类视力；因此，识别交通灯至关重要。此外，计算机视觉还用于确定位置、路径、运动等。最令人困惑的视觉发现，特别是如何确保计算的可靠性和鲁棒性。摄像头用于采集图像数据以可视化环境。在基于视觉辨识的智能汽车路径规划中，有两个基本改进方向。一个可以成功地可视化同步定位与地图构建（`SLAM`）。另一个示例是基于所采集图像知识的视觉布局，该布局通过计算机视觉和\
  \ AI 进行处理。随后，驾驶汽车的人员重建 3D 环境，以便探索和感知交通灯、交通标志和停止线。`SLAM` 是本章的重点。正如 Hammer 问题所描述的那样，机器人在一个未知区域的未知气候中执行任务。在移动过程中，机器人基于位置评估和传感器数据定位自身，同时构建稳定的引导。`S[k]`\
  \ 是从传感器接收到的信息，`M[k1]` 是时间 `k1` 最近的引导，`R[k]` 是时间 `k` 自动驾驶汽车的位置。当机器人从隐蔽地点在隐秘气候中开始行驶时，它利用位置评估数据\
  \ `R[k]` 和发现的信息 `S[k]` 来定位自身，并在行驶过程中构建渐进式引导。基于所采集图像知识的视觉布局通过计算机视觉和 AI 进行处理。随后，驾驶汽车的人员重建\
  \ 3D 环境，以便探索和感知交通灯、交通标志和停止线。此外，云端将向联网汽车提供本地和最近的交通数据，以便其据此行驶。由于存在云端交通系统，且所有车辆都是云端中的独立节点，因此一辆车可以轻松知晓云端中建立的其他车辆的相对位置及其相对速度。这有助于产生更一致的交通流。使用两种不同的提升分类器来完成轨迹编排：一种基于轨迹中每一帧物体的状态，另一种基于整个轨迹的运动描述符。离散贝叶斯通道用于连接这些预期。当后续划分正确时，分类器的精度通常约为\
  \ 98%。一种被动的基于摄像头的流水线已被开发用于交通信号状态发现，此外，在云架构中存在 T to V 通信，即交通到车辆通信，其中交通向信号灯或路口方向驶来的本地车辆发送其状态（无论是红灯还是非红灯）。当车辆接收到状态时，它可以自主决定是否刹车。因此，在计算机视觉检测交通信号之上，增加了一层额外的安全保障。车辆已经知道交通状态，也知道在信号灯处何时需要刹车。交通管理遵循以下序列：(1)\
  \ 首先，车辆和即将到来的交通桩将相互连接并同步。(2) 接下来，将建立 T to V 通信，车辆将接收信号的状态。(3) 最后，如果状态为红灯，则车辆将决定刹车并相应地施加制动。\n\
  \n##### 7.3.2.3 激光感知与无监督标定\n\n在几个方面，激光感知系统类似于雷达系统。在激光辨识中，向物体发射稳定的激光或激光束，发射器接收反射信号。通过估算反射时间、反射信号强度、活动频率的偏移，可以创建目标点的云信息，随后可以确定测试对象的数据，如区域（距离和点）、形状（尺寸）和状态（速度和姿态）。虽然单光束传感器通常可以无需特殊麻烦地进行对齐，但为具有多个并发光束的激光器推断精确的调整一直是一项枯燥且从根本上更难的挑战。一种完全无人监督的方法已被设计用于处理多光束激光调整，恢复每根光束的方向和距离响应函数的理想边界。设计的技术允许同时调整许多光柱，每根光柱都有自己的边界。此外，传感器的外部姿态也已恢复。\n\
  \n使用迭代优化技术演示了一个全方位模型，其世界稳定对准比工厂调整更精确。类似的能量努力用于车辆上 LIDAR 安装区域[[22]](#chapter7.xhtml#ref7_22)\
  \ 的多余调整，但在这种情况下，使用框架搜索的迭代用法来识别最佳的 6-DOF 传感器。位置可以恢复到 1 厘米的分辨率，方向的粒度比手动操作可能达到的精度细得多。最后，采用了期望最大化算法来修改每根光轴的强制稳定返回值，从而实现光柱通常应就气候中（未知）表面的宏伟程度达成一致这一要求。修改后，后续的稳定地图具有更高的可预测性。\n\
  \n在常规道路标志检测的情况下，集成云同步将发挥最大作用。而安装在车辆上的摄像头系统将完成其余工作，以检测实时和相对物体、道路标志等。方向分类器根据地图和导航系统进行训练。因此，根据车辆最新的实时位置，它可以轻松找到标志。\n\
  \n#### 7.3.3 学习\n\n`learn` 参数如下。\n\n##### 7.3.3.1 传感器融合与处理\n\n所有传感器的数据将被处理成独特的数据集，这些数据集可以组合和融合，在车辆的大脑（CPU）中构建一个革命性的虚拟环境，并且通过累积的处理数据，车辆可以实时学习，并日益高效地驾驶。\n\
  \n##### 7.3.3.2 路径与方向规划\n\n\n\n\n# 7.3.3 全球路径规划\n\n最优路径是在起点和终点之间通过全球路径规划确定的。为了融合电子地图（EM）数据并计算最优路线，最常用的计算方法包括\
  \ `Dijkstra calculation`、`Bellman-Ford calculation`、`Floyd calculation` 和 `heuristic\
  \ calculation`。所提出的技术偏离了这一过程，将速度和距离控制提升到了编排层面。此外，通过结合调节和制动/加速的使用，计算融合了感知障碍规避。在每个编排阶段，车辆将遵循最近选定方向的剩余部分。虽然用于选择费用效用函数\
  \ [23] 的基本方法与贝尔曼最优性原理兼容，但限制它的指令无论如何都应接近自动驾驶车辆的最优交通行为。`Frenet-Serret` [24] 公式化和移动边界方法被用于为不同任务组合多个横向和纵向费用函数，以及模拟类人驾驶行为。\n\
  \n##### 7.3.3.3 路由\n\n传统的路由方法基于预先准备的、基于卫星定位服务的深度学习模型，其滞后性很强且更新时间久远。在现有地图上导航和驾驶非常困难。因此，本研究提出了一种集成云交通管理系统，该系统结合车辆的自主算法以高效管理每辆车。交通桩可作为物联网设备，与周边车辆通信以管理其路由，并向其提供关于周边环境的实时数据。因此，自动驾驶汽车可以在城市中导航并轻松规划路线。\n\
  \n##### 7.3.3.4 横向运动\n\n推进的初始条件是根据最近确定的方向选择的，以提高舒适性，从而限制后续路径上的平方加加速度（jerk）。`Quintic\
  \ polynomials` [25] 可用于实际满足这一费用。该方法不是先识别最优路线再修改系数以创建可行替代方案，而是首先通过混合多个终止条件来建立一个方向集。在随后的阶段中，选择费用最低的显著路线。值得注意的是，沿着理想路径推进时，剩余方向在下一步中成为完美的编排。这种方法在极端低点忽略了车辆的非完整性特征，旨在因无效的曲率而排除大多数方向。\n\
  \n##### 7.3.3.5 纵向运动\n\n与以往关注行驶时间或距离的举措不同，重点将放在舒适性上，同时仍有助于高速行驶时的安全性，因为平滑的变化能更好地适应交通流。因此，纵向加加速度（jerk）同样被纳入优化问题中。创建了一个类似于横向方向的纵向方向集，并增加了费用效用，因为距离保持、汇入流和在特定位置停车都需要方向，这描述了从当前状态到纵向潜在移动目标位置的过渡。\n\
  \n##### 7.3.3.6 横向与纵向曲线的融合\n\n在最后阶段，每个方向的组合费用作为加权总和计算：\n\n```\nC[tot] = K[lat] C[lat]\
  \ + K[lon] C[lon]\n```\n\n(7.1)\n\n根据基本理解，对于干道方向生成而言，将所有交通情况识别为汇入、跟车、保持特定速度、在一处暂停及其所有组合已足够，这些情况经常发生冲突。\n\
  \n#### 7.3.4 执行\n\n现在，在处理完实时传感器数据后，机器相应地进行学习，是时候驾驶车辆了。\n\n##### 7.3.4.1 车辆控制\n\n\
  汽车的航向和速度是车辆控制最重要的方面。车辆控制功能主要包括收集车辆状态信息和优化车辆控制方法。感知模块利用电子地图（EM）数据估算车辆速度和方位。电子地图数据包括气候洞察、车辆状态、驾驶目标、交通规则和驾驶信息。然后由车辆控制计算得出控制目标，并提供给车辆控制框架。最后，车辆控制框架执行这些指令，以管理车辆的方位、速度、灯光、喇叭等。控制阶段是驾驶车辆的主要元素，它调节车辆的众多系统，包括防抱死制动系统、牵引力控制系统、电子稳定程序、感应式制动控制、电子制动力分配、制动辅助系统、电子控制悬架、电动助力转向系统等。电子控制单元（ECU）和通信总线是控制阶段的两个主要元素。控制计算主要由\
  \ ECU 执行，而通信总线理解 ECU 与机械元件之间的通信工作。\n\n##### 7.3.4.2 速度与航向\n\n车辆自状态主要包含车辆速度和方向信息。对于速度，使用光电编码器；而路径识别则同时使用光电角度编码器和电位器。由于系统与实时云端同步，车辆可获取其他车辆的统计数据，如速度、航向等，通过在本地计算与其他车辆的相对速度和方向来控制自身的速度和航向。\n\
  \n##### 7.3.4.3 车辆控制技术\n\n比例积分微分（PID）计算，或 PID 计算的更高级版本，广泛应用于车辆控制系统。在当今的机械制造过程中，PID\
  \ 控制计算是最著名的控制算法。输入信号为 `r(t)`，反馈误差信号为 `e(t)`，PID 控制 [26] 计算确定的控制信号为 `u(t)`，受控对象输出的当前实际信号为\
  \ `c(t)`。PID 计算通过利用三个参数和数学运算（包括比例、积分和微分）来控制目标。输入环路对修正目标状态的贡献是控制目标与实际值之间的差值。经典 PID\
  \ 计算存在诸如复杂的参数调整、适应性有限等挑战。控制精度异常低，特别是在传动系统高度非线性且纵向阻抗过于复杂时。最新自动驾驶汽车使用的更复杂的 PID 计算可以弥补标准\
  \ PID 计算的不足。\n\n### 7.4 系统架构：云交通管理\n\n\n\n\n\n#### 云架构与交通管理系统\n\n云帮助我们维护和同步一个中心化数据库，同时提供为所需系统设置实时更新的能力，维护产品的整体完整性。在云架构中，多个云组件使用应用程序编程接口（API），通常是\
  \ Web 服务，相互连接。这些系统比典型的单体系统更易于管理，因为它们将复杂性控制在可控范围内。云架构由不同的层组成，即：基础设施即服务（IaaS）、平台即服务（PaaS）和软件即服务（SaaS）。数据存储在全球多个数据中心的云数据库中。云数据库结构不同于关系数据库管理系统。它拥有多个用于查询服务的节点。这是为了让数据库能够通过云服务轻松且完整地访问。对等通信是处理用户实施的任何查询的最佳选择。云数据库中的每个节点都有一张指向每个节点所含数据的映射表。这张存储数据的映射表使得访问回答特定查询所需的信息变得简单直接。\n\
  \n无论节点是被添加到集群中还是从集群中撤出，确定何时传输协同工作的数据块的路由方法和算法都能确保数据持续可用。当数据需求被复制到新安装的节点时，数据将从原始位置提供服务。一旦新节点拥有了数据的最新版本，路由机制就会开始将请求导向该新节点。\n\
  \n### 7.4.1 基于云的车辆与交通控制系统\n\n拟议系统关注交通信号灯状态、车辆密度和道路相对速度，以实现现代智慧城市的完整交通管理。为确保交通顺畅，交通信号灯管理应高度可靠且一致，而交通密度和速度监控应高度可用，但由于车辆移动，有时可能不一致。如图\
  \ 7.2 所示，系统主要分为两部分：本地交通管理系统和全局交通监控服务。该服务的关键组件是小型本地 Redis 数据库，由一项服务管理，用于按区域通过交通信号灯进行交通控制，以存储少量车辆的即时数据。对于交通信号控制和其他操作，在小范围区域内，可使用\
  \ Redis 数据库形式的临时存储。全局交通监控服务监控速度、位置、发动机状态以及与可扩展 MongoDB 集群和 SQL 数据库共享的车辆身份（ID）对应的每辆车的其他记录。\n\
  \n![图 7.2 云架构。](img/fig7_2.jpg)\n\n图 7.2 云架构。\n\n它还使用图数据库存储道路的地图和连接以及地理坐标点。在该系统中，每辆车将其数据发送到一个通用服务，该服务再根据需要将数据分发给本地和全局交通监控系统。\n\
  \n### 7.4.2 本地交通管理系统\n\n本地交通管理系统由三项服务组成：本地数据馈送器、交通密度分析器和交通信号灯控制器。\n\n本地数据馈送服务将接收每辆车在相应道路上的速度和位置，并将其存储在该区域的\
  \ Redis 数据库中。交通密度分析服务将处理 2-3 分钟跨度内收集的车辆数据，并计算平均交通密度和速度。根据交通密度分析服务的结果、相邻道路交通信号灯的当前状态以及是否存在应急车辆，交通信号灯控制器将决定交通信号的变化。汽车使用\
  \ MQTT 协议与本地交通管理和全局交通监控进行通信。\n\n### 7.4.3 全局交通监控系统\n\n全局交通监控系统包含几项服务：全局数据馈送器、交通违规检查器、最优路径查找服务和应急服务，如图\
  \ 7.3 所示。全局数据馈送服务负责收集地理位置、平均速度、车辆 ID 和类型等数据，并将所需值存储在数据库中。交通违规检查服务将监控车辆状况，如速度、闯红灯违规，并在数据库中记录相应的罚款。违规车辆可通过唯一\
  \ ID 被识别并因违规被罚款。最优路径查找服务将利用沿途每条道路的本地交通管理系统中的本地交通密度分析器，为车辆提供最优或耗时最少的路线。在发生任何紧急情况时，应急服务将利用传感器发送警报或消息，以便交通系统相应地改变其状态。\n\
  \n![图 7.3 云交通连接模拟。](img/fig7_3.jpg)\n\n图 7.3 云交通连接模拟。\n\n重要系统如交通信号灯管理和最优路径查找算法，不会因任何单一车辆的数据不一致而受阻，因为这些服务在给出输出前，会考虑特定区域内所有车辆的数据。\n\
  \n### 7.5 工作流程\n\n系统架构的设计使其整合为单一工作流，以高效且同步的方式同时实现汽车自动驾驶和交通管理，如图 7.4 所示。\n\n![图 7.4\
  \ 工作流程。](img/fig7_4.jpg)\n\n图 7.4 工作流程。\n\n车辆将在云系统中充当一个节点。车辆启动时，会连接到云并从云收集数据。导航设置完成后，汽车开始根据\
  \ SLA 算法驾驶，通过感知环境和障碍物。云将向本地交通桩设备提供所需信息。随后车辆与本地交通设备连接并完成同步，以在道路上导航。由于每辆本地车辆都连接到云交通系统，间接地，交通设备部分控制着车辆的速度和方向。传感器从环境中收集实时数据，数据被送入传感器处理单元（SPU），在那里数据被处理并生成一个独特的虚拟环境，根据这些数据，汽车了解周边情况并在道路上行驶。此外，在行程期间，车辆持续向云提供数据，用于深度学习方法，以更高效地更新自动驾驶算法并高效同步其他车辆。用于设计\
  \ SLA 模型的深度学习算法解释如下。\n\n\n\n\n\n#### CNN 架构与自动驾驶仿真\n\n##### 卷积神经网络设计\n\n卷积神经网络（CNN）的卷积层使用多个滤波器执行特征提取，是设计的关键组件。卷积层由高度和宽度滤波器组成\
  \ [[27]](#chapter7.xhtml#ref7_27)，[[28]](#chapter7.xhtml#ref7_28)。卷积方法将特定尺寸的图片组件转换为称为内核的微小数字数组，系统从中提取新的代表性信息并将其处理为特征图。CNN\
  \ 能够识别图像中的物体。特征提取决定了 CNN 识别物体的能力。卷积结果的每个缩略图均用于创建特征图。同一滤波器应用于每个缩略图的所有区域。每个图像的差异将被标记为独特的特征项。\n\
  \n通过下采样操作，池化层执行子采样技术以在空间上最小化输入（降低参数量）。卷积过程用于降低特征图的维度。即使参数数量减少，该部分的关键信息仍得以保留。一个微小数组将把特征图送入深度神经网络。展平操作将把微小数组转换为一维数组。由全连接层完成的每个图像分类任务的概率是神经网络的最终输出。CNN\
  \ 架构如图 7.5 所示。\n\n![图 7.5 CNN 深度学习层。](img/fig7_5.jpg)\n\n图 7.5 CNN 深度学习层。\n\n反向传播被用作误差修正，以减少先前操作的损失。它利用输出误差更新权重值。误差是通过比较前向传播过程的输出（预测值）与实际值来计算的。计算将根据错误值调整权重。该方法将重复进行，直到误差率降至某一阈值以下。\n\
  \n可更改池化层的数量以提高模型性能。根据 Lee 等人的研究，这是 CNN 建模最重要的方面 [[29]](#chapter7.xhtml#ref7_29)。\n\
  \n##### 自动驾驶模型训练\n\n摄像头的图像以及转向角被输入到 CNN 中。随后，CNN 创建一个转向指令预测模型。将预测模型与实际转向指令模型进行比较，并改变\
  \ CNN 权重以使 CNN 输出更接近预期输出。权重修改通过反向传播执行。\n\n训练过程完成后，系统创建一个转向模型，该模型将基于单个中央摄像头用于驾驶指令，如图\
  \ 7.6 所示。\n\n![图 7.6 CNN 模型。](img/fig7_6.jpg)\n\n图 7.6 CNN 模型。\n\n### 7.6 结果\n\n\
  根据提出的想法创建了一个仿真，并开发了一个自主算法，将其连接到云架构以调节车辆运动。网络基于 NVIDIA 模型 [[30]](#chapter7.xhtml#ref7_30)构建，仿真环境为\
  \ VizViewer 自动驾驶车辆模拟器 [[31]](#chapter7.xhtml#ref7_31)。图 7.6 描绘了仿真研究中产生的学习环境，而图 7.7\
  \ 描绘了方向和运动的图表；此外，还可以看到路径规划。在图 7.2 中，可以看到连接自动驾驶车辆和其他联网车辆的云交通管理模拟器。\n\n此外，还使用了 Udacity\
  \ [[32]](#chapter7.xhtml#ref7_32)自动驾驶汽车模拟器，其中收集了约 16,000 张照片，每张照片均标注了道路类型和驾驶员行为，如行驶在车道内或转弯。图片尺寸为`320\
  \ × 160 pixels`，仿真采样率为`10 frames per second`。为了使学习过程尽可能简单，捕获的图像将通过删除天空和图片中其他多余成分进行归一化。为提高分类结果的质量，采集数据图片的部分预处理包括旋转、水平翻转、垂直翻转和\
  \ RGB 到 YUV 的转换。训练方法对前三个卷积层使用`5 × 5 kernel`，对后三个卷积层使用`3 × 3 kernel`，最多`20 epochs`，每轮`2,000\
  \ samples`。经过两三圈训练后，模拟器切换到自主模式，汽车独立运行并根据 CNN 模型预测每一种路况。仿真在配备`M1 Max CPU`、`M1 Max\
  \ GPU`和`16 GB RAM`的笔记本电脑上运行。学习过程大约需要一小时完成。\n\n![图 7.7 仿真图表。](img/fig7_7.jpg)\n\n\
  图 7.7 仿真图表。\n\n### 7.7 结论\n\n在利用 Udacity 自动驾驶车辆模拟器的仿真环境中，采用 CNN 深度学习的建议自动驾驶汽车方法能平稳运行，无错误，且极其稳定，无振荡。CNN\
  \ 可利用三个摄像头（左、中、右）学习路况，并创建仅使用中央摄像头进行自主驾驶的模型。\n\nSLA 模型提供了多种解决方案，旨在使驾驶在真实场景中更安全、更胜任。汽车将感知周边环境并通过其系统学习，根据其经验和学习模型采取行动。通过深度学习，算法汽车将从传感器数据中学习并根据经验采取行动。由于系统与实时云同步，车辆可获取其他车辆的统计数据，如速度和航向。由于这些服务在输出前会考虑特定区域内所有车辆的数据，交通灯管理和最优路径查找算法等重要系统不会因任何单一车辆的数据不一致而受阻。在建议的系统中，硬件-软件交互的设计方式将产比传统自动驾驶汽车更好的视觉感知。该硬件系统将安装在车辆上，因此处理和决策时间将非常短。交通系统非常系统化，可用作拥挤城市交通拥堵的解决方案。下一个实验将在仿真环境中加入障碍物，以及带有额外噪声和数据图片集失真的雨天模拟，以提高性能。\n\
