  \ 2017, 10(5), 278–286.\n\n\n\n\n\n## 4 重塑智慧城市可持续最先进发展\n\n**Tarana Afrin Chandel**\n\
  \nDOI: [10.1201/9781003353034-4](https://doi.org/10.1201/9781003353034-4)\n\n###\
  \ 4.1 简介\n\n二战期间及战后，美国科学研究与发展办公室主任万尼瓦尔·布什博士正在履行其职责。他观察到，美国的工业城市在基础设施和人口方面面临着支撑 19\
  \ 世纪和 20 世纪经济的问题 [[1]](#chapter4.xhtml#ref4_1)。城市问题得到了记录 [[2]](#chapter4.xhtml#ref4_2)–[[4]](#chapter4.xhtml#ref4_4)\
  \ 并被严肃对待。解决这些问题耗时数十年。建立金融变革的新框架，以及科学技术的创新，从重建开发到投入使用花费了数十年 [[5]](#chapter4.xhtml#ref4_5)，[[6]](#chapter4.xhtml#ref4_6)。一种复合（建筑、金融）结构连同科学技术的新创新塑造了智慧增长的概念模型\
  \ [[7]](#chapter4.xhtml#ref4_7)，并引爆了向智慧城市转型的浪潮 [[8]](#chapter4.xhtml#ref4_8)。20\
  \ 世纪人口也迅速增长。19 世纪时为 15 亿的人口，到 2010 年已达到 70 亿 [[9]](#chapter4.xhtml#ref4_9)。对美好生活的向往和向城市文明迈进的努力，为全球特大城市的出现铺平了道路。智慧城市作为一种新理念出现，旨在克服人口增长、快速发展、就业和提升生活方式等方面的问题。所有这些飞速取得的成就促使人们向城市迁移。在广泛范围内，智慧城市刺激了可持续的金融发展。不同文化背景下的人们对“智慧城市”的概念理解各异。“智慧城市”的基本概念是指利用数字化和基于\
  \ ICT 的技术，提升城市服务的效率和性能，并在城市中开发新的金融机遇 [[10]](#chapter4.xhtml#ref4_10)。随着智慧城市的增强，世界各地采取了相关举措，综合考虑智慧城市在人、地、环境之间的成本与收益。根据经济合作与发展组织（OECD）的定义，智慧城市是指旨在实现有效数字化以提升人民生活方式、提供可持续服务的倡议或进步，并建立多利益相关方流程框架，保障环境安全\
  \ [[10]](#chapter4.xhtml#ref4_10)。从商业角度来看，智慧城市是互操作系统，具有 59%的可持续性，特别是在考虑水和能源时 [[11]](#chapter4.xhtml#ref4_11)，需要\
  \ 57%的城市间连接、46%的可持续交通、43%的公私合作 [[11]](#chapter4.xhtml#ref4_11)。在这方面，进行了原型规划，转向多层塔楼，引领了\
  \ 19 世纪末占主导地位的欧洲战后建筑 [[12]](#chapter4.xhtml#ref4_12)。在其建筑中实施这种原型规划，结合软件应用、基于传感器的嵌入式系统（拥有数字化知识和信息），以及改善后清洁绿色的环境周边，是解决城市地区可持续发展制约因素所必需的\
  \ [[13]](#chapter4.xhtml#ref4_13)。\n\n#### 4.1.1 智慧城市模型概念\n\n\n\n\n\n##### 智慧城市与可持续性\n\
  \n“智慧”一词指的是具有吸引力功能的产品的日常使用，例如用于娱乐的智能电视（LED、Android）、用于交通的智能汽车（电动汽车、混合动力汽车）以及用于连接世界的智能手机。在\
  \ 19 世纪末，“智慧城市”一词变得显著，并广泛传播至城市规划领域[14]。“智慧城市”一词通常指创新型现代城市，通过整合经济、流动性、环境、人、生活和治理等各种发展参数，在“竞争力”和“可持续性”方面高效，实现自我维持[14]。20\
  \ 世纪初，2030 年议程应运而生。2030 年议程为下一代的美好未来展示了清晰的发展蓝图。智慧城市在实现可持续发展目标（SDGs）的标准方面发挥了至关重要的作用[15]。作者\
  \ Tarana A. Chandel 将可持续发展定义为 3P，即 People（人）、Profit（利润）和 Planet（星球）[16]。People、Profit\
  \ 和 Planet 分别指代社会、经济和环境[16]。联合国欧洲经济委员会（UNECE）支持在交通、生态系统、金融、可再生能源、商业、农林业、住宅和社区等领域以务实、结果导向的方式实施\
  \ 2030 年议程[17]。这一多学科框架旨在整合可持续发展的 17 项目标，并采用创新的运作方式打破界限。它大致分为以下四大类。\n\n1.  可再生资源的可持续利用\n\
  2.  面向所有生命群体的可持续智慧城市\n3.  可持续交通、智慧融合与全球互联\n4.  关于 SDGs 的智慧观测与评估进展\n\n#### 4.1.2\
  \ 可持续性：智慧城市的战略规划\n\n智慧城市的发展需要多元化的政策制定者和利益相关者的参与，以及巨大的资源投入。该规划对于有效发展至关重要。战略规划旨在分析一个将社区凝聚在一个平台上的长远愿景[18]，并阐述公民福祉和经济发展的价值[18]，重点强调跨各个领域的平等、团结与互动[19]。智慧城市发展的战略规划是从多个视角出发制定的。该战略规划分为三个部分，即：智慧创新技术的采用、政策框架与实施、以及智慧城市治理。信息与通信技术（ICT）的部署对于发展和改善城市地区的服务与基础设施至关重要[20,\
  \ 21]。这一技术网络改善了基础设施，并提升了社区的行政和通信服务。行政和通信服务基于物联网（IoT）运行，即基于传感器的网络、通过视频和互联网进行数据收集，以及来自大型未定义人群网络的数据，即社区服务反馈、在线投诉、向手机发送信息的紧急警报系统、智能计量系统等。技术创新涉及工程、信息技术、数据科学。这些领域在基于应用的智慧城市的研发中发挥着关键作用。\n\
  \n#### 4.1.3 基于技术的智慧城市\n\n全球互联网用户在过去几十年中大幅增加，如图 4.1 所示。互联网技术结合其他通信网络策略，使物联网成为发展智慧城市的最佳平台。“物联网”术语描述了一种技术交叉点，它允许通过有线或无线互联网网络访问由其他设备生成和提供的数据[22]。\n\
  \n![FIGURE 4.1 World wise internet user since 2005.](img/fig4_1.jpg)\n\n图 4.1 2005\
  \ 年以来的全球互联网用户。\n\n##### 4.1.3.1 物联网\n\n智慧城市的主要框架基于物联网。有人将智慧城市框架表述为三模型、四模型和五模型。Balakrishna\
  \ 于 2012 年提出的三模型包括收集、共享和执行计划[23]。一些作者也将其简述为三模型，即感知层、网络层和应用层[23, 24]。四模型涉及感知模型、传输模型、处理模型和应用模型[25]。一些作者使用不同的命名法定义相同的事物。他们将上述四模型定义为数据获取模型、数据活化模型、公共数据与服务模型以及应用模型[26]。进一步的研究建议采用五模型结构，即感知层、网络层、服务层、效用层和交易层[24]。\n\
  \n图 4.2 显示了 2015 年至 2021 年智慧城市中物联网和 AI 效用的增长[27]。如果城市满足 SDGs 的标准，则被认定为智慧城市。一些目标勾勒了智慧城市的轮廓。\n\
  \n![FIGURE 4.2 Smart City and AI increasing from 2014 till 2021 [27].](images/fig4_2.jpg)\n\
  \n图 4.2 2014 年至 2021 年智慧城市与 AI 的增长[27]。\n\n这些包括智慧生活方式、智慧学习、智慧就业、智慧健身、智慧交通、智慧生态、智慧金融和智慧治理，如图\
  \ 4.3 所示。在主要国家，智慧城市模型基于 AI 的应用。2018 年纽约智慧学校委员会报告的统计数据显示，到 2025 年底，AI 公司的规模将达到 1900\
  \ 亿美元[27]。全球在启动和运行人工智能（AI）系统上的投资花费 576 亿美元，其中 75%用于计算应用部署[27]。中国在全球智慧城市发展中处于领先地位。该城市拥有配备计量装置、闭路电视和用于监控、数据挖掘的嵌入式系统的公共场所，所有分析均基于\
  \ AI 进行[28, 29]。中国在全球拥有约 800 个小规模活跃规划的智慧城市项目。中国的 AI 自 2015 年以来运行顺利，政府已采取措施推进 AI\
  \ 研究，并将 AI 转型为中国的新时代[30]。AI 通过融合机器学习（ML）、机器人技术和许多其他技术，提升社区民众的生计，从而可能升级智慧城市的未来。AI\
  \ 算法的成功运行依赖于大数据来执行有用的任务。信息通过机械和数字技术获取，这些技术有助于存储数据、处理数据并传输数据，以给问题提供满意的解决方案。表 4.1\
  \ 显示了 AI 在智慧城市 SDG 各个领域的参与情况[31, 32]。\n\n![FIGURE 4.3 Sustainable development goals\
  \ for smart City [27].](images/fig4_3.jpg)\n\n图 4.3 智慧城市的可持续发展目标[27]。\n\n\n\n\n\n\
  ###### 表 4.1 智慧城市可持续发展目标各领域的 AI 参与情况 [[31]](#chapter4.xhtml#ref4_31), [[32]](#chapter4.xhtml#ref4_32)\n\
  \n| 智慧城市可持续发展目标领域 | AI 参与情况 |\n| --- | --- |\n| 智慧交通 | 智能交通管理系统、智慧停车、可持续交通 |\n|\
  \ 智慧学习 | 智慧教室、学习工具、智慧图书馆、学生跟踪管理系统 |\n| 智慧健康 | 智慧医院、智慧医疗、电子健康档案、患者监测 |\n| 智慧生态 |\
  \ 清洁绿色能源、智慧农业、天气与空气质量监测、清洁水源与卫生、废物管理系统 |\n| 智慧生活 | 智慧住宅与商业、建筑、智慧学习、智慧防护 |\n| 智慧金融\
  \ | 电子商务、智慧零售购物、智慧供应链分销、智慧商业服务 |\n| 智慧治理 | 电子政务、政策框架与决策制定、灾害管理系统、城市规划 |\n\n2017\
  \ 年，智慧城市开发中使用了约 16 亿个物联网组件及其他设备，较 2015 年增长 39% [[32]](#chapter4.xhtml#ref4_32)。2018\
  \ 年，使用的物联网工具和组件约达 33 亿，扩张率为 43% [[33]](#chapter4.xhtml#ref4_33), [[18]](#chapter4.xhtml#ref4_18)。\n\
  \n##### 4.1.3.2 人工智能\n\nAI 由计算机科学家 John McCarthy 于 1979 年提出 [[34]](#chapter4.xhtml#ref4_34)。他将\
  \ AI 定义为用于设计智能机器的科学与工程的结合 [[35]](#chapter4.xhtml#ref4_35)。也可定义为在机器中模拟人类智能，使其按人类行为方式处理工作。Brynjolfsson\
  \ 和 McAfee 在其著作《与机器赛跑》（Brynjolfsson & Andrew, 2012）中对此进行了论述。AI 的特征包括机器学习（ML）、自然深度学习（DL）、视觉、语音、机器人技术和专家系统。这些特征被用于智慧城市的开发。智慧城市的运行必须拥有来自物联网传感器的大数据。大数据包含\
  \ 3V 特性，即容量、速度和多样性 [[36]](#chapter4.xhtml#ref4_36)。容量指海量数据，速度指算法处理数据的速率，多样性指从不同来源收集的数据。AI\
  \ 与大数据紧密相连。AI 可对来自不同来源的大数据进行非人类系统实验并模仿人类行为 [[37]](#chapter4.xhtml#ref4_37)。AI 能够分析数据、预测数据，并为智慧城市开发中使用的技术生成解决方案。在有监督机器学习中，收集的数据被用于训练\
  \ AI 以寻找原始数据的解决方案。AI 将根据其内部软件程序执行任务。另一方面，在无监督机器学习中，未分类或未标记的数据被发送给 AI 以发现数据中的隐藏特征\
  \ [[38]](#chapter4.xhtml#ref4_38)。\n\n#### 4.1.4 智慧城市的可持续交通\n\n针对城市地区的流动性需求，交通对城市而言极具挑战。根据联合国环境规划署（UNEP）数据，交通在全球范围内占碳排放的主要比例\
  \ [[39]](#chapter4.xhtml#ref4_39)，导致拥堵、污染和生活水平下降 [[39]](#chapter4.xhtml#ref4_39)。可持续交通作为智慧城市发展的基础装备，由来已久\
  \ [[40]](#chapter4.xhtml#ref4_40)。Köhler [[41]](#chapter4.xhtml#ref4_41) 将可持续交通视为一个全球性概念。可靠交通的整合对于智慧城市的可持续发展至关重要。在这方面，基础设施、人力与社会资本之间的连接对于社区的美好生计必不可少。因此，可持续交通是发展智慧城市的驱动力。它通向劳动力资源，造福个人和全球。此外，交通将更好的生活方式与社区、场所、教育、就业和健康联系起来\
  \ [[42]](#chapter4.xhtml#ref4_42)–[[44]](#chapter4.xhtml#ref4_44)。由此可知，交通推动社会和商业发展。使用不可再生能源的交通影响环境，造成生态系统污染。为克服这些影响，需要可持续交通。因此，图中所示的可持续交通是一种全球可持续性，它在不损害后代利益的前提下满足当代需求。\n\
  \n首届全球可持续交通大会于 2016 年 11 月 26 日召开 [[45]](#chapter4.xhtml#ref4_45)。会议在土库曼斯坦举行。会议汇集了来自政府和私营部门、公民社会、联合国及其他组织的所有利益相关者，构建了一个统一的全球平台。会议为期两天，讨论了交通的多重任务及其综合和横向性质。此次会议支持了在巴黎举行的\
  \ 2030 年可持续发展议程 [[45]](#chapter4.xhtml#ref4_45)。这种交通能在遥远的人们之间架起桥梁，让他们在同一框架下走得更近。可持续交通能为增长、就业、妇女赋权、减少贫困和死亡率以及改善经济发展打开大门。可持续交通是智慧城市的门户，强调安全健康的生态系统，解决诸多问题，并整合与可持续发展目标（SDGs）相关的政策制定者和利益相关者。智慧城市通常利用\
  \ ICT 预测和引导城市问题。智能技术可改善可持续交通。最新的流行技术如物联网（IoT）、人工智能（AI）和云计算（CC）[[46]](#chapter4.xhtml#ref4_46)（可存储大量数据）为可持续交通带来了新曙光，助力智慧城市建设。应对气候变化、改善生态系统、将燃油车转向可再生能源交通、使用公共交通而非私人交通，都需要大数据服务。这些大数据对公共交通运营商构成挑战。大数据的目的是帮助工业界和学术界识别问题，并为可持续城市交通服务设计模型。在当前形势下，可持续交通依赖于可持续发展目标（SDGs）。交通创造了就业，成为技术应用和管理的门户，推进环境安全和健康生态系统，改善流动性并连接人群。后者促进了旅游业，改善了全球关系和经济。这些目标有助于实现平等、人与人之间的尊重、跨国互利以及国家间利益的均衡。\n\
  \n由于并非所有国家都有能力投资可持续交通并实现可持续发展目标，部长级官员、高级官员、专家和代表等发言者就加强全球伙伴关系、寻找解决方案以满足《巴黎协定》关于气候可持续性的要求进行了辩论\
  \ [[45]](#chapter4.xhtml#ref4_45)。\n\n#### 4.1.5 可持续智慧学习\n\n\n\n\n\n今天，有必要将教育理解为一个整体组成部分，学生可通过它获得技术技能、能力、熟练度和视角，从而引向一个积极且强有力的社会边缘化进程。智慧教育是《2030\
  \ 年可持续发展议程》中的第四项目标[47]，旨在通过教学过程改善人类生活方式[48]，解决国家的主要问题[48]。这一目标反过来有助于教导民众如何在社会中生活[49]，并使国家经济跻身全球前列。教育还能促进个人和职业发展。为实现这些目标，我们需要政府、私营机构、组织和企业家抓住机遇、承担责任，推行并传播可持续发展素养[50,\
  \ 51]。考虑到代表文化遗产的高等教育，在将可持续性融入课程设计时负有重大责任。此类框架对社会、环境和经济发展有着巨大影响[52–54]。与此同时，教育向可持续性的转变正在增加科学[55]、技术和管理领域的研究。二十五年前，Segovia\
  \ 提出了一种称为“智能教室”的教学模式[56]。智能教室基于教学过程的八个重要参数。它们如下：目标或动机、方法论、序列、导师角色、学者角色、评估、情境和智慧学习环境。在最后一个参数，即情境中，我们观察到一种新教学环境（NTLE）过程。\n\
  \n##### 4.1.5.1 教学环境\n\nNTLE 过程是指对环境、设备能力和文化的维护。对于可持续学习，需要在特定水平上保障系统，而不耗尽资源，并防止因害怕系统故障而退缩。可持续教育也被称为可靠且持续运行的技术工作系统。\n\
  \n问题在于，什么额外特性构成了新学习教学（NELT）环境。就这个问题而言，并没有设定特定的基准。对于基础小学，我们可以利用计算机、多媒体屏幕、投影仪和免费互联网设施，借助\
  \ `IoT` [57] 实现教育变革。\n\n根据美国国家家庭教育研究所的记录，超过 160 万儿童正在接受家庭学校教育[57]。基于 `IoT` 的教育系统正在将教育转变为一种新的学习教学环境。学校的智慧教室包括白板、互动学习游戏、摄像头和基于技术的评估等先进技术设备，以及用于可持续教育系统的反馈选项[57]。因此，换句话说，我们可以认为，拥有基于\
  \ `ICT` 的教育基础设施、物理和虚拟学习教室、自主学习管理系统（`SLMS`）和可持续资源管理系统（`SRMS`）的学校或大学，被视为智慧学校/智慧大学[58,\
  \ 59]。智慧教学环境（`STLE`）是采用学习内容、推荐学习工具或策略、通过泛在计算设备与用户交互以及检测真实世界内容的交集，如图 4.4 所示[59]。\n\
  \n![图 4.4 绿色智慧教学环境 [59]。](images/fig4_4.jpg)\n\n图 4.4 绿色智慧教学环境 [59]。\n\n由 `ICT`\
  \ 实施的智慧教学（面向教师）和智慧学习环境（面向学生），结合 `IoT` 和 `AI` 等创新技术，有助于我们实现优质教育，从而落实 SDG-4（即 2030\
  \ 年议程的一部分，即关于可持续发展目标的巴黎协定）。该 2030 年议程包含 17 个可持续发展目标[58, 60, 61]。以提供优质教育（目标 4）、性别平等（目标\
  \ 5）、清洁饮水和卫生设施（目标 6）、减少不平等（目标 10）和可持续社会（目标 11）为目标的智慧学习教学概念，可在广泛领域得以实现。\n\n#####\
  \ 4.1.5.2 智慧教育所用技术\n\n技术在教育领域的应用正在全球变得普遍。`IoT`、`AI`、`ML` 和 `DL` 是教育领域常用的不同技术。这些技术的应用正在构建智慧教育系统。\n\
  \n###### 4.1.5.2.1 面向可持续智慧教育的 IoT\n\n`IoT` 设备是无线连接到网络的计算设备，以数据形式收集信息并将其传输给其他设备。`IoT`\
  \ 由软件和硬件组成。`IoT` 电路基于作为硬件设备的传感器，并通过软件技术在线双向传输信息数据。`IoT` 使学生和教育工作者均受益。`IoT` 对教育工作者和学生的主要好处是“可以超越传统教室，走向智慧教室环境”。学生可以通过视频、网络研讨会、讨论论坛、小组讨论进行学习。`IoT`\
  \ 帮助教育工作者跟进学生数字计划本上更新的作业。它还能通过使用实时摄像头定位学生位置并控制其动员，营造安全环境，加强校园安保。`IoT` 还帮助监护人实时追踪孩子的出勤记录。无线通信技术（`WCT`）和\
  \ `AI` 是 `IoT` 的关键赋能技术。基于 `IoT` 的学生管理系统可结合蓝牙技术和基于 IP 的闭路电视（`CCTV`）实现。可通过生物识别技术（即指纹和人脸识别）监控学生/教师的进出，以识别其身份。如今，学习可在实体模式、在线模式甚至混合模式下进行。教室可以是真实的，也可以是虚拟的。移动学习、电子学习、在线学习和远程学习是不同的教学法，但它们拥有让学习变得更轻松的共同理念。\n\
  \n###### 4.1.5.2.2 面向可持续智慧教育的机器学习（ML）\n\n`ML` 是一种用于数据分析的技术。一位名为 GovHack 的澳大利亚人在教育领域包含了许多项目，其中之一是\
  \ `ML` [62]。教育工作者和决策者均可利用它来识别学生辍学的风险。利用数学模型，`AI` 可基于先前的输入轻松预测结果。借助算法，`ML` 允许系统在无需编程的情况下发现隐藏洞见[62,\
  \ 63]。学习过程始于待观察的数据，并得出更好的决策或结果。`ML` 的过程是使用算法，接收数据或信息，对其进行分析，最后在适当范围内给出输出。`ML` 如何寻找解决方案并给出结果的工作过程如图\
  \ 4.5 所示[63]。\n\n![图 4.5 机器学习过程 [63]。](images/fig4_5.jpg)\n\n图 4.5 机器学习过程 [63]。\n\
  \n\n\n\n\n####### 机器学习分类\n\n机器学习分为监督式机器学习、无监督式机器学习和强化机器学习，如图 4.5 所示 [64]。\n\n在监督式机器学习中，利用已知的输入和输出数据进行未来预测。监督式机器学习的结果不是连续的，图形上表现为非线性。无监督式机器学习探索数据是否带标签或无标签的信息。在强化机器学习中，发生环境内信息的交互，最终给出结果。强化机器学习用于机器人、游戏以及确定船只位置，即导航\
  \ [64]。机器学习是人工智能（AI）的一个子集 [64]。机器学习是 AI 的一个子领域，如图 4.6 所示。\n\n![图 4.6 机器学习类型 [64]。](images/fig4_6.jpg)\n\
  \n图 4.6 机器学习类型 [64]。\n\n#### 4.1.5.3 COVID-19 对教育的影响\n\n冠状病毒疾病于 2019 年 12 月在中国起源\
  \ [65]。病毒的首例病例发现于中国城市武汉。此后，病毒蔓延至全中国。它不分肤色、种族和性别地影响人们 [65]。2020 年 3 月 12 日是世界卫生组织（WHO）宣布冠状病毒疾病为\
  \ COVID-19 的日子 [66]。WHO 还于 2020 年 3 月 30 日宣布国际关注的突发公共卫生事件（PHEIC） [66]。在此之前，疾病已作为当前疫情在全球蔓延。为保持社交距离并减缓疾病传播，政府宣布关闭公立和私立的学校、学院和大学。儿童间的疾病传播率高于成人，因此教育机构在全球范围内作为预防措施而关闭。传统教学法/线下教学模式，即面对面互动教学转向了在线教学。政府以及私立教育机构均采用电子学习。一些电子学习平台包括\
  \ Google Classroom、Zoom、WebEx 和 Skype。在线学习将帮助教师和学生。数字系统的演进对社会和经济发展有重大影响。随着创新技术和数字设备的增强，COVID-19\
  \ 期间的传统教育体系已转变为数字化教育体系。由于互联网不可用、缺乏设备（即手机和笔记本电脑）以及家庭环境等原因，在线学习造成了阻碍。这影响了学习质量、学生的理解力和能力以及教师的表现。COVID-19\
  \ 对教育有一些积极和消极的影响。其中一些列举如下 [67]。\n\n##### 4.1.5.3.1 COVID-19 对教育的积极影响 [67]\n\n1.\
  \ 学习变得个性化且高效\n2. 从未来角度提升了教育质量\n3. 优于传统学习\n4. 节省时间和金钱\n5. 学习无地理物理限制\n6. 免通勤教育\n7.\
  \ 学习管理系统在教育机构中的应用得到增强\n8. 小组辩论和团队合作取得进步\n9. 对 MOOC 和远程学习的需求增加\n\n##### 4.1.5.3.2\
  \ COVID-19 对教育的消极影响 [67]\n\n1. 阻碍了教育活动\n2. 农村地区缺乏电力供应\n3. 家中缺乏学习环境\n4. 家长缺乏知识和技术应用能力\n\
  5. 家长在教育子女方面的责任增加\n6. 教师/学生对在线教育准备不足\n7. 学生注意力被手机娱乐和社交网络分散\n8. 无书面作业布置\n9. 因学校关闭导致营养缺乏\n\
  10. 学生有效评估困难\n11. 学费支付延迟\n12. 面向数字化世界的可及性\n13. 衰退对就业率的影响\n14. 全球就业机会下降\n\n#### 4.1.6\
  \ 智能健身\n\n常规体育活动已显示出对非传染性疾病（如心脏病、低血糖和胸部癌症）的预防治疗作用。它还能防止体重过度增加，并增强心理水平和健康。除了体育活动对健康的益处外，社会在投资回报率（ROI）方面更为活跃，涉及常规能源利用的减少、新鲜空气和道路安全。上述投资回报率的结果相互关联，共同实现\
  \ 2030 年议程的可持续发展目标（SDGs）。WHO 行动计划在全球范围内推广体育训练 [68]，并要求各国更新高效且可行的政策新框架以加强体育训练。关于提升步行、跑步、骑行、游戏和体育运动的政策在实现\
  \ 2030 年议程的可持续发展目标中发挥重要作用。体育训练政策框架在社会、文化和经济发展方面具有诸多益处，有助于实现许多可持续发展目标，如 SDG 3（良好健康与福祉），以及其他目标，包括\
  \ SDG 2（消除一切形式的营养不良）；SDG 4（优质教育）；SDG 5（性别平等）；SDG 8（体面工作和经济增长）；SDG 9（工业、创新和基础设施）；SDG\
  \ 10（减少不平等）；SDG 11（可持续城市和社区）；SDG 12（负责任消费和生产）；SDG 13（气候行动）；SDG 15（陆地生物）；SDG 16（和平、正义与强大机构）和\
  \ SDG 17（伙伴关系） [68]。\n\n医疗部门对 ICT 的采纳推动了电子健康（e-health）的理念，从而实现成本节约和效率提升。电子健康设备是智能手机，它们为移动健康打开了大门。连接物联网的健康设备在全球范围内增强了监测设施的优势\
  \ [69]。地方政府投入财政收入建立基于 ICT 的技术基础设施，以在可持续环境中提升关于健康和护理的智能化和社会责任。因此，智慧城市的可能性无穷无尽，IBM、Intel\
  \ 等许多公司正在该领域采取领先举措。这些公司发现了智慧城市在社区安全、绿色能源、教育、社会福利、商业发展和医疗保健方面发挥关键作用的领域 [70]。基于 ICT\
  \ 技术的智慧城市提供关于天气状况、交通拥堵、环境污染、抗原浓度等的实时信息。通过妥善利用医疗保健信息，社区民众可知情地使用医疗保健应用和设施。本研究旨在产生智能健身的理念，作为健康与智慧城市互动的结果。基于\
  \ ICT 的技术已获得医学科学的青睐。\n\n##### 4.1.6.1 电子医疗保健\n\n由于基于物联网的传感器设备和计算机，致力于帮助和支持开放生物医学问题。此类设备即电子健康（e-health）\
  \ [71]。Gunther Eysenbach 于 2001 年对电子健康的定义如下：\n\n\n\n\n\n> 电子健康是医学信息学、公共卫生和商业交叉领域的一个新兴领域，指通过互联网和相关技术提供或增强的健康服务和信息。从更广泛的意义上说，该术语不仅描述了一种技术发展，还代表一种心态、一种思维方式、一种态度，以及对网络化、全球化思维的承诺，旨在通过利用信息和通信技术，在本地、区域和全球范围内改善医疗保健。\n\
  \n电子健康不仅代表电子化健康，而且许多“e”共同勾勒出电子健康的内涵。文献[71]中提到了电子健康中的一些“e”：易于应用、高效、质量改进增强、患者赋权、循证、教育与鼓励、赋能、平等和伦理。\n\
  \n1.  **易于应用**：免除医疗费用。免费医疗政策旨在降低获取医疗服务时的经济障碍。免费医保政策在过去几十年中广受关注。每个人都可以申请免费医疗保健。从经济福利和服务角度来看，医保政策相结合。\n\
  \n2.  **高效**：效率是电子健康的一个重要参数。通过降低医疗成本、减少无用诊断，以及医疗中心与患者之间的定期沟通，可以实现高效率。\n\n3.  **质量改进增强**：随着医疗费用的降低和医疗政策的实用性提高，社区居民医疗服务的质量得到了增强。\n\
  \n4.  **患者赋权**：患者赋权是指患者在做出与健康相关的决策和行动时获得更好控制权的过程。患者赋权的四个基本要素包括：理解患者的角色、患者对知识的认知、医保服务提供者的参与、患者获取利益的能力，以及执行任务的包容环境。\n\
  \n5.  **教育与鼓励**：医生和外科医生应具备透彻的医学学科知识，并懂得如何与患者保持良好关系。牢固的纽带将鼓励患者分享他们的个人、健康及财务问题。\n\n\
  实现医患双向沟通，并在患者与医疗提供者之间高质量地传递信息。\n\n**平等**应在富裕和贫困患者之间得到维护。在对待患者时不应存在任何性别偏见。\n\n在为在线、知情且注重隐私的患者提供服务时，应遵守**伦理**规范。\n\
  \n#### 4.1.7 智慧生态系统\n\n智慧城市的主要关注点基于城市的环境影响。当然，重要问题与绿色清洁能源的利用有关。因此，节约能源或寻找替代能源对于交通系统至关重要。因此，能源管理是投资回报的最佳方式之一。智慧城市中智慧生态系统的另一种方法是物联网。它基于大量信息数据的感知。其中一些传感器包括环境污染传感器、交通拥堵传感器、音频传感器、湿度和天气预报传感器，以及分布在全城的视频捕捉摄像头。这些传感器将提供包含城市问题的信息。然而，这些问题通过一个令人印象深刻的管理系统得以解决，而该系统本身也面临挑战。因此，以开发技术基础设施为代价来解决关键问题。智慧城市中智慧生态系统的另一个重要方法是社区居民参与解决城市日常问题的能力。社区居民参与数字化机制、感知实时活动和联合基金管理是一些为实现更好的城市管理而部署的潜力。现在我们可以说，城市是面向社会社区居民以及政府和私营公司及组织的数据控制型服务提供者，文献[71]中展示了智慧城市的数据驱动型智慧生态系统，如图\
  \ 4.7 所示。\n\n![图 4.7 数据驱动型智慧生态系统 [71]。](images/fig4_7.jpg)\n\n图 4.7 数据驱动型智慧生态系统\
  \ [71]。\n\n这些服务可以在分包商的帮助下提供，或由组织以生态系统为基础，借助数字增值服务来提供。这种增值数字系统由生态系统管理公司添加，以实现不同任务，提供新的处理信息。这就是生态系统管理公司向社区提供服务的方式。社区居民（也可称为消费者）也会请求管理公司增加新的显著功能，使智慧城市的服务更加便捷。这些服务通过考虑一些标准进行分析。智慧城市的一个\
  \ ISO 标准是 37120:2014 [72]，由世界城市数据委员会[71]认可，包含考虑智慧城市的参数。由于物联网传感器产生大数据，生态系统管理员进一步重用这些数据以提供更先进的服务。为新的技术服务寻找新的商业模式。一些商业模式对其服务收费。公共信息的重用对我们社会的经济有重大影响。在满足某些市场条件的同时，GDP\
  \ 从 0.25% 增加到了 1.7% [73, 74]。毫无疑问，一些重要技术将被应用于智慧城市，以构建更好的生态系统。\n\n因此，我们可以根据知识和智慧生态系统的设计、旨在轻松实施日常活动的规划，以及在社会或社区居民的帮助和努力以及股东投资下共享最新数据以进行进一步创新，对智慧城市进行分类。影响可持续友好型生态系统的因素包括空气质量、环境污染和改进的卫生系统。健康的生态系统由空气质量指数（AQI）来衡量。AQI\
  \ 低于 50 以绿色表示；表明空气质量优，对所有人无风险 [75]。AQI 在 51 至 100 之间以黄色表示；表明空气质量中等，对敏感人群有风险 [75]。AQI\
  \ 在 101 至 150 之间以橙色表示；表明对敏感人群健康有影响，对普通公众影响较小 [75]。AQI 在 151 至 200 之间以红色表示；表明空气质量差，可能导致严重健康问题\
  \ [75]。AQI 在 201 至 300 之间以紫色表示；表明空气质量很差，发出健康警报 [75]。AQI 大于 300 以栗色表示；表明空气质量危险，对所有人发出健康警报\
  \ [75]。\n\n#### 4.1.8 智慧生活方式\n\n如今，随着 ICT 的进步，智慧城市已成为全球趋势。许多国家已通过智慧城市发展提案，但对人类快乐生活的考虑最少。快乐驱动型智慧城市（JDSC）比发展以人为中心的智慧城市要好得多\
  \ [76]。JDSC 需要研究多种策略。社会的优势和劣势应成为智慧城市的首要任务，如图 4.8 所示 [76]。\n\n![图 4.8 快乐驱动型智慧城市 [76]。](images/fig4_8.jpg)\n\
  \n图 4.8 快乐驱动型智慧城市 [76]。\n\n\n\n\n\n只有随着向社会和经济发展的转型，智慧城市的理念才是可接受的 [77–79]。采取建设智慧城市的主动举措，知识与景观定位是城市金融升级和保持竞争力复兴的首要任务。然而，可以看到，在建设一个快乐的智慧城市方面，对社区居民幸福的关注微乎其微。健康的行政管理和公平将鼓励正义的智慧，并希望为社区居民的幸福做出贡献\
  \ [80]。一次为社区居民幸福与福祉召开的会议获得了联合国高层的支持，该报告由 John Helliwell 于 2012 年发布 [81]。幸福或福祉基于情感、情绪以及对特定规范的生活评价。然而，人们在城市中实现可持续发展的基本需求，必须在城市的每一个角落都能得到满足。满足这些基本需求会增进全民的快乐。只要我们生活在一个不断创新的世界中，就会产生一个问题：先进的创新如何在社会中创造幸福？本章的目的是概述我们如何在这个科技世界中聚焦城市的行政活动。这些活动包括税务职能、交通部门、市政机构、执法部门等，均记录在经合组织美好生活指数（BLI）中\
  \ [82]。BLI 涉及收入与财富、家庭净金融财富、就业与收入、健康状况、工作与生活 [82]。全国范围内对 BLI 的另一种评估是社会进步指数（SPI），基于取决于人类需求的三个参数，即：居住的住房、改善健康与发展的更好营养、生存所需的水。人类福祉的基石是教育、健康、大气环境、通信和创新技术。对于职业的成长与进步，个人需要自由权、个人权利和融合。上述特征是人类幸福与福祉的关键来源。提供快乐生活方式的因素是教育、健康和安全\
  \ [76]。技术意识引导向高等教育，转变教育方式为学习，并协助实现目标 [83]。教育是通往幸福的途径，因为它创造就业并提升人们的经济地位 [84]。安全对快乐生活也很重要。在一个安全的氛围中，犯罪和安全威胁得到妥善处理，借助创新技术配合公共安全职能立即采取行动\
  \ [85]。安全本身就是城市的中心吸引力，也是在美丽智慧的城市中维持彼此快乐生活的关键 [86]。自由通向快乐生活。\n\n#### 4.1.9 智慧金融\n\
  \n智慧城市由其经济和建立业务的能力来定义。这是城市生存的基本原因，人们倾向于居住在城市，因为城市是商业和金融的聚合体 [87]。2007 年，经济学家宣布智人现在是“都市人”\
  \ [88]。图 4.9 显示了 1950 年至 2050 年全球农村和城市人口的变化 [89]。\n\n![FIGURE 4.9 Change in global\
  \ population in rural and urban from 1950 to 2050 (Source: United Nations) [89].](images/fig4_9.jpg)\n\
  \n图 4.9 1950 年至 2050 年全球农村和城市人口的变化（来源：联合国）[89]。\n\n2000 年，亚洲和非洲的城市化率分别为 37.5% 和\
  \ 34.5%。尽管非洲经济增长较低，但从 1950 年到 2000 年，其向城市化的人口增长却是九倍 [89]。过去 65 年的统计数据记录显示了世界主要地区的城市化情况，到\
  \ 2050 年将有更多地区转向城市化 [89]。按地区划分的向城市化转变百分比如图 4.10 所示 [90]。这是城市被视为金融增长引擎、吸引称职合格的专业人士以及国内外投资者、并在国家和国际层面促进金融增长的关键因素。\n\
  \n![FIGURE 4.10 Transformation toward urbanization region wise from 1950 to 2050\
  \ (Source: United Nations) [90].](images/fig4_10.jpg)\n\n图 4.10 1950 年至 2050 年按地区划分的向城市化转变（来源：联合国）[90]。\n\
  \n可持续城市化演进的金融布局直接与可持续发展问题相关，这些问题与 3P 相关，即：People（人）、Profit（利润）和 Planet（星球）[16]。People\
  \ 关联社会，Profit 关联金融，Planet 关联环境 [16]。\n\n金融支持对企业家和中小型工业企业至关重要。城市通过与政府频繁互动、减少业务发展中的阻碍来促进商业活动。城市的经济增长对民众福祉至关重要。为此，政府正在努力并将促进商业作为优先事项。许多城市提供在线/互联网商务，使其成为交易平台的中心。在线交易让生活更轻松，也改善了市民的经济状况，使生活更幸福。公众信任也是金融支持和公共卫生的重要参数。公众信任是赚钱和经济增长的最大证据，通向一个快乐健康的宜居之地\
  \ [81]。值得信任的氛围给市民带来欢乐和幸福。因此，我们可以自豪地说，值得信任且无腐败的城市是衡量国家质量和治理质量的标准。\n\n\n\n\n\n如今，全球正处于工业革命\
  \ 4.0 时代 [91]。这场工业革命 4.0 是面向工业应用与发展的最新范式。它基于自动化和集成数字技术，提供的信息量超越了物理系统 [92]。这场革命旨在增强互联网潜力，即物联网。物联网的互联设备提供系统自动化和海量信息，可实时访问\
  \ [93]，如图 4.10 所示。智慧城市的治理与城市发展直接相关，从而催生了工业革命 4.0。随着世界的快速发展，城市也在不断扩张，但由于各种问题，城市治理体系往往无法同步推进。其中一些问题包括人口稠密、建筑密集、交通拥堵、大气污染和环境恶化。城市治理的蜕变与智慧城市直接成正比，从而催生了新经济\
  \ [94]。创新技术在开发、监控和控制商业活动、交通及天气变化方面的效用日益增强 [91]。如今这个时代被称为数字经济时代。\n\n工业革命 4.0 也与互联网容量或物联网不断增长的趋势相关。根据其术语定义，物联网涵盖了可从一台设备连接到另一台设备的一切事物，设备间的连接将创造系统自动化、信息访问、实时数据分析以及响应行动\
  \ [93]。四大工业技术的融合已将传统产业转变为适应性强且重新设计的智慧产业 [95]。智慧产业意味着利用物联网 AI 和数据管理系统等创新技术进行智慧生产。智慧生产与数字化生产相关，其产出可被定义为数字经济。基于\
  \ ICT 的产业优化了制造流程，使生产成本极低，从而增强了市场竞争并推动了经济增长。因此，数字营销 (DM) 利用数字技术和互联网设施开展业务。DM 通过客户的实时数据和信息增加产品和服务的曝光度。它还为产品创造了销售渠道。产品信息（如成本和规格）获取更加容易快捷，从而提升了商业价值。所有这些仅凭借数字经济才成为可能。\n\
  \n#### 4.1.10 智慧治理\n\n智慧治理表现为对公共领域全貌及其职责的审视，旨在构建智慧城市。此外，它还探讨如何改变社会和政治治理结构，以数字化方式管理智慧城市。智慧治理是一枚硬币的两面，旨在建立良好的政府-公众关系，强化政府-私营机构合作，并将所有社会群体纳入同一框架之下\
  \ [96]。ICT 现已成为我们生活方式的重要组成部分。没有互联网设施和数字技术，生活难以想象。如今，交通、安全、医疗健康、学习和通信都依赖于 ICT。智慧治理的目标是建立透明的体系并增进社会福利。智慧治理的显著特征是\
  \ ICT 工具的应用、物联网、社交媒体互动与分析、私有云与公有云、教育、就业和娱乐。\n\n##### 4.1.10.1 信息与通信技术 (ICT) 的效用\n\
  \nICT 是智慧治理的基础。该技术增强了政府部门间、政府与私营部门以及政府与社会之间的协作水平，提供高效服务和可持续性。借助 ICT，可存储大量实时数据和信息，为问题提供彻底的解决方案。该技术还有助于在同一环境下孵化业务，增强国家经济。良好的电信渠道（如\
  \ FM 广播、移动电话和卫星通信）用于接收和传输信息。交通出行、视频和音频会议及安防系统需要地理信息系统 (GIS) [96]。\n\n##### 4.1.10.2\
  \ 物联网\n\n物联网基于连接互联网的传感器设备。基于物联网的感知设备用于监控军队、交通、国防无人机、温控系统等 [97]。正如 Bruce Sinclair\
  \ 所言：物联网仅是面向互联网发展的转型。拥有物联网技术的企业将引领经济进步。基于物联网的电子治理生态系统应保障所有决策者和利益相关者以及政府部门、私营部门、技术人员、学者和消费者的参与。\n\
  \n##### 4.1.10.3 政府云与私有云\n\n云计算 (CC) 模式的诞生在智慧城市中找到了丰富而光明的基础，用于存储大量数据和信息以提供服务 [98,\
  \ 99]。过去十年间，云计算备受关注，在受限资源和经济条件下访问大型复杂数据的场景中获益良多。云概念可通过水平和垂直集成，将物联网与互联网上的人们连接起来 [100]。将物联网与云计算相连可称为“物云”。物云是全球学者和产业的中心。它以少量投资提供服务，并具备预期进步、高可访问性、卓越的容错能力、无限的可扩展性等优势。\n\
  \n### 4.2 结论\n\n利用数字技术建设智慧城市造福全球人民。它不仅提升生活方式，还保障可持续性。基于 ICT 的技术为重大问题提供解决方案，节约时间、金钱和能源。它还有助于减少温室气体排放和控制交通系统。由于创新技术驱动的智慧城市市场对所有人而言都是新的，因此需要新的框架和决策者来构建新的商业模式，并找到实施可持续性的简便途径。\n\
