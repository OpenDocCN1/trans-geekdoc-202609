  \n## 9 基于区块链的安全电子投票系统，用于智慧治理\n\nRaja Muthalagu, Pranav M. Pawar, Ashish Kumar Jha,\
  \ Karan Sharma and Kavya Parthasarathy\n\nDOI: [10.1201/9781003353034-9](https://doi.org/10.1201/9781003353034-9)\n\
  \n### 9.1 简介\n\n\n\n\n#### 区块链电子投票\n\n民主的支柱之一是选举必须自由、公正地进行，因为这是公众无惧地表达意见的一种方式。在大多数民主国家，新一代选民对陈旧过时的流程表现出抵触情绪\
  \ [1]。为克服这一障碍，电子投票被推广为解决方案 [2, 3]。截至目前，全球知名组织已采用电子投票作为官方解决方案。爱沙尼亚于 2005 年使用电子投票，2009\
  \ 年将其用于全国大选，成为首个这样做的国家 [4, 5]，随后瑞士和挪威也跟进。瑞士用电子投票进行州选举 [6]，挪威同样用电子投票选举其委员会 [7]。然而，这些电子方法也有其弊端。爱沙尼亚和挪威的系统没有用于投票的开源代码，因此引发了对流程透明度的质疑。整个系统也容易遭受\
  \ DDOS 攻击，导致选民无法参与投票 [8]。由于选举在各国和社会中举足轻重，选举必须可靠、透明且免受外部篡改。电子投票措施已获得巨大动力，但必须遵守某些基线，包括不可抵赖性、完整性和选民匿名化，以使电子投票在全球范围内广泛使用\
  \ [9–11]。一种基于密码学提供基础、有助于解决安全问题的技术是区块链概念，由中本聪先生于 2008 年提出 [12, 13]。智能合约是区块链技术的一种变体，是增强选民信任、对抗爱沙尼亚选举弊端的一种方式\
  \ [14]。区块链，也称为分布式账本技术，主要可被视为一种去中心化且分布式的数据库，它维护一个不断增长的数据记录列表，并进一步保护数据免受未经授权人员的篡改和操纵。它可被视为一种带有创世区块的数据结构，能够共享和维护正在执行的不同交易。允许每个用户建立网络连接，使他们能够添加和验证新交易，从而创建区块。创建后，区块会在网络（点对点或\
  \ P2P 网络）中广播，所有节点随后验证发生的交易。一经验证，交易将与现有区块结合，为哈希/账本创建新区块，也称为区块的指纹。只要区块中的数据未被修改，该加密哈希即有效。如果区块中的数据发生任何更改，会导致哈希函数发生变化，从而发出指示该区块已被篡改的信号。因此，每添加一笔新交易，就会创建一个安全的区块。因此，基于区块链的电子投票为我们提供了多种优势，即：因公开分布式账本而带来的更高透明度、来自其他用户的匿名性、安全性、可靠性以及不可篡改性\
  \ [15]。\n\n#### 区块链的应用\n\n区块链的应用包括以太坊或比特币等加密货币，其中购买、花费或兑换加密货币的交易被捕获并记录在区块链中。区块链不仅用于加密货币，在银行处理美元、欧元等法定货币时也有应用，使资金转账更快。该技术还可用于记录和转移各类资产的所有权，以及智能合约（也称为自执行合约）的概念，即在满足特定条件时自动执行。区块链的进一步用途包括供应链监控，将货物质量等信息存储到区块链上，便于追踪和检查供应链。区块链的最后一个用途是我们将在本项目中探讨的，即投票系统。为防止投票舞弊，区块链被用于确保投给候选人的选票无法被篡改。\n\
  \n#### 投票系统中的问题\n\n投票系统和选举总体上存在显著问题，例如在计票和验票方面，这是一个由不同设备和阶段管理的过程。在不同国家，选票可以通过多种方式收集，包括纸质选票、举手表决、网络投票等类似方法，但发现利用区块链分发选举登记册是一种极受欢迎的方法。在传统情况下，选票由第三方/中央机构记录、验证、分离和计数，区块链使控制权去中心化，而用户承担待办任务。作为区块链的基本概念及其在区块链中的应用有助于消除选票篡改的可能性，它有助于维护选举的完整性。此外在组织中也常见，由于决策必须迅速做出，同时伴随着大量反馈和其他文件的积累，压力可能导致组织内部民主倒退、权力集中在少数人手中。在这种情况下，会使用密码学投票概念，有助于缓解不同组织的决策过程。此类投票可用于解决上述问题，适用于让所有必要利益相关者参与重要商业决策的不同情境。本章包含利用区块链技术创建电子投票门户/网站的建议方法，该门户将拥有易于理解的用户界面，允许选民在无太多麻烦的情况下完成投票流程，同时保持匿名性、完整性和安全性的概念。\n\
  \n#### 章节结构\n\n本章结构如下：第 9.2 节 谈论区块链的结构、组件和工作原理；第 9.3 节 强调该领域的相关工作；第 9.4 节 和 第 9.5\
  \ 节 包含使用智能合约和共识算法的建议方法论和实现。第 9.6 节 包含获得的结果，随后是 第 9.7 节 的结论。\n\n### 9.2 面向电子投票的区块链\n\
  \n#### 9.2.1 区块链结构\n\n\n\n\n区块链的概念最早于 1991 年作为一种研究方法被提出，随后在 2009 年找到了其实际应用。简单来说，区块链是指分布在特定网络上各个节点/用户之间的分布式数据库。该数据库按需以数字形式存储数据。区块链技术最常见的用途之一是加密货币，它被用来维护一个存储交易记录的去中心化系统。这样做保证了交易数据的安全性和完整性，并消除了对第三方验证者的需求，有助于保障交易安全。区块链数据库与典型数据库的区别在于数据组织方式。区块链以簇或组的形式收集信息，正式名称称为不同的区块，而典型数据库则以表格形式存储数据。这些区块包含有关数据/交易的信息。每个区块都有其存储容量限制，当某个区块填满时，它会被关闭并链接到其他区块，从而形成一个区块链，即区块链。每条新信息首先被收集，添加到一个新区块中，然后加入链中。必须注意的是，当区块被添加到链中时，会为其添加一个时间戳。因此可以看出，区块链的主要目标是允许数据被存储并传输给各个用户，但确保其不可编辑，从而为不可删除或修改的不可变账本交易记录提供基础。因此，区块链也被称为分布式账本技术。自诞生以来，由于不同加密货币、智能合约、非同质化代币和去中心化金融应用的创建，区块链已找到各种用途和应用。\n\
  \n##### 9.2.1.1 区块链的工作原理\n\n在考虑区块链的形成及其创建方式时，任何连接互联网且属于该网络一部分的用户都可以将交易放入区块链。如果要添加新交易，用户首先输入该交易。新添加的交易随后会广播到区块链的点对点网络中，该网络包含由全球各地用户运行的计算机节点。这些节点尝试通过解决特定问题或方程来验证新添加的交易。一旦新添加的交易被验证，它就被视为合法并被添加到一个区块中。所有其他添加的交易也经历相同的过程，并最终被添加到同一个区块中，除非该区块已满。如果区块已满，新验证的交易将被放入一个新区块中。这些数据记录区块随后被连接起来形成一条链。因此，交易完成。图\
  \ 9.1 解释了区块链创建过程。\n\n![图 9.1 区块链创建过程，其中新交易被添加到区块链。](img/fig9_1.jpg)\n\n图 9.1 区块链创建过程，其中新交易被添加到区块链。\n\
  \n#### 9.2.2 在电子投票中使用区块链的优势\n\n##### 9.2.2.1 准确性\n\n添加到区块链上的所有交易都由区块链网络上数百个节点进行验证，从而消除了验证过程中出现任何人为错误的可能性，提高了准确性。如果某个计算机节点出现计算错误，该错误仅会出现在区块链的单个副本上。若要使此类错误蔓延至整个网络，网络中约\
  \ 51% 的节点必须出现相同的计算错误，鉴于网络规模持续增长，这极不可能发生。这确保了在验证选票时不会出现任何错误，且在电子投票中不会发生任何选票篡改。\n\n\
  ##### 9.2.2.2 成本降低\n\n当交易需要确认时，客户通常支付给银行；此费用称为交易费。此类费用也存在于其他活动中，例如请公证人签署文件。由于区块链概念允许其他节点验证交易，因此消除了任何第三方验证的需求，从而也消除了相关成本。在电子投票中，无需雇佣人员来计票和统计选票，从而降低了相关成本和工作量。\n\
  \n##### 9.2.2.3 安全性\n\n区块链中的任何信息都不存储在中心位置，而是被复制并分布在节点网络中。每当新区块被添加到链中时，网络上的每个节点都会更新其区块链，以反映修改和新区块的插入。由于该信息不存储在中心数据库中，而是分散在网络中，这使得区块链更加安全。如果黑客攻破了区块链的一个副本，只有该副本会受到损害，但整个网络仍然安全，从而增强了安全性。对于电子投票系统，得益于区块链提供的安全措施，选票篡改的可能性显著降低。\n\
  \n##### 9.2.2.4 效率\n\n当发起交易时，在存在中心审批机构的情况下，可能需要几天时间才能完成交易结算。一个例子是，如果有人试图在周五存入支票，资金可能要等到几天后，即周一，才能出现在所需账户中。与金融机构不同，区块链全天候运行，这意味着所有交易最快可在约十分钟内完成，且该交易将在几小时内被视为安全。区块链的这一方面对于跨境交易非常有用，后者通常因时区差异而耗时更长。因此，就电子投票而言，世界各地的人们都能投票并即时看到投票结果，即不会有任何延迟。\n\
  \n##### 9.2.2.5 透明度\n\n大多数区块链的代码对所有人可见，即它们是开源软件。这允许审计员审查代码以确定其安全性。由于没有机构控制代码，任何人都可以对其进行编辑或改进。如果大多数软件用户同意代码升级是安全且值得的，则软件将被更新。\n\
  \n#### 9.2.3 电子投票系统的组件\n\n区块链试图解决许多现实世界的问题。根据需求，可以使用不同的共识算法或智能合约来构建电子投票系统。需要就要使用的区块链网络类型、要实施的共识算法、要进行的集成以及要保持的匿名级别做出某些选择。\n\
  \n##### 9.2.3.1 区块链网络\n\n主要有三种不同类型的区块链网络架构：第 1 类包括无许可访问的公共网络，如以太坊和比特币网络；第 2 类包括有许可访问的公共网络，如瑞波币；第\
  \ 3 类包括有许可访问的私有网络，如 FiberChain 和 Bankchain。图 9.2 展示了这些类别。\n\n![图 9.2 区块链网络架构。](img/fig9_2.jpg)\n\
  \n图 9.2 区块链网络架构。\n\n\n\n\n###### Network Architecture Selection\n\nThe choice of\
  \ network architecture depends on the degree of decentralization, the amount of\
  \ information made public, and the fee per transaction. When partial decentralization\
  \ is required, permissioned networks are preferred. If maximum decentralization\
  \ is needed, public permissionless blockchains are better. When using a public network,\
  \ all information related to the transaction is accessible, enabling real-time election\
  \ monitoring. However, if specific information needs to be kept confidential from\
  \ the public, a private blockchain network would be more suitable. All public blockchain\
  \ networks require transaction fees, which act as a security measure to prevent\
  \ Denial-of-Service (DoS) attacks.\n\n##### 9.2.3.2 Consensus Algorithm\n\nA consensus\
  \ algorithm refers to a mechanism that maintains coordination between users or machines,\
  \ i.e., creates a fault-tolerant system, by ensuring that all agents in the system\
  \ agree on a specific point of truth even when some agents fail. Consensus algorithms\
  \ are divided into two categories: competitive and non-competitive. Competitive\
  \ algorithms include Proof of Work, Proof of Stake, and Delegated Proof of Stake.\
  \ Non-competitive algorithms include the Paxos algorithm, the Raft algorithm, and\
  \ the Practical Byzantine Fault Tolerance (PBFT) algorithm.\n\n##### 9.2.3.3 Anonymity\n\
  \nBy default, a blockchain network is public in nature, allowing users to access\
  \ transaction details. However, it must be noted that in the case of online voting,\
  \ the secrecy of the vote cast by the voter must be ensured. Therefore, the vote\
  \ should not be linked to the voter who cast it; hence, the anonymity of the vote\
  \ given by the user must be guaranteed. In certain cases, including parliamentary\
  \ voting and stakeholder voting, a secret ballot is not necessarily required.\n\n\
  ### 9.3 Related Work\n\nExtensive work has been completed in the domain of utilizing\
  \ blockchain for e-voting; some of the related works are as follows.\n\nFrancesco\
  \ et al. [[16]](#chapter9.xhtml#ref9_16) built a \"Crypto Voting System\" using\
  \ a dual-chain blockchain, a one-way pegged sidechain (acting as an extension of\
  \ the blockchain), and the Shamir Secret Sharing method. This method further enabled\
  \ the creation of new features by avoiding writing data on the main chain. The eligible\
  \ voter registry and voting operation records are stored in the first sidechain,\
  \ while the vote count is recorded in the second sidechain.\n\nKhan et al. [[17]](#chapter9.xhtml#ref9_17)\
  \ created an efficient e-voting scheme using the MultiChain platform, while utilizing\
  \ the concepts of transparency and cryptography to achieve an effective solution.\n\
  \nTo determine which voting systems meet criteria such as reliability, anonymity,\
  \ and security, Garg et al. [[18]](#chapter9.xhtml#ref9_18) conducted a literature\
  \ review of various techniques and solutions for the e-voting problem and provided\
  \ a comparative study. However, they concluded that most systems require better\
  \ authentication techniques to verify user identity.\n\nKshetri and Voas [[19]](#chapter9.xhtml#ref9_19)\
  \ attempted to evaluate the pros and cons of BEV (Blockchain-Enabled Voting) and\
  \ listed the advantages and challenges faced by the approach. The study noted that\
  \ the approach provides trust, accuracy, and security; the main issue is that public\
  \ accessibility is hindered due to its complexity and fluctuations in broadband\
  \ connectivity.\n\nYavuz et al. [[20]](#chapter9.xhtml#ref9_20) implemented an e-voting\
  \ system on the Ethereum platform using smart contracts to keep the system secure\
  \ and transparent, and examined the time required for a voter's vote to be recorded,\
  \ thereby judging system efficiency, but the method is limited to small-scale elections.\n\
  \nKhan et al. [[21]](#chapter9.xhtml#ref9_21) attempted to find the scalability\
  \ constraints of e-voting systems by determining the impact of parameters such as\
  \ block size, voting speed considered, and population, and examining their impact\
  \ on system efficiency. A scenario where all parameters are optimal to achieve maximum\
  \ efficiency is unlikely to occur; experiments show that different adjustments when\
  \ changing these parameters lead to high performance in one parameter at the expense\
  \ of others.\n\nWidayanti et al. [[22]](#chapter9.xhtml#ref9_22) built a holistic\
  \ e-voting system using three independent models—an integration model, a voting\
  \ model, and a revocation model—the system uses the concept of Elliptic Curve Cryptography\
  \ (ECC). The system is designed to prevent vote forgery and satisfy other parameters.\
  \ The main issue is that the ECC technique used is vulnerable to quantum computer\
  \ attacks.\n\nChaudhari [[23]](#chapter9.xhtml#ref9_23) used the concept of smart\
  \ contracts as shown in reference [[20]](#chapter9.xhtml#ref9_20), but focused more\
  \ on privacy protection. The method includes creating smart contracts, user authentication\
  \ and verification, applying Proof of Work (PoW) and Proof of Vote (PoV) algorithms,\
  \ and handling faulty nodes. It examines the probability of failure and smart contract\
  \ efficiency, finding that the PoW method reports a higher probability of failure\
  \ compared to the PoV method.\n\nYousif et al. [[24]](#chapter9.xhtml#ref9_24) provided\
  \ a comparative study of privacy requirements and security requirements in e-voting\
  \ systems by comparing various methods based on specific parameters including eligibility,\
  \ anonymity, reliability, transparency, fairness, robustness, etc.\n\n\n\n\n此外，必须注意到隐私和安全在电子投票系统中均至关重要，且基于不同的方法，满足这两项需求的能力已得到提升。同时也必须指出，在验证已投选票真实性、匿名性、投票速度及其可访问性等方面，仍需做更多工作。\n\
  \nHjálmarsson 等人 [25] 利用以太坊和 Solidity 算法测试了一种电子投票系统，以使用智能合约并结合 HTML、CSS 和 JavaScript\
  \ 以及 NodeJS 来提高安全性、降低构建成本，结果发现透明性、安全性和可审计性均得到了良好满足。\n\nThuy 等人 [26] 提出了另一种基于区块链的电子投票系统方案，该方案最小化了中心化概念，增强了公平性概念。该过程涉及创建所用的界面，随后创建应用服务器和选票监管机构，以及以太坊节点和选票合约；进一步发现该模型有助于降低成本并改善用户体验。\n\
  \nVivek 等人 [27] 基于多链平台创建了另一种基于区块链的去中心化投票系统，该系统解决了 Sawtooth 框架的问题，确保了系统的可扩展性、投票的公平性以及小规模下的用户匿名性。\n\
  \nJafar 等人 [28] 创建了一个基于多链平台的投票系统，重点在于改进文献 [27] 中提到的安全性，以及选票的机密性和完整性。该系统通过创建后端和节点来实现，指定存储容量、选民身份验证等要素，最后进行投票。\n\
  \nHaibo [29] 利用 ECC（椭圆曲线密码学）概念来保障电子投票系统的安全，该系统通过使用私钥生成投票区块签名并使用公钥进行验证的过程来工作。\n\n\
  Khan 等人 [30] 最终基于区块链概念检查了基于应用程序的交易延展性攻击的可能性。为了得出结论——即当诚实发送的交易与可延展交易之间的时间间隔非常短时，攻击机会显著，该文尝试解释可能导致该攻击的情况，并检查各种条件以查看若对应用程序实施攻击是否存在任何显著副作用。\n\
