  \n## 2 物联网智慧环境：挑战与解决方案的综合研究\n\nM. R. Sundarakumar、S. Sankar、Somula Ramasubbareddy、Velleangiri\
  \ Vinodhini 和 Balusamy Balamurugan\n\nDOI: [10.1201/9781003353034-2](https://doi.org/10.1201/9781003353034-2)\n\
  \n### 2.1 简介\n\n\n\n\n\n#### IoT 技术概述\n\n嵌入式技术（如计算机通信、电信网络和移动计算）在历史上快速发展，其主要焦点是实现全球感知。机器对机器与人机之间可靠的数据传输和信息处理是通信的主要方面（Alcaraz,\
  \ 2019; Sennan et al., 2021）。在此方法下，全世界已开始研究创新框架以满足社会需求。新创新技术的增长为此提供了不同的想法和解决方案，但存在一些局限性。最终，计算机网络进入数字世界应用，占据了研究人员思想的主要比例（Samanta\
  \ et al., 2021; Sankar et al., 2021）。尽管在克服实时数据传输方面存在一些问题和挑战，且仅支持许可条件，但全世界期望将连接到互联网的机器和其他组件作为“事物”来访问。幸运的是，新框架能够应对所有局限性和期望，即物联网在所有领先技术中发挥了至关重要的作用（Alotaibi\
  \ and Elrefaei, 2018; Karthiprem et al., 2015; Sennan et al., 2021）。物联网利用其特性成功有效地控制和监控了大量机器。然而，在多个实际应用中，它在数据传输和控制方面存在许多问题。特别是利用物联网优化设备的自动化过程，为机器提供了准确的结果。在数字时代，通过网络连接的高速互联网连接，数据传输技术迅速增加。但软件、传感器、执行器和电子元件等其他因素是物联网环境的基本要素（Alotaibi\
  \ and Elrefaei, 2018; Mishra et al., 2020; Samanta et al., 2020; Sankar et al.,\
  \ 2020a）。在物联网平台上执行不同过程以访问各种环境。物联网的整个过程如图 2.1 所示。\n\n![图 2.1 物联网过程](img/fig2_1.jpg)\n\
  \n图 2.1 物联网过程。\n\n### 2.2 物联网挑战\n\n人类在物联网框架中对于控制和访问机器部件起着非常重要的作用。但物联网为人类访问实际应用提供了许多益处（Dabbagh\
  \ and Rayes, 2019; Sankar et al., 2020b）。在涉及安全和隐私顾虑时，整个框架使得设备访问变得困难。物联网的主要问题体现在处理海量数据、完整性、安全性、自动化以及具有加密能力的监控过程中。在数字世界中，利用互联网设施将文本、音频和视频消息从一地传输到另一地是复杂的。尽管数据大小及其速度在一定距离内受限，但某些技术可用于将数据传输到长距离。将数据传输到更长距离的主要问题是安全事务和及时通信（Dai\
  \ et al., 2019）。但机器的连接在物联网框架中产生了某些问题。模型必须遵循某种机制，以便在近期应用中通过一些算法和方法实现机器间数据的安全事务。机器间的数据传播在整个网络通信中产生挑战。物联网框架中执行的操作基于机器间的互操作性给出结果（Ferrag\
  \ et al., 2018; Sennan et al., 2020; Sankar and Srinivasan, 2018a）。幸运的是，物联网为大多数实际应用提供了解决方案。但必须通过新的技术方法解决一些问题以满足社会需求。对用于社会问题的物联网技术的认知，强调了其特性，使访问该框架的人们受益。因此，上述挑战存在于物联网框架中，并如图\
  \ 2.2 所示。\n\n![图 2.2 物联网挑战](img/fig2_2.jpg)\n\n图 2.2 物联网挑战。\n\n### 2.3 物联网特征\n\n\
  物联网框架具有其特征，这将根据其架构中使用的模型行为进行分类。大多数信息传输到集中式控制器，并通常由网络黑客使用异常检测进行监控。无线传感器网络（WSN）是一种用于互联设备及其协议的重要技术（Frustaci\
  \ et al., 2017; Mishra et al., 2020; Sankar and Srinivasan, 2018b）。物联网框架连接到互联网和\
  \ WSN，以通过网络访问设备、传感器和执行器。数据传输通过 WSN 在设备之间发生，并利用互联网将数据传送到其他地方。WSN 和互联网在物联网中的全球扩展是数据传输的典型挑战。2020\
  \ 年至 2025 年间，数万亿设备连接在物联网网络上（Ghafir et al., 2018; Sankar and Srinivasan, 2020）。这需要高质量的连接技术以及具有\
  \ WSN 的高速互联网连接。分析由传感器和人类生成的数据将很困难。对于数据分析过程而言，从网络中存在的大量设备中识别确切设备及其相关数据是一个具有挑战性的角色。因此，需要自动化来优化物联网网络中的设备，未来可解决漏洞问题，以建立强大的安全框架（Habib\
  \ et al., 2018; Sankar et al., 2020c）。\n\n物联网生态系统在此框架中也发挥着主要作用，并将用于在各种环境中连接设备。机器对机器（M2M）是物联网的概念（Hakak\
  \ et al., 2019; Sankar and Srinivasan, 2018c），用于连接来自不同地点但通过物联网上的路由协议连接的数万亿设备。路由是物联网中用于在各地远程连接设备的网络概念（Hakak\
  \ et al., 2018）。为此，物联网支持多种协议用于数据传输。物联网中使用的远程连接设备在连接性和数据传输方面产生问题。物联网环境特征的整体概念表示生态系统中发生的挑战（Jindal\
  \ et al., 2018）（Kamaruddin et al., 2018; Sankar et al., 2020a），即传感器/设备在远程位置进行数据传输。解决方案将通过实际对象中的最新趋势和技术为这些问题提供。解决方案主要涉及物联网特征，如速度、距离、连接性和传输协议（Khadam\
  \ et al., 2020; Sennan et al., 2020）。图 2.3 说明了物联网的特征及其工作原理。\n\n![图 2.3 物联网特征](img/fig2_3.jpg)\n\
  \n图 2.3 物联网特征。\n\n### 2.4 物联网过程管理\n\n\n\n\n物联网的过程可借助其设备进行分类，这些设备收集数据并通过适当的算法对其进行分析。各种传感器和设备生成的数据从不同地方收集而来，但其大小和其他因素在本质上各不相同（Khadam\
  \ et al., 2019；Sankar and Srinivasan, 2017；Vinodhini et al., 2020）。为克服这一问题，已对这些数据进行分析，并将定期进行监控。图\
  \ 2.4 描绘了物联网环境处理方法的详细分析。\n\n![FIGURE 2.4 IoT process management.](img/fig2_4.jpg)\n\
  \n图 2.4 物联网过程管理。\n\n### 2.5 物联网挑战及其解决方案\n\n有多种趋势和解决方案用于克服物联网框架中的挑战。大多数挑战集中在安全方面的问题和隐私方面的问题上。但物联网环境中面临的挑战将改变面向社会问题需求的未来方法（Kiani,\
  \ 2018；Sankar and Srinivasan, 2016；Sennan et al., 2019；Sennan et al., 2020；Vinodhini\
  \ et al., 2020）。以下趋势已被用于为物联网挑战提供解决方案。\n\n1.  边缘计算分析\n2.  物联网安全问题\n3.  工业物联网挑战\n\
  4.  物联网云计算平台\n5.  基于 ML/AI 的物联网应用\n6.  可持续性与气候变化中的物联网\n7.  区块链物联网\n8.  物联网中的云与边缘计算\n\
  9.  通用传感器\n10. LPWAN 和 5G 网络\n\n#### 2.5.1 边缘计算分析\n\n当传感器和机器利用现实世界的应用生成日常生活数据时，这些数据将迅速存储在存储库中。成功完成存储后，可能需要对数据进行分析处理，以将机器的水平提升到下一个状态。但由于生成数据的大小和时间，分析部分相当复杂（Sankar\
  \ and Srinivasan, 2019；Sankar and Srinivasan, 2018d）。因此，在网络上使用实时数据分析以高速任务刺激该过程。在此阶段，系统安全性、延迟和成本是决定挑战的主要因素。最后，称为边缘的新术语作为本地网络设备出现，可按时提供机器状态。部分边缘计算服务提供商包括\
  \ `AWS`、`Microsoft Azure` 和 `IBM cloud`（Lin et al., 2017；Sankar and Srinivasan,\
  \ 2016）。它们在边缘层面为物联网应用提供扩展服务。支持这种边缘计算的公司制造带有网关的计算机，以便通过网络轻松传输和控制数据。边缘计算作为一种有前景的技术，结合机器学习（`ML`）和人工智能（`AI`）技术来执行数据传输（Sankar\
  \ and Srinivasan, 2017）。\n\n在这里，整个物联网框架边缘的服务和安全问题得到处理，硬件（如本地计算设备）将为其提供解决方案。基于 `ARM`\
  \ 的微控制器、微芯片、`NXP`（Mandal and Ghantasala, 2019）和其他指定微控制器等硬件用于处理从网络收集的海量数据。这项技术有助于在低成本云计算环境中实现低延迟的端到端系统解决方案。这也用于在没有云数据存储概念的情况下使物联网设备变得非常智能。图\
  \ 2.5 描绘了物联网环境中边缘计算的细节。\n\n![FIGURE 2.5 IoT edge computing analytics.](img/fig2_5.jpg)\n\
  \n图 2.5 物联网边缘计算分析。\n\n#### 2.5.2 物联网安全问题\n\n结合 `WSN` 技术的物联网为将所有数据存储到存储库提供了数据传输属性。在传输过程中，使用\
  \ `Bluetooth`、`Wi-Fi`、`LoRa`、`ZigBee`（Mandal and Ghantasala, 2019）等常见技术在不同位置创建存储库。但由于距离原因，从低延迟和高速提取方法访问这些数据时会出现连接问题。因此，加密技术用于提供物联网框架数据的安全性，并进行加密和解密以解决安全问题（Sankar\
  \ and Srinivasan, 2017）。在这些地方使用了大量协议和网络安全原则，以有效访问物联网中的信息。图 2.6 标示了物联网框架可能面临的挑战。\n\
  \n![FIGURE 2.6 IoT security issues.](img/fig2_6.jpg)\n\n图 2.6 物联网安全问题。\n\n#### 2.5.3\
  \ 工业物联网挑战\n\n工业中使用的物联网因巨型机器和大容量数据生成而产生许多挑战，即工业 4.0。以高投资为数万亿设备的数据提供存储空间，目前对小规模工业而言是不可能的。它们正在寻求解决方案以访问不同平台来降低成本。因此，它们向服务提供商寻求服务，并使其成为其业务的供应商。在这里，所有设备和数据的安全性是物联网环境中的挑战，但大数据、区块链、`AI`\
  \ 和 `ML`（Shin et al., 2017；Sollins, 2019）等最新趋势被用利用其特性来解决这些挑战。全行业都在尝试利用 IT 领域可用的物联网平台和服务提供商来解决能源效率、商业智能、数据存储库和自动化问题。它们都使用云和大数据技术用于数据存储库目的，但分析使它们结合物联网框架变得更智能。图\
  \ 2.7 说明了使用物联网的行业面临的挑战。\n\n![FIGURE 2.7 Industry IoT challenges.](img/fig2_7.jpg)\n\
  \n图 2.7 工业物联网挑战。\n\n#### 2.5.4 物联网云计算平台\n\n云计算服务即 `SaaS`、`PaaS` 和 `IaaS` 用于为物联网中的可扩展输入数据提供资源管理功能。云计算中的软件即平台已在工业中出现，用于自动化、医疗保健和用于商业目的的\
  \ `ERP` 解决方案。云计算中软件即服务的问题意味着通过可扩展性和异质性给物联网平台带来漏洞。还有其他因素也受物联网中 `SaaS` 影响，如能耗、动态性、复杂性、低延迟和资源利用率。因此，从\
  \ Web 服务角度提高软件质量将解决物联网中的挑战，即使资源在各方面都被高度利用。此外，物联网框架帮助云计算存储数据以进行分析，智能传感器或智能设备的决策可通过这些\
  \ `SaaS` 活动完成。为了保护远程位置使用的数据，设备在物联网平台的中心位置被作为 Web 服务控制器进行管理。图 2.8 给出了物联网在云计算 `SaaS`\
  \ 平台服务中面临的挑战。\n\n![FIGURE 2.8 SaaS challenges faced in IoT.](img/fig2_8.jpg)\n\n\
  图 2.8 物联网中面临的 SaaS 挑战。\n\n#### 2.5.5 基于 ML/AI 的物联网应用\n\n\n\n\n##### 利用机器学习和人工智能方法的物联网数据分析流程\n\
  \n深度智能是一种新方法，有助于将边缘设备和云环境连接到智慧城市和医疗保健领域。私营部门通过物联网框架连接到网络，并利用机器学习概念执行其数据分析流程。人工智能用于根据设备全天的状况选择网络中的设备（Mandal\
  \ and Ghantasala, 2019；Shin et al., 2017；Sollins, 2019；Karthiprem et al., 2015）。实时应用数据分析流程可利用物联网中的这些特性使其更加高效。图\
  \ 2.9 展示了物联网中的深度智能方法。\n\n![FIGURE 2.9 IoT with ML AI techniques.](img/fig2_9.jpg)\n\
  \n图 2.9 采用机器学习和人工智能技术的物联网。\n\n#### 2.5.6 物联网在可持续发展与气候变化中的应用\n\n物联网框架在全球各地的各种可持续发展和气候变化项目中运行。这些项目利用物联网框架增加了回收产品的使用量并实现了对地球天气的控制。智能传感器在物联网框架下主宰世界，实现了用于现实应用的机器的自动化和优化。利用物联网框架，天气控制报告每秒生成一次，未来的地震、风暴和洪水等问题将被准确识别。从可持续发展的角度来看，现实世界中所有的回收物品都必须利用物联网进行集中化和管控。在物联网智能传感器的帮助下，可再生能源和节水概念得到了改进，并被用于从远程连接进行监控（Taha\
  \ et al., 2018）。当物联网处理其功能时，物联网下所有设备和机器的控制过程变得非常容易。此外，数据生成量也非常大，但作为大数据进行处理并存储在存储库中以供回收过程使用。因此，在实时执行期间，关于整个流程的所有信息的提取和备份都处于受控状态。图\
  \ 2.10 说明了物联网应用中的可持续性和环境变化。\n\n![FIGURE 2.10 IoT applications on sustainability\
  \ and climate change.](img/fig2_10.jpg)\n\n图 2.10 物联网在可持续发展和气候变化方面的应用。\n\n#### 2.5.7\
  \ 物联网与区块链\n\n在加密和解密概念的帮助下，物联网框架中机器与传感器之间的数据传输更加安全。为了提供安全交易，每次传输过程中数据都必须从一种形式更改或更新为另一种形式。因此，如果黑客中断网络，数据在那时不会被泄露或窃取。区块链是用于在物联网上提供安全交易的新技术，用于流程的所有数据都通过算法进行加密。虽然加密是安全的，但它可能会在网络相关场所的传输过程中导致延迟问题。为了克服这一问题，区块链被用作通过加密技术进行的代码片段交易，使每个过程都安全可靠。图\
  \ 2.11 说明了区块链在物联网中的重要性。\n\n![FIGURE 2.11 IoT applications with block chain.](img/fig2_11.jpg)\n\
  \n图 2.11 结合区块链的物联网应用。\n\n#### 2.5.8 云计算与边缘计算在物联网中的服务\n\n物联网框架中连接了多台机器和传感器，不同平台或网络之间的连接在传输数字数据时会产生冲突。平台在内部连接的本地节点边缘产生安全问题。因此，节点使用两种不同的边缘技术——云计算和边缘计算（Wen\
  \ et al., 2018）——将数据从一处传输到另一处。这解决了端到端事务中的资源管理和节能问题。在这里，云计算存储来自所有外部来源的生成数据，而边缘计算连接节点，然后进行数据传输。因此，如果任何黑客进入任何一个节点，他们的备份已被获取并存储在存储库中；此外，它向黑客提供加密数据（Rana\
  \ and Kumar, 2019）。图 2.12 描绘了云计算和边缘计算的区别及其在物联网框架中的工作原理。\n\n![FIGURE 2.12 IoT with\
  \ cloud and edge computing applications.](img/fig2_12.jpg)\n\n图 2.12 结合云计算和边缘计算应用的物联网。\n\
  \n#### 2.5.9 物联网设备——传感器日益成为大宗商品\n\n连接在物联网框架中的设备和传感器因现实应用而迅速增加。然而，这些传感器和设备的大宗商品服务因其特性而日益增长。数万亿设备在全球持续工作并随机生成数据。大宗商品传感器的主要目的是实现其能力和水平。因此，物联网中所用所有传感器的快速变更和更新将提高应用的效率。\n\
  \n#### 2.5.10 面向物联网的 LPWAN 和 5G 技术\n\n中国、韩国、日本和欧洲国家等大多数国家已尝试将低功耗广域网（LPWAN）用于其自动化目的，并取得了良好结果。这导致能耗降低，并在一定距离内实现了低延迟的安全传输。此外，5G\
  \ 也以高速带宽和频率引入，用于物联网框架上数据的安全传输。当讨论这些涉及数据传输时间和速度的场景时，它们在现实应用中提供了良好的结果。但数据大小、安全性和认证问题等其他因素给出了较差的成功率百分比，因为它仅在一定距离内工作。然而，对于智慧城市和智能家居自动化等物联网框架区域，它在无人值守的情况下以\
  \ 75% 的成功率为系统的控制和监控提供了良好的环境。\n\n### 2.6 物联网未来趋势\n\n\n\n\n物联网框架中使用了多种技术和概念，同时也面临着相应的挑战。但这些技术挑战已被研究人员频繁发明的新方法所解决或修正。无论如何，新概念正在统治世界，尤其是数字世界，但物联网自技术诞生之初就稳守其地位。每当当前场景中出现挑战时，它都会整合新的方法和算法。由于连接问题或长距离数据传输，物联网整个系统的分析部分到处都遇到困难。这无法仅靠所有最新趋势来解决，因此物联网框架转向了下一代人们的期望。新概念频繁涌现，但它们对现有问题的解决尚未达到预期水平。物联网的未来挑战类似于数据传输过程中出现的隐私和认证问题，其他因素如策略、标准、分析等也将成为未来的挑战。在研究克服这些问题时，利用最新趋势开发了一些概念，并根据当前场景更改或更新了若干概念。例如，距离将成为未来物联网问题的关键，被称为\
  \ `LPWAN` 和 `5G` 的技术将在其范围内实现这一点。自动化和优化是物联网的主要问题，未来将在区块链加密方法的帮助下得到更新。\n\n### 2.7\
  \ 结论\n\n物联网赋能技术的环境描绘了其通过网络利用各种元素进行数据传输时的困难与解决方案。在物联网框架中，采用创新方式在设备间建立有效通信。通常，安全是物联网框架最严重的问题，当黑客攻击系统时会导致数据丢失或数据损坏。当数据通过任何物联网赋能设备进行长距离传输时，物联网框架面临连接挑战。此时，密码学被用于通过认证、策略和访问标准为物联网系统环境提供安全。这种数据格式已演变，现在可传输更远的距离用于通信。这种方法将把安全提升到一个新水平，并为物联网问题带来答案。另一种新技术区块链将允许比特币技术以最小数据块安全传输。最新技术，如\
  \ `ML` 和 `AI`，被用于通过云平台进行数据分析，使计算机能在任何情况下自主做出判断。深度智能是将云和边缘计算平台连接在物联网架构内的最新方式。这种连接将解决网络局部节点中出现的挑战。具有更多频率模式的\
  \ `LPWAN` 和 `5G` 技术被用于更远距离的数据访问和传输。未来的物联网框架将面临多项技术障碍，但对当前模式的研究将有助于克服这些挑战并找到解决方案。\n\
