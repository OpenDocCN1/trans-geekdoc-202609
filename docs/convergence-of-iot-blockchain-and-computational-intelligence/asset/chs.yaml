  \n\n\n\n\n## 12 物联网在供应链管理流程中的作用\n\nUsha Yadav 和 Sheetal Soni\n\nDOI：[10.1201/9781003353034-12](https://doi.org/10.1201/9781003353034-12)\n\
  \n### 12.1 引言\n\n为了在现代商业管理环境中竞争，个别企业必须积极参与更大的供应链（SC），后者是由多家企业和合作伙伴关系组成的网络 [[1]](#chapter12.xhtml#ref12_1)。在即将到来的智慧城市中，供应链管理（SCM）和物流在过去几年中经历了显著变革\
  \ [[2]](#chapter12.xhtml#ref12_2)。竞争压力激发了人们对 SCM 和物流日益增长的兴趣，这最终使其成为业务运营和战略的关键组成部分\
  \ [[3]](#chapter12.xhtml#ref12_3)。第四次工业革命的新商业前景和技术发展为制造业及其供应链提供了以前难以想象的绩效改进机会。因此，供应链在一个不断变化的环境中运行，并在各方面面临着广泛的风险。该环境是一个受多种因素影响的动态地形\
  \ [[4]](#chapter12.xhtml#ref12_4)。由于许多供应网络跨越广阔的地理区域，它们面临着多种全球性风险 [[5]](#chapter12.xhtml#ref12_5)。客户在产品定制、成本和服务质量方面变得越来越挑剔\
  \ [[6]](#chapter12.xhtml#ref12_6)。此外，由于经济、社会和生态因素（包括能源成本、原材料定价和供应情况、汇率，以及极端天气条件、地震和海啸等不可避免的自然因素），外部环境非常动态\
  \ [[4]](#chapter12.xhtml#ref12_4)。尽管如此，仪器仪表、连接性和智能化的进步可以产生当今企业所需要的可靠、安全和可持续的供应链\
  \ [[5]](#chapter12.xhtml#ref12_5)。当前 SCM 实践的目标是实现所谓的动态灵活性，这使企业能够适应需求的具体变化和技术进步，但仅限于其当前供应链设计的预定框架内\
  \ [[6]](#chapter12.xhtml#ref12_6)。然而，如果供应链架构要应对动态经济环境的挑战，则需要包含灵活替代方案的结构灵活性。然而，在大多数企业仍在使用过时的遗留系统、新技术以及连接和断开连接的资产相结合的世界中，物联网（IoT）将需要一些时间才能完全普及。作为工业\
  \ 4.0 的主要参与者，物联网通过增强供应链连接性和可见性，为整个物流价值链提供了优势 [[7]](#chapter12.xhtml#ref12_7)。因此，本研究的目的是探讨物联网技术如何实现供应链的透明度和连接性，以及它们对供应链绩效的影响。\n\
  \n### 12.2 供应链流程日益增加的复杂性\n\n由于全球化和连接性的增强，供应链现在更容易受到自然灾害和中断的影响。如今，一个遥远国家的危机可以迅速蔓延至全球经济。随着供应链变得更加互联互通，没有任何公司能独善其身。IBM\
  \ 于 2008 年进行的首份首席供应链官研究报告，侧重于对顶尖供应链高管进行深度面谈，这些高管来自分布在亚太地区、西欧和北美 25 个国家的 400 多家公司。这些高管负责管理涵盖零售、制造、食品饮料、医药、电子和电信等不同行业的供应链\
  \ [[5]](#chapter12.xhtml#ref12_5)。该研究强调了当代 SCM 面临的五大挑战。挑战如图 12.1 所示。\n\n![图 12.1\
  \ 供应链管理中的挑战。](img/fig12_1.jpg)\n\n图 12.1 供应链管理中的挑战。\n\n降低成本是供应链管理者的首要任务，远高于业务增长和新产品/服务开发。大宗商品价格上涨、意外的贷款限制以及先前低工资市场工资的突然上涨正变得越来越频繁。因此，企业不断努力提高供应链活动的效率，以降低成本。供应链管理者也在为供应链可见性而苦恼。相反，尽管可用信息更多，但能被有效管理、评估并提供给需要者的信息却更少。研究发现，许多高管声称他们的公司要么忙于交换实际销售数据，要么不重视同事间的决策。风险管理也是让供应链管理者担忧的另一个话题。全球化和更广泛的供应链互联互通增加了风险，但也使其更难以管理。管理者指出，缺乏一致的风险管理程序、数据缺失和技术不当是主要障碍。客户参与产品设计的各个阶段是供应链管理者面临的主要问题。研究指出，每三家企业中就有两家难以正确识别客户需求。尽管企业显然需要与客户沟通，但它们往往更重视供应商。全球化位居主要供应链挑战之列，鉴于世界各国经济日益紧密的相互联系，这不足为奇。许多企业因交货不一致、交货周期长和质量低劣，在国际采购方面遇到困难。\n\
  \n该研究表明，参与供应链的企业数量随其地理覆盖范围的扩大而增加。正如图 12.2 所示，大多数管理者表示预计与外部各方的联合互动数量将会上升 [[8]](#chapter12.xhtml#ref12_8)。此外，到\
  \ 2010 年，更广泛范围的任务将被分包出去。企业必须主动将智能融入其决策和管理系统，以应对这些挑战。如果企业想在当今快速演变的环境中保持竞争优势，就需要了解当前影响供应链运营的最新技术。使用数字工具从基本材料源头到客户端监控和跟踪物品，可以提供完整的供应链可见性。目标是保持所有供应商和链条环节的数据格式统一。然后，可以使用区块链技术等将数字设备连接到数据，区块链是一个通用平台，供应链中的许多参与者可以在该平台上访问物联网、射频识别（RFID）、链条输入和验证以及人工智能。固有的供应链挑战在一定程度上可以借助物联网来克服。\n\
  \n![图 12.2 供应链领导者面临的五大挑战。](img/fig12_2.jpg)\n\n图 12.2 供应链领导者面临的五大挑战。\n\n### 12.3\
  \ 供应链环境的演变\n\n\n\n\n#### 供应链演变与第四次工业革命\n\n供应链会随着时间的推移，在规模、形状、配置以及协调、控制和管理技术方面不断演变。新供应链的出现可能源于多种原因，例如为响应技术创新\
  \ [9]。有观点认为，结构、规模和贸易类型最终是由基本经济因素决定的，而非供应链特性 [10]。然而，其他因素也可能对供应链的配置、运行和协调方式产生重大影响。除了经济和技术驱动因素外，监管框架\
  \ [11]、可持续发展议程、政治因素 [12] 和战略决策 [13] 也会影响供应链的结构和配置。全球采购技术极大地改变了供应网络的建立方式 [14]。为遵循制造和/或营销计划并更好地服务市场，组织已战略性地重构其网络。因此，各种经济、技术、环境和战略因素都可能影响供应链参与者、增值活动的地点、这些活动的协调与管理，以及供应网络的增长与发展。\n\
  \n第四次工业革命由物联网、网络物理系统（CPS）、区块链、大数据和虚拟化等新应用和服务体系代表。根据众多研究，第四次工业革命（即工业 4.0）是现有信息和通信技术的融合，用于创造商品和服务\
  \ [15]。从业者和学者最关注的研究课题是物联网及其优势与困难。随着供应链以快速速度变得更加复杂，提高供应链可见性将帮助企业通过减少不准确性来简化运营并降低复杂性\
  \ [16]。由于全球化加剧、以客户为中心以及信息技术（IT）的改进，供应链管理（SCM）的重要性将在未来几年增长 [17]。包括物联网在内的各种技术的实施，对能源生产、制造、仓储、医疗、化工制药、食品饮料等多个行业产生了广泛的积极影响。增强现实、直接数字化生产、仓库自动化和\
  \ 3D 打印等持续的技术发展，从供应链角度开启了全新的可能性世界。除了提高生产和分销运营的生产力与适应性，这些新技术还改变了各供应链节点间的动态关系，并聚焦于消费者\
  \ [18]。\n\n智能供应链的目标是利用尖端技术（特别是新兴信息通信技术 `ICT`），通过物联网、区块链等，互联供应链多个合作伙伴的流程，创建智能互联系统\
  \ [19]。智能制造中的 `ICT` 和其他新兴技术有望显著提升供应链绩效。创新技术，特别是尖端 `ICT`，正在推动第四次工业革命（即工业 4.0）。复杂的\
  \ `ICT` 影响制造系统的几乎所有阶段 [20]。现代供应链管理研究非常关注产品与需求信息流及其相应协调的研究 [21]。由于所有供应链本质上都是由需求驱动的，最终消费者需求数据常被视为供应链网络中最关键的数据\
  \ [19]。可用性、收入、定价、运输、区域、数量、性能和技术数据是产生的更常见信息示例 [21]。在大数据时代，需要新技术来获取、存储、分发和分析海量、高速、复杂和多样的数据。物联网是通信和计算领域的一项技术进步，将实现“随时、随地、任何媒体、万物互联”的交互\
  \ [22]。因此，物联网使虚拟与物理元素的连接成为可能，开辟了全新的服务和应用范围。\n\n### 12.4 物联网\n\nIT 时代的增长对于改善从起点到消费点的商品、数据和服务的流动与存储的规划、执行和控制至关重要。新技术带来的变革速度彻底改变了企业为客户创造和分发价值的方式。例如，工业\
  \ 4.0 的引入已被证明是为行业和日常运营流程优化价值链活动等众多商业利益提供关键成功要素 [23]。\n\n德国经济发展署 [24] 创造了“工业 4.0”这一术语，用以描述多种技术的出现、发展和融合，这些技术实现了物理世界与数字世界近乎实时的交互。因此，技术一直是并仍然是高效供应链管理的关键促进因素。通过改善通信、数据采集和数据传输，它在协调参与者、实现高效决策和提升供应链绩效方面发挥着关键作用。物联网是供应链管理领域最新的\
  \ IT 进步之一，能为更高效的决策提供更精确的数据。\n\n### 12.5 物联网在可持续供应链管理中的作用\n\n文献中存在大量物联网定义。其中一种定义为：“它是一种技术理念，即多个连接设备能够开启和关闭互联网，以利用软件和自动化程序实现智能应用。”当\
  \ `RFID` 标签通过网络连接时，可建立通信并传输识别数据 [25]。\n\n供应链面临诸多问题，如交付的有效性与效率、持续监控、合作伙伴间的紧密协作等。物联网创建了一个物理连接的事物网络，利益相关者可持续监控和检测该网络。因此，该技术的使用实现了更高的数据透明度和可见性，例如温度监控、位置、湿度、压力、光照和封条破损等。物联网还能降低成本和浪费。从技术上讲，物联网基于\
  \ `RFID` 和 `GPS` 等基础技术，并将它们连接到互联网 [3]。\n\n\n\n\n#### 物联网在供应链管理中的应用\n\n物联网应用在当前场景中已被广泛实施，用于在供应链中查找、识别、追踪和监控货物与服务\
  \ [16]。此外，在此情况下，该技术也已应用于其他学科，特别是农业和医疗行业的供应链。在供应链管理领域执行物联网基础设施的首要关键障碍是安全顾虑、缺乏标准、互操作性问题，以及软硬件限制。尽管\
  \ RFID 技术多年来一直是物联网的关键推动者，但仍存在定价、技术采用、复杂性、规模实施和数据管理等问题 [22]。\n\n由于智能对象共享大量信息并连接可通过\
  \ Web 界面访问的资源而产生的数据管理困难，在面向语义的组件中得到了解决。设备和智能物品，如传感器、执行器和联网 RFID 芯片。自无线技术出现以来，物联网获得了更多关注\
  \ [10]，供应链管理界也对其表现出了兴趣 [16, 26]。物联网为工业自动化做出了重大贡献，并实现了用于工厂控制的网络、用于企业信息管理的网络以及用于物流管理的\
  \ RFID 网络的融合与集成。\n\n此外，物联网为企业提供了提升运营效率、保障运营便利性并保持竞争优势的途径。企业能够利用物联网精简信息流，提供显著的供应链效率改进，并实现组织间及组织内部的通信与集成\
  \ [27]。例如，国际时装零售商 Zara 基于物联网，成功保持了高规划灵活性、可靠的补货解决方案、更短的交货周期和更少的产品变更 [28]。\n\n###\
  \ 12.6 供应链流程与物联网的详细文献\n\n供应链管理受益于物联网的节约成本、库存准确性和产品追踪等特性。然而，物联网对各种供应链活动的影响尚不清楚 [4]。以流程为中心的供应链视角是理解供应链的一种范式。一个著名的框架是供应链运作参考模型（SCOR\
  \ 模型），它将供应链流程分解为计划、采购、制造、交付和退货。因此，本研究旨在通过基于受影响供应链流程的综合文献综述，识别物联网对供应链管理的影响。鉴于计划流程与所有其他\
  \ SCOR 流程交织在一起，目前的文献分析集中在其余的 SCOR 流程上。\n\n#### 12.6.1 采购\n\n供应链的一个上游组成部分是采购，即仔细决定企业开展业务所需产品和服务的过程。除了选择卖方、谈判合同和评估供应商的长期绩效外，采购还指购买商品的行为。虚拟供应链使企业能够快速接受并应对商业环境的变化。为了应对行业限制和当今可用新技术提供的机遇，供应链正变得更加虚拟化\
  \ [29]。改变组织结构的能力使其能够设计解决方案以满足不断变化的客户需求。这得益于虚拟供应链 [30]。本质上，虚拟供应链将管理任务从商品从源头到目的地的实际移动中分离开来。虚拟对象而非真实对象被直接用于监管和协调供应链活动\
  \ [29]。文中还讨论了“追踪与溯源分析”框架，该框架可扩展以提供监控产品在供应链中移动时状况的能力。该项目名为“为全球环境构建射频识别”，并由欧盟部分资助。报告详细阐述了将传感器数据与\
  \ RFID/EPC 分析相融合的各种方法，无论是通过传感器启用标签，还是通过虚拟集成，即将环境传感器的传感器信息直接与物体在不同时间的已识别位置相关联 [31]。另一项研究阐述了物联网的指导原则及其对供应链运营效率大数据分析的影响，特别是关于利用从互联智能产品获取的大数据进行运营协调动力学和供应链优化，以及大数据披露的治理框架\
  \ [32]。\n\n#### 12.6.2 制造\n\n产品制造的基础是在要求的时间框架和预算内生产高质量产品的能力。所有有效的供应链都建立并定期审查其用于决定生产过程中每个阶段（从物料和人工到仓储和运输）的费用、价值、质量和周转时间的标准。制造业历史发展的四个阶段被称为工业\
  \ 1.0 到 4.0。每个阶段都是制造业的重大范式转移。借助蒸汽和水力，工业生产在工业 1.0 中首次引入。工业 2.0 的特点是大规模制造，得益于电力促进的劳动分工。为了进一步实现生产自动化，工业\
  \ 3.0 将电子技术、IT 和控制机制引入车间。在物联网的帮助下，工业 4.0 预示着一场前所未有的根本性变革，将对生产及其供应网络产生重大影响 [4]。云计算利用超强大的计算工具解决问题，并高效地促进人与物之间的无缝连接，以解决决策中的难题\
  \ [33]。根据对当前离散制造企业面临的车间管理需求增加的分析，建议了一个实现实时可访问性和透明度的框架 [34]。\n\n#### 12.6.3 交付\n\n\
  根据供应链管理专业人士委员会的定义，物流是“供应链流程的一部分，它规划、实施和控制货物、服务及相关信息从原点到消费点的高效、有效的正向和逆向流动与存储，以满足客户要求”。\n\
  \n在一项研究中，提出了一种面向未来仓库的方法，其中建议了一种基于 RFID 的库存管理系统，该系统包含自动存储和检索机制，使用 RFID 技术并可与基于 RFID\
  \ 的库存管理系统通信，无需人工干预 [35]。另一项研究支持利用 RFID 增强变化环境下分散仓库管理的灵活性 [29]。表 12.1 解释了基于 RFID\
  \ 系统的部署和为提高供应链有效性而开发的原型。大多数研究强调了库存管理和仓储。\n\n表 12.1 供应链流程与物联网的文献综述\n\n\n\n\n\n| References\
