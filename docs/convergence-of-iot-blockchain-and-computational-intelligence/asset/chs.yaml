  \n## 13 迈向自主车辆（无人机和机器人），利用基于混合本体的方法实现高效智能的服务交付\n\nNidhi, Jitender Kumar and Sofia\
  \ Sandhu\n\nDOI: [10.1201/9781003353034-13](https://doi.org/10.1201/9781003353034-13)\n\
  \n### 13.1 简介\n\n物流和运输行业在交付服务方面正经历着快速的增长与演变。随着电子商务行业和现代技术的出现，各组织的包裹交付量急剧增加。据估计，目前的包裹交付量预计到\
  \ 2026 年将增长至约 2620 亿件 [[1]](#chapter13.xhtml#ref13_1)。另一方面，这也提高了客户的期望，即以最低成本将包裹和订单送达家门口。这迫切要求优化并分担跨城市从一地到另一地的运输成本。在包裹被分拣并寄送给收件人之前，成本分担不会产生问题。但随着包裹越接近最终目的地，最初产生的运输成本会翻倍，这通常被称为*最后一公里挑战*。结果是，在包裹被客户收到之前，它成为成本最高、最复杂的交付阶段\
  \ [[2]](#chapter13.xhtml#ref13_2)。因此，电子商务企业开始调整其交付政策的效率，以便在竞争激烈的市场中以合理的价格生存下来。解决这一复杂交付流程的方案是采用自主交付技术，如无人机和基于机器人技术的系统。在这方面，这些自主车辆可以提供快速灵活的交付服务。此外，使用无人机和机器人进行物流还可以通过降低运输成本来减少最后一公里运输成本。新西兰的一些餐饮店已经开始使用机器人和无人机进行食品和医疗服务的交付\
  \ [[3]](#chapter13.xhtml#ref13_3)。无人驾驶飞行器（UAV）的使用在 COVID-19 大流行期间也被证明在提供非接触式交付方面高效，从而减轻了人与人之间病毒传播的风险。因此，在公共卫生危机期间，对非接触式交付模式的需求以及部署无人机特别是用于货物和药品交付的需求呈指数级增长。此外，无人机和机器人的使用还有助于减少因运输交付增加而导致的温室气体排放和全球变暖\
  \ [[4]](#chapter13.xhtml#ref13_4)。此外，基于无人机的交付还能减少高交通流量路线上的交通拥堵和事故数量 [[5]](#chapter13.xhtml#ref13_5)。通常，包括无人机和机器人在内的自主车辆按以下方式执行交付流程。一旦客户从在线平台或某个大型超市购买商品以进行家门口交付，就会分配一架无人机来取走订购的包裹。根据分配流程，根据目标目的地从机队中选择一架配备电池的自主无人机。分配后，会雇用一台机器人从相应商店取走包裹，并将其放在无人机区域以启动交付流程。包裹送达后，相应的无人机会移动到充电站或等待下一个交付请求。\n\
  \n\n\n\n#### 章节概述\n\n由于无人机受电池容量限制，飞行范围有限，因此必须部署充电站以增加飞行范围并加快交付流程 [6]。本章组织结构如下：\n\
  \n- 第 13.2 节 全面综述了利用无人机和基于机器人的物流进行配送服务的相关研究。\n- 第 13.3 节 讨论了使用自主地面车辆（AGV；机器人）和自主飞行器（AAV；无人机）进行配送流程所采用的方法论（单独使用及混合模式）。\n\
  - 第 13.4 节 分析了三种系统在时间间隔和等待时间方面的性能，依据的是在德里康诺特广场（CP）高峰时段记录的实时坐标。\n- 第 13.5 节 总结本章，并展望未来研究方向及参考文献。\n\
  \n### 13.2 无人机与机器人物流相关研究\n\n无人机与机器人物流领域的相关研究大致可分为四类：无人机车辆路径问题、特定无人机分配配送、充电站、车队规模确定。相关研究如下所述：\n\
  \nMurray 和 Chu [7] 针对无人机配送以最小化往返行程优化时间问题进行了研究。该方法基于混合线性规划处理旅行商问题，可最小化预期配送时间。此法被称为“卡车优先，无人机次之”，因为卡车路径旨在解决旅行商问题，而无人机可遵循并行调度。然而，该方法未考虑在交通拥堵区域可能行之有效的机器人应用。\n\
  \nJeon 等人 [8] 利用定位和数据追踪减少飞行次数来使用无人机。\n\nDorling 等人 [2] 通过提出算法优化无人机尺寸和配送趟次以优化配送时间和成本。作者假设无人机可完全充电，无需部署充电站，这导致了电池更换问题。\n\
  \nWang 及同事 [9, 10] 提出了“无人机车辆交通问题”，旨在最短时间内投递包裹。该方法结合卡车和无人机而非机器人和无人机，通过在最坏情况下模拟拥堵城市，确保降低配送时间成本。然而，作者未提出任何混合模式下的配送模型或机制，此问题将在后续章节中涉及。\n\
  \nSchermer 等人 [11] 在其研究中提出了启发式算法，用于解决车辆路径问题和无人机优化。该研究引入了机器人的基本概念，但非作为拾取配送包裹的工具。另一局限是配送流程缺乏混合模式。\n\
  \nHam [12] 在其研究中引入了配送优化调度，以克服拾取和配送流程中的延迟。\n\nWang 和 Sheu [13] 利用基于弧的方法和定价算法引入了路由和优化问题。此法优势在于可扩展至更大规模客户。\n\
  \nBertolaso 等人 [14] 引入了混合配送系统概念，即无人机与车辆的结合而非机器人。该方法未缓解因车辆过多导致路线交通拥堵的问题。\n\nGrippa\
  \ 等人 [15] 将请求分配给无人机以最大程度减少配送时间。针对无人机请求到达，该模型采用泊松分布和最短时间优先调度算法。\n\nYu 等人 [16] 解决了无人机充电站相关问题。作者提出了最优路径算法，使无人机无需反复充电即可访问多个地点。\n\
  \nShao 等人 [17] 提出了群体优化和时间调度方法用于无人机配送服务，包含充电和维护检查点，以最小化从拾取地点到目的地的配送时间。\n\nAlyassi\
  \ 等人 [18] 在个体层面采用机器人和无人机进行配送服务，并通过实证研究分析了配送性能。该研究同样缺失混合最后一公里配送方法。\n\nBaca 等人 [19]\
  \ 利用机器学习算法实现无人机在特定目的地露台着陆。作者未提供关于机器人作为配送代理的信息。\n\nFeng 等人 [20] 提出了利用滤波器和目标定位的自主着陆法，以高效投递包裹。\n\
  \nHoffmann 和 Prause [21] 探讨了无人机着陆相关法律问题，但未纳入真实案例研究以保证自主车辆在包裹配送服务中的效果。\n\nSunghun\
  \ 和 Hyunsu [22] 基于成本和硬件分析了无人机配送。尽管未引入任何混合配送模式以避开高拥堵区域交通。\n\nGoodchild 和 Toy [23]\
  \ 探讨了利用 UAV 减少温室气体排放的可能性。发现不同配送区域排放量各异。\n\nTroudi 等人 [24] 研究车辆路径问题以解决无人机配送服务的规模确定问题。提议方法采用两种策略：一是调度配送作业，二是维持无人机与车队规模间的平衡。\n\
  \n上述文献研究概览见 表 13.1。\n\n#### 表 13.1 无人机与机器人物流系统相关研究概览\n\n| 来源 | 解决的问题 | 使用的方法 | 假设/局限性\
