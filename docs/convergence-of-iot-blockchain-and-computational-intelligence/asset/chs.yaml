  \ Harsh Dubey and Yasir Usmani\n\nDOI: [10.1201/9781003353034-11](https://doi.org/10.1201/9781003353034-11)\n\
  \n### 11.1 简介\n\n如今，人们在日常生活中越来越追求自动化。令人惊讶的是，人们现在更有动力节约日常生活中使用的能源。他们在离开房间时不太可能关灯。因此，如果在无人情况下灯光仍处于**开启**状态，将浪费大量能源。大多数人通常对在离开时关闭风扇、灯光和其他办公设备等消费电子产品不感兴趣，尤其是在开放空间和私人办公室中。随着消费电子产品和家用电器使用频率的增加和规模的扩大，家庭电力消耗必然会上升。此外，在无人在场的公共场所和私人空间中，也会发生不合理的电力消耗。用机器人技术替代家庭照明系统将带来显著的节能效果，从而让房主省钱。人们目前正寻求机器人化来完成所有日常琐事。人们正在努力减少人力劳动。家庭照明系统的自动化替代显著减少了人力劳动。如果人们使用编程控制开关，离开房间前就无需费心去关灯。当风扇、灯光以及其他电器设备在无人迹象的情况下仍处于**开启**状态时，该机制也有助于减少因浪费电力而造成的电能损耗。红外（IR）传感器被用作人员识别的组件\
  \ [[1]](#chapter11.xhtml#ref11_1)。\n\n随着消费电子产品和家用电器使用频率的增加和规模的扩大，家庭部门的电力消耗必然会上升。此外，当无人在场时，公共场所和私人空间都会发生不必要的电力消耗。通过利用机器人技术替代家庭或办公室的照明系统，房主可以在显著减少用电量的同时节省开支。人们已经在期待日常生活中有更多的自动化。人们正在努力减少人力劳动。通过利用建议的框架，借助无源红外（PIR）传感器，电气设备将根据人员的在场情况自动**开启**或**关闭**，从而减少能源浪费。这消除了离开前关闭设备或到达住所时开启设备的必要性。预期结构基本上已通过这种方式得到改进。建议的结构由三个基本要素组成：Arduino、PIR\
  \ 传感器和继电器模块。该系统广泛使用了 PIR 传感器 [[2]](#chapter11.xhtml#ref11_2)，[[3]](#chapter11.xhtml#ref11_3)。\n\
  \n![图 11.1 Arduino UNO。](img/fig11_1.jpg)\n\n**图 11.1** Arduino UNO。\n\n\n\n\n\n\
  #### 物联网在水产养殖和智能系统中的未来\n\n物联网（IoT）作为一项快速扩展的技术，其未来是无限的，因为数据流随时间推移已翻倍增长。即将到来的业务将从云计算和大数据分析转移而来，这些技术主要由新冠疫情推动，已取代了更传统的数据处理方法。这种转变正在发生，因为世界各地的公司都在采用基于云的工作实践。\n\
  \n鱼类需要主人给予充分的关注和照料，因为它们被认为对周围环境相当敏感。由于人们经常忽略换水、喂鱼和检查 pH 值，物联网可以轻松解决这些问题，以及追踪数百条鱼等简单但具有挑战性的任务。对于中大型水族馆（如迪拜水族馆）而言，拥有一套物联网系统至关重要（可持续监控数百条鱼）。该系统可用于建立高产量所需的完美条件。鉴于全球鱼类短缺，水产养殖业在未来将对经济极为重要。必须简化流程，以提高效率并改善鱼类健康。基于物联网的水族馆通过开发具有实时数据处理能力的可靠系统，可以拯救海洋野生动物。在偏远地区，可以建造巨大的水箱来饲养濒危动物，从而促进生物多样性并创造健康的生态系统。由于在巨大水箱中监控大型鱼类可能具有挑战性，因此可以使用射频识别（RFID）和发射器等技术来监控它们\
  \ [4]。\n\n无论采用何种硬件和操作系统，各类智能设备都能相互通信，通过传感器收集的数据可存储在云平台中，并进行预测分析和替代性保存。基于物联网的水生监控系统可记录水族馆内的水位，当水位下降时，可向用户发送电子邮件\
  \ [5]。它确实能够控制自动喂食器，记录热力学和含湿量读数，并在亚马逊云服务（AWS）技术的帮助下开关水族馆照明。用户可以通过 Web/App 界面或语音应用程序操作喂食器。加热、湿度、水位、LED\
  \ 状况以及喂食器的其他信息是该项目采用的参数。`ESP-32` 执行传感器数据采集，并充当本地服务器、控制器以及数据处理设备。只要有互联网连接，由于数据处理由\
  \ `AWS Lambda` 完成，并记录在 `DynamoDB` 中，且通过 AWS 应用程序编程接口（API）提供服务，用户几乎可以在世界任何地方的本地或远程位置监控水族馆状况。为了有效决策，使用\
  \ `Quick Sight` 和 `AWS IoT Analytics` 对数据进行进一步可视化。该模型的所有功能均平稳运行且准确度极高。该项目有许多工业应用，包括养鱼、鱼类管理、水产种植和动物园饲养管理。知识被保存下来供进一步研究，并可用于完成相关任务。它们对于维持生态平衡以及饲养特定鱼类的农民非常有帮助\
  \ [6]。\n\n### 11.2 文献综述\n\n该项目的最终目标是使用 `ESP32` 为电器供电。通过使用智能手机，人们可以通过使我们的工作场所更加豪华和智能，无论是否有互联网连接都能进行控制。为了利用我们的移动设备控制照明、风扇等物联网移动应用来操作电气设备，设计了一种新方法。对于那些需要使家庭更智能的人来说，它提供了一种更容易集成且成本更低的替代方案。所需创建的开关是一种模块化的即插即用开关。继电器、MCB、LED\
  \ 指示灯和双控开关都是开关面板的组成部分。通过内置 Wi-Fi 和蓝牙的 `ESP32`，移动设备连接到开关，使我们能够在有或没有互联网连接的情况下操作电器。本研究还提出了基于\
  \ RFID 的自动房间灯光控制器概念 [7]。物联网是指一种将数十亿实际物理对象连接到互联网的技术。自动化是已在许多应用领域普及的尖端技术之一。本研究包含了作为其组成部分之一的开关自动化系统的规划与实施摘要。一个简单直接的\
  \ GUI 程序可用于智能操作模式，能快速简便地控制指令，以开关家用电器（如照明和风扇），这些被称为控制输入。我们日常活动和使用的设备很大一部分依赖于 Wi-Fi，这无疑是过去\
  \ 10 年最有益的技术发展之一。Wi-Fi 兼容智能手机、笔记本电脑和计算机。这些设备具备连接 Wi-Fi 网络以执行特定活动的能力 [8]。\n\n为了解决传统照明控制系统功能单一、自动化程度低、管理效率低的缺点，本研究开发并部署了一种智能访客房间照明控制系统，该系统协调手动和自动管家照明控制。该系统采用多层分布式拓扑，融合了\
  \ CAN 总线、网络、传感器和嵌入式技术。其关键组件是集成 ARM CPU，它结合多个模块，通过 CAN 总线通信协议实现客房智能照明控制。本章对硬件、软件和总体结构设计进行了彻底的检查和论证。为了强化管理标准和服务质量、降低能耗、提高酒店竞争力，智能酒店客房照明控制系统与高星级酒店竞争。它将成为先进酒店系统的关键组成部分，并具有特定的使用价值\
  \ [9]。\n\n本章描述了将智能家居（SH）照明系统设置为恒定照度水平时，其调光行为的验证情况。建议的测量技术作为分析日光诱导室内照度曲线的一种改进而实施。在智能家居的参考室中进行了测量，采用的技术评估视觉任务位置的照度，同时扫描室外开放水平面上日光引起的照度。所用测量仪器配备了可调光人工照明系统，该系统结合\
  \ KNX 控制系统，使用安装在房间天花板上的亮度控制器，尽管同时利用人工和自然光源，仍能维持恒定照度水平。本章表明，由 KNX 系统控制的照度设定值与视觉任务位置的实际照度之间可能存在差异。这种差异可能导致发光装置达不到规范标准，这是完全不可接受的\
  \ [10]。\n\n\n\n\n\n#### 智能房间控制系统综述\n\n##### 自主环境控制系统设计\n\n本章介绍了控制室条件自主构制的规划与开发。根据工作站的适宜温度，灯光和风扇将在室内有人时自动开启。若室内无人，则灯光和风扇不会开启。本研究采用`PIR`传感器和`LM35`作为输入，并创建了一个基于`FPGA`的组件。由于该设计仅利用了`FPGA`的一个切片，因此该组件的`IP`核已准备好进行制造。促进人类舒适度的关键因素之一是自动化；一种能自动执行任务的技术能让人感到舒适，并消除了体力劳动的需求。除了简单易用外，它对用户还有积极影响，包括显著降低能源消耗，因为每项任务均由机器通过精准编程执行[11]。\n\
  \n##### 基于微控制器的智能照明系统\n\n随着科技领域技术增长的加速，日常生活中的所有活动和物品都无法完全脱离技术。旧系统因此被全新系统取代。现已适用于环境各个部分的微控制器技术是一项热门发展趋势。国家电力公司（`PLN`）将通过创建一种能在房间内节约电力的自主照明设计，减少总体用电量。在该原型方法中，`Arduino\
  \ UNO`微控制器作为传感器的控制中枢，并集成了用于人体运动检测的`PIR`传感器。此外，除`PIR`传感器（称为闪光感应元件）外，还有一个称为`LDR`的光敏电阻传感器。其目的是确定房间所需的光照量，从而根据该光照量使用受控照明。系统中还包含一个`GSM\
  \ Sim 900A`模块，作为在电力用于传感器控制器以外场所时的通知系统[12, 13]。\n\n##### 基于可再生能源的智能教室自动化\n\n由于房间用电需求的增加，智能房间采用电力生成管理和环保发电，实现对各类房间设备的自主控制与监控。智能房间是在明智用电的前提下为用户提供高舒适度的房间。本章提出了一种自动化教室方案，兼顾学生舒适度与太阳能这一可再生能源。为实现教室设备（照明、风扇、空调`AC`、投影仪）的自动管理与监控，采用了`WAGO`可编程逻辑控制器（`PLC`）。此外，为采集传感器数据并根据`WAGO\
  \ PLC`输入产生输出，`Arduino UNO`被用作数据采集设备。通过`PLC`以太网网关，可在智能手机上通过`Wi-Fi`实时无线监控多个输入传感器和电气设备[14,\
  \ 15]。仅当`PIR`传感器检测到有人时，教室电器才会开启以创造可用环境。室内自动化系统由传感器（温度、光照、`PIR`）、`Arduino UNO`、太阳能充电控制器、`WAGO\
  \ PLC`、光伏面板和`Wi-Fi`路由器组成[16–18]。\n\n##### 基于物联网的办公环境监控系统\n\n随着工作人员在办公室停留时间增加及舒适度要求提高，办公环境被改造为支持对多参数的智能控制与监控。本文描述了一种基于`Thingspeak`云平台和`ARM`控制器的物联网系统。该系统提供了一种远程监控灵活工作空间机械设备（如照明、`AC`、风扇）的方法，同时兼顾用户舒适度。还可通过互联网监控和分析多种办公空间指标，包括温度、光照量、连接负载、用能量、电压和电流使用量。除非`PIR`传感器检测到有人，否则电器不会启动。分别利用光照传感器和温度传感器，维护并监控可行的室内环境，包括光照强度和室温。基于物联网的室内自动化系统由传感器（光照和温度）、多功能电能表、`ARM`控制器板、`ESP8266\
  \ Wi-Fi`模块和`Wi-Fi`路由器组成[19, 20]。\n\n##### 智能照明与空调风扇集成控制\n\n本章讨论了房间照明、空调和吊扇智能控制方案的开发与实施。该系统正确考量用户需求，创造安全空间。开发了一款具有直观图形用户界面的`Android`应用程序，可与智能控制系统进行简单交互。该程序响应迅速，因其通过云网络和`Wi-Fi`连接控制设备[21,\
  \ 22]。`RGB LED`面板照明技术的设计考虑了场景需求和照明设置，可控制亮度、色彩和色温。尽管`RGB LED`面板灯广泛可用，但缺乏基于活动的颜色模式标准化解决方案。创建了一套控制`IR`远程模块的系统，允许用户通过智能手机应用发送指令控制变频式空调。运行空调系统时，该技术综合考量用户偏好平均值及多人意见。同一地点的多用户通过应用提供的信息选择空调运行模式[23,\
  \ 24]。风扇不像变频空调那样持续调节温度。为解决此问题，创建了手动和自动吊扇控制系统。自动模式采用与用户皮肤湿度相关的混合系统控制室温。正如空调系统一样，手动模式依据群体情感建议运行。控制系统使用传统遥控器控制空调和吊扇，依赖群体情感[25–27]。\n\
  \n##### 基于传感器的节能控制策略\n\n本章旨在展示如何消除不必要的电力浪费。通常，人员离开房间时可能忘记关灯关扇。尽管我们可能未察觉，但这造成了大量电力浪费。一种能检测人员存在并采取相应动作的控制器将减少用电量，可安装于家庭、学校、工作场所等。使用`IR`传感器、`PIR`传感器和`Arduino`板监控室内人员存在情况。因此，理想情况下灯光和风扇应在房间空置时关闭、有人进入时开启，并在无人时自动关闭。控制电力浪费和提高生活质量是该项目的主要目标[27–30]。\n\
  \n\n\n\n人类通常通过视觉感知接收世界的大部分信息。因此，光线是使个体能够识别周围环境的尺寸、色调和视角的关键因素。此外，假设建筑物占全球总能耗的 40%\
  \ 左右，住房能源效率是一个正在积极研究的问题。另外，据估计，照明消耗了家庭总能耗的 20%，以及商店和办公室等商业场所 40% 到 70% 的能耗。本研究提供了一种模糊逻辑控制器，能有效利用自然光和人造光来保持会议室的视觉舒适度。为了评估所提控制系统的效果，生成的相关实际结果被呈现并进行了讨论\
  \ [31, 32]。\n\n名为 `Arduino UNO` 的微控制器板拥有 14 个数字输入和输出引脚，其中 6 个可用作 PWM 输出，其余 6 个作为简单的数据输入。板载还有一个复位按钮、一个\
  \ USB 接口、一个电源插座、一个 `ICSP` 排针和一个工作频率为 16 MHz 的晶振。配合电池或 DC 电源插头，或通过 USB 连接与 PC 连接，即包含了运行微控制器所需的一切。`Arduino\
  \ UNO` 和 `MEGA` 是两种最常用的二手 Arduino 开发板，虽然还有其他几种类型。这两者的唯一区别在于引脚的输入输出数量，`Arduino MEGA`\
  \ 比 `Arduino UNO` 多出九个。像任何微控制器一样，Arduino 是一小块微型印刷电路板，上面包含一块可编程芯片，能够执行各种任务。数据从个人电脑上运行的软件传输到\
  \ Arduino 微控制器。然后 Arduino 微控制器将数据传输到相应的电路或机器（可能包含多个电路），以执行精确指令 [19, 33]。这是 Arduino\
  \ 除其他用途外，如今在微控制器编程中常用的方式。据 Yusuf Abdullahi Badamas 称，Arduino 可向 `LED`、扬声器、`LCD`\
  \ 屏幕和直流电机等输出设备传送数据，并协助处理来自传感器、无线电天线和调节电位器等输入设备的数据。Tiffany Tang 称，也有将 Arduino 与 `Kinect`\
  \ 集成以控制运动的研究，Shamsul Aizal Zulkifli、Mohd Najib Russin 和 Tiffany Tang 称，Arduino 也可用作三相逆变器的微控制器。这展示了\
  \ Arduino 的广泛用途，在本任务中，Arduino 将用于管理从 pH 传感器获取的数据，然后再传输到手机 [34, 35]。水虹吸泵和发动机也将使用\
  \ Arduino 启动。`Arduino UNO` 开发板 10 如 图 11.2 所示。\n\n![图 11.2 Arduino UNO 开发板引脚索引。](img/fig11_2.jpg)\n\
  \n图 11.2 Arduino UNO 开发板引脚索引。\n\n目前，智能家居自动化系统需求极高。这些系统使用户能够简单快捷地从任何地方使用家用电器。在本章中，我们介绍了一种基于\
  \ `IoT` 的 `SH` 安全系统。智能锁具机制用于提供家庭安全。每当用户或访客在电子锁中输入密码时，他们的面部会被拍照并作为消息发送给房主。如果用户连续三次尝试均失败，则检测到入侵。房主将根据获取的信息决定是否允许用户或客人进入房屋\
  \ [36–38]。`SHs` 配备了传感器、有线和无线网络、执行器和智能系统等尖端技术。自 1990 年代初以来，智能家居的概念已迅速发展。然而，尽管许多人认为\
  \ `SHs` 是“未来生活”的一部分，但其普及度仍然很低，二十多年来并未广泛普及。通过为建筑师、设计师和规划师提供关于 `SH`、其技术、目标、问题和障碍的全面概述，以及如何克服它们的建议和对我们未来生活方式的潜在影响，本章旨在弥合计算机、建筑和医疗保健领域之间的知识鸿沟\
  \ [39]。\n\n智能房屋是智慧城市的基石。由于我们的住宅和公寓是基础设施的基本构建单元，所有与基础设施相关的问题都必须通过引导人们走向更智能住房的规范来解决。此外，这些标准还应指导我们实现高效的水和废物管理、绿色建筑，以及安全健康的生活环境。本研究展示了各种智慧城市基础设施项目如何与建筑和工程领域紧密相关，以及国家和市政层面对强有力的智慧城市专用建筑规范的需求\
  \ [40]。\n\n### 11.3 IoT 组件\n\n设备、网关和云是 `IoT` 的三个基本组件，如 图 11.2 所示。执行器、用户界面组件和传感器都是设备的例子。这些设备拥有使用互联网所需的硬件和软件。为了做出适当的反应，设备之间或与控制单元进行通信。网关将设备连接到互联网以访问云服务。此外，它还提供设备安全功能并提供完整的数据安全。为完成给定任务，每个设备的数据被传输到云端，经过处理并与其他设备的数据结合\
  \ [14]。\n\n### 11.4 基于 IoT 的房间自动化架构\n\n得益于基于 `IoT` 的房间自动化架构，网络、通信、设备管理和数据分析均可定制。智能房间自动化系统的架构已在\
  \ 图 11.3 中表示。物理层、数据链路层、中间件层和应用层是整体智能房间架构的组成部分。物理层包括用于在网络上生成、接收或检索信息的物理节点，以及设备节点，如家用电器、传感器和执行器。数据链路层将提供应用层与物理层之间的交互。除了计算分析外，数据还将被存储、恢复、处理和登记。中间件提供多种通信协议，使应用程序和数据链路层能够通信。基于家庭通信网络，应用软件层负责为用户提供控制功能和监控模块\
  \ [13, 15]。基于 `IoT` 技术，文献 [16] 中提出了一种将家用设备纳入智能系统的 `SH` 系统架构。\n\n![图 11.3 基于 IoT\
  \ 的房间自动化架构。](img/fig11_3.jpg)\n\n图 11.3 基于 IoT 的房间自动化架构。\n\n### 11.5 拟议电路描述\n\n\n\
  \n灯光的功率将取决于推荐的家庭照明控制器节能方案中每个房间的人数[3]。建议的配置分为三个不同部分：用于预编程交换的继电器系统、带有 PIR 传感器的人体指示装置，以及用于操作整个系统的微处理器电路。对于实际电流读取，Arduino\
  \ 首先接收电源电流，随后接收多个连接组件的电源指示，然后等待来自几个输入组件（具体为接近传感器和 PIR 传感器）的命令。如果房间亮度降低，将会有电流流动或光传感器处于`HIGH`状态，并将额外指令重定向至输出结果；然而，在电流停止流动之前，指令不会被发送。当具有`HIGH`值的输入或电流传输指令时，为了开启灯光，Arduino\
  \ 会导航至下一个输出，将从继电器读取的`LOW`值转换为`HIGH`值。灯光刚开启后，Arduino 执行下一条命令，即让电流流动以便被 GSM Sim 900A\
  \ 模块读取。这使得 Arduino 能发送短信通知用户灯光已开启。一旦灯光关闭，将发送短信告知您灯光已关闭。PIR 传感器和光传感器作为输入设备，产生由 Arduino\
  \ UNO 微控制器处理的输出值。Arduino IDE 软件中的所有已安装程序（包括输入和输出程序）均在 Arduino UNO 平台上运行。由 SIM 模块\
  \ 900A 程序生成一条简短消息通知，指示灯光是开启还是关闭，该程序充当消息数据处理介质。光控制器由电磁板制成，继电器模块控制照明，无论是否有电流流动均可工作。\n\
  \n### 11.6 PIR 传感器与继电器模块\n\nPIR 传感器似乎比大量不同的传感器（光敏电阻、倾斜开关和 FSR 等组件）更令人困惑，因为有不同因素影响传感器的输入和输出。首先阐明基本传感器的工作原理。PIR\
  \ 传感器的每个孔径均由对红外光敏感的特殊物质构成，且 PIR 传感器本身有两个开口。当传感器处于非激活状态时，两个孔径识别到的红外辐射量相同，该辐射总量源自房间、隔墙或室外。当人或动物等热源靠近传感器时，它首先遮挡\
  \ PIR 传感器的一部分，导致两部分之间产生正向差分变化。相反，当热源离开检测区域时，会产生负向差分变化。这些交替的脉冲使得模式具有可识别性。图 11.4 展示了\
  \ PIR 传感器的说明。\n\n![FIGURE 11.4 PIR sensor.](img/fig11_4.jpg)\n\n图 11.4 PIR 传感器。\n\
  \n#### 11.6.1 系统工作原理\n\n此处解释了该系统工作的基本步骤。当没有人体活动时，PIR 传感器最初无法识别任何人员，且其 OUT 引脚保持低电平。当有人靠近该区域时，PIR\
  \ 传感器检测到区域内的红外变化。因此，PIR 传感器输出`HIGH`结果。由于 Arduino 的数字引脚 8 连接到 PIR 传感器的数据输出端，每当其变为`HIGH`时，Arduino\
  \ 将通过使继电器引脚变为`LOW`来启动继电器（因为继电器模块是低电平触发模块）。灯光现在将开启。只要传感器前有人体活动，灯光就会保持开启。如果人员离开，红外辐射强度将恒定（不再发生变化），结果\
  \ PIR 传感器的输出数据将下降。房间灯光随即关闭，Arduino 通过将继电器引脚设为`HIGH`来关闭继电器。\n\n#### 11.6.2 电路图\n\n\
  当 PIR 传感器感应到人体活动时，输出引脚变为`HIGH`，向三极管基极施加触发电压使其导通，电流开始在线圈中流动。继电器线圈产生的电磁场使得更大的电流（220V\
  \ 交流电）得以通过，从而点亮灯泡。通过安装 PIR 传感器，您可以延长或缩短灯光开启的时间。因此，PIR 传感器返回`HIGH`结果。由于 Arduino 的数字引脚\
  \ 8 连接到 PIR 传感器的数据输出端，每当该引脚为`HIGH`时，Arduino 将通过将继电器引脚设为`LOW`来实施继电器动作（因为继电器模块是低电平触发模块）。灯光现在将开启。只要传感器前有人体活动，灯光就会保持开启。如果人员入睡或离开房间，红外辐射将趋于稳定（不再发生变化），这将导致\
  \ PIR 传感器的数据输出下降。结果，Arduino 将关闭继电器（使继电器引脚变为`HIGH`）并关闭房间灯光。Arduino 与 PIR 协同工作如图 11.5\
  \ 所示。\n\n![FIGURE 11.5 Ardiuno working with PIR.](img/fig11_5.jpg)\n\n图 11.5 Arduino\
  \ 与 PIR 协同工作。\n\n### 11.7 结果\n\n建议的方法已付诸实践，并使用 Thingspeak 云通道监控实时数据。对于办公室自动化，一旦经过预编程的设定值（本例中为\
  \ 3 分钟），若 PIR 传感器未检测到任何占用迹象，所有设备将自动关闭；如果空间任何部分有占用迹象，灯光、风扇和空调将开启。构建的系统以固定采样间隔将实时收集的数据传输到\
  \ Thingspeak 云通道。\n\n### 11.8 结论\n\n\n\n建议的框架使我们推断出存在一种通过众多装置控制室内照明的程序。如今，大量能源仅在我们的日常生活中就被浪费了。借助该系统，可以防止能源浪费，从而实现显著的能源节约。该框架的绝对可行成本非常低。拥有充足的照明对于创造理想的工作条件至关重要。建筑内部能源使用的优化是另一个重要因素，主要是因为当前的能源相关法规。为实现这一目标，需要将最大化自然采光的建筑结构设计进步与合适的控制策略相结合。本章的主要目标是设计一个系统，在会议室内对其进行验证，并允许保持视觉舒适条件。更具体地说，该系统已在一座生物气候建筑的会议室内接受了严格测试。这些早期发现表明，该建议结构现在被认为能成功维持所需的视觉舒适水平，同时还能减少智能住宅（SHs）中人工照明的使用。未来的工作将涉及在各个季节对建议的控制架构进行实际测试，并将其与其他已在使用的控制策略进行比较。在确定\
  \ DGI 指数时，也将考虑其他眩光评价指数。系统的实际配置将被更改，以实现对房间各个区域的分布式控制。最后但同样重要的是，它将被纳入一个多目标优化问题中，该问题将实现对智能城市智能住宅（SHs）中热、视觉和空气质量的高效用户舒适度控制。\n\
  \n### 11.9 未来展望\n\n所提框架的判断依据是人员是否在场，但为了使其表现更好，除了 `PIR` 传感器外，我们还可以通过 `LDR`（光敏电阻）进行通信。该系统还可以与蓝牙模块交互，允许通过移动设备简单地一键控制整个系统。\n\
  \n1.  该框架完全可以用于教室、学校等场所。\n\n2.  该框架也可用于家庭的浴室、楼梯间和其他区域。\n\n这些是开发单元的主要特征，使其区别于竞争对手的智能自动化设备。采用基于无线通信的技术，如\
  \ `RF` 通信和云组网，以及 `Wi-Fi` 用于设备间的连接，这取代了有线通信，从而节省了成本。由于利用了云网络，自动化系统可以从世界任何地点进行观测。此外，通过利用\
  \ `WiGig`、`Zigbee` 和 `LoRa` 等技术，该技术可以更高效、更低成本地创建。基于活动的色彩模式 `LED` 照明和调光系统的设计与实现是该系统的另一项成就。这对于家庭和许多其他使用人工照明的领域（如农业）都很重要。由于色彩的舒缓作用，它降低了能源使用。有许多方法可以提高农业和工业部门的生产力。因此，这对农业、旅游、住宿和住宅开发等行业具有商业价值。利用现代技术并通过实验证明所提供颜色的准确性，可以提高\
  \ `LED` 照明系统的输出质量。通过在门、窗等战略位置增加几个光传感器，可以提高调光系统的效率。为了满足所有人，吊扇和空调控制系统被设计为根据人员偏好用于人群密集区域。由于它根据一个地点所有用户的建议运行，该系统将会成功。由于吊扇控制系统根据用户的皮肤湿度进行自动化，这对皮肤健康至关重要。本研究使用不同的传感器测量皮肤水分含量。然而，建议理想的做法是创建一个计算机化系统，能够从智能戒指、智能手表或健身手环中收集信息，这些设备均包含皮肤水分检测传感器。根据客户的皮肤状况，它可以直接向自动化系统提供正确数据。有人建议，如果测试能制造出一种床单或毯子，使其能够收集皮肤水分数据，则可为那些不愿使用智能手表、智能手环及其他物理设备的人提供替代方案。在本研究中，`QR`\
  \ 码与移动应用系统和自动化控制结合使用。当在讲堂等场所采用该自动化系统时，`QR` 码可添加在座椅背面，以便用户随时访问。通过利用 `NFC` 和 `RFID`\
  \ 等技术，这可以被改变。通过进行适当的调整，该想法也可以进一步修改。\n\n### 参考文献\n\n1.  网站 [`www.edgefx.in/automatic-room-light-controller-for-home-automation-applications`](https://www.edgefx.in)\n\
