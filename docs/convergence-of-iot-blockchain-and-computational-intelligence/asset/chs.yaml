  \ 端到端 | | 是 | | 是 | | 是 |\n| ART | 端到端 | 是 | | | 是 | | |\n\n由于传感器节点的操作系统寿命极短，大多数协议并不优先考虑节能。因此，在\
  \ WSN 中实现能源效率至关重要。\n\n### 14.5 结论\n\n本章研究了各种传输协议。同时，还针对实时应用对现有传输协议进行了对比。建议的传输协议旨在提供一个可靠的数据传输系统以及一个有效的拥塞控制系统。拥塞控制和可靠性问题无疑将有助于降低丢包率，从而使\
  \ WSN 上的整体系统更加节能。所提出的协议能够同时满足 WSN 上多媒体通信和 WSN 特性的要求。即将到来的 WSN 传输协议需要重点考虑的主要问题包括高带宽需求、能源效率、最小实时延迟、处理能力和有限内存。\n\
  \n### 14.6 未来展望\n\n建议的传输协议未来可用于网络模拟器 2（Network Simulator 2）以计算协议性能。MPEG-4 视频编码器可被用于通过\
  \ IEEE 802.15.4 网络发送数据。跨层优化算法可能是提高所提议传输协议效率的一个额外方面。跨层优化还有助于网络可信度和卓越性的提升。网络的不同层可以协作共享信息，这有助于保持低能耗。\n\
