  \ 上行 | / / 是 | / / 是 | 是 |\n| `GARUDA` | 数据包 | 逐跳 | 下行 | / 是 / | / / 是 | 否 |\n|\
  \ `PSFQ` | 数据包 | 逐跳 | 下行 | / 是 / 是 | / / 是 | 否 |\n| `STCP` | 事件数据包 | 端到端 | 上行 |\
  \ 是 / 是 / 是 | / / 是 | 否 |\n| `ESRT` | 事件 | 事件到汇聚 | 上行 | / / 是 | / / 是 | 是 |\n\n\n\
