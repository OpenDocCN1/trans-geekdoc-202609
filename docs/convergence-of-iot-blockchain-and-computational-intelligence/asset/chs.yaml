  \ 混合暴力破解攻击 | |\n| | * 反向暴力破解攻击 | |\n| | * 凭证填充 | |\n\n### 8.4 基于区块链技术的解决方案\n\n####\
  \ 8.4.1 区块链技术\n\n区块链是一种不可篡改的分布式账本技术，参与节点可以匿名写入对账本所有参与节点可见的交易 [[43]](#chapter8.xhtml#ref8_43)。开发区块链所需的基本要素如图\
  \ 8.6 所示。区块链的五个基本要素如下：\n\n![图 8.6 区块链的关键要素。](img/fig8_6.jpg)\n\n图 8.6 区块链的关键要素。\n\
  \n1.  去中心化点对点网络\n2.  分布式账本\n3.  密码学\n    1.  密码学哈希\n    2.  公钥密码学\n    3.  数字签名\n\
  4.  不可篡改性\n5.  代币化\n\n##### 8.4.1.1 去中心化点对点网络\n\n以一种方式连接的节点网络，其中每个节点可以直接与其相邻节点通信，而无需任何中央机构。在该系统中，单个节点在响应或请求网络服务时既可充当服务器也可充当客户端。区块链使用去中心化网络，提供去中心化管理，与中心化网络相比，确保为每个节点提供更优质、更公平、更平等的服务。去中心化提高了网络的通信能力和稳定性。然而，交易速率较低\
  \ [[44]](#chapter8.xhtml#ref8_44)。去中心化网络的一些优势如下：\n\n*   它提供了一个无需信任的环境，节点不需要相互熟悉；每个节点在其本地系统中维护一份信息副本，如果它们试图修改该副本，修改将反映在其他连接的节点上，并根据大多数节点对信息的验证投票和对修改信息的验证而被拒绝。\n\
  *   数据在运行时在节点之间共享并实时更新，可被网络上的共享节点查看，因此如果任何节点有意或无意地进行更改，其他节点可以识别并有选项进行纠正。\n*   去中心化消除了单点故障和腐败，并提供容错的分布式资源。\n\
  \n##### 8.4.1.2 分布式账本\n\n一种与去中心化点对点网络系统中连接的所有节点同步共享的数据库。账本在网络上公开可用，提供了对网络上所有交易处理的可见性。每个节点可以拥有同一份同步账本的副本，意味着每次更新都会反映给所有人。分布式账本解决了中心化机构控制账本的问题，并防止腐败、网络攻击、欺诈以及单点故障\
  \ [[45]](#chapter8.xhtml#ref8_45)。与中心化账本相比，分布式账本的一些优势如下：\n\n*   这确保了账本免受单个节点对任何交易的篡改；如果发生篡改，其他节点也会知情，大多数节点可以在不影响整个网络的情况下移除损坏的节点。\n\
  *   由于分布式账本不需要中心化机构来处理交易，处理交易的成本非常低，速度高且效率极高。交易处理是自动化的，使其全天候 (24/7) 功能正常。\n*   在分布式账本中，由于信息流动，网络审计变得容易；如果审计报告有任何错误，其他节点可以提出异议。这有助于防止审计员的欺诈或恶意行为。\n\
  *   它提供了针对记录丢失的容错能力，因为每个节点都有相同的副本。\n\n在区块链中，分布式账本包含网络上所有连接节点的 IP 地址哈希值，以保护用户隐私。账本不存储原始数据，而是存储数据的哈希值，从而提供安全性和隐私。\n\
  \n##### 8.4.1.3 密码学\n\n\n\n\n###### 在区块链中，加密协议确保用户和数据的安全性与隐私\n\n这些加密协议的主要目标基于 CIA\
  \ 三要素，即区块链中为用户提供的机密性、完整性和可用性。在密码学过程中，加密和解密函数发挥着关键作用。将明文转换为密文的过程称为加密，解密则是指从密文中恢复明文。以下加密工具用于在区块链网络中实现高级别的安全性和隐私\
  \ [46]。\n\n##### 8.4.1.3.1 加密哈希\n\n加密哈希函数可以接收任意大小的数据并生成固定长度的输出（区块链的情况下为 259 位）。它是单向函数，意味着数据被转换为哈希值，但无法从该哈希值反向生成数据。加密哈希函数具有以下特性，使其在区块链中非常有用：\n\
  \n1.  **抗碰撞性：** 该特性表明两个不同的值永远不会具有相同的哈希值，即若 `X` 和 `Y` 满足 `X != Y`，则 `H(X) != H(Y)`。但一些旧的哈希算法如\
  \ `MD5` 已被发现容易受到碰撞攻击。在区块链中，使用安全哈希算法 `SHA-265`。\n\n2.  **隐藏性：** 哈希是单向函数，意味着无法从哈希码生成原始消息。这是通过使用一个从高平均熵概率分布中选取的秘密值\
  \ `S` 来实现的，使得 `H(S||X)` 无法由此反推出 `X`。\n\n3.  **谜题友好性：** 该特性表明，对于值 `Y` 的每个 n 位输出，如果\
  \ `k` 从高最小熵中选取，则无法在显著少于 `2^n` 的时间内找到输入值 `x` 使得 `H(k ‖ x) = Y`。\n\n区块链中哈希函数的用途可分为六大类，例如共识（工作量证明），其中使用了谜题友好性。第二类是地址生成，第三类是生成前一区块的哈希并将其添加到默克尔树中。第四类是消息摘要签名，第五类是伪随机数生成器，最后一类是钱包哈希函数。\n\
  \n##### 8.4.1.3.2 公钥密码学\n\n密码学分为两大类。\n\n1.  **对称加密：** 加密和解密过程使用相同的密钥。\n\n2.  **非对称加密：**\
  \ 加密和解密过程使用不同的密钥，也称为公钥密码学。\n\n如今对称密钥加密协议较为薄弱，因此区块链采用公钥密码学实现 [47]。公钥密码学具有以下特性：\n\n\
  *   密钥不同且无法相互推导，即 `k[1] != k[2]`\n*   发送方和接收方可在各自的系统上生成密钥对，并仅共享其公钥，但必须使用相同的公钥加密算法。\n\
  *   假设接收方的公钥 = `K[R (pub)]`，私钥 = `K[R (pri)]`，则公钥密码学的过程如 图 8.7 所示。\n\n![图 8.7 公钥密码学。](img/fig8_7.jpg)\n\
  \n图 8.7 公钥密码学。\n\n部分公钥密码体制包括 Rivest–Shamir–Adleman (RSA)、椭圆曲线密码学 (ECC)、Diffie-Hellman、El-Gamal。在首个推出的区块链中，使用了\
  \ ECC 为网络提供安全性和真实性。\n\n##### 8.4.1.3.3 数字签名\n\n这是在区块链中提供真实性的工具。数字签名对消息进行签名，并由相同的签名算法进行验证，以证明消息签名的真实性。它为消息提供完整性、认证和抗抵赖性。通过数字签名，签名者的个人身份无法被识别，而签名识别则由签名者的数字证书完成\
  \ [46]。该证书包含签名者的哈希形式信息。数字签名涉及以下三个主要过程：\n\n1.  **`(sk, pk) := generateKeys(keysize)`**\
  \ 通过此方法，用户生成一对密钥，其中 `sk` 需私密保存，因为它是用于签署消息的秘密密钥。而 `pk` 需公开声明，用于签名验证。\n\n2.  **`sig\
  \ := sign(sk, message)`** 在此过程中，签名者的秘密密钥 `sk` 和一条消息作为输入，生成签名后的消息作为输出。\n\n3.  **`isValid\
  \ := verify(pk, message, sig)`** 这是判断消息是否有效的过程。以 `pk`、`message` 和 `sig` 为输入，计算签名者的\
  \ `sk`。如果签名匹配，则有效，否则无效。\n\n存在不同类型的签名算法，如 RSA、ECDSA、EdDSA、EIGamal 签名和 Schnorr 签名。在区块链中，ECDSA\
  \ 用作交易通信时消息认证的证明。\n\n###### ECDSA\n\n首个区块链比特币使用 ECDSA 的 ECC 更标准版本 `secp256k1`，为消息提供\
  \ 128 位的安全性 [48]。ECDSA 的一些关键要素如下：\n\n*   秘密密钥：256 位\n*   公钥，压缩格式：257 位\n*   公钥，非压缩格式：512\
  \ 位\n*   待签名消息：256 位\n*   签名：512 位\n\n攻破 128 位的加密安全性非常困难，因为它需要执行大量数学运算并要求极高的计算能力。大多数加密算法需要数年才会被破解。此外，这采用了陷门协议，意味着私钥永远无法通过公钥恢复。\n\
  \n##### 8.4.1.4 不可篡改性\n\n当交易数据经过共识并完成足够工作量被添加到区块中时，该数据即具有不可篡改性。此过程基于计算共识以将区块添加到区块链所消耗的能量。每添加一个新区块，计算复杂度都会随链上每个新区块的增加而增加，因此能量消耗也随之增加。随着计算复杂度的增加，不可篡改性也随之增强，因此链上最新的区块比第一个区块具有更高的不可篡改性\
  \ [49]。\n\n不可篡改性基于区块链中使用的加密算法和哈希过程，即\n\n> **不可篡改性 = 区块链哈希过程 + 密码学。**\n\n> **这种不可篡改性在区块链中是如何实现的，如下所示：**\n\
  \n链上的每笔交易在添加到链时都会被验证并加上时间戳，这些信息被写入相关区块；区块的所有信息（包括时间戳）都由哈希函数进行哈希处理并添加到下一个区块中。此过程像树一样执行，这棵树的根位于最新区块中，该树称为默克尔树\
  \ [50]。将前序区块哈希添加到后续区块的过程依次应用于所有区块，从而形成一条不可篡改的链，因为如果任何区块发生变更，所有哈希值都会改变，导致区块链失效。图\
  \ 8.8 展示了默克尔树的示例。\n\n![图 8.8 默克尔树。](img/fig8_8.jpg)\n\n图 8.8 默克尔树。\n\n##### 8.4.1.5\
  \ 代币化\n\n\n\n\n\n###### 区块链的代币化过程\n\n任何区块链的代币化过程都是创建资产或部分资产所有权的数字化权利形式，以转移所有权。它有助于将资产转换为可进一步流通的代币。在比特币区块链中，这种代币通常被称为加密货币（比特币）。创建代币有两种基本方式：第一种是使用\
  \ UTXO（未花费交易输出）进行进一步交易，另一种是基于账户的，即通过智能合约（区块链中各方协议的自执行程序）将发送者钱包中的一定金额转移到接收者的钱包中 [51]。\n\
  \n区块链中存在以下类型的代币：\n\n*   **平台代币**：此类代币用于去中心化应用以治理其用户。\n*   **实用代币**：用于访问网络服务，如支付交易费和共识程序。\n\
  *   **同质化代币**：可复制的代币，不具有唯一性。\n*   **非同质化代币 (NFT)**：这些是现实世界的事物，如绘画、工具或任何单件产品，可进一步分割，用作代币。\n\
  \n#### 8.4.2 区块链的基本架构\n\n> **定义**：一种分布式账本系统的去中心化点对点网络，其中连接的节点可以写入交易以保持其匿名性。\n\n\
  简单区块链（比特币）的结构如 图 8.9 所示。\n\n![图 8.9 区块链架构](img/fig8_9.jpg)\n\n图 8.9 区块链架构。\n\n以下是单个区块的组成元素：\n\
  \n*   **版本**：指示网络中存在的区块链版本。此字段在区块中的大小仅为 4 字节。它还有助于检测降级的硬件和软件，防止其在网络中被攻破。\n*   **时间戳**：也占用\
  \ 4 字节；这对每个区块都是唯一的，用于区块的验证和确认时刻。\n*   **前一区块的哈希值**：在区块内占用 32 字节。这是区块链中最关键和主要的元素，以哈希形式存储前一笔交易的信息。\n\
  *   **梅克尔根**：它位于由存储所有前序交易哈希值生成的树的顶端。它为交易提供完整性，并使区块链不可篡改。\n*   **Nonce（随机数）**：这是一个\
  \ 4 字节的字段，包含由矿工操纵的随机数字以验证区块。也用于对区块的值进行哈希运算。\n\n#### 8.4.3 物联网基础设施中的区块链\n\n物联网基础设施由传感器和硬件设备组成，具有\
  \ 图 8.9 中讨论的不同层。从物联网基础设施的层级来看，最底层是感知层，感知设备部署于此以收集数据并发送到网络层的上层。网络层定义设备如何相互连接以及使用何种协议在节点间建立通信。该层是数据存储与中间件层中管理的其他协议之间的桥梁，Web\
  \ 工具或应用程序、数据库和云存储的应用程序编程接口 (API) 位于此层。安全协议在此层实施以防止数据丢失。该层中的数据被发送到应用层进行进一步处理。在应用层中，有不同类型的应用程序根据需求使用这些数据。这些应用程序运行在机器学习或深度学习等先进技术上，以分析并为应用程序用户提供最佳结果。\n\
  \n以下是一个案例研究，展示区块链技术和其他工具如何用于保护智慧城市中的物联网基础设施。\n\n#### 8.4.4 智慧城市的传统架构\n\n从 图 8.10\
  \ 和 图 8.11 可以看出，智慧城市中物联网的架构基于 图 8.9 中表示的层级，而在 图 8.12 中表示了云存储实体。以下攻击和漏洞可能发生在这种依赖云中心存储和管理的架构上。这些攻击可以根据区块链的特性进行分类，如\
  \ 表 8.3 所列，简要说明了区块链如何防御这些攻击。\n\n![图 8.10 物联网基础设施中的层级](img/fig8_10.jpg)\n\n图 8.10\
  \ 物联网基础设施中的层级。\n\n![图 8.11 智慧城市的物联网基础设施](img/fig8_11.jpg)\n\n图 8.11 智慧城市的物联网基础设施。\n\
  \n![图 8.12 智慧城市物联网基础设施中的云存储实体](img/fig8_12.jpg)\n\n图 8.12 智慧城市物联网基础设施中的云存储实体。\n\n\
  表 8.3 利用区块链技术对物联网基础设施攻击的对抗措施\n\n| 攻击类型 | 利用区块链进行防范 |\n| :--- | :--- |\n| 隐私攻击 |\
  \ 此攻击针对网络上的用户数据；然而，区块链使用 `SHA-256` 对用户的所有个人信息进行哈希处理，保护其匿名性。 |\n| 时序攻击 | 此攻击针对认证协议。由于\
  \ `ECDSA` 不易被破解，因此此攻击对区块链网络无效。 |\n| 硬件故障注入 | 如果任何设备受到此攻击并表现出恶意行为，则该设备将不再是网络的一部分。\
  \ |\n| 功耗分析 | 由于设备访问由区块链网络认证，此攻击无效。 |\n| 物理攻击 | 如果任何设备表现恶意或不遵循区块链共识，则不再是网络的一部分。因此，即使有人通过物理攻击控制了某设备，该设备在被攻破后也无法在网络上保持活跃。\
  \ |\n| 加密攻击 | `ECDSA` 密码协议拥有 128 位安全密钥，目前无法通过任何计算工具的密码分析轻易破解。 |\n| DDoS 攻击 | 由于网络是去中心化和分布式的，攻击对整个网络无效，且存在大量连接节点可在受攻击节点之外为客户端节点提供数据。\
  \ |\n| 固件劫持 | 根据区块中的版本，所有节点都必须更新至网络中所有人使用的最新软件版本。这可防止区块链网络遭受此攻击。因为如果任何节点没有最新版本的网络，它将不被视为网络的一部分并被抛弃。\
  \ |\n| 僵尸网络 | 由于 `ECDSA` 密码协议拥有目前无法通过任何计算工具轻易破解的 128 位安全密钥，因此在区块链中很难攻破任何设备。 |\n\
  | 中间人攻击 (MIMT) | 由于通信通道使用 `ECDSA` 加密，提供了免受网络监控的安全性，且发送方数据上的签名提供了传输过程中的完整性，防止被篡改。\
  \ |\n| 勒索软件攻击 | 由于分布式系统，数据或哈希数据的账本被复制到所有连接到网络的设备上。因此，任何系统若遭受勒索软件攻击被加密，所有数据都可以非常容易地从网络中的任何其他设备恢复。\
  \ |\n| 窃听攻击 | 此攻击无法生效，因为传输通道已加密且传输数据经数字签名认证，因此即使数据被监听和修改，对接收方而言也是未经认证的。 |\n\n\n\n\
  \n\n##### 权限提升攻击\n\n由于网络是去中心化的，且节点/设备之间的每一次通信都经过加密和认证，因此可以防止此类攻击。因此，即使攻击者获得了对某设备的访问权限，也无法更改访问控制。由于每个设备以分布式方式执行流程，攻击者无法利用单个被攻破的设备影响整个网络。\n\
  \n##### 暴力破解密码攻击\n\n在该网络中，使用 `ECDSA` 算法对通信进行加密并生成密码（一组密钥对）。由于其安全比特的复杂性和陷门特性，这种加密算法几乎无法通过密钥猜测攻击来破解。\n\
  \n基于上述针对物联网基础设施的对策，提出了结合区块链的智慧城市模型，如 图 8.13 所示。\n\n![图 8.13 基于区块链的智慧城市物联网基础设施。](img/fig8_13.jpg)\n\
  \n图 8.13 基于区块链的智慧城市物联网基础设施。\n\n从图中可以看出，收集到的数据存储在星际文件系统（`IPFS`）上，该文件的哈希值连同数字签名在网络中共享。所有节点的\
  \ `IP` 地址经过哈希处理，节点通过其公钥进行标识。每当任何节点执行任何活动时，交易详情都会作为分布式账本写入区块链。数据的哈希值与预处理工具共享，该工具将使用该哈希值从\
  \ `IPFS` 获取数据。然后预处理后的数据被发送进行分析，结果和分析数据被发送到 `IPFS`。获得上传文件的哈希值后，该哈希值进一步共享以供物联网应用使用，这些应用使用该哈希值从\
  \ `IPFS` 获取数据。每次通信均由发送方的私钥进行数字签名，并使用接收方的公钥进行加密。每项活动/通信均记录在区块链上，包含发送方和接收方的地址、时间戳以及数据的哈希值。节点间的通信过程如\
  \ 图 8.14 所示。\n\n![图 8.14 基于区块链的智慧城市物联网基础设施之间的通信。](img/fig8_14.jpg)\n\n图 8.14 基于区块链的智慧城市物联网基础设施之间的通信。\n\
  \n### 8.5 结论\n\n物联网基础设施正在各处实施，为智能家电和智慧城市等智能系统铺平了道路。这种采用创造了一个智能环境，其中处理大量公共和个人数据。保护用户身份隐私并保障数据免受攻击者侵害是强制性要求。然而，传统或基础的物联网基础设施无法满足这一要求。集成区块链技术是实现这一目标的最佳选择。区块链的特性真正满足了物联网保护用户隐私和保障数据免受物联网基础设施上各种攻击和漏洞侵害的要求。区块链网络中的智慧城市提案展示了区块链如何与物联网设备协同工作，为用户及其数据提供安全性和隐私。在该模型中，使用\
  \ `IPFS`（一种去中心化分布式文件系统）来存储数据，它提供数据的哈希值，因此可以共享数据的哈希值而不是原始数据，从而加快通信速度。目前区块链中使用的加密算法是安全的，但不会长久。随着更强大的计算系统出现，这些加密算法的强度会下降。因此，在开发物联网基础设施时，特别是长期使用的基础设施，必须牢记设计必须具备未来可升级性。\n\
