  \ 调度投递与维护方法 | 将无人机同时用于取货和投递服务 |\n\n### 13.3 方法论\n\n据此陈述，城市地区的配送过程是一项繁琐的任务，导致道路交通拥堵。交通系统的性能——促进经济增长的关键因素之一——因低效的配送流程而深受影响。然而，随着新兴技术的出现，即\
  \ AGV（机器人）和 AAV（无人机），本章提出了混合配送流程，从而缓解拥堵问题。\n\n#### 13.3.1 基于 AGV（机器人）的拟议配送流程\n\n\
  该方法在个体层面使用机器人。机器人系统网络由一组交叉口和链路组成。它表示为 `R (I, L)`，其中 `I` 表示交叉口，`L` 表示连接各节点的链路。\n\n\
  交叉口包含属性 `x` 和 `y`，其中 **`x` 表示取货位置（在此称为餐厅）**，**`y` 表示目的地（在此称为目标位置）**，由客户设定。系统还包含\
  \ **车辆 (`V`)** 和 **食品包裹 (`FP`)**，其中车辆代表 **机器人 (`R`)**。该流程如图 13.1 所示。\n\n![FIGURE\
  \ 13.1 Food delivery process using robots](img/fig13_1.jpg)\n\n**图 13.1** 使用机器人的食品配送流程\n\
  \n#### 13.3.2 基于本体论的混合方法拟议配送流程（无人机+机器人）\n\n混合方法克服了在特定目的地投递包裹时的拥堵问题和较高等待时间。混合方法是两个阶段的融合：机器人用于取餐包，无人机用于将餐包投递至目的地。\n\
  \n##### 13.3.2.1 阶段 1\n\n**机器人 (`R`)** 从 **仓库 (`α`)** 出发，前往附近的 **餐厅 (`β`)** 取餐包。采用机器人是为了避免道路拥堵，它们可以侧向行驶，从而给餐厅留出足够的备餐时间。此阶段还使用了一个\
  \ **机器人食品请求表 (`RFRT`)**。在此阶段，机器人仅用于从餐厅取货并送回仓库 (`α`)。\n\n##### 13.3.2.2 阶段 2\n\n\
  无人机用于从 **仓库 (`α`)** 取包裹并投递至 **目的地 (`π`)**。原因在于无人机更快的行驶速度，克服了道路网络的拥堵问题，从而以更快的速度和更少的等待时间增强配送流程。它使用\
  \ **无人机食品请求表 (`DFRT`)**。整个流程如图 13.2 所示。\n\n![FIGURE 13.2 Food delivery process using\
  \ hybrid approach](img/fig13_2.jpg)\n\n**图 13.2** 使用混合方法的食品配送流程\n\n混合配送流程的算法如下：\n\
  \n该流程参考图 13.2。\n\n#### 13.3.3 混合系统中基于本体论的因素以筛选配送订单\n\n分配无人机完成订单请求后，无人机需要从仓库飞往目的地。配送完成后，可能出现一架无人机接到两个不同目的地订单的情况。在这种情况下，需要筛选位置参数。这产生了以本体论形式创建知识库或存储的需求，该知识库按位置筛选订单。它包括：\n\
  \n知识库可以借助本体论编辑器（如 `PROTÉGÉ`、`HOZO` 等）自动或手动创建。\n\n### 13.4 案例研究与分析\n\n为分析三个系统的性能，选取了\
  \ CP, Delhi 地区，因其为高密度人口城市区域，并取其晚高峰时段（下午 6:00 至 7:00）的经纬度数据 [[25]](#chapter13.xhtml#ref13_25)。\n\
  \n仿真模型使用节点，即餐厅 (`β`)、仓库 (`α`) 和目的地 (`π`)。假设使用 “X” 网站识别源位置边界 2 公里范围内的附近餐厅。仓库 (`α`)\
  \ 位置选在中央德里，因为它标志着枢纽或充电站，无人机和机器人从此出发执行配送任务。仿真值使用 `MATLAB` 和 `Simulink` [[26]](#chapter13.xhtml#ref13_26)–[[28]](#chapter13.xhtml#ref13_28)\
  \ 记录，并在给定地点进行物理搭建。订单通过在下午 6:00 至 7:00 期间的均匀分布，匹配附近的餐厅节点和目的地节点来生成。针对配送需求和订单频率上升，调查并记录了几种场景。\n\
  \n\n\n\n\n### 13.5 结论与未来展望\n\n无人机和机器人是颠覆传统配送系统需求的未来主义和新兴技术。这些自动化车辆增强了传统车队的运力，并配备了传感器和模拟器，能够高效地执行特定任务。如今，企业、餐饮业合作伙伴和各类组织对它们的需求日益旺盛。在\
  \ COVID-19 大流行期间，无人机和机器人的使用在许多方面被证明是高效的：它们最大限度地减少了人与人之间的接触，从而降低了感染风险；在大流行期间万物停摆时，它们还提升了配送服务的运力。此外，这些自动化车辆甚至能在高度拥堵的地区配送医疗物资和货物。\n\
  \n本章讨论并分析了三种利用机器人和无人机技术的配送系统。系统包括 AGV 系统、AAV 系统以及同时利用机器人和无人机的混合系统。AGV 包括在人行道和路肩上运行、不干扰现有道路交通网络的机器人车队。AAV\
  \ 由以更高速度运行并配送食品包裹的无人机车队组成。第三种系统是混合系统，它是地面车辆系统和航空车辆系统的融合。在该系统中，机器人用于无人机无法降落的高度拥堵区域的取件服务，随后包裹被放入无人机，准备从取件地点配送至目的地。通过考虑一个名为\
  \ CP 的地点，对自主和新兴技术在配送系统背景下的集成进行了深入分析。由于该地高度拥堵，在高峰时段获取参数和坐标将产生良好的仿真结果。因此，机器人取货产生的任何延迟都由无人机部署来弥补，因为无人机相关的包裹配送为监控、安全和运营目的确保了充足的网络资源。\n\
  \n作为未来的研究方向，该研究可扩展至针对最短首次到达策略的订单请求分配优化和调度算法。优化算法将有助于寻找靠近目标地点的最佳仓库位置。这反过来将提高公司利润并减少客户等待时间。\n\
