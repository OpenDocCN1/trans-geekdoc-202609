- "# Python 机器学习：利用 Python 代码和技巧探索机器学习、数据分析、数据科学、数据挖掘和人工智能的核心内容\n\n\n\n![](img/image8.jpg)\n\
  ![](img/image8.jpg)\n\n\n\n\n## 引言恭喜购买《Python 机器学习：使用 Python 代码和 Python 技巧探索机器学习、数据分析、数据科学、数据挖掘和人工智能的核心要义》，感谢您的支持。后续章节将讨论使用\
  \ Python 编程语言开发和改进的“机器学习”模型的核心概念。本书将就你如何使用 Python 通过 `Scikit-Learn` 和 `TensorFlow`\
  \ 机器学习库来开发机器学习模型提供全面的指导。\n\n你将从对机器学习技术基础和机器学习类型的牢实理解开始本书。掌握机器学习技术概念，并学习研究人员如何通过各种学习算法让机器模拟人类智能，从而突破数据科学的边界是至关重要的。机器学习技术的力量已经在我们的环境和日常物品中开始显现。\n\
  \n在第 2 章“机器学习算法”中，你将用非常易懂的语言学习“12 种流行的机器学习算法”的细微差别，这不需要任何 Python 编程背景，并且可能会激发你对该研究领域的兴趣。你将学习基础性的机器学习算法，即监督学习、无监督学习和强化学习算法，它们是每天开发的成百上千机器学习算法的骨架。\n\
  \n第 3 章“数据科学技术基础”将为你提供各种数据科学技术的清晰简洁概述，这些技术正通过第四次工业革命的经历塑造我们的现在，并决定我们的技术未来。数据科学是一个术语，用于指代当今尖端技术，如“大数据或大数据分析”、“数据挖掘技术”、“机器学习技术”甚至“人工智能技术”。\n\
  \n在第 4 章“机器学习库‘Scikit-Learn’101”中，我们将深入探讨 `Scikit-Learn` 库的功能，以及使用 `Scikit-Learn`\
  \ 库开发机器学习模型所需的先决条件。通过使用开源数据库、插图和实际 Python 代码进行详细演示，你可以按照书中的指令进行实操练习。学习知识没有比亲自动手并获得任务的真实体验更好的方法了。\n\
  \n在第 5 章“使用 Tensorflow 进行神经网络训练”中，你将学习使用 TensorFlow 创建机器学习模型的整个过程。神经网络的特点是类神经元的实体，能够从输入中学习。TensorFlow\
  \ 构建在数据集之上。在本书的最后一章“数据预处理与数据集构建”中，你将学习机器学习中最耗时且最关键的方面。作为奖励，你将学习一些 Python 技巧和技巧，让你的机器学习水平更上一层楼。\n\
  \n## 第 1 章：机器学习基础\n人工智能技术的概念源于这样观点：机器具有人类的智能，能够模拟人类的思维处理和学习能力，适应新的输入并在无需人类帮助的情况下执行任务。机器学习技术（`ML`）是指人工智能技术的一种概念，主要关注机器的工程能力，即通过识别数据模式来显式学习和自我训练，从而改进底层算法。\n\
  \n1959 年，计算机游戏和人工智能领域的专家 Arthur Samuel 在 IBM 任职期间创造了“机器学习”这一术语。机器学习假设现代计算机可以使用目标数据集进行训练，这些数据集可以易于定制以开发所需的功能。机器学习由模式识别技术驱动，在该技术中，机器记录并回溯过去的交互和结果，这些结果被认为符合其当前的情况。鉴于机器需要处理数无尽的数据，且新数据不断涌入，它们必须具备在无需人类编程的情况下适应新数据的能力，这体现了\
  \ `ML` 的迭代特性。以下是来自某些高声誉来源的广泛接受的定义：\n\n- “机器学习是一门让计算机在没有被明确编程的情况下采取行动的科学。” – 斯坦福大学\n\
  - “机器学习领域寻求回答一个问题：我们如何能够构建能够随着经验自动改进的计算机系统，以及支配所有学习过程的基本法则是什么？” – 卡内基·梅梅隆大学\n- “机器学习算法可以通过从示例中泛化来找出如何执行重要任务。”\
  \ – 华盛顿大学\n- “机器学习最基本的实践是使用算法解析数据、从中学习，然后对世界上的某件事做出决策或预测。” – 英伟达（Nvidia）\n- “机器学习基于可以从数据中学习而不依赖基于规则编程的算法。”\
  \ – 麦肯锡（McKinsey）。\n\n\n\n\n\n# 机器学习的基础概念\n\n机器学习最大的吸引力在于系统具有工程化能力，能够从数据中自动学习程序，而不是为机器手动构建程序。在过去的十年里，机器学习算法的应用已从计算机科学扩展到工业领域。机器学习算法能够对任务进行泛化并进行迭代执行。为特定任务开发特定程序需要花费大量的时间和金，但有时这根本无法实现。另一方面，机器学习编程通常是可行的，而且往往更具成本效益。在海量相关数据的支持下，利用机器学习解决全球变暖和地下水水位下降等具有广泛影响的宏大问题是非常有前景的。“机器学习的突破将价值十个微软。”——比尔·盖斯\n\
  \n如今存在许多类型的机器学习，但机器学习的概念很大程度上归结为三个部分：“表示”（representation）”、“评估”（evaluation）和“优化”（optimization）。以下是一些适用于所有这些标准概念。\n\
  \n## 表示 (Representation)\n\n机器学习模型无法直接听、看或感知输入示例。因此，需要数据表示来为模型提供一个观察数据关键特性的有用视角。为了能够成功训练机器学习模型，选择最能代表数据的特征至关重要。“表示”简单是指使用一组分类器，将计算机中的数据点“表示”为它理解的语言。分类器可以定义为：“一个输入离散和/或连续特征值向量并输出一个称为类别的单个离散值的系统”。\n\
  \n为了让模型从表示的数据中学习，训练数据集或“假设空间”（hypothesis space）必须包含你希望模型训练的预期分类器。任何假设空间之外的分类器都无法被模型学习。\n\
  \n用于表示输入的数据特征对机器学习过程至关重要。数据特征对于开发理想的机器学习模型非常重要，足以成为机器学习项目成功与否的关键区别。包含多个与“类别”具有良好相关性的独立“特征”的训练数据集可以使机器学习变得更加顺畅。另一方面，包含复杂特征的类别可能并不易于机器学习。这通常需要对原始数据进行处理，以便从中构建出所需的特征，并供机器学习模型利用。\n\
  \n从原始数据中推导特征的过程往往是机器学习项目中最耗时、最费力的部分。它也被认为是项目中最具创造力且最有趣的部分，其中直觉和试错的作用与技术要求同样重要。机器学习的过程并不是开发训练数据集并执行它的“一劳永逸的过程”，而是一个迭代过程，需要分析运行后的输出，然后修改训练数据集，再次重复整个过程。\n\
  \n工程训练数据集需要大量投入和精力的另一个原因是领域特定性。用于基于消费者行为分析生成预测的电子商务平台训练集，与开发自动驾驶汽车所需的训练集大不相同。然而，实际的机器学习过程在各个工业领域很大程度上是相同的。难怪，许多研究正致力于特征工程的自动化。\n\
  \n## 评估 (Evaluation)\n\n本质上，判断多个假设或模型以选择其中一个模型而非另一个的过程被称为评估。为了区分有用的分类器和模糊的分类器，需要一个“评估函数”。评估函数也称为“目标”（objective）、“效”（utility）或“评分”（scoring）。机器学习算法有其内部评估函数，这通常与研究人员用于优化的外部评估函数不同。通常，评估函数在选择数据之前作为项目的第一步被定义。例如，自动驾驶汽车的机器学习模型具有识别周围行人的特征，其近乎零的负性率和低假阳性是需要被“表示”的现有条件。\n\
  \n## 优化 (Optimization)\n\n在表示的模型空间中搜索以获得更好评估或最高评分分类器的过程被称为“优化”。对于具有多个分类器的算法，选择技术至关重要。市场上提供了多种现成的优化器，最终它们会被自定义设计的优化器所取代。\n\
  \n## 基础机器学习术语\n\n代理（Agent）—— 在强化学习的语文中，代理指的是使用策略来最大化从状态转换中获得的预期回报的实体。\n\n提升（Boosting）——\
  \ 提升可以定义为一种机器学习技术，通过对模型当前分类错误的示例进行加权，将一组简单且不准确的分类器（称为弱分类器）迭代组合成具有高准确率的分类器（强分类器）。\n\
  \n候选生成（Candidate generation）——推荐系统选择第一组推荐的阶段被称为候选生成。例如，图书馆可以提供 500,000 本书目。这种技术将产生符合特定用户需求的子集，并可以进一步精炼为更小的集合。\n\
  \n类别数据（Categorical Data）—— 具有离散可能值的数据。例如，样式可以是轿车、轿跑、SUV。\n\n检查点（Checkpoint）—— Checkpoint\
  \ 可以定义为捕捉时刻状态的数据。通过使用检查点，可以在多个会话中进行训练并导出模型权重或分数。\n\n类（Class）—— 类可以定义为给定标签的列出的目标值之一。例如，旨在检测的机器学习模型将有两个类，即“垃圾邮件”和“非垃圾邮件”。\n\
  \n分类模型（Classification model）—— 用于区分两个或多个离散类别数据的模型类型。例如，对于犬种的识别，可以评估输入的狗照片是否是拉布拉犬、雪陶犬、德国\
  \ Shepherd、贝格等。\n\n协同过滤（Collaborative filtering）—— 根据共同兴趣为特定用户生成预测的过程。\n\n连续数据（Continuous\
  \ Data）—— （此处原文似乎遗漏，但根据上下文推断为） 包含多个与“类别”具有良好相关性的独立“特征”的训练数据集可以使机器学习变得更加顺畅。另一方面，包含复杂特征的类别可能并不易于机器学习。这通常需要对原始数据进行处理，以便从中构建出所需的特征，并供机器学习模型利用。\n\
  \n从原始数据中推导特征的过程往往是机器学习项目中最耗时、最费力的部分。它也被认为是项目中最具创造力且最有趣的部分，其中直觉和试错的作用与技术要求同样重要。机器学习的过程并不是开发训练数据集并执行它的“一劳永逸的过程”，而是一个迭代过程，需要分析运行后的输出，然后修改训练数据集，再次重复整个过程。\n\
  \n工程训练数据集需要大量投入和精力的另一个原因是领域特定性。用于基于消费者行为分析生成预测的电子商务平台训练集，与开发自动驾驶汽车所需的训练集大不相同。然而，实际的机器学习过程在各个工业领域很大程度上是相同的。难怪，许多研究正致力于特征工程的自动化。\n\
  \n判别器（Discriminator）—— 判定输入是真假的系统。\n\n下采样（Down-sampling）—— 在机器学习模型中减少数据的比例。\n\n\
  动态模型（Dynamic model）—— 持续接收输入以进行持续训练的模型。\n\n集成（Ensemble）—— 合并多个模型的预测。\n\n环境（Environment）——\
  \ 强化学习中的观测世界。\n\n回合（Episode）—— 强化学习环境中的每一次尝试。\n\n特征（Feature）—— 用于生成预测的输入变量。\n\n\
  特征工程（Feature engineering）—— 将原始数据转换为有用特征的过程。\n\n特征提取（Feature extraction）—— 从无监督模型中检索中间特征表示的过程。\n\
  \n少样本学习（Few-shot learning）—— 仅从少量示例学习有效分类器的方法。\n\n微调（Fine-tuning）—— 调整已训练模型的参数以适应新问题。\n\
  \n泛化（Generalization）—— 机器学习模型对未见数据做出正确预测的能力。\n\n推理（Inference）—— 将训练好的模型应用于无标记示例以预测的过程。\n\
  \n标签（Label）—— 监督学习中的结果部分。标记数据集可以包含单个或多个特征以及对应的标签。例如，在房屋数据集中，特征可能包括建筑年份、卧室和浴室数量，而标签可以是房屋的价格。\n\
  \n线性模型（Linear model）—— 定义为每个特征分配一个权重以预测的模型。\n\n损失（Loss）—— 在机器学习中，损失是指模型生成的预测与其标签之间距离的衡量。\n\
  \nMatplotlib —— 一个开源 Python 2D 绘图库，用于可视化机器学习的不同方面。\n\n模型（Model）—— 在机器学习中，模型可以定义为结果。\n\
  \nNumPy —— 提供数组操作的开源数学库。\n\n单样本学习（One-shot learning）—— 在机器学习中，单样本学习是指常用于对象分类的方法。\n\
  \n过拟合（Overfitting）—— 在机器学习中，过拟合是指模型过度匹配数据以至于无法做出正确预测。\n\n参数（Parameter）—— 模型变量。\n\
  \n流水线（Pipeline）—— 在机器学习中，流水线是指使用数据的设施。\n\n随机森林（Random forest）—— 在机器学习中，随机森林是一种使用决策树的集成方法。\n\
  \n缩放（Scaling）—— 在机器学习中，缩放是指值的范围。\n\n序列模型（Sequence model）—— 序列模型是指具有顺序依赖的模型。\n\n\
  欠拟合（Under-fitting）—— 在机器学习中，欠拟合是指模型未捕捉数据的复杂性。\n\n验证（Validation）—— 用于评估模型质量的过程。\n\
  \n\n\n\n\n*   “模式分类”：将输入模式分配到预定义的类别之一。例如，基于卫星图像对陆地类型进行分类。\n*   “聚类”：本质上是一种无监督的模式分类模型。例如，使用定义的输入模式预测水流的生态状态。\n\
  *   “函数拟合或回归”：能够根据提供的训练模式集创建一个函数。例如，大气中臭氧浓度的预测、地下水中硝酸盐量的估算以及供水建模。\n*   “预测”：利用时间序列中的先验数据样本来估计输出。例如，空气和水质的预测。\n\
  *   “优化”：用于在预定义的约束最大化或最小化“成本函数”。例如，入渗方程的校准。\n*   “内容检索”：即使输入不完整或失真，也能召回记忆。例如，使用卫星图像生成水质代理指标。\n\
  *   “过程控制”：通过改变节门角度，试图在不断的数据负载下保持速度接近恒定。例如，发动机速度控制。\n\n# 遗传算法\n\n从名称上可以看出，遗传算法（`GA`）通过将更适应解的特征传递给“后代”并取代较不适应的解，模拟了自然选择理论。遗传算法将不断进化，直到获得问题的预期解。类似于人类染色体，每个潜在解都被编码为特征的“二进制字符串”，渐进种群的每种排列被称为“代”。原始种群集是随机产生的，所有后续代际都是通过选择和繁殖的过程创建的。然后，对种群的特定子集进行选择性育种以产生新的染色体。选择过程由个体解的适应度驱动，包括与完美解的接近程度和确定性检查。与完美选择的接近程度通常通过“轮盘赌”方法进行，该方法会根据其适应度计算出的概率随机选择父代。然后，确定性检查为被选有机体的子集分配一个值。传统的传播通过遗传交叉实现，它通过交换两个父代的染色体来产生后代，并在染色体中插入突变以随机修改父代染色体的某些部分。这种传播发生的频率不如人类世界那么高，但它允许在基因池中引入新的遗传材料。在搜索进展中，突变被认为没有交叉重要，但在维持遗传多样性方面被认为至关重要，而遗传多样性是持续进化的基础。在稳态遗传算法中，适应度较少的成员被新代取代，使模型的平均适应度增加。“繁殖与选择”的循环不断重复，直到满足完成标准，例如达到最佳适应度，或所有有机体完全相同且进化不再产生新结果。由于仅关注适应度检查而不考虑其他派生因素，遗传算法在计算上被认为具有高度健健性，并能够平滑地平衡负载和效率。遗传算法的另一个重要方面是它能够间接采样已测试的大量代码序列。与无法搜索噪声和多模态关系的随机搜索技术不同，遗传算法可以存储整个解的种群，而不仅仅是调整单个解。遗传算法的一些应用示例包括：“空气质量预测、水质模型校准、土壤容密度估算和水管理系统”。\n\
  \n# 决策树\n\n机器学习决策树可以定义为“一种决策过程的树形图形表示，它考虑了所有可能影响决策的条件或因素，以及这些决策的后果”。决策树被认为是最简单的“监督学习机器学习算法”之一，具有三个主要元素：代表数据集条件的“分支节点”、代表正在进行的决策过程的“边”以及代表决策终点的“叶子节点”。决策树是一种极好的预测分析技术，在生成“类别”和“连续”目标变量值的预测方面有广泛应用。（注意——决策树的这一重要概念将在下一章详细探讨）\n\
  \n# 概率编程\n\n“概率编程”是一种层级编程语言，它能够构建概率模型，并从分布中提取值并将这些值转化为程序。基于概率编程的学习系统能够从先验知识进行推理，允许在不确定的情况下做出决策。为了捕捉目标系统的知识，使用了“定量”和“概率”术语。在充分训练的情况下，模型可以通过“推理”过程对显式查询给出答案。通过使用概率语言，也可以自动求解。它还支持交互式建模和形式验证。概率算法内部的抽象层对于培养通用高效的推理至关重要，因为各种人工智能问题都需要代理处理碎片数据集。概率算法广泛用于分析大量数据以生成预测，并辅助感知系统分析底层过程。最常用的概率模型被称为“贝叶斯网络”，它利用“贝叶斯推理”计算概率。贝叶斯网络可以产生两种形式的推理：第一种是评估网络中每个变量特定赋值的联合概率；第二种是评估给定另一子变量赋值后，某个子变量的概率。关于推理、学习、规划和感知的问题可以通过应用贝叶斯网络来解决。“贝叶斯推理算法”用于解决推理问题，而“期望最大化”算法可用于处理学习问题。\n\
  \n# 实践中的机器学习\n\n机器学习的完整过程远比仅仅算法的开发和应用要复杂，可以分为以下步骤：\n\n1.  定义项目目标，仔细考虑所有可用的先验知识和领域专家。目标很容易变得模糊，因为你想要实现的事情总是比实际可能实现的多。\n\
  \n\n\n\n\n## 2. 数据预处理和清洗必须产生高质量的数据集。这是整个项目中最关键且最耗时的一步。数据量越大，给训练数据集带来的噪声就越多，在输入学习器系统之前，必须消除这些噪声。\n\
  \n## 3. 选择合适的学习模型以满足你的项目需求。鉴于市面上存在各种类型的数据模型，这个过程通常相当简单。\n\n## 4. 取决于机器学习模型应用的领域，只要模型能够成功交付所需的结果，其结果可能可能不需要人类专家对模型有清晰的理解。\n\
  \n## 5. 最后一步是整合并部署从模型中收集的知识或信息，以便在工业水平上使用\n\n## 6. 上述第 1 到第 5 的整个循环将反复重复，直到获得可以用于实践的结果。\n\
  \n## 机器学习的重要性\n为了直观感受机器学习在日常生活中有多么重要，最简单的方法是说明我们尖端生活方式中还有哪些部分没有被它触及。人类生活的方方面面受到旨在扩展人类能力和提高效率的“智能机器”的影响。人工智能和机器学习技术是“第四次工业革命”的核心准则，它可能会挑战我们对“人”的定义的思考。以下是帮助你理解机器学习在日常生活中重要性的几个原因：\n\
  \n- 重复性学习和从数据中启示的自动化。与仅仅自动执行手动任务的硬件驱动机器人自动化完全不同，机器学习允许持续且可靠地执行大量基于计算机的任务。\n\n- 机器学习算法正在帮助人工智能适应不断变化的世界，因为它允许机器或系统学习、记录并改进其先前的错误。机器学习算法充当分类器或预测器，以获取新技能并识别数据模式和结构。例如，机器学习算法已经生成了一个可以自学下棋、甚至可以根据客户活动和行为数据生成产品推荐的系统。这种模型的优之处在于，它会随着每组新数据进行调整。\n\
  \n- 机器学习通过使用包含多个隐藏层的神经网络，分析更深、更大的数据集变得可行。想看，就在几年前，一个拥有许多隐藏层的欺诈检测系统会被认为是科幻作品。随着大数据的出现和难以想象的计算机能力的到来，一个全新的世界正展在视平线上。机器的数据类似于汽车的汽油，添加的数据越多，获得的结果就越快、越准确。深度学习模型在数据充足的情况下蓬勃发展，因为它们可以直接从数据中获益。\n\
  \n- 机器学习算法的“深度神经网络”带来了不可置信的准确性。例如，频繁和反复使用“Amazon Alexa”和“Google Search”等智能技术，使得源深度学习的准确性有所提高。这些“深度神经网络”也在赋能我们的医学领域。图像分类和物体识别现在能够在\
  \ MRI 图像上发现癌症，其准确性与经过高度训练的放射科医生相当。\n\n- 人工智能允许结合机器学习算法来增强和改进大数据分析的使用。数据已演变为其货币，当算法进行自我学习时，它就可以很容易变成“知识产权”。原始数据类似于金矿，挖掘得越深、越广，就能挖掘或提取出更多的“黄金”或有价值的洞察。将机器学习算法应用于数据可以让你更快地找到正确的解决方案，并占据优势。请记住，尽管所有人都在使用比较技术，但最好的信息将始终获胜。\n\
  \n\n\n\n\n# 第 2 章：机器学习算法\n\n通过利用先验计算和底层算法，机器现在能够对自身数据进行学习和训练，从而生成高质量且易于复制的决策和结果。机器学习的概念已经存在很长时间，但机器学习算法的最新进展使得计算机处理大规模数据处理和分析成为可能。这是通过使用高速高频自动化应用复杂精密的数学计算实现的。如今的先进计算机器可以快速分析海量信息，并提供更快、更准确的结果。使用机器学习算法的公司增加了灵活性，可以更改训练数据集以满足公司需求并据此对机器进行训练。这些定制的机器学习算法使公司能够定义潜在的风险和发展机会。通常，机器学习算法与人工智能技术和认知技术协作使用，使计算机在处理大量信息或大数据时变得极其高效、有效，并生成极其精确的结果。目前有四种基本的机器学习算法。\n\
  \n## 监督学习算法\n\n由于监督学习算法能够评估并将从之前的迭代和交互中学到的经验应用于新的输入数据集，因此它们通常被用于预测性大数据分析。根据为了有效预测和预测未来事件而给出的指令，这些算法可以对其所有正在运行的任务进行标记。例如，人们可以将机器程序为\
  \ `R`（运行）、`N`（负）或 `P`（正）来标记其数据点。机器学习算法随后将按照程序对输入数据进行标记，并获得具有正确输出的数据输入。算法将将其产生的输出与`预期或正确`的输出进行比较，识别可以产生的未来变化并修复错误，使模型更精确、更智能。通过使用`回归`、`预测`、`分类`和`成分提升`（ingredient\
  \ boosting）等方法良好地训练机器学习算法，任何新的输入数据都可以作为一组`目标`数据输入机器，以按意愿编排学习程序。这种`已知训练数据集`启动了分析过程，随后由学习算法产生一个`推断特征`，该特征可以根据未来事件的输出值生成预测和估计。例如，金融机构和银行高度依赖监控机器学习算法来检测信用卡欺诈，并预测潜在信用卡客户未能按时偿还贷款的概率。![](img/image233.jpg)\n\
  \n## 无监督学习算法\n\n公司经常发现自己处于这样一种场景：无法获取生成带标记和分类的训练数据集所需的信息源。在这种情况下，使用无监督机器学习（ML）算法是完美的。无监督机器学习算法被广泛用于定义机器如何生成`推断特征`，以从未标记和未分类的数据集中阐明隐藏的结构。这些算法可以探索数据以在数据量中定义结构。与监督机器学习算法不同，无监督算法无法识别正确输出，尽管它们在研究输入数据和得出结论方面与监督学习算法一样有效。这些算法可以识别信息离群值，使用`自组织映射`、`奇异值分解`和`k-means\
  \ 聚类`等方法对文本主题分类，生成定制的产品推荐。例如，识别具有共同购物特征的客户，并将其分为特定的组，重点关注可比的营销策略和活动。因此，在在线营销领域，无监督学习算法非常流行。![](img/image240.jpg)\n\
  \n## 半监督学习算法\n\n功能极其强大的`半监督机器学习算法`能够同时使用标记和未标记的信息集进行学习和自我训练。这些算法是监督和无监督算法的`混合体`。通常，通过少量的标记数据，训练数据集主要由未标记数据组成。将`预测`、`回归`和`分类`在内的分析方法与半监督学习算法相结合，使机器能够大幅提高其学习精度和训练能力。这些算法通常用于企业从原始未标记数据生成标记训练数据集时成本极高且成本效益低的情况。公司在系统中使用半监督学习算法以避免产生人员和设备的额外成本。例如，`人脸识别`技术的实施需要分布在各种输入源的大量面部数据。从网络摄像头等源获取的原始数据预处理、处理、分类和标记需要大量的资源和数小时的工作才能作为训练数据集。\n\
  \n## 强化学习算法\n\n`强化机器学习算法`的独特之处在于它们从环境中环境中学习。这些算法执行活动并勤奋地记录每个动作的结果，这些结果可能是导致错误的失败，也可能是表现优的奖励。区分强化学习算法的两个主要特征是`试错`研究方法和`延迟奖励`的反馈回路。通过一系列计算，计算机不断分析输入数据，并为每个正确或预期的输出发送强化信号，以最终优化最终结果。算法开发了一个简单的动作获取反馈的回路，用以评估、记录和学习哪些动作是有效的，并在较短时间内产生正确或预期的输出。使用这些算法允许系统在特定背景的限制内自动确定最佳行为并最大化其效率。因此，强化机器学习算法被广泛应用于游戏、机器人工程和导航系统。\n\
  \n机器学习算法已扩散到数百、数千种且在不断增加。以下是一些最广泛使用的算法：\n\n## 1. 回归\n\n`回归`方法属于监督学习类别。它们有助于根据先验数据集预测或描述特定的数值，例如根据可比房产的先验价格数据预测某属性的价格。回归方法从简单（如`线性回归`）到复杂（如`正则线性回归`、`多项式回归`、`决策树`、`随机森林回归`和`神经网络`等）。最简单的技术是`线性回归`，它使用`直线方程\
  \ (y= m* x+ b)`对数据集进行建模。通过计算直线的位置和斜率，可以使用多个`数据对 (x, y)` 训练`线性回归`模型，从而减少数据点与直线之间的整体距离。换句话说，对于一条产生数据观测值最佳近似的直线，使用了`斜率\
  \ (m)`和`y-截距 (b)`的计算。![](img/image254.jpg)\n\n例如，使用`线性回归`技术，通过收集房屋年龄、某些卧室、面积以及几台安装的电子设备，为房屋的能耗（kWh）生成预测。现在，我们有多个输入（建筑年份、平方英尺），可以使用`线性多元回归`。其底层过程与`一对一线性回归`相同，但创建的`直线`是基于多维空间中变量数量的。上面的图表展示了这种线性回归模型拟合实际建筑能耗的效果有多好。\n\
  \n## 2. 分类\n\n`分类`方法是监督学习的另一类，它们可以为`类别值`生成预测或解释。例如，这种方法可以预测在线客户是否会购买特定的物品。生成的结果将报告为是或否的响应，即`买家`或`非买家`。但分类技术不仅限于两个类别。例如，分类技术可以评估图片是否包含轿车。\n\
  \n\n\n\n\n1. 由 `K` 随机选择数据中心。\n2. 将每个数据点分配给距离最近的随机中心。\n3. 重新计算每个簇的中心点。\n4. 如果中心没有发生变化（或发生微小变化），则过程完成。\n\
  \n\n\n否则，我们将回到步骤 2。（如果聚类中心不断变化，请预先设置最大迭代次数以避免陷入无限循环。）接下来的图将“K-Means”聚类算法应用于一个建筑数据集。图中的每一列都显示了每栋建筑的效率。这四项测量分别与空调、供暖、安装的电子电器（冰箱、电视）和烹饪气有关。为了便于解释结果，可以将聚类数\
  \ `K` 设置为 `2` 进行聚类，其中一个聚类被选为高效建筑组，另一个聚类被选为低效建筑组。你可以看到左侧的结构位置，以及右侧用作输入的若干建筑特征：安装的电子电器和供暖。![](img/image286.jpg)\n\
  \n## 4. 降维\n顾如其名，为了从数据集中提取不重要的信息（有时是冗余列），我们使用“降维”。在实践中，数据集往往包含数百甚至几千行数据（也称为特征），这使得减少总行数至关重要。例如，图片可能包含数千个像素，但并非所有像素对于分析都是重要的。或者，在制造过程中测试微芯片时，会对每个芯片应用大量的测量或实验，其中大部分数据是冗余的。在这些情况下，就利用“降维”算法来管理数据集。\n\
  \n### 主成分分析\n“主成分分析”（或（`PCA`）是最常用的“降维技术”，它通过发现能够最大化数据线性变异性的新向量来减小“特征空间”的大小。当数据的线性相关性很强时，PCA\
  \ 可以在不丢失太多信息的情况下大幅减少数据维度。PCA 是机器学习的基础算法之一。它使你能够在减少数据维度的同时尽可能减少信息。它被应用于目标识别、计算机视觉、信息压缩等许多领域。主要部分的计算限于初始数据的向量和协方差矩阵值的计算，或数据矩阵的唯一分解。通过其中一种方法，我们可以传达若干项指示，进行所谓的合并，并已经可以使用更简单的模型进行操作。当然，数据丢失可能无法避免，但\
  \ PCA 技术将帮助我们尽地减少任何损失。\n\n### t-随机邻域嵌入 (t-SNE)\n另一种常用技术是“t-随机邻域嵌入 (t-SNE)”，它能实现非线性维度的降低。该技术主要用于数据可视化，并潜在用于机器学习函数，如空间压缩和聚类。下一张图展示了对手写数字的“MNIST\
  \ 数据库”分析。“MNIST”包含了大量从 0 到 9 的数字图片，科学家用它们测试“聚类”和“分类”算法。数据集的每一行代表原始图片的“向量化版本”（大小为\
  \ 28x28 = 784 像素）以及每张图片的标签（0, 1, 2 等）。注意，在下面的图中，维度已从 784 像素降至 2 维。二维投影实现了初始高维数据集的可视化。![](img/image299.jpg)\n\
  \n## 5. 集成方法\n假设你选择制造一辆汽车，是因为你对市场和网上提供的汽车多样性不满意。你可以从发现你所需的每个组件的最佳方案开始。通过组装所有这些组件，最终产生的汽车将优于所有替代方案。“集成方法”使用了相同的概念，即混合多个预测模型（机器学习），以获得比任何单一模型生成的质量更高的结果。例如，`Random\
  \ Forest`（随机森林）算法是一种“集成方法”，它汇集了具有不同数据样本的各种 `Decision Trees`（决策树）。因此，`Random Forest`\
  \ 生成的预测质量优于仅由 `Decision Tree` 生成的质量。将“集成方法”视为一种减少单一机器学习模型方差和偏差的方法。这是至关重要的，因为在某些情况下，任何指定的模型都可能是准确的，但在其他情况下可能是完全错误的。其相对准确性可能会被另一个模型反转。\n\
  \n## 6. 迁移学习\n想象你是一个专注于服装行业的数据科学家。你已经训练了几个月一个高质量的学习模型，以便将图片分类为“女装上衣”、无背心和衬衫。通过使用“迁移学习”，整合到第一个模型中的理解可以无缝地转移并应用于第二个模型中。迁移学习涉及对先前训练过的神经网络的一部分进行重新使用和适应，以应对新的但可比的任务。具体来说，一旦神经网络针对特定任务成功训练，就可以比例的已训练层就可以很容易地迁移并与新层结合，然后在相关数据上训练新层。迁移学习的主要处处减少了训练神经网络所需的数据量，从而为“深度学习算法”节省成本。更不要忘记获取足量的标记数据来训练模型是多么困难。假设在这个例子中，你正在使用一个带有隐藏层的神经网络用于“女上衣”模型。在运行几次测试后，你了解到两个任务的输入和输出是不同的，但可重用的层能够总结适用于两者的数据，例如服装和衣服的形状。市场上已经有了许多高质量的预训练模型。\n\
  \n## 7. 自然语言处理\n我们世界的大部分知识和信息是以某种形式的人类语言存在的。曾经被认为是不可能的，今天计算机能够在几分钟内阅读大量的书籍和博客。尽管计算机仍然无法完全理解“人类文本”，但它们可以被训练来执行特定任务。例如，移动设备可以被训练来自动完成短信或纠正拼写错误。机器已经训练得足以像人类一样进行简单的对话。“自然语言处理”（`NLP`）并不完全是一种机器学习方法，反而是一种为机器学习产生文本的常用技术。考虑多种格式的文本文件（文档、网络博客等）。大多数文本文件通常充满了打字错误、语法不正确的字符和短语，这些需要被过滤掉。目前市场上最流行的文本处理模型是\
  \ `NLTK (Natural Language Toolkit)`，由斯坦福大学的研究人员开发。将文本映射为数值表示的最简单方法涉及计算每个文本文档包含的每个词的频率。例如，一个整数矩阵，其中每一行代表一个文本文档，每一列代表一个单词。这种词频表示矩阵通常被称为词频矩阵（`TF-M`）。从那里开始，单个矩阵条目可以根据每个术语在整组论文中的重要性权重进行分离。这种文本文档的矩阵表示形式被称为词频逆频率（`TF-IDF`），它通常能为机器学习任务带来更好的性能。\n\
  \n## 8. 词嵌入\n`Term Frequency Matrix`（词频矩阵）和 `Term Frequency Inverse Frequency`（词频逆频率）允许我们计算词之间的相似性。通过词嵌入，我们可以将单词映射到连续的向量空间，在这个空间中，语义相似的词距离更近。这种方法能够捕捉词之间复杂的语义关系，例如，“国王”-“男人”+“女人”\
  \ ≈ “女王”。词嵌入是现代自然语言处理中的一项核心技术，极大地提升了机器对语言的理解能力。\n\n\n\n\n1. 收集、分类并标记训练数据集，将其分为“特征变量”和“分类或回归输出”。\n\
  \n2. 在训练数据集中识别出最佳且最具效益的特征，将其作为数据分叉的节点。\n\n3. 根据所选“最佳特征”的可能取值，通过对数据集进行分叉创建数据子集。这些分叉定义了决策树的“分支节点”，其中每个节点都根据数据集中的特定特征作为分叉点。\n\
  \n4. 使用步骤 3 收集的数据子集迭代地开发新的树节点。这些分叉将持续进行，直到达到最优点，即在最小化分叉次数或节点数量的同时实现最大准确率。\n\n##\
  \ 剪枝 (Pruning)\n决策树的本质目的是支持系统的训练和自学习，这通常需要加载所有可能影响最终结果的条件和影响因素。为了克服为每个节点设置最少实例的正确输出的挑战，开发者往往通过将该“最小数量”设定为一个小数值来得出一个“稳妥的赌注”。这导致在必要的地方产生大量的分叉，从而形成一个非常复杂且庞大的决策树。这就是“树剪枝”派上用场的地方。“剪枝”一词的字面意思是“通过消除多余物质来减少”。这种概念源自现实生活中的修剪，并被应用于数据科学和机器学习的决策树剪枝过程中。剪枝过程通过“将严格僵化的决策边界转换为通用且平滑的边界”，有效地降低了决策树的整体复杂度。决策树的分叉次数决定了树的整体复杂度。最简单且常用的剪枝方法是审查单个分支节点，并评估将其移除对决策树成本函数的影响。如果对成本函数的影响很小或没有，则审查的分支节点就可以轻松移除或“剪枝”。\n\
  \n## 10. Apriori 机器学习算法\n`Apri algorithm` 是另一种无监督机器学习算法，可以从特定数据集中产生关联规则。“关联规则”简单意味着如果存在项目\
  \ X，则项目 Y 具有预定义的出现概率。大多数关联规则以“IF-THEN”语句的形式产生。例如，“如果”某人购买了 iPhone，“那么”他们很可能也购买了\
  \ iPhone 手机壳。Apriori 算法可以通过最初观察购买 iPhone 的同时购买手机壳的人数，并生成一个比例（用购买新 iPhone 的人数 1000\
  \ 除以同样为新 iPhone 购买手机壳的人数 800）得出这些发现。Apriori 机器学习算法的基本原理是：\n\n- 如果一组事件发生的频率很高，那么该事件集的所有子集也将具有高发生频率。\n\
  - 如果一组事件偶尔发生，那么该事件集的所有超集也将偶尔发生。\n\nApriori 算法在以下领域具有广泛的适用性：\n\n### 检测药物不良反应\n`Apriori\
  \ algorithm` 用于分析医疗数据，例如给给患者的药物、每位患者的特征、患者经历的有害副作用、原始诊断等。这种分析产生的关联规则可以为患者的特征以及可能导致药物副作用的给药药物提供见解。\n\
  \n### 市场篮子分析\n包括 `Amazon` 在内的一些领先电子商务业务使用 Apriori 算法对极高概率一起购买的产品，以及可以通过产品促销和折扣优惠进行追加销售的产品收集洞解。例如，零售商可以使用\
  \ Apriori 生成此类预测：即购买糖和面粉的客户很有可能购买鸡蛋来制作饼干和蛋糕。\n\n### 自动补全应用\n`Google` 上备受青爱的自动补全功能是另一种常见的\
  \ Apriori 应用。当用户开始输入搜索关键词时，搜索引擎会在其数据库中搜索在特定单词之后通常会输入的其他相关短语。\n\n## 11. 支持向量机机器学习算法\n\
  `Support Vector Machine`（或 SVM）是一类`supervised ML algorithm`，用于`classification` 或\
  \ `regression`，其中数据集在 `classes` 上训练 SVM，以便对新输入进行分类。该算法通过发现一条将训练数据集合划分为不同 `classes`\
  \ 的直线（超平面）来对数据进行各种类别分类。由于存在各种线性超平面，该算法尝试最大化不同 `classes` 之间的距离，这被称为“间隔最大化”。通过识别使类别距离最大化的直线，可以提高对未见数据的泛化能力。SVM\
  \ 可分为以下两类：\n\n- `Linear SVM's` – 训练数据或分类器可以被超平面划分。\n- `Non-Linear SVM's` – 与线性 SVM\
  \ 不同，在 `non-linear SVM's` 中不存在用超平面分离训练数据的可能性。例如，人脸检测训练数据由一组脸部图像和另一组非脸部图像组成。在这种情况下，训练数据非常复杂，难以获取每一个向量的特征表示。在线性地将脸部数据集与非脸部数据集分离是极其复杂的。\n\
  \n\n\n\n\n`SVM` 被不同的经济组织广泛用于股票市场预测。例如，`SVM` 被用于比较同一行业部门内各种股票的相对表现。`SVM` 生成的分类有助于投资相关的决策过程。\n\
  \n## 核函数技巧\n\n现实世界中收集的数据是随机分布的，这使得通过线性方式区分不同的类别变得非常困难。然而，如果我们能可能地找到一种将数据从二维空间映射到三维空间的方法（如图片所示），我们就能发现一个区分不同类别的决策面![](img/image382.jpg)\n\
  \n转换此类数据的一种方法是将所有数据点映射到更高维（在这种情况下是 3 维），找到界限并进行分类。这对于有限的维度来说是有效的，但当需要处理大量维度时，在给定空间内的计算会变得越来越昂贵。因此，核函数技巧派上了用场！\n\
  \n“核函数技巧”使我们能够在原始特征空间中进行操作，而无需计算高维空间中的数据坐标。例如，图片中的方程包含几个作为 `x` 和 `y` 的三维数据点![](img/image388.jpg)\n\
  \n假设我们想将 `x` 和 `y` 映射到 9 维空间。为了得到结果（只是一个标量），我们必须进行图片所示的计算。在这种情况下，计算复杂度将是 `O(n2)`![](img/image393.jpg)!(image397.jpg)\n\
  \n然而，通过使用表示为 `k(x, y)` 的“核函数”，而不是在 9 维空间中进行复杂的计算，可以在 3 维空间通过计算 `x-transpose` 和 `y`\
  \ 的“点积”得到相同的结果。在这种情况下，计算复杂度将是 `O(n)`![](img/image402.jpg)\n\n原则上，核函数技巧用于使数据向高维的转换变得更加高效且成本更低。核函数技巧不仅限于\
  \ `SVM` 算法。核函数技巧可以用于任何涉及“点积 (x, y)”的计算。\n\n## 第 3 章：数据科学技术基础\n\n在技术世界中，数据被描述为“计算机能够处理和存储的信息”。得益于我们的数字生活，数据已经淹没了我们的现实。我们的世界正淹没在每秒都在不断收集的数据中，从点击网站到监控智能手机，以及每天每秒钟记录我们的位置。我们可以从这些海量数据的深度中提取出我们甚至尚未经历过的现实问题的替代方案或解决方案。这种利用可测量信息集通过数学方程和统计学来收集想法的过程，可以被描述为“数据科学”。\n\
  \n数据科学家的角色往往非常灵活，经常被误认为是计算机科学家或统计学家的。本质上，任何准备好深入挖掘大量数据以收集信息的人都可以被称为数据科学从业者。例如，像“沃尔玛”这样的企业跟踪并记录客户在店内和线上的购买情况，提供定制化的产品和服务建议。诸如“Facebook”等允许用户列出“当前位置”的社交媒体平台，可以通过评估用户自己提供给平台的丰富信息来识别全球迁移的趋势。\n\
  \n回到 1960 年，“数据科学”一词最早的记录归于“彼得·纳尔（Peter Naur）”，据他用“数据科学”代替计算机科学术语，并最终引入了“数据学（datalogy）”。纳尔在\
  \ 1974 年出版了一本名为《计算机方法简明》的书，在书中大量使用了“数据科学”一词。1992 年，在“第二次日法统计研讨会”上，提出了数据科学的现代定义，并承认了一个主要关注数据类型、维度和结构的新兴学科的出现。\n\
  \n> “数据科学不断演变，是熟练专业人士最有前景和需求量最大的职业路径之一。今天，成功的数据专业人士明白，他们必须超越分析大量数据、数据挖掘和编程等传统技能。为了为他们的组织发现有用情报，数据科学家必须精通数据科学全生命周期，并具备灵活性和理解力，以在过程的每个阶段实现收益化。”\
  \ – 加利福尼亚大学伯克利分校\n\n企业高管日益增长的兴趣极大促进了“数据科学”这一术语近期普及度的提高。然而，大部分记者和学术专家并未将数据科学视为区别于统计学领域的独立研究领域。数据科学被认为是同一社区内对“数据挖掘”和“大数据”的常用术语。数据科学这一术语的定义在技术社区内部似乎存在争议。因此，在很大程度上，一个包含多功能技能的研究领域——包括计算机编程技能、领域知识、精通的统计能力以及数学算法专业知识，能够从海量原始数据中获取有用知识——被称为“数据科学”。\n\
  \n## 数据科学的重要性与应用\n\n现在你已经对数据科学有了基本的了解，让我们来看看数据科学在日常生活中的意义和应用：\n\n*   “大数据和大数据分析”是数据科学的另一个“分支”，组织利用它来解决复杂的技术和资源管理问题。在书中稍将学习更多关于大数据和大数据分析的概念。\n\
  *   数据趋势在过去的 20 年发生了巨大变化，表明非结构化数据正在稳定上升。估计到 2020 年，“我们收集的数据中超过 80% 将是非结构化的”。传统上，我们获得的数据主要是结构化的，可以使用简单的业务智能工具轻松分析，但如下图片所示，非结构化和半结构化数据正在增加。这反过来证明了创建和使用更强大、更复杂的分析工具和技术的必要性，目前的业务智能工具无法处理如此巨大且多样的数据。我们需要更先进的分析工具和算法来处理和分析非结构化和半结构化数据，以提供有用且可操作的见解![](img/image427.jpg)\n\
  *   公司始终处于更好地理解客户需求的边缘。现在可以通过从当前来源（如客户订单历史、最近查看的物品、性别、年龄和人口统计数据）收集数据，并使用复杂的分析工具和算法从这些数据中获得价值见解来实现。机器学习算法的使用可以为个人客户产生更精确的产品建议。“智能”客户总是在寻找最具吸引力和最增强的用户体验体验，因此企业可以使用这些分析工具和算法来获得竞争优势并扩大业务。\n\
  *   数据科学使得使用复杂的机器学习算法成为可能，这些算法可以应用于各种工业领域。例如，开发能够收集实时数据的自动驾驶汽车，利用其先进的摄像头和传感器构建环境地图，并对车速和其他驾驶动作做出选择。\n\
  \n\n\n\n\n- 数据科学被广泛应用于“预测性分析”。例如，天气预报需要从卫星、雷达和飞机等多个来源进行数据收集和分析，以构建数据模型，从而有效预测飓风、龙卷风和山洪洪水等自然灾害的发生。\n\
  - 数据科学能够评估跨行业（如医疗保健、旅游、金融、零售和电子商务）的公司面临的问题，这在很大程度上推动了它在商业领导者中日益受欢迎。\n\n\n\n\n\n\
  2001 年，高盛（Gartner）将大数据定义为“包含更多多样性、数量不断增长且速度不断加快的数据”；这导致了最初“大数据三要素（Three Vs）”的形成。大数据涉及来自无数无限信息源的源源不绝的结构化和非结构化数据洪流。这些信息集的规模巨大，无法使用传统的分析工具和技术进行分析，但它们在深处隐藏着丰富的宝贵见解。\n\
  \n“大数据”的起源可以追溯到 20 世纪 60 年代和 70 年代，当时“第三次工业革命”刚刚开始启动，关系型数据库的增长也随着数据中心的建设而开始。但随着如\
  \ `Google` 和 `Yahoo` 等免费搜索引擎的极易访问性，`YouTube` 等免费互联网娱乐服务，以及 `Facebook` 和 `Twitter`\
  \ 等社交媒体平台的兴起，大数据的概念近期占据了中心位置。\n\n公司从 2005 年开始意识到通过这些平台和服务产生了惊人数量的用户数据，同年，还开发了名为\
  \ `Hadoop` 的开源框架，用于收集和分析这些公司可以获得的海量数据转储。一种名为 `NoSQL` 的非关系型或分布式数据库在同一时代开始流行，因为它具有存储和提取非结构化数据的能力。`Hadoop`\
  \ 使企业能够以相对较低的成本非常方便的方式运营大数据。\n\n今天，随着尖端技术的兴起，不仅是人类，我们还开发了产生数据的机器。诸如物联网（IoT）和系统互联网（IoS）等智能设备技术使大数据的数量呈爆炸式增长。我们日常的家居用品和智能设备连接到互联网，能够追踪和记录我们的使用模式以及我们与这些产品的互动，并直接将所有这些信息馈入大数据中。\n\
  \n机器学习技术的出现进一步增加了每天产生的信息量。据估计，“到 2020 年，每人每秒将产生 1.7 MB 的信息”。随着大数据的不断扩展，为了实现最大的可用性，仍有许多界限需要跨越。“大数据的性不在于你拥有多少数据，而在于你如何利用这些数据。你可以从任何来源获取数据并进行分析，以找到能够\
  \ 1) 降低成本，2) 缩短时间，3) 新产品开发和优化产品，以及 4) 智能决策的答案。” - SAS\n\n## 大数据的 Vs（要素）\n\n-   **数量（Volume）**：给定数据集的“数量”必须远远大于传统数据集才能被分类为大数据。这些数据集主要由非结构化数据组成，结构化和半结构化数据有限。网页、搜索历史、移动应用程序和社交媒体平台等输入源可以提供意义不明的数据或非结构化数据。公司的规模和客户群通常与公司能够轻松获得的数据量成正比。\n\
  -   **速度（Velocity）**：收集和处理数据的速度被称为大数据的速度。公司越来越多地使用本地和云服务器的结合来提高其数据收集的速度和存储。现代的“智能产品和设备”利用实时访问客户信息，为他们提供更具参与性和改进的用户体验。\n\
  -   **多样性（Variety）**：传统上，数据集主要由结构化数据组成，辅以少量非结构化和半结构化数据，但大数据的出现产生了新的非结构化数据类型，如视频、文本、音频，这些需要先进的工具和技术进行清洗和处理，以提取有意义且可操作的见解。\n\
  -   **真实性（Veracity）**：真实性是大数据分析另一个需要考虑的“V”。这涉及到数据的“可靠性或质量”。例如，像 `Facebook` 和 `Twitter`\
  \ 这样带有博客和帖子、充斥标签和缩写以及各种拼写错误的社交媒体平台，会显著降低数据的可靠性和准确性。\n-   **价值（Value）**：价值是大数据另一个需要考虑的“V”。数据已发展为一种内在的货币。与传统货币一样，大数据的最终价值取决于从从中收集的见解的用性和质量。\n\
  \n## 大数据的重要性与应用\n\n为了从数据集中获得准确可靠的信息，必须拥有完整的数据，这可以通过大数据技术完成。我们拥有的数据越多，从中获取的细节和见解就越多。大数据的未来对于获得问题的\
  \ 360 度视图及其解决方案非常有前景。以下是大数据应用的一些示例：\n\n### 产品开发\n大数据越来越多地被大型和小型电子商务公司用于理解客户需求和期望。公司可以使用过去和当前产品的业务特征，为新产品的发布创建预测模型。例如，`Procter\
  \ & Gamble` 这样一家大型消费品公司广泛利用从社交媒体网站、测试市场和小组收集的大量信息。\n\n### 预测性维护\n大量的非结构化数据（如错误消息、日志条目）必须与可用的结构化数据（如制造和生产年份）一起进行评估。通过使用必要的分析工具评估大数据，企业可以提前进行计划维护并预测未来的设备故障，延长设备寿命。\n\
  \n### 客户体验\n“智能客户”对所有技术进步了如，通过分析与产品服务的互动中收集的信息提供独特的客户体验。通过提供个性化推荐和折扣优惠，公司可以降低客户流失率并将潜在线索转化为买。\n\
  \n### 欺诈与合规\n大数据能够识别数据模式，并通过评估过去交易的趋势来防止未来可能的欺诈交易。银行、金融机构和如 `PayPal` 等网络支付服务不断跟踪并收集客户交易信息，试图避免欺诈。\n\
  \n### 运营效率\n使用预测分析，公司可以通过评估制造能力、客户反馈和畅销商品来预测未来需求。\n\n### 机器学习\n为了让机器能够学习，需要海量的数据。包含结构化、半结构化和非结构化数据的可靠数据集将帮助机器建立世界的维度视图。\n\
  \n### 驱动创新\n通过研究和理解个人与设备之间的互动，公司可以通过满足预期来改进产品。\n\n## 数据挖掘（DATA MINING）\n\n数据挖掘技术被定义为探索和分析海量数据以收集有意义模式和规则的过程。数据挖掘属于数据科学范畴，并用于构建基于人工智能的机器学习模型，例如搜索引擎算法。虽然“挖掘数据”以预测未来事件的过程已经存在了一久，但“数据挖掘”一词直到世纪\
  \ 90 年代才被创造。数据挖掘由三个密切相关的学科组成，即`统计`（数据关系的数学研究）、`机器学习`（可以学习的算法）和`人工智能`（可以显示人类智能的机器）。\n\
  \n## 数据挖掘的重要性与应用\n\n数据挖掘技术的应用广泛，从零售定价和促销到金融机构和银行的贷款评估。整个行业的公司都可以从数据挖掘技术中受益。\n\n\
  ### 医疗信息学\n医疗从业人员使用统计模型根据风险因素估计患者患上一种或多种疾病的概率。通过对患者健康状况的遗传、家庭和人口数据进行建模，可以避免或缓解遗传性疾病。发展中国缺乏医疗专家，因此辅助诊断和患者分级至关重要。基于数据挖掘的模型最近在这些国家实施，以在医疗从业人员实现治疗之前协助患者分级。\n\
  \n### 贷风险管理\n金融机构和银行实施基于数据挖掘的工具和模型，预测潜在信用卡客户未能按时还款的概率，并确定客户可能符合的贷款额度。这些数据挖掘模型从许多输入源收集并提取信息，包括个人信息、客户财务历史和人口统计等。模型然后根据评估的贷款风险由机构或银行向客户提供利率。例如，数据挖掘模型会考虑申请人的信用评分，并为低分者提供较高的利率。\n\
  \n### 垃圾邮件过滤\n许多邮件客户端如 `Google mail` 和 `Yahoo mail` 依赖数据挖掘工具来检测和标记垃圾邮件和恶意软件。数据挖掘工具通过分析垃圾和恶意软件的成百上万的共享特征，生成用于开发改进安全措施和工具的见解和理解。这些应用程序不仅能够检测垃圾邮件，而且在分类垃圾信息并存储在独立目录中使其永进入收件箱非常有效。\n\
  \n### 营销\n零售业务需要了解客户的需求和期望。企业可以使用数据挖掘工具评估订单历史、人口统计、性别和年龄等客户相关信息，并根据共同的购物特征将他们分为不同的组织。然后公司开发独特的广告策略和活动来针对特定群体，如折扣优惠和产品促销。\n\
  \n### 情感分析\n公司可以使用名为 `text mining` 的方法分析其所有社交媒体平台的数据，以了解其客户群的“情感”。这种理解大量人群对特定主题情感的过程被称为`情感分析`，可以使用数据挖掘工具进行。使用模式识别技术，从社交媒体平台和其他相关的公共内容网站输入数据通过`text\
  \ mining` 技术收集，数据趋势进入对该主题的通用知识。\n\n### 定性数据挖掘\n`text mining` 方法还可以用于进行定性研究并从大量的非结构化数据中获取见解。加州大学伯伯克利分校的一项近期研究披露了数据挖掘模型在儿童福利计划中的应用。\n\
  \n\n\n\n\n## 1. 知识\n机器需要大量的信息来理解和处理真实世界。对于人工智能知识工程的发展来说，无缝访问通过数据存储存储和管理的信息对象、类别、特征和交互至关重要。\n\
  \n## 2. 学习\n测试与纠错（testing and error）的这一长青技术往往是人工智能技术最容易的教学类型。\n\n## 3. 解决问题\n“通过搜索一系列可能的行动来达到预定义目标或解决方案的系统过程”可以被定义为解决问题。\n\
  \n## 4. 推理\n根据当前场景进行推断的能力被称为推理行为。两种公认的推理类型是“演绎推理”（如果假设成立，则结论为真）和“归纳逻辑”（即使假设成立，结论也可能真实也可能虚假）。人工智能技术增长和推广过程中面临的最具挑战性的任务之一是“真推理”的实现。\n\
  \n## 5. 感知\n感知涉及使用不同的感官器官创建物体的三维视图的过程，并直接受周围环境的影响。人工智能感知已经创造了自动驾驶汽车以及收集和供应产品的能力。\n\
  \n\n\n\n\n机器学习库是使用任何给定语言编写的敏感例程和函数。软件开发人员需要一套健壮的库来执行复杂任务，而无需重写多行代码。机器学习在很大程度上基于数学优化、概率论和统计学。Python\
  \ 是成为机器学习领域的首选语言，这归功于其持续的开发周期和灵活性。它非常适合开发复杂的模型和生产引擎，这些引擎可以直接插到生产系统环境中。它最大的资产之一是极其丰富的库集，这些库可以帮助对于开发知识储备较少的研究人员轻松地执行机器学习。\n\
  \n“Scikit-Learn”已发展成为 Python 机器学习的黄金标准，提供了多种“监督式”和“无监督”机器学习算法。它被誉为迄今为止最用户友好、代码最整洁的机器学习库之一。例如：决策树、聚类、线性回归和逻辑回归以及\
  \ K-means。Scikit-learn 使用了几个基础 Python 库：`NumPy` 和 `SciPy`，并为数据挖掘任务（包括分类、回归和聚类）添加了一套算法。它还能仅用几行代码就实现特征选择、数据转换和集成方法等任务。\n\
  \n2007 年，David Cournapeau 作为“Google”“代码之夏”项目的一部分开发了“Scikit-Learn”的基础代码。自 2007 年发布以来，Scikit-learn\
  \ 已经成为 Python 最著名的开源机器学习库之一。但直到 2010 年，Scikit-Learn 才被向公众发布。Scikit-Learn 是一个开源且采用\
  \ BSD 许可协议的数据挖掘和数据分析工具，用于基于 Python 开发监督式和无监督机器学习算法。Scikit-learn 提供了各种机器学习算法，如“分类”、“回归”、“降维”和“聚类”。它还提供了用于特征提取、数据处理和模型评估的模块。\n\
  \nScikit-Learn 设计为“SciPy”库的扩展，基于最流行的 Python 库——“NumPy”和 `matplotlib`。`NumPy` 扩展了\
  \ Python，以支持对大型数组和多维矩阵进行高效操作。`Matplotlib` 提供了视觉化工具，而科学计算模块则由 `SciPy` 提供。对于学术研究，Scikit-Learn\
  \ 非常受欢迎，因为它拥有文档齐全、易于使用且灵活的 API。开发者只需通过修改几行代码，就可以利用 Scikit-Learn 对各种算法进行实验。Scikit-Learn\
  \ 还提供了多种训练数据集，使开发者能够专注于算法，而不是数据收集和清洗。Scikit-Learn 的许多算法运行速度快，且对于除巨大数据集以外的所有数据集都具有可扩展性。Scikit-learn\
  \ 以其可靠性著称，该库的大部分提供了自动化测试。Scikit-learn 在机器学习初学者中非常流行，用于他们开始实现简单算法。\n\n## 应用 Scikit-Learn\
  \ 库的准备工作\n\nScikit-Learn 库基于 `SciPy`（科学 Python），在使用 ScKit-Learn 之前需要安装它。该技术栈涉及以下内容：\n\
  \n### NumPy（基础 n 维数组包）\n`NumPy` 是 Python 中用于科学计算的基础包。它包括但不限于：“一个强大的 N 维数组对象；复杂的（广播）函数；集成\
  \ C/C++ 和 Fortran 代码的工具；实用的线性代数、傅里叶变换和随机数功能”。除了显而易见的科学用途外，`NumPy` 被认为是通用数据的有效多维容器。可以定义任意数据类型。这使得\
  \ `NumPy` 能够无缝快速地与各种数据库集成。`NumPy` 的主要目标是多维数组的同性。它由一个元素表（通常是数字）组成，所有元素类型相同，并由非负整数组指示。`NumPy`\
  \ 的维度被称为“轴”（axes），数组类被称为 `ndarray`。\n\n### Matplotlib（全面的 2D/3D 绘图）\n`Matplotlib`\
  \ 是一个 Python 的二维图形生成库，可以在多种纸质格式和交互式环境中生成高质量的数字内容。“Python 脚本”、“Python”、“IPython shell”、“Jupyter\
  \ notebook”、Web 应用服务器以及特定的用户界面工具包都可以与 `matplotlib` 一起使用。`Matplotlib` 尝试进一步简化简单任务，并使困难任务变得可行。只需几行代码，你就可以生成轨迹、直方图、散点图、柱状图、误差图等。`Pyplot`\
  \ 模块提供了一个类似于 MATLAB 的接口，以便于绘图，特别是在与 IPython 配合时。作为高级用户，你可以通过面向对象的接口或类似于为 MATLAB\
  \ 用户提供的特征集来控制整个行样式、字体属性和轴属性。\n\n### SciPy（科学计算的基础库）\n`SciPy` 是“一个基于 Python NumPy\
  \ 扩展的数学算法和便利函数集合”，它通过为用户提供层级数据操作和可视化命令以及课程，增加了对交互式 Python 会话的影响。带有 `SciPy` 的交互式\
  \ Python 会话变成了一个足以竞争数据处理和系统原型技术的环境，包括“MATLAB, IDL, Octave, R-Lab 和 SciLab”。在 Python\
  \ 上开发“SciPy”的另一个优势是在开发高级程序和特定应用时可以使用这种强大的编程语言。使用 `SciPy` 的科学性应用受益于全球开发者在无数软件利基市场中开发额外的模块。产生的所有内容对\
  \ Python 程序员都是可见的，从数据库子程序、类以及“并行编程到网络”。这些强大的工具随“SciPy”数学库一起提供。\n\n### IPython（增强型交互式控制台）\n\
  `IPython`（交互式 Python）是一个用于各种编程语言进行交互计算的接口或命令行。`IPython` 最初专门为 Python 创建，支持内省、富媒体、shell\
  \ 语法、标签补全和历史记录。`IPython` 的一些功能包括：交互式 shell（终端和基于 Qt 的）；带有代码、文本、数学、内联绘图和其他媒体的基于浏览器的\
  \ notebook 接口；可以嵌入加载到你的项目中的灵活解释器；并行计算的工具。\n\n### SymPy（符号数学）\n`SymPy` 由 Ondřej Čertík\
  \ 和 Aaron Meurer 开发，“是一个一个用于符号计算的开源 Python 库”。它为其他应用提供代数计算能力，作为一个独立应用，也可以在互联网上通过“SymPy”运行。“SymPy”易于安装和测试，因为它是完全用\
  \ Python 开发的。SymPy 涉及从微积分、离散数学到量子物理的各种特性。计算结果可以格式化为“LaTeX”。与广泛使用的语言中简单、可扩展的代码相结合，`SymPy`\
  \ 提供的易访问性使其成为一个门槛较低的计算机代数系统。\n\n### Pandas（数据结构与分析）\n`Pandas` 提供了高度直观且用户友的数据结构。`Pandas`\
  \ 在机器学习算法社区中非常受欢迎，具有内置的数据聚合、分组和过滤技术，以及时间序列分析的结果。`Pandas` 库有两个主要结构：一维的 `Series` 和二维的\
  \ Frames。\n\n### Seaborn（数据可视化）\n`Seaborn` 派自 Matplotlib 库，是一个极其流行的可视化库。它是一个高级库，可以生成特定类型的图表，包括热图、时间序列和小提琴图。\n\
  \n\n最新版本的 Scikit-Learn 可以在 `ikit-Learn.org` 上找到，需要 `Python`（版本 >= 3.5）；`NumPy`（版本\
  \ >= 1.1.0）；`SciPy`（版本 >= 0.17.0）；`joblib`（版本 >=11）。scikit-learn 的绘图功能以 `plot_`\
  \ 开头，需要 `Matplotlib`（版本 >= 1.5.1）。某些 Scikit-Learn 示例可能需要额外的应用：`Scikit-Image`（版本\
  \ >=.12.3），`Pandas`（版本 >=18.0）。在之前安装了 `NumPy` 和 `SciPy` 的情况下，安装 Scikit-Learn 的最佳方法是：\n\
  \n`pip install -U scikit-learn`\n\n或\n\n`conda install scikit-learn`\n\n必须确保在使用\
  \ pip 时使用了“二进制轮”，并且 `NumPy` 和 `SciPy` 没有被重新编译，这可能发生在特定的操作系统上（例如树莓派）。开发 `NumPy` 和\
  \ `SciPy` 往往是复杂的，因此需要仔细设置优化执行。\n\n## 使用 Scikit-Learn 应用机器学习\n\n为了理解 Scikit-Learn\
  \ 如何用于机器学习的开发，让我们使用来自 IBM Watson 仓库的 `Sales_Win_Loss` 数据集，构建一个机器学习模型来预测哪些销售活动将获胜，哪些将损失。数据集可以使用\
  \ `Pandas` 导入，并使用 `Pandas` 技术如 `head()` 和 `tail()` 进行探索。\n\n### 为了处理数据\n使用 Scikit-Learn\
  \ 的 `preprocessing.LabelEncoder()` 以及 `train_test_split()` 将数据集划分为训练集和测试集。为了生成预测，将使用三种不同的算法，即“支持向量分类”和“最近邻”。\n\
  \n### 为了比较这些算法的性能\n使用 Scikit-Learn 库的 `accuracy_score` 来比较这些算法的性能。\n\n### 导入数据集\n\
  导入 `Sales_Win_Loss` 数据集的第一步是导入 `Pandas` 模块：\n\n```python\nimport pandas as pd\n\
  ```\n\n然后我们利用变量 `url`：\n\n```python\nurl = \"https://community.watsonanalytics.com/wp-content/uploads/2015/04/Sales-Win-Loss.csv\"\
