  \  plt.xlabel('{} {:2.0f}% ({})'.format(class_names[predicted_label],\n        \
  \                       100*np.max(predictions_array),\n                       \
  \              class_names[true_label],\n                                     color=color))\n\
  \ndef plot_value_array(i, predictions_array, true_label):\n  predictions_array,\
  \ true_label = predictions_array[i], true_label[i]\n  plt.grid(False)\n  plt.xticks([])\n\
  \  plt.yticks([])\n  thisplot = plt.bar(range(10), predictions_array, color='#777777')\n\
  \  plt.ylim([0, 1])\n  predicted_label = np.argmax(predictions_array)\n  thisplot[predicted_label].set_color('red')\n\
  \  thisplot[true_label].set_color('blue')\n```\n\n要为预测生成图形或图表（如下所示），使用下面的命令：\n\n\
  ```python\nplot_value_array(0, predictions_single, test_labels)\nplt.xticks(range(10),\
  \ class_names, rotation=45)\nplt.show()\n```\n\n现在，例如，你可能想为测试集中的某张图片生成预测。你可以使用下面的命令：\n\
  \n```python\n# 从测试集中获取图像\nimg = test_images[0]\nprint(img.shape)\n```\n`(28, 28)`\n\
  \n为了使用 `tf.keras` 模型生成此预测，必须将图片添加到列表中，因为这些模型是针对一次一个“数据集”的预测而优化的。使用下面的命令来实现这一点：\n\
  \n```python\n# 将图像添加到只有一个成员的批次中\nimg = np.expand_dims(img,0)\nprint(img.shape)\n\
  ```\n`(1, 28, 28)`\n\n现在，使用下面的命令 `tf.keras` 为图片生成预测：\n\n```python\npredictions_single\
  \ = model.predict(img)\nprint(predictions_single)\n```\n生成的预测将类似于下面的代码：\n\n```python\n\
  [[6.5837266e-06, 1.3648087e-10, 4.1718483e-08, 1.1517859e-10, 8.3093937e-07, 1.4991476e-01,\
  \ 3.1148918e-06, 4.6347316e-02, 6.1082108e-05, 8.0366623e-01]]\n```\n\n`model.predict`\
  \ 生成的输出是一个“列表的列表”，对应测试集中的每张图片。要专门为我们之前使用的特定图片生成预测，请使用下面的命令：\n\n```python\nprediction_result\
  \ = np.argmax(predictions_single[0])\nprint(prediction_result)\n```\n生成的输出或预测结果应该是我们之前得到的\
  \ `9`。\n\n\n\n\n\n# 第 6 章：数据预处理与训练集的创建\n\n数据预处理是一种“数据挖掘技术，用于将原始数据转换为可理解且有效的格式”。现实世界中的数据往往缺乏某些行为或趋势，并且几乎是不完整、不一致和/或缺失属性值，且充满了错误或离群值。预处理数据是解决此类问题的有效方法。这些来自世界的原始数据或真实数据无法直接通过机器学习模型。因此，在将真实数据输入机器学习模型之前，我们需要对其进行清洗和预处理。\n\
  \n## 概述\n\n### 数据预处理\n\n#### 数据清洗\n数据中可以发现许多无意义和缺失的部分。数据清洗是为了管理这些缺陷，并构成处理包含缺失值和噪声数据的数据集。\n\
  \n##### 缺失数据\n在这种情况下，数据集中的某些重要信息缺失。可以从不同方面进行处理，例如：\n- **忽略元组**：这种策略仅在数据集很大且元组内缺少多个值时才适用。\n\
  - **填充缺失值**：此任务可以通过不同的方式完成，例如：使用平均属性或最相关的值手动填补缺失值。\n\n##### 噪声数据\n“噪声数据”是机器或机器学习模型无法解释的无效数据。它可能是由于数据采集缺陷或数据输入错误等导致的。可以使用以下方法解决：\n\
  - **分箱法 (Binning Method)**：该技术对排序后的数据进行操作以使其平滑。将整个数据集分成等大小的部分，然后使用不同的技术完成工作。每个部分单独进行修复。为了修复整个数据集，可以将部分中的所有数据点替换为其“平均值”或最可能值。\n\
  - **回归 (Regression)**：在这种情况下，可以通过拟合“回归函数”来平滑数据，该函数可以是“线性的”（有一个自变量）或“多元的”（有多个自变量）。\n\
  - **聚类 (Clustering)**：该技术用于将相似的数据点分组到簇中。离群值可以通过落在簇之外的数据点获得，或者无法被检测。\n\n#### 数据转换\n\
  该技术用于将数据转换为适用于数据挖掘的方法。包括以下方式：\n- **归一化 (Normalization)**：该技术用于将数据值缩缩在定义的范围内，例如“-1.0\
  \ 到 1.0”或“0.0 到 1.0”。\n- **属性选择 (Attribute Selection)**：可以使用此技术从现有的特征数据集中生成新的数据属性，以辅助数据挖掘过程。\n\
  - **离散化 (Discretization)**：该技术用于“用区间或概念水平替换数值属性的原始值”。\n- **分层次概念的生成**：该技术用于在分级设置中将低级数据属性转换为高级别。例如，你可以将“城市”属性转换为“国家”。\n\
  \n#### 数据压缩\n“数据挖掘”是一种用于从大数据中进行分析和提取见解的方法。在这种情况下，鉴于数据量巨大，分析变得越来越困难。我们使用数据压缩方法将数据集的数据量减少到最佳且可管理的规模。通过这种方法可以显著降低数据存储和分析的成本，同时提高数据存储的有效性。可以从不同方面进行处理：\n\
  - **数据立方聚合 (Data Cube Aggregation)**：该技术用于对数据应用“聚合操作”，以有效构建数据立方。\n- **属性子集选择**：该技术用于确保只使用必要的属性。\n\
  - **数量缩减 (Numerosity Reduction)**：该技术允许存储数据集而非全部数据。\n- **降维 (Dimensionality Reduction)**：该技术使用机制来减少数据。如果初始数据集可以压缩，则被称为“损失压缩”。减少数据的两种高效技术是“小波变换”和“PCA（主成分分析）”。\n\
  \n## 数据处理步骤\n\n### I – 导入数据库\n有多种数据库可供选择以满足你的数据需求，例如：\n- `Pandas`：广泛用于数据操作。\n- `NumPy`：一个使用\
  \ Python 执行科学计算的基础包。\n- `Matplotlib`：用于创建 2D 绘制的标准库。\n- `Seaborn`：源自 `Matplotlib`，一个极其流行的可视化库。\n\
  - `Scikit-Learn`：用于数据预处理技术和算法。\n\n要导入上述库，使用以下代码：\n\n对于主库：\n```python\nimport pandas\
  \ as pd\nimport numpy as np\nimport time\n```\n\n对于可视化库：\n```python\nfrom matplotlib\
  \ import pyplot as plt\nimport seaborn as sns\nfrom mpl_toolkits.plot3d import Axes3D\n\
  plt.style.use('ggplot')\n```\n\n对于 Scikit-Learn 库：\n```python\nfrom sklearn.neighbors\
  \ import KNeighborsClassifier\nfrom sklearn.model_selection import train_test_split\n\
  from sklearn.preprocessing import normalize\nfrom sklearn.metrics import confusion_matrix,accuracy_score,precision_score,recall_score,f1_score,matthews_corrcoef,classification_report,roc_curve\n\
  from sklearn.externals import joblib\nfrom sklearn.preprocessing import StandardScaler\n\
  from sklearn.decomposition import PCA\n```\n\n### II – 数据探索\n为了对 `Pandas` 中导入的数据集有所了解，请使用以下代码：\n\
  ```python\n# 使用 pandas 读取 CSV 文件中的数据\ndf = pd.read_csv('../input/creditcard.csv')\n\
  df.head()\n```\n\n### III – 检查缺失值\n理解缺失值的概念对于有效管理数据关重要。如果研究人员没有正确处理缺失值，可能会得出错误的数据推断。由于处理不当，产生的结果将与包含缺失值的结果不同。你可以应用以下任何技术来处理数据集中的缺失数据值：\n\
  \n1. **忽略数据行**：这通常在“类别标签”缺失或某行中缺少多个数据属性时执行，假设数据挖掘的目标是分类。然而，如果此类缺失类别标签的行比例很高，你将得到糟糕的输出。例如，一个包含学生入学数据（年龄、SAT\
  \ 分数、地址等）的数据库，其中一列包含“低”、“中”和“高”来对他们的大学成就进行分类。假设目标是构建一个预测学生大学成就的模型。那些不包含成就列的数据行对于生成关于学生成功的预测没有帮助，因此在执行算法之前可以忽略并删除它们。\n\
  \n2. **使用全局常量填充缺失值**\n\n\n\n\n\n在这种技术中，会选择一个合适且新的全局常量值，例如“未知（unknown）”、“N / A”或“负无穷”，然后用它来填充所有缺失值。当尝试预测缺失值的协同努力没有意义时，就会采用这种技术。让我们再次考虑学生入学数据库的示例，假设某些学生缺少“居住州”属性的信息。用某个随机的州来填充，而不是使用“N/A”，是没有意义的。\n\
  \n### 3. 使用属性平均值\n\n该技术用于将数据库中特定属性的缺失值替换为该属性的“平均值或中位数（如果是离散的）”。例如，在美国家庭收入数据库中，如果一个家庭的平均收入为\
  \ `X`，那么该值就可以替换其他家庭记录中的缺失值。\n\n### 4. 对属于同一类别的所有样本使用属性平均值\n\n该技术用于将计算限制在特定类别中，以获得一个适用于我们正在搜索的行的数据数值，而不是通过搜索数据库的所有行来计算某个特定属性的“平均值（或中位数）”。例如，如果你有一个汽车价格数据库，它会将车辆分类为“豪华型”和“低预算型”等。将“豪华车”的缺失价格替换为所有豪华车的平均价格，可能比考虑了“低预算汽车”后获得的数值更精确。\n\
  \n### 5. 使用数据挖掘算法预测最可能的值\n\n可以使用数据挖掘算法，如“回归（Regression）”、“基于贝叶斯形式的推理型工具”、“决策树”、“聚类算法（K-Mean/Median，等）”来确定数据属性的可能值。例如，可以使用“聚类算法”来生成一组行，然后按照在技术\
  \ 3 中指示的方法计算该属性的平均值或中位数。另一个例子可能是使用“决策树”，在考虑数据集中所有其他属性的情况下，为缺失属性的最可能值生成预测。\n\n##\
  \ IV – 处理分类数据值\n\n分类属性只能取有限数量的可行值，且这些值通常是固定的。例如，如果一个数据集是关于用户相关的数据，那么“国家”、“性别”、“年龄组”等特征将构成该数据集。或者，如果你的数据集涉及商品或产品，你会发现诸如“产品类型”、“制造商”、“供应商”等属性。在数据集的语境下，这些都是分类属性。通常，这些属性存储为表示观测值不同特征的文本值。例如，性别被定义为“男性”或“女性”，产品类型可以定义为“电子产品”、“服装”、“食品”等。分类数据有三类：\n\
  \n*   **名型（Nominal）** – 类别仅有标签而没有先后顺序的属性类型被称为“名型特征”。例如，性别可以是“男性”（M）或“女性”（F），且没有优先级之分。\n\
  *   **序型（Ordinal）** – 类别带有优先顺序标签的属性类型被称为“序型特征”。例如，经济状况特征可以包含三个类别：“低”、“中”和“高”，它们具有固有的顺序。\n\
  *   **连续型（Continuous）** – 类别带有优先顺序标签的属性类型被称为“序型特征”（注：原文此处对连续型也重复了序型的描述）。\n\n###\
  \ 分类面临面临挑战\n\n分类属性只能取有限数量的可行值……（文本继续）\n\n*   分类属性可以包含多个级别，称为高基数（high cardinality）。\n\
  *   各种机器学习模型，如 `regression` 和 `SVM`，要求先将分类数据转换为数字。\n*   机器学习库不支持直接分类数据；它们需要对其进行转换。\n\
  \n## 分类数据的编码\n\n为了跨越这一障碍，下面将描述以下编码技术：\n\n#### 1. 替换分类值\n这是一种将分类值替换为整数的基础技术。可以使用\
  \ `Pandas` 中的 `replace()` 函数来实现此操作。\n\n#### 2. 标签编码\n将列中的分类值转换为数字的技术称为“标签编码（label\
  \ encoding）”。数值标签范围始终从 `0` 到 `n-1`。可以使用 `NumPy` 中的 `where()` 函数将一组类别编码为特定的数值。你可以使用\
  \ `Scikit-Learn` 中的 `LabelEncoder` 执行类似的标签编码。标签编码非常直观且简单，但该算法存在劣势，可能会误读数值。\n\n####\
  \ 3. 独热编码（One-Hot encoding）\n为了解决“标签编码”技术给机器学习算法带来的误读问题，可以将每个分类数据值转换为新列，并为该新列分配\
  \ `1` 或 `0`（真/假）值。在所有提供“独热编码”的机器学习库中，最简单的是 `Pandas` 中的 `get_dummies()` 技术。Scikit-Learn\
  \ 也通过 `LabelBinarizer` 和 `OneHotEncoder` 支持“独热编码”。\n\n\n\n\n\n该方法最初将类别编码为“序数（ordinal）”，然后将这些整数转换为二进制字符串，并将该二进制代码的数字划分为不同的列。因此，数据仅编码在少数维度中，而不是“独热编码（one-hot\
  \ encoding）”方法。在机器学习模型中实现二进制编码有多种方法，但简单的方法是安装 `category_encoders` 库。这可以通过 `cmd`\
  \ 运行 `pip install category_encoders` 完成。\n\n#### 5. 后差分编码（Backward difference encoding）\n\
  \n这种“后差分编码”方法属于分类属性的“对比编码方案（contrast coding scheme）”。一个“K”类别或水平特征通常以一系列“K-1”虚拟变量的形式进入“回归”。该技术的工作原理是比较某个水平的因变量“均值”与前一阶段因变量的“均值”。这种编码广泛用于“名义（nominal）”或“序数变量”。该技术的代码结构与\
  \ `category_encoders` 库中的任何其他技术都非常相似，只是该技术的运行命令是 `BackwardDifferenceEncoder`。\n\n\
  #### 6. 其他特征\n\n你有时需要处理指示观测点值范围的类别列，例如，“age”列可能包含如“0-20”、“20-40”、“40-60”等类别。虽然处理此类属性的方法有很多，但最流行的是：\n\
  \n1. 将类别值范围划分为两个不同的列，首先创建一个仅包含“age”一个特征的虚拟帧，然后使用 `split()` 和 `lambda()` 函数根据分隔符“(-)”将列拆分为“start”和“end”两列。\n\
  \n2. 使用 `split_mean()` 函数将类别值范围替换为选定的度量，例如范围的平均值。\n\n### V – 将数据集分为训练集和测试集子集\n\n\
  机器学习算法需要从样本数据集中学习，以便从输入数据集生成预测。通常，我们将数据集按 70:30 或 80:20 的比例进行划分，这意味着 70%的数据用作训练子集，30%的数据用作测试子集。然而，这种划分比例会根据数据集的形式和大小进行调整。在确保数据集随机划分的同时，手动划分数据集几乎是不可能的且徒劳的。Scikit-Learn\
  \ 库为我们提供了一个名为“模型选择库（Model Selection library）”的工具来协助完成任务。Scikit-Learn 库中有一个名为 `train_test_split`\
  \ 的 `class`。使用它，我们可以轻松按照所需的比例将数据集分为“训练”和“测试”数据集。使用此工具时需要考虑的一些参数有：\n\n* `Test_size`\
  \ - 它有助于确定作为测试数据集的数据大小，例如总数据集的比例。例如，将 `test_size` 值输入 0.3，数据集将按 30% 划分为测试数据集。如果你指定了这个参数，下一个参数可能会被忽略。\n\
  * `Train_size` – 只有在未指定 `test_size` 的情况下才指定此参数。该处理过程与 `test_size` 函数类似，但指定的数据百分比用于“训练集”。\n\
  * `Random_state` - 在此处输入一个整数供 Scikit-Learn 类使用，根据它在数据集划分期间激活“随机数生成器”。或者可以输入 `RandomState`\
  \ 类的实例，它将生成随机数。如果你这两个函数都不输入，将激活默认设置，它利用了 `np.random` 使用的 `RandomState` 实例。\n\n例如，下面图片中的数据集可以划分为两个子集：用于“独立特征”的“X”子集和用于“因变量”的“Y”子集，后者恰好是数据集的最后一列\
  \ ![](img/image962.jpg) 现在我们可以使用下面的代码将“x”数据集划分为两个子集：`xTrain` 和 `xTest`，同样将“y”数据集划分为两个子集\
  \ `yTrain` 和 `yTest`。\n\n```python\nfrom sklearn.model_selection import train_test_split\n\
  ```\n\n\n\n\n\n`xTrain, xTest, yTrain, yTest = train_test_split(x, y, test_size=0.2,\
  \ random_state=0)` 根据上述代码，测试数据集的大小将是整个数据集的 0.2 或 20%，剩余的 80% 数据将用于训练数据集。\n\n# 开发者的\
  \ Python 技巧与窍门\n\nPython 首次于 1989 年，被认为是对于入门级编码者和业爱好者来说非常友好且易于学习的编程语言。这对于对编程或编码新感兴趣的人来说是理想的，且不需要深厚的编程基础。这是因为\
  \ Python 的读取方式几乎与英语相同。因此，理解该语言工作原理所需的时间较少，可以将精力放在学习编程基础上。\n\nPython 是一种解释型语言，支持自动内存管理和面向对象编程。这种极其直观且灵活的编程语言可以用于机器学习算法、Web\
  \ 应用、数据挖掘和可视化、游戏开发等编码项目。\n\n你可以利用以下一些技巧和窍门来提升你的 Python 编程技能：\n\n### 两个数字的就交换\n```python\n\
  x, y = 100, 200\nprint(x, y)\nx, y = y, x\nprint(x, y)\n```\n输出结果 = `100 200 200\
  \ 100`\n\n### 反转字符串\n```python\na = \"machine\"\nprint(\"Reverse is\", a[::-1])\n\
  ```\n输出结果 = `Reverse is enihcam.`\n\n### 从多个列表元素创建单个字符串\n```python\na = [\"machine\"\
  , \"learning\", \"algorithms\"]\nprint(\" \".join(a))\n```\n输出结果 = `machine learning\
  \ algorithms`\n\n### 比较运算符的堆叠\n```python\nn = 10\nresult = 1 < n < 20\nprint(result)\n\
  result = 1 > n <= 9\nprint(result)\n```\n输出结果 = `True False`\n\n### 打印导入模块的文件路径\n\
  ```python\nimport os\nimport socket\nprint(os)\nprint(socket)\n```\n输出结果 = `<module\
  \ 'os' from '/usr/lib/python3.5/os.py'> <module 'socket' from '/usr/lib/python3.5/socket.py'>`\n\
  \n### Python 中枚举的使用\n```python\nclass MyName:\n    Geeks, For, Geeks = range(3)\n\
