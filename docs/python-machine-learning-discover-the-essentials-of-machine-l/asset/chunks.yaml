    # 大数据与大数据分析


    2001 年，高盛（Gartner）将大数据定义为“包含更多多样性、数量不断增长且速度不断加快的数据”；这导致了最初“大数据三要素（Three Vs）”的形成。大数据涉及来自无数无限信息源的源源不绝的结构化和非结构化数据洪流。这些信息集的规模巨大，无法使用传统的分析工具和技术进行分析，但它们在深处隐藏着丰富的宝贵见解。


    “大数据”的起源可以追溯到 20 世纪 60 年代和 70 年代，当时“第三次工业革命”刚刚开始启动，关系型数据库的增长也随着数据中心的建设而开始。但随着如
    `Google` 和 `Yahoo` 等免费搜索引擎的极易访问性，`YouTube` 等免费互联网娱乐服务，以及 `Facebook` 和 `Twitter`
    等社交媒体平台的兴起，大数据的概念近期占据了中心位置。


    公司从 2005 年开始意识到通过这些平台和服务产生了惊人数量的用户数据，同年，还开发了名为 `Hadoop` 的开源框架，用于收集和分析这些公司可以获得的海量数据转储。一种名为
    `NoSQL` 的非关系型或分布式数据库在同一时代开始流行，因为它具有存储和提取非结构化数据的能力。`Hadoop` 使企业能够以相对较低的成本非常方便的方式运营大数据。


    今天，随着尖端技术的兴起，不仅是人类，我们还开发了产生数据的机器。诸如物联网（IoT）和系统互联网（IoS）等智能设备技术使大数据的数量呈爆炸式增长。我们日常的家居用品和智能设备连接到互联网，能够追踪和记录我们的使用模式以及我们与这些产品的互动，并直接将所有这些信息馈入大数据中。


    机器学习技术的出现进一步增加了每天产生的信息量。据估计，“到 2020 年，每人每秒将产生 1.7 MB 的信息”。随着大数据的不断扩展，为了实现最大的可用性，仍有许多界限需要跨越。“大数据的性不在于你拥有多少数据，而在于你如何利用这些数据。你可以从任何来源获取数据并进行分析，以找到能够
    1) 降低成本，2) 缩短时间，3) 新产品开发和优化产品，以及 4) 智能决策的答案。” - SAS


    ## 大数据的 Vs（要素）


    -   **数量（Volume）**：给定数据集的“数量”必须远远大于传统数据集才能被分类为大数据。这些数据集主要由非结构化数据组成，结构化和半结构化数据有限。网页、搜索历史、移动应用程序和社交媒体平台等输入源可以提供意义不明的数据或非结构化数据。公司的规模和客户群通常与公司能够轻松获得的数据量成正比。

    -   **速度（Velocity）**：收集和处理数据的速度被称为大数据的速度。公司越来越多地使用本地和云服务器的结合来提高其数据收集的速度和存储。现代的“智能产品和设备”利用实时访问客户信息，为他们提供更具参与性和改进的用户体验。

    -   **多样性（Variety）**：传统上，数据集主要由结构化数据组成，辅以少量非结构化和半结构化数据，但大数据的出现产生了新的非结构化数据类型，如视频、文本、音频，这些需要先进的工具和技术进行清洗和处理，以提取有意义且可操作的见解。

    -   **真实性（Veracity）**：真实性是大数据分析另一个需要考虑的“V”。这涉及到数据的“可靠性或质量”。例如，像 `Facebook` 和 `Twitter`
    这样带有博客和帖子、充斥标签和缩写以及各种拼写错误的社交媒体平台，会显著降低数据的可靠性和准确性。

    -   **价值（Value）**：价值是大数据另一个需要考虑的“V”。数据已发展为一种内在的货币。与传统货币一样，大数据的最终价值取决于从从中收集的见解的用性和质量。


    ## 大数据的重要性与应用


    为了从数据集中获得准确可靠的信息，必须拥有完整的数据，这可以通过大数据技术完成。我们拥有的数据越多，从中获取的细节和见解就越多。大数据的未来对于获得问题的
    360 度视图及其解决方案非常有前景。以下是大数据应用的一些示例：


    ### 产品开发

    大数据越来越多地被大型和小型电子商务公司用于理解客户需求和期望。公司可以使用过去和当前产品的业务特征，为新产品的发布创建预测模型。例如，`Procter &
    Gamble` 这样一家大型消费品公司广泛利用从社交媒体网站、测试市场和小组收集的大量信息。


    ### 预测性维护

    大量的非结构化数据（如错误消息、日志条目）必须与可用的结构化数据（如制造和生产年份）一起进行评估。通过使用必要的分析工具评估大数据，企业可以提前进行计划维护并预测未来的设备故障，延长设备寿命。


    ### 客户体验

    “智能客户”对所有技术进步了如，通过分析与产品服务的互动中收集的信息提供独特的客户体验。通过提供个性化推荐和折扣优惠，公司可以降低客户流失率并将潜在线索转化为买。


    ### 欺诈与合规

    大数据能够识别数据模式，并通过评估过去交易的趋势来防止未来可能的欺诈交易。银行、金融机构和如 `PayPal` 等网络支付服务不断跟踪并收集客户交易信息，试图避免欺诈。


    ### 运营效率

    使用预测分析，公司可以通过评估制造能力、客户反馈和畅销商品来预测未来需求。


    ### 机器学习

    为了让机器能够学习，需要海量的数据。包含结构化、半结构化和非结构化数据的可靠数据集将帮助机器建立世界的维度视图。


    ### 驱动创新

    通过研究和理解个人与设备之间的互动，公司可以通过满足预期来改进产品。


    ## 数据挖掘（DATA MINING）


    数据挖掘技术被定义为探索和分析海量数据以收集有意义模式和规则的过程。数据挖掘属于数据科学范畴，并用于构建基于人工智能的机器学习模型，例如搜索引擎算法。虽然“挖掘数据”以预测未来事件的过程已经存在了一久，但“数据挖掘”一词直到世纪
    90 年代才被创造。数据挖掘由三个密切相关的学科组成，即`统计`（数据关系的数学研究）、`机器学习`（可以学习的算法）和`人工智能`（可以显示人类智能的机器）。


    ## 数据挖掘的重要性与应用


    数据挖掘技术的应用广泛，从零售定价和促销到金融机构和银行的贷款评估。整个行业的公司都可以从数据挖掘技术中受益。


    ### 医疗信息学

    医疗从业人员使用统计模型根据风险因素估计患者患上一种或多种疾病的概率。通过对患者健康状况的遗传、家庭和人口数据进行建模，可以避免或缓解遗传性疾病。发展中国缺乏医疗专家，因此辅助诊断和患者分级至关重要。基于数据挖掘的模型最近在这些国家实施，以在医疗从业人员实现治疗之前协助患者分级。


    ### 贷风险管理

    金融机构和银行实施基于数据挖掘的工具和模型，预测潜在信用卡客户未能按时还款的概率，并确定客户可能符合的贷款额度。这些数据挖掘模型从许多输入源收集并提取信息，包括个人信息、客户财务历史和人口统计等。模型然后根据评估的贷款风险由机构或银行向客户提供利率。例如，数据挖掘模型会考虑申请人的信用评分，并为低分者提供较高的利率。


    ### 垃圾邮件过滤

    许多邮件客户端如 `Google mail` 和 `Yahoo mail` 依赖数据挖掘工具来检测和标记垃圾邮件和恶意软件。数据挖掘工具通过分析垃圾和恶意软件的成百上万的共享特征，生成用于开发改进安全措施和工具的见解和理解。这些应用程序不仅能够检测垃圾邮件，而且在分类垃圾信息并存储在独立目录中使其永进入收件箱非常有效。


    ### 营销

    零售业务需要了解客户的需求和期望。企业可以使用数据挖掘工具评估订单历史、人口统计、性别和年龄等客户相关信息，并根据共同的购物特征将他们分为不同的组织。然后公司开发独特的广告策略和活动来针对特定群体，如折扣优惠和产品促销。


    ### 情感分析

    公司可以使用名为 `text mining` 的方法分析其所有社交媒体平台的数据，以了解其客户群的“情感”。这种理解大量人群对特定主题情感的过程被称为`情感分析`，可以使用数据挖掘工具进行。使用模式识别技术，从社交媒体平台和其他相关的公共内容网站输入数据通过`text
    mining` 技术收集，数据趋势进入对该主题的通用知识。


    ### 定性数据挖掘

    `text mining` 方法还可以用于进行定性研究并从大量的非结构化数据中获取见解。加州大学伯伯克利分校的一项近期研究披露了数据挖掘模型在儿童福利计划中的应用。


