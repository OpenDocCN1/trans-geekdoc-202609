    \ in the second image.\n\n![](image581.jpg)\n![](image585.jpg)\n\nLet's begin\
    \ the real process of conversion now. Using the `fit_transform()` technique given\
    \ by `LabelEncoder()`, the labels in the categorical column like `Route To Market`\
