    ## Introduction

    Congratulations on purchasing Python Machine Learning: Discover the essentials
    of machine learning, data analysis, data science, data mining and artificial intelligence
    using Python Code with Python tricks and thank you for doing so. The following
    chapters will discuss the core concepts of “Machine Learning” models that are
    being developed and advanced using Python programming language. This book will
    provide you overarching guidance on how you can use Python to develop machine
    learning models using `Scikit-Learn` and `TensorFlow` machine learning libraries.


    You will start this book by gaining a solid understanding of the basics of machine
    learning technology and types of machine learning models. It is important to master
    the concepts of machine learning technology and learn how researchers are breaking
    the boundaries of data science to mimic human intelligence in machines using various
    learning algorithms. The power of machine learning technology has already started
    to manifest in our environment and in our everyday objects.


    The chapter 2 titled "Machine Learning Algorithms", you will learn the nuances
    of "12 of the most popular machine learning algorithms", in a very easy to understand
    language that requires no background in Python coding language and indeed might
    spike your interest in this field of research. You will learn about the foundational
    machine learning algorithms namely, supervised, unsupervised and reinforcement
    machine learning algorithms that serve as the skeleton of hundreds of machine
    learning algorithms being developed every day.


    The chapter 3, titled “Basics of Data Science technologies”, will provide you
    a clear and concise overview of various Data Science technologies that are shaping
    our present and will dictate our technological future, as experiences through
    the Fourth Industrial revolution. Data science is an umbrella term used for the
    cutting-edge technologies of today such as “big data or big data analytics”, “data
    mining technology”, “machine learning technology” and even “artificial intelligence
    technology”.


    In chapter 4, titled “Machine Learning Library “Scikit-Learn” 101”, we deep dive
    into the functioning of `Scikit-Learn` library along with the pre-requisites required
    to develop machine learning model using `Scikit-Learn` library. A detailed walkthrough
    with an open-source database using illustrations and actual Python code that you
    can try hands-on by following the instructions in this book. There is no better
    way to learn than to get your hands dirty and get real experience of the task.


    In chapter 5, titled "Neural Network Training With Tensorflow", you will learn
    the entire process of creating machine learning models using TensorFlow. Neural
    Networks are characterized by neuron-like entity that is capable of learning from
    input. TensorFlow is built on data sets. In the last chapter of the book, titled
    “Data Pre-processing and Creation of Data Set”, you will learn all about the most
    time consuming and critical aspect of machine learning. As a bonus, you will learn
    some Python tips and tricks to take your machine learning game to the next level.


    ## Chapter 1: Fundamentals Of Machine Learning

    The concept of Artificial Intelligence technology stems from the idea that machines
    are capable of human-like intelligence and can mimic human thought processing
    and learning capabilities, to adapt to new inputs and perform tasks without requiring
    human assistance. Machine learning technology (`ML`) is referred to the concept
    of Artificial Intelligence technology that focuses primarily on the engineered
    capability of machines to explicitly learn and self-train, by identifying data
    patterns to improve upon the underlying algorithm.


    In 1959, pioneering computer gaming and artificial intelligence expert, Arthur
    Samuel, coined the term “machine learning” during his tenure at IBM. Machine learning
    hypothesizes that modern-day computers can be trained using targeted data sets,
    that can be easily customized to develop desired functionalities. Machine learning
    is driven by the pattern recognition technique wherein the machine records and
    revisits past interactions and results, that are deemed in alignment with its
    current situation. Given the fact that machines are required to process the endless
    amount of data, with new data always pouring in, they must be equipped to adapt
    to the new data without needing to be programmed by a human, which speaks to the
    iterative aspect of `ML`. Here are some of the widely accepted definitions from
    select highly reputed sources:


    - “Machine learning is the science of getting computers to act without being explicitly
    programmed.” – Stanford University

    - “The field of Machine Learning seeks to answer the question, how can we build
    computer systems that automatically improve with experience, and what are the
    fundamental laws that govern all learning processes?” – Carnegie Mellon University

    - “Machine learning algorithms can figure out how to perform important tasks by
    generalizing from examples.” – University of Washington

    - "Machine Learning at its most basic is the practice of using algorithms to parse
    data, learn from it, and then decide or prediction about something in the world."
    – Nvidia

    - “Machine learning is based on algorithms that can learn from data without relying
    on rules-based programming.” – McKinsey.

