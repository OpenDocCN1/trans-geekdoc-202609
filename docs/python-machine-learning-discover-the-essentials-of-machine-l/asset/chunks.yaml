    # Chapter 2: Machine Learning Algorithms


    By utilizing prior computations and underlying algorithms, machines are now capable
    of learning from and training on their own to generate high-quality, readily reproducible
    decisions and results. The notion of machine learning has been around for a long
    time now, but the latest advances in machine learning algorithms have made large
    data processing and analysis feasible for computers. This is achieved by applying
    sophisticated and complicated mathematical calculations using high speed and frequency
    automation. Today''s advanced computing machines can analyze humongous information
    quantities quickly and deliver quicker and more precise outcomes. Companies using
    machine learning algorithms have increased flexibility to change the training
    data set to satisfy their company needs and train the machines accordingly. These
    tailored algorithms of machine learning enable companies to define potential hazards
    and possibilities for development. Typically, machine learning algorithms are
    used in cooperation with artificial intelligence technology and cognitive techniques
    to create computers extremely efficient and extremely effective in processing
    large quantities of information or big data and to generate extremely precise
    outcomes. There are four fundamental types of machine learning algorithms available
    today.


    ## Supervised machine learning algorithms


    Due to their ability to evaluate and apply the lessons learned from prior iterations
    and interactions to fresh input data set, the supervised learning algorithms are
    commonly used in predictive big data analysis. Based on the instructions given
    to effectively predict and forecast future occurrences, these algorithms can label
    all their ongoing runs. For instance, people can program the machine as `R` (Run),
    `N` (Negative) or `P` (Positive) to label its data points. The algorithm for machine
    learning will then label the input data as programmed and obtain data inputs with
    the right outputs. The algorithm will compare its own produced output to the `anticipated
    or correct` output, identifying future changes that can be created and fixing
    mistakes to make the model more precise and smarter. By using methods such as
    `regression`, `prediction`, `classification` and `ingredient boosting` to train
    the machine learning algorithms well, any new input data can be fed into the machine
    as a set of `target` data to orchestrate the learning program as desired. This
    `known training data set` jump-starts the analytical process followed by the learning
    algorithm to produce an `inferred feature` that can be used to generate forecasts
    and predictions based on output values for future occurrences. For instance, financial
    institutions and banks rely strongly on monitoring machine learning algorithms
    to detect credit card fraud and predict the probability of a prospective credit
    card client failing to make their credit payments on time. ![](image233.jpg)


    ## Unsupervised machine learning algorithms


    Companies often find themselves in a scenario where information sources are inaccessible
    that are needed to produce a labeled and classified training data set. Using unsupervised
    ML algorithms is perfect in these circumstances. Unsupervised ML algorithms are
    widely used to define how the machine can generate `inferred features` to elucidate
    a concealed construct from the stack of unlabeled and unclassified data collection.
    These algorithms can explore the data to define a structure within the data mass.
    Unlike the supervised machine learning algorithms, the unsupervised algorithms
    fail to identify the correct output, although they are just as effective as the
    supervised learning algorithms in investigating input data and drawing inferences.
    These algorithms can be used to identify information outliers, generate tailored
    and custom product recommendations, classify text subjects using methods such
    as `self-organizing maps`, `singular value decomposition` and `k-means clustering`.
    For instance, customer identification with shared shopping characteristics that
    can be segmented into particular groups and focused on comparable marketing strategies
    and campaigns. As a result, in the online marketing world, unsupervised learning
    algorithms are extremely popular. ![](image240.jpg)


    ## Semi-supervised machine learning algorithms


    Highly versatile, the `semi-supervised machine learning algorithms` are capable
    of using both labeled and unlabeled information set to learn from and train themselves.
    These algorithms are a `hybrid` of algorithms that are supervised and unsupervised.
    Typically, with a small volume of labeled data, the training data set is comprised
    of predominantly unlabeled data. The use of analytical methods including `forecast`,
    `regression` and `classification` in conjunction with semi-supervised learning
    algorithms enable the machine to considerably enhance its learning precision and
    training capabilities. These algorithms are commonly used in instances where it
    is highly resource-intensive and less cost-effective for the business to generate
    labeled training data set from raw unlabeled data. Companies use semi-supervised
    learning algorithms on their systems to avoid incurring extra costs of staff and
    equipment. For instance, the implementation of `facial recognition` technology
    needs a huge amount of facial data distributed across various sources of input.
    The raw data pre-processing, processing, classification and labeling, acquired
    from sources such as internet cameras, needs a lot of resources and hours of work
    to be used as a training data set.


    ## Reinforcement machine learning algorithms


    The `reinforcement machine learning algorithms` are much more distinctive in that
    they learn from the environment. These algorithms conduct activities and record
    the outcomes of each action diligently, which would have been either a failure
    resulting in mistake or reward for good performance. The two primary features
    that differentiate the reinforcement learning algorithms are the research method
    of `trial and error` and feedback loop of `delayed reward`. Using a range of calculations,
    the computer constantly analyzes input data and sends a reinforcement signal for
    each right or anticipated output to ultimately optimize the final result. The
    algorithm develops a straightforward action gaining feedback loop to evaluate,
    record and learn which actions have been effective and in a shorter time have
    resulted in correct or expected output. The use of these algorithms allows the
    system to automatically determine optimal behaviors and maximize its efficiency
    within the constraints of a particular context. The reinforcement machine learning
    algorithms are therefore strongly used in gaming, robotics engineering, and navigation
    systems.


    The machine learning algorithms have proliferated to hundreds and thousands and
    counting. Here are some of the most widely used algorithms:


    ### 1. Regression


    The methods of `regression` fall under the supervised machine learning category.
    They assist in predicting or describing a specific numeric value based on the
    set of preceding data, such as anticipating a property''s price based on preceding
    price data for comparable properties. Regression methods range from simple (such
    as `linear regression`) to complex (such as `regular linear regression`, `polynomial
    regression`, `decision trees`, `random forest regression` and `neural networks`,
    among others). The easiest technique of all is `linear regression`, where the
    `mathematical equation of the line (y= m* x+ b)` is used to model a data set.
    A `linear regression` model can be trained with multiple `data pairs (x, y)` by
    calculating a line''s position and slope that can reduce the overall distance
    between data points and the line. In other words, for a line that generates the
    best approximation for the data observations, the calculation of the `slope (m)`
    and `y-intercept (b)` is used.![](image254.jpg)


    For example, using `linear regression` technique to generate predictions for the
    energy consumption (in kWh) of houses by collecting the age of the house, some
    bedrooms, square footage area, and several installed electronic equipment. Now,
    we have more than one input (year built, square footage) it is possible to use
    `linear multi-variable regression`. The underlying process is the same as `one-to-one
    linear regression`, however, the `line` created was based on the number of variables
    in multi-dimensional space. The above plot demonstrates how well this model of
    linear regression fits the real construction energy consumption. In case you could
    gather characteristics such as year built and square footage, but you don''t understand
    the energy consumption then you are better off using the fitted line.


    ### 2. Classification


    The method of `classification` is another class of `supervised machine learning`,
    which can generate predictions or explanations for a `class value`. For example,
    this method can be used to predict if an online customer will purchase a particular.
    The result generated will be reported as a yes or no response i.e. `buyer` or
    `not a buyer`. But techniques of classification are not restricted to two classes.
    A classification technique, for instance, could assist to evaluate whether a picture
    includes a sedan or a SUV. The output will be three different values in this case:
    1) the picture contains a sedan, 2) the picture contains a SUV, or 3) the picture
    does not contain either a sedan or a SUV. `Logistic regression` is considered
    the easiest classification algorithm, though the term comes across as a `regression`
    technique that is far from reality. `Logistic regression` generates estimations
    for the likelihood of an event taking place based on single or multiple input
    values. For example, to generate estimation for the likelihood of a student being
    accepted to a specific university, a `logistic regression` will use the standardized
    testing scores and university testing score for a student as inputs. The generated
    prediction is a probability, ranging between ‘0'' and ‘1'', where 1 is full assurance.
    For the student, if the estimated likelihood is greater than 0.5, then the prediction
    would be that they will be accepted. If the projected probability is less than
    0.5, the prediction would be that they will be denied admission. The following
    graph shows the ratings of past learners as well as whether they have been accepted.
    Logistic regression enables creation of a line that can represent the `decision
    boundary`.![](image264.jpg)


    ### 3. Clustering


    We enter the category of unsupervised machine learning, with `clustering methods`
    because its objective is to `group or cluster observations with comparable features`.
    Clustering methods do not use output data to train but allow the output to be
    defined by the algorithm. Only data visualizations can be used in clustering techniques
    to check the solution''s quality. K-Means clustering, where ‘K’ is used to represent
    the number of `clusters` that the customer elects to generate and is the most
    common clustering method. (Note that different methods for selecting K value,
    such as the `elbow technique`, are available.) Steps used by K-Means clustering
    to process the data points:

