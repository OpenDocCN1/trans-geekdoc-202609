- fmt: "\n# Training a Neural Network using TensorFlow\n\nIn this exercise we will\
    \ develop a model of neural networks for classifying clothing images such as sneakers\
    \ and shirts, using TensorFlow library.\n\n## I – Import the dataset\n\nFor this\
    \ example, we will be using “Fashion MNIST” data set with 60,000 pictures representing\
    \ 10 different categories. The low-resolution pictures (28 to 28 pixels) indicate\
    \ individual clothing items. For the classic MNIST dataset, “Fashion MNIST” is\
    \ intended as a drop-in replacement. The “MNIST” data set includes pictures of\
    \ handwritten numbers (0, 1, and so on.) in the same format as the clothing items\
    \ used in this example.\n\nTo train the network, we will use 60,000 pictures and\
    \ 10,000 pictures will be used to assess the accuracy with which the network has\
    \ learned how to classify pictures. The “Fashion MNIST” data set is accessible\
    \ directly from TensorFlow, using the import command as below:\n\n```python\n\
    fashion_mnist = keras.datasets.fashion_mnist(train_images, train_labels), (test_images,\
    \ test_labels) = fashion_mnist.load_data()\n```\n\nAfter the dataset has been\
    \ loaded system will return 4 different “NumPy arrays” including:\n\n* The `train_images`\
    \ and `train_labels` arrays, which serve as the “training dataset” for the model.\n\
    * The `test_images` and `test_labels` arrays, which serve as the “testing dataset”\
    \ that the model can be tested against.\n\nNow we need to create labels for an\
    \ array of integers (0 to 9), corresponding to each category/class of the clothing\
    \ picture in the data set, using the command below which will look like the table\
    \ represented in the picture below. This will be useful in generating predictions\
    \ using our model.\n\n```python\nclass_names = ['T-shirt/top', 'Trouser', 'Pullover',\
    \ 'Dress', 'Coat', 'Sandal', 'Shirt', 'Sneaker', 'Bag', 'Ankle boot']\n```\n![](image702.jpg)\n\
    \n## II – Data Exploration\n\nTo get some sense of the data set, it can be explored\
    \ using the commands listed below:\n\n* To view the total number of images in\
    \ the “training data set” and the size of each image – `train_images.shape `,\
    \ which will produce the output displayed as `(60000, 28, 28)` stating we have\
    \ 60,000 pictures of 28 to 28-pixel size.\n* To view the total number of labels\
    \ in the “training dataset” – `len(train_labels) `, which will produce the output\
    \ displayed as `60000` stating we have 60,000 labels in the training data set.\n\
    * To view the data type of each label used in the “training dataset”– `train_labels\
    \ `, which will produce the output displayed as `array([9, 0, 0, ..., 3, 0, 5],\
    \ dtype=uint8 )` stating each label is an integer between o and 9.\n* To view\
    \ the total number of images in the “testing dataset” and the size of each image\
    \ – `test_images.shape `, which will produce the output displayed as `(10000,\
    \ 28, 28)` stating we have 10,000 pictures of 28 to 28-pixel size in the testing\
    \ data set.\n* To view the total number of labels in the “testing dataset” – `len(test_labels)\
    \ `, which will produce the output displayed as `10000` stating we have 10,000\
    \ labels in the testing data set.\n\n## III – Data Pre-processing\n\nTo make the\
    \ data suitable for training the model, it needs to be pre-processed. It is essential\
    \ to pre-process the data sets to be used for training and testing in the same\
    \ manner. For instance, you notice the first picture in the training data set\
    \ has the pixel values between 0 and 255, using the commands below:\n\n```python\n\
    plt.figure()\nplt.imshow(train_images[0])\nplt.colorbar()\nplt.grid(False)\nplt.show()\n\
    ```\n\nThese pixel values need to be scaled to fall between 0 to 1, prior to being\
    \ used as input for the Neural Network model. Therefore, the values need to be\
    \ divided by 255, for both the data subsets, using commands below:\n\n```python\n\
    train_images = train_images / 255.0\ntest_images = test_images / 255.0\n```\n\n\
    The final pre-processing step here would be to make sure that the data is is desired\
    \ format prior to building the Neural Network by viewing the first 20 pictures\
    \ from the training dataset and displaying the “class name” under each picture,\
    \ using commands below:\n\n```python\nplt.figure(figsize=(10,10))\nfor i in range(20):\n\
    \    plt.subplot(5,5,i+1)\n    plt.xticks([])\n    plt.yticks([])\n    plt.grid(False)\n\
    \    plt.imshow(train_images[i], cmap=plt.cm.binary)\n    plt.xlabel(class_names[train_labels[i]])\n\
    plt.show()\n```\n\n## IV – Building the Neural Network Model\n\nTo build up the\
    \ “Neural Network”, the constituting layers of the model first need to be configured\
    \ and only then the model can be compiled.\n\n### Configuring the layers\n\nThe\
    \ “layers” are the fundamental construction block of a neural network. These “layers”\
    \ take out information from the data entered generating representations that tend\
    \ to be extremely valuable addressing the problem. Majority of “deep learning”\
    \ involves stacking and linking fundamental layers together. The parameters that\
    \ are learned during practice are available in most of the layers, like `tf.keras.layers.Dense`.\
    \ To configure the required layers, use command below:\n\n```python\nmodel = keras.Sequential([\n\
    \    keras.layers.Flatten(input_shape=(28, 28)),\n    keras.layers.Dense(128,\
    \ activation=tf.nn.relu),\n    keras.layers.Dense(10, activation=tf.nn.softmax)\n\
    ])\n```\n\nThe `tf.keras.layers.Flatten` is the first layer in this network, which\
    \ turns the picture format from a 2-dimesnional array of 28x28 size to a 1-dimension\
    \ array with `28x28 = 784` pixels. Consider this layer as unchained rows of pixels\
    \ in the picture that arranged these pictures without any learning parameters\
    \ and capable of only altering the data. The network comprises of a couple `tf.keras.layers.Dense`\
    \ layers after pixels are flattened. These are neural layers that are fully or\
    \ densely connected. There are 128 nodes or neurons in the first Dense layer.\
    \ The succeeding and final layer is a 10-node layer of `Softmax `, which generated\
    \ an array of ten probability scores amounting to “1”. Every single node includes\
    \ a probability score indicating that one of the ten classes is likely to contain\
    \ the existing picture.\n\n### Compiling the model\n\nBefore being able to train\
    \ the model, some final tweaks are needed to be made in the model compilation\
    \ step, such as:\n\n* **Loss function**: This provides a measure of the model's\
    \ accuracy during training. This feature should be minimized so that the model\
    \ is \"directed\" in the correct direction.\n* **Optimizer**: These are the updates\
    \ made to the model based on the data it can view as well as its \"loss function\"\
    .\n* **Metrics**: Used for monitoring the training and testing procedures. For\
    \ example, the code below utilizes accuracy, measured by computing the fraction\
    \ of the pictures that were classified accurately.\n\n```python\nmodel.compile(optimizer='adam',\n\
    \             loss='sparse_categorical_crossentropy',\n             metrics=['accuracy'])\n\
    ```\n\n## V – Training the Model\n\n steps listed below are used to train the\
    \ “Neural Network Model”:\n\n* Feed the training data to the model, using `train_images`\
    \ and `train_labels` arrays.\n* Allow the network to learn an association of pictures\
    \ and corresponding labels.\n* Generate predictions using the model for a predefined\
    \ test data set, for example, the `test_images` array. Then the predictions must\
    \ be verified by matching the labels from the `test_labels` array.\n"
