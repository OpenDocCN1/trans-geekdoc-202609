    定义了图表的大小为 11.7px 和 8.27px。接下来使用命令 `sns.countplot(''Route To Market'',data= data,
    hue=''Opportunity Result'')` 生成图表。`countplot()` 技术允许创建计数图，可以暴露多个参数以根据我们的需求自定义计数图。作为第一个
    `countplot()` 参数的一部分，X 轴被定义为集合中的 `Route To Market` 列。下一个参数涉及数据集的来源，即我们之前导入的 `sales_data`
    数据框。第三个参数是柱状图的颜色，标记为 `won` 的列定义为蓝色，标记为 `loss` 的列定义为绿色。


    ## 数据预处理


    到目前，你应该对哪些可用信息有了清晰的理解。Scikit-Learn 的 `preprocessing.LabelEncoder()` 将用于处理数据，`train_test_split()`
    将数据集划分为训练集和测试集。为了生成预测，将使用三种不同的算法，即“支持向量分类”和“最近邻”。Scikit-Learn 的 `LabelEncoder()`
