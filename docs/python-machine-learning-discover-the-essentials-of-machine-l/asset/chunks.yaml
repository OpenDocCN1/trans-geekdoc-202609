    # 第 4 章：机器学习库 “Scikit-Learn” 入门


    机器学习库是使用任何给定语言编写的敏感例程和函数。软件开发人员需要一套健壮的库来执行复杂任务，而无需重写多行代码。机器学习在很大程度上基于数学优化、概率论和统计学。Python
    是成为机器学习领域的首选语言，这归功于其持续的开发周期和灵活性。它非常适合开发复杂的模型和生产引擎，这些引擎可以直接插到生产系统环境中。它最大的资产之一是极其丰富的库集，这些库可以帮助对于开发知识储备较少的研究人员轻松地执行机器学习。


    “Scikit-Learn”已发展成为 Python 机器学习的黄金标准，提供了多种“监督式”和“无监督”机器学习算法。它被誉为迄今为止最用户友好、代码最整洁的机器学习库之一。例如：决策树、聚类、线性回归和逻辑回归以及
    K-means。Scikit-learn 使用了几个基础 Python 库：`NumPy` 和 `SciPy`，并为数据挖掘任务（包括分类、回归和聚类）添加了一套算法。它还能仅用几行代码就实现特征选择、数据转换和集成方法等任务。


    2007 年，David Cournapeau 作为“Google”“代码之夏”项目的一部分开发了“Scikit-Learn”的基础代码。自 2007 年发布以来，Scikit-learn
    已经成为 Python 最著名的开源机器学习库之一。但直到 2010 年，Scikit-Learn 才被向公众发布。Scikit-Learn 是一个开源且采用
    BSD 许可协议的数据挖掘和数据分析工具，用于基于 Python 开发监督式和无监督机器学习算法。Scikit-learn 提供了各种机器学习算法，如“分类”、“回归”、“降维”和“聚类”。它还提供了用于特征提取、数据处理和模型评估的模块。


    Scikit-Learn 设计为“SciPy”库的扩展，基于最流行的 Python 库——“NumPy”和 `matplotlib`。`NumPy` 扩展了
    Python，以支持对大型数组和多维矩阵进行高效操作。`Matplotlib` 提供了视觉化工具，而科学计算模块则由 `SciPy` 提供。对于学术研究，Scikit-Learn
    非常受欢迎，因为它拥有文档齐全、易于使用且灵活的 API。开发者只需通过修改几行代码，就可以利用 Scikit-Learn 对各种算法进行实验。Scikit-Learn
    还提供了多种训练数据集，使开发者能够专注于算法，而不是数据收集和清洗。Scikit-Learn 的许多算法运行速度快，且对于除巨大数据集以外的所有数据集都具有可扩展性。Scikit-learn
    以其可靠性著称，该库的大部分提供了自动化测试。Scikit-learn 在机器学习初学者中非常流行，用于他们开始实现简单算法。


    ## 应用 Scikit-Learn 库的准备工作


    Scikit-Learn 库基于 `SciPy`（科学 Python），在使用 ScKit-Learn 之前需要安装它。该技术栈涉及以下内容：


    ### NumPy（基础 n 维数组包）

    `NumPy` 是 Python 中用于科学计算的基础包。它包括但不限于：“一个强大的 N 维数组对象；复杂的（广播）函数；集成 C/C++ 和 Fortran
    代码的工具；实用的线性代数、傅里叶变换和随机数功能”。除了显而易见的科学用途外，`NumPy` 被认为是通用数据的有效多维容器。可以定义任意数据类型。这使得
    `NumPy` 能够无缝快速地与各种数据库集成。`NumPy` 的主要目标是多维数组的同性。它由一个元素表（通常是数字）组成，所有元素类型相同，并由非负整数组指示。`NumPy`
    的维度被称为“轴”（axes），数组类被称为 `ndarray`。


    ### Matplotlib（全面的 2D/3D 绘图）

    `Matplotlib` 是一个 Python 的二维图形生成库，可以在多种纸质格式和交互式环境中生成高质量的数字内容。“Python 脚本”、“Python”、“IPython
    shell”、“Jupyter notebook”、Web 应用服务器以及特定的用户界面工具包都可以与 `matplotlib` 一起使用。`Matplotlib`
    尝试进一步简化简单任务，并使困难任务变得可行。只需几行代码，你就可以生成轨迹、直方图、散点图、柱状图、误差图等。`Pyplot` 模块提供了一个类似于 MATLAB
    的接口，以便于绘图，特别是在与 IPython 配合时。作为高级用户，你可以通过面向对象的接口或类似于为 MATLAB 用户提供的特征集来控制整个行样式、字体属性和轴属性。


    ### SciPy（科学计算的基础库）

    `SciPy` 是“一个基于 Python NumPy 扩展的数学算法和便利函数集合”，它通过为用户提供层级数据操作和可视化命令以及课程，增加了对交互式 Python
    会话的影响。带有 `SciPy` 的交互式 Python 会话变成了一个足以竞争数据处理和系统原型技术的环境，包括“MATLAB, IDL, Octave,
    R-Lab 和 SciLab”。在 Python 上开发“SciPy”的另一个优势是在开发高级程序和特定应用时可以使用这种强大的编程语言。使用 `SciPy`
    的科学性应用受益于全球开发者在无数软件利基市场中开发额外的模块。产生的所有内容对 Python 程序员都是可见的，从数据库子程序、类以及“并行编程到网络”。这些强大的工具随“SciPy”数学库一起提供。


    ### IPython（增强型交互式控制台）

    `IPython`（交互式 Python）是一个用于各种编程语言进行交互计算的接口或命令行。`IPython` 最初专门为 Python 创建，支持内省、富媒体、shell
    语法、标签补全和历史记录。`IPython` 的一些功能包括：交互式 shell（终端和基于 Qt 的）；带有代码、文本、数学、内联绘图和其他媒体的基于浏览器的
    notebook 接口；可以嵌入加载到你的项目中的灵活解释器；并行计算的工具。


    ### SymPy（符号数学）

    `SymPy` 由 Ondřej Čertík 和 Aaron Meurer 开发，“是一个一个用于符号计算的开源 Python 库”。它为其他应用提供代数计算能力，作为一个独立应用，也可以在互联网上通过“SymPy”运行。“SymPy”易于安装和测试，因为它是完全用
    Python 开发的。SymPy 涉及从微积分、离散数学到量子物理的各种特性。计算结果可以格式化为“LaTeX”。与广泛使用的语言中简单、可扩展的代码相结合，`SymPy`
    提供的易访问性使其成为一个门槛较低的计算机代数系统。


    ### Pandas（数据结构与分析）

    `Pandas` 提供了高度直观且用户友的数据结构。`Pandas` 在机器学习算法社区中非常受欢迎，具有内置的数据聚合、分组和过滤技术，以及时间序列分析的结果。`Pandas`
    库有两个主要结构：一维的 `Series` 和二维的 Frames。


    ### Seaborn（数据可视化）

    `Seaborn` 派自 Matplotlib 库，是一个极其流行的可视化库。它是一个高级库，可以生成特定类型的图表，包括热图、时间序列和小提琴图。


    ## 安装 Scikit-Learn


    最新版本的 Scikit-Learn 可以在 `ikit-Learn.org` 上找到，需要 `Python`（版本 >= 3.5）；`NumPy`（版本
    >= 1.1.0）；`SciPy`（版本 >= 0.17.0）；`joblib`（版本 >=11）。scikit-learn 的绘图功能以 `plot_`
    开头，需要 `Matplotlib`（版本 >= 1.5.1）。某些 Scikit-Learn 示例可能需要额外的应用：`Scikit-Image`（版本
    >=.12.3），`Pandas`（版本 >=18.0）。在之前安装了 `NumPy` 和 `SciPy` 的情况下，安装 Scikit-Learn 的最佳方法是：


    `pip install -U scikit-learn`


    或


    `conda install scikit-learn`


    必须确保在使用 pip 时使用了“二进制轮”，并且 `NumPy` 和 `SciPy` 没有被重新编译，这可能发生在特定的操作系统上（例如树莓派）。开发 `NumPy`
    和 `SciPy` 往往是复杂的，因此需要仔细设置优化执行。


    ## 使用 Scikit-Learn 应用机器学习


    为了理解 Scikit-Learn 如何用于机器学习的开发，让我们使用来自 IBM Watson 仓库的 `Sales_Win_Loss` 数据集，构建一个机器学习模型来预测哪些销售活动将获胜，哪些将损失。数据集可以使用
    `Pandas` 导入，并使用 `Pandas` 技术如 `head()` 和 `tail()` 进行探索。


    ### 为了处理数据

    使用 Scikit-Learn 的 `preprocessing.LabelEncoder()` 以及 `train_test_split()` 将数据集划分为训练集和测试集。为了生成预测，将使用三种不同的算法，即“支持向量分类”和“最近邻”。


    ### 为了比较这些算法的性能

    使用 Scikit-Learn 库的 `accuracy_score` 来比较这些算法的性能。


    ### 导入数据集

    导入 `Sales_Win_Loss` 数据集的第一步是导入 `Pandas` 模块：


    ```python

    import pandas as pd

    ```


    然后我们利用变量 `url`：


    ```python

    url = "https://community.watsonanalytics.com/wp-content/uploads/2015/04/Sales-Win-Loss.csv"

    ```


    使用 `pd.read_csv(url)` 技术下载数据集：


    ```python

    sales_data = pd.read_csv(url)

    ```


    对于 `Pandas` 用户，上述代码中提到的 `read_csv()` 技术将 csv 文件转换为 `Pandas` 数据框，其中每一行的索引都包含在 `sales_data`
    变量中，第一列的显示所示：


    ![](img/image542.jpg)


    在上面的图中，`row0, row1, row2` 代表单独的记录，`col0, col1, col2` 代表列的名称。通过这一步，你成功存储了数据集的副本并将其转换为“Pandas”框架！现在，使用
    `sales_data.head()` 技术显示数据帧中的初始记录，如下：


    ![](img/image549.jpg)


    ## 数据探索


    现在我们已经有了转换为“Pandas”数据帧的数据集，可以快速探索数据以了解它能告诉我们什么。在任何机器学习项目中，数据探索都是至关重要的阶段。快速的数据集探索可以提供我们可能遗漏的信息，这些信息可以随后回答问题。使用
    `sales_data.head(n=2)` 选择性地显示数据集的前 2 条记录。从一眼看去，`Supplies Group` 和 `Region` 列包含字符串数据，而
    `Opportunity Result` 等列则包含整数值。同样，使用 `sales_data.tail()` 可以选择表格底部的记录。使用 `Pandas`
    技术 `sales_data.dtypes` 可以查看数据集中的不同数据类型。通过这些信息，我们可以得出列 `Supplies Subgroup` 是 `object`
    类型，而 `Client Size By Revenue` 是 `integer` 类型。所以我们理解了列包含整数值或字符串数据。


    ## 数据可视化


    此时，我们已经完成了基础的数据探索步骤，因此我们将构建一些吸引人的图表来视觉化信息并发现数据集中的其他叙述。在所有提供数据可视化的 Python 库中，`Seaborn`
    是最佳选择之一，我们将使用它。确保你的系统中已安装了 `Seaborn` 模块并准备好使用。现在按照以下步骤生成数据集所需的图表：


    第 1 - 导入 `Seaborn` 模块：


    ```python

    import seaborn as sns

    ```


    第 2 - 使用命令导入 `Matplotlib` 模块：


    ```python

    import matplotlib.pyplot as plt

    ```


    第 3 - 将图表的背景颜色设为白色，使用命令 `sns.set(style="whitegrid", color=True)`。


    第 4 - 设置所有图表的大小，使用命令 `sns.set(rc={''figure.figsize'':(11.7,8.27)})`。


    第 5 - 生成 `countplot`，使用命令：


    ```python

    sns.countplot(''Route To Market'',data=sales_data, hue=''Opportunity Result'')

    ```


    第 6 - 使用命令移除顶部和底部的边距。


    第 7 - 使用命令显示图表：


    ```python

    plt.show()

