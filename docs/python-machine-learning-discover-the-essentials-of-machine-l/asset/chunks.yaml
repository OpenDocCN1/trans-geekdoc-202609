    ## 2. The data pre-processing and cleaning must result in a high-quality data
    set. This is the most critical and time-consuming step of the whole project. The
    larger the volume of data, the more noise it brings to the training data set which
    must be eradicated before feeding to the learner system.


    ## 3. Selection of appropriate learning model to meet the requirements of your
    project. This process tends to be rather simple given the various types of data
    models available in the market.


    ## 4. Depending on the domain the machine learning model is applied to, the results
    may or may not require a clear understanding of the model by human experts as
    long as the model can successfully deliver desired results.


    ## 5. The final step is to consolidate and deploy the knowledge or information
    gathered from the model to be used on an industrial level.


    ## 6. The whole cycle from step 1 to 5 listed above is iteratively repeated until
    a result that can be used in practice is achieved.


    ## Importance of machine learning

    To get a sense of how significant machine learning is in our everyday lives, it
    is simpler to state what part of our cutting edge way of life has not been touched
    by it. Each aspect of human life is being impacted by the "smart machines" intended
    to expand human capacities and improve efficiencies. Artificial Intelligence and
    machine learning technology is the focal precept of the “Fourth Industrial Revolution”,
    that could question our thoughts regarding being "human". Here are a few reasons
    to help you understand the significance of machine learning in our daily lives:


    - Automation of repetitive learning and revelation from data. Not at all like
    hardware-driven robotic automation that simply automates manual assignments, machine
    learning allows performance of high volume, computer-based tasks consistently
    and dependably.


    - Machine learning algorithms are helping Artificial Intelligence to adapt to
    the evolving world by allowing the machine or system to learn, take note and improve
    upon its prior errors. Machine learning algorithm functions as a classifier or
    a predictor to acquire new skills and identify data pattern and structure. For
    example, machine learning algorithm has generated a system that can teach itself
    how to play chess and even how to generate product recommendations based on customer
    activity and behavior data. The beauty of this model is that it adapts with every
    new set of data.


    - Machine learning has analyzed deeper and larger data set feasible with the use
    of neural networks containing multiple hidden layers. Think about it, a fraud
    detection system with numerous concealed layers would deem a work of fantasy just
    a couple of years ago. With the advent of big data and unlikely to envision computer
    powers, a whole new world is on the horizon. The data of the machines resemble
    the gas to the vehicle, the more data you can add to them, faster and more accurate
    results will get. Deep learning models flourish with an abundance of data because
    they gain straightforwardly from the data.


    - The “deep neural networks” of the machine learning algorithms have resulted
    in unbelievable accuracy. For example, frequent and repeated use of smart tech
    like "Amazon Alexa" and "Google Search", results in increased accuracy derived
    from deep learning. These "deep neural networks" are also empowering our medical
    field. Image classification and object recognition are now capable of finding
    cancer on MRIs with similar accuracy as that of a highly trained radiologist.


    - Artificial Intelligence is allowing for enhanced and improved use of big data
    analytics in conjunction with machine learning algorithms. Data has evolved as
    its currency and when algorithms are self-learning it can easily become “intellectual
    property”. The raw data is similar to a gold mine in that the more and deeper
    you dig, the more “gold” or valuable insight you can dig out or extract. Application
    of machine learning algorithms to the data can enable you to find the correct
    solutions quicker and makes for an upper hand. Keep in mind the best information
    will consistently win, although everyone is utilizing comparative techniques.

