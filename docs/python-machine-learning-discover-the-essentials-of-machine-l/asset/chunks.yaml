    在这种技术中，会选择一个合适且新的全局常量值，例如“未知（unknown）”、“N / A”或“负无穷”，然后用它来填充所有缺失值。当尝试预测缺失值的协同努力没有意义时，就会采用这种技术。让我们再次考虑学生入学数据库的示例，假设某些学生缺少“居住州”属性的信息。用某个随机的州来填充，而不是使用“N/A”，是没有意义的。


    ### 3. 使用属性平均值


    该技术用于将数据库中特定属性的缺失值替换为该属性的“平均值或中位数（如果是离散的）”。例如，在美国家庭收入数据库中，如果一个家庭的平均收入为 `X`，那么该值就可以替换其他家庭记录中的缺失值。


    ### 4. 对属于同一类别的所有样本使用属性平均值


    该技术用于将计算限制在特定类别中，以获得一个适用于我们正在搜索的行的数据数值，而不是通过搜索数据库的所有行来计算某个特定属性的“平均值（或中位数）”。例如，如果你有一个汽车价格数据库，它会将车辆分类为“豪华型”和“低预算型”等。将“豪华车”的缺失价格替换为所有豪华车的平均价格，可能比考虑了“低预算汽车”后获得的数值更精确。


    ### 5. 使用数据挖掘算法预测最可能的值


    可以使用数据挖掘算法，如“回归（Regression）”、“基于贝叶斯形式的推理型工具”、“决策树”、“聚类算法（K-Mean/Median，等）”来确定数据属性的可能值。例如，可以使用“聚类算法”来生成一组行，然后按照在技术
    3 中指示的方法计算该属性的平均值或中位数。另一个例子可能是使用“决策树”，在考虑数据集中所有其他属性的情况下，为缺失属性的最可能值生成预测。


    ## IV – 处理分类数据值


    分类属性只能取有限数量的可行值，且这些值通常是固定的。例如，如果一个数据集是关于用户相关的数据，那么“国家”、“性别”、“年龄组”等特征将构成该数据集。或者，如果你的数据集涉及商品或产品，你会发现诸如“产品类型”、“制造商”、“供应商”等属性。在数据集的语境下，这些都是分类属性。通常，这些属性存储为表示观测值不同特征的文本值。例如，性别被定义为“男性”或“女性”，产品类型可以定义为“电子产品”、“服装”、“食品”等。分类数据有三类：


    *   **名型（Nominal）** – 类别仅有标签而没有先后顺序的属性类型被称为“名型特征”。例如，性别可以是“男性”（M）或“女性”（F），且没有优先级之分。

    *   **序型（Ordinal）** – 类别带有优先顺序标签的属性类型被称为“序型特征”。例如，经济状况特征可以包含三个类别：“低”、“中”和“高”，它们具有固有的顺序。

    *   **连续型（Continuous）** – 类别带有优先顺序标签的属性类型被称为“序型特征”（注：原文此处对连续型也重复了序型的描述）。


    ### 分类面临面临挑战


    分类属性只能取有限数量的可行值……（文本继续）


    *   分类属性可以包含多个级别，称为高基数（high cardinality）。

    *   各种机器学习模型，如 `regression` 和 `SVM`，要求先将分类数据转换为数字。

    *   机器学习库不支持直接分类数据；它们需要对其进行转换。


    ## 分类数据的编码


    为了跨越这一障碍，下面将描述以下编码技术：


    #### 1. 替换分类值

    这是一种将分类值替换为整数的基础技术。可以使用 `Pandas` 中的 `replace()` 函数来实现此操作。


    #### 2. 标签编码

    将列中的分类值转换为数字的技术称为“标签编码（label encoding）”。数值标签范围始终从 `0` 到 `n-1`。可以使用 `NumPy` 中的
    `where()` 函数将一组类别编码为特定的数值。你可以使用 `Scikit-Learn` 中的 `LabelEncoder` 执行类似的标签编码。标签编码非常直观且简单，但该算法存在劣势，可能会误读数值。


    #### 3. 独热编码（One-Hot encoding）

    为了解决“标签编码”技术给机器学习算法带来的误读问题，可以将每个分类数据值转换为新列，并为该新列分配 `1` 或 `0`（真/假）值。在所有提供“独热编码”的机器学习库中，最简单的是
    `Pandas` 中的 `get_dummies()` 技术。Scikit-Learn 也通过 `LabelBinarizer` 和 `OneHotEncoder`
    支持“独热编码”。


