    ## 4. Dimension Reduction

    As the name indicates, to extract the least significant information (sometimes
    redundant columns) from a data set, we use "dimensionality reduction". In practice,
    data sets tend to contain hundreds or even thousands of rows (also known as characteristics),
    which makes it essential to reduce the total number of rows. For example, pictures
    may contain thousands of pixels, all those pixels are not important for the analysis.
    Or a large number of measurements or experiments can be applied to every single
    chip while testing microchips within the manufacturing process, the majority of
    which produce redundant data. In such scenarios, "dimensionality reduction" algorithms
    are leveraged to manage the data set.


    ### Principal Component Analysis

    "Principal Component Analysis" or (`PCA`) is the most common "dimension reduction
    technique", which decreases the size of the "feature space" by discovering new
    vectors that are capable of maximizing the linear variety of the data. When the
    linear correlations of the data are powerful, PCA can dramatically decrease the
    data dimension without losing too much information. PCA is one of the fundamental
    algorithms of machine learning. It enables you to decrease the data dimension,
    losing as little information as possible. It is used in many fields such as object
    recognition, vision of computers, compression of information, etc. The calculation
    of the main parts is limited to the calculation of the initial data''s vectors
    and covariance matrix values or of the data matrix''s unique decomposition. Through
    one we can convey several indications, merge, so to speak, and operate with a
    simpler model already. Of course, most probably, data loss will not be avoided,
    but the PCA technique will assist us to minimize any losses.


    ### t-Stochastic Neighbor Embedding (t-SNE)

    Another common technique is "t-Stochastic Neighbor Embedding (t-SNE)", which results
    in a decrease of non-linear dimensionality. This technique is primarily used for
    data visualization, with potential use for machine learning functions such as
    space reduction and clustering. The next plot demonstrates “MNIST database” analysis
    of handwritten digits. “MNIST” includes a large number of digit pictures from
    0 to 9, used by scientists to test “clustering” and “classification” algorithms.
    Individual row of the data set represents “vectorized version” of the original
    picture (size 28x28 = 784 pixels) and a label (0, 1, 2 and so on) for each picture.
    Note that the dimensionality is therefore reduced from 784 pixels to 2-D in the
    plot below. Two-dimensional projecting enables visualization of the initial high-dimensional
    data set. ![](image299.jpg)


    ## 5. Ensemble Methods

    Think that you have chosen to construct a car because you are not pleased with
    the variety of cars available in the market and online. You may start by discovering
    the best option for every component that you need. The resulting car will outshine
    all the alternatives with the assembly of all these components. “Ensemble methods”
    use the same concept of mixing several predictive models (machine learning) to
    obtain results of greater quality than any of the models can generate. The `Random
    Forest` algorithms, for instance, is an “ensemble method” that collates various
    `Decision Trees` with different data samples. Consequently, the quality of predictions
    generated by `Random Forest` is better than the quality generated by only `Decision
    Tree`. Think of "ensemble methods" as an approach for reducing single machine
    learning model''s variance and bias. This is essential because, under certain
    circumstances, any specified model may be accurate but completely incorrect under
    other circumstances. The relative accuracy could be overturned with another model.


    ## 6. Transfer Learning

    Imagine you are a data scientist focusing on the clothing industry. You have been
    training a high-quality learning model for months to be able to classify pictures
    as "women''s tops", tank tops, and blouses. With the use of "Transfer Learning",
    the understanding incorporated into the first model seamlessly transferred and
    applied to the second model. Transfer Learning pertains to the re-use and adaptation
    of a portion of previously trained neural network to a fresh but comparable assignment.
    Specifically, once a neural network has successfully trained for a particular
    task, a proportion of trained layers can be easily transferred and combined with
    new layers which are then trained on pertinent data. The primary benefit of transferring
    learning is decreasing the volume of data required to train the neural network
    resulting in cost savings for "deep learning algorithms". Not to forget how hard
    it can to procure a sufficient amount of labeled data to train the model. Suppose
    in this example, you are using a neural network with hidden layers for the "women''s
    top" model. You understand after running few tests that the input and output of
    both tasks are distinct, but the reusable layers are capable of summarizing the
    data appropriate to both, e.g. clothing, and shape of the garment. A variety of
    high quality pre-trained models are already available in the market.


    ## 7. Natural Language Processing

    A majority of the knowledge and information of our world is in some type of human
    language. Once deemed as impossible to achieve, today computers are capable of
    reading large volumes of books and blogs within minutes. Although, computers are
    still unable to fully comprehend "human text", they can be trained to perform
    specific tasks. Mobile devices, for instance, can be trained to auto-complete
    text messages or fix spelling mistakes. Machines have been trained enough to hold
    straightforward conversations like humans. "Natural Language Processing" (`NLP`)
    is not exactly a method of ML, instead it is a commonly used technique to produce
    texts for machine learning. Consider a multitude of formats of text files (words,
    internet blogs, etc). Most of these text files are usually flooded with typing
    errors, grammatically incorrect characters and phrases that need to be filtered
    out. The most popular text processing model available in the market today is `NLTK
    (Natural Language Toolkit)`, developed by Stanford University researchers. The
    easiest approach to map texts into numerical representations concern calculation
    of the frequency of each word contained in every text document. For example, an
    integer matrix where individual rows represent one text document and every column
    a single word. This word frequency representation matrix is frequently referred
    to as the Term Frequency Matrix (`TF-M`). From there, individual matrix entries
    can be separated by weight of how essential every single term is within the whole
    stack of papers. This form of matrix representation of a text document is called
    Term Frequency Inverse Frequency (`TF-IDF`), which usually yields better performance
    for machine learning tasks.


    ## 8. Word Embedding

    `Term Frequency Matrix` and `Term Frequency Inverse Frequency` are numerical representations
    of text papers which only take into account frequency and weighted frequencies
    to represent text files. On the other hand, `Word Embedding` in a document is
    capable of capturing the actual context of a word. Embedding can quantify the
    similarity between phrases within the context of the word, which subsequently
    allows the execution of arithmetic operations with words. `Word2Vec` is a neural
    network-based technique that can map phrases to a numerical vector in a corpus.
    These vectors are then used to discover synonyms, do arithmetic with words or
    phrases, or to represent text files. Let''s suppose, for instance, a large enough
    body of text files was used to estimate word embedding. Suppose the words `king,
    queen, man, and female` are found in the corpus and vector (`word`) is the number
    vector representing the word. We can conduct an arithmetic procedure with numbers
    to estimate `vector(''woman'')`: `vector(''king'') + vector(''woman'') — vector(''man'')
    ~ vector(''queen'')` ![](image322.jpg)


    Word depictions enable similarities to be found between phrases by calculating
    the `cosine similarity` between the vector representation of the two words. The
    `cosine similarity` gives a measure of the angle between two vectors. We use machine
    learning techniques to calculate word embedding, but this is often a preliminary
    step in implementing a machine learning algorithm on top of the word embedding
    method. For example, the "Twitter" user database containing a large volume of
    `tweets` can be leveraged to understand which of these customers purchased a house
    recently. We can merge `Word2Vec` with logistic regression to generate predictions
    on the likelihood of a new "Twitter" user purchasing a house.


    ## 9. Decision Trees

    To refresh your memory; a decision tree can be defined as a tree-like graphical
    representation of the decision process. Decision trees are considered one of the
    simplest supervised machine learning algorithms. The two types are: `classification
    tree` that is used to classify based on existing data; `regression tree` which
    is used to make predictions based on existing data. A widely used terminology
    for decision trees is `Classification and Regression Trees` or `CART`. Let’s look
    at a simple decision tree based on a real-life example.


    Step 1: Identify what decision needs to be made, which will serve as a `root node`
    for the decision tree. Unlike real trees, the decision tree has its roots on top
    instead of the bottom.


    Step 2: Identify conditions or influencing factors for your decision which will
    serve as `branch nodes` for the decision tree. For this example, conditions could
    include `would you like to spend the weekend alone or with friends?` and `how
    is the weather to be?`.


    Step 3: As you answer the conditional questions, you may run into additional conditions
    that you might ignored. You will now continue to your final decision by processing
    all the conditional questions individually, these bifurcations will serve as `edges`
    of your decision tree.


    Step 4: Once you have processed all the permutations and combinations and eventually
    made your final decision, that final decision will serve as the `leaf node` of
    your decision tree. Unlike `branch nodes`, there are no further bifurcations possible
    from a `leaf node`.

