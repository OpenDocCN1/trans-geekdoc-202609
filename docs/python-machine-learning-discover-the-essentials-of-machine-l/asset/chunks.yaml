  trans: '


    *   `k-nearest neighbors classification`（k 近邻分类）：`output` 是类的一个成员。`object` 通过其邻居的多数投票进行分类，将对象分配给其最近的
    `k-neighbors` 中出现频率最高的类，其中 `k` 表示一个小的正整数。如果 `k= 1`，则 `object` 直接被分配给最近的邻居的类。

    *   `k-nearest neighbors regression`（k 近邻回归）：输出是对象的属性值，通过计算 k 个近邻居值的平均值得出。


    对于分类和回归，一种有效的方法是为邻居的贡献分配权重，使得与距离较远的邻居相比，较的邻居能够在平均过程中贡献更多。例如，一种常用的 `weighting scheme`
    是给每个邻居分配 `1/d` 的权重，其中 `d` 表示到邻居的距离。邻居是从一组从中选择的，这些对象的 `class`（用于 `k-NN classification`）或
    `object` 的特征值（用于 `k-NN regression`）是已知的。


    以下是构建我们下一个 ML 模型所需的该算法步骤和代码：


    步骤 1 – 导入所需的模块，使用命令 `from sklearn.neighbors import KNeighborsClassifier` 和 `from
    sklearn.metrics import accuracy_score`。

    步骤 2 – 创建分类器对象，使用命令 `neigh = KNeighborsClassifier(n_neighbors=3)`。

    步骤 3 – 训练算法，使用命令 `neigh.fit(data_train, target_train)`。

    步骤 4 – 生成预测结果，使用命令 `pred = neigh.predict(data_test)`。

    步骤 5 – 评估准确率，使用命令 `print (‘KNeighbors accuracy score:’, accuracy_score(target_test,
    pred))`。


    通过上述代码，在第一步中导入了所需的模块。然后我们开发了类型为 `KNeighborsClassifier` 的对象 `neigh`，其邻居数量为 `n_neighbors=3`。在下一步，使用
    `fit()` 技术在训练数据集上训练了算法。接着，使用 `predict()` 技术在测试数据集上对模型进行了测试。最后，获得了准确率得分，例如可能是 `KNeighbors
    accuracy score: 0.814550580998`。


    现在我们已经介绍了首选算法，可以轻松地选择准确率得分最高的模型。但如果我们有一种以视觉方式比较不同模型效率的方法，那不是很好吗？在 Scikit-Learn
    中，我们可以使用 `Yellowbrick library`，它提供了视觉化展示各种评分技术的技术。


    ## 第 5 章：使用 Tensorflow 训练神经网络


    TensorFlow 可以被定义为一个机器学习平台，提供各种免费且开源的端到端服务。它有一套多层节点系统，允许在大数据集上快速构建、训练和部署人工神经网络。它被誉为“一种简单且灵活的架构，能够以快速速度将新想法从概念转化为代码、最先进的模型并进行发表”。例如，Google
    在其图像识别和语音识别工具及技术使用了 TensorFlow 库。高级 API（如 `tf.estimator`）可用于指定预定义的架构，例如 `linear
    regressors` 或神经网络。下图显示了 TensorFlow 工具包现有的层次结构：![](img/image649.jpg)

    下所示的图片提供了不同层级的用途：![](img/image654.jpg)


    TensorFlow 的两个基本组件是：

    1. 一个 `graph protocol buffer`（图协议缓冲区）

    2. 一个可以执行该图的 `runtime`（运行时）


    上述两个组件类似于 `Python` 代码和 `Python interpreter`。正如 `Python interpreter` 可以在多个硬件系统上运行
    Python 代码一样，TensorFlow 也可以在各种硬件系统（如 CPU、GPU 和 TPU）上运行。为了决定应该使用哪些 API，你必须考虑为解决目标问题提供最高抽象级别的
    API。


