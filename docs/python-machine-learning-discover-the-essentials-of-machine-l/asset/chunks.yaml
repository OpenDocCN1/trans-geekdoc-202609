    \ 到 28 像素）表示单件服装物品。对于经典的 MNIST 数据集，“Fashion MNIST”被设计为无缝替换的替代方案。“MNIST” 数据集包含手写数字（0、1\
    \ 等）的图片，其格式与本示例中使用的服装物品相同。\n\n为了训练网络，我们将使用 60,000 张图片，并使用 10,000 张图片来评估网络学习分类图像的准确性。可以直接从\
    \ TensorFlow 访问“Fashion MNIST”数据集，使用如下所示的导入命令：\n\n```python\nfashion_mnist = keras.datasets.fashion_mnist(train_images,\
    \ train_labels), (test_images, test_labels) = fashion_mnist.load_data()\n```\n\
