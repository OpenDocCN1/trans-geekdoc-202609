    \ attributes can only take on a restricted amount of feasible values, which are\
    \ generally fixed. For instance, if a dataset is about user-related data, then\
    \ characteristics such as ‘nation’, ‘gender’, ‘age group’, etc. will constitute\
    \ the data set. Alternatively, you will find attributes such as ‘product type’,\
    \ ‘manufacturer’, ‘vendor’, and so on if your data set pertains to a commodity\
    \ or product. In the context of the data set, these are all categorical attributes.\
    \ Typically, these attributes are stored as text values representing different\
    \ characteristics of the observations. Gender is defined, for instance, as “male”\
    \ or “female”, and product type could be defined as “electronics”, “apparel”,\
    \ “food” and so on. There are three types of categorical data: \n\n*   Nominal\
    \ – The types of attributes where categories are only labeled and have no order\
    \ of succession are called “nominal features”. For example, gender could be ‘male’\
    \ (M) or ‘female’ (F) and have no order of precedence. \n\n*   Ordinal – The types\
    \ of attributes where categories are labeled with an order of precedence are called\
    \ “ordinal features”. For example, an economic status feature can contain three\
    \ categories: “low”, “medium” and “high”, which have an inherent order associated\
    \ with them. \n\n*   Continuous – The types of attributes where categories are\
    \ numerical variables with infinite values ranging between two defined values\
    \ are called “continuous features”. \n\nChallenges of Categorical Data \n\n* \
    \  Categorical attributes can contain multiple levels, called “high cardinality”\
    \ (e.g. states, towns or URLs), where most levels appear in a relatively smaller\
    \ number of instances. \n\n*   Various ML models are algebraic, such as “regression”\
    \ and “SVM”, which require numerical input. Categories have to be changed first\
    \ to numbers to use these models before the machine learning algorithm can be\
    \ applied. \n\n*   While some machine learning packages or libraries are capable\
    \ of automatically transforming the categorical data into numeric, depending on\
    \ the default embedded technique, a variety of machine learning libraries don't\
    \ support categorical data inputs. \n\n*   Categorical data for the computer does\
    \ not translate the context or background, that people can readily associate with\
    \ and comprehend. For instance, consider a function called “City” with different\
    \ city names like “New York”, “New Jersey”, and “New Delhi”. People know that\
    \ “New York” is strongly linked to “New Jersey” being two neighboring states of\
    \ America, while “New York” and “New Delhi” are very distinct. On the other hand,\
    \ for the machine, all three cities just denote three distinct levels of the same\
    \ “City” function. Without specifying adequate context through data for the model,\
    \ differentiating between extremely distinct levels will be difficult for it.\
    \ \n\nEncoding Categorical Data Machine learning models are built on mathematical\
    \ equations, so it is easy to comprehend that maintaining the categorical data\
    \ in equations would cause issues since equations are primarily driven by numbers\
    \ alone. To cross this hurdle, the categorical features can be encoded to numeric\
    \ quantities. The encoding techniques below will be described using example of\
    \ an “airline carrier” column from a make-believe airline database, for ease of\
    \ understanding. However, it is possible to extend the same techniques to any\
    \ desired column. \n\n1.  Replacing the categorical values \n\nThis is a fundamental\
    \ technique of replacing the categorical data values with required integers. The\
    \ “replace()”  function in Pandas, can be used for this technique. Depending on\
    \ your business requirements, desired numbers can be easily assigned to the categorical\
    \ values. \n\n2.  Encoding Labels \n\nThe technique of converting categorical\
    \ values in a column to a number is called as \"label encoding\". Numerical labels\
    \ always range from “0” to “n categories-1”. Encoding a group of categories to\
    \ a certain numerical value and then encoding all other categories to another\
    \ numerical value can be done using the “where()” function in NumPy. For example,\
    \ one could encode all the “US airline carriers” to value “1” and all other carriers\
    \ can be given value “0”. You can perform similar label encoding using “Scikit-Learn's LabelEncoder”.\
    \ Label encoding is fairly intuitive and simple and produces satisfactory performance\
    \ from your learning algorithm. However, the algorithm is at a disadvantage and\
    \ may misinterpret numerical values. For example, an algorithm may confuse whether\
    \ the “U.S. airline carrier” (encoded to 6) should be given 6 times more weight\
    \ “U.S. airline carrier” (encoded to 1). \n\n3.  One-Hot encoding \n\nTo resolve\
    \ the misinterpretation issue of the machine learning algorithm generated by the\
    \ “label encoding” technique, each categorical data value can be transformed into\
    \ a new column and that new column can be allocated a ‘1’ or ‘0’ (True/False)\
    \ value, and is called as “one-hot encoding”. Of all the machine learning libraries\
    \ in the market that offer “one-hot encoding”, the easiest one is “get\\_dummies()”\
    \ technique in “Pandas”, which is appropriately titled given the fact that dummy/indicator\
    \ data variables such as “1” or “0” are created. In its preprocessing module,\
    \ Scikit-Learn also supports “one-hot encoding” in its pre-processing module via\
    \ “LabelBinarizer” and “OneHotEncoder” techniques. While “one-hot encoding” addresses\
    \ the issue of misinterpreted category weights, it gives rise to another issue.\
    \ Creation of multiple new columns to solve this category weight problem for numerous\
    \ categories can lead to a “curse of dimensionality”. The logic behind “curse\
    \ of dimensionality” is that some equations simply stop functioning correctly\
    \ in high-dimensional spaces. \n\n4.  Binary encoding "
