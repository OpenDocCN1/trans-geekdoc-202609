    # Basic concepts of machine learning


    The biggest draw of machine learning is the engineered capability of the system
    to learn programs from the data automatically instead of manually constructing
    the program for the machine. Over the last decade, the use of machine learning
    algorithms expanded from computer science to the industrial world. Machine learning
    algorithms are capable of generalizing tasks to execute them iteratively. The
    process of developing specific programs for specific tasks costs a lot of time
    and money, but occasionally it''s just impossible to achieve. On the other hand,
    ML programming is often feasible and tends to be much more cost-effective. The
    use of machine learning in tackling ambitious issues of widespread importance
    such as global warming and depleting underground water levels is promising with
    a massive collection of relevant data. "A breakthrough in machine learning would
    be worth ten Microsoft.” – Bill Gates


    Many types of machine learning exist today but the concept of machine learning
    largely boils down to three components: "representation", "evaluation" and "optimization".
    Here are some of the standard concepts that apply to all of them.


    ## Representation


    Machine learning models are incapable of directly hearing, seeing or sensing input
    examples. Therefore, data representation is required to supply the model with
    a useful vantage point into the key qualities of the data. To be able to successfully
    train a machine learning model selection of key features that best represent the
    data is very important. "Representation" simply refers to the act of "representing"
    data points from a computer to a language that it understands using a set of classifiers.
    A classifier can be defined as "a system that inputs a vector of discrete and
    or continuous feature values and outputs a single discrete value called class".


    For a model to learn from the represented data the training data set or the "hypothesis
    space" must contain the desired classifier that you want the models to be trained
    on. Any classifiers that are external to the hypothesis space cannot be learned
    by the model.


    The data features used to represent the input are very critical to the machine
    learning process. The data features are so important to the development of the
    desired machine learning model that can easily be the difference between successful
    and failed machine learning projects. A training data set containing multiple
    independent "features" that are well correlated with the "class" can make the
    machine learning much smoother. On the other hand, the class containing complex
    features may not be easy to learn from for the machine. This often requires the
    raw data to be processed so that desired features can be constructed from it,
    to be leveraged for the ML model.


    The process of deriving features from raw data tends to be the most time consuming
    and laborious part of the ML project. It is also considered the most creative
    and interesting part of the project where intuition and trial and error play just
    as important role as the technical requirements. The process of ML is not a "one-shot
    process" of developing a training data set and executing it instead it is an iterative
    process that requires analysis of the post-run output, followed by modification
    of the training data set and then repeating the whole process all over again.


    Another reason for the extensive time and effort required to engineer the training
    data set is domain specificity. Training data set for an e-commerce platform to
    generate predictions based on consumer behavior analysis will be very different
    from the training data set required to develop a self-driving car. However, the
    actual machine learning process remains largely the same across industrial domains.
    No wonder, a lot of research is being done to automate the feature engineering
    process.


    ## Evaluation


    Essentially the process of judging multiple hypothesis or models to choose one
    model over another is referred to as an evaluation. To be able to differentiate
    between useful classifiers from the vague ones an “evaluation function” is required.
    The evaluation function is also called as "objective", "utility" or "scoring".
    The machine learning algorithm has its internal evaluation function which tends
    to be different from the external evaluation function used by researchers to optimize.
    Usually the evaluation function is defined before the selection of the data, as
    the first step of the project. For example, the machine learning model for a self-driving
    car has the feature for identification of pedestrians in its vicinity at near-zero
    negatives and a low false-positive as the pre-existing condition that needs to
    be "represented".


    ## Optimization


    The process of searching the space of presented models to achieve better evaluations
    or highest-scoring classifier is called as "optimization". For algorithms with
    more than one classifier, the selection technique is very critical A variety of
    off-the-shelf optimizers are available in the market before eventually replacing
    them with custom-designed optimizers.


    ## Basic machine learning terminologies


    Agent – In the context of reinforcement learning, an agent refers to the entity
    that uses a policy to maximize expected return gained from transitioning between
    states.


    Boosting – Boosting can be defined as a machine learning technique that iteratively
    combines a set of simple and not very accurate classifiers (referred as weak classifiers)
    into a classifier with high accuracy (a strong classifier) by weighting the examples
    that the model is currently misclassifying.


    Candidate generation – The phase of selecting the first set of recommendations
    by a recommendation system is referred as candidate generation. For example, a
    library can offer 500,000 titles. This technique will produce a subset meeting
    the needs of a particular user and can be refined further to an even smaller set.


    Categorical Data – Data boasting a discrete set of possible values. For example,
    style can have sedan, coupe, SUV.


    Checkpoint – Checkpoint can be defined as the data that can capture the state
    of moment in time. With the use of checkpoints, training can be carried out across
    multiple sessions and model weights or scores can be exported.


    Class – Class can be defined as one of listed target values for a given label.
    For example, machine learning model designed to detect will have two classes,
    namely, “spam” and “not spam”.


    Classification model – The type of ML model used to distinguish between two or
    more discrete classes of data. For example, for identification of dog breeds could
    assess whether the dog picture used as input is Labrador, Schnauzer, German Shepherd,
    Beagle and on.


    Collaborative filtering – The process of generating predictions for a particular
    user based on the shared interests of a group of similar users is called collaborative
    filtering.


    Continuous feature – It is defined as a floating-point feature with an infinite
    range of possible values.


    Discrete feature – It is defined as a rigid feature with a finite set of possible
    values.


    Discriminator – The system that determines whether the input examples are real
    or fake.


    Down-sampling – The process of Down-sampling refers to the act of reducing the
    amount of information contained in a feature or using a disproportionately low
    percentage of over-represented class examples to train the learning model more
    efficiently.


    Dynamic model – A learning model that is continuously receiving input data to
    be trained continuously is called dynamic model.


    Ensemble – The set of predictions generated by merging predictions of multiple
    models.


    Environment – The term in the context of reinforcement machine learning constitutes
    the world that contains the agent and allows the agent to observe that world''s
    state.


    Episode – The term in the context of reinforcement learning constitutes every
    iterative attempt made by the agent to learn from its environment.


    Feature – An input data variable that is used in generating predictions.


    Feature engineering – Feature engineering can be defined as the process of determining
    which features might be useful in training a model, and then converting raw data
    from log files and other sources into said features.


    Feature extraction – Feature extraction can be defined as the process of retrieving
    intermediate feature representations calculated by an unsupervised or pre-trained
    model for use in another model as input.


    Few-shot learning – Few-shot learning can be defined as a machine learning approach,
    often used for object classification, designed to learn effective classifiers
    from only a small number of training examples.


    Fine-tuning – The process of performing a secondary optimization to adjust the
    parameters of an already trained model to fit a new problem is called as fine-tuning.
    It is widely used to refit the weights of a trained unsupervised model to a supervised
    model.


    Generalization – The ability of the machine learning model to make correct predictions
    on new, previously unseen data as opposed to the data used to train the model.


    Inference – In the context of ML, an inference can be defined as the process of
    making predictions by applying the trained model to unlabeled examples.


    Label – In the context of machine learning (supervised), the result part. A labeled
    data set can constitute single or multiple features and corresponding labels for
    every example. For example, in a house data set, the features could include the
    year built, number of bedrooms and bathrooms, while the label can be the house''s
    price.


    Linear model – Linear model is defined as a model that assigns one weight per
    feature to make predictions.


    Loss – In the context of machine learning, loss refers to the measure of how far
    are the predictions generated by the model from its label.


    Matplotlib – It is an open-source Python 2D plotting library which is used to
