  raw: 'Basic concepts of machine learning The biggest draw of machine learning is
    the engineered capability of the system to learn programs from the data automatically
    instead of manually constructing the program for the machine. Over the last decade,
    the use of machine learning algorithms expanded from computer science to the industrial
    world. Machine learning algorithms are capable of generalizing tasks to execute
    them iteratively. The process of developing specific programs for specific tasks
    costs a lot of time and money, but occasionally it''s just impossible to achieve.
    On the other hand, ML programming is often feasible and tends to be much more
    cost-effective. The use of machine learning in tackling ambitious issues of widespread
    importance such as global warming and depleting underground water levels is promising
    with a massive collection of relevant data. " A breakthrough in machine learning
    would be worth ten Microsoft.” – Bill Gates Many types of machine learning exist
    today but the concept of machine learning largely boils down to three components
    "representation", "evaluation" and "optimization". Here are some of the standard
    concepts that apply to all of them. Representation Machine learning models are
    incapable of directly hearing, seeing or sensing input examples. Therefore, data
    representation is required to supply the model with a useful vantage point into
    the key qualities of the data. To be able to successfully train a machine learning
    model selection of key features that best represent the data is very important.
    "Representation" simply refers to the act of "representing" data points from a
    computer to a language that it understands using a set of classifiers. A classifier
    can be defined as "a system that inputs a vector of discrete and or continuous
    feature values and outputs a single discrete value called class". For a model
    to learn from the represented data the training data set or the "hypothesis space"
    must contain the desired classifier that you want the models to be trained on.
    Any classifiers that are external to the hypothesis space cannot be learned by
    the model. The data features used to represent the input are very critical to
    the machine learning process. The data features are so important to the development
    of the desired machine learning model that can easily be the difference between
    successful and failed machine learning projects. A training data set containing
    multiple independent "features" that are well correlated with the "class" can
    make the machine learning much smoother. On the other hand, the class containing
    complex features may not be easy to learn from for the machine. This often requires
    the raw data to be processed so that desired features can be constructed from
    it, to be leveraged for the ML model. The process of deriving features from raw
    data tends to be the most time consuming and laborious part of the ML project.
    It is also considered the most creative and interesting part of the project where
    intuition and trial and error play just as important role as the technical requirements.
    The process of ML is not a "one-shot process" of developing a training data set
    and executing it instead it is an iterative process that requires analysis of
    the post-run output, followed by modification of the training data set and then
    repeating the whole process all over again. Another reason for the extensive time
    and effort required to engineer the training data set is domain specificity. Training
    data set for an e-commerce platform to generate predictions based on consumer
    behavior analysis will be very different from the training data set required to
    develop a self-driving car. However, the actual machine learning process remains
    largely the same across industrial domains. No wonder, a lot of research is being
    done to automate the feature engineering process. Evaluation Essentially the process
    of judging multiple hypothesis or models to choose one model over another is referred
    to as an evaluation. To be able to differentiate between useful classifiers from
    the vague ones an “evaluation function” is required. The evaluation function is
    also called as "objective", "utility" or "scoring" function. The machine learning
    algorithm has its internal evaluation function which tends to be different from
    the external evaluation function used by the researchers to optimize the classifier.
    Usually, the evaluation function is defined before the selection of the data representation
    tool, as the first step of the project. For example, the machine learning model
    for a self-driving car has the feature for identification of pedestrians in its
    vicinity at near-zero false negatives and a low false-positive as an evaluation
    function and the pre-existing condition that needs to be "represented" using applicable
    data features. Optimization The process of searching the space of presented models
    to achieve better evaluations or highest-scoring classifier is called as "optimization".
    For algorithms with more than one optimum classifier, the selection of optimization
    technique is very critical in the determination of the classifier produced and
    to achieve a more efficient learning model. A variety of off-the-shelf optimizers
    are available in the market to kick start new machine learning models before eventually
    replacing them with custom-designed optimizers. ![](image110.jpg)Basic machine
    learning terminologies Agent – In the context of reinforcement learning, an agent
    refers to "the entity that uses a policy to maximize expected return gained from
    transitioning between states of the environment". Boosting – Boosting can be defined
    as “a machine learning technique that iteratively combines a set of simple and
    not very accurate classifiers (referred to as weak classifiers) into a classifier
    with high accuracy (a strong classifier) by up-weighting the examples that the
    model is currently misclassifying”. Candidate generation – The phase of selecting
    the “first set of recommendations” by a recommendation system is referred to as
    candidate generation. For example, a book library can offer 500,000 titles. This
    technique will produce a subset of few 100 books meeting the needs of a particular
    user and can be refined further to an even smaller set as needed. Categorical
    Data – Data features boasting a "discrete set of possible values" is called as
    categorical data. For example, a "categorical feature" labeled car style can have
    an unconnected set of multiple possible values including sedan, coupe, SUV. Checkpoint
    – Checkpoint can be defined as “The data that can capture the state of the variables
    of a learning model particular moment in time”. With the use of checkpoints, training
    can be carried out across multiple sessions and model weights or scores can be
    exported. Class – Class can be defined as “one of a set of listed target values
    for a given label”. For example, a machine learning model designed to detect “spam”
    will have two classes, namely, “spam” and “not spam”. Classification model – The
    type of ML model used to "distinguish between two or more discrete classes of
    data" is referred to as a classification model. For example, a classification
    model for identification of dog breeds could assess whether the dog picture used
    as input is Labrador, Schnauzer, German Shepherd, Beagle and so on. Collaborative
    filtering – The process of generating predictions for a particular user based
    on the shared interests of a group of similar users is called collaborative filtering.
    Continuous feature – It is defined as a “floating-point feature with an infinite
    range of possible values”. Discrete feature – It is defined as a “rigid feature
    with a finite set of possible values”. Discriminator – "The system that determines
    whether the input examples are real or fake" is called discriminator. Down-sampling
    – The process of Down-sampling refers to “the act of reducing the amount of information
    contained in a feature or using a disproportionately low percentage of over-represented
    class examples to train the learning model more efficiently". Dynamic model –
    A learning model that is continuously receiving input data to be trained continuously
    is called dynamic model. Ensemble – "The set of predictions generated by merging
    predictions of multiple models" is called ensemble. Environment – The term ‘environment''
    used in the context of reinforcement machine learning constitutes "the world that
    contains the agent and allows the agent to observe that world''s state". Episode
    – The term episode used in the context of reinforcement machine learning constitutes
    "every iterative attempt made by the agent to learn from its environment". Feature
    – "An input data variable that is used in generating predictions" is called feature.
    Feature engineering – Feature engineering can be defined as “the process of determining
    which features might be useful in training a model, and then converting raw data
    from log files and other sources into said features”. Feature extraction – Feature
    extraction can be defined as “the process of Retrieving intermediate feature representations
    calculated by an unsupervised or pre-trained model for use in another model as
    input”. Few-shot learning - Few-shot learning can be defined as “a machine learning
    approach, often used for object classification, designed to learn effective classifiers
    from only a small number of training examples”. Fine-tuning – The process of “performing
    a secondary optimization to adjust the parameters of an already trained model to
    fit a new problem” is called as fine-tuning. It is widely used to refit the weights
    of a “trained unsupervised model” to a “supervised model”. Generalization – “The
    ability of the machine learning model to make correct predictions on new, previously
    unseen data as opposed to the data used to train the model" is called generalization.
    Inference – In the context of ML, an inference can be defined as “the process
    of making predictions by applying the trained model to unlabeled examples”. Label
    – In the context of machine learning (supervised), the "answer" or "result" part
    of an example is called label. A labeled data set can constitute single or multiple
    features and corresponding labels for every example. For example, in a house data
    set, the features could include the year built, number of bedrooms and bathrooms,
    while the label can be the “house''s price”. Linear model – Linear model is defined
    as “a model that assigns one weight per feature to make predictions”. Loss – In
    the context of machine learning, loss refers to the "measure of how far are the
    predictions generated by the model from its label". Matplotlib – It is “an open-source
    Python 2D plotting library which is used to visualize different aspects of machine
    learning”. Model – In the context of ML, a model can be defined as "the representation
    of what a machine learning system has learned from the training data”. NumPy –
    “An open-source math library that provides efficient array operations in Python”. 
    One-shot learning – In the context of ML, one-shot learning refers to "a machine
    learning approach designed to learn effective classifiers from a single training
    example, often used for object classification”. Overfitting - In the context of
    machine learning, overfitting is referred to as "creation of a model that matches
    the training data so closely that the model fails to make correct predictions
    on new data”. Parameter – “A variable of a model that the machine learning system
    can train on its own" is called parameter.  Pipeline – In the context of ML, pipeline
    refers to "the infrastructure surrounding a machine learning algorithm and includes
    a collection of data, addition of the data to training data files, training one
    or more models, and exporting the models to production”. Random forest – In the
    context of machine learning, the concept of random forest pertains to "an ensemble
    approach for finding the decision tree that best fits the training data by developing
    multiple decision trees with a random selection of features”. Scaling - In the
    context of machine learning, scaling refers to "a common feature engineering practice
    to tame a feature''s range of values to match the range of other features in the
    dataset”. Sequence model - A sequence model simply refers to a model with sequential
    dependency on data inputs to generate a future prediction. Under-fitting - In
    the context of ML, under-fitting refers to "production of a ML model with poor
    predictive ability because the model hasn''t captured the complexity of the training
    data”. Validation – “The process used to evaluate the quality of a machine learning model
    using the validation set, as part of the model training phase” is called as validation.
    The main goal of this process is to make sure that the performance of the ML model
    can be applied beyond the training set. Types of Machine Learning Models Artificial
    Neural Networks "Artificial Neural Networks" or (ANN) have been developed with
    inspiration from the structure of the human brain and utilizes numerous processing
    units like human neurons or nodes working as one. Each ANN has numerous concealed
    layers including an input and an output layer. These neurons are connected in
    a complex with one another by weighted links. A solitary neuron is capable of
    accepting input from various neurons. When a neuron gets activated, it casts a
    "weighted vote" to control the activation of the subsequent neuron that is collecting
    that input. An algorithm modifies these weights following the training data to
    optimize learning. A simple algorithm called "fire together, wire together" increases
    the weight between two connected neurons when the activation of either neuron
    leads to subsequent activation of the other neuron. "Concepts" are formed and
    distributed through the sub-network of shared neurons. The most widely recognized
    ANN deal with the unidirectional progression of information and are called "Feed
    forward ANN". However, ANN can also be used for bidirectional and cyclic progression
    of information to gain state equilibrium. ANNs are less dependent on prior assumptions
    and able to learn from prior cases by modifying the connected weights. They can
    be utilized with either supervised or unsupervised learning. The use of supervised
    learning will generate correct ANN output for every input pattern. By varying
    the weights, the error between the target output and the output produced by ANN
    can be effectively minimized. For example, a type of “supervised learning algorithm”
    called "reinforced learning", informs the ANN whether the output it produced is
    correct or not instead of directly supplying the correct output. On the other
    hand, "unsupervised learning algorithm" is capable of providing a variety of input
    pattern to the ANN which is then processed by the ANN to self-explore the relationship
    between the provided input patterns and learn to categorize them accordingly.
    Artificial Neural Networks utilizing a combination of “supervised” and “unsupervised”
    learning are also available. ANN is the choice of the learning model to address
    data-driven problems with unknown or difficult to comprehend algorithm or rules,
    credited to their defined data structure and non-linear computations. ANNs are
    capable of efficiently processing complex information and can easily withstand
    multi-variable data errors. Problems requiring a complete understanding of and
    insight into the actual process are not suitable for the ANN model, given its
    black box nature providing no view into the underlying process. ANNs are widely
