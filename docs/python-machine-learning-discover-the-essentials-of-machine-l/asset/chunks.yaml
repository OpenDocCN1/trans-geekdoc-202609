- fmt: "\nThis method initially encodes the categories as “ordinal”, then converts\
    \ these integers into a binary string, and then divides digits of that binary\
    \ code into distinct columns. Therefore, the data is encoded in only a few dimensions,\
    \ unlike the “one-hot encoding” method. There are several options to implement\
    \ binary encoding in your machine learning model but the easiest option is to\
    \ install `category_encoders` library. This can be done using `pip install category_encoders`\
    \ on `cmd`.\n\n### 5. Backward difference encoding\n\nThis “backward difference\
    \ encoding” method falls within the “contrast coding scheme” for categorical attributes.\
    \ A “K” category or level characteristic typically enters a “regression” as a\
    \ series of dummy “K-1” variables. This technique works by drawing a comparison\
    \ between the “mean” of the dependent variable for a level with the “mean” of\
    \ the dependent variable in the preceding stage. This kind of encoding is widely\
    \ used for a “nominal” or an “ordinal “variable”. The code structure for this\
    \ technique is quite similar to any other technique in the `category_encoders`\
    \ library, except the run command for this technique is `BackwardDifferenceEncoder`.\n\
    \n### 6. Miscellaneous features\n\nYou may sometimes deal with categorical columns\
    \ that indicate the range of values in observation points, for instance, an ‘age’\
    \ column can contain categories such as ‘0-20’, ‘20-40’, ’40-60’ etc. While there\
    \ may be many methods to handle such attributes, the most popular ones are:\n\n\
    1. Dividing the categorical value ranges into two distinct columns, by first creating\
    \ a dummy data frame with just one feature as “age” and then splitting the column\
    \ on the delimiter “(-)” into two columns “start” and “end” using `split()` and\
    \ `lambda()` functions. \n\n2. Replacing the categorical value ranges with a selected\
    \ measure like the mean value of the range, using the function `split_mean()`.\n\
    \n### V – Splitting the data set into Training and Testing data subsets\n\nThe\
    \ machine learning algorithms are required to learn from sample data set to be\
    \ able to generate predictions from the input data set. In general, we divide\
    \ the data set into a proportion of 70:30 or 80:20, which means that 70% of the\
    \ data is used as the training subset and 30% of the data is used as the testing\
    \ subset. However, this split ratio is adjusted according to the form and size\
    \ of the data set. It is almost impossible and futile to manually split the data\
    \ set while making sure the data set is divided randomly. The Scikit-Learn library\
    \ offers us a tool called the “Model Selection library”, to assist with this task.\
    \ There is a `class` in the Scikit-Learn library called `train_test_split`. Using\
    \ this, we can readily divide the data set into the “training” and “testing” datasets\
    \ in desired ratios. Some parameters to consider while using this tool are:\n\n\
    * `Test_size` - It helps in determining the size of the data to be divided as\
    \ the testing data set, like a fraction of the total data set. For example, entering\
    \ 0.3 as the `test_size` value, the data set will be divided at 30 percent as\
    \ the test data set. If you specify this parameter, the next parameter may be\
    \ ignored.\n* `Train_size` – This parameter is only specified if the `test_size`\
    \ has not been specified already. The process works similar to the `test_size`\
    \ function, except that the percentage of the data set specified is for the “training\
    \ set”.\n* `Random_state` - An integer is entered here for the Scikit-Learn class,\
    \ based on which the “random number generator” will be activated during the data\
    \ set split. Alternatively, an instance of `RandomState` class can b entered that\
    \ will then generate random numbers. If you don't enter either of the functions,\
    \ the default will be activated which leverages the `RandomState` instance used\
    \ by `np.random`.\n\nFor example, the data set in the picture below can be split\
    \ into two subsets: ‘X’ subset for the “independent features” and ‘Y’ subset for\
    \ the “dependent variables” and also happens to be the last column of the data\
    \ set. ![](image962.jpg) Now we can use the code below to split the “x” data set\
    \ into two subsets: `xTrain` and `xTest` and likewise, split the “y” data set\
    \ into two subsets `yTrain` and `yTest`.\n\n```python\nfrom sklearn.model_selection\
    \ import train_test_split\n```\n"
