    *   `k-nearest neighbors classification` - The `output` is a member of the class.
    An `object` is classified by its neighbors’ plurality vote, assigning the object
    to the most prevalent class among its nearest `k-neighbors`, where `k` denotes
    a small positive integer. If `k= 1`, the `object` is simply allocated to the closest
    neighbor''s class.

    *   `k-nearest neighbors regression` - The output is the object''s property value,
    which is computed as an average of the k-nearest neighbors values.


    A helpful method for both classification and regression can be assigning weights
    to the neighbors'' contributions, to allow closer neighbors to make more contributions
    in the average, compared to the neighbors located far apart. For instance, a known
    `weighting scheme` is to assign each neighbor a weight of `1/d`, where `d` denotes
    the distance from the neighbor. The neighbors are selected from a set of objects
    for which the `class` (for `k-NN classification`) or the feature value of the
    `object` (for `k-NN regression`) is known.


    Here are the steps and code for this algorithm to build our next ML model:


    Step 1 – To import required modules, use the command `from sklearn.neighbors import
    KNeighborsClassifier` and `from sklearn.metrics import accuracy_score`.

    Step 2 – To create object of the classifier, use command `neigh = KNeighborsClassifier(n_neighbors=3)`.

    Step 3 – To train the algorithm, use command `neigh.fit(data_train, target_train)`.

    Step 4 – To generate predictions, use command `pred = neigh.predict(data_test)`.

    Step 5 – To evaluate accuracy, use command `print (‘KNeighbors accuracy score:’,
    accuracy_score(target_test, pred))`.


    With the code above, the required modules were imported in the first step. We
    then developed the object `neigh` of type `KNeighborsClassifier` with the volume
    of neighbors as `n_neighbors=3`. In the next step, the `fit()` technique was used
    to train the algorithm on the training data set. Next, the model was tested on
    the testing data set using `predict()` technique. Finally, the accuracy score
    was obtained, which could be `KNeighbors accuracy score: 0.814550580998`, for
    instance.


    Now that our preferred algorithms have been introduced, the model with the highest
    accuracy score can be easily selected. But wouldn''t it be great if we had a way
    to compare the distinct models'' efficiency visually? In Scikit-Learn, we can
    use the `Yellowbrick library`, which offers techniques for depicting various scoring
    techniques visually.


    ## Chapter 5: Neural Network Training with Tensorflow


    TensorFlow can be defined as a Machine Learning platform providing end-to-end
    service with a variety of free and open sources. It has a system of multilayered
    nodes that allow for quick building, training, and deployment of artificial neural
    networks with large data sets. It is touted as a "simple and flexible architecture
    to take new ideas from concept to code to state-of-the-art models and publication
    at a rapid pace". For example, Google uses TensorFlow libraries in their image
    recognition and speech recognition tools and technologies. Higher-level APIs such
    as `tf.estimator` can be used for specifying predefined architectures, such as
    `linear regressors` or `neural networks`. The picture below shows the existing
    hierarchy of the TensorFlow tool kit: ![](image649.jpg)

    The picture shown below provides the purposes of the different layers: ![](image654.jpg)


    The two fundamental components of TensorFlow are:

    1.  A `graph protocol buffer`

    2.  A `runtime` that can execute the graph


    The two components mentioned above are similar to the `Python` code and the `Python
    interpreter`. Just as `Python interpreter` can run Python code on several hardware
    systems, TensorFlow can be operated on various hardware systems, like CPU, GPU,
    and TPU. To make a decision regarding which API(s) should be used, you must consider
    the API offering the highest abstraction level to solve the target problem. Easier
    to use, but (by design) less flexible, are the greater abstract levels. It is
    recommended to first begin with the highest-level API and make everything work.
    If for certain unique modeling issues you need extra flexibility, move one level
    down. Notice that each level is constructed on the lower-level APIs. It should
    thus be quite simple to decrease the hierarchy. For the development of majority
    of Machine Learning models, we will use `tf.estimator` API, which significantly
    lowers the number of code lines needed for development. Also, `tf.estimator` is
    compatible with Scikit-Learn API.


    ## Neural Network


    The programming of computers needs a human programmer. Many lines of code are
    used by humans to instruct a computer to provide solutions to our problems. However,
    the computer can attempt to fix the issue itself through machine learning and
    neural networks. A neural network is `a function that learns the expected output
    for a given input from training datasets`. For instance, you can train the neural
    network with many sample bear pictures to construct a neural network that recognizes
    pictures of a bear. The resulting network operates as functionality to generate
    the "bear" label as output for the bear picture input. Another more convenient
    example would be: training the neural network using multiple user activity logs
    from gaming servers and generate an output stating which users are very likely
    to convert to paying customer.


    Unlike the `Artificial Neural Network` (explained in detail in Chapter 2 of this
    book), the `Neural Network` features only a single neuron, also called as `perceptron`.
    It is a straightforward and fundamental mechanism which can be implemented with
    basic math. The primary distinction between traditional programming and a neural
    network is that computers running on neural network learn from the provided training
    data set to determine the parameters (weights and prejudice) on their own, without
    needing any human assistance. Algorithms like `back propagation` and `gradient
    descent` may be used to train the parameters.


    ### Fundamentals of Neural Network


    *   Neural networks need clear and informative big data to be trained. You can
    think of Neural networks as a toddler. They start by observing how their parents
    are walking. Then they attempt to walk on their own, and the kid learns how to
    accomplish future tasks with every step.

    *   For complicated issues such as image processing, it is advisable to use Neural
    Networks. Neural networks belong to a group of algorithms called `representation
    learning algorithms`. These algorithms are capable of simplifying complicated
    issues by generating simple (or "representative") form, which tends to be more
    difficult for conventional (non-representation) algorithms.

    *   To determine what type of neural network model is suitable for solving the
    issue at hand, let the data dictate how you fix it. For instance, `recurring neural
    networks` are more appropriate if the issue pertains to sequence generation. While
    it might be better for you to use `convolutional neural networks` to solve an
    image-related issue.

