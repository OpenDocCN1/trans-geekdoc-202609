    # 机器学习的基础概念


    机器学习最大的吸引力在于系统具有工程化能力，能够从数据中自动学习程序，而不是为机器手动构建程序。在过去的十年里，机器学习算法的应用已从计算机科学扩展到工业领域。机器学习算法能够对任务进行泛化并进行迭代执行。为特定任务开发特定程序需要花费大量的时间和金，但有时这根本无法实现。另一方面，机器学习编程通常是可行的，而且往往更具成本效益。在海量相关数据的支持下，利用机器学习解决全球变暖和地下水水位下降等具有广泛影响的宏大问题是非常有前景的。“机器学习的突破将价值十个微软。”——比尔·盖斯


    如今存在许多类型的机器学习，但机器学习的概念很大程度上归结为三个部分：“表示”（representation）”、“评估”（evaluation）和“优化”（optimization）。以下是一些适用于所有这些标准概念。


    ## 表示 (Representation)


    机器学习模型无法直接听、看或感知输入示例。因此，需要数据表示来为模型提供一个观察数据关键特性的有用视角。为了能够成功训练机器学习模型，选择最能代表数据的特征至关重要。“表示”简单是指使用一组分类器，将计算机中的数据点“表示”为它理解的语言。分类器可以定义为：“一个输入离散和/或连续特征值向量并输出一个称为类别的单个离散值的系统”。


    为了让模型从表示的数据中学习，训练数据集或“假设空间”（hypothesis space）必须包含你希望模型训练的预期分类器。任何假设空间之外的分类器都无法被模型学习。


    用于表示输入的数据特征对机器学习过程至关重要。数据特征对于开发理想的机器学习模型非常重要，足以成为机器学习项目成功与否的关键区别。包含多个与“类别”具有良好相关性的独立“特征”的训练数据集可以使机器学习变得更加顺畅。另一方面，包含复杂特征的类别可能并不易于机器学习。这通常需要对原始数据进行处理，以便从中构建出所需的特征，并供机器学习模型利用。


    从原始数据中推导特征的过程往往是机器学习项目中最耗时、最费力的部分。它也被认为是项目中最具创造力且最有趣的部分，其中直觉和试错的作用与技术要求同样重要。机器学习的过程并不是开发训练数据集并执行它的“一劳永逸的过程”，而是一个迭代过程，需要分析运行后的输出，然后修改训练数据集，再次重复整个过程。


    工程训练数据集需要大量投入和精力的另一个原因是领域特定性。用于基于消费者行为分析生成预测的电子商务平台训练集，与开发自动驾驶汽车所需的训练集大不相同。然而，实际的机器学习过程在各个工业领域很大程度上是相同的。难怪，许多研究正致力于特征工程的自动化。


    ## 评估 (Evaluation)


    本质上，判断多个假设或模型以选择其中一个模型而非另一个的过程被称为评估。为了区分有用的分类器和模糊的分类器，需要一个“评估函数”。评估函数也称为“目标”（objective）、“效”（utility）或“评分”（scoring）。机器学习算法有其内部评估函数，这通常与研究人员用于优化的外部评估函数不同。通常，评估函数在选择数据之前作为项目的第一步被定义。例如，自动驾驶汽车的机器学习模型具有识别周围行人的特征，其近乎零的负性率和低假阳性是需要被“表示”的现有条件。


    ## 优化 (Optimization)


    在表示的模型空间中搜索以获得更好评估或最高评分分类器的过程被称为“优化”。对于具有多个分类器的算法，选择技术至关重要。市场上提供了多种现成的优化器，最终它们会被自定义设计的优化器所取代。


    ## 基础机器学习术语


    代理（Agent）—— 在强化学习的语文中，代理指的是使用策略来最大化从状态转换中获得的预期回报的实体。


    提升（Boosting）—— 提升可以定义为一种机器学习技术，通过对模型当前分类错误的示例进行加权，将一组简单且不准确的分类器（称为弱分类器）迭代组合成具有高准确率的分类器（强分类器）。


    候选生成（Candidate generation）——推荐系统选择第一组推荐的阶段被称为候选生成。例如，图书馆可以提供 500,000 本书目。这种技术将产生符合特定用户需求的子集，并可以进一步精炼为更小的集合。


    类别数据（Categorical Data）—— 具有离散可能值的数据。例如，样式可以是轿车、轿跑、SUV。


    检查点（Checkpoint）—— Checkpoint 可以定义为捕捉时刻状态的数据。通过使用检查点，可以在多个会话中进行训练并导出模型权重或分数。


    类（Class）—— 类可以定义为给定标签的列出的目标值之一。例如，旨在检测的机器学习模型将有两个类，即“垃圾邮件”和“非垃圾邮件”。


    分类模型（Classification model）—— 用于区分两个或多个离散类别数据的模型类型。例如，对于犬种的识别，可以评估输入的狗照片是否是拉布拉犬、雪陶犬、德国
    Shepherd、贝格等。


    协同过滤（Collaborative filtering）—— 根据共同兴趣为特定用户生成预测的过程。


    连续数据（Continuous Data）—— （此处原文似乎遗漏，但根据上下文推断为） 包含多个与“类别”具有良好相关性的独立“特征”的训练数据集可以使机器学习变得更加顺畅。另一方面，包含复杂特征的类别可能并不易于机器学习。这通常需要对原始数据进行处理，以便从中构建出所需的特征，并供机器学习模型利用。


    从原始数据中推导特征的过程往往是机器学习项目中最耗时、最费力的部分。它也被认为是项目中最具创造力且最有趣的部分，其中直觉和试错的作用与技术要求同样重要。机器学习的过程并不是开发训练数据集并执行它的“一劳永逸的过程”，而是一个迭代过程，需要分析运行后的输出，然后修改训练数据集，再次重复整个过程。


    工程训练数据集需要大量投入和精力的另一个原因是领域特定性。用于基于消费者行为分析生成预测的电子商务平台训练集，与开发自动驾驶汽车所需的训练集大不相同。然而，实际的机器学习过程在各个工业领域很大程度上是相同的。难怪，许多研究正致力于特征工程的自动化。


    判别器（Discriminator）—— 判定输入是真假的系统。


    下采样（Down-sampling）—— 在机器学习模型中减少数据的比例。


    动态模型（Dynamic model）—— 持续接收输入以进行持续训练的模型。


    集成（Ensemble）—— 合并多个模型的预测。


    环境（Environment）—— 强化学习中的观测世界。


    回合（Episode）—— 强化学习环境中的每一次尝试。


    特征（Feature）—— 用于生成预测的输入变量。


    特征工程（Feature engineering）—— 将原始数据转换为有用特征的过程。


    特征提取（Feature extraction）—— 从无监督模型中检索中间特征表示的过程。


    少样本学习（Few-shot learning）—— 仅从少量示例学习有效分类器的方法。


    微调（Fine-tuning）—— 调整已训练模型的参数以适应新问题。


    泛化（Generalization）—— 机器学习模型对未见数据做出正确预测的能力。


    推理（Inference）—— 将训练好的模型应用于无标记示例以预测的过程。


    标签（Label）—— 监督学习中的结果部分。标记数据集可以包含单个或多个特征以及对应的标签。例如，在房屋数据集中，特征可能包括建筑年份、卧室和浴室数量，而标签可以是房屋的价格。


    线性模型（Linear model）—— 定义为每个特征分配一个权重以预测的模型。


    损失（Loss）—— 在机器学习中，损失是指模型生成的预测与其标签之间距离的衡量。


    Matplotlib —— 一个开源 Python 2D 绘图库，用于可视化机器学习的不同方面。


    模型（Model）—— 在机器学习中，模型可以定义为结果。


    NumPy —— 提供数组操作的开源数学库。


    单样本学习（One-shot learning）—— 在机器学习中，单样本学习是指常用于对象分类的方法。


    过拟合（Overfitting）—— 在机器学习中，过拟合是指模型过度匹配数据以至于无法做出正确预测。


    参数（Parameter）—— 模型变量。


    流水线（Pipeline）—— 在机器学习中，流水线是指使用数据的设施。


    随机森林（Random forest）—— 在机器学习中，随机森林是一种使用决策树的集成方法。


    缩放（Scaling）—— 在机器学习中，缩放是指值的范围。


    序列模型（Sequence model）—— 序列模型是指具有顺序依赖的模型。


    欠拟合（Under-fitting）—— 在机器学习中，欠拟合是指模型未捕捉数据的复杂性。


    验证（Validation）—— 用于评估模型质量的过程。


