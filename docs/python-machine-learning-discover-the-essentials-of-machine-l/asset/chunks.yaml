    \ train_labels, epochs=5)`. The epochs are displayed as below, suggesting that\
    \ the model has reached accuracy of around 0.89 or 89% of the training data:\n\
    \n```\nEpoch 1/5 60000/60000 [==============================] - 4s 75us/sample\
