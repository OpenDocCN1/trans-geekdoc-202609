    版权 © 2019 Samuel Hack - 版权所有。本书仅供个人使用。未经出版者事先许可，不得以任何形式或通过任何手段复制、传播或传输本书的内容，包括复印、录制或其他电子或机械方法，但批判性评论中的简短引用以及版权法允许的某些非商业用途除外。


    ## 目录

    - 引言

    - 第 1 章：机器学习基础

    - 第 2 章：机器学习算法

    - 第 3 章：数据科学技术基础

    - 第 4 章：机器学习库“Scikit-Learn”101

    - 第 5 章：使用 Tensorflow 进行神经网络训练

    - 第 6 章：数据预处理与训练数据集构建

    - 结


    ## 引言恭喜购买《Python 机器学习：使用 Python 代码和 Python 技巧探索机器学习、数据分析、数据科学、数据挖掘和人工智能的核心要义》，感谢您的支持。后续章节将讨论使用
    Python 编程语言开发和改进的“机器学习”模型的核心概念。本书将就你如何使用 Python 通过 `Scikit-Learn` 和 `TensorFlow`
    机器学习库来开发机器学习模型提供全面的指导。


    你将从对机器学习技术基础和机器学习类型的牢实理解开始本书。掌握机器学习技术概念，并学习研究人员如何通过各种学习算法让机器模拟人类智能，从而突破数据科学的边界是至关重要的。机器学习技术的力量已经在我们的环境和日常物品中开始显现。


    在第 2 章“机器学习算法”中，你将用非常易懂的语言学习“12 种流行的机器学习算法”的细微差别，这不需要任何 Python 编程背景，并且可能会激发你对该研究领域的兴趣。你将学习基础性的机器学习算法，即监督学习、无监督学习和强化学习算法，它们是每天开发的成百上千机器学习算法的骨架。


    第 3 章“数据科学技术基础”将为你提供各种数据科学技术的清晰简洁概述，这些技术正通过第四次工业革命的经历塑造我们的现在，并决定我们的技术未来。数据科学是一个术语，用于指代当今尖端技术，如“大数据或大数据分析”、“数据挖掘技术”、“机器学习技术”甚至“人工智能技术”。


    在第 4 章“机器学习库‘Scikit-Learn’101”中，我们将深入探讨 `Scikit-Learn` 库的功能，以及使用 `Scikit-Learn`
    库开发机器学习模型所需的先决条件。通过使用开源数据库、插图和实际 Python 代码进行详细演示，你可以按照书中的指令进行实操练习。学习知识没有比亲自动手并获得任务的真实体验更好的方法了。


    在第 5 章“使用 Tensorflow 进行神经网络训练”中，你将学习使用 TensorFlow 创建机器学习模型的整个过程。神经网络的特点是类神经元的实体，能够从输入中学习。TensorFlow
    构建在数据集之上。在本书的最后一章“数据预处理与数据集构建”中，你将学习机器学习中最耗时且最关键的方面。作为奖励，你将学习一些 Python 技巧和技巧，让你的机器学习水平更上一层楼。


    ## 第 1 章：机器学习基础

    人工智能技术的概念源于这样观点：机器具有人类的智能，能够模拟人类的思维处理和学习能力，适应新的输入并在无需人类帮助的情况下执行任务。机器学习技术（`ML`）是指人工智能技术的一种概念，主要关注机器的工程能力，即通过识别数据模式来显式学习和自我训练，从而改进底层算法。


    1959 年，计算机游戏和人工智能领域的专家 Arthur Samuel 在 IBM 任职期间创造了“机器学习”这一术语。机器学习假设现代计算机可以使用目标数据集进行训练，这些数据集可以易于定制以开发所需的功能。机器学习由模式识别技术驱动，在该技术中，机器记录并回溯过去的交互和结果，这些结果被认为符合其当前的情况。鉴于机器需要处理数无尽的数据，且新数据不断涌入，它们必须具备在无需人类编程的情况下适应新数据的能力，这体现了
    `ML` 的迭代特性。以下是来自某些高声誉来源的广泛接受的定义：


    - “机器学习是一门让计算机在没有被明确编程的情况下采取行动的科学。” – 斯坦福大学

    - “机器学习领域寻求回答一个问题：我们如何能够构建能够随着经验自动改进的计算机系统，以及支配所有学习过程的基本法则是什么？” – 卡内基·梅梅隆大学

    - “机器学习算法可以通过从示例中泛化来找出如何执行重要任务。” – 华盛顿大学

    - “机器学习最基本的实践是使用算法解析数据、从中学习，然后对世界上的某件事做出决策或预测。” – 英伟达（Nvidia）

    - “机器学习基于可以从数据中学习而不依赖基于规则编程的算法。” – 麦肯锡（McKinsey）。


