    \ the data set while making sure the data set is divided randomly. The Scikit-Learn\
    \ library offers us a tool called the “Model Selection library”, to assist with\
    \ this task. There is a “class” in the Scikit-Learn library called “train\\_test\\\
    _split”. Using this, we can readily divide the data set into the “training” and\
    \ “testing” datasets in desired ratios. Some parameters to consider while using\
    \ this tool are: \n\n*   Test\\_size - It helps in determining the size of the\
    \ data to be divided as the testing data set, like a fraction of the total data\
    \ set. For example, entering 0.3 as the “test\\_size” value, the data set will\
    \ be divided at 30 percent as the test data set. If you specify this parameter,\
    \ the next parameter may be ignored. \n\n*   Train\\_size – This parameter is\
    \ only specified if the “test\\_size” has not been specified already. The process\
    \ works similar to the “test\\_size” function, except that the percentage of the\
    \ data set specified is for the “training set”. \n\n*   Random\\_state - An integer\
    \ is entered here for the Scikit-Learn class, based on which the “random number\
    \ generator” will be activated during the data set split. Alternatively, an instance\
    \ of “RandomState” class can b entered that will then generate random numbers.\
    \ If you don't enter either of the functions, the default will be activated which\
    \ leverages the “RandomState” instance used by “np.random”. \n\nFor example, the\
    \ data set in the picture below can be split into two subsets: ‘X’ subset for\
    \ the “independent features” and ‘Y’ subset for the “dependent variables” and\
    \ also happens to be the last column of the data set. ![](image962.jpg)Now we\
    \ can use the code below to split the “x” data set into two subsets: “xTrain”\
    \ and “xTest” and likewise, split the “y” data set into two subsets “yTrain” and\
    \ “yTest”. “from sklearn.model\\_selection import train\\_test\\_split  "
