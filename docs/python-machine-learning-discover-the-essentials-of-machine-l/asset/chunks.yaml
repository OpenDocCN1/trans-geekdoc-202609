    # Chapter 6: Data Pre-processing and Creation of Training Data Set


    Data Preprocessing is a “data mining technique, which is used to transform raw
    data into a comprehensible and effective format”. Real-world data tend to lack
    certain behaviors or trends and is almost always incomplete, inconsistent and/or
    missing attribute values, flooded with errors or outliers. Preprocessing data
    is a proven way to solve such problems. This raw data or real data from the world
    can not be readily transmitted through a machine learning model. Therefore, before
    feeding real-world data to a machine learning model, we need to clean and pre-process
    it.


    ## Overview


    ### Data Preprocessing


    #### Data Cleaning

    Many meaningless and missing sections can be found in the data. Data cleaning
    is performed performed to manage these inadequacies and constitutes handling data
    set that is missing values and consists of noisy data.


    ##### Missing Data

    In this scenario, certain significant information in the data set is missing.
    It can be dealt with in different respects such as:

    - **Ignoring the tuples**: This strategy is appropriate only if the dataset is
    big and numerous values within a tuple are lacking.

    - **Fill the missing values**: This assignment can be done in different ways such
    as: manually completing the missing values using the mean attribute or the most
    relevant value.


    ##### Noisy Data

    “Noisy data” is useless data that machines or the machine learning model is unable
    to interpret. It can be generated as a result of defective data collection or
    mistakes in data entry, among others. It can be addressed using the methods below:

    - **Binning Method**: This technique operates on sorted data to smoothen it out.
    The entire data set is split into equivalent size sections and then different
    techniques are used to finish the job. Each section is fixed individually. To
    fix the entire data set in ago, all data points in a section can be substituted
    with its “mean” or most probable values.

    - **Regression**: In this case, data can be smoothed out by fitting into a “regression
    function”, which can be either “linear” (with one autonomous variable) or “multiple”
    (with various autonomous variables).

    - **Clustering**: This technique is used to group comparable data points into
    a cluster. The outliers could be obtained with data points falling outside of
    the clusters or could not be detected.


    #### Data Transformation

    This technique is used to convert the data into a format which is suitable for
    the data mining method. This includes the following ways:

    - **Normalization**: This technique is used to scale data values within a defined
    range, for example, “-1.0 to 1.0” or “0.0 to 1.0”.

    - **Attribute Selection**: New data attributes can be generated from an existing
    data set of characteristics, using this technique to assist in the data mining
    process.

    - **Discretization**: This technique is used to “replace raw values of numerical
    attributes with interval or conceptual levels”.

    - **Generation of the concept of hierarchy**: This technique is used to transform
    lower-level data attributes to higher level in the hierarchical setup. For example,
    you can convert the attribute "city" to "country."


    #### Data Reduction

    “Data mining” is a method used for analysis and extraction of insights from Big
    data. In such instances, analysis becomes more and more difficult to work with
    given the enormity of data. We use data reduction method to reduce the volume
    of data set to an optimal and manageable volume. With this method, the cost of
    data storage and analysis can be significantly lowered while improving the effectiveness
    of the data storage. It can be dealt with in different respects such as:

    - **Data Cube Aggregation**: This technique is used to apply “aggregation operation”
    to data to effectively build data cubes.

    - **Selection of attribute subset**: This technique is used to ensure that only
    necessary attributes are used.

    - **Numerosity Reduction**: This technique allows the data set to be stored instead
    of whole data.

    - **Dimensionality Reduction**: This technique uses mechanisms to reduce data.
    If initial data set can be compressed, it is referred to as “loss reduction”.
    The two efficient techniques of reducing data are “Wavelet transforms” and “PCA
    (Principal Component Analysis)”.


    ## Steps of Data-processing


    ### I – Import the data library

    There is a wide variety of data libraries that you can choose to meet your data
    requirements, such as:

    - `Pandas`: Widely used for data manipulation.

    - `NumPy`: A basic package to perform scientific computations using Python.

    - `Matplotlib`: A standard Library used to create 2-D plots.

    - `Seaborn`: derived from `Matplotlib`, an extremely popular visualization library.

    - `Scikit-Learn`: for data preprocessing techniques and algorithms.


    To import the libraries mentioned above, use the code below:


    For main libraries:

    ```python

    import pandas as pd

    import numpy as np

    import time

    ```


    For visualization libraries:

    ```python

    from matplotlib import pyplot as plt

    import seaborn as sns

    from mpl_toolkits.plot3d import Axes3D

    plt.style.use(''ggplot'')

    ```


    For Scikit-Learn libraries:

    ```python

    from sklearn.neighbors import KNeighborsClassifier

    from sklearn.model_selection import train_test_split

    from sklearn.preprocessing import normalize

    from sklearn.metrics import confusion_matrix,accuracy_score,precision_score,recall_score,f1_score,matthews_corrcoef,classification_report,roc_curve

    from sklearn.externals import joblib

    from sklearn.preprocessing import StandardScaler

    from sklearn.decomposition import PCA

    ```


    ### II – Data exploration

    To get some sense of the imported dataset in `Pandas`, use the code below:

    ```python

    # Read the data in the CSV file using pandas

    df = pd.read_csv(''../input/creditcard.csv'')

    df.head()

    ```


    ### III – Check for missing values

    It is essential to comprehend the concept of missing values to be able to effectively
    manage data. If the researcher does not handle the missing values correctly, they
    may end up drawing incorrect data inferences. Because of improper handling, the
    results produced will be different from those with missing values. You can apply
    any of the techniques below to deal with missing data values in your data set:


    1. **Ignore the data row**: This is generally performed when the “class label”
    is missing or if a multiple data attribute is missing in the row, assuming the
    data mining objective is classification. However, if the proportion of such rows
    with missing class labels is high, you will get bad output. For instance, database
    with enrolment data for the student (age, SAT score, address, etc.) containing
    a column with "Low", "Medium" and "High" to classify their achievement in college.
    Assuming the objective is to construct a model that predicts the college achievement
    of a student. Data rows that do not include the achievement column are not helpful
    to generate predictions regarding the success of the student, so they can be overlooked
    and deleted before the algorithm is executed.


    2. **Use a global constant to fill in for missing values**

