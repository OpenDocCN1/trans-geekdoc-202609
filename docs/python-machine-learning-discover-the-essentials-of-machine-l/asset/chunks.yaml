    1. Gather, classify and label the training data set with “feature variables” and
    “classification or regression output”.


    2. Identify the best and most cost-effective feature within the training data
    set that will be used as the point for bifurcating the data.


    3. Based on the possible values of the selected "best feature", create subsets
    of data by bifurcating the data set. These bifurcations will define the "branch
    nodes" of the decision tree, wherein each node serves as a point of bifurcation
    based on specific features from the data set.


    4. Iteratively develop new tree nodes with the use of data subsets gathered from
    step 3. These bifurcations will continue until an optimal point is reached, where
    maximum accuracy is achieved while minimizing the number of bifurcations or nodes.


    ## Pruning

    The inherent purpose of decision trees is to support training and self-learning
    of the system, which often requires overloading of all possible conditions and
    influencing factors that might affect the final result. To overcome the challenge
    of setting the correct output for least number of instances per node, developers
    make a "safe bet" by settling for that "least number" as rather small. This results
    in a high number of bifurcations on necessary, making for a very complex and large
    decision tree. This is where "tree pruning" comes into the picture. The verb "prune"
    literally means "to reduce especially by eliminating superfluous matter". This
    is the same kind of concept taken from real-life tree pruning and applied to the
    data science and machine learning decision tree pruning process. The process of
    pruning effectively reduces the overall complexity of the decision tree by "transforming
    and compressing strict and rigid decision boundaries into generalized and smooth
    boundaries". The number of bifurcations of the decision trees determines the overall
    complexity of the tree. The easiest and widely used pruning method is reviewing
    individual branch nodes and evaluating the effect of its removal on the cost function
    of the decision tree. If the cost function has little to no effect of the removal,
    then the branch node under review can be easily removed or "pruned".


    ## 10. Apriori machine learning algorithm

    `Apri algorithm` is another unsupervised ML algorithm that can produce rules of
    the association from a specified set of data. "Association rule" simply means
    if an item X exists then the item Y has a predefined probability of existence.
    Most rules of association are produced in the format of "IF-THEN" statements.
    For instance, "IF" someone purchases an iPhone, "THEN" they have most likely purchased
    an iPhone case as well. The Apriori algorithm can draw these findings by initially
    observing the number of individuals who purchased an iPhone case while making
    an iPhone purchase and generating a ratio obtained by dividing the number individuals
    who bought a new iPhone (1000) with individuals who also bought an iPhone case
    (800) with their new iPhones. The fundamental principles of Apriori ML Algorithm
    are:


    - If a set of events have high frequency of occurrence, then all subsets of that
    event set will also have high frequency of occurrence.

    - If a set of events occur occasionally, then all supersets of the event set of
    will occur occasionally as well.


    Apriori algorithm has wide applicability in the following areas:


    ### Detecting Adverse Drug Reactions

    `Apriori algorithm` is used to analyze healthcare data such as the drugs administered
    to the patient, characteristics of each patient, harmful side effects experienced
    by the patient, the original diagnosis, among others. This analysis generates
    rules of association that provide insight into the character of the patient and
    the administered drug that potentially contributed to adverse effects of the drug.


    ### Market Basket Analysis

    Some of the leading e-commerce businesses including `Amazon`, use Apriori algorithm
    to gather insights on products that have high likelihood of being bought together
    and products that can have an upsell with product promotions and discount offers.
    For instance, Apori could be used by a retailer to generate prediction such as
    customers purchasing sugar and flour have high likelihood of purchasing eggs to
    bake cookies and cakes.


    ### Auto-Complete Applications

    The highly cherished auto-complete feature on `Google` is another common Apriori
    application. When the user starts typing in their keywords for a search, the search
    engine searches its database for other related phrases that are usually typed
    after a particular word.


    ## 11. Support vector machine learning algorithm

    `Support Vector Machine` or (SVM) is a type of `supervised ML algorithm`, used
    for `classification` or `regression`, where the data set trains SVM on `classes`
    to be able to classify new inputs. This algorithm operates by classifying the
    data into various `classes` by discovering a line (hyper-plane) that divides the
    collection of training data into `classes`. Due to availability of various linear
    hyper-planes, this algorithm attempts to maximize the distance between the different
    `classes` involved, which is called as `margin maximization`. By identifying the
    line that maximizes the class distance, the likelihood of generalizing apparent
    to unseen data can be improved. SVM''s can be categorized into two as follows:


    - `Linear SVM''s` – The training data or classifiers can be divided by a hyper-plane.

    - `Non-Linear SVM''s` – Unlike linear SVMs, in `non-linear SVM''s` the possibility
    to separate the training data with a hyper-plane is non-existent. For example,
    the Face Detection training data consists of a group of facial images and another
    group of non-facial images. The training data is so complicated under such circumstances,
    that it is difficult to obtain a feature representation of every single vector.
    It is extremely complex to separate the facial data set linearly from the non-facial
    data set.

