    ### 1. 知识

    机器需要大量的信息来理解和处理真实世界。对于人工智能知识工程的发展来说，无缝访问通过数据存储存储和管理的信息对象、类别、特征和交互至关重要。


    ### 2. 学习

    测试与纠错（testing and error）的这一长青技术往往是人工智能技术最容易的教学类型。


    ### 3. 解决问题

    “通过搜索一系列可能的行动来达到预定义目标或解决方案的系统过程”可以被定义为解决问题。


    ### 4. 推理

    根据当前场景进行推断的能力被称为推理行为。两种公认的推理类型是“演绎推理”（如果假设成立，则结论为真）和“归纳逻辑”（即使假设成立，结论也可能真实也可能虚假）。人工智能技术增长和推广过程中面临的最具挑战性的任务之一是“真推理”的实现。


    ### 5. 感知

    感知涉及使用不同的感官器官创建物体的三维视图的过程，并直接受周围环境的影响。人工智能感知已经创造了自动驾驶汽车以及收集和供应产品的能力。

