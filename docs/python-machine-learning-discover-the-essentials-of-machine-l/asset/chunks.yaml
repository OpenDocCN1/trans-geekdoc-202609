  trans: '


    1. 收集、分类并标记训练数据集，将其分为“特征变量”和“分类或回归输出”。


    2. 在训练数据集中识别出最佳且最具效益的特征，将其作为数据分叉的节点。


    3. 根据所选“最佳特征”的可能取值，通过对数据集进行分叉创建数据子集。这些分叉定义了决策树的“分支节点”，其中每个节点都根据数据集中的特定特征作为分叉点。


    4. 使用步骤 3 收集的数据子集迭代地开发新的树节点。这些分叉将持续进行，直到达到最优点，即在最小化分叉次数或节点数量的同时实现最大准确率。


    ## 剪枝 (Pruning)

    决策树的本质目的是支持系统的训练和自学习，这通常需要加载所有可能影响最终结果的条件和影响因素。为了克服为每个节点设置最少实例的正确输出的挑战，开发者往往通过将该“最小数量”设定为一个小数值来得出一个“稳妥的赌注”。这导致在必要的地方产生大量的分叉，从而形成一个非常复杂且庞大的决策树。这就是“树剪枝”派上用场的地方。“剪枝”一词的字面意思是“通过消除多余物质来减少”。这种概念源自现实生活中的修剪，并被应用于数据科学和机器学习的决策树剪枝过程中。剪枝过程通过“将严格僵化的决策边界转换为通用且平滑的边界”，有效地降低了决策树的整体复杂度。决策树的分叉次数决定了树的整体复杂度。最简单且常用的剪枝方法是审查单个分支节点，并评估将其移除对决策树成本函数的影响。如果对成本函数的影响很小或没有，则审查的分支节点就可以轻松移除或“剪枝”。


    ## 10. Apriori 机器学习算法

    `Apri algorithm` 是另一种无监督机器学习算法，可以从特定数据集中产生关联规则。“关联规则”简单意味着如果存在项目 X，则项目 Y 具有预定义的出现概率。大多数关联规则以“IF-THEN”语句的形式产生。例如，“如果”某人购买了
    iPhone，“那么”他们很可能也购买了 iPhone 手机壳。Apriori 算法可以通过最初观察购买 iPhone 的同时购买手机壳的人数，并生成一个比例（用购买新
    iPhone 的人数 1000 除以同样为新 iPhone 购买手机壳的人数 800）得出这些发现。Apriori 机器学习算法的基本原理是：


    - 如果一组事件发生的频率很高，那么该事件集的所有子集也将具有高发生频率。

    - 如果一组事件偶尔发生，那么该事件集的所有超集也将偶尔发生。


    Apriori 算法在以下领域具有广泛的适用性：


    ### 检测药物不良反应

    `Apriori algorithm` 用于分析医疗数据，例如给给患者的药物、每位患者的特征、患者经历的有害副作用、原始诊断等。这种分析产生的关联规则可以为患者的特征以及可能导致药物副作用的给药药物提供见解。


    ### 市场篮子分析

    包括 `Amazon` 在内的一些领先电子商务业务使用 Apriori 算法对极高概率一起购买的产品，以及可以通过产品促销和折扣优惠进行追加销售的产品收集洞解。例如，零售商可以使用
    Apriori 生成此类预测：即购买糖和面粉的客户很有可能购买鸡蛋来制作饼干和蛋糕。


    ### 自动补全应用

    `Google` 上备受青爱的自动补全功能是另一种常见的 Apriori 应用。当用户开始输入搜索关键词时，搜索引擎会在其数据库中搜索在特定单词之后通常会输入的其他相关短语。


    ## 11. 支持向量机机器学习算法

    `Support Vector Machine`（或 SVM）是一类`supervised ML algorithm`，用于`classification`
    或 `regression`，其中数据集在 `classes` 上训练 SVM，以便对新输入进行分类。该算法通过发现一条将训练数据集合划分为不同 `classes`
    的直线（超平面）来对数据进行各种类别分类。由于存在各种线性超平面，该算法尝试最大化不同 `classes` 之间的距离，这被称为“间隔最大化”。通过识别使类别距离最大化的直线，可以提高对未见数据的泛化能力。SVM
    可分为以下两类：


    - `Linear SVM''s` – 训练数据或分类器可以被超平面划分。

    - `Non-Linear SVM''s` – 与线性 SVM 不同，在 `non-linear SVM''s` 中不存在用超平面分离训练数据的可能性。例如，人脸检测训练数据由一组脸部图像和另一组非脸部图像组成。在这种情况下，训练数据非常复杂，难以获取每一个向量的特征表示。在线性地将脸部数据集与非脸部数据集分离是极其复杂的。


    '
- fmt: '

    `SVM` is widely used by different economic organizations for stock market forecasting.
    For example, `SVM` is leveraged to compare relative stock performances of various
    stocks in the same industrial sector. The classifications generated by `SVM`,
    aids in the investment-related decision-making process.


    ## The Kernel Trick


    The data collected in the real world is randomly distributed and making it too
    difficult to separate different classes linearly. However, if we can potentially
    figure out a way to map the data from 2-dimensional space to 3-dimensional space,
    as shown in the picture below, we will be able to discover a decision surface
    that separates distinct classes. ![](image382.jpg)


    One approach to transforming data like this is mapping all data points to a higher
    dimension (in this case, 3 dimensions), finding the limit, and making the classification.
    That works for a limited number of dimensions but computations within given space
    become increasingly costly when there are a lot of dimensions to deal with. And
    so the kernel trick comes to the rescue!


    The “kernel trick” enables us to function in the original feature space without
    needing to calculate the data coordinates in a higher-dimensional space. For example,
    the equation in the picture below has a couple of 3-D data points as `x` and `y`.
    ![](image388.jpg)


    Suppose we want to map `x` and `y` to 9-dimensional space. To get the outcome,
    which would be just scalar, we have to do the calculations shown in the picture
    below. In this case, the computational complexity will be `O(n2)`. ![](image393.jpg)![](image397.jpg)


    However, by using the “kernel function”, which is denoted as `k(x, y)`, instead
    of doing the complex calculations in the 9-dimensional space, the same outcome
    can be achieved in the 3-dimensional space by calculating the “dot product” of
    `x-transpose` and `y`. In this case, the computational complexity will be `O(n)`.
    ![](image402.jpg)


    In principle, the kernel trick is used to make the transformation of data into
    higher dimensions much more effective and less costly. The use of the kernel trick
    is not restricted to the `SVM` algorithm. The kernel trick can be used with any
    computations involving the “dot products (x, y)”.


    ## Chapter 3: Basics of Data Science Technologies


    In the world of technology, Data has described like an "information that a computer
    is capable of processing and storing". Thanks to our digital lived data has flooded
    our realities. Our world is drowning with increasing data collected every second,
    from clicking on a website to monitoring our smartphones and recording our location
    every second of the day. We could extract alternatives or solutions to our real-world
    issues that we have not even experienced yet, from the depth of this humongous
    volume of data. This very process of collecting ideas using mathematical equations
    and statistics from a measurable set of information can be described as "Data
    Science".


    Data scientist''s role tends to be very flexible and is often mistaken for the
    role of a computer scientist or a statistician. Essentially anyone prepared to
    dig deep into big amounts of data to collect information can be referred to us
    data science practitioner. For instance, businesses such as "Walmart" keep track
    and record of customer-made in-store and online purchases providing customized
    product and service recommendations. Social media platforms such as "Facebook,"
    which enable users to list their "current location", can identify trends of worldwide
    migration by evaluating the wealth of information that users themselves provide
    to the platform.


    Back in 1960, the earliest recorded use of the word data science was attributed
    to "Peter Naur”, who supposedly used the word “data science” as a replacement
    for the term computer science and ultimately introduced the word "datalogy". Naur
    released a book entitled "Concise Survey of Computer Methods" in 1974, with liberal
    use throughout the book of the term "data science". In 1992, at "The Second Japanese-French
    Statistics Symposium", the contemporary definition of data science was proposed,
    with the recognition of the emergence of a new discipline focused primarily on
    data types, dimensions, and structures.


    > “Data science continues to evolve as one of the most promising and in-demand
    career paths for skilled professionals. Today, successful data professionals understand
    that they must advance past the traditional skills of analyzing large amounts
    of data, data mining, and programming skills. In order to uncover useful intelligence
    for their organizations, data scientists must master the full spectrum of the
    data science life cycle and possess a level of flexibility and understanding to
    maximize returns at each phase of the process.” – University of California, Berkley


    The growing interest of business executives has contributed considerably to the
    latest increase in the popularity of term data science. A big proportion of journalists
    and scholarly specialists, however, do not recognize data science as a distinct
    field of research from the field of statistics. Data science is construed as the
    popular term for "data mining" and "big data" within the same community. The very
    definition of the term data science appears to be up for discussion within the
    tech community. Therefore, largely the field of research a highly versatile skill
    set including computer programming skills, domain knowledge, proficient statistics
    abilities and expertise in mathematical algorithms to obtain useful knowledge
    from large volumes of raw data can be referred to as “data science”.


    ## Importance and applications of Data Science


    Now that you have a basic understanding of data science, let''s look at the significance
    and applications of data science in our day-to-day lives:


    *   "Big data and Big Data Analytics" is another ‘branch'' of data science that
    organizations use to tackle complicated technological and resource management
    issues. Later in this book, you will learn more about the concept of big data
    and big data analytics.

    *   Data trends have altered dramatically over the last 20 years, indicating a
    steady rise in unstructured data. It is estimated that "more than 80% of the data
    we collect will be unstructured by the year 2020". Conventionally, the data we
    obtained was primarily structured and could easily be analyzed using the simple
    business intelligence tools, but as shown in the picture below, unstructured and
    semi-structured data is on the rise. This, in turn, justifies the creation and
    use of more powerful and sophisticated analytical tools and technologies, than
    the current business intelligence tools that are unable to process such humongous
    volume and variety of data. We need more advanced analytical tools and algorithms
    that can process and analyze unstructured and semi-structured data to provide
    useful and actionable insights. ![](image427.jpg)

    *   Companies are always on the verge of understanding their customers'' needs
    better and better. This can now be accomplished by collecting data from current
    sources such as customer order history, items viewed recently, gender, age and
    demographics, and using sophisticated analytical tools and algorithms to obtain
    valuable insights from this data. The use of machine learning algorithms can produce
    product suggestions for individual clients with greater precision. The “smart”
    customer is always searching for the most engaging and enhanced user experience,
    so these analytical tools and algorithms can be used by businesses to gain a competitive
    advantage and grow their company.

    *   Data science has made it possible to use sophisticated machine learning algorithms
    that can be applied across various industrial domains. For instance, developing
    self-driving vehicles capable of gathering real-time data, using their advanced
    cameras and sensors to build a map of their environment and make choices about
    car velocity and other driving maneuvers.

