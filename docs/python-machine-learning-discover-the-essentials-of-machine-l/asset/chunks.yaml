    \ - 4s 71us/sample - loss: 0.3763 - acc: 0.8643 Epoch 3/5 60000/60000 [==============================]\
    \ - 4s 71us/sample - loss: 0.3382 - acc: 0.8777 Epoch 4/5 60000/60000 [==============================]\
    \ - 4s 72us/sample - loss: 0.3138 - acc: 0.8846 Epoch 5/5 60000/60000 [==============================]\
    \ - 4s 72us/sample - loss: 0.2967 - acc: 0.8897 <tensorflow.python.keras.callbacks.History\
    \ at 0x7f65fb64b5c0>\n```\n\n## VI – Measuring the accuracy of the Neural Network\
    \ Model\nTo test the accuracy of the network, it must be verified against the\
    \ testing data set using commands below:\n\n`test_loss, test_acc = model.evaluate(test_images,\
    \ test_labels)`\n\n`print('Test accuracy:', test_acc)`\n\nThe output can be obtained\
    \ as shown below, which suggests that the accuracy of the test result is around\
    \ 0.86 or 86%, which is slightly less that the accuracy of the training data set.\
    \ This is a classic example of “overfitting”, when the performance or accuracy\
    \ of the model is lower on new input or testing data than the training data.\n\
    \n```\n10000/10000 [==============================] - 1s 51us/sample - loss: 0.3653\
    \ - acc: 0.8671 Test accuracy: 0.8671\n```\n\n## VII – Generate predictions using\
    \ the Neural Network Model\nNow that our model has been trained sufficiently,\
    \ we are ready to generate predictions from the model, using command `predictions\
    \ = model.predict(test_images)`. In the code below, the network has generated\
    \ a prediction for labels of each picture in the testing data set. The prediction\
    \ is generated as an array of ten integers with the \"confidence\" index for each\
    \ of the ten categories (in referring to the import data stage) corresponding\
    \ to the test picture.\n\n`predictions[0]`\n\n```python\narray([6.58371528e-06,\
    \ 1.36480646e-10, 4.17183337e-08, 1.15178166e-10, 8.30939484e-07, 1.49914682e-01,\
    \ 3.11488043e-06, 4.63472381e-02, 6.10820061e-05, 8.03666413e-01], dtype=float32)\n\
    ```\n\nTo view the label with the highest “confidence” index, using command `np.argmax(predictions[0])`.\
    \ A result `9`, will suggest that the model has maximum confidence on the test\
    \ image belonging to `class_names[9]` or according to our labels table, ankle\
    \ boot. To verify this prediction, use command `test_labels[0]`, which should\
    \ generate output as `9`.\n\nTo view the whole set of predictions for the ten\
    \ classes, use command below:\n\n```python\ndef plot_image(i, predictions_array,\
    \ true_label, img):\n  predictions_array, true_label, img = predictions_array[i],\
    \ true_label[i], img[i]\n  plt.grid(False)\n  plt.xticks([])\n  plt.yticks([])\n\
    \  plt.imshow(img, cmap=plt.cm.binary)\n  predicted_label = np.argmax(predictions_array)\n\
    \  if predicted_label == true_label:\n    color = 'blue'\n  else:\n    color =\
    \ 'red'\n  plt.xlabel('{} {:2.0f}% ({})'.format(class_names[predicted_label],\n\
    \                               100*np.max(predictions_array),\n             \
    \                        class_names[true_label],\n                          \
    \           color=color))\n\ndef plot_value_array(i, predictions_array, true_label):\n\
    \  predictions_array, true_label = predictions_array[i], true_label[i]\n  plt.grid(False)\n\
    \  plt.xticks([])\n  plt.yticks([])\n  thisplot = plt.bar(range(10), predictions_array,\
    \ color='#777777')\n  plt.ylim([0, 1])\n  predicted_label = np.argmax(predictions_array)\n\
    \  thisplot[predicted_label].set_color('red')\n  thisplot[true_label].set_color('blue')\n\
    ```\n\nTo generate a graph or plot for the prediction (as shown in the picture\
    \ below), use command below:\n\n```python\nplot_value_array(0, predictions_single,\
    \ test_labels)\nplt.xticks(range(10), class_names, rotation=45)\nplt.show()\n\
    ```\n\nNow, for example, you may want to generate a prediction for a specific\
    \ picture in the testing set. You can do this using the command below:\n\n```python\n\
    # Grab an image from the test dataset\nimg = test_images[0]\nprint(img.shape)\n\
    ```\n`(28, 28)`\n\nTo use the `tf.keras` models to generate this prediction, the\
    \ picture must be added to a list, since these models have been optimized to generate\
    \ predictions on a \"collection of dataset\" at a time. Use the command below\
    \ to accomplish this:\n\n```python\n# Add the image to a batch where it's the\
    \ only member.\nimg = np.expand_dims(img,0)\nprint(img.shape)\n```\n`(1, 28, 28)`\n\
    \nNow, to generate the prediction for the picture using `tf.keras` use the command\
    \ below:\n\n```python\npredictions_single = model.predict(img)\nprint(predictions_single)\n\
    ```\nThe predictions generated will resemble the code below:\n\n```python\n[[6.5837266e-06,\
    \ 1.3648087e-10, 4.1718483e-08, 1.1517859e-10, 8.3093937e-07, 1.4991476e-01, 3.1148918e-06,\
    \ 4.6347316e-02, 6.1082108e-05, 8.0366623e-01]]\n```\n\nThe `model.predict` generated\
    \ the output as a “list of lists”, for every single picture in the testing data\
    \ set. To generate predictions specifically for the specific image we used earlier,\
    \ use command below:\n\n```python\nprediction_result = np.argmax(predictions_single[0])\n\
    print(prediction_result)\n```\nThe output or prediction generated should be `9`\
    \ as we obtained earlier.\n"
