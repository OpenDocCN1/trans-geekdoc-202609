    # 第 2 章：机器学习算法


    通过利用先验计算和底层算法，机器现在能够对自身数据进行学习和训练，从而生成高质量且易于复制的决策和结果。机器学习的概念已经存在很长时间，但机器学习算法的最新进展使得计算机处理大规模数据处理和分析成为可能。这是通过使用高速高频自动化应用复杂精密的数学计算实现的。如今的先进计算机器可以快速分析海量信息，并提供更快、更准确的结果。使用机器学习算法的公司增加了灵活性，可以更改训练数据集以满足公司需求并据此对机器进行训练。这些定制的机器学习算法使公司能够定义潜在的风险和发展机会。通常，机器学习算法与人工智能技术和认知技术协作使用，使计算机在处理大量信息或大数据时变得极其高效、有效，并生成极其精确的结果。目前有四种基本的机器学习算法。


    ## 监督学习算法


    由于监督学习算法能够评估并将从之前的迭代和交互中学到的经验应用于新的输入数据集，因此它们通常被用于预测性大数据分析。根据为了有效预测和预测未来事件而给出的指令，这些算法可以对其所有正在运行的任务进行标记。例如，人们可以将机器程序为
    `R`（运行）、`N`（负）或 `P`（正）来标记其数据点。机器学习算法随后将按照程序对输入数据进行标记，并获得具有正确输出的数据输入。算法将将其产生的输出与`预期或正确`的输出进行比较，识别可以产生的未来变化并修复错误，使模型更精确、更智能。通过使用`回归`、`预测`、`分类`和`成分提升`（ingredient
    boosting）等方法良好地训练机器学习算法，任何新的输入数据都可以作为一组`目标`数据输入机器，以按意愿编排学习程序。这种`已知训练数据集`启动了分析过程，随后由学习算法产生一个`推断特征`，该特征可以根据未来事件的输出值生成预测和估计。例如，金融机构和银行高度依赖监控机器学习算法来检测信用卡欺诈，并预测潜在信用卡客户未能按时偿还贷款的概率。![](img/image233.jpg)


    ## 无监督学习算法


    公司经常发现自己处于这样一种场景：无法获取生成带标记和分类的训练数据集所需的信息源。在这种情况下，使用无监督机器学习（ML）算法是完美的。无监督机器学习算法被广泛用于定义机器如何生成`推断特征`，以从未标记和未分类的数据集中阐明隐藏的结构。这些算法可以探索数据以在数据量中定义结构。与监督机器学习算法不同，无监督算法无法识别正确输出，尽管它们在研究输入数据和得出结论方面与监督学习算法一样有效。这些算法可以识别信息离群值，使用`自组织映射`、`奇异值分解`和`k-means
    聚类`等方法对文本主题分类，生成定制的产品推荐。例如，识别具有共同购物特征的客户，并将其分为特定的组，重点关注可比的营销策略和活动。因此，在在线营销领域，无监督学习算法非常流行。![](img/image240.jpg)


    ## 半监督学习算法


    功能极其强大的`半监督机器学习算法`能够同时使用标记和未标记的信息集进行学习和自我训练。这些算法是监督和无监督算法的`混合体`。通常，通过少量的标记数据，训练数据集主要由未标记数据组成。将`预测`、`回归`和`分类`在内的分析方法与半监督学习算法相结合，使机器能够大幅提高其学习精度和训练能力。这些算法通常用于企业从原始未标记数据生成标记训练数据集时成本极高且成本效益低的情况。公司在系统中使用半监督学习算法以避免产生人员和设备的额外成本。例如，`人脸识别`技术的实施需要分布在各种输入源的大量面部数据。从网络摄像头等源获取的原始数据预处理、处理、分类和标记需要大量的资源和数小时的工作才能作为训练数据集。


    ## 强化学习算法


    `强化机器学习算法`的独特之处在于它们从环境中环境中学习。这些算法执行活动并勤奋地记录每个动作的结果，这些结果可能是导致错误的失败，也可能是表现优的奖励。区分强化学习算法的两个主要特征是`试错`研究方法和`延迟奖励`的反馈回路。通过一系列计算，计算机不断分析输入数据，并为每个正确或预期的输出发送强化信号，以最终优化最终结果。算法开发了一个简单的动作获取反馈的回路，用以评估、记录和学习哪些动作是有效的，并在较短时间内产生正确或预期的输出。使用这些算法允许系统在特定背景的限制内自动确定最佳行为并最大化其效率。因此，强化机器学习算法被广泛应用于游戏、机器人工程和导航系统。


    机器学习算法已扩散到数百、数千种且在不断增加。以下是一些最广泛使用的算法：


    ### 1. 回归


    `回归`方法属于监督学习类别。它们有助于根据先验数据集预测或描述特定的数值，例如根据可比房产的先验价格数据预测某属性的价格。回归方法从简单（如`线性回归`）到复杂（如`正则线性回归`、`多项式回归`、`决策树`、`随机森林回归`和`神经网络`等）。最简单的技术是`线性回归`，它使用`直线方程
    (y= m* x+ b)`对数据集进行建模。通过计算直线的位置和斜率，可以使用多个`数据对 (x, y)` 训练`线性回归`模型，从而减少数据点与直线之间的整体距离。换句话说，对于一条产生数据观测值最佳近似的直线，使用了`斜率
    (m)`和`y-截距 (b)`的计算。![](img/image254.jpg)


    例如，使用`线性回归`技术，通过收集房屋年龄、某些卧室、面积以及几台安装的电子设备，为房屋的能耗（kWh）生成预测。现在，我们有多个输入（建筑年份、平方英尺），可以使用`线性多元回归`。其底层过程与`一对一线性回归`相同，但创建的`直线`是基于多维空间中变量数量的。上面的图表展示了这种线性回归模型拟合实际建筑能耗的效果有多好。


    ### 2. 分类


    `分类`方法是监督学习的另一类，它们可以为`类别值`生成预测或解释。例如，这种方法可以预测在线客户是否会购买特定的物品。生成的结果将报告为是或否的响应，即`买家`或`非买家`。但分类技术不仅限于两个类别。例如，分类技术可以评估图片是否包含轿车。


