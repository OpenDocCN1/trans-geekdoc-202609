    *   “Pattern classification” by assigning input pattern to one of the pre-determined
    classes. For example, classification of land-based on satellite images.

    *   “Clustering”, which is simply an unsupervised pattern classification model.
    For example, the prediction of the ecological status of water streams using defined
    input patterns.

    *   “Function approximation or regression”, which is capable of creating a function
    out of the provided set of training patterns. For example, prediction of ozone
    concentration in the atmosphere, estimation of the amount of nitrate in groundwater
    and modeling water supply.

    *   “Prediction”, which utilized prior data samples in a time series to estimate
    the output. For example, prediction of air and water quality.

    *   “Optimization”, which is used to maximize or minimize a “cost function” subject
    to predefined constraints. For example, calibration of infiltration equations.

    *   “Retrieval by content”, which is capable of recalling memory even if the input
    is incomplete or distorted. For example, using satellite images to produce water
    quality proxies.

    *   “Process control”, which seeks to keep the velocity under changing data load
    close to constant by changing the throttle angle. For example, engine speed control.


    # Genetic Algorithms


    As one can gather from the name, Genetic Algorithm (`GA`) mimics the nature''s
    theory of selection by transferring the traits of the fitter solutions to the
    "offspring" and supplanting the less fit solutions. The Genetic Algorithm will
    keep evolving until a desired solution of the problem is achieved. Similar to
    human chromosomes, every potential solution is encoded as a "binary string" of
    traits and each arrangement of the progressive population are referred to as "generations".
    The original population set is produced randomly and all superseding generations
    are created through the process of selection and reproduction. A specific subset
    of the populace is then selectively bred to produce new chromosomes. The process
    of selection is driven by the fitness of the individual solutions including closeness
    to a perfect solution and deterministic examining. The closeness to a perfect
    selection is frequently carried out by the "roulette selection" method leading
    to the arbitrary selection of a parent with calculated probability based on its
    fitness. Then the deterministic examining allots a value to a subset of a selected
    organism. Conventional propagation is achieved through genetic crossover, which
    produces the off-spring by trading chromosomes from two parents and inserting
    mutations in the chromosome to randomly modify some portion of the parent chromosome.
    The propagation doesn''t happen as often as in the human world but allows the
    introduction of new genetic material in the gene pool. Mutation is considered
    less important than crossover in the advancement of the search but is deemed vital
    in the maintenance of genetic diversity, which is fundamental to continued evolution.
    In steady-state genetic algorithms, fewer fit members are superseded by the new
    generation, bringing about an increase in the average fitness of the model. The
    cycle of "reproduction and selection" is repeated until the completion criteria
    are met, for example, optimum fitness has been reached or all organisms are identical
    and evolution is not generating new results. By focusing only on fitness examination
    and not accounting for other derivatives, genetic algorithms are considered highly
    robust computationally and capable of can smoothly balance load and efficacy.
    Another significant aspect of the genetic algorithm is its capability to indirectly
    sample a big volume of code sequences that have been tested. Unlike the stochastic
    search techniques which cannot search through noisy and multimodal relations,
    genetic algorithm can store a whole population of solutions instead of adjusting
    just a single solution. Some application examples of genetic algorithms include:
    "forecasting air quality, calibration of the water-quality models, estimation
    of soil bulk density and water management systems".


    # Decision trees


    A machine learning decision tree can be defined as "a tree-like graphical representation
    of the decision-making process, by taking into consideration all the conditions
    or factors that can influence the decision and the consequences of those decisions".
    Decision trees are considered one of the simplest "supervised machine learning
    algorithms" and has three main elements: "branch nodes" representing conditions
    of the data set, "edges" representing ongoing decision process and "leaf nodes"
    representing the end of the decision. Decision trees make for an excellent predictive
    analysis technique with wide application in generating predictions for the values
    of "categorical" as well as "continuous" target variables. (Note – the very important
    concept of Decision Trees will be explored in details in the next chapter of this
    book)


    # Probabilistic Programming


    "Probabilistic programming" is a high-level programming language that empowers
    formation of probability models, with the capability to extract values from distributions
    and condition these values into a program. The Probabilistic programming based
    learning systems are capable of making inferences from earlier knowledge, permitting
    decision making even in the face of uncertainty. To capture the knowledge of the
    target system "quantitative" and "probabilistic" terms are utilized. With adequate
    training, the model can be applied to explicit inquires to generate answers through
    a process called "inference". With the use of probabilistic programming language,
    the probability model can also be solved automatically without any external assistance.
    It also supports uninterrupted access and reusability of machine learning model
    libraries and provides support for interactive modeling as well as formal verification.
    The abstraction layer within the probabilistic algorithm is paramount to nurture
    generic and efficient inferences because various Artificial Intelligence problems
    require the agent to process fragmented and distorted data set. Probabilistic
    algorithms are widely used to analyze large volumes of data to generate predictions
    and assist perception systems in the analysis of the underlying processes. Some
    examples of Probabilistic programming applications are: "medical imaging", "financial
    predictions", "machine perception" and "weather forecasting". The most widely
    used probabilistic model is called "Bayesian network", which uses "Bayesian inference"
    to compute probability. The Bayesian network can generate inferences in two forms.
    The first one is the assessment of the joint probability of a specific assignment
    of values for every single variable in the network. While the second form is the
    assessment of the probability of a subset of variables that have been given assignments
    of an alternate subset of variables. The problems about reasoning, learning, planning,
    and perception of the system can be addressed with the application of the Bayesian
    networks. The "Bayesian inference algorithm" is utilized in the resolution of
    reasoning problems while the “expectation” and “maximization” algorithm can be
    used to address learning problems. The dynamic Bayesian networks allow for unfettered
    perception and decision networks which are widely used to solve planning issues.


    # Machine Learning in Practice


    The complete process of machine learning is much more extensive than just the
    development and application of machine learning algorithms and can be divided
    into steps below:


    1. Define the goals of the project taking into careful consideration all the prior
    knowledge and domain expertise available. Goals can easily become ambiguous since
    there are always additional things you want to achieve than practically possible
    to implement.

