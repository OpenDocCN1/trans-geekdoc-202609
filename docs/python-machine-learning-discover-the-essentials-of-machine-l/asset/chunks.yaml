- fmt: "\n# Chapter 4: Machine Learning Library “Scikit-Learn” 101\n\nMachine learning\
    \ libraries are sensitive routines and functions that are written in any given\
    \ language. Software developers require a robust set of libraries to perform complex\
    \ tasks without needing to rewrite multiple lines of code. Machine learning is\
    \ largely based on mathematical optimization, probability, and statistics. Python\
    \ is the language of choice in the field of machine learning credited to consistent\
    \ development time and flexibility. It is well suited to develop sophisticated\
    \ models and production engines that can be directly plugged into production systems.\
    \ One of its greatest assets being an extensive set of libraries that can help\
    \ researchers who are less equipped with developer knowledge to easily execute\
    \ machine learning.\n\n“Scikit-Learn” has evolved as the gold standard for machine\
    \ learning using Python, offering a wide variety of \"supervised\" and \"unsupervised\"\
    \ ML algorithms. It is touted as one of the most user-friendly and cleanest machine\
    \ learning libraries to date. For example, decision trees, clustering, linear\
    \ and logistics regressions and K-means. Scikit-learn uses a couple of basic Python\
    \ libraries: `NumPy` and `SciPy` and adds a set of algorithms for data mining\
    \ tasks including classification, regression, and clustering. It is also capable\
    \ of implementing tasks like feature selection, transforming data and ensemble\
    \ methods in only a few lines.\n\nIn 2007, David Cournapeau developed the foundational\
    \ code of \"Scikit-Learn\" as part of a \"Summer of Code\" project for \"Google\"\
    . Scikit-learn has become one of Python's most famous open-source machine learning\
    \ libraries since its launch in 2007. But it wasn't until 2010 that Scikit-Learn\
    \ was released for public use. Scikit-Learn is an open-sourced and BSD licensed,\
    \ data mining and data analysis tool used to develop supervise and unsupervised\
    \ machine learning algorithms build on Python. Scikit-learn offers various ML\
    \ algorithms such as “classification”, “regression”, “dimensionality reduction”,\
    \ and “clustering”. It also offers modules for feature extraction, data processing,\
    \ and model evaluation.\n\nDesigned as an extension to the “SciPy” library, Scikit-Learn\
    \ is based on “NumPy” and `matplotlib`, the most popular Python libraries. `NumPy`\
    \ expands Python to support efficient operations on big arrays and multidimensional\
    \ matrices. `Matplotlib` offers visualization tools and science computing modules\
    \ are provided by `SciPy`. For scholarly studies, Scikit-Learn is popular because\
    \ it has a well-documented, easy-to-use and flexible API. Developers can utilize\
    \ Scikit-Learn for their experiments with various algorithms by only altering\
    \ a few lines of the code. Scikit-Learn also provides a variety of training datasets,\
    \ enabling developers to focus on algorithms instead of data collection and cleaning.\
    \ Many of the algorithms of Scikit-Learn are quick and scalable to all but huge\
    \ datasets. Scikit-learn is known for its reliability and automated tests are\
    \ available for much of the library. Scikit-learn is extremely popular with beginners\
    \ in machine learning to start implementing simple algorithms.\n\n## Prerequisites\
    \ for application of Scikit-Learn library\n\nThe Scikit-Learn library is based\
    \ on the `SciPy` (Scientific Python), which needs to be installed before using\
    \ SciKit-Learn. This stack involves the following:\n\n### NumPy (Base n-dimensional\
    \ array package)\n`NumPy` is the basic package with Python to perform scientific\
    \ computations. It includes among other things: “a powerful N-dimensional array\
    \ object; sophisticated (broadcasting) functions; tools for integrating C/C++\
    \ and Fortran code; useful linear algebra, Fourier transform, and random number\
    \ capabilities”. `NumPy` is widely reckoned as an effective multi-dimensional\
    \ container of generic data in addition to its apparent scientific uses. It is\
    \ possible to define arbitrary data types. This enables `NumPy` to integrate with\
    \ a broad variety of databases seamlessly and quickly. The primary objective of\
    \ `NumPy` is the homogeneity of a multidimensional array. It consists of an element\
    \ table (generally numbers), all of which are of the same sort and are indicated\
    \ by tuples of non-negative integers. The dimensions of `NumPy` are called “axes”\
    \ and array class is called `ndarray`.\n\n### Matplotlib (Comprehensive 2D/3D\
    \ plotting)\n`Matplotlib` is a 2-dimensional graphic generation library from Python\
    \ that produces high-quality numbers across a range of hardcopy formats and interactive\
    \ environments. The “Python script”, the “Python”, “IPython shells”, the “Jupyter\
    \ notebook”, the web app servers, and select user interface toolkits can be used\
    \ with `matplotlib`. `Matplotlib` attempts to further simplify easy tasks and\
    \ make difficult tasks feasible. With only a few lines of code, you can produce\
    \ tracks, histograms, scatter plots, bar graphs, error graphs, etc. A MATLAB-like\
    \ interface is provided for easy plotting of the `Pyplot` Module, especially when\
    \ coupled with IPython. As a power user, you can regulate the entire line styles,\
    \ fonts properties, and axis properties, through an object-oriented interface\
    \ or a collection of features similar to the one provided to MATLAB users.\n\n\
    ### SciPy (Fundamental library for scientific computing)\n`SciPy` is a “collection\
    \ of mathematical algorithms and convenience functions built on the `NumPy` extension\
    \ of Python”, capable of adding more impact to interactive Python sessions, by\
    \ offering high-level data manipulation and visualization commands and courses\
    \ for the user. An interactive Python session with `SciPy` becomes an environment\
    \ that rivals data processing and system prototyping technologies including “MATLAB,\
    \ IDL, Octave, R-Lab, and SciLab”. Another advantage of developing “SciPy” on\
    \ Python, is the accessibility of a strong programming language in the development\
    \ of advanced programs and specific apps. Scientific apps using `SciPy` benefit\
    \ from developers around the globe developing extra modules in countless software\
    \ landscape niches. Everything produced has been made accessible to the Python\
    \ programmer, from database subroutines and classes as well as \"parallel programming\
    \ to the web\". These powerful tools are provided along with the \"SciPy” mathematical\
    \ libraries.\n\n### IPython (Enhanced interactive console)\n`IPython` (Interactive\
    \ Python) is an interface or command shell for interactive computing using a variety\
    \ of programming languages. `IPython` was initially created exclusively for Python,\
    \ which supports introspection, rich media, shell syntax, tab completion, and\
    \ history. Some of the functionalities provided by `IPython` include: interactive\
    \ shells (terminal and Qt-based); browser-based notebook interface with code,\
    \ text, math, inline plots and other media; flexible interpreters that can be\
    \ embedded to load into your projects; tools for parallel computing.\n\n### SymPy\
    \ (Symbolic mathematics)\nDeveloped by Ondřej Čertík and Aaron Meurer, `SymPy`\
    \ is \"an open-source Python library for symbolic computation\". It offers algebra\
    \ computing abilities to other apps, as a stand-alone app and well as live on\
    \ the internet with “SymPy”. “SymPy\" is easy to install and test, because it\
    \ is completely developed in Python. SymPy involves characteristics ranging from\
    \ calculus, discrete mathematics, and quantum physics. The outcome of the computations\
    \ can be formatted as “LaTeX”. In combination with a straightforward, expandable\
    \ code in a widespread language, the ease of access provided by `SymPy` makes\
    \ it a computer algebra system with comparatively low barrier.\n\n### Pandas (Data\
    \ structures and analysis)\n`Pandas` provide highly intuitive and user-friendly\
    \ data structures. `Pandas` has achieved popularity in the machine learning algorithm\
    \ community, with built-in techniques for data aggregation, grouping, and filtering\
    \ as well as results of time series analysis. The `Pandas` library has two primary\
    \ structures: one-dimensional `Series` and two-dimensional Frames.\n\n### Seaborn\
    \ (data visualization)\n`Seaborn` is derived from the Matplotlib Library and an\
    \ extremely popular visualization library. It is a high-level library that can\
    \ generate specific kind of graph including heat map, time series, and violin\
    \ plots.\n\n## Installing Scikit-Learn\n\nThe latest version of Scikit-Learn can\
    \ be found on `ikit-Learn.org` and requires `Python` (version >= 3.5); `NumPy`\
    \ (version >= 1.1.0); `SciPy` (version >= 0.17.0); `joblib` (version >=11). The\
    \ plotting capabilities of scikit-learn start with `plot_` and require `Matplotlib`\
    \ (version >= 1.5.1). Certain Scikit-Learn examples may need additional applications:\
    \ `Scikit-Image` (version >= 0.12.3), `Pandas` (version >=0.18.0). With the previous\
    \ installation of `NumPy` and `SciPy`, the best method of installing Scikit-Learn\
    \ is using:\n\n`pip install -U scikit-learn`\n\nor\n\n`conda install scikit-learn`\n\
    \nOne must make sure that “binary wheels” are utilized when using pip and that\
    \ `NumPy` and `SciPy` have not been recompiled from source, which may occur with\
    \ the use of specific OS and hardware settings (for example, Linux on a Raspberry\
    \ Pi). Developing `NumPy` and `SciPy` from source tends to be complicated (particularly\
    \ on Windows), therefore, they need to be setup carefully making sure optimized\
    \ execution of linear algebra routines is achievable.\n\n## Application of machine\
    \ learning using Scikit-Learn\n\nTo understand how Scikit-Learn library is used\
    \ in development of machine learning algorithm, let us use the `Sales_Win_Loss`\
    \ dataset from IBM’s Watson repository containing data obtained from sales campaign\
    \ of a wholesale supplier of automotive parts. We will build a machine learning\
    \ model to predict which sales campaign will be a winner and which will incur\
    \ a loss. The data set can be imported using `Pandas` and explored using `Pandas`\
    \ techniques such as `head()`, `tail()` and `dtypes()`. The plotting techniques\
    \ from `Seaborn` will be used to visualize the data.\n\n### To process the data\n\
    Scikit-Learn’s `preprocessing.LabelEncoder()` will be used and `train_test_split()`\
    \ to divide the data set into a training subset and testing subset. To generate\
    \ predictions from our data set, three different algorithms will be used namely,\
    \ “Linear Support Vector Classification” and “K-nearest neighbors”.\n\n### To\
    \ compare the performances of these algorithms\nScikit-Learn library technique\
    \ `accuracy_score` will be used. The performance score of the models can be visualized\
    \ using Scikit-Learn and `Yellowbrick` visualization.\n\n### Importing the data\
    \ set\nTo import the `Sales_Win_Loss` dataset from IBM’s Watson repository, the\
    \ first step is importing the `Pandas` module using:\n\n```python\nimport pandas\
    \ as pd\n```\n\nThen we leverage a variable `url` as `https://community.watsonanalytics.com/wp-content/uploads/2015/04/WA_Fn-UseC_-Sales-Win-Loss.csv`\
    \ to store the URL from which the data set will be downloaded. Now, `read_csv()\
