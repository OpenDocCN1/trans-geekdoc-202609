    *   “模式分类”：将输入模式分配到预定义的类别之一。例如，基于卫星图像对陆地类型进行分类。

    *   “聚类”：本质上是一种无监督的模式分类模型。例如，使用定义的输入模式预测水流的生态状态。

    *   “函数拟合或回归”：能够根据提供的训练模式集创建一个函数。例如，大气中臭氧浓度的预测、地下水中硝酸盐量的估算以及供水建模。

    *   “预测”：利用时间序列中的先验数据样本来估计输出。例如，空气和水质的预测。

    *   “优化”：用于在预定义的约束最大化或最小化“成本函数”。例如，入渗方程的校准。

    *   “内容检索”：即使输入不完整或失真，也能召回记忆。例如，使用卫星图像生成水质代理指标。

    *   “过程控制”：通过改变节门角度，试图在不断的数据负载下保持速度接近恒定。例如，发动机速度控制。


    # 遗传算法


    从名称上可以看出，遗传算法（`GA`）通过将更适应解的特征传递给“后代”并取代较不适应的解，模拟了自然选择理论。遗传算法将不断进化，直到获得问题的预期解。类似于人类染色体，每个潜在解都被编码为特征的“二进制字符串”，渐进种群的每种排列被称为“代”。原始种群集是随机产生的，所有后续代际都是通过选择和繁殖的过程创建的。然后，对种群的特定子集进行选择性育种以产生新的染色体。选择过程由个体解的适应度驱动，包括与完美解的接近程度和确定性检查。与完美选择的接近程度通常通过“轮盘赌”方法进行，该方法会根据其适应度计算出的概率随机选择父代。然后，确定性检查为被选有机体的子集分配一个值。传统的传播通过遗传交叉实现，它通过交换两个父代的染色体来产生后代，并在染色体中插入突变以随机修改父代染色体的某些部分。这种传播发生的频率不如人类世界那么高，但它允许在基因池中引入新的遗传材料。在搜索进展中，突变被认为没有交叉重要，但在维持遗传多样性方面被认为至关重要，而遗传多样性是持续进化的基础。在稳态遗传算法中，适应度较少的成员被新代取代，使模型的平均适应度增加。“繁殖与选择”的循环不断重复，直到满足完成标准，例如达到最佳适应度，或所有有机体完全相同且进化不再产生新结果。由于仅关注适应度检查而不考虑其他派生因素，遗传算法在计算上被认为具有高度健健性，并能够平滑地平衡负载和效率。遗传算法的另一个重要方面是它能够间接采样已测试的大量代码序列。与无法搜索噪声和多模态关系的随机搜索技术不同，遗传算法可以存储整个解的种群，而不仅仅是调整单个解。遗传算法的一些应用示例包括：“空气质量预测、水质模型校准、土壤容密度估算和水管理系统”。


    # 决策树


    机器学习决策树可以定义为“一种决策过程的树形图形表示，它考虑了所有可能影响决策的条件或因素，以及这些决策的后果”。决策树被认为是最简单的“监督学习机器学习算法”之一，具有三个主要元素：代表数据集条件的“分支节点”、代表正在进行的决策过程的“边”以及代表决策终点的“叶子节点”。决策树是一种极好的预测分析技术，在生成“类别”和“连续”目标变量值的预测方面有广泛应用。（注意——决策树的这一重要概念将在下一章详细探讨）


    # 概率编程


    “概率编程”是一种层级编程语言，它能够构建概率模型，并从分布中提取值并将这些值转化为程序。基于概率编程的学习系统能够从先验知识进行推理，允许在不确定的情况下做出决策。为了捕捉目标系统的知识，使用了“定量”和“概率”术语。在充分训练的情况下，模型可以通过“推理”过程对显式查询给出答案。通过使用概率语言，也可以自动求解。它还支持交互式建模和形式验证。概率算法内部的抽象层对于培养通用高效的推理至关重要，因为各种人工智能问题都需要代理处理碎片数据集。概率算法广泛用于分析大量数据以生成预测，并辅助感知系统分析底层过程。最常用的概率模型被称为“贝叶斯网络”，它利用“贝叶斯推理”计算概率。贝叶斯网络可以产生两种形式的推理：第一种是评估网络中每个变量特定赋值的联合概率；第二种是评估给定另一子变量赋值后，某个子变量的概率。关于推理、学习、规划和感知的问题可以通过应用贝叶斯网络来解决。“贝叶斯推理算法”用于解决推理问题，而“期望最大化”算法可用于处理学习问题。


    # 实践中的机器学习


    机器学习的完整过程远比仅仅算法的开发和应用要复杂，可以分为以下步骤：


    1.  定义项目目标，仔细考虑所有可用的先验知识和领域专家。目标很容易变得模糊，因为你想要实现的事情总是比实际可能实现的多。


    '
