- fmt: "\nIn this technique, an appropriate and new global constant value is selected,\
    \ such as \"unknown,\" \"N / A\" or “minus infinity”, which is then used to fill\
    \ all the missing values. This technique is employed when the concerted effort\
    \ to predict the missing value just doesn't make sense. Let's consider the student\
    \ enrollment database example again, assume that some students lack information\
    \ on the ‘state of residence’ attribute. It doesn't make sense to fill it with\
    \ some random state instead of using \"N/A”. \n\n### 3. Use attribute mean\n\n\
    This technique is used to replace an attribute's missing values with the “mean\
    \ or median value (if it's discrete)\", for a specific attribute in the database.\
    \ For instance, in a US family income database, if the average income of a family\
    \ is `X`, that value can be used to replace missing values in the other family\
    \ records. \n\n### 4. Using attribute mean for all samples belonging to the same\
    \ class\n\nThis technique is used to restrict the calculations to a particular\
    \ class in order to obtain a value that is applicable to the row that we are searching\
    \ for in lies of using the “mean (or medians)” of a particular attribute calculated\
    \ by searching all the rows of the database. For example, if you have an automobile\
    \ price database that classifies vehicles, among other things, into \"Luxury\"\
    \ and \"Low Budget”. It is likely more precise to replace the missing price of\
    \ a “luxury car” with the average price of all luxury vehicles instead of the\
    \ value obtained after factoring in “low budget cars”. \n\n### 5. Use data mining\
    \ algorithm to predict the most probable value\n\nData mining algorithms such\
    \ as “Regression”, “inference-based tools using Bayesian formalism”, “decision\
    \ trees”, “clustering algorithms (K-Mean\\Median, etc.)” can be used to determine\
    \ the probable value of the data attribute. For instance, “clustering algorithms”\
    \ could be employed to produce a cluster of rows that are then used to calculate\
    \ the mean or median of the attribute as indicated earlier in Technique 3. Another\
    \ instance might be to use a “decision tree” to generate a prediction for the\
    \ most probable value of the missing attribute by taking into account all other\
    \ attributes in the data set. \n\n## IV – Dealing with Categorical Data values\n\
    \nCategorical attributes can only take on a restricted amount of feasible values,\
    \ which are generally fixed. For instance, if a dataset is about user-related\
    \ data, then characteristics such as ‘nation’, ‘gender’, ‘age group’, etc. will\
    \ constitute the data set. Alternatively, you will find attributes such as ‘product\
    \ type’, ‘manufacturer’, ‘vendor’, and so on if your data set pertains to a commodity\
    \ or product. In the context of the data set, these are all categorical attributes.\
    \ Typically, these attributes are stored as text values representing different\
    \ characteristics of the observations. Gender is defined, for instance, as “male”\
    \ or “female”, and product type could be defined as “electronics”, “apparel”,\
    \ “food” and so on. There are three types of categorical data:\n\n*   **Nominal**\
    \ – The types of attributes where categories are only labeled and have no order\
    \ of succession are called “nominal features”. For example, gender could be ‘male’\
    \ (M) or ‘female’ (F) and have no order of precedence.\n*   **Ordinal** – The\
    \ types of attributes where categories are labeled with an order of precedence\
    \ are called “ordinal features”. For example, an economic status feature can contain\
    \ three categories: “low”, “medium” and “high”, which have an inherent order.\n\
    *   **Continuous** – The types of attributes where categories are labeled with\
    \ an order of precedence are called “ordinal features”. (Note: Original text repeated\
    \ ordinal description here for continuous).\n\n### Challenges of Categorical Data\n\
    \nCategorical attributes can only take on a restricted amount of feasible values...\
    \ (text continues)\n\n*   Categorical attributes can contain multiple levels,\
    \ called high cardinality.\n*   Various ML models, such as `regression` and `SVM`,\
    \ require categorical data to be converted to numbers first.\n*   Machine learning\
    \ libraries don't support categorical data directly; they require it to be transformed.\
    \ \n\n## Encoding Categorical Data\n\nTo cross this hurdle, the following encoding\
    \ techniques will be described below:\n\n#### 1. Replacing the categorical values\n\
    This is a fundamental technique of replacing categorical values with integers.\
    \ The `replace()` function in `Pandas` can be used for this.\n\n#### 2. Encoding\
    \ Labels\nThe technique of converting categorical values in a column to a number\
    \ is called \"label encoding\". Numerical labels always range from `0` to `n-1`.\
    \ Encoding a group of categories to a certain numerical value can be done using\
    \ the `where()` function in `NumPy`. You can perform similar label encoding using\
    \ `Scikit-Learn`'s `LabelEncoder`. Label encoding is fairly intuitive and simple,\
    \ however the algorithm is at a disadvantage and may misinterpret numerical values.\n\
    \n#### 3. One-Hot encoding\nTo resolve the misinterpretation issue of the machine\
    \ learning algorithm generated by the “label encoding” technique, each categorical\
    \ data value can be transformed into a new column and that new column can be allocated\
    \ a `1` or `0` (True/False) value. Of all the machine learning libraries offering\
    \ “one-hot encoding”, the easiest is the `get_dummies()` technique in `Pandas`.\
    \ Scikit-Learn also supports “one-hot encoding” via `LabelBinarizer` and `OneHotEncoder`.\n"
