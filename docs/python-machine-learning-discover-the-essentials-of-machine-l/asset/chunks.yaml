- fmt: "\n# BIG DATA and BIG DATA ANALYTICS\n\nIn 2001, Gartner defined Big Data as\
    \ \"Data that contains greater variety arriving in increasing volumes and with\
    \ ever-higher velocity\"; which led to the formulation of initial \"Three Vs of\
    \ Big Data\". Big data relates to an endlessly flooding avalanche of structured\
    \ and unstructured data from a multitude of infinite sources of information. These\
    \ information sets are too big to be analyzed using traditional analytical tools\
    \ and technologies, but they have a wealth of precious insights hidden in the\
    \ depth.\n\nThe origin of “Big Data” has been traced back to the 1960s and 1970s,\
    \ when the “Third Industrial Revolution” had just begun to kick in and the growth\
    \ of relational database had started along with the construction of data centers.\
    \ But with the high ease of accessibility of free search engines such as `Google`\
    \ and `Yahoo`, free internet entertainment services such as `YouTube` and social\
    \ media platforms such as `Facebook` and `Twitter`, the concept of big data has\
    \ lately taken center stage. \n\nCompanies started acknowledging the incredible\
    \ amount of user data generated through these platforms and services in 2005,\
    \ and in the same year, the open-source framework called `Hadoop` was developed\
    \ to collect and analyze these large data dumps available to these companies.\
    \ A non-relational or distributed database called `NoSQL` began to gain popularity\
    \ during the same era, because of its capacity to store and extract unstructured\
    \ data. `Hadoop` enabled businesses to operate with big data at a comparatively\
    \ low cost and with great ease.\n\nToday, with the rise of cutting-edge technology,\
    \ not only humans, but we have developed data-generating machines. Smart device\
    \ technologies such as `Internet of Things` (IoT) and `System Internet` (IoS)\
    \ have skyrocketed the volume of big data. Our everyday household objects and\
    \ smart devices are linked to the Internet and are capable of tracking and recording\
    \ our usage patterns as well as our interactions with these products and directly\
    \ feeding all this information into big data. \n\nThe emergence of machine learning\
    \ technology has further enhanced the daily amount of information produced. It\
    \ is estimated that “1.7 MB of information per second per person will be produced\
    \ by 2020”. As big data continues to expand, there are still many horizons to\
    \ be crossed to achieve maximum usability. “The importance of big data doesn’t\
    \ revolve around how much data you have, but what you do with it. You can take\
    \ data from any source and analyze it to find answers that enable 1) cost reductions,\
    \ 2) time reductions, 3) new product development and optimized offerings, and\
    \ 4) smart decision making.” - SAS\n\n## The Vs of Big Data\n\n- **Volume**: The\
    \ \"volume\" of the given data set must be substantially larger than traditional\
    \ data sets to be classified as big data. These data sets consist mainly of unstructured\
    \ data with limited structured and semi-structured data. Input sources such as\
    \ web pages, search history, mobile apps, and social media platforms can provide\
    \ data with unknown significance or unstructured data. The company's size and\
    \ client base is generally proportional to the volume of data the firm can easily\
    \ obtain.\n- **Velocity**: The speed at which data can be collected and the processed\
    \ refers to the velocity of big data. The combination of on-premise and cloud-based\
    \ servers is increasingly being used by companies to improve the pace and storage\
    \ of their data collection. Modern-day \"Smart Products and Devices\" utilize\
    \ real-time access to customer information, to provide them with more engaging\
    \ and improved user experience.\n- **Variety**: Conventionally, a data set would\
    \ comprise of mostly structured data with a small quantity of unstructured and\
    \ semi-structured data, but the emergence of big data has given rise to new unstructured\
    \ data types such as video, text, audio that require advanced tools and technologies\
    \ to clean and process for extraction of meaningful and actionable insights.\n\
    - **Veracity**: Veracity is another \"V\" to be regarded for big data analytics.\
    \ This relates to the “reliability or quality” of the data. For instance, social\
    \ media platforms such as `Facebook` and `Twitter` with blogs and posts, flooded\
    \ with hashtags and acronyms and all types of typing errors can considerably decrease\
    \ the reliability and accuracy of the data sets.\n- **Value**: Data has developed\
    \ as an inherent currency of its own. Like traditional currencies, big data's\
    \ ultimate value is directly proportional to the usefulness and quality of insights\
    \ collected from it.\n\n## Importance and Applications of Big data/Big Data Analytics\n\
    \nTo gain accurate and reliable information from a data set, it is very essential\
    \ to have a full data set and that can be accomplished with the use of big data\
    \ technology. The more data we have, the more details and insights can be obtained\
    \ from it. The future of big data is very promising for obtaining a 360 view of\
    \ a problem and its underlying solutions. Here are some examples of the application\
    \ of big data.\n\n### Product development\nBig data is progressively being used\
    \ by large and small e-commerce companies to comprehend client requirements and\
    \ expectations. Companies can create predictive models for launching new products\
    \ and services using the main features of their past and current products and\
    \ services and producing a model describing the connection between those features\
    \ and the business achievement of those products and services. For instance, `Procter\
    \ & Gamble`, a major fast-moving commercial goods company, widely utilizes large\
    \ information collected from social media websites, test markets, and focus groups\
    \ to prepare for their new product launch.\n\n### Predictive maintenance\nA large\
    \ volume of unstructured data such as error messages, log entries, and ordinary\
    \ machine temperature must be evaluated along with accessible structured data,\
    \ such as machine make, model and production year, to avoid potential mechanical\
    \ and equipment failures. By evaluating this big data set using the necessary\
    \ analytical instruments, businesses can extend their equipment's shelf life by\
    \ preparing ahead of time for scheduled maintenance and predicting potential mechanical\
    \ failures in the future.\n\n### Customer experience\nThe “smart customer” is\
    \ conscious of all the advances in technology and is only faithful to the most\
    \ engaging and enhanced user experience available. This has led to a race of the\
    \ companies to provide distinctive customer experiences analyzing the information\
    \ collected from customer interactions with the goods and services of the company.\
    \ Providing personalized recommendations and discount offers, companies can lower\
    \ the churn rate of customers and efficiently convert potential leads into buyers.\n\
    \n### Fraud and compliance\nBig data enables identification of data patterns and\
    \ supports deterrence of possibly fraudulent transactions in the future by defining\
    \ data patterns and evaluating historical trends from past transactions. Banks,\
    \ financial institutions and internet payment services such as `PayPal` are continually\
    \ tracking and collecting information on customer transactions in attempt to avoid\
    \ fraud.\n\n### Operational effectiveness\nUsing predictive analysis, companies\
    \ can anticipate future demand by evaluating manufacturing capacity, customer\
    \ feedback, and information on top-selling items to enhance decision-making.\n\
    \n### Machine learning\nFor a machine to be able to learn on its own it needs\
    \ a huge quantity of data. A solid training set with structured, semi-structured\
    \ and unstructured data will help the machine develop a multi-dimensional view\
    \ of the world.\n\n### Drive innovation\nBy studying and understanding the interactions\
    \ between individuals and devices companies can create enhanced products by meeting\
    \ expectations.\n\n## DATA MINING\n\nData mining technology is defined as the\
    \ process of exploring and analyzing large volumes of data to gather meaningful\
    \ patterns and rules. Data mining comes under the umbrella of data science and\
    \ is used to construct artificial intelligence-based machine learning models,\
    \ for instance, search engine algorithms. Although the procedure of \"digging\
    \ through data\" to predict future events has been around for a while, the term\
    \ \"data mining\" was coined as recently as the 1990s. Data mining consists of\
    \ three highly intertwined disciplines, namely `statistics` (the mathematical\
    \ study of data relationships), `machine learning` (algorithms that can be trained\
    \ to learn) and `artificial intelligence` (machines that can display human-like\
    \ intelligence).\n\n## Importance and applications of Data mining\n\nThe applications\
    \ of data mining techniques are widespread, ranging from retail pricing and promotions\
    \ to loan evaluation by financial organizations and banks. Companies across the\
    \ industrial spectrum can benefit from the applications of data mining technology.\n\
    \n### Healthcare bio-informatics\nStatistical models are used by healthcare practitioners\
    \ to estimate the probability of patients suffering from one or more health considering\
    \ considering risk factors. Genetically transmitted illnesses can be avoided or\
    \ mediated by modeling the genetic, family and demographic data of the patient\
    \ from the onset of declining health. There is a shortage of healthcare experts\
    \ in developing countries, so assisted diagnoses and patient prioritization are\
    \ very critical. Models based on data mining have lately been implemented in these\
    \ nations to assist with prioritization of patients before healthcare practitioners\
    \ can achieve and administer therapy.\n\n### Credit Risk Management\nFinancial\
    \ organizations and banks implement data mining based tools and models that predict\
    \ the probability of prospective credit card customer failing to make credit payments\
    \ on time and determining the suitable loan limit that the customer may be eligible\
    \ for. These data mining models collect and extract information from a multitude\
    \ of input sources including personal information, customer's financial history,\
    \ and demographics, among others. The model then offers the interest rate to be\
    \ obtained from the customer by the organization or bank depending on the assessed\
    \ risk of lending. For instance the applicant's credit score is taken into account\
    \ by data mining models and elevated interest rates are provided to people with\
    \ low credit score.\n\n### Spam filtering\nA lot of email clients like `Google\
    \ mail` and `Yahoo mail` depend on data mining tools to detect and flag email\
    \ spam and malware. The data mining tools generate insights and understanding\
    \ that can be used to develop improved safety measures and tools by analyzing\
    \ hundreds and thousands of shared features of spam and malware. Not only are\
    \ these applications able to detect spam, but they are also very effective in\
    \ categorizing spam messages and storing them in a distinct directory so they\
    \ never enter the user's inbox.\n\n### Marketing\nRetail businesses need to know\
    \ their customer demands and expectations. Businesses can evaluate customer-related\
    \ information such as order history, demographics, gender and age by using data\
    \ mining tools to collect useful customer insights and segment them into organizations\
    \ based on shared shopping characteristics. Then companies develop distinctive\
    \ advertising policies and campaigns to target particular groups such as discount\
    \ offers and product promotions.\n\n### Sentiment analysis\nCompanies can analyze\
    \ their data from all their social media platforms using a method called `text\
    \ mining` to know their customer base's \"sentiment\". This process of understanding\
    \ emotions of a large group of people towards a specific subject is called `sentiment\
    \ analysis` and can be performed using data mining tools. Using pattern recognition\
    \ technology, input data from social media platforms and other associated public\
    \ content websites are gathered using `text mining` technology and data trends\
    \ identify that feed into the general knowledge of the subject matter. The `natural\
    \ language processing` method can be used to further dive into this data to comprehend\
    \ the human language in a particular context.\n\n### Qualitative data mining\n\
    The `text mining` method can also be used to conduct qualitative research and\
    \ obtain insights from large quantities of unstructured data. A recent research\
    \ study by `University of California, Berkeley` disclosed the use of data mining\
    \ models in child welfare program studies.\n\n### Product recommendation systems\n\
    Advance `recommendation systems` are like online retailers' bread and butter.\
    \ To achieve a competitive edge in the industry, the use of predictive customer\
    \ behavior analysis is increasing. Some of the biggest e-companies, including\
    \ `Amazon`, `Macy's` and `Nordstrom`, have invested millions of bucks in developing\
    \ their proprietary data mining models to forecast market trends and offer.\n\n\
    According to SAS, \"unstructured data alone makes up 90% of the digital universe\"\
    . This big data avalanche does not necessarily ensure more knowledge and understanding.\
    \ Using data mining technology enables all redundant and unnecessary data to be\
    \ filtered out so to garner the understanding of applicable information used in\
    \ the immediate decision-making process. Using a broad range of techniques, you\
    \ can use this information to increase revenues, cut costs, improve customer relationships\
    \ and reduce risks.\n"
