    # Chapter 1: The Cryptocurrency Revolution


    Understanding The Basics Of Cryptocurrency


    Electronic virtual currencies originated way before the inception of the first-ever
    scalable crypto - Bitcoin. However, these currencies weren’t termed cryptos because
    they do not have the cryptography tech embedded in them. But these are the very
    first attempts that eventually led to the invention of the currently used cryptocurrencies.   


    The revolution of digital currencies started in the Netherlands in the 1980s. 
    A group of developers invented an electronic card system to avoid the thefts in
    Gas Stations that happen at night. Whoever wants to access Gas can use those cards,
    so the use of real money is eliminated.


    The second attempt towards virtual currencies is made by ‘David Chaum.’ He is
    an American cryptographer and the inventor of Blinded Cash. The USP of this currency
    is that it is untraceable. That is, transactions made using this virtual currency
    cannot be tracked. Chaum used complex encryption techniques to achieve this feat.
    However, this crypto has failed because of various scalability issues.    


    We must know that eCash, B-Money, Bit Gold, and Hashcash are notable failed attempts
    in this space. eCash was the first conceptualized digital token currency to transfer
    between individuals. B Money was portrayed as an electronic cash system that is
    anonymous and secured at the same time. Bit Gold is considered the first digital
    asset with complete decentralized functionality. Bit Gold was pegged to the value
    of gold while moving away from centralization.


    HashCash was one of the most successful digital currencies, getting everything
    in place except for scalability. It functions almost like Bitcoin and has a similar
    consensus algorithm too. This digital currency was truly ahead of its time, which
    could be one reason for its failure. Finally, in 2008, the whitepaper of Bitcoin
    was released, while in early 2009, the first ever Bitcoin block was mined, and
    the rest is history.


    Cryptocurrency is a kind of digital money that exists only online. There is only
    an actual coin or bill if you utilize a service that enables you to exchange cryptocurrencies
    for physical tokens. Typically, you trade cryptocurrencies with another person
    online, through your phone or computer, without a third party''s assistance, like
    a bank. Cryptocurrencies are unrelated to valuable things – they are irrelevant
    to anything of actual worth in the real world, which causes their value to fluctuate
    wildly, as you have probably seen.


    In contrast to equities, bonds, artwork, real estate, or precious metals, cryptocurrencies
    have no intrinsic value or use. For instance, gold is a critical component of
    electronics and jewelry — and therefore has worth in addition to its scarcity.
    On the other hand, cryptocurrency costs money solely because someone else owns
    it and needs money to deliver it to you.


    Cryptocurrencies address the following critical issues associated with the use
    of cash. There is a need for a centralized authority to control these objects''
    value, manufacturing, and authenticity. Possibility of fraudulent duplicating.
    To understand this better, one should get a good understanding of some of these
    basics.


    Cryptography


    Cryptocurrency uses cryptography — the art of concealing and disclosing information
    — to guarantee the security of user data and the integrity of transactions. As
    the name implies, a cryptocurrency is digital or virtual money protected by encryption,
    making it hard to counterfeit or double-spend.


    Blockchain


    A blockchain is a subset of Distributed Ledger Technology (DLT), a distributed
    database distributed among many operators (nodes, computing devices, etc.) Numerous
    cryptocurrencies are decentralized networks powered by blockchain technology—a
    distributed ledger maintained by a distributed network of computers.


    This is the underlying technology that drives cryptocurrency. It is a digital
    ledger that validates transactions, accounts, and balances. Blockchain may be
    used for various applications outside financial transactions, including supply
    chain management, monitoring art ownership, and even digital collectibles.


    A node is a word associated with blockchain technology that will be used throughout
    this essay. A node is a discrete component of a larger data structure known as
    a blockchain. Without nodes, the system would implode. Cryptography and blockchain
    technology assist cryptocurrencies in the creation of new coins, the enforcement
    of legal transactions, and the establishment of a secure system.


    Decentralized


    A distinguishing characteristic of cryptocurrencies is that they are not issued
    by any central authority, which supposedly protects them against government intervention
    or manipulation. As shown by Bitcoin, decentralization implies that all authoritative
    source is spread evenly across all peers on a network, and there is no single
    point of failure. For example, to "hack" Bitcoin, someone must access at least
    51% of the vast network of computers that operate Bitcoin, which is considered
    impossible.


    Peer-to-Peer


    Without a broker, cryptocurrency may be transferred directly between two individuals.
    These transactions are made with minimal processing costs that benefit the network,
    allowing customers to avoid the high transaction fees associated with more conventional
    money transfer services.


    There are many cryptocurrencies in existence. You''ve almost certainly heard of
    some of the most prominent cryptocurrencies, like Bitcoin, Litecoin, and Ethereum.
    Cryptocurrencies are becoming an increasingly popular alternative to traditional
    online payment methods. Before you convert actual dollars, euros, pounds, or other
    conventional currencies to cryptocurrencies, it''s essential to understand what
    they are, the dangers associated with their use, and how to safeguard your investment.


    A cryptocurrency is a digital money that was developed using encryption techniques.
    It is a type of alternative payment. Due to the usage of encryption technology,
    cryptocurrencies serve as both a medium of exchange and a virtual accounting system.
    A cryptocurrency wallet is required to utilize cryptocurrencies. These wallets
    may be cloud-based services or software installed on your PC or mobile device.
    Wallets are the devices that hold the encryption keys that verify your identity
    and connect you to your Bitcoin.'
