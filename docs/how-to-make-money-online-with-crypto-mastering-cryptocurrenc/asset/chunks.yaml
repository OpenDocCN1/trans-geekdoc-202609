    by tracking online behavior, transactional activities, and other such practical
    attributes, these attributes can be manipulated, thus tricking the authentication
    system. 


    Secondly, insurance is given requisite attention in the case of centralized finance
    due to its necessity in ensuring the customers'' trust and protecting them from
    events of hacking or fraud which might lead the customers to incur substantial
    financial losses. However, the aspect of insurance in the case of DeFi is rarely
