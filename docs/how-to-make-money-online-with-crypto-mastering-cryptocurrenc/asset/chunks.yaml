- raw: 'Also, these smart contracts are immutable. They are tamper-proof, and no one
    can change the terms once the contract is activated. If any parties attempt to
    alter the contract terms, the agreement will get rejected while intimating all
    the parties involved. More importantly, these contracts are cost-effective as
    we can eliminate fees to typical intermediaries such as authorizers, document
    creators, etc.


    Blockchain technology has become very popular over the last decade, primarily
    thanks to significant cryptocurrency investments. Blockchain is the technology
    on the basis on which cryptocurrency is based. Many people hear about it and need
    clarification or think it is a complex technology well beyond their understanding;
    however, that is untrue.


    In simple terms, a blockchain is a database or ledger used to store information.
    It is also called distributed ledger technology (DLT). A database is data stored
    on a computer or electronic device that is organized to allow it to be used and
    viewed easily. Data up until recently was held in the form of databases, but that
    has changed with the advent of blockchain technology.


    In a blockchain, data or information is stored in groups known as blocks. Whenever
    an alliance with a finite storage capacity becomes full, it gets chained to the
    previous block. Then, a new partnership is created, creating a long chain of blocks
    of information stored in that chronological order, known as a blockchain. Each
    new block is added after its storage fills up, and the chain continues to grow
    longer and longer. 


    Blockchains are different from the other traditional forms of databases in that,
    while other databases store their data as a whole, the data in a blockchain is
    kept together in smaller units. Another key difference is that blockchains store
    their information with timestamps, which means we always know when that data was
    entered into the system. It ensures that the time entry related to data is valid.
    In effect, a blockchain also acts as a timeline of data. 


    Another critical component that makes blockchain different is that it is decentralized,
    which is apparent from its “decentralized ledger technology.” While other databases
    need servers stored in a single place owned and operated by a single party, In
    contrast, blockchain holds its data over multiple servers known as nodes. This
    way, any single party does not control the data, and every time a new data entry
    is made, it is duplicated over all nodes using predetermined algorithms. blockchain


    Due to its features that make it an authentic, transparent, and non-editable database,
    blockchain is slowly being adopted by many companies and governmental organizations.


    Blockchain is one of the biggest game-changers the technology sector has seen
    in the past few years. According to the World Economic Forum''s Future of Jobs
    report, blockchain will be one of the largest employment generators over the next
    five years till 2025. Blockchain is predicted to bring a significant change in
    the way many industries work, such as the Finance Industry, Banking Industry,
    Retail industry, Supply Chain industry, and even Governmental Administration. 


    History of Blockchain


    The idea of having a decentralized ledger with data stored in blocks has existed
    for a few decades. However, a developer (or developers) created the first real
    blockchain with the pseudonym of Satoshi Nakamoto in 2008. The following year,
    in 2009, Satoshi, for the first time, used Blockchain practically to maintain
    a public ledger for keeping track of the transactions of Bitcoin. It was then
    that Bitcoin was invented.


    The first use of Bitcoin for a purchase happened in 2010 when a Florida-based
    man paid 10,000 Bitcoins for two pizzas from Papa John’s.


    The use of blockchain exclusively as a ledger for storing cryptocurrency transaction
    details continued until 2014. This is called the first stage of blockchain. After
    2014, the second stage of blockchain technology started. During this stage, the
    uses of blockchain moved past being just for cryptocurrencies. In 2014, Ethereum
    started creating computer codes that acted as financial instruments called smart
    contracts. The same year, R3, a group of blockchain companies, was formed to explore
    the different areas where blockchain can be used.


    In 2015, NASDAQ and Chain, a blockchain company, came together to test blockchain
    to trade shares of a private company. After 2016, companies like Facebook and
    IBM started working with blockchain technology.


    Types of Blockchains


    Public Blockchains: These are the most common type of blockchains. As the name
    suggests, Public blockchains are open to everyone, and anyone can access the data
    on these kinds of blockchains. Public blockchains are the most transparent form
    of blockchains. Public blockchains are used to track the transactions of the cryptocurrencies
    such as Bitcoin and Litecoin. These blockchains are slightly slower than private
    blockchains since there are more nodes in a public blockchain, and the transaction
    must be recorded in every node.


    Private Blockchains: Private blockchains are the other primary type used blockchains.
    In a private blockchain, the number of users is restricted. Only the people authorized
    to have access to the blockchain can see the data on the blockchain and record
    transactions on the same. Organizations and firms can have private blockchains
    to store data, with only people from within the organization having access. Private
    blockchains are much faster than their public counterparts; however, since the
    entire point of blockchain technology is to have multiple nodes through which
    verification is confirmed, private blockchains are not considered as secure as
    public ones.


    Hybrid Blockchains: Hybrid blockchains are a mix between a public blockchain and
    a private blockchain, so they try to have the advantages of both public and private
    blockchains. In a hybrid Blockchain, some of the data is open to the public, and
    the rest of the data that may be more delicate can be kept only to be accessed
    by a select few. This makes the blockchain faster and more secure at the same
    time. 


    Federated Blockchains: Federated blockchains are also called Consortium blockchains.
    They are similar to private blockchains, but instead of one organization, in a
    federated blockchain, access is given to multiple organizations that are part
    of a larger body, such as the government. 


    Critical Components of a Blockchain


    To understand how a blockchain works, one must first know what a blockchain is
    made of. The components of a blockchain are:


    Blocks: The blocks are the most basic units of storing information on a blockchain.
    After each block is full of data, it is connected to the previous block, thereby
    creating a chain of data that we call a blockchain. Blocks themselves consist
    of multiple parts. These parts are:


    Data: This data has been stored on the block for safekeeping.


    Nonce: A 32-bit whole number is generated for every block when creating a new
    partnership. This nonce then creates the hash.


    Hash: The hash is a 256-bit number unique to every block. This hash encrypts the
    data on a block and connects one block to another in a given blockchain.


    Block header: The block header provides us with the metadata related to the block,
    such as the hash of the previous block, the time stamp, and the nonce. 


    Transactions: The block contains all of the transactions that have been stored
    on the block.


    Nodes: Nodes refer to the people or servers with whom the blockchain has been
    shared. A blockchain has no central authority, and data is stored on distributed
    ledgers. Each of these ledgers has its node. The more the number of nodes in a
    blockchain, the more secure it is. Since the same data is secured on every node,
    the hacker will have to access each node and then change their data to hack into
    it or make a change. '
