- raw: 'However, it is not just famous artists like Beeple profiting from NFTs. Even
    smaller artists can convert their art into NFTs and thus monetize their work.
    Further, using smart contracts, it is also possible for the artist to attach a
    clause to the NFT that gives them a cut of the price every time an NFT is sold
    to protect their economic interest if their work gets popular and increases in
    price in the future. NFTs would also remove the need for mediators and other intermediaries
    between the artists and the art collectors. NFTs could finally bring the digital
    art world on par with the physical art world.


    Identification: Non-fungible tokens are also being used for providing proof of
    identity. NFTs can be programmed to contain unique information within them, and
    at the same time, we know that NFTs can only have a single owner at a time, and
    the data within an NFT cannot be mutated; thus, NFTs can be configured in such
    a way to issue identities, licenses, qualifications, etc. For example, suppose
    a person is to be given an identity card for club membership. In that case, the
    digital version of the card can be configured with an NFT to ensure that it is
    the original card shown upon entry. In case of identity theft, even if the culprit
    can copy the identification cards, they will not be able to copy the NFT that
    is attached to these cards. 


    Collectibles: Another of the most common and popular uses of NFTs is currently
    in the collectibles sector. We know that NFTs are non-fungible and unique tokens,
    meaning that every NFT differs. Collectibles had been absent in digital form as
    they could easily be copied and duplicated, but this problem has been solved with
    NFTs. It is now possible to create an item in a finite amount. Thus even if a
    product is copied, its authenticity cannot be proven. This creates a form of exclusivity
    in the ownership of the said items. Some of the collectibles that are being produced
    with NFTs are:


    Trading Cards: For years, trading cards have been one of the most sorts after
    collectibles in the real world. Trading cards can be of many types, such as for
    sports like baseball or basketball trading cards or in the form of games such
    as Pokémon or yu-gi-ho. The rarer cards have sometimes been sold for millions
    of dollars. Now we are seeing the start of digital trading card games like Gods
    Unchained.


    Avatars: Crypto punks were one of the first NFTs and have become some of the most
    popular ones. The purchase of the limited edition alien crypto punks has regularly
    exceeded the value of a million dollars. These punks have no intrinsic value but
    are just being as collectible because of their rarity. One can use them as avatars
    or display pictures on various platforms. 


    Original Copies: Just like the original documents of various products in the real
    world, such as comic books, novels, and album covers, are kept by collectors and
    worth thousands of dollars, the digital version of the audiobooks, comics, etc.,
    are also collected by collectors. Not just books, but recently even the original
    copy of the first tweet by the founder and CEO of Twitter was sold for 2.9 million
    dollars to the highest bidder by using NFTs.


    Sports: Sports have also started venturing into the world of NFTs. NBA sold the
    first sport-based NFT. Using NBA top shots, collectors can purchase the original
    highlight of an image or a sequence of play by their favorite players during an
    NBA game. Formula 1 and boxing are both launching their own NFT collections. 


    Domain Names: It is also possible to purchase and collect domain names. The ownership
    of the domain name is stored in the NFT. One of the common ways of buying and
    storing names is through the Ethereum names service. 


    Finance: NFTs, though popularly used for their superficial purposes, can be helpful
    too. This provides the NFT holders with value for holding the NFT in itself. For
    example, if an NFT allows the holder to enter an exclusive pool of investors,
    the said NFT can be traded or sold for that right. Their holders can also stake
    NFTs to earn passive income. Some NFTs also double as discount coupons or combos,
    such as in the case of BAKE coupons. These financial NFTs can also have artwork
    attached to them, but their value comes from their use, not their art. 


    Music and v\]Video: Just as it is possible to attach an NFT to an image file or
    a GIF, it is also possible to link NFTs to audio and video files. By connecting
    the NFT to an audio file or album, musicians and video makers can start selling
    the original versions of their products. Just because a person holds the NFT to
    a song or video does not mean they have the copyright to it. It continues to be
    with the artist. Currently, the recording studios and other intermediaries earn
    from songs and music videos; using NFTs would diminish the need for these third
    parties, thereby increasing the income for the musicians. Kings of Leon was the
    first central rock band to release a digital version of their album; each album
    copy was uniquely numbered with NFTs. 


    Real-World Asset: Real-world assets, such as shares, deeds, contracts, etc., could
    also use NFTs. Forgery and fraud are commonplace in the physical form. However,
    blockchain technology could prove its authenticity if these assets were given
    proper NFTs. In 2021, an NFT was created, which included the ownership of a property
