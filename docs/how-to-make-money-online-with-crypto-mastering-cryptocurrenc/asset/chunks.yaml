    by DeFi requires refinement in terms of the necessary tools to reduce the associated
    risks, nonetheless, it is expected to reign in the financial world due to its
    interoperability and innovativeness, amongst other factors.


    # Chapter 6: Non-Fungible Tokens


    What are NFTs?


    Non-Fungible Tokens or NFTs, as the name suggests, are tokens, much like other
    crypto tokens such as Bitcoin or ether; however, the critical difference is that
    they are non-fungible, meaning they cannot be copied or replicated. Each of the
    tokens is unique by itself. E.g., when you buy a cryptocurrency, such as a Bitcoin,
    and then you exchange it for another Bitcoin, in the end, you have the same thing;
    there is no way to differentiate between the Bitcoin that you were holding earlier
    and the Bitcoin that you are holding now, this means that they are fungible.


    Non-Fungible tokens are unique because if you exchange one NFT of similar value
    with another NFT, then what you have in your hand is something different. The
    fungibility of currencies and cryptocurrencies usually helps us use them as a
    medium of exchange since everyone has an agreed value common to all the units
    of the said currency. NFTs, on the other hand, can be compared to collectibles
    such as unique sports cards or art pieces.


    NFTs use blockchain technology to register the transaction, typically, it is the
    Ethereum blockchain, but other blockchains are also used, which keeps track of
    the ownership of the NFT. NFTs are created on these blockchains using the ERC-721
    and ERC-1155 frameworks. More often than not, NFTs are artwork such as images,
    GIFs, videos, and music. What happens is that the person purchasing that original
    piece of art has proof of their ownership, the transaction, stored on the blockchain.
    Since we know that blockchain has immutable and permanent data, the transaction
    cannot be altered and is thus a set proof of the fact that the person owns that
    particular asset.


    The value of most things is directly proportional to the scarcity of the said
    thing. When we say that gold and diamonds are expensive, they are only available
    in a limited amount, and we cannot create any more natural gold or diamonds. Similarly,
    art pieces such as those by Picasso, Monet, Banksy, or Basquiat carry astronomical
    values during auctions and other sales because they are only a limited number
    of such pieces. Further, each piece is unique from the other. Before the advent
    of blockchain technology and NFTs, there was no such scarcity of digital art forms,
    one could search for a song or a photograph and they would get thousands of copies
    of the same. With NFTs, however, there is a newfound scarcity in the ownership
    of digital assets, which increases the value of these digital assets. 


    NFTs work as financial assets; they can be compared to physical art, except they
    are digital art forms. Just like physical art has no intrinsic value, and most
    people purchase it either for the bragging rights of having the ownership of the
    said piece of art or for using it as an investment which will give them returns
    when they sell it off at a higher value in the future, NFTs are similarly either
    owned to be flipped for profit in the future or for the fact that one holds the
    original version of a digital asset.


    What one needs to understand, however, is the fact that just because they have
    ownership of an NFT doesn’t mean that the same digital art can’t be reproduced
    by anyone else. Think of it as a painting, such as The Starry Night by Vincent
    Van Gogh; At the same time, various painters made multiple copies of The Starry
    Night, and it is even available as posters or drawing aids; the ownership of the
    original Starry Night lies in the hands of a single person, or this case, the
    Rijks museum. Similarly, the same gif or image will be available online on various
    web pages or search engines. Still, the original art lies in the hands of the
    owner of the non-fungible token.'
