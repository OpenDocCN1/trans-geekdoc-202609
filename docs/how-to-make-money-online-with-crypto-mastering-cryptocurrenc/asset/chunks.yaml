    Technical Analysis of Bitcoin


    Technical analysis is an entirely different ballgame from fundamental analysis.
    In technical analysis, we take a statistical approach to study an asset by analyzing
    key metrics and studying charts using mathematical tools and functions. Here we
    will briefly discuss some essential methods and concepts that fall under technical
    analysis.


    Support and Resistance


    A support level is a price level where the desire to buy is so strong that it
    can withstand the pressure of sellers. As a result, the fall is suspended, and
    prices start increasing again. Usually, a support level can be determined in advance,
    according to the trends established by the previous decline. Likewise, a resistance
    level is opposite to a support level and represents a level above the market,
    where sellers'' pressure exceeds buyers'' influence. The prices tend to increase
    if the asset takes support at a support level, but it is likely to decline further
    if it breaks the support level and moves downwards. Similarly, if an asset breaks
    a resistance level, it is expected to keep moving up but is likely to move down
    if it does not cross the level.


    Candlestick Charts


    Unlike the traditional linear chart that shows the current and historical price
    data, Japanese candlesticks and bars use as many as four data points for a given
    time instead of one: 


    1\. The opening price when the time began 


    2\. The highest point the price reached during the time 


    3\. The lowest point the price reached in the period 


    4\. The closing price when the period ended '
