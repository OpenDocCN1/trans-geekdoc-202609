    mining network ensures `BAT` transactions are irreversible once approved.


    The developers of `BAT` seek to improve how advertising is done in the digital
    space. They see the current system as disadvantageous for users, publishers, and
    advertisers. Users are relentlessly targeted with ads and trackers, and they are
    subjected to malware that is becoming increasingly aggressive and powerful.


    Conventional publishers have seen their ad revenues decline dramatically as monopoly
    platforms like `Google` and `Facebook` drive down the price of information while
    taking a hefty cut from the advertising revenue. In addition, bots and malware
    can inflict increasing damage each year, and platforms have suffered credibility
    issues. Moreover, advertisers need more accurate targeting methods and information
    to deliver their content sufficiently because platforms monopolize these functions.


    The creators of `BAT` believe that tracking how users interact with digital advertising
    content and storing that information in a distributed blockchain ledger will enhance
    and improve the digital advertising experience for advertisers, publishers, and
    users. Users will experience fewer ads and content that is better tailored to
    them, while Publishers will find new sources of revenue. And advertisers will
    be able to target particular users better based on documented user content preferences
    and interests. They will also be able to avoid fraud more efficiently.


    `Basic Attention Token` has a maximum total supply capped at 1.5 billion tokens.
    Almost all of this supply is currently in circulation. Hence, the `Basic Attention
    Token` can be considered almost entirely liquidated.


    In its 2017 `ICO`, 1 billion `BAT` tokens were sold to investors, the remaining
    200 million coins were locked in a development pool, and 300 million `BAT` was
    reserved for the user growth pool (`UGP`). As of November 2020, the development
    pool and `UGP` pool addresses are almost empty. `Basic Attention Token` can be
    bought and sold on every central cryptocurrency exchange platform and has excellent
    liquidity.

    '
  trans: '

    # 加密货币概览


    ## Binance


    币安的市值超过 560 亿美元，按市值计算位居顶级加密货币之列。币安的故事始于一次 `ICO`，现已发展成为按交易量和网络流量市场份额计算的全球最大加密货币交易所之一。


    ## Cardano ($12 billion)


    查尔斯·霍斯金森于 2017 年创立了 Cardano（艾达币），此前两年他协助开发了 `Ethereum`（以太坊）区块链技术。他还联合创立了 Internet
    Online Hong Kong（`IOHK`），即构建 Cardano 区块链的公司。


    Cardano 采用一种称为 `Proof of Stake`（`PoS`，权益证明）的时间戳方法。`PoS` 是 Cardano 生态系统中的矿工验证并可能阻止交易的系统。质押简单来说就是持有的币数（`ADA`
    币），这也决定了一个人参与创建新区块的资格。


    利用开发 `Ethereum` 项目获得的知识，霍斯金森将智能合约的理念注入了 Cardano 项目。Cardano 在加密货币领域独树一帜，因为它是通过同行评审研究构想出来的。研究产生了独特的功能，如无与伦比的平台安全性、系统可持续性和强大的专业开发社区。


    根据项目网站，`IOHK` 创建 Cardano 区块链旨在通过提供包容性和开源技术的新标准来“恢复全球系统的信任”。因此，“变革者、创新者和远见者”可以利用这项技术创建一个“更安全、透明和公平”的社会。


    `ADA` 是促进 Cardano 网络参与者之间交易的数字货币。`ADA` 按市值计算位居前十大代币之列。它在一个去中心化、安全且无中介的环境中实现点对点交易。因此，Cardano
    区块链上的交易快速且廉价。


    Cardano 的加密货币声称相对于法币拥有合法优势。Cardano 基金会设定 `ADA` 总供应量上限为 450 亿枚。其理念是避免通胀并控制币值。就点对点交易的交易速度而言，`ADA`
    远优于法币。法币需要银行等中介机构来建立信任，导致交易链条上出现瓶颈。


    ## XRP ($30 billion)


    Ripple（瑞波币）是一种等同于数字现金的加密货币代币，专为支付网络和银行设计。`XRP` 或 Ripple 是其区块链 `RippleNet` 上的原生代币。`RippleNet`
    是由 Ripple Labs 运行、建立在 `XRP Ledger`（去中心化开源区块链技术）之上的支付系统。它拥有极快的交易速度，平均交易结算时间仅为四秒。相比之下，`Bitcoin`（比特币）网络的交易结算时间为
    3,600 秒。


    Ripple 产生即时影响的领域之一是跨境支付。开发者创建 `RippleNet` 以简化交易。消费者和企业在使用法币交易时，往往遭受货币兑换的不便和汇率差异带来的损失。`RippleNet`
    使用 `XRP` 代币作为中介，简化法币兑换，避免滑点损失。


    此外，数字货币促进了传统支付领域未见过的极速交易结算。由于采用点对点交易系统，用户享受微额手续费，平均费用低于 $0.0003403。`RippleNet`
    在传统支付领域的竞争对手，如 `VISA`，对同等交易收取的费用高出数千倍。


    Ripple 的优势源于区块链技术。大多数区块链平台通过 `Proof of Work`（`PoW`，工作量证明）或 `Proof of Stake`（`PoS`，权益证明）机制达成共识。`PoW`
    系统较慢且耗电量大，而 `PoS` 系统支持在消耗较少电力的情况下更快地验证和批准交易。


    然而，像 `XRP Ledger` 这样的区块链平台采用另一种共识形式，即 `Ripple Protocol Consensus Algorithm`（`RPCA`，瑞波协议共识算法）。共识是区块链网络中的节点相互保持一致性和正确性的方式。`RPCA`
    通过组成全球 `XRP` 社区的 150 多个节点运行。


    强大的共识系统是 Ripple 七年稳定运行的重要原因，使其开发者能够扩展生态系统的产品范围。例如，开发者已扩展 `RippleNet` 的能力，为企业客户提供按需流动性。这使得全球支付更快、更便宜。


    ## 有前景的山寨币


    一些山寨币具有主导未来市场的巨大潜力。我们现在将关注那些市值逐年逐渐增加的山寨币。


    ### Basic Attention Token (BAT)


    `Basic Attention Token`（`BAT`，基本关注代币）是建立在 `Ethereum` 区块链上的实用代币，后者是 `Brave` 网络浏览器平台的基础。`Brave`
    浏览器允许用户匿名且完全无广告地浏览互联网，随后允许用户选择加入观看广告以换取 `BAT` 代币。


    当用户在发布商网站上观看或点击广告时，发布商也能获得 `BAT`。广告主受益于更低的广告开销和更高的用户参与度。用户在不牺牲定制广告优势的前提下获得更高的隐私保护，并可获取
    `BAT` 代币。`BAT` 代币设计用于在用户、广告主和发布商之间交换。它基于用户关注度的概念，这对数字时代运营的广告公司至关重要。`BAT` 是一种 `ERC-20`
    代币，由经过严格测试的 `proof-of-work` 共识算法保护，并由庞大的 `Ethereum` 矿工网络支持。该算法确保仅确认有效交易，而 `Ethereum`
    挖矿网络的共同工作确保 `BAT` 交易一经批准即不可逆转。


    `BAT` 的开发者旨在改善数字空间中的广告投放方式。他们视当前系统对用户、发布商和广告主均不利。用户无休止地被广告和追踪器锁定，并遭受日益激进和强大的恶意软件侵害。


    随着 `Google` 和 `Facebook` 等垄断平台压低信息价格并从广告收入中抽取大额分成，传统发布商的广告收入大幅下降。此外，机器人和恶意软件每年造成的损害日益增加，平台也面临信誉问题。而且，由于平台垄断了这些功能，广告主需要更精准的定向方法和信息来充分投放内容。


    `BAT` 的创建者认为，追踪用户如何与数字广告内容互动，并将该信息存储在分布式区块链账本中，将提升并改善广告主、发布商和用户的数字广告体验。用户将看到更少但更贴合其需求的广告和内容，发布商将发现新的收入来源。广告主将能根据记录在案的用户内容偏好和兴趣更精准地定向特定用户，也能更高效地避免欺诈。


    `Basic Attention Token` 最大总供应量上限为 15 亿枚。目前几乎所有供应量均已流通。因此，`Basic Attention Token`
    可被视为几乎完全流通。


    在 2017 年的 `ICO` 中，10 亿 `BAT` 代币售予投资者，剩余 2 亿枚锁定在开发池中，3 亿 `BAT` 保留给用户增长池（`UGP`）。截至
    2020 年 11 月，开发池和 `UGP` 池地址几乎为空。`Basic Attention Token` 可在所有主流加密货币交易平台买卖，流动性极佳。

    '
