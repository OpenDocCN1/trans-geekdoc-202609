    Open Bazaar is an e-commerce platform based on blockchain technology. Unlike any
    other e-commerce platform, it acts as a peer-to-peer platform where one can sell
    anything they wish to sell and pay no fees as there is no central authority. The
    payments are made through cryptocurrencies, and transactions are recorded on blockchains.
    These purchases could be for anything ranging from art to everyday products.


    # Consensys


    Consensys is a blockchain software engineering company that provides end-to-end
    solutions to companies regarding blockchain technology. It has recently teamed
    up with Microsoft and Moët Hennesy Louis Vuitton to create blockchain software
