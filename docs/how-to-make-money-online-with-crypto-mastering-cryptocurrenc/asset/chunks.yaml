- raw: 'DeFi users have absolute custodianship of their funds and can choose when
    to make the transaction, with whom to make the transactions, and by how much.
    However, traditional financial systems do not offer such control over the funds
    and assets. The individual must cede their funds to the central authority in these
    systems. For example, banks substantiate this premise. Instead of being in control
    of the owners of the funds, the funds are actually under the power of the top
    central bank, and then the second bank follows. 


    Innovativeness and Interoperability


    The innovativeness also characterizes deFi that it offers in adapting to the evolving
    standards of expectations of the users. The streak of innovation of these systems
    is also substantiated by the use cases, as outlined in the next section. With
    innovation at its core, these systems are getting into many industries. However,
    due to the centralized approach, the traditional finance ecosystem only offers
    rapid innovation and adaptation. Due to the centralization of the authority, any
    proposal for creation goes through a multitude of executives at different levels
    in the hierarchical structure of these authorities. Such a thorough hierarchical
    structure ensures that the central authority makes well-deliberated decisions.
    While such a rigorous approach for multiple checks makes the proposal relatively
    risk-proof, it often leads to delay or rejection of the proposal altogether. Due
    to evolving trends, such a time gap might make the proposals redundant.     


    Accessibility and Reach


    DeFi, being a digital finance system, is available and accessible to all individuals
    around the globe with the basic requirements of a stable internet connection and
    crypto wallet. Transactions between people sitting far apart on different continents
    can also successfully occur. These platforms work 24/7. At the same time, traditional
    financing systems are bound by time and space constraints. Due to the physical
    space requirements for the operation of maximum financial activities, these economical
    systems need to catch up to the evolved systems offered by DeFi. Additionally,
    due to the condition of human labor to put most financial services, activities,
    and transactions in motion, these systems need to be more useful in digitization. 


    The DeFi systems stand in strong contrast to the conventional financial systems.
    DeFi has more advantages in the financial world than traditional economic systems.
    The utility of DeFi systems is on an exponential rise, with more and more industries
    attempting to find the crossroads between DeFi and its application to complement
    their functionality. While the DeFi systems are visibly booming with the current
    digitization trends, they still have a long way to go. Despite the unprecedented
    proliferation of technology and increased accessibility of Internet services,
    only 65% of the world''s population has Internet access, making it impossible
    for them to avail the benefits these systems offer. Thus, they continue to seek
    financial services from intermediaries under the umbrella of traditional economic
    methods.  


    Lack of reliable information provides concreteness to an individual''s misconceptions
    about the working of DeFi platforms. They are falsely implicated in digital financial
    services as a hoax by magnifying and overdoing the risks. While it is imperative
    to warn the users of the dangers that might befall their digital journey in the
    finance world, it is essential to make them aware of the mitigation and manageableness
    related strategies corresponding to the risks. Additionally, many downsides of
    the DeFi systems have been discussed in the later sections, which contribute to
    tantalizing these platforms'' reputation and trust quotient. Thus, even individuals
    accessing DeFi services refrain from venturing into these platforms. They instead
    turn to traditional financial service systems to receive economic benefits.  


    Use Cases of DeFi 


    DeFi has taken the world by a whirlwind with its efficacy, resilience, immutability,
    and transparency in financial operations. It has set into motion many economic
    opportunities for its global user base. Due to the plethora of advantages DeFi
    offers, the scope of its application is already widening. It is expected to widen
    even further with the refinement of the system and the advancement of technology.
    DeFi is enabling the integration of digital finance services with multiple industries
    which initially didn''t witness crossroads with these systems. It applies to conventional
    financial services like borrowing, lending, trading, marketplaces, etc. These
    economic systems have found application across varied sectors, from increasing
    the efficiency of traditional financial activities to introducing DeFi in unhackneyed
    industries. The use cases of this system are already growing at an unprecedented
    rate and are expected to follow an ascending graph line. A few prominent use cases
    have been delineated below. 


    Borrowing and Lending


    With DeFi''s influence on systems of finance and transactions increasing, the
    loopholes in the traditional finance system are becoming all the more evident
    to the users. Traditional financial markets have proliferation in revenue generation
    by the interest they pay the lenders and the interest they charge from the borrowers.
    Such a system often discouraged the borrowers from approaching these markets due
    to rigid protocols for qualifying for a loan, including viable collateral and
    a hefty amount of interest charged. The digital ledger technology bolstered by
    DeFi opens opportunities for borrowers who need a loan and fail to procure it
    due to rigid requirements. With smart contracts in place, lending/borrowing loans
    and maintaining the terms of conditions outlined in the smart contracts smoothens
    the dual lending and borrowing processes. The dynamics structuring DeFi support
    peer-to-peer lending and borrowing. This use case is finding widespread application
    in the form of an increase in DeFi projects about this. 


    For instance, Compound is a DeFi protocol that stands out because it has an autonomous
    interest basis. Compound welcomes lenders to earn interest on various cryptocurrencies.
    It provides the lenders with tokens, which are then siphoned off to the borrowers
    at algorithmically decided autonomous interest rates. The compound is highly efficient
    because the intelligent contract identifies the lenders and borrowers with concurring
    interests and lays out interest rates following the borrowed and lent assets ratio
    in the discussion. Another prominent example of such a project is ‘Pool Together,’
    which uses akin mechanisms in lending and borrowing money.


    Tokenization


    One of the significant use cases of the DeFi system is in the context of tokenization.
    Tokenization refers to curating, issuing, regulating, and transferring digital
    assets on a blockchain network. Tokenization is highly pertinent because any form
    of investment can be converted into tokens for their storage on the blockchain.
