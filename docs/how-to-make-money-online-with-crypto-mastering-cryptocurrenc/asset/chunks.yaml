    # Can Cryptos Replace The Centralized Financial System?


    Before we address this issue, we must consider how centralized financial systems
    came to be. This would enable us to assess the function of central financial institutions
    and determine if cryptos might eventually replace them.


    ## Central Banks: Their History


    In 1844, the English developed central banking with the Bank Charter Act, a legislative
    initiative that established the foundation for an organization with exclusive
    authority over currency issuance. The notion was that a bank with so much power
    might contribute to the financial system''s stability during times of crisis.
    It''s a notion that many experts believe played a role in averting catastrophe
    during the 2007-2008 financial crisis and the subsequent Great Recession.


    ## The Evolution of Central Banking Roles


    Over time, central banks have developed. For example, the Federal Reserve utilizes
    monetary policy to attain full employment and price stability, assure the nation''s
    banking and financial systems are secure and sound and allow customers to get
    credit, stabilize the financial system in times of crisis, and contribute to the
    oversight of the nation''s payment systems. The Federal Reserve and other central
    banks may adjust interest rates and create or destroy money to accomplish these
    goals.


    ## Monetary Policy Tools and Effects


    For instance, if the economy seems to be expanding too fast and prices for goods
    and services become unaffordable, a central bank may raise interest rates to make
    borrowing more costly. Additionally, a central bank may deplete the economy of
    money by decreasing the quantity of money it makes accessible to other banks for
    lending reasons. Because most funds reside on computerized balance sheets, just
    pressing delete may cause it to vanish. Thus, the quantity of money available
    to buy products is reduced, presumably resulting in a decrease in pricing.


    Naturally, every action has a corresponding response. While demonetization may
    result in lower costs, it makes it more difficult for companies to borrow money.
    As a result, these companies may become more cautious, hesitant to spend, and
    reluctant to recruit new employees.


    Central banks may lower interest rates or create money if an economy needs to
    develop more rapidly. Reduced interest rates make borrowing money less costly
    and more accessible and attractive to businesses and individuals. Similarly, central
    banks may expand the funds available to banks for lending.


    Additionally, central banks may attempt to influence economies in other ways.
    These measures may involve the open market purchase of securities (bonds) to create
    demand. High demand results in reduced interest rates since borrowers no longer
    need to provide a higher rate because the central bank offers a willing buyer.


    ## Risks and Unintended Consequences


    Attempts by central banks to guide economies toward prosperity are loaded with
    danger. Inflation may become a concern if interest rates are kept too low. The
    economy may stall when prices rise and people need help to afford their desired
    goods. When interest rates are too high, borrowing is restricted, and the economy
    is harmed.


    Low-interest rates (compared to other countries) encourage investors to withdraw
    money from one country and transfer it to another, providing a better return rate.
    Consider the predicament of retirees whose income is dependent on rising interest
    rates. When interest rates are low, their buying power and capacity to pay their
    expenses are directly impacted. Sending money to a nation that provides a higher
    rate of return is a sensible move.


    Interest rate and money supply manipulation also directly impacts the value of
    a nation''s currency. A high currency makes exporting products more costly for
    local businesses. This has the potential to result in domestic unemployment. A
    depreciating dollar raises imported products'' prices, such as oil and other commodities.
    This may increase the cost of imports for consumers and domestic producers of
    products that depend on imported components or materials. A weak dollar benefits
    a slowing economy needing a boost, while a strong dollar benefits consumers.


    Because there is a lag between when a central bank initiates a policy adjustment
    and when that move affects a nation''s economy, central banks are always looking
    forward. They aim to implement policy changes now that will allow them to accomplish
    future objectives.


    ## The Case Against Central Banks


    Now let''s look at the other side of the coin. The inherent complexity of national
    and global economies provides ammunition for the claim that these economies are
    too unpredictable to be effectively controlled via the manipulation practiced
    by central banks. This argument, advanced by adherents of the Austrian School
    of Economics, may justify the adoption of a peer-to-peer currency like Bitcoin
    that does away with central banks and their intricate systems.


    Since their creation, modern central banks have been a source of contention. And
    the causes for dissatisfaction are many and diverse. On the one hand, the idea
    of monopolistic power is very unsettling to many individuals. On the other hand,
    the presence of an autonomous, opaque organization that can influence an economy
    is much more alarming.


    Numerous individuals (including economists and politicians) think that central
    banks make errors that significantly affect citizens'' lives. Among these errors
    are the following: increases in the quantity of money (creating inflation and
    hurting consumers by raising prices for the goods and services they purchase);
    interest rate hikes (hurting consumers who wish to borrow money); the development
    of measures that maintain an abnormally low rate of inflation (resulting in unemployment);
    abnormally low-interest rates (creating asset bubbles in real estate, stocks,
    or bonds).


    In this vein, no less an authority than former Federal Reserve Chair Ben Bernanke
    blames the Great Depression of 1929 on central bank manipulation (which increased
    interest rates).


    In an era where technology enables consumers to conduct trade without the intervention
    of a central authority, central banks are obsolete. This argument is strengthened
    by a more comprehensive study of the financial sector.


    ## Scandals and Public Distrust


    The Great Recession and a slew of scandals were precipitated by banking sector
    corruption. Bankers have wreaked havoc in Greece and other countries. Several
    organizations, like the International Monetary Fund, have been accused of prioritizing
    profits above people. And on a more local level, bankers earn billions of dollars
    by acting as intermediaries in individual transactions. In this climate, many
    individuals find abolishing the financial system attractive.


    ## Conclusion


    To sum up, at the moment, central banks are the primary mechanism through which
    countries control their economies and look at every war fought this century. Every
    battle was in a country with no central bank until the war ended. They have monopolistic
    power and are unlikely to relinquish it without a struggle. While Bitcoin and
    other digital currencies have attracted considerable curiosity, their adoption
    rates are low, and official backing is practically nonexistent. It makes sense
    when you realize that banks are not just for transactional purposes, as most cryptos
    are. They have a far broader set of goals than cryptos. All of these make sense
    on paper, but when the Federal Reserve is no more Federal than Federal Express,
    and it was created by the Bank of England and the Rothschilds to print money for
    the financial elite anytime they want, you can imagine they will do everything
    that can to keep this system in place for their benefit.

    '
  trans: '

    # 加密货币能取代中心化金融体系吗？


    在探讨这一问题之前，我们必须考虑中心化金融体系是如何形成的。这将使我们能够评估中央金融机构的职能，并判断加密货币是否最终能取代它们。


    ## 中央银行：历史沿革


    1844 年，英国通过《银行特许法案》确立了中央银行制度，该立法奠定了一个拥有货币发行专有权的机构的基础。其理念是，拥有如此大权力的银行可能在危机时期促进金融体系的稳定。许多专家认为，这一理念在避免
    2007-2008 年金融危机及随后的大衰退演变成灾难方面发挥了作用。


    ## 中央银行职能的演变


    随着时间推移，中央银行的职能不断演变。例如，美联储利用货币政策来实现充分就业和物价稳定，确保国家银行业和金融体系安全稳健并让客户获得信贷，在危机时期稳定金融体系，并参与监管国家支付系统。美联储和其他中央银行可能通过调整利率和创造或销毁货币来实现这些目标。


    ## 货币政策工具及其影响


    例如，如果经济似乎过热，商品和服务价格变得难以负担，中央银行可能会提高利率，使借贷成本更高。此外，中央银行可通过减少可供其他银行贷款的货币量来抽离经济中的货币。由于大多数资金存在于电子资产负债表上，只需按下删除键即可使其消失。因此，可用于购买产品的货币量减少，推测会导致价格下降。


    自然，任何行动都有相应的反作用。虽然去货币化（或紧缩货币）可能导致成本降低，但会使企业借贷更加困难。结果，这些企业可能变得更加谨慎、不愿消费、也不愿招聘新员工。


    如果经济需要更快发展，中央银行可能会降低利率或创造货币。降低利率使借贷成本更低，对企业和个人更具可及性和吸引力。同样，中央银行也可能扩大可供银行贷款的资金。


    此外，中央银行可能尝试通过其他方式影响经济。这些措施可能涉及公开市场购买证券（债券）以创造需求。高需求导致利率下降，因为借款人无需提供更高利率，因为中央银行提供了一个愿意的买家。


    ## 风险与意外后果


    中央银行试图引导经济走向繁荣充满了危险。如果利率过低，通胀可能成为隐患。当物价上涨、民众难以负担所需商品时，经济可能停滞。当利率过高时，借贷受限，经济受损。


    低利率（相较于其他国家）鼓励投资者从一国撤资并转移至另一回报率更高的国家。考虑一下依靠利息收入生活的退休群体的困境。当利率低时，他们的购买力和支付开支的能力直接受影响。将资金转移到提供更高回报率的国家是明智之举。


    利率和货币供应量的操纵也直接影响一国货币价值。货币升值使本地企业出口产品成本更高，可能导致国内失业。货币贬值推高进口产品价格，如石油和其他大宗商品。这可能增加依赖进口零部件或材料的消费者和国内生产商的进口成本。疲软的美元利于需要刺激的放缓经济，而强势美元利于消费者。


    由于中央银行启动政策调整到该举措影响国家经济之间存在滞后，中央银行总是着眼未来。它们旨在现在实施政策变更，以实现未来目标。


    ## 反对中央银行的论据


    现在让我们看看另一面。国家和全球经济固有的复杂性，为“这些经济体过于不可预测，无法通过中央银行实施的操纵有效控制”这一主张提供了弹药。奥地利学派经济学的追随者提出的这一论点，可能为采用比特币等点对点货币提供理由，后者摒弃了中央银行及其复杂体系。


    自诞生以来，现代中央银行一直是争议的源头。不满的原因多种多样。一方面，垄断权力的概念让许多人极不安。另一方面，一个能够影响经济的自主、不透明组织的存在更令人担忧。


    许多人（包括经济学家和政治家）认为中央银行犯下的错误严重影响公民生活。这些错误包括：增加货币供应量（造成通胀，通过推高商品和服务价格损害消费者利益）；加息（损害想要借贷的消费者）；制定维持异常低通胀率的措施（导致失业）；异常低利率（在房地产、股票或债券中制造资产泡沫）。


    在这方面，前美联储主席本·伯南克这一权威人物将 1929 年大萧条归咎于中央银行的操纵（即加息）。


    在技术使消费者无需中央权威干预即可进行交易的时代，中央银行已显过时。对金融部门更全面的研究强化了这一论点。


    ## 丑闻与公众不信任


    大衰退和一系列丑闻源于银行业的腐败。银行家在希腊及其他国家制造了混乱。包括国际货币基金组织在内的多个机构被指责将利润置于民众福祉之上。在更微观的层面，银行家通过充当个人交易中介赚取数十亿美元。在这种环境下，许多人认为废除现有金融体系颇具吸引力。


    ## 结论


    总之，目前中央银行是各国控制经济的主要机制，看看本世纪发生的每一场战争。每场战争发生的国家都没有中央银行，直到战争结束才建立。它们拥有垄断权力，不太可能不经过斗争就放弃。虽然比特币和其他数字货币引起了极大好奇，但其采用率低，官方支持几乎不存在。当你意识到银行不仅仅用于交易目的（大多数加密货币仅限于此）时，这就说得通了。它们拥有比加密货币广泛得多的目标。这些在纸面上都讲得通，但当美联储“联邦”程度不比联邦快递（Federal
    Express）高，且是由英格兰银行和罗斯柴尔德家族创立、为金融精英随时印钞时，你可以想象他们会竭尽全力维护这一体系以谋取私利。

