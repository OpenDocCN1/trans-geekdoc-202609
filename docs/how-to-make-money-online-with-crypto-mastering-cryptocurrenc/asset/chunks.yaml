    另一个最近越来越普及的选择是比特币 ATM。据统计，目前全球 76 个国家拥有超过 4,000 个加密货币 ATM 机。这些机器可用于购买比特币并将其发送到您的加密货币钱包。


    ## 加密货币钱包


    “加密货币钱包”一词常用于存储代币。这是因为加密货币钱包是一种设备或软件，允许用户存储和检索其数字资产。该钱包代表您的投资组合。例如，当您在 `Coinbase`
    创建账户时，会自动获得一个软件钱包。购买任何加密货币后，都会反映在您的 `Coinbase` 钱包中。此金额可用于发送到其他交易所进行币币交易。


