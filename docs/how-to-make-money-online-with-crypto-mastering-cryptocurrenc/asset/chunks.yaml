    # Cryptocurrency Milestones


    ## 2008

    The first two cryptocurrency milestones occur. The domain name Bitcoin.org was
    registered on August 18. Then, on October 31 "Satoshi Nakamoto," the inventor
    of Bitcoin, released a document that kicks off the process: Bitcoin is a decentralized
    electronic cash system that operates on a peer-to-peer basis.


    ## 2009

    On January 12, Nakamoto delivered ten Bitcoin (BTC) to Hal Finney, a computer
    programmer.


    ## 2010

    Bitcoin was hacked on August 15, revealing a critical weakness in the system.
    Jeff Garzik, a Bitcoin developer, notes a very unusual transaction involving 184
    billion BTC, stating: "We''ve got an issue here."


    Later that year, the first Bitcoin sale occurred, establishing the first time
    that cryptocurrency had a monetary value. Ten thousand Bitcoins are exchanged
    for two pizzas by a Bitcoin user. These would be the world''s most expensive pizzas
    since 10,000 Bitcoin is worth more than $447 million.


    ## 2011

    Rival cryptocurrencies begin to appear with the introduction of Litecoin, Namecoin,
    and Swiftcoin. Meanwhile, Bitcoin is under fire after reports that it is being
    utilized on the so-called "dark web," namely Silk Road. Bitcoin''s price skyrockets
    before plummeting again, demonstrating that no exposure is terrible PR.


    ## 2012

    Cryptocurrencies became public awareness thanks to a fictionalized trial dubbed
    Bitcoin for Dummies in the third season of the US drama The Good Wife.


    ## 2013

    Forbes dubbed 2013 the "Year of the Bitcoin." This was the year Bitcoin captured
    the attention of many hungry investors, commanding headlines at $1,242 per coin
    and driving gold prices to a session low of $1,240 per ounce.


    Its worth soared as it gained traction at discussion tables, internet forums,
    and seminars. This rapid growth resulted in widely divergent perspectives on cryptocurrencies,
    with some seeing them as a hoax while others saw them as lucrative and appealing
    ventures. The reality is that both positions are very persuasive. Due to the extreme
    volatility of the cryptocurrency markets, succeeding years saw unpredictable changes
    in value and opinion.


    When Bitcoin holders cannot agree on a new transaction rule, a Bitcoin "fork"
    occurs, and the blockchain physically divides in half. Two networks operate concurrently
    for six hours, with two distinct versions of transaction histories, resulting
    in an inevitable value decline.


    Meanwhile, many governments are trying to determine the best approach to cryptocurrency
    regulation. Thailand prohibits Bitcoin trading, calling it unlawful. Germany''s
    finance ministry would not recognize Bitcoin as an official currency but as a
    "unit of account," opening the door for a future framework taxing Bitcoin-related
    activities. The People''s Bank of China has prohibited financial institutions
    from utilizing Bitcoins, resulting in another decline in value. The first Bitcoin
    ATM is opened in Vancouver, Canada.


    ## 2014

    Exchange of cryptocurrencies Mt Gox, headquartered in Japan, falls insolvent and
    leaves investors out of pocket. Microsoft enables customers to purchase games
    using Bitcoin as an example of the currency''s increasing appeal.


