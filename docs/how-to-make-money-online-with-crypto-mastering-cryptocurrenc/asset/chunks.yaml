    cater to their financial services irrespective of geographic impediments. However,
    blockchain-based projects need to improve the scalability of these host platforms.
    DeFi suffers as the transactions take longer to process after confirmation. This
    can be attributed to the fact that these DeFi systems can process a definite set
    number of transactions at a single moment. For instance, the DeFi-based platform
