    or 42329 Ether during an auction by the auction house Christie’s. It is a collage
    of five thousand images created by Beeple. It was purchased by Vignesh Sundaresan,
    who is now displaying it in a digital museum.


    It is not only the most expensive digital art piece till now but also one of the
    most expensive pieces sold by a living artist. Beeple is the pseudonym of the
    American digital artist Mike Winkelmann, who has converted many of his digital
    pieces into NFTs and sold them. His artworks are some of the most in-demand NFTs
    in the crypto world, with most selling in minutes and charging exorbitant prices.
    Another one of his pieces, called Crossroads, a 10-second video, sold for approximately
    6.6 million dollars in February 2021.


    Decentraland: Decentraland is a 3-D virtual reality world. In this world, the
    products, lands, and other amenities are sold as NFTs, connecting the virtual
    and real worlds. It was initially started by Argentinian developers in 2015. It
    slowly moved from a pixelated sphere to a 3-d world. Recently, the prices of virtual
    real estate have increased manifolds, with some of the prime real estate in decentral
    costing as much as 100,000 dollars. Real-world companies such as Sotheby’s and
    Republic Realm are purchasing digital real estate in this world to use as digital
    offices and shopping places. 


    Alchemy Toys: Alchemy Toys is a game based on the Binance Smart chain, developed
    by a German software company called Backupdev UG. It is being promoted as an amalgamation
    of non-fungible tokens, massively multiplayer online role-playing games, and decentralized
    finance. In this game, players can own unique and rare alchemy toys, which can
    then be combined to form newer toys or sold to the other players for the actual
    value. It is also possible to sacrifice or burn these toys. If a person offers
    all the different toys, they are rewarded with Binance coins.


