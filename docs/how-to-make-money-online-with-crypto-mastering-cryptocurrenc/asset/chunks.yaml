  trans: '

    # DeFi 概览


    这些服务的运行由区块链技术提供支持。区块链是一种不可变的账本，能以最简单的形式成功存储、追踪和记录交易。这种系统利用嵌入区块链中的智能合约，使金融服务在寻求者和接收者之间的交换过程更加顺畅。智能合约是双方或多方之间达成条款并随后签署的数字协议。一个设计良好的智能合约在信息方面承诺安全性。由于合约存在于区块链中，出于恶意目的访问已签署合约的可能性降低，从而增强了保险的安全性。


    ## DeFi 如何运作？


    DeFi 使用加密货币和智能合约，消除了对经纪人或其他中介干预的需求。通过首先了解 DeFi 的基本组成部分，可以理解 DeFi 的运作方式。


    ## DeFi 的组成部分


    在了解 DeFi 的特性和特征之前，理解构成 DeFi 的组件至关重要。基于 DeFi 是一个金融生态系统的前提，它理应类似于其他经济生态系统运作。因此，DeFi
    组件的大致分类包括：


    ### 稳定货币（稳定币）


    此外，DeFi 上的每一项金融服务交换都使用智能合约。智能合约是 DeFi 运作的核心，因为它们保障条款并记录交易活动，以确保商定的条款得到履行。现在，让我们在软件栈的背景下继续了解
    DeFi 系统的组件。


    ### DeFi 软件系统栈


    多层的整合构成了软件栈的特征。这些不同的层又拥有在开发 DeFi 系统中承担明确特定功能的组件。四个层构成了 DeFi 软件系统栈：


    #### 结算层


    结算层是构成 DeFi 软件系统的四个层中的第一层。它可以被理解为为 DeFi 交易提供平台的基础层。结算层至关重要，因为它是 DeFi 金融生态系统的锚点。公共区块链和加密货币是其运作的基本要素。例如，比特币和以太坊是结算层的典型代表。


    #### 区块链协议


    这些协议是确保系统可靠运行所必需的相关规则和法规。遵守这些规则使行业操作员能够无阻碍地工作。这一层确保资产在 DeFi 生态系统中转换为现金，提供流动性。


    #### 应用层


    这一层简化了上述协议以确保接口服务，使系统及其服务可供消费者使用。例如，这一层可以允许借贷服务在此分发。虽然对各层有不同的分类，但上述提到的层已被压缩以确保读者的理解并避免歧义。


    了解了 DeFi 生态系统的基本组件后，让我们来了解这些系统的实际工作流程。由于 DeFi 仅在区块链网络上运行，因此其工作流程与区块链非常相似。DeFi
    区块链通过向用户发放加密密钥来确保金融服务和交易的安全。这些密钥使用户能够接收只有他们才能访问的唯一标识符。该系统有两个基本密钥：私钥和公钥。


    这对双钥服务于不同的功能。例如，公钥被感兴趣的服务寻求者或对等方用来查找系统所有者。所有者可以使用私钥访问并授权涉及其资金的任何金融活动或交易。私钥至关重要，因为它充当所有者的数字钱包，用户可通过它交换加密货币。只有所有者可以通过私钥授权交易来启动交易。一旦交易请求经过所有相关方验证，交易便开始执行。值得一提的是，每笔交易都伴随一个唯一
    ID，以维持高安全标准并防止平台上的任何不当行为。了解了 DeFi 的运作后，让我们继续看看该系统的特性。


    ## DeFi 的主要特性


    DeFi 的核心特征也与这种在全球范围内传播金融服务的去中心化方法所提供的益处相一致。这些特性大多由 DeFi 服务的区块链网络强化。从去中心化和系统无许可性等定义性特征，到透明度提高、不可篡改性等隐含特质，DeFi
    包含许多特性。下面概述了一些主要特性：


    ### 去中心化的前提


    DeFi 的首要特征，正如其组成词汇所示，是去中心化。如前几节所述，去中心化意味着没有中央权威或中介机构来增加基本金融服务流程的繁琐性和复杂性。在没有任何此类中介的情况下，此类金融服务的寻求者可以无任何限制地访问这些服务。这一特性在下一部分中详细阐述，即无许可性，它与去中心化密切相关。


    ### DeFi 系统的无许可性


    “去中心化金融”定义了这一特性，其中包含的“去中心化”一词表明其旗舰特性是无许可性。金融服务的去中心化使寻求者和接收者能够在一个不需要银行等外部中央权威监管的平台上互动。它还减少了对银行和其他中介的依赖，同时寻求通过
    DeFi 平台轻松获取的金融服务。这一特性赋予了 DeFi 系统独立和用户友好的优势。因此，任何个人只需具备加密钱包和互联网连接这最低要求即可访问这些服务。例如，以太坊基于无许可区块链，这促进了该平台的普及。如今，以太坊引领着
    DeFi 行业。


    DeFi 运作的无许可性甚至可能引发对安全性的疑虑。DeFi 系统上运营活动的安全性由智能合约补充，智能合约确保满足金融服务的条款和条件，从而确保资金安全。此外，所有交易活动都存储在区块链本身上。


    ### 高度透明


    与去中心化可能降低透明度的普遍观念相反，去中心化在很大程度上提供了开放性。由于分布式账本涵盖了区块链网络上的所有交易活动，它为可靠的清晰度提供了空间。透明度延伸至金融数据和活动，并适用于智能合约。在智能合约的情况下，透明度扩大了任何人审查其代码的内容范围。它确保每个人都能获取信息。

