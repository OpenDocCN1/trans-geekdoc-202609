  trans: '


    # 加密货币里程碑


    ## 2008

    前两个加密货币里程碑相继出现。域名 Bitcoin.org 于 8 月 18 日注册。随后，在 10 月 31 日，比特币发明者“中本聪”发布了一份开启这一进程的文件：比特币是一种基于点对点运作的去中心化电子现金系统。


    ## 2009

    1 月 12 日，中本聪向计算机程序员哈尔·芬尼转账了十个比特币 (BTC)。


    ## 2010

    8 月 15 日，比特币遭遇黑客攻击，暴露了系统中的一个关键弱点。比特币开发者杰夫·加兹克注意到一笔涉及 1840 亿 BTC 的异常交易，并表示：“我们遇到问题了。”


    同年晚些时候，首次比特币交易发生，确立了加密货币首次拥有货币价值。一位比特币用户用一万个比特币换取了两个披萨。这些将成为世界上最贵的披萨，因为 10,000
    个比特币价值超过 4.47 亿美元。


    ## 2011

    随着莱特币、域名币和 Swiftcoin 的推出，竞争对手加密货币开始出现。与此同时，由于有报道称比特币被用于所谓的“暗网”，即丝绸之路，比特币备受抨击。比特币价格暴涨后又暴跌，证明了“没有曝光就是坏公关”这一说法并不成立。


    ## 2012

    得益于美剧《傲骨贤妻》第三季中一场名为《比特币入门》的虚构审判，加密货币进入了公众视野。


    ## 2013

    《福布斯》将 2013 年称为“比特币之年”。这一年，比特币吸引了众多渴望投资者的目光，以每枚 1,242 美元的价格登上头条，并将黄金价格推低至每盎司 1,240
    美元的盘中低点。


    随着比特币在讨论桌、网络论坛和研讨会上获得关注，其价值飙升。这种快速增长导致了对加密货币观点的严重分歧，有人视其为骗局，也有人将其视为利润丰厚且极具吸引力的投资。现实是，这两种立场都极具说服力。由于加密货币市场的极端波动性，随后几年价值和舆论出现了不可预测的变化。


    当比特币持有者无法就新的交易规则达成一致时，就会发生比特币“分叉”，区块链会实质性地一分为两。两个网络同时运行了六小时，拥有两个不同版本的交易历史，导致价值不可避免地下跌。


    与此同时，许多政府正试图确定监管加密货币的最佳途径。泰国禁止比特币交易，称其为非法。德国财政部不承认比特币为官方货币，而是将其视为“记账单位”，为未来对比特币相关活动征税的框架打开了大门。中国人民银行禁止金融机构使用比特币，导致价值再次下跌。首台比特币
    ATM 在加拿大温哥华投入使用。


    ## 2014

    总部位于日本的加密货币交易所 Mt Gox 破产倒闭，让投资者血本无归。微软允许客户使用比特币购买游戏，这体现了该货币日益增长的吸引力。


    ## 2015

    其他加密货币涌现，包括以太坊和 Coinbase（后者在一轮融资中筹集了 7500 万美元，这是比特币公司有史以来筹集的最大金额）。总部位于欧洲的比特币交易所
    Bitstamp 在遭遇黑客攻击后发生安全漏洞，几天后恢复交易，并向客户保证其资金未丢失。


    ## 2016

    加密货币继续普及。比特币 ATM 数量从年初的约 500 台增加到年底的近 900 台；阿根廷的 Uber 开始接受比特币支付，而瑞士国家铁路和软件公司 Steam
    也成为新用户。


    DAO（去中心化自治组织）于 5 月成立——一个建立在以太坊区块链上的无国籍风险投资基金，也是世界上最大的众筹项目。上线一个月后遭用户黑客攻击，三分之一的资产被盗。因此，以太坊经历了一次“分叉”，分裂为以太坊和以太坊经典。


    ## 2017

    这是比特币历史上的分水岭之年，这一时期永久改变了人们对加密货币的看法。2017 年，比特币成为所有加密货币新手的入场券。人们并不总是将比特币视为长期投资。他们用比特币兑换山寨币并投资首次代币发行
    (ICO)，挥霍数百万资金指望一夜暴富。


    普通大众首次在 2017 年意识到加密资产的存在。监管极少；任何有钱人都可以创建代币并在交易所上市。消费者保护措施不存在，每个人都成了评估早期区块链“投资”的专家。


    这导致了首次代币发行 (ICO) 狂潮，每个人都被炒作误导，并被基本面极差的投资烧伤。比特币在不到一年的时间里从 900 美元涨至 11000 美元。由于代币价值可能在一年内从
    1 美元飙升至 100000 美元以上，这一年对加密货币来说甚至更加疯狂。


    除了这种狂热，备受期待的“比特币现金硬分叉”发生了，将比特币分裂为两种衍生加密货币：BTC 和 BCH。日本颁布立法，允许合法接受比特币作为支付机制。同时，挪威的
    Skandiabanken 引入比特币账户，并将比特币视为投资资产和支付系统。


    ## 2018

    2018 年，我们见证了比特币 (BTC) 历史上最重大的价格下跌之一。山寨币市场在 2017 年比特币牛市期间激增，但因 2018 年的低迷而崩盘。这一模式表明，所有加密货币都与比特币的趋势密不可分。换句话说，曾达到
    8280 亿美元历史高点的总市值开始逐渐萎缩。因此，市场对加密货币的兴趣正在减退。


    许多欧洲国家合作制定加密货币立法，并继续与主流品牌建立创造性合作，例如瑞波币 2018 年与桑坦德银行合作推出的国际汇款应用。


    ## 2019

    地缘政治紧张局势升级、全球贸易摩擦、政治不稳定和不确定性只是 2019 年主导全球市场的几个主要主题。正如我们在中美贸易谈判中所见，投资者的预期在达成协议和全面贸易战之间摇摆。脱欧问题给英国未来的增长蒙上了阴影。


    尽管市场环境动荡，比特币在 2019 年的表现显著优于其他资产类别。这一表现证明了比特币作为对冲全球风险和停滞的有效工具，以及一种具有高回报率的风险资产的有效性。


    如果投资者在 2019 年遵循简单的买入持有策略，比特币可能提供 90% 的年化回报。2019 年，加密货币领域呈现完全不同的局面。2019 年初，除比特币外的加密货币总市值为
    526.6 亿美元。到 6 月中旬，当 BTC 达到年度高点 13330 美元时，该市值一度超过 1400 亿美元。然而，随着比特币价格下跌，除 BTC 外的市值在上半年失去了大部分涨幅，年底收于
    559 亿美元。


    ## 2020

    2020 年对每个人来说都是疯狂的一年，尤其是对加密货币而言。比特币自 2017 年以来首次刷新历史新高，近期引起媒体关注。随着对大流行引发经济衰退的担忧加剧，全球金融市场动荡不安。3
    月 12 日，比特币近七年来首次跌破 4000 美元，录得近七年来最大单日跌幅 27%。


    '
