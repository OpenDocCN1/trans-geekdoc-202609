    many people super-rich. The world''s most popular cryptocurrency started on January
    3, 2009, by mining the genesis block (Block 0), which created 50 Bitcoins. On
    January 9, Version 0.1 of Bitcoin was officially released, including the generation
    system that limits Bitcoin''s total circulation to 21 million by 2040.


    We now walk through Bitcoin''s eventful journey to the top and analyze some of
    the significant milestones hit by the coin along the way.


    2009 - 2011


    After its inception in January 2009, Bitcoin remained more or less confined to
    the developers'' circles and didn''t catch much attention outside of it. But as
    October of 2009 came around, A pro-Crypto website named New Liberty Standard,
    which an original Bitcoin developer ran, displayed the first BTC-USD exchange
    rate. At the time, they calculated the exchange rate based on the cost of electricity
    required to mine one Bitcoin, which was around $0.0007 on October 5, 2009. Less
    than a month later, Bitcoin 0.2 was released with Linux support and new features
    that upgraded the blockchain capabilities. In May of 2010, the first Bitcoin purchase
    occurred when Programmer Laszlo Hanyecz bought two Papa John''s pizzas for 10,000
    Bitcoins (worth about $30) through an exchange on the Bitcointalk chat forum.
    By late 2010, Bitcoins popularity was increasing beyond the original media, and
    it was gaining momentum; this led to Bitcoins total market cap hitting the $1
    million mark by November 2010. One Bitcoin was worth about $0.5 at this point.


    2011 was a significant year for Bitcoin as it breached the $1 mark for the first
    time and made global headlines, further boosting its popularity. The infamous
    Silk Road website was also launched around this time by Mr. Ross Ulbricht, who
    wanted to create a lawless dark web marketplace where people could buy and sell
    whatever they wanted without a trace. Bitcoin is an obvious choice of currency
    as it is anonymous and untraceable. However, with the momentum gained from media
    attention, Bitcoin continued to rise, going beyond $10 to over $30 by June 2011.
    As this happened, the original creator, Satoshi Nakamoto, disappeared from the
    internet.


    After rallying from $1 in February to highs of $31 on June 8, the dream run of
    Bitcoin suddenly reversed, the Bitcoin bubble as it was known - burst -and prices
    tumbled back down to single digits by June 12.


    The sudden climb gave crypto fans massive hope in the new digital currency, with
    some expecting the price to reach highs beyond $1,000 and enter mainstream usage
    by the end of the year. But the sudden crash brought as much despair as the climb
    had given hope, and soon the existence of black market applications like Silk
    Road had people questioning the future of Bitcoin. Bitcoin version 0.5 was in
    operation around this time.


    2012-2017


    Bitcoin, being ever-volatile, had been slowly rising again over the past few months
    after the price peaked back in June 2011, climbing back above $9 for the first
    time in almost a year. Following this, multiple events of Bitcoin exchanges getting
    hacked and Bitcoins stolen were reported. Bitcoin continued its bull run, breaking
    the all-important $100 barrier for the first time, jumping from $96.15 on March
    31, 2012, to close at $104.70 the next day.


    However, the price was over 70% in two days as a panic sell-off ensued, falling
    from $228.94 to $68.09 in just six days, leaving the currency back where it had
    started for the month. The secret online black market called Silk Road that uses
    Bitcoin for shady transactions was seized by the FBI in October 2013, and Bitcoin
    prices plunged by over 18% from $127.30 to $103.85 as a result, but the price
    rebounded the very next day. By November, Bitcoin surged almost ten times in value
    reaching $1000. China''s foreign minister Wang Yi takes a positive stand and announces
    that people in China are "free to participate in the Bitcoin market" and promises
    to "adopt a long-term perspective" on the currency, bringing much optimism to
    the market participants.


    By 2015, Bitcoin was now accepted by over 100,000 retailers worldwide: including
    Microsoft, Dell, Wikipedia, Twitch, Greenpeace, Expedia, and PayPal. The widespread
    merchant adoption reassured people that Bitcoin has real value as a currency,
    not just as a digital investment. By late 2017, Bitcoin was trading around the
    $1000 mark as stray hacking incidents continued.


    In a gigantic jump, Bitcoin went from under $1,000 on January 1, 2017, to $10,840
    on December 1, making many people very rich. It went on to top a record-breaking
    high of $20,089 and closed the day at an all-time high of $19,783.06.


    2018-2020


    Prices sank 3.60% after Twitter announced a ban on cryptocurrency advertisements
    joining the likes of tech giants Google and Facebook to protect investors from
    fraud. 


    The crackdowns came as global regulators started to notice the potential risks
    in Initial Coin Offerings (ICOs) and other misuse and frauds related to cryptocurrency
    use. The price dropped from $8,518.64 to $7,471.18 during the week. The seventeenth
    generation of Bitcoin''s original software client, Bitcoin Core 0.17.0, became
    available with significant upgrades by 2018 as prices kept diminishing. As 2019
    came around, the price climbed above $10k, hitting $13,880 on June 26 before sliding
    back.


    The plague struck in 2020, Covid-19 crashed into our lives, and markets worldwide
    plunged. Bitcoin doesn''t escape either, falling by over 50% in less than a week
    as the world moves toward a total lockdown. On March 12, Bitcoin dropped from
    almost $8,000 to below $5,000, losing 39% daily. Market liquidity froze up, and
    investors fled into cash and commodity segments. Amazingly, however, the price
    was back up to pre-pandemic levels by May as Bitcoin traders got back into the
    game quickly.


    By November 2020, Bitcoin was up 100% on the year at $15,770; the bullish momentum
    continued, with prices increasing to a daily high of $19,864 on November 30 before
    closing the month at $19,700. Soon enough, on December 16, the cryptocurrency
    blows past the $20,000 barrier before charging on up to reach a record-breaking
    high of $21,576 – a yearly gain of over 180%. The currency kept climbing, passing
    $24,000 on December 21 and $26,000 on December 26.


    2021-present


    The bull run is sustained as Bitcoin bowls into a record-breaking 2021 by smashing
    through the $30,000 barrier on January 2 and smashing past $40,000 less than a
    week later before reaching a high of $42,000 on January 8, resulting in a 40%
    gain in the first week of the year. It''s been very volatile since Bitcoin topped
    $40,000 at the start of January, and the currency has displayed immense volatility.


    It''s lost a quarter of its value since then, dipping briefly below $30,000 on
    January 22 and again on January 27. In yet another example of the massive influence
    Elon Musk can wield online, he adds the #Bitcoin hashtag to his Twitter profile,
    and the price skyrockets, gaining almost 11% in a single day and continuing with
    a further 10% rise the following day.


    Following this on Monday, January 8, Tesla announced in an SEC filing that it
    had invested $1.5 billion into Bitcoin as part of a new investment policy, sending
    prices skyward. It''s been an excellent year for Bitcoin, and by February 2021,
    the price bounced through $50,000 for the first time. In a significant milestone,
    Bitcoin''s price reflected 9% on February 19- taking its total market cap past
    $1 trillion for the first time, climbing above $53,000. Shortly after, Elon Musk
    announced over Twitter that after buying $1.5 billion worth of Bitcoin last month,
    Tesla will now accept Bitcoins as payment for its cars - integrating the cryptocurrency
    further into the financial system.'
