- raw: 'The first two cryptocurrency milestones occur. The domain name Bitcoin.org
    was registered on August 18. Then, on October 31 "Satoshi Nakamoto," the inventor
    of Bitcoin, released a document that kicks off the process: Bitcoin is a decentralized
    electronic cash system that operates on a peer-to-peer basis.


    2009


    On January 12, Nakamoto delivered ten Bitcoin (BTC) to Hal Finney, a computer
    programmer.


    2010


    Bitcoin was hacked on August 15, revealing a critical weakness in the system.
    Jeff Garzik, a Bitcoin developer, notes a very unusual transaction involving 184
    billion BTC, stating: "We''ve got an issue here."


    Later that year, the first Bitcoin sale occurred, establishing the first time
    that cryptocurrency had a monetary value. Ten thousand Bitcoins are exchanged
    for two pizzas by a Bitcoin user. These would be the world''s most expensive pizzas
    since 10,000 Bitcoin is worth more than $447 million.


    2011


    Rival cryptocurrencies begin to appear with the introduction of Litecoin, Namecoin,
    and Swiftcoin. Meanwhile, Bitcoin is under fire after reports that it is being
    utilized on the so-called "dark web," namely Silk Road. Bitcoin''s price skyrockets
    before plummeting again, demonstrating that no exposure is terrible PR.


    2012


    Cryptocurrencies became public awareness thanks to a fictionalized trial dubbed
    Bitcoin for Dummies in the third season of the US drama The Good Wife.


    2013


    Forbes dubbed 2013 the "Year of the Bitcoin." This was the year Bitcoin captured
    the attention of many hungry investors, commanding headlines at $1,242 per coin
    and driving gold prices to a session low of $1,240 per ounce.


    Its worth soared as it gained traction at discussion tables, internet forums,
    and seminars. This rapid growth resulted in widely divergent perspectives on cryptocurrencies,
    with some seeing them as a hoax while others saw them as lucrative and appealing
    ventures. The reality is that both positions are very persuasive. Due to the extreme
    volatility of the cryptocurrency markets, succeeding years saw unpredictable changes
    in value and opinion.


    When Bitcoin holders cannot agree on a new transaction rule, a Bitcoin "fork"
    occurs, and the blockchain physically divides in half. Two networks operate concurrently
    for six hours, with two distinct versions of transaction histories, resulting
    in an inevitable value decline.


    Meanwhile, many governments are trying to determine the best approach to cryptocurrency
    regulation. Thailand prohibits Bitcoin trading, calling it unlawful. Germany''s
    finance ministry would not recognize Bitcoin as an official currency but as a
    "unit of account," opening the door for a future framework taxing Bitcoin-related
    activities. The People''s Bank of China has prohibited financial institutions
    from utilizing Bitcoins, resulting in another decline in value. The first Bitcoin
    ATM is opened in Vancouver, Canada.


    2014


    Exchange of cryptocurrencies Mt Gox, headquartered in Japan, falls insolvent and
    leaves investors out of pocket. Microsoft enables customers to purchase games
    using Bitcoin as an example of the currency''s increasing appeal.


    2015


    The emergence of other cryptocurrencies, including Ethereum and Coinbase (which
    received $75 million in a financing round, the most significant sum ever raised
    by a Bitcoin firm). Bitstamp, a Bitcoin exchange headquartered in Europe, suffers
    a security breach after a hack and restarts trading a few days later, assuring
    clients that their money has not been lost.


    2016


    Cryptocurrencies continue to gain popularity. The number of Bitcoin ATMs has increased
    from about 500 at the start of the year to slightly under 900 by year''s end;
    Uber in Argentina has begun taking Bitcoin payments, while the Swiss national
    railway and software company Steam are among new users.


    The DAO (decentralized autonomous organization) was established in May - a stateless
    venture capital fund on the Ethereum blockchain and the world''s most significant
    crowdfunded initiative. Users hack it a month after its debut, and a third of
    its assets are stolen. Consequently, Ethereum undergoes a "fork," dividing into
    Ethereum and Ethereum Classic.


    2017


    This was a watershed year in the history of Bitcoin, and this period permanently
    altered the way people viewed cryptos. Bitcoin served as an entry point for all
    newcomers to cryptocurrency in 2017. Individuals were only sometimes considering
    Bitcoin as a long-term investment. They were trading Bitcoin for altcoins and
    investing in initial coin offerings (ICOs), throwing away millions expecting to
    become wealthy.


    The general public first became aware of crypto assets in 2017. The regulation
    was minimal; anybody with money could create and list a token on an exchange.
    Consumer safeguards were non-existent, and everyone became an expert at assessing
    early-stage, blockchain-based "investments."


    This resulted in the initial coin offering (ICO) frenzy, in which everyone was
    misled by excitement and burnt by fundamentally poor investments. Bitcoin increased
    from $900 to $11000 in less than a year. This year was even crazier for cryptocurrencies
    since coins potentially increased in value from $1 to over $100000 in a single
    year.


    Apart from this excitement, the highly anticipated "Bitcoin cash hard fork" occurred,
    dividing Bitcoin into two derivative cryptocurrencies: BTC and BCH. Japan enacts
    legislation allowing for the legal acceptance of Bitcoin as a payment mechanism.
    At the same time, Skandiabanken in Norway incorporates Bitcoin accounts and recognizes
    Bitcoin as an investment asset and payment system.


    2018


    In 2018, we saw one of the most significant price declines in Bitcoin''s history
    (BTC). The altcoins market surged in 2017 during the Bitcoin bull run but collapsed
    in 2018 because of the downturn. This pattern demonstrated that all cryptocurrencies
    are inextricably linked to Bitcoin''s trends. In other words, what reached an
    all-time high of $828 billion began to decline gradually. Consequently, interest
    in cryptocurrencies was waning in the market.


    Numerous European countries collaborate on cryptocurrency legislation, and many
    continue to establish creative collaborations with high-street brands, such as
    Ripple''s 2018 international money transfer app with Santander.


    2019


    Increased geopolitical tensions, global trade frictions, political instability,
    and uncertainty were just a few of the main themes that dominated the global market
    in 2019. As we''ve seen with the US-China trade talks, investors'' expectations
    have fluctuated between an agreement and a full-fledged trade war. The Brexit
    issue has cast doubt on the UK''s future growth.


    Despite a turbulent market environment, Bitcoin outperformed other asset classes
    significantly in 2019. The performance demonstrates Bitcoin''s effectiveness as
    a hedge against global dangers and stagnation, as well as a risk-on asset with
    a high rate of return.


    Bitcoin may provide investors a 90% annual return in 2019 if they follow a simple
    buy-and-hold strategy. In 2019, the cryptocurrency sector was a completely different
    scenario. At the start of 2019, the Crypto Total Market Cap Ex-BTC was USD 52.66
    billion. It surpassed USD 140 billion in mid-June when BTC reached a year high
    13330. However, when Bitcoin prices fell, the Ex-BTC Market Cap lost most of its
    gains in 1H19 and ended the year at USD 55.90 billion.


    2020


    2020 has been an insane year for everyone, especially for cryptocurrencies. Bitcoin
    garnered media attention lately after setting fresh all-time highs for the first
    time since 2017. Global financial markets were shaken by turmoil as concerns of
    a pandemic-induced economic slump increased. On March 12, Bitcoin dropped below
    $4,000 for the first time in almost seven years, registering the most significant
    one-day loss of 27 percent in nearly seven years.'
