- raw: 'Mike Novogratz is a former hedge fund manager investing and veteran investor
    in Bitcoin and blockchain technology. His several past predictions have been both
    correct and incorrect. In March 2019, Novogratz indirectly made a prediction,
    claiming Bitcoin would "easily" surpass gold''s market cap of $7.5 trillion within
    the next ten years. This puts his prediction very close to Edstrom''s, both in
    terms of timeline and magnitude. As evident from these testimonials, most experts
    in the crypto and financial space are bullish on Bitcoin, especially in the long-term
    perspective.


    # Chapter 4: The Altcoin Market


    What are Altcoins?


    Since its inception in 2009, Bitcoin has become the first and most popular cryptocurrency
    globally. It has paved the way for creating many other alternative cryptocurrencies
    (or Altcoins) looking to outperform each other in a dynamic and fast-moving financial
    market. Bitcoin has also been the most popular currency for users of Dark Net
    markets due to its semi-anonymous qualities, lack of regulation, and effectiveness
    in laundering the profits from online contraband sales. However, users have criticized
    Bitcoin as lacking true anonymity and have been accused of providing a trail of
    evidence for law enforcement to trace payments via its blockchain due to its design
    limitations. This led to an increase in the development of alternative cryptocurrencies
    (Altcoins) in which anonymity and security are prioritized to make tracing payments
    and laundering of proceeds almost impossible. But all Altcoins are not geared
    towards anonymity; any cryptocurrency, not Bitcoin, is termed an Altcoin. 


    With enhanced security features, an Altcoin can see its price increasing dramatically
    due to demand. Still, it may be the currency of choice for the wider majority.
    Each Altcoin project is unique and has its own target niche, objectives, and blockchain
    technologies it was built upon.


    Bitcoin vs. Altcoins


    Altcoins work in different ways than Bitcoin does. For example, while Bitcoin
    produces only new Bitcoins every 10 minutes, altcoins such as Litecoin create
    new coins every 2.5 minutes. This means Litecoin can process payments faster.
    Moreover, Litecoin''s total supply is capped at around 84 million Litecoin, whereas
    Bitcoin''s total is about 21 million.


    Litecoin also uses a different set of rules for mining than Bitcoin. Bitcoin mining
    requires costly hardware, whereas Litecoin can be mined with standard computer
    hardware.


    Litecoin is just one of the thousands of altcoins available today. However, some
    altcoins stand out as popular alternatives to Bitcoin; although they don''t reach
    Bitcoin''s $100 billion market cap, most have some advantage over conventional
    Bitcoin. A few examples of such altcoins include:


    Ethereum - ETH


    Ripple – XRP


    Cardano – ADA


    Solona – SOL


    Polygon – MATIC


    Polkadot - DOT


    Litecoin – LTC


    Avalanche - AVAX


    Generally, these altcoins were built and released to improve on Bitcoins flaws
    by providing faster transactions, faster mining rates, more security, or lower
    network fees.


    However, these altcoins may need more stability, liquidity, and a large market
    cap that Bitcoin offers.


    Early Examples of Altcoins


    One of the earliest notable Altcoins, Litecoin, released in October 2011, was
    marketed as the "silver to Bitcoin''s gold." While fundamentally similar in code
    and functionality to Bitcoin, Litecoin diverges from Bitcoin in several ways.
    Litecoin allows transactions to be approved more frequently. It also provides
    for a total supply of 84 million coins to be created, which is four times Bitcoin''s
    total supply. Litecoin is still among the most popular altcoins; some even think
    it could be a better investment than Bitcoin.


    Types of Altcoins


    Depending on their functionalities and blockchain mechanisms, altcoins come in
    many varieties and categories. Here''s a rundown of some of the more important
    ones:


    Mining-Based


    As their name indicates, mining-based altcoins are generated through mining. Most
    altcoins that fall into this category use Proof-of-Work (PoW). Proof-of-work is
    how computers generate new coins by solving complex problems to create blocks.
    Examples of mining-based altcoins are Litecoin, Zcash, and Monero. Most of the
    top altcoins in early 2020 were mining-based coins. Pre-mined coins are the alternative
    to mining-based altcoins. Pre-mined coins are not produced through an algorithm
    but distributed before being listed in a cryptocurrency exchange. An example of
    a pre-mined coin is XRP, also known as Ripple.


    Stablecoins


    Cryptocurrencies, since their launch, have been very volatile by nature. Stablecoins
    aim to reduce this overall volatility by clinching their value to various goods
    or commodities, such as precious metals, fiat currencies, or other cryptocurrencies.
    This ensures that investors can redeem their money if the cryptocurrency fails
    or faces problems. Price fluctuations for stablecoins don''t usually go beyond
    a narrow range.


    Social media giant Facebook''s Diem is the most famous example of a stablecoin.
    It is a dollar-backed coin, meaning Diem''s value is linked to the US dollar.
    Other examples of stablecoins include USDC and MakerDAO.


    Security Tokens


    Security tokens are comparable to securities traded in stock markets, except they
    have a digital origin. Security tokens are similar to traditional stocks, and
    they typically promise equity in the form of ownership or a dividend payout to
    holders. The possibility of price appreciation for such tokens is a major draw
    for investors to buy and hold these coins. Security tokens are generally offered
    to investors through ICOs or initial coin offerings from major crypto exchanges.


    Utility Tokens


    Utility tokens are used to provide and avail services within a network. For example,
    they might be used to redeem rewards or purchase services. Utility tokens, unlike
    security tokens, do not pay dividends. Filecoin, used to buy cloud storage space
    on a network, is an example of a utility token.


    Crypto Adoption Token (CAT)


    The CAT Token was released in 2023 and introduced as a cutting-edge Pro-Crypto
    Public Education, Adoption, and Awareness Token, Including advertising campaigns
    to promote Crypto. Join them and others to spread the word about cryptocurrency''s
    benefits and help revolutionize the world of finance. Tokens like this will invest
    in pro-crypto politicians and support regulatory measures through funding. They
    will secure a lobbying company and empower the next generation with strategic
    crypto education and Onboarding. The goal is to provide crypto content to the
