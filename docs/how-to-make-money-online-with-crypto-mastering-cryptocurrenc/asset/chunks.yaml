  trans: '

    # 比特币：市场潜力、能源担忧与专家预测


    ## 市场潜力与优势


    对于开发者而言，创建这些应用程序存在一个巨大的、未被开发的市场，因为任何依赖第三方清算系统的行业都可能采用这项技术。比特币演变为一项变革性技术的进程，在于其解决长期存在问题的能力，以及一个活跃且不断壮大的用户和开发者社区。


    企业也开始意识到使用加密货币进行国际交易的好处。使用传统方式时，贸易在跨境过程中可能会遭遇各种莫名其妙的费用，这使得向另一家企业发送正确金额变得复杂。得益于快速点对点交易的灵活性，尤其是在国际企业对企业（B2B）场景中，加密货币相较于传统货币具有显著优势。


    互联网市场蓬勃发展，已成为传统实体店的真正竞争者。Amazon.com 的增长程度似乎近乎意料之外。网购繁荣发展，比特币有望凭借高效便捷的支付方式，为供应商和客户拓展其影响力。


    比特币最重要的机遇之一在于其可以作为一种商品发挥作用，类似于黄金。每当事件威胁全球市场平衡时，黄金价值都可能大幅飙升，正如我们在 COVID-19 大流行期间所见。商品市场是一种广泛接受且成熟的贸易形式，而加密货币似乎已开始模仿黄金的特性。黄金长期以来一直是价值的保存者，这建立在对其价值的普遍接受和信任之上。加密货币可能成为商品市场的重要参与者。它们具有可通过直接在线机制购买的独特属性，这为买家创造了便捷的入场通道。如果比特币继续作为对抗通胀法币的有效避风港，它将赢得投资者的信心，并更接近主流地位。


    ## 能源消耗担忧


    众所周知，比特币“挖矿”是一个非常耗能的过程。最近的研究表明，比特币网络中的单笔交易消耗 800 千瓦能量。相比之下，同等能量可支持 500,000 笔 Visa
    交易。与现金或法币等其他支付方式相比，比特币极其耗能。按当前价格来看，比特币的能源消耗并非不利。尽管如此，全球变暖和气候变化引发了人们对比特币挖矿使用不可再生能源的担忧。


    ## 当前市场状况


    我们正经历比特币的崛起，这可能是 2024 年下一轮牛市全面开启的开端。


    ## 专家价格预测


    比特币在 2021 年下半年陷入停滞，从 4 月创下的约 65,000 美元峰值下跌了一半多。然而，比特币价格仍远高于 2020 年 10 月大规模反弹开始时的水平，那轮牛市曾将加密货币总市值推至惊人的
    2.5 万亿美元，随后回落。预测比特币等加密货币的未来充满挑战，且结果很难做到高度准确。比特币作为波动性最大的资产之一，使得未来估值非常难以准确把握。话虽如此，让我们概览一下加密货币专家和金融分析师对比特币未来的看法。


    ### 蒂姆·德雷珀


    比特币多头蒂姆·德雷珀对比特币做出了最乐观的预测之一，预测该代币将在年底达到 250,000 美元。


    ### 舍尔文·皮谢瓦尔


    风险投资家兼天使投资人舍尔文·皮谢瓦尔（Hyperloop One 和 Sherpa Capital 联合创始人）在推特上预测比特币将达到 10 万美元。这一预测是在与
    MicroStrategy 首席执行官迈克尔·塞勒会面后不久提出的，后者的公司投资了超过 10 亿美元购买比特币。


    ### 托马斯·菲茨帕特里克


    花旗银行市场洞察产品 CitiFX Technicals 全球主管托马斯·菲茨帕特里克因其 318,000 美元的比特币估值登上头条，该估值源于一份泄露的在线报告。他的分析将
    1970 年代的黄金市场与比特币的价格走势进行了类比，并指出自 COVID-19 出现以来，央行加速印钞可能会助推比特币上涨。


    ### 温克莱沃斯双胞胎


    温克莱沃斯双胞胎——著名的比特币亿万富翁——表示比特币有潜力在 2030 年达到 500,000 美元的价格。这将使其市值与黄金持平，达到约 9 万亿美元。


    ### 温塞斯·卡萨雷斯


    温塞斯·卡萨雷斯是比特币钱包初创公司 Xapo 的首席执行官兼创始人，也是 PayPal 董事会成员等。卡萨雷斯在纽约举行的 2017 年共识大会上表示，比特币将在
    2027 年之前某个时候达到 100 万美元。


    ### 查马斯·帕利哈皮蒂亚


    查马斯·帕利哈皮蒂亚是 Social Capital 的创始人和金州勇士篮球队的联合所有者。他从 2012 年的一次投资开始了他的比特币投资之旅，到 2013
    年，他已将比特币纳入所有投资组合。一度，他拥有流通中 5% 的比特币。


    帕利哈皮蒂亚声称比特币价格将在未来 3-4 年内达到 100,000 美元，并补充说将在 2037 年达到 100 万美元。他说：“这东西有潜力与黄金价值相媲美……这是对抗极权政权和我们已知的、腐蚀世界正常运作方式的银行基础设施的绝佳对冲工具和价值储存手段。”


    ### 杰里米·刘


    杰里米·刘是 Lightspeed Venture Partners 的合伙人。他是社交媒体应用 Snapchat 的早期投资者之一。在接受 Business
    Insider 采访时，刘表示比特币价格“切实可行”地在 2030 年达到 500,000 美元。随后，区块链钱包（全球最流行的比特币钱包）首席执行官兼联合创始人彼得·史密斯支持了刘的预测。


    ### 马克·尤斯科


    马克·尤斯科是亿万富翁投资者、Morgan Creek Capital 的创始人。他预测从长远来看比特币价值将超过 400,000 美元，这一言论因其宏大的规模而登上头条。


    “这只是数学问题。它等同于黄金；目前约有 2000 万枚比特币可用。黄金目前约为 8 万亿美元。这给出了 400,000 美元的价格。这还不包括货币相关的用例，”尤斯科说。他进一步暗示，比特币等加密货币让银行家心生恐惧，因为比特币完全消除了对银行的需求。


    ### 凯·范-彼得森


    凯·范-彼得森是 Saxo Bank（一家专注于在线交易和投资的投资银行）的分析师。据 CNBC News 报道，范-彼得森认为比特币将在 2027 年上涨至每枚
    100,000 美元。他成功预测了比特币在 2017 年涨至 2,000 美元。尽管乐观，但他最近的估计表明，比特币将占全球外汇市场交易量的 10%。


    ### 安迪·埃德斯特罗姆


    安迪·埃德斯特罗姆是总部位于加利福尼亚的投资咨询公司 WESCAP 的财富经理，他是一名投资者和狂热的 Twitter 用户，不断推文讨论该话题，甚至写了一本名为《为什么要买比特币》的书。2020
    年 2 月，埃德斯特罗姆预测比特币将在 2030 年达到 8 万亿美元的市值。这将使单枚硬币价格约为 400,000 美元，市值与黄金相当。埃德斯特罗姆认为比特币可能成为世界的默认货币。


    ### 迈克·诺沃格拉茨


    [源文本中未提供迈克·诺沃格拉茨的内容。]

