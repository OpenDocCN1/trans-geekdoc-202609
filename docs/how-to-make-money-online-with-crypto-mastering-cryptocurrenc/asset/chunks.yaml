    # DeFi 与传统金融系统


    ## 托管与控制权


    DeFi 用户对其资金拥有绝对的托管权，并可自主决定何时交易、与谁交易以及交易金额。然而，传统金融系统并不提供对资金和资产的此类控制权。在这些系统中，个人必须将资金交由中央机构托管。例如，银行印证了这一前提。资金并非由资金所有者控制，实际上掌握在最高层中央银行手中，随后是二级银行跟进。


    ## 创新性与互操作性


    DeFi 的显著特征在于其创新性，能够适应用户不断演变的期望标准。这些系统的创新势头也在下一节概述的用例中得到印证。以创新为核心，这些系统正渗透进众多行业。然而，由于中心化的模式，传统金融生态系统仅提供快速创新和适应。由于权力的中心化，任何创建提案都必须经过这些机构层级结构中不同层级的众多高管审批。这种彻底的层级结构确保了中央机构做出深思熟虑的决策。虽然这种严格的多重审查机制使提案相对规避风险，但往往导致提案被延迟甚至完全拒绝。由于趋势不断演变，这种时间差可能会使提案变得过时。


    ## 可访问性与覆盖范围


    DeFi 作为一种数字金融系统，只要具备稳定的互联网连接和加密钱包这一基本条件，全球所有个人均可访问和使用。身处不同大陆、相距遥远的人们之间也能成功进行交易。这些平台全天候运行。与此同时，传统融资系统受限于时间和空间约束。由于大多数金融活动运营需要物理空间，这些经济系统难以赶上
    DeFi 提供的先进系统。此外，由于大多数金融服务、活动和交易需要人力推动，这些系统在数字化方面的实用性有待提高。


    ## 现状与挑战


    DeFi 系统与传统金融系统形成鲜明对比。在金融领域，DeFi 比传统经济系统拥有更多优势。DeFi 系统的效用呈指数级上升，越来越多的行业试图寻找 DeFi
    与其应用的交汇点，以补充其功能。尽管 DeFi 系统在当前数字化趋势下显现出蓬勃发展的态势，但前路漫漫。尽管技术空前扩散且互联网服务可及性增加，全球仅有 65%
    的人口拥有互联网接入，这使得他们无法享受这些系统提供的福利。因此，他们继续在传统经济模式的庇护下，寻求中介机构的金融服务。


    缺乏可靠信息加深了个人对 DeFi 平台运作的误解。通过夸大和渲染风险，DeFi 被错误地诬陷为数字金融服务中的骗局。虽然有必要警示用户在数字金融之旅中可能遇到的危险，但同样重要的是让他们了解针对风险的缓解和可管理性策略。此外，DeFi
    系统的许多缺点已在后续章节中讨论，这损害了这些平台的声誉和信任度。因此，即使是接触过 DeFi 服务的个人也避免深入这些平台。他们转而求助于传统金融服务系统以获取经济利益。


    ## DeFi 的用例


    DeFi 凭借其在金融运营中的功效、韧性、不可篡改性和透明度，席卷全球。它为其全球用户群开启了众多经济机遇。鉴于 DeFi 提供的众多优势，其应用范围正在不断扩大。随着系统的完善和技术的进步，预计应用范围将进一步扩大。DeFi
    正在实现数字金融服务与多个行业的融合，这些行业最初未曾与这些系统产生交集。它适用于借贷、交易、市场等传统金融服务。这些经济系统已在多个领域找到应用，从提高传统金融活动的效率到将
    DeFi 引入未被开发的行业。该系统的用例正以前所未有的速度增长，并预计将保持上升趋势。以下列举了几个突出的用例。


    ### 借贷


    随着 DeFi 对金融和交易系统影响力的增强，传统金融系统的漏洞对用户而言变得愈发明显。传统金融市场通过向借款人收取的利息和支付给贷款人的利息差价来大量创收。由于申请贷款的严格协议（包括可行的抵押品和高额利息），这种体系往往会阻碍借款人寻求这些市场。DeFi
    强化的数字账本技术，为那些需要贷款但因严格要求而无法获得贷款的借款人打开了机会之门。有了 `smart contracts`，借贷以及维护 `smart contracts`
    中规定的条款条件，使双向借贷流程更加顺畅。构建 DeFi 的动态机制支持点对点借贷。这一用例正以 DeFi 项目的增加形式得到广泛应用。


    例如，`Compound` 是一个脱颖而出的 DeFi 协议，因为它拥有自主利率基础。`Compound` 欢迎贷款人在各种加密货币上赚取利息。它向贷款人提供代币，随后这些代币以算法决定的自主利率借给借款人。`Compound`
    具有极高的效率，因为智能合约能识别出利益一致的贷款人和借款人，并根据讨论中借贷资产的比例制定利率。另一个此类项目的显著例子是 `Pool Together`，它在借贷中使用类似机制。


    ### 代币化


    DeFi 系统的一个重要用例是代币化。代币化是指在区块链网络上创建、发行、监管和转移数字资产。代币化极其相关，因为任何形式的投资都可以转换为代币以便在区块链上存储。`Ethereum
    blockchain` 成功利用代币化，为世界提供了一种安全便捷的交易方式，即基于以太坊的代币。在代币使用带来的众多优势中，主要优势体现为这些代币的份额化特性和可定制选项。因此，由于其数字化替代方案和对贸易的有效补充，代币化是蓬勃发展的
    DeFi 生态系统的核心特性之一。


    ### 稳定币的功效


    '
