    # NFTs vs Cryptocurrencies: Key Differences


    ## Cost

    The cost or price of NFTs and cryptocurrencies differs to a great extent. When
    we talk about cryptocurrencies, the most popular and expensive cryptocurrency
    is `Bitcoin`. `Bitcoin`, during the bull market of 2021, reached a peak price
    of just above 64,000 dollars. This, however, pales in comparison to the kind of
    prices that people have paid for some NFTs. People regularly pay upwards of a
    million dollars for NFTs, with the most expensive NFT netting around 69 million
    dollars during an auction in March 2021.


    ## Divisibility

    Another difference between NFTs and cryptocurrencies is their ability to be divided
    into smaller pieces. Cryptocurrencies can be broken down into pieces, which can
    further be broken down into parts. This is essential for expensive cryptocurrencies
    like `Bitcoin` so people can purchase them in smaller quantities. NFTs always
    exist as a whole, and they are like art pieces. They can''t be broken down, traded,
    collected, and reassembled.


    ## Blockchain Used

    The blockchains used for the two also differ. While for cryptocurrencies, almost
    every cryptocurrency runs on its own blockchain, which stores the transactions
    of said currency. For example, the trades of `Ether` are recorded on `Ethereum`.
    Whereas NFTs are more often than not running on the `Ethereum` blockchain; some
    of them are also on the `Binance Smart Chain`. These are the two most commonly
    used blockchains for NFTs.


    ## Purchase Platforms

    The platforms at which the two are traded are also different. At the same time,
    cryptocurrencies are traded on crypto exchanges, such as `Binance` and `Coinbase`.
    These crypto exchanges can be both centralized or decentralized in nature. NFTs
    are bought and sold on NFT platforms like `OpenSea` and `Nifty Gateway`. At the
    same time, NFTs are also being sold by auction houses such as `Sotheby''s` and
    `Christie''s`.


    ## Currencies Accepted

    The money that can be paid for the purchase of the two is also different. When
    we talk about cryptocurrencies, one can pay for them in fiat currencies or other
    cryptocurrencies, depending on their crypto exchange. Thus we see that cryptocurrencies
    are readily convertible to real-world money. On the other hand, to purchase NFTs,
    one has to pay only in cryptocurrencies. If the NFT is based on the `Ethereum`
    blockchain, it is paid for in `Ethers (ETH)`, and if it is on the `Binance Smart
    Chain`, then it is paid for in `Binance coins (BNB)`.


    ## Timeline

    The timeline of the emergence of the two is also very different. Cryptocurrencies
    were first created in 2008, the first being `Bitcoin`. Cryptocurrencies came into
    the mainstream in the middle to late 2010s, with the first bull market in 2017
    and the second in early 2021. On the other hand, the first NFT was introduced
    in 2016; it became slightly famous in 2017 due to `CryptoKitties` and `CryptoPunks`,
    but it only entered the mainstream in 2021 when the NFT market ultimately ballooned.


    # Workings of NFTs


    ## Creating an NFT

    Creating an NFT is relatively easy; various platforms allow people to make an
    NFT. To make a non-fungible token, one needs two things: the digital art or asset
    that will be converted into a non-fungible token and the payment for doing the
    minting. Recently, much stuff has been converted into non-fungible tokens, including
    digital art, songs, videos, and even tweets; anything with a digital form or signature
    can be converted into an NFT. Once created, the NFTs can be viewed by the owner
    on wallets, just like cryptocurrencies. These NFTs similarly exist on addresses
    on the blockchain, which can be accessed by the person holding the key.


    ## NFT Standards

    During the minting process of an NFT, the owner or creator of the NFT executes
    code that conforms to different NFT standards. NFTs use standards and protocols
    such as the following:


    ### `ERC-721`

    `ERC-721` was the original standard developed to create NFTs in 2017. It was written
    in `Solidity` on the `Ethereum` blockchain. This standard allows minting new NFTs
    easier, faster, and non-repetitive. `ERC-721` is the most commonly used standard;
    anyone can create their own NFT.


    ### `ERC-1155`

    `ERC-1155` is another standard on the `Ethereum` blockchain. It was developed
    after `ERC-721` and is considered an upgrade over the previous one. The standard
    has smart contracts executed in a way that makes new non-fungible tokens. One
    of the significant advantages that `ERC-1155` has over `ERC-721` is that one can
    create multiple NFTs on a single smart contract. On an `ERC-721`, one had to run
    the smart contract for a new NFT every time. The `ERC-1155` is more efficient
    and takes less storage space, but it is also more diverse since it can make fungible
    tokens and non-fungible tokens.


    ### Hedera Token Service

    This is a non-`Ethereum`-based standard that `Hedera` offers. This is much cheaper
    than the `Ethereum` standards and also faster. `Infinite by SUKU` is one company
    that has shifted to `Hedera` from `Ethereum`.


    ## Fractional NFTs

    Currently, we see that NFTs are proprietary and have single owners. There are
    plans to introduce fractional NFT standards shortly, allowing multiple users to
    own a fraction of a single NFT. This would align with the decentralizing and multiple-node
    nature of blockchains in general.


    # NFT Use Cases


    NFTs can be used in various sectors. Some of these use cases are:


    ## Gaming

    Non-fungible tokens, primarily online gaming, are extensively used in the gaming
    sector. Some of the first NFTs, such as `CryptoKitties`, were just games set up
    on blockchains. NFTs can be used in gaming in two broad ways: either the collection
    and storing of the NFTs is in itself a game, and people are trying to get NFTs,
    convert them into something else within the game, and then try to win a reward,
    as is the case in `CryptoKitties` or `Alchemy Toys`. Conversely, it is also possible
    that the NFTs are being used as appendages to other games. These can be cosmetic
    (skins, avatars, helmets, etc.) and utile (weapons, pets, etc.).


    In Massively Multiplayer Online Role-Playing games, people can use NFTs to own
    certain in-game items, giving them the exclusive right to use these. The gaming
    industry is one of the fastest-growing industries in the world. With the increase
    in mobile-based games and internet penetration in previously untapped regions,
    it is set to expand even further in the next few years. The gaming industry will
    be worth over 300 billion dollars by 2023. This provides NFTs with a large market
    base and potential growth in this sector.


    ## Digital Assets

    The digital asset marketplace is also one of these tokens'' most critical use
    cases. It is possible to purchase assets that only exist in the digital world.
    `Decentraland` is among the most common names when buying digital assets as NFTs.
    `Decentraland` is a virtual world with a certain amount of finite and scarce land.
    A prospective buyer can purchase this land from others or even the developers.
    The price of the land is dependent, much like in the real world, on the location
    of this ''plot.'' Some of the game''s prime location digital real estate is being
    sold for thousands of dollars. Companies are planning to set up their digital
    stores in these spaces. `Cryptovoxels` is another project where people can purchase
    and sell digital assets.


    ## Art

    Currently, Art is the sector where NFTs are used most. Digital art for years was
    plagued with the problem of being easily copied, and thus with no scarcity for
    the said product, the price of digital art could not be higher. This completely
    changed after people started converting their digital art to NFTs. When Art was
    combined with NFT, it became a lot easier for the owners of the said pieces to
    authenticate their ownership. This created a limited supply of digital art, which
    caused it to shoot up in value. Over the last couple of years, we have seen some
    digital paintings being sold for astronomical prices, such as *Everydays: The
    First 5000 Days*, which was sold at 69 million dollars.

