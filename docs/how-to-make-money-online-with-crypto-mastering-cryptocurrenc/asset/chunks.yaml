- raw: 'Therefore, any individual might make an informed decision for availing of
    the financial services offered by the smart contract in focus based on its review.
    Furthermore, the context of transparency in the case of DeFi systems is also supported
    by the basic cryptographic regulations applying to the blockchain, which promise
    that the information is added only after proper verification and authentication
    procedures. The DeFi protocols existing on the Ethereum platform necessitate the
    openness of the source code for users to review. In the case of a public Ethereum
    chain, the information is broadcasted to all the users, bolstering the premise
    of transparency.


    Immutability


    One of the significant advantages DeFi offers is the immutability of financial
    data by reducing the possibility of any malicious data tampering. Data storage
    on Blockchain networks makes the records extremely secure, reducing the case of
    any unauthorized change in the papers. This, in turn, decreases the prospect of
    fraudulent practices reigning in this financial system. Also, smart contracts
    on the blockchain make the terms and conditions unchangeable by a single party
    due to the availability of activity regarding the intelligent agreements to all
    the concerned parties. This distinguishing feature of DeFi ensures a highly secure
    space and dialogue for exchanging financial services.


    Accessibility


    As mentioned in the previous section, anyone can use DeFi financial systems with
    minimum prerequisites of a crypto wallet and an internet connection. This allows
    users across the world to relish the advantages offered by DeFi. Although such
    ledgers are permissionless in their essence, they might create many problems,
    like the proliferation of fraudulent activities or perpetrators disrupting the
    financial ecosystem set up by DeFi. Due to the same, it is pertinent for service
    seekers and givers on DeFi platforms to authenticate the other party by checking
    the Know-Your-Customer (KYC) requisites and, sometimes, Anti-money laundering
    (AML). Due to relevant strategies to prevent malpractices, accessibility still
    weighs more towards the side of benefits conferred.


    Flexibility and Autonomy


    The permissionless feature of DeFi systems offers untamed flexibility and autonomy
    to the users. Again, this is because there is no regulating body to hinder the
    progression and evolution of services and their scope of DeFi systems. The users
    are not required to display compliance with a defined set of rules and regulations
    forced on them by external authorities. The flexibility offered to the software,
    for example, in the case of smart contracts, leads to autonomy. Once the interested
    parties have entered into intelligent agreements with mutual alignment, smart
    contracts are self-functional, requiring nothing from the involved parties except
    complying with the terms stated. Thus they can easily carry out their business
    without needing external authority, augmenting autonomy.


    Now that we know the characterizing features of the DeFi systems let''s compare
    this system with the traditional financial methods and assess which system has
    more significant advantages. 


    Comparison Between DeFi And Traditional Financial Systems


    The traditional financial systems include conventional banks and other financial
    institutions governed by a centralized authority, thus often used interchangeably
    with Centralized finance (CeFi). Centralized exchanges, part of the CeFi, jeopardize
    user funds, data security, and privacy as these centralized authorities manage
    both. However, these centralized exchanges allow various financial services like
    margin trading, borrowing, lending, etc. Also, CeFi effectively provides cross-chain
    services standing in strong contrast to DeFi. CeFi considers a multitude of chains
    for taking complete control of the funds, and only after that, it allows the trading
    of coins. Also, they have the feature of transfer of ownership that reinforces
    its simplicity in the case of cross-chain services. Additionally, CeFi systems
    also offer flexibility in working with fiat currency. Despite the advantages of
    CeFi or traditional financial methods, DeFi systems are gaining mainstream traction
    in the financial world due to their many benefits. 


    Agents of Regulation of Service 


    The essence of traditional financial systems is the presence of a central authority.
    Conventional economic systems or CeFi (Centralized finance) operate under the
    aegis of an umbrella authority that lists the rules and regulations of different
    components constituting it. In the case of DeFi, as reiterated in the previous
    sections, intelligent contracts are responsible for the absolute management and
    regulation of financial services. These smart contracts are publicly available
    for audit by any user. Such a facility of contract audit is not available in the
    case of CeFi, as the operation of financial services needs to be made public for
    review by a more significant number of individuals. Critics might reason against
    this by implicating that the presence of intelligent contracts publicly can undermine
    the privacy of the parties involved. In this context, DeFi ensures that the public
    projection of the smart contracts is pseudonymous, which means that the identities
    and preliminaries of the parties involved are not involved.  


    Also, in the case of a financial institution acting as a platform for disseminating
    financial services, the culmination of financial services is delayed by the engagement
    of many people with different allocated responsibilities. Such a tedious and cumbersome
    process often drives the seekers of financial services away. Smart contracts,
    in the case of DeFi, ensure robustness in services with little to no human interventions
    in the process. 


    Permissionless


    CeFi and DeFi are also different regarding permissions required to process financial
    services. As outlined under the features of DeFi, the permissionless nature of
    DeFi helps economic activities to be carried out without much effort. The users
    can connect their existing wallets to their platform of DeFi service and engage
    in the requisite financial services. However, in the case of CeFi, with the requirements
    of KYC to avail services, the process becomes relatively longer. 


    Operational Space


    Another basic premise of the difference between traditional financial systems
    and DeFi is the operational platform. Most conventional economic systems need
    a physical space for their proper operation. It also requires human labor and
    services to keep disseminating their services in the physical area, thus necessitating
    a good amount spent on incentivizing human work. While DeFi is based on Distributed
    ledger technology (DLT) and runs effectively on blockchain networks. DeFi''s entire
    operation employing technology and advanced software stacks eliminates the need
    for a formal setting in a physical space, on the one hand. It reduces the need
    for human labor, on the other. 


    Currency


    DeFi and CeFi also stand in contrast in terms of the characteristic flagship assets
    and their nature. For instance, DeFi, as we know, uses cryptocurrencies as all
    the transactions, in this case, occur on a blockchain network in a digital space.
    However, CeFi necessarily uses fiat currency. Thus the transactions occur with
    coins, paper notes, etc.   


    Contract


    In the case of DeFi, the interaction occurs directly between the interested parties,
    and the transactions subsequently take from peer to peer. Intelligent contracts
    support these transactions. In the context of traditional financial services,
    multiple points of contact or intermediaries often impede the smoothness of financial
    services.   


    Custodianship of Funds and Assets'
