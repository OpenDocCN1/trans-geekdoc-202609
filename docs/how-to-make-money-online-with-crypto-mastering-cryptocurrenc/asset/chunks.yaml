  trans: '

    # DeFi 系统：特性与传统金融的对比


    因此，任何个人都可以根据对相关智能合约的审查，就其提供的金融服务做出明智的决定。此外，DeFi 系统透明度的背景也得到了应用于区块链的基本加密法规的支持，这些法规承诺信息仅在经过适当的验证和认证程序后才会被添加。存在于以太坊平台上的
    DeFi 协议要求源代码公开，以供用户审查。在公共以太坊链的情况下，信息会广播给所有用户，从而强化了透明度的前提。


    ## DeFi 的关键特性


    ### 不可篡改性


    DeFi 提供的一个显著优势是金融数据的不可篡改性，这降低了恶意数据篡改的可能性。区块链网络上的数据存储使记录极其安全，减少了文件被未经授权更改的情况。这反过来又降低了欺诈行为在这个金融体系中泛滥的前景。此外，区块链上的智能合约使得条款和条件无法被单方面更改，因为所有相关方都可以查看智能协议的活动记录。DeFi
    的这一显著特性确保了一个高度安全的空间和对话环境，用于交换金融服务。


    ### 可访问性


    正如上一节所述，任何人只需具备加密钱包和互联网连接这两个最低前提条件，即可使用 DeFi 金融系统。这使用户能够遍布全球，享受 DeFi 提供的优势。尽管此类账本本质上是无许可的，但它们可能会引发许多问题，例如欺诈活动的激增或作恶者破坏
    DeFi 建立的金融生态系统。基于此，DeFi 平台上的服务寻求者和提供者有必要通过检查了解你的客户（KYC）要求，有时还包括反洗钱（AML）要求，来验证对方身份。得益于防止不当行为的相关策略，可访问性带来的益处仍大于弊端。


    ### 灵活性与自主权


    DeFi 系统的无许可特性为用户提供了无拘无束的灵活性和自主权。同样这是因为没有监管机构阻碍 DeFi 系统服务的进步、演变及其范围。用户无需遵守外部权威强加给他们的一套既定规则和法规。赋予软件的灵活性（例如智能合约的情况）带来了自主权。一旦相关方达成一致并签订智能协议，智能合约即可自动运行，除了遵守既定条款外，不需要相关方做任何事情。因此，他们可以在不需要外部权威的情况下轻松开展业务，增强了自主性。


    ## DeFi 与传统金融系统的对比


    现在我们了解了 DeFi 系统的特征，让我们将该系统与传统金融方法进行对比，并评估哪个系统具有更显著的优势。


    传统金融系统包括受中心化权威管辖的传统银行和其他金融机构，因此常与中心化金融（CeFi）互换使用。中心化交易所作为 CeFi 的一部分，危及用户资金、数据安全和隐私，因为这些中心化权威同时管理两者。然而，这些中心化交易所允许各种金融服务，如保证金交易、借贷等。此外，CeFi
    能有效提供跨链服务，这与 DeFi 形成鲜明对比。CeFi 考虑多条链以完全控制资金，随后才允许币种交易。此外，它们还具有所有权转移功能，增强了跨链服务的简便性。另外，CeFi
    系统在法币操作方面也提供了灵活性。尽管 CeFi 或传统金融方法有其优势，但 DeFi 系统因其众多优势正在金融界获得主流关注。


    ### 服务监管主体


    传统金融系统的本质在于存在一个中央权威。传统经济体系或 CeFi（中心化金融）在一个统管权威的庇护下运作，该权威制定了构成它的不同组成部分的规则和法规。在
    DeFi 的情况下，正如前几节重申的，智能合约负责金融服务的绝对管理和监管。这些智能合约公开可供任何用户审计。CeFi 不具备这种合约审计功能，因为金融服务的运作需要公开，以供更多个人审查。批评者可能会辩称，公开智能合约会损害相关方的隐私。在此背景下，DeFi
    确保智能合约的公开投影是假名的，这意味着相关方的身份和详细信息不会被涉及。


    此外，在金融机构作为传播金融服务平台的情况下，由于许多具有不同分配责任的人员参与，金融服务的完成往往被延迟。这种繁琐笨重的过程常使金融服务的寻求者望而却步。而在
    DeFi 中，智能合约在几乎无人工干预的情况下确保了服务的稳健性。


    ### 无许可性


    CeFi 和 DeFi 在处理金融服务所需的权限方面也有所不同。正如 DeFi 特性中所述，DeFi 的无许可性质有助于经济活动无需太多努力即可进行。用户可以将其现有钱包连接到
    DeFi 服务平台，并参与所需的金融服务。然而，在 CeFi 的情况下，由于需要 KYC 才能使用服务，流程变得相对较长。


    ### 运营空间


    传统金融系统与 DeFi 之间差异的另一个基本前提是运营平台。大多数传统经济系统需要物理空间才能正常运营。它还需要人力劳动和服务来在物理区域持续提供服务，因此需要花费大量资金来激励人力工作。而
    DeFi 基于分布式账本技术（DLT），并在区块链网络上有效运行。DeFi 的整个运营采用技术和先进的软件栈，一方面消除了对物理空间正式场所的需求，另一方面减少了对人力劳动的需求。


    ### 货币


    在旗舰资产特性及其性质方面，DeFi 和 CeFi 也形成对比。例如，正如我们所知，DeFi 使用加密货币，因为所有交易都发生在数字空间的区块链网络上。然而，CeFi
    必然使用法币。因此交易通过硬币、纸币等进行。


    ### 合约


    在 DeFi 中，交互直接发生在相关方之间，随后交易以点对点方式进行。智能合约支持这些交易。在传统金融服务背景下，多个联系点或中介机构往往阻碍金融服务的顺畅进行。


    ### 资金与资产的托管

    '
