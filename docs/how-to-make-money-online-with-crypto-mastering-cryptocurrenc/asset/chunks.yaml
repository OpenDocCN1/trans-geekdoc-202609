    # DeFi 协议：挑战与局限


    DeFi 协议非常适合确保更多人能够获得金融服务，而不受地理障碍的影响。然而，基于区块链的项目需要提高这些宿主平台的可扩展性。DeFi 面临的问题是交易在确认后处理时间较长。这归因于这些
    DeFi 系统在同一时刻只能处理一定数量的交易。例如，基于 DeFi 的平台以太坊，即使在满负荷运行时，每秒也只能处理约 13 笔交易。与此同时，传统的中心化金融系统可以在同一时段内处理更多交易且不会出错。因此，尽管
    DeFi 在发起交易方面提供了便利，但交易确认仍需经历漫长的等待期。此外，在拥堵时期，交易成本也会增加。


    DeFi 系统的基本前提是引入去中心化，并用去中心化取代以中央权威为阻碍的传统金融方案。这种去中心化提供了透明度、灵活性和可访问性，增强了 DeFi 项目的可信度，并降低了欺诈和丑闻的可能性。然而，尽管有这些主张，并非
    DeFi 系统的所有服务都是去中心化的。例如，这些系统的一个关键用例——稳定币，无论是直接引入中央权威（法币抵押稳定币的情况），还是间接引入（商品抵押稳定币的情况），都引入了中央权威的角色。


    除了上述问题，许多其他问题也困扰着 DeFi 系统。首先，DeFi 系统提供的匿名性往往会增加诈骗和欺诈的几率。由于公共空间向全球所有用户开放，风险因素变得突出。由于
    DeFi 平台不要求用户进行 KYC（了解你的客户），它往往会吸引在论坛上从事不当行为的恶意行为者。尽管 DeFi 使用的验证系统高效、稳健且耗时较少，但它们往往可能具有误导性。由于认证是通过追踪在线行为、交易活动和其他此类实际属性来促进的，这些属性可能被操纵，从而欺骗认证系统。


    其次，在中心化金融中，保险因其在确保客户信任和保护客户免受黑客攻击或欺诈事件导致重大财务损失方面的必要性而受到应有的重视。然而，在 DeFi 的情况下，保险方面很少得到应有的重视，甚至从未被重视。尤其是当用户必须独自承担责任时，这种保险更应有其存在的空间。


    即使 DeFi 没有任何相关风险或问题，所有责任也将落在用户肩上。由于操作的复杂性，总是存在犯错的空间，特别是对于缺乏操作技术经验或刚加入 DeFi 平台的用户。他们因微小失误而导致资金损失的可能性会给他们带来严重的财务问题。因此，DeFi
    领域需要做更多工作，使平台更加用户友好，并创建工具以最大限度地减少潜在人为错误的风险。


    尽管存在风险和局限性，DeFi 仍然蓬勃发展，因为它继续通过其成功且高效的应用为各行各业提供优势。特别是 2020 年之后，由于锁定资产数量的增加，这些系统必须引起重视。DeFi
    的用例也有所增加，这使得该系统获得了更多认可。尽管 DeFi 使用的技术在必要工具方面需要改进以降低相关风险，但凭借其互操作性和创新性等因素，它仍有望在金融世界中占据主导地位。


    # 第 6 章：非同质化代币


    ## 什么是 NFT？


    非同质化代币，或称 NFT，顾名思义，是一种代币，很像比特币或以太币等其他加密代币；然而，关键区别在于它们是非同质化的，意味着它们不能被复制或复制。每个代币本身都是独一无二的。例如，当你购买一种加密货币，如比特币，然后将其兑换为另一个比特币，最终你拥有的还是同一种东西；无法区分你之前持有的比特币和你现在持有的比特币，这意味着它们是同质化的。


    非同质化代币之所以独特，是因为如果你用一个 NFT 兑换另一个价值相似的 NFT，你手中的东西就变得不同了。货币和加密货币的同质化通常有助于我们将它们用作交换媒介，因为所有人都认可该货币所有单位的共同约定价值。另一方面，NFT
    可以比作收藏品，如独特的体育卡或艺术品。


    NFT 使用区块链技术记录交易，通常是以太坊区块链，但也使用其他区块链，它们追踪 NFT 的所有权。NFT 是在这些区块链上使用 `ERC-721` 和 `ERC-1155`
    框架创建的。大多数情况下，NFT 是艺术品，如图像、GIF、视频和音乐。发生的情况是，购买该原始艺术品的人拥有其所有权证明、交易记录，存储在区块链上。既然我们知道区块链拥有不可篡改和永久的数据，交易就无法被更改，从而成为该人拥有该特定资产的铁
    clad 证据。


    大多数事物的价值与其稀缺性成正比。当我们说黄金和钻石昂贵时，是因为它们只以有限数量存在，我们无法创造更多天然黄金或钻石。同样，毕加索、莫奈、班克西或巴斯基亚等人的艺术品在拍卖会和其他销售中具有天价，因为此类作品数量有限。此外，每件作品都与其他作品不同。在区块链技术和
    NFT 出现之前，数字艺术形式不存在这种稀缺性，人们可以搜索一首歌或一张照片，得到成千上万个相同的副本。然而，有了 NFT，数字资产所有权出现了新的稀缺性，从而提高了这些数字资产的价值。


    NFT 作为金融资产运作；它们可以比作实体艺术，只是它们是数字艺术形式。正如实体艺术没有内在价值，大多数人购买它要么是为了拥有该艺术品所有权的炫耀资本，要么是将其作为一种投资，以便在未来以更高价值卖出获利，NFT
    同样要么是为了未来翻转获利而持有，要么是因为持有该数字资产的原始版本。


    然而，需要理解的是，仅仅因为他们拥有 NFT 的所有权，并不意味着其他人无法复制相同的数字艺术。可以把它想象成一幅画，比如文森特·梵高的《星夜》；虽然各种画家制作了多个《星夜》的复制品，甚至作为海报或绘画教具出售；但《星夜》原作的所有权掌握在单个人手中，在这个案例中，是国立博物馆。同样，同样的
    GIF 或图片将在各种网页或搜索引擎上在线提供。但原始艺术掌握在非同质化代币所有者手中。


    '
