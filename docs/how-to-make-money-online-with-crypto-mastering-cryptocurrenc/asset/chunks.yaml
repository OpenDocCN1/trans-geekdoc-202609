    # 比特币历史 (2020-2023)


    ## 2020


    比特币在 4 月回升至 7000 美元，距离其第三次也是最后一次历史性事件——减半仅有一个月。经过三个月的稳定后，比特币在 10 月突破了 10000 美元大关。随后两个月内，当投资者仍在讨论比特币下跌的前景时，它接连跨越了
    12K、14K、16K，最终达到 19K 大关。2020 年，机构投资者和政府部门无疑将从比特币的增长中受益。摩根大通是采用的催化剂。这也成为了 2021
    年加密货币牛市的推动力。


    ## 2021


    始于 2020 年的牛市延续到了 2021 年，专家和粉丝们为主流加密货币发布了诱人的价格预测。埃隆·马斯克在年初的支持加快了步伐。围绕比特币的所有乐观情绪推动其达到新高，并积极影响了几乎所有的山寨币。


    然而，5 月出现了一个障碍，当时埃隆·马斯克改变立场，表示特斯拉将不再接受比特币，因为这会危害环境。雪上加霜的是，5 月中国对加密货币挖矿进行了一系列打击行动，而中国拥有世界上大部分的加密货币挖矿。这影响了几乎所有加密货币，似乎所谓的泡沫已经破裂。


    在地球另一端，远离中国的地方，2021 年将被铭记为另一个南美国家首次正式接受比特币。在国会收到总统纳伊布·布克莱拥抱加密货币并取消所有相关资本利得税的请求后，萨尔瓦多承认比特币为法定货币。此外，总统承诺利用该国的地热能源，指示一家国有公用事业公司建设利用火山能量进行比特币挖矿的地热设施。2021
    年 BTC 的最高价达到 68000 美元，这是 2021 年 10 月达到的另一个历史新高，但年底收盘价低于 40000 美元。


    ## 2022


    当我们从 2021 年进入 2022 年，通货膨胀、能源危机以及因俄罗斯对乌克兰的侵略引发的地缘政治动荡，降低了 BTC 和其他主要加密货币的价值。迎接 2022
    年加密寒冬和比特币价值的波动吧。从 2022 年 1 月到 5 月，比特币价格暴跌。5 月，BTC 自 2021 年 7 月以来首次跌破 30000 美元。加密寒冬的定义不如熊市明确。像熊市一样，这一时期加密货币市场稳步下跌，有时甚至急剧下跌。加密货币在第二季度下跌。像
    TerraUSD 和 Terra Luna 这样的稳定币导致了加密货币价格下跌。随着加密货币对冲基金三箭资本违约比特币贷款，并被英属维尔京群岛法院下令清算，比特币交易价格在
    20700 美元左右。2022 年 11 月，主要加密货币交易所 FTX 意外崩溃，进一步打压了加密货币价值。在其 CEO 萨姆·班克曼-弗里德被指控挪用资金后，该公司破产了。FTX
    的财务困难和可能的欺诈阻止了币安对其进行救助。


    FTX 的震惊性崩溃在金融行业引发了震波，在加密货币市场产生了多米诺骨牌效应，让投资者感到不安。对通货膨胀的担忧和利率上升影响了市场。随着 2022 年结束，比特币价格跌破
    20000 美元，表明加密货币市场的健康状况。


    ## 2023


    上半年 BTC 在 2 万美元区间徘徊。我们现在正经历比特币价值逐渐而充满希望的上涨，撰写本章时已达到约 30000 美元，点燃了一丝加密寒冬终于结束的希望。第一季度其他加密货币也跟随类似的价格趋势。


    随着 5 月底临近，体验比特币挖矿的新高度。近期矿工兴趣的激增引起了交易者的关注，他们将其视为一个极好的看涨信号。虽然通货膨胀仍是更广泛市场的担忧，但人们越来越乐观地认为美联储实施的措施可能会导致软着陆。


    # 第 2 章：比特币现象


    ## 比特币诞生的故事


    2008 年 11 月 1 日，一个名为中本聪的匿名实体在给密码学邮件列表的一封电子邮件中，附带了一份九页的白皮书，其中首次提到了比特币，称其为“点对点电子现金系统”。


    “我一直在研究一个新的电子现金系统，它是完全点对点的，不需要受信任的第三方。论文可在 `Bitcoin.org/Bitcoin.pdf` 获取。”中本聪说道。详细描述比特币数学和细节的原始论文至今仍可在该网站上找到。


    正如中本聪所提议的，该系统的主要特性在于电子交易将是点对点的，且不需要涉及金融机构。计划是完全去中心化的，这意味着货币用户不需要将信任寄托在中央权威机构上，例如传统的中央银行。


    中本聪还表示不满，银行通过在信贷泡沫中放贷同时保持最低准备金，反复背叛了存款人的信任。“传统货币的根本问题在于使其运作所需的所有信任。中央银行必须被信任不贬值货币，但法定货币的历史充满了对这种信任的背叛，”中本聪写道。


    发表革命性论文后，中本聪发布了比特币的第一个软件版本，并与在线开发者和编码者合作对其进行改进。


    2009 年 1 月 3 日，首批代码行被发布到比特币区块链上，这距离原始白皮书问世仅几个月。这些被称为“创世区块”的代码行，归功于被称为中本聪的个人或团体。


    1 月 12 日，中本聪向哈尔·芬尼发送了十个比特币，诞生了一种新的金融反文化，将动力从银行夺回到人民手中。此时，比特币的货币价值微乎其微。最初，用户在论坛上因发表好评而互相用比特币奖励。第一笔“真实”交易发生在
    2010 年 5 月 22 日，拉斯洛·汉耶茨著名地用 10000 个比特币买了两个披萨，当时价值约 30 美元。按当前价格，这笔交易将价值超过 3800
    万美元。


    中本聪与其他开发者之间的协作环境持续到 2011 年，当时中本聪毫无预警地消失了，或者说他真的消失了？


    人们多次试图发现中本聪的真实身份，但每个被提出的名字最终都被证明不是创造者。然而，关于创造者的细节，如国籍和出身的模糊性，使该货币值得信任且不存在任何固有偏见。比特币诞生于
    2008 年金融危机的余波之中，这场危机显然是导致其诞生的一个激励因素。


    世界各地的许多银行和其他金融机构倒闭，不得不由政府动用纳税人的钱进行救助。这凸显了现代金融体系的脆弱性，货币体系的健康严重依赖于银行和其他金融机构。我们被迫信任这些机构能明智审慎地处理我们交给他们的钱。但往往他们未能充分履行这一基本责任。


    在其历史的大部分时间里，比特币与三个重叠的社区相关联：早期投资者的小圈子、区块链技术爱好者，以及仅仅为了从这种新金融工具中赚钱的投机者。

    '
