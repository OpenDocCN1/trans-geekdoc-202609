    # DeFi 应用与考量


    ## 合成资产


    合成资产可以理解为代币化衍生品，其价值和功能与另一种资产非常相似，但与该资产没有任何实际的物理关系。这些加密资产代表法币、黄金等其他类型的资产。这些合成资产可以轻松地在具有预定规则、法规和协议的智能合约中被代币用作抵押品。通过一个允许用户策划和交易定制化合成资产版本的平台的例子，可以加深对合成资产的理解。Synthetix
    平台支持黄金、法币、大宗商品等各类资产合成版本的交换。


    ## 高效交易实践


    DeFi 生态系统包含许多交易活动，从交换合成资产到交换代币和保证金交易。DeFi 赋予交易行业的优势是降低了发起交易对经纪人的依赖。加密货币交易者也享受
    DEX（去中心化交易所）带来的好处，因为其手续费降低、交易快速，且资产由所有者绝对托管。


    ## 基于区块链的在线市场


    DeFi 为连接有意向买卖双方的市场的激增提供了数字空间。这些市场的范围和规模也在不断扩大。这些数字市场消除了对中介和经纪人的需求。这使得许多商品的卖家能够接触到
    DeFi 平台的全球用户群，而无需在亚马逊等零售经纪平台上架。在线市场的很大一部分由 DeFi 协议支持，通过去中心化交易实现产品和服务的交换。如上所述，由于
    DeFi 相关技术的进步，这些市场的范围正在扩大。这也归因于 DeFi 应用和优势的不断增加。这些应用涵盖了成熟的零售产品（如服装）到新的商业模式（如自由职业零工平台）。例如，Freelancer
    和 Upwork 等自由职业零工中心正面临来自 Anytask 等基于区块链构建的平台的竞争。Anytask 这一区块链平台带来的优势在于，与 Freelancer
    和 Upwork 不同，它不向服务销售者收取任何访问其论坛零工的费用。


    如上所述，DeFi 在借贷、资产管理、保险、稳定币、KYT 机制支持的合规、交易、无损游戏系统等各种场景中都有应用。尽管我们试图涵盖大多数 DeFi 用例，但仍有许多用例未在上述部分中提及。DeFi
    作为一个相对较新的系统，其动态和在不同领域的应用在不断演变。随着这种不断演变的特性，应用范围随着其扩散而不断变化并新增。尽管如此，在叙述中涵盖用例的目的是为了突出
    DeFi 的应用，并让读者了解 DeFi 正变得多么普及，将一个又一个行业纳入其麾下。


    ## DeFi 的重要考量因素


    尽管 DeFi 系统因金融与区块链网络在 DLT（分布式账本技术）上的融合而提供了大量有利特性，但它仍然充满了用户在涉足 DeFi 生态系统之前应了解的许多风险和局限性。随着应用行业的增加，DeFi
    也成为了这些平台上网络犯罪分子的温床。CipherTrace（一家从事加密货币分析的公司）发布的报告揭示了令人震惊的加密货币犯罪数字。根据该报告，仅 2020
    年 DeFi 盗窃案造成的损失就约为 1 亿美元。2020 年下半年，约一半的加密货币盗窃案源于 DeFi 协议。这些惊人的数字表明了与 DeFi 相关的风险。除了这些风险，该系统还有许多缺点，将在下文中解释。


    在详述该系统的缺点之前，有必要注意几点。首先，DeFi 缺点的主要部分源于其构建所基于的技术。底层技术的挑战反过来又将 DeFi 的次要缺点推向了深远的影响。如果
    DeFi 应用所构建的区块链网络或技术存在不稳定性问题。如果它们所构建的基础技术是稳定的，随后开发的协议也将是安全的。此外，如果用户了解这些风险，一些与 DeFi
    相关的风险可以被缓解和管理。


    ### 智能合约引发的风险


    第一个也是最主要的缺点源于该系统的核心组件：智能合约。尽管智能合约简化了金融服务交换流程，确保了高可靠性，但仍存在一些技术局限性。智能合约在创建之初由人类掌控，因为代码行是在公开上传到区块链之前由个人编写的。这引入了人为错误的可能性。无论智能合约多么严格，它仍可能存在许多漏洞。这些智能合约在公共区块链上的公开性，让无数双眼睛有机会审查合约以寻找细微的漏洞。虽然智能合约仅由少数人达成，但它可供访问它的全球数据库进行审计。这种机制为利用智能合约中存在的漏洞提供了机会。即使是单个漏洞也可能被滥用，从智能合约中窃取数百万资金。


    由于智能合约在公共区块链上可用，潜在投资者可以自行审查，或通常将审查外包给安全公司进行审计。这揭示了因人为错误导致损失的第二种可能性。人类可能会忽略合约中的漏洞，这随后会导致未来的利用和最终的财务损失。


    例如，去中心化自治组织（DAO）构建在开源代码之上，允许绝对自治并强化去中心化。它于 2016 年 4 月推出，是一个由投资者主导的风险投资基金。它经历了指数级增长，这很快使该平台成为最重要的众筹项目之一，筹集了约
    1.2 亿美元。然而，到 2016 年 6 月，一群黑客出现了，他们发现了智能合约中的一些缺陷和漏洞。这些漏洞帮助黑客窃取了约 5000 万美元。被窃取的金额导致投资者数周无法访问其资金。这成为了众筹历史上最大的黑客攻击事件。


    正在采取努力防止智能合约被利用。例如，Nexus Mutual 是一个专注于构建去中心化保险各方面的团队，旨在帮助确保用户在面对这些系统上的网络犯罪分子的诈骗和欺诈时，其利益和安全得到保障。


    ### 黑客攻击与欺诈


    欺诈的激增往往以一种起初不易察觉、事后才曝光的方式发生。有报告称 Kyber Network、Uniswap 等 DeFi 平台上发生了资金洗钱事件。正如前几节所述，欺诈发生的另一个来源是通过识别区块链网络上可用的智能合约漏洞进行黑客攻击。此类活动给
    DeFi 平台上的资金安全蒙上阴影，引发了关于信任度的担忧。一方面这可能导致用户资金损失，另一方面也阻碍了潜在用户从传统金融系统转向 DeFi。


    ### 宿主平台的可扩展性问题

