    # 加密货币投资指南


    ## 关键评估标准


    - 应关注代币的总市值，且无法获取其供应量和流通量。这有助于你了解加密货币的规模，并暗示其可能提供的稳定性。

    - 加密货币价格的剧烈波动通常不是好兆头。应避免仅因某个人或公司的背书而上涨的代币。

    - 在购买加密货币前，研究发行该加密货币的个人和公司至关重要。公司的业务类型以及个人的声誉都可能影响代币的未来价值。

    - 白皮书是前进的计划。每个代币都会创建白皮书，其中包含该特定加密货币的目的及其愿景。投资者应查阅白皮书，并将已实现的成果与承诺的目标进行对比。

    - **技术**：加密货币所基于的底层技术也至关重要；拥有更光明未来的颠覆性技术能为代币提供更好的价值，例如以太坊开创的创新智能合约技术。


    ## 投资组合多元化


    此外，必须理解仅投资单一加密货币并非最明智的决定。因此，有必要根据你的需求和它们为投资者提供的价值，构建一个包含多种加密货币的投资组合。理想情况下，投资者应在风险较高但高收益的代币与稳定但低收益的代币之间保持健康的平衡。初期，将投资组合更多地倾向于更安全的选择被认为是更好的选项。随着经验的积累，可以开始投资风险较高的代币。


    ### 投资组合配置板块


    一个良好的投资组合应包含以下板块：


    - **价值存储**：比特币、以太坊

    - **数字货币**：莱特币、XRP、XLM、达世币等。

    - **分布式应用**：波卡、卡尔达诺、波场、Waves 等。

    - **新技术**：ADA、Tezos、Nano

    - **隐私币**：门罗币、Verge 等。

    - **交易所代币**：BNB、Uniswap 等。

    - **稳定币**：泰达币、DAI、USDC


    上述板块的健康组合将为投资者提供极佳的风险收益比，适合长期投资。


    ## 交易平台


    有多个地方可以管理和追踪你的数字钱包，但请体验 Coinigy ([`www.coinigy.com/`](https://www.coinigy.com/))
    带来的无与伦比的交易体验。市场上最受欢迎的交易平台。自 2014 年成立以来，他们经历了稳步增长。体验跨 45+ 家交易所的无缝交易，享受一流的支持和高级交易图表。拥有
    45+ 家交易所的接入，Coinigy 用户比不使用该平台的人拥有明显优势。


    ## 图表工具


    除了 CoinMarketCap，你还应花些时间研究其他工具，如 TradingView ([`www.tradingview.com`](https://www.tradingview.com))。体验利用图表工具可视化交易指标和市场趋势的强大功能。绘制趋势线，以前所未有的方式获得宝贵的市场洞察。提升你的
    `TA`（技术分析）技能，通过磨练这些交易指标和趋势线的专业知识，保持领先优势。在尖端加密分析工具的帮助下，最大化你作为 `TA` 专家的收益——体验 TradingView
    提供的加密货币和股票实时交易图表，该公司是行业领军企业。发现行业最大图表提供商之一无与伦比的专业知识。凭借广泛的技术指标，你将拥有做出明智决策所需的一切。解锁一个提供免费和高级功能的多功能平台的无限可能。发现顶级交易员首选的加密货币图表工具：TradingView。


    ## 市场数据


    发现查看最新币价、成交量和供应量的终极首选平台——CoinMarketCap ([`coinmarketcap.com`](https://coinmarketcap.com))。加入数百万信任这个市场领先网站满足其所有加密货币需求的用户行列。此外，他们的
    `API` 高度可靠，可无缝集成到你的用户界面以检索数据。通过了解市场视角获得竞争优势。


    通过 Messari 的独家统计数据 ([`messari.io`](https://messari.io)) 发现超越 CoinMarketCap 的海量数据。通过创新平台发现加密货币市场的最新趋势。探索全面的币种选择，包括被归类为骗局、涨幅榜首和跌幅榜首的代币。此外，获得预测
    2050 年未来市值的高级市场分析工具的独家访问权限。创建适合你独特需求的个性化仪表盘！发现为什么该网站迅速成为获取可靠市场数据的首选目的地。


    ## 日历工具


    了解如何通过 CoinMarketCal——终极加密交易工具 ([`coinmarketcal.com`](https://coinmarketcal.com))“买入谣言，卖出新闻”。加入依靠这个强大平台最大化利润的成功交易者行列。通过一个展示各类代币所有即将到来事件的卓越日历，发现加密货币世界的最新动态。发现搜索你专属代币的力量！利用市场投机的力量最大化你的利润。使用该平台轻松实现“买入谣言，卖出新闻”。


    ## 下单


    投资者决定想要投资的加密货币组合后，下一步就是在加密货币交易所为该代币下单。然而，你必须先有资金才能下单。根据平台不同，加密货币交易所或持有方将允许你通过银行卡、电汇或
    PayPal 向账户转账。


    在某些情况下，你需要使用其他加密货币进行购买，此时你必须将它们存入你的账户。有时资金入账需要一段时间，所以你必须等待才能购买你选择的加密货币。


    一旦投资者账户中有了资金，就可以下单。下单时，用户必须通过点击其代码（取决于用户界面）来选择代币，例如比特币的 `BTC`，然后选择他们想要购买的数量。大多数加密货币交易所甚至允许你购买一小部分加密货币，例如比特币，因为整枚购买太贵。完成此操作后，加密货币将存入持有者的账户，相应的资金将被扣除。交易所和经纪商会根据交易量对每笔交易收取佣金或费用。


    ## 存储你的加密投资


    最后一步是安全地存储你购买的加密货币，因为它是一项宝贵的投资。由于大多数交易所为代币提供的保护不多，它们极易受到黑客攻击和盗窃。过去曾发生过价值数百万美元的加密货币被盗案件。


    为此，需要将加密投资存储在加密钱包中。加密钱包可以是不同类型，如关联交易所的钱包、软件钱包、硬件钱包、冷钱包和热钱包。根据需求，可以选择想要的钱包类型，因为不同钱包具有不同的功能、安全性和成本。


