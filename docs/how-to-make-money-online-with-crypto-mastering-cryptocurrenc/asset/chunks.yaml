    game, the players are given actual ownership of their cards which are tradeable
    NFTs. These cards, when sold, provide the players with cryptocurrencies and real
    value. The value of the cards depends on the rarity of these cards, with some
    costing upwards of ten thousand dollars. The game was created by Immutable, a
    development studio based in Australia specializing in blockchain games.


    Differences Between NFTs and Typical Cryptocurrencies


    Before we look at how non-fungible tokens differ from the otherwise mainstream
    or typical cryptocurrencies such as Bitcoin, Ether, or Cardano, we must first
    understand their similarities and what connects them. NFTs and cryptocurrencies
    are, in essence, digital assets that can be sold or purchased on online platforms
    with little to no inherent or intrinsic value. Both NFTs and cryptocurrencies
    are based on blockchain or distributed ledger technologies. The transaction history
    in both cases is stored on blockchains and is permanent and immutable. NFTs, much
    like cryptocurrencies, are also in a grey area when it comes to regulation in
    most countries.


    Nature: The first point of difference that we see between NFTs and cryptocurrencies
    is their essential nature. When we talk about cryptocurrencies, we consider them,
    as the name suggests, as currencies, i.e., they are to be used as tools or money-like
    instruments that will be used for purchasing other things or assets. However,
    in some places and by some people, they are treated as investments that might
    grow in value and then be sold off. On the other hand, when we talk about NFTs,
    as earlier discussed, they are not currencies despite being tokens. NFTs are like
    assets in nature. They are not to be used for purchasing other stuff but rather
    as collectibles. While cryptocurrencies can be compared to money in real life,
    NFTs can be compared to works of Art and Luxury.  


    Fungibility: The most crucial characteristic of NFTs that differentiates them
    from typical cryptocurrencies is the one that is in their name, i.e., fungibility.
    Fungibility is the ability of similar goods or assets to be interchangeable or
    replaced by an identical item. Fungibility is an essential feature of currency.
    It ensures that people can freely use cash anywhere, and there is no difference
    between one unit of money with another. Cryptocurrencies like fiat currencies
    are fungible. If you trade one ether for another, there is no difference between
    the two; you essentially have the same thing in hand. On the other hand, NFTs
    are not fungible; each one is unique and thus cannot be copied. If you exchange
    one NFT for another, you have something different now than you had earlier.


    Value determinant: The way NFTs are determined is also different from how the
    value of cryptocurrencies is determined. Since cryptocurrencies have a very high
    volume of sales and exchange hands very frequently, thus the price of the cryptocurrencies
    is determined by the prevailing market forces, i.e., demand and supply. NFTs are
    unique, and each carries a different value; further, the price of the NFT is determined
    by what the buyer is willing to pay for the said product. In the case of NFTs,
    the market''s supply side is constant. '
