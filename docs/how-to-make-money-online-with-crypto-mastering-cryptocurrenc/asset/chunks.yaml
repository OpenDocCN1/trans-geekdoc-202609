    In total, 10,000 crypto punks were created by Larva Labs. Of these 10,000 crypto
    punks, 6039 are male, 3840 are female, 88 are zombies, 24 are apes, and 9 are
    aliens. Each of these crypto punks is unique and thus carries its value. The price
    of the crypto punk depends on the rarity; with the nine alien crypto punks being
    the rarest, they have been purchased at the highest prices till now.


    Crypto punks regularly feature on the list of most expensive NFTs sold, with CryptoPunks
    #7804 selling for 7.6 million dollars, CryptoPunks #6965 selling for 1.6 million
    dollars, and CryptoPunks #4156 selling for 1.3 million dollars. Even mainstream
    companies have started purchasing punks, with Visa shelling out almost 176,000
    dollars on a crypto punk in July 2021.


    Rare Pepes: Rare pipes were the first NFTs that were offered on the platform known
    as counterparty. Pepes are images of green-colored frogs that are edited in various
    ways. The Pepe images of different kinds have been converted to NFTs and then
    sold to the highest bidder. The ‘rarest’ of pipes, a picture of Homer Pepe, i.e.,
    the famous TV character of Homer Simpson, edited to look like a Pepe, was brought
    for a price of 320,000 dollars in March 2021


    Everyday: The first 5000 days and other Beeple arts: The first 5000 days are the
