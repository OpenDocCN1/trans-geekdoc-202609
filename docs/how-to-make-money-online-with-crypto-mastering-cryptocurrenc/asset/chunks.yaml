- raw: 'Binance has a market cap of more than $56 billion and ranks among the top
    cryptos in terms of market cap. Binance''s story started with an Initial Coin
    Offering (ICO) and has grown into one of the largest global cryptocurrency exchanges
    in terms of volume traded and market share by web traffic. 


    Cardano ($12 billion)


    Charles Hoskinson founded Cardano in 2017, two years after he helped develop the
    Ethereum blockchain technology. He also co-founded Internet Online Hong Kong (IOHK),
    the company that built the Cardano blockchain. 


    Cardano uses a timestamping methodology called Proof of Stake (PoS). PoS is the
    system by which the miners in the Cardano ecosystem validate and may block transactions.
    A stake is simply the number of coins (ADA coins) one holds, which also determines
    one''s participation in creating new blocks.


    Using knowledge gained from developing the Ethereum project, Hoskinson injected
    the idea of smart contracts into the Cardano project. Cardano sets itself apart
    in the crypto-verse in that it was conceived through peer-reviewed research. The
    research yielded unique features like unparalleled platform security, system sustainability,
    and a robust professional development community. 


    According to the project''s website, IOHK created the Cardano blockchain to "restore
    trust to global systems" by availing a new standard in inclusive and open-source
    technology. Therefore, "changemakers, innovators, and visionaries" can leverage
    the technology to create a society that is "more secure, transparent, and fair."


    ADA is the digital currency facilitating transactions among Cardano network participants.
    ADA ranks among the top ten tokens in terms of market cap. It enables peer-to-peer
    transactions in a decentralized, secure environment free from intermediaries.
    For this reason, transactions over the Cardano blockchain are fast and inexpensive.


    Cardano''s cryptocurrency claims to have legitimate advantages over fiat currency.
    The Cardano Foundation adopted a limit of ADA''s total supply at 45 billion coins.
    The idea is to avoid inflation and keep the coin''s value in check. ADA is far
    better than a fiat currency in terms of transaction speed by peer-to-peer transactions.
    Fiat currencies require intermediaries like banks to enforce trust, leading to
    bottlenecks along the transaction chain. 


    XRP ($30 billion)


    Ripple is a cryptocurrency token equivalent to digital cash, purpose-built for
    payment networks and banks. XRP or Ripple is a native token on its Blockchain
    known as RippleNet. RippleNet is a payments system run by Ripple Labs and built
    on the XRP Ledger, decentralized and open-source blockchain technology. It boasts
    breakneck transaction speeds with an average transaction settlement speed of four
    seconds. Comparably, the transaction settlement time on the Bitcoin network is
    3,600 seconds. 


    One of the areas where Ripple had an immediate impact was cross-border payments.
    The developers created RippleNet to streamline transactions. Consumers and businesses
    often suffer the inconveniences of converting between currencies and losses arising
    from exchange rate differences when transacting in fiat currency. RippleNet uses
    the XRP token as an intermediary to streamline fiat currency exchange without
    suffering slippage. 


    Moreover, digital currency facilitates faster settlement of transactions at speeds
    unseen in the traditional payments sectors. Due to the utilization of the peer-to-peer
    transaction system, users enjoy micro-fees where the average fee is less than
    $0.0003403. RippleNet''s competitors in the conventional payments sector, such
    as VISA, charge thousands of times higher for an equivalent transaction. 


    Ripple draws its strength from blockchain technology. Most blockchain platforms
    obtain consensus through Proof of Work (PoW) or Proof of Stake (PoS) mechanisms.
    The PoW system is slower and consumes more power, unlike the PoS system, which
    supports faster validation and approval of transactions while consuming less power.


    However, blockchain platforms like XRP Ledger utilize another form of consensus,
    in this case, called the Ripple Protocol Consensus Algorithm (RPCA). Peace is
    how nodes in a blockchain network maintain agreement and correctness with each
    other. RPCA runs through the more than 150 nodes that make up the global XRP Community. 


    The robust consensus system is a significant reason behind Ripple''s seven years
    of stability, enabling its developers to expand the product range of the ecosystem.
    For example, the developers have expanded RippleNet''s capacity to offer on-demand
    liquidity to its enterprise clients. This makes global payments faster and cheaper. 


    Promising Altcoins


    Some altcoins have immense potential to dominate future markets. We will now look
    at such altcoins whose market cap has been gradually increasing over the years.


    Basic Attention Token (BAT) is a utility token built on the Ethereum blockchain,
    which is the foundation for the Brave web browser platform. The Brave browser
    allows users to browse the internet anonymously and completely ad-free and then
    enables users to opt-in to watch ads in exchange for BAT tokens.


    Publishers also get BAT when users watch or click on ads on their sites. Advertisers
    benefit from lower overhead costs for advertising and higher engagement from users.
    And users get increased privacy without sacrificing the benefits of tailored advertisements
    and can get BAT tokens. The BAT token is designed to be exchanged between users,
    advertisers, and publishers. It is based on the concept of user attention, which
    is critical to advertising companies operating in the digital age. BAT is an ERC-20
    token secured by a rigorously tested proof-of-work consensus algorithm supported
    by an extensive Ethereum miner network. This algorithm ensures that only valid
    transactions are confirmed, while the combined work of the Ethereum mining network
    ensures BAT transactions are irreversible once approved.


    The developers of BAT seek to improve how advertising is done in the digital space.
    They see the current system as disadvantageous for users, publishers, and advertisers.
    Users are relentlessly targeted with ads and trackers, and they are subjected
    to malware that is becoming increasingly aggressive and powerful.


    Conventional publishers have seen their ad revenues decline dramatically as monopoly
    platforms like Google and Facebook drive down the price of information while taking
    a hefty cut from the advertising revenue. In addition, bots and malware can inflict
    increasing damage each year, and platforms have suffered credibility issues. Moreover,
    advertisers need more accurate targeting methods and information to deliver their
    content sufficiently because platforms monopolize these functions.


    The creators of BAT believe that tracking how users interact with digital advertising
    content and storing that information in a distributed blockchain ledger will enhance
    and improve the digital advertising experience for advertisers, publishers, and
    users. Users will experience fewer ads and content that is better tailored to
    them, while Publishers will find new sources of revenue. And advertisers will
    be able to target particular users better based on documented user content preferences
    and interests. They will also be able to avoid fraud more efficiently.


    Basic Attention Token has a maximum total supply capped at 1.5 billion tokens.
    Almost all of this supply is currently in circulation. Hence, the Basic Attention
    Token can be considered almost entirely liquidated.


    In its 2017 ICO, 1 billion BAT tokens were sold to investors, the remaining 200
    million coins were locked in a development pool, and 300 million BAT was reserved
    for the user growth pool (UGP). As of November 2020, the development pool and
    UGP pool addresses are almost empty. Basic Attention Token can be bought and sold
    on every central cryptocurrency exchange platform and has excellent liquidity.'
