- raw: 'Hashed Health is one of the most popular blockchain companies working in the
    health sector. It aims to provide distributed ledgers of records of patients and
    physicians. One of their projects will allow physicians to produce their licenses
    showing where they are allowed to practice. They are partnering with healthcare
    firms to provide distributed ledgers for improved transparency.


    Follow My Vote is a decentralized application platform that, as the name suggests,
    has been set up to follow the voice of every voter in a constituency; this provides
    transparency in the voting process and, at the same time, avoids voter fraud.
    It can offer services in all kinds of votes, within an organization, in the collegiate
    system, or even on a larger scale. 


    Open Bazaar is an e-commerce platform based on blockchain technology. Unlike any
    other e-commerce platform, it acts as a peer-to-peer platform where one can sell
    anything they wish to sell and pay no fees as there is no central authority. The
    payments are made through cryptocurrencies, and transactions are recorded on blockchains.
    These purchases could be for anything ranging from art to everyday products. 


    Consensys is a blockchain software engineering company that provides end-to-end
    solutions to companies regarding blockchain technology. It has recently teamed
    up with Microsoft and Moët Hennesy Louis Vuitton to create blockchain software
    that will help them trace the luxury products produced by the company and its
    subsidiaries and provide for their authenticity. It also allows the customers
    to trace their products from design to purchase. 


    How to choose a Blockchain? (For business owners)


    Depending on the needs of a business or an organization, they may choose the blockchain.
    The decision to select the correct blockchain is dependent on the following factors:


    Adaptability: The first factor when adopting blockchain technology to your business
    is checking whether the blockchain is applicable in your field. Blockchain requires
    information on servers that are open to everyone, so it might not be suitable
    for dealing with sensitive data. Further, blockchain is not a cheap technology,
    at least not yet. Hiring blockchain specialists is expensive and might not be
    possible for smaller-scale firms.


    Scalability refers to the number of transactions handled on a single blockchain
    platform. If the business requires a large number of transactions, then it may
    choose a platform accordingly. While some platforms, such as Bitcoin, offer TPS
    (Transactions per Seconds) of only about 7 TPS, others, like Stellar, can go up
    to almost 1000 TPS. The scalability of a blockchain is measured on three factors:
    speed, security, and decentralization.


    New vs. Existing: Organisations can decide that their needs require the use of
    blockchain technologies; they then have to choose whether they want to use an
    already existing blockchain platform or if they want to create their platform.
    Developing a new platform can be slightly more costly and time-consuming; however,
    it would be more personalized to the requirements.


    Public vs. Private: There are two significant kinds of blockchain platforms, either
    private or public. Both public and private networks have advantages and disadvantages;
    while public networks are more secure, they are slightly slower. Private networks
    have fewer nodes, so they process transactions much faster, but they need to be
    more secure since it is easier for hackers to access fewer nodes.


    Security: Security is of great concern when considering the blockchain platform,
    especially for firms dealing with sensitive information. One should look at the
    peer reviews of the forum they are choosing.


    # Chapter 8: Investing in Cryptocurrencies


    The cryptocurrency market has been relatively shorter than other traditional markets.
    However, it has expanded widely. This is solely because of the features cryptocurrencies
    have to offer. Bitcoin and every other cryptocurrency are known for their high
    volatility, giving massive gain opportunities for investors if they can digest
    the risk.


    Cryptocurrency is an online market, and several digital platforms have simplified
    people to invest in this market. However, comparatively, it is much more complicated
    than acquiring traditional currencies. If you’re new to this domain and willing
    to invest in cryptos, here’s everything you need to know.


    Cryptocurrency and Investing - The Basics


    There are thousands of cryptocurrencies present market, and figuring out where
