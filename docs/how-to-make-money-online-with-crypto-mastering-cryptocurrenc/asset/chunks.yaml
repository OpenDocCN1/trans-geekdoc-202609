- raw: 'When a person purchases art using an NFT, the artist or the original owner
    encrypts digital information and metadata onto the blockchain. This data is used
    to prove the ownership of the NFT. Further, since blockchains have timestamps,
    one could even trace back the right of the digital asset to see when and how many
    times it has changed hands over time. 


    NFTs can be traded like any other digital assets; there are markets for NFTs where
    one can go and purchase the token they like. Any fixed market force does not set
    the price for NFTs; much like art, their price is determined by what the buyer
    is willing to pay for the asset. NFTs can even be programmed so that the owner
    is paid a certain amount every time the NFT changes hands, so in case the price
    of the NFT skyrockets, the original owner is still compensated. NFTs use distributed
    ledger technology such as blockchain, which means there is no need for an intermediary
    or an exchange for the transfer of NFTs, bringing down the transaction costs.


    NFTs have little to no regulations in the global markets, and their future is
    very much connected with cryptocurrencies and blockchain technology. For example,
    if cryptocurrency trade is banned in a particular country, then the sale and purchase
    of NFTs will also be restricted there.  


    While NFTs have become increasingly popular, their criticisms have also increased.
    One of the significant criticism associated with NFTs is their carbon footprint.
    The world is currently dealing with a climatic disaster partly fuelled by using
    non-renewable and polluting energy sources. We know that blockchain is a very
    energy-intensive industry. It takes electricity to run the servers responsible
    for mining on the blockchains. NFTs, to be created also need similar mining requirements,
    causing pollution and climate change. Some artists have pulled out of making their
    NFTs after getting to know about the environmental impact of NFTs.


    Properties of Non-fungible Tokens


    Non-fungible tokens have certain features which help it function the way it does.
    Some of these features are:


    Unique: Every NFT is unique, i.e., an NFT cannot be copied. Unlike other cryptocurrencies,
    one NFT does not equate to another NFT, even if they are of the same value. If
    one trades NFTs, they have something different in their hand and not just a separate
    copy of the same thing. 


    Indivisible: NFTs are also indivisible, which means that NFTs cannot be broken
    down into smaller parts of lesser value and then sold, collected again, and reassembled.
    An NFT is always traded as a whole. 


    Indestructible: The data for an NFT is stored on blockchains. Most of the NFTs
    are stored on the Ethereum blockchain. Since we know that the data on blockchains
    are tough to destroy or alter, especially on public blockchains, the NFTs cannot
    be destroyed. 


    Absolute ownership: When a person owns an NFT, they carry total ownership over
    the digital asset; it is not like purchasing the license to use a particular image,
    song, or gif. This means that the owner has unrestricted access to these NFTs.


    Verifiable: Since the data regarding the ownership of an NFT is stored on blockchains
    and such data is always timestamped and, at the same time, assured of authenticity,
    it is easy to verify and trace the ownership of an NFT. 


    Limited: NFTs are limited in number; they are scarce. Most NFTs are only produced
    singularly; however, an artist may have a limited number of similar products,
    such as 10 or 50, much like little edition clothes or cars by real-life manufacturers.


    Transferable: NFTs are digital assets or certificates that pronounce the ownership
    of digital assets; hence like any other digital asset, NFTs can be transferred
    from one person to another for a price.


    Permanent: The data stored on blockchains are endless; once entered, it is always
    there. Unlike real-life paintings or art forms that might get spoilt over time,
    the NFTs will be permanent.


    History of Non-fungible Tokens


    The idea behind non-fungible tokens started with something called “colored coins”
    in 2012, which were being offered on the Bitcoin blockchain. These colored coins
    denote the real-life ownership of cars, metals, real estate, etc.


    Non-fungible Tokens were first minted in the year 2014 by Kevin Mckoy. He coined
    the first non-fungible token called “quantum” before using NFTs extensively in
    crypto art. Quantum is a pixelated image of an octagonal object that changes shapes
    and colors.


    The NFTs started catching public attention after the introduction of CryptoKitties
    on the Ethereum blockchain and that of crypto punks. Crypto kitties are non-fungible
    tokens depicting cats, each with unique age, size, and color features. It means
    that none of the cats are the same; they are thus traded as collectibles among
    people, much like sports cards or Pokémon cards in real life. Cryptopunks, conversely,
    are avatars or profile pictures that have been converted into NFTs, which people
    can use for various social media platforms. Again, each cyberpunk avatar differs
    from the others and has its value. The NFTs were growing in the crypto community,
    but they entered a mainstream boom in 2021.


    The NFT Revolution in 2021


    In the year 2021, the interest in NFTs ballooned to unprecedented heights. While
    this was in line with the bull market that saw the prices of cryptocurrencies
    such as Bitcoin, Ethereum, and even dogecoin during the first quarter of the year,
    it was observed that despite the fall in the prices of these cryptocurrencies
    from their peaks in the second quarter of the year there was continued growth
    in the sale and purchase of non-fungible tokens during the same period. 


    The NFT market has grown by leaps and bounds in 2021. In the first half of 2021,
    compared to the 13.7 million dollars in sales in the first half of 2020, the NFT
    sales had surged to an almost unbelievable 2.5 billion dollars. Within this, we
    saw an increase in Quarter 1 to Quarter 2 of about 114.6%. In this same period,
    there was a substantial increase in the number of wallets that store NFTs, at
    about 151.89%. NFT trading platforms such as Open Sea have also increased, with
    Open Sea currently worth around 1.5 billion dollars. Sales of NFTs have moved
    on from being only on trading platforms to being made by traditional auction houses
    such as Sotheby’s and Christie’s. 


    It is not just the quantum of NFT sales that has increased in 2021. The value
    of the NFTs also increased substantially, with a majority of the most expensive
    NFT sales ever made being in 2021. In February, we saw digital art by the musician
    Grimes being sold for an amount nearing 6 million dollars, while the GIF for Nyan
    cat fetched a price of almost half a million dollars or 300 ethers. In March,
    the artwork by Beeple, pseudonym of the digital artist Michael Winkelmann, called
    “Every Day: The first 5000 Days” was listed by the auction house Christie’s and
    sold for a record price of 69.3 million dollars. The same month, Jack Dorsey,
    Twitter''s founder, and CEO, sold his first-ever tweet after converting it into
    an NFT. This tweet was sold for a price of 2.9 million dollars. Similarly, the
    cost of various avatars by Cyberpunks has continuously been sold for prices ranging
    from a few hundred thousand dollars to 7.6 million dollars or 4200 Ether for CryptoPunks
    #7804.


    Some of the most popular NFTs that one should know about are:


    CryptoKitties: Crypto kitties were one of the first NFTs readily traded by the
    public. CryptoKitties were developed by the Canadian development studio called
    Dapper Labs in 2017. Since then, the popularity and the price of the various cats
    in the game have increased manifolds, with some rarer cats, such as “dragon,”
    costing more than a million US dollars. Crypto Kitties is a game based on the
    Ethereum blockchain. Users can purchase, breed, and sell cats in this game.'
