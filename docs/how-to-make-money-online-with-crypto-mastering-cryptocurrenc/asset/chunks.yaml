    # Blockchain Technology


    ## Miners


    Miners are the people who are responsible for adding new blocks to a blockchain.
    To add a new block to a blockchain, one needs to solve a complex mathematical
    problem; this problem can only be solved by trial and error and hence requires
    significant computing power. A `nonce` is a 32-bit number, and the `hash` is a
    256-bit number, so about 4 billion `nonce`-bit combinations are possible. The
    process of finding the correct combination is called mining. For undergoing this
    process, the miners are rewarded in cryptocurrencies.


    ## Principles of Blockchain


    Blockchain technology works based on certain principles; these principles are:


    ### Distributed Database


    The most basic principle behind blockchains is that the database in a blockchain
    is not stored in a single location and is spread across various nodes and servers.
    It means that for a transaction to be entered into a blockchain, it must be entered
    in every node, making it a very secure form of data storage, albeit a bit slower.


    ### Peer-to-peer Transactions


    The transactions and communication in a blockchain happen directly between the
    peers and nodes and not via a moderator. This ensures a certain amount of trust
    and transparency between blockchain network users.


    ### Transparency


    The transactions stored in a public blockchain are transparent. Anyone can access
    these transactions, making it harder for people to cheat or defraud others by
    creating false entries.


    ### Irreversibility


    The transaction, once stored on the blockchain, is marked with a timestamp, and
    it is stored as such. The data, once entered, cannot be changed after that. The
    entire chain must be mined again to make even a small change on one of the blockchain
    blocks. This would require massive computing power and would be nearly impossible.


    ### Computational Logic


    The data is stored on the blocks in a logical format, so the users don''t have
    to add it manually. They can create algorithms to enter the transactions by themselves.


    ## Cryptography in a Blockchain


    A blockchain uses two basic kinds of cryptography: the asymmetric key and the
    hash function. These two are used at the same time and have different processes.


    ### Asymmetric Key Cryptography


    The asymmetric key means two types of keys are needed to access the blockchain.
    For every blockchain, there is a `public key` and a `private key`. The `public
