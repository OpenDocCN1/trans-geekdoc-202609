- raw: 'Synthetic assets can be understood as tokenized derivative that works much
    like another asset in value and functionality without having any actual physical
    relationship with the asset. These crypto-assets indicate assets of other kinds
    like fiat, gold, etc. These synthetic assets can be easily used as collateral
    by tokens in intelligent contracts with predetermined rules, regulations, and
    agreements. The understanding of synthetic assets can be supplemented by the example
    of a platform that allows users to curate and trade tailor-made synthetic asset
    versions. The Synthetix platform enables the exchange of synthetic versions of
    various assets like gold, fiat, commodities, etc. 


    Efficient trading practices


    The DeFi ecosystem includes many transactional activities, from exchanging synthetic
    assets to exchanging tokens and margin trading. The advantage conferred by DeFi
    to the trading industry is the reduced reliance on brokers for trading to be initiated.
    Crypto traders also relish the benefits of DEXs due to reduced exchange charges,
    quick transactions, and absolute custody of the assets to the owner. 


    Blockchain-Based Online Marketplaces


    DeFi has enabled digital spaces for the proliferation of marketplaces that link
    interested buyers and sellers. These markets are widening in their scope and magnitude
    as well. These digital markets drive out the need for an intermediary and brokers.
    This allows the sellers of many commodities to access the global user base of
    DeFi platforms without listing on retail brokerage platforms like Amazon. A significant
    part of online markets is supported by DeFi protocols enabling the exchange of
    products and services via peer-to-peer transactions. As mentioned above, the scope
    of these marketplaces is widening due to the advances in the technology corresponding
    to DeFi. It can also be attributed to the increasing applications and advantages
    of DeFi. These cater from established retail products like apparel to new business
    models like freelance gig platforms. For example, freelance gig hubs like Freelancer
    and Upwork are witnessing competition from platforms like Anytask built on the
    blockchain. The advantage that this blockchain platform of Anytask brings is that,
    unlike Freelancer and Upwork, it does not charge the service sellers any fee for
    accessing the gigs on their forum. 


    As outlined above, DeFi finds applications in various cases like borrowing and
    lending, asset management, insurance cases, stablecoins, compliance supported
    by KYT mechanisms, trading, no-loss gaming systems, etc. Despite our attempts
    to include the majority of use cases of DeFi, many use cases still need to be
    found mentioned in the section above. DeFi, a relatively new system, constantly
    evolves in its dynamics and application to different sectors. With such an evolving
    nature, the scopes of applications keep changing with new additions with its proliferation.
    Nonetheless, the objective of encompassing use cases in the narrative was to highlight
    the applications of DeFi and to give the readers an idea of how widespread DeFi
    is becoming, including industry after industry under its umbrella.


    Significant Considerations of DeFi


    Even though the DeFi systems offer a vast array of advantageous facets due to
    the culmination of finance and blockchain networks on DLT, it is still fraught
    with many risks and limitations, which the users should be aware of before venturing
    into the DeFi ecosystem. With the increasing applications industries, DeFi has
    also become home to cyber perpetrators on these platforms. Reports published by
    CipherTrace (a firm involved in crypto analytics) brought to light threatening
    figures of crypto crimes. According to this report, DeFi thefts in 2020 alone
    were about $100 million. In the latter half of 2020, about half of the cryptocurrency
    thefts were due to DeFi protocols. These staggering figures indicate the risks
    associated with DeFi. In addition to these risks, this system has many downsides,
    which will be explained in the sections below. 


    Before delineating the cons of this system, it is pertinent to note a few things.
    To begin with, the more significant part of the downsides of DeFi is because of
    the technology upon which they are built. The challenges of the base technology,
    in turn, propels the minor downsides of DeFi to become profound in their impact.
    If the blockchain network or technology that DeFi apps are built on suffers from
    issues of instability. If the base technology they are built upon is stable, the
    subsequently developed protocols will also be safe. Additionally, some of the
    risks associated with DeFi can be mitigated and managed if the users know them.  


    Risks Arising Due to Smart Contracts 


    The first and foremost disadvantage branches from the essential components of
    this system: smart contracts. Although intelligent contracts have eased the process
    of exchanging financial services, ensuring high reliability, even then, it is
    fraught with a few technical limitations. Smart contracts, at their outset, are
    at the disposal of humans, as the lines of the code are written by an individual
    only before its public upload on the blockchain. This introduces the first instance
    of the possibility of human error. No matter how strict a smart contract is, it
    can still have many loopholes. The availability of these smart contracts on the
    public blockchain offers the content multiple sets of eyes to skim through the
    contract for the slightest loopholes. While just a few individuals form an intelligent
    agreement, it is available for audit to the global database accessing it. Such
    math opens up opportunities for exploitation of the loopholes present in the smart
    contract. Even a single loophole can be misused to drain millions from the smart
    contract.


    Since smart contracts are available on the public blockchain, prospective investors
    can review them themselves or often outsource the review to security firms for
    auditing. This brings to light the second possibility of losses due to human error.
    Humans can miss out on loopholes in the contract, which then leads to exploitation
    in the future and financial losses eventually.  


    For example, Decentralization Autonomous Organization (DAO) was built on an open-source
    code allowing absolute autonomy and supplementing Decentralization. Launched in
    April 2016, it was a venture capital fund directed by investors. It saw exponential
    growth, which soon made this platform one of the most significant crowdfunding
    ventures, collecting around $120 million. By June 2016, however, an array of hackers
    emerged who identified a few flaws and vulnerabilities in the smart contract.
    These vulnerabilities helped the hackers in siphoning off about $50 million. The
    siphoned amount made it impossible for investors to access their funds for weeks.
    This became the biggest hack in the history of crowdfunding.


    Efforts are being made to prevent the exploitation of smart contracts. For instance,
    Nexus Mutual is a team focused on structuring aspects of decentralized insurance
    that will help ensure the interests and security of the users in case they are
    faced with scams and frauds by cyber perpetrators on these systems. 


    Hacking and Frauds


    The proliferation of fraud occurs in a way that often goes unnoticed at the outset
    and comes to the spotlight in retrospect. There have been reports of funds laundering
    on DeFi platforms like Kyber Network, Uniswap, etc. As explained in the previous
    sections, another source for fraud to occur is hacking by identifying the loopholes
    in the smart contract that are available on the blockchain network. Such activities
    put shade on the security of the funds on the DeFi platforms, raising concerns
    in the context of the trust quotient. While this may lead to users losing their
    money, on the one hand, it discourages non-existing users from switching from
    traditional financial systems to DeFi. 


    Problems with the Scalability of the Host Platforms '
