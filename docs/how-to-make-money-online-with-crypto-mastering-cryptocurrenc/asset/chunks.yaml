    # DeFi 用例：稳定币、资产管理、保险等


    ## 加密货币波动性与稳定币


    加密货币的一个显著缺点是加密生态系统中普遍存在的剧烈波动性。这种价值频繁上升和下降的价格波动导致了加密货币可靠性的降低。`Stablecoins`（稳定币）在此背景下充当了救星的角色。`Stablecoin`（稳定币）可以被理解为一种独特的加密货币，因为它与一种资产或一篮子资产挂钩。这些资产可以是从法币到黄金，甚至任何其他种类的加密货币。它们与资产的结合提供了稳定性，这与加密市场的波动性形成鲜明对比。它们还为区块链作为一种可靠的支付方式提供了更高的可信度。`Stablecoins`
    现在在 `DeFi` 生态系统中用于借贷等。


    ## 资产管理流程


    `DeFi` 允许用户对其资产行使更大的控制权。由于没有中央监管机构，去中心化帮助用户获得对其资产的绝对控制权。它使用户能够根据自己的意愿管理资产。这可能涉及购买、出售、借贷或转移数字资产。通过移除中介，只有用户才能以他们认为完美的任何方式访问和管理其资产。例如，在许多
    `DeFi` 项目中，包括 `Gnosis Safe`，`Argent` 促进了用户对其信息的完全控制，并确保数据仅由用户安全存储。


    ## 在保险行业的应用


    `DeFi` 的另一个主要用例是在保险行业。`DeFi` 通过消除传统保险系统处理方式带来的重大限制，正在彻底改变保险行业。这些规则包括难以计量的文书工作、有缺陷的理赔处理流程、耗时的程序等。保险行业也因虚假索赔的欺诈行为而遭受挫折。区块链的去中心化技术可以验证提交的文件、所有权、保单注册相关详情和索赔真实性。有了智能合约，因保险而产生的资金交换流程对申请人和保险公司都变得更加容易。


    ## KYT 机制支持的合规性


    了解你的客户 (`KYC`) 协议主要指导反恐怖融资和反洗钱 (`AML`) 方面的合规工作。然而，`KYC` 协议往往干扰了 `DeFi` 的隐私前提。它也在某个步骤涉及外部权威，这与
    `DeFi` 的去中心化方面相矛盾。因此，`DeFi` 引入了一种相对更先进、更好的了解你的交易 (`KYT`) 机制。该机制为将关注点从用户身份转移到数字地址和用户的交易行为奠定了基础。这种机制评估交易的实时行为并保护用户隐私。该机制有助于评估系统中蔓延的风险或危机，早期发现可以防止最终的大规模欺诈和巨额资金被窃取。


    ## 去中心化交易所


    去中心化交易所（简称 `DEXs`）指的是在没有任何中央机构参与的情况下发生的 `P2P`（点对点）加密货币交易，从而支持 `DeFi` 的基本前提。此类交易所中的资产对任何外部交易平台都是非托管的。它允许用户互动、交易并保持对其资产的控制。其赋予的显著优势在于风险缓解方面。由于资产不在任何外部机构或平台的直接监管之下，这降低了黑客攻击、欺诈和价格操纵的可能性。目前，许多
    `DEXs` 用于用户友好且易于访问的 `DeFi` 领域。最流行的包括 `Liquality`、`AirSwap`、`Mesa` 等。


    ## 强化的数字身份


    基于区块链的数字身份系统正成为焦点，作为可行且高效的身份系统。主要是当与 `DeFi` 协议融合时，这些身份系统在需要获取金融服务时，其即时处理方面的效率会得到提升。这些系统也在改变信用度的指标。根据传统金融体系，验证金融服务申请人可信度的手段过去是他们的资产拥有情况（自有住房）和收入水平。然而，由
    `DeFi` 和区块链协议强化的数字身份通过申请人的交易行为、金融活动、在线声誉或其他被认为实用且必要的属性来验证申请人。这有助于金融服务申请人克服抵押品带来的障碍，并根据他们知晓的指标获得所需服务。


    ## 风险缓解与管理


    `DeFi` 的旗舰特性强调透明度和去中心化，这反过来已成为缓解相应平台上出现风险的关键。这是通过用户利用提供给他们的数据存储库进行彻底的数据分析来完成的。在进行数据分析并充分了解相关和预测风险后，用户可以根据自己的意愿做出决策。这种综合框架帮助用户了解风险及缓解方法。它还让用户了解市场上出现的金融机会。`DeFi`
    的普及带出了 `DeFi Pulse` 和 `CoDeFi Data` 等工具，它们参与了上述过程。


    ## DeFi 与预测市场


    尽管对预测和博彩的伦理持批评观点，但这些仍吸引着许多人。预测市场允许用户对尚未发生的事件的结果下注或投票赞成/反对。预测用例涵盖的事件包括体育赛事预测和选举结果预测等。预测市场的功能仅在功能层面上与传统预测需求产生共鸣。区块链与这些市场的融合消除了对中介的需求。`DeFi`
    预测市场榜单的前列有许多竞争者——例如 `Augur`、`Gnosis`、`Polymarket`、`Predictit`、`FTX` 等。`Augur`
    已成为榜单上最有力的竞争者。该平台专注于预测，允许用户对政治或经济事件下注。2020 年美国大选期间，由于参与预测结果的用户数量和投注金额巨大，`DeFi`
    支持的预测市场受到关注。据报道，`Augur` 在这些选举期间记录了约 800 万美元的金额。


    ## 游戏与 DeFi：无损失游戏的奇迹


    `DeFi` 的一个基本特性是系统提供的可组合性。这种可组合性激励产品开发者将 `DeFi` 协议设计到平台本身中。最新的视频游戏具有应用内购买选项，这促使用户使用法币购买角色、元素或游戏的其他方面。游戏领域的开发者通过激励玩家，将其领域与
    `DeFi` 系统集成。策划奖励模型通常是这样做的，以针对使用 `DeFi` 代币的用户的兴奋点。例如，`PoolTogether` 是一款基于无损失前提的游戏。用户被提示提交
    `DAI` 稳定币，购买数字彩票。这些稳定币被汇集在一起并存放至月底。每月底，这笔资金再次出现，将利息奖励给一名玩家，并将存款金额返还给所有玩家。


    ## 合成资产交易

