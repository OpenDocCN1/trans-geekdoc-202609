    # Chapter 7: The Blockchain Technology


    What is a Blockchain?


    Blockchain is often confused with the first-ever cryptocurrency - Bitcoin. This
    is because the term blockchain became popular only after the inception of Bitcoin.
    In reality, blockchain is the primary technology that enables the working of cryptos.
    If not for blockchain, we won’t be seeing any of the cryptocurrencies that are
    in circulation today. It is essential to know that cryptocurrency is just one
    of the various potential applications of blockchain technology.


    In simple terms, a blockchain is a distributed electronic ledger built around
    a Peer 2 Peer system. This ledger can be shared among infinite users for their
    reference. The transactions entered into the blockchain are tamper-proof and time-stamped
    individually. A set of valid transactions makes a block complete. Each verified
    block is linked to the previous block to form a chain of blocks. Hence the name
    - Blockchain!  


    The working of the Blockchain is different from that of centralized systems. It
    is a distributed ledger and works as a consensus-based network, thus, making it
    decentralized. Following is the step-by-step working of a transaction on the Blockchain.


    1\. A node, a computer in the blockchain network, receives a transaction from
    the sender. It initiates that transaction on the web by creating it. Later, the
    cryptography technique gets the transaction digitally signed with a private key.


    2\. The transaction information is passed from that node to all the other nodes
    on the network to validate the transaction based on some criteria preset by the
    Blockchain. This process is called the Gossip protocol. In technical terms, it
    is called the Proof of Work, the standard consensus algorithm of Blockchain. According
    to the algorithm, the nodes must solve a complex mathematical puzzle to authenticate
    a transaction. Usually, two or more nodes are required to validate the transaction.


    3\. Once the nodes validate the transaction entirely, it is included inside a
    block and is propagated toward the leading blockchain network. This is when the
    trade gets its first confirmation.


    4\. Later, when a new block is created for the same transaction, it goes through
    the same process above and gets linked to the first block, referred to as the
    “genesis block.” The league gets its first confirmation, and the transaction reaches
    its second confirmation.


    5\. the same process is repeatedly reconfirmed for every new block created. Typically,
    about five-six confirmations are required for the transaction to be officially
    complete. And finally, the ownership of the cryptocurrency/digital asset is moved
    to the receiver.


    Smart Contracts


    One of the most fundamental purposes of using a blockchain is that no intermediary
    is involved. Because blockchain is decentralized and all the functions that the
    intermediaries do are replaced with complex computer algorithms. A revolutionary
    application of blockchain that can potentially eliminate many intermediaries is
    known as Smart Contracts.


    Smart Contracts can be defined as computerized agreements stored in a blockchain
    network. In smart contracts, all contract terms can be pre-coded, and the execution
    of these contracts can automatically be done once the contract conditions are
    met. Since these Smart Contracts are stored in a blockchain network, the security,
    transparency, and accessibility of the contract are increased exponentially.'
