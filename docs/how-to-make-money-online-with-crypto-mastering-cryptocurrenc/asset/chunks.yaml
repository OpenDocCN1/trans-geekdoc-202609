    its assets are stolen. Consequently, Ethereum undergoes a "fork," dividing into
    Ethereum and Ethereum Classic.


    ## 2017

    This was a watershed year in the history of Bitcoin, and this period permanently
    altered the way people viewed cryptos. Bitcoin served as an entry point for all
    newcomers to cryptocurrency in 2017. Individuals were only sometimes considering
    Bitcoin as a long-term investment. They were trading Bitcoin for altcoins and
