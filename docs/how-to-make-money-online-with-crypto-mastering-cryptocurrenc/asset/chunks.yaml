    technology or those who have just joined DeFi platforms. Their likelihood of losing
    their funds due to a tiny mistake causes them significant financial problems.
    Thus, more work is required in the DeFi space to make the platform user-friendly
    and create tools that minimize the risks of potential human errors.  


    Despite the risks and limitations of DeFi, it is still booming as it continues
    to offer advantages to various industries in the form of its successful and efficient
    applications. Especially after 2020, these systems must focus due to the increasing
