    the hash rate can be said as the rate of mining of a coin. In combination with
    other metrics, the hash rate can be used to predict trends in a currency. 


    Active addresses are the blockchain addresses that remain active in a given period.
    Methods of calculating this metric vary, but it is also a good indicator of the
    dynamic market participants in the Bitcoin ecosystem. Several unique addresses
    can also be studied to see how the addition of new users is progressing in the
    network. Bitcoin has more than half a million addresses active at any given time,
