  trans: '


    # 比特币的十年崛起


    ## 简介


    在长达十年的崛起过程中，比特币改变了全球市场的运作方式，并让许多人变得超级富有。世界上最流行的加密货币始于 2009 年 1 月 3 日，通过挖掘创世区块（区块
    0）而诞生，这创造了 50 枚比特币。1 月 9 日，比特币 0.1 版正式发布，其中包含的生成系统将比特币的总流通量限制在 2100 万枚，预计将于 2040
    年挖完。


    现在，让我们回顾比特币登顶的跌宕历程，并分析该币在此过程中达到的一些重要里程碑。


    ## 2009 - 2011


    2009 年 1 月诞生后，比特币基本局限于开发者圈子，并未在圈外引起太多关注。但到了 2009 年 10 月，一个由早期比特币开发者运营的亲加密网站 New
    Liberty Standard 显示了首个 BTC-USD 汇率。当时，他们根据挖掘一枚比特币所需的电力成本计算汇率，2009 年 10 月 5 日约为
    0.0007 美元。不到一个月后，支持 Linux 并升级了区块链功能的比特币 0.2 版发布。2010 年 5 月，程序员 Laszlo Hanyecz
    在 Bitcointalk 论坛上通过交易花费 10,000 枚比特币（当时价值约 30 美元）购买了两个 Papa John''s 披萨，完成了首笔比特币实物购买。到
    2010 年底，比特币的人气已超越原有媒体范围，并获得势头；这导致比特币总市值于 2010 年 11 月达到 100 万美元大关。此时一枚比特币价值约 0.5
    美元。


    2011 年是比特币的重要一年，它首次突破 1 美元大关并登上全球头条，进一步推高了其知名度。臭名昭著的“丝绸之路”网站也于此时由 Ross Ulbricht
    先生推出，他旨在创建一个无法无天的暗网市场，让人们可以在不留痕迹的情况下买卖任何东西。比特币因其匿名性和不可追踪性，成为显而易见的货币选择。然而，在媒体关注带来的势头推动下，比特币持续上涨，于
    2011 年 6 月突破 10 美元并升至 30 美元以上。就在此刻，原始创造者中本聪从互联网上消失了。


    在从 2 月的 1 美元涨至 6 月 8 日的 31 美元高点后，比特币的梦幻般上涨突然逆转，被称为“比特币泡沫”的行情——破裂了——价格于 6 月 12
    日跌回个位数。


    突然的攀升给加密货币爱好者带来了巨大希望，一些人预期价格将在年底前突破 1,000 美元并进入主流使用。但突然的崩盘带来了与攀升带来的希望同等程度的绝望，很快像“丝绸之路”这样的黑市应用的存在让人们开始质疑比特币的未来。当时比特币
    0.5 版正在运行。


    ## 2012-2017


    比特币一如既往地波动，在 2011 年 6 月见顶后的几个月里缓慢回升，时隔近一年首次重回 9 美元上方。随后，多起比特币交易所被黑客攻击、比特币被盗的事件被报道。比特币延续牛市，首次突破关键的
    100 美元大关，从 3 月 31 日的 96.15 美元跳涨至次日收盘价 104.70 美元。


    然而，随着恐慌性抛售的发生，价格在两天内暴跌逾 70%，仅六天就从 228.94 美元跌至 68.09 美元，使币价回到了月初的水平。2013 年 10 月，使用比特币进行阴暗交易的秘密在线黑市“丝绸之路”被
    FBI 查封，比特币价格因此暴跌逾 18%，从 127.30 美元跌至 103.85 美元，但价格次日即反弹。到 11 月，比特币价值飙升近十倍，达到 1000
    美元。中国外交部长王毅表态积极，宣布中国人民“自由参与比特币市场”，并承诺对该货币“采取长远视角”，给市场参与者带来了极大乐观情绪。


    到 2015 年，比特币已被全球超过 100,000 家零售商接受：包括微软、戴尔、维基百科、Twitch、绿色和平、Expedia 和 PayPal。广泛的商家采用让人们确信比特币作为货币具有真实价值，而不仅仅是一种数字投资。到
    2017 年底，随着零星黑客事件持续发生，比特币交易价格徘徊在 1000 美元左右。


    在一次巨大的飞跃中，比特币从 2017 年 1 月 1 日的 1,000 美元以下飙升至 12 月 1 日的 10,840 美元，让许多人暴富。它继续创下
    20,089 美元的纪录新高，并以 19,783.06 美元的历史最高收盘价结束当天交易。


    ## 2018-2020


    在 Twitter 宣布禁止加密货币广告，加入谷歌和 Facebook 等科技巨头行列以保护投资者免受欺诈后，价格下跌了 3.60%。


    打压随之而来，因为全球监管机构开始注意到首次代币发行（ICO）及其他与加密货币使用相关的滥用和欺诈的潜在风险。价格在一周内从 8,518.64 美元跌至 7,471.18
    美元。比特币原始软件客户端第十七代，即 Bitcoin Core 0.17.0 版于 2018 年发布，带来重大升级，当时价格持续下跌。2019 年到来时，价格攀升至
    10,000 美元以上，于 6 月 26 日触及 13,880 美元，随后回落。


    2020 年瘟疫降临，新冠肺炎冲击我们的生活，全球市场暴跌。比特币也未能幸免，在世界走向全面封锁的情况下，不到一周暴跌逾 50%。3 月 12 日，比特币从近
    8,000 美元跌至 5,000 美元以下，单日跌幅 39%。市场流动性冻结，投资者逃向现金和大宗商品板块。然而令人惊讶的是，到 5 月价格已回升至疫情前水平，因为比特币交易者迅速回归。


    到 2020 年 11 月，比特币年度涨幅达 100%，报 15,770 美元；看涨势头持续，价格于 11 月 30 日升至日内高点 19,864 美元，并于月末收于
    19,700 美元。很快，12 月 16 日，加密货币突破 20,000 美元大关，继续冲高至 21,576 美元的纪录新高——年度涨幅超过 180%。货币持续攀升，12
    月 21 日突破 24,000 美元，12 月 26 日突破 26,000 美元。


    ## 2021-至今


    牛市延续，比特币以破纪录的 2021 年开局，于 1 月 2 日冲破 30,000 美元大关，不到一周后突破 40,000 美元，并于 1 月 8 日达到
    42,000 美元高点，使新年第一周涨幅达 40%。自 1 月初突破 40,000 美元以来，比特币波动剧烈，展现出巨大的波动性。


    此后价值缩水四分之一，于 1 月 22 日和 1 月 27 日两度短暂跌破 30,000 美元。在埃隆·马斯克能施加巨大网络影响力的又一例证中，他在 Twitter
    个人资料中添加了 #Bitcoin 标签，价格飙升，单日涨近 11%，次日再涨 10%。


    随后，于周一（1 月 8 日——原文日期可能有误，应为 2 月初），特斯拉在向 SEC 提交的文件中宣布，作为新投资政策的一部分，已投资 15 亿美元购买比特币，推动价格飙升。对比特币而言这是丰收的一年，到
    2021 年 2 月，价格首次突破 50,000 美元。在一个重要里程碑中，比特币价格于 2 月 19 日反映 9% 涨幅（原文“reflected 9%”疑为“rose
    9%”或类似含义），使其总市值首次突破 1 万亿美元，攀升至 53,000 美元以上。随即，埃隆·马斯克在 Twitter 上宣布，在上个月购买了 15 亿美元比特币后，特斯拉现在将接受比特币作为购车付款——进一步将加密货币融入金融体系。


