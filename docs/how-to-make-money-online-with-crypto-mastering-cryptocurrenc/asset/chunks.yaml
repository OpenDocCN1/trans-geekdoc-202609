    Feel free to read any of my books in the series, which can be found on my Author
    page on Amazon at [https://www.amazon.com/author/brianscottfitzgerald](https://www.amazon.com/author/brianscottfitzgerald).


    ## Table of Contents


    *   [INTRODUCTION](#part0007.xhtml)

    *   [Chapter 1: The Cryptocurrency Revolution](#part0008.xhtml)

    *   [Chapter 2: The Bitcoin Phenomenon](#part0009.xhtml)

    *   [Chapter 3: The Future of Bitcoin](#part0010.xhtml)

    *   [Chapter 4: The Altcoin Market](#part0011.xhtml)

