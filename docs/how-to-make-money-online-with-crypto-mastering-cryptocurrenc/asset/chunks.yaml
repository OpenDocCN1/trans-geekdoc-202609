- raw: 'Bitcoin recovered to $7,000 in April, only one month before its third and
    final historical event - halving. After three months of stabilization, Bitcoin
    broke over the $10,000 barrier in October. Then, within two months, as investors
    were still discussing the prospect of Bitcoin falling lower, it surmounted obstacles
    of $12K, $14K, $16K, and ultimately $19K. In 2020, institutional investors and
    government sectors will undoubtedly benefit from Bitcoin''s growth. JPMorgan Chase
    was the catalyst for the adoption. And this was the impetus for the 2021 cryptocurrency
    bull run.


    2021


    The bull run that began in 2020 lasted far into 2021, with experts and fans issuing
    lucrative price forecasts for major cryptocurrencies. Elon Musk''s support at
    the start of the year accelerated the pace. All of the optimism surrounding Bitcoin
    propelled it to new highs and positively influenced virtually all the altcoins.


    However, a hurdle occurred in May when Elon Musk changed his stance and said that
    Tesla would no longer take Bitcoin because it would jeopardize the environment.
    To make matters worse, a series of crackdown operations against crypto mining
    was conducted in China in May, the country hosting most of the world''s crypto
    mining. This affected virtually all cryptocurrencies, and it seemed as if the
    so-called bubble had burst.


    On the other side, half the Earth away from China, the year 2021 will be remembered
    as another South American nation formally accepts the first time Bitcoin. El Salvador
    has recognized Bitcoin as legal money after Congress received a request from President
    Nayib Bukele to embrace the cryptocurrency and eliminate all related capital gains
    taxes. Additionally, the President pledged to harness the country''s geothermal
    energy by instructing a state-owned utility to construct geothermal facilities
    that harness the power from volcanoes for Bitcoin mining. The height for BTC in
    2021 reached $68,000, another record high reached in October 2021, but closed
    the year below $40,000.


    2022.


    As we moved from 2021 to 2022, inflation, the energy crisis, and geopolitical
    upheaval owing to Russia''s aggressiveness toward Ukraine lowered BTC and other
    top cryptocurrencies'' values. Prepare for the 2022 Crypto Winter and shifting
    Bitcoin values. From January to May 2022, Bitcoin''s price plummets. BTC dropped
    below $30,000 for the first time since July 2021 in May. Crypto winters are less
    defined than bear markets. Like a bear market, this period sees the cryptocurrency
    markets decrease steadily and sometimes sharply. Cryptocurrencies fell in Q2.
    Stablecoins like TerraUSD and Terrra Luna contributed to the crypto price drop.
    Bitcoin traded around $20,700 as cryptocurrency hedge fund Three Arrows Capital defaulted
    on a bitcoin loan and was ordered into liquidation by a court in the British Virgin
    Islands. In November 2022, FTX, a major crypto exchange, unexpectedly collapsed,
    further depressing crypto values. The conversation went bankrupt after its CEO,
    Sam Blankman Fried, was accused of misappropriating funds. FTX''s financial difficulties
    and possible fraud prevented Binance from bailing it out.


    The shocking collapse of FTX sent shockwaves across the financial industry, generating
    a domino effect in the cryptocurrency market and leaving investors uneasy. Inflation
    fears and rising interest rates impacted the market. As 2022 ended, Bitcoin''s
    price dropped below $20,000, indicating the cryptocurrency market''s health.


    2023


    The first half of the yeast saw BTC in the $ ’20s. We are now experiencing the
    gradual yet promising rise of Bitcoin''s value, reaching approximately $30,000
    when writing this chapter and igniting a glimmer of hope that the crypto winter
    is finally ending. Q1 had seen other cryptocurrencies following suit with similar
    price trends.


    Experience the new heights of Bitcoin mining as we draw closer to the end of May.
    The recent surge in miner interest has caught traders'' attention, who view it
    as an excellent bullish signal. While inflation remains a concern in the broader
    markets, there is growing optimism that the measures implemented by the Fed could
    lead to a gentle landing.


    # Chapter 2: The Bitcoin Phenomenon


    The Story Of Bitcoin''s Birth


    On November 1, 2008, an anonymous entity named Satoshi Nakamoto wrote in an email
    to a cryptography mailing list with a nine-page white paper containing the first-ever
    mention of Bitcoin, calling it a "peer-to-peer electronic cash system."


    "I''ve been working on a new electronic cash system that''s fully peer-to-peer,
    with no trusted third party. The paper is available at Bitcoin.org/Bitcoin.pdf."
    Nakomoto said. The original paper detailing the math and specifics of Bitcoin
    is still available on the website.


    As Nakamoto proposed, the system''s main properties would be that the electronic
    transactions would be peer-to-peer and would not need to involve a financial institution.
    The plan was to be completely decentralized, meaning that the currency users would
    not need to rest their trust in a central authority, such as traditional central
    banks. 


    Satoshi also expressed dissatisfaction that banks have repeatedly breached the
    trust of the people who deposit money with them by lending them money in credit
    bubbles while keeping minimal reserves. "The root problem with conventional currency
    is all the trust required to make it work. The central bank must be trusted not
    to debase the currency, but the history of fiat currencies is full of breaches
    of that trust," Satoshi wrote.


    After publishing his revolutionary paper, Nakamoto released Bitcoin''s first software
    and partnered with developers and coders online to improve it.


    The first lines of code were posted to the Bitcoin blockchain on January 3, 2009,
    a few months after the original whitepaper surfaced. These lines of code, known
    as the "genesis block," are credited to the person or persons known as Satoshi
    Nakamoto.


    On January 12, Nakamoto sent ten Bitcoins to Hal Finney, giving birth to a new
    finance counterculture, taking impetus away from banks and back to the people.
    At this point, Bitcoin''s monetary value was negligible. Initially, users rewarded
    each other with Bitcoins for good comments in forums. The first "real" transaction
