    # Altcoins: Investment Perspective and Market Analysis


    That doesn''t mean you should refrain from buying altcoins altogether. Altcoins
    can be a source of diversification for an investor''s portfolio as each altcoin
    project is usually independent of the others.


    Cryptocurrency markets have yet to mature, and there are no defined investment
    criteria or metrics to evaluate cryptocurrencies. The altcoin market is driven
    mainly by speculation. Several cases of dead and failed cryptocurrencies exist.


    Therefore, the altcoin market is for investors prepared to endure the risks of
    operating in an unregulated and emerging market prone to high volatility and wild
    price swings.


    ## Looking Ahead


    Altcoins improve on the original Bitcoin, aiming to fix the cryptocurrency''s
    shortcomings. Altcoins, such as Ripple''s XRP and Ethereum''s ether, have already
    become popular in the mainstream financial world, resulting in high valuations
    for these coins. The SEC has sued some of these coins, claiming they are securities,
    making it hard to trade with USD. There is a reason the corrupt financial system
    does not want these to succeed.


    Looking at the current state of the altcoin market, it is likely that all the
    altcoins will stay. But it is also expected that most of the more than 2000 altcoins
    listed in crypto markets will not survive. The altcoin market will coalesce around
    many altcoins with solid utility and use cases, dominating the markets.


    Altcoins are an inexpensive way for investors in the crypto space to expand their
    horizons beyond Bitcoin. Rallies in altcoin markets have produced returns multiples
    of those produced by Bitcoin. But there is significant risk involved in altcoin
    investing, like the absence of regulation and immense price volatility. Before
    buying any altcoins, research and have sound risk management strategies. If trades
    are timed correctly, one can expect multi-bagger returns in the altcoin markets.


    ## The Market Capitalization of Altcoins


    The altcoin market has been booming in recent years; from 2017 to the present
    day, the total market cap of the altcoin space has increased by more than 100-fold.
    The altcoin market cap currently stands at 884 billion dollars, higher than Bitcoin''s
    $665 billion. Let''s look at some of the front runners in the altcoin space that
    account for a significant portion of this impressive market cap.


    ### Ethereum ($221 billion)


    Ethereum is a cryptocurrency that draws inspiration from the original Bitcoin.
    While Bitcoin is used primarily as a store of value as a digital form of currency,
    the idea behind Ethereum is to decentralize applications and services from simple
    apps to more complex financial agreements. Ethereum uses the same technology as
    Bitcoin, wherein a blockchain uses a distributed, decentralized public ledger
    to decentralize the network, so it''s not under the control of any single entity.


    Ethereum lets you send cryptocurrency to anyone for a small fee and powers applications
    everyone can use. Ethereum boasts itself as "the world''s programmable blockchain."
    It builds on Bitcoin''s innovation, with some significant differences.


    While both Ethereum and Bitcoin let you use digital money without payment providers
    or banks, Ethereum has the added advantage of being programmable, so you can also
    use it for many different use cases and business models. This also means Ethereum''s
    application can go beyond fulfilling payments on a network. It can be a marketplace
    of financial services, games, and apps that can''t censor or steal your data.
    Ethereum was conceived by Vitalik Butarin, Martin Wood, and other members in 2013
    and released after a couple of years in 2015. Through the Ethereum project, they
    wanted to address different limitations present in Bitcoin and allow the execution
    of short programs in the Blockchain. Vitalik and the rest of the team sought better
    ways to build decentralized finance systems with apps running on the Blockchain.


    At the heart of the programmable aspect of Ethereum lies smart contracts and dApps
    (Decentralized apps). A smart contract is a short program that can be deployed
    and run on a blockchain. It processes transactions sent to it by executing code
    and can also hold funds (Ether) on the blockchain ledger. These transactions can
    pass both funds and data.


    Smart contracts can be built to perform all sorts of functions without a trusted
    third party or central authority. If you consider smart contracts as back-end
    code running in the blockchain, decentralized applications are the front-end or
    UI. They represent the visible layer connecting users or other applications with
    the smart contracts running in the blockchain. Eventually, entire decentralized
    autonomous organizations may exist in an ether economy.


    Ethereum was trading at $2,913 as of Aug 2021 and $1,913 as of June 2023. Exactly
    years ago, it was trading at $390; that''s more than a five times increase in
    market price.


    As Ethereum''s rally accelerates, many in the crypto industry predict that Ethereum
    could overtake Bitcoin as the world''s biggest cryptocurrency by value. With the
    latest update to its blockchain, Ethereum is returning to a cryptocurrency bull
    market with fresh all-time highs on the horizon. The price boost, pushing ether
    tokens toward $3,000, has caused the combined crypto market cap to climb to almost
    $1.7 trillion.


    ### Tether ($83 billion)


    Tether or USDT is a cryptocurrency pegged 1 to 1 with the US dollar. Tether is
    currently the most popular USD-pegged cryptocurrency in the world. According to
    its developers, the design of USDT is to be worth 1 USD, and the dollar will back
    each tether unit it issues into circulation in a one-to-one ratio. However, the
    price of USDT can be volatile, and it was seen trading at a >10% discount to USD
    in 2018.


    Many consider Tether an optimal way for users to move money effectively without
    a centralized authority. Users can trade the currency actively and use it for
    international transactions in countries with capital regulations. The massive
    global payments market is a driving force for Tether''s supply and demand movements.


    Though the white paper states that one USDT should receive the backing of one
    USD, there are many questions about its legitimacy. The reserve level has been
    a mystery as rumors suggest that Tether''s reserve is insufficient to back the
    amount of USDT. The last audit was in mid-2018 by a Washington law firm. The mistrust
    and speculations brought in a significant price movement in Oct 2018.


    The credibility of Tether has always raised some concerns, especially regarding
    whether Tether''s reserve has sufficient reserves. Despite such speculation, Tether
    remains at the top, holding ten times more market share than other USD stablecoins.
    Given the uncertainty surrounding its backing with USD, it will be interesting
    to see if Tether can maintain such dominance in the future.


    ### Binance Coin ($40 billion)


    Binance Coin is the cryptocurrency issued by the Binance exchange, the largest
    cryptocurrency exchange in the world. Binance coin trades with the BNB symbol.


    It was initially based on the Ethereum network but is now the native currency
    of Binance''s blockchain, the Binance chain.


    Binance uses one-fifth of its profits to repurchase BNB. They then permanently
    destroy this purchased currency every quarter in a process known as burning. This
    keeps inflation at bay and induces scarcity to drive up prices. The updated whitepaper
    states that BNB burns will now be based on its exchanges'' trading volume.


    Since Binance began burning BNB in Oct 2017, 10 token burns have occurred, with
    about 16.7 million BNB worth approximately $208 million burned as of January 2020.


    Binance was initially intended as a utility token for discounted trading fees
    during its release in 2017. But now, its uses have expanded to various other applications,
    including payments for transaction fees, travel bookings, entertainment, online
    services, and financial services.

    '
