  \n# 6\n\n## 基于机器学习的工业物联网（IIoT）及其应用\n\nM. Suresh Kumar¹, S. Rachel¹, and M. V. Kavisvan²\n\
  \n¹ 印度 Sri Sathya College, 信息技术部门。\n² 印度 Sri Sathya College, 机械工程部门。\n\nDOI: [10.1201/9781003198386](https://doi.org/10.1201/9781003198386)\n\
  \n### 目录\n- 物联网的历史\n- 物联网的范围\n- 物联网的特征\n- 主要的物联网类型\n- 物联网的优势\n- 机器学习与深度学习\n- 机器学习的应用\n\
  - IIoT – 工业物联网\n- 工业物联网的历史\n- 工业物联网的优势\n- 工业 4.0 中的工业物联网\n- 物联网与工业物联网\n- 工业物联网的未来\n\
  - IIoT 应用案例\n- 什么是智能制造\n- 资产追踪\n- 案例\n- 数字孪生\n- 案例\n- 数字孪生的优势\n- 智能计量\n- 智能计量系统的优势\n\
  - 智能计量系统的劣势\n- 智能农业\n- 如何实现智能农业\n- 数据采集\n- 知情行动与计划\n- 实施智能农业需要考虑的事项\n- 智能农业的优势:\n\
  - 利用物联网管理牲畜\n- 监测牛只健康\n- 监测繁殖周期与产犊\n- 精细化饲喂\n- 挤奶效率最大化\n- 车载车辆\n- 结论\n- 参考文献\n\n\
  \n\n\n\n机器学习（ML）是人工智能（AI）技术的一个子集。它被简单定义为对可以通过自学习过程自动更新的计算机算法的研究。机器学习通过自学习过程改进数据集。机器学习在工作时用于收集各种类型的数据，所有数据都由云存储系统进行分析和组织。通过这些收集到的实时数据，机器学习可以根据分析的数据提高其效率，并提供准确的行动。该系统的学习过程主要分为三类：\n\
  \n* 监督学习\n* 无监督学习\n* 半监督学习\n\n所有这些过程都能在较少人工干预的情况下改进系统的构想。在监督学习中，会向系统提供示例输入和操作目标。因此，系统将很容易地从操作过程中收集实时数据并改进系统的构想。\n\
  \n在无监督学习中，不会向系统提供示例输入和过程目标。在这种类型的学习中，机器学习仅通过从操作中收集实时信息来改进其过程。这种学习类型对于分析收集的数据并按时执行首选的操作相当困难。\n\
  \n半监督学习是机器学习技术的一种中等学习过程。在这个学习过程中，会向系统提供一些示例输入和操作目标；因此，它会在运行期间获取其他所需的数据。这比无监督学习简单，但比监督学习过程困难（图\
  \ 6.2）。\n\n![图 6.2 机器学习的应用](img/fig6_2.jpg)\n\n图 6.2 机器学习的应用\n\n### 机器学习的应用\n\n\
  * 图像识别\n* 语音识别\n* 交通预测\n* 产品推荐\n* 自动驾驶汽车\n* 电子邮件垃圾和恶意软件过滤\n* 虚拟个人助手\n* 在线欺诈检测\n\n\
  上述应用之外，机器学习在日常生活中也有广泛的应用。如今，机器学习是改变工业世界最受期待的技术之一，也将对工业 4.0 产生巨大影响。机器学习具有通过自学习纠正自身问题并独立寻找解决方案的能力，从而在不需要人工干预的情况下为许多问题提供所有可能的解决方案（图\
  \ 6.2）。\n\n## IIoT – 工业物联网\n\n物联网（IIoT）涉及集成设备（如传感器和机器人）以及生产和储能等，通过计算机的工业应用网络连接在一起。这种互连性促进了数据存储和共享服务。传输的数据随后被处理，可能会促进行业竞争力和性能的变化以及其他经济效益。\n\
  \n工业组织正日益投资 IIoT 以增强运营可见性和洞察力，这将有助于简化制造流程。消除现场连接、部署和管理设备的复杂性对于物联网的成功至关重要（图 6.3）。\n\
  \n![图 6.3 工业物联网应用](img/fig6_3.jpg)\n\n图 6.3 工业物联网应用\n\n工业现代化以及向智能制造的转变引发了自动化和机器人技术的创新，从而推动了工业物联网（IIoT）。引入人工智能（AI）、互操作性和安全连接实现了对过程、资源和系统的实时监控、控制和优化——这一切都导致了更高的生产力、更高的安全性和成本的降低。\n\
  \n## IIoT 的历史\n\nIIoT 的历史始于迪·莫利（Dick Morley）在 1968 年发明的可编程逻辑控制器（`PLC`），通用汽车在其自动变速箱制造部门使用了它。这些允许制造链中的单个组件得到更好的控制。霍尼韦（Honeywell）和横河（Yokogawa）分别在\
  \ 1975 年实现了世界上第一个 `DCSs`，即 `TDC 2000` 和 `Centum` 系统。这些 `DCSs` 是促进设施内可扩展过程管理的后续步骤，其额外好处是通过将控制分散到整个系统中，提供了应急冗余，防止了中心区域的单点故障。\n\
  \n当前 IIoT 的概念出现于 2002 年云技术的出现之后，它允许对历史趋势进行信息存储；2006 年开放平台通信（OPC）统一架构协议的出现，使得设备、程序和数据源之间能够进行安全的远程通信，而不需要人工干预或界面。`OPC\
  \ server` 是一个软件程序，用于将 `PLC` 使用的硬件通信协议转换为 `OPC` 协议。\n\n## IIoT 的优势\n\n“工业物联网”术语涉及物联网的经济分支，通常位于制造业中。效率的提高、分析能力以及工作场所的发展是经济物联网的未来优势。引入\
  \ IIoT 带来的增长潜力预计到 2030 年将达到全球 GDP 的 15 万亿美元。通过物联网应用，出现了自动化可能。智能办公室使用许多连接设备来跟踪、控制和处理组织内的多项活动。它们还可以帮助员工管理他们的日程，以便更高效、连续地使用时间。\n\
  \nIIoT 将在 2024 年开启一个价值 8000 亿美元的全球市场，成为连接产品、服务和解决方案的严重催化剂。\n\n## 工业 4.0 中的 IIoT\n\
  \n工业 4.0 是在欧洲创造的术语。它的意思等同于 IIoT，指的是第四次技术革命。该术语与 IIoT 可以互换，现在已全球认可。\n\n为了给专门从事制造和管理的企业形成一个更全面、更整合的环境，IIoT\
  \ 或智能制造将物理开发与实践与智能数字技术、机器学习和海数据相结合（图 6.4）。\n\n![图 6.4 2015–2025 年物联网设备数量](img/fig6_4.jpg)\n\
  \n图 6.4 2015–2025 年物联网设备数量\n\nIIoT 指的是传感器数据、计算机通信和自动化系统。它比通用的工业 4.0 术语更具描述性，后者涵盖了整个行业的数字革命。\n\
  \nIIoT 用例是工业 4.0 中最新的特征，支持智能工业。在工业 4.0 的经济重点上，这些能力基本上是我们经常说的物联网或 IIoT 用例：\n\n* 跟踪与追溯\n\
  * 结构健康监测\n* 远程诊断\n* 控制\n\n它们都是典型的用例。\n\n## 物联网与 IIoT\n\n以下是简单的物联网公司列表：\n\n* Vates\n\
  * ScienceSoft（美国和欧洲）\n* Oxagile（纽约，美国）\n* Style Lab 物联网软件公司（加金山，加）\n* HQ 软件工业物联网公司（美国和欧洲）\n\
  * PTC（波士顿，马）\n* Cisco（圣何塞，加）\n* ARM 物联网安全公司（剑桥，剑桥）（图 6.5）。\n\n\n\n\n\n![图 6.5 IoT\
  \ 设备市场](img/fig6_5.jpg)\n\n图 6.5 IoT 设备市场\n\n## 工业物联网的未来\n\n随着工业物联网（IIoT）的发展，它为公司简化流程、最大化客户服务以及从中小企业（SMB）到全球业务的增长创造了前所未有的机会。为了利用联网设施的优势，长期工业物联网将更多关注预测性维护、更好的系统连接以及为各种规模的企业提供更廉的访问。\n\
  \n## 工业物联网用例\n\nIIoT 是通过通信技术连接的大量工业设备网络，最终实现了前所未有的跟踪、捕捉、评估和提供新见解的机器。这些体验帮助企业做出更智能、更快的决策。\n\
  \n我们日常生活中的技术变革是不可或缺的。在新技术的帮助下，我们的生活将变得更加智能化。在工业技术领域，工业 4.0 是自动化和数据共享的最新趋势。物理网络、物联网和云计算包含在内（见图\
  \ 6.6)。\n\n![图 6.6 IoT 设备功耗统计](img/fig6_6.jpg)\n\n图 6.6 IoT 设备功耗统计\n\n在制造业中实施物联网，质量、数量和每小时的工作率将发生巨大变化。许多工业应用参与到这一过程中。下面讨论了一些主要的工业用例：\n\
  \n*   智能计量\n*   资产跟踪\n*   数字孪生\n*   智能农业\n*   智能汽车制造\n*   智能养殖业\n*   车队管理\n\n###\
  \ 什么是智能制造？](#ch06.xhtml#c_sec6_012_001)\n\n通常，我们熟悉制造业这个词，指的是在大规模生产或制造产品的行业。传统的制造过程涉及许多步骤，从选择原材料到包装产品。整个过程需要大量的机器和人力。后来，计算机设备也参与其中。\n\
  \n如今，这种制造过程正变得陈旧且枯燥。因此，世界正期待新的制造流程，以适应日常生活。“智能制造”是所有问题的解决方案。通过实施智能制造，大多数问题得到解决，工业各方面的发展将发生巨大变化（见图\
  \ 6.7）。\n\n![图 6.7 各地区智能制造市场](img/fig6_7.jpg)\n\n图 6.7 各地区智能制造市场\n\n未来，智能制造将对制造业产生巨大影响。根据\
  \ IDC 的研究，到 2025 年，物联网应用的设备改进每年可能超过 4700 亿美元。通过以下工业用例，我们可以轻松在任何领域实施智能制造，并让工业变得更加智能。\n\
  \n### 资产跟踪\n\n资产跟踪指的是跟踪物理资产的方法。可以通过扫描资产上的条形码或使用广播位置标签（如 `GPS`、`RFID` 或 `BLE`）来实现。这种技术也可用于监控个体或物种。\n\
  \n资产跟踪是一种允许公司跟踪和管理资产的系统方法。改进资产管理的最佳方法是无线频率识别（RFID）。RFID 标签通过电磁场将数据传输到读取器。以下是工业建立资产跟踪的系统方法或步骤：\n\
  \n*   首先，确定负责资产的可靠人员或团队。\n*   团队将确定这些资产的生命周期。\n*   对这些资产进行常规跟踪是强制性的。\n*   通过了解特定操作中资产的功能，我们可以实施自动化资产跟踪（见图\
  \ 6.8）。\n\n![图 6.8 IoT 的资产跟踪与位置](img/fig6_8.jpg)\n\n图 6.8 IoT 的资产跟踪与位置\n\n### 工业示例\n\
  \n在制造业中，大量资产参与了这一过程。因此，有效监控这些资产至关重要，例如用于从制造单元将产品送到仓库的叉车。\n\n如果叉车固定了 `RFID` 标签，当资产离开制造单元时，位于出口的\
  \ `RFID` 读取器将读取并将发送到云端。同样，当资产进入仓库时，入口处的读取器将读取数据并发送到云端。云系统中所有收集的数据都会经过分析，有助于改进流程。\n\
  \n资产跟踪帮助行业提高维护、准确性、责任性和客户服务，并降低行政费用。通过实施资产跟踪，我们可以为工业的进一步增长进行规划。\n\n以下是资产管理软件列表：\n\
  \n1.  ServiceNow ITSM\n2.  Nifty\n3.  `Monday.com`\n4.  Softchoice IT Management\n\
  5.  NinjaRMM\n6.  Freshservice\n7.  Spiceworks IT Asset Management\n\n贝莱德（BlackRock）管理的资产达\
  \ 6.52 万亿美元，是 2019 年全球最大的资产管理公司。\n\n### 数字孪生\n\n数字孪生可能是生物或非生物实体的副本。它是虚拟信息结构。从微观原子级到宏观几何级的生产潜力或物理产品都得到了完全描述。我们可以从数字孪生中收集任何商品信息，其准确性不亚于物理检查以获取数据。它是对象的虚拟动态表示。\n\
  \n后来，该概念被分为以下类型：\n\n*   ▯ => `DTP`\n*   ▯ => `DTI`\n*   ▯ => `DTA`\n\n为了理解物理产品，`DTP`\
  \ 包含设计、分析和流程。在物理产品存在之前就有 `DTP`。\n\n`DTI` 是每个商品个体实例的数字孪生。\n\n`DTA` 是 `DTIs` 的聚合，其数据和知识将用于物理产品的提问、预测和学习。\n\
  \n数字孪生应该是物理对象属性和状态的最新准确复制，包括形状、位置、手势、状态和运动。简单来说，数字孪生意味着物理世界与虚拟世界之间的连接。这些通过被称为数据的桥梁进行连接。信息通过使用物理设备上的成千上万个传感器获取。所有这些数据随后转换为虚拟副本。从物理实体到虚拟副本的实时数据持续流融合了真实与虚拟。\n\
  \n\n\n\n如果我们想知道风力发电机在发电方面的效率，通常会制作一个原型并进行分析。然后，我们会创建一个风力发电机的模型来检查所有指标的细节。这些是我们长期以来遵循的方法。但现在，不再需要制作原型和模型了。数字孪生让一切变得更加简单。我们可以通过其数字孪生提取风力发电机的任何必要信息。通过为航空发动机创建数字孪生，不仅可以了解其效率，还可以了解其安全风险。\n\
  \n## 数字孪生的优势 (ch06.xhtml#c_sec6_012_006)\n\n数字孪生是产品设计理念的福音。它们的增长将是产品开发中的一个持续过程。它们还能预测产品错误，在组装期间作为虚拟模板，并在整个生命周期内保持连接。它们保护了声誉并防止了成本损失（图\
  \ 6.9）。\n\n![图 6.9 数字孪生的技术与运营](img/fig6_9.jpg)\n\n图 6.9 数字孪生的技术与运营\n\n行业应用的示例：\n\
  \n* 航空发动机\n* 风力涡轮机\n* HVAC 控制系统\n* 机机车\n* 建筑\n* 公用事业（电、气、水和废水网络）\n* 大型结构，例如离岸平台、海上船舶等\n\
  \n## 智能抄表 (ch06.xhtml#c_sec6_13)\n\n如今，由于许多发展进程，对电的需求急剧增加。妥善维护电力正成为最大的挑战。电能泄漏、篡改和偷窃是维护账单的主要问题。我们还需要人工从用户的电表上读取读数。这是一个耗时的过程，有时电力部门人员的读数可能是错误或不准确的，可能会导致用户被收取额外费用。为了消除这些情况，在物联网（IoT）的帮助下出现了一种新技术，称为`智能计量`技术。智能计量是物联网最流行的领域之一。智能计量通过智能表提供先进的计量体系（`AMI`）。它不仅是对电力，还对水和气的资源消耗进行智能监控和读取。我们可以从机器、房间以及室内或室环境中获取读数。一旦我们安装了智能表，相应的读数将自动发送给能源供应商，这意味着我们将收到准确的而非估算的账单。由于所有智能表都经过产品安全与标准办公室认证，你可以确定你的智能表是准确的。智能表使用安全的国家通信网络（称为`DCC`）自动无线地将你的实际能源消耗发送给供应商。智能表仅向你的供应商发送电表读数；你的个人详情（如姓名、联系方式和银行详情）不会被智能表存储或传输到互联网。智能表不需要互联网即可通信。相反，它们通过两个无线网络工作：\n\
  \n1. `HAN`（家庭局域网）\n2. `WAN`（广域网）\n\n这些网络非常安全，类似于用于发送接收数据的移动通信。天然气和电智能表的安装大约需要 3\
  \ 小时。如果我们只想安装其中一种，将需要大约 60 分钟。\n\n\n\n\n### 实施智能农业之前需要考虑的因素\n\n1. **硬件**\n我们希望为您的设备配置传感器，以创建一个农业物联网解决方案。我们的选择将取决于我们想要收集的数据类别，从而取决于我们解决方案的目的。无论如何，所选传感器的标准对于产品的成功至关重要。所收集数据的准确性和可靠性将取决于此。\n\
  \n2. **大脑**\n每个智能农业解决方案的核心应该是数据分析。如果你无法对数据进行汇总分析，收集的数据本身将无济于事。因此，你需要强大的数据分析能力，并应用预测算法和机器学习（ML）来支持收集的数据，以获得可操作的洞察。\n\
  \n3. **维护**\n硬件维护可能是农业物联网产品面临的主要挑战，因为我们在农场中用于数据采集的传感器很容易损坏。因此，你必须确保硬件耐用且易于维护。否则，你将比想象中更频繁地更换传感器。\n\
  \n4. **移动性**\n为了在田间使用，智能农业应用应该量身定制。企业所有者或农场经理应该通过现场或远程的手机或 PC 访问数据。此外，每个连接设备都应该是独立的，并具有足够的无线范围来与对面设备通信并将数据传输到中央服务器。\n\
  \n5. **基础设施**\n为了确保你的智能农业应用运行良好，我们将确保它能够处理数据负载。你需要一个坚固的内部基础设施。此外，内部网络必须稳定。如果你没有保护你的设备，其他人窃取你的记录，甚至接管你的自动拉机将非常容易（见图\
  \ 6.11）。\n\n![图 6.11 IoT 设备出货量估计](img/fig6_11.jpg)\n图 6.11 IoT 设备出货量估计\n\n## 智能农业的优势：\n\
  \n* 增加产量\n* 节水\n* 实时数据和生产洞察\n* 降低运营成本\n* 提高生产质量\n* 精确的农场和土地评估\n* 改进畜牧业\n* 减少环境足迹\n\
  \n### 使用物联网进行畜牧管理\n\n在作物生产中，牲畜及其副产品粪具有重要意义。牲畜是提供动力的能量源，而粪便可以改善土壤结构、肥力以及持水能力。增强能量和营养循环对这两种用途都是环保的。农民可以在畜牧管理领域利用物联网非常密切地监控他们的牲畜。\n\
  \n可穿戴设备在追踪动物的每一个动作中起着关键作用。带有连接传感器的可穿戴设备可以追踪所有实时数据并将其发送云平台。通过使用这项技术，农民可以提高牲畜繁殖的标准，并良好地改善他们的经济状况。\n\
  \n### 监测牛的健康\n\n印度农民因动物疾病导致死亡的负面影响每年损失近 20 万亿卢比。物联网为农民提供了这些危机的清晰解决方案，并改进了畜牧管理中的健康保健。物联网为农民提供了低成本、低带宽的传感器连接可穿戴设备来追踪牛的健康。可穿戴设备中的传感器可以监测血压、心率、呼吸频率、消化、温度和其他生命体征，在疾病出现的第一个迹象时提醒农民（见图\
  \ 6.12）。\n\n![图 6.12 智能农业中的物联网](img/fig6_12.jpg)\n图 6.12 智能农业中的物联网\n\n通常，牛群很容易感染疾病。这可能会通过传播到每个个体导致巨大损失。物联网可以轻松检测牛群中的这些疾病，并允许农民发现可能患病的牛并将其隔离以避免扩散。物联网还能检测个体牛因饲料问题或其他参数引起的疾病，并在情况变得严重之前提醒农民。例如，如果牛受到任何疾病的影响，其体温可能会升高；比正常体略微升高就足以让物联网在牛的行为发生变化之前提醒农民。\n\
  \n### 监测繁殖周期和分娩\n\n物联网在繁殖周期中也非常好用。在分产前 8 小时，牛的体温必须略微升高。物联网可以很早提醒农民分产，从而提高牛养的效率和生产力。物联网还可以告知农民牛何时需要繁殖以及何时准备好人工授精等。通过拥有这些数据，农民可以轻松避免牛群中的各种损失。如果牛在分产期间在农场内，物联网会告知农民她是否开始分产并发送牛的位置，从而保护新生牛免受其他问题。\n\
  \n牛群中牛的位置追踪给农民带来了巨大的利益。它是畜牧管理中健康和繁殖周期中的一项重要功能。可以使用固定在牛脖周围的可穿戴设备中的连接传感器来追踪个体牛和牛群的位置。通过追踪牛群的位置，农民可以了解他们的牛在哪里放牧，并了解牧场的面积。\n\
  \n农民可以根据追踪每只动物的移动以及牛群迁徙提供的数据来建立并优化放牧模式。它还允许农民找到生病动物并对其进行更善的处理，并将发情期的牛群与人类隔离开。总的来说，这让农民能够处理和控制在多个英亩土地上放牧的牛。\n\
  \n### 精细化饲喂\n\n精细化饲喂为牛提供完美饮食的过程；它包含了牛正常生长和泌乳所需的所有必需营养。通过追踪放牧区域的位置，我们可以轻松计算它们的进食频率。我们还了解到牛群的放牧模式，从而允许农民以适当比例喂养牛群。通过监测牛群的具体行为（如放牧、社交、躺卧和反刍），农民可以避免浪费食物或过度喂养牛，了解这些活动的频率。\n\
  \n### 最大化产奶\n\n物联网也为奶牛农场提供了极佳的操作。通过在农场安装物联网，机器人可以通过提醒农民何时需要挤奶来实际上增加农民的工作量。它还可以控制农场上任何人的挤奶速度、牛奶质量和产量、饲料摄入量以及每天步数。通过这些数据，决定每个人的所需配置并更多关注产出优质牛奶的牛，农民可以提高产奶量。结果，泌乳过程经常提高了农场的财务利润。\n\
  \n\n\n\n最终，农民是照料牲群的人，但物联网（IoT）可以优化并简化许多牧场流程。IoT 可以轻松监测位置、肥力状况、温度、消化、放牧模式、泌乳以及农场中的每一个环节。通过了解所有数据，农民最终可以以进步的方式增加生产力、效率和收入。无疑，除了农业之外，农业在满足人类需求方面也发挥了巨大作用。实施物联网对于牲畜管理以及人类生活将非常有效。\n\
  \n## 联网汽车\n\n联网汽车是物联网最具前景的产品之一。联网汽车是目前革命性的事物。它是传统车辆的升级版本。联网汽车可以与车内外系统进行双向通信。联网汽车可以共享互联网访问和数据以实现高效驾驶和安全。通过物联网，我们可以相互通信并理解车辆的每一次移动（图\
  \ 13）。\n\n![图 13 智能追踪](img/fig_13.jpg)\n\n图 13 智能追踪\n\n联网汽车可以共享周围的所有数据（360 度）。它们从附近或经过的车辆收集数据并自动做出响应。展望未来，联网汽车能够使用“专用距离通信（DSRC）”。它们在\
  \ FCC 批准的 5.9GHz 频段运行。它们具有极低的延迟。联网汽车的引入是为了安全目的，但现在被用于各种用途。联网版本的连接种类得到了增强。\n\n以下是五不同的连接类型：\n\
  \n*   `V2V – 车与车`\n*   `V2I – 车与基础设施`\n*   `V2C – 车与云端`\n*   `V2P – 车与行人`\n*   `V2X\
  \ – 车与万物`\n\n`车与车技术`提供周围车辆之间的信息（数据）交换。它准确地共享车辆当前的实时位置和速度，用于安全并避免不必要的交通冲突。\n\n`车与基础设施技术`提供车辆与基础设施之间的通信。它将车辆生成的信息共享给司机。这种\
  \ `V2I` 技术用于通信安全、移动性和环境信息，例如天气状况、风速和温度。\n\n`车与云技术`用于共享车辆与云端系统的信息。这允许车辆使用来自工业、智能家居等云系统的信息。\n\
  \n`车与行人技术`提供车辆与基础设施、环境和其他车辆之间的连接。这种技术生成关于环境的信息，并共享给其他车辆以确保安全和移动。因此，这项技术提供了道路上车辆与行人之间的通信。\n\
  \n`车与万物技术`是联网汽车连接的最终目标。它轻松增强与基础设施、环境和其他车辆的通信。这种技术还提供了汽车、轨道、船只和飞机之间的连接。因此，它以精确的方式完成一切。\n\
  \n联网汽车主要使用 3G/4G 数据连接来共享车辆与移动设备、智能助手以及全球网站之间的信息和通信。估计 2019 年全球售出了超过 2850 万辆联网汽车（图\
  \ 14）。\n\n![图 14 美国联网汽车预测](img/fig_14.jpg)\n\n图 14 美国联网汽车预测\n\n*   提高道路安全性\n*  \
  \ 避免交通拥堵\n*   环保\n*   提供城市和郊区移动性\n*   避免事故\n*   提供信息娱乐\n*   实现增强通信\n*   紧急呼叫\n\n\
  在上述观点中，联网汽车在实时应用方面许多优势。\n\n联网汽车将对普通道路和交通产生巨大变化。我们的新一代将在道路上体验新事物。它们将关于车辆的一切连接到我们的手中。我们可以获取关于车辆的所有实时数据，如速度、油箱中的燃料量、轮胎气压、环境变化等。\n\
  \n如果车辆预计发生事故，云系统会自动向带有当前位置的公共中心发送紧急呼叫。这有助于司机从附近的医院或健康中心获得快速急救，从而增加道路使用者的生存机会。如果车道上的车辆发生任何事故或故障，车辆在靠近之前向同一车道上的其他车辆发送适当信息。因此，它可以帮助其他车辆变换车道。\n\
  \n联网汽车还与路口的信号通信并随时间做出恰当动作。如果身体残障人士想过马路，信息将发送给过马路的车辆，以便其停下让行人通过。同样的信息也会传输给第一辆车后面的所有车辆，从而避免意外事故和拥堵。联网汽车将提高驾驶标准和安全性。它们从各个方面为社会的贡献更多。\n\
  \n## 结论\n\n物联网（IoT）正等待着我们提供全新的革命性生活方式。当我们听到物联网、人工智能、机器学习、数据分析、区块链、云计算等词汇时，许多人感到恐慌或好奇。我们认为这些技术非常复杂，但现实是，只要我们准备好与它们握手，它们就是为我们的日常生活带来终变化的简单事物。预计到\
  \ 2020 年，全球将有超过 5000 万设备连接到物联网。工业 4.0 是这十年的最终目标之一，物联网在工业 4.0 的实施中起着至关重要的作用。物联网有很多工业应用，正如上面所述。它们是工业革命的关键。制造业的所有常规方式正通过智能制造实现数字化。所有制造业的标准将达到顶点。因此，智能计量、智能农业、车队管理、物流维护、数字孪生、云计算、资产追踪、联网汽车以及通过物联网的许多新事物为人类和机器开辟了生活的新版本。\n\
