  \n图 9.8 心率跟踪器\n\n## K-Means 聚类的现实世界用案例 (#ch09.xhtml#c_sec9_7)\n\n以下是 K-means 聚类算法的一些有趣的用案例：\n\
  \n1.  **记录分类**\n\n\n\n\n\n它根据标签、主题和报告的实质对归档进行分类分类。这是一个极其标准的排序问题，由于这个原因，`K-means`\
  \ 是一项非常合适的计算方法。报告的底层准备工作预计会将每条记录视为一个向量并进行术语复用。\n\n## 2. 货运存储优化\n它通过结合 `K-means`\
  \ 寻找调度区域的最佳中心点，以及利用遗传算法将车辆路线解析为旅行推销问题（TSP），从而改进了利用汽车无人机的高质量货运流程。\n\n## 3. 识别犯罪高发地\n\
  通过识别城市中特定区域发生的犯罪信息，犯罪类型、作案区域以及两者之间的关系，可以深入了解城市或区域内犯罪倾向倾向的区域。\n\n### 4. 客户分群\n分组有助于营销人员优化其客户数据库，针对目标区域进行推广，并根据之前的购买记录、兴趣或浏览活动对客户进行细分。\n\
  \n## 5. 梦幻选秀统计研究\n分析参与者详情一直是选秀场景的基本组成部分，随着竞争的加剧，AI 在此领域承担着基本任务。作为一个有趣的活动，如果你可能想创建一个梦幻选秀阵容，并根据球员详情识别类似的团队，`K-means`\
  \ 可以是一个非常有价值的替代方案。\n\n问题在于：你建议在小组里拥有谁？哪些球员会对你的小组表现最好并让你能够击败对手？赛季初的挑战在于，可帮助你识别优秀球员的信息较少。\n\
  \n## 6. 欺诈或犯罪活动检测\nAI 在欺诈检测中起着基本作用。这在汽车、医疗和保险欺诈检测中有多种应用。它利用有关欺诈场景的历史记录，根据其与显示假案例组的相似性进行判断。识别欺骗的能力是主要且必要的。\n\
  \n问题在于：你需要调查虚假的驾驶行为。挑战在于你如何感知什么是真实的，什么是伪造的？\n\n分组如何运作：通过探测 GPS 详情，计算可以收集比例实践。考虑到收集到的属性，我们可以将其示例为真实和伪。\n\
  \n## 7. 网约车数据分析\n公开的 Ola 行车数据集提供了有关流量、旅行时间、上车点等的数据。分析这些信息对于 Ola 来说是有价值的，同时也为顺畅旅行提供了所需的知识。\n\
  \n### 8. 罪犯数字画像\n数字画像是从个人和群体中收集信息以识别关键关系的方法。数字画像的可能性获取自非法画像，它提供了关于分析分布的数据，用以安排犯罪现场存在的各种罪犯类型。\n\
  \n## 9. 通话记录详情分析\n它利用电信公司在客户通话、短信和网络活动期间捕获的数据。当这些数据与客户社会经济状况结合使用时，提供了关于客户需求的更具意义的见解。我们可以使用无监督的\
  \ `K-means` 分类算法对客户活动进行 24 小时的分组。它被用于理解客户按小时使用的细分情况。\n\n### 10. 信息技术告警的自动化分组\n大型\
  \ IT 基础设施研究单元会产生大量的结构化消息。由于这些信息涉及配置问题，在执行过程中应对它们进行物理检查以确定优先级。信息的组合可以帮助理解告警分类和干预修复，并帮助预测故障。\n\
  \n### 11. 识别假新闻\n假新闻不是一种新现象，但它正变得日益泛滥。\n\n问题所在是：虚假报告正在被制作，这些报告以新奇进展的快速速度传播，例如在线媒体。所选的主题在\
  \ 2016 年美国大选期间被认为是过时的。“虚假报告”这一短语被建议了极高频率。\n\n计算的工作方式是通过捕捉非真实报告的内容、正文，查看正在的。\n\n\
  ### 12. 垃圾邮件检测\n你知道垃圾邮件箱中的垃圾邮件吗？AI 在垃圾邮件检测中发挥基本作用。\n\n问题在于：你需要调查虚假开发，利用算法来识别垃圾邮件。\n\
  \n分组如何运作：通过探测 GPS 详情，计算可以收集比例实践。考虑到收集到的属性，我们可以将其示例为真实和伪。`K-means` 分类方法被证明是区分垃圾邮件的有效方法。这种方法的精度达到了\
  \ 97%。对于那些错过优惠的人来说，这些数据是有价值的。\n\n### 13. 产品营销与销售\n营销和吸引客户展示产品对于大型公司来说至关重要。\n\n问题在于：为了你的营销预测获得最大的收益，你需要采取正确的方法针对客户。如果你未能理解情况，可能会面临无法达成交易的风险，或者损害客户的信任。\n\
  \n聚类算法可以将具有相似属性的人聚集在一起。\n\n\n\n\n\n问题所在于：想象一下，你正按预期受到限制，并且需要快速协调归档中的数据。为了完成这项任务，你需要理解内容的主题，将其与其他归档进行对比，并对其排序。\n\
  \n聚合功能如何工作：分层次打包法被用于处理这一主题。估计算法可以查看内容并将其组造成各种事项。实施此过程将有助于根据感知到的特征，快速地聚合和协调可比的报告。\n\
  \n## K-Means 聚类算法作为以下业务问题的解决方案\n\n### 买家细分\n\n当你完成分组分析后，你可以识别买者的特征。为了做到这一点，你可以利用细分、心理和行为信息以及执行信息对针对特定商品类的买家进行分组。\n\
  \n接下来，你可以对小组进行画像，以更好地了解买家，并根据用于分组的因素对其进行描述。你可以利用这些数据定制你的展示信息、产品系列和整体购物体验，以解决客户的问题并提高投资回报率（ROI）。\n\
  \n### 运输优化\n\n零售商和服务供应商希望通过 `k-implies` 聚类来优化其运输流程。对运输路线以及卡车和机器人示例进行了检查，以便为组织找到理想的配送区域、路线和目标。\n\
  \n### 存档排序与聚合\n\n你可以通过 `K-implies` 聚类根据分类、标签、内容或使用频率对电子文档进行聚合。算法将每个存档视为一个向量，并根据特定术的频率来安排和聚合记录。\n\
  \n### 客户维护\n\n你可以利用 `K-implies` 聚类来分析和分组客户互动，以根据维护情况识别并描述你的买家。你可以利用各种因素，例如购买频率、最近访问商店的时间、每次购物的平均花费以及容器布局，来分析和预测特定客户部分的忠诚度水平。\n\
  \n### 折扣分析\n\n你可以利用 `K-implies` 聚类根据客户的折扣购买习惯分析不同的客户群体。客户可能倾向于购买包装商品、具有普通低价策略的商品或到期前的廉价商品。你可以利用该算法识别客户之间的购买模式，并利用这些数据做出有关估算和限制时间策略的决策。\n\
  \n# K-Means 聚类与其他无监督算法的比较\n\n在本节中，讨论了 `K-means` 聚类算法与其他无监督算法的比较，即层次聚类算法（`HC`）、自组织映射算法（`SOM`）和期望最大（`EM`）聚类算法。\n\
  \n`Table 9.1` 显示了在保持聚类数（`K`）等于 32 的情况下，上述四个算法在性能和准确性参数方面的比较。\n\n表 9.1 `SOM`、`K-Means`、`EM`\
  \ 和 `HC` 的性能与准确性比较 `K = 32`\n\n| 参数 | `SOM` | `K-Means` | `EM` | `HC` |\n| :---\
  \ | :--- | :--- | :--- | :--- |\n| 性能 | 78 | 84 | 84 | 87 |\n| 准确性 | 830 | 910 |\
  \ 898 | 850 |\n\n`Table 9.2` 显示了在保持聚类数（`K`）等于 32 的情况下，上述四个算法在数据类型方面的比较。\n\n表 9.2\
  \ `SOM`、`K-Means`、`EM` 和 `HC` 的数据类型比较 `K = 32`\n\n| 数据类型 | `SOM` | `K-Means` | `EM`\
  \ | `HC` |\n| :--- | :--- | :--- | :--- | :--- |\n| 随机 | 830 | 910 | 898 | 850 |\n\
  | 理想 | 798 | 810 | 808 | 829 |\n\n`Table 9.3` 显示了在保持聚类数（`K`）等于 32 的情况下，上述四个算法在数据大小方面的比较。\n\
  \n表 9.3 `SOM`、`K-Means`、`EM` 和 `HC` 的数据大小比较 `K = 32`\n\n| 数据大小 | `SOM` | `K-Means`\
  \ | `EM` | `HC` |\n| :--- | :--- | :--- | :--- | :--- |\n| 36,000 | 830 | 910 |\
  \ 898 | 850 |\n| 4000 | 89 | 95 | 93 | 91 |\n\n# 优缺点\n\n优点：\n1. 如果 `K` 较小且变量很多，那么计算速度将比层次聚类快。\n\
  2. 如果聚类是球形的，它将产生比层次聚类更紧密的聚类。\n\n缺点：\n1. 预测 `K` 值很困难。\n2. 不同的初始划分会导致不同的聚类结果。\n3.\
  \ 它在处理不同维度和不同尺度时表现不佳。\n\n## 结论与未来工作\n\n分组研究问题一直吸引着研究者的兴趣，因为它处理具有共同属性的文章。当你开始进行聚类时，`K-means`\
  \ 是一个简单且灵活的可尝试算法。`K-means` 聚类是最流行的聚类算法之一，通常是从业者在解决批处理任务时首选的以获取结构概念。`K-means` 的目标是将数据中心聚合为不同的互不重叠的子组。\n\
  \n总体而言，`K-means` 计算通过欧几里距离来获取组别。`K-means` 计算实现简单，但对于覆盖信息索引并不有效。实验结果具有位置。解决这一问题的方法是使用事实距离而非欧几里距离。\n\
