  \n### 7\n\n## 使用单投票模型的员工流失预测](#contents.xhtml#toc1_8)\n\nR. Valarmathi^(1), M. Umadevi^(2),\
  \ 以及 T. Sheela^(3)\n\n¹钦纳伊，Sri Sairam 工程学院计算机科学与工程系\n²钦纳伊，SRM 科学技术学院计算机科学与工程系\n\
  ³钦纳伊，Sri Sairam 工程学院信息技术系\n\nDOI: [10.1201/9781003119838-7](https://doi.org/10.1201/9781003119838-7)\n\
  \n### 目录\n- 引言\n- 主管的角色\n- 人事部门的角色\n- 相关工作\n- 系统实现\n- 数据预处理\n- 使用的材料和方法\n    - 逻辑回归\n\
  \    - 朴素贝叶斯分类\n    - 投票分类器\n- 结果与讨论\n- 结论\n- 参考文献\n\n## 引言](#ch07.xhtml#c_sec7_1)\n\
  \n员工从一家公司跳到另一家公司被称为流失。员工由于金福利不足、工作压力、工作与生活平衡、缺乏晋升机会等原因更换公司。流失率随年龄组、性别、婚姻状况、工作部门和职位角色而异。当流失率过高时，公司和雇主将面临各种问题。从市场上选择具有匹配教育背景和工作经验的合适员工是一项挑战。招聘新人或替换现有员工需要培训和时间来获得该领域、使用的工具以及需要准备的文档的专业知识。在新人员工加入期间，服务质量会受到影响。由于某些公司提供较低的流失率，这些新员工在新的工作领域努力达到最佳状态。\n\
  \n### 主管的角色](#ch07.xhtml#c_sec7_001_001)\n\n主管在提升员工士气方面起着主要作用。根据员工偏好和个人承诺，主管可以决定部门转移、工作地点。新员工学习工作道德并从主管获得培训。\n\
  \n### 人事部门的角色](#ch07.xhtml#c_sec7_001_002)\n\n人力资源（HR）部门是公司的大脑。人事部门必须制定正确的公司政策并做出决策，使员工获得工作与生活平衡以及正确的薪酬。当出现职位空缺时，人事在招聘合适人方面起着核心作用，减少主管的负担和培训时间。人事部门还决定年假政策、工作时间以及各项设施。\n\
  \n## 相关工作](#ch07.xhtml#c_sec7_2)\n\n所提工作使用 `CART` 选择前 10 个特征。不平衡数据集被分为 60% 和 40%，从而减少了偏差并提高了所构建模型的灵敏度和特异性。1。作者通过六种不同的机器学习（ML）算法解决了员工离职问题，即：`SVM(RBF)`、`XGBoost`、逻辑回归、朴素贝叶斯、受控深度随机森林以及\
  \ `LDA` 和 `KNN`。正如预测的那样，这些算法在 `AUC`、运行时间和内存利用率等方面表现良好。实验结果显示 `XGBoost` 在准确性和内存利用率方面优于所有其他算法。逻辑回归运行算法最少耗时\
  \ 52 秒。2。作者通过分析人力资源数据集的不同规模（小、中、大）和复杂度，展示了 10 种不同监督分类器对员工离职的预测。作者提供了使用统计方法的指南，并推荐使用\
  \ `梯度提升` 分析大数据，因为它处理数据所需的时间更短，并且能够自动可靠地对特征排名。3。IBM Watson 创建的员工消耗数据集可以预测员工离职。4。研究人员提出了加权二次随机森林方法。作者遵循了两个步骤的过程：第一步减少维度并选择重要特征；第二步在每个决策树的选定特征上应用\
  \ `F 指标`。作者识别出的影响员工离职的两个重要特征是月收入和加班。5。在这些研究中，算法在最佳特征排名方面存在不足 6–9。\n\n\n\n\n作者对医院护士流失率进行了调查，并发现工作满意度、年龄和压力是影响护士流失的主要因素[11\\\
  ]。随机森林方法有助于提高个体分类器的准确性和多样性。多样性通过特征轴实现，准确性则通过主成分实现[12\\]。研究人员[13\\]指出，与 SVM、NN 和基于树的集成相比，随机森林对于实值属性是一种更好且更准确的方法。他们在包含约\
  \ 200 个分类问题的三个不同数据集上评估了性能，基于错误、ROC（受试者工作特征曲线）、负对数似然和平衡误差等四个参数。朴素贝叶斯模型[14\\]被用于 HR\
  \ 数据集以预测流失。作者[15\\]使用动态部分分图对工作记录进行建模。\n\n## 系统实现\n\n为了便于理解，系统被划分为若干部分。系统内部的完整部分如下：\n\
  \n* 数据预处理\n* 使用逻辑回归和基于网格搜索的朴素贝叶斯分类预测员工流失\n* 使用网格搜索将逻辑回归和朴素贝叶斯分类结合为单一投票模型，通过计算两个模型的平均值来预测员工流失\n\
  \n工作流如图图 7.1 所示。\n\n![图 7.1 系统流程图](img/fig7_1.jpg)\n\n图 7.1 系统流程图\n\n### 数据预处理\n\
  \n对数据集进行预处理以提高模型的准确性。合并了 HR 数据集和员工满意度水平。应用标签编码（Label encoding）将名称转换为数字。\n\n## 使用的材料与方法\n\
  \n### 逻辑回归\n\n逻辑回归是一种寻找特定事件概率的二分类模型，例如尾/头、0/1 或不健康/健康。二分类模型具有两个类别值的问题，如真/假和买/卖。它是一种通过\
  \ logit 函数找到其值来预测分类因变量的统计模型。1972 年，Nelder 和 Wedderburn 创建了这种方法，它是广义线性模型（GLM）的一部分。\n\
  \n为了预测连续值数量（如房屋价格），使用了输入值（如房屋的平方英尺）线性函数的线性回归模型。为了预测离散值（如预测代表“0”数字或“1”数字的像素强度），则使用了输入值的逻辑函数的逻辑回归模型。因此，它是一种用于学习做出此类决策的简单分类算法。它是有监督机器学习模型之一。在有监督学习中，响应变量\
  \ `B` 用输入变量 `A` 表示，它将输入映射到输出。\n\n`B=f(A)`\n\n当响应变量 `B` 是如“绿色/红色”、“好/坏”之类的类别类型时，则使用分类模型；而当响应变量\
  \ `B` 是如“美元”或“重量”之类的连续值时，则使用线性回归模型。该模型用于给定的独立变量通过如“已婚/未婚”或“男性/女性”等值计算响应变量的值。因此，它是具有分类预测值的线性模型的一种，使用优势对数（log\
  \ of odds）作为因变量。\n\n### 逻辑回归的分类\n\n1. **二分类逻辑回归**：当因变量（目标）仅有两个结果时（如“快乐”或“悲伤”），使用二分类逻辑回归。\n\
  2. **多分类逻辑回归**：当因变量（目标）有三个或多个无顺序的响应时（如偏好的颜色，“红色”、“蓝色”或“绿色”），使用多分类逻辑回归。\n3. **序次逻辑回归**：当因变量（目标）有三个或多个有顺序的响应时（如成绩等级（“A”、“A+”、“B+”、“F”）），使用序次逻辑回归。\n\
  \n### 推导 Logit 函数\n\n作为预测变量/独立变量 `X` 的函数的响应变量 `Y` 表示如下：\n\n`Y=α+X` (7.1)\n\n其中，`α`\
  \ 是常数项，当考虑其他因素时事件发生的概率。方程 (7.1) 是表示二分类结果“是”或“否”的连接函数。我们可以创建一个虚拟变量 `P` 来指示观测值是是还是否（即\
  \ `P = 1 / P`）。通过以下两点完成：\n\n1. 得到 `P` 的概率\n2. 得到“否”(1–P) 的概率，其中 0≤P≤1。\n\n概率值应该是正数，为了使其成为正数，我们找到方程\
  \ (7.1) 的指数值为：\n\n`P=e^(α+X)` (7.2)\n\n为了将 `P` 限制在 0≤P≤1 之间，将 `P` 除以至少比 `P` 大一个的值：\n\
  \n$P = \\frac{e^{\\alpha + \\beta(X)}}{1 + e^{\\alpha + \\beta(}}}$\n\n根据方程 (7.1)，`Y\
  \ = α + β`，结合方程 (7.2) 和 (7.3)，我们可以将 `P` 写如下：\n\n$P = \\frac{e^{y}}{1 + e^{y}}$ (7.4)\n\
  \n其中，`P` 是 Logit 函数，给出了“是”的概率。现在得到“否”的概率 1–P 写为：\n\n$1 - P = 1 - \\frac{e^{y}}{1\
  \ + e^{y}}$ (7.5)\n\n通过方程 (7.4) 和 (7.5)，我们可以得到：\n\n$\\frac{P}{Q} = \\frac{e^{y}}{1\
  \ + e^{y}}$ (7.6)\n\n通过简化方程 (7.6)，我们可以得到：\n\n$\\frac{P}{Q} = e^{y}$ (7.7)\n\n对方程\
  \ (7.7) 取对数，得到：\n\n$\\begin{array}{l} Y = Log\\left( \\frac{P}{1 - P} \\right) \\\
  \\ \\end{array}$ (7.8)\n\n将 (7.1) 代入 (7.8)，得到：\n\n$Log\\left( \\frac{P}{1 - P} \\\
  right) = \\alpha + \\beta\\left( X \\right)$ (7.9)\n\n其中 $\\frac{P}{1 - P}$ 是优势比。它是逻辑回归中使用的连接函数。因变量的对数值用于模拟非线性关联。每当优势比的对数为正时，成功的概率总是大于\
  \ 50%。\n\n### 逻辑回归模型的性能\n\n逻辑回归模型的各种性能验证参数包括零离差和残差差、混淆矩阵以及 AUC-ROC 曲线。\n\n1. **零离差和残差差**：零离差是在不考虑任何输入时模型预测结果的衡量，而残差差是在考虑独立变量时模型预测结果的衡量。值越小，性能越好。\n\
  2. **混淆矩阵**：它是实际类别结果与预测类别结果的表格形式表示（所示），用于衡量其他指标，如准确率、精确率、召回率和 F 值。\n\n`Specificity/TNRate\
  \ = \\frac{A}{A + B}`\n\n`FP/Rate = \\frac{B}{A + B}`\n\n`Sensitivity/TPRate = \\\
  frac{D}{C + D}`\n\n`FN/Rate = \\frac{c}{c + d}`\n\n| 实际类别结果 ||  || 预测类别结果 |\n| ---\
  \ | --- | --- |\n| 是 || 否 |\n| 是 | 真阳性 TP (D) | 假阴性 FN (C) |\n| 否 | 假阳性 FP (B) |\
  \ 真阴性 TN (A) |\n\nTP 和 TN 是预测正确的数据项，而 FP 和 FN 是不正确的数据项，即实际类别与预测类别冲突。\n\n\n\n\n**真阳性\
  \ (TP)** – 显示了可接受的预测值，即实际类别结果与预测类别结果具有相同的值。\n\n**真阴性 (TN)** – 显示预测值是无效的，即实际类别结果与预测类别结果具有不同的值。\n\
  \n**假阳性 (FP) 和 假阴性 (FN)** – 显示预测值是无效的，即实际类别结果与预测类别结果具有相互矛盾的值。\n\n**准确率 (Accuracy)\
  \ –** 它是预测正确的总观测数占总观测数的百分比。准确率越高，模型越好。如果模型具有由等数量假阳性值和假阴性值的对称数据集，则准确率被认为是性能的极佳衡量标准。它在公式\
  \ (7.10) 中写作：\n\n${Accuracy} = \\frac{A + D}{A + B + C + D}$(7.10)\n\n**精确率 (Precision)\
  \ –** 它是预测正确的总观测数占所有正预测观测数的百分比。精确率越高，假阳性率就越低。\n\n`Precision = D/B + D`\n\n**召回率\
  \ (Recall/灵敏度）** – 它是正预测观测总数占实际类别所有观测数的百分比。\n\n`Recall = D/C + D`\n\n**F1 分数 (F1\
  \ Score) –** 精确率和召回率之间的权衡在公式 (7.11) 中表示为 F 分数。当类别分布不均匀时，此分数比准确率更实用。\n\n`F1 Score\
  \ = 2 * (Recall * Precision)/(Recall + Precision)`(7.11)\n\n### 3. ROC 曲线 (接收者工作特征曲线)\n\
  \n它给真阳性和假阳性之间的权衡。由于模型关注成功率，假设 `P` 值大于 0.5。ROC 曲线代表了所有大于 0.5 的 `P` 可能值。\n\n### 朴贝叶斯分类\n\
  \n朴贝叶斯分类是一种基于贝叶斯定理进行预测分析的机器学习算法。它是一种基于条件概率的分类模型。条件概率是衡量事件 B 发生后事件 A 发生的概率。它可以计算离散词（如垃圾邮件或非垃圾、已婚或未婚等）的概率。这些概率也被称为似然（likelihoods）。它由以下两个部分组成：\n\
  \n1. 朴素\n2. 贝叶斯\n\n### 贝叶斯定理\n\n这是一个用于计算事件条件概率的定理。考虑事件 A 和 B。事件 A 发生的概率为 `P(A)`，事件\
  \ B 发生的概率为 `P(B)`。贝叶斯定理显示了事件 A 在事件 B 发生之前的概率之间的关系。在得到事件 B 后事件 A 发生的概率 `P(A/B)` 如下：\n\
  \n$P\\left( \\frac{A}{B} \\right) = \\frac{P{(\\frac{B}{A})}.P\\left( A \\right)}{P\\\
  left( B \\right)},$(7.12)\n\n其中 `A` 是假设，`B` 是证据，`P(A/B)` 是在给定 B 的情况下 A 的条件概率，它告诉我们在\
  \ B 发生的情况下 A 发生的频率。它是后验概率，即证据发生后事件的概率。`P(B/A)` 是在给定 A 的情况下 B 的条件概率，它告诉我们在 A 发生的情况下\
  \ B 发生的频率。`P(A)` 是先验概率，即证据发生前事件的概率。\n\n### 数据集\n\n用于分类的数据集由：\n\n* 称为输入特征的独立变量集\n\
  * 因变量/输出变量\n\n输入特征中的每个属性都是相互独立的。特征矩阵中的特征之间始终存在很独立性。因此，它被称为朴素（Naive）。此外，输入特征中的每个属性对预测输出类别都有等等的贡献。\n\
  \n### 朴贝叶斯分类的类型\n\n### 多项朴贝叶斯\n\n这是一种多元事件模型，用于将文本/文章分类为游戏、新闻、技术、电影等领域。\n\n### 伯努利朴贝叶斯\n\
  \n当因变量（目标）仅有两个可能的结果（如“快乐”或“悲伤”）时，使用的分类模型是伯努利朴贝叶斯。它是二项模型，因为输入独立变量只取二值值“是”或“否”。\n\n\
  ### 高斯朴贝叶斯\n\n当独立变量具有连续值而非离散值时，可以使用高斯分布或正态分布对它们进行采样，从而高斯朴贝叶斯分类。\n\n### 使用朴贝叶斯的好处\n\
  \n* 方法简单且分类速度快\n* 适用于多分类\n* 有效处理海量数据集\n* 性能优于其他模型（如逻辑回归）\n* 需要较少的训练数据\n* 对于分类数据的性能优于连续数据\n\
  * 计算成本低\n* 最适合文本分类问题\n\n### 应用领域\n\n* 优于其他算法，因此用于各种二分类\n* 朴贝叶斯与协同过滤一起用于推荐系统\n* 也用于基于健康参数的疾病预测\n\
  * 应用于脸识别\n* 朴贝叶斯用于根据大气状况（温度、风、云、湿度等）预测天气预报\n* 可用于实时预测\n* 可用于多预测\n\n### 投票分类器 (Voting\
  \ Classifier)\n\n结合多个分类器的预测。使用多个分类器来训练和验证数据集。最后通过多数投票得出预测。硬投票和软投票是多数投票的不同类别。\n\n\
  ### 硬投票\n\n在硬投票中，最终的预测类别标签将是大多数分类器的预测标签。例如，假设有三个分类器和两个类别 Dog 和 Cat。如果两个分类器预测 Dog，一个分类器预测\
  \ Cat，则选择 Dog。\n\n### 软投票\n\n在软投票中，最终的预测类别标签将是所有分类器的概率。例如，对于该问题，取三个分类器 `M1`、`M2`\
  \ 和 `M3` 以及两个类别 `Dog` 和 `Cat`。\n\n$\\begin{array}{l} {M1 - > {0.4,0.7}} \\\\\\\\\
  \ {M2 - > {0.2,0.8}} \\\\\\\\ {M3 - > {0.7,0.3}} \\\\\\\\ {{Probability}{of}{Dog}\
  \ = 0.33 \\ast 0.4 + 0.33 \\ast 0.2 + 0.33 \\ast 0.7 = 0.429} \\\\\\\\ {{Probability}{of}{Cat}\
  \ = 0.33 \\ast 0.7 + 0.33 \\ast 0.8 + 0.33 \\ast 0.3 = 0.594} \\\\\\\\ \\end{array}$\n\
  \n组合分类器的预测概率为 `42.9%, 59.4%`。选择概率为 `59.4%` 的 Cat。以上是等权重软投票分类器的示例。\n\n### 结果与讨论\n\
