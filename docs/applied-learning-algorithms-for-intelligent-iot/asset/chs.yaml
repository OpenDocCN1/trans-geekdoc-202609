  \n## 引言 (#ch10.xhtml#c_sec10_1)\n\n### 内部碎片 (#ch10.xhtml#c_sec10_001_001)\n正受到技术的威胁。随着技术的发展，操作系统对存储空间的需求日益增加。对于用户和操作系统开发者来说，只有当存在有效管理内存的方法，系统才能高效运行。频繁地需要在内存中移动和移除进程。在这样做时，存在碎片问题。过一段时间后，系统将进程接纳到内存中将变得困难。内部碎片的一个重要原因是为尺寸较小的进程分配了较大的内存空间。\n\
  \n### 最佳适应方法与内存库 (#ch10.xhtml#c_sec10_001_002)\n内部碎片的主要原因是内存块相对于需要接纳的进程的大小太大。在这种情况下，部分内存被遗留，其他进程也无法占用该内存空间。可以在内存管理系统中创建一个内存库，它类似于主内存，但它也是一种被划分的虚拟内存。当使用最佳适应方法占用内存块时，剩余内存可以移动到该内存库。剩余空间的累积将足够任何其他进程占用内存库中的空间。\n\
  \n\n\n\n\n在网络与通信领域，动态内存分配的需求正以更快的速度增长。根据 Stylianos Mamagkakis 等人的观点，实时操作系统使用了先进的动态分配器\
  \ [1]]。到目前为止使用的五类内存分配器改进了动态内存分配过程，但未能为内部碎片提供永久解决方案。现有的内存分配器无法完全满足网络中有线和无线应用分配不同大小内存块的需求。正如作者\
  \ Voss M. 所述，由于该过程依赖于动态内存分配，它容易产生内部碎片，并导致运行时内存请求的严重流量拥塞 [2]]。因此，在操作系统世界中，这些现有分配器的效率、性能和去碎片技术仍然稀少\
  \ [3]]。\n\n## 内部碎片标准与系统兼容性\n\nChristian Del Rosso 表示，当发生内部碎片时，系统的兼容性受两个重要源的控制，即配置和竞争。在对\
  \ DVB-H（数字视频广播——手持设备）和 T-DMB（地面数字多媒体广播）移动数字多媒体广播标准进行研究时，观察到系统与发生的碎片问题并不兼容。研究人员提出了采用单一标准和内部标准碎片化等技术\
  \ [4]]。这种现象在移动操作系统领域也被发现普遍存在。兼容性问题进一步降低了系统的性能。人员发现加载地址和向内存写入数据存在延迟 [5]]。兼容性问题在开发后期通过优化后的系统和新的内存管理技术得到了解决。\n\
  \n## 处理器分配与内部碎片\n\n引入了若干策略来限制系统中的碎片产生率。其中一种策略是自适应非连续分配算法（Adaptive Non-Contiguous\
  \ Allocation）。它基于分区绑定和处理器分配的基本原理。该算法还避免了并行条件下的请求过度分割。根据作者 Bani Ahmad 的说法，选择了一个分区绑定的最优值，这将使算法更具活性和可调性。使用这种方法，可以根据分区边界值快速为处理器分配并行作业\
  \ [6]]。与其他现有的非连续内存分配技术相比，该策略被发现与通信中的高负载具有兼容性 [7]]。在考虑较大规模实现时，连续内存分配无法降低内部碎片的比例。\n\
  \n## 机器学习与云存储\n\n用于保障数据安全的现有机器学习（ML）算法会根据临时行为数据将节点分类为异常节点。这些系统无法区分异常节点是恶意节点还是损坏节点。因此，为了解决这一不安全问题，该工作提出了一种长短期记忆（LSTM）模型\
  \ [8]]。该模型最初学习用户的行为，并自动训练自身存储行为数据。模型可以轻松地将用户行为分类为标准或非标准。它还可以通过计算的信任因子发现非标准节点是损坏节点、新用户节点还是被篡改节点。所提出的技术可以检测安全攻击并保护云端。\n\
  \n## 最佳适应方法与内部碎片\n\n根据 Rachael Chikoore 等人的研究，遗传算法证明是减少系统内存管理中产生内部碎片的一种有效方法 [9]]。为了产生最优配置，将工作负载作为输入。采用合理方法通过遗传算法寻找解决方案\
  \ [10]]。这些优化方法之一是最佳适应方法（best-fit approach）。在这种方法中，观察到进程大小大于内存大小。通过这种方法有效地解决了内部内存碎片问题，但在此过程中涉及某些内存浪费。尽管使用这种方法是有益的，但在考虑演化、复杂性和适应性时，它也有其缺点。它还为系统提供空分离列表（free\
  \ segregated lists）的优化配置参数铺平了道路。与历史上的“暴力破解”技术相比，最佳适应方法被发现是处理内部碎片的更更具启发性、可行且最优的方法。\n\
  \n## 存储与可靠性研究\n\n在当今世界中，对数据存储系统（DSS）日益增长的需求正变成一场噩梦，因为它们经常受到存储控制器中常见的软错误攻击。与遵循通用计算的架构相比，DSS\
  \ 中由硬件和软件组成的功能栈、错误检测和纠正尤为脱颖而出。现有的系统或技术并未解决这些软错误对 DSS 的系统级影响。本研究为存储控制器中错误的影响提供了清晰的视角，并分析了整个系统的可靠性。在所提出的技术中\
  \ [11]]，实现了在存储系统全栈上运行的多个存储控制器相关函数，并开发了一个新框架。使用存储脆弱性因子（SSVF）指标准确计算了存储系统中软错误的影响。该分析结果有助于得出结论：当\
  \ 40% 的缓存被用户数据占用时会发生数据丢失，且这种情况随存储配置而异。研究得出，数据不可用是由于缓存内存中可检测到但无法恢复的错误导致的。\n\n## Lasso\
  \ 回归分析与云计算\n\n云计算在用户需要时提供服务。云中的所有资源都堆叠在数据中心，这产生了最优资源分配方法。现有的解决方案包括贪心算法和机器学习算法。由于贪心算法本质上是\
  \ NP 困难的，无法提供最佳解决方案，但机器学习提供了接近最优的解决方案。在所提出的技术中 [12]]，岭回归和 Lasso 回归应用于用户数据集的资源需求。结论认为，由于正确选择了特征，所提出的算法比线性回归更好的结果。模型分析通过获取均方根误差（RMSE）完成并绘制了图表。观察到所提出的算法有助于虚拟机在\
  \ CPU 利用率和存储方面降低负载。\n\n## 数据放置与机器学习\n\n\n\n\n随着云计算使用的加速，许多应用程序对性能有了更高要求，这对可用存储空间产生了需求。从各种来源获取的数据将包含不同频率的读写、保留时间以及不同大小的数据。解决这一问题的方案是混合存储系统。其底层问题是根据运行状态以及数据和存储系统的其他几个属性，在混合存储中进行数据放置。在这项工作中，引入了\
  \ `Archivist` —— 一种用于存储系统的机器学习辅助数据放置机制，以最小化文件延迟。为了了解输入数据的访问模式，采用了机器学习方法。此外，还实现了一种数据放置算法，旨在增强存储介质上的数据。这是通过精确查找数据和存储的属性来实现的。实验结果表明，与基准相比，该系统的访问性能提升了高达\
  \ 49%。\n\n# 内存管理\n\n为了提高系统性能，应该增加核心数量。多项研究表明，内存管理是一个持续存在的问题，导致了性能下降，特别是在 Android\
  \ 设备中。现有技术侧重于通过分配更多资源来提高效率，很少有关注处理内部碎片。在所提的技术中，重点关注线程内行为。因此，引入了基于线程行为的内存管理 (`MMBT`)。但发现所提技术缺乏统一的优化接口和良好的架构。为了解决这个问题，提出了面向线程的内存管理层\
  \ (`TOMML`)。它使用了微内核架构，并能够满足用户选择插件以实现多样化优化目标的需求。最初，通过理论模拟和实验观察了 `TOMML` 的效率。结果，内存分配的百分比增加了\
  \ 12–20%。与之前的研究相比，该技术还通过允许用户选择插件来节省电力。\n\n# 现有技术\n\n内部碎片是操作系统领域面临的一个持续问题。`Best-fit`（最佳适应）方法已采用几十年并被认为是解决内部碎片的最佳方案。如图\
  \ 10.1 所示，考虑两个大小分别为 25 MB 和 30 MB 的进程 `P1` 和 `P2`。进程从辅助内存移动到主内存，并占用主内存中的一个块。`P1`\
  \ 和 `P2` 被安置在 1000 MB 的空间中，其中进程 1 仅占用 25 MB，进程 `P` 仅占用 30 MB。在上述每种情况下，`P1` 占用的 `fragment\
  \ 1` 中浪费了 475 MB 的内存空间，而 `P2` 安置的 `fragment 2` 中浪费了 470 MB 的空间。为了应对这种空间浪费，人们提出了许多理论，人员找到了利用内存中空间块的方法，该空间足够容纳进程，但不是最大的可用内存空间。这产生了至今一直采用的方法，被称为\
  \ `Best-Fit` 方法。在这种方法中，采用了分配最小但又足够容纳进程的分区的方法。然而，问题无法完全解决，但可以在一定程度上得到缓解。图 10.1 中现有系统的插图也显示，由于可用内存空间不足或不可用，系统缺乏将迁入的进程存储在主内存中的能力。`best-fit`\
  \ 方法为操作系统开发者多年来面临的内部碎片问题提供了一个即时但非优化的解决方案。在这里，为了说明之目的，使用了不同的颜色来区分浪费的内存空间与分配给进程 `P1`\
  \ 和 `P2` 的空间块。因此，这项研究工作提供了一种优化方法来避免这种内存浪费，从而为内部碎片找到了有效的解决方案。\n\n![图 10.1 内部碎片](img/fig10_1.jpg)\n\
  \n图 10.1 内部碎片\n\n# 提出的技术——处理内部碎片中剩余空间的优化方法\n\n图 10.2 所示的流程图提供了内存库方法的清晰视角。最初，将进程作为输入。当请求将进程从辅助内存移动到主内存时，进程首先进入页表。页表映射逻辑地址和物理地址。如果找到页面，有效位和无效位分别被设置为\
  \ `v` 和 `iv`；当内存中未找到页面时也是。在主内存中，进程根据最佳适应方法存储。在实现该方法后，如果内存块中留有某些剩余空间，则该空间会被累积并进入内存库。内存库可以看作主内存的一个实例，用于存储无法放入主内存的迁入进程。在内存库中，空间根据迁入进程的大小进行分配。重复此过程，队列中等待分配内存块的其余进程可以轻松地存储在内存库的后续块中。一旦内存库满且没有更多空间块进一步容纳进程，所提方法中的空间分配即终止。剩余空间的计算是内存库中可用空间的指示。这有助于开发者判断是否达到了阈值容量。它也证明了寻找可能在内存库中存储进一步迁入进程的可能性是有用的。因此，该技术有助于在实施最佳适应方法后防止空间浪费，且没有进程会在未分配特定内存块的情况下被遗留。\n\
  \n\n\n\n内存管理对于操作系统的有效运行起着重要作用。最初，当用户想要将进程从辅存移动到主内存时，该进程会进入页表。`Page table` 有助于将逻辑地址与物理地址进行映射。当进程请求访问主内存中的数据时，操作系统会存储虚拟地址到物理地址的映射。操作系统借助\
  \ `Page table` 的帮助来执行此操作，因为它存储了这些映射。每个映射被称为“页表项”（`PTE`），也被称为页号。\n\n进程如果被请求，就会进入内存。在这里，进程容易发生碎片化。在图\
  \ 10.3 所示所示的示意图中，发生了“内部碎片”。与其他碎片相比，内部碎片被认为难以重新获得或检索。这里的进程大于内存空间，但碎片化问题通过现有的“最佳适应算法（best-fit\
  \ Approach）”解决了。在此方法中，进程占据了等于或大于进程大小的内存块。在图 10.3 中，三个进程占据了内存空间，该空间大于进程的大小。因此，主内存块中存在剩余空间。这些遗留块被收集并存储在一个名为\
  \ `memory bank` 的主内存副本中。`memory bank` 可以被描述为内存的虚拟实例，可以容纳进程。开发者可以根据需要随时检索这些进程。这里描绘的内存\
  \ bank 用于存储因实施最佳适应算法后由于内部碎片产生的剩余空间。一旦主内存写满，就会出现存储不足的问题。因此，进入的进程无法存储在主内存中。这种 `memory\
  \ bank` 方法也可以有效用于解决存储问题。无法在主内存中安置的进入进程被推送到这个 `memory bank` 中。现在，我们已经存储在 `memory\
  \ bank` 中的遗留空间可以用来存储这些进程。在这里，一旦进程大小等于内存块大小，存储就会停止，剩余空间留给下一个进入的进程。这种方法现在以优化的方式解决了现有最佳适应算法技术中存在的内存浪费问题。它通过有效的内存管理提升了操作系统的性能。\n\
  \n![Figure 10.3 提议技术以示意图的形式表示](img/fig10_3.jpg)\n\n图 10.3 提议技术以示意图的形式表示\n\n### 内存库算法\n\
  \n输入：`psize_in_GB`（进程大小）、`process_name`（进程名）、`p_no`（进程号）、`frame_no`、`vi`、`memory_block_size`\n\
  \n输出：内存库中的剩余空间，带有进程大小和进程号的最佳适应和内存库方法的图形表示。\n\n## 线性回归\n\n## Lasso 回归\n\n## 使用开源软件\
  \ – Scilab 和 Jupyter (Python) 进行实现\n\n### 提议技术的伪代码\n\n### 使用 Scilab\n\n1. 声明进程大小（GB\
  \ 为单位）、进程号和进程名并进行初始赋值。\n2. 显示辅存中的进程。\n3. 确定进程和块的数量，并将分别存储在 `size_process` 和 `size_block`\
  \ 中。\n4. 定义 `Best-Fit func()` 并使用输入参数 `psize_in_GB`、`memory_block_size`、`size_process`、`size_block`\
  \ 进行调用。\n5. 声明一个最佳适应数组（这里使用了 `bf_allot`）和一个标志位数组 `bf_flag`。\n6. 使用 `k` 作为索引根据最佳适应方法分配块。初始化为零。\n\
  7. 如果 `psize_in_GB` 小于 `memory_block_size`，则更新 `k` 为索引位置。\n8. 在索引位置 `i` 处存储最佳适应方法，并将\
  \ `memory_block` 设置为 busy（忙用）。\n9. 使用输入参数 `psize_in_GB`、`process_name`、`p_no`、`frame_no`、`vi`、`memory_block_size`、`total_size`\
  \ 调用函数 `internal_frag()`。\n10. 显示有效无效位。\n11. 如果进程大小等于内存块大小，则成功存储在主内存中。如果内存块大小大于进程大小，打印“*发生了内部碎片*”。如果内存块大小小于进程大小，打印“*无法存储在内存中*”。\n\
  12. 返回内存 bank 中的空间。\n13. 一旦主内存写满，就会出现存储不足的问题。因此，进入的进程无法存储在主内存中。这种 `memory bank`\
  \ 方法也可以有效用于解决存储问题。无法在主内存中安置的进入进程被推送到这个 `memory bank` 中。现在，我们已经存储在 `memory bank`\
  \ 中的遗留空间可以用来存储这些进程。在这里，一旦进程大小等于内存块大小，存储就会停止，剩余空间留给下一个进入的进程。这种方法现在以优化的方式解决了现有最佳适应算法技术中存在的内存浪费问题。它通过有效的内存管理提升了操作系统的性能。\n\
  \n### 使用 Jupyter (Python)\n\n1. 加载数据集。\n2. 选择感兴趣的因变量和目标变量。\n3. 初始化线性回归和 lasso 模型。\n\
  4. 确定预测值。\n5. 评估模型。情况下，线性回归使用均方根误差，lasso 使用平均绝对误差。\n6. 打印误差值。\n7. 以收入和行业类型的形式绘制得到的线性回归。沿\
  \ y 轴，“0”代表小型工业，“1”代表发达工业。\n\n### 图形化表示\n\n### 结论 1\n\n在图 10.4 中，使用开源软件 Scilab 绘制了最佳适应块方法。推断出进程\
  \ 1、2、3 和 4 根据大小存储在主内存中。进程 4 大为 5 GB，但它被存储在 7 GB 的内存块中。实施最佳适应算法后，浪费了 2 GB 的剩余空间。由于没有大于或等于进程大小的块，进程\
  \ 5 未存储在内存中。\n\n### 结论 2\n\n从图 10.5 中，推断出最佳适应块方法后的剩余空间对于进程 2 为 2 GB。在图 10.4 中未绘制的进程\
  \ 5 现在作为 2 GB 的剩余空间，加上主内存中 1 GB 的可用内存块总共为 3 GB。该内存大小在内存库中可用，且进程 5 被绘制，因为它被存储在内存库中。\n\
  \n\n\n\n\n从图 10.6 可以推断出，行业收入在采用云基础设施方面也起着至关重要的作用。此处图表将行业类型分为两类进行绘制。`y` 轴代表发展中行业（标记为“0”）和发达行业（标记为“1”）。`x`\
  \ 轴以百万美元单位表示行业收入。从下方所示的图表中还可以观察到，由于某些地区的疫情情况、收入和行业规模等因素，大型公司与发展中行业相比主要采用了云基础设施。\n\
  \n![图 10.6 在采用云基础设施方面仍有落后的行业类型](img/fig10_6.jpg)\n\n图 10.6 在采用云基础设施方面仍有落后的行业类型\n\
  \n### 所使用的软件软件包\n\n1. `Sklearn`:\n    * `python` 中的 `sklearn` 软件包有助于实现许多机器学习算法。\n\
