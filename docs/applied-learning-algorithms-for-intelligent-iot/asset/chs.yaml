  \n\n\n### 引言\n\n人工智能（AI）的出现使机器变得“智能”。我们所指的“智能”，是指机器（很可能是计算机）能够像智能人类一样理性地处理给定的数据并做出合适的决策的能力。AI\
  \ 通过其算法子集的帮助实现了这种智能（见[图 1.1]）。\n\n\n\nAI 是一个更广泛的领域，包含了机器学习（ML）、人工神经网络（ANN）和深度学习（DL）作为其子集。AI\
  \ 通过 ANN 实现，ANN 是一种类似于生物神经元和神经系统的人工神经元网络。ML 使机器能够处理数据、做出决策并根据经验优化结果。ML 主要需要特征工程师完成特征工程过程。此外，ML\
  \ 在结构化数据集（主要包含数值数据）上效果最好，但被证明对于非结构化类型的数据效率低下。\n\n为了处理如视频、语音等非结构化且连续的数据，我们需要更复杂的神经网络。深度学习应运而生，它在处理非结构化数据方面具有更好的效果。深度学习最大的优势之一是它具有自动特征工程，即不需要手动选择特征。此外，当算法遇到优化问题时，ML\
  \ 需要人工干预，而这在深度学习中也是自动化的。深度学习在实现和可视化实际 AI 中起着关键作用。然而，深度学习需要大量的数据进行训练，这又需要深层神经元网络来处理特征，因此被称为“深度学习”。\n\
  \n深度学习包含许多用于不同类型数据的算法。其中，卷积神经网络（CNN）主要用于处理图像和解决计算机视觉问题。CNN 的想法可以追溯到 1980 年，当时 K.\
  \ Fakushima 提出了“新认知”——这是一种层次多层神经网络，它是自组织的，且不受数据集中平移操作（模式的位置移动）的影响。它最初是为模式识别而创建。\n\
  \n第一个标准的 CONVNet 由 Yann LeCunn 在 1998 年在其题为《基于梯度学习的目标识别》的论文论文中引入。需要注意的是，Yann LeCunn\
  \ 在其研究工作中引用了 Fakushima 的文章，且 LeCunn 的 CONVNet 结构与新认知相似，并在网络中添加了反向传播。从那时起对其进行了多次改进和扩展。\n\
  \n### 卷积神经网络 (CNN)\n\n卷积神经网络主要用于图像分类、分割和其他计算机视觉操作。基于其权值共享和平移不变的特性，CNN 也称为形状/空间不变性人工神经网络（SIAAN）。CNN\
  \ 背后的核心思想是通过卷积操作捕获局部模式。\n\n通常情况下，每种 CNN 架构都有通用的工作流。CNN 由多个层卷积层、池化层以及一个全连接 ANN 组成。如果卷积层和池化层的数量相同，则\
  \ CNN 中的某层可以将一个卷积层和一个池化层共同作为一个单一层。最常用的类型是两个卷积层后跟一个池化层。\n\nCNN 架构中的层数取决于应用的复杂性。最后一层的输出被传递给\
  \ ANN。卷积层和池化层始终执行学习输入图像的相同操作。全连接网络执行所需的操作，如回归、分类等。\n\n在每个卷积层，通过在整个图像上应用过滤器获取局部模式。过滤器也可以称为卷积核（kernels）。CNN\
  \ 的初始/低层获取图像的初级模式，如边缘和线条。CNN 的高层获取前一层识别的模式，并通过空间局域性概念，高层获得更大的模式，如[图 1.2] 所示。CNN\
  \ 的最后一层将生成完整的图像，而最后连接的 ANN 将根据开发该特定神经网络所针对的问题提供所需的输出。\n\n\n图 1.2 卷积层的典型操作\n\n\n\
  CNN 的以下属性使其与其他深度学习算法区别开来：\n\n*   一个 CNN 包含大量的神经元，如[图 1.3] 所示，即层中的神经元以三维（深度、高度、宽度）方式排列。\n\
  *   权值共享：当过滤器被应用于图像的一部分时，图像的所有部分都使用同一组参数值。\n*   感受野：CNN 3D 结构中的每个神经元都对应输入的定义区域，这允许神经元学习输入的初级模式。与特定神经元相关的输入区域被称为感受野，如[图\
  \ 1.4] 所示。\n\n\n图 1.3 神经元\n\n*   局部连接：神经元之间的局部连接对于利用空间局域性至关重要。这种局部连接模式允许网络创建局部模式的表示，然后汇区域较大区域。\n\
  *   池化：池化层用于缩小特征图的大小。特征图是卷积操作的输出。\n\n在详细描述 CNN 之前，了解一些应用于 CNN 的其他术语和概念是重要的。\n\n\n\
  激活函数应用于 CNN 架构的卷积层输出，以判断输出是否精确以及它应该作为下一层的输入还是被丢弃。\n\n```\n*Y* = *A**c**t**i**v**a**t**i**o**n*(∑(*w**e**i**g**h**t*\\\
  **i**n**p**u**t*) + *b**i**a**s*)\n```\n\n应用激活函数后得到的结果范围通常在 0 到 1 之间或从 –1 到 1 之间，取决于所采用的函数。激活函数可以是线性的，也可以是非线性的。\n\
  \n对于任何神经网络或深度学习算法，几乎不使用线性激活函数，因为它们的输出是输入的直接倍数，结果值可以是任何范围。\n\n\n\n\n\n最常用的非线性激活函数包括以下几种：\n\
  \n- `Sigmoid` 或逻辑激活函数：当需要输出概率时使用，因为其结果范围在 0 到 1 之间（参见图 1.5）。\n- `Tanh` 或双正切激活函数：双正切函数的函数的范围是从\
  \ –1 到 1。它通常用于两类之间的分类。\n\n\n图 1.5 Sigmoid 函数\n\n`Tanh` 如图图 1.6 所示。\n\n- 修正线性单元 (`ReLU`)\
  \ 激活函数：CNN 架构最常用的是 `ReLU` 激活函数。`ReLU` 允许神经网络很容易地收敛，并允许反向传播。`ReLU` 的一个问题是，当输入变为 0\
  \ 或负数时，函数的梯度变为 0。这种情况会阻止反向传播，被称为“死亡 `ReLU` 问题”。\n\n- Leaky ReLU：参数化 `ReLU` (`PReLU`)\
  \ 也通过引入一个小的斜率来保持更新活跃，从而防止死亡 `ReLU` 问题。\n\n\n图 1.6 Tanh 激活函数\n\n如图图 1.7 所示，`ReLU`\
  \ 的作用如下：\n\n```\nR(x) = (0,x)\n```\n\n\n图 1.7 ReLU 和 Leaky ReLU 函数\n\n但 `PReLU`/Leaky\
  \ ReLU 函数向输入加入了斜率值 `a`：\n\n```\nR\\left( x \\right) = \\left\\{{ \\begin{matrix}\
  \ {ax if x < 0} \\\\\\\\ {x if x \\geq 0} \\\\ \\\\ \\end{matrix} \\right.\n```\n\
  \n如果 `a` = 0.1，则被称为 Leaky ReLU；如果 `a` 是任何合适的值，则被称为 `PReLU`。\n\n- Softmax 激活函数：多分类任务中最常用的激活函数是\
  \ `Softmax`。与其他类型的激活函数不同，它仅用于输出层。\n\n\n优化算法需要反复估计当前迭代的误差值。这种损失函数也称为误差函数，用于估计模型的误差值，从而允许其更新参数权重，以便在下次迭代中提高准确性并减少误差。损失函数的选择是根据网络建模的问题决定的。\n\
  \n    1. 均方对数误差损失 (`MSLE`)\n    2. 均方误差损失 (`MSE`)\n    3. 均绝对误差损失 (`MAE`)\n    1.\
  \ 二元交叉熵\n    2. 平方铰链损失 (Squared Hinge Loss)\n    3. 铰链损失 (Hinge Loss)\n    1. 多分类交叉熵损失\n\
  \    2. Kullback–Leibler 散度损失\n    3. 稀疏多分类交叉熵损失\n    1. 加权交叉熵\n    2. Focal Loss\n\
  \    3. Dice Loss\n    4. 边界损失 (Boundary Loss)\n\n\n神经网络的数据集被分为三个子集：\n\n- **训练数据\
  \ (Training Data)：** 是一组数据，占总数据的 80%，用于神经网络的学习和建模。训练数据用于拟合分类器的参数。当训练好的模型在相同的训练数据上运行时，会产生误差（基于准确率）。\n\
  - **验证数据 (Validation Data)：** 它是训练数据中未使用的部分，用于估计基于训练数据训练的模型的准确性，并据此调整参数。当训练好的模型在留出的验证数据上运行时产生的误差被称为验证误差。它提供了测试误差的估计。\n\
  - **测试数据 (Test Data)：** 是剩余的数据。\n\n\n\n\n模型参数是一个其值被自动设置并从训练数据集中估计的变量。这些值通过使模型拟合数据来学习，即它们是通过优化算法从数据中估计得的。这些参数值被模型用于进行预测。不同应用对应的参数也不同。\n\
  \n示例：神经网络中的权重，线性回归中的截距值。\n\n超参数在学习过程开始之前手动设置。这些超参数是估计模型参数所必需。超参数对于确保神经网络具有良好的准确性至关重要，因为它控制了模型的学习过程。因此，选择一组理想的超参数并将其初始化为最优值是非常重要的。这个过程超参数调优。在大多数情况下，它是通过尝试法完成的。也可以通过网格搜索、随机搜索和贝叶斯优化来实现。\n\
  \n示例：学习率、神经网络的大小、神经元数量、epoch 大小、batch 大小等。\n\n\n卷积层，简称为 `CONV Layer`，通过并行应用大量滤波器从输入图像中提取特征，这些滤波器特定于数据集和预测建模问题。输入图像是\
  \ RGB 模型，包含红、蓝、绿三个通道。三维神经元执行卷积操作。神经元的权重仅仅就是滤波器。\n\n\n滤波器也可以称为内核（kernels）。每个滤波器包含一组用于特定目的的权重，例如边缘检测、线条检测滤波器、锐化、高斯模糊等。滤波器的尺寸通常为\
  \ 3×3 或 5×5，也可以根据需要进行更改。滤波器使用滑动窗口协议。由于滤波器的尺寸小于输入图像，滤波器从输入的开始处开始，然后遍历整个输入。滤波器充当特征检测器并筛选输入。它在特征图中保留所需的信息，并移除无关的细节。例如，如果使用的滤波器是线条检测器，那么在通过输入时，输出仅包含关于输入中存在的线条的信息。\n\
  \n\n卷积层的结果是特征图。特征图是在输入图像的不同补丁块上重复应用相同滤波器的结果。生成的特征图包含了图像中检测到的特征的位置和强度。输出特征图的大小由下式给出：\n\
  \n$Dimension\\operatorname{} of\\operatorname{} the\\operatorname{} Feature\\operatorname{}\
  \ Map = \\frac{W - F + 2P}{S} + 1,$\n\n其中，`W` – 输入数据（图像）的大小\n\n`F` – 滤波器的大小\n\n\
  `P` – 填充（Padding）\n\n`S` – 步长（Stride）\n\n\n输入图像与内核之间的卷积操作是卷积神经网络的核心思想。卷积操作是一种涉及输入图像与内核之间点积的线性操作。卷积操作用“*”表示。\n\
  \n考虑一个大小为 5×5 的输入图像，即 `W` = 5，具有零填充 `P` = 0，滤波器尺寸为 3×3，`F` = 3，步长 `S` = 1。根据上述特征图尺寸的公式，代入后：\n\
  \n`DimensionOfFeatureMap` = (5–3+0/1) + 1 = 3。\n\n因此，特征图的大小将是 3×3。\n\n\n图 1.11 卷积层\n\
  \n特征图是通过在输入图像的不同区域重复应用相同滤波器得到的结果。生成的特征图包含了图像检测到的特征的位置和强度。\n\n\n\n参数本质上是从数据中可学习的元素。它们是在训练过程中学习的权重，例如参见图\
  \ 1.17。这些权重矩阵用于贡献模型的预测能力，并在反向传播过程中进行更改。\n\n\n1.  输入层无须学习内容。因此，输入层的参数数量为 0。\n\n\n\
  \    `NumberOfParametersInCONVLayer=((m*n*d)+1)*k)`,\n\n    其中，\n\n    `m` – 过滤器的宽度\n\
  \    `n` – 过滤器的高度\n    `d` – 上一层过滤器的数量\n    `k` – 过滤器的数量，1 表示偏置项\n\n3.  池化层：池化层不进行学习。因此，参数数量为\
  \ 0。\n\n\n    `NumberOfParametersInFCLayer=(c*p)+1*c`,\n\n    其中，\n\n    `c` – 当前层神经元的数量\n\
  \    `p` – 上一层神经元的数量，1 是偏置项\n\n\n激活图（Activation maps）只是卷积层输出特征图的另一种名称。激活形状仅仅是特定层输出的维度，格式为（高度、宽度和通道数）。激活大小是高度、宽度和通道数的乘积。\n\
  \n\n图 1.17 参数数量\n\n前向传播计算学习过程的结果，并保存计算梯度所需的中间值。梯度计算用于计算损失函数和进行优化（参见图 1.18）。\n\n\n\
  图 1.18 前向和反向传播\n\n\n一旦完成前向传播并预测出输出，损失函数或代价函数就会对模型进行评估。如果损失函数的计算值较高，则说明模型没有经过妥善训练。如果值较低，则表示模型运行良好。损失函数用\
  \ `L` 表示。损失函数是根据 CNN 架构建模的应用场景来选择的。\n\n每当 `L` 较高时，就需要进行反向传播并更改每层中使用的权重，以优化模型的工作。这里的权重指的是过滤器的值。给定一个\
  \ CNN 和损失函数值，反向传播计算损失函数相对于网络中权重和偏置的梯度。在梯度计算中，进行微分运算，这表示预期输出与获得的实际输出之间的变化率或差异。需要注意的是，卷积操作的反向传播也是一个带有翻转核的卷积操作。\n\
  \n在图 1.18 中，$\\frac{dz}{dx}$ 和 $\\frac{dz}{dy}$ 是局部梯度，在反向传播过程中会被计算并保存在内存中。局部梯度是从前向传播存储的中间值计算出的。通过应用微分链式法则和雅可比符号（Jacobian\
  \ notations），可以修改权重，然后再次对模型进行前向传播以找到新的输出。这个过程被重复执行。\n\n\n在反向传播期间，为了最小化损失函数，我们使用优化器。优化器塑造神经网络以获得准确率。Adam\
  \ 优化器是 CNN 中最常用的，因为它提供了 99.% 的效果。Adam 优化器代表自适应量估计。\n\n\n虽然反向传播和参数是主要方法，但还有三种提高性能的方法：\n\
  \n\n当用于训练的数据量较少时，模型可能无法无法特征。这可以通过增强的概念来克服。即可以通过旋转、反射、倾斜和随机裁剪等各种操作对图像数据进行增强，如图 1.19\
  \ 所示。\n\n\n拥有多个卷积层可以获得更好的特征。同样重要的是，更深的网络提供更高的准确率，而不是本质上由更宽的网络。我们所说的更宽的网络是指单层中大量的过滤器。具有分层结构的更深网络有助于对数据集泛化学习过程。\n\
  \n\n由于卷积神经网络在多次迭代中执行训练过程，确保模型不过拟合非常重要。为了确保这一点，必须在损失函数值较小的早期阶段停止迭代。为了找到理想的早停止点，必须向网络输入验证集（参见图\
  \ 1.20](#ch01.xhtml#fig1_20)）。\n\n\n\n\n\n\n在这里，参数为：过滤器数量 = 32，卷积核大小 – 3×3，输入大小\
  \ – 64×64，激活函数为 ReLU。\n\n\n`model.add(Max_Pooling2D(pool_size=(2, 2)))`。在这里，池化窗口大小为\
  \ 2×2。\n\n\n\n`model.add(Flatten())`\n\n\n`model.add(Dense(units=128, activation='relu'))`，在这里，`units`\
  \ 表示神经元的数量。\n\n\n`model.add(Dense(units=1, activation='sigmoid'))`\n\n在这里，使用的激活函数是\
  \ Sigmoid，因为应用场景是二分类，输出应当为 1（如果图像中存在第 1 类对象）或 0（如果存在第 2 类对象）。\n\n\n`model.compile(optimize='adam',\
  \ metrics=['accuracy'], loss='binary_crossentropy')`\n\n`Metrics` 是一个元素列表，也可以优化多个指标。\n\
  \n\n数据必须使用 `keras` 库重缩为固定大小并进行预处理。\n\nfrom keras.preprocessing.image import ImageDataGenerator\n\
  ```\n\n```\n```\n\n\ntraining_set=train_datagen.flow_from_directory('data/training_set',\
