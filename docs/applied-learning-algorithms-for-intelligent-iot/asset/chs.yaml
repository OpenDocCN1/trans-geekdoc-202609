  \n### 目录\n- [引言]\n- [利用无监督学习]\n- [k-Means 算法]\n- [用于 k-Means 算法的数据集]\n- [k-Means\
  \ 算法中质心的距离公式]\n- [计算 K 值的机制]\n- [k-Means 的属性]\n- [k-Means 与模糊 C 平均值、K 中位数及 k-Means++\
  \ 的比较]\n- [软件定义网络 (SDN) 中的 k-Means 聚类]\n- [探索 k-Means 聚类在解决 SDN 中的应用]\n- [基于 k-Means\
  \ 的 Saren 拓扑 SDN 网络划分]\n- [结论]\n- [参考文献]\n\n### 引言\n\n人工智能 (`AI`) 的力量为解决许多充斥着低效解决方案的挑战带来了新范式。`AI`\
  \ 采用了许多健壮且复杂的算法，`AI` 的分析也渗透到许多场景中，提供了准确高效的结果。本章将讨论其中一种算法，即 k-means 算法，它可以被与任何技术结合以解决不同类型的问题。\n\
  \n在详细讨论 k-means 算法之前，我们将讨论一些引导我们选择特定类型算法/方法来分析/分类/解决问题的场景。在网络等领域选举领导者（如主节点）时，对质量进行排名或对系统分级都不是连续或常见的值。这些可以被视为离散数据。离散样本是可计数/可衡量的，需要线性回归技术。另一方面，如果值具有相似性，例如共同症状、相同类型的流量、相似的模式或递归样本，那么就是连续数据。对于具有不可计数相似性的连续数据，对于海量且无标记的连续样本，需要通过聚类将其与非线性对应项进行分组。聚类数据是分类或分组值的一种重要方式，大多数聚类算法采用欧几里得距离/相关性距离公式来区分非线性值。\n\
  \n如果我们观察聚类算法背后的思想，它基本上源于分析目的，其发展经历了几十年。我们的主要目标是讨论一种传统的高效的聚类算法，即 k-means 聚类算法。基于聚类的问题涉及从遗传分析到计算机网络流量分析的所有领域。大多数研究人员都选择了\
  \ k-means 算法进行聚类。本章将讨论 k-means 在先进技术中的作用、属性及其效率。\n\nk-means 算法也称为 Lloyd's 算法，它受向量量化的影响很大。基本上，该算法的工作原理是所有相似的小型\
  \ `K` 组以最小距离向质心移动，并使用欧几里得距离公式计算距离。根据 [[[1]]，k-means 算法是将 `N` 维群体划分为 `K` 个集合的过程。在各个领域可以找到\
  \ k-means 的许多定义或解释。J. Andrew [[[2],[3]]] 研究了结合使用 k-means 算法的增强监督和无监督聚类，这带来了更好的收敛和分类结果。k-means\
  \ 算法与其他算法（如 `LVQ` 算法 [[[4]]]）相结合提高了聚类性能。\n\nk-means 不仅可以与不同的方法相结合，还可以应用于遗传学、机器学习、人工智能等许多领域。因此，它可以被宣布为解决聚类问题的通用算法。第\
  \ 2 节将介绍 k-means 的起源及其在机器学习中所属的层次。在第 3 节中，我们将讨论 k-means 算法及其工作结构以及主要属性。k-means 应用于许多与其他方法结合以获得更高效率的技术中，这些讨论有助于引导我们解决问题的探索路线。\n\
  \n在最后两个节中，讨论扩展到实现和应用，k-means 在其中起着至关重要的作用。\n\n## 利用无监督学习\n\n了解新技术和应用是重要的一部分，基本上是为了从中获益。学习数据科学、人工智能和机器学习使技术以一种健壮的方式工作。大量的用例可以帮助深入理解物联网\
  \ (IoT)。在本节中，我们将学习更多关于无监督学习及其重要性。它在所有领域都非常丰富，主要用于用于开发物联网产品。物联网背后的技术不仅是 Arduino、云技术，还有机器学习的智能算法，这些算法采用回归、分类或聚类。\n\
  \n这些算法分为监督学习、半监督学习和无监督学习，这基本上取决于数据的类型。\n\n```\nimages/inline12_1.jpg\n```\n\n考虑到自动化系统，如人脸检测、天气预报、股票价格预测，这些系统在训练数据上运行或根据先验知识进行预测，在这些情况下，某些信息已经存储，并根据此预测输出，这种机制被称为监督学习。在监督学习中，如果出现如恶意流量、患者未知症状或任何异常负载等情况，预测可能无法给出准确输出，这可以通过带有目标结果的回归评估过程来克服，这种结果没有预定义的标签，被称为无监督学习。\n\
  \n```\nimages/inline12_2.jpg\n```\n\n\n\n\n# 聚类\n\n1. **聚类 (Clustering)**：根据参数（如到质心的距离）将数据划分为不同的子集。\n\
  \n2. **降维 (Dimensional Reduction)**：将原始数据集在保持完整性的情况下还原为易于管理的数据集是降维的任务。\n\n3. **关联\
  \ (Association)**：是一种识别建立关系规则的机制。\n\n在大型数据集中关联未知值是一个复杂的过程，如图 12.1 所示。使用上述方法对大型数据集进行分类需要深入分析，其中\
  \ `k-means` 被归类为聚类算法。但某些数据集的维度值可能会很多，这需要一种机制根据相关性对其进行简化和关联。\n\n![图 12.1 无监督学习的方法论](img/fig12_1.jpg)\n\
  \n图 12.1 无监督学习的方法论\n\n主成分分析(`PCA`) 在通过减少维度特征进行分割中起着重要作用。假设数据包含超过 20 个特征，那么聚类可能会导致低效的聚类结果。因此，需要对低影响的特征进行标准化和还原。此外，在进行\
  \ `k-means` 聚类之前，有必要计算 `PCA`。\n\n无监督学习是一个广泛的话，应用于大多数技术，我们关注聚类方法论，并讨论最流行的聚类算法，这有助于我们理解并区分\
  \ `k-means` 算法。\n\n聚类是一种根据需求进行分类的方法，基本上是为了分析模式或组织数据，否则是为了识别模式。为了实现这种聚类，研究人员发现了许多策略性算法，其中\
  \ `k-means` 是最流行的聚类算法。如在 [5, 6, 7] 中讨论，属于聚类的算法如表表 12.1 所示。\n\n## 表 12.1 聚类算法\n\n\
  | 类型 | 任务 | 示例 |\n| --- | --- | --- |\n| `k-means`, `K-Mediods` | 通过计算质心距离对数据点进行聚类。\
  \ | 压缩、数据挖掘。 |\n| `Hierarchical Clustering` | 具有层次嵌套聚类 | 异常检测、深度学习。 |\n| `Density-Based\
  \ Clustering` | 基于密度的聚类，根据数量进行分组。 | 文本聚类、图像聚类、离群点检测。 |\n| `Spectral Clustering`\
  \ | 基于图的聚类。 | 社区检测、图像分割、网络。 |\n| `Gaussian Mixture Models` | 基于给定数据集的概率分布进行聚类。 |\
  \ 语音识别、信号映射与定位 |\n| `Nearest Neighbors` | 使用穷举搜索将接近的数据点分组。 | 机器学习 |\n| `Hidden Markov\
  \ Models` | 基于当前状态的随机过程马尔可夫模型。 | 股票市场、基因中染色体的位置 |\n\n![](img/inline12_3.jpg)\n\n\
  ## k-Means 算法\n\n`k-means` 算法由 J. Macqueen [8] 引入，用于分类和分析数据集渐近行为的方法。该提议证明了基于相对距离测量的集合的最优分类，并得出结论\
  \ 值 值应该是最小的，这将接近平均值，这一观测是在具有不同维度值的变量上得出的。\n\n`k-means` 聚类是一种划分聚类，它将数据集划分为 `k` 个组，每个组的大小相等，且其中一个簇的对象不属于其他簇。它使用\
  \ `Euclidean/Squared Euclidean/Manhattan/cosine` 距离算法来计算质心与其他附近对象之间的距离。此过程将以迭代的方式进行，使所有对象都靠近质心，因此在最终收敛之前，对象将不会处于同一个聚类中。\n\
  \n寻找 `k-means` 的过程如图图 12.2 所示的图图 12.1 所示。\n\n如流程图所示，下面结合几个问题讨论流程。\n\n### 步骤 1：指定考虑的数据集\
  \ `S*s = {x1,x2,x3,… xn}`：\n\n在这一步中，需要考虑几点，例如：\n\n*   什么类型的数据集？\n*   无监督数据集更适合 `k-means`\
  \ 聚类\n*   数据集的局限性是什么？\n*   小型数据集具有大 `O(更好的性能)`，而大型数据集迭代次数增加，这将导致非最优。\n\n### 步骤 2：初始化\
  \ `K` 的值。\n\n要确定最佳聚类数量，没有确定的规则来选择。如在 datanovia [9] 中讨论的，有两种策略：\n\n1. 直接方法\n2. 统计测试方法（将在后续详细讨论）\n\
  \n### 步骤 3：将质心分配给每个簇，基本上应用欧几里得距离将数据点靠近质心。`Centroid={c1,c2,c3,…ck}`：\n\n`Euclidean\
  \ Distance =arg min(ci,x)²`，其中 `ci` 属于 `C`。\n\n### 步骤 4：计算新质心，这将是平均值\n\n```\nNew\
  \ Centroid = 1/n Σ\n```\n\n质心 != 旧质心：\n\n```\n回到步骤 3\n```\n\n否则：\n\n```\n回到步骤 5\n\
  ```\n\n实际上，文本说：\n如果质心 != 旧质心：\n\n```\n重复\n```\n\n否则：\n\n```\n回到步骤 5\n```\n\n###\
  \ 步骤 5：一旦簇固定，`k-means` 认为已收敛。\n\n上述步骤不仅解释了 `k-means` 的过程，还包括某些系数因子，如 k 值和数据点之间的距离。许多研究人员使用\
  \ `k-means` 来解决特定类型数据集的问题，这是我们讨论讨论。\n\n### k-Means 算法的数据集\n\n*   在应用任何算法之前，理解模式是重要的。当数据集呈*球形/凸*形状时，`k-means`\
  \ 收敛效果更好，对于非凸则失效。\n*   当数据集包含离群点、数据点跨数据空间的密度分布不同且数据点遵循非凸形状时，`k-means` 算法无法给出良好的收敛结果。\n\
  *   `K-means` 算法需要手动输入的 `K` 值。\n*   特征缩放确保所有特征在聚类中具有相同的权重。\n\n### k-Means 算法中质心的距离公式\n\
  \n`k-means` 算法中簇的所有数据点都靠近该簇的质心，质心之间的距离使用欧几里得距离公式计算，根据不同的需求，还使用了其他替代公式，如图 12.2 所示。\n\
  \n\n\n\n\n# 图 12.3 距离公式\n\n让我们考虑一些示例数据，以帮助理解这些方法的适用性并指导选择合适的距离公式。\n\n在本章中，我们讨论了与\
  \ k-means 相关的四种主要距离公式，这些公式代表了衡量高维空间邻近性的不同距离指标的定性行为。在聚类、分类和相似性搜索等问题中，距离指标的具体选择取决于对邻近性的理解。每种公式对于特定模式都有其显著的特征（见图\
  \ 12.4 和图 12.5）。\n\n![图 12.4 哈顿距离与欧几里得距离](img/fig12_4.jpg)\n\n图 12.4 哈顿距离与欧几里得距离\n\
  \n![图 12.5 切比雪夫距离与闵可夫斯距离](img/fig12_5.jpg)\n\n图 12.5 切比雪夫距离与闵可夫斯距离\n\n下一节将讨论确定 `k-means`\
  \ 算法中最优 `k` 值的机制。\n\n### 计算 K 机制\n\n在 `k-means` 算法中，`k` 表示簇的数量。默认情况下，`k` 被取为随机数，这可能不合适且没有明显的有效点，为了克服这一点，研究人员使用了许多索引。这里主要需要注意两点：其一关于值，另一个是寻找数据集中是否存在形成簇的可能，这取决于根据零假设和备择假设决定的\
  \ \\[18]，我们在本章中将不详细介绍假设。\n\n在应用这些方法寻找 `K` 值之前，请先识别数据集的维度，因为[欧几里得距离](https://en.wikipedia.org/wiki/Euclidean_distance%23distance)\
  \ 并不是多维数据集的合适解决方案。因此，应该在数据上实现 `PCA` 以加速计算。\n\n确定 `k-values` 有许多方法，下面将讨论了其中五种主要的流行方法，并在图\
  \ 12.6 中表示，其中大多数方法取决于簇内平方和（WSS）和簇间平方和（BSS） \\[19, 20, 21]。\n\n```\n*WSS* = ∑∑*x* ∈ *Ci*²\n\
  \n*BSS* = ∑[*i*]|*C[*i*]|(*c* − *ci*)²\n```\n\n1. **肘部曲线 (Elbow Curve):** 该方法选择一组\
  \ `k` 的候选值范围，然后使用每个 `k` 值应用 `k-means` 聚类来绘制惯性曲线。它表示每个点到所属簇质心的平均距离。惯性值随着 `k` 的增加而减小，并在达到\
  \ `K` 的饱和值后停止下降。\n2. **轮廓曲线 (Silhouette Curve):** 它找到簇内所有的平均距离以及与其他簇对象的距离。一旦计算出来，将取最小值。这完全关乎凝聚力与区分度之间的关系。\n\
  3. **间隙统计量 (Gap Statistics):** 在这种方法论中，将簇内平方和的值与不同的 `K` 值进行比较。\n4. **4.CH-Index:**\
  \ `CH-index` 用于利用簇内平方和和簇间平方和寻找 `k` 的最佳值。`Ch` 是 `BSS/WSS` 的比率。\n5. **DB-Index:**\
  \ 它根据簇内和簇之间的距离比例构建。它将最小的 `DB` 值视为最优值。对于大多数数据集，它提供了比其他算法更精确的 `K` 值。\n\n![图 12.6 寻找\
  \ K 的方法](img/fig12_6.jpg)\n\n图 12.6 寻找 K 的方法\n\n让我们在表 12.2 中比较这些方法的适用性 \\[2]。\n\n\
  表 1.2 数据集\n\n| 方法名称 | 数据集 |\n| --- | --- |\n| 1. 肘部曲线 | 客户细分、新闻纯化、无线传感器网络。 |\n|\
  \ 2. 轮廓曲线 | 根据颜色分类图像、模糊聚类、医学图像 |\n| 3. 间隙统计量 | 在线表型发现、盲源分离、峰排序 |\n| 4. CH 指数 | 原油、离子层数据和癌症数据集\
  \ |\n| 5. DB 指数 | 谷物数据、网页导航 |\n\n## k-Means 的属性\n\n**k-means 算法的属性**: 标记值的聚类或监督聚类可以通过任何区分分组的共同因子来进行，例如人口的性别、商场的产品名称、衣服的评分或患者的疾病名称；但未标记数据集的聚类或无监督聚类在分组时非常不同且复杂，由于其数据的性质，例如通过网络流量来发现恶意数据流、染色体行为、图像压缩、喷发浮力以及土壤质量等许多没有标签来分类数据集的情况。\n\
  \n`k-means` 是一种流行的聚类算法。它将数据集划分为 `k` 个簇，每个观测值属于距离质心最近的簇。该算法通过迭代更新簇质心直到收敛。\n\n\n\n\
  \n\n考虑一个根据主机数量将路由器放置在相应区域的示例，这些主机根据距离或数据传输速率进行分组。最好的部分是选择距离变量，而不是随时间变化的网络流量。`k-means`\
  \ 将主机之间距离最近的主机进行分组，并放置质心以保持簇之间的最小距离，如下。\n\n考虑质心 `c1,c2,c3,c4`，其中 `c1` 靠近 `c4` 且\
  \ `c2` 靠近 `c3`，则连通性如图 12.10 所示。\n\n![图 12.10 使用 k-Means 的聚类网络笔记](img/fig12_10.jpg)\n\
  \n图 12.10 使用 k-Means 的聚类网络笔记\n\n如上所述，这 4 个属性在实现 `k-means` 算法进行聚类时起着主要作用。\n\n## 将\
  \ k-Means 与 Fuzzy C Mean、K Mediods 和 k-Means++ 进行比较(#ch12.xhtml#c_sec12_5)\n\n在上一节中我们学习了\
  \ `k-means` 算法及其属性，但在某些研究工作中，`k-means` 与其他无监督算法进行了比较，这些算法克服了 `k-means` 算法的一些缺点。将学习这些概念，然后与\
  \ `k-means` 进行比较。\n\n1. **Fuzzy C Mean**：由 Bezdek[]引入，该算法根据分配给数据点的成员隶度，数据点可以属于多个簇。该算法结合了高斯和期望极大（Expectation\
  \ Maximization）算法以获得更高的准确性。\n2. **K Mediods**：Mediods 类似于质心 `k-means`，其中数据点距离该中位数最小以形成簇。与\
  \ `k-mean` 相比，它旨在通过计算成对距离（可能是延迟）来减少数据中的不相似性。如果中位数与数据点之间的值大于，会将数据点交换到另一个中位数。\n3.\
  \ **k-means ++**：它克服了 `k-means` 算法无法初始化质心的缺点。在该算法中，最初选择的质心位于另一个簇中，这有助于减少收敛的运行时间。\n\
  \n通过上述简短描述，我们希望参考 [22,23] (表 12.3) 将这 3 算法与 `K-means` 进行比较。\n\n表 12.3 无监督聚类算法比较\n\
  \n| 算法/性能参数 | 测量的平方误差 | 快速收敛 | 健壮性 | 簇内数据点的内聚性 | 聚类准确性 |\n| --- | --- | --- | ---\
  \ | --- | --- |\n| k-means | 是 | 中等 | 中等 | 完全耦合 | 中等 |\n| K-Mediod | | 否 | 好 | 好\
  \ | 完全耦合 | 高 |\n| k-means \\++ | 是 | 好 | 好 | 完全耦合 | 中等 |\n| Fuzzy C Mean | 是 | 低\
  \ | 中等 | 部分耦合 | 大数据集中等 |\n\n上表有助于得出结论：`k-means` 算法使用平方距离误差来衡量准确性，且数据点与少数点紧密耦合，在考虑收敛时也需考虑到这一点，但由于其简单性和最优性能，也可用于大数据。\n\
  \n## 软件定义网络 (SDN) 中的 k-Means 聚类(ch12.xhtml#c_sec12_6)\n\n使用名为 `SDN` 的新技术可以通过软件控制交换机、节点和网关等网络组件。物联网和不断发展的行业正在使世界数字化，并利用\
  \ 2G 到 5G 的互联网力量使工作变得简单。\n\n关于 `SDN` 的简单介绍如下 [24] (图 12.11)，\n\n* 北向 API 是逻辑应用，如防火墙、路由算法、负载均衡等，有助于网络组件与高层组件通信。\n\
  * 南向 API 用于与交换矩阵、流、协议和网络虚拟化协议通信。\n* 控制器置于南北向应用接口之间的中间位置，用于集中地管理、监控和引导网络组件。\n\n![图\
  \ 12.11 宏观 SDN 架构](img/fig12_11.jpg)\n\n图 12.11 宏观 SDN 架构\n\n由于我们新的南向 API 是随着连通性需求增加而扩展的网络组件，同时在扩展性方面的挑战在研究中也占据着重要地位，这可以通过对主机、交换机和控制器进行聚类来得到缓解。\n\
  \n许多研究正转向这些挑战，如 [25–27] 以及更多研究所示，更有趣的是，这些节点的逻辑分组也是其解决方案的一部分。\n\n`k-means` 聚类算法被研究用于将控制器放置在最佳位置，在\
  \ [25] 中，它被用于减少延迟并对进入的网络进行分组 [26]。`k-means` 不仅用于放置，还用于检测 DDOS 攻击。Barki [27]\n\n\
  ### 探索 k-Means 解决挑战 (ch12.xhtml#c_sec12_006)\n\nSDN 的普及（如组件集中化）减少了许多问题。挑战包括 DDOS\
  \ 攻击、资源利用、流量管理以及控制器之间的通信延迟。许多研究人员提出了新算法，许多人集成了 `k-means`。让我们看看一些研究以获取洞察。\n\n> **案例\
  \ 1-减少 SDN 中的延迟**：将 SDN 控制器放置在合适的位置有助于减少延迟，如 [[25] 所示，与标准连接相比，k=5,6 实现了 2.3ms 的延迟，小于非聚类机制。\n\
  \n> **案例 2-SDN 中的 DDoS 攻击监控**：Felipe A. Lopes [28] 证明了 k-means 对监控 DDoS 攻击的影响，并实现使用\
  \ RYU 应用检测异常数据集并成功发现攻击的网络流量监控。\n\n> **案例 3-流量监控**：根据流量和数据包大小对网络流量进行分类。如 [29] 所示，`k-means`\
  \ 在流量分类方面起着主要作用，以便通过检查饱和点来放置控制器。`k-means` 也证明了在流量分类方面具有最佳准确性，结果为 90% 的准确率，减少了平方误差。如\
  \ Liu 实验所示，针对 1000 个用户的网络流量分类根据数据传输类型创建了分类，其中 http 协议数据传输较高。\n\n\n\n\n\n# 图 12.12\
  \ 基于 SDN 和 5G 的 k-Means 聚类\n\n随着当前技术的嵌入，例如 `5G` 与 `SDN` 的集成改进了管理性、编排、服务资源。网络函数虚拟化有助于通过创建虚拟局域网划分网络流量，而\
  \ k-means 可以帮助将控制器放在高效的位置，并对流量进行分类，以发现恶意攻击或识别网络设备的流量类型。\n\n## 基于 k-Means 的 Saren\
  \ 拓扑 SDN 网络划分\n\n使用 `mininet` 模拟器进行了一个小型实验，以证明 `k-means` 在放置管理交换机的控制器方面的作用。\n\n\
  在本章中针对 Zootopology 的 Saren 拓扑数据集完成了一个小型实现，并计算了质心以提高在降低延迟方面的性能（以毫秒为单位测量）。\n\n正如 `k-means`\
  \ 算法所示，第一步是将数据集分配给数组，作为 `gml` 文件提到的 7 个交换机的延迟向量。由于交换机数量较少，我们计算了 `k=1,2` 的值，在应用 `euclidean\
  \ distance` 公式后，质心值分别为 `2.6908` 和 `1.46, 3.5`，如图[图 12.13]所示。\n\n![图 12.13 Saren\
  \ 拓扑的 k-Means 聚类](img/fig12_13.jpg)\n\n图 12.13 Saren 拓扑的 k-Means 聚类\n\n我们说明了 `k-means`\
  \ 聚类的有效性，并发现与 `k=1` 以及传统方法相比，`k=2` 导致了延迟的降低。图形显示当 `k=2` 时，延迟减少了约 15-20%，并提高了响应时间（[图\
  \ 12.14]）。\n\n![图 12.14 应用 k-Means 算法后的 RTT 时间](img/fig12_14.jpg)\n\n图 12.14 应用\
  \ k-Means 算法后的 RTT 时间\n\n## 结论\n\n`k-means` 算法非常流行且实现简单，更适用于基于向量的数据集。它主要使用 `euclidean\
  \ distance` 算法，通过最小化平方误差来提高准确性，自 1967 年开启之旅以来，其强大的概念使其无处不在。距离公式根据适合的问题进行变化，以获得更好的性能。它的效率和适用性非常丰富，我们通过使用\
  \ `SDN` 的示例进行了一个小尝试，以强调其作为数据点划分最佳选择的适用性。许多研究人员证明了 `k-means` 的效率，我们也证明了网络延迟的降低和响应时间的提高。\n\
  \n实现 `k-means` 的代码可以在 `sklearn` 中找到，\n\n`Sklearn`→`Cluster`→`k-means` 并参考下方提供的 github\
  \ 获取 Python 版 `k-means` 源代码。\n\n[https://github.com/scikit-learn/scikit-learn/blob/0fb307bf3/sklearn/cluster/_kmeans.py#L749]\n\
