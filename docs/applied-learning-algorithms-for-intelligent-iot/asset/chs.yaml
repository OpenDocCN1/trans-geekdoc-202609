  \ |\n\n为了对这些文档进行分类，我们通过获取两个参考文档中的所有单词并从这些单词创建一个表格或向量。\n\n`(Welcome,to,learning,happy,coding)`\
  \ 类\n\n我们可以根据单词是否存在于训练文档创建一个向量，分配数字 1，如果不存在则分配数字 0。\n\n| --- | --- | --- | --- |\
  \ --- | --- |\n| 1 || 1 || 1 || 1 || 0 || 0 | 类 1 |\n| 0 || 0 || 0 || 0 || 1 ||\
  \ 1 | 类 2 |\n\n现在假设来了一个带有标签的“Welcome to python learning”，对于这个文档，向量变为：\n\n| Welcome\
