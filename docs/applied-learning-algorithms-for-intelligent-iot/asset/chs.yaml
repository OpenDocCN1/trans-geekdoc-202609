  \n在这个时代，缺乏一种无需人工的有效检测精神药物的方法。在这里，侦察无人机具有独特的功能，可以识别精神药物，因为它包含一个自动驾驶系统，可以在 GPS 的帮助下识别药物植物的位置，并且可以进行远程控制。收集的信息将存储在无人机控制器管理的数据库中。本文讨论了自动驾驶工作、用于识别药物植物的图像分类技术，以及用于开发远程接口的信息安全概念，以便通过控制器在数据库中安全地存储收集的信息。无人机通过城市的各个区域观察游荡人员。如果无人机控制器识别出异常的聚集或游荡，位置和信息将发送到最近的派出。现在对于建议的工作，基于现有工作，所提系统已相应修改，通过无人机帮助识别精神药物，其中使用了\
  \ `python` 编程语言的图像分类技术对区域内的药物植物进行分类。`GPS` 追踪器用于由无人机跟踪已识别药物植物的位置。使用最短路径算法将无人机发送到各个位置并返回控制器。该特定算法用于低能量和时间消耗。加密技术如\
  \ `vigenere cipher` 和 `MD5` 哈希算法用于数据库中的数据加密。警察将立即采取行动。设计了一种自动侦察无人机，以揭露并识别在私人土地上非法种植和生长精神药物的个人/团体。每当侦察无人机系统识别出这些精神药物时，它会自动将信息存储在数据库中并通知检查人员。\n\
  \n### 目标 (#ch11.xhtml#c_sec11_001_001)\n\n本文旨在开发一种环保的智能侦察无人机，可用于政府处理的大规模部门检测精神药物，并有助于减少非法药物生产的增长。控制器将通过遥控器控制无人机，将其发送到特定位置以识别精神药物植物。无人机检测私人土地上生长的精神药物，控制器将通过遥控器控制无人机，将其发送到特定位置以识别精神药物植物。无人机检测私人土地上生长的精神药物，控制器将通过遥控器控制无人机，将其发送到特定位置以识别精神药物植物。`GPS`\
  \ 追踪器用于由无人机跟踪已识别药物植物的位置。使用最短路径算法将无人机发送到各个位置并返回控制器。该特定算法用于低能量和时间消耗。加密技术如 `vigenere\
  \ cipher` 和 `MD5` 哈希算法用于数据库中的数据加密。警察将立即采取行动。设计了一种自动侦察无人机，以揭露并识别在私人土地上非法种植和生长精神药物的个人/团体。每当侦察无人机系统识别出这些精神药物时，它会自动将信息存储在数据库中并通知检查人员。\n\
  \n## 文献综述 (#ch11.xhtml#c_sec11_2)\n\n在文献综述中，许多引用引用 `vigenere cipher` 和 `MD5` 哈希进行数据加密。使用了\
  \ `VGG16` 架构。讨论了 `VGG19` 和 `deep convolution` 神经网络。\n\n### 现有系统 (#ch11.xhtml#c_sec11_002_001)\n\
  \n无人机通过城市的各个区域观察游荡人员。如果无人机控制器识别出异常的聚集或游荡，位置和信息将发送到最近的派出。警察将立即采取行动。\n\n### 建议系统 (#ch11.xhtml#c_sec11_002_002)\n\
  \n基于现有工作，所提系统已相应修改，通过无人机帮助识别精神药物，其中使用了 `python` 编程语言的图像分类技术对区域内的药物植物进行分类。`GPS` 追踪器用于由无人机跟踪已识别药物植物的位置。使用最短路径算法将无人机发送到各个位置并返回控制器。该特定算法用于低能量和时间消耗。加密技术如\
  \ `vigenere cipher` 和 `MD5` 哈希算法用于数据库中的数据加密。\n\n## 架构图 (#ch11.xhtml#c_sec11_3)\n\
  \n`Figure 11.1` 阐述了远程接口的完整架构。该接口由控制器可视化并控制，控制器可以在接口中注册并登录。授权人员可以将识别植物和位置的详细信息添加到数据库中，如果管理员想查看位置，他/她必须进行身份验证并检索数据。\n\
  \n\n\n\n\n对于图像分类和植物识别，使用了 ML/Dl 算法 [7]。GPS 追踪器用于跟踪无人机和已识别植物的位置。使用最短路径算法返回控制器。该特定算法用于低功耗和短时间。诸如\
  \ `vigenere cipher`（维吉尼亚密码）和 `MD5 hashing` 技术 [5] 等加密技术用于对收集的数据进行加密，以防止数据泄露。\n\n\
  ## 机器学习 (ML) 模型涉及的主要步骤是：\n\n* 导入必要的包\n* 导入数据集路径\n* 数据预处理\n* 数据增强\n* 数据划分\n* 建立模型\n\
  * 训练模型\n* 准确率结果\n\n## ML 模型每个步骤的研究\n\n对于侦察无人机的图像分类，所有必要的包都从 `python` 中的 `Keras`\
  \ 库中导入。下一步是导入数据集。数据集将存储在笔记本文件所在的相应目录。将提供数据集目录的路径以便在后续步骤中导入数据集。收集的数据不需要是所需的格式。因此，使用了数据预处理技术。数据预处理是准备原始数据并使其适合机器学习模型的过程。使用\
  \ `python` 执行数据预处理，我们需要导入一些预定义的 Python 库，即 `Pandas`。数据预处理技术包括数据格式化、数据清洗和数据采样。数据增强是深度学习中不可或缺的过程。在深度学习中，我们需要大量的数据，在某些情况下，收集成千上万张图像是不行的，因此数据增强应运而生。不需要收集新数据；而是将现有数据转换为所需的形状并存储为增强数据。数据增强操作包括边界框选取、最大池化、裁剪和感兴趣区域\
  \ (`ROI`) 的提取。\n\n### VGG16 架构\n\n这是一种基于卷积的神经网络模型，与 ImageNet 处理集成 [6]。迄今在视觉架构领域，`VGG16`\
  \ 因其卓越性能发挥着至关重要的作用。`VGG16` 最且独特的特征是它不会使用任何超参数。相反，它将具有卷积层，并且在该 `VGG16` 模型架构中将处理相同类型的最大池化和填充。卷积层将使用\
  \ `3 × 3` 层滤波器，每次在最大池化和填充中将使用 `2 × 2` 层滤波器。激活函数如 `Relu` 或 `Softmax` 将在此 `VGG16`\
  \ 架构中作为全连接层以提供输出。在 `VGG16` [5] 中，16 代表与模型架构相关的权重。`VGG16` 包含约 138m 个参数，这得出 `VGG16`\
  \ 神经网络架构是一个非常大的网络模型，正如 [8] 在 图 11.3 中所示。\n\n![图 11.3 VGG16 架构](img/fig11_3.jpg)\n\
  \n### 涉及的模块\n\n1. **图像分类**：捕捉到的图像通过预训练模型 `VGG16` 进行分类。模型已使用多个植物数据集进行训练，并能识别目标植物。\n\
  2. **远程控制**：远程控制器包含一个接口，具有添加位置、列表和在数据库搜索等功能；因此，试图访问/控制无人机的人在尝试获取数据并查看存储其中的原始数据时将通过身份验证。\n\
  3. **无人机机架**：无人机机架使用 tinker-card 工具设计，这是虚拟仿真的最佳工具。\n\n### 工作模块描述\n\n### 图像分类 VGG16\
  \ 模型涉及的步骤\n\n必要的包的导入、数据集导入、图像预处理和计算机视觉模型在 图 11.4 中表示。\n\n![图 11.4 图像分类计算机视觉模型涉及的步骤](img/fig11_4.jpg)\n\
  \n`图 11.5 图像分类内部过程` 表示了从 `Keras` 下载的各种包的步骤、数据集如何导入模型以及输入图像的可视化。接的图像处理通过导入目标图像并在\
  \ `RGB` 和 `HSV` 格式下可视化图像来完成；从而，图像根据颜色进行分割，并在 VGG16 模型中可视化分割结果。\n\n![图 11.5 图像分类内部过程](img/fig11_5.jpg)\n\
  \n### 远程接口加密使用维吉尼亚密码和 MD5 哈希技术完成\n\n#### 维吉尼亚密码 (Vigenere Cipher)\n\n这是一种基于加密的方法，用于加密字母形式的文本。该方法使用了多字母替换法。这种密码基于多个字母的替换。明文消息将通过参考\
  \ 图 11.6 的 `vigenere table` 进行加密以生成密文。涉及到 `vigenere table` 时，它由 26 行 26 列组成，以循环格式填充\
  \ 26 次字母。也就是说，每个字母循环地比上一行的字母向左移动。\n\n![图 11.6 维吉尼亚表](img/fig11_6.jpg)\n\n### 加密\n\
  \n在加密过程中，从任何一行中都使用不同的字母来生成密文。\n\n### 解密\n\n在解密过程中，将执行与加密相反的操作。但唯一的区别是加密操作是在明文上进行的，解密操作是在密文上进行的以获得明文。\n\
  \n### MD5 哈希技术\n\n哈希技术接受任何长度的消息输入，并提供固定长度的消息输出，这也称为 `digest value`（摘要值）。该 `digest\
  \ value` 将用于明文消息认证 [8, 9, 10]。为了提供安全的加密哈希算法和数字签名认证，设计了这种 `MD5 hash` 技术。这有助于验证数据完整性并避免数据损坏。如前所述，这种\
  \ `MD5 hash` 的工作原理如 图 11.7， 所示，接受任何长度的输入消息并生成固定长度的 128 位输出，这也是输入消息的消息摘要。它主要设计用于数字签名认证。\n\
  \n![图 11.7 MD5 哈希技术原理](img/fig11_7.jpg)\n\n如果某些大文件高度机密，那么在使用加密算法结合特定用户的密钥开始加密之前，必须以加密安全的方式进行压缩。这表示文件的数字签名。因此，为了提供这些数字签名，这种\
  \ `MD5 hash` 技术将非常有用。\n\n### 无人机机架\n\n使用 `Tinker cad` 工具设计了一个基础无人机，所有模块都嵌入到无人机中，如\
  \ 图 11.8 所示。\n\n![图 11.8 无人机仿真设计](img/fig11_8.jpg)\n\n\n\n\n\n图 11.8 无人机设计\n\n无人机设计所需的所有组件以及如\
  \ `Arduino` 等处理单元均已使用 `Tinker cad` 工具进行配置，设计的预期输出可以通过在 `Tinker cad` 工具中模拟设计来视觉化。如果预期输出与观测到的输出不符，这可能帮助我们调试电路。\n\
  \n### 实现\n\n本节重点关注感知中用神经网络模型表示的实现方法论，例如卷积和池化技术，以及图像分类实现技术（如 `VGG16`）。这里还讨论了从图像清洗到预处理的步骤，以及使用\
  \ `RGB` 和 `HSV` 色彩模型进行图像可视化。\n\n### 神经网络模型方法的论实现\n\n[Figure 11.9] 表示了包含卷积和最大池化技术的神经网络的实现方法论。\n\
  \n![Figure 11.9 神经网络模型的实现](img/fig11_9.jpg)\n\n图 11.9 神经网络模型的实现\n\n**卷积**：卷积是一种用于从图像中学习表示的操作类型。它们包括一个可学习的卷积核在图像上滑动，并与输入进行逐元素乘法。该规范允许参数共享和位移不变性。下面是持续更新的卷积列表。\n\
  \n**池化**：最大池化是一种计算特征图分块极大值的操作，并用它形成和创建下采样的特征图。它增加了一少量的位移不变性——这意味着对图像进行小幅位移不会显著影响大多数池化输出的值。\n\
  \n### 实现 VGG16\n\n在模型模型中，实现了用于图像分类的 `VGG16`。图像分类过程涉及以下步骤。\n\n### 导入包\n\n在第一步中，在\
  \ `Jupyter Notebook` 中使用 `Python` 编程语言从 `Keras` 库导入 `VGG16` 图像分类的所有必要包。\n\n### 导入数据集\n\
  \n在这里，应将包含精神活性植物图像的数据集导入到 `Jupyter Notebook` 中，以便对数据集进行进一步的数据预处理。该数据集包含 12 种植物的信息。此外，将显示数据集中的样本图像，以检查数据是否已成功导入笔记本中。[Figure\
  \ 11.10] 显示了从导入数据集中作物幼苗图像的样本可视化。\n\n![Figure 11.10 作物幼苗图像可视化](img/fig11_10.jpg)\n\
  \n图 11.10 作物幼苗图像可视化\n\n### 图像预处理\n\n数据集中的图像将进行预处理。在将导入的数据导入笔记本时，可能会出现缺失值和空值。数据可能还包含噪声数据。为了检索这些缺失值并避免噪声数据，将进行数据预处理。\n\
  \n### 导入目标图像\n\n通过 [Figure 11.11] 展示了处理图像以去除不必要像素的过程。直接将此图输入模型将导致目标泄露。分类器将根据这些像素学习对石头和容器的预测。这是需要避免的。预处理从对输入图像进行对象分割开始，它是基于名为\
  \ `OpenCV` 的 `Python` 库的 `RGB` 颜色，因为它是最流行的用于轻松操作颜色的计算机视觉库。\n\n![Figure 11.11 作为输入的目标图像](img/fig11_11.jpg)\n\
  \n图 11.11 作为输入的目标图像\n\n#### 在 RGB 中可视化植物\n\n在 `RGB` 空间中可视化我们打开的小花图像，以查看颜色的分布。`RGB`\
  \ 被视为一种“加法”颜色，颜色以红、绿、蓝和背景一起可视化。从 [Figure 11.12] 给出的 `RGB` 可视化中，图像的绿色部分与红色和蓝色混合，根据\
  \ `RGB` 值在 `RGB` 空间中分割出我们的植物。解决方案是使用 `HSV` 空间。\n\n![Figure 11.12 RGB 可视化](img/fig11_12.jpg)\n\
  \n图 11.12 RGB 可视化\n\n#### 在 HSV 中可视化植物\n\n在 `RGB` 空间中可视化我们打开的小花图像，以查看颜色的分布。`RGB`\
  \ 被视为一种“加法”颜色，颜色以红、绿、蓝和背景一起可视化。由于 `HSV` 代表色调、饱和度和亮度，这在 [Figure 11.13] 中显示了这一点。\n\
  \n![Figure 11.13 HSV 可视化](img/fig11_13.jpg)\n\n图 11.13 HSV 可视化\n\n在 `HSV` 空间中，我们的植物更容易定位和分离。\n\
  \n### 分割\n\n### 基于颜色的分割\n\n为了挑选颜色范围，可以使用颜色选择应用。我找到的绿色范围是：\n* 最小绿色 (36, 25, 25)\n\
