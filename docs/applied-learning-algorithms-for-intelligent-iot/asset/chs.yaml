  \n# 面向数据科学的情感分析新实现\n\nVijayalakshmi Saravanan^(1), Ishpreet Singh^(2), Emanuel Szarek^(2),\
  \ Jereon Hak^(2), 以及 Anju S. Pillai^(3)\n\n¹美国纽约州罗彻斯特，罗彻斯特理工学院教员\n²美国纽约州罗彻斯特，罗彻斯特理工学院硕士生\n\
  ³印度哥印巴托尔，Amrita Vishwa Vidyetham\nDOI: [10.1201/978100319838-8](https://doi.org/10.1201/978100319838-8)\n\
  \n### 目录\n- 引言\n- 相关工作\n- 情感分析背景\n- 提议方法\n- 语音转文本模型\n- 情感分析实现\n- 情感分析架构\n- 结果\n\
  - 语音转文本情感分析的未来展望\n- 结论与未来方向\n- 参考文献\n\n### 引言\n情感分析（`SA`）用于研究人们的情绪、个人对特定事件/话题的态度以及一般行为。`SA`\
  \ 也称为观点挖掘，指的是文本挖掘和自然语言处理（`NLP`）。本质上，数据科学家可以利用这些工具分析大型网络的情感。\n\n沟通是企业层面和个人层面进展的核心要素。沟通有许多种方式，如语音、手势、文本等，其中语音被认为是人类互动最重要的媒介。世界正向数字时代迈进，这也影响了通信。诸如亚马逊的`Alexa`、苹果的`Siri`、谷歌助理等许多语音识别系统已无处不在。语义上可能存在差异，但核心思想保持不变。技术的不断进步使得所有这些出现成为可能。随着移动手机的发明，电话、、信息等成为人类生活中不可或缺的一部分，通过识别实现的短信创新带来了巨大的变化，使语音消息以文本的形式重生。文本转语音（`TTS`）和语音转文本（`STT`）的翻译使得用户与设备的交互成为可能，帮助残障人士并鼓励用户开展更具吸引力的本地和远程服务。\n\
  \n随着世界技术创新的快速发展，`STT`一直在不断改进。与许多现有技术相比，语音识别曾留给科学界的想象空间。语音识别深根于贝尔实验室研究人员在 1952 年的一项研究；它被设计仅用于识别数字[1]。该系统是由亚历山大·格拉姆·贝尔通过一个将声波转换为电脉冲的过程发现的，是最早的创新日期之一[2]。从那时起，语音识别不断增长并扩大其范围。到\
  \ 2011 年，通过`Siri`的发布，与苹果设备进行更简单、实时且更快速的通信成为可能，迄目前，亚马逊的`Alexa`和谷歌 Home 是全球范围内人们喜爱的语音助手。它改变了公司运营业务的方式。但公司缺乏这种手段。\n\
  \n\n\n\n本文的结构如下：“相关工作”章节详细总结了该领域的相关研究文献，随后在“情感分析背景”章节中介绍了 `SA` 的背景。“提出的方法”章节解释了用于实现\
  \ `STT` 和 `SA` 算法所采用的方法。结果在“结果”章节中给出，并在语音转文本情感分析的未来展望”章节中讨论了 `STT` 和情感算法的未来应用前景。最后在“结论与未来方向”章节结束全文，并介绍了未来的工作方向。\n\
  \n## 相关工作\n\n大量的文献表明，研究人员对 `SA` 表现出了浓厚的兴趣。`SA` 识别文本中传达的情绪，并通过分析确定文本表达的是积极、消极还是中性的情感。Kralj\
  \ Novak 等人 [4]] 进行了一项基于表情符号使用的 Twitter 消息 `SA` 研究。所有消息都被标记为积极、中性或消极标签。如果表情符号出现多次，则会统计所有出现次数。他们发现，使用流行的表情符号可以对推特消息的情绪进行分类。他们对不同语言以及所有语言的推特消息进行了比较，发现在所有语言中都有表情符号可以将消息分类为积极、中性或消极。\n\
  \n除了 `STT` 之外，还可以训练算法来识别独特的语音和单词。正如 Saurav Bhandari 等人 [5]] 所提，语音检测系统可以用于解锁和启动汽车。该算法将识别用户的特定声音，并识别用于解锁和启动汽车的指定单词（或句子）。这一想法是为了增加安全性和防止盗窃。为了进一步增强安全性，所提的系统可以使用人脸识别传感器和软件进行扩展。整个系统可以在\
  \ `Raspberry Pi` 上运行。此外，文献中还有许多使用如朴素贝叶斯（Naïve Base）、支持向量机、决策树、最大熵等多种算法的 `SA` 实现\
  \ [6,7,8]]。Mostafa Shaikh 等人 [9]] 提出了一种方法，从给定的文档中将输入句子分类为主观或客观。经典的机器学习（`ML`）技术用于主观部分，并舍弃客观部分。Abburi\
  \ 等人 [10]] 提出了一种基于音频和文本识别产品情感的多模态方法。Fayek 等人 [11]] 介绍了一种基于深度神经网络（`DNN`）的实时语音情感识别，用于从一秒钟的原始语音频谱图中识别情绪。Salah\
  \ 等人的研究 [12]] 考虑了应用于政治辩论的 `SA`。Kaushik 等人 [13]] 提出了一种最大熵建模方法，用于通过 YouTube 的自然音频流流识别（natural\
  \ audio streams）识别情感。\n\n`STT` 已经存在很长时间，并有许多不同的应用。其中一个主要用途是教育目的，即让教学变得更容易 [14, 15,\
  \ 16, 17, 18]]。在 Shadiev 等人 [19]] 的工作中，展示了有助于教育领域的不同 `STT` 翻译方式。显然，`STT` 有许多方式可以增强教育者的学习能力。由于在线课堂的性质，一些老师可能会感到与学生脱节。处理学生的感受可能会很困难。未来可以进行一项可能的研究，结合\
  \ `STT` 与 `SA`，看看是否有不同的技术可以帮助学生学得更好。\n\n社交媒体已成为我们社会中的某种“西部荒”。那里没有很多版主或控制。在大多数情况下，人们可以随心所欲地说或表达。这创造了一个包含积极和消极意见的巨大论坛，充满了数据。对于那些尝试测试新产品市场的人来说，这非常有帮助。一篇使用\
  \ PewDiePie 等 YouTube 玩家进行 `SA` 来评估社交媒体帖子的文章发现了一些有趣的结果。每当内容发布时（通常是 YouTube 内容的转发到\
  \ Facebook 上），通常收到的反馈不太好，大多数评论都是消极的 [20]]。市场分析师可以更好地了解什么能让人们聚集在一起，并利用其作为优势，根据产生这些快乐评论的内容创建广告。\n\
  \n`SA` 的应用是无止尽的。Ben-Porat 等人进行了从自由文本中预测动作的研究 [21]]。将包括短信、Facebook 帖子、推文等在内的文本集合分析作为算法的输入，以预测游戏中执行的动作\
  \ [21]]。该研究证明是成功的，自由文本与人在游戏中会采取的动作之间存在相关性。研究结果偏向某些性别，且分析的数据主要是大学生，但为更大数据集和能够成功分析并预测用户行为的稳健\
  \ `ML` 算法开启了可能性。这对于营销人员和广告商来说是一个非常有用的工具。\n\n除了情感之外，我们还可以查看从 `STT` 收集的数据。Gillick\
  \ 和 Bamman 等人的研究根据给定的音频输入预测歌词 [22,23]]。该项目获取音频源并消除语音，留下背景音。通过算法输入背景，我们可以根据色调创建音乐歌词。`STT`\
  \ 应用产生的数据可以训练和创作歌词。这可以协助音乐家和歌手创作歌词。也许有一天，我们将看到制作人创作节奏，算法开发歌词并成为下一个大虚拟艺术家。\n\n##\
  \ [情感分析背景]\n\n情感分析识别所表达文本中的情感，然后分析其观点，简称为 `SA`。语音识别有很多不同的因素。根据说出的单词，单词被分类为孤立单词、连接单词、连续语音和自发语音。孤立单词就像它听起来的样子，当说单个单词时。会有沉默，说一个单词，然后又是沉默。连接单词是两个而不是一个。一个人说出一个单词，紧接着说另一个单词，间隙极小。连续语音被描述为自然交谈，这些被认为是困难的任务之一，因为话语边界的识别是通过独特的声音和特殊方法完成的\
  \ [24]]。最后，自发语音是随性的语音，你随口就能想到并开始不停。这个功能可以很好地检测用户何时在串联不同的单词，何时没有。\n\n\n\n\n取决于我们成长的地方，每个人的语音方言都不同。有时，对于人类来说，相互理解可能是一项挑战。这对于语音软件的解码也变得更具挑战性。人类具有独特的声音和方言，使得软件更难理解所说的内容。正是由于这些差异，存在两种类型的说话人模型。\n\
  \n(1) **独立型模型**（speaker independent models）是为大众构建的，以便有效地理解大量的说话者。但这种模型实施困难且成本高昂，与**人相关系统**相比，其准确率较低。其被广泛使用的因素之一是其灵活性。\n\
  (2) **人相关系统**（Speaker-dependent systems）与独立系统相反，专为某个特定的目标个体构建。这些系统缺乏灵活性，但因为开发简单、准确性更高且更便宜而受到青睐。对于单说话人模型，它表现出高准确性；而对于多说话人模型，人相关系统的准确率较低\
  \ [24]。\n\n涉及到观点时，人们通常对是否同意或支持某事，或者是否反对某事，持有立场。似乎观点受支持的程度越高，支持/仇恨的力量就越强。通过 `SA`，它尝试区分这两者并将它们放入正面评论或负面评论中。这可以通过两种方式实现：**直接观点**或**比较观点**。通过直接观点，我们直接获得对产品的正面或负面看法。例如，“农村地区的人的生活很贫困”表达了直接观点。同时，对于比较，我们将主体与其他相似类别的对象进行比较。例如，“`village-A`\
  \ 人的生活比 `village-B` 的人更好”表达了比较。\n\n在 Mostafa 等人的研究 [9] 中，作者对每份文档中的句子仅标记了主观部分，并丢弃了客观部分。之后，他们在主观部分应用了经典的机器学习算法，这在句子层面是非常耗耗时的，且测试它们并不是一项容易的工作。为了对\
  \ `SA` 执行 `STT`，我们使用了以下方法：通过逻辑回归和比较来寻找所提议算法的效率。\n\n## 提议的方法](#ch08.xhtml#c_sec8_4\n\
  \n### 语音转文本模型](#ch08.xhtml#c_sec8_004_001)\n\n`STT` 模型建立在在线 `STT` 引擎的概念之上 [25]。任何语音翻译系统的主要目标都是让机器能够根据口语单词进行听、识别并产生动作。运行时的用户声音通过麦克风捕获以处理采样的语音。这允许识别用户说出的单词。识别出的单词随后被转换为文本输出。对于大量的输入语音信号，识别出的单词可以存储在文件中以便进一步的分析和使用。大型复杂系统可以对数据输入采用不同的选择。`STT`\
  \ 算法围绕 `Google STT` Python 库构建。`Google API` 允许我们保持算法非常轻量且具有可扩展性。`Google API` 高效地执行\
  \ `STT`，让开发者专注于为算法添加额外功能并使产品用户友好，如图图 8.1 所示。在提议的工作中，使用了 Python 中的 `STT` 函数，并将用户的麦克风作为输入。\n\
  \n![图 8.1 STT 模型的一般表示](img/fig8_1.jpg)\n\n图 8.1 STT 模型的一般表示\n\n增加了额外功能，如 `SA` 和小组件，以便用户能够轻松使用该算法，并允许工程师查看数据并准确响应。`STT`\
  \ 和 `SA` 算法是一个可以在多个设备上实现的用户友好代码库。\n\n提议的算法存在一些负面影响，因为它依赖于 `Google STT API`。如果 `Google`\
  \ 发生任何停机或故障时间，`STT` 将停止工作。由于 `STT` 依赖于 `API`，未来开发中自定义库和改进的能力是有限的。`STT` 算法非常敏感，如果有强烈的背景噪音，模型将通过从处理的声音中产生不准确的文本导致性能下降。`SA`\
  \ 也有自己的一系列负面影响，即一个为工程师定制构建的小型训练集。由于训练集较小，错误率包含偏差并存在误差。随着时间的推移，收集的数据可改进 `SA` 算法。`SA`\
  \ 算法还可以改进为更具鲁棒性且准确率更高的算法。未来还可以添加其他数据挖掘功能。\n\n| **数据集:** [`www.kaggle.com/c/tensorflow-speech-recognition-challenge`](https://www.kaggle.com)\
  \ |\n| --- |\n| **方法:** 使用的软件是 Python。具体来说，使用了 `libROSA` 和 `SciPy` 库处理音频信号。 |\n\n\
  ### 情感分析的实现](#ch08.xhtml#c_sec8_004_002)\n\n`SA` 也称为观点挖掘，因为它结合了关于主题/产品的大量观点。文本挖掘是用于观点挖掘的技术。`SA`\
  \ 涉及的各种过程如图 8.2 所示。`SA` 算法从在线用户处获取输入并处理原始数据以从输入信号中提取特征。从提取的特征中，识别出形容词以检测用户的情绪。\n\
  \n![图 8.2 SA 实现的通用过程](img/fig8_2.jpg)\n\n图 8.2 SA 实现的通用过程\n\n提议的工作中，`SA` 使用逻辑回归算法实现。逻辑回归是一种分类模型，是工业中使用的分类算法之一。逻辑回归的实现步骤如图\
  \ 8.3 所示。\n\n![图 8.3 逻辑回归实现的步骤](img/fig8_3.jpg)\n\n图 8.3 逻辑回归实现的步骤\n\n算法的输入是来自机械维护的数据集。这些维护数据是输入向量\
  \ `x`。权重向量 `w` 被创建以相应调整预测输出。通过调整权重，算法学习正确分类输出。网络输入被称为输入向量与权重的点积。`Sigmoid` 函数将网络输入固定在\
  \ [0,1] 范围内，用于将输入分类为正面或负面。定义边界函数有助于准确分类输出。\n\n### 情感分析的架构](#ch08.xhtml#c_sec8_004_003)\n\
  \n`SA` 的架构展示了从用户输入得出结论的涉及步骤。图 8.4 显示了 `SA` 架构的详细步骤。\n\n![图 8.4 SA 架构](img/fig8_4.jpg)\n\
  \n图 8.4 SA 架构\n\n## 结果](#ch08.xhtml#c_sec8_5)\n\n在这工作中，采用了带有 `SA` 的 `STT` 翻译让机械师报告模块/部件故障，以便更准确地分类他们的发现。负面分类报告可以由工程师审查以识别模式。`SA`\
  \ 使用逻辑回归算法实现。为了训练算法，创建了训练集和测试文件，包含维护示例消息，如图图 8.5 和图 8.6 所示。训练集包含 75 条正面消息和 75 条负面消息。测试集包含\
  \ 50 条正面和 50 条负面消息。数据经过清洗和向量化，以训练逻辑回归算法。\n\n![图 8.5 正面训练集的截图](img/fig8_5.jpg)\n\n\
  \n\n\n\n# 图 8.5 正训练集快\n\n![图 8.6 负训练集快](img/fig8_6.jpg)\n\n# 图 8.6 负训练集快\n\n## 分析\n\
  一个重要的步骤是找到合适的超参数 `C`。我们尝试了 `C` 的多个值，并选择了最拟合的一个，如表 8.1 所示。\n\n### 表 8.1 不同 C 值的准确率\n\
  \n| `C` 值 | 准确率 |\n| --- | --- |\n| 0.01 | 0.76 |\n| 0.05 | 0.80 |\n| 0.25 | 0.82\
  \ |\n| 0.50 | 0.84 |\n| 1.0 | 0.84 |\n| 1.5 | 0.86 |\n| 2.0 | 0.86 |\n| 3.0 | 0.86\
  \ |\n\n所有高于 `C = 1.5` 的值都没有进一步提高准确率。使用 `C = 1.5` 的值来训练算法。算法训练完成后，根据准确率对其进行了测试和评估。算法的准确率如图\
  \ 8.7](#ch08.xhtml#fig8_7)所示。所提模型的准确率为 81%，可以认为足够实际使用。\n\n![图 8.7 最终准确率](img/fig8_7.jpg)\n\
  \n# 图 8.7 最终准确率\n\n## 集成\n经过训练和测试，逻辑回归算法与 STT 翻译算法集成。该算法使用了 Python 中的 `STT` 函数，并使用用户的麦克风作为输入。输出同时写入\
  \ `.txt` 文件并通过 SA 处理。`.txt` 输出可用于填写机械工单，而 SA 可以发送到工程部门。其他用途也可能适用。为了让 STT 算法更易用，它提供了一个按钮来录制一段时间的用户麦克风声音。可以通过滑块调整时间长度。在图中，滑块被设置为\
  \ 40 秒。\n\nSTT 算法被用于记录多个句子，输出通过了 SA 处理。在图 8.8，显示了几个示例行。\n\n![图 8.8 最终模型输入示例](img/fig8_8.jpg)\n\
  \n# 图 8.8 最终模型输入示例\n\n# 结果\n算法按预期将所有行分类为正类。消息被“1”分类为正类，被“0”分类为负类。进行了多次测试，算法在大多数情况下都能正确分类麦克风的内容。\n\
  \n在我们最初的实验和测试中，我们成功地运行了 STT 算法。STT 本身由 Google STT API 驱动。该 API 在获取语音输入并快速输出文本方面非常强大且准确。通过将\
  \ STT 与我们训练的 SA 结合，我们获得了 81% 的准确率。SA 的输出将帮助机械师找到处理最关键的情况。\n\n## 语音转文本情感分析的未来建议\n\
  \n提议将 STT SA 用于机械师在维护机器时报告他们的发现。STT 算法让机械师更容易报告机器状况，而不是在键盘上打字。当他们离电脑很远或者即使电脑在附近时，这非常有用，因为由于维护或修理机器，他们的手可能会弄脏。SA\
  \ 然后可以由监督维护的工程师使用。通过专注于分析，可以将机器状况分类为负类或正类，从而更易地了解设备状态。这一工具可以与通过传感器数据监控机器状态的实时监控工具并肩工作。将发现的\
  \ SA 与实时监控工具相结合，可以很好地了解机器状态并提高生产率。\n\n除了维护之外，STT SA 软件还有其他应用。当你在餐厅用卡刷单时，读卡器可能会询问你的意见并记录。文件被发送到电脑，电脑通过软件运行语音文件，并将文本和\
  \ SA 同时放入数据库。有些人在女服务员站在身边时给出诚诚的意见可能会感到害羞。女服务员将读卡器留在桌子上，并在顾客付完后再回来可以解决这个问题。\n\n同样的方法也适用于对\
  \ App 或 Uber 司机评分。星级或数字评分并不一定需要通过语音操作。然而，当有评论框时，可以用语音代替。消息的情感可以作为星级或数字评分的补充，为 App\
  \ 或 Uber 司机评分。\n\n## 结论与未来方向\n\nSTT SA 的应用被建议机械师在维护机器时报告他们的发现。STT 算法让机械师更容易报告机器状况，而不是在键盘上打字。这非常……（注：原文末尾部分存在大量重复的占位符文本，根据指令“不要重复输出原文”原则，此处仅保留核心语义翻译并遵循\
