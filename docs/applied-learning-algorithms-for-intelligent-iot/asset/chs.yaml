  ## 结论\n\n在“用于执法检测和警报非法药物植物的物联网自动化间谍无人机”这项工作中，主要讨论了三个模块。第一个模块将有一个集成了摄像头、内置 GPS 导航和图像分类应用程序的自动飞行器，用于从指定位置生长的一组植物中分类精神活性药物。第二个模块是图像分类应用程序的详细介绍。该应用程序将用于分类无人机通过摄像头捕捉的植物种类。为了构建此图像分类应用程序，使用名为\
  \ `VGG16` 的卷积神经网络模型来从一组植物图像中分类精神活性药物。该 `VGG16` 神经网络模型使用 `python` 编程语言实现，并以 `Jupyter\
  \ Notebook` 作为平台，来自 `Keras` 库。本工作讨论了图像分类的内部处理。最后，第三个模块是关于远程控制界面的。应该有一个由控制器控制的控制器控制无人机。该远程控制器的独特之处是其内置了一个\
  \ GUI 应用程序，供控制器存储从无人机收集的信息。收集的信息和用户详情必须安全以避免数据泄露。在这里，使用了加密算法，既用于加密收集的信息，也为应用程序提供机密性、认证和完整性。控制器在收集信息后将将详情存储在此\
  \ GUI 应用程序中，该程序关联一个数据库，以便他将来可以检索信息并对识别出的土地所有者采取适当行动。该 GUI 应用程序安全性将使用如 `Vigenere\
  \ cipher algorithm` 和 `MD5` 哈希技术等加密算法来提供。最重要的事情之一，无人机将结合最短路径算法，以便将无人机送到不同的指定位置并快速返回控制器。这有助于无人机在所有可能的路径中选择最佳且最短的路径，以减少能量消耗和时间。本工作的输出见该节。\n\
