  \n### 引言\n\n太阳能是清洁、免费且丰富的资源[[1]]。人类的主要责任是采纳联合国的可持续发展目标（SDGs）履行社会责任，如果人类能够利用这种再生能源促进社会进步，这是可以实现的。到达地球高层大气层的太阳辐射强度为\
  \ 174 PW（174 × 10¹² kW），陆地、海洋和大气吸收的太阳能平均量约为 121.8 × 10¹² kW。在地球距离太阳的平均距离处，地球大气层外垂直于太阳光接收到的太阳能率为\
  \ 1.373 kW/m²。\n\n太阳能通过两种方法进行利用，例如太阳光伏（SPV）和太阳能热技术（STT）[[2]]；STT 的应用范围比 SPV 更广。STT\
  \ 用于以 (i) 低温（< 100°C）或 (ii) 高温（高达 500°C）的形式收集和储存太阳能。使用的各种太阳能收集器包括平板集热器（FPC）、聚焦太阳能热集热器（CSC）和真空管集热器（ETC）。FPC\
  \ 和 ETC 用于低温应用，如生活热水供应、住宅、商业和机构建筑的空间供暖以及工业过程热。CSC 提供等级较高的热能，甚至可以驱动热机。太阳池是一种在盐梯度水池中低成本收集和储存大量低温的方法。太阳池可以在\
  \ 70°C 到 100°C 的温度范围内提供长期热能。\n\n### 太阳池\n\n太阳池（SPs）是具有不同盐度梯度的水体，称为盐层，即池盐度随深度增加而增加。这些太阳池拥有三个不同的区域，即上对流区（UCZ）、非对流区（NCZ）和下对流区（LCZ）。由于盐度的存在，这些区域密度不同，它们通过阻止对流效应来储存热能。到达池底的太阳辐射加热\
  \ LCZ 的水，由于 LCZ 的密度较高，阻止了水向池表面的整体运动，从而将热能限制在 LCZ 内部。在 LCZ 收集和储存的热能用于各种工程应用。因此，太阳池是捕和储存太阳能的最有效方法之一[[3]]。太阳池的应用包括工业过程加热、海水淡化、温室供暖、作物干燥、发电、制冷和空调。太阳池的典型示意图如图\
  \ 14.1 所示。\n\n![图 14.1 太阳池典型示意图](img/fig14_1.jpg)\n\n图 14.1 太阳池典型示意图\n\n太阳池储存的能量通过结合内部或外部热交换器用于上述应用。这种低温储能系统（LTES）的主要关注点是其热效率较低（15%至\
  \ 25%）以及太阳池的运行周期。太阳池的热效率定义为：通过热交换器从太阳池提取的总能量与落在太阳池表面的总太阳辐射量之比。过去文献中的研究人员报告了不同的工作。有人研究了侧壁绝缘厚度对\
  \ SP 效率的影响[[4]]。目前进行的研究工作是通过在热交换器的流道中提供扭流带，并在 LCZ 中放置掺有 CuO 纳米颗粒的封装相变材料（PCM）作为 LTES\
  \ 系统，以提高太阳池的性能。\n\n### 太阳池低温储能系统（LTES）\n\n基于相变材料（PCM）的热能储存（TES）在各种能源相关应用中具有巨大潜力[[5]]。太阳能的可用性仅限于白天，因此太阳池只能在白天运行。因此，必须通过\
  \ LTES 来平衡供需。储存的两种方式是显热储能和潜热储能。然而，由于能量密度更高，更倾向于潜热储能。可用多种 PCM；但在本次实验中选择了石蜡，因为它易于获得，而且石蜡在经过数次充放电循环后物理化学性质不会发生变化。在这项研究中，LTES\
  \ 与 LCZ 耦合；热循环中的三个过程为 (i) 充电、(ii) 储存和 (iii) 放电。图 14.2 展示了这些过程。\n\n![图 14.2 LTES\
  \ 涉及的过程](img/fig14_2.jpg)\n\n图 14.2 LTES 涉及的过程\n\n## 背景研究\n\n许多研究人员讨论了使用 PCM 提高导热率的方法。Shu-Rong\
  \ 等提出了将不同比例的多壁纳米管与石蜡混合以提高导热率的方法[[6]]。在该研究中，石蜡中加入了 CuO 纳米颗粒。通过对具有松散多通道的圆管中的三维传热和流动行为进行数值研究，分析了使用扭流带增加对流传热速率的影响[[7]。Karunamurthy\
  \ 等讨论了 Al[2]O[3] 纳米颗粒提高导率的影响[[8]]。\n\n机器学习（ML）技术被广泛用于减少物理实验的次数，从而减少预算、人力自然资源。研究人员讨论了使用线性回归预测连续值（当预测变量与响应变量之间存在较大相关性时）。由于收集的数据量较，研究人员建议使用线性回归预测[[9],[10]]。Christopher\
  \ 等比较了使用线性回归与神经网络的优缺点[[11]]。Mahesh Gadhavi 等讨论了该方法的其他应用[[12]]。\n\n### 实验装置\n\n制制的实验装置参考\
  \ Huseyin Kurt 等（2006），如图 14.3 和 14.4 所示。\n\n![图 14.3 太阳池实验装置](img/fig14_3.jpg)\n\
  \n\n\n\n\n图 14.3 太阳能池实验装置\n\n![Figure 14.4 LCZ 中热交换器示意图](img/fig14_4.jpg)\n\n图 14.4\
  \ LCZ 中热交换器示意图\n\n使用 0.15 cm 的镀锌铁板制造了一个尺寸为 50 cm × 60 cm × 60 cm 的实验室模型太阳能池。热交换器由外径为\
  \ 1.2 cm、内径为 1.05 cm 的铜管制成，放置在太阳能池的 `LCZ` 中，共有五段循环。实验使用的三种不同太阳能池为：(i) 普通 `SP`；(ii)\
  \ 带有 `LTES`（`CuO 纳米颗粒 PCM`）的 `SP`；(iii) 带有 `LTES`（`CuO 纳米颗粒 PCM`）和涡流带的 `SP`。进行实验，并将扭转比为\
  \ 6.36 的最佳涡流带放置在流道中以增强换热速率。涡流带提供了二次流和湍流，从而提高了换热速率。\n\n选择壳牌品牌的 `PCM` 石蜡（`n-Tricosane\
  \ C23H48`）作为储能材料，并将其封装放在太阳能池的 `LCZ` 中作为 `LTES` 进行实验。然而，石蜡 `PCM` 的导热系数为 0.214 W/mK（固体）和\
  \ 0.15 W/mK（液体）。这很差，为了提高导热系数，加入了 `CuO` 纳米颗粒。\n\n`PCM` 中混合的 `CuO` 纳米颗粒百分比有一个限制，因为在\
  \ `PCM` 中加入过多的 `CuO` 纳米颗粒会导致聚集，这是不理想的。在这方面，通过实验来确定可以添加到 `PCM` 中的 `CuO` 纳米颗粒的最佳比例。混合\
  \ `CuO` 纳米颗粒的封装 `PCM` 以及使用的涡流带分别如图 14.5(a)和(b)所示。\n\n![Figure14.5 (a) 涡流带和 (b) 封装\
  \ PCM](img/fig14_5.jpg)\n\n图 14.5 (a) 涡流带和 (b) 封装 PCM\n\n## 实验\n\n在太阳辐射照射条件下对三个太阳能池进行了实验。使用的传热流体是水，允许其在层流和湍流条件下流过热交换器的流道，雷诺数分别为\
  \ 1804 和 9020。研究的目标是获得热交换器更高的出口温度，这表明性能更好。与出口水温度相关的各种参数包括环境温度、水进口温度、太阳辐射、流速和 `LCZ`\
  \ 温度。\n\n使用连接到数字温度计的 `K`-型热电偶测量了环境、进口、出口、`LCZ`、`NCZ` 和 `UCZ` 等温度。到达太阳能池的太阳辐射通过太阳辐射计测量，每天使用太阳辐射计测量\
  \ `LCZ`、`NCZ` 和 `UCZ` 的盐度以确保盐分层的存在。提供了采样口以从 `LCZ`、`NCZ` 和 `UCZ` 获取样本。在 2019 年 5\
  \ 月至 6 月的 41 天期间，每天上午 8:00 到下午 6:00 每 30 分钟记录一次数据。列出了平均值以分析太阳能池的性能参数，如出口水温度、升温、换热速率、太阳能池效率和热交换器效率。\n\
  \n## 太阳能池性能参数\n\n1. 换热速率\n\n`Q` = `m`*cp*(`To`−`Ti`)，(14.1)\n\n其中\n\n`Q` – 换热速率\
  \ (W)\n`Q’` – 最大换热量 (W)\n`ṁ` – 质量流量 (kg/s)\n`Cp` – 比热容 (J/kg °C)\n`To` – 出口温度 (°C)\n\
  `Ti`– 进口温度 (°C)\n`TLCZ` – `LCZ` 温度 (°C)\n\n2. 最大换热速率 (`Q’`) $Q’ = \\overset{\\dot}{m}{Cp}\\\
  left( {TLCZ}–{Ti} \\right)$\n\n3. 热交换器效率\n\n$\\in = \\frac{Q}{Q’}$(14.2)\n\n4. 太阳能池效率\n\
  \n$\\eta = \\frac{{Useful}{heat}{carried}{away}{by}{flow}{medium}}{{Radiation}{incident}\
  \ \\ast {Surface}{area}{of}{solar}{pond}}$\n\n## 使用机器学习建模\n\n智能是这个时代的需要，预计不仅来自人类，也来自机器。`ML`\
  \ 是一项赋予计算机在没有显式编程的情况下具备智能能力的领域。`ML` 的应用范围从家电电机的自动开关切换等日常应用，到控制卫星运行等更复杂的应用。\n\n在此过程中，`ML`\
  \ 在工业 4.0 中成为不可或缺的一部分，通过预测性维护、需求预测、质量控制等技术使机械工程领域的应用变得更加智能化。通常，会在太阳能池上进行多次实验，提供的输入参数和获取的输出结果将在实验期间存储为关系型数据集。对收集的数据集进行分析，以识别可以产生最佳性能的输入值。但这个过程需要详尽的重复，并将导致材料和时间的浪费。在机器可以学习模式的情况下，`ML`\
  \ 技术是一种福音，可以减少资源、预算和时间的浪费。图 14.6 展示了使用线性回归进行建模的过程。\n\n![Figure 14.6 建模](img/fig14_6.jpg)\n\
  \n图 14.6 建模\n\n## 数据收集与预处理\n\n收集的数据存储在 Microsoft Excel 文档中，列表示特征，行表示每次实验的数据。在 41\
  \ 天内创建了约 820 条记录。环境温度、水进口温度、太阳辐射通量和 `LCZ` 温度被认为是输入参数，出口水温度记录为输出参数。记录了三个池的 `LCZ`\
  \ 和水温。\n\n特征的选择和可靠完整的数据对于准确预测输出至关重要。用于记录数值的太阳辐射计、热电偶等电子元件制成的，因此容易产生。此外，数据是在不同时间段采集的，可能的环境变化也会影响数据的记录。数据的格式和范围在特征之间也不同，因此可视化也变得困难。这一步骤为收集的数据准备好适用于所选模型的输入。整个过程使用\
  \ Jupyter notebook 编程，数据使用 Microsoft Excel 以逗号分隔值 (CSV) 格式存储。\n\n### 数据清洗\n\n在数据收集过程中，可能会丢失某些值。这可能是由于数据不可用、某些数据验证规则或设备故障或人为错误造成的。但无论原因如何，都应该通过处理这些缺失值使数据集完整。\n\
  \n执行以下步骤以清洗数据：\n\n*   删除缺失三个或更多值的实验值（行）。使用这种方法，总共删除了 18 行。\n\n\n\n\n- 对于每个特征，当缺失值较少时，计算平均值并用其填充缺失值。图\
  \ 14.7 表示了原始数据集和用平均值填充后的缺失值状态。\n\n![图 14.7 缺失值（填充前后）。](img/fig14_7.jpg)\n\n图 14.7\
  \ 缺失值（填充前后）。\n\n### 归一化\n\n每个属性的数据是在不同的范围和单位下收集。机器学习建模算法基于数值数据工作，因此变量在不同的尺度上进行测量。温度以摄氏度测量，入射太阳辐射通量以\
  \ `Watt/m²` 为单位。不同特征对应的数值范围对机器模型拟合的贡献并不相同，可能会对整个系统产生偏差。此外，数据范围的变化会使视觉化变得非常困难。因此，应用归一化将所有数据的数据范围转换到\
  \ 0 到 1 之间。我们的建模使用了如公式 14.3 所示的最小最大归一化。\n\n$x_{norm} = \\frac{x - \\min(x)}{\\max\\\
  left( x \\right) - \\min(x)}$(14.3)\n\n### 离群值分析\n\n在数据收集过程中，可能会出现电子元件故障导致随机数据的情况。尽管是由人工记录的，但这种随机性可能被忽视，导致训练不当。因此，需要识别并移除离群值，即在收集的数据中距离其他值异常遥远的观测值。使用箱线图进行此类分析，位于两端超出\
  \ 1.5 * 四分位距之外的数据被视为离群值并移除。图 14.8 表示了使用箱线图识别出的各种范围，图 14.9 表示了入口太阳辐射通量的离群值分析。\n\n\
  ![图 14.8 用于离群值分析的箱线图](img/fig14_8.jpg)\n\n图 14.8 用于离群值分析的箱线图\n\n![图 14.9 “太阳辐射通量”的离群值分析](img/fig14_9.jpg)\n\
  \n图 14.9 “太阳辐射通量”的离群值分析\n\n### 相关性分析\n\n由于输出属性的值是连续的并分布在一个范围内，因此需要回归建模。线性回归（LR）是回归中最简单且常用的技术\
  \ [9]。逻辑上，LR 通过拟合直线对输入与输出变量之间的关系建模，并遵循以下假设：\n\n1. 记录之间相互独立。\n2. 输入与输出之间的关系保持线性。\n\
  3. 输入属性之间存在极小或没有相关性。\n\n假设 1 得到了，因为实验是在不同的时间进行的，且没有考虑这种关系。假设 2 和 3 通过相关性分析得到观察，相关性分析是一种用于计算不同特征之间关系强度的方法。使用散点图形象地展示特征之间的相关性。独立特征与输出特征之间的相关性通过散点图进行可视化，并在图\
  \ 14.10 中展示。\n\n![图 14.10 用于相关性分析的散点图](img/fig14_10.jpg)\n\n图 14.10 用于相关性分析的散点图\n\
  \n为了分析数据的数值分布，热力图是一种更好的图形表示工具，用颜色表示数据值。从白到黑的变化表示数据范围的分布。可以通过热力图直观理解相关性。图 14.11 展示了表示相关性的热力图。从图中可以看出，所有输出温度与所有输入变量均呈正相关，因此选择线性回归对数据集建模。\n\
  \n![图 14.11 表示相关性的热力图](img/fig14_11.jpg)\n\n图 14.11 表示相关性的热力图\n\n## 线性回归\n\n模型的准确性使用平均绝对误差\
  \ (MAE)、均方误差 (MSE) 或均方根误差 (RMSE) 等各种指标进行评估。我们使用 RMSE 作为标准误差分析指标。公式 14.5 定义了 RMSE\
  \ 的计算。\n\n${Root}{Mean}{Square}{Error} = \\sqrt{\\frac{\\sum_{i = 1}^{n}(x^{i} -\
  \ {x\\prime}^{i})^{2}}{n}}$(14.5)\n\n其中 *x*[*i*] 表示输入属性的实际值。\n\n*x*′[*i*] 表示因变量的预测值。\n\
  \n\n\n\n数据集被分为两个随机数据集，即训练集和测试集，比例为 80 到 20。包含 80% 数据的第一个集合称为训练数据集，用于拟合模型。训练集包含了具有已知输出的输入集，模型通过它学习泛化到其他数据。第二个包含\
  \ 20% 数据的集合称为测试数据集，用于检查拟合是否准确且可接受。Python 的 `scikit-learn` 库中的 `train-test-split`\
  \ 包被用于划分数据集。该包对行进行随机拆分，以避免因环境条件可能引起的偏差。\n\n数据集分为输入特征和输出特征，分别称为“X”和“Y”。使用 scikit-learn\
  \ 库的 `train-test-split` 函数，`X` 和 `Y` 被分为四个子集，即 `X_train`、`X_test`、`Y_train` 和 `Y_test`。它们的维度分别为\
  \ (642,4)、(642,)、(160,4) 和 (160,)。选取了三个代表不同太阳能池的此类数据集进行建模。\n\n## 拟合与预测\n\n通过应用特定模型寻找系数的最估计值被称为“拟合”模型。这是使用训练数据集完成的，该过程被称为学习或训练模型。scikit-learn\
  \ 库的 `linear_model` 用于通过多线性回归训练训练数据。一旦通过数据模式学会了学习或训练，模型将返回一组四个系数。\n\n`Coefficients`:\
  \ [0.460255841.047128560.00551125−0.07416891]\n\n`Intercept`: −14.436684821577494\n\
  \n该方程可以写成如等式 14.6 所示。\n\n`outletwatertemperature = 0.46025584[1]*x*[1] + 1.04712856*x*[2]\
  \ + 0.00551125*x*[3] − 0.07416891*x*[4] − 14.436684821577494(14.6)`\n\n然后使用 scikit-learn\
  \ 库的 `predict` 函数预测测试数据的出水温度。将测试数据的预测值与数据集中的原始输出值进行比较。[图 14.13] 展示了一个样本的比较。\n\n\
  ![图 14.13 实际值与预测值的样本分析](img/fig14_13.jpg)\n\n图 14.13 实际值与预测值的样本分析\n\n### 结果与讨论\n\
  \n### 准确率\n\n准确率是衡量预测正确性的重要标准 [11]。它定义为正确预测次数与总预测次数之比。使用 3D 图对预测准确率进行视觉测试，该图支持超过两个特征的可视化。[图\
  \ 14.14] 展示了出水温度的原始值以及预测变量（带有环境和进水温度的出水温度）的预测值。\n\n![图 14.14 实际值与预测值](img/fig14_14.jpg)\n\
  \n图 14.14 实际值与预测值\n\n计算出的 MAE、MSE 和 RMSE 如下所示。发现这些值小于假设的阈值，令人满意的。\n\n### 拟合优度\n\n\
  为了理解数据变化的拟合优度，计算了 R² 值（决定系数）。该值反映了由回归模型定义的自变量变异比例。如果预测值接近实际值，R² 值将接近 1。相反，如果预测值与实际值无关，则\
  \ R² 将接近 0。所提模型获得的得值为 0.9928512303131685，因此接近 1。\n\n## 未来工作\n\n太阳能池仍处于业余阶段，尚需开展研究以增强其性能并实现商业化。LCZ\
  \ 热储能材料、侧壁和池底的非腐蚀（材料）层有很大的空间。这是一种低温储能方法，需要优化工艺参数以实现商业化发电。太阳能池运行涉及许多工艺参数。上述工作仅使用了少数参数，且处理的数据集仅针对特定时段。此外，我们的模型未能正确识别预测变量之间的共线性。\n\
  \n未来的工作可能集中于处理海量数据，并对自变量之间的关系进行适当分析。此外，源自机器学习建模的准确率等指标，对于研究人员为所述问题增加业务价值并无用。可以通过应用优化技术获得输入参数的最值。\n\
