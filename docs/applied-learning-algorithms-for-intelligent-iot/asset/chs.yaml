  \n25. B. Raghavendar Reddy, E.\n\n\n\n\n\n# K-Means 聚类与其他无监督算法的比较\n\n# 优缺点\n\n##\
  \ 结论与未来工作\n\n## 参考文献\n\n### 引言\n\n“K-means”这一术语最初由 James MacQueen 在 1967 年作为其手稿的一个主要部分提出。标准的计算方法同样在\
  \ 1957 年被贝尔实验室作为击动程序微调中的一种特征方法进行使用。它随后由 E. W. Forgy 分发。\n\n大多数基于经验的未证实目的都将子领域作为聚类。这是一种根据它们共享的特定元素将信息测试汇聚成簇的方法——这正是任何无监督学习背后的动力。我们被给了一个具有特定特征的物体信息索引，以及这些特征的属性。任务是将这些物体分为\
  \ K 个集合。为了实现这一目标，我们将使用 `K-means` 算法，这是一种无监督学习算法。为了计算相似性，我们将使用欧几里得距离作为估计。\n\n## 背景研究\n\
  \nTajunisha 等人 [1]。针对高维信息，利用不同的声明技术对 `K-means` 进行执行分析，使用了主成分分析 (`PCA`) 来衡量减少并发现初始类群。具有最高特征值的变量通过\
  \ `PCA` 确定，并被用进行分配的第一个主分量，在此基础上形成 K 个子集，并取 K 个中值作为初始 K 个类群。\n\nBouhmala 等人 [2]。联合遗传算法\
  \ (`GA`) 和 `K-means` (`GAKM`) 被用于改进所形成簇的性质并加速其搜索过程。`GAKM` 的性能在数据集上进行了测试，例如从机器学习库中提取的\
  \ iris、glass 等。测试结果表明，`GAKM` 与标准 `GA` 相比收敛更快。尽管该算法未能捕捉簇的最优性质，但它对于扩展同一簇内部的同质性和不同组之间的异质性仍然是不够的。\n\
  \nRouhollah 等人 [3]。提出了一种名为 `GA` 聚类的模型以改进 `K-means` 算法。该算法在著名数据集上执行过，具体为 iris 和原油。测试结果给出了聚类标准\
  \ μ；较低的 μ 值提供了与传统的 `K-means` 聚类算法相比更好的信息分组安排。\n\nJyothi A. P. 等人 [4]。该论文对当前的聚类方法及其在生命科学数据中的适用性进行了内部和外部检查。\n\
  \nN. Kaur 等人 [5]。本文考虑了通过引入排序技术对传统的 `K-means` 进行升级。作者提出了排序技术以克服传统 `K-means` 执行时间较长的局限性。排序方法是一种发现比较性信息事件并提高搜索可行性的方法。用于执行改进算法的设备是利用\
  \ `C#` 的 `Visual Studio 2008`。本文还研究了 `K-means` 的中心点。作者发现 `K-means` 是一种快速、有效且易于解释的算法。此外，簇在本质上是非重叠的，且在性质上是不覆盖的。计算中使用的过程以未标记作为信息索引，然后选择初始质心。然后从质心确定每个数据对象的欧几里得距离。此时，为每个数据集合设置边缘值。直接应用定位方法，最后根据数据点与质心之间的最小距离形成簇。\n\
  \nSandeep Rana 等人 [6]。本文提出了另一种混合顺序聚类方法。他们在信息聚类中使用了粒子群优化 (`PSO`) 和 `K-means` 算法进行数据分组。提出这种方法的目的是为了克服这两种算法的缺点，并改进聚类。为了获得更好的聚类效果，考虑了多种算法，例如\
  \ `PSO`、`K-means`、混合 `K-means` 等。所提出的算法产生了更精进的聚类结果。\n\nJyothi A. P. 等人 [7]。该论文提出了一种新型\
  \ `CFCLP` 逻辑演示，它通过一种新的组合方法利用信息汇聚来开发复杂的规划。在 `MEMSIC` 节点上执行了先进科学演示，证明 `CFCLP` 有助于维持传感器执行力与信息传输之间的良好平衡。\n\
  \nBara’a Ali Attea 等人 [8]。本文发现，随着覆盖数量的增加，聚类算法的性能会下降。这些事实启发了构建一种用于信息分组的创新型多目标粒子群优化系统\
  \ (`FMOPSO`)，它可以比尖端聚类算法提供更有效的解决方案。为了确定所提算法的主导性，在各种数值和真实的信息索引上进行了测试。\n\nJyothi A.\
  \ P. 等人 [9]。该论文提出了一种多阶段增强演示来解决大规模生命科学问题，并据此检查了定义的理想聚类设置。\n\nChetna Sethi 等人 [10]。本文提出了一种基于\
  \ `PCA` 的交叉 `K-means` 聚类和 `PSO` 算法 `PCA-KPSO`。在 `PCA-KPSO` 计算中，将 `K-means` 算法的快速混合与\
  \ `PSO` 的全局搜索能力相结合以处理大型数据集。与传统的 `PSO` 相比，`PCA-KPSO` 可以获得更好的分组结果。\n\nRui Xu 等人 [11]。“聚类算法综述”。数据分析对于理解不同特征起着关键作用。包分析、未标记研究，或者另一方面缺乏早期信息，是在广泛的数据集上创建的。这种多样性一方面为我们提供了各种工具；但另一方面，方案的丰富带来了困扰；综述了出现在测量、软件设计和人工智能\
  \ (`AI`) 领域的算法，并展示了它们在几个基准数据集、旅行销售代表问题和生物信息学（另一个专注于领域）中的应用。\n\n\n\n\n\nXiaohui 等人\
  \ [13].]. 论文利用 `PSO` 进行归档聚类。`K-means` 计算是用于海量数据集划分的最常用的计算方法，但它产生的是邻域理想布局。与仅局限于查看\
  \ `K-means` 的属性不同，`PSO` 利用整个布局空间进行全局搜索。创建者在四个从文本检索获取的数据集上使用了 `PSO`、`K-means` 和半杂交（half\
  \ breed）`PSO` 聚类计算。\n\nJyothi A. P. 等人 [14].]. 本文框架提出了一种利用星际方向新颖思想的拓扑控制组件，用于升级无线传感器网络（WSN）中的分组执行。在采用一种说明性探索哲学后，所提出的框架展示两个基于星际的拓扑控制框架，侧重于组头资源利用的最极端节约。实验复现结果表明，与当前\
  \ WSN 中的各种分级分组方案相比，所提出的地理控制框架提供了巨大的生命力保护执行力。\n\nOsama Abu Abbas 等人 [15].]. 论文展示了\
  \ `K-means` 聚类算法与其他无监督算法的对比，即 `HC`、`SOM` 和 `EM` 聚类算法。\n\n## K-Means 聚类概述 (#ch09.xhtml#c_sec9_3)\n\
  \n`K-means` 聚类属于无监督学习的一类，即一种自主识别，用于当你拥有未标记数据时。其目标是计算记录中的簇，以获得由变量 `K` 指定的聚类数量。`K-means`\
  \ 聚类的方法如图图 9.1 所示。\n\n![Figure 9.1 K-Means 聚类方法](img/fig9_1.jpg)\n\n图 9.1 K-Means\
  \ 聚类方法\n\n## K-Means 聚类运行机制的洞察 (#ch09.xhtml#c_sec9_4)\n\n该方案遵循一种基本且一致的方法，通过预先定义的细致簇图形来描述给定的信息文件。基本提议描述了\
  \ `K` 个质心，每个簇中一个。这些必须以一种智能的方式设置，因为不同的区域会导致不同的结果。因此，最优选择会将它们在空间上彼此彼此离开。\n\n随后的阶段使每个直接数据点指向一个已知的信息文件位置，并将其分配到最近的质心。当没有新目标时，执行基本的演进和早期的分组处理。\n\
  \n目前，我们需要作为接近的聚类的重心，重新计算 `K` 个新质心（`KNCs`），这是由于参考点的移动。在重新计算这些 `KNCs` 之后，必须在比较的信息文件中心和最近的\
  \ `NC` 之间准备另一个组合。\n\n形成一个循环。据此，我们观察到 `K` 个质心每次稍微改变其区域，直到没有变化。最后，质心不再发生移动。\n\n##\
  \ K-Means 聚类算法涉及的步骤 (#ch09.xhtml#c_sec9_5)\n\n以下是涉及的步骤：\n\n*   任意形成 `K` 个质心。\n*\
  \   `K-Means` 分配信息集中的每个数据点，使其靠近质心。\n*   然后 `K-means` 通过对分配到该质心簇的所有数据点取平均值并宣布新质心来重新配置质心，导致与上一步相比的整体簇内差异减少。\n\
  *   重复步骤 2 和 3，直到质心不再发生任何移动。\n\n## 使用 K-Means 聚类算法在武装冲突战斗员同步健康健身器上的实时项目实现 (#ch09.xhtml#c_sec9_6)\n\
  \n该项目的目标是跟踪武装冲突战斗员的位置，并使用 `k-means` 聚类算法提供同步健康健身监测。\n\n### 提出的工作 (#ch09.xhtml#c_sec9_006_001)\n\
  \n所提工作的目标是形成聚类。在这个项目中，被称为部队的通过 `K-means` 聚类算法形成。武装部队首长担任簇头，负责汇总该部队内所有战斗员的数据。`K-means`\
  \ 聚类算法的使用在该项目上起着至关重要的作用，并作为恐恐和紧急情况下为军事人员提供帮助的一个非常重要的建议。\n\n项目结果有助于定位战斗员，并将检查并更新的健身参数发送武装部队首长和军队控制室。一个部队的首长（武装部队）可以通过使用\
  \ `NRF` 模块与另一个部队的首长（武装部队）通信。一个部队的战斗员可以通信并在任何危机情况下提供帮助。\n\n武装部队首长收集的数据将上传到云端军队控制室，以便为战斗员提供必要的帮助。\n\
  \n图 9.2 显示了所提工作的通信模型，由战斗员段、武装部队首长段和军队控制室组成。\n\n![Figure 9.2 所提工作的通信模型](img/fig9_2.jpg)\n\
  \n图 9.2 所提工作的通信模型\n\n每个段都将在“设计方法与实现”章节。 中讨论。\n\n### 设计方法与实现 (#ch09.xhtml#c_sec9_006_002)\n\
  \n#### 战斗员段 (#ch09.xhtml#c_sec9_006_002)\n\n该段具有一组连接的传感器。用于检查战斗员的状况、发现位置并检测战争区域的任何危险。\n\
  \n#### 武装部队首长段 (#ch09.xhtml#c_sec9_006_002)\n\n该段具有数据聚合设施，从战斗员收集数据并消除冗余数据。聚合的数据将通过云使用\
  \ `K-means` 算法发送。\n\n#### 军队控制室段 (#ch09.xhtml#c_sec9_006_003)\n\n该段具有云基础设施的计算机系统。云上的可用将在计算机系统中显示。\n\
