  \ 等人 \\[2\\]。论文研究了机器学习中利用序数回归方法的多分类问题。多分类基于决策树的构建。支持向量机被用作分类工具。论文展示了针对三分类方法的核序数回归。\n\
  \nEkta Ghambir 等人 \\[3\\]。论文研究了新型冠病毒传播的分析和预测，这有助于采取未来的预防措施和必要步骤。通过实施带有多项式回归算法的机器学习模型，可以预测印度在未来\
  \ 60 天内的病毒传播情况。回归算法是一种监督机器学习算法，它读取以前数据、对其进行分析并对实时数据提供准确预测。为了从该模型获得最佳结果，需要对数据进行提取和选择。\n\
  \nShen Rong 等人 \\[4\\]。论文分析了受温度条件变化影响的冰冷产品。线性回归模型基于自变量和因变量之间的关系。在这项工作中，预测温度被视为自变量，冰冷产品被因变量。线性回归的实现在\
  \ `Python 3.6` 平台上通过各种包完成的。回归模型给出的预测结果有助于公司控制市场上冰冷产品的生产和销售。\n\nKi-Young Lee 等人 \\\
  [5\\]。论文通过深度学习和线性回归算法，通过监督学习比较了线性回归与人工神经网络。AI 以两种方式工作：监督学习和无监督学习。监督学习是指人类提供数据和逻辑推理。无监督是指计算机获取数据并在预览数据的监督下执行任务。论文致力于使用基于神经\
  \ AI 的回归模型来预测未来的行业利润。\n\nKhushbu Kumari 等人 \\[6\\]。论文解释了线性回归模型的分析。回归模型是一种统计模型，比较实时数据集中因变量和自变量之间的关系。在这里，患有血压的患者被用作预测患者身体状况不同变化下血压变化的变量。线性回归模型根据个人健康状况日常习惯的变化预测其血压的升高。\n\
  \nKarunya Rathan 等人 \\[7\\]。论文讨论了加密货币，也被称为比特币，被视为互联网资产。互联网平台上对比特币的需求日益增长，使本文致力于研究比特币每日价格率的预测。他们的研究包含了带有决策树和回归算法的机器学习算法。对这两种算法进行了比较，发现回归算法的结果比决策树更准确。\n\
  \nSovojit Manna 等人 \\[8\\]。论文研究使用机器学习算法预测航班延误。梯度提升决策树用于航空交通延误的预测。梯度提升决策树可以更有效地处理回归模型。所提出的特征可以供公众、游客和航空公司用于以非常准确的方式获取航班延误信息。\n\
  \nAI Amin Biswas 等人 \\[9\\]。使用了随机森林回归方法来检测交通事故和伤亡人数。回归模型首先分析数据集，然后预测测试数据集或实时数据集。可以看出回归模型提供了良好的性能。\n\
  \nTessy Badriyah 等人 \\[10\\]。论文使用机器学习分析中风疾病的分类。通过图像处理技术，将图像收集作为数据集。随机森林算法使用测试数据集和真实数据进行预测。随机森林算法证明了其具有最高的准确率。\n\
  \nK Vijyakumar 等人 \\[11\\]。所提出的系统致力于患者糖尿病的早期预测。该系统是根据随机森林算法的机器学习算法概念开发的。回归模型用于预测的数据集的分类和比较。因此，该算法在结果中表现出高准确率。\n\
  \nSunakshi Mamgain 等人 \\[12\\]。作者提出了一个模型，通过考虑价格、维护、安全、里程等参数来预测市场上汽车的受欢迎程度。通过引入机器学习算法、随机森林算法和回归技术，对\
  \ 1–4 级汽车的受欢迎程度进行预测。\n\nGiorgio Biagetti 等人 \\[13\\]。论文研究用于非线性系统识别的伯斯坦多项式。伯斯坦多项式具有一种属性，即系数是固定网格点上待近似函数的值。伯斯坦多项式特别适用于解决多元回归问题。结果显示了该技术识别非线性系统的准确性，并与标准技术相比提供了更好的性能。\n\
  \nSwapanil Sayan Saha 等人 \\[14\\]。作者关注水果、蔬菜和鱼类受甲醛污染的危害。研究探讨了高率使用甲醛以保持水果、蔬菜和鱼长时间新鲜，这导致了健康问题。系统模型结合了多项式回归、线性回归和\
  \ Levenberg–Marquardt 算法，这些都是监督机器学习算法。系统提供了不同温度水平下甲醛浓度的准确预测。通过应用逻辑回归和支持向量机，系统可以识别人工添加和天然配方的甲醛。\n\
  \nChing-Seh (Mike) Wu 等人 \\[15\\]。研究侧重于实施不同的机器学习技术（如回归和神经网络），这些技术可以预测客户对周五销售的分析：过去消费的客户以及准确地预测未来的客户，以帮助零售人员计划如何控制人群、管理账单并增加销售。\n\
  \nJunheung Park 等人 \\[16\\]。研究关注具有愤怒、抑郁、压力、疲劳等多个参数的心理健康指数。通过预测这些指数，我们可以增加心理健康的实用性并将其应用于医疗系统。预测模型是通过使用四种机器学习算法开发的，即支持向量回归、广义回归神经网络、多层感知器和\
  \ k-近邻回归。\n\n# [机器学习中不同类型的回归算法]\n\n机器学习中的回归算法分为以下几种类型：\n\n1.  简单线性回归\n\n2.  多项式回归\n\
  \n3.  支持向量回归\n\n4.  决策树回归\n\n5.  随机森林回归\n\n### [简单线性回归]\n\n\n\n\n线性回归是一种由弗朗西斯·加尔顿爵于\
  \ 1984 年提出的可测量策略`[6]`。线性回归可能是最为人知且最迷人的回归策略之一。简单线性回归是一种实性策略，能够确定并研究两个不同定量因素之间的关系。线性回归是一个直接模型，一种在信息因子（`A`）与单一结果变量（`B`）之间建立直接联系的模型。在这里，我们预测一个依赖于信息变量（`A`）的客观变量（`B`）。目标变量与指标之间应该存在线性关系，如此。当只有一个信息变量（`A`）时，该策略被称为简单线性回归。当存在多个信息因素时，该技术被称为多元线性回归。\n\
  \n考虑根据代表人的年龄预测薪酬。我们可以毫不费力地判断出代表人的年龄与薪酬之间确实存在关系（年龄越大，薪酬越高）。线性回归计算最主流的应用可能是在货币组合预期、薪酬评估、土地预测以及高峰期交通拥堵的预计到达时间（ETA）。线性回归的假设公式为：\n\
  \n`A = x + yB`\n\n`A` 代表薪酬，`B` 是代表人的年龄，`x` 和 `y` 是条件的系数。通过这种，在给定 `B`（年龄）的情况下预测 `A`（薪酬），我们需要知道\
  \ `x` 和 `y` 的估计值（模型的系数）。\n\n在准备和构建回归模型时，这些系数通过学习和拟合来准备信息。准备的目的是寻找最佳拟合线，目标是使代价函数最小化。代价函数有助于估计误差。在准备过程中，我们试图限制真实值与预测值之间的误差，从而限制代价函数。在`图\
  \ 5.1]`中，红点是信息点，蓝线是准备信息的预测线。为了获得预测值，将这些信息点投影到直线上。\n\n![图 5.1 线性回归图](img/fig5_1.jpg)\n\
  \n图 5.1 线性回归图\n\n总结来说，我们的目标是找到限制代价函数的系数估计值。最广为人知的代价函数是均方误差（`MSE`），它等同于感知值的真实值与预测值之间的均平方差。系数的估计可以利用梯度下降法确定，该方法将在后详细介绍。简而言之，在梯度下降中，我们从系数的任意估计值开始，处理这些值的代价函数梯度，更新系数并再次计算代价函数。重复此循环，直到我们找到代价函数的底部估计值。\n\
  \n### 线性回归的意义 (#ch05.xhtml#c_sec5_003_002)\n\n线性回归模型的意义对于以下底层原因至关重要：\n\n- **描述性**\
  \ – 它有助于研究结果（因变量）与独立预测变量之间关联的强度。\n- **调整** – 它能适应协变量或异常值的影响。\n- **预测因子** – 它有助于预测和评估影响因变量的未来风险因素。\n\
  - **预测范围** – 它有助于研究自由信息变量和依赖结果变量的进展程度。\n- **预测** – 它有助于评估新的结果。\n\n#### 健康相关数据分析中的简单线性回归模型\
  \ (#ch05.xhtml#c_sec5_003_002_001)\n\n在自然或健康相关的临床数据中，线性回归模型经常用于通过可测量评估来描述两个因素之间或几个因素之间的关系。例如，为了了解高收缩压（`SBP`）的概率是否受变量（例如年龄、身高和体重）的影响，可以使用直接回归。要阐释的变量，即\
  \ `SBP`，被称为因变量；而另一方面，解释它的反应因子（年龄、身高、体重和性别）被称为自由因子。\n\n### 多项式回归 (#ch05.xhtml#c_sec5_003_003)\n\
  \n非线性信息在日常生活中随处可见。考虑材料科学和物理学中的某些运动状态。\n\n- **抛体运动**：抛体的高度计算公式为 `h =–½ *gt² + *ut*\
  \ + *ho`\n- **自由落体状态下的运动状态**：物体在重力作用下自由下落 `t` 秒后经过的距离为 `½ *gt²`。\n- **匀加速物体运动距离**：距离可以确定为\
  \ `u*t + 1/2*a*t²`，其中：\n    - `g` = 重力加速度\n    - `u` = 初始速度\n    - `ho` = 初始高度\n\
  \    - `a` = 加速度\n\n除了这些模型，非线性模式也出现在组织生长速度、流行病传播进展、黑体辐射、摆动运动等方面。这些模型明显表明，独立属性和依赖属性之间我们并不能总是具有线性关系。因此，线性回归是处理此类非线性情况的一种无力决策。这就是多项式回归大显身手的地方！！\n\
  \n多项式回归是一种处理二次、立方或更高级关系情况的奇妙方法。多项式回归的基本思想是将每个独立变量的幂作为新属性，然后在此基础上训练线性模型。\n\n在多项式回归中，我们将一阶特征转换为多项式特征，然后对其应用线性回归。考虑上面的直线模型：`Y\
  \ = a + bX` 变为类似于 `Y = a + bX + cX²`。\n\n它仍然是一个线性模型，但曲线是二次的而非直线。`scikit-learn` 提供了多项特征类来转换特征。因此，如果我们尝试在图中使用简单线性回归，线性回归线将无法良好拟合。在`图\
  \ 5.2`所示的图中，很难以低误差估计值进行拟合。因此，我们可以尝试使用多项式回归来拟合多项式线，从而获得基础误差或最小代价函数（`图 5.2)`）。\n\n\
  ![图 5.2 多项式回归图](img/fig5_2.jpg)\n\n图 5.2 多项式回归图\n\n如果我们增加阶数到很高，曲线将过拟合，因为它也学习了数据中的噪声和异常值。\n\
  \n使用多项式回归的优点：\n- 多项式提供了因变量与独立变量之间关系的最佳估计。\n- 它可以拟合广泛的函数。\n- 多项式从根本上拟合了范围。\n\n使用多项式回归的缺点：\n\
  - 数据中的少数异常值确实会影响非线性分析的结果。\n- 它们对异常过度敏感。\n- 此外，用于识别非线性回归异常的模型认可工具比线性回归少得多。\n\n\n\n\
  \n# COVID-19 增长模式分析中的多项式回归模型\n\n新冠病毒在全球范围内巨大的灾难中传播。这种瘟疫侵染了埃及许多人。世界卫生组织表示，COVID-19\
  \ 可能通过接触和呼吸道飞沫以极快的速度从个人传播给个人。如今，埃及和全球所有国家都在加倍努力以研究这种疾病并消除这种瘟疫的影响。在本文中，我们分析了从 2020\
  \ 年 2 月 15 日至 2020 年 6 月 15 日的埃及冠状病毒真实数据库，并对感染冠状病毒的患者数量进行了预测，评估了疫情的最终规模。我们应用了一些回归模型对埃及冠状病毒进行数据分析。在研究中，我们针对\
  \ COVID-19 数据集分别应用了七种基于回归回归的模型，分别为多项式、二次、三次、四次、五次、六次和 logit 回归。结果表明，四次、五次和六次多项式回归模型非常惊人，这与有助于政府制定一个月策略的四次模型不同。此外！我们应用了著名的\
  \ logit 回归模型，并获得了相关的流行病学知识：最初，疫情峰值可能出现在 2020 年 6 月 22 日，最终于 2020 年 9 月 8 日结束。此外，病例的最终总规模为\
  \ 1.6676e+05 例。政府在长时间内的干预活动对于限制最终规模至关重要。\n\n## 支持向量机回归\n\n在机器学习（ML）和数据分析中，支持向量机（`SVMs`，也称为支持向量分类）是一种监督学习模型，其学习算法基于分类分析来研究模式回归分析。它由\
  \ Vapnik 等人在 AT&T 贝尔实验室提出。在支持向量机回归（`SVR`）中，我们区分一个具有最极端边缘的超平面，使得尽可能多的点位于该边缘内部。SVR\
  \ 在实践上类似于 SVM 分类计算。SVM 是另一种极其强大的算法，根据 Oracle 文具有基于 Vapnik–Chervonenkis 假设的坚实理论基础。这种监督机器学习算法具有强大的正则化能力，既可用于分类问题，也可用于回归问题。它们的特点是使用核函数、解的稀疏性以及通过作用于间隔（或支持向量的数量）获得的容量控制等。系统的容量由不依赖于特征空间维度的参数控制。由于\
  \ SVM 算法原生运行在数值属性上，因此它对数值属性使用 z-score 归一化。在回归中，SVM 算法使用损失函数的间隔来解决回归问题。\n\n与其像线性回归那样限制误差率，我们尝试将误差限制在一个特定的边缘内。我们在\
  \ `SVR` 中的目标是从根本上考虑边缘内部的点。我们的最佳拟合线是具有最多点的超平面。在 SVM 算法中，`c` 间隔始终被视为变分间隔。\n\n在 `Figure\
  \ 5.3` 中，`上下` 线代表带有间隔的模式。\n\n![图 5.3 支持向量回归](img/fig5_3.jpg)\n\n## 决策树回归\n\n决策树可用于分类和表征。在回归中，每一层我们需要区分分裂节点。如果数学模型完全同质，其标准差为零。\n\
  \n寻找分裂节点的步骤简述如下：\n\n1. 使用下公式计算目标变量的标准差：\n   $$\\sigma = \\sqrt{\\frac{1}{N}\\sum_{i\
  \ = 1}^{N}\\left(x_{i} - \\mu \\right)^{2}}$$\n\n2. 在不同属性上划分数据集，并计算每个分支的标准差（目标和指标的标准差）。将该值从划分前的标准差中减去。结果是标准差的减少量：\n\
  \   `SDR(T, X) = SD(T) - SD(T, X)`\n\n3. 选择标准差减少最大的属性作为划分节点。\n\n4. 根据所选特征的估计对数据集进行划分。此操作在非叶分支上递归运行，直到处理所有信息。\n\
  \n为了防止过拟合，使用了离散系数（`CV`），它被用来决定何时停止。最后，将每个分支的均值分配给连接的叶子节点（在回归中取均值，而在叶子节点分类方法中取众）。\n\
  \n## 随机森林回归\n\n随机森林是一种聚合方法，我们考虑若干棵随机回归树的预测结果。\n\n1. 选择一个随机点。\n\n2. 确定 `n`，其中 `n`\
  \ 是要创建的选择树回归器的数量。重复步骤 1 和 2 以生成若干棵回归树。\n\n3. 在每个决策树中，将每个分支的均值分配给叶子节点。\n\n4. 为了预测变量的输出，对所有选择树的多个预测均值取平均值。\n\
  \n## 使用机器学习回归技术进行空气质量预测的研究\n\n\n\n\n\n空气质量检测和预测在许多机械化和城市地区已成为最基础的趋势之一。空气的性质受到不同类型毒素的极大影响。随着空气污染的加剧，必须实施高效的空气质量监测模型；这些模型收集了关于空气毒素浓度的数据。我们提出了一种通用且可行的方法来处理三个问题：预测、插入和显著性分析。这三个问题已经通过三个不同的模型得到了解决；但在所提出的框架中，我们可以在名为深度空气学习（DAL）的单一模型中处理这三个问题。该方法将未标记的时空信息相关联，以提高插入和空气质量预测的性能。我们根据基于印度卡纳塔克邦污染控制委员会（KSPCB）获得的实时数据源的研究对我们的方法进行了评估。本研究的目的是检查用于检测和预测空气质量的各种计算机推理和基于机器学习的方法。实验开发使用了\
  \ `Python` 语言。\n\n图 5.4 详细展示了空气质量预测系统，表示了来自数据库的数据如何被预测系统捕获、验证和处理，直到达到最后一步，即生成查询结果。\n\
