  \ | --- | --- |\n| 1 || 1 || 0 || 1 || 0 || 0 | 未知类 |\n我们将未知类的文档向量与代表我们参考文档类的向量进行比较，它非常类似于类\
  \ 1 文档向量：\n\n未知类：`<1,1,0,1,0,0>`\n\n类 1：`<1,1,1,1,0,0>`（匹配向量：5）\n\n类 2：`<0,0,0,0,1,1>`（匹配向量：1）\n\
  \n我们可以将数据标记为类 1（最大匹配向量数）。这是统计自然语言处理方法之一。\n\n\n这是一种机器学习算法，其中一个或多个独立变量产生所需的输出。在这种情况下，可能只有两个结果。回归的最终目标是实现最佳拟合。它是基于预测分析的。在此，我们可以通过\
  \ log 函数假设概率。\n\n\n\n可以使用逻辑回归进行天气预测。该过程从分析以前的数据和天气报告开始，从而预测当天的所需天气规格。但通过逻辑回归，我们只能预测它是否会发生\
  \ [7]。\n\n\n如果患者入院，需要监测其健康状况。可以通过其医疗报告中的历史预测疾病的严重程度。因此，我们可以预测任何疾病的严重程度高或低。我们还可以预测他所患特定疾病的风险因素。\n\
  \n\n无监督学习是不需要标记响应并可以绘制自己的引用的学习算法。聚类分析是常用的以欧几里距离或概率距离作为标准的无监督学习算法。聚类算法包括：\n\n这种聚类通过构建聚类树创建多级聚类层次。\n\
  \n这是最简单的无监督算法。正如名称所示，聚类根据某些模式划分数据。这些无监督算法从数据集的输入向量中得出结论，而不使用标记结果。该过程是根据簇质心将数据划分为不同的簇。与监督学习不同，结果不是标记的；相反，它通常对数据进行分组。它们由数据点表示，并且形成的簇必须是相关的。\n\
  \n\n这包括使用称为软聚类的方法对聚类进行建模。它们也是使用软计算方法分布数据点的概率模型。高斯混合模型类似于高斯分布或正态分布。高斯考虑均值和方差来更新质心，而\
  \ k-means 仅考虑均值。\n\n\n该模型使用观测数据来恢复状态序列。这些被用于生物信息学、数据挖掘和模式挖掘。\n\n与监督学习相比，无监督学习允许用户执行更复杂的任务。\n\
  \n与其他学习方法相比，无监督学习是不可的。无监督学习算法包括聚类、异常检测、神经网络等。\n\n\n\n\n\n无监督学习问题可以分为聚类和关联。\n\n\n\
  聚类技术处理从未分类数据中观察某些结构或模式。它们通过从数据集中发现簇来处理数据。它们还会考虑粒度并根据此进行调整。\n\n有不同类型的聚类：\n\n### 1.1\
  \ 互斥（划分）\n\n示例：`k-means`\n\n在这里，所有数据都是簇。为了减少形成的簇的数量，会执行并集操作。\n\n\n在这里，模糊数据集有助于对数据聚类。可能有两个或多个簇与不同程度的成员身份相关。在这里，数据与适当的成员值相关。\n\
  ### 1.4 概率\n这种技术使用概率分布来创建簇。\n\n“男鞋。”\n“女鞋。”\n“女手套。”\n“男手套。”\n\n这些可以被聚类为两类：“鞋”和“手套”，或“男”和“女”。\n\
  \n簇还可以被分为：\n- 层次聚类\n- `k-means clustering`\n- `K-NN` (k 近邻)\n- `主成分分析`\n- `奇异值分解`\n\
  - `独立成分分析\n\n\n\n\n这使得数据集内部的可用数据之间建立关联。这种技术被用于发现大型数据库中变量之间的关系。\n\n示例：\n- 癌症患者根据其基因表达进行分组。\n\
  - 根据浏览和购买历史对购物者分组。\n- 电影可以根据观众给出的评分进行分组。\n\n\n异常检测用于从正常数据中识别不常见的项目、事件或观测值。在这种情况下，系统使用正常实例的大量数据进行训练。因此，在异常实例中，机器检测是否存在某些异常行为并声称其为异常。\n\
  \n一个例子是信用卡欺诈检测，可以使用机器学习中的异常检测技术来解决。在这里，系统检测任何未知的信用卡交易，有助于防止欺诈活动。\n\n聚类是根据标准将输入数据集分组为不同的簇或组的过程。当未知关于簇的精确信息时，就可以进行聚类。\n\
  \n例如，在超市里，我们可以看到不同的项目是如何分组和安排的。同样，像 Amazon 和 Flipkart 等电子购物网站使用聚类算法根据用户需求对其产品进行分组。\n\
  \n可视化是创建图表、图像、图谱、图表等以传递和交流信息的过程。\n\n例如，足球教练拥有团队在锦标赛中的表现数据，以便快速找到所有比赛统计数据。我们可以将复杂且未标记的数据输入某些可视化算法。\n\
  \n这些算法可以表示为数据在绘图图中的 2D 或 3D 表示输出，这有助于确定结果。\n\n降维是在不丢失过多信息的情况下通过减少变量数量的过程。这种技术的目标是简化数据。\n\
  \n执行降维的一种方法是特征提取，其中所有相关特征都被合并。\n\n减少维度可能会导致信息的丢失。即使它能加速训练，但也会使系统性能略有下降。\n\n因此，只有在训练非常缓慢时才使用降维。否则，使用原始数据。\n\
  \n在社交媒体中，我们使用无监督学习技术检测欺诈并根据不同标准学习分类。\n\n考虑 Facebook 例如，它使用人脸识别；这通过识别全球不同地区的人来提供帮助。此外，信息流部分根据他们的兴趣和喜好进行过滤。\n\
  \n\n这是机器学习的第一步。在这一步中，我们收集所需的数据。这取决于质量和数量。例如，如果我们想识别特定物体，第一步是颜色、大小、纹理。\n\n### 数据准备\n\
  收集数据后，下一步是准备我们的数据，包括排序和去偏。这意味着我们的数据必须以准备训练的方式进行。将数据分为训练数据和测试数据是重要的，其中训练数据占 80%。\n\
  \n### 选择模型\n下一步是识别选择问题和所用学习技术的模型。我们已经知道有很多适用于不同目的的模型，有必要选择正确的一个。\n\n### 训练\n正如名称，训练是模型最初开始学习的阶段。我们分配用于训练的\
  \ 80%的数据被用于教授我们的模型。为了训练模型，必须进行更多的实验以实施。权重、偏置和数学模型的使用有助于预测。如果输出是满意的并且从不同的输入中获得了输出，则训练是成功的。\n\
  \n### 评估\n此阶段实际上识别模型是否能够达到熟练度和准确性。在这里，模型可能会遇到在训练阶段未曾见过的各种情况。评估步骤有助于检查目标是否达成，特别是使用未用于训练的数据时。\n\
  \n在此阶段，我们可以通过进行某些修改来调优参数并检查是否可以改进训练以获得更好的结果。这可能包括在训练中未考虑的其他参数。另一种方法是多次运行我们的数据集以获得更高的准确性。\n\
  \n\n\n\n\n\n机器学习流程的最后一步是预测。这一阶段使模型为实际应用做好了准备。在这个阶段，模型开始在没有人工干预的情况下得出自己的结论。这一步骤实际上是人类预期行为的结果。人类预测与模型预测之间的主要区别在于模型可以同时处理海量数据，而人类不能。这一过程有助于减轻人类决策过程的负担并得出结论\
  \ [6]。\n\n\n我们上面讨论了机器学习的基础。现在，如今的市场市场上有很多技术趋势正在出现。根据 Statista 的报告，2019 年第一季度已有 285\
  \ 亿美元投入机器学习技术中，我们甚至无法想象其目前增长得有多快 [7]。大量的机器学习技术将产生更远的影响，改变全球行业的基础。这些包括数字数据监管、语音助手、营销、网络安全，以及各种行业\
  \ [8]。正如所述，机器学习在银行、农业、医疗、汽车和金融系统等领域有着广泛的应用。\n\n\n机器学习银行应用的使用彻底改变了金融世界，使其更易用。主要领域包括信贷决策、反欺诈和个人助手。银行通常收集大量数据，通过这些数据可以推导出更好的规则来帮助信用评分\
  \ [7]。可用数据使用机器学习算法进行训练，并最终改进，以对接受更多信用评分的申请人做出决策。自动化程度的提高为这些技术铺平了道路，可以在几分钟内评估涉及风险，比人工努力改进得多。每个金融部门都非常容易受到欺诈，防止欺诈在当今世界是一项大事。为了检测欺诈，会分析消费模式以及持卡人或客户的位置并检测异常。此外，系统还可以通过考虑模式中的偏差或异常来发现任何形式的可疑活动\
  \ [9]。\n\n\n\n机器学习在农业中的作用在我们社会中起着至关重要的作用，因为农业是全球经济中的主要领域之一。我们生活的生活需要极大改进，而这完全取决于我们吃的食物类型。促进和保护我们的经济非常重要。因此，种植健康的种子、保护作物、确定收获什么种作物，都可以通过使用机器学习算法进行分析。许多零售商使用这项技术来培育更好的作物。在农业领域可以采用的其他方法还包括确定作物的性质以获得最佳产量、寻找与作物相关的害虫和疾病，以及预测何时给作物浇水。它还有助于预测害虫情况。农业机器人的设计用于管理和执行从播种、浇水、监测作物到检测疾病的所有基本活动。采用人工智能和机器学习的主要部分是识别土壤、天气状况，并培育将产生良好产量并保持作物健康的作物\
  \ [10]。\n\n\n\n机器学习在医疗保健领域的应用帮助患者利用实时数据提前分析和预测数据。考虑并从不同系统获取实时患者数据，以预测治疗方案。涉及机器学习的医疗主要部分是识别疾病和诊断疾病。机器学习的另一个应用涉及使用早期记录的数据进行个性化医疗预测。`IBM\
  \ Watson Oncology` 是用于个性化医疗以跟踪患者历史并利用治疗方案的工具之一。人工智能和机器学习在预测任何流行病或疾病方面具有巨大影响 [11]。\n\
  \n\n\n机器学习帮助汽车制造商预测销售甚至其制造过程。车辆使用这一概念引入无人驾驶汽车。它还可以辅助驾驶员旅程。可以预测并控制汽车的速度和移动，还可以引导并通知任何紧急情况或危险并防止事故。数字孪生和机器学习的使用有助于管理汽车，并进行可以虚拟化处理和监控的任何操作\
  \ [12,13]。\n\n\n有很多工具和程序包可以实现机器学习算法。这些包包括 `pandas`、`matplotlib`、`pycharm`、`Google\
  \ Colab`、`scikit-learn` 和 `keras`。\n\n\n这是一个用于数据分析的开源 Python 库。它们用于加载不同格式的文件并处理数据。这些包有助于执行机器学习的重要过程，如数据准备、清洗、处理、建模和分析。\n\
  \n### Matplotlib（#ch02.xhtml#c_sec2_27）\n\n这是一个用于绘图的二维 Python 库。它有助于模型的可视化并从中得出结论。它可以与所有不同类型的其他包一起使用处理大量数据。\n\
  \n这包括交互性很强的网络应用程序，可以共享实时代码文档，并开发、执行、分析和讨论结果。它具有更高的功能和用户场景。还可以与其他工具一起使用，并支持不同的语言。\n\
  \n### Google Colab（#ch02.xhtml#c_sec2_29）\n一个交互式笔记本，维护整个文档并帮助与其他用户共享并共同执行代码。它与 Jupyter\
  \ Notebook 类似。通过 Colab，我们可以充分利用库对数据进行分析和可视化。它还助于训练和测试大型数据集，并进行可视化评估和做出预测。由于与 Google\
  \ 合作，它利用了 Google 服务器和 GPU。\n\n### Scikit-learn（#ch02.xhtml#c_sec2_30）\n\n它是最常用的机器学习\
  \ Python 库。它包含许多不同的工具，能够实现所有学习算法并执行统计建模。scikit-learn 有许多功能，如监督学习算法、无监督学习算法以及数据集和特征提取。在使用\
  \ `scikit-learn` 之前安装 `Pandas`、`Numpy` 和 `Scipy` 包是非常重要的。\n\n\n机器学习（ML）是人工智能的一个子集，普及所有的应用程序。机器学习是一个计算机系统模拟人类行为并比人类更快执行所有活动的过程。通常，监督学习算法可以帮助用较少的数据解决问题并清晰地对其进行标记。\n\
  \n\n\n\n无监督学习对于大型数据集具有更好的性能和结果。这是一项机器学习技术，你不需要对模型进行监督。无监督机器学习有助于在我们的数据集中发现各种未知模式。这些学习算法用于未标记的数据集。该算法的主要应用范围之一是量子计算机，它们擅长处理大型张量积空间中的高维向量。监督和无监督量子机器学习算法的发展将使向量的数量及其维度比经典算法呈指数级地增长。随着技术和应用的快速增长，机器学习在当今时代中发挥着越来越重要的作用。它最终在不同方面让人类生活变得便利，例如疾病预测与监测、机器人、自动驾驶汽车、农业领域等。随着技术的增长，机器学习将在几年内主宰世界。\n\
