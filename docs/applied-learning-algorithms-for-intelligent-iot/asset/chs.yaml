  \n\n\n\n恶意软件是执行恶意操作的代码，例如破坏计算机操作、窃取敏感信息、未经授权的访问、监视、发送垃圾邮件泛滥、引发分布式拒绝服务攻击以及勒索文件。对恶意编程历史背景的简要回顾告诉我们，恶意软件的危险从计算之初一直伴随着我们。最早的有记录病毒感染出现于\
  \ 20 世纪 70 年代。它被称为 `Creeper Worm`（蠕虫虫），是一种实验性的自我复制程序，它在远离框架的地方复制自己并显示信息：“我是蠕虫，有能的话就抓住我吧。”随后，在\
  \ 20 世纪 80 年代中期，`Elk Cloner`（鹿克隆者）出现了，这是一种针对 `Apply II` `PCs` 的启动分区感染。从这些基础的起点开始，一个巨大的产业应运而生，从那时起，反击恶意软件的战斗从未停止过\
  \ [1]。\n\n查看从 2011 年至今恶意软件总数的统计数据，可以看到创建恶意软件的数量剧增。由于恶意软件的海量增长，对发现恶意软件的需求已急剧扩大，根据\
  \ `Kaspersky labs` 报告，2018 年有 5,638,828 个不同的主机遭受了攻击。`Juniper Research` 的另一篇文章指出，仅在\
  \ 2023 年数字犯罪分子就会获取超过 330 亿条记录。根据 `Symantec` 的数据，移动恶意软件变体在 2017 年增加了 54%，而 `IoT`\
  \ 设备增长高达 600% [2]。\n\n木马病毒是最常见的恶意软件类型。不同类型的恶意软件 [3,4] 会影响我们的设备并损害隐私和性能。\n\n1. **木马\
  \ (Trojans):** 这种恶意软件伪装成合法的应用程序并安装在设备上。该程序可以窃取敏感信息、监视活动、获取设备访问并下载其他恶意软件。\n2. **键盘记录器\
  \ (Keyloggers):** 这种恶意软件设计用于记录或捕捉 `android` 设备上输入时的击键。这些应用程序在互联网上随处可见。大多数应用伪装成家长控制应用，一些开发者将这些应用作为监控其他手机的手段。\n\
  3. **勒索软件 (Ransomware):** 勒索软件主要针对计算机攻击，但勒索软件也会影响安卓设备。勒索软件加密设备中的所有数据并要求付费以解密文件。\n\
  4. **间谍软件 (Spyware):** 间谍软件可以作为根包（root kit）或应用程序安装，监控包括消息、电话、照片、视频和位置在内的所有数据，甚至可以使用摄像头进行直播。\n\
  5. **风险软件 (Riskware):** 这是一种不被分类为恶意软件的程序，而是潜在的不受欢迎程序。风险软件以不可理想的方式利用系统资源，并带来安全风险。\n\
  6. **广告软件 (Adware):** 广告软件窃取你的 cookie 信息并据此投放广告。即使设备未连接互联网或未使用任何程序时，广告软件也会显示广告。广告软件被视为从第三方网站下载的潜在不受欢迎程序。\n\
  7. **病毒 (Viruses):** 病毒会破坏甚至更改你框架中的敏感信息，从而破坏 `CIA` 三元组（机密性、完整性和可用性）。\n8. **根包 (Root\
  \ kit):** 如果攻击者在你的框架中注入了根包，他们可以随心所欲。它保持伪装且极难区分。\n9. **后门 (Backdoors):** 如果引入了后门，入侵者进入你的框架时永远不需要任何确认。当引入间接访问时，这些可以注入感染、蠕虫和木马。\n\
  \n以下是各种恶意软件攻击 `Windows` 系统的百分比。\n\n木马病毒是攻击 `windows` 系统最常用的恶意软件。与其他恶意软件相比，木马攻击的比例约为\
  \ 64%，这是一个很高的数字。病毒是第二常用的恶意软件攻击，与所有其他恶意软件相比占 15%。蠕虫位居第三，攻击比例占 7%。这些是我们必须担心的前三种攻击。勒索软件是一种致命的恶意软件攻击，但从攻击比例来看，它仅为\
  \ 0.93%，与前三相比非常低。\n\n识别恶意软件的传统方法依赖于基于特征的检测。但现在发生的恶意软件攻击大多是零日恶意软件。零日恶意软件是一种最近才发现的特定恶意软件，我们无法对其进行分类或检测\
  \ [5]。`AI` 的出现带来了希望，即我们仍然能够检测和分类这些类型的恶意软件。\n\n## 现状技术 (ch04.xhtml#c_sec4_2)\n\n\
  ### 基于安卓的恶意软件检测 (002_01)\n\n安卓恶意软件变得流行，网络犯罪在安卓环境中不断增加。大多数恶意软件开始在安卓社区中流传的暗网上销售。第一代\
  \ `Android OS` 于 2008 年发布，从那以后安卓系统一直是智能手机的热门选择。现在全球有 25 亿活跃安卓用户。谷歌将安卓系统向智能手机制造商开源，因此该系统可以根据制造商的需求进行定制。流行的安卓制造商如\
  \ `Samsung`（三星）、`One Plus`（一加）、Xiaomi（小米）、Oppo、Huawei（华为）为了安卓皮肤（skin）并应用到系统上。原生安卓（即原始系统）由\
  \ `Google Pixels`、`Nokia` 和一些制造商使用。在原生系统上使用皮肤确保了手机机型具有更好的性能规格；但某些制造商通过收集用户数据侵犯了用户的隐私。\n\
  \n第一个安卓恶意软件报告于 2010 年，`DroidSMS` 是一种木马，一种短信欺诈应用。该程序在受影响的手机上自动订阅。订阅过程在用户不知情的情况下在后台进行。同年，另一种木马\
  \ `TapSnake` 发布。该程序通过 `HTTP` 泄露设备的 GPS 位置，通过该 GPS 间谍应用让其他设备获取设备位置。\n\n简要强调了近年来用于安卓恶意软件检测的基于深度学习方法的分类。\n\
  \nMohammed K. Alzaylaee 等人 [6] 在其论文《DL-Droid: 基于真实设备的深度学习安卓恶意软件检测》中，提出了一种使用动态分析结合状态输入生成来检测恶意安卓应用的深度学习系统。实验使用了\
  \ 30,000 个由良性和恶意软件构成的应用程序，并在真实设备上运行。该研究分析了代码覆盖率，并比较了所用模型的检测性能。该研究对动态特征的检测率为 97.8%，对动态和静态特征的检测率为\
  \ 99.6%，且准确率达到了 98.5%。\n\n\n\n\nMcLaughlin 等人提出的深度安卓恶意软件检测方法 \\[7\\] 实现了一种用于安卓设备恶意软件检测的卷积神经网络。该方法通过通过对恶意软件的原始操作码序列进行静态分析来实现。操作码是从反汇编程序获取的，并根据操作码相应学习了恶意软件指示特征。训练网络的操作比之前使用的其他\
  \ n-gram 方法更容易实现，因为该实现消除了训练时对数百万个 n-gram 的显式枚举。该网络结构允许使用长 n-gram 特征，这在其他方法中是不可行的。\n\
  \nS. Hou 等人在其工作“Deep4MalDroid”中使用了一种名为“组件遍历”（Component Traversal）的方法，该方法可以完全自动执行安卓应用代码程序。从提取的\
  \ Linux 内核系统调用导出出一个加权图，并使用深度学习框架识别新的恶意软件应用。该方法优于此前用于反病毒应用中基于签名的检测技术 \\[8\\]。\n\n\
  DroidDeepLearner \\[9\\] 使用深度学习根据行为模式来表征和识别恶意软件。所提方法强调自主学习并在无需人工干预的情况下解决问题。该方法同时使用危险的应用程序接口（API）和风险权限来构建深度信念网络（DBN）模型。实验结果显示其准确性高于基于支持向量机（SVM）的解决方案。\n\
  \nZhenlong Yuan 等人的 Droid-sec 强调了基于机器学习的检测技术，利用从静态和动态分析中提取的 200 个特征进行安卓恶意软件检测。研究观察到，深度学习技术优于机器学习技术。该研究产生了一种准确率为\
  \ 96% 的恶意软件检测深度学习方法 \\[10\\]。\n\nE. B. Karbab 等人提出了 MalDozer \\[11\\]，一种基于卷积神经网络（CNN）的安卓恶意软件检测系统。该方法在汇编过程中使用了较少的预处理，从而允许快速预处理。MalDozer\
  \ 自动从 API 调用开始提取特征，并学习恶意和良模式。研究使用了 33,000 个恶意软件应用和 38,000 个良性应用对模型进行评估，结果显示 F1 分数为\
  \ 96%，误报率为 0.06%–2%。\n\nDeep Flow 分析了用于恶意软件检测的数据流。该研究从包括恶意和良性应用在安卓应用中提取了 323 个特征\
  \ \\[12\\]。该研究应用 SUSI 技术对数据流特征进行分类，并结合 DBN 深度学习模型。该研究实现了更高的 F1 分数并优于传统的机器学习模型。\n\
  \nHou 等人在论文中提出了 DroidDelver 用于基于深度学习的安卓恶意软件检测。在本文中，特征被表示为从 smali 代码中静态提取的 API 调用，这些调用被转换为代码块。所提出的深度学习技术使用\
  \ DBN 分析由 API 调用生成的代码块。该研究提出的准确率为 96.66%，并优于其他机器学习和深度学习模型 \\[13\\]。用于检测恶意软件的 DroidDelver\
  \ 包含五个主要组件：(1) 解压缩和反编译用于解压 APK 文件并将 dex 文件反编译为 smali 代码；(2) API 调用提取器用于从 smali 代码中提取\
  \ API 调用；(3) API 调用块生成器用于提取 API 调用，并使用 smali 代码生成代码块；(4) 深度信念网络分类器用于 API 调用块的恶意软件检测；以及\
  \ (5) 恶意软件检测器执行上述四个组件的过程。\n\n在安卓系统上安装、激活和运行恶意软件的三种渗透渗透技术如下：(1) 重新打包（repackaging）是用于在安卓平台上安装恶意内容的类型\
  \ \\[14\\]。(2) 更新难以被检测，但在运行时下载恶意活动。(3) 下载是一种传统的攻击技术，对于那些急需下载应用的用户来说是必需的。该框架使用了应用特性、API\
  \ 调用和权限进行检测。第一步是应用分析器，它解压应用的 apk 文件并提取类文件和 `AndroidManifest.xml`。第二步是根据权限和 API 调用对应用进行表征。第三步是根据\
  \ Android Manifest 和类文件中的 API 调用进行特征提取。通过使用支持向量机、决策树和袋装预测器分类器，可以轻松将应用分类为良性或恶意软件。\n\
  \n安卓系统存在不同类型的攻击 \\[15\\]。第一步使用代码静态和动态分析将恶意软件应用插入应用中。第二步使用系统修改来访问系统中发生的变化。第三步涉及虚拟化，以分离应用程序领域，在同一台设备上安装多个安卓系统实例。\n\
  \n### 勒索软件检测\n\n勒索软件是攻击者用于向受害者索要钱的一种恶意软件，通过加密受害者系统中的文件将其“扣”，直到受害者向攻击者提供要求的资金。攻击者本质上封锁了受害者对文件的访问，或威胁要公开这些文件。\n\
  \n勒索软件可以通过多种方式进入系统或网络；最常见的方法是通过钓鱼邮件或链接。一旦从这些垃圾邮件或钓鱼链接完成下载，下载的文件就会在系统中执行勒索软件。这种恶意软件可以在感染系统连接的网络中传播，从而有效地遍历网络中的所有系统并感染它们。更复杂的勒索软件可以在没有人类活动的情况下自行传播和运行。此类勒索攻击通常被称为驱动攻击。在过去的几年里，勒索攻击的数量达到了惊人的水平。\n\
  \n根据位于华盛顿的网络安全服务公司 Purplesec 的数据，2019 年新型勒索软件毒株的数量增加了 46%，攻击数量增加了 41% \\[16\\]。大多数初创或小型企业是这种攻击的受害者，因为他们通常负担不起安全投入。勒索软件攻击的增加归于勒索软件服务在暗网和互联网其他阴暗部分以极低的价格提供，且部署几乎不需要任何技术知识。因此，通过识别和检测攻击来保护我们的系统免受此类恶意攻击已变得至关重要。在这里，我们查看了用于检测勒索软件的各种深度学习算法，并进行了深入研究，以确定每个算法在检测这些攻击方面的优缺点。\n\
  \n\n\nSmith Maniath 等人 \\[17\\] 建议通过分析 API 调用的行为使用长短期记忆网络（LSTM）来识别勒索软件。他们认为，分析进程的\
  \ API 调用序列可以解释该进程的行为模式。勒索软件家族有一些共同特征，例如与命令与控制中心（C&C）的短期连接、删除卷复制（Shadow Volumes）以及使用大量的文件系统操作。通过使用深度学习方法\
  \ `LSTM` 动态分析 `API` 调用，我们可以将二进制文件分类为勒索软件。他们创建了一个三层模型，每层有 64 个 `LSTM` 节点，并获得了 99.9%\
  \ 的最高训练准确率。在测试过程中，与之前在恶意软件分析中实现深度学习的工作相比，他们达到了 96.67% 的最高准确率。\n\nR. Vinayakumar\
  \ 等人 \\[18]\\]提出了一种用于检测勒索软件推文的深度神经网络（`DNN`）模型。`DNN` 主要由三层组成：输入层、一个或多个隐藏层以及输出层。他们分析了从\
  \ 2010 年至 2017 年间的近 25 个勒索软件家族，利用该模型在社交媒体网站上搜索恶意推文，并将其分类到相应的已知勒索软件家族。该模型可以自动、持续地分析在线帖子，从而为事件管理提供更好的资源和程序，以缓解威胁。他们提出了一种包含三个步骤的勒索软件分拣方法，即：数据采集与预处理、最优特征提取和分类算法。\n\
  \n文本编码（Text Encoding）应用于数据采集和预处理阶段，词袋模型（`Bag of Words`）和 `Keras Embedding` 在第二阶段实现，`DNN`\
  \ 在第三阶段。所提出的模型能够比前代模型提供更高的准确率（78.9%），且平均错误率为 27.8%。\n\nSeong II Bae 等人 \\[19\\]\
  \ 提出了一种使用机器学习算法识别勒索软件、恶意软件和良性文件的模型。`API` 调用方法虽然流行，但不适用于三分类检测；因此，提出了一种新模型。输入向量由处理后的\
  \ `API` 序列派生的 `n-gram` 序列生成。如果 `n-gram` 出现在 `n-gram` 序列中则表示为 1，否则表示为 0。每个元素的权重使用\
  \ `CF-NCF`（类频率非类频率）决定。模型主要使用了六种机器学习算法的组合来创建测试模型，即：随机森林（`RF`）、逻辑回归（`LR`）、朴素贝叶斯（`NB`）、`SGD`（随机梯度下降）、`KNN`（K-最近邻算法）和支持向量机（`SVM`）。所提出的方法证明其准确率为\
  \ 98.65%，相对高于之前的结果。实验结果还证明了 `CF-NCF` 在勒索软件检测中上性能远优于 `TF-IDF`。\n\n文中对现有的勒索软件检测技术进行了详尽综述，并提到了勒索软件的生命周期及其属性\
  \ \\[20\\]。此外，还提供了每种检测技术的优缺点以及一种提出的检测模型。通过广泛的综述，他们得出结论：回归类算法是勒索软件检测方法的首选，而最重要的评估指标被认为是准确率和真阳性率。在提出的技术中，他们建议实现一种混合技术，即回归算法与基于规则算法的结合。\n\
  \n回归算法可以根据预测变量与结果的关系建立预测模型。而基于规则的模型则为其预测模型产生规则。他们指出，算法的正确组合可以相互补充，从而使混合算法的表现优于单一算法。\n\
  \nJinsoo Hwang 等人 \\[21\\] 提出了一种两层勒索软件检测模型，第一阶段整合了马尔可夫模型（`Markov Model`），第二阶段整合了随机森林模型（`Random\
  \ Forest Model`）。最初，他们在运行时分析 `API` 序列，并过滤出代表通用 `API` 列表的 303 个唯一 `API`。然后对这些 `API`\
  \ 序列实现马尔可夫模型以过滤勒索软件调用。这带来了 0.9744 ± 0.0159 的中等错误率和良好的假阳性率，但假阴性率在 20%左右。为了消除这一缺点，在第二阶段应用了随机森林算法。该两阶段模型给出了\
  \ 97.28%、4.83%、1.47%的 Result。\n\nNetconverse \\[22\\] 是一项关于 Windows 网络勒索软件动态检测的机器学习评估研究。该模型分为三个阶段：数据采集、特征提取和机器学习的实现。文中共实现了六种机器学习分类器，即：贝斯网络（`Bayes\
  \ Network`）、多层感知机（`Multilayer Perceptron`）、`J48`、K 最近邻（`K Nearest Neighbors`）、随机森林（`Random\
  \ Forest`）和逻辑模型树（`Logistic Model Tree`）。发现 `KNN` 和 `LMT` 两个分类器的模型创建时间有所增加，但其他算法的处理时间有所缩短。`J48`\
  \ 算法证明是六种算法中最好的，检测率高达 97.1%，其次是 `LMT` 分类器，检测率为 96.8%。\n\nIbrar Yaqoob 等人在论文中深入探讨了勒索软件攻击的各个方面，例如常见勒索软件的类型、兴起、勒索攻击的挑战、安全以及\
  \ IoT 方面的方面 \\[23\\]。文中提供了 IoT 领域针对勒索软件的最新且最具创新的安全发展的简要概述。还包含了若干案例研究，以提醒读者 IoT 设备的各种安全方面和威胁，以及勒索软件攻击和利用这些漏洞的不同方式。他们还包含了应对措施和安全细节以保护\
  \ IoT 设备，并讨论了若干研究挑战以及适当勒索软件识别检测系统的缺失。\n\nRakshit Agrawal 等人在本文中提出了一种模型，涉及 `LSTM`\
  \ 和 `ARI-LSTM` 在检测和识别勒索软件线程方面的对比 \\[24\\]。关注近期输入（`ARI`）是一种增强的神经单元，用于学习勒索软件序列。该单元在处理输入序列的同时也会分析序列的历史。此处开发了`ARI`与`LSTM`的实现，将`LSTM`与`ARI`机制相结合，生成的神经网络序列用于勒索软件序列学习。实验结果证明，`ARI-LSTM`提供的准确率远高于`LSTM`。与`LSTM`的\
  \ 0.87 相比，`ARI-LSTM`的准确率为 0.97。\n\n\n\nHanqi Zhang 等人在本文中结合了 `N-gram` 序列、`词频-逆文档频率\
  \ (TF-IDF)` 以及对五种分类向量的比较，以寻找用于勒索软件检测和识别的最佳方案 [25]。针对由勒索软件样本 `opcode` 序列转换成的每个 `N-gram`\
  \ 序列计算 `TF-IDF`。计算 `TF-IDF` 向量选择特征 `N-gram`，以便它们在勒索软件家族之间表现出更好的区分性。\n\n这些向量被输入到机器学习分类算法中，即`决策树`、`随机森林`、`K\
  \ 最近邻`、`朴素贝叶斯`和`梯度提升决策树`。在这些算法中，`随机森林`被证明其准确率最高，达到 99.3%，在区分勒索软件与可信软件方面的召回率达到 99.8%。该方法在检测\
  \ `wannacry` 恶意软件时也获得了 91.43% 的准确率。\n\n### 基于 Windows 的恶意软件检测\n\n最广为人知的恶意软件发现技术可以分为三种主要策略：\n\
  \n1. **静态分析**：它在不运行文件的情况下从文件的结构中提取特征。\n2. **动态分析**：让文件运行，并在文件运行期间提取特征。\n3. **混合分析**：这本质上是动态分析和静态分析的结合。\n\
  \n在后续章节中，我们将浏览不同的机器学习（ML）和深度学习（DL）算法，这些算法可以通过调查阶段获取的特征来识别和分类恶意软件。\n\nIhab Shahadat\
  \ 等 [26] 创建了多种用于预测的机器学习模型，包括二分类和多分类；对于数据划分，使用交叉验证进行特征选择以使特征数量最小化。特征通过启发式策略提取，这本质上就是动态分析。他们在`决策树`二分类中达到了\
  \ 98.2% 的准确率，在`随机森林`二分类中达到了 95.8% 的准确率。\n\n这些作者 [27] 收集了静态和动态分析所需的数据集并存储在 `Apache\
  \ Spark` 中。存储的数据经过了预处理，提取了必要的特征并发送到五个不同的基分类器中。此时，结果被用于规划两种不同的集成学习方案，例如`加权投票`和`堆叠`，它们给出了良好的结果。大数据被处理恶意软件数据集。我们在该模型中使用了一个相对公平的数据集。该模型利用\
  \ `WeightedVoting_RACA` 提供了 99.5% 的准确性。\n\n该模型构建 [28] 首先将二进制恶意软件文件转换为`灰度图`，并利用 `Visual-AT\
  \ ML` 可视化来分类恶意软件。它处理对抗性示例并提供了更高的精确率。该模型考虑了对抗性示例。`Visual-At` 提供了约 97.73% 的准确率。\n\n\
  这些研究人员制造了一种名为 `HYDRA` 的多模块深度学习系统，它由四个基本部分组成：`基于 API 部分`、`基于内存的部分`、`基于字节的部分`以及元素组合与表征组件。这种方法限制了端到端学习的障碍。双实体也可以包含在当前模型中，可能会产生更好的结果。在实现`多模态深度神经网络`\
  \ [29] 时，识别出的精确率约为 99.75%。\n\n`MalFCS` [30] 主要分为三个阶段。双恶意文档被转换为`熵图`，并从熵图中去除显著特征，随后进入\
  \ `SVM 分类器`进行恶意软件表征。它利用`熵图`而不是`灰度图`。它可以利用 `GAN` 生成高质量的合成熵图并提升模型执行性能。它可以在邮件数据集和微软数据集上分别以\
  \ 0.997 和 1 的准确率获得惊人的表征性能。\n\n模型开发人员制造了一个名为 `IMCFN` 的模型，它可以主要分为两个部分：恶意软件图像年龄阶段（双恶意记录转换为图像）和\
  \ `CNN` 反向传播过程阶段（预测生成的图像是否为恶意软件）。与 `CNN` 相比，`IMCFN` 给出了更好的结果。实验研究表明 `IMCFN` 的准确率为\
  \ 97.56% [31]。\n\n使用`基于 CNN 的 opcode 嵌入`和`基于 BPNN 的 API 嵌入模型`的特征混合恶意软件变体检测包含两个主要部分\
  \ [32]：在第一个部分中，从 `.exe` 记录中创建 `Opcode`，随后利用 `n-gram 模型`产生 `opcode n-gram`。此时，利用\
  \ `PCA` 减少维度并进入隐藏层，然后使用 `Softmax 分类器`进行表征。在后续部分中，从 `.exe` 文档生成 `API 调用`，并使用向量递归将\
  \ `API 调用` 转换为向量，执行 `PCA` 以选择最所需的特征并发送到神经网络中训练。此时，使用分类器对恶意软件进行分组。这是一种半组件的恶意软件变体模型。它可以包含更多的静态元素。该方法实现了\
  \ 95% 的准确率。\n\nLu 等人的模型 [33] 利用恶意软件数据集并导入到 `cuckoo sandbox` 中。他们利用`双向 LSTM 模型`构建了`API\
  \ 调用序列`。接口调用关联和递归通过 `AMHARA 算法`进行检查。随后，`RF` 和 `LSTM` 被结合并预测，给出了更好的结果。该模型结合了机器学习和深度学习。该模型仅使用较小的数据集。该模型的准确率为\
  \ 96.7%。\n\nSuyeon Yoo 等提出了一种`随机森林`和`深度学习 (MLP)`混合的半模型，利用 12 个隐藏层区分文档是否为恶意软件 [34]。发现取决于对这两个模型的输出进行投票。它具有高召回率（TP）和低假阳率（FP），这对于恶意软件检测至关重要。该模型的准确率仅为\
  \ 85.1%，还有提高空间。它提供了 85.7% 的 TP 率和 16.1% 的 FP 率，每个记录处理时间为 60.9 秒。\n\nMalDy 结构 [35]\
  \ 最初从沙箱和运行时收集行为报告，并利用 `NLP` 将这些报告转换为 `BoW`。随后，他们利用不同的 AI 模型进行分类。立即，有一个危险定位模型以及针对\
  \ n 种恶意软件家族排序的 n 个模型。该结构在任何环境中都是通用的。该模型依赖于执行报告系统。MalDy 在安卓上超过了 94.1% 的 F 分，并在 Win32\
  \ 上实现了 94% 的精确率。\n\n\n\n\n基于 Linux 的恶意软件或有害程序被用于损害主机操作系统，或窃取用户、组织和公司的敏感数据。它被用于非法收集信息。恶意软件检测用于检测主机操作系统上是否存在恶意软件，或用于检测系统中的任何恶意活动。为了确保系统不丢失任何用户的敏感信息，恶意软件检测是强制性的。恶意软件检测通过不同的技术进行，但在本调查中，我们使用机器学习算法来检测\
  \ Linux 操作系统上的恶意软件。如今，恶意软件是个人数据的一个严大问题。目前有许多方法用于识别恶意的可执行链接文件（`ELF`）。Linux 操作系统是开源软件并根据通用公共许可证（GPL）发布。\n\
  \n所提方法的三位一体方法是：(1) 系统调用轨迹的记录；(2) 消除冗余特征的方法；以及 (3) 预测模型的使用 [37]。该方法旨在于不损失准确性的情况下提供良好的计算效率。`Kruskal–Wallis\
  \ test`（KW 检验）是一种基于独立中位数差异的排序检验。它用于描述两个类别是否具有相同的位数。如果两个类别具有相同的位数，则不属于分类范围。`Deviation\
  \ From Poisson (DFP)` 用于选择用于分类的稳健向量。系统的参数是准确率和特征长度。\n\n恶意软件样本数据集取自 `VX-Heavens`，良性样本取自\
  \ Linux 可执行链接文件格式的目录 [38]。系统调用日志使用 Linux 平台 `strace` 执行。通过提取系统调用的参数和返回值，在对系统调用进行此类预处理后完成特征提取。在提取系统调用后，数据集被分为训练级和测试级。训练步骤用于分类模型，测试步骤用于预测模型。在这一步特征分析和选择之后，通过两个步骤完成：准备不同的特征类别和特征选择。特征类别包括并集、交集、恶意软件的判别特征以及良性的的判别特征。特征选择是一种类别区分量（`CDM`），用于改进多个数据集的分类，其核心概念是奇率比和稀疏特征消除（`ESF`）。\n\
  \n机器学习系统基于单侧感知器和内核化单侧感知器对数据集进行数据清洗和恶意文件处理 [39]。Gavrilut 等人的框架采用了三个数据集：训练数据集、测试数据集和扩展数据集。通过交叉验证从参数中选择正确的值。本文的参数是特征选择量以及带有级联单侧感知器算法的交叉验证。\n\
  \n为了给移动用户提供安全保障，使用了并行机器学习技术，因为它在单个单元中使用了多种算法。监督算法如 `Decision Trees`（决策树）、`Simple\
  \ Logistics`（简单逻辑）、`Naive Bayes`（朴素贝叶斯）和 `Part, Ridor` 用于检测移动平台上的恶意活动 [40]。相关的 API\
  \ 调用、命令和权限用于提取数据集。\n\n## 使用的恶意软件检测工具 (#ch04.xhtml#c_sec4_3)\n\n文中讨论了病毒、蠕虫、特洛马、间谍软件、广告软件和勒索软件等恶意软件。恶意软件是对系统的威胁，并由于系统的漏洞或用户的疏忽而传播。用于恶意软件检测的各种工具列如下所示\
  \ [41,42,43]。\n\n| 使用的工具 |  |\n| :--- | --- |\n| `PEiD` | 是一种工具，用于区分 `PE`（便可执行文件）记录的大部分正常壳、加密器和编译器。\
  \ |\n| `HashCalc` | `HashCalc` 为您的文件计算许多加密哈希值。 |\n| `Dependency Walker` | `Dependency\
  \ Walker` 用于列出便可执行文件的导入和导出函数。它还显示可执行文件所有依赖项递归树。 |\n| `CFF Explorer` | `CFF Explorer`\
  \ 设计用于让 `PE` 编辑尽可能简单，同时不忽略便可执行文件的内部结构。 |\n| `Resource Hacker` | `Resource Hacker`\
  \ 用于添加、修改或替换 Windows 二进制文件中的大多数资源，包括字符串、图像、对话框、菜单、版本信息和清单资源 |\n| `DIE` | Detect\
  \ It Easy，简称“DIE”，是一个用于确定文件类型的程序。 |\n| `rEMnux` | `rEMnux` 是一个轻量级 Linux 发行版，用于帮助恶意软件分析师对恶意软件进行逆向工程。\
  \ |\n| `JavaSnoop` | `JavaSnoop` 尝试附加到现有进程（如调试器）并立即开始篡改方法调用、运行自定义代码，或仅仅观察系统中发生的情况。\
  \ |\n| `Valgrind` | `Valgrind` 是一个用于内存调试、内存泄漏检测分析的编程工具。 |\n| `Zeek` | `Zeek` 是一个“传感器”，位于硬件、软件、虚拟机或云平台上，安静地观察网络流量。\
  \ |\n| `diStorm` | `diStorm` 是一个非常健壮且全球使用的汇编器，由其作者维护更新。 |\n| `PEview` | `PEview`\
  \ 是 `PE` 文件的查看器。`PEview` 是一个大小约为 70 kb 的独立可执行程序。用于确定基础 PE 信息 |\n| `Bintext` | 一种小巧、快速且强大的提取器，对开发者非常有帮助。它可以从任何类型的记录中分离\
  \ ASCII 文本、Unicode 文本和资源字符串，为所有进度模式提供有用数据。 |\n| `MD5deep` | `md5deep` 是一组处理 MD5、SHA-1、SHA-256、Tiger\
  \ 或 Whirlpool 散列值的程序。 |\n| `IDA pro` | `IDA Pro` 主要是一个多平台、多处理器反汇器，将机器执行代码转换为汇编源代码以进行调试和逆向工程。等等。\
  \ |\n| `FileAlyzer` | 这也是一个用于访问 PE 文件头的应用程序，但它配备了用于提交到 Virus total 进行分析的 `VirusTotTab`\
  \ 并具有解包 `UPX` 和 `PECompact` 包文件的功能。 |\n| `Procman` | `Procmon`（进程监控）是 Windows SysInternals\
  \ 开发的免费工具，用于实时监控 Windows 文件系统、注册表和进程活动。 |\n| `Process Explorer` | `Process Explorer`\
  \ 用于监控运行进程，并显示每个进程运行和加载的句柄和 DLL。 |\n| `RegShot` | Regshot 是一个很好的开源工具，通过拍摄快照并与注册表当前状态对比来监控注册表的变化。\
  \ |\n| `ApateDNS` | `ApateDNS` 是用于控制 DNS 响应工具并在本地系统上作为 DNS 服务器运行。`ApateDNS` 会对恶意软件生成的\
  \ UDP 端口 53 的 DNS 请求进行伪造 DNS 响应。 |\n\n对于连续实时数据流，使用了深度学习架构，如生成对抗网络、浅层学习特征提取、梯度提升算法、循环神经网络\
  \ (RNN) 和深度神经网络 (DNN)。基于卷积神经网络 (CNN) 的架构用于图像分类和分析。\n\n\n\n\n\n深度学习架构模仿了人类大脑的思考过程，并开发了决策设计模式，提高了恶意软件检测的准确性以及预防措施。本文详细阐述了适用于网络安全应用的各种深度学习算法和架构。\n\
  \n## 结论\n\n本章讨论了针对 Android 和 Windows 操作系统的实时发现的恶意软件类型。恶意软件检测的基础是静态分析和动态分析。除此之外，基于特征的恶意软件检测能提供更好的结果。但如今零日恶意软件急剧增加，这为机器学习和深度学习技术铺平了道路。这项工作还说明了对实时动态识别恶意软件的需求，而非基于特征的检测技术。分析了用于检测\
  \ Android 以及 Windows 和 Linux 等其他操作系统恶意软件的各种深度学习和机器学习技术。\n\n本文深入阐述了每种技术采用的意义和方法。对勒索软件病毒进行了详细研究。从最先进的方法可以得出，算法的组合（如`随机森林`、`逻辑回归`、`朴素贝叶斯`、`随机梯度下降`、`K-近邻`和“支持向量机`）在识别和检测勒索软件方面获得了最高的准确率（98.65%）。在这个充满互联网的技术时代，对恶意软件检测和分类的需求日益增加。我们讨论了机器学习和深度学习技术用于检测和分类各种恶意软件的各种工具。\n\
