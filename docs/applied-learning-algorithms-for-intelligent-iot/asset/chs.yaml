  \ 13.7 所示。\n\n![图 13.7 时间分析](img/fig13_7.jpg)\n\n图 13.7 时间分析\n\n## 结论 (#ch13.xhtml#c_sec13_5)\n\
  \n综而言，已成功部署了一个支持物联网的大型城市区域无线地下传感器网络（WUSN）。它覆盖了广阔区域，这是一个具有各种建筑和人类活动的典型城市环境。所有传感器节点都埋在地下，不会干扰地面上的活动。尽管环境恶劣，它仍被部署在地下、城市环境以及极寒的冬季。\n\
  \nWUSN 已证明了其在实时土壤属性监测方面的价值。更重要的是，我们还实现了一个基于云的开放平台，因此感知结果对公众开放。通过这种方式，所提出的系统为土壤属性提供了长期连续监测。\n\
