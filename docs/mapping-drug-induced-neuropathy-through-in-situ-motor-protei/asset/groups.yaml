    ## 基于原位驱动蛋白追踪和机器学习的药物引起神经病变映射


    Zhigao Yi, Huxin Gao, Xianglin Ji, Xin-Yi Yeo, Suet Yen Chong, Yujie Mao, Baiwen
    Luo, Chao Shen, Sanyang Han, Jiong-Wei Wang, Sangyong Jung, Peng Shi, Hongliang
    Ren, and Xiaogang Liu*


    ABSTRACT: 化疗可能引起中枢和外周神经系统毒性，并导致阻碍持续治疗并降低患者生活质量的慢性不良反应。目前缺乏预测、识别和抵消药物引起神经毒性的研究。快速准确地评估潜在神经病变对于具有成本效益的诊断和治疗至关重要。本文报道了动态近红外上转换成像，它允许以毫秒分辨率实时追踪神经元内转运，且无光漂白或闪烁。可在表型之前，根据神经元内转运动力学特征中的细微异常筛选药物引起的神经毒性。此外，我们证明将上转换纳米平台与机器学习相结合，为绘制化疗引起的周围神经病变图谱及评估药物引起的神经毒性提供了一种强大工具。


    ![](img/d3269c8f1d418c506c5d0a3945bc5612_0_0.png)


    ### 引言


    化疗引起的周围神经病变（CIPN）是抗肿瘤治疗的常见并发症，其特征为疼痛、麻木、反应迟钝和感觉受损等症状，可能导致患者治疗过早终止。1–6 针对CIPN的可靠且稳健的诊断策略尚待建立，且亟待开发，因为目前的临床实践主要依赖于患者主观且不精确的自我报告。CIPN通常与神经元内转运受损相关，后者调节神经元中信号转导以及营养物质和细胞器运输等关键生理活动。7–12
    使用荧光显微镜进行动态追踪适合定量神经元内货物运动的细微变化，从而有助于CIPN诊断。然而，要维持神经元内轨迹的高保真度并建立神经毒性评估的标准方案具有挑战性。以前量化货物转运动力学的尝试受到低保真记录的限制，这是由于传统荧光探针（如分子染料、荧光蛋白、量子点和金刚石纳米晶体）的固有约束所致（图1a和表S1）。13–20
    虽然分子荧光团标记的细胞器可实现运动追踪，但通常会因光漂白和自发荧光而出现低对比度成像。13,14 荧光蛋白的基因转染常受转染效率低、蛋白质过度无控制产生以及严重光漂白的限制。15,16
    量子点具有高光致发光效率和光稳定性，但受光闪烁和细胞毒性困扰。17,18 铒激活上转换纳米粒子由于其优异的光稳定性和无闪烁特性，已显示出作为细胞成像、神经调制及其他生物医学应用替代生物探针的潜力。21–29
    我们的先前研究已证明利用上转换纳米粒子在多层神经元培养中进行神经元内追踪的可行性。21 然而，7 Hz的低保真追踪不太可能区分CIPN，尤其是在表型之前。因此，有必要在单纳米粒子水平上改进读出，以实现神经元内运动的高保真记录。此外，数据处理与学习在神经元内运动与神经毒性之间的关联中具有重要意义。人工智能在光子学中的应用已在数据驱动光学、神经网络和脑机接口等领域产生了变革性进展。30–32
    人工智能（如机器学习）将是从海量数据中识别和定量高保真神经元内追踪的不可替代技术（图1b）。我们认为，基于


