    用于神经毒性预测和定量的机器学习模型，其输入为上转换显微记录中的轨迹。特征包括囊泡运动中逆行、顺行和暂停段的过程性、速度、频率和持续时间。可以建立一个超大规模多维的药物引起神经病变库，其中神经毒性基于多种参数（如药物、细胞类型、剂量和给药时间）来确定。


    上转换高保真神经元内转运追踪与机器学习。


    ### 结果与讨论


    ### 上转换纳米探针设计与表征。


    为验证我们的假设，我们设计并合成了具有多层核–壳纳米结构的上转换纳米粒子，并优化了光致发光输出。我们确定，基于氟化钠的NaYbF4:Tm（2%）纳米粒子在400–850
    nm范围内发射（图S1）。将Yb3+/Tm3+对进一步限制在三明治层中，其化学式为NaYbF4@NaYbF4:Tm@NaYbF4，增强了从Yb3+到Tm3+的能量转移（图S2）。采用NaYF4壳层来抑制表面发光淬灭。这些棒状纳米晶的平均尺寸为33
    × 68 nm。其上转换发射比NaYbF4:Tm对照体亮超过10倍，比常规NaYF4:Yb/Tm纳米晶亮超过200倍。单纳米粒子成像也证实了光致发光增强，这与溶液中记录的光谱数据一致（图S3）。这些核–壳纳米棒非常适合在高刷新率下以单粒子水平实现神经元内转运的实时追踪。我们进一步在这些纳米棒上包覆了一层薄薄的二氧化硅，以提高亲水性和生物相容性（图S4）。这些包覆二氧化硅的纳米棒在PBS缓冲液和神经元基础培养基中的水动力学尺寸约为90
    nm，长期稳定性超过3个月。


    ### 高保真上转换神经元内追踪。


    随后，我们利用体外集成式双室培养皿培养背根神经节（DRG）细胞，这是一种与周围神经系统神经病理性疼痛相关的原始感觉神经元（图S5）。细胞体和轴突末端由微通道相互分离。将补充于神经元基础培养基中的纳米探针加入轴突室，并被神经元内化，随后通过逆行转运到达细胞体室。孵育1
    h后，在轴突和细胞体中检测到了大量纳米探针货物（图2a–e 和 视频 S1）。对所有发射斑点的统计分析显示，~99%的纳米探针发生了逆行转运（轴突至细胞体），而约1%的纳米探针通过顺行转运（细胞体至轴突）返回轴突室。这两条通路在神经元内转运中很常见。18,19
    通过追踪亮斑（图S6中标记为3和4）的轨迹，阐明了逆行和顺行转运的示例。当每帧曝光时间设置为50 ms时，神经元中的发光信噪比超过15，而使用1 ms曝光时间时，信噪比仍超过3。值得指出的是，在整个追踪期间，未观察到DRG神经元中纳米探针出现光闪烁或光漂白现象。神经元内追踪中的亚微米空间分辨率揭示了沿同一轴突束分布的两个亮斑（标记为1和2）的轨迹，但


