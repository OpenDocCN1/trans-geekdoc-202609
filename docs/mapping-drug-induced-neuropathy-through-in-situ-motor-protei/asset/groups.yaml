    24小时后，原位显微镜成像显示胞体和轴突的大小或神经元形态无明显变化（图S9）。定量聚合酶链反应（qPCR）显示微管相关基因的表达无显著差异（p > 0.05，Kruskal–Wallis检验配合Dunn校正和Wilcoxon检验）（图S10）。此外，电生理学评估表明PTX和Vinc未影响DRG细胞的一般神经元功能（图S11）。动作电位阈值和潜伏期未受明显影响，尽管接受PTX处理的神经元频率略高于对照组（Mann–Whitney
