    To verify our hypothesis, we designed and synthesized upconversion nanoparticles
    with multilayer core–shell nanostructures and optimized the photoluminescent output.
    We determined that sodium fluoride based NaYbF4:Tm (2%) nanoparticles emit in
    the range of 400–850 nm (Figure S1). Further confinement of the Yb3+/Tm3+ couple
