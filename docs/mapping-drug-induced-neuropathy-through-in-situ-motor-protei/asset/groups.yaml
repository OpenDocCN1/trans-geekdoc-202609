    Monoclonal antibodies (Beva, Nivo, and Ritu) are specific targets of antitumor
    immune responses or vascular endothelial growth factor dependent vascularization,
    which may weakly affect neurons.


    # Machine Learning for Drug-Induced Neuropathy Assessment.


    We next applied machine learning to better understand intraneural transport and
    establish a comprehensive assessment system for CIPN. The integration of 11 motion
    features was used to develop machine-learning algorithms in the support vector
    machine (SVM) model. Feature characteristics in the support vector machine (SVM)
    model were preliminarily visualized by a parallel plot, whereas the upper and
    lower limits of the distribution were calculated according to means and standard
    deviations (Figure S12). Intra-and intergroup similarities between different drugs
    were determined by the average Euclidean distance of the 11-feature vector in
    each group or in various group pairs. Two-dimensional patterns demonstrate the
    spatial relationships of drugs using t-distributed stochastic neighbor embedding
    (t-sne) for dimensional reduction. The spatial proximity of patterns under different
    drug conditions indicates pharmaceutical-chemical similarity. On the basis of
    the preliminary analysis described above, feature fingerprints were generated
    through z-score normalization of the 11-feature matrix (Figure 5a). The fingerprint
    of control groups (DMSO and Media) displayed a light gray distribution with all
    values being near zero, serving as a baseline in comparison to other groups. The
    depth of blue and red lumps in other groups reveals pharmaceutical effects in
    several respects. The 11-feature matrix was employed for drug identification,
    in which a 94.8% accuracy was obtained (Figure 5b). The overall difference in
    drug treatments was visualized through clustering the 11 features in a separated
    spatial distribution (Figure 5c). We estimated toxicity scores by ranking the
    similarities between different drugs against the controls (Figure 5d). Among all
    tested groups, DMSO, Ritu, and Erlo exhibited low toxicity scores. The three monoclonal
    antibodies (Nivo, Beva, and Ritu) and two microtubule-active agents (PTX and Vinc)
    showed spatial proximity in the two-dimensional t-sne pattern, uncovering certain
    similarities in their internal categories. Of note, Gefi and Imat exhibited a


    large spatial distance, despite both being tyrosine kinase inhibitors. Further
    systematic studies on various drugs, dosages, and treatment durations will facilitate
    the construction of a multidimensional database for CIPN assessment through machine
    learning as well as a deeper understanding of the underlying mechanisms.


    # CONCLUSIONS


    Upconversion nanoparticles that offer bright near-infrared emission, high photostability,
    and superior biocompatibility are highly desirable for evaluating neuropathy models
    induced by chemical products. Subtle changes in neuropathy due to short-term drug
    treatment can be readily identified by upconversion-mediated, high-fidelity intraneuronal
    transport tracking. This approach offers unprecedented sensitivity for the early
    detection of drug-induced neuropathic disorders, unattainable with conventional
    biological approaches, before phenotype information becomes available. When this
    imaging platform is combined with machine learning, a comprehensive database of
    drug-induced neuropathy can be established, opening the door to the development
    of single-nanoparticle analysis tools for drug discovery, fundamental neuroscience,
    neuronal disorder diagnosis, and cancer therapeutics.


