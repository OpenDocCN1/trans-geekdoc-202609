    of intraneuronal transport, which regulates critical physiological activities
    such as signal transduction and transport of nutrients and organelles in neurons.
    7–12 Dynamic tracking with fluorescence microscopy would be suitable for quantification
    of subtle changes in intraneuronal cargo movement and therefore contribute to
    CIPN diagnosis. However, it has been challenging to maintain a high fidelity of
    intraneuronal trajectories and establish a standard protocol for neurotoxicity
    assessment. Previous attempts to quantify cargo transport dynamics have been limited
    by low-fidelity recording due to the inherent constraints of conventional fluorescent
    probes such as molecular dyes, fluorescent proteins, quantum dots, and nanodiamonds
    (Figure 1a and Table S1). 13–20 Although molecular fluorophore-labeled organelles
