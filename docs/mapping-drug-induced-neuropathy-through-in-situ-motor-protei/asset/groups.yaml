    当这些


    将这些数据综合来看，此类短期药物治疗未诱导出可检测的表型，如神经功能障碍或基因表达变化。然而，神经元行为的细微变化，使用常规生物学或分子方法（如显微监测、qPCR和电生理学）无法检测，但可通过我们的高分辨率上转换显微镜轻易区分。我们进一步考察了基于上转换的细胞内转运追踪用于多种抗癌药物神经毒性评估的适用性，包括细胞毒性抗肿瘤药物（Cispl和Ifos）、酪氨酸激酶抑制剂（Erlo、Gefi和Imat）以及单克隆抗体（Beva、Nivo和Ritu）。不同药物治疗的速度分布和运动参数差异显著（图4）。速度分布的共同特征表明，对于大多数药物治疗，高速区域（<−2
    μm/s）中的逆行片段频率降低，但在低速（−0.2至−2 μm/s）和暂停（−0.2至0.2 μm/s）区域中增加（图4a）。这些特征也通过分类参数的统计分析得到证实（图4b–i）。尽管药物Gefi和Ritu未引起纳米探针速度的显著差异（图4l），但暂停时间和逆行片段过程性等其他运动特征可用于量化它们与对照组的不同之处。


    一般来说，各种抗肿瘤药物诱导周围神经病变的作用机制仍不明确。例如，细胞毒性抗肿瘤药物通过烷基化DNA分子中的鸟嘌呤碱基来影响细胞增殖，从而防止复制过程中的DNA延伸。35
    由于神经末端分化且不复制，不太可能受到Cispl和Ifos的直接细胞毒性影响。已证明Cispl与非DNA靶点（磷脂和蛋白质）相互作用，并影响高度依赖于蛋白质和脂质筏相互作用的关键神经元功能过程。对于酪氨酸激酶抑制剂，Gefi和Erlo是表皮生长因子受体（EGFR）抑制剂，而Imat是调节至少几个信号通路的几种酪氨酸激酶酶的抑制剂。36,37
    在我们的研究中，Gefi/Erlo和Imat在许多参数上具有不同的效果，尽管它们都是酪氨酸激酶抑制剂。Imat治疗可能影响ATP水解并以非特异性方式防止运动蛋白的机械运动，从而停止神经元内转运并缩短行进长度（图4b,g,h）。Erlo和Gefi防止EGFR自磷酸化和下游信号通路的激活。然而，EGFR结合和EGFR激活如何影响全细胞微管稳态尚不清楚。单克隆抗体（Beva、Nivo和Ritu）是抗肿瘤免疫反应或血管内皮生长因子依赖性血管生成的特定靶点，可能对神经元产生较弱影响。


    ## 机器学习用于药物诱导神经病变评估。


    接下来，我们应用机器学习来更好地理解神经元内转运，并为CIPN建立一个全面的评估系统。通过整合11个运动特征，在支持向量机（SVM）模型中开发了机器学习算法。支持向量机（SVM）模型中的特征特征最初通过平行图进行可视化，而分布的上限和下限则根据均值和标准差计算得出（图S12）。不同药物之间的组内和组间相似性是通过每个组或各组对中11维特征向量的平均欧氏距离来确定的。二维模式使用t分布式随机邻域嵌入（t-sne）进行降维，以展示药物的空间关系。不同药物条件下模式的空间接近性表明药物-化学相似性。基于上述初步分析，通过11维特征矩阵的z-score标准化生成了特征指纹（图5a）。对照组（DMSO和培养基）的指纹显示为浅灰色分布，所有值均接近零，作为与其他组比较的基线。其他组中蓝色和红色团块的深度从多个方面揭示了药物效应。11维特征矩阵被用于药物识别，获得了94.8%的准确率（图5b）。药物治疗的总体差异通过将11个特征聚类在分离的空间分布中进行可视化（图5c）。我们通过对不同药物与对照组之间的相似性进行排名来估计毒性评分（图5d）。在所有测试组中，DMSO、Ritu和Erlo表现出较低的毒性评分。三种单克隆抗体（Nivo、Beva和Ritu）和两种微管活性剂（PTX和Vinc）在二维t-sne模式中显示出空间接近性，揭示了其内部类别的某些相似性。值得注意的是，Gefi和Imat表现出较大的空间距离，尽管两者都是酪氨酸激酶抑制剂。对各种药物、剂量和治疗时间的进一步系统研究将有助于通过机器学习构建用于CIPN评估的多维数据库，并深入理解其潜在机制。


    ## 结论


    提供明亮近红外发射、高光稳定性和优异生物相容性的上转换纳米颗粒对于评估化学产品诱导的神经病变模型非常理想。基于上转换的高保真神经元内转运追踪可以轻易识别由短期药物治疗引起的神经病变细微变化。这种方法在表型信息出现之前，为早期检测药物诱导的神经病变性疾病提供了前所未有的灵敏度，而常规生物学方法无法实现。当该成像平台与机器学习相结合时，可以建立药物诱导神经病变的综合数据库，为开发用于药物发现、基础神经科学、神经元疾病诊断和癌症治疗的单纳米颗粒分析工具打开大门。


