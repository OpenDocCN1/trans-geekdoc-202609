    and photostability but are plagued by photoblinking and cytotoxicity. 17,18 Lanthanide-activated
    upconversion nanoparticles have shown promise as alternative bioprobes for cell
    imaging, neuromodulation, and other biomedical applications due to their excellent
    photostability and nonblinking characteristics. 21–29 Our previous study has demonstrated
    the feasibility of intraneuronal tracking in multi-layer neuron cultures using
    upconversion nanoparticles. 21 However, the low-fidelity tracking at 7 Hz is unlikely
    to distinguish CIPN, especially before phenotyping. It is thus essential to improve
    the readout at a single-nanoparticle level to achieve high-fidelity recording
    of intraneuronal movements. Moreover, data processing and learning are of significance
    in correlations between intraneuronal movements and neurotoxicity. The deployment
    of artificial intelligence in photonics has yielded transformative advances in
    data-driven optics, neural networks, and brain–computer interfacing. 30–32 Artificial
    intelligence, such as machine learning, would be an irreplaceable technique to
    identify and quantify high-fidelity intraneuronal tracking among an enormous amount
    of data (Figure 1b). We reasoned that a powerful platform for mapping drug-induced
    neuropathy would be established with


