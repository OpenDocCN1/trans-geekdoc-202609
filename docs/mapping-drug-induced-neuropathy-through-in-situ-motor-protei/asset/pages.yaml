    and Vinc did not affect the general neuronal function of DRG cells (Figure S11).
    The action potential threshold and latency were not markedly affected, although
    the frequency was slightly higher in neurons treated with PTX (Mann–Whitney U
    test, p = 0.0446) than in the control group. Further characterizations of the
    amplitude, half-width, hyperpolarization, and refractory period did not reveal
    any noticeable effect on action potential waveform in DRG neurons. When these


    data are taken together, such short-term drug treatments induce no detectable
    phenotypes such as neuronal dysfunction or gene expression changes. Subtle changes
    in neuronal behaviors, which are undetectable using common biological or molecular
    approaches such as microscopic monitoring, qPCR, and electrophysiology, however,
    can be readily differentiated by our high-resolution upconversion microscopy.
    We further examined the suitability of upconversion-mediated intracellular transport
    tracking for the neurotoxicity evaluation of various anticancer drugs, including
    cytotoxic antineoplastics (Cisp and Ifos), tyrosine kinase inhibitors (Erlo, Gefi,
    and Imat), and monoclonal antibodies (Beva, Nivo, and Ritu). Velocity distributions
    and motion parameters were drastically different among various drug treatments
    (Figure 4). Common features in velocity distribution showed that, for most drug
    treatments, the retrograde segmental frequency was reduced in high-speed regions
    (<−2 μm/s) but was increased in low-speed (−0.2 to −2 μm/s) and pausing (−0.2
    to 0.2 μm/s) regions (Figure 4a). These characteristics were also confirmed by
    a statistical analysis of classified parameters (Figure 4b–I). Although the drugs
    Gefi and Ritu induced no significant difference in nanprobe velocity (Figure 4l),
    other motion characteristics such as pausing time and retrograde segmental processivity
    can be used to quantify how they differ from the control group.'
