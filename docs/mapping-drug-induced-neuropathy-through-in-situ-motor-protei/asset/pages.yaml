    (DMSO, 0.1 vol %) on cargo transport were excluded by quantifying all transport
    parameters (Figure S8). We next investigated the possible changes induced by PTX
    and Vinc in DRG neurons at various levels, including growth morphology, gene expression,
    and neuronal functions. For instance, 24 h after pretreatment of DRGs with the
    two drugs, in situ microscopy imaging showed no marked changes in the sizes of
    somas and axons or in the neuronal morphology (Figure S9). The quantitative polymerase
    chain reaction (qPCR) revealed no significant differences in expression of microtubule-related
    genes (p > 0.05, Kruskal–Wallis test with Dunn’s correction and the Wilcoxon test)
