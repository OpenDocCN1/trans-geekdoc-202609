    # RESULTS AND DISCUSSION


    # Upconversion Nanoprobe Design and Characterizations.


    To verify our hypothesis, we designed and synthesized upconversion nanoparticles
    with multilayer core–shell nanostructures and optimized the photoluminescent output.
    We determined that sodium fluoride based NaYbF4:Tm (2%) nanoparticles emit in
    the range of 400–850 nm (Figure S1). Further confinement of the Yb3+/Tm3+ couple
    into a sandwiched layer, formulated as NaYbF4@ NaYbF4:Tm@NaYbF4, enhanced energy
    transfer from Yb3+ to Tm3+ (Figure S2). The NaYF4 shell layer was employed to
    suppress surface luminescence quenching. These rod-shaped nanocrystals have an
    average size of 33 × 68 nm. Their upconversion emission is over 10 times brighter
    than that of their NaYbF4:Tm counterpart and over 200 times brighter than that
    of conventional NaYF4:Yb/Tm nanocrystals. The photoluminescence enhancement is
    also confirmed by single-nanoparticle imaging, which is in accord with spectral
    data recorded in solution (Figure S3). These core–shell nanorods are ideal for
    implementing real-time tracking of intraneuronal transport at single-particle
    levels with high refreshment rates. We further coated these nanorods with a thin
    layer of silica to improve the hydrophilicity and biocompatibility (Figure S4).
    These silica-capped nanorods with a hydrodynamic size of ~90


    nm in PBS buffer and neurobasal medium maintained long-term stability beyond 3
    months.


    # High-Fidelity Upconversion Intraneuronal Tracking.


    We then utilized an in vitro integrated, two-compartment chamber to culture dorsal
    root ganglion (DRG) cells, one type of primary sensory neurons associated with
    neuropathic pain in the peripheral nervous system (Figure S5). Soma and axonal
    terminals were separated from one another by microtunnels. Nanoprobes supplemented
    in neurobasal medium were added to the axonal compartment and internalized into
    neuronal cells, followed by retrograde transport to the soma compartment. After
    incubation for 1 h, numerous nanoprobe cargoes were detected in axons and somas
    (Figure 2a–e and Movie S1). A statistical analysis of all emissive spots revealed
    that ~99% of the nanoprobes underwent retrograde transport (axon to soma) and
    approximately 1% of them returned to the axon compartment via anterograde transport
    (soma to axon). Both pathways are common to intraneuronal transport.18,19 An example
    of retrograde and anterograde transport was illustrated, following the trajectories
    of bright spots (marked as 3 and 4 in Figure S6). The luminescent signal to noise
    ratio in neurons is over 15 when the exposure time of each frame is set at 50
    ms, and the ratio remains over 3 with a 1 ms exposure time. Notably, no photoblinking
    or photobleaching was observed for nanoprobes in DRG neurons during the entire
    tracking period. The sub-micrometer spatial resolution in intraneuronal tracking
    revealed the trajectories of two bright spots (marked as 1 and 2) along the same
    axonal bundle, but'
