  md: '# # Mapping Drug-Induced Neuropathy through In-Situ Motor Protein Tracking
    and Machine Learning


    Zhigao Yi, Huxin Gao, Xianglin Ji, Xin-Yi Yeo, Suet Yen Chong, Yujie Mao, Baiwen
    Luo, Chao Shen, Sanyang Han, Jiong-Wei Wang, Sangyong Jung, Peng Shi, Hongliang
    Ren, and Xiaogang Liu*


    ABSTRACT: Chemotherapy can induce toxicity in the central and peripheral nervous
    systems and result in chronic adverse reactions that impede continuous treatment
    and reduce patient quality of life. There is a current lack of research to predict,
    identify, and offset drug-induced neurotoxicity. Rapid and accurate assessment
    of potential neuropathy is crucial for cost-effective diagnosis and treatment.
    Here we report dynamic near-infrared upconversion imaging that allows intraneuronal
    transport to be traced in real time with millisecond resolution, but without photobleaching
    or blinking. Drug-induced neurotoxicity can be screened prior to phenotyping,
    on the basis of subtle abnormalities of kinetic characteristics in intraneuronal
    transport. Moreover, we demonstrate that combining the upconverting nanoplatform
    with machine learning offers a powerful tool for mapping chemotherapy-induced
    peripheral neuropathy and assessing drug-induced neurotoxicity.


    ![](img/d3269c8f1d418c506c5d0a3945bc5612_0_0.png)


    # ## INTRODUCTION


    Chemotherapy-induced peripheral neuropathy (CIPN) is a common complication of
    antineoplastic therapy, characterized by symptoms such as pain, numbness, slow
    response, and impaired sensation that could lead to premature termination of patient
    treatment. 1–6 A reliable and robust diagnostic strategy to CIPN is pending and
    is urgent to exploit because current clinical practices mainly rely on subjective
    and imprecise self-reporting from patients. CIPN is usually associated with impairment
    of intraneuronal transport, which regulates critical physiological activities
    such as signal transduction and transport of nutrients and organelles in neurons.
    7–12 Dynamic tracking with fluorescence microscopy would be suitable for quantification
    of subtle changes in intraneuronal cargo movement and therefore contribute to
    CIPN diagnosis. However, it has been challenging to maintain a high fidelity of
    intraneuronal trajectories and establish a standard protocol for neurotoxicity
    assessment. Previous attempts to quantify cargo transport dynamics have been limited
    by low-fidelity recording due to the inherent constraints of conventional fluorescent
    probes such as molecular dyes, fluorescent proteins, quantum dots, and nanodiamonds
    (Figure 1a and Table S1). 13–20 Although molecular fluorophore-labeled organelles
    enable movement tracking, low-contrast imaging due to photobleaching and autofluorescence
    typically occurs. 13,14 The genetic transfection of fluorescent proteins is often
    limited by low transfection efficiency, uncontrolled overproduction of proteins,
    and severe photobleaching. 15,16 Quantum dots feature high photolumi-


    nescence efficiency and photostability but are plagued by photoblinking and cytotoxicity.
    17,18 Lanthanide-activated upconversion nanoparticles have shown promise as alternative
    bioprobes for cell imaging, neuromodulation, and other biomedical applications
    due to their excellent photostability and nonblinking characteristics. 21–29 Our
    previous study has demonstrated the feasibility of intraneuronal tracking in multi-layer
    neuron cultures using upconversion nanoparticles. 21 However, the low-fidelity
    tracking at 7 Hz is unlikely to distinguish CIPN, especially before phenotyping.
    It is thus essential to improve the readout at a single-nanoparticle level to
    achieve high-fidelity recording of intraneuronal movements. Moreover, data processing
    and learning are of significance in correlations between intraneuronal movements
    and neurotoxicity. The deployment of artificial intelligence in photonics has
    yielded transformative advances in data-driven optics, neural networks, and brain–computer
    interfacing. 30–32 Artificial intelligence, such as machine learning, would be
    an irreplaceable technique to identify and quantify high-fidelity intraneuronal
    tracking among an enormous amount of data (Figure 1b). We reasoned that a powerful
    platform for mapping drug-induced neuropathy would be established with'
