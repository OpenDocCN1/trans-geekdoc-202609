    ## 文章信息


    ### 摘要


    本研究引入了一种新型、可重复且稳健的 Twitter 机器人识别系统。该系统使用机器学习（ML）流水线，并从 Twitter 语料库中提取了数百个特征。所提流水线的目标是训练和验证先进的机器学习模型，其中极端梯度提升（XGBoost）模型因其实现了最高的检测性能而被选中。Twitter
    数据集采集于 2020 年美国总统选举期间，在 Twitter 数据集上的实验评估证明了我们方法在机器人检测准确率方面的优越性。


