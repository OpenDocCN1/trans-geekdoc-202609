    # Declaration of competing interest


    During the labeling, we use two-off-shelf ML models for bot detection. We collect
    the detection from both tools (i.e., Botometer and BotSentinel) by majority voting
    and keep only the similar labels. This approach allows us to reduce the noise
    and false-phenomena, since none of the existing tools have 100% accuracy. The
    methodology developed provides ground truth labels and dramatically reduces the
    computation time from 650 to 18 days.


