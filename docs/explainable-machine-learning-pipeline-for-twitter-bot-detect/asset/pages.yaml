    # 3. Impact


    The dataset is publicly available, as well as the implemented pipeline which can
    be adjusted and adopted in other domains.,


    The proposed framework can be used by researchers and researchers to detect accounts
    on Twitter, based on state-of-the-art ML models. The Bot detection tool utilizes
    state-of-the-art ML models, optimizing the feature selection and herper-parameters.
    By comparison with existing methods, the proposed implementation enhances the
    detection of bots while providing accurate classification results using the SHAP
    method. As mentioned earlier, the present software is already utilized on the
    US 2020 Presidential elections, obtaining highly accurate results and is currently
    published in the proceedings of the International Conference on Web and Social
    Media (ICWSM).2022.


    # 2. Methodology


    In answer these questions, we initially tackle the following issues: data acquisition,
    ground truth labeling and bot detection development. To do this, we collect a
    Twitter dataset through API, where we narrow our search to the 2020 Presidential
    Elections. For this purpose, we manually identify the bots during the Elections
    period and manage to collect 15.6 million tweets from 1 November, 2020 to 30 November,
    2020.


    # 4. Conclusions and future work


    The Twitter API does not provide any information about whether an account is bot
    or not, and thus an account labeling method should be taken into consideration.
    In this work, Twitter API is used to identify an account as bot or suspect. However,
    we cannot retrieve this information during our data acquisition phase.


    The proposed bot detection achieves high performance on the collected dataset
    (in terms of period), and compared to data information, performance is reduced
    by only 2% to F1 score (from 0.916 to 0.896 and 0.987). These results suggest
    high generalization of our ML model. As future work, we intend to evaluate the
    bot detection performance on training and test data in different periods.


