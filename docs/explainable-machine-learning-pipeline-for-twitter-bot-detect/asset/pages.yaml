    # ARTICLE INFO


    # ABSTRACT


    This study introduces a novel, reproducible and robust Twitter bot identification
    system. The system uses a machine learning (ML) pipeline with hundreds of features
    extracted from a Twitter corpus. The objective of the proposed pipeline is to
    train and validate state-of-the-art machine learning models, where the Extreme
    Gradient Boosting (XGBoost) model is selected as it achieves the highest detection
    performance. The Twitter dataset was collected during the 2020 US Presidential
    Elections, and experimental evaluation on Twitter datasets demonstrates the superiority
    of our approach, in terms of high bot accuracy.


    +   Keywords:

    - Machine learning

    - Twitter bot detection

    - Model explainability


