  \ | 事件研究 | 企业就业对机器人资本的弹性在 [0.7–2]% 区间 | N/A |\n| **Koch, Manuylov, and Smolka, (2021)**\
  \ | 西班牙, 1990–2016 | 机器人采纳 | 事件研究 | 机器人采纳的年弹性：10% | 不显著 |\n| 来源：引用文献 | | | | | |\n\
  \n这种正影响可能反映了自动化企业的就业净创造，也可能是因为这些企业的离职率较低。这些研究中的一些提供了准实验证据，证明自动化*导致*了企业级就业的增加。在下一节中，我们将详细描述方法，重点关注我们在工厂和企业层面关于自动化与就业的实证工作。\n\
  \n因此，“消极”观点在面对企业级数据时面临困境。与“悲观”故事的预测相反，上述大多数研究均未发现均衡工资下降或劳动份额减少的证据（例如，`Bessen et\
  \ al., 2019`；`Dixon et al., 2019`；`Humlum, 2019`；`Koch et al., 2021`；`Aghion et\
  \ al., 2020`）。\n\n总体而言，这些研究支持了这样观点：企业内部的自动化促进了更高的劳动生产率。它推动了消费者质量调整价格的下降^()\n\n\n\
  \n\n\n企业层面的结果不能直接说明自动化对宏观劳动力需求的影响。例如，生产力效应可能导致自动化企业对非自动化企业产生挤出效应。由于自动化企业内部的生产力效应产生了产品需求增加，这些企业的市场份额以牺牲其非自动化竞争对手为代价而增加。实证研究表明，当竞争对手采用机器人时，相关企业的增加值和就业人数显著下降（Acemoglu,\
  \ 2020; Aghion et al., 2020; Koch et al., 2021）。例如，Koch 等人（2021）发现，采用机器人的企业创造了新工作并扩大了经营规模，而未采用技术的企业则因为与高科技公司面临更激烈的竞争导致了产出下降和就业流失。\n\
  \n因此，基于不同的自动化衡量标准、不同国家和不同时期，近期的微观研究一致指向生产力效应的重要性，即自动化企业内部具有积极的就业影响，而在企业之间可能存在潜在的替代效应。\n\
  \n### c. 哪些工人从自动化中受益或损失？\n\n除了自动化对整体劳动力需求影响的辩论外，还有关于所创造或销的职位类型以及自动化的分配效应的辩论。经济学文献长期认为技术变革是劳动增强型的，且对技能工人是有利的。在\
  \ 20 世纪 90 年代 IT 和计算机革命之后，研究调查了技术进步的技能偏向。这一假设确实支持了技术与技能工人之间存在互补性的观点（概述参见 Acemoglu\
  \ & Autor, 2011）。技术变革将导致劳动力市场的极化，即中等工资职位的增长速度慢于高薪和低薪职位。\n\n在 21 世纪 00 年代，在对 Card\
  \ & DiNardo (2002)的批判以及 Autor 等人 (2003)的开创性论文之后，针对常规任务的自动化“替代劳动力”观点变得流行。根据这一观点，自动化取代了常规工作，并对机器无法完成的非常规工作创造了更多需求。多项研究记录了制造业和常规性岗位的下降（Autor\
  \ et al., 2003; Jaimovich & Siu, 2012; Autor & Dorn, 2013; Charnoz & Orand, 2017;\
  \ Blanas et al., 2019）。\n\n回到企业层的研究，某些研究强调了职业之间的工人重新配置（Bessen, 2019; Bonfiglioli\
  \ et al. 2020; Humlum, 2019; Acemoglu et al., 2020）。Humlum（2019）特别报告了丹麦从低技能工人向高技能工人的转变：劳动力需求从生产工人转向技术工人，如熟练技员、工程师或研究人员。同样，Bonfiglioli\
  \ 等人（2020）显示，法国公司的机器人进口提高了生产率，并增加了高技能职业的就业份额。同样，Bessen（2019）显示，计算机自动化导致高薪职位的增长和低薪职位的减少。利用加拿大数据，Dixon\
  \ 等人（2019）记录了极化效应：对机器人技术的投资与中技能工人就业的萎缩有关，而低技能和高技能工人（尤其是管理活动）的就业在增加。这种从低技能到高技能工人的转变也可能有助于提高测出的生产率（Humlum,\
  \ 2019; Acemoglu et al., 2020）。\n\n然而，一些研究并未发现不同类型的工人和职业类别之间存在任何重新配置效应（Aghion et\
  \ al., 2020）。这可以解释为工作内部的重新配置效应，因为自动化技术通常不取代整个工作，而只取代某些任务（Acemoglu and Autor 2011）。在机器存在的情况下，某些人类技能可能比任何时候都更有价值（Brynjolfsson\
  \ & McAfee, 2011）。因此，自动化可能导致不同工作“工人内部”任务内容的重构（Aghion et al., 2020），增强劳动生产率和就业，但没有改变劳动力的人技能结构。这正是\
  \ Arntz 等人（2017）在质疑 Frey 和 Osborne（2017）分析时提出的问题。Frey 和 Osborne（2017）试图预测工作计算机化的概率，并得出美国未来十或二十年内\
  \ 47%的就业面临风险，而只有 33%的工作风险较低。但他们的分析忽略了工作的任务内容。Arntz 等人（2017）显示，在考虑职业内部任务的异质性时，美国只有\
  \ 9%的工人面临高风险。\n\n## 4. 来自法国的近期实证证据\n\n我们利用法国数据，参考近期的工作（Aghion et al., 2019, 2020），说明了上述文献综述的主要要点。首先，我们展示了使用\
  \ IFR 数据的劳动力市场层面分析为支持负面观点提供了混合支持。其次，我们展示了使用其他自动化衡量标准的企业级和工厂级分析提供了支持第二种观点的准实验证据。我们展示了我们工作的方法论和主要结果，以及新的设定。\n\
  \n### a. 使用 IFR 数据的劳动力市场层级分析\n\nAghion 等人（2019）复现了 Acemoglu 和 Restrepo（2017，下简称\
  \ AR）开发的方法，使用了 1994–2014 年期间的法国数据，分析了机器人化程度增加对宏观就业区层面就业的影响。\n\n为了衡量劳动力市场层面（定义为通勤区层面）对机器人的暴露度，AR\
  \ 建立了一个局部暴露指数，该指数结合了两个元素：(i) 每个行业中每名工人的机器人数量，以及(ii) 给定通勤区 `c` 行业 `i` 原有的就业份额。因此，该局部暴露指数利用了通勤区之间行业就业的初始异质性，将样本期间全国范围内观察到的各行业机器人存量的跨行业变化分布出去。更正式地说，通勤区层面的机器人暴露增加定义为：\n\
  \n```\nUS\\_robot\\_exposure\\_1993–2007_{c} = \\sum_{i \\in I}l_{ci}^{1990}\\left(\\\
  frac{R_{i,2007}^{US}}{L_{i,1990}^{US}} - \\frac{R_{i,1993}^{US}}{L_{i,1990}^{US}}\\\
  right)\n```\n\n其中总和涵盖 IFR 数据中所有 19 个行业 `i`；`l_{ci}^{1990}`代表 1990 年特定通勤区 `c` 行业\
  \ `i`的就业份额；`R_{i}`和`L_{i}`代表特定行业 `i`的机器人存量和就业人数。\n\n与 AR 一致，Aghion 等人（2019）衡量了法国就业区机器人暴露的增加：\n\
  \n```\nRobot\\_exposure\\_1994–2014_{c} = \\sum_{i \\in I}\\frac{L_{ic,1994}}{L_{c,1994}}\\\
  left(\\frac{R_{i,2014}}{L_{i,1994}} - \\frac{R_{i,1994}}{L_{i,1994}}\\right)\n```\n\
  \n其中`L_{ic,1994}`指 1994 年就业区 `c` 行业 `i`的就业，`L_{c,1994}`指 1994 年就业区 `c`的就业，`L_{i,1994}`指\
  \ 1994 年行业 `i`的就业。`R_{i,1994}`和`R_{i,2014}`分别代表 1994 和 2014 年行业 `i`的机器人总数。该指数反映了\
  \ 1994 年至 2014 年间每名工人的机器人暴露度。感兴趣的结果变量是 1990 年至 2014 年就业人口率的演变。\n\n\n\n\n在基准 OLS\
  \ 估计模型中，我们研究了机器人暴露对就业/人口比率演变的影响。随后，我们添加了控制变量，例如信息和通信技术（ICT）的暴露指数 `TICExp[*r*]`（其构建方式与机器人暴露指数类似），以及对中国和东欧的国际贸易暴露指数\
  \ `TradeExp`。在某些回归分析中，我们还添加了针对就业区域 `c` 的控制变量向量 `X[*c]*`：人口统计学特征、制造业占比、广行业占比、广地区虚拟变量以及制造业内部特定行业占比。识别假设是：在给定这一组控制变量的情况下，暴露自动化率增加的行业不会同时受到劳动力需求或劳动力供给中未观测冲击的影响。\n\
  \n```\n$$\\Delta\\frac{L\\_{c,1994}}{Pop\\_{c,\\ \\operatorname{}1994}} = \\alpha\
  \ + \\beta\\_{1}RobotsExp\\_{c} + \\beta\\_{2}TradeExp\\_{c} + \\beta\\_{3}TICExp\\\
  _{c} + \\gamma X\\_{c} + \\epsilon\\_{c}$$\n```\n\n为了衡量机器人暴露对当地劳动力市场的影响，所采用的策略类似于\
  \ Autor 等人 (2013) 提出的策略：将美国行业机器人暴露的观测变化，通过其他发达国家相同行业机器人暴露的变化进行工具化。这种方法有助于解决影响 OLS\
  \ 方法的美国特有的识别威胁：我们可以想象存在某种冲击，我们在控制变量中并未捕捉它，但它可能同时影响机器人安装和当地劳动力市场的动态。遵循 AR 的方法，来自其他发达国家（德国、丹麦、西班牙、意大利、芬兰、挪威、瑞典和英国）的机器人存量被用于构建其他机器人暴露指数。这些新指数随后用于基于法国机器人存量构建的暴露指数的工具变量。\n\
  \n在这种份额移动（shift-share）IV 设计中，识别来自于跨行业机器人化冲击的异质性，这种异质性被投影到区域层面。识别源于机器人化冲击 $\\frac{R\\\
  _{i,\\ \\operatorname{}2007}^{US}}{L\\_{i,\\ \\operatorname{}1990}^{US}} - \\frac{R\\\
  _{i,\\ \\operatorname{}1993}^{US}}{L\\_{i,\\ \\operatorname{}1990}^{US}}$ 和 $\\\
  frac{R\\_{i,\\ \\operatorname{}2014}}{L\\_{i,1994}} - \\frac{R\\_{i,\\ \\operatorname{}1994}}{L\\\
  _{i,1994}}}$。事实上，正如 Borusyak 等人 (2021) 所述，就业份额 `l`[*c**i*]¹⁹⁹⁰` 并不是针对机器人化暴露定制的：它们是“通用的”，因为它们理论上可以衡量观测值对多个冲击（包括观测和未观测冲击）的暴露。因此，控制可能污染行业级识别变异的行业特征非常重要，例如行业是否属于制造业。如果没有此类控制，我们将机器人化的潜在影响与广泛的部门趋势混淆。\n\
  \n表 2.3 显示了 OLS 估计结果。该表显示了机器人暴露与就业/人口比率变化之间存在负相关。然而，我们观察到随着控制变量的增加，显著性水平有所下降。在第\
  \ (5) 列中，一旦包含了当地制造业的控制变量，显著性消失且点估计值大幅下降，这表明广泛趋势发挥了重要作用。相关性在第 (6) 列中边缘显著，在第 (7) 至\
