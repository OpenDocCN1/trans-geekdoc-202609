  \ 是进口时间固定效应，`ζ`[`i**t**]`(`E`) 是出口时间固定效应。我们包含零贸易观测值来估计 (12)。选择 `ζ`[`b**t**]`(`M`)\
  \ 作为基准国家：\n\n```\n\\frac{P_{nt}^{R}}{P_{bt}^{R}} = \\exp\\left[\\frac{1}{\\theta^{R}}\\\
  left(\\widetilde{\\zeta}_{nt}^{M} - \\ln\\frac{\\sum_{i \\neq n}X_{nit}^{R}}{X_{bt}^{R}}\\\
