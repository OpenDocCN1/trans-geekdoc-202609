  \ Rodrik (2018) 和 Goger 等 (2014) 的观点一致。\n\n## 6. 企业级启示\n\n规模较大、国际活跃的企业更有采用机器人。它们事后如何变化？利用十个发展中国家的企业级数据，我们采用事件研究法来回答这个问题（基于\
  \ Bessen 等，2020）。我们估计：\n\n```\nln Y_{ft} = \\sum_{s \\neq -1,s = -2}^{2}\\alpha_{s}\
  \ \\times AutoEvent_{ft - s} + \\alpha \\cdot X_{ft} + \\alpha_{ct} + \\alpha_{it}\
  \ + \\alpha_{f} + \\epsilon_{ft}\n```\n\n其中 `X`[`f**t*]`控制企业年龄。自动化事件定义为企业在机器人上的支出超过其平均成本份额三倍时期，不包括当期的机器人购买。具体而言：\n\
  \n```\nAutoEvent_{f\\tau} = 1\\left\\{ \\frac{RobotPurchases_{f,t = \\tau}}{\\overline{TotalNonRobotImports}_{f}}\
  \ \\geq 3 \\times \\frac{\\overline{RobotPurchases}_{f,t \\neq \\tau}}{\\overline{TotalNonRobotImports}_{f}}\
  \ \\right\\}\n```\n\n\n\n\n为了减轻选择效应（例如，自动化程度较高的企业管理得更好），我们将主样本限制为仅在某些时间点实施过自动化的企业。因此，相关的反事实（即衡量\
  \ `β` 所捕捉效应的基准）是那些实施了自动化的企业的趋势，但并非与所研究的企业处于同一时期。我们发现，在引入机器人后，企业增加了出口和市场份额，并扩大了出口产品和目的地（图\
  \ 8.10）。机器人化企业不仅在事前规模更大；它们采用机器人的同时也伴随着事后的进一步扩张.^() ![图 8.10 机器人引入对企业出口结果的影响 ¶ 注：所有变量均为对数形式。显示\
  \ 95% 显著性水平的置信区间。标准误在企业层面聚类。¶ 来源：世界银行出口动态数据库。](img/fig0061.jpg)\n\n图 8.10 机器人引入对企业出口结果的影响\
  \ ¶ 注：所有变量均为对数形式。显示 95% 显著性水平的置信区间。标准误在企业层面聚类。¶ 来源：世界银行出口动态数据库。\n\n换句话之，我们有证据表明机器人化促进了发展中国家初始规模较大的企业的增长。因此，机器人化有助于增加发展中国家的平均企业规模，从而提高总生产率（Hsieh\
  \ and Klenow, 2014）。然而，这一证据也为早前的分配问题增加了企业端的因素：受机器人化威胁最大的不仅是处于劣势的工人，还有规模较小、生产率较低且国际活跃度较低的企业.^()\n\
  \n## 7. 结论\n\n工业机器人将给发展中国家带来冲突的压力。从长远来看，发达国家的机器人采用很可能会催化国际贸易并增强全球福利。这一结论可能会因为由于其他新技术（例如高速互联网和数字平台）将进一步降低跨境贸易和协调的成本（Brynjolfsson\
  \ et al., 2019; Freund and Weinhold, 2002, 2004），并创造出全新的产品和任务（Acemoglu and Restrepo,\
  \ 2018; Nakamura and Zeira, 2018）。此外，中国日益增长的机器人化（部分由补贴驱动）可能会缩小与先进经济体之间的生产率差异（从而减少与它们进行行业间贸易的收益），并且不必阻碍低收入国家工业化和出口导向增长的前景。\n\
  \n同时，贸易和技术变化将需要劳动力市场调整，并可能在向自动化生产过渡期间及之后产生严重的分配紧张局。发展中国家的机器人采用可能会加剧双方之间的差异：一方面是占据出口大部分份额的更先进的国际活跃企业，另一方面是占据大量低技能和体力劳动就业的小型非正规企业。这些企业间的差异也可能加剧发展中国家家庭之间的收入差距。此外，随着时间的推移，发达国家的自动化可能会阻碍发展中国家对某些高增长潜力的部门进行投资，导致“过早去工业化”（Rodrik，2016）。权衡这些风险与专门从事劳动密集型出口的潜在收益将是一项艰难的平衡行动。因此，制定既能利用全球化和技术进步增长潜力，又能确保相关收益公平共享的政策是未来研究的一项任务。\n\
