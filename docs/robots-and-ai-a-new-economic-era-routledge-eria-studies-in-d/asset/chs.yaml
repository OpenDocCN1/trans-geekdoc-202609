  \ p < 0.01, ** p < 0.05, * p < 0.1。\n\n总体而言，这项实证研究显示的模式与受自动化影响的职业选择性增加以及受外包影响的职业选择性减少相吻合。特别是对于自动化观察到的模式与自动化悖论（Bainbridge，1983\
  \ 首次提出并在第 2 节讨论）相一致。实证研究还显示，与外包性的交互通常会加强由自动化性引发的选择性。^^()\n\n### 4 具有核心偏向技术变化的搜索模型\n\
  \n在本节中，我们通过一个简单的劳动力市场筛选模型来解释前部分的实证发现，该模型解释了自动化和外包如何影响观察到的匹配选择性和就业。\n\n遵循 Becker\
  \ (1973)和 Shimer and Smith (2000)，模型依赖于两个关键要素。第一个是企业任务与执行这些任务所需的工人技能之间的关联性（assortativity），这意味着存在“理想”的技能与任务组合，可产生最大的匹配剩余。^^()\n\
  \n\n\n我们证明，通过校准自动化和外包影响匹配剩余的方式，该模型能够复制前一节中强调的实证模式。具体而言，暴露在自动化影响下的职业其选择性增加，而暴露在外包影响下的职业其选择性降低，要求理想匹配与次理想匹配之间的差异剩余被自动化所扩大，并被外包所削减。此外，观察到与外包可能性的相互作用通常会增强自动性的影响，这要求自动化对差异剩余的正向影响被外包进一步增强。正如我们将会看到的，这些要求约束了生产过程的同质性属性。\n\
  \n### 4.1 匹配、搜索与异质性\n\n存在两类异质性主体：工人和企业。时间是连续的，在每一时刻，事件发生时机如下：具有异质任务的企业决定是否进入劳动力市场，并随机地与具有异质技能的工人进行一对一相。在观察到各自的任务或技能后，每家企业与其遇到的工人将决定是否匹配。如果他们决定匹配，则根据纳什协议，按照匹配剩余的比例对工资进行谈判。每家企业或每个工人的稳态纯策略是决定与哪些工人或企业匹配，同时将所有其他企业和工人的策略视为给定。\n\
  \n所有主体都是风险中性的、无限寿命的，并使其未来收入流的现值最大化，并由共同折现因子 `ρ` 进行折现。收入流由企业和工人通过生产产生的匹配剩余决定。工人技能和企业任务的水平差异是通过由单位圆表示的特征空间沿不同地址引入的。在单位圆上，存在一个外生的国内工人测度\
  \ `L > 0`，其技能索引为 `x ∈ [0, 1]`，从正午开始顺时针方向（“技能地址”）。跨越不同地址的技能分布由均匀概率密度函数 `gw` 决定。给定单位支撑，因此每个地址有\
  \ `L` 个工人。同样，存在一个任务索引为 `y ∈ [0, 1]` 的企业测度，从正午开始顺时针方向（“任务地址”）。虽然工人测度 `L` 是外生的，但企业测度是由自由进入和退出内生决定的。任务分布也由均匀概率密度函数\
  \ `g[f] (y)` 支配。为了简单起见，假设它是均匀的，因为它会导致所有地址产生相同的均衡结果。\n\n当地址为 `x` 的工人与地址为 `y` 的企业匹配时，他们产生共同剩余\
  \ `s(x, y, A, Ω)`。该剩余取决于自动化程度 `A`、外包程度 `Ω` 以及技能地址 `x` 与任务地址 `y` 之间的距离：\n\n$$\\\\\
  begin{array}{r} {d\\left( x,y \\right) = \\min\\left\\lbrack {x - y + 1,y - x} \\\
  right\\rbrack} \\\\ \\\\ \\\\ \\end{array}$$\n\n(3)\n\n其中 `min` 函数选择了沿单位圆在 x 和 y\
  \ 之间顺时针和逆时针行程的较短弧距离。当 `x = y` 时发生“理想”匹配，这意味着 `d(x, y) = 0`。我们将关注对称纯策略稳态，其接受区域为围绕理想匹配\
  \ `d = 0` 中心的区间 `[-d(*), d(*)]`，对于所有 `x ∈ [0, 1]` 和 `y ∈ [0, 1]`。相应地，我们将省略 `d` 对\
  \ `x` 和 `y` 的依赖，仅使用 `s(d, A, Ω)` 表示在距离为 `d`、自动化程度 `A` 和外包程度 `Ω` 下的匹配剩余。由于接受区间的测度为\
  \ `2d(*)`，我们将 `1/d(*)` 作为模型的“选择性”指数。\n\n所有主体都知道自己的类型以及他们遇到的所有潜在伙伴的类型。然而，由于搜索摩擦，国内企业和工人并不总都能在生产性匹配中配对。\n\
  \n只有空缺的企业和失业的工人参与搜索。相遇率根据标准的随机搜索设置设定，特征是泊松分布的相遇间隔。我们采用线性匹配技术，由一次同次的柯布-道格匹配函数 `M(U,\
  \ V) = ϑU^(ξ*)V^(1−ξ*)` 描述，其中 `ϑ` 是匹配效率，`U` 是失业率，`V` 是空缺率，`ξ ∈ (0, 1)` 是新匹配对失业的弹性。\n\
  \n企业面临维持已填充或空缺职位的成本 `c > 0`，以最终商品的单位支付。匹配剩余根据纳什谈判解决方案共享，工人谈判权重为 `α ∈ (0, 1)`。我们通过将失业工人和空缺企业的收入归一化为\
  \ 0，对工人和企业均实施零外部选择。\n\n模型的均衡确定如下。为了避免符号杂乱，我们暂时省略变量对自动化和外包的依赖。工人被雇佣的折现值 `ve` 等于当前工资加上潜在未来损失的期权价值：\n\
  \n$$\\\\begin{array}{r} {\\\\rho v_{e}\\\\left( d \\right) = w\\left( d \\right)\
  \ + \\text{option value}} \\\\ \\\\ \\\\ \\end{array}$$\n\n(4)\n\n考虑到失业工人的收入归一化为\
  \ 0，失业的折现值 `v[u]` 等于潜在未来收益的期权价值：\n\n$$\\\\begin{array}{r} {\\\\rho v_{u}\\\\left(\
  \ d \\right) = 2q_{u}\\\\int_{0}^{d(*}}\\\\left( v_{e}\\\\left( z \\\\right) - v_{u}\
  \ \\right)dz} \\\\ \\\\ \\\\ \\end{array}$$\n\n(5)\n\n这考虑到失业工人以内生速率 `q[u]` 遇到空缺，并在其类型落在测度为\
  \ `2d(*)` 的接受区间时转化为工作。填充职位的价值 `vp` 等于在支付工资 `w(d)` 和维护成本 `c` 后加上未来分离的期权价值：\n\n$$\\\
  \\\\begin{array}{r} {\\\\rho v_{p}\\\\left( d \\\\right) = s\\\\left( d \\\\right)\
  \ - w\\\\left( d \\\\right) - c + \\\\delta\\\\left( v_{p}\\\\left( d \\\\right)\
  \ - v_{v} \\right)} \\\\ \\\\ \\\\ \\end{array}$$\n\n(6)\n\n空缺职位的价值 `v[v]` 满足：\n\
  \n$$\\\\begin{array}{r} {\\\\rho v_{v} = - c + 2q_{v}\\\\int_{0}^{d(*}}\\\\left(\
  \ v_{p}\\\\left( z \\\\right) - v_{v} \\right)dz} \\\\ \\\\ \\\\ \\end{array}$$\n\
  \n(7)\n\n其中右侧对应于以内生速率 `q[v]` 填充空缺的期权价值。均衡条件随后由纳什谈判规则补充：\n\n$$\\\\\\begin{array}{r}\
  \ {\\\\left( {1 - \\\\alpha \\\\right)\\\\left( v_{e}\\\\left( d \\\\right) - v_{u}\
  \ \\\\right) = \\\\alpha\\\\left( v_{p}\\\\left( d \\\\right) - v_{v} \\\\right)}\
  \ \\\\ \\\\ \\\\ \\end{array}$$\n\n(8)\n\n加上空缺价值的自由进入条件（`v[v] = 0`）、与最大差异 `d(*)`\
  \ 相关的填充职位零截断值条件（`vp) = 0`）以及就业的稳态流量条件：\n\n$$\\\\begin{array}{r} {q\\_{u} = \\\\\
  frac{\\\\delta E}{2d^{****}\\\\left( {1 - E} \\\\right)}}. \\end{array}$$\n\n(9)\n\
  \n最后一个条件要求工作破坏 `δE` 被工作创造 `2q[u]d(*)(1 — E)` 精确抵消，失业工人以速率 `q[u]` 遇到空缺，并根据接受区间测度（等于\
  \ `2d(*)`）与特征空间测度（等于 1）之间的比例与其相应的企业匹配。\n\n利用自由进入和零截断条件，均衡条件集可以简化为两个方程组成的系统：\n\n\n\
  \n\n\n$$\\begin{array}{r} {\\left( {1 - \\alpha} \\right)\\frac{2\\vartheta^{\\\
  frac{1}{1 - \\xi}}\\left( q_{u} \\right)^{- \\frac{\\xi}{1 - \\xi}}}{\\delta + \\\
  rho + 2\\left( {1 - \\alpha} \\right)\\vartheta^{\\frac{1}{1 - \\xi}}\\left( q_{u}\
  \ \\right)^{- \\frac{\\xi}{1 - \\xi}} + 2\\alpha q_{u}}\\int_{0}^{d^{✱}}s\\left(\
  \ z \\right)dz = c} \\\\\\\\ \\end{array}$$  \n\n(10)\n\n以及\n\n$$\\begin{array}{r}\
  \ {\\left( {1 - \\alpha} \\right)\\frac{\\delta + \\rho + 2\\vartheta^{\\frac{1}{1\
  \ - \\xi}}\\left( q_{u} \\right)^{- \\frac{\\xi}{1 - \\xi}}}{\\delta + \\rho + 2\\\
  left( {1 - \\alpha} \\right)\\vartheta^{\\frac{1}{1 - \\xi}}\\left( q_{u} \\right)^{-\
  \ \\frac{\\xi}{1 - \\xi}} + 2\\alpha q_{u}}s\\left( d^{✱} \\right) = c,} \\\\\\\\\
  \ \\end{array}$$  \n\n(11)\n\n在就业水平 `E` 和最大错配距离 `d^*` 下，匹配剩余 `s(d*)` 和满足率 `q[u]`\
  \ 由公式 (9) 给出。\n\n$$\\begin{array}{r} {w\\left( d \\right) = \\frac{\\alpha\\left(\
  \ {\\delta + \\rho + 2q_{u}} \\right)}{\\delta + \\rho + 2\\left( {1 - \\alpha}\
  \ \\right)\\vartheta^{\\frac{1}{1 - \\xi}}\\left( q_{u} \\right)^{- \\frac{\\xi}{1\
  \ - \\xi}} + 2\\alpha q_{u}}s\\left( d \\right).} \\\\\\\\ \\end{array}$$  \n\n\
  (12)\n\n### 4.2 自动化、外包与同质性\n\n在阐述了具有双边异质性的搜索模型后，我们现在可以讨论自动化和外包如何影响同质性，以使模型的预测与第\
  \ 2 节讨论的并在第 3 节强调的实证模式保持一致。为此，我们通过将匹配剩余 `s(d*)` 重写为 `s(d, A, Ω)`，明确化了其对自动化和外包的依赖关系。\n\
  \n为了与实证模式一致，模型的预测需要满足三个要求。首先，理想匹配相对于非理想匹配的剩余差异应该通过自动化增加。其次，剩余差异应该通过外包减少。第三，也是最后，自动化对剩余差异的正向影响应该通过外包得到加强。\n\
  \n如果匹配剩余 `s(d, A, Ω)` 在 `d` 和 `A` 上是对数亚模（log-submodular），则模型的预测满足了第一个要求。同地，如果匹配剩余\
  \ `s(d, A, Ω)` 在 `d` 和 `Ω` 上是对数超模（log-supermodular），则满足第二个要求。换句话说，更好的匹配（即距离 `d`\
  \ 较小的匹配）在利用自动化方面具有比较优势，而较差的匹配（即距离 `d` 较远的匹配）在利用外包方面具有比较优势。如果匹配剩余 `s(d, A, Ω)` 在\
  \ `A` 和 `Ω` 上是对数超模，则满足第三也是最后一个要求。换句话说，自动化程度较高的匹配在利用外包方面具有比较优势，反之，外包程度较大的匹配在利用自动化方面具有比较优势。注意，`A`\
  \ 和 `d` 上的对数亚模性意味着，随着自动化的进行（`A` 增大），工和企业相对于非理想匹配，对理想匹配赋予了越来越高的价值。这就是我们所谓的“核心偏向的技术变革”（CBTC）。\n\
  \n我们证明，这些关于对数模性的假设允许模型预测通过基于匹配剩余 `s(d, A, Ω)` 的特定数值实现来重现观测到的实证模式。\n\n### 4.3 简单数值示例\n\
  \n假设由工人 `x` 和企业 `y` 进行生产遵循具有规模报酬的柯布-格拉斯拉斯函数，资本和劳动力作为投入，产量为 `B`，份额为 `β`。产出在完全竞争市场中以单位价格出售。工人的生产率由匹配距离\
  \ `d`、自动化程度 `A` 和外包范围 `Ω` 决定。在忽略 `d` 对 `x` 和 `y` 依赖的情况下，我们使用 `L(d, A, Ω)` 表示这种生产率。资本服务可以在完全竞争市场中以租赁率\
  \ `ρ > 0` 租赁。匹配剩余通过从生产中减去资本服务获得。根据资本边际生产率等于租赁率的完全竞争条件，匹配剩余 `s(d, A, Ω)` 变为：\n\n\
  $$\\begin{array}{r} {s(d,A,\\Omega) = \\Phi B^{\\frac{1}{1 - \\beta}}}L(d,A,\\Omega),\
  \ \\end{array}$$\n\n(13)\n\n其中参数 `Φ \\equiv (1 - β)^{ρ}`。\n\n每个任务由在“自动化性”和“外包性”二维连续体上的子任务组成，分别由索引\
  \ `a ∈ [0, 1]` 和 `ω ∈ [0, 1]` 测量。二维表示捕捉了自动化性和外包性在概念和实证上是不同的，如第 3 节所强调。工人执行自动化性为\
  \ `a` 和外包性为 `ω` 的子任务的生产率由下式给出：\n\n$$\\begin{array}{r} {l(d,a,\\omega) = Fa\\omega\
  \ - \\frac{1}{2}(\\gamma_a + \\gamma_\\omega)d,} \\end{array}$$\n\n(14)\n\n其中 `F\
  \ > 0`。根据 (14)，在没有错配（`d = 0`）的情况下，工人在高自动化性和高外包性的子任务中生产率更高。关键在于，在存在错配（`d > 0`）的情况下，对于给定的\
  \ `d`，自动化性和外包性影响错配惩罚 `γ[a]a + γ[ω]ω`，其中 `γ[a]` 和 `γ[ω]` 是固定参数，它们的符号将在范围内起到至关作用。\n\
  \n企业首先决定哪些子任务进行自动化或外包；然后寻找工人来分配剩余的任务。根据 (14)，企业对低 `a` 和低 `ω` 的子任务具有更强的自动化倾向。因此，如果存在自动化和外包成本，且这些成本是自动化和外包子任务测量（数量）的增函数函数，则存在自动化阈值\
  \ `A ∈ [0, 1]` 和外包阈值 `Ω ∈ [0, 1]`，使得 `a ∈ [0, A]` 的子任务被自动化，`ω ∈ [0, Ω]` 的子任务被外包，而\
  \ `a ∈ [0, A]` 且 `ω ∈ [0, Ω]` 的子任务既被自动化又被外包。对于 `a ∈ [A, 1]` 和 `ω ∈ [Ω, 1]` 的剩余任务，企业寻找工人。\n\
  \n具有距离企业任务距离 `d` 技能的匹配工人的生产率可以通过对 (14) 在 `a ∈ [A, 1]` 和 `ω ∈ [Ω, 1]` 上进行积分来评估：\n\
  \n$$\\begin{array}{r} {L(d,A,\\Omega) = (1 - A)(1 - Ω)\\left\\{ \\frac{1}{4}F(1\
  \ + A)(1 + \\Omega) - \\frac{1}{4}\\left[\\gamma_a(1 + A) + \\gamma_\\omega(1 +\
  \ \\Omega)\\right] d \\right{\\}} \\\\\\\\ \\end{array}$$  \n\n(15)\n\n\n\n\n其中，大括号外的项\
  \ `(1−A*)(1−Ω)` 是工人执行的子任务的衡量（“数量”），因为这些任务既没有自动化也没有外包（“广延边际”）；而大括号内的项是工人在这些子任务中的平均生产率（“密集边际”）。当更多子任务被自动化（较大的\
  \ `A*`）或外包（较大的 `Ω`）时，对匹配工人的生产率会产生三种影响 (15)。\n\n1. **替代效应**：随着分配给工人的子任务减少，广延边际收缩。这就是“替代效应”。\n\
  2. **生产率效应**：由于匹配的工人可以专注于更高 `a` 或更高 `ω`（工人生产率更高）的子任务，理想匹配（`d = 0`）的生产率随提高。这就是“生产率效应”。\n\
  3. **错配惩罚效应**：取决于 `γ[a]` 和 `γ[ω]` 的符号，非理想匹配（`d > 0`）的生产率相对于理想匹配（`d = 0`）增加或减少。这就是“错配惩罚效应”。\n\
  \n错配惩罚效应的符号取决于对劳动生产率 `L(d, A, Ω)` 以及匹配剩余 `s(d, A, Ω)` 的对数调性的假设，因为根据 (13)，后者继承了前者的对数调性性质。特别是，`L(d,\
  \ A, Ω)`——以及 `s(d, A, Ω)`——在 `A` 和 `d` 上是对数亚调的，当且仅当对于所有 `d' > d` 和 `A' > A`，都有 `s(d',\
  \ A')/s(d, A') < s(d', A)/s(d, A)`，这在 `γ[ω] < 0` 时成立。类似地，`L(d, A, Ω)`——以及 `s(d,\
  \ A, Ω)`——在 `Ω` 和 `d` 上是对数超调的，当且仅当对于所有 `d' > d` 和 `Ω' > Ω`，我们 `s(d', Ω')/s(d, Ω')\
  \ > s(d', Ω)/s(d, Ω)`，这在 `γ[a] > 0` 时成立。此外，对于 `γ[ω] < 0` 和 `γ[a] > 0`，`L(d, A, Ω)`——以及\
  \ `s(d, A, Ω)`——在 `A` 和 `Ω` 上也是对数超调的。\n\n![图 4.2 就业集中度。¶ 此图绘制了在 x 轴自动化程度 `A` 范围内的模拟就业集中度，左面板对应\
