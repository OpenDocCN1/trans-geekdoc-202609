  \ 表 2 信息的阐述。 |\n| --- |\n\n一些研究人员得出了大致相似的结果，而另一些人则发现数字低得多。麦肯锡全球研究院（2005）研究了不同高工资经济体的八个代表性行业，估计约\
  \ 11% 的工作可以外包到发展中国家。Bardhan 和 Kroll (2003) 发现美国约 11% 的工作可以外包，但他们将范围限制在已经发生某些外包的职业上。Van\
  \ Welsum 和 Vickery (2005) 估计美国总就业人数的 20% 可以外包。Jensen 和 Kletzer (2010) 采用了完全不同的方法，利用美国境内的位置数据。他们认为，地理集中的服务部门更具贸易性，因为服务消费者往往根据人口比例呈分散分布。他们的工作意味着，38%\
  \ 的美国工作者处于贸易性、因此是可以外包的职业中。简而言之，这些估值从不容忽视，但有些甚至不到 Blinder 原始估值的一半。\n\n## 2.1 向量向量法\n\
  \n去年，Dingel 和 Neiman (2020) 采用双向量法来回答一个与 Blinder 类似的问题：有多少工作可以在家里完成？他们利用职业信息网络（O*NET）调查的职业特征，通过将每个职业分类为“可以远程执行”或“不能”，构建了第一个向量。第二个向量与\
  \ Blinder 的类似，包含了在相应职业工作的人数。这两个向量的内积提供了该问题的答案。\n\n但 Dingel-Neiman 和 Blinder 提出的问题在细微但重要的方面有所不同。Dingel\
  \ 和 Neiman (2020) 问的是，在疫情期间，有多少工人可以坐在家里，并执行他们在疫情前在雇主办公室（压倒性地）从事的相同工作。显而易见，主要问题在于工作的性质：它们可以远程执行吗？就远程办公能力而言，工者的性质是无关的，因为这项研究考虑的是相同的工人是否可以在家里完成这些工作。\n\
  \nBlinder (2007) 回答了一个完全不同的问题。他询问例如，一个乌拉圭政治分析师是否可以通过将服务出口给目前由该美国分析师服务的美国客户，来与美国政治分析师从事相同的工作。在这里，工作的性质和工者的性质似乎都很重要：服务可以从另一个国家提供吗？是否有外国工人可以提供它？注意，Blinder\
  \ (2007) 明确承认了这一点，“任务是估计可能外包的职位数量，这意味着从事这些工作的美国人面临着来自例如印度或中国工人的潜在竞争。”\n\n## 2.2\
  \ 额外考虑\n\n一项“可外包的”工作（Blinder 2009 的含义）是否真的在海外执行，取决于许多其他考虑因素。首先，必须有能够胜任工作的外国工人。我们希望纳入有关每个职业中潜在外国供应商数量的数据。在美国，可以远程执行的职业往往是技能密集型、高工资的工作（Dingel\
  \ and Neiman 2020）。正如 Blinder (2006) 所讨论的，这是对新兴市场将此类服务出口到发达经济体对劳动力市场产生的影响的一部分。这也意味着潜在的外国供应商并非外国劳动力，而是拥有相关技能的外国工人，正如通过教育程度或当前职业所揭示的那样。\n\
  \n其次，必须解决这样一个事实：即使国内和外国工人具有相同的教育程度或职业职称，他们仍然不是完美的替代品。例如，在许多可以远程办公的工作中，说英语的加拿大人可能是英语美国人的很好的替代品，但说葡萄牙语的巴西人似乎不太可能立即执行相关的语言密集型任务。即使是来自不同国家的英语使用者，也可能发现他们与客户及同事的互动会受到各种语言和文化摩擦的影响，正如那句调侃所说，美国和英国是两个被共同语言隔开的国家。\n\
  \n事实证明，这种摩擦在可以远程执行的职业中可能尤为相关。Dingel 和 Neiman (2020) 用于将职业分类为可以远程执行的 O*NET 调查还对每个职业的语言强度和软技能的重要性在\
  \ 1 到 5 分的范围内进行了表征。图 6.2 显示，可远程办公职业对英语能力的重视程度远高于那些无法远程执行的职业。英语重要评分最高的职业是公共关系专家（5\
  \ 分满分 4.96）。虽然这项工作可以远程执行，但它也是一个对语言细微差别和精确性非常重要的职业。\n\n![图 6.2 可远程办公与不可远程办公工作对英语的重要性\
  \ ¶ 来源：作者对 O*NET 数据的阐述。职业的可远程办公与否的分类源自 Dingel 和 Neiman (2020)。](img/fig0022.jpg)\n\
  \n图 6.2 可远程办公与不可远程办公工作对英语的重要性 ¶ 来源：作者对 O*NET 数据的阐述。职业的可远程办公与否的分类源自 Dingel 和 Neiman\
  \ (2020)。\n\n\n\n更广泛地说，可以远程完成的工作倾向于依赖软技能，软技能包含了特定社会和文化背景的元素。Deming (2017) 记录了过去几十年美国社会技能回报的上升，并强调增长最快的认知职业是那些需要人际互动的职业。如图\
  \ 6.3 所示，可以远程完成的工作通常对口头表达和书面表达更为重视。图 6.4 显示，可远程办公的职业通常对说服力和感知力更为重视。销售工程师和数学技术人员都可以远程办公，但他们在说服力方面处于两个极端（5\
  \ 分满分 4.25 对 1.66）。由于社会和文化背景在国家之间存在差异，这使得位于河内的公共关系专家或销售工程师不太可能是西雅图同事的完美替代品。\n\n\
  图 6.3 可远程办公与不可远程办公工作对口头和书面表达的重要性 ¶ 来源：作者对 O*NET 数据的阐述。职业的可远程办公与否的分类源自 Dingel 和 Neiman\
  \ (2020)。\n\n图 6.4 可远程办公与不可远程办公工作对说服力和感知力的重要性 ¶ 来源：作者对 O*NET 数据的阐述。职业的可远程办公与否的分类源自\
  \ Dingel 和 Neiman (2020)。\n\n## 2.3 CAGE 距离\n\n\n\n\n\n阐述不同语言、文化和社交背景的工人可替代性问题的一种方法，是将其视为工人之间的“距离”问题。这种隐喻性的距离涵盖了多个维度。例如，可以远程进行但必须同步进行的活动会对时区差异非常敏感（Bahar\
  \ 2020）。考虑到国家对组合，Ghemawat (2007) 将这些文化、行政、地理和经济因素的差异称为这些国家之间的 `CAGE` 距离。从这个意义上说，魁北克的法语裔加拿人相对于卡尔加的英语裔加拿人，距离纽约雇主被认为更“远”，尽管卡尔加在地理距离上还要远了\
  \ 3000 多公里。\n\n这种将国内和外国工人之间的替代性设定为双边距离的方法，直接引出了贸易中的一个标准关注点——替代供应商的性。美国公司从特定国家雇用外国工人的可能性不仅取决于与该国家的双边\
  \ `CAGE` 距离，还取决于与替代劳动力来源的双边距离。\n\n因此，除了估计一个国家可能由国外提供的远程办公工作总量的双向量法外，还应该考虑其他国家潜在供应商的规模以及两者之间的“距离”衡量。从“有多少发达经济体的工作是可以外包的？”转向“有多少发达经济体的工作可以外包新兴市场？”，我们增加了对出口国经济规模以及此类潜在服务贸易双边障碍的考量。这指向了国际交易的引力方程，这是总结经济体预期贸易额的一种长期方法。\n\
  \n### 2.4 引力是一种难以摆脱的习惯\n\n最简单的引力方程预测，双边商品贸易与原产国经济质量乘以目的国经济质量除以双边距离成正比（Head and Mayer\
  \ 2014）。在考虑职业层交易时，需要进口国对远程办公任务的需求、出口国潜在供应的衡量，以及距离的概念。进口国可以远程执行的工作总数是相关的进口国质量，具有适当技能的工人的人口是相关的出口国质量，以及捕捉双边贸易摩擦的各种\
  \ `CAGE` 距离。\n\n事实证明，使用进口和出口国固定效应进行估计解决了竞争性替代供应商的作用，并消除了收集规模变量数据的需要，尽管这是是以限制潜在供应思维实验为代价的。在这一点之前，有必要明确说明在引力方程的背景下，我们如何看待作为服务贸易的远程迁移。\n\
  \n## 3 远程迁移的初步引力方程\n\n为了引导我们利用引力研究远程迁移的思路，在模型最简单的推导中列出步骤是很有用的。在这里我们描绘了一个所有经济活动都在服务部门的引力模型。这种单部门描述遵循\
  \ Baldwin 和 Taglioni (2006)。\n\n假设每个潜在的远程移民提供国内差异化的劳动力服务（Armington 假设）。\n\n```\n\
  p[od]*x[od] ≡ share[od]*E[d]\n```\n\n其中 `share[od]` 是 `d` 市场中用于 `o` 国工人提供的服务的支出份额。`E[d]`\
  \ 是 `d` 国对远程办公工作的总支出。接下来，我们使用 CES 需求函数将份额与相对价格联系起来：\n\n$$share_{od} = \\left( \\\
  frac{p_{od}}{P_{d}} \\right)^{1 - \\sigma},, where\\{~~}P_{d} = \\left( {\\sum\\\
  limits_{k = 1}^{R}\\left( p_{kd} \\right)^{1 - \\sigma}} \\right)^{1/{({1 - \\sigma})}},\\\
  \\,\\sigma > 1$$  \n\n其中 `R` 是世界上国家的数量。假设存在完全竞争，均衡价格为：\n\n```\np[od] = τ[od]*w[o]*a[o]\n\
  ```\n\n其中 `a[o]` 是单位劳动力系数，`w[o]` 是均衡工资，`τ[od]` 是双边冰山成本。因此，从 `o` 到 `d` 的出口为：\n\n\
  $$V_{od} = \\tau_{od}w_{o}a_{o}x_{od} = \\left( \\frac{\\tau_{od}w_{o}a_{o}}{P_{d}}\
  \ \\right)^{1 - \\sigma}E_{d}$$  \n\n这里 `V[od]` 是从 `o` 到 `d` 的远程迁移支付总额，即服务贸易的双边价值。\n\
  \n最后，我们使用一般均衡的加总条件来求解价格和工资。`o` 国收入为 `Y[o] = w[o]*L[o]`（其中 `L[o]` 是劳动力供给），在一般均衡中，它必须等于产出，因此工资必须调整以满足\
  \ $Y_{o} = \\sum_{d = 1}^{R}V_{od}$。因此：\n\n$$Y_{o} = \\left( {w_{o}a_{o}} \\right)^{1\
  \ - \\sigma}\\sum\\limits_{d = 1}^{R}\\left( \\tau_{od}^{1 - \\sigma}\\frac{E_{d}}{P_{d}^{1\
  \ - \\sigma}}} \\right)$$  \n\n求出 `o` 国的服务价格，我们得到：\n\n$$p_{od}^{1 - \\sigma} = \\\
  frac{Y_{o}}{\\Omega_{o}},where\\{~~}\\Omega_{o} \\equiv \\sum\\limits_{k = 1}^{R}\\\
  left( \\tau_{kd}^{1 - \\sigma}\\frac{E_{d}}{P_{d}^{1 - \\sigma}}} \\right)$$  \n\
  \n这里 `Ω[o]` 是市场准入的衡量；Omega 是“开放度”的记忆，因为它衡量了 `o` 国对世界市场的开放程度。\n\n将解代入 `V[od]` 的表达式是最后一步。它得出了外包的初步引力方程：\n\
  \n$$V_{od} = \\tau_{od}^{1 - \\sigma}\\left( \\frac{Y_{o}}{\\Omega_{o}} \\right)$$\
  \  \n\n因此，`Y[o]` 是原产国远程工的总劳动力收入，`E[d]` 是目的国对劳动力工作的支出。这可以用对数形式进行估计。\n\n## 4 量化服务贸易的潜在增长\n\
  \n数字通信技术的快速进步（Baldwin 2019）和新冠疫情引发的长期远程办公实验（Dingel and Neiman 2021）相结合，可能会显著降低服务贸易相对于物理接近性的重要性。我们使用引力回归来说如果物理距离变得不那么重要，服务贸易的空间，并讨论与贸易国家文化、语言和社交差异相关的摩擦。\n\
  \n遗憾的是，服务贸易数据相对于商品贸易数据相当粗糙——与 Blinder (2007) 和 Dingel and Neiman (2020) 使用以及图 6.2\
  \ 至 6.4 显示的职业级数据相比，极其粗糙。这些数据中有 800 多个不同的 6 位代码职业。国际工组织提供了 80 多个国家 40 个不同的 2 位代码职业组的人口统计。相比之下，双边服务贸易流量仅报告了十少数大类服务。Head、Mayer\
  \ 和 Ries (2009) 仅报告了四类服务贸易的估计值。\n\n\n\n\n使用报告的服务贸易流量的优势在于，它允许人们评估国际业务摩擦的作用，而无需为相关的经济体构建模型。如前所述，这些体已包含在进口年份和出口年份的固定效应中。语言、文化和物理接近性差异产生的影响，是通过不同国家对之间服务贸易的变化来估计的。\n\
  \n### 4.1 数据\n\n我们使用了 Head, Mayer 和 Ries (2009)——以下简称 `HMR`——发表其研究以来发布的数据来估计引力服务回归。我们使用了`OECD-WTO\
  \ 服务贸易平衡数据集 (BaTIS)` 报告的 2005–2019 年 12 个服务部门的贸易流量，以及上一版 `BaTIS` 报告的 1995–2006 年\
  \ 11 个服务部门的流量（Fortanier et al. 2017; Liberatore and Wettstein 2021）。与 `HMR` 使用的数据形成鲜对比的是，这些服务贸易数据集报告的零值非常。\n\
  \n虽然人们可以将阻碍国际服务贸易的摩擦估计值与可远程任务的潜在职业级需求代理变量相结合，但此处我们仅限于讨论与引力回归估计弹性相关的直接影响。\n\n###\
  \ 4.2 服务贸易双边摩擦的引力估计\n\n`Table 6.2` 显示了我们对总服务的结论。前五列针对 1995–2006 年期间（对应原始的 `HMR`\
  \ 时期）。考虑到他们先的发现，点估计值的符号和幅度都是合理的。与 `HMR` 类似，我们发现距离具有很大的负系数，且该系数比通常在货物贸易中发现的更负。鉴于总服务数据是各种现象的杂烩——从机机票、在线游戏到管道费用和呼叫中心——很难刻画双边距离可能扮演的所有角色。对于与物理实体运输联系较少的服务贸易来说，距离的影响可能更为重要似乎是违反直觉的。然而，总服务包含了许多流量，对于这些流量，面对面的互动对于建立、维护或运营国际交换可能非常重要。例如，分服务、旅游、运输和金融服务都是主要的服务类别，可能需要经理和专家在不同设施之间移动。时差、共同语言、殖民联系和共同法律起源的系数在全样本中都是显著的。\n\
