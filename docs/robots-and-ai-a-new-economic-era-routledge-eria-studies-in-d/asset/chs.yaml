  \ 和 CEPR\n\n**Ioannis Papadakis**，伦敦玛丽大学\n\n**Bob Rijkers**，世界银行\n\n**孙锐奇**，清华大学\n\
  \n**杉田洋一**，一桥大学\n\n**Daniel Trefler**，多伦多大学、CIFAR 和 NBER\n\n**张瑞**，奥斯尔赫斯大学\n\n#\
  \ 致谢\n\n感谢我们的同事 Robert Feenstra、Nina Pavcnik、Pascual Restrepo、Thomas Sampson 和 Chris\
  \ Tonetti，他们对机器人和人工智能如何重塑生产力、贸易、就业和世界经济提供了深刻见解。Daron Acemoglu、Chatib Basri、Haroon\
  \ Bhorat、陈鲁龙、木村福、林毅夫、西村秀俊、Martin Richardson、Dani Rodrik、Joseph Stiglitz 和浦田寿吾丰富了关于机器人和人工智能背景下我们经济未来的更广泛讨论。David\
  \ Christian 和 Ivana Markus 提供了卓越的研究协助。特别感谢我们的编辑经理 Denise File 和 Fadriani Trianingsih，以及提供了慷慨项目援助的\
  \ Catherin Nur Safitri。\n\n我们将这本书献给我们的孩子、学生以及后代，他们将与机器人和人工智能共同生活，并致力于创造这些技术的最优水平。\n\
  \n## 1 引言\n\n殷彦丽丽和 Gene M. Grossman\n\nDOI: [10.4324/9781003275534-1](https://doi.org/10.4324/9781003275534-1)\n\
  \n本书由人类编写和编辑。\n\n但很快，许多书籍、商品和服务将将由依赖于人工智能的工业机器人进行生产、运营和支持。\n\n在过去的三个世纪里，我们见证了各种技术进步，这些进步彻底改变了生产方法、商业组织以及人们工作和生活的方式。范式创新包括蒸汽机、电动机、数字计算机以及一系列属于信息与通信技术\
  \ (ICT) 范畴的产品和服务。\n\n近期，我们看到工业机器人可用性取得了显著进展。Devol 被认为发明了第一台机器人。1961 年，`Unimate`\
  \ 被安装在 `General Motors`。20 世纪 50 年代，`Unimate` 被用在 `Ewing`。1967 年，`Unimate` 被 `Svenska`\
  \ 使用。20 世纪 00 年代，`Unimate` 被 `Hyundai` 使用。1972 年，`Unimate` 被 `Nissan` 使用。1985 年，`Unimate`\
  \ 被 `Taiwan` 使用。2012 年，`Unimate` 被 `Japan` 使用。2019 年，`Unimate` 被 `China` 使用。\n\n\
  全球工业机器人的年数量从 2012 到 2019 年增加了一倍多，达到 373,240 台。全球机器人存量从 2009 年的 100 万增加到 2019 年的\
  \ 270 万。汽车和电子行业仍然是工业机器人的两大主要用户，合计占 2019 年新销售额的 59%。投资的快速增长无疑反映了价格的急剧下降；2005 年至 2017\
  \ 年间，工业机器人的平均成本下降了 60%以上，从 68,659 美元降至 27,074 美元。预计到 2025 年价格还将下降至 1.1 万美元以下。其他因素（如机器人功能和灵活性的增强、易用性和接口的改进以及对机器人技术潜在应用意识的提高）共同推动了全球性的增长。\n\
  \n人工智能的研究始于 1956 年的达特茅学院。教科书将 AI 定义为一种感知环境并采取行动以最大化实现目标概率的非人类系统。更通俗地说，AI 这一术语用于描述模拟人类认知功能的计算，例如“学习”或“解决问题”。许多人工智能驱动的机器在几项直觉和无意识心理任务方面已经达到人类甚至优于人类，因为它们可以在涉及感知、移动和模式识别的任务中模拟人类的思维。\n\
  \n\n\n\n\n全球对 AI 的企业投资增长了近六倍，从 2015 年的 127 亿美元增加到 2020 年的高达 679 亿美元。美国和中国在 AI 投资方面占据主导地位，2015\
  \ 年至 2020 年期间两者的合计贡献占了 76%。但全球对 AI 相关技术的需求正在不断增长。巴西、印度、加拿大、新加坡和南非在 2016 年至 2020\
  \ 年间的 AI 相关招聘人数增长率最高（斯坦福大学，2021 年）。\n\n## 工业机器人与 AI 的经济效益与成本\n\n技术进步推动经济增长。工业机器人，尤其是应用了人工智能的机器人，或许为现代工业时代提供了技术改进和生产力提升的最广阔的空间。机器人可以提高工业流程的速度和精确度，同时使其更加安全、可靠。它们可以利用工人的时间，让人类能够从事更具概念性和人际互动性质的任务。AI\
  \ 可以用于增强消费者可用产品的质量和多样性，提供新形式的娱乐，并为紧迫的医疗和环境问题提供解决方案。显然，机器人和 AI 提高生活质量的潜力是巨大的。\n\n\
  与此同时，新技术几乎总是会带来意想不到的后果。武装了 AI 的工业机器人将接管生产中的一系列任务，从而取代劳动力市场中的工人。执行那些可以由机器人更高效完成的任务的工人可能会面临工资下降和更换工作的需要。工作流失往往会导致自尊心丧失并产生重大的经济和社会调整成本。此外，在不同技能群体的命运出现分化一段时间后，工业机器人威胁要加剧收入不平等，而\
  \ AI 则引发了人们对个人隐私的担忧，甚至可能更糟。\n\n机器人和 AI 带来的巨大生产力增长潜力，加之其对不同技能工人产生的深远且极不均衡的影响，使其成为经济研究的热门课题。经济学家们一直渴望理解，那些在执行某些任务时直接替代人类的技术，对收入分配和工人福利的影响可能与早期的技术改进大不，而早期改进大多与劳动力具有互补性。\n\
  \n## 机器人与 AI：生产力与贸易\n\n早期关于工业机器人和 AI 效益的研究强调了两个潜在收益来源。首先，这些技术进步降低了生产和运营成本。机器人执行许多任务的速度比人类更快，且具有更高的精确准确度。AI\
  \ 可以用于预测生产线上的问题，并将计算作为生产的投入。例如，Agrawal 等（2019）、Atkinson 和 Ezell（2019）以及 Varian（2019）研究了使用\
  \ AI 和机器人带来的潜在生产力增长，以及与之相关的总生产成本下降。其次，或许不那么明显的是，工业机器人和 AI 可以帮助市场运行得更高效。AI 可以用于学习人类偏好，将货物和服务从最易于获得的地方分配到需要的地方，从而提高物流和交付的效率。AI\
  \ 的这些潜在效益在 Parkes 和 Wellman（2015）、Atkinson（2019）、Milgrom 和 Tadelis（2019）、Davenport\
  \ 等（2019）以及麦肯锡公司（2019）近期的工作中得到了广泛关注。\n\n此前的研究发现，在企业层面和宏观层面，应用工业机器人和 AI 在微观和整体上都带来了巨大的生产力增长和显著的降价效应。具有此类发现的代表性论文包括\
  \ Acemoglu 和 Restrepo（2018）、Autor 和 Salamons（2018）、Graetz 和 Michaels（2018）、Agrawal\
  \ 等（2019）、Koch 等（2019）以及 Acemoglu 等（2020）。一些作者还发现工业机器人和 AI 促进了国际贸易。例如，Brynjolfsson\
  \ 等（2019）报告说，数字交易平台上一个提供自动翻译服务的 AI 应用使出口增加了 17%。Goldfarb 和 Trefler（2019）解释了工业机器人和\
  \ AI 如何不仅促进货物贸易，还能促进服务贸易。\n\n## 机器人与 AI：就业与工资\n\n最近的研究还关注自动化和 AI 对就业和工资带来的令人担忧的后果，特别是对于执行常规性任务的低技能工人。根据现有文献，Baldwin（2019）报告说，在几十年内，十份工作中有一到六份面临被取代的风险。估计值因方法而异，但结果从芬兰的\
  \ 36%（Pajarinen 和 Rouvinen，2014）、德国的 47%（Brzeski 和 Burk，2015）以及美国的 47%（Frey 和 Osborne，2017），到全球范围内高达\
  \ 60%（Bughin 等，2017）。\n\n自动化和 AI 可能对劳动力市场产生异质影响。高技能工人、在技术密集型部门工作的工人以及执行非常规任务的工人可能会从工业机器人利用其生产力中获益。教育程度较低的工人，特别是那些在生产线上从事体力操作任务的工人，风险最高；例如\
  \ Autor 等（2015）、Graetz 和 Michels（2018）、Humlum（2019）、Furman 和 Seamans（2019）、Stemmler（2019）、Cheng\
  \ 等（2019）、Acemoglu 和 Restrepo（2020）以及 Barth 等（2020）。智能工厂的高度数字化和先进机器人可能会降低劳动成本在决定竞争优势中的重要性，而强调技能、互补服务以及企业生态系统的其他方面（Hallward-Driermeier\
  \ 等，2017）。\n\n然而，最近的研究还认为，采用自动化和 AI 带来的企业生产力增长可能会扩大需求（Autor 和 Salamons，2018；Bessen，2018），这反过来可能通过企业在其他地方扩张或创造新的任务和职业来增强需求（Autor\
  \ 和 Salamons，2018；Acemoglu 和 Restrepo，2019；Dauth 等，2021；Koch 等，2019；Autor 等，2020）。\n\
  \nBaldwin（2019）强调，劳动力市场研究不仅要关注工作（jobs），还要关注职业（occupations）。机器取代工作会产生调整成本，因为工人需要在企业内部移动以执行不同的任务，或者在不同的企业或扩张的行业中寻找新工作。但大多数职业既执行非常规任务也执行常规任务，因此中期前景可能并不那么悲观，因为工人会将注意力转移到机器无法执行的任务。最近的研究越来越多地采用基于任务的方法来估计工业机器人和\
  \ AI 对劳动力市场的影响，这些研究通常比关注流失的研究预测的结果更乐观。例如，Arntz 等（2016）使用基于任务的方法估计，OECD 国家只有 9%的职业极易受到自动化的影响。\n\
  \n\n\n\n关于工业机器人和人工智能的持续进步对劳动力市场某些分领域的净影响，研究结果尚不不一，但对其分配影响的观点几乎没有分歧。自动化无疑导致了国民收入中劳动份额的下降；参见\
  \ Grossman 和 Oberfield (2022, 即将) 的综述。在工人中，人力资本与新技术互补性最高的高技能工人，其收益将必然高于那些将工业机器人视为替代品的低技能工人；参见\
  \ Autor 等人 (2015)、Arntz 等人 (2016)、Graetz 和 Michaels (2018)、Bessen 等人 (2019)、Stemmler\
  \ (2019)、Cheng 等人 (2019)、Gregory 等人 (2019) 以及 Acemoglu 和 Restrepo (2020)。人工智能将创造的新职业和任务也可能倾向于于劳动力中技能更高、受教育程度更优的成员（Tirole,\
  \ 2017; Acemoglu and Restrepo, 2018; Stemmler, 2019; Barth et al., 2020; Dauth et\
  \ al., 2021）。这些新技术对收入分配的可能影响，紧随二十多年工资分化之后出现，并威胁到进一步加剧由这种差距扩大已经引发的社会紧张局势。\n\n## 本书\n\
  \n尽管文献活跃且蓬勃发展，但关于持续自动化和人工智能进一步发展的经济影响，仍有许多之处未为人知。这些创新将如何影响不同发展水平的国家以及国家内部不同的地区？未来的职业是什么？政策如何才能让社会应对这些预期的技术变化？技术发展将如何影响世界合作与贸易，例如通过影响全球价值链的组织？\n\
  \n本书为这一持续的研究与学习项目做出贡献。本书的贡献者对现有文献进行了总结并从中汲取教训，同时对其进行了扩展并引向新的方向。本书的章节在主题、地理覆盖以及方法论（无论是理论的还是经验的、结构性的还是约简的形式）方面各不相同。然而，它们共同拥有一个信念：严谨的经济研究可以帮助我们应对一个不确定的、对某些人来说令人畏惧的未来。\n\
  \n本书分为两部分。前六章（第 2 章–第 7 章）主要考察自动化和人工智能对劳动力市场的影响。它们分析了在不同职业、不同国家和地区，这些新技术的采用将如何影响工人。这里的重点是就业、工资和工人福利。最后三章（第\
  \ 8 章–第 10 章）更多地关注生产力和贸易，试图衡量发达和发展中国家机器人和人工智能技术进步在这些维度上的可能收益。\n\n由 Aghion、Antonin、Bunel\
  \ 和 Jaravel 写的第 2 章综述了关于自动化对劳动需求影响的近期文献。他们描述了关于自动化影响的两种观点。在悲悲观观点中，机器人主要在任务层面替代劳动。那么，自动化的直接影响是减少采用机器人的企业的劳动需求，从而对均衡工资产生向下压力。这种直接影响在一般均衡中可能会被工资下降所抵消，工资下降会引导非自动化企业雇佣更多劳动力。（注：此处根据指令，由于原始文本中存在重复描述，排版已保留核心逻辑）\n\
  \nAghion 等人指出，虽然基于行业和劳动力市场的证据尚不不一，但使用企业级数据的较新研究支持对自动化的更乐观的观点。大多数使用企业级数据的研究并未发现自动化企业中存在工资下降的证据，甚至没有发现劳动份额的下降。关于人工智能，他们引用了\
  \ Babina 等人 (2020)，该研究发现投资人工智能的企业经历了更快的销售和就业增长。\n\n最后，Aghion 等人报告了他们利用法国企业级数据进行的工作。在他们的数据中，使用总就业人数的估计在宏观层面几乎没有对负面观的支持。当他们深入到工厂层面时，自动化的提高生产效应似乎是显而易见的。自动化的企业获得了市场份额并实现了更大规模生产。他们也没有发现证据表明自动化增加了自动化企业高技能工人相对于低技能工人的工资。此外，他们报告了即使在行业层面，自动化对就业也有整体积极影响。\n\
  \n在第 3 章中，Bonfiglioli、Crinò、Gancia 和 Papadakis 开发了一个简单但具有启发性的模型，突出了自动化与外包之间的相互作用。在模型中，工业机器人可能会接手由国内工人执行的任务，但在外包的情况下，它们可能会取代外国工人。这种区分对于自动化的工资和福利效应至关重要。在自给自足的状态下，机器人必须取代国内工人。那么，在执行某些任务时用机器人替代国内劳动会产生生产效应和资本深化效应，倾向于提高国内工资，但也会产生对工资相反影响的替代效应。在外包的情况下，如果机器人取代了国内工人，则会产生额外的贸易条件，对国内工人的福利产生不利影响。在自给自足本可以获益的情况下，国内工人可能会遭受自动化的损害。相比之下，如果机器人取代外国工人并因此将部分生产带回国内，自动化对国内工人始终是有利的。\n\
  \n受这些理论发现的启发，作者研究了 1990 年至 2015 年工业机器人进口对美国当地劳动力市场的影响。通过`shift-share`（份额分解）分析，他们估计进口机器人取代了当地工人，但由于积极的生产效应提升了国内工资（与第\
  \ 2 章报告的 Aghion 等人的发现一致）。接下来，他们调查了当地劳动力市场影响与外包之间的关系。他们证明，面临机器人取代风险的职业其任务内容与被认为可外包的职业相似。他们还发现，在可外包的职业中，自动化的负面就业影响比那些不易转移海外的职业要弱。最后，他们证明了——与他们的理论结果一致——外包暴露程度较高的通勤区，其机器人进口导致的职位流失低于暴露程度较低的通勤区。\n\
  \n\n\n\n# 第 4 章 由 Faia, Laffitte, Mayer 和 Ottaviano 编写，指自动化对就业和工资另一个可能的负面影响，并强调了自动化与离外包之间的区别。他们引用了\
  \ Bainbridge (1983) 描述的“自动化悖论”，模拟了这样一种观点：自动化通常要求高效完成互补任务，而这些任务只有具有专业人类人力资本的工人才能完成。因此，自动化可能导致工人专业化程度提高，他们不仅需要\
  \ `more` 技能，还需要 `particular` 技能。Faia 等人将新技术要求工人具备“核心竞争力”领域专业知识的这种可能性，称为“核心偏向型技术变革”。\n\
  \n如果自动化悖论在起作用，那么企业在投资工业机器人时，其招聘实践应该变得更具选择性。随着搜索和选择性的增强，失业的持续时间可能会变长，而工人技能与企业任务之间的错配将有所减少。作者利用\
  \ 1995 年至 2010 年期间欧洲职业和行业的数据验证了这些预测，发现自动化导致了更高的技能集中度、下流工人更长的失业期，以及企业与工人之间更少的教育错配。有趣的是，在离外包可能性较高的行业，选择性反而下降了。他们在一个模型中对这些发现进行了合理解释：自动化强化了工人技能与企业任务之间同类匹配的力量，而离外包恰恰相反。\n\
  \n# 第 5 章 Furusawa, Kusaka 和 Sugita 还研究了工业机器人改进的影响，同时将 AI 的进步视为一项独立的技术发展。他们假设工业机器人执行低技能工人本应执行的手工任务，而\
  \ AI 则在执行更具概念性的任务时替代高技能劳动力。通过对涵盖 17 个行业和 50 个国家的基于任务生产的定量一般均衡模型（该模型包含了投入产关系和全球价值链），他们模拟了贸易成本和机器人技术保持在\
  \ 1993 年水平的反事实历史。他们发现，机器人技术的进步确实导致某些国家非熟练工人工资下降，但与贸易成本下降相比，其对劳动力市场的影响有限。同时，机器人产生的生产率提高惠了其他某些国家的工人。当他们模拟机器人和\
  \ AI 生产率进一步增加十倍的影响时，发现前者的劳动力市场影响远大于后者，很大程度上是因为 AI 与高技能劳动力之间的估计替代弹性远小于机器人与低技能劳动力之间的替代弹性。仅在德国和日本，他们发现\
  \ AI 技术进步产生了显著影响，这两个是 AI 任务占比相对较大的国家。最后，他们预测机器人技术的进步将增加大多数国家的工资不平等，而 AI 技术的进步对工资不平等将产生相反的影响。\n\
  \n# 第 6 章 Baldwin 和 Dingel 提出了一个相当不同的问题。利用近期关于新冠肺炎引发的远程办公的研究，他们问到：新产生的远程工作中有多少可能移向海外，以及这种“远程迁移”（telemigration）在发展过程中有多重要。评估远程迁移的前景不仅需要估计有多少工作潜在可以离外包，还需要估计居住国外的工人中有多少人具备执行这些任务的相关技能，以及这些外国工人对于其国内对应者的可替代性。为了解决这些问题，他们估计了一个远程迁移引力模型，其中进口国可以远程执行的工作总数充当\
  \ `importer mass`；出口国合适工人的人口充当 `exporter mass`；而 Ghemawat (2007) 的文化、行政、地理和经济（`CAGE`）距离衡量标准捕捉了双边贸易摩擦。\n\
  \n利用他们对引力方程的估计，他们模拟了进一步减少障碍的影响。基准模拟假设贸易成本的弹性为常数，那么进一步的自由化可能产生有限的影响，因为初始流量相当小。在一个推测性的最后章节中，作者放宽贸易弹性为常数的假设，而是考虑了新兴国家作为任务指数函数的相对生产率最初急剧上升随后平缓的可能性。换句话说，他们假设南方在已执行任务中的显性比较优势与其潜性比较优势具有不同的形状。在这种情况下，服务贸易成本的微小变化对远程迁移的范围可能产生巨大的影响。\n\
  \n# 在第 7 章中，Hanson 研究了引导全美 AI 相关活动布局的力量。Hanson 首先通过人口普查职业名称中出现的关键词识别了 AI 相关工作。然后，使用\
  \ `Lin (2011)` 提出的方法，通过将 AI 相关职业的就业增长与自 1990 年以来这些职业中新增的名称占比进行加权，估计了 AI 相关工作的区域性增长。他发现，总体而言，AI\
  \ 相关活动的区域专业化模式与 ICT（信息与通信技术）的相似。然而，该行业内的外国出生和本土出生工人倾向于聚集在不同地点。外国出生工在 AI 相关工作的专业化在私营部门就业占主导的高科技中心最强，而本土出生工在\
  \ AI 相关工作的专业化在军事和太空相关研究中心最强。\n\n他接着调查了驱动 AI 相关工作区域就业增长的因素。他将通勤区 AI 职业就业份额的变化与预测的当地受过教育移民增加联系起来，其中预测是基于每个原籍国受过教育移民的全国增长率，以及移民按国籍在各通勤区的初始分布。他发现，自\
  \ 2000 年以来外国出生工人供应的增长可以解释 AI 相关职业区域就业的大部分增长。受过教育移民的流入对本土工人的就业增长几乎没有影响，这表明可能发生的替代作用被互补性所抵消了。总而言之，本章结果强调了移民政策对\
  \ AI 活动持续技术进步的重要性。\n\n\n\n\n\n# 第 8 章\n\nArtuc, Bastos, Copestake 和 Rijkers 探讨了发达国家工业机器人的安装如何影响与发展中国家的贸易。正如\
  \ Bonfiglioli 等人在第 3 章中建议的那样，机器人可能会在外包到低工资国家的任务中替代低技能工人。此外，如果自动化降低了低劳动力成本作为国际竞争力来源的重要性，那么低收入国家可能缺乏深度参与新兴全球价值链所需的技能和基础设施。受这些担忧的驱动，本章作者调查了自动化对发展中国家的贸易参与度及贸易模式可能产生了什么影响。是否有证据表明，发达国家工业机器人使用率的增加减少了发展中国家的出口机会？\n\
  \n作者首先构建并校准了一个多部门、多国家的两阶段生产和贸易模型，在模型中，机器人可以接管每个部门中某些（可能与之不同的）任务范围。他们模拟了机器人价格的下降，同时保持机器人可以执行的任务范围不变。意不意外的是，这导致北方的工业安装了更多机器人。但他们发现，在机器人化程度最高的部门，从南方到北方的出口反而扩大了。这一反直觉的发现反映了机器人提高了北方的生产率，因此生产规模扩大，反过来扩大了对南方生产的中间品的需求。作者将他们的模型扩展，并将中国作为一个独立的国家，并指出其机器人存量的增长比其他发展中国家更多。他们研究了中国政府对机器人投资的支持，并发现这些支持可能会根据补贴的大小增加或减少中国的工资。随着中国促使了更多机器人的安装，其贸易模式开始类似于北方，这减少了其与这些国家的贸易，并扩大了其与南方国家的贸易。\n\
  \n# 第 9 章\n\n在第 9 章中，Ing 和 Zhang 在非常详细的水平上研究了发展中国家的自动化问题。他们关注印尼西亚的企业，使用了 2008 年至\
  \ 2012 年生产和贸易的产品级数据。由于印尼西亚使用的工业机器人绝大部分是进口的，且由于其企业级数据报告了此类资本品的进口情况，Ing 和 Zhang 拥有一个极佳的企业级机器人投资衡量指标。\n\
  \nIng 和 Zhang 研究了印尼西亚进口工业机器人的企业特征以及此类企业的随后的表现。进口机器人的企业比其他企业生产更高，支付给劳动的收入份额较低，但工资更高。在五年的期间，实现自动化的企业实现了产出的更大增长、就业的更大增长以及更大的出口份额。它们还生产了质量更高的商品。在印尼西亚，自动化与更高质量相关，这与\
  \ Aghion 等人的发现相似。Ing 和 Zhang 用一个异质企业模型解释了他们的发现，即这些企业通过选择机器人机器人投资来实现利润和招聘的最大化。\n\n\
  # 第 10 章\n\n在第 10 章中，Sun 和 Trefler 研究了 AI 贸易。特别是，他们研究了移动应用程序，使用了一份关于 2014-2020 年部署的新型数据集。考虑到部署是内生性的，他们通过将国家\
  \ AI 专业知识的指标与应用程序 AI 密度的指标相互作用，构建了一个工具变量。这项分析涉及对各种结果对 AI 部署进行回归分析。\n\n当作者估计下载量的引力方程时，他们发现更大程度的部署导致进口-出口配对水平上的下载量增加了六倍。部署引发了高水平的创造性破坏，即进口国中应用类型的进入和退出。最后，AI\
  \ 部署产生了贸易收益；估计 2020 年通过下载获得的消费者福利比没有部署的反事实情况高出 2.5%。\n\n# 总结\n\n总而言，书中报告的研究描绘了关于工业机器人和人工智能未来相对乐观的图景。这些研究提供了进一步证据，表明工业机器人和\
  \ AI 的提高了生产率并降低了成本。尽管这些技术在某些任务中确实替代了相对低技能的劳动力，但引发的生产率提高和随之而来的产扩张抵消了对低工资工人的直接负面影响。自动化和\
  \ AI 可以促进全球价值链中更大的国际分工，并像所有新技术一样，将产生必须由政策制定者管理的调整成本。但从本书和其他地方的研究来看，总体上机器人和 AI 领域的未来技术发展应该受到欢迎，而不是受到抑制。随着机器人和\
  \ AI 的发展，我们的责任确保它们是以人为本的，并为了改善人类福祉而设计。\n\n## 参考文献\n\n- Acemoglu, Daron, Claire LeLarge,\
