  \ CZ 和每个年份的就业结构决定。 |\n\n| --- |\n\n## 4 实证分析\n\n在本节中，我们将介绍计量经济学分析的结果。首先，我们讨论了机器人暴露对跨\
  \ CZ 劳动力市场结果的平均影响。然后，我们利用职业、行业和空间上的变异，提供了关于自动化与外包之间关系的新颖证据。在这些证据的基础上，我们最后重新审视了机器人暴露的平均就业影响，并根据对外包暴露程度不同的职业和\
  \ CZ 对这些影响进行了拆解。\n\n### 4.1 平均效应\n\n为了研究机器人暴露如何影响跨 CZ 的劳动力市场结果，我们基于 Autor, Dorn\
  \ and Hanson (2013) 以及 Acemoglu and Restrepo (2019) 的研究，并估计了如下形式的模型：\n\n```latex\n\
  \\begin{array}{r} {\\Delta Y_{ct} = \\alpha_{s} + \\alpha_{t} + \\beta \\cdot \\\
  Delta Robots_{ct} + \\mathbf{X}_{ct}^{}^{’}} \\cdot \\gamma + \\varepsilon_{ct},}\
  \ \\\\ \\end{array}\n```\n\n(15)\n\n其中 `ΔY[ct]` 是 CZ `c` 在时期 `t` 内结果 `Y` 的变化；`α[s]`\
  \ 和 `α[t]` 分别是美国州和时期的固定效应；`ΔRobots[ct]` 是我们对 CZ 级进口机器人暴露的衡量；`X[ct]` 是 CZ 其他可观测特征的控制变量向量（见后文）；`ε[ct]`\
  \ 是误差项。\n\n我们通过堆叠四个时间段的十年等效一阶差来估计 `eq. (15)`：1990–2000、2000–2005、2005–2010 和 2010–2015。州固定效应控制了不同州劳动力市场结果的异质性趋势，而年份固定效应吸收了所有\
  \ CZ 中共同冲击。控制变量 `X[ct]` 包括以下 CZ 特征的期初代理变量：规模（对数就业人数）、劳动力的人口组成（女性、外出生和受过大学教育者的就业份额）以及经济活动的组成（常规密集型职业工人的就业份额）。`X[ct]`\
  \ 还包括时期 `t` 内发生在 CZ `c` 的其他冲击的代理变量，即出口冲击以及来自中国和其他其他国家的进口竞争冲击。这些变量控制了与机器人进口同时发生的贸易、技术和需求变化。结果包含就业。面板\
  \ a 报告了 OLS 估计值，面板 b 报告了 2SLS 估计值。为了研究协变量如何影响机器人暴露的影响，我们首先给出仅包含州和年份固定效应的简略模型结果（第\
  \ 1–3 列），然后添加控制变量（第 4–6 列）。我们对三种不同的结果估计了 `eq. (15)`。第一个用于第 (1) 和 (4) 列，是总就业人数占人口比例的变化。另外两个结果分别用于第\
  \ (2)、(5) 列以及第 (3)、(6) 列，分别是制造业和非制造业就业人数占人口比例的变化。由于总就业人数是制造业和非制造业就业人数之和，OLS 和 2SLS\
  \ 等线性估计量的性质意味着第 (2) 和 (3) 列中 `β` 的估计值之和等于第 (1) 列的估计值；同样，第 (5) 和 (6) 列所示的 `β` 估计值之和等于第\
  \ (4) 列的估计值。这为我们提供了一种将机器人暴露对制造业和其他部门的就业影响直接分解的方法。\n\n### 表 3.2 机器人暴露与就业\n\n| (1)\
