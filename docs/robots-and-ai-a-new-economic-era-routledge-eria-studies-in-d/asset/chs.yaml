  Alessandra Bonfiglioli, Rosario Crinò, Gino Gancia 和 Ioannis Papadakis\nDOI: `10.4324/9781003275534-3`\n\
  \n## 1 引言\n\n生产的性质和组织正在经历彻底的变革。机器人技术的进步使得自动化被应用于此前由工人执行的任务。与此同时，通信技术的改进导致公司将生产阶段外包到低工资国家。这两个现象对发达经济体产生了深远影响。尽管它们被认为能提高生产力和降低成本，但往往被归咎于制造业就业的下降和实际工资的停滞（例如\
  \ Baldwin, 2019）。最近一个新假设引起了关注：在发达国家更普遍的自动化可以增强竞争力，并带回此前外迁到低工资国家的工作。这种“回流”过程的案例开始出现在商业文献中。然而，其范围、原因和后果在程度上未知。\n\
  \n在本章中，我们从发达国家的角度研究自动化与外包之间的相互作用。从理论角度，我们展示了外包如何改变自动化的福利效应。特别是如果机器人替代的是进口任务，自动化对国内工人总是有益的。然而，如果机器人替代的是本土生产的任务，自动化可能会损害采用国人的福利，即使在自给状态下它是改善福利的。这些结果强调了识别哪些工人与机器人有直接竞争的重要性。因此，我们转向美国跨行业、职业和当地劳动力市场的数据，以验证模型的预测并评估哪种情景在经验上更合理。\n\
  \n为了说明我们的理论结果，我们从一个包含标准自动化效应简单任务生产模型开始。在自给状态下，用更廉的机器人替代劳动力具有生产力效应、资本深化效应和替代效应。虽然前两个效应会提高福利，但如果机器人资本的供给足够弹性，负面效应总是会被后者所主导。\n\
  \n\n\n\n\n在本章的第二部分，我们转向了实证分析。最近的轶事证据表明，全球发达国家已开始减少对外部输入的依赖。例如，全球最大的零售商 `Walmart`（2016）启动了“美国制造业就业门户”网站，作为更广泛的“投资美国就业”倡议的一部分，旨在将制造业带回美国。COVID-19\
  \ 疫情通过促进自动化和促使政府旨在提高战略部门的自给自足，加速了这一趋势。然而，关于“制造业回流”（`reshoring`，定义为外包增长的减少，这种减少甚至转为负）的系统性证据仍然匮乏。\n\
  \n受我们模型的启发，我们研究了 1990 年至 2015 年工业自动化对美国当地劳动力市场的影响，以及它与外包的关系。为了衡量自动化和外包，我们分别使用了美国进口工业机器人和中间投入的高质量贸易数据，并使用详细的\
  \ `Import Matrices` 将其分配到各个行业。然后，我们根据就业的行业组成，将这些指标投影到 722 个美国通勤区。我们进一步利用欧洲 11 个国家观察到的类似变化，对美国工业机器人进口的变化进行工具变量处理。通过这些数据，我们发现机器人进口降低了制造业的就业。由于制造业是自动化集中的部门，这一证据表明，平均而言，机器人取代了美国工人。然而，我们也发现机器人对工资有积极影响（尽管并不总是显著），这与机器人提高劳动力生产率的假设一致。\n\
  \n接下来，我们探讨了这些影响如何依赖于外包。为此，我们首先证明了面临自动化风险的职业（简称为“可替代的”）与被归类为“可外包的”的职业其任务内容往往相似。\n\
  \n本章对相关文献做出了多项贡献。首先，从理论角度来看，它表明在存在外包的情况下，自动化的福利效应可能大不相同。为此，它将自动化模型（如 `Zeira, 1998`、`Acemoglu\
  \ and Restrepo, 2019`、`Hemous and Olsen, 2020`）与外包模型（如 `Grossman and Rossi-Hansberg,\
  \ 2008`、`Rodriguez-Clare, 2010`、`Acemoglu, Gancia and Zilibotti, 2015`）相结合。文献表明，这两种现象都可能产生模糊的福利效应，因为倾向于惠及所有人的“生产率效应”与倾向于对机器人或进口竞争的工人产生负面影响的“替代效应”之间存在张。然而，本章强调了自动化和外包之间的两个重要区别：第一，它们可能影响不同的工人；第二，与外国劳动力不同，机器人是可以复制的。这两个特征的结合产生了贸易条件效应，这可以改变自动化的福利效应。`Artuc,\
  \ Bastos and Rijkers (2018)`、`Krenz, Prettner and Strulik (2018)` 以及 `Furusawa and\
  \ Sugita (2021)` 也开发了自动化和中间投入贸易模型，但它们假设机器人只取代国内劳动力。\n\n其次，本章对自动化识别的实证文献做出了贡献。早期的论文使用`国际机器人联合会`的数据，但这些数据仅涵盖\
  \ 19 个综合部门。考虑到这一高度专业化部门的高度集中性（仅日本和德国就占全球收入的 50%），一些最近的论文转向机器人进口作为自动化的衡量标准。在本章中，我们使用\
  \ `Import Matrices` 来获取指标。\n\n第三，在实证结果方面，本章证实了文献中常见的对制造业的负面影响，但它显示，更容易受到机器人化的美国通勤区，其就业损失集中在不可外包的职位上。这一证据与自动化可能产生替代作用的假设一致。\n\
  \n最后，本章与关于制造业回流的萌芽文献有关。关于这一现象的实证证据尚无定论。例如，`Hallward-Driemeier and Nayyar (2019)`\
  \ 和 `De Backer et al. (2016)` 认为回流仅影响极少数国家，而 `Stapleton and Webb (2020)` 显示机器人对西班牙公司的进口和跨国活动产生了积极影响。\n\
  \n本章其余部分的安排如下：在第 2 节（#Ch03.xhtml#sec3_2a），我们建立了一个简单的模型来说明在存在外包的情况下自动化的福利效应。在第 3\
  \ 节（#Ch03.xhtml#sec3_5），我们构建了实证分析中使用的主要变量，并描述了数据中的主要模式。在第 4 节（#Ch03.xhtml#sec3_6），我们展示了计量经济分析的结果。第\
  \ 5 节（#Ch03.xhtml#sec3_7）为结论。\n\n\n\n\n在本节中，我们建立一个简单的双国一般均衡模型，以说明自动化和外包的福利效应.^()\n\
  \n## 2.1 基础设定\n\n世界经济由两个国家组成：北国和南国，分别拥有 `L[n]` 和 `L[s]` 单位工人。存在一种单一的最终品，该品是计价货币且可以自由贸易。生产需要一组任务，这些任务可以由工人或机器人执行。机器人与工人的不同在于，机器人的供给是完全弹性的，且只能执行现有任务的一个子集。具体而言，生产机器人的单位成本是恒定的，我们有时将这种生产要素的内生供给称为“机器人资本”。两个国家的工人在技术能力上不同，南国的劳动力只能在北国可以执行的任务子集中被雇用。任务的生产可以在地理上分离且不产生任何成本。在这一模型中，自动化是用机器人替代任何工人，而外包是用南国的工人替代北国的工人。我们从一个单部门模型开始，但随后会考虑一种推广情况，即在一个部门被取代的工人可能会在另一个部门找到工作。然而，在这两种情况下，我们都允许外包和自动化产生一般均衡效应。\n\
  \n最终品 `Y` 的生产需要测度为单位的任务，这些任务根据柯布-格拉斯函数进行聚合：\n\n$$\\\\begin{array}{r} {\\\\ln Y =\
  \ \\\\int\\_{0}^{1}\\\\ln x\\_{i} di,} \\\\\\\\ \\\\end{array}$$\n\n(1)\n\n其中 `x[i]`\
  \ 是任务 `i` 的产量。我们用 `p[i]` 表示该任务的成本。那么，对每个任务的需求满足：\n\n$$\\\\begin{array}{r} {p\\_{i}x\\\
  _{i} = Y.} \\\\\\\\ \\\\end{array}$$\n\n(2)\n\n对称柯布-格拉斯生产函数使得每个任务获得相同的支出份额。\n\n\
  任务可以由北国的工人（生产率为 `a[n]`，工资为 `w[n]`）、南国的工人（生产率为 `a[s]`，工资为 `w[s]`）或机器人（单位成本为 `r`（计价货币\
  \ `Y`），生产率为 `a[r]`）执行。我们假设 `r < a[r]`，正如我们将会看到的，这保证了在均衡下始终会使用某些机器人。北国的工人可能执行任何任务\
  \ `i \\in [0, 1]`。相比之下，南国的工人只能执行测度为 `λ < 1` 的任务，我们将这些任务称为“可外包的”。最后，机器人只能执行测度为 `κ\
  \ < 1` 的任务，我们将这些任务称为“可替换的”。某些任务既是可外包的又是可替换的。因此，我们定义 `ξ` 为一个可替换任务也是可外包的概率。\n\n我们用\
  \ `m[n]`、`m[s]` 和 `m[r]` 分别表示均衡下由北国工人、南国人和机器人执行的任务测度，并简单地假设不同地点的工人和机器人不能组合生产相同的任务。这意味着\
  \ `m[s] + m[n] + m[r] = 1`。那么，任务 `i` 的成本为：\n\n$$\\\\begin{array}{r} {p\\_{i} = \\\
