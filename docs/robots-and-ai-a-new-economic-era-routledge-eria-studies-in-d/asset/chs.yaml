  \\psi_{2}^{i}}$$\n\n其中包含了第一阶段投入品的价格。\n\n\n\n\n\n-   遵循 Graetz 和 Michaels (2018)，我们通过将国际机器人联合（IFR）记录的机器人应用与美国人口普查中的三位职业名称及描述进行比较，然后利用行业的职业构成汇总到行业层面，以此衡量可替代性。有关实证策略和变量构建的更多细节，请参阅\
  \ Artuc 等人 (2018)。\n\n-   在对中间品与其他商品进行分别回归时，来自南方的进口相应增量分别为 6.8% 和 5.6%（使用广义经济分类（BEC）商品分类）或\
  \ 8.6% 和 4.9%（使用 Schott, 2004 的分类）。\n\n-   具体而言，零部件和组件进口的净增加意味着，机器人化引发的规模效应（即增加了对进口中间品的需求）超过了任何基于机器人化的回流效应（即北方中间品生产商增加机器人使用所带来的替代效应）。\n\
  \n-   我们使用世界投入产数据库（`WIOD`）来校准国际贸易、生产函数和劳动力份额。在基准模拟中，我们使用 2005 年的 `WIOD` 数据来校准初始贸易格局。根据人均收入、机器人密度和数据可用性将国家分为三大类。北方国家组包括比利时、德国、丹麦、芬兰、法国、意大利、荷兰、瑞典和美国。南方国家组包括巴西、中国、印度、印度尼西亚、墨西哥、土耳其和中国台湾。基于这两个分组，我们构建了北方和南方的代表性国家。其他发达国家组是由\
  \ `WIOD` 中可用数据的其他经合组织（OECD）和欧盟国家汇总形成的。该组包括澳大利亚、奥地利、保加利亚、加拿大、捷克、西班牙、英国、希腊、克罗地亚、匈牙利、爱尔兰、葡萄牙、斯洛伐克共和国、波兰、挪威和瑞士。Artuc\
  \ 等人 (2018) 中的各种稳健性检验发现，结果在多种替代分组下在定性上都是稳健的。\n\n-   这种设定适用于在不失可操作性的情况下阐明相关的动态机制。如果我们是在组内进行聚合，而不是通过平均值创建代表性国家，那么北方将占据全球\
  \ GDP 的 50% 以上，世界贸易的大部分发生在北方内部。这种设定将低估南北贸易的重要性，且贸易占 GDP 的份额将变得非常小。为了避免这种聚合偏差，我们转而构建了北方和南方的代表性国家。考虑一个规模相对较大的其他发达国家组也是重要的，因为这使得北方采用机器人相关的竞争优势有可能转化为对其最终制品出口更高的需求。\n\
  \n-   广而言之，机器人价格的下降最初会导致“广义边缘”上人类劳动力的取代，但随后会在“密集边缘”降低成本并提高生产率（Acemoglu and Restrepo,\
  \ 2019）。这种顺序可能有助于解释关于机器人影响的差异实证发现：处于替代阶段的国家（例如，美国 (Acemoglu and Restrepo, 2020)）由于额外的机器人化所经历的工资下降可能比采用过程中更领先的国家（例如，德国\
  \ (Dauth et al., 2021））更大。\n\n-   然而，对于机器人价格的足够下降（图 8A 中大于 85%），南方转而采用机器人，导致工资下降（图\
  \ C），这是由于初始的替代效应。我们特别关注贸易结果，因为它们阐明了对工资和 GDP 影响的各种机制，并因为它们与我们的核心回归密切相关。\n\n-   这种效应在理论上可以驱动生产的“回流”。未来的研究通过更详细的机器人使用数据（即区分用于最终品还是中间品的机器人）也可以区分这些机制。在简化形式的实证中，我们尝试了更大的贸易弹性，并发现对于最终品，替代效应确实超过了规模效应——但仅在极高贸易弹性下（图\
  \ 8A1 中的 B）。\n\n-   具体而言，图 8A1 使用的贸易弹性为 2 和 10，而基准模型使用的是 4。\n\n-   其他关键变量（例如劳动使用、工资、福利）的路径在各种贸易弹性情景下几乎保持不变。\n\
  \n-   具体而言，图 8A2 使用机器人与工人之间的替代弹性为 3，而不是基准模型中的 10。贸易弹性重置为 4。\n\n\n\n\n\n- 有趣的是，Stapleton\
  \ 和 Webb (2020) 阐明了我们模型中相反力量在公司层面的对应关系，发现公司层面的顺序对于机器人化对外包的净影响至关重要。对于尚未外包任何生产的企业，机器人化仅仅允许他们进行扩张，从而导致他们开始新的外包。相比之下，对于已经外包部分生产的企业，机器人化对外包也产生了负面影响——因为机器人允许某些此前外包的生产在在国内实现自动化。在西班牙的案例中，他们发现第一组的影响占主导地位，在全样本中，机器人化对来自低收入国家的进口具有净正向影响。\n\
  \n- 来源：世界银行出口动态数据库，该数据库涵盖了除石油和武器之外的所有贸易交易。我们使用了来自孟加拉、智利、中国、哥伦比亚、厄瓜多尔、埃及、墨西哥、秘鲁、罗马尼亚和南非的进口-出口商的数据，这些数据包含\
  \ 4646 家不同公司 10,312 次独立的机器人购买。\n\n- 我们还包含了行业-年份和国家-年份固定效应，并在公司层面进行了聚类。\n\n- 集中度通过出口销售的赫芬达尔指数衡量，使用每个公司-产品占公司总出口额的份额。市场份额是公司从本国到每个特定出口地的总销售额份额，然后对公司所有的出口贸易对取平均值。外包是与公司销售商品处于相同\
  \ `HS4` 类别的进口额总和，遵循 Hummels 等人 (2014) 的“窄”衡量标准。`Roundtripper` 是一个虚拟变量，仅当企业在某一年内向同一伙伴出口并进口相同的\
  \ `HS6` 产品时，该变量取值为 1。关系粘性是 Martin 等人 (2020) 衡量标准在出口或进口方面的加权平均值。\n\n- 鉴于我们研究的部分国家面板数据长度较短，我们使用四年的窗口来最大限度地增加可以检测前后前后趋势的自动化事件数量。使用更长的窗口和更少的观测值，结果在定性上是稳健的。\n\
  \n- 如果我们把样本扩大到包含“从未采用者”，而不仅仅是“目前未采用者”，那么采用后的相对扩张规模会更大。\n\n- 这与发达国家的发现一致，即采用机器的大型企业以更多劳动密集型竞争对手为代价进行扩张（Koch\
  \ 等人，2019；Acemoglu 等人，2020）。规模较小且生产率较低的公司可能更容易受到来自海外自动化驱动的业务抢夺的影响（Aghion 等人，2020）。\n\
  \n- 贯处的参数 `ψ` 代表各种常数。\n\n## References\n\n- Acemoglu, D., Lelarge, C., Restrepo,\
