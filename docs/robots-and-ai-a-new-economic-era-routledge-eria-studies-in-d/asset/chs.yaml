  # 第 5 章 AI、机器人与全球化对劳动力市场的影响分析：基于定量一般均衡贸易模型的分析\n\nFurusawa Taiji, Kusaka Shoki 和\
  \ Sugita Yoichi\n\nDOI: [10.4324/9781003275534-5](https://doi.org/10.4324/9781003275534-5)\n\
  \n## 1 引言\n\n关于劳动力与资本互补性的一种普遍观点是，工人会从资本的增加中受益。然而，当涉及到特殊的资本——即工业机器人时，情况可能会完全不同。国际标准组织（ISO）将其定义为“一种自动控制、可重新编程的多功能机械臂，可在三个或更多轴上进行编程，可以固定在原处也可以移动，用于工业自动化应用”（ISO\
  \ 8373:2012）。这些工业机器人可以执行工厂工人本会承担的任务。因此，它们可能会替代低技能的手工劳动。\n\n技术进步也发生在使高技能工人的认知性工作面临风险的领域。特别是，人工智能（AI）正以惊人的速度不断进步。它对医疗和制药行业等领域的各类型工人具有补充作用和替代作用，并改变了许多行业的未来前景。Brynjolfsson\
  \ 和 McAfee (2011) 以及 Baldwin (2019) 认为，机器人技术和 AI 的进步呈爆炸式增长，因此只有那些能够利用这些新技术的人才能受益。与此同时，大多数工人可能会被留在后面，面临较低的工资。\n\
  \n全球化（在此定义为货物和服务贸易成本的下降）推动了机器人和 AI 在全球范围内的扩散。如图 5.1 显示了日本和德国在 2018 年机器人出口中的主导地位。AI\
  \ 公司也地理性地集中在美国、中国、英国、德国、法国和印度等少数国家（Samoili et al., 2020）。\n\n![图 5.1 世界货物、资本和机器人的贸易](img/fig0018.jpg)\n\
  \n图 5.1 世界货物、资本和机器人的贸易\n\n![图 5.2 2018 年各国机器人出口与进口](img/fig0019.jpg)\n\n图 5.2 2018\
  \ 年各国机器人出口与进口\n\n本章利用定量一般均衡贸易模型，评估了机器人/AI 技术进步和全球化对世界经济劳动力市场的影响。在我们的模型中，机器人可以以 Acemoglu\
  \ 和 Autor (2011)、Acemoglu 和 Restrepo (2018a; 2018b) 以及 Grossman 和 Rossi-Hansberg\
  \ (2008, 2012) 开发的基于任务的方法，执行低技能劳工的任务，而 AI 则执行高技能劳工的任务。效仿 Eaton 和 Kortum (2002)、Caliendo\
  \ 和 Parro (2015)、Sugita 等人 (2019) 以及 Furusawa 和 Sugita (2020)，我们还引入了全球价值链（GVC）这一重要特征，使我们能够解决全球化、技术采用和收入不平等的一系列问题。\n\
  \n在第 2 节中，我们建立了一个包含机器人但不包含 AI 的模型，并评估了过去技术进步和全球化的影响。第 3 节展示了我们的独特数据集，包括两个劳动力群体、机器人安装、投入产出表以及\
  \ 50 个 ISIC2 位行业的双边贸易。我们开发了一种新方法，利用数据和模型结构（特别是引力方程）来估计两个关键参数：每个行业和每个国家低技能生产中的机器人份额，以及机器人与低技能劳动力之间的替代弹性。机器人份额在某些行业中显著，但在国家层面通常较小。替代弹性处于中等水平。\n\
  \n在第 4 节中，我们首先模拟了 2014 年的世界经济，此时机器人相关技术或贸易成本设定为 1993 年的水平。尽管在受影响最大的行业中显著，但机器人技术进步对\
  \ 2014 年劳动力市场的影响远小于贸易自由化的影响。然后，我们模拟了一个机器人任务生产力变为 2014 年十倍的世界。机器人执行的任务份额在大多数国家仍将很小，对劳动力市场的影响也是如此。\n\
  \n\n\n\n\n我们的分析通过丰富劳动力市场和全球贸易结构模型，为这一新的文献方向做出了贡献，以分析全球化以及机器人和人工智能的应用对全球劳动力市场的影响。我们的贡献在于估计了国家-行业-年层面的机器人收入份额，并利用这些估计值估算了行业层面机器人与低技能劳动力之间的替代弹性。此外，通过数据进行严谨的模型分析并揭示了机器人和人工智能的宏观效应相对于全球化的影响是较小的。\n\
  \n## 2 模型\n\n我们建立了一个足够丰富的模型，以量化机器人和全球化对劳动力市场的影响。我们模型的基本结构类似于 Caliendo and Parro\
  \ (2015)、Sugita et al. (2019) 以及 Furusawa and Sugita (2020) 的模型。只有少数国家出口了全球贸易中大部分的机器人，事实表明我们需要一个能够纳入各国差异工业结构的多国模型。建立允许差异工业结构的模型也是重要的，因为正如我们后面看到的，机器人（以及人工智能）的使用高度集中在某些行业。该模型还应该兼顾全球价值链（GVC）结构，因为其发展是\
  \ 20 世纪 90 年代以来全球化的显著特征。\n\n## 2.1 基础设定\n\n`N` 个国家，索引为 `i`，`n \\in {1,…, N}`，生产\
  \ `S` 种商品和服务，索引为 `s`，`k \\in {1,…, S}`，跨越无限时间段，索引为 `t \\in {0,…, ∞}`。行业 `S` 代表机器人生产行业。模型包含五种生产要素：仅存在农业和采矿业的特定要素（`G`）、低技能劳动力（`L`）、高技能劳动力（`H`）、非机器人资本（`K`）和机器人（`R`）。行业特定要素和劳动力是非弹性的。消费者投资并累积非机器人资本和机器人。货物可以在国家间贸易，但服务和要素不能。机器人和非机器人资本仅在投资时可以进行跨国贸易。一旦作为资本货物被安装，消费者只能将其租借给国内企业。所有货物和要素都在完全竞争市场中进行贸易。\n\
  \n每个非机器人行业 `s \\in {1, .., S − 1}` 生产两种用途不同的货物：最终用途和中间用途。最终货物（标记为 `f`）仅用于消费和投资，而中间货物（标记为\
  \ `m`）仅作生产投入。消费者不消费机器人。行业 `s` 中每种用途 `u \\in {f, m}` 的货物由连续的品种 `\\omega^{(su)} \\\
  in [0, 1]` 组成。\n\n国家 `n` 的代表性消费者具有双层效用函数，上层为柯布-道格拉斯型，下层为常弹性（CES）型：\n\n$$\\begin{array}{rc}\
  \ U_{n} & {= \\sum\\limits_{t = 0}^{\\infty}\\beta^{t}\\ln Q_{\\text{~~}nt}^{f},\\\
  \\,\\\\, Q_{\\text{~~}nt}^{f} \\equiv \\prod\\limits_{s = 1}^{S - 1}\\left( Q_{\\\
  text{~~}nt}^{sf} \\right)^{\\alpha_{nt}^{s}},\\\\,\\\\, Q_{\\text{~~}nt}^{sf} \\\
  equiv \\left\\lbrack {{\\int\\_{0}^{1}q_{nt}^{sf}\\left( \\omega^{sf} \\right)^{\\\
  frac{\\sigma^{sf} - 1}{\\sigma^{sf}}}d\\omega^{sf}} \\right\\rbrack^{\\frac{\\sigma^{sf}}{\\\
  sigma^{sf} - 1}},} \\\\\\\\ \\end{array}$$\n\n(1)\n\n其中 `\\beta \\in (0, 1)` 是时间折现因子，`Q[nt^(f)]`\
  \ 是总最终消费，`Q[nt^(sf)]` 是行业消费，且 `\\sum_{s = 1}^{S - 1}\\alpha_{nt}^{s} = 1`。我们令 `\\\
  omega^{(sf)}` 表示最终货物 `s` 的品种，`q[nt^(sf)}(\\omega^{(sf)})` 是国家 `n` 在时间 `t` 对 `\\\
  omega^{(sf)}` 的消费，`\\sigma^{(sf)} > 0` 是最终货物 `s` 不同品种之间的替代弹性。\n\n国家 `n` 行业 `s \\\
  in {1,…, S}` 中的企业通过柯布-道格拉斯生产函数生产 `Y[nt]` 单位的用途 `u` 品种 `\\omega^{(su)}`：\n\n$$\\\
  begin{array}{rc} Y_{nt} & {= A_{nt}^{s}Z_{sn}\\left( \\omega^{su} \\right)G_{nst}^{\\\
  beta_{Gnt}^{s}}K_{nst}^{\\beta_{Knt}^{s}}H_{nst}^{\\beta_{Hnt}^{s}}T_{nst}^{\\beta_{Tnt}^{s}}\\\
  prod\\limits_{k = 1}^{S}\\left( M_{nt}^{sk} \\right){}^{\\beta_{nt}^{sk}}, \\\\\\\
  \\ M_{nt}^{sk} & {\\\\equiv \\left\\lbrack {{\\int\\_{0}^{1}m_{nt}^{sk}\\left( \\\
  omega^{km} \\right)^{\\frac{\\sigma^{km} - 1}{\\sigma^{km}}}d\\omega^{km}} \\right\\\
  rbrack^{\\frac{\\sigma^{km}}{\\sigma^{km} - 1}},} \\\\\\\\ \\end{array}$$\n\n(2)\n\
  \n其中 `\\sum_{v}\\beta_{nt}^{s} + \\sum_{k = 1}^{S}\\beta_{nt}^{sk} = 1`，`A[nt]^s`\
  \ 是全要素生产率（TFP），`Z_{sn}\\left( \\omega^{su} \\right)` 是行业特定要素，`G_{nst}` 是特定要素，`H_{nst}`\
  \ 是高技能劳动力，`T_{nst}` 是低技能劳动力，`M_{nt}^{sk}` 是中间投入。\n\n## 2.2 低技能生产中的机器人与劳动力替代\n\n\
  我们遵循 Acemoglu and Restrepo (2018b; 2020) 的任务方法对机器人替代低技能劳动力进行建模。任务模型可以解决机器人在特定任务上替代动力，同时补充其他任务的工人。(2)中生产商品\
  \ `s` 的低技能任务投入由连续任务 `v \\in [0, 1]` 的柯布-道格拉斯组合给出：\n\n$$\\begin{array}{r} T_{nst}\
  \ = \\exp\\left( {\\int\\_{0}^{1}\\ln T_{nst}(v)dv} \\right), T_{nst}(v) \\equiv\
  \ \\gamma_{st}(v)R_{nst}(v) + L_{nst}(v),} \\\\\\\\ \\end{array}$$\n\n(3)\n\n其中\
  \ `Tnst` 是低技能劳动力或机器人执行的任务 `v` 的量，`\\gamma_{st}(v)` 代表机器人的任务能力。低技能劳动力和机器人是完全替代的。任务根据机器人的比较优势排序，使得\
  \ `\\gamma_{st}'(v)<0` 成立。\n\n对于给定的低技能工资 `w[Lnt]` 和机器人租赁率 `w[Rnt]`，存在一个阈值任务 `v[nst]`，定义为\
  \ `w[Rnt]/\\gamma_{st}(v[nst])=w[Lnt]`。机器人执行任务 `v \\leq v[nst]`，而低技能工人执行 `v > v[nst]`。阈值\
  \ `v[nst]` 可以表示为相对价格的函数：\n\n$$\\begin{array}{r} v_{nst} = v_{st}\\left( \\frac{w_{Rnt}}{w_{Lnt}}\
  \ \\right) \\equiv \\gamma_{st}^{- 1}\\left( \\frac{w_{Rnt}}{w_{Lnt}} \\right),}\
  \ \\\\\\\\ \\end{array}$$\n\n(4)\n\n\n\n\n其中 `γ[s*t]^(-1)` 是 `γ[st]` 的反函数，因此 `v[st]`\
  \ 是一个递减函数。根据每个任务的最优分配，任务组合 (3) 变为：\n\n$$\\begin{array}{r} {T_{nst} = \\Gamma_{st}\\\
  left( v_{nst} \\right)\\left( \\frac{R_{nst}}{v_{nst}} \\right)^{v_{nst}}\\left(\
  \ \\frac{L_{nst}}{1 - v_{nst}} \\right)^{1 - v_{nst}}, \\\\ \\end{array}$$  \n\n\
  (5)\n\n其中 `Γst ≡ exp(∫0ln*γs*t*dv*)` 捕捉了机器人相对于低技能劳动的生产率优势。\n\n(4)中的函数 `v[st]` 是决定机器人对低技能劳动收入影响的关键函数。如(5)所示，函数\
  \ `v[st]` 的均衡值 `v[nst]` 决定了机器人和低技能劳动的收入份额。在时期 `t` 份 `n` 的行业 `s` 中，低技能工人获得行业收入的 `β[Tnt]^(s)(1−v[nst])`\
  \ 份额，而机器人获得 `β[Tnt]^(s)v[nst]` 份额。我们将从数据中估计(4)中的 `v[st]`。\n\n### 2.3. 机器人与资本积累\n\
  \n代表性消费者投资并积累机器人资本和非机器人资本，并将其贷给所在国家的当地企业。国家 `n` 的机器人存量 `R[nt]` 和非机器人资本存量 `K[nt]`\
  \ 的积累如下：\n\n$$\\begin{array}{rc} R_{nt + 1} & ={ I_{nt}^{R} + \\left( {1 - \\delta_{R}}\
  \ \\right)R_{nt}\\text{and } K_{nt + 1} = I_{nt}^{K} + \\left( {1 - \\delta_{K}}\
  \ \\right)K_{nt},} \\\\ \\end{array}$$  \n\n(6)\n\n其中 `I[nt]^R` 和 `I[nt]^K` 分别是对机器人和非机器人资本的投资，`δ[R]`\
  \ 和 `δ[K]` 是折旧率。为了简单起见，非机器人资本的投资技术由与(1)所示的消费聚合器 `Q[nt]^f` 相同的 CES 聚合器给出。机器人的投资也表示为机器人品种的\
  \ CES 聚合体，$I_{nt}^{R} \\equiv \\left[ {\\int_{0}^{1}I_{nt}^{R}\\left( \\omega_{R}\
  \ \\right)^{\\frac{\\sigma_{R} - 1}{\\sigma_{R}}}d\\omega_{R}} \\right]^{\\frac{\\\
  sigma_{R}}{\\sigma_{R} - 1}}$，其中 `σ[R] > 0` 是替代弹性，`I[it]^R(ω[R])` 是品种 `ω[R]` 的机器人投资。\n\
  \n代表性消费者的极大化问题可以用两个步骤表示。令 `w[Knt]` 表示非机器人资本的租赁率。令 `P[nt]` 和 `P[nt]^R` 分别为消费/资本投资和机器人投资的价格价格指数。上层问题是选择总消费\
  \ `Q[nt]` 和投资（`I[nt]^R,I[nt]^K`）：\n\n$$\\begin{matrix} & {\\underset{\\\\{ Q_{nt},I_{nt}^{K},I_{nt}^{R}\\\
  }}{\\text{max}}\\sum\\limits\\_{t = 0}^{\\infty}\\beta_{n}^{t}\\ln Q_{nt}} \\\\\
  \ & {\\text{s.t.} P_{nt}\\left( {Q_{nt} + I_{nt}^{K}} \\right) + P_{nt}^{R}I_{nt}^{R}\
  \ = w_{Knt}K_{nt} + w_{Rnt}R_{nt} + E_{nt}\\text{and}( 6),} \\\\ \\end{matrix}$$\
  \  \n\n其中 `K[n0]` 和 `R[n0]` 是给定的，`E[nt]` 代表来自其他来源的收入，包括劳动收入、经常贸易平衡和关税收入。我们假设经济处于稳态，此时\
  \ `K[nt] = K[n]`，`R[nt] = R[n]`，`Q[nt] = Q[n]`，`I[nt]^K = δ[K]K[n]`，且 `I[nt]^R =\
  \ δ[R]R[n]`。\n\n### 2.4. 反事实分析的均衡条件\n\n遵循 Dekle 等人 (2008) 以及 Caliendo 和 Parro (2015)，我们考虑了变量变化的均衡条件体系。我们将变量\
  \ `x` 的反事实变化记为 `x̂[t] ≡ x[t]`，其中 `x[t]` 是 `x` 在时期 `t` 的均衡值，而 `x̂[t]` 是其在反事实经济中的均衡值。我们将均衡条件系统的描述放在附录，并将数值求解算法放在在线附录。\n\
  \n在第二层问题中，消费者选择单个商品的需求 `Q[nt]`，价格以及给定的 `I[nt]^K`。根据 Eaton 和 Kortum (2002)，国家 `n`\
  \ 行业 `s` 的贸易份额由下给出：\n\n$$\\begin{array}{rc} w_{nt} = P_{nt}^{R}(r + \\delta_{R})\
  \ \\text{and } w_{nt} = P_{nt}^{K}(r + \\delta_{K}), \\\\ \\end{array}$$  \n\n(7)\n\
  \n其中 `r` 是利率。贸易份额方程 (8) 将贸易流量与进口国的价格联系起来：\n\n$$\\begin{array}{r} \\pi_{it}^{s} =\
  \ \\left( \\frac{A_{it}^{s}}{P_{nt}} \\right)^{\\theta_{s}} \\left( \\sum_{j=1}^{N}\
  \ \\left( \\frac{A_{jt}^{s}}{P_{nt}} \\right)^{\\theta_{s}} \\right)^{-1/\\theta_{s}},\
  \ \\\\ \\end{array}$$  \n\n(9)\n\n其中 `γ` 是常数，`β` 是且捕捉了机器人相对于低技能劳动的生产率优势。\n\n\n\n\
  \n## 机器人存量、贸易与机器人价格\n\n国际机器人联合会（IFR）数据库报告了自 1993 年以来 71 个国家和 18 个行业新安装工业机器人的物理数量。IFR\
  \ 遵循了引言中提到的 `ISO 8373` 机器人学定义，该定义已用于相关文献中，例如 Graetz 和 Michaels (2018) 以及 Acemoglu\
  \ 和 Restrepo (2020)。按照 Graetz 和 Michaels (2018) 的程序，我们使用永续存量法，并设定折旧率为 `δ`[`R`]`\
  \ = `0.1` 构建了机器人存量。我们从联合国 Comtrade 数据库收集了工业机器人的双边贸易数据，该数据包含 6 位协调制度代码 `847950` 类别，即“多用途工业机器人”。我们构建了日本机器人价格的时间序列数据、根据\
  \ IFR 数据计算的 2014 年日本单位机器人价格，以及以日本银行（BoJ）企业货物价格指数数据库中收集的 2015 年价格为基准的机器人价格指数序列。日本银行每月调查工业机器人价格并报告自\
  \ 1990 年来的质量调整价格指数，据我们所知，这是我们样本期内关于质量调整机器人价格唯一的数据。\n\n## 劳动力技能分组\n\n参考 Weingarden\
  \ 和 Tsigas (2010)，我们将国际工组织（ILO）数据库中国际职业标准分类（`ISCO-08`）的 10 种职业合并为两个技能类别。高技能组包括：(1)\
  \ 管理人员,(2) 专业人员以及(3) 技术人员和助理专业。低技能组包括：(4) 文书支持人员,(5) 服务和销售人员,(6) 熟练农、林业和渔业工人,(7)\
  \ 手工及相关行业工人,(8) 工厂和机器操作员及组装员以及(9) 初级职业。我们从数据中删除了“武装部队”类别。\n\n## 3.2 参数估计\n\n###\
  \ Cobb-Douglas 参数\n\n我们根据数据中计算出的支出份额，校准了效用函数和生产函数的 Cobb-Douglas 参数 {`α`[`snt`],\
  \ `β`[`snt`]}。\n\n### 贸易弹性\n\n遵循 Caliendo 和 Parro (2015) 的精神，通过利用引力模型中双边关税的变化来估计\
  \ Fréchet 参数 `θ`(`s`)，即贸易弹性。贸易成本 `d`[`n**i**t`]`(`s**u**`) 被建模为 `ln d`[`n**i**t`]`(`s**u**`)\
  \ = ln (1+`τ`[`n**i**t`]`(`s`)) + ∑[`k`]TC[`ni`, `k`]`δ`[`k**t`]`(`s**u**`) + `ε̃`[`n**i**t`]`(`s**u**`)，其中\
  \ `τ`[`n**i**t`]`(`s` ) 是双边关税率，`ε̃`[`n**i**t`]`(`s**u**`) 是特有贸易成本，`TC`[`ni`, `k`]\
  \ 是国家对特征的第 `k` 个变量。\n\n```\nln\\pi_{nit}^{su} = \\beta^{s}\\ln(1 + \\tau_{nit}^{s})\
  \ + \\sum_{k}TC_{ni,k}(\\beta_{kt}^{f} + I_{u = m}\\beta_{kt}^{m}) + ex_{it}^{s}\
  \ + im_{nt}^{su} + \\varepsilon_{nit}^{su}\n```\n\n(10) 其中 `I`[`year = t`] 和 `I`[`u\
  \ = m`] 分别是年份虚拟变量和中间产品，`ex`[`it]`(`s`) 是出口国-时间效应，`im`[`it]`(`s`) 是进口国-时间使用效应。我们对每个可贸易商品行业（从\
  \ 1 到 13 的 IFR 行业）分别通过 `OLS` 估计 (10)，合并所有时期（2004, 2007, 2011, 2014）并排除没有关税信息的观测值。\n\
  \n表 5.2 估计的贸易弹性\n\n| IFR | 描述 | θ | SE | obs |\n| :--- | :--- | :--- | :--- | :---\
  \ |\n| 1 | 农业、林业和渔业 | 4.456 | (1.341) | 15,940 |\n| 2 | 矿业和采石业 | 18.685 | (5.029)\
