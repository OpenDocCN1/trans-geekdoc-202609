  \n(11) 将贸易成本建模为 `ln d`[`n**i**t`]`(`s**u**`) = ∑[`k`]TC[`ni`, `k`]`δ`[`k**t`]`(`s**u**`)\
  \ + `ε̃`[`n**i**t`]`(`s**u**`)，我们通过以下固定效应估计引力方程：\n\n```\nln X_{nit}^{R} = \\zeta_{nt}^{M}\
