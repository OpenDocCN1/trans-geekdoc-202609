  \ 的衡量方法依赖于以下模式：专利文本包含了关于技术用途的信息，而工作描述文本则包含了关于工人在工作中实际执行的任务的信息。通过比较这两个文本序列，来量化特定技术的专利申请中有多少比例是针对给定职业的任务。每个任务被分配一个得分，并将任务级得分在职业层级进行汇总，以为每个职业构建自动化暴露分值。\n\
  \n- 9 Mann 和 Püttmann 如果发现专利文本描述的是一种能够独立于人类干预执行过程的设备，则将其归类为自动化专利。他们根据专利的技术分类，将专利与其可能使用的行业进行匹配，并在详细的行业和通勤区层级推导出一种新可用自动化技术的衡量标准。\n\
  \n- 10 Aghion 等人 (2020) 提供了关于消费者价格反应的直接实证证据。Bonfiglioli 等人 (2020) 建议，自动化带来的生产率收益可能不会完全以更低价格的形式传递给消费者。\n\
