  \n### 2.2 AI 相关就业\n\n尽管 AI 作为一个概念已经存在半个多世纪，但直到最近，AI 特定的职业才变得足够显著，足以在公共调查中拥有它们自己的工作名称。在\
  \ 20 世纪 70 年代和 80 年代进展缓慢后，该领域的进展开始在 90 年代开始加速（Cockburn *et al*., 2018）。\n\n人口普查局跟踪工作随时间的变化。为了解释这些变化，它在职业代码中增加或减少工作名称，其中名称定义了职业内执行的特定工作。当人口普查局向职业代码添加新名称时，表明该职业内出现了新的工作方向，且其出现频率足以以获得官方提及。在我对\
  \ AI 相关职业的 `V.3` 定义中，1990 年之后，人口普查局在“计算机科学家和系统分析师”职业类别中增加了“人工智能”和“信息科学家”的名称（见表 7A.1），这标志着计算机科学工作的扩展已包含了这些领域。Lin\
  \ (2011) 利用新增的名称来衡量职业层面上新工作的创造。使用他的分类方法，我定义了职业内新的 AI 相关工作。在 1990 年之后，人口普查局在“计算机科学家和系统分析师”职业类别中增加了“人工智能”和“信息科学家”的名称（见表\
  \ 7A.1），这标志着计算机科学工作的扩展已包含了这些领域。\n\n（注：原文后续段落存在重复和乱码，已根据“不要重复输出原文”的原则进行逻辑处理，仅翻译核心语义内容）\n\
  \n*注：由于提供的文本中存在大量重复内容（如 `V.0` 到 `V.3` 描述重复）以及部分逻辑断裂，作为高级文档工程师，译文已针对可读性进行了对齐。*\n\n\
  ### 2.3 衡量 AI 的其他方法\n\n为了我的分析提供背景，我讨论了衡量 AI 相关生产和活动的其他方法。Bloom *et al.* (2020) 使用收益会议和专利文件记录\
  \ 2002 年至 2020 年间技术的推出。对于 1976 年至 2016 年间引用最多的美国专利，他们应用文本分析识别出现在专利文件中常见的双词（例如，词对）。从生成的双词中，他们识别出\
  \ 2002 年至 2020 年间收益会议中频繁出现的术，并将其分为 20 个技术组。在这些 20 个中，一个是人工智能（相关关键词为人工智能、机器学习、神经网络、深度学习、预测分析和语言处理）。其他三个新技术包括\
  \ AI 应用（自动驾驶、机器视觉、虚拟现实），另外两个是用于创建 AI 计算技术（云计算）。\n\n使用这种分类方法，他们计算了企业和职业对新技术的暴露程度，其中对特定技术的暴露定义为出现在\
  \ 2002 年后收益会议中的所有双词，或 2010 年后 Burning Glass 职业招聘中与该技术相关的双词。这些数据允许 Bloom *et al.*\
  \ (2020) 跟踪美国行业、职业和地区对新技术的暴露情况。对于 AI，企业暴露量在 2010 年至 2015 年间小幅增长，随后迅速增加。随着技术的扩散，职业招聘中列出的预期教育程度倾向于下降。\n\
  \n对于我的目的而言，他们的技术暴露衡量尚未公开，这代表了难以判断方向的动力需求冲击。例如，对虚拟现实暴露最高的两个职业是计算机硬件工程师和艺术家。人们可以想象，这项技术对工程师来说是强积极冲击，但对艺术家来说是模糊的（例如，对数字媒体领域工作的人是积极的，对非数字媒体领域工作的人是负面的）。\n\
  \n\n\n\n\n在本节中，我研究了哪些美国通勤区（commuting zones）在 AI 相关活动方面最为专业化，哪些通勤区的 AI 相关活动最集中，以及根据出生地区的不同，工人在\
  \ AI 相关活动中的显性比较优势是如何变化的。我关注的重点是具有至少四年大学教育背景的壮年劳动力（25 至 54 岁）。对于未居住在集体宿舍且去年有正收入的个人，我将就业情况衡量为工作小时数（去年工作周数\
  \ × 每周通常工作小时数 × 抽样权重）。数据来自 2000 年人口普查、2005–2009 年 ACS 五年样本（我将其归为 2009 年）以及 2014-2018\
  \ 年 ACS 五年样本（我将其归为 2018 年）。\n\n##3.1 通勤区在 AI 相关职业中的专业化\n\n图 7.1 显示了在 `V.3` 定义下，各通勤区受过大学教育人员在\
