  \n\n\n\n# AI 领域的移民与区域专业化\n\nGordon Hanson\n\nDOI: [10.4324/9781003275534-7](https://doi.org/10.4324/9781003275534-7)\n\
  \n## 1 引言\n\n\n\n\n\n人工智能（AI）将如何影响劳动力市场，学术界和政策界引起了巨大的关注。鉴于近几十年来技术变革对收入和就业的颠覆性影响，这种关注是可以理解的。1980\
  \ 年后偏向技能型技术进步的飞猛发展被认为推高了拥有大学学历工人的收入溢价（Katz & Autor, 1999），这导致许多高收入国家的收入不平等现象加剧。在这些变化中，常规任务的自动化使得就业从中等技能岗位转移，导致收入分布变得更加“空心化”（Autor\
  \ & Dorn, 2013; Goos *et al.*., 2014）。工业机器人使用的日益扩大（Acemoglu & Restrepo, 2020）以及通过\
  \ Uber 类平台雇佣合同工（Abraham *et al.*., 2019; Chen *et al.*., 2019）是新技术颠覆工作世界的最新方式。随着\
  \ AI 具有可能将许多工作任务转换为机器可以执行的算法常规化，另一波动荡可能在眉睫（Autor *et al.*., 2020）。\n\n### 驱动 AI\
  \ 生成的力量\n\n在本章中，我关注的重点不是 AI 对劳动力市场的影响，而是驱动 AI 本身产生的力量。三项创新使得 AI 成为可能（Varian, 2018）。其一是机器学习的新方法，另一是高速计算和特殊用途计算的进展，第三是数字格式超大规模数据集的普及。机器学习结合了统计学和计算机科学的技术，以从原始数据中预测结果或学习模式。当机器学习嵌入到一个能够输入数据、应用领域知识并治理学习的系统时，AI\
  \ 随之产生（Taddy, 2018）。\n\n这一过程需要由计算机科学家、数据科学家、电气和计算机工程师、网络系统分析师和软件程序员组成的专业团队，还需要具备\
  \ AI 运行领域知识的工人。高速计算的需求源于预测模型的非线性和高维性，这需要大量数据集进行训练、验证和测试。在 AI 的关键投入中，机器学习和系统工程的最终阶段似乎具有特定的地点特定性。创建\
  \ AI 涉及在其他地方制造的计算机硬件、从不同来源收集的数据，以及倾向于紧密工作的专家团队。\n\n### 空间聚集与比较优势\n\n如果 AI 能够接近其预测的潜力，将出现一个巨大的\
  \ AI 相关商品和服务市场。正如新技术的领域的就业往往呈现出高度的地理集中性（Moretti, 2012, 2019; Bloom *et al.*., 2020），预计\
  \ AI 相关活动表现出强大的空间聚集模式也是自然而。因此，理解 AI 相关工作中新兴的比较优势，对于评估该技术如何改变国家和全球贸易格局至关重要。AI 相关服务的贸易衡量较差，既是因为它是新的领域，也是因为技术服务贸易产生的收入流在传统数据中难以检测。\n\
  \n为了研究 AI 生产中的比较优势可能是什么，我将美国通勤区作为分析单位（Tolbert & Sizer, 1996）。区域性的关注允许我通过丰富的就业数据来衡量比较优势，而不是通过记录不全的贸易流量。由于美国处于\
  \ AI 和 IT 创新的前沿，这里很可能是 AI 区域比较优势最先显现的地方。尽管聚焦于此，AI 的新颖性也带来了衡量挑战。我研究了似乎涵盖 AI 相关活动的职业，并意识到此类类别也将包含一些不一定涉及\
  \ AI 的工作。\n\n### 衡量 AI 就业的方法\n\n我的目标是理解过去二十十年 AI 相关就业的区域变化。尽管机器学习可以追溯到 1950 年代（Cockburn\
  \ *et al.*., 2018），但该领域直到 1990 年代才开始繁荣。直到 2000 年，特别是 2010 年之后，它才被广泛使用（Taddy, 2018）。\n\
  \n分析的第一步是识别可能参与 AI 生产的职业。在与 STEM 学相关的职业中，我根据人口普查定义的职位名称选择了可能包含 AI 生成工作的职业代码，这些名称必须包含以下集合中的至少一个词：`computer`、`data`\
  \ 或 `software`；以及 `design/designer`、`engineer`、`research/researcher` 或 `science/scientist`。这一程序从更广泛的\
  \ STEM 类的 707 个总标题中识别出 30 个 AI 相关的职业名称。所选的职位名称例如，“人工智能专家”和“信息科学家”。使用更宽的过滤器可以识别出\
  \ 146 个 AI 相关标题。由于就业可以在职业代码层面衡量但无法在标题层面衡量，因此我专注于包含这些标题的代码。在这些代码中，我利用 Lin (2011)\
  \ 的结果来识别 1990 年后创建的职业名称，那正是 AI 进展开始加速的时期。\n\n衡量 AI 就业的另一种方法是使用明确提到人工智能应用的职位招聘。一类快速兴起的文献采用了这种方法来检查可能被\
  \ AI 颠覆的职业在劳动力市场结果的变化（例如，Brynjolfsson *et al.*., 2018; Felten *et al.*., 2018; Acemoglu\
  \ *et al.*., 2020; Bloom *et al.*., 2020; Webb, 2020）。较少的工作关注哪些工作参与了 AI 的创建及其应用。Acemoglu\
  \ *et al.* (2020) 使用 Burning Glass 的招聘数据来衡量 AI 生成活动职位的扩张。这些数据的优势在于招聘信息包含了与 AI 相关的显式技能（例如，`computer\
  \ vision`、`deep learning`、`machine learning`）。\n\n\n\n\n\n## AI 相关职业的区域专业化\n\n分析的第二步是检查\
  \ AI 相关职业的区域专业化情况。数据中呈现出两种模式。一种是在 20 世纪 80 年代或 90 年代成为技术工作中心的通勤区（CZ），其 AI 相关职业的区域专业化程度最高。这些通勤区包括\
  \ `Austin`、`Boston`、`Oakland`、`San Jose`、`Seattle` 和 `Washington, DC`。它们在 AI 相关职业上的专业化程度在\
  \ 2000 年已经相当显著，并且到 2018 年更加显著。这些城市也是高科技初创公司和高科技领域专利申请高度集中的地区（Chatterji *et al*.,\
  \ 2014; Moretti, 2019）。\n\n第二种模式是，技术导型通勤区 AI 相关职业专业化程度的增加主要归功于外出生男性的就业。本土出生工在 AI\
  \ 相关职业中最集中的通勤区包括专注于政府资助军事研究的城市（`Colorado Springs, CO`；`Alexandria, VA`）和空间研究的城市（`Melbourne,\
  \ FL`；`Huntsville, AL`），而外出生男性在 AI 相关领域最集中的通勤区占据了最大的 AI 就业集群，也是私营企业主导高科技格局的地区。\n\
  \n观察这些外出生工人的籍国，其 AI 相关职业的显性比较优势存在巨大差异。东亚和南亚出生工人在 AI 相关职业上的比较优势最强，而拉丁美洲、加勒比地区和美国出生工人的优势最弱。尽管女性在\
  \ AI 相关职业中的就业占比较小，但根据出生国家划分，其 AI 显性比较优势与男性相似。\n\n众所周知，外出生工人在不同职业中的专业化程度因原国而异，来自特定国家的移民倾向于集中在特定的美国城市（例如，Patel\
  \ & Vella 2013; Hanson & Liu 2017; Burstein *et al*. 2020）。这些规律在 AI 相关活动的案例中也有所体现。由于创造人工智能及信息技术相关创新所需的技能是稀缺的，而且某些国家似乎比其他国家更能培养出具备所需技能的工人，因此最能吸引高技能外出生工人的地区似乎是那些最有可能获得\
  \ AI 比较优势的地区。在 2000 年到 2018 年期间，外出生工占 AI 相关活动工作小时增加量的 54.6%。\n\n## 就业增长背后的因素\n\n\
  分析的第三步是识别 AI 相关职业区域就业增长背后的因素。受高教育外出生工在 AI 就业中重要性的启发，我将 AI 区域专业化的变化建模为面对每个地区的高教育移民劳动力供给变化的函数。我估计了\
  \ 2000 年至 2018 年期间，黄金年龄大学教育工人在 AI 相关职业中在通勤区就业份额的变化，将其设定为预测当地大学教育移民增加人数的函数。\n\n受\
  \ Altonji & Card (1991) 和 Card (2001) 份额分解法（shift-share approach）的启发，我利用每个原籍国（通勤区外）大学教育移民的全国范围增长情况，以及该通勤区在各原籍国大学教育移民就业中（不包括\
  \ AI 相关职业）的初始份额，来预测通勤区内大学教育移民供给的增加。对于男性而言，移民劳动力供给冲击与 AI 相关职业的就业增长呈强正相关。这种效应完全源于外出生工就业的增加。移民劳动力供给冲击对本土出生男性就业的影响很小且估计不精确，这表明到达的外出生人在\
  \ AI 相关活动中既没有对本土工人产生“挤入效应”，也没有产生“挤出效应”。女性在 AI 相关职业中的就业情况也相似，尽管系数绝对值较小，这与外出生女性在 AI\
  \ 相关职业中专业化程度较低的情况是一致的。无论使用工人人数还是工作小时来衡量就业，无论对 AI 相关职业采用狭义还是广义定义，结果都是的。\n\n## 全球人才搜寻与生态系统\n\
  \n尽管在过去的几十年里，计算能力和数据可用性是 AI 进展的限制因素，但如今计算能力和数据可用性已大幅提高。能够设计计算架构、制定学习算法、应用领域科学以及构建创建\
  \ AI 所需业务系统的工人供给可能成为一个制约因素。并不意外，建立成功的团队涉及全球范围的人才搜寻（Hanson & Slaughter, 2018）。\n\n\
  我的结果表明，美国最能吸引外籍人才的地区是那些在 AI 相关活动中获得更强比较优势的地区。全球人才搜寻中的三个重要参与者是：\n1. 美国政府，负责监管高技能移民的签证供应（Lazear,\
  \ 2021）；\n2. 美国大学，将许多未来的美国外出生技术工人招为学生（Bound *et al*., 2017, 2021）；\n3. 美国科技公司，其招聘策略也有助于将外国技术工人带到美国（Kerr\
  \ & Lincoln, 2010）。\n\n这些参与者的相互依赖的选择创造了一个商业生态系统，AI 创新在此得以蓬勃发展。然而，这似乎并非促进此类创新的唯一生态系统。为了创造\
  \ AI，中国正在采取一种由国家主导的方法，包括对国内技术公司进行贸易保护（Goldfarb & Trefler, 2018），并主要依靠本土人才。在学术期刊出版和专利授予方面，这种方法已取得一些成功（Xie\
  \ & Freeman, 2020）。当把我的结果推广到全球时，需要考虑这些不同的生态系统在全球竞争中表现如何，这是一个我的分析中未涉及的话题。\n\n## 文献联系\n\
  \n实证结果与几类文献相联系。首先是与移民相关的区域劳动力供给冲击对劳动力市场影响的分析。我发现移民工人既没有挤入也没有挤出 AI 相关职业的本土工人，这与 Burstein\
  \ *et al*. (2020) 在所有可贸易活动职业中的结果一致。\n\n我的分析没有解释为什么具有 AI 技能的移民会被美国吸引。领先 IT 公司在美国的聚集是一种解释。另一种解释是，高教育人才之所以被美国吸引，是因为相对于其他高收入目的地，美国对技能的回报更高（Grogger\
  \ & Hanson, 2011）。我的工作也没有解释为什么来自特定国家的工人在 AI 领域表现出色。Hanson & Liu (2021) 发现，从事对抽象和定量推理要求更高的工作的移民，往往来自提供更高质量\
  \ K-12 教育的国家，这从其学生的 PISA 考试成绩中得到了证明。相似的力量在 AI 专业化方面也可能在发挥作用。目前尚不清楚外出生人在 AI 方面的专业化是否会转化为其原籍国\
  \ AI 的比较优势。\n\n\n\n\n\n在第 2 节中，我描述了如何衡量与 AI 相关的就业情况；在第 3 节中，我展示了美国通勤区内 AI 相关工作专业化的描述性证据；在第\
  \ 4 节中，我对比了移民劳动力供给冲击如何影响地区 AI 相关职业的就业进行了实证分析；在第 5 节中，我得出了结论。\n\n## 2 衡量 AI 相关职业的就业情况\n\
  \n人工智能的独特性在于，它需要计算机科学、工程、数学及相关学科的技术技能，并且具有新颖性（或至少在规模上已经达到了可以被就业调查监测到的新颖程度）。我衡量 AI\
  \ 相关职业就业的方法主要基于这两个特征：职业的技术定义和其新颖性。当然，AI 相关领域的新工作可能包括不专属于 AI 的 IT 新工作。因此，我将我的衡量标准称为捕捉了“AI\
  \ 相关”职位的增长，而非专门从事 AI 的职位增长。\n\n### 2.1 定义 AI 相关职业类别\n\n人口普查局通过对执行相似任务的工人进行归类来定义职业代码。随着时间的推移，他们会对这些代码进行修改，大多数重大修订发生在人口普查年。为了衡量几十年间一组统一职业的就业增长，我使用了由\
  \ Dorn (2009)、Autor & Dorn (2013) 以及 Deming (2017) 协调后的 1990 年人口普查职业代码。()\n\nAI\
  \ 的创造结合了在广泛技术领域接受过培训的工人努力，包括计算机工程、计算机科学、数据科学和软件工程。支持构建机器学习算法并在专用计算机硬件上设计其实现方案的工人，还有一些专家，他们负责创建和管理大型数据库、提供相关领域的专业知识（例如用于\
  \ AI 检测癌症的肿瘤学家和放射科医生），以及开发和营销 AI 产品等任务。为了专注于 AI 创新的核心核心工作，我针对的是第一组职业，而非第二组。\n\n\
  我将潜在的 AI 相关职业范围定义为 STEM 职业，使用了 Hanson & Slaughter (2018)中的 STEM 定义。他们采用了了人口普查局对\
  \ STEM 职业的分类，并删除了那些大部分比例工人缺乏大学学位的职业（例如实验室技员、计算机支持人员、绘图员）。所得职业集包含了所有计算机程序员、计算机科学家、工程师、数学科学家、网络系统分析师以及生命和物理科学家。()\n\
  \n为了定义 AI 相关工作，我对这些广泛的 STEM 类别应用了一系列日益精细的过滤器，创建了四个版本的职业：\n\n*   V.0（版本 0）职业：我删除了\
  \ Hanson & Slaughter (2018)定义中与行政或支持性角色有关，或与看起来远离 AI 甚远的科学学科相关的职业代码。()\n*   V.1\
  \ 职业：我从 V.0 职业中选择了名称中包含以下术语之一的职业：分析师（analyst，受限制）、架构师（architect）、设计师/设计（designer/design）、开发人员（developer）、工程师（engineer）、程序员（programmer）、研究员/研究（researcher/research）、科学家（scientist）或统计学家/统计（statistician/statistical）。所得潜在\
  \ AI 职业集在 2000 年有 325 个名称，其中 68 个是 1990 年后新增的。\n*   V.2 职业：我从 V.1 职业中选择了名称中包含以下术语之一的职业：设计师/设计（designer/design）、开发人员（developer）、程序员（programmer）、研究员/研究（researcher/research）、科学家（scientist）和统计学家/统计（statistician/statistical）；以及工程师（engineer）加上计算机、数据或软件。结果在\
