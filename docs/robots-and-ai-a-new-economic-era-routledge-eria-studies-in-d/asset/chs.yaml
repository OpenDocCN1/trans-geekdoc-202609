  \n`表 6.4`中`OBS`列的点估计值是我们在量化练习中使用的值。下一步是思考如何将服务流与工作联系起来。\n\n### 4.3 将服务流转化为工作\n\n\
  接受一种大胆的近似，即`OBS`服务进口是对外国服务工作人员的报酬，那么双边服务贸易流可以被解释为国家对之间远程迁移者的“工资账单”。这种方法虽然粗糙，但它让我们在处理使远程迁移变得便利的影响时，能够应对数量级的问题。\n\
  \n简单而言之，新兴经济体目前出口的其他商务服务量非常小。2019 年，中国和印度的总`OBS`出口额分别为`680 亿美元`和`510 亿美元`。这些较小的初始规模需要大幅增长，才能与大量新增的远程迁移工作相关联。如果远程迁移者每年赚取`10,000\
  \ 美元`（每小时`5 美元`），\n\n\n\n\n这些计算得出的主要结论是，当我们从最初较小的双边出口值计算增长时，对就业的影响数字非常小。印度的劳动力规模约为\
  \ 5 亿人。表 6.5 中粗略计算得出的就业影响与这一数字相比是微不足道的。巴西和中国的就业增长也同样平缓。\n\n当然，物理距离并不是贸易成本的唯一来源。新的数字工具和组织实践可能会减少与时区或语言差异相关的摩擦。我们可以计算与我们之前的距离驱动情景类似的此类后果。但表\
  \ 6.5 中就业人数之所以较小，一个重要原因是：2019 年其他业务服务的出口额很小，这意味着即使贸易成本发生任何微小变化，相关的新的“远程移民（telemigrants）”数量也很少。\n\
  \n### 4.4 细小变化不足以产生巨大的发展影响\n\n我们的粗略量化练习可以进行大幅改进，但对第 4.2 节中估计的弹性的改进，对基本结论基本上没有实质影响。目前这类可以被解释为向远程移民支付报的服务贸易规模太小了，即使增加两倍或三倍，也不会对新兴市场的发展轨迹产生重大影响。必须贸易流量发生激进增长才能在新兴市场创造许多新的服务业就业岗位。这并非不可能.^()\n\
  \n下一节将探讨一个模型的经济逻辑，在该模型中，服务贸易摩擦障碍的微小变化可能会导致比我们量化练习所建议的更激进的变化。\n\n## 5 远程移民的简单模型：比较优势在服务领域会有所不同吗？\n\
  \n远程移民引发了富裕国家的焦虑。“今年远程办公的大规模实验让某些人产生了一丝不安感：如果我可以在伦敦、布鲁克林或堪培的家里工作，那么是否有人可以在索非亚、孟买或马尼拉以更廉的价格完成？”莎拉·奥康纳（2020\
  \ 年）在《金融时报》上写道。这种担心是，数字化的远程移民将是不对称的：它将使富裕国家的数百万办公人员暴露在外国竞争中，而不会为他们提供额外的、抵消性的出口机会。\n\
  \n这种焦虑是否有根据？传统的引力模型会认为并非如此。在这些量化模型中，贸易流量对贸易成本的弹性是常数。结果是服务贸易成本共同下降的直接影响是所有经济体服务出口的同比例增加。即使忽略发达经济体潜在的出口扩张，对其从新兴经济体进口增加的量化表明，涉及的就业人数是有限的。在一般均衡效应方面存在细微差别，但引力方程的假设使得比较优势模式是对称的且贸易弹性为常，这基本上排除了对贸易成本共同下降的高度不对称反应。另一方面，我们没有证据支持将注意力限制在这些特定的函数上。\n\
  \n两个有趣的经验模式表明，建立一个允许我们说明这种焦虑背后可能的模型可能是很有益的。首先，大多数富裕国家在服务方面处于顺差，因此似乎在服务领域具有比较优势（WTO\
  \ 2019，图 B.9）。具体而言，发达国家占全球服务出口的约 75%，且出口多于进口。这种服务贸易大部分（约 70%）发生在传统服务中。具体来说，这些是分销服务（占世界总额的\
  \ 20%）、金融服务（19%）、电信、计算机和视听服务（13.2%）、运输（12%）和旅游业（8%）。^()\n\n第二个事实是，发展中经济体在通过数字平台出口办公和专业服务方面具有优势（ILO\
  \ 2021）。这些类别目前的规模远小于传统服务（其他业务服务和专业服务分别占全球服务贸易的 4%和 3%），但它们增长更快。富裕国家在增长最快的服务贸易细分领域出现贸易逆差，这使得数字技术的进一步进步可能不会简单地强化过去的服务贸易模式。\n\
  \n为了评估服务贸易未来扩张可能不对称的可能性，我们需要一个一般均衡贸易模型，允许我们解决两个关键问题：为什么今天的服务出口很大程度上是在“逆流”，即从高工资国家流向低工资国家？为什么认为降低远程移民成本会导致跨境流量出现不对称增长，从而扭转这一模式？在此过程中，模型将允许我们考虑其他几个问题，例如：“商品的低贸易成本如何与服务的高贸易成本相互作用？”以及“如果国际相对工资主要由国际劳动生产率差异和国家规模决定，当远程移民变得容易得多，相对工资会发生什么？”\n\
  \n为了回答这些问题，我们使用 Dornbusch, Fischer 和 Samuelson (1977) —— 下称 DFS —— 模型作为思考远程移民的基础。该模型很熟悉，因此我们快速通过分析。为了固定思路并引入符号，我们首先介绍著名的商品贸易的\
  \ DFS 模型。\n\n### 5.1 商品的 DFS 模型\n\n世界经济有两个国家（北方和南方）。市场是完全竞争的。存在连续的商品，由 `z` 索引。生产仅雇用劳动力并表现出规模报酬不变。北方和南方的劳动力禀分别为\
  \ `L` 和 `L*`。商品 `z` 的单位成本为：\n\n`w*a(z), w*a*(z), z = 0, …, 1`\n\n其中 `a(z)` 和 `a*(z)`\
  \ 是北方和南方的单位劳动力投入系数，`w` 和 `w*` 是它们各自的工资。北方作为富裕国家，假设在每个部门都具有绝对优势，但只有相对效率 `a*(z)/a(z)`\
  \ 对贸易模式重要（Ricardo, 1817）。对部门进行索引，使得北方的生产率优势在低-`z` 部门最大，我们得到：\n\n```\nA\\left( z\
  \ \\right) = \\frac{a^{\\*}\\left( z \\right)}{a\\left( z \\right)} > 1,\\\\ \\\
  operatorname{}A^{\\\\prime}\\left( z \\right) < 0,\\\\ \\operatorname{}\\omega =\
  \ \\frac{w}{w^{\\*}},\\\\ \\operatorname{}z = 0,\\ldots,1\n```\n\n北方工资相对于南方工资为 `ω`。偏好在个人和国家之间是相同的，并且是柯布-道格拉斯形式，`b(z)`\
  \ 为商品 `z` 的支出份额。此外，`B(z') = ∫0b(z)dz` 且 `B(1) = 1`。\n\n#### 添加贸易成本\n\n贸易受到对称的冰山贸易成本的影响，因此公司必须运送\
  \ `τ > 1` 个单位才能在另一个国家卖出一个单位；国内贸易是无成本的。由于北方商品进入南方市场需要支付 `τ`，南方市场的门槛商品（或边界商品）我们标记为\
  \ `z[S]`，由等价条件 `τ*w*a(z[S]) = w*a*(z[S])` 定义；同样，北方市场的门槛商品 `z[N]` 由 `w*a(z[N]) =\
  \ τ*w*a*(z[N])` 定义。\n\n封闭模型需要相对工资，这由北方劳动力市场均衡条件决定。给定偏好，它是：`wL = w*L*B(z[S]) + wL*B(z[N])`，因为北方消费者在\
  \ 0, …, `z[N]` 范围内购买北方制造的商品，而南方消费者只在 0, …, `z[S]` 范围内购买北方出口。总结一下，三个均衡条件为：\n\n\n\n\
  \n$$\\\\operatorname{}\\\\tau\\\\omega = A\\left( z_{S} \\right),\\\\ \\\\ \\operatorname{}\\\
  \\omega = \\tau A\\left( z_{N} \\right),\\\\ \\\\ \\operatorname{}\\\\omega = \\\
  frac{B\\left( z_{N} \\right)}{1 - B\\left( z_{S} \\right)}\\\\ \\\\operatorname{}\\\
  \\frac{L^{\\*}}{L}\\left( 1 \\right)$$\n\n为了方便起见，我们需要一个简单的二维图，因此通过假设显函数形式将三方程组简化为二方程组。假设对于所有\
  \ `z`，`A(z)=1/z` 且 `b(z)=1`，因此 `B(z′) = z′`。进一步简化来自于假设 `L=L*`。基于这些条件，`z[N] = z[S]τ²`，平衡条件为：\n\
  \n$$\\omega = \\frac{\\tau}{z_{F}},\\\\ \\\\operatorname{}\\\\omega = \\frac{z_{F}}{1\
  \ - z_{F}}\\tau^{2}\\left( 2 \\right)$$\n\n平衡值 `ω` 和 `z[F]` 由图 6.5 左面板中两个条件的交点定义。\n\
  \n![图 6.5 DFS 模型与非贸易商品 ¶ 源：作者阐述。](img/fig0025.jpg)\n\n图 6.5 DFS 模型与非贸易商品 ¶ 源：作者阐述。\n\
  \n右面板显示了 DFS 中经典的非贸易商品分析。向上倾斜的线是北方与南方生产成本之比；由于 `A(z)=1/z`，它是线性的。\n\n*   当北方的相对成本足够低时，尽管存在贸易成本，它在南方市场内部也具有竞争力。这在\
  \ 0 到 `z[S]` 的范围内成立；北方出口这些商品。\n*   当北方的相对成本足够高时，尽管存在贸易成本，南方商品在北方也具有竞争力。这在 `z[N]`\
  \ 到 1 的范围内成立；南方出口这些商品。\n*   处于两个阈值之间的商品是非贸易贸易的。\n\n请注意，该图并没有说明这两个关键问题中的任何一个。贸易并不特别“上行”（出口和进口在价值上必然是平衡的），而且\
  \ `τ` 的减少将以相同的比例带来更多北方和更多南方出口（这一结果确实由平衡条件所保证）。\n\n我们列出这个仅包含商品的模型是为了固定概念和符号。它还为我们提供了一个起点，即大多数贸易都是商品，因此\
  \ `ω` 主要由商品贸易决定。\n\n### 5.2 远程迁移（telemigration）的简单模型：增加服务与服务相关贸易成本\n\n如果我们采用双层柯布-Douglas（Cobb-Douglas）偏好结构，其中\
  \ `γ` 是商品的支出份额（gamma 是 goods 的助记词），那么增加服务就很简单。在这里，我们对服务采取“任务”方法，类似于 Grossman 和 Rossi-Hansberg\
  \ (2006) 的模型。\n\n我们将服务“任务”的相对生产率曲线标记为：\n\n$$S\\left( t \\right) = \\frac{s^{\\*}\\\
  left( t \\right)}{s\\left( t \\right)} > 1,\\\\ \\\\ \\operatorname{}S^{\\prime}\\\
  left( t \\right) < 0,\\\\ \\\\ \\operatorname{}\\\\tau_{S}\\omega = S\\left( t_{S}\
  \ \\right),\\\\ \\\\ \\operatorname{}\\\\omega = \\tau_{S}S\\left( t_{N} \\right)\\\
  \\ \\\\ \\operatorname{}$$ \n\n其中 `s(t)` 和 `s*(t)` 是北方和南方服务“任务”的单位劳动投入系数（`s` 和 `t`\
  \ 分别是 services 和 tasks 的助记词）。最后两个表达式定义了阈任务 `t[N]` 和 `t[S]`，它们划定了非贸易服务的范围。新的劳动力市场清除条件（现在必须包含服务支出）是：`wL\
  \ = γ{w*L*z[S]+wLz[N]} + (1-γ){w*L*t[S]+wLt[N]}`。这简化为：\n\n$$\\omega = \\frac{\\\
  gamma z_{S} + \\left( {1 - \\gamma} \\right)t_{S}}{1 - \\left\\\\{ {\\\\gamma z_{N}\
  \ + \\left( {1 - \\gamma} \\right)t_{N}} \\\\right\\\\}}$$\n\n### 反映服务贸易特性的假设：“曲棍棒”形状\n\
  \n我们在模型中添加了两个元素以适应服务语境。第一，服务的贸易成本非常高——高到至于与该部门规模相比，几乎没有跨境服务贸易。这呼应了这样一个事实：当服务提供者和买方在同一时间的同一房间时，服务提供通常是必要的，或者更容易（而且与移动货物相比，移动人类昂得多）。第二，我们假设比较优势模式解释了这种“模式\
  \ 1”服务贸易大部分由北方出口的高度复杂的服务（金融、工程、通信等）组成。\n\n第一个特征——高服务贸易成本不需要修改模型，只需要不同的参数值。然而，要获得第二个特征需要实质性的改变。具体而言，我们假设\
  \ `S(t)` 曲线具有图 6.6 所示的“曲棍棒”形状。\n\n\n\n\n\n将这一思维转移到服务业领域，情况发生了变化，因为服务业的创新以极其缓慢而闻名。这导致了所谓的**鲍莫尔成本病**（Baumol’s\
  \ cost disease）。芝加哥大学布斯商学院近期对领先经济学家进行的一项调查将其描述为：“由于不同部门之间的劳动力市场是相互连接的，制造业生产率的提高会导致劳动密集型服务成本的上升。”\
  \ Nordhaus (2008) 记录了这一事实。\n\n关键在于，创新的缓慢会导致相对生产率曲线非常平坦，因为缓慢的创新为技术扩散留了足够的时间，以缩小跨部门相对劳动生产率的差异（即使\
  \ `S-curve` 变得）。例外是那些高科技服务任务。这些任务涉及快速创新和对许多复杂事务的协调。正是这使得原本呈“棒球棒”形状的 `1/S(t)` 曲线变成了“曲球棍”形状的\
  \ `1/S(t)` 曲线。特别是，它增加了“刀刃”部分，表明北方在创新快速的高端服务领域具有显著的比较优势。\n\n### 曲球棍型生产率特征的启示\n\n\
  要验证相对生产率特征具有“曲球棍”形状，需要大量的实证研究。然而，在经济学家投入此类研究之前，证明如果这一假设属实，那么相对于传统引力模型分析中假设的标准逻辑斯型曲线，它将意味着引人入胜的可能性。为此，我们在假设曲球棍形状为既定的情况下继续进行分析。\n\
  \n定义阈值任务 `t[N]` 和 `t[S]` 的等价价格条件为 `τws(t[S]) = ws*s*(t[S])` 和 `ws(t[N]) = τws*s*(t[N])`，这意味着：\n\
  \n`τ[S]ω = S(t[S]), ω = τ[S]S(t[N])`\n\n如图 6.6 所示，北方的生产率优势仅高到足以克服一小部分服务任务的贸易壁垒。因此，北方出口索引从\
  \ 0 到 `t[S]` 的服务任务。然而，反向 `S(t)` 曲线变得平坦了，因此南方较低的工资（很大程度上取决于商品市场状况）并不低到足以让南方服务提供者在北方市场具有竞争力。换句话说，南方没有向北方出口服务，因为\
  \ `ω > τ[S]S(1)`：考虑到高贸易成本，没有任何服务任务使得南方方的低工资足以克服其生产率劣势。因此，南方出口某些商品，并从北方进口商品和服务。\n\
  \n商品部门对这个故事至关重要。获得服务不对称贸易的结果需要一个贸易相对自由且比较优势相对对称的商品部门。如果没有这一点，通常的“李嘉工资均衡”将使相对工资推向一个南北双方在某些服务任务中都具有竞争力的点。\n\
  \n最后的变化是调整平衡劳动力市场条件以纳入服务业。对于南北都出口某些服务任务的一般情况，我们将有两个服务阈值。但在图 6.6 的案例中，只有一个，所以：`wL\
  \ = γ{wL*z[S]+wLz[N]} + (1-γ){wL*t[S]+wL*}`，这简化为：\n\n$$\\\\omega = \\frac{\\gamma\
  \ z_{S} + \\left( {1 - \\\\gamma} \\right)t_{S}}{\\gamma\\\\left( {1 - z_{N}} \\\
  \\right)}\\left( 3 \\\\right)$$  \n\n当 `t[S]` 较小时，第二个表达式表明，相对工资主要像经典的 DFS 模型中那样是由商品贸易决定的。\n\
  \n### 5.3 远程迁移（Telemigration）与发展\n\n在这里我们使用模型来引导对远程迁移如何影响全球化的思考。在初始情况下，南方服务任务在北方内部没有竞争力，但存在初期的套利机会。如果北方公司能够——通过某种新的数字技术在不产生贸易成本的情况下购买南方的任务，他们将对大多数任务这样做。例如，如果某些因素保持相对工资不变，但对于北方某个特定的服务生产公司，`τ[S]`\
  \ 变成了 1，那么该公司将发现从南方采购从 `t″` 到 1 的所有任务会更便宜（见图 6.6）。这可能是通常与远程迁移相关的焦虑来源。基于将相对工资视为固定的局部均衡思维，使远程迁移变得更容易的数字技术似乎将带来高工资国家的更多服务业工人与低工资服务业工人进行直接的工资竞争。\n\
  \n### 服务贸易成本降低的贸易后果\n\n图 6.8 显示了服务贸易成本的大幅减少会对服务贸易格局产生什么影响。虚线显示了 `τ[s]` 降到 `τ[s]'`\
  \ 的新情况。这将极大扩大南方服务出口，仅稍微增加北方出口，因此对北方劳动力的相对需求将下降——将平衡相对工资从 `ω(e)` 降至 `ω(e)'`。\n\n\
  ![图 6.8 服务出口的不对称扩张 源：作者说明。](img/fig0028.jpg)\n\n图 6.8 服务出口的不对称扩张 源：作者说明。\n\n这对这一思想实验的一个变体可能与现实有更多的额外接触点，它考虑了远程迁移摩擦的非对称变化。\n\
  \n考虑北方公司不对称地采用必要的数字技术而南方公司未采用的影响。例如，我们可以想象北方的整体经济和数字条件使得南方工人很容易向北方迁移，但“数字鸿沟”使得北方工人很难向南方迁移。在这种情况下，南方出口服务变得容易得多，因为例如北方的数字覆盖和先进水平使得北方公司更容易将远程工人整合到价值链中。\n\
  \n该模型的主要信息是，数字技术为南方远程迁移者带来的出口机会比北方远程迁移者大得多。换句话说，流行辩论中的焦虑可以通过曲球棍形状的服务比较优势特征来解释。\n\
  \n考虑到这种生产率模式，对于高工资国家的许多办公室人员和专业人士来说，远程迁移将成为竞争的新来源，而对于少数高工资工人来说，它将成为机会的新来源。根据图 6.7\
  \ 的“双刃剑”模型，使远程工人不再遥远的快速技术进步创造了巨大的出口机会。\n\n为了完整性，我们求解了商品和服务贸易均无成本时的平衡。^()\n\n\n\n\
  \n\n# 引言\n\n某些可以远程完成的任务未来将由远程移民（telemigrants）而非国内工人来完成，这似乎是不可避免的。同样，这并不是因为可能性的范围发生了巨变——远程移民在网页设计和定制软件开发等领域已经非常普遍。如果这种情况真的发生，将是因为更多公司改变了经营模式以采用这些技术。简而言之，疫情似乎加速了艾兰·布林德（Alan\
  \ Blinder, 2006）在十五年前著名构思的“下一次工业革命”的到来日期。\n\n# 评估外包趋势\n\n本章尝试思考我们如何评估办公室和专业性工作从高工资国家向低工资国家外包增长的规模。评估的起点是认识到，许多可以远程执行的工作需要“软技能”，这使得国内工人和外国工人之间并非完全的可替代关系。因此，远程移民的均衡数量取决于这些任务的潜在外国供应商数量，以及阻碍这些服务贸易的双边摩擦。\n\
  \n我们的量化分析基于两个简单的要素。第一，是将某些服务的贸易解释为对远程移民的报酬，这样可以使用贸易流量的引力模型来描述交易量如何响应贸易成本的降低。我们更新了\
  \ Head, Mayer 和 Ries (2009) 估计的引力回归模型来估算这些量级。第二个要素是通过使用平均工资以及“这些服务的报酬主要是支付给工人的费用”这一假设，粗略地将贸易流量转换为工作数量，以此评估这种贸易的发展潜力。这对于某些类型的服务贸易显然是不成立的——例如使用油管道的费用——但对于“其他商业服务”等类别似乎是合理的，该类别包含了许多可能因远程工作全球化而发生变革的活动。\n\
  \n# 量化与发现\n\n我们的量化练习得出的结论是：对于大多数新兴经济体的发展路径而言，外包工作数量增加不太产生变革性的影响。这一结论源于一个事实和一个经济逻辑。首先，目前“其他服务”的贸易基准非常小，将这些流量乘以二或三并不会转化为大量的工作岗位。其次，假设弹性常量的贸易模型无法对贸易成本的小幅下降产生巨大的反应。\n\
  \n本章的最终贡献是一个简单的远程移民模型，在该模型中，贸易成本的微小变化可以产生巨大影响。关键在于比较优势呈现出“曲棍棒”形状，而非定量贸易模型中假设的对称形状。在这种模型下，新兴市场拥有巨大的出口潜力，而这种潜力在目前的贸易流量中并不明显。\n\
  \n# 未来研究\n\n本章为未来的研究提出了许多问题。它表明，支持远程移民驱动发展的观点将比想象的更加困难。至少，这需要对实证练习进行重大改进。\n\n##\
