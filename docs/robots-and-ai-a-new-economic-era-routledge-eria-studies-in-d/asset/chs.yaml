  \ 1091–1117.\n\n## 附录 A：自动化与离外包的通用模型\n\n我们现在考虑一种更一般的情况，其中生产率在任务和要素之间变化，正如 Grossman\
  \ 和 Rossi-Hansberg (2008) 以及 Acemoglu 和 Restrepo (2018) 中的离外包和自动化模型一样。任务分配给要素以实现成本最小化：\n\
  \n$$p_{i} = \\min\\left\\{ {\\frac{w_{s}}{a_{s,i}},\\frac{w_{n}}{a_{n,i}},\\frac{r}{a_{r,i}}}\
  \ \\right\\}.$$\n\n使用 `p[i]`，我们可以求出每个任务的输出：\n\n$$\\begin{array}{rcl} x_{s,i} & =\
  \ & \\frac{a_{s,i}L_{s}}{m_{s}} \\\\ x_{n,i} & = & \\frac{a_{n,i}L_{n}}{m_{n}} \\\
  \\ x_{r,i} & = & {\\frac{a_{r,i}Y}{r}.} \\\\ \\end{array}$$\n\n将这些量代入 (1)，我们得到 (6)，其中\n\
  \n$$a_{x} \\equiv \\exp\\left( {\\int_{i \\in N_{x}}\\frac{\\ln a_{x,i}}{m_{x}}\\\
  text{d}i} \\right)$$\n\n现在是内生的，并且等于要素 `x \\in {s, n, r}` 执行的任务 `N[x]` 的平均生产率。方程\
  \ (7) 和 (9) 仍然有效。在这个模型中，自动化冲击是某些 `a[r,i]` 的增加。这可以增加 `m[r]`（扩展边）、`a[r]`（密集边）或两者兼顾。反过来，`m[r]`\
  \ 或 `a[r]` 的变化也会影响任务分配。在保持 `m[r]` 不变的情况下，`a[r]` 的增加有利于所有要素。这是自动化最温和的形式，对应于没有替代的技术进步。在保持\
  \ `a[r]` 不变的情况下，`m[r]` 的增加会替代工人。通用模型显示 `m[r]` 和 `a[r]` 可能同时变化。自动化可以降低替代工人的相对工资，这一结论仍然成立，因为替代对工资的影响没有改变。然而，生产率的影响在更一般的模型中可能更弱或更强。\n\
