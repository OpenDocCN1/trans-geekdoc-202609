  \ Krueger (2013)。两者均经过标准化处理，使得均值为 0，标准差为 1。\n\n### 3.1.2 衡量选择性\n\n我们从失业持续时间、错配以及特定任务中专业知识的集中程度来衡量“选择性”。我们通过职业在各部门间就业的集中程度来捕捉后者。根据\
  \ Costinot 和 Vogel (2010) 的观点，核心理念是：虽然一个部门可能涵盖丰富的职业种类，但这些职业中包含一个“核心”职业子集，这些职业在该部门内的集中程度不成比例。虽然集中度的变化可能由许多并发因素决定，但由高自动化性或高离外包性引发的集中度增加，仍与我们所寻找的选择性渠道一致。具体而言，令\
  \ `O = {o*[1],⋯,o*[92]}` 为职业集合，`K = {k*[1],⋯,k*[11]}` 为部门集合，`I = {i*[1],⋯,i*[13]}`\
  \ 为样本中的国家集合。考虑国家 `i` ∈ `I` 中部门 `k` ∈ `K` 的职业 `o` ∈ `O`，其就业人数表示为 `L[oki]`。我们职业 `o`\
  \ 在国家 `i` 各部门 `k` ∈ `K` 的就业集中度衡量由 Herfindhal 指数给出：\n\n$$\\begin{array}{r} {SSO\\\
  _{oi} = \\sum\\limits\\_{k \\in \\mathcal{K}}\\left( \\frac{L\\_{oki}}{\\sum\\_{k\
  \ \\in \\mathcal{K}}L\\_{oki}} \\right)^{2},} \\\\ \\\\ \\end{array}$$\n\n(1)\n\n\
  其中 SSO 是“职业部门选择性”的记忆缩写。关于公式 (1) 有两点说明。首先，由于每个职业都出现在每个部门中，SSO 的一个关键特征是它没有经过标准化处理以考虑估计中所使用的部门数量。为了理解这一点，假设某项职业在\
  \ 1995 年在五个不同部门中被观察到，但在 2010 年从其中一个部门消失，且此前在该部门的就业人数平均分配到其他四个部门。因此，该职业在各部门的就业分布在\
