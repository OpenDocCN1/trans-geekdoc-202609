  \ 是特定职业 `o` 中新增且与 AI 相关的职位占比，从而推导出特定职业中用于从事新增 AI 相关工作的小时比例。`V.2` 职业定义的未报告数据非常相似。第一个面板显示了所有通勤区在\
  \ AI 相关职业中的就业占比，先是男性后是女性；第二个面板显示了在 AI 相关职业就业的外出生工人占通勤区总人数的比例；第三个面板显示了在 AI 相关职业就业的本土出生工人占通勤区总人数的比例。\n\
  \n数据中显现出三个模式。第一个是通勤区在 AI 相关活动方面的专业化具有持续性。在每张图中，2000 年和 2018 年通勤区在 AI 相关工作中的就业占比之间存在强正相关性，这从点沿\
  \ 45 度线聚集的情况可以看出。大多数点中度或大幅地高于该线，表明 AI 相关活动的区域专业化随时间推移不断加强。第二个是，跨越通勤区和时间推移，男性在 AI\
  \ 相关活动中的专业化倾向往往远于女性。男性的 AI 就业占比往往是女性的二到三倍。这种模式与男性在各职业中 STEM 相关工作上相对较高的专业化程度一致（例如，2018\
  \ 年）。\n\n第三个模式涉及不同通勤区本土出生与外出生在 AI 相关活动专业化方面的差异。在考虑第一个面板中的所有工人时，AI 相关活动的专业化在三类通勤区最强：高科技产业枢纽（例如加州圣何塞）、大学城镇（例如伊利诺伊州布鲁明顿）以及专门从事政府或军事研究的城市（例如科罗拉多州科罗拉斯普林斯）。当我将外出生本土工人分开后，发现在\
  \ AI 相关活动的专业化方面，这两组工人倾向于聚集在不同的地方。外出生工人从事 AI 相关活动占总就业的比例在传统高科技枢纽（`加州圣何塞`；`加州奥克兰`；`德克萨斯州奥斯汀`；`马萨诸塞州波士顿`；`华盛顿州西雅图`）和大纽约（`纽约`）最大。相比之下，本土出生工人在\
  \ AI 相关活动中占总就业的比例在拥有政府或军事设施的地点（`科罗拉多州亚历山斯普林`；`弗吉尼亚州亚历山大略`；`阿拉巴马州亨茨维尔`）或大学城镇（`伊利诺伊州布鲁明顿`；`犹他州普沃`）最高。对于男性和女性，AI\
  \ 专业化排名前 10 的通勤区重合的包括`华盛顿特区`和`北卡罗来纳州罗利`。由于政府和军事研究通常需要高级安全许可，本土出生工人可能更有这些这些职位。\n\n\
