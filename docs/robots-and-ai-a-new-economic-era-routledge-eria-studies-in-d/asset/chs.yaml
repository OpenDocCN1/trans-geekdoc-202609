  \ 10.6 的注释。\n\n## 5 创造性破坏 (Creative Destruction)\n\n我们首先回顾关于估计新产品福利收益和产品变化的文献。这将为实证研究提供动力。随后我们对创造性破坏进行简要回顾。\n\
  \n### 5.1 新产品的福利收益\n\nFeenstra (1994) 考虑具有替代弹性 `σ` 的消费者。他解释了如何构建支出函数，以及在存在任意冲击（如\
  \ AI 的引入或贸易自由事件）导致品种变化的情况下如何进行福利分析。令 `E[t−1]` 和 `E[t]` 为冲击前后的支出函数。他现在著名的公式是：品种变化对福利的影响由\
  \ `E[t]/E[t−1]` 表达式中的额外乘项捕捉。该额外项构建如下：\n\n```\nλ_t = 1 - \\frac{expenditures on new\
  \ varieties (available in t but not t - 1)}{expenditures on all varieties that are\
  \ available in t}\n```\n(3)\n\n则额外乘项为：\n\n```\n\\left( \\frac{λ_{t}}{\\λ_{t - 1}}\
  \ \\right)^{-1/(\\sigma - 1)}\n```\n(4)\n\nFeenstra (2010, ch. 2) 对这一结果进行了良好的回顾。在该公式中，可以将\
  \ `λ[t]` 和 `λ[1]` 分别解释为实际数据和反事实数据。例如，方程 (4) 可以与 Arkolakis, Costinot 和 Rodriguez-Clare\
  \ (2012) 中的熟悉结果相关。将新品种重新解释为进口商品，`λ[t]` 是国内品种的支出份额。令 `λ[t−1] = 1` 为自足反事实下的国内支出份额，方程\
  \ (4) 简化为 `(λ[t])^{-1/(σ−1)}`。这是从自足状态到现有-*t* 期贸易限制的常用 Arkolakis 等 (2012) 贸易收益公式。同样，我们将\
  \ `λ[t]` 解释为有 AI 世界的实际数据，并将 `λ[t−1]` 解释为没有 AI 世界的反事实。\n\nBroda 和 Weinstein (2006)\
  \ 是方程 (4) 在国际贸易中的重要实证应用。他们发现，从 1972 年到 2001 年，通过进口提供美国消费者的新品种数量增加了三倍，这带来了相当于 GDP\
  \ 2.6% 的福利收益。Feenstra (2010, Table 2.1) 发现，如果世界上所有国家从自足状态转变为 1996 年的贸易水平，福利收益将相当于全球\
  \ GDP 的 12.5%。进一步讨论见 Melitz 和 Trefler (2012)。Melitz (2003) 模型将企业级选择引入到关于品种为何会被国际贸易创造和破坏的讨论中。贸易减少了国内品种的数量并增加了外国品种的数量。净影响是不定的。Hsieh\
  \ 等人 (2020) 重新审视了 Broda 和 Weinstein (2006) 的分析以及 Trefler (2004) 对加加美自由贸易协定的分析，显示品种变化的净影响为负。\n\
  \n### 5.2 创造性破坏的福利收益\n\n前一小节处理的是基于 CES 的。由于 CES 商品是互补品，更多的品种优于更少的品种。另一种方法强调垂直差异商品，即按质量区分的商品。垂直差异是通过创造性破坏增长的模型的基础。通过创新，企业可以用其更高质量的商品替代现有的低质量商品来产生利润。这一过程被称为*创造性破坏*。封闭经济模型见\
  \ Aghion 和 Howitt (1992) 以及 Akcigit 和 Kerr (2018)，开放经济模型均见 Grossman 和 Helpman (1991*a,b*)。Aghion,\
  \ Bergeaud, Boppart, Klenow 和 Li (2019) 探索了创造性破坏衡量美国增长的作用。虽然他们的主要实证论文将创新视为外生，但他们提供了与方程\
  \ (4) 相关的公式。我们现在估计 AI 对创造性破坏的影响，并将估计值代入方程 (4) 以生成福利计算。\n\n\n\n\n### 5.3 全球经济中的 AI\
  \ 与创造性破坏：初步观察\n\n在本小节中，我们查看了关于 AI 和创造性破坏的原始数据，即新 App 和旧 App 的下载份额如何受 AI 的影响。考虑一个类别\
  \ `c` 中被国家 `m` 下载的 App。如果一个 App 在 `t` 年被下载，但在 `t - 1` 年没有，则它在 `t` 年是“新的”。如果一个 App\
  \ 在 `t - 1` 年和 `t` 年都被下载，但在 `t + 1` 年没有，则它在 `t` 年是“正在退出的”。如果一个 App 在 `t - 1` 年、`t`\
  \ 年和 `t + 1` 年都被下载，则它在 `t` 年是“持续的”。对于每个 `cmt` 三元组，令 `Ω[cmt]^(n*)`、`Ω[cmt]^(e*)`\
  \ 和 `Ω[cmt]^(c*)` 分别为 `n`ew（新）、`e`xiting（退出）和 `c`ontinuing（持续）App 的集合。\n\n令 `ω`\
  \ 索引 App，并令 `ycmt` 为 `t` 年国家 `m` 在类别 `c` 中 App `ω` 的下载量。对于每个 `cmt` 三元组，令 `y[cmt]^(k*)\
  \ ≡ ∑[ω ∈ Ω[m]^(k*)]ycmt` 为类型-*k* 的下载量，其中 `k` 索引新 App (`k = n`)、退出 App (`k = e`)\
  \ 或持续 App (`k = c`)。所有 App 均仅属于这三种类型中的一种。类型-*k* App 下载的份额为：\n\n$$\\begin{array}{r}\
  \ {\\\\theta_{cmt}^{k} = \\frac{y\\_{cmt}^{k}}{\\sum\\_{k^{’}}y\\_{cmt}^{k^{’}}}\
  \ = \\frac{\\text{country} m\\text{s}\\text{downloads}\\text{of}\\text{type-}k\\\
  text{Apps}\\text{in}\\text{category} c\\text{and}\\text{year} t}{\\text{country}\
  \ m\\text{s}\\text{downloads}\\text{of}\\text{all}\\text{Apps}\\text{in}\\text{category}\
  \ c\\text{and}\\text{year} t}\\operatorname{}.} \\\\ \\end{array}$$\n\n(5)\n\n分母是\
  \ `cmt` 的总下载量（包括国产 App 的下载量）。由于这些份额是用 `t - 1` 和/或 `t + 1` 年的数据计算的，我们舍弃第一年和最后一年的\
  \ `θ[cmt]^(k*)`，并采用 `t = 2015, …, 2019`。\n\n关注 AI 如何影响 App 的进入 (`θ[cmt]^(n*)`) 和退出\
  \ (`θ[cmt]^(e*)`)。虽然我们关注的是 `cmt` 层面的消费情况，但我们的 AI 部署衡量衡量的是 `cxt` 层面的产出情况。因此，对于每个进口国\
  \ `m` 和 App 类别 `c`，我们对向 `m` 出口的出口国 `x` 取 `AI[cxt]` 的平均值。我们使用与 `m` 的 `c` 下载量成比例的加权平均。正如国际贸易中，我们将利用\
  \ `c` 的出口国构成在不同进口国 `m` 之间的变化，例如，越南从（微信）进口社交网络，而加拿大从（Facebook）进口社交网络。在数学上，令 `w[cmxt]\
  \ ≡ y[cmxt]/∑[x′]y[cmxt′]` 为 `m` 的下载量源自国家 `x` 的份额。（再次，我们包含了国内下载量 `m = x`）。那么我们的关键进口国层级变量为：\n\
  \n$$\\begin{array}{rc} {AI_{cmt}} = \\sum_{x}w_{cmxt} \\cdot AI_{cxt}}\\\\end{array}$$\n\
  \n(6)\n\n表 10.11 报告了关于创造性破坏的一些基础统计。我们的数据中有 78,741 个类别-进口国-年份 (`cmt`) 观测值，包含了零下载的观测值。表\
  \ 10.11 的左面板报告了是否存在进入 (`θ[cmt]^(n*)>0`) 以及是否存在 AI 部署 (`AI[cmt] > 0`) 的交叉分类表。在有 AI\
  \ 部署的观测值中，91% 存在某些品种进入。相比之下，在没有 AI 部署的观测值中，只有 66% 存在某些品种进入。因此，AI 与新品种的进入（非因果）相关。表\
  \ 10.11 的右面板使用退出重复了实验。在有 AI 部署的观测值中，83% 存在某些品种退出。相比之下，在没有 AI 部署的观测值中，只有 49% 存在某些品种退出。AI\
  \ 与品种的退出相关。综合来看，这两个结果指向了 AI 部署对进入和退出——即对创造性破坏的作用。\n\n| 按 AI 部署状态划分的类别-进口国-年份对数量\
