  \ |\n\n\n\n\n\n本节将我们对机器人的分析扩展到 AI。我们假设 AI 可以执行高技能劳动力的任务 `H`[`nst*]`，并以机器人替代低技能工人的相同方式重新表述生产函数\
  \ `(3)`。\n\n与作为特殊资本的机器人不同，我们将 AI 视为用户订阅的服务。因此，我们直接计算每个国家在 AI 上的支出，以推导出 AI 在高技能任务中的占比。然而，困难在于我们没有此类支出的数据，特别是关于\
  \ AI 的支出。AI 贸易在 GTAP 数据库中被记录为通信部门贸易的一部分，其中包括邮政服务、电影电影等。\n\n为了找到通信部门中合适的 AI 占比，我们提出了一个大胆的假设：在\
  \ AI 安装量最多的行业（即“所有其他非制造业分支”，`IFR` 行业 `14`），AI 的全球平均占比等于 `0.002`，这与机器人安装最多的行业的全球平均占比相等。使用世界投入产出数据库（`WIOD`）`2016`\
  \ 版本，我们计算了通信部门“计算机编程、咨询及相关活动；信息服务活动”的贸易份额。当这些份额中仅有 `1.5%` 与 AI 相关时，AI 安装量最多的行业的全球平均占比等于\
  \ `0.002`。\n\nTable 5.10 AI 与高技能劳动力之间的替代弹性\n\n| IFR | 描述 | `σ[AL]` | 稳健标准误 | 第一阶段\
