  \ 1993 年的水平，中国、韩国和美国的技能溢价将会降低，这支持了全球化导致工资不平等的观点。但全球化似乎缓解了其他国家的工资不平等。\n\n然而，这里最引人目的结果是，贸易的影响通常远大于机器人技术。这是因为\
  \ 2014 年的机器人份额仍然小（如表 5.3 所示），因此对劳动力市场的影响是有限。\n\n\n\n\n\n尽管机器人技术对整体经济的工资影响较小，但它对某些行业可能会产生重大影响。表\
  \ 5.7 显示了 1993 年至 2014 年间每个国家安装机器人数量最多的行业，以及这些行业中就业低技能工人数量的变化。汽车工业、塑料和化学工业，以及电气、电子和机械行业受到的影响最为严重。如果机器人技术仍停留在\
  \ 1993 年的水平，中国、印度和泰国等国在相应行业中的低技能工人数量将高得多。值得强调的是，在安装大量机器人的行业之一汽车行业，根据我们的模拟，机器人技术在全球范围内取代了\
  \ 213,092 名低技能工人，而贸易自由化则取代了 504,859 名工人。在汽车行业中，机器人技术的劳动力替代效应相当大，几乎是贸易效应的一半。\n\n\
