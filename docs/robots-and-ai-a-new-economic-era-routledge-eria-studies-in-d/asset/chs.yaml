  \n## 3 AI 与贸易：双边引力模型\n\n我们估计以下引力方程：\n\n\n\n\n\n$$\\begin{array}{r} {\\ln\\left(\
  \ y_{cmxt} \\right) = \\beta\\ln\\left( 1 + AI_{cxt} \\right) + \\theta X_{cmxt}\
  \ + \\alpha_{mxt} + \\alpha_{cm} + \\varepsilon_{cmxt};.} \\\\ \\end{array}$$\n\n\
  #### (1) 回归分析\n\n在回归中，`y[cmxt]` 是国家 `m` 的消费者对总部位于国家 `x` 的公司生产的 `c` 类 App 下载量。在本部分中，我们关注国际贸易，因此排除了国内观测值，即进口国等于出口国的观测值。包含这些观测值不会影响我们的结论。由于我们只包含了非零流量，因此\
  \ `y[cmxt] \\geq 1`。我们的核心独立变量是 `ln(1+ AI[cxt])`，我们的假设是 AI 部署会增加贸易（`β > 0`）。`X[cmxt]`\
  \ 是一组重力变量。`α[mxt]` 和 `α[cm]` 是固定效应。在仍能识别 `β` 的情况下，我们可以添加的另一个固定效应是 `α[cx]`。添加这些变量会削弱我们的结果，因为\
  \ `ln(1+ AI[cxt])` 随时间的变化相对有限。除此之外，我们的结果对固定效应的选择完全并不敏感。\n\n**表 10.6 重力方程：独立变量为 `ln(y[cmxt])`**\n\
