  \n## 5 结论\n\n在本章中，我们研究了在外包存在的情况下自动化（通过工业机器人采用）的影响。文献大多孤立地研究这些现象，这非常遗憾，因为我们所证明的，外包可以以重要方式改变自动化的影响。特别是当机器人差异化影响国内生产和国外来源的任务时，自动化会产生贸易效应，从而在国家间重新分配收入。这具有重要意义。虽然替代外国工人对国内经济来说是有益的，但自动化替代国内生产的任务可能会通过贸易条件的恶化来降低国内工人的实际工资。\n\
  \n\n\n\n\n这些结果强调了识别哪些工人与机器人存在更直接竞争的竞争性，并为本章开展的实证分析提供了动力。我们利用跨行业、职业和当地劳动力市场的美国数据，研究了\
  \ 1990–2015 年期间自动化与外包之间的相互作用。我们的结果表明，工业机器人确实取代了美国制造业的工人，但在对外包敞口程度更高的 `CZs`（核心统计区）中，这种影响较较弱。我们还发现，工业机器人降低了外包的发生率，且其对就业的负面影响集中在执行归类为不可外包任务的职业中。这些结果与以下观点一致：自动化有助于经济活动的回流，这反过来往往缓解对美国工人的劳动力市场任何负面影响。\n\
  \n最后，我们讨论了本研究分析的一些局限性及可能的扩展。本章的实证结果完全基于美国数据。然而，我们认为研究美国自动化对低工资国家的影响同样重要。与我们的结果一致，一些论文倾向于发现发展中国家的劳动力市场结果受到负面影响（例如，参见\
  \ Faber, 2020; Artuc, Christiaensen and Winkler, 2019; Stemmler, 2019; Kugler et\
  \ al. 2020）。然而，结合跨国数据来直接识别自动化的贸易条件效应将是理想的。我们认为这是未来的一个的一个方向。\n\n从规范性角度来看，自动化可能跨国重新分配收入的结论意味着，政策制定者可能会推动采用能够降低对外国投入依赖的技术。然而，这种努力可能导致一种低效率的均衡，即过度自动化而贸易过少。事实上，我们推测外国竞争甚至可能是采用旨在自给自足政策的触发因素。探索这种情景及可能的补救措施超出了本文的范围，但似乎是未来研究另一个重要且有趣的途径。\n\
  \n## Notes\n\n我们感谢 Philippe Aghion, Italo Colantone, Pascual Restrepo, Yu Zheng\
