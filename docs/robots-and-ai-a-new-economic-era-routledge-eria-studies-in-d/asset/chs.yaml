  \n这些平均影响可能会掩盖不同类型发展国家之间的异质性。虽然用于量化贸易模型的投入产数据无法可靠地模拟广泛范围内发展中国家的细粒度国家级异质性，但我们可以使用之前概述实证方法检查不同类型的国家受到影响。在一个新的扩展中，我们根据收入水平和地区在子样本中分别运行了之前的模型。\n\
