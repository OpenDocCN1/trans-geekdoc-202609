  \ CZ（指定性别、主要年龄、受过大学教育的工人）的就业情况进行加权。\n\n# 8 机器人与贸易：对发展中国家的影响\n\nErhan Artuc, Paulo\
  \ Bastos, Alexander Copestake 和 Bob Rijkers\n\nDOI: [10.4324/9781003275534-8](https://doi.org/10.4324/9781003275534-8)\n\
  \n## 1. 引言\n\n现代工业机器人能够以一致的精度执行各种重复任务，并越来越多地应用于广泛的行业和领域。去年全球工业机器人运行量达到了 270 万台的历史新高（IFR,\
  \ 2020），预计机器人采用率将稳步增长。工业生产自动化的加速加剧了人们的担忧，即大部分劳动力（尤其是低技能工人）可能面临工资下降和工作流的风险（例如 Bloom\
  \ 等，2018）。这些恐惧部分程度上源于 OECD 国家的经验，在这些国家，机器人的采用促进了生产率增长，但代价是低技能工人的就业份额和工资（Graetz and\
  \ Michaels, 2018; Acemoglu and Restrepo, 2020）。最近的估计显示，OECD 地区约 14% 的工作面临因自动化而消失的风险，而另\
  \ 32% 的工作可能会发生重大变化（OECD, 2018）。\n\n虽然机器人化在发达经济体中为显著，但发展中国家的工人也可能面临风险。机器人替代性很好的低技能工人不成比例地分布在发展中国家。机器人化可能会使生产更贴近高收入市场的消费者，并损害工业化和出口导向型的发展前景（Rodrik,\
  \ 2018; Hallward-Driemeier and Nayyar, 2019）。发展中国家特别容易受到自动化引发贸易下降的影响，因为贸易和通信障碍的减少允许将重复性和劳动密集型任务外包到低工资国家（Grossman\
  \ and Rossi-Hansberg, 2008; Antras, 2015; 世界银行, 2020）。低收入国家可能缺乏实质性参与新兴全球价值链所需的技能和基础设施，因为自动化降低了低劳动力成本作为国际竞争力决定因素的重要性（Rodrik,\
  \ 2018）。\n\n在本章中，我们首先使用李嘉图框架来考察发达国家机器人化对发展中国家的影响。借鉴 Artuc, Bastos 和 Rijkers (2018)\
  \ 的研究，我们在第 2 节中提出了理论和证据，表明高工资发达经济体的机器人采用促进了发达国家与发展中国家之间的贸易。我们强调，这种采用最终可以使发展中国家的受益，特别是通过降低价格增加对中间投入的需求。机器人化的影响取决于机器人化的程度。在第\
  \ 3 节中，我们通过将中国显式引入模型扩展了这一框架，注意到其机器人存量迅速扩张并成为全球最大。我们分析了 Cheng 等 (2019) 所述的中国机器人补贴的影响，并发现对中国工人工资的影响取决于补贴规模。有趣的是，随着中国增加对机器人的补贴，其比较优势模式与\
  \ OECD 国家越来越相似，这减少了与它们的贸易。相反的结论适用于中国与发展中国家之间的贸易。\n\n我们采用的李嘉图框架关注长期效应和总体效应，并忽略了调整成本。在短期内，工人无法自由跨部门、地区和职业。在第\
  \ 4 节中，我们考虑了关于发达国家机器人化对发展中国家工人影响的更广泛经验证据。除了支持李嘉图模型的长期预测外，我们还记录了中等收入国家当地劳动力市场的负面就业影响，特别是对于那些现在可以由机器人执行任务的工人。对当地劳动力市场的负面影响凸显了政策在自动化转型期间缓解分配问题的作用。我们还不仅限于静态，注意到发达国家的自动化可能会通过阻碍高增长潜力部门的投资而加剧“过早去工业化”（Rodrik,\
  \ 2016）。这反有助于解释一些发展经济体（特别是中国）机器人补贴的出现。\n\n此外，机器人的动力可能不仅是机器人与工人之间的相对价格。在每个国家内部，规模较大且通常低密集型的公司更有可能负担生产技术升级的固定成本，而参与复杂生产网络的公司可能赋予机器人带来的精度和可靠性更高的价值。因此，在第\
  \ 5 节中，我们超越了相对价格，提供了关于发展中国家公司层面采用因素的新证据；而在第 6 节中，我们考虑了这种采用对公司层面结果的影响。我们的经验分析基于十个发展中国家的公司层面数据。我们发现了对规模和精度假设的支持，与发达国家的公司层面证据一致。在采用机器人后，这些最初较大且全球联系更紧密的公司往往进一步扩张。这些公司层面机制有助于解释为什么我们观察到发展中国家的机器人采用比理想化李嘉图模型预测的更多、更快。但它们也为分配担忧增加了公司因素：受到威胁不仅是相对弱势的工人，还包括规模较小、生产率较低、国际活跃度较低的公司。鉴于低技能工人不成比例地在这些公司工作，双重威胁是政策制定者需要考虑的关键问题。\n\
  \n\n\n\n最后，我们对自动化为发展中字带来的这些机遇与挑战进行了总结。从长远来看，发达国家的工业机器人可能会促进先进国家与发展中国家之间的贸易，并增强全球福利。尽管中国机器人化程度的提高（部分由补贴驱动）可能会缩小与先进经济体之间的生产率差异，从而减少与它们进行跨行业贸易的收益，但这并不阻碍低收入国家未来工业化和出口驱动型增长的前景。然而，先进国家和发展中家的技术变革都需要劳动力市场调整，并可能引发严重的分配紧张局势，这种紧张并不局限于过渡期。当机器人在许多能力上追赶人类时，政策必须跟上其应用步伐。\n\
  \n## 2. 发达经济体机器人化对发展中家的意义\n\n借鉴 Artuc、Bastos 和 Rijkers (2018) 的研究，我们首先使用李嘉框架考察了发达国家机器人化对发展中家的影响。我们首先考察了国家和行业层面机器人采纳的驱动因素（参见图\
  \ 8.1）。高工资富国家倾向于使用更多机器人（图 A），这表明成本节省的潜力是采纳的一个重要决定因素。不同行业之间可替代岗位的比例存在巨大差异（根据 Graetz\
  \ 和 Michaels (2018) 的方法，通过涉及可能由机器人执行的任务的职业份额来计算），这确实预测了实际实现的机器人密度（图 B）。\n\n受这些模式的启发，该多国、多部门的李嘉模型具有以下特征：(i)\
  \ 北方劳动力成本较高，以及 (ii) 行业特有的机器人化前沿（即人类被机器人替代的任务范围在不同部门间有所不同）。()\n\n在模型中，生产中间品和最终品所需的一部分任务可以由工人执行，也可以由机器人执行，而其他任务只能由人类完成。机器人可以执行的任务范围在不同部门间不同。行业特定的机器人化前沿、相对要素价格和生产率决定了部门内部机器人的使用程度。每种最终品品种的生产还需要一种来自同一行业的复合中间品。在均衡状态下，中间投入品和最终品的品种源自供应价格最低的国家。因此，存在两层竞争：(1)\
  \ 要素市场中机器人与工人之间的竞争；以及 (2) 国家之间在特定部门产品市场中投入和产出的竞争。() ![图 A: 富裕国家机器人采纳率较高](img/fig0039.jpg)\n\
  \n图 A: 富裕国家机器人采纳率较高\n\n![图 B: 可实现自动化的部门采用更多机器人 图 8.1 跨国家和部门的机器人化 ¶ 注：图 A 展示了按国家划分的平均机器人密度（多年平均）与初始人均\
  \ GDP 的关系。图 B 展示了按部门划分的平均机器人密度（跨国家和多年平均）与行业内可替代岗位份额之间的关系，后者根据 Graetz 和 Michaels\
  \ (2018) 的衡量方法，使用了 1980 年美国人口普查中跨职业和行业的工时分布。机器人密度定义为每百万小时工时使用的机器人数量加 1 的对数。¶ 溯来源：Artuc,\
  \ Bastos and Rijkers (2018)。](img/fig0040.jpg)\n\n图 B: 可实现自动化的部门采用更多机器人 跨国家和部门的机器人化\
  \ ¶ 注：图 A 展示了按国家划分的平均机器人密度（多年平均）与初始人均 GDP 的关系。图 B 展示了按部门划分的平均机器人密度（跨国家和多年平均）与行业内可替代岗位份额之间的关系，后者根据\
  \ Graetz 和 Michaels (2018) 的衡量方法，使用了 1980 年美国人口普查中跨职业和行业的工时分布。机器人密度定义为每百万小时工时使用的机器人数量加\
  \ 1 的对数。¶ 溯来源：Artuc, Bastos and Rijkers (2018)。\n\n在模型中的许多国家中，全球机器人价格的下降最初导致了北方国家的机器人化，其定义为初始劳动力成本较高的国家。()\n\
  \n两阶段生产结构有助于我们区分中间投入和最终品的比较优势模式，以及需求差异。北方国家的机器人化提高了两个生产阶段的生产率，但并不一定会减少对南方投入的需求，因为规模效应可能会主导替代效应。\n\
  \n在 1995 年至 2015 年间，生产效应似乎占据了主导。事实上，Artuc、Bastos 和 Rijkers (2018) 的实证结果显示，进口激增集中在零部件等中间品上。为了衡量机器人化与南北贸易之间的关系，实证分析结合了来自国际机器人联合会的机器人数据、来自\
  \ KLE 的 的动力数据以及 1995-2015 年来自 CEPI 的贸易数据。估计了以下基准设定：\n\n```\nTrade[nmit] = β Robots[nit]\
  \ + Ψ[nmt] + Λ[it] + ϵ\n```\n(1)\n\n其中 `Trade[nmit]` 表示 `t` 年从发达国家 `n` 到发展中国家 `m`\
  \ 的 `i` 部门出口对数；或者，表示 `t` 年来自发达国家 `n` 的 `i` 部门进口对数；`Robots[nit]` 表示 `t` 年国家 `n` `i`\
  \ 部门的机器人使用衡量；`Ψ[nmt]` 表示出口进口年份固定效应；`Λ[it]` 表示行业年份固定效应；`ϵ` 为误差项。方程 (1) 包含了出口进口年份固定效应，以允许特定的冲击（如汇率波动）并控制国家对特定的贸易决定因素（如距离、共同语言等）。它进一步包含了行业年份固定效应。标准误按发达国家进行聚类。为了解决机器人化与贸易之间可能存在的反向因果关系，以及由遗漏变量或测量误差引起的潜在偏差，采用了工具变量法。具体而言，该分析使用每个部门中从事可替代任务的工人预定份额、国家初始人均收入与全球机器人存量的三重交互作为机器人化的工具变量。()\n\
  \n工具变量估计显示，北方机器人化行业的机器人密度增加 10%，会使其对南方的出口增加 11.8%。令人惊讶的是，它还导致其在同一大部门内的南方进口增加了 6.1%。后者主要由零部件和组件的进口驱动。()\n\
  \n考虑到这些模式，机器人价格的进一步下降可能如何影响全球贸易、工资和福利？为了回答这个问题，该李嘉模型对三个国家和三个部门进行了校准。具体而言，定量模型包含一个代表性的高收入北方国家、一个代表性的南方国家以及一组其他（低收入）发达国家。()\n\
  \n\n\n\n\n模拟未来机器人价格下降的影响提供了若干点见解，这些见解在图 8.2 所示。随着机器人价格下降，面临高工资的北方生产者将逐渐采用更多的机器人（面板\
  \ A）。当价格进一步下降时，对于面临较低劳动成本的欠发达国家来说，机器人化生产也变得有利。机器人的采用与自动化部门工作数量的最初减少有关（面板 B）。然而，一旦所有可自动化的任务都由机器人完成，机器人价格的进一步降低将增加机器人化部门对劳力的需求，因为它们提高了这些部门工人的生产率。因此，自动化对就业的影响取决于状态：在采用的早期，工业机器人与工人竞争竞争；而在随后的阶段，它们与工人形成互补关系，因为我们假设可自动化的任务范围是固定的。这也解释了北方和“其他”地区机器人价格与工资之间的\
  \ U 型关系（面板 C）。\n\n转到贸易流，随着机器人化行业的北方生产者需要越来越多的中间投入以实现其生产规模的扩大（如图 8.3 面板 A 所示），它们对南方中间品出口的需求激增（面板\
  \ B）。\n\n![面板 A: 机器人化行业中的机器人使用](img/fig0041.jpg)\n面板 A: 机器人化行业中的机器人使用\n\n![面板 B:\
