  \ 人口普查数据。 |\n\n在表 2.4 所示工具变量回归中，当我们考虑第 (1) 到 (4) 列的广义控制变量时，机器人暴露的系数是显著的。第 (1) 列从没有任何控制的回归开始，并发现负面影响：每\
  \ 1000 名工人增加一个机器人会导致就业人口比下降 1.317 个百分点。第 (2) 列增加了 ICT 和进口暴露的控制变量，幅度保持不变。然后，第 (3)\
  \ 列和第 (4) 列分别测试了人口统计特征和广义区域虚拟变量的影响，结果几乎不受影响。在第 (5) 列中，仅添加制造业份额的控制变量就足以使其失去显著性并大幅减少点估计值。该结果再次强调了控制广义行业趋势的重要性，正如\
  \ Borusyak 等人 (2021) 所强调的那样。\n\n通过结合不同的控制集，第 (6) 到第 (8) 列的设定得出了负且在统计学上显著的 IV 估计。在第\
  \ (9) 和第 (10) 列中，我们将广义行业份额控制变量替换为通勤区域内制造业特定行业份额的控制变量。具体而言，我们控制了期末机器人数量最多的三个两位代码行业，这些行业占了\
  \ 2014 年机器人总数的 74%：汽车、橡胶和食品工业。这些是构建指数的关键行业。系数保持较大且为负值；由于这些控制变量导致了更大的标准误，它们变得不显著。\n\
  \n因此，来自 IFR 行业层面数据的 OLS 和 IV 证据表明，机器人对劳需求有负面影响，尽管由于用于识别变异来源的行业较少，结果对控制变量的选择敏感。此外，在汇总就业区域层面，机器人化对就业产生负面或不显著影响的可能与关于自动化与就业的“新观点”或“旧观点”一致。事实上，这一结果可能反映了以下事实之一：机器人企业消除了职位，而这种直接影响并没有通过工资降低和随之产生的新活动的反向一般均衡效应完全抵消；或者反映了企业层面自动化的正向市场规模效应被非自动化企业的职位流失所超过抵消了。\n\
  \n### b. 企业级和工厂级分析\n\n为了缓解研究设计的局限性并找出这两种情况哪种适用，我们需要转向离散化分析。在 Aghion, Antonin 和 Jaravel\
  \ (2020)（即 AABJ）中，我们使用三个指标作为企业和工厂层面自动化的代理：`工业设备和机器`的资产负债表价值，该数据涵盖 1995 年至 2017 年间所有法国公司。在\
  \ AABJ 中，我们进行了两类事件研究：(i) 企业层面的“扩展边缘”事件研究，利用`工业设备和机器`的时间点作为自动化事件；(ii) 允许延迟响应的工厂级分布式领先滞后分析。\n\
  \n我们事件研究的主要发现是，自动化对就业的影响是正的，而且实际上随着时间的推移而增加：即今天工厂自动化程度提高 1% 会立即增加 0.2% 的就业，并在十年后增加\
  \ 0.4%。企业层面的结果相似。换句话说，在存活的前提下，自动化导致了自动化企业和工厂就业的净增长。事件研究还表明，自动化还会转化为随后几年企业总销售额的增加。这种效应从投资当年到八年后一直保持稳定。\n\
  \n一个潜在的担忧是企业选择自动化的内生性。例如，自动化可能是需求冲击后公司增长战略的结果。然而，事件研究显示没有预趋势迹象：在设定中所包含的控制变量条件下，在时间\
  \ `t` 自动化程度更高的工厂在之前的几年中就业路径相似，并在之后开始分化。这限制了可能解释就业增加的潜在混杂因素。为了进一步缓解内生性担忧，我们检查了加入更严格的随时间变化的控制变量时的估计稳定性，特别是五位代码行业按年份固定效应以及企业-年份固定效应。仅具有企业-年份固定效应的设定利用了同一公司工厂之间的自动化变异，控制了企业层面所有随时间变化的需求供给冲击。我们发现估计值保持稳定，这进一步限制了混杂因素范围。\n\
  \n所有这些发现说明了自动化的“生产力”效应，与上一节阐述的“积极观点”一致：即自动化程度更高的企业生产率更高。这使他们能够获得更大的市场份额，因为他们的产品比竞争对手更具性价比。市场份额的增长促使这些自动化的企业进行更大规模生产，从而雇佣更多员工。\n\
  \n\n\n\n在 AABJ 中，我们还考虑了自动化对企业内部工资不平等的影响。具体而言，我们研究了自动化对低技能工人平均每小时工资与高技能工人平均每小时工资比例演变的影响。图\
  \ 2.1 报告了结果：我们观察到这两类工人在演变趋势上没有差异。\n\n![图 2.1 自动化对低高技能工人每小时工资比例的企业级事件研究。¶ 来源：使用 AABJ\
  \ 数据复制。](img/fig0001.jpg)\n\n图 2.1 自动化对低高技能工人每小时工资比例的企业级事件研究。¶ 来源：使用 AABJ 数据复制。\n\
  \n然而需要注意的是，事件研究设计并不能完全解决可能与自动化增加恰好发生的潜在相关需求和供给冲击。因此，为了估计自动化对企业就业、销售、工资和劳动力份额的因果效应，我们使用了份额份额设计（shift-share\
  \ design）。\n\n事实上，理想的设计应该是随机为企业分配机器的购买价格。在 AABJ 中，我们的想法是使用份额份额工具来近似这种假设的实验，该工具利用了两个部分：(i)\
  \ 国际贸易伙伴间进口机器隐含成本随时间的变化（“份额转移”部分）；以及 (ii) 法国企业之间现有供应商关系的异质性（“暴露份额”部分）。理想的“冲击”变量应该是法国制造企业对进口机器的预期质量调整价格。然而，我们无法直接观察这些价格；因此，我们从这些外国机器出口流量的变化中推断质量调整价格的变化。\n\
  \n份额份额工具的直觉是，由于稳固的现有关系，不同企业对来自不同贸易伙伴的机器质量调整价格的变化具有不同的暴露。例如，如果两家法国企业 A 和 B 分别从意大利进口\
  \ 80% 和 20% 的机器，而意大利生产的机器突然具有更好的质量调整价格，由于企业 A 与意大利机器供应商建立了稳固的长期关系，企业 A 比企业 B 更有动力进行自动化。\n\
  \n使用份额份额工具对自动化对就业影响的估计与之前事件研究的发现一致。我们发现的企业就业对自动化的弹性在五年期内介于 0.397 到 0.444 之间（AABJ\
  \ 的表 3A），取决于控制变量组，在 5% 或 1% 的水平上显著，且第一阶段 F 统计量在所有设定中均接近 10。\n\n接下来，我们对企业层面的销售和劳动力份额进行了同样的研究。我们发现销售额随着自动化的增加而增加，在不同设定下的弹性范围在\
  \ 0.395 到 0.512 之间（AABJ 的表 3B）。使用相同的设定，我们无法拒绝自动化对劳动力份额没有影响的假设，这反过来表明生产率效应可能某种程度上抵消了任务替代渠道，导致企业层面的劳动力份额保持不变。\n\
  \n人们也可以单独观察特定行业。特别有趣的是汽车行业，它占据了工业机器人的大部分。考虑到将工业设备投资最大的 25% 企业视为处理组，我们仍然发现自动化对企业就业有正影响（图\
  \ 2.2）。因此，即使在一个工业机器人占机器比例不容忽视的行业中，自动化与就业之间的关系仍然保持正相关。\n\n![图 2.2 自动化对汽车行业就业的企业级事件研究¶\
  \ 来源：数据来自 AABJ 数据。](img/fig0002.jpg)\n\n图 2.2 自动化对汽车行业就业的企业级事件研究¶ 来源：数据来自 AABJ 数据。\n\
  \n当我们从企业或工厂层面转移到行业层面时会发生什么？通过份额份额设计，AABJ 发现自动化对行业就业也有正影响，不同设定下的点估计值在 0.558 到 0.620\
  \ 之间。这再次说明了生产率效应的重要性：制造业整合进了国际贸易。\n\n图 2.3 使用 AABJ 数据获得的新颖结果说明了这种业务抢夺效应：与不进行此类投资的企业相比，未来十年的退出概率显著降低。\n\
  \n![图 2.3 大量投资工业设备对退出概率的影响。¶ 来源：来自 AABJ (2020)。](img/fig0003.jpg)\n\n图 2.3 大量投资工业设备对退出概率的影响。¶\
  \ 来源：来自 AABJ (2020)。\n\n**结论**\n\n在本章中，我们依靠既有文献和我们自己的实证工作讨论了自动化对就业的影响。我们对这一主题提出了两种相反的观点。第一观点认为自动化主要破坏工作，即使这最终可能由于工作破坏导致的较低均衡工资创造新的就业。第二种观点强调自动化的生产率效应是主要的直接影响：即自动化企业生产率提高，这使其能够降低质量调整价格，从而增加对产品的需求；市场规模的增长转化为企业更高的就业率。\n\
  \n总之，自动化本身并不是就业的敌人。通过生产工艺现代化，自动化使企业更具竞争力，使其能够在全球化世界中赢得新市场并雇用更多员工。\n\n我们可以考虑自动化和劳动力市场进一步实证研究的几个方向。一个是探索自动化如何与外包和国际贸易相互作用。另一个方向是区分不同的部门和行业。第三个方向是引入常规与非常规工作的区分。第四个方向是完善自动化对企业、行业和技能组工资分布影响的实证分析。这些对对章综述分析的进一步扩展为未来研究提供了广阔的方向。\n\
  \n**注释**\n\n*   1 Keynes, “Economic Possibilities for Our Grandchildren.”\n\n\n\n\
  \n\n## 注释\n\n- 2 在此模型中，一个新的（更复杂的）任务会取代或升级索引最低的任务。由于积分界限在 `N - 1` 和 `N` 之间运行，这一事实意味着用于生产中使用的任务度量始终保持为\
  \ 1。因此，`N` 的增加代表了任务单位度量质量（生产率）的提升。\n\n- 3 详见 Acemoglu 等人 (2020) 以及 Aghion 等人 (2020)。\n\
  \n- 4 我们可以将技术进步对生产力的提升效应与 Grossman 和 Rossi-Hansberg (2008) 所强调的离岸化对生产力的提升效应进行类比。在离岸化过程中，当某些任务更容易在海外执行时，那些高强度使用此类劳动力的企业会增加其盈利能力，并以牺牲依赖其他类型劳动力企业的竞争对手为代价扩大规模。这反过来导致了它们劳动力需求增加。\n\
