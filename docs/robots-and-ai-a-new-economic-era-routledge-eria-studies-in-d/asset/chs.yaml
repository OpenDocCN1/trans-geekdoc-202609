  \ 25、50 或 100 个就业工业结构相似的 CZ 组，然后对每组内的聚类标准误进行修正而得的。\n\n# 4 自动化与外包对就业的影响：劳动力市场筛选视角\n\
  \nEster Faia, Sébastien Laffitte, Maximilian Mayer 和 Gianmarco Ottaviano\n\nDOI:\
  \ [10.4324/9781003275534-4](https://doi.org/10.4324/9781003275534-4)\n\n## 1 引言\n\
  \n自动化和外包是全球范围内最受讨论的两项发展，对劳动力市场具有潜在的破坏性影响，并对工人的就业机会和工资产生重大影响。因此，理解它们的效应、相对重要性以及可能的相互作用具有极重要的意义，并因此吸引了大量的研究。\n\
  \n现有文献强调，从国家的角度来看，自动化和外包可能通过两种主要方式影响就业机会和工资。一方面，某些任务的自动化或外包意味着这些任务不再由该国的工人执行，从而导致对他们服务的需求下降。这就是负面的“替代效应”，可能会导致就业和工资的下降。另一方面，将任务从该国工人重新分配给自动化系统或外国工人可能会提高生产效率，从而扩大生产活动，并对就业机会和工资产生有益影响。这就是正向的“生产力效应”，可能会导致就业和工资的上升。\n\
  \n在自动化方面，大多数研究强调的是资本与劳动力的替代。\n\n与这些研究不同，本文调查了自动化对工人的就业机会和工资可能存在的额外负面影响。这种影响与所谓的“自动化悖论”（Bainbridge,\
  \ 1983）有关。其核心思想是：随着自动化的加强，相关任务的高效完成越来越需要对特定算法、软件和机器自动化系统具有专业知识的人类操作员。因此，根据该悖论，自动化系统越先进，专业人类操作员的贡献最终可能就越关键。\n\
  \n我们对 CBTC 对劳动力市场可能后果的调查，强调了在存在搜索摩擦和由于自动化导致匹配性增加的情况下，工人和企业在将前者的水平差异化技能与后者的水平差异化任务进行匹配时面临的挑战（参见\
  \ Shimer and Smith, 2000）。在完全竞争的劳动力市场中，更高的匹配性会增加所有均衡匹配的盈余，因为这些匹配只发生在“理想”伙伴之间，即技能与任务完美匹配的工人与企业之间。相比之下，由于搜索成本的存在，并非所有匹配都涉及理想伙伴，因为某些公司或工人可能认为接受非理想对象（错配”）是最优的，以避免产生额外搜索的机会成本。当“自动化悖论”发挥作用时，随着自动化的进行，理想匹配的盈余相对于非理想匹配会增加，放大了错配带来的损失，并使公司和工人在选择伙伴时变得更具选择性。随着选择性的增强，公司和工人更愿意花时间寻找更好的匹配。结果是，失业时间延长，错配减少，而专业知识更多地集中在特别需要这些知识的任务上。\n\
  \n人们可能会认为，如果将外包解释为另一种形式的技术变革，那么类似的机制可能也适用于外包。\n\n“自动化悖论”是否具有任何实际意义，以及类似的情况是否也适用于外包，这首先是一个实证问题。我们在行业-职业层面上寻找该悖论的痕迹。\n\
  \n\n\n\n\n我们认为这些发现与自动化情况下的“自动化悖论”以及“核心偏向技术变革”（CBTC）是一致的，但与外包情况下的类似现象并不一致。我们通过一个增长模型来阐述这一观点，该模型除了生产力效应和替代效应外，还具有劳动力市场中的搜索摩擦以及水平差异技能与任务的双侧异质性。模型中的工人和企业是风险中性的，并在连续时间内追求寿命折现效用最大化。他们通过随机匹配过程相遇，该过程由一个标准的规模规模不变函数控制，该函数基于每个任务具有拥堵外部性的一对关系（参见\
  \ Mortensen and Pissarides, 1994）。为了分析的透明性，假设工人的技能和企业的任务在描述其异质特征的圆周上均匀且对称地分布。由于搜索摩擦，工人和企业无法完美匹配，而是在理想匹配周围的区间内搜索并最优地接受非理想匹配。“错配”通过圆周上匹配技能与任务之间的距离来衡量，并对匹配剩余产生负面影响。我们基于特定函数形式的数值实现表明，只要假设匹配剩余满足：(i)\
  \ 在错配和自动化方面是对数子模的，使得短距离匹配在利用自动化方面具有比较优势；(ii) 在错配和外包方面是对数超模的，使得长距离匹配在利用外包方面具有比较优势；(iii)\
  \ 在自动化和外包方面是对数超模的，因此在给定错配的情况下，外包程度的增加会放大自动化对匹配剩余的影响。当满足这些条件时，模型预测更高的选择性与较低的就业率相关，因为企业和工人愿意花更长时间寻找理想对象。因此，这意味着由于自动化和外包对选择性的影响相反，它们对就业的影响也相反。自动化通过提高选择性来减少就业，而外包通过降低选择性来增加就业。模型还预测，更高的选择性与理想匹配与非理想匹配之间更高的工资不平等相关，因为前者的剩余相对于后者的剩余增加了。\n\
  \n本章的其余部分结构如下：第 2 节提供了“自动化悖论”的一些轶事案例，并讨论了关于职业专业化趋势的调查证据。第 3 节介绍了数据集并描述了实证分析。第 4\
  \ 节提出了模型，讨论了使模型与第 3 节实证结果一致所需的匹配性条件，并研究了在这些条件下对就业和工资不平等的意义。第 5 节为结论。\n\n## 2 自动化的讽刺与技能专业化\n\
  \n“核心偏向技术变革”（CBTC）的概念强调了新技术对技能与任务的水平匹配性可能产生的积极影响。这一概念提到了大约四十年前由认知心理学家 Lisanne Bainbridge\
  \ 在一篇仍具影响力的论文——*自动化的讽刺》（*Ironies of Automation*，Bainbridge, 1983）中所谓的“自动化悖论”。Bainbridge\
  \ 的观点是，随着自动化的加剧，人类高效地完成与自动化系统相关的任务，越来越多地需要具有特定系统专门知识的工人。因此，自动化提高了工人的专门化技能与企业特定任务之间的匹配性。\n\
  \n在她的论文中，Bainbridge 指出自动化的经典目标是用自动设备和计算机取代人类的手工控制、规划和问题解决。然而，这可能具有讽刺性的意义：\n\n> 控制系统越先进，人类操作员作为设计者的贡献可能就越至关重要，因为试图消除操作员的设计者仍然留下了操作员去执行设计者无法想出如何自动化的任务。[在这一方面，]自动化系统中留给操作员的任务大大两类。他可能被要求监控自动系统是否运行正常，如果没有正常运行，他可能被要求叫来经验丰富的操作员或亲自接管。接管并稳定过程需要手动控制技能，而诊断故障以作为关闭或恢复的基础则需要认知技能。\n\
  \n当被要求干预时，经验丰富的操作员反过来可能面临类似的挑战，只是在更高的水平上。在任何情况下，相关的经验都需要“专门培训”。一个传统的例子是飞行舱（Malquist\
  \ and Rapoport, 2021）：\n\n> 更多的自动化意味着更多的培训。今天的高度自动化飞机创造了飞行员不熟悉的意外。驾驶舱内的人员需要对机器的怪癖做好更充分的准备。[……]\
  \ 使用经典方法开发的喷气式飞机导致了需要等待事件正确组合的场景。与仅使用电气和机械部件建造的旧飞机不同，这些现代喷气飞机的自动化使用一系列复杂的情况来`decide`如何执行。[……]\
  \ 在`Boeing MAX`坠机事件中，飞行员发现自己处于困惑的境地，即自动化工作得非常完美，只是不符合预期。[……] 尽管这些挑战通常可以被`designed\
  \ out`，但飞行员无法等待设计更好的飞机。他们现在就需要接受培训，以理解飞机的响应取决于计算机的`process model`。\n\n所需的培训在“核心胜任能力”方面上可能是极其具体的（Aviation\
  \ Voice, 2008）：\n\n> [波音和空客]对他们的飞机有非常不同的哲学。[……] 波音拥有传统的控制轮，而空客拥有高度自动化的系统和侧杆杆。根据空客的说法，缺少大型操杆确保了更舒适的飞行体验。它还允许通过更大的空间和一只空手更容易操作计算机阵列。竞争对手认为，操杆是处理紧急情况的必要工具。它并没有阻止飞行员在必要时覆盖自动驾驶，并允许飞行员和副飞行员之间更好的协调。\n\
  \n航空培训是非常具体的，因此飞行员通常必须经过“类型认证”（`type-rated`），即他们必须获得初始执照和机型培训范围之外的额外认证，并根据他们被要求飞行的飞机机型进行定制（Aviation\
  \ Voice, 2008）：\n\n> 在空客 A320 和波音 737 上都获得类型认证的飞行员说，他们花了一段时间才能适应一种根本不同的操作飞机的方式。\n\
  \n总的观点是，如果自动化系统出现错误，系统将放大错误，直到错误被修复或系统被关闭。修复错误或关闭系统可能需要特定的系统经验。修复错误或关闭系统可能都需要人类接管控制，且这个人必须立即准确地知道该做什么。由于所需的知识是非常具体的，持有这些知识的人不容易被另一个没有适当特定系统经验的人类所取代。虽然这一切的需求在飞机飞行的情况下可能是悲剧性显而易见的，但在其他不那么戏剧性的情况下也可能非常重要（Kaufmann,\
  \ 2012）：\n\n\n\n\n\n> 想象一条全自动化的生产线，用于生产售价为 200 美元的计算机处理器。所有人工操作人员只需按下按钮，生产系统就会每分钟产出\
  \ 2,400 件成品。想象一下，用于在硅晶圆上钻孔的钻头发生位置偏移，开始在处理器核心正中心钻出微孔。系统每运行一秒，就有 40 块芯片被毁坏。假设每个处理器的材料成本为\
  \ 20 美元——这意味着在错误被发现之前，工厂每秒就会损失 800 美元。系统每运行分钟，公司就会损失 48,000 美元的原材料。这仅仅是直接成本——如果考虑到每个处理器可以卖\
  \ 200 美元，公司每分钟损失高达 528,000 美元： 48,000 美元的直接成本和 480,000 美元的机会成本。当错误发生时，操作人员需要迅速且完美地介入——否则，自动化系统将放大错误的影响，直到其被修复。\n\
  \n“寻找合适的技能或人才”或“填补职位”经常被引用为雇主提出的主要问题之一。例如，世人动力（Manpower Group）2018 年的人才短缺调查（2018）强调了人才短缺如何随时间推移不断增加，导致全球范围内出现越来越多的空缺。\n\
  \n> 如今需求最大的十大职位通常需要中等教育，而不一直是大学学位。在数字时代，就业并不总是需要大学学位，但将高度依赖持续的技能发展，即使是最传统的职位也受到新技术的增强。\n\
  \n具有不同教育程度和常规内容的广泛工作正受到影响。制造业、ICT 和医疗保健领域的招聘瓶颈较高，例如技工、机器操作员、销售代表、技术人员、ICT 专业人员、营销人员和办公室支持人员（Cedefound，2018）。\n\
  \n## 3 来自职业数据的实证证据\n\n在本节中，我们寻找与职业数据中 CBTC 一致的证据。特别地，我们关注自动化和外包是否会导致更高的选择性，我们通过失业持续时间的延长、错配的减少以及特定任务中专业知识集中度的增加来衡量。\n\
  \n### 3.1 数据与变量\n\n为了我们的研究，我们使用了来自《欧洲劳动力调查》（European Labour Force Survey, 简称 EULFS）的职业数据。为了尽可能包含可可用国家，我们将分析限制在\
  \ 1995-2010 年间。这涉及 13 个国家，即：奥地利、比利时、法国、德国、希腊、意大利、卢森堡、荷兰、西班牙和英国。\n\n我们关注处于 ISCO-88\
  \ 三位数的 92 个职业，以及根据 NACE Rev.2 分类的 16 个行业。为了确保行业定义的跨年份稳定性，我们将这 16 个行业归类为 11 个。我们利用了\
  \ 1995 年和 2010 年之间的差值，假设自动化和外包冲击在这两个日期之间发生了。\n\n#### 3.1.1 衡量自动化与外包性\n\nEULFS 与职业对自动化（`automatability`）和外包（`offshability`）的影响合并。我们使用这些变量来推断随后的实际自动化和外包。基本思想是自动化和外包是两个大趋势，其影响可以根据不同职业对它们的暴露程度进行评估。\n\
  \n为了衡量职业的自动化程度（`automatability`），我们使用了由 Acemoglu 和 Autor（2011）计算的常规任务强度指数（`RTI`），这在之前的研究中被广泛使用（见其他\
  \ Autor, Murnane, 2003; Autor and Dorn, 2013; Goos, Salomons, 2014）。为了衡量职业的外包性（`offshability`），我们采用了\
  \ Blinder 和 Krueger（2013）开发的索引（简称 BK）。该索引基于调查卷和定性观察，并由专业人员根据职业分类构建。虽然自动化和外包都可能取代工人，但重要的是它们在概念上是不同的。自动化概率与任务的常规性有关，因此任务可以通过计算机或机器人通过算法执行。相比之下，外包性（Blinder\
  \ and Krueger，2013）是指在外国为同一雇主履行工作职责的能力，尽管商品或服务的供应位于本。因此，虽然我们的自动化衡量和外包性衡量之间的相关性是正的，但在不同职业之间存在重要的例外（见表\
  \ 4.1 的第 4 和 5 列以及附录 A）。\n\n### 表 4.1 描述性统计：职业\n\n| 按自动化概率排序的职业 | 工时占比变化 | 失业率变化\
