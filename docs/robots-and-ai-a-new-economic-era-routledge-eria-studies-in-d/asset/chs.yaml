  \n当我们提到某公司在 `t` 年的 AI 专利时，指的是其从 1990 年到 `t` 年的累计 AI 专利申请。也就是说，我们的 AI 专利是专利申请的存量。使用申请而非授权可以避免与专利授予延迟相关的右截断问题最严重的情况。\n\
  \n### 2.4 应用中的 AI 部署\n\n我们需要一个衡量每个应用类别中部署的 AI 的指标。如果每家公司的应用都属于单一类别，那么统计该类别中所有生产应用的公司的\
  \ AI 专利将是一件易事。遗憾的是，许多公司（最终所有者）的应用跨越多个类别。例如，最终所有者控制着 Google、Nest、Waze 和 Fitbit，它们均在不同的应用类别中运行。因此，我们通过借鉴\
  \ De Loecker、Goldberg、Handel 和 Pavlik (2016) 的方法来纯化应用类别 AI 部署的指标，该方法包含了单产品公司。我们将单一类别公司定义为其主要类别占其总下载量\
  \ 85% 以上的公司。\n\n我们仅根据单一类别公司的专利来构建应用类别 AI 部署的指标。令 `Patent[cxt]` 和 `K[cxt]` 为第 `t`\
  \ 年国家 `x` 仅生产类别 `c` 应用的所有单一类别公司的 AI 申请存量和总资产。`AI[cxt] = Patent[cxt]/K[cxt]` 将是我们衡量\
  \ AI 部署的关键指标。了解多类别公司的 AI 专利也具有独立意义。在稍后报告的每一个设定中，我们还通过增加一个捕捉多类别公司 AI 部署的变量对相同的设定进行了检验。为此，我们将\
  \ `multipleAI[cxt]` 定义为来自国家 `x` 拥有类别 `c` 应用的多类别公司的总 AI 申请存量除以总资产。\n\n### 2.5 描述性统计\n\
  \n表 10.5 报告了我们数据的描述性统计。每个观测值由应用类别（292）、出口国（53）、进口国（84）和年份（2014–2020）唯一标识。我们有 469,879\
