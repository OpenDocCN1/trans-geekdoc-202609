  \ || || (0.001) |\n\n\n\n\n\n本节提出了一个异质性企业的简单模型，这些企业做出企业级的自动化决策以为我们的实证结果提供合理解。我们的模型是样式化的，与现有模型具有许多共同特征，这些模型根据企业决策的差异对其进行分类（例如，Melitz,\
  \ 2003；Antras, Fort, and Tintelnot, 2017）。因此，我们在这里重点介绍模型的关键要素和主要预测，而感兴趣的读者可以将技术细节留在附录\
  \ A。\n\n在我们的框架中，可以以固定成本购买自动化设备。这些设备通过提供替代且更好的技术来完成生产过程中的自动化任务（而这些任务以前完全由人工完成），从而降低了单位生产成本。自动化的边际成本和收益构成了企业在决定是否自动化时必须考虑的权衡。\n\
  \n我们假设企业在生产率上存在差异。企业决定其生产物品的质量；质量被建模为 CES 偏好中的残差需求项。高质量意味着更高的单位生产成本和更高的投资固定成本。然而，由于消费者看重高质量，企业会考虑达到特定产品质量水平的边际成本和收益，以实现利润最大化。由于自动化决策具有规模经济特征，只有生产率足够高的企业才会发现自动化是有利润的。\n\
  \n我们的模型对自动化者与非自动化者之间企业特征的横截面差异产生了几项预测。首先，自动化者的产量和生产率高于非自动化者。\n\n## 5. 结论\n\n我们对印尼西亚的自动化进行了实证分析，特别关注企业级自动化如何与不同的企业级结果相关。我们衡量了印尼西亚企业对自动化设备的直接进口情况，并描述了这些企业的自动化模式。将企业级自动化设备进口数据与其他微观层面信息相结合，我们发现自动化者产出更多，雇佣了更多工人，并且具有更高的生产率。他们还支付更高的工资，劳动力份额更低，且资本使用更密集。我们进一步发现，自动化者产出的产品种类更多，更积极地参与进出口活动，并生产更高质量的商品。使用企业级长差分设定，我们发现自动化者在产量、生产性工人就业人数、出口份额和推断产品质量方面的增更大。最后，我们提出了一个异质性企业做出自动化决策的简单理论框架，以为我们的实证结果提供合理解释。\n\
  \n我们对自动化与其他企业级及产品级结果之间的相关性提供了启发性证据。为了进一步建立因果关系，我们需要依赖于影响自动化成本和收益的外生冲击或政策变化。此外，理解自动化如何造福企业以及识别自动化的障碍至关重要。例如，自动化是否有助于高质量商品的生产？财务约束是否限制了企业购买自动化设备？我们计划在未来沿着这些方向扩展研究。\n\
  \n## 注释\n\n* 1 20 世纪 90 年代后期，纺织和服装业占印尼西亚制造业增加值的约 16%。这一数字在 2008–2012 年样本期间下降到约 7%。\n\
  * 2 我们根据联合国 WITS 数据库，观察了 2000 年到 2019 年印尼西亚自动化设备的进出口情况，按类型和协调制度（HS） 6 位产品代码分类。\n\
  * 3 我们将“产品”定义为唯一的 `Kodeifikasi Industri (KKI)` 9 位代码或唯一的文本描述。\n* 4 在 2008–2012 年期间至少进口过一次自动化设备的企业中，约\
  \ 42% 的企业在连续至少两年进口过。\n* 5 由于匹配样本由中大型制造业企业组成，样本可能受进入和退出的影响较小。然而，正如我们后面所示的，自动化者通常规模较大且生产率高，因此我们预计在未来的研究中（如果数据可用）纳入小型企业可能不会改变结果。\n\
  * 6 爪哇是印尼西亚的主要岛屿之一。它是印尼西亚 56% 人口的所在地，也是该国一些主要业务和大量制造业企业的所在地。2012 年，爪哇占了印尼西亚 GDP\
  \ 的 57%。\n* 7 理想情况下，自动化指标也应该捕捉企业在 2008 年之前购买自动化设备的情况。遗憾的是，我们的数据中没有提供这一信息。\n* 8 例如，使用进口投入的企业可能有较低的生产成本和更大的销售额，并可能发现更容易进口自动化设备，因为他们已经知道如何在其他国家寻找供应商。\n\
  * 9 由于自动化决策是内生性的，存在由于遗漏变量导致 `ϵ[ft]` 与 `a[ft]` 相关的可能性。因此，我们将实证结果视为描述性的而非因果性的。\n*\
  \ 10 为了获得全要素生产率（TFP）的简单衡量，我们运行了以下回归：\n\n```\nln Y[ft] = β(K)ln K[ft] + β(L)ln L[ft]\
  \ + β(M)ln M[ft] + δ[f] + δ[t] + ϵ[ft]\n```\n其中 `Y[ft]`、`K[ft]`、`L[ft]` 和 `M[ft]`\
  \ 分别是企业 `f` 在 `t` 年的总产值、资本存量、就业和材料成本。`δ[f]` 和 `δ[t]` 是企业特定和年份固定效应；`ϵ[ft]` 是误差项。对数形式\
  \ TFP 为：\n\n```\nln TFP[ft] = ln Y[ft] - β̂(K)ln K[ft] - β̂(L)ln L[ft] - β̂(M)ln\
  \ M[ft]\n```\n* 11 例如，出口市场可能会产生更大的销售额并增加自动化的动力。\n* 12 表 9.3 第 4 列的观测值显著减少，因为样本中有\
  \ 35% 的资本存量为零。\n* 13 表 9.4 第 2 列的观测值少于第 1 列，因为样本中的某些企业没有报告非生产人员的工资。\n* 14 再次，表 9.4\
  \ 第 4 列的观测值减少是因为资本存量变量报告为零。\n* 15 在本分析中，我们根据产品是否具有唯一的 KKI 9 位代码或唯一的文本描述来定义“品种”。\n\
  * 16 由于我们在绘制分布图时减去了行业年度平均值，因此图中出现了负值观测值。\n* 17 观测值数量与之前的企业级回归报告的接近，原因有两个：首先，样本中\
  \ 60% 的企业是单产品企业。其次，并非所有样本产品都能映射到 HS 代码。\n\n\n\n\n*   20 例如，调节和控制仪器可以帮助生产工人更高效地识别和纠正生产过程中的工艺缺陷。\n\
  *   21 人可以沿着选择变量进行扩展，纳入数据中的其他横截面特征。例如，生产率更高的企业工资更高，出口更多产出，从国外进口更多投入，并且更有可能自动化。\n\
  *   22 该模型还解释了为什么自动化设备生产的产品价格与非自动化设备生产的产品价格没有区别。一方面，在产质量给定的情况下，自动化直接降低了边际成本。另一方面，通过降低单位成本，自动化也与更高的质量相关联，从而增加了边际成本。这两种相反效应的大小取决于模型参数的值。\n\
