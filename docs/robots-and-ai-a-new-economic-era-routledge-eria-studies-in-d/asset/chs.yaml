  \n## 数据描述\n\n我们使用了欧盟统计局提供的欧洲劳动力动力调查（EULFS）年度文件。该调查整合了欧洲各国国家层面开展的劳动力调查。其优势在于提供了统一的劳动力市场基础变量信息。我们的最终数据库对应\
  \ `country` × `industry` × `occupation` × `year` 单元。行业信息基于广义 NACE 部门（NACE Rev.2\
  \ 分类中的 21 个部门），职业信息基于 ISCO-88 三位数字分类。\n\n### 变量构建\n\n我们保留了国际劳工组织（ILO）标准并由欧盟统计局定义的就业人员。在\
  \ `sector` × `occupation` 维度上计算失业率并不常见，因为工人可以在部门和职业之间具有流动性。我们将特定部门和特定职业的失业定义为：在该部门从事该精确职业的失业人数。如果工人不跨部门或职业移动，则该衡量对应于\
  \ `sector` × `occupation` 维度上真实且不可观测的失业率。\n\n\n\n\n## 数据集选择\n\n我们将数据集限制在以下 13 个国家：奥地利、比利时、德国、丹麦、西班牙、法国、英国、希腊、爱尔兰、意大利、卢森堡、荷兰和葡萄牙。这组国家涵盖了所有从\
  \ 1995 年起提供数据的国家。需要注意的是，`法国`和`荷兰`提供的信息不足以计算单元层面的失业率。根据 Goos, Manning 和 Salomons\
  \ (2014) 的方法，我们还删除了以下行业：农业、林业、渔业（A）；采矿和采石业（B）；公共管理、国防及强制性社会保障（O）；教育（P）以及境外组织和机构（U）。这些部门对应于公共部门和农业部门，占我们样本中所有工作岗的\
  \ 26%。与被删除行业密切相关的以下职业也从样本中剔除：立法者和高级官员（`ISCO-88: 11`）；教学专业人员（`ISCO-88: 23`）；教学辅助类专业人员（`ISCO-88:\
  \ 33`）；市场导向型农业和渔业技术工人（`ISCO-88: 61`）；农业、渔业及相关劳动工（`ISCO-88: 92`）。\n\n表 4.A1 总结了我们的数据库相对于官方统计数据的覆盖范围。根据欧盟统计局（Eurostat）的官方统计，我们覆盖了每个国家约\
  \ 70%的就业人数，`卢森堡`除外，我们仅覆盖了其 58.5%的就业。这是由于`卢森堡`是一个小国，由于某些欧洲机构的存在，其机构部门很大。我们对失业率的覆盖稍不精确，从`意大利`官方失业人数的\
  \ 36.2%到`丹麦`的 69.6%不等。这主要是由于对失业人员最后一份工作的报告不精确以及某些行业的删除导致的。特别是`葡萄牙`在 1995 年的覆盖率非常低（约\
  \ 10%）。\n\n表 4.A1 数据库覆盖率（占占欧盟统计局官方数据的百分比）\n\n| 国家 || 员工人数 || 失业工人人数 |\n| --- | ---\
