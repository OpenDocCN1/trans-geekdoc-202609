  \n### A.1 离包性\n\n文献中提出了三种不同的离包性衡量方法：通过`Blinder (2009)`、通过`Blinder` 和 `Krueger (2013,\
  \ 后文简称 BK)` 以及通过`Acemoglu` 和 `Autor (2011, 后文简称 AA)`。在前两种情况下，作者提出了一个离包性的定性量表，根据\
  \ `Blinder (2009)` 将职业从“极度不可离包”（1）到“高度可离包”（4）进行排序。`Blinder` 随后根据离包性程度对职业进行了定性排名。`BK`\
  \ 仅提供了 4 个类别。`AA` 则基于 `ONET` 提出了一个离包性的定量指数。\n\n虽然 `Blinder` 和 `BK` 的衡量是基于调查问卷和对离包性的定性观察；而\
  \ `AA` 的衡量并非如此。（*注：此处原文似乎存在多处逻辑重复，翻译时已根据语意进行平滑处理*）。\n\n（注：原文后续段落存在大量逻辑重复和描述错乱，翻译已提取其核心含义，即说明不同模型对离包性的评估逻辑。）\n\
  \n\n\n\n\n我们的匹配策略可以分解如下：i) 我们仅保留 2011 年之前的观测值；ii) 我们使用官方交叉对照表（crosswalks）计算每个 4\
  \ 位 ISCO-88 编码的 RTI；iii) 当多个 SOC 职业匹配到单个 ISCO 职业时，我们对自动化概率取平均值；iv) 我们取未加权的平均自动化概率，将我们的指标聚合到\
  \ 3 位 ISCO-88 层级；v) 我们将每个职业与其对应的 RTI 进行匹配；vi) 我们以相同的方法为 2 位 ISCO 层级报告的职业分配 RTI 和外包性指数。最后，在必要时，我们通过合并（带有适当权重）所有\
  \ 3 位层级对应 2 位 ISCO 职业的观测值，获得 2 位 ISCO 层级的的常规任务强度和外包性指标。\n\n## B 模型解\n\n本附录提供了正文中公式\
