  \ 数据计算 | | | | |\n\n接下来，我们使用匹配数据检查自动化设备在不同企业企业的分布。我们根据企业在前一年是否活跃，将当年的活跃企业分类为“存量企业”（incumbent\
  \ firm）或“新进入企业”（entering firm）。如果一家企业在 2009 年活跃且在 2008 年也活跃，则将其分类为存量企业。同样，我们可以将当年的活跃企业分类为存量企业或现有企业。如果一家企业在\
  \ 2009 年活跃，则被分类为存量企业。总体信息是：存量企业驱动了企业自动化进口的变化——存量企业在所有年份的直接进口占比均超过 90%。\n\n我们提供了一些统计数据来说明自动化企业的情况。2008\
  \ 年，样本中 6.43%的生产工和 4.21%的非生产工由直接进口自动化的制造企业雇佣。2012 年，这些数字分别为 12.75%和 9.25%。在 2008\
  \ 年至 2012 年期间，直接进口自动化制造商占总产出的 6.69%。这一数字在 2012 年增加到 13.57%。简而言之，自动化直接进口的就业和产量份额从\
  \ 2008 年到 2012 年翻了一番。平均而言，直接进口设备的企业雇佣了更多工人，生产了更多产品。\n\n## 3 印尼的自动化：企业-产品级证据\n\n\
  本节调查了企业级自动化与企业级结果之间的关联。我们的实证分析并非推断自动化与企业级结果之间的因果关系，而是记录自动化与企业级结果之间的相关性。分析分为两个部分：第一部分关注直接进口自动化设备的企业与未进口企业之间的截面比较；第二部分遵循\
  \ Manuylov, Smolka (2021)以及 Acemoglu, Lelarge, Restrepo (2020)的企业级差分模型，考察自动化与企业结果的相关性。\n\
  \n### 3.1 截面比较\n\n在特定行业中，自动化企业与非自动化企业有何不同？我们使用以下实证模型来检查这些截面差异：\n\n```\ny[ft] = β(a)\
  \ * a[ft] + X[ft] + δ[it] + δ[rt] + ε[ft]\n```\n其中`y`是结果变量，`f`, `t`, `i`, 和 `r`分别代表企业、年份、国际经济活动分类（ISIC）2\
  \ 位行业代码和地区（是否位于爪哇岛）。\n\n在第一组结果中，我们关注企业级的规模和生产率衡量。感兴趣的变量是总产出值、就业、劳动生产率和全要素生产率（`TFP`）。\n\
