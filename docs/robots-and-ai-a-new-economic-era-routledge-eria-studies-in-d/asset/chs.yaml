  \n注：标准误为异方差稳健标准误。所有行业的第一阶段 `F` 值相同，因为第一阶段对所有行业都是通。\n\n我们以处理机器人相同的方法，估计了 17 个 `IFR`\
  \ 行业中 AI 与高技能劳动力之间的替代弹性。Table 5.10 显示了结果。在每个行业中，估计的弹性都小于机器人和低技能劳动力，表明高技能劳动力被 AI\
  \ 替代的可能性低于低技能劳动力被机器人替代的可能性。事实上，在十个行业中，估计弹性小于 `1`。在随后关于增强 AI 生产率的 2014 年经济模拟中，我们将这些弹性替换为\
  \ `1`，因为我们的模型要求弹性大于或等于 `1`。\n\n利用这些替代估计值，我们遵循与机器人相同的程序，以获得对劳动力市场的估计影响。为了分离 AI 对劳动力市场的影响，我们模拟了\
  \ AI 生产率提高后的 2014 年经济，但保持机器人生产率不变。AI 的占比远小于机器人，这反映了在 AI 安装量最多的行业，AI 与高技能劳动力之间的替代弹性是后者的\
  \ `10` 倍。\n\n\n\n\n\n正如 Brynjolfsson 和 McAfee (2011) 所强调的，机器人技术正以指数级速度进步。2014 年这一基准年可能仍处于飞速进步的边缘，因此我们的模拟可能低估了机器人和人工智能的未来影响。对机器人学的狭义定义也可能导致了这种低估。人工智能和机器人技术的进展确实比我们预想的要快得多。这些因素在技术开发阶段以及工业应用阶段都可能相互加作用。正如\
  \ Brynjolfsson 和 McAfee (2011) 以及 Baldwin (2019) 所认为，人工智能和机器人对劳动力市场以及更广泛的全球经济的影响很快就会变得非常巨大。\n\
