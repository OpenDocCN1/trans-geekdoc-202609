  \ I., Parenti, M., 2020. 关系粘性与经济不确定性 37。\n*   Melitz, M., 2003. 贸易对行业内重新配置和总生产率的影响。《计量经济学》（Econometrica）\
  \ 71, 1695–1725。\n*   Nakamura, H., Zeira, J., 2018. 自动化与失业：帮助正在路上。[Vox](https://vox.org)。\
  \ [`vox.org/automation-help-is-on-the-way`](https://vox.org/automation-help-is-on-the-way)\n\
  \n\n\n为了全面了解印度尼西亚的自动化状况，理想情况下应同时包括本土生产和进口的设备。显然，印度尼西亚本土生产自动化设备的数量和价值仍然很低：大多数此类设备仅在印度尼西亚进行组装，而发动机和其他主要部件则在海外生产。国际机器人联合会（IFR）维护一个记录工业机器人年安装量的数据库。2019\
  \ 年，中国、日本、美国、韩国和德国是工业机器人安装量排名前名的国家。IFR 数据库还报告了机器人密度，其衡量标准是每 1 万名工人中运行的工业机器人数量。将该比率作为自动化强度的衡量标准，2019\
  \ 年自动化强度最高的国家大多为发达国家，如日本（每万名工人 364 台机器人）和德国（每万名工人 346 台机器人）。根据这一标准，其他自动化强度较高的国家还包括新加坡、韩国和中国。然而，IFR\
  \ 没有关于印度尼西亚本土生产机器人的数据。\n\n因此，我们利用联合国贸易统计数据库（UN Comtrade）关注印度尼西亚自动化设备的进出口情况，这是一个由联合国维护的国际贸易统计数据库（自动化设备的分类基于协调制度的\
  \ 6 位代码）。数据显示，2000 年至 2019 年间，印度尼西亚在自动化设备存在巨大的贸易逆差。此外，数据还揭示了有趣的模式。例如，纺织和服装行业使用的自动化设备（如织机、针织机和其他纺织机械）在所有自动化设备进口中的占比有所下降。这与这些行业的放缓是一致的，这些行业在\
  \ 20 世纪 90 年代曾印尼经济的宠儿。数据还显示，汽车和金属等高科技行业使用的自动化设备进口显著增加。其他通用自动化设备（如调节控制设备和自动输送带）的进口也有增加。考虑到印度尼西亚使用的大多数自动化设备均为进口，将自动化设备进口作为印度尼西亚整体自动化水平的指标是合理的。\n\
  \n## 自动化实证分析\n\n在第二步中，我们对自动化对生产力、质量和就业的影响进行了实证分析。以往的研究要么采用宏观方法，关注国家级或区域级的劳动力市场结果（例如，Graetz\
  \ and Michaels (2018) 的跨国证据；Acemoglu and Restrepo (2020) 的美国劳动力市场；Adachi, Kawaguchi,\
  \ and Saito (2022) 的日本劳动力市场），要么依赖企业级数据来识别自动化的影响，主要是在就业方面（例如，Koch, Manuylov and Smolka\
  \ (2021) 使用西班牙数据；Humlum (2019) 使用丹麦数据；Acemoglu, Lelarge and Restrepo (2020) 使用法国数据）。我们采用了企业-产品级的方法，利用了来自最细粒度微观的印度尼西亚制造企业数据库的三个数据集。该数据库汇总了对约\
  \ 35,000 家企业的年度调查结果，包含了企业层面的原材料和产品产出，以及企业层面的进出口数据。将这三个主要数据集合并后，我们获得了 2008 年至 2012\
  \ 年期间总计 118,570 家企业的样本。\n\n## 数据一致性与企业级进口\n\n合并三个数据集使我们能够识别每家制造企业自动化设备的直接进口。由于企业级进口数据与国家汇总的进口数据保持一致，我们认为企业级数据具有很强的代表性。这种一致性通过三个观察结果体现：(i）印度尼西亚企业多年来一直存在大量的自动化设备逆差；(ii）企业级数据和国家数据在各行业自动化设备进口方面显示出相同的模式（例如，纺织和服装行业的进口占比大幅下降，而汽车和金属行业的进口占比增加）；(iii）我们发现总体更多的行业在进口自动化设备方面变得活跃。在研究期间，我们样本中有\
  \ 3.07%的制造商进口了自动化设备。2012 年，这些企业占了总产出的 13.57%，以及总生产工人的 12.75%。\n\n## 横截面关联\n\n利用合并的数据，我们的分析记录了企业级自动化状态与其他企业级结果之间的横截面关联。我们的发现显示，在研究期间进口过自动化设备的企业（以下简称\
  \ `automators`）其产出更多、雇佣工人更多，且劳动力生产率和总要素生产率（TFP）也高于从未进口过任何自动化设备的企业（以下简称 `non-automators`）。此外，自动化企业对生产人员和非生产人员支付的工资也相对较高，劳动力成本占比较低，且资本使用密集度比非自动化企业更高。自动化企业还生产了更多品种的产品，并且在进出口方面更加活跃。此外，自动化企业生产的产品推断质量也高于非自动化企业。\n\
  \n## 纵向分析\n\n为了观察自动化如何随时间与企业结果相关联，我们基于企业级长差分模型进行了估计。我们发现，自动化企业的产出和生产率增长更大。自动化企业的出口占比增长更大，产品推断质量更高。我们还考察了其对就业的影响。尽管到目前为止的大多数研究发现，先进自动化（如采用工业机器人）在发达国家往往取代生产工人，但我们发现与非自动化企业相比，印度尼西亚的自动化企业雇佣更多的工人。特别是，我们记录了生产工人相对于非生产人的数量增加。因此，我们的结果表明，不同程度的自动化会导致不同的就业结果。\n\
  \n## 理论框架\n\n作为最后一步，我们提出了一个异质企业理论框架，纳入企业级自动化决策，以解释我们的实证结果。由于自动化为本应由人工完成的某些易自动化任务提供了更好的选择，它降低了生产成本。同时，自动化设备的购买需要固定成本。企业在生产率上存在差异并决定其生产的产品质量。模型预测，生产率较高的企业比非自动化企业更有可能实现自动化、产出更多并生产更高质量的产品。这些结果与我们的实证发现一致。该模型还预测了就业与自动化状态之间存在理论上不确定的关联，这是由于两种相反的影响：增加自动化企业劳动力需求的正向规模效应，以及减少需求的负向替代效应。\n\
  \n## 章节结构\n\n本章其余部分的安排如下：第 2 节](#Ch09.xhtml#sec9_3）介绍企业和产品级数据，并讨论这些数据提供的关于印度尼西亚自动化的信息。[第\
  \ 3 节](#Ch09.xhtml#sec9_4）报告印度尼西亚企业和产品层面自动化的实证证据。[第 4 节](#Ch09.xhtml#sec9_5）通过提出理论框架为我们的实证结果提供可能的解释。[第\
  \ 5 节](#Ch09.xhtml#sec9_6）得出结论。\n\n\n\n\n## 2 印度尼西亚的自动化：数据告诉了我们什么？\n\n在本节中，我们通过协调制度（HS）产品代码来识别“自动化设备”，描述了印度尼西亚自动化设备的进出口模式，并考察了印度尼西亚制造企业对自动化设备的直接进口情况。首先，我们收集了\
  \ Acemoglu 和 Restrepo (2021) 用于定义工业自动化设备的 HS 6 位代码。这些代码包括以下类型的设备：工业机器人、机械设备、数控机床、自动机床、自动焊接机、织造机和针织机、其他纺织专用机械、自动输送带以及调节控制仪表。我们将具有这些产品代码的设备称为“自动化设备”。随后，我们就可以识别一个国家或制造企业从国外购买的自动化设备的数量和价值。\n\
  \n利用世界银行世界综合贸易解决方案（WITS）数据库的联合国 Comtrade 数据，我们观察了 2000–2019 年期间印度尼西亚自动化设备的年度出口和进口价值额（见图\
  \ 9.1）。由于印度尼西亚并非自动化设备的主要生产国，我们可以看到其自动化出口的价值远小于自动化进口的价值。如图 9.1 所示，印度尼西亚在自动化设备方面存在巨大的贸易逆差，进口价值在过去的二十十年中显著增加，从\
  \ 2000 年的 8.71 亿美元增加到 2019 年的 39 亿美元。2019 年自动化设备占印度尼西亚总进口额（按价值计算）的约 2.3%。进口在过去的几十年一直在增加，且自\
  \ 2008 年以来增长明显加快：2007 年至 2013 年间年度进口增长了 24%；随后进口在 2014 年至 2017 年间下降，之后又再次增长。\n\n\
  ![图 9.1 2000–2019 年印度尼西亚企业自动化设备进出口情况](img/fig0070.jpg)\n\n图 9.1 2000–2019 年印度尼西亚企业自动化设备进出口情况\n\
  \n根据联合国 Comtrade 数据，印度尼西亚自动化设备进口的四种模式值得注意。首先，织造机、针织机和其他纺织专用机械在自动化设备总进口中的占比持续持续且显著的下降。这两类设备在\
  \ 21 世纪初曾占自动化进口总额的 45% 以上；到 2019 年仅占 18% 左右。这种收缩与印度尼西亚纺织服装行业在整体经济中份额的下降是一致的（这些行业被称为“落后行业”），且它们增长的前景较为缓慢。\n\
  \n我们随后考察了来自印度尼西亚统计局（BPS）的企业级生产和贸易数据，以识别自动化企业。第一步，我们合并了三个主要的微观层面数据集。第一个数据集来自对印度尼西亚中大型制造企业的年度调查。该调查每年涵盖约\
  \ 35,000 家企业，记录了企业级的生产和财务信息，包括总产出值、增加值、生产和非生产人员人数、工资、资本、国内和外国股权比例、材料使用以及进出口占比。第二个数据集包含了制造调查中特定的补充信息，包括企业-产品层面的产出、投入和原材料的详细信息。具体而言，该数据集报告了企业生产的每种产品的年度价值、数量和出口价值。它还记录了企业在境内购买或进口作为投入材料的每种产品的年度价值和数量。\n\
  \n我们识别企业级自动化的方法参考了 Humlum (2019) 以及 Acemoglu, Lelarge 和 Restrepo (2020)，他们将工业机器人的进口作为丹麦和法国企业采用机器人的指标。由于数据限制，我们的企业级自动化衡量仅涵盖了样本期间内从国外直接进口的自动化设备；没有考虑到从国内批发商和零售商处购买自动化设备。因此，匹配样本侧重于实施了自动化的制造企业子集——通过它们在特定时期内直接进口自动化设备来体现（如前一节所述，我们使用自动化设备进口作为印度尼西亚国家和企业级自动化的最佳代理指标，目前可以获取到这些数据）。此外，由于印度尼西亚的自动化设备进口自\
  \ 2008 年后开始快速增长，我们预计大多数自动化设备的购买和安装都发生在 2008 年之后。\n\n表 9.1 使用匹配数据集的印度尼西亚制造企业自动化设备直接进口的年度增长和构成。印度尼西亚制造企业的自动化设备直接进口在\
  \ 2009 年大幅下降，但在随后的几年中迅速恢复并大幅增长。2008 年的全球金融危机可能是 2009 年进口下降的原因。然而，下降后的强劲反弹可能表明财务不受限的企业管理了其资源，以便在需求下降引发的低迷期间建立起其自动化能力。这种模式适用于几乎所有类型的自动化设备，与我们在国家层面的联合国\
  \ Comtrade 数据中观察到的模式基本一致。这表明，匹配的企业-产品层面数据集为概述印度尼西亚的自动化情况提供了良好的代表性样本。\n\n*表 9.1 印度尼西亚制造企业自动化设备直接进口*\n\
  \n| 设备类型 | 增长率 (%) |\n| --- | --- |\n\n\n\n\n\n转向表 9.1 中包含的自动化设备类型，我们看到织造机、针织机和其他纺织专用机械在\
  \ 2008 年占了自动化设备进口总价值的 66%，但到 2012 年这一比例仅为 35%。这种下降可以归因于同期内印尼纺织和服装行业的整体收缩。与之相反的是，工业机器人和数控机的进口份额从\
  \ 2008 年到 2012 年显著增加。这些增长是由于此类设备的主要用户行业的扩张所推动的，特别是汽车、运输设备、金属以及橡胶和塑料行业（见表 9.2](#）。表\
  \ 9.2 还报告了自动化设备直接进口的行业组成——换句话说，就是自动化进口在各行业的分布情况。纺织业在自动化设备直接进口总价值中的份额大幅从 61%下降到 25%。相比之下，橡胶和塑料、汽车和基础金属等其他行业的份额则显著增加。总的来说，印尼的制造企业似乎已经从进口特定行业的自动化设备转变为进口适用于更广泛行业的设备。\n\
