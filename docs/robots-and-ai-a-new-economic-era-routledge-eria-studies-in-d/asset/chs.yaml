  \n## 2.2 机器人、外包与实际工资\n\n我们现在可以研究机器人对实际工资的影响，在模型中，实际工资与福利相同，并反映了劳动力需求。我们主要关注北国，尽管推导南国的结论也很简单。\n\
  \n### 2.2.1 仅外包\n\n假设首先没有自动化，即 `κ` = 0。那么：\n\n\n\n\n$$w_{n} = a_{n}\\\\left( {\\\
  \\frac{a_{s}}{a_{n}}\\\\frac{w_{n}}{w_{s}}} \\right)^{\\lambda} = a_{n}\\\\left(\
  \ {\\\\frac{1 - \\lambda}{\\lambda}\\\\frac{a_{s}L_{s}}{a_{n}L_{n}}} \\\\right)^{\\\
  lambda}.$$\n\n外包（Offshoring），即 $\\lambda$ 的增加，具有两种影响。首先，只要 $a[s]w[n] > a[n]w[s]$，南方的生产成本较低，因此将任务转移到那里会降低价格，从而有利于所有工人。其次，外包使得劳动需求向南方工人倾斜，从而降低了\
  \ $w[n]/w[s]$。北方工人贸易条件的的这种下降往往会损害他们。总而言，在 $\\lambda$ 取值较小（工资差距较大）时，效率效应占主导；但当 $\\\
  lambda$ 较高时，这种效应会消失，因为随着外包水平足够高，工资差距会消失。因此，$w[n]$ 是关于 $\\lambda$ 的倒 U 函数。\n\n###\
  \ 2.2.2 仅自动化\n\n现在考虑没有外包的情况，即 $\\lambda = 0$ 且 $\\xi = 0$。那么：\n\n$$\\begin{array}{r}\
  \ {w_{n} = \\frac{m_{n}}{L_{n}}Y = a_{n}\\left( \\frac{a_{r}}{r} \\right)^{\\frac{\\\
  kappa}{1 - \\kappa}}.} \\\\ \\\\ \\end{array}$$\n\n(10)\n\n方程 (10) 显示实际工资随着自动化程度\
  \ $\\kappa$ 的增加而增加。这里有三重效应。首先，只要 $a[r] > r$，机器人就能提高生产率。其次，随着北方工人执行的任务衡量下降，也存在位移效应。然而，后者被机器人资本深化所抵消了：机器人的供应增加，以保持其价格\
  \ $r$ 恒不变。因此，与外包不同，工人不会因为机器人而遭受任何贸易条件的恶化。\n\n### 2.2.3 自动化与外包\n\n我们现在研究在存在外包的情况下自动化的影响。有两种情况需要考虑，取决于南方的相对工资。如果南方的工资足够低，那么外包比使用机器人更便宜。我们称之为“大工资差距”情况。但如果南方的工资足够高，可外包的任务就会面临自动化的风险。我们称之为“小工资差距”情况。\n\
  \n**大工资差距**：$p[n] > p[r] > p[s]$。在这种情况下，机器人只替换北方工人。在不失一般性，我们可以设定 $\\xi = 0$。将 $m[n]\
  \ = 1-\\lambda-\\kappa$，$m[s] = \\lambda$ 和 $m[r] = \\kappa$ 代入方程 (8) 和 (9) 得：\n\
  \n$$w_{n} = a_{n}\\left\\lbrack {\\\\left( {\\\\frac{a_{s}}{a_{n}}\\\\frac{w_{n}}{w_{s}}}\
  \ \\right)^{\\lambda}\\left( \\frac{a_{r}}{r} \\right)^{\\kappa}} \\right\\rbrack^{\\\
  frac{1}{1 - \\kappa}}$$\n\n其中\n\n$$\\frac{w_{n}}{w_{s}} = \\frac{1 - \\lambda -\
  \ \\kappa}{\\lambda}\\frac{L_{s}}{L_{n}}.$$\n\n与没有外包的情况相比，有两个不同点。首先，机器人的生产率效应更强，因为它们替换了现在更昂贵的北方工人：$\\\
  frac{a_{s}}{a_{n}}\\frac{w_{n}}{w_{s}} > 1$。结果是，即使机器人在自给状态下不会使用（$a[r] < r$），也能提高北方的实际工资。然而，自动化降低了对北方工人的需求，从而增加了与机器人竞争的南方工人的相对工资。因此，北方工人现在遭受负面的贸易条件影响。由于后者，机器人现在可以降低北方的实际工资，即使它们在自给状态下会增加工资（$a[r]\
  \ > r$）。更准确地说，如果满足\n\n$w[n]$ 随 $\\kappa$ 下降：\n\n$$\\ln\\left\\lbrack {\\\\left(\
  \ {\\\\frac{a_{s}}{a_{n}}\\\\frac{w_{n}}{w_{s}}} \\right)^{\\lambda}\\frac{a_{r}}{r}}\
  \ \\right\\rbrack < \\frac{\\lambda\\left( 1 - \\kappa \\right)}{1 - \\lambda -\
  \ \\kappa}.$$\n\n当 $r$ 和 $w[s]$ 较高时，该条件更容易被满足，因为在这种情况下生产率收益较小，负面的贸易条件效应可能占主导。\n\n\
  **小工资差距**：$p[n] > p[s] \\geq p[r]$。在这种情况下，机器人替换两个国家的工人。首先考虑 $p[s] > p[r]$ 的情况，这意味着\
  \ $m[n] = 1-\\lambda-\\kappa$。将 $m[n] = 1-\\lambda-\\kappa$，$m[s] = \\lambda$ 和\
  \ $m[r] = \\kappa$ 代入方程 (8) 和 (9) 得：\n\n（注：原文此处后存在大量重复和乱码，此处已根据核心逻辑翻译）\n\n\n\n公式\
  \ (11) 显示，这种配置完全取决于国内工人在两个部门中执行的任务。其直觉解释是，生产率效应对两个部门的影响是相同的，因此劳动力配置仅取决于替代效应。对于我们而言，公式\
  \ (11)还意味着，自动化对北美工人执行任务的影响可以从跨部门就业的变化中读出。在本章的剩余部分中，我们将基于这一结果识别工业机器人的替代效应，并测试该效应如何随外包而变化。鉴于工业机器人几乎专门用于制造业，其采用应该对\
  \ `m[n]^(z*)` 不产生任何直接影响。因此，如果我们发现自动化的外生冲击导致工人流离制造业，那么必然是 `m[n]^(x*)` 正在下降。此外，我们将比较不同当地劳动力市场和职业之间替代效应的差异，取决于它们对外包的暴露程度。如果我们在外包更盛行的地区或职业中发现替代效应较弱或没有，这将是与外源任务自动化相一致的证据。\n\
  \n# 3 数据与事刻画性事实\n\n本节解释了我们如何构建实证分析中使用的主要变量，并说明了数据中的主要模式。\n\n### 3.1 数据与变量\n\n我们的实证分析涉及了美国当地劳动力市场的自动化、外包和劳动力市场结果（就业和工资）。参考\
  \ Autor 和 Dorn (2013)，Autor、Dorn 和 Hanson (2013) 以及 Acemoglu 和 Restrepo (2019) 等，我们使用\
  \ Tolbert 和 Sizer (1996) 引入的通勤区（CZ）概念来识别当地劳动力市场。通勤区被定义为县集群，特征是内部通勤关系紧密，而区域之间的通勤关系较弱。我们的样本包含了覆盖整个美国大陆的\
  \ 722 个通勤区。\n\n**劳动力市场结果。** 对于每个通勤区，我们衡量了就业和工资，包括总体水平以及针对不同部门（制造业和非制造业）或工人技能组（大学学历和非大学学历），使用了来自两个来源的微观数据：1990\
  \ 年和 2000 年的十年一次人口普查；以及 2005 年、2010 年和 2015 年的美国社区调查（ACS）。这两个数据源均提取自 IPUMS (Ruggles\
  \ et al., 2020)。()\n\n参考 Autor 和 Dorn (2013)，我们将估计样本限制在处于工作年龄（16 至 64 岁）、非无偿家庭工人、不居住在机构集体宿舍且报告在过去一年内就业的个人。我们使用样本权重构建了通勤区级别的就业人数。为了构建工资，我们进一步排除了自雇者或农场工人、缺乏工作时长、周数或工资信息、以及每年工作少于\
  \ 40 周且每周少于 35 小时的人员。我们将平均工资计算为年薪和工资收入除以总工作小时。工资使用个人消费支出指数以 2005 年的固定价格表示。我们还利用人口普查和\
  \ ACS 数据构建了通勤区级的人口数字。在回归中，我们使用了就业人口比和平均工资对数的十年等效变化量，其计算方法为在给定时期内每个变量年化变化率的 10 倍（1990-2000、2000-2005、2005-2010\
  \ 和 2010-2015）。\n\n**机器人暴露。** 为了构建我们在通勤区级别的自动化代理指标，我们使用了美国工业机器人进口的高质量数据，并利用每个通勤区就业工业结构的信息将这些进口量投影到当地劳动力市场。我们首先从美国海关收集的\
  \ 1989–2018 年期间的详细产品级进口数据中提取机器人进口价值（Schott, 2008）；机器人进口被归类为协调关税税则（HTS）分类中特定的 10\
  \ 位产品代码。()\n\n```\n\\begin{array}{r} {\\Delta Robots_{ct} = \\sum\\limits_{j}\\\
  lambda_{cjt} \\cdot \\Delta\\ln Rob\\_ M_{jt},} \\end{array}\n```\n\n(12)\n\n其中\
  \ `c` 表示通勤区；`\\DeltalnRob\\_M[jt]` 是 `t` 时期内 `j` 行业美国机器人进口量的十年等效对数变化；`\\lambda[cjt]`\
  \ 是 `t` 时期初通勤区 `c` 总就业中行业 `j` 占的份额。()\n\n使用进口量来衡量美国自动化的动机是由于机器人生产部门的高度集中。世界上绝大多数机器人生产发生在少数几个非美国国家（特别是日本和德国），而美国还不是主要的机器人生产国。在美国境内生产的大部分机器人是由外国跨国公司的当地分公司制造的，旨在服务于邻近国家（主要是加拿大和墨西哥）运营的制造企业（例如，Casanova,\
  \ 2019）。相反，美国是全球第二机器人进口国，在机器人净进口量方面也是世界第二（例如，Furusawa and Sugita, 2021）。与此一致，进入美国的机器人进口与国际机器人联合会（IFR）记录的该国机器人总存量高度相关：将机器人进口的对数变化\
  \ `\\DeltalnRob\\_M[jt]` 对 IFR 跨行业和时期的机器人存量对数变化进行回归，得到的系数为 0.998（标准误 0.058）。虽然 IFR\
  \ 数据存在重要的局限性——最显著的是它们只包含机器人数量（而非价值），并且由于包含了本土来源机器人，它们可能反映了影响国内劳动力市场的技术冲击——但如此高的相关性表明，机器人进口可能捕捉了美国机器人使用的大部分变化。()\n\
  \n如前所述，为了将全国范围内的机器人进口分配到各个行业，我们使用了从美国进口矩阵获得的机械设备跨行业分布。这一选择是为了与进口数据保持一致，但事实证明其对结果没有影响。首先，机械设备在各行业的分布与从美国投入产表中获得的总机械设备（国内加国外）采购分布非常相似：将总机械设备采购的行业份额对相应的机械进口份额进行回归，得到的系数为\
  \ 1.069（标准误 0.021）。与此一致，如果我们使用总机械设备采购的行业份额将机器人进口分配到各个行业来重新构建 `\\DeltaRobots[ct]`，我们的结果将保持不变（见第\
  \ 4.1 节）。更广泛地说，机械设备的跨行业分布也与美国安装的机器人总存量高度相关：在 1993–2016 年，对 IFR 数据涵盖的 19 个综合行业的对数\
  \ IFR 机器人存量对机械进口行业份额进行回归，得到的系数为 0.541（标准误 0.123）。这表明，机械设备的跨行业分布紧密反映了美国各行业机器人的实际使用情况。()\n\
  \n\n\n\n不同统计区（CZs）之间 `ΔRobots`[`ct*]` 的变化可能是由影响劳动力市场结果的特定统计区因素驱动的。例如，正向需求冲击可能会促使企业实现自动化，同时提高就业人数和工资。同样，企业在受到某些负面劳动力市场冲击后，可能会采用机器人来提高生产力。这意味着自动化对劳动力市场结果影响的\
  \ OLS 估计可能存在偏差，无论是向上偏还是还是向下偏。。解释 `ΔRobots`[`ct*]` 的潜在内生性，我们基于 Autor, Dorn and Hanson\
  \ (2013) 的研究，构建了一个工具变量，旨在隔离由机器人出口国供给冲击引起的 `ΔRobots`[`ct*]` 变化，而非由发生在单个统计区的冲击引起。为了构建该工具变量，我们从联合国贸易统计数据库（UN\
  \ Comtrade）获取了 1989–2018 年间非美国国家向十一欧洲经济国家的机器人出口数据。\n\n```\n\\begin{array}{r} {\\\
  Delta Robots\\text{\\\\_}Oth\\_{ct} = \\sum\\limits\\_{j}}\\lambda\\_{cjt} \\cdot\
  \ \\Delta\\ln Rob\\text{\\\\_}M\\text{\\\\_}Oth\\_{jt},} \\\\ \\\\ \\end{array}\n\
  ```\n\n(13)\n\n其中 `Δ`ln`Rob`_`M`_`Oth`[`jt*]` 是在 `t` 期间，非美国国家向第 `j` 行业的十一个欧洲国家机器人出口的十年等效对数变化。\n\
  \n识别要求：促进非美国国家机器人出口的供给冲击，与影响单个统计区劳动力市场结果的美国特定技术冲击不相关。同样，十一个欧洲进口国的需求冲击必须与美国当地劳动力市场的需求冲击不相关。为了缓解识别方面的顾虑，我们将使用一个极其严苛的设定（见第\
  \ 4.1 节），该设定控制了涵盖州级和年份层面的一系列固定效应。这些固定效应吸收了所有统计区共有的美国特定冲击，以及美国各州之间的差异趋势。该设定还控制了几个衡量统计区层面其他类型贸易、技术和需求条件冲击的代理变量。总体而言，设定中包含的丰富控制变量和固定效应应在很大程度上确保\
  \ IV（工具变量）结果并非明显由与工具变量可能相关的美国特定冲击所驱动。\n\n### 离包强度\n\n遵循 Feenstra and Hanson (1999)\
  \ 的方法，我们将离包衡量为进口中间投入占总投入采购的份额。该比例越高，意味着生产中对外国投入的使用越多，反映了生产阶段向国外转移的程度越高。我们利用 1997–2018\
  \ 年的美国投入产表和进口矩阵，构建了美国经济分析局（BEA）行业的离包强度。我们使用了两个互补的离包指标。第一个被称为“广义”离包（broad offshoring），考虑了所有类型的投入进口。第二种被称为“窄义”离包（narrow\
  \ offshoring），仅考虑与行业生产过程密切相关且因此可以由企业内部完成的投入进口。\n\n这两个指标的构建如下：\n\n```\nB\\\\_ Offsh\\\
  _{jt} = \\frac{\\sum\\_{h}I\\\\_ M\\_{jht}}{\\sum\\_{h}\\left( {I\\\\_ M\\_{jht}\
  \ + I\\\\_ D\\_{jht}} \\right)}\\mspace{1450mu}\\text{and}\\mspace{1450mu N\\\\\
  _ Offsh\\_{jt} = \\frac{\\sum\\_{h}I\\\\_ M\\_{jht}}{\\sum\\_{h}\\left( {I\\\\_\
  \ M\\_{jht} + I\\\\_ D\\_{jht}} \\right)}\n```\n\n(12)\n\n其中 `B_Offsh`[`jt*]`、`I_M`[`jht*]`\
  \ 和 `I_D`[`jht*]` 分别表示进口和国内采购。`B_Offsh`[`jt*]` 和 `N_Offsh`[`jt*]` 表示离包强度。\n\n###\
  \ 职业特征\n\n最后，我们利用职业特征来分析自动自动化的整体影响。遵循 Graetz and Michaels (2018) 的方法，我们对可以被机器人取代的职业进行了分类。Graetz\
  \ and Michaels (2018) 定义，如果一个职业名称对应于 IFR 识别的机器人类别之一（例如焊接、喷漆），则该职业是“可替代的”。我们主要的离包可行性指数来源于\
  \ Firpo, Fortin and Leieux (2011)，他们利用 O*Net 数据库的数据来衡量工人在工作中需要面对面互动和物理到场的程度。我们对指数进行了标准化处理，使其跨职业的均值为\
  \ 0，标准差为 1。指数经过反转处理，因此数值越高表示离包可行性越高。这两个职业特征涵盖了 331 个美国人口普查数据。\n\n\n\n\n图 3.2 揭示了不同特征职业就业的总体趋势。该图显示了给定年份内不同居住区（CZs）的平均就业人口比，分别涵盖了可外包职业和可替代职业。总就业/人口比与其中某一组对应的比例之间的差异，等于其互补组（非可外包或非可替代职业）的就业/人口比。可外包职业的就业人数有所增加，特别是在\
  \ 2000 年后。与此同时，可替代工作的就业份额在 2000 年达到平台期后在随后的年份中显著下降，并在 2010 年迅速加速。这些趋势揭示了近几十年美国就业职业结构的显著变化：就业从非可外包工作向可外包工作转移，从可机器人替代的职业向不可替代的职业转移。\n\
