  \ |\n| --- | |\n\n### 4.2 未来机器人自动化的影响\n\n从上一节描述的反事实分析中，我们发现（其他外）在 1993-2014 年期间，机器人技术的进步对整个劳动力市场的影响微乎其微。这可能仅仅是因为机器人技术在\
  \ 2014 年仍处于早期阶段。因此，在本节中，我们大胆假设机器人生产率将从 2014 年的水平提高十倍（即 `λ[t] = Â[t]^(S) = 10`），并评估这种规模的机器人技术进步对劳动力市场的影响。\n\
