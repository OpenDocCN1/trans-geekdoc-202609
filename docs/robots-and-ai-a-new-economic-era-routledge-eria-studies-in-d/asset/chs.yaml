  \ (19), (20)和(21)决定了均衡配置。\n\n# 远程迁移与工作外包能力的发展\n\nRichard Baldwin way Jonathan I.\
  \ Dingel\n\nDOI: [10.4324/9781003275534-6](https://doi.org/10.4324/9781003275534-6)\n\
  \n## 1 引言\n\n由于一个不可的原因，全球化的未来正在发生变化。移动无重量物品（思想和数据）的成本下降远快于移动重物（货物）的成本。远程迁移（Telemigration）——即当家在外时在家工作——是全球化无重量未来的一个虽小但快速增长的。\n\
  \n远程迁移会对发展产生可衡量的影响吗？这个问题的答案取决于第二个问题的答案：有多少服务业工作将从富国外包到新兴市场？由于回答这个问题需要各种无法预知的因素，经济学家倾向于关注一个更狭窄的问题：有多少工作是可以外包的？\n\
  \n十多年前，Alan Blinder (2007) 通过观察美国职业的特征解决了这一更狭窄的问题。他的答案基于两个向量。第一个向量描述了每个职业的外包能力。第二个向量是雇于每个职业的美国工人数目。这两个向量的内积得出了可以外包的美国工作数量。Blinder\
  \ 的答案是：“我估计，所有美国工作中约有 22%到 29%在未来一二十年内是或将可能被外包的（我没有估计实际上会有多少工作被外包）。”\n\n本章的目标之一是论证，从狭窄的问题转向更广泛的问题，应该从关注职业性质转向更广泛的考量，并指出引力方程作为粗略量化可能外包给低工资经济体工人的价值的方法。我们在第\
  \ 3 节（理论动机）和第 4 节（量化练习）中开展这一练习。\n\n我们粗略量化练习的结论是，远程迁移的基数太低，无法使其成为发展的主要动力——除非发生根本性的变化。我们使用的常弹性引力模型包含了一系列假设，这些假设限制了贸易成本适微下降的影响。相应的，远程迁移对高工资国家的服务人员不会构成太大威胁。这个令人宽的结论与高工资国家对在线外包产生的焦虑背道而驰。例如，David\
  \ Wessel (2004)在《华尔街日报》中写道：\n\n> 美国人对向印度和中国外包的很大焦虑可以简化为这个简单的问题：我们的孩子还会有好工作吗？在技术几乎可以即时处理白领工作的时刻，数千万计技能日益提高的中国和印度工人正在加入全球经济。这种大众认知与我们量化练习之间不匹配的来源是什么？我们使用的模型是否漏掉了什么，还是说这种大众的焦虑反映了经济学家与公众之间关于比较优势作用的熟悉的脱节？在第\
  \ 5 节中，我们探讨了这种不匹配可能是模型的错误。经典框架排除了贸易摩擦的微小变化产生就业剧烈变化的可能性。从 Eaton 和 ortum (2002)开始的里卡德贸易模型通常假设比较优势模式在国家之间是对称的。在第\
  \ 5 节中，我们阐述了允许边际变化产生剧烈影响的情况。该分析框架兼具货物贸易和远程迁移。在这个简单的两国远程迁移模型中，国际贸易成本的对称下降可以对发达和发展中经济体产生不对称的结果。关键在于假设潜在的比较优势的形式与通常假设的不同。在该模型中，远程迁移可以有意义地塑造低工资国家的历程，并对高工资经济体的服务业前景产生相应影响。\n\
  \n## 2 外包工作：超越双向量\n\nBlinder 的开创性计算主要取决于他对特定职业外包能力的判断，这种四级分类法范围从不可外包（IV 类）到高度可外包（I\
  \ 类）。该判断受图图 6.1 所示的决策树引导。\n\n![图 6.1 Blinder 的分类。来源：Blinder (2007)。](img/fig0021.jpg)\n\
