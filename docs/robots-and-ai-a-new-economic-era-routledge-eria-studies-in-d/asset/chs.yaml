  \ and Krueger (2013)`指标则根据家庭调查的信息量化了职业的外包性。在这些情况下，我们也发现了正相关且估计精确的系数，这表明可替代性与外包性之间的正相关性并不取决于我们如何衡量后者。\n\
  \n这些结果意味着自动化和外包影响相似的职业。因此，自动化可能作为外包的替代品，允许企业在以前在海外的任务中使用机器人。我们现在通过研究机器人进口与外包指标之间的关系，为这种替代性提供更直接的证据。为此，我们对跨行业、为期五年的外包指标变化对机器人进口的变化进行回归。我们控制了行业固定效应以吸收行业特定趋势，并控制了行业×年份固定效应以吸收部门间的共同冲击；回归按期初的行业就业人数加权。结果见表\
  \ 3.4 的第(2)和第(3)列。无论使用哪种外包指标，机器人进口的系数始终为负且估计非常精确：机器人进口增长越快的行业，其外包情况的减少也相对越多。这一发现与机器人替代以往在海外执行的任务是一的，并表明样本期间的自动化与活动回流美国有关。\n\
  \n### 4.3 机器人暴露、外包与就业\n\n机器人和外包是相互替代的，这对自动化对就业的影响具有潜在的重要意义。如果机器人引发了回流，其影响在职业和通勤区之间都可能具有异质性。首先，自动化可能导致较难外包的职业国内就业减少较多。原因是，在易外包的职业中，自动化会部分影响国外就业并促进回流美国。其次，在对外包强度较高的通勤区，自动化可能导致国内就业减少较少，因为这些通勤区的回流空间相对较大。我们现在根据这些考虑，重新审视机器人暴露对就业的平均影响。特别是，我们允许效应在职业和空间上发生变化，并研究这种异质性是否与之前记录的机器人与外包之间的替代性一致。\n\
  \n\n\n\n我们的第一个练习是拆解机器人暴露对不同特征职业的影响。为了实现这一目的，我们将跨互斥职业组的就业占人口比例的总体变化进行分解，然后使用特定组别就业占人口比例的变化作为因变量，重新估计了\
  \ `eq. (15)`。结果报告在表 3.5 中。首先，在图 a 中，我们将职业分为两组，并使用普通最小二乘法（OLS）回归来描述数据的中心趋势。第(1)和第(2)列如预期所示，机器人暴露与可替代职业就业显著下降相关，而与不可替代职业的就业没有变化。趣的是，第(3)和第(4)列显示，机器人暴露与可外包工作的就业不相关，但与不可外包任务的就业呈强负相关。\n\
