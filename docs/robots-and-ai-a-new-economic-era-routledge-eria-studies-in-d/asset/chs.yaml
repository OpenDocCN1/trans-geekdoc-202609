  \n## 4 反事实分析\n\n我们进行反事实分析以量化机器人过去自动化对全球经济的影响。在第 4.1 节中，我们模拟了 2014 年的反事实世界经济，其中机器人相关技术和国际贸易成本设定为\
  \ 1993 年的。而在第 4.2 节中，我们模拟了 2014 年的反事实世界经济，其中机器人技术在 2014 年的基础上有所进步。\n\n### 4.1 1993\
  \ 年至 2014 年机器人化和全球化的影响\n\n#### 4.1.1 1993 年至 2014 年贸易成本和机器人技术的变化\n\n为了分别分析技术进步和贸易成本降低的影响，我们考虑了两种反事实情景：仅将机器人技术设定为\
  \ 1993 年水平（机器人效应），仅将贸易成本设定为 1993 年水平（贸易效应）。\n\n**贸易效应** 我们遵循 Novy (2013) 估计 1993\
  \ 年至 2014 年贸易成本的变化。假设贸易成本是双边对称且通用的（即 `dnit`   `dnit`  = `dint`  = `dnit`  = `dint`）且国内贸易成本保持不变（即\
  \ `dnn2004`  = `dnn1993`），1993 年至 2004 年间贸易成本的变化可以由 (8) 表示为：\n\n$$\\begin{array}{r}\
  \ {{\\\\hat{d}}_{nit}^{s} = \\frac{d_{ni1993}^{s}}{d_{ni2004}^{s}} = \\left( \\\
  frac{X_{ii1993}^{s}X_{nn1993}^{s}X_{ni2004}^{s}X_{in2004}^{s}}{X_{ni1993}^{s}X_{in1993}^{s}X_{ii2004}^{s}X_{nn2004}^{s}}\
  \ \\right)^{1/(2\\\\theta^{s})}.} \\\\ \\end{array}$$  \n\n(16)\n\n利用表 5.2 中 `θ^(s)`\
  \ 的估计值，我们从国际和国内贸易数据中估计贸易成本：CEPII TradeProd 数据库 (De Sousa, Mayer, Zignago, 2012)\
  \ 和国际贸易与生产估计数据库 (Borchert, Larch, Shikher, and Yotov, 2020).\n\n\n\n\n\n## 机器人效应\n\
  \n我们通过将模型中两个目标变量的预测值与数据进行匹配，校准了 1993 年至 2014 年机器人相关技术的进展。第一个目标是机器人密度，定义为每 1000 名工人拥有的工业机器人存量。根据\
  \ Graetz 和 Michaels (2018) 以及我们根据 IFR（国际机器人联合）数据的计算，全球机器人密度从 1993 年到 2014 年增长了 3.79\
  \ 倍。第二个目标是日本工业机器人的价格指数，它从 1993 年的 100 下降到 2014 年的 65.5。当 1993 年的机器人任务生产力和机器人生产的全要素生产率（TFP）分别比\
  \ 2014 年低 35% 和 31.5% 时，模型预测了这些变化，即 `γ̂s2014 = λ[s2014] = 0.65` 和 `Ân2014 = Â2014\
  \ = 0.685`。这些机器人技术的反事实变化假设适用于所有国家。\n\n### 4.1.2 结果\n\n本节报告了我们对以下影响进行的反事实分析结果：(1)\
  \ 机器人相对于低技能劳动力的相对价格以及机器人密度的影响；(2) 低技能和高技能工人的实际工资率；以及(3) 机器人对人的替代。\n\n表 5.5 中的第 (1)\
  \ 和 (2) 列显示了选定国家机器人技术和贸易对机器人相对低技能价格 `w[Rit]/w[Lit]` 的影响。第 (1) 列显示，如果机器人技术处于 1993\
  \ 年的水平，2014 年的机器人价格将高出约 47%。表中未显示，但我们的分析发现，相对价格的变化几乎完全归于机器人租赁率的提高。第 (2) 列表明贸易成本的影响小于机器人技术的影响，且不同国家之间存在差异。在大多数国家，如果贸易成本处于\
  \ 1993 年的水平，机器人的价格将会更高。这部分是因为贸易成本的下降降低了 1993-2014 年间的机器人价格。这也是因为贸易自由化使了这些国家的低技能工人。\n\
