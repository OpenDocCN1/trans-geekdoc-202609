  \n## 4. 产品多样性：贸易的扩展边际\n\n我们现在考察双边关系中贸易的品种数量。这被称为贸易的扩展边际（extensive margin of trade）。令\
  \ `N[cmxt]` 为 `t` 年国家 `x` 提供的国家 `m` 消费者的类别-*c* 的应用数量。我们将应用类别内的每个应用都视为一种品种。例如，Chrome\
  \ (Google)、百度 (Baidu)、Internet Explorer (Microsoft) 和 Safari (Apple) 都是浏览器的品种。遵循\
  \ Eaton, Kortum 和 Kramarz (2011)，我们将总下载量分解为每个应用的平均下载量乘以应用数量。在数学表达上，\n\n$$\n\\begin{array}{r}\
  \ {\\ln y_{cmxt} = \\ln{\\overline{y}_{cmxt}} + \\ln N_{cmxt}}\\text{其中}{\\overline{y}_{cmxt}}\
  \ \\equiv y_{cmxt}/N_{cmxt}.} \\end{array}\n$$\n(2) `ln{\\overline{y}_{cmxt}}` 对应密集边际（intensive\
  \ margin），而 `N[cmxt]` 对应扩展边际或品种数量。我们估计：\n```\n\\ln(N[cmxt]) = \\beta\\ln(1+AI[cxt])\
  \ + \\alpha[cmxt] + \\epsilon[cmxt]\n```\n也就是说，我们估计了之前相同的方程，但使用了不同的因变量。表 10.9 报告了结果。从\
  \ A 板来看，AI 部署与更多的双边贸易应用相关，这一结果在不同设定下都是稳健的。当因变量为总下载量时，系数大小约为一半。B 板报告了 IV 结果。这些结果比\
