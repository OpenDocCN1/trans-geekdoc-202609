  \ AI 相关就业最大集群的通勤区（commuting zones）取决于观察的是外出生还是本土出生工人。对于外出生男性，圣何塞（2018 年为 8.6%）和奥克兰（2018\
  \ 年为 8.1%）是 AI 相关就业最大的集群，而对于本土出生男性，圣何塞（2018 年为 1.8%）和奥克兰（2018 年为 3.4%）分别排名第十二和第五。对于本土出生男性，华盛顿特区（2018\
  \ 年为 4.9%）和波士顿（2018 年为 3.3%）是 AI 相关就业最大的集群，而对于外出生男性，华盛顿特区（2018 年为 5.6%）和波士顿（2018\
  \ 年为 3.7%）分别排名第五和第八。这为外出生者在 AI 相关工作方面专业化模式的差异提供了进一步证据。\n\n### 3.3 AI 相关职业中的显性比较优势\n\
  \n在本节中，我们考虑了外出生和本土出生工人在 AI 相关工作专业化方面存在何种差异。现有文献表明，在所有 STEM 相关职业中，外出生者的专业化模式均比本土出生者更强（Hanson\
  \ & Liu, 2017; Hanson & Slaughter, 2018）。在这里，我们将重点缩小到这两类人在 AI 相关工作中的显性比较优势。当然，外出生工人在\
  \ AI 相关职业中的专业化表明他们在这些工作中具有比较优势而非绝对优势。移民在 AI 领域的专业化可能代表了在该领域的绝对优势。相反，美国出生工人可能在所有职业中具有绝对优势，但由于在需要沟通和社交技能的任务中具有相对优势（这些技能在非\
  \ STEM 活动中可能更为重要），他们专注于非 STEM 部门。\n\n首先`图 7.3` 显示了按出生地划分的、大学学历人士在 AI 相关职业（`V.3`\
  \ 定义）中的工作份额。我根据教育程度和 STEM 职业专业化的相似性，将出生国家分为八个地区：美国；非洲和中东；中国和香港；欧洲、澳大利亚和新西兰；印度；韩国、日本和台湾；拉丁美洲和加勒比地区；其他亚洲。()\
  \ ![图 7.3 按出生地划分的大学学历人士在 AI 相关职业中的工作份额](img/fig0035.jpg)\n\n图 7.3 按出生地划分的大学学历人士在\
  \ AI 相关职业中的工作份额\n\n为了刻画 AI 相关工作的专业化，需要根据其在经济中的整体占比进行调整。我通过计算美国劳动力市场中 AI 相关就业的显性比较优势来实现这一点：\n\
  \n$$RCA\\_{n} = \\\\ln\\\\left( \\\\frac{L\\_{n}^{ai}/L^{ai}}{L\\_{n}/L} \\\\right),$$\n\
  \n其中 `L[n]ai)/L^(ai)` 是 `n`^(ai) 的份额，`L_n/L` 是 `n` 的份额。\n\n\n\n\n第二个因素可能是这两个国家在工程和数学领域的技术培训质量。中国在大学理工（STEM）培训方面投入了大量资金（Xie\
  \ & Freeman, 2020），而印度的技术学院在工程和数学方面表现出色。随着 AI 领域的扩张，强大的工程和数学技能可能使这些国家的工人能够很好地为 AI\
  \ 领域奠定基础。^()\n\n最后一个因素可能是美国的移民政策。在 1990 年之前，美国印度或中国裔背景的人士很少。因此，很少有美国居民能够为这些国家的个人提供基于家庭的移民签证担保，而根据法律，此类签证占美国政府每年发放的永久签证的绝大多数。他们获得美国永久居留签证（或`green\
  \ card`）的主要途径是通过雇主赞助签证，此类签证的供应量法律规定为当年所有限制性签证（即非授予美国居民直接亲属的签证）总额的 15%。获得雇主赞助`green\
  \ cards`的需求可能意味着，被选入的印度和中国移民更有比例地反映了美国公司最急需的高技能人才类型，包括高科技领域的人才。\n\n`H-1B` 签证于 1990\
  \ 年引入，允许工人在美国工作三年，并续签签证进行第二个三年的停留，这些签证主要由技术相关领域的工人获得（Bound et al.*., 2017, 2021）。这些签证充当了雇主赞助`green\
  \ cards`的队列。获得雇主赞助`green card`的途径之一是先获得 `H-1B` 临时工作签证，这允许工人在雇主承担耗时的雇佣赞助任务之前向美国雇主展示其才华。第二种相关的途径是获得学生签证，在美国完成本科或研究生学位，然后获得\
  \ `H-1B` 签证。许多中国和印度移民需要获得 `H-1B` 签证才能进入美国，这可能产生一种筛选机制，有利于那些在需要适用于 AI 技能的工作中表现工人。\n\
  \n## 4 回归分析\n\n在本节中，我将介绍本章的核心实证结果。我将通勤区（CZ）在 AI 相关活动中的专业化变化估计为面对该 CZ 的移民劳动力供给冲击的函数，该冲击定义为对国家受过教育移民人数增长的局部暴露程度。估计涵盖了\
  \ 2000 年至 2018 年的长期变化；2000 年至 2009 年以及 2009 年至 2018 年的堆叠一阶差分结果见附录。这一时期跨越了 21 世纪初\
  \ AI 相关活动增长的放缓以及 2010 年后增长的加速。所有设定都控制了区域商业周期、初始阶段 CZ 的人口组成以及对技术变化、制造业衰落和全球化的暴露。\n\
  \n在介绍设定之前，有必要阐明分析基础的隐性实验。2000 年后，美国科技公司开始加大对 AI 的投入（由于技术突破）。它们的灵活性使它们能够自由选择认为合适的地方。2000\
  \ 年后，美国流入了大量高学历的外籍出生工人。由于移民定居的历史模式，来自特定国家的工人倾向于聚集在特定的美国区域；由于历史模式，来自特定国家的工人会被特定职业所吸引。我评估的准实验是：外籍工人流入量较大的\
  \ CZ 是否变得专于 AI 领域。为了使该准实验有效，流入不能由当地公司对 AI 的投资引起。估计的一项挑战在于如何构建移民供给冲击，以最大限度地减少反向因关系的可能。移民供给冲击如何影响本地工人的就业？这种影响的程度在男女之间可能不同。一方面，公司可能会扩大本地工人的就业，因为外籍工人是补充性的；另一方面，如果外籍工人是替代性的，公司可能倾向于取代本地工人。在研究所有职业的移民供给冲击调整时，Burstein\
  \ 等人 (2020) 发现既没有挤入效应也没有挤出效应——从总体而言，到达的工人并没有取代服务可贸易的 `CZ` 内的本地工人。\n\n### 4.1 实证设定\n\
  \n核心实证设定的形式如下：\n\n```\n\\Delta Y_{cg\\tau}^{v} = \\beta_{g0} + \\beta_{g1}\\Delta\
  \ z_{cg\\tau}^{v} + \\beta X_{cg\\tau} + \\epsilon_{cg\\tau}\n```\n\n其中，`\\Delta\
  \ Y_{cg\\tau}^{v}` 是性别 `g`（女性、男性）、受过大学教育的主力年龄人在通勤区 `c`（美国本土的 722 个 CZ）中，类型为 `v`（V.3,\
  \ V.2）的 AI 相关职业在时间段 `τ`（2000-2018）的就业比例的变化。\n\n移民劳动力供给冲击 `\\Delta z_{cg}^{v}` 定义如下（所有值均特定于性别组，此后我省略了性别组索引）：\n\
  \n```\n\\Delta z^{v}_{c\\tau} = \\sum\\limits_{n}\\underset{\\text{A}}{\\underset{��}{\\\
  {\\frac{\\left( {\\sum_{c^{’}}L_{c^{’}2000}^{nv}} \\right)-L_{c2000}^{nv}}{\\left(\
  \ {\\sum_{c^{’}}L_{c^{’}2000}^{n}} \\right)-L_{c2000}^{n}}}} + \\underset{\\text{B}}{\\\
  underset{��}{\\{\\frac{L_{c,2000}^{n}-L_{c2000}^{nv}}{\\left( {\\sum_{c^{’}}L_{c^{’}2000}^{n}}\
  \ \\right)-\\left( {\\sum_{c}L_{c^{’}2000}^{nv}} \\right)}} + \\underset{\\text{C}}{\\\
  underset{��}{\\{\\frac{\\left\\lbrack {\\left( {\\sum_{c^{’}}L_{c2018}^{n}-L_{c2018}^{n}}\
  \ \\right)-\\left( {\\sum_{c^{’}}L_{c2000}^{n}-L_{c2000}^{n}} \\right)} \\right\\\
  rbrack}{L_{c2000}}}}}\n```\n\n\n\n\n这种冲击遵循 Altonji 和 Card (1991) 以及 Card (2001)\
  \ 开发的移民劳动力供给份额移动工具（shift-share instruments）逻辑，是由三个项相乘得到的。\n\n项 `C` 是在 `τ` 期间，特定统计区（CZ）`c`\
  \ 之外、国籍群体 `n` 的特定性别青年龄受过教育人士的就业人数变化（例如，2000 年至 2018 年间，居住在奥斯汀以外的美国受过教育印度人数的变化），并以初始时期\
  \ CZ `c` 内该性别青年龄受过教育人士的就业人数进行归一化。通过在在该项的分子中排除 CZ `c` 的数量，我利用了关于群体 `n` 移民的信息，并排除了那些选择\
  \ CZ `c` 作为目的地的移民（这类人可能受到 CZ `c` 经济状况的影响而做出迁移决策）。因此，该值总结了国籍群体 `n` 的受过教育移民在 `τ` 期间内对美国的通用的吸引力。识别所需的假设是，CZ\
  \ `c` 的劳动力需求冲击没有影响其他 CZ 的移民流入。\n\n项 `B` 是在 2000 年居住在 CZ `c` 的国籍群体 `n` 工人在非 AI 职业组\
  \ `v` 之外就业的占比例。在该比例中排除 AI 相关职业，捕捉了初始时期 CZ `c` 对来自地 `n` 的受过教育移民的吸引力，这种吸引力是该 CZ 通用的，而非特定于\
  \ AI 活动的。项 `A` 是初始时期 CZ `c` 之外、国籍群体 `n` 的受过教育工人在 AI 职业组 `v` 中工作的所占比例。在该值中排除 CZ `c`，捕捉了国籍群体\
  \ `n` 在 AI 相关活动中的通用专业化程度。将项 `A`、`B` 和 `C` 相乘，然后对所有国籍群体进行求和，便得到了某 CZ 内 AI 相关职业移民工人的推断流入量，该量基于移民在\
  \ AI 相关职业（CZ 之外）的专业化程度、不同移民群体在 CZ 内的集中程度（AI 相关活动之外）以及移民人口的国家增长（CZ 之外）。(1) 中的设定等同于第一阶段回归，其中\
  \ AI 相关职业工人的 CZ 就业是内生变量，预测的 CZ 移民劳动力供给变化是工具变量。\n\n控制变量向量 `X[cg*τ]` 包括州固定效应（用于控制区域性经济周期）；(2)\
  \ 中的比例之和（即 `∑[n]A[cn]B[cn]`，遵循 Borusyak 等人 (2020) 使用份额移动冲击作为回归变量建议）；以及 2000 年人口中受过教育者的比例、外出生人口的比例、总就业人数中女性的比例、制造业的就业比例（用于控制该部门的长期趋势）、常规密集型工作的就业比例（用于控制对自动化及相关形式的技能偏向技术变革的暴露程度）以及可外包职位的就业比例（用于控制对全球化的暴露程度）。第三组控制变量遵循了\
  \ Autor 等人 (2013) 在分析局部劳动力市场对贸易相关劳动力需求冲击的调整时使用的变量。我按州对标准误进行聚类，并根据初始时期 CZ 总就业人数（给定性别组青年龄受过教育工人总数）对回归进行加权。分析中使用的因变量和移民冲击衡量量的汇总统计数据见附录\
  \ 表 7A.9。\n\n### 设定识别\n\n说明 (1) 中的设定允许且不允许我们识别什么是非常重要的。作为一种双重差分回归（difference-in-difference），它允许我们比较受到较大冲击的\
  \ CZ 的专业化变化。跨 CZ 的任何共同影响都被常数项吸收。\n\n### 基准结果\n\n基准结果出现在表 7.3 中，AI 相关职业是根据职位名称定义的。1.68\
  \ 的系数（t 值 = 2.56）意味着，在移民冲击暴露程度第 75 百位数和第 25 百分位的 CZ，其受过教育男性的比例会增加 0.08 个百分点。因变量是\
  \ 2000–2018 年长期差异下，男性（第 1–3 列）和女性（第 4–6 列）在 AI 相关职业工作时长比例（V.3 定义）的变化，分别显示了所有工人（第\
  \ 5 和 6 列）、外出生工人（第 1 和 2 列）以及本土出生工人（第 3 和 4 列）。\n\n| | (1) | (2) | (3) | (4) | (5)\
  \ | (6) |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| 移民冲击 (v3) | 1.927\
  \ | -0.242 | 1.684 | 0.776 | 0.107 | 0.883 |\n| (0.411) | (0.324) | (0.658) | (0.393)\
  \ | (0.262) | (0.626) |\n| 州 FE | 是 | 是 | 是 | 是 | 是 | 是 |\n| 观测值 | 722 | 722 | 722\
  \ | 717 | 717 | 717 |\n| 调整后 R 方 | 0.797 | 0.380 | 0.541 | 0.695 | 0.528 | 0.304\
  \ |\n| DV 均值 | 0.076 | 0.063 | 0.139 | 0.019 | -0.018 | 0.001 |\n| DV 第 25 百位数 |\
  \ 0.032 | 0.026 | 0.107 | 0.005 | -0.040 | -0.020 |\n| DV 第 75 百位数 | 0.088 | 0.090\
  \ | 0.167 | 0.027 | -0.002 | 0.017 |\n\n\n\n\n第 1 列和第 2 列将第 3 列的因变量分解为两个部分：外出生人士就业增加的部分以及本地出生人士就业增加的部分。根据构造，第\
  \ 1 列和第 2 列的系数之和等于第 3 列。第 1 列高度精确的系数估计 1.93（t 值 = 4.69）表明，在比较受劳动力供给冲击的 75 分位数和 25\
  \ 分位数的地区时，受影响较大的地区在受过教育的外出生男性 AI 相关就业比例上每年增加了百分点（=1.93 × (0.08 - 0.03)）。相比之下，在第\
  \ 2 列中，当因变量为本地出生男性 AI 就业的变化时，移民冲击的系数较小且估计不精确（`β` = -0.24，t 值 = 0.75）。这意味着地区的移民劳动力冲击完全通过增加外出生人士的就业来扩大\
  \ AI 相关就业。这种冲击既没有挤出本地出生人士的就业机会。\n\n地区级移民劳动力供给增长对外出生人士 AI 就业的集中影响值得关注，因为从全国范围内来看，外出生和本地出生工人对\
  \ AI 就业增长的贡献大致。表 7A.9 显示，2000 年至 2018 年 AI 就业人数平均变化中，54.6% 归于外出生人士的增加，45.4% 归于本地出生人士的增加。尽管贡献相似，但这两个群体对局部高技能劳动力供给冲击的反应完全不同。与图\
  \ 7.1 的描述性证据一致，驱动外出生人士 AI 相关就业增长的因素似乎与本地出生人士不同。\n\n重要的是，表 7.3 的结果并非机械性的。受过教育移民总体增加较大的地区在\
  \ AI 相关活动中经历了更大的增长。由于 AI 相关职业占总就业的比例极小，地区大学毕业生供应的扩大与 AI 相关活动的专业化提高之间不存在自动联系。现在转向女性的结果，这些结果证实了这一推理。\n\
  \n女性的估计结果出现在表 7.3 的第二个面板。第 6 列所示，移民供给冲击对所有受过教育女性 AI 相关就业的影响为正但估计不精确（`β` = 0.88，t\
  \ 值 = 1.41）。这一总体效应结合了第 5 列对本地出生女性 AI 就业的正向微小且不精确的影响（`β` = 0.11，t 值 = 0.42），以及第 4\
  \ 列对外出生女性 AI 就业更大、正向且更精确的影响（`β` = 0.78，t 值 = 1.98）。考虑到男女在 AI 相关工作中的差异化专业化——2000\
  \ 年至 2018 年，AI 相关职业的就业比例男性每年增加 0.14 个百分点，而女性仅增加 0.14 个百分点——移民冲击对女性产生了实质影响。\n\n###\
  \ 4.3 稳健性检验\n\n接下来，我从三个维度探讨实证结果的稳健性。首先，我使用了替代就业指标。附表 7A.10 显示了使用人数而非工作小时来衡量就业的结果。对于男性、女性以及所有出生群体，表\
  \ 7A.10 的结果与 7.3 中的结果非常相似。这意味着移民冲击对 AI 就业的密集边缘（工作小时）和扩展边缘（人数）具有可比的影响。\n\n其次，我调整了分析中使用的时期定义。我没有使用\
  \ 2000 年至 2018 年的长差分，而是将数据组织为两个时期的堆叠差分：2000 年至 2009 年（AI 增长相对缓慢）和 2009 年至 2018 年（AI\
  \ 增长相对快速，Bloom 等人，2020）。附表 7A.12 中的结果在系数符号和大小上与表 7.3 的结果非常相似。缩短时期范围和扩大样本量使得系数估计更加精确。对于女性，移民冲击对\
  \ AI 相关职业就业的影响现在所有女性以及外出生女性中均呈现为正向且具有显著的精确估计。对本地出生女性的影响仍然较小且估计不精确。\n\n\n\n最后，我扩大了\
  \ AI 相关职业的定义。我目前为止在估算中使用的 `V.3` 衡量标准将 AI 职业定义为 30 个职业名称，其中 16 个是在 1990 年之后创建的。更广泛的\
  \ `V.2` 定义包含 146 个职业名称，其中 48 个是在 1990 年之后创建的。表 7.4 报告了使用工作小时衡量的就业以及 2000 年至 2018\
  \ 年长差分的 V.2 AI 相关职业结果。附录表 7A.11 和 表 7A.13 分别显示了使用工人人数以及 2000 年至 2009 年和 2009 年至\
  \ 2018 年堆叠一阶差分的相应 V.2 就业结果。对于男性，表 7.3 和表 7.4 中的结果在定性上是相似的。对于任何一种衡量标准，高技能移民冲击对 AI\
  \ 相关职业的就业都有强烈的正向影响，这完全由于外出生人口的扩大。结果在幅度上存在差异。V.3 职业的移民冲击系数是 V.2 职业的两倍（`1.95 = 1.93/0.99`）。对于女性，系数大小的变化更为显著。表\
  \ 7.4 中外出生女性的移民冲击系数仅为表 7.3 的三分之一（`0.36 = 0.78/0.28`），且估计相当不精确（t-value = 0.99）。\n\
