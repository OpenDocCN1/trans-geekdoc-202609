  \n图 3.2 按职业组划分的就业/人口比 ¶ 来源：美国人口普查（1990, 2000）和美国社区调查（2005-2015）。 ¶ 注：可替代职业是指其名称对应国际机器人联邦识别的至少一个机器人应用类别的职业（Graetz\
  \ and Michaels, 2018）。外包性通过一个指数衡量，该指数捕捉了工人在工作中需要面对面互动和物理临场的程度（Autor and Dorn, 2013）。该指数经过重新缩放，数值越高表示外包性越高。可外包职业是指该指数高于样本中值的职业。所有数据均为跨居住区的算术平均值。\n\
  \n美国劳动力市场的这些调整与自动化和外包重要性的重大变化是同时发生的。图 3.3 显示了分析期间美国机器人进口的演变情况。为了突出该变量的主要趋势，图表报告了从\
