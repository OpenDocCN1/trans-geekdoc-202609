  \ 分别表示在 1%、5% 和 10% 水平上显著。\n\n\n\n\nOLS 估计显示，机器人暴露与制造业就业之间存在负相关且在统计学上显著的关系。相反，与非制造业就业的相关性为正，且在加入控制变量后变得具有统计学显著性。两种效应部分相互抵消，因此机器人暴露与整体就业的相关性较弱，且并不总是具有统计学显著性。在附录表\
  \ B1 中，我们深入探讨了这些关系的时间性。使用简洁的模型设定，我们发现对较晚时期（2005–2010 年和 2010–2015 年）估计的相关性比早期时期（1990–2000\
  \ 年和 2000–2005 年）更强。这与图 3.3 记录的样本后半部分机器人进口的加速是一致的。此外，我们通过将当前就业变化对 `ΔRobots`[`ct*`]的第一个领先项进行回归，进行了证伪检验。系数始终接近于零，这进一步表明机器人暴露与就业之间的关系并非由自动化增加之前的长期结果趋势驱动的。\n\
  \n附录表 B1 还包含对基准设定的一系列广泛稳健性检验。我们特别展示了主要结果并非由异常值驱动，因为在排除每个时期 `ΔRobots`[`ct*`] 分布中处于最高百分比的\
  \ CZ 后，结果保持不变。我们还控制了对其他类型资本的暴露，发现相关性没有受到其他形式投资的污染。^()\n\n最后，在附录图 B1 中，我们使用了替代方法来修正聚类类标准误。具体而言，我们考虑了\
  \ CZ 内部随时间的残差相关（按 CZ 聚类）；同一州同同年不同 CZ 之间的相关（按州-年份聚类）；CZ 内部随时间的变化以及同一州同同年不同 CZ 之间的相关（CZ\
  \ 和州-年份双向聚类）；同一地理区域内不同 CZ 之间的相关（空间聚类）；以及具有相似产业结构的 CZ 之间（按行业相似性聚类）。^()\n\n我们现在转向\
  \ 2SLS 估计。图 b 的底部显示，`ΔRobots`\\_`Oth`[`ct*`] 的第一阶段系数为正、大且估计非常精确，这强调了工具变量在解释不同 CZ\
  \ 之间机器人暴露差异方面的强大预测能力。^()\n\n为了感知这些效应的幅度，我们将表 3.1 中报告的 `ΔRobots`[`ct*`] 平均值乘以表 3.1\
  \ 第 (5) 和 (6) 列所示的 2SLS 系数。这得出制造业就业为 -0.02，非制造业就业为 0.022。相应，在一个平均机器人暴露的 CZ 中，制造业就业相对于人口每十年将下降\
  \ 2 个百分点，这大致等于表 3.1 中记录的平均变化。同时，非制造业就业相对于人口每十年将增加 2.2 个百分点，大约是表 3.1 报告的平均变化的一半。这些数字表明，自动化显著贡献了美国在样本期间从制造业向非制造业部门的就业再配置。\n\
  \n最后，在表 3.3 中，我们通过研究机器人暴露对工资的影响来补充就业结果。估计结果显示，自动化提高了平均工资。该效应是非制造业部门驱动的。结合我们之前关于就业的证据，这进一步表明机器人暴露增加了制造业以外的劳动需求。在分别考虑受过教育和未受过教育的工人时，我们发现两组都存在正的工资效应，尽管高技能人员的点估计更大且估计更精确。在制造业中，自动化对平均工资的影响是负的，尽管估计不精确，这与自动化减少该部门的劳动需求是一致的。在分别考虑有学位和无大学学位的工人时，我们发现前一组的\
  \ `β` 为小的正估计，而后一组有较大的负估计。虽然这些系数中没有一个是精确估计的，但这些结果表明机器人倾向于减少制造业的劳动需求，特别是对低技能个人而言。\n\
