  \ and Avi Goldfarb）第 16 章。国家经济研究会议报告：芝加哥大学出版社。\n*   Wallen, Johanna. 2008. “工业机器的历史。”瑞典林朔̈平大学\
  \ 自动控制系技术报告，编号 LiTH-ISY-R-2853。瑞典林朔̈平大学，电气工程系。\n\n# 2 自动化对劳动力需求的影响：近期文献综述\n\nPhilippe\
  \ Aghion, Céline Antonin, Simon Bunel 和 Xavier Jaravel\n\nDOI: [10.4324/9781003275534-2](https://doi.org/10.4324/9781003275534-2)\n\
  \n## 1 引言\n\n我们应该恐惧自动化还是欢迎自动化？一方面，如果我们认为人类工人将由执行其任务的机器取代，从而导致失业率上升并减少劳动力份额，那么恐惧可能会占据主导地位。另一方面，我们可能欢迎自动化，因为它促进了增长和繁荣，正如重大的技术革命所示的那样——19\
  \ 世纪初的蒸汽机、20 世纪 20 年代的电力——这些革命无一个产生过某些人所预言的大规模失业。\n\n对机器将摧毁人类工作的恐惧很久很久以前。早在 1589\
  \ 年，当威廉·李（William Lee）发明一种织袜的机器时，工人阶级对后果是如此恐惧，以至于他处处遭到拒绝甚至受到威胁。随后是了第一次工业革命，即“蒸汽机革命”，随之而来的是所谓的“卢德运动”。尽管\
  \ 1769 年通过了一项保护机器不被破坏的法律，但随着织布机的普及，破坏行为加剧了，并在 1811-1812 年的卢德起义中达到顶点。\n\n第二次工业革命，即“电力革命”，最早发生在\
  \ 19 世纪末的美国。三十年后，经济学家们开始对这场革命将产生的失业表示担忧。1930 年，凯恩斯写道：“我们正受到一种新疾病的困扰，某些读者可能还没有听说过这种疾病的名字，但在未来的几年里，他们将经常听到它——即技术性失业。”\n\
  \n最近，信息技术（IT）和人工智能（AI）革命也引发了类似的恐惧：通过创造更多自动化任务和职位的机会，IT 和 AI 可能会增加失业并降低工资。因此，近年来，应该对机器人征税的想法变得愈具影响力。\n\
  \n在本文中，我们讨论了自动化对就业的影响，参考了现有的关于`AI` 和自动化的文献，以及我们近期利用法国数据开展的实证工作（Aghion et al., 2019,\
  \ 2020）。我们首先阐述了关于该主题的两种对立观点。第一种观点认为自动化主要是在摧毁工作，即使这最终可能导致新工作的创造，以利用由工作摧毁导致的较低均衡工资。该预测是自动化将减少就业、工资和总劳动力份额。根据这第一种观点，自动化可能会减少工作总数和工资，从而降低工人的福利。另一种观点强调了自动化的市场规模效应：即，自动化企业变得生产率更高，这使他们能够降低质量调整后的价格，从而增加对产品的需求；由此市场规模的增长将转化为这些企业更高的就业率。我们通过对法国企业级数据的实证工作以及涵盖多个国家日益增长的文献，为第二种观点提供了实证支持。\n\
  \n本章结构如下：第 2 节 介绍了相关辩论。第 3 节 描述了对更乐观的自动化观点形成的实证共识，即对企业级就业产生正向直接影响。根据我们近期的实证工作，第\
  \ 4 节 描述了近年来利用法国工厂、企业和劳动力市场数据的文献的主要方法论方法和主要发现。第 5 节 为结论。\n\n## 2 辩论：自动化对就业的直接和间接影响是什么？\n\
  \n在本节中，我们简要介绍了自动化与就业的两种对立观点。\n\n### a. “负面”观点：自动化对总劳动力需求的负面局部均衡效应和正面一般均衡效应\n\n“负面”观点意味着自动化减少了劳动力需求并推低了工资。“局部均衡”（`PE`）效应是由于任务层面劳动力与机器之间的替代性导致劳动力需求下降。这种效应随后可以通过几个渠道在一般均衡（`GE`）中被抵消，这些渠道汇总在表\
  \ 2.1 并在后描述。\n\n表 2.1 自动化对劳动力需求影响的理论预测总结\n\n| *作者* | *自动化的 PE 效应* | *自动化的 GE 效应*\
  \ | *对自动化企业就业的预测影响* | *对自动化企业工资的预测影响* |\n| --- | --- | --- | --- | --- |\n| **Acemoglu\
  \ & Restrepo (2020)** | 通过任务层面劳动力与机器的替代导致劳动力需求下降。 | 通过工资下降和创造具有比较优势的新任务增加劳动力需求。\
  \ | 减少 | 减少 |\n| **Aghion, Jones & Jones (2017)** | 通过任务层面劳动力与机器的替代导致劳动力需求下降。 |\
  \ 通过总层面资本与劳动力之间的互补性增加劳动力需求。 | 减少 | 不确定 |\n| **Aghion, Antonin, Bunel & Jaravel (2020)**\
  \ | 通过生产力和消费者需求的增加增加劳动力需求。 | 抢夺效应导致非自动化企业的劳动力需求减少。 | 增加 | 不确定 |\n\n在 Acemoglu 和\
  \ Restrepo (2016) 中，这种抵消源于自动化抑制了均衡工资，从而鼓励了最初雇佣劳动力的活动创造这反过来增加了劳动力需求并限制了工资下降。在 Aghion,\
  \ Jones 和 Jones (2017) 中，对劳动力需求的`PE`效应被“鲍姆成本病”`GE`效应所抵消，随着时间的推移，劳动力相对于资本变得越来越稀缺，从而推高了工资（由于总层面资本与资本之间的互补性）。\n\
  \n更正式地说，Acemoglu 和 Restrepo (2016) 假设最终产是通过结合单位测量的任务 `X` ∈ `[N-1, N]` 的，如下：\n\n\
  ```latex\nY = \\operatorname{}\\left( {\\int_{N - 1}^{N}{X_{i}^{\\ \\frac{\\sigma\
  \ - 1}{\\sigma}}}di}} \\right)^{\\frac{\\sigma}{\\sigma - 1}}\n```\n\n其中：(i) `i`\
  \ > `I` 的任务 `X[i]` 是自动化的，仅由劳动力生产；(ii) `i` < `I` 的任务 `X[i]` 可以自动化，即在任务内部资本和劳动力是完全替代品，`σ-1`\
  \ 表示任务之间的常数弹性；(iii) `N` 索引任务的生产率；\n\n```latex\nX[i] = α(i)K[i] + γ(i)L[i]\n```\n\
  \n\n\n\n其中：(a) `α(i)` 是索引函数，当 `i > I` 时 `α(i) = 0`，当 `i < I` 时 `α(i) = 1`；(b) `γ(i)\
  \ = e^(A[i])`。`γ(i)` 是任务 `i` 的劳动生产率。Acemoglu 和 Restrepo 假设 `γ(i)` 指数增长，因此劳动在高索引任务生产中具有比较优势。\n\
  \n在具有内生技术变化的完整 Acemoglu-Restrepo 模型中，`I` 和 `N` 的动态（即现有任务的自动化和新生产线的发现）源于内生定向技术变革。在保证创新旨在使用更廉价要素的合理参数下，存在一个唯一且（局部）稳定的平衡增长路径（BGP）均衡。\n\
  \n该 `BGP` 的稳定性源于这样一个事实：对 `I` 或 `N` 的外部冲击将触发使经济回到具有相同劳动份额的先前 `BGP` 的力量。这一结果的基本直觉是：如果冲击导致过度自动化，那么劳动成本的下降将鼓励旨在创造新的、更复杂的任务的创新，以利用廉价劳动力，这将导致\
  \ `N` 的增加。换句话说，局部均衡中自动化对劳动力需求的负面影响被一般均衡效应所抵消，其中自动化对工资的抑制作用鼓励了最初利用劳动变得廉价这一优势的新新活动的进入。\n\
  \nAghion、Jones 和 Jones (2017) 指出了另一种抵消力量，即“鲍姆尔成本病”（Baumol Cost Disease）效应，它防止了自动化过度压低工资。在这里，由于现有自动化任务与现有劳动密集型任务之间的互补性，加上随着时间推移劳动相对于资本变得越来越稀缺，使得劳动份额可能随时间保持不变。\n\
  \n更正式地，最终产出的产生方式如下：\n\n$$Y_{t} = \\operatorname{}A_{t}}\\left( {\\int_{0}^{1}{X_{it}^{\\\
  rho}di}} \\right)^{\\frac{1}{\\rho}}$$  \n\n其中 `ρ < 0`（即任务是互补的），`A` 是知识并以恒速率 `g`\
  \ 增长，正如 Zeira (1998) 所示：\n\n$$X_{it} = \\left\\{ \\begin{matrix} {L_{it}\\operatorname{}\\\
  \\ \\\\ \\text{if\\ not\\ automated}} \\\\\\\\ {K_{it}\\operatorname{}\\\\ \\\\\
  \ \\text{if\\ automated}} \\\\\\\\ \\end{matrix} \\right.$$  \n\n在假设截至日期 `t` 有比例\
  \ `β[t]` 的任务已自动化的情况下，我们可以之前的总生产函数重新表示为：\n\n`Y[t] = At K[t]^(ρ)+(1−β[t])^(1−ρ*)L^(ρ))^(1/*ρ)`\
  \  \n\n其中 `K[t]` 表示总资本存，`L[t] ≡ L` 表示总劳动供给。\n\n在均衡状态下，时间 `t` 资本份额与劳动份额之比等于：\n\n\
  $$\\frac{\\alpha_{K_{t}}}{\\alpha_{L}} = \\left( \\frac{\\beta_{t}}{1 - \\beta_{t}}\
  \ \\right)^{1 - \\rho}\\left( \\frac{K_{t}}{L_{t}} \\right)^{\\rho}$$  \n\n因此，自动化商品比例\
  \ `β[t]` 的增加对 $\\frac{\\alpha_{K_{t}}}{\\alpha_{L}}$ 有两个抵消效应：(i) 首先是由项 $\\left(\
  \ \\frac{\\beta_{t}}{1 - \\beta_{t}} \\right)^{1 - \\rho}$ 捕获的正影响，我们将其命名为自动化任务的局部均衡效应（保持比例\
  \ $\\frac{K_{t}}{L_{t}}$ 不变）；(ii) 其次是由项 $\\left( \\frac{K_{t}}{L_{t}} \\right)^{\\\
  rho}$ 捕获的负面影响，因为我们记得 `ρ < 0`，我们将其命名为自动化的 GE（一般均衡效应）。后者与著名的鲍姆尔成本病有关：即由于自动化导致 $\\\
  frac{K_{t}}{L_{t}}$ 增加，劳动比资本更稀缺，加上劳动密集型任务与自动化任务互补的这一事实（事实上我们假设了 `ρ < 0`），这意味着劳动将占据总收入中持续的份额。\n\
  \n虽然前两个模型强调了限制自动化引发工资下降的不同抵消力量，但两者的共同点是，自动化的局部均衡效应是破坏就业。特别是，这种效应将在实现自动化的企业内部观察到。\n\
  \n### b. “积极”的观点：自动化对劳动力需求的积极局部均衡效应和负面一般均衡效应\n\n最近的研究对自动化提供了一种更“积极”的观点：自动化的直接影响可能是增加企业层面的就业。\n\
  \n请注意，这一渠道并不排除国家或行业层面的总需求可能对自动化没有积极反应，甚至产生负面反应的可能性。但与“旧观点”的主要区别在于，在这里，负面影响由非自动化的企业承担。\n\
  \n### c. 对机器人征税的启示\n\n越来越多的理论文献研究了可能证明机器人机器人合理的理由，特别是限制自动化可能导致的不平等性潜在上升。Costinot\
  \ 和 Werning (2018) 考察了征税或保护主义贸易政策是否有助于分配人工智能的经济效益。\n\n最优政策取决于就业和不平等对机器人化的弹性，这凸显了在实证中区分这两种观点的重要性。正如\
  \ Aghion 等人 (2020) 所讨论，第二种观点意味着特定国家对机器人进行单边征税可能由于外国竞争对国内就业不利：“在没有国际协调的情况下，在全球化世界中试图限制国内自动化以保护国内就业的尝试可能是事得其反的。”\n\
  \n## 3. 近期文献实证证据综述\n\n早期分析假设了技术性失业（Keynes, 1930; Leontief, 1952; Lucas & Prescott,\
  \ 1974），然而它们缺乏实证支持。下一代研究能够用数据与理论模型进行对比。他们的分析主要在国家或行业层面进行，并且大多传达了自动化对总就业和总工资产生负面影响的观点。近期企业级的证据为“新观点”提供了明确的因果证据，即自动化企业的劳动力需求有所增加。\n\
  \n\n\n\n在本节中，我们提供了近期关于自动化与就业的实证文献的概述。正如我们的文献综述所示，该领域已从将自动化主要视为破坏岗位的“消极”观点，转向了认为自动化能够提高生产力、市场规模，从而增加劳动需求和就业的“积极”观点。\n\
  \n### a. 基于跨行业和劳动力市场变化的研究设计的混合证据\n\n应该如何衡量自动化？直到最近，用于构建自动化实证分析的可靠来源仍然有限.^()\n\n\
  关于基于 `IFR` 数据的第一个衡量指标，`Graetz & Michaels (2018)` 在涵盖 17 个发达国家的面板数据上使用了来自 `IFR` 数据的机器人总数，发现自动化对总就业没有影响，尽管低技能工人的就业份额有所下降。同时，他们证明机器人密度化与全要素生产率和工资的增加有关，并导致产出价格下降。在\
  \ 14 个欧洲国家的面板数据上使用相同的衡量指标，`Klenert et al. (2020)` 发现机器人使用与总就业人数的增加相关。\n\n然而，`Acemoglu\
  \ and Restrepo (2020)` 中的实证结果表明，机器人化带来的工作破坏效应占据主导地位。更准确地说，作者分析了 1990 年至 2007 年间工业机器人使用量的增加对美国劳动力市场的影响。他们利用通勤区之间机器人采纳的差异，通过将局部就业和工资的变化对局部机器人暴露程度进行回归，估算了机器人在劳动力市场产生的影响.^()\n\
  \n尽管这种基于机器人总数的方法很有吸引力，但它存在一些缺点。首先，机器人是一种特定的自动化类型，专门设计用于取代人类工作，而更宽泛的自动化衡量标准可能包含仅部分替代人类工作的机器。另一个担忧源于\
  \ `IFR` 数据仅在国家层面可用。计算机器人暴露程度的局部指标——即 `Bartik measure`——需要做出一个强有力的假设，即特定行业安装的机器人数量除以该行业在通勤区中的重要性，在不同通勤区之间是相同的。然而，即使该行业在两个地区的份额相同，特定行业在通勤区\
  \ A 的机器人化可能比在通勤区 B 更密集。此外，`IFR` 数据仅涵盖制造业 13 个行业，这使得很难在不过拟合的情况下添加大量的行业级控制变量，从而引发了可能性：行业间自动化率的变化可能与影响劳动需求的行业级不可观测因素相关（例如，初始技能结构可能在自动化不同的行业之间存在差异）。最后一个潜在担忧是，不同通勤区之间机器人暴露指数的变化主要与\
  \ 1990 年汽车活动在美国全领土内的空间分布有关，因为工业机器人在汽车行业占据主导地位——汽车机器人占机器人总数的三分以上。\n\n另一种基于专利文本分析的特权自动化衡量标准也得出了不不一的结果。例如，`Webb\
  \ (2020)` 使用了一种依赖于专利文本与工人任务之间重叠的自动化衡量方法.^()\n\n无论是机器人数量还是专利衡量，国家或行业层面的自动化/机器人化总体衡量标准提供的证据仍尚无定论。跨国或行业级的研究设计难以孤立自动化与就业之间明确的因果关系。近期日益增长的企业级研究为这一问题提供了新的视角。\n\
  \n### b. 企业级研究设计提供了支持“新观点”的因果证据\n\n近期许多使用企业级数据的研究支持了以下预测：在自动化企业中，自动化对就业有直接的正向影响：分别在法国（`Acemoglu\
  \ et al., 2020, Aghion et al., 2020`）、荷兰（`Bessen et al., 2019`）、英国（`Chandler and\
  \ Webb, 2019`）、加拿大（`Dixon et al., 2019`）、丹麦（`Humlum, 2019`）和西班牙（`Koch et al., 2021`）。[表\
  \ 2.2] 报告了这些近期论文中企业级自动化对就业（及工资）弹性的数量级。\n\n#### 表 2.2：自动化对企业级就业和工资影响的近期估计\n\n| 作者\
