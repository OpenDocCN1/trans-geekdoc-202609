  \n## 模型细节\n\n受实证证据启发，我们开发了一个理论框架来理解自动化决策。\n\n### 劳动力与自动化任务的分配\n\n遵循 Acemoglu 和 Restrepo\
  \ (2018) 以及 Koch 和 Restrepo (2021) 的方法，我们首先描述了企业如何如何在劳动力和自动化之间分配任务。对于给定的质量 $\\phi$，使用劳动力完成任务的单位成本为：\n\
  \n$$c_l(v) = w/z_l(v)$$\n\n而使用自动化设备完成任务的单位成本为：\n\n$$c_a(v) = r/z_a(v)$$\n\n其中 $w$\
  \ 和 $r$ 分别代表劳动力和自动化设备的成本冲击。由于并非所有任务都是自动化的，企业会选择成本最低的选择：\n\n$$c(v) = \\min\\left(w/z_l(v),\
  \ r/z_a(v)\\right)$$\n\n对于非自动化企业而言，遵循 Eaton 和 Kortum (2002)，我们假设 $z_l(v)$ 对于每个任务都服从弗雷歇分布：\n\
  \n$$Pr[z_l(v) \\leq z] = F_l(z) = e^{-T_l z^{-\\theta}}$$\n\n其中 $T_l$ 决定了效率的均值，$\\\
  theta$ 控制离散程度。同样，$z_a(v)$ 对于每个任务也服从弗雷歇分布：\n\n$$Pr[z_a(v) \\leq z] = F_a(z) = e^{-T_a\
  \ z^{-\\theta}}$$\n\n其中 $T_a$ 决定了使用自动化设备时的效率均值。因此，$c_l$ 和 $c_a$ 的分布分别为：\n\n$$\\\
  begin{matrix} G_l(c) = 1 - F_l\\left(\\frac{w}{c}\\right) = 1 - e^{-T_l (w/c)^{-\\\
  theta}} \\\\ G_a(c) = 1 - F_a\\left(\\frac{r}{c}\\right) = 1 - e^{-T_a (r/c)^{-\\\
  theta}} \\end{matrix}$$\n\n对于自动化企业，其 $c$ 的分布为：\n\n$$G(c) = 1 - \\prod_{s \\in \\\
  {l,a\\}} [1-G_s(c)] = 1 - e^{-[T_l(w/c)^{-\\theta} + T_a(r/c)^{-\\theta}]c^{\\theta}}$$\n\
  \n企业使用自动化设备执行特定任务 $\\nu$ 的概率如下：\n\n$$\\lambda_a = Pr[c_a(v) \\leq c_1(v)] = \\int_{0}^{\\\
  infty} [1 - G_1(c)] dG_a(c) = \\frac{T_a \\cdot r^{-\\theta}}{T_a \\cdot r^{-\\\
  theta} + T_1 \\cdot w^{-\\theta}}$$\n\n$\\lambda_a$ 也是自动化企业分配给自动化设备的任务比例。因此，自动化设备整体效率\
  \ $T_a$ 的提高会导致自动化任务份额的扩大，从而导致劳动力任务份额的下降。\n\n\n\n\n我们也可以证明，对于自动化者而言，在均衡状态下，自动化设备执行任务的成本分布与劳动力执行任务的成本分布均为\
  \ `G`(`c`)。这种无套利条件是自动化者在跨越不同选项（劳动力和自动化设备）之间为每个任务 `ν` 寻求最低成本时，成本最小化的结果。因此，自动化者的单位成本\
  \ `φ` 为：\n\n$$c(\\varphi,\\mathbf{a}(\\varphi) = 1) = \\frac{E\\left\\lbrack {c{(v)}^{1\
  \ - \\rho} \\mid \\mathbf{a}(\\varphi) = 1} \\right\\rbrack^{\\frac{1}{1 - \\rho}}}{\\\
  varphi} = \\gamma\\_{0} \\cdot \\frac{\\left( {T\\_{a} \\cdot r^{- \\theta} + T\\\
  _{l} \\cdot w^{- \\theta}} \\right)^{- \\frac{1}{\\theta}}}{\\varphi},    \n\n(A.7)\n\
  \n其中 $\\gamma\\_{0} = \\Gamma\\left( {1 - \\frac{\\rho - 1}{\\theta}} \\right)^{\\\
  frac{1}{1 - \\rho}}$ 是一个取决于 $\\frac{\\rho - 1}{\\theta}$ 值的常数。()\n\n$$c(\\varphi,\\\
  mathbf{a}(\\varphi) = 0) = \\frac{E\\left\\lbrack {c{(v)}^{1 - \\rho} \\mid \\mathbf{a}(\\\
  varphi) = 0} \\right\\rbrack^{\\frac{1}{1 - \\rho}}}{\\varphi} = \\gamma\\_{0} \\\
  cdot \\frac{\\left( {T\\_{l} \\cdot w^{- \\theta}} \\right)^{- \\frac{1}{\\theta}}}{\\\
  varphi}.$$  \n\n(A.8)\n\n因此，购买自动化设备允许企业从更广泛的选择集中采购任务，无论是自动化设备还是劳动力，取决于相关成本。企业使用自动化设备完成易自动化的任务，使用劳动力完成较难自动化的任务。结果是自动化降低了企业的有效生产成本。\n\
  \n虽然自动化降低了特定企业的生产成本，但由于相关的购买、安装和维护成本，它也是昂昂的。我们将这些自动化成本建模为固定成本 `f`[a]。自动化相关固定成本的引入遵循\
  \ Koch, Manuylov 和 Smolka (2021) 的假设。更广泛地说，我们对自动化收益和成本的理论处理也类似于 Antras, Fort, 和\
  \ Tintelnot (2017)，他们假设当企业选择在其采购策略中加入额外的供货国时，会产生固定成本。在我们的设定中，采用自动化实际上允许企业将其任务采购范围从仅有的\
  \ `{l}` 扩展到 `{l, a}`，代价是产生额外的固定成本 `f`[a]。\n\n### A.2 昂昂的质量升级\n\n企业 `φ` 还决定其产出的质量，`z`(`φ`,\
  \ **a**(`φ`))。提高产品质量也是有代价的，我们允许两种类型的质量升级成本。首先，生产单位质量为 `z`(`φ`, **a**(`φ`)) 的商品的变动成本为：\n\
  \n`c`(`φ`, **a**(`φ`)) ×`z`(`φ`, ** a**(`φ`)) `α` > 0.  \n\n(A.9)\n\n高质量的输出需要更高的生产边际成本。参数\
  \ `α` 决定了生产边际成本随输出增加的速率。这是产品质量研究中使用的标准假设，例如 Khandelwal (2010)； Kugler 和 Verho (2012)。其次，还有另一个与质量投资相关的固定成本：`z`(`φ`,\
  \ **a**(`φ`)) `ξ` > 1。\n\n(A.10)\n\n假设质量投资的固定成本随质量的增加而增加。我们使用 `ξ` > 1 来捕捉质量的递减收益。关于质量升级固定成本的假设也被\
  \ Fan, Li 和 Yeap (2015) 所使用。正如后文所示，质量固定成本产生了质量相关的规模效应。\n\n### A.3 企业级定价、销售与利润\n\n\
  接下来，我们讨论企业如何对自动化做出决策。企业供应差异化的商品，代表性客户偏好遵循 CES：\n\n$$u = \\left( \\int_{\\omega \\\
  in \\Omega} q(\\omega) z(\\omega)^{\\eta} d\\omega \\right)^{\\frac{1}{\\sigma}}$$\n\
  \n(A.1)\n\n其中 `q`(`ω`) 是数量，`z`(`ω`) 是质量，`σ` 是不同产品之间的替代弹性。客户客户的预算限制为：$\\int_{\\omega\
  \ \\in \\Omega} p(\\omega)q(\\omega)d\\omega \\le X$，其中 `X` 是总支出。每个产品的需求函数为：$q(\\\
  omega) = z(\\omega)^{\\eta} P^{-\\sigma}$。(A.2)\n\n质量调整后的指数 `P` 聚合了所有产品。在价格 `p`(`ω`)\
  \ 条件下，质量 `z`(`ω`) 增加了对特定产品的需求。企业供应一个产品，具有产量 `φ` 的企业的价格为：\n\n$$p(\\varphi,\\mathbf{a}(\\\
  varphi)) = \\frac{\\sigma}{\\sigma - 1} \\cdot c(\\varphi,\\mathbf{a}(\\varphi))$$\n\
  \n(A.3)\n\n因此，产量 `φ` 的企业级销售额 `xx`(`φ`）和利润 `π`(`φ`）为：\n\n$$\\begin{matrix} x(\\varphi,\\\
  mathbf{a}(\\varphi)) = \\left( \\frac{\\sigma}{\\sigma - 1} c(\\varphi,\\mathbf{a}(\\\
  varphi)) \\cdot z(\\varphi,\\mathbf{a}(\\varphi))^{\\alpha} \\right)^{1 - \\sigma}P^{\\\
  sigma - 1} \\\\ \\pi(\\varphi,\\mathbf{a}(\\varphi)) = \\frac{x(\\varphi,\\mathbf{a}(\\\
  varphi))}{\\sigma} - z(\\varphi,\\mathbf{a}(\\varphi))^{\\xi} \\end{matrix}$$\n\n\
  (A.4)\n\n接下来，在给定生产率 `φ` 和自动化决策 **a**(`φ`）的情况下，我们求解最优质量水平 `z`(`φ`)。最大化问题为：\n\n$$\\\
  underset{{z(\\varphi,\\mathbf{a}(\\varphi))}}{\\text{max}} \\frac{1}{\\sigma}\\\
  left( \\frac{\\sigma}{\\sigma - 1} c(\\varphi,\\mathbf{a}(\\varphi)) \\cdot z(\\\
  varphi,\\mathbf{a}(\\varphi))^{\\alpha} \\right)^{1 - \\sigma}P^{\\sigma - 1}X -\
  \ z(\\varphi,\\mathbf{a}(\\varphi))^{\\xi}.$$\n\n因此最优质量选择为：\n\n$$z(\\varphi,\\mathbf{a}(\\\
  varphi)) = \\gamma\\_{1}\\left\\lbrack \\frac{P^{\\sigma - 1}X}{c(\\varphi,\\mathbf{a}(\\\
  varphi))}^{\\sigma - 1}} \\right\\rbrack^{\\frac{1}{\\zeta - (\\eta - \\alpha)(\\\
  sigma - 1)}},$$\n\n(A.5)\n\n其中 $\\gamma\\_{1} = \\left\\lbrack \\frac{\\eta - \\\
  alpha}{\\xi}\\left\\lbrack \\frac{\\sigma - 1}{\\sigma} \\right\\rbrack^{\\sigma}\
  \ \\right\\rbrack^{\\frac{1}{\\zeta - (\\eta - \\alpha)(\\sigma - 1)}}$。我们可以进一步计算给定自动化决策\
  \ **a**(`φ`）的价格 `φ`：\n\n$$p(\\varphi,\\mathbf{a}(\\varphi)) = \\gamma\\_{1}^{\\\
  alpha} \\cdot \\frac{\\sigma}{\\sigma - 1} \\cdot c(\\varphi,\\mathbf{a}(\\varphi))^{\\\
  frac{\\zeta\\overline{\\zeta} - \\eta(\\sigma - 1)}{\\zeta - (\\eta - \\alpha)(\\\
  sigma - 1)}} \\cdot \\left( P^{\\sigma - 1}X \\right)^{\\frac{\\alpha}{\\zeta -\
  \ (\\eta - \\alpha)(\\sigma - 1)}}.$$\n\n(A.6)\n\n企业 `φ` 在给定自动化决策 **a**(`φ`）情况下的销量和利润为：\n\
  \n$$x(\\varphi,\\mathbf{a}(\\varphi)) = \\left\\lbrack \\frac{\\zeta^{\\xi}}{(\\\
  eta - \\alpha)(\\sigma - 1)} - 1 \\right\\rbrack z(\\varphi,\\mathbf{a}(\\varphi))^{\\\
  xi}.$$\n\n(A.7)\n\n\n\n\n\n$\\pi*(\\phi*[*a*]^(\\*),a*(\\phi*[*a*]^(\\*))=0) = \\\
  pi*(\\phi*[*a*]^(\\*),a*(\\phi*[*a*]^(\\*))=1) - f[*a*].$\n\n因此，我们可以解出 $\\phi*[*a*]^(\\\
  *)$：\n\n$$\\varphi_{a}^{\\*} = \\frac{\\gamma\\_{2} \\cdot f\\_{a}^{\\frac{\\xi\
  \ - (\\eta - a)(\\sigma - 1)}{(\\sigma - 1)\\xi}}}{\\}}}{\\( { { \\cdot X^{\\fracfrac}{\\\
  }{\\sigma -  }}}}}}rightright)\\left\\lbrack {\\\\left( {T\\_{a} \\cdot r^{- \\\\\
  theta} + T\\_{l} \\cdot w^{- \\\\theta}} \\right)^{\\frac{(\\sigma - 1)\\xi}{\\\
  theta\\lbrack\\\\xi - (\\eta - \\alpha)(\\sigma - 1)\\rbrack}} - \\\\left( {T\\\
  _{l} \\cdot w^{- \\\\theta}} \\right)^{\\frac{(\\sigma - 1)\\xi}{\\theta{\\lbrack{\\\
  xi - (\\\\eta - \\alpha)(\\sigma - 1)}}\\rbrack}}}} \\right\\rbrack\\frac{\\xi -\
  \ \\left( {n - a} \\right)\\left( {\\\\sigma - 1} \\right)}{\\left( {\\\\sigma -\
  \ 1} \\right)\\xi}}.$$\n\n(A.17)\n\n其中 $\\gamma\\_{2} = \\gamma\\_{0}\\gamma\\_{1}^{\\\
  frac{(\\eta - \\alpha)(\\sigma - 1) - \\xi}{\\sigma - 1}}\\left\\lbrack {\\\\frac{\\\
  xi}{(\\eta - \\alpha)(\\sigma - 1)} - 1} \\right\\rbrack^{\\frac{(\\eta - \\alpha)(\\\
  sigma - 1) - \\xi}{(\\sigma - 1)\\xi}}$是一个常数项。(A.17) 右侧的分子代表了给定企业 `φ` 购买自动化设备的增量成本，而分母乘以\
  \ `φ` 的结果是该企业购买自动化设备的增量利润。因此，只有当 `φ` > `φ*[*a*]^(\\*)` 时，其增量利润才会高于自动化成本，从而会选择 `a(φ)`\
  \ = 1。自动化决策规则在命题 1 中描述。\n\n**命题 1.** `φ` > `φ*[*a*]^(\\*)` 的企业购买自动化设备。`φ` < `φ*[*a*]^(\\\
  *)` 的企业不购买自动化设备。项 `φ*[*a*]^(\\*)` 由 (A.17) 定义。\n\n### 自动化选择与筛选\n\n只要自动化特征具有规模效应，就会出现自动化的选择或分层。只有生产率足够高的企业才会认为购买自动化设备是合理的，因为它们可以利用生产成本降低的优势，将固定成本\
  \ `f[a]` 分摊到更大的产出量上。同时，自动化的企业还表现出更高的产品质量、更大的销售额和更高的利润。这些“自动化溢价”反映了两个因素：第一，如命题 1\
  \ 所示，自动化企业的生产率高于非自动化企业；其次，自动化导致了更低的生产成本 `c(φ, a(φ))`。\n\n直观，较高的固定成本 `f[a]` 会提高临界点\
  \ `φ[*a*]^(\\*)`。较大的市场规模 `X` 增加了总需求，从而降低了自动化的门槛。最后，更好的自动化技术（`T[a]` 或更低的 `r`）会导致自动化的边际收益增加，从而增加自动化的程度。\n\
  \n### 命题 2：结果\n\n命题 2 描述了自动化企业与非自动化企业在各种企业级结果上的差异。\n\n**命题 2.** 比较一个自动化企业 `a(φ)`\
  \ = 1 和一个非自动化企业 `a(φ)` = 0，两者面临相同的 `P` 和 `X`。生产成本、质量和销售额的差异（注意，根据命题 1，`φ ≥ φ′`）：\n\
  \n$$\\begin{array}{l} \\frac{c(\\varphi,\\mathbf{a}(\\varphi) = 1)}{c\\left( {\\\
  \\varphi^{\\prime},\\\\mathbf{a}\\\\left( \\\\varphi^{\\prime} \\\\right) = 0} \\\
  \\right)} = \\\\frac{\\\\varphi^{\\prime}}{\\\\varphi} \\left( {T\\_{a} \\cdot r^{-\
  \ \\\\theta} + T\\_{l} \\cdot w^{- \\\\theta}} \\right)^{\\frac{(\\sigma - 1)\\\
  xi}{\\theta\\lbrack\\\\xi - (\\eta - \\alpha)(\\sigma - 1)\\rbrack}} - \\\\left(\
  \ {T\\_{l} \\cdot w^{- \\\\theta}} \\right)^{\\frac{(\\sigma - 1)\\xi}{\\theta{\\\
  lbrack{\\xi - (\\\\eta - \\alpha)(\\sigma - 1)}}\\rbrack}}}} < 1 \\\\ \\frac{q(\\\
  varphi,\\mathbf{a}(\\varphi) = 1)}{q\\left( {\\\\varphi^{\\prime},\\\\mathbf{a}\\\
  \\left( \\\\varphi^{\\prime} \\\\right) = 0} \\\\right)} > 1 \\\\ \\frac{s(\\varphi,\\\
  mathbf{a}(\\varphi) = 1)}{s\\left( {\\\\varphi^{\\prime},\\\\mathbf{a}\\\\left(\
  \ \\\\varphi^{\\prime} \\\\right) = 0} \\\\right)} > 1 \\\\end{array}$$\n\n(A.18)\n\
  \n总劳动报酬的差异为：\n\n$$\\frac{W(\\varphi,\\mathbf{a}(\\varphi) = 1)}{W\\left( {\\\\varphi^{\\\
  prime},\\\\mathbf{a}\\\\left( \\\\varphi^{\\prime} \\\\right) = 0} \\\\right)} =\
  \ \\\\frac{x(\\varphi,\\mathbf{a}(\\varphi) = 1)}{x\\left( {\\\\varphi^{\\prime},\\\
  \\mathbf{a}\\\\left( \\\\varphi^{\\prime} \\\\right) = 0} \\\\right)} \\\\cdot \\\
  \\left( {1 - \\\\lambda_{a}} \\\\right) = \\\\left( \\\\frac{\\\\varphi^{\\prime}}{\\\
  \\varphi} \\right)^{\\frac{\\\\xi(1 - \\\\sigma)}{\\\\zeta - (\\\\eta - \\\\alpha)(\\\
  sigma - 1)}}\\left( {1 - \\\\lambda_{a}} \\\\right)^{\\frac{1 - \\\\sigma}{\\\\\
  theta}\\\\frac{\\\\xi}{\\\\zeta - (\\\\eta - \\\\alpha)(\\sigma - 1)}} + 1}.$$\n\
  \n(A.19)\n\n回顾 $\\lambda_a = \\frac{T_{a} \\cdot r^{- \\theta}}{T_{a} \\cdot r^{-\
  \ \\theta} + T_{l} \\cdot w^{- \\theta}}$ 是自动化企业中自动化设备执行的任务比例。\n\n\n\n\n早期对人工智能的炒作已让位于更为冷静的分析，分析表明到目前为止，AI\
  \ 对任务（Brynjolfsson, Mitchell, and Rock, 2018）、就业和工资（Acemoglu, Autor, Hazell, and\
  \ Restrepo, 2020）的影响有限。关于 AI 对国际贸易的影响，无论从理论上还是实证上，为人都较少。在本章中，我们探讨了其对（*a*) 双边贸易流、(*b*)\
  \ 进口商品多样性以及 (*c*) 品种的创造与消灭的影响。AI 对贸易流的影响备受关注，但我们最终关注的是福利。因此，我们还计算了由于 AI 引起消费者产品种类可用性变化而导致的福利效应。\n\
  \n有充分理由预期上述三种影响。（*a*)）对于双边贸易流，麦肯锡全球研究所（2019）预测 AI 将减少外包业务流程和 IT 服务。它还将通过促进增材制造（将生产转移至消费点）来减少商品贸易。麦肯锡预测，这些发展共同将使贸易减少一万亿美元。当然，贸易额的减少并不能告诉我们\
  \ AI 对福利的影响。事实上，在麦肯锡的场景中，贸易量和福利可能向相反的方向移动。（*b*)）对于产品多样性，AI 既带来了新服务（水平分化），也改进了现有服务（垂直分化）。这些这些会影响贸易格局和贸易福利收益，通常是以积极的方式。关于水平分化的分析，请参见\
  \ Krugman (1979)、Helpman (1981)、Feenstra (1994, 2010)、Melitz (2003)、Broda and Weinstein\
  \ (2006) 以及 Hsieh, Li, Ossa, and Yang (2020）。(*c*)）对于创造性破坏，AI 对垂直分化的影响破坏并取代了现有服务。关于通过内生性创新进行创造性破坏的过程，请参见\
  \ Aghion and Howitt (1992) 和 Akcigit and Kerr (2018) 的封闭经济模型，以及 Grossman and Helpman\
  \ (1991*a,b*) 的封闭和开放经济体模型。\n\n尽管公众对 AI 有浓厚兴趣，但关于 AI 对贸易、产品多样性和创造性破坏影响的研究几乎不存在。Goldfarb\
  \ and Trefler (2019a) 回顾了 AI 提出的国际贸易理论问题。他们认为 AI 的关键特征是规模、局部知识扩散以及国际知识扩散的程度。规模和局部知识扩散/外部性对贸易流的影响在经济学界长期以来已理解。\n\
  \n## 数据与方法论\n\n\n\n\n我们的主要结果源于各种结果变量对 AI 部署指标的回归分析。显而易见的问题是 AI 部署的内生性。因此，我们需要一个能够捕捉部署成本外生冲击的工具变量。赫克歇-奥林理论（Heckscher-Ohlin\
  \ theory）提供了这样一个工具。一个拥有深厚 AI 专业知识的国家能够廉价且方便地获得部署 AI 所需的投入，这又提供了成本优势，这种优势在密集使用这些投入的\
  \ App 类别中尤为明显。因此，我们通过（1）以 AI 研究产衡量的国家`AI expertise`（专业知识）与（2）App 类别的`AI intensity`（强度）的交互对\
  \ App 部署进行工具变量处理。这作为 AI 部署成本的外生移动因素.^()\n\n我们有三个主要的工具变量（IV）发现。所有发现都利用了 App 类别内部的差异。\n\
  \n1. `双边贸易`：我们估计了一个 App 下载量的引力模型，其维度包括进口国-出口国对、App 类别和年份。使用 `IV`，我们发现 AI 部署导致 App\
  \ 下载量增加了六倍。除了 Brynjolfsson 等人对 eBay 使用机器翻译的研究外，这是关于 AI 对贸易影响的首个且最系统的证据。\n\n2. `多样性`：AI\
  \ 部署使双边贸易的 App/品种数量增加了一倍。\n\n3. `创造性破坏与福利`：\n    1. `进入与退出`：AI 部署导致了进口国可用 App/品种出现高水平的进入和退出。也就是说，它导致了创造性破坏。\n\
  \    2. `福利`：我们使用 Feenstra (1994, 2010) 的技术计算了进入和退出的福利影响。我们发现，在 2020 年，来自 App 的福利比没有\
  \ AI 部署的反事实情况高出 2.5%。这两个数字都是巨大的数字，且其范围取决于 App 之间的替代弹性是高（5）还是低（2）。一个重要的注说明是，在 Feenstra\
  \ 公式中，我们使用的是下载份额而非支出份额。\n\n这三项结果证明，移动 App 领域的 AI 部署已经对贸易、产品多样性、创造性破坏和福利产生了切实的影响。\n\
  \n人们可能会想，我们的结论是否是 AI 专利申请与其他不可观测变量之间虚假相关的结果。为了检验这一点，我们考虑了非 AI 专利，发现其影响有限，且将其纳入分析并不会影响我们的结果。\n\
  \n第 1 节提供了移动 App 和 AI 的背景。第 2 节描述了数据库。第 3 节使用双边引力方程估计 AI 部署对贸易的影响。第 4 节估计 AI 部署对广泛边缘的影响，即对\
  \ App/品种数量的影响。第 5 节考察 AI 部署对进入、退出、创造性破坏和福利的影响。\n\n## 1 App 与 AI 简述\n\n随着无线互联网技术和个人便携设备成本下降、普及率提高，移动应用程序已成为日常生活的常态。2020\
  \ 年，全球移动互联网用户达到 43 亿，占所有互联网用户的 92%.^() 最大的两个应用市场——`App Store`（针对 iOS）和 `Google Play`（针对\
  \ Android）于 2008 年随着第一代智能手机（iPhone G1）的发布推出。当时，这两个应用市场大约有 500 个 App。今天`App Store`\
  \ 拥有 18 亿 App，`Google Play` 拥有 28 亿 App。\n\n从 App 转向 AI，Agrawal, Gans 和 Goldfarb\
  \ (2018) 将 AI 定义为一组互补技术，涉及算法、数据和计算能力，允许程序通过经验自动提高其性能。作者将 AI 的商业化引入追溯到 2012 年。从那时起，推动\
  \ AI 前沿发展的公司已成为全球最大的公司之一。表 10.1 列出了世界上按市值排名的八大公司。第 2 列是 2020 年的市场市值（百万美元）。这些公司中的每一家都使用\
