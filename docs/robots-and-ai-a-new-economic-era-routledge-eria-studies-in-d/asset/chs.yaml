  \ 2020 年世界机器人报告。\n*   Jorgenson, D.W., 2017. 世界 KLEMS：世界经济中的生产率与经济增长：引言。《国际生产力监测》\
  \ 33, 1–7。\n*   Koch, M., Manuylov, I., Smolka, M., 2019. 机器人与企业（SSRN 学术论文编号为 337705）。社会科学网络，罗彻斯特。\n\
