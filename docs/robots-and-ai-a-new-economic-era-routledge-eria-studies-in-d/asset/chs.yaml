  \n### 3.4 自动化、外包与选择性\n\n为了评估选择性是否在解释图 4.1 所示的受自动化和外包影响较大的职业中工作小时相对减少方面起到任何作用，我们估计了以下方程：\n\
  \n$$\\\\begin{array}{r} {\\\\Delta Y\\_{oki} = \\\\beta\\_{1}RTI\\\\_{o} + \\\\\
  beta\\_{2}Offshor\\\\_{o} + \\\\beta\\_{3}RTI\\\\_{o} \\\\times Offshor\\\\_{o}\
  \ + Z\\\\_{oki}^{’}\\\\mathbf{C} + \\\\mu\\\\_{oi} + \\\\epsilon\\\\_{oki}.} \\\\\
  \\\\ \\\\end{array}$$  \n\n(2)\n\n在左侧，因变量`ΔY`[`[oki]`对应于我们三个衡量指标捕捉的选择性的长期变化。对于 SSO（部门间选择性）和失业时长，`ΔY`[`[oki]`是\
  \ 1995 年与 2010 年之间的差异；而对于教育不足或教育过度，`ΔY`[`[oki]`是 1998 年与 2010 年之间的差异。如前所述，这是由于 1998\
  \ 年之前的教育数据可用性有限。由于 SSO 衡量的是职业`o`跨部门`k`的集中程度，样本是在职业×国家层面进行聚合的。在方程(2)的右侧，解释变量`RTI`[`[o]`和`Offshor`[`[o]`分别是可自动化性和外包性的指数，而`Z`[`[oi]`是一组控制变量，包括选择性的初始值和单元就业份额的初始值。我们还包含了职业×国家的固定效应`μ`[`[oi]`，除非因变量是\
  \ SSO，在这种情况下我们包含国家固定效应`μ`[`[i]`。由于可自动化性和外包性的指数被标准化为均值为 0、标准差为 1，`β`[`[1]`可以解释为当外包性等于其平均值时可自动化性的影响。同样，`β`[`[2]`可以解释为当自动化性等于其平均值时外包性的影响。此外，当外包性比平均值大一个标准差时，自动化性的影响由`β`[`[1]+β`[`[3]`给出。这也是自动化性比平均值大一个标准差时外包性的影响。除非另有说明，我们在另一变量处于平均值水平时讨论某一变量的影响。\n\
  \n相应的估计结果报告在表 4.2 中。在该表中，第 1 列报告了 SSO 的结果。它显示，初始自动化程度较高的职业，在外包性处于平均水平时，在该期间变得更具选择性。然而，该系数的估计并不精确，其\
  \ p 值略高于传统的统计显著性水平。相比之下，当自动化性处于平均水平时，外包的影响被估计得非常精确且为负。因此，自动化和外包对跨部门职业集中程度具有相反的影响。尽管集中程度增加的趋势可能由其他因素驱动，但这种模式与受自动化影响较大的职业选择性增加、以及受外包影响较大的职业选择性减少相吻合。此外，由于`RTI`[`[o]`和`Offshor`[`[o]`之间的交互项为正且显著，受自动化影响较大的职业的集中程度增加在那些同样受外包影响的职业中更为明显。例如，当外包性比平均值大一个标准差时，自动化对\
  \ SSO 的影响几乎是两倍，且与 0 有显著差异（`β`[`[1]+β`[`[3]=0.16，p 值为 0.016）。第 2 列报告了失业时长的结果。我们观察到，受自动化影响较大的大的职业在外包性处于平均水平时，失业时长的增加更大。这种效应在具有较高外包性的职业中得到进一步加强。相反，外包性对失业时长的影响是负的，且估计不精确。随着`RTI`的减少（即自动化性的降低），这种影响变得更加负向。最后，第\
  \ 3 和第 4 列报告了教育错配的结果，关注了教育不足和教育过度的工人比例。第 4 列显示，教育不足在更自动化的职业中减少，在更容易外包的职业中增加。自动化与外包之间的交互为负，与第\
