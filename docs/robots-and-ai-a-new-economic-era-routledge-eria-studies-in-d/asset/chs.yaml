  Omega)]^{*2}}$$\n$$\n\n失业时长计算为失业工人遇到空缺的速率 `q[u]` 的倒数。错配通过接受区间长度 `d*`（一半）衡量。图 4.2、4.3\
  \ 和 4.4 显示，无论我们用就业集中度、失业时长还是错配来衡量选择，对于选定的参数值，选择都是自动化的增函数和外包的减函数。它们证实我们的模型能够定性地再现数据中的模式![图\
