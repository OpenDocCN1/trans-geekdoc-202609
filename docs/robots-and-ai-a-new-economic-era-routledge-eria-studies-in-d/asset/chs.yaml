  \n尽管全球机器人使用量在稳步增长，但中国工业机器人的采用速度极快——特别是在过去几年中（参见图 8.5）。这为前述的机制增加了一个额外的维度。并不是技术进步导致机器人价格外生性下降从而促使高工资国家实现自动化的，中国的机器人化得到了巨额补贴和大量政府计划的支持。面对人口快速老龄化的挑战，各级政府都促进了机器人化（Cheng\
  \ et al., 2019）。工业和信息化部（MIIT）于 2013 年发布了《关于促进机器人产业发展的指导意见》，目标是工厂机器人密度达到每 1000 名\
  \ 10 台。随后，2015 年的“中国制造 2025”计划将这一数字提高到 15 台；工信部、国家发展改革委员会和财政部于 2016 年发布的《机器人产业发展规划》进一步鼓励在包括服务在内的更广泛领域使用机器人。在区域层面，促进自动化的倡议示例包括广东省政府设立的\
  \ 1500 亿美元基金用于投资自动化技术（Yang, 2017）。\n\n![图 8.5 中国机器人存量增长迅速 ¶ 注：此图显示了领先国家随时间变化的机器人运行存量。中国的机器人存量扩张迅速，目前已成为所有国家中最大的。](img/fig051.jpg)\n\
  \n图 8.5 中国机器人存量增长迅速 ¶ 注：此图显示了领先国家随时间变化的机器人运行存量。中国的机器人存量扩张迅速，目前已成为所有国家中最大的。然而，，中国每个制造业工人的机器人存量仍低于\
  \ OECD 国家。来源：国际机器人学会。\n\n为了研究中国自动化补贴的影响，我们使用了 `Artuc, Bastos and Rijkers (2018)`\
  \ 的框架。\n\n![图 A：机器人化行业的劳动力使用](img/fig052.jpg)\n![图 B：工资](img/fig053.jpg)\n![图 C：与高收入国家的贸易](img/fig054.jpg)\n\
  ![图 D：与发展中国家的贸易](img/fig055.jpg)\n![图 E：来自南方的机器人行业进口零部件](img/fig056.jpg)\n![图 F：来自南方的机器人行业进口成品](img/fig057.jpg)\n\
  \n图 8.6 中国机器人补贴的模拟效应 ¶ 注：此图展示了中国机器人补贴对机器人化行业劳动力使用、工资和贸易影响的模拟结果。模型中的其他部分与之前相同，现在增加了一个拟合中国的国家，该国补贴机器人使得其机器人价格为\
  \ `(1-s**u**b**s**i**d**y*)×*p**r**i**c**e*`。\n\n在定量模型中，中国的机器人补贴现在使他们更接近发达国家的比较优势特征，远离发展中国家的特征。具体而言，我们发现机器人化随补贴增加而显著增加，因此随着补贴上升，中国机器人化行业的劳动力使用最初会下降（图\
  \ 8.6 的第一部分，图 A）。\n\n转向贸易流，中国机器人化行业的出口随补贴增加而明确增加，而中国在这些领域的进口则明确减少。随着中国的机器人补贴使其更接近高收入国家的相对生产率特征（并远离低收入国家），经典的比较优势抑制了与高收入国家的贸易，并鼓励了与低收入国家的贸易。我们从图\
  \ C 看到，在较低补贴水平下，中国与北方贸易可能会增加，但随着补贴的持续和中国专业化模式与 OECD 国家日益相似，未来贸易可能会下降。相比之下，中国与南方的贸易明确增加（图\
  \ D），因为补贴使得中国与其他发展中国家变得不同。\n\n\n\n再次，这些聚合效应源于几种相互作用的机制。例如，考虑中国对南方机器人部门生产商品的总进口量（面板\
  \ `E` 和 `F`）。中国的补贴增加了中国在该部门的生产率和产出，这通过规模效应的两个组成部分（即一般消费加上对中间品的需求增加）增加了从南方的进口。然而，补贴也进一步削弱了南方生产者在机器人部门的相对竞争力，从而减少了中国从南方的进口（即替代效应）。对于巨额补贴（约大于\
  \ 60%），替代效应日益超过规模效应，导致中国从南方进口的机器人部门商品总进口量下降。再次，这种现象在最终品中最为明显——因为零部件受益于规模效应的两个要素，所以其抵消作用的规模效应在零部件部门上更大。\n\
  \n有趣的是，其他国家的工资和劳动力分配几乎不受中国补贴的影响。补贴同时增加了对发展中国家的总进口和向出口，这抵消了对工资的影响。对自动化部门劳动力使用的影响是明显的，但很较小，因为发展中国家的劳动力市场仅通过国际贸易间接暴露于中国的机器人化。因此，中国的补贴导致发展中国家劳动力从自动化行业向非自动化行业发生了适度的转移，对工资的影响微乎其微。\n\
  \n考虑到中国持续的人口老龄化将加强这些结果。正如 Acemoglu 和 Restrepo (2021) 所记录的那样，中年工人在手力生产任务中比年长工人具有比较优势，因此减少其人口比例的人口结构变化增加了制造业的劳动力成本。因此，持续的老龄化将进一步增加机器人的相对吸引力，这平行并强化了我们发现的机器人补贴的影响。\n\
  \n## 4. 更广泛的证据：全球价值链、摩擦与去工业化\n\n我们的发现与近期其他研究的实证结果相吻合。西班牙公司的机器人化增加了它们对发展中国家投入品的需求，并导致它们增加了在发展中国家的分分支机构数量（Stapleton\
  \ and Webb, 2020）。\n\n然而，我们的李嘉德模型关注重点是长期和聚合效应。在短期内，工人无法在部门之间或次国家地区之间自由移动。特定行业的技能、摩擦和沉没投资可能导致转型性失业和不平等的加剧；处于与机器人竞争部门的部门和地区的工人可能因北方的机器人化而遭受损失。近期研究发现了此类效应的证据。为了衡量美国机器人对哥伦比亚就业的影响，Kugler\
  \ 等人 (2020) 使用了社会安全记录中的雇主-员工匹配数据。他们通过将哥伦比亚当地劳动力市场-行业就业份额与美国行业-时间机器人采纳情况相结合，衡量了对美国机器人化的暴露程度，并发现这种暴露减少了哥伦比亚的就业和收入。他们的估计表明，在\
  \ 2011 年至 2016 年间，美国采用 70,000 台新机器人导致了 63,000 到 100,000 个哥伦比亚工作位的累计损失。负面影响对女性、老年和中年工人以及在中小企业工作的人士最大——这些群体在不同地点或行业之间寻找新就业的流动性可能最低。\n\
  \n同样，Faber (2020) 考察了 1990 年至 2015 年间美国机器人化对墨西哥当地劳动力市场就业的影响。他将墨西哥最初的劳动力市场-行业就业份额与离外可行性指标以及美国机器人强度的变化相结合，再次发现对墨西哥就业产生了显著的负面影响。尽管墨西哥在此期间也实现了工业生产的自动化，且粗线条的行业级机器人数据难以区分美国机器人化和国内机器人化的影响，但他发现机器人化的负担最重地落在制造业中受教育程度的机械操作员身上——这又是一个可能在地点和职业上流动性较低的群体。同样关注墨西哥，但针对\
  \ 2004-2014 年期间的研究，Artuc、Christiaensen 和 Winkler (2019) 发现美国机器人化对墨西哥地区的影响较小。他们发现美国机器人化对墨西哥出口和当地劳动力市场的影响虽如\
  \ Dix-Carneiro 等人 (2019) 所述，非正式部门有所扩大作为“就业缓冲”，但自动化仍然冲击了非技能工人。工资不平等因此加剧。综合这些证据表明，虽然机器人化长期可能促进贸易并增加发展国家的实际工资，但在短期内，政府需要关注那些最脆弱的和地区。\n\
  \n此外，长期风险是不容忽视的。此前描述的模型关注贸易的静态收益。随着时间的推移，发达国家的机器人化可能会使发展中经济体远离具有较高“边中学做”或技术转移潜力的部门。这可能会加剧培养婴儿工业的现有困难，并加剧“过早去工业化”（Rodrik,\
  \ 2016）。这种动态可能解释为什么某些国家（如中国）选择补贴机器人。\n\n## 5. 发展中国家的机器人采用：超越相对价格\n\n此前描述的李嘉德模型抽象了企业级异质性，以强调国家和行业级效应。在现实中，除了机器人价格和工资外的许多因素都会影响采纳机器人的动力。首先，我们可以将机器人化概念化为一次性的每期的固定成本，从而降低边际生产成本。在这种情况下，我们可能预期只有更大、生产率更高、面向出口的企业会进行此类投资，遵循\
  \ Melitz (2003) 和 Bustos (2011) 的观点。或者，机器人化可以被概念化为产品质量的提升——例如允许更高的精确可靠性，正如 Verhoogen\
  \ (2008) 和 Rodrik (2018) 所讨论的。这些属性可能被深度整合到复杂生产网络中的公司重视，这些网络涉及许多相互依赖组件的协调和组装（Kremer,\
  \ 1993; Verhoogen, 2008; Demir et al., 2021）。如果一个缺陷零件抵消了复杂最终产品中的所有其他投入，生产缺陷产品的成本就会迅速增加。根据这一推理，我们可能预计深度整合到全球价值链中的企业会有更多自动化，因为那里的错误成本（或对质量的回报）最高。尽管存在廉价劳动力，这些机制将驱动发展中国家内部的一些机器人采用。高层跨国相关性确实指向\
  \ GVC 参与与机器人采用之间存在正相关关系（见图 8.7](#Ch08.xhtml#fig8_7_8)）。\n\n图 8.7 机器人使用与全球价值链参与 ¶\
