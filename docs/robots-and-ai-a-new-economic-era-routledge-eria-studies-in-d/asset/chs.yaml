  \n在记录了机器人暴露对劳动力市场结果的平均影响后，我们转向分析的核心部分。我们的兴趣在于理解自动化如何与外包相互作用，以及这种相互作用对美国劳动力市场可能产生什么影响。在本节中，我们利用数据中的不同变化来源分析机器人暴露与外包之间的关系。在下一节中，我们将转向研究对美国就业的影响。\n\
  \n\n\n作为一个起点，我们研究了机器人可以执行的任务性质。具体而言，我们衡量机器人是否适用于具有高度外包性的任务，还是适用于较难外包的任务。为此，我们利用了第\
  \ 3 节中引入的职业层面的外包性和可替代性指标。我们对 331 个美国`US Census`调查职业，将 `Autor and Dorn (2013)` 的外包性指数对\
  \ `Graetz and Michaels (2018)` 的可替代虚拟变量进行回归。结果见表 3.4 第(1)列。可替代虚拟变量的系数为正且在统计上显著，意味着平均而言，可替代职业更容易外包。由于外包性指数经过标准化（均值为\
  \ 0，标准差为 1），该系数意味着可替代职业与不可替代职业的平均外包性之间存在 28%的标准差差异。\n\n表 3.4 机器人暴露与职业、行业和通勤区的外包情况\n\
