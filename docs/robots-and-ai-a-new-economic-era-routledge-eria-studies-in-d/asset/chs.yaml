  \ `Ω` 的范围，对应 `A = 0.05`（虚线）和 `A = 0.2`（实线）。模拟基于方程组 (10)–(11)，工资按照 (12) 的方法计算，参数如表\
  \ 4.C1 所示。\n\n综而言之，对于从文献中提取的标准参数值，如果企业与工人之间较好的匹配在利用自动化方面具有比较优势，我们的模型就能重现自动化和外包对我们三个选择性衡量标准的观测到的效应。该模型暗示，自动化通过增加工人和企业的选择性来减少就业。如果企业与工人之间较差的匹配在利用外包方面具有比较优势，它也预言外包会通过降低工人和企业的选择性来提高就业。最后，如果具有较高自动化程度的匹配在利用外包方面具有比较优势，模型预测外包性会强化自动化的影响。这些预测与第\
  \ 2 节讨论的自动化悖论以及我们所说的“核心偏向的技术变化”是一的。\n\n## 5 结论\n\n自动化和外包可能通过两种主要方式影响国家工人的就业机会和工资。当某些任务被自动化或外包时，这些任务不再由该国的工人执行，其对其服务的需求随之下降。这就是负面的“替代效应”，会导致就业机会和工资的减少。尽管如此，将任务从该国工人重新分配给自动化系统或外国工人也可能提高生产效率，从而允许生产活动扩张，对就业机会和工资产生积极影响。这就是正面的“生产力效应”，它可能导致就业和工资的上升。\n\
  \n关于替代效应，现有研究主要关注自动化对资本-劳动替代的影响，这对于生产中机器人和机器的采用尤为相关。他们强调，不同工人受影响程度不同，取决于其教育程度（“技能偏向的技术变化”）或其任务的常规程度（“常规化偏向的技术变化”）。\n\
  \n在本章中，我们调查了自动化对工人就业机会和工资可能存在的另一种额外负面影响。随着自动化的加强，专业知识（“核心竞争力”）变得日益重要，其了了任务教育内容或其常规程度的需求。因此，工人和企业在匹配其专业技能和任务时变得更具选择性。我们将自动化的这一方面称为“核心偏向的技术变化”（CBTC），并认为类似的情况可能对外包也适用：一个国家的全球价值链越复杂，该国工人专业知识的贡献可能越至关重要。\n\
  \n我们在欧洲行业的职业数据中寻找了与 CBTC 一致的证据。我们发现自动化减少了就业机会。对我们的分析而言更有趣的是，自动化还增加了工人和企业的选择性，这体现在失业持续时间的延长、技能-任务错配的减少以及专业知识在特定任务中集中程度的提高。然而，这种情况在外包的情况下并未发生，尽管外包强化了自动化的效应。\n\
  \n我们证明，一个具有双边异质性和搜索摩擦的动力市场模型可以解释我们的实证发现，只要愿意假设：企业与工人之间较好的匹配在利用自动化方面具有比较优势，企业与工人之间较差的匹配在利用外包方面具有比较优势，且具有较高自动化程度的匹配在利用外包方面具有比较优势。\n\
