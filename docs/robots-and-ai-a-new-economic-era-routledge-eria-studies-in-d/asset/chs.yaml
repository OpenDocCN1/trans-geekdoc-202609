  \n## 3.2 企业层面的变化\n\n在考察了企业（及产品）之间自动化与企业层面结果的截面相关性后，我们转向分析各种企业层面结果的变化是否与自动化状态相关。我们使用了类似于\
  \ Acemoglu, Lelarge and Restrepo (2020) 中使用的长差分设定如下：\n\n```\nΔy[f, 2012−2008] =\
  \ β(Δa[f, 2012−2008]) + X[f, 2008] + δ[i] + δ[r] + ε[f]\n```\n\n其中 `Δy[f, 2012–2008]`\
  \ 是企业 `f` 在 2008–2012 样本期间结果 `y` 的长差分。指示变量 `Δa[f, 2012−2008]` 如果企业 `f` 在 2008–2012\
  \ 期间进口过任何自动化设备，则值为 1；否则为 0。滞后变量集 `X[f, 2008]` 控制了企业的初始状况，包括生产率对数、就业对数、资本劳动力比对数、产出与工人补偿之间的比例对数、出口份额和进口份额。ISIC\
  \ 2 位固定效应 `δ[i]` 考虑了该期间特定行业的趋势。地区固定效应 `δ[r]` 对于位于爪哇答的企业和未位于爪哇答的企业不同。最后，误差项 `ε[f]`\
  \ 包含了其他未观测因素。在这一设定中，我们利用企业层面结果的变化如何随企业自动化状态而变化。\n\n我们的长差分设定控制了影响 `Δy[f, 2012–2008]`\
  \ 和 `Δa[f, 2012–2008]` 的未观测时间不变特征。滞后变量 `X[f, 2008]` 也控制了一些可能与这些变量相关的企业特定变化。然而，我们仍可能面临遗漏变量偏差，因为\
  \ `ε[f]` 中未观测的随时间特征可能同时驱动 `Δy[f, 2012–2008]` 和 `Δa[f, 2012–2008]`。例如，假设一家企业的财务状况变得更健康。在这种情况下，该企业可能更有可能进口自动化设备作为扩大生产投资。这将导致自动化决策与总产出之间存在正相关。因此，我们将长差分设定中的实证结果解释为自动化决策与企业层面结果变化之间的关联，而不是自动化对企业层面结果的因果影响。\n\
