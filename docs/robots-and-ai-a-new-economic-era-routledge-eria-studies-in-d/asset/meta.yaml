- - '##'
  - 本书
- - '#'
  - 第 4 章 由 Faia, Laffitte, Mayer 和 Ottaviano 编写，指自动化对就业和工资另一个可能的负面影响，并强调了自动化与外包之间的区别。他们引用了
    Bainbridge (1983) 描述的“自动化悖论”，模拟了这样一种观点：自动化通常要求高效完成互补任务，而这些任务只有具有专业人类人力资本的工人才能完成。因此，自动化可能导致工人专业化程度提高，他们不仅需要
    `more` 技能，还需要 `particular` 技能。Faia 等人将新技术要求工人具备“核心竞争力”领域专业知识的这种可能性，称为“核心偏向型技术变革”。
- - '#'
  - 第 5 章 Furusawa, Kusaka 和 Sugita 还研究了工业机器人改进的影响，同时将 AI 的进步视为一项独立的技术发展。他们假设工业机器人执行低技能工人本应执行的手工任务，而
    AI 则在执行更具概念性的任务时替代高技能劳动力。通过对涵盖 17 个行业和 50 个国家的基于任务生产的定量一般均衡模型（该模型包含了投入产关系和全球价值链），他们模拟了贸易成本和机器人技术保持在
    1993 年水平的反事实历史。他们发现，机器人技术的进步确实导致某些国家非熟练工人工资下降，但与贸易成本下降相比，其对劳动力市场的影响有限。同时，机器人产生的生产率提高惠了其他某些国家的工人。当他们模拟机器人和
    AI 生产率进一步增加十倍的影响时，发现前者的劳动力市场影响远大于后者，很大程度上是因为 AI 与高技能劳动力之间的估计替代弹性远小于机器人与低技能劳动力之间的替代弹性。仅在德国和日本，他们发现
    AI 技术进步产生了显著影响，这两个是 AI 任务占比相对较大的国家。最后，他们预测机器人技术的进步将增加大多数国家的工资不平等，而 AI 技术的进步对工资不平等将产生相反的影响。
- - '#'
  - 第 6 章 Baldwin 和 Dingel 提出了一个相当不同的问题。利用近期关于新冠肺炎引发的远程办公的研究，他们问到：新产生的远程工作中有多少可能移向海外，以及这种“远程迁移”（telemigration）在发展过程中有多重要。评估远程迁移的前景不仅需要估计有多少工作潜在可以外包，还需要估计居住国外的工人中有多少人具备执行这些任务的相关技能，以及这些外国工人对于其国内对应者的可替代性。为了解决这些问题，他们估计了一个远程迁移引力模型，其中进口国可以远程执行的工作总数充当
    `importer mass`；出口国合适工人的人口充当 `exporter mass`；而 Ghemawat (2007) 的文化、行政、地理和经济（`CAGE`）距离衡量标准捕捉了双边贸易摩擦。
- - '#'
  - 在第 7 章中，Hanson 研究了引导全美 AI 相关活动布局的力量。Hanson 首先通过人口普查职业名称中出现的关键词识别了 AI 相关工作。然后，使用
    `Lin (2011)` 提出的方法，通过将 AI 相关职业的就业增长与自 1990 年以来这些职业中新增的名称占比进行加权，估计了 AI 相关工作的区域性增长。他发现，总体而言，AI
    相关活动的区域专业化模式与 ICT（信息与通信技术）的相似。然而，该行业内的外国出生和本土出生工人倾向于聚集在不同地点。外国出生工在 AI 相关工作的专业化在私营部门就业占主导的高科技中心最强，而本土出生工在
    AI 相关工作的专业化在军事和太空相关研究中心最强。
