    blockchain-multi WSN authentication scheme for authentication in IoT. However,
    its layered network structure has high scalability and decentralized authentication
    scheme for IoT. Our scheme could achieve scheme registry, and is resistant to
    common attacks such as forgery attack and replay attacks. However, all authentication
    in the network is regarded as a public ledger and resulted in users'' privacy
    disclosure.


    To address the security risks of IoT networks, region-based have introduced solutions,
    separation, policies, and blockchain applications [14–17]. To maintain the trustworthiness
    connectivity and the authentication for WSNs, the authors proposed a framework
