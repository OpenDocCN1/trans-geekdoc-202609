    审计性：在跟踪审计阶段调用审计以查询区块链的所有记录。框架通过智能合约规则查询区块链网络并为用户提供某些记录。如果有异常记录，用户可以通过审计确认。在 BBSF
    中，如果解决了物联网的去中心化并提高了信誉，用户可以审计所有记录。基于区块链，BBSF 通过证书发布、更新、验证以及跟踪和审计实现了认证。数据分析也提供了安全性能讨论。在未来的工作中，我们将
    BBSF 部署到公有链或联盟框架中，以确保提出的 BBSF 的可扩展性和效率。


