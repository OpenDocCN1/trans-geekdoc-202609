    To address the security risks of IoT networks, region-based have introduced solutions,
    separation, policies, and blockchain applications [14–17]. To maintain the trustworthiness
    connectivity and the authentication for WSNs, the authors proposed a framework
    that supported resource security of the data integrity, and availability in [14].
    In [15], secure and efficient authentication architecture were proposed for IoT-based
    healthcare systems distributed smart e-gateway that did not consider congestion
    and attack scenarios. In [17], out-of-band two-factor authentication architecture
    was proposed to exploit delete relationships. But the system has the similar limit
    as [15].


    To avoid centrality, provide a decentralized distributed environment, this paper
    proposes a blockchain-based security framework to achieve lightweight decentralized
    authentication for IoT networks.


    # B. Contributions


    The main contributions of this paper are summarized as:


    The notations used in this paper are listed in Table 1.


    # TABLE I. NOTATIONS


    | Notations | Descriptions |

    |---|---|

    | idU | The identity of User |

    | ureg | User''s request for registration |

    | uSer | User''s private key |

    | pKU | User''s public key |

    | infor | The User''s individual info. |

    | info | User information |

    | refo | Relevant information in the blockchain |

    | auth | The request info to launch authentication |

    | ord | Order that can be used to modify |

    | modif | The type of data to be modified |

    | cont | The new modified data content |

    | req | The info used to apply for digital certificates |

    | cert | User''s certificate key |

    | upReg | The request used to apply for renewal certificate |

    | verReq | The request info used to apply for certificate verification |

    | newCert | User''s generated digital certificate |

    | res | The request to revoke current certificate |

    | aud | The request used to apply for certificate audit |


    # II. SYSTEM MODEL


    # A. Architecture Overview


    ![](img/f694c30b80e2eaa80b933991754781cb_1_0.png)


    The architecture of the proposed BBSF is shown in Fig. 1. BBSF contains three
    components: users, authentication server (AS), and underlying blockchain.


    The user will register with the authentication server using the corresponding
    public and private key pair and the certificate is used for identity authentication.
    Before using the system, the user will authenticate to AS with her certificate.
    After that, the user can use the certificate for update, revocation, and auditing.
    All operations of the user will be managed by smart contract, which can manage
    and track users'' requests.


    Authentication server (AS): AS receives the user''s request with the corresponding
    key for the certificate. The certificate generated by AS includes the certificate,
    the validity of the certificate, the user''s public key, and private key information.
    AS is also responsible for authentication, and assists in users'' certificate
    query, and auditing. Once a legitimate user wants a certificate, AS performs authentication
    and verification to assist us.


    BBSF (Blockchain): BBSF is essentially a distributed data system that stores information
    and smart contract performs various operations according to the defined rules.
    The proposed framework runs on the Ethereum private chain which contains a private
    smart contract, and we use Truffle to deploy and develop contracts. The rules
    of smart contract are formulated in the bottom layer.


    # B. Requirement


    We proposed a blockchain-based framework for the IoT which achieves security features
    such as decentralized authentication, user revocation, and so on. To applicable
    to IoT networks, security and performance requirements should be satisfied.


    +   1) Confidentiality: It is the basic requirement for the framework where data
    is exchanged in plain.

    2) Privacy: Users'' key information and data in the framework should not be modified
    by unregistered users or illegal modification to guarantee system security and
    data integrity of the proposed framework.'
