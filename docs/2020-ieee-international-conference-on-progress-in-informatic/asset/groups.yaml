    # BBSF：一种用于用户撤销的物联网区块链安全框架


    Yingxua Hu¹, Dan Yin²，Chanyang Huang*


    1. 南京理工大学计算机科学与工程学院，中国南京

    2. 哈尔滨工程大学计算机科学技术学院，中国哈尔滨


    *huay@njust.edu.cn, yindan@hrbin.edu.cn, hcy@njust.edu.cn


    *通信作者


    摘要—物联网（IoT）用于连接不同领域的用户（设备），如今已变得非常流行。物联网的安全性将发挥日益重要的作用，并需要保护日常生活。然而，物联网仍有许多严重问题待解决，例如去中心化、低功耗设备和轻量级框架、隐私保护。具有去中心化、许可、透明性和不可篡改特性的区块链技术引起了广泛关注。为了解决物联网认证的可信度问题，本文提出了一种基于区块链的物联网框架（BBSF）。它支持证书颁发、更新、撤销和审计功能。我们进行了安全性分析，并展示了数据机密性、完整性和安全性性能。此外，我们部署了带有环境的
    BBSF 以验证系统的稳定性、可扩展性和效率。


    **关键词—区块链、认证、物联网、智能合约**


    # I. 引言


    物联网（IoT）是一项代表通信和计算未来的革命性技术。随着物联网的商业化和人工智能的大规模实施，物联网市场已完全出现。然而，当物联网促进先进技术的发展并带来极大便利时，严重的安全问题也出现了。物联网网络中存在严重的安全问题，如去中心化、未经授权的认证、轻量级协议和威胁、恶意攻击等
    [1]。


    传统的安全机制基于中心化架构。有一个管理所有用户的中心。对于中心化认证，用户的身份由中心机构进行认证和验证。然而，物联网的这种中心化并不适用于去中心化或无中心的网络环境（如物联网网络），在这些环境中，单一中心无法管理各个领域的用户。例如，[4]和[5]中提出的加密方法仅依赖第三方机构，其安全性问题无法通过去中心化认证方法解决，导致服务器容易受到普通攻击，且在多权威假设下实现双向认证
    [8]。所有这些问题推动了对区块链应用新型认证机制的需求。


    自从区块链概念在2009年提出以来，由于其分布式结构和安全特性，研究领域引起了极大关注。随着以太坊平台的出现，区块链不再仅仅用于加密数字货币。区块链具有广泛的应用场景，包括金融、医疗、教育、信息协会等
    [9]。


    # A. 文献综述


    区块链技术的应用领域不断推动技术的发展。


    在[7]中，提出了一种区块链系统方法。算法详述了区块链的原理和应用，并引入了区块链工作的社会发展，为相似研究提供了有用的指导和参考。[8]总结了区块链技术的关键挑战和最新的重要进展，分为三类：公有链、私有链和联盟链。[9]中，作者分析了私有区块链的框架、安全问题，并提供了全面的评估和方法。


    许多工作利用区块链并开发了不可信环境下的应用。[10]中，作者提出了一种基于智能合约的物联网认证方案。然而，该方案的计算成本较高；物联网设备[11]提出了一种允许用户进行身份认证和验证的认证授权系统，但可扩展性未得到良好处理。[12]提出了一种用于物联网认证的区块链多无线传感器网络（WSN）认证方案。然而，其分层网络结构具有高可扩展性，且缺乏物联网的去中心化认证方案。我们的方案可以实现方案注册，并抵御伪造攻击和重放攻击等常见攻击。然而，网络中的所有认证都被视为公共账本，导致了（隐私）问题。


    为了解决物联网的安全风险，作者提出了一种支持证书、策略和区块链应用的框架[14]。为了维护连接的可信性，[15]提出了一种支持数据完整性的框架；[17]中，提出了一种带带外双因素认证的方案。


    # B. 贡献


    本文的主要贡献总结如下：


    本文使用的符号列于表1。


    # 表 I 符号


    | 符号 | 描述 |

    |---|---|

    | idU | 用户身份 |

    | ureg | 用户注册请求 |

    | uSer | 用户私钥 |

    | pKU | 用户公钥 |

    | infor | 用户信息 |

    | info | 相关信息 |

    | refo | 区块链信息 |

    | auth | 认证请求 |

    | ord | 需要修改的订单 |

    | modif | 修改的数据类型 |

    | cont | 修改的内容 |

    | req | 申请数字证书的请求 |

    | cert | 证书 |

    | upReg | 申请更新证书的请求 |

    | verReq | 申请验证证书的请求 |

    | newCert | 生成的数字证书 |

    | res | 撤销当前证书的请求 |

    | aud | 申请审计的请求 |


    # II. 系统模型


    # A. 架构概述


    ![](img/f694c30b80e2eaa80b3991754781cb_1_0.png)


    所提BBSF的架构如图1所示包含三个组件：用户、认证服务器（AS）和底层区块链。


    用户使用相应的公私钥对认证服务器进行注册，证书用于身份。在使用系统之前，用户通过证书向AS进行认证。之后，用户可以使用证书进行更新、撤销和审计。


    认证服务器（AS）：AS接收带有相应密钥的用户证书请求。AS生成的证书包含证书、证书有效性、用户公钥和私钥信息。AS还负责认证，并协助用户查询证书和审计。


    BBSF（区块链）：BBSF本质上是一个分布式数据系统，智能合约根据定义的规则执行各种操作。我们使用Truffle部署合约。


    # B. 要求


    我们提出了一种能够实现去中心化认证、用户撤销等安全特征的物联网框架。为了适用于物联网网络，必须满足安全性能需求。


    - 1) 机密性：这是以明文交换数据的框架的基本要求。

    - 2) 隐私：框架中的密钥信息和数据不应被未注册用户或非法修改，以保证系统安全性和所提框架的数据完整性。


