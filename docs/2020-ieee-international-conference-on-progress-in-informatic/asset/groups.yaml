    # D. Certificate Update


    When U wants to update the validity period of the certificate; or verify whether
    it has expired, she will apply to AS. The certificate update process again requires
    participation of a smart contract. After authentication, U sends IdU, upReq or
    verifyReq to AS. AS then checks and validates the certificate request, and forwards
    it to BC. Both new certificate and its operation are recorded and stored in the
    blockchain. The update process can also update the content of the certificate,
    such as the private keys used by AS. The process of renewing a certificate is
    similar to the process of issuing a certificate. After registration, the old certificate
    will be marked as revoked in the blockchain. The revocation process will be introduced
