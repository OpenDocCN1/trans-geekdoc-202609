    In this section, we analyze the security issues of the proposed framework BBSF.


    Confidentiality: In BBSF, only registered users can use the framework and query
    for related data. Furthermore, data are encrypted to ensure confidentiality, and
    stored within blockchain through the consensus mechanism.


    Fig. 6. Certificate revocation phase


    When U wants to revoke a certificate, she sends a revocation application to the
    AS. The application includes IdU, rev, and the certificate to be revoked. To execute
    the revocation, the user needs to be verified by AS first, and then AS calls a
    smart contract to delete the corresponding certificate locally. Finally, the certificate
    operation is written into BC, and feedback U''s has been returned to AS and U.


    Data integrity: During the registration, the user receives a pair of keys (PK,
    SK), which is issued by the ECC algorithm. And for data query and modification,
    Certificate Revocation, the user needs to pass the authentication, which cannot
    be skipped. Since the blockchain and verification step includes ECC with key pair
    of (PK, SK), data integrity is guaranteed in BBSF.


