    4) Audit: To detect system/data errors, analyze records and report these errors,
    the framework should be traceable.


    5) System Reliability: When the system encounters unexpected situations such as
    external attacks or internal failures, it should be able to locate the cause of
    the failure and recover in the system.


    6) Scalability: The framework should support large scales of users.


    7) Efficiency: End-users in IoT networks generally have low power and capacity.
    Therefore, the design should be efficient in small storage and computation, short
    response times, and so on.


    8) Stability and Use: The system should stay avoid a single point of failure and
    provide a friendly user interface for users to perform operations.


    # III. The Proposed FRAMEWORK BBSF


    Aiming at decentralization of IoT and improving the credibility, this section
    outlines the detailed framework and phases: user registration, authentication,
    data query and modification, certificate update, revocation, and audit.


    # A. User Registration


    In registration, user U will register to the authentication server AS as apply
    for a digital certificate, e.g. X.509. The registration process is shown in Fig.
    2.


    ![](img/f694c30b80e2eaa80b933991754781cb_2_0.png)


    Fig. 2. User registration phase


    User U first submits the registration to AS including Idc, reg. U info and cert
    req. Once receives the request, AS generates a pair of public and private key
    (SK), and the corresponding certificate cert for the user (e.g., PKU, SK) and
    cert is generated by ECC algorithm [3], cert contains the certificate subject,
    cert is written as the record of the new block by storing cert and the operation
    ok. Finally, U will receive feedback on successful registration, PKU and certs
    would be sent to the user in secure manner.


    # B. User Authentication


    This process allows users to perform authentication. U launches the request by
    sending their identity id and auth, where auth=[timestamp] and [x], x are encrypted
    by ECC algorithm with key y. Receiving the Idu and auth, AS will verify auth,
    and cert req to BC to request relevant information from BC. Next, AS verifies
    the user identity. After receiving the corresponding cert info from BC, AS then
    verifies the public key of U PKU, and then verifies auth by comparing received
    ID with decrypted ID using ECC decryption. The authentication process is shown
    in Fig. 3.


    ![](img/f694c30b80e2eaa80b933991754781cb_2_1.png)


    Fig. 3. User authentication phase


    # C. Data Query and Modification


    After authentication, user U can search for data from BC and modify information.
    After data query, user AS as the requested data Idu, requinfo BC. Both data will
    be forwarded to BC. BC then returns the requested information info to AS. If BC
    is involved, U sends a query: Idu, modifyinfo, and Cont, where modifyinfo. New
    Cont indicate the type of data (e.g. individual U info) to be modified and the
    data query respectively. AS directly forwards the mentioned contract to BC, to
    determine modifyinfo and then modify it to Cont. After that, BC returns feedback
    to AS and the user. The entire data query and modification is shown in Fig. 4.


    ![](img/f694c30b80e2eaa80b933991754781cb_2_2.png)


