  md: '# BBSF: A Blockchain Secured Framework for The Internet of Things with User
    Revocation


    Yingxua Hu¹, Dan Yin², Chanyang Huang*


    1. School of Computer Science & Engineering, Nanjing University of Science and
    Technology, Nanjing, China

    2. School of Computer Science & Technology, Harbin Engineering University, Harbin,
    China


    *huay@njust.edu.cn, yindan@hrbin.edu.cn, hcy@njust.edu.cn


    *corresponding author


    Abstract—Internet of Things (IoT), which uses to connect users (devices) from
    various fields, has become widely popular nowadays. The security of IoT will play
    an increasingly important role and need to protect daily life. However, there
    are still serious issues to be addressed in IoT, such as decentralization, power
    device and lightweight framework, privacy protection. Blockchain technology with
    characteristics of decentralization, permission, transparency, and immutability,
    has greatly attracted attention. To address the credibility of the authentication
    problem of IoT, this paper presents a Blockchain-Secured Framework (BBSF) for
    the Internet of Things. It supports certificate issuance, update, revocation,
    and audit functions. We conduct security analysis and show the performance of
    data confidentiality, integrity, and security. In addition, we deploy BBSF with
    environment to verify the system stability, scalability, and efficiency.


    **Keywords—blockchain, authentication, IoT, smart contract**


    # I. INTRODUCTION


    The Internet of Things (IoT) is a revolutionary technology that represents the
    future of communication and computing. With the commercialization of IoT and the
    large-scale implementation of artificial technology, the IoT market has fully
    emerged. However when IoT promotes the development of advanced technology and
    brings great convenience, serious security issues emerge. Severe security issues
    exist in IoT network, such as decentralization, unauthorized authentication, lightweight
    protocol and threats, malicious attacks, however, are becoming problems [1].


    The traditional security mechanism is based on centralized architecture. There
    is a center that manages all users. For a centralized authentication, the identities
    of users are authenticated and verified by the central authority. However, this
    centralization of IoT is not suitable for decentralized or center-less network
    environment such as IoT networks, where a single center cannot manage users in
    various domains. For example, the encryption methods proposed in [4] and [5] were
    only dependent on third-party organizations, and their security issues could not
    be addressed by decentralized authentication methods, such that the server


    was vulnerable to common attacks, and it was difficult to achieve mutual authentication
    under the assumption of multiple authority [8]. All mentioned problems pushed
    forward the requirement of a new authentication mechanism for blockchain applications.


    Since the idea of blockchain was proposed in 2009, research fields have gained
    great attention due to its distributed structure and security features. With the
    emergence of the Ethereum platform, blockchain is no longer just for encrypted
    digital currency. Blockchain has broad application scenarios, including finance,
    medical care, education, information associations, and so on [9].


    # A. Literature Review


    The field of application of blockchain technology continues to expand the development
    of technology.


    In [7], a method of the blockchain system was proposed. The algorithms elaborated
    on the principle, and application of blockchain, and the introduced the social
    development of blockchain work provided useful guidance and reference for the
    research of similarity. [8] summarizes key challenges and the latest important
    developments of the blockchain technology, which is divided into three types:
    Public chain, Private chain, and Consortium chain. [9], the author analyzes the
    framework of private blockchain, the security issues, and provides a comprehensive
    evaluation and method.


    Lots of works employed blockchain and developed untrusted environments. [10],
    the authors proposed a blockchain-based IoT authentication scheme with smart contracts.
    However, the high calculation cost was performed in the scheme, the IoT devices
    [11] proposed authentication and authorization system that enabled users to authenticate
    and verify identity. However, scalability is not handled well. [12] presents a
    blockchain-multi WSN authentication scheme for authentication in IoT. However,
    its layered network structure has high scalability and decentralized authentication
    scheme for IoT. Our scheme could achieve scheme registry, and is resistant to
    common attacks such forgery attack and replay attacks. However, all authentication
    in the network is regarded as a public ledger and resulted in users'' privacy
    disclosure.'
