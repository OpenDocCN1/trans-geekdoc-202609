    # 基于深度学习神经网络的关键系统非接触式控制


    Alexander A. Tyutyunnik¹, Ekaterina I. Lobaneva², Alexey I. Lazarev³

    ¹²,³经济与管理信息技术学院国立研究大学

    ²斯摩尔斯克电力学院 (BMI)

    ³俄罗斯联邦斯摩尔斯克

    ¹tyutyunnik@aa.yandex.ru, ²lobaneva94@mail.ru, ³anonymous.project@gmail.com


    **摘要 —** 本文介绍了一种通过 Leap Motion 控制和神经网络模块实现非接触式识别的软件产品，旨在提高关键地点的安全性。作者展示了用于双因素身份认证识别的数值序列生成研究，以及用于识别模式的预测性手部模型。可识别指纹的过程基于一种支持系统——通过模糊规则，识别的可访问百分比系数经过优化以适用于基于
    ARM 处理器的设备——该设备在远程进行按需认证，从而服务于多种身份验证工作和离线模式。


    这允许第三方未经授权访问系统 [3]。在研究中小企业全功能访问控制不当的问题时，发现另一个替代问题通常是缺乏准备的。在考虑基于生物识别数据验证方法的访问控制系统时，可以发现类似的问题：在没有支持系统的情况下进行生物识别数据的初始注册。


    **关键词 —** 访问控制系统、身份验证算法、自关联器、数据集、深度学习神经网络、安全


    # I. 引言


    信息安全（INFO）是关键设施的优先考虑事项。信息安全的本质是一个复杂的层次系统，涉及对研究过程的益处以及进一步保护潜在漏洞地点的流程的考虑。组织可以通过集成生物识别认证和访问管理系统（ACS）来实施安全流程。基于主体身份验证验证和身份验证应用的访问控制系统，可以基于光学检查或密码检查方法，也可以基于用户的生物识别数据——[1]。可以集成到
    ACS 中的主要功能包括：


    因此，在计划实施的系统期间，满足了系统应具备的主要标准。系统应根据授予一次性访问的益处，为组织成员等人员提供授权访问，而软件提供了对系统中所有主体的完整控制。系统实施中的一个重要因素是长时间内（可能随后的活动状态）的自主性。该软件解决方案提供了一种通过动态序列进行认证的方法，该方法通过
    Leap Motion 控制以非接触方式执行。因此，该实施降低了组织安全的身份验证系统风险。同时，身份验证方法的控制增加了安全性。

    - 基于专门算法的有序模块中管理执行的设备；

    - 支持照片和视频录制并具有将图像广播到目标网络的能力；

    - 控制主体身份验证，并根据相关模型的益处进行决策。


    现有的身份验证解决方案基于组织单元的注册。此类系统的主要问题是对于临时主体的访问方法效率低下。其他方面，基于 PIN 的识别系统使用与特定账户关联的静态密码，但


    # II. 主要算法


    根据本节提出的任务，定义了软件主要的硬件和软件需求。使用基于 ARM 处理器的设备来提供硬件支持，以降低产品发布和软件的成本，并配有 LCD 显示模块和用于应用程序的专用手部识别控制
    [4–6]——使用树莓派板作为底层硬件设备。


    图 1 所示的算法实现通常分为主模块，这些模块处理复杂系统中技术组件的并行顺序。所实现的算法由以下模块的顺序执行表示：

    - 识别原始数据并精炼参数——通过自关联器将精炼过程中的模型输入参数注册为结构化序列；

    - • “生成中间序列并执行 I/O 工具”——通过与神经网络生成的时间序列交互，执行神经网络输出参数的转换；

    - • “验证可识别指纹”是一个决策支持系统（DSS）模块，负责执行序列与生成序列之间一致性的性能分析；

    - • “预测性身份验证方法”是一种在系统开发期间基于输入样本展示来扩展功能的方法。


    “LeapInterpolate(frame)”。此函数允许在两个连续的可变帧之间固定一帧，额外的时同步算法允许更平滑的插值。因此，该函数执行单幅图像，并作为神经网络的输入值。


    此外，Leap API 包含一个模块，将 32 位 64x64 网格映射到由 [x, y] 坐标表示的输入像素亮度，但其使用均在 ARM 处理器上处理。


    软件实现中插值的通用算法如下：

    1. 应用程序与 Leap 时钟之间的时间同步。

    2. 将目标帧翻译为 Leap 时间戳。

    3. 分配所需的内存来存储当前时间的帧。

    4. 请求当前时间的帧。


    鉴于预测模型识别的存在，该模块的算法实现被实现为沿每个中间序列模块（编号 2）的并行处理过程——


    # A. 编码和定义 3D 模型参数的模型


    初始参数注册基于在体积空间对手部模型进行建模。作为该项目实施的一部分，该函数使用手部模型作为触发器来激活特定函数，例如输入或确认。该系统的另一个特征通常依赖于硬件，通过手势通过
    Leap Motion 追踪层接口实现。使用适当函数通过 Leap 获取手部的单色图像。输入控制器与专用设置库（SDK）、Leap 库通信。


    数据跟踪通过捕获 Leap 服务的单帧进行。序列分析每一帧，然后确定“目标对象”、取向和运动的存在。软件实现基于多个模型的比较分析——前一帧和用于生成的受限模型。结构执行当前时间跟踪数据的快照。每个后续帧的合成过程基于插值
    [1]。如果两帧之间的时间最小，则将两帧数据插值为单帧；否则，如果时间差超过有效值，则对可用帧进行外推插值。外推减少了插值过程中帧变化的延迟，避免了处理过程中的伪影。因此，分析确认在相关函数中集成神经网络将提高自关联外推的准确百分比。


    ```

    ((cos*y + offset, sin*y + cos*x + offset) - x)^2 +

    F = ((sin*y + offset, cos*y + cos*x + offset) - y)^2

    ((sin*beta + offset) - y)^2

    ```


    软件开发中使用的“LEAP TRACKING EVENT”结构的主要功能是


    ![](img/d78f3c104206ba306542f3964ccdf954_1_0.png)


    图 2. 三维空间中的算法计算


