    capture the capture of a monochrome image from hand using an appropriate function.
    The input controller communicates with a dedicated Setup Library (SDK), the LeapC
    API libraries.


    Data tracking is carried out by capturing a single frame of the Leap motion service.
    The series analyzes each frame and then determines the “target object”, orientation
    and presence of motion. The software implementation is based on comparative analysis
    of several models – the previous frame and the constrained model used for generation.
    The structure performs a snapshot of the current frame with the data that is tracked
    at the current time. The synthesis process for each subsequent frame is based
    on interpolation [1]. In case the time between two frames is minimal, the data
    of the two are interpolated into a single frame; otherwise, if the time difference
    exceeds a valid value, the interpolation is performed on extrapolation of the
    available frames. Extrapolation minimizes the delay between frame changes during
    interpolation, avoiding artifacts in the processing process. Thus, the analysis
    confirms that integrating a neural network into the function in question would
    improve the percentage of accuracy of auto-associated extrapolation.


