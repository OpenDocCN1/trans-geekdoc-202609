    # C. Module for validating an identified fingerprint


    The software module for identified fingerprint validation is implemented via a
    comparison between the generated dynamic sequence and the reference current time.
    The 2FA implementation is unit part of the DSS system, which outputs the outputs
    to the two-factor authentication module generating sequence functions and the
    reference time. The DSS module is generated by two parallel processes in blocks
    3 and 4 (Figure 6). The fingerprint validation is resulted by verification of
    the input value, performed by checking each output of the neural network sequence
    step by step. Another module includes the function of reconstructing the current
    sequence fingerprint for use in module 4.


    The decision block, module 3, is a function returning a fixed boolean value based
    on DSS output, which is responsible for performing further actions – denying access
    to the target object. Thus, the final result is used as a statistical indicator
    for the future work of program and is entered into the corresponding table of
    the database.


