    # I. INTRODUCTION


    Information security (INFONSE) is a priority at critical facilities. The nature
    of information security is a complex hierarchical system that involves consideration
    of benefit of research processes and processes for further securing potentially
    vulnerable sites. Organizations may implement the security process using the integration
    of biometric authentication and access management systems (ACS). The access control
    system based on the validation of the authentication of the subject, and the application
    of authentication can be based on optical or password checking method, and based
    on the user of biometric data – [1]. The main functionalities that can be integrated
    into an ACS include:


    Thus, during the planning of the system to be implemented, the main criteria that
    the system should have were met. The system should provide authorised access to
    persons, members of the organization based on benefit of granting one-time access,
    while the software provides full-fledged control over all subjects in the system.
    An important factor in the implementation of the system is autonomy during long
    period of time with the possible consequent of inactivity. The software solution
    provided with a method of authentication through dynamic sequence, which is executed
    with contactless method by the help of Leap Motion control. Thus, the implemented
    reduces the risk of the authentication system, for the security of the organization.
    At the same time, the control of authentication methods increases security.

