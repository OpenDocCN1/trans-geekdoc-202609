    # IV. CONCLUSION


    The software product presented in the article made it possible to identify the
    shortcomings of the maine security systems and implement an algorithmic and soft
    version of the system, where authentication is performed by both 2FA technologies
    and a sub-module of biometric data recognition based on an algorithm. The implemented
    method has shown an advantage over existing systems in the market: the possibility
    of authentic learning as well as their further authentication through a predictive
    pattern recognition algorithm.


    The authors'' model of fuzzy rules, by the implementation of a DSS module, made
    it possible to centrally manage the processing of cached patterns: both operation
    in client/server and mode operation for data processing on a remote server are.


