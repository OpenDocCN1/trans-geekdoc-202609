- pgno: 16
  md: '# Preface


    Over the years, I have accrued valuable experiences in implementing machine learning
    algorithms, and this book is my endeavor to share those insights with you. Machine
    learning is a vast field, encompassing areas including but not limited to computer
    vision, speech processing, natural language processing, and recommendation systems.
    While the diversity of these topics is immense, there are underlying mathematical
    and computational principles that weave them together.


    **Structure of the Book:** The book is structured into 11 chapters, each dedicated
    to a pivotal topic in the realm of scientific computation and machine learning:


    +   - **Chapter 1** delves into the power of vectorization, contextualized within
    parallel computing.


    +   - **Chapter 2** lays the foundation by discussing the basic tensor operations.


    +   - **Chapter 3** details the art of tensor indexing, elucidating how to access
    individual or subsets of tensor elements.


    +   - **Chapter 4** probes deeper into vectorization in tensor multiplications
    and common linear algebraic routines, which form the backbone of many machine
    learning algorithms.


    +   - **Chapter 5** sheds light on the pivotal concepts of masking and padding,
    which come into play when handling data of nonuniform sizes.


    +   - **Chapter 6** touches upon string processing techniques, invaluable for
    natural language processing (NLP) tasks.


    +   - **Chapter 7** introduces the realm of sparse matrices, discussing their
    data structures and integral operations.


    +   - **Chapter 8** takes a closer look at a unique kind of sparse tensor – ragged
    or jagged tensors – and the nuances of processing them.


    +   - **Chapter 9** breaks down the data wrangling pattern of groupby-apply-aggregate,
    which is crucial for data summarization.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '+   • Chapter 10 explores the topic on sorting, reordering, sampling, and batch
    processing through a series of case studies.

    +   • Chapter 11 concludes the book with a review of the Transformer++ architecture
    (a.k.a. LLaMA, a foundational large language model architecture from Meta), weaving
    together the principles discussed in the preceding chapters.


    **Audience:** While I have tailored this book for those embarking on their journey
    in machine learning algorithm implementation, it is not solely for beginners.
    Having a basic understanding of machine learning and deep learning will certainly
    be an advantage, but every concept introduced is supplemented with sufficient
    background to make it comprehensible to all readers.


    # **Prerequisites:**


    +   • **Familiarity with the Python programming language:** Readers can find online
    resources to learn Python or through classic books such as “Think Python.”

    +   • **Undergraduate linear algebra:** To this, I highly recommend Gilbert Strang’s
    lectures on Linear Algebra at MIT, or his book “Introduction to Linear Algebra.”

    +   • **Foundational knowledge of data science and machine learning:** The goal
    of this book is not to introduce machine learning, but rather to guide the reader
    in solving real-world problems encountered in machine learning (oftentimes deep
    learning). Basic knowledge of data science and machine learning can be gained
    from either previous more foundational courses or practical knowledge gained from
    doing machine learning projects hands-on. Courses such as Andrew Ng’s CS229 Machine
    Learning can serve as a foundation.


    # **Features:**


    +   • Every chapter is punctuated with numerous case studies to ensure the concepts
    are grounded in practical scenarios. Accompanying these are detailed code implementations
    with line-by-line explanations. Most of the implementations will use only the
    knowledge acquired within the chapter. Certainly, as the reader learns along the
    way, one may come up with better implementations by leveraging more advanced concepts.

    +   • The book covers vectorization techniques using NumPy, Tensorflow, and PyTorch
    (and for certain operations, Pandas as well). When introducing the operations,
    I will include tables that enumerate equivalent operations in these three libraries,
    in the hope that readers who are familiar with one of the libraries can also learn
    to translate algorithms and models implemented in another library. Most case study
    code examples will be implemented in one of the libraries (often NumPy), but readers
    are encouraged to implement the same functionality using alternative libraries
    by referencing equivalent operations.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '+   • All code examples are available at github.com/sapphire008/vectorization-book-supplement.
    Note that some code examples are simulations using random inputs, so rerunning
    the notebooks will not necessarily get the same results as the ones provided in
    the book.


    +   • To further clarify many of the vectorization operations, illustrative figures
    have been incorporated to visually represent the logic behind them, often accompanied
    by detailed explanations either within the text body or in the caption.


    +   • The principles discussed in this book should be agnostic to specific versions
    of Python, NumPy, TensorFlow, or PyTorch. By default, my code examples were tested
    using python==3.10.6, numpy==1.23.4, pandas==2.1.1, scikit-learn==1.3.0, scipy==1.11.1,
    tensorflow==2.13.0, keras==2.13.1, and torch==2.1.0. However, I will specify the
    library versions alongside code examples when the versions used are not the default,
    or whenever relevant or necessary to emphasize the versions.


    # Limitations:


    +   • Note that the carriage return symbol “↲” within the code block (with shaded
    background) is used to indicate a line break to accommodate formatting of long
    lines.


    +   • Code examples and case studies implemented to solve certain problems may
    not always be the most optimal solution, though it is honestly my best effort
    to come up with these solutions when writing this book. Sometimes, I also specifically
    made a decision to implement certain things not as efficiently as possible but
    to illustrate the practical application of the concepts introduced in the chapter.
    Because the materials of each chapter in the book build upon each other, I have
    made an explicit choice not to use a functionality that would be introduced in
    a later chapter. Still, this demonstrates the beauty of vectorization and coding
    in general: there is not a single solution to a specific problem in practice.
    Nonetheless, I encourage readers to find more efficient ways to solve the case
    study problems. On the other hand, if the readers found a bug in one of the implementations,
    please feel free to open an issue at github.com/sapphire008/vectorization-book-supplement.


    +   • When comparing the vectorization libraries, it is possible that I may be
    ignorant of certain functionalities specific to the library even though the information
    contained in this book is to the best of my current knowledge. I may sometimes
    claim that one library does not implement functionality that another library implements
    at the time of writing, but if readers found the other library indeed implemented
    that functionality, I stand corrected and will make the best effort to update
    this information in future editions of the book.'
  merge: -1
