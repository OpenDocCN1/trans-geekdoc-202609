  md: '# Figure 11.6 Relative positional embedding in T5 model.


    ![](img/e891acaacd4fb5b80dab2ed824618203_411_0.png)


    by an angle parameterized by the position. Specifically, given a rotation matrix
    \( R \), rotary positional encoding is incorporated into the input \( X \) by
    multiplication \( RX \). Here, \( R \) has the form:


    ```

    R_{\Theta, d}^{(p)} = \begin{bmatrix} \cos(p\theta_1) & -\sin(p\theta_1) & 0 &
    0 & \dots & 0 & 0 \\ \sin(p\theta_1) & \cos(p\theta_1) & 0 & 0 & \dots & 0 & 0
    \\ 0 & 0 & \cos(p\theta_2) & -\sin(p\theta_2) & \dots & 0 & 0 \\ 0 & 0 & \sin(p\theta_2)
    & \cos(p\theta_2) & \dots & 0 & 0 \\ \vdots & \vdots & \vdots & \vdots & \vdots
    & \vdots & \vdots \\ 0 & 0 & 0 & 0 & \dots & \cos(p\theta_{d/2}) & -\sin(p\theta_{d/2})
    \\ 0 & 0 & 0 & 0 & \dots & \sin(p\theta_{d/2}) & \cos(p\theta_{d/2}) \end{bmatrix}

    ```


    where,


    +   • \( R_{\Theta, d}^{(p)} \) is the pth slice of the rotation matrix for position
    \( p \).

    +   • Each slice is a \( d \times d \) matrix, where \( d \) is the embedding
    size (i.e. \( d_{model} \)).

    +   • \( \Theta \) is an array with each element as \( \theta_i = 10,000^{-2(i-1)/d}
    \), where \( i \in [1, 2, 3, \dots, d/2] \).


    Notice that each block is a 2D rotation matrix of the form


    ```

    \begin{bmatrix} \cos(\theta) & -\sin(\theta) \\ \sin(\theta) & \cos(\theta) \end{bmatrix}

    ```


    This means, we are rotating each pair of values along the embedding vector by
    an angle computed by \( p\theta_i \). The following code block is an implementation
    of the rotation matrix \( R \):'
