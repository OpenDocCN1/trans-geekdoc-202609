  md: 'the "AND" operation between two boolean values (True or False) is the same
    as multiplying the two corresponding binary (1s or 0s) values together.


    +   "union": This is equivalent to performing the "OR" operation (i.e. exists
    either in either set 1 OR set 2) between two boolean vectors at the corresponding
    elements. Recall in Chapter 5 that performing the "OR" operation between two boolean
    values is the same as summing the two corresponding binary values together, and
    then clipping the resultant values between 0 and 1.


    +   "difference": This is similar to performing "XOR" operation on two boolean
    vectors, except that it is directional (i.e. exists in set 1, but does not exist
    in set 2, not vice versa). Recall in Chapter 5 when performing the arithmetic
    version of "XOR" operations, we subtract the two binary values together and take
    the absolute value, in which case we convert both -1 (0 - 1 or False vs. True)
    and +1 (1 - 0 or True vs. False) results as +1 (True). However, by definition,
    set.difference keeps the element if it is True (exists) in set 1 and False (not
    exists) in set 2, while elements that correspond to False in set 1 and True in
    set 2 are not kept (unlike XOR which would keep elements in both cases). Therefore,
    in the arithmetic version of the set difference, we clip the resultant value to
    a minimum of 0 instead.


