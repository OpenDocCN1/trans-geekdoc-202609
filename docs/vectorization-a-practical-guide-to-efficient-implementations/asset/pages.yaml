    \ 2. “you smiling,” which corresponds to 2 beats or 300 frames.\n+   3. “at me,”\
    \ which corresponds to 3.5 beats or 525 frames.\n+   4. “Was it real or,” which\
    \ corresponds to 3 beats or 450 frames.\n+   5. “just my,” which corresponds to\
    \ 2 beats or 300 frames.\n+   6. “fantasy <rest>,” which corresponds to 3.5 beats\
    \ or 525 frames.\n\nThe following code block implements a function that can adjust\
