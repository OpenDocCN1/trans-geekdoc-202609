    A practical use case of the above algorithm is to align a generated sequence to
    some desired length. For example, a ground-truth speech audio sample has two words,
    lasts one seconds and contains 16,000 data points (i.e. 16 kHz sampling rate).
    However, the generated sample due to series of upsampling by factors of [16, 16,
    32] from the two words creates a sequence of 2 x 16 x 16 x 32 = 16,384 data points.
    In order to learn from the audio sample by calculating a loss between the prediction
    and the ground-truth, we can use the above algorithm to align the two sequences
    (e.g. truncate the generated sequence to 16,000 data points. It is worth noting
    that many practical applications of machine learning that deal with sequence data,
    the predicted sequence y should in general be of similar length as the template
    or input sequence X. If the predicted sequence is significantly longer or shorter
    than expectation, it is important to understand if upsampling steps are implemented
    correctly, or hyper-parameters for upsampling are chosen appropriately.


    # 5.3 Advanced Case Studies


    For the rest of the chapter, let us explore several more advanced use cases of
    masking and padding in machine learning/deep learning models.


    # 5.3.1 Scaled-Dot Product Attention


    Transformer models introduced by the paper “Attention Is All You Need” [Vaswani
    et al., 2017] are probably the most successful type of sequence model by far.
    It has been used widely in modeling sequence data such as texts, audio, and images,
    for tasks including natural language understanding [Devlin et al., 2019], speech
    recognition [Gulati et al., 2020], singing voice synthesis [Liu et al., 2021],
    and image recognition [Dosovitskiy et al., 2021]. A key component of transformer
    models is the Scaled Dot-Product Attention mechanism, which teaches the model
    which part of the sequence to focus the learning on. Scaled Dot-Product Attention
    is defined as


    $$A(Q, K, V) = \text{softmax} \left( \frac{QK^T}{\sqrt{d_k}} \right) V$$ (5.1)'
