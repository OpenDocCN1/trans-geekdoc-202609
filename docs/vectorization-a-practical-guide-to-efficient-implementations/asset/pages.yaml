  md: '![](img/e891acaacd4fb5b80dab2ed824618203_37_0.png)


    Figure 1.6 Comparison of parallel computing paradigms. Vectorization stores data
    within a single registry of the processing unit and processes multiple data representations
    on the registry using a single instruction simultaneously. Multithreading needs
    to switch between different threads of the processing unit and instructions are
    executed concurrently. Multiprocessing initiates multiple processes across different
    computing cores or different processing units on the machine, where data are communicated
    through shared memory. Multiworker distributed computing uses multiple machines
    to process a small piece of data, where the data are hosted on distributed file
    systems and communicated through networking.


    Figure 1.6 summarizes and compares different paradigms of parallel computing we
    have discussed so far.


    I hope this section provides enough information on different paradigms of parallel
    computing. It can be deduced that multithreading, multiprocessing, and multiworker
    paradigms are agnostic to the exact instructions of the program, whereas vectorization
    manipulates specific data using dedicated algorithms. Therefore, it is correct
    to expect that when combining vectorization with other types of parallel computing
    techniques such as multiprocessing and multiworker distributed computing, we can
    maximize our computing efficiency given limited resources.


