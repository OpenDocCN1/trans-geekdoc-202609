- pgno: 151
  md: 'By contrast, in “implicit” mode, the equation string does not have a right
    arrow -> specifying the resulting indices, and the results are computed with the
    following assumptions:


    +   • Indices are sorted alphabetically. If indices in the equations are specified
    not in alphabetical order, then the returned tensor will have the indices sorted
    alphabetically. For example, "ji" (whose equivalent explicit mode is "ji->ij")
    is equivalent to X^T.


    +   • Repeated indices are summed together. For example, "ij, j" (whose equivalent
    explicit mode is "ij, j->i") is equivalent to \(\sum_j X_{ij} . Y_j = z_i\), and
    to NumPy operation `np.sum(X * Y, axis=1)`.


    Note that certain operations can only be expressed in explicit mode. See various
    examples in Table 4.2.


    In Sections 4.5 and 4.6, we will look at several examples of implementing mathematical
    formulas and algorithms using tensor multiplications.


    # Table 4.2 Examples of einsum equations and equivalent NumPy operations.


    | Operation | Equation String (Explicit) | Equation String (Implicit) | Equivalent
    NumPy Operations |

    |---|---|---|---|

    | Inner product^a) | "i, i->" | "i, i" | np.inner |

    | Outer product^b) | "i, j->ij" | "i, j" | np.outer |


    Notes:

    a) Dot product of two vectors.


    ```

    1 a = np.random.rand(8)

    2 b = np.random.rand(8)

    3 np.allclose(

    4     np.inner(a, b),

    5     np.einsum("i,i", a, b)

    6 )


    ```


    b) Outer product of two vectors.


    ```

    1 a = np.random.rand(8)

    2 b = np.random.rand(8)

    3 np.allclose(

    4     np.outer(a, b),

    5     np.einsum("i,j", a, b)

    6 )


    ```'
