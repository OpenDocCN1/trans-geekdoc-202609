    ```


    ![](img/e891acaacd4fb5b80dab2ed824618203_400_0.png)


    **Figure 11.1** Learning rate schedule from the original transformer paper.


    However, many researchers still found that they need to carefully tune the learning
    rate for their specific tasks. Techniques used in the transformer model such as
    normalization and skip connections are known to address the problem of either
    an exploding or vanishing gradient, which is crucial for model training stability
    and convergence, yet these problems still exist. Hence, Xiong et al., 2020 proposed
    an alternative arrangement of the layers within the transformer block [Xiong et
    al., 2020]. They call it Pre-LN architecture, to distinguish it from the original
    architecture which they call Post-LN. A comparison of the two architectures is
    illustrated in Figure 11.2. The key difference between the two architectures is
    that the original Post-LN architecture performs attention and feedforward operations
    and then normalizes their outputs, whereas Pre-LN architecture starts with layer
    normalization on the inputs. With this change, Xiong et al., 2020 demonstrated
    that the transformer can be trained more stably without the use of a learning-rate
    schedule with a warm-up period, hence significantly improving the training efficiency
    of the transformer model by allowing faster convergence. I have seen many domains
    of study still use Post-LN with a learning-rate schedule in their neural architecture
    design. If trained successfully, the Post-LN architecture almost always outperforms
    that of Pre-LN architecture, especially in certain areas such as text-to-speech.


    Let us implement both the Pre-LN and Post-LN architecture of the transformer block.'
