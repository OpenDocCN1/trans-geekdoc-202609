    call the corresponding methods on the array/tensor instances. For example, instead
    of torch.abs(x), we can do x.abs(). This makes PyTorch more object-oriented.


    # ## 2.4 Reduction Operations


    Reduction (or reduce) operations are mathematical operations that summarize a
    set of values into a single value. It “reduces” the size of the tensor, from higher-dimensional
    to lower-dimensional, or single scalars. Table 2.4 lists examples of reduction
    operations.


    NumPy and PyTorch also have many of these reduction operations implemented as
    methods on their respective np.ndarray and torch.Tensor classes. Therefore, instead
    of using the function from the main module, one can call the corresponding methods
    on the array/tensor instances. For example, instead of np.sum(x) or torch.sum(x),
    we can do x.sum(). TensorFlow is more function-oriented and does not have these
    reduction operations implemented on its tf.Tensor class, likely because it needs
    to support the construction of computational graphs by tracing through function
    calls.


    # ## 2.5 Value Comparison Operations


    Value comparison operations compare the values stored within the tensor. Table
    2.5 provides a short list of the operations.'
