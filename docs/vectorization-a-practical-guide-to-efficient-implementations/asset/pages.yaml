    I found it helpful to understand this as if the target tensor is treated as a
    column vector as well, and the indices we are specifying are the indices of each
    row (i.e. first dimension), as illustrated in Figure 3.16. In general, the indices
    within the dimensions are arranged within a column, and indices of multiple dimensions
    are horizontally stacked together, which forms


    +   [dim_0_index_0, dim_1_index_0, ..., dim_d_index_0,

    +   dim_0_index_1, dim_1_index_1, ..., dim_d_index_1,

    +   ...

    +   dim_0_index_n, dim_1_index_n, ..., dim_d_index_n]


    PyTorch still requires the indices argument to be a tuple whose number of elements
    is the same as the number of dimensions, with each element being the 1D array
    of indices along the dimension:


    ```

    import torch

    indices = torch.tensor([0, 2, 4])

    values = torch.tensor([1, 3, 5])

    shape = (5, )

    X_torch = torch.zeros(shape, dtype=int)

    X_torch = torch.index_put(X_torch, (indices, ), values)

    # tensor([1, 0, 3, 0, 5])

    ```


    The scattering operations in NumPy, Tensorflow, and PyTorch also allow us to scatter
    multi-dimensional slices. See also Figure 3.17 for an illustration.


    ![](img/e891acaacd4fb5b80dab2ed824618203_127_0.png)


    Figure 3.16 Illustration of tf.scatter_nd over a 1D target tensor.'
