- pgno: 145
  md: "A typical usage of tensordot is to implement double matrix/tensor contraction\
    \ (commonly denoted as a : b = Tr(a · b^T)), using tf.tensordot(a, b, 2), given\
    \ two matrix inputs:\n\n```\n```python\na = np.random.rand(5, 3)\nb = np.random.rand(5,\
    \ 3)\nnp.allclose(\n    np.tensordot(a, b, 2),\n    np.trace(a @ b.T)\n)\n```\n\
    ```\n\ntensordot can be used for even more general tensor multiplications, especially\
    \ when the axes argument is provided as a pair of lists of indices. Notice that\
    \ len(axes[0]) == len(axes[1]). Values in the list of dimensions can also be negative.\
    \ For example, we want to compute the matrix contraction between the combinations\
    \ of a stack of three matrices and another stack of two matrices of shape (4,\
    \ 2),\n\n```\n```python\na = np.random.rand(2, 4, 2)\nb = np.random.rand(3, 4,\
    \ 2)\n# this results a tensor of shape (2, 3)\nnp.tensordot(a, b, axes=([1, 2],\
    \ [1, 2]))\n```\n```\n\nThe above example is illustrated in Figure 4.1.\n\n![](img/e891acaacd4fb5b80dab2ed824618203_145_0.png)\n\
    \n**Figure 4.1** Illustration of an example tensordot operation between tensors\
    \ of shape (2, 4, 2) and (3, 4, 2). Notice that the dot products between combinations\
    \ of the first column vectors result in the upper left corner tiles of the 2 x\
    \ 2 matrices, while dot products between combinations of the second column vectors\
    \ result in the lower right tiles in the 2 x 2 matrices. The sum of the values\
    \ along the diagonal of the 2 x 2 matrices is the values of the final matrix of\
    \ shape (2, 3)."
  merge: -1
