    It is interesting that pd.Series interprets the Python class str as well as "str"
    as object. This may lead to one to believe that any value in the dtype argument
    may be interpreted as an object, but try something else, like the name of the
    author of this book, and you will see this is not the case.


    When casting NumPy string arrays to Pandas series, the data type becomes object
    by default, that is


    ```

    import numpy as np

    import pandas as pd

    A_string = np.array(["a", "b", "c", "d"])

    # array([''a'', ''b'', ''c'', ''d''], dtype=''<U1'')

    A_Series = pd.Series(A_string)

    # 0 a

    # 1 b

    # 2 c

    # 3 d

    # dtype: object

    ```


    Pandas handles null values in string and object columns differently. string columns
    have a special placeholder <NA> for missing values, while object uses None.


    ```

    import pandas as pd

    feature = ["a", "b", "c", None, "d"]

    df = pd.DataFrame({

    "feature1": pd.Series(feature, dtype="string"),

    "feature2": pd.Series(feature, dtype="object")

