  md: '# 3.6 Put and Scatter


    Put and scatter operations are the reverse operations of take and gather: instead
    of retrieving elements from a tensor at certain indices, these operations can
    replace and aggregate values from a source tensor to a destination tensor. Put
    and scatter operations are more general operations than in-place value assignment
    that we discussed in Section 3.5, as they can operate in batches more efficiently.
    Furthermore, put and scatter operations can be seen as a way to perform group-by
    and aggregate operations, which we will explore more thoroughly in Chapter 9.
    Table 3.5 provides a list of equivalent put and scatter operations among NumPy,
    Tensorflow, and PyTorch.


    # 3.6.1 Put


    np.put operation is the reverse operation of np.take. Similar to np.take, np.put
    uses flat indices to put values from a source vector to a destination tensor.
    The np.put operation is an in-place operation that modifies the input directly
    without returning a copy.


    ```

    import numpy as np

    X = np.zeros(10, dtype=int)

    indices = np.array([2, 4, 6, 8])

    values = np.array([1, 2, 3, 4])

    # in-place operation modifies X directly

    np.put(X, indices, values)

    # array([0, 0, 1, 0, 2, 0, 3, 0, 4, 0])

    ```


    Like np.take, multi-dimensional targets are treated as if flattened (in the “C”
    order); indices are the flat index of the target tensor (see also Figure 3.13
    for an illustration).


    ```

    import numpy as np

    X = np.zeros((3, 3), dtype=int)

    indices = np.array([1, 2, 5, 8])

    values = np.array([1, 2, 3, 4])

    np.put(X, indices, values)

    # array([[0, 1, 2],

    #     [0, 0, 3],

    #     [0, 0, 4]])

    ```


    Multidimensional indices may not be utilized as expected, since they are treated
    as if the indices are flattened. The target’s shape will be retained.'
