  md: 'specific occurrences of cancer genes in a text file like this cannot rely on
    for loops in Python (which I naively attempted once at the time), as it will take
    years to finish the search. At least at the time, the common way to parse the
    genome text file is to use Linux’s awk command. Still, this took days to finish
    parsing the files I would need to parse. Then eventually, I came across Perl which
    is well known for its capability of text processing using regex. The adoption
    of Perl with regex cut down the processing time significantly, down to several
    hours from the original several days.


    Let’s examine several basic patterns of using regex in Python in the following
    examples. But I would like to encourage interested readers to refer to official
    Python documentation on regex (such as this one “Regular Expression HOWTO” [Kuchling,
    2023]) to learn more about this topic.


    ```

    import re


    # Example 1: remove punctuation

    text = "How is it going? I''m good!"

    result = re.sub(r''''''[[\.\,?!\ \-\:\;/\\\[\]'']'''''', '''', text)

    # ''How is it going Im good''


    # Example 2: tokenize: spaces and newline

    text = """The quick brown fox jumps

    over the lazy dog"""

    result = re.split(r''\s+'', text)

    # [''The'', ''quick'', ''brown'', ''fox'', ''jumps'', ''over'',

    # ''the'', ''lazy'', ''dog'']


    # Example 3: find occurrences of the pattern

    text = "The human genome has 3 billion base pairs, "

    "making the text file storing it as large as "

    "12 GB on disk."

    result = re.findall(r''\d+'', text)

    # [''3'', ''12'']

    ```


