    or data preprocessing for machine learning feature engineering.


    # ## 9.2 Reshaping and Windowing of Dense Tensors


    In Chapter 2, we introduced reduction operation, in which we apply an arithmetic
    operation along one or more dimension(s) or axis (axes) of a tensor. When combined
    with a reshaping operation, a reduction operation can be seen as applying the
    groupby-aggegate pattern. For instance, suppose we would like to downsample a
    time series by taking the average over chunks of 10 elements.


    ```

    import numpy as np

    import matplotlib.pyplot as plt

    # Simulate time series

    x = np.linspace(0, 10, 500)

    y = np.sin(x) + np.random.rand(len(x))

    # Downsample by averaging groups of 10 elements

    x_downsample = x[::10]

    y_reshaped = y.reshape(-1, 10))

    y_downsample = y_reshaped.mean(axis=1)

    # Plot out the results

    fig, ax = plt.subplots(1, 1, figsize=(8, 4))

    ax.plot(x, y, label="original", zorder=0)

    ax.plot(x_downsample, y_downsample, label="downsampled", c="r", zorder=1)

    ```'
