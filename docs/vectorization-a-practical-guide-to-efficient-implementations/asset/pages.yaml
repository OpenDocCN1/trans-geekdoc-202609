    Here, in Line 10, we reshaped y from a shape of (500, ) array to a 2D (50, 10)
    matrix. The reshaping operation collects every 10 elements in the second dimension
    (axis=1) and stacks each of the collections along the first dimension (axis=0).
    Therefore, this is as if using the groupby pattern. Then, we apply the mean reduction
    operation along axis=1 in Line 11, which takes the average within the grouped
    values. Together, this reshape-reduce operation combination completes the implementation
    of a groupby-aggregate pattern. See Figure 9.1 for the results of the plot. See
    also Figure 9.2 for a schematic illustration of the concept of combining reshaping
