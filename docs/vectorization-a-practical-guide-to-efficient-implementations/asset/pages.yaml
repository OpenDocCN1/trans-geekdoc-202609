    # ## 9.5 Segment-wise Aggregation


    Although Pandas is the best-known library for the groupby-aggregate-apply pattern,
    more basic numerical libraries including NumPy as well as deep-learning-oriented
    ones like Tensorflow and PyTorch also implement operations to facilitate the use
    of this pattern for data transformation. More specifically, these are called segment
    operations, where, in general,


    +   \* Sequences of elements of variable lengths are arranged along a single dimension.

    +   \* An array of integers labels the group identity of the segments.

    +   \* Elements within the group are aggregated together by a reduction operation,
    such as summation.


    See Figure 9.12 for an illustration of an example of segment-wise summation operations.
    Table 9.2 provides a list of segment operations in NumPy, Tensorflow, and PyTorch.


    ![](img/e891acaacd4fb5b80dab2ed824618203_340_0.png)


    **Figure 9.12** Illustration of segment-wise summation operation, with each color
    indicating a segment/group of values. There are two ways to denote the segment,
    either through sequence index or segment id.'
