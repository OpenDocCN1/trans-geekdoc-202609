- pgno: 268
  md: 'We want to minimize \(J\). By setting the gradients as zero, we have


    \(\frac{\partial J}{\partial u_i} = 2 \sum_{j \in \Psi_i} (r_{ij} - \vec{u}_i
    \vec{w}_j^T)(-\vec{w}_j) = 0\)


    \(\sum_{j \in \Psi_i} r_j(-\vec{w}_j) - \sum_{j \in \Psi_i} (\vec{u}_i \vec{w}_j^T)(-\vec{w}_j)
    = 0\)


    \(\sum_{j \in \Psi_i} (\vec{u}_i \vec{w}_j^T)\vec{w}_j = \sum_{j \in \Psi_i} r_j
    \vec{w}_j\)


    \(\sum_{j \in \Psi_i} \vec{u}_i (\vec{w}_j^T \vec{w}_j) = \sum_{j \in \Psi_i}
    r_j \vec{w}_j\)


    \(\vec{u}_i \left( \sum_{j \in \Psi_i} \vec{w}_j^T \vec{w}_j \right) = \sum_{j
    \in \Psi_i} r_j \vec{w}_j\)


    Notice that \(\vec{w}_j^T \vec{w}_j\) is an outer product. Also, notice that the
    last step is in the form of \(AX = b\) (if \(X\) is column vector, or \(XA = b\)
    is \(X\) is a row vector).


    We can invert the matrix \(A = \sum_{j \in \Psi_i} \vec{w}_j^T \vec{w}_j\) part
    to solve for \(\vec{u}_i\), yielding


    \(\vec{u}_i = \sum_{j \in \Psi_i} r_{ij} \vec{w}_j \left( \sum_{j \in \Psi_i}
    \vec{w}_j^T \vec{w}_j \right)^{-1}\)


    Numerically, we can take advantage of numpy''s `np.linalg.solve(A, b)` function
    to solve for \(\vec{u}_i\).


    To solve for \(w_j\), we yield similar results


    \(\vec{w}_j = \sum_{i \in \Omega_j} r_{ij} \vec{u}_i \left( \sum_{i \in \Omega_j}
    \vec{u}_i^T \vec{u}_i \right)^{-1}\)


    We apply the isolated \(u_i\) and \(w_j\) updates iteratively to minimize the
    loss function \(J\). This is called **alternating least squares (ALS)**. We first
    initialize \(u_i\) and \(w_j\) randomly, then update according to the equations
    we obtained.


    # ## 7.7.3 Adding Bias Terms to Matrix Factorization


    Recall that in our collaborative filtering, we have the similarity measure as


    \(s(i, j) = \bar{r}_i + \frac{\sum_{l'' \in \Omega_j} w_{il''}(r_{il''} - \bar{r}_{l''})}{\sum_{l''
    \in \Omega_j} \| w_{il''} \|}\)


    where we have the bias term \(\bar{r}_i\). Thus, we revised the rating as


    \(\hat{r}_{ij} = \vec{u}_i \cdot \vec{w}_j^T + b_t + c_j + \mu\)'
