  md: '+   - Lines 43–46 set up the `num_days` vector, which encodes the number of
    days of each month (for a non-leap year, we have additional logic to handle leap
    years below).


    +   - Lines 47–49 determine if the timestamp occurs on a leap year.


    +   - Lines 51–56 compute how many days the month is supposed to have, that is
    `month_days`. We use `tf.gather` to look up the expected number of days for a
    non-leap year first. We then use `tf.where` to replace any leap month with 29
    days instead of 28 days instead of 28 days.


