    # 3.4 Take and Gather


    Selecting elements and slicing from a tensor is also known as the take or gather
    operation. NumPy, Tensorflow, and PyTorch all implement these methods as concrete
    functions. Table 3.3 is a summary of a list of take and gather operations in these
    libraries. We will walk through each of the operations and study their usage patterns
    in this section.


    # 3.4.1 Take


    The take operation is a convenient function to select elements from a tensor using
    flat integer indices. To illustrate with a simple example,


    Table 3.3 List of take and gather operations in NumPy, Tensorflow, and PyTorch.


    | Operation | NumPy | Tensorflow | PyTorch |

    |---|---|---|---|

    | Take elements/slices with flat index | np.take | tf.experimental.numpy.take
    | torch.take |

    | Batchwise take | np.take_along_axis | tf.experimental.numpy.take_along_axis
    | torch.take_along_dim |

    | Gather | np.take, np.take_along_axis | tf.gather | torch.gather |

    | Take elements by multi-index | N/A | tf.gather_nd | N/A |'
