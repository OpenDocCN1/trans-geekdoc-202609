  md: '# ## 11.3 Layer Normalization


    Normalization can help stabilize neural network training by reducing the likelihood
    of exploding or vanishing gradients and improving model generalization. Different
    normalization schemes have been explored previously, though most attempted to
    standardize the inputs or outputs of the network layer such that the mean of the
    values are centered around 0 and the variance becomes 1.


    > \(\tilde{x}_i = \frac{x_i - E[x_j]}{\sqrt{\text{Var}[x_j] + \epsilon}} \gamma
    + \beta\) (11.1)


    where \(\gamma\) and \(\beta\) are learnable parameters for each dimension to
    be normalized; \(\gamma\) can be considered as the learned standard deviation,
    while \(\beta\) can be considered as the learned mean. \(\epsilon\) is a smoothing
    value that prevents division by zero. Depending on which dimensions are normalized,
    the normalization schemes were given different names. Specifically, given an input
    tensor of shape `(batch_size, sequence_length, num_channels)`,


    +   - **Batch normalization**: Standardizes each feature/channel/embedding value
    across the batches. Hence, \(\gamma\) and \(\beta\) are vectors of shape `(num_channels,
    )`.

    +   - **Layer normalization**: Standardizes within the batch. It has two formulations:
    the input tensor is normalized either across both sequence and channel dimensions
    (Variant 1, see Figure 11.3b) or across only the channel dimensions within each
    sequence (Variant 2, see Figure 11.3c). Different from batch normalization which
    applies a scalar value for each channel, layer normalization uses an element-wise
    affine transformation (i.e. scale and shifting). Hence, \(\beta\) and \(\gamma\)
    are tensors of shape identical to the plane that the normalization is computed


    ![](img/e891acaacd4fb5b80dab2ed824618203_404_0.png)


    **Figure 11.3** Comparison of normalization scheme. (a) Batch normalization normalizes
    across the batch within each channel/feature dimension, (b) layer normalization
    normalizes the channel by sequence within each batch, (c) an alternate formulation
    of layer normalization is to normalize within the batch and sequence across only
    the channels; this is the default behavior for the implementation of LayerNormalization
    in Keras and it is a popular usage pattern of layer normalization. This is also
    the normalization scheme for RMSNorm, (d) group normalization is similar to layer
    normalization, but further separates channel dimensions into groups and normalizing
    within the group, (e) instance normalization normalizes within each batch by channel
    instance, e.g. each sequence.'
  merge: -1
  img_proc: true
