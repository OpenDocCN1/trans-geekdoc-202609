  md: 'For examples,


    +   - A scalar, e.g. 5 with no dimensions (ndim=0), can be broadcasted to a tensor
    of shape (3, 6, 5, 7), which produces a tensor of shape (3, 6, 5, 7).

    +   - A tensor of shape X of shape (5, 7) can be broadcasted to another tensor
    Y of shape (3, 6, 5, 7), since the last two dimensions of X and Y are matching.
    The resultant tensor Z has shape (3, 6, 5, 7).

    +   - A tensor X of shape (5, 7) cannot be broadcasted to another tensor Y of
    shape (7, 6, 2), since the last two dimensions of X and Y are not matching, nor
    any of the axes of X is a singleton.

    +   - A tensor X of shape (1, 7) can be broadcasted to another tensor Y of shape
    (3, 6, 5, 7), since the last dimension of the two tensors are matching, and the
    second to last dimension of X is a singleton. The resultant tensor Z has shape
    (3, 6, 5, 7).

    +   - A tensor X of shape (6, 1, 7) can be broadcasted to another tensor Y of
    shape (3, 1, 5, 7), since the last dimension of the two tensors are matching,
    the second to last dimension of X is a singleton, and the third to last dimension
    of Y is a singleton. The resultant tensor Z will have a shape of (3, 6, 5, 7).

    +   - A tensor X of shape (0, 7) cannot be broadcasted to another tensor Y of
    shape (3, 6, 5, 7), since the first axis of X is 0, which is neither a singleton
    nor matching to the last dimension of Y, i.e. 5.

    +   - Here is an odd example for 0-size tensors. When attempting to broadcast
    tensor X of shape (0, 7) (i.e. empty, 0-size tensor) to another tensor of shape
    (1, 7), the operation will not throw an error. However, the resulting tensor Z
    will also be of shape (0, 7), i.e. an empty tensor like X. This is why we need
    to avoid operations with empty or 0-size tensors in our broadcasting rule.


    > Note that the underlying mechanism of broadcasting is not in reality repeating
    the elements to be broadcasted many times by copying the same data over and over
    again, as it will not be memory efficient.


