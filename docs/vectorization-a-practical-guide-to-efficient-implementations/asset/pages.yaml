  md: "[..., -k]. Then, [..., ::-1] reverses the top-k indices so that it is now arranged\
    \ from largest to smallest.\n\n+   • Line 6: np.take_along_axis applies the sorting\
    \ order obtained from top_indices to the input, along the last dimension.\n\n\
    However, this would involve sorting the entire sequence. The time complexity of\
    \ this approach is O(n log n), where n is the size of the sequence. In contrast,\
    \ another strategy to retrieve top-k values is using np.argpartition to return\
    \ the unordered top-k values first, and then sort the top-k values and indices\
    \ using np.argsort. Since np.argpartition runs in O(n) [Harris et al., 2023] time\
    \ complexity, the overall time complexity is then O(n + k log k), where k << n.\n\
    \n```\nimport numpy as np\n\ndef top_k_argpartition(X, k=3):\n    \"\"\"Get top-k\
    \ values and indices along the last dimension.\"\"\"\n    # Unsorted top k values\
    \ and indices\n    top_indices = np.argpartition(X, -k, axis=-1)[..., -k:]\n \
    \   top_values = np.take_along_axis(X, top_indices, axis=-1)\n\n    # Sort based\
    \ on top_values\n    indices = np.argsort(top_values, axis=-1)[..., ::-1]\n  \
    \  top_indices = np.take_along_axis(top_indices, indices, axis=-1)\n    top_values\
    \ = np.take_along_axis(top_values, indices, axis=-1)\n\n    return top_values,\
    \ top_indices\n\nX = np.array([1, 3, 2, 5, 9, 8, 4])\ntop_values, top_indices\
    \ = top_k_argpartition(X)\n# top_values: array([9, 8, 5])\n# top_indices: array([4,\
    \ 5, 3])\n```\n\n+   • Line 6 partitions the array by the kth largest value. np.argpartition\
