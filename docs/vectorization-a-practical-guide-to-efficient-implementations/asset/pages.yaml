  md: "![](img/e891acaacd4fb5b80dab2ed824618203_408_0.png)\n\nFigure 11.5 Tensor2Tensor\
    \ variant of the sinusoidal positional encoding.\n\nAn alternative formulation\
    \ of the sinusoidal positional encoding was introduced in the TransformerXL architecture\
    \ implemented by Google’s tensor2tensor [Vaswani et al., 2018] deep learning library\
