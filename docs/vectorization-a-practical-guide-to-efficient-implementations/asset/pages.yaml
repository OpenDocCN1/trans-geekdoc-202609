    In addition, there are two major flavors of this attention mechanism:


    +   - **Self-attention**: key, query, and value are all the same sequence inputs.
    The attention weights are computed within the sequence itself, between pairs of
    its own elements.

    +   - **Cross-attention**: key, query, and value are not the same sequence. Here,
    elements in the key and query sequences need to have identical embedding or so-called
