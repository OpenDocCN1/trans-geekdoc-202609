    +   • Segment id: Tensorflow''s segment operations as well as PyTorch''s scattering
    operations use this strategy. Instead of explicitly inferring the segments based
    on the intervals between the start and end indices, segment ids specifically label
    which group a segment belongs to. Here, the segment_id input is treated as the
    group key. This can be advantageous because we can then use operations that do
    not necessarily have all elements of the same group arranged next to each other
    before aggregation. Tensorflow implements three variants of segment aggregation
    operations, which assume the first axis(axis=0) is the segment dimension to be
    aggregated.


