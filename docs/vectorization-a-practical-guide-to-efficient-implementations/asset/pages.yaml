    ```\n```python\nimport numpy as np\nimport scipy.sparse\nfrom scipy.sparse import\
    \ csc_matrix, coo_matrix, dok_matrix\nfrom scipy.sparse import load_npz, save_npz\n\
    from tqdm import tqdm\n\ndef multiply_U_W(U, W, R):\n    \"\"\"\"\"\"Compute product\
    \ of U and W.T,\n    but only at the position where R is available\"\"\"\n   \
    \ iU, iW = R.tocoo().row, R.tocoo().col # np.nonzero(R)\n    # values = np.sum(U[iU,\
    \ :] * W[iW, :], axis=1)\n    values = np.einsum('ij,ij->i', U[iU, :], W[iW, :])\n\
    \    # Recreate the coo matrix, making sure its shape\n    # is the same as R\n\
    \    result = coo_matrix(\n        (values, (iU, iW)), shape=R.shape\n    ).tocs()\n\
    \    return result\n\ndef R_plus_cv(R, cv):\n    \"\"\"\"\"\"Sparse matrix plus\
    \ a column vector\"\"\"\n    R = R.tocsc()\n    R.data += np.take(cv, R.indices)\n\
    \    return R\n\ndef R_plus_rv(R, rv):\n    \"\"\"\"\"\"Sparse matrix plus a row\
    \ vector\"\"\"\n    R = R.tocsr()\n    R.data += np.take(rv, R.indices)\n    return\
    \ R\n```\n```\n\nLet us unwrap the first function multiply_U_W furthermore and\
    \ explain it using the context of matrix factorization that we discussed in this\
    \ section. Suppose we have a rating matrix R with shape (N, M), where N is the\
    \ number of users, and M is the number of items in the catalog. Using the matrix\
    \ factorization"
