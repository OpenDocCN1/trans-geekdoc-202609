    \ values)\n```\n\n# ## 3.7 Case Study: Batchwise Scatter Values\n\nAs we have\
    \ seen in Section 3.6, PyTorch implements a version of the scattering operation\
    \ `torch.scatter` that is the reverse operation of its gather operation `torch.gather`.\
    \ Tensorflow does not implement `tf.scatter` which allows batched application\
    \ of scattering by flat indices. However, as we will see in one of the case studies\
    \ in Chapter 9, batchwise scattering is often needed to implement group by aggregate\
    \ logic.\n\nSuppose we have the following data (see also Figure 3.20a),\n\n```\n\
