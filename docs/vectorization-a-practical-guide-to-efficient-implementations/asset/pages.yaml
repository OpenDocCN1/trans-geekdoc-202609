    \ 6.1.3 Tensorflow Bytes\n\nTensorflow has the `tf.string` data type, but all\
    \ the data stored in `tf.Tensor`\nbecomes bytes. For example,\n\n```\nimport tensorflow\
    \ as tf\nstring_array = [\"lorem\", \"ipsum\", \"dolar\"]\ntf_string_array = tf.constant(string_array)\n\
    # tf.Tensor([b'lorem' b'ipsum' b'dolar'], shape=(3,), \n# ~ dtype=string)\n```\n\
    \nThe `tf.Tensor.numpy` method can convert Tensorflow's `tf.Tensor` to\na NumPy\
    \ array. For float and integer types, the conversions typically have no\nissues\
    \ retaining the data as float and integer of the corresponding precisions (i.e.\n\
    `tf.int64 -> np.int64`, `tf.int32 -> np.int32`, `tf.float32 -> np.float32`, `tf.float64\
    \ -> np.float64`). But when converting a byte\nstring to a NumPy array, we will\
    \ get an array of bytes in NumPy instead of typical\nstring representations (U\
    \ or S). This can sometimes be inconvenient if we were\nto implement further string\
    \ processing on the text, where some methods are\nspecifically implemented against\
    \ string types instead of byte types. For example,\nsuppose we would like to replace\
    \ values using a dictionary, where the keys of\nthe dictionary are specified using\
    \ strings. However, the values we would like to\nreplace are specified in bytes.\
    \ If caution is not exercised, the program may not be\nable to achieve the goal\
    \ of replacing values at all.\n\n```\nimport tensorflow as tf\nmapping = {\"A\"\
    : \"1\", \"B\": \"2\", \"C\": \"5\"}\nvalues = tf.constant([[\"A\", \"C\", \"\
    B\"]) # should result [\"1\", \"5\", \"2\"]\n```"
