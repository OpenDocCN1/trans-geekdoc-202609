  md: '```

    18

    19

    20 def regularized_matrix_factorization(

    21     R, R_eval=None, K=25, l2_reg=0.001, maxiter=100

    22 ):

    23     """

    24     Solving matrix factorization with alternating least square

    25

    26     Parameters:

    27     """

    28     * R : training rating sparse matrix of size N x M

    29     * R_eval : evaluation rating sparse matrix of size N x M

    30     * K : number of features to use

    31     * l2_reg: L2 regularization size

    32     * maxiter : max number of iterations

    33

    34     Returns:

    35     """

    36     U : N x K user matrix

    37     W : M x K item matrix

    38     b : length N vector of user bias

    39     c : length M vector of item bias

    40     mu: global mean of the user rating matrix

    41     J : training loss over epochs

    42     """

    43     R = R.tocsc()  # make sure it is csc format

    44     N, M = R.shape

    45     # Calculate global mean mu

    46     mu = R.mean()

    47

    48     # Initialize the bias terms

    49     b = np.random.randn(N)

    50     c = np.random.randn(M)

    51

    52     # Initialize the user and item matrix

    53     U = np.random.randn(N, K)

    54     W = np.random.randn(M, K)

    55     U_W_prod = multiply_U_W(U, W, R) # sparse (N, M)

    56     if R_eval is not None:

    57         R_eval = R_eval.tocsc()

    58         U_W_prod_eval = multiply_U_W(U, W, R_eval)

    59

    60     # Counting cardinalities

    61     card_psi = R.getnnz(axis=1)

    62     card_omega = R.getnnz(axis=0)

    63     total_card = R.getnnz()

    64

    65     # Initialize loss

    66     J = np.zeros(maxiter)

    67     J_eval = np.zeros(maxiter)

    68

    69     # Iterate

    70     for epoch in tqdm(range(maxiter)):

    71         # Compute training prediction

    72         R_hat = compute_prediction(U_W_prod, mu, b, c)

    ```'
