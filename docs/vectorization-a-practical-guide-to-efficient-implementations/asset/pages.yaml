  md: '# Figure 2.10 Luo Shu, the earliest known third-order magic square.


    ![](img/e891acaacd4fb5b80dab2ed824618203_70_0.png)


    A magic square can be classified into three categories: odd ($n = 2k + 1$), doubly
    even ($n = 2(2k) = 4k$), and singly even ($n = 2(2k + 1) = 4k + 2$) [Kraitchik,
    1942]. These three categories of magic squares use three different algorithms
    to construct. The magic constant of the magic square is the row or column sum
    of the entries, given by the formula $\sigma(M) = \frac{n(n^2+1)}{2}$. For a $3
    \times 3$ magic square, the magic constant is


    $$\sigma(3) = \frac{3 \times (3^2 + 1)}{2} = 15$$


    The oldest third-order magic square is probably the one from “Luo Shu,” an ancient
    Chinese book used for fortune-telling, as shown in Figure 2.10. It also came with
    a pithy formula that goes like the following: “2 (right) and 4 (left) on the shoulders,
    6 (right) and 8 (left) on the feet, 3 on the left, 7 on the right, 9 be the hat,
    1 be the shoe, and 5 at the center” (and I am mostly remembering this from the
    novel “The Legend of the Condor Heroes” written by Jin Yong who cited this pithy
    formula for the magic square in “Luo Shu”).


    # Odd-Order Magic Squares Construction by Siamese Method


    Siamese method is probably the best-known method for constructing magic squares
    of odd orders [Kraitchik, 1942; De La Loubere, 1693]. The rules for constructing
    a magic square are the following:


    +   1. Start at the position of the topmost row and central column of the matrix.
    Fill this position with 1.

    +   2. We then continue filling the matrix by going diagonally upward and right.

    +      1. If we run out of rows, we go back to the bottom-most row and fill in
    the values in the corresponding column.

    +      2. If we run out of columns, we go back to the leftmost column and fill
    in the values in the corresponding row.

    +      3. If we run out of both rows and columns (i.e. when going from the upper
    right corner), or the subsequent position is already occupied, we then fill the
    position right below the current element by going down 1 row, keeping the same
    column.'
