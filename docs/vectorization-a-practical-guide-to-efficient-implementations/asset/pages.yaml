    \ numpy=array([9, 8,\n~ 5])>\n# top_indices: <tf.Tensor: shape=(3,), dtype=int32,\
    \ numpy=array([4, 5,\n~ 3], dtype=int32)>\n```\n\nand for PyTorch\n\n```\nimport\
    \ torch\nX = torch.tensor([1, 3, 2, 5, 9, 8, 4])\ntop_values, top_indices = torch.topk(X,\
    \ k=3)\n# top_values: tensor([9, 8, 5])\n# top_inidces: tensor([4, 5, 3])\n```\n\
    \nAt the time of writing this chapter, NumPy does not have a ready-to-use function\
    \ to retrieve the top-k values and indices. However, it is possible to use sorting\
    \ to achieve the same goal. A naive approach is to use np.argsort to determine\
    \ the indices of the top values, then use np.take to retrieve the top values.\n\
    \n```\nimport numpy as np\ndef top_k_argsort(X, k=3):\n    \"\"\"Get top-k values\
    \ and indices along the last dimension.\"\"\"\n    top_indices = np.argsort(X)\
    \ [..., -k:][..., ::-1]\n    top_values = np.take_along_axis(X, top_indices, axis=-1)\n\
    \    return top_values, top_indices\nX = np.array([1, 3, 2, 5, 9, 8, 4])\ntop_values,\
    \ top_indices = top_k_argsort(X)\n# top_values: array([9, 8, 5])\n# top_indices:\
    \ array([4, 5, 3])\n```\n\n+   Line 5: np.argsort first gets the index used to\
    \ sort each of the arrays. Since it sorts the values in ascending order (from\
    \ smallest to largest), we then slice out the last k indices for the top-k values\
    \ along the last dimension of the input, using"
