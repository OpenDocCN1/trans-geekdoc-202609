    \n# 5.3.3 Length Regulator Module of FastSpeech2\n\nIn a typical text-to-speech\
    \ (TTS) application, a sequence of bytes or strings is converted into a time series\
    \ of waveforms. This is the sequence-to-sequence problem in machine learning,\
    \ where the sequential representation of a certain information modality is converted\
    \ into another sequence, sometimes in another modality. Classic approaches to\
    \ solve the TTS problem were using auto-regressive modeling (e.g. Hidden-Markov\
    \ Model [Zen et al., 2007] and WaveNet [van den Oord et al., 2016]), where prompt\
    \ waveforms and contexts are used to generate subsequent new speech waveforms.\
    \ On the other hand, non-auto-regressive approaches like FastSpeech/2 [Ren et\
    \ al., 2019, 2020] use sequence-to-sequence (seq2seq) learning, where the input\
    \ texts are converted into audio signals using only one pass.\n\nOne problem with\
    \ the seq2seq learning approach between two different information modalities is\
    \ that the input and output sequences may represent information at different densities\
    \ and lengths. For example, a sentence like “I love machine learning” uses an\
    \ array of 4-string tokens to form the full text, but it may require ~2 seconds\
    \ of 16 kHz single-channel audio, or an array of 32,000 float32 numbers to encode\
    \ the speech signal. Depending on the words in the text, a sentence containing\
    \ only four words may correspond to audios made up of either several thousands\
    \ or tens of thousands of float32 values (“I love machine learning” vs. “How to\
    \ pronounce Supercalifragilisticexpialidocious”); and depending on the speaker,"
