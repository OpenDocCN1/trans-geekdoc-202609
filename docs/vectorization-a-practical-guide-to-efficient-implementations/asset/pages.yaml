  md: 'the same sentence “I love machine learning” may be spoken under a second, or
    stretched over tens of seconds (e.g. “I looooooooooove machine learniiiiiiiiing”).
    This is the so-called many-to-many mapping problem.


    FastSpeech2 proposed the Length Regulator module to solve the many-to-many mapping
    problem. During training time, tokens of the text are passed through the embedding
    layer which encodes the words in the sentence as a sequence of embedding vectors,
    forming the tensor [batch_size, seq_len, emb_size], where seq_len here can be
    a variable sequence size and is the length of the longest sentence in the batch.
    The corresponding speech audio signals (1D vectors) are converted into 2D mel-spectrograms
    via Fourier Transform, forming a tensor of [batch_size, time_length, num_channels],
    where time_length here can be variable and is the length of the longest audio
    in the batch, measured as the number of time steps or frames of the temporal domain
    of the mel-spectrogram. It is easy to observe that seq_len != time_length. However,
    we have the following observations on the TTS data:


    +   1. Each word is pronounced one after another.

    +   2. Each word takes a certain amount of time to pronounce with durations independent
    of each other.

    +   3. The sum of the time to pronounce all the words in a sequence should equal
    to the final audio length.


    ![](img/e891acaacd4fb5b80dab2ed824618203_193_0.png)


