    12

    13 def apply_rotary_position_encoding(phi, x):

    14  """

    15  Apply rotary positional encoding

    16  """

    17  x has (batch_size, seq_len, <num_heads>, emb_size)

    18  phi has shape (max_seq_len, emb_size)

