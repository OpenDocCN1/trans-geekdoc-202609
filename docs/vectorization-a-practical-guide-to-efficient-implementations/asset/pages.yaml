  md: 'computing depending on the specified runner type. In this small example, since
    we are running using `DirectRunner`, Beam assumes this is running on a single
    machine, so it will find the opportunity to use multiprocessing whenever appropriate.
    But, if we run the pipeline on a distributed environment such as Apache Flink
    or Apache Spark, Beam will use multiworker processing, while each worker will
    then also use multiprocessing if multiple cores are also available on each worker.
    This small technical detail, however, should not prevent us from understanding
    how MapReduce works in a distributed, parallel environment.


    +   Line 12 starts the context of the Beam pipeline, with the options we specified.


    +   Lines 14–22 initialize the pipeline by creating some mock documents. In this
    small example, we assume we have four documents. Each document contains words
    separated by spaces.


