    # 2.11 Broadcasting


    **Broadcasting** is an element-wise operation on a pair of tensors of different
    dimensions [Harris et al., 2023c]. The tensor of the lower dimension is as if
    repeated many times to match the size of the higher dimensional tensor. For a
    simple example, a scalar (0-dimensional tensor) and a vector (1D tensor) can be
