- pgno: 412
  md: "```\nimport torch\ndef rotary_positional_encoding(emb_size, seq_len) :\n  \
    \  pos = torch.arange(seq_len) .unsqueeze(1)\n    depths = torch.arange(emb_size//2)\
    \ .unsqueeze(0)\n    theta = 10000 ** (-2*depths/emb_size)\n    p_theta = theta\
    \ * pos\n    # Construct empty R matrix (1, d, d)\n    R = torch.zeros(seq_len,\
    \ emb_size, emb_size)\n    # Fill the R matrix\n    depths_0 = torch.arange(0,\
    \ emb_size, 2)\n    depths_1 = torch.arange(1, emb_size, 2)\n    # Computing rotations\n\
    \    R[:, depths_0, depths_0] = torch.cos(p_theta, depths_0)\n    R[:, depths_1,\
    \ depths_1] = R[:, depths_0, depths_0]\n    R[:, depths_0, depths_1] = -torch.sin(p_theta)\n\
    \    R[:, depths_1, depths_0] = -R[:, depths_0, depths_1]\n    return R\n```\n\
    \n+   • Lines 4–7 compute \\(p\\theta\\) based on Equation 11.5.\n+   • Line 9\
    \ initializes the placeholder tensor for the rotation matrix output.\n+   • Lines\
    \ 11–12 determine the positions to insert the sine and cosine values. Specifically,\
    \ each block \\(i\\) has four positions, which are \\((i, i)\\) for cos, \\((i,\
    \ i+1)\\) for \\(-\\sin\\), \\((i+1, i)\\) for sin, and \\((i+1, i+1)\\) for cos.\n\
    +   • Lines 14–17 insert the sine and cosine values based on the positions.\n\n\
    We can visualize the first nine slices of the rotation matrix, given a sequence\
    \ length of 500 and embedding size of 64 in Figure 11.7.\n\nAlthough we can simply\
    \ multiply together the rotation matrix with the input sequence of embedding based\
    \ on the vanilla formulation, the sparsity of the matrix \\(R\\) suggests that\
    \ there may be a more efficient way to formulate the encoding mechanism. The open-source\
    \ repository for LLaMA from Meta implements a rather smart reformulation of rotary\
    \ positional embedding [Facebook Research, 2023]. It can be seen that the matrix\
    \ \\(R\\) is a block-diagonal matrix, where each block is a size of \\(2 \\times\
    \ 2\\) rotation matrix. This means when multiplying together with the embedding\
    \ sequence vector \\(X\\), each rotation block at the position \\(p\\), embedding\
    \ positions \\(k\\) and \\(k+1\\) is only multiplied with a pair of values along\
    \ the same position \\(p\\) and embedding positions \\(k\\) and \\(k+1\\) (see\
    \ Figure 11.8 for illustration). We can denote the pair at embedding positions\
    \ \\(k\\) and \\(k+1\\) as group \\(i\\), which corresponds to the index \\(i\\\
    ) for each \\(\\theta\\) in Equation 11.5. Then, we can write the multiplication\
    \ within each group \\((p, i)\\) as\n\n> \\[ \\begin{bmatrix} \\cos(p\\theta_i)\
    \ & -\\sin(p\\theta_i) \\\\ \\sin(p\\theta) & \\cos(p\\theta) \\end{bmatrix} \\\
    begin{bmatrix} x_1^{(i)} \\\\ x_2^{(i)} \\end{bmatrix} = \\begin{bmatrix} x_1^{(i)}\
    \ \\cos(p\\theta_i) - x_2^{(i)} \\sin(p\\theta_i) \\\\ x_1^{(i)} \\sin(p\\theta_i)\
    \ + x_2^{(i)} \\cos(p\\theta_i) \\end{bmatrix} \\quad (11.6) \\]"
