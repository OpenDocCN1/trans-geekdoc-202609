    # 6.5 Case Study: Factorization Machine


    Factorization Machine (FM), proposed by Steffen Rendle in 2010 [Rendle, 2010],
    is a supervised machine learning algorithm that can be used for classification,
    regression, and ranking tasks. It is a combination of linear regression and matrix
    factorization. It also uses a polynomial kernel. Thus, FM is an extension of basic
    matrix factorization, since it can model not only user and item ids as inputs
    but'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'also contextual features such as item attributes, user characteristics, and
    user behavior contexts. FM is used as a strong baseline model in building recommendation
    engines in e-commerce, media streaming, and advertising industries. The strengths
    of FM are:


    +   1. It can model d-way feature interaction, where d is the order of polynomial,
    i.e. typically set to d = 2.

    +   2. A fast optimization algorithm for FM can reduce polynomial computation
    time to linear complexity.


    Let''s first examine the mathematical formulation of FM.


    # 6.5.1 Factorization Machine Model


    Let x ∈ R^n denote a d-dimensional feature vector of a sample, and y denote the
    label data, which can be real values (in regression models) or class labels. The
    model for a Factorization Machine of degree 2 is


    ```

    ŷ(x) = w₀ + Σ(wᵢxᵢ) + ΣΣ⟨vᵢ, vⱼ⟩xᵢxⱼ

    ```


    where


    +   • w₀ ∈ R is the global mean

    +   • wᵢ ∈ Rⁿ is the weights of the ith feature

    +   • V ∈ Rⁿˣᵏ represents the feature embeddings

    +   • vᵢ represents the ith row of V

    +   • k is the number of latent factors

    +   • ⟨·, ·⟩ is the dot product between two vectors. Thus, ⟨vᵢ, vⱼ⟩ models feature
    interactions


    The third term is the feature interaction term. Notice that we are modeling interactions
    for j > i. Although FM can be generalized to higher orders than order 2, the numerical
    stability is not great. The generalization to d-way FM is


    ```

    ŷ(x) = w₀ + Σwᵢxᵢ + ΣΣ...Σ(Πxᵢⱼ)(ΠΠv⁽ˡ⁾ᵢⱼ,𝒇)

    ```


    with time complexity O(knᵈ), where


    +   • l is the index of the interactions, from 2 to d

    +   • f is the index of latent factors, from 1 to kₗ


    # 6.5.2 More Efficient Optimization Criterion


    The third term adds a nonlinearity to the model, but it is the difficult part
    for optimization (O(kn²), n² since all pair-wise interactions of features have
    to be'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'computed, and the length of the latent factors is \( k \)). Rearrangement of
    the third term can reduce the time complexity to \( O(kn) \), which is linear.


    \(\sum_{i=1}^n \sum_{j=i+1}^n \langle \mathbf{v}_i, \mathbf{v}_j \rangle x_i x_j\)

    \(= \frac{1}{2} \sum_{i=1}^n \sum_{j=i+1}^n \langle \mathbf{v}_i, \mathbf{v}_j
    \rangle x_i x_j - \frac{1}{2} \sum_{i=1}^n \langle \mathbf{v}_i, \mathbf{v}_i
    \rangle x_i x_i \text{ (upper triangle – diagonal entry)}\)

    \(= \frac{1}{2} \left( \sum_{i=1}^n \sum_{j=1}^n \sum_{f=1}^k v_{i,f} v_{j,f}
    x_i x_j - \sum_{i=1}^n \sum_{f=1}^k v_{i,f} v_{i,f} x_i x_i \right) \text{ (expanding
    the dot product)}\)

    \(= \frac{1}{2} \sum_{f=1}^k \left( \left( \sum_{i=1}^n v_{i,f} x_i \right) \left(
    \sum_{j=1}^n v_{j,f} x_j \right) - \sum_{i=1}^n v_{i,f}^2 x_i^2 \right) \text{
    (factor out the feature summation)}\)

    \(= \frac{1}{2} \sum_{f=1}^k \left( \left( \sum_{i=1}^n v_{i,f} x_i \right)^2
    - \sum_{i=1}^n v_{i,f}^2 x_i^2 \right)\)


    For sparse features, only nonzero elements need to be computed so that the overall
    complexity is linear to the number of nonzero features.


    The final model can be written as


    \(\hat{y}(x) = w_0 + \sum_{i=1}^n w_i x_i + \frac{1}{2} \sum_{f=1}^k \left( \left(
    \sum_{i=1}^n v_{i,f} x_i \right)^2 - \sum_{i=1}^n v_{i,f}^2 x_i^2 \right) \quad
    (6.1)\)


