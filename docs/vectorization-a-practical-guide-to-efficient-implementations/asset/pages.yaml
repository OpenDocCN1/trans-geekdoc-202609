    applying the word splitting function to each document and then flat the results.
    So instead of returning the list of lists, it returns a flattened list.


    +   Line 26 performs the classic Map step of MapReduce, where it creates the tuple
    `(word, 1)` for each word in the flattened list. This is often described as the
    `<key, value>` map format, where the word is the key and the static value `1`
    is the value.


    +   Line 28 performs the classic Reduce step of the MapReduce, where it aggregates
    the tuples from the previous step by each key, summing together the values. This
    is equivalent to `.groupby (...).sum ()` operations in `pandas.DataFrame`.


