  md: '![](img/e891acaacd4fb5b80dab2ed824618203_128_0.png)


    ```

    import tensorflow as tf

    values = tf.random.uniform((2, 3, 4))

    indices = tf.constant([3, 0])[: , None]

    X = tf.scatter_nd(indices, values, shape=(5, 3, 4))

    ```


    In general, we can split the final target tensor shape into two parts: leading
    batch dimensions and lagging slice dimensions (Tensorflow''s documentation also
    calls these outer dimensions and inner dimensions, respectively [Abadi et al.,
    2023d]). In the above example, the target tensor has a shape of (5, 3, 4), with
    the batch dimension as (5,) and slice dimension as (3, 4). We can observe that
    (i) the size of the first dimension (batch dimension) of values (used for updating
    the target tensor) is the same as the size of the first dimension of the indices;
    (ii) the size of the last two dimensions of the values are the same as the last
    two dimensions of the target tensor X; (iii) the size of the last dimension of
    the indices indicates how many dimensions the slices should have. By inductive
    reasoning, we can attempt an even more general example, where we want to rearrange
    the list of slices into multi-dimensional batches within the target tensor, as
    illustrated in Figure 3.18. The concept of scattering slices also applies to NumPy''s
    np.ufunc.at and PyTorch''s torch.index_put, with exactly the same behavior.


    ```

    import tensorflow as tf

    values = tf.random.uniform((2, 3, 4))

    indices = tf.constant([[1, 0], [0, 1]]) # (2, 2)

    X = tf.scatter_nd(indices, values, shape=(2, 2, 3, 4))

    ```


    Tensorflow''s tf.scatter_nd further generalizes the concept of batching, where
    the batch dimensions of the values and indices can also be arranged into multiple
    dimensions rather than staying as a flat list of slices or indices.'
