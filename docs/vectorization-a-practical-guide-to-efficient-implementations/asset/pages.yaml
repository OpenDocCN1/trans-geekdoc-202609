  md: '# 8 Jagged Tensors


    In various machine learning applications, we may sometimes need to deal with a
    batch of sequences that vary in length. For example, in natural language processing,
    sentences, paragraphs, or documents can contain a variable number of tokens. In
    audio processing, sample clips may come in variable durations. In recommendation
    systems, users'' sequence of catalog interaction events may also vary in size.
    As we have already seen in Chapter 5, padding with dummy values within a dense
    tensor is a good way to represent sequences of variable lengths. These tensors
    still have a typical shape, where each entry along a certain dimension has exactly
    the same number of elements. For example, a matrix of shape `(4 , 5)` has four
    rows, and each row has uniformly five elements. If we eliminate the padding entries
    toward the end of the sequence, and then examine the shape of the tensor, we can
    no longer confidently say that each entry along the dimension has the same number
    of elements. This tensor without the padding entries has therefore become a so-called
    **Jagged Tensor** or a **Ragged Tensor**, whose non-uniform dimension is the jagged
    dimension, and its shape is usually denoted by `None`. For example, a jagged matrix
    with four rows of data has the shape `(4 , None)` .


    A jagged tensor differs from a sparse tensor in that the paddings or empty entries
    of a jagged tensor always occur at the end of the sequence along the jagged dimension,
    whereas a sparse tensor can have empty entries occurring anywhere within the sequence
    while having a concrete shape (rather than using `None` to represent the jagged
    dimension). It can be seen that a sparse tensor is a more general representation
    of a tensor with padding/filler values. Therefore, we can also use a sparse tensor
    to represent a jagged tensor. See Figure 8.1 for an illustration of the three
    ways of representing jagged tensors.'
