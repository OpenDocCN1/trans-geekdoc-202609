    Pandas is to use `pd.Categorical` dtype to represent the feature column. We

    can create a Pandas DataFrame with a categorical column as the following:


    ```

    1 import pandas as pd

    2 df = pd.DataFrame({

    3 "user_id": pd.Series([1, 2, 3, 4, 5, 6], dtype=int),

    4 "age": pd.Series([

    5 "18-25", "65+", "26-30", "30-40", "40-50", "50-65"

    ```'
