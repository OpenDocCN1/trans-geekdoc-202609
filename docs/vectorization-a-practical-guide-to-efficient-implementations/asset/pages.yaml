    # 10.5 Case Study: Gumbel-Max Sampling with Weights


    When training a multi-class classification algorithm, we activate the final layer,
    whose output we denote as \(\theta\), with a softmax function to obtain the probabilities
    of each class,


    \(p_i = \text{softmax}(\theta_i) = \frac{e^{\theta_i}}{\sum_j^N e^{\theta_j}}\)


    where we denote \(p_i\) as the probability of the class \(i\); \(N\) is the number
    of classes; \(\theta_i\) as the unactivated final layer output for class \(i\),
    which is often referred to as the logit value of the class. By inverting the softmax
    function, we can compute the logit value from the probability as


    \(\theta_i = \log \left( p_i \sum_j^N e^{\theta_j} \right) = \log(p_i) + \log(C)
    = \log(p_i) + C\)


    where \(C\) denotes some constants which we can ignore later on.


    In certain areas like recommendation systems and object detection in which the
    problems are often formulated as multi-class or multi-label classifications, it
    is common to see negative classes outnumbering the positive ones. The overwhelming
    number of negative classes can also reduce training efficiency. A way to tackle
    this is by selecting a set number of negative classes via random sampling. On
    the other hand, the distribution of positive labels may skew toward those more
    popular classes. These factors can lead to class imbalance and a model bias toward
    the more generic classes. To mitigate class imbalance, a viable solution could
    be reducing the number of negative label classes in the training data by sampling.
    The sampling can favor more generic classes, making them appear more frequently
    as negative labels whenever appropriate. This strategy, in turn, would make the
    tail-end classes show up as negative labels less frequently,'
  merge: -1
  img_proc: true
- pgno: 380
  md: 'thus, motivating the model to learn to predict these less generic classes more
    effectively. To achieve these goals, we need to implement a sampling without replacement
    strategy; to achieve these goals efficiently with vectorization, we need to rely
    on one-pass rather than iterative algorithms for sampling. Hence, our discussion
    on the Gumbel-Max trick [Huijben et al., 2022] in this section.


    Gumbel distribution has the probability density function (PDF) and cumulative
    density function (CDF) as


    \(\text{PDF}_{\text{Gumbel}}(x; \mu, \beta) = \frac{1}{\beta} e^{-\frac{x-\mu}{\beta}}
    e^{-\frac{x-\mu}{\beta}}\)


    \(\text{CDF}_{\text{Gumbel}}(x; \mu, \beta) = e^{-e^{-\frac{x-\mu}{\beta}}}\)


    The standard Gumbel distribution is obtained by setting \(\mu = 0, \beta = 1\),
    and the PDF and CDF become


    \(\text{PDF}_{\text{Gumbel}}(x; 0; 1) = e^{-x-e^{-x}}\)


    \(\text{CDF}_{\text{Gumbel}}(x; 0; 1) = e^{-e^{-x}}\)


    Let \(G\) denotes a sample obtained from the standard Gumbel distribution. The
    Gumbel-Max trick suggests that to sample from the softmax distribution whose unactivated
    logits are denoted by \(\theta_i\), we can first obtain the index \(I\) of the
    sample among the \(N\) classes using


    \(I = \text{argmax}_{i \in \{1, ..., N\}} (\theta_i + G^{(i)})\) (10.1)


    where the term inside the parentheses is often called perturbed logits. Since
    we can predetermine how we want to sample (e.g. popularity based or simply random
    uniform), we can designate the probability of each class \(p_i\). Therefore, we
    can rewrite Equation 10.1 in terms of \(p_i\),


    \(I = \text{argmax}_{i \in \{1, ..., N\}} (\theta_i + G^{(i)}) = \text{argmax}_{i
    \in \{1, ..., N\}} (\log(p_i) + C + G^{(i)})\) (10.2)


    where \(C\) is the normalizing constant. However, \(C\) does not impact the order
    of the perturbed logits term since it simply shifts the values for all classes
    by the same value. We can, therefore, drop the term, and obtain


    \(I = \text{argmax}_{i \in \{1, ..., N\}} (\log(p_i) + G^{(i)})\) (10.3)


    To sample \(G^{(i)}\) for each class \(i\), we use the inverse transform sampling
    technique. This is done by first sampling from the uniform distribution \(y \sim
    U(0, 1)\), and then using the inverse cumulative distribution function (ICDF)
    to compute the sample value. The ICDF of the standard Gumbel distribution is


    \(\text{CDF}_{\text{Gumbel}}^{-1}(y) = -\log(-\log y)\) (10.4)'
