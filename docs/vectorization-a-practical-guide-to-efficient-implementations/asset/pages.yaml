    ```python

    Y = X

    # modify X

    X[3] = 100

    # print

    print(X) # array([1, 2, 3, 100])

    print(Y) # array([1, 2, 3, 100])

    ```

    ```


    We will observe that both X and Y are modified, even though we only performed
    the assignment operation on X.


    In addition to modifying values, we can also perform in-place value accumulations
    using Python''s <operator>= syntaxes, as listed in Table 3.4:


    | Accumulation Operation | In-place Operator | Equivalent Expression |

    |---|---|---|

    | Addition | += | x[index] += y ⟺ x[index] = x[index] + y |

    | Subtraction | -= | x[index] -= y ⟺ x[index] = x[index] - y |

    | Multiplication | *= | x[index] *= y ⟺ x[index] = x[index] * y |

    | Division | /= | x[index] /= y ⟺ x[index] = x[index] / y |

    | Integer division | //= | x[index] //= y ⟺ x[index] = x[index] // y |

    | Modulus | %= | x[index] %= y ⟺ x[index] = x[index] % y |

    | Exponentiation | **= | x[index] **= y ⟺ x[index] = x[index] ** y |


    As a quick example:


    ```

    ```python

    import numpy as np

    X = np.array([1, 2, 3, 4])

    X[3] += 5

    print(X) # array([1, 2, 3, 9])

    ```

    ```


    For multi-dimensional arrays, we may use multi-index to reference the element
    and assign the values at the index.


    ```

    ```python

    import numpy as np

    X = np.arange(20).reshape(4, 5)

    X[3, 2] -= 20 # 17 -> -3

    print(X)

    # array([[ 0, 1, 2, 3, 4],

    ```

    ```'
