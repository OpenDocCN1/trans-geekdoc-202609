  md: '# 2.9 Concatenation, Stacking, and Splitting


    Tensors can be constructed by combining with other tensors or by splitting larger
    tensors into smaller tensors. Table 2.9 lists functions to perform tensor combination
    and splitting operations along various dimensions.


    # 2.10 Reshaping


    Reshaping operations keep the underlying data of the tensor identical to the inputs
    but represent the tensor in a different format. Being able to trace the evolution
    of the tensor shapes through a computational graph is probably one of the most
    important skills to master before being able to successfully implement a deep
    learning algorithm. Oftentimes, the outputs of a previous operation may not be
    directly usable in the subsequent operations. For example, a feed-forward layer
    may output an array of 9 elements, but the subsequent operation requires us to
    take an average of 3 groups of 3 elements. One way we can implement this is by
    reshaping the 1D array of 9 elements into a two-dimensional, 3 × 3 matrix,


    Table 2.9 List of adjacent element cumulative sum and discrete differences tensor
    operations in Python, NumPy, Tensorflow, and PyTorch.


    | Operation | Python | NumPy | Tensorflow | PyTorch |

    |---|---|---|---|---|

    | concatenate^a) | + (list .__add__) | np.concatenate | tf.concat | torch.cat
    |

    | stacking^a) | N/A | np.stack | tf.stack | torch.stack |

    | row stacking^b) | N/A | np.vstack, np.row_stack | N/A | torch.vstack, torch.row_stack
    |

    | column stacking^b) | N/A | np.hstack, np.column_stack | N/A | torch.hstack,
    torch.column_stack |

    | Depth stacking^b) | N/A | np.dstack | N/A | torch.dstack |


    Notes:

    a) Concatenation is sometimes similar to stacking. However, concatenation will
    always combine the tensors along existing axes and will throw an error if the
    axis does not exist. In contrast, stacking will combine the tensors along either
    an existing or a new axis and will change the dimensions of the tensors sometimes.
    When operating on 1D vectors, the horizontal stack operation (hstack) is identical
    to the concatenation (concatenate). Figure 2.1 illustrates the concatenation and
    stacking operations on 1D vectors. When operating on higher dimensions matrices
    or tensors, stacking can act similarly to concatenation. For example, vstack is
    equivalent to concatenating along the 1st axis (concatenate(..., axis=0)) while
    hstack is equivalent to concatenating along the second axis (concatenate(...,
    axis=1)) dstack will stack along the third dimension (and will create it if not
    already existing). Figure 2.2 illustrates the concatenation and stacking operations
    when applied to a 2D matrix.

    b) row_stack or vstack always stacks the tensors along the first dimension, equivalent
    to stack(..., axis=0); column_stack or hstack always stacks the tensors along
    the second dimension, equivalent to stack(..., axis=1); dstack always stacks the
    tensors along the third dimension, equivalent to stack(..., axis=2).'
