  md: '# # 10.6 Case Study: Sorting Articles Around Anchored Advertisements


    Suppose we created a website that recommends news articles to readers. To monetize
    our website, we would like to insert some advertisements among the news articles
    that we recommend. Figure 10.8 illustrates the effect we would like to achieve.
    Our imaginary product manager has set the following requirements for the illustrated
    effect:


    +   1. Anchored ads may occur at any position. This could be an output from a
    separate machine learning model.

    +   2. The number of anchored ads may differ between each user.

    +   3. News articles need to be sorted based on the priority scores for each item.

    +   4. Separately, ads also need to be sorted based on their own priority scores,
    independent of the scoring of the news.

    +   5. Ads can only occur in the prespecified anchor positions, while the news
    can only occur in the rest of the free positions.

    +   6. The final output should display up to eight news contents including both
    ads and news, even though we may be provided more news and ads to sort. We also
    assume that there is always enough content to make up eight total displayable
    items.


    The following code block implements a vectorized operation to rearrange the news
    and ads among each other. The general strategy is to sort news and ads separately
    based on their respective priority scores and then rearrange the two pieces into
    the same matrix, using masking and gathering.


    ![](img/e891acaacd4fb5b80dab2ed824618203_388_0.png)


    **Figure 10.8** Illustration of arranging news articles around anchored ads.'
  merge: -1
  img_proc: true
