    \ vector that contains only 0s and 1s. When converting to the indicator notations,\
    \ we need two tensors created, one that stores the indices of the items, and one\
    \ that stores the weights at the corresponding entry, i.e.\n\n$s = [1, 2]$\n\n\
    $v = [1.3, 2.7]$\n\nLet us realize Equation 8.3 in Tensorflow,\n\n```\nimport\
