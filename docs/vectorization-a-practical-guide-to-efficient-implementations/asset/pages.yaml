    )\n```\n\ntf.gather can also be used like `np.take_along_axis` (as well as `torch.take_along_dims`)\
    \ to vectorize the gathering of elements over batches by specifying `batch_dims`\
    \ to a value greater than 0. The difference though is that `tf.gather` only allows\
    \ batching at the initial dimensions whereas `np.take_along_axis` allows the batch\
    \ dimensions at arbitrary dimensions. For instance,\n\n```\nimport numpy as np\n\
    import tensorflow as tf\nimport torch\nX = np.random.randint(0, 10, size=(4, 3,\
    \ 5))\nreorder_index = np.random.randint(0, 5, size=(4, 3, 5))\ny_np = np.take_along_axis(X,\
