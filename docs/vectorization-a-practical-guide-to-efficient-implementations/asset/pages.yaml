    | log base 10 | math.log10 | np.log10 | N/A^b) | torch.log10 |

    | log(1 + x)^b) | math.log1p | np.log1p | tf.math.log1p | torch.log1p |

    | log(exp(x_1) + exp(x_2))^b) | math.logaddexp | np.logaddexp | tf.experimental.numpy.logaddexp
    | torch.logaddexp |

    | log(sum(exp(x)))!) | N/A | scipy.special.logsumexp | tf.math.reduce_logsumexp
    | torch.logsumexp |


    Notes:

    a) NumPy does not implement a safe divide operation, but one can use np.divide(a,
