  md: "Gaussian error linear unit (GELU) [Hendrycks and Gimpel, 2016], Mish [Misra,\
    \ 2020], sigmoid linear unit (SiLU) [Hendrycks and Gimpel, 2016], and Swish [Ramachandran\
    \ et al., 2017]. Their mathematical formulations are as follows:\n\nReLU(x) =\
    \ max (x, 0)\n\nELU(x) = \\left\\{ \\begin{array}{ll} \\alpha \\exp(x) - 1 & \\\
    text{if } x \\le 0 \\\\ x & \\text{if } x > 0 \\end{array} \\right.\n\nGELU(x)\
    \ = x \\cdot \\frac{1}{2} \\left[ 1 + \\text{erf}(x/\\sqrt{2}) \\right]\n\nMish(x)\
    \ = x \\cdot \\tanh(\\text{softplus}(x)) = x \\cdot \\tanh(\\log(\\exp(x) + 1))\n\
    \nSiLU(x) = x\\sigma(x)\n\nSwish_\\beta(x) = x\\sigma(\\beta x)\n\nNotice that\
    \ Swish_{\\beta=1}(x) \\equiv \\text{SiLU}(x).\n\nThe following code block implements\
    \ these activation functions. Figure 11.9 illustrates several variants of activation\
    \ functions.\n\n```\nimport math\nimport torch\nimport torch.nn.functional as\
    \ F\n\ndef relu(x):\n    return torch.clamp(x, 0)\n\ndef elu(x, alpha=1.0):\n\
    \    return torch.where(x > 0, x, alpha * torch.exp(x) - 1)\n\ndef gelu(x):\n\
    \    return x * 0.5 * (1 + torch.erf(x / math.sqr(2.0)))\n\ndef mish(x):\n   \
    \ return x * torch.tanh(F.softplus(x))\n\ndef swish(x, beta=1):\n    return x\
    \ * torch.sigmoid(beta * x)\n```\n\nOthers have attempted to reformulate the linear\
    \ layer completely to unlock more learning power. Specifically, linear gated units\
    \ (GLUs) pass the input through two learnable dense layers and activate one with\
    \ a nonlinear activation function, then multiply together with the other linear\
    \ unit to generate the activated output. GLU is formulated as the following:\n\
    \nGLU(x, W, V, b, c) = \\sigma(xW + b) \\otimes (xV + c)"
