    # Singly Even Order Magic Squares


    Lastly, we will construct singly even order magic squares via the "LUX" method
    due to John Horton Conway [Erickson, 2009; Weisstein, 2023]. Through its implementation
    in NumPy, I am hoping the readers of the book can appreciate the efficiency and
    power of this library in handling complex data manipulations. "LUX" is referring
    to the order of filling out a 2 × 2 grid, as illustrated in Figure 2.15. The three
    variants of filling order form the shape of "L," "U," and "X," respectively. Let
    n = 2m = 2(2k + 1), where k ≥ 1, then,


    +   1. Starting with an odd-order square matrix m × m, we can determine what shape
    to fill for each of the grids that represents a 2 × 2 block:

    +      • Fill k rows of the matrix with L shapes.

    +      • Fill the k + 1th row with L shapes, except the middle one with an U shape.

    +      • Fill the k + 2th row with U shapes, except the middle one with an L shape.

    +      • Fill the rest of the rows (if any left) with X shapes

    +   2. The order of the numbers to be filled is determined by the Siamese method,
    which starts at the top-center grid as the first block to fill. We can derive
    the mapping between the values in the Siamese odd-order magic matrix and the values
    within the 2 × 2 matrix to be filled by "LUX" as u = 4(v − 1) + i, where v is
    the corresponding Siamese odd order magic square and i is the indexed value of
    the 2 × 2 block determined by one of the three variants of the filling order.'
