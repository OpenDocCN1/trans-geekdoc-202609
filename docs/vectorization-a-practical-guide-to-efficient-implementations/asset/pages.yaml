    to


    +   - tf.math.unsorted_segment_sum: This operation does not assume the values
    of the same segments are adjacent to each other. That is, the elements of each
    segment can be scattered around. The integer values can be skipped to create 0
    entries between the segments with lengths greater than 0; it can also create 0-length
    entries as the last segments by specifying the num_segments argument. Negative
    segment ids will be ignored. PyTorch''s scatter_reduce operation can be viewed
    as the equivalent operation to


    +   - tf.sparse.segment_sum: The previous two operations require the number of
    segment ids to be equal to the number of elements in the first dimension of the
    data input. This operation takes an additional argument indices, which is paired
