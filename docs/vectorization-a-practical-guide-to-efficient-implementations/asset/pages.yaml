  md: "These three helper functions were introduced at the beginning of the chapter\
    \ and will allow us to update our parameters more efficiently on the sparse matrix.\
    \ To recap,\n\n+   • multiply_U_W performs a sparse matrix multiplication between\
    \ the two dense matrices U and W^T, but it will skip entries where R is missing.\
    \ We therefore can use this function to skip the predictions of the missing values\
    \ during training.\n+   • R_plus_cv is a broadcasting operation on the sparse\
    \ matrix R, where we add a constant value to each row of the sparse matrix given\
    \ a column vector.\n+   • R_plus_rv is a broadcasting operation on the sparse\
    \ matrix R, where we add a constant value to each column of the sparse matrix\
    \ given a row vector.\n\nRecall that the final update rules for the four parameters,\
    \ u_i, w_j, b_i, c_j, are the following:\n\n\\bar{u}_i := \\sum_{j \\in \\Psi_i}\
    \ (r_{ij} - b_i - c_j - \\mu)\\bar{w}_j \\left( \\sum_{j \\in \\Psi_i} \\bar{w}_j^T\
    \ \\bar{w}_j + \\lambda I \\right)^{-1} \\qquad (7.1)\n\\bar{w}_j := \\sum_{i\
    \ \\in \\Omega_j} (r_{ij} - b_i - c_j - \\mu)\\bar{u}_i \\left( \\sum_{i \\in\
    \ \\Omega_j} \\bar{u}_i^T \\bar{u}_i + \\lambda I \\right)^{-1} \\qquad (7.2)\n\
    b_i := \\frac{1}{|\\Psi_i| + \\lambda} \\sum_{j \\in \\Psi_i} (r_{ij} - \\bar{u}_i\
    \ \\cdot \\bar{w}_j^T - c_j - \\mu) \\qquad (7.3)\nc_j := \\frac{1}{|\\Omega_j|\
    \ + \\lambda} \\sum_{i \\in \\Omega_j} (r_{ij} - \\bar{u}_i \\cdot \\bar{w}_j^T\
    \ - b_i - \\mu) \\qquad (7.4)\n\nLet's now implement matrix factorization with\
    \ ALS in the following:\n\n```\ndef compute_prediction(U_W_prod, mu, b, c):\n\
    \    \"\"\"Computing predictions use the learned parameters.\"\"\"\n    R_hat\
    \ = U_W_prod.copy()  # csc\n    R_hat.data += mu  # add mu\n    R_hat = R_plus_cv(R_hat,\
    \ b)  # add b, of length N\n    R_hat = R_plus_rv(R_hat, c).tocsc()  # add c,\
    \ of length M\n    return R_hat\n\n\ndef compute_regularized_loss(R, R_hat, U,\
    \ W, b, c, l2_reg, total_card):\n    \"\"\"Compute mean squared loss with regularization.\"\
    \"\"\n    loss = ((R.data - R_hat.data) ** 2).sum() + l2_reg * (\n    np.sum(U**2)\
    \ + np.sum(W**2) + np.sum(b**2) + np.sum(c**2))\n    loss = loss / total_card\
    \  # mean squared error\n    return loss\n```"
