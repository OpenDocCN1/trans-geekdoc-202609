    # 1.3.3 Multiworker Distributed Computing


    In modern big data analytics, practitioners often need to process data ranging
    from anywhere between several gigabytes and hundreds of terabytes in size (and
    this is often only the compressed size on disk; the size of the data occupying
    the memory can be much larger). No single consumer-grade laptop or desktop computer
    can hold hundreds of gigabytes to terabytes of data in memory, nor is any single
    CPU or GPU fast enough to process this much data without the user waiting hours
    to days (well, at least no such powerful processing unit exists yet as I am writing
    this book). Data analysts, data scientists, and machine learning engineers instead
    rely on cloud technologies to host such a large amount of data on distributed
    file storage systems and process the data using distributed computing. The term
    “distributed” here simply means multiple machines are storing, accessing, and
    processing the data, whereas machines communicate with each other via networking.
    Figure 1.5 illustrates a multiworker distributed computing system.


    When dealing with the task of processing a large amount of data, a “divide and
    conquer” approach is key. The idea is if it takes 100 hours for a single computer
    to process our data, then 100 computers can finish the same task in about one
    hour. If we can somehow divide such a large amount of data into smaller pieces,'
  merge: -1
  img_proc: true
- pgno: 35
  md: "let each computing node processes that small piece of data, and finally aggregate\
    \ the results at the end from all the parallel workers, it can then greatly reduce\
    \ the physical (or wall) time we need to wait for our data processing task to\
    \ finish. In fact, this is the core idea behind MapReduce [Dean and Ghemawat,\
    \ 2008].\n\nA “Hello World” example often used to illustrate MapReduce is the\
    \ task of counting the number of occurrences of each word from a large body of\
    \ documents. In this example, we will use Apache Beam [Apache Foundation, 2023a]\
    \ to illustrate how to write a MapReduce algorithm for word count. We can install\
    \ apache-beam with pip install apache-beam (I am using apache-beam==2.49.0. Note\
    \ that Apache Beam currently does not support pandas >=2.0.0.[Apache Foundation,\
    \ 2023b] at the time of writing, so I am using pandas==1.5.3 in this example).\n\
    \n```\n```python\nimport apache_beam as beam\nfrom apache_beam.options.pipeline_options\
    \ import PipelineOptions\n\n# Setting up running environment\npipeline_args =\
    \ [\n    \"--job_name=word_count\",\n    \"--runner=DirectRunner\", # local runner\n\
    ]\npipeline_options = PipelineOptions(pipeline_args)\n\n# Run the beam pipeline\n\
    with beam.Pipeline(options=pipeline_options) as p:\n    _ = (\n        p\n   \
    \     # Creating the example document\n        # This can also be read from files\n\
    \        | \"Create texts\" >> beam.Create([\n            \"lorem ipsum dolor\
    \ sit amet\",\n            \"sit amet dolor lorem\",\n            \"ut enim ad\
    \ minim veniam\",\n            \"ut enim ad minim lorem\",\n        ])\n     \
    \   # Splitting the documents into words\n        | \"Split\" >> beam.FlatMap(lambda\
    \ x: x.split())\n        # Convert to a tuple (key, value) = (word, 1)\n     \
    \   | \"Pair with 1\" >> beam.Map(lambda x: (x, 1))\n        # Summing the value\
    \ by each key/word\n        | \"Count\" >> beam.CombinePerKey(sum)\n        #\
    \ Print the output\n        | \"Print\" >> beam.Map(print)\n    )\n```\n```\n\n\
    +   - Lines 1-2 import the apache-beam library and the `PipelineOptions` class\
    \ to configure the running environment.\n\n+   - Lines 5-9 set up the pipeline\
    \ running environment. Beam can automatically figure out when to use multithreading,\
    \ multiprocessing, or distributed"
