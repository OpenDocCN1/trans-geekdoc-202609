    1, ..., batch_size]. We then repeat each batch index by the sequence length. That
    way, we are assigning a batch index to each token embedding, which becomes [0,
    0, ..., 1, 1, ..., batch_size, batch_size, ...]. Finally, since each token embedding
    vector is repeated duration times (Line 60), we also repeat the batch index by
    that many times corresponding to each token. This should give us an array whose
    length is identical to the second dimension (axis=1) of hidden_states that we
    obtained from Line 60.


    +   * col_indices: This is the index of the time dimension, which is constructed
    by our helper function tf_ragged_range. For each'
