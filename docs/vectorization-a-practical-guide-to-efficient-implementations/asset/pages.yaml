    | Ones | [1] * n | np.ones | tf.ones | torch.ones |

    | Empty | [[]] * n | np.empty | tf.experimental.numpy.empty | torch.empty |

    | Full | [value] * n | np.full | tf.fill, tf.experimental.numpy.full | torch.full
    |

    | Random uniform | random.uniform | np.random.rand | tf.random.uniform | torch.rand
    |

    | Random normal | random.normal | np.random.randn | tf.random.normal | torch.randn
    |

    | Random int | random.randint | np.random.randint | tf.experimental.numpy.random.randint
    | torch.randint |

    | Range | range | np.arange | tf.range | torch.arange |

    | Linspace | N/A, use range | np.linspace | tf.linspace | torch.linspace |

    | Identity matrix | N/A | np.eye | tf.eye | torch.eye |

    | Diagonal matrix | N/A | np.diag | tf.linalg.diag | torch.diag |


    Note:

    a) Many of these tensor initializers have corresponding _like methods where the
    shape of the initialized tensor can be inferred from the shape of another provided
    tensor. These methods are convenient when trying to initialize tensors with the
    same shape as the existing tensors. In other scenarios, where a tensor''s shape
    may not be known until runtime, the _like methods allow the user to initialize
    the tensor dynamically by inferring its shape from the runtime result.

    • zeros: np.zeros_like, tf.zeros_like, torch.zeros_like

    • ones: np.ones_like, tf.ones_like, torch.ones_like

    • empty: np.empty_like, tf.experimental.numpy.empty_like, torch.empty_like

    • full: np.full_like, tf.experimental.numpy.full_like, torch.full_like

    • uniform: torch.rand_like

    • normal: torch.randn_like

    • randint: torch.randint_like

    b) Tensorflow implements an experimental NumPy module tf.experimental.numpy. Oftentimes,
    many NumPy operations equivalent or alternative to the Tensorflow operations (e.g.
    Full vs. fill) can be found in this module. This module does not include all NumPy
    operations; some operations have limited capabilities compared to NumPy (most
    likely due to the need for efficient graph tracing [Abadi et al., 2023a] in Tensorflow).'
