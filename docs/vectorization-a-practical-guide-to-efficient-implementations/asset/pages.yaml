    Notes:

    • **Start-end indices**: This is reminiscent of `car_matrix` `indptr` property
    from Scipy, where an array of ascending integer indices indicates the starts and
    ends of each segment along a flattened array. This also assumes the elements of
    the same group are adjacent to each other. When working with NumPy''s groupwise
    operations `np.ufunc.reduceat`, the value to the indices argument is an array
    of starting indices of each segment, signifying the slices to aggregate (this
    means, it does not have to be strictly monotonically increasing). It assumes the
    last segment starts from the last element of `indices` to the last element of
    the array, i.e. `data[indices[-1]:]`. `indices` here is also equivalent to `indptr[:-1]`
    which excludes the last element that denotes the end of the segment. Example usage:


    ```

    1

