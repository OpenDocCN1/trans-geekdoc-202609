    \nHence, `take_along_axis` is the vectorized version of `take` operation where\
    \ it parallelizes the process of element selections from 1D vectors across batches\
    \ (which may be arranged over multiple dimensions).\n\n# ### 3.4.3 Gather\n\n\
    The `gather` operation is an alternative implementation of `take` and `take_along_axis`\
    \ operations. Tensorflow and PyTorch implement the `gather` operation differently.\
    \ `tf.gather` always selects the elements or slices along a certain dimension,\
    \ specified by `axis`, which defaults to `None`. The value of `axis` is dependent\
    \ on another argument, `batch_dims` (the number of batch dimensions starting from\
    \ axis 0; this is not to specify which dimensions or axes are the batch dimensions),\
    \ which defaults to `0`. It is necessary that `axis >= batch_dims` and `batch_dims\
    \ <= index.ndim`. Despite the name, PyTorch's `torch.gather`, on the other hand,\
    \ selects only single elements at a time given each index instead of selecting\
    \ slices via broadcasting (i.e., `X` and `indices` do not broadcast). As a consequence,\
    \ the results of `torch.gather` have the same shape as `indices`. Also, like `np.take_along_axis`,\
    \ `torch.gather` requires the input `X` and `indices`"
