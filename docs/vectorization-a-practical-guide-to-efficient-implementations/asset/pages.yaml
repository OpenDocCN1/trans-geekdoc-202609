- pgno: 159
  md: '```

    is defined by:

    dH(A, B) = max(h(A, B), h(B, A)),

    where h(A, B) = max(min(d(a, b)))

    and d(a, b) is a L2 norm

    dist_H = hausdorff(A, B)

    A: First point sets (M1 x N, with M1 observations in N

    ~ dimension)

    B: Second point sets (M2 x N, with M2 observations in N

    ~ dimension)

    ** A and B may have different number of rows, but must

    ~ have the same

    number of columns.

    """

    # Find pairwise distance: (A - B)^2 = A^2 + B ^2 - 2AB

    A_sq = np.einsum(''ij,ij->i'', A, A)[:, None]

    B_sq = np.einsum(''ij,ij->i'', B, B)

    AB = np.dot(A, B.T)

    D_mat = A_sq + B_sq - 2 * AB

    D_mat = np.sqrt(D_mat)

    # Find DH

    d_AB = np.min(D_mat, axis=0)

    d_BA = np.min(D_mat, axis=1)

    dH = np.maximum(

    np.max(d_AB),

    np.max(d_BA)

    )

    return(dH)

    ```


    +   1. In Line 19, we can compute the \(A^2\) term as batchwise dot product for
    each row of \(A\) against itself using the einsum notation "ij, ij->i". Notice
    we want this to be a column vector by expanding the second dimension, making it
    shape \((n, 1)\) to facilitate later broadcasting.

    +   2. In Line 20, we similarly compute \(B^2\). This is a row vector and will
    be treated as shape \((1, m)\) implicitly during broadcasting in the later step.

    +   3. Line 21 implements the third term as a pair-wise dot product between combinations
    of rows of \(A\) and \(B\). This forms a matrix of shape \((n, m)\).

    +   4. Line 22 implements the pairwise distance by combining all three terms together
    via broadcasting. This forms a matrix of shape \((n, m)\).

    +   5. Line 23 takes the square root of the pair-wise distance matrix, resulting
    in the final Euclidean distance matrix \(D\).

    +   6. Lines 25 and 26 implement the \(d(A, B)\) and \(d(B, A)\) terms. Notice
    that we implement the asymmetric function by taking the minimum value along different
    dimensions of the matrix \(D\).

    +   7. Lines 27-30 implement the final Hausdorff distance formula.'
