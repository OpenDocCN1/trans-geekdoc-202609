    attend to not only the tokens coming before it (and itself) but also the tokens
    coming after it. This type of self-attention is implemented as part of the Encoder
    layers of the Transformer model, where all the contexts surrounding the current
    token help inform the model.

    +   - **Causal self-attention**: A single token within the sequence can only attend
    to the tokens coming before it (and itself). This type of self-attention is implemented
    as part of the Decoder layers of the Transformer model, where only the historical
    token sequences are used to predict the tokens coming next.


