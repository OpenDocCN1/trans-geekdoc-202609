    In this chapter, we will first examine the seven variants of sparse matrices implemented
    in the Scipy library. To help further advance our knowledge in practical machine
    learning implementations, we will also look briefly into the sparse data structure
    classes implemented by deep learning libraries such as Tensorflow and PyTorch.
