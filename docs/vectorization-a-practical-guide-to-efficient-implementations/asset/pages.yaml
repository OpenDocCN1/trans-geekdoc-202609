    You may notice that the first dimension of tensor Y is of size 3 but we are slicing
    four items. Yet, the program did not throw an error, and returned three items
    in the first dimension, less than the four items asked by the slice. In general,
    Python’s tensor slicing will take as many elements it can as possible; so if we
    specify the slice to take up to a `stop` index beyond the size of the tensor’s
