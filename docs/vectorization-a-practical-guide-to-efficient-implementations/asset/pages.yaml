- pgno: 157
  md: 'as if someone takes a picture of a bird flying away with a slow-speed shutter
    (and fMRI’s “shutter speed” is in the magnitude of seconds); the image of the
    bird would be very blurry. So, in one of our projects, we were trying to find
    a way to correct the effect of head movement during the scan [Cui et al., 2018].
    But, how can we track the head position in a dark environment inside the MRI machine?
    A smart engineer from our team thought of a simple way: we printed a pair of dark
    squares on a piece of white paper and fixed these fiducial markers on a pair of
    swimming goggles. Then, the patient undergoing the scan wore these goggles while
    an infrared camera took pictures of the fiducial markers. After collecting the
    data, we initially thought of using simple image processing steps like thresholding
    and segmentation to find the centroids of the pair of fiducial markers, and the
    mean position of the two centroids over time would form a time series of head
    positions relative to the starting position. However, due to lighting and patient
    head orientations, the image quality of the data collected was not always the
    best (see Figure 4.5, e.g. where images taken could be skewed and affected by
    lighting artifacts). Still, if a human being looked at the images, they could
    pinpoint the mean position of the fiducial marker very well. Nowadays, image segmentation
    and object tracking problems are mostly solved by deep-learning-based solutions.
    But, back in 2013, this was a pretty difficult problem to solve at scale. Probably
    due to my skill level at the time, despite trying many tools in MATLAB’s image
    processing library and Python’s OpenCV and Scipy, none of them helped us consistently
    track the positions of the markers (which we verified through visual inspections
    after processing the images through the algorithm).


    Therefore, I was tasked to determine a robust, alternate algorithm that would
    allow us to automate the process of accurately determining the mean position of
    the markers. My thought at the time was that we only needed to extract part of
    the image that would match the template just well enough, so that the lighting
    artifact or any noise in the image would be filtered out during the template-matching
    process. The template-matching process also needed to be robust enough so that


