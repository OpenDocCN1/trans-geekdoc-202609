    \ between tensor with singleton dimension and non-singleton dimensions.\n\nIn\
    \ general, a scalar (ndim=0) can always be broadcasted to any higher-dimensional\
    \ tensors. A lower dimensional tensor (ndims > 0) can be broadcasted to a higher\
    \ dimension tensor as long as the size of some or all trailing (right-aligned)\
    \ axes of the lower dimensional tensors is either a singleton (i.e. .shape[axis]=1)\
    \ or match the size of the higher dimensional tensors at the corresponding trailing\
    \ axes. To define this more concretely, suppose the lower dimensional tensor X\
    \ has shape (a1, a2, a3, ..., an), ai != 0, \\forall i and the higher dimensional\
    \ tensor Y has shape (b1, b2, ..., bm), bj != 0, \\forall j, where n <= m, then\
    \ for X to be broadcasted to Y, we necessarily need to have\n\n```\n{\n    a_n\
    \ \\in {b_m, 1},\n    a_{n-1} \\in {b_{m-1}, 1},\n    ...\n    a_{n-k} \\in {b_{m-k},\
    \ 1},\n    ...\n    a_1 \\in {b_{m-n+1}, 1}\n}\n```\n\nThe broadcasted operation\
    \ will result in a tensor Z of shape (c1, c2, ..., cm) that takes the larger size\
    \ of either X or Y, and the number of dimensions will be Y.ndim which is larger\
    \ than X.ndim. That is,\n\n```\n{\n    c_m = max(a_n, b_m)\n    c_{m-1} = max(a_{n-1},\
    \ b_{m-1})\n    ...\n    c_{n-k} = max(a_{n-k}, b_{m-k})\n    ...\n    c_{m-n+1}\
    \ = max(a_1, b_{m-n+1})\n    c_{m-n} = b_{m-n}\n    c_{m-n-1} = b_{m-n-1}\n  \
    \  ...\n    c_{m-n-p} = b_{m-n-p}\n    ...\n    c_1 = b_1\n}\n```"
