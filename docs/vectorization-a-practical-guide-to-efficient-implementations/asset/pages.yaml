  md: "tf.gather_nd support slice gathering using multi-index. For instance,\n\n```\n\
    ```python\nimport tensorflow as tf\nX = tf.random.uniform((4, 5, 6))\n# Multi-indexing\
    \ the first 2 dimensions,\n# using last dimension as the slice/block dimension\n\
    index = tf.constant([\n    [0, 3],\n    [1, 2],\n    [3, 0],\n    [2, 2],\n])\
    \ # (4, 2)\n\n# Gather 4 slices from the 3D tensor\ny = tf.gather_nd(X, index)\
    \ # (4, 6)\n```\n```\n\nindex.shape[1] number of leading dimensions in X is extracted\
    \ using the multi-index, and the remaining lagging dimensions are left as the\
    \ slice dimensions. If index.shape[1] == X.ndim, then 1D vectors are created by\
    \ extracting single elements from the input X. Otherwise, a (X.ndim - index.shape[1]\
    \ + 1)-dimensional tensor is created.\n\ntf.gather_nd can also be used to gather\
    \ slices arranged over a multi-dimensional batch.\n\n```\n```python\nimport tensorflow\
    \ as tf\nX = tf.random.uniform((2, 3, 5, 4))\nindex = tf.experimental.numpy.random.randint(\n\
    \    0, 4, (2, 3, 4, 2)\n)\n\nbatch_dims = 2\ny = tf.gather_nd(X, index, batch_dims=batch_dims)\n\
    ```\n```\n\nIn this example, we treat the first two dimensions of the index and\
    \ X as the batch dimensions. Then, for each location within the batch, we take\
    \ 4 of 2D points from each 5 x 4 matrix. See Figure 3.12 for an illustration.\n\
    \nTensorflow's documentation on tf.gather_nd [Abadi et al., 2023b] provides even\
    \ more examples. Readers are encouraged to study these examples carefully to understand\
    \ the operation even further.\n\ntf.gather_nd (as well as similar operations in\
    \ NumPy and PyTorch) that gathers elements at indices rather than entire slices\
    \ in a batch are quite useful for extracting heterogeneous regions of interests\
    \ (ROIs) from high-dimensional data, such as medical imaging (e.g. fMRI brain\
    \ structures) or video data (e.g. for moving objects), where sequences of 2D or\
    \ 3D images are organized over time."
