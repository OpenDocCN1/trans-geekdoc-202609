- pgno: 396
  md: '# 11


    # Building a Language Model from Scratch


    Throughout the book, we have illustrated examples of building deep learning models
    from scratch (e.g. Chapter 6, Case Study: Factorization Machine; Chapter 9 Case
    Study: Vision Transformer (ViT)). These solutions presented are the results of
    many years of research on the topic. In this chapter, let us follow the evolution
    of language modeling using the transformer architecture to illustrate how machine
    learning models, specifically, large language models (LLMs) like LLaMA (Large
    Language Model Meta AI), came to be. By the end of this chapter, I hope the readers
    can appreciate the large amount of effort dedicated to research in machine learning.


    # 11.1 Language Modeling with Transformer


    Prior to the introduction of the transformer architecture [Vaswani et al., 2017],
    deep learning-based natural language modeling has been relying on previously introduced
    sequence representation architectures such as recurrent neural networks (RNNs)
    and convolutional neural networks (CNNs). However, these architectures have a
    limitation: When learning from a long sequence of text/documents, they tend to
    remember only the most recently encountered tokens and forget those encountered
    earlier (e.g. the beginning of a paragraph). Deep learning researchers assess
    an architecture’s capability to learn from input signals using a metric called
    **receptive field** size, a concept borrowed from vision neuroscience. If a model
    can memorize and learn from a long sequence (in 1D sequence modeling) or a large
    area (in 2D/3D computer vision problems), then it is said to have a large receptive
    field. Having a limited receptive field creates problems for tasks like language
    translation or question-answering, where the text input (i.e. prompt) can be very
    long (e.g. hundreds of words). Just imagine you were being asked an exceedingly
    long question, but you can only remember the last few words being said. How could
    you understand the question and,'
  merge: -1
  img_proc: true
- pgno: 397
  md: 'therefore, give a response without being able to recall what is being asked
    at the beginning? Attention, specifically the scaled-dot-product self-attention
    that we discussed in Chapter 5 is proven to resolve this issue in the original
    transformer paper [Vaswani et al., 2017]. By performing pair-wise dot-product
    between input tokens, the model learns to focus on what to pay “attention” to
    (pun intended here~) during sequence modeling. The transformer model was introduced
    in the context of neural machine translation. However, later research has shown
    that the transformer model is especially powerful in learning long-sequence data.
    It has been demonstrated that the transformer architecture allows researchers
    to build state-of-the-art models in domains not only in natural language processing
    (NLP), but also in areas including but not limited to text-to-speech (e.g. FastSpeech2
    [Ren et al., 2020]), speech-to-text (e.g. Whisper [Radford et al., 2022]), computer
    vision (e.g. ViT [Dosovitskiy et al., 2021] model that we discussed in Chapter
    9), drug discovery (e.g. SMILES [Honda et al., 2019; Grechishnikova, 2021]), and
    recommendation engines (e.g. SASRec [Kang and McAuley, 2018]).


    # 11.1.1 Encoder and Decoder of the Transformer Architecture


    The original transformer uses an encoder–decoder architecture, where the encoder
    compresses the inputs, and then the decoder decompresses the hidden states to
    generate outputs specific to the task of translation. As a side note, a recent
    study has demonstrated that the transformer model is a powerful data compressor
    for representation learning [Yu et al., 2023], with the interesting slogan “Compression
    is all there is.” The simplest encoder–decoder architecture is the autoencoder,
    which we introduced in Chapter 8, where the encoder and decoder have the same
    architecture (i.e. a dense layer). Transformer instead uses a combination of attention,
    layer normalization, and feedforward layers to compress and decompress the data.
    The key differences between the encoder and the decoder blocks are:


    +   • The encoder uses bidirectional attention. This means that past tokens can
    be used to predict future tokens, while future tokens can also be used to predict
    past tokens.


    +   • The decoder uses masked or causal attention. Past tokens can be used to
    predict future tokens, but not vice versa. In Chapter 5, when we were discussing
    the scaled-dot-product attention mechanism, we have illustrated the two types
    of attention mechanism.


    +   • Specific to the original transformer paper, the decoder block also receives
    inputs from the hidden state of the encoder layer with an additional attention
    layer. Therefore, the encoder layer only has one attention layer, while the decoder
    layer has two attention layers. However, in more recent architectures'
  merge: -1
  img_proc: true
- pgno: 398
  md: 'such as generative pretrained transformer (GPT) [Radford et al., 2018], decoder
    architecture specifically refers to a transformer block that has only one causal
    attention layer.


    More often than not, subsequent transformer-based models may use only either the
    encoder or decoder part of the transformer for specific tasks. For instance, bidirectional
    encoder representation from transformers (BERT) [Devlin et al., 2019] is an encoder-only
    pretrained language model from Google. Many sequence representers also tend to
    use encoder architecture, e.g. FastSpeech2 and Whisper, whose hidden states are
    then decoded by downstream architectures that may not necessarily be a transformer
    block, e.g. convolutional layers. By contrast, the GPT model family uses decoder-only
    architecture, where causal attention is used. The choice of specific architecture
    is tightly associated with the training tasks used by different models, which
    we will discuss in Section 11.5.


    # 11.1.2 Training of Transformer Models


    Self-supervised pretraining has been an effective technique in building models
    solving NLP tasks. Researchers would gather a large text corpus with billions
    to trillions of tokens to build models that “understand” text so that they can
    be fine-tuned downstream to solve NLP-specific tasks like text classification
    or sentiment analysis, which usually has less human-labeled data available. What
    they typically do is pretraining the model using the “Cloze” task (i.e. fill in
    the blank) [Devlin et al., 2019], in which a word in a sentence is blanked out,
    and the model learns to predict the word in the blank. It is said that the model
    learns via a self-supervised fashion, where the data used to generate both the
    input and the label come from the same sentence, without a human deciding what
    the inputs and the labels are. Indeed, text data are “self-labeling” (as explained
    by Yann Lecun). Similar to text data, time series or time-associated events data
    are also self-labeling. Let’s say, we can use the last seven days of historical
    data to forecast the next event, e.g. whether or not it is raining tomorrow. At
    the inference time, we do not know what tomorrow’s weather is going to be, so
    we do not have the label at the moment. But, we only need to wait to see the weather
    on the next day, and the label is automatically generated, without a human deliberately
    deciding what it is.


    Going back to the context around NLP, the BERT model that uses encoder-only transformer
    architecture with bidirectional attention is trained using the Cloze task. The
    goal of BERT is to learn a sequence representation, such that it can be used in
    downstream tasks that would utilize the entirety of the sentence inputs. The Cloze
    task is an auxiliary task for the model to comprehend a full sentence. By contrast,
    the GPT model that uses decoder-only transformer architecture with'
  merge: -1
  img_proc: true
- pgno: 399
  md: 'causal attention is trained to predict the next token. The goal of GPT is,
    as the name suggests, to generate new tokens given an input prompt, in contrast
    to predicting a token in the middle of the sentence. Therefore, GPT will never
    see any future tokens during generation, so it needs to learn to predict the ordering
    of the tokens rather than representing a full sentence. Therefore, different training
    objectives can dictate different model architecture decisions in a model.


    # ## 11.2 Pre-LN vs. Post-LN Transformer


    Ever since the original transformer paper, various improvements to the architecture
    have been suggested to further enhance the learning capacity and training stability
    of the model. For the rest of the chapter, we will introduce various improvements
    made to the transformer model, which led to what is currently considered to be
    the strongest recipe for transformer, called Transformer++ [Gu and Dao, 2023]
    or LLaMA [Touvron et al., 2023a].


    One significant caveat about the original transformer architecture is that the
    training of the model can become unstable, where the loss can diverge. To address
    this issue, the original transformer paper used a learning-rate schedule during
    model training, specifically


    $l_{rate} = d_{model}^{-0.5} \cdot \min(\text{step}^{-0.5}, \text{step} \cdot
    \text{warm-up\_steps}^{-1.5})$


    where


    +   - step is the number of training steps

    +   - $d_{model}$ is the embedding size of the tokens

    +   - warm-up_steps is the number of steps used for a linear ramping-up period,
    which the original paper set to 4000.


    The learning rate curve is plotted in Figure 11.1, with the accompanying implementation
    in NumPy below:


    ```

    import numpy as np

    import matplotlib.pyplot as plt


    # learning rate schedule

    d = 128 # d_model

    step = np.arange(160_000)

    warmup_steps = 4000

    lr = (1/np.sqrt(d)) * np.minimum(1/np.sqrt(step), step * warmup_steps**-1.5)


    fig, ax = plt.subplots(1, 1, figsize=(10, 4))

    ```'
