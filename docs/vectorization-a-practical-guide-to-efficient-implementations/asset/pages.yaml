  md: "# Table 9.2 (Continued)\n\n| Operation | NumPy | Tensorflow | PyTorch |\n|\
    \ :--- | :--- | :--- | :--- |\n| Groupwise mean<sup>b)</sup> | N/A | tf.math.segment_mean,\
    \ tf.math.unsorted_segment_mean, tf.sparse.segment_mean | torch.scatter_reduce(...,\
    \ reduce=\"mean\"), torch.segment_reduce(arr, \"mean\", offsets) |\n| Groupwise\
    \ product<sup>c)</sup> | np.multiply.reducet | tf.math.segment_prod, tf.math.unsorted_segment_prod\
    \ | torch.scatter_reduce(..., reduce=\"prod\"), torch.segment_reduce(arr, \"prod\"\
    , offsets) |\n\nb) NumPy does not implement a groupwise mean function. This is\
    \ probably because the mean operation is technically not an element-wise reduction\
    \ operation, as it not only needs to track the sum but also the total number of\
    \ elements within each group. However, an easy workaround is to utilize `np.add.reduceat`\
    \ to implement the equivalent function, where we compute the groupwise sum first,\
    \ and then count the number of elements within the group by summing together an\
    \ indicator array of 1s. The implementation is as follows:\n\n```\nimport numpy\
    \ as np\ndef np_mean_reduceat(arr, indices, **kwargs):\n    # Compute groupwise\
    \ sum\n    gsum = np.add.reduceat(arr, indices, **kwargs)\n    # Compute groupwise\
    \ count\n    indicator = np.ones_like(arr)\n    gcount = np.add.reduceat(indicator,\
    \ indices, **kwargs)\n    # Compute mean\n    return gsum / gcount\n```"
