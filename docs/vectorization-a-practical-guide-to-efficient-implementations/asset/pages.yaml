  md: "# 6.3 Case Study: Parsing DateTime from String Representations\n\nWe may be\
    \ familiar with Python's `datetime` library which allows us to handle timestamps\
    \ easily via intuitive application programming interfaces (APIs). For example,\
    \ we would like to convert a local timestamp to a Coordinated Universal Time (UTC)\
    \ timestamp like the following:\n\n```\nimport datetime\ndatetime_local = datetime.datetime.strptime(\n\
    \    \"2023-05-07 17:32:25-08:00\", '%Y-%m-%d %H:%M:%S%z'\n)\ndatetime_utc = datetime_local.astimezone(datetime.timezone.utc)\n\
    # datetime.datetime(2023, 5, 8, 1, 32, 25, tzinfo=datetime.timezone.utc)\n```\n\
    \nPandas also provides vectorized ways to manipulate timestamps easily as well\
    \ with its `pd.Timestamp` class [McKinney, 2023a]. However, deep-learning libraries\
    \ like Tensorflow and PyTorch do not have a built-in timestamp class (at the time\
    \ of writing), so it is more typical to handle timestamp features using strings\
    \ when attempting to model time series data. The following function implements\
    \ a way to convert an array of timestamp strings in the format of `year-month-date\
    \ hour:minute:second timezone`, or using `datetime.strftime` expression `%Y-%m-%d\
    \ %H:%M:%S%Z`, into a series of integers representing year, month, date, hour,\
    \ minute, seconds, zone, respectively.\n\n```\ndef _parse_timestamps(\n    timestamps_array:\
    \ tf.Tensor, utc: bool = False\n):\n    \"\"\"\n    Parse timestamp strings, assuming\
    \ %Y-%m-%d %H:%M:%S%Z.\n    For example: 2023-05-07 17:32:25-08:00\n    \"\"\"\
    \n    # use substring to extract time components\n    year = tf.strings.to_number(\n\
    \        tf.strings.substr(timestamps_array, 0, 4),\n        out_type=tf.int64\n\
    \    )\n    month = tf.strings.to_number(\n        tf.strings.substr(timestamps_array,\
    \ 5, 2),\n        out_type=tf.int64\n```"
