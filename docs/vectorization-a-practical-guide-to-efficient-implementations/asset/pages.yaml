  md: '+   - Q, K, and V are query, key, and value vectors that are obtained by passing
    inputs into a dense projection layer, e.g. Q = W_q X_q with X_q being the embedding
    vector of the query. In the scenario of self-attention, X_q, X_k, and X_v are
    identical, so we will denote it as X.


    In the case of absolute sinusoidal positional encoding, it is typical to add positional
    encoding on top of the embedding output X, then project with a dense layer before
    computing the attention score. Mathematically, we can formulate it as Q = (X +
    PE)W_q and K = (X + PE)W_k. Then,


    ```

    QK^T = (X + PE)W_q \cdot ((X + PE)W_k)^T

    ```


    RPE, however, formulates this term as [Luo et al., 2022]


    ```

    QK^T = (XW_q) \cdot (XW_k)^T + B

    ```


    where B is a square matrix. That is, RPE adds the positional encoding information
    on top of the attention score map, instead of directly on the input token representation,
    where relative distances between each pair of tokens are computed. Well-known
    formulations of B include:


    +   - Original RPE paper [Shaw et al., 2018]: b_ij = X_i W_q r_{i-j}^T where r_{i-j}
    is a learnable parameter between the positions i and j in the sequence.

    +   - Transformer-XL [Dai et al., 2019]: b_ij = X_i W_q (r_{i-j} \tilde{W}_k)^T
    + u(X_j W_k)^T + v(r_{i-j} \tilde{W}_k)^T, where u, v, and \tilde{W}_k are learnable
    vectors, while r_{i-j} is a sinusoidal positional encoding.

    +   - T5 (Text-to-Text Transfer Transformer) [Raffel et al., 2020]: b_ij is a
    learnable parameter on its own.


    Figure 11.6 illustrates the case for the T5 model. Pair-wise distances between
    the positions of the key and the query are computed. Then, the embedding of the
    relative distances is used to construct the position embedding tensor of shape
    (q_len, k_len, emb_size), which is then added to the attention score [Wolf et
    al., 2020; HugginFace, 2023]. Note that the T5 model uses a strategy to map large
    relative distances to a bucket number in a logarithmic scale, such that these
    large relative distances may correspond to the same embedding vectors.


    # 11.4.4 Rotary Positional Encoding (RoPE)


    The RoFormer paper [Su et al., 2020] introduced the rotary positional encoding
    (RoPE), which is also a form of relative attention. Instead of adding a positional
    encoding to the input, the idea is to rotate the embedding vector of the sequence'
