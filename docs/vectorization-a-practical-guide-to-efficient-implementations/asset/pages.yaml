  md: "# Table 9.2 (Continued)\n\n| Operation | NumPy | Tensorflow | PyTorch |\n|---|---|---|---|\n\
    | Groupwise sum divided by sqrt(d) | N/A | tf.math.unsorted_segment_sqrt_n, tf.sparse.segment_sqrt_n\
    \ | N/A |\n| Groupwise maximum | np.maximum.reduceat | tf.math.segment_max, tf.math.unsorted_segment_max\
    \ | torch.scatter_reduce(..., reduce=\"amax\"), torch.segment_reduce(arr, \"max*\"\
    , offsets) |\n| Groupwise minimum | np.minimum.reduceat | tf.math.segment_min,\
    \ tf.math.unsorted_segment_min | torch.scatter_reduce(..., reduce=\"amin\"), torch.segment_reduce(arr,\
    \ \"min*\", offsets) |\n\nd) segment_sqrt_n is a special function that was motivated\
    \ by previous natural language modeling studies that attempted to summarize embeddings\
    \ of tokens within a sentence, i.e. representing a sentence as a bag of words\
    \ (e.g. pretrained feed-forward Neural-Net Language Model, or NNLM [Bengio et\
    \ al., 2003], from TFHub [Google, 2023]). These studies found that taking the\
    \ square root of the sum of the embeddings is more effective in representing sentences\
    \ than averaging the embeddings of the tokens together. Similar to the groupwise\
    \ mean reduction solution, this can also be implemented using np.divide.reducat\
    \ in NumPy or torch.scatter_add in PyTorch. We illustrate an implementation in\
    \ the following code block using PyTorch:\n\n```\nimport torch\n\ndef torch.scatter_reduce_sqrt_n(arr,\
    \ segment_ids, **kwargs) :\n  # Initialize accumulators\n  numerator = torch.zeros(segment_ids.max()\
    \ + 1)\n  denom = torch.zeros_like(numerator)\n  # Compute groupswise sum\n  gsum\
    \ = numerator.scatter_add_(0, segment_ids, arr)\n  # Compute groupwise count\n\
    \  indicator = torch.ones_like(arr)\n  gcount = denom.scatter_add_(0, segment_ids,\
