- pgno: 150
  md: "# # 4.4 Einsum\n\nEinstein Summation (or einsum) Convention is a generalization\
    \ of various forms of vector, matrix, and tensor summations and multiplications.\
    \ Suppose we want to perform matrix multiplication between two tensors X and Y,\
    \ each element of the matrix should be expressed mathematically as\n\n\\([XY]_{ij}\
    \ = \\vec{X}_i \\cdot \\vec{Y}_j = \\sum_k X_{i,k} \\cdot Y_{k,j}\\)\n\nand using\
    \ a for-loop, we would compute the product like the following, e.g.:\n\n```\n\
    import numpy as np\n\nX = np.random.rand(5, 3)\nY = np.random.rand(3, 7)\nZ =\
    \ np.zeros((5, 7)) # expected shape\nfor ii in range(5):\n    for jj in range(7):\n\
    \        Z[ii, jj] = X[ii, :].dot(Y[:, jj])\n```\n\n> **Note**\n> \n> Various\
    \ sources I have found on the history of the Einstein Summation Convention pointed\
    \ to Albert Einstein's original manuscript on General Relativity, “Die Grundlage\
    \ der allgemeinen Relativitätstheorie,” or in English, “The Foundation of the\
    \ General Theory of Relativity” [Einstein, 1996]. But, based on what was described\
    \ in Section 4.5, Einstein credited “Ricci and Levi-Civita” (i.e. Gregorio Ricci-Curbastro\
    \ and Tullio Levi-Civita) for these notations.\n\nIn einsum notation, the matrix\
    \ multiplication operation will track only the indices, ik and kj, respectively.\
    \ Then, matrix multiplication is expressed as ik,kj->ij. Notice that the repeated\
    \ index k is collapsed or summed together after multiplication along its dimension.\n\
    \nThere are two modes of expressing the einsum equations. The above example is\
    \ called the “explicit mode,” in which the equation string has a right arrow \"\
    ->\" to indicate the ordering of the indices of the resulting tensor. If there\
    \ are no indices to the right of the arrow, then a constant is assumed to be returned."
