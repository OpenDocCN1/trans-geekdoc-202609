  md: "We would like to scatter the inputs to a new target matrix based on the batch\
    \ of indices specified by the `index`. This is easily done in PyTorch with\n\n\
    ```\nimport torch\noutput = torch.scatter(\n    torch.zeros((4, 10), dtype=int),\n\
    \    1,\n    torch.tensor(index.numpy(), dtype=int),\n    torch.tensor(inputs.numpy(),\
    \ dtype=int),\n)\n# tensor([[0, 2, 2, 5, 8, 0, 6, 0, 0, 0],\n#         [0, 0,\
    \ 6, 0, 1, 4, 0, 0, 7, 0],\n#         [4, 5, 0, 1, 0, 5, 9, 0, 0, 0],\n#     \
    \    [0, 0, 8, 0, 7, 3, 0, 6, 0, 0]])\n\n```\n\nHowever, we can use Tensorflow's\
    \ `tf.scatter_nd` method to achieve the same effect. More concretely, consider,\
    \ step by step,\n\n+   For `index[0, 0] = 1`, we have a value at the corresponding\
    \ index `input[0, 0] = 2`. We would like to put this value into a new tensor at\
    \ the position such that `X[0, 1] = 2` (Figure 3.20b). Given the target tensor\
    \ has shape `(4, 10)`, the multi-index `[0, 1]` can be converted into a flat index\
    \ 1. Therefore, this is the same as assigning a flat vector `X_flat[1] = 2`, and\
    \ then reshaping the flat vector back into a 2D matrix.\n\n+   For the subsequent\
    \ figures, Figure 3.20c–e, we are simply iterating over the elements of `index`,\
    \ extracting the corresponding value from the `input`, and scatter it to the corresponding\
    \ position on `X`.\n\nNotice that the final output matrix has many zero entries.\
    \ A matrix with many zero entries is called a sparse matrix, which we will introduce\
    \ in more detail in Chapter 7.\n\nWith the above logic, we can implement the following\
    \ code that specifically handles the 2D matrix case. Interested readers can further\
    \ generalize this implementation to higher-dimensional tensors, or perhaps find\
    \ alternative methods to achieve the same goal.\n\n```\nimport tensorflow as tf\n\
    \ndef scatter_batch_2d(index, inputs):\n    # Determines the length of each row\
    \ for the output\n    row_length = tf.cast(tf.reduce_max(index), tf.int32) + 1\n\
    \    row_length = tf.maximum(tf.shape(inputs)[1], row_length)\n    # start and\
    \ end index of each row\n    # row 0: inc[0]:inc[1], row 1: inc[1]:inc[2], ...\n\
    \n```"
