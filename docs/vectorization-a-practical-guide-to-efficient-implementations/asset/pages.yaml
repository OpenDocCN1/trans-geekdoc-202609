    24  # Slice and reshape phi to match x

    25  phi = phi[:, x.shape[1], :] # same length as x

    26  broadcast_shape = [

    27    d if ii == 1 or ii == x.ndim - 1 else 1

    28    for ii, d in enumerate(x.shape)

