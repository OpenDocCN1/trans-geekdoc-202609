  md: '# Table 3.5 List of put and scatter operations in NumPy, Tensorflow, and PyTorch.


    | Operation | NumPy | Tensorflow | PyTorch |

    | :--- | :--- | :--- | :--- |

    | Put using flat index | np.put (in-place) | N/A | torch.put (in-place: torch.Tensor.put_)
    |

    | Put along axis | np.put_along_axis (in-place) | N/A | N/A |

    | Put to shape using multi-index | N/A | tf.scatter_nd | N/A |

    | Scatter with replacement | N/A | tf.tensor_scatter_nd_update | torch.index_put
    (..., accumulate=False) |

    | Scatter with addition | np.add.at | tf.tensor_scatter_nd_add | torch.index_put
    (..., accumulate=True) |

    | Scatter with subtraction | np.subtract.at | tf.tensor_scatter_nd_sub | N/A |

    | Scatter with max | np.maximum.at | tf.tensor_scatter_nd_max | a)torch.index_reduce
    (..., reduce="amax"), torch.scatter_reduce (..., reduce="amax") |

    | Scatter with min | np.minimum.at | tf.tensor_scatter_nd_min | a)torch.index_reduce
    (..., reduce="amin"), torch.scatter_reduce (..., reduce="amin") |

    | Scatter with mean | N/A | N/A | a)torch.index_reduce (..., reduce="mean"), torch.scatter_reduce
    (..., reduce="mean") |

    | Scatter with product | np.multiply.at | N/A | a)torch.index_reduce (..., reduce="prod"),
    torch.scatter_reduce (..., reduce="prod") |


    Note: a) The logic of these PyTorch scatter functions is not exactly the same
    as that of NumPy and Tensorflow. See discussions below.'
