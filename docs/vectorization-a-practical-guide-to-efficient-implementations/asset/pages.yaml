    encounter cases where the `month = 0` after the offset. This is okay since we
    will correct it later on after first correcting the `year`.

    +     - If `month_days <= day`, then we need to add a month. For now, we may encounter
    cases where `month = 13` after the offset. Again, this is okay, since we will
    correct it later on after first correcting the `year`.


    +   - Line 59 offsets the year.

    +     - If `month > 12` (i.e. `month = 13`), then we need to add a year.

    +     - If `month < 1` (i.e. `month = 0`), then we need to subtract a year.

    +     - Otherwise, the year does not change.


    +   - Line 62 corrects the month

    +     - If `month = 13`, then we need to change it to `month = 1`.

    +     - If `month = 0`, then we need to change it to `month = 12`.


    +   - Lines 64–78 handle the date correction.

    +     - Lines 64–66: If `day > month_days` exceeds the maximum number of days
    for the month, then we need to reset starting from the previous month and count
    the number of days exceeded.

    +     - Lines 68–73 compute `month_days` (which is the last day of the month)
    before handling the case where `day = 0`. Because we offset the `month` backward,
    sometimes to February which can potentially be a leap month, we need to compute
    which day we need to set back to (as the last day of the previous month) corresponding
    to the corrected `month` (in this case, a month is subtracted).

    +     - Lines 76–78 correct the `day` when `day = 0`, by setting the date to the
