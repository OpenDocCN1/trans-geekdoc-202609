  md: "```\n# The following, however, will throw an error\nprint(x[7]) # IndexError:\
    \ list index out of range\n```\n\n# ## 3.3 Case Study: Get Consecutive Index\n\
    \nSuppose we have a list of integers [-1, 1, 2, 3, 4, 7, 9, 10, 11, 12, 13, 15],we\
    \ can recognize that there are two groups that are composed of consecutive integers,\
    \ [1, 2, 3, 4] and [9, 10, 11, 12, 13]. We would like to find the start and end\
    \ indices of these two blocks of integers. This can be helpful when we want to\
    \ convert the list of integers into texts like \"-1, 1~4, 7, 9~13 , 15\" which\
    \ may be easier to read than the long list of integers. The following code implements\
    \ our desired function:\n\n```\nimport numpy as np\n\ndef get_consecutive_index(t,\
    \ N=1, interval=True):\n    \"\"\"\n    Given a sorted array of integers, find\
    \ the start and the end\n    of consecutive blocks\n    e.g. t = [-1, 1,2,3,4,\
    \ 7, 9,10,11,12,13, 15],\n         return [1,4], [6,10]\n\n    Inputs:\n    *\
    \ t: the sorted array of integers\n    * N: filter for at least N consecutive.\
    \ Default 1\n    * interval: if True, we are filtering by N consecutive\n    \
    \            intervals instead of N consecutive numbers\n    \"\"\"\n    # Determine\
    \ if the (next element) = (1 + previous)\n    x = np.diff(t) == 1\n    # Determine\
    \ which element is the start or end of the block\n    f = np.concatenate(([False],\
    \ x)) != np.concatenate((x, [False]))\n    # Index of the start and end of the\
