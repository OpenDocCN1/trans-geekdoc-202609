- pgno: 22
  md: '# 1

    Introduction to Vectorization


    # 1.1 What Is Vectorization


    **Vectorization** is a type of parallel computing paradigm that performs arithmetic
    operations on an array of numbers [Intel, 2022] within a single data processing
    unit (either CPU or GPU). Modern CPUs can perform between 4 and 16 single precision
    (float32) parallel computations, depending on the type of instructions [Intel,
    2022] (see Figure 1.1).


    Here, SSE, or streaming SIMD (single-instruction-multiple-data) extension, has
    128 registers; each register is used to store 1-bit of data for computations.
    This is equivalent to performing four single-precision (float32) operations or
    two double-precision (float64) operations. Intel''s AVX512, or Advanced Vector
    Extension 512, on the other hand, has 512 registers and can therefore process
    512 bits of data simultaneously. This is equivalent to performing 16 single-precision
    or 8 double-precision operations.


    The term “Vectorization” also refers to the process of transforming an algorithm
    computable on one data point at a time to an operation that calculates a collection
    of data simultaneously [Kharchenko, 2018]. A classic example is the dot product
    operation,


    \(\sum_{i}^{n} a_i b_i = \mathbf{a} \cdot \mathbf{b}\)


    where \(\mathbf{a} := [a_1, a_2, a_3, \dots, a_n]\), and \(\mathbf{b} := [b_1,
    b_2, b_3, \dots, b_n]\).


    The dot product operation on the right-hand side of the equation is the vectorized
    form of the summation process on the left. Instead of operating on one element
    of the array at a time, it operates on the collections or arrays, \(\mathbf{a}\)
    and \(\mathbf{b}\).'
  merge: -1
  img_proc: true
- pgno: 23
  md: "![](img/e891acaacd4fb5b80dab2ed824618203_23_0.png)\n\nFigure 1.1 CPU vector\
    \ computations.\n\n> > **Note**\n> \n> Another definition of the term “vectorization”\
    \ is related to the more recent advances in large language models: using a vector\
    \ or an array of values to represent a word. This is more commonly known as **embedding**\
    \ in the literature which originated from the word2vec model in natural language\
    \ processing. In Chapters 6 and 7, we will introduce the idea of representing\
    \ string or categorical features as numerical values, i.e. integer indices, sparse\
    \ one-hot encoding vectors, and dense embedding vectors.\n\n# 1.1.1 A Simple Example\
    \ of Vectorization in Action\n\nSuppose we want to take the dot product of 1 million\
    \ random numbers drawn from the uniform distribution. Using Python’s `for` loop,\
    \ we would typically implement this algorithm as the follows:\n\n```\nimport random\n\
    def sqrt_of_n_random_numbers(n=1_000_000) :\n    result = 0\n    for _ in range(n)\
    \ :\n        a = random.uniform(0, 1)\n        b = random.uniform(0, 1)\n    \
    \    result += a * b\n    return result\n```"
  merge: -1
  img_proc: true
- pgno: 24
  md: "On my M1 MacBook Pro under Python 3.11.4, this is the runtime of the above\
    \ function:\n\n```\n294 ms ± 1.39 ms per loop (mean ± std. dev. of 7 runs, 1 loop\
    \ each)\n```\n\nIf we implement the algorithm using numpy with vectorization\n\
    \n```\nimport numpy as np\n\ndef sqrt_of_n_random_numbers_np(n=1_000_000) :\n\
    \    a = np.random.rand(n)\n    b = np.random.rand(n)\n    result = np.dot(a,\
    \ b)\n    return result\n```\n\nUnder the same setup, we have the following runtime\
    \ of the vectorized implementation.\n\n```\n7.9 ms ± 119 μs per loop (mean ± std.\
    \ dev. of 7 runs, 100 loops each)\n```\n\nThis is a ~37× speed-up by vectorization!\n\
    \n# 1.1.2 Python Can Still Be Faster!\n\nHowever, the above example is not to\
    \ discount that certain native Python operations are still faster than NumPy’s\
    \ implementations, despite NumPy being often used for vectorization operations\
    \ to simplify for-loops in Python.\n\nFor example, we would like to split a list\
