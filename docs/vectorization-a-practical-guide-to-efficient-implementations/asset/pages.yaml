  md: "it would not be affected by the skew of the image. To find the pair of squares,\
    \ I would first segment the image into multiple patches and then iterate over\
    \ all combinations of pairs of patches to compute some distance metric against\
    \ the template. Some combinations would be between one of the squares in the fiducial\
    \ marker and some lighting artifacts, but only one of them would be a pair of\
    \ squares matching exactly to the template. This pair should have the smallest\
    \ distance to the template image. The core template-matching distance metric I\
    \ found was the Hausdorff Distance [Dubuisson and Jain, 1994].\n\nThe original\
    \ Hausdorff Distance is expressed by the following formula:\n\nmax(h(A,B), h(B,A))\n\
    \nwhere h(A,B) = max((d(Ai,B)) = max_i (min_j ||A_i - B_j||), and || . || is the\
    \ Euclidean distance. To implement this formula through vectorization, the key\
    \ here is to compute the Euclidean distance term ||A_i - B_j||, \\forall i, j.\
    \ This creates a matrix of shape (n, m), where n, m are the number of pixels or\
    \ points in image A and B, respectively. Recall that for a pair of 2D points,\
    \ the Euclidean distance is defined as\n\nD_{ij} = ||A_i - B_j||\n= \\sqrt{(x_i\
    \ - x_j)^2 + (y_i - y_j)^2}\n= \\sqrt{(x_i - x_j)^2 + (y_i - y_j)^2}\n= \\sqrt{x_i^2\
    \ + x_j^2 - 2x_ix_j + y_i^2 + y_j^2 - 2y_iy_j}\n= \\sqrt{(x_i^2 + y_i^2) + (x_j^2\
    \ + y_j^2) - 2(x_ix_j + y_iy_j)}\n= \\sqrt{A_i \\cdot A_i^T + B_j \\cdot B_j^T\
    \ - 2A_i \\cdot B_j^T}\n\nUnder the square root, the first term is an inner product\
    \ between row vector $A_i$ and itself; similarly, the second term is an inner\
    \ product between row vector $B_i$ and itself. Alternatively, the two terms can\
    \ be seen as the diagonal entries of the matrix products $AA^T$ and $BB^T$, respectively.\
    \ The third term is the combination of the dot product between each point in matrix\
    \ A and each point in matrix B. We can therefore implement the Hausdorff distance\
    \ in the following as\n\n```\nimport numpy as np\ndef HausdorffDist(A, B):\n \
    \   \"\"\"\n    Compute the Hausdorff distance between two point clouds.\n   \
    \ Let A and B be subsets of metric space (Z, dZ),\n    the Hausdorff distance\
    \ between A and B, denoted by dH(A,\n    B),\n    \"\"\"\n```"
