  md: "# ## 5.2.2 Case Study: Truncate or Pad Sequence to Desired Length\n\nSuppose\
    \ we have two batches of sequences,X and y.X has shape (batch_size, seq_len_1)\
    \ and y has shape (batch_size, seq_len_2).We do not know beforehand which sequence\
    \ is longer, however, we would like to have y with sequence lengths identical\
    \ to that of X. The following code uses the idea of padding and slicing to align\
    \ the lengths of X and y.\n\n```\nimport numpy as np\ndef align_lengths(X, y):\n\
    \    \"\"\"Align y to the length (axis=1) of X.\"\"\"\n    # Get the desired length\n\
    \    X_len = X.shape[1]\n    # Compute pad_size.\n    # No padding (pad_size=0)\
    \ if y length is enough\n    pad_size = max(X_len - y.shape[1], 0)\n    # Pad\
    \ if not enough\n    y = np.pad(y, [(0, 0), (0, pad_size)])\n    # Truncate if\
    \ y is too long\n    y = y[:, :X_len]\n    return y\n```\n\n+   - Line 5 gets\
    \ the desired length that we would like y to have.\n+   - Line 8 computes the\
    \ desired padding size. If X is longer, then we need to pad the difference between\
    \ X and y; but if X is shorter, we should not pad (pad_size=0).\n+   - Line 10\
    \ does the padding based on the pad_size we calculated. This will handle cases\
    \ where y is shorter than X but has no effect when y is the same length or longer\
    \ than X.\n+   - Line 12 truncates any extra elements in y. If y is indeed longer\
    \ than X, then after truncation, y should be the same size as X. If y is the same\
    \ length as X or is shorter than X, padding from the previous step will first\
    \ bring y to the same length as X. Then slicing up to the length X will have no\
    \ effect.\n\nWe can quickly test out our implementation:\n\n```\nX1 = np.random.rand(16,\
    \ 50)\nX2 = np.random.rand(16, 30)\ny = np.random.rand(16, 37)\ny1 = align_lengths(X1,\
    \ y)\nassert np.allclose(X1.shape, y1.shape)\nprint(y1.shape)\n```"
