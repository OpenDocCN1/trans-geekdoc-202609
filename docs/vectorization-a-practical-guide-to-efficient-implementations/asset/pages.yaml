  md: '# 7.7.4 Adding Regularization Term


    Starting with a simple linear regression, we have the model as


    $\hat{y} = Aw$


    where $w$ is a column weight vector. The L2 regularized loss function is


    $J = \sum_{i}^{N} (y_i - \hat{y}_i)^2 + \lambda ||w||_2^2$


    where $|| \cdot ||_2$ means the second norm. This is known as Ridge Regression
    [Wikipedia, 2024], and $w$ has the known solution


    $w = (\lambda I + A^T A)^{-1} A^T y$


    For matrix factorization, we modify our loss function to be regularized as


    $J = \sum_{i,j \in \Omega} (r_{ij} - \hat{r}_{ij})^2 + \lambda (||U||_F^2 + ||W||_F^2
    + ||b||_2^2 + ||c||_2^2)$


    where $|| \cdot ||_F$ is the Frobenius Norm, which is the L2 norm for a matrix.


    Now to solve for the updates for the four parameters, starting with $u_i$ by taking
    the partial derivative, we have


    $\frac{\partial J}{\partial u_i} = 2 \sum_{j \in \Psi_i} (r_{ij} - \bar{u}_i \cdot
    \bar{w}_j^T - b_i - c_j - \mu)(-w_j) + 2\lambda \bar{u}_i = 0$\n\n$\bar{u}_i \left(
    \sum_{j \in \Psi_i} \bar{w}_j^T \bar{w}_j + \lambda I \right) = \sum_{j \in \Psi_i}
    (r_{ij} - b_i - c_j - \mu) \bar{w}_j$\n\n$\bar{u}_i = \sum_{j \in \Psi_i} (r_{ij}
    - b_i - c_j - \mu) \bar{w}_j \left( \sum_{j \in \Psi_i} \bar{w}_j^T \bar{w}_j
    + \lambda I \right)^{-1}$


    Similarly, for $w_j$, we have


    $\bar{w}_j = \sum_{i \in \Omega_j} (r_{ij} - b_i - c_j - \mu) \bar{u}_i \left(
    \sum_{i \in \Omega_j} \bar{u}_i^T \bar{u}_i + \lambda I \right)^{-1}$


    Taking the partial derivative with respect to $b_i$, we have


    $\frac{\partial J}{\partial b_i} = 2 \sum_{j \in \Psi_i} (r_{ij} - \bar{u}_i \cdot
    \bar{w}_j^T - b_i - c_j - \mu)(-1) + 2\lambda b_i = 0$\n\n$\sum_{j \in \Psi_i}
    (r_{ij} - \bar{u}_i \cdot \bar{w}_j^T - c_j - \mu) = \sum_{j \in \Psi_i} b_i +
    \lambda b_i$\n\n$\frac{1}{|\Psi_i|} + \frac{\lambda}{|\Psi_i|} \sum_{j \in \Psi_i}
    (r_{ij} - \bar{u}_i \cdot \bar{w}_j^T - c_j - \mu) = b_i$'
