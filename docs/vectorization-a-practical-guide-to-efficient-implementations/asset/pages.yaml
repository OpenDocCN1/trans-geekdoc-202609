    Frequency-Inverse Document Frequency (TF-IDF).


    # 6.4.5 TorchText torchtext.vocab


    Since PyTorch torch.Tensor does not handle strings and bytes, the library itself
    does not provide a way to handle the transformation from string values to integer
    indices and relies on custom preprocessing. TorchText is a library currently in
    pre-release (at the time of writing, the most recent version is 0.16) that implements
    text pre-processing utilities for NLP tasks. torchtext.vocab.vocab is the method
    to convert string values to integer indices based on a lookup table from a predefined
    dictionary which maps between the string value and the frequency of occurence
    of the value. It sorts the order of the index based on the frequency, with the
    lowest frequency as the starting index.


