- pgno: 96
  md: 'Finally, there can only be one ellipsis . . . operator when specifying a slice.
    Specifying more than one ellipsis will throw an error, for example:


    ```

    X = np.arange(30).reshape(3, 2, 5)

    X[..., 0, ...]

    ```


    throws the error in NumPy:


    ```

    IndexError: an index can only have a single ellipsis (''...'')

    ```


    This is because the slicing dimensions represented by the two ellipses are ambiguous.
    X[..., 0, ...] could potentially represent any of the following:


    +   - X[0, :, :]

    +   - X[:, 0, :]

    +   - X[:, :, 0]


    The program cannot determine which is the intended slicing operation.


    Throughout the book, I will sometimes overload the ellipsis operator ... as the
    unspecified value of the argument when describing the usage of function, or used
    for omitting the enumeration of values in a list. However, these usages should
    never occur inside a code block (as all code blocks should be runnable as is).
    I will indicate the meaning of the ellipsis when the notation becomes confusing.


    # 3.2.1 Reusing Slice Configuration


    There may be times when we would like to apply identical slicing logic to more
    than 1 tensors, or perhaps we would like to pass the slicing configuration as
    a variable to a function. In these scenarios, we would need to construct the slice
    object. Python has a built-in method to build slices, slice, which is used as


    +   - slice(stop), which is equivalent to the slice as in l[:stop];

    +   - slice(start, stop), which is equivalent to the slice as in l[start : stop];

    +   - slice(start, stop, step), which is equivalent to the slice as in l[start:stop:step].


    Similarly, NumPy implements np.s_ which can be used in an identical way but it
    uses the more commonly used colon : syntax than slice. Table 3.2 re-enumerates
    the examples of slicing operations as listed in Table 3.1 previously, but using
    slice and np.s_ to build the slicing configurations.'
  merge: -1
