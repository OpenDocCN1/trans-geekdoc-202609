    # # 9.3 Case Study: Vision Transformer (ViT)


    The transformer [Vaswani et al., 2017] model is a powerful sequence representation
    model that is responsible for the subsequent advancements in natural language
    processing, computer vision, audio processing, and time series forecasting. The
    transformer model was originally developed around the context of natural language
    processing, focusing on the task of sequence-to-sequence neural machine translation.
    However, in the current case study, we will look at a research paper on how to
    apply a transformer model in computer vision tasks. Specifically, we will look
    at the use of Vision Transformer, or ViT [Dosovitskiy et al., 2021], to classify
    images. Figure 9.9 illustrates how ViT works. Conceptually, a transformer model
    can be seen as a backbone architecture to represent and extract information from
    a sequence of embeddings of discrete tokens. It takes an input of shape (sequence:length,
    embed_size) and then outputs a tensor of identical shape. Since image data typically
    come in the shape of (num_channels, height, width), we need to come up with a
    strategy to reshape the image inputs to sequences of embeddings. (Here, I am using
    PyTorch''s convention for input image shape; for Tensorflow/Keras convention,
    it would typically be (width, height, num_channels), but this should not prevent
    us from generalizing our implementation in the current study using PyTorch to
    Tensorflow or other libraries.) ViT converts images into sequences by first breaking
    the 2D images into smaller, fixed-size patches, which are then flattened along
    the channel, height, and width dimensions to form a sequence


    ![](img/e891acaacd4fb5b80dab2ed824618203_326_0.png)


    Figure 9.8 Sinusoidal positional encoding of the transformer architecture.'
