  md: "over. In the first variant of layer normalization, \\(\\beta\\) and \\(\\gamma\\\
    ) are matrices of shape (`seq_len`, `num_channels`); in the second variant, \\\
    (\\beta\\) and \\(\\gamma\\) are vectors of shape (`num_channels`, ).\n\n+   Group\
    \ normalization: Divides the channel dimension into groups, and normalizes within\
    \ the group. In this normalization scheme, \\(\\gamma\\) and \\(\\beta\\) are\
    \ learned for each group of the channel.\n\n+   Instance normalization: Normalizes\
    \ within each channel/feature. This can be seen as a special case of Group Normalization\
    \ where the group size is 1.\n\nFigure 11.3 illustrates the differences between\
    \ various normalization schemes (which are inspired by Figure 2 of “Group Normalization”\
    \ white paper from Facebook AI Research [Wu and He, 2018]).\n\nRMSNorm, or root-mean-square\
    \ normalization [Zhang and Sennrich, 2019], modifies the formulation in Equation\
    \ 11.1; it no longer computes the mean, but only aims to normalize the variance\
    \ of the inputs. The normalization formulation for RMSNorm is then\n\n$$\\tilde{x}_i\
    \ = \\frac{x_i}{\\sqrt{\\frac{1}{n}\\sum_j x_j^2 + \\epsilon}} \\gamma$$ (11.2)\n\
    \nLet us implement both layer normalization and RMS normalization for comparison\n\
    \n```\nimport torch\nfrom torch import nn\n\nclass LayerNorm(nn.Module):\n   \
    \ def __init__(self, nchannels, epsilon=1e-5):\n        super().__init__()\n \
    \   self.epsilon = epsilon\n    self.gamma=nn.Parameter(torch.ones(nchannels),\
    \ requires_grad=True)\n    self.beta=nn.Parameter(torch.zeros(nchannels), requires_grad=True)\n\
    \n    def forward(self, x):\n        num = x - x.mean(dim=-1, keepdims=True)\n\
    \        denom = torch.var(x, dim=-1, keepdims=True)\n        denom = torch.sqrt(denom\
    \ + self.epsilon)\n        return num / denom * self.gamma + self.beta\n\nclass\
    \ RMSNorm(nn.Module):\n    def __init__(self, nchannels, epsilon=1e-5):\n    \
    \    super().__init__()\n        self.epsilon = epsilon\n        self.gamma=nn.Parameter(torch.ones(nchannels),\
    \ requires_grad=True)\n```"
