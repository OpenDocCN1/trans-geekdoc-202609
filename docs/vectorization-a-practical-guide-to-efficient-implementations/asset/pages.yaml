    \ set operation to perform. Valid values are\n    [\"intersection\" (default),\
    \ \"union\", \"difference\"].\n    * returns: type of returned outputs, either\
    \ \"count\" (default) which\n    counts the cardinality of the resulting set operation\
    \ for each\n    row or \"matrix\" which returns the sparse matrix output from\n\
    \    the set operations, all values are left aligned.\n    \"\"\"\n    # Input\
