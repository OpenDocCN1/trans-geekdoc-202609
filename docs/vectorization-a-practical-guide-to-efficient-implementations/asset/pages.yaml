    # 1.2 Case Study: Dense Layer of a Neural Network


    Vectorization is a key skill for implementing various machine learning models,
    especially for deep learning algorithms. A simple neural network consists of several
    feed-forward layers, as illustrated in Figure 1.2.


    A feed-forward layer (also called dense layer, linear layer, perceptron layer,
    or hidden layer, as illustrated in Figure 1.3) has the following expression:


    $z = \sigma(xw + b)$


    Notice that \(y = xw + b\) is a linear model. Here,


    +   - \(x\) is the input, and typically of shape (`batch_size`, `num_inputs`)

    +   - \(w\) is the weight (a.k.a. kernel) parameter matrix of shape (`num_inputs`,
    `hidden_size`)

    +   - \(b\) is the bias parameter vector of shape (1, `hidden_size`)'
