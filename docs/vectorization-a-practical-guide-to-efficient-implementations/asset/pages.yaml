    \ from the list of perturbed logits for all classes.\n\nIn the following code\
    \ sample, we will implement a function that solves the negative sampling problem\
    \ when training a multi-label classification model, where the positive labels\
    \ may include multiple classes. For example, in object detection tasks, a single\
    \ image may contain multiple objects (e.g. an apple and a cup on a table), so\
    \ the label will be [\"apple\", \"cup\", \"table\"]. We would like to create negative\
    \ labels so that the model can learn the image does not contain certain items,\
    \ such as [\"cat\", \"cereal\", \"spoon\", \"fork\"]. Since an image may contain\
    \ a variable number of objects, we therefore use a ragged sparse tensor to represent\
    \ the labels (recall in Chapter 8). We also assume the labels are already converted\
    \ from string to 1-based indices (recall in Chapter 6).\n\n```\nimport numpy as\
    \ np\nimport tensorflow as tf\ndef gumbel_max_sample_without_replacement(\n  \
    \   true_labels: tf.SparseTensor,\n     num_neg_samples: int,\n     vocab_size:\
