    ("C") ordering, and \(n_{d>0} = \prod_{i=0}^{d-1} n_i, \eta_0 = 1\) when using
    column-major ("F") ordering; \([\cdot]\) is the floor division or integer division
    operation. We can implement our discovery as the following:


