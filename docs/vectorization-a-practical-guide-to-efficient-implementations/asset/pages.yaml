- pgno: 272
  md: 'algorithm, we want to factorize R into two smaller matrices U and W, which
    uses latent features to represent user and item characteristics. See Figure 7.12a
    for this setup. In particular, we have four users, and three items, with latent
    dimension size K = 5. Therefore, we have a sparse COO matrix of shape (4, 3),
    and there are total L = 6 ratings in this sparse matrix. If we multiply U and
    W together, we will need to perform dot products on all 12 pairs of user and item
    vectors. Therefore, the goal is to compute the dot product only on the six entries
    that have ratings. This is a 50% reduction in the number of dot product operations
    needed.


    +   • Line 10: We first extract the row and column indices of the entries. Both
    iU and iW have a length L that is identical to the number of entries in R. We
    can treat iU as the user indices, and iW as the item indices.


    +   • Lines 11 and 12: These lines are two variants of the same implementation.
    With U[iU, :], we are extracting the vectors from the user matrix U for each of
    the ratings being made and forming a matrix of (L, K) (see Figure 7.12b). Similarly,
    W[iW, :] extracts vectors from the matrix W on all the items that are rated by
    any users. Notice that the order of extraction/slicing is the same as the order
    of iterating the entries in R row-wise: R[0, 1] = 3, R[0, 2] = 4, ..., R[3, 2]
    = 2. Then, the corresponding rows of the extracted user and item vectors are multiplied
    and summed together (i.e. same as the dot product), which results in the prediction
    of each rating. Another way to look at this is that we use a flat index of R to
    take entries from either U or W. The resulting matrix is supposedly a 3D tensor
    of (N,M,K), but we are flattening the first two dimensions, so now their shape
    becomes (L, K) after skipping the empty entries.


    +   • Lines 15–17: This step can be seen as scattering the predictions back to
    the position of the original sparse rating matrix. The prediction from the above
    step is a vector of length L, and its ordering is the same as that of R.data.
    Therefore, we can create a new sparse COO matrix R̂ with row, col, and shape identical
    to that of R (see Figure 7.12c).


    ![](img/e891acaacd4fb5b80dab2ed824618203_272_0.png)


    Figure 7.12 Illustration of matrix multiplication on sparse indices.'
