- pgno: 269
  md: 'where


    +   - \( b_i \) is user bias

    +   - \( c_j \) is item bias

    +   - \( \mu \) is the global average rating (average of the data, therefore,
    no need to update during training)


    Then, the updates for \(\vec{u}_i\) and \(\vec{w}_j\) from before now become


    ```

    \(\vec{u}_i := \sum_{j \in \Psi_i} (r_{ij} - b_i - c_j - \mu) \vec{w}_j \left(
    \sum_{j \in \Psi_i} \vec{w}_j^T \vec{w}_j \right)^{-1}\)


    \(\vec{w}_j := \sum_{i \in \Omega_j} (r_{ij} - b_i - c_j - \mu) \vec{u}_i \left(
    \sum_{i \in \Omega_j} \vec{u}_i^T \vec{u}_i \right)^{-1}\)

    ```


    We also need to update \( b_i \) and \( c_j \). Taking the partial derivative
    with respect to \( b_i \), we have


    ```

    \(\frac{\partial J}{\partial b_i} = 2 \sum_{j \in \Psi_i} (r_{ij} - \vec{u}_i
    \cdot \vec{w}_j^T - b_i - c_j - \mu)(-1) = 0\)


    \(\sum_{j \in \Psi_i} (r_{ij} - \vec{u}_i \cdot \vec{w}_j^T - c_j - \mu) = \sum_{j
    \in \Psi_i} b_i\)


    \(\frac{1}{|\Psi_i|} \sum_{j \in \Psi_i} (r_{ij} - \vec{u}_i \cdot \vec{w}_j^T
    - c_j - \mu) = b_i\)

    ```


    where \( |\Psi_i| \) is the cardinality of the set, which represents the number
    of items that user \( i \) rated. It can be seen that the **bias** \( b_i \) **is
    the average deviation between target and modeling prediction, if the model did
    not involve the term** \( b_i \).


    Similarly, taking the partial derivative with respect to \( c_j \), we have


    ```

    \(\frac{\partial J}{\partial c_j} = 2 \sum_{i \in \Omega_j} (r_{ij} - \vec{u}_i
    \cdot \vec{w}_j^T - b_i - c_j - \mu)(-1) = 0\)


    \(\sum_{i \in \Omega_j} (r_{ij} - \vec{u}_i \cdot \vec{w}_j^T - b_i - \mu) = \sum_{i
    \in \Omega_j} c_j\)


    \(\frac{1}{|\Omega_j|} \sum_{i \in \Omega_j} (r_{ij} - \vec{u}_i \cdot \vec{w}_j^T
    - b_i - \mu) = c_j\)

    ```


    The update rules for \( b_i \) and \( c_j \) are


    ```

    \( b_i := \frac{1}{|\Psi_i|} \sum_{j \in \Psi_i} (r_{ij} - \vec{u}_i \cdot \vec{w}_j^T
    - c_j - \mu) \)


    \( c_j := \frac{1}{|\Omega_j|} \sum_{i \in \Omega_j} (r_{ij} - \vec{u}_i \cdot
    \vec{w}_j^T - b_i - \mu) \)

    ```'
