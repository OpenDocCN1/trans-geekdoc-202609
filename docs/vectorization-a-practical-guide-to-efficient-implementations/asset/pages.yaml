  md: '# Table 4.3 List of linear algebraic routines in NumPy, Tensorflow, and PyTorch.


    | Operation | NumPy | Tensorflow | PyTorch |

    |---|---|---|---|

    | Matrix inverse<sup>a)</sup> | np.linalg.inv | tf.linalg.inv | torch.linalg.inv
    |

    | Moore-Penrose pseudo-inverse<sup>b)</sup> | np.linalg.pinv | tf.linalg.pinv
    | torch.linalg.pinv |

    | Eigenvalue decomposition<sup>c)</sup> | np.linalg.eig | tf.linalg.eig | torch.linalg.eig
    |

    | Singular value decomposition<sup>d)</sup> | np.linalg.svd | tf.linalg.svd |
    torch.linalg.svd |


    Notes:

    a) This method finds the square matrix inverse (if the matrix is invertible).
    Mathematically, let the matrix be $X \in \mathbb{R}^{m \times n}$ (real valued)
    or $X \in \mathbb{C}^{m \times n}$ (complex valued). Then, the inverse of the
    square matrix $X^{-1}$ is defined as the $XX^{-1} = X^{-1}X = I$, where $I$ is
    the identity matrix. The method can be applied in batches, i.e. we can have the
    input tensor X be of shape (... , m, m) and the `.linalg.inv` method will find
    the inverse using the matrices formed by the last two dimensions, resulting inverse
    tensors of the same shape as X.


    b) The Moore-Penrose pseudo-inverse generalizes to non-square matrices. Mathematically,
    let $X \in \mathbb{R}^{m \times n}$ or $X \in \mathbb{C}^{m \times n}$. Then,
    the pseudo-inverse is defined as $X^+ = (X^T X)^{-1} X^T$, where $X^+$ is the
    Hermitian of X (complex conjugate, then transpose; for real matrices, this will
    simply be $X^T$). [Barata and Hussein, 2012]. Like the `.linalg.inv` method, `.linalg.pinv`
    can also operate on batches of matrices by solving along the last two dimensions
    of the input tensor.


    c) Suppose we have a square matrix $X \in \mathbb{R}^{m \times n}$. If $v$ is
    a unit vector and $\lambda$ is a scalar value, which satisfies the equation $Xv
    = \lambda v$, then $v$ is the eigenvector and $\lambda$ is the eigenvalue for
    the matrix X. The `.linalg.eig` method returns the eigenvalues (not ordered) and
    eigenvectors whose each column is a unit eigenvector. The original X can be recovered
    via $X = \lambda v v^T$, or (eigenvalues * eigenvectors) `@`.linalg.inv (eigenvectors)
    `@`.linalg.inv (eigenvectors). Like the inverse methods, `.linalg.eig` can also
    operate on batches of matrices by solving along the last two dimensions of the
    input tensor.


    d) Singular value decomposition (SVD) is commonly used for classic machine learning
    algorithms like principal component analysis (PCA). It is defined as $X = U \Sigma
    V^T$ (for complex matrices, $V^T$ would become the Hermitian $V^H$), where $U
    \in \mathbb{R}^{m \times m}$ is the left singular factors, $\Sigma \in \mathbb{R}^{m
    \times n}$ is the singular value matrix whose diagonal values are the singular
    values, $V \in \mathbb{R}^{n \times n}$ is the right singular factor matrix. Matrices
    $U$ and $V$ both have the property $UU^T = U^T U = I_m$ and $VV^T = V^T V = I_n$.
    Therefore, $XX^T = (U \Sigma V^T)(V \Sigma^T U^T) = U \Sigma (V^T V) \Sigma^T
    U^T = U \Sigma \Sigma^T U^T$, and $X^T X = (V \Sigma^T U^T)(U \Sigma V^T) = V
    \Sigma^T (U^T U) \Sigma V^T = V \Sigma^T \Sigma V^T$ (Zhang, 2015). Notice that
    this becomes the eigenvalue problem. We can therefore solve for $U, V, \Sigma$
    by performing eigendecomposition on $XX^T$ and $X^T X$. The `.linalg.svd` method
    returns $U, s$, and $V\_hermitian$ (corresponding to $U$, diagonal entries of
    $\Sigma$ arranged in descending order, and $V^T$). We can recover the original
    matrix via U @ (s * np.eye(U.shape[0], Vh.shape[0], V_hermitian.shape[0])) @ V_hermitian.shape[0]))
    @ V_hermitian. Like all other linear algebra routines, `.linalg.svd` operates
    on the last two axes of the input tensor.

    As an example to illustrate:


    ```

    import numpy as np


    # Create a cloud of points inside of 3D ellipsoid

    n = 2000 # number of points

    a, b, c = .10, 6, 1 # axes lengths

    # randomly generate

    x, y, z = [np.random.uniform(-d, d, n) for d in (a, b, c)]

    inside = ((x/a)**2 + (y/b)**2 + (z/c)**2) <= 1.0


    # Use SVD to decompose the matrix

    X = np.vstack(([x[inside], y[inside], z[inside]])).T

    X = X - X.mean(axis=0)

    # s returns the standard deviation, sorted descendingly

    U, s, Vh = np.linalg.svd(X)


    # Recover

    X_recovered = U @ (s * np.eye(U.shape[0], Vh.shape[0])) @ Vh

    assert np.allclose(X, X_recovered)

    ```'
