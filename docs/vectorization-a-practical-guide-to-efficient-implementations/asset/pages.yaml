  md: "```\n# tensor([[11, 13, 15],\n #         [ 4,  9, 14]])\n```\n\nNotice that\
    \ in Tensorflow's implementations, we need to specify `combiner=\"sum\"` to sum\
    \ together each embedding along the row. In contrast, `torch.nn.functional.embedding`\
    \ returns a `(batch_size, seq_len, hidden_size)` tensor, where the padding entries\
    \ are part of the output. We then need to sum along `dim=1` to combine the embeddings\
    \ together.\n\nTo complete the dense layer with the bias term, we can further\
    \ initialize a single vector $b$ whose length is equal to the embedding size.\
    \ Then, $\\bar{y} = xW + b$ is hence represented as\n\n\\(\\bar{y}_k = b_k + \\\
    sum_{i \\in s} E_{i,k}\\) (8.2)\n\nwhere $i$ is the index of the item along each\
    \ row (where a row may contain a variable number of items), and $k$ is the index\
    \ of the embedding vector.\n\n# ## 8.5.2 Inputs with Weights\n\nIf each item in\
    \ the input vector is also weighted by a weight $w$, then we can modify the above\
    \ dense layer implementation as\n\n\\(y_k = b_k + \\sum_{i \\in s} w_i \\cdot\
    \ E_{i,k}\\) (8.3)\n\nFollowing the above example, suppose items 1 and 2 are weighted\
    \ by 1.3 and 2.7, respectively, then the input $x$ is modified to become\n\n$x\
