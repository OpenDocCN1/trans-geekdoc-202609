    \ elements\n# same shape as X\ncondition = X % 2 == 1\n\n# Extract the odd elements\n\
    X[condition]\n# array([5, 3, 9, 7, 11])\n```\n\nIn Chapter 5, we will introduce\
    \ the concept of masking. In fact, selecting elements from a tensor-based on a\
    \ boolean condition can also be considered as a boolean masking operation (i.e.\
    \ removing unselected elements).\n\nOn the other hand, we can also find the indices\
    \ of the boolean conditions, using the .where operation. Consider the same 2D\
    \ matrix as above, we can find the indices of the odd numbers in the matrix using\n\
    \n```\nimport numpy as np\n\nX = np.array([\n    [5, 2, 8, 3],\n    [4, 9, 6,\
    \ 7],\n    [8, 11, 12, 10]\n])\n\n# indices of odd elements\nrow_index, col_index\
    \ = np.where(X % 2 == 1)\n\n# row_index: array([0, 0, 1, 1, 2])\n# col_index:\
    \ array([0, 3, 1, 3, 1])\n```\n\nNote that the np.where function returns two outputs,\
    \ corresponding to the indices of the odd numbers along each dimension. In general,\
    \ for a D-dimensional tensor, np.where will return D arrays of indices, corresponding\
