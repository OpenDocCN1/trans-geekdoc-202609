  md: "Tensorflow uses Protocol Buffers [Google, 2023] (protobuf) to serialize the\
    \ structured data into a sequence of bytes. The serialized byte strings can then\
    \ be compressed and stored in the TFRecord format, a row-based data storage format\
    \ that supports distributed data processing, transformation, shuffling, and batching\
    \ via the tf.data API. Suppose we have the following batch of data with three\
    \ features:\n\n```\nimport os\nimport tempfile\nimport tensorflow as tf\ninputs\
    \ = [\n    {\"student_id\": \"a-153249\", \"num_classes_taken\": 5, \"gpa\": 3.97},\n\
    \    {\"student_id\": \"b-132429\", \"num_classes_taken\": 3, \"gpa\": 3.51},\n\
    \    {\"student_id\": \"a-293841\", \"num_classes_taken\": 4, \"gpa\": 4.00},\n\
    \    {\"student_id\": \"c-912431\", \"num_classes_taken\": 4, \"gpa\": 3.91},\n\
    \    {\"student_id\": \"c-924145\", \"num_classes_taken\": 3, \"gpa\": 3.20},\n\
    ]\n```\n\nWe recognize that student_id is a string feature, num_classes_taken\
    \ is an integer feature, and gpa is a float feature. We can then put this data,\
    \ one row at a time, into the tf.train.Example protobuf,\n\n```\n# Create the\
    \ Features protobuf\nexamples = []\nfor x in inputs:\n    # Create the dictionary\n\
    \    feature = {\n        \"student_id\": tf.train.Feature(\n            bytes_list=tf.train.BytesList(\n\
    \                value=[bytes(x[\"student_id\"], \"utf-8\")]\n            )\n\
    \        ),\n        \"num_classes_taken\": tf.train.Feature(\n            int64_list=tf.train.Int64List(value=[x[\"\
    num_classes_taken\"]])\n        ),\n        \"gpa\": tf.train.Feature(\n     \
    \       float_list=tf.train.FloatList(value=[x[\"gpa\"]])\n        )\n    }\n\n\
    \    # Create the Examples protobuf\n    example = tf.train.Example(features=tf.train.Features(feature=feature))\n\
    \    examples.append(example)\n\n# print the last example\n# print(example)\n\n\
    # features {\n#   feature {\n```"
