- pgno: 146
  md: "# ### 4.3.1 Heuristics of tensordot Operations\n\nNotice from the above examples\
    \ that the shape of the output tensor from `tensordot` operations varies when\
    \ the `axes` argument changes. Different integer values of the `axes` argument\
    \ seem to dictate different tensor multiplication behaviors. But we can derive\
    \ a general rule of thumb by inductive reasoning.\n\nWhen `axes=0`, given two\
    \ vector inputs `(m, )`, and `(n, )`, we have seen that the resulting tensor has\
    \ shape `(m, n)`, as if an outer product is taken. In general, when given two\
    \ tensors `a` with shape `(m, n, ...)` and `b` with shape `(p, q, ...)`, the tensordot\
    \ with `axes=0` has shape of `(m, n, ..., p, q, ...)`. This is as if every single\
    \ element from tensor `a` is multiplying with every single element from tensor\
    \ `b` to form the final tensor without summation to reduce any dimensions. Figure\
    \ 4.2 illustrates this generalization. The following code snippet demonstrates\
    \ an example of this heuristic:\n\n```\na = np.random.rand(2, 3, 4, 5)\nb = np.random.rand(6,\
    \ 7, 8)\nnp.allclose(\n    np.tensordot(a, b, 0).shape,\n    [2, 3, 4, 5, 6, 7,\
    \ 8]\n)\n```\n\n![](img/e891acaacd4fb5b80dab2ed824618203_146_0.png)\n\n**Figure\
    \ 4.2** Illustration of `tensordot` operations when `axes=0`. (a) For a pair of\
    \ 1D vectors of shapes `(5, )` and `(4, )`, a combination of each element between\
    \ the two vectors forms the outer product, having shape `(5, 4)`. (b) Adding one\
    \ row dimension in the first input, the problem becomes the tensordot operation\
    \ between a matrix of shape `(2, 5)` and a vector of shape `(4, )`. Hence, the\
    \ resulting tensor has shape `(2, 5, 4)` (notice that singleton dimensions would\
    \ be squeezed out). (c) Adding one additional column dimension in the second input\
    \ forms a problem of tensordot between a matrix of shape `(2, 5)` and one of `(4,\
    \ 2)`. Then, the resulting tensor has shape `(2, 5, 4, 2)`."
  merge: -1
  img_proc: true
- pgno: 147
  md: "When axes=1, we have seen that when the two inputs are 1D vectors, the dot\
    \ product (which is a scalar) of the two tensors is returned. In general, given\
    \ tensors a of shape (m, n, ..., i) and b of shape (i, ..., p, q, ...), the tensor\
    \ dot product with of the two tensors with axes=1 has shape (m, n, ..., p, q,\
    \ ...), where the last dimension of a and first dimension of b are reduced together.\
    \ This is as if we are performing a series of dot products between combinations\
    \ of two vector batches. Figure 4.3 illustrates examples of this generalization.\
    \ The following code snippet demonstrates an example of this heuristic:\n\n```\n\
    a = np.random.rand(2, 3, 4, 5)\nb = np.random.rand(5, 6, 7)\nnp.allclose(\n  \
    \  np.tensordot(a, b, 1).shape,\n    [2, 3, 4, 6, 7]\n)\n```\n\nWhen axes=2, the\
    \ two input tensors must have at least two dimensions. We have seen that the double\
    \ tensor contraction operation can be performed when given two matrices. In general,\
    \ given tensors a of shape (m, n, ..., i, j) and b of shape (i, j, ..., p, q,\
    \ ...), the tensor dot product between a and b with axes=2 has the shape (m, n,\
    \ ..., p, q, ...), where the last two dimensions of a and first two dimensions\
    \ of b are contracted. Figure 4.4 illustrates examples of this generalization.\
    \ The following code snippet demonstrates an example of this heuristic:\n\n```\n\
    a = np.random.rand(2, 3, 4, 5)\nb = np.random.rand(4, 5, 6, 7)\nnp.allclose(\n\
    \    np.tensordot(a, b, 2).shape,\n    [2, 3, 6, 7]\n)\n```\n\nAfter exploring\
    \ the above heuristics for when axes=0, axes=1 and axes=2, we may derive a more\
    \ general rule for when axes is an integer argument: given the first input tensor\
    \ a has shape (m, n, ..., s1, s2, ..., sk), if we would like to perform tensor\
    \ dot product with axes=k, then it is necessary to make the second input tensor\
    \ b has the shape (s1, s2, ..., sk, ..., p, q, ...). Each tensor of shape (s1,\
    \ s2, ..., sk) from the hatched tensor a is multiplied together with the tensor\
    \ of the same shape from b element-wise and then summed together to form a single\
    \ scalar. The resulting tensor will then have shape (m, n, ..., p, q, ...), with\
    \ the last k dimensions of the first input a and first k dimensions of the second\
    \ input b contracted (i.e. reduced, or summed together)."
  merge: -1
  img_proc: true
