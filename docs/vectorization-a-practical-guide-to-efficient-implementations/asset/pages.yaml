- pgno: 413
  md: '![](img/e891acaacd4fb5b80dab2ed824618203_413_0.png)


    Figure 11.7 Rotation matrix of the first nine sequence positions, given embedding
    size of 64.


    It turns out we can reformulate the rotation matrix using a complex value as


    $$\phi_p^{(i)} = \cos(p\theta_i) + \sin(p\theta_i)j$$ (11.7)


    where the imaginary number $\sqrt{-1}$ is denoted by the letter $j$ following
    the engineering convention, rather than $i$ under the mathematical convention.
    We can also treat the pair of values as a complex number, i.e.


    $$x_p^{(i)} = x_1^{(i)} + x_2^{(i)}j$$ (11.8)


    Then, it can be shown that


    $$\begin{aligned} x_p^{(i)}\phi_p^{(i)} &= \left(x_1^{(i)} + x_2^{(i)}j\right)
    \left(\cos(p\theta_i) + \sin(p\theta_i)\right) \\ &= \left(x_1^{(i)}\cos(p\theta_i)
    - x_2^{(i)}\sin(p\theta_i)\right) + \left(x_1^{(i)}\sin(p\theta_i) + x_2^{(i)}\cos(p\theta_i)\right)j
    \end{aligned}$$ (11.9)'
