    We can also replace the values of a slice with a single value.


    ```

    import numpy as np

    X = np.arange(20).reshape(4, 5)

    # replacing the last column with -99

    X[:, -1] = -99

    print(X)

    # array([[ 0,  1,  2,  3, -99],

    #        [ 5,  6,  7,  8, -99],

    #        [10, 11, 12, 13, -99],

    #        [15, 16, 17, 18, -99]])

    ```


    More generally, the values assigned can be broadcasted to the elements of the
    slice:


    ```

    import numpy as np

    X = np.arange(20).reshape(4, 5)

    # replacing the last two columns with -88, -99, respectively

    X[:, -2:] = np.array([-88, -99])

    # array([[ 0,  1,  2, -88, -99],

    #        [ 5,  6,  7, -88, -99],

    #        [10, 11, 12, -88, -99],

    #        [15, 16, 17, -88, -99]])

    ```


    Lastly, we may also choose to assign different values at multiple indices we choose.


    ```

    import numpy as np

    X = np.arange(20).reshape(4, 5)

    # Assign the diagonal entries with different values

    rows = np.array([0, 1, 2, 3])

    cols = np.array([0, 1, 2, 3])

    values = np.array([-1, -2, -3, -4])

    X[rows, cols] = values

    # array([[ 1,  1,  2,  3,  4],

    #        [ 5, -2,  7,  8,  9],

    #        [10, 11, -3, 13, 14],

    #        [15, 16, 17, -4, 19]])

    ```'
