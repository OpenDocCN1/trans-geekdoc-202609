  img_proc: true
- pgno: 205
  md: "Notice for string and byte type arrays (`A_string` and `A_bytes` respectively),\
    \ the `dtype` of the displayed array has additional information. Using the string\
    \ array `A_string` as an example, other than `np.str_` corresponds to the notation\
    \ of `U` (and a `<` prefix), the `1` following the dtype notation indicates the\
    \ maximum length of the strings in the array. For example, let us construct an\
    \ array with strings of variable lengths:\n\n```\nA_string = np.array([\"1\",\
    \ \"12\", \"123\", \"1234\", \"12345\"])\n# array(['1', '12', '123', '1234', '12345'],\
    \ dtype='<U5')\n```\n\nNotice now that `dtype` becomes <U5, which indicates the\
    \ maximum length of the strings in the array is 5.\n\nThe data types of the array\
    \ can be inter-converted via `.astype` method from `np.ndarray`. For example,\
    \ to convert an array of object into an array of bytes, we can do\n\n```\nA_object\
    \ = np.array([\"a\", \"b\", \"c\", \"d\"], dtype=np.object_)\n# array(['a', 'b',\
    \ 'c', 'd'], dtype=object)\nA_object.astype(np.bytes_)\n# array([b'a', b'b', b'c',\
    \ b'd'], dtype='|S1')\n```\n\n# ## 6.1.2 Pandas String\n\nPandas [McKinney, 2010]\
    \ can handle strings either as an `object` type or as its native implementation\
    \ of string data type `pd.StringDtype` [McKinney, 2023b]. There are several ways\
    \ to initialize a Pandas column with string data.\n\n```\nimport pandas as pd\n\
    feature = [\"a\", \"b\", \"c\", \"d\"]\ndf = pd.DataFrame({\n    \"feature1\"\
    : pd.Series(feature, dtype=pd.StringDtype),\n    \"feature2\": pd.Series(feature,\
    \ dtype=\"string\"),\n    \"feature3\": pd.Series(feature, dtype=str),\n    \"\
    feature4\": pd.Series(feature, dtype=\"str\"),\n    \"feature4\": pd.Series(feature,\
    \ dtype=object),\n    \"feature5\": pd.Series(feature, dtype=\"object\")\n})\n\
    ```\n\nInspecting the DataFrame information with `df.info()`, we have\n\n```\n\
    <class 'pandas.core.frame.DataFrame'>\nRangeIndex: 4 entries, 0 to 3\n```"
