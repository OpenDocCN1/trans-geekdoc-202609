  md: "# 7.1.7 Diagonal Storage Sparse Matrix (dia_matrix)\n\ndia_matrix is the best\
    \ format to use when constructing diagonal matrices, or off-diagonal matrices.\
    \ It stores two pieces of information about the sparse matrix.\n\n+   • offsets:\
    \ An array of diagonal offsets. 0 means at the main diagonal of the matrix; a\
    \ negative value means below the main diagonal; a positive value means above the\
    \ main diagonal. The array is usually sorted ascendingly (for example below the\
    \ main diagonal, main diagonal, above the main diagonal)\n\n+   • data: K × D\
    \ matrix, where K is the number of diagonal terms, and D is the size of the main\
    \ diagonal. Note that if the diagonal is at the off-diagonal (i.e. not at the\
    \ main diagonal), then\n\n+   1. If this diagonal is below the main diagonal (offset\
    \ < 0), then trailing zeros will be added to the array to match the size of the\
    \ main diagonal array.\n\n+   2. If this diagonal is above the main diagonal (offset\
    \ > 0), then leading zeros will be added to the array to match the size of the\
    \ main diagonal array.\n\n+   3. These zero values can actually be any other values,\
    \ but they will not be part of the matrix. In the scipy.sparse.dia_matrix document\
    \ example, the dia_matrix was constructed using three identical length vectors,\
    \ placed at the diagonals [-1, 0, 1]. Although, when accessing the data via A.data,\
    \ it was shown that there were no zeros filled right after the initial construction,\
    \ casting first to coo_matrix then back to dia_matrix and access data with A.data\
    \ again will show these leading and lagging zeros.\n\nFigure 7.8 shows an example\
