    same segments are adjacent to each other. It requires the segment ids to be sorted.
    The integer values can be skipped to create 0-length entries between segments
    as the last segments can be skipped to create 0 entries between the segments with
    lengths greater than 0; it can also create 0-length entries as the last segments
    by specifying the num_segments argument. Negative segment ids will be ignored.
