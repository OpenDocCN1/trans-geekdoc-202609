    \ indices. There are two conventions to order the elements of a matrix in memory,\
    \ \"C\" and \"F\" ordering. (a) In \"C\" ordering, the matrix is stored in the\
    \ row-major convention. In this convention, values along the flat index move along\
    \ each row of the matrix, or when indexed by multi-index, from (0, 0), (0, 1),\
    \ ..., (1, 0), (1, 1), ..., to (n, 0), (n, 1), ..., (n, m). (b) In \"F\" or Fortran\
    \ order, the matrix is stored in the column-major convention. In this convention,\
    \ values along the flat index move along each column of the matrix, or when indexed\
    \ by multi-index, from (0, 0), (1, 0), ..., (0, 1), (1, 1), ..., to (0, m), (1,\
    \ m), ..., (n, m). See also the arrowed lines that indicate the order of traversal\
    \ of the flat index in each case.\n\nmulti-index (1, 2) in \"C\" ordering, but\
    \ corresponds to (0, 2) in \"F\" ordering (see Figure 3.3).\n\nIn general, we\
    \ can convert between flat index and multi-index when given the element ordering\
    \ convention \"C\" or \"F\" and the shape of the tensor. NumPy implements two\
    \ functions to help the interconversion between the two indexing systems. `np.ravel_multi_index(multi_index,\
    \ shape, order)` converts multi-indices to flat indices. Vice versa, `np.unravel_index(flat_indices,\
    \ shape, order)` converts flat indices to multi-indices given tensor shape and\
    \ order. For example, to convert from flat index to multi-index,\n\n```\nimport\
    \ numpy as np\n\nshape = [2, 3, 3, 2]\nflat_index = np.arange(0, np.prod(shape),\
    \ 3)\n\nr_multi_index = np.unravel_index(\n    flat_index, shape, order=\"C\"\n\
    )\n\nprint(np.stack([flat_index] + list(r_multi_index)).T)\n# [[ 0  0  0  0  0]\n\
