- pgno: 172
  md: '# ## 5.1.4 Use Arithmetic Operations as Boolean Operations to Apply and Combine
    Masks


    As introduced in Chapter 2, there are four major boolean operations, AND, OR,
    NOT, and XOR. When a mask tensor is expressed as booleans, we could take advantage
    of boolean operators &, |, ~, and ^, or dedicated operations such as Tensorflow''s
    logical_and, logical_or, logical_not, and logical_xor. However, masks can be created
    as numerical tensors instead of boolean tensors, so type casting is needed. If
    both our masks and data are already in numerical dtypes, it may be simpler and
    easier to combine and apply the masks using only numerical operations.


    To illustrate how boolean operations can be expressed as arithmetic operations,
    suppose we have two masks mask_a = [1, 0, 0, 1, 0] and mask_b = [0, 0, 0, 1, 1].
    If we convert them to boolean masks, then mask_a_bool = [True, False, False, True,
    False] and mask_b_bool = [False, False, False, True, True].


    The NOT operation on mask_a_bool results in B = [False, True, True, False, True],
    or converting to binary, [0, 1, 1, 0, 1]. Notice that this is simply 1 - mask_a.
    Therefore 1 - mask can be used for the NOT operation.


    The AND operation between mask_a_bool and mask_b_bool results in B = [False, False,
    False, True, False]. The AND operation yields True if and only if both elements
    from the two arrays at the corresponding index are True, or numerically, 1. We
    can multiply the two numerical masks together, yielding S = [0, 0, 0, 1, 0]. Notice
    that this corresponds well to the boolean mask B given 0 corresponds to False
    and 1 corresponds to True.


    The OR operation between mask_a_bool and mask_b_bool results in B = [True, False,
    False, True, True]. The OR operation yields True when either element from the
    two arrays at the corresponding index is True, or numerically corresponding to
    1. We can add the two numerical masks together, yielding S = [1, 0, 0, 2, 1].
    This corresponds well to the combined boolean mask, where 0 corresponds to False
