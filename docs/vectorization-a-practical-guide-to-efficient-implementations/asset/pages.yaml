    # ## 7.1 Scipy''s Sparse Matrix Classes


    scipy [Virtanen et al., 2020] implements seven different sparse matrix data structures
    under its `scipy.sparse` API [Virtanen et al., 2023]. Each sparse matrix data
    structure has its pros and cons. All seven types can be constructed from dense
    arrays (with 0s assumed to be empty for numerical data and an empty string “”
    assumed to be empty for string data). All seven types are inter-convertible from
    each other. Some are good for slicing the matrix and doing arithmetic operations,
    while others are better used for constructing the data matrix from other data
    structures. In the following sections, we will analyze each one of them.


    # ### 7.1.1 Coordinate Sparse Matrix (coo_matrix)


    `coo_matrix` is the best and fastest format for constructing a new sparse matrix
    using large arrays and row/column indices. This is probably the most intuitive
    way to store a sparse matrix: by storing its row/column coordinates, as well as
    the data at these corresponding coordinates. Once the sparse matrix is constructed,
    one can easily cast it from `coo_matrix` to other sparse matrix formats.'
