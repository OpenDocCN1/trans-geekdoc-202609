    \ duration constraints by group.\n\ntotal note duration of a measure (a.k.a. bar,\
    \ where it denotes a segment of the music that contains a fixed number of beats,\
    \ say, four beats per measure). For the example of Eyes on Me, let us assume there\
    \ are four beats per measure, and the tempo is 80 beats per minute. This means\
    \ for the sentence/lyric above that covers a total of four measures, we need to\
    \ make sure the full sentence is sung within (4 beats/measure) × (4 measures)/(80\
    \ beats/minute) = 12 seconds. In addition, in TTS and SVS modeling tasks, it is\
    \ more common to represent temporal units of the time series as “frames,” where\
    \ each frame denotes a fixed time duration, say 5 ms. This is because it is more\
    \ typical to model the audio signal as a spectrogram in the time-frequency domain,\
    \ where each frame corresponds to a temporal window used to perform the Fourier\
    \ transformation. Therefore, 12 seconds corresponds to 2400 frames or 150 frames\
    \ per beat. Lastly, we can define even finer-grained temporal constraints by groups\
    \ of words, based on the duration of the notes. In our particular example, let\
    \ us define the following six groupings (also illustrated in Figure 9.14 top):\n\
