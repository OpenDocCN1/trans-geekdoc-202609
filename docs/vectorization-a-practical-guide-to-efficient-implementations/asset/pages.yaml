  md: '# # 3.5 Assign Values at Index


    NumPy''s `np.ndarray` and PyTorch''s `torch.Tensor` are mutable, which means the
    values of the object can be updated. This behavior is similar to Python''s `list`
    class. In contrast, Tensorflow''s `tf.Tensor` is immutable [Abadi et al., 2023c],
    which is similar to Python''s tuple or set class. This may be tied to Tensorflow''s
    original operating principle which requires series of operations must be compilable
    into a computational graph before execution (i.e. graph mode), rather than executing
    as is, in place (i.e. eager mode, which is a more recent development since version
    2.0). Both NumPy''s `np.ndarray` and PyTorch''s `torch.Tensor` can be modified
    in-place (i.e. without creating a new object) by specifying the indices of the
    element to change and the values to replace. For examples,


    ```

    import numpy as np

    import tensorflow as tf

    import torch


    # Python list

    X_py = [1, 2, 3, 4]

    X_py[3] = 100 # [1, 2, 3, 100]


    # NumPy

    X_np = np.array([1, 2, 3, 4])

    X_np[3] = 100 # array([1, 2, 3, 100])


    # PyTorch

    X_torch = torch.tensor([1, 2, 3, 4])

    X_torch[3] = 100 # tensor([1, 2, 3, 100])


    # Tensorflow

    X_tf = tf.constant([1, 2, 3, 4])

    X_tf[3] = 100 # throws an error

    ```


    The last line, which attempts to assign a value to a Tensorflow `tf.Tensor`, throws
    the following error:


    ```

    TypeError: ''tensorflow.python.framework.ops.EagerTensor''

    object does not support item assignment

    ```


    To illustrate that assigning a value at a given index is an in-place operation,
    let''s look at the following example:


    ```

    import numpy as np

    X = np.array([1, 2, 3, 4])

    # create a new variable that points to X

    ```'
