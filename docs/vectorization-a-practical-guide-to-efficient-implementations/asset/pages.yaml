- pgno: 215
  md: '# 6.4 Mapping Strings to Indices


    When handling categorical features, there is a need to translate the string representations
    of the features into numerical representations. One-hot encoding and embedding
    techniques are commonly used to represent string features. To create these types
    of numerical representations, we first need to determine a list of **vocabulary**
    of the categorical feature (i.e. all valid values encountered during training
    time) and assign an ordinal number to each value of the feature. We call this
    the **index** of the categorical feature value. Much like the concept of indexing
    that we have seen in Chapter 3, we can use the vocabulary and the index to look
    up the corresponding category. From the index, we can then further create the
    one-hot encoding or look up a corresponding learned vector representation from
    an embedding table. Suppose we would like to look up integer values to some letters
    of the alphabet, we can do the following in Python:


    ```

    # create a list to store all the alphabet

    alphabet_lookup = [chr(ii+97) for ii in range(26)]

    values = ["b", "a", "c", "d", "z"]

    # using list.index to look

    index = [alphabet_lookup.index(v) for v in values]

    # [1, 0, 2, 3, 25]

    # Look up letter based on index

    retrieved_values = [alphabet_lookup[ii] for ii in index]

    # the two values list should be the same

    assert values == retrieved_values

    ```


    Various libraries for machine learning implement a so-called “lookup” method (e.g.
    tensorflow.lookup, pandas.map), which allows the users to map from string values
    to integer indices via vectorization when processing a batch of categorical features.


    # 6.4.1 NumPy np.unique


    NumPy’s np.unique can determine the unique set of values from a given array of
    strings (as well as other dtypes). When specifying the argument return_inverse=True,
    the method can also return an integer value corresponding to the lookup index
    of the unique set. For instance,


    ```

    import numpy as np

    feature = ["a", "b", "c", "b", "a"]

    ```'
