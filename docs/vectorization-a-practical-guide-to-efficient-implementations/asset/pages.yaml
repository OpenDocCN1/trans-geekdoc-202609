  md: "+   - Torch and Tensorflow's tensors can also be used in a mix. The behavior\
    \ is the same as if the Torch tensor is a NumPy tensor with respect to broadcasting.\
    \ Tensorflow's method is taking higher priority and the result is a tf.Tensor.\n\
    \n# 4.3 The tensordot Operation\n\nThe tensordot (a.k.a tensor contraction) operation\
    \ is a generalization of all of the above matrix product operations. It performs\
    \ dot product (or equivalently, element-wise multiplication followed by summation\
    \ reduction operation) along certain axes. It takes not only two inputs to be\
    \ multiplied together but also a third argument axes to indicate how many axes\
    \ (if integer argument) or along which specific pairs of axes (input a pair of\
    \ list argument) the multiplication results are summed together. Several mathematical\
    \ operations we introduced in Section 4.2 can be expressed using tensordot:\n\n\
    +   - Dot product between vectors, $a \\cdot b$, using tensordot(a, b, 1):\n\n\
    ```\n```python\na = np.random.rand(5)\nb = np.random.rand(5)\nnp.allclose(\n \
    \   np.dot(a, b),\n    np.tensordot(a, b, 1)\n)\n```\n```\n\nNote that complex\
    \ conjugate dot product vdot can be implemented by tensordot using np.tensordot(a,\
    \ b.conj(), 1)\n\n+   - Cross (outer) product between vectors, $a \\times b$,\
    \ using tensordot(a, b, 0):\n\n```\n```python\na = np.random.rand(5)\nb = np.random.rand(3)\n\
    np.allclose(\n    np.outer(a, b),\n    np.tensordot(a, b, 0)\n)\n```\n```\n\n\
    +   - 2D matrix multiplication ab:\n\n```\n```python\na = np.random.rand(5, 3)\n\
    b = np.random.rand(3, 5)\nnp.allclose(\n    np.matmul(a, b),\n    np.tensordot(a,\
    \ b, 1)\n)\n```\n```"
