    Representatives in 1984. The Class variable is a factor indicating political party
    membership, and the other 16 variables are factors indicating how the individuals
    voted on each of the 16 votes. A value of "y" means they voted in favor, a value
    of "n" means they voted against, a missing value (NA) means the individual either
    abstained or did not vote. Our goal is to train a model which can use the information
