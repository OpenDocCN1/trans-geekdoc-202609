- pgno: 271
  md: '# EQUATION 11.2


    $$\text{loss function}_{L_2}=\sum_{i=1}^{n}(y_i-\hat{y}_i)+\lambda\sum_{j=1}^{p}\beta_j^2$$


    So ridge regression learns a combination of model parameters that minimize this
    new loss function. Imagine a situation where we have many predictors. OLS might
    estimate a combination of model parameters that do a great job of minimizing the
    least squares loss function, but the L2 norm of this combination might be huge.
    In this situation, ridge regression would estimate a combination of parameters
    that have a slightly higher least squares value, but a considerably lower L2 norm.
    As the L2 norm gets smaller when model parameters are smaller, the slopes estimated
    by ridge regression will probably be smaller than those estimated by OLS.


    > **IMPORTANT** When using L2 or L1-penalized loss functions, it’s critical that
    the predictor variables are scaled first (divided by their standard deviation
    to put them on the same scale). This is because we are adding the squared slopes
    (in the case of L2 regularization), and this value is going to be considerably
    larger for predictors on larger scales (millimeters vs kilometers, for example).
    If we don’t scale the predictors first, they won’t all be given equal importance!


    If you prefer a more graphical explanation of the L2-penalized loss function (I
    know I do), take a look at figure 11.6. The x and y axes show values for two slope
    parameters, $(\beta_1)$ and $\beta_2$. The shaded contour lines represent different
    sum of squares values for different combinations of the two parameters, where
    the combination resulting in the smallest sum of squares is at the center of the
    contours. The dashed circles centered at zero represent the L2 norm multiplied
    by different values of lambda, for the combinations of $\beta_1$ and $\beta_2$,
    the dashed lines pass through.


    Notice that when lambda = 0, the circle passes through the combination of $\beta_1$
    and $\beta_2$ that minimizes the sum of squares. When lambda is increased, the
    circle shrinks symmetrically towards zero. Now, the combination of parameters
    that minimizes the penalized loss function is the combination with the smallest
    sum of squares **that lies on the circle**. Put another way, the optimal solution
    when using ridge regression is always at the intersection of the circle, and the
    ellipse around the OLS estimate. Can you see then that as we increase lambda,
    the circle shrinks and the selected combination of model parameters gets sucked
    towards zero?'
