  md: '+   i. use a selection method (such as backward search) to select combinations
    of features to train models on

    +   ii. use 10-fold cross-validation to evaluate the performance of each model

    +   3. return the best performing model for each of the three outer folds

    +   4. return the mean MSE to give us our estimate of performance


    So we can see our model building process gives us a mean MSE of 20.54, suggesting
    an mean residual error of 4.53 on the original Ozone scale (taking the square
    root of 20.54).


    # 9.2.5 Interpreting the model


    Due to their simple structure, linear models are usually quite simple to interpret,
    because we can look at the slopes for each predictor to infer how much the outcome
    variable is affected by each. However, whether these interpretations are justified
    or not depends on whether some model assumptions have been met, so in this section
    I’ll show you how to interpret the model output and generate some diagnostic plots.


    First, we need to extract the model information from our model object using the
    `getLearnerModel()` function. By calling `summary()` on the model data, we get
    an output with lots of information about our model. Take a look at code listing
    9.15.


    The "Call" component would normally tell us the formula we used to create the
    model (which variables and whether we added more complex relationships between
    them). As we built this model using mlr we, sadly, don’t get that information
    here, but the model formula here is all of the selected predictors, combined linearly
    together.


    The "Residuals" component gives us some summary statistics about the model residuals.
    Here I’m looking to see if the median is approximately zero, and that the first
    and third quartiles are approximately the same. If they aren’t, this might suggest
    the residuals are either not normally distributed, or heteroscedastic. In both
    situations, not only could this negatively impact model performance, it could
    make our interpretation of the slopes incorrect.


    The "Coefficients" component shows us a table of model parameters and their standard
    errors. The intercept is 41.8, which is the estimate of Ozone level when all other
    variables are zero. In this particular case it doesn’t really make sense for some
    of our variables to be zero (month, for example) so we won’t put too much interpretation
    into this. The estimates for the predictors are their slopes. For example, our
    model estimates that for a one-unit increase in the Temp_Sand variable, Ozone
    increases by 0.227 (holding all other variables constant). The "Pr(>|t|)" column
    contains the *p* values that, in theory, represent the probability of seeing a
