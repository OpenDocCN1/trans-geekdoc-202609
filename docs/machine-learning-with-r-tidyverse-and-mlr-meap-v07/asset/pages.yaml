    In this section, we’ll take our tuned hyperparameters, and use them to train our
    final clustering model. You’ll notice that I’m not going to use nested cross-validation
    to cross-validate the whole model-building process. While the k means algorithm
    is able to predict cluster membership for new data, it isn’t typically used as
    a predictive technique. Instead, we might use k-means to help us better define
    classes in our dataset, that we can later build classification models to make
    predictions.


    Let’s start by creating a k-means learner that uses our tuned hyperparameter values,
    using the setHyperPars() function. We then train this tuned model on our gvhdTask
    using the train() function, and use the getLearnerModel() function to extract
    the model data, so we can plot the clusters. Print the model data by calling kMeansModelData,
    and examine the output; there is a lot of useful information in the output. By
    extracting the $iter component of the object, we can see that it took only three
    iterations for the algorithm to converge (far fewer than iter.max).


    ```

    tunedKMeans <- setHyperPars(kMeans, par.vals = tunedK$x)

    tunedKMeansModel <- train(tunedKMeans, gvhdTask)

    kMeansModelData <- getLearnerModel(tunedKMeansModel)

    ```'
