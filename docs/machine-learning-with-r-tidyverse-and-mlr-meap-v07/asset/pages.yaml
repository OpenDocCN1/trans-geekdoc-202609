- pgno: 215
  md: "Experience is a great way to choose an algorithm for a particular task. But\
    \ remember we are always subject to the no free lunch theorem. You may find yourself\
    \ surprised sometimes that a simpler algorithm outperforms a more complex one,\
    \ for a particular task. So a good way of deciding which algorithm will perform\
    \ best on a particular task is to perform a *benchmarking* experiment.\n\nBenchmarking\
    \ is simple. You create a list of learners you’re interested in trying, and let\
    \ them fight it out to find the one that learns the best-performing model. Let’s\
    \ do this with our xgbTask. First I’ll create a list of learner algorithms including\
    \ k-nearest neighbors (`classif.knn`), multinomial logistic regression (`classif.LiblineaRL1LogReg`),\
    \ support vector machine (`classif.svm`), our tunedTree model we trained in the\
    \ previous chapter, and the tunedForest, and tunedXgb models we trained in this\
    \ chapter. If you no longer have the tunedTree model defined in your global environment,\
    \ re-run code listings 7.1 to 7.8 from the previous chapter.\n\n> > **NOTE** This\
    \ isn’t quite a fair comparison as the first three learners will be trained using\
    \ default hyperparameters, whereas the tree-based models have been tuned.\n\n\
    We define our cross-validation method using `makeResampleDesc()`. This time I’ve\
    \ opted for 10-fold cross-validation, repeated 5 times. It’s important to note\
    \ that mlr is clever here: while the data are partitioned randomly into folds\
    \ for each repeat, **the same partitioning** is used for every learner. Put more\
    \ plainly, for each repeat of cross-validation, each learner in the benchmark\
    \ gets exactly the same training set and test set.\n\nFinally, we use the `benchmark()`\
    \ function to run the benchmark experiment. The first argument is the list of\
    \ learners, the second argument is the name of the task, and the third argument\
    \ is the cross-validation method.\n\n# Listing 8.10 Plotting individual decision\
    \ trees\n\n```\nlearners = list(makeLearner(\"classif.knn\"),\n              \
    \  makeLearner(\"classif.LiblineaRL1LogReg\"),\n                makeLearner(\"\
    classif.svm\"),\n                tunedTree,\n                tunedForest,\n  \
    \              tunedXgb)\n\nbenchCV <- makeResampleDesc(\"RepCV\", folds = 10,\
    \ reps = 5)\n\nbench <- benchmark(learners, xgbTask, benchCV)\n\nbench\n\n   \
    \ task.id                 learner.id mmce.test.mean\n1   zooXgb              \
    \    classif.knn       0.03182\n2   zooXgb classif.LiblineaRL1LogReg       0.09091\n\
    3   zooXgb                classif.svm       0.07109\n4   zooXgb              classif.rpart\
    \       0.09891\n5   zooXgb         classif.randomForest       0.03200\n6   zooXgb\
    \              classif.xgboost       0.04564\n```"
  merge: -1
