  md: 'What did I tell you about no free lunches? The humble k-nearest neighbors is
    performing better on this task than the mighty XGBoost algorithm! Even though
    we didn''t tune it!


    # 8.6 Summary


    +   The random forest, and XGBoost algorithms are supervised learners for both
    classification and regression problems


    +   Ensemble techniques construct multiple sub-models to result in a model that
    performs better than any one of its components alone


    +   Bagging is an ensemble technique that trains multiple sub-models in parallel
    on boostrap samples of the training set. Each sub-model then votes on the prediction
    for new cases. Random forest is an example of a bagging algorithm


    +   Boosting is an ensemble technique that that trains multiple sub-models sequentially,
    where each subsequent sub-model focusses on the mistakes of the previous set of
    sub-models. AdaBoost and XGBoost are examples of boosting algorithms


    +   Benchmarking allows us to compare the performance of multiple algorithms/models
    on a single task'
