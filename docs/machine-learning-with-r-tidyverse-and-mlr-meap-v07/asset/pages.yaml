  md: 'In this section, I''ll show you what ensemble methods are and how they can
    be used to improve the performance of tree-based models. Imagine you wanted to
    know what a country''s views were on a particular issue. What would you consider
    to be a better barometer of public opinion? The opinion of a single person you
    ask on the street? Or the collective vote of many people at the ballot box? In
    this scenario, the decision tree is the single person on the street. You create
    a single model, pass it new data, and ask its opinion as to what the predicted
    output should be. Ensemble methods, on the other hand, are the collective vote.


    The idea behind ensemble methods is that instead of training a single model, you
    train multiple models (sometimes hundreds or even thousands of models). Next,
    you ask the opinion of each of those models as to what the predicted output should
    be for new data. You then consider the votes from all the models when making the
    final prediction. The idea is that predictions informed by a majority vote will
    have less variance than predictions made by a lone model.


    There are three different ensemble methods:


    +   - bootstrap aggregating

    +   - boosting

    +   - stacking


    Let''s discuss each of these in more detail.




    In this section, I''ll explain the principle of the bootstrap aggregating ensemble
    technique, and how this is used in an algorithm called random forest.


    Machine learning algorithms can be sensitive to noise resulting from outliers
    and measurement error. If noisy data exist in our training set, then our models
    are more likely to have high variance when making predictions on future data.
    How then, can we train a learner which makes use of all the data available to
    us, but can look past this noisy data and reduce prediction variance? The answer
    is to use bootstrap aggregating (or bagging for short).


    The premise of bagging is quite simple:


    +   1. decide how many sub-models you''re going to train

    +   2. for each sub-model, randomly sample cases from the training set, with replacement,
    until you have a sample the same size as the original training set

    +   3. train a sub-model on each sample of cases

    +   4. pass new data through each sub-model and let them vote on the prediction

    +   5. the modal prediction (the most frequent prediction) from all the sub-models
    is used as the predicted output'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'The most critical part of bagging is the random sampling of the cases. Imagine
    you’re playing Scrabble and have the bag of 100 letter tiles. Now imagine you
    put your hand into the bag, blindly rummage around a little, and pull out a tile
    and write down what letter you got. This is taking a random sample. Then crucially,
    you put the tile back. This is called *replacement*, and sampling with replacement
    simply means putting the values back after you’ve drawn them. This means that
    the same value could be drawn again. You continue to do this until you have drawn
    100 random samples, the same number as in the bag to begin with. This process
    is called *bootstrapping* and is an important technique in statistics and machine
    learning. Your bootstrap sample of 100 tiles should do a reasonable job of reflecting
    the frequencies of each letter in the original bag.


    So why does training sub-models on bootstrap samples of the training set help
    us? Imagine cases distributed over their feature space. Each time we take a bootstrap
    sample, as we are sampling with replacement we are more likely to select a case
    near the center of that distribution, than a case that lies near the extremes
    of the distribution. Some of the bootstrap samples may contain many extreme values,
    and make poor predictions on their own, but here’s the second crucial part of
    bagging: we *aggregate* the predictions of all these models. This simply means
    we let them all make their predictions and then take the majority vote. The effect
    of this is a sort of averaging out of all the models, which reduces the impact
    of noisy data and reduces overfitting. Bagging for decision trees is illustrated
    in figure 8.1.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_198_0.png)


    **Figure 8.1 Bootstrap aggregating (bagging) with decision trees.** Multiple decision
    trees are learned in parallel, each one trained on a bootstrap sample of cases
    from the training set. When predicting new data, each tree makes a prediction
    and the modal (most frequent) prediction wins.


    Bagging (and as we’ll learn, boosting and stacking) is a technique that can be
    applied to any supervised machine learning algorithm. Having said this, it works
    best on algorithms that tend to create low-bias, high-variance models, such as
    decision trees. In fact, there is a famous and very popular implementation of
    bagging for decision trees called *random forest*. Why is it called'
  merge: -1
  img_proc: true
