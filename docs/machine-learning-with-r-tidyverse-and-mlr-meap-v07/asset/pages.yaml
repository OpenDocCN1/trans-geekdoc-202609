  md: "Whoops! Something went wrong. What does the error message say? Hmm, it seems\
    \ we have some missing data from the Age variable, and the logistic regression\
    \ algorithm doesn’t know how to handle that. Let’s have a look at this variable\
    \ (I’m only displaying the first 60 elements to save room but you can print the\
    \ entire vector).\n\n# Listing 4.7 Counting missing values in the *Age* variable\n\
    \n```\ntitanicClean$Age[1:60]\n [1] 22.0 38.0 26.0 35.0 35.0   NA 54.0  2.0 27.0\
    \ 14.0  4.0 58.0 20.0\n[14] 39.0 14.0 55.0  2.0  NA 31.0  NA 35.0 34.0 15.0 28.0\
    \  8.0 38.0\n[27]  NA 19.0  NA  NA 40.0  NA  NA 66.0 28.0 42.0  NA 21.0 18.0\n\
    [40] 14.0 40.0 27.0  NA  3.0 19.0  NA  NA  NA  NA 18.0  7.0 21.0\n[53] 49.0 29.0\
    \ 65.0  NA 21.0 28.5  5.0 11.0\n\nsum(is.na(titanicClean$Age))\n[1] 177\n```\n\
    \nAh, we have lots of NAs (177 in fact!), which is R’s way of labeling missing\
    \ data.\n\n# 4.2.5 Dealing with missing data\n\nThere are two ways to handle missing\
    \ data:\n\n+   1. Simply exclude cases with missing data from the analysis\n+\
    \   2. Apply an *imputation* mechanism to fill in the gaps\n\nThe first option\
    \ may be valid when the ratio of cases with missing values to complete cases,\
    \ is very small. In that case, omitting cases with missing data is unlikely to\
    \ have a large impact on the performance on our model. It is a simple, if not\
    \ elegant, solution to the problem.\n\nThe second option, missing value imputation,\
    \ is the process by which we use some algorithm to estimate what those missing\
    \ values would have been, replace the NAs with these estimates, and use this imputed\
    \ dataset to train our model. There are many different ways of estimating the\
    \ values of missing data, and we’ll use more sophisticated ones throughout the\
    \ book, but for now, we’ll employ mean imputation, where we simply take the mean\
    \ of the variable with missing data, and replace missing values with that.\n\n\
    In code listing 4.8, I use mlr’s `impute()` function to replace the missing data.\
    \ The first argument is the name of the data, and the `cols` argument asks us\
    \ which columns we want to impute, and what method we want to apply. We supply\
    \ the `cols` argument as a list of the column names, separated by commas if we\
    \ have more than one. Each column listed should be followed by an = sign and the\
    \ imputation method (`imputeMean()` uses the mean of the variable to replace NAs).\
    \ I save the imputed data structure as an object, `imp`, and use `sum(is.na())`\
    \ to count the number of missing values from the data."
