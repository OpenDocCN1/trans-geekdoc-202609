- pgno: 189
  md: "> **NOTE** Ordinarily, if classes are imbalanced, I would use stratified sampling.\
    \ In this case though, as we have very few cases in some of the classes, there\
    \ are not enough cases to stratify (try it, you’ll get an error). For this example\
    \ we won’t stratify, but in situations where you have very few cases in a class\
    \ you should consider whether there is enough data to justify keeping that class\
    \ in the model.\n\n# Listing 7.6 Defining the random search\n\n```\nrandSearch\
    \ <- makeTuneControlRandom(maxit = 200)\n\ncvForTuning <- makeResampleDesc(\"\
    CV\", iters = 5)\n```\n\nFinally, let’s perform our hyperparameter tuning! To\
    \ speed things up, I first start parallelization by running `parallelStartSocket()`,\
    \ setting the number of CPUs equal to the number I have available.\n\n> **TIP**\
    \ If you want to use your computers for other things while tuning occurs, you\
    \ may wish to set the number of CPUs used to fewer than the maximum available\
    \ to you.\n\nThen, I use the `tuneParams()` function to start the tuning process.\
    \ The arguments are the same as we’ve used previously: the first is the learner,\
    \ the second is the task, resampling is the cross-validation method, par.set is\
    \ the hyperparameter space, and control is the search method.\n\n> **WARNING**\
    \ This takes about 30 seconds to run on my four-core machine.\n\nOnce it’s completed,\
    \ we stop parallelization and print our tuning results.\n\n# Listing 7.7 Performing\
    \ hyperparameter tuning\n\n```\nlibrary(parallel)\nlibrary(parallelMap)\n\nparallelStartSocket(cpus\
    \ = detectCores())\n\ntunedTreePars <- tuneParams(tree, task = zooTask,\n    \
    \                         resampling = cvForTuning,\n                        \
    \     par.set = treeParamSpace,\n                             control = randSearch)\n\
    \nparallelStop()\n\ntunedTreePars\n\nTune result:\nOp. pars: minsplit=10; minbucket=4;\
    \ cp=0.0133; maxdepth=9\nmmce.test.mean=0.0698\n```"
