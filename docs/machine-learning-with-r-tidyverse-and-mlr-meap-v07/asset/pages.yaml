- pgno: 220
  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_220_0.png)


    **Figure 9.2 Finding the least squares line through the data.** Residuals are
    the vertical distances between the cases and the line. The area of the boxes represents
    the squared residuals for three of the cases. The intercept (0) is where the line
    hits the y axis when x = 0. The slope is the change in y (y) divided by the change
    in x (x).


    Why does OLS square the distances? You may read that this is because it makes
    any negative residuals (for cases that lie below the line) positive, so they contribute
    to the sum of squares rather than subtract from it. This is a handy by-product
    of squaring certainly, but if that was true we would simply use *|residual|* to
    denote the *absolute* value (removing the negative sign). We use the squared residuals
    so that we disproportionately penalize cases that are far away from their predicted
    value.


    # 9.1.1 What if we have multiple predictors?


    So OLS finds the combination of slope and intercept that minimizes the sum of
    squares, and the line learned in this way will be the one that best fits the data.
    But regression problems are rarely as simplistic as trying to predict an outcome
    with a single predictor; what about when we have multiple predictor variables?
    Let’s add another variable to our cider pH problem: fermentation time (see figure
    9.3).'
  merge: -1
  img_proc: true
- pgno: 221
  md: "![](img/a22105d68c35e8d5bd3c7bafb4644881_221_0.png)\n\nWhen we have multiple\
    \ predictors, a slope is estimated for each (using OLS), and the contributions\
    \ of each variable are added together linearly, along with the model intercept\
    \ (which is now the value of $y$ when each predictor = 0). The slopes in linear\
    \ regression tell us how the outcome variable changes for a one-unit increase\
    \ in each predictor, *while holding all other predictors constant*. In other words,\
    \ the slopes tell us how the outcome changes when we change the predictor variables,\
    \ one at a time. For example, our two-predictor cider model would look like this:\n\
    \n$$y = \\beta_0 + \\beta_{apples} \\times apples + \\beta_{fermentation} \\times\
    \ fermentation + \\varepsilon$$\n\n> **NOTE**\n> \n> You will sometimes see linear\
    \ regression with a single predictor and regression with multiple predictors described\
    \ as *simple linear regression* and *multiple regression*, respectively. I find\
    \ this distinction a little unnecessary however, as we rarely work with only a\
    \ single predictor!\n\nWhen we have two predictors, our line becomes a surface/plane.\
    \ You can see this illustrated for our cider example in figure 9.4. When we have\
    \ more than two predictors, our plane becomes a hyperplane. Indeed, our straight\
    \ line equation can be generalized to any number of predictors as:\n\n$$y = \\\
    beta_0 + \\beta_1 x_1 + \\beta_2 x_2 \\ldots \\beta_k x_k + \\varepsilon$$\n\n\
    where there are $k$ predictors in the model. This is called the *general linear\
    \ model*, and is the central equation to all linear models. If you’re coming from\
    \ a traditional statistical modeling background, you may be familiar with $t$\
    \ tests and analysis of variance. These approaches all use the general linear\
    \ model to represent the relationships between the predictor variables and the\
    \ outcome."
  merge: -1
  img_proc: true
- pgno: 222
  md: '> **NOTE** The general linear model is *not* the same as the *generalized linear
    model*, which refers to a class of models that allow different distributions for
    the outcome variable. I’ll talk about the generalized linear model soon.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_222_0.png)


    **Figure 9.4** Representing a linear model with two predictors. Combining apple
    content and fermentation time in our linear model can be represented as a surface.
    The solid lines show the residual error for each case (its vertical distance from
    the surface).


    Do you recognize the general linear model? You saw something similar to it when
    we covered logistic regression in chapter 4. In fact, everything on the right-side
    of the equation is identical. The only difference is what was on the left-side
    of the equals sign. Recall that in logistic regression we predict the log odds
    of a case belonging to a particular class. In linear regression we simply predict
    the case’s value of the outcome variable.'
