- pgno: 376
  md: "# CHOOSING HOW THE MAP EDGES BEHAVE\n\nThe final choice we need to make is\
    \ whether we want our grid to be *toroidal* (another word to impress your friends\
    \ with). If the grid is toroidal, it means that nodes on the left edge of the\
    \ map, are connected to the nodes on the right edge (and the equivalent for nodes\
    \ on the top and bottom edges). If you were to walk off the left edge of a toroidal\
    \ map, you would reappear on the right! As nodes on the edges have fewer connections\
    \ to other nodes, their weights tend to get updated less than those of nodes in\
    \ the middle of the map. Therefore it may be beneficial to use a toroidal map\
    \ to help prevent cases from \"piling up\" on the map edges, though toroidal maps\
    \ tend to be harder for us to interpret. In this example, we will set the toroidal\
    \ argument to `FALSE` to make the final map more interpretable.\n\n# TRAINING\
    \ THE SOM WITH THE `SOM()` FUNCTION\n\nNow we’ve initialized our grid, we can\
    \ pass our tibble into the `som()` function to train our map. I start by piping\
    \ the tibble into the `select()` function to remove the species factor. As cases\
    \ are assigned to the node with the most similar weights, it’s important to scale\
    \ our variables so that variables on large scales aren’t given more importance.\
    \ To this end, I pipe the output of the `select()` function call into the `scale()`\
    \ function to center and scale each variable (see code listing 15.3).\n\nTo build\
    \ the SOM, I use the `som()` function from the kohonen package, supplying:\n\n\
    +   1. the data as the first argument\n+   2. the grid object we created in code\
    \ listing 15.2 as the second argument\n+   3. the two hyperparameter arguments:\
    \ rlen, and alpha\n\nThe rlen hyperparameter is simply the number of times the\
    \ dataset is presented to the algorithm for sampling (the number of iterations);\
    \ the default is 100. Just like in other algorithms we’ve seen, more iterations\
    \ is usually better until we get diminishing returns. I’ll show you soon how to\
    \ assess whether you’ve included enough iterations.\n\n# Listing 15.3 Training\
    \ the SOM\n\n```\nfleaScaled <- fleaTib %>%\n  select(-species) %>%\n  scale()\n\
    \nfleaSom <- som(fleaScaled, grid = somGrid, rlen = 5000,\n               alpha\
    \ = c(0.05, 0.01))\n```\n\nThe alpha hyperparameter is the learning rate, and\
    \ is a vector of two values. Remember that as the number of iterations increases,\
    \ the amount by which the weights of each node is updated, decreases? This is\
    \ controlled by alpha, where iteration 1 uses the first value of alpha, and linearly\
    \ declines down to the second value of alpha at the last iteration. The vector\
    \ `c(0.05, 0.01)` is the"
  merge: -1
  img_proc: true
- pgno: 377
  md: "default, but for larger SOMs, if you’re concerned the SOM is doing a poor job\
    \ of separating classes with subtle differences between them, you can experiment\
    \ with reducing these values to make the learning rate even slower.\n\n> **NOTE**\
    \ If you make the learning rate of an algorithm slower, you typically need to\
    \ increase the number of iterations to help it converge to a stable result.\n\n\
    # 15.2.3 Plotting the SOM result\n\nNow we’ve trained our SOM, let’s plot some\
    \ diagnostic information about it. The kohonen package comes with plotting functions\
    \ to draw SOMs, but uses base R graphics rather than ggplot2. The syntax to plot\
    \ a SOM object is `plot(x, type, shape)`, where x is our SOM object, type is the\
    \ type of plot we want to draw, and shape lets us specify if we want the nodes\
    \ to be drawn as circles or with straight edges (squares if the grid is rectangular,\
    \ hexagons if the grid is hexagonal). There are six different diagnostic plots\
    \ we can draw for our SOM, but rather than writing out the `plot()` function six\
    \ times, I define a vector with the names of the plot types, and use `walk()`\
    \ to plot them all at once.\n\n> **NOTE** We could achieve the same thing with\
    \ `purrr::map()`, but `purrr::walk()` calls a function for its side effects (such\
    \ as drawing a plot), and silently returns its input (which is useful if you want\
    \ plot an intermediate dataset in a series of operations that pipe into each other).\
    \ The convenience here is that `purrr::walk()` doesn’t print any output to the\
    \ console.\n\n> **CAUTION** The kohonen package also contains a function called\
    \ `map()`. If you have the kohonen package and the purrr package loaded, it’s\
    \ a good idea to include the package prefix in the function call (`kohonen::map()`\
    \ and `purrr::map()`).\n\nI first split the plotting device into six regions by\
    \ running `par(mfrow = c(2, 3))`.\n\n> **NOTE** I prefer to draw straight edged\
    \ plots, but the choice is aesthetic only, so experiment with setting the shape\
    \ argument to `\"round\"` and `\"straight\"`.\n\n# Listing 15.4 Plotting SOM diagnostics\n\
    \n```\n```r\npar(mfrow = c(2, 3))\n\nplotTypes <- c(\"codes\", \"changes\", \"\
    counts\", \"quality\",\n               \"dist.neighbours\", \"mapping\")\n\nwalk(plotTypes,\
    \ ~plot(fleaSom, type = ., shape = \"straight\"))\n```\n```"
