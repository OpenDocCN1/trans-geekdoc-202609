  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_10_0.png)


    **Figure 1.4** A hypothetical algorithm for learning the parameters of a straight
    line. This algorithm takes two continuous variables as inputs, and fits a straight
    line through the mean. It iteratively rotates the line until it finds a solution
    that minimises the sum of squares. The parameters of the line are output as the
    learned model.


    > **NOTE** One of the, initially confusing but eventually fun, aspects of machine
    learning is that there are a plethora of algorithms to solve the same type of
    problem. The reason for this is that different people have come up with slightly
    different ways of solving the same problem, all trying to improve upon previous
    attempts. The result of this is that, for a given task, it is our job as data
    scientists to choose which algorithm(s) will learn the best performing model.


    While certain algorithms tend to perform better than others with certain types
    of data, there is no single algorithm that will always outperform all others on
    all problems. This concept is called the *no free lunch theorem*. In other words,
    you don’t get something for nothing; you need to put some effort into working
    out the best algorithm for your particular problem. Instead, data scientists typically
    choose a few algorithms they know tend to work well for the type of data and problem
    they are working on, and see which algorithm generates the best performing model.
    We’ll see how we do this later on in the book. We can, however, narrow down our
    initial choice'
