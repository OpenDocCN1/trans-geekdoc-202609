  md: '# Additional exercise 6.3


    As the NA values in votesTib include abstention, recode these values into the
    value "a" and cross-validate a naive Bayes model including these values. Does
    this improve performance?




    # Additional exercise 6.4


    Perform another random search for the best SVM hyperparameters using nested cross-validation.
    This time, limit your search to the linear kernel (so no need to tune degree or
    gamma), search over the range 0.1 and 100 for the cost hyperparameter, and increase
    the number of iterations to 100. WARNING: This took nearly 12 minutes to complete
    on my machine!


    # 6.8 Summary


    +   • The naive Bayes and support vector machine (SVM) algorithms are supervised
    learners for classification problems

    +   • Naive Bayes uses Bayes'' rule (defined in chapter 5) to estimate the probability
    of new data belonging to each of the possible output classes

    +   • The SVM algorithm finds a hyperplane (a surface with one fewer dimensions
    than there are predictors) which best separates the classes

    +   • While naive Bayes can handle both continuous and categorical predictor variables,
    the SVM algorithm can only handle continuous predictors

    +   • Naive Bayes is computationally cheap, while the SVM algorithm is one of
    the most expensive algorithms

    +   • The SVM algorithm can use kernel functions to add an extra dimension to
    the data that helps find a linear decision boundary

    +   • The SVM algorithm is sensitive to the values of its hyperparameters, which
    must be tuned to maximize performance

    +   • The mlr package allows parallelization of intensive processes, such as hyperparameter
    tuning, by using the parallelMap package'
