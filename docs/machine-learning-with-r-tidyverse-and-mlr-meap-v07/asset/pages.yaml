  md: "time the number of ants doubles, the ant hill is x times more likely to survive.\
    \ This will give much larger and much more interpretable odds ratios.\n\n# ##\
    \ 4.5 Using our model to make predictions\n\nWe’ve built, cross-validated, and\
    \ interpreted our model, and now it would be nice to use the model to make predictions\
    \ on new data. This scenario is a little unusual in that we’ve built a model based\
    \ on a historical event, so (hopefully!) we won’t be using it to predict survival\
    \ of another Titanic disaster. Nevertheless, I want to illustrate to you how to\
