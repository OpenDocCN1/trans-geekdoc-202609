- pgno: 510
  md: 'Reinforcement learning is a cutting-edge area of machine learning research
    and application, where algorithms learn from experience by being rewarded when
    they make a good decision. Often considered alongside supervised and unsupervised
    algorithms to be the third class of machine learning algorithm, it has been used
    to create chess bots that can outwit world champion chess players. If you''re
    interested in reinforcement learning, I highly recommend Deep Learning and the
    Game of Go, by Max Pumperla and Kevin Ferguson (Manning, 2019).




    If you want to improve your R data science skills in general, as well as to become
    more proficient with tools from the tidyverse (including some we didn''t use),
    I would recommend R for Data Science, by Garrett Grolemund and Hadley Wickham
    (O''Reilly Media, Inc., 2016).


    If you want to become a ggplot2 master, then I would pick up a copy of ggplot2,
    by Hadley Wickham (Springer International Publishing, 2016).


    If your R skills are pretty good, and you want to learn more about how the language
    works and how to do more advanced programming (such as object-oriented programming),
    you''ll enjoy Advanced R, by Hadley Wickham (CRC Press, 2019). You may notice
    this guy Hadley keeps popping up. If you want to keep up to date with the R community
    and developments to the tidyverse, you can do worse than follow him.




    There were a few times during the book I mentioned that a particular algorithm
    hadn''t yet been implemented in mlr. The mlr package is meant to make your machine
    learning experience more streamlined, not less flexible, and so if there is an
    algorithm in another package (or your own), or a new performance metric you wish
    to implement, it really isn''t that hard to implement it yourself. There is a
    tutorial on how to do this (as well as other useful information and resources)
    on the mlr website: mlr.mlr-org.com/articles/tutorial/create_learner.html




    If your work will involve modeling non-linear relationships for regression tasks,
    I suggest you delve deeper into the inner workings of generalized additive models
    (GAMs). For R, a great place to do this would be in Generalized Additive Models:
    An Introduction with R by Simon Wood (Chapman and Hall/CRC, 2017).




    Ensemble methods got you excited? We only touched the surface in this book, using
    ensembles only for tree-based models. If you are convinced that ensembling can
    almost always make our models better, I suggest you dip into Ensemble Methods:
    Foundations and Algorithms by Zhi-Hua Zhou (Chapman and Hall/CRC, 2012).'
