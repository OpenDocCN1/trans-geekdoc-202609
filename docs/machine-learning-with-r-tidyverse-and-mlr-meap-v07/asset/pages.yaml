    # 18.2.2 Tuning the epsilon and minPts hyperparameters


    In this section, I’ll show you how to select sensible ranges of epsilon and minPts
    for DBSCAN, and how we can tune them manually to find the best-performing combination.


    Choosing the value of the epsilon hyperparameter is, perhaps, not obvious. How
    far away from each case should we search? Luckily, there is a heuristic method
    we can use to at least get us in the right ball park. This consists of calculating
    the distance from each point to its kth-nearest neighbor, and then ordering the
    points in a plot based on this distance. In data with regions of high and low
    density, this tends to produce a plot with a "knee" or "elbow" (depending on your
    preference) in it. The optimal value of epsilon is in or near that knee/elbow.
    As a core point in DBSCAN has minPts cases inside its epsilon, choosing a value
    of epsilon at the knee of this plot is choosing a search distance that will result
    in cases in high-density regions being considered as core points.


    We can create this plot using the kNNdistplot() function from the dbscan package.
    We need to specify the number of nearest neighbors we want to calculate the distance
    to using the k argument. But we don’t yet know what our minPts argument should
    be, so how can we set k? I usually pick a sensible value I believe is approximately
    correct (remember that minPts defines the minimum cluster size), the position
    of the knee in the plot is relatively robust to changes in k. Here, I’ve selected
    five.


    The kNNdistplot() function will create a matrix with as many rows as there are
    cases in the dataset (200), and five columns, one for the distance between each
    case, and each of its five-nearest neighbors. Each of these 200 x 5 = 1000 distances
    will be drawn on the plot.'
  merge: -1
  img_proc: true
