- pgno: 204
  md: 'don’t need to replace each case during sampling because it’s not important
    we sample cases based on their weights (like in AdaBoost), and there is little
    impact on performance. Just like for AdaBoost and random forest, it’s a good idea
    to sample the training set as it reduces variance. The proportion of cases we
    sample from the training set can be tuned as a hyperparameter.


    There are a number of gradient boosting algorithms around, but probably the most
    well known is the XGBoost (extreme gradient boosting) algorithm. Published in
    2014, XGBoost is an extremely popular classification and regression algorithm.
    Its popularity is due to how well it performs on a wide range of tasks, as it
    tends to outperform most other supervised learning algorithms. Many Kaggle (an
    online community that runs machine learning competitions) data science competitions
    have been won using XGBoost, and it has become the supervised learning algorithm
    many data scientists will try before anything else.


    While XGBoost is an implementation of gradient boosting, it has a few tricks up
    its sleeve:


    +   1. it can build different branches of each tree *in parallel*, speeding up
    model building

    +   2. it can handle missing data

    +   3. it employs *regularization*. You’ll learn more about this in chapter 11
    but it prevents individual predictors from having too large of an impact on predictions
    (this helps to prevent overfitting)


    > **TIP**  There are even more recent gradient boosting algorithms available such
    as LightGBM and CatBoost. These are not currently wrapped by the mlr package,
    so we’ll stick with XGBoost, but feel free to explore them yourself!


    # ### 8.1.3 Learning from predictions made by other models: stacking


    In this section, I’ll explain the principle of the stacking ensemble technique,
    and how this is used to combine predictions from multiple algorithms.


    Stacking is an ensemble technique that, while valuable, isn’t as commonly used
    as bagging and boosting. For this reason I won’t discuss it in a lot of detail,
    but if you’re interested in learning more, I would recommend *Ensemble Methods:
    Foundations and Algorithms* by Zhi-Hua Zhou (Chapman and Hall/CRC, 2012).


    In bagging and boosting, the learners are often (but don’t always have to be)
    *homogenous*. Put another way, all of the sub-models were learned by the same
    algorithm (decision trees). Stacking explicitly uses different algorithms to learn
    the sub-models. For example, we may choose to use the k-NN algorithm (from chapter
    3), logistic regression algorithm (from chapter 4), and the SVM algorithm (from
    chapter 6) to build three independent *base-models*. The idea behind stacking
    is that we create base models that are good at learning different patterns in
    the feature space. One model may then be good at predicting in one area of the
    feature space, but make mistakes in another area. One of the other models may
    do a good job at predicting values in an'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'area of the feature space, where the others do poorly. So here''s the key in
    stacking: the predictions made by the base models are used as predictor variables
    (along with all the original predictors) by another model: the stacked model.
    This stacked model is then able to learn from the predictions made by the base
    models to make more accurate predictions of its own.


    Stacking can be tedious and complicated to implement, but it usually results in
    improved model performance if you use base learners that are different enough
    from each other.


    I hope I''ve conveyed a basic understanding of ensemble techniques, in particular
    the random forest and XGBoost algorithms. In the next section, we''ll use these
    two algorithms to train models on our zoo task, and see which performs the best!


    > Ensemble methods like bagging, boosting, and stacking, are not strictly machine
    learning algorithms in their own right. They are algorithms which can be applied
    to other machine learning algorithms. For example, I''ve described bagging and
    boosting here as being applied to decision trees. This is because ensembling is
    most commonly applied to tree-based learners, but we could just as easily apply
    bagging and boosting to other machine learning algorithms, such as k-NN and linear
    regression.




    In this section, I''ll show you how to build a random forest model (using bootstrapping
    to train many trees and aggregating their predictions), and how to tune its hyperparameters.
    There are four important hyperparameters for us to consider:


    +   - ntree, the number of individual trees in the forest

    +   - mtry, the number of features to randomly sample at each node

    +   - nodesize, the minimum number of cases allowed in a leaf (same as minbucket
    in rpart)

    +   - maxnodes, the maximum number of leaves allowed


    As we''re aggregating the votes of many trees in random forest, the more trees
    we have, the better. There is no downside to having more trees aside from computational
    cost, and at some point, we get diminishing returns. Rather than tuning this value,
    I usually fix it to a number of trees I know fits my computational budget, usually
    several hundred to the low thousands. Then, later in this section I''ll show you
    how to tell if you''ve used enough trees, or if you can reduce your tree number
    to speed up training times.


    The other three hyperparameters, mtry, nodesize, and maxnodes will need tuning
    though, so let''s get started. We''ll continue with our zooTask that we defined
    in the last chapter (if you no longer have zooTask defined in your global environment,
    just re-run code listings 7.1, 7.2, and 7.3 from the previous chapter). The first
    thing to do is create a learner with the makeLearner() function. This time, our
    learner is "classif.randomForest".'
