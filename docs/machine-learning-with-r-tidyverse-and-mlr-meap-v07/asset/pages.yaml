  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_505_0.png)


    **Figure 20.6 Nested cross-validation.** The dataset is split into folds. For
    each fold, the training set is used to create sets of inner k-fold cross-validation.
    Each of these inner sets cross-validates a single hyperparameter value, by splitting
    the data up into training and test sets. For each fold in these inner sets, a
    model is trained using the training set and evaluated on the test set, using that
    set’s hyperparameter value. The hyperparameter from each inner cross-validation
    loop that gives the best performing model is used to train the models on the outer
    loop.


    You may see other people refer to splitting their data into a training set, test
    set, and *validation set*. I want to show you how this is just a special case
    of nested cross-validation. When using this approach, people train the model using
    the training set, using a range of hyperparameter values, and use the test set
    to evaluate the performance of these hyperparameter values. The model with the
    best-performing hyperparameter values is then given the validation set to make
    predictions on. The performance of the model on the validation set is used as
    the final indicator of the model-building process'' performance. The importance
    of this is that the validation set isn’t seen by the model during training at
    all, including during hyperparameter tuning, so there is no information leak for
    the model to learn patterns present in the validation set.


    Now look again at the schematic in figure 20.6. Can you see that splitting the
    data into a training, test, and validation set is just nested-cross-validation,
    using hold-out cross-validation for both the inner and outer loop? The reason
    I taught this to you using the "nested" nomenclature instead, is'
