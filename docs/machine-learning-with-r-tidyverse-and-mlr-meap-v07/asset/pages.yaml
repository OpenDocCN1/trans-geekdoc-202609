- pgno: 95
  md: 'is representing the fact that, on average, forgeries have lower copper content,
    so if you pick a painting at random and find it has a copper content of 7, it
    has ~ 0.99 or 99% probability of being a forgery!


    So great, we can estimate the probability of a painting being an original by using
    the logistic function. But what if we have more than one predictor variable? Because
    probabilities are bounded between zero and one, it’s difficult to combine the
    information from two predictors. For example, say the logistic function estimates
    a painting has a 0.6 probability of being an original for one predictor variable,
    and a 0.7 probability for the other predictor. We can’t simply add these estimates
    together because they would be larger than one and this wouldn’t make sense.


    Instead we can take these probabilities and convert them into their *log odds*
    (the "raw" output from logistic regression models). To understand log odds, let
    me first explain what I mean by *odds*, and the difference between odds and probability.


    The odds of a painting being an original are:


    **EQUATION 4.1**


    \[

    \text{odds} = \frac{\text{probability of being an original}}{\text{probability
    of being a forgery}}

    \]


    You may come across this written as:


    **EQUATION 4.2**


    \[

    \text{odds} = \frac{p}{1-p}

    \]


    where *p* is the probability of being an original painting (and *1 − p* is the
    probability of being a forgery).


    Odds are a convenient way of representing the likelihood of something occurring.
    They tell us how much more likely an event is to occur, than how likely it is
    *not* to occur.


    In *The Empire Strikes Back*, C3PO tells us that the odds of *"successfully navigating
    an asteroid field is approximately 3720 to 1!"* What C3PO was trying to tell Han
    and Leia, was that the probability of successfully navigating an asteroid field
    is approximately 3720 times smaller than the probability of *unsuccessfully* navigating
    it. Simply stating the odds is often a more convenient way of representing likelihood
    because we know that, for every one asteroid field'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'that was successfully navigated, 3720 were not! Additionally, whereas probability
    is bounded between zero and one, odds can take any positive value.


    > **NOTE** Despite being a highly intelligent protocol droid, C3PO got his odds
    the wrong way around (as many people do). He *should* have said the odds of successfully
    navigating an asteroid field are approximately 1 to 3720!


    Figure 4.4 shows copper content plotted against the odds of a painting being an
    original. Notice that the odds are not bounded between zero and one, and that
    they take on positive values.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_96_0.png)


    **Figure 4.4** Plotting the odds of being an original against copper content.
    The probabilities derived from the logistic function were converted into odds
    and plotted against copper content. Odds can take any positive value. The straight
    line represents a poor attempt to model a linear relationship between copper content
    and odds.


    As we can see though, the relationship between copper content of the paint, and
    the odds of a painting being an original is not linear. Instead, if we take the
    natural logarithm (log with a base of *e*, abbreviated as *ln*) of odds, we get
    the *log odds*:


    # EQUATION 4.3


    $$\log\ \text{odds} = \ln\left(\frac{p}{1-p}\right)$$'
