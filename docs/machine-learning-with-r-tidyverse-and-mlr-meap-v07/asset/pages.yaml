    In this section, I’ll show you what UMAP is, how it works, and why it’s useful.
    Uniform manifold approximation and projection, thankfully shortened to UMAP, is
    a non-linear dimension reduction algorithm like t-SNE. UMAP is state of the art,
    having only been published in 2018, and has a few benefits over the t-SNE algorithm.'
