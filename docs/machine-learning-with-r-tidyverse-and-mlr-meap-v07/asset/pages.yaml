  md: "makeFeatSelWrapper(), and supply the imputation wrapper we created as the learner.\
    \ This is the crucial step because we’re creating a wrapper with another wrapper!\
    \ I set the cross-validation method as `kFold` (defined in code listing 9.9),\
    \ and the method of searching feature combinations as `featSelControl` (defined\
    \ in code listing 9.11).\n\n# Listing 9.13 Combining imputation and feature selection\
    \ wrappers\n\n```\nimputeMethod <- imputeLearner(\"regr.rpart\")\n\nimputeWrapper\
    \ <- makeImputeWrapper(lin,\n                                   classes = list(numeric\
    \ = imputeMethod))\n\nfeatSelWrapper <- makeFeatSelWrapper(learner = imputeWrapper,\n\
    \                                     resampling = kFold,\n                  \
    \                   control = featSelControl)\n```\n\nNow, let’s cross-validate\
    \ our entire model-building process like good data scientists. After loading our\
    \ good friends the parallel and parallelMap packages, I define a task using the\
    \ ozoneClean tibble, which still contains missing data. Next, I define an ordinary\
    \ 3-fold cross-validation strategy for our cross-validation procedure. Finally,\
    \ I start parallelization with `parallelStartSocket()`, and start the cross-validation\
    \ procedure by supplying the learner (the wrapped wrapper), task, and cross-validation\
    \ strategy to the `resample()` function. This took nearly 90 seconds on my four-core\
    \ machine, so I suggest you start the process, and then read on for a summary\
    \ of what the code is doing.\n\n# Listing 9.14 Cross-validating the model building\
    \ process\n\n```\nlibrary(parallel)\nlibrary(parallelMap)\n\nozoneTaskWithNAs\
    \ <- makeRegrTask(data = ozoneClean, target = \"Ozone\")\n\nkFold3 <- makeResampleDesc(\"\
    CV\", iters = 3)\n\nparallelStartSocket(cpus = detectCores())\n\nlmCV <- resample(featSelWrapper,\
    \ ozoneTaskWithNAs, resampling = kFold3)\n\nparallelStop()\n\nlmCV\n\nResample\
    \ Result\nTask: ozoneClean\nLearner: regr.lm.imputed.featsel\nAggr perf: mse.test.mean=20.5394\n\
    Runtime: 86.7071\n```\n\nThe cross-validation process proceeds like this:\n\n\
    +   1. split the data into three-folds\n+   2. for each fold:\n+      A. use the\
    \ rpart algorithm to impute the missing values\n+      B. perform feature selection:\n\
    +         i."
