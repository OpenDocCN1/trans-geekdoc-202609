    The *heatan* variable is the amount of energy released by a certain quantity of
    fuel when it is combusted (measured in mega Joules). The *h20* variable is the
    percentage humidity in the fuel’s container. The remaining variables show how
    much ultraviolet or near-infrared light of a particular wavelength each batch
    of fuel absorbs (each variable represents a different wavelength).


    > **TIP**  To see all the tasks that come built into mlr, use `data(package =
