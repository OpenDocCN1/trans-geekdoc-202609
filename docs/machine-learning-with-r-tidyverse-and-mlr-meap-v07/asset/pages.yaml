  md: '# 2.5 What the ggplot2 package is and what it does


    In R, there are three main plotting systems:


    +   - Base graphics

    +   - lattice

    +   - ggplot2


    Arguably, ggplot2 is the most popular system among data scientists and, as it’s
    part of the tidyverse, we will use this system to plot our data throughout this
    book. The "gg" in ggplot2 stands for *grammar of graphics*, a school of thought
    that says any data graphic can be created by combining data with layers of plot
    components, such as axes, tickmarks, gridlines, dots, bars and lines. By layering
    plot components like this, you can use ggplot2 to create communicative and attractive
    plots in a very intuitive way.


    Let’s load the iris dataset that comes with R and create a scatter plot of two
    of its variables. This data was collected and published by Edgar Anderson in 1935
    and contains length and width measurements of the petals and sepals of three species
    of iris plant.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_37_0.png)


    **Figure 2.1** A scatter plot created with ggplot2. The Sepal.Length variable
    is mapped to the x aesthetic, and the Sepal.Width variable is mapped to the y
    aesthetic. A black and white theme was applied by adding the `theme_bw()` layer.


    The code to create the plot in figure 2.1 is shown in listing 2.15. The function
    `ggplot()` takes the data you supply as the first argument and the function `aes()`
    as the second (more about this in a moment). This takes the data, and creates
    a plotting environment, axis, and axis labels, based on the data.


    The `aes()` function is short for *aesthetic mappings* which, if you’re used to
    base R plotting, may be new to you. An aesthetic is a feature of a plot that can
    be controlled by a variable in the data. Examples of aesthetics include the x
    axis, y axis, color, shape, size and even transparency of the'
  merge: -1
  img_proc: true
