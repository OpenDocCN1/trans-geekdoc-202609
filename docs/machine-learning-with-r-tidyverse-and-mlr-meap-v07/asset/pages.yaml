- pgno: 225
  md: 'much y increases when x increases by one unit? Well if we recode our apple
    type variable such that Gala = 0 and Braeburn = 1, we can treat apple type as
    a continuous variable and find how much acidity changes as we go from 0 to 1.
    Take a look at figure 9.5. The intercept is the value of y when x is 0, which
    is the mean acidity when apple type = Gala. Gala is therefore said to be our *reference
    level*. The slope is the change in y with a one-unit increase in x, which is the
    difference between the mean acidity for Gala, and the mean acidity with Braeburn.
    This may feel like cheating but it works, and the slope with the least squares
    will be the one that connects the means of the categories.


    > **NOTE**  Which category you choose as the reference level makes no difference
    to the predictions made by a model, and is the first level of the factor (the
    first alphabetically by default).


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_225_0.png)


    **Figure 9.5** Finding the slope between two levels of a categorical variable
    using a dummy variable. The apple types are recoded as 0 and 1, and treated as
    a continuous variable. The slope now represents the difference in means between
    the two apple types, and the intercept represents the mean of the reference category
    (Gala).


    So recoding dichotomous (two-level) factors into a single dummy variable with
    values of 0 and 1 makes sense, but what if we have a *polytomous factor* (a factor
    with more than two levels)? Do we code them as 1, 2, 3, 4, and so on, and treat
    this as a single continuous predictor? Well this wouldn’t work because it’s unlikely
    that a single straight line would connect the means of the categories. Instead,
    we create k-1 dummy variables, where k is the number of levels of the factor.


    Take a look at the example in figure 9.6. We have four types of apple (Granny
    Smith is my favorite), and would like to predict pH based on the apple type used
    to make a particular batch. To convert our four-level factor into dummy variables
    we:


    +   1.'
  merge: -1
