- pgno: 364
  md: 'manifold. We can approximate a sphere by breaking it up into a series of flat
    surfaces that combine together (the more of these surfaces we use, the closer
    we can approximate the sphere). This is shown in the left-hand side of figure
    15.2. Imagine someone gave you a flat sheet of paper and a pair of scissors, and
    asked you to create a sphere. You might cut the sheet into the kind of shape shown
    in the right-hand side of figure 15.2. You could then fold this flat sheet of
    paper to approximate the sphere. Can you see that the flat, two-dimensional cutting
    is a lower-dimensional representation of the sphere? This is the general principal
    behind LLE, except that it tries to learn the manifold that represents the data,
    and represents it in fewer dimensions.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_364_0.png)


    **Figure 15.2** A globe is a three-dimensional manifold. We can reconstruct a
    globe as a series of linear patches that connect to one another. This three-dimensional
    manifold of a globe can be represented in two dimensions by cutting a sheet of
    paper in a certain way.


    In this chapter, I’ll show you in more detail how the SOM and LLE algorithms work,
    and how we can use them to reduce the dimensions of data collected on various
    flea beetles. I’ll also show you a particularly fun example of how LLE can "unroll"
    some complex and unusually-shaped data.


    # 15.1 What are self-organizing maps?


    In this section, I’ll explain what self-organizing maps (SOMs) are, how they work,
    and why they’re useful for dimension reduction.


    Consider the purpose of a map. Maps conveniently represent the layout of a part
    of the globe (which is not flat), in two dimensions, such that areas of the planet
    that are close to each other, are drawn close to each other on the map. This is
    a convoluted way of saying that you’ll find India drawn closer to Sri Lanka than
    to Madagascar, because they are closer to each other in space.


    The goal of a SOM is very similar, but instead of countries, towns, and cities,
    the SOM tries to represent a dataset in two dimensions, such that cases in the
    data that are more similar to each other, are drawn close to each other. The first
    step of the algorithm is to create a grid of nodes in a two-dimensional lattice
    (like the grid of bowls we created in figure 15.1).'
  merge: -1
  img_proc: true
- pgno: 365
  md: '# 15.1.1 Creating the grid of nodes


    In this section I’ll fully explain what I mean when I say the SOM algorithm creates
    a grid of nodes.


    Much like our grid of bowls we were sorting beads into in figure 15.1, the SOM
    algorithm starts by creating a grid of "nodes". For now, you really can just think
    of a node as a bowl that we will eventually put cases from the dataset into. I’ve
    used the word "grid" to help you picture the lattice structure of the nodes, but
    the word "map" is more commonly used, so we’ll use this from now on.


    The map can be made up of square/rectangular nodes, much like square grid-references
    on a map, or made up of hexagonal nodes, which fit together snugly like honeycomb.
    When the map is made of square nodes, each node is connected to four of its neighbors
    (you could say, its north, south, east, and west neighbors). When the map is made
    of hexagonal nodes, each node is connected to six of its neighbors (north-east,
    east, south-east, south-west, west, and north-west). Figure 15.3 shows two different
    ways that square and hexagonal SOM maps are commonly represented. The left-side
    representation shows each node as a circle, connected to its neighbors with lines,
    or _edges_. The right-side representation shows each node as a square or hexagon,
    connected to its neighbors across its flat sides. The dimensions of the map (how
    many rows and columns there are) needs to be decided upon by us, and I’ll show
    you how to choose an appropriate map size later in the chapter. Remember, we’re
    still thinking of these nodes as just bowls.'
  merge: -1
  img_proc: true
- pgno: 366
  md: "![](img/a22105d68c35e8d5bd3c7bafb4644881_366_0.png)\n\n**Figure 15.3 Common\
    \ graphical representations of square and hexagonal self-organizing maps.** The\
    \ top two maps show a grid of rectangular nodes that are each connected to four\
    \ neighbors. The bottom two maps show a grid of hexagonal nodes that are each\
    \ connected to six neighbors.\n\n> **NOTE**\n> \n> SOMs were created by a Finnish\
    \ computer scientist called Teuvo Kohonen, and so you will sometimes see SOMs\
    \ described as *Kohonen maps*. The SOM algorithm has been so popular, Professor\
    \ Kohonen is the most highly cited Finnish computer scientist of all time!\n\n\
    Once the map has been created, the next step is to randomly assign each node a\
    \ set of *weights*.\n\n# 15.1.2 Randomly assigning weights, and placing cases\
    \ in nodes\n\nIn this section, I’ll explain what I mean by the term \"weights\"\
    , and what they relate to. I’ll show you how these weights are randomly initialized\
    \ for every node in the map.\n\nImagine we have a dataset with three variables,\
    \ and we want to distribute the cases of this dataset across the nodes of our\
    \ map. Eventually, we hope the algorithm will place the cases in the nodes such\
    \ that similar cases are in the same node or a nearby node, and that dissimilar\
    \ cases are placed in nodes far away from each other.\n\nAfter the creation of\
    \ the map, the next thing the algorithm does is to randomly assign each node a\
    \ set of weights, one weight for each variable in the dataset. So for our example,\
    \ each node has three weights because we have three variables. These weights are\
    \ just random numbers, and you can think of them as guesses for the value of each\
    \ of the variables. If this is hard to visualize, take a look at figure 15.2.\
    \ We have a dataset containing three variables, and we are looking at"
  merge: -1
