  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_161_0.png)


    So the SVM algorithm has multiple hyperparameters to tune! I’ll show you how we
    can tune these simultaneously using mlr in section 6.5.2.




    So far, I’ve only shown you examples of two-class classification problems. This
    is because the SVM algorithm is inherently geared towards separating two classes.
    But can we use it for multiclass problems (where we’re trying to predict more
    than two classes)? Absolutely! When there are more than two classes, instead of
    creating a single SVM, we make multiple models, and let them fight it out to predict
    the most likely class for new data. There are two ways of doing this:


    +   • one versus all

    +   • one versus one


    In the one versus all (also called one versus rest) approach, we create as many
    SVM models as there are classes. Each SVM model describes a hyperplane that best
    separates one class from all'
  merge: -1
  img_proc: true
- pgno: 162
  md: '*the other classes.* Hence the name, one versus all. When we classify new,
    unseen cases, the models play a game of *winner takes all*. Put simply, the model
    that puts the new case on the "correct" side of its hyperplane (the side with
    the class it separates from all the others) wins. The case is then assigned to
    the class that model was trying to separate from the others. This is illustrated
    in the left-side plot of figure 6.8.


    In the one versus one approach, we create an SVM model for every pair of classes.
    Each SVM model describes a hyperplane that best separates one class from *one
    other class*, ignoring data from the other classes. Hence the name, one versus
    one. When we classify new, unseen cases, the models each cast a vote. For example,
    if one model separates classes A and B, and the new data falls on the B side of
    the decision boundary, that model will vote for B. This continues for all the
    models, and the majority class vote wins. This is illustrated in the right-side
    plot of figure 6.8.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_162_0.png)


    **Figure 6.8 One versus all and one versus one approaches to multi-class SVMs.**
    In the one versus all approach, a hyperplane is learned per class, separating
    it from all the other cases. In the one versus one approach, a hyperplane is learned
    for every pair of classes, separating them while ignoring the data from the other
    classes.


    Which do we choose? Well in practice, there is usually little difference in the
    performance of the two methods. Despite training more models (for more than three
    classes), the one versus one is sometimes less computationally expensive that
    one versus all. This is because, although we’re training more models, the training
    sets are smaller (because of the ignored cases). The implementation of the SVM
    algorithm called by mlr uses the one versus one approach.


    There is, however, a problem with these approaches. There will often be regions
    of the feature space in which none of the models give a clear winning class. Can
    you see the triangular space between the hyperplances in the left-side plot of
    figure 6.8? If a new case appeared inside this triangle, none of the three models
    would clearly win outright. This is a sort of classification no-man’s land. Though
    not as obvious in figure 6.8, this occurs with the one versus one approach also.


    If there is no outright winner when predicting a new case, a technique called
    *Platt Scaling* is used (named after computer scientist John Platt). Platt scaling
    takes the distances of the cases from'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'each hyperplane, and converts them into probabilities using the logistic function.
    Recall from chapter 4 that the logistic function maps a continuous variable to
    probabilities between 0 and 1. Using Platt scaling to make predictions proceeds
    like this:


    +   1. for every hyperplane (whether we use one versus all or one versus one):

    +      A. measure the distance of each case from the hyperplane

    +      B. use the logistic function to convert these distances into probabilities

    +   2. classify new data as belonging to the class of the hyperplane which has
    the highest probability


    If this seems confusing, take a look at figure 6.9. We’re using the one versus
    all approach in the figure, and have generated three separate hyperplanes (one
    to separate each class from the rest). The dashed arrows in the figure indicate
    distance in either direction, away from the hyperplanes. Platt scaling takes these
    distances, and converts them into probabilities using the logistic function (the
    class each hyperplane separates from the rest has positive distance).


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_163_0.png)


    **Figure 6.9** How Platt scaling is used to get probabilities for each hyperplane.
    This example shows a one versus all approach (also applies to one versus one).
    For each hyperplane, the distance of each case from the hyperplane is recorded
    (indicated by dashed arrows). These distances are converted into probabilities
    using the logistic function.


    When we classify new, unseen data, the distance of the new data is converted into
    a probability using each of the three "s"-shaped curves, and the one that gives
    the highest probability is what'
  merge: -1
  img_proc: true
