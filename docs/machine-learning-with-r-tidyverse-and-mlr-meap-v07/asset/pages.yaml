    Next comes the maximization step. The job of the maximization step is the update
    the parameters of the mixture model, to maximize the likelihood of the underlying
    data. This means updating the means, variances and priors of the Gaussians.


    Updating the mean of a particular Gaussian involves adding up the values of each
    case, weighted by their posterior probability for that Gaussian, and dividing
    by the sum of all the posterior probabilities. This is shown in equation 19.5.


    # EQUATION 19.5


    $$\mu_k = \frac{\sum_{i=1}^{n} p(k\mid x_i)x_i}{\sum_{i=1}^{n} p(k\mid x_i)}$$


    Think about this for a second. Cases that are close to the mean of the distribution
    will have a high posterior probability for that distribution, and so will contribute
    more to the updated mean. Cases far away from the distribution will have a small
    posterior probability, and will contribute less to the updated mean. The result
    is that the Gaussian will move towards the mean of the cases that are most probable
    under this Gaussian. You can see this illustrated in the third panel of figure
    19.1.


    The variance of each Gaussian is updated in a similar way. This time, we sum the
    difference between each case and the Gaussian’s mean, multiplied by the case’s
    posterior, then divide by the sum of posteriors. This is shown in equation 19.6.
    The result is that the Gaussian will get wider or narrower, based on the spread
    of the cases that are most probable under this Gaussian. You can also see this
    illustrated in the third panel of figure 19.1.


    # EQUATION 19.6


    $$\sigma_k^2 = \frac{\sum_{i=1}^{n} p(k\mid x_i)(x_i-\mu_k)}{\sum_{i=1}^{n} p(k\mid
    x_i)}$$'
  merge: -1
  img_proc: true
- pgno: 486
  md: 'The last thing to be updated are the prior probabilities for each Gaussian.
    As mentioned already, the new priors are calculated by dividing the sum of the
    posterior probabilities for a particular Gaussian, and dividing by the number
    of cases, as shown in equation 19.7. This means that a Gaussian for which many
    cases have a large posterior probability, will have a large prior probability.
    Conversely, a Gaussian for which few cases have a large posterior, will have a
    small prior probability. You can think of this as a soft or probabilistic equivalent
    to setting the prior equal to the proportion of cases belonging to each Gaussian.


    # EQUATION 19.7


    $$p(k)=\frac{\sum_{i=1}^{n}p(k\mid x_i)}{n}$$


    Once the maximization step is complete, we perform another iteration of the expectation
    step, this time computing the posterior probabilities for each case under the
    new Gaussians. Once this is done, we then re-run the maximization step, once again
    updating the means, variances, and priors for each Gaussian based on the posteriors.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_486_0.png)


    **Figure 19.1** The expectation-maximization algorithm for two, 1-dimensional
    Gaussians. Circles represent cases along a numberline. Two Gaussians are randomly
    initialized along the line. In the expectation step, the posterior probability
    of each case for each Gaussian is calculated (indicated by shading). In the maximization
    step, the means, variances, and priors for each Gaussian are updated based on
    the calculated posteriors. The process continues until the likelihood converges.


    This cycle of expectation-maximization continues iteratively until either a specified
    number of'
  merge: -1
  img_proc: true
- pgno: 487
  md: 'iterations is reached, or until the overall likelihood of the data under the
    model changes by less that a specified amount (called convergence).


    # 19.1.3 What if we have more than one variable?


    In this section I’ll extend what we learned about how the EM algorithm works in
    one dimension, to when we are clustering over multiple dimensions.


    It is rare to come across a univariate (one-dimensional) clustering problem. Usually,
    our datasets contain multiple variables we wish to use to identify clusters. I
    limited my explanation of the EM algorithm for Gaussian mixture models in the
    previous section, because a univariate Gaussian has only two parameters: its mean
    and variance. When we have a Gaussian distribution in more than one-dimension
    (a multivariate Gaussian), we need to describe it using its centroid, and its
    covariance matrix.


    We’ve come across centroids in previous chapters, they are simply a vector of
    means, one for each dimension/variable in the dataset. A covariance matrix is
    a square matrix whose elements are the covariance between variables. For example,
    the value in the second row, third column of a covariance matrix indicates the
    covariance between variables two and three in the data. Covariance is an unstandardized
    measure of how much two variables change together. A positive covariance means
    that as one variable increases, so does the other. A negative covariance means
    that as one variable increases, the other decreases. A covariance of zero usually
    indicates no relationship between the variables at all. We can calculate the covariance
    between two variables using equation 19.8.


    # EQUATION 19.8


    ```

    Cov(x,y) = \frac{\sum_{i=1}^n (x_i - \bar{x})(y_i - \bar{y})}{n-1}

    ```


    > While covariance is an unstandardized measure of the relationship between two
    variables, correlation is a standardized measure of the relationship between two
    variables. We can convert covariance into correlation by dividing it by the product
    of the variables'' standard deviations.


    The covariance between one variable and itself is simply that variable’s variance.
    Therefore, the diagonal elements of a covariance matrix are are variances of each
    of the variables.'
  merge: -1
  img_proc: true
- pgno: 488
  md: '> In fact, covariance matrices are often called variance-covariance matrices
    for this reason.


    So if the EM algorithm only estimated a variance for each Gaussian, in each dimension,
    the Gaussians would be perpendicular to the axes of the feature space. Put another
    way, it would force the model to assume there were no relationships between the
    variables in the data. It’s usually more sensible to assume there will be some
    degree of relationship between the variables, and so estimating the covariance
    matrix allows the Gaussians to lie diagonally across the feature space.


    > As we estimate the covariance matrix, this means that Gaussian mixture model
    clustering is insensitive to variables on different scales. Therefore, we don’t
    need to scale our variables before training the model.


    So when we’re clustering over more than one dimension, the EM algorithm randomly
    initializes the centroid, covariance matrix, and prior for each Gaussian. It then
    calculates the posterior probability for each case, for each Gaussian in the expectation
    step. In the maximization step, the the centroid, covariance matrix, and prior
    probability are updated for each Gaussian. The EM algorithm continues to iterate
    until either the maximum number of iterations is reached, or the algorithm reaches
    convergence. The EM algorithm for a bivariate case is illustrated in figure 19.2.'
  merge: -1
  img_proc: true
- pgno: 489
  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_489_0.png)


    **Figure 19.2** The expectation-maximization algorithm for two, 2-dimensional
    Gaussians. Two Gaussians are randomly initialized in the feature space. In the
    expectation step, the posterior probabilities for each case are calculated for
    each Gaussian. In the maximization step, the centroids, covariance matrices, and
    priors are updated for each Gaussian based on the posteriors. The process continues
    until the likelihood converges.'
  merge: -1
  img_proc: true
- pgno: 490
  md: '# SIDEBAR


    # The mathematics for the multivariate case


    The equations for updating the means and (co)variances are a little more complicated
    than those we encountered in the univariate case. If you’re interested though,
    here they are.


    The mean of Gaussian \(k\) for variable \(a\) is:


    $$\mu_{k,a}=\sum_{i=1}^{n}\left(\frac{p(k\mid x_i)}{n\times p(k)}\right)x_{i,a}$$


    The centroid of the Gaussian is therefore just a vector where each element is
    the mean of a different variable.


    The covariance between variables \(a\) and \(b\) for Gaussian \(k\) is:


    $$(\Sigma_k)_{a,b}=\sum_{i=1}^{n}\left(\frac{p(k\mid x_i)}{n\times p(k)}\right)(x_{i,a}-\mu_{k,a})(x_{i,b}-\mu_{k,b})$$


    where \(\Sigma_k\) is the covariance matrix for Gaussian \(k\).


    Finally, in the multivariate case, the likelihood \(p(x_i\mid k)\) now needs to
    take into account the covariance, and so it now becomes:


    $$p(x_i\mid k)=\frac{1}{\sqrt{2\pi}\,\Sigma_k}e^{-0.5(\vec{x_i}-\vec{\mu_k})^T\Sigma_k^{-1}(\vec{x_i}-\vec{\mu_k})}$$


    Does this process seem familiar to you? Iteratively updating the position of the
    clusters based on how far away cases in the data are from them? We saw a similar
    procedure for the k-means algorithms in chapter 16. Gaussian mixture model clustering
    therefore extends k-means clustering to allow non-spherical clusters or different
    diameters (due to the covariance matrix) and soft clustering. In fact, if you
    were to constrain a Gaussian mixture model such that all clusters had the same
    variance, no covariance, and equal priors, you would get a very similar result
    as provided by Lloyd’s algorithm!'
  merge: -1
  img_proc: true
- pgno: 491
  md: "# 19.2 Building our first Gaussian mixture model for clustering\n\nIn this\
    \ section, I’ll show you how to build a Gaussian mixture model for clustering.\
    \ We’ll continue using the swiss banknote dataset so you can compare the results\
    \ to the DBSCAN and OPTICS clustering results. An immediate advantage of mixture\
    \ model clustering over DBSCAN and OPTICS is that it is invariant to variables\
    \ on different scales, and so there’s no need to scale our data first.\n\n> **NOTE**\n\
    > \n> For correctness, I should say that there’s no need to scale our data as\
    \ long as we make no prior specification of the covariances of the model components.\
    \ It’s possible to specify our prior beliefs of the means and covariances of the\
    \ components, though we won’t do that here. If we were to do this, it would be\
    \ important the covariances consider the scale of the data.\n\nThe mlr package\
    \ doesn’t have an implementation of the mixture modeling algorithm we’re going\
    \ to use, so instead we’re going to use functions from the mclust package. Let’s\
    \ start by loading this.\n\n```\n```r\nlibrary(mclust)\n```\n```\n\nThere are\
    \ a few things I particularly like about using the mclust package for clustering.\
    \ The first is that it’s the only R package I know of that prints a cool logo\
    \ to the console when you load it. The second is that it displays a progress bar\
    \ to indicate how much longer your clustering will take (very important for judging\
    \ whether there’s time for a cup of tea). The third thing I like is that its function\
    \ for fitting the model will automatically try a range of cluster numbers, and\
    \ try to select the best fitting number. We can also manually specify the number\
    \ of clusters if we think we know better.\n\nLet’s use the `Mclust()` function\
    \ to perform the clustering, then call `plot()` on the results. Plotting the `Mclust()`\
    \ output does something a little odd (and irritating as far as I’m concerned).\
    \ It prompts us to enter a number from one to four corresponding to one of the\
    \ following options:\n\n+   1. BIC\n+   2. classification\n+   3. uncertainty\n\
    +   4. density\n\nEntering the number will draw the corresponding plot, each of\
    \ which contains useful information. Let’s look at each of these plots in turn."
  merge: -1
  img_proc: true
- pgno: 492
  md: '# Listing 19.1 Performing and plotting mixture model clustering


    ```

    ```r

    swissMclust <- Mclust(swissTib)


    plot(swissMclust)

    ```

    ```


    The first plot available to us shows the *Bayesian information criterion* (BIC)
    for the range of cluster numbers and model types the `Mclust()` function tried.
    This plot is shown in figure 19.3. The BIC is a metric for comparing the fit of
    different models, that penalizes us for having too many parameters in the model.
    The BIC is usually defined as in equation 19.9.


    **EQUATION 19.9**


    \[

    BIC = \ln(n)p - 2\ln(L)

    \]


    where *n* is the number of cases, *p* is the number of parameters in the model,
    and *L* is the overall likelihood of the model.


    Therefore, for a fixed likelihood, as the number of parameters increase, so the
    BIC increases. Conversely, for a fixed number of parameters, as the model likelihood
    increases, so the BIC decreases. Therefore the smaller the BIC, the better and/or
    more parsimonious our model is. Imagine we had two models, each of which fit the
    dataset equally well, but one has three parameters and the other has ten, the
    model with three parameters will have the lower BIC.


    The form of BIC shown in the plot is actually sort of the other way around, and
    takes the form shown in equation 19.10. After being rearranged this way, better
    fitting and/or more parsimonious models will actually have a higher BIC value.


    **EQUATION 19.10**


    \[

    BIC = L - 0.5 \times p \times \ln(n)

    \]


    So we know what the BIC is and how to interpret it, but what are all the lines
    in figure 19.3? Well the `Mclust()` function tries a range of cluster numbers
    for us, for a range of different model types. For each combination of model type
    and cluster number, the function evaluates the BIC. This information is conveyed
    in our BIC plot. But what do I mean when I say "model types"? I didn’t mention
    anything about this when I showed you how Gaussian mixture models work. When we
    train a mixture model, it’s possible to put constraints on the covariance matrix
    to reduce the number of parameters needed to describe the model. This can help
    to prevent us from overfitting the data.'
  merge: -1
  img_proc: true
- pgno: 493
  md: 'Each of the model types is represented by a different line in figure 19.3,
    and each has a strange three-letter code identifying it. The first letter of each
    code refers to the *volume* of each Gaussian, the second letter refers to the
    *shape*, and the third letter refers to the *orientation*. Each of these components
    can take one of:


    +   1. "E" for equal

    +   2. "V" for variable


    and the shape and orientation components can also take a value of "I" for identity.
    Models with an E for the volume component will have Gaussians with equal volume,
    whereas those with a V allow their Gaussians to have different volumes. Models
    with an E for shape will have Gaussians with equal aspect ratios, whereas those
    with a V allow their Gaussians to have different aspect ratios, and those with
    an I constrain the clusters to be perfectly spherical. Models with an E for the
    orientation component will have Gaussians with the same orientation through the
    feature space, whereas those with a V allow their Gaussians to have different
    orientations, and those with an I constrain their clusters to be orthogonal to
    the axes of the feature space.


    So really, the `Mclust()` function is performing a tuning experiment for us, and
    will automatically select the model with the highest BIC value. In this case,
    the best model is the one that uses the VVE covariance matrix, with three Gaussians
    (use `swissMclust$modelName` and `swissMclust$G` to extract this information).


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_493_0.png)


    **Figure 19.3** The BIC plot from our mclust model. The x axis shows the number
    of clusters, the y axis shows the Bayesian information criterion (BIC) and each
    line shows a different model, with the three letter code indicating which constraints
    are put on the covariance matrix. In this arrangement of the BIC, higher values
    indicate better fitting and/or more parsimonious models.


    So that’s plot one, which is certainly useful. Perhaps the most useful plot however
    is the one obtained from option two. This shows us our final clustering result
    from the selected model and is shown in figure 19.4. The ellipses indicate the
    covariances of each cluster, and the star at the center of each indicates its
    centroid. The model appears to fit the data well, and seems to have identified
    three, reasonably convincing clusters compared to the two identified by our DBSCAN'
  merge: -1
  img_proc: true
