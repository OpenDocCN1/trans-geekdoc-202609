- pgno: 426
  md: '+   - agglomerative

    +   - divisive


    Agglomerative hierarchical clustering is where we start with every case isolated
    (and lonely) in its own cluster, and sequentially merge clusters until all the
    data reside within a single cluster. Divisive hierarchical clustering does the
    opposite: it starts with all the cases in a single cluster, and recursively splits
    them into clusters until each case resides in its own cluster.


    # 17.1.1 Agglomerative hierarchical clustering


    In this section I’ll show you how agglomerative hierarchical clustering learns
    the structure in the data. The steps of the algorithm are quite simple:


    +   1. calculate some distance metric (defined by us) between each cluster and
    all other clusters

    +   2. merge the most similar clusters together into a single cluster

    +   3. repeat steps 1 and 2 until all cases reside in a single cluster


    Simple, right? An example of how this might look is shown in figure 17.2. We start
    off with nine cases (and therefore nine clusters). The algorithm calculates a
    distance metric (more about this soon) between each of the clusters and merges
    the clusters most similar to each other. This continues until all cases are gobbled
    up by the final, super cluster.'
  merge: -1
  img_proc: true
- pgno: 427
  md: 'Figure 17.2 Agglomerative hierarchical clustering merges clusters that are
    closest to each other at each iteration. Ellipses indicate the formation of clusters
    at each iteration, going from top left to bottom right.


    So how do we calculate the distance between clusters? The first choice we need
    to make is what kind of distance we want to compute. As usual, Euclidean and Manhattan
    distances are the most popular choices. The second choice is how we calculate
    this distance metric between clusters. Calculating the distance between two cases
    (two vectors) is reasonably obvious, but a cluster contains multiple cases; how
    do we calculate, say, Euclidean distance between two clusters? Well, we have a
    few options available to us, called linkage methods:


    +   - centroid linkage

    +   - single linkage

    +   - complete linkage

    +   - average linkage

    +   - Ward''s method


    Each of these linkage methods is illustrated in figure 17.3. Centroid linkage
    calculates the'
  merge: -1
  img_proc: true
- pgno: 428
  md: 'distance (Euclidean or Manhattan, for example) between each cluster’s centroid
    to every other cluster’s centroid. Single linkage takes the distance between the
    nearest cases between two clusters, as the distance between those clusters. Complete
    linkage takes the distance between the furthest cases between two clusters, as
    the distance between those clusters. Average linkage takes the average distance
    between all the cases between two clusters, as the distance between those clusters.


    Ward’s method is a little more complex. For every possible combination of clusters,
    Ward’s method (sometimes called Ward’s minimum variance method) calculates the
    within-cluster sum of squares. Take a look at the examples for Ward’s method in
    figure 17.3. The algorithm has three clusters to consider merging. For each candidate
    merge, the algorithm calculates the sum of squared differences between each case
    and its cluster’s centroid, then adds these sums of squares together. The candidate
    merge that results in the smallest sum of squared differences is chosen at each
    step.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_428_0.png)


    Figure 17.3 Different linkage methods to define the distance between clusters.
    Centroid linkage calculates the distance between cluster centroids. Single linkage
    calculates the smallest distance between clusters. Complete linkage calculates
    the largest distance between clusters. Average linkage calculates all pairwise
    distances between cases in two clusters and finds the mean. Ward’s method calculates
    the within-cluster sum of squares for each candidate merge, and chooses the one
    with the smallest value.'
  merge: -1
  img_proc: true
- pgno: 429
  md: '# 17.1.2 Divisive hierarchical clustering


    In this section I’ll show you how divisive hierarchical clustering works. Unlike
    agglomerative clustering, divisive clustering starts with all cases in a single
    cluster, and recursively divides this into smaller and smaller clusters, until
    each case resides in its own cluster. Finding the optimal split at each stage
    of clustering is a difficult task, and so divisive clustering uses a heuristic
    approach.


    At each stage of clustering, the cluster with the largest *diameter* is chosen.
    Recall from figure 16.5 that a cluster’s diameter is the largest distance between
    any two cases within the cluster. The algorithm then finds the case in this cluster
    that has the largest average distance to all the other cases in the cluster. This,
    most dissimilar cases starts its own *splinter group* (like a rebel without a
    cause). The algorithm then iterates through every case in the cluster and assigns
    cases to either the splinter group, or the original cluster, depending on which
    they are most similar to. In essence, divisive clustering applies k-means clustering
    (with k = two) at each level of the hierarchy, in order to split each cluster.
    This process repeats until all cases reside in their own cluster.


    There is only one implementation of divisive clustering, which is the DIANA (DIvisive
    ANAlysis) algorithm. Agglomerative clustering is more commonly used, and is less
    computationally expensive than the DIANA algorithm. However, mistakes made early
    on in hierarchical clustering cannot be fixed further down the tree, and so whereas
    agglomerative clustering may do better at finding small clusters, DIANA may do
    better at finding large clusters. In the rest of the chapter I’ll walk you through
    how to perform agglomerative clustering in R, but one of the exercises is to repeat
    the clustering using DIANA and compare the results.


    # 17.2 Building our first agglomerative hierarchical clustering model


    In this section I’ll show you how to build an agglomerative hierarchical clustering
    model in R. Sadly, there isn’t an implementation of hierarchical clustering wrapped
    by the mlr package, so we’re going to use the `hclust()` function from the built-in
    stats package.


    The function `hclust()`, that we’ll use to perform agglomerative hierarchical
    clustering, expects a *distance matrix* as input, rather than the raw data. A
    distance matrix contains the pairwise distances between each combination of elements.
    This distance can be any distance metric we specify, and in this situation, we’ll
    use Euclidean distance. As computing the distances between cases is the first
    step of hierarchical clustering, you might expect the `hclust()` algorithm to
    do this for us. But this two-step process of creating our own distance metric
    and then supplying it to `hclust()` does allow us the flexibility of using a variety
    of distance metrics.


    We create a distance matrix in R using the `dist()` function, supplying the data
    we want to'
  merge: -1
  img_proc: true
