  md: "# **EXERCISE 9.1**\n\nGenerate and plot filter values for the ozoneTask, but\
    \ using the default method `randomForestSRC_importance` (don’t overwrite the `filterVals`\
    \ object). Are the variables ranked in the same order of importance between the\
    \ two methods?\n\nNow that we have a way of ranking our predictors in order of\
    \ their estimated importance, we can decide how to \"skim off\" the least informative\
    \ ones. We do this using the `filterFeatures()` function, which takes the task\
    \ as the first argument, our `filterVals` object as the `fval` argument, and either\
    \ the `abs`, `per`, or `threshold` arguments. The `abs` argument allows us to\
    \ specify the absolute number of best predictors to retain. The `per` argument\
    \ allows us to specify a top percentage of best predictors to retain. The `threshold`\
    \ argument allows us to specify a value of our filtering metric (in this case,\
    \ correlation coefficient) that a predictor must exceed in order to be retained.\
    \ We *could* manually filter our predictors using one of these three methods.\
    \ This is shown in code Listing 9.7 but I’ve commented the lines out because we’re\
    \ not going to do this. Instead we can wrap together our learner (linear regression)\
    \ and the filter method so that we can treat any of `abs`, `per` or `threshold`\
    \ as hyperparameters and tune them!\n\n# Listing 9.7 Manually selecting which\
    \ features to drop\n\n```\n```r\n#ozoneFiltTask <- filterFeatures(ozoneTask,\n\
    #                                 fval = filterVals, abs = 6)\n#ozoneFiltTask\
    \ <- filterFeatures(ozoneTask,\n#                                 fval = filterVals,\
    \ per = 0.25)\n#ozoneFiltTask <- filterFeatures(ozoneTask,\n#                \
    \                 fval = filterVals, threshold = 0.2)\n```\n```\n\nTo wrap together\
    \ our learner and filter method, we use the `makeFilterWrapper()` function, supplying\
    \ the linear regression learner we defined as the `learner` argument, and our\
    \ filter metric as the `fw.method` argument.\n\n> **CAUTION** Confusing terminology\
    \ alert! We are still using the **filter method** for feature selection. It’s\
    \ unfortunately confusing that we are making a \"filter wrapper\", but this is\
    \ not the **wrapper method** for feature selection. We will cover this shortly!\n\
    \n# Listing 9.8 Creating a filter wrapper\n\n```\n```r\nfilterWrapper = makeFilterWrapper(learner\
    \ = lin,\n                                  fw.method = \"linear.correlation\"\
    )\n```\n```\n\nWhen we wrap together a learner and preprocessing step, the hyperparameters\
    \ for both become available for tuning as part of our wrapped learner. In this\
    \ situation, it means we can tune either the `abs`, `perc`, or `threshold` hyperparameters\
    \ using cross-validation, to select the"
