    packaged with mlr. These include methods such as imputeMean(), imputeMedian(),
    and imputeMode() (for replacing missing values with the mean, median and mode
    of each variable, respectively). But the most important method is the one last
    on the list: imputeLearner(). The imputeLearner() function lets us specify a supervised
