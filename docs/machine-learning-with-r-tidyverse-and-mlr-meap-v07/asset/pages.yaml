  md: "profile of this plot flatten out before we reach our maximum number of iterations,\
    \ which is seems to in this case. If we felt the plot hadn’t leveled out yet,\
    \ we should increase the number of iterations.\n\nThe counts plot is a heatmap,\
    \ showing us the number of cases assigned to each node. In this plot we’re looking\
    \ to see that we don’t have lots of empty nodes (suggesting the map is too big),\
    \ and that we have a reasonably even distribution of cases across the map. If\
    \ we had lots of cases piled up at the edges, we might consider increasing the\
    \ map dimensions, or training a toroidal map instead.\n\nThe quality map shows\
    \ the mean distance between each case, and the weights of its BMU. The lower this\
    \ value is, the better.\n\nThe distance map shows the sum of distances between\
    \ cases in one node, and cases in the neighboring nodes. You’ll sometimes see\
    \ this referred to as a *U matrix plot*, and can be useful in identifying clusters\
    \ of cases in the map. As cases on the edge of a cluster of nodes have a higher\
    \ distance to cases in an adjacent cluster of nodes, high distance nodes tend\
    \ to separate clusters. This often looks like dark regions of the map (potential\
    \ clusters) separated by light regions. It’s difficult in a map as small as this\
    \ to interpret this plot, but it appears as though we may have clusters on the\
    \ left and right edges of the map, and possibly a cluster at the top-center of\
    \ the map.\n\nFinally, the mapping plot shows us the distribution of cases among\
    \ the nodes. Note that the position of a case within a node doesn’t mean anything,\
    \ they are just dodged (moved a small random distance) so that they don’t all\
    \ sit on top of each other.\n\nThe codes plot is a useful way of visualizing the\
    \ weights of each node, but it becomes difficult to read when you have many variables,\
    \ and doesn’t give an interpretable indication of magnitude. Instead, I prefer\
    \ to create heatmaps, one for each variable. I use the `getCodes()` function to\
    \ extract the weights for each node, where each row is a node and each column\
    \ is a variable, and convert this into a tibble. Look at code listing 15.5 to\
    \ see how I then create a separate heatmap for each variable, this time using\
