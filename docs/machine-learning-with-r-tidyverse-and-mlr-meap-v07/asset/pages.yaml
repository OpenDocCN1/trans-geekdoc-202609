  md: 'problem. Another example could be building a model that will guide doctors
    to use an unpleasant treatment, or not, for a patient. In the context of this
    problem, it may be acceptable to incorrectly not give a patient the unpleasant
    treatment, but it is imperative that you don’t incorrectly give a patient the
    treatment who doesn’t need it!


    If positive events are rare (as in our fraudulent credit card example), or if
    it is particularly important that you don’t misclassify positive cases as negative,
    you should favor models that have a low false negative rate. If negative events
    are rare, or if it is particularly important that you don’t misclassify negative
    cases as positive (as in our medical treeatment example), you should favor models
    that have a low false positive rate.


    Take a look at mlr.mlr-org.com/articles/tutorial/measures.htm l to see all the
    performance measures currently wrapped by mlr, and the situations in which they
    can be used.




    I mentioned at the start of the chapter that logistic regression is very popular
    because of how interpretable the model parameters (the y intercept, and the slopes
    for each of the predictors) are. To extract the model parameters, we must first
    turn our mlr model object, logRegModel into an R model object using the getLearnerModel()
    function. Next, we pass this R model object as the argument to the coef() function,
    which stands for "coefficients" (another term for parameters), and so so this
    function returns the model parameters.




    ```

    logRegModelData <- getLearnerModel(logRegModel)

    coef(logRegModelData)

    ```


    (Intercept) Pclass2 Pclass3 Sexmale Age

    3.809661697 -1.000344806 -2.132428850 -2.775928255 -0.038822458

    Fare FamSize

    0.003218432 -0.243029114


    The intercept is the log odds of surviving the Titanic disaster when all continuous
    variables are zero, and the factors are at their reference levels. We tend to
    be more interested in the slopes than the y intercept, but these values are in
    log odds units, which are difficult to interpret. Instead, people commonly convert
    them into odds ratios.


    An odds ratio is, well, a ratio of odds. For example, if the odds of surviving
    the Titanic if you’re female are about 7 to 10, and the odds of surviving if you’re
    male are 2 to 10, then the odds ratio for surviving if you’re female is 3.5. In
    other words, if you were female, you would have been 3.5 times more likely to
    survive than if you were male. Odds ratio are a very popular way of interpreting
    the impact of predictors on an outcome because they are very easily understood.'
