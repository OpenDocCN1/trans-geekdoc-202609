- pgno: 177
  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_177_0.png)


    This all seems simple so far. But in the simplistic example above, we could have
    constructed this ourselves by hand (in fact, I did!). So tree-based models aren’t
    necessarily learned by machine learning. A decision tree could be a decided-upon
    HR process for dealing with disciplinary action, for example. You could have a
    tree-based approach to deciding which flights to buy (is the price above your
    budget, is the airline reliable, is the food terrible, and so on). So how can
    we learn the structure of a decision tree automatically for complex datasets with
    many features? Enter the rpart algorithm.


    > Tree-based models can be used for both classification and regression tasks,
    so you may see them described as classification and regression trees (CART). However,
    CART is a trademarked algorithm whose code is proprietary. The rpart algorithm
    is simply an open source implementation of CART. You’ll learn how to use trees
    for regression tasks in chapter 12.


    At each stage of the tree-building process the rpart algorithm considers all of
    the predictor variables and selects the predictor that does the best job of discriminating
    the classes. It starts at the root, and then at each branch looks again for the
    next feature that will best discriminate the classes of the cases that took that
    branch. But how does rpart decide on the best feature at each split? There are
    a few different ways this can be done, and rpart offers you two approaches: the
    difference in entropy (called the information gain) and the difference in Gini
    index (called the Gini gain). The two methods usually give very similar results,
    but the Gini index (named after the sociologist and statistician Corrado Gini)
    is slightly faster to compute and so we’ll focus on this.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '> The Gini index is the default method rpart uses to decide how to split the
    tree. If you''re concerned you''re missing the best-performing model, you can
    always compare Gini index and entropy during hyperparameter tuning.




    In this section, I''ll show you how Gini gain is calculated to find the best split
    for a particular node when growing a decision tree. Entropy and the Gini index
    are two ways of trying to measure the same thing: impurity. Impurity is a measure
    of how heterogenous the classes are within a node.


    > If a node contains only a single class (which would make it a leaf), it would
    be said to be pure.


    By estimating the impurity (with whichever method you choose) that would result
    from using each predictor variable for the next split, the algorithm can choose
    the feature that will result in the smallest impurity. Put another way, the algorithm
    chooses the feature that will result in subsequent nodes that are as homogenous
    as possible.


    So what does the Gini index look like? Have a look at the example split in figure
    7.2. We have 20 cases in a parent node belonging to two classes, A and B. We split
    the node into two leaves based on some criterion. In the left leaf we have 11
    cases from class A and 3 from class B. In the right leaf we have 5 from class
    B and 1 from class A.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_178_0.png)


    We want to know what the Gini gain of this split is. The Gini gain is the difference
    between the Gini index of the parent node, and the Gini index of the split. Looking
    at our example in figure 7.2, the Gini index for any node is calculated as:




    ```

    Gini index = 1 - p(A)^2 + p(B)^2

    ```'
