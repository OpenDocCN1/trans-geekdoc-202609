  md: '# # 11.8 Strengths and weaknesses of ridge, LASSO and elastic net


    While it often isn’t easy to tell which algorithms will perform well for a given
    task, here are some strengths and weaknesses that will help you decide whether
    ridge regression, LASSO, and elastic net will perform well for your task.


    The strengths of ridge, LASSO, and elastic net are:


    +   - They produce models that are very interpretable

    +   - They can handle both continuous and categorical predictors

    +   - They are computationally inexpensive

    +   - They often outperform OLS regression

    +   - LASSO and elastic net can perform feature selection by setting the slopes
    of uninformative predictors equal to zero

    +   - They can also be applied to generalized linear models (such as logistic
    regression)


    The weaknesses of ridge, LASSO, and elastic net are:


    +   - They make strong assumptions about the data, such as homoscedasticity (constant
    variance) and the distribution of residuals (performance may suffer if these are
    violated)

    +   - Ridge regression cannot perform feature selection automatically

    +   - LASSO cannot estimate more parameters than cases in the training set

    +   - They cannot handle missing data


    # EXERCISE — **Additional exercise 11.5**


    Create a new tibble that contains only the Yield variable, and make a new regression
    task using this data, with Yield set as the target


    +   1. Train an ordinary OLS model on this data (a model with no predictors)

    +   2. Train a LASSO model on the original IowaTask with a lambda value of 500

    +   3. Cross-validate both models using leave-one-out cross-validation (`makeResampleDesc("LOO")`)

    +   4. How do the mean MSE values of both models compare? Why?


    # EXERCISE — **Additional exercise 11.6**


    Calling `plot()` on a glmnet model object doesn’t plot model residuals.


    Install the plotmo package, and use its `plotres()` function, passing the model
    data objects for the ridge, LASSO and elastic net models, as arguments.'
