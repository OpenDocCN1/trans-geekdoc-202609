  md: '# Tidying, manipulating and plotting data with the tidyverse




    +   • What the tidyverse is

    +   • What is meant by tidy data

    +   • How to install and load the tidyverse

    +   • How to use the tibble, dplyr, ggplot2, tidyr, and purrr packages of the
    tidyverse


    I''m really excited to start teaching machine learning to you. But before we dive
    into that, I want to teach you some skills that are going to make your learning
    experience simpler and more effective. These skills are also going to improve
    your general data science and R programming skills.


    Imagine I asked you to build me a car (a typical request between friends). You
    could go old-fashioned: you could purchase the metal, glass and all the components,
    hand cut all the pieces, hammer them into shape and rivet them together. The car
    may look beautiful and work perfectly, but it would take a very long time, and
    would be hard for you to remember exactly what you did if you had to make another
    one.


    Instead, you could use a modern approach using robotic arms in your factory. You
    could program them to cut and bend the pieces to their pre-defined shapes, and
    have them assemble the pieces for you. In this scenario, building a car would
    be much faster and simpler for you, and would be easy for you to reproduce the
    same process in future.


    Now imagine I make a more reasonable request of you and ask you to reorganize
    and plot a dataset, ready for passing it through a machine learning pipeline.
    You could use base R functions'
