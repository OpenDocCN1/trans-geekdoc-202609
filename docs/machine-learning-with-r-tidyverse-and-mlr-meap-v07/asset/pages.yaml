    \n> > **NOTE**  \n> > If I had coded the grouping variable the other way around\
    \ (with forgeries being one and originals being zero), then the logistic function\
    \ would approach one for low values of copper and approach zero for high values.\
    \ We would simply interpret the output as the probability of being a forgery,\
