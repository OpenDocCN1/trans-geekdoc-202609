- pgno: 239
  md: '# THE WRAPPER METHOD FOR FEATURE SELECTION


    With the filter method, we generate univariate statistics describing how each
    predictor relates to the outcome variable. This may result in selecting the most
    informative predictors, but it isn’t guaranteed to. Instead, we can use the actual
    model we’re trying to train to determine which features help it make the best
    predictions. This has the potential to select a better-performing combination
    of predictors, but is computationally more expensive as we’re training a fresh
    model for every permutation of predictor variables.


    Let’s start by defining how we’re going to search for the best combination of
    predictors. We have four different options:


    +   - exhaustive search: this is basically a grid search. It will try every possible
    combination of predictor variables in your dataset and select the one that performs
    the best. This is guaranteed to find the best combination but can be prohibitively
    slow. For example, in our 12-predictor dataset, exhaustive search would need to
    try more than 1.3x10^9 different variable combinations!

    +   - random search: this is just like random search in hyperparameter tuning.
    We define a number of iterations and randomly select feature combinations. The
    best combination after the final iteration wins. This is usually less intensive
    (depending on how many iterations you choose), but isn’t guaranteed to find the
    best combination of features.

    +   - sequential search: from a particular starting point, we either add or remove
    features at each step that improve performance. This can be:

    +     - forward search, where we start with an empty model and sequentially add
    the feature that improves the model most until additional features no longer improve
    the performance

    +     - backward search, where we start with all the features and remove the feature
    whose removal improves the model the most until additional removals no longer
    improve the performance

    +     - floating forward search where, starting from an empty model, either adds
    one or removes one variable at each step, whichever improves the model the most,
    until neither an addition or removal improves model performance

    +     - floating backward search, which is the same as floating forward except
    we start with a full model

    +   - genetic algorithm: this method, inspired by Darwinian evolution, finds pairs
    of feature combinations that act as "parents" to "offspring" variable combinations,
    which inherit the best performing features. This method is very cool but can be
    very computationally expensive as the feature space grows


    Wow! With so many options to choose from where do we start? Well I find the exhaustive
    and genetic searches prohibitively slow for a large feature space. While the random
    search can alleviate this problem, I find a sequential search to be a good compromise
    between computational cost, and probability of finding the best performing feature
    combination. Of its different variants, you may want to experiment with the various
    options to see which results in the best-performing model. I like the floating
    versions because they consider both addition and removal at each step, so for
    this example I’m going to use floating backward selection.'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'First, I define my search method using the makeFeatSelControlSequential() function
    (wow, the mlr authors really do love their long function names). I use "sfbs"
    as the method argument to use a sequential floating backward selection. Then,
    I use the selectFeatures() function to perform the feature selection. To this
    function I supply the learner, task, cross-validation strategy we defined in code
    listing 9.9, and the search method. It’s as easy as that. When we run the function,
    every permutation of predictor variables is cross-validated using our kFold strategy
    to get an estimate of its performance. By printing the result of this process,
    we can see the algorithm selected six predictors that had a slightly lower MSE
    value than the predictors selected by our filter method in code listing 9.9.


    > To see all of the available wrapper methods and how to use them, run ?FeatSelControl.


    Now I need to warn you about a frustrating bug with regards to the sequential
    floating forward search. As of writing this book, using "sffs" as the feature
    selection method will throw this error in some circumstances: Error in sum(x)
    : invalid ''type'' (list) of argument. If you try to use "sffs" as the search
    method in our example, you may get such an error. Therefore, while this is very
    frustrating, I’ve opted to use sequential floating backward search ( "sfbs" instead).




    ```

    featSelControl <- makeFeatSelControlSequential(method = "sfbs")

    selFeats <- selectFeatures(learner = lin, task = ozoneTask,

    resampling = kFold, control = featSelControl)

    selFeats

    Feature result:

    Features (6): Month, Press_height, Humid, Temp_Sand, Temp_Monte, Inv_height

    mse.test.mean=20.4038

    ```


    Now, just like we did for the filter method, we can create a new task using the
    imputed data that contains only those selected predictors, and train a model on
    it.




    ```

    ozoneSelFeat <- ozoneImp$data[, c("Ozone", selFeats$x)]

    ozoneSelFeatTask <- makeRegrTask(data = ozoneSelFeat, target = "Ozone")

    wrapperModel <- train(lin, ozoneSelFeatTask)

    ```'
