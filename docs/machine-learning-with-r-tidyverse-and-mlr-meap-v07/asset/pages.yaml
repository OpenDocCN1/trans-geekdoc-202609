  md: 'Take a look at the example in figure 18.3. You can see two circles centered
    around the darkly-shaded case. The circle with the larger radius is epsilon, and
    the one with the smaller radius is the core distance (ε′). This example is showing
    the core distance for a minPts value of four, as the core distance has expanded
    to include four cases (including the case in question). The arrows indicate the
    reachability distance between the core point and the other cases within its epsilon.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_453_0.png)


    **Figure 18.3 Defining core distance and reachability distance.** In OPTICS, epsilon
    (ε) is the maximum search distance. Core distance (ε′) is the minimum search distance
    needed to include minPts cases (including the case in question). The reachability
    distance for a case is the larger of the core distance, and the distance between
    the case in question, and another case inside its epsilon (maximum search distance).


    As the reachability distance is the distance between one core point, and another
    core point within its epsilon, OPTICS needs to know which cases are core points.
    So the algorithm starts by visiting every case in the data and determining whether
    its core distance is smaller than epsilon. This is illustrated in figure 18.4.
    If a case’s core distance is smaller than or equal to epsilon, the case is a core
    point. If a case’s core distance is larger than epsilon (we need to expand out
    further than epsilon to find minPts cases), the case is **not** a core point.
    Examples of both are shown in figure 18.4.'
