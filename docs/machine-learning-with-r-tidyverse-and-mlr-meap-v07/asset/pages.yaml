- pgno: 511
  md: 'Excited about how support vector machines (SVMs) can contort the feature space
    to create linear boundaries? SVMs are very popular, and their theory is quite
    complex. To learn more about how you can harness their predictive power, I recommend
    Support Vector Machines, by Andreas Christmann and Ingo Steinwart (Springer, 2008).




    Sometimes, you''re not interested in the common patterns in your data. Sometimes,
    it''s the unusual, outlying cases that you''re really interested in. For example,
    you may be trying to identify fraudulent activity on a credit card, or trying
    to identify rare bursts of radiation from stars. Identifying such rare events
    in a dataset can be challenging, but an area of machine learning called anomaly
    detection is dedicated to solving these problems. Some of the algorithms you met
    in this book can be repurposed for anomaly detection, such as the SVM algorithm.
    If you have a penchant for the rare and unusual, take a look at Anomaly Detection
    Principles and Algorithms, by Kishan G. Mehrotra, Chilukuri K. Mohan, and HuaMing
    Huang (Springer, 2017).




    Something I didn''t touch on in this book is time series forecasting. This is
    the area of machine learning and statistics concerned with predicting the future
    state of a variable, based on its previous states. Common applications of time
    series forecasting are predicting fluctuations in stock market variables, and
    forecasting weather patterns. So if you want to get rich or stay dry, I would
    start with Introductory Time Series with R by Paul Cowpertwait and Andrew Metcalfe
    (Springer, 2009).




    We''ve covered pretty good ground when it comes to clustering, but there is much
    more out there for you to get your teeth into. To learn more, I recommend Data
    Clustering: Algorithms and Applications by Charu Aggarwal (Chapman & Hall/CRC,
    2013).




    Impressed at how the general linear model can be extended to predict classes like
    we did in logistic regression? In fact, we can use the same principal to predict
    count data (as in Poisson regression), or percentages (as in beta regression).
    The extended form of the general linear model to handle situations where our outcome
    is not a normally-distributed continuous variable, is called the generalized linear
    model. The generalized linear model gives us extraordinary flexibility when building
    predictive models, while still allowing complete interpretability of the model
    parameters. To learn more, I recommend Generalized Linear Models With Examples
    in R by Peter K. Dunn and Gordon K. Smyth (Springer, 2018), though you may find
    this tough if you don''t already have a good mathematical grounding in linear
    modeling.'
