  md: 'over hold-out cross-validation is that as each case is used in the test set
    once, the results are less variable, although our result will be sensitive to
    our choice of the number of folds. To make the result even more stable, we can
    use repeated k-fold cross-validation, where the whole k-fold process is repeated
    multiple times, randomly shuffling the cases around for each repetition. I’ve
    reproduced figure 3.13 here in figure 20.4, that shows a schematic illustrating
    k-fold cross-validation.


    | fold 1 | Training set | Test set |

    fold 2 | | Test set |

    fold 3 | | Test set |

    fold 4 | Test set | |

    fold 5 | Test set | | | |


    Figure 20.4 k-fold cross-validation (CV). The data is randomly split into near
    equally-sized "folds". Each fold is used as the test set once, where the rest
    of the data are used as the training set. The similarity of the predictions to
    the true values of the test set is used to evaluate model performance.


    +   1. The data are randomly split into k, equally-sized folds

    +   2. Each fold is used as the test set once, where the rest of the data make
    the training set

    +   3. For each fold, predictions are made on the test set

    +   4. The predictions are compared to the true values


    Leave-one-out cross-validation is the extreme of k-fold cross-validation, where
    the number of folds is equal to the number of cases in the dataset. In this way,
    every case in the dataset is used as the test set once, with the model being trained
    using all of the other cases. Leave-one-out cross-validation tends to give more
    variable performance estimates than k-fold, except where the dataset is small,
    in which circumstance k-fold may give more variable estimates due to the small
    training set. I’ve reproduced figure 3.14 here in figure 20.5, that shows a schematic
    illustrating leave-one-out cross-validation.'
