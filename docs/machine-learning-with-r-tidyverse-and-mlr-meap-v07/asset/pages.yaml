    as this will minimize the sum of squares. We collect more cases in our study,
    and when we plot them on the right-side plot, we can see that the first model
    we trained doesn’t generalize well to the new data. This is due to sampling error,
    which is the difference between the distribution of data in our sample of cases,
    and the distribution of data in the wider population we’re trying to make predictions
    on. In this (slightly contrived) case, because we only measured two cases, the
    sample doesn’t do a good job of representing the wider population and we learned
    a model that overfit the training set.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_267_0.png)


    Figure 11.3 Sampling error leads to models that don’t generalize well to new data.
    In the left-side example, a regression line is fit, considering only the more
    darkly-shaded cases. In the right-side example, all the cases are used to construct
    the regression line. The dotted lines help indicate the magnitude of the slope
    is larger on the left-side than on the right.


    This is why regularization comes in. While OLS will learn the model that best
    fits the training set, the training set probably isn’t perfectly representative
    of the wider population. Overfitting the training set is more likely to result
    in model parameters that are too large, so regularization adds a penalty to the
    least squares that grows bigger with larger estimated model parameters. This process
    usually adds a little bias to the model, because we’re intentionally underfitting
    the training set, but the reduction in model variance often results in a better
    model anyway. This is especially true in situations where the ratio of predictors
    to cases is large.


    > How representative your dataset is of the wider population depends on careful
    planning of your data acquisition, avoiding introducing bias with experimental
    design (or identifying and correcting for it if the data already exists), and
    ensuring your datasets are sufficiently large to learn real patterns. If your
    dataset poorly represents the wider population, no machine learning technique,
    including cross-validation, will be able to help you!


    So regularization can help prevent overfitting due to sampling error, but perhaps
    a more important use of regularization is in preventing the inclusion of spurious
    predictors. If we add predictors to an existing linear regression model, we’re
    likely to get better predictions on the'
