  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_474_0.png)


    So our clustering model seems pretty reasonable, but how stable is it? The final
    thing we’re going to do to evaluate the performance of our DBSCAN model, is to
    calculate the Jaccard index across multiple bootstrap samples. Recall from the
    previous chapter that the Jaccard index quantifies the agreement of cluster membership
    between clustering models, trained on different bootstrap samples.


    To do this, we first need to load the fpc package. Then, we use the `clusterboot()`
    function in the same way we did in the previous chapter. The first argument is
    the data we’re going to be clustering (our scaled tibble), B is the number of
    bootstraps (more is better, depending on your computational budget), and `clustermethod
    = dbscanCBI` tells the function to use the DBSCAN algorithm. I then set the desired
    values of epsilon and minPts (careful, note the capital "M" this time), and set
    `showplots = FALSE` to avoid drawing 500 plots!


    > **NOTE** I’ve truncated the output to show the most important information.


    We can see the Jaccard indices for the three clusters (where cluster three is,
    confusingly, the noise cluster). Cluster two has quite a high stability: 80.7%
    of cases in the original cluster two are in agreement across the bootstrap samples.
    Clusters one and three are less stable, with ~68% agreement.'
