    Now, before we run our tuning experiment, DBCAN presents a potential problem when
    calculating internal cluster metrics. As we saw from the discussion about them
    in chapter 16, these metrics work by comparing the separation between clusters,
    and the spread within clusters (however they define these concepts). Think for
