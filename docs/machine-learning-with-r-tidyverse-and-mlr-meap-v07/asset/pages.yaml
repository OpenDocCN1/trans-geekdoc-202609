  md: '# Maximizing variance: principal component analysis


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_322_0.png)




    +   - What is dimension reduction and why do we need it?

    +   - Dealing with the problems of high dimensionality and colinearity

    +   - Using principal components analysis to reduce dimensionality


    Dimension reduction comprises a number of approaches that turn a set of (potentially
    many) variables, into a smaller number of variables that retain as much of the
    original, multi-dimensional information as possible. We sometimes want to reduce
    the number of dimensions we’re working with in a dataset, to help us visualize
    the relationships in the data, or to avoid the strange phenomena that occur in
    high dimensions. So dimension reduction is a critical skill to add to your machine
    learning toolbox!


    Our first stop in dimension reduction brings us to very well known and useful
    technique: principal component analysis (PCA). PCA, which has been around since
    the turn of the 20th century, creates new variables that are linear combinations
    of the original variables. In this way, PCA is similar to discriminant analysis
    that we encountered in chapter 5, but instead of constructing new variables that
    separate classes, PCA constructs new variables that explain most of the variation/information
    in the data. In fact, there are no labels for PCA as it is unsupervised, and learns
    patterns in the data itself without a ground truth.


    We can then use the two or three of these new variables that capture most of the
    information as inputs to regression, classification or clustering algorithms,
    as well as using them to better understand how the variables in our data are related
    to each other.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '> > **NOTE** The first historical example of dimension reduction was a two-dimensional
    map! Another form of dimension reduction that we encounter in our daily lives
    is the compression of audio into formats like .mp3 and .wav.


    The mlr package doesn’t have a dimension reduction class of task, and it doesn’t
    have a class of dimension reduction learners (something like `dimred.[ALGORITHM]`,
    I suppose). PCA is the only dimension reduction algorithm wrapped by mlr, which
    we can include as a pre-processing step (like imputation, or feature selection).
    As a result, we’re going to leave the safety of the mlr package for the time being.


    By the end of this chapter, I hope you’ll understand what dimension reduction
    is and why we sometimes need it. I will show you how the PCA algorithm works,
    how we can use it to reduce the dimensions of a dataset to help you identify counterfeit
    bank notes.


    # ## 13.1 Why dimension reduction: visualization, curse of dimensionality, and
    collinearity


    In this section, I’ll show you the main reasons for applying dimension reduction:


    +   - making it easier to visualize a dataset with many variables

    +   - mitigating the curse of dimensionality

    +   - mitigating the effects of collinearity


    I’ll explain what the curse of dimensionality and collinearity are and why they
    cause problems for machine learning, and why dimension reduction can reduce the
    impact of both when searching for patterns in data.


    # ### 13.1.1 Visualizing high-dimensional data


    When starting an exploratory analysis, one of the first things you should always
    do is to plot your data. It’s important that we, as data scientists, have an intuitive
    understanding of the structure of our data, the relationships between variables,
    and how the data are distributed. But what if we have a dataset containing thousands
    of variables? Where do we even start? Plotting each of these variables against
    each other isn’t really an option any more, so how can we get a feel for the overall
    structure in our data? Well we can reduce the dimensions down to a more manageable
    number, and plot these instead. We won’t get all the information of the original
    dataset when doing this, but it will help us identify patterns in our data like
    clusters of cases that might suggest a grouping structure in the data.'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'In chapter 5, I discussed the curse of dimensionality. This, slightly dramatic-sounding,
    phenomenon describes a set of challenges we encounter when trying to identify
    patterns in a dataset with many variables. One aspect of the curse of dimensionality
    is that for a fixed number of cases, as we increase the number of dimensions in
    the dataset (increase the feature space), the cases get further and further apart
    from each other. To reiterate this point, I’ve reproduced figure 5.2 from chapter
    5 in figure 13.1. In this situation, the data are said to become sparse. Many
    machine learning algorithms struggle to learn patterns from sparse data and may
    start to learn from the noise in the dataset instead.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_324_0.png)


    Figure 13.1 Data become more sparse as the number of dimensions increases. Two
    classes are shown in one, two and three-dimensional feature space. The dotted
    lines in the three-dimensional representation are to clarify the position of the
    points along the z axis. Note the increasing empty space with increased dimensions.


    Another aspect of the curse of dimensionality is that as the number of dimensions
    increases, the distances between the cases begin to converge to a single value.
    Put another way, for a particular case, the ratio between the distance to its
    nearest neighbor and its furthest neighbor, tends towards 1 in high dimensions.
    This presents a challenge to algorithms that rely on measuring distances (particularly
    Euclidean distance) such as k-nearest neighbors, because distance starts to become
    meaningless.


    Finally, it’s quite common to encounter situations in which we have many more
    variables than we have cases in the data. This is referred to as the p >> n problem,
    where p is the number of variables and n is the number of cases. This, again,
    results in sparse regions of the feature space, making it difficult for many algorithms
    to converge on an optimal solution.'
  merge: -1
  img_proc: true
