- pgno: 68
  md: 'asking it to make predictions on data you used to train it in the first place,
    tells you very little about how the model will perform when making predictions
    on completely unseen data. Therefore, you should never evaluate model performance
    this way. Before we find out why, I want to introduce an important concept called
    the bias-variance trade-off.


    # 3.3 Balancing two sources of model error: the bias-variance trade-off


    There is a concept in machine learning that is so important, and misunderstood
    by so many, that I want to take the time to explain it well: the bias-variance
    trade-off.


    Let''s start with an example. A colleague sends you data on emails your company
    has received, and asks you to build a model to classify incoming emails as junk
    or not junk (this is, of course, a classification problem). The dataset has 30
    variables consisting of observations like the number of characters in the email,
    the presence of URLs, and the number of email addresses it was sent to, in addition
    to whether the email was junk or not.


    You lazily build a classification model using only four of the predictor variables
    (because it''s nearly lunch and they have katsu curry today). You send the model
    to your colleague who implements it as the company''s junk filter.


    A week later your colleague comes back to you, complaining that the junk filter
    is performing badly, and is consistently misclassifying certain types of emails.
    You pass the data you used to train the model, back into the model, and find it
    only correctly classifies 60% of the emails. You decide that you may have underfitted
    the data, in other words, your model was too simple and biased towards misclassifying
    certain types of emails.


    So you go back to the data, and this time, include all 30 variables as predictors
    in your model. You pass the data back through your model, and find it correctly
    classifies 98% of the emails, an improvement, surely? You send this second model
    to your colleague and tell them you are certain that this model is better. Another
    week goes by and again, your colleague comes to you complaining that the model
    is performing badly: it''s misclassifying many emails, and in a somewhat unpredictable
    manner. You decide that you have overfitted the data, in other words, your model
    was too complex and is modeling noise in the data you used to train it. Now when
    you give new datasets to the model, there is a lot of variance in the predictions
    it gives. A model that is overfitted will perform well on the data we use to train
    it, but poorly on new data.


    Underfitting and overfitting are two important sources of error in model building.
    In underfitting, we have included too few predictors or too simple a model to
    adequately describe the relationships/patterns in the data. The result of this
    is a model which is said to be biased: a model that performs poorly on both the
    data we use to train it, and on new data.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '> Because we typically like to explain away as much variation in our data as
    possible, and because we often have many more variables than are important for
    our problem, underfitting is less frequently a problem than overfitting.


    Overfitting is the opposite of underfitting and describes the situation where
    we include too many predictors or too complex a model, such that not only are
    we modeling the relationships/patterns in our data, we are also modeling the noise.
    Noise in a dataset is variation that is not systematically related to variables
    we have measured, but that is due to inherent variability and/or error in measurement
    of our variables. The pattern of noise is very specific to an individual dataset,
    and so if we start to model this noise, our model may perform very well on the
    data we trained it on, but give very variable results between future datasets.


    Underfitting and overfitting both introduce error, and reduce the generalizability
    of the model, i.e. the ability of the model to generalize to future, unseen data.
    They are also opposed to each other and somewhere between a model that underfits
    and has bias, and a model which overfits and has variance, there is an optimal
    model that balances the bias-variance trade-off. Take a look at figure 3.10.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_69_0.png)


    Figure 3.10 The bias-variance trade-off. Generalization error is the proportion
    of erroneous predictions a model makes, and is a result of overfitting and underfitting
    the model. The error associated with overfitting (too complex a model) is variance.
    The error associated with underfitting (too simple a model) is bias. An optimal
    model balances this trade-off.


    Have a look at figure 3.11. Can you see that the underfit models poorly represent
    the patterns in the data, and the overfit models are too granular and model the
    noise in the data instead of the real patterns?'
  merge: -1
  img_proc: true
- pgno: 70
  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_70_0.png)


    So in the case of our k-NN algorithm, selecting a small value of k (where only
    a small number of very similar cases are included in the vote) is more likely
    to model the noise in our data, making a more complex model which is overfit and
    will produce a lot of variance when we use it to classify future reptiles.


    In contrast, selecting a large value of k (where more neighbors are included in
    the vote) is more likely to miss local differences in our data, making a less
    complex model which is underfit and is biased towards misclassifying certain types
    patients. I promise, you’ll learn how to select k soon!


    So the question you’re probably asking now is "how do I tell if I’m under or over
    fitting?" The answer is a technique called cross-validation.




    In the email example we used, once you had trained the second, overfit model,
    you tried to evaluate its performance by seeing how well it classified data you
    had used to train it. I mentioned that this is an extremely bad idea, and here
    is why: a model will almost always perform better on the data you trained it with,
    than on new, unseen data. You can build a model that is extremely overfit, modelling
    all of the noise in the dataset, and you would never know, because passing the
    data back through the model gives you good predictive accuracy.


    The answer then, is to evaluate the performance of your model on data it hasn’t
    seen yet. One way you could do this is by training the model on all of the data
    available to you, then over the next weeks and months as you collect new data,
    pass it through your model and evaluate how it performs. This approach is very
    slow and inefficient, and could make model building take years!


    Instead, we typically split our data in two. We use one portion to train the model.
    This portion is called the training set. We use the remaining portion, which the
    algorithm never sees during training, to test the model. This portion is the test
    set. We then evaluate how close the model’s predictions on the test set are to
    their true values. We summarize the closeness of these predictions with performance
    metrics that we’ll explore in section 3.1. Measuring how well the'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'trained model performs on the test set helps us determine whether our model
    will perform well on unseen data, or whether we need to improve it further.


    This process is called cross-validation, and is an extremely important approach
    in any supervised machine learning pipeline. Once we have cross-validated our
    model and are happy with its performance, we then use all the data we have (including
    the data in the test set) to train the final model (because typically the more
    data we train our model with, the less bias it will have).


    There are three common cross-validation approaches:


    +   1. Hold-out cross-validation

    +   2. k-fold cross-validation

    +   3. Leave-one-out cross-validation




    Let’s start by reminding ourselves of the task and learner we created earlier.


    ```

    diabetesTask <- makeClassifTask(data = diabetesTib, target = "class")

    knn <- makeLearner("classif.knn", par.vals = list("k" = 2))

    ```


    Great, so before we train the final model on all the data, let’s cross-validate
    the learner. Ordinarily you would decide on a cross-validation strategy most appropriate
    for your data, but for the purposes of demonstration I’m going to show you hold-out,
    k-fold and leave-one-out cross-validation.




    Hold-out cross-validation is the simplest method to understand: you simply "hold-out"
    a random proportion of your data as your test set, and train your model on the
    remaining data. You then pass the test set through the model and calculate its
    performance metrics (we’ll talk about these soon). You can see a scheme of hold-out
    cross-validation in figure 3.12.


    Figure 3.12 Hold-out cross-validation (CV). The data is randomly split into a
    training set and test set. The training set is used to train the model, which
    is then used to make predictions on the test set. The similarity of the predictions
    to the true values of the test set is used to evaluate model performance.'
  merge: -1
  img_proc: true
- pgno: 72
  md: "When following this approach you need to decide what proportion of the data\
    \ to use as the test set. The larger the test set is, the smaller your training\
    \ set will be. Here’s the confusing part: performance estimation by cross-validation\
    \ is also subject to error and the bias-variance trade-off. If your test set is\
    \ too small, then the estimate of performance is going to have high variance,\
    \ but if the training set is too small, then the estimate of performance is going\
    \ to have high bias. A commonly used split is where 2/3 of the data are used for\
    \ training and the remaining 1/3 used as a test set, but this depends on the number\
    \ of cases in the data among other things.\n\n\n\nThe first step when employing\
    \ any cross-validation in mlr is to make a resampling description, which is simply\
    \ a set of instructions for how the data are going to be split into their test\
    \ and training sets.\n\nThe first argument to the makeResampleDesc() function\
    \ is the cross-validation method we’re going to use which, in this case, is \"\
    Holdout\". For hold-out cross-validation, we need to tell the function what proportion\
    \ of the data will be used as the training set, so we supply this to the split\
    \ argument (see code listing 3.4).\n\nI’ve included an additional, optional argument,\
    \ stratify = TRUE. This asks the function to ensure that when it splits the data\
    \ into training and test sets, it tries to maintain the proportion of each class\
    \ of patient in each. This is important in classification problems like ours,\
    \ where our groups are very unbalanced (we have more healthy patients that both\
    \ other groups combined!) because otherwise we could get a test set with very\
    \ few of one of our smaller classes.\n\n\n\n```\nholdout <-\n  makeResampleDesc(method\
    \ = \"Holdout\", split = 2/3,\n                   stratify = TRUE)\n```\n\nNow\
    \ that we’ve defined how we’re going to cross-validate our learner, we can run\
    \ the cross-validation using the resample() function. We supply the learner and\
    \ task that we created, and the resampling method we defined a moment ago, to\
    \ the resample() function. We also ask it to give us measures of MMCE and accuracy.\n\
    \n```\nholdoutCV <-\n  resample(learner = knn, task = diabetesTask,\n        \
    \   resampling = holdout, measures = list(mmce, acc))\n```\n\nThe resample() function\
    \ prints the performance measures when you run it, but you can access them by\
    \ extracting the $aggr component from the resampling object.\n\n```\nholdoutCV$aggr\n\
    mmce.test.mean acc.test.mean\n```"
  merge: -1
  img_proc: true
