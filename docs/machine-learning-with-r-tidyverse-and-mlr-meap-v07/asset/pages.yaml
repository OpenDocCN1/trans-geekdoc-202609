- pgno: 2
  md: '# welcome


    Thank you for purchasing the MEAP for *Machine Learning for Mortals (Mere and
    Otherwise): Using R, tidyverse, and mlr*! To get the most from this book, you
    should have basic R programming skills such as working with functions, objects,
    and data, and some very basic statistical knowledge.


    During my PhD, I found that traditional statistical modeling approaches were not
    always sufficient for the types of data problems I was tackling. As the number
    of variables and complexity of the questions began to increase, I turned to machine
    learning techniques to extract meaningful predictions from my data instead. Working
    in academia, R was my tool of choice, and it has certainly come-of-age for machine
    learning applications with packages such as caret and mlr.


    In this book you''ll learn the basics of machine learning, and how many commonly
    used machine learning techniques work and how to apply them to your data. You’ll
    learn all of this while using the mlr package in R, a modern and extremely flexible
    package that will simplify your learning process and get you building your own
    machine learning pipelines quickly. As building well-performing machine learning
    pipelines is about more than just training models, the book also incorporates
    and teaches tools from the tidyverse collection of packages, that help you transform,
    clean and plot your data ready for analysis. In fact, I devote an entire chapter
    to these tools near the start of the book, and use them in the code examples throughout
    the rest of the book.


    After teaching you some basics of machine learning and tidyverse tools, each subsequent
    chapter in the book will teach a specific, commonly used machine learning technique.
    The start of each chapter will teach you what that technique does and how it works,
    in a graphical and non-mathematical way. Once you understand how the technique
    functions, you will code along with me, where we''ll apply the technique to real
    data to make predictions on fun and interesting problems.


    When you finish the book, you will have a mental tool kit of various modern machine
    learning techniques that you can apply to your own data. You will have the skills
    to apply each of these techniques correctly using the mlr package, to objectively
    compare the performance of these techniques for any given problem, and to prepare
    your data for analysis using tidyverse tools.


    If you have any questions, comments, or suggestions, please share them in Manning’s
    [liveBook''s Discussion Forum](https://livebook.manning.com/) for my book.


    —Hefin Rhys'
  merge: -1
  img_proc: true
- pgno: 3
  md: '# brief contents


    # PART 1: INTRODUCTION


    +   1. Introduction to machine learning

    +   2. Tidying, manipulating and plotting data with the tidyverse


    # PART 2: CLASSIFICATION


    +   3. Classifying based on similar observations: the k-Nearest neighbors algorithm

    +   4. Classifying based on odds: logistic regression

    +   5. Classifying by maximizing class separation: discriminant analysis

    +   6. Classifying based on probabilities and hyperplanes: naive Bayes and support
    vector machines

    +   7. Classifying with trees: Decision trees

    +   8. Improving decision trees: Random forests and gradient boosting


    # PART 3: REGRESSION


    +   9. Regression with lines: Linear regression

    +   10. When the relationships aren''t linear: Generalized additive models

    +   11. Preventing overfitting: Ridge regression, LASSO, and elastic net

    +   12. Regression with distance and trees: k-nearest neighbors, random forest
    and XGBoost


    # PART 4: DIMENSION REDUCTION


    +   13. Maximizing variance: Principal component analysis

    +   14. Maximizing similarity: t-SNE and UMAP

    +   15. Dimension reduction with networks and local structure: Self-organizing
    maps and locally-linear embedding


    # PART 5: CLUSTERING


    +   16. Clustering by finding centers: k-means

    +   17. Clustering by finding hierarchies: Hierarchical clustering

    +   18. Clustering based on density: DBSCAN and OPTICS

    +   19. Clustering based on the distribution of data: mixture model clustering

    +   20. Final notes and further reading


    Appendix A: A refresher on statistical concepts'
  merge: -1
  img_proc: true
