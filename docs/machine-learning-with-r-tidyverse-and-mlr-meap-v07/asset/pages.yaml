  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_329_0.png)


    **Figure 13.4 Calculating the eigenvectors for a principal axis.** The distances
    along each variable are scaled so that they mark a point that is one unit along
    the principal axis, away from the origin. We can illustrate this graphically by
    taking a triangle, defined by the change in one variable over the change in the
    other variable, and using Pythagoras'' theorem to find the distance from the origin
    to divide by.


    So once we’ve found the first principal axis, we need to find the next one. PCA
    will find as many principal axes as there are variables or one less than the number
    of cases in the dataset, whichever is smaller. So the first principal component
    is always the one that explains most of the variance in the data. Concretely,
    if we calculate the variance of the cases along each principal component, PC1
    will have the largest value. The variance of the data along a particular principal
    component is called its *eigenvalue*.


    > **NOTE**  If eigenvectors define the direction of the principal axis through
    the original feature space, eigenvalues define the magnitude of spread along the
    principal axis.


    Once the first principal axis is found, the next one must be orthogonal to it.
    When we only have two dimensions in our dataset, this means the second principal
    axis will form a right angle with the first. The example in figure 13.5 shows
    a cloud of cases being projected onto their first and second principal axes. When
    converting only two variables into two principal components, plotting the component
    scores of the data amounts to rotating the data around the origin.


    > **IMPORTANT**  This imposed orthogonality is one of the reasons PCA is good
    at removing collinearity between variables: it can turn a set of correlated variables
    into a set of uncorrelated (orthogonal) variables.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_330_0.png)


    **Figure 13.5** In a two-dimensional feature space, the first principal axis is
    the one that maximizes the variance (as it always is), and the second principal
    axis is orthogonal (at a right angle) to the first. In this situation, plotting
    the principal components simply results in a rotation of the data.


    So after rotating the data in figure 13.5, the majority of the variance in the
    data is explained by PC1, and PC2 is orthogonal to it. But PCA is usually used
    to *reduce dimensions*, not just rotate bivariate data, so how are the principal
    axes calculated in higher-dimensional space? Take a look at figure 13.6. We have
    a cloud of data in three dimensions that is closest to us at the bottom-right
    of the feature space, and gets further from us at the top-left (notice the points
    get smaller). The first principal axis is still the one that explains most of
    the variance in the data, but this time extends through three-dimensional space
    (from front-right to top-left). The same process occurs in higher than three-dimensional
    space, but it’s difficult to visualize that!


    The second principal axis is still orthogonal to the first, but as we now have
    three dimensions to play around with, it is free to rotate around the first in
    a plane that still maintains a right-angle between them. I’ve illustrated this
    rotational freedom with a circle around the origin that gets fainter the further
    away from us it is. The second principal axis is the one that is orthogonal to
    the first, but which explains the majority of the remaining variance in the data.
    The third principal axis must be orthogonal to the preceding axes (at right angles
    to both of them), and therefore has no freedom to move. The first principal component
    always explains the most variance, followed by the second, and the third, and
    so on.


    So at this point you might be asking: if PCA calculates principal components for
    the smaller of the number of variables or the number of cases minus one, how exactly
    does it reduce the number of dimensions? Well, simply calculating the principal
    components isn’t dimension reduction at all! Where dimension reduction comes into
    it is *how many of the principal components we decide to keep in the remainder
    of our analysis*. In the example in figure 13.6, we have three principal components,
    but the first two account for 79% + 12% = 91% of the variation in the dataset.
    If these two principal components capture enough of the information in my original
    dataset to make the dimension reduction worthwhile (perhaps we get better results
    from a clustering or classification algorithm), then we can happily discard the
    remaining 9% of information. I’ll show you some ways of deciding how many principal
    components to keep later in the chapter.'
