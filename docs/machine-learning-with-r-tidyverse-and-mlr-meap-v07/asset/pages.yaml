  md: "What’s the purpose of this? It validates our entire model-building procedure,\
    \ including the hyperparameter tuning step. The cross-validated performance estimate\
    \ we get from this procedure, should be a good representation of how we expect\
    \ our model to perform on completely new, unseen data.\n\nThe process looks pretty\
    \ complicated, but it is extremely easy to perform with `mlr`. First, we define\
    \ how we’re going to perform the inner and outer cross-validation:\n\n```\ninner\
    \ <- makeResampleDesc(\"CV\")\n\nouter <- makeResampleDesc(\"RepCV\", folds =\
    \ 10, reps = 5)\n```\n\nI’ve chosen to perform ordinary k-fold cross validation\
    \ for the inner loop (10 is the default number of folds), and 10-fold cross-validation,\
    \ repeated 5 times, for the outer loop.\n\nNext, we make what’s called a *wrapper*,\
    \ which is basically a learner, tied to some preprocessing step. In our case,\
    \ this is hyperparameter tuning, so we create a tuning wrapper with `makeTuneWrapper()`:\n\
    \n```\nknnWrapper <- makeTuneWrapper(\"classif.knn\", resampling = inner,\n  \
    \                            par.set = knnParamSpace,\n                      \
    \        control = gridSearch)\n```\n\nHere, we supply the algorithm as the first\
    \ argument, and pass our inner cross-validation procedure as the resampling argument.\
    \ We supply our hyperparameter search space as the par.set argument, and our gridSearch\
    \ method as the control argument (remember that we created these two objects earlier).\
    \ This \"wraps\" together the learning algorithm with the hyperparameter tuning\
    \ procedure that will be applied inside the inner cross-validation loop.\n\nNow\
    \ that we’ve defined our inner and outer cross-validation strategies, and our\
    \ tuning wrapper, we run the nested cross-validation procedure by running:\n\n\
    ```\ncvWithTuning <- resample(knnWrapper, diabetesTask, resampling = outer)\n\
    ```\n\nThe first argument is the wrapper we created a moment ago, the second argument\
