- pgno: 384
  md: "# SIDEBAR\n\n# Using SOMs for supervised learning\n\nWe’ve concentrating on\
    \ SOMs here for their use as unsupervised learners for dimension reduction. This\
    \ is probably the most common use for SOMs, but they can also be used for both\
    \ regression and classification, making SOMs very unusual among machine learning\
    \ algorithms.\n\nIn a supervised setting, SOMs actually create two maps, let’s\
    \ call them the x and y maps. The x map is the same as what we’ve learned so far,\
    \ the weights of its nodes are iteratively updated such that similar cases are\
    \ placed in nearby nodes, and dissimilar cases are placed in distant nodes, using\
    \ only the predictor variables in the dataset. Once the cases are placed into\
    \ their respective nodes in the x map, they don’t move. The weights of the y map’s\
    \ nodes represent values of the outcome variable. The algorithm now randomly selects\
    \ cases again, and iteratively updates the weights of the y map nodes to better\
    \ match the values of the outcome variable of the cases in that node. The weights\
    \ could represent a continuous outcome variable (in the case of regression) or\
    \ a set of class probabilities (in the case of classification).\n\nWe can train\
    \ a supervised SOM using the `xyf()` function from the kohonen package. Use `?xyf()`\
    \ function to learn more.\n\n# 15.3 What is locally-linear embedding?\n\nIn this\
    \ section, I’ll explain what locally-linear embedding (LLE) is, how it works,\
    \ why it’s useful, and how it differs from SOMs. Just like UMAP, the LLE algorithm\
    \ tries to identify an underlying manifold that the data lie on. But LLE does\
    \ this in a slightly different way: instead of trying to learn the manifold all\
    \ at once, it learns local, linear patches of data around each case, then combines\
    \ these linear patches together to form the, potentially non-linear, manifold.\n\
    \n> **NOTE**\n> \n> An oft-quoted mantra of the LLE algorithm is to \"think globally,\
    \ fit locally\", meaning the algorithm looks at small, local patches around each\
    \ case, and uses these patches to construct the wider manifold.\n\nThe LLE algorithm\
    \ is particularly good at \"unrolling\" or \"unfurling\" data that is rolled or\
    \ twisted into unusual shapes. For example, imagine a three-dimensional dataset\
    \ where the cases were rolled up into a swiss roll, the LLE algorithm is capable\
    \ of unrolling the data and representing it as a two-dimensional rectangle of\
    \ data points.\n\nSo how does the LLE algorithm work? Take a look at figure 15.12.\
    \ It starts by selecting a case from the dataset, and calculating its k-nearest\
    \ neighbors (this is just like in the k-NN algorithm from chapter 3, so k is a\
    \ hyperparameter of the LLE algorithm). LLE then represents this case as a linear,\
    \ weighted sum of its k neighbors. I can already hear you asking: what does that\
    \ mean?"
  merge: -1
  img_proc: true
- pgno: 385
  md: <!-- no content -->
