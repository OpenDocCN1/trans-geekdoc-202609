- pgno: 406
  md: 'choosing k can be subjective. If you have prior domain knowledge as to how
    many clusters should theoretically be present in a dataset, then you should use
    this knowledge to guide your selection. If you’re using clustering as a pre-processing
    step before a supervised learning algorithm (classification, for example), then
    the choice is quite easy: tune k as a hyperparameter of the whole model-building
    process, and compare the predictions of the final model against the original labels.


    But what if we have no prior knowledge, and no labelled data to compare against?
    And what happens if we get our selection wrong? Well just like for classification
    and regression, clustering is subject to the bias-variance trade-off. If we want
    to generalize a clustering model to the wider population, it’s important we neither
    overfit, nor underfit the training data. Figure 16.3 illustrates what under and
    over-fitting might look like for a clustering problem. When we underfit, we fail
    to identify and separate real clusters in the data, but when we overfit, we split
    real clusters up into smaller, nonsensical clusters that simply don’t exist in
    the wider population.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_406_0.png)


    Figure 16.3 What under and over-fitting looks like for clustering tasks. In the
    left-side plot, the clusters are underfit (fewer clusters have been identified
    than actually exist). In the right-side plot, the clusters are overfit (real clusters
    are broken up into smaller clusters). In the center plot, an optimal clustering
    model has been found that faithfully represents the structure in the data.


    Avoiding over and under-fitting clustering problems is not straight-forward. People
    have proposed many different methods for avoiding over and under-fitting, and
    they won’t all agree with one another for a particular problem. Many of these
    methods rely on the calculation of internal cluster metrics, which are statistics
    that aim to quantify the "quality" of a clustering result.


    > What constitutes "good quality" clusters is poorly defined and somewhat subjective,
    but people typically mean that each cluster is as compact as possible, while the
    distances between clusters are as large as possible.


    These metrics are "internal" because they are calculated from the clustered data
    themselves, rather than comparing the result to any external label or ground truth.
    A common approach to selecting the number of clusters, is to train multiple clustering
    models over a range of cluster'
  merge: -1
  img_proc: true
- pgno: 407
  md: 'numbers, and compare the cluster metrics for each model to help us choose the
    best-fitting one. Three commonly used internal cluster metrics are:


    +   - *Davies-Bouldin index*

    +   - *Dunn index*

    +   - *pseudo F statistic*


    # USING THE DAVIES-BOULDIN INDEX TO EVALUATE CLUSTERING PERFORMANCE


    The Davies-Bouldin index (named after it’s creators: David Davies and Donald Bouldin)
    quantifies the average separability of each cluster from its nearest counterpart.
    It does this by calculating the ratio of the within-cluster variance (also called
    the *scatter*), to the separation between cluster centroids (see figure 16.4).


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_407_0.png)


    **Figure 16.4** The Davies-Bouldin index calculates the intracluster (within-cluster)
    variance (left-side plot), and the distance between the centroids of each cluster
    (right-side plot). For each cluster, it’s nearest neighboring cluster is identified,
    and the sum of their intracluster variances is divided by the difference between
    their centroids. This value is calculated for each cluster, and the Davies-Bouldin
    index is the mean of these values.


    If we fix the distance between clusters, but make the cases within each cluster
    more spread out, the Davies-Bouldin index will get larger. Conversely, if we fix
    the within-cluster variance, but move the clusters further apart from each other,
    the index will get smaller. In theory, the smaller the value (which is bounded
    between zero and infinity), the better the separation between clusters. Boiled
    down into plain English, the Davies-Bouldin index is quantifying the mean separability
    between each cluster and its most similar counterpart.'
  merge: -1
  img_proc: true
- pgno: 408
  md: '# SIDEBAR


    # Calculating the Davies-Bouldin index


    It’s not necessary for you to memorize formula for the Davies-Bouldin index (in
    fact, it’s reasonably complex). For those of you that are interested, we can define
    the scatter within clusters, as:


    $$\mathrm{scatter}_k=\left(\frac{1}{n_k}\sum_{i\in k}(x_i-c_k)^2\right)^{\frac{1}{2}}$$


    where $scatter_k$ is a measure of the scatter within cluster $k$, $n_k$ is the
    number of cases in cluster $k$, $x_i$ is the $i$th case in cluster $k$, and $c_k$
    is the centroid of cluster $k$.


    The separation between clusters can be defined as:


    $$\mathrm{separation}_{j,k}=\left(\sum_{1\leq j\leq k}^{N}(c_j-c_k)^2\right)^{\frac{1}{2}}$$


    where $separation_{j,k}$ is a measure of the separation between clusters $j$ and
    $k$, $c_j$ and $c_k$ are their respective centroids, and $N$ is the total number
    of clusters.


    The ratio between the within-cluster scatter and the separation between two clusters
    is then calculated as:


    $$\mathrm{ratio}_{j,k}=\frac{\mathrm{scatter}_j+\mathrm{scatter}_k}{\mathrm{separation}_{j,k}}$$


    This ratio is calculated for all pairs of clusters, and for each cluster, the
    largest ratio between it and the other clusters is defined to be $R_k$. The Davies-Bouldin
    index is then simply the mean of these largest ratios:


    $$\mathrm{DB}=\frac{1}{N}\sum_{k=1}^{N}R_k$$'
  merge: -1
  img_proc: true
- pgno: 409
  md: "The Dunn index is another internal cluster metric that quantifies the ratio\
    \ between the smallest distance between points in different clusters, and the\
    \ largest distance within any of the clusters, referred to as the cluster’s diameter\
    \ (see figure 16.5). These can be any distance metric, but are commonly Euclidean\
    \ distance.\n\n![](img/a22105d68c35e8d5bd3c7bafb4644881_409_0.png)\n\n> Figure\
    \ 16.5 The Dunn index quantifies the ratio between the smallest distance between\
    \ cases in different clusters (left-side plot), and the largest distance within\
    \ a cluster (right-side plot).\n\nThe intuition here is that if we maintain the\
    \ same diameter of our clusters, but move the closest pair apart, the Dunn index\
    \ will get larger. Conversely, if we maintain the same distance between cluster\
    \ centroids, but shrink the diameter of the clusters (by making the clusters denser),\
    \ the Dunn index will also increase. As such, the number of clusters resulting\
    \ in the largest Dunn index is the one which results in the largest, minimum distance\
    \ between clusters, and the smallest, maximum distance between cases within a\
    \ cluster.\n\n> SIDEBAR Calculating the Dunn index\n> It’s not necessary for you\
    \ to memorize formula for the Dunn index. For those of you that are interested,\
    \ we can define the Dunn index, as:\n> \n> Dunn = min_{1≤i≤k} { min_k (min_{1≤j≠i≤k}\
    \ (δ(c_i c_j) / max_{1≤j≠i≤k} Δ(c_i)))\n> \n> where (c_i c_j) represents all pairwise\
    \ differences between cases in clusters i and j, and (c_i) represents all pairwise\
    \ differences between cases in cluster i."
  merge: -1
  img_proc: true
- pgno: 410
  md: '# USING PSEUDO F STATISTIC TO EVALUATE CLUSTERING PERFORMANCE


    The pseudo F statistic is a ratio of the between-cluster sum of squares to the
    within-cluster sum of squares. The between-cluster sum of squares is the squared
    difference between each cluster centroid and the grand centroid (the centroid
    of all the data as if they were all in one big cluster), weighted by the number
    of cases in that cluster, added up across each cluster. This is another way of
    measuring how separated the clusters are from each other (the further the cluster
    centroids are from each other, the smaller the between sum of squares will be).
    The within-cluster sum of squares is the squared difference between each case
    and its cluster’s centroid, added up across each cluster. This is another way
    of measuring the variance or dispersion within each cluster (the denser each cluster
    is, the smaller the within sum of squares will be).


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_410_0.png)


    Figure 16.6 The pseudo F statistic is the ratio of the between cluster sum of
    squares (right-side plot) to the within cluster sum of squares (left-side plot).
    The grand centroid is shown as a square in the right-side plot.


    As the pseudo F statistic is also a ratio, if we maintain the same cluster variance,
    but move the clusters further apart, the pseudo F statistic will increase. Conversely,
    if we maintain the same separation between the cluster centroids, but make the
    clusters more spread out, the pseudo F statistic will decrease. As such, the number
    of clusters that results in the largest pseudo F statistic is, in theory, the
    one which maximizes the separation of the clusters.'
  merge: -1
  img_proc: true
