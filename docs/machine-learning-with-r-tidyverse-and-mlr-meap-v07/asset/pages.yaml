- pgno: 496
  md: '# ## 19.3 Strengths and weaknesses of mixture model clustering


    While it often isn’t easy to tell which algorithms will perform well for a given
    task, here are some strengths and weaknesses that will help you decide whether
    mixture model clustering will perform well for your task.


    The strengths of mixture model clustering are:


    +   - It can identify non-spherical clusters of different diameters

    +   - It estimates the probability that a case belongs to each cluster

    +   - It is insensitive to variables on different scales


    The weaknesses of mixture model clustering are:


    +   - While the clusters need not be spherical, they do need to be elliptical

    +   - It cannot natively handle categorical variables

    +   - It cannot select the optimal number of clusters automatically

    +   - Due to the randomness of the initial Gaussians, it has the potential to
    converge to a locally-optimal model

    +   - It is sensitive to outliers

    +   - If the clusters cannot be approximated by a multivariate Gaussian, it’s
    unlikely the final model will fit well


    > > **EXERCISE 19.1**

    > >

    > > Use the `Mclust()` function to train a model, setting the `G` argument to
    2, and the `modelNames` argument to "VVE" to force a VVE model with two clusters.
    Plot the results and examine the clusters.


    > > **EXERCISE 19.2**

    > >

    > > Using the `clusterboot()` function, calculate the stability of the clusters
    generated from a two cluster and a three cluster VVE model. **HINT:** Use `noisemclustCBI`
    as the `clustermethod` argument to use mixture modeling. Is it easy to compare
    the Jaccard indices of models with different numbers of clusters?'
  merge: -1
