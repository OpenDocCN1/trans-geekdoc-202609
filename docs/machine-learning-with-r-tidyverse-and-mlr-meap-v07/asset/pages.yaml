    \ function. The shading of the points is mapped to the z variable.\n\n# 15.4.2\
    \ Training the LLE\n\nAside from the number of dimensions we want to reduce our\
    \ dataset down to (usually two or three), *k* is the only hyperparameter we need\
    \ to select. We can choose the best-performing value of *k* by using the `calc_k()`\
    \ function. The `calc_k()` function applies the LLE algorithm to our data, using\
    \ different values of *k* in a range we specify. For each embedding that used\
    \ a different *k*, the `calc_k()` function calculates the distances between cases\
    \ in the original data, and in the low-dimensional representation. The correlation\
    \ coefficient between these distances is calculated (ρ, or \"rho\"), and used\
    \ to calculate a metric (1 − ρ²) that can be used to select *k*. The value of\
    \ *k* with the smallest value for this metric is the one that best preserves the\
    \ distances between cases in the high and low-dimensional representations."
