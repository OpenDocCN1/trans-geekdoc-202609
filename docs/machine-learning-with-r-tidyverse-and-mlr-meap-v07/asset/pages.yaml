    of what expand.grid() is doing.


    Now that we’ve defined our hyperparameter search space, let’s run the DBSCAN algorithm
    on each distinct combination of epsilon and minPts. To do this, I make use of
    the pmap() function from the purrr package to apply the dbscan() function to each
    row of the dbsParamSpace object. I supply our scaled dataset as the argument to
    dbscan() ’s argument, x. The output from pmap() is a list, where each element
    is the result of running DBSCAN on that particular combination of epsilon and
    minPts. To view the output for a particular permutation, we simply subset the
    list.


    The output, when printing the result of a dbscan() call tells us the number of
    objects in the data, the values of epsilon and minPts, and the number of identified
    clusters and noise points. Perhaps the most important information is the number
    of cases within each cluster. In this example we can see there are 189 cases in
    cluster 2, and just a single case in most of the other clusters. This is because
    this permutation was run with minPts equal to one, which allows clusters to have
    just a single case in them. This is rarely what we want, and will result in a
    clustering model where no cases are identified as noise.




    ```

    swissDbs <- pmap(dbsParamSpace, dbscan, x = swissScaled)

