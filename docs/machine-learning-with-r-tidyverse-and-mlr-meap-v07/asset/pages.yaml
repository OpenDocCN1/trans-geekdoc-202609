  md: 'done, and now it’s our job to use the information contained in this plot to
    extract the cluster membership. This is why I said that OPTICS isn’t technically
    a clustering algorithm, but creates an ordering of the data that allows us to
    find clusters in the data.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_456_0.png)


    **Figure 18.6** Reachability plot of a simulated dataset. The top plot shows the
    reachability plot learned by the OPTICS algorithm from the data shown in the bottom
    plot. The plots are shaded to indicate where each cluster in the feature space
    maps onto the reachability plot.


    So how do we extract clusters? We have a couple of options. One method would be
    to simply draw a horizontal line across the reachability plot, at some reachability
    score, and define the start and end of clusters as when the plot dips below and
    back above the line. Any cases above the line could be classified as noise. This
    is shown in the top plot of figure 18.7. This approach will result in clustering
    very similar to what the DBSCAN algorithm would produce, except that some border
    points are more likely to be put into the noise cluster.


    Another, usually more useful method, is to define a particular "steepness" in
    the reachability plot as indicative of the start and end of a cluster. We can
    define the start of a cluster as when we have a downward slope of at least this
    steepness, and its end as when we have an upward slope of at least this steepness.
    The method we’ll use later defines the steepness as 1 - ξ (xi,'
  merge: -1
  img_proc: true
- pgno: 457
  md: 'pronounced "zy", "sigh", or "kzee" depending on your preference and mathematics
    teacher), where the reachability of two successive cases must change by a factor
    of 1 - ζ . When we have a downward slope that meets this steepness criterion,
    the start of a cluster is defined, and when we have an upward slope that meets
    this steepness, the end of the cluster is defined.


    > As cannot be estimated from the data, it is a hyperparameter we must select/tune
    ourselves.


    Using this method has two major benefits. Firstly, it allows us to overcome DBSCAN’s
    limitation of only finding clusters of equal density. Secondly, it allows us to
    find clusters within clusters, to form a hierarchy. Imagine we have a downward
    slope that starts a cluster, then we have another downward slope before the cluster
    ends, we now have a cluster within a cluster. This hierarchical extraction of
    clusters from a reachability plot is shown in the bottom plot in figure 18.7.


    > Notice that neither of these methods work with the original data, they extract
    all the information to assign cluster memberships from the order and reachability
    scores generated by the OPTICS algorithm.'
  merge: -1
