- pgno: 441
  md: '> Jaccard index = \left( \frac{number of values in both sets}{total number
    of unique values} \right) \times 100


    For example, if we have two sets:

    a = {3, 3, 5, 2, 8}

    b = {1, 3, 5, 6}

    then the Jaccard index is:


    > Jaccard index = (2/6) × 100 = 33.3%


    So if we cluster on multiple bootstrap samples, we can calculate the Jaccard index
    between the "original" clusters (the clusters on all the data), and each of the
    bootstrap samples, and take the mean. If the mean Jaccard index is low, then cluster
    membership is changing considerably between bootstrap samples, indicating our
    clustering result is unstable and may not generalize well. If the mean Jaccard
    index is high, then cluster membership is changing very little, indicating a stable
    clustering result.


    Luckily for us, the clusterboot() function from the fpc package has been written
    to do just this! Let’s first load the fpc package into our R session. As the clusterboot()
    function produces a series of base R plots as a side effect, let’s split the plotting
    device into three rows and four columns to accommodate the output, using par(mfrow
    = c(3, 4)).


    The first argument to the clusterboot() function is the data. This argument will
    accept either the raw data or a distance matrix of class dist (it will handle
    either appropriately). The argument B is the number of bootstrap samples we wish
    to calculate, which I’ve set to ten for the sake of reducing running time. The
    clustermethod argument is where we specify which type of clustering model we wish
    to build (see ?clusterboot for a list of available methods, but many common methods
    are included). For hierarchical clustering, we set this argument equal to disthclustCBI.
    The k argument specifies the number of clusters we want to return, method let’s
    us specify the distance metric we want to use for clustering, and showplots gives
    us the opportunity to suppress the printing of the plots if we want. The function
    may take a couple of minutes to run.


    I’ve truncated the output from printing the result of clusterboot() to show the
    most important information: the Clusterwise Jaccard bootstrap means. These four
    values are the mean Jaccard'
  merge: -1
  img_proc: true
