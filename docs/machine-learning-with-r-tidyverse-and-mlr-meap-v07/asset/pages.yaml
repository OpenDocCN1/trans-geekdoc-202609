  md: "![](img/a22105d68c35e8d5bd3c7bafb4644881_481_0.png)\n\n# Clustering based on\
    \ the distribution of data: mixture model clustering\n\n+   **This chapter covers:**\n\
    +   \n+   - What is mixture model clustering and why is it useful?\n+   - What’s\
    \ the difference between hard and soft clustering?\n\nOur final stop in unsupervised\
    \ learning techniques brings us to an additional approach to finding clusters\
    \ in data: mixture model clustering. Just like the other clustering algorithms\
    \ we’ve covered, mixture model clustering aims to partition a dataset into a finite\
    \ set of clusters.\n\nIn the last chapter, I showed you how the DBSCAN and OPTICS\
    \ algorithms, and how they find clusters by learning regions of high and low density\
    \ in the feature space. Mixture model clustering takes, yet another approach to\
    \ identifying clusters. A mixture model is any model that describes a dataset\
    \ by combining a mix of two or more probability distributions. In the context\
    \ of clustering, mixture models help us to identify clusters by fitting a finite\
    \ number of probability distributions to the data, and iteratively modifying the\
    \ parameters of those distributions until they best fit the underlying data. Cases\
    \ are then assigned to the cluster of the distribution under which they are most\
    \ likely. The most common form of mixture modeling is *Gaussian mixture modeling*,\
    \ which fits Gaussian (or normal) distributions to the data.\n\nBy the end of\
    \ this chapter, I hope you’ll have a firm understanding of how mixture model clustering\
    \ works and its differences and similarities to some of the algorithms we’ve already\
    \ covered. We’ll apply this method to our Swiss banknote data from the last chapter\
    \ to help you understand how mixture model clustering differs from density-based\
    \ clustering. If you no longer have the swissTib object defined in your global\
    \ environment, just re-run code listing 18.1."
  merge: -1
  img_proc: true
- pgno: 482
  md: 'In this section, I''m going to show you what mixture model clustering is, and
    how it uses an algorithm called expectation-maximization to iteratively improve
    the fit of the clustering model.


    The clustering algorithms we''ve met so far are all considered hard clustering
    methods. This is because each case is assigned wholly to one cluster, and not
    to another. One of the strengths of mixture model clustering is that it is a soft
    clustering method. This is because mixture model clustering fits a set of probabilistic
    models to the data and assigns each case a probability of belonging to each model.
    This allows us to quantify the probability of each case, belonging to each cluster.
    In this way, we say "this case has 90% probability of belonging to cluster A,
    9% probability of belonging to cluster B, and 1% probability of belonging to cluster
    C." This is useful because it gives us the information we need to make better
    decisions. Say, for example, a case has 51% probability of belonging to one cluster,
    and 49% probability of belonging to the other, how happy are we to include this
    case in its most probable cluster? Perhaps we''re not confident enough to include
    such cases in our final clustering model.


    > NOTE Mixture model clustering doesn''t, in of itself, identify outlying cases
    like DBSCAN and OPTICS do, but we can manually set a cut-off of probability if
    we like. For example, we could say that any case which has less than 60% probability
    of belonging to its most probable cluster should be considered an outlier.


    So mixture model clustering fits a set of probabilistic models to the data. These
    models can be a variety of probability distributions, but are most commonly Gaussian
    (or normal) distributions. This clustering approach is called mixture modeling,
    because we fit multiple (a mixture of) probability distributions to the data.
    Therefore, a Gaussian mixture model is simply a model that fits multiple Gaussian
    distributions to a set of data.


    Each Gaussian in the mixture represents a potential cluster. Once our mixture
    of Gaussians fits the data as well as possible, we can calculate the probability
    of each case belonging to each cluster, and assign them to the most probable cluster.
    But how do we find a mixture of Gaussians that fits the underlying data well?
    We can use the expectation-maximization (EM) algorithm.




    In this section I''ll take you through some prerequisite knowledge you''ll need
    to know, in order to understand the EM algorithm. This focuses on how the algorithm
    calculates the probability that each case comes from each Gaussian.


    Imagine we have a one-dimensional data set, a number line with cases distributed
    across it (see the top panel of figure 19.1). First, we must pre-define the number
    of clusters to look for in the'
  merge: -1
  img_proc: true
- pgno: 483
  md: "data, this sets the number of Gaussians we will be fitting. In this example,\
    \ let’s say we believe two clusters exist in the dataset.\n\n> > **NOTE**  \n\
    > > This is one of the ways in which mixture model clustering is similar to k-means.\
    \ I’ll show you the other way in which they are similar later in the chapter.\n\
    \nA one-dimensional Gaussian distribution needs two parameters to define it: the\
    \ mean, and variance. So we randomly initialize two Gaussians along the number\
    \ line, by selecting random values for their means and variances. Let’s call these\
    \ Gaussians $j$ and $k$. Then, given these two Gaussians, we calculate the probability\
    \ that each case belongs to one cluster, over the other. To do this, we can use\
    \ our good friend, Baye’s rule.\n\nRecall from chapter 6 that we can use Baye’s\
    \ rule to calculate the posterior probability of an event $(p(k|x))$, given the\
    \ likelihood $(p(x|k))$, prior $(p(k))$, and evidence $(p(x))$.\n\n**EQUATION\
    \ 19.1**\n\n$$p(k|x)=\\frac{p(x|k)\\times p(k)}{p(x)}$$\n\nIn this case, $p(k|x)$\
    \ is the probability of case $x$ belonging to Gaussian $k$, $p(x|k)$ is the probability\
    \ of observing case $x$ if you were to sample from Gaussian $k$, $p(k)$ is the\
    \ probability of a randomly-selected case belonging to Gaussian $k$, and $p(x)$\
    \ is the probability of drawing case $x$ if you were to sample from the entire\
    \ mixture model as a whole. The evidence, $p(x)$, is therefore the probability\
    \ of drawing case $x$ from either Gaussian.\n\nWhen computing the probability\
    \ of one event OR the other occurring, we simply add together the probabilities\
    \ of each event occurring independently. Therefore, the probability of drawing\
    \ case $x$ from Gaussian $j$ OR $k$, is the probability of drawing it from Gaussian\
    \ $j$ plus the probability of drawing it from Gaussian $k$. The probability of\
    \ drawing case $x$ from one of the Gaussians is the likelihood multiplied by the\
    \ prior for that Gaussian. With this in mind, we can write our Baye’s rule more\
    \ fully as shown in equation 19.2.\n\n**EQUATION 19.2**\n\n$$p(k|x_i)=\\frac{p(x_i|k)\\\
    times p(k)}{p(x_i|k)p(k)+p(x_i|j)p(j)}$$"
  merge: -1
  img_proc: true
- pgno: 484
  md: 'Notice that the evidence has been expanded to more concretely show how the
    probability of drawing case $x_i$ from either Gaussian is the sum of the probabilities
    of drawing it from either independently. Equation 19.2 allows us to calculate
    the posterior probability of case $x_i$ belonging to Gaussian $k$. Equation 19.3
    shows the same calculation, but for the posterior probability of case $x_i$ belonging
    to Gaussian $j$.


    # **EQUATION 19.3**


    $$p(j \mid x_i)=\frac{p(x_i\mid j)\times p(j)}{p(x_i\mid k)p(k)+p(x_i\mid j)p(j)}$$


    So far, so good. But how do we calculate the likelihood and the priors? The likelihood
    is the probability density function of the Gaussian distribution, which tells
    us the relative probability of drawing a case with a particular value, from a
    Gaussian distribution with a particular combination of mean and variance. The
    probability density function for Gaussian distribution $k$ is shown in equation
    19.4, but it isn’t necessary for you to memorize it.


    # **EQUATION 19.4**


    $$p(x_i\mid k)=\frac{1}{\sqrt{2\pi\sigma_k^2}}e^{-\frac{(x_i-\mu_k)^2}{2\sigma_k^2}}$$


    where $\mu_k$ and $\sigma_k^2$ are the mean and variance, respectively, for Gaussian
    $k$.


    At the start of the algorithm, the prior probabilities are generated randomly,
    just like the means and variances of the Gaussians. These priors get updated at
    each iteration to be the sum of the posterior probabilities for each Gaussian,
    divided by the number of cases. You can think of this as the mean posterior probability
    for a particular Gaussian, across all cases.


    # ### 19.1.2 The EM algorithm: expectation and maximization steps


    Now we have the necessary knowledge to understand how the posterior probabilities
    are calculated, let’s see how the EM algorithm iteratively fits the mixture model.
    The EM algorithm (like its name suggests) has two steps: expectation, and maximization.
    The expectation step is where the posterior probabilities are calculated for each
    case, for each Gaussian. This is shown in the second panel from the top in figure
    19.1.


    At this stage, the algorithm uses Baye’s rule as we set out earlier, to calculate
    the posterior'
