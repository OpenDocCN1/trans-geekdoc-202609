- pgno: 121
  md: '# Classifying by maximizing class separation: discriminant analysis


    +   - What discriminant analysis is

    +   - Linear and quadratic discriminant analysis

    +   - Building discriminant analysis classifiers to predict wines


    Discriminant analysis is an umbrella term for multiple algorithms that solve classification
    problems (where we wish to predict a categorical variable) in a similar way. While
    there are various discriminant analysis algorithms which learn slightly differently,
    they all find a new representation of the original data, that maximizes the separation
    between the classes.


    Recall from chapter 1 that predictor variables are the variables we hope contain
    the information needed to make predictions on new data. Discriminant function
    analysis algorithms find a new representation of the predictor variables (which
    must be continuous) by combining them together into new variables that best discriminate
    the classes. This combination of predictor variables often has the handy benefit
    of reducing the number of predictors to a much smaller number. Because of this,
    despite discriminant analysis algorithms being classification algorithms, they
    are similar to some of the dimension reduction algorithms we’ll meet in part 4
    of the book.


    > Dimension reduction is the process of learning how the information in a set
    of variables can be condensed into a smaller number of variables, with as little
    information loss as possible.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# 5.1 What is discriminant analysis?


    In this section you’ll learn why discriminant analysis is useful and how it works.
    Imagine you want to find out if you can predict how patients will respond to a
    drug based on their gene expression. You measure the expression level of 1000
    genes and record whether they respond positively, negatively, or don’t respond
    at all, to the drug (a three-class classification problem).


    A dataset that has as many predictor variables as this (and it isn’t rare to find
    datasets this large) presents a few problems:


    +   1. the data is very difficult to explore and plot manually

    +   2. there may be many predictor variables which contain no or very little predictive
    information

    +   3. we have the curse of dimensionality to contend with (a problem algorithms
    encounter when trying to learn patterns in high-dimensional data)


    In our gene expression example, it would be nearly impossible to plot all 1000
    genes in such a way that you could interpret the similarities/differences between
    the classes. Instead, you could use discriminant analysis to takes all of that
    information and condense it into a manageable number of discriminant functions,
    each of which is a combination of the original variables. Put another way, discriminant
    analysis takes the predictor variables as input and finds a new, lower-dimensional
    representation of those variables that maximizes the separation between the classes.
    Therefore, While discriminant analysis is a classification technique, it employs
    dimension reduction to achieve its goal. This is illustrated in figure 5.1.


    > NOTE Due to their dimensionality reduction, discriminant analysis algorithms
    are popular techniques for classification problems where you have many continuous
    predictor variables.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_122_0.png)


    Figure 5.1 Discriminant analysis algorithms take the original data and combine
    continuous predictor variables together into new variables that maximize the separation
    of the classes.


    The number of these discriminant functions will be the smaller of:


    +   the number of classes - 1, or'
  merge: -1
  img_proc: true
- pgno: 123
  md: '+   - the number of predictor variables


    In the gene expression example, the information contained in those 1000 predictor
    variables would be condensed into just two variables (three classes - 1). We could
    now easily plot these two new variables against each other to see how separable
    our three classes are!


    As you learned in chapter 4, including predictor variables that contain little
    or no predictive value adds noise, which can negatively impact how the learned
    model performs. When discriminant analysis algorithms learn their discriminant
    functions, greater weight or importance is given to predictors which better discriminate
    the classes. Predictors which contain little or no predictive value are given
    less weight and contribute less to the final model. To a degree, this lower weighting
    of uninformative predictors mitigates their impact on model performance.


    > **IMPORTANT** Despite mitigating the impact of weak predictors, a discriminant
    analysis model will still tend to perform better after performing feature selection
    (removing weakly predictive predictors).


    The curse of dimensionality is a terrifying-sounding phenomena that causes problems
    when working with high-dimensional data (data with many predictor variables).
    As the *feature space* (the set of all possible combinations of predictor variables)
    increases, the data in that space become more *sparse*. Put more plainly, for
    the same number of cases in a dataset, if you increase the feature space, the
    cases get further apart from each other and there is more empty space between
    them. This is demonstrated in figure 5.2 just going from a one, to a three-feature
    space.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_123_0.png)


    **Figure 5.2** Data become more *sparse* as the number of dimensions increases.
    Two classes are shown in one, two and three-dimensional feature space. The dotted
    lines in the three-dimensional representation are to clarify the position of the
    points along the z axis. Note the increasing empty space with increased dimensions.


    The consequence of this increase in dimensionality is that an area of the feature
    space may have very few cases occupying it and so an algorithm is more likely
    to learn from "exceptional" cases in our data. When algorithms learn from exceptional
    cases, this results in models that are overfit and have a lot of variance in their
    predictions. This is the curse of dimensionality.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '> As the number of predictor variables increases linearly, the number of cases
    would need to increase exponentially to maintain the same density in the feature
    space.


    This isn''t to say that more variables is bad, however! For most problems, adding
    predictors with valuable information improves the predictive accuracy of a model,
    until it doesn''t (until we get diminishing returns). So how do we guard against
    overfitting due to the curse of dimensionality? By performing feature selection
    (as we did in chapter 4) to include only variables that have predictive value,
    and/or by performing dimension reduction. There are a number of specific dimension
    reduction algorithms we will learn in part 4 of this book, but discriminant analysis
    actually performs dimension reduction as part of its learning procedure.


    > The phenomenon of the predictive power of a model increasing as the number of
    predictor variables increases, but then decreasing again as we continue to add
    more predictors, is called Hughes phenomenon, after the statistician, G. Hughes.


    Discriminant analysis isn''t one algorithm but instead comes in many flavors.
    I''m going to teach you the two most fundamental and commonly used algorithms:


    +   1. linear discriminant analysis (LDA)

    +   2. quadratic discriminant analysis (QDA)


    In the next section, you''ll learn how these algorithms work and how they differ,
    but for now, suffice it to say that LDA and QDA learn linear (straight line) and
    curved decision boundaries between classes, respectively.




    I''ll start by explaining how LDA works, then I''ll generalize this to QDA.


    Imagine we have two predictor variables we are trying to use to separate two classes
    in our data (see figure 5.3). LDA aims to learn a new representation of the data
    that separates the centroid of each class, while keeping the within-class variance
    as low as possible. A centroid is simply the point in the feature space that is
    the mean of all of the predictors (a vector of means, one for each dimension).
    Then, LDA finds a line through the origin that, when the data are projected onto
    it, simultaneously:


    +   1. maximizes the difference between the class centroids along the line

    +   2. minimizes the within-class variance along the line


    To choose this line, the algorithm maximizes the expression in equation 5.1 over
    all possible'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'axes:


    # EQUATION 5.1


    ```

    $$\frac{(\bar{x}_1-\bar{x}_2)^2}{s_1^2+s_2^2}$$

    ```


    The numerator is the difference between the class means ($\bar{x}_1$ and $\bar{x}_2$
    for the mean of class one and two, respectively), squared to ensure the value
    is positive (because we don’t know which will be bigger). The denominator is the
    sum of variances of each class along the line ($s_1^2$ and $s_2^2$ for the variances
    of class one and two, respectively). The intuition behind this is that we want
    the means of the classes to be as separated as possible, with the scatter/variance
    within each class to be as small as possible.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_125_0.png)


    **Figure 5.3 Learning a discriminant function in two dimensions.** LDA learns
    a new axis such that, when the data are projected onto it (dashed lines), it maximizes
    the difference between class means while minimizing intra-class variance. $x$
    and $s^2$ are the mean and variance of each class along the new axis, respectively.


    Why not simply find the line that maximizes the separation of the centroids? Well
    because the line that best separates the centroids doesn’t guarantee the best
    separation of the cases in the different classes. This is illustrated in figure
    5.4. In the example on the left, a new axis is drawn that simply maximizes the
    separation of the centroids of the two classes. When we project the data onto
    this new axis, the classes are not fully resolved because the relatively high
    variance means they overlap with each other. In the example on the right, however,
    the new axis tries to maximize centroid separation while minimizing the variance
    of each class along that axis. This results in centroids that are slightly closer
    together, but much smaller variances, such that the cases from the two classes
    are fully separated.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_126_0.png)


    **Figure 5.4** Constructing a new axis that only maximizes class centroid separation
    doesn’t fully resolve the classes (left example). Constructing a new axis that
    maximizes centroid separation while also minimizing variance within each class
    results in better separation of the classes (right). x̄ and s² are the mean and
    variance of each class along the new axis, respectively.


    This new axis is called a discriminant function, and is a linear combination of
    the original variables. For example, a discriminant function could be described
    by the equation:


    $$DF = -0.5 \times var_1 + 1.2 \times var_2 + 0.85 \times var_3$$


    In this way, the discriminant function (DF) in the equation above is a linear
    combination of variables var₁, var₂ and var₃. The combination is linear because
    we are simply adding the contributions from each variable together. The values
    that each variable is multiplied by are called the *canonical discriminant function
    coefficients* and weight each variable by how much it contributes to class separation.
    In other words, variables which contribute most to class separation will have
    larger absolute canonical discriminant function coefficients (positive or negative).
    Variables that contain little or no class separation information will have canonical
    discriminant function coefficients closer to zero.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Linear discriminant analysis vs. principal component analysis


    If you’ve come across principal component analysis (PCA) before, you might be
    wondering how it differs to linear discriminant analysis (LDA). PCA is an unsupervised
    learning algorithm for dimension reduction, meaning that, unlike LDA, it doesn’t
    rely on labeled data.


    If you’re unfamiliar with PCA, don’t worry! You’ll learn about it in depth in
    chapter 13.


    If you want to reduce the dimensionality of data with labeled class membership,
    you should typically favor LDA over PCA. If you want to reduce the dimensionality
    of unlabeled data, you should favor PCA (or one of the many other dimension reduction
    algorithms we’ll discuss in part 4 of the book).




    Discriminant analysis can handle classification problems with more than two classes.
    But how does it learn the best axis in this situation? Instead of trying to maximize
    the separation between class centroids, it maximizes the separation between each
    class centroid and the grand centroid of the data (the centroid of all the data,
    ignoring class membership). This is illustrated in figure 5.5. Where we have two
    continuous measurements made on cases from three classes. The class centroids
    are shown with triangles and the grand centroid is shown by a cross.


    LDA first finds the axis that best separates the class centroids from the grand
    centroid that minimizes the variance of each class along it. Then, LDA constructs
    a second discriminant function which is orthogonal to the first. This simply means
    the second discriminant function must be perpendicular to the first (at a right
    angle in this 2D example).


    The number of discriminant functions will be whichever is smaller: the number
    of classes - 1, or the number of predictor variables.'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'The data are then projected onto these new axes such that each case gets a
    *discriminant score* for each function (its value along the new axis). These discriminant
    scores can be plotted against each other to form a new representation of the original
    data.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_128_0.png)


    **Figure 5.5 When there are more than two classes, LDA maximizes the distance
    between each class centroid (triangles) and the grand centroid (cross) while minimizing
    intra-class variance. Once the first discriminant function (DF) is found, a second
    is constructed that is orthogonal to it. The original data can be plotted against
    these functions.**


    But what’s the big deal? We’ve gone from having two predictor variables to having…
    two predictor variables! In fact, can you see that all we’ve done is center and
    scale the data, and rotate it around zero? When we only have two variables, discriminant
    analysis cannot perform any dimension reduction because the number of discriminant
    functions is the smaller of the number of classes - 1 and the number of variables
    (and we only have two variables).


    But what about when we have more than two predictor variables? Figure 5.6 shows
    an example where we have three predictor variables (x, y, and z) and three classes.
    Just like in figure 5.5, LDA finds the discriminant function that maximizes the
    separation between each class centroid and the grand centroid, while minimizing
    the variance along it. This line extends through a three-dimensional space.


    Next, LDA finds the second discriminant function (which is orthogonal to the first)
    which also tries to maximize separation while minimizing variance. As we only
    have three classes (and the number of discriminant functions is the smaller of
    the number of classes - 1 or the number of predictors), we stop at two discriminant
    functions. By taking the discriminant scores of each case in the data (the values
    of each case along the two discriminant functions), we can plot our data in only
    two dimensions.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_129_0.png)


    NOTE The first discriminant function always does the best job at separating the
    classes, followed by the second, and third etc.


    LDA has taken a three-dimensional dataset and combined the information in those
    three variables into two new variables that maximize the separation between the
    classes. That’s pretty cool, but if instead of just three predictor variables
    we had 1000 (as in the example I used earlier), LDA would still condense all this
    information into only two variables! That’s super cool!




    LDA performs well if the data within each class are normally distributed across
    all the predictor variables, and that each class has similar covariances. Covariance
    simply means how much one variable increases/decreases when another variable increases/decreases.
    So LDA assumes that for each class in the dataset, the predictor variables covary
    with each other the same amount.


    This often isn’t the case and classes have different covariances. In this situation,
    QDA tends to perform better than LDA as it doesn’t make this assumption (though
    it still assumes the data are normally distributed). Instead of learning straight
    lines that separate the classes, QDA learns curved lines. It is also well suited,
    therefore, to situations in which classes are best separated by a non-linear decision
    boundary. This is illustrated in figure 5.7.


    In the example on the left of figure 5.7, the two classes are normally distributed
    across both variables, and have equal covariances. We can see the covariances
    are equal because, for both classes, as variable 1 increases, variable 2 decreases
    by the same amount. In this situation, LDA and QDA will find similar discriminant
    functions, although LDA is slightly less prone to overfitting than QDA as it is
    less flexible.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'In the example on the right of figure 5.7, the two classes are normally distributed,
    but their covariances are different. In this situation QDA will find a curved
    discriminant function that, when the data are projected onto it, will tend to
    do a better job of separating the classes than a linear discriminant function.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_130_0.png)




    So whichever method you’ve chosen, the discriminant functions have been constructed
    and you’ve reduced your high-dimensional data into a small number of discriminants.
    How do LDA and QDA use this information to classify new observations? They use
    an extremely important statistical theorem called Baye''s rule.


    Baye''s rule provides us with a way of answering the following question: given
    the values of the predictor variables for any case in our data, what is the probability
    of that case belonging to class k. This is written as p(k|x), where k represents
    membership of class k, and x represents the values of the predictor variables.
    We would read this as: "the probability of belonging to class k, given the data,
    x". This is given by Baye''s rule:




    ```

    p(k|x) = p(x|k) × p(k) / p(x)

    ```


    Don''t be scared by this! There are only four terms in the equation and I''m going
    to walk you through them. You already know p(k|x) is the probability of a case
    belonging to class k given the data. This is called the posterior probability.


    +   • p(x|k)* is the same thing but flipped around: what is the probability of
    observing this data, given the case belongs to class k? Put another way: if this
    case was in class k, what is the likelihood of it having these values of the predictor
    variables? This is called the likelihood.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '+   • p(k) is called the prior probability, and is simply the probability of
    any case belonging to class k. This is the proportion of all cases in the data
    that belong class k. For example, if 30% of cases were in class k, *p(k) would
    equal 0.3.


    Finally, p(x) is the probability of observing a case with exactly these predictor
    values in the dataset. This is called the evidence. Estimating the evidence is
    often very difficult (because each case in the dataset may have a unique combination
    of predictor values), and it only serves to make all the posterior probabilities
    sum to one. Therefore, we can omit the evidence from the equation and say that:


    # EQUATION 5.3


    ```

    p(k|x) p(x|k) × p(k)

    ```


    where the symbol means the values either side of it are proportional to each other
    instead of equal to each other. In a more digestible way:


    # EQUATION 5.4


    ```

    posterior likelihood × prior

    ```


    The prior probability for a case (p(k)) is easy to work out: it’s simply the proportion
    of cases in the dataset that belong to class k. But how do we calculate the likelihood
    (p(x|k))? The likelihood is calculated by projecting the data onto their discriminant
    functions, and estimating their probability density. The probability density is
    simply the relative probability of observing a case with a particular combination
    of discriminant scores.


    Discriminant analysis assumes that the data are normally distributed, so it estimates
    the probability density by fitting a normal distribution to each class, across
    each discriminant function. The center of each normal distribution is the class
    centroid, and its standard deviation is one unit on the discriminant axis. This
    is illustrated in figure 5.8 for a single discriminant function, and for two (the
    same happens in more than two dimensions but is difficult to visualize!). You
    can see that cases near the class centroid along the discriminant axes have high
    probability density for that class, and cases far away have a lower probability
    density.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# One discriminant function


    # Two discriminant functions


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_132_0.png)


    Figure 5.8 Probability density of each class is assumed to be normally distributed,
    where the center of each distribution is the centroid of the class. This is shown
    for one discriminant function (for classes k and j) and for two.


    Once the probability density for a case, for a given class, is estimated, it can
    be passed into the equation:




    posterior = likelihood × prior


    The posterior probability is estimated for each class, and the class that has
    the highest probability is what the case is classified as.


    > The reason the prior probability (proportion of cases in that class) is important
    is that if the classes are severely imbalanced, despite a case being far from
    the centroid of a class, it could be more likely to belong to that class simply
    because there are so many more cases in it.


    Baye’s rule is very important in statistics and machine learning. Don’t worry
    though if you don’t quite understand it yet, that’s by design. I want to introduce
    you to it gently now, and we’ll cover it in more depth in Chapter 6.


