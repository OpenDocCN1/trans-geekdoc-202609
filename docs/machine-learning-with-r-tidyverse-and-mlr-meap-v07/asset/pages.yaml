  md: 'are trying to predict). I’ll introduce you to the extremely powerful `mlr`
    package in R, which contains an eye-watering number of machine learning algorithms,
    and greatly simplifies all of our machine learning tasks.


    # ### 3.1 What is the *k*-nearest neighbors algorithm?


    I think the simple things in life are the best: playing frisbee in the park, walking
    my dog, playing board games with my family, and using the k-NN algorithm. Some
    machine learning practitioners look down on k-NN a little because it’s very simplistic.
    In fact, k-NN is arguably *the most simple machine learning algorithm*, and this
    is one of the reasons I like it so much. Because, in spite of its simplicity,
    k-NN can provide surprisingly good classification performance, and its simplicity
    makes it easy to interpret.


    > > **NOTE**  Remember that, because k-NN uses labeled data, it is a supervised
    learning algorithm.


    # #### 3.1.1 How does the *k*-nearest neighbors algorithm learn?


    So how does k-NN learn? Well I’m going to use snakes to help me explain. I’m from
    the UK where, some people are surprised to learn, we have a few native species
    of snake. Two examples of these are grass snakes, and the adder, which is the
    only venomous snake in the UK. But we also have a cute, limbless reptile called
    a slow worm, which is commonly mistaken for a snake.


    So imagine you work for a reptile conservation project aiming to count the numbers
    of grass snakes, adders, and slow worms in a woodland. Your job is to build a
    model that allows you to quickly classify reptiles you find into one of these
    three classes. When you find one of these animals, you only have enough time to
    rapidly estimate its length and some measure of how aggressive it was towards
    you, before it slithers away again (funding is very scarce for your project!).
    A reptile expert helps you manually classify the observations you’ve made so far,
    but you decide to build a k-NN classifier to help you quickly classify future
    specimens you come across.


    Look at the plot of data before classification in figure 3.1. Each of our cases
    is plotted against body length and aggression, and the species identified by your
    expert is indicated by the shape of the datum. You go into the woodland again
    and collect data from three new specimens, which are shown by the black crosses.'
