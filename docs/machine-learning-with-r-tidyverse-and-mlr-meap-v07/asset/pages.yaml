    \ function\n\n```\n```r\nlibrary(ggplot2)\ndata(iris)\nmyPlot <- ggplot(iris,\
    \ aes(x = Sepal.Length, y = Sepal.Width)) +\n  geom_point() +\n  theme_bw()\n\n\
    myPlot\n```\n```\n\n> **TIP** Notice that we don’t need to wrap these in quotes;\
    \ `ggplot` is clever!\n\nWe finish the line with the + symbol, which we use to\
    \ add additional layers to our plot (we can add as many layers as it takes to\
    \ create our desired plot). Convention states that when we add additional layers\
    \ to our plots, we finish the current layer with +, and place the next layer on\
    \ a new line. This helps maintain readability.\n\n> **IMPORTANT** When adding\
    \ layers to the initial `ggplot()` function call, each line needs to finish with\
    \ +; you cannot put the + on a new line.\n\nThe next layer is a function called\
    \ `geom_point()`. *Geom* stands for *geometric object*, which is a graphical element\
    \ used to represent data, such as a points, bars, lines, box and whiskers etc.,\
    \ and so the functions to produce these layers are all named as `geom_[graphical\
    \ element]`. For example, lets add two new layers to our plot, `geom_density_2d()`\
    \ which adds density contours, and `geom_smooth()` which fits a smoothed line\
    \ with confidence bands to the data.\n\n![](img/a22105d68c35e8d5bd3c7bafb4644881_38_0.png)\n\
    \n**Figure 2.2** The same scatter plot as in figure, with 2D density contours\
    \ and a smoothed line added as layers (using the `geom_density_2d()` and `geom_smooth`\
    \ functions, respectively."
