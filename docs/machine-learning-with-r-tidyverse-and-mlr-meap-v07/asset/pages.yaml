    # ## 12.3.1 Loading and exploring the fuel dataset


    The mlr package, conveniently, comes with several pre-defined tasks to help you
    experiment with different learners and processes. The dataset we’re going to work
    with in this chapter is contained inside mlr’s `fuelsubset.task`. We load this
    task into our R session the same way we would any built-in dataset: using the
    `data()` function. We can then use mlr’s `getTaskData()` function to extract the
    data from the task, so we can explore it. As always, I used the `as_tibble()`
