  md: "> > **TIP** Notice I omit the linear kernel? This is because the linear kernel\
    \ is the same as the polynomial kernel with degree = 1, so we’ll just make sure\
    \ we include 1 as a possible value for the degree hyperparameter. Including the\
    \ linear kernel *and* the 1st degree polynomial kernel is simply a waste of computing\
    \ time.\n\nNext, we use the `makeParamSet()` function to define the hyperparameter\
    \ space we wish to tune over. To the `makeParamSet()` function, we supply the\
    \ information needed to define each hyperparameter we wish to tune, separated\
    \ by columns. Let’s break this down line by line:\n\n+   - the kernel hyperparameter\
    \ takes discrete values (the name of the kernel function), so we use the `makeDiscreteParam()`\
    \ function to define its values as the vector of kernels we created\n+   - the\
    \ degree hyperparameter takes integer values (whole numbers), so we use the `makeIntegerParam()`\
    \ function and define its lower and upper values we wish to tune over\n+   - the\
    \ cost and gamma hyperparameters take numeric values (any number between zero\
    \ and infinity), so we use the `makeNumericParam()` function to define their lower\
    \ and upper values we wish to tune over\n\nFor each of these functions, the first\
    \ argument is the name of the hyperparameter given by `getParamSet(\"classif.svm\"\
    )`, in quotes.\n\n# Listing 6.10 Defining the hyperparameter space for tuning\n\
    \n```\n```r\nkernels <- c(\"polynomial\", \"radial\", \"sigmoid\")\n\nsvmParamSpace\
    \ <- makeParamSet(\n  makeDiscreteParam(\"kernel\", values = kernels),\n  makeIntegerParam(\"\
    degree\", lower = 1, upper = 3),\n  makeNumericParam(\"cost\", lower = 0.1, upper\
    \ = 10),\n  makeNumericParam(\"gamma\", lower = 0.1, 10))\n```\n```\n\nCast your\
    \ mind back to chapter 3 when we tuned *k* for the k-NN algorithm. We used the\
    \ grid search procedure to try every value of *k* that we defined, during tuning.\
    \ This is what the grid search method does: tries every combination of the hyperparameter\
    \ space you define, and finds the best-performing combination.\n\nGrid search\
    \ is great because, provided you specify a sensible hyperparameter space to search\
    \ over, it will always find the best-performing hyperparameters. But look at the\
    \ hyperparameter space we defined for our SVM. Let’s say we wanted to try the\
    \ values for the cost and gamma hyperparameters from 0.1 to 10, in steps of 0.1\
    \ (that’s 100 values of each). We have three kernel functions we’re trying, and\
    \ three values of the degree hyperparameter. To perform a grid search over this\
    \ parameter space would require training a model 90,000 times! If, in such a situation,\
    \ you have the time, patience, and computational budget for such a grid search,\
    \ then good for you. I, for one, have better things I could be doing with my computer!"
