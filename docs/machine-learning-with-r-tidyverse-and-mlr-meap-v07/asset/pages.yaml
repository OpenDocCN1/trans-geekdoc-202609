    ozoneImp <- impute(as.data.frame(ozoneClean),

    classes = list(numeric = imputeMethod))

    ```


    This results in a dataset we can access using ozoneImp$data whose missing values
    have been replaced with predictions from a model learned by the rpart algorithm.
    Now, we can define our task and learner, using the imputed dataset. By supplying
    "regr.lm" as argument to the makeLearner() function, we''re telling mlr that we
    want to use linear regression.


    > In part 2 of the book we were used to defining learners as classif.[ALGORITHM].
    In this part of the book, instead of classif., the prefix will be regr.. This
    is important because the same algorithm can sometimes be used for classification
    and regression, so the prefix tells mlr which task we want to use the algorithm
    for.




    ```

    ozoneTask <- makeRegrTask(data = ozoneImp$data, target = "Ozone")

    lin <- makeLearner("regr.lm")

    ```




    Sometimes, it may be obvious to us which variables have no predictive value and
    can be removed from the analysis. Domain knowledge is also very important here,
    where we include variables in the model we, as experts, believe to have some predictive
    value to the outcome we''re studying. But it''s often better to take a less subjective
    approach to feature selection, and allow an algorithm to choose the relevant features
    for us. In this section I''ll show you how we can implement this in mlr.


    +   1. filter methods

    +   2. wrapper methods


    Filter methods compare each of the predictors against the outcome variable, and
    calculate a metric of how much the outcome varies with the predictor. This metric
    could be a correlation, for example if both variables are continuous. The predictor
    variables are ranked in order of this metric (which, in theory, ranks them in
    order of how much information they can contribute to the model), and we can choose
    to drop a certain number or proportion of the worst-performing variables from
    our model. The number or proportion of variables we drop can be tuned as a hyperparameter
    during model building.'
