- pgno: 187
  md: '```

    zooTask <- makeClassifTask(data = zooTib, target = "type")

    tree <- makeLearner("classif.rpart")

    ```


    Next, we need to perform hyperparameter tuning. Recall that the first step is
    to define a hyperparameter space over which we want to search. Let’s have a look
    at the hyperparameters available to us for the rpart algorithm, in code listing
    7.4. We’ve already discussed the most important hyperparameters for tuning: minsplit,
    minbucket, cp, and maxdepth. There are a few others you may find useful to know
    about.


    The maxcompete hyperparameter controls how many candidate splits can be displayed
    for each node in the model summary. The model summary shows you the candidate
    splits in order of how much they improved the model (Gini gain). It may be useful
    to understand what the next best split was after the one that was actually used,
    but tuning maxcompete doesn’t affect model performance, only its summary.


    The maxsurrogate hyperparameter is similar to maxcompete, but controls how many
    surrogate splits are shown. A surrogate split is a split used if a particular
    case is missing data for the actual split. In this way, rpart can handle missing
    data as it learns which splits can be used in place of missing variables. The
    maxsurrogate hyperparameter controls how many of these surrogates to retain in
    the model (if a case is missing a value for the main split it is passed to the
    first surrogate split, then to the second surrogate if it is also missing a value
    for the first surrogate etc.). Although we don’t have any missing data in our
    dataset, future cases we wish to predict might. We could set this to 0 to save
    some computation time, which is equivalent to not using surrogate variables at
    all, but this may reduce the accuracy of predictions made on future cases with
    missing data. The default value of 5 is usually fine.


    > Recall from chapter 6 that we can quickly count the number of missing values
    per column of a data.frame / tibble by running map_dbl(zooTib, ~sum(is.na(.))).


    The usesurrogate hyperparameter controls how the algorithm uses surrogate splits.
    A value of 0 means surrogates will not be used, and cases with missing data will
    not be classified. A value of 1 means surrogates will be used, but if a case is
    missing data for the actual split, and for all the surrogate splits, that case
    will not be classified. The default value of 2 means surrogates will be used,
    but a case with missing data for the actual split and for all the surrogate splits
    will be sent down the branch that contained the most cases. The default value
    of 2 is usually appropriate.'
  merge: -1
  img_proc: true
