- pgno: 147
  md: 'In spite of this naive assumption being wrong quite often, naive Bayes tends
    to perform quite well even in the presence of non-independent predictors. Having
    said this, strongly dependent predictor variables will impact performance.


    So the likelihood and prior probabilities are quite simple to compute and are
    the parameters learned by the algorithm, but what about the evidence (p(words))?
    In practice, because the values of the predictor variables are usually reasonably
    unique to each case in the data, calculating the evidence (the probability of
    observing that combination of values) is very difficult. As the evidence is really
    just a normalizing constant that makes all the posterior probabilities sum to
    one, we can discard it and simply multiply the likelihood and prior probability:


    # EQUATION 6.7


    posterior likelihood × prior


    Note that instead of an = sign, I used to mean "proportional to" as without the
    evidence to normalize the equation, the posterior is no longer equal to the likelihood
    times the prior. This is okay though because proportionality is good enough to
    find the most likely class. Now for each tweet we simply calculate the relative
    posterior probability for each of the topics:


    # EQUATION 6.8


    +   p(politics/words) p(words/politics) × p(politics)

    +   p(sports/words) p(words/sports) × p(sports)

    +   p(movies/words) p(words/movies) × p(movies)

    +   p(other/words) p(words/other) × p(other)


    and assign the tweet to the topic with the highest relative posterior probability.


    # 6.1.2 How is the likelihood calculated for categorical and continuous predictors?


    When we have a categorical predictor (such as whether a word is present or not),
    naive Bayes simply uses that proportion of training cases in that particular class,
    with that value of the predictor. When we have a continuous variable, naive Bayes
    (typically) assumes the data within each group are normally distributed. The probability
    density of each case, based on this fitted normal distribution is then used to
    estimate the likelihood of observing this value of the predictor, in that class.
    In this way, cases near the mean of the normal distribution for a particular class
    will have high probability density for that class, and cases far away from the
    mean will have a low probability density. This is the same way you saw discriminant
    analysis calculate the likelihood in figure 5.7 in chapter 5.'
