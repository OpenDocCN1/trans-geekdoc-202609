- pgno: 142
  md: '# Classifying based on probabilities and hyperplanes: naive Bayes and support
    vector machines


    +   - What is the naive Bayes algorithm?

    +   - What is the support vector machine algorithm?

    +   - Building a naive Bayes model to predict political party based on votes

    +   - Building a support vector machine model to classify spam emails

    +   - Tuning many hyperparameters simultaneously with a random search


    The naive Bayes and support vector machine (SVM) algorithms are supervised learning
    algorithms for classification. Each algorithm learns in a different way. The naive
    Bayes algorithm uses Bayes'' rule that you learned about in chapter 5, to estimate
    the probability of new data belonging to one of the classes in the dataset. The
    case is then assigned to the class with the highest probability. The SVM algorithm
    looks for a hyperplane (a surface that has one fewer dimensions then there are
    predictor variables) that separates the classes. The position and direction of
    this hyperplane depends on support vectors, cases that lie closest to the boundary
    between the classes.


    > While commonly used for classification, the SVM algorithm can also be used for
    regression problems. I won''t discuss how here, but if you''re interested (and
    want to explore SVMs in more depth generally), see the book Support Vector Machines,
    by Andreas Christmann and Ingo Steinwart (Springer, 2008).


    The naive Bayes and SVM algorithms have different properties that may make each
    suitable in different circumstances. For example, naive Bayes can mix both continuous
    and categorical predictors natively, while for SVMs, categorical variables must
    first be recoded into a numerical format. On the other hand, SVMs are excellent
    at finding decision boundaries between classes'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'that are not linearly separable, by adding a new dimension to the data that
    reveals a linear boundary. The naive Bayes algorithm will rarely outperform an
    SVM trained on the same problem, but naive Bayes tends to perform well in problems
    like spam detection and text classification.


    Models trained using naive Bayes also have a probabilistic interpretation. For
    each case the model makes predictions on, the model outputs the probability of
    that case belonging to one class over an other, giving us a measure of certainty
    in our prediction. This is useful for situations in which we may want to further
    scrutinize cases with probabilities close to 50%. Conversely, models trained using
    the SVM algorithm typically don''t output easily-interpretable probabilities,
    but have a geometric interpretation. In other words, they partition the feature
    space and classify cases based on which partition they fall within. SVMs are more
    computationally expensive to train than naive Bayes models, so if a naive Bayes
    model performs well for your problem, there may be no reason to choose a model
    that is more computationally expensive to train.


    By the end of this chapter, you''ll know how the naive Bayes and SVM algorithms
    work, and how to apply them to your data. You will also have learned how to tune
    several hyperparameters simultaneously, as the SVM algorithm has many of them.
    You will also understand how to apply the more pragmatic approach of using a random
    search instead of the grid search we applied in chapter 3, to find the best-performing
    combination of hyperparameters.




    In the last chapter, I introduced you to Bayes'' Rule (named after the mathematician
    Thomas Bayes). I showed how discriminant analysis algorithms use Bayes'' rule
    to predict the probability of a case belonging to each of the classes, based on
    its discriminant function values. The naive Bayes algorithm works in exactly the
    same way, except that it doesn''t perform dimension reduction as discriminant
    analysis does, and it can handle categorical, as well as continuous, predictors.
    In this section I hope to convey a deeper understanding of how Bayes'' rule works
    with a few examples.


    Imagine 0.2% of the population have unicorn disease (symptoms include obsession
    with glitter and compulsive rainbow drawing). The test for unicorn disease has
    a true positive rate of 90% (if you have the disease, the test will detect it
    90% of the time). When tested, 5% of the whole population get a positive result
    from the test. Based on this information, if you get a positive result from the
    test, what is the probability you have unicorn disease?


    Many people''s instinct is to say 90%, but this doesn''t account for how prevalent
    the disease is and the proportion of tests that are positive (which also includes
    false positives). So how do we estimate the probability of having the disease,
    given a positive test result? Well we use Bayes'' rule. Let''s remind ourselves
    of what Bayes'' rule is:'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# EQUATION 6.1


    $$p(k|x)=\frac{p(x|k)\times p(k)}{p(x)}$$


    where:


    +   - $p(k|x)$ is the probability of having the disease (k) given a positive test
    result (x). This is called the *posterior probability*.

    +   - $p(x|k)$ is the probability of getting a positive test result if you *do*
    have the disease. This is called the *likelihood*.

    +   - $p(k)$ is the probability of having the disease irrespective of any test.
    This is the proportion of people in the population with the disease and is called
    the *prior probability*.

    +   - $p(x)$ is the probability of getting a positive test result and includes
    the true positives and false positives. This is called the *evidence*.


    We can rewrite the above in plain English:


    # EQUATION 6.2


    $$\text{posterior}=\frac{\text{likelihood}\times\text{prior}}{\text{evidence}}$$


    So our likelihood (the probability of getting a positive test result if we do
    have unicorn disease) is 90%, or 0.9 expressed as a decimal. Our prior probability
    (the proportion of people with unicorn disease) is 0.2%, or 0.002 as a decimal.
    Finally, our evidence (the probability of getting a positive test result) is 5%,
    or 0.05 as a decimal. You can see all these values illustrated in figure 6.1.
    Now we simply substitute in these values into Bayes'' rule:


    # EQUATION 6.3


    $$\text{posterior}=\frac{0.9\times0.002}{0.05}=0.036$$


    Phew! After taking into account the prevalence of the disease and the proportion
    of tests that are'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'positive (including false positives), a positive test means we only have a
    3.6% chance of actually having the disease! Much better than 90%! This is the
    power of Bayes'' rule: it allows you to incorporate prior information to get a
    more accurate estimation of conditional probabilities (the probability of something,
    given the data).


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_145_0.png)


    Figure 6.1 Using Bayes'' rule to calculate the posterior probability of having
    unicorn disease, given a positive test result. The priors are the proportion of
    people with or without the disease. The likelihoods are the probabilities of getting
    positive or negative test results for each disease status. The evidence is the
    probability of getting a positive test result (true positives plus the false positives).




    Let''s take another, more machine learning-focused, example. Imagine you have
    a database of tweets from the social media platform Twitter, and want to build
    a model that automatically classifies each tweet into a topic. The topics are:


    +   - politics

    +   - sports

    +   - movies

    +   - other


    You create four, categorical predictor variables:


    +   - whether the word "opinion" is present

    +   - whether the word "score" is present

    +   - whether the word "game" is present

    +   - whether the word "cinema" is present


    > I''m keeping things simple for this example. If we were really trying to build
    a model to predict tweet topics, we would need to include many more words than
    this!'
  merge: -1
  img_proc: true
