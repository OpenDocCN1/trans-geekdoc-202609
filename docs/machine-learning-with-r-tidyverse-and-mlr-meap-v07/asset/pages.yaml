    One of the most common mistakes many people make when training machine learning
    models is that they don’t include their data-dependent pre-processing steps inside
    their cross-validation procedure. If this pre-processing includes the tuning of
    any hyperparameters, it’s important we use nested cross-validation. This ensures
    that the data we use for the final evaluation of the model, hasn’t been seen by
    the model at all.


    Nested cross-validation starts by splitting the data up into training and test
    sets (this can be done using the hold-out, k-fold, or leave-one-out methods).
    This division is called the outer loop. The training set is used to cross-validate
    each value of our hyperparameter search space. This is called the inner loop.
    The hyperparameter that gives the best cross-validated performance from each inner
    loop, is passed to the outer loop. A model is trained on each training set of
    the outer loop, using the best hyperparameter from its inner loop, and these models
    are used to make predictions on their test sets. The average performance metrics
    of these models across the outer loop are then reported as an estimate of how
    the model will perform on unseen data. I’ve reproduced figure 3.16 here in figure
    20.6, that shows a schematic illustrating nested cross-validation. In this example,
    we are using three-fold cross-validation for the outer loop, and four-fold cross-validation
    for the inner loop.'
