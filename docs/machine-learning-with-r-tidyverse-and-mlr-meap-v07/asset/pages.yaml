  md: "# 3.6 What algorithms can learn and what they must be told:  \nparameters and\
    \ hyperparameters\n\nMachine learning models often have *parameters* associated\
    \ with them. A parameter is a variable or value that is estimated from the data,\
    \ that is internal to the model and controls how it makes predictions on new data.\
    \ An example of a model parameter is the slope of a regression line.\n\nIn the\
    \ k-NN algorithm, *k* is not a parameter, because the algorithm doesn’t estimate\
    \ it from the data (in fact, the k-NN algorithm doesn’t actually learn any parameters).\
    \ Instead, *k* is what’s known as a *hyperparameter*, which is a variable or option\
    \ that controls how a model makes predictions, but which is *not* estimated from\
    \ the data. As data scientists, we don’t have to provide parameters to our models,\
    \ we simply provide the data and the algorithms learn the parameters for themselves.\
    \ We do, however, need to provide them with whatever hyperparameters they require.\
    \ We’ll see throughout this book that different algorithms require and use different\
    \ hyperparameters to control how they make predictions.\n\nSo because *k* is a\
    \ hyperparameter of the k-NN algorithm, it can’t be estimated by the algorithm\
    \ itself and it’s down to us to choose a value. How do we decide? Well there are\
    \ three ways you can choose *k* or, in fact, any hyperparameter:\n\n+   1. Pick\
    \ a \"sensible\" or default value that has worked on similar problems before\n\
    +   2. Manually try a few different values and see which one gives you the best\
    \ performance\n+   3. Use a procedure called *hyperparameter tuning* to automate\
    \ the selection process for you\n\n**Option one (picking a \"sensible\" value\
    \ that has worked on similar problems) is a bad idea.** You have no way of knowing\
    \ whether the value of *k* you’ve chosen is the best one. Just because a value\
    \ worked on other datasets before, doesn’t mean it will perform well on this dataset.\
    \ This is the choice of the lazy data scientist who doesn’t care much about getting\
    \ the most from their data.\n\n**Option two (manually trying a few different values)\
    \ is a bit better.** The idea here is that you pick a few \"sensible\" values\
    \ of *k*, build a model with each of them and see which model performs the best.\
    \ This is better, because you’re more likely to find the best performing value\
    \ of *k*, but you’re still not guaranteed to find it, and doing this manually\
    \ could be tedious and slow. This is the choice of the data scientist who cares\
    \ but doesn’t really know what their doing.\n\n**Option three (using a procedure\
    \ called hyperparameter tuning) is the best.** This solution both maximizes the\
    \ likelihood of you finding the best-performing value of *k*, while also automating\
    \ the process for you. This is the method we’ll be using throughout the book."
  merge: -1
  img_proc: true
- pgno: 81
  md: '> While option three is generally the best if possible, some algorithms are
    so computationally expensive that they prohibit extensive hyperparameter tuning,
    in which case we may have to settle for option two.


    But how does changing the value of k actually impact model performance? Well values
    of k that are too low, may start to model noise in the data. For example, if we
    set k = 1, then a healthy patient could be misclassified as chemically diabetic
    just because a single, chemically diabetic patient with an unusually low insulin
    level, was their nearest neighbor. In this situation, instead of just modeling
    the systematic differences between the classes, we’re also modeling the noise
    and unpredictable variability in the data.


    On the other hand, if we set k too high, a large number of dissimilar patients
    will be included in the vote and the model will be insensitive to local differences
    in the data. This is, of course, the bias-variance trade-off we talked about earlier.




    So let’s apply hyperparameter tuning to optimize the value of k for our model.
    Now, an approach we could follow, would be to build models with different values
    of k using our full dataset, and pass the data back through the model and see
    which value of k gives us the best performance. This is bad practice, because
    there’s a large chance we’ll get a value of k that overfits the dataset we tuned
    it on. So once again, we rely on cross-validation to help us guard against overfitting.


    The first thing we need to do is define a range of values over which mlr will
    try, in the tuning of k:


    ```

    knnParamSpace <- makeParamSet(makeDiscreteParam("k", values = 1:10))

    ```


    The makeDiscreteParam() function inside the makeParamSet() function allows us
    to specify that the hyperparameter we’re going to be tuning is k, and that we
    want to search the values between 1 and 10 for the best value of k. As its name
    suggests, makeDiscreteParam() is used to define discrete hyperparameter values,
    such as k in k-NN, but there are also functions to define continuous and logical
    hyperparameters that we’ll explore later in the book. The makeParamSet() function
    defines the hyperparameter space we defined as a parameter set, and if we wanted
    to tune more than one hyperparameter during tuning, we would simply separate them
    by commas inside this function.


    Next, we define how we want mlr to search the parameter space. There are a few
    options for this, and in later chapters we’ll explore others, but for now we’re
    going to use the grid search method. This is probably the simplest method and
    simply tries every single value in the parameter space, when looking for the best
    performing value. For tuning continuous'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'hyperparameters, or when we are tuning several hyperparameters at once, grid
    search becomes prohibitively expensive, and so other methods like random search
    are preferred.


    ```

    gridSearch <- makeTuneControlGrid()

    ```


    Next, we define how we''re going to cross-validate the tuning procedure and we''re
    going to use my favorite: repeated k-fold cross-validation. The principle here
    is that for every value in the parameter space (integers 1 to 10), we perform
    repeated k-fold cross-validation. For each value of k, we take the average performance
    measure across all those iterations, and compare that with the averaged performance
    measures for all the other values of k we tried. This will hopefully give us the
    value of k that performs best.


    ```

    cvForTuning <- makeResampleDesc("RepCV", folds = 10, reps = 20)

    ```


    Now, we call the tuneParams() function to perform the tuning:


    ```

    tunedK <- tuneParams("classif.knn", task = diabetesTask, resampling = cvForTuning,
    par.set = knnParamSpace, control = gridSearch)

    ```


    The first and second arguments are the names of the algorithm and task we''re
    applying, respectively. We give our cross-validation strategy as the resampling
    argument, the hyperparameter space we define as the par.set argument, and the
    search procedure to the control argument.


    If we call our tunedK object, we get the best performing value of k, 7, and the
    average MMCE value for that value. We can access the best performing value of
    k directly by selecting the $x component:


    ```

    tunedK

    Tune result:

    Op. pars: k=7

    mmce.test.mean=0.0769524

    tunedK$x

    $k

    [1] 7

    ```


    We can also visualize the tuning process (the result of this code is shown in
    figure 3.15):


    ```

    knnTuningData <- generateHyperParsEffectData(tunedK)

    plotHyperParsEffect(knnTuningData, x = "k", y = "mmce.test.mean", plot.type =
    "line") +

    theme_bw()

    ```'
