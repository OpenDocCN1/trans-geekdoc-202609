- pgno: 343
  md: '# # Maximizing similarity: *t*-SNE and UMAP


    +   **This chapter covers:**

    +   - What is non-linear dimension reduction and why is it important?

    +   - What is t-SNE?

    +   - What is UMAP?


    In the last chapter, I introduced you to PCA as our first dimension reduction
    technique. While PCA is a linear dimension reduction algorithm (it finds linear
    combinations of the original variables), sometimes the information in a set of
    variables can’t be extracted as a linear combination of these variables. In such
    situations, there are a number of non-linear dimension reduction algorithms we
    can turn to, such as *t-distributed stochastic neighbor embedding* (t-SNE), and
    *uniform manifold approximation and projection* (UMAP).


    The t-SNE is one of the most popular non-linear dimension reduction algorithms.
    t-SNE measures the distance between each observation in the dataset, to every
    other observation, then randomizes the observations across (usually) two new axes.
    The observations are then iteratively shuffled around these new axes until their
    distances to each other in this two-dimensional space are as similar to the distances
    in the original high dimensional space as possible.


    UMAP is another non-linear dimension reduction algorithm that overcomes some of
    the limitations of t-SNE. It works in a similar way to t-SNE (finds distances
    in high-dimensional space, then tries to reproduce these distances in low-dimensional
    space), but differs in the way it measures distances.


    By the end of this chapter, I hope you’ll understand what non-linear dimension
    reduction is and why it can be beneficial compared to linear dimension reduction.
    I will show you how the t-SNE, and UMAP algorithms work, how they’re different
    from each other, and we’ll apply each of'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'them to our bank notes dataset from the previous chapter, so we can compare
    their performance with PCA. If you no longer have the swissTib and newBanknotes
    objects defined in your global environment, just re-run code listings 13.1 and
    13.7.


    # ## ***14.1 What is t-SNE?***


    In this section, I’ll show you what t-distributed stochastic neighbor embedding
    is, how it works, and why it’s useful. t-distributed stochastic neighbor embedding
    is such a mouthful. I’m so glad people shorten this to "t-SNE" (usually pronounced
    "tee-snee", occasionally pronounced "tiz-nee"), not least because when you hear
    someone say it, you can say "bless you", and everyone laughs (at least the first
    few times).


    While PCA is a linear dimension reduction algorithm (because it finds new axes
    that are linear combinations of the original variables), t-SNE is a non-linear
    dimension reduction algorithm. It is non-linear, because instead of finding new
    axes that are logical combinations of the original variables, it focuses on the
    similarities between nearby cases in a dataset, and tries to reproduce these similarities
    in a lower-dimensional space. The main benefit of this approach is that t-SNE
    will almost always do a better job of highlighting patterns in the data, such
    as clusters, than PCA will. One of the downsides of this approach is that the
    axes are no longer interpretable, as they don’t represent logical combinations
    of the original variables.


    The first step in the t-SNE algorithm is to compute the distance between each
    case, and every other case in the dataset. By default this distance is Euclidean
    distance, which is the straight line distance between any two points in the feature
    space (but we can use other measures of distance instead). These distances are
    then converted into probabilities. This is illustrated in figure 14.1.


    For a particular case in the dataset, the distance between this case and all other
    cases is measured. Then, a normal distribution is centered on this case, and the
    distances are converted into probabilities by mapping them onto the probability
    density of the normal distribution. The standard deviation of this normal distribution
    is inversely related to the density of cases around the case in question. Put
    another way, if there are lots of cases nearby (more dense), then the standard
    deviation of the normal distribution is smaller, but if there are few cases nearby
    (less dense), then the standard deviation is larger.


    After converting the distances to probabilities, the probabilities for each case
    are scaled by dividing them by their sum. This makes the probabilities sum to
    one for every case in the dataset. Using different standard deviations for different
    densities, and then normalizing the probabilities to one for every case, means
    if there are dense clusters and sparse clusters of cases in the dataset, t-SNE
    will expand the dense clusters and compress the sparse ones so they can be visualized
    more easily together. The exact relationship between data density and the standard
    deviation of the normal distribution depends on a hyperparameter called *perplexity*,
    which we’ll discuss shortly.'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'Once the scaled probabilities have been calculated for each case in the dataset,
    we have a matrix of probabilities that describes how similar each case is to each
    of the other cases. This is visualized in figure 14.2 as a heatmap, which is a
    useful way of thinking about it.


    Figure 14.1 t-SNE measures the distances from each case to every other case, converted
    into a probability by fitting a normal distribution over the current case. These
    probabilities are scaled by dividing them by their sum, so that they add to one.


    Our matrix of probabilities is now our reference or template, for how the data
    relate to each other in the original, high-dimensional space. The next step in
    the t-SNE algorithm is to randomize the cases along (usually) two new axes (this
    is where the "stochastic" bit from the name comes from).


    Figure 14.2 The scaled probabilities for each case are stored as a matrix of values.
    This is visualized here as a heatmap, where the closer two cases are, the darker
    the box is that represents their distance in the heatmap.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '> It doesn''t need to be two, but it commonly is. This is because humans struggle
    to visualize data in more than two dimensions at once, and because beyond three
    dimensions, the computational cost of t-SNE becomes more and more prohibitive.


    t-SNE calculates the distances between the cases in this new, randomized, low-dimensional
    space and converts them into probabilities just like before. The only difference
    is that instead of using the normal distribution, it now uses the Student’s t
    distribution. The t distribution looks a bit like a normal distribution, except
    that it’s not quite as tall in the middle, and it’s tails are flatter and extend
    further out (see figure 14.3). It’s a bit like if someone sat on a normal distribution
    and squashed it a little. This is where the "t" in t-SNE comes from. I’ll explain
    why we use the t distribution momentarily.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_346_0.png)


    The job for t-SNE now is "shuffle" the data points around these new axes, step-by-step,
    to make the matrix of probabilities in the lower dimensional-space, look as close
    as possible to the matrix of probabilities in the original, high-dimensional space.
    The intuition here is that if the matrices are as similar as possible, then the
    data each case was close to in the original feature space, will still be close
    by in the low-dimensional space. You can think of this as a game of attraction
    and repulsion.


    To make the probability matrix in low-dimensional space look like the one in high-dimensional
    space, each case needs to move closer to cases that were close to it in the original
    data, and away from cases that were far away. So cases that should be nearby will
    pull their neighbor towards them, but cases that should be far away will push
    non-neighbors away from them. The balance of these attractive and repulsive forces
    causes each case in the dataset to move in a direction that makes the two probability
    matrices a little more similar. Now, in this new position, the'
  merge: -1
  img_proc: true
- pgno: 347
  md: "low-dimensional probability matrix is calculated again, and the cases move\
    \ again, making the low and high-dimensional matrices look a little more similar\
    \ again. This process continues until we reach a predetermined number of iterations,\
    \ or until the *divergence* (difference) between the matrices stops improving.\
    \ This whole process is illustrated in figure 14.4.\n\n> **NOTE**  \n> The difference\
    \ between the two matrices is measured using a statistic called the *Kullback–Leibler\
    \ divergence*, which is large when the matrices are very different, and zero when\
    \ the matrices are perfectly identical.\n\nNow why do we use the t distribution\
    \ to convert distances into probabilities in the low-dimensional space? Well,\
    \ notice again from figure 14.4 that the tails of the t distribution are wider\
    \ than for the normal distribution. This means that, in order to get the same\
    \ probability as from the normal distribution, dissimilar cases need to be pushed\
    \ further away from the case the t distribution is centered over. This helps spread\
    \ out clusters of data that might be present in the data, helping us to identify\
    \ them more easily. A major consequence of this however, is that t-SNE is often\
    \ said to retain *local* structure in the low-dimensional representation, but\
    \ doesn’t usually retain *global* structure. Practically, this means that we can\
    \ interpret cases that are close to each other in the final representation as\
    \ being similar to each other, but we can’t easily say which clusters of cases\
    \ were more similar to other clusters of cases, in the original data.\n\n![](img/a22105d68c35e8d5bd3c7bafb4644881_347_0.png)\n\
    \n**Figure 14.4** Cases are randomly initialized over the new axes (one axis is\
    \ shown here). The probability matrix is computed for this axis, and the cases\
    \ are shuffled around to make this matrix resemble the original, high-dimensional\
    \ matrix by minimizing the Kullback-Leibler (KL) divergence. During shuffling,\
    \ cases are attracted toward cases that are similar to them (lines with circles),\
    \ and repulsed away from cases that are dissimilar (lines with triangles)."
  merge: -1
  img_proc: true
