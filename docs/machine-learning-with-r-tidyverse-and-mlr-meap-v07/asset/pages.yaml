    \n```\ncvWithTuning\n\nResample Result\nTask: spamtib\nLearner: classif.svm.tuned\n\
    Aggr perf: mmce.test.mean=0.0988956\nRuntime: 73.89\n```\n\nWe’re correctly classifying\
    \ 1 - 0.099 = 0.901 = 90.1% of emails as spam or not spam. Not bad for a first\
    \ attempt!\n\n# 6.7 Strengths and weaknesses of the SVM algorithm\n\nWhile it\
    \ often isn’t easy to tell which algorithms will perform well for a given task,\
    \ here are some strengths and weaknesses that will help you decide whether the\
    \ SVM agorithm will perform well for your task.\n\nThe strengths of the SVM algorithm\
    \ are:\n\n+   It’s very good at learning complex non-linear decision boundaries\n\
    \n+   It performs very well on a wide variety of tasks\n\n+   It makes no assumptions\
    \ about the distribution of the predictor variables\n\nThe weaknesses of the SVM\
    \ algorithm are:\n\n+   It is one of the most computationally expensive algorithms\
    \ to train\n\n+   It has multiple hyperparameters which need to be tuned simultaneously\n\
    \n+   It can only handle continuous predictor variables (although recoding a categorical\
    \ variable as numeric may help in some cases)"
