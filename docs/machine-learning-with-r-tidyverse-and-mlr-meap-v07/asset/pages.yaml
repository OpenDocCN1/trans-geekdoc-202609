  md: 'by dividing machine learning algorithms into categories, based on the function
    they perform and how they perform it.


    # 1.2 Classes of machine learning algorithms


    All machine learning algorithms can be categorized by their learning type, and
    the task they perform. There are three learning types:


    +   - *supervised*

    +   - *unsupervised*

    +   - *semi-supervised*


    This depends on how the algorithms learn. Do they require us to hold their hand
    through the learning process? Or do they learn the answers for themselves? Supervised
    and unsupervised algorithms can be further split into two classes each:


    +   - supervised

    +     - *classification*

    +     - *regression*

    +   - unsupervised

    +     - *dimension reduction*

    +     - *clustering*


    This depends on what they learn to *do*.


    So we categorize algorithms by how they learn, and what they learn to do. But
    why do we care about this? Well, there are **a lot** of machine learning algorithms
    available to us. How do we know which one to pick? What kind of data do they require
    to function properly? Knowing which categories different algorithms belong to
    makes our job of selecting the most appropriate ones much simpler. In the next
    section I cover how each of the classes is defined and why it’s different from
    the others. By the end of this section you’ll have a clear understanding of why
    you would use algorithms from one class over another. By the end of the book you’ll
    have the skills to apply a number of algorithms from each class.


    # 1.2.1 Differences between supervised, unsupervised, and semi-supervised learning


    Imagine you are trying to get a toddler to learn about shapes using blocks of
    wood. In front of them, they have a ball, a cube, and a star. You ask them to
    show you the cube, and if they point to the correct shape you tell them they are
    correct, and if they are incorrect you also tell them. You repeat this procedure
    until the toddler can identify the correct shape almost all of the time. This
    is called *supervised learning*, because you, the person who already knows which
    shape is which, are supervising the learner by telling them the answers.'
