  md: "# Listing 8.5 Tuning XGBoost hyperparameters\n\n```\nxgboost <- makeParamSpace(\n\
    \  makeNumericParam(\"eta\", lower = 0, upper = 1),\n  makeNumericParam(\"gamma\"\
    , lower = 0, upper = 5),\n  makeIntegerParam(\"max_depth\", lower = 1, upper =\
    \ 5),\n  makeNumericParam(\"min_child_weight\", lower = 1, upper = 10),\n  makeNumericParam(\"\
    subsample\", lower = 0.5, upper = 1),\n  makeNumericParam(\"colsample_bytree\"\
    , lower = 0.5, upper = 1),\n  makeIntegerParam(\"nrounds\", lower = 20, upper\
    \ = 20),\n  makeDiscreteParam(\"eval_metric\", values = c(\"merror\", \"mlogloss\"\
    )))\nrandSearch <- makeTuneControlRandom(maxim = 1000)\ncvForTuning <- makeResampleDesc(\"\
    CV\", iters = 5)\ntunedXgbPars <- tuneParams(xgb, task = xgbTask,\n  resampling\
    \ = cvForTuning,\n  par.set = xgbParamSpace,\n  control = randSearch)\ntunedXgbPars\n\
    Tune result:\nOp. pars: eta=0.669; gamma=0.368; max_depth=1; min_child_weight=1.26;\
    \ subsample=0.993; colsample_bytree=0.847; n mmce.test.mean=0.0190\n```\n\nNow\
    \ let's train our final XGBoost model using our tuned hyperparameters. You should\
    \ be starting to get familiar with this now. We first use setHyperPars() to make\
    \ a learner, and then passing it to the train() function.\n\n# Listing 8.6 Training\
    \ the final tuned model\n\n```\ntunedXgb <- setHyperPars(xgb, par.vals = tunedXgbPars$x)\n\
    tunedXgbModel <- train(tunedXgb, xgbTask)\n```\n\nLet's plot the loss function\
    \ against iteration number, to get an idea of whether we included enough trees\
    \ or not. First, we'll extract the model data using getLearnerModel(). Next, we\
    \ can extract a data frame containing the loss function data for each iteration\
    \ with the $evaluation_log component of the model data. This contains the columns\
    \ iter (iteration number) and train_mlogloss (the log loss for that iteration).\
    \ We can plot these against each other to see if the loss has flattened out (indicating\
    \ we have trained enough trees).\n\n# NOTE\n\nMy hyperparameter tuning selected\
    \ logloss as the best loss function. If yours selected classification error, you\
    \ will need to use $train_error here instead of $train_mlogloss."
