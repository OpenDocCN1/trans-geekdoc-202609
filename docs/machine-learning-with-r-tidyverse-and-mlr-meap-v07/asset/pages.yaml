- pgno: 185
  md: 'These four criteria combined can make for very stringent and complicated stopping
    criteria. As the values of these criteria cannot be learned directly from the
    data, they are hyperparameters! What do we do with hyperparameters? Tune them!
    So when we build a model with rpart, we will tune these stopping criteria to get
    values that give us the best-performing model.


    > Recall from chapter 3 that a variable or option than controls how an algorithm
    learns, but which cannot be learned from the data, is called a hyperparameter.




    In this section, you''re going to learn how to build a decision tree with rpart,
    and how to tune its hyperparameters. Imagine you work in public engagement at
    a wildlife sanctuary. You''re tasked with creating an interactive game for children,
    to teach them about different animal classes. The game asks the children to think
    of any animal in the sanctuary, and then asks them questions about the physical
    characteristics of that animal. Based on the responses the child gives, the model
    should tell the child what class their animal belongs to (mammal, bird, reptile
    etc.). It’s important your model is general enough that it can be used at other
    wildlife sanctuaries. Let’s start by loading the mlr and tidyverse packages.


    ```

    library(mlr)

    library(tidyverse)

    ```




    Let’s load the zoo dataset which is built into the mlbench package, convert it
    into a tibble and explore it a little. We have a tibble containing 101 cases and
    17 variables of observations made on various animals. 16 of these variables are
    logical, indicating the presence or absence of some characteristic, and the type
    variable is a factor containing the animal classes we wish to predict.'
  merge: -1
  img_proc: true
