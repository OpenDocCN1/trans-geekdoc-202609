- pgno: 374
  md: "# 15.2.2 Training the SOM\n\nLet’s train our SOM to place fleas in nodes such\
    \ that (hopefully) fleas of the same species are placed nearby each other, and\
    \ fleas of different species are separated. We start by installing and loading\
    \ the kohonen package (named after Teuvo Kohonen of course). The next thing we\
    \ need to do is create a grid of nodes that will become our map. We do this using\
    \ the `somgrid()` function (as shown in code listing 15.2), and have a few choices\
    \ to make:\n\n+   1. choosing the dimensions of the map\n+   2. deciding whether\
    \ our map will be made of rectangular or hexagonal nodes\n+   3. choosing which\
    \ neighborhood function to use\n+   4. deciding how the edges of the map behave\n\
    \nI’ve used the arguments of the `somgrid()` function in code listing 15.2 to\
    \ make these choices, but let’s explore what they each mean and how they each\
    \ affect the resulting map.\n\n# Listing 15.2 Loading the kohonen package and\
    \ creating a SOM grid\n\n```\n```r\ninstall.packages(\"kohonen\")\n\nlibrary(kohonen)\n\
    \nsomGrid <- somgrid(xdim = 5, ydim = 5, topo = \"hexagonal\",\n             \
    \      neighbourhood.fct = \"bubble\", toroidal = FALSE)\n```\n```\n\n# CHOOSING\
    \ THE DIMENSIONS OF THE MAP\n\nThe first choice is to choose the number of nodes\
    \ in the x and y dimensions, using the `xdim` and `ydim` arguments, respectively.\
    \ This is very important as it decides the size of the map, and the granularity\
    \ with which it will partition your cases. How do we choose the dimensions of\
    \ our map? This, as it turns out, isn’t an easy question to answer. Too few nodes\
    \ and all of your data will be piled up and clusters of cases will merge with\
    \ each other. Too many nodes and you could end up with many nodes containing just\
    \ a single case, or even no cases at all, diluting out any clusters and preventing\
    \ interpretation.\n\nThe optimal dimensions of a SOM map depends largely on the\
    \ number of cases in the data. We want to aim to have cases in most of the nodes\
    \ for a start, but really the optimal number of nodes in the SOM is whichever\
    \ best reveals patterns in your data. We can also plot the *quality* of each node,\
    \ which is a measure of the average difference between each case in a particular\
    \ node, and that node’s final weights. We can then consider choosing a map size\
    \ that gives us the best quality nodes. In this example, we’ll start by creating\
    \ a 5x5 grid, but this subjectivity in selecting the dimensions of the map is\
    \ arguably a weakness of SOMs."
  merge: -1
  img_proc: true
- pgno: 375
  md: '> The x and y dimensions of the grid don''t need to be of equal length. If
    I find a grid dimensionality that reveals patterns reasonably well in a dataset,
    I may extend the map in one dimension to see if this further helps to separate
    clusters of cases.


    > There is actually an implementation of the SOM algorithm called growing SOM,
    where the algorithm grows the size of the grid based on the data. At the end of
    this chapter I suggest you have a look at the GrowingSOM package in R: github.com/alexhunziker/GrowingSOM
    .


    # CHOOSING WHETHER THE MAP IS MADE OF RECTANGULAR OR HEXAGONAL NODES


    The next choice is to decide if we want our grid to be formed of rectangular or
    hexagonal nodes. Rectangular nodes are connected to four adjacent nodes, whereas
    hexagonal nodes are connected to six adjacent nodes. This means that when a node’s
    weights are updated, a hexagonal node will update its six immediate neighbors
    the most, whereas a rectangular node will update its four immediate neighbors
    the most. While hexagonal nodes can potentially result in "smoother" maps where
    clusters of data appear more "rounded" (whereas clusters of data in a grid of
    rectangular nodes may appear "blocky"), it depends on your data. In this example,
    we’ll specify that we want a hexagonal "topology" by setting the topo = "hexagonal"
    argument.


    > I usually prefer the results I get from hexagonal nodes, in terms of both the
    patterns they reveal in my data, and aesthetically!


    # CHOOSING WHICH NEIGHBORHOOD FUNCTION TO USE


    Next, we need to choose which neighborhood function we’re going to use, supplying
    our choice to the neighbourhood.fct argument (note the British spelling). The
    two options are "bubble", or "gaussian", corresponding to the two neighborhood
    functions we discussed earlier. Our choice of neighborhood function is a hyperparameter,
    and we could tune it, but for this example, we’re just going to use the bubble
    neighborhood function, which is the default.


    > I usually prefer the results I get from hexagonal nodes, in terms of both the
    patterns they reveal in my data, and aesthetically!'
  merge: -1
