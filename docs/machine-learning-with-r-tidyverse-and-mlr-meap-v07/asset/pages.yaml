- pgno: 372
  md: '# ## 15.2 Building our first SOM


    In this section, I’ll show you how to use the SOM algorithm to reduce the dimensions
    of a dataset into a two-dimensional map. By doing so, we hope to reveal some structure
    in the data by placing similar cases in the same, or nearby nodes. For example,
    if there is a grouping structure hidden in the data, we hope that different groups
    will separate to different regions of the map. I’ll also show you the algorithm’s
    hyperparameters and what they do.


    > **NOTE** Remember that a hyperparameter is a variable that controls the performance/function
    of an algorithm, but which cannot be directly estimated from the data itself.


    Imagine you’re the ringleader of a flea circus. You decide to take measurements
    on all of your fleas to see if there are different groups of fleas that will perform
    better at certain circus tasks. Let’s start by loading the tidyverse and GGally
    packages.


    ```

    ```r

    library(tidyverse)


    library(GGally)

    ```

    ```


    # ### 15.2.1 Loading and exploring the flea dataset


    Now, let’s load the data, which is built into the GGally package, convert it into
    a tibble (with `as_tibble()`) and plot it using the `ggpairs()` function we discovered
    in the last chapter.


    We have a tibble containing 7 variables, measured on 74 different fleas. The species
    variable is a factor telling us the species each flea belongs to, while the others
    are continuous measurements made on various parts of the fleas’ bodies. We’re
    going to omit the `species` variable from our dimension reduction, but use it
    later to see whether our SOM clusters fleas from the same species together.'
  merge: -1
  img_proc: true
