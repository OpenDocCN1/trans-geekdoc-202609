  md: '# ## 2.8 Summary


    +   - The tidyverse is a collection of R packages that simplifies the organization,
    manipulation and plotting of data

    +   - Tidy data is rectangular data where each row is a single observation, and
    each column is a variable. It’s often important to ensure data is in tidy format
    before passing it into machine learning functions

    +   - Tibbles are a modern take on data frames that have better rules for printing
    rectangular data, never change variable types, and always returns another tibble
    when subsetted using [

    +   - The dplyr package provides human-readable verb-like functions for data manipulation
    processes, the most important of which are `select()`, `filter()`, `group_by()`,
    `summarize()`, and `arrange()`

    +   - The most powerful aspect of dplyr is the ability to pipe functions together
    using the `%>%` operator, which passes the output of the function on its left,
    as the first argument of the function on its right

    +   - The ggplot2 package is a modern and popular plotting system for R that lets
    you create effective plots in a simple, layered way

    +   - The tidyr package provides the important function `gather()`, which lets
    you easily covert untidy data into tidy format (the opposite of this function
    is `spread()` which converts tidy data into wide format

    +   - The purrr package provides a simple, consistent way for us to apply iteratively
    apply functions over each element in a list'
