    # 3.2 Building our first k-NN model


    Imagine you work in a hospital and are trying to improve the diagnosis of patients
    with diabetes. You collect diagnostic data over a few months from suspected diabetes
    patients, and record whether they were diagnosed as healthy, chemically diabetic
    or overtly diabetic. You would like to use the k-NN algorithm to train a model
    that can predict which of these classes a new patient will belong to, so that
    diagnosis can be improved. This is a three-class classification problem.


    We’re going to start with a simple and naive way of building a k-NN model, then
    gradually improve it through the rest of the chapter. First things first, let’s
    install the mlr package and load it along with the tidyverse:


    ```

    install.packages("mlr", dependencies = TRUE)

    library(mlr)

    library(tidyverse)

    ```


    > WARNING Installing the mlr package could take several minutes. You only need
    to do this once.


    # 3.2.1 Loading and exploring the diabetes dataset


    Now, let’s load in some data built into the mclust package, convert it into a
    tibble and explore it a little (recall from Chapter 2 that a tibble is the tidyverse
    way of storing rectangular data). I do this in code listing 3.1.


    We have a tibble with 145 cases and four variables. The class factor shows that
    76 of the cases were non-diabetic (Normal), 36 were chemically diabetic (Chemical),
    and 33 were overtly diabetic (Overt). The other three variables are continuous
    measures of the level of blood glucose and insulin after a glucose tolerance test
    (glucose and insulin, respectively), and the steady-state level of blood glucose
    (sspg).'
