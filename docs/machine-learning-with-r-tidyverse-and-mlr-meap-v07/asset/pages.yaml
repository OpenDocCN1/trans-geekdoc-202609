- pgno: 157
  md: 'extension to the SVM algorithm called soft-margin SVM is much more commonly
    used. In soft-margin SVM, the algorithm still learns a hyperplane that best separates
    the classes, but allows cases to fall inside its margin.


    The soft-margin SVM algorithm still tries to find the hyperplane that best separates
    the classes, but is penalized for having cases inside its margin. How severe the
    penalty is for having a case inside the margin is controlled by a hyperparameter
    which controls how "hard" or "soft" the margin is (we’ll discuss this hyperparameter
    and how it affects the position of the hyperplane later in the chapter). The harder
    the margin is, the fewer cases will be inside it, and the hyperplane will depend
    on a smaller number of support vectors. The softer the margin is, the more cases
    will be inside it, and the hyperplane will depend on a larger number of support
    vectors. This has consequences for the bias-variance trade-off, where if our margin
    is too hard, we might overfit the noise near the decision boundary, whereas if
    our margin is too soft, we might underfit the data and learn a decision boundary
    that does a bad job of separating the classes.




    Great! So far the SVM algorithm seems quite simple, and for linearly separable
    classes like in our boss mood example, it is. But I mentioned that one of the
    strengths of the SVM algorithm is that it can learn decision boundaries between
    classes that are not linearly separable. As I’ve told you that the algorithm learns
    linear hyperplanes, this seems like a contradiction. Well here’s what makes the
    SVM algorithm so powerful: it can add an extra dimension to your data, to find
    a linear way to separate non-linear data.


    Take a look a look at the example in figure 6.5. The classes are not linearly
    separable using the two predictor variables. The SVM algorithm adds an extra dimension
    to the data, such that a linear hyperplane can separate the classes in this new,
    higher-dimensional space. We can visualize this as a sort of deformation or stretching
    of the feature space. The extra dimension is called a kernel.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# SIDEBAR


    # Why is it called a kernel?


    The word kernel may confuse you (it certainly confuses me). It has nothing to
    do with the kernels in computing (the bit of your operating system that directly
    interfaces with the computer hardware), or kernels in corn or fruit.


    The truth is that reason they are called kernels is a little murky. In 1904 a
    German mathematician called David Hilbert published *Grundzüge einer allgemeinen
    theorie der linearen integralgleichungen* (Principles of a general theory of linear
    integral equations). In this book, Hilbert uses the word *kern* to mean the *core*
    of an integral equation. In 1909, an American mathematician called Maxime Böcher
    published *An introduction to the study of integral equations* in which he translates
    Hilberts use of the word kern, to *kernel*.


    The mathematics of kernel functions evolved from the work in these publications,
    and took the name kernel with them. The extremely confusing thing is that multiple,
    seemingly unrelated concepts in mathematics have the word kernel in them!


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_158_0.png)


    **Figure 6.5** The SVM algorithm adds an extra dimension to linearly separate
    the data. The classes in the original data are not linearly separable. The SVM
    algorithm adds an extra dimension that, in a two-dimensional feature space, can
    be illustrated as a "stretching" of the data into a third dimension. This additional
    dimension allows the data to be linearly separated. When this hyperplane is projected
    back onto the original two dimensions, it appears as a curved decision boundary.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '> Recall from chapter 5 that discriminant analysis condenses the information
    from the predictor variables into a smaller number of variables. Contrast this
    to the SVM algorithm which expands the information from the predictor variables
    into an extra variable!


    +   linear kernel (equivalent to no kernel)

    +   polynomial kernel

    +   Gaussian radial basis kernel

    +   sigmoid kernel


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_159_0.png)


    Figure 6.6 Examples of kernel functions. For each example, the solid line indicates
    the decision boundary (projected back onto the original feature space) and the
    dashed lines indicate the margin. With the exception of the linear kernel, imagine
    the cases of one of the groups is raised off the page in a third dimension.


    Now the type of kernel function for a given problem isn''t learned from the data,
    we have to specify it. Because of this, the choice of kernel function is a categorical
    hyperparameter (a hyperparameter which takes discrete, not continuous values).
    Therefore, the best approach for choosing the best-performing kernel is with hyperparameter
    tuning.'
