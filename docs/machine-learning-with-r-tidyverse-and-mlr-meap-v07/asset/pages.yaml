  md: "best-performing features. In this example, we're going to tune the absolute\
    \ number of features to retain.\n\n> If you run getParamSet(filterWrapper) you'll\
    \ see the hyperparameter names for abs, perc, and threshold have become fw.abs,\
    \ fw.perc, and fw.threshold now that we've wrapped the filter method. There is\
    \ another useful hyperparameter fw.mandatory.feat that allows you to force certain\
    \ variables to be included regardless of their scores.\n\nFirst, I define the\
    \ hyperparameter space, as usual, with makeParamSet(), and define fw.abs as an\
    \ integer between 1 and 12 (the minimum and maximum number of features we're going\
    \ to retain). Next, we define our old friend, the grid search, using makeTuneControlGrid().\
    \ This will try every value of our hyperparameter. I define an ordinary 10-fold\
    \ cross-validation strategy using makeResampleDesc() and then perform the tuning\
    \ with tuneParams(). The first argument is our wrapped learner, and then we supply\
    \ our task, cross-validation method, hyperparameter space, and search procedure.\n\
    \n\n\n```\nlmParamSpace <- makeParamSet(\n  makeIntegerParam(\"fw.abs\", lower\
    \ = 1, upper = 12)\n)\n\ngridSearch <- makeTuneControlGrid()\nkFold <- makeResampleDesc(\"\
    CV\", iters = 10)\ntunedFeats <- tuneParams(filterWrapper, task = ozoneTask, resampling\
    \ = kFold,\n  par.set = lmParamSpace, control = gridSearch)\ntunedFeats\nTune\
    \ result:\nOp. pars: fw.abs=10\nmse.test.mean=20.8834\n```\n\nSo our tuning procedure\
    \ has picked the 10 predictors with the highest correlation with Ozone as the\
    \ best performing combination! But what's mse.test.mean? We haven't seen this\
    \ performance metric before. Well the performance metrics we used for classification,\
    \ such as mean misclassification error, don't make sense when we're predicting\
    \ continuous variables. For regression problems there are three commonly used\
    \ performance metrics:\n\n+   - mean absolute error (MAE)\n+   - mean square error\
    \ (MSE)\n+   - root mean square error (RMSE)\n\nThe MAE finds the absolute residual\
    \ between each case and the model, adds them all up, and divides by the number\
    \ of cases. We can interpret this as the mean absolute distance of the cases from\
    \ the model."
