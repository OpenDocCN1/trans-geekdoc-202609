    **Figure 15.5** At each stage of the algorithm, the node whose weights have the
    smallest distance to a particular case is selected as the best matching unit (BMU)
    for that case.


    # ### 15.1.3 Updating the weights of the nodes to better match the cases inside
    them


    In this section, I’ll show you how the weights of a case’s BMU and the weights
    of the surrounding nodes are updated to more closely match the data. First though,
    let’s summarize our knowledge of the SOM algorithm so far:


    +   1. we first create the map of nodes

    +   2. randomly assign weights to each node (one for each variable in the dataset)

    +   3. select a case at random, and calculate its distance to the weights of every
    node in the map

    +   4. put the case into the node whose weights have the smallest distance to
    the case (this is the case’s BMU)


    Now that the BMU has been selected, its weights are updated to be more similar
    to the case that we placed inside it. However, it’s not only the BMU’s weights
    that get updated. Nodes in the *neighborhood* of the BMU also have their weights
    updated (nodes that are nearby to the BMU). We can define the neighborhood in
    a few different ways, a common way is to use the *bubble function*. With the bubble
    function, we simply define a radius (or bubble) around the BMU, and all nodes
    inside that radius have their weights updated to the same degree. Any nodes outside
    the radius are not updated at all. For the bubble function, a radius of three
    would include any node within three direct connections of the BMU.


    Another popular choice is to update the node weights of the map, based on how
    far away they'
  merge: -1
  img_proc: true
- pgno: 370
  md: 'are from the BMU (the further away from the BMU, the less the node’s weights
    are updated). The most common way this is done is using the Gaussian function.
    You can picture this in your head as though we fit a Gaussian distribution centered
    over the BMU, and the node weights around the BMU are updated proportional to
    the density of the Gaussian over them. We still define a radius around the BMU
    that defines how broad or skinny the Gaussian is, but this time it’s a soft radius
    that has no hard cutoff. The Gaussian function is popular, but is a little more
    computationally expensive than the simple bubble function.


    > The bubble and Gaussian functions used to update the weights of the nodes in
    the neighborhood around the BMU are called neighborhood functions.


    Our choice of neighborhood function is a hyperparameter, as it will affect the
    way our map updates its nodes, but cannot be estimated from the data itself.


    > You will sometimes see the set of weights for a node referred to as its codebook
    vector.


    Whichever neighborhood function we use, the benefit of updating node weights in
    a neighborhood around the BMU, is that, over time, it creates neighborhoods of
    nodes which are similar to each other, but still capture some variation in the
    data. Another trick the algorithm uses is that, as time goes on, both the radius
    of this neighborhood, and the amount by which the weights are updated, get smaller.
    This means that the map is updated very rapidly initially, and then starts to
    make smaller and smaller updates as the learning process continues. This helps
    the map converge to a solution that, hopefully, places similar cases in the same
    or nearby nodes. This process of updating node weights in the neighborhood of
    the BMU is illustrated in figure 15.6.'
  merge: -1
  img_proc: true
- pgno: 371
  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_371_0.png)


    Now that we''ve determined the BMU for a particular case and updated its weights
    and the weights of its neighbors, we simply repeat the procedure for the next
    iteration, selecting another random case from the data. As this process continues,
    cases will likely be selected more than once, and move around the map as their
    BMU changes over time. To put it another way, cases will change nodes if the one
    they are currently in is no longer their BMU. Eventually similar cases will converge
    together to a particular region of the map.


    The result of this is that over time, the nodes on the map start to fit the dataset
    better, and eventually, cases that are similar to each other in the original feature
    space, will be placed either in the same node, or in nearby nodes on the map.


    > Remember that the feature space refers to all possible combinations of predictor
    variable values.


    +   1. we first create the map of nodes

    +   2. randomly assign weights to each node (one for each variable in the dataset)

    +   3. select a case at random, and calculate its distance to the weights of every
    node in the map

    +   4. put the case into the node whose weights have the smallest distance to
    the case (this is the case''s BMU)

    +   5. update the weights of the BMU, and the nodes in its neighborhood (depending
    on the neighborhood function) to more closely match the cases inside it

    +   6. repeat steps 3 to 5 for the specified number of iterations'
  merge: -1
