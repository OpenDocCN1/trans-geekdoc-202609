  md: "> **NOTE** If you have cases which are missing data for the actual split and\
    \ all the surrogate splits for a node, you should probably consider the impact\
    \ missing data is having on the quality of your dataset!\n\n# Listing 7.4 Printing\
    \ available rpart hyperparameters\n\n```\ngetParamSet(tree)\n\n              \
    \           Type len  Def  Constr Req Tunable Trafo\nminsplit            integer\
    \   -   20  1 to Inf   -   TRUE    -\nminbucket           integer   -    1  1\
    \ to Inf   -   TRUE    -\ncp                  numeric   - 0.01  0 to 1    -  \
    \ TRUE    -\nmaxcompete          integer   -    4  0 to Inf   -   TRUE    -\n\
    maxsurrogate        integer   -    5  0 to Inf   -   TRUE    -\nusesurrogate \
    \       discrete  -    2  0,1,2     -   TRUE    -\nsurrogatestyle      discrete\
    \  -    0  0,1       -   TRUE    -\nmaxdepth            integer   -   30  1 to\
    \ 30   -   TRUE    -\nxval                integer   -   10  0 to Inf  -   FALSE\
    \   -\nparms               untyped   -    -  -         -   TRUE    -\n```\n\n\
    Now, let’s define the hyperparameter space we want to search over. We’re going\
    \ to tune the values of minsplit (an integer), minbucket (an integer), cp (a numeric),\
    \ and maxdepth (an integer).\n\n> **NOTE** Remember that we use `makeIntegerParam()`\
    \ and `makeNumericParam()` to define the search spaces for integer and numeric\
    \ hyperparameters, respectively.\n\n# Listing 7.5 Defining the hyperparameter\
    \ space for tuning\n\n```\ntreeParamSpace <- makeParamSet(\n    makeIntegerParam(\"\
    minsplit\", lower = 5, upper = 20),\n    makeIntegerParam(\"minbucket\", lower\
    \ = 3, upper = 10),\n    makeNumericParam(\"cp\", lower = 0.01, upper = 0.1),\n\
    \    makeIntegerParam(\"maxdepth\", lower = 3, upper = 10))\n```\n\nNext, we can\
    \ define how we’re going to search the hyperparameter space we defined in code\
    \ listing 7.5. As the hyperparameter space is quite large, we’re going to use\
    \ a random search, rather than a grid search. Recall from chapter 6 that a random\
    \ search is not exhaustive (will not try every hyperparameter combination), but\
    \ will randomly select combinations as many times (iterations) as we tell it to.\
    \ We’re going to use 200 iterations.\n\nIn code listing 7.6 I also define our\
    \ cross-validation strategy for tuning. Here, I’m going to use ordinary 5-fold\
    \ cross-validation. Recall from chapter 3 that this will split the data into five\
    \ folds and use each fold as the test set once. For each test set, a model will\
    \ be trained on the rest of the data (the training set). This will be performed\
    \ for each combination of hyperparameter values tried by the random search."
