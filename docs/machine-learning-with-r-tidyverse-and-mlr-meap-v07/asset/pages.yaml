  md: "> > **NOTE** The rpart algorithm isn’t nearly as computationally expensive\
    \ as the support vector machine (SVM) algorithm we used for classification in\
    \ chapter 6. Therefore, despite tuning four hyperparameters, the tuning process\
    \ doesn’t take as long (which means we can perform more search iterations).\n\n\
    # ### 7.4.1 Training the model with the tuned hyperparameters\n\nNow we’ve tuned\
    \ our hyperparameters, we can train our final model using them. Just like in the\
    \ previous chapter, we use the `setHyperPars()` function to create a learner using\
    \ the tuned hyperparameters, which we access using `tunedTreePars$x`. We can then\
    \ train the final model using the `train()` function, as usual.\n\n# Listing 7.8\
    \ Training the final tuned model\n\n```\n```r\ntunedTree <- setHyperPars(tree,\
    \ par.vals = tunedTreePars$x)\n\ntunedTreeModel <- train(tunedTree, zooTask)\n\
    ```\n```\n\nNow one of the wonderful things about decision trees is just how interpretable\
    \ they are. The easiest way to interpret the model is to draw a graphical representation\
    \ of the tree. There are a few ways of plotting decision tree models in R, but\
    \ my favourite is the `rpart.plot()` function, from the package of the same name.\
    \ Let’s install the rpart.plot package first, and then extract the model data\
    \ using the `getLearnerModel()` function.\n\nThe first argument of the `rpart.plot()`\
    \ function is the model data. As we trained this model using mlr, the function\
    \ will give us a warning that it cannot find the data used to train the model.\
    \ We can safely ignore this warning, but if it irritates you as much as it irritates\
    \ me, you can prevent the warning by supplying the argument `roundint = FALSE`.\
    \ The function will also complain if we have more classes than its default color\
    \ palette (neediest function ever!). Either ignore this, or we can ask for a different\
    \ palette by setting the `box.palette` argument equal to one of the predefined\
    \ palettes (run `?rpart.plot` for a list of available palettes). The `type` argument\
    \ changes how the tree is displayed. I quite like the simplicity of option 5,\
    \ but check `?rpart.plot` to experiment with the other options.\n\n# Listing 7.9\
    \ Plotting the decision tree\n\n```\n```r\ninstall.packages(\"rpart.plot\")\n\n\
    library(rpart.plot)\n\ntreeModelData <- getLearnerModel(tunedTreeModel)\n\nrpart.plot(treeModelData,\
    \ roundint = FALSE,\n           box.palette = \"BuBn\",\n           type = 5)\n\
    ```\n```"
