- pgno: 506
  md: '# 20.1.4 Hyperparameter tuning to maximize model performance


    Many machine learning algorithms have hyperparameters that control how they learn.
    A hyperparameter is a variable, setting, or option that cannot be estimated directly
    from the data itself. The best way to select the optimal combination of hyperparameters
    for any given algorithm and dataset is to use hyperparameter tuning.


    Hyperparameter tuning is the process of iteratively trying models with different
    combinations of hyperparameters, and selecting the combination that gives the
    best performing model. The tuning process should accompany cross-validation, where
    for each combination of hyperparameters, a model is trained on the training set,
    and evaluated on the test set.


    If the range of hyperparameter values we need to search over is small, then it
    is often beneficial to employ a grid search method. In grid search, we simply
    try every combination of hyperparameter values that we define in our search space.
    Grid search is the only search method that is guaranteed to select the best-performing
    combination of hyperparameters in our search space.


    But when dealing with multiple hyperparameters, or when the search space becomes
    very large, grid search can become prohibitively slow. In such situations we can
    employ random search instead. Random search randomly samples combinations of hyperparameters
    from the search space, for as many iterations we can afford. Random search is
    not guaranteed to find the best-performing combination of hyperparameters, but
    can usually find a close approximation in a fraction of the time it would take
    grid search.


    Whichever search method we use, as a data-dependent preprocessing step, it is
    vital we include hyerparameter tuning inside our cross-validation strategy, in
    the form of nested cross-validation.


    # 20.1.5 Using missing value imputation to deal with missing data


    Missing value imputation is the practice of filling in missing data in a dataset
    with sensible values, such that we can still train a model using the full-dataset.
    The alternative would be to discard cases with any missing data.


    A naive way to impute missing values is to simply substitute missing values with
    the mean or median for a continuous variable (like we did in chapter 4), or the
    mode for a categorical variable. The problem with this is that this adds bias
    to any models you train, and throws away information about relationships in the
    data that may in fact have predictive value. A better'
