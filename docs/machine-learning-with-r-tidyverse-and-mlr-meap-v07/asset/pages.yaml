- pgno: 238
  md: 'The MSE is similar to MAE, except that it squares the residuals, before finding
    their mean. This means that MSE is more sensitive to outliers than MAE, as the
    size of the squared residual grows quadratically the further from the model prediction
    it is. MSE is the default performance metric for regression learners in mlr. The
    choice of MSE or MAE depends on how you want to treat outliers in your data: if
    you want your model to be able to predict such cases, use MSE, otherwise if you
    want your model to be less sensitive to outliers, use MAE.


    As MSE squares the residual, its value isn’t on the same scale as the outcome
    variable. Instead, if we square root the MSE, we get the RMSE. When tuning hyperparameters
    and comparing models, MSE and RMSE will always select the same models (as RMSE
    is simply a transformation of MSE), but RMSE has the benefit of being on the same
    scale as our outcome variable, and so is more interpretable.


    > There are other regression performance metrics available to us, such as the
    percentage versions of MAE and MSE. If you’re interested in reading about more
    of the performance metrics available to us in mlr (and there are a lot of them),
    run ?measures.


    +   Repeat the feature filtering process in code listings 9.8 and 9.9 but using
    the default fw.method argument (randomForestSRC_importance, or just don’t supply
    it). Does this select the same number of predictors as when we used linear correlation?
    Which method was faster?




    ```

    filteredTask <- filterFeatures(ozoneTask, fval = filterVals, abs = unlist(tunedFeats$x))


    filteredModel <- train(lin, filteredTask)

    ```'
