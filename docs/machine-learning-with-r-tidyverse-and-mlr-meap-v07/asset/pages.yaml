  md: 'Next, let''s plot the two t-SNE dimensions against each other to see how well
    they separated the genuine and counterfeit banknotes.


    As we can''t interpret the axes in terms of how much each variable correlates
    with them, it''s common for people to color their t-SNE plots by the values of
    each of their original variables, to help identify which clusters have higher
    and lower values. To do this, I first use the mutate_if() function to center the
    numeric variables in our original dataset (by setting .funs = scale, and .predicate
    = is.numeric). I include scale = FALSE to only center the variables, not divide
    by their standard deviations. The reason I center the variables is that I''m going
    to shade by their value on the plots, and I don''t want variables with larger
    values dominating the color scales (omit this line and see the difference in the
    final plot for yourself).


    Next, I mutate two new columns that contain the t-SNE axes values for each case.
    Finally, I gather the data so that I can facet by each of the original variables.
    I plot this data, mapping the value of each original variable to the color aesthetic,
    the status of each banknote (genuine vs counterfeit) to the shape aesthetic, and
    facet by the original variables. I add a custom color scale gradient to make the
    color scale more readable in print.




    ```

    swissTibTsne <- swissTib %>%

    mutate_if(.funs = scale, .predicate = is.numeric, scale = FALSE) %>%

    mutate(tSNE1 = swissTsne$Y[, 1], tSNE2 = swissTsne$Y[, 2]) %>%

    gather(key = "Variable", value = "Value", c(-tSNE1, -tSNE2, -Status))

    ggplot(swissTibTsne, aes(tSNE1, tSNE2, col = Value, shape = Status)) +

    facet_wrap(~ Variable) +

    geom_point(size = 3) +

    scale_color_gradient(low = "dark blue", high = "cyan") +

    theme_bw()

    ```


    The resulting plot from code listing 14.2 is shown in figure 14.7. Wow! Notice
    how much better a job t-SNE does of representing the differences between the two
    clusters in a two-dimensional space than PCA? The clusters are well resolved,
    although if you look closely you can see a couple of cases that seem to be in
    the wrong cluster. Shading the points by the value of each variable also helps
    us identify that counterfeit notes tend to have lower values of the Diagonal variable,
    and higher values of the Bottom and Top variables. It also seems like there might
    be a small, second cluster of counterfeit notes. This could be a set of notes
    made by a different counterfeiter, or it could be an artefact of an imperfect
    combination of hyperparameters. More investigation would be needed to tell if
    these are actually a distinct cluster or not.'
