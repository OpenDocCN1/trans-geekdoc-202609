- pgno: 15
  md: 'customers will default on their payments? Which patients will survive? Which
    objects in a telescope image are stars, planets or galaxies? When faced with problems
    like these, you should use a classification algorithm.


    +   - Regression algorithms take labeled data, and learn patterns in the data
    that can be used to predict a *continuous* output variable. How much carbon dioxide
    does a household contribute to the atmosphere? What will the share price of a
    company be tomorrow? What is the concentration of insulin in a patient’s blood?
    When faced with problems like these, you should use a regression algorithm.


    Unsupervised machine learning algorithms can also be split into two classes: dimension
    reduction and clustering algorithms.


    +   - Dimension reduction algorithms take unlabeled (because they are unsupervised
    learning methods), high-dimensional data (data with many variables) and learn
    a way of representing it in a lower number of dimensions. Dimension reduction
    techniques may be used as an exploratory technique (because it’s very difficult
    for humans to visually interpret data in more than two or three dimensions at
    once), or as a pre-processing step in our machine learning pipeline (it can help
    mitigate problems such as *collinearity* and the *curse of dimensionality*, terms
    we will define in later chapters). We can also use it to help us visually confirm
    the performance of classification and clustering algorithms (by allowing us to
    plot the data in two or three dimensions).


    +   - Clustering algorithms take unlabeled data, and learn patterns of clustering
    in the data. A cluster is a collection of observations which are more similar
    to each other, than to data points in other clusters. We assume that observations
    in the same cluster share some unifying features or identity that makes them identifiably
    different from other clusters. Clustering algorithms may be used as an exploratory
    technique to understand the structure of our data, and may indicate a grouping
    structure that can be fed into classification algorithms. Are there subtypes of
    patient responders in a clinical trial? How many classes of respondent were there
    in the survey? Are there different types of customer that use our company? When
    faced with problems like these, you should use a clustering algorithm.


    See figure 1.6 for a summary of the different types of algorithms by type and
    function.'
