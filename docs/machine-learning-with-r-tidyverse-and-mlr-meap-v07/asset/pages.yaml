- pgno: 194
  md: "# Listing 7.11 Cross-validating the model-building process\n\n```\n```r\nouter\
    \ <- makeResampleDesc(\"CV\", iters = 5)\n\ntreeWrapper <- makeTuneWrapper(\"\
    classif.rpart\", resampling = cvForTuning,\n                                par.set\
    \ = treeParamSpace,\n                                control = randSearch)\n\n\
    parallelStartSocket(cpus = detectCores())\n\ncvWithTuning <- resample(treeWrapper,\
    \ zooTask, resampling = outer)\n\nparallelStop()\n```\n```\n\nNow let’s take a\
    \ look at the cross-validation result and see how our model building process performed.\n\
    \n# Listing 7.12 Extracting the cross-validation result\n\n```\n```\ncvWithTuning\n\
    \nResample Result\nTask: zooTib\nLearner: classif.rpart.tuned\nAggr perf: mmce.test.mean=0.1200\n\
    Runtime: 112.96\n```\n```\n\nHmm, that’s a little disappointing, isn’t it? During\
    \ hyperparameter tuning, the best hyperparameter combination gave us a mean misclassification\
    \ error (mmce) of 0.0698 (you likely got a different value). But our cross-validated\
    \ estimate of model performance gives us an mmce of 0.12. Quite a large difference!\
    \ So what’s going on? Well, this is an example of overfitting. Our model is performing\
    \ better during hyperparameter tuning than during cross-validation. This is also\
    \ a good example of why it’s important to include hyperparameter tuning inside\
    \ our cross-validation procedure.\n\nWe’ve just discovered the main problem with\
    \ the rpart algorithm (and decision trees in general): they tend to produce models\
    \ that are over-fit. So how do we overcome this problem? The answer is to use\
    \ an *ensemble method*, an approach where we use multiple models to make predictions\
    \ for a single task. In the next chapter, I’ll show you how ensemble methods work,\
    \ and we’ll use them to vastly improve our decision tree model. I suggest you\
    \ save your .R file, as we’re going to continue using the same dataset and task\
    \ in the next chapter. This is so I can highlight to you how much better these\
    \ ensemble techniques are compared to ordinary decision trees.\n\n# 7.6 *Strengths\
    \ and weaknesses of tree-based algorithms*\n\nWhile it often isn’t easy to tell\
    \ which algorithms will perform well for a given task, here are some strengths\
    \ and weaknesses that will help you decide whether decision trees will perform\
    \ well for your task.\n\nThe strengths of the tree-based algorithm are:"
