  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_154_0.png)


    **Figure 6.3** The SVM algorithm finds a hyperplane (solid line) that passes through
    the feature space. An optimal hyperplane is one that maximizes the margin around
    itself (dotted lines). The margin is a region around the hyperplane that touches
    the fewest cases. Support vectors are shown with double circles.


    The support vectors are the most important cases in the training set because they
    define the boundary between the classes. Not only this, the hyperplane that the
    algorithm learns is entirely dependent on the position of the support vectors,
    and none of the other cases in the training set. Take a look at figure 6.4. If
    we move the position of one of the support vectors, then we move the position
    of the hyperplane. If, however, we were to move a non-support vector case, there
    is no influence on the hyperplane at all!


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_154_1.png)


    **Figure 6.4** The position of the hyperplanes are entirely dependent on the position
    of support vectors. Moving a support vector moves the hyperplane from its original
    position (dotted line) to a new position (top two plots). Moving a non-support
    vector has no impact on the hyperplane (bottom two plots).


