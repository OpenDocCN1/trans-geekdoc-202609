  md: "> **NOTE**\n> \n> Screenplots are so named because they resemble a scree slope,\
    \ the collection of rocks and rubble that accumulates at the foot of a cliff due\
    \ to weathering and erosion.\n\n# Listing 13.5 Plotting the PCA results\n\n```\n\
    install.packages(\"factoextra\")\n\nlibrary(factoextra)\n\npcaDat <- get_pca(pca)\n\
    \nfviz_pca_biplot(pca, label = \"var\")\n\nfviz_pca_var(pca)\n\nfviz_screeplot(pca,\
    \ addlabels = TRUE, choice = \"eigenvalue\")\n\nfviz_screeplot(pca, addlabels\
    \ = TRUE, choice = \"variance\")\n```\n\nI’ve condensed the four plots from code\
    \ listing 13.5 into a single figure (figure 13.8) to save space. When deciding\
    \ how many principal components to retain, there are a few rules of thumb. One\
    \ rule of thumb is to keep the principal components that cumulatively explain\
    \ at least 80% of the variance. Another is to retain all principal components\
    \ with eigenvalues at least one; the mean of all the eigenvalues is always one,\
    \ so this results in retaining principal components which contain more information\
    \ than the average. A third rule of thumb is to look for an \"elbow\" in the screeplot,\
    \ and exclude principal components beyond the elbow (although there is no obvious\
    \ elbow in our example). Instead of relying too much on these rules of thumb,\
    \ I look at my data projected onto the principal components, and consider how\
    \ much information I can tolerate losing for my application. If I’m applying PCA\
    \ to my data before applying a machine learning algorithm to it, I prefer to use\
    \ automated feature selection methods, like we did in previous chapters, to select\
    \ the combination of principal components that result in the best performance."
