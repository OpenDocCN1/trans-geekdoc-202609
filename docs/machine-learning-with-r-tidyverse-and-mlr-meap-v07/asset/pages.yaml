  md: "One final thing I want to teach you about ggplot, is the extremely powerful\
    \ *faceting* functionality. Sometimes we may wish to create sub plots of our data\
    \ where each subplot, or *facet*, displays data belonging to some group present\
    \ in the data.\n\n![](img/a22105d68c35e8d5bd3c7bafb4644881_40_0.png)\n\n**Figure\
    \ 2.4** The same data is shown, but with different iris species plotted on separate\
    \ sub plots or \"facets\".\n\nFigure 2.4 shows the same iris data, but this time\
    \ faceted by the Species variable. The code to create this plot is shown in listing\
    \ 2.18. I’ve simply added a `facet_wrap()` layer to the ggplot2 call, and specified\
    \ I want it to facet by (~) Species.\n\n# Listing 2.18 Grouping data with the\
    \ `group_by()` function\n\n```\n```r\nggplot(iris, aes(x = Sepal.Length, y = Sepal.Width))\
    \ +\n  facet_wrap(~ Species) +\n  geom_point()  +\n  theme_bw()\n```\n```\n\n\
    While there is much more you can do with ggplot2 than is presented here (including\
    \ customizing the appearance of virtually everything), I just want to give you\
    \ an understanding of how to create the basic plots needed to replicate those\
    \ that you’ll find throughout the book. If you want to take your data visualization\
    \ skills to the next level, I strongly recommend *ggplot2*, by Hadley Wickham\
    \ (Springer International Publishing, 2016).\n\n> **TIP**\n> \n> The order of\
    \ plot elements on a ggplot is important! Plot elements are literally layered\
    \ on sequentially, so elements added later in a ggplot call will be *on top* of\
    \ all the others. Reorder the `geom_density_2d()` and `geom_point()` functions\
    \ used to create figure 2.2 and look closely to see what happens (the plot might\
