  md: 'estimates of model performance than k-fold, when your dataset is small. When
    you have a small dataset, splitting it up into k folds will leave you with a very
    small training set. The variance of a model trained on a small dataset tends to
    be higher because it will be more influenced by sampling error/unusual cases.
    Therefore, leave-one-our cross-validation is useful for small datasets where splitting
    it into k-folds would give variable results. It is also computationally less expensive
    than repeated, k-fold cross-validation.


    # Leave-one-out CV


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_78_0.png)


    Figure 3.14 Leave-one-out cross-validation (CV). Leave-one-out CV is the extreme
    of k-fold, where we reserve a single case as the test set, and train the model
    on the remaining data. The similarity of the predictions to the true values of
    the test set is used to evaluate model performance.


    +   1. Use all of the data except a single case as the training set

    +   2. Predict the value of the single test case

    +   3. Repeat until every case has been the test case

    +   4. The predictions for each case are compared to the true values


    > A supervised learning model which has not been cross-validated is virtually
    useless, because you have no idea whether the predictions it will make on new
    data will be accurate or not!




    Creating a resampling description for leave-one-out is just as simple as for hold-out
    and k-fold cross-validation. We specify leave-one-out cross-validation when making
    the resample description by supplying "LOO" as the argument to method. Because
    the test set is only a single case, we obviously can’t stratify with leave-one-out.
    Also, because each case is used as the test set once, with all the other data
    being used as the training set there’s no need to repeat the procedure.




    ```

    LOO <- makeResampleDesc(method = "LOO")

    ```'
