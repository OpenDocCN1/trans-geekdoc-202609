  md: "# Listing 4.8 Imputing missing values in the Age variable\n\n```\n```r\nimp\
    \ <- impute(titanicClean, cols = list(Age = imputeMean()))\n\nsum(is.na(titanicClean$Age))\n\
    [1] 177\n\nsum(is.na(imp$data$Age))\n[1] 0\n```\n```\n\nWe can see that those\
    \ 177 missing values have all been imputed!\n\n# 4.2.6 Training the model (take\
    \ two)\n\nOk, we’ve imputed those pesky missing values with the mean and created\
    \ the new object `imp`. Now let’s try again by creating a task using the imputed\
    \ data. The `imp` object contains both the imputed data and a description for\
    \ the imputation process we used. To extract the data, we simply use `imp$data`.\n\
    \n# Listing 4.9 Training a model on imputed data\n\n```\n```r\ntitanicTask <-\
    \ makeClassifTask(data = imp$data, target = \"Survived\")\n\nlogRegModel <- train(logReg,\
    \ titanicTask)\n```\n```\n\nThis time, no error messages. Now let’s cross-validate\
    \ our model to estimate how it will perform.\n\n# 4.3 Cross-validating our logistic\
    \ regression model\n\nRemember that when we cross validate, we should cross-validate\
    \ our entire model-building procedure. This should include any data-dependent,\
    \ pre-processing steps, such as missing value imputation! In Chapter 3, we used\
    \ a wrapper function, to wrap together our learner and our hyperparameter tuning\
    \ procedure. This time, we’re going to create a wrapper for our learner and our\
    \ missing value imputation.\n\n# 4.3.1 Including missing value imputation in our\
    \ cross-validation\n\nThe `makeImputeWrapper()` function wraps together a learner\
    \ (which is given as the first argument) and an imputation method. Notice how\
    \ we specify the imputation method in exactly the same way as for the `impute()`\
    \ function in code listing 4.8, by supplying a list of columns and their imputation\
    \ method.\n\n# Listing 4.10 Wrapping together the learner and the imputation method\n\
    \n```\n```r\nlogRegWrapper <- makeImputeWrapper(\"classif.logreg\",\n        \
    \                           cols = list(Age = imputeMean()))\n```\n```\n\nNow,\
    \ let’s apply stratified, 10-fold cross-validation, repeated 50 times, to our\
    \ wrapped learner."
