  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_269_0.png)


    When using OLS, the residuals for a particular combination of intercept and slope
    are calculated for each case and squared. These squared residuals are then all
    added up to give the sum of squares. We can represent this in mathematical notation,
    as in equation 11.1.




    sum of squares = Σ_{i=1}^n (y_i - ŷ_i)^2


    where y_i is the value of the outcome variable for case i, and is it''s value
    predicted by the model. This is the vertical distance of each case from the line.
    The greek sigma ( Σ_{i=1}^n ) F09 01b ) simply means that we calculate this vertical
    distance and square it for every case from the first one (i = 1) to the last one
    (n ), and then add all these values up.


    Mathematical functions that are minimized by machine learning algorithms to select
    the best combinations of parameters are called loss functions. Therefore, least
    squares is the loss function for the OLS algorithm.


    Ridge regression modifies the least squares loss function slightly, to include
    a term that makes the function''s value larger, the larger the parameter estimates
    are. As a result, the algorithm now has to balance selecting the model parameters
    that minimize the sum of squares, and selecting parameters than minimize this
    new penalty. In ridge regression, this penalty is called the L2 norm , and it
    is very easy to calculate: we simply square all of the model parameters and add
    them up (all except the intercept). When we have only one continuous predictor,
    we have only one'
