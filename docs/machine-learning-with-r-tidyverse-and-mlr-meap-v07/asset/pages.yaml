    \ This plot is a useful way of graphically evaluating the stability of the clusters.\n\
    \n![](img/a22105d68c35e8d5bd3c7bafb4644881_442_0.png)\n\n**Figure 17.8** The graphical\
    \ output of the clusterboot() function. The first and last plots show the full,\
    \ original clusters of data, while the plots in between show the clusters on the\
    \ bootstrap samples. The cluster membership of each case is indicated by a number.\
    \ Notice the relatively high stability of the clusters."
