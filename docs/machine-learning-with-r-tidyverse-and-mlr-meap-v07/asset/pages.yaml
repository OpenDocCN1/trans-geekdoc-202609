- pgno: 334
  md: 'isn''t necessary, but if you have one variable measuring grams and another
    measuring kilometers, you should standardize them by setting scale = TRUE to put
    them on the same scale. The reason this is important is that if you have one variable
    measured on a much larger scale, this variable will dominate the eigenvectors,
    and the other variables will contribute much less information to the principal
    components. In this example we’ll set scale = TRUE, but one of the exercises for
    this chapter is to set scale = FALSE and compare the results.


    > In this example, we’re not interested in including the Status variable in our
    dimension reduction model, but even if we were, PCA cannot handle categorical
    variables. If you have categorical variables, your options are to encode them
    as numeric (which may or may not work), use a different dimension reduction approach
    (there are some that handle categorical variables that I won’t discuss here),
    or extract the principal components from the continuous variables, and then recombine
    these with the categorical variables in the final dataset.


    When we print the pca object, we get a printout of some information from our model.
    The Standard deviations component is a vector of the standard deviations of the
    data along each of the principal component. As the variance is the square of the
    standard deviation, to convert these standard deviations into the eigenvalues
    for the principal components, we can simply square them. Notice that the values
    get smaller from left to right? This is because the principal components explain
    sequentially less of the variance in the data.


    The Rotation component contains the six eigenvectors. Remember that these eigenvectors
    describe how far along each original variable we go, so that we’re one unit along
    the principal axis away from the origin. These eigenvectors describe the direction
    of the principal axes.


    If we pass our PCA results to the summary() function, we get a breakdown of the
    importance of each of the principal components. The Standard deviation row is
    the same as we saw a moment ago and contains the square root of the eigenvalues.
    The Proportion of Variance tells us how much of the total variance is accounted
    for by each principal component. This is calculated by dividing each eigenvalue
    by the sum of the eigenvalues. The Cumulative Proportion tells us how much variance
    is accounted for by the principal components so far. For example, we can see that
    PC1 and PC2 account for 49.1% and 21.3% of the total variance, respectively, and
    cumulatively they both account for 70.4%. This information is useful when we’re
    deciding how many principal components to retain for our downstream analysis.'
  merge: -1
  img_proc: true
