- pgno: 200
  md: '# NOTE


    Decision trees with only one split are, imaginatively, called decision stumps.
    You can see an example of a decision stump if you look back to figure 7.2.


    The function of boosting is to combine many weak learners together to form one
    strong ensemble learner. The reason we use weak learners is that there is no improvement
    in model performance when boosting with strong learners versus weak learners.
    So why waste computational resources training hundreds of strong, probably more
    complex learners when we can get the same performance training weak, less complex
    ones?


    There are two methods of boosting, which differ in the way they correct the mistakes
    of the previous set of models:


    +   - adaptive boosting

    +   - gradient boosting


    # WEIGHTING INCORRECTLY PREDICTED CASES: ADAPTIVE BOOSTING


    There is only one well-known adaptive boosting algorithm, which is the famous
    AdaBoost algorithm published in 1997. AdaBoost works like this. Initially, all
    cases in the training set have the same importance, or weight. An initial model
    is trained on a boostrap sample of the training set where the probability of a
    case being sampled is proportional to its weight (all equal at this point). The
    cases this initial model incorrectly classifies are given more weight/importance,
    while cases that it correctly classifies are given less weight/importance.


    The next model takes another bootstrap sample from the training set, but the weights
    are no longer equal. Remember that the probability of a case being sampled is
    proportional to its weight? So a case with twice as much weight as another case
    is twice as likely to be sampled (and more likely to be sampled repeatedly). This
    ensures that cases incorrectly classified by the previous model are more likely
    to be featured in the bootstrap for the subsequent model. The subsequent model
    is therefore more likely to learn rules that will correctly classify these cases.


    Once we have at least two models, the data are classified based on an aggregated
    vote, just like in bagging. Cases that are incorrectly classified by the majority
    vote are then given more weight, and cases that are correctly classified by the
    majority vote are given less weight. Perhaps slightly confusingly, the models
    themselves also have a weight. This model weight is based on how many mistakes
    a particular model makes (more mistakes, less weight). If you only have two models
    in an ensemble, one predicts group A and the other predicts group B, the model
    with the higher weight wins the vote.


    This process continues: a new model is added to the ensemble, all the models vote,
    weights are updated, and the next model samples the data based on the new weights.
    Once we reach the'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'maximum number of predefined trees, the process stops and we get our final
    ensemble model. This is illustrated in figure 8.2. Think about the impact this
    is having: new models are correcting the mistakes of the previous set of models.
    It’s for this reason that boosting is an excellent way of reducing bias. However,
    just like bagging, it also reduces variance because we’re also taking bootstrap
    samples! When unseen cases are passed to the final model for prediction, each
    tree votes individually (like in bagging), but each vote is weighted by the model
    weight.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_201_0.png)


    **Figure 8.2 Adaptive boosting with decision trees.** An initial model is trained
    on a random sample of the training set. Correctly classified cases get lower weights,
    while incorrectly classified cases get higher weights (indicated by data point
    size). The probability of subsequent models sampling each case is proportional
    to the case’s weight. As trees are added, they vote to form an ensemble model,
    the predictions of which are used to update the weights at every iteration.


    **SIDEBAR**   **How are the model weights and case weights calculated?**


    The model weight is calculated as:


    # **EQUATION 8.1**


    $$\text{model weight} = 0.5 \times \ln\left(\frac{1-p(\text{incorrect})}{p(\text{incorrect})}\right)$$'
  merge: -1
  img_proc: true
- pgno: 202
  md: "> **SIDEBAR**\n> \n> where *ln* is the natural logarithm and *p* (incorrect)\
    \ is the proportion of incorrectly classified cases.\n> \n> The case weights are\
    \ calculated as:\n\n# EQUATION 8.2\n\n$$\\text{case weight} = \\begin{cases}\\\
    text{initial weight} \\times e^{-\\text{model weight}}, & \\text{if correctly\
    \ classified} \\\\ \\text{initial weight} \\times e^{\\text{model weight}}, &\
    \ \\text{if incorrectly classified}\\end{cases}$$\n\n> **SIDEBAR**\n> \n> This\
    \ notation simply means for cases correctly classified, we use the formula on\
    \ the top, and for cases incorrectly classified we use the formula on the bottom.\
    \ Notice the only subtle difference is that the model weight is negative for cases\
    \ that were correctly classified. Plug some numbers into these formulas. You’ll\
    \ find the formula for correctly classified cases decreases their weight, while\
    \ the formula for incorrectly classified cases increases it.\n\n# LEARNING FROM\
    \ THE PREVIOUS MODELS' RESIDUALS: GRADIENT BOOSTING\n\nGradient boosting is very\
    \ similar to adaptive boosting, only differing in the way it corrects the mistakes\
    \ of the previous models. Rather than weighting the cases differently depending\
    \ on the accuracy of their classification, subsequent models try to predict the\
    \ *residuals* of the previous ensemble of models.\n\nA residual, or residual error,\
    \ is the difference between the true value (\"observed\" value) and the value\
    \ predicted by a model. This is easier to understand when thinking about predicting\
    \ a continuous variable (regression). Imagine you’re trying to predict how much\
    \ debt a person has. If an individual has a real debt of £2500, but our model\
    \ predicts they have a debt of £2100, the residual is £400. It’s called a residual\
    \ because it’s the error left over after the model has made its prediction.\n\n\
    It’s a bit harder to think of a residual for a classification model, but we can\
    \ quantify the residual error of a classification model as:\n\n+   - proportion\
    \ of all cases incorrectly classified\n+   - the *log loss*\n\nThe proportion\
    \ of cases that were misclassified is pretty self-explanatory. The log loss is\
    \ similar, but more greatly penalizes a model that makes incorrect classifications\
    \ *confidently*. If your friend tells you with \"absolute certainty\" that Helsinki\
    \ is the capital of Sweden (it’s not), you’d think"
  merge: -1
  img_proc: true
- pgno: 203
  md: "less of them than if they said they \"think it might be\" the capital. This\
    \ is how log loss treats misclassification error. For either method, models that\
    \ give the correct classifications will have a lower error than those that make\
    \ lots of misclassifications. Which method is better? Once again it depends, so\
    \ we’ll let hyperparameter tuning choose the best one.\n\n> **NOTE**  Using the\
    \ proportion of misclassified cases as the residual error tends to result in models\
    \ that are a little more tolerant of a small number of misclassified cases, than\
    \ using the log loss.\n\n> **NOTE**  These measures of residual error that are\
    \ minimized at each iteration are called *loss functions*.\n\nSo in gradient boosting,\
    \ subsequent models are chosen that minimize the residual error of the previous\
    \ ensemble of models. By minimizing the residual error, subsequent models will,\
    \ in effect, favor the correct classification of cases which were previously misclassified\
    \ (thereby modeling the residuals).\n\n> **SIDEBAR**  \n> \n> **How to calculate\
    \ log loss**\n> \n> It isn’t necessary for you to know the formula for log loss,\
    \ but for math buffs who are interested, it is calculated as:\n> \n> $$\\operatorname{log\\\
    \ loss}=-\\frac{1}{N}\\sum_{i=1}^{N}\\sum_{k=1}^{K}y_{ik}\\ln(p_{ik})$$\n> \n\
    > where *N* is the number of cases, *K* is the number of classes, ln is the natural\
    \ logarithm, *y*<sub>ik</sub> is an indicator as to whether label *k* is the correct\
    \ classification for case *i*, and *p*<sub>ik</sub> is the proportion of cases\
    \ belonging to the same class as case *i* that were correctly classified. We can\
    \ read this as:\n> \n> 1. for every case in the training set\n>    - **A.** take\
    \ the proportion of cases belonging to the same class as that case that were correctly\
    \ classified\n>    - **B.** take the natural logarithm of these proportions\n\
    > 2. sum these logs\n> 3. multiply by *1/N*\n\nGradient boosting doesn’t necessarily\
    \ train sub-models on samples of the training set. If we choose to sample the\
    \ training set, the process is called *stochastic gradient boosting* (stochastic\
    \ just means \"random\", but is a good word to impress your friends with). Sampling\
    \ in stochastic gradient descent is usually *without replacement*, which means\
    \ that it isn’t a bootstrap sample. We"
