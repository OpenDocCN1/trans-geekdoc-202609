  md: "# ## 19.4 Summary\n\n+   - Gaussian mixture model clustering fits a set of\
    \ Gaussian distributions to the data, and estimates the probability of the data\
    \ coming from each Gaussian\n+   - The expectation-maximization (EM) algorithm\
    \ is used to iteratively update the model until the likelihood of the data converges\n\
    +   - Gaussian mixture modeling is a soft-clustering method that gives us a probability\
    \ for each case belonging to each cluster\n+   - In one dimension, the EM algorithm\
    \ needs only to update the mean, variance, and prior probability of each Gaussian\n\
    +   - In more than one dimension, the EM algorithm needs to update the centroid,\
    \ covariance matrix and prior probability of each Gaussian\n+   - Constraints\
    \ can be placed on the covariance matrix to control the volume, shape, and orientation\
    \ of the Gaussians\n\n# ## 19.5 Solutions to exercises\n\n+   1. Train a VVE mixture\
    \ model with two clusters\n\n```\n```r\nswissMclust2 <- Mclust(swissTib, G = 2,\
    \ modelNames = \"VVE\")\n\nplot(swissMclust2)\n```\n```\n\n+   2. Compare the\
    \ cluster stability of a two and three-cluster mixture model\n\n```\n```r\nmclustBoot2\
    \ <- clusterboot(swissTib, B = 10,\n                           clustermethod =\
    \ noisemclustCBI,\n                           G = 2, modelNames = \"VVE\",\n \
    \                          showplots = FALSE)\n\nmclustBoot3 <- clusterboot(swissTib,\
    \ B = 10,\n                           clustermethod = noisemclustCBI,\n      \
    \                     G = 3, modelNames = \"VVE\",\n                         \
    \  showplots = FALSE)\n\nmclustBoot2\n\nmclustBoot3\n\n# it can be challenging\
    \ to compare the jaccard indices between models with\n# different numbers of clusters.\
    \ The model with three clusters may better\n# represent nature, but as one of\
    \ the clusters is small, the membership is\n# more variable between bootstrap\
    \ samples\n```\n```"
