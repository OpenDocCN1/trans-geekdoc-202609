    # Listing 17.9 Using `clusterboot()` to calculate Jaccard’s distance\n\n```\n\
    ```r\nlibrary(fpc)\n\npar(mfrow = c(3, 4))\n\nclustBoot <- clusterboot(gvhdDist,\
    \ B = 10,\n                         clustermethod = distclustCBI,\n          \
    \               k = 4, cut = \"number\", method = \"ward.D2\",\n             \
    \            showplots = TRUE)\n\nclustBoot\n\nNumber of resampling runs: 10\n\
    \nNumber of clusters found in data:  4\n\n Clusterwise Jaccard bootstrap (omitting\
    \ multiple points) mean:\n[1] 0.9728 0.9208 0.8348 0.9624\n```\n```\n\nThe resulting\
    \ plot from code listing 17.9 is shown in figure 17.8. The first (top left) and\
    \ last (bottom right) plots show the clustering on the original, full dataset.\
