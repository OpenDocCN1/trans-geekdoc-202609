- pgno: 180
  md: '# **SIDEBAR** Generalizing Gini index to any number of classes


    In this example we’ve only considered two classes, but the Gini index of a node
    is easily calculable for problems which have many classes. In that situation the
    equation for Gini index generalizes to:


    $$\mathrm{Gini\ index}=1-\sum_{k=1}^{K}p(\mathrm{class}_k)^2$$


    Which is just a fancy way of saying that we calculate $p(\mathrm{class}_k)^2$
    for each class from 1 to K (the number of classes), add them all up, and subtract
    this value from 1.


    If you’re interested, the equation for entropy is:


    $$\mathrm{entropy}=\sum_{k=1}^{K}-p(\mathrm{class}_k)\times\log_2 p(\mathrm{class}_k)$$


    Which is just a fancy way of saying that we calculate $p(\mathrm{class})\times\log_2
    p(\mathrm{class})$ for each class from 1 to K (the number of classes) and add
    them all up (which becomes a subtraction because the first term is negative).
    As for Gini gain, the information gain is calculated as the entropy of the parent,
    minus the entropy of the split (which is calculated in exactly the same way as
    the Gini index for the split).


    # 7.1.2 What about continuous, and multi-level categorical predictors?


    In this section I’ll show you how the splits are chosen for continuous and categorical
    predictor variables.


    When a predictor variable is dichotomous (has only two levels), it’s quite obvious
    how to use it for a split: cases with one value go left, and cases with the other
    value go right. Decision trees can also split the cases using continuous variables,
    but what value is chosen as the split point? Have a look at the example in figure
    7.4. We have cases from three classes, plotted against two continuous variables.
    The feature space is split into rectangles by each node. At the first node, the
    cases are split into those with a value of variable 2 above and below 20. The
    cases which make it to the second node are further split into those with a value
    of variable 1 above and below 10,000.'
