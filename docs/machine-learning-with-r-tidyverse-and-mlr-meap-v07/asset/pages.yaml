- pgno: 76
  md: "# PERFORMING K-FOLD CROSS-VALIDATION\n\nWe perform k-fold cross-validation\
    \ in the same way as we did for hold-out (see code listing 3.6). This time, when\
    \ we make our resampling description, we tell it we’re going to use repeated k-fold\
    \ cross validation (\"RepCV\"), and tell it how many folds we want to split the\
    \ data into. The default number of folds is 10, which is often a good choice,\
    \ but I wanted to show you how you can explicitly control the splits. Next, we\
    \ tell the function that we want to repeat the 10-fold cross-validation 50 times\
    \ with the reps argument. This gives us 500 performance measures to average across!\
    \ Again, we ask for the classes to be stratified among the folds.\n\n# Listing\
    \ 3.6 Creating a k-fold cross validation resampling description\n\n```\n```r\n\
    kFold <- makeResampleDesc(method = \"RepCV\", folds = 10, reps = 50,\n       \
    \                    stratify = TRUE)\n\nkFoldCV <- resample(learner = knn, task\
    \ = diabetesTask,\n                    resampling = kFold, measures = list(mmce,\
    \ acc))\n```\n```\n\nNow let’s extract the averaged performance measures.\n\n\
    ```\n```\nkFoldCV$aggr\n\nmmce.test.mean   acc.test.mean\n     0.1022788     \
    \ 0.8977212\n```\n```\n\nSo the model correctly classified 89.8% of cases on average,\
    \ much lower than when we predicted the data we used to train the model! Re-run\
    \ the `resample()` function here a few times and compare the average accuracy\
    \ after each run. The estimate is much more stable than when we repeat hold-out\
    \ cross-validation.\n\n> **TIP**  \n> We’re usually only interested in the average\
    \ performance measures, but you can access the performance measure from every\
    \ iteration by running:\n> \n> ```r\n> kFoldCV$measures.test\n> ```\n\n# HOW TO\
    \ CHOOSE THE NUMBER OF REPEATS\n\nYour goal when cross-validating your model is\
    \ to get as accurate and stable an estimate of model performance as possible.\
    \ Broadly speaking, the more repeats you can do, the more accurate and stable\
    \ these estimates will become. At some point though, having more repeats won’t\
    \ improve the accuracy or stability of the performance estimate.\n\nSo how do\
    \ we decide on how many repeats to perform? A sound approach is to choose a number\
    \ of repeats that is computationally reasonable, run the process a few times and\
    \ see if the average performance estimate varies a lot. If not, great. If it does\
    \ vary a lot, you should increase the number of repeats."
  merge: -1
  img_proc: true
