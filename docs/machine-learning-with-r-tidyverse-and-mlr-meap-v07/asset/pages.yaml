    \ to the function. The `iwalk()` function is shorthand for `walk2(.x, .y = names(.x),\
    \ .f)`, allowing us to access the name of each element by using `.y` inside our\
    \ function.\n\n# Listing 15.5 Plotting heatmaps for each variable\n\n```\n```r\n\
