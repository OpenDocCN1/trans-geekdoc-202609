  md: "# Listing 9.2 Cleaning the data\n\n```\n```r\nozoneClean <- mutate_all(ozoneTib,\
    \ as.numeric) %>%\n  filter(is.na(Ozone) == FALSE)\n\nozoneClean\n\n# A tibble:\
    \ 361 x 13\n  Month  Date   Day Ozone Press_height  Wind Humid Temp_Sand Temp_Monte\n\
    \  <dbl> <dbl> <dbl> <dbl>        <dbl> <dbl> <dbl>     <dbl>      <dbl>\n1  \
    \   1     1     4     3         5480     8    20        NA         NA\n2     1\
    \     2     5     3         5660     6    NA        38         NA\n3     1   \
    \  3     6     3         5710     4    28        40         NA\n4     1     4\
    \     7     5         5700     3    37        45         NA\n5     1     1   \
    \  1     5         5760     3    51        54       45.3\n# ... with 356 more\
    \ rows, and 4 more variables: Inv_height <dbl>,\n#   Press_grad <dbl>, Inv_temp\
    \ <dbl>, Visib <dbl>\n```\n```\n\nLet’s plot each of our predictor variables against\
    \ Ozone to get an idea of the relationships in the data. I start with our usual\
    \ trick of gathering the variables with the `gather()` function so we can plot\
    \ them on separate facets.\n\n> **NOTE** Remember we have to use `-Ozone` to prevent\
    \ the Ozone variable from being gathered with the others.\n\nIn our `ggplot()`\
    \ call, we facet by Variable, and allow the x axes of the facets to vary by setting\
    \ the `scale` argument equal to \"free_x\". Then along with a geom_point layer,\
    \ I add two geom_smooth layers. The first geom_smooth is given no arguments and\
    \ so uses the default settings. By default, geom_smooth will draw a LOESS curve\
    \ to the data (a curvy, local regression line) if there are fewer than 1000 cases,\
    \ or a GAM curve if there are 1000 or more cases. Either will give us an idea\
    \ of the shape of the relationships. The second geom_smooth layer specifically\
