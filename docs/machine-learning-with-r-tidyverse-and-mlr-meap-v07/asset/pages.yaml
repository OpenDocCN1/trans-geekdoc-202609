  md: "Dunn index, and the pseudo F statistic. As the function we’ll use to calculate\
    \ the Dunn index expects a distance matrix, we’ll include an additional argument\
    \ in our function to supply a pre-computed distance matrix to.\n\nTake a look\
    \ at the function body in code listing 17.2 and follow it through with me so what\
    \ we’re doing makes sense. I use the `function()` argument to define a function,\
    \ assigning it to the name `cluster_metrics` (this will allow us to call the function\
    \ using `cluster_metrics()`). I define three mandatory arguments for the function:\n\
    \n+   - `data`, to which we will pass the data we’re clustering\n+   - `clusters`,\
    \ a vector containing the cluster membership of every case in `data`\n+   - `dist_matrix`,\
    \ to which we will pass the pre-computed distance matrix for `data`\n\nThe *body*\
    \ of the function (the instructions that tell the function what to do) is defined\
    \ inside curly brackets (`{}`). Our function will return a list with four elements,\
    \ the Davies-Bouldin index (`db`), the pseudo F statistic (`G1`), the Dunn index\
    \ (`dunn`), and the number of clusters. Rather than define them from scratch,\
    \ I’m using pre-defined functions from other packages to compute the internal\
    \ cluster metrics. The Davies-Bouldin index is computed using the `index.DB()`\
    \ function from the clusterSim package, which takes the `data` and `clusters`\
    \ arguments (the statistic itself is contained in the `$DB` component). The pseudo\
    \ F statistic is computed using the `index.G1()` function, also from the clusterSim\
    \ package, and takes the same arguments as `index.DB()`. The Dunn index is computed\
    \ using the `dunn()` function from the clValid package, which takes the `dist_matrix`\
    \ and `clusters` functions.\n\nOur motivation for defining this function, is that\
    \ we’re going to take bootstrap samples from our dataset, learn the hierarchy\
    \ in each, select a range of cluster numbers from each, and use our function to\
    \ calculate these three metrics for each number of clusters, within each bootstrap\
    \ sample.\n\n# Listing 17.2 Defining the cluster_metrics function\n\n```\n```r\n\
    cluster_metrics <- function(data, clusters, dist_matrix) {\n    list(db      \
    \ = clusterSim::index.DB(data, clusters)$DB,\n         G1       = clusterSim::index.G1(data,\
    \ clusters),\n         dunn     = clValid::dunn(dist_matrix, clusters),\n    \
    \     clusters = length(unique(clusters))\n    )\n}\n```\n```\n\nSo now, let’s\
    \ create our bootstrap samples. We’re going to create ten bootstrap samples from\
    \ our gvhdScaled dataset. I’m using the `map()` function to repeat the sampling\
    \ process ten times, to return a list where each element is a different bootstrap\
    \ sample.\n\n> **NOTE** Remember that `~` is just shorthand for `function()`."
