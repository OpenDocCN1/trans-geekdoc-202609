    # ## 17.5 Summary


    +   - Hierarchical clustering uses the distances between cases to learn a hierarchy
    of clusters

    +   - How these distances are calculated is controlled by our choice of linkage
    method

    +   - Hierarchical clustering can be bottom-up (agglomerative) or top-down (divisive)

    +   - A flat set of clusters can be returned from a hierarchical clustering model
    by "cutting" the dendrogram at a particular height

    +   - Cluster stability can be measured by clustering on bootstrap samples, and
    using Jaccard’s index to quantify the agreement of cluster membership between
    samples'
