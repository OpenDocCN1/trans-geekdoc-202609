  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_8_0.png)




    In practice, we call a set of rules a machine learning algorithm learns a model.
    Once the model has been learned, we can give it new observations and it will output
    its predictions for the new data. We refer to these as models because they represent
    real-world phenomena in a simplistic-enough way that we and the computer can interpret
    and understand. Just as a model of the Eiffel Tower may be a good representation
    of the real thing but isn’t exactly the same, so statistical models are attempted
    representations of real-world phenomena but won’t match them perfectly.


    > NOTE You may have heard the famous phrase coined by the statistician George
    Box that "all models are wrong, but some are useful", which refers to the approximate
    nature of models.


    The process by which the model is learned is referred to as the algorithm. As
    we discovered earlier, an algorithm is just a sequence of operations that work
    together to solve a problem. So how does this work in practice? Let’s take a simple
    example. Say we have two continuous variables, and we would like to train an algorithm
    that can predict one (the outcome or dependent variable), given the other (the
    predictor or independent variable). The relationship between these'
