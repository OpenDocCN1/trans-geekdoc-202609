    > \n> Can you see that, in general, the more predictors a model has, the larger\
    \ it’s L2 norm will be because we are adding their squares together? Ridge regularization\
    \ therefore penalizes models that are too complex (because they have too many\
    \ predictors).\n\nSo that we can control how much we want to penalize model complexity,\
    \ we multiply the L2 norm by a value called *lambda* (λ, because Greek letters\
    \ always sound cool). Lambda can be any value from zero to infinity and acts as\
    \ a volume knob: large values of lambda strongly penalize model complexity, while\
    \ small values of lambda weakly penalize model complexity. Lambda cannot be estimated\
    \ from the data, and so is a hyperparameter than we need to tune to achieve the\
    \ best performance by cross-validation.\n\nOnce we calculate the L2 norm and multiply\
    \ it by lambda, we then add this product to the sum of squares to get our penalized\
    \ least squares loss function.\n\n> **NOTE**\n> \n> If we set lambda to 0, this\
    \ removes the L2 norm penalty from the equation and we get back to the OLS loss\
    \ function. If we set lambda to a very large values, all the slopes will be shrunk\
    \ close to zero.\n\n![](img/a22105d68c35e8d5bd3c7bafb4644881_270_0.png)\n\n**Figure\
    \ 11.5** Calculating the sum of squares and the L2 norm for the slope between\
    \ temperature and the number of people at the park.\n\nIf you’re mathematically\
    \ minded, then we can represent this in mathematical notation as in equation 11.2.\
    \ Can you see that this is the same as the sum of squares as in equation 11.1,\
    \ but we’ve added the lambda and L2 norm terms?"
