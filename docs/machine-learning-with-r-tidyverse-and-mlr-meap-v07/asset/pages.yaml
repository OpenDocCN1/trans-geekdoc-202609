- pgno: 102
  md: 'In multinomial logistic regression, instead of estimating a single logit for
    each case, the model estimates a logit for each case for each of the output classes.
    These logits are then passed into an equation called the softmax function which
    turns these logits into probabilities for each class that sum to 1 (see figure
    4.9). Then, whichever class has the largest probability is selected as the output
    class.


    # TIP


    You will sometimes see "softmax regression" and "multinomial logistic regression"
    used interchangeably.


    Figure 4.9 Summary of the softmax function. In the binomial case, only one logit
    is needed per case (the logit for the positive class). Where there are multiple
    classes (a, b, and c in this example), the model estimates one logit per class,
    for each case. The softmax function maps these logits to probabilities which sum
    to one. The case is assigned to the class with the largest probability.


    The classif.logreg learner wrapped by mlr will only handle binomial logistic regression.
    There isn’t currently an implementation of ordinary multinomial logistic regression
    wrapped by mlr. We can, however, use the classif.LiblineaRL1LogReg learner to
    perform multinomial logistic regression (although it has some differences I won’t
    discuss).'
