- pgno: 91
  md: '# Classifying based on odds: logistic regression


    +   - What the logistic regression a’lgorithm is and how it works

    +   - What is feature engineering?

    +   - Whatagain is missing value imputation?

    +   - Building a logistic regression classifier to predict survival of the Titanic


    In this chapter, I’m going add a new classification algorithm to your toolbox:
    logistic regression. Just like the k-nearest neighbors algorithm you learned about
    in the previous chapter, logistic regression is a supervised learning method that
    predicts class membership. Logistic regression relies on the equation of a straight
    line and produces models which are very easy to interpret and communicate.


    Logistic regression can handle continuous (without discrete categories) and categorical
    (with discrete categories) predictor variables. In its most simple form, logistic
    regression is used to predict a binary outcome (cases can belong to one of two
    classes), but variants of the algorithm can handle multiple classes as well. Its
    name comes from the algorithm’s use of the logistic function, an equation that
    calculates the probability that a case belongs to one of the classes.


    While logistic regression is most certainly a classification algorithm, it uses
    linear regression and the equation for a straight line to combine the information
    from multiple predictors. In this chapter you’ll learn how the logistic function
    works and how the equation for a straight line is used to build a model.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '> **NOTE** If you’re already familiar with linear regression, a key distinction
    between linear and logistic regression is that the former learns the relationship
    between predictor variables and a *continuous* outcome variable, whereas the latter
    learns the relationship between predictor variables and a *categorical* outcome
    variable.


    By the end of this chapter, you will have applied the skills you learned in chapters
    2 and 3 to prepare your data, and build, interpret, and evaluate the performance
    of a logistic regression model. You will also have learned what *missing value
    imputation* is, a method for filling in missing data with sensible values when
    working with algorithms that cannot handle them. You will apply a basic form of
    missing value imputation as a strategy to deal with missing data.


    # ## 4.1 What is logistic regression?


    Imagine you’re the curator of 15th century art at a museum. When works of art,
    allegedly by famous painters, come to the museum, it’s your job to determine whether
    they are genuine or fake (a two-class classification problem). You have access
    to the chemical analysis performed on each painting, and are aware that many forgeries
    of this period used paints with lower copper content than the original paintings.
    You can use logistic regression to learn a model that tells you the probability
    of a painting being an original, based on the copper content of its paint. The
    model would then assign this painting to the class with the highest probability
    (see figure 4.1).


    > **NOTE** The algorithm is commonly applied to two-class classification problems
    (this is referred to as *binomial logistic regression*), but a variant called
    *multinomial logistic regression* handles classification problems where you have
    three or more classes (this is referred to as *multinomial logistic regression*).


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_92_0.png)


    **Figure 4.1** Logistic regression learns models which output the probability
    (p) of new data belonging to each of the classes. Typically, new data are assigned
    the class to which they have the highest probability of belonging. The dotted
    arrow indicates that there are additional steps in calculating the probabilities,
    which we’ll discuss in section .


    Logistic regression is a very popular classification algorithm, especially in
    the medical community, partly because of how interpretable the model is. For every
    predictor variable in our model, we get an estimate of just how the value of that
    variable impacts the probability that a'
  merge: -1
  img_proc: true
