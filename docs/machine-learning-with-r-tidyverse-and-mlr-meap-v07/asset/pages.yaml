- pgno: 349
  md: '+   1. **perplexity**, which controls the width of the distributions used to
    convert distances into probabilities. High values place more focus on global structure,
    whereas small values place more focus on local structure. Typical values lie in
    the range 5 to 50. The default value is 30

    +   2. **theta**, which controls the trade-off between speed and accuracy. As
    t-SNE is slow, people commonly use an implementation called Barnes-Hut t-SNE,
    which allows us to perform the embedding much faster, but with some loss of accuracy.
    The theta hyperparameter controls this trade-off with 0 being "exact" t-SNE, and
    1 being the fastest, but least accurate t-SNE. The default value is 0.5

    +   3. **eta**, which is how far each data point moves at each iteration (also
    called the learning rate). Lower values need more iterations to reach convergence,
    but may result in a more accurate embedding. The default value is 200 and this
    is usually fine

    +   4. **max_iter**, which is the maximum iterations allowed before computation
    stops. This will depend on your computational budget, but it’s important to have
    enough iterations to reach convergence. The default value is 1000


    > **TIP**  The most important hyperparameters to tune are usually perplexity and
    max_iter.


    Now our approach to tuning hyperparameters thus far is that we allow an automated
    tuning process to choose the best combination for us, either through a grid search
    or random search. But due to it’s computational cost, most people will run t-SNE
    with its default hyperparameter values, and change them if the embedding doesn’t
    look sensible. If this sounds very subjective, that’s because it is, but people
    are usually able to identify visually whether t-SNE is pulling apart clusters
    of observations nicely or not.


    To give you a visual aid of how each of these hyperparameters affects the final
    embedding, I’ve run t-SNE on our Swiss banknote data, using a grid of hyperparameter
    values. Figure 14.5 shows the final embeddings with different combinations of
    theta (rows) and perplexity (columns) using the default values of eta and max_iter.
    Notice that the clusters become tighter with larger values of perplexity, and
    are lost with very low values. Also notice that for reasonable values of perplexity,
    the clusters are best resolved when theta is set to zero (exact t-SNE).'
  merge: -1
  img_proc: true
- pgno: 350
  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_350_0.png)


    Figure 14.5 The effect of changing theta (row facets) and perplexity (column facets)
    using the default values of eta and max_iter, on the final t-SNE embedding of
    the swissTib dataset.


    Figure 14.6 shows the final embeddings with different combinations of max_iter
    (rows) and eta (columns). The effect here is a little more subtle, but smaller
    values of eta need a larger number of iterations in order to converge (because
    the cases move in smaller steps at each iteration). For example, for an eta of
    100, 1000 iterations is sufficient to separate the clusters, but with an eta of
