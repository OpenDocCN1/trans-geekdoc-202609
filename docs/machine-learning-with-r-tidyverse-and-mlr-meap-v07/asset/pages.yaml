  md: '+   - (classification, regression, dimension reduction, and clustering)

    +   - How to validate model performance and prevent overfitting

    +   - How to compare multiple models to decide on the best


    Throughout the book we’ll use fun and interesting examples to learn concepts,
    and to apply our knowledge to. When possible, we will also apply multiple algorithms
