    # 15.6 Strengths and weaknesses of SOMs and LLE


    While it often isn’t easy to tell which algorithms will perform well for a given
    task, here are some strengths and weaknesses that will help you decide whether
    the SOM or LLE will perform well for your task.


    The strengths of SOMs and LLE are:


    +   - They are both non-linear dimension reduction algorithms, and so can reveal
    patterns in the data where linear algorithms (like PCA) may fail

    +   - New data can be mapped onto an existing SOM

    +   - They are reasonably inexpensive to train

    +   - Re-running the LLE algorithm on the same dataset with the same value of
    *k* will always produce the same embedding


    The weaknesses of SOMs and LLE are:


    +   - They cannot natively handle categorical variables'
