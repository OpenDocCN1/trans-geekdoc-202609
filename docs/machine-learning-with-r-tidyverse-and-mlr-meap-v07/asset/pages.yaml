- pgno: 226
  md: '+   1. create a table of three columns, where each column represents a dummy
    variable

    +   2. choose a reference level (Gala, in this case)

    +   3. set the value of each dummy variable to 0 for the reference level

    +   4. set the value of each dummy variable to 1 for a particular factor level


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_226_0.png)


    **Figure 9.6 Recoding a polytomous categorical variable into k-1 dummy variables.**
    A four-level factor can be represented using three (k−1) dummy variables. The
    reference level (Gala) has a value of 0 for each dummy variable. The other levels
    have a value of 1 for a particular dummy variable. A slope is estimated for each
    dummy.


    We’ve now turned our single variable of four levels into three distinct dummy
    variables that each take a value of one or zero. But how does this help us? Well
    each dummy variable acts as a flag in the model formula to denote which level
    a particular case belongs to. The full model as shown in figure 9.6 is:


    $y = \beta_0 + \beta_{d1}d1 + \beta_{d2}d2 + \beta_{d3}d3 + \varepsilon$


    Now, as the intercept ($\beta_0$) represents acidity when all predictors are equal
    to 0, this is now the mean of the reference level, Gala. The slopes in the model
    ($\beta_{d1}$, $\beta_{d2}$ etc.) represent the difference between the mean of
    the reference level, and the means of each of the other levels. If a batch of
    cider was made with a particular type of apple, its dummy variables will "switch
    on" the slope between that type of apple, and the reference class, and "switch
    off" the others. For example, let’s say a particular batch was made with Braeburn
    apples, the model would look like this:


    $y = \beta_0 + \beta_{d1} \times 1 + \beta_{d2} \times 0 + \beta_{d3} \times 0
    + \varepsilon$


    The slopes of the other apple types are still in the model, but because their
    dummy variables are set to 0, they make no contribution to the predicted value!


    Models we build using the general linear model can mix both continuous and categorical
    predictors together. When we use our model to make predictions on new data, we
    simply:


    +   1. take the values of each of the predictor variables for that data

    +   2. multiply these values with the relevant slopes learned by the model

    +   3. add these values together'
  merge: -1
  img_proc: true
