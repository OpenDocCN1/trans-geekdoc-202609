- pgno: 115
  md: "# ### 4.4.1 Converting model parameters into odds ratios\n\nSo how to we get\
    \ from log odds to odds ratios? We simply take their exponent. We can also calculate\
    \ 95% confidence intervals using the `confint()` function, to help us decide on\
    \ the how strong the evidence is that each variable has predictive value.\n\n\
    # Listing 4.13 Converting model parameters into odds ratios\n\n```\n```r\nexp(cbind(Odds_Ratio\
    \ = coef(logRegModelData), confint(logRegModelData)))\n\nWaiting for profiling\
    \ to be done...\n                 Odds_Ratio       2.5 %       97.5 %\n(Intercept)\
    \      45.13516691 19.14718874 109.72483921\nPclass2           0.36775262  0.20650392\
    \   0.65220841\nPclass3           0.11854901  0.06700311   0.20885220\nSexmale\
    \           0.06229163  0.04182164   0.09116657\nAge               0.96192148\
    \  0.94700049   0.97652950\nFare              1.00322362  0.99872001   1.00863263\n\
    FamSize           0.78424868  0.68315465   0.89110044\n```\n```\n\nMost of our\
    \ odds ratios are less than one. An odds ratio less than one means that an event\
    \ is *less likely* to occur. It’s usually easier to interpret these if you divide\
    \ 1 by them. For example, the odds ratio for surviving if you were male is 0.06,\
    \ and 1 divided by 0.06 = 16.7. This means that, holding all other variables constant,\
    \ men were 16.7 times *less likely* to survive than women.\n\nFor continuous variables,\
    \ we interpret the odds ratios as how much more likely a passenger is to survive,\
    \ for every one unit increase in the variable. For example, for every additional\
    \ family member, a passenger was 1 / 0.78 = 1.28 times less likely to survive.\n\
    \nFor factors, we interpret the odds ratio as how much more likely a passenger\
    \ is to survive, compared to the reference level for that variable. For example,\
    \ we have odds ratios for `Pclass2` and `Pclass3`, which are how many more times\
    \ a passenger in class 2 and 3 are to survive compared to those in class 1, respectively.\n\
    \nThe 95% confidence intervals indicate the strength of the evidence that each\
    \ variable has predictive value. An odds ratio of one means the odds are equal,\
    \ and the variable has no impact on prediction. Therefore, if the 95% confidence\
    \ intervals include the value one, such as those for the `Fare` variable, then\
    \ this *may* suggest this variable isn’t contributing anything.\n\n# ### 4.4.2\
    \ When a one unit increase doesn’t make sense\n\nA one unit increase often isn’t\
    \ easily interpretable. Say you get an odds ratio that says for every additional\
    \ ant in an ant hill, that ant hill is 1.000005 times more likely to survive a\
    \ termite attack. How can you comprehend the importance of such a small odds ratio?\n\
    \nWhen it doesn’t make sense to think in one unit increases, a popular technique\
    \ is to log₂ transform the continuous variables instead, before training the model\
    \ with them. This won’t impact the predictions made by the model, but now the\
    \ odds ratio can be interpreted as: every"
  merge: -1
  img_proc: true
