- pgno: 63
  md: 'categorical predictor variables too. The k-NN algorithm can’t handle categorical
    variables natively, they need to first be encoded somehow, or distance metrics
    other than Euclidean distance must be used.


    It’s also very important for k-NN (and many machine learning algorithms), to scale
    your predictor variables, by dividing them by their standard deviation. This preserves
    the relationships between the variables, but ensures that variables measured on
    larger scales, don’t get given more importance by the algorithm. In the current
    example, if we divided the `glucose` and `insulin` variables by 1000,000, then
    predictions would rely mostly on the value of the `sspg` variable. We don’t need
    to scale the predictors ourselves because by default, the k-NN algorithm wrapped
    by the mlr package does this for us.


    # 3.2.2 Using *mlr* to train your first k-NN model


    We understand the problem we’re trying to solve (classifying new patients into
    one of three classes), now we need to train the k-NN algorithm to build a model
    that will solve that problem. Building a machine learning model with the mlr package
    has three main stages:


    +   1. **Define the task.** The task consists of the data, and what we want do
    to with it. In this case, the data is `diabetesTib` and we want to classify the
    data with the `class` variable as the target variable.

    +   2. **Define the learner.** The learner is simply the name of the algorithm
    we plan to use, along with any additional arguments the algorithm accepts.

    +   3. **Train the model.** This stage is what it sounds like: you pass the task
    to the learner, and the learner generates a model that you can use to make future
    predictions.


    > **TIP**  This may seem unnecessarily cumbersome, but splitting the task, learner,
    and model into different stages is very useful. It means that we can define a
    single task and apply multiple learners to it, or define a single learner, and
    test it with multiple different tasks!


    # 3.2.3 Telling mlr what we’re trying to achieve: defining the task


    So lets begin by defining our task. The components needed to define a task are:


    +   1. the data containing the predictor variables (variables we hope contain
    the information needed to make predictions/solve our problem)

    +   2. the target variable we want to predict


    For supervised learning, the target variable will be categorical if we have a
    classification problem, and continuous if we have a regression problem. For unsupervised
    learning, we omit the target variable from our task definition, as we don’t have
    access to labeled data. The components of a task are shown in figure 3.6.'
