- pgno: 367
  md: 'three nodes from a map. Each node has three numbers written under it, one corresponding
    to each variable in the dataset. For example, the weights for node 1 are 3 (for
    var 1), 9 (for var 2), and 1 (for var 3). Remember, at this point these are just
    random guesses for the value of each variable.


    Next, the algorithm chooses a case at random from the dataset, and calculates
    which node’s weights are the closest match to this case’s values for each of the
    variables. For example, if there was a case in the dataset whose values for var
    1, var 2, and var 3, were 3, 9, and 1, respectively, this case would perfectly
    match the weights of node 1. To find which node’s weights are most similar to
    the case in question, the distance is calculated between each case and the weights
    of each node in the map. This distance is usually squared Euclidean distance.
    Remember that Euclidean distance is just the straight line distance between two
    points, so the squared Euclidean distance just omits the square root step to make
    the computation faster.


    In figure 15.4, you can see the distances calculated between the first case, and
    each of the node’s weights. This case is most similar to the weights of node 1,
    as it has the smallest squared Euclidean distance to them (93.09).


    > The illustration in figure 15.4 shows only three nodes for brevity, but the
    distance is calculated for every single node in the map.'
