    \nResample Result\nTask: zooXgb\nLearner: classif.xgboost.tuned\nAggr perf: mmce.test.mean=0.0390\n\
    Runtime: 890.2\n```\n```\n\nPhenomenal! The cross-validation estimates our model\
    \ has an accuracy of *1 − 0.039 = 0.961 = 96.1%!* Go XGBoost!\n\n# 8.4 Strengths\
    \ and weaknesses of tree-based algorithms\n\nWhile it often isn’t easy to tell\
    \ which algorithms will perform well for a given task, here are some strengths\
    \ and weaknesses that will help you decide whether random forest or XGBoost will\
    \ perform well for your task.\n\nThe strengths of the random forest and XGBoost\
    \ algorithms are:\n\n+   - They can handle categorical and continuous predictor\
    \ variables (though XGBoost requires some numerical encoding)\n+   - They make\
    \ no assumptions about the distribution of the predictor variables\n+   - They\
    \ can handle missing values in sensible ways\n+   - They can handle continuous\
    \ variables on different scales\n+   - Ensemble techniques can drastically improve\
    \ model performance over individual trees and XGBoost in particular is excellent\
