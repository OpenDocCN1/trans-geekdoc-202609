    \ I merely wanted to show you that the SOM managed to separate the different classes,\
    \ and that clustering can be performed on a SOM map! We’ll start covering clustering\
    \ in the next chapter.\n\n> **NOTE**\n> \n> SOMs are a little different to other\
    \ dimension reduction techniques, in that they don’t really create new variables\
    \ for which each case is given a value (for example, the principal components\
    \ in PCA). SOMs reduce dimensionality by placing cases into nodes on a two-dimensional\
    \ map, rather than creating new variables. So if we want to perform cluster analysis\
    \ on the result of a SOM, we can use the weights to cluster the nodes themselves.\
    \ This is essentially treating each node as a case in a new dataset. If our cluster\
    \ analysis returns clusters of nodes, we can assign cases from the original dataset\
    \ to the cluster that their node belongs to."
