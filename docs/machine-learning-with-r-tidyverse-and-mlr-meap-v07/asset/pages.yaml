  md: "![](img/a22105d68c35e8d5bd3c7bafb4644881_425_0.png)\n\n**Figure 17.1 Dendrogram\
    \ showing an imaginary clustering of instruments in an orchestra.** Horizontal\
    \ lines indicate the merging of separate clusters. The height of a merge indicates\
    \ the similarity between the clusters (lower down, higher similarity).\n\nThe\
    \ purpose of hierarchical clustering algorithms therefore, is to learn this hierarchy\
    \ of clusters in a dataset. The main benefit of hierarchical clustering over k-means,\
    \ is that we get a much finer understanding of the structure of our data, and\
    \ it is often able to reconstruct real hierarchies in nature. For example, imagine\
    \ we sequence the genomes (all the DNA) of all breeds of dog. We can safely assume\
    \ that the genome of a breed will be more similar to the genome of the breed(s)\
    \ it was derived from, than the genomes of breeds it was not derived from. If\
    \ we apply hierarchical clustering to this data, the hierarchy, which can be visualized\
    \ as a dendrogram, can be directly interpreted as showing which breeds were derived\
    \ from each other.\n\nOk, so the hierarchy is very useful to us, but how do we\
    \ partition the dendrogram into a finite set of clusters? Well at any height on\
    \ the dendrogram, we can cut the tree horizontally, and take the number of clusters\
    \ at that level. Another way of imagining it is that if we were to cut a slice\
    \ through the dendrogram, however many individual branches would fall off is the\
    \ number of clusters. Look back at figure 17.1. If we cut the tree where I’ve\
    \ written strings, woodwind, brass, and percussion, we would get four individual\
    \ clusters, and cases would be assigned to whichever of these four clusters they\
    \ fall within. I’ll show you how we can select a cut point later in this section.\n\
    \n> **NOTE**  \n> If we cut the tree closer to the top, we get fewer clusters,\
    \ and if we cut the tree closer to the bottom, we get more clusters.\n\nOkay,\
    \ so we have an understanding of *what* hierarchical clustering algorithms try\
    \ to achieve, now let’s talk about *how* they achieve it. There are two approaches\
    \ we can take while trying to learn hierarchies in data:"
