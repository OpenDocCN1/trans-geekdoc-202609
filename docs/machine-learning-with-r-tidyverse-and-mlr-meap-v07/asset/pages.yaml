    Unfortunately, mlr won’t let us create a task with logical predictors, so let’s
    convert them into factors instead. There are a few ways to do this, but dplyr’s
    mutate_if() function comes in handy here. This function takes the data as the
    first argument (or we could have piped this in with %>%). The second argument
    is our criterion for selecting columns, so here I’ve used is.logical to consider
    only the logical columns. The final argument is what to do with those columns,
    so here I’ve used as.factor to convert the logical columns into factors. This
    will leave the existing factor type untouched.


    # Listing 7.2 Converting logical variables to factors


    ```

    zooTab <- mutate_if(zooTab, is.logical, as.factor)

    ```


    > TIP Alternatively, I could have used mutate_all(zooTab, as.factor) as the type
    column is already a factor.




    In this section I’ll walk you through training a decision tree model using the
    rpart algorithm. We’ll tune the algorithm’s hyperparameters, and train a model
    using the optimal hyperparameter combination.


    Let’s define our task and learner, and build a model as usual. This time, we supply
    "classif.rpart" as the argument to makeLearner() to specify we’re going to use
    rpart.'
