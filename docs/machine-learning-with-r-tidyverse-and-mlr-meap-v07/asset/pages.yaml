    swissOptics <- optics(swissScaled, minPts = 9)


    plot(swissOptics)

    ```

    ```


    The resulting plot from code listing 18.18 is shown in figure 18.14. Notice that
    we have two obvious troughs, separated by high peaks. Remember that this indicates
    regions of high density, separated by regions of low density in the feature space.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_476_0.png)


    **Figure 18.14** The reachability plot generated from applying the OPTICS algorithm
    to our data. The x axis shows the processing order of the cases, and the y axis
    shows the reachability distance for each case. We can see two main troughs in
    the plot, bordered by peaks of higher reachability distance.


    Now, let’s extract clusters from this ordering using the steepness method. To
    do this, we use the `extractXi()` function, passing the output from the `optics()`
    function as the first argument, and specifying the argument xi. Recall that xi
    (ξ) is a hyperparameter that determines the minimum steepness (1 − ξ) needed to
    start and end clusters in the reachability plot. How do we choose the value of
    ξ? Well in this example, I’ve simply chosen a value of ξ that gives a reasonable
    clustering result (as you’ll see in a moment). As we know, this isn’t a very scientific
    or objective approach, so for your own work, you should tune ξ as a hyperparameter,
    just like we did for epsilon and minPts for DBSCAN.


    > **NOTE**  The hyperparameter is bounded between 0 and 1, so this gives you a
    fixed space to search within!


    ```

    ```r

    swissOpticsXi <- extractXi(swissOptics, xi = 0.05)

    ```

    ```'
