  md: '+   1. They are good at finding ways of separating non-linearly separable classes

    +   2. They tend to perform well for a wide variety of tasks

    +   3. We now have the computational power to apply them to larger, more complex
    datasets


    This last point is important because it highlights a potential downside of SVMs:
    they tend to be more computationally expensive to train than many other classification
    algorithms. For this reason, if you have a very large dataset and computational
    power is limited, it may be economical for you to try cheaper algorithms first
    and see how they perform.


    > **TIP** Usually, we favor predictive performance over speed. But a computationally
    cheap algorithm that performs well enough for your problem may be preferable to
    you than one which is very expensive. Therefore, I may try cheaper algorithms
