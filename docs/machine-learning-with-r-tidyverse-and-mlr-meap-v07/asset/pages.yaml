- pgno: 36
  md: "Remember how I made a point of saying the first argument of each dplyr function\
    \ was the data? Well the reason this is so important and useful is that it allows\
    \ us to pipe the data from the previous operation, into the next one, and so the\
    \ entire data manipulation process we went through in section 2.4.1 becomes:\n\
    \n# Listing 2.14 Chaining dplyr operations together with the `%>%` operator\n\n\
    ```\n```r\narrangedData <- CO2tib %>%\n  select(c(1:3, 5)) %>%\n  filter(uptake\
    \ > 16) %>%\n  group_by(Plant) %>%\n  summarize(meanUp = mean(uptake), sdUp =\
    \ sd(uptake)) %>%\n  mutate(CV = (sdUp / meanUp) * 100) %>%\n  arrange(CV)\n\n\
    arrangedData\n\n# A tibble: 11 x 4\n   Plant meanUp  sdUp    CV\n   <ord> <dbl>\
    \  <dbl> <dbl>\n 1 Mc3    18.4  0.826  4.48\n 2 Mc1    20.1  1.83   9.11\n 3 Qn1\
    \    36.1  3.42   9.48\n 4 Mn2    29.9  3.92  13.1\n 5 Mn3    26.2  3.49  13.3\n\
    \ 6 Qc2    36.6  5.14  14.1\n 7 Qc1    32.6  5.03  15.4\n 8 Qn2    38.8  6.07\
    \  15.7\n 9 Mn1    29.0  5.70  19.6\n10 Qc3    35.5  7.52  21.2\n11 Qn3    37.6\
    \ 10.3   27.5\n```\n```\n\nRead through the code from top to bottom, and every\
    \ time you come to a `%>%` operator, say \"and then\". You would read it as: \"\
    take the CO2 data, and then select these columns, and then filter these rows,\
    \ and then group by this variable, and then summarize with these variables, and\
    \ then mutate this new variable, and then arrange in order of this variable and\
    \ save the output as `arrangedData`. Can you see that this is how you might explain\
    \ your data manipulation process to a colleague in plain English? This is the\
    \ power of dplyr: being able to perform complex data manipulations in a logical,\
    \ human-readable way.\n\n> **TIP** It is conventional to start a new line after\
    \ a `%>%` operator to help make the code easier to read.\n\n# EXERCISE 2.4\n\n\
    Group the mtcars tibble by the `gear` variable, summarize the medians of the `mpg`\
    \ and `disp` variables, and mutate a new variable that is the `mpg` median divided\
