    # ## 13.1.4 Dimension reduction mitigates the curse of dimensionality and collinearity


    So how can you mitigate the impacts of the curse of dimensionality and/or collinearity
    on the predictive performance of your models? Why, dimension reduction of course!
    If you can compress most of the information from 100 variables into just two or
    three, then the problems of data sparsity and near-equal distances, disappear.
    If you turn two collinear variables into one new variable that captures all the
    information of both, then the problem of dependence between the variables disappears.


    But we’ve already encountered another set of techniques that can mitigate the
    curse of dimensionality and collinearity: regularization. As we saw in chapter
    11, regularization can be used to shrink the parameter estimates, and even completely
    remove weakly-contributing predictors. Regularization can therefore reduce sparsity
    resulting from the curse of dimensionality, and remove variables that are colinear
    with others.


    > > **NOTE** For most people, tackling the curse of dimensionality is a more important
    use of dimension reduction than reducing collinearity.


    # ## 13.2 What is principal component analysis?


    In this section, I’ll show you what principal component analysis (PCA) is, how
    it works, and why it’s useful. Imagine we measure two variables on seven people,
    and we want to compress this information down into just a single variable using
    PCA. The first thing we need to do is center the variables, by subtracting each
    variable’s mean from its corresponding value for each case.


    In addition to centering our variables, we can also scale them by dividing each
    of them by their standard deviation. This is important if the variables are measured
    on different scales, otherwise those on large scales will be weighted more heavily.
    If our variables are on similar scales, this standardization step isn’t necessary.


    With our centered and, possibly scaled data, PCA now finds a new axis that satisfies
    two conditions:


    +   1. the axis passes through the origin

    +   2. the axis maximizes the variance of the data along itself


    The new axis that satisfies these conditions is called the first *principal axis*.
    When the data are projected onto this principal axis (moved at a right-angle onto
    the nearest point on the axis), this'
  merge: -1
