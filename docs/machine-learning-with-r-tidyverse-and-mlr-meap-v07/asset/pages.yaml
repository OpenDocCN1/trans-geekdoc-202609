  md: '> **IMPORTANT** Notice the `.` in the anonymous function? This simply represents
    the element that `map()` is currently iterating over.


    The expression after `function(.)` is the body of the function. There is nothing
    wrong with this syntax as it works perfectly fine, but purrr provides us with
    a shorthand for `function(.)` which is simply the `~` (tilde) symbol. Therefore
    we could simply the `map()` call to:


    ```

    map(listOfNumerics, ~ . + 2)

    ```


    Where we can simply substitute `~` for `function(.)`.


    # 2.7.4 Using `walk()` to produce a function’s side effects


    Sometimes we want to iterate a function for its side effects. Probably the most
    common example of this is when we want to produce a series of plots. In this situation,
    we can use the `walk()` function to apply a function to each element of a list
    to produce the function’s side effects. The `walk()` function also returns the
    original input data we pass it, so it’s useful for plotting an intermediate step
    in a series of piped operations. Here’s an example of `walk()` being used to create
    a separate histogram for each element of our list:


    ```

    par(mfrow = c(1, 3))


    walk(listOfNumerics, hist)

    ```


    The resulting plot is shown in figure 2.6.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_49_0.png)


    **Figure 2.6** The result of "walking" the `hist()` function over each element
    of our list using `walk()`.


    But what if we wanted to use the name of each list element, as the title for each
    histogram? We can do this using the `iwalk()` function, which makes the name or
    index of each element available to us. In the function we supply to `iwalk()`,
    we can use `.x` to reference the list element we’re iterating over, and use `.y`
    to reference its name/index.'
