- pgno: 5
  md: 'best. If you’re someone with a question or problem, and have sufficient data
    to answer it, machine learning can help you do just that.


    While you won’t be building intelligent cars or talking robots after reading this
    book (like Google and Deep Mind), you will have gained the skills to make powerful
    predictions and identify informative patterns in your data.


    I’m going to teach you the theory and practice of machine learning at a level
    that anyone with a basic knowledge of R can follow. Ever since high school, I’ve
    been terrible at mathematics, so I don’t expect you to be great at it either.
    While the techniques you’re about to learn are based in math, I’m a firm believer
    that there are no hard concepts in machine learning. All of the processes we’ll
    explore together will be explained graphically and intuitively. Not only does
    this mean you’ll be able to apply and understand these processes, you’ll learn
    all this without having to wade through mathematical notation. If, however, you
    are mathematically-minded, you’ll find equations presented through the book that
    are "nice to know", rather than "need to know".


    In this chapter we’re going to define what I actually mean by the term machine
    learning. You’ll learn the difference between an algorithm and a model, and discover
    that machine learning techniques can be partitioned into types that help guide
    us when choosing the best one for a given task.




    Imagine you work as a researcher in a hospital. What if, when a new patient is
    checked in, you could calculate the risk of them dying? This would allow the clinicians
    to treat high risk patients more aggressively and result in more lives being saved.
    But, where would you start? What data would you use? How would you get this information
    from the data? The answer is to use machine learning.


    Machine learning, sometimes referred to as statistical learning, is a subfield
    of artificial intelligence (AI) whereby algorithms "learn" patterns in data to
    perform specific tasks. Although algorithms may sound complicated, they aren’t.
    In fact, the idea behind an algorithm is not complicated at all. An algorithm
    is simply a step-by-step process that we use to achieve something, that has a
    beginning and an end. Chefs have a different word for algorithms, they call them
    "recipes". At each stage in a recipe, you perform some kind of process, like beating
    an egg, then follow the next instruction in the recipe, such as mixing the ingredients.


    Have a look at an algorithm I made for making a cake in figure 1.1. It starts
    at the top and progresses through the various operations needed to get the cake
    baked and served up. Sometimes, there are decision points, where the route we
    take depends on the current state of things, and sometimes we need to go back
    or iterate to a previous step of the algorithm. While it’s true that extremely
    complicated things can be achieved with algorithms, I want you to understand that
    they are simply a sequential chain of simple operations.'
