    may result in many misclassifications, and so a better approach is needed.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_93_0.png)


    We can better model the relationship between copper content and class membership
    using the logistic function, which is shown in figure 4.3. The logistic function
    is an "s" shaped curve which'
