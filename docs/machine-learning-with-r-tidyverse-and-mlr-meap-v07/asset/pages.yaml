- pgno: 432
  md: 'In this section, I’ll show you ways of deciding how many clusters to extract
    from our hierarchy. Another way of thinking about this, is that we’re deciding
    what level of the hierarchy to use for clustering.


    To define a finite number of clusters following hierarchical clustering, we need
    to define a cut point on our dendrogram. If we cut the tree near the top, we’ll
    get fewer clusters, and if we cut the tree near the bottom, we’ll get more clusters.
    So how do we choose a cut point? Well, our friends the Davies-Bouldin index, the
    Dunn index, and the pseudo F statistic can help us here. For k-means clustering,
    we performed a cross-validation-like procedure for estimating the performance
    of different numbers of clusters. Sadly, we can’t use this approach for hierarchical
    clustering because unlike k-means, hierarchical clustering cannot predict cluster
    membership of new cases.


    > The hierarchical clustering algorithms themselves can’t predict the cluster
    membership of new cases, but you could do something like assign new data to the
    cluster with the nearest centroid. You could use this approach to create separate
    training and test sets to evaluate internal cluster metrics on.


    Instead, we can make use of bootstrapping. Recall from chapter 8, that bootstrapping
    is the process of taking bootstrap samples, applying some computation to each
    sample, and returning a statistic(s). The mean of our bootstrapped statstic(s)
    tells us the most likely value, and the distribution gives us an indication as
    to the stability of the statistic(s).


    > Remember that a bootstrap sample is where we randomly select cases from a dataset
    with replacement, to create a new sample the same size as the old. Sampling "with
    replacement" simply means that once we sample a particular case, we put it back
    again, such that there is a possibility it will be drawn again.


    In the context of hierarchical clustering, we can use bootstrapping to generate
    multiple samples from our data, and generate a separate hierarchy for each sample.
    We can then select a range of cluster numbers from each hierarchy, and calculate
    the internal cluster metrics for each. The advantage of using bootstrapping is
    that calculating the internal cluster metrics on the full dataset doesn’t give
    us an indication as to the stability of the estimate, whereas the bootstrap sample
    does. The bootstrap sample of cluster metrics will have some variation around
    its mean, and so we can choose the number of clusters with the most optimal, and
    stable metrics.


    Let’s start by defining our own function that takes our data and a vector of cluster
    memberships, and returns our three familiar internal cluster metrics for the data:
    the Davies-Bouldin index, the'
  merge: -1
  img_proc: true
