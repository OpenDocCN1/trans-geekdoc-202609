  md: '# 8.3 Building our first XGBoost model


    In this section, I’ll show you how to build an XGBoost model, and how to tune
    its hyperparameters. There are eight (!) important hyperparameters for us to consider:


    +   - `eta`, known as the learning rate. This is a number between 0 and 1, which
    model weights are multiplied by to give their final weight. Setting this value
    below 1 slows down the learning process because it "shrinks" the improvements
    made by each additional model. Preventing the ensemble from learning too quickly
    prevents overfitting. A low value is generally better, but will make model training
    take much longer because many model sub-models are needed to achieve good prediction
    accuracy

    +   - `gamma`, the minimum amount splitting a node must improve the predictions
    by. Similar to the cp value we tuned for rpart

    +   - `max_depth`, the maximum levels deep each tree can grow

    +   - `min_child_weight`, the minimum degree of impurity needed in a node before
    attempting to split it (if a node is pure enough, don’t try to split it again)

    +   - `subsample`, the proportion of cases to be randomly sampled (without replacement)
    for each tree. Setting this to 1 uses all the cases in the training set

    +   - `colsample_bytree`, the proportion of predictor variables sampled for each
    tree. We could also tune colsample_bylevel and colsample_bynode, which instead
    sample predictors for each level of depth in a tree and at each node, respectively

    +   - `nrounds`, the number of sequentially-built trees in the model

    +   - `eval_metric`, the type of residual error/loss function we’re going to use.
    For multi-class classification, this will either be the proportion of cases that
    were incorrectly classified (called `merror` by XGBoost) or the log loss (called
    `mlogloss` by XGBoost)


    The first thing to do is create a learner with the `makeLearner()` function. This
    time, our learner is `"classif.xgboost"`.


    ```

    xgb <- makeLearner("classif.xgboost")

    ```


    Now irritatingly, xgboost only likes to play with numerical predictor variables.
    Our predictors are currently factors, so we’ll need to mutate them into numerics,
    then define a new task with this mutated tibble. I’ve used the `mutate_at()` function
    to convert all the variables except `type` (by setting `.vars = vars(-type)`)
    into numerics (by setting `.funs = as.numeric`).'
  merge: -1
  img_proc: true
