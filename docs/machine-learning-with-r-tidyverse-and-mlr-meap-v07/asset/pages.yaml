    have been drawn using `abline()` to highlight the 5-NN distances at the start
    and end of the knee/elbow in the plot.


    Now, let’s manually define our hyperparameter search space for epsilon and minPts.
    I use the `expand.grid()` function to create a data frame containing every combination
    of the values of epsilon (eps) and minPts I want to search over.


    We’re going to search across values of epsilon between 1.2 and 2.0, in steps of
    0.1, and we’re going to search across values of minPts between one and nine, in
    steps of 1.'
