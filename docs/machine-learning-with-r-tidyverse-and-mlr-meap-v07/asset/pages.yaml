- pgno: 24
  md: 'for this, and they would work fine. But the code would be long, wouldn''t be
    very human-readable (so in a month you struggle to remember what you did), and
    the plots would be cumbersome to produce.


    # 2.1 What is the tidyverse and what is tidy data?


    The purpose of this book is to give you the skills to apply machine learning approaches
    to your data. While it isn’t my intention to cover all other aspects of data science
    (nor could I in a single book), I do want to introduce you to the tidyverse. Before
    you can input your data into a machine learning algorithm, it needs to be in a
    format that the algorithm is happy to work with.


    The tidyverse is an “opinionated collection of R packages designed for data science”,
    created for the purpose of making data science tasks in R simpler, more human-readable
    and more reproducible. The packages are "opinionated" because they are designed
    to make tasks the package authors consider to be good practice, easy, and make
    tasks they consider to be bad practice, difficult. The name comes from the concept
    of tidy data, a data structure by where:


    +   • Each row represents a single observation

    +   • Each column represents a variable.


    Take a look at the data in table 2.1. Imagine we take four runners, and put them
    on a new training regime. We want to know if the regime is improving their running
    times, so we record their best times just before the new training starts (Month
    0), and for three months after.


    This is an example of untidy data. Can you see why? Well, let’s go back to our
    rules. Does each row represent a single observation? Nope. In fact, we have four
    observations per row (one for each month). Does each column represent a variable?
    Nope. There are only three variables in this data: the athlete, the month, and
    the best time, and yet we have 5 columns!


    How would the same data look in tidy format? Table 2.2 shows you.


    | Athlete | Month 0 | Month 1 | Month 2 | Month 3 |

    |---------|---------|---------|---------|---------|

    | Joana | 12.50 | 12.1 | 11.98 | 11.99 |

    | Debi | 14.86 | 14.9 | 14.70 | 14.30 |

    | Sukhveer | 12.10 | 12.1 | 12.00 | 11.80 |

    | Kerol | 19.60 | 19.7 | 19.30 | 19.00 |'
  merge: -1
  img_proc: true
