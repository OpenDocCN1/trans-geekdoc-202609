- pgno: 7
  md: 'Arthur Samuel, a scientist at IBM, first used the term machine learning in
    1959. He used it to describe a form of artificial intelligence (AI) that involved
    training an algorithm to learn to play the game of checkers. The word learning
    is what''s important here, as this is what distinguishes machine learning approaches
    from traditional AI.


    ```

    numberOfLegs <- c(4, 4, 0)

    climbsTrees <- c(TRUE, FALSE, TRUE)

    for (i in 1:3) {

    if (numberOfLegs[i] == 4) {

    if (climbsTrees[i]) print("cat") else print("dog")

    } else print("snake")

    }

    ```


    In the R code above I''ve created three rules, mapping every possible input available
    to us to an output:


    +   1. If the animal has four legs and climbs trees, it''s a cat

    +   2. If the animal has four legs and does not climb trees, it''s a dog

    +   3. Otherwise, the animal is a snake


    Now if we apply these rules to the data, we get the expected answers:


    ```

    [1] "cat"

    [1] "dog"

    [1] "snake"

    ```


    The problem with this approach is that you need to know all possible outputs the
    computer should give you in advance, and the system will never give you an output
    that you haven''t told it to give. Contrast this to the machine learning approach,
    where instead of telling the computer the rules, you give it the data and allow
    it to learn the rules for itself. The advantage of this approach is that the "machine"
    can learn patterns we didn''t even know existed in the data, and the more data
    we provide, the better it gets at learning those patterns (figure 1.2).'
  merge: -1
  img_proc: true
