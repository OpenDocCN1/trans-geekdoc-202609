  md: "> **NOTE**  \n> It’s important to note that each case in the data only appears\
    \ in the test set once in this procedure.\n\n![](img/a22105d68c35e8d5bd3c7bafb4644881_75_0.png)\n\
    \n+   1. The data are randomly split into *k*, equally-sized folds\n+   2. Each\
    \ fold is used as the test set once, where the rest of the data make the training\
    \ set\n+   3. For each fold, predictions are made on the test set\n+   4. The\
    \ predictions are compared to the true values\n\n**Figure 3.13 k-fold cross-validation\
    \ (CV).** The data is randomly split into near equally-sized \"folds\". Each fold\
    \ is used as the test set once, where the rest of the data are used as the training\
    \ set. The similarity of the predictions to the true values of the test set is\
    \ used to evaluate model performance.\n\nThis approach will typically give a more\
    \ accurate estimate of model performance because every case appears in the test\
    \ set once, and we are averaging the estimates over many runs. But we can improve\
    \ this a little by using *repeated* *k*-fold cross-validation, where after the\
    \ procedure above, we shuffle the data around and perform it again.\n\nFor example,\
    \ a commonly chosen value of *k* for *k*-fold is ten. Again, this depends on the\
    \ size of the data among other things, but is a reasonable value for many datasets.\
    \ This means that we split the data into 10, near equal-sized chunks and perform\
    \ the cross-validation. If we repeat this procedure five times, then we have ten-fold\
    \ cross-validation repeated five times (this is *not* the same as 50-fold cross-validation)\
    \ and the estimate of model performance will be the average of 50 different runs.\n\
    \nTherefore, if you have the computational power, it is usually preferred to use\
    \ repeated *k*-fold cross-validation instead of ordinary *k*-fold and this is\
    \ what we’ll be using through many examples in this book."
