- pgno: 98
  md: '# NOTE


    The more influence a predictor variable has on the log odds, the steeper the slope
    will be, while variables that have no predictive value will have a slope that
    is nearly horizontal.


    Additionally, having a linear relationship means that when we have multiple predictor
    variables, we can add their contributions to log odds together to get the overall
    log odds of a painting being an original, based on the information from all of
    its predictors.


    So how do we get from the straight line relationship between copper content and
    making predictions on new paintings? Well the model calculates the log odds of
    our new data being an original painting using:


    ```

    log odds = y intercept + slope × copper_

    ```


    where we take the y intercept, and add the product of the slope, and the value
    of copper in our new painting. Once we’ve calculated the log odds of our new painting,
    we convert it into the probability of being an original using the logistic function:


    # EQUATION 4.4


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_98_0.png)


    Where p is the probability, e is Euler’s number (a fixed constant ~ 2.718), and
    z is the log odds of a particular case.


    Then quite simply, if the probability of a painting being an original is > 0.5,
    it gets classified as an original. If the probability is < 0.5, it gets classified
    as a forgery. This conversion of log odds to odds to probabilities is illustrated
    in figure 4.6.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_98_1.png)'
