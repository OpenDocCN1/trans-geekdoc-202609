    Leave-one-out cross-validation can be thought of as the extreme of k-fold cross-validation:
    instead of breaking the data up into folds, we simply reserve a single observation
    as a test case, train the model on the whole of the rest of the data, then pass
    the test case through it and record the relevant performance metrics. Now, we
    do the same but select a different observation as the test case. We continue doing
    this until every observation has been used as the test case once, where we take
    the average of the performance metrics. You can see a scheme of leave-one-out
    cross-validation in figure 3.14.


    Now because the test set is only a single observation, leave-one-out cross-validation
    tends to give quite variable estimates of model performance (because the performance
    estimate of each iteration depends on correctly labeling that single test case).
    But, it can give less variable'
