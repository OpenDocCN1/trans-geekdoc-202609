  md: "> **NOTE**  Remember that we first define our resampling method using `makeResampleDesc()`,\
    \ then use `resample()` to run the cross-validation.\n\nBecause we’re supplying\
    \ our wrapped learner to the `resample()` function, for each fold of cross validation,\
    \ the mean of the `Age` variable in the training set will be used to impute any\
    \ missing values.\n\n# Listing 4.11 Cross validating our model building process\n\
    \n```\nkFold <- makeResampleDesc(method = \"RepCV\", folds = 10, reps = 50,\n\
