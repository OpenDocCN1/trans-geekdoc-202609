- pgno: 74
  md: 'The absolute confusion matrix is easier to interpret. The rows show the true
    class labels, and the columns show the predicted labels. The numbers represent
    the number of cases in every combination of true class and predicted class. For
    example, in this matrix 11 patients were correctly classified as chemically diabetic,
    but one was erroneously classified as healthy. Correctly classified patients are
    found on the diagonal of the matrix (where true class == predicted class).


    The relative confusion matrix looks a little more intimidating, but the principal
    is the same. This time, instead of the number of cases for each combination of
    true class and predicted class, we have the proportion. The number before the
    / is the proportion of the row in this column, the number after the / is the proportion
    of the column in this row. For example, in this matrix 92% of chemically diabetic
    patients were correctly classified, while 8% were misclassified as healthy (you
    see these are proportions for the numbers I used for the absolute confusion matrix?).


    Confusion matrices help us understand which classes our model classifies well
    and which ones it does worse at classifying. For example, based on this cross-validation,
    it looks like our model struggles to distinguish healthy patients from chemically
    diabetic ones.


    > **NOTE**  Your confusion matrix looking different to mine? Of course it is!
    The confusion matrix is based on the prediction made on the test set, and because
    the test set is selected at random in hold-out cross-validation, the confusion
    matrix will change every time you re-run cross-validation.


    As I said earlier, I try to avoid hold-out cross-validation unless my model is
    very expensive to train, so I generally prefer k-fold cross-validation.


    The only real benefit of this method is that it is computationally less expensive
    than the other forms of cross-validation. This can make it the only viable cross-validation
    method for computationally expensive algorithms. But the purpose of cross-validation
    is to get as accurate an estimation of model performance as possible, and hold-out
    cross-validation may give you very different results each time you apply it, simply
    because not all of the data are being used in the training set and test set. This
    is where the other forms of cross-validation come in.


    # 3.5.2 *k*-fold cross-validation


    In k-fold cross-validation, we randomly split the data into approximately equal
    sized chunks called folds. Then, we reserve one of the folds as a test set, and
    use the remaining data as the training set (just like in hold-out). We pass the
    test set through the model and make a record of the relevant performance metrics.
    Now, we use a different fold of the data as our test-set, and do the same. We
    continue until all the folds have been used once as the test set. We then get
    an average of the performance metric as an estimate of model performance. You
    can see a scheme of k-fold cross-validation in figure 3.13.'
  merge: -1
  img_proc: true
