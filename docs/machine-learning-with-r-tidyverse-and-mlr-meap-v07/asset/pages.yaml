    # 1.6 Summary


    +   - Artificial intelligence is the appearance of intelligent knowledge by a
    computer process

    +   - Machine learning is a subfield of artificial intelligence, where the computer
    learns relationships in data to make predictions on future, unseen data, or to
    identify meaningful patterns that help us understand our data better

    +   - A machine learning algorithm is the process by which patterns and rules
    in the data are learned, and the model is the collection of those patterns and
    rules which accepts new data, applies the rules to it, and outputs an answer

    +   - Deep learning is a subfield of machine learning, which is, itself, a subfield
    of artificial intelligence

    +   - Machine learning algorithms are categorized/divided as supervised and unsupervised,
    depending on whether they learn from ground-truth-labeled data (supervised learning)
    or unlabeled data (unsupervised learning)

    +   - Supervised learning algorithms are categorized/divided into classification
    (if they predict a categorical variable) or regression (if they predict a continuous
    variable)

    +   - Unsupervised learning algorithms are categorized/divided into dimension
    reduction (if they find a lower dimension representation of the data) or clustering
    (if they identify clusters of cases in the data)

    +   - Along with Python, R is a popular data science language and contains many
    tools and built-in data that simplify the process of learning data science and
    machine learning'
