- pgno: 311
  md: '# Modeling spectral data


    The dataset we''re working with is an example of spectral data. Spectral data
    contains observations made across a range of (usually) wavelengths. For example,
    we might measure how much a substance absorbs light from a range of different
    colors.


    Statisticians and data scientists call this kind of data functional data, where
    there are many dimensions in the dataset (the wavelengths we measure across) and
    there is a particular order to those dimensions (starting by measuring the absorbance
    at the lowest wavelength and working our way to the highest wavelength).


    A branch of statistics called functional data analysis is dedicated to modeling
    data like this. In functional data analysis, each predictor variable is turned
    into a function (for example, a function that describes how absorption changes
    over ultraviolet and near-infrared wavelengths). That function is then used in
    the model as a predictor, to predict the outcome variable. We won''t apply this
    kind of technique to this data, but if you''re interested in functional data analysis,
    check out Functional Data Analysis by James Ramsay (Springer, 2005).


    As the pre-defined fuelsubset.task defines the ultraviolet and near-infrared spectra
    as functional variables, we''re going to define our own task, treating each wavelength
    as a separate predictor. We do this as usual, using the makeRegrTask() function,
    setting the heatan variable as our target. I then define our k-NN learner using
    the makeLearner() function.


    # NOTE


    Notice that for regression, the name of the learner is "regr.kknn" with two ks,
    rather than the "classif.kknn" we used in chapter 3. This is because this function
    is taken from the kknn package, which allows us to perform kernel k-nearest neighbors,
    where we use a kernel function (just like with SVMs in chapter 6) to find a linear
    decision boundary between classes..


    # Listing 12.4 Defining the task and k-NN learner


    ```

    fuelTask <- makeRegrTask(data = fuelTib, target = "heatan")

    kknn <- makeLearner("regr.kknn")

    ```'
  merge: -1
  img_proc: true
- pgno: 312
  md: "# 12.3.2 Tuning the *k* hyperparameter\n\nIn this section, we’re going to tune\
    \ *k* to get the best performing k-NN model possible. Remember that for regression,\
    \ the value of *k* determines how many of the nearest neighbors’ outcome values\
    \ to average when making predictions on new cases. I first define the hyperparameter\
    \ search space using the `makeParamSet()` function, and define *k* as a discrete\
    \ hyperparameter with possible values 1 through 12. Then, I define our search\
    \ procedure as a grid search (so that we will try every value in the search space),\
    \ and define a 10-fold cross-validation strategy.\n\nAs we’ve done many times\
    \ before, we run the tuning process using the `tuneParams()` function, supplying\
    \ the learner, task, cross-validation method, hyperparameter space, and search\
    \ procedure, as arguments.\n\n# Listing 12.5 Tuning k\n\n```\n```r\nkknnParamSpace\
    \ <- makeParamSet(makeDiscreteParam(\"k\", values = 1:12))\n\ngridSearch <- makeTuneControlGrid()\n\
    \nkFold <- makeResampleDesc(\"CV\", iters = 10)\n\ntunedK <- tuneParams(kknn,\
    \ task = fuelTask,\n                     resampling = kFold,\n               \
    \      par.set = kknnParamSpace,\n                     control = gridSearch)\n\
    \ntunedK\n\nTune result:\nOpt. pars: k=7\nmse.test.mean=10.7413\n```\n```\n\n\
    We can plot the hyperparameter tuning process by extracting the tuning data with\
    \ the `generateHyperParsEffectData()` function, and passing this to the `plotHyperParsEffect()`\
    \ function, supplying our hyperparameter (\"k\") as the x axis, and mean MSE (\"\
    mse.test.mean\") as the y axis. Setting the `plot.type` argument equal to \"line\"\
    \ connects the samples with a line.\n\n# Listing 12.6 Plotting the tuning process\n\
    \n```\n```r\nknnTuningData <- generateHyperParsEffectData(tunedK)\n\nplotHyperParsEffect(knnTuningData,\
    \ x = \"k\", y = \"mse.test.mean\",\n                    plot.type = \"line\"\
    ) +\n  theme_bw()\n```\n```\n\nThe resulting plot from code listing 12.6 is shown\
    \ in figure 12.8. We can see that the mean MSE starts to rise as *k* increases\
    \ beyond seven, so it looks like our search space was appropriate."
  merge: -1
  img_proc: true
- pgno: 313
  md: "![](img/a22105d68c35e8d5bd3c7bafb4644881_313_0.png)\n\n**EXERCISE 12.2**\n\n\
    Let’s make sure our search space was large enough. Repeat the tuning process,\
    \ but search values of *k* from 1 to 50. Plot this tuning process just like we\
    \ did in figure 12.8. Was our original search space large enough?\n\nNow we have\
    \ our tuned value of *k*, we can define a learner using that value, with the `setHyperPars()`\
    \ function, and train a model using it.\n\n# Listing 12.7 Training the final,\
    \ tuned k-NN model\n\n```\n```r\ntunedKnn <- setHyperPars(makeLearner(\"regr.kknn\"\
    ), par.vals = tunedK$x)\n\ntunedKnnModel <- train(tunedKnn, fuelTask)\n```\n```\n\
    \n# 12.4 Building our first random forest regression model\n\nIn this section,\
    \ I’ll teach you how to define a random forest learner for regression, tune its\
    \ many hyperparameters, and train a model for our fuel task.\n\n> **NOTE**\n>\
    \ \n> We can also use the rpart algorithm to build a regression tree, but as it\
    \ is almost always outperformed by bagged and boosted learners, we’re going to\
    \ skip over it and dive straight in with random forest and XGBoost. Recall that\
    \ bagged (bootstrap-aggregated) learners train multiple models on bootstrap samples\
    \ of the data, and return the majority vote. Boosted learners train models sequentially,\
    \ putting more emphasis on correcting the mistakes of the previous ensemble of\
    \ models.\n\nWe’ll start by defining our random forest learner. Notice that rather\
    \ than \"classif.randomForest\" as in chapter 8, the regression equivalent is\
    \ \"regr.randomForest\"."
  merge: -1
  img_proc: true
- pgno: 314
  md: '```

    forest <- makeLearner("regr.randomForest")

    ```


    Then, we''re going to tune the hyperparameters of our random forest learner: ntree,
    mtry, nodesize, and maxnodes. I first defined what these hyperparameters do in
    chapter 8, but let’s recap each one here:


    +   • ntree controls the number of individual trees to train. More trees is usually
    better until adding more doesn’t improve performance any more

    +   • mtry controls the number of predictor variables that are randomly sampled
    for each individual tree. Training each individual tree on a random selection
    of predictor variables helps keep the trees uncorrelated, and therefore helps
    prevent the ensemble model from overfitting the training set

    +   • nodesize defines the minimum number of cases allowed in a leaf node. For
    example, setting nodesize equal to 1 would allow each case in the training set
    to have it’s own leaf

    +   • maxnodes defines the maximum number of nodes in each individual tree


    As usual, we create our hyperparameter search space using the makeParamSet() function,
    defining each hyperparameter as an integer with sensible lower and upper bounds.


    We define a random search with 100 iterations, and start the tuning procedure
    with our forest learner, fuel task, and holdout cross-validation strategy.


    > WARNING This tuning process takes a little while, so let’s use our good friends
    the parallel and parallelMap packages. Using parallelization, this takes two minutes
    on my four-core machine.'
  merge: -1
  img_proc: true
- pgno: 315
  md: "```\nforestParamSpace <- makeParamSet(\n  makeIntegerParam(\"ntree\", lower\
    \ = 50, upper = 50),\n  makeIntegerParam(\"mtry\", lower = 100, upper = 367),\n\
    \  makeIntegerParam(\"nodesize\", lower = 1, upper = 10),\n  makeIntegerParam(\"\
    maxnodes\", lower = 5, upper = 30)\n)\n\nrandSearch <- makeTuneControlRandom(maxit\
    \ = 100)\n\nlibrary(parallel)\n\nlibrary(parallelMap)\n\nparallelStartSocket(cpus\
    \ = detectCores())\n\ntunedForestPars <- tuneParams(forest, task = fuelTask,\n\
    \  resampling = kFold,\n  par.set = forestParamSpace,\n  control = randSearch)\n\
    \nparallelStop()\n\ntunedForestPars\n\nTune result:\nOp. pars: ntree=50; mtry=244;\
    \ nodesize=6; maxnodes=25\nmse.test.mean=6.3293\n```\n\nNext, let’s train the\
    \ random forest model using our tuned hyperparameters. Once we’ve trained the\
    \ model, it’s a good idea to extract the model information and pass this to the\
    \ plot() function to plot the out-of-bag error. Recall from chapter 8 that the\
    \ out-of-bag error is the mean prediction error for each case, by trees that did\
    \ not include that case in their bootstrap sample. The only difference between\
    \ the out-of-bag error for classification and regression random forests, is that\
    \ in classification the error was the proportion of cases that were misclassified,\
    \ but in regression, the error is the mean squared error.\n\n\n\n```\ntunedForest\
