    \n![](img/a22105d68c35e8d5bd3c7bafb4644881_94_0.png)\n\n**Figure 4.3 Modelling\
    \ the data with the logistic function.** The \"s\"-shaped line represents the\
    \ logistic function fitted to the data. The center of the curve passes through\
    \ the mean of copper content and maps it between zero and one.\n\nImportantly,\
    \ as the logistic function maps our *x* variable between the values of zero and\
    \ one, we can interpret its output as the probability of a case with a particular\
    \ copper content being an original painting.\n\nTake another look at figure 4.3.\
    \ Can you see that as copper content increases, the logistic function approaches\
    \ one? This is representing the fact that, on average, original paintings have\
    \ a higher copper content, so if you pick a painting at random and find it has\
