- pgno: 223
  md: '# When interpretability is as/more important than performance


    While another regression algorithm may perform better for a particular task, models
    formulated using the general linear model are often favored for how interpretable
    they are. The slopes tell you how much the outcome variable changes with a one-unit
    increase of each predictor variable, holding all other variables constant.


    There are other algorithms that may learn models that perform better on a particular
    task, but aren''t as interpretable. Such models are often described as being "black-boxes",
    where the model takes input and gives output, but it''s not easy to see and/or
    interpret the rules inside the model that led to that particular output. Random
    forrest, XGBoost, and SVMs are examples of black-box models.


    So when would we prefer an interpretable model (such as a linear regression model),
    over a black-box model that performs better? Well one example is if our model
    has the potential to discriminate. Imagine if a model incorporated bias against
    women during training. It might be difficult to detect this immediately using
    a black-box model, whereas if we can interpret the rules, we can check for such
    biases. A similar consideration is safety, where it''s imperative to ensure our
    model doesn''t give potentially dangerous outcomes (such as unnecessary medical
    intervention).


    Another example is when we are using machine learning to better understand a system
    or nature. Getting predictions from a model might be useful, but understanding
    those rules to deepen our understanding and stimulate further research may be
    of more importance. Black-boxes can make this difficult.


    Finally, understanding the rules of our model allows us to make changes in the
    way we do things. Imagine a business uses a linear regression model to predict
    demand for a particular product, based on things like its cost and how much they
    spend on advertising. Not only can the company predict future demand, they can
    control it, by interpreting the rules of how the predictor variables impact the
    outcome.


    When modeling our data with the general linear model, we make the assumption that
    our residuals are normally distributed and homoscedastic. Homoscedastic is a ridiculous-sounding
    word (impress your friends with it) that simply means the variance of the outcome
    variable doesn''t increase as the predicted value of the outcome increases.


    # TIP


    The opposite of homoscedastic is heteroscedastic.


    We also make the assumption that there is a linear relationship between each predictor
    variable and the outcome, and that the effects of the predictor variables on the
    response variable are'
