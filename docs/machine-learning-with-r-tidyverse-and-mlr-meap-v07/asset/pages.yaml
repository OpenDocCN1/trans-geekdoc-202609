    \  Month3   27\n7 A       Month6   21\n8 B       Month6   22\n9 C       Month6\
    \   23\n\ngather(patientData, key = Month, value = BMI, c(Month0, Month3, Month6))\n\
    \n# A tibble: 9 x 3\n  Patient Month    BMI\n  <chr>   <chr>  <dbl>\n1 A     \
    \  Month0   21\n2 B       Month0   17\n3 C       Month0   29\n4 A       Month3\
    \   20\n5 B       Month3   21\n6 C       Month3   27\n7 A       Month6   21\n\
    8 B       Month6   22\n9 C       Month6   23\n```\n\n# SIDEBAR\n\n# Converting\
    \ data to wide format\n\nThe data structure in the `patientData` tibble is called\
    \ *wide format*, where observations for a single case are placed in the same row,\
    \ across multiple columns. Mostly we want to work with tidy data because it makes\
    \ our lives simpler: we can see immediately which variables we have, grouping\
    \ structures are made clear, and most functions are designed to work easily with\
    \ tidy data. There are, however, some rare occasions where we need to convert\
    \ our tidy data into wide format, perhaps because a function we need expects the\
    \ data in this format. We can convert tidy data into its wide format using the\
    \ `spread()` function:\n\n```\nspread(tidyPatientData, key = Month, value = BMI)\n\
    \n# A tibble: 3 x 4\n  Patient Month0 Month3 Month6\n  <chr>    <dbl>  <dbl> \
    \ <dbl>\n1 A           21     20     21\n2 B           17     21     22\n3 C \
    \          29     27     23\n```\n\nIts use is simply opposite to that of gather:\
    \ we supply the `key` and `value` arguments as the names of the key and value\
    \ columns we created using the `gather()` function, and the function converts\
    \ these into wide format for us."
