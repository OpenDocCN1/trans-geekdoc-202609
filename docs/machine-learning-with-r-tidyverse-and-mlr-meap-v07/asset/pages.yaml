  md: "This time supplying `\"cluster.kmeans\"` as the name of the learner. I use\
    \ the `par.vals` argument to supply two arguments to the learner: `iter.max` and\
    \ `nstart`.\n\n> **NOTE**  \n> Just as the prefixes for classification and regression\
    \ learners were `classif.` and `regr.`, respectively, the prefix for clustering\
    \ learners is `cluster.`.\n\nThe `iter.max` argument sets an upper limit for the\
    \ number of rounds through the data the algorithm will cycle through (the default\
    \ is ten). The k-means algorithms will all stop once cases stop moving clusters,\
    \ but setting a maximum can be useful for large datasets that take a long time\
    \ to converge. I’ll show you how to tell if your clustering model has converged\
    \ before reaching this limit, later in this section.\n\nThe `nstart` argument\
    \ controls how many times the function will randomly initialize the centers. Recall\
    \ that the initial centers are usually randomly initialized somewhere in the feature\
    \ space? This can have an impact on the final centroid positions and therefore,\
    \ the final cluster memberships. Setting the `nstart` argument higher than the\
    \ default value of one, will randomly initialize this number of centers. For each\
    \ set of initial centers, the cases are assigned to the cluster of their nearest\
    \ center in each set, and the set with the smallest within-cluster sum of squared\
    \ error is then used for the rest of the clustering algorithm. In this way, the\
    \ algorithm selects the set of centers that is already most similar to the real\
    \ cluster centroids in the data. Increasing 'nstart' is arguably more important\
    \ than increasing the number of iterations.\n\n> **TIP**  \n> If you have a dataset\
    \ with very clearly-separable clusters, setting `nstart` higher than one might\
    \ be a waste of computational resources. However, unless your dataset is very\
    \ large, it’s usually a good idea to set `nstart > 1`; here I set mine to 10.\n\
    \n```\n```r\ngvhdTask <- makeClusterTask(data = as.data.frame(gvhdScaled)\n\n\
    listLearners(\"cluster\")$class\n\n[1] \"cluster.cmeans\"    \"cluster.Cobweb\"\
    \    \"cluster.dbscan\"\n[4] \"cluster.EM\"       \"cluster.FarthestFirst\" \"\
    cluster.kmeans\"\n[7] \"cluster.kmeans\"   \"cluster.SimpleKMeans\" \"cluster.XMeans\"\
    \n\nkMeans <- makeLearner(\"cluster.kmeans\",\n                      par.vals\
    \ = list(iter.max = 100, nstart = 10))\n```\n```\n\n# ### **16.2.3 How do I choose\
    \ the number of clusters?**\n\nIn this section, I’ll show you how we can sensibly\
    \ choose the value of *k*, which defines the number of centers, and therefore\
    \ clusters, our model will identify.\n\nThe need for us to choose *k* is often\
    \ cited as a weakness of k-means clustering. This is because"
