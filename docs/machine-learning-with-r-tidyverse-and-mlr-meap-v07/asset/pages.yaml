  md: 'compute distances for as the first argument, and the type of distance we want
    to use. Notice that I''m using our scaled dataset, because hierarchical clustering
    is also sensitive to differences in scale between variables (as is any algorithm
    that relies on distance between continuous variables).


    > If you want a more visual example of what a distance matrix looks like, run
    dist(c(4, 7, 11, 30, 16)). Don''t try to print the distance matrix we create below,
    as it contains > 2.3x10^7 elements!


    Now that we have our distance matrix, we can run the algorithm to learn the hierarchy
    in our data. The first argument to the hclust() function is the distance matrix,
    and the method argument allows us to specify the linkage method we wish to use
    to define the distance between clusters. The options available to us are: "ward.D",
    "ward.D2", "single", "complete", "average", "centroid", and a few less commonly
    used ones I haven''t defined (see ?hclust if you''re interested in these). Notice
    that there seem to be two options for Ward''s method? The option "ward.D2" is
    the correct implementation of Ward''s method, as I described earlier. In this
    example, we''re going to start by using Ward''s method ("ward.D2"), but I''ll
    get you to compare the result of this to other methods as part of this chapter''s
    exercises.


    ```

    gvhdDist <- dist(gvhdScaled, method = "euclidean")

    ```


    So the hclust() function has now learned the hierarchical clustering structure
    of the data, let''s represent this as a dendrogram. We can do this by simply calling
    plot() on our clustering model object, but the tree is a little clearer if we
    first convert our model into a dendrogram object, and plot that. We can convert
    our clustering model into a dendrogram object using the as.dendrogram() function.
    To plot the dendrogram, we simply pass it to the plot() function. By default,
    the plot will draw a label for each case in the original data. As we have such
    a large dataset, let''s suppress these labels using the argument leafLab = "none".


    ```

    gvhdHclust <- hclust(gvhdDist, method = "ward.D2")

    ```


    So the hclust() function has now learned the hierarchical clustering structure
    of the data, let''s represent this as a dendrogram. We can do this by simply calling
    plot() on our clustering model object, but the tree is a little clearer if we
    first convert our model into a dendrogram object, and plot that. We can convert
    our clustering model into a dendrogram object using the as.dendrogram() function.
    To plot the dendrogram, we simply pass it to the plot() function. By default,
    the plot will draw a label for each case in the original data. As we have such
    a large dataset, let''s suppress these labels using the argument leafLab = "none".




    ```

    gvhdDend <- as.dendrogram(gvhdHclust)

    plot(gvhdDend, leafLab = "none")

    ```


    The resulting plot from code listing 17.1 is shown in figure 17.4. The y axis
    here represents the distance between clusters, based on whatever linkage method
    (and distance metric) we used. As we used Ward''s method, the values of this axis
    are the within-cluster sum of squares. When two clusters are merged together,
    they are connected by a horizontal line, the position of which along the y axis
    corresponds to the distance between those clusters. Therefore, clusters of cases
    that merge lower down the tree (which is earlier in agglomerative clustering),
    are more similar to'
