  md: "# Improving decision trees: random forests\nand gradient boosting\n\n![](img/a22105d68c35e8d5bd3c7bafb4644881_196_0.png)\n\
    \n+   **This chapter covers:**\n+   \n+   - What are ensemble methods?\n+   -\
    \ What are bagging, boosting, and stacking, and why are they useful?\n+   - Using\
    \ the random forest and XGBoost algorithms to predict animal classes\n+   - How\
    \ to benchmark multiple algorithms against the same task\n\nIn the last chapter\
    \ I showed you how we can use the recursive partitioning algorithm to train decision\
    \ trees that are very interpretable. We finished by highlighting an important\
    \ limitation of decision trees: they have a tendency to overfit the training set.\
    \ This results in models that generalize poorly to new data. As a result, individual\
    \ decision trees are rarely used, but can become extremely powerful predictors\
    \ when many trees are combined together.\n\nBy the end of this chapter you’ll\
    \ understand the difference between ordinary decision trees and *ensemble methods*,\
    \ such as *random forest* and *gradient boosting*, which combine multiple trees\
    \ to make predictions. Finally, as this is the last chapter in the classification\
    \ part of the book, you’ll learn what *benchmarking* is, and how to use it to\
    \ find the best performing algorithm for a particular problem. Benchmarking is\
    \ the process of letting a bunch of different learning algorithms fight it out\
    \ to select the one that performs the best for a particular problem.\n\nWe will\
    \ continue to work with the zoo dataset we were using in the previous chapter.\
    \ If you no longer have the zooTib, zooTask, and tunedTree objects defined in\
    \ your global environment (run `ls()` to find out), just re-run code listings\
    \ 7.1 to 7.8 from the previous chapter."
