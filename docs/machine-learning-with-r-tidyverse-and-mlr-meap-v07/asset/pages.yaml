- pgno: 447
  md: '# Clustering based on density: DBSCAN and OPTICS


    +   This chapter covers:

    +   • What is density-based clustering?

    +   • How do the DBSCAN and OPTICS algorithms work?


    Our penultimate stop in unsupervised learning techniques brings us to density-based
    clustering. Density-based clustering algorithms aim to achieve the same thing
    as k-means and hierarchical clustering: to partition a dataset into a finite set
    of clusters that reveal a grouping structure in our data.


    In the last two chapters, we saw how k-means and hierarchical clustering identify
    clusters using distance; distance between cases, and distance between cases and
    their centroids. Density-based clustering comprises a set of algorithms that,
    like the name suggests, use the density of cases to assign cluster membership.
    There are multiple ways of measuring density, but we can define it as the number
    of cases per unit volume of our feature space. Areas of the feature space containing
    many cases packed close together, can be said to have high density, whereas areas
    of the feature space that contain few or no cases, can be said to have low density.
    Our intuition here states that distinct clusters in a dataset will be represented
    by regions of high density, separated by regions of low density. Density-based
    clustering algorithms attempt to learn these distinct regions of high density,
    and partition them into clusters. Density-based clustering algorithms have several
    nice properties that circumvent some of the limitations of k-means and hierarchal
    clustering.


    By the end of this chapter, I hope you''ll have a firm understanding of how two
    of the most commonly used density-based clustering algorithms work: DBSCAN, and
    OPTICS. We''ll also apply some of the skills you learned in the previous chapters
    to help us evaluate and compare the performance of different cluster models.'
  merge: -1
  img_proc: true
- pgno: 448
  md: "# ## 18.1 What is density-based clustering?\n\nIn this section, I’ll show you\
    \ how two of the most commonly used density-based clustering algorithms work:\n\
    \n+   - Density-based spatial clustering of applications with noise (DBSCAN)\n\
    +   - Ordering points to identify the clustering structure (OPTICS)\n\nAside from\
    \ having names seemingly contrived to form interesting acronyms, DBSCAN and OPTICS\
    \ both learn regions of high density, separated by regions of low density in a\
    \ dataset. They achieve this in similar, but slightly different ways, but both\
    \ have a few advantages over k-means and hierarchical clustering:\n\n+   - they\
    \ are not biased to finding spherical clusters, and can in fact find clusters\
    \ of varying and complex shapes\n+   - they are not biased to finding clusters\
    \ of equal diameter, and can identify both very wide and very tight clusters in\
    \ the same dataset\n+   - they are seemingly unique among clustering algorithms\
    \ in that cases that do not fall within regions of high enough density are put\
    \ into a separate \"noise\" cluster. This is often a desirable property, because\
    \ it helps to prevent overfitting the data, and allows us to focus on cases for\
    \ which the evidence of cluster membership is stronger\n\n> **TIP**\n> \n> If\
    \ the separation of cases into a noise cluster isn’t desirable for your application\
    \ (but using DBSCAN or OPTICS is), you can use a heuristic method like classifying\
    \ noise points based on their nearest cluster centroid, or adding them to the\
    \ cluster of their k-nearest neighbors.\n\nAll three of these advantages can be\
    \ seen in figure 18.1. The three subplots each show the same data, clustered using\
    \ either DBSCAN, k-means (Hartigan-Wong algorithm), or hierarchical clustering\
    \ (complete linkage). This dataset is certainly strange, and you might think it’s\
    \ unlikely to encounter real-world data like it, but it illustrates the advantages\
    \ of density-based clustering over k-means and hierarchical clustering. The clusters\
    \ in the data have very different shapes (that certainly aren’t spherical) and\
    \ diameters. While k-means and hierarchical clustering learn clusters which bisect\
    \ and merge these real clusters, DBSCAN is able to faithfully find each shape\
    \ as a distinct cluster. Additionally, notice that k-means and hierarchical clustering\
    \ place every single case into a cluster? DBSCAN creates the cluster \"0\" into\
    \ which it places any cases it considers to be noise. In this case, all cases\
    \ outside of those geometrically-shaped clusters are placed into the noise cluster.\
    \ If you look carefully though, you may notice there is a sine wave in the data\
    \ that all three fail to identify as a cluster."
  merge: -1
  img_proc: true
- pgno: 449
  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_449_0.png)


    **Figure 18.1 A challenging clustering problem.** The dataset shown in each facet
    contains clusters of varying shapes and diameters, with cases that could be considered
    noise. The three subplots show the data clustered using DBSCAN, hierarchical clustering
    (complete linkage), and k-means (Hartigan-Wong). Of the three algorithms used,
    only DBSCAN is able to faithfully represent these shapes as distinct clusters.


    So how do density-based clustering algorithms work? Well the DBSCAN algorithm
    is a little easier to understand, so we’ll start with this, then build on this
    to understand OPTICS.


    # ### 18.1.1 How does the DBSCAN algorithm learn?


    In this section I’ll show you how the DBSCAN algorithm learns regions of high
    density in the data, to identify clusters. In order to understand the DBSCAN algorithm,
    you first need to understand its two hyperparameters:


    +   - epsilon (ε)

    +   - minPts


    The algorithm starts by selecting a case in the data, and searching for other
    cases within a search radius. This radius, is the epsilon hyperparameter. So epsilon
    is simply how far away from each case (in an n-dimensional sphere) the algorithm
    will search for other cases around a point. Epsilon is expressed in units of the
    feature space, and so will be Euclidean distance by default. Larger values mean
    the algorithm will search further away from each case.


    The minPts hyperparameter specifies the minimum number of points (cases) that
    a cluster must have, in order for it to be a cluster. The minPts hyperparameter
    is therefore an integer. If a particular case has at least minPts cases inside
    its epsilon radius (including itself), that case is considered a *core point*.


    Let’s walk through the DBSCAN algorithm together, by taking a look at figure 18.2.
    The first step of the algorithm is to select a case at random from the dataset.
    The algorithm searches a n-dimensional sphere (where n is the number of features
    in the dataset) with radius equal to'
  merge: -1
  img_proc: true
- pgno: 450
  md: 'epsilon, for other cases. If this case contains at least minPts cases inside
    its search radius, it is marked as a core point. If the case does not contain
    minPts cases inside its search space, it is not a core point and the algorithm
    moves onto another case.


    Let''s assume the algorithm picks a case and finds that it is a core point. The
    algorithm then visits each of the cases within epsilon of the core point, and
    repeats the same task: looks to see if this case has minPts cases inside its own
    search radius. Two cases within each other’s search radius are said to be directly
    density connected, and reachable from each other. The search continues recursively,
    following all direct density connections from core points. If the algorithm finds
    a case that is reachable to a core point, but does not itself have minPts reachable
    cases, this case is considered a border point. The algorithm only searches the
    search space of core points, not border points.


    Two cases are said to be density connected if they are not necessarily directly
    density connected, but are connected to each other via a chain or series of directly
    density-connected cases. Once the search has been exhausted and none of the visited
    cases have any more direct density connections left to explore, all cases that
    are density connected to each other are placed into the same cluster (including
    border points).


    The algorithm now selects a different case in the dataset, one that it hasn’t
    visited before, and the same process begins again. Once every case in the dataset
    has been visited, any lonesome cases that were neither core points nor border
    points, are added to the noise cluster, and are considered too far from regions
    of high density to confidently be clustered with the rest of the cases.


    > NOTE Not searching outwards from border points helps prevent the inclusion of
    noise events into clusters.


    So DBSCAN finds clusters by finding chains of cases in high-density regions of
    the feature space, and throws out cases occupying sparse regions of the feature
    space.'
