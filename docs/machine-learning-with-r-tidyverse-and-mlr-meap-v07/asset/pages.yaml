    In this section, we''ll cross-validate our model-building process, including hyperparameter
    tuning. We''ve done this a few times already now, but it''s so important that
    I''m going to reiterate it: you must include data-dependent preprocessing in your
    cross-validation. This includes the hyperparameter tuning we performed in section
    7.7.


    First, I define my outer cross-validation strategy. This time I''m using 5-fold
    cross-validation as my outer cross-validation loop. We''ll use the cvForTuning
    resampling description we made in code listing 7.6 for the inner loop.


    Next we create our wrapper by "wrapping together" our learner and hyperparameter
    tuning process. We supply our inner cross-validation strategy, hyperparameter
    space, and search method to the makeTuneWrapper() function.


    Finally, we can start parallelization with the parallelStartSocket() function,
    and start the cross-validation process with the resample() function. The resample()
    function takes our wrapped learner, task, and outer cross-validation strategy
    as arguments.


    > WARNING This takes ~ two minutes on my four-core machine.'
