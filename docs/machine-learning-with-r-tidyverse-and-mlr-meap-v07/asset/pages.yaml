  md: '# 9.2.4 Including imputation and feature selection in our cross-validation


    I’ve said it many times before but I’m going to say it again: include all data-dependent
    preprocessing steps in your cross-validation! But up to this point we’ve only
    needed to consider a single preprocessing step. How do we combine more than one
    together? Well, mlr makes this process extremely simple for us. When we wrap together
    a learner and a preprocessing step, we have essentially created a new learner
    algorithm that includes that preprocessing. So to include an additional preprocessing
    step, we simply wrap the wrapped learner! I’ve illustrated this for our example
    in figure 9.9. This results in a sort of Matryoska doll of wrappers, where one
    is encapsulated by another, which is encapsulated by another etc.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_241_0.png)


    Using this strategy we can combine as many preprocessing steps as we like to create
    a pipeline. The innermost wrapper will always be used first, and then the next
    innermost and so on.


    > **NOTE** As the innermost wrapper is used first, through to the outermost, it’s
    important to think carefully about the order you wish the preprocessing steps
    to take!


    Let’s reinforce this in your mind by actually doing it. We’re going to make an
    impute wrapper, then pass that as the learner to a feature selection wrapper.
    First I redefine our imputation method using the `imputeLearner()` function (we
    first defined this in code listing 9.4). Then I create an imputation wrapper using
    the `makeImputeWrapper()` function, which takes the learner as the first argument.
    I use `list(numeric = imputeMethod)` as the classes argument to apply this imputation
    strategy to all my numeric predictors (all of them, duh).


    Now here comes the neat bit: I create a feature selection wrapper (using'
