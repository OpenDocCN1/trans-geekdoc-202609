- pgno: 46
  md: "# Listing 2.24 Using a `for` loop to iterate a function over a list\n\n```\n\
    ```r\nelementLengths <- vector(\"list\", length = 3)\n\nfor(i in seq_along(listOfNumerics))\
    \ {\n    elementLengths[[i]] <- length(listOfNumerics[[i]])\n}\n\nelementLengths\n\
    \n[[1]]\n[1] 5\n\n[[2]]\n[1] 9\n\n[[3]]\n[1] 20\n```\n```\n\nThis code is difficult\
    \ to read, requires us to predefine an empty vector to prevent the loop from being\
    \ slow, and has a side effect: if you run the loop again, it will overwrite the\
    \ `elementLengths` list.\n\nInstead, we can replace the `for` loop with the `map()`\
    \ function. The first argument of all the map-family functions is the data we’re\
    \ iterating over. The second argument is the function we’re applying to each list\
    \ element. Take a look at figure 2.5, it illustrates how the `map()` function\
    \ applies a function to every element of a list/vector, and returns a list containing\
    \ the outputs.\n\n![](img/a22105d68c35e8d5bd3c7bafb4644881_46_0.png)\n\n**Figure\
    \ 2.5** The `map()` function takes a vector or list as input, applies a function\
    \ to each element individually, and returns a list of the returned values.\n\n\
    In this example, the `map()` function applies the `length()` function to each\
    \ element of the `listOfNumerics` list, and returns these values as a list. Notice\
    \ that the `map()` function also uses the names of the input elements as the names\
    \ of the output elements (a, b, and c)."
