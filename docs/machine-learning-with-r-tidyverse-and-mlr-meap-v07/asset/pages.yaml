- pgno: 218
  md: '# 9.1 What is linear regression?


    In this section, you’ll learn what linear regression is and how it uses the equation
    of a straight line to make predictions. Imagine you want to predict the pH of
    batches of cider, based on the amount of apple used to make each batch (in kilograms).
    An example of what this relationship might look like is shown in figure 9.1.


    > **NOTE** Recall from high school chemistry that the lower the pH, the more acidic
    a substance is.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_218_0.png)


    **Figure 9.1 Imaginary data of how the pH of cider batches changes with apple
    content.**


    The relationship between apple weight and cider pH appears linear, and we could
    model this relationship using a straight line. Recall from chapter 1 that the
    only parameters needed to describe a straight line are the slope and intercept:


    $y = \mathit{intercept} + \mathit{slope} \times x$


    where y is the outcome variable, x is the predictor variable, the intercept is
    the value of y when x is zero (where the line crosses the y axis), and the slope
    is **how much y changes when x increases by one unit.**


    > **NOTE** Interpreting the slope is useful as it tell us about how the outcome
    variable changes with the predictor(s), but interpreting the intercept is usually
    not so straight forward (or useful). For example, a model that predicts a spring’s
    tension from its length might have a positive intercept, suggesting that a spring
    of zero length has tension! If all the variables are centered to have a mean of
    zero, then the intercept can be interpreted as the value of y at the mean of x
    (which is often more useful information). Centering your variables like this doesn’t
    affect the slopes because the relationships between variables remain the same.
    Therefore, predictions made by linear regression models are unaffected by centering
    and scaling your data.'
  merge: -1
  img_proc: true
