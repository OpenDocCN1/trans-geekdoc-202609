- pgno: 507
  md: '# 20.1.6 Feature engineering and feature selection help make the most of the
    available information


    Feature engineering is the practice of extracting useful/predictive information
    from existing variables, that is currently in a less useful format. For example,
    this could be extracting gender from transcribed medical notes, or it could be
    combining various financial metrics to create an index of market stability. Feature
    engineering usually requires some domain knowledge and some thought about what
    features are likely to impact the outcome variable. We first discovered feature
    engineering in chapter 4, and used it again in chapter 10.


    Feature selection, on the other hand, is concerned with removing variables that
    contribute no or little predictive information to the model. In doing so, we can
    protect ourselves from both overfitting, and the curse of dimensionality. We learned
    in chapter 9 that feature selection can be done in two different ways: filter
    methods and wrapper methods.


    Filter methods are computationally less expensive, but are less likely to result
    in an optimal selection of features. Filter methods rely on calculating some metric
    of the relationship between each feature, and the outcome variable. This metric
    could simply be the correlation between each feature and the outcome, for example.
    We can then simply skim off a specific number or proportion of features that have
    a weaker relationship with the outcome.


    Wrapper methods are more computationally expensive, but are more likely to result
    in a better-fitting model. Wrapper methods consist of iteratively fitting and
    evaluating models with different permutations of the predictor variables. The
    combination of variables that gave the best-performing model is chosen.


    Feature engineering and selection are extremely important, arguably more important
    that your choice of algorithm. You can use the most cutting-edge, high-performing
    algorithm ever developed, but if your features are not making the most of the
    predictive information they contain, or there are many irrelevant variables in
    the data, your model won''t perform as well as it should.


    If your feature engineering/selection processes are data-dependent, it''s important
    you include them in your cross-validation.'
  merge: -1
  img_proc: true
- pgno: 508
  md: 'The performance of most supervised machine learning algorithms can be improved
    by combining them with an ensemble technique. Ensembling is where instead of training
    a single model, we train multiple models that help us reduce over-fitting an improve
    accuracy of predictions. There are three types of ensemble techniques:


    +   - bagging

    +   - boosting

    +   - stacking


    We learned about ensemble techniques for classification and regression in chapters
    8 and 12, respectively.


    Bagging (also called bootstrap aggregating) consists of creating multiple bootstrap
    samples from the original dataset, and training a model on each sample in parallel.
    New data is then passed to each individual model, and the modal or mean prediction
    is returned (for classification and regression problems, respectively). Bagging
    helps us to avoid overfitting, and so can reduce the variance of our models. Bagging
    can be used for virtually any supervised learning algorithm (and some clustering
    algorithms), but its most famous implementation is in the Random Forest algorithm,
    which uses classification/regression trees.


    While bagging trains models in parallel, boosting trains models sequentially,
    where each subsequent model seeks to improve on the mistakes of the existing chain
    of models. In adaptive boosting, cases that are incorrectly classified by the
    existing ensemble of models are weighted more heavily, such that they are more
    likely to be sampled in the next iteration. AdaBoost is the only well-known implementation
    of adaptive boosting. In gradient boosting, the residual error of the existing
    ensemble is minimized by each additional model. XGBoost is a famous implementation
    of gradient boosting that uses classification/regression trees, but just like
    bagging, boosting can be used with any supervised learning algorithm.


    In stacking, we create base models that are good at learning different patterns
    in the feature space. One model may then be good at predicting in one area of
    the feature space, but make mistakes in another area. One of the other models
    may do a good job at predicting values in an area of the feature space, where
    the others do poorly. Predictions made by the base models are used as predictor
    variables (along with all the original predictors) by a final stacked model. This
    stacked model is then able to learn from the predictions made by the base models
    to make more accurate predictions of its own.'
  merge: -1
  img_proc: true
- pgno: 509
  md: '# # 20.1.8 Regularization prevents overfitting by penalizing the model parameters


    Regularization describes a set of techniques for limiting the magnitude of model
    parameters to prevent overfitting. Regularization is particularly important for
    guarding against overfitting due to the inclusion of predictors with little or
    no predictive value. We learned in chapter 11 that the two most common forms of
    regularization are L2 and L1 regularization.


    In L2 regularization, the loss function of the model has a penalty added to it,
    which is the L2 norm of the model parameters, weighted by a tunable hyperparameter,
    lambda. The L2 norm of the model parameters is the sum of squared parameter values.
    The effect of L2 regularization is that model parameters can be shrunk towards
    zero (but never zero unless the OLS estimate is zero), with weaker predictors
    being penalized more greatly. Ridge regression is an example of L2 regularization
    being used to prevent overfitting in linear regression.


    In L1 regularization, we add the L1 norm to the loss function, weighted by lambda.
    The L1 norm is the sum of the absolute parameter values. The effect of L1 regularization
    is that model parameters can be shrunk to zero, effectively removing them from
    the model. L2 regularization is therefore a form of automatic feature selection.
    LASSO is an example of L1 regularization being used to prevent overfitting in
    linear regression.


    # ## 20.2 Where can you go from here?


    You might now be wondering what your next steps are in your machine learning education.
    That really is up to you and what you want to achieve, but in this section I’ll
    point you in the direction of some excellent resources you can use to further
    develop your knowledge and skills. I’m a firm believer though that the best way
    to solidify new knowledge, is to use it, so use the techniques and algorithms
    you learned throughout this book in your work, and teach them to your colleagues!


    # ### 20.2.1 Deep learning


    As I mentioned near the start of the book, I omitted deep learning (machine learning
    using artificial neural networks) because I felt it deserves a book of its own.
    But no machine learning education could be considered comprehensive without learning
    about this extraordinary field. Neural networks are powerful tools for any machine
    learning task, but if your work will revolve around computer vision, the classification
    of images/video, or building models on other complex data such as audio files,
    deep learning is a vital avenue for you to learn about. For R, I cannot recommend
    more highly *Deep Learning with R*, by Francois Chollet and Joseph J. Allaire
    (Manning, 2018). This book is easily digestible by non-specialists, and will actually
    reinforce some of the basic machine learning concepts we have already covered
    here.'
