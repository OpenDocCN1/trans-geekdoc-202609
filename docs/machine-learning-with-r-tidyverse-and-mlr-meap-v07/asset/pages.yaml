  md: 'In this section, I''ll summarize the general machine learning concepts we covered
    throughout the book, referencing the relevant sections of the book as we go. These
    concepts include:


    +   - Types of machine learning algorithms

    +   - The bias-variance trade-off

    +   - Model validation

    +   - Hyperparameter tuning

    +   - Missing value imputation

    +   - Feature engineering and feature selection

    +   - Ensemble techniques

    +   - Regularization


    My hope is that now you''ve completed the book, these concepts will fit more concretely
    into your bigger picture of machine learning.




    Machine learning tasks can be divided into supervised and unsupervised tasks,
    based on whether the algorithm has access to labeled data. In other words, whether
    we have access to the ground truth when training the model, or not.


    Algorithms that learn patterns in the data that can be used to predict the ground
    truth are said to be supervised. Supervised machine learning algorithms can be
    further split, based on the kind of output variable they predict. Supervised learning
    algorithms that predict categorical variables (or classes) are said to be classification
    algorithms, while those that predict continuous variables are said to be regression
    algorithms.


    > NOTE Some algorithms, like k-nearest neighbors, random forest, and XGBoost can
    be used for both classification and regression.


    Unsupervised algorithms learn patterns in the data, without any form of ground
    truth. We can split these algorithms up based on what their purpose is. Unsupervised
    learning algorithms that can compress the information in a high-dimensional dataset
    into a lower dimensional representation are called dimension reduction algorithms.
    Unsupervised learning algorithms that find groups of cases that are more similar
    to each other than cases in other clusters, are called clustering algorithms.


    We first encountered these definitions in section 1.2, all the way back in chapter
    1. I''ve reproduced figure 1.5 here in figure 20.1, that summarizes the differences
    between supervised and unsupervised learning.'
  merge: -1
  img_proc: true
- pgno: 500
  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_500_0.png)


    > Although I didn’t mention this back in chapter 1, not all unsupervised algorithms
    can make predictions on new data. For example, hierarchical clustering and t-SNE
    models are unable to make predictions on new data.


    There is an approach part-way between supervised and unsupervised machine learning
    called semi-supervised learning. Semi-supervised learning is an approach, rather
    than a type of algorithm, and is useful when we have access to partially-labeled
    data. If we expertly label as many of the cases in a dataset as is feasibly possible,
    then we can build a supervised model using only these labeled data. We use this
    model to predict the labels of the rest of the dataset. Now, we combine the data
    with the manual labels and pseudo-labels, and use this to train a new model.


    Figure 20.1 Supervised vs. unsupervised machine learning. Supervised algorithms
    take data already labeled with a ground-truth, and build a model which can predict
    the labels of unlabeled, new data. Unsupervised algorithms take unlabeled data
    and learn patterns within it, such that new data can be mapped onto these patterns.'
  merge: -1
  img_proc: true
- pgno: 501
  md: 'Figure 20.2 shows all the machine learning algorithms we used throughout this
    book, partitioning them into supervised and unsupervised, and also classification,
    regression, dimension reduction, and clustering. My hope is that you can refer
    to this when deciding which algorithms are most suitable for the task at hand,
    and that you will add to the algorithms listed here as your knowledge grows.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_501_0.png)


    Figure 20.2 Summary of the algorithms we covered in the book, and whether they
    are supervised or unsupervised learners, and whether they can be used for classification,
    regression, dimension reduction, or clustering.




    When training a predictive model, it’s important to evaluate how it will perform
    in the real-World. When evaluating the performance of our models, we should never
    evaluate them using the data we used to train them. This is because models will
    almost always perform better when making predictions on the data used to train
    them, than when making predictions on unseen data.


    In chapter 3, we learned that an important concept to understand when evaluating
    model performance is the bias-variance trade-off. As the complexity of a model
    increases, and the more closely it fits the training set, the more variable its
    predictions will be on unseen data. Models that are too simple and don’t capture
    the relationships in the data well are biased towards making consistently poor
    predictions. As we increase the complexity of our model, its variance will increase
    and its bias will decrease, while the inverse is also true.'
  merge: -1
  img_proc: true
- pgno: 502
  md: 'The bias-variance trade-off therefore describes the balance between overfitting
    (training a model that fits the noise of the training set) and underfitting (training
    a model that poorly fits the training set). Somewhere between a model that overfits
    and a model that underfits, is an optimally-fitting model whose predictions generalize
    well to unseen data. The way to tell if we are underfitting overfitting is using
    cross-validation. Though even just passing the training set back through the model
    will tell you if you’re underfitting, because the model will perform poorly.


    # ## 20.1.3 Using model validation to identify over/underfitting


    To evaluate how well a model will make predictions on new data, we need to pass
    new, unseen data through the model and see how closely its predictions match the
    ground-truth. One way of doing this would be to train the model on the data at
    hand, then as new data is generated, pass this through the model to evaluate its
    predictions. This process could make the model-building process take years and
    so a more realistic approach is to split the data into training and test sets.
    In this way, the model is trained using the training set and is given the test
    set to make predictions on. This process is called cross-validation, and we learned
    about it in chapter 3.


    There are multiple ways of splitting the dataset into training and test sets.
    Hold-out cross-validation is the simplest, where a proportion of cases in the
    dataset are "held-out" as the test set, and the model is trained on the remaining
    cases. As the split is usually random, the outcome from hold-out cross-validation
    depends heavily on the proportion of cases held-out in the test set, and on the
    cases that made it into the test set. As such, hold-out cross-validation can give
    quite variable results when run multiple times, though it is the least computationally
    expensive method. I’ve reproduced figure 3.12 here in figure 20.3, that shows
    a schematic illustrating hold-out cross-validation.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_502_0.png)


    +   1. The data are randomly split into a training and test set

    +   2. A model is trained using only the training set

    +   3. Predictions are made on the test set

    +   4. The predictions are compared to the true values


    **Figure 20.3 Hold-out cross-validation (CV).** The data is randomly split into
    a training set and test set. The training set is used to train the model, which
    is then used to make predictions on the test set. The similarity of the predictions
    to the true values of the test set is used to evaluate model performance.


    k-fold cross-validation randomly partitions the cases into k, near-equally-sized
    folds. For each fold, the cases inside the fold are used as the test set, while
    the remaining data are used as the training set. The mean performance metric of
    each fold is then returned. The advantage of k-fold'
