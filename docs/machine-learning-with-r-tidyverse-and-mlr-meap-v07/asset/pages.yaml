  md: "# Clustering by finding centers: *k-means*\n\n# 16\n\n+   ***This chapter covers:***\n\
    +   \n+   - Why do we need clustering?\n+   - What do over and under-fitting look\
    \ like for clustering?\n+   - What is k-means clustering?\n+   - How can we validate\
    \ the performance of a clustering algorithm?\n\nOur first stop in clustering brings\
    \ us to a very commonly used technique: *k-means clustering*.\n\nI’ve used the\
    \ word \"technique\" here rather than \"algorithm\", because k-means describes\
    \ a particular *approach* to clustering, that multiple algorithms follow. I’ll\
    \ talk about these individual algorithms later in the chapter.\n\n> > **IMPORTANT**\
    \ Don’t confuse k-means with k-nearest neighbors! k-means is for unsupervised\
    \ learning, whereas k-nearest neighbors is a supervised algorithm for classification.\n\
    \nK-means clustering attempts to learn a grouping structure in a dataset. The\
    \ k-means approach starts with us defining how many clusters we believe there\
    \ are in the dataset. This is what the *k* stands for; if we set *k* to three,\
    \ we will identify three clusters (whether these represent a real grouping structure\
    \ or not). Arguably, this is a weakness for k-means, as we may not have any prior\
    \ knowledge as to how many clusters to search for, but I’ll show you ways of selecting\
    \ a sensible value of *k*.\n\nOnce we have defined how many clusters, *k*, we\
    \ want to search for, k-means will initialize (usually randomly) *k* centers or\
    \ *centroids* in the dataset. Each centroid may not be an actual case from the\
    \ data, but has a random value for every variable in the data. Each of these centroids"
  merge: -1
  img_proc: true
- pgno: 397
  md: 'represents a cluster, and cases are assigned to the cluster of the centroid
    closest to them. Iteratively, the centroids move around the feature space in a
    way that attempts to minimize the variance of the data within each cluster, but
    maximizes the separation of different clusters. At each iteration, cases are assigned
    the cluster of the centroid that is closest to them.


    # 16.1 What is k-means clustering?


    In this section, I''ll show you how the general procedure for k-means clustering
    works, and then explain the various algorithms that implement it, and how they
    differ. k-means algorithms partition cases in a dataset into k clusters, where
    k is an integer defined by us. The clusters returned by k-means algorithms tend
    to be n-dimensionally spherical (where "n" is the number of dimensions of the
    feature space). This means the clusters tend to form a circle in two dimensions,
    a sphere in three dimensions, and a hypersphere in more than three dimensions.
    k-means clusters also tend to have a similar diameter. These are traits which
    may not be true of the underlying structure in the data.


    +   - Lloyd''s algorithm (also called Lloyd-Forgy''s algorithm)

    +   - MacQueen''s algorithm

    +   - Hartigan-Wong algorithm


    Lloyd''s, MacQueen''s, and the Hartigan-Wong algorithm are conceptually quite
    similar, but have some differences that affect both their computational cost,
    and their performance on a particular problem. Let''s go through each algorithm
    to explain how it works.


    # 16.1.1 How does Lloyd''s algorithm work?


    In this section I''ll show you the easiest of these three alorithms to understand:
    Lloyd''s algorithm. Imagine you''re a sports scientist, interested in the biophysical
    differences among runners. You measure the resting heart rate and maximum oxygen
    consumption of a cohort of runners, and want to use k-means to identify clusters
    of runners that might benefit from different training regimen.


    Let''s say you have prior reason to believe there may be three distinct clusters
    of athletes in the dataset. The first step in Lloyd''s algorithm is to randomly
    initialize k (three in this case) centroids in the data (see figure 16.1). Next,
    the distance between each case and each centroid is calculated. This distance
    is commonly Euclidean distance (straight line distance), but can be other distance
    metrics, such as Manhattan distance (taxi cab distance).'
  merge: -1
  img_proc: true
- pgno: 398
  md: "> **NOTE**\n> \n> As k-means relies on a distance metric, it’s important to\
    \ scale variables if they are measured on different scales, otherwise variables\
    \ on larger scales will disproportionately influence the result.\n\nEach case\
    \ is assigned to the cluster represented by its nearest centroid. In this way,\
    \ each centroid serves as a *prototype* case for its cluster. Next, the centroids\
    \ are moved, such that they are now placed at the mean of the cases that were\
    \ assigned to their cluster in the previous step (this is why the approach is\
    \ called k-means).\n\nThe process now repeats itself: the distance between each\
    \ case and each centroid is calculated, and cases are assigned to the cluster\
    \ of the nearest centroid. Can you see that, as the centroids update and move\
    \ around the feature space, the nearest centroid to a particular case may change\
    \ over time? This process continues until no cases change clusters from one iteration\
    \ to the next, or until a maximum number of iterations is reached. Notice that\
    \ between iteration four and five in figure 16.1, no cases change clusters, and\
    \ so the algorithm stops.\n\n> **NOTE**\n> \n> As the initial centers are usually\
    \ randomly selected, it’s important that we repeat the procedure several times,\
    \ with new random initial centers each time. We can then use the centers that\
    \ start with the lowest within-cluster sum of squared error.\n\nSo to summarize\
    \ the steps of Lloyd’s algorithm:\n\n+   1. Select *k*\n+   2. Randomly initialize\
    \ *k* centers in the feature space\n+   3. For each case:\n+      A. Calculate\
    \ the distance between the case and each center\n+      B. Assign the case to\
    \ the cluster of the nearest centroid\n+   4. Place each center at the mean of\
    \ the cases assigned to its cluster\n+   5. Repeat steps 3 and 4 until no cases\
    \ change clusters or a maximum number of iterations is reached\n\nTake a look\
    \ at figure 16.1. Can you see how at each iteration, the positions of the centroids\
    \ are updated (the arrows) such that they move towards the center of genuine clusters?\
    \ At each iteration, we can partition the feature space into polygonal (or polytopal\
    \ in more than two dimensions) regions around each centroid that show us the regions\
    \ that \"belong\" to a particular cluster. These regions are called *Voronoi cells*,\
    \ and if a case falls inside one of them, this means the case is closest to that\
    \ cell’s centroid, and will be assigned to its cluster. Visualizing Voronoi cells\
    \ on a plot (sometimes called a *Voronoi map*) is a useful way of visualizing\
    \ how a clustering algorithm has partitioned-up the feature space."
  merge: -1
  img_proc: true
- pgno: 399
  md: "![](img/a22105d68c35e8d5bd3c7bafb4644881_399_0.png)\n\nFigure 16.1 Five iterations\
    \ of k-means clustering. In the top-left plot, three initial centers are randomly\
    \ generated in the feature space (crosses). Cases are assigned to the cluster\
    \ of their nearest center. At each iteration, each center moves to the mean of\
    \ the cases in its cluster (indicated by arrows). The feature space can be partitioned\
    \ up into Voronoi cells, indicated by the shaded regions, that show regions of\
    \ the feature space closest to a particular centroid.\n\n# ## 16.1.2 How does\
    \ MacQueen’s algorithm work?\n\nMacQueen’s algorithm is extremely similar to Lloyd’s\
    \ algorithm, varying just subtly in when the centroids get updated. Lloyd’s algorithm\
    \ is called a *batch* or *offline* algorithm, meaning that it updates the centroids\
    \ together at the end of an iteration. MacQueen’s algorithm, on the other hand,\
    \ updates the centroids each time a case changes clusters, and once the algorithm\
    \ has passed through all the cases in the data.\n\n> > **NOTE**  \n> > Whereas\
    \ Lloyd’s algorithm is said to be a batch or offline algorithm, MacQueen’s is\
    \ said to be an *incremental* or *online* algorithm, because it updates the centroids\
    \ each time a case moves clusters, rather than after a pass through all the data.\n\
    \nJust like with Lloyd’s algorithm, MacQueen’s algorithm initializes *k* centers,\
    \ and assigns each case to the cluster of the nearest centroid, and updates the\
    \ position of the centroids to match the mean of its nearest cases. Then, the\
    \ algorithm considers each case in turn, and calculates its distance to each centroid.\
    \ If the case changes cluster (because it’s now closer to a different centroid),\
    \ both the new and old centroid positions are updated. The algorithm continues\
    \ through"
  merge: -1
  img_proc: true
- pgno: 400
  md: 'the dataset, considering each case in turn. Once all cases have been considered,
    centroid positions are updated again, and if no cases change cluster, the algorithm
    stops, otherwise it will perform another pass.


    A benefit of MacQueen’s algorithm over Lloyd’s algorithm, is that it tends to
    converge more quickly to an optimal solution, although it may be slightly more
    computationally expensive for very large datasets.


    So to summarize the steps of MacQueen’s algorithm:


    +   1. Select *k*

    +   2. Randomly initialize *k* centers in the feature space

    +   3. Assign each case to the cluster of its nearest center

    +   4. Place each center at the mean of the cases assigned to its cluster

    +   5. For each case:

    +      A. Calculate the distance between the case and each centroid

    +      B. Assign the case to the cluster of the nearest centroid

    +      C. If the case changed clusters, update the position of the new and old
    centroids

    +   6. Once all cases have been considered, update all centroids

    +   7. If no cases change clusters, stop, otherwise repeat step 5


    # 16.1.3 Hartigan-Wong algorithm


    The third k-means algorithm I’ll show you is the Hartigan-Wong algorithm, which
    is a little different from Lloyd’s and MacQueen’s algorithms. Hartigan-Wong starts
    by initializing *k* random centers and assigning each case to the cluster of its
    nearest center, just like we saw in the other two algorithms. Here’s the different
    bit: for each case in the dataset, the algorithm calculates the sum of squared
    error of that case’s current cluster *if that case were removed*, and each of
    the other clusters *if that case were included in those clusters*. Recall from
    previous chapters that the sum of squared error (or simply, the sum of squares)
    is the difference between each case’s values, and it’s predicted values (in this
    context, its centroid), squared, and summed across all the cases. If you prefer
    this in mathematical notation, have a look at equation 16.1.


    # EQUATION 16.1


    $$SS = \sum_{i \in k}(x_i - c_k)^2$$


    where *i*  *k* is the *i*th case belonging to cluster *k*, and *cₖ* is the centroid
    of cluster *k*.


    The cluster with the smallest sum of squared error (when including the case currently
    under'
  merge: -1
  img_proc: true
- pgno: 401
  md: 'consideration), is assigned as the cluster for that case. If a case changed
    clusters, then the centroids of the old and new clusters are updated to the mean
    of the cases in their cluster. The algorithm continues until no cases change cluster.
    A result of this is that a case could be assigned to a particular cluster (because
    it reduces the sum of squared error), even though it is closer to the centroid
    of another cluster.


    So to summarize the steps of Hartigan_Lloyd’s algorithm:


    +   1. Select *k*

    +   2. Randomly initialize *k* centers in the feature space

    +   3. Assign each case to the cluster of its nearest center

    +   4. Place each center at the mean of the cases assigned to its cluster

    +   5. For each case:

    +      A. Calculate the sum of squared error for its cluster, omitting the case
    under consideration

    +      B. Calculate the sum of squared error for the other clusters, as if that
    case were included

    +      C. Assign the case to the cluster with the smallest sum of squared error

    +      D. If the case changed clusters, update the position of the new and old
    centroids

    +   6. If no cases change clusters, stop, otherwise repeat step 5


    The Hartigan-Wong algorithm *tends* to find a better clustering structure than
    either Lloyd’s or MacQueen’s algorithm, although we are always subject to the
    no free lunch theorem. The Hartigan-Wong algorithm is also more computationally
    expensive than the other two algorithms, so will be considerably slower for large
    datasets.


    So which algorithm do we choose? Well the choice of algorithm is a discrete hyperparameter,
    and so we can use hyperparameter tuning to help us choose the best-performing
    method, and make sure we don’t make the Wong choice!


    # 16.2 Building our first *k*-means model


