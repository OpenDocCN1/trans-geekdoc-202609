- pgno: 181
  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_181_0.png)


    Figure 7.4 How splitting is performed for continuous predictors. Cases belonging
    to three classes are plotted against two continuous variables. The first node
    splits the feature space into rectangles based on the value of variable 2. The
    second node further splits the variable 2 20 feature space into rectangles based
    on the value of variable 1.


    > Notice that the variables are on vastly different scales. The rpart algorithm
    isn''t sensitive to variables being on different scales, so there''s no need to
    scale and center your predictors!


    But how is the exact split point chosen for a continuous predictor? Well the cases
    in the training set are arranged in order of the continuous variable, and the
    Gini gain is evaluated for the mid-point between each adjacent pair of cases.
    If the greatest Gini gain amongst all predictor variables is one of these mid-points,
    then this is chosen as the split for that node. This is illustrated in figure
    7.5.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_181_1.png)


    Figure 7.5 How the split point is chosen for continuous predictors. Cases (circles)
    are arranged in order of their value of the continuous predictor. The mid-point
    between each adjacent pair of cases is considered as a candidate split, and the
    Gini gain is calculated for each. If one of these splits has the highest Gini
    gain of any candidate split, it will be used to split the tree at this node.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'A similar procedure is used for categorical predictors with more than two levels.
    First, the Gini index is computed for each level of the predictor (using the proportion
    of each class that has that value of the predictor). The factor levels are arranged
    in order of their Gini indices, and the Gini gain is evaluated for a split between
    each adjacent pair of levels. Take a look at the example in figure 7.6. We have
    a factor with three levels (A, B, and C), we evaluate the Gini index of each and
    find their values are such that B < A < C for their Gini indices. Now, we evaluate
    the Gini gain for the splits B versus A & C, and C versus B & A.


    In this way, we can create a binary split from categorical variables with many
    predictors, without having to try every single possible combination of level splits
    (2^(m−1) where m is the number of levels of the variable). If the split B versus
    A & C is found to have the greatest Gini gain, then cases reaching this node will
    go down one branch if they have a value of B for this variable, and will go down
    the other branch if they have a value of A or C.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_182_0.png)


    **Figure 7.6 How the split point is chosen for categorical predictors.** The Gini
    index of each factor level is calculated using the proportion of cases from each
    class with that factor level. The factor levels are arranged in order of their
    Gini indices and the Gini gain is evaluated for each split between adjacent levels.


    # 7.1.3 Hyperparameters of the rpart algorithm


    In this section I’ll show you what hyperparameters need to be tuned for the rpart
    algorithm, what they do, and why we need to tune them in order to get the best
    performing tree possible.


    Decision tree algorithms are described as *greedy*. By greedy, I don’t mean they
    take an extra helping at the buffet line; I mean that they search for the split
    that will perform best *at the current node*, rather than the one that will produce
    the best result globally. For example, a particular split might discriminate the
    classes best at the current node, but result in poor'
