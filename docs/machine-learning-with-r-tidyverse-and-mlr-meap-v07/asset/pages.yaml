- pgno: 224
  md: "additive (rather than multiplicative).\n\nWhen these assumptions are valid\
    \ then our model will make more accurate and unbiased predictions. However, the\
    \ general linear model can be extended to handle situations in which the assumption\
    \ of normally-distributed residuals is violated (logistic regression is one such\
    \ example).\n\n> **NOTE**  \n> I’ll show you how we can check the validity of\
    \ these assumptions when we build our own linear regression model, later in the\
    \ chapter.\n\nIn situations such as this we turn to the *generalized linear model*.\
    \ The generalized linear model is the same as the general linear model (in fact,\
    \ the latter is a special case of the former), except that it uses various transformations\
    \ called *link functions* to map the outcome variable to the linear predictions\
    \ made by the right hand side of the equals sign. For example, count data is rarely\
    \ normally distributed, but by building a generalized model with an appropriate\
    \ link function, we can transform linear predictions made by the model back into\
    \ counts. I don’t intend to talk any further about generalized linear models here,\
    \ but a good resource on this topic (if a little heavy) is *Generalized Linear\
    \ Models With Examples in R* by Peter K. Dunn and Gordon K. Smyth (Springer, 2018).\n\
    \n> **TIP**  \n> If the residuals are heteroscedastic, it sometimes helps to build\
    \ a model that predicts some transformation of the outcome variable instead. For\
    \ example, predicting the log₁₀ of the response variable is a common choice.\n\
    > \n> Predictions made by such a model can then be transformed back onto the original\
    \ scale for interpretation. When the *effect* of *multiple predictors* on the\
    \ outcome is not additive, we can add *interaction* terms to our model, that state\
    \ how the effect of one predictor variable has on the outcome, when the other\
    \ predictor variable changes.\n\n# 9.1.2 What if my predictors are categorical?\n\
    \nSo far we’ve only considered the situation where our predictors are continuous.\
    \ As the general linear model is essentially the equation of a straight line and\
    \ we use it to find the slopes between variables, how can we find the slope of\
    \ a categorical variable? Does this even make sense? Well it turns out we can\
    \ cheat by recoding categorical variables into *dummy variables*. Dummy variables\
    \ are new representations of categorical variables, that map the categories to\
    \ zero and one.\n\nImagine you want to predict the acidity of cider batches based\
    \ on the type of apple: Gala, or Braeburn. We want to find the intercept and slope\
    \ that describes the relationship between these two apple types, and acidity,\
    \ but how do we do that? Remember earlier that the slope is how"
