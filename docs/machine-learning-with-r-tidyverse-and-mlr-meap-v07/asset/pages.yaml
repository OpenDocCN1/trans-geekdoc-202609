  md: 'where *k* is the number of predictor variables in your dataset and the … represents
    all the variables in between.


    > **TIP**  Remember in Chapter 1 when I explained the difference between parameters
    and hyperparameters? Well, β₀, β₁, etc. are model parameters, because they are
    learned by the algorithm from the data.


    The whole procedure for classifying new paintings is summarized in figure 4.8.
    First, we convert the copper values of our new data into their log odds (or logits)
    by using the linear model learned by the algorithm. Next, we convert the log odds
    into their probabilities using the logistic function. Finally, if the probability
    is > 0.5, we classify the painting as an original and if its probability is <
    0.5, we classify it as a forgery.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_101_0.png)


    | Painting | Copper | Lead | Log odds | p | Class |

    |---|---:|---:|---:|---:|---|

    | 1 | 13.3 | 2.95 | -1.83 | 0.14 | Forgery |

    | 2 | 21.2 | 12.5 | 6.72 | 0.99 | Original |

    | 3 | 2.5 | 1.2 | -9.33 | 9×10⁻⁵ | Forgery |


    **Figure 4.8 The process of classifying new paintings.** The predictor variable
    values of three paintings are converted into log odds based on the learned model
    parameters (intercept and slopes). The log odds are converted into probabilities
    (*p*), and if *p* > 0.5, the case is classified as the “positive” class.


    > **NOTE**  Although the first and third paintings in figure 4.8 were both classified
    as forgeries, they had very different probabilities. As the probability of the
    third painting is much smaller than the probability of the first, we can be more
    confident that painting three is a forgery, than we are confident that painting
    one is a forgery.


    # ### 4.1.2 What if I have more than two classes?


    The scenario above is an example of binomial logistic regression. In other words,
    the decision of which class to assign new data can take on only one of two named
    categories ("bi" and "nomos" from latin and greek, respectively). But we can use
    a variant of logistic regression to predict one of multiple classes. This is called
    multinomial logistic regression, because there are now multiple possible categories
    to choose from.'
