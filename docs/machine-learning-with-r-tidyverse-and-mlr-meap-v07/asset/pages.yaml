- pgno: 354
  md: 'Firstly, it’s considerably faster than t-SNE, where the length of time it takes
    to run increases less than the square of the number of cases in the dataset. To
    put this in perspective, a dataset that might take t-SNE hours to compress, will
    take UMAP minutes.


    The second benefit (and the main benefit in my eyes) is that UMAP is a deterministic
    algorithm. In other words, given the same input, it will always give the same
    output. This means that, unlike t-SNE, we can project new data onto the lower-dimensional
    representation, allowing us to incorporate UMAP into our machine learning pipelines.


    The third benefit is that UMAP preserves both local *and* global structure. Practically,
    this means that not only can we interpret two cases close to each other in lower
    dimensions as being similar to each other in high dimensions, we can also interpret
    two *clusters* of cases close to each other as being more similar to each other
    in high dimensions.


    So how does UMAP work? Well UMAP assumes the data is distributed along a *manifold*.
    A manifold is a n-dimensional smooth geometric shape where, for every point on
    this manifold there exists a small neighborhood around that point that looks like
    a flat, two-dimensional plane. If that doesn’t make sense to you, consider that
    the world is a three-dimensional manifold, any part of which can be mapped into
    a flat representation, literally called a map. So UMAP searches for a surface,
    or higher-dimensional space that the data are distributed along. The distances
    between cases *along the manifold* can then be calculated, and a lower-dimensional
    representation of the data can be optimized iteratively to reproduce these distances.


    Prefer a visual representation? Me too. Have a look at figure 14.8. I’ve drawn
    a question mark as a manifold, and randomly seeded 15 cases around the manifold
    across two variables. UMAP’s job is to learn the question mark manifold, so that
    it can measure the distances between cases along the manifold, instead of ordinary
    Euclidean distance, like t-SNE does. It achieves this by searching a region around
    each case, for another case. Where these regions encapsulate another case, the
    cases get connected by an edge. This is what I’ve done in the top row of figure
    14.8, but can you see that the manifold is incomplete? There are gaps in my question
    mark. This is because the regions we searched around each case had the same radius,
    and the data wasn’t uniformly distributed along the manifold. If the cases we
    spaced out along the question mark at regular intervals, then this approach would
    have worked provided I selected an appropriate radius for the search regions.


    Real-world data are rarely evenly distributed, and so UMAP solves this problem
    in two ways. Firstly, it expands out each search region for each case until it
    meets its nearest neighbor. This ensures that there are no orphan cases: while
    there can be multiple, disconnected manifolds in a dataset, every case must connect
    to at least one other case. Secondly, UMAP creates an additional search region
    which has a larger radius in low-density areas, and a smaller radius in high-density
    regions. These search regions are described as "fuzzy", in that the further from
    the center another case finds itself, the lower the probability that an edge exists
    between those cases.'
  merge: -1
  img_proc: true
- pgno: 355
  md: 'This forces an artificial uniform distribution of the cases (and is where the
    "uniform" in UMAP comes from). This process is represented in the lower row of
    figure 14.8; notice that we now get a more complete estimation of the underlying
    manifold.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_355_0.png)


    Figure 14.8 How UMAP learns a manifold. UMAP expands a search region around each
    case. A naive form of this is shown in the top row, where the radius of each search
    region is the same. When cases with overlapping search regions are connected by
    edges, there are gaps in the manifold. In the bottom row, the search region extends
    to the nearest neighbor, then extends outward in a fuzzy way, with a radius inversely
    related to the density of data in that region. This results in a complete manifold.


    The next step is to place the data onto a new manifold in (usually) two new dimensions.
    Then the algorithm iteratively shuffles this new manifold around until the distances
    between the cases along the manifold, look like the distances between the cases
    along the original, high-dimensional manifold. This is similar to the optimization
    step of t-SNE, except that UMAP minimizes a different loss function called cross-entropy
    (whereas t-SNE minimizes Kulback-Leibler divergence).


    NOTE Just like for t-SNE, we can create more than two new dimensions if we want
    to.


    Once UMAP has learned the lower-dimensional manifold, new data can be projected
    onto this manifold to get their values on the new axes for visualization or as
    input for another machine learning algorithm.'
  merge: -1
  img_proc: true
- pgno: 356
  md: "> UMAP can also be used to perform \"supervised dimension reduction\", which\
    \ really just means that, given high-dimensional, labeled data, it learns a manifold\
    \ that can be used to classify cases into groups.\n\n\n\nIn this section, I'm\
    \ going to show you how to use the UMAP algorithm to create a low-dimensional\
    \ embedding of our Swiss banknote dataset. Remember that we're trying to see if\
    \ we can find a lower-dimensional representation of this dataset to help us identify\
    \ patterns, such as different types of banknotes. We'll start by installing and\
    \ loading the umap package in R. Then, just like we did for t-SNE, we'll discuss\
    \ UMAP's hyperparameters and how they affect the embedding. Then, we'll train\
    \ a UMAP model on the banknote dataset, and plot it to see how it compares with\
    \ our PCA model, and t-SNE embedding.\n\n```\ninstall.packages(\"umap\")\nlibrary(umap)\n\
    ```\n\n+   1. n_neighbors, which controls the radius of the fuzzy search region.\
    \ Larger values will include more neighboring cases, forcing the algorithm to\
    \ focus on more global structure. Smaller values will include fewer neighbors,\
    \ forcing the algorithm to focus on more local structure\n+   \n+   2. min_dist,\
    \ which defines the minimum distance apart that cases are allowed to be in the\
    \ lower-dimensional representation. Low values result in \"clumpy\" embeddings,\
    \ whereas larger values result in cases being spread further apart\n+   \n+  \
    \ 3. metric, which defines which distance metric UMAP will use to measure distances\
    \ along the manifold. By default, UMAP uses ordinary Euclidean distance, but other\
    \ (sometimes crazy) distance metrics can be used instead. A common alternative\
    \ to Euclidean distance is Manhattan distance (also called taxi cab distance),\
    \ where instead of measuring the distance between two points as a single, possibly\
    \ diagonal, distance , it measures the distance between two points one variable\
    \ at a time and adds these little journeys up, just like a taxi cab driving around\
    \ blocks in a city\n\n> We can also apply t-SNE with distance metrics other than\
    \ Euclidean, but we first need to manually calculate these distances ourselves.\
    \ The UMAP implementation just lets us specify the distance we want and it takes\
    \ care of the rest\n\n\n\nIn this section we'll install and load the umap package,\
    \ tune, and then train our UMAP model. Let's start by installing and loading the\
    \ umap package:"
