  md: '+   - Embarked: a character vector of which port passengers embarked from


    The first thing we’re going to do is use tidyverse tools to clean and prepare
    the data for modeling.


    # 4.2.2 Making the most of the data: feature engineering and feature selection


    Rarely will you be working with a dataset that is ready for modeling straight
    away. Typically, we need to perform some cleaning first to ensure we get the most
    from the data. This includes steps such as converting data to the correct types,
    correcting mistakes and removing irrelevant data. The titanicTib tibble is no
    exception and we need to clean it up before we can pass it to the logistic regression
    algorithm. There are three tasks we’re going to perform:


    +   1. Convert the `Survived`, `Sex` and `Pclass` variables into factors

    +   2. Create a new variable called `FamSize` by adding `SibSp` and `Parch` together

    +   3. Select the variables we believe to be of predictive value for our model


    If a variable should be a factor, it’s important to let R know it’s a factor,
    so that R treats it appropriately. We can see from the output of `titanicTib`
    above, that `Survived` and `Pclass` are both integer vectors (`<int>` shown above
    their columns in the output above) and that `Sex` is a character vector (`<chr>`
    shown above its column in the output above). Each of these variables should be
    treated as a factor because they represent discrete differences between cases
    that are repeated throughout the dataset.


    We might hypothesize that the number of family members a passenger has on board
    might impact their survival. For example, people with many family members may
    be reluctant to board a lifeboat that doesn’t have enough room for their whole
    family. While the `SibSp` and `Parch` variables contain this information separated
    by siblings and spouses, and parents and children, respectively, it may be more
    informative to combine these into a single variable containing overall family
    size.


    This is an extremely important machine learning task called *feature engineering*,
    and is the modification of variables in your dataset to improve their predictive
    value. Feature engineering and comes in two flavors:


    +   - Feature extraction

    +   - Feature creation


    Feature extraction is where predictive information is held in a variable, but
    in a format that is not useful. For example, let’s say you have a variable that
    contains the year, month, day and time of day of certain events occurring. The
    time of day has important predictive value, but the year, month and day do not.
    For this variable to be useful in your model, you would need to extract only the
    time of day information as a new variable. This is feature extraction.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'Feature creation is the combination of existing variables to create new ones.
    Merging the `SibSp` and `Parch` variables to create `FamSize` is an example of
    feature creation. Using feature extraction and feature creation allows us to extract
    predictive information present in our dataset but not currently in a format that
    maximizes its usefulness.


    Finally, we will often have variables in our data that have no predictive value.
    For example, does knowing the passenger’s name or cabin number help us predict
    survival? Possibly not, so let’s remove them. Including variables with little
    or no predictive value adds noise to the data and will negatively impact how our
    models perform, so it’s best to remove them.


    This is another extremely important machine learning task called *feature selection*,
    and is pretty much what it sounds like: keeping variables that add predictive
    value, and removing those that don’t. Sometimes, it’s obvious to us as humans
    whether variables are useful predictors or not. Passenger name, for example, would
    not be useful because every passenger has a different name! In these situations
    it’s common sense to remove such variables. Often, however, it’s not so obvious,
    and there are more sophisticated ways we can automate the feature selection process.
    We’ll explore this in later chapters.


    All three of these tasks (converting to factors, feature engineering, and feature
    selection) are performed in code listing 4.2. I’ve made our lives easier by defining
    a vector of the variables we wish to convert into factors, and then used the `mutate_at()`
    function to turn them all into factors. The `mutate_at()` function is like the
    `mutate()` function, but it allows us to mutate multiple columns at once. We supply
    the existing variables as a character vector to the `.vars` argument, and tell
    it what we want to do to those variables using the `.funs` argument. In this case,
    we supply the vector of variables we defined, and the "factor" function to convert
    them into factors.


    We pipe the result of this into a `mutate()` function call which defines a new
    variable, `FamSize`, which is the sum of `SibSp` and `Parch`.


    Finally, we pipe the result of this into a `select()` function call, to select
    only the variables we believe may have some predictive value for our model. When
    we print our new tibble, we can see that `Survived`, `Pclass`, and `Sex` are now
    factors (`<fct>` shown above their columns in the output above), we have our new
    variable, `FamSize`, and have removed irrelevant variables.'
