  md: "An important consequence of this is that for loops, which when used on their\
    \ own can create unwanted side effects (such as modifying existing variables),\
    \ can be wrapped inside other functions. Functions that wrap for loops inside\
    \ them, allow us to iterate over each element of a vector/list, (including columns\
    \ and rows of dataframes or tibbles), apply a function to that element, and return\
    \ the result of the whole iterative process.\n\n> **NOTE**\n> \n> If you’re familiar\
    \ with the `apply()` family of base R functions, functions from the purrr package\
    \ help us achieve the same thing, but using a consistent syntax and some convenient\
    \ features.\n\n# ## 2.7.1 Replacing `for` loops with `map()`\n\nThe purrr package\
    \ provides us with a set of functions that allow us to apply a function to each\
    \ element of a list. Which purrr function we use depends on the number of inputs\
    \ and what we want our output to be, and in this section I’ll demonstrate the\
    \ importance of the most commonly used functions from this package. Imagine you\
    \ have a list of three numeric vectors:\n\n# ### Listing 2.23 Creating a list\
    \ of numeric vectors\n\n```\n```r\nlistOfNumerics <- list(a = rnorm(5),\n    \
    \                   b = rnorm(9),\n                       c = rnorm(10))\n\nlistOfNumerics\n\
    \n$a\n[1] -1.4617 -0.3948  2.1335 -0.2203  0.3429\n\n$b\n[1]  0.2438 -1.3541 \
    \ 0.6164 -0.5524  0.4519  0.3592 -1.3415 -1.7594  1.2160\n\n$c\n[1] -1.1325  0.2792\
    \  0.5152 -1.1657 -0.7668  0.1778  1.4004  0.6492 -1.6320\n[10] -1.0986\n```\n\
    ```\n\nNow, let’s say we want to apply a function to each of the three list elements\
    \ separately, such as the `length()` function to return the length of each element.\
    \ We could use a for loop to do this, iterating over each list element, and saving\
    \ the length as an element of a new list that we predefine to save time."
  merge: -1
