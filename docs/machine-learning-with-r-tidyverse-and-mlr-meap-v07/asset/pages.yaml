  md: '# Listing 2.2 Converting data frames to tibbles


    ```

    myDf <- data.frame(x = 1:4,

    y = c("london", "beijing", "las vegas", "berlin"))

    dfToTib <- as_tibble(myDf)

    dfToTib

    # A tibble: 4 x 2

    x y

    <int> <fct>

    1 london 1

    2 beijing 2

    3 las vegas 3

    4 berlin 4

    ```


    > NOTE

    > In this book we''ll be working with data already built into R. Often, we need
    to read data into our R session from a .csv file. To load the data as a tibble,
    you use the read_csv() function. read_csv() comes from the readr package which
    is loaded when you call library(tidyverse) and is the tidyverse version of read.csv().




    If you’re used to working with data frames, you’ll notice a few differences with
    tibbles. I’ve summarized the most notable differences between data frames and
    tibbles in this section.




    A common frustration people have when creating data frames is that they will convert
    string variables to factors by default. This can be annoying because it may not
    be the best way to handle the variables. To prevent this conversion, you must
    supply the stringsAsFactors = FALSE argument when creating a data frame.


    In contrast, tibbles don’t convert string variables to factors by default. This
    behaviour is desirable because automatic conversion of data to certain types can
    be a frustrating source of bugs:'
