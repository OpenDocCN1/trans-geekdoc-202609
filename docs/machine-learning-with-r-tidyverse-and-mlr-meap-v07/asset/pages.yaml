  md: "![](img/a22105d68c35e8d5bd3c7bafb4644881_83_0.png)\n\n**Figure 3.15 Tuning\
    \ of k.** The MMCE values from fitting the k-NN model with different values of\
    \ k during a grid search.\n\nOk, so now we can train our final model, using our\
    \ tuned value of *k*:\n\n```\n```r\ntunedKnn <- setHyperPars(makeLearner(\"classif.knn\"\
    ),\n                          par.vals = tunedK$x)\n\ntunedKnnModel <- train(tunedKnn,\
    \ diabetesTask)\n```\n```\n\nThis is as simple as wrapping the `makeLearner()`\
    \ function, where we make a new k-NN learner, inside the `setHyperPars()` function,\
    \ and provide the tuned value of *k* as the `par.vals` argument. We then train\
    \ our final model as before, using the `train()` function.\n\n# 3.7.1 Including\
    \ hyperparameter tuning in our cross-validation\n\nNow, when we perform some kind\
    \ of preprocessing on our data or model, such as tuning hyperparameters, it’s\
    \ important to include this preprocessing *inside* our cross-validation, so that\
    \ we cross-validate the whole model training procedure.\n\nThis takes the form\
    \ of nested cross-validation, where we have an inner loop that cross-validates\
    \ different values of our hyperparameter (just like we did above), then the winning\
    \ hyperparameter value gets passed to an outer cross-validation loop. In the outer\
    \ cross-validation loop, the winning hyperparameters are used for each fold.\n\
    \nNested cross-validation proceeds like this:\n\n+   1. Split the data up into\
    \ training and test sets (this can be done using the hold-out, k-fold, or leave-one-out\
    \ methods). This division is called the *outer loop*\n+   2. The training set\
    \ is used to cross-validate each value of our hyperparameter search space (using\
    \ whatever method we decide). This is called the *inner loop*\n+   3. The hyperparameter\
    \ that gives the best cross-validated performance from each inner loop, is passed\
    \ to the outer loop\n+   4. A model is trained on each training set of the outer\
    \ loop, using the best hyperparameter"
  merge: -1
  img_proc: true
- pgno: 84
  md: '+   4. from its inner loop. These models are used to make predictions on their
    test sets.

    +   5. The average performance metrics of these models across the outer loop are
    then reported as an estimate of how the model will perform on unseen data.


    If you prefer a graphical explanation take a look at figure 3.16.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_84_0.png)


    **Figure 3.16 Nested cross-validation.** The dataset is split into folds. For
    each fold, the training set is used to create sets of inner k-fold cross-validation.
    Each of these inner sets cross-validates a single hyperparameter value, by splitting
    the data up into training and test sets. For each fold in these inner sets, a
    model is trained using the training set and evaluated on the test set, using that
    set’s hyperparameter value. The hyperparameter from each inner cross-validation
    loop that gives the best performing model is used to train the models on the outer
    loop.


    In the example shown in figure 3.16, the outer loop is 3-fold cross-validation.
    For each fold, inner sets of 4-fold cross-validation are applied, only using the
    training set from the outer loop. For each set of this inner loop, the cross-validation
    is applied using a different value of *k*. The winning value of *k* (the one that
    gives the best performance) is then passed to the outer loop, which is then used
    to train the model, and its performance is evaluated on the test set. Can you
    see that we’re cross-validating the whole model-building process including hyperparameter
    tuning?'
