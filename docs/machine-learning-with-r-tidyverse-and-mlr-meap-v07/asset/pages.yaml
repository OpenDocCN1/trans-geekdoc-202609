    # 12.5 Building our first XGBoost regression model


    In this section, I’ll teach you how to define an XGBoost learner for regression,
    tune its many hyperparameters, and train a model for our fuel task.


    We’ll start by defining our XGBoost learner. Just like for the k-NN and random
    forest learners, instead of using `classif.xgboost` as in chapter 8, the regression
    equivalent is `regr.xgboost`.


    ```

    xgb <- makeLearner("regr.xgboost")

    ```


    Then, we’re going to tune the hyperparameters of our XGBoost learner: `eta`, `gamma`,
    `max_depth`, `min_child_weight`, `subsample`, `colsample_bytree`, and `nrounds`.
    I first defined what these hyperparameters do in chapter 8, but again, let’s recap
    each one here:


    +   - `eta` is known as the learning rate, takes a value between 0 and 1 which
    is multiplied by the model weight of each tree to slow down the learning process
    to prevent overfitting

    +   - `gamma` is the minimum amount splitting a node must improve the loss function
    by (MSE in the case of regression)

    +   - `max_depth`, the maximum levels deep each tree can grow

    +   - `min_child_weight`, the minimum degree of impurity needed in a node before
    attempting to split it (if a node is pure enough, don’t try to split it again)

    +   - `subsample`, the proportion of cases to be randomly sampled (without replacement)
    for each tree. Setting this to 1 uses all the cases in the training set

    +   - `colsample_bytree`, the proportion of predictor variables sampled for each
    tree. We could also tune `colsample_bylevel` and `colsample_bynode`, which instead
    sample predictors for each level of depth in a tree and at each node, respectively

    +   - `nrounds`, the number of sequentially-built trees in the model'
