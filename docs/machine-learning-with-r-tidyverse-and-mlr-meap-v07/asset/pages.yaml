    \ function to randomly draw a number of cases, equal to the number of rows in\
    \ the original dataset (the `.` is shorthand for \"the dataset that was piped\
    \ in\"). By setting the `replace` argument equal to `TRUE`, we’re telling the\
    \ function to sample with replacement. Creating simple bootstrap samples really\
    \ is as easy as this!\n\n# Listing 17.3 Creating bootstrap samples\n\n```\n```r\n\
    gvhdBoot <- map(1:10, ~ {\n  gvhdScaled %>%\n    as_tibble() %>%\n    sample_n(size\
    \ = nrow(.), replace = TRUE)\n})\n```\n```\n\nNow, let’s use our `cluster_metrics()`\
    \ function to calculate those three internal metrics for a range of cluster numbers,\
    \ for each bootstrap sample we just generated. Take a look at code listing 17.4\
    \ and don’t go cross-eyed! I’m going to take you through the code step-by-step.\
    \ I start by calling the `map_df()` function, so that we can apply a function\
    \ to every element of our list of bootstrap samples. I define an anonymous function,\
    \ which takes boot (the current element being considered) as its only argument.\n\
    \n> **TIP**  The `map_df()` function is just like `map()`, but instead of returning\
    \ a list, it will combine each element together row-wise to return a data frame\
    \ instead.\n\nFor each element in `gvhdBoot`, the anonymous function computes\
    \ its Euclidean distance matrix and stores it as the object `d`, and performs\
    \ hierarchical clustering using that matrix and Ward’s method. Once we have the\
    \ hierarchy for each bootstrap sample, we then use another `map_df()` function\
    \ call to select between three and eight clusters to partition the data into,\
    \ and calculate the three internal clustering methods on each result. We’re going\
    \ to use this process to see which number of clusters, between three and eight,\
    \ gives us the best internal cluster metric values.\n\nSelecting the number of\
    \ clusters to retain from a hierarchical clustering model is done using the `cutree()`\
    \ function. We use this function to cut our dendrogram at a place that returns\
    \ a number of clusters. We can do this either by specifying a height at which\
    \ to cut, using the `h` argument, or by specifying a specific number of clusters\
    \ to retain, using the `k` argument (as done here). The first argument is the\
    \ result of calling the `hclust()` function. The output of the `cutree()` function\
    \ is a vector indicating the cluster number assigned to each case in the dataset.\
    \ Once we have this vector, we can call our `cluster_metrics()` function, supplying\
    \ the bootstrap data, the vector of cluster membership, and the distance matrix.\n\
    \n> **WARNING**  This took nearly three minutes to run on my machine!"
  merge: -1
  img_proc: true
- pgno: 435
  md: "If what we just did is a little unclear to you, print the `metricsTib` tibble\
    \ to see what the output looks like. We have a tibble with one column for each\
    \ of the internal cluster metrics, and a column indicating the number of clusters\
    \ the metrics were calculated for.\n\n# Listing 17.4 Calculating performance metrics\
    \ of our clustering model\n\n```\n```r\nmetricsTib <- map_df(gvhdbBoot, function(boot)\
    \ {\n  d <- dist(boot, method = \"euclidean\")\n  cl <- hclust(d, method = \"\
    ward.D2\")\n\n  map_df(3:8, function(k) {\n    cut <- cutree(cl, k = k)\n    cluster_metrics(boot,\
    \ clusters = cut, dist_matrix = d)\n  })\n})\n```\n```\n\nLet’s plot the result\
    \ of our bootstrapping experiment. We’re going to create a separate sub-plot for\
    \ each internal cluster metric (using facetting). Each sub-plot will show the\
    \ number of clusters on the x axis, the value of the internal cluster metric on\
    \ the y axis, a separate line for each individual bootstrap sample, and a line\
    \ that connects the mean value across all bootstraps.\n\nTo achieve this, we first\
    \ need to mutate a new column, indicating the bootstrap sample each case belongs\
    \ to. As there are ten bootstrap samples, evaluated for six different numbers\
    \ of cluster each (three to eight), I create this variable by using the `rep()`\
    \ function to repeat each number from one to ten, six times. I wrap this inside\
    \ the `factor()` function to ensure this isn’t treated as a continuous variable\
    \ when plotting. Next, I gather the data so that the choice of internal metric\
    \ is contained within a single column, and the value of that metric is held in\
    \ another column. I specify `--clusters` and `--bootstrap` to tell the function\
    \ **not** to gather these variables. Print this new tibble and ensure you understand\
    \ how we got there.\n\n# Listing 17.5 Transforming the data ready for plotting\n\
    \n```\n```r\nmetricsTib <- metricsTib %>%\n  mutate(bootstrap = factor(rep(1:10,\
    \ each = 6))) %>%\n  gather(key = \"Metric\", value = \"Value\", --clusters, --bootstrap)\n\
    ```\n```\n\nNow that our data is in this format, we can create the plot (follow\
    \ along with me in code listing 17.6). I map the number of clusters (as a factor)\
    \ to the x aesthetic, and the value of internal cluster metric to the y aesthetic.\
    \ I add a `facet_wrap()` layer to facet by internal cluster metric, setting the\
    \ `scales = \"free_y\"` argument as the metrics are on different scales. Next,\
    \ I add a `geom_line()` layer, using the `size` argument to make these lines less\
    \ prominent, and map the bootstrap sample number to the group aesthetic. This\
    \ layer will therefore draw a separate, thin line for each bootstrap sample."
  merge: -1
