    region where the curve inflects upwards is the knee/elbow, and the optimal value
    of epsilon at this nearest neighbor distance in this inflection. Using this method,
    I’ve selected 1.2 and 2.0 as my lower and upper limits I’m going to tune epsilon
    over.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_461_0.png)


