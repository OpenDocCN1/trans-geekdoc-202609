- pgno: 191
  md: 'The plot generated by code listing 7.9 is shown in figure 7.8. Can you see
    how simple and interpretable the tree is? When predicting the classes of new cases,
    they start at the top (the root) and follow the branches based on the splitting
    criterion at each node.


    The first node asks whether the animal produces milk or not. This split was chosen
    because it has the highest Gini gain of all candidate splits (it immediately discriminates
    mammals, which comprise 41% of the training set from the other classes). The leaf
    nodes tell us which class is classified by that node, and the proportions of each
    class in that node. For example, the leaf node that classifies cases as mollusc.et.al
    contains 83% mollusc.et.al cases and 17% insect cases. The percentage at the bottom
    of each leaf indicates the percentage of cases in the training set in this leaf.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_191_0.png)


    **Figure 7.8 Graphical representation of our decision tree model.** The splitting
    criterion is shown for each node. The leaf nodes show the predicted class, the
    proportion of each of the classes in that leaf, and the proportion of all cases
    in that leaf.


    To inspect the cp values for each split, we can use the `printcp()` function.
    This function takes the model data as the first argument, and an optional digits
    argument, specifying how many decimal places to print the output. There is some
    useful information in the output, such as the variables actually used for splitting
    the data, and the root node error (the error before any splits). Finally, the
    output includes a table of the cp values for each split.'
