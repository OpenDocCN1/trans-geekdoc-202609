- pgno: 30
  md: "When subsetting a data frame, the [ operator will return another data frame\
    \ if you keep more than one column, or a vector if you keep only one. When subsetting\
    \ a tibble, the [ operator will always return another tibble. If you wish to explicitly\
    \ return a tibble column as a vector, use either the [[ or $ operators instead.\
    \ This behavior is desirable because we should be explicit in whether we want\
    \ a vector or rectangular data structure to avoid bugs:\n\n\n\n```\nmyDf[, 1]\n\
    [1] 1 2 3 4\n\nmyTib[, 1]\n# A tibble: 4 x 1\n   x\n< int>\n  1     1\n  2   \
    \  2\n  3     3\n  4     4\n\nmyTib[[1]]\n[1] 1 2 3 4\n\nmyTib$x\n[1] 1 2 3 4\n\
    ```\n\n> An exception to is this is if your subset a data frame using a single\
    \ index with no comma (such as myDf[1]). In this case, the [ operator will return\
    \ a single column data frame, but this method doesn't allow us to combine row\
    \ and column subsetting.\n\n\n\nWhen building a tibble, variables are created\
    \ sequentially so that latter variables can reference earlier defined ones. This\
    \ means we can create variables on-the-fly that refer to other variables in the\
    \ same function call:\n\n\n\n```\nsequentialTib <- tibble(nItems = c(12, 45, 107),\n\
    \    cost = c(0.5, 1.2, 1.8),\n    totalWorth = nItems * cost)\n\nsequentialTib\n\
    # A tibble: 3 x 3\n  nItems cost totalWorth\n<dbl> <dbl>    <dbl>\n1     12  \
    \ 0.5        6\n2     45   1.2       54\n3    107   1.8      193\n```"
  merge: -1
