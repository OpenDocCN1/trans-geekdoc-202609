  md: "> There are two other internal cluster metrics implemented by mlr: silhouette\
    \ and G2 (use listMeasures(\"cluster\") to list the available metrics). Both metrics\
    \ are more computationally expensive to compute so we won't use them here, but\
    \ they are additional metrics to help us decide an appropriate number of clusters.\n\
    \nTo perform tuning, I use the tuneParams() function. As we didn't use this function\
    \ during the dimension reduction part of the book, let’s refresh our memory of\
    \ the arguments:\n\n+   1. the first argument is the name of the learner\n+  \
    \ 2. the task argument is the name of our clustering task\n+   3. the resampling\
    \ argument is the name of our cross-validation strategy\n+   4. the par.set argument\
    \ is our hyperparameter search space\n+   5. the control argument is our search\
    \ method\n+   6. the measures argument allows us to define which performance measures\
    \ we want to calculate for each iteration of the search. Here, I ask for the Davies-Bouldin\
    \ index (db), Dunn index (dunn), and pseudo F statistic (G1), in that order\n\n\
    Just to reiterate: when we perform the tuning, for each combination of hyperparameters,\
    \ the data will be split into 10 folds and the k-means algorithm will be trained\
    \ on the training set of each fold. The cases in each test set will be assigned\
    \ to their nearest cluster centroid, and the internal cluster metric will be calculated\
    \ on these test set clusters.\n\n> We can supply a list of as many performance\
    \ metrics as we want. All of them will be calculated for each iteration of the\
    \ search, but the combination of hyperparameters that optimize the value of the\
    \ first metric in the list will always be returned from tuning. The mlr package\
    \ also \"knows\" which metrics should be maximized, and which ones should be minimized\
    \ for best performance.\n\n```\ninstall.packages(\"clusterSim\")\nlistMeasures(\"\
    cluster\")\ntunedK <- tuneParams(kMeans, task = gvhdTask,\n    resampling = kFold,\n\
    \    par.set = kMeansParamSpace,\n    control = gridSearch,\n    measures = list(db,\
    \ dunn, G1))\ntunedK\nTune result:\nOp. pars: centers=4; algorithm=Lloyd\ndb.test.mean=0.8010,dunn.test.mean=0.0489,G1.test.mean=489.5331\n\
    ```"
