- pgno: 245
  md: 'The resulting plot from code listing 9.16 is shown in figure 9.10. The Residuals
    vs Fitted plot shows us the predicted Ozone level on the x axis, and the residual
    on the y axis, for each case. We *hope* that there are no patterns in this plot.
    In other words, the amount of error shouldn’t depend on predicted value. In this
    situation we have a curved relationship. This indicates that we have non-linear
    relationships between predictors and Ozone, and/or heteroscedasticity.


    The normal Q-Q (quantile-quantile) plot shows the quantiles of the model residuals,
    plotted against their quantiles if they were drawn from a theoretical normal distribution.
    If the data deviate considerably from a 1:1 diagonal line then this suggests the
    residuals are not normally-distributed. This doesn’t seem to be a problem for
    this model as the residuals line up nicely on the diagonal.


    The Scale-Location plot helps us identify heteroscedasticity of the residuals.
    There should be no patterns here, but it looks like the residuals are increasingly
    varied with larger predicted values, suggesting heteroscedasticity.


    Finally, the Residuals vs Leverage plot helps us to identify cases which have
    excessive influence on the model parameters (potential outliers). Cases that fall
    inside a dotted region of the plot called Cook’s distance may be outliers, whose
    inclusion or exclusion makes a large difference to the model. As we can’t even
    see Cook’s distance here (it is beyond the axis limits), we have no worries about
    outliers.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_245_0.png)


    **Figure 9.10 Plotting diagnostic plots for our linear model.** The Residuals
    vs Fitted and Scale-Location plots help identify patterns that suggest non-linearity
    and heteroscedasticity. The normal Q-Q plot helps identify non-normality of residuals,
    and the Residuals vs Leverage plot helps identify influential outliers.'
