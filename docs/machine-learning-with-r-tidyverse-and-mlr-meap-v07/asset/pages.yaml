  md: 'process, we call the tuneParams() function and supply as arguments:


    +   • the first argument is the name of the learner

    +   • task = the name of our task

    +   • resampling = our cross validation procedure (defined in code listing 6.11)

    +   • par.set = our hyperparameter space (defined in code listing 6.10)

    +   • control = the search procedure (random search, defined in code listing 6.11)


    > WARNING The computer I''m writing this on has four cores and the code below
    takes nearly a minute to run on it. It is of the utmost importance that you go
    make a cup of tea while it runs. Milk and no sugar, please.




    ```

    library(parallelMap)

    library(parallel)


    parallelStartSocket(cpus = detectCores())


    tunedSvmPars <- tuneParams("classif.svm", task = spamTask,

    resampling = cvForTuning,

    par.set = svmParamSpace,

    control = randSearch)


    parallelStop()

    ```


    > TIP The degree hyperparameter only applies to the polynomial kernel function,
    and the gamma hyperparameter doesn''t apply to the linear kernel. Does this create
    errors when the random search selects combinations that don''t make sense? Nope.
    If the random search selects the sigmoid kernel, for example, it simply ignores
    the value of the degree hyperparameter.


    Welcome back after our interlude! You can print the best-performing hyperparameter
