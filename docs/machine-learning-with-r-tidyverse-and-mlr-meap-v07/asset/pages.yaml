    just how big a penalty to apply to the parameter estimates.


    > > **NOTE** Remember that when lambda equals zero, we are applying no penalty
    and get the OLS parameter estimates. The larger lambda is, the more the parameters
    are shrunk towards zero.


    We’ll start by defining the hyperparameter space we’re going to search to find
    the optimal value of lambda. Recall that to do this, we use the `makeParamSet()`
    function, supplying each of our hyperparameters to search, separated by commas.
    As we only have one hyperparameter to tune, and as lambda can take any numeric
    value between zero and infinity, I use the `makeNumericParam()` function to specify
    we want to search for numeric values of lambda between zero and fifteen.


    > > **IMPORTANT** Notice I’ve called the hyperparameter "s" instead of "lambda"?
    If you run `getParamSet(ridge)` you will indeed see a tunable hyperparameter called
    lambda, so what’s with the "s"? The authors of glmnet helpfully wrote it so that
    it will build models for a range of lambdas for us. Then, we can plot the lambdas
    to see which one gives the best cross-validated performance. This is handy, but
    seeing as we’re using mlr as a universal interface to many machine learning packages,
    it makes sense for us to tune lambda ourselves the way we’re used to. The glmnet
    lambda hyperparameter is used for specifying a *sequence* of lambda values to
    try, and the authors specifically recommend **not** supplying a single value for
    this hyperparameter. Instead, the s hyperparameter is used to train a model with
    a single, specific lambda, and so this is what we will tune when using mlr. For
    more information I suggest you read the documentation for glmnet by running `?glmnet::glmnet`.


    Next, let’s define our search method as a random search with 200 iterations using
    `makeTuneControlRandom()`, and define our cross-validation method as 3-fold cross-validation
    repeated five times, using `makeResampleDesc()`. Finally, we run our hyperparameter
    tuning process with the `tuneParams()` function. To speed thing up a little, let’s
    use `parallelStartSocket()` to parallelize the search.


    > > **WARNING** This takes about 30 seconds on my four-core machine.'
