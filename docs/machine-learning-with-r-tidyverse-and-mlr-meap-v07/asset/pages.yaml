    \ Result\nTask: imp$data\nLearner: classif.logreg.imputed\nAggr. perf: acc.test.mean=0.7961500,fpr.test.mean=0.2992605,fnr.test.mean=0.1444175\n\
    Runtime: 10.6986\n```\n\nAs this is a two-class classification problem, we have\
    \ access to a few extra performance metrics, such as the false positive rate (fpr)\
    \ and false negative rate (fnr). In the cross-validation procedure in code listing\
    \ 4.11, I asked for accuracy, false positive rate and false negative rate to be\
    \ reported as performance metrics. We can see that, while on average across the\
    \ repeats, our model correctly classified 79.6% of passengers, it incorrectly\
    \ classified 29.9% of passengers that died, as survived (false positives), and\
    \ incorrectly classified 14.4% of passengers that survived, as died (false negative\
    \ rate).\n\n# 4.3.2 Accuracy is the most important performance metric, right?\n\
    \nYou might think that the accuracy of a model’s predictions is the defining metric\
    \ of its performance. Often, this is the case, but sometimes it’s not.\n\nImagine\
    \ you work for a bank as a data scientist in their fraud detection department.\
    \ It’s your job to build a model that predicts whether credit card transactions\
    \ are legitimate or fraudulent. Let’s say out of 100,000 credit card transactions,\
    \ only 1 of those is fraudulent. Because fraud is relatively rare, (and because\
    \ they have pizza for lunch today) you decide to build a model that simply classifies\
    \ all transactions as legitimate.\n\nThe model accuracy is 99.999%. Pretty good?\
    \ Of course not! The model isn’t able to identify *any* fraudulent transactions\
    \ and has a false negative rate of 100%!\n\nThe lesson here, is that you should\
    \ evaluate model performance *in the context of your particular*"
