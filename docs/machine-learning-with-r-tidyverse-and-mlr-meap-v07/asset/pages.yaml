    # ### 1.2.3 A brief word on deep learning


    If you’ve done more than a little reading about machine learning, you have probably
    come across the term *deep learning*, and you may have even heard the term in
    the media.


    Deep learning is a subfield of machine learning (all deep learning is machine
    learning, but not all machine learning is deep learning) that has become extremely
    popular in the last 5 to 10 years for two main reasons:


    +   1. It can produce models with outstanding performance

    +   2. We now have the computational power to apply it more broadly


    Deep learning uses *neural networks* to learn patterns in data, a term referring
    to the way in which the structure of these models superficially resembles neurons
    in the brain, with connections allowing them to pass information between them.
    The relationship between AI, machine learning, and deep learning is summarized
    in figure 1.7.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_17_0.png)


    **Figure 1.7** The relationship between artificial intelligence (AI), machine
    learning, and deep learning. Deep learning comprises a collection of techniques
    that form a subset of machine learning techniques, which themselves are a subfield
    of AI.


    While it’s true that deep learning methods will typically out-perform "shallow"
    learning methods (a term sometimes used to distinguish machine learning methods
    that are not deep learning) for the same dataset, they are not always the best
    choice for a given problem. Deep learning methods often are not the most appropriate
    method for a given problem for three reasons:


    +   1. **They are *computationally expensive*.** By expensive, we don’t mean monetary
    cost of course, we mean they require a lot of computing power, which means they
    can take a long time (hours or even days!) to train. Arguably this is a less important
    reason not to use deep learning, because if a task is important enough to you,
    you can invest the time and computational resources required to solve it. But
    if you can train a model in a few minutes that performs well, then why waste additional
    time and resources?

    +   2. **They tend to require more data.** Deep learning models typically require
    hundreds to thousands of cases in order to perform extremely well. This largely
    depends on the'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'complexity of the problem at hand, but shallow methods tend to perform better
    on small datasets than their deep learning counterparts.


    +   3. The rules are less interpretable.


    So while deep learning methods can be extraordinarily powerful, shallow learning
    techniques are still invaluable tools in the arsenal of data scientists.


    # NOTE


    Deep learning algorithms are particularly good at tasks involving complex data,
    such as image classification and audio transcription.


    Because deep learning techniques require a lot of additional theory, I believe
    they require their own book, and so we will not discuss them here. If you would
    like to learn how to apply deep learning methods (and after completing this book
    I suggest you do), I would strongly recommend Deep Learning with R, by Francois
    Chollet and Joseph J. Allaire (Manning, 2018).


    # Thinking about the ethical impact of machine learning


    Machine learning can be a force for good, whether that''s helping people understand
    nature better, or helping organizations better manage their resources. But machine
    learning also has the potential to do great harm. For example, in 2017 a study
    was published showing that a machine learning model could predict, with startling
    accuracy, a person''s sexual orientation from nothing but an image of their face
    (osf.io/zn79k/). While the authors had no sinister intentions, the study raised
    concerns of the potential misuse of machine learning. Imagine if a country in
    which it is still illegal to be gay (there are 72 at the time of writing this)
    used a model like this to persecute or even execute people? Here''s another example:
    in 2015 it was discovered that Google''s image-recognition algorithm would classify
    images of people of color as images of gorillas ( google-apologizes-after-photos-identify-black-people-as-gorilla
    s). The ethical consideration here is that the data the algorithm was trained
    on was biased towards images of white people, and did a poor job of making accurate
    (and non-racist) predictions on images of non-white people. To avoid this kind
    of bias, it is imperative that our training sets are adequately representative
    of the population our model will be let loose on. Whether this is done using sensible
    sampling strategies or by testing for and correcting biases after training, it
    is our responsibility to ensure our models aren''t biased against particular groups
    of subjects.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'An additional ethical concern of machine learning research is one of security
    and credibility. While it may seem like something taken directly from a science
    fiction film, machine learning research has now reached a point where models can
    create videos of a person speaking, from just an image of their face. Researchers
    have used this so-called "deep fake" technology to produce videos of Barack Obama
    speaking whatever audio they provide (grail.cs.washington.edu/projects/AudioToObama/siggraph17_obama.pdf).
    Imagine misusing this technology to fabricate evidence of a defendant in a criminal
    trial making a statement they never made. Similar technology has also been used
    to replace one person’s face in a video with another person’s face. Sadly and
    notoriously, this has been misused to swap celebrities'' faces into pornographic
    videos. Imagine the potential of this for ruining a person’s career and dignity.


    The previous point brings me to the issue of data protection and consent. In order
    to train useful machine learning models that perform well, we need data. But it’s
    important to consider whether the data you are using was collected ethically.
    Does it contain personal, sensitive, or financial information? Does the data belong
    to anyone? If so, have they given informed consent as to how it will be used?
    A spotlight was shined on these issues in 2018 when the consultancy firm Cambridge
    Analytica mined the social media data of millions of people without their consent.
    The subsequent media outcry and liquidation of Cambridge Analytica should serve
    as a stark reminder as to the importance of ethical data collection procedures.


    Two more ethical considerations are


    +   1. who should make the decisions, and

    +   2. who is culpable when something goes wrong?


    Imagine we have a machine learning model that tells us whether to operate on a
    patient or not, based on their diagnostic data. Would you be happy to follow the
    advice of the model if it has been shown to be correct in all previous cases?
    What about a model that predicts if a defendant is guilty or innocent? You could
    argue this second example is ridiculous, but it highlights my point: should humans
    be involved in the decision-making processes informed by machine learning? If
    so, how should humans be involved in these processes?


    The answers to these questions depend on the decision being made, how it affects
    the people involved, and whether human emotion should be considered in the decision-making
    process.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '> > The issue of culpability poses the question: when a decision made by a
    machine learning algorithm leads to harm, who is responsible? We live in societies
    in which people are held accountable for their actions. When something bad happens,
    rightly or wrongly, we expect that someone will be found culpable. In 2018, a
    car with self-driving capability collided with and killed a pedestrian ([en.wikipedia.org/wiki/Death_of_Elaine_Herzberg](https://en.wikipedia.org/wiki/Death_of_Elaine_Herzberg)).
    Who was culpable? The manufacturer? The person in the car? The pedestrian? Does
    it matter if the pedestrian was jay walking? Ethical quandaries like these need
    to be considered and carefully worked out before machine learning technologies
    like these get released into the world.

    > >

    > > So my ask of you is that when you train your machine learning models, ask
    yourself these five questions:


    +   1. Are my intentions ethical?

    +   2. Even if my intentions are ethical, could someone else do harm with my model?

    +   3. Is my model biased in a way that can cause harm or discriminate?

    +   4. Has the data been collected ethically?

    +   5. Once deployed, how will humans fit into the decisions made by the model?


    > > If the answer to any of them makes you feel uneasy, please carefully consider
    if what you’re doing is ethical. Just because we *can* do something, doesn’t mean
    we *should*. If you would like a deeper discussion on how to perform ethical machine
    learning, I suggest *Towards a Code of Ethics for Artificial Intelligence*, by
    Paula Boddington (Springer, 2017).


    # 1.3 Why use R for machine learning?


    There is something of a rivalry between the two most commonly used data science
    languages: R and Python. Anyone who is new to machine learning will choose one
    or the other to get started, and their decision will often be guided by the learning
    resources they have access to, which one is more commonly used in their field
    of work, and which one their colleagues use. There are no machine learning tasks
    which are only possible to apply in one language or the other, although some of
    the more cutting-edge deep learning approaches are easier to apply in Python (they
    tend to be written in Python first and implemented in R later). Python, while
    very good for data science, is a more general purpose programming language, whereas
    R is geared specifically for mathematical and statistical applications. This means
    that users of R can focus purely on data, but may feel restricted if they ever
    need to build applications based on their models.


    There really isn’t an overall winner when pitching these two against each other
    for data science (although of course everyone has their favorite). So why then
    have I chosen to write a book'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'specifically on machine learning in R? There are modern tools in R designed
    specifically to make data science tasks simple and human-readable, such as those
    from the tidyverse (we’ll cover these tools in depth in Chapter 2).


    Traditionally, machine learning algorithms in R were scattered across multiple
    packages, written by different authors. This meant you would need to learn to
    use new functions with different arguments and implementations, each time you
    wanted to apply a new algorithm. Proponents of python could use this as en example
    of why it was better suited for machine learning, as it has the well known scikit-learn
    package which has a plethora of machine learning algorithms built into it. But
    R has now followed suit, with the caret and mlr packages. While quite similar
    in purpose and functionality to caret, I believe mlr to be more flexible and intuitive,
    and so we’ll be using mlr throughout the book.


    The mlr package (which stands for machine learning in R) provides an interface
    for a large number of machine learning algorithms, and allows you to perform extremely
    complicated machine learning tasks with very little coding. Where possible, we
    will use the mlr package throughout this book so that, when you’re finished, you’ll
    be proficient at using one of the most modern machine learning packages available.


    # 1.4 Which datasets will we use?


    To make your learning process as fun and interesting as possible, we will use
    real datasets in our machine learning pipelines. R comes with a considerable number
    of built-in datasets, that are supplemented by datasets that come with packages
    we’ll be loading into our R sessions. I decided to use datasets that come with
    R or its packages, to make it easier for you to work through the book while offline.


    We’ll be using these datasets to help us build our machine learning models and
    compare how different models perform on different types of data.


    > With so many datasets to choose from, after completing each chapter I suggest
    you apply what you’ve learned to a different dataset.


    # 1.5 What will you learn in this book


    This book gives you with a hands-on introduction to machine learning with R. To
    benefit from the book, you should be comfortable with basic R coding, such as
    loading packages, and working with objects and data structures. You will learn:


    +   - How to use organize, tidy and plot your data using the tidyverse

    +   - Critical concepts such as overfitting, underfitting, and bias-variance trade-off

    +   - To apply several machine learning algorithms from each of the four classes'
