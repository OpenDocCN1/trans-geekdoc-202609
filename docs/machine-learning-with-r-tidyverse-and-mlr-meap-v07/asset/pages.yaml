    \ important arguments to the `prcomp()` function: `center` and `scale`. The `center`\
    \ argument controls whether the data are mean centered before applying PCA, and\
    \ its default value is `TRUE`. We should always center the data before applying\
    \ PCA because this removes the intercept and forces the principal axes to pass\
    \ through the origin.\n\nThe `scale` argument controls whether the variables are\
    \ divided by their standard deviations to put them all on the same scale as each\
    \ other, and its default value is `FALSE`. There isn’t a clear consensus on whether\
