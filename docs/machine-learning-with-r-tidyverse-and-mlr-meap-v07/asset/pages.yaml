- pgno: 299
  md: '# ## 12.1 Using *k*-nearest neighbors to predict a continuous variable


    In this section, I’ll show you how you can use the k-NN algorithm for regression,
    graphically and intuitively. Imagine you’re not a morning person (perhaps, like
    me, you don’t have to imagine very hard), and like to spend as much time in bed
    as possible. To maximize the amount of time you spend sleeping, you decide to
    train a machine learning model to predict how long it takes you to commute to
    work, based on the time you leave the house. It takes you 40 minutes to get ready
    in the morning, so you hope this model will tell you what time you need to leave
    the house to get to work on time, and therefore what time you need to wake up.


    Every day for two weeks, you record the time you leave the house, and how long
    your journey takes. Your journey time is affected by the traffic (which varies
    across the morning), so your journey length changes, depending on when you leave.
    An example of what the relationship between departure time and journey length
    might look like is shown in figure 12.1.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_299_0.png)


    **Figure 12.1** An example relationship between how long your commute to work
    takes, depending on what time you leave the house.


    Recall from chapter 3, that the k-NN algorithm is a lazy learner. In other words,
    it doesn’t do any work during model "training" (instead it just stores the training
    data), and does all of its work when it makes predictions. When making predictions,
    the k-NN algorithm looks in the training set for the *k* most similar cases to
    each of the new, unlabeled data. Each of those *k* most similar cases votes on
    the predicted value of the new data. When using k-NN for classification, these
    votes are for class membership, and the winning vote selects the class the model
    outputs for the new data. To remind you of how this process works, I’ve reproduced
    a modified version of figure 4 from chapter 3, in figure 12.2.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_300_0.png)


    Figure 12.2 The k-NN algorithm for classification: identifying k-nearest neighbors
    and taking the majority vote. Lines connect the unlabeled data with their one,
    three, and five-nearest neighbors. The majority vote in each scenario is indicated
    by the shape drawn under each black cross.


    The voting process when using k-NN for regression is very similar, except that
    we take the mean of these k votes as the predicted value for the new data.


    This process is illustrated for our commuting example in figure 12.3. The crosses
    on the x axis represent new data: times we left the house and want to predict
    journey length for. If we train a 1-nearest neighbor model, the model finds the
    single case from the training set that is closest to the departure time of each
    of the new data, and uses that value as the predicted journey length. If we train
    a 3-nearest neighbor model, the model finds the three training cases with departure
    times most similar to each of the new data, takes the mean journey length of those
    nearest cases, and outputs this as the predicted value for the new data. The same
    applies to any number of k we use to train the model.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '> **IMPORTANT** Just like when we used k-NN for classification, selecting the
    best performing value of *k* is critical to model performance. If we select a
    *k* that is too low, we may produce a model that is overfitted and makes predictions
    with high variance. If we select a *k* that is too high, we may produce a model
    which is underfit and makes predictions with high bias.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_301_0.png)


    **Figure 12.3** How the k-NN algorithm predicts continuous variables. The crosses
    represent new data we wish to predict the journey length of. For the one, three,
    and five-nearest neighbor models, the nearest neighbors to each new datum are
    highlighted in a lighter shade. In each case, the predicted value is the mean
    journey length of the nearest neighbors.


    # 12.2 Using tree-based learners predict a continuous variable


    In this section, I’ll show you how you can use tree-based algorithms to predict
    a continuous outcome variable. Back in chapter 7, I showed you how tree-based
    algorithms (such as the rpart algorithm) split up a feature space into separate
    regions, one binary split at a time. The algorithm tries to partition the feature
    space such that each region contains only cases from a particular class. Put another
    way, the algorithm tries to learn binary splits that result in regions that are
    as pure as possible.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '> **NOTE**  Remember that the *feature space* refers to all possible combinations
    of predictor variable values, and that *purity* refers to how homogeneous the
    cases are within a single region.


    To refresh your memory of this, I’ve reproduced figure 4 from chapter 7, showing
    how a feature space of two predictor variables can be partitioned to predict the
    membership of three classes.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_302_0.png)


    **Figure 12.4 How splitting is performed for classification problems.** Cases
    belonging to three classes are plotted against two continuous variables. The first
    node splits the feature space into rectangles based on the value of variable 2.
    The second node further splits the variable 2 20 feature space into rectangles
    based on the value of variable 1.


    Classification with tree-based algorithms is a bit like herding animals into their
    pens on a farm. It’s quite obvious that we want one pen for the chickens, one
    for the cows, and one for the alpacas (I don’t think you see many alpacas on farms,
    but I’m particularly fond of them). So conceptually, it’s quite easy for us to
    picture splitting regions of the feature space up into different pens for different
    categories. But perhaps it’s not so easy for us to picture splitting the feature
    space up to predict a continuous variable.


    So how does this partitioning work for regression problems? Well, in exactly the
    same way actually; the only difference is that instead of each region representing
    a class, it represents a value of the continuous outcome variable. Take a look
    at figure 12.5 where we’re creating a regression tree using our journey length
    example. The nodes of the regression tree split the feature space (departure time)
    into distinct regions. Each region represents the mean of the outcome variable
    of the cases inside it. When making predictions on new data, the model will predict
    the value of the region the new data falls into. The leaves of the tree are no
    longer classes, but numbers. This is illustrated for situations with one and two
    predictor variables in figure 12.5, but extends to any number of predictors.'
  merge: -1
  img_proc: true
- pgno: 303
  md: "![](img/a22105d68c35e8d5bd3c7bafb4644881_303_0.png)\n\n**Figure 12.5 How splitting\
    \ is performed for regression problems.** The feature space is split into shaded\
    \ regions based on the nodes of the tree next to each plot. The predicted journey\
    \ length is shown inside each region. The dashed line in the top plot demonstrated\
    \ how journey length is predicted from departure time based on the tree. The bottom\
    \ plot shows a two-predictor situation.\n\nJust like for classification, regression\
    \ trees can handle both continuous and categorical predictor variables (with the\
    \ exception of XGBoost which requires categorical variables to be numerically\
    \ encoded). The way splits are decided for continuous and categorical variables\
    \ is the same as for classification trees, except that instead of finding the\
    \ split that has the highest Gini gain, the algorithm looks for the split with\
    \ the lowest sum of squares.\n\n> **NOTE**\n> \n> Recall from chapter 7 that the\
    \ Gini gain is the difference between the Gini indices of the parent node and\
    \ of the split. The Gini index is a measure of impurity, and is equal to `1 -\
    \ p(A)^2 + p(B)^2` where `p(A)` and `p(B)` are the proportions of cases belonging\
    \ to classes A and B, respectively."
  merge: -1
  img_proc: true
- pgno: 304
  md: 'For each candidate split, the algorithm calculates the the sum of squared residuals
    for the left and right split, and adds them together to form the sum of squared
    residuals for the split as a whole. Take a look at figure 12.5. The algorithm
    is considering the candidate split of a departure time before 7:45. For each case
    where the departure time was before 7:45, the algorithm calculates the mean journey
    length, finds the residual error (the difference between each case’s journey length
    and the mean), and squares it. The same is done for the cases where we left the
    house after 7:45, with their respective mean. These two sum of squared residual
    values are added together to give the sum of squares for the split. If you prefer
    to see this in mathematical notation, it’s shown in equation 12.1.




    ```

    SS_split = \sum_{i \in left} (y_i - \hat{y}_{left})^2 + \sum_{i \in right} (y_i
    - \hat{y}_{right})^2

    ```


    where i left and i right indicate cases belonging to the left and right splits,
    respectively.


    The candidate split with the lowest sum of squares is chosen as the split for
    any particular point in the tree, so for regression trees, purity refers to how
    spread the data are around the mean of the node.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_304_0.png)


    Figure 12.6 How candidate splits are chosen for regression problems. The measure
    of purity is the sum of squares for the split, which is the combined sums of squares
    for the left and right nodes. Each sum of squares is the the vertical distance
    between each case and the predicted value for the leaf it belongs to.




    In this section, I’ll teach you how to define a k-NN learner for regression, tune
    the k hyperparameter, and train a model so you can use it to predict a continuous
    variable.'
  merge: -1
  img_proc: true
