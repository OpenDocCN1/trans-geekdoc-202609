- pgno: 195
  md: '+   - The intuition behind tree-building is quite simple, and each individual
    tree is very interpretable

    +   - They can handle categorical and continuous predictor variables

    +   - They make no assumptions about the distribution of the predictor variables

    +   - They can handle missing values in sensible ways

    +   - They can handle continuous variables on different scales


    The weaknesses of tree-based algorithm are:


    +   - Individual trees are very susceptible to overfitting, so much so that decision
    trees are now rarely used




    +   - The rpart algorithm is a supervised learner for both classification and
    regression problems

    +   - Tree-based learners start with all the cases in the root node, and find
    sequential binary splits until cases find themselves in leaf nodes

    +   - Tree construction is a greedy process, and can be limited by setting stopping
    criteria (such as the minimum number of cases allowed in a node before it can
    be split)

    +   - The Gini gain is a criteria used to decide which predictor variable will
    result in the best split at a particular node

    +   - Decision trees have a tendency to overfit the training set'
  merge: -1
  img_proc: true
