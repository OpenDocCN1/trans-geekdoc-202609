- pgno: 351
  md: "![](img/a22105d68c35e8d5bd3c7bafb4644881_351_0.png)\n\nFigure 14.6 The effect\
    \ of changing max_iter (row facets) and eta (column facets) using the default\
    \ values of theta and perplexity, on the final t-SNE embedding of the swissTib\
    \ dataset.\n\nSo now that we’re a little more clued up about how t-SNE’s hyperparameters\
    \ affect its performance, let’s run t-SNE on our Swiss banknote dataset. Just\
    \ like for PCA, I first select all the columns except the categorical variable\
    \ (t-SNE also cannot handle categorical variables), and pipe this data into the\
    \ `Rtsne()` function. I manually set the values of the perplexity, theta, and\
    \ max_iter hyperparameters (honestly, I rarely alter eta), and set the argument\
    \ `verbose = TRUE` so the algorithm prints a running commentary on what the Kullback–Leibler\
    \ divergence is at each iteration.\n\n# Listing 14.1 Running t-SNE\n\n```\n```r\n\
    swissTsne <- select(swissTib, -Status) %>%\n  Rtsne(perplexity = 30, theta = 0,\
    \ max_iter = 5000, verbose = TRUE)\n```\n```\n\n> **TIP**  By default, the `Rtsne()`\
    \ function reduces the dataset down to two dimensions. If you want to return another\
    \ number, you can set this using the `dims` argument.\n\nThat didn’t take too\
    \ long did it? For a small dataset like this, t-SNE takes only a few seconds.\
    \ But it gets slow quickly (see what I did there?) as the dataset increases in\
    \ size."
