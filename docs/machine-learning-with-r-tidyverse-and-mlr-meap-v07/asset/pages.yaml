- pgno: 26
  md: '# Core and optional packages of the tidyverse


    I''m going to teach you to use the tibble, dplyr, ggplot2, tidyr, and purrr packages
    of the tidyverse. These make up the "core" tidyverse packages, along with:


    +   - readr, for reading data into R from external files

    +   - forcats, for working with factors

    +   - stringr, for working with strings


    In addition to these core packages that can be loaded together, the tidyverse
    comprises a number of optional packages which need to be loaded individually.


    To learn more about the other tools of the tidyverse, see R for Data Science,
    by Garrett Grolemund and Hadley Wickham (O''Reilly Media, Inc., 2016).


    # 2.2 Loading the tidyverse


    The packages of the tidyverse can all be installed and loaded together (recommended):


    ```

    install.packages("tidyverse")

    library(tidyverse)

    ```


    or installed and loaded individually as needed:


    ```

    install.packages(c("tibble", "dplyr", "ggplot2", "tidyr", "purrr"))

    library(tibble)

    library(dplyr)

    library(ggplot2)

    library(tidyr)

    library(purrr)

    ```


    # 2.3 What the tibble package is and what it does


    If you have been doing any form of data science or analysis in R, you will surely
    have come across data frames as a structure for storing rectangular data.


    Data frames work fine and, for a long time, were the only way to store rectangular
    data with columns of different types (in contrast to matrices which can only handle
    data of the same type), but very little has been done to improve the aspects of
    data frames that data scientists dislike.


    > NOTE Data is rectangular if each row has a number of elements equal to the number
    of columns and each column has a number of elements equal to the number of rows.
    Data isn''t always of this kind!'
