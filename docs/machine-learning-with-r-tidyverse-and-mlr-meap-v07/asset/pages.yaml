- pgno: 327
  md: 'new variable is called the first *principal component*, often abbreviated as
    PC1. This process of centering the data and finding PC1 is shown in figure 13.2.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_327_0.png)


    **Figure 13.2** The first thing we do before applying the PCA algorithm is (usually)
    to center the data by subtracting the mean of each variable for each case. This
    places the origin at the center of the data. The first principal axis is then
    found, which is the axis that passes through the origin, and maximizes the variance
    of the data when projected onto it.


    The first principal axis is the line through the origin of the data that, once
    the data are projected onto it, has the greatest variance along it, and is said
    to "maximize the variance." This is illustrated in figure 13.3. The reason this
    axis is chosen is that if this is the line that accounts for the majority of the
    variance in the data, then it is also the line that accounts for the majority
    of the information in the data.


    ![](img/a22105d68c35e8d5bd3c7bafb4644881_327_1.png)


    **Figure 13.3** What it means for the first principal axis to "maximize the variance".
    The left-side plot shows a sub-optimal, candidate principal axis. The right-side
    plot shows the optimal, candidate principal axis. The data are shown projected
    onto each principal axis below their respective plots. The variance of the data
    along the axis is greatest on the right-side.


    This new principal axis is actually a linear combination of the predictor variables.
    Look again at figure 13.3. The first principal axis extends through the two clusters
    of cases, to form a negative slope between var 1 and var 2. Just like in linear
    regression, we can express this line in terms of how one variable changes, when
    the other variable changes (as the line passes through the origin,'
