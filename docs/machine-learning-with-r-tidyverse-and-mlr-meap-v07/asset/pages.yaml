    naive Bayes model to predict political party affiliation. Imagine you’re a political
    scientist. You’re looking for common voting patterns in the mid 1980s that would
    predict whether a USA congressperson was a Democrat or Republican. You have the
    voting record of each member of the House of Representatives in 1984, and identify
    16 key votes you believe most strongly split the two political parties. Your job
    is to train a naive Bayes model to predict whether a congressperson was a Democrat
