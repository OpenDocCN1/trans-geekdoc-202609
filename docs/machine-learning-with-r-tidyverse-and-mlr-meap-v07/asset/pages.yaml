- pgno: 160
  md: 'This is where SVMs become fun/difficult/painful depending on your problem,
    computational budget and sense of humor. We need to tune quite a lot of hyperparameters
    when building an SVM. This, coupled with the fact that training a single model
    can be moderately expensive, can make training an optimally-performing SVM take
    quite a long time. You’ll see this in the worked example in section 6.5.2.


    So the SVM algorithm has quite a few hyperparameters to tune, but the most important
    ones to consider are:


    +   - the kernel (shown in figure 6.6)

    +   - the degree hyperparameter, which controls how "bendy" the decision boundary
    will be for the polynomial kernel (shown in figure 6.6)

    +   - the cost or C hyperparameter, which controls how "hard" or "soft" the margin
    is (shown in figure 6.7)

    +   - the gamma hyperparameter, which controls how much influence individual cases
    have on the position of the decision boundary (shown in figure 6.7)


    The effect of the kernel function, and degree hyperparameters are shown in figure
    6.6. Note the difference in the shape of the decision boundary between the 2nd
    and 3rd degree polynomials.




    The higher the degree of polynomial, the more bendy and complex a decision boundary
    can be learned, but this has the potential to over-fit the training set.


    The cost (also called C) hyperparameter in soft-margin SVMs assigns a cost or
    penalty to having cases inside the margin or, put another way, tells the algorithm
    how bad it is to have cases inside the margin. A low cost tells the algorithm
    that it’s acceptable to have more cases inside the margin and will result in wider
    margins less influenced by local differences near the class boundary. A high cost
    imposes a harsher penalty on having cases inside the boundary and will result
    in narrower margins more influenced by local differences near the class boundary.
    The effect of cost is illustrated for a linear kernel in the top part of figure
    6.6.




    Cases inside the margin are also support vectors, as moving them would change
    the position of the hyperplane.


    The gamma hyperparameter controls the influence each case has on the position
    of the hyperplane, and is used by all the kernel functions except the linear kernel.
    Think of each case in the training set jumping up and down shouting "me! me! classify
    me correctly!" The larger gamma is, the more attention-seeking each case is, and
    the more granular the decision boundary will be (potentially leading to overfitting).
    The smaller gamma is, the less attention-seeking each'
  merge: -1
  img_proc: true
