- pgno: 33
  md: "# **EXERCISE 2.3**\n\nFilter your mtcars tibble to only include cases with\
    \ a number of cylinders (`cyl`) **not equal to 8**.\n\nNext, we would like to\
    \ *group* by individual plants and *summarize* the data to get the mean and standard\
    \ deviation of uptake within each group. We can achieve this using the `group_by()`\
    \ and `summarize()` functions, respectively.\n\nIn the `group_by()` function the\
    \ first argument is, you guessed it, the data (see the pattern here?), followed\
    \ by the grouping variable. We can group by more than one variable by separating\
    \ them with commas. When we print `groupedData`, not much has changed except we\
    \ get an indication above the data, that they are grouped, by which variable,\
    \ and how many groups there are. This tells us that any further operations we\
    \ apply will be performed on a group-by-group basis.\n\n# Listing 2.10 Grouping\
    \ data with the `group_by()` function\n\n```\n```r\ngroupedData <- group_by(filteredData,\
    \ Plant)\n\ngroupedData\n\n# A tibble: 66 x 4\n# Groups:   Plant [11]\n   Plant\
    \ Type Treatment  uptake\n   <ord> <fct> <fct>     <dbl>\n 1 Qn1   Quebec nonchilled\
    \  30.4\n 2 Qn1   Quebec nonchilled  34.8\n 3 Qn1   Quebec nonchilled  37.2\n\
    \ 4 Qn1   Quebec nonchilled  35.3\n 5 Qn1   Quebec nonchilled  39.2\n 6 Qn1  \
    \ Quebec nonchilled  39.7\n 7 Qn2   Quebec nonchilled  27.3\n 8 Qn2   Quebec nonchilled\
    \  37.1\n 9 Qn2   Quebec nonchilled  41.8\n10 Qn2   Quebec nonchilled  40.6\n\
    # ... with 56 more rows\n```\n```\n\n> **TIP**\n> \n> You can remove a grouping\
    \ structure from a tibble by wrapping it in the `ungroup()` function.\n\nIn the\
    \ `summarize()` function, the first argument is the data, and in the second argument\
    \ we name the new variables we’re creating, followed by an = sign, followed by\
    \ a definition of that variable. We can create as many new variables as we like\
    \ by separating them by commas, so in listing 2.11, I create two summary variables,\
    \ the mean of uptake for each group (`meanUp`) and the standard deviation of uptake\
    \ for each group (`sdUp`). Now when we print `summarizedData`, we can see that\
    \ aside from our grouping variable, our original variables have been replaced\
    \ with the summary variables we just created."
  merge: -1
  img_proc: true
- pgno: 34
  md: "# Listing 2.11 Creating summaries of variables using the `summarize()` function\n\
    \n```\nsummarizedData <- summarize(groupedData, meanUp = mean(uptake),\n     \
    \                        sdUp = sd(uptake))\n\nsummarizedData\n\n# A tibble: 11\
    \ x 3\n   Plant meanUp   sdUp\n   <ord> <dbl>   <dbl>\n 1 Qn1    36.1   3.42\n\
    \ 2 Qn2    38.8   6.07\n 3 Qn3    37.6  10.3\n 4 Qc1    32.6   5.03\n 5 Qc3  \
    \  35.5   7.52\n 6 Qc2    36.6   5.14\n 7 Mn3    26.2   3.49\n 8 Mn2    29.9 \
    \  3.92\n 9 Mn1    29.0   5.70\n10 Mc3    18.4   0.826\n11 Mc1    20.1   1.83\n\
    ```\n\nFinally, we will *mutate* a new variable from the existing ones to calculate\
    \ the coefficient of variation for each group, then *arrange* the data in order\
    \ of the new variable we just created. We can do this with the `mutate()` and\
    \ `arrange()` functions.\n\nFor the `mutate()` function, argument 1 is the data,\
    \ and the second argument is the name of the new variable to be created, followed\
    \ by an = sign, followed by its definition. We can create as many new variables\
    \ as we like by separating them with commas.\n\n# Listing 2.12 Creating new variables\
    \ using the `mutate()` function\n\n```\nmutatedData <- mutate(summarizedData,\
    \ CV = (sdUp / meanUp) * 100)\n\nmutatedData\n\n# A tibble: 11 x 4\n   Plant meanUp\
    \   sdUp    CV\n   <ord> <dbl>   <dbl>  <dbl>\n 1 Qn1    36.1   3.42    9.48\n\
    \ 2 Qn2    38.8   6.07   15.7\n 3 Qn3    37.6  10.3    27.5\n 4 Qc1    32.6  \
    \ 5.03   15.4\n 5 Qc3    35.5   7.52   21.2\n 6 Qc2    36.6   5.14   14.1\n 7\
    \ Mn3    26.2   3.49   13.3\n 8 Mn2    29.9   3.92   13.1\n 9 Mn1    29.0   5.70\
    \   19.6\n10 Mc3    18.4   0.826   4.48\n11 Mc1    20.1   1.83    9.11\n```\n\n\
    > **TIP** Argument evaluation in dplyr functions is sequential, meaning that we\
    \ could have defined the CV variable in the summarize() function by referencing\
    \ the meanUp and sdUp variables, even though they hadn’t been created yet!"
