- pgno: 247
  md: '# ## 9.4 Summary


    +   - Linear regression can handle continuous and categorical predictors

    +   - Linear regression uses the equation of a straight line to model relationships
    in the data as straight lines

    +   - Missing values can be imputed using supervised learning algorithms that
    use the information from all the other variables

    +   - Automated feature selection takes two forms: filter methods and wrapper
    methods

    +   - Filter methods of feature selection calculate univariate statistics outside
    of a model, to estimate how related predictors are to the outcome

    +   - Wrapper methods actively train models on different permutations of the predictors
    to select the best performing combination

    +   - Preprocessing steps can be combined together in mlr by sequential wrapping
    of wrapper functions'
  merge: -1
