  md: '![](img/a22105d68c35e8d5bd3c7bafb4644881_275_0.png)




    In this section I’ll show you what elastic net is, and how it mixes L2 and L1
    regularization to find a compromise between ridge regression and LASSO parameter
    estimates.


    Sometimes you may have a prior justification of why you wish to use ridge regression
    or LASSO. If it’s important you include all your predictors in the model, however
    small their contribution, use ridge regression. If you want the algorithm to perform
    feature selection for you by shrinking uninformative slopes to zero, use LASSO.
    More often than not though, the decision between ridge regression and LASSO isn’t
    a clear one. In such situations, don’t choose between them, use elastic net instead.


    > One important limitation of LASSO is that if you have more predictors than cases,
    it will select, at most, an equal number of predictors to the number of cases
    in the data. Put another way, if your dataset contains 100 predictors and 50 cases,
    LASSO will set the slopes of at least 50 predictors to zero!


    Elastic net is an extension of linear modeling that includes both L2 and L1 regularization
    in its loss function. It finds a combination of parameter estimates somewhere
    between those found by ridge regression and by LASSO. We’re also able to control
    just how much importance we place on the L2 vs the L1 norms using the hyperparameter,
    alpha.'
