    # RULES AND REGULATIONS FOR EXAM:


    There are a number of rules and regulations that are needed to be followed in
    order to conduct the exam peacefully. You need to pay close attention to them
    and know them so you don’t face any issue before and during the examination. The
    rules that are needed to be followed are listed below:


    +   \- Do not take any electronic device with you to the examination room.

    +   \- You do not need to take your watch along instead you will be provided with
    a countdown timer which would be placed on the top of your software. It would
    keep you updated about the time that elapsed and the time that is still left.
    This would help you manage your time well during the exam.

    +   \- You do not need to take your earplugs along with you, you will be provided
    with the earplugs in your test center.

    +   \- You cannot take any food or water with you to the room in which your test
    is conducted. You can on the other hand take your food and beverages to be stored
    in another room. If you feel like taking a sip of water or eat something, you
    can take a break and have some.

    +   \- You will have to keep your belongings and other stuff in a separate room.

    +   \- You will not be allowed to carry any personal stuff into the test area.

    +   \- You are also required to have your ID with you.

    +   \- The clock would be ticking. You will not be given a specially designated
    time for the breaks. So make sure you do not spend a lot of time while you are
    on break.

    +   \- You would not be permitted to access any electronic device like a watch
    or cellphone etc. in the other room as well. You can use them once the test is
    over.

    +   \- You cannot leave the test room alone. You will have to raise a hand and
    let someone from the people working there escort you to the restroom in case you'
