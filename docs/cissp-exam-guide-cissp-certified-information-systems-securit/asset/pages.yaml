    the actions taken.


    It can also affect all the previous certifications that you have done, (ISC)2
    can revoke all your previous certifications. Nor would they just revoke your previous
    certifications but also ban you from appearing into other certifications in the
    future.


    # THE POLICY FOR RETAKE:


    The retake policy for the examination would allow you some liberty. You would
    be given test-free days between the test and the retake test. You can further
    strengthen your concepts and make sure to prepare well for the examination during
    those days which you would get for the retake. It is a golden chance to work on
    your shortcomings in the previously conducted test and use them to your advantage.


    You can have multiple attempts to pass the examination. After the first take on
    the exam, you could retake the exam after thirty days. Those thirty days would
    be test free-days. If you fail the exam the second time and do not qualify for
    the certification you can retest after 60 days from the previous attempt. If you
    don’t pass the exam for the third time you would be given 90 days'
