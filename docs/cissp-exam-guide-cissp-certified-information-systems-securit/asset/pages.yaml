  md: '# Chapter 3: Course Contents


    # COURSE CONTENTS FOR THE CISSP EXAMINATION:


    The CISSP exam is conducted from 8 major domains of cybersecurity. These domains
    cover most part of cybersecurity. Once you have a grip over all the relevant material
    that would be a part of your examination you are good to go. It would not only
    benefit you for the examination but even if you don’t pass the examination you
    would still have acquired knowledge regarding the cybersecurity.


    The CISSP examination is 6-hour long. In order to become a certified CISSP professional
    you not only need to clear the examination with flying colors but also acquire
    relevant paid job experience in at least two or more domains of the (ISC)² curriculum.
    You will become a certified professional after getting done with these two prerequisites.


    In April 2018, the syllabus for the CISSP examination was updated as follows:


    Risk and safety management comprises about 15 percent of the CISSP examination.
    It is a diverse topic that lets you know about all the topics that are relevant
    to risk and safety management and gives you insights into what you need to know.


    Asset security comprises about 10 percent of the examination. All the topics that
    deal with the physical essentials of security are dealt with in this section.


    Safety engineering comprises 13 percent of the examination and covers all the
    data security theories.


    Network security comprises 14 percent of the examination and covers different
    approaches to handle network security.


    Identify and access management or IAM comprises 13 percent of the CISSP examination.
    It covers topics relevant to identification and authorization.


    Protection and security operations consist of 13 percent of the examination. This
    deals with the safety and security operations and gives you solutions on how to
    deal with such situations.


    Security of software development is also a part of the syllabus for the CISSP
    exam and it helps you have knowledge on how to deal with the applications and
    ensure their security.


    The people who are planning to give the exam will be judged and marked in these
    important domains. The exam has 250 MCQ’s that need to be completed in a six-hour
    time period. The passing score is 70 percent.


    # INTRODUCTION TO CYBERSECURITY:


    Before we move on to the course contents, let’s discuss the basic introduction
    that you should know about cybersecurity. If you would have ample knowledge regarding
    cybersecurity, only then you would be able to understand the domains from which
    the exam will be conducted.


    # CYBER THREATS:


    A cyber threat can be any malicious attack that is intended towards an individual
    or an organization by some other individual or organization. The attacker breaches
    the privacy for'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'personal gains or benefits. It is also known as information theft.


    # CYBERSECURITY:


    In order to stop and avoid such attacks, you need to have strong cybersecurity.
    This would make you able to protect your valuable information from such attackers.
    Cybersecurity is the protection of an individual or organization’s data from unauthorized
    access. Protection against the malicious threats can be handled by making security
    efficient systems that ensure the security of the data.


    # IMPORTANCE OF CYBERSECURITY:


    Securing large and voluminous data is the need of today’s world. Data is increasing
    day by day and the protection of this data from being misused is something that
    needs immediate attention. There may be sensitive data that you need to protect
    from the attackers highlights the importance of cybersecurity in a world where
    everyone is connected through the internet. With the use of the internet and devices
    that are connected through the internet the security of personal information is
    highly compromised. Thus it is very important to make the systems secure enough
    to stop any potential attack.


    # BASIC ELEMENTS OF CYBERSECURITY:


    Cybersecurity can be broken down into several elements. In order to maintain and
    ensure cybersecurity in any organization, all the elements need to coordinate
    with each other. Some of which are application security, data security, network
    security, end-user protection, etc. In order to maintain security and safety of
    the data you need to pay special attention to any loopholes that you may find
    in your system. Its these loopholes that the attackers exploit for their selfish
    purposes. A lot of research has been done on cybersecurity and how can you make
    sure that you are not leaving any loopholes behind but considering the facts it
    is a tricky business.


    # EVOLUTION OF CYBERSECURITY WITH TECHNOLOGY:


    Technology is evolving with every passing day, in order to make sure that as the
    technology evolves so does the cybersecurity. The storage devices such as laptops
    and cell phones have data that needs to be protected. Such a huge amount of data
    makes it very easy for the attacker to find an entry point and attack the data.
    Multiple entry points can make your system vulnerable and the attackers would
    not hold back to launch malicious attacks. You need to make sure that your cybersecurity
    is strong enough to handle the situation. Nowadays you find every person carrying
    a cell phone in their hand. This cell phone or whatever device they are using
    is connected to an internet access point. That internet access point is what the
    attackers and the hackers are targeting. Most of the security breaches occur due
    to these internet access points. To avoid being targeted by the attackers you
    should try not to connect your device to public access points. Cybercrimes can
    very negatively impact your organizations and their reputation, thus it is the
    job of the cybersecurity professional to design such programs so as to avoid such
    situations.


    # DOMAINS OF CYBERSECURITY FOR THE CISSP EXAMINATION:


    The list of domains of cybersecurity from which the exam is conducted is as follows:


    +   1. Cyber threats and System Security

    +   2. Cloud Security

    +   3. Network and Communicational Security'
  merge: -1
  img_proc: true
- pgno: 18
  md: '+   4. Assets and IoT Security

    +   5. Architecture of Cyber Security

    +   6. Protection and Safety Operations

    +   7. Identity and Access Management

    +   8. Software Development Security


    # 1. CYBER THREATS AND SYSTEM SECURITY:


    # CYBER THREATS:


    Cyber threats are very common nowadays. In today’s world, all the devices are
    connected to the internet which has made it very easy for attackers to launch
    an attack and pose threats to the user’s data.

    There are a number of cybersecurity threats that have been briefly explained below:


    +   - Malware is the most common type of cybersecurity threat. Malware is actually
    malicious software. It is malicious software that the attacker has created to
    damage the computer system of the potential user.

    +   - A virus is software that has malicious code embedded inside of it. This
    software is self-replicating and replicates itself when the user clicks on it.
    With each click of the user, the file keeps on replicating itself which ends up
    damaging and infecting the legitimate files on the host computer.

    +   - Trojan horses are a type of malware that is similar to legitimate software.

    +   - Spyware gains access to your computer system which is used to steal information
