  md: '# Chapter 1: Exam And Fee Structure


    # CISSP EXAMINATION:


    CISSP examination is carried out for CISSP certification. It leads you to become
    a certified professional in cybersecurity. The CISSP examination would make you
    judge your skills and abilities and how much more is it that you can add further
    to it. The first step towards the examination is to register for it. You can register
    yourself for the examination as follows:


    You need to register for the exam after you have evaluated yourself and see if
    you want this. The registration process is comparatively easy; it can be done
    by following the steps given below:


    +   - You can start with creating your account with the Pearson VUE. Pearson UVE
    is an administrator for all the exams that are conducted by (ISC)2. The administer
    is responsible for all the registered candidates globally.

    +   - After thorough research of what is the certification that is right for you
    and you'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'want to pursue, you will select the option of whatsoever certification you
    want to pursue.


    +   - After you choose your certification you would schedule test timings and
    choose the location where you want your test to be conducted with the Pearson
    UVE.


    Special accommodations at reasonable prices are also provided. If you are interested
    in that you can request for them for your examination through the (ISC)².


    # EXAM PATTERN:


    CISSP examination is a 6-hour long exam which is one of the first prerequisites
    to complete in order to become a certified cybersecurity professional.


    # TIME DURATION OF THE EXAMINATION:


    The 6-hour long paper has around 250 questions that are conducted from the 8 domains
    of the (ISC) 2-course curriculum. The questions are multiple-choice question types.
    6 hours are given to solve these 250 multiple-choice questions. The course contents
    are the 8 domains of cybersecurity which are needed to be thoroughly revised and
    well prepared for the examination.


    # CRETREIA FOR PASSING THE TEST:


    The examination is worth 1000 points. Out of these 1000 points you need to score
    at least 700 to pass the examination. Passing score for the examination is 70
    percent.


    # OTHER LAUNGAUGES IN WHICH THE TEST IS CONDUCTED:


    The test is conducted in a few languages. You can choose any language for your
    test to be conducted in as per your convenience. The other languages in which
    the test is conducted are listed below:


    +   - French

    +   - German

    +   - Brazilian Portuguese

    +   - Spanish

    +   - Simplified Chinese

    +   - Korean


    # TEST CENTERS:


    When you register yourself with the Pearson UVE you are allowed to choose the
    test center and the time availability as per your own convenience. You can choose
    whatever test center and the available time is suitable for you. You can also
    give your test in (ISC)² authorized PPC.


    # REQUIREMENTS FOR EXAMINATION:


    The examination has a few requirements that have to be met before you appear for
    it. You should be aware of all the requirements that are necessary for you to
    follow. This is very essential. This would make you able to know if you are eligible
    for the test or not?


    The requirements that need to be met are listed below:'
  merge: -1
  img_proc: true
- pgno: 11
  md: '+   - You need to have a 4-year college degree

    +   - You also need to have a paid job experience for at least 5 years in any
    2 of the 8 domains of cybersecurity

    +   - Educational credit satisfies one year of experience

    +   - If you are unable to qualify for the CISSP, you can instead become an associate
    of (ISC)² that would give you approximately 6 years to acquire the relevant job
    experience.


    # RECERTIFICATION:


    You can always recertify after you achieve your certification once. You are required
    to recertify every three years. Recertification can be done by earning the continuing
    professional education (CPE) credits. Along with the CPE credits you also need
    to pay the annual fee. After doing these two things you will be able to certify
    after every 3 years.


    # TRAINING FOR THE EXAMINATION:


    In order to have a better understanding of the examination and its course contents,
