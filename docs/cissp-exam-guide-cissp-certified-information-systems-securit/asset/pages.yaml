    percentages of courses that are included in both the CISSP linear examination
    and the computerized adaptive test are similar. The only difference between the
    two is that the computerized adaptive test is a little precise and efficiently
    evaluates your competency and knowledge. Before you appear for the examination
    you should know the difference between the two and also know which one better
    suits you to attempt. Accordingly, make a decision if you want to opt for the
    linear CISSP examination or the computerized adaptive test.


    # RESCEDULING AND CANCELLING OF THE EXAMINATION:


    You should be well aware of all the CISSP policies for rescheduling or canceling
    the exam as a whole. Having better knowledge of all these things would make you
    able to decide what is best for you. You would end up doing everything efficiently
    and won''t waste your time.


    Firstly, you should be very mindful of choosing when to schedule your test at
    the time of registration for your examination. At the registration time, you are
    given the liberty to choose when and where you would like to give your examination.
    But just in case you want to reschedule you should know about the process or rescheduling.
    After you register for your examination with the Pearson VUE you are given a time
    of 365 days in which you can reschedule for your exam. If you wish to reschedule
    or cancel your examination you need to make an appointment with the Pearson VUE.
    You need to contact the Pearson VUE at least 48 hours before your examination
    and let him know that you want to cancel or reschedule. 48 hours are required
    in case you are rescheduling or canceling your examination online, if you are
    rescheduling or canceling on the phone you need to contact the Pearson VUE at
    least 24 hours before the examination. The reschedule fee is $50 and the cancellation
    fee is $100. If you reschedule the Pearson VUE would deduct $50 from your examination
    fee and if you wish to cancel, then the Pearson VUE would deduct a 100 bucks.
    In case a time frame of 365 days has passed from your initial scheduling of the
    test and you did not appear, you would not be refunded any admission fee. Thus,
    you should appear within the given time of 365 days for the examination. You need
    to know all these things before the test. It is a part of your exam preparation.
    Along with your course contents you also need to know about all these things.
    They are as important as your course for the examination.


    # KEEP AN EYE ON THE UPDATES REGARDING EXAMINATION:


    There would be multiple updates that you need to keep an eye on before your examination.
