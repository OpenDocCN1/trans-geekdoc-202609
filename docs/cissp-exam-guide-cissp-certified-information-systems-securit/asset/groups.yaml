    do a task. If you keep on doing work and take no breaks you would get bored and
    then won''t feel like doing anything. So take breaks in between and help you refresh
    your mind. You can read a book in between or try going out for a walk.


    ## 6. TRY TO BE ORGANIZED:


    You should make a to-do list every day so you are more organized and know when
    is any important task coming up. It would make it easy for you to know about all
    the tasks and then you can prioritize them in a proper way as well. The organization
    would also help you not waste your time and you would know where your stuff is.
    You won''t go searching for it everywhere. Write down all the deadlines, all the
    work that is required of you so you do not waste your time. Organizing your daily
    tasks and your stuff really helps you manage your time well. The benefit of writing
    down the tasks and making to-do lists would make it easier for you to manage your
    tasks, you would know what time you have to do what, and according to that you
    will get the things done.


    ## 7. LEAVE THE UNIMPORTANT TASKS FOR LATER:


    Make your to-do lists and then evaluate and see what are the important tasks and
    what are the ones that are not important. When you evaluate that you can leave
    the tasks that are not important for later. You need to focus on the ones that
    are important and get done with them. If you see any extra and unimportant ones
    you can ask someone to get them done on your behalf or do them yourself in your
    free time. If you will get rid of the unimportant tasks and activities, you would
    get time for the ones that are genuine and important.


    ## 8. PLAN AHEAD:


    Planning ahead would greatly help you with time management. You would be able
    to manage your time well. Every morning you should make lists that would let you
    know if you have anything important for the day, sometimes you can get so busy
    and forget to do the important work. Planning a day ahead would help you with
    this as well.


    ## RESULTS OF POOR TIME MANAGEMENT:


    If you are unable to manage your time effectively you will have to face a lot
    of issues. Better time management would really make your life easy. If your time
    management is poor, you would face serious consequences. The consequences that
    you would end up facing because of your poor time management are discussed below:


    ### 1. POOR EFFICIENCY:


    Your work efficiency would become very poor if you are struggling with managing
    your time. A lot of important things would be left behind incomplete and affect
    your work in a negative way. If you are unable to manage your time properly while
    you are preparing for your examination. It would affect your preparation very
    negatively. You would not be able to cover the topics that are important from
    the examination point of view. You should be mindful of the fact that all the
    domains have a percentage of the course included in the examination and just because
