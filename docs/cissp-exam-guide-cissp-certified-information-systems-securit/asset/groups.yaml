    # Chapter 10: Time Management Tips And Tricks


    # TIME:


    Time is very precious and it shall not be wasted, there is nothing as precious
    as time. You need to value time, if you will learn how to value the time you will
    succeed in whatever that is you are striving for. Whatever you are striving for
    is the basic force that drives your passion.


    # TIME MANAGEMENT:


    In order to become a person who does not waste their time and who can effectively
    get done with all their chores on time, you need to start practicing and then
    slowly and gradually master the art of time management. It all comes down to you
    and how well you are at managing your time.


    # TIPS AND TRICKS FOR TIME MANAGEMENT:


    Valuing time is the sign of success, if a person values time he is considered
    to be a successful'
  - '[PAGE 62]


    person. Time waits for no one, it keeps on passing. Here are some tips and tricks
    that would help you with the time management in before and during the examination.


    # 1. SET GOALS:


    You need to set your goals first. If your goal is to become a certified CISSP
    professional, you need to work hard to achieve it. If you would not have goals,
    you would not be able to value time. You can only learn the importance and value
    of time when you have to achieve a lot when you have to strive for something you
    are passionate about. The goals that you would set for yourself to achieve shall
    be smart. You should try to set those goals for yourself that are attainable and
    measurable. You should set goals that are specific, measurable, attainable, relevant,
    and timely. You can compare your goals with these attributes. Your goals in the
    case of CISSP examination of cybersecurity are smart. Your goal to become a CISSP
    certified professional should be specific, you should know what you are trying
    to do. It is measurable because you can measure your success if you pass, you
    succeed and if you fail you don’t, it is clear. Your goal is also attainable;
    it means that you can achieve it. Your goal of being a certified cybersecurity
    expert is relevant nowadays and in the future. You should set the time limit in
    which you wish to achieve your goal. Once you do that it would become easy for
    you to attain it.


    # 2. PRIORITIZE YOUR TASKS:


    You should prioritize your tasks based on urgency and importance. Divide your
    tasks and then try to attempt those tasks that are of importance and relevance.
    Do not attempt to do the tasks that are of less or no importance because you would
    be wasting your time. And that is not how you manage your time. You can manage
    your time by prioritizing your tasks. Divide your daily tasks and then determine
    which ones are to be prioritized and which ones could be done later. You should
    divide the tasks into the following four categories:


    +   - IMPORTANT AND URGENT:


    The tasks which you think are urgent and the most important ones should be done
    on first priority basis. You should not delay these tasks and get them done as
    soon as possible.


    +   - IMPORTANT BUT NOT URGENT:


    These are those tasks which are important but not so urgent. You can decide as
    per your own convenience to get them done.


    +   - URGENT BUT NOT IMPORTANT:


    If there is any task that is urgent but not important so you can ask someone else
    to do them for you. You can do something else while you hand over that task to
    someone else.'
  - '[PAGE 63]


    +   • NOT URGENT AND NOT IMPORTANT:


    There may be tasks that are both not important nor are they expected to be done
    any time soon. You can set these tasks aside and do them later on. You do not
    have to leave your other important tasks to get these ones done. You can do them
    later some time.


    # 3. COMPLETE TASKS WITH IN A SPECI IC TIME:


    You can try to do your tasks within a specific time limit. You should not be spending
    the whole day doing one task only. Try to specify or set some time limit in which
    you would do that task. This would greatly help you in managing time and getting
    most of your tasks on your to-do list as soon as possible. Look at the tasks that
    you need to get done with and then allocate time to each task for the day. Every
    task would have allocated time in which it would get done. You wouldn’t be sitting
    and laying around the hold day doing just one task and leaving all the rest behind.
    You also need to allocate some time for the potential problems that could arise.
    You have to deal with those potential problems thus you have to set some time
    aside for it so you can deal with them and get those problems solved.


    # 4. POMODORO TECHNIQUE FOR TIME MANAGEMENT:


    Pomodoro technique is a great technique that would help you in time management.
    It is one of the most effective time management techniques. The Pomodoro technique
    helps you with procrastination. In the Pomodoro technique, you have to pick up
    a task that you have to do. Then you can set a timer and start doing that work.
    Set the timer for 25 minutes. In those 25 minutes do as much work as you can.
    When the timer ends, it’s time for you to take a break of 5 minutes. Don’t take
    long breaks. After the break ends you can start over the whole process again,
    continue to work on the same task that is still left to be done, or pick another
    one if that one has finished. Then again set a timer for 25 minutes and start
    working on the task. When the timer ends, take a short break of 5 minutes. Keep
    on repeating the process and get done with your tasks as much as possible. After
    4 continuous pomodoros, you can take a long break of 25 to 30 minutes. When you
    have set the timer for the task make sure you do not keep on pausing it, if once
    it starts it has to be completed. During those 25 minutes, you will not be allowed
    to respond to texts, pick up your phone, attend a call or check your emails. Concentrate
    on the task that you are working on. Don’t let these distractions lose your focus.
    You can do all these things in your break time. If you have a larger task to get
    done with and can’t be completed in 25 minutes. You should divide them into small
    tasks and then do each small task in a Pomodoro. This way you would be able to
