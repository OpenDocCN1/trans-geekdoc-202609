    # Chapter 9: After The Examination Is Conducted


    Just as there are important steps to keep in mind before the examination and during
    your examination, there are a few things s which you need to take care of after
    your exam is conducted. At the checkout time, your Pearson VUE would provide you
    with the unofficial results of the examination, afterwards official results would
    be emailed to you. If you have passed your examination you would be further guided
    on how you could complete your certification process.


    # RESULT POLICY:


    (ISC)2 has strict result policies. Before the pass or fail score is established,
    detailed and thorough statistics are done on the score data. The statistical analysis
    would need a minimum number of candidates. It’s considered to be a very exhaustive
    and critical process, if the number of people who took the test is more, more
    time would be needed to compile the result. The result could take at least 6 to
    8 weeks. The result that would be provided to you during your checkout time is
    going to be an unofficial result. The official result would not be provided right
    away instead it would be emailed to you after the statistical analysis on the
    score data. The unofficial result at the checkout time will be given to you by
    the Pearson VUE. The official results would take a long to be compiled because
    of the number of people who appeared for the test. If during the statistical evaluation
    your score is being affected, you will be notified by (ISC)2. Be very careful
    and mindful when you are taking your examination. If any irregularity is found
    before, during, or after your exam you would have to face serious consequences
    that could affect your overall result. If any irregularity is suspected, the (ISC)2
    will have to look over the situation and then take action accordingly. This could
    possibly result in either not grading the compromised paper or canceling the complete
    result. Whatever may deem appropriate to the higher authorities, such would be
    the actions taken.


    It can also affect all the previous certifications that you have done, (ISC)2
    can revoke all your previous certifications. Nor would they just revoke your previous
    certifications but also ban you from appearing into other certifications in the
