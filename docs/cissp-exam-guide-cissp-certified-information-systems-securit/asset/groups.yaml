    So to avoid such situations you should always try to plan and know when you have
    to do what. This way you wouldn’t have to face these confusing situations and
    the quality of your work would not be compromised and affected either. Everything
    would go smoothly.


    ### 5. POOR TIME MANAGEMENT REFLECTS NEGATIVELY:


    Your reputation can be greatly affected if you are unable to manage your time
    properly. It would reflect very negatively on your work. A client would trust
    you with their work and just because you cannot manage your time well, you would
    get late on delivering their work back late. Your work will be greatly affected
    because of this. Your reputation in a community would be greatly affected. It
    would bring you nothing but loss. When you are unable to deliver the work that
    the client has trusted you with, they would definitely take their business elsewhere
    because everyone wants their work to be delivered on time and you are causing
    delays just because you are unable to manage your time effectively. If you are
    able to manage your time well and don’t let any distractions distract you would
    notice a great difference in your schedule. You would end up completing your work
    on the assigned time. Not just that but you would also find some free time for
    yourself and you can do all the pending work in that time. You would be successful
    in managing your professional and personal work properly.


    ## TIME MANAGEMENT BEFORE THE CISSP EXAMINATION:


