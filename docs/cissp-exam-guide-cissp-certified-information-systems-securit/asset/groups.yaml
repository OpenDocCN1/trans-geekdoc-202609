    - 1. 复习你的课程：


    如果你要参加考试，最重要的事情就是备考。如果你没有准备，就不能期望考试会取得好成绩。所以首要的事情是充分准备你即将参加的考试。无论你能想出多少种考试策略，如果你没有准备好课程，世界上任何东西都无法拯救你。所以请确保你已经完全准备好了。在参加考试前，你已经复习了你的课程。


