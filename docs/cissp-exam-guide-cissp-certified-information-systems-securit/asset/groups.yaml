    outside would make you feel fresh like a daisy. It would make your mind feel at
    peace. So you should go out and have a little walk.


    # EXERCISE:


    If you cannot go out for a walk, try to do some light exercises to feel fresh.
    A few moves of exercise aren''t hurting anybody. You should do some physical activity
    on the morning of your examination.


    # MAKE YOURSELF THE BREAKFAST YOU ENJOY:


    You should have breakfast on the day of your examination.


    It is highly not advised for you to skip breakfast on the day when you need it
    the most. You can have something that you enjoy eating. The examination hours
    would be long and extensive thus you should make sure you eat from your home.
    This way you would not waste your time and take breaks from the exam to eat food.


    # THE TEST CENTER:


    You should leave for your test center on time. Wake up early and then leave for
    the center early so you can reach on time. Keep all the relevant documents in
    check. Make sure you have all the important documents that you might be needed
    for the examination. When you reach the test center, do not forget to take pieces
    that confirm your ID. You can prove your ID by either providing a signature or
    provide a palm vein scan. A palm vein scan can only be provided if it is approved
    by the laws. After proving your ID, you need to have a photo taken. You should
    not wear any hat or coat while you are taking a photo. Also, you are not allowed
    to carry any of your personal belongings to the room where your test would be
    conducted. You need to take off your coats, hats, scarves, etc. outside the test
    room because they are not allowed to be worn inside. The Pearson VUE doesn''t
    guarantee the safety of your personal belongings. Although you will be given access
    to secure storage spaces. These storage places are small and tiny so you should
    make sure that you do not carry any huge items with you.


    Afterward, you will be directed to the test room. The Test Administrator would
    first give you a brief introduction and carry out an orientation process. After
    the orientation by the Test Administrator, you will be taken to the computer terminal
    where you would give your test. Before you start your examination, you will be
    given 5 minutes to review and accept the non-disclosure agreement. If you do not
    accept the non-disclosure agreement (NDA) you would not be allowed to take the
    test. If you want to take the test you should sign the non-disclosure agreement
    before you start. By not signing the non-disclosure agreement you would not be
    allowed to claim for the fee refund. The examination fee will not be refunded
    back to you.


    # DOCUMENTS YOU NEED TO BRING ALONG:


    You need to bring some documents alongside you when you come for the test to the
    testing facility. The first and the most important thing that you have to bring
    along is an ID. You need to have a primary ID and a secondary ID. These IDs are
    necessary. You would also be asked for a palm vein scan before you enter the testing
    facility. If you do not prove your identity you would'
  - '[PAGE 55]


    not be allowed to take your cybersecurity examination.


    The ID''s that you will have to bring alongside need not to be expired. They should
    be valid and legitimate IDs. The documents that you would bring with you need
    to original and authentic. As far as the IDs are concerned you need to have a
    photo of you on your primary ID. The photo on your primary ID should be fixed
    in the document. It should also have your signature. The secondary ID on the other
    hand needs to have a signature whereas the primary ID needs to have both the picture
    and signature.


    The accepted primary IDs could be your identification card, birth certificate,
    driver’s license, passport, military ID, employee ID, school ID, credit card,
    military ID for spouse and dependents, etc.


    The accepted secondary ID could be your credit card, ATM card, debit card, U.S
    social security card, etc.


    A credit card could be used as your primary ID and secondary ID both, primary
    ID is anything that has your photo and signature and is valid. So if your credit
    card has both the picture and credit card it could be used as your primary ID.
    In fact, any card or piece of document which has both your picture and photo can
    be used as your primary ID. Both the primary and the secondary IDs are supposed
    to valid and not expired, they would not be accepted if they are expired.


    # BREAKS DURING EXAM:


    You should keep remaining in your seat. If the Team Administrator says that it’s
    okay to leave your seat and get up, only then you should leave your seat else
    be seated. If you want to go to the restroom you would be escorted by the team
    administrator. You will not be allowed to leave alone. You will have someone to
    come with you. You will not be allowed to change your terminal because that is
    also something that is not allowed. If there is some issue with the computer terminal
    you are using to give your test you can change it then, only as per the direction
    of the Test Administrator (TA).


    # ASSISTANCE DURING THE EXAMINATION:


    You should behave well with the staff that is working in the test center where
    you are giving your examination. You should not misbehave or create any unnecessary
    scenes in the test center. You should follow the rules. Make sure you know all
    the rules that are supposed to be followed at the examination center. If just
    in case you need something or want to leave your seat, raise your hand. Leave
    your seat only when the Test Administrator allows you to do so. Remain silently
    seated if he doesn’t allow. You can raise your hand and let your administrator
    know if there is an issue with your computer terminal if you need something, need
    the Team Administrator’s assistance, want to have a break.


    # BREAKS DURING EXAMINATION:


    The number of breaks that you can take during your test is as per your choice.
    There is no hard and fast rule regarding the number of breaks that you can take
    during your test. But you have to keep one thing in mind and that is that no matter
    how many times you take breaks, all those breaks would count against your time.
    The time required for you to complete the examination is 6 hours and you have
    to get done with it in 6 hours. So when you take a break absolutely clock doesn’t
    stop but keeps on ticking. You should try not to take too many breaks until absolutely
    do necessary. When you take a break you end up wasting your time and that is something
    you do not afford.'
