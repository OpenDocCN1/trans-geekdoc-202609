    the exam. You should shut your books and other relevant study material at least
    an hour before your exam starts, give some time to your mind and body to relax
    because that is a well-deserved time out of the stressful environment you have
    been in for the past few days.


    - 7. INCLUDE BREAKS:


    You should try to include breaks in your study schedule because you need some
    time where you can relax. That is important for your mind. Give yourself the time
