    is something that would drive you through your exam day. Your brain needs rest
    and due to your constant study schedules, it would be craving the rest that is
    needed for it to function well. So to have a better grip over your exam you should
    make sure you sleep for 8 to 10 hours a night before the examination. Avoid any
    study during that time.


    # EXAM DAY PREPARATIONS:


    You should know about everything in advance. You should know the whole procedure
    of the test. Try to limit the exam day surprises. Be prepared for everything that
    is going to happen. Let''s start with when you wake up on the day of your exam.


    # TAKE A WALK:


    It is the day of the test. You have been preparing for this for a long now. After
    weeks and months of extensive and exhaustive study, it is finally the day when
    you would give the exam. You should start the day on a happy note. Wake up early
    and go out for a nice walk. The effect this'
