    ## 成绩政策：


    (ISC)2 有严格的成绩政策。在确定及格或不及格分数之前，会对分数数据进行详细和全面的统计。统计分析需要最少数量的考生。这是一个非常详尽和关键的过程；参加考试的人数越多，编制成绩所需的时间就越长。成绩可能需要至少
