    ### CISSP 认证专业人员：


    (ISC)2 的 CISSP 考试是一项你可以参加并成为认证安全专业人员的考试。它是备受尊崇且广泛认可的考试之一，能真正为你的职业生涯加分。CISSP 安全专业人员考试于1994年推出。该认证已获国防部（DoD）批准。全世界不同国家的任何人都可以参加这项考试。该考试在114个国家的882个考点提供。该考试提供8种语言；你可以根据方便选择想要参加考试的语言。CISSP
    认证被认为是LinkedIn上最重要的认证之一。CISSP 专业人员获得认证后会将自己的技能付诸实践，目前他们在世界上近170个国家工作。约有142,000名专业人士获得认证，并凭借其专业知识帮助不同的组织。他们将在备考期间学到的所有信息付诸实践。这也是认证的先决条件之一：你需要在CISSP网络安全的8个领域中任何一个领域有将近5年的有偿工作经验。这为他们提供了专业经验，并进一步培养他们，使他们日后能够胜任全职工作。除了全职工作，他们还可以就不同组织面临的安全问题提供建议。网络安全是当今组织面临的巨大问题，这些网络安全专业人员帮助解决这些问题。他们为组织创建尖端的计划和程序，以应对攻击者和黑客发起的这些网络安全漏洞。CISSP
    计算机自适应考试也已推出，与线性网络安全考试相比，它更短且更精准。它包含近150道选择题。这些题目需要在3小时内完成。线性考试包含250道选择题，时长6小时。两项考试的课程内容和大纲相似，但各领域包含的百分比略有不同。(ISC)2
    的 CISSP 计算机自适应考试于2017年12月18日推出。


    ### CISSP 认证专业人员的福利与好处：


    考生在考试中取得足够分数通过测试，并获得相关工作经验后，即有资格获得认证。正式获得认证后，他们将成为 (ISC)2 社区的一员。该社区中还有其他获得 CISSP
    考试认证的网络安全专业人员。他们是非常有学问的人，在网络安全领域拥有多年经验。当新晋候选人成为这个社区的一员时，他们会接触到大量知识。这些专家会给他们提供非常好的建议，因为专家经验更丰富，而新获认证的人虽然可能有信息，但缺乏经验。除此之外，获得认证的网络安全专业人员还有许多其他福利和好处。


