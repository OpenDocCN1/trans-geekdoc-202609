    You have to take out ample amount of time to learn and prepare for all the domains.
    All the course contents are needed to be prepared for well.


    ### 2. YOUR PRECIOUS TIME GETS WASTED:


    Time is precious and you should not waste it and realize its importance. But if
    you are not good at time management you would end up finding yourself wasting
    your time. You would indulge in the distractions. While working if you cannot
    fight distractions that would make you waste your time a lot and you would not
    have enough time to get the other things done.


    ### 3. POOR TIME MANAGEMENT CAN CAUSE ANXIETY:


    If you are unable to manage your time properly you can face anxiety. If you plan
    ahead and make your to-do lists for the day you can avoid this because you would
    know what to do next but if you are unable to manage your time properly there
    would be constant confusion on what you would be doing next. You would not be
    prepared for whatever is to come next. Poor time management can make you feel
    anxious and confused at all times.


    ### 4. QUALITY OF WORK WOULD SUFFER:


    Poor time management can make you compromise on the quality of your work. You
    would not be prepared for whatever comes next, a constant feeling of anxiety and
    confusion would take over you and that would reflect on your work. It would bring
    the quality of your work down. Suppose you have scheduled your CISSP examination
    but get so busy with other stuff that you end up forgetting about it. You are
    not prepared well for it. On the 11th hour, you realize that you have an examination
    to take and you would end up rushing all the tasks that you are required to do
    before your examination, which would reflect on your results and decrease your
    exam score. On the other hand, if you have planned out everything, you would be
    prepared for it. That way you would know when is your exam scheduled. You would
