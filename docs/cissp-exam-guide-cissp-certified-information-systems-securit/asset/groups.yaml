    ## Chapter 7: Preparation Before Exam


    CISSP examination is conducted for certification as a professional in cybersecurity.
    Cybersecurity is the need of the day. The amount of data that the organizations
    have has increased multiple folds. You need to make sure that the data remains
    protected and secure from any malicious attack that can attempt to compromise
    it. The CISSP exam is a 6-hour long exam that covers the 8 domains of cybersecurity.


    Before you appear for your examination, you need to keep a few things in mind.
    You need to have a proper understanding of what the test is going to be about.
    You need to have enough knowledge about everything. You should be well informed
    about all the rules and regulations and make sure you follow them. You should
    be well prepared as long as the course for the examination is concerned.


    ### CISSP COMPUTERIZED ADAPTIVE TEST:


    You need to familiarize yourself with everything beforehand. You should be familiar
    with the computerized adaptive test. The computerized adaptive tests are common
    for English language candidates. These exams are conducted by the CISSP worldwide.
    The computerized adaptive test is somewhat similar to the linear CISSP examinations.
    The course contents for both the examinations are the same. The percentages of
    courses that are included in both the CISSP linear examination and the computerized
    adaptive test are similar. The only difference between the two is that the computerized
    adaptive test is a little precise and efficiently evaluates your competency and
    knowledge. Before you appear for the examination you should know the difference
    between the two and also know which one better suits you to attempt. Accordingly,
    make a decision if you want to opt for the linear CISSP examination or the computerized
    adaptive test.


    ### RESCHEDULING AND CANCELLING OF THE EXAMINATION:


    You should be well aware of all the CISSP policies for rescheduling or canceling
    the exam as a whole. Having better knowledge of all these things would make you
    able to decide what is best for you. You would end up doing everything efficiently
    and won''t waste your time.


    Firstly, you should be very mindful of choosing when to schedule your test at
    the time of registration for your examination. At the registration time, you are
    given the liberty to choose when and where you would like to give your examination.
    But just in case you want to reschedule you should know about the process of rescheduling.
    After you register for your examination with the Pearson VUE you are given a time
    of 365 days in which you can reschedule for your exam. If you wish to reschedule
    or cancel your examination you need to make an appointment with the Pearson VUE.
    You need to contact the Pearson VUE at least 48 hours before your examination
    and let him know that you want to cancel or reschedule. 48 hours are required
    in case you are rescheduling or canceling your examination online; if you are
    rescheduling or canceling on the phone you need to contact the Pearson VUE at
    least 24 hours before the examination. The reschedule fee is $50 and the cancellation
    fee is $100. If you reschedule, the Pearson VUE would deduct $50 from your examination
    fee; if you wish to cancel, then the Pearson VUE would deduct $100. In case a
    time frame of 365 days has passed from your initial scheduling of the test and
    you did not appear, you would not be refunded any admission fee. Thus, you should
    appear within the given time of 365 days for the examination. You need to know
    all these things before the test. It is a part of your exam preparation. Along
    with your course contents you also need to know about all these things. They are
    as important as your course for the examination.


    ### KEEP AN EYE ON THE UPDATES REGARDING EXAMINATION:


    There would be multiple updates that you need to keep an eye on before your examination.
    You should be aware of them; they are important. Keep checking the website for
    any latest updates regarding the examination. Turn on your mobile updates so you
    get updated on time. Multiple times, updates regarding the examination are announced,
    so make sure you remain updated.


    ### REVISE YOUR COURSE:


    Another important, in fact, the most important thing to do is to prepare well
    for your examination. You should have knowledge about all the course contents.
    Keep searching for the relevant material online, read books, and study thoroughly
    for the exam. You should revise all the important concepts and topics before you
    appear for the examination. The test is divided into different sections, each
    based on the 8 domains of cybersecurity. You should prepare for all the sections.
    If you miss out on any of the 8, you would end up losing marks. You cannot afford
    losing marks, thus you need to make sure you are well prepared for the examination.


    Cybersecurity is a vast topic. It keeps on evolving as technology evolves. Not
    just the books, but you also need to carry out your own research regarding all
    the latest technologies and trends that have been introduced with the everyday
    evolving technology. You should look up for them and know all the trends and technologies
    that are relevant to the cybersecurity domains. The exam also has 25 pre-test
    items. Those pre-test items are from the course contents. Thus, you need to make
    sure that you have researched the pre-tests because they are for research purposes.
    These pre-test items are not identified. Thus, you must answer all the items to
    the best of your abilities. This is all to check your competency and your abilities;
    thus, try to have knowledge of them and then make sure you do your best. If you
    work hard and do your best, there would be nothing that would stop you from passing
    the CISSP examination of cybersecurity in the first attempt.


    You should get ready for the assessment of your knowledge and abilities in your
    examination. If you go through the course outline and understand it, it would
    be able to make you decide on what cybersecurity skills and domains you need to
    work on and master them finally. Another important thing you need to do is to
    make sure that you are familiarized with all the scoring and testing of the examination.
    You should know details of how the scoring and testing is done in the examination.
    You also need to see and review what language you want your test to be taken in.
    For that purpose, review the candidate information bulletin by the (ISC)2. All
    the additional information that you wish to know would be stated in that candidate
    information bulletin. (ISC)2 provides all the information that is necessary for
    the candidates, but you have to learn how to access that information.


    ### REQUEST FOR SPECIAL ACCOMMODATIONS:


    If you need, you can apply for the (ISC)2 special accommodations. These special
    accommodations provided by the (ISC)2 are reasonable and appropriate; these are
    provided when the candidate requests for it. If you want to request the special
    accommodations for your test, you need to fill out an application form for accommodation
    and then return it back to the (ISC)2. The form is needed to be returned prior
    to the examination. The information that is required to be added in the form is
    mentioned below:


    - You need to mention your exam location as per your convenience.

    - You would be required to have the documents that are needed and support your
    request for accommodation.

    - You would also need to fill out the details of the accommodation that you are
    requesting for.

    - Also, you have to mention about the exam that you are about to take.


    The special accommodations for the test are individualized. They are dealt with
    case by case. After the case for special accommodations is dealt with and reviewed
    by the team, it is forwarded to the Pearson VUE accommodations. The information
    from the (ISC)2 to the Pearson VUE regarding the special accommodations for the
    candidates would take at least 2 to 3 business days. You need to make a call to
    the Pearson VUE after a few days and schedule your exam accordingly. Before you
    contact the Pearson VUE, it is advised you first call the (ISC)2. Refrain from
    scheduling the test with the Pearson VUE website or through the main phone line
