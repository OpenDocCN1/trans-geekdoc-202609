    in protein. Even if you don’t feel like eating something, still try to eat before
    you appear for the examination.


    - 5. HAVE A GOOD NIGHT SLEEP A NIGHT BEFORE:


    You should try to have a good night’s sleep before the test. Make sure you are
    well-rested and not sleepy. A good night’s sleep can do wonders for you, it will
    make your mind fresh and relaxed. If you are running on low sleep that could cloud
    your mind and you may end up doing damage to yourself. Thus, you should have at
    least 8 to 10 hours of sleep a night before your examination.


    - 6. TRUST YOUR PREPARATION:


    Avoid talking about the test or the preparation that you have done for it to anyone
    before you take your exam. Sometimes what you can do to relieve stress off your
    mind is to just not think about it or talk about it. Instead what you can do is
    to not think about it for some time and let your mind relax. You should trust
    your preparation and should keep on reminding yourself that you have done what
    was supposed to get done. Your preparation for the exam is complete. You should
