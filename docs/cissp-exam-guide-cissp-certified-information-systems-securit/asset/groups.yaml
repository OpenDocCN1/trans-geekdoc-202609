    # CISSP CRITERIA:


    CISSP examination has some criteria that are needed to be met. They are essential
    and important. After you meet the preset criteria you would be able to qualify
    for the CISSP examination. In order to qualify for the examination, you should
    be able to pass the examination, as well as you need to have relevant paid job
    experience. The job experience has to be in any of the eight domains of the (ISC)2
    CISSP common body knowledge. (CBK). If you are unable to have the experience that
    is required, you can become an associate of the (ISC)2. You can only be eligible
    to become an associate if you are able to pass the exam successfully. This would
    give the associate of the (ISC)2 to have six years in which they can gain the
    experience that is needed for the certification.'
