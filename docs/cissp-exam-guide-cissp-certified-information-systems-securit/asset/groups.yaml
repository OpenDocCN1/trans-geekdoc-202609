    +   - After you choose your certification you would schedule test timings and
    then choose the location where you want your test to be conducted with the Pearson
    UVE.


    Special accommodations at reasonable prices are also provided. If you are interested
    in that you can request for them your examination through the (ISC)².


    # 3. PREPARATION FOR EXAM:


    After your registration process for the examination, you need to start preparing
    for the exam. You need to look up all the past papers and the relevant resource
    material in order to prepare for the exam effectively. It is a tough exam that
    spans over 6 hours so you need to make preparations accordingly. You should have
    a great understanding and enough knowledge about all the eight domains from which
    the examination will be conducted.


    # 4. CERTIFICATION:


    This is the fourth step along your journey to becoming a certified CISSP professional.
    This is the step where you wanted to reach. This is what you wanted all along
    and now finally you have reached that point. This is the step where you get certified.
    After you pass your CISSP examination, you need to start working for your certification.
