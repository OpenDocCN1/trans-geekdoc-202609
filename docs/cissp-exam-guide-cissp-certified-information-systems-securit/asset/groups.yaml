    # CLOUD COMPUTING AND CYBER SECURITY:


    Cloud computing and cybersecurity may seem the complete opposite but they do have
    a connection between them. In cloud computing, you basically store your data off
    site and cybersecurity means protecting the data at all costs. Cloud computing
    is fundamentally outsourcing of your data, you trust these services by sharing
    your data and to store it for you. In cybersecurity, you trust the procedures
    and protocols that are made for the protection of your data that is stored on
    these remote servers.


    # IMPORTANCE OF CLOUD SECURITY:


    Many businesses are now transitioning to the cloud; they are more inclined towards
    storing their data on the cloud platform. The attackers have become more sophisticated
    and clever and the attacks that they launch are very difficult to identify. Thus,
    as much as the on-premises servers are at risk so is cloud computing service.
    Importance of cloud security is given below:


    +   - Cloud services follow the rule of centralization. All the applications and
    the devices that use the cloud services are centralized. So is the security centralized,
    all the security procedures that they use to ensure the security are centralized.
    It becomes very difficult for them to manage security protocols when there are
    numerous devices and endpoints like if a company has the bring your own device
    policy.


    +   - If you trust the cloud services with your data, you actually save yourself
    a great deal of money. It saves you from investing in dedicated hardware. It also
    helps in reducing administrative overheads.


    +   - Manual configuration becomes the talk of the past when you trust a cloud
    service provider that is reliable and trustworthy.


    +   - Your data is safe on the cloud and you can access it at any time on whatever
    device you want and wherever it is stored on the cloud.


    # RISKS OF CLOUD COMPUTING:


    Cloud computing comes with its own share of risks and challenges.


    +   - The first risk that the business owners could face is the challenge of multi
    cloud environment. There is not only one cloud present but multiple of them. The
    user needs to choose what cloud would they prefer to store their data on.


    +   - As there is a shared responsibility of the security between the business
    owners and the cloud service providers, it often ends up creating confusion.


    +   - One of the major challenges that could be faced in the cloud computing environment
    is the lack of visibility.


    +   - If the visibility features are not so strong you would never know how much
    of the data is affected and which of the client''s data is affected.


    +   - The data that is stored on the cloud needs an active internet connection.
    That means any person who is connected to the internet is susceptible to the risks
