- pgno: 216
  md: '# # CHAPTER 7

    # Random Forest Algorithm


    In the previous chapter, we discussed combining many models to form an ensemble.
    The decisions from the ensembles are better than those from the individual models.
    One type of ensemble model we discussed was the Bagging Ensemble Model, where
    we made multiple models using a single algorithm and trained each model on a different
    subset of the original dataset. This, each model sees only a part of the data
    while learning, and thus the collective decision of the ensemble is less biased
    and therefore makes better decisions on the new data instances.


    A particular case of the Bagging Ensemble Model is the Random Forest algorithm,
    where we make subsets of the original dataset by vertical and horizontal partitioning.


    ![](img/11af2c4c7dddfed06ed008516c0c6dfb_216_0.png)


    Figure 7.1'
  merge: -1
  img_proc: true
- pgno: 217
  md: "# Structure\n\nIn this chapter, we will discuss the following topics:\n\n+\
    \   - The algorithm\n  - The idea behind the Random Forest algorithm\n- Random\
    \ Forest implementation in Scikit-Learn\n- Detecting malware in ELF files\n  -\
    \ About ELF files\n  - About the data\n  - Building and testing the model\n\n\
    # Objectives\n\nAfter reading this chapter, the nuances of the Random Forest algorithm\
    \ will be clear. Further, we apply the Random Forest algorithm for classifying\
    \ malware in ELF files. The details of extracting information from ELF files will\
    \ be clear, and how to convert the information into a form that can be used for\
    \ machine learning will be clear.\n\n# The algorithm\n\nRandom Forest was created\
    \ by Leo Breiman of the University of California, Berkeley, in 2001. Random Forest\
    \ algorithm was initially made to solve classification problems. However, it can\
    \ be used for solving regression problems as well. The Random Forest algorithm\
    \ remains a very powerful and popular algorithm. The following is the abstract\
    \ of the paper by Breiman.\n\nRandom forests are a combination of tree detectors\
    \ such that each tree depends on the values of a random vector sampled independently\
    \ and with the same distribution for all trees in the forest. The generalization\
    \ error for forests converges to a limit as the number of trees in the forest\
    \ becomes large. The generalization error of a tree classifier depends on the\
    \ strength of the individual trees in the forest and the correlation depends between\
    \ them. Using a random selection of features to split each node yields rates that\
    \ compare favorably to Adaboost (Freund and Shapire [1996]) but are more robust\
    \ with respect to noise. Internal estimates monitor error, strength, and correlation\
    \ and these are used to show the response to increasing the number of features\
    \ used in the splitting. Internal estimates are also used to measure variable\
    \ importance. These ideas are also applicable to regression."
  merge: -1
  img_proc: true
- pgno: 218
  md: '# The idea behind the Random Forest algorithm


    The Random Forest algorithm is a modification of the Bagging Ensemble Model. In
    Chapter 6, Ensemble Model, we discussed that in Bagging Ensemble Model, we divide
    the original dataset into many subsets, selecting samples with random replacement.
    On each subset, we train a model using the same algorithm. Then, to make the prediction,
    we take the predictions from each model and select the class suggested by most
    models as the prediction.


    In Random Forest algorithm, we use Decision Tree algorithm to train the models
    in many subsets of the original dataset. There is a difference in creating subsets
    of the original dataset. In Random Forest algorithm, we create subsets such that
    each subset contains not only some of the data points from the original dataset
    but also each subset contains only some of the features from the original dataset.
    Further, the subsets are created such that each subset has the same label distribution
    as the original dataset.


    Figure 7.1 illustrates how subsets from the original dataset are created in the
    Random Forest algorithm:


    ORIGINAL DATASET (for illustration) Features

    | | x1 | x2 | x3 | x4 | x5 | x6 | x7 | x8 | x9 | y |

    |---|---|---|---|---|---|---|---|---||

    | 1 | | | | | | | | | |

    | 2 | | | | | | | | | | |

    | 3 | | | | | | | | | | |

    | n | | | | | | | | | | |


    SAMPLE SUBSETS OF THE ORIGINAL DATASET (for illustration)

    | x1 | x2 | x3 | x4 | y | x7 | x8 | x4 | y | x3 | x6 | x7 | y |

    |---|---|---|---|---|---|---|---|---|---|---|---|-|

    | k<n | k Datapoints each | | | | | | | | | | | | | |

    | | x4 | x5 | x9 | y | x7 | x8 | x1 | y | x5 | x4 | x6 | y |


    Figure 7.2: Illustration of how subsets are created from the original dataset
    in the Random Forest Algorithm'
  merge: -1
  img_proc: true
- pgno: 219
  md: "A few important points to note regarding the illustration in Figure 7.1:\n\n\
    +   - In the illustration, there are nine features in the original dataset. From\
    \ 9 features, we are creating subsets containing three features each. So, there\
    \ can be ${C_9^3 = \frac{9\times8\times7}{3\times2\times1}}=84}$. So, the random\
    \ forest algorithm can create 84 subsets containing three features from the original\
    \ dataset containing nine features. Now, it is optional that to create this model;\
    \ we create 84 subsets. We can control how many subsets we want the algorithm\
    \ to use. This point is highlighted by the Random Forest algorithm creates 100s\
    \ of subsets from the datasets in real-world applications. Each of such models\
    \ is called an **estimator**.\n- Each subset contains k data points where $k <\
    \ n$ (n being the number of data points in the original dataset). The k data points\
    \ in each subset are selected at random with replacement.\n- Note that the picture\
    \ of the data in the original dataset is repeated in each subset in the illustration.\
    \ This is when the subsets are created in the Random Forest algorithm, the distribution\
    \ of the labels in each should be as close to the distribution of the labels in\
    \ the original dataset.\n- On each of the subsets, a decision tree is trained\
    \ **without pruning**. So, in a model created using the Random Forest algorithm,\
    \ the prediction from each decision tree is collected, and the class predicted\
    \ by the maximum number of decision trees is the prediction from the model built\
    \ using the Random Forest algorithm.\n\n# # Random Forest implementation in Scikit-Learn\n\
    \nThe Random Forest algorithm is a Black Box algorithm. So, it is not easy to\
    \ simulate the algorithm through a walkthrough. Thus, we will discuss the parameters\
    \ we can set for creating a model using the Random Forest algorithm. We discuss\
    \ the parameters as available in the Scikit-Learn package. The same parameters\
    \ (maybe by another name) will be available in any other implementation.\n\nTo\
    \ solve classification models using the Random Forest algorithm, Scikit-Learn\
