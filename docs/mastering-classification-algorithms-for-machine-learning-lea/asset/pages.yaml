    # TF-IDF vectorizer


    For the data in Table Annexure 6.1, we understood that each text is considered
    a document. Within each document, each word is considered as a term.


    TF-IDF provides a mechanism to identify the most relevant documents for a term.
    The full form of TF-IDF is Term Frequency-Inverse Document Frequency. So, TF-IDF
    is a product of 2 terms, Term Frequency (TF) and Inverse Document Frequency (IDF).


    TF measures how frequently a term appears in a document. We compute a term’s TF
    as the number of times the term appears in a document divided by the total number
    of terms in the document.'
