- pgno: 263
  md: "# Structure\n\nIn this chapter, we will discuss the following topics:\n\n+\
    \   * The AdaBoost algorithm\n  * Walkthrough of the AdaBoost algorithm\n  * AdaBoost\
    \ algorithm for multi-class classification\n* AdaBoost algorithm implementation\
    \ in Scikit-Learn\n* Recognizing traffic signs\n  * About the data\n  * Building\
    \ and testing the model\n\n# Objectives\n\nAfter reading this chapter, you will\
    \ clearly understand the Boosting algorithm. Further, this chapter details how\
    \ to capture information from image files. And this chapter discusses the mechanisms\
    \ for making data from images useful for machine learning before it can be modeled.\n\
    \n# AdaBoost algorithm\n\n**Boosting algorithms** are also called Sequential ensemble\
    \ models. This is because, in the Boosting algorithm, we take the complete dataset\
    \ and train a model on that data. While any algorithm can be used to train a model\
    \ on the dataset, we use Decision Tree algorithm to train the models. Before we\
    \ train the model, we assign equal weight to each data point so that each data\
    \ point gets equal importance in creating the model. After training the model\
    \ on the complete dataset, we discover the mistakes in predictions made by the\
    \ model. By figuring out the mistakes made by the model, we assign weights to\
    \ the data points that data points where the mistake was made in making the prediction\
    \ get higher weights. This action of giving more weight to the data points where\
    \ errors were made in making predictions is called **boosting**.\n\nHaving boosted\
    \ the data points where mistakes were made, we trained another model using the\
    \ same algorithm in creating the first model. We then make predictions from the\
    \ new model. We, once again, find out the mistakes made by the new, and boost\
    \ the data points where mistakes were made to create a fresh model. We will repeat\
    \ this process until we have the least errors in the predictions from the last\
    \ model we train."
  merge: -1
  img_proc: true
