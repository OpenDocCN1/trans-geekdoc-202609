  md: 'In traditional programming, we have data and rules. We apply the rules to the
    data to get the Output. Refer to Figure 1.3:


    # Traditional Programming


    ![](img/11af2c4c7dddfed06ed008516c0c6dfb_23_0.png)


    Figure 1.3: Traditional Programming


    Consider this example from the world of Physics. When we want the computer to
    calculate the value of momentum, we tell the computer that the formula for momentum
    is multiplied by the velocity and tell the computer the value of mass and velocity.
    Here, the value of mass and velocity is the Data. On this data, the computer applies
    the Rule, that is, the formula for momentum, to find the momentum for us. The
    value of momentum calculated by the computer is the Output.


    Momentum = Mass * Velocity


    Momentum = mv


    Generally written as,


    In contrast to traditional programming, in machine learning, we supply the computer
    with Data and Output, and we expect the computer to generate the Rules as shown
    in figure 1.4:


    # Programming for Machine Learning


    ![](img/11af2c4c7dddfed06ed008516c0c6dfb_23_1.png)


    Figure 1.4: Programming for Machine Learning


    Suppose we had a mechanism to get values of momentum from some experiment. And
    we know the values of mass and velocity in each of the experiments. Now, if we
    want the computer to determine the formula for momentum, that would be a machine
    learning situation. So, we would input the values of mass, velocity, and momentum
    and tell the machine to determine the formula for calculating momentum.'
