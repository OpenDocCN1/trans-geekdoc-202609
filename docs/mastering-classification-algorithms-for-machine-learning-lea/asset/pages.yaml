    # # Matrix decomposition using SVD


    Let A be an m x n matrix with rank $r$. Then there exists an m x n matrix $\Sigma$
    for which the diagonal entries in $D$ are the first $r$ singular values of $A$,
    $\sigma_1 \ge \sigma_2 \ge \cdots \ge \sigma_r > 0$ and there exists $m \times
    n$ orthogonal matrix $U$ and $n \times n$ orthogonal matrix $V$ such that:


    ```

    A = U \Sigma V^T

    ```


    Any factorization $A = U\Sigma V^T$, with $U$ and $V$ orthogonal, as $\Sigma =
    \begin{bmatrix} D & 0 \ 0 & 0 \end{bmatrix}$ and positive diagonal entries in
    $D$, is called a singular value decomposition (SVD) of $A$. $U$ and $V$ matrices
    are not uniquely determined by $A$, by the diagonal entries of $\Sigma$ are necessarily
    the singular values of $A$. The columns of $U$ in such a decomposition are called
    left singular vectors of $A$, and the columns of $V$ are called right singular
    vectors of $A$.


    > Note: A Square Matrix for which the Inverse of the Matrix does exist is called
    a Singular Matrix. The Determinant of a Singular Matrix is always 0.

    Suppose A and B are two matrices of dimensions $n *$. If $AB = I = BA$, then A
    and B are non-Singular Matrix. Here, $I$ is the Identity Matrix, that is, a Matrix
    which has 1s in the diagonal elements and 0s on non-diagonal elements.


    Let us understand this example.


    Let us consider matrix A as defined below.


    ```

    A = \begin{bmatrix} 1 & 0 \ 1 & 1 \end{bmatrix}

    ```


    We can see that A is a 2 * 3 matrix, i.e., A has two rows and three columns. Using
    SVD, we will decompose A into three matrices $U$, $\Sigma$, and $V$ such that
    $A = U\Sigma V^T$ and $\Sigma = \begin{bmatrix} D & 0 \ 0 & 0 \end{bmatrix}$ where
    $D$ is a diagonal matrix with all positive elements.


    First, we need to find the singular values $\sigma_i$. As A is not a square matrix,
    we find the eigenvalues of $A^T A$, where $A^T$ is the transpose of matrix A.


    ```

    B = A^TA = \begin{bmatrix} 1 & 1 \ -1 & 1 \end{bmatrix} \begin{bmatrix} 1 & 0
    & -1 \ 0 & 1 & 1 \end{bmatrix} = \begin{bmatrix} 2 & -1 & 0 \ -1 & 1 & -1 \ 0
    & -1 & 2 \end{bmatrix}

    ```


    To find the eigenvalues of matrix B, we need to find a scalar $\lambda$ such that
    $(B-\lambda I) = 0$, where $I$ is an identity matrix. Determinant $(B-\lambda
    I)$ is written as $|B-\lambda I|$.'
  merge: -1
