- pgno: 314
  md: '# Singular Value Decomposition 295


    ```

    $B-\lambda I = \begin{bmatrix} 2 & -1 & 0 \ -1 & 1 & -1 \ 0 & -1 & 2 \end{bmatrix}-\begin{bmatrix}
    1 & 0 & 0 \ 0 & 1 & 0 \ 0 & 0 & 1 \end{bmatrix} = \begin{bmatrix} 2-\lambda &
    -1 & 0 \ -1 & 1-\lambda & -1 \ 0 & -1 & 2-\lambda \end{bmatrix}$

    ```


    $|B-\lambda I| = -\lambda^3 + 5\lambda^2 - 6\lambda = 0$ --- eq1


    If we solve the equation eq1, we will get three values for $\lambda$. These three
    values are the eigenvalues of the matrix B or $A^TA$.


    $\lambda = 0, 2, 3$


    Now we need to find the eigenvectors of matrix B or $A^TA$. We need to find a
    vector X such that $BX$ = eigenvalue for finding the eigenvectors. We so get:


    ```

    $\begin{bmatrix} 2 & -1 & 0 \ -1 & 1 & -1 \ 0 & -1 & 2 \end{bmatrix}X = \begin{bmatrix}
    x_1 \ x_2 \ x_3 \end{bmatrix} = 0$ ---eq2

    ```


    ```

    $\begin{bmatrix} 2 & -1 & 0 \ -1 & 1 & -1 \ 0 & -1 & 2 \end{bmatrix}X = \begin{bmatrix}
    x_1 \ x_2 \ x_3 \end{bmatrix} = 2$ ---eq3

    ```


    ```

    $\begin{bmatrix} 2 & -1 & 0 \ -1 & 1 & -1 \ 0 & -1 & 2 \end{bmatrix}X = \begin{bmatrix}
    x_1 \ x_2 \ x_3 \end{bmatrix} = 3$ ---eq4

    ```


    Solving the above three equations, we get the 3 eigenvectors follows. Let us solve
    the equation eq2.


    ```

    $2x_1 - x_2 + 0 = 0$

    $-x_1 + x_2 - x_3 = 0$

    $0 - x_2 + 2x_3 = 0$

    ```


    So, we have a system of 3 equations in 3 variables. Solving, we get $x_1 = 1,
    x_2 = 2, x_3 = 1$.


    So, the eigenvector is $\begin{bmatrix} 1 \ 2 \ 1 \end{bmatrix}$.


    Similarly, we can find the other two eigenvectors as $\begin{bmatrix} -1 \ 0 \
    1 \end{bmatrix}$ and $\begin{bmatrix} 1 \ -1 \ 1 \end{bmatrix}$.


    To find the matrix V, we take the eigenvectors and divide each eigenvector element
    by the eigenvector''s norm. The norm of an eigenvector is the square root of the
    sum of all the elements. So, the norm of the eigenvector $\begin{bmatrix} 1 \
    2 \ 1 \end{bmatrix}$ is $\sqrt{1^2+2^2+1^2} = \sqrt{6}$.$.'
