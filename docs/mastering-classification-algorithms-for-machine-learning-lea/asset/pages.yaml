- pgno: 187
  md: 'Mastering Classification Algorithms for Machine Learning


    The following are the details of the ensemble model implementations available
    in Scikit-Learn and the parameters that could be modified for tuning the models.
    We will not discuss the Boosting Ensembles here, as this will be discussed in
    Chapter 8, Boosting.


    The Scikit-Learn library has a separate module for ensemble models, sklearn.ensemble.


    # VotingClassifier


    In sklearn.ensemble, VotingClassifier is available to implement Voting ensemble
    models for classification. The essential parameter for the VotingClassifier class
    is estimators. Different estimators to be used in the Voting Ensemble Model can
    be provided in the estimators'' parameter:


    ```

    from sklearn.ensemble import VotingClassifier

    ...

    from sklearn.naive_bayes import MultinomialNB

    from sklearn.neighbors import KNeighborsClassifier

    from sklearn.tree import DecisionTreeClassifier

    ```


