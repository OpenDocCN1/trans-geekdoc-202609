    and JP Morgan Chase & Co. Apart from developing company systems, Partha managed
    highly profitable business units. He has set up three successful companies as
    of 2021 in India, Dubai, and Saudi Arabia.


    Partha has developed OLTP systems for Telcos, Hospitals, Tea Gardens, Factories,
    Travel Houses, Cricket tournaments, etc. Since 2012, Partha has been developing
    Data Products and intensively working on Machine Learning and Deep Learning. Partha
