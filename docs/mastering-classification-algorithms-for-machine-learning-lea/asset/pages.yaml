  md: '# Naïve Bayes Algorithm


    Note: A dataset is considered imbalanced if the number of data points in each
    class varies hugely. For example, suppose we have a dataset of spam emails containing
    1000 data points in 2 classes – spam and not spam. We would consider the dataset
    imbalanced if we have about 50-50% or 60-40% or 40-60% between data points for
    spam emails and not spam emails in the dataset. Otherwise, the dataset could be
    regarded as imbalanced.


    Any fraud dataset, like spam email, spam SMS, Credit Card fraud, etc., is heavily
    imbalanced. Fraud could happen once in a thousand or even a million transactions.


    # Categorical Naïve Bayes


    Categorical Naïve Bayes is used when all the independent variables are categorical.
    It can be used for classifying two or more target classes.


    # Gaussian Naïve Bayes


    Gaussian Naïve Bayes implementation, the likelihood function is:


    ```

    $P(X_i|Y) = \frac{1}{\sqrt{2\pi\sigma_y^2}} e^{-\frac{(x_i-\mu_y)^2}{2\sigma_y^2}}$

    ```


    where $\mu_y$ and $\sigma_y$ are the mean and standard deviations of the target
    class. Gaussian Naïve Bayes implementation is used when all the independent variables
    are continuous, and all the independent variables are distributed normally.


    Note: A distribution is said to be normal if it is evenly distributed around the
    mean and forms a bell-shaped curve. The distributions in Figures 2.1, 2.2, 2.3,
    2.4, and 2.5 are normally distributed.


    # Applying Naïve Bayes algorithm to detect spam SMS


    Short Messaging Service (SMS) is a service provided by Mobile service providers
    using which Mobile users can send messages to other Mobile users. Using SMS, mobile
    users can send a message which, at the most, contain 160 characters. The messages
