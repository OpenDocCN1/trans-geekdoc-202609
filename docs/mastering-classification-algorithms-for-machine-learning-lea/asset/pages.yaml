- pgno: 5
  md: '# Preface


    Creating models for Machine Learning is a time-consuming process involving hours
    of work on the machine to tune the models during the training phase. Every model
    has a mathematical foundation, meaning several hyperparameters must be altered
    before the final model can arrive. Understanding the mathematics behind every
    model makes it possible to formulate a scientific mechanism for trying different
    combinations of the hyperparameters to test. Also, understanding the mathematics
    behind the models helps understand how the different hyperparameters can be set
    so that the model converges relatively quickly.


    Another aspect is that all models do not suit all types of data. To understand
    which model can be suitable for building a model for a given dataset, one needs
    to understand the mathematical formulation of models.


    In summary, to be successful in building machine-learning models, understanding
    the mathematical formulations is vital. This book provides details of the mathematics
    of every machine-learning model for solving classification problems. The book
    starts with simple models and proceeds to state-of-the-art complex models. A detailed
    algorithm walkthrough is provided with demonstration data for every algorithm
    discussed in the book.


    Last, but not least, every chapter discusses an industry problem solved using
    machine learning. The book discusses applying classification algorithms to solve
    Spam Detection, Customer Segmentation, Disease Diagnosis, Malware Detection, Emotion
    Detection from Speech, and Image Classification.


    All the code in this book has been written in Python. Python is by far the most
    popular programming language for data sciences. However, users of other popular
    programming languages, including R, Scala, and Octave, can use this book as for
    the mathematics of the models remain the same.


    The main library used in this book is Scikit-Learn, which is by far the most popular
    library for machine learning. While Scikit-Learn is used for Python in this book,
    Scikit-Learn is also available for R language. I hope you will find this book
    informative and helpful.'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'Chapter 1: Introduction to Machine Learning - explains how machines learn.
    This chapter builds the need to understand that machine-learning models are essentially
    mathematical formulations. Different types of problems that can be solved using
    machine learning are discussed. The chapter uses examples to discuss Regression,
    Classification, Clustering, and Dimensionality Reduction problems.


    Chapter 2: Naïve Bayes Algorithm - presents a detailed discussion of this simple,
    powerful and popular algorithm. Naive Bayes is a probabilistic model and this
    chapter discusses the involved concepts of probability. As the Naive Bayes algorithm
    is a simplification of the Bayes Theory, this chapter discusses the need for simplification
    and the implications of the simplification. The Naive Bayes algorithm is applied
    to solving the problem of Spam Detection. This chapter ends with discussing the
    different metrics used to evaluate a model.


    Chapter 3: K-Nearest Neighbor Algorithm - discovers another simple, powerful and
    popular classification. The mathematical formulation of this algorithm is discussed
    in this chapter, along with the possible variations. The problem of Customer Segmentation
    based on Recency, Frequency, and Monetary Value (RFM) is solved using the KNN
    algorithm in this chapter.


    Chapter 4: Logistic Regression is the foundation of more complex algorithms, including
    Neural Networks. This chapter uses a simple example to explain the concept of
    Gradient Descent through a walkthrough. The concepts of the loss and cost functions
    are discussed in this chapter and will apply to the following chapters. Logistic
    Regression essentially conducts binary classification. This chapter discusses
    extending the core algorithm to conduct multi-class classification. This chapter
    ends with discussing how to classify the outcome of a medical diagnosis.


    Chapter 5: Decision Tree Algorithm is used in building many more complex algorithms.
    So, understanding the Decision Tree algorithm is vital. This chapter walks through
    the process of building decision trees using the Gini Index. Step-by-step calculations
    are demonstrated in the process. The chapter starts with a discussion of how the
    Decision Tree algorithm can be applied to detecting malware in JPEG files. Before
    the Decision Tree algorithm can be applied, we need to be able to extract information
    from the JPEG files and be able to formulate the data such that it can be used
    for applying a machine learning algorithm to it. The chapter includes a discussion
    on how unbalanced datasets can be balanced. Also, the chapter discusses how principal
    component analysis can be applied to reduce the data dimensions.'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'Chapter 6: Ensemble Models – discusses how many weak models can be combined
    to form a strong model. This chapter also discusses how ensemble models can be
    formulated, including Voting, Bagging, Boosting, and Stacking models. The chapter
    concludes with a discussion of how Emotions can be detected from Speech. To be
    able to do this, the chapter discusses how information from audio clips can be
    extracted and formulated for application to a machine learning model.


    Chapter 7: Random Forest Algorithm is a powerful and state-of-the-art algorithm
    in machine learning. It is a special case of the Bagging ensemble. This chapter
    discusses the formulation of the Random Forest algorithm and what makes the model
    free from bias and variance that works well on real-life data. The application
    for detecting malware in ELF files is discussed using the Random Forest algorithm.


    Chapter 8: Boosting Algorithm is another state-of-the-art algorithm for solving
    classification problems. This chapter walks through the AdaBoost algorithm using
    an example. AdaBoost algorithm primarily uses the Decision Tree algorithm as the
    core. So, the Decision Tree algorithm is revisited in this chapter. This chapter
    solves the problem of classifying images using the AdaBoost algorithm. As even
    a powerful algorithm like AdaBoost does not produce satisfactory results for video
    classification, the chapter concludes by introducing Neural Networks.


    Besides the eight chapters, the book has 8 annexures to supplement the discussions
    with necessary concepts.


    Annexure 1: Jupyter Notebook is the Integrated Development Environment (IDE) used
    to develop and run all the code discussed in this book. The files containing all
    the code discussed in this book are provided as supplementary material along with
    the book. All codes are in the form of Jupyter Notebooks. This annexure discusses
    the basics of the Jupyter Notebook.


    Annexure 2: Python is the programming language used in this book. This annexure
    introduces the basics of Python programming.


    Annexure 3: Singular Value Decomposition is one of the methods to reduce the data
    dimensions. This annexure discusses the mathematics behind Singular Value Decomposition
    (SVD) and shows an application of SVD to Image Compression.


    Annexure 4: Preprocessing Textual Data is one of the essential steps before data
    can be applied to machine learning. This annexure discusses the essential preprocessing
    steps for cleaning textual data.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '**Annexure 5: Stemming and Lamentation** are mechanisms applied in preprocessing
    textual data. This annexure discusses these techniques with examples.


    **Annexure 6: Vectorizers** are used to convert text data into numbers to be applied
    to machine learning models. Machine learning models can be built using only numeric
    data and thus, it is necessary to have a mechanism for converting text data into
    numbers. This annexure discusses two vectorizers – the Count Vectorizer and the
    TF-IDF Vectorizer.


    **Annexure 7: Encoders** are used to convert text data into numbers to be applied
    to machine learning models. Machine learning models can be built using only numeric
    data and thus, it is necessary to have a mechanism for converting text data into
    numbers. This annexure discusses various encoders.


    **Annexure 8: Entropy** is used in forming Decision Trees. Chapter 5 discussed
    how Decision Trees are formed using the Gini Index. This annexure provides an
    alternative method of forming Decision Trees using Entropy and Information Gain.'
  merge: -1
  img_proc: true
