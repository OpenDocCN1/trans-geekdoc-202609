    We can see that as we toss coin a greater number of times, the probability of
    getting a head tends towards 0.5 or 1/2.


    We would denote the event by a variable. So, let us say that the variable X represents
    our event. We want to find the probability that X = head. Then, we would write
    P(X = head).


    Under the assumption that all the outcomes of tossing a coin are equally likely,
    we can state that P(X = Head) = 1/2.


    # # Conditional probability


    Continuing with the example of tossing a coin and obtaining a head, let us say
    that we want to find the probability of getting two heads in 3 tosses, given that
    we have obtained a head in the first toss. So, we have two events. Let us denote
    the two events as X and Y. Y is the event where we have obtained a head in the
    first toss. Then, X will be the event of getting one head for the successive two
    tosses.'
