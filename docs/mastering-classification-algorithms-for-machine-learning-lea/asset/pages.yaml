  md: '# 164 Mastering Classification Algorithms for Machine Learning


    Now to make the subsets of data, we have two options. The first option is to create
    the subsets by sampling the original data set with replacement. When we create
    ensemble models using this this technique of creating subsets of data and using
    the same algorithm for creating the models, it is called Bagging ensemble models.


    The second option is to create subsets by sampling the original data set without
    replacement. Ensemble models created by using such a technique for creating subsets
    of the original data set and using the same algorithm for creating the models
    are called Pasting ensemble models.


    ![](img/11af2c4c7dddfed06ed008516c0c6dfb_183_0.png)


    Each of the subsets are created by randomly picking the data from the original
    data set. In Bagging/Pasting Ensemble Models, the same algorithm is used to create
    models using the data from one of the subsets


    Figure 6.3: Illustration of how data sets are formed for Bagging/Pasting ensemble
    models


    > Note: Let us understand sampling with replacement and sampling without replacement.
    Suppose we have a data set that contains the elements 1, 2, 3, 4, and 5. From
    this data set, let us say that we need to draw a sample with two elements. Suppose
    we pick 2 elements from this data set, and the elements are 1 and 4. Now, before
    we pick the next sample of 2 elements, if we put the elements 1 and 4 back in
    the data set and then sample, this would be called sampling with replacement.
    In other words, each time we sample from this data set, we would always make a
    selection from the original 5 elements in the data set. On the other hand, after
    we have picked our first sample containing 1 and 4, we do not put these elements
    back in the data set. Then, for the next sample, we have to select from elements
    2, 3, and 5. This is called sampling without replacement.'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'Bagging ensemble models can be created using any algorithm on different subsets
    of the original data set. However, the algorithm used primarily is the Decision
    Tree algorithm. When we make several decision tree models, we get many decision
    trees; thus, we call it a forest. Chapter 7, Random Forest Algorithm will explain
    a particular case of Bagging ensemble models. Random Forest Algorithm is an extremely
    powerful and widely used algorithm that provides high accuracy without overfitting
    the data.


    In the Bagging ensemble, each classifier is a weak classifier. This is primarily
    because each classifier is trained on limited data. Each classifier has a higher
    bias as they are trained on a smaller data set, and each classifier learns its
    data well. However, when the results of these classifiers are aggregated, the
    ensemble model has low bias and provides higher accuracy.


    > Note: One of the several advantages of the Bagging/Pasting ensemble model is
    for building these models we can use parallel computing. Thus, these modelling
    scales very easily.


    As we create subsets of data points by sampling at random with replacement, it
    is generally the case that several data points from the original data set do not
    make it to any of the subsets. About 63% of the data points make it to one of
    the subsets. So, we have about 37% of data points that are not used for creating
    the Bagging ensemble models. These data points are called Out-of-Bag data points.
    We can use the Out-of-Bag data points to test the Bagging models. Now, as the
    Out-of-Bag data points of the classifiers are never seen by the models, we can
    evaluate the Bagging Ensemble Models by assessing the accuracy of the predictions
    made.


    # Boosting ensemble model


    Unlike Voting ensemble models and similar to Bagging ensemble models, Boosting
    ensemble models use the same algorithm to train the model.


    Unlike Bagging Ensemble Models and similar to Voting ensemble models, Boosting
    ensemble models train the model on the complete data set.


    Boosting ensemble models are trained in sequence. The idea is that the model is
    trained on the data set, and the model finds out the mistakes it made in the predictions.
    Now, the model trains for a second time, to eliminate the mistakes it made the
    last time. After the second round of training, the model again finds out the errors
    in the predictions and trains a third time to eliminate these mistakes. This cycle
    is repeated until the model can no longer eliminate mistakes.


    We will discuss Boosting models in detail in Chapter 8, Boosting.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Stacking ensemble model


    The idea behind the Stacking Ensemble Model is that if we have multiple models
    built using different algorithms that produce good predictions, why not have a
    mechanism to choose the model that can make the best prediction? In other words,
    after training the model using multiple algorithms, we devise a means to select
    the model which can be trusted.


    Unlike Bagging Ensemble Models, where we use subsets of the original data set
    to train the models, in Stacking Ensemble Models, we use the complete data set
    to train the models. Unlike in Boosting Ensemble Model, where we use the same
    algorithm to train the models in a sequence, we use multiple algorithms to build
    the different models. Once the models have been constructed in the Stacking Ensemble
    Models, the algorithm uses another model to make the final prediction.


    In essence, the philosophy of the Stacking Ensemble Models is that instead of
    simple aggregation (like voting for classification or taking the average for regression)
    of the results from the different models created, we train an altogether separate
    model to make the prediction. The models used to train on the training data are
    called the **Base models** or **Level 0 models**. The model used for prediction
    is called the **Meta Model** or **Level 1 model.**


    We train the Base Models on the complete data set to meet this objective of the
    Stacking Ensemble Models. Then we take the predictions from these Base models
    and form a second data set (We sometimes combine this second data set with the
    original data set). We then train the Meta model on this second data set and make
    predictions from the Meta Model.


    Stacking Ensemble Models are appropriate when multiple algorithms have skills
    on a particular data set; however, each has different skills on the data set.
    What is meant is that algorithms produce models which make different errors on
    the training data, and the mistakes made by the different models are not much
    correlated. In Stacking Ensemble Models, the Base Models are generally built using
    complex algorithms like the Decision Trees algorithm, Random Forest algorithm,
    and so on. The Meta Model is usually made using simple algorithms like the Logistic
    Regression algorithm.'
  merge: -1
  img_proc: true
