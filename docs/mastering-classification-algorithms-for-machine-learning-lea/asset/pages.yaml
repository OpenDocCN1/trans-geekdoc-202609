    # Unsupervised learning


    Unlike supervised learning, in Unsupervised learning, we provide data to the machine
    without labels. Under these circumstances, the machine can perform two kinds of
    tasks – **Clustering** and **Dimensionality Reduction**.


    In Clustering, the machine can separate similar objects into separate clusters.
    Suppose we provide a vast volume of Customer information to the machine along
    with information regarding the customers on various attributes. By analyzing the
    attributes, the machine can form similar customer clusters. There are several
    uses for such applications. For example, in clustering customers, we can study
    the clustered customers and plan specific marketing drives for each cluster. Or
    when we have the clusters created by the machine, we can use that information
    to tell the machine'
