- pgno: 148
  md: '# Using Gini index to form a decision tree


    We will discuss the concept using an example.


    Consider that we have a dataset of 10 records with two independent and one dependent
    variable. Let the independent variables be x1 and x2. Let the dependent variable
    be y. Refer to the following table:


    | x1 | x2 | y |

    |---|---|--|

    | 1 | 4 | 0 |

    | 7 | 6 | 0 |

    | 1 | 6 | 0 |

    | 1 | 2 | 1 |

    | 5 | 2 | 1 |

    | 7 | 2 | 1 |

    | 5 | 4 | 0 |

    | 2 | 4 | 0 |

    | 1 | 7 | 1 |

    | 2 | 7 | 1 |


    **Table 5.1:** The raw data


    Consider the data in Table 5.1 that the dependent variable y has two values –
    0 and 1. So, the data has been classified into two classes – 0 and 1.


    If we plot the data in Table 5.1, we will get the graph as shown in Figure 5.1:


    ![](img/11af2c4c7dddfed06ed008516c0c6dfb_148_0.png)


    **Figure 5.2:** Graph of the data in Table 5.1'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Mastering Classification Algorithms for Machine Learning


    In Figure 5.1, the green triangles are for the data points where $y = 1$, and
    the red circles are for the data points where $y = 0$.


    The decision tree we want to form is to be able to decide the class of the data
    point (i.e., y) based on the values of the variables $x_i$ and $x_j$. So, we must
    make decisions based on what values of $x_i$ or $x_j$, we must take in which direction.
    To understand this, consider a dummy decision tree, as shown in Figure 5.2:


    ![](img/11af2c4c7dddfed06ed008516c0c6dfb_149_0.png)


    Figure 5.3: Dummy Decision Tree


    In Figure 5.2, we are deciding whether the data point (i.e., y) is 1 or 0 based
    on whether $x_i > 5$. So, to form the decision tree, we need to figure out all
    these questions which lead to the decisions.


    Now, the question is how we decide the conditions for the decision tree. We will
    use the Classification and Regression Tree (CART) algorithm. To apply the CART
    Algorithm, we use the Gini index.


    # Understanding Gini index


    Gini index is the measure of the impurity of a dataset.


    Mathematically, Gini index is stated as.


    > $Gini(t) = 1 - \sum P(i|t)^2$


    Where $i$ is all the unique classes in the dataset, and $t$ varies from 1 to the
    total number of classes in the dataset. $P(i|t)$ is the probability of class $i$
    occurring given $t$.


    For example, in the dataset shown in Table 5.1, the unique classes are 0 and 1.
    So, for calculating Gini index, i would have values 0 and 1. In this case, i varies
    from 1 to 2.


    For example, we consider the dataset as given in Table 5.1 (we will call this
    dataset d1). As there are two classes in the data, the Gini index would be calculated
    as


    > $Gini(d1) = 1 - (P(0|d1)^2 + P(1|d1)^2$'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'In dataset d1, we see 10 data points. 5 are for class 0, and 5 are for class
    1. So:


    $$P(0|d1) = 5/10 = 0.5$$


    $$P(1|d1) = 5/10 = 0.5$$


    So, Gini index for dataset $d1 = 1 - (0.5^2 + 0.5^2) = 1 - (0.25 + 0.25) = 1 -
    0.5 = 0.5$


    Notice that the term $\sum P(it)^2$ varies from 0 to 1. This is because probability
    can assume a value between 0 and 1. The term $\sum P(i|t)^2$ is a sum of probabilities
    of all classes in a sample space. So, the one extreme scenario is that only one
    class occurs in the dataset; its probability would be 1, and all other classes
    would have a probability of 0. In this case, $\sum P(i|t)^2$ would be 1. In this
    case, Gini index would be 0.


    The other extreme would be Gini index would be 1.


    A Gini index of 0 implies that the dataset is perfectly pure. A Gini index of
    1 means the dataset contains all the randomly distributed points. A Gini index
    of 0.5 indicates that all the classes in the dataset are equally represented.


    # Forming the decision tree using the CART algorithm


    CART forms binary trees using features and thresholds which yield the minimum
    Gini index.


    Let us first go through the mechanics of forming the decision tree using the CART
    algorithm.


    +   1. We calculate the Gini index of the dataset. If the Gini index of the dataset
    is 0, then the dataset is pure and needs not to do anything else.

    2. If the Gini index of the dataset in step 1 is not 0, we decide the possible
    points from our dataset where a decision can be made. These points are called
    thresholds. This implies that we analyze the independent variables and make a
    list of values from the data from the independent variables we can decide.

    3. We will calculate the loss for each of the thresholds decided in Step 2.

    4. From the loss calculated in step 3, the threshold(s) for which the loss is
    minimum, we would decide the data point where we would split.

    5. From step 4, we would get two datasets (as CART forms a binary tree). For both
    datasets, we will repeat all the steps.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# 132 Mastering Classification Algorithms for Machine Learning


    So, now we need to establish a loss function for the algorithm. The loss function
    (J) used in CART is as follows:


    ```

    $J = \frac{m_{left}Gini(left) + m_{right}Gini(right)}{m}$

    ```


    To form a decision tree using CART, we can find the points where the data can
    split into two branches. The dataset on the left-hand side of the split is represented
    in the loss function as left, and the dataset on the right-hand side of the split
    is defined in the loss function as right. $m_{left}$ is the number of data points
    in the dataset on the left-hand side of the split, and $m_{right}$ is the number
    of data points in the dataset on the right-hand side of the split. **Gini(left)**
    is the dataset''s Gini index on the split''s left-hand side, and **Gini(right)**
    is the dataset''s Gini index on the split''s right-hand side. **m** is the total
    number of data points in the complete dataset before splitting, so $m = m_{left}
    + m_{right}$.


    The technique establishes a list of data points from the feature variables where
    we will evaluate the split where the loss is the minimum to be used to split the
    data.


    To make the decision tree, we need to try various points for the features $x_1$
    and $x_2$ where we can split the decision. So, we compute the possible values
    of $x_1$ and $x_2$ where there could be a split. We will understand this concept
    using the data we have in Table 5.1.


    To compute the different values of $x_1$, we consider the range from the minimum
    value of $x_1$ to the maximum value of $x_1$. Then, we take points at equal intervals
    in this range. We find that $minimum(x_1) = 1$ and $maximum(x_1) = 7$. To avoid
    edge conditions, we will consider the upper limit of the range as $maximum(x_1)
    + 1$. So, the range for $x_1$ is 1 to 8. We will consider intervals of 0.5 in
    our range. So, the values of $x_1$ that we will try to use for splitting the decision
    are as follows:


    1.00, 1.50, 2.00, 2.50, 3.00, 3.50, 4.00, 4.50, 5.00, 5.50, 6.00, 6.50, 7.00,
    7.50


    Similarly, we consider the points of the variable $x_2$ for splitting the decision.
    We see that the $minimum(x_2) = 2$ and $maximum(x_2) = 7$. So, the range for $x_2$
    is 2 to 8. The values of $x_2$ that we will try to use for splitting the decision
    are as follows:


    2.00, 2.50, 3.00, 3.50, 4.00, 4.50, 5.00, 5.50, 6.00, 6.50, 7.00, 7.50


    The points we will consider for splitting the decision tree are called **thresholds**.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Decision Tree Algorithm 133


    Let us compute the loss for the threshold $x_1 = 1.00$. So, we split the dataset
    for $x_1 <= 1.00$, then the dataset on the left-hand side of the split and the
    dataset on the right-hand side of the split would look as shown in Table 5.2:


    | $x_1 \le 1.00$ | | $x_1 > 1.00$ | | |

    |---|---|---|---|---||

    | x1 | x2 | y | x1 | x2 | y |

    | 1 | 4 | 0 | 2 | 4 | 0 |

    | 1 | 6 | 0 | 2 | 7 | 1 |

    | 1 | 2 | 1 | 5 | 2 | 1 |

    | 1 | 7 | 1 | 5 | 4 | 0 |

    | | | | 7 | 2 | 1 |

    | | | | 7 | 6 | 0 |


    **Table 5.2:** The $m_{left}$ and $m_{right}$ dataset at split point $x_i \le
    1.00$


    From Table 5.2, we get that the number of data points on the left-hand side of
    the split is four, and thus, $m_{left} = 4$. Similarly, we get that, $m_{right}
    = 6$. Also, we get that $m = 10$. We must calculate $Gini(left)$ and $Gini(right)$.


    To calculate $Gini(left)$, we get the following from Table 5.2.


    ```

    $P(0|left) = 2/4 = 0.5$

    P(1|right) = 2/4 = 0.5$

    ```


    So, $Gini(left) = 1 - (0.5^2 + 0.5^2) = 1 - (0.25 + 0.25) = 1 - 0.5 = 0.5$


    To calculate $Gini(right)$, we get the following from Table 5.2.


    ```

    $P(0|right) = 3/6 = 0.5$

    P(1|right) = 3/6 = 0.5$

    ```


    So, $Gini(right) = 1 - (0.5^2 + 0.5^2) = 1 - (0.25 + 0.25) = 1 - 0.5 = 0.5$


    Now, we can calculate the loss at the threshold $x_1 = 1.00$.


    ```

    $J(x_1=1.00) = \frac{\frac{4*0.5+6*0.5}{10}} = \frac{2+3}{10} = \frac{5}{10}=0.5$

    ```


    Let us try one more example to understand the technique. Let us calculate the
    loss at the threshold $x_2 = 2.50$. So, we split the dataset for $x_2 <= 2.50$,
    then the dataset on the left-hand side of the split and the dataset on the right-hand
    side of the split would look as shown in Table 5.3:'
