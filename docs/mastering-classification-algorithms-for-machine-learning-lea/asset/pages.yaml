    Next, we extract Mel-frequency cepstral coefficients (MFCCs).


    In sound processing, the mel-frequency cepstrum (MFC) represents the short-term
    spectrum of a sound based on a linear cosine transform of a log power spectrum
    on a nonlinear mel scale of frequency.


    MFCCs collectively make up an MFC. They are derived from a cepstral representation
    of the audio clip (a nonlinear “spectrum-of-a-spectrum”). The difference between
    the cepstrum and the mel-frequency cepstrum is that in the MFC, the frequency
    bands are equally spaced on the mel scale, which approximates the human auditory
    system’s response more closely than the linearly spaced frequency bands used in
    the normal spectrum. This frequency warping can allow for a better representation
    of sound.


    Even higher order coefficients represent increasing levels of spectral detail,
    depending on the sampling rate and estimation method, 12 to 20 cepstral coefficients
    are typically optimal for speech analysis. The parameter n_mfcc is the length
    of the Fast Fourier Transformation (FFT) window.'
