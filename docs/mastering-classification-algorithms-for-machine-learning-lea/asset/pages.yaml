- pgno: 273
  md: 'We see that the predictions where x = 3, x = 6, and x = 7 made using the decision
    stump in Figure 8.5 on the dataset in Table 8.8 are incorrect. So, we get r =
    0.9. Now, we can calculate the value for alpha


    $$\alpha = 1 * ln^{\frac{1-0.9}{0.9}} = \ln^{\frac{0.1}{0.9}} = \ln\frac{1}{9}
    = 0.11 = -2.917.$


    We will stop the iterations. So, now we have the following:


    $$\alpha_1 = 1.386$. $\alpha_1$ is the weight in the final decision for the model
    from the first iteration.


    $$\alpha_2 = -2.917$. $\alpha_2$ is the weight in the final decision for the model
    from the second iteration.


    We will use this model created using the AdaBoost algorithm to make predictions.
    Suppose that our new data point has x = 4.5. Then, according to the first decision
    stump (Figure 8.3), y = 1 (we will refer to this as $p_1$), and according to the
    second decision stump (Figure 8.5), y = 0 (we will refer to this as $p_2$).


    We will use the following formula to decide the prediction for the data point
    x = 4.5.


    $$\tilde{y} = a1 * p1 + a2 * p2 = (1.386 * 1) + ((-2.917) * 0) = 1.386 + 0 = 1.386$$


    As the value of $\tilde{y}$ is greater than 1, we decide that y = 1 for x = 4.5.


    We test the model with one new data point. Suppose that our new data point has
    x = 1.5. Then, according to the first decision stump (Figure 8.3), y = 0 (we will
    refer to this as $p_1$), and according to the second decision stump (Figure 8.5),
    y = 0 (we will refer to this as $p_2$).


    We will use the following formula to decide the prediction for the data point
    x = 1.5.


    $$\tilde{y} = a1 * p1 + a2 * p2 = (1.386 * 0) + ((-2.917) * 0) = 0 + 0 = 0$$


    So, we decide that y = 0 for x = 1.5.


    We will make many decision stumps when we create a model using the AdaBoost algorithm.
    Let us say that we create n decision stumps. Then, we will have an alpha for each
    decision stump. Let us call the alpha for the $k^{th}$ decision stump as $\alpha_k$.
    Also, let us call the prediction from the $k^{th}$ decision stump for a new data
    point $p_k$. Then,


    $$\tilde{y} = \sum_{k=1}^{n}(\alpha_k * p_k).$$'
