  md: '# 344 Mastering Classification Algorithms for Machine Learning


    From Table Annexure 8.2, we get that the number of data points on the left-hand
    side of the split is 4, and the number of data points on the right-hand side of
    the split is 6. We compute the Entropy for the dataset on the left-hand side of
    the split and the dataset on the right-hand side.


    We get as follows for computing the Entropy for the dataset on the left-hand side
    of the split.


    ```

    $p_0 = \frac{2}{4} = 0.5 \text{ and } p_1 = \frac{2}{4} = 0.5$

    ```


    Using these values of $p_0$ and $p_1$, we calculate the Entropy for the dataset
    on the left-hand side of the split as follows.


    ```

    $Entropyleft = - ((0.5 * log_2(0.5)) + (0.5 * log_2(0.5))) = - ((0.5 * (-1.0))
    + (0.5 * (-1.0))\n= - ((-0.5) + (-0.5)) = 1$

    ```


    Similarly, we calculate the Entropy of the dataset on the right-hand side of the
    split as follows.


    ```

    $p_0 = \frac{3}{6} = 0.5 \text{ and } p_1 = \frac{3}{6} = 0.5$

    ```


    ```

    $Entropyright = - ((0.5 * log_2(0.5)) + (0.5 * log_2(0.5))) = - ((0.5 * (-1.0))
    + (0.5 * (-1.0))\n= - ((-0.5) + (-0.5)) = 1$

    ```


    Having computed the Entropy at the left-hand and right-hand sides of the split,
    we calculate the weighted average of the Entropy at this decision node. Note that
    on the left-hand side of the split, we have 4 data points, and on the right-hand
    side of the split, we have 6 data points. So as follows:


    ```

    $Entropy.0 = (\frac{4}{10} * 1.0) + (\frac{6}{10} * 1.0) = 0.4 + 0.6 = 1.0$

    ```


    Now that we have the values for $Entropy_{Root}$ and $Entropy_{x=1.0}$ we can
    calculate the Information Gain (GAIN) at the split point x = 1.0 as follows.


    ```

    $IGx=1 = EntropyRoot - Entropy.0 = 1.0 - 1.0 = 0$

    ```


    Using this mechanism, we can compute the Information Gain at all the split points
    we want to test, as shown in Figure Annexure 8.2:'
