    ![](img/11af2c4c7dddfed06ed008516c0c6dfb_200_0.png)


    Figure 6.8: Waveform of the Emphasized signal


    Next, we apply the Soft-Time Fourier-Transformation (STFT) to the audio signal.
    It is a Fourier-related transform used to determine the sinusoidal frequency and
    phase content of local sections of a signal as it changes over time. In practice,
    the procedure for computing STFTIs is to divide a longer time signal into shorter
    segments of equal length and then compute the Fourier transform separately on
    each shorter segment. This reveals the Fourier spectrum in each shorter segment.


    The parameter n\_fft is the length of the windowed signal after padding with zeros.
    The number of rows in the STFT matrix D is (1 + n\_fft). The default value, n\_fft=248
    samples, corresponds to a physical duration of 93 milliseconds at a sample rate
    of 22050 Hz, the default sample rate in librosa. This value is well adapted for
    music signals. However, the recommended value in speech processing is 512, corresponding
    to 23 milliseconds at a sample rate of 22050 Hz:


    ```

    stft = np.abs(librosa.stft(emphasizedSignal, n_fft = 512))

    ```


