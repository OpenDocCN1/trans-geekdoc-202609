    # # Reducing the number of features


    We see that we have nearly 40,000 features. This can be overwhelming. Also, this
    can cause the model to take much time to be built. The most important fact is
    that so many features cannot contribute effectively to the model.


    So, we need several features to retain only the essential features for building
    the model. We can achieve this by applying Principal Component Analysis (PCA).
    PCA is a technique where we create linear combinations of the features and arrange
    the features in the order of influence of the features. In other words, we arrange
    the features such that the most influential is kept first, followed by the next
    most influential feature.


    We will use the PCA implementation available in the Scikit-Learn library. The
    PCA implementation in Scikit-Learn uses Singular Value Decomposition (SVD). For
    more details on SVD, refer to Appendix 3.


    After applying PCA, we can determine how many variables explain how much variability
    in the data. It is sufficient to retain all the features which can explain about
    95% of the variability in the data. So, we apply PCA and check how many variables
    explain 95% of the variability in the data. Figure 5.7 shows that about 4,800
    principal components explain about 95% variability in the data. So, we will retain
    only 4,800 principal components from our dataset using PCA.


