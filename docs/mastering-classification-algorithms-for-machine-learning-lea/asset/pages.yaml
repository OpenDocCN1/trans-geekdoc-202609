- pgno: 315
  md: 'Similarly, the norm of $\begin{bmatrix} -1 \ 1 \end{bmatrix} = \sqrt{2}$ and
    the norm of $\begin{bmatrix} 1 \ -1 \end{bmatrix} = \sqrt{3}$.


    We need to order the eigenvectors in the same order as the eigenvalues. So, we
    get


    ```

    $V = \begin{bmatrix} 1/\sqrt{3} & -1/\sqrt{2} & 1/\sqrt{6} \ -1/\sqrt{3} & 0 &
    2/\sqrt{6} \ 1/\sqrt{3} & 1/\sqrt{2} & 1/\sqrt{6} \end{bmatrix}$

    ```


    To get the matrix $\Sigma$, arrange the eigenvalues in descending order. The square
    roots of the eigenvalues are the singular values of the matrix $A^\mathrm{T}$.
    So, create the matrix $\Sigma$ as follows. Here, $\sigma_1 = \sqrt{3}, \sigma_2
    = \sqrt{2}, \sigma_3 = 0$.


    ```

    $\Sigma = \begin{bmatrix} \sqrt{3} & 0 & 0 \ 0 & \sqrt{2} & 0 \ 0 & 0 & 0 \end{bmatrix}$

    ```


    We remove the last row from $\Sigma$ so that $\Sigma$ is non-singular. So, we
    get as:


    ```

    $\Sigma = \begin{bmatrix} \sqrt{3} & 0 \ 0 & \sqrt{2} \end{bmatrix}$

    ```


    If we represent $D = \begin{bmatrix} \sqrt{3} & 0 \ 0 & \sqrt{2} \end{bmatrix}$
    then we get $\Sigma = [D \ \mathbf{0}].


    We need to determine the matrix $U$ to complete the Singular Value Decomposition.
    When the rank of the matrix $A$ is $r$, then to construct $U$, we take the first
    $r$ columns of $U$ such that they are the normalized vectors $Av_{v_1}, Av_{v_2},
    ...$. Here, $v_1, v_2, ...$ and $v_r$ are the columns of matrix $V$.


    In our example, the rank of $A = min[2, 3] = 2$. So, we need to find $u_1$ and
    $u_2$, where $u_1$ and $u_2$ are the columns of matrix $U$. So, we get


    ```

    $u_i = \frac{1}{||Av_i||} Av_i$

    ```


    Now, $||Av_i|| = \sqrt{\lambda_i}$. So, we get


    ```

    $ui = \frac{1}{\sqrt{\lambda_i}} Av_i$

    ```


    So, we get


    ```

    $u1 = \begin{bmatrix} 1 & 0 \ -1 & 1 \end{bmatrix} \begin{bmatrix} -1 \ -1/\sqrt{3}
    \ 1/\sqrt{3} \end{bmatrix} / \sqrt{3} = \begin{bmatrix} 0 \ 1 \end{bmatrix}$

    ```'
