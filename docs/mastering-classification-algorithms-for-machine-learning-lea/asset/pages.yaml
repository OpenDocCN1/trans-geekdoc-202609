  md: "+   \n  * When we create the subsets of the data set using sampling without\
    \ replacement and apply multiple models built using the same algorithm, the model\
    \ is called Pasting Ensemble Model.\n\n+   * Boosting ensemble models apply a\
    \ model built using one algorithm on the complete data set and learns in a sequence\
    \ by trying to eliminate the errors made in the previous iteration.\n\n+   * In\
    \ Stacking ensemble models, we apply multiple models built using different algorithms\
