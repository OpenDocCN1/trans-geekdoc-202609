    # Conclusion


    As there are many applications where text modeling is performed, vectorizers are
    frequently used in machine learning. TF-IDF vectorizer is more prevalently used.
    While for simple applications, we also count vectorizer.


    We have discussed the concept and the working principles behind the vectorizers
    in this annexure. We saw how each word is used as a term, and the vectorization
    is performed. However, all the time, a word may not form a term. For example,
    a combination of 2 or 3 or 4 or more consecutive words may form a term when performing
    sentiment analysis. These combinations of 2 or more consecutive words'
