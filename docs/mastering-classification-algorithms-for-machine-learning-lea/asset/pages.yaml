    the split is three, and thus, $m_{left} = 3$. Similarly, we get that $m_{right}
    = 7$. Also, we get that $m = 10$.


    To calculate Gini(left), we get the following from **Table 5.3.**


    > $P(0|left) = 0/3 = 0.0$

    $P(1|left) = 3/3 = 1.0$


    So, $Gini(left) = 1 - (0.0^2 + 1.0^2) = 1 - (0.00 + 1.00) = 1 - 1.0 = 0$


