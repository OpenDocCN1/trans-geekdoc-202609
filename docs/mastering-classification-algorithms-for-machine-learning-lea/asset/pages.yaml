- pgno: 312
  md: '# # ANNEXURE 3

    # Singular Value Decomposition


    Data in any form used in Machine Learning is expressed as a Matrix. Various operations,
    like matrix addition, matrix subtraction, Hadamard multiplication, etc., are performed
    on these matrices to create the mathematicalatical model for machine learning.
    As we deal with thousands and millions of data points in tens and hundreds of
    features, the matrix operations must be optimized. So, we need to use Linear Algebra
    to make these operations feasible on the computers which we build the machine
    learning models.


    One of the needs for matrix operation simplification is to reduce the matrix size
    without loss of information from the original matrix. The **Singular Value Decomposition
    (SVD)** of a matrix is a technique for reducing the dimensions of a matrix while
    retaining the core information in the matrix.


    In this chapter, we understand SVD through the example of Image Compression.


    # # Structure


    In this chapter, we will discuss the following topics:


    +   - Matrix decomposition using SVD

    - Image compression using SVD'
  merge: -1
