    # About ELF files


    The information in the ELF files can be broadly classified into three types:


    +   - Data in the File Header


    +   - Data in the Program Header


    +   - Data in the Sections


    The ELF Files have 1 File Header, 1 Program Header, and many Sections of information.


    The Structure of the ELF Files is shown in the following figure:


    | ELF File Header |

    | Program Header |

    | .text |

    | .rodata |

    | .data |

    | Section Header |


    The illustration on the left shows the structure of the ELF Files in the memory
    of a machine when an ELF File is loaded for execution.


    Every ELF has only 1 File Header and only 1 Program Header. However, an ELF can
    have many sections and each section has a Section Header.


    .text is the program text of the program.


    .rodata is the Read Only data of the program.


    .data are the sections where all the transient data of the program are loaded.


    Figure 7.3: Structure of the ELF Files (Source: Wikipedia)


    # ELF File Header


    Every ELF has the first 2 bytes as 0x7F. By checking these 2 bytes, we can determine
    whether a file is a valid ELF File or not.


    The ELF Header defines whether to use 32- or 64-bit addresses. The header contains
    three fields affected by this setting and offsets that follow them. The ELF header
    is 52 or 64 bytes long for 32-bit and 64-bit binaries, respectively.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'The ELF File Header contains information on the target operating system. This
    information is stored in 1-byte. The target operating system can be any flavor
    of Unix, Solaris, HP-UX, NetBSD, Linux, et. There is also a byte in the ELF File
    Header that stores the version of the target operating system.


    There is a 2-byte information on the type of ELF File in the ELF File Header.
    The ELF file types can be Executable, Dynamic Linked Library, Core Dump, and so
    on.


    There is 2-byte information on the type of machine for which the ELF File has
    been built. The information is for SPARC, Intel 80860, NEX, Power PC, Digital
    Alpha, Hitachi, and so on.


    After all this information, there is a 4-byte pointer where the process should
    start execution. This is a very vulnerable point in the ELF File. The malware
    designers try to alter this pointer to the program to the memory location where
    the malware developers induce their code.


    Then, there is a 4-byte pointer to the Program Header. This is also a vulnerable
    point in the ELF Files for the same reason discussed earlier.


    There is a 4-byte pointer to the Section Header table. This is also a vulnerable
    point in the ELF Files for the same reason discussed earlier.


    Then there is a 4-byte pointer to the Section Header table. Following that, there
    is a 2-byte pointer to the size of the ELF File Header. This value must be 64
    bytes for the 64-bit format and 52 bytes for the 32-bit format.


    There is more information like the number of entries in the Program Header, the
    of the Section Header, etc.


    # Program Header


    The program header table tells the system how to create a process image. It is
    found in the file offset e_phoff, and consists of e_phnum entries, each with e_phentsize.
    The layout is slightly different in 32-bit ELF vs. 64-bit ELF because the p_flags
    are in a different structure for alignment reasons.


    The first information in the Program Header is the type of the segment, whether
    the segment is loadable, linkable, dynamically interpretable, auxiliary information,
    etc.


    The rest of the information in the Program Header are flags of 1 byte or 2 bytes.
    One can assume that tampering with this information will not interest the malware
    developers.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# Section information in the ELF File.


    There are many sections in the ELF File. Each Section is for a specific type of
    information. The types of sections can be program data, symbol table, string table,
    symbol hash table, dynamic linking information, dynamic linker symbol table, array
    of constructors, array of destructors, etc.


    For each section, there is information regarding whether the section is writable
    or executable, may be merged, contains null-terminated strings, etc.


    Then, there is information regarding the various addresses for the different information.


    So, this is a section where malware makers can alter various information.


