    these efforts have accelerated only in the last 15-20 years. This is mainly because
    the amount of data available has exploded in the last 15-20 years mainly because
    of the development of many digital devices and the advent of social media. To
    date, machines can be relied on for many prediction and prescription activities
    like Fraud detection, Weather forecasting, election forecasting, medical diagnostics,
    and so on. However, many developments are required before machines can become
    reliable in performing tasks on their own.'
