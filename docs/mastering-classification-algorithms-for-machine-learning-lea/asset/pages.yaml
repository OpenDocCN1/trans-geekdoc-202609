- pgno: 337
  md: '# Stemming


    Stemming is the Text Normalization technique that truncates a part of the word
    from the beginning or the end of the word. The part of the word that is truncated
    is called the affix. For example, if we stem the word “seeming”, we will get “seem”.


    Generally, stemming is a simple and effective text normalization technique. However,
    there are many instances where it may not give the desired result. For example,
    if we stem the word “seemingly”, we will get “seemingly”. Here, the meaning of
    the word, as would have been used in the sentence, would be lost with something
    irrelevant.


    For stemming, we can use the functions available in the library nltk. nltk stands
    for Natural Language Tool Kit. One popular stemming algorithm is Porter Stemmer.


    Here are some examples of stemming using Porter Stemmer. First, we need to instantiate
    the Porter Stemmer.


    ```

    from nltk import stem

    from nltk.stem import PorterStemmer

    ```


    ps = PorterStemmer()

    Once instantiated, we can use the instance of the Porter Stemmer for stemming
    words.


    ```

    ps.stem(''Seemingly’)

    ‘seemingly’

    ps.stem(''Seeming’)

    ‘seem’

    ps.stem(''caring’)

    ‘care’

    ps.stem(''boots’)

    ‘boot’

    ps.stem(''fishes’)

    ‘fish’

    ps.stem(''dangerous’)

    ```'
