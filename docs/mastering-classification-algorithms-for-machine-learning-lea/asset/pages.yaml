  md: '# Malware detection in JPEG files¹


    Now we apply the Decision Tree algorithm to detect malware in JPEG files.


    # The need


    Cybersecurity is paramount in the modern world for any government and any enterprise.
    Governments and enterprises are under constant cyber-attacks from all kinds of
    adversaries. It is said that the next war will be fought in the Cyber Space. So,
    it is of utmost importance to develop products and strategies to deal with the
    threat of cyber-attacks.


    One of the means of cyber-attacks is through malware. Malware is malicious computer
    programs embedded in the software of regular use. For example, an email may carry
    malware that can infect the machine of the receiver of the email and then spread
    across an enterprise.


    One ubiquitous file exchanged by people across the globe is images. The advent
    of social media has boosted the exchange of images. Images can be exchanged not
    only between 2 computers: but using devices like mobile phones, etc. Also, people
    tend to spread images across wide circles. So, developers of malware target embedding
    their malicious code into images to get much traction.


    # About JPEG files


    JPEG is the acronym for Joint Photographic Experts Group, which developed this
    standard for storing digital photographs in 1992. JPEG stores digital images in
    a compressed format. JPEG has its format. We will not get into the format of the
    JPEG Files in this chapter as we focus on machine learning. However, it is essential
    to note that in 2010 JPEG included a featured EXIF Tags which enabled adding additional
    information about the images in a JPEG File. Using EXIF Tags, it is now possible
    to


    +   1 Implementing Cybersecurity with Open-Source Software and Standard Architecture
    – River Publishers (Chapter 3)'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'have information about the JPEG images like the brightness of the image, aperture
    of the image, owner of the camera, lens make, image width & height, date when
    the image was created, date when the image was compressed and much more information.
    Each mentioned information is stored as an EXIF Tag in the JPEG Files.


    A significant thing about EXIF Tags is that most of the EXIF Tags can be altered
    using suitable software. The malware exploiters exploit this feature of JPEG Files
    and change the EXIF Tags to embed malicious code.


    One of the ways to remove malware from JPEG Files is to convert the JPEG Files
    to BIT MAP Image Files (also called BMP Files). BMP Files only store the image
    information and do not carry any EXIF Tags from the JPEG Files. So, significant
    information about the images is lost in converting JPEG Files to BMP Files.


    In summary, we analyze the EXIF Tags in JPEG Files, we can determine whether the
    JPEG File is clean or malicious.


    # The strategy


    EXIF Tags in the JPEG Files can contain values that are strings or numbers. While
    hackers manipulate the numbers, the more interest is in the strings, which generally
    have some code that the hackers want to be executed in the user’s machine. We
    now know that to make machine learning models; we must represent the strings as
    numbers using some vectorizer. So, what will we do is we collate all the EXIF
    Tags present in a JPEG File as a single string, and then we will vectorize this
    string.


    In Chapter 4, Logistics Regression Algorithm, we have discussed the TF-IDF Vectorizer.
    We will use the TF-IDF Vector to vectorize the string from the EXIF Tags extracted
    from each JPEG File in our dataset. Once we have the TF-IDF vectors, we will use
    them to create the Decision Tree model.


    # Building the model


    We will now discuss all the steps required for building the model for detecting
    malware in JPEG files.


    We start with defining constants. These constants will be required in the program
    units that follow. Using constants is a good programming practice as it allows
    for making changes to the program without having to make changes at multiple locations
    in the program.


