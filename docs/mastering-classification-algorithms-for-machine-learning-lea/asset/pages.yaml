    beta_{2}x_{i2}) - y_{i})) * 1$$\n$$\\$\\frac{\\delta J}{\\delta \\beta_{2}} =\
    \ 2 * \\sum_{i=1}^{m}(2 * ((\\beta_{0} + \\beta_{1}x_{i1} + \\beta_{2}x_{i2})\
    \ - y_{i}))$$\n```\n\nSimilarly, we can compute $\\frac{\\delta J}{\\delta \\\
    beta_{2}}.$\n\n```\n$$\\frac{\\delta J}{\\delta \\beta_{1}} = \\frac{1}{m} + 2\
    \ * \\sum_{i=1}^{m}(2 * ((\\beta_{0} + \\beta_{1}x_{i1} + \\beta_{2}x_{i2}) -\
    \ y_{i})) * (x_{i1}) * \\frac{\\delta \\beta_{1}}{\\delta \\beta_{1}}$\n```\n\n\
    ```\n$$\\frac{\\delta J}{\\delta \\beta_{2}} = \\frac{1}{m} * 2 * \\sum_{i=1}^{m}(2\
    \ * ((\\beta_{0} + \\beta_{1}x_{i1} + \\beta_{2}x_{i2}) - y_{i}) * x_{i2})$$\n\
    ```\n\nSimilarly, we can compute $\\frac{\\delta J}{\\delta \\beta_{2}}.$\n\n\
