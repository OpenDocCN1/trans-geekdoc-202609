    # Kinds of data machines can learn from


    From nature, human beings gather data through the five senses organs. We can see,
    hear, smell, taste, and feel. Out of these five types of data, human beings have
    been able to digitize what they see and hear. Likewise, machines can also understand
    data from images and sounds.


    Human beings has created a lot of digital data from various activities to perform.
    This data is either structured or unstructured.


    +   Structured data is organized in tabular form and follow definite semantics.
    It is by far the data most processed by machines. As of 2022, 80% of the data
    machines learn from structured data. Machines are extremely good with structured
    data. Also, machines are very useful in working on structured data as humans fail
    to cope with the volumes of structured data. Examples of structured data can be
    found in any system where some transactions are conducted. For example, the data
    regarding credit system transactions is structured. In a credit card system, millions
    of transactions are performed daily. Tasks like detecting fraudulent transactions
    are extremely difficult for human beings. So, here machines are best suited for
    the job.


    +   Unstructured data is a more recent phenomenon. This has mainly multiplied
    due to social media. Unstructured data has no definite semantics, so, such data
    must be expressed with some semantics before the years, many representations of
    unstructured data have emerged; thus, machines can work efficiently on such data.
    Examples of unstructured data include tweets and newspaper articles. Images and
    audio/video clips are also unstructured


    +   We also categorize data as semi-structured, containing portions of structured
    and unstructured data. For example, data from emails has a structure in that it
    contains structured information regarding the date the email was sent, who sent
    it, whom it was sent to, what the subject is, does'
  merge: -1
  img_proc: true
