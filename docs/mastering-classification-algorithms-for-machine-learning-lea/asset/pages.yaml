  md: '# Mastering Classification Algorithms for Machine Learning


    We would write this as P(X = 1 head in toss 2 to 3 | Y = head in toss 1). In regular
    work, we would write this as P(X|Y). This is read as the probability of event
    X, given that event Y has occurred. This is the conditional probability of event
    X occurring, given that event Y has occurred.


    Now, we could use the illustration in Table 2.2 to calculate the probability of
    getting two heads in 3 tosses. The possible combinations of outcomes of 3 tosses
    are given in Table 2.2. The highlighted rows are events of interest:


    | Possible Outcomes of a coin three times |

    | HHH |

    | HHT |

    | HTH |

    | HTT |

    | THH |

    | TTH |

    | THT |

    | TTT |


    Table 2.2: Possible outcomes on tossing a coin three times.\Highlighted rows are
    the outcomes of two heads obtained in 3 tosses


