    # SVD decomposition


    U, D, VT = np.linalg.svd(image, full_matrices = True)


    # Check for the bytes to be stored


    bytesToBeStored = sum([matrix.nbytes for matrix in [U, D, VT]])


    print("The matrix that we store has a total size (in bytes):",

