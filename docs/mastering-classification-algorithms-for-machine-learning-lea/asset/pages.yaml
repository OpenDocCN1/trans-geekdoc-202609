  md: '# # Classifying customers based on RFM analysis


    In Marketing management, one popular analysis is classifying customers based on
    **Recency, Frequency, and Monetary (RFM)** value, hence, this analysis is called
    RFM analysis. Here:


    +   - Recency refers to how recently a customer has made a purchase.

    - Frequency refers to how frequently the customer makes a purchase, or, in other
    words, how many times the customer has made a purchase in a period.

    - Lastly, Monetary value refers to what value was spent by the customer in a period.


    Marketing departments conduct the RFM Analysis to group similar customers so that
    they can plan targeted campaigns for each group, plan specific products for each
    group, or make other similar plans.


    From a retail store, the following data was gathered. Here, the RFM values of
    different customers were captured, and experts grouped the customers into 12 groups
    numbered 0 to 11. Let us look at the data first. The data link can be found in
