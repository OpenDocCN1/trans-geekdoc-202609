    # Conclusion


    In this chapter, we discussed a very powerful and popular algorithm for solving
    classification problems: AdaBoost. The AdaBoost Model which works in a sequence
    of iterations. In each iteration, the algorithm identifies the classification
    errors made in the previous iteration and tries to reduce the number of errors.
    This process continues until the algorithm can either find that the current iteration
    does not make any error in classification, or the algorithm can no longer reduce
    the number of errors.


    That is the end of this book. Refer to the annexures for details on related topics
    discussed in the chapters.


    Happy learning!


    # Points to remember


    +   - In Boosting Models, we create a sequence of models. For developing each
    model, we use the entire dataset initially. Also, each model is developed using
    the same algorithm.

    - In each iteration of the sequence, the Boosting models try to eliminate the
    errors in the prediction made made in the previous iteration.

    - AdaBoost is a powerful Boosting algorithm. AdaBoost is the short form of Adaptive
    Boosting.

    - In AdaBoost, generally, the algorithm used for training the individual models
    in the sequence is the Decision Tree Algorithm.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '+   - When we create models using the AdaBoost algorithm by implementing the
    Decision Tree algorithm to train each model, we create decision trees of depth
    1 (that is, containing only the root node and two leaf nodes). These decision
    trees are called Decision stumps.

    - In each iteration of the AdaBoost algorithm, we find the data points where there
    has been an error in making a prediction and boost these data points by increasing
    their weights. Also, we reduce the weights of the data points where the correct
    prediction has been made.

    - At each iteration, we calculate $\alpha$, which is the individual model''s weight
    in making the AdaBoost algorithm''s final decision.


