  md: 'At the end of this exercise, we will have several models. As we generally use
    the Decision Tree algorithm to train these models, we will have several decision
    trees at the end of the exercise. When we are presented with a new data point
    to make a prediction, we will subject the data point to all the decision trees
    we trained and get a prediction from each decision tree. Then, we will consider
    the decision of the decision trees. However, we will assign a weight for every
    decision of each decision tree.


    **Adaptive Boosting (AdaBoost)** is a robust boosting algorithm. This algorithm
    was formulated by Yoav Freund and Robert Schapire in 1995.


    Let us walk through an example to understand the AdaBoost algorithm.


