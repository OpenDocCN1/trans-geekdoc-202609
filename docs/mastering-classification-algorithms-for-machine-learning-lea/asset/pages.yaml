    # Lamentation


    Lamentation is the Text Normalization technique that conducts a morphological
    analysis of the word to find the lemma of the word. So, lamentation truncates
    the word based on the context in which the word is used.


    Lamentation is generally preferred over Stemming. In the examples of Stemming,
    we see that the words “Studying” and “Studies” when stemmed, give “studi”. This
    is not correct. This could be rectified by lamentation.


    Lamentation libraries are provided in **nltk**. We need to install and initiate
    these libraries before we use them.


    ```

    import nltk

    nltk.download(''wordnet'')

    from nltk.stem import WordNetLemmatizer

    wordnetLemmatizer = WordNetLemmatizer()

    Once instantiated, we can use the instance of the Porter Stemmer for stemming
    words.

    wordnetLemmatizer.lemmatize(''studying’)

    ‘studying’

    wordnetLemmatizer.lemmatize(''studies’)

    ‘study’

    wordnetLemmatizer.lemmatize(''crying’)

    ‘cry’

    wordnetLemmatizer.lemmatize(''cries’)

    ‘cry’

    ```'
