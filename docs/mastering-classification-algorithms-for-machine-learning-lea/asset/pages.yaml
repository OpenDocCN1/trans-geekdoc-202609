  md: 'Note: Discrete variables can assume a finitely finite number of values or a
    finitely infinite number of values. For example, if a variable can assume the
    values [0, 1], it is discrete as the number of values in the set is finitely finite.
    Suppose a variable can assume any natural number; it is also discrete as the number
    of values is finitely infinite. Discrete variables are also categorical variables.


    Continuous variables are variables that assume an infinitely infinite number of
    values. For example, if a variable can assume any rational number, it is a continuous
    variable, as the set of rational numbers is infinitely infinite.


    We can perform classification only if the target variable (or the dependent variable)
    is discrete. If the target variable is continuous, we can only perform regression.


    # Bernoulli Naïve Bayes


    Bernoulli Naïve Bayes implementation performs binary classification, that is,
    only two classes are in the dependent variable. For example, in the spam detection
    example, if the need is only to classify a message is a spam, Bernoulli Naïve
    Bayes implementation could be used. However, if there is a need to classify the
    nature of the spam-like Virus, Botnet, DDOS, etc., then there are more than two
    classes, and thus Bernoulli Naïve Bayes implementation cannot be used.


    # Multinomial Naïve Bayes


    Multinomial Naïve Bayes implementation allows for classifying two or more classes.
    Multinomial Naïve Bayes implementation works well if the independent variables
    are categorical or continuous. This variation works significantly better than
    the other variations in text data if vectorizers like TF-IDF Vectorizers and Count
    Vectorizers are used to create independent variables. Refer to Annexure 6 for
    details on Vectorizers.


    # Complement Naïve Bayes


    Complement Naïve Bayes implementation is a variation of the Multinomial Naïve
    Bayes implementation. Complement Naïve Bayes works well when the dataset is imbalanced.'
