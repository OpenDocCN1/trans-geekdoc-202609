    \ the Document\n\nFor example, in Table Annexex 6.1, the first document (Document\
    \ ID = 1) has 12\nterms, and \"Ice\" appears twice in the document. So, the Term\
    \ Frequency (TF) of\nt term \"Ice\" in the first document is TF = 2/12\n\nInverse\
    \ Document Frequency (IDF) measures the term’s importance in the corpus.\nThe\
    \ formula for calculating IDF is as follows:\n\n```\nIDF = log(Total number of\
    \ Documents in the corpus\nNumber of documents containing the term)\n```\n\nLet\
    \ us take two examples. First, let us calculate the IDF for the term \"ice\".\
    \ The total\nnumber of documents in our corpus (as the dataset in Table Annexex\
    \ 6.1) is 2.\nThe number of documents containing the term \"ice\" is 2. IDF=log(2)/2=log(1)\n\
    =0.\n\nNext, let us take the term \"parlor\". The total number of documents is\
    \ 2. The number\nof documents containing the term \"parlor\" is 1. So, IDFparlor=log(2)/2=log(2)=0.3010.\n\
    Notice if a term appears in more documents, the IDF for that term is smaller.\n\
    \nThe TF-IDF for a term is calculated as the product of the TF for the term and\
    \ the IDF\nfor the term. For example, TF-IDF = TF * IDF=2/12 * 0 = 0.\n\nThe TF-IDF\
