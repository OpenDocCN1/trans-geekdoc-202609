    \ and try again.\n\nTo compute the values of $\\beta_{0'}, \\beta_{1'}$ and $\\\
    beta_{2}$, we need the values for\\frac{\\delta J}{\\delta \\beta_{0}}, \\frac{\\\
    delta J}{\\delta \\beta_{1}}$ and $\\frac{\\delta J}{\\delta \\beta_{2}}$.\n\n\
    ```\n$$\\frac{\\delta J}{\\delta \\beta_{0}} = \\frac{1}{m} + 2 * \\sum_{i=1}^{m}(2\
    \ * ((\\beta_{0} + \\beta_{1}x_{i1} + \\beta_{2}x_{i2}) - y_{i})) + \\frac{\\\
    delta \\beta_{0}}{\\delta \\beta_{0}}$$\\n$$\\$\\frac{\\delta J}{\\delta \\beta_{1}}\
