  md: "Note that the column EncodedMaritalStatus contains numeric data equivalent\
    \ to the labels in the column MaritalStatus.\n\n# # One-Hot Encoder\n\nYou would\
    \ have noticed that we used the Label Encoder, assigned values of 0 to “Divorce”,\
    \ 1 to “Married”, and so on. These values of 0, 1, 2, and so on, can matter when\
    \ a model is made as two would have a higher value than 0 & 1 and a lower value\
    \ to 3, 4, 5, and so on. There are occasions when this can matter in making a\
    \ model or interpreting it.\n\nOne way to overcome this problem is to use One-Hot\
    \ Encoding. In One-Hot Encoding, we create a vector for every data point where\
    \ only one position has a value of 1 and all the other positions have a value\
    \ of 0. The one value is assigned to the position in the vector that it represents\
    \ the value we want to encode.\n\nLet us understand this through an example. Consider\
    \ the data in Table Annexure 7.1. We have a column called “Designation”. In the\
    \ column “Designation”, we have three unique values – “Director”, “Manager”, and\
    \ “Programmer”. When we use One-Hot Encoding in this column, “Designation”, we\
    \ will create a vector with three elements (as we have three unique values). In\
    \ the vector of 3 elements we will create, the first element will represent the\
    \ value “Director”, the second element will represent the value “Manager” and\
    \ the third element will represent the value “Programmer”. Suppose the vector\
    \ has the value [1, 0, 0]. In that case, it means “Director”. If the vector contains\
    \ the value [0, 1, 0], then it represents “Manager”. And if the vector has the\
    \ value [0, 0, 1], then it represents “Programmer”.\n\nIn the Scikit-Learn, the\
    \ library sklearn.preprocessing.OneHotEncoder has the implementation for One-Hot\
    \ Encoding. Let us examine its working.\n\nWe have the dataframe as pandas\n\n\
    ```\ndf = pd.DataFrame(data, columns = ['EmployeeID',\n\t'Name',\n\t'Designation',\n\
    \t'MaritalStatus',\n\t'NumberOfChildren'])\n```"
