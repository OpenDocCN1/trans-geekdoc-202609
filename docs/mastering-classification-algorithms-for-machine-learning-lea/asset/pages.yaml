    Now, we can use the librosa library to visualize the waveform in the audio files.


    Before we visualize the waveform, we need to load the audio clip. Audio clips
    are a time series with frequencies at different points in time.


    An audio time series is in the form of a 1-dimensional array for mono or in the
    form of a 2-dimensional array for stereo, along with a time sampling rate (which
    defines the length of the array), where the elements within each of the arrays
    represent the amplitude of the sound waves is returned by librosa.load() function.


    For Physics enthusiasts, the frequency and amplitude of a waveform are inversely
    proportional.


    librosa.load() functions an audio file and decodes it into a 1-dimensional array
    (for mono) which is a time series X, and sr is a sampling rate of X. Default sr
    is 22kHz:


    ```

    import librosa

    ```


    ```

    X, samplingRate = librosa.load(sampleAudio1)

    print(''\X\n'', X)

    print(''\nnNumber of elements in X:'', len(X))

    print(''Sampling Rates:'', samplingRate)

