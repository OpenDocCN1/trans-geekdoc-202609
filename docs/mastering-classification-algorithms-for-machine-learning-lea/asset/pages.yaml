    that the values for all the independent variables are in a similar range. For
    scaling the data, we use the package where `StandardScaler()` class is available
    in Scikit-Learn. Notice that the package where `StandardScaler()` is present in
    `sklearn.preprocessing`.


    When we use the `StandardScaler()`, we must first fix the model with the existing
    data. In the case of `StandardScaler()`, we invoke the `fit()`, method and standard
    deviation values for the data are calculated. Once the data''s mean and standard
    deviation are available, we can call the `transform()` method to calculate the
    z-values for each data item. An alternate method (the one used here) is to call
    the method `fit_transform()`. The `fit_transform()` method first performs the
    `fit()` operation and then executes the `transform()` method.


    ```

    from sklearn.preprocessing import StandardScaler


