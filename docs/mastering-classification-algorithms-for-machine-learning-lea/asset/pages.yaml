    \ for $\beta_{0'}, \\beta_{1'}$ and $\beta_{2'}$\n\n```\n$$\\beta_{0'} = \\beta_{0}\
    \ - \\alpha \\frac{\\delta J}{\\delta \\beta_{0}}$ where $\\frac{\\delta J}{\\\
    delta \\beta_{0}}$ is the partial derivative of J with respect to $\\beta_{0}$,\
    \ and $\\alpha$ is a hyperparameter called the learning rate.\n```\n\n```\n$$\\\
    beta_{1'} = \\beta_{1} - \\frac{\\delta J}{\\delta \\beta_{1}}$ where $\\frac{\\\
    delta J}{\\delta \\beta_{1}}$ is the partial derivative of J with respect to $\\\
    beta_{1}$\n```\n\n```\n$$\\beta_{2'} = \\beta_{2} - \\frac{\\delta J}{\\delta\
    \ \\beta_{2}}$ where $\\frac{\\delta J}{\\delta \\beta_{2}}$ is the partial derivative\
    \ of J with respect to $\\beta_{2}$\n```\n\nWe repeat steps 3, 4, and 5.\n\nLet\
    \ us understand the preceding strategy with some numbers.\n\nLet us consider that\
    \ we start with $\\beta_{0'}, \\beta_{1'}$ and $\\beta_{2}$, set as 2.\n\nWe can\
    \ compute J as follows. From Figure 4.6, we get J = 7,967.58.\n\nAs J > 0 (threshold),\
