    # Conclusion


    In this chapter, we have discussed the first mathematical model that can be used
    to train a computer. The Naïve Bayes Algorithm is a simple algorithm to implement.
    However, its utility is limited because it assumes that the events are independent,
    which is rarely practical. However, Naïve Bayes Algorithm can be applied to the
    data as the first model for classification to understand the data.


    In the next chapter, we discuss another simple mathematical model, i.e., the K-Nearest
    Neighbor algorithm.


    # Points to remember


    +   * The probability of an event is the ratio of the number of favorable outcomes
    and the total number of outcomes.

    * The Conditional Probability of event A, when event B has already occurred, is
    written as P(A|B).

    * The Multiplication Rule of Probability states that if A and B are two events,
    P(A, B) = P(B|A) * P(A).

    * Two events, A and B, are independent if P(A|B) = P(A).

    * Total Probability Theorem states that if Xi, X₂, ..., Xn and Y are events in
    the same sample space and if Xi, X₂, ..., Xn are disjoint events, then P(Y) =
    Σᵢ=1 P(Y|Xi) * P(Xi).'
