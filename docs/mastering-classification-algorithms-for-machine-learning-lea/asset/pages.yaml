    \ | 0.025 | 0.400/1 = 0.400 |\n| 8 | 1 | 0.1 | 0.400 | 0.025/1 = 0.025 |\n| 9\
    \ | 1 | 01 | 0.025 | 0.025/1 = 0.025 |\n\nTable 8.5: Normalized new weights\n\n\
    So, we have completed the first iteration of using the AdaBoost algorithm at this\
    \ stage.\n\n> Note: We can get the value of r as 0.5 or greater than 0.5 or less\
    \ than 0.5.\n\nIf r = 0.5, then α = $\\eta$ log $\frac{1-0.5}{0.5}$ = $\\eta$\
    \ log $\frac{0.5}{0.5}$ = 0. Under this circumstance, the new weights remain the\
    \ same as the old weights, as e0=1. So, the model will not learn further.\n\n\
    Also, if r > 0.5, say 0.7, then α = $\\eta$ log $\frac{1-0.7}{0.7}$ = $\\eta$\
    \ log $\frac{0.3}{0.7}$ = $\\eta$ 0.428=-0.847.\nSo when r>0.5, α is negative;\
    \ as a result, the data points with wrong predictions get less weight instead\
    \ of getting boosted. So, in this circumstance, the model cannot improve any further.\n\
    Only when r<0.5 α will be positive, and as a result, the data points with wrong\
    \ predictions will get boosted.\nRemember if r is close to 0.5, the estimator\
    \ (or the model) is weak, as it merely makes a guess. If r is close to 0, also,\
    \ if r is close to 1, the estimator is strong, as it has a high chance of making\
    \ the correct prediction. Also, a wrong prediction is very high. If an estimator\
    \ is likely to make a wrong decision, we can always flip its decision as our decision."
