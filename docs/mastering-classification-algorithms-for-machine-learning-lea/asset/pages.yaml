    # # Conclusion


    As you would have noticed in the discussion on the K-Nearest Neighbor algorithm,
    this algorithm does not require the machine to be trained. Instead, the machine
    takes the data and applies the algorithm to perform classification (or regression).
    So, the K-Nearest Neighbor algorithm is also called a Lazy Algorithm. However,
    the algorithm solves classification (and regression) problems in many circumstances.


    In the next chapter, we will discuss the Logistic Regression Algorithm, where
    we delve into Gradient Descent for the first time.


    # # Points to remember


    +   - KNN stands for K-Nearest Neighbor.

    - KNN Algorithm can be used for Classification and Regression.

    - In KNN Algorithm, we find the distance between the data points and assign a
    class based on the class of the nearest neighbors.

    - We can use Euclidean distance, Manhattan distance, or Hamming distance to find
    the distance between the data points.

    - KNeighborsClassifier is the class in sklearn.neighbors package which implements
    the KNN Algorithm for classification.'
