  md: '# # CHAPTER 8

    # Boosting Algorithm


    The last algorithm we discuss in this book is the Boosting algorithm. In Chapter
    6, Ensemble Models, these algorithms were called Boosting ensemble models. In
    Boosting ensemble models, we train on the entire original dataset in iterations
    using the same algorithm. The main difference is that in each iteration, we try
    to minimize the mistakes in predictions made in the previous iteration.


    ![](img/11af2c4c7dddfed06ed008516c0c6dfb_262_0.png)


    Figure 8.1'
  merge: -1
