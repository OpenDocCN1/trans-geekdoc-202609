    Unsupervised learning is also used for **Dimensionality reduction**. Dimensionality
    reduction is the process of reducing the features while building a model so that
    only the essential features are utilized for building the model. Reducing the
    number of features reduces the complexity of the models, and thus the models become
    more robust.


