  md: 'Introduction to Machine Learning 3


    Mathematical Biophysics, Vol 5. In this paper, they discussed a mathematical model
    of neural networks. This is the first attempt to make machines think like the
    human brain. ¹


    “What is being able to think” is a vast subject. We can make a simple abstraction,
    as shown in Figure 1.1. Thinking is a process of collecting data, finding patterns
    in the data, and making inferences from the patterns.


    # Thinking Process


    ![](img/11af2c4c7dddfed06ed008516c0c6dfb_22_0.png)


    Let us discuss the process of thinking through an example. Suppose the data provided
    to us is a massive pile of medicines. On receiving this data, we could find patterns
    like which medicines are like each other. We may study the composition of the
    medicines and the manufacturers and many other attributes. We may classify the
    medicines as which medicine group is for curing what disease based on the patterns
    we find.


    Machine learning is like this. We present data to the machine and sometimes provide
    information about the data. Based on this information and knowledge, the machine
    finds patterns and considers the mechanism to see them as its rules. Once the
    machine has formulated its rules, it makes inferences about a new situation.


    Machine learning is a branch of Artificial Intelligence (AI). In machine learning,
    using mathematical modeling on data, a machine is made to learn the patterns in
    the data without any human intervention.


    # Traditional programming versus programming for machine learning


    Programming for machine learning is different from traditional programming.


    > ¹ https://www.cse.chalmers.se/~-coquand/AUTOMATA/mcp.pdf.'
