    # # Detecting malware in ELF files¹


    An increasingly exploitable attack surface in today''s rapidly evolving malware
    landscape is that of Linux-based Internet of Things (IoT) devices and, Linux binary
    files. Executable and Linkable Format (ELF) files are the executable files used
    in any Unix operating system, including Linux systems. The rise of connected objects
    with the evolution and revolution of IoT has led to a massive influx of Linux-based
    malware and attacks targeting IoT devices. The increasing number of Linux malware
    can be attributed to the frequent patching, making them highly vulnerable to exploitation.
    Manual malware analysis is ineffective due to many such cases, so detection models
    based on machine learning approaches could serve valuable results.


    Malware can be defined as any malicious program that intends to cause damage to
    a computer, server, client, or computer network. Malware can be categorized and
    classified into different types depending on its functionality.


    The five malware categories classified by the model discussed in this chapter
    are listed as follows:


    +   * Backdoor: Malicious software capable of opening unauthorized access to remote
    systems.


    +   * Botnet: A botnet is a compromised system network allowing hackers to control
    them remotely and execute commands.


    1 Implementing Cybersecurity with Open-Source Software and Standard Architecture
    — River Publishers (Chapter 3)'
