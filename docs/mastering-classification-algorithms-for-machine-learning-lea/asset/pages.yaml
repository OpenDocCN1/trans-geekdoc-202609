- pgno: 317
  md: "# Image compression using SVD\n\n```\n$$\\begin{bmatrix} 0 & -\\sqrt{2} & 1/\\\
    sqrt{3} & -1/\\sqrt{3} & 1/\\sqrt{3} \\ -\\sqrt{3} & 0 & -1/\\sqrt{2} & 0 & 1/\\\
    sqrt{2} \\end{bmatrix} = \\begin{bmatrix} 1 & 0 \\ 0 & -1 \\end{bmatrix}=A$\n\
    ```\n\nLet $A$ be $n \times m$ matrix. Let $k$ be a natural number, where $k \\\
    leq \\text{rank} (A) \\leq \\min(n, m)$.\n\n> Note: The Rank of a Matrix is a\
    \ number that is equal to the maximum number of linearly independent rows (or\
    \ columns) in the Matrix.\nA row (or column) of a matrix is linearly independent\
    \ if the row (or column) cannot be expressed as a linear combination of any of\
    \ the other rows (or columns) of the matrix.\n\nUsing the SVD-decomposition of\
    \ $A$, if $A=UDV^T$, we keep the first $k$ values in $D$ and set the following\
    \ singular values to zero. Let denote the resulting diagonal matrix by $D_k$.\
    \ It is easy to see that we only need to keep the first $k$ columns of $U$ and\
    \ the first $k$ rows of $V$ since their other columns are multiplied by zero,\
    \ as shown in Figure A3.1. To sum up, $A_k=U_kD_kV_k^T$ is the closest matrix\
    \ to $A$ having rank $k$, where $U_k$ and $V_k$ consist of the first $k$ columns\
    \ and rows of $U$ and $V$, respectively.\n\nIf $A$ is large, $n, m$ are large,\
    \ and $k$ is relatively small, the information we need to store to approximate\
    \ the information content stored in $A$ is much smaller. That is, we can reduce\
    \ the storage space significantly and still store almost the same information\
    \ that the original matrix has.\n\nHere we will see how a low-rank approximation\
    \ of a matrix provides a solution to compress an image.\n\nImages are represented\
    \ in a rectangular array where each element corresponds to the grayscale value\
    \ for pixel. For colored images, we have a 3-dimensional array of size $n \\times\
    \ m \\times 3$, where $n$ and $m$ represent the number of pixels vertically and\
    \ horizontally, respectively. For each pixel, we store the intensity for red,\
    \ green, and blue colors.\n\nWe repeat the low-rank approximation procedure above\
    \ on a larger matrix; that is, we create the low-rank approximation of a matrix\
    \ that represents each image for color separately. The resulting 3-dimensional\
    \ array will be a good approximation of the original image.\n\nDifferent values\
    \ of $k$ result in different compression qualities; the higher the $k$, the closer\
    \ the compressed image is to the original, but increasing $k$ means larger matrices."
  merge: -1
  img_proc: true
