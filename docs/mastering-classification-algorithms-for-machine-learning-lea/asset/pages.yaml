    4032 and 3024.


    ```

    k = 1000

    ```


    # Selecting k columns from U matrix and k rows from VT matrix


    ```

    U_k = U[:, 0:k]

    ```


    ```

    VT_k = VT[0:k, :]

    ```


    ```

    D_k = D[0:k]

    ```


    ```

    compressedBytes = sum([matrix.nbytes for matrix in [U_k, D_k, VT_k]])

