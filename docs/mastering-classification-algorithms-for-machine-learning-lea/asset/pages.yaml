    Number of elements in X: 91231


    Sampling Rates: 22050


    The next step is to apply a pre-emphasis filter on the signal to amplify the high
    frequencies. A pre-emphasis filter is useful in several ways:


    +   - Balances the frequency spectrum since high frequencies usually have smaller
    magnitudes compared to lower frequencies,

    - Avoids numerical problems during the Fourier transform operation,

    - May improve the Signal-to-Noise Ratio (SNR).


    The pre-emphasis filter can be applied to a signal X using the first-order filter
    in the following equation:


    > y(t) = X(t) - aX(t)


    This can be implemented using the following code: the typical values for the coefficient
    (α) are 0.95 or 0.97.


    ```

    import numpy as np


    preEmphasis = 0.97

    emphasizedSignal = np.append(X[0], X[1:] - preEmphasis * X[:-1])

    print(''Emphasized Signal\n'', emphasizedSignal)

    print(''Number of elements:'', len(emphasizedSignal))

    plt.figure(figsize=(15, 5))

    librosa.display.waveshow(emphasizedSignal, sr = samplingRate)

    plt.show()

    ```'
