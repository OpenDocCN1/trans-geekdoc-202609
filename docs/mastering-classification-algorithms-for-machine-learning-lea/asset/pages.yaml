- pgno: 30
  md: "# Supervised learning\n\nIn Supervised learning, the machine is provided data\
    \ along with labels. The machine learns based on the data and the associated labels\
    \ and then makes inferences. So, we are providing the machine with prior knowledge,\
    \ and then after the machine learns from this knowledge, it can make decisions\
    \ within the boundaries of this provided knowledge.\n\nLabels are the analysis\
    \ of the data as determined by humans. For example, if we want the machine to\
    \ learn to differentiate images of dogs and cats, we need to provide data regarding\
    \ dogs and cats to the machines. Along with this data, we need to provide data\
    \ labels stating which are the images of dogs and which are the images of cats.\
    \ Suppose we want the machine to predict the marks in an exam. In case, we need\
    \ to provide historical data along with labels stating how many marks were obtained\
    \ under the circumstances provided in the data.\n\nThe bottom line in Supervised\
    \ learning is that we provide existing knowledge to the machine and expect the\
    \ machine to find patterns in the provided knowledge and make rules that the machine\
    \ can use to answer questions asked on the same subject.\n\nLet us understand\
    \ this with an example. Consider that we want the machine to detect spam emails.\
    \ So, we gather the data as shown in Table 1.1:\n\n| Contains spelling mistakes\
    \ | Contains the word “Urgent” | Contains the word “ASAP” | Contains a link to\
    \ click | Label |\n|---|---|---|---|--|\n NO | NO | NO | YES | Benign |\n| NO\
    \ | NO | NO | NO | Benign |\n| YES | NO | YES | YES | Spam |\n| NO | YES | YES\
    \ | YES | Spam |\n| YES | NO | NO | YES | Benign |\n| YES | YES | NO | YES | Spam\
    \ |\n\nTable 1.1: Example dataset of emails for spam detection\n\nIn this example,\
    \ the dataset in Table 1.1 contains only 6 data points. In real situations, the\
    \ datasets have thousands and millions of data points. Nevertheless, the dataset\
    \ contains in 4 variables: Contains spelling mistakes, Contains the word “Urgent”,\
    \ the word “ASAP”, and Contains a link to click. In machine language parlance,\
    \ these variables are called Independent Variables. For these four variables,\
    \ there is data in each data point. In normal circumstances, experts would have\
    \ studied real emails and gathered these four characteristics for each email.\
    \ Apart from collecting data regarding the characteristics of the emails, experts\
    \ would"
