  md: '# Boosting Algorithm


    > Notice that while making predictions, the term (ak * pk) becomes ZERO when considering
    the two classes in a binary classification scenario as 0 and 1. We have used this
    to illustrate and keep it consistent with the other classification problems discussed
    in the book. However, in actual implementations of the AdaBoost algorithm, for
    binary classification scenarios, we will consider the two classes to be 1 and
    -1. In this case, when the prediction from the model is greater than 0, we will
    conclude that the prediction is for class 1. When the prediction from the model
    is less than 0, we will conclude that the prediction is for class -1.


    # AdaBoost algorithm for multi-class classification


    AdaBoost algorithm can be used for multi-class classification. Stagewise Modeling
    using a Multiclass Exponential Loss (SAMME) is a variation of the AdaBoost algorithm
    used for multi-class classification. The Scikit-Learn package uses the SAMME algorithm
    to implement the AdaBoost algorithm.


    Scikit-Learn provides two algorithms, SAMME and SAMME.R (R stands for real). SAMME
    is used for discrete classification, that is, its output is 0, 1, 2, and so on.
    SAMME.R is used for multi-class classification, and its output is probabilities
    of the different classes.


    SAMME.R normally converges faster than SAMME.


    Other variants of the AdaBoost algorithm include Real AdaBoost, Gentle AdaBoost,
    Modest AdaBoost, Parameterized AdaBoost, Margin-Pruning Boost, and Penalized AdaBoost.


    As we have discussed, when the dataset is balanced, the accuracy of the Classification
    algorithm can be higher. This is true for the AdaBoost algorithm as well. Read
    the paper The improved AdaBoost algorithms for imbalanced data classification
    for more details.


    > The AdaBoost algorithm does not require the data to be scaled because the splitting
    of the decision stumps is based on values.


    1 https://www.sciencedirect.com/science/article/abs/pii/S00200255251002875'
