    From the dataset, we need to first establish the data distribution. Distribution
    of the data is a key aspect of building a good model. We know that the data contains
    audio clips of 8 different emotions. We need to check whether the number of audio
    files in the dataset for each emotion is similar or dissimilar. If the number
    of audio files for each emotion is similar, we would say that the dataset is balanced.
    Otherwise, the dataset would be termed unbalanced.


    If the dataset is balanced, the model will give almost equal weight to each emotion.
    If not, the model could be biased towards the emotion where more audio clips are
    available. Having a balanced set helps in building good classification models.


    We first establish how many audio clips we have for each emotion. Here, the emotion
    expressed in the audio clips is our label. We will tell the machine that a particular
    audio clip expresses a specific emotion. Based on this knowledge provided to the
    machine, the machine would be expected to learn how to determine the emotion expressed
    in a new audio clip supplied to the machine.'
