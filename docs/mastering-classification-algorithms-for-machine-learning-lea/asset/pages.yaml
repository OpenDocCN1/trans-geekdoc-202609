- pgno: 188
  md: '# BaggingClassifier


    In sklearn, **BaggingClassifier** class is available for implementing Bagging
    Ensemble Models for classification. Table 6.1 lists the essential parameters for
    the **BaggingClassifier** class:


    | Parameter | Explanation |

    | --- | --- |

    | estimator | The estimator is to be used by the Bagging Classifier class. By
    default, the estimator is DecisionTreeClassifier. This parameter needs to be provided
    as an instance of the estimator class. |

    | n_estimators | The number of estimator instances to be created. This means that
    the Bagging Classifier will create a number of models equal to the value of n_estimators
    using the estimator class and will create n_estimators of data sets from the provided
    data set. In some versions of Scikit-Learn, this parameter may be available as
    base_estimator. |

    | bootstrap | This is a Boolean parameter, that this parameter takes values of
    True and False. If the value of the bootstrap parameter is set to True, the samples
    are drawn with replacement. If the value of the bootstrap set to False, the samples
    are drawn without replacement. |

    | max_samples | The maximum number of data points to be drawn from the original
    data set is to be provided for each instance of the estimators. |

    | oob_score | This is a Boolean parameter, that is, this parameter takes values
    of True and False. This parameter is applicable only if the bootstrap parameter
    is set to True. When this is set to True, the out-of-bag data points are used
    to check for the generalization error. |


    Table 6.1: Parameters for BaggingClassifier


    In the following code, we see how the BaggingClassifier from Scikit-Learn package
    can be used:


    ```

    from sklearn.ensemble import BaggingClassifier

    ```


    ```

    from sklearn.tree import DecisionTreeClassifier

    ```


    ```

    baggingClf = BaggingClassifier(estimator=DecisionTreeClassifier(), n_estimators
    = 1000, bootstrap=True, max_samples=500, oob_score=True)

    ```'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# StackingClassifier


    in sklearn.ensemble, **StackingClassifier** class is available to implement Stacking
    Ensemble Models for classification. There are two essential parameters for the
    StackingClassifier class. The first essential parameter is **estimators**, which
    take a list of the different classifiers for building the base models. The second
    essential parameter is **final_estimator** which takes the class to construct
    the meta-model.


    Another important parameter for **StackingClassifier** is the passthrough. It
    takes a Boolean value (that is, we set this parameter to True or False). When
    passthrough is set to False, **StackingClassifier** uses the predictions from
    the Base Models as the input to build the Meta Model. When passthrough is set
    to True, **StackingClassifier** will use the prediction from the Base Model and
    the original data set to construct the Meta Model as shown in the following code:


    ```

    from sklearn.ensemble import StackingClassifier

    ...

    ```


    ```

    from sklearn.naive_bayes import MultinomialNB

    from sklearn.neighbors import KNeighborsClassifier

    from sklearn.tree import DecisionTreeClassifier

    from sklearn.linear_model import LogisticRegression

    ```


    ```

    ...

    nbCls = MultinomialNB()

    knnCls = KNeighborsClassifier()

    dtCls = DecisionTreeClassifier()

    lrCls = LogisticRegression()

    ```


    ```

    ...

    stackingClf = StackingClassifier(estimators=[''nb'', nbCls), (''knn'', knnCls),
    (''dt'', dtCls)], final_estimator=lrCls)

    ...

    ```'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Building speech emotion analysis model using Bagging algorithm


    Emotion analysis is widely used in many industries. Companies providing online
    services use emotion analysis to analyze customer feedback. In a clinical investigation,
    it is used to predict the state of the patients. The human resources department
    uses it for applications like attrition prediction, and so on. In the Insurance
    industry, there are many more use cases for emotion analysis.


    Emotion analysis is generally conducted on Text data. This is a field of Natural
    Language Processing (NLP). The different words are analyzed in this field to determine
    the sentiment and emotion. We will discuss emotion analysis from speech. In a
    speech, the aspects like pitch, tone, speaking pace, loudness, and so on., are
    analyzed to decide the emotion expressed in a speech.


    This field of using machine learning for emotion analysis from the speech is still
    nascent, as few reliable datasets are available for building good machine learning
    models. We will discuss the mechanics of building such models. The models can
    be improved by supplying better quality data to the model and improving the model
    itself.


    # Regarding the data set


    As discussed in this chapter, the datasets used in emotion analysis from speech
    have been obtained from Kaggle. The data is available from 2 sources. The first
    source is the University of Toronto, and the data is called Toronto Emotional
    Speech Set or TESS.¹ The second data set is the Ryerson Audio-Visual Database
    of Emotional Speech and Song or Ravdessd.²


    # TESS dataset


    TESS dataset contains 2880 files. Each file contains an audio recording. A set
    of 200 target words were spoken in the carrier phrase “Say the word ______” by
    two actresses, and the sets were recorded in seven different emotions (anger,
    disgust, fear, happiness, pleasant surprise, sadness, and neutral). Both actresses
    spoke English as their first language, were university educated, and had musical
    training. Audiometric testing indicated that both actresses had thresholds within
    the normal range.


    +   1 https://borealisdata.com/dataset.xhtml?persistentid=do:10.5683/SP2/E8H2MF

    2 https://zenodo.org/record/1188976#Y_RMYuxBzA1'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Ravdess dataset


    Ravdess dataset contains 1440 files: 60 trials per actor x 24 actors = 1440. The
    Ravdess dataset includes 22 professional actors (12 female, 12 male), vocalizing
    two lexically-matched statements in a neutral North American accent. Speech emotions
    include calm, happy, sad, angry, fearful, surprised, and disgusted expressions.
    Each expression is produced at two levels of emotional intensity (normal, strong),
    with an additional neutral expression.


    Each of the 1440 files has a unique filename. The filename consists of a 7-part
    numerical identifier (for example, 03-01-06-01-02-01-12.wav). These identifiers
    define the stimulus characteristics:


    +   - Modality (01 = full-AV, 02 = video-only, 03 = audio-only)

    - Vocal channel (01 = speech, 02 = song)

    - Emotion (01 = neutral, 02 = calm, 03 = happy, 04 = sad, 05 = angry, 06 = fearful,
    07 = disgust, 08 = surprised)

    - Emotional intensity (01 = normal, 02 = strong). NOTE: There is no strong intensity
    for the ‘neutral’ emotion.

    - Statement (01 = “Kids are talking by the door”, 02 = “Dogs are sitting by the
    door”)

    - Repetition (01 = 1st repetition, 02 = 2nd repetition)

    - Actor (01 to 24. Odd-numbered actors are male, even-numbered actors are (female).


    An example of a Ravdess file name is 03-01-06-01-02-01-12.wav


    +   - Audio-only - 03

    - Speech - 01

    - Fearful - 06

    - Normal intensity - 01

    - Statement “dogs” - 02

    - 1st Repetition - 01

    - 12th Actor - 12 Female, as the actor ID number is even'
