  img_proc: true
- pgno: 361
  md: "Mastering Classification Algorithms for Machine Learning\n\nIn Chapter 5, Decision\
    \ Tree Algorithm, we have seen that we try many values where we could split the\
    \ decision tree. Using the Gini index, we consider the split at the value where\
    \ the Loss is the minimum. Using Entropy, we will split the decision tree at the\
    \ maximum value of the Information Gain.\n\n# Forming Decision Tree using Entropy\n\
    \nWe have a dataset of 10 records with two independent variables and one dependent\
    \ variable. Let the independent variables be $x_1$ and $x_2$. Let the dependent\
    \ variable be $y$. Refer to the following table:\n\n| $x_1$ | $x_2$ | $y$ |\n\
    |---|---|--|\n| 1 | 4 | 0 |\n| 7 | 6 | 0 |\n| 1 | 6 | 0 |\n| 1 | 2 | 1 |\n| 5\
    \ | 2 | 1 |\n| 7 | 2 | 1 |\n| 5 | 4 | 0 |\n| 2 | 4 | 0 |\n| 1 | 7 | 1 |\n| 2 |\
    \ 7 | 1 |\n\nTable Annexure 8.1: The raw data\n\nThe data in Table Appendix 8.1\
    \ shows that the dependent variable $y$ has two values – 0 and 1. So, the data\
    \ has been classified into two classes – 0 and 1.\n\nFirst, let compute the Entropy\
    \ of the complete dataset. We see that we have 5 data points for class 0 and 5\
    \ data points for class 1. So, we get as follows.\n\n> $P_0 = \frac{5}{10} = 0.5\
    \ \\text{ and } P_1 = \\frac{5}{10} = 0.5$$\n\nUsing these values of $P_0$ and\
    \ $P_1$, we can calculate the Entropy for the complete dataset as follows:\n\n\
    ```\nEntropy = - ((0.5 * log_2(0.5)) + (0.5 * log_2(0.5))) = - ((0.5 * (-1.0))\
    \ + (0.5 * (-1.0))\\n= - (-0.5) + (-0.5)) = - (-1.0) = 1\n```"
  merge: -1
  img_proc: true
- pgno: 362
  md: 'As the Entropy for the complete dataset is the Entropy of the Root Node, we
    will write as follows.


    $Entropy_{root} = 1$$


    To make the decision tree, we need to try various points for the features $x_1$
    and $x_2$ where we can split the decision. So, we compute the possible values
    of $x_1$ and $x_2$ where there could be a split. We will understand this concept
    using the data we have in Table A8.1.


    To compute the difference $x_1$, we consider the range from the minimum value
    of $x_1$ to the maximum value of $x_1$. Then, we take points at intervals in this
    range. The $minimum(x_1) = 1$ and $maximum(x_1) = 7$. To avoid edge conditions,
    we will consider the upper limit of the range as the $maximum(x_1) + 1$. So, the
    range for $x_1$ is 1 to 8. We will consider intervals of 0.5 in our range. So,
    the values of $x_1$ that we will try to use for splitting the decision are follows:


    1.00, 2.50, 3.00, 3.50, 4.50, 5.00, 5.50, 6.00, 6.50, 6.00, 7.00, 7.50


    Similarly, we consider the variables of $x_2$ for splitting the decision. The
    $minimum(x_2) = 2$ and $maximum(x_2) = 7$. So, the range for $x_2$ is 2 to 8.
    The values of $x_2$ that we will try to use for splitting the decision are as
    follows.


    2.00, 2.50, 3.00, 3.50, 4.00, 5.00, 5.50, 6.00, 6.50, 7.00, 7.50


    The points we will use for splitting the decision tree are called **thresholds**.


    Let us compute the Entropy for the threshold $x_1 = 1.00$. So, we split the dataset
    for $x_1 \le 1.00$, the dataset on the left-hand side of the split and the dataset
    on the right-hand side of the split would look as shown in Table Annex 8.2:


    | $x_1 \le 1.00$ | | | $x_1 > 1.00$ | | |

    |---|---|---|---|---||

    | $x_1$ | $x_2$ | $y$ | $x_1$ | $x_2$ | $y$ |

    | 1 | 4 | | 2 | 4 | 0 |

    | 1 | 6 | 0 | 2 | 7 | 1 |

    | 1 | 2 | 1 | 5 | 2 | 1 |

    | 1 | 7 | 1 | 5 | 4 | 0 |

    | | | | 7 | 2 | 1 |

