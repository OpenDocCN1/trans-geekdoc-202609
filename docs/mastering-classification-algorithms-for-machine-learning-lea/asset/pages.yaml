    # Confusion Matrix


    Now, we have built the model. The next step is to test the model. Let us pause
    here and discuss how we will test the model.


    The intuition for testing the model is that we will make predictions using the
    model and then compare predictions with the results we already have. Either the
    machine makes the same prediction as the original data or makes an error. We can
    represent the result in a Confusion Matrix.


    Let us understand the confusion matrix with the simplest case possible. In our
    example, we have two classes -Spam and Not Spam. So, there are two possibilities
    in the data we have. These are the Actual values. The machine will use its algorithm
    and predict two values as well. These are the Predicted values. If we put the
    actual and predicted values in a matrix, we will get the Confusion Matrix, as
    shown in Figure 2.9:


    # Confusion Matrix


    ![](img/11af2c4c7dddfed06ed008516c0c6dfb_79_0.png)


    Figure 2.9: Generic Confusion Matrix'
