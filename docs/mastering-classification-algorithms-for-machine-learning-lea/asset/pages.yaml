- pgno: 346
  md: 'are called n-grams (Single words are called 1-grams. Combination of 2 consecutive
    words is called 2-grams, and so on). Both count vectorizer and TF-IDF vectorizer
    have the facility to create vectors for n-grams.


    # Points to remember


    +   - Vectorizers are used for converting text into vectors so that they can be
    used for creating machine learning models.

    - In text processing, each data point is referred to as a document, and (at the
    least) each word in the documents is referred to as a term. The complete collection
    of all the documents is referred to as a corpus.

    - Count vectorizer is a simple vectorizer where we determine the unique words
    in the corpus and count the number of times each word appears in each document.

    - TF-IDF vectorizer is a more sophisticated vectorizer. TF-IDF is a product of
    Term Frequency (TF) and Inverse Document Frequency (IDF).'
