- pgno: 122
  md: '# Logistic Regression 103


    We will start our discussion with binary classification (that is, the target variable
    can assume two values – 0 and 1) and later extend this to multi-class classification.


    When we use a linear model for predicting a categorical variable, it is called
    a Logistic Regression model. In other words, the algorithm to solve classification
    models using a linear method is called the Logistic Regression algorithm.


    In the Logistic Regression algorithm, we convert the problem of predicting the
    target variable (which is categorical) into a problem of predicting the probability
    of occurrence of the target variable. Now, the probability is a value between
    0 and 1, which makes the problem of predicting a categorical target variable a
    problem of predicting a continuous variable.


    Let us understand this through an example. Suppose our problem is to predict whether
    an SMS is spam. We need to predict two classes: SPAM and NOT SPAM. Now, we label
    SPAM as 1 and NOT SPAM as 0. Our problem is to predict 1 or 0. However, we change
    the problem to predicting the probability of an SMS being SPAM. In other words,
    our target variable is $P_{y}(y=1)$. $P(y=1)$ can take a value between 0 and 1
    as this is a probability. So, it is a continuous variable. On obtaining the value,
    we consider a threshold value. If $P_{y}(y=1)>$ threshold, we consider $y=1$ (or
    SPAM in this case). If $P_{y}(y=1)<=$ threshold, $y=0$ (or NOT SPAM in this case).


    So, we are using a Linear Regression method to make a prediction. By obtaining
    the prediction, we compare the prediction against a threshold to get the predicted
    binary category.


    # Sigmoid function


    For the Logistic Regression algorithm, we need a function that will output a value
    between 0 and 1. The function which does this is the Sigmoid Function. Function
    is of the form as follows:


    ```

    $$\sigma(t) = \frac{1}{1+e^{-t}}$

    ```


    Here, t can assume a value between $-\infty$ to $+\infty$.


    When $t=-\infty, e^{-t}=e^{-(-\infty)}=\infty$. So, $\sigma(t)=\frac{1}{1+e^{-t}}=\frac{1}{1+\infty}=\frac{1}{\infty}=0$.


    When $t=+\infty, e^{-t}=e^{(+\infty)}=0$. So, $\sigma(t)=\frac{1}{1+e^{-t}}=\frac{1}{1+0}=\frac{1}{1}=1$.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Mastering Classification Algorithms for Machine Learning


    If we plot the values of $\sigma(t)$ for different values of t, we get the graph
    shown in Figure 4.8:


    ![](img/11af2c4c7dddfed06ed008516c0c6dfb_123_0.png)


    So, the Sigmoid function always takes a value between 0 and 1.


    The problem we will have for classification with one or more than 1 number of
    features (or independent variables) and 1 target variable (or dependent variable).
    So, the linear form of the problem will be as follows:


    $y = a_0 + a_1x_1 + a_2x_2 + \dots + a_nx_n$


    Applying the Sigmoid function, we will get as follows:


    $\sigma(y) = \frac{1}{1+e^{-y}} = \frac{1}{1+e^{-(a_0+a_1x_1+\dots+a_nx_n)}}$


    So, for every data point, we will get a value between 0 and 1. To make prediction,
    we formulate as follows:


    $y = \begin{cases} 1, if \sigma(y) > 0.5 \ 0, if \sigma(y) \le 0.5 \end{cases}$


    Here, we have considered our threshold as 0.5. We could set the threshold to any
    other value between 0 and 1 depending on our problem.


    Now we have many data points, m data points, in our dataset. For each data point,
    we will get as follows:


    $\sigma(y_i) = \frac{1}{1+e^{-y_i}} = \frac{1}{1+e^{-(a_0+a_1x_1+\dots+a_nx_i)}}$
    here $i$ varies from 1 to m.'
