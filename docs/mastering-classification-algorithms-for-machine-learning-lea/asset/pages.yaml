    # # Removing stop words


    Stop Words are commonly used words in a language. In the English language, words
    like "I", "me", "so", "this", "that", "you", "us", etc. are termed as stop words.
    Generally, stop words do not add value in analyzing textual data. So, the general
    practice is to remove the stop words from the corpus before analyzing the data.


    The list of stop words in the English Language is available in many libraries.
    The package Natural Language Toolkit (nltk) is generally used to get a list of
    stop words. The nltk library is available in Python and R. We will discuss how
    to use the nltk library for use in removing stop words.


    Before the nltk library is used, it must be available on the machine where it
    is intended. The code below installs the nltk library for use in Python.


    ```

    pip install nltk

    ```


    This is the command to use when used from inside a Jupyter Notebook. If the nltk
    library must be installed from the shell in a Linux machine or a Mac, use the
    command below:


    ```

    pip install stopWords

    ```


    The code below accepts a text as input and returns the text after removing all
    the stop words. The function removeStopWords() breaks down the text into each
    word and analyzes whether the word is a stop word. The function joins back again
    all the words which are not stop words in the order they appear in the text and
    returns the text.


    ```

    import nltk


    from nltk.corpus import stopwords

    from nltk.tokenize import word_tokenize

    ```


    ```

    # Gather the list of Stop Words

