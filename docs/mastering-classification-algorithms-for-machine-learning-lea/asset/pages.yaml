- pgno: 180
  md: 'The idea of ensembles is to ask several experts about a given problem. In simple
    ensemble models, we provide the data to several models and get the answers from
    each model. Then, if it is a regression problem, we take the average of the answers
    obtained from all the models as the solution. If it is a classification problem,
    we take the answers from all the models, and the answer provided by the maximum
    number of models is taken as the answer.


    To understand this more clearly, suppose we have a classification problem to determine
    whether an SMS is spam (that is, we need to classify it into two classes – SPAM
    and NOT SPAM). We will provide our labeled data to several algorithms and create
    all models. When we want to predict a data instance, we will pose the question
    to all models. Some of the models may classify the case as SPAM, and some of the
    models may classify the case as NOT SPAM. We will count how many models predicted
    SPAM and how many predicted NOT SPAM. If the count of prediction as SPAM is greater
    than the count of the predictions NOT SPAM, we will conclude that the case is
    of a SPAM SMS; else, we


    However, we need not always create models with multiple algorithms. Generally,
    we take a single algorithm like the Decision Tree algorithm. We know that the
    Decision Tree tends to divert. Overfitting means the algorithm learns the data
    too well; thus, when new data is provided, the model tends to make mistakes. So,
    what we do is to create subsets of the data. For simplicity to understand, suppose
    we have 1,000 data points. We create subsets of 100 data points by randomly picking
    them from the original data set of 1,000. Now, we provide each of the subsets
    of 100 data points to create ten separate models using the Decision Tree algorithm.
    Now, each model sees only part of the data, and none of the models can see the
    complete data set. When the ten models make the predictions, we take our prediction
    as the decision made by the maximum number of models. We will always consider
    the prediction based on the predictions of all the models.


    Such a technique of creating a model is called the ensemble technique, and such
    models are called Ensemble models.


    # The intuition behind Ensemble models


    Suppose we have a biased coin with a probability of obtaining a head being 51%
    (and the probability of obtaining a tail is 49%). If we toss this coin once, the
    chance of getting a head or a tail will be equally likely. However, if we toss
    this coin 100 times, the chance is that we obtain heads 51 and obtain tails 49
    times. However, if we toss this coin 10,000 times, the chance of getting heads
    is 5,100'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'times, the chance of obtaining tails is 4,900 times. Notice that our conclusion
    is clearly distinguished as we increase the number of times we toss the coin.


    Ensembles work in the same way. Suppose we have several classifiers that produce
    better results than the random guess. Then, when we create ensembles with sufficient
    data points using these classifiers and take the majority from the results, the
    ensembles generally provide more than 75% accuracy. The critical point to note
    is that we need to have sufficient data points. In statistics, this is called
    the Law of large numbers.


    # Different types of Ensemble models


    There are many types of ensemble models. We will focus on four types of ensemble
    models, that is, Voting, Bagging, Boosting, and Stacking.


    # Voting ensemble models


    In the Voting ensemble model, we subject the same data to several models built
    using different algorithms. Then, we make predictions from each model separately
    and take the decision provided by the maximum number of models.


    In Figure 6.2, we see how Voting ensemble models work. We can build 3 different
    models on the same input data:


    ![](img/11af2c4c7dddfed06ed008516c0c6dfb_181_0.png)


    > "Class A" got 2 votes and "Class B" got 1 vote and thus choose "Class A" as
    our decision.


    Figure 6.2: Simplified example of Voting ensemble'
