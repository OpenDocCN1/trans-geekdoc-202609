    # Ensemble Model implementation in Scikit-Learn


    All the algorithms we discussed before this chapter (namely, the Naive Bayes algorithm,
    K-Nearest Neighbor algorithm, Logistic Regression algorithm, and Decision Tree
    algorithm) could be understood by manual illustration. Also, the predictions made
    by these algorithms are easy to interpret. These kinds of models are called **White
    Box Models.**


    However, in the Ensemble models (and Neural networks), it is difficult to explain
    why a particular data instance was classified in a specific class. That is why
    these models are called **Black Box Models**. We cannot walk through the Ensemble
    models using a data set. However, you can still program such models by yourself.
    We have included all the essential details to program the ensemble models.'
