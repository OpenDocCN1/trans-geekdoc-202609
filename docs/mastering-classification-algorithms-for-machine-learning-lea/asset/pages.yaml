    # # Conclusion


    Entropy and Gini index can be used for forming Decision Trees. There is no preference
    for one over the other. The CART algorithm uses the Gini index to create decision
    trees, while the ID3 and C4 algorithms use Entropy to form decision trees. The
    only significant difference is that the Gini index for maximum impurity is 0.5,
    and the Entropy for maximum impurity is 1. The maximum purity for both Gini index
    and Entropy is 0.'
