  md: "3 116 neutral\n\n4 102 disgust\n\n# # Work for readers\n\nFor the Emotion extraction\
    \ from the speech model, we used the Bagging classifier, which used many models\
    \ developed using the Decision Tree algorithm. Now, check whether the Bagging\
    \ classifier’s accuracy is better than that obtained from a single model built\
    \ using the Decision Tree algorithm.\n\n# # Conclusion\n\nEnsemble models harness\
    \ the power of using many weak or complex models and use the collective strength\
    \ of each of the models to provide a powerful model. Ensemble models generally\
    \ have less bias than the individual models. We observed many techniques for forming\
    \ the ensemble, like using multiple algorithms to build individual models and\
    \ then aggregating the results or building models using the same algorithm on\
    \ different subsets of the data and then aggregating the results, and so on.\n\
    \nIn the next chapter, we will discuss the Random Forest algorithm. The Random\
    \ Forest algorithm is an ensemble model, a particular case of the Bagging ensemble\
    \ model.\n\n# # Points to remember\n\n+   - When we combine many models to form\
    \ a single model, such models are called Ensemble Models.\n- There are four Ensemble\
    \ models: the Voting Ensemble Model, Bagging Ensemble Model, Boosting Ensemble\
    \ Model, and Stacking Ensemble Model.\n- In the Voting Ensemble Model, we make\
    \ predictions from multiple models built using different algorithms and aggregate\
    \ the individual models’ results to make predictions.\n- We divide the original\
    \ data set into many subsets in the Ensemble Model. We apply a model built using\
    \ the same algorithm on each subset. Then we aggregate the results from each of\
    \ the models to make predictions.\n  - In Bagging ensemble models, we create the\
    \ subsets of the data set using sampling with replacement."
  merge: -1
  img_proc: true
