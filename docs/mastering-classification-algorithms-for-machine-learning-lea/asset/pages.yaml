- pgno: 275
  md: '# AdaBoost Algorithm implementation in Scikit-Learn


    In the Scikit-Learn package, AdaBoost algorithm implementation is available in
    the library sklearn.ensemble.AdaBoostClassifier. The details of the essential
    parameters of AdaBoostClassifier are as follows:


    +   - **estimator**: This parameter is used to set the algorithm that will be
    used to create all the models for each iteration. By default, this parameter is
    set to DecisionTreeClassifier (that is, using the Decision Tree algorithm for
    solving classification problems). Setting this parameter to DecisionTreeClassifier
    creates Decision Trees of depth, one at each iteration of the AdaBoost algorithm
    implementation. As we have discussed, these decision trees are called Decision
    Stumps.

    - **n_estimators**: This parameter decides the maximum number of iterations created
    during the learning process. In other words, if the estimatorTreeClassifier, this
    parameter decides the number of decision stumps to build the model. By default,
    this parameter is set to 50. However, it must be noted that no further iterations
    are undertaken once the model learns everything from the data (that is, the model
    does not make any errors in predictions).

    - **learning_rate**: This parameter sets the value for $\eta$ used in calculating
    $\alpha$. Recall that $\alpha$ is the weight of the estimator when the prediction
    from the model using the AdaBoost algorithm is made. The default value for learning_rate
    is 1.

    - **algorithm**: By default, the Scikit-Learn implementation of the AdaBoost algorithm
    uses the SAMME.R algorithm. This parameter can also be set to SAMME. Recall that
    the SAMME makes discrete decisions, SAMME.R provides probabilities of classes
    as floating-point numbers.


    > Note: The AdaBoost algorithm was initially created for solving classification
    problems. However, the AdaBoost algorithm can also be used for solving regression
    problems. In the Scikit-Learn package, AdaBoost algorithm implementation for solving
    regression problems is available in the library sklearn.AdaBoostRegressor.

    However, for solving regression problems using Boosting Models, it is better to
    use the Gradient Boosting algorithm. Two powerful and popular implementations
    of the Gradient Boosting algorithm are XGBoost and CATBoost. Note that XGBoost
    and CATBoost algorithms can also be used for solving classification problems.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Recognizing traffic signs


    We will apply the AdaBoost algorithm to recognize traffic signs. Recognizing traffic
    signs is an Image classification problem. Traffic sign recognition is a challenging,
    real-world problem relevant to AI-based transportation systems. Traffic signs
    show a wide range of variations in terms of color, shape, and the presence of
    pictograms or text. subsets of classes (For example, speed limit signs) are very
    similar. Further, the classifier needs to be robust against significant variations
    in visual appearances due to changes in illumination, partial occlusions, rotations,
    weather conditions, and so on. Using a comprehensive traffic sign detection dataset;
    here we will perform classification of traffic signs, train and evaluate the classification
    model created using AdaBoost algorithm.


    Recognize the fact that Image Classification is best done using Neural Networks.
    Convolutional Neural Networks (CNN) works exceptionally best for image and video
    classification problems. However, we use AdaBoost here to demonstrate how the
    AdaBoost algorithm can be used.


    # About the data


    The data for this exercise is from the German Traffic Sign Detection Benchmark
    (GTSDB). This archive contains the training set used during the IJCNN 2013 competition.


    The German traffic sign detection benchmark is a single-image detection. It was
    introduced at the IEEE International Joint Conference on Neural Networks, 2013.


    The main archive - FullIJCNN2013.zip includes the images (1360 x 800 pixels) in
    PPM format. This file must be unzipped before the data can be used to create the
    model. There are 900 image files in this dataset.


    A file in CSV format, named gt.txt, contains the details of the coordinates in
    the images where a traffic sign can be found and an associated label stating the
    class of the traffic sign. The text file contains lines for each traffic sign
    in the dataset of the form:


    ```

    ImgNo.ppm;leftCol;topRow;rightCol;bottomRow;ClassID

    ```


    The first field refers to the image file in which the traffic sign is located.
    The contents of a few image files are provided in Figure 8.5.'
  merge: -1
  img_proc: true
