    # # Conclusion


    Text Normalization is an essential step in preprocessing text for any analysis.
    Both Stemming and Lamentation are used for Text Normalization besides other preprocessing
    actions. While Stemming is simple, Lamentation is generally preferred as Lamentation
    tries to preserve the context of the words.


