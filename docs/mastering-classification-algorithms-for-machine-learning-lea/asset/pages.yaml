  md: 'An example of one independent variable was used so that it could be possible
    to visualize the decision boundary. Though it can be challenging to visualize,
    the concept is the same if we have more than one independent variable.


    Note: In our example, we had one independent variable for the classification problem
    we solved using the Logistic Regression algorithm. Now, the Logistic Regression
    algorithm creates a linear model. So, the decision boundary was a point when we
    have 1 independent variable. If we have 2 independent variables for a classification
    problem using the Logistic Regression algorithm, the decision boundary will be
    a line. If we have 3 independent variables for a classification problem using
    the Logistic Regression algorithm, the decision boundary will be a plane. And
    so on.


    All classification algorithms create these decision boundaries. However, the shapes
    of the decision boundaries may be different. The task of any classification algorithm
    is to create these decision boundaries.


    # Multi-Class classification


    We have seen that we can use the Logistic Regression algorithm for solving binary
    classification problems. When we have multi-class classification problems, we
    can modify the usage of the Logistic Regression algorithm.


    The first strategy is called One-versus-Rest (OVR) strategy. To understand the
    One-versus-Rest strategy, consider that we need to classify it into ten classes.
    For example, we have images of English Digits, and we need to identify whether
    it is 0 or 1 or 2 or 3 or 4 or 5 or 6 or 7, or 9. In the One-versus-Rest strategy,
    we will convert this into ten classes to be solved by the Logistic Regression
    algorithm. The first classification problem would be to classify whether it is
    0 or anything else. The second classification problem would be to classify whether
    it is a 1 or anything else And so on. After solving the ten classification problems,
    we would take the class with the maximum probability, which would be the class
    assigned to the data point.


    The second strategy is called One-versus-Others (OVO) strategy. Suppose we have
    the same problem in classifying images of English Digits. Then, using One-versus-Others,
    we will set up classification problems for classifying 0 versus 1, 0 versus 2,
    and so on. So, we would take each class and evaluate against all the other classes.
    So, in the classification problem for classifying images of English Digits, we
    would have to set up $^{10C_2}$ classification problems. Then, we would take the
    class with the maximum probability from all these models, which would be the class
    assigned to the data point.'
