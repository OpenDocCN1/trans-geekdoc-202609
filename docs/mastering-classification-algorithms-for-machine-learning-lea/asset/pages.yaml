  md: '# # ANNEXURE 6


    # # Vectorizers


    Creating models from text is very important in Machine Learning. This is because
    there is so much data available as text. Data from newspapers, magazines, books,
    SMS, emails, and social media (like Facebook, Twitter, WhatsApp, LinkedIn, etc.)
    are all in text.


    We know that machines can only understand numbers. However, we need the machine
    to create a model from text data. The machine can create models from text data
    only if the text data is represented as numbers. Text vectorization is the mechanism
    of converting text data to a number representation. This is because we devise
    a way to represent text as vectors, each containing only numbers.


    In this annexure, we will discuss two text vectorizers. One is a **Count Vectorizer**.
    This is a relatively simple mechanism to represent text as numbers. Once we get
    the idea of a vectorizer through the discussion on count vectorizer, we will discuss
    a more complex vectorizer, i.e., the **TF-IDF vectorizer**. TF-IDF stands for
    **Term-Frequency Inverse Document Frequency**.'
  merge: -1
  img_proc: true
