- pgno: 374
  md: "This is happening because our application struct is expecting pointers to models.SnippetModel\
    \ and models.UserModel instances, but we are trying to use pointers to mocks.SnippetModel\
    \ and mocks.UserModel instances instead.\n\nThe idiomatic fix for this is to change\
    \ our application struct so that it uses interfaces which are satisfied by both\
    \ our mock and production database models.\n\n> Tip: If you’re not familiar with\
    \ the idea of interfaces in Go, then there is an introduction in this blog post\
    \ which I recommend reading.\n\nTo do this, let's head back to our internal/models/snippets.go\
    \ file and create a new SnippetModelInterface interface type that describes the\
    \ methods that our actual SnippetModel struct has.\n\n```\nFile: internal/models/snippets.go\n\
    \npackage models\n\nimport (\n\t\"database/sql\"\n\t\"errors\"\n\t\"time\"\n)\n\
    \ntype SnippetModelInterface interface {\n\tInsert(title string, content string,\
    \ expires int) (int, error)\n\tGet(id int) (Snippet, error)\n\tLatest() ([]Snippet,\
    \ error)\n}\n\n...\n```\n\nAnd let's also do the same thing for our UserModel\
    \ struct too:"
  merge: -1
  img_proc: true
