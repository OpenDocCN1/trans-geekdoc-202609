  md: "# # Using it in our web application\n\nLet's look at how to use `sql.Open()`\
    \ in practice. Open up your `main.go` file and add the following code:\n\n```\n\
    File: cmd/web/main.go\n\n```go\npackage main\n\nimport (\n\t\"database/sql\" //\
