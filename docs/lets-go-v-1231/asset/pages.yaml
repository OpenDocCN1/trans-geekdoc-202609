  md: "# # Automatic form parsing\n\nWe can simplify our `snippetCreatePost` handler\
    \ further by using a third-party package like `go-playground/form` or `gorilla/schema`\
    \ to automatically decode the form data into the `snippetCreateForm` struct. Using\
    \ an automatic decoder is *totally optional*, but it can help to save you time\
    \ and typing — especially if your application has lots of forms, or you need to\
    \ process a very large form.\n\nIn this chapter we’ll look at how to use the `go-playground/form`\
    \ package. If you’re following along, please go ahead and install it like so:\n\
    \n```\n$ go get github.com/go-playground/form/v4@v4\ngo get: added github.com/go-playground/form/v4\
    \ v4.2.1\n```\n\n# ## Using the form decoder\n\nTo get this working, the first\
    \ thing that we need to do is initialize a new `*form.Decoder` instance in our\
    \ `main.go` file and make it available to our handlers as a dependency. Like this:\n\
    \n```\nFile: cmd/web/main.go\n\n```go\npackage main\n\nimport (\n\t\"database/sql\"\
