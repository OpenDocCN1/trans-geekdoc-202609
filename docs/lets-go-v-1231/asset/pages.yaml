  md: '# Caching templates


    Before we add any more functionality to our HTML templates, it’s a good time to
    make some optimizations to our codebase. There are two main issues at the moment:


    +   1. Each and every time we render a web page, our application reads and parses
    the relevant template files using the template.ParseFiles() function. We could
    avoid this duplicated work by parsing the files once — when starting the application
    — and storing the parsed templates in an in-memory cache.


    +   2. There’s duplicated code in the home and snippetView handlers, and we could
    reduce this duplication by creating a helper function.


    Let’s tackle the first point first, and create an in-memory map with the type
    map[string]*template.Template to cache the parsed templates. Open your cmd/web/templates.go
    file and add the following code:'
  merge: -1
  img_proc: true
- pgno: 154
  md: "```\n```go\nFile: cmd/web/templates.go\n\npackage main\n\nimport (\n\t\"html/template\"\
    \ // New import\n\t\"path/filepath\" // New import\n\n\t\"snippetbox.alexedwards.net/internal/models\"\
    \n)\n\n...\n\nfunc newTemplateCache() (map[string]*template.Template, error) {\n\
    \t// Initialize a new map to act as the cache.\n\tcache := map[string]*template.Template{}\n\
    \n\t// Use the filepath.Glob() function to get a slice of all filepaths that\n\
    \t// match the pattern \"./ui/html/pages/*.tmpl\". This will essentially gives\n\
    \t// us a slice of all the filepaths for our application 'page' templates\n\t\
    // like: [./ui/html/pages/home.tmpl ./ui/html/pages/view.tmpl]\n\tpages, err :=\
    \ filepath.Glob(\"./ui/html/pages/*.tmpl\")\n\tif err != nil {\n\t\treturn nil,\
    \ err\n\t}\n\n\t// Loop through the page filepaths one-by-one.\n\tfor _, page\
    \ := range pages {\n\t\t// Extract the file name (like 'home.tmpl') from the full\
    \ filepath\n\t\t// and assign it to the name variable.\n\t\tname := filepath.Base(page)\n\
    \n\t\t// Create a slice containing the filepaths for our base template, any\n\t\
    \t// partials and the page.\n\t\tfiles := []string{\n\t\t\t\"./ui/html/base.tmpl\"\
    ,\n\t\t\t\"./ui/html/partials/nav.tmpl\",\n\t\t\tpage,\n\t\t}\n\n\t\t// Parse\
    \ the files into a template set.\n\t\tts, err := template.ParseFiles(files...)\n\
    \t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n\n\t\t// Add the template set\
    \ to the map, using the name of the page\n\t\t// (like 'home.tmpl') as the key.\n\
    \t\tcache[name] = ts\n\t}\n\n\t// Return the map.\n\treturn cache, nil\n}\n```\n\
    ```\n\nThe next step is to initialize this cache in the `main()` function and\
    \ make it available to our handlers as a dependency via the `application` struct,\
    \ like this:"
  merge: -1
  img_proc: true
