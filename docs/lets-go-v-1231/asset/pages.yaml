- pgno: 201
  md: '![](img/c3e650db0d8dfdecc0f8e34a67719f65_201_0.png)


    # # Additional information


    # ## The PostFormValue method


    The `net/http` package also provides the `r.PostFormValue()` method, which is
    essentially a shortcut function that calls `r.ParseForm()` for you and then fetches
    the appropriate field value from `r.PostForm`.


    I recommend avoiding this shortcut because it silently ignores any errors returned
    by `r.ParseForm()`. If you use it, it means that the parsing step could be encountering
    errors and failing for users, but there’s no feedback mechanism to let them (or
    you) know about the problem.


    # ## Multiple-value fields


    Strictly speaking, the `r.PostForm.Get()` method that we’ve used in this chapter
    only returns the first value for a specific form field. This means you can’t use
    it with form fields which potentially send multiple values, such as a group of
    checkboxes.'
  merge: -1
  img_proc: true
- pgno: 202
  md: "```\n<input type=\"checkbox\" name=\"items\" value=\"foo\"> Foo\n<input type=\"\
    checkbox\" name=\"items\" value=\"bar\"> Bar\n<input type=\"checkbox\" name=\"\
    items\" value=\"baz\"> Baz\n```\n\nIn this case you'll need to work with the r.PostForm\
    \ map directly. The underlying type of the r.PostForm map is url.Values, which\
    \ in turn has the underlying type map[string][]string. So, for fields with multiple\
    \ values you can loop over the underlying map to access them like so:\n\n```\n\
    for i, item := range r.PostForm[\"items\"] {\n\tfmt.Fprintf(w, \"%d: Item %s\\\
    n\", i, item)\n}\n```\n\n# Limiting form size\n\nBy default, forms submitted with\
    \ a POST method have a size limit of 10MB of data. The exception to this is if\
    \ your form has the enctype=\"multipart/form-data\" attribute and is sending multipart\
    \ data, in which case there is no default limit.\n\nIf you want to change the\
    \ 10MB limit, you can use the http.MaxBytesReader() function like so:\n\n```\n\
    // Limit the request body size to 4096 bytes\nr.Body = http.MaxBytesReader(w,\
    \ r.Body, 4096)\n\nerr := r.ParseForm()\nif err != nil {\n\thttp.Error(w, \"Bad\
    \ Request\", http.StatusBadRequest)\n\treturn\n}\n```\n\nWith this code only the\
    \ first 4096 bytes of the request body will be read during r.ParseForm(). Trying\
    \ to read beyond this limit will cause the MaxBytesReader to return an error,\
    \ which will subsequently be surfaced by r.ParseForm().\n\nAdditionally — if the\
    \ limit is hit — MaxBytesReader sets a flag on http.ResponseWriter which instructs\
    \ the server to close the underlying TCP connection.\n\n# Query string parameters\n\
    \nIf you have a form that submits data using the HTTP method GET, rather than\
    \ POST, the form data will be included as URL query string parameters. For example,\
    \ if you have a HTML form that looks like this:"
  merge: -1
  img_proc: true
- pgno: 203
  md: '```

    <form action=''/foo/bar'' method=''GET''>

    <input type=''text'' name=''title''>

    <input type=''text'' name=''content''>

    <input type=''submit'' value=''Submit''>

    </form>

    ```


    When the form is submitted, it will send a GET request with a URL that looks like
    this:

    /foo/bar?title=value&content=value.


    You can retrieve the values for the query string parameters in your handlers via
    the

    r.URL.Query().Get() method. This will always return a string value for a parameter,
    or the

    empty string "" if no matching parameter exists. For example:


    ```

    func exampleHandler(w http.ResponseWriter, r *http.Request) {

    title := r.URL.Query().Get("title")

    content := r.URL.Query().Get("content")

    ...

    }

    ```


    # The r.Form map


    An alternative way to access query string parameters is via the r.Form map. This
    is similar

    to the r.PostForm map that we''ve used in this chapter, except that it contains
    the form

    data from any POST request body and any query string parameters.


    Let''s say that you have some code in your handler that looks like this:


    ```

    err := r.ParseForm()

    if err != nil {

    http.Error(w, "Bad Request", http.StatusBadRequest)

    return

    }


    title := r.Form.Get("title")

    ```


    In this code, the line r.Form.Get("title") will return the title value from the
    POST

    request body or from a query string parameter with the name title. In the event
    of a

    conflict, the request body value will take precedent over the query string parameter.


    Using r.Form can be very helpful if you want your application to be agnostic about
    how

    data values are passed to it. But outside of that scenario, r.Form doesn''t offer
    any benefits

    and it is clearer and more explicit to read data from the POST request body via
    r.PostForm

    or from query string parameters via r.URL.Query().Get().'
