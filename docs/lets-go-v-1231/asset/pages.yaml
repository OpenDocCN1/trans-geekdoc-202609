- pgno: 349
  md: "# Helpers for test assertions\n\nAs I mentioned briefly earlier in the book,\
    \ over the next few chapters we’ll be writing a lot of test assertions that are\
    \ a variation of this pattern:\n\n```\nif actualValue != expectedValue {\n\tt.Errorf(\"\
    got %v; want %v\", actualValue, expectedValue)\n}\n```\n\nLet's quickly abstract\
    \ this code into a helper function.\n\nIf you’re following along, go ahead and\
    \ create a new `internal/assert` package:\n\n```\n$ mkdir internal/assert\n$ touch\
    \ internal/assert/assert.go\n```\n\nAnd then add the following code:\n\n```\n\
    File: internal/assert/assert.go\n\npackage assert\n\nimport (\n\t\"testing\"\n\
    )\n\nfunc Equal[T comparable](t *testing.T, actual, expected T) {\n\tt.Helper()\n\
    \n\tif actual != expected {\n\t\tt.Errorf(\"got: %v; want: %v\", actual, expected)\n\
    \t}\n}\n```\n\nNotice how `Equal()` is a *generic function*? This means that we’ll\
    \ be able to use it irrespective of what the type of the `actual` and `expected`\
    \ values is. So long as both `actual` and `expected` have the *same type* and\
    \ can be compared using the `!=` operator (for example, they are both `string`\
    \ values, or both `int` values) our test code should compile and work fine when\
    \ we call `Equal()`.\n\n> **Note:** The `t.Helper()` function that we’re using\
    \ in the code above indicates to the Go test runner that our `Equal()` function\
    \ is a test helper. This means that when `t.Errorf()` is called from our `Equal()`\
    \ function, the Go test runner will report the filename and line number of the\
    \ code `which called` our `Equal()` function in the output."
  merge: -1
  img_proc: true
- pgno: 350
  md: "With that in place, we can simplify our TestHumanDate() test like so:\n\n```\n\
    File: cmd/web/templates_test.go\n\npackage main\n\nimport (\n\t\"testing\"\n\t\
    \"time\"\n\n\t\"snippetbox.alexedwards.net/internal/assert\" // New import\n)\n\
    \nfunc TestHumanDate(t *testing.T) {\n\ttests := []struct {\n\t\tname string\n\
    \t\ttm   time.Time\n\t\twant string\n\t}{\n\t\t{\n\t\t\tname: \"UTC\",\n\t\t\t\
    tm:   time.Date(2024, 3, 17, 10, 15, 0, 0, time.UTC),\n\t\t\twant: \"17 Mar 2024\
    \ at 10:15\",\n\t\t},\n\t\t{\n\t\t\tname: \"Empty\",\n\t\t\ttm:   time.Time{},\n\
    \t\t\twant: \"\",\n\t\t},\n\t\t{\n\t\t\tname: \"CET\",\n\t\t\ttm:   time.Date(2024,\
    \ 3, 17, 10, 15, 0, 0, time.FixedZone(\"CET\", 1*60*60)),\n\t\t\twant: \"17 Mar\
    \ 2024 at 09:15\",\n\t\t},\n\t}\n\n\tfor _, tt := range tests {\n\t\tt.Run(tt.name,\
    \ func(t *testing.T) {\n\t\t\thd := humanDate(tt.tm)\n\n\t\t\t// Use the new assert.Equal()\
    \ helper to compare the expected and\n\t\t\t// actual values.\n\t\t\tassert.Equal(t,\
    \ hd, tt.want)\n\t\t})\n\t}\n}\n```\n\n# Additional information\n\n# Sub-tests\
    \ without a table of test cases\n\nIt's important to point out that you don't\
    \ need to use sub-tests in conjunction with table-driven tests (like we have done\
    \ so far in this chapter). It's perfectly valid to execute sub-"
