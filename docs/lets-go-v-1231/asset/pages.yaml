  md: "```\n-- Create a new UTF-8 `snippetbox` database.\nCREATE DATABASE snippetbox\
    \ CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\n-- Switch to using the `snippetbox`\
    \ database.\nUSE snippetbox;\n```\n\nThen copy and paste the following SQL statement\
    \ to create a new `snippets` table to hold the text snippets for our application:\n\
    \n```\n-- Create a `snippets` table.\nCREATE TABLE snippets (\n id INTEGER NOT\
    \ NULL PRIMARY KEY AUTO_INCREMENT,\n title VARCHAR(100) NOT NULL,\n content TEXT\
    \ NOT NULL,\n created DATETIME NOT NULL,\n expires DATETIME NOT NULL\n);\n-- Add\
    \ an index on the created column.\nCREATE INDEX idx_snippets_created ON snippets(created);\n\
    ```\n\nEach record in this table will have an integer `id` field which will act\
    \ as the unique identifier for the text snippet. It will also have a short text\
    \ `title` and the snippet content itself will be stored in the `content` field.\
    \ We'll also keep some metadata about the times that the snippet was `created`\
    \ and when it `expires`.\n\nLet's also add some placeholder entries to the `snippets`\
    \ table (which we'll use in the next couple of chapters). I'll use some short\
