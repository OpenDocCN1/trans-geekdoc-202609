    # Table-driven tests


    Let’s now expand our TestHumanDate() function to cover some additional test cases.

    Specifically, we’re going to update it to also check that:


    +   1. If the input to humanDate() is the zero time, then it returns the empty
    string "".


    +   2. The output from the humanDate() function always uses the UTC time zone.


    In Go, an idiomatic way to run multiple test cases is to use table-driven tests.


    Essentially, the idea behind table-driven tests is to create a ‘table’ of test
    cases containing

    the inputs and expected outputs, and to then loop over these, running each test
    case in a

    sub-test. There are a few ways you could set this up, but a common approach is
    to define

    your test cases in an slice of anonymous structs.


    I’ll demonstrate:'
  merge: -1
  img_proc: true
- pgno: 347
  md: "```\nFile: cmd/web/templates_test.go\n\npackage main\n\nimport (\n\t\"testing\"\
    \n\t\"time\"\n)\n\nfunc TestHumanDate(t *testing.T) {\n\t// Create a slice of\
    \ anonymous structs containing the test case name,\n\t// input to our humanDate()\
    \ function (the tm field), and expected output\n\t// (the want field).\n\ttests\
    \ := []struct {\n\t\tname string\n\t\ttm   time.Time\n\t\twant string\n\t}{\n\t\
    \t{\n\t\t\tname: \"UTC\",\n\t\t\ttm:   time.Date(2024, 3, 17, 10, 15, 0, 0, time.UTC),\n\
    \t\t\twant: \"17 Mar 2024 at 10:15\",\n\t\t},\n\t\t{\n\t\t\tname: \"Empty\",\n\
    \t\t\ttm:   time.Time{},\n\t\t\twant: \"\",\n\t\t},\n\t\t{\n\t\t\tname: \"CET\"\
    ,\n\t\t\ttm:   time.Date(2024, 3, 17, 10, 15, 0, 0, time.FixedZone(\"CET\", 1*60*60)),\n\
    \t\t\twant: \"17 Mar 2024 at 09:15\",\n\t\t},\n\t}\n\n\t// Loop over the test\
    \ cases.\n\tfor _, tt := range tests {\n\t\t// Use the t.Run() function to run\
    \ a sub-test for each test case. The\n\t\t// first parameter to this is the name\
    \ of the test (which is used to\n\t\t// identify the sub-test in any log output)\
    \ and the second parameter is\n\t\t// an anonymous function containing the actual\
    \ test for each case.\n\t\tt.Run(tt.name, func(t *testing.T) {\n\t\t\thd := humanDate(tt.tm)\n\
    \n\t\t\tif hd != tt.want {\n\t\t\t\tt.Errorf(\"got %q; want %q\", hd, tt.want)\n\
    \t\t\t}\n\t\t})\n\t}\n}\n```\n\n> **Note:** In the third test case we’re using\
    \ CET (Central European Time) as the time zone, which is one hour ahead of UTC.\
    \ So we want the output from `humanDate()` (which should be in UTC) to be **17\
    \ Mar 2024 at 09:15**, not **17 Mar 2024 at 10:15**.\n\nOK, let's run this and\
    \ see what happens:"
