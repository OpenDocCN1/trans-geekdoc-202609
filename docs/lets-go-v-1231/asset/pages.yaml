  md: "# Additional information\n\n# Checking for specific errors\n\nA couple of times\
    \ in this chapter we’ve used the errors.Is() function to check whether an error\
    \ matches a specific value. Like this:\n\n```\nif errors.Is(err, models.ErrNoRecord)\
    \ {\n\thttp.NotFound(w, r)\n} else {\n\tapp.serverError(w, r, err)\n}\n```\n\n\
