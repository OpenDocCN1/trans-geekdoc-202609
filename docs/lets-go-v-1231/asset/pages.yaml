  md: '# # Structured logging


    At the moment we''re outputting log entries from our code using the `log.Printf()`
    and `log.Fatal()` functions. A good example of this is the “starting server...”
    log entry that we print just before our server starts:


    ```

    ```go

    log.Printf("starting server on %s", *addr)

    ```

    ```


    Both the `log.Printf()` and `log.Fatal()` functions output log entries using Go’s
    standard logger from the `log` package, which — by default — prefixes a message
    with the local date and time and writes out to the standard error stream (which
    should display in your terminal window).


    ```

    ```bash

    $ go run ./cmd/web/

    2024/03/18 11:29:23 starting server on :4000

    ```

    ```


    For many applications, using the standard logger will be *good enough*, and there’s
    no need to do anything more complex.


    But for applications which do a lot of logging, you may want to make the log entries
    easier to filter and work with. For example, you might want to distinguish between
    different *severities* of log entries (like informational and error entries),
    or to enforce a consistent structure for log entries so that they are easy for
    external programs or services to parse.


    To support this, the Go standard library includes the `log/slog` package which
    lets you create custom *structured loggers* that output log entries in a set format.
    Each log entry includes the following things:


    +   * A timestamp with millisecond precision.

    +   * The severity level of the log entry (Debug, Info, Warn or Error).

    +   * The log message (an arbitrary `string` value).

    +   * Optionally, any number of key-value pairs (known as *attributes*) containing
    additional information.


    # ## Creating a structured logger'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'The code for creating a structured logger with the `log/slog` package can be
    a little bit confusing the first time you see it.


    The key thing to understand is that all structured loggers have a *structured
    logging handler* associated with them (not to be confused with a HTTP handler),
    and it''s actually this handler that controls how log entries are formatted and
    where they are written to.


    The code for creating a logger looks like this:


    ```

    loggerHandler := slog.NewTextHandler(os.Stdout, &slog.HandlerOptions{...})

    logger := slog.New(loggerHandler)

    ```


    In the first line of code we first use the `slog.NewTextHandler()` function to
    create the structured logging handler. This function accepts two arguments:


    +   - The first argument is the write destination for the log entries. In the
    example above we''ve set it to `os.Stdout`, which means it will write log entries
    to the standard out stream.

    +   - The second argument is a pointer to a `slog.HandlerOptions` struct , which
    you can use to customize the behavior of the handler. We''ll take a look at some
    of the available customizations at the end of this chapter. If you''re happy with
    the defaults and don''t want to change anything, you can pass `nil` as the second
    argument instead.


    Then in the second line of code, we actually create the structured logger by passing
    the handler to the `slog.New()` function.


    In practice, it''s more common to do all this in a single line of code:


    ```

    logger := slog.New(slog.NewTextHandler(os.Stdout, &slog.HandlerOptions{...}))

    ```


    # Using a structured logger


    Once you''ve created a structured logger, you can then write a log entry at a
    specific severity level by calling the `Debug()`, `Info()`, `Warn()` or `Error()`
    methods on the logger. As an example, the following line of code:


    ```

    logger.Info("request received")

    ```


    Would result in a log entry that looks like this:'
  merge: -1
  img_proc: true
- pgno: 77
  md: '```

    time=2024-03-18T11:29:23.000+00:00 level=INFO msg="request received"

    ```


    The `Debug()`, `Info()`, `Warn()` or `Error()` methods are _variadic methods_
    which accept an arbitrary number of additional attributes ( key-value pairs).
    Like so:


    ```

    logger.Info("request received", "method", "GET", "path", "/")

    ```


    In this example, we''ve added two extra attributes to the log entry: the key "method"
    and value "GET", and the key "path" and value "/". Attribute keys must always
    be strings, but the values can be of any type. In this example, the log entry
    will look like this:


    ```

    time=2024-03-18T11:29:23.000+00:00 level=INFO msg="request received" method=GET
    path=/

    ```


    > **Note:** If your attribute keys, values, or log message contain `"` or `=`
    characters or any whitespace, they will be wrapped in double quotes in the log
    output. We can see this behavior in the example above, where the log message `msg="request
    received"` is quoted.


    # # Adding structured logging to our application


    OK, let''s go ahead and update our `main.go` file to use a structured logger instead
    of Go''s standard logger. Like so:'
