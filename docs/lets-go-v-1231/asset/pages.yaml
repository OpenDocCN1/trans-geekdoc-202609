    \ NOT NULL,\n    hashed_password CHAR(60) NOT NULL,\n    created DATETIME NOT\
    \ NULL\n);\n\nALTER TABLE users ADD CONSTRAINT users_uc_email UNIQUE (email);\n\
    \nINSERT INTO users (name, email, hashed_password, created) VALUES (\n    'Alice\
    \ Jones',\n    'alice@example.com',\n    '$2a$12$NuTjWXm3KKntReFQwBVHyuf/to.HEwTy.eS206TnFKfG6rhZcJSWG',\n\
    \    '2022-01-01 09:18:24'\n);\n```\n\n```\nFile: internal/models/testdata/teardown.sql\n\
    \nDROP TABLE users;\nDROP TABLE snippets;\n```\n\n> **Note:** The Go tool ignores\
    \ any directories called testdata, so these scripts will be ignored when compiling\
    \ your application. As an aside, it also ignores any directories or files which\
    \ have names that begin with an _ or . character too.\n\nAlright, now that we’ve\
    \ got the scripts in place, let’s make a new file to hold some helper functions\
    \ for our integration tests:\n\n```\n$ touch internal/models/testutils_test.go\n\
    ```"
