  md: "```\n}\nerr = db.Ping()\nif err != nil {\n    db.Close()\n    return nil, err\n\
    }\n\nreturn db, nil\n}\n```\n\nThere're a few things about this code which are\
    \ interesting:\n\n+   • Notice how the import path for our driver is prefixed\
    \ with an underscore? This is because our `main.go` file doesn't actually use\
    \ anything in the `mysql` package. So if we try to import it normally the Go compiler\
    \ will raise an error. However, we need the driver's `init()` function to run\
    \ so that it can register itself with the `database/sql` package. The trick to\
    \ getting around this is to alias the package name to the blank identifier, like\
    \ we are here. This is standard practice for most of Go's SQL drivers.\n\n+  \
    \ • The `sql.Open()` function doesn't actually create any connections, all it\
    \ does is initialize the pool for future use. Actual connections to the database\
    \ are established lazily, as and when needed for the first time. So to verify\
    \ that everything is set up correctly we need to use the `db.Ping()` method to\
    \ create a connection and check for any errors. If there is an error, we call\
    \ `db.Close()` to close the connection pool and return the error.\n\n+   • Going\
    \ back to the `main()` function, at this moment in time the call to `defer db.Close()`\
    \ is a bit superfluous. Our application is only ever terminated by a signal interrupt\
    \ (i.e. `Ctrl+C`) or by `os.Exit(1)`. In both of those cases, the program exits\
    \ immediately and deferred functions are never run. But making sure to always\
    \ close the connection pool is a good habit to get into, and it could be beneficial\
    \ in the future if you add a graceful shutdown to your application.\n\n# ## Testing\
    \ a connection\n\nMake sure that the file is saved, and then try running the application.\
    \ If everything has gone to plan, the connection pool should be established and\
