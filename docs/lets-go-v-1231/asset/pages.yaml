    \ the main() function exits.\n\tdefer db.Close()\n\n\tapp := &application{\n\t\
    \tlogger: logger,\n\t}\n\n\tlogger.Info(\"starting server\", \"addr\", *addr)\n\
    \n\t// Because the err variable is now already declared in the code above, we\
    \ need\n\t// to use the assignment operator = here, instead of the := 'declare\
    \ and assign'\n\t// operator.\n\terr = http.ListenAndServe(*addr, app.routes())\n\
    \tlogger.Error(err.Error())\n\tos.Exit(1)\n}\n\n// The openDB() function wraps\
    \ sql.Open() and returns a sql.DB connection pool\n// for a given DSN.\nfunc openDB(dsn\
    \ string) (*sql.DB, error) {\n\tdb, err := sql.Open(\"mysql\", dsn)\n\tif err\
    \ != nil {\n\t\treturn nil, err\n```\n```"
