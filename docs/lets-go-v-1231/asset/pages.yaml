- pgno: 22
  md: '![](img/c3e650db0d8dfdecc0f8e34a67719f65_22_0.png)


    # Additional information


    # Additional servemux features


    There are a couple of other servemux features worth pointing out:


    +   - Request URL paths are automatically sanitized. If the request path contains
    any . or .. elements or repeated slashes, the user will automatically be redirected
    to an equivalent clean URL. For example, if a user makes a request to /foo/bar/../baz
    they will automatically be sent a 301 Permanent Redirect to /foo/baz instead.

    +   - If a subtree path has been registered and a request is received for that
    subtree path without a trailing slash, then the user will automatically be sent
    a 301 Permanent Redirect to the subtree path with the slash added. For example,
    if you have registered the subtree path /foo/, then any request to /foo will be
    redirected to /foo/.


    # Host name matching


    It''s possible to include host names in your route patterns. This can be useful
    when you want'
  merge: -1
  img_proc: true
- pgno: 23
  md: "to redirect all HTTP requests to a canonical URL, or if your application is\
    \ acting as the back end for multiple sites or services. For example:\n\n```\n\
    mux := http.NewServeMux()\nmux.HandleFunc(\"foo.example.org/\", fooHandler)\n\
    mux.HandleFunc(\"bar.example.org/\", barHandler)\nmux.HandleFunc(\"/baz\", bazHandler)\n\
    ```\n\nWhen it comes to pattern matching, any host-specific patterns will be checked\
    \ first and if there is a match the request will be dispatched to the corresponding\
    \ handler. Only when there isn’t a host-specific match found will the non-host\
    \ specific patterns also be checked.\n\n# The default servemux\n\nIf you’ve been\
    \ working with Go for a while you might have come across the http.Handle() and\
    \ http.HandleFunc() functions. These allow you to register routes without explicitly\
    \ declaring a servemux, like this:\n\n```\nfunc main() {\n\thttp.HandleFunc(\"\
    /\", home)\n\thttp.HandleFunc(\"/snippet/view\", snippetView)\n\thttp.HandleFunc(\"\
    /snippet/create\", snippetCreate)\n\n\tlog.Print(\"starting server on :4000\"\
    )\n\n\terr := http.ListenAndServe(\":4000\", nil)\n\tlog.Fatal(err)\n}\n```\n\n\
    Behind the scenes, these functions register their routes with something called\
    \ the default servemux. This is just a regular servemux like we’ve already been\
    \ using, but which is initialized automatically by Go and stored in the http.DefaultServeMux\
    \ global variable.\n\nIf you pass nil as the second argument to http.ListenAndServe(),\
    \ the server will use http.DefaultServeMux for routing.\n\nAlthough this approach\
    \ can make your code slightly shorter, I don’t recommend it for two reasons:\n\
    \n+   • It’s less explicit and feels more ‘magic’ than declaring and using your\
    \ own locally-scoped servemux.\n\n+   • Because http.DefaultServeMux is a global\
    \ variable in the standard library, it means any Go code in your project can access\
    \ it and potentially register a route. If you have a large project codebase (especially\
    \ one that is being worked on by many people), that can"
  merge: -1
  img_proc: true
- pgno: 24
  md: 'make it harder to ensure all route declarations for your application are easily
    discoverable in one central place.


    It also means that any third-party packages that your application imports can
    register routes with http.DefaultServeMux too. If one of those third-party packages
    is compromised, they could potentially use http.DefaultServeMux to expose a malicious
    handler to the web. It''s simple to avoid this risk by just not using http.DefaultServeMux.


    So, for the sake of clarity, maintainability and security, it''s generally a good
    idea to avoid http.DefaultServeMux and the corresponding helper functions. Use
    your own locally-scoped servemux instead, like we have been doing in this project
    so far.'
  merge: -1
