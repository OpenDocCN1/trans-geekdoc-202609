- pgno: 262
  md: '# Configuring HTTPS settings


    Go has good default settings for its HTTPS server, but it’s possible to optimize
    and customize how the server behaves.


    One change, which is almost always a good idea to make, is to restrict the *elliptic
    curves* that can potentially be used during the TLS handshake. Go supports a few
    elliptic curves, but as of Go 1.23 only `tls.CurveP256` and `tls.X25519` have
    assembly implementations. The others are very CPU intensive, so omitting them
    helps ensure that our server will remain performant under heavy loads.


    To make this tweak, we can create a `tls.Config` struct containing our non-default
    TLS settings, and add it to our `http.Server` struct before we start the server.


    I’ll demonstrate:'
  merge: -1
  img_proc: true
- pgno: 263
  md: "```\nFile: cmd/web/main.go\n\npackage main\n\nimport (\n\t\"crypto/tls\" //\
    \ New import\n\t\"database/sql\"\n\t\"flag\"\n\t\"html/template\"\n\t\"log/slog\"\
    \n\t\"net/http\"\n\t\"os\"\n\t\"time\"\n\n\t\"snippetbox.alexedwards.net/internal/models\"\
    \n\n\t\"github.com/alexedwards/scs/mysqlstore\"\n\t\"github.com/alexedwards/scs/v2\"\
    \n\t\"github.com/go-playground/form/v4\"\n\t_ \"github.com/go-sql-driver/mysql\"\
    \n)\n\n...\n\nfunc main() {\n\t...\n\n\tapp := &application{\n\t\tlogger:    \
    \  logger,\n\t\tsnippets:    &models.SnippetModel{DB: db},\n\t\ttemplateCache:\
    \ templateCache,\n\t\tformDecoder: formDecoder,\n\t\tsessionManager: sessionManager,\n\
    \t}\n\n\t// Initialize a tls.Config struct to hold the non-default TLS settings\
    \ we\n\t// want the server to use. In this case the only thing that we're changing\n\
    \t// is the curve preferences value, so that only elliptic curves with\n\t// assembly\
    \ implementations are used.\n\ttlsConfig := &tls.Config{\n\t\tCurvePreferences:\
    \ []tls.CurveID{tls.X25519, tls.CurveP256},\n\t}\n\n\t// Set the server's TLSConfig\
    \ field to use the tlsConfig variable we just\n\t// created.\n\tsrv := &http.Server{\n\
    \t\tAddr:      *addr,\n\t\tHandler:   app.routes(),\n\t\tErrorLog:  slog.NewLogLogger(logger.Handler(),\
    \ slog.LevelError),\n\t\tTLSConfig: tlsConfig,\n\t}\n\n\tlogger.Info(\"starting\
    \ server\", \"addr\", srv.Addr)\n\n\terr = srv.ListenAndServeTLS(\"./tls/cert.pem\"\
