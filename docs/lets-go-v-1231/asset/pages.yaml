- pgno: 102
  md: 'So, in summary:


    +   - You (or someone else in the future) can run `go mod download` to download
    the exact versions of all the packages that your project needs.

    +   - You can run `go mod verify` to ensure that nothing in those downloaded packages
    has been changed unexpectedly.

    +   - Whenever you run `go run`, `go test` or `go build`, the exact package versions
    listed in `go.mod` will always be used.


    And those things together makes it much easier to reliably create `reproducible
    builds` of your Go applications.


    # Additional information


    # Upgrading packages


    Once a package has been downloaded and added to your `go.mod` file the package
    and version are ‘fixed’. But there are many reasons why you might want to upgrade
    to use a newer version of a package in the future.


    To upgrade to latest available _minor or patch release_ of a package, you can
    simply run `go get` with the `-u` flag like so:


    ```

    $ go get -u github.com/foo/bar

    ```


    Or alternatively, if you want to upgrade to a specific version then you should
    run the same command but with the appropriate `@version` suffix. For example:


    ```

    $ go get -u github.com/foo/bar@v2.0.0

    ```


    # Removing unused packages


    Sometimes you might `go get` a package only to realize later that you don’t need
    it anymore. When this happens you’ve got two choices.


    You could either run `go get` and postfix the package path with `@none`, like
    so:'
  merge: -1
  img_proc: true
- pgno: 103
  md: '```

    $ go get github.com/foo/bar@none

    ```


    Or if you''ve removed all references to the package in your code, you can run
    `go mod tidy`, which will automatically remove any unused packages from your `go.mod`
    and `go.sum` files.


    ```

    $ go mod tidy

    ```'
