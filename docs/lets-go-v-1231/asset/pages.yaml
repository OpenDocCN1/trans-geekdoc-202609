  md: "# Testing HTTP handlers and middleware\n\nLet's move on and discuss some specific\
    \ techniques for unit testing your HTTP handlers.\n\nAll the handlers that we've\
    \ written for this project so far are a bit complex to test, and to introduce\
    \ things I'd prefer to start off with something more simple.\n\nSo, if you're\
    \ following along, head over to your handlers.go file and create a new ping handler\
    \ function which returns a 200 OK status code and an \"OK\" response body. It's\
    \ the type of handler that you might want to implement for status-checking or\
    \ uptime monitoring of your server.\n\n```\nFile: cmd/web/handlers.go\n\npackage\
    \ main\n\n...\n\nfunc ping(w http.ResponseWriter, r *http.Request) {\n    w.Write([]byte(\"\
    OK\"))\n}\n```\n\nIn this chapter we'll create a new TestPing unit test which:\n\
    \n+   * Checks that the response status code written by the ping handler is 200.\n\
    +   * Checks that the response body written by the ping handler is \"OK\".\n\n\
    # Recording responses\n\nGo provides a bunch of useful tools in the net/http/httptest\
    \ package for helping to test your HTTP handlers.\n\nOne of these tools is the\
    \ httptest.ResponseRecorder type. This is essentially an implementation of http.ResponseWriter\
    \ which records the response status code, headers and body instead of actually\
    \ writing them to a HTTP connection.\n\nSo an easy way to unit test your handlers\
    \ is to create a new httptest.ResponseRecorder, pass it to the handler function,\
    \ and then examine it again after the handler returns."
  merge: -1
  img_proc: true
- pgno: 353
  md: "Let's try doing exactly that to test the ping handler function.\n\nFirst, follow\
    \ the Go conventions and create a new handlers_test.go file to hold the test...\n\
    \n```\n$ touch cmd/web/handlers_test.go\n```\n\nAnd then add the following code:\n\
    \n```\nFile: cmd/web/handlers_test.go\n\npackage main\n\nimport (\n\t\"bytes\"\
    \n\t\"io\"\n\t\"net/http\"\n\t\"net/http/httptest\"\n\t\"testing\"\n\n\t\"snippetbox.alexedwards.net/internal/assert\"\
    \n)\n\nfunc TestPing(t *testing.T) {\n\t// Initialize a new httptest.ResponseRecorder.\n\
    \trr := httptest.NewRecorder()\n\n\t// Initialize a new dummy http.Request.\n\t\
    r, err := http.NewRequest(http.MethodGet, \"/\", nil)\n\tif err != nil {\n\t\t\
    t.Fatal(err)\n\t}\n\n\t// Call the ping handler function, passing in the\n\t//\
    \ httptest.ResponseRecorder and http.Request.\n\tping(rr, r)\n\n\t// Call the\
    \ Result() method on the http.ResponseRecorder to get the\n\t// http.Response\
    \ generated by the ping handler.\n\trs := rr.Result()\n\n\t// Check that the status\
    \ code written by the ping handler was 200.\n\tassert.Equal(t, rs.StatusCode,\
    \ http.StatusOK)\n\n\t// And we can check that the response body written by the\
    \ ping handler\n\t// equals \"OK\".\n\tdefer rs.Body.Close()\n\tbody, err := io.ReadAll(rs.Body)\n\
    \tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\n\tbody = bytes.TrimSpace(body)\n\n\
    \tassert.Equal(t, string(body), \"OK\")\n}\n```"
  merge: -1
  img_proc: true
- pgno: 354
  md: "Note: In the code above we use the t.Fatal() function in a couple of places\
    \ to handle situations where there is an unexpected error in our test code. When\
    \ called, t.Fatal() will mark the test as failed, log the error, and then completely\
    \ stop execution of the current test (or sub-test).\n\nTypically you should call\
    \ t.Fatal() in situations where it doesn't make sense to continue the current\
    \ test — such as an error during a setup step, or where an unexpected error from\
    \ a Go standard library function means you can't proceed with the test.\n\nOK,\
    \ save the file, then try running go test again with the verbose flag set. Like\
    \ so:\n\n```\n$ go test -v ./cmd/web/\n=== RUN   TestPing\n--- PASS: TestPing\
    \ (0.00s)\n=== RUN   TestHumanDate\n=== RUN   TestHumanDate/UTC\n=== RUN   TestHumanDate/Empty\n\
    === RUN   TestHumanDate/CET\n--- PASS: TestHumanDate (0.00s)\n    --- PASS: TestHumanDate/UTC\
    \ (0.00s)\n    --- PASS: TestHumanDate/Empty (0.00s)\n    --- PASS: TestHumanDate/CET\
    \ (0.00s)\nPASS\nok      snippetbox.alexedwards.net/cmd/web        0.003s\n```\n\
    \nSo this is looking good. We can see that our new TestPing test is being run\
    \ and passing without any problems.\n\n# Testing middleware\n\nIt's also possible\
    \ to use the same general pattern to unit test your middleware.\n\nWe'll demonstrate\
    \ this by creating a new TestCommonHeaders test for the commonHeaders() middleware\
