    \ nil))\n\n\t...\n\n\tsrv := &http.Server{\n\t\tAddr:     *addr,\n\t\tHandler:\
    \  app.routes(),\n\t\t// Create a *log.Logger from our structured logger handler,\
    \ which writes\n\t\t// log entries at Error level, and assign it to the ErrorLog\
    \ field. If\n\t\t// you would prefer to log the server errors at Warn level instead,\
    \ you\n\t\t// could pass slog.LevelWarn as the final parameter.\n\t\tErrorLog:\
    \ slog.NewLogLogger(logger.Handler(), slog.LevelError),\n\t}\n\n\tlogger.Info(\"\
    starting server\", \"addr\", srv.Addr)\n\n\terr = srv.ListenAndServe()\n\tlogger.Error(err.Error())\n\
    \tos.Exit(1)\n}\n\n...\n```\n\nWith that in place, any log messages that `http.Server`\
    \ automatically writes will now be written using our structured logger at `Error`\
    \ level. If you restart the application and make another request to `http://localhost:4000`,\
    \ you should see that the log entries now look"
