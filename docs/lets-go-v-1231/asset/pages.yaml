  md: "# # Dependency injection\n\nIf you open up your handlers.go file you'll notice\
    \ that the home handler function is still writing error messages using Go's standard\
    \ logger, not the structured logger that we now want to be using.\n\n```\n```go\n\
    func home(w http.ResponseWriter, r *http.Request) {\n\t...\n\nts, err := template.ParseFiles(files...)\n\
    if err != nil {\n\tlog.Print(err.Error()) // This isn't using our new structured\
    \ logger.\n\thttp.Error(w, \"Internal Server Error\", http.StatusInternalServerError)\n\
    \treturn\n}\n\nerr = ts.ExecuteTemplate(w, \"base\", nil)\nif err != nil {\n\t\
    log.Print(err.Error()) // This isn't using our new structured logger.\n\thttp.Error(w,\
    \ \"Internal Server Error\", http.StatusInternalServerError)\n}\n}\n```\n```\n\
    \nThis raises a good question: how can we make our new structured logger available\
    \ to our home function from main()?\n\nAnd this question generalizes further.\
    \ Most web applications will have multiple dependencies that their handlers need\
    \ to access, such as a database connection pool, centralized error handlers, and\
    \ template caches. What we really want to answer is: how can we make any dependency\
    \ available to our handlers?\n\nThere are a few different ways to do this, the\
    \ simplest being to just put the dependencies in global variables. But in general,\
    \ it is good practice to inject dependencies into your handlers. It makes your\
    \ code more explicit, less error-prone, and easier to unit test than if you use\
    \ global variables.\n\nFor applications where all your handlers are in the same\
    \ package, like ours, a neat way to inject dependencies is to put them into a\
    \ custom application struct, and then define your handler functions as methods\
    \ against application.\n\nI'll demonstrate.\n\nFirst open your main.go file and\
    \ create a new application struct like so:"
  merge: -1
  img_proc: true
- pgno: 84
  md: "```\nFile: cmd/web/main.go\n\npackage main\n\nimport (\n\t\"flag\"\n\t\"log/slog\"\
    \n\t\"net/http\"\n\t\"os\"\n)\n\n// Define an application struct to hold the application-wide\
    \ dependencies for the\n// web application. For now we'll only include the structured\
    \ logger, but we'll\n// add more to this as the build progresses.\ntype application\
    \ struct {\n\tlogger *slog.Logger\n}\n\nfunc main() {\n\t...\n}\n```\n\nAnd then\
    \ in the handlers.go file, we want to update the handler functions so that they\
    \ become *methods against the application struct* and use the structured logger\
    \ that it contains.\n\n```\nFile: cmd/web/handlers.go\n\npackage main\n\nimport\
    \ (\n\t\"fmt\"\n\t\"html/template\"\n\t\"net/http\"\n\t\"strconv\"\n)\n\n// Change\
    \ the signature of the home handler so it is defined as a method against\n// *application.\n\
    func (app *application) home(w http.ResponseWriter, r *http.Request) {\n\tw.Header().Add(\"\
    Server\", \"Go\")\n\n\tfiles := []string{\n\t\t\"./ui/html/base.tmpl\",\n\t\t\"\
    ./ui/html/partials/nav.tmpl\",\n\t\t\"./ui/html/pages/home.tmpl\",\n\t}\n\nts,\
    \ err := template.ParseFiles(files...)\n\tif err != nil {\n\t\t// Because the\
    \ home handler is now a method against the application\n\t\t// struct it can access\
    \ its fields, including the structured logger. We'll\n\t\t// use this to create\
    \ a log entry at Error level containing the error\n\t\t// message, also including\
