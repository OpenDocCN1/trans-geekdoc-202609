  md: '# Rendering multiple pieces of data


    An important thing to explain is that Go’s html/template package allows you to
    pass in one — and only one — item of dynamic data when rendering a template. But
    in a real-world application there are often multiple pieces of dynamic data that
    you want to display in the same page.


    A lightweight and type-safe way to achieve this is to wrap your dynamic data in
    a struct which acts like a single ‘holding structure’ for your data.


    Let’s create a new cmd/web/templates.go file, containing a templateData struct
    to do exactly that.


    ```

    $ touch cmd/web/templates.go

    ```'
