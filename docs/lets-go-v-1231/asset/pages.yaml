- pgno: 184
  md: "# Request logging\n\nLet's continue in the same vein and add some middleware\
    \ to log HTTP requests.\nSpecifically, we're going to use the structured logger\
    \ that we created earlier to record the IP\naddress of the user, and the method,\
    \ URI and HTTP version for the request.\n\nOpen your middleware.go file and create\
    \ a logRequest() method using the standard\nmiddleware pattern, like so:\n\n```\n\
    File: cmd/web/middleware.go\n\npackage main\n\n...\n\nfunc (app *application)\
    \ logRequest(next http.Handler) http.Handler {\n\treturn http.HandlerFunc(func(w\
    \ http.ResponseWriter, r *http.Request) {\n\t\tvar (\n\t\t\tip     = r.RemoteAddr\n\
    \t\t\tproto  = r.Proto\n\t\t\tmethod = r.Method\n\t\t\turi    = r.URL.RequestURI()\n\
    \t\t)\n\n\t\tapp.logger.Info(\"received request\", \"ip\", ip, \"proto\", proto,\
    \ \"method\", method, \"uri\", uri)\n\n\t\tnext.ServeHTTP(w, r)\n\t})\n}\n```\n\
    \nNotice that this time we're implementing the middleware as a method on application?\n\
    \nThis is perfectly valid to do. Our middleware method has the same signature\
    \ as before, but\nbecause it is a method against application it also has access\
    \ to the handler dependencies\nincluding the structured logger.\n\nNow let's update\
    \ our routes.go file so that the logRequest middleware is executed first,\nand\
    \ for all requests, so that the flow of control (reading from left to right) looks\
    \ like this:\n\n```\nlogRequest ↔ commonHeaders ↔ servemux ↔ application handler\n\
    ```"
  merge: -1
  img_proc: true
