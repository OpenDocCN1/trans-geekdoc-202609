- pgno: 264
  md: "# Additional information\n\n# TLS versions\n\nBy default, Go’s HTTPS server\
    \ is configured to support TLS 1.2 and 1.3. You can customize this and change\
    \ the minimum and maximum TLS versions using the\ntls.Config.MinVersion and MaxVersion\
    \ fields and TLS versions constants in the\ncrypto/tls package.\n\nFor example,\
    \ if you want the server to support TLS versions 1.0 to 1.2 only, you can use\
    \ a\nconfiguration like so:\n\n```\ntlsConfig := &tls.Config{\n  MinVersion: tls.VersionTLS10,\n\
    \  MaxVersion: tls.VersionTLS12,\n}\n```\n\n# Cipher suites\n\nThe cipher suites\
    \ that Go supports are also defined in the crypto/tls package constants.\n\nHowever\
    \ some of these cipher suites (specifically, the cipher suites that do not support\n\
    Perfect Forward Secrecy, or which use RC4, 3DES or CBC_SHA256) are considered\
    \ weak and\nare not used by Go’s HTTPS server by default. As of Go 1.23, the cipher\
    \ suites that Go’s\nHTTPS server uses by default are:\n\n| Cipher Suite | Note\
    \ |\n| :--- | :--- |\n| TLS_AES_128_GCM_SHA256 | // TLS 1.3 connections only |\n\
    | TLS_AES_256_GCM_SHA384 | // TLS 1.3 connections only |\n| TLS_CHACHA20_POLY1305_SHA256\
    \ | // TLS 1.3 connections only |\n| TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256 |\
    \ // TLS 1.2 connections only |\n| TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384 | //\
    \ TLS 1.2 connections only |\n| TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256 | // TLS\
    \ 1.2 connections only |\n| TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384 | // TLS 1.2\
    \ connections only |\n| TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256 | // TLS 1.2\
    \ connections only |\n| TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256 | // TLS\
    \ 1.2 connections only |\n| TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA | // TLS 1.0,\
    \ 1.1 and 1.2 connections |\n| TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA | // TLS 1.0,\
    \ 1.1 and 1.2 connections |\n| TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA | // TLS 1.0,\
    \ 1.1 and 1.2 connections |\n| TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA | // TLS 1.0,\
    \ 1.1 and 1.2 connections |"
  merge: -1
  img_proc: true
- pgno: 265
  md: "Important: For client compatibility reasons, this default list includes some\
    \ CBC ciphers that are vulnerable to Lucky Thirteen timing attacks. The Go implementation\
    \ of these has been patched to provide some — but not full — mitigation against\
    \ potential attacks .\n\nIf you want to change the cipher suites used by Go's\
    \ HTTPS server — either by including weak cipher suites that aren't used by default,\
    \ or removing certain ciphers which are used by default — you can do this via\
    \ the `tls.Config.CipherSuites` field.\n\nFor example, if you want to use the\
    \ default cipher list but *with the CBC ciphers omitted*, you can configure your\
    \ `tls.Config` like this:\n\n```\ntlsConfig := &tls.Config{\n    CipherSuites:\
    \ []uint16{\n        tls.TLS_AES_128_GCM_SHA256,\n        tls.TLS_AES_256_GCM_SHA384,\n\
    \        tls.TLS_CHACHA20_POLY1305_SHA256,\n        tls.TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,\n\
    \        tls.TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,\n        tls.TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,\n\
    \        tls.TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,\n        tls.TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256,\n\
    \        tls.TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,\n    },\n}\n```\n\n\
    Go will automatically choose *which* of these cipher suites is actually used at\
    \ runtime based on the cipher security, performance, and client/server hardware\
    \ support.\n\nIt's also important (and interesting) to note that if a TLS 1.3\
    \ connection is negotiated, the `tls.Config.CipherSuites` will be ignored. The\
    \ reason for this is that all the cipher suites that Go supports for TLS 1.3 connections\
    \ are considered to be *safe*, so there isn't much point in providing a mechanism\
    \ to configure them.\n\nBasically, using `tls.Config.CipherSuites` to set a custom\
    \ list of supported cipher suites will affect TLS 1.0-1.2 connections only. So,\
    \ in the above example, it isn't actually necessary to include the TLS 1.3 specific\
    \ ciphers and it can be simplified to this:"
  merge: -1
  img_proc: true
- pgno: 266
  md: "```\ntlsConfig := &tls.Config{\n\tCipherSuites: []uint16{\n\t\ttls.TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,\n\
    \t\ttls.TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,\n\t\ttls.TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,\n\
    \t\ttls.TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,\n\t\ttls.TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256,\n\
    \t\ttls.TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256,\n\t},\n}\n```\n\n**Important:**\
    \ Restricting the supported cipher suites can mean that users with certain older\
    \ browsers won't be able to use your website. There's a balance to be struck between\
    \ security and backwards-compatibility, and the right decision for you will depend\
    \ on the technology typically used by your user base. Mozilla's recommended configurations\
    \ for modern, intermediate and old browsers may assist you in making a decision\
    \ here."
  merge: -1
  img_proc: true
- pgno: 267
  md: "# # Connection timeouts\n\nLet’s take a moment to improve the resiliency of\
    \ our server by adding some timeout settings, like so:\n\n```\nFile: cmd/web/main.go\n\
    \npackage main\n\n...\n\nfunc main() {\n    ...\n\n    tlsConfig := &tls.Config{\n\
    \        CurvePreferences: []tls.CurveID{tls.X5519, tls.CurveP256},\n    }\n\n\
    \    srv := &http.Server{\n        Addr:         *addr,\n        Handler:    \
    \  app.routes(),\n        ErrorLog:     slog.NewLogLogger(logger.Handler(), slog.LevelError),\n\
    \        TLSConfig:    tlsConfig,\n\n        // Add Idle, Read and Write timeouts\
    \ to the server.\n        IdleTimeout:  time.Minute,\n        ReadTimeout:  5\
    \ * time.Second,\n        WriteTimeout: 10 * time.Second,\n    }\n\n    logger.Info(\"\
    starting server\", \"addr\", srv.Addr)\n\n    err = srv.ListenAndServeTLS(\"./tls/cert.pem\"\
    , \"./tls/key.pem\")\n    logger.Error(err.Error())\n    os.Exit(1)\n}\n\n...\n\
    ```\n\nAll three of these timeouts — *IdleTimeout*, *ReadTimeout* and *WriteTimeout*\
    \ — are server-wide settings which act on the underlying connection and apply\
    \ to all requests irrespective of their handler or URL.\n\n# ## The IdleTimeout\
    \ setting\n\nBy default, Go enables keep-alives on all accepted connections. This\
    \ helps reduce latency (especially for HTTPS connections) because a client can\
    \ reuse the same connection for multiple requests without having to repeat the\
