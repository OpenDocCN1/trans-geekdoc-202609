  md: "# # Setting up the session manager\n\nIn this chapter I'll run through the\
    \ basics of setting up and using the **alexedwards/scs** package, but if you're\
    \ going to use it in a production application I recommend reading the documentation\
    \ and API reference to familiarize yourself with the full range of features.\n\
    \nThe first thing we need to do is create a **sessions** table in our MySQL database\
    \ to hold the session data for our users. Start by connecting to MySQL from your\
    \ terminal window as the **root** user and execute the following SQL statement\
    \ to setup the **sessions** table:\n\n```\nUSE snippetbox;\n\nCREATE TABLE sessions\
    \ (\n    token CHAR(43) PRIMARY KEY,\n    data BLOB NOT NULL,\n    expiry TIMESTAMP(6)\
    \ NOT NULL\n);\n\nCREATE INDEX sessions_expiry_idx ON sessions (expiry);\n```\n\
    \nIn this table:\n\n+   - The **token** field will contain a unique, randomly-generated,\
    \ identifier for each session.\n+   - The **data** field will contain the actual\
    \ session data that you want to share between HTTP requests. This is stored as\
    \ binary data in a **BLOB** (binary large object) type.\n+   - The **expiry**\
    \ field will contain an expiry time for the session. The **scs** package will\
    \ automatically delete expired sessions from the **sessions** table so that it\
