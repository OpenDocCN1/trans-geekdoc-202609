- pgno: 313
  md: '# CSRF protection


    In this chapter we''ll look at how to protect our application from cross-site
    request forgery (CSRF) attacks.


    If you''re not familiar with the principles of CSRF, it''s a type of attack where
    a malicious third-party website sends state-changing HTTP requests to your website.
    A great explanation of the basic CSRF attack can be found here.


    In our application, the main risk is this:


    +   • A user logs into our application. Our session cookie is set to persist for
    12 hours, so they will remain logged in even if they navigate away from the application.


    +   • The user then goes to another website, which contains some malicious code
    that sends a cross-site request to our POST /snippet/create endpoint to add a
    new snippet to our database. The user’s session cookie for our application will
    be sent along with this request.


    +   • Because the request includes the session cookie, our application will interpret
    the request as coming from a logged-in user and it will process the request with
    that user’s privileges. So completely unknown to the user, a new snippet will
    be added to our database.


    As well as ‘traditional’ CSRF attacks like the above (where a request is processed
    with a logged-in user’s privileges) your application may also be at risk from
    login and logout CSRF attacks.


    # SameSite cookies


    One mitigation that we can take to prevent CSRF attacks is to make sure that the
    SameSite attribute is appropriately set on our session cookie.


    By default the alexedwards/scs package that we’re using always sets SameSite=Lax
    on the session cookie. This means that the session cookie won’t be sent by the
    user’s browser for any cross-site requests with the HTTP methods POST, PUT or
    DELETE.


    So long as our application uses the POST method for any state-changing HTTP requests
    (like we are for our login, signup, logout and create snippet form submissions),
    it means that the'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'session cookie won’t be sent for these requests if they come from another website
    — thereby preventing the CSRF attack.


    However, the SameSite attribute is still relatively new and only fully supported
    by 96% of browsers worldwide. So, although it’s something that we can (and should)
    use as a defensive measure, we can’t rely on it for all users.


    # Token-based mitigation


    To mitigate the risk of CSRF for all users we’ll also need to implement some form
    of token check. Like session management and password hashing, when it comes to
    this there’s a lot that you can get wrong... so it’s probably safest to use a
    tried-and-tested third-party package instead of rolling your own implementation.


    The two most popular packages for stopping CSRF attacks in Go web applications
    are gorilla/csrf and justinas/nosurf. They both do roughly the same thing, using
    the double-submit cookie pattern to prevent attacks. In this pattern a random
    CSRF token is generated and sent to the user in a CSRF cookie. This CSRF token
    is then added to a hidden field in each HTML form that is potentially vulnerable
    to CSRF. When the form is submitted, both packages use some middleware to check
    that the hidden field value and cookie value match.


    Out of the two packages, we’ll opt to use justinas/nosurf in this book. I prefer
    it primarily because it’s self-contained and doesn’t have any additional dependencies.
    If you’re following along, you can install the latest version like so:


    ```

    $ go get github.com/justinas/nosurf@v1

    go: downloading github.com/justinas/nosurf v1.1.1

    go get: added github.com/justinas/nosurf v1.1.1

    ```


    # Using the nosurf package


    To use justinas/nosurf, open up your cmd/web/middleware.go file and create a new
    noSurf() middleware function like so:'
  merge: -1
  img_proc: true
- pgno: 315
  md: "```\nFile: cmd/web/middleware.go\n\npackage main\n\nimport (\n\t\"fmt\"\n\t\
    \"net/http\"\n\n\t\"github.com/justinas/nosurf\" // New import\n)\n\n...\n\n//\
    \ Create a NoSurf middleware function which uses a customized CSRF cookie with\n\
    // the Secure, Path and HttpOnly attributes set.\nfunc noSurf(next http.Handler)\
    \ http.Handler {\n\tcsrfHandler := nosurf.New(next)\n\tcsrfHandler.SetBaseCookie(http.Cookie{\n\
    \t\tHttpOnly: true,\n\t\tPath:     \"/\",\n\t\tSecure:   true,\n\t})\n\n\treturn\
    \ csrfHandler\n}\n```\n\nOne of the forms that we need to protect from CSRF attacks\
    \ is our logout form, which is included in our `nav.tmpl` partial and could potentially\
    \ appear on any page of our application. So, because of this, we need to use our\
    \ `noSurf()` middleware on _all_ of our application routes (apart from `GET /static/`).\n\
    \nSo, let's update the `cmd/web/routes.go` file to add this `noSurf()` middleware\
    \ to the dynamic middleware chain that we made earlier:"
  merge: -1
  img_proc: true
