- pgno: 252
  md: '# # Generating a self-signed TLS certificate


    Let’s switch our attention to getting our application using HTTPS (rather than
    plain HTTP) for all requests and responses.


    HTTPS is essentially HTTP sent across a TLS (_Transport Layer Security_) connection.
    The advantage to this is that HTTPS traffic is encrypted and signed, which helps
    ensure its privacy and integrity during transit.


    > > **Note:** If you’re not familiar with the term, TLS is essentially the modern
    version of SSL (_Secure Sockets Layer_). SSL now has been officially deprecated
    due to security concerns, but the name still lives on in the public consciousness
    and is often used interoperably with TLS. For clarity and accuracy, we’ll stick
    with the term TLS throughout this book.


    Before our server can start using HTTPS, we need to generate a _TLS certificate_.


    For production servers I recommend using Let’s Encrypt to create your TLS certificates,
    but for development purposes the simplest thing to do is to generate your own
    _self-signed certificate_.


    A self-signed certificate is the same as a normal TLS certificate, except that
    it isn’t cryptographically signed by a trusted certificate authority. This means
    that your web browser will raise a warning the first time it’s used, but it will
    nonetheless encrypt HTTPS traffic correctly and is fine for development and testing
    purposes.


    Handily, the `crypto/tls` package in Go’s standard library includes a `generate_cert.go`
    tool that we can use to easily create our own self-signed certificate.


    If you’re following along, first create a new `tls` directory in the root of your
    project repository to hold the certificate and change into it:


    ```

    ```

    $ cd $HOME/code/snippetbox

    $ mkdir tls

    $ cd tls

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'To run the generate_cert.go tool, you''ll need to know the place on your computer
    where the source code for the Go standard library is installed. If you''re using
    Linux, macOS or FreeBSD and followed the official install instructions, then the
    generate_cert.go file should be located under /usr/local/go/src/crypto/tls.


    If you''re using macOS and installed Go using Homebrew, the file will probably
    be at /usr/local/Cellar/go/<version>/libexec/src/crypto/tls/generate_cert.go or
    a similar path.


    Once you know where it is located, you can then run the generate_cert.go tool
    like so:


    ```

    ```

    $ go run /usr/local/go/src/crypto/tls/generate_cert.go --rsa-bits=2048 --host=localhost

    2024/03/18 11:29:23 wrote cert.pem

    2024/03/18 11:29:23 wrote key.pem

    ```

    ```


    Behind the scenes, this generate_cert.go command works in two stages:


    +   1. First it generates a 2048-bit RSA key pair, which is a cryptographically
    secure public key and private key.


    +   2. It then stores the private key in a key.pem file, and generates a self-signed
    TLS certificate for the host localhost containing the public key — which it stores
    in a cert.pem file. Both the private key and certificate are PEM encoded, which
    is the standard format used by most TLS implementations.


    Your project repository should now look something like this:'
  merge: -1
  img_proc: true
- pgno: 254
  md: '![](img/c3e650db0d8dfdecc0f8e34a67719f65_254_0.png)


    And that’s it! We’ve now got a self-signed TLS certificate (and corresponding
    private key) that we can use during development.


    # Additional information


    # The mkcert tool


    As an alternative to the generate_cert.go tool, you might want to consider using
    mkcert to generate the TLS certificates. Although this requires some extra set
    up, it has the advantage that the generated certificates are locally trusted —
    meaning that you can use them for testing and development without getting security
    warnings in your web browser.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# Running a HTTPS server


    Now that we have a self-signed TLS certificate and corresponding private key,
    starting a HTTPS web server is lovely and simple — we just need open the `main.go`
    file and swap the `srv.ListenAndServe()` method for `srv.ListenAndServeTLS()`
    instead.


    Alter your `main.go` file to match the following code:'
  merge: -1
  img_proc: true
- pgno: 256
  md: "```\npackage main\n\n...\n\nfunc main() {\n\taddr := flag.String(\"addr\",\
    \ \":4000\", \"HTTP network address\")\n\tdsn := flag.String(\"dsn\", \"web:pass@/snippetbox?parseTime=true\"\
    , \"MySQL data source name\")\n\tflag.Parse()\n\n\tlogger := slog.New(slog.NewTextHandler(os.Stderr,\
    \ nil))\n\n\tdb, err := openDB(*dsn)\n\tif err != nil {\n\t\tlogger.Error(err.Error())\n\
    \t\tos.Exit(1)\n\t}\n\n\tdefer db.Close()\n\n\ttemplateCache, err := newTemplateCache()\n\
    \tif err != nil {\n\t\tlogger.Error(err.Error())\n\t\tos.Exit(1)\n\t}\n\n\tformDecoder\
    \ := form.NewDecoder()\n\n\tsessionManager := scs.New()\n\tsessionManager.Store\
    \ = mysqlstore.New(db)\n\tsessionManager.Lifetime = 12 * time.Hour\n\t// Make\
    \ sure that the Secure attribute is set on our session cookies.\n\t// Setting\
    \ this means that the cookie will only be sent by a user's web\n\t// browser when\
    \ a HTTPS connection is being used (and won't be sent over an\n\t// insecure HTTP\
    \ connection).\n\tsessionManager.Cookie.Secure = true\n\n\tapp := &application{\n\
    \t\tlogger:      logger,\n\t\tsnippets:    &models.SnippetModel{DB: db},\n\t\t\
    templateCache: templateCache,\n\t\tformDecoder: formDecoder,\n\t\tsessionManager:\
    \ sessionManager,\n\t}\n\n\tsrv := &http.Server{\n\t\tAddr:     *addr,\n\t\tHandler:\
    \  app.routes(),\n\t\tErrorLog: slog.NewLogLogger(logger.Handler(), slog.LevelError),\n\
    \t}\n\n\tlogger.Info(\"starting server\", \"addr\", srv.Addr)\n\n\t// Use the\
    \ ListenAndServeTLS() method to start the HTTPS server. We\n\t// pass in the paths\
    \ to the TLS certificate and corresponding private key as\n\t// the two parameters.\n\
    \terr = srv.ListenAndServeTLS(\"./tls/cert.pem\", \"./tls/key.pem\")\n\tlogger.Error(err.Error())\n\
    \tos.Exit(1)\n}\n\n...\n```"
