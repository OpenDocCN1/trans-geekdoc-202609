    \n)\n\nfunc home(w http.ResponseWriter, r *http.Request) {\n\tw.Header().Add(\"\
    Server\", \"Go\")\n\n\t// Use the template.ParseFiles() function to read the template\
    \ file into a\n\t// template set. If there's an error, we log the detailed error\
    \ message, use\n\t// the http.Error() function to send an Internal Server Error\
    \ response to the\n\t// user, and then return from the handler so no subsequent\
    \ code is executed.\n\tts, err := template.ParseFiles(\"./ui/html/pages/home.tpl\"\
    )\n\tif err != nil {\n\t\tlog.Print(err.Error())\n\t\thttp.Error(w, \"Internal\
    \ Server Error\", http.StatusInternalServerError)\n\t\treturn\n\t}\n\n\t// Then\
    \ we use the Execute() method on the template set to write the\n\t// template\
    \ content as the response body. The last parameter to Execute()\n\t// represents\
    \ any dynamic data that we want to pass in, which for now we'll\n\t// leave as\
    \ nil.\n\terr = ts.Execute(w, nil)\n\tif err != nil {\n\t\tlog.Print(err.Error())\n\
    \t\thttp.Error(w, \"Internal Server Error\", http.StatusInternalServerError)\n\
    \t}\n}\n...\n```\n\nThere are a couple of important things about this code to\
    \ point out:\n\n+   - The file path that you pass to the template.ParseFiles()\
    \ function must either be relative to your current working directory, or an absolute\
    \ path. In the code above I've made the path relative to the root of the project\
    \ directory.\n\n+   - If either the template.ParseFiles() or ts.Execute() functions\
    \ return an error, we log the detailed error message and then use the http.Error()\
    \ function to send a response to the user. http.Error() is a lightweight helper\
    \ function which sends a plain text error message and a specific HTTP status code\
    \ to the user (in our code we send the message \"Internal Server Error\" and the\
