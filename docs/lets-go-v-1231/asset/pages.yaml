- pgno: 369
  md: "# # Mocking dependencies\n\nNow that we've explained some general patterns\
    \ for testing your web application, in this chapter we're going to get a bit more\
    \ serious and write some tests for our GET /snippet/view/{id} route.\n\nBut first,\
    \ let's talk about dependencies.\n\nThroughout this project we've injected dependencies\
    \ into our handlers via the application struct, which currently looks like this:\n\
    \n```\n```go\ntype application struct {\n\tlogger\t\t\t*slog.Logger\n\tsnippets\t\
    \t*models.SnippetModel\n\tusers\t\t\t*models.UserModel\n\ttemplateCache\tmap[string]*template.Template\n\
    \tformDecoder\t\t*form.Decoder\n\tsessionManager\t*scs.SessionManager\n}\n```\n\
    ```\n\nWhen testing, it sometimes makes sense to mock these dependencies instead\
    \ of using exactly the same ones that you do in your production application.\n\
    \nFor example, in the previous chapter we mocked the logger dependency with a\
    \ logger that write messages to io.Discard, instead of the os.Stdout and stream\
    \ like we do in our production application:\n\n```\n```go\nfunc newTestApplication(t\
    \ *testing.T) *application {\n\treturn &application{\n\t\tlogger: slog.New(slog.NewTextHandler(io.Discard,\
    \ nil)),\n\t}\n}\n```\n```\n\nThe reason for mocking this and writing to io.Discard\
    \ is to avoid clogging up our test output with unnecessary log messages when we\
    \ run go test -v (with verbose mode enabled)."
  merge: -1
  img_proc: true
- pgno: 370
  md: '> Note: Depending on your background and programming experience, you might
    not consider this logger to a mock. You might call it a fake, stub or something
    else entirely. But the name doesn''t really matter — and different people call
    them different things. What''s important is that we''re using something which
    exposes the same interface as a production object for the purpose of testing.


    The other two dependencies that it makes sense for us to mock are the models.SnippetModel
    and models.UserModel database models. By creating mocks of these it''s possible
    for us to test the behavior of our handlers without needing to setup an entire
    test instance of the MySQL database.


    # # Mocking the database models


    If you''re following along, create a new internal/models/mocks package containing
    snippets.go and user.go files to hold the database model mocks, like so:


    ```

    $ mkdir internal/models/mocks

    $ touch internal/models/mocks/snippets.go

    $ touch internal/models/mocks/users.go

    ```


    Let''s begin by creating a mock of our models.SnippetModel. To do this, we''re
    going to create a simple struct which implements the same methods as our production
    models.SnippetModel, but have the methods return some fixed dummy data instead.'
  merge: -1
  img_proc: true
