  md: "# The server error log\n\nIt's important to be aware that Go's http.Server\
    \ may write its own log entries relating to things like unrecovered panics, or\
    \ problems accepting or writing to HTTP connections.\n\nBy default, it writes\
    \ these entries using the standard logger — which means they will be written to\
    \ the standard error stream (instead of standard out like our other log entries),\
    \ and they won't be in the same format as the rest of our nice structured log\
    \ entries.\n\nTo demonstrate this, let's add a deliberate error to our application\
    \ and set a Content-Length header with an invalid value on our responses. Go ahead\
    \ and update the render() helper like so:\n\n```\nFile: cmd/web/helpers.go\n\n\
    package main\n\n...\n\nfunc (app *application) render(w http.ResponseWriter, r\
    \ *http.Request, status int, page string, data templateData) {\n\tts, ok := app.templateCache[page]\n\
    \tif !ok {\n\t\terr := fmt.Errorf(\"the template %s does not exist\", page)\n\t\
    \tapp.serverError(w, r, err)\n\t\treturn\n\t}\n\n\tbuf := new(bytes.Buffer)\n\n\
    \terr := ts.ExecuteTemplate(buf, \"base\", data)\n\tif err != nil {\n\t\tapp.serverError(w,\
