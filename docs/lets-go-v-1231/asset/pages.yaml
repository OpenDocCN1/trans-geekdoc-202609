  md: "# Centralized error handling\n\nLet's neaten up our application by moving some\
    \ of the error handling code into helper methods. This will help separate our\
    \ concerns and stop us repeating code as we progress through the build.\n\nGo\
    \ ahead and add a new helpers.go file under the cmd/web directory:\n\n```\n$ touch\
    \ cmd/web/helpers.go\n```\n\nAnd add the following code:\n\n```\nFile: cmd/web/helpers.go\n\
    \npackage main\n\nimport (\n\t\"net/http\"\n)\n\n// The serverError helper writes\
    \ a log entry at Error level (including the request\n// method and URI as attributes),\
    \ then sends a generic 500 Internal Server Error\n// response to the user.\nfunc\
    \ (app *application) serverError(w http.ResponseWriter, r *http.Request, err error)\
    \ {\n\tvar (\n\t\tmethod = r.Method\n\t\turi    = r.URL.RequestURI()\n\t)\n\n\t\
    app.logger.Error(err.Error(), \"method\", method, \"uri\", uri)\n\n\thttp.Error(w,\
    \ http.StatusText(http.StatusInternalServerError), http.StatusInternalServerError)\n\
    }\n\n// The clientError helper sends a specific status code and corresponding\
    \ description\n// to the user. We'll use this later in the book to send responses\
    \ like 400 \"Bad\n// Request\" when there's a problem with the request that the\
    \ user sent.\nfunc (app *application) clientError(w http.ResponseWriter, status\
    \ int) {\n\thttp.Error(w, http.StatusText(status), status)\n}\n```\n\nIn this\
    \ code we've also introduced one other new thing: the http.StatusText() function.\
    \ This returns a human-friendly text representation of a given HTTP status code\
    \ — for example http.StatusText(400) will return the string \"Bad Request\", and\
    \ http.StatusText(500) will return the string \"Internal Server Error\".\n\nNow\
    \ that's done, head back to your handlers.go file and update it to use the new\
    \ serverError() helper:"
