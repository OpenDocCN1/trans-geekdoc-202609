    # Additional information


    # Safer attributes


    Let''s say that you accidentally write some code where you forget to include either
    the key

    or value for an attribute. For example:


    ```

    logger.Info("starting server", "addr") // Oops, the value for "addr" is missing

    ```


    When this happens, the log entry will still be written but the attribute will
    have the key

    !BADKEY, like so:


    ```

    time=2024-03-18T11:29:23.000+00:00 level=INFO msg="starting server" !BADKEY=addr

    ```


    To avoid this happening and catch any problems at compile-time, you can use the

    slog.Any() function to create an attribute pair instead:


    ```

    logger.Info("starting server", slog.Any("addr", ":4000"))

    ```


    Or you can go even further and introduce some additional type safety by using
    the

    slog.String(), slog.Int(), slog.Bool(), slog.Time() and slog.Duration() functions
    to

    create attributes with a specific type of value.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '```

    logger.Info("starting server", slog.String("addr", ":4000"))

    ```


    Whether you want to use these functions or not is up to you. The log/slog package
    is relatively new to Go (introduced in Go 1.21), and there isn''t much in the
    way of established best-practices or conventions around using it yet. But the
    trade-off is straightforward...

    using functions like slog.String() to create attributes is more verbose, but safer
    in sense that it reduces the risk of bugs in your application.


    # JSON formatted logs


    The slog.NewTextHandler() function that we''ve used in this chapter creates a
    handler that writes plaintext log entries. But it''s possible to create a handler
    that writes log entries as JSON objects instead using the slog.NewJSONHandler()
    function. Like so:


    ```

    logger := slog.New(slog.NewJSONHandler(os.Stdout, nil))

    ```


    When using the JSON handler, the log output will look similar to this:


    ```

    {"time":"2024-03-18T11:29:23.000000000+00:00","level":"INFO","msg":"starting server","addr":":4000"}

    {"time":"2024-03-18T11:29:23.000000000+00:00","level":"ERROR","msg":"listen tcp
    :4000: bind: address already in use"}

    ```


    # Minimum log level


    As we''ve mentioned a couple of times, the log/slog package supports four severity
    levels:

    Debug, Info, Warn and Error in that order. Debug is the least severe level, and
    Error is the most severe.


    By default, the minimum log level for a structured logger is Info. That means
    that any log entries with a severity less than Info — i.e. Debug level entries
    — will be silently discarded.


    You can use the slog.HandlerOptions struct to override this and set the minimum
    level to Debug (or any other level) if you want:


    ```

    logger := slog.New(slog.NewTextHandler(os.Stdout, &slog.HandlerOptions{

    Level: slog.LevelDebug,

    }))

    ```


    # Caller location


    You can also customize the handler so that it includes the filename and line number
    of the'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'calling source code in the log entries, like so:


    ```

    logger := slog.New(slog.NewTextHandler(os.Stdout, &slog.HandlerOptions{

    AddSource: true,

    }))

    ```


    The log entries will look similar to this, with the caller location recorded under
    the source key:


    ```

    time=2024-03-18T11:29:23.000+00:00 level=INFO source=/home/alex/code/snippetbox/cmd/web/main.go:32
    msg="starting server" addr

    ```


    # Decoupled logging


    In this chapter we''ve set up our structured logger to write entries to os.Stdout
    — the standard out stream.


    The big benefit of writing log entries to os.Stdout is that your application and
    logging are decoupled. Your application itself isn''t concerned with the routing
    or storage of the logs, and that can make it easier to manage the logs differently
    depending on the environment.


    During development, it''s easy to view the log output because the standard out
    stream is displayed in the terminal.


    In staging or production environments, you can redirect the stream to a final
    destination for viewing and archival. This destination could be on-disk files,
    or a logging service such as Splunk. Either way, the final destination of the
    logs can be managed by your execution environment independently of the application.


    For example, we could redirect the standard out stream to a on-disk file when
    starting the application like so:


    ```

    $ go run ./cmd/web >> /tmp/web.log

    ```


    > Note: Using the double arrow >> will append to an existing file, instead of
    truncating it when starting the application.


    # Concurrent logging


    Custom loggers created by slog.New() are concurrency-safe. You can share a single
    logger'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'and use it across multiple goroutines and in your HTTP handlers without needing
    to worry about race conditions.


    That said, if you have *multiple* structured loggers writing to the same destination
    then you need to be careful and ensure that the destination''s underlying `Write()`
    method is also safe for concurrent use.'
