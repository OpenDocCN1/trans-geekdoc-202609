- pgno: 343
  md: '# Testing


    And so we finally come to the topic of testing.


    Like structuring and organizing your application code, there’s no single ‘right’
    way to structure and organize your tests in Go. But there are some conventions,
    patterns and good-practices that you can follow.


    In this section we’re going to add tests for a selection of the code in our application,
    with the goal of demonstrating the general syntax for creating tests and illustrating
    some patterns that you can reuse in a wide-variety of applications.


    You''ll learn:


    +   - How to create and run table-driven unit tests and sub-tests in Go.

    +   - How to unit test your HTTP handlers and middleware.

    +   - How to perform ‘end-to-end’ testing of your web application routes, middleware
    and handlers.

    +   - How to create mocks of your database models and use them in unit tests.

    +   - A pattern for testing CSRF-protected HTML form submissions.

    +   - How to use a test instance of MySQL to perform integration tests.

    +   - How to easily calculate and profile code coverage for your tests.'
  merge: -1
  img_proc: true
- pgno: 344
  md: "# # Unit testing and sub-tests\n\nIn this chapter we’ll create a unit test\
    \ to make sure that our humanDate() function (which we made back in the custom\
    \ template functions chapter) is outputting time.Time values in the exact format\
    \ that we want.\n\nIf you can't remember, the humanDate() function looks like\
    \ this:\n\n```\nFile: cmd/web/templates.go\n\npackage main\n\n...\n\nfunc humanDate(t\
    \ time.Time) string {\n\treturn t.Format(\"02 Jan 2006 at 15:04\")\n}\n\n...\n\
    ```\n\nThe reason that I want to start by testing this is because it’s a simple\
    \ function. We can explore the basic syntax and patterns for writing tests without\
    \ getting too caught-up in the functionality that we’re testing.\n\n# ## Creating\
    \ a unit test\n\nLet's jump straight in and create a unit test for this function.\n\
    \nIn Go, it’s standard practice to write your tests in *_test.go files which live\
    \ directly alongside the code that you’re testing. So, in this case, the first\
    \ thing that we’re going to do is create a new cmd/web/templates_test.go file\
    \ to hold the test:\n\n```\n$ touch cmd/web/templates_test.go\n```\n\nAnd then\
    \ we can create a new unit test for the humanDate function like so:"
  merge: -1
  img_proc: true
- pgno: 345
  md: "```\nFile: cmd/web/templates_test.go\npackage main\nimport (\n\t\"testing\"\
    \n\t\"time\"\n)\nfunc TestHumanDate(t *testing.T) {\n\t// Initialize a new time.Time\
    \ object and pass it to the humanDate function.\n\ttm := time.Date(2024, 3, 17,\
    \ 10, 15, 0, 0, time.UTC)\n\thd := humanDate(tm)\n\n\t// Check that the output\
    \ from the humanDate function is in the format we\n\t// expect. If it isn't what\
    \ we expect, use the t.Errorf() function to\n\t// indicate that the test has failed\
    \ and log the expected and actual\n\t// values.\n\tif hd != \"17 Mar 2024 at 10:15\"\
    \ {\n\t\tt.Errorf(\"got %q; want %q\", hd, \"17 Mar 2024 at 10:15\")\n\t}\n}\n\
    ```\n\nThis pattern is the basic one that you’ll use for nearly all tests that\
    \ you write in Go. The important things to take away are:\n\n+   - The test is\
    \ just regular Go code, which calls the humanDate() function and checks that the\
    \ result matches what we expect.\n+   - Your unit tests are contained in a normal\
    \ Go function with the signature func(*testing.T).\n+   - To be a valid unit test,\
    \ the name of this function must begin with the word Test. Typically this is then\
    \ followed by the name of the function, method or type that you’re testing to\
    \ help make it obvious at a glance what is being tested.\n+   - You can use the\
    \ t.Errorf() function to mark a test as failed and log a descriptive message about\
    \ the failure. It’s important to note that calling t.Errorf() doesn’t stop execution\
    \ of your test — after you call it Go will continue executing any remaining test\
    \ code as normal.\n\nLet’s try this out. Save the file, then use the go test command\
    \ to run all the tests in our cmd/web package like so:\n\n```\n$ go test ./cmd/web\n\
    ok snippetbox.alexedwards.net/cmd/web 0.005s\n```\n\nSo, this is good stuff. The\
    \ ok in this output indicates that all tests in the package (for now, only our\
    \ TestHumanDate() test) passed without any problems."
