- pgno: 152
  md: "# Additional information\n\n# Combining functions\n\nIt's possible to combine\
    \ multiple functions in your template tags, using the parentheses () to surround\
    \ the functions and their arguments as necessary.\n\nFor example, the following\
    \ tag will render the content C1 if the length of Foo is greater than 99:\n\n\
    ```\n{{if (gt (len .Foo) 99)}} C1 {{end}}\n```\n\nOr as another example, the following\
    \ tag will render the content C1 if .Foo equals 1 *and* .Bar is less than or equal\
    \ to 20:\n\n```\n{{if (and (eq .Foo 1) (le .Bar 20))}} C1 {{end}}\n```\n\n# Controlling\
    \ loop behavior\n\nWithin a {{range}} action you can use the {{break}} command\
    \ to end the loop early, and {{continue}} to immediately start the next loop iteration.\n\
    \n```\n{{range .Foo}}\n// Skip this iteration if the .ID value equals 99.\n{{if\
    \ eq .ID 99}}\n    {{continue}}\n{{end}}\n// ...\n{{end}}\n```\n\n```\n{{range\
    \ .Foo}}\n// End the loop if the .ID value equals 99.\n{{if eq .ID 99}}\n    {{break}}\n\
    {{end}}\n// ...\n{{end}}\n```"
  merge: -1
  img_proc: true
