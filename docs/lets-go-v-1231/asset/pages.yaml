- pgno: 323
  md: "While that might sound even safer (and it is!) the downside is that the session\
    \ cookie won’t be sent when a user clicks on a link to your application from another\
    \ website. In turn, that means that your application would initially treat the\
    \ user as ‘not logged in’ even if they have an active session containing their\
    \ \"authenticatedUserID\" value.\n\nSo if your application will potentially have\
    \ other websites linking to it (or links to it shared in emails or private messaging\
    \ services), then SameSite=Lax is generally the more appropriate setting.\n\n\
    # SameSite cookies and TLS 1.3\n\nEarlier in this chapter I said that we can’t\
    \ solely rely on the SameSite cookie attribute to prevent CSRF attacks, because\
    \ it isn’t fully supported by all browsers.\n\nBut there is an exception to this\
    \ rule, due to the fact that no browser exists which supports TLS 1.3 and does\
    \ not support SameSite cookies.\n\nIn other words, if you were to make TLS 1.3\
    \ the minimum supported version in the TLS config for your server, then all browsers\
    \ able to use your application will support SameSite cookies.\n\n```\ntlsConfig\
    \ := &tls.Config{\n\tMinVersion: tls.VersionTLS13,\n}\n```\n\nSo long as you only\
    \ allow HTTPS requests to your application and enforce TLS 1.3 as the minimum\
    \ TLS version, you don’t need to make any additional mitigation against CSRF attacks\
    \ (like using the justinas/nosurf package). Just make sure that you always:\n\n\
    +   - Set SameSite=Lax or SameSite=Strict on the session cookie; and\n+   - Use\
    \ the POST, PUT or DELETE HTTP methods for any state-changing requests."
  merge: -1
  img_proc: true
- pgno: 324
  md: "# Using request context\n\nAt the moment our logic for authenticating a user\
    \ consists of simply checking whether a \"authenticatedUserID\" value exists in\
    \ their session data, like so:\n\n```\nfunc (app *application) isAuthenticated(r\
    \ *http.Request) bool {\n\treturn app.sessionManager.Exists(r.Context(), \"authenticatedUserID\"\
    )\n}\n```\n\nWe could make this check more robust by querying our users database\
    \ table to make sure that the \"authenticatedUserID\" value is a real, valid,\
    \ value (i.e we haven't deleted the user's account since they last logged in).\n\
    \nBut there is a slight problem with doing this additional database check.\n\n\
    Our isAuthenticated() helper can potentially be called multiple times in each\
    \ request cycle. Currently we use it twice — once in the requireAuthentication()\
    \ middleware and again in the newTemplateData() helper. So, if we query the database\
    \ from the isAuthenticated() helper directly, we would end up making duplicated\
    \ round-trips to the database during every request. And that's not very efficient.\n\
    \nA better approach would be to carry out this check in some middleware to determine\
    \ whether the current request is from an authenticated user or not, and then pass\
    \ that information down to all subsequent handlers in the chain.\n\nSo how do\
    \ we do this? Enter request context.\n\nIn this section you'll learn:\n\n+   -\
    \ What request context is, how to use it, and when it is appropriate to use it.\n\
    +   - How to use request context in practice to pass information about the current\
    \ user between your handlers."
  merge: -1
  img_proc: true
- pgno: 325
  md: '# How request context works


    Every http.Request that our middleware and handlers process has a context.Context
    object embedded in it, which we can use to store information during the lifetime
    of the request.


    As I''ve already hinted at, in a web application a common use-case for this is
    to pass information between your pieces of middleware and other handlers.


    In our case, we want to use it to check if a user is authenticated once in some
    middleware, and if they are, then make this information available to all our other
    middleware and handlers.


    Let''s start with some theory and explain the syntax for working with request
    context. Then, in the next chapter, we''ll get a bit more concrete again and demonstrate
    how to practically use it in our application.


    # The request context syntax


    The basic code for adding information to a request’s context looks like this:


    ```

    // Where r is a *http.Request...

    ctx := r.Context()

    ctx = context.WithValue(ctx, "isAuthenticated", true)

    r = r.WithContext(ctx)

    ```


    Let''s step through this line-by-line.


    +   - First, we use the `r.Context()` method to retrieve the *existing* context
    from a request and assign it to the `ctx` variable.

    +   - Then we use the `context.WithValue()` method to create a *new copy* of the
    existing context, containing the key "isAuthenticated" and a value of `true`.

    +   - Then finally we use the `r.WithContext()` method to create a *copy* of the
    request containing our new context.'
  merge: -1
  img_proc: true
- pgno: 326
  md: "> **Important:** Notice that we don't actually update the context for a request\
    \ directly.\n> What we're doing is *creating a new copy* of the http.Request object\
    \ with our new context in it.\n\nI should also point out that, for clarity, I\
    \ made that code snippet a bit more verbose than it needs to be. It's more typical\
    \ to write it like this:\n\n```\n```go\nctx = context.WithValue(r.Context(), \"\
    isAuthenticated\", true)\nr = r.WithContext(ctx)\n```\n```\n\nSo that's how you\
    \ add data to a request's context. But what about retrieving it again?\n\nThe\
    \ important thing to explain is that, behind the scenes, request context values\
    \ are stored with the type any. And that means that, after retrieving them from\
    \ the context, you'll need to assert them to their original type before you use\
    \ them.\n\nTo retrieve a value we need to use the r.Context().Value() method,\
    \ like so:\n\n```\n```go\nisAuthenticated, ok := r.Context().Value(\"isAuthenticated\"\
    ).(bool)\nif !ok {\n\treturn errors.New(\"could not convert value to bool\")\n\
    }\n```\n```\n\n# # Avoiding key collisions\n\nIn the code samples above, I've\
    \ used the string \"isAuthenticated\" as the key for storing and retrieving the\
    \ data from a request's context. But this isn't recommended because there's a\
    \ risk that other third-party packages used by your application will also want\
    \ to store data using the key \"isAuthenticated\" — and that would cause a naming\
    \ collision.\n\nTo avoid this, it's good practice to create your own custom type\
    \ which you can use for your context keys. Extending our sample code, it's much\
    \ better to do something like this:"
  merge: -1
  img_proc: true
- pgno: 327
  md: "```\n// Declare a custom \"contextKey\" type for your context keys.\ntype contextKey\
    \ string\n\n// Create a constant with the type contextKey that we can use.\nconst\
    \ isAuthenticatedContextKey = contextKey(\"isAuthenticated\")\n\n...\n\n// Set\
    \ the value in the request context, using our isAuthenticatedContextKey\n// constant\
    \ as the key.\nctx := r.Context()\nctx = context.WithValue(ctx, isAuthenticatedContextKey,\
    \ true)\nr = r.WithContext(ctx)\n\n...\n\n// Retrieve the value from the request\
    \ context using our constant as the key.\nisAuthenticated, ok := r.Context().Value(isAuthenticatedContextKey).(bool)\n\
    if !ok {\n\treturn errors.New(\"could not convert value to bool\")\n}\n```"
  merge: -1
  img_proc: true
- pgno: 328
  md: "# Request context for authentication/authorization\n\nSo, with those explanations\
    \ out of the way, let's start to use the request context functionality in our\
    \ application.\n\nWe'll begin by heading back to our `internal/models/users.go`\
    \ file and fleshing out the `UserModel.Exists()` method, so that it returns `true`\
    \ if a user with a specific ID exists in our `users` table, and `false` otherwise.\
    \ Like so:\n\n```\nFile: internal/models/users.go\n\npackage models\n\n...\n\n\
    func (m *UserModel) Exists(id int) (bool, error) {\n    var exists bool\n\n  \
    \  stmt := \"SELECT EXISTS(SELECT true FROM users WHERE id = ?)\"\n\n    err :=\
    \ m.DB.QueryRow(stmt, id).Scan(&exists)\n    return exists, err\n}\n\n```\n\n\
    Then let’s create a new `cmd/web/context.go` file. In this file we’ll define a\
    \ custom `contextKey` type and an `isAuthenticatedContextKey` variable, so that\
    \ we have a unique key we can use to store and retrieve the authentication status\
    \ from a request context (without the risk of naming collisions).\n\n```\n$ touch\
    \ cmd/web/context.go\n```\n\n```\nFile: cmd/web/context.go\n\npackage main\n\n\
    type contextKey string\n\nconst isAuthenticatedContextKey = contextKey(\"isAuthenticated\"\
    )\n```\n\nAnd now for the exciting part. Let’s create a new `authenticate()` middleware\
    \ method which:"
  merge: -1
  img_proc: true
- pgno: 329
  md: "+   1. Retrieves the user's ID from their session data.\n\n+   2. Checks the\
    \ database to see if the ID corresponds to a valid user using the UserModel.Exists()\
    \ method.\n\n+   3. Updates the request context to include an isAuthenticatedContextKey\
    \ key with the value true.\n\nHere's the code:\n\n```\nFile: cmd/web/middleware.go\n\
    \npackage main\n\nimport (\n\t\"context\" // New import\n\t\"fmt\"\n\t\"net/http\"\
    \n\n\t\"github.com/justinas/nosurf\"\n)\n\n...\n\nfunc (app *application) authenticate(next\
    \ http.Handler) http.Handler {\n\treturn http.HandlerFunc(func(w http.ResponseWriter,\
    \ r *http.Request) {\n\t\t// Retrieve the authenticatedUserID value from the session\
    \ using the\n\t\t// GetInt() method. This will return the zero value for an int\
    \ (0) if no\n\t\t// \"authenticatedUserID\" value is in the session -- in which\
    \ case we\n\t\t// call the next handler in the chain as normal and return.\n\t\
    \tid := app.sessionManager.GetInt(r.Context(), \"authenticatedUserID\")\n\t\t\
    if id == 0 {\n\t\t\tnext.ServeHTTP(w, r)\n\t\t\treturn\n\t\t}\n\n\t\t// Otherwise,\
    \ we check to see if a user with that ID exists in our\n\t\t// database.\n\t\t\
    exists, err := app.users.Exists(id)\n\t\tif err != nil {\n\t\t\tapp.serverError(w,\
    \ r, err)\n\t\t\treturn\n\t\t}\n\n\t\t// If a matching user is found, we know\
    \ that the request is\n\t\t// coming from an authenticated user who exists in\
    \ our database. We\n\t\t// create a new copy of the request (with an isAuthenticatedContextKey\n\
    \t\t// value of true in the request context) and assign it to r.\n\t\tif exists\
    \ {\n\t\t\tctx := context.WithValue(r.Context(), isAuthenticatedContextKey, true)\n\
    \t\t\tr = r.WithContext(ctx)\n\t\t}\n\n\t\t// Call the next handler in the chain.\n\
    \t\tnext.ServeHTTP(w, r)\n\t})\n}\n\n```"
  merge: -1
  img_proc: true
- pgno: 330
  md: "The important thing to emphasize here is the following difference:\n\n+   -\
    \ When we *don't* have a valid authenticated user, we pass the original and unchanged\
    \ *http.Request* to the next handler in the chain.\n+   - When we *do* have a\
    \ valid authenticated user, we create a copy of the request with a *isAuthenticatedContextKey*\
    \ key and *true* value stored in the request context. We then pass this copy of\
    \ *http.Request* to the next handler in the chain.\n\nAlright, let's update the\
    \ *cmd/web/routes.go* file to include the *authenticate()* middleware in our *dynamic*\
    \ middleware chain:\n\n```\nFile: cmd/web/routes.go\n\n```go\npackage main\n\n\
    ...\n\nfunc (app *application) routes() http.Handler {\n    mux := http.NewServeMux()\n\
    \n    fileServer := http.FileServer(http.Dir(\"./ui/static/\"))\n    mux.Handle(\"\
    GET /static/\", http.StripPrefix(\"/static\", fileServer))\n\n    // Add the authenticate()\
    \ middleware to the chain.\n    dynamic := alice.New(app.sessionManager.LoadAndSave,\
    \ noSurf, app.authenticate)\n\n    mux.Handle(\"GET /{$}\", dynamic.ThenFunc(app.home))\n\
    \    mux.Handle(\"GET /snippet/view/{id}\", dynamic.ThenFunc(app.snippetView))\n\
    \    mux.Handle(\"GET /user/signup\", dynamic.ThenFunc(app.userSignup))\n    mux.Handle(\"\
    POST /user/signup\", dynamic.ThenFunc(app.userSignupPost))\n    mux.Handle(\"\
    GET /user/login\", dynamic.ThenFunc(app.userLogin))\n    mux.Handle(\"POST /user/login\"\
    , dynamic.ThenFunc(app.userLoginPost))\n\n    protected := dynamic.Append(app.requireAuthentication)\n\
    \n    mux.Handle(\"GET /snippet/create\", protected.ThenFunc(app.snippetCreate))\n\
    \    mux.Handle(\"POST /snippet/create\", protected.ThenFunc(app.snippetCreatePost))\n\
    \    mux.Handle(\"POST /user/logout\", protected.ThenFunc(app.userLogoutPost))\n\
    \n    standard := alice.New(app.recoverPanic, app.logRequest, commonHeaders)\n\
    \n    return standard.Then(mux)\n}\n```\n```\n\nThe last thing that we need to\
    \ do is update our *isAuthenticated()* helper, so that instead of checking the\
    \ session data it now checks the request context to determine if a user is authenticated\
    \ or not.\n\nWe can do this like so:"
  merge: -1
  img_proc: true
- pgno: 331
  md: "```\nFile: cmd/web/helpers.go\n\npackage main\n\n...\n\nfunc (app *application)\
    \ isAuthenticated(r *http.Request) bool {\n\tisAuthenticated, ok := r.Context().Value(isAuthenticatedContextKey).(bool)\n\
    \tif !ok {\n\t\treturn false\n\t}\n\n\treturn isAuthenticated\n}\n```\n\nIt's\
    \ important to point out here that if there isn't a value in the request context\
    \ with the isAuthenticatedContextKey key, or the underlying value isn't a bool,\
    \ then this type assertion will fail. In that case we take a 'safe' fall back\
    \ and return false (i.e we assume that the user isn't authenticated).\n\nIf you\
    \ like, try running the application again. It should compile correctly and if\
    \ you log in as a certain user and browse around the application should work exactly\
    \ as before.\n\nThen, if you want, open MySQL and delete the record for the user\
    \ that you're logged in as from the database. For example:\n\n```\nmysql> USE\
    \ snippetbox;\nmysql> DELETE FROM users WHERE email = 'bob@example.com';\n```\n\
    \nAnd when you go back to your browser and refresh the page, the application is\
    \ now smart enough to recognize that the user has been deleted, and you'll find\
    \ yourself treated as an unauthenticated (logged-out) user.\n\n# Additional information\n\
    \n# Misusing request context\n\nIt's important to emphasize that request context\
    \ should only be used to store information relevant to the lifetime of a specific\
    \ request. The Go documentation for context.Context warns:\n\n> Use context Values\
    \ only for request-scoped data that transits processes and APIs."
