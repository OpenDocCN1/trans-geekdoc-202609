- pgno: 186
  md: "# Panic recovery\n\nIn a simple Go application, when your code panics it will\
    \ result in the application being terminated straight away.\n\nBut our web application\
    \ is a bit more sophisticated. Go’s HTTP server assumes that the effect of any\
    \ panic is isolated to the goroutine serving the active HTTP request (remember,\
    \ every request is handled in it’s own goroutine).\n\nSpecifically, following\
    \ a panic our server will log a stack trace to the server error log (which we\
    \ will talk about later in the book), unwind the stack for the affected goroutine\
    \ (calling any deferred functions along the way) and close the underlying HTTP\
    \ connection. But it won’t terminate the application, so importantly, any panic\
    \ in your handlers won’t bring down your server.\n\nBut if a panic does happen\
    \ in one of our handlers, what will the user see?\n\nLet’s take a look and introduce\
    \ a deliberate panic into our home handler.\n\n```\nFile: cmd/web/handlers.go\n\
    \npackage main\n\n...\n\nfunc (app *application) home(w http.ResponseWriter, r\
    \ *http.Request) {\n    panic(\"oops! something went wrong\") // Deliberate panic\n\
    \n    snippets, err := app.snippets.Latest()\n    if err != nil {\n        app.serverError(w,\
    \ r, err)\n        return\n    }\n\n    data := app.newTemplateData(r)\n    data.Snippets\
    \ = snippets\n\n    app.render(w, r, http.StatusOK, \"home.tmpl\", data)\n}\n\n\
    ...\n```\n\nRestart your application...\n\n```\n$ go run ./cmd/web\ntime=2024-03-18T11:29:23.000+00:00\
    \ level=INFO msg=\"starting server\" addr=:4000\n```"
  merge: -1
  img_proc: true
- pgno: 187
  md: "... and make a HTTP request for the home page from a second terminal window:\n\
    \n```\n$ curl -i http://localhost:4000\ncurl: (52) Empty reply from server\n```\n\
    \nUnfortunately, all we get is an empty response due to Go closing the underlying\
    \ HTTP connection following the panic.\n\nThis isn't a great experience for the\
    \ user. It would be more appropriate and meaningful to send them a proper HTTP\
    \ response with a 500 Internal Server Error status instead.\n\nA neat way of doing\
    \ this is to create some middleware which recovers the panic and calls our `app.serverError()`\
    \ helper method. To do this, we can leverage the fact that deferred functions\
    \ are always called when the stack is being unwound following a panic.\n\nOpen\
    \ up your *middleware.go* file and add the following code:\n\n```\nFile: cmd/web/middleware.go\n\
    \npackage main\n\nimport (\n\t\"fmt\" // New import\n\t\"net/http\"\n)\n\n...\n\
    \nfunc (app *application) recoverPanic(next http.Handler) http.Handler {\n\treturn\
    \ http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\t\t// Create\
    \ a deferred function (which will always be run in the event\n\t\t// of a panic\
    \ as Go unwinds the stack).\n\t\tdefer func() {\n\t\t\t// Use the builtin recover\
    \ function to check if there has been a\n\t\t\t// panic or not. If there has...\n\
    \t\t\tif err := recover(); err != nil {\n\t\t\t\t// Set a \"Connection: close\"\
    \ header on the response.\n\t\t\t\tw.Header().Set(\"Connection\", \"close\")\n\
    \t\t\t\t// Call the app.serverError helper method to return a 500\n\t\t\t\t//\
    \ Internal Server response.\n\t\t\t\tapp.serverError(w, r, fmt.Errorf(\"%s\",\
    \ err))\n\t\t\t}\n\t\t}()\n\n\t\tnext.ServeHTTP(w, r)\n\t})\n}\n```\n\nThere are\
    \ two details about this which are worth explaining:\n\n+   * Setting the `Connection:\
    \ Close` header on the response acts as a trigger to make Go's HTTP server automatically\
    \ close the current connection after a response has been sent."
  merge: -1
  img_proc: true
- pgno: 188
  md: "It also informs the user that the connection *will be closed*. Note: If the\
    \ protocol being used is HTTP/2, Go will automatically strip the `Connection:\
    \ Close` header from the response (so it is not malformed) and send a `GOAWAY`\
    \ frame.\n\n+   • The value returned by the builtin `recover()` function has the\
    \ type `any`, and its underlying type could be `string`, `error`, or something\
    \ else — whatever the parameter passed to `panic()` was. In our case, it's the\
    \ string \"oops! something went wrong\". In the code above, we normalize this\
    \ into an `error` by using the `fmt.Errorf()` function to create a new `error`\
    \ object containing the default textual representation of the `any` value, and\
    \ then pass this `error` to the `app.serverError()` helper method.\n\nLet's now\
    \ put this to use in the `routes.go` file, so that it is the *first thing* in\
    \ our chain to be executed (so that it covers panics in all subsequent middleware\
    \ and handlers).\n\n```\nFile: cmd/web/routes.go\n\npackage main\n\nimport \"\
    net/http\"\n\nfunc (app *application) routes() http.Handler {\n    mux := http.NewServeMux()\n\
    \n    fileServer := http.FileServer(http.Dir(\"./ui/static/\"))\n    mux.Handle(\"\
    GET /static/\", http.StripPrefix(\"/static\", fileServer))\n\n    mux.HandleFunc(\"\
    GET /{$}\", app.home)\n    mux.HandleFunc(\"GET /snippet/view/{id}\", app.snippetView)\n\
    \    mux.HandleFunc(\"GET /snippet/create\", app.snippetCreate)\n    mux.HandleFunc(\"\
    POST /snippet/create\", app.snippetCreatePost)\n\n    // Wrap the existing chain\
    \ with the recoverPanic middleware.\n    return app.recoverPanic(app.logRequest(commonHeaders(mux)))\n\
    }\n```\n\nIf you restart the application and make a request for the homepage now,\
    \ you should see a nicely formed 500 Internal Server Error response following\
    \ the panic, including the `Connection: close` header that we talked about.\n\n\
    ```\n$ go run ./cmd/web\ntime=2024-03-18T11:29:23.0000+00:00 level=INFO msg=\"\
    starting server\" addr=:4000\n```"
  merge: -1
  img_proc: true
