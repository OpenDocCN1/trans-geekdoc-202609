- pgno: 205
  md: "```\n// Initialize a map to hold any validation errors for the form fields.\n\
    fieldErrors := make(map[string]string)\n\n// Check that the title value is not\
    \ blank and is not more than 100\n// characters long. If it fails either of those\
    \ checks, add a message to the\n// errors map using the field name as the key.\n\
    if strings.TrimSpace(title) == \"\" {\n    fieldErrors[\"title\"] = \"This field\
    \ cannot be blank\"\n} else if utf8.RuneCountInString(title) > 100 {\n    fieldErrors[\"\
    title\"] = \"This field cannot be more than 100 characters long\"\n}\n\n// Check\
    \ that the Content value isn't blank.\nif strings.TrimSpace(content) == \"\" {\n\
    \    fieldErrors[\"content\"] = \"This field cannot be blank\"\n}\n\n// Check\
    \ the expires value matches one of the permitted values (1, 7 or\n// 365).\nif\
    \ expires != 1 && expires != 7 && expires != 365 {\n    fieldErrors[\"expires\"\
    ] = \"This field must equal 1, 7 or 365\"\n}\n\n// If there are any errors, dump\
    \ them in a plain text HTTP response and\n// return from the handler.\nif len(fieldErrors)\
    \ > 0 {\n    fmt.Fprint(w, fieldErrors)\n    return\n}\n\nid, err := app.snippets.Insert(title,\
    \ content, expires)\nif err != nil {\n    app.serverError(w, r, err)\n    return\n\
    }\n\nhttp.Redirect(w, r, fmt.Sprintf(\"/snippet/view/%d\", id), http.StatusSeeOther)\n\
    }\n```\n\n**Note:** When we check the length of the `title` field, we’re using\
    \ the `utf8.RuneCountInString()` function — not Go’s `len()` function. This will\
    \ count the number of *Unicode code points* in the title rather than the number\
    \ of bytes. To illustrate the difference, the string \"Zoë\" contains 3 Unicode\
    \ code points, but 4 bytes because of the umlauted ë character.\n\nAlright, let’s\
