  md: "# # Creating a users model\n\nNow that the routes are set up, we need to create\
    \ a new users database table and a database model to access it.\n\nStart by connecting\
    \ to MySQL from your terminal window as the root user and execute the following\
    \ SQL statement to setup the users table:\n\n```\nUSE snippetbox;\n\nCREATE TABLE\
    \ users (\n id INTEGER NOT NULL PRIMARY KEY AUTO_INCREMENT,\n name VARCHAR(255)\
    \ NOT NULL,\n email VARCHAR(255) NOT NULL,\n hashed_password CHAR(60) NOT NULL,\n\
    \ created DATETIME NOT NULL\n);\n\nALTER TABLE users ADD CONSTRAINT users_uc_email\
    \ UNIQUE (email):\n```\n\nThere's a couple of things worth pointing out about\
    \ this table:\n\n+   - The **id** field is an autoincrementing integer field and\
    \ the primary key for the table. This means that the user ID values are guaranteed\
    \ to be unique positive integers (1, 2, 3... etc).\n\n+   - The type of the **hashed_password**\
    \ field is CHAR(60). This is because we'll be storing bcrypt hashes of the user\
    \ passwords in the database — not the passwords themselves — and the hashes are\
    \ always exactly 60 characters long.\n\n+   - We've also added a **UNIQUE** constraint\
    \ on the **email** column and named it users_uc_email. This constraint ensures\
    \ that we won't end up with two users who have the same email address. If we try\
    \ to insert a record in this table with a duplicate email, MySQL will throw an\
    \ ERROR 1062: ER_DUP_ENTRY error.\n\n# ## Building the model in Go\n\nNext let's\
    \ setup a model so that we can easily work with the new users table. We'll follow\
    \ the same pattern that we used earlier in the book for modeling access to the\
    \ snippets table, so hopefully this should feel familiar and straightforward."
