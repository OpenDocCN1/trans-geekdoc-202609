- pgno: 139
  md: "Any data that you pass as the final parameter to ts.ExecuteTemplate() is represented\
    \ within your HTML templates by the . character (referred to as dot).\n\nIn this\
    \ specific case, the underlying type of dot will be a models.Snippet struct. When\
    \ the underlying type of dot is a struct, you can render (or yield) the value\
    \ of any exported field in your templates by postfixing dot with the field name.\
    \ So, because our models.Snippet struct has a Title field, we could yield the\
    \ snippet title by writing {{.Title}} in our templates.\n\nI'll demonstrate. Create\
    \ a new file at ui/html/pages/view.tmpl and add the following markup:\n\n```\n\
    $ touch ui/html/pages/view.tmpl\n```\n\n```\nFile: ui/html/pages/view.tmpl\n\n\
    {{define \"title\"}}Snippet #{{.ID}}{{end}}\n\n{{define \"main\"}}\n<div class='snippet'>\n\
    \    <div class='metadata'>\n        <strong>{{.Title}}</strong>\n        <span>#{{.ID}}</span>\n\
    \    </div>\n    <pre><code>{{.Content}}</code></pre>\n    <div class='metadata'>\n\
    \        <time>Created: {{.Created}}</time>\n        <time>Expires: {{.Expires}}</time>\n\
    \    </div>\n</div>\n{{end}}\n```\n\nIf you restart the application and visit\
    \ http://localhost:4000/snippet/view/1 in your browser, you should find that the\
    \ relevant snippet is fetched from the database, passed to the template, and the\
    \ content is rendered correctly."
