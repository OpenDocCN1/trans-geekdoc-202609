  md: 'form data to the destination now only requires us to write a few lines of code
    — irrespective of how large the form is.


    Importantly, type conversions are handled automatically too. We can see that in
    the code above, where the expires value is automatically mapped to an int data
    type.


    So that''s really good. But there is one problem.


    When we call app.formDecoder.Decode() it requires a non-nil pointer as the target
    decode destination. If we try to pass in something that isn''t a non-nil pointer,
    then Decode() will return a form.InvalidDecoderError error.


    If this ever happens, it''s a critical problem with our application code (rather
    than a client error due to bad input). So we need to check for this error specifically
    and manage it as a special case, rather than just returning a 400 Bad Request
    response.


    # Creating a decodePostForm helper


    To assist with this, let''s create a new decodePostForm() helper which does three
    things:


    +   - Calls r.ParseForm() on the current request.

    +   - Calls app.formDecoder.Decode() to unpack the HTML form data to a target
    destination.

    +   - Checks for a form.InvalidDecoderError error and triggers a panic if we ever
    see it.


    If you''re following along, please go ahead and add this to your cmd/web/helpers.go
    file like so:'
