- pgno: 11
  md: '# # Project setup and creating a module


    Before we write any code, you’ll need to create a `snippetbox` directory on your
    computer to act as the top-level ‘home’ for this project. All the Go code we write
    throughout the book will live in here, along with other project-specific assets
    like HTML templates and CSS files.


    So, if you’re following along, open your terminal and create a new project directory
    called `snippetbox` anywhere on your computer. I’m going to locate my project
    directory under `$HOME/code`, but you can choose a different location if you wish.


    ```

    $ mkdir -p $HOME/code/snippetbox

    ```


    # ## Creating a module


    The next thing you need to do is decide on a module path for your project.


    If you’re not already familiar with Go modules, you can think of a module path
    as basically being a canonical name or identifier for your project.


    You can pick **almost any string** as your module path, but the important thing
    to focus on is *uniqueness*. To avoid potential import conflicts with other people’s
    projects or the standard library in the future, you want to pick a module path
    that is globally unique and unlikely to be used by anything else. In the Go community,
    a common convention is to base your module paths on a URL that you own.


    In my case, a clear, succinct and *unlikely-to-be-used-by-anything-else* module
    path for this project would be `snippetbox.alexedwards.net`, and I’ll use this
    throughout the rest of the book. If possible, you should swap this for something
    that’s unique to you instead.


    Once you’ve decided on a unique module path, the next thing you need to do is
    turn your project directory into a module.


    Make sure that you’re in the root of your project directory and then run the `go
    mod init` command — passing in your chosen module path as a parameter like so:


    ```

    $ cd $HOME/code/snippetbox

    $ go mod init snippetbox.alexedwards.net

    go: creating new go.mod: module snippetbox.alexedwards.net

    ```'
  merge: -1
  img_proc: true
