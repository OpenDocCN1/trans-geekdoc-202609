  md: '# Redirect user appropriately after login


    If an unauthenticated user tries to visit GET /account/view they will be redirected
    to the login page. Then after logging in successfully, they will be redirected
    to the GET /snippet/create form. This is awkward and confusing for the user, as
    they end up on a different page to where they originally wanted to go.


    Your goal in this exercise is to update the application so that users are redirected
    to the page they were originally trying to visit after logging in.


