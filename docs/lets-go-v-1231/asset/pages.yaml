- pgno: 306
  md: "# # User authorization\n\nBeing able to authenticate the users of our application\
    \ is all well and good, but now we need to do something useful with that information.\
    \ In this chapter we'll introduce some authorization checks so that:\n\n+   1.\
    \ Only authenticated (i.e. logged in) users can create a new snippet; and\n+ \
    \  2. The contents of the navigation bar changes depending on whether a user is\
    \ authenticated (logged in) or not. Specifically:\n+   \n+   • Authenticated users\
    \ should see links to ‘Home’, ‘Create snippet’ and ‘Logout’.\n+   • Unauthenticated\
    \ users should see links to ‘Home’, ‘Signup’ and ‘Login’.\n\nAs I mentioned briefly\
    \ in the previous chapter, we can check whether a request is being made by an\
    \ authenticated user or not by checking for the existence of an \"authenticatedUserID\"\
    \ value in their session data.\n\nSo let's start with that. Open the cmd/web/helpers.go\
    \ file and add an isAuthenticated() helper function to return the authentication\
    \ status like so:\n\n```\nFile: cmd/web/helpers.go\n\npackage main\n\n...\n\n\
    // Return true if the current request is from an authenticated user, otherwise\n\
    // return false.\nfunc (app *application) isAuthenticated(r *http.Request) bool\
    \ {\n\\treturn app.sessionManager.Exists(r.Context(), \"authenticatedUserID\"\
    )\n}\n```\n\nThat's neat. We can now check whether or not the request is coming\
    \ from an authenticated (logged in) user by simply calling this isAuthenticated()\
    \ helper.\n\nThe next step is to find a way to pass this information to our HTML\
    \ templates, so that we can toggle the contents of the navigation bar appropriately.\n\
    \nThere are two parts to this. First, we'll need to add a new IsAuthenticated\
    \ field to our templateData struct:"
  merge: -1
  img_proc: true
- pgno: 307
  md: "```\nFile: cmd/web/templates.go\n\npackage main\n\nimport (\n\t\"html/template\"\
    \n\t\"path/filepath\"\n\t\"time\"\n\n\t\"snippetbox.alexedwards.net/internal/models\"\
    \n)\n\ntype templateData struct {\n\tCurrentYear int\n\tSnippet\tmodels.Snippet\n\
    \tSnippets\t[]models.Snippet\n\tForm\t\tany\n\tFlash\t\tstring\n\tIsAuthenticated\t\
    bool // Add an IsAuthenticated field to the templateData struct.\n}\n\n...\n```\n\
    \nAnd the second step is to update our `newTemplateData()` helper so that this\
    \ information is automatically added to the `templateData` struct every time we\
    \ render a template. Like so:\n\n```\nFile: cmd/web/helpers.go\n\npackage main\n\
    \n...\n\nfunc (app *application) newTemplateData(r *http.Request) templateData\
    \ {\n\treturn templateData{\n\t\tCurrentYear: time.Now().Year(),\n\t\tFlash: app.sessionManager.PopString(r.Context(),\
    \ \"flash\"),\n\t\t// Add the authentication status to the template data.\n\t\t\
    IsAuthenticated: app.isAuthenticated(r),\n\t}\n}\n\n...\n```\n\nOnce that's done,\
    \ we can update the `ui/html/partials/nav.tmpl` file to toggle the navigation\
    \ links using the `{{if .IsAuthenticated}}` action like so:"
  merge: -1
