  md: '# Serving static files


    Now let''s improve the look and feel of the home page by adding some static CSS
    and image files to our project, along with a tiny bit of JavaScript to highlight
    the active navigation item.


    If you''re following along, you can grab the necessary files and extract them
    into the ui/static folder that we made earlier with the following commands:


    ```

    $ cd $HOME/code/snippetbox

    $ curl https://www.alexedwards.net/static/sb-v2.tar.gz | tar -xvz -C ./ui/static/

    ```


    The contents of your ui/static directory should now look like this:


    ![](img/c3e650db0d8dfdecc0f8e34a67719f65_58_0.png)


    # The http.Fileserver handler


    Go''s net/http package ships with a built-in http.FileServer handler which you
    can use to serve files over HTTP from a specific directory. Let''s add a new route
    to our application so that all GET requests which begin with "/static/" are handled
    using this, like so:'
  merge: -1
  img_proc: true
- pgno: 59
  md: '| Route pattern | Handler | Action |

    | :--- | :--- | :--- |

    | GET / | home | Display the home page |

    | GET /snippet/view/{id} | snippetView | Display a specific snippet |

    | GET /snippet/create | snippetCreate | Display a form for creating a new snippet
    |

    | POST /snippet/create | snippetCreatePost | Save a new snippet |

    | GET /static/ | http.FileServer | Serve a specific static file |


    > **Remember:** The pattern "GET /static/" is a subtree path pattern, so it acts
    a bit like there is a wildcard at the end.


    To create a new http.FileServer handler, we need to use the http.FileServer()
    function like this:


    ```

    fileServer := http.FileServer(http.Dir("./ui/static/"))

    ```


    When this handler receives a request for a file, it will remove the leading slash
    from the request URL path and then search the ./ui/static directory for the corresponding
    file to send to the user.


    So, for this to work correctly, we must strip the leading "/static" from the URL
    path before passing it to http.FileServer. Otherwise it will be looking for a
    file which doesn''t exist and the user will receive a 404 page not found response.
    Fortunately Go includes a http.StripPrefix() helper specifically for this task.


    Open your main.go file and add the following code, so that the file ends up looking
    like this:'
  merge: -1
  img_proc: true
- pgno: 60
  md: "```\nFile: cmd/web/main.go\n\npackage main\n\nimport (\n\t\"log\"\n\t\"net/http\"\
    \n)\n\nfunc main() {\n\tmux := http.NewServeMux()\n\n\t// Create a file server\
    \ which serves files out of the \"./ui/static\" directory.\n\t// Note that the\
    \ path given to the http.Dir function is relative to the project\n\t// directory\
    \ root.\n\tfileServer := http.FileServer(http.Dir(\"./ui/static\"))\n\n\t// Use\
    \ the mux.Handle() function to register the file server as the handler for\n\t\
    // all URL paths that start with \"/static/\". For matching paths, we strip the\n\
    \t// \"/static\" prefix before the request reaches the file server.\n\tmux.Handle(\"\
    GET /static/\", http.StripPrefix(\"/static\", fileServer))\n\n\t// Register the\
    \ other application routes as normal..\n\tmux.HandleFunc(\"GET /{$}\", home)\n\
    \tmux.HandleFunc(\"GET /snippet/view/{id}\", snippetView)\n\tmux.HandleFunc(\"\
    GET /snippet/create\", snippetCreate)\n\tmux.HandleFunc(\"POST /snippet/create\"\
    , snippetCreatePost)\n\n\tlog.Print(\"starting server on :4000\")\n\n\terr :=\
    \ http.ListenAndServe(\":4000\", mux)\n\tlog.Fatal(err)\n}\n```\n\nOnce that's\
    \ complete, restart the application and open http://localhost:4000/static/ in\
    \ your browser. You should see a navigable directory listing of the ui/static\
    \ folder which looks like this:"
  merge: -1
  img_proc: true
- pgno: 61
  md: '![](img/c3e650db0d8dfdecc0f8e34a67719f65_61_0.png)


    Feel free to have a play around and browse through the directory listing to view
    individual files. For example, if you navigate to [http://localhost:4000/static/css/main.css](http://localhost:4000/static/css/main.css)
    you should see the CSS file appear in your browser like so:


