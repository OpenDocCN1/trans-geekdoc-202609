- pgno: 37
  md: "# Customizing responses\n\nBy default, every response that your handlers send\
    \ has the HTTP status code 200 OK (which indicates to the user that their request\
    \ was received and processed successfully), plus three automatic system-generated\
    \ headers: a Date header, and the Content-Length and Content-Type of the response\
    \ body. For example:\n\n```\n$ curl -i localhost:4000/\nHTTP/1.1 200 OK\nDate:\
    \ Wed, 18 Mar 2024 11:29:23 GMT\nContent-Length: 21\nContent-Type: text/plain;\
    \ charset=utf-8\n\nHello from Snippetbox\n```\n\nIn this chapter we’ll dive in\
    \ to how to customize the response headers your handlers send, and also look at\
    \ a couple of other ways that you can send plain text responses to users.\n\n\
    # HTTP status codes\n\nFirst of all, let's update our snippetCreatePost handler\
    \ so that it sends a 201 Created status code rather than 200 OK. To do this, you\
    \ can use the w.WriteHeader() method in your handlers like so:\n\n```\nFile: main.go\n\
    \npackage main\n\n...\n\nfunc snippetCreatePost(w http.ResponseWriter, r *http.Request)\
    \ {\n    // Use the w.WriteHeader() method to send a 201 status code.\n    w.WriteHeader(201)\n\
    \n    // Then w.Write() method to write the response body as normal.\n    w.Write([]byte(\"\
    Save a new snippet...\"))\n}\n\n...\n```\n\n(Yes, this is a bit silly because\
    \ the handler isn’t actually creating anything yet! But it nicely illustrates\
    \ the pattern to set a custom status code.)"
  merge: -1
  img_proc: true
- pgno: 38
  md: "Although this change looks straightforward, there are a couple of nuances I\
    \ should explain:\n\n+   * It's only possible to call w.WriteHeader() once per\
    \ response, and after the status code\n+   has been written it can't be changed.\
    \ If you try to call w.WriteHeader() a second time Go\n+   will log a warning\
    \ message.\n+   * If you don't call w.WriteHeader() explicitly, then the first\
    \ call to w.Write() will\n+   automatically send a 200 status code to the user.\
    \ So, if you want to send a non-200\n+   status code, you must call w.WriteHeader()\
    \ before any call to w.Write().\n\nRestart the server, then use curl to make a\
    \ POST request to\nhttp://localhost:4000/snippet/create again. You should see\
    \ that the HTTP response\nnow has a 201 Created status code similar to this:\n\
    \n```\n$ curl -i -d \"\" http://localhost:4000/snippet/create\nHTTP/1.1 201 Created\n\
    Date: Wed, 18 Mar 2024 11:29:23 GMT\nContent-Length: 21\nContent-Type: text/plain;\
    \ charset=utf-8\n\nSave a new snippet...\n```\n\n# Status code constants\n\nThe\
    \ net/http package provides constants for HTTP status codes, which we can use\
    \ instead\nof writing the status code number ourselves. Using these constants\
    \ is good practice\nbecause it helps prevent mistakes due to typos, and it can\
    \ also help make your code clearer\nand self-documenting — especially when dealing\
    \ with less-commonly-used status codes.\n\nLet's update our snippetCreatePost\
    \ handler to use the constant http.StatusCreated\ninstead of the integer 201,\
