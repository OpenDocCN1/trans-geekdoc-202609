  md: '# The http.Server struct


    So far in this book we''ve been using the http.ListenAndServe() shortcut function
    to start our server.


    Although http.ListenAndServe() is very useful in short examples and tutorials,
    in real-world applications it''s more common to manually create and use a http.Server
    struct instead. Doing this opens up the opportunity to customize the behavior
    of your server, which is exactly that we''ll be doing in this section of the book.


    So in preparation for that, let''s quickly update our main.go file to stop using
    the http.ListenAndServe() shortcut, and manually create and use a http.Server
    struct instead.'
