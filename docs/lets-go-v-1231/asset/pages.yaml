- pgno: 14
  md: "# Web application basics\n\nNow that everything is set up correctly, let’s\
    \ make the first iteration of our web application. We’ll begin with the three\
    \ absolute essentials:\n\n+   - The first thing we need is a handler. If you’ve\
    \ previously built web applications using a MVC pattern, you can think of handlers\
    \ as being a bit like controllers. They’re responsible for executing your application\
    \ logic and for writing HTTP response headers and bodies.\n+   \n+   - The second\
    \ component is a router (or servemux in Go terminology). This stores a mapping\
    \ between the URL routing patterns for your application and the corresponding\
    \ handlers. Usually you have one servemux for your application containing all\
    \ your routes.\n+   \n+   - The last thing we need is a web server. One of the\
    \ great things about Go is that you can establish a web server and listen for\
    \ incoming requests as part of your application itself. You don’t need an external\
    \ third-party server like Nginx, Apache or Caddy.\n\nLet’s put these components\
    \ together in the `main.go` file to make a working application."
  merge: -1
  img_proc: true
- pgno: 15
  md: "```\nFile: main.go\n\npackage main\n\nimport (\n\t\"log\"\n\t\"net/http\"\n\
    )\n\n// Define a home handler function which writes a byte slice containing\n\
    // \"Hello from Snippetbox\" as the response body.\nfunc home(w http.ResponseWriter,\
    \ r *http.Request) {\n\tw.Write([]byte(\"Hello from Snippetbox\"))\n}\n\nfunc\
    \ main() {\n\t// Use the http.NewServeMux() function to initialize a new servemux,\
    \ then\n\t// register the home function as the handler for the \"/\" URL pattern.\n\
    \tmux := http.NewServeMux()\n\tmux.HandleFunc(\"/\", home)\n\n\t// Print a log\
    \ message to say that the server is starting.\n\tlog.Print(\"starting server on\
    \ :4000\")\n\n\t// Use the http.ListenAndServe() function to start a new web server.\
    \ We pass in\n\t// two parameters: the TCP network address to listen on (in this\
    \ case \":4000\")\n\t// and the servemux we just created. If http.ListenAndServe()\
    \ returns an error\n\t// we use the log.Fatal() function to log the error message\
    \ and exit. Note\n\t// that any error returned by http.ListenAndServe() is always\
    \ non-nil.\n\terr := http.ListenAndServe(\":4000\", mux)\n\tlog.Fatal(err)\n}\n\
    ```\n\n> Note: The `home` handler function is just a regular Go function with\
    \ two parameters. The `http.ResponseWriter` parameter provides methods for assembling\
    \ a HTTP response and sending it to the user, and the `*http.Request` parameter\
    \ is a pointer to a struct which holds information about the current request (like\
    \ the HTTP method and the URL being requested). We'll talk more about these parameters\
    \ and demonstrate how to use them as we progress through the book.\n\nWhen you\
    \ run this code, it will start a web server listening on port 4000 of your local\
    \ machine. Each time the server receives a new HTTP request it will pass the request\
    \ on to the servemux and — in turn — the servemux will check the URL path and\
    \ dispatch the request to the matching handler.\n\nLet's give this a whirl. Save\
    \ your `main.go` file and then try running it from your terminal using the `go\
    \ run` command.\n\n```\n$ cd $HOME/code/snippetbox\n$ go run .\n2024/03/18 11:29:23\
    \ starting server on :4000\n```"
  merge: -1
  img_proc: true
