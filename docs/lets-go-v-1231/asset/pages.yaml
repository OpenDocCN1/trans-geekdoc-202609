- pgno: 293
  md: '# Additional information


    # Using database bcrypt implementations


    Some databases provide built-in functions that you can use for password hashing
    and verification instead of implementing your own in Go, like we have in the code
    above.


    But it''s probably a good idea to avoid using these for two reasons:


    +   - They tend to be vulnerable to side-channel timing attacks due to string
    comparison time not being constant, at least in PostgreSQL and MySQL.


    +   - Unless you''re very careful, sending a plain-text password to your database
    risks the password being accidentally recorded in one of your database logs. A
    couple of high-profile examples of passwords being accidentally recorded in logs
    were the GitHub and Twitter incidents in 2018.


    # Alternatives for checking email duplicates'
