- pgno: 20
  md: 'Display a form for creating a new snippet...


    # Trailing slashes in route patterns


    Now that the two new routes are up and running, let''s talk a bit of theory.


    It''s important to know that Go''s servemux has different matching rules depending
    on whether a route pattern ends with a trailing slash or not.


    Our two new route patterns — "/snippet/view" and "/snippet/create" — don''t end
    in a trailing slash. When a pattern doesn''t have a trailing slash, it will only
    be matched (and the corresponding handler called) when the request URL path exactly
    matches the pattern in full.


    When a route pattern ends with a trailing slash — like "/" or "/static/" — it
    is known as a *subtree path pattern*. Subtree path patterns are matched (and the
    corresponding handler called) whenever the *start* of a request URL path matches
    the subtree path. If it helps your understanding, you can think of subtree paths
    as acting a bit like they have a wildcard at the end, like "/*" or "/static/**".


    This helps explain why the "/" route pattern acts like a catch-all. The pattern
    essentially means *match a single slash, followed by anything (or nothing at all)*.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# # Restricting subtree paths


    To prevent subtree path patterns from acting like they have a wildcard at the
    end, you can append the special character sequence {$} to the end of the pattern
    — like "/{$}" or "/static/{$}".


    So if you have the route pattern "/{$}", it effectively means *match a single
    slash, followed by nothing else.* It will only match requests where the URL path
    is exactly /.


    Let''s use this in our application to stop our home handler acting as a catch
    all, like so:


    ```

    File: main.go


    package main


    ...


    func main() {

    \tmux := http.NewServeMux()

    \tmux.HandleFunc("/{$}", home) // Restrict this route to exact matches on / only.

    \tmux.HandleFunc("/snippet/view", snippetView)

    \tmux.HandleFunc("/snippet/create", snippetCreate)


    \tlog.Print("starting server on :4000")


    \terr := http.ListenAndServe(":4000", mux)

    \tlog.Fatal(err)

    }

    ```


    > **Note:** It’s only permitted to use {$} at the end of subtree path patterns
    (i.e. patterns that end with a trailing slash). Route patterns that don’t have
    a trailing slash require a match on the entire request path anyway, so it doesn’t
    make sense to include {$} at the end and trying to do so will result in a runtime
    panic.


    Once you’ve made that change, restart the server and make a request for an unregistered
    URL path like http://localhost:4000/foo/bar . You should now get a 404 response
    which looks a bit like this:'
  merge: -1
