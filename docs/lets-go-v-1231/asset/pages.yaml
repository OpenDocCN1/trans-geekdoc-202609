    \ handler is validating the data, the next stage is to manage these validation\
    \ errors gracefully.\n\nIf there are any validation errors, we want to re-display\
    \ the HTML form, highlighting the fields which failed validation and automatically\
    \ re-populating any previously submitted data (so that the user doesn’t need to\
    \ enter it again).\n\nTo do this, let’s begin by adding a new Form field to our\
    \ templateData struct:\n\n```\nFile: cmd/web/templates.go\n\npackage main\n\n\
    import (\n\t\"html/template\"\n\t\"path/filepath\"\n\t\"time\"\n\n\t\"snippetbox.alexedwards.net/internal/models\"\
    \n)\n\n// Add a Form field with the type \"any\".\ntype templateData struct {\n\
    \tCurrentYear int\n\tSnippet     models.Snippet\n\tSnippets    []models.Snippet\n\
    \tForm        any\n}\n\n...\n```\n\nWe’ll use this Form field to pass the validation\
    \ errors and previously submitted data back to the template when we re-display\
    \ the form.\n\nNext let’s head back to our cmd/web/handlers.go file and define\
    \ a new snippetCreateForm struct to hold the form data and any validation errors,\
    \ and update our snippetCreatePost handler to use this.\n\nLike so:\n\n```\nFile:\
    \ cmd/web/handlers.go\n```"
  merge: -1
  img_proc: true
- pgno: 209
  md: "```\n```go\npackage main\n\n...\n\n// Define a snippetCreateForm struct to\
