  md: '![](img/c3e650db0d8dfdecc0f8e34a67719f65_282_0.png)


    # # Validating the user input


    When this form is submitted the data will end up being posted to the `userSignupPost`
    handler that we made earlier.


    The first task of this handler will be to validate the data to make sure that
    it is sane and sensible before we insert it into the database. Specifically, we
    want to do four things:


    +   1. Check that the provided name, email address and password are not blank.

    +   2. Sanity check the format of the email address.

    +   3. Ensure that the password is at least 8 characters long.

    +   4. Make sure that the email address isn''t already in use.


    We can cover the first three checks by heading back to our `internal/validator/validator.go`
    file and creating two helper new methods — `MinChars()` and `Matches()` — along
    with a regular expression for sanity checking an email address.


    Like this:'
  merge: -1
  img_proc: true
- pgno: 283
  md: "```\nFile: internal/validator/validator.go\n\npackage validator\n\nimport (\n\
    \t\"regexp\" // New import\n\t\"slices\"\n\t\"strings\"\n\t\"unicode/utf8\"\n\
    )\n\n// Use the regexp.MustCompile() function to parse a regular expression pattern\n\
    // for sanity checking the format of an email address. This returns a pointer\
    \ to\n// a 'compiled' regexp.Regexp type, or panics in the event of an error.\
    \ Parsing\n// this pattern once at startup and storing the compiled *regexp.Regexp\
    \ in a\n// variable is more performant than re-parsing the pattern each time we\
    \ need it.\nvar EmailRX = regexp.MustCompile(\"^[a-zA-Z0-9.!#%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\\\
    [a-zA-Z0-9](?:\\[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$\"\n\n...\n\n// MinChars() returns\
    \ true if a value contains at least n characters.\nfunc MinChars(value string,\
    \ n int) bool {\n\treturn utf8.RuneCountInString(value) >= n\n}\n\n// Matches()\
    \ returns true if a value matches a provided compiled regular\n// expression pattern.\n\
    func Matches(value string, rx *regexp.Regexp) bool {\n\treturn rx.MatchString(value)\n\
    }\n```\n\nThere are a couple of things about the EmailRX regular expression pattern\
    \ I want to quickly mention:\n\n+   • The pattern we're using is the one currently\
    \ recommended by the W3C and Web Hypertext Application Technology Working Group\
    \ for validating email addresses. For more information about this pattern, see\
    \ here. If you're reading this book in PDF format or on a narrow device, and can't\
    \ see the entire line, then here it is broken up into multiple lines:\n\n```\n\
    \"^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\\\
    .[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*\n(?:\\[a-zA-Z0-9](?:\\[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*\"\
