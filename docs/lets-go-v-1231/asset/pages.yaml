- pgno: 215
  md: '| Route pattern | Handler | Action |

    |---|---|---|

    | GET /snippets | snippetIndex | Display the home page |

    | GET /snippets/{id} | snippetView | Display a specific snippet |

    | GET /snippets/create | snippetCreate | Display a form for creating a new snippet
    |

    | POST /snippets | snippetCreatePost | Save a new snippet |


    There are a couple of reasons.


    The first reason is because of overlapping routes — a HTTP request to /snippets/create
    potentially matches both the GET /snippets/{id} and GET /snippets/create routes.
    In our application, the snippet ID values are always numeric so there will never
    be a ‘real’ overlap between these two routes — but imagine if our snippet ID values
    were user-generated, or a random 6-character string, and hopefully you can see
    the potential for a problem. Generally speaking, overlapping routes can be a source
    of bugs and unexpected behavior in your application, and it’s good practice to
    avoid them if you can — or use them with care and caution if you can’t.


    The second reason is that the HTML form presented on /snippets/create would need
    to post to /snippets when submitted. This means that when we re-render the HTML
    form to show any validation errors, the URL in the user’s browser will also change
    to /snippets. YMMV on whether you consider this a problem or not — most users
    don’t look at URLs, but I think it’s a bit clunky and confusing in terms of UX...
    especially if a GET request to /snippets normally renders something else (like
    a list of all snippets).'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Creating validation helpers


    OK, so we''re now in the position where our application is validating the form
    data according to our business rules and gracefully handling any validation errors.
    That''s great, but it''s taken quite a bit of work to get there.


    And while the approach we''ve taken is fine as a one-off, if your application
    has _many forms_ then you can end up with quite a lot of repetition in your code
    and validation rules. Not to mention, writing code for validating forms isn''t
    exactly the most exciting way to spend your time.


    So to help us with validation throughout the rest of this project, we''ll create
    our own small internal/validator package to abstract some of this behavior and
    reduce the boilerplate code in our handlers. We won''t actually change how the
    application works for the user at all; it''s really just a refactoring of our
    codebase.


    # Adding a validator package


    If you''re coding-along, please go ahead and create the following directory and
    file on your machine:


    ```

    $ mkdir internal/validator

    $ touch internal/validator/validator.go

    ```


    Then in this new internal/validator/validator.go file add the following code:'
  merge: -1
