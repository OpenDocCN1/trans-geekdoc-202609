  md: '# Setting up MySQL


    If you’re following along, you’ll need to install MySQL on your computer at this
    point. The official MySQL documentation contains comprehensive installation instructions
    for all types of operating systems, but if you’re using Mac OS you should be able
    to install it with:


    ```

    ```bash

    $ brew install mysql

    ```

    ```


    Or if you’re using a Linux distribution which supports apt (like Debian and Ubuntu)
    you can install it with:


    ```

    ```bash

    $ sudo apt install mysql-server

    ```

    ```


    While you are installing MySQL you might be asked to set a password for the root
    user. Remember to keep a mental note of this if you are; you’ll need it in the
    next step.


    # Scaffolding the database


    Once MySQL is installed you should be able to connect to it from your terminal
    as the root user. The command to do this will vary depending on the version of
    MySQL that you’ve got installed. For MySQL 5.7 and newer you should be able to
    connect by typing this:


    ```

    ```bash

    $ sudo mysql

    mysql>

    ```

    ```


    But if that doesn’t work then try the following command instead, entering the
    password that you set during the installation.


    ```

    ```bash

    $ mysql -u root -p

    Enter password:

    mysql>

    ```

    ```


    Once connected, the first thing we need to do is establish a database in MySQL
    to store all the data for our project. Copy and paste the following commands into
    the mysql prompt to create a new snippetsbox database using UTF8 encoding.'
  merge: -1
  img_proc: true
