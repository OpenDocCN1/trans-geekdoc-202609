  md: '# Composable middleware chains


    In this chapter I''d like to introduce the justinas/alice package to help us manage
    our middleware/handler chains.


    You don''t need to use this package, but the reason I recommend it is because
    it makes it easy to create composable, reusable, middleware chains — and that
    can be a real help as your application grows and your routes become more complex.
    The package itself is also small and lightweight, and the code is clear and well
    written.


    To demonstrate its features in one example, it allows you to rewrite a handler
    chain from this:


    ```

    return myMiddleware1(myMiddleware2(myMiddleware3(myHandler)))


    ```


    Into this, which is a bit clearer to understand at a glance:


    ```

    return alice.New(myMiddleware1, myMiddleware2, myMiddleware3).Then(myHandler)


    ```


    But the real power lies in the fact that you can use it to create middleware chains
    that can be assigned to variables, appended to, and reused. For example:


    ```

    myChain := alice.New(myMiddlewareOne, myMiddlewareTwo)

    myOtherChain := myChain.Append(myMiddleware3)

    return myOtherChain.Then(myHandler)


    ```


    If you''re following along, please install the justinas/alice package using go
    get:


    ```

    $ go get github.com/justinas/alice@v1

    go: downloading github.com/justinas/alice v1.2.0


    ```


    And if you open the go.mod file for your project, you should see a new corresponding
    require statement, like so:'
  merge: -1
  img_proc: true
