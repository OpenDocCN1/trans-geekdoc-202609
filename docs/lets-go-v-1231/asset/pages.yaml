  md: "# # Creating a database connection pool\n\nNow that the MySQL database is all\
    \ set up and we've got a driver installed, the natural next step is to connect\
    \ to the database from our web application.\n\nTo do this we need Go's sql.Open()\
    \ function, which you use a bit like this:\n\n```\n// The sql.Open() function\
    \ initializes a new sql.DB object, which is essentially a\n// pool of database\
    \ connections.\ndb, err := sql.Open(\"mysql\", \"web:pass@/snippetbox?parseTime=true\"\
    )\nif err != nil {\n    ...\n}\n```\n\nThere are a few things about this code\
    \ to explain and emphasize:\n\n+   - The first parameter to sql.Open() is the\
    \ driver name and the second parameter is the data source name (sometimes also\
    \ called a connection string or DSN) which describes how to connect to your database.\n\
    +   - The format of the data source name will depend on which database and driver\
    \ you're using. Typically, you can find information and examples in the documentation\
    \ for your specific driver. For the driver we're using you can find that documentation\
    \ here.\n+   - The parseTime=true part of the DSN above is a driver-specific parameter\
    \ which instructs our driver to convert SQL TIME and DATE fields to Go time.Time\
    \ objects.\n+   - The sql.Open() function returns a sql.DB object. This isn't\
    \ a database connection — it's a pool of many connections. This is an important\
    \ difference to understand. Go manages the connections in this pool as needed,\
    \ automatically opening and closing connections to the database via the driver.\n\
    +   - The connection pool is safe for concurrent access, so you can use it from\
    \ web application handlers safely.\n+   - The connection pool is intended to be\
    \ long-lived. In a web application it's normal to initialize the connection pool\
    \ in your main() function and then pass the pool to your handlers. You shouldn't\
    \ call sql.Open() in a short-lived HTTP handler itself — it would be a waste of\
    \ memory and network resources."
  merge: -1
  img_proc: true
