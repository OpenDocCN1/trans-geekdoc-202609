  md: "# Embedding HTML templates\n\nNext let's update our application so that the\
    \ template cache uses embedded HTML template files, instead reading them from\
    \ your hard disk at runtime.\n\nHead back to the ui/efs.go file, and update it\
    \ so that ui.Files embeds the contents of the ui/html directory (which contains\
    \ our templates) too. Like so:\n\n```\nFile: ui/efs.go\n\npackage ui\n\nimport\
    \ (\n    \"embed\"\n)\n\n//go:embed \"html\" \"static\"\nvar Files embed.FS\n\
    ```\n\nThen we need to update the newTemplateCache() function in cmd/web/templates.go\
    \ so that it reads the templates from ui.Files. To do this, we’ll need to leverage\
    \ a couple of the special features that Go has for working with embedded filesystems:\n\
    \n+   * The fs.Glob() function returns a slice of filepaths matching a glob pattern.\
    \ It’s effectively the same as the filepath.Glob() function that we used earlier\
    \ in the book, except that it works on embedded filesystems.\n+   * The Template.ParseFS()\
    \ method can be used to parse the HTML templates from an embedded filesystem into\
    \ a template set. This is effectively a replacement for both the Template.ParseFiles()\
    \ and Template.ParseGlob() methods that we used earlier. Template.ParseFiles()\
    \ is also a variadic function, which allows you to parse multiple templates in\
    \ a single call to ParseFiles().\n\nLet’s put these to use in our cmd/web/templates.go\
    \ file:"
  merge: -1
  img_proc: true
- pgno: 341
  md: "```\nFile: cmd/web/templates.go\n\npackage main\n\nimport (\n\t\"html/template\"\
    \n\t\"io/fs\" // New import\n\t\"path/filepath\"\n\t\"time\"\n\n\t\"snippetbox.alexedwards.net/internal/models\"\
    \n\t\"snippetbox.alexedwards.net/ui\" // New import\n)\n\n...\n\nfunc newTemplateCache()\
    \ (map[string]*template.Template, error) {\n\tcache := map[string]*template.Template{}\n\
    \n\t// Use fs.Glob() to get a slice of all filepaths in the ui.Files embedded\n\
    \t// filesystem which match the pattern 'html/pages/*.tmpl'. This essentially\n\
    \t// gives us a slice of all the 'page' templates for the application, just\n\t\
    // like before.\n\tpages, err := fs.Glob(ui.Files, \"html/pages/*.tmpl\")\n\t\
    if err != nil {\n\t\treturn nil, err\n\t}\n\n\tfor _, page := range pages {\n\t\
    \tname := filepath.Base(page)\n\n\t\t// Create a slice containing the filepath\
    \ patterns for the templates we\n\t\t// want to parse.\n\t\tpatterns := []string{\n\
    \t\t\t\"html/base.tmpl\",\n\t\t\t\"html/partials/*.tmpl\",\n\t\t\tpage,\n\t\t\
    }\n\n\t\t// Use ParseFS() instead of ParseFiles() to parse the template files\n\
    \t\t// from the ui.Files embedded filesystem.\n\t\tts, err := template.New(name).Funcs(functions).ParseFS(ui.Files,\
    \ patterns...)\n\t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n\n\t\tcache[name]\
    \ = ts\n\t}\n\n\treturn cache, nil\n}\n```\n\nNow that this is done, when our\
    \ application is built into a binary it will contain all the UI files that it\
    \ needs to run.\n\nYou can try this out quickly by building an executable binary\
    \ in your /tmp directory, copying over the TLS certificates, and running the binary.\
    \ Like so:"
