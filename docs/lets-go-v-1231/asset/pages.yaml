  md: '![](img/c3e650db0d8dfdecc0f8e34a67719f65_399_0.png)


    The statements which get executed during your tests are colored green, and those
    that are not executed are colored red. This makes it easy to see exactly what
    code is currently covered by your tests (unless you have red-green color blindness).


    You can take this a step further and use the `-covermode=count` option when running
    `go test` like so:


    ```

    $ go test -covermode=count -coverprofile=/tmp/profile.out ./...

    $ go tool cover -html=/tmp/profile.out

    ```


    Instead of just highlighting the statements in green and red, using `-covermode=count`
    makes the coverage profile record the exact *number of times* that each statement
    is executed during the tests.


    When viewed in the browser, statements which are executed more frequently are
    then shown in a more saturated shade of green, similar to this:'
