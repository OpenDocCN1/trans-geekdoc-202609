    \n)\n\nfunc (app *application) routes() http.Handler {\n\tmux := http.NewServeMux()\n\
    \n\t// Use the http.FileServerFS() function to create a HTTP handler which\n\t\
    // serves the embedded files in ui.Files. It's important to note that our\n\t\
    // static files are contained in the \"static\" folder of the ui.Files\n\t// embedded\
    \ filesystem. So, for example, our CSS stylesheet is located at\n\t// \"static/css/main.css\"\
    . This means that we no longer need to strip the\n\t// prefix from the request\
    \ URL -- any requests that start with /static/ can\n\t// just be passed directly\
    \ to the file server and the corresponding static\n\t// file will be served (so\
    \ long as it exists).\n\tmux.Handle(\"GET /static/\", http.FileServerFS(ui.Files))\n\
    \n\tdynamic := alice.New(app.sessionManager.LoadAndSave, noSurf, app.authenticate)\n\
