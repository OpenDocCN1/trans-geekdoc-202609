- pgno: 100
  md: "# # Modules and reproducible builds\n\nNow that the MySQL driver is installed,\
    \ let’s take a look at the `go.mod` file (which we created right at the start\
    \ of the book). You should see a `require` block with two lines containing the\
    \ path and exact version number of the packages that you downloaded:\n\n```\n\
    File: go.mod\n\nmodule snippetbox.alexedwards.net\n\ngo 1.23.0\n\nrequire (\n\
    \    filippo.io/edwards25519 v1.1.0 // indirect\n    github.com/go-sql-driver/mysql\
    \ v1.8.1 // indirect\n)\n```\n\nThese lines in `go.mod` essentially tell the Go\
    \ command exactly which version of a package should be used when you run a command\
    \ like `go run`, `go test` or `go build` from your project directory.\n\nThis\
    \ makes it easy to have multiple projects on the same machine where *different\
    \ versions of the same package* are used. For example, this project is using v1.8.1\
    \ of the MySQL driver, but you could have another codebase on your computer which\
    \ uses v1.5.0 and that would be A-OK.\n\n> **Note:** The `// indirect` annotation\
    \ indicates that a package doesn’t directly appear in any `import` statement in\
    \ your codebase. Right now, we still haven’t written any code that actually uses\
    \ either the `github.com/go-sql-driver/mysql` or `filippo.io/edwards25519` packages,\
    \ which is why they are both marked as indirect dependencies. We’ll fix that in\
    \ the next chapter.\n\nYou’ll also see that a new file has been created in the\
    \ root of your project directory called `go.sum`."
  merge: -1
  img_proc: true
