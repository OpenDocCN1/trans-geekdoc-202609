- pgno: 172
  md: '![](img/c3e650db0d8dfdecc0f8e34a67719f65_172_0.png)


    # Additional information


    # Pipelining


    In the code above, we called our custom template function like this:


    ```

    <time>Created: {{humanDate .Created}}</time>

    ```


    An alternative approach is to use the | character to pipeline values to a function.
    This works a bit like pipelining outputs from one command to another in Unix terminals.
    We could re-write the above as:


    ```

    <time>Created: {{.Created | humanDate}}</time>

    ```


    A nice feature of pipelining is that you can make an arbitrarily long chain of
    template functions which use the output from one as the input for the next. For
    example, we could pipeline the output from our humanDate function to the builtin
    printf function like so:'
  merge: -1
  img_proc: true
- pgno: 173
  md: '```

    <time>{{.Created | humanDate | printf "Created: %s"}}</time>

    ```'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Middleware


    When you''re building a web application there''s probably some shared functionality
    that you want to use for many (or even all) HTTP requests. For example, you might
    want to log every request, compress every response, or check a cache before passing
    the request to your handlers.


    A common way of organizing this shared functionality is to set it up as middleware.
    This is essentially some self-contained code which independently acts on a request
    before or after your normal application handlers.


    In this section of the book you''ll learn:


    +   - An idiomatic pattern for building and using custom middleware which is compatible
    with net/http and many third-party packages.

    +   - How to create middleware which sets common HTTP headers on every HTTP response.

    +   - How to create middleware which logs the requests received by your application.

    +   - How to create middleware which recovers panics so that they are gracefully
    handled by your application.

    +   - How to create and use composable middleware chains to help manage and organize
    your middleware.'
  merge: -1
  img_proc: true
- pgno: 175
  md: "# # How middleware works\n\nEarlier in the book I said something that I'd like\
    \ to expand on in this chapter:\n\n> > “You can think of a Go web application\
    \ as a chain of ServeHTTP() methods being called one after another.”\n\nCurrently,\
    \ in our application, when our server receives a new HTTP request it calls the\
    \ servemux’s ServeHTTP() method. This looks up the relevant handler based on the\
    \ request method and URL path, and in turn calls that handler’s ServeHTTP() method.\n\
    \nThe basic idea of middleware is to insert another handler into this chain. The\
    \ middleware handler executes some logic, like logging a request, and then calls\
    \ the ServeHTTP() method of the next handler in the chain.\n\nIn fact, we’re actually\
    \ already using some middleware in our application — the http.StripPrefix() function\
    \ from serving static files, which removes a specific prefix from the request’s\
    \ URL path before passing the request on to the file server.\n\n# ## The pattern\n\
    \nThe standard pattern for creating your own middleware looks like this:\n\n```\n\
    ```go\nfunc myMiddleware(next http.Handler) http.Handler {\n    fn := func(w http.ResponseWriter,\
    \ r *http.Request) {\n        // TODO: Execute our middleware logic here...\n\
    \        next.ServeHTTP(w, r)\n    }\n    return http.HandlerFunc(fn)\n}\n```\n\
    ```\n\nThe code itself is pretty succinct, but there’s quite a lot in it to get\
    \ your head around.\n\n+   • The myMiddleware() function is essentially a wrapper\
    \ around the next handler, which we pass to it as a parameter.\n\n+   • It establishes\
    \ a function fn which closes over the next handler to form a closure. When fn\
    \ is run it executes our middleware logic and then transfers control to the next\
    \ handler by calling it’s ServeHTTP() method."
  merge: -1
  img_proc: true
- pgno: 176
  md: "+   • Regardless of what you do with a closure it will always be able to access\
    \ the variables that are local to the scope it was created in — which in this\
    \ case means that fn will always have access to the next variable.\n\n+   • In\
    \ the final line of code, we then convert this closure to a http.Handler and return\
    \ it using the http.HandlerFunc() adapter.\n\nIf this feels confusing, you can\
    \ think of it more simply: myMiddleware() is a function that accepts the next\
    \ handler in a chain as a parameter. It returns a handler which executes some\
    \ logic and then calls the next handler.\n\n# Simplifying the middleware\n\nA\
    \ tweak to this pattern is to use an anonymous function inside myMiddleware()\
    \ middleware, like so:\n\n```\nfunc myMiddleware(next http.Handler) http.Handler\
    \ {\n\treturn http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\
    \t\t// TODO: Execute our middleware logic here...\n\t\tnext.ServeHTTP(w, r)\n\t\
    })\n}\n```\n\nThis pattern is very common in the wild, and the one that you’ll\
    \ probably see most often if you’re reading the source code of other applications\
    \ or third-party packages.\n\n# Positioning the middleware\n\nIt's important to\
    \ explain that where you position the middleware in the chain of handlers will\
    \ affect the behavior of your application.\n\nIf you position your middleware\
    \ before the servemux in the chain then it will act on every request that your\
    \ application receives.\n\n```\nmyMiddleware -> servemux -> application handler\n\
    ```\n\nA good example of where this would be useful is middleware to log requests\
    \ — as that's typically something you would want to do for all requests.\n\nAlternatively,\
    \ you can position the middleware after the servemux in the chain — by"
  merge: -1
  img_proc: true
- pgno: 177
  md: 'wrapping a specific application handler. This would cause your middleware to
    only be

    executed for a specific route.


    ```

    servemux → myMiddleware → application handler

    ```


    An example of this would be something like authorization middleware, which you
    may only

    want to run on specific routes.


    We''ll demonstrate how to do both of these things in practice as we progress through
    the

    book.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# # Setting common headers


    Let''s put the pattern we learned in the previous chapter to use, and make some
    middleware which automatically adds our Server: Go header to every response, along
    with the following HTTP security headers (inline with current OWASP guidance).


    ```

    Content-Security-Policy: default-src ''self''; style-src ''self'' fonts.googleapis.com;
    font-src fonts.gstatic.com

    Referrer-Policy: origin-when-cross-origin

    X-Content-Type-Options: nosniff

    X-Frame-Options: deny

    X-XSS-Protection: 0

    ```


    If you''re not familiar with these headers, I''ll quickly explain what they do.


    +   - Content-Security-Policy (often abbreviated to CSP) headers are used to restrict
    where the resources for your web page (e.g. JavaScript, images, fonts etc) can
    be loaded from. Setting a strict CSP policy helps prevent a variety of cross-site
    scripting, clickjacking, and other code-injection attacks.


    CSP headers and how they work is a big topic, and I recommend reading this primer
    if you haven''t come across them before. But, in our case, the header tells the
    browser that it''s OK to load fonts from fonts.gstatic.com, stylesheets from fonts.googleapis.com
    and self (our own origin), and then everything else only from self. Inline JavaScript
    is blocked by default.


    +   - Referrer-Policy is used to control what information is included in a Referer
    header when a user navigates away from your web page. In our case, we''ll set
    the value to origin-when-cross-origin, which means that the full URL will be included
    for same-origin requests, but for all other requests information like the URL
    path and any query string values will be stripped out.


    +   - X-Content-Type-Options: nosniff instructs browsers to not MIME-type sniff
    the content-type of the response, which in turn helps to prevent content-sniffing
    attacks.


    +   - X-Frame-Options: deny is used to help prevent clickjacking attacks in older
    browsers that don''t support CSP headers.


    +   - X-XSS-Protection: 0 is used to disable the blocking of cross-site scripting
    attacks. Previously it was good practice to set this header to X-XSS-Protection:
    1; mode=block, but when you''re using CSP headers like we are the recommendation
    is to disable this'
  merge: -1
  img_proc: true
- pgno: 179
  md: "feature altogether.\n\nOK, let's get back to our Go code and begin by creating\
    \ a new `middleware.go` file. We'll use this to hold all the custom middleware\
    \ that we write throughout this book.\n\n```\n$ touch cmd/web/middleware.go\n\
    ```\n\nThen open it up and add a `commonHeaders()` function using the pattern\
    \ that we introduced in the previous chapter:\n\n```\nFile: cmd/web/middleware.go\n\
    \npackage main\n\nimport (\n\t\"net/http\"\n)\n\nfunc commonHeaders(next http.Handler)\
    \ http.Handler {\n\treturn http.HandlerFunc(func(w http.ResponseWriter, r *http.Request)\
    \ {\n\t\t// Note: This is split across multiple lines for readability. You don't\n\
    \t\t// need to do this in your own code.\n\t\tw.Header().Set(\"Content-Security-Policy\"\
    ,\n\t\t\t\"default-src 'self'; style-src 'self' fonts.googleapis.com; font-src\
    \ fonts.gstatic.com\")\n\t\tw.Header().Set(\"Referrer-Policy\", \"origin-when-cross-origin\"\
    )\n\t\tw.Header().Set(\"X-Content-Type-Options\", \"nosniff\")\n\t\tw.Header().Set(\"\
    X-Frame-Options\", \"deny\")\n\t\tw.Header().Set(\"X-XSS-Protection\", \"0\")\n\
    \n\t\tw.Header().Set(\"Server\", \"Go\")\n\n\t\tnext.ServeHTTP(w, r)\n\t})\n}\n\
    ```\n\nBecause we want this middleware to act on every request that is received,\
    \ we need it to be executed *before* a request hits our servemux. We want the\
    \ flow of control through our application to look like:\n\n```\ncommonHeaders\
    \ → servemux → application handler\n```\n\nTo do this we'll need the `commonHeaders`\
    \ middleware function to *wrap our servemux*. Let's update the `routes.go` file\
    \ to do exactly that:"
