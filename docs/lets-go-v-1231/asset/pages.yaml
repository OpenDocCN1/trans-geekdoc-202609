  md: "# Additional information\n\n# Stack traces\n\nYou can use the `debug.Stack()`\
    \ function to get a *stack trace* outlining the execution path of the application\
    \ for the *current goroutine*. Including this as an attribute in your log entries\
    \ can be helpful for debugging errors.\n\nIf you want, you could update the `serverError()`\
    \ method so that it includes a stack trace in the log entries like so:\n\n```\n\
