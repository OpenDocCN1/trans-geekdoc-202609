  md: '# Additional information


    # Behind the scenes of session management


    I’d like to take a moment to unpack some of the ‘magic’ behind session management
    and explain how it works behind the scenes.


    If you like, open up the developer tools in your web browser and take a look at
    the cookie data for one of the pages. You should see a cookie named session in
    the request data, similar to this:


    ![](img/c3e650db0d8dfdecc0f8e34a67719f65_244_0.png)


    This is the session cookie, and it will be sent back to the Snippetbox application
    with every request that your browser makes.


    The session cookie contains the session token — also sometimes known as the session
    ID. The session token is a high-entropy random string, which in my case is the
    value y9y1-mXyQUoAM6V5s9LXNjbZ_vXSGk07jy-KL-di7A4 (yours will be different).


    It''s important to emphasize that the session token is just a random string. In
    itself, it doesn''t carry or convey any session data (like the flash message that
    we set in this chapter).


    Next, you might like to open up a terminal to MySQL and run a SELECT query against
    the'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'sessions table to lookup the session token that you see in your browser. Like
    so:


    ```

    mysql> SELECT * FROM sessions WHERE token = ''y9y1-mXyQoAM6V5s9lXNjbZ_vXSGk07jy-KL-di7A4'';

    +----------------------------------------------+----------------------------------------------+

    | token                                        | data                                         |

    +----------------------------------------------+----------------------------------------------+

    | y9y1-mXyQoAM6V5s9lXNjbZ_vXSGk07jy-KL-di7A4 | 0x26FFB1030102FF8200010201080446561646C696E67A4F00010656616C7565737401FF860000
    |

    +----------------------------------------------+----------------------------------------------+

    1 row in set (0.00 sec)

    ```


    This should return one record. The data value here is the thing that actually
    contains the user’s session data. Specifically, what we’re looking at is a MySQL
    BLOB (binary large object) containing a gob-encoded representation of the session
    data.


    Each and every time we make a change to our session data, this data value will
    be updated to reflect the changes.


    Lastly, the final column in the database is the expiry time, after which the session
    will no longer be considered valid.


    So, what happens in our application is that the LoadAndSave() middleware checks
    each incoming request for a session cookie. If a session cookie is present, it
    reads the session token from the cookie and retrieves the corresponding session
    data from the database (while also checking that the session hasn’t expired).
    It then adds the session data to the request context so it can be used in your
    handlers.


    Any changes that you make to the session data in your handlers are updated in
    the request context, and then the LoadAndSave() middleware updates the database
    with any changes to the session data before it returns.'
  merge: -1
  img_proc: true
