  md: '# # Single-record SQL queries


    The pattern for executing a SELECT statement to retrieve a single record from
    the database is a little more complicated. Let''s explain how to do it by updating
    our SnippetModel.Get() method so that it returns a single specific snippet based
    on its ID.


    To do this, we''ll need to run the following SQL query on the database:


    ```

    SELECT id, title, content, created, expires FROM snippets

    WHERE expires > UTC_TIMESTAMP() AND id = ?

    ```


    Because our snippets table uses the id column as its primary key, this query will
    only ever return exactly one database row (or none at all). The query also includes
    a check on the expiry time so that we don''t return any snippets that have expired.


    Notice too that we''re using a placeholder parameter again for the id value?


    Open the internal/models/snippets.go file and add the following code:'
  merge: -1
  img_proc: true
- pgno: 119
  md: "```\nFile: internal/models/snippets.go\n\npackage models\n\nimport (\n\t\"\
    database/sql\"\n\t\"errors\" // New import\n\t\"time\"\n)\n\n...\n\nfunc (m *SnippetModel)\
    \ Get(id int) (Snippet, error) {\n\t// Write the SQL statement we want to execute.\
    \ Again, I've split it over two\n\t// lines for readability.\n\tstmt := `SELECT\
    \ id, title, content, created, expires FROM snippets\n\tWHERE expires > UTC_TIMESTAMP()\
    \ AND id = ?`\n\n\t// Use the QueryRow() method on the connection pool to execute\
    \ our\n\t// SQL statement, passing in the untrusted id variable as the value for\
    \ the\n\t// placeholder parameter. This returns a pointer to a sql.Row object\
    \ which\n\t// holds the result from the database.\n\trow := m.DB.QueryRow(stmt,\
    \ id)\n\n\t// Initialize a new zeroed Snippet struct.\n\tvar s Snippet\n\n\t//\
    \ Use row.Scan() to copy the values from each field in sql.Row to the\n\t// corresponding\
    \ field in the Snippet struct. Notice that the arguments\n\t// to row.Scan are\
    \ *pointers* to the place you want to copy the data into,\n\t// and the number\
    \ of arguments must be exactly the same as the number of\n\t// columns returned\
    \ by your statement.\n\terr := row.Scan(&s.ID, &s.Title, &s.Content, &s.Created,\
    \ &s.Expires)\n\tif err == nil {\n\t\t// If the query returns no rows, then row.Scan()\
    \ will return a\n\t\t// sql.ErrNoRows error. We use the errors.Is() function check\
    \ for that\n\t\t// error specifically, and return our own ErrNoRecord error\n\t\
    \t// instead (we'll create this in a moment).\n\t\tif errors.Is(err, sql.ErrNoRows)\
    \ {\n\t\t\treturn Snippet{}, ErrNoRecord\n\t\t} else {\n\t\t\treturn Snippet{},\
    \ err\n\t\t}\n\t}\n\n\t// If everything went OK, then return the filled Snippet\
    \ struct.\n\treturn s, nil\n}\n\n...\n```\n\nBehind the scenes of rows.Scan()\
    \ your driver will automatically convert the raw output from the SQL database\
    \ to the required native Go types. So long as you're sensible with the types that\
    \ you're mapping between SQL and Go, these conversions should generally Just Work.\
    \ Usually:\n\n+   • CHAR, VARCHAR and TEXT map to string.\n+   • BOOLEAN maps\
    \ to bool."
