    # Additional information


    # SameSite ‘Strict’ setting


    If you want, you can change the session cookie to use the SameSite=Strict setting
    instead of (the default) SameSite=Lax. Like this:


    ```

    sessionManager := scs.New()

    sessionManager.Cookie.SameSite = http.SameSiteStrictMode

    ```


    But it''s important to be aware that using SameSite=Strict will block the session
    cookie being sent by the user’s browser for all cross-site usage — including safe
    requests with HTTP methods like GET and HEAD.'
