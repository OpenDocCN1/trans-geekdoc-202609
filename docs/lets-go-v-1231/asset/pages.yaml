  md: '# Executing SQL statements


    Now let''s update the SnippetModel.Insert() method — which we''ve just made —
    so that it creates a new record in our snippets table and then returns the integer
    id for the new record.


    To do this we''ll want to execute the following SQL query on our database:


    ```

    INSERT INTO snippets (title, content, created, expires)

    VALUES(?, ?, UTC_TIMESTAMP(), DATE_ADD(UTC_TIMESTAMP(), INTERVAL ? DAY))

    ```


    Notice how in this query we''re using the ? character to indicate placeholder
    parameters for the data that we want to insert in the database? Because the data
    we''ll be using will ultimately be untrusted user input from a form, it''s good
    practice to use placeholder parameters instead of interpolating data in the SQL
    query.


    # Executing the query


    Go provides three different methods for executing database queries:


    +   - DB.Query() is used for SELECT queries which return multiple rows.

    +   - DB.QueryRow() is used for SELECT queries which return a single row.

    +   - DB.Exec() is used for statements which don''t return rows (like INSERT and
    DELETE).


    So, in our case, the most appropriate tool for the job is DB.Exec(). Let''s jump
    in the deep end and demonstrate how to use this in our SnippetModel.Insert() method.
    We''ll discuss the details afterwards.


    Open your internal/models/snippets.go file and update it like so:'
  merge: -1
  img_proc: true
- pgno: 114
  md: "```\nFile: internal/models/snippets.go\n\npackage models\n\n...\n\ntype SnippetModel\
    \ struct {\n  DB *sql.DB\n}\n\nfunc (m *SnippetModel) Insert(title string, content\
    \ string, expires int) (int, error) {\n  // Write the SQL statement we want to\
    \ execute. I've split it over two lines\n  // for readability (which is why it's\
    \ surrounded with backquotes instead\n  // of normal double quotes).\n  stmt :=\
    \ `INSERT INTO snippets (title, content, created, expires)\n  VALUES(?, ?, UTC_TIMESTAMP(),\
    \ DATE_ADD(UTC_TIMESTAMP(), INTERVAL ? DAY))`\n\n  // Use the Exec() method on\
    \ the embedded connection pool to execute the\n  // statement. The first parameter\
    \ is the SQL statement, followed by the\n  // values for the placeholder parameters:\
    \ title, content and expiry in\n  // that order. This method returns a sql.Result\
    \ type, which contains some\n  // basic information about what happened when the\
    \ statement was executed.\n  result, err := m.DB.Exec(stmt, title, content, expires)\n\
    \  if err != nil {\n    return 0, err\n  }\n\n  // Use the LastInsertId() method\
    \ on the result to get the ID of our\n  // newly inserted record in the snippets\
    \ table.\n  id, err := result.LastInsertId()\n  if err != nil {\n    return 0,\
    \ err\n  }\n\n  // The ID returned has the type int64, so we convert it to an\
    \ int type\n  // before returning.\n  return int(id), nil\n}\n\n...\n```\n\nLet's\
    \ quickly discuss the `sql.Result` type returned by `DB.Exec()`. This provides\
    \ two methods:\n\n+   - LastInsertId() — which returns the integer (an `int64`)\
    \ generated by the database in response to a command. Typically this will be from\
    \ an “auto increment” column when inserting a new row, which is exactly what’s\
    \ happening in our case.\n+   - RowsAffected() — which returns the number of rows\
    \ (as an `int64`) affected by the statement."
