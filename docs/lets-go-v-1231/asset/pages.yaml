- pgno: 333
  md: '# # File embedding


    The Go standard library includes an embed package, which makes it possible to
    embed external files into your Go program itself.


    Using the embed package opens up the opportunity to create Go programs which are
    self-contained and have everything that they need to run as part of the compiled
    binary executable. In turn, that makes it easier to deploy or distribute your
    web application.


    In this section of the book, we''ll update our application so that it embeds the
    files from our ui directory — starting with the static CSS, JavaScript and image
    files, and then moving on to the HTML templates.


    Let''s jump straight in and explain how to use it.'
  merge: -1
  img_proc: true
- pgno: 334
  md: "# # Embedding static files\n\nIf you’re following along, the first thing to\
    \ do is create a new `ui/efs.go` file:\n\n```\n$ touch ui/efs.go\n```\n\nThen\
    \ add the following code:\n\n```\nFile: ui/efs.go\n\npackage ui\n\nimport (\n\t\
    \"embed\"\n)\n\n//go:embed \"static\"\nvar Files embed.FS\n```\n\nThe important\
    \ line here is `//go:embed \"static\"`.\n\nThis looks like a comment, but it is\
    \ actually a special comment directive. When our application is compiled (as part\
    \ of either `go build` or `go run`), this comment directive instructs Go to store\
    \ the files from our `ui/static` folder in an embedded filesystem referenced by\
    \ the global variable `Files`.\n\nThere are a few important details about this\
    \ which we need to explain.\n\n+   - The comment directive must be placed *immediately\
    \ above* the variable in which you want to store the embedded files.\n+   - The\
    \ directive has the format `go:embed \"<path>\"`. The path is relative to the\
    \ `.go` file containing the directive, so — in our case — `go:embed \"static\"\
    ` embeds the directory `ui/static` from our project.\n+   - You can only use the\
    \ `go:embed` directive on global variables at package level, not within functions\
    \ or methods. If you try to use it within a function or method, you'll get the\
    \ error `\"go:embed cannot apply to var inside func\"` at compile time.\n+   -\
    \ Paths cannot contain `.` or `..` elements, nor may they begin or end with a\
    \ `/`. This essentially restricts you to only embedding files or directories that\
    \ are within the same"
  merge: -1
  img_proc: true
- pgno: 335
  md: 'directory as the `.go` file containing the `go:embed` directive.


    +   • The embedded file system is *always* rooted in the directory which contains
    the `go:embed` directive. So, in the example above, our `Files` variable contains
    an `embed.FS` embedded filesystem and the root of that filesystem is our `ui`
    directory.


    # # Using the embedded static files


    Now let’s switch up our application so that it serves our static CSS, JavaScript
    and image files from the embedded file system — instead of reading them from the
    disk at runtime.


    Open your `cmd/web/routes.go` file and update it as follows:'
  merge: -1
  img_proc: true
