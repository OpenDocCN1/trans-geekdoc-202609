    # Using go run


    During development the go run command is a convenient way to try out your code.
    It''s essentially a shortcut that compiles your code, creates an executable binary
    in your /tmp directory, and then runs this binary in one step.


    It accepts either a space-separated list of .go files, the path to a specific
    package (where the . character represents your current directory), or the full
    module path. For our application at the moment, the three following commands are
    all equivalent:


    ```

    $ go run .

    $ go run main.go

    $ go run snippetbox.alexedwards.net

    ```'
