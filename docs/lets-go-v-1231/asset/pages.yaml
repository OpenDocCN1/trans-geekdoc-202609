- pgno: 168
  md: '# Custom template functions


    In the last part of this section about templating and dynamic data, I''d like
    to explain how to create your own custom functions to use in Go templates.


    To illustrate this, let''s create a custom humanDate() function which outputs
    datetimes in a nice ‘humanized’ format like 1 Jan 2024 at 10:47 or 18 Mar 2024
    at 15:04 instead of outputting dates in the default format of YYYY-MM-DD HH:MM:SS
    +0000 UTC like we are currently.


    There are two main steps to doing this:


    +   1. We need to create a template.FuncMap object containing the custom humanDate()
    function.

    +   2. We need to use the template.Funcs() method to register this before parsing
    the templates.


    Go ahead and add the following code to your templates.go file:'
  merge: -1
  img_proc: true
- pgno: 169
  md: "```\nFile: cmd/web/templates.go\n\npackage main\n\nimport (\n\t\"html/template\"\
    \n\t\"path/filepath\"\n\t\"time\" // New import\n\n\t\"snippetbox.alexedwards.net/internal/models\"\
    \n)\n\n...\n\n// Create a humanDate function which returns a nicely formatted\
    \ string\n// representation of a time.Time object.\nfunc humanDate(t time.Time)\
    \ string {\n\treturn t.Format(\"02 Jan 2006 at 15:04\")\n}\n\n// Initialize a\
    \ template.FuncMap object and store it in a global variable. This is\n// essentially\
    \ a string-keyed map which acts as a lookup between the names of our\n// custom\
    \ template functions and the functions themselves.\nvar functions = template.FuncMap{\n\
    \t\"humanDate\": humanDate,\n}\n\nfunc newTemplateCache() (map[string]*template.Template,\
    \ error) {\n\tcache := map[string]*template.Template{}\n\n\tpages, err := filepath.Glob(\"\
    ./ui/html/pages/*.tmpl\")\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\n\tfor\
    \ _, page := range pages {\n\t\tname := filepath.Base(page)\n\n\t\t// The template.FuncMap\
    \ must be registered with the template set before you\n\t\t// call the ParseFiles()\
    \ method. This means we have to use template.New() to\n\t\t// create an empty\
    \ template set, use the Funcs() method to register the\n\t\t// template.FuncMap,\
    \ and then parse the file as normal.\n\t\tts, err := template.New(name).Funcs(functions).ParseFiles(\"\
    ./ui/html/base.tmpl\")\n\t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n\n\t\
    \tts, err = ts.ParseGlob(\"./ui/html/partials/*.tmpl\")\n\t\tif err != nil {\n\
    \t\t\treturn nil, err\n\t\t}\n\n\t\tts, err = ts.ParseFiles(page)\n\t\tif err\
    \ != nil {\n\t\t\treturn nil, err\n\t\t}\n\n\t\tcache[name] = ts\n\t}\n\n\treturn\
    \ cache, nil\n}\n```"
  merge: -1
  img_proc: true
