- pgno: 25
  md: '# Wildcard route patterns


    It''s also possible to define route patterns that contain wildcard segments. You
    can use these to create more flexible routing rules, and also to pass variables
    to your Go application via a request URL. If you''ve built web applications using
    frameworks in other languages before, the concepts in this chapter will probably
    feel familiar to you.


    Let''s step away from our application build for a moment to explain how it works.


    Wildcard segments in a route pattern are denoted by an wildcard identifier inside
    {} brackets. Like this:


    ```

    mux.HandleFunc("/products/{category}/item/{itemID}", exampleHandler)

    ```


    In this example, the route pattern contains two wildcard segments. The first segment
    has the identifier category and the second has the identifier itemID.


    The matching rules for route patterns containing wildcard segments are the same
    as we saw in the previous chapter, with the additional rule that the request path
    can contain any non-empty value for the wildcard segments. So, for example, the
    following requests would all match the route we defined above:


    ```

    /products/hammocks/item/sku123456789

    /products/seasonal-plants/item/pdt-1234-wxyz

    /products/experimental_foods/item/quantum%20bananas

    ```


    Important: When defining a route pattern, each path segment (the bit between forward
    slash characters) can only contain one wildcard and the wildcard needs to fill
    the whole path segment. Patterns like "/products/c_{category}", /date/{y}-{m}-{d}
    or /{slug}.html are not valid.


    Inside your handler, you can retrieve the corresponding value for a wildcard segment
    using its identifier and the r.PathValue() method. For example:'
  merge: -1
  img_proc: true
- pgno: 26
  md: "```\nfunc exampleHandler(w http.ResponseWriter, r *http.Request) {\n\tcategory\
    \ := r.PathValue(\"category\")\n\titemID := r.PathValue(\"itemID\")\n\n\t...\n\
    }\n```\n\nThe r.PathValue() method always returns a string value, and it's important\
    \ to remember that this can be *any value* that the user includes in the URL —\
    \ so you should validate or sanity check the value before doing anything important\
    \ with it.\n\n# Using wildcard segments in practice\n\nOK, let's get back to our\
    \ application and update it to include a new {id} wildcard segment in the /snippet/view\
    \ route, so that our routes look like this:\n\n| Route pattern | Handler | Action\
    \ |\n| :--- | :--- | :--- |\n| `/{$}` | home | Display the home page |\n| `/snippet/view/{id}`\
    \ | snippetView | Display a specific snippet |\n| `/snippet/create` | snippetCreate\
    \ | Display a form for creating a new snippet |\n\nOpen up your main.go file,\
    \ and make this change like so:\n\n```\nFile: main.go\n\npackage main\n\n...\n\
    \nfunc main() {\n\tmux := http.NewServeMux()\n\tmux.HandleFunc(\"/{$}\", home)\n\
    \tmux.HandleFunc(\"/snippet/view/{id}\", snippetView) // Add the {id} wildcard\
    \ segment\n\tmux.HandleFunc(\"/snippet/create\", snippetCreate)\n\n\tlog.Print(\"\
    starting server on :4000\")\n\n\terr := http.ListenAndServe(\":4000\", mux)\n\t\
    log.Fatal(err)\n}\n```\n\nNow let's head to our snippetView handler and update\
    \ it to retrieve the id value from the request URL path. Later in the book, we'll\
    \ use this id value to select a specific snippet from a database, but for now\
    \ we'll just echo the id back to the user as part of the HTTP"
  merge: -1
  img_proc: true
- pgno: 27
  md: "response.\n\nBecause the `id` value is untrusted user input, we should validate\
    \ it to make sure it’s sane\nand sensible before we use it. For the purpose of\
    \ our application we want to check that the\n`id` value contains a positive integer,\
    \ which we can do by trying to convert the string value to\nan integer with the\
    \ `strconv.Atoi()` function and then checking that the value is greater\nthan\
    \ zero.\n\nHere’s how:\n\n```\nFile: main.go\n\npackage main\n\nimport (\n\t\"\
    fmt\" // New import\n\t\"log\"\n\t\"net/http\"\n\t\"strconv\" // New import\n\
    )\n\n...\n\nfunc snippetView(w http.ResponseWriter, r *http.Request) {\n\t// Extract\
    \ the value of the id wildcard from the request using r.PathValue()\n\t// and\
    \ try to convert it to an integer using the strconv.Atoi() function. If\n\t//\
    \ it can't be converted to an integer, or the value is less than 1, we\n\t// return\
    \ a 404 page not found response.\n\tid, err := strconv.Atoi(r.PathValue(\"id\"\
    ))\n\tif err != nil || id < 1 {\n\t\thttp.NotFound(w, r)\n\t\treturn\n\t}\n\n\t\
    // Use the fmt.Sprintf() function to interpolate the id value with a\n\t// message,\
    \ then write it as the HTTP response.\n\tmsg := fmt.Sprintf(\"Display a specific\
    \ snippet with ID %d...\", id)\n\tw.Write([]byte(msg))\n}\n\n...\n```\n\nSave\
    \ your changes, restart the application, then open your browser and try visiting\
    \ a URL\nlike http://localhost:4000/snippet/view/123. You should see a response\
    \ containing the\nechoed `id` wildcard value from the request URL, similar to\
    \ this:"
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Display a specific snippet with ID 123...


    You might also like to try visiting some URLs which have invalid values for the
    id wildcard, or no wildcard value at all. For instance:


    +   - http://localhost:4000/snippet/view/

    +   - http://localhost:4000/snippet/view/-1

    +   - http://localhost:4000/snippet/view/foo


    For all these requests you should get a 404 page not found response.


    # Additional information


    # Precedence and conflicts


    When defining route patterns with wildcard segments, it’s possible that some of
    your patterns will ‘overlap’. For example, if you define routes with the patterns
    "/post/edit" and "/post/{id}" they overlap because an incoming HTTP request with
    the path /post/edit is a valid match for both patterns.


    When route patterns overlap, Go’s servemux needs to decide which pattern takes
    precedent so it can dispatch the request to the appropriate handler.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'The rule for this is very neat and succinct: *the most specific route pattern
    wins*. Formally, Go defines a pattern as more specific than another if it matches
    only a subset of requests that the other pattern matches.


    Continuing with the example above, the route pattern "/post/edit" *only* matches
    requests with the exact path /post/edit, whereas the pattern "/post/{id}" matches
    requests with the path /post/edit, /post/123, /post/abc and many more. Therefore
    "/post/edit" is the more specific route pattern and will take precedent.


    While we’re on this topic, there are a few other things worth mentioning;


    +   - A nice side-effect of the *most specific pattern wins* rule is that you
    can register patterns in any order *and it won’t change how the servemux behaves*.


    +   - There is a potential edge case where you have two overlapping route patterns
    but neither one is obviously more specific than the other. For example, the patterns
    "/post/new/{id}" and "/post/{author}/latest" overlap because they both match the
    request path /post/new/latest, but it’s not clear which one should take precedence.
    In this scenario, Go’s servemux considers the patterns to *conflict*, and will
    panic at runtime when initializing the routes.


    +   - Just because Go’s servemux supports overlapping routes, it doesn’t mean
    that you should use them! Having overlapping route patterns increases the risk
    of bugs and unintended behavior in your application, and if you have the freedom
    to design the URL structure for your application it’s generally good practice
    to keep overlaps to a minimum or avoid them completely.


    # Subtree path patterns with wildcards


    It’s important to understand that the routing rules we described in the previous
    chapter still apply, even when you’re using wildcard segments. In particular,
    if your route pattern ends in a trailing slash and has no {$} at the end, then
    it is treated as a *subtree path pattern* and it only requires the *start* of
    a request URL path to match.


    So, if you have a subtree path pattern like "/user/{id}/" in your routes (note
    the trailing slash), this pattern will match requests like /user/1/, /user/2/a,
    /user/2/a/b/c and so on.


    Again, if you don’t want that behavior, stick a {$} at the end — like "/user/{id}/{$}".


    # Remainder wildcards


    Wildcards in route patterns normally match a single, non-empty, segment of the
    request'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'path only. But there is one special case.


    If a route pattern ends with a wildcard, and this final wildcard identifier ends
    in ..., then the wildcard will match any and all remaining segments of a request
    path.


    For example, if you declare a route pattern like "/post/{path...}" it will match
    requests like /post/a, /post/a/b, /post/a/b/c and so on — very much like a subtree
    path pattern does. But the difference is that you can access the entire wildcard
    part via the r.PathValue() method in your handlers. In this example, you could
    get the wildcard value for {path...} by calling r.PathValue("path").'
  merge: -1
  img_proc: true
- pgno: 31
  md: "# Method-based routing\n\nNext, let’s follow HTTP good practice and restrict\
    \ our application so that it only responds to requests with an appropriate HTTP\
    \ method.\n\nAs we progress through our application build, our `home`, `snippetView`\
    \ and `snippetCreate` handlers will merely retrieve information and display pages\
    \ to the user, so it makes sense that these handlers should be restricted to acting\
    \ on `GET` requests.\n\nTo restrict a route to a specific HTTP method, you can\
    \ prefix the route pattern with the necessary HTTP method when declaring it, like\
    \ so:\n\n```\nFile: main.go\n\npackage main\n\n...\n\nfunc main() {\n\tmux :=\
    \ http.NewServeMux()\n\t// Prefix the route patterns with the required HTTP method\
    \ (for now, we will\n\t// restrict all three routes to acting on GET requests).\n\
    \tmux.HandleFunc(\"GET /{$}\", home)\n\tmux.HandleFunc(\"GET /snippet/view/{id}\"\
    , snippetView)\n\tmux.HandleFunc(\"GET /snippet/create\", snippetCreate)\n\n\t\
    log.Print(\"starting server on :4000\")\n\n\terr := http.ListenAndServe(\":4000\"\
    , mux)\n\tlog.Fatal(err)\n}\n```\n\n> Note: The HTTP methods in route patterns\
    \ are case sensitive and should always be written in uppercase, followed by at\
    \ least one whitespace character (both spaces and tabs are fine). You can only\
    \ include one HTTP method in each route pattern.\n\nIt’s also worth mentioning\
    \ that when you register a route pattern which uses the `GET` method, it will\
    \ match both `GET` and `HEAD` requests. All other methods (like `POST`, `PUT`\
    \ and `DELETE`) require an exact match.\n\nLet’s test out this change by using\
    \ curl to make some requests to our application. If you’re following along, start\
    \ by making a regular `GET` request to `http://localhost:4000/`, like so:"
  merge: -1
  img_proc: true
- pgno: 32
  md: '```

    $ curl -i localhost:4000/

    HTTP/1.1 200 OK

    Date: Wed, 18 Mar 2024 11:29:23 GMT

    Content-Length: 21

    Content-Type: text/plain; charset=utf-8


    Hello from Snippetbox

    ```


    The response here looks good. We can see that our route still works, and we get
    back a `200 OK` status and a `Hello from Snippetbox` response body, just like
    before.


    You can also go ahead and try making a `HEAD` request for the same URL. You should
    see that this also works correctly, returning *just the HTTP response headers*,
    and no response body.


    ```

    $ curl --head localhost:4000/

    HTTP/1.1 200 OK

    Date: Wed, 18 Mar 2024 11:29:23 GMT

    Content-Length: 21

    Content-Type: text/plain; charset=utf-8

    ```


    In contrast, let''s try making a `POST` request to `http://localhost:4000/`. The
    `POST` method isn''t supported for this route, so you should get an error response
    similar to this:


    ```

    $ curl -i -d "" localhost:4000/

    HTTP/1.1 405 Method Not Allowed

    Allow: GET, HEAD

    Content-Type: text/plain; charset=utf-8

    X-Content-Type-Options: nosniff

    Date: Wed, 18 Mar 2024 11:29:23 GMT

    Content-Length: 19


    Method Not Allowed

    ```


    > Note: The curl `-d` flag is used to declare any HTTP `POST` data that you want
    to include in the request body. In the command above we use `-d ""`, which means
    that the request body will be empty, but the request will still be sent with the
    HTTP method `POST` (rather than the default method of `GET`).


    So that''s looking really good. We can see that Go''s servemux has automatically
    sent a `405 Method Not Allowed` response for us, including an `Allow` header which
    lists the HTTP methods that *are* supported for the request URL.


    # Adding a POST-only route and handler'
  merge: -1
  img_proc: true
- pgno: 33
  md: "Let's also add a new `snippetCreatePost` handler to our codebase, which we'll\
    \ use later on to create and save a new snippet in a database. Because creating\
    \ and saving a snippet is a non-idempotent action that will change the state of\
    \ our server, we want make sure that this handler acts on `POST` requests only.\n\
    \nAll in all, we'll want our fourth handler and route to look like this:\n\n|\
    \ Route pattern | Handler | Action |\n| --- | --- | --- |\n| `GET /{$}` | home\
    \ | Display the home page |\n| `GET /snippet/view/{id}` | snippetView | Display\
    \ a specific snippet |\n| `GET /snippet/create` | snippetCreate | Display a form\
    \ for creating a new snippet |\n| `POST /snippet/create` | snippetCreatePost |\
    \ Save a new snippet |\n\nLet's go ahead and add the necessary code to our `main.go`\
    \ file, like so:\n\n```\nFile: main.go\n\npackage main\n\n...\n\n// Add a snippetCreatePost\
    \ handler function.\nfunc snippetCreatePost(w http.ResponseWriter, r *http.Request)\
    \ {\n  w.Write([]byte(\"Save a new snippet...\"))\n}\n\nfunc main() {\n  mux :=\
    \ http.NewServeMux()\n  mux.HandleFunc(\"GET /{$}\", home)\n  mux.HandleFunc(\"\
    GET /snippet/view/{id}\", snippetView)\n  mux.HandleFunc(\"GET /snippet/create\"\
    , snippetCreate)\n\n  // Create the new route, which is restricted to POST requests\
    \ only.\n  mux.HandleFunc(\"POST /snippet/create\", snippetCreatePost)\n\n  log.Print(\"\
    starting server on :4000\")\n\n  err := http.ListenAndServe(\":4000\", mux)\n\
    \  log.Fatal(err)\n}\n```\n\nNotice that it's totally OK to declare two (or more)\
    \ separate routes that have different HTTP methods but otherwise have the same\
    \ pattern, like we are doing here with \"`GET /snippet/create`\" and \"`POST /snippet/create`\"\
    .\n\nIf you restart the application and try making some requests with the URL\
    \ path `/snippet/create`, you should now see different responses depending on\
    \ the request"
