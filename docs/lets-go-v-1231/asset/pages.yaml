    \ information\n\n# Panic recovery in background goroutines\n\nIt’s important to\
    \ realize that our middleware will only recover panics that happen in the same\
    \ goroutine that executed the recoverPanic() middleware.\n\nIf, for example, you\
    \ have a handler which spins up another goroutine (e.g. to do some background\
    \ processing), then any panics that happen in the second goroutine will not be\
    \ recovered — not by the recoverPanic() middleware... and not by the panic recovery\
    \ built"
