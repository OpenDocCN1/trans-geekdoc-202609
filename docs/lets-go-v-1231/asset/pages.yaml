  md: '# # Designing a database model


    In this chapter we''re going to sketch out a database model for our project.


    If you don''t like the term _model_, you might want to think of it as a _service
    layer_ or _data access layer_ instead. Whatever you prefer to call it, the idea
    is that we will encapsulate the code for working with MySQL in a separate package
    to the rest of our application.


    For now, we''ll create a skeleton database model and have it return a bit of dummy
    data. It won''t do much, but I''d like to explain the pattern before we get into
    the nitty-gritty of SQL queries.


    Sound OK? Then let''s go ahead and create a new `internal/models` directory containing
    a `snippets.go` file:


    ```

    $ mkdir -p internal/models

    $ touch internal/models/snippets.go

    ```


    ![](img/c3e650db0d8dfdecc0f8e34a67719f65_108_0.png)'
  merge: -1
  img_proc: true
