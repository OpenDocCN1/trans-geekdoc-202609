    # Restricting access


    As it stands, we’re hiding the ‘Create snippet’ navigation link for any user that
    isn’t logged in. But an unauthenticated user could still create a new snippet
    by visiting the https://localhost:4000/snippet/create page directly.


    Let’s fix that, so that if an unauthenticated user tries to visit any routes with
    the URL path /snippet/create they are redirected to /user/login instead.


    The simplest way to do this is via some middleware. Open the cmd/web/middleware.go
    file and create a new requireAuthentication() middleware function, following the
    same pattern that we used earlier in the book:'
  merge: -1
  img_proc: true
- pgno: 310
  md: "```\nFile: cmd/web/middleware.go\n\npackage main\n\n...\n\nfunc (app *application)\
    \ requireAuthentication(next http.Handler) http.Handler {\n    return http.HandlerFunc(func(w\
    \ http.ResponseWriter, r *http.Request) {\n        // If the user is not authenticated,\
    \ redirect them to the login page and\n        // return from the middleware chain\
    \ so that no subsequent handlers in\n        // the chain are executed.\n    \
    \    if !app.isAuthenticated(r) {\n            http.Redirect(w, r, \"/user/login\"\
    , http.StatusSeeOther)\n            return\n        }\n\n        // Otherwise\
    \ set the \"Cache-Control: no-store\" header so that pages\n        // require\
    \ authentication are not stored in the users browser cache (or\n        // other\
    \ intermediary cache).\n        w.Header().Add(\"Cache-Control\", \"no-store\"\
    )\n\n        // And call the next handler in the chain.\n        next.ServeHTTP(w,\
    \ r)\n    })\n}\n```\n\nWe can now add this middleware to our `cmd/web/routes.go`\
    \ file to protect specific routes.\n\nIn our case we'll want to protect the GET\
    \ /snippet/create and POST /snippet/create routes. And there's not much point\
    \ logging out a user if they're not logged in, so it makes sense to use it on\
    \ the POST /user/logout route as well.\n\nTo help with this, let's rearrange our\
    \ application routes into two 'groups'.\n\nThe first group will contain our 'unprotected'\
    \ routes and use our existing dynamic middleware chain. The second group will\
    \ contain our 'protected' routes and will use a new protected middleware chain\
    \ — consisting of the dynamic middleware chain plus our new requireAuthentication()\
    \ middleware.\n\nLike this:"
  merge: -1
  img_proc: true
- pgno: 311
  md: "```\nFile: cmd/web/routes.go\n\npackage main\n\n...\n\nfunc (app *application)\
    \ routes() http.Handler {\n    mux := http.NewServeMux()\n\n    fileServer :=\
    \ http.FileServer(http.Dir(\"./ui/static/\"))\n    mux.Handle(\"GET /static/\"\
    , http.StripPrefix(\"/static\", fileServer))\n\n    // Unprotected application\
    \ routes using the \"dynamic\" middleware chain.\n    dynamic := alice.New(app.sessionManager.LoadAndSave)\n\
    \n    mux.Handle(\"GET /{$}\", dynamic.ThenFunc(app.home))\n    mux.Handle(\"\
    GET /snippet/view/{id}\", dynamic.ThenFunc(app.snippetView))\n    mux.Handle(\"\
    GET /user/signup\", dynamic.ThenFunc(app.userSignup))\n    mux.Handle(\"POST /user/signup\"\
    , dynamic.ThenFunc(app.userSignupPost))\n    mux.Handle(\"GET /user/login\", dynamic.ThenFunc(app.userLogin))\n\
    \    mux.Handle(\"POST /user/login\", dynamic.ThenFunc(app.userLoginPost))\n\n\
    \    // Protected (authenticated-only) application routes, using a new \"protected\"\
    \n    // middleware chain which includes the requireAuthentication middleware.\n\
    \    protected := dynamic.Append(app.requireAuthentication)\n\n    mux.Handle(\"\
    GET /snippet/create\", protected.ThenFunc(app.snippetCreate))\n    mux.Handle(\"\
    POST /snippet/create\", protected.ThenFunc(app.snippetCreatePost))\n    mux.Handle(\"\
    POST /user/logout\", protected.ThenFunc(app.userLogoutPost))\n\n    standard :=\
    \ alice.New(app.recoverPanic, app.logRequest, commonHeaders)\n\n    return standard.Then(mux)\n\
    }\n```\n\nSave the files, restart the application and make sure that you're logged\
    \ out.\n\nThen try visiting https://localhost:4000/snippet/create directly in\
    \ your browser. You should find that you get immediately redirected to the login\
    \ form instead.\n\nIf you like, you can also confirm with curl that unauthenticated\
    \ users are redirected for the POST /snippet/create route too:\n\n```\n$ curl\
    \ -ki -d \"\" https://localhost:4000/snippet/create\nHTTP/2 303\ncontent-security-policy:\
    \ default-src 'self'; style-src 'self' fonts.googleapis.com; font-src fonts.gstatic.com\n\
    location: /user/login\nreferrer-policy: origin-when-cross-origin\nserver: Go\n\
    vary: Cookie\nx-content-type-options: nosniff\nx-frame-options: deny\nx-xss-protection:\
    \ 0\ncontent-length: 0\ndate: Wed, 18 Mar 2024 11:29:23 GMT\n```"
  merge: -1
