    \ = message\n\t}\n}\n\n// CheckField() adds an error message to the FieldErrors\
    \ map only if a\n// validation check is not 'ok'.\nfunc (v *Validator) CheckField(ok\
    \ bool, key, message string) {\n\tif !ok {\n\t\tv.AddFieldError(key, message)\n\
    \t}\n}\n\n// NotBlank() returns true if a value is not an empty string.\nfunc\
