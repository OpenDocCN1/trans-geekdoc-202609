  md: "making some requests with curl. You should see that the security headers are\
    \ now included in every response.\n\n```\n$ curl --head http://localhost:4000/\n\
    HTTP/1.1 200 OK\nContent-Security-Policy: default-src 'self'; style-src 'self'\
    \ fonts.googleapis.com; font-src fonts.gstatic.com\nReferrer-Policy: origin-when-cross-origin\n\
    Server: Go\nX-Content-Type-Options: nosniff\nX-Frame-Options: deny\nX-Xss-Protection:\
    \ 0\nDate: Wed, 18 Mar 2024 11:29:23 GMT\nContent-Length: 1700\nContent-Type:\
    \ text/html; charset=utf-8\n```\n\n# Additional information\n\n# Flow of control\n\
    \nIt's important to know that when the last handler in the chain returns, control\
    \ is passed back up the chain in the reverse direction. So when our code is being\
    \ executed the flow of control actually looks like this:\n\ncommonHeaders → servemux\
    \ → application handler → servemux → commonHeaders\n\nIn any middleware handler,\
    \ code which comes before `next.ServeHTTP()` will be executed on the way down\
    \ the chain, and any code after `next.ServeHTTP()` — or in a deferred function\
    \ — will be executed on the way back up.\n\n```\nfunc myMiddleware(next http.Handler)\
    \ http.Handler {\n\treturn http.HandlerFunc(func(w http.ResponseWriter, r *http.Request)\
    \ {\n\t\t// Any code here will execute on the way down the chain.\n\t\tnext.ServeHTTP(w,\
    \ r)\n\t\t// Any code here will execute on the way back up the chain.\n\t})\n\
    }\n```\n\n# Early returns\n\nAnother thing to mention is that if you call return\
    \ in your middleware function before you call `next.ServeHTTP()`, then the chain\
    \ will stop being executed and control will flow back upstream."
  merge: -1
  img_proc: true
- pgno: 182
  md: "As an example, a common use-case for early returns is authentication middleware\
    \ which only allows execution of the chain to continue if a particular check is\
    \ passed. For instance:\n\n```\nfunc myMiddleware(next http.Handler) http.Handler\
    \ {\n\treturn http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\
    \t\t// If the user isn't authorized, send a 403 Forbidden status and\n\t\t// return\
    \ to stop executing the chain.\n\t\tif !isAuthorized(r) {\n\t\t\tw.WriteHeader(http.StatusForbidden)\n\
    \t\t\treturn\n\t\t}\n\n\t\t// Otherwise, call the next handler in the chain.\n\
    \t\tnext.ServeHTTP(w, r)\n\t})\n}\n```\n\nWe’ll use this ‘early return’ pattern\
    \ later in the book to restrict access to certain parts of our application.\n\n\
    # Debugging CSP issues\n\nWhile CSP headers are great and you should definitely\
    \ use them, it’s worth saying that I’ve spent many hours trying to debug problems,\
    \ only to eventually realize that a critical resource or script is being blocked\
    \ by my own CSP rules .\n\nIf you’re working on a project which is using CSP headers,\
    \ like this one, I recommend keeping your web browser developer tools handy and\
    \ getting into the habit of checking the logs early on if you run into any unexpected\
    \ problems. In Firefox, any blocked resources will be shown as an error in the\
    \ console logs — similar to this:"
  merge: -1
  img_proc: true
