    \ was to use the equality operator ==, like so:\n\n```\nif err == models.ErrNoRecord\
    \ {\n\thttp.NotFound(w, r)\n} else {\n\tapp.serverError(w, r, err)\n}\n```\n\n\
    But, while this code still complies, it’s safer and best practice to use the errors.Is()\
    \ function instead.\n\nThis is because Go 1.13 introduced the ability to add additional\
    \ information to errors by wrapping them. If an error happens to get wrapped,\
    \ a entirely new error value is created — which in turn means that it’s not possible\
    \ to check the value of the original underlying error using the regular == equality\
    \ operator.\n\nThe errors.Is() function works by unwrapping errors as necessary\
    \ before checking for a match.\n\nThere is also another function, errors.As()\
    \ which you can use to check if a (potentially wrapped) error has a specific type.\
    \ We’ll use this later on this book.\n\n# Shorthand single-record queries\n\n\
    I’ve deliberately made the code in SnippetModel.Get() slightly long-winded to\
    \ help clarify and emphasize what is going on behind the scenes of the code.\n\
    \nIn practice, you can shorten the code slightly by leveraging the fact that errors\
    \ from"
