    The go.sum file isn''t designed to be human-editable and generally you won''t
    need to open it. But it serves two useful functions:


    +   • If you run the `go mod verify` command from your terminal, this will verify
    that the checksums of the downloaded packages on your machine match the entries
    in `go.sum`, so you can be confident that they haven''t been altered.


