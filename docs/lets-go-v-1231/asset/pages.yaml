  md: '# Testing HTML forms


    In this chapter we''re going to add an end-to-end test for the POST /user/signup
    route, which is handled by our userSignupPost handler.


    Testing this route is made a bit more complicated by the anti-CSRF check that
    our application does. Any request that we make to POST /user/signup will always
    receive a 400 Bad Request response unless the request contains a valid CSRF token
    and cookie. To get around this we need to simulate the workflow of a real-life
    user as part of our test, like so:


    +   1. Make a GET /user/signup request. This will return a response which contains
    a CSRF cookie in the response headers and the CSRF token for the signup page in
    the response body.


    +   2. Extract the CSRF token from the HTML response body.


    +   3. Make a POST /user/signup request, using the same http.Client that we used
    in step 1 (so it automatically passes the CSRF cookie with the POST request) and
    including the CSRF token alongside the other POST data that we want to test.


    Let''s begin by adding a new helper function to our cmd/web/testutils_test.go
    file for extracting the CSRF token (if one exists) from an HTML response body:'
  merge: -1
  img_proc: true
- pgno: 381
  md: "```\nFile: cmd/web/testutils_test.go\n\npackage main\n\nimport (\n\t\"bytes\"\
    \n\t\"html\" // New import\n\t\"io\"\n\t\"log/slog\"\n\t\"net/http\"\n\t\"net/http/cookiejar\"\
    \n\t\"net/http/httptest\"\n\t\"regexp\" // New import\n\t\"testing\"\n\t\"time\"\
    \n\n\t\"snippetbox.alexedwards.net/internal/models/mocks\"\n\n\t\"github.com/alexedwards/scs/v2\"\
    \n\t\"github.com/go-playground/form/v4\"\n)\n\n// Define a regular expression\
    \ which captures the CSRF token value from the\n// HTML for our user signup page.\n\
    var csrfTokenRX = regexp.MustCompile(`<input type='hidden' name='csrf_token' value='(.+)'\
    \ />`)\n\nfunc extractCSRFToken(t *testing.T, body string) string {\n\t// Use\
    \ the FindStringSubmatch method to extract the token from the HTML body.\n\t//\
    \ Note that this returns an array with the entire matched pattern in the\n\t//\
    \ first position, and the values of any captured data in the subsequent\n\t//\
    \ positions.\n\tmatches := csrfTokenRX.FindStringSubmatch(body)\n\tif len(matches)\
    \ < 2 {\n\t\tt.Fatal(\"no csrf token found in body\")\n\t}\n\n\treturn html.UnescapeString(matches[1])\n\
    }\n...\n```\n\n> **Note:** You might be wondering why we are using the `html.UnescapeString()`\
    \ function before returning the CSRF token. The reason for this is because Go's\
    \ `html/template` package automatically escapes all dynamically rendered data...\
    \ including our CSRF token. Because the CSRF token is a base64 encoded string\
    \ it will potentially include the `+` character, and this will be escaped to `&#43;`.\
    \ So after extracting the token from the HTML we need to run it through `html.UnescapeString()`\
    \ to get the original token value.\n\nNow that's in place, let's go back to our\
    \ `cmd/web/handlers_test.go` file and create a new `TestUserSignup` test.\n\n\
    To start with, we'll make this perform a `GET` `/user/signup` request and then\
    \ extract and print out the CSRF token from the HTML response body. Like so:"
  merge: -1
  img_proc: true
- pgno: 382
  md: "```\nFile: cmd/web/handlers_test.go\n\npackage main\n\n...\n\nfunc TestUserSignup(t\
    \ *testing.T) {\n\t// Create the application struct containing our mocked dependencies\
    \ and set\n\t// up the test server for running an end-to-end test.\n\tapp := newTestApplication(t)\n\
    \tts := newTestServer(t, app.routes())\n\tdefer ts.Close()\n\n\t// Make a GET\
    \ /user/signup request and then extract the CSRF token from the\n\t// response\
    \ body.\n\t_, body := ts.get(t, \"/user/signup\")\n\tcsrfToken := extractCSRFToken(t,\
    \ body)\n\n\t// Log the CSRF token value in our test output using the t.Logf()\
    \ function.\n\t// The t.Logf() function works in the same way as fmt.Printf(),\
    \ but writes\n\t// the provided message to the test output.\n\tt.Logf(\"CSRF token\
    \ is: %q\", csrfToken)\n}\n```\n\nImportantly, you must run tests using the `-v`\
