    \ file and add the following render() method:\n\n```\nFile: cmd/web/helpers.go\n\
    \npackage main\n\nimport (\n\t\"fmt\" // New import\n\t\"net/http\"\n)\n\n...\n\
    \nfunc (app *application) render(w http.ResponseWriter, r *http.Request, status\
