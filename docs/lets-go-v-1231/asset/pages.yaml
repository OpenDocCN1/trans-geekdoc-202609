    # # Additional information


    # ## Method precedence


    The *most specific pattern wins* rule also applies if you have route patterns
    that overlap because of a HTTP method.


    It''s important to be aware that a route pattern which doesn''t include a method
    — like "/article/{id}" — will match incoming HTTP requests with *any method*.
    In contrast, a route like "POST /article/{id}" will only match requests which
    have the method POST. So if you declare the overlapping routes "/article/{id}"
    and "POST /article/{id}" in your application, then the "POST /article/{id}" route
    will take precedence.


    # ## Handler naming


    I''d also like to emphasize that there is no right or wrong way to name your handlers
    in Go.


    In this project, we''ll follow a convention of postfixing the names of any handlers
    that deal with POST requests with the word ''Post''. Like so:'
  merge: -1
  img_proc: true
- pgno: 35
  md: '| Route pattern | Handler | Action |

    |---|---|---|

    | GET /snippet/create | snippetCreate | Display a form for creating a new snippet
    |

    | POST /snippet/create | snippetCreatePost | Create a new snippet |


    But in your own work it’s not necessary to follow this pattern. For example, you
    could prefix handler names with the words ‘get’ and ‘post’ instead, like this:


    | Route pattern | Handler | Action |

    |---|---|---|

    | GET /snippet/create | getSnippetCreate | Display a form for creating a new snippet
    |

    | POST /snippet/create | postSnippetCreate | Create a new snippet |


    Or even give the handlers completely different names. For example:


    | Route pattern | Handler | Action |

    |---|---|---|

    | GET /snippet/create | newSnippetForm | Display a form for creating a new snippet
    |

    | POST /snippet/create | createSnippet | Create a new snippet |


    Basically, you have the freedom in Go to choose a naming convention for your handlers
    that works for you and fits with your brain.


    # Third-party routers


    The wildcard and method-based routing functionality that we’ve been using in the
    past two chapters is relatively new to Go — it only became part of the standard
    library in Go 1.22. While this is a very welcome addition to the language and
    a big improvement, you might find that there are still times where the standard
    library routing functionality doesn’t provide everything that you need.


    For example, the following things are not currently supported:


    +   - Sending custom 404 Not Found and 405 Method Not Allowed responses to the
    user (although there is an open proposal regarding this).

    +   - Using regular expressions in your route patterns or wildcards.

    +   - Matching multiple HTTP methods in a single route declaration.

    +   - Automatic support for OPTIONS requests.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '+   • Routing requests to handlers based on unusual things, like HTTP request
    headers.


    If you need these features in your application, you''ll need to use a third-party
    router package. The ones that I recommend are httprouter, chi, flow and gorilla/mux,
    and you can find a comparison of them and guidance about which one to use in this
    blog post.'
  merge: -1
