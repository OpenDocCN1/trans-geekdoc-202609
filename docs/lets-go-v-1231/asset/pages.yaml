- pgno: 190
  md: "into Go HTTP server. They will cause your application to exit and bring down\
    \ the server.\n\nSo, if you are spinning up additional goroutines from within\
    \ your web application and there is any chance of a panic, you must make sure\
    \ that you recover any panics from within those too. For example:\n\n```\nfunc\
    \ (app *application) myHandler(w http.ResponseWriter, r *http.Request) {\n...\n\
    \n\t// Spin up a new goroutine to do some background processing.\n\tgo func()\
    \ {\n\t\tdefer func() {\n\t\t\tif err := recover(); err != nil {\n\t\t\t\tapp.logger.Error(fmt.Sprint(err))\n\
    \t\t\t}\n\t\t}()\n\n\t\tdoSomeBackgroundProcessing()\n\t}()\n}\n\nw.Write([]byte(\"\
    OK\"))\n}\n```"
