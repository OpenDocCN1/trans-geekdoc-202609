  md: "# Validating form data\n\nRight now there’s a glaring problem with our code:\
    \ we’re not validating the (untrusted) user input from the form in any way. We\
    \ should do this to ensure that the form data is present, of the correct type\
    \ and meets any business rules that we have.\n\nSpecifically for this form we\
    \ want to:\n\n+   - Check that the title and content fields are not empty.\n+\
    \   - Check that the title field is not more than 100 characters long.\n+   -\
    \ Check that the expires value exactly matches one of our permitted values (1,\
    \ 7 or 365 days).\n\nAll of these checks are fairly straightforward to implement\
    \ using some if statements and various functions in Go's strings and unicode/utf8\
    \ packages.\n\nOpen up your handlers.go file and update the snippetCreatePost\
    \ handler to include the appropriate validation rules like so:\n\n```\nFile: cmd/web/handlers.go\n\
    \npackage main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"net/http\"\n\t\"strconv\"\
    \n\t\"strings\" // New import\n\t\"unicode/utf8\" // New import\n\n\t\"snippetbox.alexedwards.net/internal/models\"\
    \n)\n\n...\n\nfunc (app *application) snippetCreatePost(w http.ResponseWriter,\
    \ r *http.Request) {\n\terr := r.ParseForm()\n\tif err != nil {\n\t\tapp.clientError(w,\
    \ http.StatusBadRequest)\n\t\treturn\n\t}\n\n\ttitle := r.PostForm.Get(\"title\"\
    )\n\tcontent := r.PostForm.Get(\"content\")\n\n\texpires, err := strconv.Atoi(r.PostForm.Get(\"\
    expires\"))\n\tif err != nil {\n\t\tapp.clientError(w, http.StatusBadRequest)\n\
    \t\treturn\n\t}\n```"
