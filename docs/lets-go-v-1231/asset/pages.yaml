- pgno: 304
  md: "# # User logout\n\nThis brings us nicely to logging out a user. Implementing\
    \ the user logout is straightforward in comparison to the signup and login — essentially\
    \ all we need to do is remove the \"authenticatedUserID\" value from their session.\n\
    \nAt the same time it's good practice to renew the session ID again, and we'll\
    \ also add a flash message to the session data to confirm to the user that they've\
    \ been logged out.\n\nLet's update the `userLogoutPost` handler to do exactly\
    \ that.\n\n```\nFile: cmd/web/handlers.go\n\npackage main\n\n...\n\nfunc (app\
    \ *application) userLogoutPost(w http.ResponseWriter, r *http.Request) {\n   \
    \ // Use the RenewToken() method on the current session to change the session\n\
    \    // ID again.\n    err := app.sessionManager.RenewToken(r.Context())\n   \
    \ if err != nil {\n        app.serverError(w, r, err)\n        return\n    }\n\
    \n    // Remove the authenticatedUserID from the session data so that the user\
    \ is\n    // 'logged out'.\n    app.sessionManager.Remove(r.Context(), \"authenticatedUserID\"\
    )\n\n    // Add a flash message to the session to confirm to the user that they've\
    \ been\n    // logged out.\n    app.sessionManager.Put(r.Context(), \"flash\"\
    , \"You've been logged out successfully!\")\n\n    // Redirect the user to the\
    \ application home page.\n    http.Redirect(w, r, \"/\", http.StatusSeeOther)\n\
    }\n```\n\nSave the file and restart the application. If you now click the ‘Logout’\
    \ link in the navigation bar you should be logged out and redirected to the homepage\
    \ like so:"
  merge: -1
  img_proc: true
