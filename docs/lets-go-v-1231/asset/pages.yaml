- pgno: 39
  md: "# Customizing headers\n\nYou can also customize the HTTP headers sent to a\
    \ user by changing the *response header map*. Probably the most common thing you'll\
    \ want to do is include an additional header in the map, which you can do using\
    \ the `w.Header().Add()` method.\n\nTo demonstrate this, let's add a `Server:\
    \ Go` header to the response that our `home` handler sends. If you're following\
    \ along, go ahead and update the handler code like so:\n\n```\nFile: main.go\n\
    \npackage main\n\n...\n\nfunc home(w http.ResponseWriter, r *http.Request) {\n\
    \t// Use the Header().Add() method to add a 'Server: Go' header to the\n\t// response\
    \ header map. The first parameter is the header name, and\n\t// the second parameter\
    \ is the header value.\n\tw.Header().Add(\"Server\", \"Go\")\n\n\tw.Write([]byte(\"\
    Hello from Snippetbox\"))\n}\n\n...\n```\n\n> **Important:** You must make sure\
    \ that your response header map contains all the headers you want *before* you\
    \ call `w.WriteHeader()` or `w.Write()`. Any changes you make to the response\
    \ header map after calling `w.WriteHeader()` or `w.Write()` will have no effect\
    \ on the headers that the user receives.\n\nLet's try this out by using curl to\
    \ make another request to `http://localhost:4000/`. This time you should see that\
    \ the response now includes a new `Server: Go` header, like so:\n\n```\n$ curl\
    \ -i http://localhost:4000\n\nHTTP/1.1 200 OK\nServer: Go\nDate: Wed, 18 Mar 2024\
    \ 11:29:23 GMT\nContent-Length: 21\nContent-Type: text/plain; charset=utf-8\n\n\
    Hello from Snippetbox\n```\n\n# Writing response bodies"
  merge: -1
  img_proc: true
- pgno: 40
  md: "So far in this book we've been using w.Write() to send specific HTTP response\
    \ bodies to a user. And while this is the simplest and most fundamental way to\
    \ send a response, in practice it's far more common to pass your http.ResponseWriter\
    \ value to another function that writes the response for you.\n\nIn fact, there\
    \ are a lot of functions that you can use to write a response!\n\nThe key thing\
    \ to understand is this... because the http.ResponseWriter value in your handlers\
    \ has a Write() method, it satisfies the io.Writer interface.\n\nIf you're new\
    \ to Go, then the concept of interfaces can be a bit confusing and I don't want\
    \ to get too hung up on it right now. But at a practical level, it means that\
    \ any functions where you see an io.Writer parameter, you can pass in your http.ResponseWriter\
    \ value and whatever is being written will subsequently be sent as the body of\
    \ the HTTP response.\n\nThat means you can use standard library functions like\
    \ io.WriteString() and the fmt.Fprint*() family (all of which accept an io.Writer\
    \ parameter) to write plain-text response bodies too.\n\n```\n```go\n// Instead\
    \ of this...\nw.Write([]byte(\"Hello world\"))\n\n// You can do this...\nio.WriteString(w,\
    \ \"Hello world\")\nfmt.Fprint(w, \"Hello world\")\n```\n```\n\nLet's leverage\
    \ this, and update the code in our snippetView handler to use the fmt.Fprintf()\
    \ function. This will allow us to interpolate the wildcard id value in our response\
    \ body message and write the response in a single line, like so:\n\n```\n```go\n\
    File: main.go\n\npackage main\n\n...\n\nfunc snippetView(w http.ResponseWriter,\
    \ r *http.Request) {\n  id, err := strconv.Atoi(r.PathValue(\"id\"))\n  if err\
    \ != nil || id < 1 {\n    http.NotFound(w, r)\n    return\n  }\n\n  fmt.Fprintf(w,\
    \ \"Display a specific snippet with ID %d...\", id)\n}\n\n...\n```\n```"
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Additional information


    # Content sniffing


    In order to automatically set the `Content-Type` header, Go content sniffs the
    response body with the `http.DetectContentType()` function. If this function can’t
    guess the content type, Go will fall back to setting the header `Content-Type:
    application/octet-stream` instead.


    The `http.DetectContentType()` function generally works quite well, but a common
    gotcha for web developers is that it can’t distinguish JSON from plain text. So,
    by default, JSON responses will be sent with a `Content-Type: text/plain; charset=utf-8`
    header. You can prevent this from happening by setting the correct header manually
    in your handler like so:


    ```

    w.Header().Set("Content-Type", "application/json")

    w.Write([]byte(`{"name":"Alex"}`))

    ```


    # Manipulating the header map


    In this chapter we used `w.Header().Add()` to add a new header to the response
    header map. But there are also `Set()`, `Del()`, `Get()` and `Values()` methods
    that you can use to manipulate and read from the header map too.


    ```

    // Set a new cache-control header. If an existing "Cache-Control" header exists

    // it will be overwritten.

    w.Header().Set("Cache-Control", "public, max-age=31536000")


    // In contrast, the Add() method appends a new "Cache-Control" header and can

    // be called multiple times.

    w.Header().Add("Cache-Control", "public")

    w.Header().Add("Cache-Control", "max-age=31536000")


    // Delete all values for the "Cache-Control" header.

    w.Header().Del("Cache-Control")


    // Retrieve the first value for the "Cache-Control" header.

    w.Header().Get("Cache-Control")


    // Retrieve a slice of all values for the "Cache-Control" header.

    w.Header().Values("Cache-Control")

    ```


    # Header canonicalization


    When you’re using the `Set()`, `Add()`, `Del()`, `Get()` and `Values()` methods
    on the header map, the header name will always be canonicalized using the `textproto.CanonicalMIMEHeaderKey()`
    function. This converts the first letter and any letter'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'following a hyphen to upper case, and the rest of the letters to lowercase.
    This has the practical implication that when calling these methods the header
    name is case-insensitive.


    If you need to avoid this canonicalization behavior, you can edit the underlying
    header map directly. It has the type map[string][]string behind the scenes. For
    example:


    ```

    w.Header()["X-XSS-Protection"] = []string{"1; mode=block"}

    ```


    > **Note:** If a HTTP/2 connection is being used, Go will *always* automatically
    convert the header names and values to lowercase for you when writing the response,
    as per the HTTP/2 specifications.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Project structure and organization


    Before we add any more code to our main.go file, it’s a good time to think how
    to organize and structure this project.


    It’s important to explain upfront that there’s no single right — or even recommended
    — way to structure web applications in Go. And that’s both good and bad. It means
    that you have freedom and flexibility over how you organize your code, but it’s
    also easy to get stuck down a rabbit-hole of uncertainty when trying to decide
    what the best structure should be.


    As you gain experience with Go, you’ll get a feel for which patterns work well
    for you in different situations. But as a starting point, the best advice I can
    give you is don’t over-complicate things. Try hard to add structure and complexity
    only when it’s demonstrably needed.


    For this project, we’ll implement an outline structure that follows a popular
    and tried-and-tested approach. It’s a solid starting point, and you should be
    able to reuse the general structure in a wide variety of projects.


    If you’re following along, make sure that you’re in the root of your project repository
    and run the following commands:


    ```

    $ cd $HOME/code/snippetbox

    $ rm main.go

    $ mkdir -p cmd/web internal ui/html ui/static

    $ touch cmd/web/main.go

    $ touch cmd/web/handlers.go

    ```


    The structure of your project repository should now look like this:'
  merge: -1
  img_proc: true
- pgno: 44
  md: '![](img/c3e650db0d8dfdecc0f8e34a67719f65_44_0.png)


    Let''s take a moment to discuss what each of these directories will be used for.


    +   * The **cmd** directory will contain the *application-specific* code for the
    executable applications in the project. For now our project will have just one
    executable application — the web application — which will live under the **cmd/web**
    directory.


    +   * The **internal** directory will contain the ancillary *non-application-specific*
    code used in the project. We''ll use it to hold potentially reusable code like
    validation helpers and the SQL database models for the project.


    +   * The **ui** directory will contain the *user-interface assets* used by the
    web application. Specifically, the **ui/html** directory will contain HTML templates,
    and the **ui/static** directory will contain static files (like CSS and images).


    So why are we using this structure?


    There are two big benefits:


    +   1. It gives a clean separation between Go and non-Go assets. All the Go code
    we write will'
  merge: -1
  img_proc: true
