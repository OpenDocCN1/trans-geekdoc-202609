  md: "# Routing requests\n\nHaving a web application with just one route isn’t very\
    \ exciting... or useful! Let’s add a couple more routes so that the application\
    \ starts to shape up like this:\n\n| Route pattern | Handler | Action |\n| :---\
    \ | :--- | :--- |\n| / | home | Display the home page |\n| /snippet/view | snippetView\
    \ | Display a specific snippet |\n| /snippet/create | snippetCreate | Display\
    \ a form for creating a new snippet |\n\nReopen the main.go file and update it\
    \ as follows:\n\n```\nFile: main.go\n\npackage main\n\nimport (\n\t\"log\"\n\t\
    \"net/http\"\n)\n\nfunc home(w http.ResponseWriter, r *http.Request) {\n\tw.Write([]byte(\"\
    Hello from Snippetbox\"))\n}\n\n// Add a snippetView handler function.\nfunc snippetView(w\
    \ http.ResponseWriter, r *http.Request) {\n\tw.Write([]byte(\"Display a specific\
    \ snippet...\"))\n}\n\n// Add a snippetCreate handler function.\nfunc snippetCreate(w\
    \ http.ResponseWriter, r *http.Request) {\n\tw.Write([]byte(\"Display a form for\
    \ creating a new snippet...\")))\n}\n\nfunc main() {\n\t// Register the two new\
    \ handler functions and corresponding route patterns with\n\t// the servemux,\
    \ in exactly the same way that we did before.\n\tmux := http.NewServeMux()\n\t\
    mux.HandleFunc(\"/\", home)\n\tmux.HandleFunc(\"/snippet/view\", snippetView)\n\
    \tmux.HandleFunc(\"/snippet/create\", snippetCreate)\n\n\tlog.Print(\"starting\
    \ server on :4000\")\n\n\terr := http.ListenAndServe(\":4000\", mux)\n\tlog.Fatal(err)\n\
    }\n```"
