    \ that all the struct fields are deliberately\n// exported (i.e. start with a\
    \ capital letter). This is because struct fields\n// must be exported in order\
    \ to be read by the html/template package when\n// rendering the template.\ntype\
    \ snippetCreateForm struct {\n\tTitle   string\n\tContent string\n\tExpires int\n\
    \tFieldErrors map[string]string\n}\n\nfunc (app *application) snippetCreatePost(w\
    \ http.ResponseWriter, r *http.Request) {\n\terr := r.ParseForm()\n\tif err !=\
    \ nil {\n\t\tapp.clientError(w, http.StatusBadRequest)\n\t\treturn\n\t}\n\n\t\
    // Get the expires value from the form as normal.\n\texpires, err := strconv.Atoi(r.PostForm.Get(\"\
    expires\"))\n\tif err != nil {\n\t\tapp.clientError(w, http.StatusBadRequest)\n\
    \t\treturn\n\t}\n\n\t// Create an instance of the snippetCreateForm struct containing\
    \ the values\n\t// from the form and an empty map for any validation errors.\n\
    \tform := snippetCreateForm{\n\t\tTitle:   r.PostForm.Get(\"title\"),\n\t\tContent:\
    \ r.PostForm.Get(\"content\"),\n\t\tExpires: expires,\n\t\tFieldErrors: map[string]string{},\n\
    \t}\n\n\t// Update the validation checks so that they operate on the snippetCreateForm\n\
    \t// instance.\n\tif strings.TrimSpace(form.Title) == \"\" {\n\t\tform.FieldErrors[\"\
    title\"] = \"This field cannot be blank\"\n\t} else if utf8.RuneCountInString(form.Title)\
    \ > 100 {\n\t\tform.FieldErrors[\"title\"] = \"This field cannot be more than\
    \ 100 characters long\"\n\t}\n\n\tif strings.TrimSpace(form.Content) == \"\" {\n\
    \t\tform.FieldErrors[\"content\"] = \"This field cannot be blank\"\n\t}\n\n\t\
    if form.Expires != 1 && form.Expires != 7 && form.Expires != 365 {\n\t\tform.FieldErrors[\"\
    expires\"] = \"This field must equal 1, 7 or 365\"\n\t}\n\n\t// If there are any\
    \ validation errors, then re-display the create.tmpl template,\n\t// passing in\
    \ the snippetCreateForm instance as dynamic data in the Form\n\t// field. Note\
    \ that we use the HTTP status code 422 Unprocessable Entity\n\t// when sending\
    \ the response to indicate that there was a validation error.\n\tif len(form.FieldErrors)\
    \ > 0 {\n\t\tdata := app.newTemplateData(r)\n\t\tdata.Form = form\n\t\tapp.render(w,\
    \ r, http.StatusUnprocessableEntity, \"create.tmpl\", data)\n\t\treturn\n\t}\n\
