- pgno: 5
  md: '# Introduction


    In this book we''ll be building a web application called Snippetbox, which lets
    people paste and share snippets of text — a bit like Pastebin or GitHub''s Gists.
    Towards the end of the build it will look a bit like this:


    ![](img/c3e650db0d8dfdecc0f8e34a67719f65_5_0.png)


    Our application will start off super simple, with just one web page. Then with
    each chapter we''ll build it up step-by-step until a user can save and view snippets
    via the app. This will take us through topics like how to structure a project,
    routing requests, working with a database, processing forms and displaying dynamic
    data safely.


    Then later in the book we''ll add user accounts, and restrict the application
    so that only registered users can create snippets. This will take us through more
    advanced topics like configuring a HTTPS server, session management, user authentication
    and middleware.'
  merge: -1
  img_proc: true
