  md: '# Guided exercises


    In this section there are six guided exercises for you to work through, all of
    which extend the Snippetbox application that we''ve created to include some additional
    functionality.


    The exercises leverage the code patterns and techniques that we''ve already covered
    in this book, but they are applied in a slightly different context. So going through
    them is a good opportunity to test your understanding of what you''ve learned,
    and practice putting it into use.


    Each exercise is broken up into a few small-ish steps. And for each step I''ve
    linked to an answer containing some ''suggested code'' which you may wish to look
    at if you get stuck. You may also find it interesting to compare and contrast
    the suggested code against yours — either at the end of the exercise or as you
    go along. If your code looks slightly different, no worries. There''s more than
    one way to achieve the same goal.


    A final note before we get started: A couple of the exercises in this section
    build on each other, so I recommend working through them in order.'
