  md: '# Nested templates


    It''s really important to note that when you''re invoking one template from another
    template, dot needs to be explicitly passed or _pipelined_ to the template being
    invoked. You do this by including it at the end of each {{template}} or {{block}}
    action, like so:


    ```

    {{template "main".}}

    {{block "sidebar".}}{{end}}

    ```


    As a general rule, my advice is to get into the habit of always pipelining dot
    whenever you invoke a template with the {{template}} or {{block}} actions, unless
    you have a good reason not to.


    # Calling methods


    If the type that you''re yielding between {{ }} tags has methods defined against
    it, you can call these methods (so long as they are exported and they return only
    a single value — or a single value and an error).


    For example, our .Snippet.Created struct field has the underlying type time.Time,
    meaning that you could render the name of the weekday by calling its Weekday()
    method like so:


    ```

    <span>{{.Snippet.Created.Weekday}}</span>

    ```


    You can also pass parameters to methods. For example, you could use the AddDate()
    method to add six months to a time like so:


    ```

    <span>{{.Snippet.Created.AddDate 0 6 0}}</span>

    ```


    Notice that this is different syntax to calling functions in Go — the parameters
    are _not_ surrounded by parentheses and are separated by a single space character,
    not a comma.


    # HTML comments


    Finally, the html/template package always strips out any HTML comments you include
    in your templates, including any conditional comments.


    The reason for this is to help avoid XSS attacks when rendering dynamic content.
    Allowing conditional comments would mean that Go isn''t always able to anticipate
    how a browser'
  merge: -1
  img_proc: true
- pgno: 145
  md: will interpret the markup in a page, and therefore it wouldn't necessarily be
    able to escape everything appropriately. To solve this, Go simply strips out all
    HTML comments.
  merge: -1
  img_proc: true
- pgno: 146
  md: '# # Template actions and functions


    In this section we''re going to look at the template actions and functions that
    Go provides.


    We''ve already talked about some of the actions — {{define}}, {{template}} and
    {{block}} — but there are three more which you can use to control the display
    of dynamic data — {{if}}, {{with}} and {{range}}).


    | Action | Description |

    |---|---|

    | {{if .Foo}} C1 {{else}} C2 {{end}} | If .Foo is not empty then render the content
    C1, otherwise render the content C2. |

    | {{with .Foo}} C1 {{else}} C2 {{end}} | If .Foo is not empty, then set dot to
    the value of .Foo and render the content C1, otherwise render the content C2.
    |

    | {{range .Foo}} C1 {{else}} C2 {{end}} | If the length of .Foo is greater than
    zero then loop over each element, setting dot to the value of each element and
    rendering the content C1. If the length of .Foo is zero then render the content
    C2. The underlying type of .Foo must be an array, slice, map, or channel. |


    There are a few things about these actions to point out:


    +   - For all three actions the {{else}} clause is optional. For instance, you
    can write {{if .Foo}} C1 {{end}} if there''s no C2 content that you want to render.


    +   - The empty values are false, 0, any nil pointer or interface value, and any
    array, slice, map, or string of length zero.


    +   - It''s important to grasp that the with and range actions change the value
    of dot. Once you start using them, what dot represents can be different depending
    on where you are in the template and what you''re doing.


    The html/template package also provides some template functions which you can
    use to add extra logic to your templates and control what is rendered at runtime.
    You can find a complete listing of functions here, but the most important ones
    are:'
  merge: -1
  img_proc: true
- pgno: 147
  md: '| Function | Description |

    | :--- | :--- |

    | `{{eq .Foo .Bar}}` | Yields true if .Foo is equal to .Bar |

    | `{{ne .Foo .Bar}}` | Yields true if .Foo is not equal to .Bar |

    | `{{not .Foo}}` | Yields the boolean negation of .Foo |

    | `{{or .Foo .Bar}}` | Yields .Foo if .Foo is not empty; otherwise yields .Bar
    |

    | `{{index .Foo i}}` | Yields the value of .Foo at index i. The underlying type
    of .Foo must be a map, slice or array, and i must be an integer value. |

    | `{{printf "%s-%s" .Foo .Bar}}` | Yields a formatted string containing the .Foo
    and .Bar values. Works in the same way as fmt.Sprintf(). |

    | `{{len .Foo}}` | Yields the length of .Foo as an integer. |

    | `{{$bar := len .Foo}}` | Assign the length of .Foo to the template variable
    $bar |


    The final row is an example of declaring a template variable. Template variables
    are particularly useful if you want to store the result from a function and use
    it in multiple places in your template. Variable names must be prefixed by a dollar
    sign and can contain alphanumeric characters only.


    # # Using the with action


