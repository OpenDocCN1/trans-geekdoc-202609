- pgno: 94
  md: '# Database-driven responses


    For our Snippetbox web application to become truly useful we need somewhere to
    store (or persist) the data entered by users, and the ability to query this data
    store dynamically at runtime.


    There are many different data stores we could use for our application — each with
    different pros and cons — but we’ll opt for the popular relational database MySQL.


    > Note: All of the general code patterns in this section of the book also apply
    to other databases like PostgreSQL or SQLite too. If you’re following along and
    would prefer to use an alternative database, you can, but I recommend using MySQL
    for now to get a feeling for how everything works and then swapping databases
    as a practice exercise once you’ve finished the book.


    In this section you’ll learn how to:


    +   - Install a database driver to act as a ‘middleman’ between MySQL and your
    Go application.

    +   - Connect to MySQL from your web application (specifically, you’ll learn how
    to establish a pool of reusable connections).

    +   - Create a standalone models package, so that your database logic is reusable
    and decoupled from your web application.

    +   - Use the appropriate functions in Go’s database/sql package to execute different
    types of SQL statements, and how to avoid common errors that can lead to your
    server running out of resources.

    +   - Prevent SQL injection attacks by correctly using placeholder parameters.

    +   - Use transactions, so that you can execute multiple SQL statements in one
    atomic action.'
  merge: -1
  img_proc: true
