    \t\tapp.logger.Error(err.Error(), \"method\", r.Method, \"uri\", r.URL.RequestURI())\n\
    \t\thttp.Error(w, \"Internal Server Error\", http.StatusInternalServerError)\n\
    \t\treturn\n\t}\n}\n```"
