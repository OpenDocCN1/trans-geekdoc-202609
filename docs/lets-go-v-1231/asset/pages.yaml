- pgno: 389
  md: 'In this file let''s create a newTestDB() helper function which:


    +   * Creates a new *sql.DB connection pool for the test database;

    +   * Executes the setup.sql script to create the database tables and dummy data;

    +   * Register a ‘cleanup’ function which executes the teardown.sql script and
    closes the connection pool.'
  merge: -1
  img_proc: true
- pgno: 390
  md: "```\nFile: internal/models/testutils_test.go\n\npackage models\n\nimport (\n\
    \t\"database/sql\"\n\t\"os\"\n\t\"testing\"\n)\n\nfunc newTestDB(t *testing.T)\
    \ *sql.DB {\n\t// Establish a sql.DB connection pool for our test database. Because\
    \ our\n\t// setup and teardown scripts contains multiple SQL statements, we need\n\
    \t// to use the \"multiStatements=true\" parameter in our DSN. This instructs\n\
    \t// our MySQL database driver to support executing multiple SQL statements\n\t\
    // in one db.Exec() call.\n\tdb, err := sql.Open(\"mysql\", \"test_web:pass@/test_snippetbox?parseTime=true&multiStatements=true\"\
    )\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\n\t// Read the setup SQL script\
    \ from the file and execute the statements, closing\n\t// the connection pool\
    \ and calling t.Fatal() in the event of an error.\n\tscript, err := os.ReadFile(\"\
    ./testdata/setup.sql\")\n\tif err != nil {\n\t\tdb.Close()\n\t\tt.Fatal(err)\n\
    \t}\n\n\t_, err = db.Exec(string(script))\n\tif err != nil {\n\t\tdb.Close()\n\
    \t\tt.Fatal(err)\n\t}\n\n\t// Use t.Cleanup() to register a function *which will\
    \ automatically be\n\t// called by Go when the current test (or sub-test) which\
    \ calls newTestDB()\n\t// has finished*. In this function we read and execute\
    \ the teardown script,\n\t// and close the database connection pool.\n\tt.Cleanup(func()\
    \ {\n\t\tdefer db.Close()\n\n\t\tscript, err := os.ReadFile(\"./testdata/teardown.sql\"\
    )\n\t\tif err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\n\t\t_, err = db.Exec(string(script))\n\
    \t\tif err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t})\n\n\t// Return the database\
    \ connection pool.\n\treturn db\n}\n```\n\n# The important thing to take away\
    \ here is this:\n\n*Whenever we call this `newTestDB()` function inside a test\
    \ (or sub-test) it will run the setup script against the test database. And when\
    \ the test or sub-test finishes, the cleanup function will automatically be executed\
    \ and the teardown script will be run.*"
  merge: -1
  img_proc: true
