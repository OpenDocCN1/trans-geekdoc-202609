    +   5. Proximity sensor: A proximity sensor can detect the presence of an object
    without any contact point. The working principle is electromagnetic waves that
    are emitted by the sensor and return when the object is in range of the waves.
    The presence of the object is detected with the change in filed radiation. The
    proximity sensors working of different types, like inductive, capacitive, photoelectric
    sensor, ultrasonic, and Hall-effect.


    Inductive proximity sensor: This type of sensor has an oscillator as an input,
    which changes the loss resistance by the proximity of an electrically conductive
    medium. For metal detection, these types of sensors are used.


    Capacitive proximity sensor: This type of sensor converts capacitance by changing
    electrode displacement. It can be done by bringing the object within the variable
    frequencies. The object is detected with the help of the oscillating frequency,
    which is converted into a DC voltage. This current is compared with a fixed value
    to detect the object. For plastic targets, these types of sensors are used.


    +   6. Ultrasonic sensor: An ultrasonic sensor is used to detect the distance
    of an object. The working principle is the time duration between the emission
    and receiving of the waves after reflecting from the object. Ultrasonic sensors
    use sound waves to measure the distance of an object.'
