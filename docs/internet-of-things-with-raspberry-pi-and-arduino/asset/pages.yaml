    # 10.4 Landslide Detection and Disaster Management System


    Landslides are common in the rainy season in the hilly areas of India. By predicting
    landslides, many human lives can be saved. Natural disasters like landslides and
    flooding are caused by global warming, which may result in human and economic
    losses. A system for landslide detection and disaster management detects the presence
    of human in the affected area. A buzzer is used to alert for the presence of human,
    is also a part of the system. Human presence can be detected with a PIR sensor
    and a camera. The complete system is comprised of a Raspberry Pi, a Pi camera,
    a PIR (motion detector) sensor, a BMP180 (pressure sensor), and DHT11 (temperature
    and humidity sensor), a rain sensor, an accelerometer (tilt sensor), a buzzer,
