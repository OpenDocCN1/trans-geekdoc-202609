  md: '# 9.4 Plotting Random Numbers Using Matplotlib


    The installation of matplotlib is an easy process on Ubuntu by a simple command:


    ```

    $ sudo apt-get install python-matplotlib

    ```


    Click on “yes” when prompted to install dependencies. The matplotlib library provides
    the plot() method to create line charts. The plot() method takes a list or array
    data structure made up of integer or floating point numbers as input. Plot() uses
    values for the x-axis and y-axis, if two arrays are given as inputs. If only one
    list or array is provided as input, plot() assumes the values for the y-axis and
    autogenerates the incremental values for the x-axis:


    ```

    pyplot.plot(x, y)

    ```


    To change the style of line and makers with different colors, the plot() method
    can be used, e.g., for the solid line style command:


    ```

    pyplot.plot(x, y, ''-'')

    ```


    Figure 9.2 shows the plotting of the random number.


    ![](img/526b5ff9486ff530988203e0cd92330a_167_0.png)


    FIGURE 9.2

    Plotting the random number.'
