    # 9.5 Plotting Real-Time from Arduino


    The real-time data plotting from Arduino is an important task where sensory data
    is critical. To understand the concept, real-time POT values are discussed in
    this section. The system is comprised of Raspberry Pi, Arduino, a POT, and a power
    supply. Arduino is connected to +5 V, the other to the ground, through USB. One
    terminal of the POT is connected to +5 V, the other to the ground, and the wiper
    is connected to pin (A0) of Arduino (Figure 9.3). To plot the real-time data,
    move the knob of the POT and check the results.


    The real-time plotting can be achieved by using a combination of the pyplot functions
    ion(), draw(), set_xdata(), and set_data(). The ion() method is used to initialize
    the interactive mode of plot. This helps to dynamically change the x and y values
    of the plots in the figure:


    ```

    pyplot.ion()

    ```


    Once the interactive mode is set, the plot will be drawn by calling the draw()
    method. Now, initialize the plot with a set of blank data, 0, in this case:


    ```

    pData = [0] * 25

    ```


    In this array for y values, pData, is used to append values from the sensor in
    the while loop to keep appending the newest values to this data array and redraws
    the plot with these updated arrays for the x and y values.


    ```

    pData.append(float(a0.read()))

    pData()

    ```'
