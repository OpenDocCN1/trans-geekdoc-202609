    \ |\n| w+ | This mode opens a file to read and write both. It overwrites an existing\
    \ file. |\n| R | This mode opens a file only to read. |\n| r+ | This mode opens\
    \ a file for appending and read both. |\n| A | This mode opens a file for appending,\
    \ starting from end of the document. |\n| a+ | This mode opens a file for appending\
    \ and reading, starting from end of the document. |\n\n```\n'Hello World!\\nPython\
