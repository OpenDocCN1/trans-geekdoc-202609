- pgno: 11
  md: '# Preface


    The Internet of Things provides direct integration of the physical world with
    computer-based systems, which results in economic benefits, efficiency improvements,
    and reduced human exertedions.


    The primary objective of writing this book is to provide a platform to the readers
    to get started with the Internet of Things with Raspberry Pi and Arduino along
    with the basic knowledge of programming and interfacing of the input/output devices.


    The book provides a gradual pace of basic to advanced interfacing and programming
    of Arduino and Raspberry Pi. It is comprised of 4 sections and 12 chapters with
    a few case studies to make the concept clear and test its feasibility in solutions
    to real-time problems.


    This book is entirely based on the practical experience of the authors while undergoing
    projects with students and industries.'
  merge: -1
  img_proc: true
