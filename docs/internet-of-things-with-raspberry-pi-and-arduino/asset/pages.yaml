    # 7.3 Play with LED


    The objective of the project is to control the Arduino digital output through
    Raspberry Pi with Python. To build this project, connect an LED to a digital pin
    of Arduino and write a short Python program to make it blink. Figure 7.1 shows
    the circuit diagram for the interfacing of an LED. The system is composed of Raspberry
    Pi3, an Arduino Uno, a power supply, and two LEDs connected to Pin6 and Pin7 of
    Arduino. The program is written to make LEDs blink after some time delay.


