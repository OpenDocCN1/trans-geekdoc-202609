    # 2.1 Sensors Classification


    Sensors are classified as follows:


    +   1. Primary input quantity

    2. Transduction principles

    3. Technology and material

    4. Property

    5. Application


    Classification of sensors can also be done on the basis of different areas:


    +   1. Classification based on application: Sensors are chosen on the basis of
    application where they need to be implemented, such as industrial process control,
    measurement and automation, automobiles, consumer electronics, aircraft, and medical
    products. As with the change in application, the selection criteria changes, so
    the application needs to be considered.

    2. Classification based on power or energy supply requirement

    Active sensor: Active sensors are those where a power supply is required to measure
    the physical quantity, e.g., temperature sensor, ultrasonic sensor, and light-dependent
    resistor (LDR).

    Passive sensor: Sensors that do not need a power supply are called passive sensors,
    and they measure the parameters, e.g., radiometers film photography.

    3. Classification based on output of sensor

    Digital sensor: The output of sensor is in binary or digital form, which can be
    directly processed through a controller or processor.

    Analog sensors: The output of the sensor is in the form of a continuous signal.
    An analog-to-digital converter is required to read the sensor by microcontroller
    or processor.


