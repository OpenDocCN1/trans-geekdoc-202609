    with making the LED "ON." The system is made ON/OFF with Tkinter GUI. The status
    of sensors prints on the Python prompt. The system is comprised of a Raspberry
    Pi, an Arduino, two LEDs, a PIR sensor, and a power supply. Arduino is connected
    to Raspberry Pi through a USB. The anode terminal of LED1 and LED2 are connected
    to pin (7) and pin(6) of Arduino, respectively. the pin (OUT) of the PIR sensor
    is connected to pin (8) of Arduino, and pin (Vcc) and pin (GND) are connected
    to +5 V DC and ground, respectively (Figure 8.12).


