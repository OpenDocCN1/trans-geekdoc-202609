    FIGURE 5.35

    Ultrasonic sensor.


    and GND. The ultrasonic transmitter in the sensor generates a 40 KHz ultrasonic,
    which propagates in the air and reflects back if any obstacle occurs in its path.
    The distance is calculated on the basis of a time interval between the transmitted
    signal and receiving it back to echo of the sensor. To generate the ultrasonic
    signal trigger, the pin needs to hold “HIGH” for a minimum duration of 10 µS.
    Figure 5.35 shows the ultrasonic sensor.


    For example, the time for ECHO is HIGH 588 µS, then the distance can be calculated
    with the help of the speed of sound, which is equal to 340 m/s.


    Distance = Velocity of Sound/ (Time/2)


    = 340 m/s / (588 µS/2) = 10 cm.


    This formula needs to be used in the program to calculate the distance.

    To understand the working of the ultrasonic sensor, a simple circuit can be designed.
    It is comprised of a Raspberry Pi, a power supply, an ultrasonic sensor, and an
    LCD. Connect the components as follows:


