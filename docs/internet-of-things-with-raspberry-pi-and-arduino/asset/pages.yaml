- pgno: 47
  md: '# #4 Basics of Arduino


    # ## 4.1 Introduction to Arduino


    Arduino was invented at the Ivrea Interaction Design Institute. It was designed
    for fast prototyping, targeting the hobbyist without any programming background.
    Soon the user-friendly platform attracted an audience covering a wider community
    and started to adapt the latest trends in the market, from an 8-bit board to IoT
    products, wearable devices, and an embedded environment. Arduino boards are completely
    open source and can be used for application development with particular requirements.
    The Arduino software is user-friendly and easy to begin with a flexible environment
    for advanced users. It can operate on Mac, Linux, and Windows platforms. New things
    can be learned with Arduino.


    # ### Advantages of Arduino:


    +   **Cost:** Arduino boards are less expensive compared to other micro-controller
    boards.


    +   **Platform:** The Arduino Software (IDE) is compatible with most of the operating
    systems like Macintosh OSX, Windows, and Linux.


    +   **User friendly:** The Arduino Software (IDE) is user-friendly, easy to begin,
    and has flexibility for the skilled programmers.


    +   **Open source:** The Arduino is an open-source software that can be programmed
    with C, C++, or AVR-C languages. So a variety of modules can be designed by users.


    # ## 4.1.1 Arduino Uno


    The Arduino/Genu Uno has an onboard ATmega328 microcontroller. It has 6 analog
    input ports (A0–A5) and 14 digital I/O ports, out of which 6 are PWM pins. Each
    pin can operate on 0–5 V of voltage. It operates at 16 MHz of frequency. Figure
    4.1 shows the Arduino Uno board (Table 4).'
  merge: -1
  img_proc: true
