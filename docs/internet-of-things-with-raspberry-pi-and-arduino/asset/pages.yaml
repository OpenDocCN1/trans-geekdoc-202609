  md: '# 5.18 Interfacing of DC Motor with Raspberry Pi


    A DC motor converts electrical energy into mechanical energy. When the electric
    current passes through a coil in a magnetic field, a magnetic force is generated
    to produce a torque in the DC motor. To understand the interfacing of the DC motor
    with Raspberry Pi, a simple circuit can be considered for making the motor move
    in ''clockwise'' and ''anticlockwise'' directions. The circuit is comprised of
    Raspberry Pi, motor driver L293D, two DC motors, and a power supply. Make the
    component connections as shown in Figure 5.27.


    +   Connections:\n* Connect pin2 (IN1) of L293D to GPIO26 of Raspberry Pi.

    * Connect pin7 (IN2) of L293D to GPIO19 of Raspberry Pi.

    * Connect pin10 (IN3) of L293D to GPIO13 of Raspberry Pi.

    * Connect pin15 (IN4) of L293D to GPIO6 of Raspberry Pi.

    * Connect pin3 (OUT1) of L293D to one terminal of motor1.

    * Connect pin6 (OUT2) of L293D to another terminal of motor1.


    ![](img/526b5ff9486ff530988203e0cd92330a_90_0.png)


    FIGURE 5.27

    Circuit diagram for interfacing of DC motors with Raspberry Pi.'
