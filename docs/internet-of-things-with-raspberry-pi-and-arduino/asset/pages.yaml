  md: '# 8 Python GUI with Tkinter and Arduino


    #  8.1 Tkinter for GUI Design


    The basic features for graphical user interface (GUI) libraries include the easy
    to install and minimal computations. Tkinter framework satisfies the basic requirements.
    It is also the default GUI library with the Python installations. Tkinter interface
    is a cross-platform Python interface for the Tk GUI toolkit. Tkinter provides
    a layer on Python while Tk provides the graphical widgets. Tkinter is a cross-platform
    library that gets deployed as a part of the Python installation packages for many
    operating systems.

    Tkinter is designed with minimal programming efforts for creating graphical applications.
    To test the version of the Tk toolkit, use the following commands on the Python
    prompt:


    ```

    >>> import Tkinter

    >>> Tkinter._test()

    ```


    An image with the version information will be prompted (Figure 8.1).\ If the window
    (Figure 8.1) is not visible, then reinstall Python.

    The Tk interface supports various widgets to develop GUI. Table 8.1 describes
    the few widgets.


    #  8.2 LED Blink


    To understand the working of LED with Tkinter GUI, a simple circuit is designed.
    The system is comprised of a Raspberry Pi, an Arduino, an LED, and a power supply.
    An Arduino is connected to Raspberry Pi through a USB connector. The anode terminal
    of LED is connected to pin(7) of Arduino through a 10-K resistor, and the cathode
    terminal is connected to the ground.

    Figure 8.2 shows the circuit diagram to interface LED.'
