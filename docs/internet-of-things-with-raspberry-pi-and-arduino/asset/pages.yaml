  md: '# 5.19.1 Adafruit Library for LCD


    Execute the commands in the Raspberry Pi terminal to install and update the libraries.


    +   1. sudo apt-get update

    2. sudo apt-get install build-essential python-dev python-smbus python-pip git

    3. sudo pip install RPi. GPIO


    Ignore the warnings about any dependencies. Adafruit provides a library to operate
    LCD in the 4-bit mode.


    # Steps to install library on Raspberry Pi:


    +   **Step 1:** Install Git on Raspberry Pi by using the command: sudo apt-get
    install git.

    **Git** helps clone the project files on github and use it on Raspberry Pi.

    **Step 2:** To make a clone of the project file on Pi, execute the command: sudo
    clone git://github.com/adafruit/Adafruit_Python_CharLCD

    **Step 3:** Change the directory line with the command: `cd Adafruit_Python_CharLCD`

    **Step 4:** Open the directory. There will be a file named setup.py. Install it
    by using the command: `sudo python setup.py install`


