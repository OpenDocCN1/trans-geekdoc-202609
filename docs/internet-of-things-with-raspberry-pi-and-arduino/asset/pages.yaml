- pgno: 15
  md: '# Authors


    Dr. Rajesh Singh is currently associated with Lovely Professional University as
    a professor with more than 15 years of experience in academics. He has received
    a gold medal in MTech and honors in his BE degree. Areas of expertise include
    embedded systems, robotics, wireless sensor networks, and Internet of Things.
    He has organized and conducted a number of workshops, summer internships, and
    expert lectures for students. He has 23 patents in his account.


    He has published approximately 100 research papers in referred journals/conferences.
    He has been invited as the session chair and keynote speaker to international/national
    conferences and faculty development programs.


    Under his mentorship, students have participated in national/international competitions
    including a Texas competition in Delhi and a Laureate Award of Excellence in robotics
    engineering in Spain. Twice in the last four years has been awarded the Certificate
    of Appreciation and the Best Researcher Award 2017 from University of Petroleum
    and Energy Studies for projects submitted to the Texas Instruments Innovation
    Challenge Design Contest from Texas Instruments in 2015. He has been honored with
    the Certificate of Appreciation from Rashtryapati Bhawan for a mentoring project
    through the Gandhan Technological Innovation Award 2018. He has been awarded the
    Young Investigator Award at the International Conference on Science and Information
    in 2012. He has published 15 books in the areas of embedded systems and Internet
    of Things with reputed publishers like CRC/Taylor & Francis, Bentham Science,
    Narosa, GBS, IRP, NIPA, River Publisher, and RI Publications. He is editor to
    a special issue published with Intelligent Communication, Control and Devices,
    2017–2018.


    Dr. Anita Geholt is currently associated with Lovely Professional University as
    an associate professor with more than 10 years of experience in academics. She
    has 20 patents in her account. She has published more than 50 research papers
    in referred journals and conferences. She has organized a number of workshops,
    summer internships, and expert lectures for students. She has been invited as
    session chair and keynote speaker to international/national conferences and faculty
    development programs.'
  merge: -1
  img_proc: true
