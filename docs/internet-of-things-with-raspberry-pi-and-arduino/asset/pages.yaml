    # 3.2 Challenges in IoT Design


    IoT is a combination of many domains at a single platform, so the designing of
    an IoT system is quite challenging. The data security of customers is a big challenge
    for the service providers. If an IoT device suffers from problems due to a poor
    network, the purpose of deploying IoT is futile. It will be even a bigger issue
    when a large number of devices are connected. Heterogeneity of the network has
    different challenges with respect to security, privacy, and functionality.

    A few of the challenges of IoT design are as follows:


    +   1. Availability: Availability is the consistency of the network, even in case
    of attacks. As IoT services need to be real time, security with availability is
    the prime concern.

    2. Authenticity: It is the process where users need to prove the identity to access
    the services. It is required for the protection of the system. It is required
    to avoid illegal access of services.

    3. Confidentiality: For data confidentiality, only an authorized person can access
    or modify the data.

    4. Integrity: The data received by the user is undamaged, unmodified, and original
    as sent by the sender; this assurance is provided by integrity.

    5. Nonrepudiation: It is the assurance of sending the correct information by end
    node without denying the sharing of data at any time and the acknowledgment from
    the receiver for the same.


    # 3.3 IoT System Management


    According to a study by International data corporation (IDC), the number of devices
    connected to the internet is expected to reach 30 billion by 2020. Management
    is the most important part of any system. The IoT system management includes the
    device deployment, provision of the device and'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# IoT Design Methodology


    authentication, configuration and control, monitoring, diagnostic, and then software
    updates and maintenance. IoT is not only about deploying the sensors and capturing
    the data to communicate to the server, once the system is established, there may
    be a requirement of software updates, and repairing and replacing the faulty devices
    along with the security of data.


    Provisioning and authentication: Authentication is a process of establishing the
    identity to ensure the security and trust. A cloud-hosted service is required
    to be implemented to check the authenticity of the software and hardware connected
    to the network.


    Provisioning is a method to provide access of a device to a system with suitable
    authentication.


    Configuration and control: Configuring a system means arrangement of parts in
    a specific form, figure, or combination of elements. Configuring an IoT device
    includes attributes, such as name, location, and specific settings for application.


    IoT devices need to be configured and authenticated from user attributes to make
    it reliable. The control is capability of handling the device and help for configuration
    changes.


    Monitoring and diagnostics: Monitoring is the process of observing the progress
    of a system over a time period. The IoT system is connected with thousands of
    remote devices over the internet, and a small mistake in data monitoring may cause
    loss of trust of the customer. Even small issues need to be addressed with appropriate
    diagnosis of the problem. For troubleshooting, the developers need to implement
    a good program and must be capable of updating through cloud analytics.


    Software maintenance and update: Software maintenance is another task in IoT that
    needs to support firmware, which should be free from any bugs. However, updating
    firmware is another important concern. The developer must have secure updated
    software, including the boot loaders.


    Software maintenance on remote devices is a long-term process. A persistent and
    reliable connection is required with remote devices for maintenance and updating.
    This is a complicated process and needs to be performed when there is minimum
    impact on the business.


    # 3.4 IoT Servers


    Many cloud providers are in the market, which provides suitable IoT-based services
    for specific applications.'
  merge: -1
  img_proc: true
