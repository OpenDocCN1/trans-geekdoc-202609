    # 5.5 Installation of Libraries on Raspberry Pi


    ```

    $ sudo apt-get install libblas-dev

    $ sudo apt-get install liblapack-dev

    $ sudo apt-get install gfortran

    $ sudo apt-get install python-setuptools

    $ sudoeasy_installscipy

    $ # ## previous might also work: python-scipy without dependencies

    $ sudo apt-get install python-matplotlib

    ```


    # 5.6 Getting the Static IP Address of Raspberry Pi


    Raspberry Pi gives a different IP address. Each time it gets “ON,” this IP is
    known as current IP address. So each time, user needs to check for its IP. To
    avoid this problem, a static IP address needs to be created, which will not change
    in turning “OFF” the device.


    Steps to create a static IP address:


    +   1. Open the terminal window (Figure 5.9).

    2. At the command line, write the command “ifconfig” (Figure 5.10). This command
    gives network-related information. The Figure 5.10 highlighted block shows the
    current IP address; here it is 192.168.0.16. Note this IP address, as this will
    be required later.

    3. Open the configuration file.\ Now open the configuration file where a static
    IP address can be configured. The filename is dhcpcd.conf, and it is stored in
    the folder named etc. To make any change, use the nano editor in the terminal
    window with the help of the command: “sudano /etc/dhcpcd.conf” (Figure 5.11).
    After this command, a window will open (Figure 5.12).

    In the screen, Figure 5.12, scroll down until you see: “# Example static IP configuration”
    (Figure 5.13).'
