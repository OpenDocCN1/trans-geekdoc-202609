- pgno: 117
  md: "# # 6\n\n# ## Raspberry Pi and Arduino\n\n# ### 6.1 Install Arduino IDE on\
    \ Raspberry Pi\n\nThe limitation with Raspberry Pi is the absence of analog ports\
    \ onboard, which makes it inappropriate for the systems where analog sensors need\
    \ to be read. To overcome this limitation, the Arduino integrated development\
    \ environment (IDE) can be installed on Raspberry Pi, as Arduino has analog ports\
    \ so these ports can be used to interface analog sensors. Installing Arduino IDE\
    \ on Raspberry Pi is an easy process with simple steps. The Arduino IDE is available\
    \ for most of the operating systems, but here we will see how to install it on\
    \ a Raspberry Pi3 model B with running Raspian Jessie in the graphical interface\
    \ (GUI).\n\n+   - The first requirement is an active internet connection.\n- A\
    \ screen, keyboard, and mouse need to be connected with Raspberry Pi.\n- Install\
    \ the latest version of Arduino IDE using apt:\n  `sudo apt-get update & sudo\
    \ apt-get upgrade`n  `sudo apt-get install arduino`\n- Connect an Arduino board\
    \ to the Raspberry Pi using the appropriate cable and pull the Raspian Menu and\
    \ select Arduino IDE under the “Electronics” head. A blank window will open. Figure\
    \ 6.1 shows the blank window for Arduino IDE.\n- Click on Tools > Board > select\
    \ the appropriate board of Arduino.\n- To select the port of the Arduino that\
    \ is connected, check the serial port under the “Tools” menu. The port name of\
    \ Arduino is: /dev/ttyUSB0 or /dev/ttyACM0."
  merge: -1
  img_proc: true
