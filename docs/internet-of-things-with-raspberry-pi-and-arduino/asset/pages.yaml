  md: '# # 9n Data Acquisition with Python and Tkinter


    # ## 9.1 Basics


    **The `open() ` method:** This function is a most commonly used method that is
    available in Python, and it is used to manipulate files.

    To open a file command:

    `>>> f = open(''test.txt'', ''w'')`


    This command creates a test.txt file in the same folder in which the Python interpreter
    is saved or the location from where the code is being executed.

    The modes that can be used with the `open()` function are discussed in Table 9.1.


    **The `write() ` method:** Once the file is open in the writing mode, the `write()`
    method is used to start writing to the file object. The `write()` method takes
    input argument only in the format of a string.

    `>>>f.write(''Hello World!\n'')`

    Here ''Hello World'' is a string, and \n means a new line character.

    To write a sequence of strings, the `writelines()` method is used:

    `>>> sq = ["Python programming for Arduino\n", "Bye\n"]`

    `>>>f.writelines(sq)`


    **The `close() ` method:** The `close()` method is used to close the file, and
    the file object can''t be used again. The command:

    `>>>f.close()`


    **The `read() ` method:** The `read()` method reads the data of a file. This method
    opens the file with any of the reading compatible modes like: w+, r, r+, or a+:

    `>>>D = open(''test.txt'', ''r'')`

    `>>>D.read()`'
