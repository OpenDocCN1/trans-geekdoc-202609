  md: "# 5.18.2  Recipe to Control One Motor Using Function\n\n```\nimport RPi.GPIO\
    \ as MAHI\nimport time as wait\n# Pins for Motor Driver Inputs\nM11 = 26 #assign\
    \ variable to GPIO26\nM12= 19 #assign variable to GPIO19\ndef setup():\n    MAHL.setmode(MAHL.BCM)\
    \ # choose BCM mode\n    MAHL.setup(M11,MAHL.OUT) # make M11 as output\n    MAHL.setup(M12,MAHL.OUT)\
    \ # make M12 as output\n    MAHL.setup(M1E,MAHL.OUT) # make M1E as output\n\n\
    def loop():\n    # forward movement\n    MAHL.output(M11,MAHL.HIGH) # set M11\
    \ to HIGH\n    GPIO.output(M12,MAHL.LOW) # set M12 to LOW\n    GPIO.output(M1E,MAHL.HIGH)\
    \ # set M1E to HIGH\n    wait.sleep(5) // delay of 5 Sec\n    # reverse movement\n\
    \    MAHL.output(M11,MAHL.LOW) # set M11 to LOW\n    MAHL.output(M12,MAHL.HIGH)\
    \ # set M12 to HIGH\n    MAHL.output(M1E,MAHL.HIGH) # set M1E to HIGH\n    wait.sleep(5)\
    \ // delay of 5 Sec\n    # stop movement\n    MAHL.output(M1E,MAHL.LOW) # set\
    \ M1E to LOW\n\ndef destroy():\n    MAHL.cleanup() # clean GPIOs\nif __name__\
    \ == '__main__': # Program start from here\n    setup()\ntntry:\n    loop()\n\
    except KeyboardInterrupt:\n    destroy() # stop the execution\n```"
