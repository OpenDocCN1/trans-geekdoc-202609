  md: '# Blink Application with Raspberry Pi


    ![](img/526b5ff9486ff530988203e0cd92330a_199_0.png)


    **11.7**


    Circuit diagram for home appliance control.


    # Connections:


    +   - Connect the base of the first transistor 2N2222 to GPIO21 through a resistor
    and emitter to the ground.

    - Connect the base of the second transistor 2N2222 to GPIO20 through a resistor
    and emitter to the ground.

    - Connect the collector of transistor to “L2” of relay.

    - Connect the positive terminal of +12V battery to “L1” of relay.

    - Connect a diode 1N4007 across “L1” and “L2.”

    - Connect one terminal of AC to “common” of the relay and the other to to one
    of the terminal of AC to the load (bulb).

    - Connect the other terminal of the AC load to the “NO” terminal of the relay.'
