- pgno: 21
  md: '# # 1 Introduction to Internet of Things


    # ## 1.1 Characteristics of IoT


    Internet of Things (IoT) can be used to design products for businesses. It facilities
    to add the valuable feature to the businesses, where the IoT framework is designed
    to connect the information from devices which are interconnected. The process
    has been classified into five phases. The first phase is “create phase,” where
    sensors collect the data from the environment. This data can generate the information
    for the business. Second is “communicate phase,” where generated data are communicated
    to the required destination. Third is the “aggregate phase,” where collected data
    over the network are aggregated by the device itself. Fourth is “analyse phase,”
    where aggregated data are used to generate patterns and use it to control and
    optimize the process. Fifth is the “act phase,” where necessary actions are taken
    on the basis of information extracted from the aggregated data.


    The characteristics of IoT may vary from one domain to another. A few characteristics
    are listed as follows:


