    connectivity contributes to the collective intelligence of the system. It enables
    network accessibility and compatibility of the objects. New opportunities could
    be generated in the recent market by connecting smart devices by the networking.

    3. **Dynamic nature**: IoT is dynamic in nature, as it is capable of collecting
    data from devices, which may change dynamically, for example, a change in temperature
    or speed.'
