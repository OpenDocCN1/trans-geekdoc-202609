- pgno: 135
  md: "# Python and Arduino with Pyfmata\n\n# 7.3.1 Recipe\n\nimport pyfmata # import\
    \ lib of pyfmata\nimport time as wait # import lib of pyfmata\nboard = pyfmata.Arduino('/dev/ttyUSB0')#\
    \ define COM port of Arduino\nred_pin = board.pin(d:7)# assign digital pin 7 as\
    \ an output\ngreen_pin = board.pin(d:6o)# assign digital pin 6 as an output\n\n\
    ```\nwhile True:\n    infinite loop\n        red_pin.write(1)## write 'I' on pin\
    \ 7\n        green_pin.write(1)## write 'I' on pin 6\n        wait.sleep(0.5)#\
    \ delay of 0.5 Sec\n        red_pin.write(0)## write 'O' on pin 7\n        green_pin.write(0)##\
    \ write 'O' on pin 6\n        wait.sleep(0.5)# delay of 0.5 Sec\n```\n\n# 7.4\
    \ Reading an Arduino Digital Input with Pyfmata\n\nThe objective is to read the\
    \ digital pins of Arduino on a Raspberry Pi by Python. Pyfmata is used to read\
    \ a digital input on Arduino. The components required for the recipe are Arduino\
    \ Uno, 1 kΩ resistor, and a push switch or button (as sensor). Switch can be connected\
    \ in two arrangements: pull down and pull up. The output of a digital pin of Arduino\
    \ is normally “LOW,” and digital sensors are available in two configurations for\
    \ output: active “LOW” and active “HIGH.” The pull-down arrangement is used where\
    \ digital pin normally “LOW,” and on reading it gets “HIGH.” This is used for\
    \ the sensor that has the active “HIGH” on occurrence of an event; otherwise,\
    \ the output is “LOW.” The pull-up arrangement is for the sensor that has a normal\
    \ output as “HIGH,” and on occurrence of an event gets “LOW.” The digital pin\
    \ needs to be activated as “HIGH” in the program so that it can read the sensor.\
    \ Figure 7.2 shows circuit diagram for pull down, and Figure 7.3 shows circuit\
    \ diagram for pull up.\n\nAs discussed in Section II of this, the Pyfmata protocol\
    \ is used to read the input pin of Arduino by Raspberry Pi. It uses the concept\
    \ of an iterator to monitor the Arduino pin. The iterator manages the reading\
    \ of the switch using the following commands:\n\n```\nit = pyfmata.util. Iterator(board)\n\
    it.start()\n```"
  merge: -1
  img_proc: true
