    # 11.2 Creating New Project with Blynkk


    Blynk application is available for Android and IOS both.


    Steps to create Blynk project


    +   1. Download Blynk for Android or iOS, as per the requirement, and create a
    new account (Figure 11.2).

    2. Create a new project by providing a name, controller/processor, and internet
    connection to it (Figure 11.3). The background of the app can also be selected
    as dark or light.

    3. The Auth token will be sent to the email address. This Auth token will be used
    for connecting Raspberry Pi to the new project.

    4. Open the blank project and add widgets as required for the project (Figure
    11.4). For a simple project of making a LED by clicking on it. Select a digit
    of Raspberry Pi to which LED is connected. Here GPIO21 is used to connect LED.
    Figure 11.5 shows the button for LED.

    5. Add one more LED connected to GPIO20. Now two LEDs can be controlled through
    the designed app (Figure 11.6).

    6. Connect Raspberry Pi to the Blynk widget by running the Auth token command
    and check the workings.'
