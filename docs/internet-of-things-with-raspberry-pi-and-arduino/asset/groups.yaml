    a transistor 2N2222 (as a switch), and a power supply. Connect the components
    as shown in Figure 11.7 and follow the steps mentioned in Section 11.2 to control
    two LEDs, as the same project will work to control two relays.


    ## Blynk Application with Raspberry Pi


    ![](img/526b5ff9486ff530988203e0cd92330a_199_0.png)


    **11.7**


    Circuit diagram for home appliance control.


    Connections:


    - Connect the base of the first transistor 2N2222 to GPIO21 through a resistor
    and emitter to the ground.

    - Connect the base of the second transistor 2N2222 to GPIO20 through a resistor
    and emitter to the ground.

    - Connect the collector of transistor to “L2” of relay.

    - Connect the positive terminal of +12V battery to “L1” of relay.

    - Connect a diode 1N4007 across “L1” and “L2.”

    - Connect one terminal of AC to “common” of the relay and the other to one of
    the terminal of AC to the load (bulb).

    - Connect the other terminal of the AC load to the “NO” terminal of the relay.


    ![](img/526b5ff9486ff530988203e0cd92330a_200_0.png)


    ## 12 Cayenne-Application with Raspberry Pi


    ### 12.1 Introduction to Cayenne


    Cayenne has a customizable dashboard with drag-and-drop widgets. It is easy to
    set up Cayenne, as it connects with Pi easily. In Cayenne, sensors, motors, actuators,
    GPIO boards, and more can be added. It is used to control the devices remotely.
    It has four components: Cayenne-agent software (responsible for communicating
    to the server), cloud (processes and stores the sensory data), online dashboard
    (provides a graphical environment), and Cayenne app for Android and iOS.


    ### 12.1.1 Getting Started with Cayenne


    - 1. Open myDevices on the Cayenne website and create an account by clicking on
    ''Started for Free'' (Figure 12.1).

    - 2. Fill out the registration form and choose a device to work on (Figure 12.2).

    - 3. Download and install myDevices Cayenne on Pi (Figure 12.3), by using:

    ```bash

    wget https://cayenne.mydevices.com/dl/rpi_8bf9u0m7hl.sh

    sudo bash rpi_8bf9u0m7hl.sh -v


    ```

    - 4. Go to the GPIO menu and select as the requirement of the project (Figure
    12.4).


    ## 12.2 BLNK with the Cayenne App


    The simplest way to understand the working with Cayenne app is with LED. The system
    is comprised of a Raspberry Pi, a power supply, and an LED. Connect the LED to
    GPIO7 (Figure 12.5). Follow the steps mentioned in Section 12.1.1 to control.
    Develop a Cayenne App. Go to the GPIO 17 pin, click on “input,” and change it
    to “output.” The status of the LED can be changed by changing the state of the
    button to “HIGH” and “LOW.”


