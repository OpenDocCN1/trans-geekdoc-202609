    | AREF | 模拟输入的参考电压 |\n| Reset | 用于通过板重置微控制器 |\n\n## 4.1.3 Arduino Nano\n\nArduino/Genu\
    \ Nano 内了一个 ATmega328 微控制器。它有 8 个模拟输入、14 个数字 I/O 端口和 6 个 PWM。它具有 32 KB 闪存内存、1\
    \ KB EEPROM、2 KB SRAM，工作频率为 16 MHz。图 4.3 显示了 Arduino Nano（表 4.3 和表 4.4）。\n\n|\
