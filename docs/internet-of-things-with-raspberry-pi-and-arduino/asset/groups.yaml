    \ that we can pause the script later on.\n\nX.setmode(BCM)\n# Pins are referred\
    \ as GPIO numbers, as BCM mode is selected.\n\nX.setwarnings(False)\n# This command\
    \ is not to print GPIO warning messages on the screen.\n```\n\n```python\nX.setup(21,\
    \ X.OUT)\n# Set 21 as output.\n\ntry:\n  while True:\n    X.output(21, True) #\
