    # ## 12.1 Introduction to Cayenne


    Cayenne has a customizable dashboard with drag-and-drop widgets. It is easy to
    set up Cayenne, as it connects with Pi easily. In Cayenne, sensors, motors, actuators,
    GPIO boards, and more can be added. It is used to control the devices remotely.
    It has four components: Cayenne-agent software (responsible for communicating
    to the server), cloud (processes and stores the sensory data), online dashboard
    (provides a graphical environment), and Cayenne app for Android and IOS.


    # ### 12.1.1 Getting Started with Cayenne


    +   1. Open myDevices on the Cayenne website and create an account by clicking
    on ''Started for Free'' (Figure 12.1).

    2. Fill out the registration form and choose a device to work on (Figure 12.2).

    3. Download and install myDevices Cayenne on Pi (Figure 12.3), by using:

    ```bash

    wget https://cayenne.mydevices.com/dl/rpi_8bf9u0m7hl.sh

    sudo bash rpi_8bf9u0m7hl.sh -v

    ```

    4. Go to the GPIO menu and select as the requirement of the project (Figure 12.4).


