    analog amplification, and analog-to-digital converter with the on-chip digital
    intelligence and temperature compensation.


    **Fourth generation:** This generation of sensors had an additional feature of
    memory cell for calibration and temperature compensation, along with the features
    of the third generation.


    **Fifth generation:** This is generation of intelligent sensors with the capability
