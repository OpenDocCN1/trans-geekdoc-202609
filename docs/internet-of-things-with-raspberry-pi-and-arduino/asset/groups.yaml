    # Introduction to Internet of Things


    on the cloud. The system is suitable for a WSN-based solution with big data and
    computationally intensive requirement. An example is forest fire detection. The
    system is comprised of multiple nodes placed at different locations for monitoring
    temperature, humidity, and CO2 levels in the forest.


    Level 6 IoT: A level 6 IoT is comprised of sensor nodes and actuator to perform
    sensing and controlling. It is a suitable cloud-based database designed for data
    analysis. The central controller knows the status of all end nodes and sends the
    control commands to the nodes. An example is a weather monitoring system. The
    system is comprised of multiple nodes that are placed at the different locations
    for monitoring temperature, humidity pressure, radiation, and wind speed. The
    sensor nodes are responsible for transmission of the data from end nodes to the
    destination via websocket. The data is stored on the cloud-based server. The data
    analysis is done on the cloud to make the prediction by aggregating the data.


    # 1.6 IoT vs M2M


    IoT can be defined as a system where multiple objects communicate with each other
    and share data through sensors and digital connectivity. Machine-to-machine (M2M)
    solutions are comprised of linear communication channels between the machines
    to make them work in a cycle. Here, the action of one machine triggers the activity
    of other.


    # Differences between IoT and M2M


    +   A few experts define M2M as a subset of IoT, while others call the Internet
    of Things an evolved version of machine to machine. Either way, the conclusion
    is IoT is a broader area than M2M.


    +   Both the technologies work on the principle of connecting devices and make
    them to work together. While M2M relies on conventional connection tools like
    Wi-Fi, IoT has much flexibility and varied connectivity options.


    +   M2M solution has very limited scope and is confined to create a network of
    machines that work in synchronization. IoT creates 360° solutions for flexible
    responses and multi-level communication.


    +   The advantage of IoT over M2M is its ability to add interactivity amongst
    devices. Machine to operate by triggering responses based on an action. It is
    a one-way communication. IoT-based systems, communication flows to and fro freely.'
