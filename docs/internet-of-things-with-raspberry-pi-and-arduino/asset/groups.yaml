    \ “sudo nano /etc/modprobe.d/raspi-black.conf” and add a “#” to “blacklist spi-bcm2808,”\
    \ which will become “#blacklist spi-bcm2808.”\n- 2. The SPI feature of Raspberry\
    \ Pi is supported by a Python library, which carries out SPI communication with\
    \ a Python program. To install it, install Git and then issue the following commands:\n\
    ```bash\n$ cd\n$ sudo apt-get install python-dev\n$ git clone https://github.com/doceme/py-spidev\n\
    $ cd py-spidev\n$ sudo python setup.py install\n```\n- 3. Reboot the Pi, and it\
    \ is ready for SPI.\n\n## 5.13 Programming a Raspberry Pi\n\nTo program a Raspberry\
    \ Pi, the pin mode can be defined in two methods, BCM and BOARD. BCM stands for\
    \ Broadcom SOC channel, and BCM refers to the GPIO number (i.e., GPIO21, GPIO22,\
    \ etc.). BOARD refers to the pin number of the Pi board.\n\nCommands:\n```python\n\
    import RPi.GPIO as X\n\n# This is to access GPIO pins of Raspberry Pi as the name\
