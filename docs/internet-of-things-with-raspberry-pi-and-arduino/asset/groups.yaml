    液晶显示器（LCD）是一种常用的显示模块。电路中使用了 16 × 2 的 LCD 作为显示设备。相比于数码显示器，该模块更受欢迎，因为它在显示特殊字符、甚至是自定义字符时没有限制，而且价格便宜。\n\
    \n16 × 2 LCD 每行可以显示 16 个字符，共 2 行。在这一 LCD 中，5 x 4 像素矩阵显示两个寄存器，即数据寄存器和命令寄存器。图 4.12\
    \ 显示了 16 x 2 LCD。\n\n20 x 4 LCD 有 4 行，每行可以显示 20 个字符。使用 5 x 4 像素矩阵显示字符。引脚描述与 LCD\
    \ (16 × 2) 相同。图 4.13 显示了 20 x 4 LCD（表 4.5）。\n\n![](img/526b5ff9486ff530988203e0cd92330a_58_0.png)\n\
    \n图 4.12 液晶显示器 (16 × 2)。\n\n![](img/526b5ff9486ff530988203e0cd92330a_59_0.png)\n\
    \n图 4.13 液晶显示器 (20 × 4)。\n\n### 表 4.5\n\n| 引脚 | 描述 |\n| :--- | :--- |\n| 引脚 (1)\
    \ Ground | 接地 (0 V) |\n| 引脚 (2) Vcc | 电源 (5 V) |\n| 引脚 (3) VE | 使用可变电阻调整对比度 |\n\
    | 引脚 (4) 寄存器选择 | 低电平时选择命令寄存器，高电平时选择数据寄存器 |\n| 引脚 (5) 读/写 | 高电时读取或写入写入寄存器 |\n|\
    \ 引脚 (6) 使能 | 当给出一个高电脉冲时，向数据线发送数据 |\n| 引脚 (7) DB0 | |\n| 引脚 (8) DB1 | |\n| 引脚\
    \ (9) DB2 | 8 位数据线 |\n| 引脚 (10) DB3 | |\n| 引脚 (11) DB4 | |\n| 引脚 (12) DB5 | |\n\
    | 引脚 (13) DB6 | |\n| 引脚 (14) DB7 | |\n| 引脚 (15) LED+ | 背光 Vcc (5 V) |\n| 引脚 (16)\
    \ LED- | 背光地 (0 V) |\n\n### LCD 连接\n\n按照如下方式连接组件：\n\n- Arduino 数字引脚 (13) 连接到 LCD\
    \ 的 RS 引脚 (4)。\n- Arduino 数字引脚 (GND) 连接到 LCD 的 RW 引脚 (5)。\n- Arduino 数字引脚 (12)\
    \ 连接到 LCD 的 E 引脚 (6)。\n\n## 树莓派与 Arduino 的物联网\n\n- Arduino 数字引脚 (11) 连接到 LCD 的\
    \ D4 引脚 (11)。\n- Arduino 数字引脚 (10) 连接到 LCD 的 D5 引脚 (12)。\n- Arduino 数字引脚 (9) 连接到\
