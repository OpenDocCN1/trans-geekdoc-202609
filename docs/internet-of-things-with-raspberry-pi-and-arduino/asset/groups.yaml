    \ SAMD21 Cortex-M0+ 32 位低功耗 ARM MCU | 48 MHz | 3.3 V | | 22/12 | 4 (ADC 8/10/12位)/\
    \ (DAC 10 位) | 1 | 256 |\n\n## 4.2 Arduino IDE\n\nArduino 集成开发环境 (IDE) 是一款开源软件，它可以轻松编写代码并上传到板上。\n\
    \n### 4.2.1 安装 Arduino IDE 并打开窗口的步骤\n\n**步骤 1：安装 Arduino IDE 并打开窗口**\n开始之前，安装\
    \ Arduino IDE。图 4.4 显示 Arduino IDE 窗口。\n\n**步骤 2：选择 Arduino 板**\nArduino 有许多版本，如\
    \ UNO、MEGA、NANO 等。在启动项目之前，根据要求找到合适的板。在 Arduino IDE 中，点击“Tool”（工具）然后选择“Board”。图\
    \ 4.5 显示板的选择。\n\n**步骤 3：编写并编译程序**\n在 Arduino IDE 中编写程序。然后点击“编译”。图 4.6 显示编译程序的窗口。\n\
    \n```cpp\nvoid setup() {\n  // 在此处放置设置代码，运行一次\n}\n\nvoid loop() {\n  // 在此处放置主代码，循环运行\n\
