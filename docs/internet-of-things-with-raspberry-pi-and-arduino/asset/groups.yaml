    \ ATmega324U | 16 MHz | 5 V-12 V | 20/4 | 12/0 | 1 | 32 |\n| Uno | ATmega328P\
    \ | 16 MHz | 5 V-12 V | 14/6 | 6/0 | 1 | 32 |\n| Leonardo | ATmega324U | 16 MHz\
