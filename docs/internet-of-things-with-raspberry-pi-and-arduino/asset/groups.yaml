    }\n```\n\n![](img/526b5ff9486ff530988203e0cd92330a_55_0.png)\n\n图 4.9\n上传程序的窗口。\n\
    \n## 4.3 Arduino 基础命令\n\n- pinMode(x, OUTPUT); 将引脚 x 设置为输出引脚，x 为数字引脚\n- digitalWrite(x,\
    \ HIGH); 将引脚 x 设置为高电平，x 为数字引脚\n- pinMode(x, INPUT); 将引脚 x 设置为输入引脚，x 为数字引脚\n- digitalRead(digital\
    \ pin); 读取数字引脚，如 13 或 12 或 11 等\n- analogRead(analog pin); 读取模拟引脚，如 A0 或 A1 或\
    \ A2 等\n\n## 4.4 LCD 命令\n\n- lcd.begin(1, 2); 初始化 16*2 或 20*4 LCD\n- lcd.print(\"\
