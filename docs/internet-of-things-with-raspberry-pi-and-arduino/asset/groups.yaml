    \ 10.7 显示了系统的框图。它由树莓派、MQ2（烟雾检测）、MQ7（CO气体检测）、DHT11（温湿度传感器）、摄像头、电源、粉尘采样器（GP21030）和\
    \ Arduino Uno 组成。\n如图 10.8 所示连接组件。按照第 10.1.2 节描述的步骤创建 ThingSpeak 服务器，编写第 10.3.1\
    \ 节描述的程序，并按照图 10.9 至 10.12 所示检查结果。\n\n![](img/526b5ff9486ff530988203e0cd92330a_181_0.png)\n\
    \n图 10.7\n空气质量监测系统的框图。\n\n# 使用树莓派和 Arduino 的物联网\n\n![](img/526b5ff9486ff530988203e0cd92330a_182_0.png)\n\
    \n图 10.8\n空气质量监测系统的电路图。\n\n![](img/526b5ff9486ff530988203e0cd92330a_182_1.png)\n\
