  - '[PAGE 26]


    Physical Web: The Physical Web is an approach to interconnect devices and access
    them seamlessly.


    HyperCat: It is an open source JSON-based lightweight hypermedia catalogue for
    exposing collections of URIs.


    MQTT (Message Queuing Telemetry Transport): The MQTT is a light-weight protocol
    that enables a publish/subscribe messaging model. Used for remote connection in
    a network.


    CoAP (Constrained Application Protocol): CoAP is an application layer protocol.
    It is designed to translate to HTTP for simplified integration with the web.


    SMCP: It is a C-based CoAP stack, which can be used for embedded environments.
    It has fully asynchronous I/O and supports both UIP and BSD sockets.


    STOMP: It stands for Simple Text Oriented Messaging Protocol in communication
    networks.


    XMPP: It stands for Extensible Messaging and Presence Protocol.


    XMPP-IoT: It is the same as XMPP with an additional feature to establish a communication
    link between machine to people and machine to machine.


    Mihini/M3DA: It acts as intermediate agent between the M2M server and embedded
    gateway. M3DA is an extended version to transport M2 binary data.


    AMQP: The acronym is Advanced Message Queuing Protocol and it is an open-source
    application layer used as middleware in a messaging application. It is reliable
    and more secure to use in routing and queuing.


    DDS: It stands for Data Distribution Service for real-time systems. It is an open
    source and international standard to address communication over real time and
    embedded systems.


    LLAP: It is elaborated as a lightweight local automation protocol. LLAP facilitates
    sending short and simple messages between intelligent objects.


    REST: It stands for Representational State Transfer Protocol.


    SOAP: It stands for Simple Object Access Protocol.


    Websocket: It is a full-duplex socket used to communicate between server and client.


    SensorML: It describes sensors and the measurement process by providing the standard
    models and an XML encoding.


    RAML: The acronym is RESTful API Modelling Language. It is used to design and
    share the API.'
  - '[PAGE 27]


    # Introduction to Internet of Things


    IoTivity: It is founded by Linux Foundation to facilitate open-source projects
    and sponsored by OIC.

    IEEE P2413: It is a standard for an architectural framework for the IoT.

    OTPr (Open Trust Protocol): This protocol is used to install, update, and delete
    applications. It manages the security configuration in a Trusted Execution Environment
    (TEE).


    # 1.4 Enabling Technologies for IoT


    In the present world, many wired and wireless technologies contribute to automation.
    IoT is the latest trend in technology. The networking part in IoT may involve
    more than one type of communication media or device.


    +   1. Short-Range Wireless Technology

    Bluetooth networking in mesh: It is a Bluetooth low-energy (BLE) compatible mesh
    network with an increased number of nodes.

    Light-Fidelity (Li-Fi): This technology is almost similar to the Wi-Fi standard,
    but it uses the visible light spectrum.

    Near-field communication (NFC): It is a communication protocol that enables communication
    between two devices within a range of 4 cm.

    QR codes and barcodes: It is optical tag that can be read by machine; it stores
    the information for the item to which it is stacked.

    Radio-frequency identification (RFID): It uses electromagnetic fields to read
    the information stored in tags on the other items.

    Thread: This network protocol is based on the IEEE 802.15.4 standard.

    Wi-Fi: It is for local area networking, which is based on the IEEE 802.11 standard.

    ZWave: It is a low-powered, low-latency, near-range communication protocol having
    better reliability than Wi-Fi.

    ZigBee: This protocol can be used for a personal area network; it is based on
    the IEEE 802.15.4 standard.


    +   2. Medium-Range Wireless Technology

    HaLow: It is the variant of the Wi-Fi standard. It provides low data rate transmission
    over a wide range.

    LTE-Advanced: It is Long-Term Evolution technology meant to provide flawless communication
    with a high data rate.'
  - '[PAGE 28]


    # 3. Long-Range Wireless Technology


    Low-power wide-area networking (LPWAN): This wireless network facilitates a wide
    range of communication along with low bit rate and less power.


    Very small aperture terminal (VSAT): This communication is used in satellites
    with dish antenna for narrow-banded data.


    # 4. Wired Technology


    Ethernet: It is a wired communication technique using a twisted pair and optical
    fiber with hubs or switches.


    Multimedia over Coax Alliance (MoCA): This technology enhances video quality over
    existing cable.


    Power-line communication (PLC): This communication technology uses the transmit
    of electrical power and data.


    # 1.5 IoT Levels


    Level 1 IoT: A level 1 IoT system performs sensing, actuation, storing, and analysis
    operations and is comprised of a single node/device. An example is a home automation
    system where a single node is designed to control the lights and appliances remotely.


    Level 2 IoT: A level 2 IoT system performs sensing, actuation, and analysis has
    a single node/device. This is suitable for big data analysis. The data is stored
    on the cloud. It is popular for cloud-enabled applications like smart farming.


    Level 3 IoT: A level 3 IoT system is a single-node-based cloud platform. This
    type of system is suitable for big data needs that are computationally intensive.
    An example is the package tracking system. The system comprises of a single node
    (for a package), which monitors the vibration level of a package being shipped.


    Level 4 IoT: A level 4 IoT system has multiple nodes that perform the analysis
    and data stored on the cloud. The system may have local and cloud-based server
    nodes that receive the information and upload on the cloud. Server nodes only
    process the information and perform no control action. It is suitable where multiple
    nodes are required and involve big data that is computationally intensive. An
    example is noise monitoring.


    Level 5 IoT: A level 5 IoT system has end nodes and a single coordinator node.
    The end node performs the sensing and/or actuation. Collections of data done by
    the coordinator node form the sensor nodes and communicates it to the cloud and
    is analyzed'
