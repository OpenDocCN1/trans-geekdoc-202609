    ## 11.3 使用 Blynk App 控制家电


    Blynk 应用可创建一个控制家电的界面，以实现物联网（IoT）的智能控制。该系统由树莓派、电源、两个继电器板（如果需要控制两个电器）、一个三极2 2N22管（作为开关）和一个电源组成。如图
    11.7 所示连接组件，并按照第 11.2 节提到的步骤控制两个 LED，因为相同的项目也可以控制两个继电器。


    ## 树莓派的 Blynk 应用


    ![](img/526b5ff9486ff530988203e0cd92330a_199_0.png)


    **11.7**


    家电控制的电路图。


    连接情况：


    - 通过电阻将第一个三极管 2N222 的基极连接到 GPIO21，发射极接地。

    - 通过电阻将第二个三极管 2N222 的基极连接到 GPIO20，发射极接地。

    - 将三极管的集极连接到继电器的“L2”。

    - 将12V 连接到继器的“L1”。

    - 将二极管跨接在“L1”。

    - 将负载的一端连接到继器的“common”（常闭）。

    - 将负载另一端连接到继器的“NO”（常开）。


    ![](img/526b5ff9486ff530988203e0cd92330a_200.png)


    ## 12 基于树莓派的 Cayenne


    ### 12.1 Cayenne 简介


    Cayenne 具有自定义的可拖放仪表板。它可以轻松地设置树莓派。在 Cayenne 中，可以添加传感器、执行器以及更多设备。它用于远程控制设备。它包含四个组件：Cayenne
    代理（负责通信）、云（处理并存储数据）、在线仪表板（提供图形界面）以及适用于 Android 和 iOS 的 Cayenne 应用。


    ### 12.1.1 开始使用 Cayenne


    - 1. 打开 Cayenne 网站并创建一个账户（图 12.1）。

    - 2. 填写注册表并选择设备（图 12.2）。

    - 3. 使用以下命令在树莓派上下载并安装 myDevices Cayenne（图 12.3）：

    ```bash

    wget https://cayenne.mydevices.com/dl/rpi_8bf9u0.sh

    sudo bash rpi_8bf9u0.sh

    ```

    - 4. 进入 GPIO 并根据项目选择（图 12.4）。


    ## 12.2 使用 Cayenne App


    使用 Cayenne 应用理解 LED 工作最简单的方法。该系统由树莓派、电源和一个 LED 组成。将 LED 连接到 GPIO7（图 12.5）。按照第
    12.1.1 节提到的步骤操作。开发 Cayenne 应用。进入 GPIO 17 引脚，点击“input”并将其改为“output”。LED 的状态可以通过更改按钮的状态为“HIGH”或“LOW”来改变。


