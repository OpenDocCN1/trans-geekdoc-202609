    \nDr. Lovi Raj Gupta is the executive dean of the Faculty of Technology & Sciences\
    \ at Lovely Professional University. He is a leading light in the field of technical\
    \ and higher education in the country. His research-focused approach and insightful\
    \ intervention of technology in education has won him much.\n\nHe holds a PhD\
    \ in bioinformatics. He received his M.Tech. in computer-aided design and interactive\
    \ graphics from IIT, Kanpur, and received his BE (Hons.) from MITS, Gwalior. Having\
    \ a flair for endless learning, he has received more than 20 certifications and\
    \ specializations online on Internet of Things (IoT), augmented reality, and gamification\
    \ from the University of California at Irvine, Yonsei University, South Korea,\
    \ Wharton School, University of Pennsylvania, and Google Machine Learning Group.\
    \ His research interests are in the areas of robotics, mechatronics, bioinformatics,\
    \ IoT, AI, and ML using tensor flow (CMLE) and gamification.\n\nIn 2001, he was\
    \ appointed assistant controller (technology), ministry of IT, by the government\
    \ of India by the honorable president of India in the Office of the Controller\
    \ of Certifying Authorities (CCA). In 2013, he was awarded a role in the National\
    \ Advisory Board for the What I Can Give Mission—Kalam Foundation of Dr. AP Abdul\
    \ Kalam. In 2011, he received the MIT Technology Review Grant Award followed by\
    \ the coveted Infosys InMyMasters Award in 2016. He has 10 patents to his account.\n\
    \n![](img/526b5ff9486ff530988203e0cd92330a_16_1.png)\n\nBhupendra Singh is the\
    \ managing director of Schematics Microelectronics and provides product design\
    \ and R&D support to industries and universities. He has completed his BCA, PGDCA,\
    \ M.Sc. (CS), and M.Tech and has more than 11 years of experience in the fields\
    \ of computer networking and embedded systems. He has published 12 books in the\
    \ areas of embedded systems and Internet of Things with reputed publishers like\
    \ CRC/Taylor & Francis, Benton Science, Narosa, GBS, IRP, NIPA, River Publisher,\
    \ and RI Publications.\n\nMahendra Swain is presently associated with MIET, Jammu,\
    \ as assistant professor. He has completed his BTech in ECE from Centurion University\
    \ of Technology and Management, Bhubaneswar, and M.Tech from Lovely Professional\
    \ University. He has published various research articles and attended national\
    \ and international conferences in the fields of embedded systems and Internet\
    \ of Things. He has chosen electrical and communication engineering with an intense\
    \ urge to delve into challenging fields, such as embedded systems, wireless communication,\
    \ electronic product development, and IoT.\n\n![](img/526b5ff9486ff530988203e0cd92330a_17_0.png)\n\
