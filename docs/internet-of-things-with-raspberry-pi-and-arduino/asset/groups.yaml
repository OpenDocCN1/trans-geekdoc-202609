    \ 为行数\n- lcd.print(LPU); 在 LCD 上打印整数 LPU\n- lcd.Clear(); 清除 LCD 内容\n\n## 4.5 串口通信命令\n\
    \n- Serial.begin(baud); 初始化串口通信，将波特率设置为 600/1200/2400/4800/9600\n- Serial.print(\"\
