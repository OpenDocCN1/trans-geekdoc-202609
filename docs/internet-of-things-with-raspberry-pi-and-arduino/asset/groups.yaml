    # # 1 Introduction to Internet of Things


    # ## 1.1 Characteristics of IoT


    Internet of Things (IoT) can be used to design products for businesses. It facilities
    to add the valuable feature to the businesses, where the IoT framework is designed
    to connect the information from devices which are interconnected. The process
    has been classified into five phases. The first phase is “create phase,” where
    sensors collect the data from the environment. This data can generate the information
    for the business. Second is “communicate phase,” where generated data are communicated
    to the required destination. Third is the “aggregate phase,” where collected data
    over the network are aggregated by the device itself. Fourth is “analyse phase,”
    where aggregated data are used to generate patterns and use it to control and
    optimize the process. Fifth is the “act phase,” where necessary actions are taken
    on the basis of information extracted from the aggregated data.


    The characteristics of IoT may vary from one domain to another. A few characteristics
    are listed as follows:


    +   1. **Intelligence**: IoT is treated as smart due to the integration of hardware,
    software, computational capability, and algorithms. The intelligence feature in
    an IoT system establishes a great capability of responding in an intelligent way
    to carry out specific tasks. IoT provides a standard input method in the form
    of a graphical user interface, which also makes it user friendly.

    2. **Connectivity**: Connectivity brings objects together over IoT. It is important,
    connectivity contributes to the collective intelligence of the system. It enables
    network accessibility and compatibility of the objects. New opportunities could
    be generated in the recent market by connecting smart devices by the networking.

    3. **Dynamic nature**: IoT is dynamic in nature, as it is capable of collecting
    data from devices, which may change dynamically, for example, a change in temperature
    or speed.'
  - '[PAGE 22]


    Internet of Things with Raspberry Pi and Arduino


    +   4. Enormous scale: The number of connected devices over IoT is very large.
    The data management for such large number of devices is even more critical. But
    the complexity does not affect the number of objects connected to IoT by day.


    +   5. Sensing: The sensor is the most important part of an IoT network. It detects
    or measures the environmental changes to generate the data. The sensing technologies
    provide true information regarding physical quantities in the environment.


    +   6. Heterogeneity: IoT devices designed using various hardware frameworks and
    networks can communicate over different networks. Features like modularity, scalability,
    extensibility, and interoperability play design roles in IoT.


    +   7. Security: IoT devices are susceptible to cyberattack. There is high level
    of transparency and privacy issues with IoT. It is important to secure the end
    objects, the networks, and the data that are transferred over the network.


    There is a wide range of technologies incorporated with IoT to support its successful
    functioning. IoT creates values and supports human beings to make their lives
    better.


    # 1.2 Design Principles of IoT


    In the future, everyday lives will be filled with more intelligent devices. Designing
    IoT devices and networks has challenges to be addressed, which includes connecting
    different types of physical devices, collecting extracting meaningful information,
    and fulfilling different needs at the level of industries and home.


    A few of design principles for IoT devices and networks are as follows:


    +   1. Focus on value: To start with IoT design, it is important to understand
    the types of features that need to be included. The challenges and barriers need
    to be understood before adopting new technologies. The designer needs to dig out
    the user''s need and acceptability of the product. The order of features also
    needs attention in design process.


    +   2. Holistic view: IoT product consists of multiple devices with different
    capabilities. The solution may also have a cooperation with multiple service providers.
    It is not enough to design only one end device; the designer needs to take a holistic
    view across the complete system.'
  - '[PAGE 23]


    # Introduction to Internet of Things


    +   3. Safety first: The consequences of avoiding safety in IoT products can be
    very serious due to direct connection of devices with the real world. Also, building
    strong trust must be one of the main drives among designers. Because IoT is a
    combination of hardware, software, and network, any situation of occurring error
    needs to be addressed. In the event an error situation cannot be avoided, the
    feature of communicating the error to the user may build a trust. It is important
    to make users'' data secure and, to build a trust towards IoT.


    +   4. Consider the context: IoT solutions directly deal with the real world,
    where many unexpected things happen at a time when the user should feel safe.
    IoT solutions should be capable of handling environmental situations, such as
    a change in temperature. Also, an IoT device can have multiple users, unlike a
    smartphone, so this context needs to be addressed.


    +   5. Strong brand: To handle adverse conditions such as device failure, building
    a strong brand is very important among users. When users feel connected with a
    brand, they are more forgiving and are more likely to keep the products.


    +   6. Prototyping: An IoT solution is a combination of both hardware and software,
    but both have different life spans. But in IoT, the solution needs to be aligned.
    IoT hardware and software are hard to upgrade once they are placed at a location.
    So, the prototyping and its iteration are the solution before finalizing the product
    to launch.


    +   7. Use data responsibly: An IoT solution generates tons of data during its
    life span. However, to identify the data points that are required to make the
    solution functional and useful. So, the possibility of data sciences comes in
    here. Data science provides a solution to reduce user friction. It can be used
    to interpret meaningful signals and automate repeated context-dependent decisions.


    # 1.3 IoT Architecture and Protocols


    # 1.3.1 IoT Architecture


    IoT architecture is comprised of the following components:


    +   Thing: IoT is interconnected with various sensors to collect the data and
    actuators to perform actions corresponding to the commands received from the cloud.


    +   Gateway: It is used for data filtering, preprocessing, and communicating to
    the cloud and vice versa (receiving the commands from the cloud).'
