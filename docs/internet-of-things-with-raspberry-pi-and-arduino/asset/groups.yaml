    3. 从 https://www.raspberrypi.org/downloads/raspbian/ 下载 Raspian，获取镜像并将其刻录到树莓派上。

    4. 将卡片插入树莓派，然后等待 2 分钟。

    5. 通过局域网（LAN）将树莓派连接到计算机。

    6. 按照第 5.2 节中的步骤 6、7 和 8 进行操作。


    ![](img/526b5ff9486ff530988203e0cd92330a_68_1.png)


    图 5.8

    Win32 disk imager。


    # 树莓派基础


    ## 5.4 终端命令


    终端命令列表：


    - 1. sudo apt-get update: 此命令更新软件包列表。

    - 2. sudo apt-get upgrade: 此命令下载并安装更新后的软件包。

    - 3. sudo apt-get clean: 此命令清理旧的软件包文件。

    - 4. sudo raspberrypi-config: 此命令配置树莓派的配置工具。

    - 5. ls: 此命令显示目录内容列表。

    - 6. cd: 此命令切换目录。

    - 7. mkdir: 此命令创建目录。

    - 8. rmd: 此命令删除目录。

    - 9. mv: 此命令移动文件。

    - 10. tree -d: 此命令显示目录树形结构。

    - 11. pwd: 此命令显示当前目录。

    - 12. clear: 此命令用于清除终端窗口。

    - 13. sudo halt: 此命令让树莓派关机。

    - 14. sudo reboot: 此命令用于重启树莓派。

    - 15. startx: 此命令用于启动桌面环境 (LXDE)。

    - 16. ifconfig: 此命令查找树莓派的 IP 地址。

    - 17. nano: 此命令用于编辑文件。

    - 18. cat: 此命令显示文件内容。

    - 19. rm: 此命令删除文件。

    - 20. cp: 此命令用于复制文件或目录。

    - 21. locate: 此命令用于定位文件。

    - 22. sudo: 此命令用于 Linux 命令行；sudo 代表“SuperUser Do”（以超级用户身份执行）。

    - 23. df: 此命令查看系统中每个分区的可用磁盘空间。

    - 24. du: 此命令显示系统内文件的磁盘占用情况。

    - 25. tar: -cvf 用于创建 .tar 归档，-xvf 用于解压 tar 归档，-tvf 列出归档内容等。

    - 26. zip, unzip: 此命令将文件压缩为 zip 归档，并 unzip 解压提取文件。

    - 27. uname: 命令 “uname -a”打印大部分系统信息。

    - 28. chmod: 此命令更改文件或目录的权限。

    - 29. ping: 此命令检查与服务器的连接。

    - 30. sudo shutdown: 此命令关闭树莓派。


    ## 5.5 树莓派库安装


    ```

    $ sudo apt-get install libblas-dev

    $ sudo apt-get install liblapack-dev

    $ sudo apt-get install gfortran

    $ sudo apt-get install python-setuptools

    $ easy_install scipy # 之前可能需要依赖项

    $ sudo apt-get install python-matplotlib

    ```


    ## 5.6 获取树莓派的静态 IP 地址


    树莓派每次“开启”时都会获得不同的 IP 地址，这个 IP 被称为当前 IP。为了避免这个问题，需要创建一个静态 IP 地址，它在设备“关闭”时不会改变。


    创建静态 IP 地址的步骤：


    - 1. 打开终端窗口（图 5.9）。

    - 2. 在命令行输入命令 “ifconfig”（图 5.10）。此命令提供网络相关信息。图 5.10 突出显示了当前 IP 地址；这里是 192.168.0.16。注意这个
    IP 地址，稍后会用到。

    - 3. 打开配置静态 IP 的配置文件。文件名 dhcpcd.conf，存储在 etc 文件夹中。要进行任何更改，在终端窗口中使用 nano 编辑器：“sudo
    nano /etc/dhcpcd.conf”（图 5.11）。执行此命令后，将打开窗口（图 5.12）。


    在图 5.12 屏幕上，向下滚动直到看到：“# Example IP configuration”（图 5.13）。


    ![](img/526b5ff9486ff530988203e0cd92330a_71_0.png)


    图 5.9

    终端窗口。


    ![](img/526b5ff9486ff530988203e0cd92330a_71_1.png)


    图 5.10

    树莓派 "ifconfig" 命令窗口。


    - 删除此段落每行的 “#”，并将 IP 地址范围从 1 改为 255（图 5.14）。更改完成后，使用 Ctrl+x 编辑窗口并点击 “Yes” 保存更改（图
    5.15）。

    - 使用命令 “reboot”重启树莓派（图 5.16）。

    - 使用命令 “ifconfig”检查树莓派的静态 IP 地址（图 5.17）。


    ![](img/526b5ff9486ff530988203e0cd92330a_72_0.png)


    图 5.11

    静态 IP 配置的 Nano 编辑器。


    ![](img/526b5ff9486ff530988203e0cd92330a_72_1.png)


    图 5.12

    配置 IP 地址的窗口。


    ![](img/526b5ff9486ff530988203e0cd92330a_73_0.png)


    ```

    pi@raspberry:~

    File Help

    GNU nano 2.7.4 File: /etc/dhcpcd.conf

    # 遵守网络 MTU。这应用于 DHCP 路由。

    option interface_mtu

    # RFC2131 要求 ServerID。

    require dhcp_server_identifier

    # 生成稳定的 IPv6 地址而不是基于硬件的地址

    slaac private

    # 静态 IP 配置示例：

    interface eth0

    static ip4_address=192.168.0.10/24

    static ip6_address=fd51:42f8:caae:d92e::ff/64

    static domain_name_servers=192.168.0.1 8.8.8.8 fd51:42f8:d2::1

    # 如果 DHCP 失败，退回到静态 IP：

    # define static_eth0

    profile static_eth0

    ```


    图 5.13

    静态 IP 配置。


    ![](img/526b5ff9486ff530988203e0cd92330a_73_1.png)


    ```

    pi@raspberry:~

    File Help

    GNU nano 2.7.4 File: /etc/dhcpcd.conf 修改后

    # 遵守网络 MTU。这应用于 DHCP 路由。

    option interface_mtu

    # RFC2131 要求 ServerID。

    require dhcp_server_identifier

    # 生成稳定的 IPv6 地址而不是基于硬件的地址

    slaac private

    # 静态 IP 配置示例：

    interface eth0

    static ip4_address=192.168.0.30/24

    static ip6_address=fd51:42f8:caae:d92e::ff/64

    static routers=192.168.0.1

    ```


    图 5.14

    。


    ## 5.7 在树莓派上运行程序


    有多种方法可以在树莓派上运行程序。以下是一些可用的方法并如下：


    - rc.local

    - bashrc

    - init.d tab

    - systemd

    - crontab


    我们将讨论 “rc.local”。


    ### 5.7.1 编辑 rc.local


    在树莓派上，使用具有 root 权限的编辑器 /etc/rc.local 文件：“sudo nano /etc/rc.local”

    添加执行 Python 程序的命令，保存文件并退出。如果运行无限循环，通过在末尾添加 “&” 来终止命令，例如：sudo python /home/pi/sample.py&


    树莓派在启动其他服务之前会运行此程序。如果不包含 & 符号，树莓派将无法完成启动过程。& 符号允许命令在独立的进程中运行，并继续启动主进程。

    现在，重启树莓派进行测试：“sudo reboot。”


    ## 5.8 安装远程桌面服务器


    远程桌面服务器有助于用户通过网络连接控制远程计算机。要远程控制树莓派，可以使用此服务器。通过鼠标键盘打开树莓派终端，或通过 SSH（使用 raspberry-config）连接来安装远程桌面服务器。在派上安装软件包：


    ```

    sudo apt-get install xrdp

    ```


    ![](img/526b5ff9486ff530988203e0cd92330a_76_0.png)


    图 5.18

    远程桌面连接。


