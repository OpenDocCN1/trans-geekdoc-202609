    \n![](img/526b5ff9486ff530988203e0cd92330a_20_0.png)\n\n## 1 Introduction to Internet\
    \ of Things\n\n### 1.1 Characteristics of IoT\n\nInternet of Things (IoT) can\
    \ be used to design products for businesses. It facilitates to add the valuable\
