  - '[PAGE 33]


    # 2.2 Working Principle of Sensors


    The working principle of each sensor is different, as it is designed to measure
    a specific quantity. The principle of few basic sensors is as follows:


    +   - Temperature sensor: The temperature sensor measures the environmental temperature
    and converts it to an electrical signal. The principle of the thermometer is expansion
    and contraction of mercury in glass. With an alteration in temperature, mercury
    expands and contracts proportionally.


    +   - Two types of temperature sensors are available:


    +   - Contact sensor: The sensor that needs to be in physical contact with the
    object, temperature of which is to be sensed, known as a contact sensor.


    +   - Noncontact sensor: The sensor that needs''t to be in physical contact with
    the object, temperature of which is to be sensed, known as a noncontact sensor.
    This type of sensor uses Plank''s Law to measure temperature, which senses the
    heat radiated from the source to measure the temperature.


    +   - Examples of temperature sensors:


    +   - Thermocouple: Thermocouple is made of two wires, each with different metals.
    A junction is formed by joining the ends. This junction is open to the object
    for which temperature needs to be measured; the other end is connected to a measuring
    device. The current will flow through the metal, due to a difference in temperature
    of two junctions.


    +   - Resistance temperature detectors (RTDs): An RTD is type of thermal resistor
    that is designed to alter the electrical resistance with a change in temperature.


    +   - Thermistors: It is type of thermal resistor that changes the resistance
    in proportion with small changes in temperature.


    +   - IR sensor: An IR sensor emits and detects the infrared rays to sense a specific
    environment. It is easily available in the market, but it is sensitive towards
    environment noise and light.


    The application of an IR sensor includes thermography, heating, meteorology, climatology,
    spectroscopy, and communications.'
  - '[PAGE 34]


    Internet of Things with Raspberry Pi and Arduino


    +   3. UV sensor: A UV sensor measures the intensity or the power of an incident
    ultraviolet radiation. This electromagnetic radiation has longer a wavelength
    than x-rays but smaller than visible radiation. A polycrystalline diamond material
    is used for ultraviolet sensing. It can transmit different types of energy signals
    but can accept only one type of signal. The electrical meter is used to read the
    output signals and processed to the computer through analog-to-digital converters.
    The UV sensor is used in UV water treatment, light sensors, UV spectrum detectors,
    etc.


    +   4. Touch sensor: A touch sensor is a variable resistor that changes its resistance
    as per the location where it gets touched. It is made of a conductive and a partially
    conductive substance and insulated in a plastic cover. The flow of current is
    due to a conductive material that allows current partially. The touch sensor is
    a cost-effective solution for many applications, such as washing machines, fluid-level
    sensors, and dishwashers.


    +   5. Proximity sensor: A proximity sensor can detect the presence of an object
    without any contact point. The working principle is electromagnetic waves that
    are emitted by the sensor and return when the object is in range of the waves.
    The presence of the object is detected with the change in filed radiation. The
    proximity sensors working of different types, like inductive, capacitive, photoelectric
    sensor, ultrasonic, and Hall-effect.


    Inductive proximity sensor: This type of sensor has an oscillator as an input,
    which changes the loss resistance by the proximity of an electrically conductive
    medium. For metal detection, these types of sensors are used.


    Capacitive proximity sensor: This type of sensor converts capacitance by changing
    electrode displacement. It can be done by bringing the object within the variable
    frequencies. The object is detected with the help of the oscillating frequency,
    which is converted into a DC voltage. This current is compared with a fixed value
    to detect the object. For plastic targets, these types of sensors are used.


    +   6. Ultrasonic sensor: An ultrasonic sensor is used to detect the distance
    of an object. The working principle is the time duration between the emission
    and receiving of the waves after reflecting from the object. Ultrasonic sensors
    use sound waves to measure the distance of an object.'
