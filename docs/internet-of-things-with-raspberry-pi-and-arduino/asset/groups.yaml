    \ embedded environments. It has fully asynchronous I/O and supports both UIP and\
    \ BSD sockets.\n\n**STOMP:** It stands for Simple Text Oriented Messaging Protocol\
    \ in communication networks.\n\n**XMPP:** It stands for Extensible Messaging and\
    \ Presence Protocol.\n\n**XMPP-IoT:** XMPP-IoT is a variant of XMPP for IoT applications.\n\
    \n**M2M:** M2M refers to machine-to-machine communication.\n\n**AMQP:** Advanced\
    \ Message Queuing Protocol is used for reliable messaging.\n\n**DDS:** Data Distribution\
    \ Service is a middleware for real-time data exchange.\n\n**SOAP:** Simple Object\
    \ Access Protocol is used for web services.\n\n**REST:** Representational State\
    \ Transfer is an architectural style for networked applications.\n\n**Websocket:**\
    \ A protocol providing full-duplex communication over a single TCP connection.\n\
    \n**SensorML:** Sensor Modeling Language is an XML schema for describing sensors.\n\
    \n**RESTML:** RESTful Modeling Language used for describing web services.\n\n\
    **IoTivity:** IoTivity is a framework for managing IoT devices.\n\n## Introduction\
    \ to Internet of Things\n\n### 1.4 Enabling Technologies for IoT\n\nIn the present\
    \ world, many technologies contribute to IoT:\n\n#### Short-Range Wireless Technology\n\
    - **Bluetooth:** Bluetooth is a short-range wireless technology. Many devices\
    \ use Bluetooth Energy (BLE).\n- **Light-Fi (Li-Fi):** This uses light spectrum\
    \ for communication.\n- **Near-field communication (NFC):** NFC is used for communication\
    \ over a very short distance.\n- **QR codes and barcodes:** These are optical\
    \ codes used to store information.\n- **Radio-frequency identification (RFID):**\
    \ RFID uses electromagnetic fields to identify tags.\n- **Thread:** Thread is\
    \ a low-power mesh wireless network protocol. \n- **Wi-Fi:** Wi-Fi is a local\
    \ area network technology.\n- **ZWave:** ZWave is a wireless protocol used for\
    \ home automation.\n- **ZigBee:** ZigBee is a protocol for low-power, wireless\
    \ mesh area networks.\n\n#### Medium-Range Wireless Technology\n- **HaLow:** HaLow\
    \ is a variant of Wi-Fi for low-power devices.\n- **LTE-Advanced:** LTE-Advanced\
    \ is a high-speed cellular communication standard.\n\n#### Long-Range Wireless\
    \ Technology\n- **Low-power wide-area network (LPWAN):** LPWAN provides communication\
    \ over a wide area with low bit rate.\n- **Very small aperture terminal (VSAT):**\
    \ VSAT uses satellite technology for communication.\n\n#### Wired Technology\n\
    - **Ethernet:** Ethernet is wired communication using twisted pair or optical\
    \ fiber.\n- **Multimedia over Coax Alliance (MoCA):** MoCA allows video over existing\
    \ coaxial cables.\n- **Power-line communication (PLC):** PLC uses electrical power\
    \ lines for data transmission.\n\n## 1.5 IoT Levels\n\n- **Level 1 IoT:** A level\
    \ 1 IoT system performs sensing, actuation, storing, and analysis operations and\
    \ is comprised of a single node/device. An example is a home automation system\
    \ where a single node is designed to control the lights and appliances remotely.\n\
    - **Level 2 IoT:** A level 2 IoT system performs sensing, actuation, and analysis\
    \ has a single node/device. This is suitable for big data analysis. The data is\
    \ stored on the cloud. It is popular for cloud-enabled applications like smart\
    \ farming.\n- **Level 3 IoT:** A level 3 IoT system is a single-node-based cloud\
    \ platform. This type of system is suitable for big data needs that are computationally\
    \ intensive. An example is the package tracking system. The system comprises of\
    \ a single node (for a package), which monitors the vibration level of a package\
    \ being shipped.\n- **Level 4 IoT:** A level 4 IoT system has multiple nodes that\
    \ perform the analysis and data stored on the cloud. The system may have local\
    \ and cloud-based server nodes that receive the information and upload to the\
    \ cloud. Server nodes only process the information and perform no control action.\
    \ It is suitable where multiple nodes are required and involve big data that is\
    \ computationally intensive. An example is noise monitoring.\n- **Level 5 IoT:**\
    \ A level 5 IoT system has end nodes and a single coordinator node. The end node\
    \ performs the sensing and/or actuation. Collections of data done by the coordinator\
    \ node form the sensor nodes and communicates it to the cloud and is analyzed.\n"
