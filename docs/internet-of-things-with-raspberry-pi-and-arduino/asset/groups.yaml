    他拥有生物信息学博士学位。他在坎普尔理工学院（IIT, Kanpur）获得了计算机辅助设计与交互图形学的硕士技术学位，并在格瓦利奥尔的理工学院（MITS）获得了工程学学位（荣誉）。由于他对持续学习的热情，他从加利福尼亚大学欧尔文分校、韩国延世大学、宾夕法尼亚大学沃沃顿商学院以及谷歌机器学习小组获得了有关物联网（IoT）、增强现实和游戏化的
    20 多项在线认证和专业化培训。他的研究领域包括机器人、机电一体、生物信息学、物联网、使用 TensorFlow（CMLE）和游戏化的人工智能及机器学习。


