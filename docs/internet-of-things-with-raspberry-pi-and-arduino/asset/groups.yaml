    \ 4.7 所示。\n\n**步骤 5：将程序上传到 Arduino 板**\n将程序上传到 Arduino 板。图 4.9 显示如何上传程序。\n\n#\
    \ 设备管理器\n![](img/526b5ff9486ff530988203e0cd92330a_54_0.png)\n\n图 4.7\n检查 Arduino\
