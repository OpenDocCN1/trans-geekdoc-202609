- - '#'
  - 要了解我们可以对挑战中国的网络行动采取哪些措施——并最终什么方法对重塑其行为有效——首先需要理解这个新兴的亚洲超级希望通过其在线活动实现什么目标。中国长期以来将互联网作为加速其崛起、增长和现代化的工具，尽管它对网络化所带来的通信和信息自由一直抱持警惕。确保国内经济稳定——反过来确保政治稳定和执政共产党的未来——驱动了中国在世界舞台上的几乎每一个其他决策。中国共产党展现出了非凡的韧性和适应能力，比苏联多生存了几十年，而且其现代化努力使其避免了像北朝鲜和古巴等其他威权政体所经历的经济瘫痪。
