  2011 年初，莉莎·莫纳科——我曾在穆勒的办公室以及担任检察官时的老同事——被提名为担任国家安全助理检察长。莉莎参与了她这一代一些最重大的案件，拥有丰富的经验；她曾为珍妮·里诺工作过，后是精英“安然任务小组”的一员，该小组在
  21 世纪 00 年代初了对这家能源巨头的起诉，随后被选为穆勒的特别顾问，并在后期担任幕长。她是一个聪明且谨慎的说话者，避开光芒——正如穆勒组建的团队中的许多人一样——她亲眼目睹了穆勒如何推动转型
  `FBI` 以应对恐怖威胁，最近开始应对网络威胁。在奥巴马政府之初，她被提拔为副检察长的首席国家安全顾问，最终成为他的副手，在司法部处理广泛的问题。


  两年后，她成为政府一致且无争议的人选，领导司法部的国家安全局，这是“WMD 委员会”所创建的一个较不为人知的部门。这个成立于 2005 年的小组正式名称为“美国关于大规模杀性武器情报能力的委员会”，由参议员查克·罗布和劳伦斯·西尔伯曼法官共同主持，其任务是审查导致伊拉克拥有大规模杀性武器结论的情报失败，但它广泛解释了自己的职责范围，并对美国情报界进行了深入的思考。`WMD
  委员会`得出结论认为，问题并不在于这个国家价值数十亿美元的情报机构没有收集所需的信息——而是情报机构之间没有很好地告知彼此他们所掌握的内容。在结论中，它指出尽管
  `CIA`、`FBI` 和 `国土安全部` 在 9/11 事件后进行了彻底重组以确保更好、更快速的信息共享，但司法部完全没有变化——其三个主要的国家安全部门，“情报政策与审查办公室”、“反恐主义部门”和“反情报部门”都向不同的领导汇报。“如果这种疯狂中存在某种规律，我们或我们交谈过的任何其他官员都没有识别出来，”委员会得出结论。#25)](#part0018.html#en266en）`WMD
  委员会`建议设立新的国家安全助理检察长来监督所有三个部门，从而简化司法部的汇报流程，并确保用一套视角和一种哲学来指导恐怖主义和间谍案件。





  西尔伯曼（Silberman）曾任副司法部部长，并在监督外国情报监视法（FISA）案件的法庭工作过，他认为执法案件与专注于反间报或反间谍的案件之间存在本质区别。西尔伯曼得出结论说，“这是不同的技能，”部分原因是，反恐或反间报案件的重点并不总是指向刑事起诉——它往往是为了转移或破坏案件，而且在将嫌疑人逮捕之前，探员和调查人员可以使用许多不同的工具来对恐怖主义或间谍嫌疑人。


  国家安全局（`NSD`）——自 1957 年民权部门成立以来，司法部设立的首个诉讼部门——最终成为 2005 年《美国爱国者法案重新授权法》的一部分。“它将帮助我们执法部门勇敢的男女士们在恐怖分子发动袭击之前将线索连接起来，”乔治·W·布什总统在签署该法案时说道。


  这不仅仅是简单的易换位置调整：新的助理司法部长必须批准任何指控嫌疑人违反 20 项以上特定、明确涉及反恐、间谍、出口管制和其他相关犯罪的刑事法律的起诉书和起诉。“Lisa
  说，“这本应该是面向国家安全的国家视角。”这让助理司法部长拥有帮助制定司法部国家起诉战略的独特能力；而每个美国检察官在传统的刑事和民事起诉中大多可以遵循自己的意愿，但国家安全案件必须与司法部总部（Main
  Justice）进行协调。


  到奥巴马政府初期，`NSD`拥有约 300 名律师，他们并肩工作处理恐怖主义和间谍案件。前三位所谓的`NSD` `AAGs`（助理司法部长）都在该部门留下了自己的印记：肯·韦因斯坦（Ken
  Wainstein）专注于当时主要的恐惧——反恐工作，启动了该部门；J·帕特里克·罗恩（J. Patrick Rowan）扩大了其业务范围，并加强了对出口管制案件和不扩散问题的起诉；奥马的首位任命者大卫·克里斯（David
  Kris）致力于扩大该部门的上诉工作，并整合司法部的情报办公室（`Office of Intelligence`）。Lisa 的工作除了部门已经在处理的所有事务外，还负责优先处理并处理国家安全网络案件。


  在`FBI`工作期间，我看到了`NSD`的巨大价值；每天，局里对恐怖检察官以及代表其在外国情报监视法庭（`Foreign Intelligence Surveillance
  Court`）出场的律师深表信任。宾法尼亚大道`FBI`与`NSD`之间在恐怖案件上的这种信任在政府内部几乎是独一无有的，这由于前五位`NSD`领导者中有四人最初都在`FBI`为穆勒（Mueller）工作：肯·韦因斯坦、帕特·罗恩、Lisa，最后还有我。这些“执行者”通过共同的使命感真正联系在一起。虽然与`FBI`总法务办公室确实存在一些政策斗争，但在一线层面主要是极大的共识与合作。我在
  2009 年的两起重大恐怖案件中目睹了这种运作：对纽约地铁疑似炸弹客纳吉布拉拉·扎齐（Najibullah Zazi）的跨国追捕，以及对大卫·科尔曼·海德利（David
  Coleman Headley）的长期调查，后者是一个协助策划 2008 年孟买袭击的美国人。这些案件汇聚在了一起。




  为了帮助理解后者的问题，我们招募了安妮塔·辛格（Anita Singh），她是一位强势且直言不讳的前 CCIPS 律师，曾为约翰·布伦南（John Brennan）的国家安全委员会工作过，并对网络世界的机密领域有深入了解。安妮塔曾任职于波士顿咨询，我们委托她研究国家安全局（NSD）的战略方向。


  在对司法部进行了数周的访谈和会议后，安妮塔来到我的办公室，瘫坐在我的沙发上，给了我意料之中的结论：我们的直觉是对的。针对中国的网络案件被忽视了，因为无论是刑事部门还是国家安全部门都不认为那是自己的职责范围。刑事部门处理传统的经济间谍活动，而国家安全部门则处理针对外国敌的案件。双方都了解很多，但当案件似乎进入对方的领地时，他们就停止了线索追踪。安妮塔回忆道：“部门的设计初衷并不是调查盗窃。”NSD
  在网络领域并没有开展很多。NSD 在黑客战术和技术方面拥有出色的专业知识，但一直没有将这些信息转化为可起诉的案件。“刑事[部门]和 NSD 之间发生的事情之多确实令人惊讶，但拼图碎片并没有连接在一起。它们没有被放在一起审视，”安妮塔回忆道。她早期关于该问题的大部分工作只是邀请司法部的各个团队坐在一起分享信息。“这完全是字面意义上的‘齐聚一堂’，聚集大家分享他们所知的一切。这以前并没有以有组织的方式发生过。”在我去
  NSD 之前，我就从在 FBI 的经历中知道，我们可以收集到足够的信息和证据来提起刑事案件。正如我们后来的起诉文件所示，我们甚至能够公开某些可以追溯到特定中国黑客个人黑客行为的照片。基于我们的信心，莉莎（Lisa）愿意通过电话在全国范围内某处为我们寻找一位美国检察官作为合作伙伴。我们只需要为检察官提供武器，并让他们与调查人员合作即可。


  我们在 NSD 最终尝试做的事情中，很少有什么是激进或具有突破性的——它反映了刑事部门在过去八到十年里一直在使用的许多工具和技术。然而，由于 NSD 在很大程度上专注于传统的经济间谍窃密和情报收集——它并不是一支由精通计算机黑客的检察官组成的团队——这种新方法似乎是一个巨大的进步。这甚至并不特别引起争议：当我们向国会提交这项重组方案时，尽管在那个卷入许多其他问题的派性政治斗争中，我们仍然获得了广泛的跨派支持。


  然而，尽管我们正在进行这些重组并试图适应新的威胁，但无论我们望向何处，借用 CIA 局长乔治·滕内特（George Tenet）在 2001 年夏天谈论恐怖主义威胁时的话，“系统正在闪烁红灯。”


  2011 年 2 月，安全公司 McAfee 发布了一份 19 页的报告，详细说明了针对从美国到哈萨克斯坦、希腊再到台湾的多达 12 家跨国石油、能源和石化公司的“协调、隐蔽和针对性的网络攻击”。这些被
  McAfee 命名为“夜龙”（Night Dragon）的攻击，正是我们在其他领域看到的景象。该公司描述了“对目标基础设施进行有条理且渐进的入侵”，这些入侵依赖于美国和荷兰被攻破的服务器，以及一套熟悉的工具——鱼叉式网络钓鱼和对
  Microsoft Windows 操作系统内部漏洞的利用——这帮助黑客获取目标计算机的访问权限，随后对其进行操控以允许黑客隐藏其大规模的数据外泄。通过远程管理工具（RAT），黑客可以安装后门并工作几乎就像他们本人坐在被感染的计算机终端一样，他们可以继续在网络目录中寻找有用信息。这些
  RAT 与商业工具如 Citrix 或 Microsoft Windows Terminal Services 类似，后者通常被公司和网络管理员用于帮助员工远程访问计算机。


  一旦 McAfee 注意到“夜龙”攻击，他们发现这些攻击相对容易追踪——黑客安装的特定后门依赖于一个唯一标识符来与命令服务器“通信”。该后门每隔五秒广播一次“信标”（beacon），告诉命令服务器它正在运行；任何知道要找什么的网络管理员都会立即识别出它。黑客还使用了四个知名的恶意域名来路由他们的流量：`is-a-chef.com`、`thruhere.net`、`office-on-the.net`
  和 `selfip.com`。通过攻击的唯一标识符，McAfee 能够将“夜龙”的行动追溯到至少 2009 年 11 月，但他们怀疑攻击可能早在 2006 年就开始了。正如当时在
  McAfee 的安全专家德米特里·阿尔佩罗维奇（Dmitri Alperovitch）所解释的，“这反映了我们关键基础设施安全的一种非常悲哀现状。这些并非复杂的攻击……但它们非常成功地实现了目标。”这些盗窃行为完全没有被目标公司察觉，却产生了竞争情报和贸易秘密，价值可能高达数百万甚至数十亿美元。


  McAfee 的研究人员将部分恶意软件追溯到一个在中国山东省东部城市菏市（一个人口八百万的城市）运行网络托管服务的个人。此外还有大量的间接证据表明攻击源自中国：解锁恶意软件的密码之一是
  `zw.china`；所有外泄数据都来自北京 IP 地址；恶意软件依赖于流行的中国开发的黑客工具，如 `Hookmsgina`、`WinlogonHack` 和
  `ASPXSpy`；而且最有说明性的一点——所有黑客的操作时间都是北京时间上午 9 点到下午 5 点。正如 McAfee 结论所说，“尽管所有这些指标是一项精心设计的‘红��鱼’行动，旨在将攻击责任归咎于中国黑客，但我们认为这极不可能。此外，尚不清楚谁会有动力付出如此巨大的代价来将这些攻击的责任推卸给他人。”这是我们在许多攻击案中看到的模式。对于中国来说，黑客是一份白领公司工作。





  # 在政府内部和跨行业范围内讨论网络安全之所以如此具有挑战性，原因之一是并没有一种统一的语言；每家安全公司和研究人员对各种黑客威胁都有自己的称呼，而政府也有自己的一套命名规范。


  同一个中国黑客团队，在安全公司 `CrowdStrike` 的一份报告中可能被称为 `Putter Panda`，在另一份来自不同安全公司的报告中又被称为 `MSUpdater`；被某些研究人员称为
  `Comment Crew` 的黑客团队，也被安全公司 `Mandiant` 命名为 `Advanced Persistent Threat 1`，其他行业研究人员称之为
  `Shanghai Group`（上海小组）。这些不同的名称可能指代在特定项目（或特定单位）工作的不同黑客——因此，负责某次攻击的黑客单位，随后可能会在公开场合通过完全不同的名称与另一次攻击联系起来。这好像每个智库和情报机构都用不同的名称称呼“基地组织”。难怪公众很难跟上节奏。


  同年夏天，一个私人安全研究人员团队目睹了 `Comment Crew` 黑客劫掠了 20 多个以商业为目标的目标——从能源巨头 `Halliburton` 到华盛顿律所
  `Wiley Rein`，再到印度财团 `ITC`。`Bloomberg News` 随后报道说，他们还窃取欧盟委员会主席的电子邮件，并渗透了一位负责引渡一名被通缉十多年的中国男子的加拿大法官的数据。`Bloomberg`
  写道：“日志还显示了[Comment Crew 黑客]对应对事件的反应是多么敏捷，即使在涉及敏感政府网络时也是如此。”在法官释放涉嫌走私者等待听证会几天后，`CommentCrew`
  黑客就跳入了加拿大移民和难民委员会的网络，从多伦多的电脑开始，，随后偷取并解密了密码，使他们进入了温哥华该委员会的网络，并最终进入了法官的工作电脑。


  与早期的攻击一样，这波新动作显示了极强的专注性——尽管 `ITC` 的负责人 `Y. C. Deveshwar` 本人不使用电脑，但中国黑客还是针对了他的私人助理的电脑，以窃取其办公室的敏感文件。在尝试打开受密码保护的目录受阻后，他们直接安装了一个恶意软件，以便在助理下次使用密码时窃取它。在其他地方，他们表现得同样有条理——在华盛顿的一个非营利组织
  `Business Executives for National Security`，他们在探索系统之前仔细关闭了杀毒软件；在另一个亲民主派的非营利组织 `International
  Republican Institute`，他们仔细地将高层员工的文件副本整合到一台电脑上，挑选出 220 份看起来与中国最相关的文档，将它们压缩成加密文件，并直接从网络中外泄。得益于他们恶意软件中的一个错误被警觉的安全研究人员注意到，美国安全团队能够监控黑客窃取文件在传回中国服务器过程中的传输。


  黑客利用被劫持的网站来帮助与受感染的计算机通信，试图通过占用德克萨斯南州一位高中教师、爱达荷州的一个直线车赛道，甚至是纽约市著名意大利餐厅 `Pietro’s`
  的网站来隐藏自己的真实足迹。同年晚些时候，他们通过偷取核能行业通讯的订阅名单，并针对这些订阅者发送定向钓鱼邮件，目标准了北美能源公司，帮助他们渗透了加利福尼亚
  `Diablo Canyon` 核电厂的一台计算机。正如 FBI 执行官 `Shawn Henry` 在离开该局后不久告诉 `Bloomberg` 的那样：“普通大众听到的——比如信用卡号被盗、某人黑入了
  LinkedIn——那只是冰山一角，是未分类的内容。我一直在潜艇里绕着冰山转。这是我们见过的最大规模的美国专利数据抽吸。这是一台机器。”


  那个夏天变成了中国对西方系统进行无数入侵的忙碌夏天。2011 年 8 月，`McAfee` 发布了另一份公开报告，追踪了一个名为 `Shady Rat`（阴影鼠）的中国
  APT 组织的工作。他们的研究人员访问了黑客自 2006 年以来使用的一个特定的命令控制服务器，并拼凑出了该小组这五年的活动。`McAfee` 报告道：“在对日志进行艰苦分析后，即使是我们也对受害组织的巨大多样性感到惊讶，并对作实施者的胆大包天感到震惊。”总之，他们发现了分布在
  14 个国家的 71 个受害组织——从 `Department of Energy` 研究实验室和国防承包商等经济目标，到美国的房地产和会计公司，以及显然出于政治利益而选择的目标：一家美国主要新闻机构的香港分处、在该组织在新加坡举行年度峰会之前的
  `ASEAN Secretariat`（东盟秘书处）、联合国、国际奥林匹克委员会和世界反兴奋剂机构，以及来自韩国、越南、台湾以及亚洲其他与中国竞争对手的公司。


  `Shady Rat` 的公开对我们来说是网络新闻头条奇特分化的另一个例子。尽管像 `Anonymous` 和 `Lulzsec` 等黑客活动组织在那一年通过攻击
  `HBGary`（一家调查 `WikiLeaks` 的公司）以及在发生一起争议性的警方枪击事件后黑入 `Bay Area Rapid Transit`（湾区快速交通系统）警察局网站而占据头条，但我们仍然最关注的是攻击我们系统的外国国家——这些威胁要安静得多、持续更久，并对我们的经济核心和国家安全造成深远损害。主导新闻报道的头条往往是华丽、引人眼球的表面噱头，而中国和伊朗却在仔细、安静地挖掘得深得多。


  !images/00006.jpeg


  2011 年底，美国政府在讨论中国黑客威胁方面迈出了第一尝试性一步。“中国行为者是世界上最活跃、最持续的经济间谍活动者，”美国国家反情报办公室在秋季的一份报告中总结道。“中国收集美国技术和经济信息的尝试将继续在高水平进行，并对对美国经济安全构成日益增长且持续的威胁。”


  正如该国反间谍负责人 `Robert Bryant` 所说：“如果我们的研发费用——每年 4000 亿美元——被盗取，坦率地说，这将摧毁我们在该国家的部分经济生存能力。”


  这些评论并没有在公众中引起广泛反响，但我们知道中国听到了。什么都没有发生——无论好坏。这本身本身就是一个重要的信号。我们命名了中国威胁，天空并没有崩塌。在经历了多年内部辩论和对对抗中国的恐惧之后——这些恐惧某程度上认为通过公开讨论中国的数字盗窃会导致两国之间发生危险的外交破裂——我们确实做到了，而生活继续。我希望这只是一个开始。


  在接下来的几个月里，入侵的速度并没有慢下来：`NASA` 在 2012 年 2 月宣布中国黑客已成功渗透了喷气推进实验室（`Jet Propulsion Laboratory`）的网络，并对他们的计算机系统获得了“完全、功能性的控制”，以至于他们能够操纵任务关键系统的用户账户。同年，我们看到解放军发布了一款拆弹机器人，我们立刻看出该机器人是根据
  2007 年被黑客的国防承包商 `QinetQ` 的被盗机器人设计方案建模的。





  我们看到政府内部已经响起了警钟——迟迟地，政府领导人开始在公开场合更严肃地处理这个问题。在 2012 年 7 月 19 日的《华尔街日报》的一篇文章中，奥巴马总统警告说，“面对对我们国家的网络威胁是我们所面临的最严峻的经济和国家安全挑战之一。”正如他所说：“外国政府、犯罪集团和个别个人每天都在探测我们的金融、能源和公共安全系统。去年，德克萨斯州的一个水厂在黑客发布了该设施内部控制系统的照片后，将其控制系统与互联网断开了连接。最近，黑客又渗透了运营我们天然气管道的公司的网络。”


  我们需要做得更多。美国需要公开发声，指控中国对我们知识产权的掠夺行为。仅仅旁观是起不了作用的。我们看到一个又一个行业、一个又一个部门，中国的窃取行为对美国公司和美国工人造成了真实的伤害。这并不是传统的国际间谍活动。正如斯蒂芬·布莱尔法官多年前在`Grokster`案中所言的，“故意的非法复制与普通盗窃一样，都是对财产的非法侵占。”


  我们很清楚公开对抗有有利有弊，并开始在情报界奔走，为采取公开行动提供论据。如果我们想要成功，我们希望在努力之初就能获得政府领导层的支持。虽然我们经常将美国情报界视为一个整体，但其内部绝非如此。每个机构都有自己的优势、劣势和内部政治——而且最重要的是，他们倾向于在国际舞台上维护自己的利益和能力。将国家利益置于机构利益之上，情报界的领导们迅速接受了这一想法——毕竟，他们比大多数人对威胁和损害有更深入了解。在`NSA`，副局长克里斯·英格尔斯直言不：“听着，这可能会让我们的收集[情报]工作变得更加困难，但考虑到我们所看到的问题的规模，我们需要做些事情来改变这种局面。也许这会有帮助。”


  “这就是我们的目标，”我说。


  更广泛地说，我们开始在全国范围内开展漫长而缓慢的拓展工作；我们知道，如果没有美国联邦检察官的支持以及司法部内部`CCIPS`团队的支持，我们的工作将无法开展。事实证明，我们在两个地方都找到了极佳的伙伴：西雅图美国联邦检察官兼检察长网络犯罪顾问小组主席珍妮·杜尔坎，以及`CCIPS`刑事部的负责人约翰·林奇。他们意识到，司法部普遍缺乏处理此类复杂案件的能力。“你所指望的经验[网络安全律师]数指手指就能出来，”亚当·希希基回忆道，他后来成为了我们团队的创始成员之一。


  我们希望建立一个更大的团队，模仿我在协调司法部`CHIP`网络时所看到的方法。`CHIP`检察官对计算机犯罪接受过专门培训，他们跨越了美国各地的联邦检察官办公室，以点对点的模式工作，提供技术专业知识。我们希望在国家安全案件中模仿这种模式，将`CHIP`模型与司法部的另一个国家级团队——`ATAC`（反恐咨询委员会）结合起来，每个办公室的检察官都接受过处理机密来源和方法的专门培训，他们负责与`FBI`的联合恐怖主义任务小组合作，帮助与州和当地伙伴共享反恐案件中的信息。通过吸取`CHIP`和`ATAC`模型的优点，我们希望能够建立一支精通计算机、受过保护和使用机密来源及方法训练的检察官团队。


  这一愿景促成了我们最初称为“国家安全网络专家”的缩写——`NSCS`，读音为*nis-cus*。“`NSCS`本应该是我们在背后收集的所有信息的存储库，”丽莎·莫纳科回忆道。我们从未想过这个尴尬的名字是永久性的，但在一个似乎每个事物都有自己的缩写的政府系统中，它很快就有了自己的生命。“我记得坐在会议上，看到人们开始使用‘NSCS’，我心里在想：‘等等，我们从未想过让它成为正式名字’”安妮塔回忆道。“它本只是一个占位符，但在我们想出正式名字之前，大家都采纳了它。”


  丽莎在 2012 年 10 月在西雅图的一个由珍妮·杜尔坎的会议上宣布了新方法，并解释了新`NSCS`职位的愿景。她解释说，我们还希望重组传统的反间谍部门，专注于非对称威胁，并引入更多与国家安全相关的网络案件，例如我们开始针对中国所采取的调查行动。


  约翰·林奇证明了他在帮助我们聚焦团队以及为招募的检察官提供初始培训方面的关键作用。我们要求美国联邦检察官选择他们想要送到新培训计划的人员，他们的提名让我们提供了一个有趣的窗口，让我们看到他们自己是如何看待网络安全的。约
  40%的人选了现有的恐怖主义和国家安全专家，另外 40%选择了`CHIP`检察官——那些已经精通计算机黑客和知识产权的人——剩下的 20%则选了完全是该领域新的大有前景的检察官。与此同时，我们组建了所谓的`NSD`威胁小组，这是一支专门针对中国经济间谍活动的团队，并在全国范围内征集了兴趣应对该威胁并希望临时调任至司法部总部的检察官。


  我一直事心地在心中整理了一份全美助理联邦检察官的名单，他们似乎非常胜任这份新工作。在纽约南区，我一直看中亚当·希希，他曾担任恐怖主义检察官工作了多年。他在 2012
  年初来到`NSD`，在网络政策领域进行了短期轮岗。当他向主管开关于`NSCS`网络的玩笑，询问自己是否应该参加其启动会议时，主管回答说：“等等——你知道那个人是你对吧？那是卡林对你的计划。”


  司法部的普通培训中心无法提供我们讨论所需的机密外国情报所需的安全级别，因此在 2012 年 11 月 7 日，我们将检察官带到司法部总部的一个安全设施，参加了为期三天的会议和强化课程，包括《计算机欺诈和滥用法》、《电子通信隐私法》的培训，以及我们所谓的“互联网
  101”培训，该课程解释了互联网本身运行的技术细节。穆勒和总检察长埃里克·霍德都对这届学生发表了演讲。




  我当时对国家级背景案件可以提起诉讼充满信心，但我们实际上需要提交一个案件作为概念验证，并鼓励其他美国检察官投入资源来发起更多诉讼。我们的开局并不顺利。我们去考量这一想法的第一位美国检察官是部门内部最有公信力的声音之一，但他拒绝了我们。他问道：“我们认为自己什么时候可以起诉——而且我们是否有信心能成功起诉？”我告诉他我不知道需要多久，但我确实认为我们会成功。他推辞了。他解释说他的办公室资源非常匮乏——尽管在
  9/11 之后，高强度、耗时的案件量大幅增加，但许多美国检察官办公室的预算增加却寥寥——而我的想法又是另一项高强度、耗时的赌博。我们在全国范围内听到了这种回声。华盛顿的运作失灵意味着政府似乎陷入了永久的预算冻结，这意味着美国检察官认为他们无法为新项目腾出额外的资源。一位美国检察官告诉我们，如果我们不能确定可以起诉，他就无法指派一名助理美国检察官——他的资源已经捉襟见肘了。


  随后，我们找到了匹兹堡的美国检察官大卫·希克顿。他说话很粗脆：“当然，去他的吧，我会派人去做，”他说。他想对中国硬硬——而且他很有冒险精神。他乐于投身于胜算渺小的案件。


  这起中国案件最终证明是匹兹堡作为突破性网络诉讼中心独特历史的另一篇章。这座老钢铁城转型为科技枢纽，利用了其独特的网络资源，例如国家网络取证培训联盟以及联邦调查局（FBI）最大胆的网络特探之一——J·基思·穆拉尔斯基，该特探曾于
  21 世纪初作为犯罪论坛 `DarkMarket` 的管理员进行卧底。


  匹兹堡团队与我们在司法部总部（Main Justice）的团队紧密合作。在华盛顿，我们为“威胁小组”（Threat Cell）招募的检察官来自全国各地。最初只有三个人：来自亚特兰大的检察官
  `Nick Oldham`；临时从威斯康星州 `Wisconsin` 调给我们的检察官 `Brian Resler`；以及来自纽约南区的 `Adam`。他们每个人都带来了一项关键的专长：`Brian`
  是一位法庭老兵，在组织诉讼方面经验丰富；`Nick` 是美国少数几个组织过复杂网络案件的助理美国检察官之一，他主导了针对金融部门的名为 `SpyEye` 的恶意软件的调查，而且他懂“技术”。正如安妮塔所说：“Nick
  是一个实际上可以帮助构筑数据并理解案件技术层面的律师。”Lisa 必须专门给亚特兰大的美国检察官 `Sally Yates` 打一个电话，才将 `Nick` 临时调到华盛顿（`DC`）。与此同时，`Adam`
  具有反恐经验，并理解如何在法庭上应用国家安全政策。后来，`Sean Newell` 从国家安全局（`NSD`）的情报部门加入了他们。


  我们任命 `Adam` 为我们所谓的“威胁小组”的负责人；当他看到自己的官方头衔“网络调查处处长”时，他告诉安妮塔：“太棒了，我是一个不存在的部门的主管。”他们是一支意料之外的团队；`Adam`
  作为一个受过哈佛教育、来自自认为国家最顶尖美国检察官办公室的老兵，总是穿着司法部非正式制服——深色西装、白衬衫和蓝色或红色领带。`Nick` 是波西州立大学（`Boise
  State`）的毕业生，他融入科技社区的精神：穿卡其裤和皱的衬衫，每天是司法部总部唯一一个穿亮橙色网球鞋上班的人。而 `Adam` 和 `Nick` 这两个干劲十足的
  A 型人格，与低调、随性的中西部人 `Resler` 形成了对比。


  “‘威胁小组”的结构在司法部内部是独特的——一个直接向部门高层汇报的检察官团队——它的独特性本身就传达了我们努力程度的信息。“仅仅让这个小组合法化就是一大步。这被认为很酷。‘噢，很好，国家安全局想玩真的——他们建立了一个真正的东西，’安妮塔回忆道。


  我们必须利用现有资源承担整个项目，因为我们没有资金来启动新项目。正如我们在政府内部所说的，我们是在“白手起家”做这件事，并向国会汇报，让每个人都知道我们正在将资源投入网络领域，尽管这并没有列入正式预算。我们还为团队搜集办公室空间。我们找到第一个地方是位于马纳纳斯（`Manassas`）的
  FBI 北弗吉尼亚居民办事处；`Sean` 和 `Adam` 往华盛顿外一个小时查看他们的新住所，被带进了一个堆满旧电脑的锁房间——他们被安排在一个储藏室里工作。打开门的特探开了灯，推开几把移动椅，指着那堆旧服务器和台式电脑说：“这行，对吧？”


  “这真是一个有趣的任务，”安妮塔回忆道。“在这里——我们没给你们任何东西，但你们能否针对中国发起一起突破性的国际案件？他们是我们最强大的全球对手之一？’”


  团队接受了挑战。“作为一名检察官，中国的威胁一直是特探们热议的话题，”`Nick` 回忆道。在亚特兰大工作讨论潜在案件期间，特探们会讲述他们一直在调查的内容，然后认为司法部对对付中国没有兴趣，便轻蔑地告诉他：“这是一个中国案件，我们没法交给你。”现在他有机会了。这个机会——去做那些长期以来被告知不能做的事情——帮助了我们全国范围内的工作，激励了我们依靠的协助构建案件的众多检察官和特探。“这是一种你可以利用的能量，”`Adam`
  回忆道。“他们有一种挫败感，那是多年来看着一个被告知无法触碰的威胁所产生的。”




  亚当是第一个到达华盛顿的人，他去了 FBI 的 `NCIJTF`，在那里听取了特员们的详细汇报，特员们向他展示了他们在特定事件中识别出的个人中国黑客的证据。最后，特员们表示
  FBI 正在考虑将证据和黑客归因直接向公布。“局里对实现个人归因感到非常自豪，这是正确的，”亚当回忆道。他建议让新的威胁小组（Threat Cell）来尝试一下：“你知道的，我们已经有一个非常好的发布事件公开信息的工具了——那就是一份刑事起诉书，”他说。`给我们一个机会来证明这种新方法`，他恳求道。局里对此表示怀疑。“谁知道这些[信息]来源？”他问道，仍然在这一新领域中摸索。事实证明，所有信息都是在情报部门收集的，这意味着没有一个美国助理检察官被告知
  FBI 拥有这些信息。“没有哪一个时刻，律师会看一眼这些东西并说：‘好了，这可以成为一个刑事案件’的，”亚当回忆道。他还询问了演示中包含的信息存储在 FBI 内部的哪里。`是谁在负责收集这些归因的案件？`事实证明，调查人员在几乎所有的调查办事处都有关于该威胁小组的信息碎片——全国
  56 个调查办事处中有 43 个一直在监控同一个小组——然而，其中三个办事处持有关于个人归因最好的证据。亚当去了这些办公室，与那里的特员和当地美国检察官办公室组织会议，获取证据的简报，并游说他们参与新案件并为这项事业贡献他们的证据。


  从那里开始，团队开始锁定特定的单位和个人，看看哪些看起来对案件有希望。在我们目光所及之处到处都是犯罪——但在那如山的证据中，哪些是可以起诉的呢？在他们改装后的马纳纳斯（Manassas）储藏室里，尼克在白板上画出了不同的可能证据池、不同的数据库，以及如何将它们组合起来以建立一个刑事案件。“当时就像是‘这里有一堆证据，这里有很多坏人，去起诉他们吧’，”尼克说，“前六个月完全是在摸索。”


  我们面临的首要挑战之一是，政府的设立无法以提起刑事起诉所需的精确度来应对网络安全问题。对于情报报告而言，你可以查看一个 `IP address`，看到它正在进行的行为类型，判断它看起来像中国，然后将未来来自该
  IP 地址的所有活动都归类为中国相关。黑客活动量之大，以至于分析师没有时间进行深度调查，以在排除合理怀疑的情况下证明某个事实。但此类结论远不足以建立一份起诉书。“那无法转化为刑事案件，”肖恩·纽维尔（Sean
  Newell）回忆道，他担任团队的“情报耳语者”，负责带领其他检察官了解各种可用信息池，并解释整个情报界中不同机构和单位的角色与能力。


  “我们一直在问大家：‘你们到底有什么什么？’‘监管链条是怎样的？’”尼克说，“在法庭上，仅仅说‘这是中国人入侵的服务器’是不够的，你需要将那台服务器一直追踪到法庭。你需要公司技术人员说：‘是的，我把这个服务器的镜像给了
  FBI，’，你需要证据来证明该 `IP` 确实属于你所认为的人。那么，仅仅说它是一台中国军计算机是不够的，你必须将犯罪联系到具体的个人。到底是谁的手指在键盘上？”


  对于尼克来说，中国案件的早期阶段让他想起了他当一名年轻诉讼律师，在关塔纳摩处理涉疑恐怖分子案件的时光——主要挑战是相同的：如山的模糊证据和情报，其中极少部分符合审判所需的严格准则。他回忆道，日复一日地阅读关于中国的情报报告，这带给他与在关塔纳摩时同样的感受。“我不怀疑这些确实是坏人，但在法庭上，我无法针对他们说出任何指控，”他说。


  随着团队开始工作，他们恰恰代表了 `NSD` 设立时想要实现的目标——律师和情报分析师与执法部门并肩作战，应对关键威胁。我从不擅长发表励志演讲，但正如团队提醒我的那样，我第一次对威胁小组做动气讲话时表现跌到了新低点。我的第一个问题是：“你们要花多久时间？”


  ![](img/00006.jpeg)


  我们的前几个月花在建立协议、收集信息，并学习如何将良好的情报转化为清晰的犯罪活动证据，这些证据需要经受住审判的审查，并证明对个人行为者提控的合理性。很多人怀疑我们的努力会产生结果；我们在匹兹堡调查办事处的特员不断被小组成员调侃，说他们努力工作的结果将像《夺宝奇兵队》的最后一幕一样——圣约之柜被锁在一个箱子里，被推入一个无止尽的政府秘密仓库并被遗忘。“你们将会是那样，”我们的特员被这样告知。`这整个调查将被装箱，永远不会重见天日。`


  威胁小组在马纳纳斯的储藏室里只待了一个月左右，我们就把他们搬到了司法部总部（Main Justice）的一间空房。事实证明，那个房间非常奇妙地合适。二楼的 `SCIF`——敏感隔离信息设施，一个专门设计用于防止窃听的加密房间——曾是我们初创的国家安全部在
  9/11 之后那混乱几个月里首次入驻的地方。然后，它曾作为美国尝试使用新工具对抗新全球威胁的焦点；现在，当我们再次面对对美国生活方式的全新威胁时，它发挥着同样的作用。


  我们遇到的最大挑战之一是简单的官僚主义：每当我与亚当的团队会面时，我都会问他们需要什么以及我能提供什么帮助。他们的回答始终一致且简单：`我们需要一个 FBI 特员，同一个
  FBI 特员，来把案件整合起来。` 而调查办事处的人员通常以小组为单位工作几年，而总部的特员通常轮换频率较高——有时只是来华盛顿进行期 90 天或 180 天的临时派遣——而我们需要一个能够贯穿整个案件的单一特员。当总部的正常流程试图将我们的特员重新分配给其他事务时，我们反复斗争。尽管我在那里工作期间了解
  FBI 的运作方式，这在我看来也是疯狂的——在 FBI 13,000 名特员中，我们只需要其中一个去对抗世界上人口最多的国家，而这对我们来说仍然是一场战斗。特探凯西·哈灵顿（Casey
  Harrington）持续不停地拨电话，劝说全国其他特员从他们的其他案件中抽出时间，对他们的证据进行搜索。案件的 FBI 主管杰弗里·特科利（Jeffrey Tricoli）在处理局部内部动态方面做了大量工作，为我们获取了所需的证据，匹兹堡的特员也是如此，他们依靠其他办事处的同事来配合这些似乎总是像“来自华盛顿的又一个不合理的要求”。





  # 资源挑战与早期运营


  即使对于我们在部门内部被称为“网络岛”（Cyber Island）的威胁小组（Threat Cell）来说，采购基本的办公用品也被证明是一项挑战。刚开始，他们只有一部电话，完全没有安全通信。有一天，亚当·希基（Adam
  Hickey）来找安妮塔（Anita），只是为了要几盏灯；后来随着案件的进展，他们无法获得自己的复印机，于是索要了锁封袋——用于运输机密文件的安全拉链袋——这样他们就得一路穿过整栋大楼去复印。他们的工作是在一种近乎滑稽的预算预算运行的。


  “亚当有一天来找我，想要 300 美元来请一位专家证人，”安妮塔说，“我当时真的不知道去哪里弄这笔钱。我们部门的预算超过 8000 万美元，但我不知道去哪里找这
  300 美元。谁能授权？这笔钱谁来报？”


  # 数据库访问与归因


  威胁小组向 FBI 恳求直接访问其数据库——这是检察官们实际上从未拥有过的权利——当这一请求最终获得批准时，需要在司法部（Main Justice）内部增加新的
  FBI 电脑，并铺设新线路以连接 FBI 的安全网络。由于数据库不易检索，尼克（Nick）花了几个月时间帮助重新调整和重新设计工具，使它们对我们的调查人员有用。


  “任何归因的关键是将已知人物与已知入侵行为对齐，”亚当说，“你提出这一主张的能力取决于你读取数据的水平。”随着研究的深入，证据似乎比我们预想的要强大；詹姆斯·科米（James
  Comey）将中国人描述为在互联网上横冲直撞的醉汉，这似乎是真实的——在网上，中国黑客的路径比我们想象的更容易追踪。“他们太不成熟了——如果说俄罗斯程序员是大学毕业生，那么中国人在黑客方面就像六年级学生，”尼克说，“他们很吵、很粗心。这只是一场数字游戏——如果你向一个系统投入
  100 个人，早晚会有人得手的。证据比你想的要强得多。”


  # 部门内部动态


  亚当以前一直在纽约担任一线检察官办案，他很快就明白在总部级别工作有多么不同——为了获得必要的合作，需要大量的周旋和斡合。亚当没有扑克脸：当他在会议上的挫败感不断增加时，他的脸会变成亮红色。尼克同样对障碍缺乏耐心，通常往往由性格更随和、作为冷静化身的的肖恩（Sean）来向局里平息尼克的请求。肖恩在情报部门的职位上，曾与美国各地的众多
  FBI 团队和助理检察官合作，帮助他们提交 `FISA` 请求，并在他恳求帮助时有深厚的人脉关系可以依靠。


  # 战略目标与公开立场


  在整个司法部，我们的信息是一致的：*我们会建立起诉案件*。在白宫以及与我们情报界同僚的私下会议上，埃里克·霍德（Eric Holder）开始在他司法部目标清单的既有内容中增加一个新的基调。“而且我们正在指控中国进行经济间谍活动，”他说，“[政府其他地方的人]总是觉得这很有趣，但在你获得实物证据之前，人们总是觉得这种远征很可爱——就像在说‘嘿，如果你有时间去追捕中国，那看起来很棒’，”安妮塔回忆道。


  2012 年 12 月，我接受了名为 `Defense News` 的华盛顿媒体的采访，解释了我们的新方法、我们如何创建了新的 `NSCS` 职位，以及正在培训
  100 名检察官来追踪这些犯罪。我解释说，有了这支新的助理检察官队伍，我们希望带来新案件——并可能指名出资和指导黑客的国家。“我给你们一个预言，”我说，“既然现在我们已经有人在考虑起诉这些案件之一了，它就是会被起诉的，你会看到案件被提诉的。”


  我解释说，目标是迫使我们的外国敌手重新计算他们的网络努力——在此之前，他们几乎没有承担任何成本，因此没有理由停止或改变行为。“无论是中国的国有企业还是受国家支持的企业——如果你能弄清并证明他们触犯了犯罪，指控该公司就意味着他们无法在美国或欧洲开展业务，”我，“，“这会影响他们的声誉，从而导致他们重新计算：‘嘿，这值不值得？’”


  # 预期与地盘之争


  这些声明在我看来似乎是无害的，但很快引起了人们的担心，认为我们可能真的会提起刑事。国家安全委员会和五角大楼都给我们打了电话，他们有些失措，以为我们正要提交一个重大案件而没有告诉任何人。我向大家保证我们还有很长一段路要走，但我坚信，一旦有了合适的人来研究，就可以建立案件。我同样坚信，在第一个案件之后还会有更多。但我们面前仍面临巨大的问题：*那些人在哪里——案件又是什么？*回答这些问题还需要几个月的时间，在这些月里，我们也开始面对来自其他国家和外国敌手不断变化的网络威胁。


  在布什政府执政的最后几天，国土安全顾问肯·韦因斯坦（Ken Wainstein）——我曾在华盛顿美国检察官办公室的老板，另一位穆勒团队的校友——试图在修订 `行政命令
  12333 号` 期间将司法部确立为领先的网络安全机构，但将其法化引发了一场地盘之争，他将此推给了下一届政府。这是对未来更多地盘争夺的预演。


  类似的战斗在 21 世纪初发生过，涉及国土安全部和司法部在反恐领域的各自职能；国土安全部的创建是为了“预防”恐怖主义，但它没有获得许多行动资源，而主要的反恐调查机构
  FBI 却被留在了司法部——那么国土安全部到底该做什么？最终，通过多次会议、争论和工作组，出现了一条相当清晰的界限：FBI 负责调查和打击恐怖主义，而国土安全部负责“加固”目标、保护基础设施以及加强恢复和响应行动。穆勒认为我们应该制定一个类似的分工模式。


  很久以后，在 2016 年 7 月，在奥巴马政府后期——这种延迟显示了这些努力在政府前几年是如何缓慢的——该模型被法化为著名的`总统政策指令 41`，即 `PPD
  41`，“关于美国网络事件协调”。


  这就是为什么我非常警惕所谓的“反击（hack back）”辩论，允许私营公司对他们认为攻击他们的网站采取报复性行动——除非你极其谨慎且老练，否则很难意识到在网上到底是谁在攻击你——而且即使你正确识别了最终目标，为了到达那里你往往必须经过多个无辜的受害者。


  最终，随着时间的推移，美国认为这些攻击针对了全球范围内数千家公司，远超最初识别的 33 家。





  我离开 FBI 的计划在 2011 年春天推迟了几个月，当时奥巴马总统意外地要求穆勒再担任两年的局长；穆勒——他已经成为自 J·埃德加·胡佛执任以来任期最长的局长——他同意了留任，部分原因是他觉得
  FBI 的转型仍在进行中，而且延长的任期将帮助他巩固一些文化变革。这次史所未有的延期需要国会通过特别法案，而我留下来协助管理他的连任审查，该申请在参议院以 100
  比 0 的票通过了。


  当我招募安妮塔回到司法部时，她提出了几个条件，令人惊讶的是，这些条件竟然让一贯严谨苟的布伦南在国家安全委员会（NSC）也同意了：只要允许她继续教她的踢拳课，她就愿意来到国家安全局（NSD）。


  当我们正准备启动 NSC 工作时，整个联邦政府因为国会预算斗争而关闭，这一信息随之凸显出来。在 17 天的时间里，政府处于关闭状态，我们的工作因国会的失能而陷入瘫痪。


  根据我的经验，正是这种能量——那种觉得你在触及真实事物的感觉——激发了驱动司法部的职业检察官们；我们整个团队在私营部门本可以赚多多的钱，而且工作时间往往比在政府苦干时还要少，但追求关键调查、识别威胁并采取行动改变其行为的机会是一个巨大的动力。


  ## 第 4 章


  ## “加萨姆网络战士” (Qassam Cyber Fighters)


  伊朗在网络空间攻击我们之前，曾在现实世界中试图攻击美国——而他们开始的目标可能是我能想象的最出意料的：米兰咖啡馆（Cafe Milano），这是位于华盛顿乔治敦区的一家繁忙、嘈闹的意大利餐厅，供应
  43 美元一份的米兰式小牛肉肉排，是安杰莉娜·朱莉和拜登副总统的最喜去处。


  我在国家安全局的早晨总是从我们所谓的“当前威胁简报”开始的，这是进入情报界正在追踪的潜在威胁的每日窗口，其广度和深度足以让大多数美国人的想象力为之惊叹。简报既包括具体的战术恐怖阴谋——我们会对此进行数日、数周甚至几个月的密切监控——也包括由新技术或新地缘政治发展带来的更大战略性挑战。2011
  年春天，我第一次听到一段消息，称美国毒品局（DEA）似乎察觉到了伊朗政府的一场潜在暗杀阴谋，该阴谋的焦点直指那家意大利餐厅。


  随着阴谋碎片的汇合，伊朗似乎想炸掉餐厅以杀害沙特大使。这种伊朗可能试图在美国本土境内实施暗杀阴谋的想法听起来是遥不可及的。我们知道，伊斯兰共和国经常在海外支持、援助或煽动暴力恐怖活动——特别是针对以色列的目标——但认为他们会在美国境内发动攻击的想法违背了分析师们长期以来告诉我们的观点。在此之前，共识观点认为，虽然伊朗和它的恐怖代理人真主党（Hezbollah）利用美国进行募款活动，但在美国境内采取行动或煽动暴力的风险太高，以至于必须先跨越一条国际红线——某些重大的外部转变，例如美国攻击伊朗甚至爆发全面战争。


  美国与伊朗之间的低强度敌意可以追溯到几十年前。今天大多数人都忘记了，我们在 20 世纪 80 年代的大部分时间内波斯湾与伊朗进行了游击战式的，当时伊朗的帆船在霍尔穆兹海峡秘密布设地雷，而伊斯兰革命卫卫队的快速蚊子艇与美国海军舰只进行了遭遇战。在那期间，残酷的伊伊战争导致双方在激烈的陆地战斗中遭受大量伤亡，一场大规模的海军战最终导致海湾地区有超过
  500 艘船只遭到攻击——损失或损坏的总吨位相当于第二次世界大战大西洋战役损失的大半。同一时期，伊朗情报部门开启了广泛的国际暗杀模式——从 1980 年到 1995
  年，美国政府追踪了全球范围内 80 多起伊朗支持的杀人案，其中包括 1991 年 8 月的一起事件，当时刺杀小组在法国进入了沙皇最后一位总理的家中，并用刀刀杀了他的秘书。正如美国历史学家大卫·克里斯（David
  Crist）所写，战争和与美国的冲突在 80 年代吞噬了伊朗的革命热情：“伊朗变得孤立，并充满了深切的挫败感和不安全感。”


  到 21 世纪中期，美国和伊朗再次进入了活跃的影子战争，因为伊斯兰革命卫队和情报安全部向伊拉克叛乱分子提供武器，而伊朗设计的路边炸弹开始对美军造成致命伤亡。2006
  年 12 月，美国在伊拉克逮捕了 12 名伊朗情报官员，其中包括莫赫辛·齐扎里（Mohsen Chizari）少将，他是伊拉克行动的负责人。


  在米兰咖啡馆阴谋浮现前的几个月，国家安全局协助领导了一项针对四位新加坡商人的调查，他们一直从美国非法出口数千万根无线天线并走私到伊朗，美国在这些天线被发现用于针对战场士兵的未爆炸爆炸制制装置（IEDs）中。


  然而，尽管我们关注伊朗的海外活动，但直到 2011 年夏天，伊朗才成为我们眼中试图在美国境内发动攻击的敌人。当时，毒品局和 FBI 合作追查关于米兰咖啡馆的奇特线索：一名毒品局线人报告，他曾受一名曾是二手车销售、近期落魄的伊朗人曼索尔·阿尔巴巴西（Manssor
  Arbabsiar）之托，协助炸毁一个目标；阿尔巴巴西的表兄弟显然是伊朗精英奎姆斯部队的一位将，该部队是伊斯兰革命卫队的一个特种部队组成，而奎姆斯部队想要雇佣这名线人（他们认为他与墨西哥毒枭集团有联系）作为杀手。伊朗愿意支付高达
  150 万美元来协助暗杀沙特大使；如果那个阴谋顺利，还将有其他要追求的目标：攻击华盛顿的以色列大使馆，以及可能在南美的沙特目标。


  这起阴谋是前所未有的。自 1881 年总统加尔菲尔在华盛顿火车站被射杀以来，华盛顿仅发生过两起暗杀案：1973 年以色列军事使节约瑟夫·阿隆（Yosef Alon）被杀——这是在美国境内发生的首起外国外交官暗杀案——以及
  1976 年在杜普顿广场附近发生的汽车爆炸，炸死了奥尔兰多·莱特利埃（Orlando Letelier），他是智利马克思主义总统萨尔瓦多·阿延德的前智利大使，也是该国新独裁者阿尔伯托·皮诺切莱的批评者。





  随后，35 年后，阿尔巴西亚尔（Arbabsiar）出现了。他长期住在科珀斯基督斯市，因当地人以酗酒和与女性寻欢而闻名。当地调酒师管他的绰号为“杰克”（Jack），因为他最喜欢点的是杰克丹尼士忌。当华盛顿的高层会议仍在讨论如何应对新威胁时，阿尔巴西亚尔在夏天期间于墨西哥与线人多次会面，阴谋也逐渐清晰。线人警告说，目标餐厅人气很高，很会有无辜路人成为伤亡。“他们想杀掉那家伙，如果有一百个人陪葬，去他的妈吧，”阿尔巴西亚尔说。他说，即使经常光顾米兰咖啡馆（Cafe
  Milano）的美国参议员遇死也不所谓：“没什么大事。”³


  8 月，阿尔巴西亚尔回到伊朗，在那里他会见了圣卫军领导人古拉姆·沙库里（Gholam Shakuri）以及另一位圣卫军高级军官，审查了计划；他们批准了并告诉他继续进行。我们从未完全清楚这一阴谋渗透到了伊朗政府高层的多深——圣卫军和伊斯兰革命卫卫的运作独立程度是西方政府和军队无法想象的。然而，我们没有人怀疑伊朗——或者至少伊朗政府的某个派系——资助了这场阴谋。通过杀害沙特大使，伊朗可以达到一石二鸟：既让美国蒙脸，又证明了在美国境内执行秘密行动的能力，同时也反击了伊斯兰共和国最大的地区竞争对手。沙特阿拉伯与伊朗仅隔着波斯湾几英里，一直陷入由百年伊斯兰教派分裂驱动的长期影子战争中。伊朗是世界上最大的什叶派组织资助者；沙特阿拉伯则是最大的逊尼派组织资助者。


  2011 年 9 月，阴谋似乎已准备就绪。阿尔巴西亚尔从伊朗打给线人电话询问：“房子粉好了吗？”线人简洁地回答：“我们还在弄。”阴谋正式启动，这加剧了政府内部本就紧张的局势，因为
  9/11 袭击十周年即将临近，我们担心基地组织可能发动受纪念日启发的袭击。缉毒局（DEA）和线人制定了一项让阿尔巴西亚尔回到美国的计划——线人告诉这位伊朗裔美国人，他所认为的残暴“泽塔斯”（Zetas）毒枭要求在执行暗杀期间将他作为质押扣押在墨西哥，以确保他们付款。当阿尔巴西亚尔飞往墨西哥时，他在边境被拒绝入境，并被遣回纽约
  JFK 机场的飞机返回欧洲。当他在转机落地时，被联邦调查局（FBI）逮捕。


  FBI 对他进行了审讯，重点转向了最初的情报收集，使用了一支经过专门训练的审讯小组，既为了最大限度地收集机密情报，也为了公开的刑事起诉保留证据和证词；阿尔巴西亚尔很大程度上配合，甚至成功识别出了他见过的那位圣卫军高级领导人。FBI
  安排了包含七张照片的认认，其中包括一张该伊朗高级官员的非公开照片，阿尔巴西亚尔迅速指了出来。随后，他给他的主要伊朗联系人古拉姆·沙库里打了电话，使用了他们之前约好的代号。阿尔巴西亚尔问道：“我想告诉你，雪兰达已经准备好了——准备好动手了。我应该继续，对吧？”


  “是的，是的，是的，”沙库里说，“快点做，晚了，直接帮我买来带过来就行。”那次对话对美国政府内部产生了巨大影响；政府各层级官员在听到一位圣卫军领导人如此随性地授权并催促在我们首都发动炸弹袭击时（而且地点还是我们许多官员经常用餐的餐厅），感到不寒而栗。


