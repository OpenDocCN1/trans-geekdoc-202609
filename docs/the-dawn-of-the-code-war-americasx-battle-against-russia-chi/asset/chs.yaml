  在此期间，胡赛因通过他的主 Twitter 账号 `@AbuHussain_16` 与全球数十名潜在的伊斯兰国（ISIL）成员和追随者保持密切联系。根据《洛杉矶时报》报道，胡赛因“与至少九名后被美国执法部门逮捕或杀害的人有过接触”。他在线上的鼓励在
  2015 年引发了一场暴力——对于他的招募对象来说是致命的——狂暴活动，这让 FBI 特工在全范围内追踪伊斯兰国招募对象时应不应交。局长詹姆斯·科米后来表示：“FBI
  的人手不从心。我们正在追踪、试图追踪，通过法院令进行电子监控或通过物理手段覆盖几十、上百、上千个我们评估为处于暴力边缘的人。”这种需求是如此巨大，以至于 FBI
  实际上从刑事小组中抽调特工来负责反恐监视。对于处于反恐主义前线的人来说，这是自 9/11 袭击事件以来最黑暗的时期之一。


  我们经常谈论恐怖分子“闪燃到爆炸”（flash-to-bang），即一个潜在攻击者从激进化到发动所需的时间，这个比喻源自点燃炸药引信的“闪光”到炸药爆炸发出“砰砰”声的过程。随着新社交媒体驱动的“在你居住地杀人”的推行，伊斯兰国将我们面临的青年党组织（al-Shabaab）问题——即针对索马里流散人口这一相对特定的地理群体进行招募——转变为一个具有危险不可预测结果的全国性问题。这里没有地理中心，而且潜在的伊斯兰国招募者最初往往并不是宗教人士。在
  2015 年期间，我们发现自己正面对着数十个看似半疯癫的年轻人，他们的“闪燃到爆炸”时间既短又反复无常。没有更大的阴谋需要揭露，也没有行程需要监控。这种威胁跨越地理或种族；35
  个不同的美国检察官区发现自己正在追这些案件。一半的嫌疑人年龄小于 25 岁，而且一个刻在我记忆中的统计数据是，三分之一的人 21 岁或以下。伊斯兰国正在针对我们的孩子。许多案件涉及真正的儿童，以至于我们向检察官发布了特别指导，关于如何在联邦法院处理青少年恐怖主义嫌疑人——这在过去的此类案件中并不是常见问题。


  4 月，胡赛因协助鼓励一名来自亚利桑那州的 30 岁男子埃尔顿·辛普森（Elton Simpson）发动本土圣战。法庭文件指控，两人通过一种名为 `Surespot`
  的加密聊天程序交换信息，5 月初，辛普森和他的朋友纳迪尔·索菲（Nadir Soofi）开车前往德克萨斯州加兰，袭击由反穆斯林煽动者帕梅拉·盖勒（Pamela
  Geller）举办的展览，该展览展示了关于先知穆哈默的漫画，这些描写在伊斯兰教中通常被视为冒犯。胡赛因显然知道袭击即将发生——在他们进攻前一小时，他推特道：“刀已利，很快我们将带着死亡和屠杀来到你们的街道！”


  这两个男人——其中一人使用了安瓦尔·阿尔·奥瓦基（Anwar al-Awlaki）的照片——开了火。FBI 被海量的案件压得应接不堪。这种威胁不再仅仅是一个特定的地理招募小组，而是一个全国性的现象。




  在困难的环境下，每个人都在以最大负荷工作。除了外勤调查小组，我们部门内部的检察官也在竞相安排法庭命令，以帮助识别并合法监控正在发展的阴谋。在联邦 FBI 工作多年后，莉莎·莫纳科（Lisa
  Monaco）和我已经习惯了干练的分析和详细的简报，但当我们调到司法部后，信息似乎变得难以获取了。由于案件管理系统过旧，该部门在应对接如其来的新案件时异常艰难。随着恐怖威胁的上升，我们试图理解问题所在并说服政府其他部门这是一个优先事项，但在编制必要信息时，我们屡屡碰壁。我们的反恐小组负责人迈克尔·穆兰尼（Michael
  Mullaney）似乎是在揉皱的纸上拼凑简报的，但他从不是一个找借口的人，直到我最后问他为什么跟踪看起来如此毫无无章，他才向我展示了他们使用的软件——那是一个名为
  `CaseTrack` 的工具，而部门的其他部分在几年前就放弃了它。国家安全局（NSD）的软件自从九年前从刑事司分拆出来后，从未更新过当时使用的版本。实际上，他每天都在手工清点这个国家的恐怖分子。


  感觉我们只是在等待下一次恐怖袭击。很多时候，似乎是运气让我们保持安全——我们之所以发现某个阴谋，仅仅是因为某个潜在恐怖分子对错了人说话，或者是因为他的设备没故障。总之，根据乔治·华盛顿大学的一项分析，在
  2014 年 1 月到 2017 年初，美国因伊斯兰国有关被捕的 117 人中，超过一半是在 2015 年被捕获的。


  我们在内部对于如何讨论这如潮水般的案件感到苦恼；我们想要发出警报，但不想落入恐怖分子的圈套。如何谈论这种压倒性的——但低水平的威胁，而不让伊斯兰国（ISIL）获得战略上的胜利？我们确实发心地担心朱奈德·胡赛因（Junaid
  Hussain）对招募热潮的影响，但我们不想在公开场合提高他的重要性，导致更多潜在恐怖分子奔向他的家门。他们希望我们的国家感到恐惧；宣扬每一个案件——即使我们成功阻止了它——也只会帮助他们实现战略目标。


  在私下和公开场合，奥巴马总统和拜登副总统试图缓解 9/11 事件后渗透进社会的无不在的恐惧。当我们面对伊斯兰国时，我们看到的案件类型——发起小规模攻击的个人——与本·拉登追求像
  9/11 那样大规模袭击的目标大相径庭。“恐怖主义是一种真实的威胁，”拜登曾一度表示，“但它对美利坚共和国民主国家的生存并非生存威胁。恐怖主义会引发真实的问题。它可以破坏信心。它可以杀死相对较多的人。但恐怖主义不是生存威胁。”奥巴马总统警告工作人员要客观看待袭击：定期在浴缸里滑倒死亡的美国人比被恐怖分子杀死的还要多。我们作为一个国家和一个政府，停止对每种威胁都做出剧烈反应，我们就会剥夺伊斯兰国和恐怖分子实现目标的机会。这是一个微妙的平衡。我从未认同过我们会说服美国人浴缸比恐怖主义更危险的观点。这个国家并没有准备好如此理性地思考恐怖主义；媒体太危言耸听了，而奥巴马被批评为公开表现过于淡定——政府缺乏公开警报反而似乎让人们感到不安全。


  与此同时，外勤探员正承受着 2013 年爱华德·斯诺登泄密的影响。泄密几乎摧毁了美国政府与硅谷之间的任何信任和关系，这些公司的网站承载了这一波由社交媒体启发的恐怖浪潮。我们几乎每天都能看到“黑暗化”（going
  dark）辩论的案例；恐怖分子正在采用加密消息应用，如 `Telegram`、`WhatsApp` 和 `Signal`，使得执法部门即使持有有效的法庭命令也无法拦截他们的对话。彻夜不眠、压力巨大的
  FBI 探员沮丧地哀嚎，因为看着潜在的圣战分子将与胡赛因等分子的对话转移到他们无法阅读的数字领域。*他们在讨论什么？下一个目标在哪里？* 问题的出现时机再糟糕不过了。在两年里，爱华德·斯诺登的揭露恶化了情报机构与技术人员之间的关系，导致我们的请求和警报遭到立刻的怀疑和猜疑。这些硅谷公司建立了强大且意良好的工具，而恐怖分子却利用它们对美国人。然而，这些公司对政府感到非常幻灭，以至于最初在我们寻求帮助时，他们几乎不愿听。


  ![](img/00006.jpeg)


  整个 2015 年，我们经历了等同于战术成功但战略失败的过程——一个接一个地拦截阴谋，但未能阻止来自伊斯兰国的社交媒体灵感浪潮。朱奈德·胡赛因和他的在线招募者恐怖分子构成了几乎所有此类案件的关键环节。我们在每日简报中辩论对他的角色应该公开到多大程度——我们需要将政府资源集中在他身上，但不想把他推得像万米高一样，成为他自身事业的英雄。反对安瓦·阿尔·奥瓦拉基（Anwar
  al-Awlaki）工作的战斗已将他推向了全球焦点，增加了他的权力，我们不想在胡赛因身上重复这种局面。我们敦促五角大楼将注意力集中在“战区”，搜捕胡赛因和其他在线招募者。诚然，他们不是伊斯兰国在地面上的主要行动人物，但他们在远离战场的地方产生了不成比例的影响。胡赛因不再“仅仅”是一个招募者；他是一个行动人物，正试图指导针对本土的袭击。


  2015 年夏天带来了或许最令人不安的一个案件。2015 年 8 月 11 日，胡赛因发布了一系列推文，起初看起来只是他惯常的叫嚣。他宣布：“士兵……将在你们自己的土地上割你们的脖子！”随后他带来了一个惊喜：“伊斯兰国黑客部门新入侵美国军方和政府！”他链接了一个
  30 页的文件，清楚地表明这不同寻常。


  胡赛因的文件以一个令人胆寒的警告开头：“我们进入你们的电子邮件和计算机系统，监控并记录你们的每一个动作，我们拥有你们的名字和地址，我们进入你们的电子邮件和社交媒体账户，我们提取机密数据并将你们的个人信息传递给哈里发的士兵，他们很快将在真主的许可下在你们自己的土地上割你们的脖子！”文件的后续页面包含了
  1351 名美国军人和其他政府工作人员的名字和地址，以及三页联邦员工的名字和地址，甚至是美国军人之间的 Facebook 交流记录。


  这一发布引发了政府范围内的抢修，以确定信息的来源——并可能保护受影响的男兵和女兵。毕竟，考虑到我们已经在波士顿、德克萨斯、北罗来纳州等地看到的案件，胡赛因似乎具备执行其威胁的能力。




  在侯赛因发推特一周后，伊利诺伊州的一家美国在线零售商收到一封来自 `khs-crew@live.com` 邮箱的愤怒邮件。8 月 19 日，这位自称为“阿尔巴尼亚黑客”的作者抱怨道，公司删除了他服务器上的恶意软件，而他利用这些软件非法访问了服务器。“你好，管理员，”邮件开头道，“这是你第三次删除我的文件并让我丢失在这台服务器上的黑客工作了！我曾警告过你，如果你再这样做，我就会公布这台服务器上所有的客户信息！我不想这么做，因为我在这里得不到任何好处！所以你为什么要试着切断我对服务器的访问呢，哈哈？”系统管理员在第二天回信道：“请不要攻击我们的服务器”，此时黑客要求支付两个个比特币——当时价值约
  500 美元——以换取离开服务器，并解释他最初是如何访问的。


  联邦调查局（FBI）能够将发送邮件的互联网地址追踪到马来西亚，他们开始拼凑出一个头号嫌疑人的画像：阿尔迪·费里齐（Ardit Ferizi）。费里齐是一个裔阿尔巴尼亚人，来自科索沃的亚科瓦，该地区深受
  1999 年战争的深远影响。“在北约空袭的第二个晚上，阿尔迪只有四岁，”他的母亲在后后写道，“街道上满了塞尔维亚军队和穿着黑色制服、戴着面具的人。他们尖叫着、叫喊着、射击着，焚烧房屋杀人。”


  在青少年时期，费里齐建立了一个名为“科索沃黑客安全”（KHS）的组织，这是一个亲穆斯林的裔阿尔巴尼亚人集体——正类似于 TeaMp0isoN 一样——他们攻击西方网站，目标直指希腊和法国等地的计算机，以及
  IBM 等公司和国家气象局等机构。2011 年，他们破解了微软的 Hotmail 服务器；在 2012 年 1 月，KHS 在网上发布了约 7000 张被盗的以色列信用卡信息。费里齐通过他的
  Twitter 账号 `@Th3Dir3ctorY` 在网上嘲讽他的目标。


  2015 年初，在费里齐刚满 20 岁后，他持学生签证前往马来西亚，一方面是为了在林可威大学学习计算机科学，另一方面正如我们后来了解到的，是因为该国的宽带为实施网络攻击提供了更好的机会。我们以前见过潜在的恐怖分子将吉道与网络犯罪结合：策划
  2002 年巴厘岛总俱乐部致命爆炸案的男子（那场爆炸导致 202 人死亡），他通过在线信用卡欺诈资助了他的部分攻击；他在 2004 年出版的监狱自传包含一个名为“黑客，为什么不？”的章节。


  费里齐使用他的账号 `@Th3Dir3ctorY` 在 4 月自愿协助伊斯兰国（ISIL），提供服务器方面的帮助，并与另一个 Twitter 账号 `@Muslim_Sniper_D`
  直接交流，该账号属于塔里克·哈马云（Tariq Hamayun），一名 37 岁的汽车修理工，他正在叙利亚与伊斯兰国战斗，名为阿布·穆斯林·布里塔尼（Abu Muslim
  al-Britani）。费里齐向 `@Muslim_Sniper_D` 发送了 67 名美国、英国和法国公民的信用卡信息截图——不仅包括姓名和地址，还有生日和卡安全码。哈马云对信用卡详情表示高兴，并告诉费里齐侯赛因“告诉我很多关于你的信息”，这表明马来西亚黑客已经与这位英国伊斯兰国招募人员取得了联系。哈马云鼓励费里齐：“求你了兄弟，来加入我们的伊斯兰国吧。”


  随后在 6 月 13 日，费里齐破解了位于亚利桑那州菲尼克斯的这家在线零售商的服务器，盗取了超过 10 万客户的信用卡信息。他建立了一个名为“KHS”的用户账户，并使用了一个名为
  `DUBrute.exe` 的黑客工具——这就是他后来抱怨系统管理员删除的那个恶意软件。他筛选被盗的信息，识别出使用 `.gov` 或 `.mil` 邮箱地址的人员。




  侯赛因（Hussain）也遭遇了某种正义。在叙利亚，他远在美国执法部门的触及之外，在一个不受治理的地带。作为 9/11 事件后反恐主义新手段的一部分，政府转向了我们所谓的“全工具”模式，将从刑事起诉、金融制裁一直到动用军事行动的一切手段都用于对付威胁。其目标是，让世界上任何试图攻击美国的人都无法逃脱后果。侯赛因的行为显然使他成为对美国本土的迫在眉睫的威胁，由于我们无法用手铐捕他，他成为了军方的首要目标。


  在我们逮捕费里齐（Ferizi）的几周前，即 2015 年 8 月 24 日深夜，侯赛因独自一人离开一家网吧。正如美国中央司令部第二天公开确认的那样，在 във空运行的美军部队在他车辆位于叙利亚拉格卡（Raqqa）的加油站时，发射了一枚“地狱”导弹。


  爆炸让他当场身亡。


  `Irhabi 007` 在线上的长触角在警察检查他的笔记本电脑时变得清晰，电脑里包含了制造汽车炸弹的技巧，以及一个名为“华盛顿”的文件夹，里面有美国国会和世界银行大楼等华盛顿关键地点的短视频。这些视频让
  FBI 开始行动；五个月后，在代号为`NORTHERN EXPOSURE`的调查中，亚特兰大联合恐怖主义任务小组逮捕了两名来自佐治亚州的青少年，这两名人曾与`Irhabi`
  通信并制作了那些视频。FBI 后后确定，这些男子曾与全球十多个国家的其他恐怖主义嫌疑人有过接触。


  从技术上讲，根据`Title 18 US Code § 2331`的定义，恐怖主义是指“暴力行为……意图在于(i) 恐吓或胁迫平民；(ii) 通过恐吓或胁迫影响政府政策；或(iii)
  通过大规模破坏、暗杀或绑架来影响政府的行为。”


  我们在对抗基地基组织的战斗中获得的一个大关键教训是，我们需要剥夺恐怖分子在海外的避风港，让他们无法在那里策划和计划杀害美国人。侯赛因即便远在万里，也构成了迫在眉睫的威胁。五角大楼表示同；他们理解对抗伊斯组织（ISIL）的战斗是在许多不同的战场上进行的。


  # 引言



  我在 2008 年与巴拉克·奥巴马竞选团队的第一次互动，是向他们解释他们的电脑被中国政府黑客了。八年后，我作为国家安全助理检察官的最后案件之一，是追踪俄罗斯试图通过黑入民主党委员会和希拉里·克林顿竞选团队来影响总统选举的尝试。在此期间，我有幸与国际网络安全战前线的人并肩，帮助对抗不仅来自中国和俄罗斯，还来自伊朗、朝鲜、恐怖分子、有组织犯罪集团，甚至是个人黑客。然而，即使在我
  2016 年离职时，显而易见的是国家针对黑客的努力仍然不足。


  我们曾认为，在朝鲜袭击索尼后，国家已经对网络威胁觉醒了；我们认为在 2200 万联邦政府人员记录被黑入后，这种觉醒已经发生了。但在 2016 年政府任期的最后几个月里，国家安全机构仍在辩论对于俄罗斯黑客事件应该公开说明什么——以及应该多快发言。遗憾的是，答案是太少、太晚了。即便现在，在损害和影响已经显而易见的情况下，还没有迹象表明这些黑客行为导致华盛顿的任何政策制定者发生了我们认为那种激进的转变，以确保我们未来的安全。这种习常性的无知并非什么新发明。早在
  2012 年，我司法部的一位同事克里斯托弗·佩因特（Christopher Painter）曾献出多年生命来对抗网络威胁，他对他所经历过的许多“觉醒时刻”感到沮丧。他当时说，网络安全被一种“带有闹钟睡眠按钮的觉醒时刻”所感染了。正如他所解释的那样，“早期，会有一些让人们非常兴奋的事件。周围会有大量的报道。它们会产生短暂的影响，然后就消失了。”


  这种模式持续。在 2016 年大选遭受攻击后的一年，我们看到了 Equifax 被黑入——几乎每个美国人的个人生活细节都被盗取——随后我们也听闻了自 1995
  年生产的几乎所有设备的英特尔芯片中存在一种新型安全漏洞。这些问题的规模应该让我们清楚，忽视或幻想消除网络安全问题并非解决办法。这场游戏每天都有政府、犯罪分子和其他网络对手在台下进行——然而它正日益对我们的日常生活和个人安全产生影响。


  网络安全不仅仅是一个枯燥的 IT 问题。糟糕的网络安全对美国的生活方式构成了真正的威胁——随着我们越来越多的日常生活转移到线上、进入云端和数字世界，这种威胁只会加速。事实证明，网络安全是现代生活的关键。它对我们银行、购物、学习的方式至关重要。日益，它是我们驾驶、供暖房屋甚至投票的需要。现在已不再有所谓的“电子商务”，只有“商业”。保护我们的数字生活不再仅仅是为了确保我们不丢失家庭照片——而是为了保护我们的价值观、健康、文化和民主。过去十年，国家机器、有组织犯罪集团甚至个人黑客的攻击，威胁到的不仅是对我们机构的信任，还对支撑我们社会的信息的信任，从财务和医疗记录到告知我们社会的信息。


  ![](img/00006.jpeg)


  空间起源温哥华的一条街道。20 世纪 80 年代，作家威廉·吉布斯正走在温哥华的格兰维尔街（Granville Street），那是这座加拿大城市霓虹灯闪烁、缩小版的拉斯维加斯条华街。吉布斯在几年前才开始写科幻小说，并试图让他的思维和该类型文学超越青少年时期对对外太空的痴迷。飞船并没有捕捉他的想象力。“我痛苦地意识到，我的科幻小说缺乏一个舞台，”他后来回忆道。他在此之前的早期作品集中在人类与技术的互动上——即所谓的控制论，研究通信和自动控制系统如何在机器和生物体内工作的科学。




  当吉布森走在灯明亮但破旧的格兰维尔街，路过那些衰败的剧院、披萨店、脱衣俱乐部和当铺铺时，他经过一家视频游戏厅——灵感随之而至。望向内部，他意识到自己正盯着另一个世界；孩子们完全被闪烁的灯光和那些原始胶合板游戏机发出的哔哔声包围。他后来在接受*整个地球评论*采访时回忆道：“我能看到他们姿态中的物理张力，看到里面的孩子是多么专注。”他觉得自己能看到“光子从屏幕射进孩子的眼睛，神经元在他们体内移动，电子流在视频游戏中穿梭。”当然，那只是`Pac-Man`或《太空侵略者》，但这些机器将玩家带到了另一个维度。正如吉布森所说：“这些孩子显然相信投影出来的太空游戏。我认识的每个与电脑打交道的人似乎都产生信念，屏幕后面存在某种‘真实的空间’，一个你看不见但你知道它在那里的地方。”


  然而，计算机真正成为日常生活一部分的时刻似乎仍然遥远；他当时所知的计算机是“谷仓墙那么大”。接着，吉布森经过一个带有苹果计算机广告的公交站，那是由天才斯蒂夫·乔布斯领导的新兴科技公司。他再次停下，盯着广告中那个等身比例的商人看。正如吉布森回忆的，那位商人戴着整齐袖口的手臂正拿着一台`Apple
  II`计算机，而它比谷仓墙小得多。“‘每个人都会拥有这样一个东西，”我心想，“而且‘每个人都会想住在里面,’”他回忆道，“不知为何我知道，所有计算机屏幕背后的概念空间将是一个单一的宇宙。”


  但该如何称呼这个新事物，这个我们将在未来生活其中的新地方呢？吉布森拿出一支记号笔和一个黄色法律用笔记本坐下来开始头脑风暴。他讨厌自己的前两个想法：`infospace`（信息空间）和`dataspace`（数据空间）。在第三次尝试时，灵感降临：`cyberspace`（赛博）。它是完美的——它既意味着某种意义，又空无一切。“当我创造‘cyberspace’这个词时，我只知道它看起来像是一个有效的流行语。它听起来很有启发性，但本质上毫无意义。它暗示了某些东西，但并没有真正的语义含义，甚至对我来说，当我看到它在纸面上出现时，也是如此，”他回忆道。这个词出现在他
  1982 年的短篇小说《燃烧的铬合金》中，并在他 1984 年用于他的处女小说《神经漫游者》时进入了主流，那本书是我小时候读得如痴胶的书。


  在《神经漫游者》中，吉布森通过写这段话引入了这个术语：“赛博空间。这是一种每个国家、数十亿合法操作者每天经历的共识幻觉，是那些正在学习数学概念的孩子们……它是从人类系统中每台计算机中抽象出的数据的图形化表示。不可想象的复杂性。光线在思维的非空间中延伸，形成数据簇和星群。”


  在随后的几年里，这几乎完全定义了`cyberspace`的内涵——一个虚拟与物理世界交汇，并日益重塑对方的世界。那种在世纪之初驱动社会很大一部分的集体幻觉，可以在那个时代的孩子身上窥见。我们中许多最终处于网络安全和网络犯罪问题前沿的人，小时候都是被科幻小说和视频游戏迷住的。我个人来说，简直就是吉布森在温哥华游戏厅里的那些孩子之一。大约当时我和家人去加拿大滑雪，结果我兜里带着价值
  10 美元的硬币，整个下午都沉浸在游戏厅的视频游戏中，而不是在雪道上。对于后来领导 FBI 网络部门的肖恩·亨利（Shawn Henry）来说，那是《星际迷航》中展示的计算机的魔力。对于斯蒂芬·查布宾斯基（Steven
  Chabinsky）这位后来在 FBI 与我一起工作的律师来说，那是 1979 年他的表哥得到了一台`Radio Shack TRS-80`，让他开始玩一款当时顶尖的文字游戏《冒险》（*Adventure*），这款游戏今天已几乎被遗忘，但在许多早期计算机先驱的记忆中占据着重要地位。正如查布宾斯基回忆道：“那个时代当然是没有画面的。你必须输入右转的指令。然后它说：‘一个邪恶的精灵向你袭来：你要做什么？’你说：‘战斗精灵’。然后它说：‘精灵杀了你。’我当时觉得这太不可思议了。对我来说，这就是人工智能。”后来，在高中，查布宾斯基每天放学后工作攒钱买了一台`Apple
  II+`。


  吉布森对新世界的定义也帮助确立了这个新世界的一个持续趋势：是科幻小说作家、幻想作家们指明了我们在现实世界中构建的未来的道路。从《神经漫游者》和《冲击波行者》到电影《游戏大战》，再到像《黑镜》这样的剧集，以及小说和
  2018 年的电影《头号玩家》——关于即将到来的人工智能世界——我们看到了那些有一天将由政府处理的威胁和挑战首先在虚构作品中上演。


  事实证明，我把职业生涯的大部分时间致力于保护这个无形的、不断演变的空间——试图弄清楚如何将物理世界的法律规则施加到瞬息万变的虚拟世界上。答案并不总是显而易见的；毕竟，你该如何对一个你看不见但知道它在那里的地方进行治安执法呢？


  ![](img/00006.jpeg)


  今天，想要真正捕捉网络犯罪的成本是不可能的。这不像 FBI 早期，你只需统计全国被盗汽车的成本，或者加上像约翰·迪林格那样的银行劫匪从门口带走的金额。相反，既有真实的成本——从银行、企业和个人那里被盗取的资金；还有一种更微妙的成本——被黑客破解并为己所用的想法、设计和知识产权。由于数千万人被迫取消并更换信用卡以及处理个人信息泄露带来的困扰，还存在巨大的生产力损失。无论你如何计算，任何保守的估计每年网络犯罪损失都是数百亿美元——特别是当你开始考虑到导致计算机“报废”并迫使公司更换成千上万台机器的破坏性攻击成本时。






  我们知道运行 `botnet` 的俄罗斯和东欧黑客已经盗取了数千万实际资金；当 FBI 计算出高达 `100 million` 美元时就已经停止了计数，我们可以清楚地看到资金流失的情况——包括
  2012 年 11 月 6 日的一笔金额为 `$6.9 million` 的单一盗窃案，以及一家在短短 13 个月内损失了 `$8 million` 的银行。我们与那些被损失所击垮的小企业进行过访谈。FBI
  特探萨拉·K·斯坦利采访了整个爱荷华州的十多名受害者，她回忆起那些对话令人心碎。“这让情况变得糟糕得多，”她说，“当你谈论的是爱荷华州农村的一家企业时，这真的影响了很多人，他们对银行系统的信任也遭了严重影响。”对于那些较小的企业来说，这些损失是毁灭性的。


  虽然政府保护个人免于损失责任，但对于易被抹除的一年或更多利润，并没有此类规定。大多数美国人对中国经济的剧烈增长知之甚少，也不清楚这种增长中有多少是通过窃取美国秘密来推动的——既包括基础技术（如计算和太阳能电池板），也包括军事对尖端战斗机和海军技术的采用。在短短几代人的时间内，中国已经从
  19 世纪的农业经济跨越发展为顶尖的 21 世纪强国，根据衡量标准的不同，它是世界最大或第二大国家。美国的技术研发在无意中让中国在增长的几乎每一个方面都占据了优势。



  但中国窃取行为的长期代价是什么？那些发现自己在亚洲市场被低价竞争对手——或者发现廉价商品被倾销回美国市场的公司，其代价又如何？中国在 във创新的肩膀和背负上建立自身经济的长期代价是什么？如果我们陷入军事冲突，并发现自己的技术被用来对付自己，那么美国军人面临的终极代价将如何？


  自从工业革命和伊莱·惠特尼发明棉花去机以来，美国经济之所以繁荣，是因为我们比地球上任何国家都创新得更快、更出色。然而，在过去的二十年里，我们看到这种领先地位——我们国家的核心精神——正受到外国势力通过数字手段窃取的威胁和破坏，而这些东西在现实生活中是他们不敢窃取的。对于美国经济而言，确保世界各国在公平的平台上竞争至关重要——各国根据自己的创新竞争，而不是通过抢夺他人来获利。



  我们确实知道，网络盗窃对美国人带来了真实的代价，特别是美国作为世界上连接最紧密、最先进的经济体。研究计算，我们每年因网络盗窃损失约 200,000 个工作岗位，大约相当于
  2016 年整月的就业增长。这意味着爱荷华州德梅斯或阿拉罗巴马州伯明翰的全部人口，每年都会因为数字盗窃、盗版和间谍活动而失业或失去工作。欧洲也面临着巨大的损失，每年可能多达
  150,000 个工作岗位，相当于英国牛津的全部人口。在当今的环境下，公司的安全成本也不低；格雷格·拉特雷（Greg Rattray）曾是帮助开拓对抗国家级网络斗争的空军军，如今担任摩根大通（`JPMorgan
  Chase`）的网络安全负责人，他负责监督一项每天在数字安全上花费超过 `$2 million` 的庞大工程。


  ![images/00006.jpeg]


  美国在网络空间仍然保持着独特的强大——和独特的脆弱性。目前如此。得益于政府在冷战期间为建立去中心化通信网络的最初投资（他们希望这有助于度过核战争），原始互联网和计算机革命很大程度上发生在美国。我们今天所认为的计算机兴起实际上是两个独立的演变：一个是侧重于大规模企业和政府计算机的使用，中心位于东海岸的国防公司和
  `IBM` 等早期科技巨头之间；另一个是更具有机性的个人计算革命，中心位于西海岸的斯坦福大学、伯克利大学以及后来的硅谷（`Silicon Valley`）。





  直到 21 世纪 00 年代，美国继续在在线领域占据主导地位：2007 年，国家情报总局长迈克·麦康奈（Mike McConnell）看到了一张由互联网公司`VeriSign`提供的图表，显示全球
  80%的数字流量流经美国的电缆和服务器。2007 年，每五个比特和字节中就有四个通过美国，这实际上代表了与互联网早期的显著下降。在 20 世纪 90 年代，时任白宫网络协调员理查德·克拉克（Richard
  Clarke）被告知，全球 80%的互联网流量仅通过美国的两座`buildings`：这些建筑被称为大大区交换中心——`MAE West`和`MAE East`——这两座鲜为人知的沿海建筑汇聚了来自全球的互联网连接。它们创建于

  0 世纪 80 年代和 90 年代，当时美国政府正将互联网骨干网转向私营部门；人们对安置地点几乎没有深思熟虑，创造者也不理解它们未来将变得多么关键。东部交换中心是由一组工程师在
  1992 年于一家墨西哥餐厅吃午餐时计划的，最初位于弗吉尼亚亚州维恩纳（Vienna）一个地下停车库内一个被围起来的角落。它很快就超出了停车库的容量——不久后处理了全球整个互联网流量的一半——但实际上一直“隐藏于大市之中”，随后搬到了附近泰森斯角（Tysons
  Corner）一栋不起眼办公楼的五楼。西部交换中心则位于加利福尼亚州圣何塞市中心的 15 层楼`Market Post Tower`内。


  互联网最初的创造者中很少有人理解它将对现代生活变得多么不可或缺——即他们在一小群信任且熟悉的同事之间建立原始网络时所做出的决定，在未来的道路上将导致一场在日常生活中无处不在的技术变革，用户数量将从几亿增长到数十亿。“物联网”的兴起只会加速这些连接：到
  2020 年，连接到互联网的设备可能多达`200 亿`个。


  在互联网的早期，安全往往是事后考虑，身份验证程序几乎闻所未闻。早期互联网连接了一个由志同道合的工程师和科学家组成的小社区，他们从本质上相互信任。在互联网增长的每一个阶段，我们都系统地低估了这些系统未来被不道德之徒利用的威胁。


  这种差距在某种程度上是故意的。正确地对事物进行加固可能是缓慢、昂贵、耗时且令用户烦恼的。“根本性问题是，安全总是困难的，人们总是说：‘哦，我们可以以后再处理’，或者‘我们可以以后再加上’。但你不能以后再加，”彼得·G·
  纽曼（Peter G. Neumann）回忆道，他自 1985 年以来一直在跟踪计算机安全问题，“你无法在一个设计之初就没考虑安全性的上添加安全性。”程序员往往只是快速地将产品推向市场，然后在漏洞被指出时再更新漏洞和脆弱性。这太常见了，以至于有它自己的名称：`patch
  and pray`（打补丁并祈祷）。


  作为 20 世纪 90 年代互联网首席协议架构师的大卫·D·克拉克（David D. Clark）回忆道，互联网最初的创造者中很少有人理解它将对现代生活变得多么不可或缺——即他们在一小群信任且熟悉的同事之间建立原始网络时所做出的决定，在未来的道路上将导致一场在日常生活中无处不在的技术变革，用户数量将从几亿增长到数十亿。“物联网”的兴起只会加速这些连接：到
  2020 年，连接到互联网的设备可能多达`200 亿`个。




  这种扩张伴随着我们尚未充分应对的风险。连接性的增强使得我们的关键基础设施——水利、电力、通信、银行以及我们最私人的信息变得更加脆弱。在过去的几十年里，我们投入了巨资使生活数字化，但我们在进行这些投资时，系统性地低估了对数字安全的风险。在国家基础设施上，我们不能重犯在将信息从模拟转向数字化时犯下的同样错误。正如我在
  2016 年的演讲中所说的：“你们看到一个恐怖分子开着一辆卡车在尼斯能做什么。当你拥有一支无人驾驶卡车队时，会发生什么？”今天，没有任何联网设备能免于来自坚定且先进的敌手的威胁，因此，思考在线安全不仅需要关注建立更强大的防御，还需要通过政策和法律执法手段创造威慑机制，并强调风险管理和韧性技术，以帮助受害者在不可避免的攻击发生时恢复。。我们必须创造性地思考未来的互联网应该如何构建和连接；在自动汽车时代，没有理由让运行汽车音响的计算机系统与运行刹车的系统连接在一起。


  我有时会用这样一个比喻：我们住在互联网上的草屋里，但当狼靠近门口时，我们不仅没有寻找更坚固的房子躲避，反而继续向我们的草屋里塞进越来越多的东西。过去的 25 年里，我们将社会中几乎每一份价值的数据都移到了线上，现在我们也在迅速加速将东西搬到线速度——我们的家、汽车、医疗设备。我们知道狼就在那里，但我们正把越来越多的生活投入这栋脆弱的房子。随下来的书中很大一部分是关于追捕那只狼，但只要我们继续住在草屋里，抓到狼也无法解决问题。总会有另一只狼出现。


  ![](img/00006.jpeg)


  我最担心的是，我们已经看到了未来道路上的缺陷。来自敌手的在线攻击凸显了我们几十年来的想象力匮乏，美国系统性地低估了经济、信息和日常生活数字化的风险。攻击总是发生在意想不到的地方——并以意想不到的方式发生。我们中没有人能预测到，第一场影响美国本土的破坏性在线攻击将针对一家拉斯维加斯的赌场公司；我们绝不会把一家好莱坞电影制片厂放在北朝鲜目标名单的首位；我们也完全没想到俄罗斯首次通过
  `Twitter` 并发布约翰·波德斯塔的意大利饭配谱来攻击我们。


  理解我们如何从现状向前迈进——网络犯罪和坏分子威胁着这个全球最大的经济引擎的未来——需要理解犯罪是如何在网上发展的，以及我们的敌手在网上带来的独特挑战，以及这些每一个事件给政府和私营部门带来了什么教训。


  法律进入网络空间花了很长时间——其中一些是设计意为之的。互联网最初的设计初衷是无国界的，对外部世界开放，免受即使是最民主政府的专政统治。这一命题最终被证明是不可行的——即使在互联网的早期阶段，正如你将看到的，人们就在信任问题上挣扎——但这种最初的、开放的意识形态，专为便于研究目的之信息传播而设计，如今却支撑着从银行、股市到核设施、大坝和电网的各个系统，并且在未来几年里，它将越来越多地指导我们个人通信、交通和医疗护理的所有方面。


  在重新审视互联网历史时，今天混乱的世界完全是可以预见的。互联网和当今数字世界的缺陷在创建之初就已经存在了——事实上，今天的缺陷最初被视为新世界的优势。正如前国防情报局局长几十年前所说：“在过去，我们对这种能力在技术上并不惊讶。我们惊讶的是这种能力被使用的方式或环境。”


  在冷战结束一代后，我们发现自己今天正处于一场“代码战争”（Code War）中。与冷战一样，这根本不是一场战争。它是一个复杂的、多维的、国际紧张时期，需要政府和私营部门投入资源和注意力。在某些方面，它比冷战复杂得多——在冷战期间，我们面对的是一个具有明确意识形态的可定位的单一对手；而今天，我们面对的是一个受匿名和脆弱性困扰的世界，不断变化的敌手在任何一天可能是国家、恐怖分子、犯罪分子、黑客分子或寻求乐趣、利润或破坏的个人。


  为了应对这个问题，我们必须发挥创造力并依靠多种力量工具，从刑事起诉到国际制裁，再到进攻性网络攻击。正如我们在冷战中所做过的，我们要与志同的国家建立关系和联盟，强调我们对法治的共同信念。我们必须建立国际威慑机制，以确保坏分子不会认为他们可以不受惩罚地进行攻击。我们必须将这些讨论和情报带出阴影。这场代码战争永远不会像冷战那样整洁和简单——公平地说，冷战也不整洁也不简单。我们面对的是一种内在的非对称威胁，一个我们处于极度易受攻击地位的格局。


  我们一直在努力定义这种威胁，部分原因是“黑客”（hacker）这个词本身随着时间的推移而演变，涵盖了极其多样的行为；组织管理专家推崇“生活技巧”（life hacks）；硅谷大公司继续拥抱其技术起源时的那种精神；`Facebook`总部的地址是梅洛帕克的黑客路（One
  Hacker Way）。这种多方面的命名法增加了网络空间治理的难度。法律和媒体倾向于清晰、易于定义的术语。无论恐怖分子使用什么工具，他都是恐怖分子。犯罪分子可以存在于线上，也可以存在于线下。但黑客可以是好是坏，可以是欢迎或侵入。


  尽管黑客是一项需要知识和经验的技能，但黑客不需要（通常也没有）正式培训。进行恶意活动和规避检测所需的设备廉价且易于获得。结果，我们面临着由各种驱动的网络威胁——从俄罗斯犯罪集团到基地组织和伊斯兰国，再到外国情报及其代理。正如学者本杰明·维特斯和加布里埃拉·布鲁姆指出的，网络空间是一个充满分布式威胁、易于获取的武器和普遍脆弱性的的世界。


  罗伯特·穆勒在 2012 年曾说，“世界上两类公司：一类是被黑客攻击过的，另一类是还不知道这的。”近年来，在线数据库出现了大量被盗的用户信息浪潮——其中包括对
  `Yahoo` 账户的一次攻击，导致十亿用户的信息被盗取——而这些通常不安全的公司数据库正不断收集更多关于美国人的数据。




  这种趋势在政府侧同样真实。在我在政府处理这些问题的近十年里，几乎每个政府机构都面临过网络攻击。`FBI`和`CIA`的网站都曾被黑客主义者击下线。国会山山的众议院和参议院都遭受了数据泄露。农业部在
  2006 年的一起盗窃中，26,000 名员工的信息被盗；商务部在 2012 年遭受恶意软件攻击后，实际上不得不断开网络连接；国防部一些最有价值的武器系统被盗；教育部一个资助评审员的数据库被搜查；能源部和国家实验室的核能信息经常受到攻击；交通部和财政部的网站都曾被击线下；甚至退伍军人事务部也遭遇了重大数据泄露。以此此类推。我本人参与了政府对这可能是史上最大的盗窃案的危机响应：人事管理局每位联邦员工的记录被盗窃。


  攻击者盗取了 2150 万名联邦员工的职业、财务、医疗和个人详情档案——其中包括一些在我们政府最高层级工作的员工。被盗取的信息价值连城——既有助于锁定并识别美国美国情报官员，也有助于在未来的间谍招募中锁定其他美国员工。曾担任特朗普总统首任白宫网络安全协调员的罗布·乔伊斯（Rob
  Joyce）表示，他在不同的数据泄露中社会安全号码被盗取过六次。


  这是我们在奥巴马政府期间面临的局面：规模广泛的威胁——中国、俄罗斯、伊朗、北朝鲜，以及像 ISIL 和叙利亚电子军队这样的非国家实体——每一个都代表了不同的动机、不同的能力以及对美国国家安全和福祉的不同威胁。在每一个案例中，我们都想证明自己能够查出是谁干的，并向美国公众公开提供这些证据，然后让政府施加可证明的后果——无论是国际制裁、外交惩罚、军事回应，还是起诉（或者，更好，是逮捕和认罪悔罚）。我们希望这种新方法能帮助将网络安全从一个充满秘密的世界转变为一个我们可以公开应对威胁的世界。


  这本书讲述了我们如何开始利用我们能使用的一切工具（从手铐到国际制裁）来施加代价。然而，这个故事远没有结束——而且在许多方面，实际上情况仍在恶化。接下来的内容绝非我一个人的故事；事实上，恰恰相反。


  当你在司法部担任检察官时，你学到的第一件事就是这份工作比你伟大。几乎每个检察官都记得那个时刻：你第一次向法庭介绍自己代表美利坚共和国出庭的时候。我在宣誓律师后的几周内就进入了法庭，起诉一起轻微家庭暴力案件。我提前排练了那句台词：*早上好，法官大人，我是约翰·卡林（John
  Carlin），代表美利坚共和国。* 即使是排练也产生了共鸣。你的言语以及你的举止代表着比你自己更大的使命，这种感和责任感会在多年里深入人心，并改变你看待自己的方式以及承担部门和政府使命的方式。多年后，作为时任
  FBI 局长`Mueller`的幕僚，我的工作包括审查他所有的公开演讲、内部和外部报告。穆勒认为他使命的核心是服务美国。他对这种准则近乎狂热：禁止使用第一人称代词“我”；几乎总是用“我们”取代。如果我们漏掉了一个，他随手画的红色`X`就会捕捉到。


  “我”经历了这个故事的大部分——但“我们”共同应对了这种威胁，这是一支由探员、分析师、律师、官员甚至许多私营部门合作伙伴组成的庞大团队共同努力——这始于我加入司法部很久以前，并在我离开后现在仍在继续。这段关于美国如何学会攻击网络威胁的叙述，基于我个人的经历，以及对其他参与者的数十次访谈和数千页的法庭文件、行业研究报告和新闻文章。（而且，根据正常程序，司法部已审查此文本，以确保其不会泄露机密材料。）这构成了一个奉职公职人员的故事——检察官、联邦探员和情报部门官员——他们与同样奉职的私营部门安全研究人员、才华横溢的网络工程师以及先驱合作，试图在一个最初被设计为不受治理但如今支撑着我们日常生活的空间建立法律秩序。


  ![](img/00006.jpeg)


  任何对黑客攻击的回都包含两个同样重要的部分：溯源和威慑。这等同于任何刑事司法程序：有负责破案的调查员，也有负责起诉的人员。


  在网络领域，美国长期以来长于前者而弱于后者。被称为“国家情报评估”的政府报告代表了国家情报机构收集并达成共识的思想，长期以来一直识别并命名了美国在网上面临的四个主要国家对手：中国、俄罗斯、北朝鲜和伊朗。总计约有
  108 个针对美国的外国情报机构，但前四个代表了比其他任何人都更大的威胁。然而，在过了很之后，我们才对他们采取了公开行动。


  我经常发现，那些没有深耕网络安全的人仍然认为解决网络犯罪几乎是不可能的，认为这都只是在全球电缆中无形移动的匿名比特和字节。但事实是，通过坚持、资源和努力，我们能够解决许多——有时甚至是大部分——网络攻击。这无疑是一场艰苦的战斗——尤其是因为许多攻击和犯罪是由海外拒绝合作或起诉的嫌疑人实施的。




  黑客和我们其他人一样拥有社交媒体账号和手机，他们利用这些工具与朋友家人联系并分享专业新闻。正如 FBI 探员埃利特·彼特森（Elliott Peterson）所说，他参与了过去十年中一些规模重大的网络案件，“他们一直以来都是犯罪分子，但他们一直以来都是实实在在地的人。你可以利用他们的破绽。”在彼特森的其中一个案件中，FBI
  识别出一名俄罗斯黑客，因为他在运行自己的在线垃圾邮件帝国和登录 Apple iTunes 等网站时使用了同一个密码。在另一个案件中，彼特森和他的同事发现了另一名黑客穿着豹纹睡衣的脱敏照照片——这名黑客曾领导了一场骗取数亿美元的在线金融诈骗——因为他们能够将其追溯到其使用真实名的社交媒体网站。


  黑客自有的恶意软件通常很粗糙，包含自己的线索或漏洞。2011 年，来自格鲁吉亚共和国的一个团队为一个在其网络中搜寻的黑客设下了陷阱：他们隐藏了一份引人注目的文件，标题为《格鲁吉亚-北约协议》，该文件实际上含有自身的恶意软件，一旦被外泄并下载，格鲁吉亚团队就可以打开黑客的摄像头，拍下他穿着黄色衬衫、蜷缩在电脑前检查他偷来的战利品的样子。2018
  年，研究人员宣布，他们能够将某特定攻击追溯到朝鲜，在某种程度上是因为该黑客用自己的恶意软件感染了自家的电脑。


  同样地，黑客使用的大多数方法并不是那些所谓的、高明的“零日漏洞”——即软件或硬件中隐藏且未知的缺陷，这些漏洞在在线市场上可以卖出高价。事实上，网络世界中很少有东西是依赖于复杂的黑色魔法的。


  大多数黑客攻击——即使是破坏性最强的——也是通过相对不复杂的手段，利用了显而易见的漏洞：未安装的软件补丁、保护敏感数据的弱密码或默认密码，或者是“钓鱼”技术（即用户点击了电子邮件中的恶意链接，并允许黑客访问其账户）。防御网络攻击不需要某种高级形式的巫术或魔法——在许多方面，这些威胁利用了显而易见的人性弱、懒惰和可预测的行为。正如罗布·乔伊斯（Rob
  Joyce）在我们的一次对话中说过的：“这归根底在于做好基础工作。许多此类问题——这些入侵——都可以通过处理安全的基础防御和拦截来解决，无论是打补丁、拥有良好的架构、预先了解威胁所在、拥有日志、监控、观察以及处理它们。”


  对我们来说——作为社会的一员、作为公司以及作为个人网络用户——理解大多数此类攻击是可以预防和避免的，这至关重要。而且当这些攻击发生时，我们通常可以确定是谁为。




  中国在网络上的表现非常嘈杂——似乎在肆意掠夺而不在乎是否会被注意到——但当他们的活动被另一个政府公开时，他们又会感到深感尴尬。中国几乎完全聚焦于经济和军事利益——试图加速该国的技术进步和知识获取。如果中国想在某个领域进行加速和创新，你一定能看到他们瞄准了在该任务上表现出色的西方公司。由于对国内政治稳定的高度关注，中国还转向互联网来监控和针对人权活动人士，并开展国家级情报行动。


  随着地缘政治的演变，这些方法也随之进化。例如，随着俄罗斯在海外变得更具侵略性——在格鲁吉亚和乌克兰等地发生现实攻击——它在网络上也变得更加激进，这种模式以一种复杂且多维度的方式结合，体现在其影响
  2016 年总统选举的努力中。当我们看到弗拉基米尔·普京政府巩固控制权，实际上变成一个黑手党国家（政治机构、情报界和组织犯罪全部融合成一个不可分割的、头章鱼）时，我们在网络上也看到了同样的行为——那些专注于金融盗窃和欺诈的成熟犯罪分子和组织犯罪集团，突然重新部署同样的工具来帮助俄罗斯收集地缘政治情报。在美国内部，他们的网络行动从盗窃转向主动的情报行动，例如针对
  2016 年选举的行动。


  随着时间的推移，这些对手一直在成长——甚至学会了相互学习。在过去的十五年里，我们看到了网络威胁演变的三个不同阶段，而我们显然正在进入第四个阶段。



  在开始，我们看到中国在网络上从事简单的经济间谍活动——直接窃取企业和政府秘密。中国政府以及其执政并深度交织的中国共产党是一个庞大复杂的官僚机构，拥有各种竞争利益和派系，就像美国一样。同样，中国是世界舞台上一个理性的行动者。由于他们的盗窃行为明确是为了获得经济利益，这对他们来说是一次经过仔细计算的成本效益分析；多年来，盗窃带来的收益和经济机会明显超过了从远处施加给他们的成本。中国向我们提出的挑战非常直接：我们如何改变这种成本效益分析？我们如何操纵政府杠杆，对这种直到
  21 世纪 00 年代后期一直是后果自负的入室行为施加成本？



  伊朗在 2000 年代后期开始进行破坏性攻击——始于一个经常被忽视的在美国境内采取行动的计划，试图在华盛顿的一家餐厅暗杀沙特大使。然后——在他们自己遭受数字攻击之后——他们转向了针对外国的数字攻击，首先是沙特阿拉伯，然后是美国，目标是拉斯维加斯的一个赌场老板和华尔街金融部门。他们的行动为我们政策制定者提出了一个新问题：面对一个故意使用不对称战争的对手，而且他们还没有采取所能做的最具破坏性的事情，你该怎么办？


  与伊朗的斗争发生在更宏大的地缘政治背景下，涉及中东地区以及美国（当时伊朗正推动就核计划达成协议）。伊朗传统上也更多是一个国家行动者——他们的行为通常具有地缘政治逻辑——但考虑到伊朗政府、军队和情报机构内部权力斗争的复杂性，在事件发展过程中，我们甚至不确定有多少有多少攻击是由伊朗领导层鼓励或指导的。


  伊朗行动者对沙斯赌场（Sands Casino）的攻击可以说是美国境内第一次破坏性的国家级网络攻击——尽管它对华尔街的分布式拒绝服务（`DDoS`）攻击造成了损失，但我将其归另一类，正如我稍后解释的那样——沙斯赌场的攻击发生又消失，并未在国家雷达上引起任何波澜。



  第三阶段由朝鲜开启，这是一个臭名昭彰不可预测的国家行动者。其黑客长期以来一直致力于抢劫银行，依靠中国等国外以外的基础设施。但随后，朝鲜发动了一次破坏性攻击，并利用社交媒体放大其影响——它对索尼的攻击在某种是一种是一种攻击。


  在随后的几年里，我与几十个评估网络威胁的团体进行过交流，几乎每个人都没有将 2014 年初的沙斯赌场攻击视为美国的第一次破坏性网络攻击；他们指向了对索尼的攻击。为什么人们记得索尼？索尼的破坏性与沙斯不相上下，但我们记住它并不是是因为用于擦除公司电脑硬盘的恶意软件。索尼涉及了知识产权的盗取——价值数百万的知识产权——但我们并没有因为被盗的知识产权而记住它。我们甚至没有把索尼视为对言论自由和美国民主的攻击，尽管它确实如此，正如伊朗对沙斯的攻击以及俄罗斯对
  2016 年选举的攻击一样。


  我们今天记得索尼，是因为黑客击中了系统最薄弱的部分——电子邮件，并通过使用社交媒体将这些信息武器化。然后，朝鲜让主流媒体关注了这些泄密并按照黑客的意愿办事，通过播放他们最核心的秘密给公司造成了声誉和财务损害。


  遗憾的是，索尼留下的这部分遗产——现在回想起来显而易见——并没有引起政府和私营部门的重视。我们学到了错误的教训；我们专注于威慑破坏性攻击者并加固我们的网络系统。与此同时，俄罗斯观察了索尼黑客事件，并学会了被盗信息影响舆论和破坏对机构信任的力量。俄罗斯还看到美国社会如何迅速地指责并孤立受害者索尼，而不是团结起来反对入侵者。


  事实证明，索尼攻击代表了跨越卢比河：结合媒体对维基泄露（WikiLeaks）和爱德华·斯诺登的经历及全球反应，朝鲜知道媒体机构——无论有些声誉良好还是不好——都会抢于报道这些泄密，在几乎没有自我反思的情况下放大盗窃行为。如果朝鲜只是把一份偷取的公司高管薪水表格发送给记者，他们就会迅速发布。特别是在数字时代加速的新闻周期中，媒体已经决定，被窃取的内部秘密的“新闻价值”超过了由于获取这些材料的方式所引发的任何伦理困境。


  索尼攻击开创的战术，与俄罗斯后来用来影响我们 2016 年选举的战术完全相同。我们看到这些战术相互叠加。当俄罗斯考虑是否将从民主党全国委员会窃取的电子邮件武器化时，他们从朝鲜对索尼的攻击中得知，媒体会吸收并毫不延迟地发布被盗的电子邮件。




  今天，我们正面临第四个时代，我担心这一时代将看到对手——包括国家和像 ISIS（ISIL）这样的非国家行为体——将网络攻击与现实世界的“动能”攻击相结合。在格鲁吉亚和乌克兰等地区，我们已经看到俄罗斯将物理军事攻击与网络行动相结合，针对关键网络基础设施，关闭电网、阻止对政府网站的访问等，这一切都是为了瘫痪并减缓入侵目标的反应。在国家安全部门，我们担心会发生类似的所谓“混合恐怖袭击”，即恐怖组织在实施炸弹或攻击的同时，可能使紧急通信陷入离线或导致当地医院停电。我们已经看到英国的医院因勒索软件攻击而瘫痪，急诊室关闭，手术程序被取消，因为恶意软件冻结了计算机系统。在金融领域，我们看到高明的黑客施出了他们自己的“攻防二连拳”：通过针对欺诈的恶意软件盗取数百万美元现金，然后通过
  DDoS 攻击袭击银行服务器，转移银行官员的注意力，直到资金安全流失。我们也知道下一个威胁将来自哪里：对手已经开始针对所谓的“物联网”设备。


  此外，正如我们开始看到的，网络攻击针对的是我们社会中一个特别险恶的漏洞。在过去的十年里，我们主要将网络安全认为是数据的盗取或泄露，但日益增加的来自于数据的篡改和破坏。网络安全的下一个大恐惧是破坏信任——银行不确定其记录是否正确，军事指挥官不确定自己的位置或雷达是否正确，公民不确定他们的选票是否统计正确。我们在现实世界中已经看到了这一点，例如
  `Stuxnet`，这是一种针对伊朗核系统的恶意软件，它让机器发生故障，导致其科学家认为是自己犯了错误；现在还有推特和 Facebook，像俄罗斯互联网研究局等组织的努力让我们产生怀疑：网络上的那个声音是真人吗？那是一个真实的新闻或头条新闻吗？


  应对、响应和反击这些新威胁需要新的工具和新方法——以及思考我们传统使用地缘政治工具方式的新方法。


  ![](img/00006.jpeg)


  互联网的兴起给世界带来了复杂且前所未有的威胁；它从六个基本维度模糊了——并将在未来几年内进一步模糊——我们对世界的理解，这些维度使得互联网对于政府以及我们过去几个世纪在社会周围精心建立的法律框架来说特别具有挑战性。



  在过去的十年里，战争日益成为律师的领域，尤其是当许多现代对手——从基地基地组织到 ISIS——并不是明确定义的国家时。律师审阅拟议的无人机和空袭行动，在秘密行动获批准时坐在场旁，并为战地上的官兵和士兵提供详细说明，告诉他们何时可以射击，何时应该停止火力；我们拥有完整的手册，例如
  180 页的美国陆军《陆战法》和五角大楼 1176 页的《战争法手册》，这些手册列出了美国在国际法、条约和协议下承担的义务，以尽可能减少战争对平民的影响并控制战争的极端残忍。²²
  五角大楼总律师在 2015 年版五角大楼指南引言中写道：“战争法对美国具有至关重要的意义。战争法是我们的一部分。乔治·华盛顿作为大陆军司令，与他的英国对手达成一致，认为革命战争


  在随后的几年里，我们的政府以及世界各国的政府已经建立了一套复杂的官僚框架和清晰的政策，承认和平与战争之间非黑即明的区别。但互联网让国家（以及非国家组织）具备了某些看似远超了和平界限但尚未达到实际战争程度的行为。今天，根据网络安全专家
  `Adam Segal` 的统计，至少有 41 个国家拥有网络战理论，至少有 17 个国家拥有进攻能力。[²³part0018.html#en063en) 我们并不真正如何定义这些工具。如果中国军官入侵了位于俄勒冈州希尔斯堡的
  `SolarWorld` 制造商总部，我们会知道那是战争行为，就像如果朝鲜空军轰炸并摧毁了索尼在洛杉矶的办公室，我们会将其视为战争行为。如果冷战期间，苏联克格勃（KGB）特工闯入华盛顿民主国家委员会总部，毫无疑问美国会采取惩罚性的跨党派报复行动。但当这一切都发生在虚拟世界时，会怎样？



  从冷战开始直到在此之前的几个世纪，国家国防一直是政府自身的专有。事实上，可能比任何事情都，防御是政府的主要责任，确保其公民免受侵略者的骚扰并能够不受威胁地生活。然而，在网上，保护的大部分责任落在私人公司身上，这需要新的伙伴关系和国家情报共享，而我们的政府一直难以适应这种模式。在冷战期间，我们没有要求像康罐汤（Campbell
  Soup）或福特（Ford）这样的大公司建立自己的空军或导弹防御系统来应对苏联的轰炸机，但今天，私营部门——无论是像波音这样的大公司，还是像爱荷华州和俄勒冈州
  `SolarWorld` 这样的小公司——都代表了网络威胁的最前线。正如 `Obama` 总统 2015 年在硅谷所说，网络安全“必须是一项共同的任务”，因为“我们的大部分计算机网络和关键基础设施都在私营部门，这意味着政府无法独立完成这一点”。






  地缘政治和军事战略家一直在密切关注 20 世纪武器装备的溢出效应，随着技术的进步，那些长期以来仅由资金充足的国家部署的大规模杀伤性武器，已落入能力极强的恐怖组织和反叛组织之手中。


  今天，个人甚至可以无意中部署大规模杀伤性武器——制造化学和生物武器。最近，我们还看到第一个互联网病毒 `Morris Worm`（莫里斯蠕虫）是由一名研究生释放的，他并不理解自己的程序将造成的破坏。如今，像匿名者（Anonymous）和“爱国黑客”这样的恐怖组织可以引发扰乱，让世界上最强大的国家也无法清楚特定目标为何被攻击，以及是谁攻击的——显然不是立即知道，有时根本不清楚。正如亨利·基辛格所说：“当个人能够承担日益增长的野心时，国家权威定义可能会变得模糊。”



  我们过去能够能够在数字世界与现实世界之间划定清晰的界限；你的车是一台机械设备，你的电脑就是一台电脑。电子表格存在于线上，但你最宝贵的资产隐藏在市中心坚固砖结构建筑内的保险箱里，受武装保镖的保护。


  如今的网络空间包含了一套复杂的组成部分：物理硬件（运行网络的计算机和基础设施）、软件（运行在计算机上的代码）以及信息（在软件硬件内部创建和保存的数据）。每个部分都相互影响，如果没有整体，任何部分都将失去用。用今天的技术——在未来更是如此——很难清楚物理世界在哪里结束，虚拟从哪里开始。钱几乎完全以虚拟形式存在，现金已成为稀品——而
  `Bitcoin`（比特币）等加密货币的崛起预示着一个完全没有货币的时代。正如安全专家布鲁斯·施奈尔（Bruce Schneier）所说：“你的现代冰箱是一台保持食物冷却的计算机。你的，你的箱是一台让食物加热的计算机。ATM
  是一个里面有钱的计算机。你的汽车不再是一个内部带有计算机的设备；它是一个由 100 多台带轮子和引擎的计算机组成的分布式系统。而且，随着 `iPhone` 在
  2007 年推出，你的手机变成了全功能计算机。”



  互联网和数字时代最大的优势之一，是它们是如何开放世界的——用托马斯·弗里德曼（Thomas Friedman）的名的话，“世界是平的。”互联网允许立即访问全球各个角落，让坐在一个国家办公桌前的人能与另一个大洲之外的人进行视频聊天，并让任何接入互联网的人都能接触像
  `New York Times`（纽约时报）或 `CNN`（有线电视）一样多的读者或观众。


  这种趋势给政府和国家带来了前所未有的挑战。今天的政府通过官僚机构组织，在国外和国内之间做出明确的法律区分。国务院被禁止在美国境内发布“宣传性”内容；中央情报局（CIA）在海外运作，而联邦调查局（FBI）负责国内安全。


  然而，这些区分似乎越来越毫无意义；来自中东的恐怖分子可以在不踏足我们国家国土的情况下与美国公民直接交流，劫匪者可以从大多数人在地图上甚至都找不到的地方掠夺华尔街的银行。网络攻击另一端的人可能是街上的一个青少年、海外的恐怖分子，或者是敌对首都办公桌前一名穿制服的军官——在案件破获之前，你通常不知道是哪一个。



  我们的政府过去对其试图保守的秘密有非常清楚的理解——我们最初的分类系统是为了封锁核时代和原子武器的细节而产生的。在过去的几年里，它主要关注军事秘密、情报机构的工作以及全球范围内的外交努力。


  然而，我们在过去十年中看到信息在某些从未认为过是“国家机密”的地方被武器化：政党的内部通信、看似枯燥的政府员工旧人事记录、数百万美国人的健康保险细节，甚至一位电影高管的亚马逊购物清单。


  对于个人而言，十年前我们很清楚应该尝试保护哪些个人信息——我们的支票簿和 `Social Security numbers`（社会安全号码），而今天，我们担心以前从未考虑过的“个人身份信息”：我们手机上的
  `GPS` 记录，它可以告诉任何人我们去过的每一个地方；每天通过我们的电子邮件账户流动的生活私密照片；以及由 Fitbit 等其他设备收集的个人健康状况。


  与此同时，政府和行业官员多年来一直警告会发生“网络 9/11”或“网络珍珠港”，即对我们基础设施的毁灭性攻击。我们一直担心对电网、供水系统、医院或空中交通的攻击。然而，在
  2016 年，当俄罗斯对我们发动了第一场真正的网络珍珠港时，他们攻击的是一个我们从未想过的软肋。


  俄罗斯攻击了美国对自己的信心。他们试图削弱我们对自身政府的信任、参与自身民主的能力，以及我们独特的美国精神。美国的进取精神长期一直是美国未来的核心，但俄罗斯意识到我们的国家信心比过去任何时候都要脆弱——他们在网上利用了这种不安全感。他们放大了我们互相攻击的信息，煽动了我们自身的愤怒，将我们极端的党派对立武器化。





  这六条模糊界限的结合，给美国——包括其政府以及我们作为公民和个体的成员——带来了前所未有的挑战。在职业生涯的最后十年里，我一直帮助美国政府应对这六场巨大的巨变——我深知，我们作为一个政府和一个社会，距离应对这一未来所需的水平还很远。互联网曾是一个为了帮助美国政府度过战争而创造的工具，现在它已成为全球紧张局势的核心，并成为我们日常生活的潜伏威胁。这种情况本不该如此——但我们作为一个社会和一个政府，需要致力于改变这一轨迹。


  ![](img/00006.jpeg)


  在 2016 年 3 月的短短一个周内，我们向线上的敌手展示了局势正开始扭转。我们宣布的起诉书和案件是多年战略规划的结果——它们共同代表了美国政府应对网络安全威胁方式的根本性转变。


  2016 年 3 月 22 日（周二），美国司法部宣布对叙利亚电子军（Syrian Electronic Army）的三名成员提起指控。该是一个支持独裁者巴沙尔·阿尔·阿萨德的黑客组织，目标是美国媒体网站。2013
  年 4 月，这些黑客曾成功从美联社发送了一条推特，称奥巴马总统在白宫炸弹中受伤，这起引发恐慌的事件曾导致股市一度暴跌 1,360 亿美元。



  随后，在周四，弹出了迄为止最重磅的炸弹：美国起诉了七名与伊斯兰革命卫卫队有关的黑客，他们曾以美国金融机构为目标，并获取了纽约市外一座水电站的访问权限。


  在那周里，我们有想要传达的三个条信息——这些信息都是期待已久的。这是多年来适应网络安全威胁“三管齐下”方法的努力结晶。在政府内部，我们简单地将其视为：查清攻击背后的黑手、默认公开此类归因结果，然后施加后果以塑造网络行为。最后，这种三管齐下的内部方法被转化为我们希望向公众传达的三个强有力信息。


  首先是内部信息：我们想向美国政府的其他部门明确表明，国家安全法和正常的刑事司法系统可以应用于网络空间。互联网并不是一个匿名黑洞。我们可以在法庭上证明特定行为者是特定行动的幕后。


  其次是给私营部门的信息：多年来，我们听到公司觉得他们是在孤军战斗网络威胁，没有得到美国政府充分的支持或后盾。我们知道他们想要采取更有力的行动——针对中国、伊朗和叙利亚黑客的“一二三”连环拳，旨在明确强调我们将采取更积极进的姿态来对抗网络上的恶劣行为。


  第三是给我们的外国敌手的信息：这种行为是不可接受的。这是一条简单的信息，但却是迟到且至关重要的。我们希望建立一套明确的网络可接受行为标准——就像几十年来，各国通过条约、协议和国际组织（主要是）就物理世界中什么是可接受的行为达成了共识一样。我们需要在线上划分界限，将“传统的”可接受行为（如国家间谍活动）与为了直接利益或造成现实影响的行为隔离开来。我们希望网络上存在清晰的界限和“规范”，就像物理世界中一样。


  太久以来——在信息革命的前 15 年里的大部分时间——网络犯罪对犯罪分子和国家来说都是零成本的。尽管这些盗窃案中有许多关注度极高，但美国政府几乎没有采取过任何行动。这是一种奇怪的不协调：发生在虚拟世界的行动逃脱了惩罚；如果它们发生在物理世界，根据既定先例和国际法，它们将引发显而易见的明确报复。相反，如果中国军在深夜潜入波音公司，将数百箱文件装上拖拉机货车，或者俄罗斯情报人员试图从美国银行抢劫
  1,000 万美元现金，我们几乎会立即发现，美国也会几乎立即采取军事行动报复；而多年来，我们一直在苦于首先弄清类似的电子行动的范围，然后是应对措施。


  在奥巴马政府之初，美国政府从未公开指控外国国家进行网络入侵。在接下来的八年里，美国公开指控了我们认为的网络上四大主要外国威胁。我们起诉了中国军事黑客进行工业间谍活动，起诉了伊朗黑客对我们的金融部门发动破坏性攻击，并公开指控朝鲜入侵索尼的电脑系统，以及俄罗斯通过泄露民主党运营人员被黑的邮件干预
  2016 年总统选举。我们还起诉了试图从远处破坏我们金融系统的组织犯罪分子，并将试图利用互联网杀害美国军官女兵的恐怖分子绳于法网。这就是我们如何努力让网络威胁走出阴影，并利用刑事司法系统揭露来自国家以及恐怖分子、叙利亚电子军等外国敌手网络攻击的故事。这种变化对于政府运作来说发生得惊人地快，但还不够以应对这一威胁。


  那时还远远不够。在保障我们的数字生活方面，还有很多工作要做。


  但这是一个开始。


  [*] 第一位越南战争“逃避兵”、第一个烧毁入征卡的弗雷德·摩尔（Fred Moore），帮助开创了个人电脑运动运动。




  我第一次深入接触计算机犯罪是在 2004 年，当时我协助起诉了政府针对点对点文件共享网络的首起版权案件，该案被称为`数字锁锁行动`（Operation DIGITAL
  GRIDLOCK）。按照当时司法部对此类案件的理解，起诉在线共享非法文件的网络幕后主脑并不真正“算作”计算机犯罪；它被视为知识产权案件。同一个部门负责计算机犯罪和知识产权（IP）这两个部分，但大部分时间都在法庭上执行知识产权法。当时，计算机犯罪的数量还不足以维持一个小组的运作。


  2004 年，点对点文件共享代表了网络上最突出的问题之一——通过`Napster`等应用，非法复制音乐和电影的工业级共享变得轻而易举。这个文件共享网络由肖·范宁（Shawn
  Fanning）和肖·帕克（Sean Parker）于 1999 年创立，已发展到数千万用户——到 2001 年，每天增加 30 万个新用户——而且几乎所有人都在非法交易歌曲、电影或软件文件。这是前所未的大规模版权侵权；行业和执法部门似乎对此也无能为力。[¹]





  录片行业曾对 `Napster` 以及 `Grokster` 等文件共享网站提起诉讼，认为在现实世界中定义盗窃或侵犯版权权的标准也应适用于网络。非法文件共享并不是对互联网开放性的拥抱，而是对那些创造了音乐、电影和软件的艺术家和创新者的抢劫。随着
  `Napster` 等服务在大学校园占据一席，行业团体变得日益绝望，他们发出了强烈的抗议，并敦促政府（包括`司法部`和`国会山`方面）将资源集中在这一问题上。


  我们长期以来一直将此类资源投入到实体商品中——例如追捕仿名牌包包、查封装满货物的仓库——但数字世界对我们来说是一片新领域。作为一名联邦检察官，从调查谋杀、强奸和大型毒品阴谋转变为追踪
  `MP3` 和 `.MOV` 文件的比特和字节，这感觉是一种奇怪的转变。尽管从某种意义上说，电影和录片行业是正确的：盗窃就是盗窃——我们在执行和塑造这一规范中发挥着重要作用。在一次具有里程碑意义的案件
  `Metro-Goldwyn-Mayer Studios Inc. v. Grokster, Ltd.` 中，斯蒂芬·布莱尔法官写道：“故意非法复制与普通盗窃一样，都是财产的非法剥夺。”我们的工作是帮助执行这一标准，塑造社会规范，并确保普通人意识到非法文件共享是他们应该参与的恶行。我们不会对人们从商场偷窃
  `CD` 视而不见，因此如果这种情况发生在网上，我们也不应该视而不见。



  尽管如此，我们在选择目标和案件时非常谨慎；虽然录片行业一直在对数千名只下载非法文件的人提起诉讼和抗议，但我们针对的是那些实际上共享和托管文件的人。我们针对的人没有一个仅仅是下载者；正如一位律师所说，这些人是文件共享的“头目”。我们在
  `DIGITAL GRIDLOCK` 中针对的文件共享网站被称为 `The Underground Network`（地下网络）。它依赖于名为 `Direct
  Connect` 的点对点（`P2P`）协议，用户可以建立自己的“枢纽”来共享文件，我们调查了名为 `Achenon’s Alley`、`MOVIEROOM`、`PROJECT
  X/THE ASYLUM` 和 `SILENT ECHOES` 等枢纽。该网络要求用户自己至少共享 1GB 的文件才能参与——这相当于至少 250 首歌。然而，许多用户共享的内容远多于此；总之，在任何一天，该网站上有约
  40TB 的被盗文件可供下载，这部分内容相当于约 1050 万首歌，是国会图书馆印刷版收藏的四倍。


  2004 年 8 月 25 日，`FBI` 在德克萨斯州、纽约州和威斯康星州执行了六份同时执行的搜查令，从五处住处和一家互联网服务提供商处收集了计算机、软件和证据。公众认为所有这些点对点“版权海盗”都是穷困的、不知事的大学生，但事实恰恰相反，我们针对的枢纽托管者都在四十到五十岁之间。“`P2P`
  不代表‘偷窃许可’，”时任司法部长 `约翰·阿什克罗夫` 在宣布此案时这样说。“非法分发和复制受版权保护的是严重的犯罪行为。今天的调查行动向那些偷窃他人心血和创新的网络小偷发送了明确的信号。同时也向那些认为将这些被盗货物下载到电脑或
  MP3 播放器无所谓的人发送了明确的信号。你可以像其他消费者一样，为音乐、电影、软件和游戏支付公平价值，你也可以在被抓到进行网络盗窃时支付更高的代价。”次年，在最终四名被告中的前两名被定为在
  `P2P` 网络上犯联邦重罪版权盗版罪。在定罪者中，一名名为 `Axeman` 的 42 岁用户每天共享 6.72TB 的数据，约相当于 6000 部数字电影。



  这些案件被认为是成功的，但我学到的一个教训是，刑事司法系统并不总是解决问题的正确工具。在投入了大量的时间资源后，我们从一个在线非法共享文件的巨大社区中抓到了四个人。感觉我们像是在进行一场掩卫战，以保护一个正在消失的商业模式；当亨利·福特的
  `T 型车` 从流水线上下线时，我们正在帮助执行马车时代的标准。世界上所有的检控都无法带回录片行业在 20 世纪 90 年代那种以 17.99 美元出售整张 CD
  专辑的丰收日子。格局已经发生了变化——行业也需要随之改变。政府所能做的有限的，如果依靠司法系统来实现社会目标，它往往是一个粗浅的工具。


  点对点文件共享的解决方案需要行业审视其商业模式，并找到一种方法，以合理的价格和易用性来提供人们他们想要的东西。最终在某种程度上解决点对点共享泛滥问题的的是 `iTunes`
  商店的出现，这种新工具让用户能够安全地购买音乐、电视节目和电影，并确保买到实物。这是我在之后的十二年里从事网络犯罪和网络安全工作中一直带来的教训。这也是今天我们作为社会成员需要记住的教训：无论政府做什么，技术的进步都意味着生活方式需要发生改变。我不知道`司法部`
  有谁认为我们可以通过诉讼来实现安全可靠的网络。网络安全和网络犯罪是不断演变的威胁，并没有简单的解决方案。诉讼和刑事调查只是我们为了创建和塑造 21 世纪在线规范而需要使用的许多工具之一。长期以来，我们没有追捕恶狼——而我们需要去这样做——但技术也需要改变，以便我们不再住在那个的草屋里。


  与此同时，司法系统是一个特别有效的工具，可以为接受的行为划定清晰边界：互联网提供的工具是价值中立的；它们可以用于善意，也可以用于恶。点对点技术可以是公司或个人之间共享文件的强大工具，但它也是鼓励共享非法文件的“媒介”。我们可以支持一种用途，同时反对另一种。这需要我们作为政府和社会来划分这些界限，定义网络空间中可以的行为。


  ![](img/00006.jpeg)


  加入`司法部`几乎是我一生的梦想。我一直想在政府工作——特别是作为检察官在法庭上审判案件。但正如许多在 90 年代加入政府的检察官和 FBI 探员一样，对我来说，打击犯罪并不意味着网络犯罪——绝不意味着“国家安全”。我加入是为了打击街头犯罪、欺诈和腐败。我无法想象自己的职业将向何方发展，但也许我应该预期惊喜：毕竟我在`司法部`的第一份工作——起诉税收案件——是在一个与我预期的完全不同、且与我最终去向完全不同的部门。在我接受那份工作时，我甚至还没有上过学院的`税法`课程。






  尽管听起来可能很老套，但我想成为一名检察官，因为我觉得维护法治是美国历史的基石。作为一个历史历史爱好者，我深受詹姆斯·托马斯·弗莱克斯纳（James Thomas
  Flexner）关于首任总统传记《华盛顿：不可或缺的人》（*Washington: The Indispensable Man*）的影响。那书描绘了一个有缺陷的人如何帮助建立了一个民主国家——一个从根本上由法律而非人类治理的国家开创性实验。他写道：“在历史上，很少有人拥有不可动摇的权力却能如此温和而谦逊地行使权力，去实现他们直觉告诉他们的邻里和全人类的福祉。”弗莱克斯纳认为，华盛顿的工作导致了“我们许多人所钦仰的理想：个人的神圣不可侵犯、法律面前平等、政府对民的回应、所有通信手段的自由……以及各地人民的自决。”⁶
  我的大学录取论文侧重于华盛顿和法治的重要性。回想起来，这是一个令人尴尬的“老派话题”——几乎是字面意义上的——但美国对我来说一直代表着对法治而非人治国家原则的斗争，一个受自决和法治基本原则引导的民族，这种引导使我们在历史上独一无二，这也是我们在改变世界方面处于领先地位的原因。这是一个通向和平经济繁荣并重视民权和公民自由的原则。



  在纽约市长大，并在 20 世纪 80 年代成年，那是一个犯罪似乎疯狂蔓延且可能无法调和的时代——这是这个国家最大城市的常态——这也是促使我成为检察官的重要动力之一。1991
  年有一段著名的《周六夜现场秀》（SNL）小品，就在纽约市再次创下年度谋杀案新高之后，该小品嘲讽了这座城市作为“腐烂的、犯罪横生的地狱”的声誉。凯文·尼隆（Kevin
  Nealon）扮演一名无线电节目主持人，采访一名由乔·曼特格尼亚（Joe Mantegna）扮演的市官员，他们听着听众者的苦遭遇，并将每一个遭遇都推卸为受害者的错。当一个听众者报告在地铁上被抢劫时，曼特格尼亚反驳道：“现在是地铁凌晨
  1:15，你还期待什么？”当另一个听众者报告下午在曼哈顿中部购物购物时被抢劫时，他问道：“你和他们眼神交流了吗？”当受害者肯定回答时，他说：“你能告诉我为什么在
  1991 年，有人会在街上和陌生人眼神交流吗？为什么不直接穿一件写着‘我是个白痴，快捅我吧’的 T 恤呢？”SNL 的角色们说，犯罪只是这样一个大城市的自然状况。“这就是你生活在这个世界上最有活力的城市所付出的代价。”⁷
  随后，市官员发放了印有“我爱纽约”标志的小册子，标题分别为“被中枪后怎么办”、“被淋了汽油并点燃后怎么办”，以及一份纽约人避开眼神交流指南。



  这个小品引起了我童年的强烈共鸣：我生生地记得“友好警官”（Officer Friendly）来到学校教我们如何变得圆滑……（由于原文重复错误，此处省略）。



  我们认为 20 世纪 90 年代的那个时刻是理所当然的……当时，新兴数字世界似乎将自由向前推了一步，允许一个没有规则且完全不受束的地方。就在 1996 年，我在自由之家（Freedom
  House）工作，约翰·佩里·巴洛（John Perry Barlow）——感恩乐队的前作词人、互联网早期参与者——撰写并发布了《空间独立宣言》……





  巴洛（Barlow）——与两位志同道合的数字先驱约翰·吉尔莫尔和米奇·卡珀共同创立了电子前沿基金会——他认为，网络空间的虚拟世界存在于任何世俗政府的触及之外。“网络空间不在你们的边界之内，”他写道，“我宣布我们正在构建的全球社会空间天然独立于你们试图强加于我们身上的暴政。你们没有道德权利统治我们，也不拥有任何我们有充分理由恐惧的强制执行手段……你们关于财产、表达、身份、移动和语境的法律概念并不适用于我们。它们全都是基于物质的，而这里没有物质。”[8
  巴洛对这种技术乌托邦式自由主义的观点绝非孤例；事实上，这种观点似乎占据主导地位，以至于结果似乎早已注定——唯一的问题是，世界将如何实现？加州大学洛杉矶分校（UCLA）的大滨健一（Kenichi
  Ohmae）认为，“现代国家本身——十八世纪和十九世纪的产物——已经开始崩溃”；麻省理工学院（MIT）的尼古拉斯·尼格罗庞特（Nicholas Negroponte）作为另一位早期数字思想家表示，“就像樟脑丸直接从固体变成气体一样，我预想国家将会蒸发。”


  情况并非完全如是。


  ![](img/00006.jpeg)


  对于法学院的学生来说，在政府工作并不是首选职业道路。我们的教授艾兰·德绍肖维茨（Alan Dershowitz）在我们的刑法基础课程上曾开过玩笑说，我们中将没有人能进入法庭内部。我证明我是例外之一：我在法学院毕业后立即加入了司法部，从
  1999 年 10 月开始担任诉讼律师。


  我最终基本上从事的是网络犯罪工作，是因为我知道如何设置同事的打印机，以及如何使用电子邮件。我最初被分配到的税务部门并不是我特别感兴趣的，但我哈佛法学院的一位教授菲尔·海伊曼（Phil
  Heymann）曾建议，如果我想快速进入法庭并尝试大案子，那里是一个很好的开始地点。我知道那些进入私营部门的同学在亲手处理案件之前，可能要埋首于琐碎的任务中多年，而我渴望比他们更快到达那里。司法部部长荣誉计划的重点是将有出息的毕业生直接带入司法部的核心——这基本上是法学院毕业后进入该部门工作的唯一途径——因此我经常比税务科的其他检察官小整整二十岁。


  这意味着我知道如何使用电子邮件——而且在办公环境中同样重要的是，我知道如何让办公室的打印机运转。进入司法部时，我是第一批伴随计算机长大的检察官之一——或者至少我们中有些人是这样。在成长过程中，技术一直让我着迷。


  我在纽约长大期间，家里拥有的第一台电脑是我姐姐姐在抽奖中赢得的一个巨大的、人等高的盒子。它非常大。我记得当时惊讶于打印机竟然是内置在机器内部的。后来，我们全家升级了一台
  Apple IIe 和一台雅达（Atari），我豪地教我祖父如何使用它们。夏天膝盖受伤导致没能去夏营，我每天待在室内学习用 `BASIC` 编程——编程对我来说是一种启示，一种你可以随心选择的冒险游戏。



  这不是一个能够自然翻译的世界。要将由比特和字节组成的新世界翻译到一个由数百年法律传统主导的世界，并非易事。几十年来，我们努力拓宽理解网络空间的人群，并试图赶上我们能预见的趋势。这种想象力的失败和翻译的失败，反复阻碍了政府对数字挑战的应对，从司法部的基层一直到白宫无一。


  当我进入联邦政府时，重大的技术和社会变革刚刚开始显现；1999 年夏天当我在华盛顿寻找第一套公寓时，我记得走在第 17 街，看到人们正拿着大而笨重的手机手机通话。在我们联邦检察官办公室的办公室内，我们依靠运行
  `WordPerfect` 的电脑，这引发了许多关于 `Microsoft` 和司法部那桩突破性反垄断案的办公室笑话。


  我被分配到的税务小组正处于其某个重大案件之中，调查一个名为“全球繁荣学院”（Institute of Global Prosperity）的多级营销骗局，该机构举办信息研讨会并向人们出售关于如何避税的“研究”。它提供了各种虚假且不可信的材料，试图说服受害者：只要填写几张表格，他们就可以终身免税生活。不出的是，该计划背后的人员正在践行他们的说辞。从税务案件的角度来看，这是一个相对直接的案件，但这家公司不仅通过毫无价值的信息骗取受害者的钱，还让受害者如果听从了建议，将面临来自政府的法律风险。





  然而，该方案在当时之所以新颖，是因为其营销很大程度上是在线进行的——这意味着税务部门的那些老兵们向我寻求帮助，那个帮他们安装打印机的人，请求我协助收集必要的数字证据。作为数字证据工作的一部分，我曾参加过司法部计算机犯罪与知识产权部门（`CCIPS`）的培训，并结识了
  `Orin Kerr`。他是一位先驱，后来编写了第一本关于计算机犯罪的教科书，并以检察官的视角审视了那个仍然主导公众思维的科技乌托邦时代。在当时，整个计算机犯罪领域还是一个很小的领域——在
  2000 年，司法部只有 18 名律师在这一领域工作。网络安全世界当时相当封闭。即使在第一批网络安全案件出现二十年后，计算机威胁的世界（无论在防一方）实际上仍然是那一小群幻想家和极客的专属领地，他们中的许多人非常不愿欢迎他人进入他们的领域。



  该团队最初被称为“计算机犯罪小组”，由 `Robert Mueller` 在 1991 年创立，当时他正担任乔治·H·W·布什总统时期负责监督刑事部门的助理检察长。Mueller
  被 1989 年出版的图书《偷蛋计划》（`Cuckoo’s Egg`）所吸引，书中讲述了加州罗伦斯·伯克利国家实验室计算机经理 `Clifford Stoll`
  如何几乎凭一人之力识别出其网络入侵，并将其追溯到西德国和一名受 `KGB` 雇用的黑客。这本书预示了一波新的威胁浪潮，并随着时间的推移成为了经典。现在回过，看到当时的技术是如此原始真是令人难以信——那些激发了西德国黑客的自组装
  `Sinclair` 计算机配的是磁带——甚至没有磁盘——而它们的拨号调制解调器速度仅为每秒 300 比特，仅仅是 20 世纪 90 年代原始拨号调制器提供的
  2400 比特的八分之一。


  然而，他早期的兴趣引发了 `CCIPS` 的一种传统：所有新入职的律师在开始时都会得到一本《偷蛋计划》进行阅读。我记得有一次，我被带进司法部一个堆满书籍箱的灰满落尘的小间，在那里拿到了属于我自己的副本。这算是对
  `FBI` 早期网络努力的某种完美认可：当 `Stoll` 第一次尝试报告一名黑客在国家实验室搜寻军事信息时，`FBI` 推辞了，并告诉他给当地的地区检察官打电话。他们认为网络案件不值得花精力。在现实世界中，需要多年时间才能改变这种心态——帮助探员和检察官理解，仅仅因为案件开始得很小，并不意味着它不构成巨大威胁。正如我的司法部同事
  `Chris Painter` 多年后回忆的那样，这种转变发生在探员们开始关注不仅已经发生了什么，还关注可能会发生什么时：“意识到你拥有可能受到影响的基础设施，虽然损害并不显而易见，但对它们的威胁却是真实的，”`Painter`
  后来说道，“你不想源源不断地给对方送便宜的机会，对吧，所以下一次攻击可能就是导致整个系统崩溃的那一个。我们不想等。”


  `Mueller` 早期的兴趣帮助启动了司法在计算机犯罪领域的努力，但在那些早期年份，很少有人真正理解新道路的规则。还没有人理解如何将为建立在铜线网络电话时代编写的法律，转化成能够解释数字比特和字节的语言。


  ![](img/00006.jpeg)



  “黑客”（Hacking）自互联网诞生以来就一直是其精神的核心部分——这是一种去中心化、反权威媒介中一种即兴的、钻研的精神，那里规则极其松散，并且有很大的实验空间。作为一个术语，`hacking`
  源于 `MIT` 等地方文化中核心的善意恶作剧，那里的学生热衷于恶作剧和校园举动，例如秘密地将一辆涂成 `MIT` 警车的旧 `Chevrolet`（汽车）放置在学校标志性的“大圆顶”（Great
  Dome）上，或者编写一个计算穿过整个纽约地铁系统最高效率方式的计算机程序。学校甚至举办了一个网站 `hacks.mit.edu`，记录了他们自豪的“良好黑客”历史。相比之下，`MIT`
  将狡猾的计算机或电话相关活动标记为“破解”（cracking）。正如 `Steven Levy` 在他 1984 年的著作《黑客》（`Hackers`）中所写的那样（这本书开始使该术语普及），计算机程序员和设计师是“冒险家、远见者、风险承担者、艺术家，以及最清楚地看到计算机为什么是一件真正革命性工具的人。”`Levy`
  描述了一种“黑客伦理”，这种伦理认为：“关于系统——关于世界——重要的课程可以通过拆解事物、观察它们如何运作，并利用这些知识创造新的甚至更有趣的东西来获得。他们反对任何试图阻止他们做这些事的人、物理障碍或法律。”


  20 世纪 50 年代和 60 年代黑客世界的成功只有通过实验才能，而计算科学的平等主义文化认为信息应该是自由且去中心化的——对时间、数据或学习的吝啬会威胁到企业进步的能力。第一代计算机是占据整个房间的大型机器，提供了一种近乎宗教和魔法的体验，由工人小组精心照料，就像对待某个被遗忘社会神秘神庙里的图腾一样。“对于一个黑客来说，关起来的门是一种侮辱，锁上的门是一种愤慨，”`Levy`
  写道，他在记录如 `MIT` 等计算中心的生活时是这样。


  在斯坦大学的人工智能实验室（SAIL），系统不需要密码，所有文件默认开放，除非用户采取额外步骤隐藏它们。但随后 `SAIL` 的黑客们只需编写一个程序来识别隐藏文件，然后努力地解锁它们。“任何要求隐私的人一定在做有趣的事，”`SAIL`
  的 `Don Woods` 解释道。


  早期机构计算机的核心——好奇心和想象力将专业与个人融合，随着技术的稳步发展，实验室工作人员团队让位了更个人化、更亲密的关系，这种关系鼓励了更多的实验。早期的个人电脑通常是半成品套件或手工组装，很可能是由爱好者拼凑的，也可能是专业人士制作的。




  “电话骗子们”（Phone phreakers）通过绕过 AT&T 的长途系统窃取免费电话通话，他们在早期计算领域发挥了不可或缺的作用——其中最著名的包括苹果计算机的创始人史蒂·沃兹尼亚克和史蒂夫·乔布斯。这些骗子们使用被称为“蓝盒”（blue
  boxes）的设备来模拟 AT&T 用于控制交换机的特定 2,600 赫兹音调，使他们能够绕过计费系统并免费拨号。1971 年，《时尚先生》（Esquire）杂志的一篇名为《小蓝盒的秘密》的文章让这种做法进入主流，赞扬了反主流文化，并让约翰·德珀（John
  Draper）成名。这位早期的电话骗子被称为“Crunch 船长”（Captain Crunch），这个绰号源于同名麦片盒里附的红色塑料船长哨，那种哨子恰好能发出完美的
  2,600 赫兹音调。


  德珀解释道，“骗网”并不是为了偷窃，而是为了“学习一个系统。电话公司是一个系统。计算机也是一个系统。你明白吗？如果我做我所做的事，仅仅是为了探索一个系统。那是我的志好。”青少年们还会编写自己的简单程序，比如电影《游戏入侵》（WarGames）中看到的程序，它们会通过随机拨号来寻找新计算机，在搜索引擎让导航变得简单很久，他们就在探索互联网的广度了。



  总而言，系统是完全开放的，安全措施默认都是关闭的。网络技术人员可以根据需要开启密码等安全系统，但这样做违背了协作精神。“我们没有关注你如何蓄意地破坏这个系统，”网络时代最早的发明者之一的文特·塞尔夫（Vint
  Cerf）回忆道，他与其他人花费了多年时间调整系统使其运行，经常直接在纸上勾勒计算机之间如何通信。“你可以从事后光光的角度认为我们本应该那样做的，但让这个东西运行起来本身就不是易事。”


  AR 帕内网（ARPANET）是由五角大楼建立的一个早期网络，供科学家和工程师共享信息，它于 1969 年始于加州大学洛杉矶分校（UCLA）；随后在加州大学圣塔芭芭拉分校、斯坦福研究中心、犹他大学、麻省理工学院（MIT）和哈佛大学等地很快增加了更多的“节点”。当时没有人真正理解他们正在构建什么——他们创建的连接似乎可能重要且有用，但对于什么呢？“没有人有答案，但前景看起来很令人兴奋。我们发现自己正在想象各种可能性——交互式图形、协作进程、自动数据库查询、电子邮件——但没人知道从何处开始，”AR
  帕内网的先驱之一史蒂夫·克洛克（Steve Crocker）回忆道。整个网络是计算机研究领域的一场奢侈实验，与大多数其他科学家和技术研究人员无关。



  人们花费了多年时间在基础工作上，例如建立指导信息如何在不同类型的机器之间传输和翻译的通用协议。AR 帕内网基础上的概念飞跃——分组交换（packet switching），花费了多年的开发。在线网络并不依赖电话的工作方式（在发送端和接收端之间开启固定线路），它不是传输整个消息，而是将其分解成微小的数据块（称为数据包），每个数据包都可以通过当时看来最快的任何路由独立地跨越网络运行。然后，在另一端，数据包会被重新组合在一起。


  9973 年，AR 帕内网已扩大到 25 台机器。这些机器通常由国防巨头霍尼韦（Honeywell）制造，是庞然大物，占据整个房间的机构级，供整个系部人员共享——AR
  帕内网连接的成本每年高达 25 万美元——但从现代标准来看，它们无无疑是原始的，并不十分强大。早期的机器甚至安装了语音耳机，以便研究人员可以通过语音双重检查他们的计算机是否正在按意图传输。“我要打一个‘L’，”UCLA
  的一名研究人员向斯坦福研究中心的一名研究人员喊道，“你收到‘L’了吗？”



  “连接到 AR 帕内网的站点意味着属于精英群体，”一位记者观察到，“在它的早期甚至中期，AR 帕内网都有种私立俱乐部的感觉……进入俱乐部并不容易，但一旦你进来了，就可以随心所欲。”在这样一个小小的群体中，安全甚至不是被考虑的问题——它违背了网络的初衷。卡内基·梅隆大学（Carnegie
  Mellon）以其每台计算机上的每个文件都对 AR 帕内网上的其他人开放而自豪，除非用户显式地保护它。这种心态部分导致了安全性的匮乏——在多年、甚至几十年里，任何计算机系统中几乎没有什么东西值得被偷取或破坏。“人们不闯入银行不是因为那里不安全。他们闯入银行是因为那里有钱，”发明互联网》（Inventing
  the Internet）的作者珍特·阿巴特（Janet Abbate）解释道。正如她所说，“他们认为自己正在建立一个教室，结果却变成了一个银行。”


  信任在 AR 帕内网上是内在且符合预期的——然而随着网络的增长，这种方法的代价变得越来越明显。1973 年 12 月，系统的早期创建者之一的罗伯·梅特卡菲（Robert
  Metcalfe）发送了一条信息，警告说大多数站点的保护不足——从根本上说，网络及其用户太信任。拨打 AR 帕内网的电话号码众所周知，一旦用户拨入，系统在提供服务之前不需要用户身份识别。



  黑客是遵循共同代码并关注开放、信息去中心化以及不对数据伤害承担集体责任的专业人士——数据是他们共享的宝藏；而恶意网络用户被称为“网络随机用户”（network
  randoms）、“网随机用户”（net randoms）或简单称为“随机用户”（randoms），这是指他们不定的来源。“随机用户”在线的存在破坏了网络的精神。


  麻省理工学院（MIT）因其网络完全开放——不需要密码——因允许“随机用户”上网而闻名，这让其他人非常困。正如一位作家回忆道，“网随机用户”往往是那些路过并翻找系统的用户，只是看看那些疯狂的
  MIT 黑客在忙什么。但他们可能无意或有意地给合法用户带来麻烦——开恶作剧，比如发送假邮件告诉用户他们的账户即将从网络中删除。“电子邮件先驱杰夫·古德费尔（Geoff
  Goodfellow）在 1980 年 3 月的一个公告板贴子中抱怨道，东岸某知名机构有一系列主机，似乎向任何请求的随意的随机用户提供账户/登录名和密码，”他敦促系统管理员打击这种不受限制的访客账户。“首先允许随机用户上网，就会让他们在
  AR 帕内网的后院里横行，并尝试用他们灵巧的手破解并闯入网络各处的各种系统——好玩好玩！”五角大楼对“随机用户”感到非常担心，甚至威胁切断 MIT 与 AR 帕内网的连接。




  随着计算能力的提升，研究人员开始寻求利用更网络的集体记忆。第一代“计算机病毒”的出现实际上是善意的——尽管这个词的含义总是带有阴暗的色彩，它源于约翰·布鲁纳（John
  Brunner）1975 年的一部科幻小说《冲击波骑行者》（*The Shockwave Rider*），该小说描述了一个反乌托邦未来的政府，它通过强大的计算机系统控制信息流。世界被一个可以通过按钮电话这种尖端技术编程的天才从统治中解放，他设计了一种“数据网带虫”，迫使政府断开了主控器的电源。


  在布鲁纳小说出版四年后，思罗克斯帕洛阿尔托研究中心（PARC）的两位研究人员乔·哈普（Jon Hupp）和约翰·肖赫（John Shoch）为了提高效率，设计了第一个现实世界的计算机病毒。他们创建了一个程序，滑入网络中空闲的计算机，并利用它们的空闲处理能力来加速复杂计算。“血鬼虫”（Vampire
  Worm）被设计在研究人员回家后的晚上激活，并在他们返回的第二天早晨关闭。他们还设计了一种“镇钟虫”（Town Crier Worm），在网络中移动并共享公告。然而，他们的研究很快证明了问题：一个缺陷血鬼虫版本反复导致帕洛阿尔托网络崩溃。


  当网络上真的出现问题时（无论是故意的还是无意的），目前完全不清楚那是谁的问题。1980 年 12 月，位于旧金山的美国租赁公司（US Leasing）的工程师们发现他们的计算机运行异常；机器反应缓慢，有时毫无响应。第二天，员工们到达时发现，公司的打印机喷了一整晚的乱码——那是一条被打印了数百次的信息，上面写着：“幽灵，系统破解者，再次来袭。很快我将崩溃你们
  A 系统上的磁盘和备份。我已经崩溃了你们的 B 系统。尽情尝试恢复它吧，你这个混蛋。”其他散落在各处的消息还宣称“复仇属于我们”，并提到了各种名字。公司的数据处理主管注意到提到了密特尼克（MITNICK），并想这是否是一个信号，暗示入侵源于麻省理工学院（MIT）的一场恶作剧——但这绝不像普通的
  MIT 黑客行为那样无害且充满趣味。


  公司拨了 FBI 的电话，FBI 迅速派遣了三名探员。他们仔细地采访了工程师并检查了证据，地板上到处落着粗俗的打印纸。他们确实看到了一起犯罪，但并不是联邦犯罪。那时美国联邦政府还没有针对计算机入侵的法律。


  就到达美国租赁公司的探员所知，黑客是从一个加利福尼亚州的电话号码拨入的，这意味着无法因违反跨州电话法律来追捕他或她。探员们在离开之前建议，美国租赁公司可以尝试当地警方？毕竟，加利福尼亚州有一年前颁的反对未经授权访问计算机的州法律。过了几年，这家公司才发现这次闯入与凯文·密特尼克（Kevin
  Mitnick）有关，密特尼克在 20 世纪 80 年代和 90 年代成为第一个著名的黑客；而当时他还只是个青少年。他从电话骗子（phone phreaker）开始，然后进化到破解计算机网络。





  随着互联网规模不断扩大并积累了用户，`hacker`一词的定义也发生了变化，因为破坏互联网可能会造成真实的伤害。事实上，当斯蒂芬·列维（Steven Levy）的著作《黑客》在
  20 世纪 80 年代初出版时，它被当作一首对逝去的时代和人的哀歌——在那个时代，思想自由的思想者和修理者主导着计算机领域，直到那些刻板的官僚接管了数字世界。“回起那段记忆让我感到痛苦，”主张不使用密码的
  MIT 黑客理查德·斯尔曼（Richard Stallman）在书中说道，“整种文化都被抹杀了。”³⁵


  ![](img/00006.jpeg)


  计算机和数字世界开始引起更广泛大众的想象；我的家人就是那个时代第一批购买台式电脑的百万家庭之一，他们惊讶于以前房间巨大的巨兽如今已缩小到可以放在家庭书房里。


  就在 1983 年，即`ARPANET`被重写为易于扩展的同年，网络规模的新增长让五角大楼对其自身的在线安全表示担忧。它将军事系统分到了一个独立的网络，被称为`MILNET`。连接设备的危险性突然显得非常真实。那个春天，电影《电子军情迷》（`WarGames`）由马修·布罗德里克（Matthew
  Broderick）主演，讲述了一个早熟的青少年黑客，他为了玩视频游戏，通过黑入位于科罗拉州美国空空司令部（`NORAD`）基地的军事计算机，险些意外引发了与苏联的核战争。作为资深影迷的里根总统在戴维营地看了这部剧集，并在回到白宫后向他的军事领导人提出了直接询问：“这种事情真的会发生吗？”联合参谋长部主席约翰·维西（John
  Vessey）将军在去调查这一答案时感到很惊讶；他在下周回到白宫并宣布：“总统先生，问题比你想象的要糟糕得多。”³⁶


  这个针对虚构电影的总统提问，促使政府内部开始对网络空间安全进行认真思考，开启了一场应对新漏洞的秘密抢救。这项工作被编入一份名为`NSDD-145`的机密指令中，这是白宫第一份“网络战争”政策，标题平实无奇地《电信和自动化信息系统安全国家政策》。这份十一页的文件在开头第一段列出了一种新范式：“电信和自动化信息处理系统极易受到截获、未经授权的电子访问以及相关的各种技术利用，以及敌对情报威胁的其他维度。利用这些电子系统的技术随处可见，并被外国广泛使用，也可能被恐怖组织和犯罪分子利用。政府系统以及处理美国个人和企业私有或专利信息的系统都可能成为外国利用的目标。”³⁷
  然而，这份文件很快被遗忘了——而且在一种在后世每一任总统身上不断重复的情况下，在未来三十年里，每一届新政府都对这个极其脆弱的网络安全世界有属于自己的警醒之钟。


  在新的数字现实背景下，一个《电子军情迷》的现实版同时公开上演：六名来自密尔沃基的年轻黑客（这群年龄在 15 到 22 岁之间的年轻人根据该市区号自称为`414
  帮`）遭到 FBI 调查，因为他们入侵了政府计算机，并删除了斯隆-凯特林癌症中心（Sloan-Kettering Cancer Center）的账单记录以掩盖踪迹。他们的黑客行为并不复杂——主要依赖于没有更改默认密码的网络——而且仅仅是为了好玩。


  紧随《电子军情迷》热之后，`414 帮`的案件引起了国家的关注。一名 17 岁的黑客尼尔·帕特里克（Neal Patrick）出现在电视网的早晨节目中，并在国会面前作证，他是如何从密尔沃基的家中使用
  Radio Shack 购买的家庭用`TRS-80`计算机，成功访问了敏感的政府计算机网的。³⁸他解释说，他的父亲在收到一张 300 美元的长途电话账单后告诉他停止探索在线公告板，但他转而使用在公告板上公开交易的“借用”信用卡，以避免让他父亲知道他在做什么。“我们这样做是为了好奇，纯粹出于好奇，”他说，“事后看来，违法性并不能为我们的好奇辩护。我们再不会再做了。”


  然而，当政府追上`414 帮`时却手足无措：当时还没有针对黑客行为或计算机犯罪的法律，因此 FBI 采取了权宜之，以发表淫秽或骚扰电话的轻罪进行指控。³⁹当时的美国助理检察官埃里克·库伦（Eric
  Klumb）表示，“无论是否有盈利意图，政府都认为这些入侵是严重的。”^(\*)


  这些事件导致国会开始关注；在此之前，计算机安全在国会山顶最多只是转瞬即逝的关注。佛罗里达州和亚利桑那州等州已经在 0 世纪 70 年代开始通过反计算机犯罪法，但在国家层面很少引起关注或进展。⁴⁰1977
  年，亚伯拉罕·里比科夫（Abraham Ribicoff）议员提出了一项《联邦计算机系统保护法案》，旨在定义并将“计算机犯罪”刑事化，但该法案从未取得进展。1983
  年，另外六项计算机犯罪法案被提出；这一问题开始引起真正的关注。FBI 副助理局长弗洛伊德·克拉克（Floyd Clarke）在一次听证会上警告说，罪犯手中的计算机可能和“手枪、一把刀子或伪造者的笔”一样危险。”⁴¹


  那个秋天，南加州大学的硕士生弗雷德·科恩（Fred Cohen）在利亥大学的一场安全研讨会上普及了一个新术语——他设计并演示了一种寄生性的、自我复制的计算机程序。这个被他称为“**计算机病毒**”的程序运行得非常之出色，在不到半小时内就接管了他正在使用的系统。“这些实验是如此令人惊讶，以至于我想做更多，”科恩后来回忆道，“但大多数做过这个实验的人（这也发生在我身上）的情况是，一旦你尝试了一次，突然就会变得非常害怕再尝试另一个了。”^(42


  在一个以信任和开放为基础建立的系统中，威胁性程序的出现标志着一个新时代的到来。在此之前，在联网计算机的前几十年里，安全充其只是事后考虑的问题；这种概念本身与允许用户远程共享和访问文件及工具的平台网络初衷背道而驰。计算机的本意是为了帮助人类，而不是阻碍他们。





  不久，在线社区开始区分为公司或政府工作的“白帽”黑客和为了犯罪利益的“黑帽”黑客。黑客团体层出涌现，例如所谓的 `Legion of Doom` 以及后来的在美国的
  `Masters of Deception`。他们的文化与许多人起步的电话黑客活动密切相连；在他们的公告板上，他们的在线指南和技巧不被称为“文件”（files），而被称为“兴趣文件”（philes）。大多数人是青少年，更倾向于青少年式的恶作剧而非犯罪行为——他们会通过修改电信公司的电脑，让系统认为某个家庭电话号码是公用电话，以此戏弄其他黑客。在欧洲，一个名为
  `Chaos Computer Club` 的德国集体蓬勃发展，他们利用了欧洲法律比美国法律更加过时的事实，以至于破解进入系统并四处窥探甚至不是违法的。尽管这些团体在网络上声名鹊起，安全问题充其只是一个要关注的辅助话题；直到该领域的一位先驱发出明确警告，它才被推向中心位置。


  1984 年，共同设计并发明了 `UNIX` 操作系统的程序员肯·汤普（Ken Thompson）获得了计算机界的最高荣誉之一——`A. M. Turing Award`，该奖项以突破性的英国计算机科学家艾兰·图灵命名。汤普整个职业生涯都浸在技术领域，见证了在线环境的演变，他觉得世界正处于转折点；他利用获奖演辞阐述了他曾经探索过的一种阴险程序：编写软件代码，在几乎无法察觉的情况下创建它自己的后门——即使在创建软件新版本时，这个后门仍会保持开启状态。他的成功实践表明，技术社区需要开始正位于互联网和整个计算核心的安全漏洞。


  “教训意义是显而易见的，”他在向观众演示完代码后告诉大家，“你不能信任那些并非完全由自己创建的代码。”他解释说，这种根本缺陷——一个至今仍然有效且存在的缺陷——指向了一个更大的问题。他说，黑客不应该再被媒体赞誉了，媒体经常将黑客描绘成像《战争游戏》（WarGames）中布罗德里克扮演的角色那样，心怀良好的“天才少年”和新领土上的无害探险者。“这些孩子所的行为充其量是破坏行为，最坏可能是侵入和盗窃。仅仅是刑法不完善救了这些黑客免受非常严重的起诉，”汤普说，“我见过这些孩子在国会面前作证。很清楚，他们完全没有意识到自己行为的严重性。显然存在文化鸿沟。闯入计算机系统的行为必须与闯入邻居房屋具有同样的社会耻辱。邻居的门没锁，这一点并不重要。媒体必须学会，误用计算机就像醉驾汽车没有什么了不起的。”


  国会也听到了来自政府和商业界的类似警告。1986 年 4 月，新泽西州的一位议员威廉·休斯斯（William Hughes）引入了 `H.R. 1001`，即《计算机欺诈与滥用法》，该法案对访问属于政府、金融机构或其他参与跨州贸易的的各种“受保护”计算机的“未经授权的访问”裁定了处罚；该立法基于此前
  1984 年的早期立法，之前的法律仅将访问机密信息或财务类记录的行为定为犯罪。这是首次尝试将在线犯罪行为定义为与物理世界犯罪不同且独立的犯罪——一种“数字犯罪”，而不仅仅是利用数字手段实现的、根据现有法律即可起诉的现有犯罪。“计算机技术给我们带来了一新型高科技犯罪犯，”休斯解释道，他描述这种罪犯的工具“不再是史密斯·韦森森，而是
  `IBM` 和 `Apple`。”随着该法案在众议院通过，休斯认为，“除非我们现在采取行动，否则计算机将将成为十年的犯罪浪潮。”罗纳德·里根在 1986 年 10
  月签署了该法，在随后的几年里，它成为了政府主要的网络犯罪打击工具。



  该法案很快就有了第一次用武。


  ![](img/00006.jpeg)


  1988 年 11 月 2 日，这个日期在今天听起来并没有引起任何国家耻辱感，但第一场全国规模的计算机犯罪在那个周三晚上开始了。当年早些时候，罗伯特·T·莫里斯
  Junior（Robert T. Morris Jr.）——一个才华的康奈尔研究生，而且尴尬的是美国国家安全局（NSA）计算机安全中心首席科学家之子——在当时驱动整个互联网大部分的
  `UNIX` 操作系统发现了一个漏洞。莫里斯编写了一个短 99 行、自我复制和传播的蠕虫，利用该漏洞获取访问其他受感染计算机的权限。


  该蠕虫通过三种方式尝试入侵新计算机。首先，它只是礼貌地请求——利用当时新生互联网上存在的信任，并试图在新的计算机上运行`remote shell`（远程外壳），这种工具允许用户在不在物理现场的情况下跨网络执行命令。如果网络管理员锁定了该功能，蠕虫随后会尝试
  `buffer overflow`（缓冲区溢出）攻击，用一个`536-byte`的字符字符串淹没登录系统，这是系统可以执行的最大长度输入。该命令导致系统死机，并在混乱中实际上忘记了它本该做的事情——从而允许蠕虫建立`remote
  shell`。最后，如果前两次尝试失败，该程序会尝试破解邮件程序的用户密码。


  对莫里斯来说，这个蠕虫只是他热衷烦人但无害计算机恶作剧的又一个。在哈佛大学学习期间，他对网络进行了编程，使得当人们将邮件程序 `mail` 误打为 `mial`
  时，他们会启动一个小型冒险游戏——他的恶作剧足够复杂，排除了高级教职员工的账户，因此在很长一段时间内都没有引起注意。通过这个蠕虫，他只是想测试自己能触及多少计算机。1988
  年 10 月中旬，他为蠕虫草拟了五个目标，这些目标更多是好奇而非恶意——他希望每个局域网感染三台计算机，避免影响慢机器和干扰活动用户，并利用每次新感染尝试访问更多网络并窃取新密码。


  11 月 2 日周三晚上，他通过麻理工学院的网络将程序释放到互联网上以掩盖来源，并迅速惊恐地发现，该程序比预想的要有效且破坏性大得多。他本打算让它缓慢安静地传播，但莫里斯犯了几个关键的编程错误，导致蠕虫以远超预期的速度复制，导致大学、政府办公室、军事基地和医疗机构的数千台计算机瘫痪，堵塞了系统并迫使许多用户断开计算机与主网络的连接。




  全国各地的计算机实验室陷入了恐慌，系统管理员们注意到一个程序正向他们不断涌入。下午 6:30，`RAND Corporation` 注意到了它的存在；一小时后，`MIT’s
  AI Lab` 发现了蠕虫。很快，它感染了`劳伦斯·利弗莫国家实验室`的计算机，然后是`斯坦福大学`以及其他数十个机构。到午夜，它袭击了美国陆军弹道研究实验室，陆军决定完全切断其与互联网的连接。`UNIX`
  所在地伯克利的大学程序员们急于寻找修复方案。当学校的计算团队集结起来对抗这种未知的病毒时，有人做了一个粗糙的牌子并挂在计算实验室的门上：“疾病控制中心”。


  到第二天，全国范围内有 6,000 多台计算机受影响——可能占到当时所有连接到互联网的计算机的 8%-10%——这一事件在周五早晨登上了*纽约纽约时报*的头条。“大问题在于，一个相对温和的软件程序几乎可以让我们整个计算社区陷入瘫痪，并持续一段时间，”`劳伦斯·利弗莫国家实验室`的一位官员解释道。互联网花了几天时间才恢复在线。


  没过多久，蠕虫就被追溯到了`Morris` 身上；在他看着损失扩大的恐慌中，他曾让朋友尝试传播如何解决问题的消息。到周五晚晚，媒体报道一名`康奈尔`学生参与了其中。`康奈尔`的院长和计算机科学系教师集会，收集了所需的所有证据来指向`Morris`。


  案件交给了一个名叫`Joe O’Brien` 的伊萨卡 FBI 探员。他没有计算机犯罪的经验——他是一个有组织犯罪探员，主要使用他的`Apple II` 计算机写了一本关于渗透`甘比诺家族`的回忆。事实上，当时
  `FBI` 只有一名专攻计算机犯罪的探员，即`Mike Gibbons`。周六上午，`O’Brien` 到了`Morris`的学生办公室，赶走了聚集的记者，并打包了办公室里的物品。这是
  FBI 的标准程序，但对于计算机犯罪案件来说毫无意义——因为案件中的所有证据都是数字性的。随后，他开始询问证人、`Morris` 的朋友和其他教师。


  对于所有相关人员来说，是否真的构成了犯罪似乎是一个悬而未决的问题。随着`O’Brien`调查，`Morris` 在华盛顿与辩护律师`Tom Guidoboni`会面。`Guidoboni`
  很快意识到，在来到办公室之前，`Morris` 并没有意识到自己的行为可能构成犯罪。“他甚至不知道有法律要被违反——他当然没有意识到专门的计算机犯罪法，”对此事件的一段描述中回忆道。


  `Morris 蠕虫` 并不是第一个在网上造成破坏的程序；1987 年，在`利海大学`，第一个破坏性计算机病毒被释放到其网络中，但工程师们迅速将其遏制，它从未离开过校园。而在`Morris`
  的实验失控发生前几周，*时代*杂志还在一篇看起来很滑稽的封面故事中介绍了“计算机病毒”，封面上画满了在显示器上爬爬的卡通昆虫。然而，`Morris 蠕虫`是不同的——它是一个国家级的数字分水岭，这很大程度上是因为*Internet*
  这个词第一次在*纽约时报*中使用。


  大家都同意认为`Morris` 并不是想要造成实际破坏。司法部在如何做出适当应对方面苦苦。负责该案件的诉讼律师`Mark Rasch` 回忆道，他的同事们纠结此案属于重罪还是轻罪。正如他后来说的，司法部担心如果将`Morris`
  这样的行为视为轻罪（一种微不足道的罪行），其他人也会跑去做。”`Rasch` 说，“你面对的是有计划、有预谋的、故意的、持续了数月的行为，给许多不同的个人造成了巨大的混乱和开支。”

  这正是《计算机欺诈和滥用法》旨在将其犯罪化的场景。但该案仍引发了许多问题，检察官至今仍在苦战；`Morris 蠕虫`在今天仍然是一项真正的法律。


  政府指控`Morris` 了一项重罪，这是司法部根据《计算机欺诈和滥用法》进行的首次此类起诉，被称为`18 US Code § 1030`，或者按照检察官的术语被称为`1030
  违规`。在审判期间，`Morris` 主动承认自己是蠕虫的创建者并表示抱歉。辩方辩解了他的意图：“它的设计并不是为了造成永久性。它没有弄坏任何机器。病毒没有读取任何人的私有文件，没有偷取任何信息，也没有让`Morris`口袋里进一分钱。”陪审团并没有被说服——他们在六小时的审议后判定他有罪。`Morris`
  最终被判款 10,000 美元并缓刑三年，以及 400 小时的社区服务。

  `Morris 蠕虫`也指出了试图应对在线攻击的挑战；`Morris` 担心他的蠕虫造成的后果，曾试图匿名发布如何杀死它的提示，但网络已经有大部分遭受了攻击，他的消息无法传出去。此外，`伯克利`和`普渡大学`的团队各自独立想出了应对方法，但再次，他们传播解决方案的努力受到了蠕虫泛滥的阻碍。由于无法访问在线网络，大多数系统管理员不知道如何联系全国的同事；他们以前从未理由分享电话号码。大多数人从未面见过——毕竟这正是整个互联网的妙处。这种简单的电话号码交换标志着后来成为网络响应标志的早期课程：韧性，需要提前为攻击和停机制定计划，以加速修复和解决。这些挫折——以及对未来更有破坏性攻击的恐惧——导致了美国高级研究计划局（DARPA）资助并建立了第一个计算机问题协调中心，即位于`卡内基·梅隆大学`的一个团队，被称为“计算机应急小组协调中心”，简称`CERT/CC`。




  莫里斯蠕虫（Morris Worm）在某种意义上标志着互联网纯真时代的结束——这不仅因为它造成的破坏或影响，更因为当时正在发生更宏大的技术变革。在线网络正在迅速蜕变，随着
  1989 年万维网的发明而不断增长——这既降低了技术初学者的导航难度，也扩展了互联网图形的设计可能；同时，随着美国在线（AOL）、CompuServe 和 Prodigy
  等拨号服务的起，互联网体验开始向普通家庭开放。由于最初获得的是联邦资金资助，在它存在的头几十年里，利用互联网进行商业活动是违法的，但这项法律在 20 世纪 90
  年代初发生了变化，公司开始谨慎地涉足数字世界。这种新能量和商业利益推动了爱好者式捣鼓客精神的衰落。军方也开始关注；1992 年 12 月，五角大楼发布了其第一份当时仍处于机密的“信息战争”指令。


  “真正的”犯罪分子尚未涉足互联网。在某种程度上，是因为即使在拨号服务兴起的期间，人们也不完全清楚网上是否能赚钱。然而，互联网的创始一代很清楚，他们的世界正在终结。随着普通美国人涌入他们的世界，黑客拥抱了他们的“坏男孩”形象。Defcon
  是一个始于 1993 年的会议，最初有数百名、后来有成千上万的黑客聚集拉斯维加斯参加年度贸易展会，展会上提供了许多炫耀资本的机会。



  政府在起诉和政策辩论中继续步履蹒跚。著名黑客克雷格·尼多夫（Craig Neidorf）的审判宣告失败，因为他证明了被指控从电信公司偷取的文件实际上任何请求并支付
  14 美元的公众成员都可以获得。但政府调查人员取得了初步进展；当他们调查名为“欺骗大师”（Masters of Deception）的黑客小组时（该小组正与来自德克萨斯州的“末日之军”（Legion
  of Doom）进行在线斗争），政府首次安装了他们当时称为“数据探”（datataps）的设备，旨在拦截计算机之间的对话。他们从华盛顿运来高科技设备，并安装在世界贸易中心的一个特殊套间内，那里是美国特勤局纽约办公室。美国检察官奥托·奥伯梅尔（Otto
  Obermeier）在后来宣布起诉五名黑客时宣布：“这是未来的犯罪。这种行为将不被容忍。”记者警告说，未来的安全问题看起来很严峻；黑客渗透的电话公司系统和在线网络
  Tymnet，与“几乎没有安全措施”的新万维网相比，“看起来像一座堡垒”。


  在整个世纪世纪 90 年代，《通信规范法案》（试图严厉限制在线“猥亵”内容）以及夹片芯片辩论（克林顿政府提议为计算机配备只有政府才能解密的加密设备）引发了在线上的巨大动荡，那些人认为政府正在侵犯在线空间固有的自由。在我读法学院期间，我关注了约翰·佩里·巴洛洛（John
  Perry Barlow）等人关于捍卫在线空间独特主权的辩论和声明。在怀俄明州养牛的巴洛洛回忆道，当他面对赛网络空间的挑战时，一名 FBI 探员理查德·巴克斯特（Richard
  Baxter）出现在他的牧场，询问“新假体联盟”（New Prosthesis League），这实际上是一个名为“新普米修斯联盟”（Nu Prometheus
  League）的黑客组织。巴洛洛曾与史蒂夫·沃兹尼亚克（Steve Wozniak）等电话拨号者一起参加黑客会议，FBI 认为参加过该会议的人可能能够帮助他们追踪偷取苹果计算机公司代码的小组。“我以前就认识巴克斯特探员。在我还在经营畜牧业时，牲畜被偷过，他处理牲畜盗窃案是个不错的能手。但在这种情况下，他失策了，”巴洛洛后来回忆道。巴洛洛花了两个小时向
  FBI 探员解释他正在调查的犯罪。“那是那种转折时刻之一，我意识到这里有一群毫无头绪、武装精良且不安全的人在一个他们不理解的地方游荡——而这让他们感到恐惧。这不会产生任何好结果。”正如巴洛洛所说，“美国正进入信息时代，既没有法律，也没有保护的比喻。”司法部为检察官创建了一个新职位，称为计算机和电信协调员，负责处理此类案件并将助理美国检察官带到康提科的
  FBI 学院，在当时 CCIPS 负责人斯科特·查尼（Scott Charney）和马蒂·斯坦塞尔（Marty Stansell）的指导下接受培训。到 90 年代后期，不可否认，黑客那种无忧无虑的日子已经过去。黑客凯文·米特尼克（Kevin
  Mitnick）已成为某种名人，，在逃亡三年后被捕，结束了与当局超过十五年的猫鼠游戏。“在米特尼克被捕后，助理美国检察官肯特·沃克（Kent Walker）告诉`纽约时报`，“他无疑是世界上最通缉的计算机黑客。”尽管他名声显赫，他的被捕完全是因为私营部门研究人员的坚持，而不是政府。当他在北罗来纳州被找到时，发现他的团队包括一名计算机科学家下村武（Tsutomu
  Shimomura）和一名《纽约时报》记者，但现场没有看到一名 FBI 探员。该黑客未获保释，因为法官认为他“手持键盘”是危险的。米特尼克最终被判处监禁五年；在庭审期间，一架飞机在头顶盘旋，拖着“释放凯文”的标语。外国对手确实开始意识到网上可能存在巨大的间谍潜力，美国政府也开始理解自己的业务与数字世界的联系是多么紧密。互联网是一场等待发生的危机；当五角大楼组织一个内部黑客小组测试自己的网络时，他们轻易破解了所尝试的
  8,932 系统中的 7,860 个。几乎没有人注意到；只有受影响机器的 390 名用户检测到他们的机器被黑客入侵——而只有 20 人实际上采取了行动报告了黑客入侵。




  官员们也发出了警告，因为互联网已从一个偶尔摆弄和探索的地方，演变成驱动日常商业和通信的世界。在新的电子商务网站 `amazon.com` 于 1997 年 5
  月首次公募后仅两周后，FBI 逮捕了一名名为 `Carlos Salgado Jr.` 的黑客，他在网上的网名为 `Smak`，从一家互联网提供商处偷窃了 100,000
  张信用卡。Salgado 试图通过一张 `CD-ROM` 以 `$260,000` 现金出售这些卡——结果当他到达旧金山机场的吸烟室进行交易时，才发现他的地下接头人实际上是一名
  FBI 卧底。Salgado 被一个线线线人背叛了；当探员们发现他拥有的信用额度相当于 `$1 billion` 时候，他们感到非常震惊。


  Salgado 也许是第一个意识到通过在线盗取他人数据可以赚取多少资金的黑客。为了表明这一领域是多么么新颖，FBI 封锁了法庭记录，以确保信用卡被盗的客户永远不会知情——FBI
  和 Salgado 针对的业务担心“由于他人认为计算机系统可能存在漏洞而导致业务损失”。当时的政府担心，如果公司认为其业务可能受到影响，他们只会掩盖盗窃行为，而不是向
  FBI 报告。


  1998 年 1 月 28 日——此时，华盛顿正深陷克林顿总统与莫妮卡·刘易斯基关系的重磅炸弹事件中——美国参议院情报委员会召开了一场被忽视的关于国家未来威胁的听证会。从各个领域来看，来自
  `FBI`、`CIA` 和国防情报局 (`DIA`) 的领导人均指向了数字世界。在这次听证会上，FBI 副局长 `Bob “Bear” Bryant` 表示：“我们拥有一个极度依赖计算机及其为国家提供的服务的社会。它帮助了我们的经济。我们可能是计算机技术领域的世界领导者。但它也是一个漏洞，可以被并正被犯罪分子、恐怖分子、情报机构以及可能的军事机构所利用。我们必须投入基础设施和手段，来保护这个伟大的国家免受此类攻击的侵害。”


  `DIA` 负责人 `Patrick Hughes` 中将讨论了情报界如何评估对手——以及“意外”攻击极少真的是意外的。他说，潜在威胁包含三个组成部分：`capability`（能力）、`intent`（意图）和
  `will`（意志）。他认为，第三者总是最难评估的。“这正是大多数意外的来源。在过去，我们在技术上对 `capability` 并不感到意外。我们感到意外的是这种
  `capability` 被使用的方式或所处的环境。我们需要关注这一点，”他说。


  这一警告在随后的几年里被证明是完全正确的：在数字世界中，`capability` 很少让我们感到意外。相反，我们在随后的几年中面临的许多网络案件实际上都是完全可以预料的。


  ![](img/00006.jpeg)


  在那次国听证会后仅一周，即 1998 年 2 月 3 日，安德鲁斯空军基地 (`Andrews Air Force Base`) 触发了自动入侵报警：有人试图侵入空军国民卫队的计算机系统。这是一次所谓的入侵。



  2 月 25 日，哈姆雷在媒体早餐会上讨论了 SOLAR SUNRISE 案件，将其称为“迄今见过最有组织、最系统的[网络]攻击”，并解释说罪犯已确定为加利福尼亚州的几个青少年。这些言论迅速被媒体报道，令
  FBI 感到恐慌。“一旦案件公开，我们脑海中就涌现出许多想法。其中第一点，特别是在加利福尼亚州，就是尽快赶往现场，”FBI 主管特别探员斯柯特·K·拉森回忆道。


  当天晚上 6:30，FBI 搜查了那两处房屋并执行了搜查令。特勤探员克里斯·比森发现斯蒂姆正在卧室的电脑前工作，周围散落着空可乐罐和吃了一半的芝士汉堡。“当调查人员进入房屋时，那个人正在聊天频道中在线，”拉森回忆道。这些青少年迅速承认了自己的身份，并引导调查人员找到了名为`The
  Analyzer`的人——一个叫名叫埃胡德·特南巴姆的青少年。法医分析显示，特南巴姆可能黑了多达 400 个网站。在某种程度上，这是一个相对单纯的例子，反映了我们看到的主题在多年后以一种更加黑暗的方式得到了回响：年轻学生在网上接受培训，并在某种海外未知人士的影响下被激化，从而在本土发动攻击。


  理查德·克拉克警告说：“如果两个 14 岁的孩子都能做到这一点，想象一下一个坚定的敌人能做些什么。”没多久，这种情况就真的发生了。


  ![](img/00006.jpeg)


  1998 年 3 月，军方报告了俄亥俄州赖特-帕特森空军基地发生了新的黑客入侵，随后在马里兰州的美国陆军研究实验室也发生了类似的攻击。国防信息系统局（DISA）即五角大楼的网络工程师认为，入侵似乎来自伦敦的一个服务器，并联系了那里的互联网提供商获取更多细节——结果发现日志显示，不仅有许多其他美国系统被攻破，还追溯到了莫斯科的计算机。DISA
  迅速通知了 FBI。在接下来的几个月里，攻击者或多个攻击者继续扩大目标，袭击了大学和商业网站，以及其他政府网站，如能源部的国家实验室，黑进了洛斯阿拉莫斯、桑迪亚、劳伦斯·利弗莫和布鲁克海文的计算机。


  入侵发现了政府内部的软目标，并在当年的剩余时间里持续进行；调查人员在定位敌人方面进展甚微。无论这个黑客是谁，他都非常出色；五角大楼表示，这些入侵是“老练、耐心且持久的”。黑客甚至会编辑服务器日志以删除他留下的任何痕迹。FBI
  通过大学网站追踪了许多线索，但在每个案例中发现，教育服务器仅仅是攻击者的跳板。效仿 SOLAR SUNRISE 案，调查人员将新的入侵命名为 MOONLIGHT
  MAZE（月光迷宫）。这是一项庞大的调查，涉及 FBI56 个外地办事处中的 19 个案件和线索，指向了我们在网络案件中长期苦斗的协调挑战——即被感染的计算机和数字证据很容易地跨越了
  FBI 和司法部的地理组织界限。


  间接证据继续指向俄罗斯：FBI 注意到，该黑客（或多个黑客）按照“欧洲工作时间”活动，并休假了三个显著的假期：1998 年圣诞节以及 1999 年 1 月 7
  日和 8 日，这些都是俄罗斯正教节日。FBI 向前空军特勤探员、美国顶尖数字调查员之一的凯文·曼迪寻求帮助，他的工作显示，黑客的原始代码是用西里字母编写的。似乎来自俄罗斯的人正在窃取政府研究——而且不是为了娱乐，而是作为他们的工作。黑客显然完全清楚要取什么。其犯罪手法非常一致——进入新网络后，黑客会保存主目录列表然后注销，几小时、几天或几周后回来下载经过精心挑选的与政府先进新兴技术的特定文件。最终，调查人员相信，黑客实际上是根据一份五角大楼的公开文件（即“军事关键技术清单”）工作的。正如一位军事人士后来告诉记者托马斯·里德的那样，“这份文件充当了入侵者穿越所有陆军和政府系统的‘路线’。”


  在攻击接近一周年之际，政府成立了一个特别协调小组，由来自近 20 个五角大楼、执法部门和情报机构的 40 名代表组成；该小组制作了 T 恤，正面印有行动标志——一个位于蓝黄色迷宫之上的月亮，背面印有“Byte
  Back!（反击！）”字样。在 MOONLIGHT MAZE 协调小组成立几天后，攻击的大纲在 ABC 新闻的一份题为《目标五角大楼：通过俄罗斯发起的网络攻击》报告中公开。


  最近解密的文件显示，调查人员在一个被攻破的网络上放置了一个“数字蜜罐”，这是一个看起来很有吸引力的文档，包含特殊代码，允许他们追踪文档在被盗取后所经过的路径。蜜罐引导他们找到了俄罗斯科学院的一台计算机。当面对有关俄罗斯参与的证据时，负责监督五角大楼应对工作的军官约翰·“汤普”·坎贝尔准将对如何在这个新的网络领域做出反应感到不安；他向正在简报情况的情报官员问道：“你是说我们正受到攻击吗？我们应该宣战吗？”


  面对这种涉及国家的史无前例的案件，FBI 不确定如何进行。在白宫的批准下，他们决定正门向俄罗斯政府寻求帮助。在克林顿和鲍里斯·叶尔辛关系总体上友好的背景下，俄美执法部门之间的合作正在开启。根据作者托马斯·里德的说法，FBI
  在 1999 年初看到了自己的机会，当时俄罗斯内政部请求协助识别一个加利福尼亚网站背后的人，该网站曾诋毁了叶尔辛的女儿。FBI 趁机提出了自己的帮助请求。正如里德所描述的那样，调查人员锁定了五个特定的
  MOONLIGHT MAZE 入侵案件，在 3 月于华盛顿的一顿晚宴上，FBI 请求俄罗斯内政部长协助追踪这些案件。


  1999 年 4 月 2 日，一个由美国调查员组成的代表团登上了飞往莫斯科的达美航班：包括两名 FBI 探员、一名语言专家，以及一名来自 NASA 的特勤探员和两名来自美国空军特别调查局的人员。在华盛顿，另一支探员组成的特别小组驻守
  FBI 指挥部以协助协调，按照莫斯科时间工作，即东部时间晚上 11 点到下午 6 点。





  很快人们清楚，这并非一起刑事案件，而是一起国家安全案件。这些入侵很可能是在政府明确许可下由俄罗斯情报部门实施的。早期的合作尝试仅仅是政府内部的沟通误解。意识到自己的作用已经结束，联邦调查局（FBI）关闭了调查，尽管在接后的几个月里，攻击者继续探测五角大楼的网络。攻击变得如此频繁，导致五角大楼首次要求所有计算机用户更改密码，以巩固网络安全。当年
  8 月，五角大楼正式成立了他们所谓的“联合任务部队——计算机网络防御小组”。在宣布成立新中心时，哈姆雷（Hamre）宣布：“网络空间不仅仅是极客的领域。现在，它是战士的战场。”⁸⁰


  在整个政府和私营部门，千年的到来凸显了各机构将技术紧密地整合到其系统中，却没有意识到潜在的负面影响。随着 1999 年 12 月 31 日的最后几分钟流逝，肖恩·亨利（Shawn
  Henry）被锁在 FBI 特殊的千禧年（Y2K）指挥中心内。他以及政府的其他数百人紧张地等待着千禧年虫是否会造成灾难。Y2K 问题在于，那些依赖于两位数字显示年份的计算机程序（例如，1989
  年 11 月 21 日显示为“112189”），在 1999 年跨入 2000 年时，突然面临计算结果可能偏差一个世纪的风险。⁸¹人们担心飞机会从天空坠落，ATM
  机将停止工作，员工记录或会计软件会在程序努力处理多年来的冲突数据时陷入混乱。


  肖恩曾开始处理公职腐败案件，并最终晋升为当时被称为“计算机入侵中心”的部门主管。在那个时代，这并不是一个光光的职位。他回忆道：“我不认为有其他人申请过这份工作。”但在互联网黎明时期，这是一个开展有趣工作的地方。他帮助促成了首个
  FBI 在线卧底调查的批准。他被推向了政府在年底前加固数字基础设施的前线。随着技术日益成为美国生活的中心，数十亿美元投入了旨在使系统符合 Y2K 标准的紧急工作中。⁸²


  午夜正分，指挥部的灯熄灭了；现场发出一阵惊呼。随后，随着灯光重新亮起，爆发出了笑声，大家意识到这只是个作剧。一名探员关掉了灯开关。随着新年按时区推进，问题在范围内范围内，但大多数都是小问题。世界躲过了这一劫难。


  2000 年后不久，新的数字威胁出现了——而第一个主后手再次是一个青少年。迈克尔·卡尔塞（Michael Calce）在 20 世纪 90 年代在线上长大。“我以前是个挺调皮的孩子。我来自一个离异家庭。我父亲在周末对我有监护权，他不确定该如何让我分散注意力，于是从公司拿了一台电脑带回家，说：‘给你，自己想想怎么玩，’”卡尔塞多年后解释道。当他九岁获得`AOL`的第一次免费试用时，他黑进了系统，让自己能够免费继续使用早期互联网服务。⁸³他继续进行实验，并采用了`Mafiaboy`这个在线网名。他利用常用的在线黑客工具获取了对防御松散的大学网络的控制权，并将其转化为一个强大的工具。


  2000 年 2 月 7 日（周一）清晨，14 岁的卡尔塞释放了一种相对新的瘟疫：`DDoS`攻击。这种攻击用成千上万台被劫持、感染的“僵尸”计算机的流量淹没了目标网站——而通常原所有者并不知道自己的电脑已被接管。他希望在黑客世界中声名鹊噪。“总的目的是恐吓其他黑客团体，”卡尔塞后来说，“整个黑客社区追求的都是名声和探索。”⁸⁴


  奏效了——而且效果好得惊人。到上午 10:30，`Yahoo`的网站被完全堵塞；半数用户甚至无法访问。在接后的几小时和几天里，类似的攻击袭击了`eBay`、`Amazon`、`CNN`、`ZDNet.com`以及其他顶级网站。这些备受关注的攻击引起了从白宫到下基的立即关注，当
  FBI 调查员看到有人在网络聊天中吹嘘一个尚未公开的`DDoS`目标时，他们开始锁定了一个嫌疑人。“你只要死死锁住他们，他们无法重定向，”`Mafiaboy`在一次聊天中这样说，然后吹嘘说他要提高目标：“我在想搞个大大的。也许是`www.nasa.gov`。”⁸⁵


  当 FBI 将嫌疑人的互联网连接追溯到加拿大时，他们寻求了加拿大皇家骑警警察的帮助。几天之内，卡尔塞注意到街区尽头停着一辆可疑的公用卡，他知道事情败了；很快，骑警警察逮捕了`Mafiaboy`。他最终对
  55 多项指控认有罪。他的法院指定的社工在法庭上作证说，`Mafiaboy`“没有表现出任何悔意，很可能再次黑客，并且需要更有组织的管理。”86)


  FBI 和美国政府无法相信他们抓到了一个 15 岁的少年。负责起诉此案的克里斯·潘特（Chris Painter）回忆道：“同样的争论发生了——这必须是国家级行为；这太复杂了；不可能是别的——结果却是一个
  15 岁的少年。这确实让人们看到我们的脆弱，我认为这引发了许多关于如何处理这些问题的问题。”87)


  这起案件非常严重——市场分析师估计损失超过 10 亿美元——并被视为国际执法的一次关键早期胜利。司法部长珍妮特·里诺（Janet Reno）一直是早期打击网络犯罪的主要推动者，并向私营部门宣传了日益增长的威胁，她宣布此案展示了我们追踪网络犯罪分子无论身在何处的能力。”⁸⁸


  在攻击持续期间，克林顿总统召开了互联网安全会议，再次重复了呼召：国家面临着迫在眉睫的“电子珍珠港”，而`DDoS`应该是一个“警钟”。在`Mafiaboy`攻击一个月后，司法部启动了一个名为`cybercrime.gov`的网站，旨在宣告其新的在线努力。⁸⁹


  然而与此同时，对于一个法律上还没到开车年龄的技术型青少年，这似乎并不让人大惊。`DDoS`攻击凸显了互联网危险的弱点，尽管当时互联网泡沫推动着数百万人进入网络，电子商务也飞速发展。一个
  15 岁的男孩让全球顶尖网站掉线了。


  技术记者凯文·鲍尔森（Kevin Poulsen）在`Mafiaboy`攻击两个月后写道：“我们现在知道，互联网的设计并不是为了承载新的经济，在青少年能够毫无问题地堵塞网站之前，我们需要进行一些基础性的改进。”`Mafiaboy`并不是那个指出皇帝没穿衣服的正直孩子；他是许多通过向皇帝私处扔东西来指出这一点的有罪孩子之一——这是一种更严重的违法。”⁹⁰





  那个四月，正值乔治·W·布什新政府上台仅几个月，而且距离我关注中国还有好几年——当时我正埋头于“全球繁荣研究所”的税务欺诈案中——美国空军的一架 EP-3 侦察机在南海海上与一架中国战斗机相撞。这架技术上被称为`ARIES
  II`的信号情报机的美国飞机当时正从其日本基地出发执行一项为期六小时的常规任务，监测电子信号传输，此时两架中国战斗机在距离海南岛约 70 海里的地方对其进行骚扰。其中一架速度快、机动性强的战斗机撞上了这架正平直飞行的美国慢速螺旋桨飞机。战斗机坠毁，导致中国飞行员丧生，而受损严重的美国飞机被迫在携带
  24 名机员的情况下在海南岛紧急降落。这次相撞引发了一场外交危机，因为飞机机员被扣留了十天，美国政府要求归还其敏感飞机。


  这一事件在今天已大多被遗忘，但它可能引发了两国未来多年低级网络冲突中的第一场在线冲突。当空军机员作为战俘被留时，一个名为`PoizonB0X`的美国黑客组织篡改了多个中国网站，上面留有类似“我们将永远恨中国”的标语。


  中国黑客进行了报复。5 月 1 日，即劳动节——中国的国家劳动假日，白宫网站因遭受`DDoS`攻击而离线，遭到恶意网络流量如洪啸般的冲击，足以阻塞系统使其陷入停滞。类似的事件在整个政府部门蔓延；内政部的一个网站被篡改，上面写着：“击败美国的[sic]帝国主义！攻击反华的傲慢！”全国范围内有超过
  1000 个网站遭到攻击——似乎毫无章可循。俄亥俄州一个学区的网站播放了中国国歌，画面中该国的红旗帜在飘扬。不隶属于政府的美国黑客也做出了同样的回，在中国的网站上贴上侮辱性的评论。这一事件看起来像是一个奇特的新闻。《纽约时报》专门用了七个段落报道这一事件，称其为“第一次世界黑客大战”。


  当时我们并不知道这些在线冲突最终会变得多么普遍——事实上，在线冲突的几个参与者之一是上海交通大学的一群爱爱国的中国平民计算机工程师，他们被称为`Javaphile`；他们在一年前成立是为了分享`Java`语言的开发技巧，在
  EP-3 相撞后的几周内，他们抓住机会加入了在线保卫家国的行动。该小组给自己更名为“中国和尚”（Honker Union of China），这个短语的大意是“红黑客”，旨在唤起他们的爱国动机。


  当时，特别是在空军机员被安全送回美国后缓解国际紧张局势的期间，共产党似乎与“和尚”保持了距离，谴责双方的攻击都是“网络恐怖主义”和“不可原谅的违法行为”。多年以后，我们才明白谁是中国攻击背后的推手——同样也才意识到这一事件是未来怎样的预兆。在十年之内，中国政府对网络攻击采取了完全不同的方法。


  ![](img/00006.jpeg)


  那个春天，即 2000 年 5 月，“我爱你”病毒爆发，在互联网上蔓延，因为人们点击了声称是朋友情书的邮件，但这些邮件实际上会在他们的电脑上安装恶意软件。“FBI
  计算机犯罪部门负责人肖恩·亨利（Shawn Henry）回忆道：“当然，每个人都想知道是谁在爱慕他们，所以他们都点击了，结果他们的电脑全部都感染了这种病毒。”该案件挑战了
  FBI 的组织结构。亨利回忆道：“过去的问题之一是，当发生某种犯罪时，管辖地（[the] venue）相对明确。它就在行为发生的特定城市。”然而，“我爱你”病毒的受害者遍布了美国
  50 个州和 FBI 的所有 56 个分局——每个分局从那时起声称拥有“管辖权”。作为 FBI 计算机入侵部门的主管，轮到他来选择一个；他选了纽瓦克，但随后案件发生了更复杂的转折。经过严密调查，探员们将感染源追溯到菲律宾的一个年轻男子。他们实际上能够指导菲律宾当局直接前往该黑客家中为其戴上手手铐。“归根结底，菲律宾政府没有针对他的行为的法律。所以，尽管他被确认了身份，尽管他造成了巨大的经济损失——这引起了全球关注——但他什么也没有发生。他们逮捕了他，然后又放了他，”亨利回忆道，“我从中体会到的是，这不仅仅是美国的问题。这是一个全球性问题。”


  这一信息在司法部引起了共鸣。尽管美国自身也在苦于如何应对网络威胁，克里斯·佩因特（Chris Painter）和司法部的同事已开始推动国际合作伙伴加强计算机犯罪法——不仅是为了让他们的法律达到美国模式，而且在某些情况下实际上更进一步，在美国法应对网络犯罪挑战仍显得过于无力时推动法律的进步。在几个月内，菲律宾更新了法律——其他国家也随之效仿。


  然而，政府似乎在追赶。随着互联网泡沫热潮改变美国人的生活，将互联网带入数百人在家庭和工作中的日常生活，黑客行为也变得专业化了，从一个爱好者的乐场变成了罪犯的利润中心。凯文·米特尼克（Kevin
  Mitnick）那种“顽劣”的电话破解黑客的时代结束了；取而代之的是具有侵略性的罪犯，他们关注的不是探索，而是利用。


  ![](img/00006.jpeg)


  2001 年，当我从司法部总部调到仅几个街区之遥的华盛顿联邦检察官办公室时，我很快成为了团队在数字取证和数字证据方面的专家。华盛顿联邦检察官办公室是独特的，因为首都是不是一个州而是联邦区，这意味着我们不仅起诉典型的联邦犯罪，还负责起诉通常由地方或州检察官起诉的普通犯罪。在随后的几年里，我轮流负责起诉家庭暴力、暴力犯罪，最终是杀杀案。





  司法部的崇高使命不仅仅是关押罪犯；我作为一名美国联邦检察官助理时学到的早期教训是，这项工作的很大程度上在于`不`对每一个案件提起起诉；对于许多理想的解决方案来说，司法系统的工具可能太粗浅了。作为检察官，大部分工作是与受害者会面、与他们交流，并确保理解“正义”对他们意味着什么——他们想要什么样的补救措施或解决方案？这同样适用于家庭暴力受害者、毒瘾成者的受害者以及枪击犯罪受害者。你不能仅仅一个案一个案地处理这些祸害，而是必须审查联邦政府可以针对特定问题所提供的各种工具。我发现这种方法（有时被称为“社区警务”）也适用于网络犯罪和知识产权案件。


  克里斯·佩特纳（Chris Painter）曾是司法部网络犯罪领域的早期领导者之一，他回忆了`FBI` 花了多长时间才弄明白如何处理此类案件。在早期，`FBI`
  进入一家被黑客攻击的企业时就像闯入瓷器店的公牛，为了收集证据会瘫痪整个业务运营。“即使在 90 年代后期，我们局内部也零星发生过一些案例，我们听说 `FBI`
  进去后，为了保护数据，基本上没收了受害者的机器——让其长时间离线。我们立即就处理了这个问题，”他回忆道。“这种情况后来没有再次发生。虽然故事在重演，但幸运的是，我们能够确保保护了受害者，我们意识到他们是持续关注的问题。我们试图在获取所需信息的同时，能够让业务继续进行。”


