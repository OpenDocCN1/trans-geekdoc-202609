  [content]

  13 岁时，他就觉得这种游戏很幼稚；到了 15 岁时，他“变得政治化了”。他发现自己深陷网络，观看在克什米尔和巴基斯坦等国家儿童被杀死的视频，并被那些关于共济会和光明光会的阴谋论网站所吸引。这些网络“兔子洞”让侯赛（Hussain）与七个朋友一起建立了一个黑客组织；他们自称为
  `TeaMp0isoN`，这是基于他们旧黑客论坛 `p0ison.org` 的黑客术语。他们在 2011 年因其独特的“黑客行动主义”而臭名昭著：破坏网站（通常带有支持巴勒斯坦的信息），并攻击
  `BlackBerry` 和 `NATO` 等关键在线网站，以及前总理托尼·布莱尔等人物——他们黑入了布莱尔私人助理的手机，并在网上发布了他的通讯录。侯赛蔑视了像
  `Anonymous` 等其他“黑客行动主义”组织，认为他们象征着网络版的“和平抗议、街头露营”，而他的 `TeaMp0isoN` 执行的是“网络游击战”。2012
  年 4 月，`TriCk` 告诉一家英国报纸：“我不畏惧任何人或权威。我的一生都致力于这一事业。”


  他的网络恶作事迹并没有持续多久：到 2012 年 9 月，他因为针对布莱尔的闹剧被判处入禁六个月。`TeaMp0isoN` 渐渐销声了，但侯赛对西方社会的愤怒和怨恨仍在持续积累。出狱后不久，他前往叙利亚的
  ISIL 领土，并娶了另一位从英国籍准音乐家转变为 ISIL 信徒的莎拉·琼斯（Sarah Jones）。在那里，他投身于 ISIL 的网络宣传战，将自己重塑为
  `Abu Hussain al-Britani`，其 `Twitter` 头像显示他半张脸被面具遮住，对着镜头举着一把 `AK-47` 式的步枪。他将学到的关于网络文化和工具的所有知识转化为一位记者所说的“恐怖版的在线约会”，他作为
  `CyberCaliphate`（网络哈里发国）ISIL 的首席宣传员迅速成名，招募像他一样对现状不满的年轻人加入全球战场。“你可以坐在家里玩 `Call of
  Duty`，也可以来这里响应真正的使命召唤……选择权在你手中，”他在一条推文中这样宣布道。


  侯赛的策略并非新颖，但他和他同为 ISIL 的恐怖分子执行这些策略的水平是我们前所未见的。在某些方面，侯赛代表了我们迄见过最危险的恐怖分子——一个新兴数字圣战世界的大师。


  当时，恐怖分子并非唯一研究如何通过比特和字节执行其现实世界恶作剧的人。我们看到来自各威胁都在增长，来自外国敌手、有组织犯罪、在线活动人士组织，甚至是孤立黑客和破坏分子。虽然“网络安全”是如今新闻中常见的话题，但只有极少数的人理解在线威胁演变的规模、范围和速度。我写这本书的目标是讲述美国“代码战争”的开端故事，讲述犯罪分子、恐怖分子和间谍如何在一个从未考虑过安全与防护的全球网络上安营乐业——以及美国政府、检察官、`FBI`
  和我们的国际盟如何花费四分之一世纪的时间追赶。接下来的内容不仅仅是一个关于好人追逐坏人的犯罪惊悚故事——它更是一个警告：我们建立在脆弱的技术之上构建了现代社会，而对对手的创造力考虑得太少。


  我讲述这段关于美国政府在网络上第一个四分之一世纪斗争的故事，是希望它能帮助破解一个对外人来说往往显得晦涩的领域，让读者理解这种新的威胁格局，并对这个国家应该如何思考日常生活向互联网转移的转变提出重要问题。让我明确一点：这并不是黑魔法。我们知道如何对抗网络攻击。在过去几年里，我们已经建立起了一套有效的应对方案。我们知道如何针对坏人并建立针对他们的案件——而此举可以产生影响。我在书中讨论的几乎每一个案件都得到了解决，我们也已尝试通过各种方式让嫌疑人受到法律制裁。


  但在未来的几年，还有很多工作要做。


  ![](img/00006.jpeg)


  我出生并成长于纽约市，我的家人仍然住在那里。2001 年 9 月 11 日，我的父亲当时在世界贸易中心下方的地铁车里，我的姐夫在不远的办公室窗外目睹了袭击，而我的妻子在纽约出差。当时，我在司法部担任一名初级检察官，我记得当时疯狂地拨打各个电话确保我的家人都无事——那天我们是幸运的，但有许多其他家庭并非如此。在接后的十五年里，我有机会与其他人一起工作，确保美国不会再次遭受那样的攻击——首先侧重于反恐主义，后来侧重于网络威胁和间谍活动。


  我们早早就知道恐怖分子迟早会转向互联网——因为那样实在太容易了。我在政府里花费了大量时间观察这种日益增长的威胁，并预判我们何时会首次看到“混合攻击”，即一种将在线行动与现实世界动能攻击相结合的攻击——例如，恐怖分子在攻击城市通信系统的同时引爆炸汽车炸弹，从而倍增攻击带来的恐慌、混乱和影响。恐怖分子也看到了这种可能性：`al-Qaeda`
  甚至在 9/11 之前发布过一段视频，将计算机网络安全的漏洞与航空安全中的弱点进行对比。


  当我 2007 年进入 `FBI` 并在担任特别顾问，随后担任局长 `Robert Mueller` 的幕谋长时，来自 `al-Qaeda` 的威胁已经发生了演变。`Osama
  bin Laden` 的恐怖组织最初依赖于集中执行的计划（如 `9/11` 和 2006 年的跨大西洋飞机袭击计划），但在 9/11 之后，`NATO`、西方情报机构和美国政府所有工具的持续行动严重削弱了他们远距离组织和指导攻击的能力。相反，“核心”
  `al-Qaeda` 实际上允许“恐怖组织分支机构”代表他们继续执行任务，例如阿拉伯半岛基地组织（AQAP）和伊拉克基地组织（AQI）后者后者即是演变为 ISIL
  的恐怖运动。


  在线恐怖主义呈现了一个独特的新转折——美国以前从未参与过一种敌人可以从海外直接与美国个人进行交流的冲突。在第二次世界大战期间，“东京玫瑰”（Tokyo Rose，她的真名
  `Iva Toguri D’Aquino`）通过无线广播向美国士兵传播英语宣传，正如“轴心萨莉”（Axis Sally）在欧洲所做的那样。越南战争期间，有“河内汉娜”（Hanoi
  Hannah）。第一次海湾战争出现了“巴格达贝贝蒂”（Bagdad Betty）和“伊拉克杰克”（Iraqi Jack）。但 20 世纪 90 年代末，互联网让这些广播面向全球观众。正如《连线》杂志所写：“历史上从未有恐怖分子能如此轻易地接触数百万人的思想和眼球。”


  这场革命在 2000 年代进一步加速。事实证明，使网络对叛乱分子和小众社区有利的相同原则——其开放性、易用性和全球范围——也使其对助长和鼓励在线极端主义变得有用。在我搬进位于宾夕尼亚大街巨大的
  `J. Edgar Hoover` 大楼新办公室的前几个月，一个名为 `Twitter` 的新在线工具了。当时我们并不知道它会给在线极端分子带来多大的权力。




  伊斯兰极端主义主要发展在国家控制媒体的国家，如埃及和沙特阿拉伯，因此该运动自然地在替代通信手段上投入了大量资金。网络似乎是完美的；事实上，它对圣战运动增长的帮助超过了任何其他援助，在许多方面促成了基地基组织的国际化崛起。“核心”基地组织主要依靠在全球清真寺和社区中心的面对面讲座和募捐巡演——在
  9/11 事件之前甚至包括在美国境内——并曾短暂尝试过“Web 1.0”技术，如论坛、公告板和邮件列表服务，以传播其教义。


  事实上，基地组织特意避开了了报道其全球圣战中更具暴力的一面。它认为，争夺“人心”的全球斗争最好通过思想而非惨惨的视觉形象来获胜。当它由 `Abu Musab al-Zarqawi`
  领导的伊拉克分支开始分发残忍斩头的视频，并配以当时令人恐怖、但现在已习以为常的橙色连体服人质形象时，基地组织的最高副手领 `Ayman al-Zawahiri`
  写了一封信，警告伊拉克小组收敛其恐怖秀。“我向你们说：我们正处于一场战斗中，而这场战斗的一半以上发生在媒体战场上。我们正处于一场媒体战中，在争夺我们乌姆玛（Umma
  [穆斯林人民]）的人心的竞赛中进行战斗，”`al-Zawahiri` 这样写道，温和地斥责他那急躁的伊拉克同事。“那些爱和支持你们的穆斯林民众永远无法忍受……屠杀人质的场景。”5


  这种方法上的差异代表了即将到来的代际分歧信号，即基地组织的老一代领袖（如 `bin Laden` 和 `al-Zawahiri`）与理解在线图像力量的精通技术的新一代之间的分歧。它反映了我们在世界每个领域都能上演的代际分歧。全球的公司和机构正经历着这种分歧：那些还记得电脑以前时代的人，与那些他们认为使用
  `iPhone` 就像呼吸一样自然的人。


  没多久，这群新一代人开始为基地组织发挥关键作用。21 世纪初，一个名为 `Irhabi 007` 的人（`irhabi` 在阿拉伯语中是“恐怖分子”）成为了基地组织的某种网络管理员。6
  他在几个关键的密码保护圣战论坛中成为领袖——这些网站被称为 `Muntada al-Ansar al-Islami`（伊斯兰支持者论坛）和 `al-Ekhlas`（诚实），并帮助传播来自伊拉克恐怖子的信息。一位恐怖分析师
  `Evan Kohlmann` 将 `Irhabi 007` 称为“无可争议的网络恐怖主义之王”。


  没有人知道他是谁——甚至不知道他住在哪里——直到他在 2005 年在网络上消失，不久后，英国警方作为炸弹袭击调查的一部分，逮捕了一名 22 岁的西伦敦人 `Younis
  Tsouli`。直到后来，警察才意识到他们抓到了谁——他们还确定了两个协助他的同伙：`Waseem Mughal` 和 `Tariq Al-Daour`。`Al-Daour`
  曾是该行动的资助者；当警察逮捕他时，发现他的电脑里存有超过 37,000 张被盗的信用卡，这些信用卡资助了超过 350 万美元的购买支出，购买了这些人认为可以帮助圣战者的设备，从
  `GPS` 设备到夜视镜，以及 250 多张航空机票。7*


  在英国，`Tsouli` 和他的两个同胞成为英国首批因阴谋在网上实施恐怖主义而被定罪的人。正如苏格兰场场的官员 `Peter Clarke` 当时所说：“这向我们展示了他们在互联网上进行行动规划的程度。这是我们见过的第一起虚拟谋杀阴谋。”8


  这是第一个，但不是最后一个。到 21 世纪中期，基地组织正经历着巨大的转变，因为来自美国和全球的持续压力——从无人机打击到金融制裁——使该组织的核心缩减为其以往能力的影子。其战术的转变在
  2006 年左右加速，当时英国情报部门阻止了一项击落多架飞往美国西方的跨西洋飞机的大型计划。当英国官员在 2006 年 8 月 9 日晚上搜捕了二十多名嫌疑人时，对我们来说这是一次险之又失，但我们在拦截基地组织所偏好的那种中心化指挥、有组织的、壮观的攻击（如
  9/11）方面已经做得得多。相反，基地组织被迫从远处煽动袭击。从那时起，我们开始看到基地组织及其分支向更具创意的社交媒体工具迈出第一步。


  毕竟，恐怖主义是一种独特关注吸引媒体注意的战术。转向恐怖主义的人明白他们永远无法获得彻底的军事胜利；因此，他们转向恐怖运动，旨在动摇地区并迫使政府对政治压力和民间起义做出反应。无论你观察的是
  `IRA`、黑九月，还是基地组织，这在历史上都是如此的。恐怖主义作为一种战术，是一种依赖心理胜利而非军事胜利的边缘现象——如果没有公众关注和媒体报道，它就无法发生或成功。从其名称本身，它寻求恐吓——放大其影响和人们的恐惧。*


  一个特殊的基地组织招募人员，名叫 `Adam Gadahn` 的美国人（他绰号 `Azzam the American`）开始采用新的媒体战术，出现在视频并担任组织的公共发言人。他制作良好的视频阐述了组织的哲学，并附有英文字幕，以确保尽可能大的观众。其他圣战者遵循了类似的模式：在车臣，伊斯兰极端分子创作了名为“俄罗斯地狱”的视频类型，描绘了对俄罗斯军队的奇袭，这是一个旨在破坏占领军士气的并不晦的信息。在东非，一位在阿拉拉巴马州长大并加入青年之组织的二十多岁穆斯林
  `Omar Hammami`（`Abu Mansoor Al-Amki`）开始出现在恐怖视频中，随着时间推移变成了该组织最为人知的者之一。2009 年 3 月，他主演了一段
  31 分钟的招募视频，描述了恐怖组织对埃塞俄比亚军队的进攻。他请求更多招募人员：“如果你能鼓励你的孩子、你的邻居以及你周围的任何人……参加这场圣战，将对我们是巨大的资产。”该组织的视频是多语言的，出现了来自世界各地的战士出镜，并试图接触尽可能广泛的全球观众，包含阿拉伯语、瑞典语和乌尔固语等，并配有英语和斯瓦希尔语字幕。随着青年之组织战斗的持续，Hammami
  还发布了音频信息并在网上上传了一份 127 页的回忆《一个美国圣战者的故事：第一部分》，追溯了他从高中到激进化再到青年之组织的历程。9


  虽然青年之组织成功地锁定了目标并诱导了少数招募人员——主要是男性，大多来自明尼苏达州和双城区——但在线招募努力并没有特别有效；在某种程度上，它们是意识形态垃圾，相当于尼日利亚诈骗邮件骗者发送
  10 亿封邮件，并希望万分之一之一的人足够愚蠢，相信一个被罢黜的石油部长需要他们帮助将非法所得运出非洲。




  然而，这些在线恐怖分子招募者中没有能比得上曾任美国伊玛姆安瓦尔·阿尔-奥瓦基（Anwar al-Awlaki）的声望。他出生于墨西哥州，他的也门父亲曾获得富布莱特奖学金留学，在他七岁时，家人回了也门。他在
  1991 年回到美国读大学，在随后的几年里成为一名野心勃勃且著名的穆斯林伊玛姆，先在圣地亚哥，后来在弗吉尼亚州北部。他为自己的教学建立了全国乃至国际性的听众，通过伊斯兰书店和在线网站出售他的讲座
  CD 光片。


  `FBI`怀疑他与 9/11 袭击计划有关，部分原因是因为他曾指导过两名劫机者纳瓦夫·阿尔-哈兹米（Nawaf al-Hazmi）和哈立德·阿尔-米赫达尔（Khalid
  al-Mihdhar），但这从未被证实。2002 年，`FBI`监控小组观察到他经常约妓。他以前做过这种事；事实上，他曾于 1997 年在圣地亚哥因同样的指控被捕——显然，由于恐慌`FBI`可能会暴露他并不纯洁的生活，他于
  2002 年逃亡到了英国。2004 年，他永久性回到也门，在那里他变得日益激进，并成为阿拉伯半岛基地组织（`AQAP`）的公众面孔，这是第一代基地组织分支机构中最有效、最危险的一个。


  他关于伊斯兰教的讲座——在`YouTube`上很容易找到——继续吸引着忠实的追随者；他言辞雄辩且富有魅力，将这一和平穆斯林宗教的意识形态扭曲为对战争的鼓励，并在讲座中使用口语化的英语——这本身就代表了一个重要的启示，将潜在听众群体扩大到了大多数美国人无法理解的常规仅限阿拉伯语宗教教学之外。


  除了在线讲座外，他还与另一名美国人萨米尔·汗（Samir Khan）合作，帮助`AQAP`接触新的听众，并为他们的事业建立精美、引人注营销材料，包括一份制作精良的名为《启发》（Inspire）的`PDF`杂志，该杂志鼓励远处的极端分子不要担心远往巴基斯坦或也门等遥远地区攻击不信教者——而是留在家里发动该杂志所谓的“开源圣战”（Open
  Source Jihad），通过将一辆租来的皮卡车变成“自杀移动载具”，或者正如“基地组织厨师”写的一篇文章所解释的那样，“在你妈妈的厨房制造炸弹。”


  该杂志的第一期甚至引用了美国官员对基地组织新战略的解释。《启发》杂志的某一期刊登了国防部长罗伯特·盖茨（Robert Gates）的话：“很清楚，像奥瓦基这样生活在也门的人和其他人，看到美国境内的任何形式的攻击，即使是小规模攻击，与世界贸易中心、双子大楼相比，他们将其视为自己的成功。因此，这`FBI`、情报机构、司法部和当地警察面临的挑战变得更加困难。因为你可能面对不是一个涉及许多人的大型、复杂的计划，而那样可能更容易被发现。”


  其他文章为那些愿意前往海外旅行的人提供了关于“圣战中可以期待什么”的建议。该杂志第一期承诺：“开源圣战是美国最糟糕的噩梦。”杂志包含了可以联系安瓦尔·阿尔-奥瓦基或其他`AQAP`招募者的电子邮件地址，鼓励潜在的圣战分子开始对话——正如有太多人这样做的那样。


  事实上，到 21 世纪 00 年代后期，安瓦尔·阿尔-奥瓦基的指纹出现在我们在美国发现的每一个重大恐怖袭击中，包括 2007 年迪克斯堡军事要塞（Fort Dix）的袭击、2009
  年小石城军事招募办公室的射击事件，以及 2010 年时代广场炸弹客——所有这些案件的攻击者都订阅了奥瓦基的信息，并热衷于他的宗教讲座。他的影响力证明是长远的：他对一名西雅图漫画家发出的死亡威胁迫使她躲起来；而那个刺了英国政客的伊斯兰极端分子——基地组织追随者在英国发起的首次暗杀尝试——在事后解释说他的讲座启发了她。





  有一刻，在他去世后，美国的恐怖威胁似乎有所平息。2011 年，我从 `FBI` 调到司法部，担任 `Lisa Monaco` 的幕僚长——在奥巴马总统任命她为国家安全助理司法检察长之前，她曾是
  `Mueller` 的二号人物。Lisa 担任助理司法检察长的礼仪宣职仪式，实际上是在司法部华丽的大厅内举行，那是一场充满仪式感的活动，恰好与阿尔·奥瓦拉基（al-Awlaki）被杀的那天相。我们在国家安全部的第一份工作是共同评估我们在应对当前威胁态势方面处于何种位置。在
  2011 年的那个精确时刻，特别是在阿尔·奥瓦拉基去世后，我们似乎已经转过了关头；我清楚地记得，当我们宾夕法尼亚大街另一侧安顿新岗位时，有人告诉我们，当恐怖主义不再是我们国家面临的主要驱动威胁时，`NSD`
  的策略应该是什么，我们需要进行深思考。我们认为自己已经有了答案——网络安全和反间谍工作。我们哪里知道，自己即将经历自 9/11 事件以来美国最糟糕的恐怖时期。


