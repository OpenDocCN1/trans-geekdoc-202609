  当“伊拉克基地组织”从“核心”基地组织分裂，并演变为被称为 `ISIL` 的战斗力量时，该组织的领导层成功地极大地进化了其他恐怖组织的多媒体手段，特别是当 `Twitter`
  等社交媒体在全球范围内爆发式增长时。2014 年 `ISIL` 进攻巴格达时，社交媒体展示了其黑旗在伊拉克首都上空飘扬的照片，这支恐怖军队在短短一天内推文了 4
  万次。


  该组织的视频成了我们 `FBI` 晨间威胁简报中恐怖的常态；每天早晨，`FBI` 和司法部的反恐及国家安全领导层都会聚集在 `Hoover Building`
  局内先进的指挥中心，审查国家当天面临的首要威胁——从地缘政治发展到全国范围内的个人阴谋和嫌疑人，无不包。。太多早晨目睹了质子的惨死、叙利亚被俘的战斗员或其他 `ISIL`
  的其他受害者。这些并不是抽象的死亡；与 `ISIL` 质子的家属会面，了解他们斗争的痛苦，激励着探员、检察官和其他官员。对我来说，这段经历让我想起了担任谋杀案检察官的日子——家庭失去亲人的原始情感，以及为他们伸张正义并安慰留守者的愿望。


  `ISIL` 庞大而复杂的宣传机构深谙如何吸引公众注意力：通过展示叙利亚战斗员、质子以及几乎任何阻挡 `ISIL` 道路的人的残忍图形处决画面。`ISIL` 的残暴与世界经历过的任何事情不同；虽然野蛮长期一直是战争的一部分，但战斗员通常会竭力保持其秘密。`ISIL`
  在所到之处每都超越了自身的丑恶程度，用多个摄像角度精心地策划大规模屠杀，并为了获得“完美”镜头而努力，以至于执行者有时会看着提示卡读词。这些视频旨在威慑对手，赋予该组织一种无全能的力量感，而这种力量往往与地面实际情况不符。根据视频，每一天的战斗都等同于胜利——即使视频显示了
  `ISIL` 的伤亡，他们也是经过精心摆拍并被庆祝为正义的烈士。为 `ISIL` 死亡是一种荣誉。


  对地面战争——对实际圣战行为的庆祝——是建立在青年党等组织（al-Shabaab）等组织的在线视频之上的。“核心”基地组织长期以来崇拜奥萨马·本·拉丁，其大部分招募和宣传工作都源于他的个人信息，而
  `Anwar al-Awlaki` 的长期演讲集中在对伊斯兰教扭曲的意识形态解释；这些后期伊斯兰极端主义的化身则崇拜个人战斗员，将圣战的吸引力描述得不像一种宗教体验，而是正如
  `Junaid Hussain` 在他的 `tweet` 中说的那样——是一个体验冒险生活的机会，是从玩 `Call of Duty` 变为参与战斗的荣耀。正如
  `Wired` 所写，这些视频“播放起来就像《警界实录》（Cops）中的一个魔鬼剧集：带着手持设备的摄影师跟随 `ISIS` 死亡小队追捕并暗杀伊拉克安全人员，其中一些人被看到在哀求饶命。这些视频帮助说服其他城市的警察和士兵在听到
  `ISIS` 军队正在进军时溃散而非反抗。”事实上，乔治华盛顿大学的 `Javier Lesaca` 对 1300 个 `ISIL` 视频的研究发现，每五个视频中就似乎直接受到了如
  `Call of Duty`、`Grand Theft Auto` 或《美国狙击手》等美国娱乐作品的启发。


  这些生动且恐怖的战争视频在全球范围内获得了大量的媒体报道。`ISIL` 似乎非常清楚如何操纵世界媒体；事实上，最糟糕的暴暴行为往往与该组织最惨的战场失利同步——他们利用自己的野蛮来转移媒体对挫折的注意力。这几乎总是奏效。但那些在大多数公众眼中成为其全球品牌的恐怖视频，仅代表了
  `ISIL` 总多媒体努力的一小部分——他们制作的大部分视频都在世界雷达之下运行，专注于为潜在的圣战分子提供一种同样扭曲的观点，即加入圣战并住在 `ISIL`
  控制的领土上是多么美好。最初，这另一部分内容令我们反恐领域的人士最为担忧。`ISIL` 所有通信和社交媒体中有一半关注于他们在中东创造的“乌托邦”。视频描绘了
  `ISIL` 领土内充满活力、社交活跃、类似于《快乐镇》的氛围，拥有繁荣的经济活动和严格的法律，包括宗教警察巡逻社区。该组织的宗旨（`Baqiya wa Tatamadd`，即“留存并扩张”）推进了这样叙事：该组织代表了一个值得投入时间和精力的稳定安全事业。


  战斗员发布了自己在幼发拉河钓鱼的照片，戴着口罩或肩扛突击枪举着刚捕的鱼。甚至有两个 `ISIL` 战斗员被展示在明蓝的水中微笑浮潜。其他在即时通讯软件 `Telegram`
  招募活动中分享的图片显示了这个自称“哈里发国”如何努力描绘生活的极其平凡：海滩上的彩虹、树上的果实、盛开的花朵。一个视频显示一名戴着口罩的恐怖分子一手玩小猫，另一手拿着
  `AK-47`。即使恐怖分子也知道互联网的一个普遍真理：猫视频最畅销。


  这两类视频都旨在吸引新成员——为那些对家乡生活不顺意的人提供温馨的故事，为那些渴望属于更大事业并帮助塑造历史的人提供战场灵感。`ISIL` 在线努力的广度令人叹为观止，考虑到其品牌经营的复杂程度。研究人员曾在某一点注意到，所有
  `ISIL` 的材料都切换了一个新标志。反极端主义分析师 `Charlie Winter` 在 2015 年夏季的一个月内记录了 1146 份不同的 `ISIL`
  宣传作品——这意味着每天从 `ISIL` 的各个组成部分产生近 40 份独特的数字媒体——包括“照片散集、视频、音频声明、新闻公告、海报、神学文章等等。”





  ISIL 只要有机会就会使用尖端的电影摄影技术：在一个名为《稳定的意义 #2》的视频中，ISIL 首次使用无人机记录了一次自杀性袭击，一名男子开着装满炸物的卡车穿过利比亚的一座城市，直到他爆炸了致命货物。这种拍摄角度完全源自好莱坞电影，如《黑水行动
  30》，但这次是从恐怖分子的视角讲述的。正如《连线》杂志所写的：“伊斯兰国长期以来一直对其开发既具有创新性又令人反感的内容才华感到自豪。”就像任何全球营销人员一样，他们开发了复杂的微定位营销手段；在美国，他们字面面上分发了带有恐怖分子和棒棒糖或棉花糖的视频；而在欧洲，他们推了带有恐怖分子和`Nutella`（榛子酱）的视频。他们清楚什么市场和哪种语言具有吸引力。


  这些宣传仅仅是 ISIL 部署的一系列数字工具的一部分——他们将其视为与全球潜在招募人员开启对话的方式。对加入圣战感兴趣的人，可以通过 `Twitter` 或其他社交媒体平台或互联网论坛联系
  ISIL 的招募人员和同情者。从那里，对话通常会转移到安全的加密消息传递平台，如 `Signal`、`Telegram` 或 `WhatsApp`。在某个时期，ISIL
  甚至创建了自己的名为 `Amaq Agency` 的即时通讯应用。


  我们在幕后的经验显示，“独行侠”并不真实存在。那些在网上追求激进化的个人——我总是谨慎地不说“在网上被激进化的人”，因为这很少那么简单——对于执法部门和情报机构来说，识别这些人面临巨大挑战。通常，潜在的圣战分子会在网上与极端分子联系——有时甚至来自他们自己的社区。穆哈默德·阿卜杜拉·哈桑是一个来自明尼苏达州的索马利裔美国人，他在非洲加入了
  `al-Shabaab`，他是诱骗双城地区其他索马利裔美国青年的关键联系人和渠道。这种方法被证明是常见的：并没有普通人会在某天早上醒来，读了一个 `Twitter`
  话题，然后当场决定杀害美国人。激进化没有单一路径，网络也没有提供某种神奇的激进化药物。激进化是一个过程，是一段旅程，但在线宣传和对话极大地降低了从远方招募潜在恐怖子的门槛和复杂性。海外恐怖分子可以直接、亲密且实时地与我们这里地下室里的孩子们进行交流。


  这些视频让我们政府内部深感担忧，但起初我们主要将其视为针对外国战士的招募举措，而非国内恐怖主义威胁。作为一次招募活动，它确实证明了成功，因为我们开始看到数百名美国人和欧洲人前往
