  起初，伊朗政府将其网络活动对准内部目标——异见人士、人权活动人士和亲民主运动。从 2009 年开始，一个名为“伊朗网络军”的在线组织定期攻击并篡改反政权网站，包括政治对手的网站和独立媒体网站。绿色运动是
  2009 年伊朗总统大选产生争议后引发的一场亲民主运动，它一度成为伊朗情报部门关注的重点。研究人员 Collin Anderson 和 Karim Sadjadpour
  得出结论：“绿色运动向伊斯兰共和国证明了互联网可以被用作大众动员工具，并对政权长期以来的信息垄断构成了有效挑战。在这次针对政权稳定的内部挑战中产生的战术、工具和威胁主体，将预示着伊朗面对更广泛的内部和外部威胁的网络姿态。”6


  2011 年夏天，正当 Arbabsiar 阴谋在美国上演时，伊朗似乎策划了互联网历史上规模最大的安全泄露事件之一：一名伊朗黑客成功入侵了荷兰公司 `DigiNotar`，该公司是关键互联网基础设施幕后大部分匿名但至关重要的运营者之一。`DigiNotar`
  是所谓的证书颁发机构，简称 `CA`，它颁发在线使用的安全证书，用于向您的浏览器证明（例如）美国银行网站确实是银行网站，而不是由俄罗斯网络罪分子制作的仿冒品。尽管世界上有许多
  `CAs`，但 `DigiNotar` 是少数被称为“根根 CA”（`root CAs`）的精英机构之一，其安全证书会被浏览器自动信任。7 这些证书允许网络用户与受信网站的通信进行加密，确保在数据从用户浏览器传输到公司
  Web 服务器的过程中，无人能窃听密码、银行详情或电子邮件；通常情况下，整个过程几乎是不可见的，因为用户只有在看到网络浏览器上的绿锁时才会注意到，绿锁提供了一种网站是安全的心理安慰。8


  `DigiNotar` 通常要求两名员工共同颁发证书，且证书只能从只有通过生物识别指纹读取器才能进入的安全房间内的特定计算机产生。然而，通过利用 `DigiNotar`
  未更新和补补的某个软件程序漏洞，一名或多名伊朗黑客击败了 `DigiNotar` 采取的所有物理和虚拟防护。在 2011 年夏天，黑客为自己颁发了 500 多份安全证书，使他们能够模仿从
  `Gmail`、`AOL` 到 `cia.gov` 和 `mossad.gov.il` 的任何网站。那个夏天访问 `Gmail` 和其他网站的数十万伊朗人其通信可能被截获。9^(\*)
  直到用户开始在 `Gmail` 论坛上抱怨无法登录网站时，`DigiNotar` 泄露的规模才显现；随着泄露丑闻的扩散，`DigiNotar` 在短短一周内倒闭了。荷兰政府接管了控制权，并传召安全公司
  `Fox-IT` 进行调查。调查结论是：“域名列表以及 99%的用户位于伊朗这一事实表明，黑客的目标是拦截伊朗境内的私密通信。”10 领导 `Fox-IT` 调查的
  Hans Hoogstraaten 后来反思道：“真正让我震惊的是我意识到这对伊朗人民的影响。在那些日子……人们因为观点不同而被杀害。意识到荷兰一家小公司的……安全性[可能]在杀害或折磨人们的过程中发挥了作用，这真的让我震惊。”11


  随着民主运动威胁的消退，伊朗将其从内部网络活动中学到的教训应用于外部对手，发起了同时兼具传统国家级间谍活动和工业破坏特征的行动。


  ![](img/00006.jpeg)


  当我们在 21 世纪 00 年代后期进行私营部门拓展时，我们告诉公司，看到针对美国的破坏性网络攻击只是时间问题。然而，尽管公司通常能从监管、品牌或业务角度清楚地理解由于窃取“个人身份信息”或丢失知识产权和商业机密而带来的威胁，但破坏性攻击的威胁似乎更为抽象。最后，在
  2012 年 8 月 15 日早上，我们有了一个可以指出的例子。12


  那个周三上午 11:08，沙特阿美石油（`Saudi Aramco`）公司的少数上班员工——这家沙特政府拥有的能源巨头规模是埃克森美孚四倍——注意到电脑屏幕开始闪烁。然后屏幕变黑。


  攻击者完美控制了时间，瞄准了伊斯兰教一年中最圣的日子之一——斋月中的“权之夜”（Laylat al-Qadr），这标志着古兰经的第一节经文启示给了穆罕德。该公司约有
  55,000 名员工休假，导致办公室只有少数骨干在运转。“这是攻击基础设施的好时机，”协助应对事件的安全公司 Chris Kubecka 解释道，“你想想，一半的
  IT 员工不在，一半的普通员工也不在。如果发生事故，你得到处打电话把正在休假的人叫回来。”


  这种名为 `Shamoon` 或 `W.32Distrack` 的恶意软件被证明是凶残且毫不留情的；研究人员后来确定它是通过一封简单的鱼叉式钓鱼邮件渗透系统的。当
  `Shamoon` 被激活时，它会损坏受感染计算机上的文件并擦除机器的主引导记录，使计算机实际上变成了昂贵的桌面“砖头”。受感染的计算机只显示一张令人心惊的燃烧的美国旗帜图像。该恶意软件还利用特定的公司服务器来收集受感染计算机的
  IP 地址，每台计算机都会向命令服务器报告其感染情况——这使得攻击背后的黑客可以将数千台已损坏计算机的地址发布作为他们成功的证据。


  该恶意软件肆虐了 `沙特阿美`，破坏了 35,000 台工作站（约占公司计算机的三四之三），并将公司带回了 20 世纪 70 年代。`Aramco` 立即切断了与其与互联网的连接——IT
  员工实际上直接从数据中心 `Aramco` 服务器的背部拔掉了电缆——并开始诊断发生了什么。


  三小时内，一家沙特技术博客发布了一份关于此次攻击的模糊报告：“我从一个不愿具名的私下人士处获得某些信息，`Aramco` 的网络遭受了重大泄露，大量关于公司和员工的数据被窃取和丢失。”13
  攻击的消息七小时后传到了*路透社*，但即便在那时看起来也只是一小意外——直到几天后，安全公司才开始指出 `Shamoon` 攻击规模的异常。“`Symantec`
  在第二天在关于该事件的首批公开警告之一中报告道：“具有此类破坏性载荷的威胁是不寻常的。”14 尽管在美国政府内部我们一直在密切跟踪此案并迅速意识到其重要性和损害规模，但直到
  8 月底，关于该事件全貌的消息才公开泄露。





  运行石油生产设备的计算机系统从未停止过——它们被保持在一个独立的网络上——因此石油继续流动，这对全球经济和沙特阿美公司（Aramco）来说都是幸事。尽管如此，这次攻击导致了数月的中断——员工们使用
  20 世纪的技术重新构建了公司的运营——打字机、传真机，甚至是纸质纸质表格。他们的 IP 电话系统陷入了沉默，文书工作通过纸质复件和办公室内内部邮件进行传递。


  该月晚些时候，“沙龙”（Shamoon）还针对了卡塔尔天然气公司 RasGas，甚至在 9 月，沙特阿拉伯的油罐车也排成了数英里，都在徒劳地等待装满石油。最后，该公司在沙特阿拉伯境内免费赠送石油，以确保国家经济继续运转——他们根本没有足够的系统来追踪谁在买卖什么。要让公司恢复正常需要极其艰辛的努力：公司代表飞往亚洲购买目前正在生产的每一个电脑硬盘，最终购买了超过
  50,000 台新电脑，并支付了高额溢价以跳过全球电脑制造商的排队。他们更换电脑系统的竞争导致全球电脑硬盘价格上涨了近六个月。“永远不要低估你对信息技术和系统的依赖程度，”沙特阿美首席执行官哈立德·A·阿尔-法利赫（Khalid
  A. Al-Falih）几个月后向行业观众警告道。在花了五个月之后，公司才准备好重新连接互联网。


  ![](img/00006.jpeg)


  在我与罗伯特·穆勒（Robert Mueller）以及检察长进行常规早晨威胁简报期间，我们讨论了这次攻击，概述了其影响，并得知可能的嫌疑人是沙特阿拉伯的主要对手伊朗。伊朗由于其他原因对该国今年早些时候增加石油产量的决定感到愤怒。这次攻击似乎模仿了“火焰”（Flame）恶意软件的部分特征，该软件在今年早些时候曾针对伊朗并干扰了其石油生产。一个自称“正义之剑”（Cutting
  Sword of Justice）的组织声称对“沙龙”攻击负责，但我们怀疑他们并不是攻击者；我们习惯于看到国家机器通过虚假的、伪造的名字发动网络攻击，以提供合理的推卸理由。


  在许多方面，我们一直在等待一次像沙特阿美那样的攻击——看到关键基础设施遭受破坏性网络攻击只是时间问题。自从俄罗斯攻击爱沙尼亚和格鲁吉亚以来，我们看到全球范围内的攻击不断升级。尽管如此，这次攻击的规模证明令人担忧：这是一次针对核心国家资产的意料之外且成功的破坏性攻击——这家公司是世界上价值最高的，由沙特政府全资所有，该资产不仅对全球经济至关重要，也关乎整个沙特政权的运作和财政支持。类似的攻击开始袭击美国只是时间问题——很少有公司能像沙特阿美那样拥有足够的人力和和雄厚的财力来承担这种恢复工作。事实上，那种规模的攻击将使世界上几乎任何其他公司破产——特别是如果未来的攻击能够实际上影响生产网络的话。此外，如果这次攻击中断了中东石油的流动，全球可能都会感受到经济上的影响。我们脑海中的一个问题很明确：*当第一次攻击袭击美国时，我们准备好了吗？*


  遗憾的是，网络威胁仍远未进入政治视野范围。事实上，就在“沙龙”攻击发生前几天，国会通过网络安全相关立法的首次重大努力失败了。该法案由参议员乔·利伯伯曼（Joe
  Lieberman）和苏珊·柯林斯（Susan Collins）提出，旨在改进信息共享并加强保护关键基础设施的努力，最终以 52 比 46 的票数未通过。柯林斯说：“参议院如何能忽视专家们反复发出的警告，我们的国家安全、我们的经济繁荣，事实上我们的美国生活方式面临着多大的风险？”对于我们这些每天与网络威胁共处的人来说，这种无所作为是不可置信的。


  那个秋天，我们看到伊朗将在线注意力转向了我们。


  ![](img/00006.jpeg)


  2012 年 9 月 18 日星期二，一次中等规模的 DDoS 攻击了美国银行（Bank of America），导致网站访问缓慢。同一天，一个自称“义兹·丁丁网络战士”（Cyber
  Fighters of Izz Ad-Din）的组织因 YouTube 上的一段名为《穆斯林的清洁》（*Innocence of Muslims*）的视频而发布声明。他们在网上写道：“所有活跃在网络世界的穆斯林青年将对这种侮辱进行惩罚。”


  第二天，上午 9:21，在股市开盘前，客户在尝试访问摩根大通（JPMorgan Chase）和纽约证券交易所的 Euronext 时收到了错误信息。这些流量波动在一段时间内似乎只是小骚扰——它们没有影响运营或股市，只是让电子访问账户变得困难。攻击在那个秋天短暂暂停——在
  10 月的穆斯林节日期间停止——但随后在 12 月发生了第二波攻击，并一直持续到 1 月底。我们几乎意识到，尽管有公开声明，这些攻击并非来自对低预算电影感到不满的黑客。参议员乔·利伯伯曼将其归咎于伊朗的一支精锐部队。


  在整个政府范围内，严厉的警告在增加。当年 10 月，尽管 DDoS 攻击持续，莱昂·帕内塔（Leon Panetta）发表了国防部长历史上首次关于网络安全的重大演讲，警告称可能会发生“与
  9/11 恐怖袭击同样破坏性”的网络攻击，他将这种攻击称为网络珍珠港。他表示，在网络方面，我们正处于一个“9/11 之前的时刻”。正如他所解释的：“在 2001
  年 9 月 11 日之前，警告信号已经存在。我们没有组织起来。我们没有准备好，并为这种缺乏关注遭受了巨大的痛苦。我们不能让这种情况再次发生。”


  ![](img/00006.jpeg)


  1 月底，“网络战士”组织宣布，由于 YouTube 删除了《穆斯林的清洁》的一个副本，他们的攻击将停止。但在 2 月和 3 月初，该组织发布了新的声明，要求删除更多的在线副本。2013
  年 3 月 5 日，他们通过已成为常的通信渠道——`Pastebin` 网站上的一个页面（`Pastebin` 是计算机程序员通常用于临时存储文本和代码的工具）宣布了新的一第三波攻击。




  攻击的规模令我们感到惊讶。Akamai 是一家帮助其他网站管理流量激增的互联网公司，此前一直协助防御某些银行目标。该公司指出，DDoS 攻击的流量峰高达每秒 65
  吉比特——这比常规攻击大出好几个数量级。流量是持续的、组织良好的，而且或许最奇怪的是——相对均匀且毫无变化。通常，DDoS 攻击会以乱无章的波浪形式出现，因为攻击者不同的工具利用被劫持机器的方式各不相同。而这些攻击像是一场持续不断的、奔涌而来的洪水。“这与黑客主义（hacktivists）的能力不符，”Akamai
  的一名工程师当时向媒体解释道。随着时间的推移，我们看到了更大的数字：每秒 100 甚至 140 吉比特——这是让网站下线所需的正常流量的十倍以上。一个正常的中型企业网站容量可能只支持每秒一两个吉比特的流量。


  流量本身似乎也很可疑。在典型的 DDoS 攻击中，黑客会劫持一组无关的感染计算机（被称为“僵尸机器”），并引导它们全部向目标网站发送虚假流量进行冲击。但在这些金融
  DDoS 攻击中，我们注意到整个数据中心都被劫持了，这是我们第一次看到黑客像大公司那样利用云计算。


  黑客依赖于一种名为 `ItsOKNoProblemBro` 的知名 DDoS 工具包，该工具可以规避普通的恶意软件检测器。虽然像银行这样的大企业有特殊的过滤器可以帮助拦截恶意流量并防御拒绝攻击，但
  `ItsOKNoProblemBro` 帮助许多虚假流量伪装成合法流量，导致过滤器过载。攻击者对攻击进行了精细调整；正如一家安全公司所指出的，僵尸网络的控制服务器命令被劫持的网站“轮班制”工作，以实现效率最大化，并在目标刚开始恢复时命令其重启攻击。”`ItsOKNoProblemBro`
  还允许黑客同时发起多种不同的攻击，同时攻击底层互联网基础设施（实际托管网站的网络服务器）以及加载和驱动网站的内容管理系统。这种组合使他们能够利用较少的感染机器来部署更具破坏性的攻击。正如《纽约时报》所写，这种技术提供了几乎前所未有的力量，“将网络上等同几只吠叫的吉娃娃变成了一群喷火的哥斯拉。”


  “加萨姆网络战士”在给媒体的声明中将他们的攻击称为“阿比尔行动”（Operation Ababil），引用了《古兰经》中的一段文字，文中提到燕群守护了麦加，并通过天空向野兽投掷土块击败了入侵的大象军。看着
  DDoS 攻击持续进行，我不禁认为这个比喻包含某些事实：在外的某处，一个被劫持的计算机网络正在瘫痪世界上最强大的银行。


  攻击的特征在我们看来都像是国家级支持的。黑客显然只对破坏感兴趣——没有索要赎金的要求，也没有尝试破解个人账户并盗取电子资金。攻击持续不减的事实也表明，这是一个资金充足且有耐心的组织——例如，一个外国敌对。犯罪团伙和黑客主义者很少有时间和金钱投入到仅仅为了骚扰目标的长期激情项目中。事实上，到
  1 月，这些 DDoS 攻击已成为互联网有记录以来最长的攻击。正如被聘来保护华尔街免受攻击的安全公司之一 Arbor Networks 所报告的：“它们非常有预谋性，重点明确，在事实发生前做了宣传，并完全按照执行。”你很少能在普通黑客身上看到这种组合——根据定义，普通黑客几乎是组织松散、注意力分散且主动选择隐蔽的。


  随着 DDoS 攻击的展开，我们推动部门行动得更快。我们并不习惯在网络案件中采取常规反恐案件中那种行动节奏。我希望在网络安全方面也能获得像我在正在进行的反恐调查中预期的那种细致入微的细节。我在网上发现了一些冷门的安全博客，它们关于最新一波攻击的信息往往比我坐在国家局（National
  Division）里得到的要好。Adam Hickey 已经厌烦了我经常打电话给他抱怨，为什么我总是在报纸上而不是情报报告中读到新的 DDoS 攻击。Adam
  敦促调查探员将细节上报；在整个秋季和冬季，随着攻击持续，他会给我发信息：“我们正受到攻击。”从情报办公室被派到我们团队的 Sean Newell 最终上了一场
  DDoS 技术速成课，以便他在简报中准确地解释这一威胁。


  FBI 经常是向白宫通报正在发生的恐怖阴谋的机构——我也希望我们能够为国家层面的网络决策提供帮助。“我们在反恐方面可以提供的往往是最准确的事实，在一个相对扁平的组织中，直接来自一线人员，”Adam
  回忆道。我们也需要参与到网络案件的讨论中——而这个案件似乎非常适合我们新成立的威胁小组（Threat Cell）与美国检察官办公室合作进行刑事起诉。


  ![](img/00006.jpeg)


  正在发生的攻击性质也改变了政府的应对，我对此并不意外。我们仍处于政府对于如何处理网络案件进行持续辩论的早期——关于我们网络转型的许多问题仍在激烈讨论中。政府的默认立场仍然是对所知情况保密。政府被证明行动缓慢，对受者的帮助迟缓。我们监控攻击，但没有将我们的信息和分析传递给目标银行。在涉及间谍的案件中，我们通常发现的是即时关联较小的历史数据，而在这里，政府掌握的信息本帮助私营部门实时阻止攻击。“我们知道这组
  IP 地址是有问题的——我们有义务分享这些信息并帮助受害者，”Adam 说。




  我们与一些银行的安全官员会了面——其中包括我从 `FBI` 认识的一些前任官员——他们对自己被夹在攻击中心，却不知道政府掌握了什么信息感到非常沮丧。他们的投诉是有的，但我们没有良好的渠道、机制或关系将信息传回给私营部门——无论是关于我们在整个范围内看到的状况，还是关于我们对华尔街公司为缓解攻击所能采取的防御措施的了解。


  “你可以看到整个联邦政府发生了变化，”亚当说，“有些头脑被撞碎了。”与此同时，金融部门准备工作的缺乏让我们政府内部的人感到惊讶；`DDoS` 攻击是复杂的，但是在意料之中的——一种常见的在线威胁。一家大型科技公司可能会很轻易地度过，因为它们有应急计划来增加带宽以保持网站运行。当我们想要提供更多帮助时，政府内部发生了一场激烈的争论，有人说：“嘿，这是金融部门。他们可以付钱抵御这些——而且他们应该这样做。”被攻击目标的公司应该采取必要的防御措施，使它们的对外计算机服务器不会轻易被掉线。那些批评者担心，这会产生一种预期，即政府会在未来的
  `DDoS` 攻击中介入。他们认为，本质上让企业给自己的门装上锁，不应该是政府的责任。


  在某些方面，`DDoS` 攻击确实帮了我们忙：它迫使政府内部开始讨论谁负责应对攻击，以及应对的性质应该是怎样的样的。它也标志着私营部门意识的持久变化，帮助行业领导者了解我们多年来观察到但由于机密情报的敏感性而无法公开讨论的内容。黑客已经进入了我们的关键基础设施，并具备了造成即时财产损失和潜在人员死亡的能力。


  攻击者仔细选择了他们的目标，瞄准了我们金融系统中一个公开可见的弱点，这个地点的防御并不像实际管理交易发生或记录的系统那样良好。这些目标符合伊朗的地缘政治观点和其政治主题：银行代表了“大撒旦”金融体系的心脏，攻击它们会对美国经济造成损害，正如我们支持的制裁对他们造成损害一样。但这是一种低门槛的攻击——通过仅攻击对外系统（虽然是一种骚扰，但并未威胁到我们金融体系或经济的完整性），伊朗并未触及美国的明确红线，尽管攻击确实造成了真实的经济损害，给数十万客户带来了不便，并花费了数千万美元的修复和修理费用。


  接着是一个更奇怪的攻击。


  ![](img/00006.jpeg)


  鲍曼大坝（Bowman dam）是一个只有 20 英尺高的小大坝，没有任何战略意义，除非是为了确保赖（Rye）的盲溪（Blind Brook）不会淹没这个纽约小镇的地下室。“赖布克市长保罗·罗森伯格（Paul
  Rosenberg）后来说：“这座大坝小得荒谬，在宏观上如此微不足道。我们讨论的不是对国家基础设施至关重要的东西。”坦率地说，我们从未确定伊朗人是不是想攻击它。还有另一个鲍曼大坝，我们一直在想他们是不是想攻击的是那个：位于俄勒冈州曲河（Crooked
  River）、高 245 英特的亚瑟·R·鲍曼大坝（Arthur R. Bowman dam），它拦截着 3500 英亩的普林内维尔水库（Prineville
  Reservoir）。


  然而，由于至今仍未解谜的原因，哈米德·菲鲁齐（Hamid Firoozi）——一家名为 `ITSecTeam` 的伊朗公司的网络工程师，他曾协助了金融系统的攻击——在
  2013 年夏天期间渗透了纽约鲍曼大坝所谓的监控控制与数据采集系统（`SCADA`），即那些帮助运行大坝的计算机。菲鲁齐多次获取有关大坝运行的信息——包括水位、水温以及控制水流的闸门状态。在正常情况下，他可以操作并操纵那个闸门——可能导致那些当地地下室被淹没——但幸运的是，当时闸门恰好因为维护而断开了连接。最终加固大坝花费了超过
  30,000 美元。


  我们很幸运大坝当时正在维修，但我当时开玩笑说，我认为我们不应该依靠美国破碎的基础设施来保护我们受外国网络攻击的影响。鲍曼大坝的黑客攻击展示了我们的外国对手对关键基础设施正在做——或试图做的事情。我们在其他地方看到过中国、俄罗斯和伊朗类似的行为——而朝鲜无疑向往这种攻击。我担心的是，如果朝鲜以后获得了像伊朗在鲍曼大坝获得的那种访问权限，他们可能会扣动虚拟的扳机。


  最终，我们锁定了七名实施金融部门攻击和入侵鲍曼大坝的伊朗人：哈米德·菲鲁齐（Hamid Firoozi）、阿哈迈德·法提（Ahmad Fathi）、阿明恩·肖科希（Amin
  Shokohi）、萨德格·艾哈马德根（Sadegh Ahmadegan，网名 `Nitr`）、奥米德·加法里尼尼亚（Omid Ghaffarinia，`PLS`）、西纳·凯萨尔（Sina
  Keissar）和纳德尔·萨迪（Nader Saedi，`Turk`）。他们共同在两家伊朗安全公司工作：`ITSec` 和 `Mersad`。


  我们在攻击中看到了他们的指迹：IT 网络经理菲鲁齐负责采购、租赁和设置用于攻击的计算机服务器。法提、肖科希等人协助组建了 `Brobot` 的僵尸网络来驱动攻击；他们利用旧流行的内容管理系统（如
  `WordPress` 和 `Joomla`）中的已知漏洞来排列计算机。萨迪推销了自己在 `DDoS` 攻击方面的专业知识，并编写了 `Mersad` 用于定位易受攻击的服务器并为攻击组装僵尸网络的计算机脚本。凯萨尔则负责对僵尸网络进行初步测试。


  尽管这份详尽的起诉书（由我们办公室的反间谍与出口管制部门监督，并由纽约南区法区的检察官蒂姆·霍华德（Tim Howard）负责）并未明确表示伊朗政府或军方指导了这些攻击，但它明确了
  `ITSec` 和 `Mersad` 与伊朗政府（包括伊斯兰革命卫队）经常合作。根据我们的起诉书，甚至在肖科希参与金融系统 `DDoS` 攻击时，“他从伊朗政府那里获得了计算机入侵工作的学分，用以完成他的义务兵役服务。”`Mersad`
  于 2011 年初由两家伊朗黑客组织——太阳军（Sun Army）和臭名昭昭的阿什雅数字安全团队（Ashiyane Digital Security Team）的成员创立，后者因作为政治抗议攻击西方网站而闻名。阿什雅数字安全团队最初于
  21 世纪初由贝赫鲁兹·卡马里扬（Behrouz Kamalian）创立，作为反对先知穆罕默德漫画的抗议活动，多年来一直是西方的眼中钉——他们篡改了从英国地方政府到以色列和丹麦网站的数千个网站。即使在金融
  `DDoS` 攻击期间（2011 年 10 月），卡马里扬也因该黑客组织在两年前协助镇压伊朗抗议者的行为而受到欧盟制裁。




  在我们最终宣布鲍曼大坝（Bowman dam）案和金融部门 DDoS 攻击案起诉的前几天，我去了 FBI 网络部门，与其助理局长詹姆斯·特雷纳（James Trainor）举行了视频会议，告诉银行受害者我们已经识别了攻击者并将能够提起指控，同时也分享了我们从案件中获得的一些信息。在我们宣布起诉的当天，我们尚未拘留这六人中的任何人，但正如
  FBI 局长詹姆斯·科米（James Comey）在公布指控时对记者说的：“永远不要说。”正如他所说，“世界很小，而我们的记忆很长。”


  ![](img/00006.jpeg)


  我们从伊朗人身上看到的看到了骚扰性攻击或对关键基础设施的渗透——我们还看到了类似于中国人的间谍类黑客活动。正当我们寻找合适的目标和相应的证据时，佛佛蒙特州伯灵顿的一家国防承包商联系了当地的
  FBI 办公室。


  这家小型科技公司 `Arrow Tech` 仅雇用了约十名工程师，主要制造计算空气动力学和设计诸如 GPS 引导炮弹等弹药的软件。`Arrow Tech` 的软件通常由一种特殊的硬件密钥（称为
  `dongle`）保护，该密钥允许软件在特定机器上运行。鉴于其敏感的军事性质，该技术受到政府出口控制的保护，确保在没有特殊许可的情况下无法国际国际。


  2012 年 10 月的一个早晨，`Arrow Tech` 的网络管理员注意到他们的网络上发生了异状，并联系了 FBI。伯灵顿由 FBI 奥尔巴尼分局管辖，几天后，一名网络探员沿着查普兰湖驱了三个小时车程去核实这一线索。该探员很快就意识到他面对的是真格。该软件对各种伊朗防御项目都是潜在的利器。在几小时内，FBI
  和 `Arrow Tech` 就追踪了黑客在他们系统内部的每一次击键。`Arrow Tech` 的总裁查尔斯·希尔曼（Charles Hillman）后来表示：“[FBI]
  在短短几小时内完成的工作让我们留下了深刻印象。”


  该案件进入了我们初生的国家安全局威胁小组（NSD Threat Cell），肖恩·内维尔（Sean Newell）开始与他的中国案件一起处理此案。FBI 成功破译了一个由三个伊朗组成的小组——39
  岁的穆哈默德·里扎·雷扎哈（Mohammed Reza Rezakhah）、35 岁的穆哈默德·赛义·阿吉利（Mohammed Saeed Ajily）和 30
  岁的尼马·戈拉斯（Nima Golestaneh），他们努力窃取 `Arrow Tech` 这样的保护软件，然后通过德黑的 `Andisheh Vesal Middle
  East Company` 等伊朗壳公司网络将其出售给伊朗军和政府使用。





  # 沙滩酒店攻击


  拉斯维加斯的原始沙滩酒店赌场（Sands Hotel and Casino）曾是辛纳特拉“乐团”的所在地。在阿德尔森（Adelson）于 1988 年买下该物业并将其拆除以建造豪华度假村酒店和赌场后，他将其变成了一个横跨澳门、新加坡再到拉斯维加斯大道的全球帝国。这一努力让阿德尔森变得极其富翁，成为商政两界的强权人物；到
  21 世纪 10 年代，他成为该国最富有的人，并是 2012 年政治委员会最大的捐赠者，为保守派事业捐赠了 5000 万美元。阿德尔森是以色列问题的直言不者，与以色列领导人内塔尼亚胡关系密切。在
  2013 年 10 月于叶西瓦大学的一次小组讨论中，他主张美国需要对伊朗新兴的核计划采取更强硬的立场——他对观众说：“你们拿起手机拨给某个地方说‘好吧，随它去吧’，然后原子武器就飞过了沙漠中心，那并没什么伤害，也许只是死几只响尾蛇或蝎子。”


  当时，这一言论在很大程度上没有引起注意；以色列媒体报道了他的言论，阿德尔森的一位发言人迅速退缩，解释说这位大亨是在“用夸张的辞藻表达观点”。伊朗并不这么认为；11
  月初，伊朗最高领袖哈梅莱尼予以回应，称阿德尔森“应该受到一记耳光”，并表示如果美国真的想与伊朗和平相处，“就应该扇这些人人一记耳光”。


  不久后，伊朗黑客开始搜寻，探测沙滩赌场的数字基础设施。1 月份，他们对该公司发起了三次独立的暴力攻击——运行自动化程序，尝试数千个可能的密码，试图登录计算机网络。沙滩赌场的安全人员注意到了这一点，但此类尝试很常见，于是他们转向为目标账户提供额外的安全保护——这需要所谓的双重身份验证，使得仅靠破解密码是不够的。然而，当时沙滩赌场的工作人员并没有意识到，在面对一个执着且耐心的外国敌手时，他们的力量是何等匮乏。直到
  2012 年，也只有 5 名计算机安全工程师保护着网络中的 25,000 台计算机——这是一项不可能完成的任务。


  ## Mimikatz 的使用


  伊朗黑客坚持了下来——尝试新的途径和攻击向量——到 2 月 1 日，他们进入了沙滩赌场的系统，利用了该公司用于测试的开发服务器中的一个漏洞。进入系统后，他们继续探测以获取更多权限。他们安装了一个名为
  `Mimikatz` 的免费易于下载的黑客工具，用于记录网络内用户的密码。这是黑客的常用路径——他们首先针对网络弱点并利用它获取对更多高价值目标的访问权限，在系统内部逐步跳跃，直到访问公司的皇冠明珠。


  `Mimikatz` 由一名安全工程师本杰明·列维（Benjamin Levy）于 2011 年创建，他编写该程序部分是为了好玩以及帮助自己学习编程语言 `C`。它展示了网络防御之所以如此具有挑战性的部分——同样的工具既可以被“白帽”黑客用于测试安全基础设施并探测可能的漏洞，也可以被“黑帽”黑客用于破坏。`Mimikatz`——任何人只需通过谷歌搜索即可获得——它既是安全研究人员的标准工具，也是黑客的强大工具。


  `Mimikatz` 安装在宾夕法尼亚州的沙滩网络内部，具有机器般的无限耐心，收集员工在系统中使用的密码。`Mimikatz` 代表了我们经常看到国家力量使用的手段：对于低价值目标，特别是在私营部门，他们更倾向于耐心和老派工具——他们确实拥有更复杂的工具和零日漏洞，但他们不想浪费它们，或在简单工具就能完成任务时暴露自己的高超技艺。最后，伊朗人得到了他们需要的：一位沙滩赌场的高级工程师访问了伯利恒姆赌场，并在他们的本地网络上使用了密码，该密码也让黑客访问了拉斯维加斯更有价值、范围更广的企业网络。


  ## 恶意软件部署


  在那个更广泛的系统内部，黑客安装了一段相对简单但致命的恶意软件。调查人员后来确定，它大约只有 150 行代码，用编程语言 `Visual Basic` 编写。该恶意软件在激活时会清空硬盘并重启，还会用随机乱码覆盖现有文件，使得丢失的文件几乎无法恢复。伊朗黑客在十天后，即在一个工作周的开始释放了他们的破坏性恶意软件——这标志着美国公司首次面临来自主国家的破坏性攻击。


  攻击在公司内部引发了恐慌。在赌场内，员工们争相理解发生了什么；当他们意识到攻击的规模时，工程师们穿遍赌场，未经许可将计算机从网络上断开——拔掉服务器以及帮助赌场展厅运行数百万美元游戏的机器的插头。在大多数情况下，他们太晚了。赌场里几乎所有的电子设备都被毁了。根据《彭博街商业周刊》（Bloomberg
  Businessweek）后来发表的一篇报道，沙滩赌场总裁迈克尔·莱文（Michael Leven）亲自决定将整个公司与互联网断开。幸运的是，黑客没有渗透运行酒店运营的系统——客人仍然能够进入酒店房间，而且令人惊讶，大多数赌客能够继续玩他们最喜欢的老虎机。





  网站被关闭了近一周，但公司一直维持着强有力的形象。金沙（Sands）发言人隆·里斯（Ron Reese）在当地当地伯利恒报中表示：“公司运营的网站遭到了黑客攻击，美国的一些办公系统也是如此。公司正与相关执法机构密切合作，以确定是谁发起了黑客活动。”这种公众信心显然激怒了伊朗人，他们他们比任何人都清楚自己的内部攻击规模有多大。他们在
  `YouTube` 上发布了一段长 11 分钟的视频，嘲讽这家公司并记录了他们的内部损失以及他们显然被盗取的数千个文件，背景音乐是卡尔·奥发的《卡罗米娜舞剧》中那首忧郁且富有戏剧性的康康塔《幸运女神》（O
  Fortuna）。屏幕上的一个文本框嘲讽道：“你们真的认为只有你们的邮件服务器挂掉了吗？才见鬼！”该 `YouTube` 视频的链接据称是由一个名叫赵 Anderson
  的人发布的，并发送给了报道过最初攻击的新闻媒体。当金沙员工看到这段视频时，他们知道黑客是对的：在此之前，他们甚至不知道那些文件已经被盗取了。泄露情况比他们想象的还要糟糕。


  Leven 后来说，公司重建和恢复文件及服务器可能花费高达 4000 万美元。攻击发生几周后，金沙赌场向证券交易委员会提交了通知，称“受法律保护的数据”被盗了，公司表示，他们认为黑客获取了总数在“五位数中期”的客户或员工的敏感个人数据。除了计算机的物理损坏外，攻击还给赌场的员工造成了持久的心理伤害。“这太吓我了，”伯利恒赌场的员工乔舒亚·塞内克（Joshua
  Cesanek）说，“我可以监控我的银行账户和信用卡，但我该如何监控我的社会安全号码呢？我需要为此担心多年吗？”就像沙特阿美石油（Saudi Aramco）攻击一样，金沙赌场攻击在没有引起广泛公众关注的情况下结束了。尽管拉斯维加斯赌场发生的
  4000 万抢劫案会引发数月的新闻头条，但这种具有同样破坏性的网络攻击在受影响员工所在地之外几乎没有引起关注。


  从一开始，伊朗就是头号嫌疑对象，我们促使团队研究这是否是一个我们可以公开追究的案件。我们想向公众明确伊朗全美范围内的攻击具有多大的挑衅性。我们在早期就听说了这次攻击，心想：*就是它了！我们一直在谈论沙特阿美并警告这会发生在我们身上*，但就像许多许多其他实例一样，事实证明我们对金沙赌场攻击大部分保持了沉默——既是因为我们获知攻击的信息涉及敏感来源和方法，也是因为受害者总体上对公开攻击持抵触情绪。


  公司感知到（而且是准确的），它成为目标正恰是因为它的公开声明，因此不希望为自己的困境带来进一步的关注或报道。尽管有一些当地媒体的报道，但几乎没有主流或全国性的关注。这种被迫的沉默令人非常沮丧——这错失了一个机会，未能通过强调这次攻击来让私营部门关注，或帮助鼓励他们防御自己的系统。最后，国家情报局局詹姆斯·克拉珀（James
  Clapper）宣布伊朗对比攻击负责，但即使在他公开谈论此事后，我们仍试图限制讨论，尽力避免受害者再次受到伤害。克拉珀强调这一事件是美国的一个转折点，他说：“我们第一次[看到]国家级实体在美国本土实施了破坏性网络攻击，其标志是伊朗对拉斯维加金沙赌场集团的攻击。”


  金沙赌场攻击挑战了我们政府内部，让我们重新思考对破坏性攻击的处理。就像金融领域的 DDoS 攻击一样——其针对面向消费者的数字基础设施，而不是威胁金融行业本身的完整性——金沙赌场攻击击中了一个意外之外的目标。我们以前从未将赌场视为关键基础设施。当攻击目标是游戏业而非电网时，你该怎么办，又如何对待攻击？你如何做出相应的反应？当目标是赌场时，国家安全响应会是什么样子？对于私营部门来说，金沙赌场攻击明确说明了一个教训：*我们都容易受到攻击，所以要低头做事，不要出现在攻击者的雷达上*。


  事后看来，我们错误地看待这个问题。这不是一个关键基础设施问题。这是一个表达自由问题。因为某人说的话，黑客针对了那个个人的业务，试图让他闭嘴。通过没有采取公开行动保护一位行使第一修正案言论和表达自由权利的美国商人，美国政府未能解决一个我们以后付出了代价的问题：我们不能只保护自己的基础设施。我们还必须保护我们的价值观。


  最终，我们在当地当局的帮助下在新加坡逮捕了所有四人，但调查的第五个目标，名为胡赛因·拉里贾尼（Hossein Larijani）的伊朗人仍在逃亡。


  事实上，到二月，据信三个伊朗特工小组在其他首都对以色列外交官了攻击：泰国的曼谷、印度的新德里和格鲁吉亚的比特斯。


  这至少是伊朗试图攻破证书颁发机构第二次；攻击方法与 2011 年早些时候对另一个证书颁发机构 Comodo 的攻击一致。


  该事件强调了韧性计划对于网络事件是多么关键；网络攻击可能会产生巨大的下游影响——停机可以破坏供应链、颠覆相关行业、扰乱物流并瘫痪攻击本身的合作伙伴。公司需要有一份内部计划，以便在数字系统中断时手动恢复其运营——这一教训我们在
  2014 年索尼被黑客攻击时很快再次见证。




  随后，莉莎拦住白宫国家安全副顾问丹尼斯·麦克多纳（Denis McDonough），确保他理解了国家安全委员会（NSD）正在整理的案件。“我想引用网络经济间谍案的先例，”她说，指的是我们曾用来传递信号的伊朗暗杀计划，即我们借此表明我们将对攻击做出强力回应。丹尼斯立刻就明白这个指代：美国需要向中国发送类似的信号。这是一个政府违反了国际准则外国国家——他们应该被公开点名惩罚。这些行为者都是在其政府明确指示下越过红线的。


  我知道我们需要在政府内部加大力度、更快地推动网络安全工作。在司法部，我每天都能看到关于全国范围内大规模掠夺的情报报告。早晨从 FBI 威胁简报会回来时，我的脑海中不断思索着日益增长的网络威胁。近十年来，我一直参加威胁简报会；开始时，会议几乎完全集中在恐怖主义上，但随着多年推移，我们看到议程中出现了越来越多的网络威胁。“融化攻击”（Shamoon
  attack）表明，我们的外国对手开始攻击我们的数字社会只是时间问题，而我们正生活在伊朗对金融部门发动 DDoS 攻击的日常之中。我们并没有在这场阴暗的“代码战争”中完全失败，但也确实没有赢。


  ### 向网络安全的战略转型


  我们从不认为可以通过诉讼手段来实现一个安全可靠的互联网——这就像数百年的诉讼并没阻止现实世界的犯罪一样。我们知道需要动用政府的所有工具来应对这一问题。为此，我们一直与白宫国家安全顾问汤姆·多尼隆（Tom
  Donilon）合作，提升网络安全和知识产权窃取在地缘政治议程中的战略地位。我们需要通过私下对话和公开行动来升级“经济网络窃取不可接受”这一信息，直到中国的行为发生改变。


  ### 对抗威胁


  2013 年 2 月初——就在《华尔街日报》和《纽约时报》公开宣布其系统遭到中国黑客攻击之际——政府在对抗中国方面迈出了另一步：一份新的“国家情报评估”（National
  Intelligence Estimate）。这是一份代表国家各情报机构共识的文件，将中国定为正在进行《华盛顿邮报》所总结的“一场大规模、持续的网络间谍活动，威胁着国家的经济竞争力”，并解释中国是“最积极寻求渗透美国企业和机构计算机系统的国家，以获取可用于经济利益的数据”。


  ### 行政命令 13636 号


  尽管这些活动在普通公众看来有时显得平淡，但像总统国情咨演这样的活动对于推动联邦内部的变革和行动具有巨大帮助。即将到来的国情咨演往往会在白宫制定年度议程时打破官僚的僵局，释放长期的争论。奥巴马总统于
  2013 年 2 月发布的第 13636 号行政命令正是如此，该命令为国家关键基础设施建立了新的网络安全保护，并允许与私营部门进行更好的信息共享。该行政命令已准备了一年多，因为白宫网络安全协调员迈克·丹尼尔（Michael
  Daniel）仔细收集了整个政府和私营部门的观点，但其中大部分与布什政府和国家情报局长迈克·麦康奈（Mike McConnell）在 2008 和 2009 年采取的方法并没有太大区别——四年的延迟表明网络安全在政府内部重新获得重视多久。


  那天晚上，在年度国情咨演中，奥巴马总统大加推崇这些新保护并表示：“现在，我们知道黑客会窃取个人身份并入侵私人邮件。我们知道外国和公司会窃取我们的公司秘密。现在，我们的敌人还在寻求破坏我们电网、金融机构、空中交通控制系统的能力。我们不能在多年后回首时，思考为什么在面对对安全和经济的真实威胁时无所作为。”


  ![](img/00006.jpeg)


  ### APT1 的兴起


  同月，突出和识别中国国家支持的黑客活动的工作得到了私营部门的大力支持：网络安全公司 Mandiant 发布了一份 75 页的报告，描述了一个其称为 `APT1`
  的在线对手多年来的努力。多年来，该组织以各种网络昵号为人知，例如“评论员小组”（Comment Crew）或“评论组”（Comment Group），因为不同的出版物或研究人员对其定义不同，但
  Mandiant 最终确定为“高级持续性威胁 1”（Advanced Persistent Threat 1），这是对其在网络上显赫和普遍性的致敬。“高级持续性威胁”这一名称由空军上校格雷格·拉特雷（Greg
  Rattray）在 2006 年普及，作为在非机密场合讨论国家级对手的代称。对于那些监控在线攻击的人来说，`APT` 标记表示了特定的属性：它描述了一个资源丰富、组织严密且以任务为导向的在线行动者，具备复杂的技术，包括使用自定义漏洞和零日漏洞。


  由于 `APTs` 通常针对特定目标进行工作，它们在受害网络中的行为往往遵循一种可预测的模式。在最初的入侵（例如一次普通的鱼叉式钓鱼攻击）之后，他们不会急于遍历系统。相反，他们会植入远程访问工具，创建后门以确保即使初始入侵被发现也能保持持续访问；然后，他们通常会通过网络的多个层进行工作，通过额外的账户入侵或漏洞提升自己的用户权限，直到获得管理员或根用户（root）级访问，从而掌控整个网络。在此过程中，他们仔细绘制了网络地图，下载文件列表、目录结构和服务器详情，以彻底了解哪些可用信息。`APTs`
  是有耐心的、针对在线网络的定向威胁——通常花费数周、几个月甚至几年来探索和学习被渗透的系统，只外泄符合导致团队达成目标的任何选定数据。有时，他们会在几个月甚至几年后回到受害网络，查看是否有新的信息可用。


  任何花时间监控计算机系统的人都会熟悉 `APTs`，这些是行为相似、目标系统类似的黑客团队。识别他们通常很容易：他们的黑客活动通常发生在母国的正常工作时间内，而且许多团队和个人黑客的在线模式和用户习惯就像他们的指纹一样独特。


  Mandiant 一直对其关于 `APT1` 的报告进行独立研究，与我们威胁小组（Threat Cell）合作的一名 FBI 探员在 Mandiant 发布报告之前收到了一份质版。肖·纽维尔（Sean
  Newell）在冰球场的停车场与该探员会面领取了报告。威胁小组仔细解析了该文件，并确保任何要公开的重叠证据都已保存——几乎所有证据都是历史性的，因此不必担心消息公布后中国人会删除任何实质性内容。一旦他们确认报告不会以任何方式损害案件，我们威胁小组的成员对这份报告的想法欣喜若狂。“我们希望这些信息能大声传出来，”希基回忆道。






  # Mandiant 报告与 APT1


  Mandiant 报告由《纽约时报》大肆报道并放大，其起源源于《时报》本身遭到中国黑客入侵。该报聘请了 Mandiant 来帮助清理并研究对其电脑遭受的攻击；当时
  60 多名《时报》员工遭到监视——中国方面试图获取有关该报对中国政府报道的信息，特别是关于总理温家宝家属积累的巨额非法财富的系列报道。


  ## 公开的炸弹


  Mandiant 的报告像同一枚公开炸弹一样问世——它远超了美国政府公开识别的内容，并勾勒出一个令公众震惊的行为模式。凯文·曼迪亚（Kevin Mandia）这家安全公司的创始人、网络安全领域的先驱，多年前曾教过我的第一门计算机黑客课程，他理解我们的方法，并支持通过一切可用途径对中国进行“点名羞辱”（name
  and shame）。


  谴责中国经济间谍活动的声音越大越好——而且 Mandiant 公开的信息缓解了政府内部对暴露敏感来源和手段的恐惧。正如亚当·希希基（Adam Hickey）所说，“是私营部门指出了一个国家的非法行为，才帮助政府能够从容地这样做。”Mandiant
  仔细识别了 APT1 背后的黑客，将手指指向了人民解放军总谋部第三局第二局，即著名的 `61398 军`，该部队位于上海市浦东新区黄浦江东岸高桥镇的大同路。


  ## 61398 军的基础设施


  61398 军——仅仅是可能的二十多个不同中国黑客团队中的一个——驻扎在一座 2007 年建造的 12 层大楼内，占地 13 万平方英尺；随着该网络部队的扩张，中国电信在大楼内安装了专用光纤通信设备。该大区包括附近的后勤支持、诊所，甚至有一所幼儿园，这些迹象表明它支持着一支庞大且特权优化的
  workforce。


  “根据 61398 军物理设施的规模，我们估计该部队有数百、甚至数千名员工，”Mandiant 写道，“61398 军要求其人员接受计算机安全和计算机网络操作培训，并要求人员精通英语。”


  报告详尽地记录了他们收集的在线线索：

  * 一位隶属于 61398 军的研究生李冰冰，她发表了一篇关于在 `Microsoft Word` 文档中嵌入隐蔽通信的论文。

  * 一位上海商人王卫忠，他讨论了自己在 61398 军作为英语语言专家接受的培训。

  * 61398 军老兵撰写的学术论文，这些论文涉及他们在操作系统、数字信号处理和网络安全方面的技能。


  ## 经济间谍活动的规模


  APT1 以工业级规模进行经济间谍活动，同时对数十个目标发起攻击。Mandiant 报告称，它已识别出跨越 20 个行业的至少 141 个组织均曾被 APT1
  渗透；这些组织总共被盗了数百 TB 的数据。


  Mandiant 能够确定，APT1 在一次渗透中外泄了超过 6.5 TB 的数据——相当于超过 30 亿页打印纸，这是一堆高度约 190 英里的纸堆。在 Mandiant
  能够追踪的渗透案例中，这支中国精英团队通常可以访问一个组织的系统 356 天——近一年时间——但有时他们留得更久。一个受害者在不知情的情况下让中国人留了 1,764
  天，将近五年。


  ## 全球技术基础设施


  Mandiant 阐述了一个支持 APT1 在线行动的复杂全球技术基础设施。该中国部队在全球范围内 13 个国家中建立了近 1,000 台命令与控制服务器，其中美国境内就有
  109 台。他们使用数百个域名进行攻击，通常依赖模仿合法网站的名称：

  * `CNNdaily.com`

  * `myyahoonews.com`

  * `reutersnewsonline.com`

  * `applesoftware.com`

  * `microsoft-update-info.com`


  他们甚至模仿了那些专门防止此类攻击的公司运行的网站，例如 `symanteconline.net`，对于普通观察者来说，这似乎像是从安全公司赛门克（Symantec）发出的。


  这些努力并非没有代价：除了黑客本人，该基础设施还需要一支“庞大的 IT 团队”，包括专门负责财务、后勤和技术支持的团队。为了增强其实信力并帮助全球其他系统管理员识别更多的
  APT1 目标，Mandiant 发布了一个包含 3,000 个指示 61398 军特征的列表，包括特定的域名、IP 地址、加密证书以及他们使用的恶意软件变体。该列表包含了近四十种不同类型的后门，允许
  61398 军对受损的网络保持长期访问。


  ## 叉式钓鱼与战术


  在展示 APT1 如何运作时，Mandiant 甚至公布了该部队针对安全公司本身发起的一起鱼式钓鱼攻击：一封伪造成来自 Mandiant 创始人凯文·曼迪亚的邮件。邮件来自免费邮箱服务
  `kevin.mandia@rocketmail.com`，主题为“关于新闻稿的讨论”，内容是：“你好，我们下周安排时间见面吗？我们需要确定新闻稿。详情点击此处。”


  如果有人点击链接，将下载一个名为 `Internal_Discussion_Press_Release_In_Next_Week8.zip` 的文件，该文件包含
  61398 军使用的独特自定义后门——`WEBC2-TABLE`。这种特定的漏洞类型是 APT1 最常见的攻击手段之一，它检索了一个包含特殊代码的网页，这些代码隐藏在构建所有网站的
  `HTML` 语言中。恶意命令隐藏在 `HTML 注释标签` 中，这是程序员可以用来记录或解释他们在构建网站时所做的特殊说明。此类注释不会显示在普通的浏览器中，但如果有人选择查看网站源代码，则是可见的。APT1
  这种在如此平凡的地方嵌入恶意活动的习惯，导致一些研究人员将该小组命名为“评论员小组”（Comment Crew）。一旦这些隐藏命令让 APT1 获得了对目标系统的访问，黑客就可以下载并执行额外的恶意软件，为未来的攻击开启路径。


  对于研究人员来说，一个幸运的突破是中国自身的互联网监控——即所谓的“防火墙”，使得从中国大陆很难访问 Facebook 或 Twitter 等西方网站。相反，61398
  军的人员通常直接从他们控制的境外网站访问社交媒体，从而使研究人员能够将他们的“工作人格”与其线下身份联系起来。研究人员确定，一个名为 `DOTA` 的黑客拥有一个上海注册的手机，似乎哈利·波特的粉丝，因为他经常在回答在线安全问题时使用“Harry”和“Poter”的变体。Mandiant
  还识别了一个名为 `SuperHard` 的黑客，他是 APT1 最有能力的编码员之一，显然出生于 1982 年，真实姓名可能是梅强。





  Mandiant 公开了 `APT1` 中最臭名昭著的成员——`UglyGorilla`（或称`王东`），黑客研究人员能够将其追溯到近十年前。2004 年 1
  月，`UglyGorilla` 在一次在线问答活动中，向中国信息战学说之父之一的**张兆忠**询问了他所属国家的网络资源。他问道：“张教授，我读了您的著作《网络战争》，对书中的观点和论点留下了深刻印象。据说美国军已经建立了一支被称为‘网络军’的专门网络部队。中国也有类似的部队吗？中国有网络部队吗？”


  根据威胁研究人员的判断，`UglyGorilla` 很快就加入了这支“网络军”，成为 `Unit 61398` 黑客部队的一员。他军事黑客活动的首次在线痕迹出现在
  2004 年 10 月，当时他注册了一个名为 `hugesoft.org` 的域名，该域名在未来的几年里变成了 `APT1` 最著名的网站之一。2007 年，`UglyGorilla`
  编写了该部队的主要黑客攻击漏洞之一，并用并不完美的英语自豪地签下了自己的个人签名：“No Doubt to Hack You, Writed by UglyGorilla。”通过追踪他的其他在线活动，研究人员找到了一个开发者网站，`UglyGorilla`
  在上面列出了他的英文名（`Jack Wang`）和真实姓名：`Wang Dong`。


  `Mandiant` 的报告并没有让任何关注此事的政府官员感到意外。众议院情报委员会主席**迈克·罗杰斯**（`Mike Rogers`）表示，该报告“与情报委员会长期以来看到的活动类型完全一致”。


  尽管到那时，我们也知道 `APT1` 只是中国针对全球经济部署的众多力量之一。总而言之，我们计算出**中国解放军第三局**拥有十几个业务局、三个研究研究所、四个行动中心，以及分布在有作战部队的军区的
  16 个技术侦察单位。当 `Mandiant` 发布其 `APT1` 报告时，它正在追踪其认为的超过 20 个不同的中国“APT”。


  在 `Mandiant` 报告发布后一个月，即 2013 年 3 月，白宫国家安全顾问**汤姆·多尼隆**（`Tom Donilon`）在纽约亚洲协会的演讲中强调了中国经济间谍活动的挑战；他说此类活动“对我们与中国的经济关系带来了日益增长的挑战”，并代表了“我们政府各层面与中国关注和讨论的关键点”。这些评论是白宫官员首次公开针对中国的网络活动发表言论，代表了一个分水岭。他呼吁中国“采取严肃措施调查并停止这些活动”。


  接着，在同年 5 月，五角大楼在提交国会的年度报告中也指责中国对美国进行广泛的网络间谍活动。措辞微妙且带有官僚色彩，但对于关注此的人来说，这是性一步。五角大楼写道：“2012
  年，全球包括美国政府在内的众多计算机系统持续受到侵入攻击，其中某些可以归因于国家支持的行为者。”





  几周后，我们在政府内部面临另一场危机：爱德华·斯诺登的泄密事件。6 月 5 日，《卫报》发表了一篇关于秘密政府计划的报道，该计划要求 Verizon 向联邦调查局（FBI）提交“电话元数据”——例如在美国境内拨打和接收电话的结算详情。该报告是大量机密文件的第一个，这些文件是由一名前国家安全局（NSA）员工兼承包商从其工作场所非法下载数千个西方监控计划的文件，随后逃往由中国控制的香港，在那里，他将文件交给了包括格伦·格林瓦尔德、劳拉·波伊特拉斯、《纽约时报》、《华盛顿邮报》和《镜报》在内的记者。当他在香港的行踪公开后，斯诺登逃往俄罗斯，在那里寻求弗拉基米尔·普京的临时庇护。


  随后几周关于秘密计划和西方监控行动的公开报道引发了国际震动。斯诺登泄密事件改变了全球对话；这个国家网络活动的世界长期以来不仅是我们政府、也是各国最核心的秘密之一，如今却出现在每个大陆报纸的头条上。那些多年秘密开发、累计耗资数十亿美元的关键来源、方法和技术手段，几乎每天都会公开。


  起初，我们的团队担心斯诺登的泄密事件会阻碍我们对中国和其他外国敌手提起公开诉讼的所有工作。然而，随着尘埃落定，相反的情况变得显而易见。尽管检察官正在调查刑事泄密行为，情报机构正为失去对敌手在线损害美国利益之行为的关键洞察而苦苦，但这些泄密事件也消除了政府对公开起诉网络安全案件的一些顾虑。在关门会议中，我们对公开可能导致敌手改变战术的来源和方法感到极度紧张，但在斯诺登事件之后，我们的敌手已经通过阅读新闻知道了我们是如何监控他们的。“这不再是隐藏在阴影中的了，”亚姆回忆道，“我们觉得有义务公开我们对中国行为的了解。这已经是我们所处的世界了。”


  同样，斯诺登的泄密事件也表明了普通美国人对网络威胁的了解是多么有限。记者们说服自己和美国大部分地区——甚至是世界大部分地区——美国首要的网络威胁是美国政府运行受总统授权的秘密情报行动以及在总审计长监督下进行的法院命令监视计划，这凸显了人们对来自中国、俄罗斯、伊朗和朝鲜等国家的网络威胁的了解是多么有限，更说我们看到的犯罪分子正在进行的大规模金融欺诈了。与国家、犯罪分子和恐怖分子的威胁相比，法院命令的合法监控应该是全球普通用户和公司最不应该担心的问题。


  我们这些在政府内部的人理所当然地认为美国人民——尤其是美国国会——了解监控法的基础知识，我们所有的程序都受到无数制衡机制的限制，包括法院批准、内部审计和国会监督。看到人们对斯诺登的反应令我们感到困惑，因为我们看到最初是一场关于政策界限应该划在何处的完全合理的辩论，结果演变成了一场谴责，指责国家安全局和美国情报机构领导着一个失控的乌托邦式监控国家，指责管理这些程序的人员正在做错误且非法的事，并且美国法院授权的活动竟然与那些甚至不假装与我们价值观价值观的独裁政权的行为混为一谈。


  从我们在这个世界中心工作的视角来看，我们国家的监控计划是监管最严格的之一。我们难以置信，在中国的斯诺登泄密、大规模金融欺诈以及来自俄罗斯的全球性侵略之际，美国竟然在与一个先被中国、后被普京庇护的斯诺登的公开战斗中失败了。我们想，这些国家甚至不假装拥抱价值观。我们需要公开海外真正的危险；我们需要公开我们所知的一切。


  当我们努力抵御愤怒的公众时，我们的敌手也继续进行着网络攻击。2013 年 6 月，司法部刑事司对一家中国能源公司“风电国际”（Sinovel Wind Group）提起指控，指控其盗取了名为“ASMC”的马萨诸塞公司的贸易秘密。“风电案”被指控为纯粹的企业间谍活动；这两家公司——风电和
  ASMC 曾在在中国的大型涡力机项目上合作，由 ASMC 为风电制造和建造的涡力机和风场提供控制软件。


  随后在 2011 年 3 月，由于风电欠下超过 1 亿美元的尾款，且与 ASMC 还有 7 亿美元的合同工作待完成，这家中国公司取消了一切。三个月后，ASMC
  明白了原因：这家中国公司盗取了控制软件并将其安装在涡力机上。为了完成盗窃，风电针对了 ASMC 的一名奥地利员工，并承诺如果他泄露软件就将给他无尽财富。这家中国公司提供了一份价值
  170 万美元的合同来换取贸易秘密；该员工乐意从之，他在发给风电的一条短信中写道：“我会发送完整的代码。”正如这位工程师在麦肯后来恢复的一封邮件中所写的那样：“女孩都需要钱。我需要女孩。风电需要我。”





  司法部起诉了 `Sinovel` 以及其三名相关员工，其中包括其研发副总。讽刺的是，这些刑事指控源于 `Sinovel` 卖给马萨诸塞州（`AMSC` 的总部所在地）的四台风力涡电机，这些涡电机包含了被盗的软件。其中一个涡电机项目甚至获得了作为衰退后联邦刺激计划一部分州政府债券的支持；美国和马萨诸塞州的纳税人竟然不知情地资助了对马萨诸塞公司自身知识产权的窃取。领导此案的美国检察官
  John Vaudreuil 表示：“起诉书中的指控描述了国际被告对美国企业精心策划的攻击——这无异于未遂的企业谋杀。”


  McGahn 最终对这家中国公司提起了诉讼索赔 12 亿美元，结果发现中国黑客随后盯准了他的公司，以获取其诉讼策略。受请应对黑客的安全公司 `CrowdStrike`
  表示，他们将黑客追踪到了 `Unit 61398`。正如 `CrowdStrike` 的 George Kurtz 后来所说：“每当有大诉讼时，我们就会看到中国政府实际上入侵该公司，闯入法律部门并搞清幕后情况，以便他们能更好地处理那场诉讼。”


  ![](img/00006.jpeg)


  在 `Sinovel` 被起诉后不久，我们在我们处理过的最奇特的案件之一，对中国经济间谍活动发起了另一次重击。`NSD` 的律师之一 Richard Scott
  协助了对 `Walter Lian-Heen Liew`（又名 `刘元轩`）其他的公司 `USA Performance Technology Inc.` 以及另一个人
  `Robert Maegerle` 的起诉和审判，罪名是他们从工业巨头 `DuPont` 处窃取了我们所谓的“氯法钛二氧化钛生产技术”。用俗的话说，`Liew`
  —— 一位 56 岁的加利福尼亚州男子，曾在 `Hewlett-Packard` 工作过，随后开了自己的技术咨询公司 —— 他偷走了“白色”的配方，然后转手以巨额资金将其卖给中国国有企业。


  1991 年，`Liew` 受邀参加了北京的一场宴会，政府官员告诉他，他们很欣赏他是一个“爱国海外华侨”，并开始招募他为他们偷取东西。正如联邦检察官 Matt
  Axelrod 在法庭上解释的：“[一位高层政府官员]向 `Liew 先生` 提供了指令。而这些指令通过中国机构，包含了为了中国政府利益的关键任务项目。其中最核心或关键的任务是氯法
  TiO[2] 技术的开发。随着 `Luo 先生` 对 `Liew 先生` 的指令，一场为期 20 年的谎谎、欺骗和偷窃行为开始了。”


  将岩石变成 `DuPont` 制造的特定白色漆（被称为“钛白”），本身就是一项价值 26 亿美元的巨额业务。世界上能做到点的公司并不多，而中国想分得这块羹——于是他们开始偷取。正如我后来告诉彭博社的：“这是盗窃。而这——偷取白色——是问题的非常典型的例子。它不是国家安全机密。它是关于偷取某种你可以从中赚钱的东西。这是利用美国创造力产生的成果获利战略的一部分。”`Liew`
  致力于结交并利用一名 `DuPont` 工程师，最终支付了 15,000 美元获得了生产流程图，还雇佣了另一名 `DuPont` 工程师 `Robert Maegerle`
  作为“顾问”。


  多年努力后，`Liew` 在 2004 年给中国刚钢钢铁集团的负责人写了一封信，宣布他成功获取了 `DuPont` 的专利信息。他写道：“经过多年的后续研究和应用，我司已拥有并掌握了完整的
  `DuPont` 氯法制钛白白方法。”在接后的五年里，由于该公司计划在重庆建立一座 10 万吨级的钛二氧化钛工厂，`Liew` 从这家公司那里收到了超过 2,800
  万美元的合同。最后，2010 年提供给 `DuPont` 的线索指向了 `Liew` 的计划——他们提起了自己的诉讼，并在 2011 年 7 月，`FBI` 搜查了
  `Liew` 和 `Maegerle` 的家。


  2014 年初，`Liew`、公司以及 `Maegerle` 在审判中均被判定经济间谍罪和其他一系列罪名 —— 这标志着联邦陪审团根据《1996 年经济间谍法》进行的首次定罪，这是我们正试图用来对付中国的新工具之一。`Liew`
  被判处 15 年监，并被命令没收他从中国那那里赚取的 2,800 万美元。据彭博社报道，该计划不幸地成功了：虽然重庆工厂从未完工，但锦州的一家较小的制造工厂“正在运行，并被广泛认为使用了
  `DuPont` 的工艺”。


  我们在几乎每个工业领域都看到了类似的案例。`Valspar` 的化学家 `David Yen Lee` 下载了 160 种油漆和涂料的秘密配方，并打算将它们带到上海的日本漆（`Nippon
  Paint`）——这起窃案价值高达 2,000 万美元，约占 `Valspar` 今年总利润的八分之一。`洪猛` 试图从其雇主 `DuPont` 处偷取关于 LED
  的信息，并带到他接受教职的北京大学。而福汽车公司的员工 `向东宇` 偷了 4,000 份 `Ford` 文件，作为他在中国公司寻求工作的努力的一部分。他们中的每个人都被捕并最终认了罪。


  然后是 `Avago Technologies` 的案件，他们专门从事一种称为体声波（BAW）滤波器的技术。这家加利福尼亚公司是国际领导者，在科罗拉多州和新加坡设有设施，生产一种特定类型的
  BAW 滤波器，称为 FBAR（薄膜体声波谐振器），它们是封装在薄如纸硅封装内的微型声学谐振器，对于帮助手机及类似的无线设备过滤电干扰至关重要。市场非常巨大；`Avago`
  售出了超过 120 亿个高科技滤波器，帮助手机在世界电波因无线设备变得日益拥挤的同时，变得更强大、更小，同时精细地过滤干扰。FBAR 代表了巨大的技术成就，这一成就很大程度上归于
  Rich Ruby 博士，他从伯克利大学分校获得工程物理学博士学位，并将职业生涯几乎全部投入到完善 FBAR 滤波器中。


  2011 年在中国北方城市天津访问一位 Avago 的老同事 `魏刚` 期间，Ruby 注意到一些异常：他老同事在天津的新实验室似乎正在使用 `Avago` 自己的技术来制造同样的
  FBAR。当他质问 `魏刚` 和大学助理副院长时，他们否认与 `Avago` 工作有任何联系。


  他们撒了谎。






  事实上，正如 FBI 调查的那样，`Wei Pang` 多年来与另外五个人紧密合作，试图窃取 Avago 的专利技术和 Ruby 的心血。这起计划的基础几乎在近十年前就已经铺好，当时
  `Wei Pang`、`Hao Zhang` 和 `Huisui Zhang` 都在 21 世纪初来到美国，在加州南州大学（USC）攻读研究生。这本身并不罕见：几十年来，美国的大学院和大学因为涌入校园的外国学生而繁荣。从
  1995 年到 2015 年，外国高校和大学学生的人数几乎增加了一倍，从 45.2 万增加到 97.5 万。其中许多人在毕业后留在了美国，为我们的教育体系、技术研究和经济做出了重要且价值巨大的贡献；在
  2003 年至 2013 年的十年间，外国科学家和工程师的数量从 36 万增加到 51.7 万。


  丹尼尔·戈登（Daniel Golden）在其著作《间谍学校》（*Spy Schools*，追踪了高等教育领域的外国间谍活动）中写道：“学术研究提供了一个非常有价值、脆弱且低风险的目标……尽管在为五角楼和情报机构追求突破性技术，但大学实验室的保护程度远低于其企业同行。”


  特别是对于中国家庭来说，美国教育仍然是社会地位的关键标志和未来繁荣的工具。这条路可以得很早：美国私立学校的中国高中生从 2005 年的 65 人飙升到 2010
  年的 7,000 人。美国外国大学生中约有三分之一来自中国，该国的外国科学家和工程师中也有约 15%。无疑，绝大多数人对美国不构成国家安全威胁，但这并没有阻止国家安全部试图招募和识别潜在的间谍。自
  2000 年以来，至少有 30 名出生在中国或在中国长大的美国大学毕业生被指控经济间谍罪。


  ### 计划展开


  在 2006 年于 USC 获得学位后，这三个人都去了不同的高科技制造商工作。`Pang` 加入了科罗拉多州福特科林斯的 Avago 公司；`Hao Zhang`
  加入了马萨诸塞州的 Skyworks Solutions；而 `Huisui Zhang` 留在加利尼亚州加入了 `Micrel Semiconductor`。到那年的
  10 月，他们显然在策划窃取雇主的商业秘密。他们仔细地掩盖踪迹——警告彼此不要使用公司电脑查看个人邮件——并且对自己的活动保持着清醒。一度，他们开玩笑说将他们新公司命名为“ClifBaw”，这是“China
  lift[s] BAW technology”的缩写。“哈哈，”`Wei Pang` 写道。`Wei Pang` 给同事发了邮件：“我的工作是尽一切努力找出该工艺的每一个可能的细节，并直接复制到中国。”正如他们在另一封邮件中写的那样，他们正在“将
  Avago 转移到中国”，尽管这并没有 Avago 的知情或许可。


  他们的计划是将技术转让给`天津大学`，他们希望在那里获得工作并帮助制造 FBAR 滤波器。`天津大学`是一项名为`PRC 985 Project`的中国计划的一部分，该计划投入政府资金建设世界一流教育机构。反之，在`PRC
  985 Project`下，中国顶尖大学负有促进中国经济的明确职责。自 1978 年实施第一项“留学政策”以来，中国政府启动了多项计划，旨在扩大海外机会并鼓励那些在外国大学受过教育的人回国，最好带着能帮助中国繁荣的技能和技术。香港科技大学教授大卫·魏格（David
  Zweig）和北京中国与全球化研究中心主任王辉耀（Huiyao Wang）总结道：“中国政府在推出旨在引发逆向人才流失的政策方面，是世界上最果断的政府。”事实证明这是可行的：仅在
  2009 年就有超过 10 万名学生回国。


  ### 人才招募计划


  为了挽回人才，中国政府在全国范围内建立了 150 多个技术孵化器，并通过`百才计划`（招募新博士和博士后）和`千人才计划`（招募资深教授）等计划，承诺回国的研究人员可以享受国家最好的福利——住房、子女的学校，甚至是配偶的工作。中国政府利用了所有这些潜在杠杆来鼓励
  `Pang` 及其同事回国。


  2008 年 1 月，`Wei Pang` 往中国参加 FBAR 研讨会报告，并与`天津大学精密仪器光电工程学院`的一位高级学者会面，这位官员还与中国共产党有密切联系。在接后的几个月里，他向这位被称为“J.Y.”的中国官员发送了来自
  Avago 的草案专利申请，然后在 6 月回到中国会见了`天津`大学的院长和副校长。9 月，院长和副校长一同前往加利福尼亚州，在圣何塞的一处住宅秘密会面，并敲定了了这项新事业的计划。


  ### 执行与败落


  一周后，来自`天津`的正式消息是：*计划启动*。大学将为 `Pang` 的团队提供检察官后来所说的“全力支持，通过积极获取开展工作所需的资金、设备和空间”。他们解释说，这是一项独具利润的投资，因为通过窃取图纸，他们“节省”了普通公司在研发上花费的资金。“我们省了那笔钱，”`Wei
  Pang` 在一封邮件中写道，“没有任何（FBAR 或 SAW）公司能与我们竞争。”大学要求 `Pang` 列出他的需求——设备要求、开发计划、人员配置等，并在列表中仔细注明哪些部分需要保密。


  到 2009 年 5 月，他们已经有了建立新的 FBAR 设施所需的所有物资。为了掩盖盗窃行为，与 Avago 无关的 `Hao Zhang` 开始利用窃取的技术提交了半多份专利申请。他们开始招募中国合作伙伴参与工作，但这并不总是顺利。“你上次发给某公司的材料非常清楚地显示了
  AVAGO 字样，”一位共谋者在 2011 年 8 月给 `Pang` 和 `Zhang` 发邮件。“我们建议进行必要的修改，以避免以后出现任何不必要的问题。”


  然而那个秋天，Avago 在看到专利申请时发现了被窃取的技术——`Ruby` 在访问期间证实了怀疑。FBI 花了多年时间才拼凑出案件，但当 `Hao Zhang`——到那为止他还认为自己成功逃脱了野勃的盗窃——抵达洛杉矶参加会议时，FBI
  探员在那里等候。探员在飞机落地后立即登上了飞机，三天后，司法部发布了此前密封的 32 项起诉书，指控六个人——`Wei Pang`、`Hao Zhang` 和
  `Huisui Zhang`，以及另一位天津教授、另一位公司官员和一名在 Avago 工作的天津研究生——犯经济间谍罪和盗取商业秘密罪。






  # 案例研究：中国神州及其他企业


  AMSC 愿意站出来并参与针对中国神州（Sinovel）的公开法庭诉讼，这是一个广受欢迎且极其罕见的进展。我们团队面临的重大证据挑战之一是寻找愿意配合的受害者；许多受害者要么不想引起公众关注，要么过于看重在中国开展业务的机会。我们向几家寻求技术帮助的网络安全公司，其中一家也拒绝了我们，因为担心帮助我们会损害其日益增长的中国业务组合。许多受害者仅仅是对未知感到恐惧；没有人知道中国政府会如何对这样一个前所未有的案件做出反应。保持沉默有明确的风险；但站出来又会带来许多未知的风险。这些公司对其在海外的人员感到紧张可以理解；如果他们允许自己被公开揭露为受害者，作为政府打击中国经济间谍活动的一部分，那么他们在中国的员工或前往中国出差的员工会发生什么事呢？**


  ## 诉讼国家行为者的挑战


  针对像中国这样的国家行为者提起诉讼，需要与受害者进行极其紧密的合作。仅仅拥有黑客进入系统内部的比特和字节数据是不够的，我们需要与受害者坐在一起，理解黑客为何在那个时间发动攻击，以及盗窃行为对业务意味着什么。没有这些关键的解释——既来自我们已点名的受害者，也来自我们从未点名的受害者——我们发现无法构建刑事案件的核心。这些案件并不像传统的银行盗窃案或珠宝店抢劫案，例如在那些案件中，动机和经济利益是显而易见的。如果公司不向我们解释其损失对他们的重要性，我们就无法在起诉书中解释动机。对于经济间谍活动，仅仅证明谁偷了它——是`PLA`（解放军）元素偷取的——是不够的；我们必须证明他们为什么要针对特定信息，以及中国谁会从中受益，以证明其动机是为了帮助受害者的竞争对手。


  ## 地缘影响的角色


  匹兹堡的美国检察官 `David Hickton` 利用自己的政治资本和当地影响力鼓励像 `US Steel`（美国钢铁）这样的受害者站出来参与。在几乎任何其他司法管辖区，我们可能无法让第一个案件成功，但
  `Hickton` 在匹兹堡的深厚背景以及他在成为美国检察官之前在私营部门的工作带来了丰厚的回。`Hickton` 简直是和其中受害者的 CEO 一起长大——他们从小学到高中都在一起上学。


  ## SolarWorld 案件


  然而，直到 `FBI` 探员 `John Hauser` 联系了俄勒冈州希尔斯伯勒的一家可再生公司，我们才知道自己有了所需的案件。`SolarWorld` 是一家拥有约
  1,100 名员工的公司，它是反华行动的不愿领导者，在 2011 年和 2012 年向 `商务部` 和 `国际贸易委员会` 抗议其所认为的中国公司实施的非法的“价格倾销”。`SolarWorld`
  声称，中国公司在美国以低于市场的价格出售太阳能电池板，是因为他们从非法的政府补贴中获益。


  在 2011 年 10 月宣布该公司的申请时，其总裁 `Gordon Brinser` 解释道：“来自中国的人为低价太阳能产品正在摧毁国内产业。”中国的销售额飙升——从
  2008 年到 2011 年增长了 300% 以上，2011 年前八个月的总额超过了 16 亿美元——但这些增长都不是正常市场力量的结果。除了巨大的国家支持外，中国并没有任何实质性的材料、劳动力或生产优势，结果就是产品以低于国内制造商能提供的价格涌入美国。`Brinser`
  说，其结果对美国工人来说付出了明确的代价：在 `SolarWorld` 提出投诉之前的几个月里，有七家美国太阳能雇主已经关闭或缩减了规模。正如他所说，“中国系统性地拆解（行业）的行动导致了美国工人的损失。”





  随着案件的逐步拼凑以及我们能收集到的最佳证据，我们最终确定了五名身份明确的嫌疑人：王东——被称为 `UglyGorilla` 的黑客，我们已经观察他有一段时间，他在
  `Mandiant` 的报告中也已被公开；还有孙凯亮、文信宇、黄振宇和顾春辉，他们都是解放军（PLA）精英黑客组织——`61398 部队`的军官。随着案件的展开，这对我们的威胁小组（Threat
  Cell）来说变得非常个人化。成员们开始了解每个目标的个人习惯——他们喜欢什么，不喜欢什么——审阅了大量黑客的照片，甚至了解了他们的家庭。这个小小的团队对远在地球彼岸的五名中国军官有很多想法，他们是两国博弈中的棋子。“我们进行过很久长谈——‘如果
  Nick Oldham 因为履行职责而被起诉，会有什么感觉？’Nick 回忆道，“中国显然有一套不同的道德标准，但这些人只是在执行政府要求他们做的事。”


  ![](img/00006.jpeg)


  到 2013 年秋季，团队已经锁定了案件。在担任“代理”六个月后，我于 2013 年 9 月被提名正式接任国家安全助理检察长职位；在确认过程中，我花大量时间在国会山向参议员解释我们对中国问题和网络威胁的方法，并欣慰地发现，许多在很多问题上并不达成共识的人——包括泰德·克鲁斯、谢尔·怀特豪、迈克·李和杰夫·谢森——都强烈支持我们的方法。


  ### 控方备忘录（The Pros Memo）


  任何案件的关键阶段都是起草所谓的“控方备忘录”（pros memo），即调查人员建议美国检察官办公室推进正式起控的内部报告。本案的控方备忘录初稿从匹兹堡传过来时只有几页；Nick
  审阅后意识到，要结案还有大量工作要做了。这是一起具有历史意义的案件；不能只是走过场（`pro forma`）。为了确定正确的方法，Adam 最终去查阅了为 9/11
  恐怖袭击编写的控方备忘录，那份文件满了三英寸厚的文件夹。他回忆道：“通过研究一个不可能完成的案件，我学会了如何为一个不可能完成的案件编写控方备忘录。”控方备忘录的终稿长约
  300 页，详细列出了针对五名解放军成员的证据。


  Nick 和另一位威胁小组检察官 Brian Resler 曾连续几周、甚至几个月驻在匹兹堡，帮助拼凑案件，与当地首席检察官、匹兹堡助理美国检察官 James
  Kitchen 并肩。他们与 FBI 团队并肩作战，梳理现有的证据。一天晚上，在处理了一整天的技术细节后，他们来到匹兹堡市中心的一家安静酒吧——结果发现酒吧里挤满了来自
  `Hash House Harriers` 当地跑步饮酒俱乐部的跑者，这群刚完成当晚夜跑路线的喧闹饮酒者瞬间改变了他们的夜晚。在这一片喧闹运动员的海洋中，他们无名，远离家人，且由于几周来的工作（我们都希望这这是一份针对美国主要超级国竞争对手的历史性起诉书）而精疲力竭，两位检察官相视一眼。“这就是我们的生活，”Nick
  说，“没有人知道我们现在正在做什么。”


  ### 构建起诉书（Framing the Indictment）


  我鼓励团队确保起诉书能够准确定性案件；这不仅仅关乎泛泛的计算机黑客行为，而是盗窃。这是为了主张：政府支持的、以经济为目的的黑客行为是错误的，违反了政府不应干涉私营部门的国际准则。“我们开辟了我们[可以]在不虚伪的情况下进行指控的领域，”Adam
  说道。这份起诉书的塑造在随后的案件中获得了丰报——这并非关乎间谍，而是关乎试图获得不公平且不应得的经济优势。最终起诉书的第一句让案件的意义不言而喻：“中华人民共和国（中国）军队解放军（PLA）成员合谋并相互协作，入侵位于宾夕法尼亚州西区及美国其他地区的商业实体的计算机，以保持对这些计算机的未经授权访问，并从这些实体中窃取信息。”


  ### 内部审批流程（The Internal Approval Process）


  即使在我等待参议院确认期间，案件大纲已向总检察长汇报，并开始在政府内部推进。我们面临着最后一个重大障碍，即国家安全委员会副级委员会（Deputs Committee）。副级委员会简称
  `DC`，代表了政策制定中最核心的工作和细节执行地。该系统设计于 1989 年反对巴拿马独裁者曼努埃尔·诺列加变之后，当时乔治·H·W·布什的国家安全顾问布伦特·斯科克拉夫特不满于没有人执行局势室做出的决定，于是规定
  `DC` 将“负责从日常到危机的管理”。自那时以后，它发展成为罗伯特·盖茨斯所说的“政策进程的引擎”。


  在那之后的若干年里，它壮大了。在提交中国起诉书前的几个月里，我们在 `DC` 级别见面，讨论我们所谓的“使用许可”（use approval），获取其他情报机构的许可，以便讨论我们收集的某些机密情报以为我们的案件提供支持。我感到意外惊喜：我在白宫解释了案件并讨论了策略后，桌旁的人都点头表示同意。我们将能够使用所需的一切。


  images/00006.jpeg


  ### 战略考量（Strategic Considerations）


  在我们采取行动之前，审批流程的每个阶段都存在疑虑。在调查的最后阶段，检察官和探员担心白宫国家安全顾问苏珊·莱斯可能会破坏整个计划。她担心刑事起诉是一个太粗鲁的工具；她看到起诉中国军官可能具有极强的挑衅性，但她怀疑这是否真的能改变任何行为。我们认为到目前为止的所有策略都没有改变什么——我们不能维持现状。


  白宫的莉莎·莫纳科（Lisa Monaco）和司法部的我认为，在美中这种庞大、复杂且错综的关系中——一种跨越贸易、气候变化、国防、人权、朝鲜、南海、全球范围内的盟友和对手以及许多其他问题的关系——总会有各种理由声称“现在不是指控中国黑客攻击美国公司的时机”。我们坚信相反的观点：我们应该从这种宏大的关系中剥离出犯罪活动——只要对手违反了我们想要维护的准则，我们就应该公开起诉该案件。我们应该在任何其他地缘政治考量之外进行逮捕或“公开指控”。




  这也是 FBI 之外的其他人士推动的信息。众议院情报委员会主席、密歇根州议员迈克·罗杰斯（Mike Rogers）表示，网络安全应该是国家对华议程中的主导地位：“与中国的前三个问题应该是经济间谍、经济间谍，还是经济间谍。”


  终于，在 2014 年 5 月，我们获得了绿灯。突然之间，是时候召开发布会宣布指控了。司法部长埃里克·霍德（Eric Holder）、FBI 局长詹姆斯·科米（James
  Comey）和我，以及从匹兹堡赶来的大卫·希克顿（David Hickton）一同登上了台。


  亚当·希基（Adam Hickey）和肖·纽维尔（Sean Newell）走进新闻发布会，震惊地看到房间前方画架上立着巨大的、海报大小的中国黑客通缉令。在最后时刻，FBI
  制作了这些模型，展示穿着制服的 `PLA` 黑客的海报。这种带有红背景的 FBI 通缉令在那些认为公众意识可能有助于抓捕嫌疑人的案件中很常见，但在本案中，我们非常清楚这些嫌疑人身何处。我们是否能在法庭上见到他们将是一个外交问题——而我们知道这种几率几乎为零。对亚当和肖来说，这些海报初看起来像是华丽的过度行为；他们本希望起诉书本身就能说明一切。然而，在接后的几个月里，他们意识到自己错得有多离谱。“低估了它的价值——事实证明通缉令是一种有力的方式，表明这个人的行为在道德上是错误的并受到了社会的谴责，”亚当说道。这些中国通缉令后来成为访问的外国执法和情报机构非常想要留的纪念品，其中许多机构正努力应对他们自己的中国黑客事件。这些海报变成了全美
  FBI 工位和情报办公室里珍贵的办公艺术品——中国黑客以那种曾出现在警告约翰·迪林格（John Dillinger）以及邦妮和克莱德（Bonnie and Clyde）的标志性风格呈现。


  在我的发言中，我提到了布莱尔法官在 `Grokster` 案中的评论，这句话长期以来成为我的座右铭：“网络盗窃就是真实的盗窃，我们将像对待任何其他偷取我们货物并违反我们法律的跨国犯罪组织一样，追究国家资助的网络盗窃者的责任。”


  “这种 21 世纪的入室劫必须停止，”希克顿说，“这次起诉维护了西夕法尼亚州和世界各地辛勤工作的男士女性的权益，他们遵守规则，理应获得公平的机会和平等的竞争环境。”


  在发布 `PLA` 起诉书一个月后，奥巴马总统通过与澳大利亚总理的共同亮相，强调了同样的观点：“显然，美国和澳大利亚与中国都有着巨大的贸易关系，我们都认为继续看到中国的繁荣和崛起是重要的。但同样重要的是，当中国作为一个伟大的世界大国崛起时，它也在帮助加强和遵守基本的国际法和准则。”


  但我们清楚，在宏大的地缘政治版图中，一份起诉书并不意味着什么；我们需要能够维持压力并公开向中国施压。在中国案件的前周，亚当和我去了了匹兹堡，向受害者简报了即将提交的起诉书。这是一次深刻的经历——受害者
  CEO 和企业领袖首次知道还有谁参与了此案。环顾匹兹堡市中心 FBI 大楼房间里的四周，他们意识到大多数人彼此彼此认识——他们一直在不知情的情况下共同遭受了侵害。你几乎能感觉到房间里充满了一种真切的松口气感，因为他们意识到自己并不孤单，被中国针对并没有什么可耻的；这是一次机会均等的攻击。我们向每位受害者展示了我们将在起诉书中使用的确切措辞。


  在返回华盛顿的途中机场，我告诉亚当：“下一个案件，我们需要一个活犯。”


  他笑了笑。“实际上，我有一个案件想和你谈谈，”他说。


  ![](img/00006.jpeg)


  宣布起诉是自豪的一天——这是团队多年来在重塑网络空间与中国平衡方面付出巨大努力的结果。这一公告点起了我们团队的热情，提振了整个 `NSD` 的士气，并特别鼓励了我们在全国范围内授权的新
  `NSCS` 检察官。它向他们证明了，如果他们全心投入一个案件，我们就会对其起诉并将其公开。然而，我们所有人都明白，起诉仅仅是一种工具，尽管是一种特别强有力的工具，用来让信息公开。我们并不满足于在新闻发布会上冲贴几张照片。“点名并羞辱”的作用是的。在我们新闻发布会几周后，安全公司
  `CrowdStrike` 发布了另一份报告，类似于 `Mandiant` 关于 `APT1` 的报告，记录了另一个中国单位（被称为 `Putter Panda`
  或中国 `PLA` 的 `Unit 61486`）的黑客攻击活动，以及他们试图渗透并盗取美国、欧洲和日本组织的尝试。“如果你看我们在中国追踪的所有小组，起诉书只是冰山一角，”`CrowdStrike`
  联合创始人乔治·库茨（George Kurtz）告诉《纽约时报》。我们同意。如果我们的努力要改变行为，我们需要一些人戴上手手铐。


  正如亚当在机场指出的那样，我们不需要等太久就有逮捕。事实上，在 `PLA` 起诉发布仅两天后，加州的 FBI 探员获悉两名中国黑客交易了一份文件，概述了他们对美国最大的航空公司之一发起的多年攻击。


  该文件包含了一个用黑客自己的话写的他们计划的简要总结——FBI 逮捕该男子所需的一切。加拿大也经常受到中国黑客的侵害，他们乐意配合。他们——以及我们——终于有机会帮助扳回公道。


  ![](img/00006.jpeg)


  2014 年 6 月 28 日——在 `PLA` 起诉发布一个月后——加拿大警方在美国司法部的请求下逮捕了一个名为苏某（`Su Bin`）的中国商人。这位住在温哥华的
  50 岁亿万富翁曾协助盗取了价值数十的美国国防技术，美国指控他指导了一项为期六年的从波音偷取设计秘密的工作。他花了几年时间偷取了 `C-17` 军用机的图纸和计划，这种飞机每架价值
  2.18 亿美元……


  随后的几年里，`C-17` 已成为空军从科索沃到阿富汗再到伊拉克战争前线运送部队、车辆和物资的中坚，以及向全球灾难受害者提供人道主义物资——它甚至是经常在全球范围内运输总统装甲轿车的飞机。多亏了苏某，中国人仅用不到美国设计、测试和制造原始
  `C-17` 所需三分之一的时间，就开发、制造并部署了自己的版本。




  苏（Su）在西方名叫斯蒂芬（Stephen），他拥有一名为`Lode-Tech`的中国航空技术公司，并一直住在价值 200 万美元的房子里舒适地生活；2012
  年，他曾《华尔街日报》的报道，那是关于中国富豪流向西方的故事的一部分。在文中，他称自己是一名军官之子，并作为航空航天企业家赚了数百万美元。他告诉《日报》，他发现西方的规则限制较少——而且在西方国家花钱也更容易。“（中国的）规定意味着商人不得不做很多非法行为，”苏当时这样说。事实证明，他在搬家后犯下了最大的犯罪。


  在不列颠哥伦比亚省，他经营`Lode-Tech`的当地办公室。这家合法公司拥有深厚的行业人脉网络，由苏斌（Su Bin）帮助挖掘——它甚至在一年的中国航空博览会期间与`Boeing`共用空间——他指导他的黑客同事针对特别感兴趣的工程师和公司人员设立目标。当调查人员揭露苏斌的经济间谍活动时，他们意识到`Lode-Tech`使命宣言的讽刺性——这家航空航天公司在其网站上用大字宣称：“我们将跟踪世界上先进的航空技术。”


  他们的工作最早于 2009 年就开始了，多年来，苏斌同时使用他的工作邮箱和个人邮箱与中国国内的两个中国军黑客通信。在得到苏指引的正确方向后，这些黑客使用了相对基础的技术——标准的网络钓鱼邮件——试图渗透电子邮件账户，并从那里访问受限的公司网络。“苏斌就是我们在传统间谍世界中所谓的‘侦察员’，一个为国家挑选目标的人，”时任我们的副助理总检察官卢克·德姆博斯基（Luke
  Dembosky）解释道。


  [content]

  （接上）


  正如我们后来的起诉文件所明确的那样，中国黑客依靠苏来告诉他们什么是重要的。由于中国黑客不会说英语，一旦进入网络，他们就会向苏发送他们发现的文件列表，苏会仔细审阅这些列表，用黄色标出他们应该外泄的最有价值的文件，并指导他们所发现的内容。这不是一项微不足道的工作：某些文件目录多达数千页；在一个
  6000 页的目录中，苏细致地标出了 22 项似乎对他们有用的项目——文件名如`C17Hangar Requirements 112399.pdf`和`Critical
  Safety Item(CSI) Report_Sep2006.pdf`的文件。在另一个 137 页的目录中，他挑选了 17 个最有前景的文件文件夹——其中一个被`FBI`探员后来计算包含超过
  2000 份与 C-17`相关的文档。虽然`Boeing`复杂的计算机网络最初减慢并阻碍了他们，但他们通过他们所谓的“艰辛的劳动和缓慢的摸索”摸索着过路前行。总而言之，在几个月里，这些黑客掠夺了`Boeing`最核心的秘密。在
  2014 年 6 月的那份题为“C-17 项目侦察总结”的报告中，苏和他的两个中国伙伴声称他们偷取了 63 万份与`C-17`相关的文件，总计约 65GB 的数据。正如苏和他的团队写道，“我们在一年内安全、顺利地完成了受托的任务，为我们的国防科学研究发展做出了重要贡献，并收到了一致的一好评。”根据他们自己的报告，这是中国工程师第一次拿到
  C-17 计划。


  [/content]

  `Boeing`并不是唯一的目标——`C-17`也不是唯一的受害者。他们还掠夺了超过 220 多字节与`F-22 Raptor`相关的数据，外加与`F-35`相关的文件，这些苏仔细翻译成中文的协议。这些盗窃行为帮助中国理解——并复制了——美国
  21 世纪最先进的隐形战斗机，一个价值 110 亿美元的开发项目。


  [content]

  （接上）


  苏斌发起的这项努力只是多年掠夺美国防御秘密的一部分。根据《华盛顿邮报》，中国黑客盗取了先进的爱国者导弹系统（`PAC-3`）、陆军高空域防御系统（`THAAD`）以及海军的宙神星导弹防御系统（`Aegis`），以及关键的战斗机和舰船细节，包括`F/A-18`战斗机、`V-22`鱼鹰机、黑鹰直升机以及海军的新型濒岸战斗舰，用于在近岸水域巡逻。”领导华盛顿关注安全问题的智库的马克·斯托克斯（Mark
  Stokes）称这些盗窃行为“令人震惊”，他说，“这些都是对我们国家安全至关重要的武器系统。当我听到这一切时，简直不可思议。”


  [/content]

  [content]

  （接上）


  随着时间的推移，苏和他的同谋者建立了一个复杂的国际黑客网络，包括他们在美国、新加坡和韩国的服务器。他们在偷取文件之前对其进行伪装，以规避`Boeing`和其他国防承包商的内部入侵报警，然后通过绕行路线将文件传回中国。苏的团队总是通过三个外国——如法国和日本——中转被盗的文件，并确保这三个国家至少有一个与美国没有友好关系，以此掩盖文件的最终目的地。最终，这些文件被存放在香港、澳门附近的地区的计算机上。“为了避免外交和法律问题，监视和情报收集在境外进行，”他们报告道。


  在那里，中国情报人员提取了文件并亲自将其带回中国——确保从美国到中国从未有过可追溯的文件路径。然而，正如`FBI`调查发现的那样，毫无疑问，最终客户是中国军队——而且苏斌的伙伴本身就是军人。事实上，虽然这两个黑客尚未被公开指控，我们知道他们是谁；根据公开的加拿大法院记录，`FBI`在的一封截获的电子邮件中发现，一名黑客附了他的军官证，上面有他的照片、姓名、军衔、单位和出生日期。同样，`FBI`追踪到的另一名黑客的一张照片（主题为“老板”）显示他与他的指挥官在一起，两人都穿着全套中国军服。





  在苏冰在加拿大被捕几周后，中国采取了报复——将居住在东市的两个加拿大裔邀至参加晚宴，随后他们被国家安全部的特工抓获。凯文·加拉特和朱莉·加拉特（Kevin and
  Julia Garratt）都是在中国低调生活数十年的基督教援助工作者，他们长期以来在朝鲜边境的人口 250 万的工业城市经营着“彼得咖啡馆”。这对夫妇在被禁闭期间被隔离开来并接受了审讯。正如凯文后来告诉加拿大媒体的那样：“我在想——你们在说什么？要调查什么？这里发生了什么事？请解释一下。最后他们说：‘好吧，你们被指控为间谍，我们要进行调查。’”


  中国政府报告的指控与苏冰的几乎如出一辙：国家安全部告诉媒体，加拉特夫妇正接受调查，涉嫌窃取关于中国军事目标和重要国防研究项目的情报，并从事威胁中国国家安全的活动”。他们在严酷的情况下被关押了`19`
  个月；之后，凯文能准确地记得他与多达 14 名囚犯共处的牢房布局：“房间有十二步长，五步宽。”正如该家庭律师詹姆斯·齐默曼所说：“中方很明确，加拉特案的设计是为了向加拿大施压，阻止将其引渡美国。”


  随后，2014 年 11 月，尽管苏冰和加拉特夫妇仍在狱中，中国却更加公开地宣扬了他们的成功。他们自制的军用运输飞机`运鸿-20`（代号为“鲲鹏”，源自一种能够远飞的中国古代神鸟）停放在珠海航展上，与一架美国的`C-17`隔相停，这是中国飞机首次在现实生活中与其美国双胞胎见面。


  最终，加拉特夫妇均获释放，苏冰也放弃了引渡美国。“抓住他并不容易，”协助我们办公室协调此案的卢克·德姆斯基（Luke Dembosky）回忆道，“即使有加拿大这样友好的邻居，你可以看到国际案件的过程是多么漫长和乏燥——对于网络犯罪，几乎每个案件都是国际案件。这是网络攻击者长期以来利用的一个漏洞。”


  FBI 特工在加拿大的机场接走了苏冰，带他去美国面对指控。作为一个航空爱好者，他在飞往加利福尼亚的航班上与特工们聊了飞机。一名特工问他最喜欢的飞机是什么。他面无表情地回答：“不是`C-17`。”


  2016 年 3 月，苏冰在洛杉矶的美国法院认罪，被判处监禁`46` 个月，并罚款`10,000` 美元。“有些人说过，‘你们永远抓不到任何人。’，我那天告诉《华盛顿邮报》：‘好吧，我们抓到了人。’”


  * 这并不是一次“许可”会议，而是一个咨询性会议——司法部的传统谨慎地保护了其在起诉方面做出独立决策的能力——白宫法律顾问凯西·鲁姆勒（Kathy Ruemmler）在场，以确保每个人都守住自己的底线。国家安全局经常会对重大反恐案件进行类似的意识性简报，以确保白宫不会对逮捕或阴谋的新闻感到意外，我们希望对这些新类型的案件建立类似的节奏。


  * 过去类似的鱼叉式钓鱼攻击曾集中在大量的地缘政治和军事主题上，从标记为`Oil-Field-Services-Analysis-And-Outlook.zip`的文件到`The_Latest_Syria_Security_Assessment_Report.zip`，再到`MARKET-COMMENT-Europe-Ends-Sharply-Lower-On-Data-Yields-Jump.zip`。即使是精明的用户也无法免疫。Mandiant
  看到一个案例，鱼叉式钓鱼目标回复了一封可疑邮件：“我不确定这是否真实，所以我没有打开。”二十分钟内，`61398 部队`的某人鼓励地回信道：“这是真的。”


  * 在另一个利用政府“全方位工具”方法施用一切可能的胡萝卜加大棒的类似案例中，罗杰斯（Rogers）议员本人就从国会山山发布了一份类似的报告，调查了中国政府与电信制造商华为技术（Huawei
  Technologies）和中兴通信（ZTE Corporation）之间的联系，声称它们对美国构成了“国家安全威胁”。正如一位白宫官员在报告发布时所说：“我们的流程并非针对某一特定公司，而是利用所有资产和部分来保护电信和关键基础设施。”


  * 在另一个关于安全与自由之间老式平衡的类似例子中，我敏锐地察觉到美国公众和记者对国家安全的冲突预期。在马士顿爆炸案和斯诺德登事件后的那个夏天，在阿斯彭安全论坛上，我受到一位著名记者的质问，涉及正在发生的斯诺德登丑闻以及政府对匿名电话记录的收集——然后他迅速转而批评马士顿爆炸案所使用的技术：*在今天时代，美国政府竟然没有一个人脸识别数据库可以对比马士顿爆炸案犯的照片吗？*


  * 例如，一台现代的`iPhone 6`拥有十多个`FBAR`滤波器，每个包含七到八个声学谐振器——手机总计超过 100 个。


  * 在案件公布后，我们收到了怀特（Whitehouse）议员写给我们团队的一封信：“干得好！我知道你们能抓住他们的。”


  * 调查面临着 FBI 内部的文化分歧；许多长期专注于计算机犯罪的网络特工仅具有情报方面的经验，即技术层面的“比特和字节”。他们在离开电脑、审问证人、收集起诉证据方面缺乏经验，而且从未接受过任何真正的法庭或调查经验。尼克（Nick）非常亲力，他发现自己正在现场指导一名特工如何进行受害者访谈；该特工做了网络案件多年，却从未与真实的受害者交谈。






  在我们向他们寻求帮助时，他们正忙于发现并应对一场由“国家支持”的中国黑客发起的大规模攻击。这些黑客渗透了他们国家研究委员会的网络，该委员会领导着该国家的研发工作。该委员会负责诸许多尖端工作，例如油菜的开发——这种作物最初在马尼托巴省培育出来，后来已发展成为出口到中国等国、价值数十亿美元的农产品。最终，中国对加拿大研究网络的深度渗透导致了数亿美元的损失，包括研究成果的损失，以及更换数百台被攻破的笔记本电脑和服务器的
  IT 成本。一段时间内，加拿大政府曾建议全国范围的研究人员仅通过传真或邮寄进行通信。


  # 第 6 章


  ## Slavik


  在我在司法部工作期间，我们已经习惯了在重大网络犯罪和在线金融诈骗中看到俄罗斯或东欧的背景。事实上，首批数百万美元的在线盗窃之一——20 世纪 90 年代从 `Citibank`
  盗取的 1200 万美元——是由一名俄罗斯黑客 `Vladimir Levin` 执行的。特勤局在金融犯罪方面有专门职责，已经在计算机犯罪领域培养了早期且强大的专业知识，追踪诸类盗卡论坛，如
  `CarderPlanet.Ru`，盗贼们在上面大量交易被盗的信用卡。那个早期网络犯罪时代很大程度上逃脱了 `FBI` 的注意，因为 `FBI` 在 9/11
  事件后的几年主要关注反恐主义，而直到 2000 年代后期我们仍在追赶。遗憾的是，我们这方面的知识仍然过于碎片化。尽管我们看到俄罗斯情报机构和俄罗斯犯罪分子开始在线结盟，但政府内部的“融合”程度远没有威胁本身那样。


  俄罗斯和东欧长期一直是世界上一些顶尖黑客的家园。网络犯罪在多个东欧国家至少是一项每年十亿美元的业务——在俄罗斯无疑如此。这种强大的人才储备部分源于苏联对科学技术教育的重视，以及另外两个重要因素。首先，俄罗斯人对黑客技术的青睐反映了才华横溢的俄罗斯工程师缺乏合法的经济机会。俄罗斯黑客杂志《Khaker》的编辑
  `Sergei Pokrovsky` 在 2000 年被引用解释说，虽然西方才华横溢的计算机科学家在第一次互联网热潮中获得了丰厚的薪水，但一名俄罗斯工程师在俄罗斯公司工作可能只能赚约
  300 美元。对于即使是一个没有野心但很有才华的黑客来说，在诈骗领域超过这个数字并不难。2007 年，德国《镜报》（`Der Spiegel））介绍了一名 18
  岁的俄罗斯黑客，他仅以 150 美元的价格在线提供其“高质量”的 `DDoS` 服务；与此同时，他的竞争对手 `DrDDoS` 为下达两个针对其他网站订单的客户提供精准的“七五折优惠”。事实上，到
  2010 年左右，行业分析显示，俄罗斯占了全球网络犯罪收入的大三分之一，每年约在 25 亿到 37 亿美元之间——远高于俄罗斯所占全球 IT 市场的 1% 份额。


  俄罗斯在黑客攻击中的中心地位也说明了国家在执行网络犯罪法律方面的滞后。然而，这并不简单到可以说俄罗斯执法部门不擅长抓捕黑客。在过去的 20 年里，特别是过去的十年里，我们看到俄罗斯执法部门主动对已知的俄罗斯黑客视而不见——至少当他们的目标在俄罗斯境外时。通常，黑客似乎是在执法部门和情报机构的明确许可和保护下工作的——以在俄罗斯被称为
  `krysha`（意为“屋顶”）的方式运作，这是俚语，指由黑手党或腐败政府官员等保护人提供的付费保护伞。`Joseph Menn` 在他关于网络犯罪的书《致命系统错误》（`Fatal
  System Error`）中写道：“尽管大多数黑客是从自己开始的，但随着规模扩大，他们需要老派黑帮的保护，因为这些人的政治人脉更广。”


  中国和伊朗等国可能会通过使用政府或军事人员攻击私营部门目标来模糊黑客行为的界限，但俄罗斯往往采取相反的方法：利用个人犯罪分子或有组织犯罪集团，在情报或军事指导下实现其国家目标。这并不是一个新策略：20
  世纪 80 年的书《布谷蛋》（`Cuckoo’s Egg`）最初引起了司法部 `Bob Mueller` 的注意，并导致了第一个“计算机犯罪小组”的成立，书中讲述了在拨号调制变器时代，`KGB`
  如何招募一名东德黑客 `Markus Hess` 来攻击美国的国防公司和实验室。事实上，有时看起来俄罗斯联邦安全局（`FSB`）只在俄罗斯境内追捕黑客，作为招募工作的一部分。曾任伦敦
  `KGB` 驻处负责人的 `Oleg Gordievsky` 在 1998 年的一次网络犯罪会议上说：“有与 `FSB` 挂钩的黑客组织。我认识的一个被捕犯网络犯罪的人被给了监狱或与
  `FSB` 合作的选择，他选择了后者。”这种模式我们在未来的几年中看到持续。


  美国政府一直一直请求 `FSB` 协助逮捕黑客，并对更广泛的技术合作保持谨慎。检察官和调查人员成功识别了 `SoBig` 和 `Bagle` 等病毒的作者，并告诉俄罗斯执法部门名为
  `HangUp Team` 的黑客小组领导人的姓名——但这一切都是徒劳无功。两国之间存在的任何有限合作通常集中在共同关注的领域，例如儿童色情和恐怖主义。然后是斯诺登丑闻，普京欢迎并利用了这位前
  `NSA` 员工，结束了两国之间任何合作的希望。


  在网络犯罪方面，我们唯一的真正成功是我们在其他地方发现正在度假的俄罗斯黑客并请求国际援助将其拘留——或者我们引诱他们离开俄罗斯。在 21 世纪初，一名俄罗斯黑客
  `Alexey Ivanov` 在他认为是去西雅图参加面试时被捕了——结果惊讶地发现他的“面试官”其实是 `FBI`。随后，`Roman Valerevich
  Seleznev` 因在著名的黑市交易网站 `CarderPlanet.Ru` 中的作用而被特勤局通缉，在马尔代夫被捕——俄罗斯政府随即抗议称他被绑架了。一名黑客在布拉格老城与女友聚餐时被捕，两名黑客在泰国的海滨度假村被捕，另外两名在西班牙度假时被捕。


  这似乎远远不够。


  ![](img/00006.jpeg)


  当我们警惕地观察着威胁的扩张时，俄罗斯黑客（犯罪分子与政府支持团体的混合）在 2007 年对爱沙尼亚发起了进攻性网络攻击，并在 2008 年作为这些国家更广泛的地缘政治危机的一部分，再次对格鲁吉亚共和国发动攻击。





  然而，我第一次大规模接触俄罗斯国家安全案件是在现实生活中：在 2010 一次代号为`GHOST STORIES`（幽灵故事）的行动中，FBI 反间谍锁定了十名分散在美国各地的俄罗斯“潜伏人员”，他们是俄罗斯海外情报局（SVR）和总参谋部（GRU）的所谓深潜特工，过着普通人的生活。俄罗斯政府投入了多年的心血和巨额资金，让他们的特工在美国建立身份，正是通过大量的艰苦调查——以及俄罗斯内部的一个特殊线人——美国才成功瓦解了这一行动。


  这个案件为我提供了一个早期的例子，说明司法部就像是外交宴会上的“搅局者”——这是我们后来在处理中国、伊朗以及我们想要追求的地缘政治敏感案件时面临的相同挑战。FBI
  想要逮捕这些“潜伏人员”，但案件发生时，奥巴马总统政府正在推行所谓的与俄罗斯关系的“重置”，这是一种试图与德米特里·梅德韦维夫总统建立更友爱关系的尝试。正如时任国防部长罗伯特·盖茨在他的回忆录中所述，`Mueller`和`CIA`局长`Leon
  Panetta`都想推进此案。这次行动威胁到了引发外交冲突。盖茨写道：“总统似乎对`Mueller`想要逮捕潜伏人员感到愤怒，也对`Panetta`想要从莫斯科营救线人感到愤怒，就像对俄罗斯人那样。”他引用了奥巴马总统的话：“我们刚要与俄罗斯进入正轨，就来这个？这是冷战的倒退。这简直就像是约翰·勒波的小说情节。我们要为了这种事，把[核武器条约]、伊朗以及与俄罗斯的所有关系置于危险之中吗？”


  最终，我们确实逮捕了他们所有人——而且在几天之后，政府就安排了一场冷战式的间谍交换，释放了四名被关在俄罗斯监狱的人。


  ![](img/00006.jpeg)


  当俄罗斯袭击纳斯达克股票交易所时，第一个针对俄罗斯的国家安全网络危机爆发了。FBI 最早在 2010 年 10 月发现了交易所内部存在恶意软件的报告，启动了为期五个月的调查。随着调查人员意识到他们面对的不一定是金融欺诈企图，而可能是一个国家在为攻击铺路，调查迅速升级。`FBI`和`DHS`所属的国家网络安全与通信整合中心的调查人员与`NSA`合作研究了该恶意软件。特勤局最初想要获得案件的管辖权，但随着国家安全影响变得显而易见，这变成了一个`FBI`调查。政府官员在纽约自由广场（One
  Liberty Plaza）旧美国钢铁大楼的纳斯达克总部现场工作，并在其过河位于新泽西州卡特勒特 Verizon 大楼内的主要数据中心也进行工作——该 Verizon
  设施挤满了其他交易公司，他们希望尽可能靠近纳斯达克，以便尽可能快地交易。官员们被最初的发现惊呆了：利用了两个独立零日漏洞的精密恶意软件，这些工具对黑客来说价值巨大，通常只有财力雄厚的国家才能拥有。根据*彭博*的报道，这种恶意软件的基础再熟悉不过——一个被仔细放置以稍后爆炸的“数字炸弹”。正如*彭博*所写道：“`NSA`以前见过一个版本，是由俄罗斯联邦联邦安全局（`FSB`，即该国的主要情报机构）设计并建造的。这不仅仅是间谍软件：虽然该工具可用于窃取数据，但它还有一个旨在在计算机网络内制造广泛干扰的功能。”


  然而，随着调查人员的深入挖掘，他们变得困惑了：在考虑了多种动机并检查了大量证据后，他们发现黑客集中在纳斯达克的 13 台服务器上，这些服务器运行着证券交易所本身的软件。看来，对纳斯达克的渗透是为了帮助助力俄罗斯总统德米特里·梅德韦维夫扩大俄罗斯国内金融市场的努力。正如*彭博*报道的那样：“到
  2011 年中，调查人员开始得出结论，俄罗斯人并不是试图破坏纳斯达克。他们想克隆它，要么将其技术直接整合到自己的交易所中，要么将其作为学习的模型。他们派遣了一支精英网络间谍团队来获取它。”起初看起来是一个国家安全危机，但很可能只是平常的知识产权盗窃，是另一个国家试图利用美国人的创造力获利的尝试。


  ![](img/00006.jpeg)


  纳斯达克案凸显了俄罗斯金融犯罪与俄罗斯国家目标之间复杂的联系。这是我们在未来几年中继续看到的模式。2014 年的两个重大案件特别向我们展示了俄罗斯是如何开始将犯罪世界与情报收集相融合的。第一个案件实际上始于几年前，这强调了解决某些网络案件需要多长时间，以及在网上理清某些黑客身份需要多少努力。2009
  年春天，来自`FBI`内布拉斯加州奥马哈分分局的新手特探员詹姆斯·克雷格开始调查一起奇怪的电子盗窃案。克雷格是一个方脸的前陆战队队员，成为特探仅仅六个月，但他的上级因为他的背景选了他负责此案：多年来，他一直是`FBI`的
  IT 人员。


  案件中的主要受害者是支付处理巨头 First Data 的一家子公司，该公司在当年 5 月损失了 45 万美元。紧随之后，奥马哈第一国家银行的一位客户也遭遇了
  10 万美元的盗窃。克雷格注意到，奇怪的是，这些盗窃行为似乎是从受害者自己的`IP addresses`执行的，使用了他们自己的登录名和密码。在检查他们的电脑时，他发现它们感染了同一种恶意软件：一种被称为`Zeus
  Trojan horse`（宙斯特木马）的东西。


  在在线安全圈中，`Zeus`臭名昭著。该恶意软件自 2006 年首次出现，在犯罪分子和安全专家眼中都被誉为杰作——流畅、高效、多功能。它的作者是一个幽灵。他只在网上为人知，代号为`Slavik`、`lucky12345`或其他六个不同的名字。


  `Zeus`通过相当典型的手段感染计算机：例如伪造的美国税务局（IRS）邮件，或不法的 UPS 运输通知诱骗收件者下载文件。但一旦它进入你的电脑，`Zeus`让黑客可以像神一样：他们可以劫持网站，并使用键盘记录器记录用户名、密码和
  PIN 码。黑客甚至可以修改登录表单以索要更有价值的安全信息：母亲的娘氏、社会安全号码。这种骗术被称为“浏览器中间人”攻击。当你坐在电脑前登录看似安全的网站时，恶意软件会在页面加载之前对其进行修改，窃取你的凭据和账户余额。只有当你从另一台电脑登录时，你才可能发现钱丢了。


  当克雷格开始调查时，`Zeus`已成为数字地下世界首选的恶意软件——在线欺诈界的微软 Office 软件。`Slavik`是恶意软件世界中罕见的：一个真正的专业人士。他经常更新`Zeus`代码，并测试新功能。他的产品具有极强的适应性，针对不同的攻击类型和目标有不同的变。被`Zeus`感染的计算机甚至可以并入僵尸网络，这种由被感染计算机组成的网络可以被汇起来运行垃圾邮件服务器或
  DDoS 攻击，或者发送额外的欺骗邮件以进一步传播恶意软件。






  # 在 2009 年 Craig 接手此案前不久，Slavik 开始改变策略。他开始培养一个在线犯罪分子的核心圈子，为某个精选小组提供一种名为 `Jabber
  Zeus` 的恶意软件变体。该软件配备了一个用于即时通讯程序 `Jabber` 的插件，允许该小组进行通信和协调攻击——就像在奥马哈发生的的两次盗窃案中那样。他们不再依赖于大规模的感染活动，而是开始专门针对企业会计师和拥有金融系统访问权限的人员。


  # 随着 Slavik 越来越多地转向有组织犯罪，他大幅收缩了自己的零售恶意软件业务。2010 年，他在网上宣布了“退休”，随后发布了安全研究人员称之为 `Zeus
  2.1` 的软件。这是一种高级版本的恶意软件，受加密密钥保护——实际上是将每个副本都与特定用户绑定——单份价格高达 10,000 美元。从那以后起，Slavik
  只与一群精英、野心勃勃的犯罪分子打交道。


  “我们完全不知道这个案件的规模有多大，”Craig 说，“这些人的活跃程度令人惊叹。”其他机构开始陆续站出来提供损失和欺诈陈述。非常多。Craig 意识到，从他在奥马哈郊区的办公桌出发，他正在追踪一个组织严密的国际犯罪网络。“受害者开始像从天上一样掉下来，”Craig
  说道。这让 FBI 此前处理过的任何网络犯罪都显得相形见绌。


  ## Craig 的第一个突破出现在 2009 年 9 月。在一些行业专家的帮助下，他确定了一个位于纽约的服务器，该服务器似乎在 `Zeus` 网络中扮演着某种角色。他获取了搜查令，FBI
  取证小组将服务器数据复制到硬盘上，然后通过隔夜运往内布拉斯加州。当奥马哈的一位工程师检查结果时，他露出了敬畏的神情：看着 Craig，他说：“你拿到了他们的 `Jabber`
  服务器。”该聊天系统的服务器包含了数万行俄语和乌克兰语的即时消息。


  # 这是该团伙整个数字运营——通往整个案件的路线图。网络安全公司 Mandiant 派遣一名工程师到奥马哈工作了几个月，仅为了理清 `Jabber Zeus`
  代码，而 FBI 开始轮换来自其他地区的探员，执行为期 30 天或 90 天的任务。全国各地的语言学家也协助破译日志。“俚语是一个挑战，”Craig 说。


  消息中包含了对数百名受害者的引用，他们被盗的凭据散落在文件中的英文部分。Craig 和其他探员开始向各机构拨打冷电话，告诉他们遭受了网络欺诈的侵害。他发现几家企业已经解雇了他们怀疑偷窃的员工——却并没有意识到这些人的电脑已经被感染了恶意软件，登录信息被盗取了。


  # 案件还扩展到了虚拟世界之外。2009 年的一天，三位来自哈萨克斯坦的年轻女性走进纽约 FBI 调查局，讲述了一个离奇的故事。这些女性来到美国寻找工作，发现自己参与了一个奇特的计划：一个男人会开车送她们去当地一家银行，告诉她们进去开一个新账户。她们要向柜台员解释自己是暑假来访的学生。几天后，那个男人让他们返回银行并取出账户中所有的钱；他们留下一小部分抽金，将其余交给给他。探员们拼凑出这些女性是“钱骡”：她们的工作是提取
  Slavik 及其同伙从合法账户中抽取的资金。


  # 直到 2010 年夏天，纽约的调查人员已让该地区的银行警惕可疑的现金取现行为，并告诉他们在情况发生时召集 FBI 探员。警报发现了数十名“钱骡”取出了数万美元。这是另一个清晰的例子，说明了为什么网络案件不能仅仅是技术性调查——我们需要将数字取证的比特和字节与探员通常使用的现实世界调查技巧相结合，因为归根结底，有人拿走了偷来的钱并在某个地方花掉。你需要能够追踪发展案件中的每一根线索，无论是在现实世界还是在线。


  大多数钱骡是布顿滩（Brighton Beach）的学生或新移民。一位女性解释说，在一家杂货店的工作落空后她变成了钱骡，她告诉一名探员：“我可以去抢劫，也可以做这个。”另一个男人解释说，他会在早上
  9 点被接走，下午 3 点前完成取现任务，剩下的时间都在海滩度过。大多数取现金额在 9,000 美元左右，恰好低于联邦报告的限额。钱骡获得总额的 5% 到 10%。





  在全球范围内进行了 150 起逮捕——跨越四个国家——调查人员成功瓦解了该网络。但关键人物逃脱了。美国的一名顶尖钱骡招募者逃了，他在拉斯维加斯和洛杉矶的调查人员面前领先一步，最终躲在集装箱内逃出了国。更重要的是，主脑
  Slavik 本身几乎是一个完全的谜团。调查人员假设他身在俄罗斯。在一次在线聊天中，他们看到他提到自己已结婚。除此以外，他们一无所获。正式起诉书使用其在线代名引用了
  `Zeus` 恶意软件的创建者。Craig 甚至不知道他的头号怀疑犯长什么样。“我们有成千上万张坦克、petr0vich 的照片——但没有一次见过 Slavik
  的脸，”Craig 说。很快，甚至连这个罪犯的在线痕迹也消失了。无论 Slavik 是是谁，他彻底销匿了。在追踪了七年的 `Jabber Zeus` 后，James
  Craig 转向了其他案件。


  ![](img/00006.jpeg)


  在 FBI 取缔 `Jabber Zeus` 犯罪网络约一年后，关注恶意软件和僵尸网络的网络安全研究人员小组开始注意到一种新的 `Zeus` 变种。该恶意软件的代码在
  2011 年泄露到了网上——可能是故意的，也可能不是——这实际上将 `Zeus` 变成了一个开源项目，并引发了新变种的爆发。但引起研究人员注意的版本有所不同：更强大、更复杂，特别是在组装僵尸网络的方法上。


  在此之前，大多数僵尸网络使用“星型结构”——黑客程序化单一命令服务器，直接将指令分发给被感染的机器（即僵尸电脑）。这支亡灵军随后可以被指示发送垃圾邮件、分发恶意软件，或针对网站发起拒绝服务攻击。然而，这种星型结构的设计让僵尸网络对于执法部门或安全研究人员来说相对容易破解。如果你能让命令服务器离线、缴获它，或中断黑客与其通信的能力，你通常就能破坏僵尸网络。


  然而，这种新的 `Zeus` 变种依赖于传统的命令服务器和僵尸机器之间的点对点通信，使其极难被击倒。被感染机器保存着一份不断更新的其他感染机器列表。如果一台设备感知到与命令服务器的连接被中断，它将依靠点对点网络寻找新的命令服务器。


  实际上，该网络从一开始就被设计成防击毁的；一旦一个命令服务器被击离，僵尸网络所有者可以在其他地方建立一个新服务器，并将点对点网络重定向到那里。新版本被称为 `GameOver
  Zeus`，源于它的文件名之一 `gameover2.php`。这个名字也自然地带有一种绞架上的幽默感：一旦这东西感染了你的电脑，安全专家们曾开玩笑说，那你的银行账户就完蛋了（game
  over）。


  据目前人所知，`GameOver Zeus` 由一个非常精英的黑客小组控制——该小组的领导是 Slavik。他重新出现了，而且比以往任何时候都要强大。Slavik
  的新犯罪集团被称为 `Business Club`。2011 年 9 月给小组的一份内部公告——向成员介绍了一套用于组织转账和钱骡的新在线工具包——以对 Slavik
  精选接收者的热烈欢迎结束：“我们祝大家工作顺利、富有成效。”


  与 `Jabber Zeus` 网络一样，`Business Club` 的首要指令是攻陷银行，其执行手段比前任更加残忍且富有创造性。该计划是多管齐下的。首先，`GameOver
  Zeus` 恶意软件窃取用户的银行凭据，在拥有感染电脑的人登录在线账户时立即截获这些凭据。然后，`Business Club` 抽空银行账户，将资金转移到他们控制的海外其他账户。盗窃完成后，该小组利用其强大的僵尸网络对目标金融机构发动拒绝服务攻击，以分散银行员工的注意力，并防止客户在资金结账之前意识到他们的账户已被清空。2012
  年 11 月 6 日，FBI 睁睁睁看着 `Business Club` 在单笔交易中盗走了 690 万美元，然后对银行发起了为期数日的拒绝服务攻击。


  与早期的 `Jabber Zeus` 团伙不同，`Business Club` 专注于更大规模的六位数和七位数的银行盗窃案——这种规模让布鲁克林的银行取款变得过时了。相反，他们利用全球互联的银行系统来反制自己，将巨额盗窃隐藏在每天在全球范围内流动的数万亿美元的合法商业活动中。调查人员特别识别了中国远东地区的两个地区（靠近俄罗斯城市弗拉迪沃斯克），钱骡从那里将巨额被盗窃资金汇入
  `Business Club` 账户。调查人员意识到，这种策略代表了有组织犯罪的进化飞跃：银行抢劫者不再需要在美国境内留下足迹。现在他们可以远程完成一切操作，永远不触及美国的司法管辖区。“这就是他们逍法无忌地运作所需的全部手段，”前
  FBI 高级官员 Leo Taddeo 说。


  银行并不是该团伙唯一的目标。他们还搜查了大小不等的非金融企业、非营利组织，甚至是个人的账户。2013 年 10 月，Slavik 的小组开始部署一种名为 `CryptoLocker`
  的恶意软件，这是一种勒索软件，会加密被感染机器上的文件，并迫使所有者支付小笔费用（例如 300 到 500 美元）以解锁文件。它很快成为该网络犯罪团伙喜爱的工具，部分原因是它帮助将无用资产转化为利润。事实证明，建立一个专注于高水平金融欺诈的大型僵尸网络的问题在于，大多数僵尸电脑并不连接到高额账户；Slavik
  和他的同伙发现自己拥有数万台闲置的僵尸电脑。虽然勒索软件产生的并不巨大，但它为犯罪分子提供了利用那些毫无价值的感染电脑的方法——而且涉及的金额通常低到受害者不会向警方报警，执法部门也不会对此采取行动。


  勒索软件的概念从 20 世纪 90 年代就开始了，但 `CryptoLocker` 让它进入主流。这种病毒通常以不起眼的邮件附件形式出现在受害机器上，`Business
  Club` 的勒索软件使用强加密，并迫使受害者使用比特币进行支付。这既尴尬又不便，但许多人屈服了。马萨诸塞州斯旺尼市警方局在 2013 年 11 月不情愿地出了
  750 美元换回他们的一台电脑；这种病毒“如此复杂且成功，你必须购买这些比特币，我们以前从未听说，”斯旺尼市警官 Gregory Ryan 告诉当地报纸。


  下个月，戴尔所属的安全公司 SecureWorks 估计，全球有多达 25 万台机器在当年感染了 `CryptoLocker`。一名研究人员追踪了 771 笔勒索金，为
  Slavik 的团队总共赚了 110 万美元。“他是第一批意识到人们为了重新获得文件会变得多么疯狂的人之一，”当时 SecureWorks 的研究人员 Brett
  Stone-Gross 评价 Slavik 说，“他没有收取过高的费用，但他赚了很多钱，并创造了一种新的网络犯罪。”





  随着“商业俱乐部”（Business Club）不断壮大，其运营者不断增加收入来源——将他们的网络租给其他犯罪分子来分发恶意软件和垃圾邮件，或执行点击欺诈等项目，通过命令僵尸网络在虚假网站上点击广告来产生收益。这些变现现有的尝试让调查人员非常头疼；我们有时甚至看到犯罪网络被用于情报目的，因为犯罪分子愿意租给任何需要大型僵尸网络巨大算力来分发自己的恶意软件、进行金融诈骗或发起
  DDoS 攻击的人。这让我们发现某些僵尸网络的动机变得异常困难——真正的所有者是谁？恶意网络的真实目的是什么？


  随着每周过去，GameOver 给银行、企业和个人带来的成本日益增加。对于企业而言，这些盗窃可能轻易抹掉一整年的利润，甚至 worse。在国内，受害者范围从佛罗里达北部的一家地区性银行到华盛顿州的一个美国原住民部落不等。随着
  GameOver 侵扰私营部门的大部分，它吸收了越来越多的私营安全行业努力。涉及的金额惊人。“我不认为有人能掌握全貌——一次 500 万美元的盗窃案就掩盖了数百次较小的盗窃，”荷兰
  Fox-IT 公司的安全专家 Michael Sandee 解释道，“当一家银行遭到大规模攻击——每周 100 笔交易时——你就不再关心具体的恶意软件和个体攻击了；你只需要停止流血。”


  ### 攻破 GameOver Zeus 的早期尝试


  2011 年至 2013 年间，网络安全人员和各种公司发起了三次击败 GameOver Zeus 的尝试。三位欧洲安全研究人员在 2012 年春天发起了首次进攻。Slavik
  轻而易地击退了他们的攻击。随后，在 2012 年 3 月，微软数字犯罪部门对该网络发起了民事诉讼，依靠美国法警突袭了位于伊利诺伊州和宾夕法尼亚州的数据中心，那里托管着
  Zeus 的命令与控制服务器，并对被认为与 Zeus 网络相关的 39 个人采取法律行动。（Slavik 位列名单首位。）但微软的计划未能给 GameOver
  造成实质性打击。相反，这只是让 Slavik 了解了调查人员对他网络的了解的程度，并允许他完善了自己的战术。


  ### 僵尸网络战斗者的崛起


  僵尸网络战斗者是一群规模小但自豪的工程师和安全研究人员——他们自称为“互联网清洁工”，致力于保持在线网络运行顺畅。在该小组中，来自安全公司 CrowdStrike
  的高瘦德国研究人员 Tillmann Werner 因其才华和对工作的热情脱颖而出。2013 年 2 月，他控制了 Kelihos 僵尸网络（一个基于万艾力垃圾邮件的臭名恶意软件网络），并在网络安全行业最大会议的演示现场进行了展示。但他知道，Kelihos
  并不是 GameOver Zeus。Werner 从 GameOver 诞生之初就在关注它，对其力量和韧性感到惊。


  2012 年，Werner 与 Brett Stone-Gross（当时刚大学毕业几个月，住在加利福尼亚州）以及其他几个研究人员联系在一起，制定了一项攻击 GameOver
  的计划。这些人人跨越两个大陆，大部分利用业余时间工作，通过在线聊天策划攻击。他们仔细研究了之前的欧洲尝试，识别出其失败之何，并花费了一年的时间准备进攻。


  ### 汇洞行动（Sinkholing Operation）


  2013 年 1 月，他们准备就绪：他们储备了披萨，假设自己要对 Slavik 的网络进行长期的围困战。（Werner 说，“当你对抗僵尸网络时，你只有一次机会。要么成功要么失败。”）。他们的计划是重新路由
  GameOver 的对点网络，将其中心化，然后将流量重定向到他们控制的新服务器上——这一过程被称为“汇洞”。通过这种方式，他们希望切断僵尸网络与 Slavik
  的通信链路。起初，一切进展顺利。Slavik 没有表现出反击迹象，Werner 和 Stone-Gross 看着越来越多的感染计算机每小时连接到他们的汇洞中。


  在攻击的高峰，研究人员控制了 Slavik 99% 的网络——但他们忽略了 GameOver 结构中一个关键的韧性来源：一小部分被感染的计算机仍在秘密与 Slavik
  的命令服务器进行通信。“我们漏掉了还有第二层控制，”Stone-Gross 说。到第二周时，Slavik 能够向他的整个网络推送软件更新并重新确立权威。研究人员带着心中初升的恐惧，看着新版本的
  GameOver Zeus 在互联网上传播，Slavik 的对点网络开始重新整合。“我们立即看到了发生了什么——我们完全忽视了另一个通信通道，”Werner 说。


  研究人员这个耗时九个月策划的诡谋失败了。Slavik 赢了。在与波兰安全团队的一次挑衅性在线聊天中，他得意地宣告所有夺取他网络的努力都付诸东流。“我不认为他觉得击败他的僵尸网络是可能的，”Werner
  说。沮丧的两个研究人员渴望再次尝试。但他们需要帮助——他们转向了匹兹堡，那支长期以来一直引导 FBI 调查网络犯罪的小组。


