  这些案件通常被称为“1029 案件”，引用自《美国法典第 18 卷》第`1029`条，即涉及“与接入设备相关的欺诈及相关活动”或身份盗窃的法律。该法律源于 20
  世纪 80 年代的同类努力，这些努力导致了《计算机欺诈与滥用法》的诞生，随后在 20 世纪 90 年代初的“严厉打击犯罪”的行动中得到进一步完善。它是包含在长达
  356 页的、1994 年《暴力犯罪控制与执法法》中的一项较少关注的条款，该法案广为人知的内容包括资助培养 10 万名新警察、禁止攻击性武器、建立性侵犯者登记处、《反对妇女暴力法》以及扩大联邦死刑判罚。法律后来的修订和扩张承认，地方和州级当局在起诉计算机犯罪的专业知识方面十分吃力，并意识到此类调查应越来越多地成为联邦政府（特别是特勤局）的首要管辖范围。


  “防弹主机”在 20 世纪 90 年代末和 21 世纪初支撑了在线垃圾邮件的肆虐；在其巅峰时期，全球超过 90%的邮件都是未经请求的垃圾信息。垃圾邮件诱导收件者在“拉高出货”骗局中购买廉价股，或者在线非法购买药物，如万力胶（Viagra）和西地时（Cialis）等勃起功能药物，甚至是救命的癌症药物。这些假冒在线药房并非来来作坊，它们运营着复杂的客户服务中心，帮助确保客户满意并避开
  Visa 和万事达等支付公司的视线。在线垃圾邮件浪潮是由无意中安装在全球数万台计算机上的恶意软件驱动的，这些计算机被连接成由罪犯控制的僵尸网络。其中一个通过传播“风暴虫”（Storm
  Worm）建立的僵尸网络，独自负责全球每五封垃圾邮件中的一份。


  随着时间的推移，这些有组织的犯罪集团意识到，运行僵尸网络本身就可以获利——这让他们拥有了一个平台，可以租给其他犯罪分子，以便利各种在线计划，或通过价格传播特定的恶意软件。一位垃圾邮件之王，彼得·尤里耶维奇·列夫绍夫（Peter
  Yuryevich Levashov，也被称为彼得·塞维拉或“北方的彼得”），每每百万封垃圾邮件收取 200 至 500 美元不等的僵尸网络租金，并从其垃圾邮件产生的引导流量中抽成；根据在线泄露的记录，此类计划在三年内为他赚了超过
  60 万美元。



  黑客行为往往等同于一种老式的勒索：犯罪分子访问公司网络，然后要求支付“安全咨询费”，告诉公司他是如何进入的并保持沉默。马克西姆·伊戈尔·波波夫（Maksym Igor
  Popov）于 2000 年 7 月侵入了支付处理商 eMoney 和西方联合银行的网络，并试图向这些公司收取高达 50 万美元的“费用”。当 FBI 最终逮捕波波夫时，特探
  E. J. 希尔伯特（E. J. Hilbert）本人曾是一个使用代号 Idolin 的（非犯罪）黑客，他意识到自己可能是渗透这些犯罪论坛的最佳人选。“我非常尊重你的技能，”希尔伯特对这位乌克兰黑客说。正如凯文·波尔森（Kevin
  Poulsen）为《连线》杂志还原的那样，他们合作了多年一项代号为“蚁城”（ANT CITY）的行动，在此期间，波波夫每天在 FBI 会室里花费几个小时浏览在线论坛，与其他黑客交流并获取情报——然后每晚回到他的囚室。直到波波夫服完刑回到乌克兰，这项行动才结束结束。


  FBI 正在通过惨痛的代价学习网络犯罪，意识到他们的系统是多么脆弱。根据波尔森的报道，希尔伯特探员在 2004 年除夜获悉，一个名为 X.25 的团伙渗透了新泽西州运行
  FBI 网络的某些 AT&T 服务器。黑客们偷取了文件，其中包含一份涵盖 100 多个 FBI 和特勤局顶尖网络犯罪目标的表格，包括了如“与政府合作”之类的妥协注释。FBI
  在不经意中支付了已回到乌克兰的波波夫 1 万美元，试图重新夺回这些信息，而没有意识到他们的线人实际上是实施那次攻击的人之一。


  数字世界日益增加的不安全性在 2003 年和 2004 年显露无遗，当时当局正与破坏性病毒的兴起作斗争——这些病毒被称为 SoBig（大病毒）和 Bagle（巴格病毒），每一个版本都比前一个更具毒性、更有效，它们是
  15 年前因“风暴虫”而闻名的威胁的最新变体。在 2003 年 8 月野外传播的前两天内，SoBig 在美国造成了估计 5000 万美元的损失，中断了加拿大航空的运营，并瘫痪了洛克希德马丁公司的计算机。“Bagle
  拥有第一个真正商业化病毒的称号，”约瑟夫·梅恩（Joseph Menn）在《致命系统错误》中写道。


  病毒和蠕虫显然并不新鲜；“风暴虫”和 1999 年的“梅丽莎病毒”（Melissa virus）已经标志着大众市场计算机感染的到来，但在这两个案例中，发明者都被捕并判刑，但
  SoBig 和 Bagle 的幕后黑手却顽固地逍在法外。





  联邦调查局（FBI）似乎在对抗病毒方面未能取得进展。即使是微软提供的 25 万美元奖励也未能让 SoBig 案取得突破；私营安全研究人员收集了证据并将其交给 FBI，但几个月过去了，并没有采取任何行动。最后，这些行业研究人员针对我们后来在司法部采用的策略采取了尝试性的步骤——即一种“公开羞辱”（name
  and shame）的方法，这种方法即使创建者规避了起诉，也可能导致他改变未来的行为。他们公开指控了鲁斯兰·伊布拉基莫夫（Ruslan Ibragimov），一名运营名为
  Send-Safe 的垃圾邮件服务的俄罗斯人。在的一博客文章和题为《谁写了 Sobig?》的近 50 页技术论文中，他们发布了与病毒及随后的垃圾邮件相关的证据。这份匿名论文将
  Send-Safe 的软件与 SoBig 的代码进行了对比，结论认为两者的相似性“应该被认为在凶器上发现指纹一样重大”。尽管他公开否认了指控，研究人员仍敦促其托管公司
  MCI 将其踢出客户名单——MCI 确实这么做了，随后 Send-Safe 尝试重启的另外两家公司也是如此。这是在缺乏正式政府指控的情况下，首批维护网络私自执法运动之一。


  ![](img/00006.jpeg)


  虽然像克里斯·比森（Chris Beeson）这样的探员在 20 世纪 90 年代开创了 FBI 的许多计算机犯罪工作，但在内部的人才储备仍然非常匮乏。特别是在面对持续、磨人的威胁时，网络安全并非完全落后，但确实是一个没有吸引大量高端人才的领域。然而，从某种意义上说，这意味着专注探员可以在无人关注的情况下建立起引人入胜的案件。21
  世纪初，FBI 网络工作的明星人物是 J·基思·穆拉尔斯基（J. Keith Mularski），他在匹兹堡长大，他活泼善于社交的性格与传统的、克制的联邦调查探员（G-man）形成鲜明对比。他在
  FBI 的前七年在华盛顿特区从事间谍和恐怖主义案件，但一旦看到匹兹堡有一项新的网络倡议，就立即申请回到家乡。


  当时，他对计算机一无所知，在深入参与匹兹堡一项为期两年的追踪身份盗窃者的卧伏调查时开始自学。他很早就意识到黑客是 21 世纪的黑手党——在这个看似混乱的影子世界中，存在着组织和等级制度。


  几个月来，他在匹兹堡的电脑前探索信用卡盗刷（carding）世界，受司法部关于如何与他人交流的严格规定的指导。随着他深入信用卡盗刷者的世界，他向 FBI 上级申请了更大的权限，以便以卧伏身份与犯罪分子接触。首先，他获得了所谓的
  `Group II operations`（第二组行动）的许可，这允许他增加与 `DarkMarket` 以及其他论坛的接触；随后，他成功获得了所谓的 `Group
  I operations`（第一组行动）的授权，这一类别专门保留给必须经 FBI 总部批准的高度敏感行动。


  这个计策奏效了。每天，一台简单的 FBI 计算机爬取论坛，识别出被盗的信用卡，并将详情传给 Visa 和万事达。穆拉尔斯基晚上坐在家里打开笔记本电脑与犯罪分子聊天，直到他获得了其他成员的信任，并取得了了难以置信的胜利——最终成为了
  `DarkMarket` 的管理员，这一身份帮助调查人员跨越三个大洲逮捕了 60 个人。该案件证明了研究犯罪社区并在其中建立关系的力量，而不仅仅是抓住你看到的第一个坏蛋。


  从那里开始，穆拉尔斯基和他在匹兹堡的同事利用卡内基·梅隆理工大学等当地资源，将该市发展为美国顶尖的网络犯罪中心之一；美国秘密勤务局的匹兹堡分队调查并最终起诉了其他几个大型犯罪论坛，包括
  CardersMarket 网站，该网站的领目 `Iceman`（真名马克斯·巴特勒 Max Butler）因网络犯罪被判了迄为止最长的刑期——13 年监禁。此类案件激励了穆拉尔斯基，他至今一直处于
  FBI 网络工作的前沿。在匹兹堡办完首批案件十年后，穆拉尔斯基以及他在匹兹堡的同事（如起诉 `Iceman` 的卢克·德姆博斯基 Luke Dembosky）成为我们对抗中国斗争中的关键领导人物，并成为我们在司法部追求国家安全网络威胁工作中的主要力量。正如他回忆道，“匹兹堡是该去的地方。”


  ![](img/00006.jpeg)


  在《数字死锁》（DIGITAL GRIDLOCK）之后不久，我陷入了另一个计算机案件之中，当时 FBI 华盛顿分局的计算机入侵小队报告了一次规模似乎大得惊人的泄密事件。看来，FBI
  的整个计算机网络都已被攻破。调查工作迅速锁定了约瑟夫·T·科隆（Joseph T. Colon），他当时 20 多岁，是英国航空系统（BAE Systems）的
  IT 支持承包商，在 FBI 伊利诺伊州斯普菲尔分局工作。从表面看，这个案件似乎是最坏的情况的情况：科隆于 2003 年 12 月加入 FBI，破解了每个 FBI
  员工的密码，包括 FBI 局长罗伯特·穆勒（Robert Mueller）本人。当时案件并未引起注意，但它显示了来自信赖内部人员的威胁，并在许多方面预示了多年后的爱德华·斯诺登（Edward
  Snowden）——一个年轻、心沮丧的承包商，利用其合法的网络访问权限，以完全超出预想的方式横扫敏感系统。


  正如我们在调查中发现的，2004 年 3 月，在抵达 FBI 办公室仅几个月后，科隆利用两个从互联网下载的易用黑客程序渗透了机密网络——`Pwdump3.exe`
  和 `L0phtcrack`，后者是 90 年代由美国首批黑客组织之一（即是波士顿的一个所谓的黑客智库）创建的著名工具。这是灰色地带的一个极佳例子，许多被通常统称为恶意软件的部分都存在于这种地带：这种软件由“好人”编写，并被网络安全团队经常用于分析自己的网络，但也可以被轻易转用于非法目的。


  它的原始创建者 L0pht Heavy Industries 在 20 90 年代作为“灰帽”黑客而闻名，在网络上存在于“白帽”好人与“黑帽”坏人之间的某个地带，并多年一直在警告互联网中存在的漏洞。





  这群大约有七人的黑客白天从事 IT 安全工作，但他们发现大多数公司对网络保护缺乏关注，感到非常沮丧。他们的名字“L0pht”在发音上源于这样一个事实：其中两个创始人与妻子经营的帽子生意共用一个阁楼层（loft）空间。在这个空间里，装饰着
  `Battlezone` 街机游戏机和从波士顿各地收集而来的废旧电脑，他们嘲笑微软等大公司使用的加密技术为“幼儿园级加密”——即那种本应保护用户却极易破解的加密方式。


  在某种程度上，他们已经成为美国政府在黑客世界的代理人；白宫反恐主义协调员理查德·克拉克前往哈佛广场与他们会面，了解这个新的数字地下世界。他敬畏地看着他们在仓库聚会点里，向他展示了他们是如何破解密码和拦截卫星通信的。


  1998 年 5 月，这七个人实际上在美国参院政府事务委员会作了证；委员会主席弗雷德·汤普森通过读他们的七个黑客代号介绍了他们——这是首批非“证人保护计划”人员首次以化名在国会作证的人：Brian
  Oblivion、Kingpin、Tan、Space Rogue、Weld Pond、Mudge 和 Stefan von Neumann。他们警告说互联网对于恶意行为者来说是脆弱——太多的公司没有在初期给予足够的关注，太多的公司没有妥善保护自己的系统，太多的公司通过捷径或允许使用易猜密码，破坏了他们本就薄弱的安全措施。L0pht
  研究的一个网络有 700 名用户，所有人都使用同一个密码：“CHANGEME”。冯纽曼告诉参议员们，“在发生高可见度的灾难之前，很少有人愿意承认需要采取激进措施。可能需要一次切尔诺贝利规模的事件才能充分提高意识水平。”在听证会上，参议员乔·利伯曼称他们为数字时代的保罗·里维。遗憾的是，这些
  1998 年的警告对于在过去二十年里致力于这些问题的人来说，听起来依然熟悉。


  黑客发布了 `L0phtcrack`，以此证明大多数密码有多容易破解。1998 年发布时，`L0phtcrack` 使用标准的奔腾 II 计算机大约可以在 24
  小时内破解 8 位密码。随着计算能力的增加，破解变得越来越容易。到 2004 年约瑟夫·科隆下载它时，`L0phtcrack` 已经成为黑客的标准在线工具，同样的还有写于
  90 年代后期的 `Pwdump3.exe`。


  在联邦调查局（FBI），科隆启动了暴力破解密码攻击，用海量的猜测使系统瘫痪，直到他能够访问安全账户管理器（SAM）数据库，该数据库存储了 FBI38,000 名计算机用户的密码。SAM
  数据库使用 128 位算法对密码进行加密，将每个用户的密码转换为一段看似乱码的长字符串，被称为“哈希”（hash）。


  一旦进入数据库，他就使用 `Pwdump3.exe` 将所有“哈希”后的密码提取到一个他可以自己下载并存储的文件中。然后，他利用充足的时间运行了 `L0phtcrack`
  来解密这些哈希密码；该程序依靠字典词汇比较、常用密码列表和字符替换等技术来破解加密算法，从而破解每个密码的真实内容。没过多久，他就获得了 FBI 每一个人的明文计算机密码，并能够访问存储在
  FBI 系统上的每一个文件。由于 FBI 此后要求用户每 90 天更改一次密码，科隆在 5 月、7 月以及 11 月再次重复了这一壮举。在近一年的时间里，科隆拥有对
  FBI 系统的“上帝级访问权限”。


  当我们意识到科隆所取得的成就时，我们在想：我们中间是否隐藏着间谍？答案比想象中更奇怪，也更平庸。正如调查所明确的，科隆实际上意图利用他的访问权限做善事；当他开始这项工作时，他对
  FBI 的官僚主义感到非常沮丧——从设置计算机到添加新打印机，所有日常任务都需要书面的“IT 工单”并获得 FBI 分局的授权。但通过窃取高权限用户的密码，科隆能够绕过正常的网络限制，并执行诸如添加新打印机的疯狂行为。他的律师后来在法律文件中写道：“这出于想为
  FBI 做好工作，并确保项目按时且预算内完成。除了完成工作外，科隆先生并从中无利。他的动机虽然有偏差，但是纯粹的。”


  科隆无意中暴露了该局网络是多么脆弱——系统非常扁平化，意味着在不同部门之间移动非常容易，且出于安全目的隔离很少。我们有很多可以学习的地方，以防止未来的此类事件。FBI
  最终投入了数千小时和数百万美元来修复科隆所展示的漏洞。


  在我联邦检察官办公室工作期间，我只负责这些网络犯罪案件的刑事部分；每当我们追踪到海外的计算机入侵时，案件就会从我的办公桌上消失。如果我们怀疑某个国家是特定入侵的幕后黑手，案件就会转移到一个专门国家安全和外国反间谍案件的调查小组。尽管我们在同一个办公室，但该小组的调查人员完全隔绝工作，位于被锁的“敏感信息隔离设施”（政府术称为
  SCIF）内，该设施可以防止电子窃听。我从未得知那些消失在锁门后进入 SCIF 的案件变成了什么——而且考虑到我手头的工作，我并不真的在乎。





  # 情报与刑事证据


  “情报”与“刑事证据”之间的区别产生于“水门事件”后的改革，当时 `Church Committee` 建议在发生了一系列丑闻后，政府应采取积极措施限制窃听和监视权力。参议员弗兰克·教会（Frank
  Church）领导的委员会宣布，这些权力应当紧密地植根于司法部，并称司法部长作为“美国首席法律官员”，是“负责确保……情报机构按照法律开展活动的最合适官员”。


  作为该答复的一部分，国会于 1978 年通过了《外国情报监视法》（`FISA`），该法律旨在为在美国境内进行以获取外国情报为目的电子监视提供一条清晰的路线图——也是唯一的路线图。`CIA`
  在海外拥有更大的回旋地，但在美国境内，情报收集是 `FBI` 的唯一职范围，且它将受到包括政府三个部门在内的一系列制衡机制的严格控制。为了获得在情报事务进行监视的许可，`FBI`
  必须通过司法部向新设立的`外国情报监视法院`（`FISC`）申请“FISA 授权”。该法院由联邦法官组成（目前有 11 名），他们由美国首席大法官任命进入 `FISA`
  法院，并以兼职形式在法院中轮换。这套新机制将受到国会和监察总长的严格监督。


  ## 安全的摆钟


  在自由社会中，公民自由与安全之间的平衡是一个不断摆动和移动的摆钟。在最初的草案中，`FISA` 法要求国家安全官员在寻求授权时必须宣誓，申请的“目的”是获取“外国情报”。在
  20 世纪 90 年年代，`FISC` 对该短语进行了狭义的解释，在“情报”与任何实际上可能属于刑事诉讼的内容之间划了坚固的界限——即使该诉讼针对的是间谍或恐怖分子。这些法院裁决和随后的司法部程序营造了一种文化，即情报信息与执法保持分离——这种文化损害了执法部门通过从街头清除犯罪分子来维护国家安全的能力。


  ## 9/11 事件后的改革


  导致 9/11 事件的灾难性情报失败证明了这种区分的愚蠢；事件发生后，国会和布什政府致力于打破执法部门与情报部门之间的“防火墙”，同时维持对公民自由的底层保护。在担任局长的多年里，罗伯特·穆勒（Robert
  Mueller）始终强调一个核心主题，即这些改革在公民自由方面没有做出任何妥协。诚然，`FBI` 过去确实经历过黑暗的章节，但穆勒始终认为，`FBI` 文化的内核在于它可以在尊重宪法的同时完成工作。正如他在
  `FBI` 成立 100 周年上所说：“虽然 `FBI` 正处于变革时期，但我们的价值观永远不会改变。阻止恐怖分子是不够的——我们必须在维护其公民自由的同时阻止他。抓捕罪犯是不够的——我们必须在尊重其公民权利的同时抓捕他。防止外国窃取我们的秘密是不够的——我们必须在维护法治的同时防止这种事的发生。法治、公民自由和公民权利——这些不是我们的负担。它们让我们变得更好。”


  这些改革——将情报侧与执法侧相结合——在反恐方面取得了巨大成功，帮助国家以统一战线对抗恐怖分子。`FBI` 制定了符合宪法和法律的程序，以访问并与其他机构共享情报，以便更好地“连接各个点”，并更好地理解恐怖主义威胁是如何快速演变的。改革、关注与警惕性的重新聚焦，以及
  `FBI` 内部新重点的结合也发挥了作用；自 9/11 以来，这种全政府的“全工具”式反恐方法多年来一直确保了美国人的安全。


  ## 网络犯罪的挑战


  然而，同样的问题正在网络犯罪领域发生——我们错误地将世界划分为网络情报和网络执法。当时，我在美国检察官办公室负责执法侧的办公桌前，我并不清楚信息共享问题到底有多严重，以及我到底错过了多少情报。随后，在
  2007 年 1 月，我转回司法部，担任计算机黑客攻击和知识产权犯罪的国家协调员。我终于开始看到情报的一面。


  而那时我第一次意识到中国是一个多么严重的问题。


