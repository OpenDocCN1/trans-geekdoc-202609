  ## 网络空间中的应对差距


  最初并不清楚政府是否应该做出反应。通常，在国家安全委员会（NSC）会议上，我们会围坐在桌旁，每个人或每个机构利用自己的专业知识列一份清单解释：“好的，根据我的法律授权，这些是我认为我们可以采取应对措施。”根据主题的不同，司法部可能会列出起诉行动，军方可能会解释应对的“动能”方案，外交部可能会解释可能的外交方案，而财政部则会讨论可能的制裁。随着索尼黑客攻击
  NSC 会议的进行，显而易见，我们在网络领域并没有那么多准备就绪的选项，也没有像对待恐怖主义那样的快速行动的节奏。这些事实对我来说并不算新闻——我们已经察觉到了应对差距，这在某种程度上也是我们已经在进行部门重组的原因——但这确实让其他机构措手不及。我们讨论了广泛的选项——其中一些在今天仍处于保密状态——但我们也对在这些情况下美国真正拥有的工具如此之少感到震惊。


  应对方案还呈现了两个世界的冲突；当决策者们问到：“*如果我们尝试干扰攻击，那会是什么样的？*”时，充满了挫败感。桌旁那些更具技术思维的人的回应听起来像是胡言乱语，他们列出了各种
  IP 地址、工具，以及听起来像“选择你的冒险”式的网络故事——*这个工具可以这样运作，那个工具可以那样运作或那样运作*。政策制定人员立刻跟不上对话的思路。他们习惯了他们能理解的具体方案——*轰炸这个目标，制裁这家公司，起诉那个人*。网络攻击没有提供任何这种确定性，对于一个连比特位（bit）和字节（byte）都不分的政策人员来说，没有任何选项可以翻译成人类语言。


  一些政府领导人想，我们是否可以简单地阻止朝鲜对索尼的攻击；莉莎·莫纳科（Lisa Monaco）和国家安全局（NSA）副局长里克·莱德特（Rick Ledgett）都知道这是不可能的。莱德特推辞了，随后莉莎捕捉到了政府内部对斯斯诺格登泄密事件仍未平复的情绪，开玩笑道：“和大家想的不一样，政府实际上并没有坐落在整个互联网之上。”


  ![](img/00006.jpeg)


  ## 黑客攻击的个人代价


  就在 12 月 8 日，也就是黑客明确他们的要求的那天——他们将攻击明确地指向朝鲜和电影《会面》（*The Interview*）——他们让这场企业攻击变成了个人攻击。“和平守护者”（Guardians
  of Peace）在网上发布了超过 5000 艾米·帕斯卡（Amy Pascal）的 Outlook 电子邮件，暴露了她生活中最的细节。除了帕斯卡私下对朋友、同事、演员和其他好莱坞业内人士说过的正面或负面言论，“和平守护者”的泄密还包含了她生活中平凡的秘密。Gawker
  网站翻阅泄露的邮件，汇总了一份艾米·帕斯卡所有的亚马逊购买清单。这是每个员工最糟糕的噩梦。媒体对于是否应该报道这些色情细节犹豫不决，但许多媒体确实报道了。


  ## 好莱坞的孤立反应


  泄露的邮件和升级的攻击让索尼处于孤立无援。好莱坞——以及整个美国企业界——不确定如何应对。乔治·克鲁尼（George Clooney）试图传阅一份支持索尼的请愿书，表示电影行业不会被攻击所吓倒。但事实是，好莱坞确实被吓倒了。金融行业在面对伊朗
  DDoS 攻击时团结在一起，而好莱坞却分崩离析。


  克鲁尼的团结请愿书遭遇了冷遇——没有其他制片厂头目、经纪人或行业高管公开出来支持索尼。克鲁尼和他的好莱坞经纪人布莱恩·劳（Bryan Lourd）写道：“这不仅仅是对索尼的攻击。它涉及到这个国家的每一个制片厂、每一个网络、每一个企业和每一个人……我们知道，现在向这些犯罪分子屈协将为任何威胁言论自由、隐私和个人自由的团体打开大门。”但没有人站在索尼、帕斯卡或林顿（Lynton）。克鲁尼说，这反映了其他制片厂和高管有多么担心自己可能是下一个。


  与此同时，《白宫风云》（*The West Wing*）和《社交网络》（*The Social Network*）的作家阿伦·索金（Aaron Sorkin）站为索尼辩护，他在
  12 月 14 日的《纽约时报》上写了一篇评论，认为媒体正在替黑客干活，通过竞相发表他们能找到的最尴尬的文件，来惩罚和削弱索尼及其高管。索金说，这些并不是典型的举报人泄密，因为在索尼泄露的文件中，没有任何犯罪、违规行为的迹象——甚至没有暗示——也没有任何指控发布泄密内容除了低俗八卦之外的任何意义。相反，黑客成功地将“尴尬”武器化了。这篇为《索尼黑客事件与黄色媒体》的文章道：“和平守护者只需要把球投过去，他们知道我们的媒体会将其射门得分。”





  这条警告在整个行业引发了恐慌蔓延。采访者取消了原定为演员和导演安排的宣传活动。全国各地的电影院都退出了这部喜剧片的放映——从原定举办首映的纽约影院开始。该国最大的五家电影院连锁全部宣布不放映该片——对他们来说，这纯粹是一项商业决定。假期电影季仍然是一一年中最重要的时期之一；连锁机构担心，如果人们认为恐怖分子可能会袭击当地的电影院，他们连没有争议的电影都会避而不见。


  尽管情报部门和国土安全部认为并没有所谓的“可靠”计划来袭击电影观众，但索尼整整一天后才意识到自己已经输掉了这场战斗。12 月 17 日，索尼宣布：“鉴于大多数发行方决定不上映电影《会面》（The
  Interview），我们决定不按原计划于 12 月 25 日进行院线发行。”


  然而，制片厂试图坚守立场：“索尼影视业遭受了一场针对我们员工、客户和业务的空所未有的犯罪袭击。攻击我们的人偷取了我们的知识产权、私人电子邮件以及敏感和专有材料，并试图摧毁我们的精神和士气——这一切显然是为了阻止一部他们不喜欢的电影上映。我们对这种压制电影发行的鲁莽行为深表悲哀，并在此过程中对我们的公司、员工和美国公众造成了损害。我们支持电影制作人员及其言论自由权利，并对这一结果感到非常失望。”


  没有发射任何一枪，一个外国就锁定了一部他们认为反感的大片，并推毁了其在美国境内的发行。


  尽管好莱坞许多人拒绝与索尼站在一起，但在公司撤回电影后，它遭到了广泛的谴责。贾德·阿帕托和吉米·坎梅尔等好莱坞之星对索尼和朝鲜进行了抨；坎梅尔在推特上写道：“这是一种不美国的懦夫行为，证实了恐怖主义行为并开创了一个可怕的先例。”演员罗伯·洛维表示：“哇。所有人都屈服了。黑客赢了。对他们来说是一个彻底而完全的胜利。哇。”但在索尼感到自己别无选择的时刻——那些指索尼“胆小了”的批评，在某种程度上是对电影行业运作方式的误解。他们需要一个分销商将电影带给公众——而传统的发行商无愿意承担这种风险。


  尽管当时没有人公开知道，索尼的迈克尔·林林顿（Michael Lynton）开始尝试另一种方式来让电影上映，我们也迅速开始了一系列电话会议，鼓励一些替代性的发行。在联邦调查局和白宫的幕后帮助和支持下，索尼最终改变了策略，宣布将按原定计划在圣诞前夜通过
  330 家独立电影院以及前所未有的新在线渠道发行《会面》，这些渠道包括了 Google、YouTube 以及一个定制网站 `seetheinterview.com`。


  网络事件转变为一个潜在的反恐问题，这推使了政府内部产生了一种新的紧迫感，立即澄清了我们内部的模糊性：*这一个国家安全问题吗？* 我们现在知道必须做出公开回应。这一威胁还澄清了政府内部另一个长期存在的网络争论：*你应该给受害者提供多少帮助？*
  提供援助引发了一个复杂的道德风险问题——如果你认为每次小偷闯进你的车都能得到补偿和弥补，那么锁门的动力又在哪里呢？我们总是试图在袭击后干预并援助受者的需求，与鼓励公司做好自己的明智防御工作之间寻求平衡。


  我不想陷入哲学问题中——我们没有时间了。攻击仍在逐天发生，我们需要制定方案。对于我们这些推动行动的人来说，我们得到了帮助，因为白宫希望在 12 月 19 日之前完成一切：总统要前往夏威夷度过年度圣诞假期，而且按照传统，他在出发前会举行一场罕见的大型新闻发布会。如果他要应对索尼黑客事件并谴责这些攻击，我们需要准备好归因。幸运的是，得于
  PLA（人民解放军）案件，我们已经处理了许多关于如何公开政府对特定黑客已知信息的棘手问题——而且令人放心的是，在我们之前发布细节时，天并没有塌下来。如果没有 PLA
  案件，我们永远无法满足如此紧迫的期限。


  ```

  images/00006.jpeg

  ```


  12 月 19 日，联邦调查局在一份九段话的声明中宣布朝鲜对此负责。“根据我们的调查，以及与其他美国政府部门和机构的紧密合作，联邦调查局现在有足够的信息得出，朝鲜政府对这些行为负责。”


  虽然我们支持公开，但我最初抵制使用联邦调查局作为做出归因的媒介；我认为这应该来自国家情报总局，反映该国情报人员的共识。在联邦调查局内部，对这种声明也有一些顾虑；对于联邦调查局来说，在没有刑事指控和起诉的情况下公开信息（他们有信心在法庭上支持这一点）是非常不常且重大的决定。许多局领导——接受过“排除合理怀疑”的刑事责任标准的训练——对情报世界可以接受的较低标准感到感到不。。然而，联邦调查局副局长马克·朱利亚亚诺（Mark
  Giuliano）坚认为，应该由局里告诉世界：美国人是正确的。


  “索尼是一家公司。它遭受了巨大的损害。它的员工面临着威胁。我对他们面临的担忧表示同情。话虽如此，是的，我认为他们犯了一个错误。”


  “我们不能拥有一个某个地方的独裁者可以在美国这里实施审查的社会。因为如果有人能恐吓人们不发布一部讽刺电影，想象一下当他们看到不喜欢的纪录片或不喜欢的新闻报道时会做什么。或者更糟，想象如果制片人、发行商和其他人开始自我审查，只因为他们不想冒犯某些可能需要被冒犯的敏感性。”




  在本周晚些时候，在接受 CNN 采访时，奥巴马总统并未将这次攻击定为“战争行为”。相反，他说：“认为这是一次代价高昂、非常昂贵的网络破坏行为……我们非常认真地对待这件事，并将做出对等的回应。”奥巴马试图定义朝鲜所做的行为，这清楚地表明了所有参与网络安全的人员在界定虚拟攻击如何转化为传统地缘政治世界方面，仍在持续挣扎。在某种程度上，我们在幕后让情况变得更加复杂：律师们警告说，总统如果称之为“战争行为”，可能会触发
  `Sony` 保险单中的某些条款，这意味着即使是随口使用这个词也会产生重大的财务影响。


  前 `CIA` 局长和 `NSA` 局长迈克尔·海登（Michael Hayden）将军回忆起那天总统的言论令他感到多么沮丧——他说他听到巴拉克·奥巴马提到“网络破坏”一词时，他愤怒地从家里的椅子上站了起来。*这是一个外国主国家对美国领土上的一家公司进行的攻击。*“这不是网络破坏，这是网络——……”海登开始惊呼。他记得自己没能说完那句话。*这是战争吗？还是犯罪吗？*
  年后，他说，他仍然无法满意地完成那句话——这证明了在我们身处这场 `Code War`（代码战争）时，我们传统的词汇量是多么有限。我不确定我是否对这句话有更好的结尾；我们称之为“国家安全事件”，但那是一个同样不完美的措辞`Code
  War` 挑战了我们对冲突的许多传统定义。


  然而，无论称呼如何，`Sony` 从朝鲜参与的公开声明中立即获了了处；它将公众对攻击的关注问题和叙事从嘲笑 `Sony` 转变为——理所当然——关注政府计划如何应对国家级攻击。这成为我们又一个例子，说明政府将这些攻击从阴影中带出来，并在外国对手试图伤害我们时直接且快速地面对他们是多么重要。公众表示了赏，目标公司也表示了赏。


  ![](img/00006.jpeg)


  在有限的发行中，《面面》（*The Interview*）院线收入了 610 万美元，数字版收入了约 4000 万美元——它在发布后的几天内被观看超过 200
  万次，并成为史上最畅销的数字电影，但将这部电影视为胜利是很的。在 `Sony` 计算应对攻击所花费的额外 4000 万美元之前，这部电影就已经亏损了。然而，公司强力反弹了：`Sony`
  的股价在攻击两个月后实际上上涨了。


  与此同时，朝鲜的黑客活动仍在继续：尽管我们忙于应对 `Sony` 的攻击时，当年 12 月的黑客还发起了网络钓鱼攻击，从韩国水核动力有限公司（Korea Hydro
  and Nuclear Power Co Ltd）盗取了文件，该公司负责韩国的 23 台核反应堆。被盗的文件也被发布到了网上。首尔首席检察官表示：“用于攻击核电站运营商的恶意代码在组成和工作方法上与朝鲜黑客使用的所谓的‘kimsuky’是一致的。”


  在年终新闻发布会上，奥巴马总统曾承诺：“他们[在 Sony 攻击中]造成了巨大损害，我们将做出回应。我们将做出对等的回，并在我们选择的时间、地点和方式进行回应。这不是我今天在新闻发布会上会宣布的内容。”他解释说，在幕后我们一直在制定“一系列方案”，但对这些方案可能是什么故意保持模糊。几天后，公众似乎看到美国正在反击：朝鲜通往更广泛互联网的小型门户遭受了持续的拒绝服务攻击。`Dyn
  Research` 网络分析总监道格·马多里（Doug Madory）在 12 月 22 日告诉 `Reuters`，“在过去的 24 小时内，朝鲜与外界的连接一直在下降，直到到目前他们已经完全离线了。”


  美国官员采取了数天的回避态度；务部发言人玛丽·哈夫（Marie Harf）表示：“我们不会公开讨论可能的应对方案的操作细节，”并补充说，随着美国实施对朝鲜的回应，“有些会被看到，有些可能不会被看到。”但我们政府内部知道那不是我们做的。网络上的黑客义警者聚集在一起，对朝鲜发起了自己的攻击——这本身就是不断演变的网络准则中的一个新变数，我们目睹了一个非国家行为者对一个国家对其对无关私营部门公司的攻击进行报复。


  政府主要的正式和公开回应出现在 1 月 2 日，当时对 `RGB` 实施了经济制裁，以及两家朝鲜公司——檀贸易公司（Korea Tangun Trading Corporation）和矿业贸易公司（Korea
  Mining Development Trading Corporation），它们协助了其非法武器计划。制裁还点出了该国 10 名领导人，包括 `RGB` 负责人金永哲（Kim
  Yong-chol）。


  在执行这些制裁的过程中，政府领导人意识到从一个层面来说，我们很幸运被朝鲜攻击。根据乔治·W·布什总统的第 13382 号行政命令（该命令用于制裁扩散大规模杀伤武器及其支持者），我们可以对该政权采取行动——但如果是另一个没有参与大规模杀伤武器扩散的国家，我们可能就没那么幸运了。与恐怖分子或核扩散者不同，没有涵盖网络活动的行政命令。这种缺口对于我们一些经常处理该问题的人来说是显而易见的，我们一直试图推动变革，却只看到变革在政府低层被蚕食。正如
  Lisa 所说，“Sony 清楚地表明我们需要把那些东西提起来并全力运转。”


  这一切都是为了制定可行的“网络威慑”，这正成为政府内部日益关注的话题。国家情报局长詹姆斯·克拉珀（James Clapper）所言：“网络空间是朝鲜的一个强大新领域，他们认为在那里可以以最小成本施加最大的影响力，最近的
  Sony 事件显示了他们拥有网络能力。”




  事实上，在索尼攻击事件发生前 10 天，美国国家情报局局詹姆斯·克拉珀（James Clapper）根据奥巴马总统的指示前往了朝鲜，成功营了两名被该政权质子的美国人；克拉珀在一次“异常紧张且不愉快”的
  12 道菜晚宴上，与他职级相当的朝鲜人民军陆军侦察总局局（RGB）首脑金勇胆将军进行了会面。这是十多年来美国代表团进入朝鲜的最高别别代表。据韩国媒体报道，金勇胆亲自批准了索尼攻击——这并不完全令人意外，因为如此备受关注的攻击无疑会经过高层审批——这引起了我们的注意：当他明知自己的战士正准备对美国发动史无前例的攻击时，几乎肯定还用海鲜、泡菜和啤酒招待了克拉珀。


  随后，莉莎（Lisa）利用索尼攻击事件推动了白宫内部的运作，成功在 2015 年的国情咨演中加入了要求规范这一流程的措辞。这一努力在 2015 年 2 月取得了成果，宣布成立了网络版的
  NCTC，该机构被称为网络威胁情报整合中心（CTIIC）。莉莎回忆道：“总统的这段表述意味着我们必须履行承诺，各机构之间也必须放下领地之争。这让我领导 CTIIC
  的讨论和开发工作变得稍微容易了一些。”


  # 第 8 章：黑藤


  索尼黑客事件引发了政府范围内为期数月的实施教训的热热努力，包括建立网络威胁情报整合中心，以确保白宫能够对未来的攻击做出快速评估。在私营部门，公司也认真对待了这一威胁。我们举办了一场顶级娱乐公司首席法律顾问的会议，讨论他们如何在网络安全和应对未来攻击方面开展合作。我在随后的采访中观察到：“我认为索尼黑客事件及其对对提高安全网络意识的贡献比任何其他单一事件都要大。从索尼事件中学到的教训改变了全国公司的董事做法，因为公司正在审视，在这个每个行业的每家公司都以前所未有的脆弱的世界里，它们是否已准备好应对。”


  2015 年 4 月 1 日，奥巴马总统签署了国家网络领域具有里程碑意义的进展，概述了该国可以对从事恶意网络活动的国家实施的制裁——此举旨在确保如果下一次网络攻击来自朝鲜以外的国家，我们能够迅速做出反应。指令被平淡地命名为第
  13694 号行政命令，“封锁从事重大恶意网络赋能活动的某些人的财产”，授权对美国认定的个人和实体实施制裁，这些个人和实体“对恶意网络赋能活动负责或共谋，且这些活动很可能对美国的国家安全、外交政策、经济健康或财务稳定构成重大威胁，或已做出了实质性贡献”。


  用俗话来说，这意味着我们可以开始惩罚中国、伊朗和俄罗斯在网络空间中的活动。我们已经积累了许多可以适用此类制裁的案件，并立即开始推动行使这些新权力。然而，政府花费了一年多才首次行使这些权力——时间长到让怀疑者们开始称之为“四洋节节命令”。


  中国特别开始意识到其行为必须改变。在我们提出解放军（PLA）诉案后，我们看到其在线活动几乎立地发生了转变。随着其黑客行为被公开，中国减少了以经济为目的的间谍活动。网络安全公司火眼（FireEye）在一份报告中总结道：“从
  2014 年中以来，我们看到位于中国的组织对美国及其他 25 国实体的入侵活动显著下降。我们怀疑这种行动的转变反映了正在进行的军事改革的影响、中国网络行动的暴露以及美国政府所采取的行动。”


  2014 年 12 月，正当政府内部挣扎应对索尼攻击时，中国首席互联网官员鲁伟来到了美国。在访问期间，他接受了马克·扎克伯格（Mark Zuckerberg）的陪同参观了
  Facebook 总部，并与杰夫·贝贝索斯（Jeff Bezos）和蒂姆·库克（Tim Cook）会了面——考虑到中国互联网守门人鲁伟提供的商业机会，他们在公开场合都露出了微笑。但他也在华盛顿与国家安全委员会的官员进行了紧张会谈。在乔治·华盛顿大学的一次公开演讲中，鲁伟表示，他认为中美在网络政策方面已成为“命运命运共同体”，他们应该遵循“共同规则”。


  鲁伟既是中国互联网的主要捍卫者，也是其主要的审查者。在 2015 年春节期间，他协助组织了一场奇异的“网络空间精神”庆祝活动，他在中国网信办的员工唱道互联网是“一束不朽的光芒，触动我们的心。。汇聚万物的生命力量”，并宣布中国是一个“网络大国——告诉世界，中国梦正在提升中国”。


  然而，尽管在鲁伟访问美国期间，中国仍在进行其为止最关键的一次窃取。


  ![](img/00006.jpeg)


  作为网络安全辩论走向何方的信号，奥巴马总统于 2015 年 1 月访问了联邦贸易委员会（该委员会位于宾夕法尼亚大道司法部仅隔几扇门），预告了他的网络议程，并讨论了一个日益核心的问题：保护美国人的身份信息和隐私。到
  2015 年，几乎每个月都会发生一次以前无法想象规模的数据泄露。美国人习惯了在某个零售商系统遭到破坏后通过邮件收到新信用卡。社会安全号码从未被设计为公共标识符，现在已成为太多公司在远程交易中识别身份的默认方式。


  “如果我们保持连接，我们需要受到保护，”奥巴马对聚集的 FTC 员工们说。他要求通过《消费者隐私权利法案》，并就何时告知美国人其个人数据被盗制定一个统一的国家标准。该立法草案在政府内部一直受到长期推动；我在布什政府时期也进行过类似的努力。正如奥巴马总统所说：“根据我们提议的新标准，公司必须在泄露后
  30 天内通知消费者。此外，我们还提议堵法律漏洞，以便追捕更多窃取并出售美国人身份的罪犯——即使他们是在海外实施。”





  到那时，身份盗窃已升至联邦贸易委员会（FTC）受理的消费者投诉首位——仅在 2014 年就有 33.2 万起，占美国消费者投诉总数的近七分之一。这是整体犯罪领域发生重大转变的一部分；正如非营利组织警察高管研究论坛（Police
  Executive Research Forum）后来解释的那样，传统的“犯罪”衡量标准并不一定能捕捉 21 世纪的现实。虽然街头犯罪和暴力犯罪正处于历史低位——我的家乡纽约市自我小时候以来犯罪率减少了近
  90%——但诸如汽车盗窃、入室抢抢劫等衡量指标，未能捕捉到日益令人沮丧的小额在线犯罪瘟疫。


  ## 数据库泄露时代


  大规模数据库泄露时代始于 2007 年，当时 TJ Maxx 报告有超过 9400 万账户被黑客盗取。这次黑客攻击发生在我参与司法部计算机黑客计划的早期，它为该领域的所有人员响了警钟，提醒他们作为常规业务实践生成海量数据库是危险的。这家零售商花费了几个月才理清了这起窃案；最终他们意识到，盗窃从
  2005 年 7 月持续到了 2007 年 1 月。泄露涉及约 6500 万张 Visa 卡和 2900 万张 Mastercard；仅 Visa 一家就报告了欺诈损失超过
  8000 万美元。


  TJ Maxx 案标志着政府的一个转折点：在早期的信用卡泄露事件中，司法部支持保护企业的身份隐私，以防止客户在泄露后失去信任；而在本案中，司法部认为 TJ Maxx
  的名字应该是公开的。政府认定，这种难面泄露的完全公开化可能促使公司预先投入更好的安全措施。司法部辩论道：“大多数人想知道他们的信用卡或借记卡号码何时可能面临风险，而不仅仅是在它们被明确盗取之后才知道是否被盗取。如果卡持有人知道自己的信用卡或借记卡信息面临风险，他们就会感到担心，这为公司提供了动力，让他们投入到客户所要求的保护中。透明度让市场在这个领域得以运作。”TJ
  Maxx 案是一个艰难的决定；我从不确定哪种激励更有效——我们的回应是鼓励还是阻碍了其他公司主动站出来？


  ### 汹涌的啸


  然而，大规模泄露的浪潮已经到临；每一年都会带来更多。在 2013 年假期期间，Target 遭遇了超过 1 亿张信用卡被盗——这次泄露导致了其首席信息官和首席执行官丢了工作。次年，Home
  Depot 看到 5600 万个账户遭到破坏。


  尽管许多公司针对客户和潜在客户建立了海量数据库，但仍有很多公司没有意识到这些数据实际上有多脆弱。公司在泄露后发给客户的警告信已成为美国生活的常态。正如史蒂文·查宾斯基（Steven
  Chabinsky）开玩笑说的：“与某些收到这些信的人聊天时说‘我们遭受了数据泄露；您的个人身份信息可能已被任何人获取，我们将支付信用监控费用’，事实是公司发送这些信的成本真的在降低，因为收件人在三封信之前已经从别人那里收到了信用监控了。”


  我花了无数小时与私立公司讨论加强其内部安全——与首席执行官、首席信息官和总法顾问会面讨论锁定客户数据库、仅保留最少必要的数据等。在与私营部门交流时，我已经一套说辞，演示对我来说几乎是背倒成章。然后我们收到了一个提醒，说明了为什么保持谦逊总是好的：事实证明，政府自己对自己的数据考虑得不够聪明。我们将面临两个我曾向私营部门反复陈述的教训：第一，虽然组织参与网络安全基本的“防御与拦截”至关重要，但没有任何一个连接互联网的系统能够完全抵御专业且持续的敌人的攻击。


  ### 公共部门的脆弱性


  首先，虽然组织参与网络安全基本的“防御与拦截”至关重要，但没有任何一个连接互联网的系统能够完全抵御专业且持续的敌人的攻击。


  ```

  images/00006.jpeg

  ```


  事实证明，中国人在日常生活数字化如何将互联网变成间谍活动的丰富宝库方面非常有创意。2015 年 1 月 26 日，一家健康公司的系统管理员注意到他的计算机账户反复查询一个内部数据库——有人进入了系统内部。警报响起，Anthem
  迅速联系 FBI 寻求帮助。潜在的暴露范围是巨大的：Anthem 在美国并非家喻户晓的名字，但自 20 世纪 40 年代以来，它已从一家小型互助公司成长为美国第二大医疗保险公司。


  该公司——像过去十年中的许多公司一样——早已与数据泄露作斗：在 2009 年和 2010 年，该公司用于跟踪申请的网站门户进行例行升级时导致了暴露。门户生成的网页
  URL 可以很容易更改以调出其他客户的申请信息。当时，公司解释说安全漏洞源于第三方供应商，并表示客户的机密信息主要被寻求发起集体诉讼的律师所访问。尽管健康和医疗公司对客户拥有独特且敏感的信息——尽管有越来越多的医疗保健公司成为目标——但该行业在适应新数字环境方面仍然挣扎。在我们看到的许多被迫转型数字行业中，这种现象是普遍的；技术超出了这些行业的核心竞争力，而政府尚未明确风险。然而，客户显然理解其中的利：“没有哪一个地方比你的医疗保险公司拥有更多关于你的信息，”一位客户说，“那是绝对最私密的层级信息，一直到社会安全号。那是我最不希望有人获取权限的地方。”


  2015 年 1 月发现的这次泄露被证明是前所未有的。尽管 Anthem 的泄露本身不涉及任何医疗数据，但它包含了 7800 万人口几乎所有的个人细节：姓名、电子邮件、地址、社会安全号、出生日期，甚至就业信息和家庭收入数据。当时，Anthem
  的消息震惊了整个行业。“这是我见过最糟糕的泄露之一，”隐私权利倡导保罗·斯蒂芬斯（Paul Stephens）告诉《纽约时报》，“这些黑客知道自己在做什么，并意识到这里有一个宝库。”






  # Anthem 攻击事件与数据漏洞


  Anthem 攻击利用了一个相对基础的安全漏洞：Anthem 没有对其客户数据库进行加密。这种缺乏加密的情况当时非常普遍。许多公司构建了复杂的防火墙和网络防护，但一旦有人进入系统，就会让自己的数据处于加密状态。这等同于银行锁上了大门，却让内部的金库敞开。物理世界的安全反映了分层防御的方法，但在数字世界，公司往往只筑起了一道外墙。


  虽然政府要求公司在数据“传输”过程中对其进行加密以防拦截或窃听，但根据《健康保险流通与与责任法案》（`HIPAA`），当时的联邦数据法律和指南并未要求公司对“静态地数据”进行加密。指南仅规定，如果健康保险公司认为这样做是“合理且适当的”，则是是建议的，但将这一解释权留给了公司——许多公司因为这会给日常用户增加复杂性而避免了加密。


  在司法部，我们长期以来鼓励公司加密敏感数据。这种保护可以产生巨大影响：在 2014 年摩根大通泄露事件中，记录被泄露的 830 万人仅有非财务信息被盗，如姓名和地址等基础信息，这些信息本身对黑客来说并不非常有用。银行在保护其核心秘密方面做得很好，将它们分开存储，以挫败那类攻击。


  ## 和解与神秘模式


  Anthem 随后与受影响的客户达成了集体诉讼和解；公司同意支付 1.15 亿美元，平均每位受影响客户 1.43 美元。公司在宣布和解时谨慎地表示：“Anthem
  不承认任何不当行为，也不承认任何个人因网络攻击遭受损害。”


  但那些监控黑客交易被盗信息的“暗网”的人注意到 Anthem 盗窃案中的某些异常之处：这些数据一旦被取走，从未出现在过网上。直到今天，安全专家指出，这些数据从未在黑客论坛上出售过，也没有出现过与盗窃案相关的身份欺诈案件，更没有其他表明泄露是犯罪组织所为的迹象。恰恰相反：有人偷走了有史上最丰富的数据库之一，而且显然从未尝试过公开使用它。


  这值得注意，因为健康记录通常被黑客认为是非常有利可图的：一份完整的健康记录在黑客论坛上可以卖 40 或 50 美元——这意味着 Anthem 数据库如果碎片出售，价值超过了
  30 亿美元。对于黑客来说，坐拥如此巨额的不法财富是不可能的——除非他们不是犯罪分子，而且他们追求某种比这更有价值的东西。


  ## 归属与国家行为者


  事实上，私营部门的研究将此次黑客和数据泄露追溯到一个以多种代号为人知的群体——黑藤蔓、深熊猫或第 13 组——正如 FBI 委婉的说法那样，他们“源自位于中国境内的基础设施”。正如
  FBI 解释的，虽然“被盗的[个人身份识别信息]已在其他情况下被用于针对或协助各种恶意活动，如金融欺诈……但 FBI 并不知该小组有此类活动。”


  指明攻击者对受害者来说意义重大，特别是在与受影响的客户或员工沟通时：如果一个国家是为了间谍目的而窃取你的数据，那么信用监控完全是浪费时间。身份识别还会影响关于攻击责任归属的公众叙事：如果你受到一个专注且复杂的国家的攻击，与被普通的网络犯罪集团攻破相比，公司的责任等级上会有所不同。


  ## 令人不安的模式


  Anthem 攻击符合一个令人不安的新兴模式。多年来，一个精明的黑客团队一直在吸取个人数据——这些数据消失在黑洞中。正如*彭博社*报道，另一家美国主要的健康保险公司最近也被中国黑客攻破——黑客有计划地进入了系统，首先是攻破了保险公司处理外国客户时所依赖的翻译网站，然后努力将恶意软件直接插入主网络。


  进入内部后，他们针对的是特定的目标，这些目标对情报目的有用：他们主要感兴趣的是一家从事先进武器系统的国防承包商的员工，这种类型的信息是一个国家在试图识别并招募可能的间谍时会感兴趣的。在撰写
  Anthem 攻击时，《彭博社》表示：“这次攻击似乎遵循一种外国人窃取医疗数据的模式，其目的是寻求进入特定群体（国防承包商、政府人员和其他）个人生活和电脑的途径。”


  ## 重新定义关键基础设施


  此类窃取行为引发了对大规模数据重要性的更广泛的反思；多年来，我们警告说“关键基础设施”是指事物和系统——电网、空中交通控制网络、水电大坝——但我们看到对手对我们本应更关注的更广泛领域产生了创造性的思考——在索尼攻击案中，是民主价值观；以及在像
  Anthem 这样的攻击中，对被盗数据和通信的武器化。在何种节点，普通数据会变成“关键基础设施”？人们是否能收集足够的数据来损害一个经济部门或破坏更广泛的商业生态系统？


  窃大量信息带来的国家安全威胁促使政府对企业数据库进行更具批判性的思考。一个冷门的政府小组，即美国外来投资审查委员会（`CFIUS`），长期以来对外国公司或政府对美国公司的并购收购进行监管，这些行为可能会影响美国的国家安全。`CFIUS`
  的历史可以追溯到福特政府，汇集了 16 个政府部门（包括司法部的国家安全局），负责审查可能影响国家安全的投资案件。


  在像 Anthem 泄露之类的事件发生之前，`CFIUS` 只关注“显而易见”的秘密：确保外国对美国公司的收购或合并不会过度地损害我们的国防工业基础、制造能力或关键政府系统的供应链。例如，在奥巴马政府时期，它曾强制一家中国公司出售四处离海军训练场太近的小风电场，原因是担心中国可能利用这些风力电机作为情报收集平台，监视海军对无人机系统的开发。然而，在这些泄露事件之后，我们推动
  `CFIUS` 从更广泛的视角审视国家安全风险，并在审查中考虑大规模数据的重要性，既要考虑个人身份识别信息库的敏感性，也要考虑大型数据库作为人工智能和机器学习等技术基石的潜力。作为保护美国免受下一代技术威胁的一部分，我们需要意识到可以从并不显而易见的大规模数据集中挖掘秘密。这种可能性在我们很快面对另一另一个比医疗保险公司更处于国家基础设施核心的数据库时，被证明是真实的：政府自己的数据。


  ![](img/00006.jpeg)






  人事管理局（OPM）是联邦政府的人力资源后勤部门，是一个拥有 5000 名员工的机构，负责从管理福利、处理休假和年假申请，到决定华盛顿特区的冬季雪暴是否需要关闭联邦机构的所有事务。该部门的工作极其关重要——这些决策影响着全国超过百万个家庭——但并不光鲜。OPM
  的大部分工作模式就像停留在 20 世纪 50 年代。


  ### 联邦官僚机构的挣扎


  整个政府范围内，联邦官僚机构多年一直在挣扎适应计算机化。我在联邦局工作期间亲身验过这些转型是多么复杂；罗伯特·穆勒（Robert Mueller）在 2001
  年接手时继承了一套过时的计算机系统——事实上，那套系统糟糕到无法在电子邮件中添加附件，而且在 9/11 事件后，该局必须通过 FedEx 将劫持者的照片副本寄往各个地区办事处——并花了多年时间试图建立一个更好的系统。第一次改造失败了，耗资数亿美元。


  OPM 的情况更为糟糕。2014 年，《华盛顿邮报》报道了关于匹兹堡郊外旧石灰岩矿的专题故事，那里有 600 名 OPM 员工在 28000 个文件柜之间的地下工作，每年完全手工处理
  10 万名退休人员的退休文件。该系统从 1977 年以来一直以此方式运行——尽管从 1981 年以来已花费了 1 亿美元试图对其进行更新。


  ### 泄露的发现


  2015 年 4 月 15 日，OPM 的一名 IT 承包布伦丹·索尔斯伯（Brendan Saulsbury）在检查通过该机构服务器的加密流量时，发现异异常：网络正在
  ping 通一个名为 `opmsecurity.org` 的网站，尽管名字叫这个，但它绝对不是官方的政府网站。索尔斯伯在负责其安全工作期间已成为 OPM 系统的专家——甚至在一年前的某次泄露响应中起过关键作用——该系统陈旧且不安全的性质让他感到恐惧。正如他后来所说的，OPM
  的网络“非常不安全，架构不安全”，而且充满了“大量的遗留基础设施”，使其难以保障安全。该机构的监察长和美国计算机应急响应小组（US-CERT，政府的计算机危机响应小组）对改进系统做出了许多建议，但进展甚微，OPM
  在网络安全支出方面的方面仍然严重落后于其他政府机构。


  索尔斯伯与同事一起使用恶意软件检测工具 `CylanceV` 追踪网络中的 ping 请求，发现它源于一个名为 `mcutil.dll` 的文件，该文件乍看是
  McAfee 安全系统使用的标准套件的一部分。但 OPM 并没有使用 McAfee 的软件。“我 100% 确定这是恶意软件，”索尔斯伯后来说道。当晚晚上 6
  点 53 分，OPM 发响了警报，告诉 US-CERT 称他们已在其网络上识别出四种恶意软件。


  ### 恶意软件分析


  其中一个恶意软件是一个被称为“Windows 凭据编辑器”（WCE）的文件，这是一种黑客工具，它的存在本身就代表了某种特别糟糕的迹象。虽然世界上许多计算机系统都存在恶意软件，但大多数是相对无害的——等同于存在于许多表面的正常菌体或细菌——并不一定意味着该系统被黑客专门针对。但正如一名
  Cylance 员工后来解释的那样，WCE 意味着更阴险的东西：“那通常是公开行为的迹象，意味着某个怀有恶意的人实际上正在试图实现某些目标，而不仅仅是一个可能被使用也可能未被使用的恶意文件。WCE
  64 不是凭空出现的。”


  ### “黑藤”黑客组织


  当调查人员仔细查看 `opmsecurity.org` 时，他们心沉了下去：该域名注册在史威漫画超级英雄美国队队长史蒂夫·罗杰斯（Steve Rogers）下。他们还发现了第二个伪造域名
  `opm-learning.org`，恶意软件正与之通信——而它注册在超级英雄钢铁侠托尼·斯塔（Tony Stark）下。


  这些虚构的注册代表了另一个坏迹象：黑藤（Black Vine）黑客组织那幽默的名片是使用复仇者超级英雄的别名来注册域名。黑藤团队经常使用一组独特的侵入工具，美国官员将其代号定为
  `COLD CUTS`。国防网络犯罪中心在一份非机密报告中解释道，“`COLD CUTS` 注册的域名与他们计划或已针对的组织的合法域名非常相似……这些域名被称为‘分身’（doppelganger）域名。通过对域名注册人数据的深入分析，[我们]已经识别出大约
  70 个分身域名，这些可能预示着 COLD CUTS 操作的潜在目标。”例如，Anthem 黑客攻击域名之一利用了公司之前的名称 Wellpoint，注册了 `Wellpoint.com`，乍一看看起来一模一样。


  无论谁是 `COLD CUTS` 手段的后，都是漫威漫画的忠实粉丝：我们在另一次攻击中注册的域名中，看到其注册在娜塔莎·罗曼诺夫（Natasha Romanoff，女黑客英雄的笔名）下，以及约翰·尼尔森（John
  Nelson，电影《钢铁侠》的曾获得奥斯卡提名的视觉特效大师）。在一次针对美国航空的黑客攻击中，一个域名（`united-airlines.net`）注册在詹姆斯·罗德斯（James
  Rhodes）下，他是钢铁侠电影中托尼·斯塔克的朋友。甚至还有一个域名仅仅注册在“迪拜大亨”（Dubai Tycoon）下，这是由 Wu-Tang 帮歌手 Ghostface
  Killah 在《钢铁侠》电影中扮演的一个短暂角色。


  ### 应对努力


  当政府调查人员看到 `opmsecurity.org` 域名最初注册的日期是 2014 年 4 月 25 日时，他们更加担心。OPM 在 2014 年春天就意识到了入侵，但他们进行了一次特别行动，认为这已经清理了系统中的外部人员。这证明了有人可能已经在政府的人员记录中潜伏了一年。


  4 月 17 日星期五，网络安全公司 Cylance 到达 OPM 并在网络上安装了其恶意软件检测系统。团队工作了周末以理清威胁并开始评估损失，在地下室储藏室建立了一个临时指挥部来对抗泄露。该公司的创始人斯图特·麦克卢卢（Stuart
  McClure）回忆道，“他们正遭受着严重的攻击。”另一名 Cylance 员工克里斯·库勒（Chris Coulter）回忆说，当他们激活恶意软件检测系统时，“直说，（安全系统）像圣诞树一样亮了起来。”OPM
  的情况非常危急——他们很快发现了黑客已经进入并得得成功的证据，定位了一个加密并压缩的文件堆，这些文件显然已被收集并从 OPM 网络中外泄了。库勒在周日早上给麦克卢卢发了邮件：“他们完蛋了。”




  总而言之，美国人事管理局（OPM）在其网络中发现了超过 2,000 种恶意软件，相当于每五台设备就对应一个恶意软件；其中只有大约十个是来自 Black Vine
  的高级恶意软件，即 PlugX——这是一种高级远程访问工具（RAT），允许黑客进入系统。黑客安装的 PlugX 变体允许他们记录击键、修改或复制文件、截取用户屏幕或录视频，并执行如注销用户或重启机器等基础网络管理任务；简而言之，它让攻击者对“[被感染的]系统拥有完全控制权”。


  然而，存在 PlugX 的系统已足以提供访问整个 OPM 网络的权限。OPM、其他联邦机构以及 CERT 危机小组的调查发现，Black Vine 的黑客在一年的时间里仔细地层层渗透了该系统。


  Black Vine 是一个臭名的高级持续性威胁（APT）组织，安全行业至少从 2012 年起就在关注它。除了对《复仇者联盟》的青睐外，它还以“水坑攻击”攻击而闻名——在这种攻击中，黑客控制目标可能使用的合法网站，例如其银行网站、喜爱的在线零售网站或业务合作伙伴的主页。攻击者会在该第三方网站上植入恶意软件，每当目标访问时，就会暴露目标自身的家庭网络或计算机。


  自从 Black Vine 作为一个有组织的威胁集团出现在安全行业的视野中以来，研究人员已在互联网上追踪了它们的踪迹。其目标始终是针对性的间谍活动，而非欺诈或财务盗窃。赛门信（Symantec）在的一份报告中宣布：“Black
  Vine 似乎拥有多种资源，使其能够在持续一段时间内进行多次同时攻击。这些资源包括开发定制恶意软件、获取零日漏洞利用以及攻击者拥有的基础设施。”其在线基础设施的至少部分追溯到一家名为天融信（Topsec）的中国网络安全公司，该公司最初是一家研究机构家，后来成长为该国最著名的安全公司之一——甚至举办了名为“天融杯”的年度黑客大赛。该公司的一半启动资金来自中国解放军（PLA）本身。


  ### 调查与泄露


  弄清楚 Black Vine 是如何进入 OPM 系统的是调查人员的首要任务之一。那个夏天，随着 Anthem 和 OPM 攻击全貌的清晰，安全行业拉响了警报。“游戏规则已经发生了巨大变化，如今市场上的所有组织都需要停下来，重新评估其运营的标准以及他们曾经认为充分的系统，”卡尔·赫伯格（Carl
  Herberger）说道，他曾处于伊朗 DDoS 攻击的前线，目前是网络安全公司 Radware 的安全解决方案副总裁。


  ![](img/00006.jpeg)


  正如调查人员后来确定的，几乎每个层级发生的级联失败最终导致了政府部分最有价值的数据被盗取。OPM 攻击最大的问题在于，这实际上是针对 OPM 的第二次攻击。


  2014 年 3 月 20 日，美国国土安全部（DHS）属下的 US-CERT 曾提醒 OPM 其网络遭到了入侵——政府的入侵检测系统实际上注意到数据正从 OPM
  的服务器外泄。在五天内，OPM 核实了这一恶意活动。黑客显然在寻找背景调查的文件，并在每天晚上 10 点后登录系统，此时大多数员工已经回家了。虽然 OPM 团队从未确定对手最初是如何攻破系统的，但发现第二次攻击的布伦丹·索尔斯伯（Brendan
  Saulsbury）能够对黑客的系统进行反向工程，实时观察来自“坐在键盘前的实际攻击者”的命令。几周来，他们眼看着对手在系统中搜寻，但黑客从未成功获取背景调查文件。到
  5 月份，OPM 官员变得紧张起来：他们看到攻击者在多个数据库管理员的每台电脑上都安装了“键盘记录器”——一种会记录这些计算机上每一次击键的恶意软件，如果不是
  OPM 在仔细观察，这几乎确保了攻击者将获得机构最核心的机密。


  ### “大爆炸”行动


  最后，OPM 认为已经收集了足够的情报，并充分了解了攻击者的手法、脚点和基础设施，于是采取行动一次清除对手的所有访问权限和基础设施——他们将这次行动命名为“大爆炸”（BIG
  BANG）。大爆炸经过了精心策划，包括更改管理员密码、为之前被破解的账户创建新账户、重置整个机构的密码，并将整个被渗透的系统下线。之后，OPM 和 DHS 进行了数周的密集检查，没有发现任何异常。OPM
  的系统管理员认为，他们有 95% 的概率已经删除了黑客对网络的访问。2014 年 6 月 22 日，DHS 认证：“没有新系统与已知的 C2 服务器通信；未观察到新的攻击者活动。”


  当时，OPM 宣传了其对该事件的处理，并向国会保证没有个人身份信息被盗。事实上，机构官员注意到，OPM 实际上太低调，不会成为决心攻击者的目标；它并不拥有国家安全机密。国会后来总结道：“考虑到早期攻击者接近调查系统及相关数据的程度，OPM
  应该发出警报，并将这次攻击识别为严重且具有潜在破坏性的先兆。”


  正如我们后来获知的，在“大爆炸”行动之前，攻击者就已经建立了一个 OPM 未知的新据点，并在 2014 年 5 月 7 日投放了新的恶意软件。直到第二天 4 月才完全被发现。在第二次攻击中，派往该机构的
  US-CERT 团队确定，Black Vine 的黑客使用了一种非常常见的方法访问 OPM，通过使用一家政府承包商（名为 apoint Government Solutions
  的公司）的凭据渗透系统，该公司帮助 OPM 执行许多联邦员工必须接受的基础背景调查。


  从那里开始，Black Vine 继续搜寻，破解了其他账户，获取日益强大的凭据，直到他们能够访问整个系统。一旦进入，他们获取权限的速度太快且太容易；政府在数据隔离和网络分段方面做得糟糕，未能限制突破某一区域的黑客获取更广泛的资源。此外，OPM
  没有实施双重身份验证等安全措施，如果实施了这些，仅凭用户名和密码破解系统几乎是不可能的。虽然双重身份验证是行业最佳实践，但许多组织抵制其增加的日常使用的复杂性——尽管国会后来指责
  OPM 没有使用双重身份验证，但国会山本身也没有使用这项技术。





  由于针对 OPM（人事管理局）的大部分攻击都是使用真实的用户凭据，因此区分哪些流量是真实的、哪些是恶意的异常困难。调查人员花费了一个月的时间六一组对 OPM 员工进行访谈，仅仅为了确定谁在何时合法地使用了他们的账户——通过大量的调查工作，他们识别出了某些在员工休假或未使用系统时的账户使用情况，这帮助调查人员拼凑出黑客是如何探索系统以及取走了什么。


  随后的分析显示，第一次大规模数据外泄发生在 2014 年七月四日周末，这意味着在第一次大规模数据窃取发生前，OPM 已经意识到被入侵了三个月。如果 OPM 利用这段窗口采取更快或更激进的行动——例如，强制用户实施双重身份验证——Black
  Vine 很有可能在国会所说的“犯下迄为止最严重的国家安全数字违规行为”之前就被阻挡。此外，尽管显然 OPM 在 2014 年被一个“复杂且持续的攻击者”盯上，但直到
  2015 年 4 月发现第二次入侵后，OPM 才安装了预防性的网络威胁跟踪软件。这种监控软件——一项本可以提供多层防御的投资（假设网络外墙可能被攻破，但有助于捕获并限制系统内部此类暴露）——能够轻松检测到调用
  `opmsecurity.org` 等伪造域名的 `PlugX` 恶意软件。


  随着时间的移，OPM 最终确定 Black Vine 黑客成功外泄了三个独立的数据集——所有这些对美国政府都产生了毁灭性的长期影响。黑客盗了数百万联邦员工的人员档案——从姓名和地址等基本细节，到退伍军人的服务情况、医疗保险信息和工资记录等详细信息。


  然而，从情报和反间报的角度来看，另外两类信息更有价值：黑客获取了 560 万份美国政府人员的指纹，这在未来几十年内他们环球旅行时，是识别情报人员和潜在间谍的有力工具。Black
  Vine 还获取了 `SF-86` 表格的答案，这是一份由敏感职位的人员为了获得安全审查而填写的 127 页表格。填写完成的表格对于外国势力来说是一座宝库：地址、职业、商业活动和家庭成员，以及过去的关系、非法药物使用、酒精使用、犯罪记录、财务状况、心理健康问题、旅行历史，以及这个人见过的每一个外国官员。它们是个人弱点和缺点的路线图，有助于招募情报资产——也是外国势力绘制家庭成员、朋友甚至海外联系人和可能对招募或监视有用的外国关系的有力工具。入侵后，一位前美国国家安全局（NSA）官员表示：“这是皇冠上的宝石材料……是外国情报机构的金矿。”正如国家情报总监詹姆斯·克拉珀（James
  Clapper）后来写道：“我们从一开始就几乎知道中国情报负责了这次窃取，其反间报的影响是惊人的，不仅是因为他们拥有了什么，还是因为他们没有拥有什么。OPM 没有对所有情报共同体成员进行安全审查，任何有能力渗透其系统的人都会知道
  OPM 为哪些机构和部门进行调查，而对哪些没有。因此，他们也可以开始对那些他们没有档案的已审查人员的掩护做出假设。”


  对克拉珀来说，OPM 被入侵指示了网络攻击的发展方向。在他看来，黑客影响信息三种截然不同的方式：第一，他们可以破坏`机密性`，获取私人信息并将其公开；第二，他们可以改变其`可用性`，就像
  DDoS 攻击那样，阻止人们访问银行账户等所需信息。OPM 预警了新的第三种恐惧：黑客可能开始篡改数据的`完整性`。“一个拥有中国那样的技能、技术和持续性的攻击性网络组织可以改变我们的数据本身，而无需采取任何如外泄数据或阻止我们访问数据那样显而易见的，”他后来写道，“我敦促人们想象一下，如果中国真的改变了人们的安全审查背景调查结果，可能会导致怎样的混乱。”


  OPM 的被窃取发生在不同的时期，显示了攻击者的耐心和执着。2014 年 7 月和 8 月，Black Vine 获取了安全审查的背景调查文件；接着在 12 月，Black
  Vine 盗取了人事记录；最后在 2015 年 3 月底的第三次大规模外泄中，他们获取了所有的指纹数据。三周后，OPM 意识到自己已被入侵。


  詹姆斯·克拉珀后来在华盛顿的一次活动中评价道：“你必须在某种程度上对中国人的所作所为致敬。”然后他补充道：“你知道的，如果我们有机会那那样，我不认为我们会犹豫一秒。”他的评论反映了这场塑造国际在线行为规范斗争中的核心紧张关系之一：我们希望惩罚中国的经济间谍活动的原因之一，是为了为为了商业利益的国家资助间谍活动（大多数国家不这样做也不支持这种行为）与其他国际法承认的、作为地缘政治格局常规部分的其他类型传统间谍活动之间划定界限。


  ![](img/00006.jpeg)





  此次泄露事件表明，与那些被我们不断责备并劝说其更认真对待数据泄露的私营公司相比，我们的准备工作并没有好到哪去去。首先，我们没有制定计划，也没有针对韧性和应急响应做好充分准备。一旦你转变了“不是是否会发生，而是何时会发生”的心态，组织的关注重点就需要包含一个针对“爆炸后”的计划，即泄露发生后会发生什么。虽然我们经常举办桌面演习来应对如飓风和恐怖袭击等事件，但我们从未与联邦机构共同演练过数据泄露的应急响应——即在泄露发生第二天该做什么。这是一个错误，且我们在今后的工作中予以了纠正。


  虽然我们经常听到私营部门抱怨政府与他们共享的信息不够，但 `OPM` 泄露事件清楚地表明，反过来也是如此——政府并没有一套定义的系统来利用来自私营部门的信息来防御自己。2014
  年秋季，一家安全公司发布了一份共同审查中国情报间谍活动的报告（该 APT 组织使用了一个行业代号，即 `Axiom Threat Actor Group`），报告中特别提到黑客似乎正在针对政府人员文件。更令人担忧的是，安全公司
  `ThreatConnect` 在 2015 年 2 月对 `Anthem` 黑客攻击的分析中实际上发布过，域名 `opm-learning.org` 已注册给了可疑的
  `Tony Stark`，但没有记录显示政府有人查看过该报告并将可疑域名通报给 `OPM` 本身。正如 `ThreatConnect` 当时所，“该域名的事实是……”




  当最初的回应尘埃落定——即处理了系统需求和受害者需求后——我们的对话转向了如何应对中国的成功攻击。恰当的回应是什么？2014 年 `PLA` 的起诉从未打算是孤立的；我们打算将其作为一系列行动中的一步，向中国持续传达信息：在他们的网络行为改变、我们停止看到数据被盗以援助经济竞争对手之前，我们将继续采取行动。然而，`OPM`
  泄露事件似乎代表了一个更传统的国家级间谍案例，而作为政府，我们对可用的应对工具非常熟悉——从被称为 `démarches` 的正式外交抗议，到驱逐嫌疑间谍，以及在可能的情况下提起的刑事间谍指控。`OPM`
  泄露事件还提供了一个利用`Obama`总统新行政命令的机会，允许美国对参与恶意网络活动的国家或实体实施制裁。


  在 `PLA` 案件发生一年后，我们知道，尽管某些政府内部发出了核心警告，称如果我们起诉中国军官，天空将会崩塌，但中国并没有破坏整个超级大国关系。事实上，该案证明对我们的最初目标非常有帮助——塑造中国的在线行为并鼓励建立一套明确的规范。我曾想象这需要比单一刑事案件多得多，但事实上，中国的反应很快。正如我们一直想象的那样，中国将其经济间谍活动——像所有间谍活动一样——视为一种成本效益分析。通过我们的起诉，我们改变了方程的一侧。


  在 2015 年期间，随着美国政府持续外交压力，中国政府开始进一步重新评估该方程式。通过中美联合经济委员会等小组的会议和交流，国家安全顾问 `Susan Rice`
  和国务卿 `Tony Blinken` 等政府领导不断重复，中国的网络行为必须改变。`Xi`总统计划于秋季在华盛顿对`Obama`总统进行首次国访问，网络安全无疑将成为议程。`Obama`在
  2013 年于加利福尼亚的 `Sunnylands` 会晤中敦促过这个问题，但进展并不大——中国继续否认他们参与了国家支持的黑客活动。


  2015 年 8 月，《华盛顿邮报》发表文章警告，美国政府正准备使用 4 月 1 日行政命令允许的制裁对中国的黑客行为进行打击。正如 `Ellen Nakashima`
  报道：“美国政府尚未决定是否发布这些制裁，但预计很快就会做出最终决定——可能在未来两周内。”49 到 9 月，网络问题已升至地缘政治议程的首位。该月初，`Obama`总统在向一群商业领袖讲话时说：“我们正在准备若干措施，向中方表明，这不仅仅是我们感到轻微不快的问题，而是如果不解决，将对双边关系造成巨大压力的问题。我们准备好采取一些反制行动来引起他们的关注。”50


  公开和私下的警告都传达给了中方。在`Xi`的访问计划开始前几天，他们派遣了一个由高级特使组成的大代表团前往华盛顿。“中方看到，在`Xi`的首次国访问之前，他们正面临着一个巨大的潜在尴尬，”`Luke
  Dembosky` 回忆道，“他们必须给网络问题这个气球放放气。”


  对话包括`DHS`部长 `Jeh Johnson` 和白宫网络安全协调员 `Michael Daniel`，对话从一个坚定的信息开始：*别费劲否认这是你们的典型行为了。让我们越过去吧。*
  但对话进展并不顺利。那是几天紧张、生硬的对话，几乎没有进展。最后，在周五晚上，也就是中国代表团计划回国的前一晚，中方致电白宫进行最后一轮谈判。“我正准备好回家，结果在
  6:30 接到一个电话：‘你能在 8 点赶到白宫吗？’”`Luke Dembosky` 回忆道。


  最后，小小组在华盛顿的 `Woodley Park` 一家酒店会面，因为时间已经太晚，无法安排进入白宫；来自白宫、司法部、`DHS` 和国务院的助手等人与规模大得多的中国代表团讨论了一整晚夜，所有人都意识到中方有赶上早晨
  7:30 回国航班的最后期限。“这是我参与过的最有建设性的对话之一。在短暂的时刻，天人合一。他们对于做正确的事情非常有动力，”`Luke` 回忆道。到早上，他们已经达成了一项协议，供两国总统稍后在华盛顿签署。


  在 9 月期间，中国还首次——在境内逮捕了一系列黑客。51 我们辩论了此举是真正的打击还是仅仅为了地缘政治上的为了面子。`Xi`总统在访问开始时接受《华尔街日报》采访时表示：“非常重视网络安全。中国也是黑客攻击的受害者。中国政府不参与任何形式的商业秘密窃取，也不任何方式鼓励或支持中国公司从事此类活动。商业秘密的网络窃取和针对政府网络的黑客攻击都是违法行为；此类行为属于犯罪，应根据法律和相关国际公约进行处罚。中美两国在网络安全方面有共同关注。我们准备好就这个问题与美方加强合作。”52
  他的言论时机有点奇怪：第二天早上，仍在努力处理数据泄露事件的`OPM`宣布又有超过 500 万条指纹记录被盗。


  最后，我们迎来了大事件。2015 年 9 月 25 日，两国领导——美国总统`Barack Obama` 和中国总统`Xi Jinping`举行私人会晤，延续了前一晚在白宫对面的总统宾馆
  `Blair House` 晚餐期间开始的对话。当`Obama`向媒体简报会议情况时，他表示自己“再次对针对美国公司和美国公民日益增长的网络威胁表达了非常严肃的关注。我指出这必须停止。美国政府不为了商业利益从事网络间谍活动。”随后，总统在玫瑰花园宣布了一项我们从未想过会听到的消息：“今天，我可以宣布，两国在未来的道路上达成了共识。我们同意，美国和中国政府都不会进行或知情支持利用网络技术的知识产权窃取，包括为了商业利益窃取贸易秘密或其他机密商业信息。此外，我们将与其他国家共同努力，促进网络空间适当行为的国际规则。”这是一份通过书面记录的协议，正如白宫关于此次访问的官方事实清单所言：“双方都致力于共同努力，进一步识别和促进国际社会中网络空间国家行为的适当规范。”53
  这一突破后来得到了 G20 的认可。54




  这并不意味着中国黑客攻击就此结束——在未来的几个月里，我们继续看到中国对防御公司的攻击，以及针对四家半导体公司的攻击——但我们确实看到了中国行为的改变。我曾对这项协议持怀疑态度，但我错了。中国，至少在一个狭义定义的范围内，已经同意了一项新的网络空间准则。与他们的协议一致，他们很大程度上停止了为了中国竞争对手的直接经济利益而针对美国私人公司的国家支持黑客攻击。这确实是一个狭义定义——协议的确切边界可能定义得很窄——但他们确实在遵循一种新准则，在多年之后，这终于是一个真正进步的例子。


  *   遗憾的是，事实证明，该行政命令存在漏洞。它的目标是保护关键基础设施免受攻击——正如我们以前从未将电影公司视为关键基础设施一样，当奥巴马的行政命令首次被使用时，必须进行修订以包含一个新的攻击领域：我们国家的选举。


  *   陆小玮在 2018 年被开除党籍并被指控腐败。


  *   许多州也类似的通过了数据泄露通知要求。


  *   该和解强调了诉讼作为鼓励网络安全最佳实践工具的缺陷性；公司需要被鼓励投资保护其数据所必需的网络安全实践，但当数据泄露发生时，个人受害者很难证明必要的“损害”，以建立进行有意义的诉讼所需的诉格。


  *   事实证明，人事管理局（OPM）的数据——以及政府的所有数据——可能以纸质形式埋在旧的石灰岩矿山中更安全。


  *   该攻击的名称源于一种掠食者在沙漠水坑旁等待的类比，它们知道猎物早晚会出现。


  *   数据隔离和分段网络也让了解对手想要的目标变得更容易。


  # 第 9 章：假新闻


  当我们在 2015 年春天政府内部忙于应对人事管理局的数据泄露事件时，我们正经历着那个糟糕而可怕的春季，当时伊斯兰国（ISIL）本土化的、由互联网驱动的招募正处于巅峰——每一周都带来新的案例和令人担忧的线索。新的攻击似乎近在咫尺。起初，硅谷不愿将社交媒体上的恐怖分子视为问题——更不用说是他们需要解决的问题了。特别是推特（Twitter），似乎推卸了伊斯兰国招募人员和宣传人员每天如何使用其平台的任何责任；它显然不想站在那个立场阻止他们。


  伊斯兰国在线上的推特扩音器淹没了该公司的反应能力——启动新账户的非正式性和便利性正让恐怖分子利用了该系统。尽管推特于封禁了此类账户，但巨大的数量仍有数百个账户未被触及。任何被封禁的人都可以轻松开设新账户。“美国同情者在推特上特别活跃，他们在那里发发地创建，”研究员西马斯·休斯（Seamus
  Hughes）和洛森佐·维迪诺（Lorenzo Vidino）在研究伊斯兰国的使用情况后写道。很清楚，如果恐怖分子能够如此轻易地绕过封禁，那么硅谷并没有将其最出色的智慧应用于打击极端主义。


  休斯和维迪诺追踪了线上三种不同类型的伊斯兰国支持者。第一是`nodes`（节点），在线互动的主要驱动者，他们为伊斯兰国的跟随者提供新素材。第二是`amplifiers`（放大器），有时是真人，有时是自动机器人，他们主要在网上转发和传播素材。第三是`shout-outs`（喊话者），研究人员意识到这是“一种独特的创新，对于在线场景的生存至关重要”。`shout-outs`提供了“很少实质性内容”，但通常拥有最大的粉丝量，因为它们代表了类似于其他账户的在线目录，在“伊斯兰国推特社区的韧性中发挥了关键作用。这些封禁已成为一种荣誉勋章，也是追求者增强其声望或合法性的手段。在大多数封禁案例中，新账户会在几小时内创建。”


  鼓励在线言论自由对美国政府来说是一个具有真正挑战性的领域；我们既想保护美国人，又支持全球范围内的言论自由。我们可以在美国体系下捕获罪犯的工具，也可以被那些不认同我们价值观海外政府用来捕获他们定义为“罪犯”的人，例如人权活动人士、记者和政治对手。国务院甚至帮助资助了在线匿名工具的开发，使海外活动人士能够更容易发声而无须报复的风险，尽管同样的工具可能被儿童捕猎者和恐怖分子采用以掩盖他们的通信。如果我们作为政府支持在线言论自由，我们就必须支持所有的言论自由。


  然而，我们知道我们需要让科技公司成为打击极端主义战斗中更强大的伙伴。2016 年 1 月，白宫和情报官员前往硅谷敦促更多行动。随后在 2 月，国务卿约翰·克里（John
  Kerry）前往洛杉矶与娱乐行业进行交流。我们的努力在某种程度上起了作用：推特在该月同意关闭 12.5 万个与伊斯兰国相关的账户。





  为了秉持创新精神，我们在 2016 年 2 月下旬在司法部举行了一次会议，我与国家反恐主义中心主任尼克·拉斯拉斯曼（Nick Rasmussen）共同主持。这次会议聚集了来自`Apple`、`Twitter`、`Snapchat`和`Facebook`等科技公司的人士；麦迪逊大道广告商和`Edelman`等公关公司；非营利团体；甚至还有记者以及娱乐和好莱坞高管。尼克感谢这一小组在对抗
  ISIS（ISIL）方面付出了更积极的努力：“我们在社交媒体平台上看到了更激进的取缔行动，这真的是件非常好的事情。”⁵](#part0018.html#en523en)随后，尼克和其他政府领导人（如美国首席技术官梅根·史密斯
  Megan Smith 以及国家安全委员会的代表）试图解释我们所观察到的威胁：恐怖分子是如何利用社交媒体服务的；他们正在投放哪种广告。我们觉得必须有某种方法利用聚集在房间里的集体人才，帮助我们的青少年不被海外恐怖分子剥削并变成人体自制炸弹（IED）。我们展示了一段视频，描绘了一个恐怖分子在中东给孩子们发棉花糖——这是
  ISIS 想要传达的关于其在中东控制领土生活的良性、温暖且温馨的形象示例。


  在为期五小时的会议期间，我们解释说，如果目标受众是不满的青少年，我们知道美国政府将是世界上最糟糕的信使——我们需要政府外部智库的帮助，在这一领域进行反向宣传。有人将这次会议戏称为“麦迪逊谷伍德”（Madison
  Valleywood）峰会，这进一步证明了政府在品牌营销方面一无是处。我们要解决这个问题，就需要在我们聚集的群体中通过组合进行合作。虽然美国政府在信息传递方面可能不是世界最好，但西方作为一个整体无疑是世界上最精明的广告商。


  对话非常引入胜；我听到了各种对我来说全新的概念，包括关于针对特定人口统计数据的精准定位的信息。一位负责为海军陆战队（Marines）设计招募活动的参与者谈到了他们如何使用与恐怖组织类似的主题来针对非常相似的人群——例如，向年轻人强调归属感的重要性。好莱坞和麦迪逊大道的参与者帮助我们分析了为什么恐怖分子的材料如此具有吸引力——分析了其中涉及的技巧、柔光镜、摄像角度，甚至是视频角落里伊拉克和黎凡特伊斯兰国一贯的品牌标识，就像电视频频道这样做一样。


  科技公司继续为那些具有真正挑战性的问题而苦恼，即如何在他们运营的许多管辖区和国家公平地应用这些举措；例如，`Google`和`Facebook`担心如果他们调整算法来隐藏来自
  ISIS 的内容，可能会产生什么后果，以及他们随后会收到来自渴望扼杀其他言论的非民主国家提出的哪些请求。⁶](#part0018.html#en524en)


  ![](img/00006.jpeg)


  ISIS 之所以在网上难以对付的原因之一是由于我们当时正在在线上与叙利亚冲突的多个方面进行斗争。随着 2016 年的开始，我们终于开始接近一群叙利亚独裁者的在线支持者，他们多年来一直困扰美国网站。


  当时，叙利亚冲突已经持续了多年。一群亲政权的黑客自称为“叙利亚电子军”（`Syrian Electronic Army`, `SEA`），并积极争夺网络空间，拒绝将其让给亲民主活动人士。最初，`SEA`的大部分努力不仅仅是为了营造一种对身处困境的独裁者巴沙尔·阿尔斯萨德（Bashar
  al-Assad）支持潮的假象。起初，他们最喜欢的媒介似乎是`Facebook`——在他们自己的`Facebook`页面上，`SEA`发布了一个关于如何在其他`Facebook`页面发布亲叙利亚评论的指南。最初，这些努力看起来确实来自真实的叙利亚人。正如研究马克斯·菲舍（Max
  Fisher）和贾德·凯勒（Jared Keller）指出的，“该小组的随机`Facebook`活动账户看起来都是真实的，且显示出的差异性足够，不太可能是大规模生成的。”⁷](#part0018.html#en525en)


  2011 年 5 月，黑客向白宫的`Facebook`页面灌入了亲叙利亚的信息，例如“我们爱巴沙尔·阿尔斯萨德，放过我们吧！”类似的行动在`ABC News`、美国财政部甚至奥普拉（Oprah）的`Facebook`页面上展开。⁸](#part0018.html#en526en)
  他们还对批评叙利亚政府的媒体发起了拒绝服务攻击。阿尔斯萨德本人在 2011 年 6 月赞扬了该小组，称：“电子军……在虚拟现实中是一支真正的军队。”⁹](#part0018.html#en527en)
  该小组与叙利亚政府的具体联系在公开范围内尚不清楚：尽管他们否认是政府力量，但如果你挖掘细节，该小组的网站`syrian-es.com`是由叙利亚计算机协会（Syrian
  Computer Society）注册的，该协会由他领导。


  无论关系如何，该小组都是公开支持阿尔斯德的：当《大西洋月》（*Atlantic*）发表关于一名活动人士被政权折磨的故事时，`SEA`要求支持者向杂志网站灌入批评，并解释说：“我们的责任向他们解释这些和平抗议的真相。”¹⁰](#part0018.html#en528en)
  他们最喜欢的策略之一是简单地发布尽管新闻报道该国家陷入混乱和内战，一切依然正常：“我住在叙利亚，停止撒谎，叙利亚什么事都没有发生。”¹¹](#part0018.html#en529en)


  `SEA`的努力并没有没有受到挑战：到 2011 年夏天和秋季，他们与黑客组织`Anonymous`发生了经常性的冲突，后者攻击并破坏了政权网站。`Anonymous`曾轮番骚扰阿拉伯之春的各国政府，一度试图向埃及学校传真维基解密（WikiLeaks）的文件副本，以便学生在街头传播这些信息。¹二](#part0018.html#en530en)


  2011 年 8 月 7 日，`Anonymous`黑入了叙利亚国防部，并为叙利亚军队和人民发布了一条信息：“致叙利亚人民：世界与你们一起反对巴沙尔·阿尔斯萨德的残暴政权。要知道时间和历史站在你们这一边——独裁者使用暴力是因为他们别无选择，他们越残暴就越脆弱。我们致敬你们在面对政权暴行时坚持非暴决心，钦佩你们追求正义而非单纯复仇的意愿。独裁者终将倒台，多亏你们的勇气，巴沙尔·阿尔斯萨德是下一个。”¹³](#part0018.html#en531en)





  叙利亚电子军（SEA）的行动从 Facebook 上的“制造草根运动”（通过协调一致的信息假装代表当地草根支持）转变为低级、且不复杂的网络破坏行为。2011 年
  9 月，一名 SEA 黑客入侵了哈佛大学网站并对其首页进行了涂改，发布了一张巴沙尔·阿萨萨德的照片以及一条信息：“叙利亚电子军曾在此留名”。下个月，他们入侵了*华盛顿邮报*的服务器，并在`live.washingtonpost.com`上发布了一篇由名为`Th3
  Pr0` 的人撰写的博客，称“被叙利亚电子军破解”。从那个秋天开始，他们还尝试对白宫员工进行鱼叉式网络钓鱼，使用 LinkedIn 请求和如 `whitehouse
  _online@hotmail.com` 等邮件。次年，他们升级了筹码：2012 年 8 月，他们访问了*路透社*的 Twitter 馈送和网站，发布了虚假推文以及一篇对叙利亚反叛组织首领的虚假采访，其声称在败给叙利亚军队后正撤部队从阿勒颇撤离。这是对即将发生情况的警告：随着叙利亚冲突的各方在网上争夺宣传战，新闻网站成为了
  SEA 最喜爱的目标之一。


  ### 路透社泄露事件


  *路透社*Twitter 的最初泄露似乎相对简单——密码被破解了。在某些方面，大型企业网站和社交媒体账号（无论是公司还是媒体机构）具有独特的脆弱性，因为它们往往规避了普通用户可以使用的双重身份验证：考虑到共享同一个社交媒体账号或登录名的人很多，且通常在不同的办公室、远程办公、甚至在不同的时区，依赖双重身份验证被认为太复杂了。


  然而，随着新闻机构在遭受攻击后加强了安全性，SEA 黑客变得更有创意，接触了新的攻击向量，持续令媒体公司感到惊讶。SEA 还扩大了目标，针对人权观察组织（HRW）的员工，这是一家对叙利亚在内战中行为持批评态度的非政府监督机构。他们发送了一封伪装成卡塔尔政府新闻稿的邮件，其中包含一个安装恶意软件的链接；黑客成功窃取了点击恶意链接员工的密码和用户名后，随后在
  HRW 自己的网站上发布了针对其工作的攻击。“你们所有的报告都是虚假的！！”SEA 在网上发帖道，“停止撒谎！！！”虽然这种攻击乍看似乎是骚扰性的破坏，但它可能会对
  HRW 记录叙利亚政权滥权行为产生寒蝉效应：由于其许多报告——包括在攻击发生前几天发布的一份记录该政权对平民使用集群弹的报告——都是基于硬核的调查报道，并依赖于仍在冲突区域的匿名消息源，SEA
  展示出的访问 HRW 平台的能力是为了发出一个明确的警告：*我们可以查出你们是谁*。SEA 并不仅仅想改变网上关于叙利亚内战的叙述——他们想要让反对派的声音沉默，并让人们在报道叙利亚之前有所三而后虑。


  ### 攻击升级


  我们曾多次尝试关闭 SEA 的网络基础设施——财政部利用其贸易制裁权力没收了七百个注册给叙利亚相关实体的域名，其中许多由叙利亚计算机协会注册——但这种努力仅引起了波澜。2013
  年 4 月，SEA 针对了美国公共广播电（NPR），成功欺骗员工点击一封可疑邮件，并在进入后涂改了 NPR 网站。当年春夏季，类似的攻击还袭击了 CNN、E!
  Online、*Daily Dot*、*纽约邮报*，甚至是讽刺新闻网站《洋洋葱》（The Onion）。


  对《洋洋葱》的攻击是 SEA 执着和复杂性的良好说明：一次针对员工的伪装成联合国人权委员会人员的邮件地址的大规模钓鱼攻击，其中包含一个看起来像*华盛顿邮报*文章的链接（该链接实际上指向一个由
  SEA 控制的站点：`http://hackedwordpress site.com/theonion.php`）。至少有一员工点击了它，并被要求输入其 Google
  密码。然后，一旦黑客获得了该员工 Gmail 账户的访问权限，他们从那个“受信任”的人那里重新发送了相同的信息，这促使更多员工点击链接并收集更多用户凭据。接着，当《洋洋葱》的员工意识到泄露并要求所有员工更改密码时，SEA
  黑客又发送了另一封邮件，伪装包含一个重置密码页的链接——从而欺骗了另外两名员工。《洋洋葱》在发现攻击后开始发布嘲讽性文章，例如《叙利亚电子军在不可避免的死于叛军手中之前小乐了一会儿》，这进一步激怒了黑客，导致他们在
  SEA 的 Twitter 账户上发布了《洋洋葱》员工的邮箱。


  在此之前，攻击一直保持相对无害——虽然恼人，但实际上等同于难看且易修复的涂鸦。《洋洋葱》显然能够字面上对此付之一笑。


  ### 美联社事件


  2013 年 4 月 23 日，一些变化发生了：一封发送给美联社（AP）员工的鱼叉式钓鱼邮件让 SEA 黑客访问了这家电讯社的 Twitter 馈送。美联社表示，这是一封“伪装令人印象深刻的钓鱼邮件”，并指向了似乎出现在*路透社*或*华盛顿邮报*网站上的新闻报道。美联社的信息安全团队在下午
  12:12 钓鱼尝试发生后仅 17 分钟就迅速向员工发送了警告，但显然至少有一个人点击了它。


  美国东部时间下午 1:07，`@AP`向其两百万关注者发布了推文：“快讯：白宫发生两次爆炸，巴拉克·奥巴马受伤。”这份震惊的报告导致股市暴跌；在这一分钟内，道琼工业平均指数下跌了
  1%——蒸发了 1360 亿美元的市场价值。美联社仅花了几分钟纠正了报告，解释称已被破解，股市随即回升。这次黑客促使 NPR 记者安迪·卡文（他擅长通过社交媒体在线报道阿拉伯之春）发问：“破坏者什么时候会变成网络恐怖分子？”


  ### 结论


  到 2013 夏天，SEA 变得更有创意了——针对支持新闻网站的 IT 基础设施，并在一次针对了一家运行域名的澳大利亚公司。在获得系统管理员的凭据后，黑客迅速将《纽约时报》和《赫布布邮》等网站重定向到其他
  SEA 网站。随后，他们对 Vice 网站采取了同样的操作，将该新闻文化网站的游客重定向到 SEA 控制的网站。在另一次攻击中，黑客针对了美国海军陆队的招募网站，对其涂改并鼓励海军陆队“拒绝命令”。


  在国家安全部，这个案例对我们来说是一个早期示例，且是一个明确的例子，展示了我们后来定义为“虚假新闻”的现象可能带来的损害——即通过网络操纵操控信息来引发特定的反应和情绪。然而，尽管
  SEA 在戏弄全球一些知名度最高的新闻机构，甚至当其作剧升级到影响市场的事件时，网上没有人知道 SEA 到底是谁。




  最终，通过法院对各种搜查令的批准，我们成功将一个与名为 `ThePro` 的 `SEA` 黑客相关的电子邮件地址追踪到了一个特定的手机号码。该账户所有者曾电子邮件发送过其个人身份证明文件的副本——这些文件清楚地显示其人为
  22 岁的 `Ahmad Umar Agha`——他甚至在一次特定的鱼叉式钓鱼活动中，以 `theprosea` 为名注册了 `LinkedIn` 账户，并使用了与
  `Gmail` 邮箱相同的 IP 地址。我们还拼凑出了另一位领先的 `SEA` 黑客 `Firas Dardar` 的身份，他今年 27 岁，以 `The Shadow`
  的名义在线。


  在其他的 `SEA` 黑客攻击和鱼叉式钓鱼行动中，类似的证据不断堆积；我们反复看到相同的 IP 地址和相同的电子邮箱地址。我们甚至从他们的搜索历史中看到，他们搜索并阅读了关于自己黑客攻击的新闻文章。


  此案还引导我们走向了一些新的方向，这些方向比针对社交媒体账户的高知名攻击不那么公开：事实证明，据称具有意识形态的“叙利亚电子军”（Syrian Electronic
  Army）——据称是为了防御 `Bashar al-Assad` 政权——也利用其黑客活动来中饱自己。


  我们揭露了另一个居住在德国的 36 岁叙利亚人 `Peter Romar` 如何在 `Facebook` 上联系 `Th3 Pr0` 并主动提供帮助，表明他作为黑客的专业知识，并请求协助对`沙特阿拉伯`、`卡塔尔`和`土耳其`发动攻击。`Dardar`
  和 `Romar` 随后合作执行勒诈计划，帮助资金流入他们自己，害了国际上至少 14 家公司，并向受害者索要了超过 50 万美元以放弃对其系统的攻击。


  最终，我们对他们针对首批受害者之一的攻击提起了指控，那是对一家拥有美国服务器的中国游戏公司的勒索尝试。`Dardar` 在 2013 年夏天入侵了该公司的系统，随后向公司发送电子邮件，要求付款，“否则
  / 我会做[原文错误]一些你不喜欢的事。”公司付了他 500 美元，但他仍然坚持纠缠，指出“其他漏洞”并要求额外付款；公司继续向他付钱。


  最后，在 2013 年 11 月，他们试图切断他的资金——他大惊失措，要求支付 5 万欧元，他他将该金额降至 1.5 万欧元。另一项针对一家英国公司的类似计划为他们赚取了约
  16,000 欧元。在另一个计划中，他将受害公司的网站重定向到他自己的域名，域名上显示有一条解释网站已被“黑客”的消息。被劫持的网站写道：“我告诉过你们[脏话]别[脏话]惹我，现在去像小婊子一样哭吧，你和你的[脏话]CEO，你们所有的数据都下载了，其中一个已经被卖掉了。”最终，公司同意支付
  5,000 欧元，`SEA` 黑客试图通过德国的 `Romar` 洗白受害公司的勒索款，因为叙利亚的制裁使得美国和其他西方国家访问全球银行系统变得异常困难。我们也看到他们在其他公司身上实施了同样类型的诈骗，成功率不一。此案是我们频繁看到的混合威胁危险性的一个例子：主流、正直的公司——主流、正直的公司。





  俄罗斯攻击我们并不完全令人意外。自弗拉基米尔·普京重返权力中心以来，他采取了日益激进的立场。在广泛的问题上，从脱欧投票到欧洲民族主义政党的兴起，再到俄罗斯对 2016
  年选举的攻击，普京在指导俄罗斯进行干预时遵循着单一策略：破坏西方民主国家，并削弱俄罗斯认为反对其未来的多边联盟——从`NATO`到`European Union`，更不用说他认为威胁俄罗斯利益的国际机构，例如互联网本身。经过数十年的冷战，俄罗斯在尝试利用西方民主国家的缝隙和系统性漏洞方面拥有经验。正如英国情报机构`GCHQ`的前主管罗伯特·汉尼根（Robert
  Hannigan）所说，“俄罗斯一直利用民主的开放性来对付我们。”


  ### 对外交官的骚扰

  普京的努力包括一场针对美国外交官的史所未有的骚扰活动。美国国务院外交官维多利亚·诺兰（Victoria Nuland）曾目睹自己的电话被拦截并在网上泄露，而驻俄美国大使迈克尔·麦福尔（Michael
  McFaul）在普京重掌权力同年抵达莫斯科，他遭到了政府资助抗议者的骚扰。美国国际开发署被完全赶逐出该国。正如麦福尔后来写道：“骚扰并不局限于我的直接安全团队和我本人。任何在大使馆工作的人都可能成为目标。他们划破了我一名初级工作人员的轮胎。他们闯入大使馆员工的家中，往往只是重新摆放家具或打开所有的灯，让人们知道他们是脆弱的。”


  ### 局势紧张的升级与网络战争

  在 2014 年索契奥运会之后，随着俄罗斯随后入侵克里米亚以及在乌克兰东部的动荡性攻击（包括击落马来西亚航空 17 号班机，导致 283 名乘客和 15 名机组人员死亡），紧张局势持续上升。俄罗斯对此类事件的反应始终如一：无论其有罪证据多么确凿，他们都完全否认任何参与，转而在领域内充斥虚假声明和阴谋论。


  在网上，俄罗斯的行为在`GameOver`和`Yahoo`黑客事件后的多年里也变得更加恶化并更具挑衅性；俄罗斯对乌克兰的影子战争对乌克兰的基础设施进行了广泛且破坏性的网络攻击。


  ### 拟议的应对策略

  虽然关于 2016 年最后几个月俄罗斯攻击选举的演变过程我们仍有许多细节无法讨论，但可以说，我相信一种与我们过去十年一直在制定的剧本一致的应对方案：“这些攻击不应该在阴影中发生。我们应该公开攻击的归因，并利用政府的各种手段，包括外交谴责和其他制裁等工具来做出应对——就像我们以前被中国、伊朗和朝鲜针对时所的那样。”


  ### 内部警觉与不确定性

  在政府内部，随着活动的展开以及有关俄罗斯对我们选举的多方面攻击的警告接踵而至，我们感到日益增长的震惊。正如特别检察官罗伯特·穆勒（Robert Mueller）后来在对
  12 名俄罗斯军事情报官员的指控中重构的那样，政府黑客针对了民主党和克林顿竞选官员，以及全国各地的州和地方投票基础设施。正如莉莎·莫纳科（Lisa Monaco）回忆的，政府内部云旋的问题和担忧主要围绕着对政府未知之事的真实担忧。“我们意识到我们正在玩一场不同的游戏，我们曾以为我们处理的是与总统选举相关的常规间谍活动程序，”白宫网络协调员迈克尔·丹尼尔（Michael
  Daniel）后来告诉`60 Minutes`。“我们一直工作的假设是，我们没有检测到正在发生的所有潜在俄罗斯活动。”大多数州级针对目标的报告似乎是例行的扫描和探测，但还有什么被漏掉了呢？我们看到的是全景吗——还是仅仅透过吸管观察？俄罗斯人是否成功进入了美国政府未发现的某处投票数据库？他们是否修改了我们所不知的投票机器？他们是否在某处更改了直到选举日才会被发现的选民注册？“你总是担心冲突升级，但这种感觉不一样，因为我们有一个必须度过的特定日期，”莉莎回忆道，“我们担心这场选举是否能顺利举行。”


  副总统拜登（Joe Biden）回忆道，整个问题“棘手极了。现在很容易说‘哦，也许我们本应该说得更多’。”但在当时，整个政府都是不确定的。正如拜登所说，“总统和我坐在那里，字面上就是在`[President’s
  Daily Brief]`之后，所有人都离开了房间，然后说：‘我们到底该怎么办？’‘现在，总统先生，你出去单方面地宣布这是正在发生的事情，在这种环境下，你会被指控为——试图影响选举。除非你能提供比我们现在更强有力的数据，否则你将处境一个糟糕的境地，而且这会进一步削弱我们选举进程的合法性’”


  ### 行动性困境

  到 2016 年，我们已经直接并公开地对抗了所面临的其他三个主要外国敌手——中国、伊朗和朝鲜，但我们还没有对俄罗斯采取任何公开行动。（`Yahoo`的起诉书直到
  2017 年春季才公开。）这提供了一个重要机会，公开俄罗斯网络上的非法活动，并部署我们在其他案例中开发的工具，从刑事起诉到贸易制裁。我们想要采取行动。


  莉莎认为我们应该遵循我们正在制定的剧本：收集是谁所做的证据，将其公开，并决定适当的震慑反应。政府内部其他许多人对选举前采取任何公开步骤持谨慎态度，尽管奥巴马总统私下与弗拉基米尔·普京讨论了这一问题，中情局局长约翰·布伦南（John
  Brennan）也私下向他在俄罗斯`FSB`的对应人员提出了抱怨。


  公开对抗俄罗斯面临着正当风险：其一，对抗可能会鼓励他们采取更具挑衅性的行动，也许试图扰乱投票过程本身。另一方面，如果他们的目标是分裂美国并让美国人质疑其选举的合法性，那么公开俄罗斯的努力实际上可能有助于这一目标的实现。为此，政府认为未来的最佳路线是让其所采取的任何行动都具有跨党派性——邀请国会山之的共和党领袖参与任何谴责和应对工作。然而，参议院多数党领袖米奇·麦康纳（Mitch
  McConnell）否决了此类尝试。





  莉莎·莫纳科（Lisa Monaco）向我讲述了 2016 年 9 月 8 日那场关键会议。尽管她是奥巴马任命的白宫官员，但她是一名职业司法部检察官，是我见过的最不政治化、最无党派的官员之一，她负责的领域是协调国土安全工作，也做到了无党派的极致。


  据她描述，莉莎当天与科米（Comey）以及国土安全部长杰赫·约翰逊（Jeh Johnson）前往国会山山，向 12 位国会主要政党和情报部门首脑简报了现有证据以及俄罗斯正在进行的攻击。当时政府尚未发布过任何一份公开声明。他们详细阐述了俄罗斯的威胁，并请求国会以跨党、统一的声音反对这一攻击，以确保各州在网络安全方面的合作。国土安全部可以帮助各州加强网络安全，但这必须是跨派的，这样州长们才不会觉得自己是在踏区行冰。在简报期间，她说，麦康奈（McConnell）击败了任何跨党合作的尝试。事实上，他质疑证据是否真的支持了俄罗斯正在攻击选举的警告，并指责情报首脑们是党派工具。“你们这些情报人员不应该让自己被利用，”麦康奈说。


  会议迅速恶化为一场党派斗争。政府官员们垂头丧地离开了。莉莎回忆道：“这是我在政府期间最沮丧的一天。”她并不是唯一的：詹姆斯·克拉珀（James Clapper）回忆起了自己对那场令人失望会议的反应：“我感到失望但并不意外。看来[议长保罗·莱恩和麦康奈]当时已经决定不在乎提名人是谁、他是如何当选的，或者外国势力影响我们的选举会对国家产生什么影响，只要他们赢了就行。”


  白宫办公厅主任丹尼斯·麦多纳（Denis McDonough）后来回忆道：“总统在椭圆形办公室的一场跨党会议上邀请那四位首脑加入他，要求各州与我们合作[保障选举安全]。那份声明花了三个星期才定下来，内容被大幅削水了。”


  直到选举之后，美国政府才采取了更有力的行动。12 月 29 日，奥巴马总统宣布驱逐俄罗斯外交官，并对被认为参与了攻击的俄罗斯安全和情报机构、私营公司以及少数俄罗斯高级网络官员进行制裁。他使用了我们在索尼攻击事件后建立的制裁机制。政府致力于将制裁定位为谴责俄罗斯作为一个流氓国家在网络上全方位的行动，并成功推动将诸如叶夫根尼·博格切夫（Evgeniy
  Bogachev）等人纳入其中——此人罪犯转变为情报人员，负责过 GameOver Zeus 僵尸网络。选举攻击虽然具有独特的挑衅性和有效性，但对于我们这些观察了过去十年网络空间演变的人来说，这仅仅是普京网络侵略长久故事中的另一个章节。


  在我离开政府后的那一年，凸显了俄罗斯是网络上一个独特危险的对手。2017 年春天，俄罗斯释放了名为“NotPetya”的勒索软件，这是一场针对乌克兰的攻击，但其超出了俄罗斯的控制，导致各公司遭受大规模混乱，包括货运巨头（FedEx，损失
  3 亿美元）、制药巨头默克（Merck，损失 3.1 亿美元）以及广告代理公司 WPP（损失 1500 万美元）。仅货运巨头马士基（Maersk）就因为 NotPetya
  更换了 45000 台电脑和 4000 台服务器。白宫网络安全协调员罗布·乔伊斯（Rob Joyce）说：“我们看到俄罗斯在当地持续冲突中对乌克兰发起了无差别攻击。他们使用的是一种在黑暗中发射的网络武器，击中了大量公司、个人，并对我们的经济造成了损害，它停止了运输……它从字面上关闭了[公司]……这是不可接受的。”


  如果俄罗斯庇护导致 FedEx 损失 3 亿美元的恐怖分子，或者俄罗斯政府攻击了 FedEx 的运输枢纽，我们的报复将是迅速且果断的。网络空间也必须如此。


  ### 俄罗斯是网络上独特危险的对手


  同样在 2017 年春天，FBI 联合西班牙警方抓获了俄罗斯黑客彼得·列夫沙绍夫（Peter Levashov）——互联网历史上最臭名的垃圾邮件发送者之一，他在俄罗斯居住多年后在国外度假期间。还有许多像列夫沙绍夫这样的黑客等待抓捕。如果你看现在的通缉名单，你会发现一连串俄罗斯黑客。其中还有博格切夫，除了受到制裁外，悬赏他的赏金高达
  30 万美元；以及列克谢·贝兰（Alexsey Belan），他是因三起独立的网络犯罪罪被起诉的罪犯，最近还与两名参与盗取雅虎十亿用户账户的联邦安全局官员一起被起。普京允许这些在线市场的存在，并保护其领导免受刑事起诉——更糟糕的是，正如贝兰和博格切夫的情况那样，招募罪犯作为情报资产，以帮助俄罗斯政府进行进一步的盗窃和间谍活动。不安的事实是，博格切夫俄罗斯网络罪犯——包括攻击我们选举的人——远在美国的触及范围之外。美国政府对俄罗斯划坚定的边界至关重要。我们不能允许弗拉基米·普京破坏我们其他人的互联网。如果他不采取行动防止其国内庇护的人对网络社区造成即刻损害，世界其他国家必须共同采取行动。2016
  年选举的教训之一显而易见：善意的人得到了错误的结果。从事后看，我们没有实现威慑俄罗斯的目标。每位专家都认为，俄罗斯认为其对 2016 年选举的攻击是成功的。在我们改变今后的这种计算方式之前，他们会再次尝试——其他人也会考虑这样做。展望未来，我们必须确保他们确实遭到了威慑。





  我们应当假定我们会对这类攻击进行报复，无论谁遭受了攻击，无论是谁在提供帮助，而且应对方案应该预先规定——由情报部门、白宫和国会领导层共同通过。对任何候选人或政党的攻击都是对整个国家的攻击。这种响应应该从预先规划一个无党派的程序开始，该程序依赖于职业政府情报人员和分析师，他们的职业生涯一直致力于对外国意图得出结论——然后依靠美国已经拥有的工具来做出应对。应该将“裁量权”这一因素排除在外。我们需要为我们的选举系统建立类似于“死人开关”（Dead
  Man’s Switch）的机制。


  像国家情报委员会（NIC）这样的机构（负责发布共识国家情报评估的职业分析师小组），可以被预先指定分析外国行为者是否试图干预选举——无论是通过虚假信息攻势、黑进候选人或政党，还是对选举基础设施的实际攻击。然后，在特定日期——例如全国大选前的
  100 天——该团队和情报部门有义务向国会报告他们是否目击了任何的外国干预，如果以后检测到干预，则发布第二份报告。如果 NIC 以“高度可靠”的发现外国大国（俄罗斯或其他任何国家）正试图影响选举或破坏对选举的信任，它应该尽快将该报告提交给国会。即使无法详细说明外国对手产生了什么精确影响，但为了保护情报来源和方法，美国人应该获得有关民主进程神圣性和安全的更好的实时信息。


  这种分析和结论应该完全脱离政治任命官员，正如司法部传统上在做出有关政治腐败案件的敏感决策时会听从职业人员和检察官的意见，以避免产生利益冲突的迹象。林德赛·格拉姆参员从北约条约第五条中获得灵感（该条款将对一个国家的攻击视为对整个联盟的攻击），呼吁预先达成跨党共识，“对一个政党的攻击是对所有人的攻击”。


  这种无党派报告应自动触发响应，让任何未来的总统能够像詹姆斯·克拉珀（James Clapper）说的那样，避免被指控“在选举尺度上加手脚”。对这类攻击的报复应该预先规定——一份由情报部门、白宫和国会领导层同意的选项清单——这将将利用过去十年用于威慑和影响外国在网络空间恶意行为的许多工具。我们花费了十年时间概述并创建了一本应对这些攻击的剧本——包括公开谴责、国际制裁、驱逐外国外交官甚至提起刑事指控。此外，我们也可以并应该采用情报机构和军事部门开发的额外秘密手段。


  这个网络世界仍有很大程度上处于秘密，但我们需要将其带出阴影。正如奥巴马总统最终在国防大学发表演讲，概述了美国如何、在何地以及为何使用武装无人机打击——在对此类攻击成为美国反恐主义常用工具多年之后——我们需要总统或高级官员发表公开演讲，概述美国将如何、在何地以及为何使用进攻性和防御性的网络工具。


  我们在过去十年中实施的网络响应措施已经帮助塑造了朝鲜、中国和伊朗等敌手的行为——美国在未来应该更多地利用它们。毕竟，有一点是明确的：我们远未到达代码战争的终点。


  ### 结语


  # 赢得代码战争


  俄罗斯对我们民主价值观的攻击，并不是在我为政府工作的最后几周内面临的唯一网络威胁。我们还见证了全球范围内测量过的最大、最强大的互联网攻击的发生——这些攻击一直持续至今。利用不安全的家用设备的恶意网络——恒温器、数字录像机、安防摄像头和其他所谓的“物联网”设备——三名黑客组成了所谓的
  `Mirai` 僵尸网络，并用它攻击全球的网站，包括互联网本身的骨干基础设施，例如域名服务器公司 `Dyn`，这次攻击导致 2016 年 10 月一个周五下午美国东海岸几乎整个互联网运行变慢。这些
  `DDoS` 攻击比以往看到的任何攻击都要强大一个数量级——规模大到互联网公司没有办法缓解它们。一位参与响应的人员说：“没有足够的带宽足够大。”


  这种极具破坏性的力量——一个中断了全球数千万人互联网的势力——似乎很大程度上源于一群试图在 `Minecraft` 视频游戏中寻求优势的大学年龄玩家。然而，在写本文时，他们创建的
  `Mirai` 僵尸网络已经失控到远远创造者的控制范围，并在未来几年内将继续造成破坏。这样一个小群体就能无意中释放出如此具有破坏性（甚至可能是永久性的）在线力量，完美说明了我们的数字世界是多么脆弱。


  今天我们仍然处于代码战争的早期阶段，试图区分非对称威胁，并利用政府和私营部门的多种权力工具，建立一个共享我们价值观的国家和公司的国际联盟。当博格舍夫（Bogachev）帮助先驱这些时，勒索软件、僵尸网络和
  `DDoS` 攻击等犯罪战术是如此新颖，但现在已变得司所当然。


  2018 年 5 月，来自名为 `L0pht Heavy Industries` 的波士团体的四名黑客回到国会山，纪念他们首次参加那场网络安全国会听证会的 20
  周年。这一刻——正值对俄罗斯攻击 2016 年选举的调查持续进行——似乎标志着代码战争开端的结束。他们多年前预测的抽象威胁现在已成为美国生活的常态。乔·“头目”·格兰德（Joe
  “Kingpin” Grand）在雷本国会办公大楼 2237 会议室向座无虚席的观众道：“我们 20 年前所说的话几乎仍然成立。是的，确实有所改进，但问题的总体类型是一样的。”


  回到 1998 年，在 `L0pht` 首次登场时，正值互联网泡沫开始抬头，他们向充满怀疑的国会警告说，他们中的任何一个都能半小时内瘫痪互联网。虽然这四个人看起来都老了一些，技术世界也发生了巨大的变化（以他们最初
  1998 年听证会上可以想象和无法想象的方式发生），但他们的再次出现并没有带来多少希望。那时，“这一切似乎还只是理论上的——一个国家拥有一支像我们这样的团队，并且正在攻击美国，”克里斯·“池”·怀斯波尔（Chris
  “Weld Pond” Wysopal）说，“但我们都知道，20 年后这一直在发生。”





  如今的用户仍在犯着 `L0pht` 在 1998 年警告过的所有相同错误，从选择简单密码到不开启额外的安全功能——而且底层系统的安全性仍然太弱。Grand 引用了最近的新闻报道，称特朗普总统正在使用一部不安全的
  `iPhone` 进行通话和浏览 `Twitter`。“他基本上是在选择带着手机被黑客攻击的风险生活，因为他认为便利比安全更重要，”Grand 说道。“总统——这位可能是世界上最受攻击的人之一——竟然不想更换手机，这真的让你开始思考：‘还有人会这样做吗？他们为什么要这么做？’”Grand
  的评论直击核心，这也是我在讨论这一问题时反复强调的一个论点：网络安全不仅是政府或企业的挑战，它也是我们每个人以及我们整个社会的挑战。我们需要重新思考对互联网的接纳，以及我们的国家地缘政治战略和公司战略应当如何适应这些新威胁。


  那么接下来将会是什么？


  显而易见，这些威胁在短期内不会消失——事实上，网络安全在未来几年里可能会变得更糟，然后才会好。作为社会的一员，我们应该如何应对下一个`Code War`（代码战争）时代？


  互联网的活力体现在这些网络威胁的快速演变本质上——包括其执行者、动机和工具。政府和我们整个社会必须创造性地思考，如何在保持安全的同时，保留让互联网成为这一革命性发明的活力和开放性。加强防御将包括重新思考我们构建新技术的方法。


  尽管面前面临前所未有的挑战——尽管在前几页中解释了许多低调和高关注的时刻——但我们作为一个国家和一个社会的应对方法仍然是不够的。我们在上的行动仍然太慢了。我们继续落后于威胁。我们需要思考得更快、更明智，否则我们可能会面临互联网被阴险攻击者淹没的风险，以及我们社会和经济实力的耗尽；而这可能不仅是因为针对电网等的大规模基础设施攻击，还可能源于普通人因为对在线生活的恐惧和不信任而做出的不参与、不发声或不经决定。


  回到我之前关于我们像住在草屋里在线生活的类比——即使野狼已经逼近门口，我们不仅没有寻找更坚固的房子避难，反而继续向草屋里塞进越来越多的东西——应对今天的威胁既需要建造一座更坚固的房子（防御），也需要赶走野狼（进攻）。


  在防御方面，我们的社会在每个层面都需要改进网络安全教育，从企业的`C-suites` 到小学，正如前几代人我们作为一个社会致力于教人们成为汽车等其他新技术的负责使用者。正如特朗普总统的首任白宫网络安全协调员
  `Rob Joyce` 所说：“这归根结底在于做好基础。许多此类入侵可以通过处理安全方面的基础拦截和防御工作来解决。”


  用户在使用网站时需要变得更精明——并对自己的在线生活方式保持更高的警惕。公司和组织需要投入诸如“渗透测试”之类的培训和计划，以调查自身网络中的漏洞，并向用户展示哪些是不该做的。用户在使用网站时需要变得更精明——并对自己的在线生活方式保持更高的警惕。公司和组织需要投入诸如“渗透测试”之类的培训和计划，以调查自身网络中的漏洞，并向用户展示哪些是不该做的。


  为了打击网络钓鱼，用户在检查邮件发送者时需要比现在更加警惕；公司需要安全系统（例如双重身份验证），以确保一次错误的点击和一个密码就不会导致整个网络沦陷；而整个互联网需要采用新的协议，例如基于域名的邮件身份验证、报告和合规性
  (`DMARC`），这使得伪造他人域名变得不再可能，并确保如果邮件来自 `FBI.gov` 或 `BankofAmerica.com`，你就能确定它确实来自该机构。所有这些变化的发生，仅仅是为了打击网络钓鱼，而网络钓鱼本质上是最简单的网络攻击形式。





  # 日益增长的物联网安全威胁


  这些新的安全威胁已经出现。米镜之（Mirai）攻击将超过 250 万台设备连接成一个危险的僵尸网络，这仅是未来几年预计连接到互联网的物联网设备的一小部分。在 2016
  年，每天都有 550 万台此类设备连接到互联网——冰箱、无人机、机器人吸尘器、灯具、“智能”电视、医疗设备等。几乎所有设备过去和现在都是不安全的，容易受到攻击。例如，如果黑客的恶意软件坚持要求
  300 美元的赎金来解锁你的电脑，是一回事；但如果黑客坚持在奶奶的家用透析机重新启动之前支付 300 美元，那就是完全另一回事了。


  ## 智能设备的漏洞


  随着物联网设备涌入我们的生活，这些问题只会恶化。很多时候，我们生活中所谓的“智能”设备实际上是极其惊人的“愚蠢”且不安全的，具有默认密码和易被利用的漏洞。它们进入美国的家庭和企业时，而使用它们的人缺乏安全操作的知识。在某些情况下，这些故事看起来很有趣：2017
  年圣诞节后，《纽约时报》的一个报道关注了一个日益增长的现象，人们使用社区列表邮件来报告在用户失去控制后丢失或坠毁的无人机。报道中引用一位科技高管的话说：“我们正在看到曾经未来的科技与美国主流社会的汇合。”然而，这种公众的天真也有阴暗面：一个缺乏经验的用户不小心安装的恶意软件感染了两个整个英国医院，迫使它们关闭了三天，取消了数百次医疗手术，并将接收的创伤患者转到其他机构。


  ## 寻求设计安全


  展望未来，从长远来看，如果我们不承认并面对互联网的核心问题，就无法寻求解决网络安全问题：我们的数字生活建立在本质上设计极不安全的技术之上，这些工具的设计初从未考虑过安全性。互联网最初的设计和标准是为了易用而非安全，需要更新以关注设计安全，确保设备和系统不仅按预期运行，还能抵御寻求破坏的不法之徒侵害。


  ## 网络“登月计划”


  如果互联网将成为我们未来日常生活和经济的核心支柱，我们需要一个安全的系统——无论你想把它比作任何类比，比如网络“登月计划”或网络“曼哈顿计划”。我们需要高层次的社会承诺和研究努力，通过创新通向更安全的未来，这种未来将重新审视我们日常生活和基础设施的数字化，以及我们如何将任务关键的任务从今天的互联网中分离并解离开来。这几乎意味着要建立新的网络——实际上是新的互联网——为关键任务提供高水平的安全性和认证。在汽车收音机上播放
  Pandora 电台，不应该允许黑客访问车辆的刹车。我们必须——作为政府和作为消费者——迫使硅谷和私营部门改变安全观念，将安全视为产品初始设计的一部分，而不仅仅是发布后的清理过程（通过一次一个补丁或一次一个软件更新来解决）。


  ## 政府的角色


  政府在保障我们的在线生活方面必须发挥更强大、更明智的作用。我们需要继续——甚至加速——公开地应对网络安全问题，并对威胁保持透明，以便人们能更好地判断风险。司法部在过去十年中，我们的目标是将政府内部的默认模式从隐藏攻击变为将其公开。未来，这一领域仍有许多工作要做，要尽可能快地公开尽可能的信息，但这种转变将帮助公众更好地理解威胁。要看到“点名羞辱”方法的威力有多大，看看特任检察
  `Robert Mueller` 对 `GRU` 和 `互联网研究局` 因其对 2016 年选举的攻击进行的起诉即可。`Mueller` 的起诉书比任何事情都更有效地公开地概述并解释了俄罗斯如何攻击美国，为美国人提供了一个重要的窗口，让他们在特朗普总统在赫尔辛基与普京会面之前，了解政府的情报和理解。通过不懈地追踪事实、证明归属，然后将其公开，我们向公众明确我们的对手在网络上正在做什么——通过列出事实，我们可以帮助美国民众要求行动。


  同样，我们需要继续简化和优化政府对网络事件的响应。泄露报告应该是强制性的，以帮助政府和公众更好地理解风险。遗憾的是，国会和行政部门等政府实体在预测政策需求和采取前瞻策略方面并不有效；相反，它们对外部压力和要求的反应最好。提高网络风险的透明度将有助于塑造政府内部和私营部门对有效行动的需求。除非人们知道发生了什么，否则你无法推动行动（这也是写这本书的意义之一）。消费者应该更好地了解谁在使用他们的数据做什么什么，以及谁在重视安全。


  我们还应该让组织报告泄露和攻击变得简单——目前还没有一个一站式的 `cyber 911` 可以公司或组织拨打来报告泄露或攻击并寻求帮助。相反，正如我在建议面临网络安全问题的客户时发现的，人们通常需要拨打并与多达九个不同的机构合作来应对攻击——有些机构想帮助，但另一些则想惩罚。这种状况建立了一个困惑且复杂的系统，在公司和个人最需要帮助的时刻伤害了他们。





  我们必须以创造性和创新的思维思考下一代技术；美国在第一代互联网的兴起中占据主导地位，在经济和地缘政治方面都为我们的社会带来了巨大的利益。我们不能允许自己被中国或其他进步的经济体反超；政府的研发资金正在急剧下降，尽管我们拥有诸如美国外国投资委员会这样的实体，这些实体可以帮助防止外国公司和政府收购我们的领先公司并掠夺我们的技术，但在确保我们的公司和政府对下一代技术进步投入足够的资金方面，我们的关注却寥寥其微。


  然而，对于一个国家和个人而言，美国的安全将日益取决于我们是否能在从`GPS`技术到量子计算机再到人工智能的所有领域继续保持世界领先地位。虽然过去二十年中国的技术进步和经济增长在很大程度上受到被盗窃的美国知识产权的推动，但中国正越来越多地产出自己的创新。2018
  年 1 月，中国宣布完成了世界首个量子加密视频会议，这是中国与奥地利之间长达 75 分钟的对话，并受到了不可破解的加密技术的保护。3 中国的航天计划正准备向月球背面发射探测器，这是一项美国或苏联航天计划从未完成过的技术难题；而中国版本的`GPS`允许其卫星在广播位置信息的同时还可以广播文本，这是一个具有军事意义的进展。今天，我们在这场技术竞赛中开始失去阵地，部分原因是因为知识产权的盗窃，但也是因为我们对下一代经济的投入不足，以及我们如何积极阻碍那些想要来美国接受教育和创业的人——而这股人才浪潮一直是我们在数字时代经济成功的核心。


  这些挑战——以及我们的社会和技术为了适应新时代而需要改变和调整的无数其他方式——似乎是无法解决的问题，但事实并非：想想过去十年发生的惊人技术变革吧。在写作此时，距离`iPhone`被发明才刚刚过去十年。我们正处于一场社会行为革命的中间，这场革命在大小各方面上都在上演：我年轻的女儿第一次学读字时，她起初试着去滑动书上的书页。我们已经经历过的这种快速变化速度带了我对未来的希望——希望在未来的几年里，我们可以完成另一次社会转型，在恢复我们数字生活安全的同时，保留并扩大互联网在诞生之初承诺的自由与开放。凭借强大的国家意志，我相信我们可以通过创新解决这个问题，并为我女儿这一代保障互联网、数据和我们的生活方式。


  当我们最初开始面对网络安全的全部规模时，政府内部的重点是防御和加强我们自身的系统。但近年的经验告诉我们，防御是不够的。21 世纪的网络安全和社会安全需要成为风险管理练习。没有任何连接互联网的系统或设备是可以完全不受黑客攻击的。我们必须关注韧性，确保灾难可以被避免。


  将我们的房子重建得更安全只是解决方案的一部分。我们还需要进攻方面的努力。在遭受攻击后，政府需要查明是谁干的、为什么要这样做、以及是如何做的——然后施加对比例的后果。“代码战争”要求我们建立并领导一个共享我们价值观的国家和组织的国际联盟。与`NATO`不同（正如其名称——北大西洋条约组织所示，它不仅基于地理位置，也基于价值观），代码战争的全球联盟将需要每个洲的盟友，并要求我们将公共安全领域学到的教训与从公共卫生领域学到的关于如何应对和击败跨境问题的教训结合起来。




  伊朗起诉案、俄罗斯制裁、穆勒起诉案以及公开的归因分析，都标志着我们自 2014 年起控中国`PLA`黑客以来开始的工作又向前迈出了一步。在俄罗斯攻击总统大选之后，司法部强有力地应对了其所谓的“恶意的外国影响”威胁。“像恐怖主义和其他国家安全威胁一样，恶意的外国影响威胁需要所有政府机构采取统一的战略方法，”副司法检察长罗德·罗森斯坦（Rod
  Rosenstein）在 2018 年 7 月的一份演讲中说，“社会的其他部门也需要尽自己的份。州和地方政府必须确保其选举基础设施的安全。科技公司需要防止其平台被滥用。公职人员、活动和其他潜在受害者需要研究威胁并保护好自己和网络。公民也需要了解这一游戏规则。”⁶


  美国自诞生以来，从乔治·华盛顿时代起，一直代表着一组特定的价值观。在过去的一个世纪和冷战期间，使我们的国际领导力变得至关重要的，是因为我们利用实力（经济和政治实力）来造福世界——从击败法西斯主义到通过马歇尔计划重建欧洲，再向世界赠送互联网等技术，这些技术改变了地球每一个角落的经济机会。我们现在必须这样做，帮助世界走向更安全、更可靠的在线体验，将言论自由和贸易自由置于数字生活的中心。我们需要帮助领导并制定与我们的价值观一致的连贯规则和条例，规定个人数据在网上如何被用户使用、存储和控制——这些规则要让消费者充满信心，同时又不阻止人工智能和“大数据”时代等机会的兴起。这些规则需要成为全球标准。我们已经看到中国在面部识别和无处不在的视频监控系统方面取得了威尔式的进展，如果制定下一代技术规则的国家不分享我们对个人自由和表达的价值观及承诺，对美国将是不利的。


  今天，我们需要将这些价值观带入互联网，并确保它们为后世得以保留。我们不能允许中国和俄罗斯这两个不分享我们民主规范的国家为这个新世界制定规则。


  赢得代码战首先需要意识到战争已经开始。


  约翰·P·卡林（John P. Carlin）

  华盛顿特区

  2018 年 8 月


