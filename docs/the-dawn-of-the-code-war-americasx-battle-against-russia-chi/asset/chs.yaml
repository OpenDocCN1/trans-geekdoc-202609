- '# 代码战之黎明：美国对抗俄罗斯、中国及日益增长的全球网络威胁




























  # 序言


  致 Sarah、Sylvie 和 Roy；以及向保护我们的司法部男女们致敬


  # 引言 代码战争


  Hussain 代表了一种我们长期预见到将会到来的威胁——一个精通技术的恐怖分子，他利用现代数字工具将恐怖组织的影响扩大到其物理位置之外。2015 年夏天，他成功策划了我们见过的最具全球影响力的恐怖计划之一：这位巴基斯坦裔英国恐怖分子居住在叙利亚，招募了一名科索沃黑客，在马来西亚学习计算机科学，目的是对美国境内发动攻击。


  # 第一章 黑客的崛起


  根据 Hussain 在 2012 年的一次采访，他从 11 岁左右就开始黑客。在 ISIL 控制的叙利亚东部逃亡期间，Hussain 试图通过确保空袭不会他来保护他的继子。在我当时工作的司法部内部，Hussain
  的努力让他成为一个首要威胁。2015 年几乎每周都会出现一个由 Hussain 发起的新计划，FBI 的监控小组精疲力竭。我们从刑事任务中抽调了人员来补充反恐小组。政府内部的警报每天作响，但我们试图在公开场合淡化这种威胁。我们不想在他死后，将
  Hussain 提升为像奥萨马·本·拉丁那样的全球领袖，伊斯兰圣战扭曲意识形态的标杆。


  直到他去世，我们甚至不会在公开谈论他。


  # 第二章 评论


  2015 年，21 岁的 Hussain 知道自己是一个被盯上的猎物。在 ISIL 控制的叙利亚东部逃亡时，Hussain（最初在网上的名为 TriCk）表示，他开始黑客活动是因为他在玩一个在线游戏时被另一个黑客踢下线。“我想报复，所以开始在网上搜索如何黑客，”他解释道，“我加入了几个在线黑客论坛，阅读教程，从基础社会工程开始逐步提升。我没有得到报复，但我成了这个游戏里最受讨厌的黑客之一。”


