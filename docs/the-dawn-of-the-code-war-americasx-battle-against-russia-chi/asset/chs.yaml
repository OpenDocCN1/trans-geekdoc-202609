  这些问题并不是联邦调查局（FBI）单独面临的；在整个政府范围内，官员们都在应对网络威胁——以及这种威胁为针对海外敌对手带来的机遇。随着 2008 年的到来，布什政府在总结其留给下一任总统的事务时，网络安全已成为国家安全议程的首位。离任的国家情报局长迈克·麦康尔海军将（Admiral
  Mike McConnell）推动了一项行政命令，以重新组织和重新关注政府的网络安全工作。麦康尔曾在 20 世纪 90 年代领导过国家安全局（NSA），他于 2007
  年从私营部门回归政府，担任国家情报局长；该职位此前由约翰·内格罗庞特（John Negroponte）担任，是在 9/11 事件后设立的，旨在协调和管理美国 17
  个情报机构。作为他的首批重大努力之一，麦康尔在 2007 年 5 月提议并获得了布什总统的许可，授权国家安全局利用尖端网络武器和追踪技术对伊克的叛乱分子进行打击。大卫·佩特鲁斯将军（General
  David Petraeus）将网络进攻归功于美军在增兵期间取得“重大进展的首要原因”，这最终导致了“战场上消除了近 4000 名叛乱分子”。


  ### 本土的担忧


  但在日常工作中，麦康尔往往更担心敌对手在网络空间对美国所做的事情。在 2007 年 5 月的那次会议上，麦康尔主张认为网络安全已日益成为国家首要风险。那年早些时候，爱达荷国家实验室（Idaho
  National Laboratory）进行了一项可怕的实验——故意破解一台发电机并使其失控并自毁。在现实生活中，这种攻击可能导致电厂瘫痪数月；美国制造发电机的能力有限（大部分来自中国或印度），新机器通常需要
  18 个月或更长时间才能采购。在政府内部，我们争论了此类警告的公开程度：什么情况下让人们意识到此类威胁是必要且好的，而不仅仅是给我们的对手提供思路并恐吓民众？


  ### 圆形办公室简报


  在椭圆形办公室的会议上，麦康尔向总统强调了一种场景：如果 9/11 攻击者针对的是网络漏洞而非航空——例如删除股市的金融数据——会如何。布什转看向财政部长汉克·保尔森（Hank
  Paulson），询问这种场景是否可能：“汉克，迈克说的是真的吗？”


  “不仅是真的，”保尔森回答道，“当我掌管高盛时，正是这个场景一直让我彻夜难眠。”


  “迈克，”布什总统说，“这个问题是你带进来的。你有 30 天时间来解决它。”


  ### 备忘录技巧


  作为国家情报局长，麦康尔发明了一个巧妙的社交花招：他有时会在会议中从公文包里掏出一份备忘录递过桌子，以此向内阁秘书强调网络问题。正如记者弗德·卡普兰（Fred
  Kaplan）回忆道，麦康尔会说：“你上周写了这份备忘录。中国人从你的电脑破解了它。我们从他们的电脑上破解了。”这引起了内阁成员的注意，但我们仍在苦恼：下一步怎么办？


  ### 协调之路


  麦康尔的努力最终导致了政府最重大的进展之一：在国土安全部建立了一个与私营部门共享信息的中心。此外，它为参与该问题的每个机构和部门规划了明确的角色和赛道。


  2008 年 1 月，布什总统启动了被称为“全面国家倡议”（`CNCI`）的计划，旨在成熟政府处理网络空间的方法，既包括保护自身网络，也包括加强政府内部的协调。该文件部分写道：“美国必须保持对广泛国家目的的网络空间的访问和使用。互联网的日益普及带来了机遇，也带来了挑战。快速高效共享信息的能力使私营部门生产力、军事能力、情报分析和政府效率取得了巨大收益。相反，它也创造了必须解决的新漏洞。”


  ### 结构性改革


  新秩序明确了 FBI 的`NCIJF`将成为网络威胁调查的核心协调机构。在 2008 年春季期间的一段快速且密集的过程中，白宫和麦康尔推动了改革，确保各个情报机构能够更好地共享知识，值得注意的是，他们还致力于更好地协调
  FBI 和中央情报局（CIA）之间国外和国内情报的收集。修订还采纳了一个名为“国家情报”的新概念，该术语旨在涵盖政府范围内范围内信息。该命令有助于定义`12333`，这是一项里根时代的命令，作为情报界的章程，解释了`CIA`是海外人力情报的领先机构，`NSA`是海外信号情报的领先机构，而`FBI`是各类国内情报的领先机构。





  CNCI 与 12333 修订的共同努力标志着向开发“全工具”网络安全方法迈出了重要一步。这种“全工具”方法一直是反恐领域的关键进展之一：它认识到政府需要从整体上观察问题。为了解决问题或破坏威胁，有多种“胡萝卜大棒子”可用，从刑事起诉、移民执法、出口控制到外交或金融制裁，以及军事动力攻击。但为了用上这套完整的工具，政府需要快速共享信息，并确保每个人对威胁的定义和理解是一致的。在政府术语中，我们需要以速度和节奏共享情报，然后共同考虑：我们如何有创造性地破坏这一威胁？在
  9/11 事件后的多年里，当面对反恐方面的国家安全威胁时，我们在此类工作中已经相当老练——但在网络安全方面，我们仅仅触及冰角。


  ![](img/00006.jpeg)


  ## 政府姿态的改进


  政府姿态的改进关关；我们看到的攻击和犯罪令人大目所舌。在一次事件中，黑客在 2008 年成功地对苏格兰皇家银行策划了一场协同银行抢劫，在短短 12 小时内盗走了
  900 万美元。当时 FBI 网络工作领导人之一肖恩·亨利（Shawn Henry）回忆道：“获取更多资金的障碍是 ATM 机实际上没有现金了。”


  随后，在俄罗斯对爱沙尼亚进行明显的网络攻击一年后，我们看到了新的变化：当俄罗斯军队入侵格鲁吉亚共和国时，轰炸机和坦克首次与大规模网络攻击结合在一起。在 2008
  年整个夏天，僵尸网络通过 DDoS 攻击针对格鲁吉亚的网站。虽然俄罗斯试图推卸责任，将 DDoS 攻击归咎于未知的破坏者，但目标的排列得太过于整齐，政府不可能没有在其中发挥作用。DDoS
  攻击早期集中在格鲁吉亚的戈里市，在轰炸机从空中开始攻击之前袭击。一位安全研究人员后来问：“他们怎么知道要在戈里投炸弹而不是首都呢？”网络研究员比尔·伍德科（Bill
  Woodcock）告诉《纽约时报》：“每台机器的成本大约 4 美分。你可以用更换坦克履带的费用资助一整个网络战争行动，所以不这么做就是愚蠢的。”


  ## Conficker 蠕病毒


  同年 2008 年 11 月和 12 月，Conficker 蠕病毒在互联网上肆虐，成为我们年来看到的最大感染规模。到年底，全球 195 个国家的数百万台基于
  Windows 的计算机系统受到影响，其实际影响预示着网络攻击日益增长的风险：法国战斗机因为无法下载飞行计划而停飞；英国曼彻斯特市因城市网络中断而遭受了超过 100
  万美元的损失。该蠕病毒恶意软件非常复杂，导致业界推测它是一个犯罪团体甚至某个国家国家（如中国）的作品。马马克·鲍登（Mark Bowden）在他关于此次爆发的著作《蠕病毒》（Worm）中写道：“涉及的专业水平实在太多了；没有一个反派能精通这么多冷门领域。”感染数量的估计从低低的
  800 万台电脑到高的 2500 万台不等，为攻击幕后者提供了一个强大的僵尸网络。讽刺的是，这个僵尸网络增长得太大，以至于对发起者来说已经没有用处了——它从未真正被变现，可能是因为太多研究人员和调查人员对其监控得太紧——但成本仍然极其真实。在全球范围内，清理
  Conficker 的费用高达 90 亿美元。


  ## 协作与信息流


  该事件凸显了政府与私营部门在网络安全事件上的协作是多么糟糕——也就是说，他们根本没有在合作。微软成立了一个行业工作小组来对抗这种蠕病毒，并为有关犯罪者的信息提供了
  25 万美元的奖金，但他们几乎没有得到政府的任何帮助，而且随着蠕病毒的变异和传播，似乎一直是一直在向政府高级别官员通报新威胁。事实上，该工作小组的领导人之一罗德尼·约夫（Rodney
  Joffe）曾试图向政府官员汇报，却发现自己的 PowerPoint 演示稿被美国计算机应急响应小组（US-CERT）列为机密，并在他不知情的情况下被提交给白宫。对于行业来说，这是一个明确的例子，说明在与政府合作时，信息是单向流动的。正如约夫所说：“政府正将自己与私营部门隔离开，因为这是一条单行道。它对私营部门理解局势和应对攻击的能力有一种非常傲慢的看法。”Conficker
  蠕病毒是一个典型的案例，私营部门的知识远超政府所拥有的任何东西。该小组后来总结了他们对政府贡献的看法：“零参与、零活动、零知识。”正如约夫所说：“Conficker
  是转折点。那个点证明了私营部门已经独当一面，而政府确实必须改变它的组织方式。”


  ![](img/00006.jpeg)


  ## 网络司令部的兴起


  麦康奈（McConnell）的其他努力之一是推动建立一个新的军事组织来监督黑客工作。在 2008 年秋季，当五角大楼意识到其中一个机密网络被黑入时，这一努力得到了额外的推动——这是首次已知有敌对手渗透了机密网络，而根据其设计，这些网络本应该是物理隔离的，完全与普通互联网断开。根据记者弗雷德·卡普兰（Fred
  Kaplan）的话，“接下来的几个月详细分析确认”一个受恶意软件感染的 U 盘被插入了机密网络。根据卡普兰的报道，俄罗斯在喀布尔的服务亭里（包括靠近北约军事总部的那些）散布了受感染的
  U 盘，希望某个便宜的美国人买一个并在工作中使用。击败网络上恶意软件的行动代号为 BUCKSHOT YANKEE，这有助于明确军方在确保网络空间安全方面面临的挑战。


  麦康奈的想法在随后的奥巴马政府中得到了当时时任国防部长罗伯特·盖茨（Robert Gates）的支持，并导致了美国网络司令部（US Cyber Command）的建立——该部门于次年
  2009 年正式宣布，最初由国家安全局局长基思·亚历山大（Keith Alexander）领导——这是一个利用独特数字专业知识并确保不同分支之间更好地协调的军事单位。它有三个主要支柱：保护所谓的
  .mil 环境（军自身的计算机网络）、协助部队战斗，以及进攻性地部署网络武器。




  随着时间的推移，显而易见的是是中国是最大的威胁——而且这不仅仅是美国的问题。在 2008 年于德国拉姆施泰空军基地举行的一次私下会议上，美国官员与来自德国、法国、荷兰和英国的安全领袖交换了意见。德国代表报告说，来自中国的网络攻击已波及所有领域，包括“军事、经济、科学技术、商业利益以及研发”；*路透社*后来报道道，他们注意到在“涉及德中两国利益的重大谈判之前”，黑客活动有明显的增。。与此同时，法国人表示，他们“相信中国籍攻击者已获取了几位法国高层官员电脑的访问权限，并激活了麦克风和摄像头以进行窃听”。


  美国认为，这些行动是一个复杂的政府黑客群的组成部分，研究人员将该组织命名为 `Comment Crew`。（不同的公司或研究人员也称其为 `Shady Rat`
  或其他六个名称）。该组织专门从事一种高度复杂的网络钓鱼攻击，其手段是伪装成来自信誉发件者的欺诈邮件，目的是说服接收者泄露机密信息，如用户名、密码或银行账户。钓鱼邮件通常包含看似合法的链接或附件，这些链接要么导向虚假网站，要么在点击后在接收者的电脑上启动并安装恶意软件。


  大多数在线钓鱼攻击的特征是拼写粗心、显而易疑的链接或好得不可相信的邀请——最典型的例子是“尼日利亚骗局”，解释了一位非洲领导人如何需要帮助运送巨额资金——但这些中国的尝试是精细的、更有针对性、且针对个人进行了研究，目标直指特定的用户或特定的目标群体，在业内被称为“鱼叉式钓鱼”。他们甚至准确掌握了美国军方人员通常使用的邮件独特签名方式，即“V/R”后跟姓名和电子邮箱签名，该缩写代表“very
  respectfully”（非常诚挚地）。中国黑客还仔细细致地研究了社交网络，以了解谁可能是在网上进行冒充的有用人物；2009 年，五名参与中国气候变化谈判的美国国务院员工收到一封邮件，邮件看起来来自
  `Bruce Stokes`，他是当时《国家杂志》（一家华盛顿特区的内幕杂志）的国际经济专栏作家，也是国务院高层政策官员 `Wendy Sherman` 的丈夫。这封伪造邮件标题简单为“中国与气候变化”，其正文包含了对中国看似具有说服力的评论，并附有一个带有隐藏恶意软件的附件，一旦点击，将让黑客访问用户电脑的几乎每一个角落。


  研究人员获悉，那种方法是中国黑客的最爱。他们经常尝试部署一种名为 `Gh0stNet` 的远程访问工具 (RAT)，该工具允许黑客监视击键、秘密截屏、通过受感染电脑的摄像头激活并录制音视频，还可以安装和操纵文件。技术本身并没有什么特别——在那个时代，任何资深黑客都能部署类似的恶意软件——但其复杂性以及精确性与广度超过了我们当时看到的许多其他威胁。


  中国黑客还了解工人的心理——根据《纽约时报》报道，中国政府使用标题为“加薪”的附件来诱导人们点击。一旦他们控制了电脑，就会搜索邮件并将其转发到一个匿名的 Gmail
  账户。后来，这让可口可乐感到意外，因为他们此前认为这项交易会顺利通过中国政府的反垄断审查。


  然而，可口可乐只是众多在中国业务遭受数字攻击的西方公司之一。欧洲钢铁巨头 `ArcelorMittal` 负责中国业务的首席主管被一个团队入侵，对方翻遍了一个名为
  `China` 的文件夹并下载了 PowerPoint 演示文稿；英国能源巨头 `BG Group` 的地质图和钻井记录被窃；切萨碧能源公司 (`Chesapeake
  Energy Corporation`) 在与中国能源巨头中石化 (`Sinopec`) 谈判期间，其天然气租赁信息也被窃取。


  *彭博社*报道称，可口可乐直到 2009 年 3 月 15 日 FBI 出现并警告他们之前，他们甚至不知道自己已成为目标。在被盗的文件中？


  ```

  `Sinopec CA—Executed.docx`

  `General—China SHG\deals\STA`

  ```




  第三局（大致相当于美国的国家安全局（NSA）或英国的通用通信总部（GCHQ））为其投入了大量的资源进行网络监视和间谍活动。然而，第三局的任务实际上比其西方对应机构更为广泛——这些全方位的任务在美国本应属于国防语言学院（DLI）和国防信息系统局（DISA，即五角大楼的
  IT 管理机构）。


  根据美国研究人员所能判定的程度，至少有六个针对外国网络的中国技术侦察局——包括驻在兰州、济南、成都、广州和北京的单位。到 21 世纪 20 年代后期，他们已经工作了多年；美国研究人员怀疑，所谓的第三局早在
  1997 年就开始从事所谓的“信息战争”活动，并在其期间内因其对“信息战争理论的研究”获得了至少五项军事优秀大奖。


  然而，我们在情报中看到的那种整洁有序的分析，往往与我们深入黑客网络内部时看到的混乱局面完全背道而驰。对美国政府和国际社区的宏观分析并没有准确反映出中方界限的模糊性。我们了解到，例如，许多政府黑客会从事自己的侧边项目——有时在晚上，有时甚至在工作期间或午休时间——进行犯罪金融攻击，或者为了收赂针对特定目标，或为了某些让其老板表现出良好的绩效指标。黑客们利用为军事黑客建立的基础设施（这些设施位于“防火墙”之外），在开放的互联网上进一步推进自己的项目——从大陆走私并洗钱资金，或者简单地在中国正常限制之外使用他们自己的社交媒体账号。这种活动的混杂，特别是当它们与中国的工作时间重叠时，使得人们很难判断我们所看到的内容中有多少是政府授权的指导性行动，又有有多少是自由职业的机主义行为。


  这种问题是双向的：大量的间谍活动来自民用黑客，他们出于爱国主义情感或对利润的渴望，致力于促进中国的经济和军事目标——可能还有数万名将计算机技能与国家服务相结合的中国黑客。正如技术企业家在美国备受推崇一样，中国文化也推崇其黑客。上海社会科学院在
  2005 年的一项研究将黑客比作摇滚明星，发现中国五名小学生中有两个“崇拜”黑客，甚至有三分之一的人表示希望以后成为一名黑客。正如一位中国黑客在 2005 年香港《星期晨报》的文章中解释的那样：“与我们西方的[黑客]同行不同，他们大多数是个人主义者或无政府主义者，中国黑客倾向于参与更多政治，因为他们大多数年轻、激情且爱国。”


  `chinahacker.com` 和 `cnhacker.com` 等网站为想要学习新技能的人提供课程。从上看，这与我们在美国文化中看到的对技术人员的崇并不相似——硅谷企业家和初创公司在电视节目、电影和网站上受到赞誉和庆祝——但这些中国黑客正被大规模地转化为针对我们经济的力量，通过熟练国际窃取破坏美国的就业和公司。




  随着 2008 年夏秋的到来，我发现自己正处于一场截然不同的中国间谍行动执行之中。肖恩·亨利（Shawn Henry）在盛夏的一天给我打电话，解释说局里看到的证据显示，中国黑客成功入侵了民主党总统候选人巴拉克·奥巴马的网络；竞选团队最初认为只是普通的计算机病毒，但实际上是一种恶意软件，让中国人能够开始泄露政策文件并了解竞选内部的辩论。当
  FBI 认为政客和候选人可能是外国势力情报活动的目标时，我们拥有向他们提供所谓防御性简报的经验，但这是我们第一次在总统竞选期间看到黑客攻击。莉莎（Lisa）给奥巴马竞选团队的外政策顾问丹尼斯·麦登纳（Denis
  McDonough）打了电话，告诉他一个叫肖恩·亨利的男人很快会与他联系，麦登纳应该接受这次简报。随后，一名 FBI 探员访问了奥巴马竞选的芝加哥总部提供警告，白宫办公厅主任乔什·波尔滕（Josh
  Bolten）给竞选团队负责人大卫·普劳夫（David Plouffe）打了电话。“你们遇到大麻烦了，”波尔滕说，“这比你们想象的要大得多，你们必须处理好。”几天后，我们意识到共和党竞争者约翰·麦凯（John
  McCain）的网络也被入侵了。在某些方面，双方都成为目标这一事实让局里更容易介入——我们可以提供对等的信息和协助。


  局里努力保持不参与党派政治，因此穆勒（Mueller）坚持要求对两个竞选团队提供完全相同的简报——绝不能有任何我们偏袒某一方的迹象。我与两个竞选团队都谈了话，他们派遣了代表前往华盛顿：奥巴马派了两名国家安全团队成员，丹尼斯·麦登纳和马克·利普尔特（Mark
  Lippert）；麦凯派派遣了他的外政策顾问理查德·方正泰因（Richard Fontaine）。我们在 FBI 的指挥中心分别会面，并解释有一个“外国组织”针对了他们的网络，但并未明确告诉他们对方是中国。


  两个竞选团队都有一个迫切的担忧：这些材料会被用来对付他们吗？根据对中国典型行为的评估，我们认为这只是一场间谍行动——也就是说，他们想研究和学习被盗取的文档，而不是以任何方式公开使用它们。精通技术的奥巴马竞选团队吞噬了我们提供的信息，提出了许多后续问题，并询问如何加强防御；他们聘请了顶尖的网络安全公司克罗尔（Kroll）清理了网络。而在技术应用上挣扎的麦凯竞选团队接受了简报，但很少进行后续询问。黑客攻击在没有引起公众注意的情况下结束了，文件也从未公开过，尽管麦凯竞选团队收到了来自中国政府的一份奇怪投诉：黑客访问了麦凯一封写给台湾总统尚未寄出的信，信中对台湾表示同情，一位中国外交官向竞选团队提出了投诉。对我们来说，这是一次尤为无颜耻的投诉。


  最终，2008 年总统竞选黑客攻击是另一个被错过的警钟，错失了理解网络安全在地缘政治议程中重要性的机会。


  * 特别是，“冒充案”一直是 CCIPS 内部的一个热点案件，因为它代表了司法部首次考虑指控某人违反“1030(a)(1)”罪，即《计算机欺诈和滥用法》（简称“1030”）中的国家安全指控。我们对该项指控进行了长时间的深入研究，最终决定坚持使用简单的`1030`指控——即不包含国家安全要素的计算机欺诈。


  * 这一情节导致了长期禁止随身行李携带超过 3 盎司液体的规定。


  * 与此同时，也有必要更新法律以适应我们所看到的犯罪类型；计算机欺诈和滥用法》最初要求“损失”大于`5,000`，但在许多网络案件中，证明固定的金额损失极其困难。如果某个用户的计算机在不知情的情况下被劫持用于僵尸网络，你该如何计算该特定计算机用户的损失？对于成千上万台计算机组成的僵尸网络中的每个个体受害者来说，影响可能微不足道，但整体来看，对生态系统造成了真实的损害。此外，`5,000`的阈值引发了可能的争议——2008
  年，司法部成功推动国会修订该法。


  * 最终，中国审查确定了 11 类禁令，从色情到“损害国家荣誉和利益的信息”。


  与此同时，“黑客”一词翻译成中文是“暗访者”，这是一个对阴影的恰当描述。


  * 这些辩论在美国可能已经结束，随着我们在虚拟现实领域迈向更加复杂。


  * 五角大楼实际上运行着四个网络：开放互联网、非机密网络 `NIPRNet`、“机密”级分类网络 `SIPRNet`以及“绝密”级分类网络 `JWICS`。


  # 第 3 章：极光行动 (Operation Aurora)


  2009 年 1 月一个寒冷的日子，巴拉克·奥巴马接管了美国政府，陷入了该国自大萧条以来面临的最严重的经济危机。这种神话已经迅速进入他团队的心理，认为技术和社交媒体的乐观草根力量不仅将他送进了白宫，并将帮助国家走出困境。当时的形势严峻；当时，国家每月流失
  60 万工作岗位，失业率正攀升至 10%。在就职典礼上，他告诉大量民众：“我们的经济状况需要行动：果断且迅速，我们不仅要创造新的就业，还要为增长奠定新基础。”


  对于 2009 年大量回到政府的许多新任命者来说，在白宫、司法部以及整个国家安全机构中，他们上一次任职政府是在 9·11 事件之前的克林顿时期。从那时起发生了许多变化——包括增加并重组了一个全新的内阁部门，国土安全部，该部门本身就包含了
  25 万政府员工。新政府的到来提供了一个回顾 FBI 在恐怖问题上变化的契机——同时也意识到，要在司法部和 FBI 在网络安全方面达成共识仍有大量工作要做。





  “我记得在[过渡]期间，最让我惊讶的事情——因为我曾在 2000 年至 2003 年间从事国家安全工作，后来休息了一段时间后又回来了——那就是国家安全委员会（NSD）与联邦局之间存在着难以置信的合作程度，”大卫·克里斯（David
  Kris）回忆道，他曾担任奥巴马的首任国家安全助理检察长。在他早期的阶段（即 9/11 事件前后），司法部和 FBI 经常处于对立状态；FBI 局长路易斯·弗里（Louis
  Freeh）与比尔·克林顿之间的关系非常恶劣。在政府执政的最后几年里，两人完全没有交流，FBI 在很大程度上被排除在国家安全对话之外。然而，9/11 之后的紧张时期，这种关系发生了天翻覆地的变化，FBI
  在反恐问题上已成为国家安全体系中紧密整合的一部分。但到 2009 年初，反恐领域由于这种信任与整合的成功表明，我们需要针对日益增长的网络威胁采取类似的方法。


  总统在 4 月作为其联邦雇职员工巡察的一部分访问了 FBI，在胡佛大楼的院子里向 FBI 员工发表讲话。“21 世纪的挑战要求我们重新思考，重新行动。近年来，联邦局已经经历了深刻的转型以跟上步伐，”奥巴马告诉聚集在一起的
  FBI 员工说，“随着新技术的传播，你们越来越多地在非传统领域面对对手——从跨国网络到网络犯罪和间谍活动。在这一切过程中，你们必须继续领先于所有触犯法律的人一步。”


  巴拉克·奥巴马作为一名新一代领导人上任，比他的前任年轻许多，而且比以往任何一位总统都更精通技术。新政府应对技术挑战的能力似乎具有巨大的前景。奥巴马总统努力争取出在任期间保留他的黑莓手机，拒绝作为总司令官与世界隔绝。在进入白宫的头几个月里，他举办了一场关于网络安全的活动和演讲，其中甚至提到了“欺骗、钓鱼和僵尸网络”，这些术语对于当时几乎所有国家顶级决策者来说仍然非常陌生。“我们今天处于一个变革的时刻，这是一个历史性的时刻，我们这个互联的世界既带给了我们巨大的前景，也带来了巨大的危险，”他说，“这是我们信息时代巨大的讽刺，正是那些赋予我们创造和构建能力的技术，也赋予了那些想要破坏和毁灭的人力量。”


  尽管对更激进、更具技术的网络安全方法抱有高期望，但政党和政府的更替放慢了政府的运转；正当我们认为自己在网络安全方面正积累势头时，新上任的政府想要花自己的时间研究这个问题并提出解决方案。布什精心策划的全面国家网络安全倡议（CNCI）是无数小时工作的成果，结果被搁置了。“[[CNCI]是政府做得最好的部分——100
  亿美元的资金，由六位内阁部长签署——也是政府做得最糟糕的部分——当政府换届时，这一切都被回到了架子上，”肖恩·亨利（Shawn Henry）解释道，“这令我心碎。”


  除了让新政府及其任命者熟悉长期对话的正常延迟外，经济挑战也耗尽了政府的带宽。每天都会出现历史性的危机，诸如网络安全之类的长期战略挑战被搁置一旁。在奥巴马政府时期，我们也遇到了一个独特的挑战：正是那种帮助他们上台的技术精通，导致一些人更多地将技术视为答案而非问题。在某些方面，围绕
  2008 年奥巴马竞选的草根力量神话更类似于 90 年代中期狂热的日子，当时人们认为互联网的自由和开放几乎是纯粹的善。它的阴暗面政府似乎并不热衷于关注。


  奥巴马政府初期最大的内部辩论之一是，白宫是否会任命一个新的网络沙皇来协调跨政府的努力工作——如果是的话，这个人是在白宫、国家情报总局长办公室，还是在国土安全部？每种模式都反映了略有不同的角色和重点。在面临挑战二十多年后，随着世界从模拟转向数字，政府仍在试图理清各机构所承担的碎片化角色和职责。


  `cyber-`（网络）这个前缀最初源自威廉·吉布斯（William Gibson）的书，于 1996 年克林顿总统关键基础设施工作小组的报告进入了政府的命名。该小组最初的任务是调查俄克拉荷马市爆炸案后冷战后的恐怖主义威胁，以及国家关键设施和网络的脆弱性。然而，该工作小组不仅关注建筑、机场和政府办公室的物理安全，其最终报告的一半内容涉及了新兴的数字威胁。分配给小组的一名司法部律师迈克尔·瓦蒂斯（Michael
  Vatis）知道吉布斯的书，并建议小组采用该术语。在最终报告产出后的国会听证会上，副司法部长詹米·戈雷利克（Jamie Gorelick）警告道：“我们还没有遭受针对基础设施的网络恐怖攻击。但我认为这只是时间问题。我们不想等到网络版的珍珠港事件。”


  在过去的几年里，政府多次尝试使其数字防御工作具有协调性——这种防御越来越多地不仅政府，还涉及远离华盛顿和地缘政治的商业领袖。1997 年，一个总统委员会得出结论：“正如原子时代可怕的远程武器让我们对
  20 世纪后半叶的安全问题有了不同的思考一样，信息时代的电子技术挑战着我们现在发明新的方法来保护自己……国防不再是政府的专属，经济安全也不再仅仅关乎商业。”


  在奥巴马政府的第一年，曾领导迈克·麦康纳（Mike McConnell）推动网络安全工作的梅丽莎·哈瑟瑟（Melissa Hathaway）帮助领导了政府的数字防御转型小组。新的奥巴马团队最终采纳了她团队的许多结论，将策略集中在与私营部门建立伙伴关系并合作更好地共享信息上。正如奥巴马团队负责网络安全的国家安全委员会工作人员罗布·内克（Rob
  Knake）调侃道，新政府的目标是采用与私营部门合作的`Home Depot model`（家宝模式）：“你可以这样做，我们可以帮助。”


  然而，准确了解在网络空间中谁做了什么仍然极具挑战性。没有所谓的`网络 911`，没有明确的政府机构或信息中心让公司在发现自己沦为网络攻击受害者（无论是知识产权盗窃还是财务欺诈）时可以拨打。相反，不同的机构都有不同的角色、不同的法律权限以及处理网络空间的不同方法。




  政府将其职能大致分为三类：国防部和国家安全局（`NSA`）、`FBI` 和司法部，以及国土安全部（`DHS`）。特别是在网络安全辩论的早期阶段，`NSA` 具备技术能力，但人们担心它会过度网络空间过度军事化，而且缺乏与私营部门所需的信任。在法律上，它的使命也仅限于对外：`NSA`
  被禁止对美国美国人进行国内间谍活动。


  `DHS` 当时还很新颖，严重缺乏实际权威，也缺乏技术专长。虽然从财政部调入新 `DHS` 的秘密局（`Secret Service`）一直是国家调查网络犯罪的专家，但他们对该问题的了解非常狭窄，因为他们只有“刑事”任务，而没有
  `FBI` 那种“国家安全”任务。他们可以追捕罪犯，但无法追踪间谍和国家机器。总的来说，`DHS` 旨在成为政府网络安全工作的公开窗口——国土安全部部长珍妮·纳波利塔诺于
  2009 年 10 月启动了一个新的国家网络安全与通信整合中心，该中心本应信息共享的中央库——但这有时会与私营部门密切合作的 `FBI` `NCIJTF` 发生冲突。


  在奥马政府时期，关于信息处理、威胁、特定黑客或与私营部门关系的职权斗争往往经常升级，国家安全委员会开始再次研究各个机构的职能。最后，罗伯特·穆勒已经受够了机构间的对话、工作组和研究委员会。这个过程太坎坷、太慢，而且不够。他联系了纳波利塔诺和
  `NSA` 负责人基思·亚历山大将军，建议他们三个人面对面达成一项网络安全协议。“这太复杂了——每个例子都有五个例外，”他说，“关于谁做什么，简单解释是什么？让我们直接把这件事敲定吧。”


  他们三个人聚在一起，基本上在政府层面的餐巾纸上，勾勒出了后来被称为“气泡图”的内容，在三个气泡中划定了 `DHS`、`NSA` 和司法部的角色。这种新方法为每个机构规定了主导角色：`DHS`
  将负责通过信息共享来修复、缓解和防止攻击，并在攻击后协助修复。`FBI` 和司法部将负责攻击的调查和起诉，以及威慑。五角大楼和 `NSA` 将专注于海外的干扰。


  尽管“气泡图”在政府内部变成了一个老笑话，但该模型作为机构领导者之间关于如何开展工作的共识保留了下来。


  ![](img/00006.jpeg)


  每天，私营部门与公共部门之间破碎的信任证明是极其令人沮丧的。在一次会议上，我之前的演讲者——一位前证券交易委员会（`SEC`）官员、现私营辩护律师——警告不要自愿与政府分享任何信息。“任何告诉你要自愿与
  `FBI` 分享东西的人，他们才是应该被戴上手铐——而且你可能也会被戴上手铐，”他在结束时这样对观众说。当他回到座位时，播音员的声音响起：“下一位演讲者是司法部的约翰·卡林，他将讲述政府在这里是为了提供帮助的。”那天，观众席面无表情。


  为了改变私营部门的认知，我们开始对企业总法律顾问开展低调的外展活动，以听取他们的顾虑——作为回应，我们实施了低调的倡议，希望这些能改变威胁格局。为了确保公司至少会警告其同行，司法部和联邦贸易委员会（`FTC`）澄清了反垄断指南，明确公司可以在自己的行业内共享威胁信息。与此，我们发布了一份白皮书，给予公司更大的空间共享威胁信息，解释说只要是以“汇总”形式提供的，就不会违反隐私法。然后，为了缓解法律责任的担忧，我们让
  `FTC` 和 `SEC` 公开表示，不将信息交给执法部门可能会被用于在判断公司对泄露的响应是否符合合理的关怀标准时对其不利——但交给执法部门将被认为是有有益的。这些似乎都是一些微小的改变，远在公众关注之外，但却是重要的推动，帮助我们勾勒出外国势力对美国企业所做行为的更好蓝图。


  我们继续警告目标公司并在各行业开展外展，但对方继续表现出抵触。我们向一家美国公司的领导层展示了他们合资企业中的中国伙伴一直在偷取知识产权，并利用其加速自身的技术进步。该公司震惊了，理所当然地感到被中国伙伴背叛了，但他们拒绝公开这一担忧；虽然他们缩减合资伙伴关系，但他们担心让中国政府丢脸可能会导致他们在中国面临更大的问题——并可能给他们在境内的员工带来麻烦。


  只有当我们能够开启一个良性循环，改变才会发生：我们的检察官必须看到我们确实会起诉，然后公司就会更自由地作为受害者站出来，为检察官提供更多案件。每个人都需要看到共享信息是有意义的，并且它能带来坚实、可见的结果。


  ![](img/00006.jpeg)


  我们可以识别出多个不同的中国黑客团队，针对多个不同的目标和对象进行工作，每个团队都有自己偏好的工具和技术水平。经济间谍并非中国唯一的在线努力。中国政府和军方还进行了更传统的间谍活动，针对被认为是政权敌对的群体。2009
  年，一家网络安全公司发布了一份关于中国针对西藏小组网络间谍活动的详细研究，其中包括针对达赖喇嘛私人办公室的恶意软件。攻击的特点是极具说服力的鱼式钓鱼邮件，这些邮件像是来自西藏自由网络的文件，但实际上包含将电脑位置传回给中国控制的服务器的恶意软件。事实证明这是成功的，允许中国黑客外泄了关于达赖喇嘛谈判立场的文件。中国方面严密监控了参与西藏运动的人员；一个从尼泊尔回到家乡村庄的妇女被中国当局逮捕，并面临着多年多年在线聊天记录的对质。


  我们还看到了更多更传统的间谍目标：美中经济和安全审查委员会（国会成立旨在监控中国起的委员会）报告称，2010 年有官员报告，中国曾试图“渗透美国高层国家安全官员的电子邮件账户，包括当时的美国参谋长主席马克·穆伦海军将和当时的海军作战部长加里·鲁格海德海军将”。






  虽然执行得当且经过充分研究的钓鱼攻击可能相当复杂，但我们看到的许多黑客行为其实并不那么先进。然而，由于大多数公司和政府官员尚未在网络安全上投入真正的资金或培训，令人惊讶的是，即使是一些高级企业高管和政府官员也并不精通技术，他们落入了虚假邮件和相对基础的圈阱。我们的情报共识是，我们的在线对手中很少有人被迫在网络攻击中使出全力实力。他们仅凭二线和三线水平的攻击就得游有余了。后来，FBI
  局长詹姆斯·科米（James Comey）将中国黑客比作“一个醉酒的入室劫匪。他们踢开门，撞倒花瓶，一边提着你的电视一边离开。他们只是产量极高。他们的策略似乎是：‘我们要无处不在——而他们根本无法阻止我们。’”


  ### 基础设施与跳板节点


  当我们仔细研究中国在攻击美国时使用的基础设施时，我们将目标锁定了他们征用的服务器，这些服务器通常在所有者不知情的情况下被征用，以掩盖他们的活动。这些被称为 `hop
  points`（跳板节点）的枢纽变成了关键的调查工具。通常，`hop points` 并不引起关注——它们只是黑客和受害者之间的休息站，是一台被黑客利用的普通计算机，除了帮助掩盖黑客来源外没有其他实际用途。我们看到的中国黑客使用的大多数
  `hop points` 实际上位于美国，尽管一些在海外。如果 `hop-point` 受害者在美国境内，我们可以直接获得他们的许可监控网络，但如果是在海外，我们必须获得法院命令。“（当时）中国对美国公司的大量黑客攻击是通过位于美国的服务器作为‘枢纽’完成的。这意味着，中国入侵了美国的一台计算机，然后从那里沿着辐射线向外移动，攻入数百甚至上千个其他受害者，”FBI
  网络部门前任副助理局长斯蒂夫·查宾斯基（Steve Chabinsky）在 2014 年接受《外交政策》（*Foreign Policy*）采访时解释道。“FBI
  通常能够监控这些‘枢纽’——通常是通过获得被滥用计算机的受害者公司的同意。”


  从这些 `hop points` 开始，中国黑客开始了他们的恶意活动：扫描脆弱的计算机端口、发起鱼叉式钓鱼尝试、部署远程访问恶意软件等等。我们既向上溯源——以查看黑客来自的
  `IP addresses`，这些 `IP addresses` 甚至可以追溯到世界上某个物理位置），也向下追踪——以了解他们针对哪些网络，以及试图窃取哪些文档和文件。


  但安全研究人员在检查 `hop points` 时发现了其他情况：黑客也利用这些 `hop points` 进行许多平庸活动，这些活动他们可能不希望被直接追溯到他们的工作电脑上。他们检查电子邮件，监控自己的股票组合或投资，当然，还看色情和其他不适合在办公场所的内容。他们还通过
  `hop points` 运行了许多“侧边项目”，通过被劫持的网络参与犯罪诈骗或计划活动。`hop points` 也是一种省钱的好方法：有时你甚至可以抓到黑客利用它们进行比特币挖矿等活动，依靠被劫持计算机的处理器来赚加密货币，并迫使他人承担电费，让黑客的
  `Bitcoin` 成为纯利润。


  尽管对我们的案件来说最重要的是，通过坐在这些 `hop points` 之上，我们能够看到一些非常有趣的数据——例如，黑客穿着他们日常工作的制服（中国军队）的照片。我们甚至能够将某些黑客追溯回他们，因为他们很粗心，在家里也使用了工作
  `IP credentials`。


  这种认知成了我们的准则：利用缝隙。黑客在下线和线上都是凡夫俗躯。


  ![](img/00006.jpeg)


  ### 法律发现与安全泄露


  Google 的“法律发现门户网站”（legal discovery portals）代表了该公司最有价值的工具之一，帮助追踪和监控 Google 与执法部门的接触——如果黑客能够破解这些网站，就提供了一份间谍、黑客和罪犯的“名录”。例如，一个国家可以检查美国或外国执法部门是否正在监控其间谍或情报官员。鉴于其价值，公司严密跟踪其门户网站上的活动，并因此标记了一个似乎在查询长长中国姓名列表的用户。当公司安全部门询问原因时，她感到困惑——她没有做过任何此类事情。公司内部警报响起，专家们开始检查她的电脑——这成为了迄此为止影响最大的泄露事件的开端。Google
  对这次威胁和渗透深感个人；创始人之一谢盖·布林（Sergey Brin）将办公桌搬到了安全团队旁边，公司并进行了一轮高薪招聘热潮，甚至为顶尖安全人员提供 10
  万美元的入职奖。


  ### 0 日漏洞利用


  2010 年 1 月，VeriSign 的 `iDefense` 公指中国政府窃取了至少 33 家公司的源代码——科技公司的皇冠之宝，即网站运行的秘密后端配方——包括科技巨头
  Google、Yahoo、赛讯、诺斯罗普·格鲁曼（Northrop Grumman）和道尔化学（Dow Chemical）。黑客利用了微软的 `Internet
  Explorer` 和 Adobe 的 `PDF reader` 中此前未知的漏洞——所谓的 `zero-day exploits`（0 日漏洞利用）——向目标计算机投放恶意软件。


  `zero-day exploits` 代表了网络领域的皇冠之宝，对于普通黑客特别是国家来说，是极其稀缺且昂贵的商品，国家依靠 `zero days` 进行高水平间谍活动，并对毫无防备的目标准备军事攻击。它们不会被常规使用，而是被囤积，以备特殊访问或紧急情况。科技公司通常愿意私下花大价购买
  `zero days`，那些将其用于未来攻击攻击的国家也是如此。在美国政府内部，经常会有激烈的哲学讨论，关于何时以及是否让公司获知 `zero-day vulnerabilities`
  以发布软件或硬件补丁；通常 FBI 或 DHS 倾向于尽快通知公司，以帮助他们加固系统，而情报机构可能倾向于保留它们以便在自己的工作中使用。这种一直持续到现在的辩论产生了一个被称为
  `VEP`（`Vulnerabilities Equities Process`，漏洞权益程序）的正式系统，该程序汇集了政府部门，对行业的 `zero days`
  给出意见。`zero day` 的高价值意味着在野外发现这类漏洞是极其罕见的——90% 以上的黑客努力都不涉及利用任何独特的漏洞——这意味着，如果有人愿意在攻击中消耗一个或多个
  `zero days`，那么他们真的想要他们的信息。这表明一个才华横溢、能力极强的对手正在针对高价值目标。






  对 Adobe PDF 阅读器的使用凸显了黑客是如何超越驱动互联网的核心应用程序，并转而在那些用户毫无思虑就会依赖的工具中寻找更薄弱的目标。总而言之，这次攻击代表了黑客在考虑私营部门目标时思维上的一种令人印象深刻且重要的演变——他们利用了具有多个部分且至少经过三层加密的复杂恶意软件来掩盖其真实意图。一旦进入受害者的计算机，这种恶意软件就会为黑客的控制服务器打开一个隐藏后门，该后门看起来是一个普通的安全套接层（SSL）连接，这是一种在浏览网页时每天会使用几十次的常规安全门户。


  “在防御行业之外，我们从未见过商业工业公司遭受过如此复杂的攻击，”麦卡菲时任威胁研究主管德米特里·阿尔佩罗维奇奇（Dmitri Alperovitch）事后表示。黑客的目标似乎不仅是贸易秘密：谷歌报告称，这些攻击还利用其平台针对了中国的人权活动人士。同样，微软报告称，其自身的监控数据库也成为了中国黑客的目标。“我们发现的是，攻击者实际上在寻找我们拥有合法窃听指令的账户，”微软的戴卫·奥克史密（David
  Aucsmith）告诉华盛顿的一众观众。“如果你想这个问题，这是非常精彩的反间谍行动。你有两个选择：如果你想的话……”（注：此处根据原文逻辑翻译，但原文在此处中断）


  （注：由于提供的原文文本在后半部分存在大量逻辑重复和句式断裂的句子，我已严格按照提供的文本内容进行翻译，并保持了要求的 Markdown 格式。）





  公众的批评凸显了我们在鼓励全球互联网增长时美国所面临的一个特殊挑战。


  从根本上说，我们想要一个没有审查的互联网，一个赋能人权活动人士和言论自由倡导者的互联网。为了实现这种自由，政府过去一直推动——在某些情况下甚至资助了——复杂的通信工具和加密技术，让亲民主团体能够共享信息、协作并记录侵害行为，而无需担心其威权政权监视他们。美国政府支持诸如
  `Tor` 等工具，这是一种帮助互联网用户匿名网络连接的免费软件，使得无法追踪他们从何处访问，并让他们访问被当地审查禁止的内容（例如中国的防火城）。然而，尽管我们支持这些技术是因为它们能够支持海外自由，但长期以来我们也担心这些技术在我们自己的社会可能被恐怖分子、罪犯和儿童掠猎者用来掩盖其行为，并策划和针对我们公民的攻击，因为他们知道即使是法律规定的监视令也无法获取通信内容。


  互联网公司遵守其业务所在地法律的责任是一项复杂的任务。2004 年，湖南一家商业报纸的编辑士涛使用他的 `Yahoo` 邮箱地址，匿名向美国的一一个中文亲民主网站发送了共产党为即将到来的天门广场抗议十五周年所宣布的限制措施。几天后，当北京国家安全局要求该公司交出匿名邮件的详细信息（包括发送者的姓名和地点）时，`Yahoo`
  配合了。政府告知 `Yahoo`，发送者涉嫌“向境外非法提供国家秘密”。#part0018.html#en263en）在 `Yahoo` 配合后，士涛迅速被捕，在为期两小时的审判中被定罪，并被处以十年监禁。


  此案迅速成为一个国际诉求——`Yahoo` 面临着批评者的巨大压力，尤其是人们发现 `Yahoo` 在其他案件中也采取了类似的行动，其中包括另一位因分享有关政府腐败的在线文章被判七年的异见人士。美国众议员克里斯·史密斯在
  2006 年表示：“美国的技术和知识实质上使中国及世界其他地区的压迫政权能够残酷地剥削和滥用自己的公民。`Yahoo` 说它必须遵守运营所有国家的当地法律。但我对此的回应是：如果半世纪前的秘密警察问安妮·弗兰克躲在哪里，正确的答案是为了遵守当地法律而交出信息吗？”#part0018.html#en264en）


  到次年，`Yahoo` 妥协了，代表该家庭在庭外解了诉讼。在另一次国会听证会上，其创始人杨致远面临了严厉的批评；大大屠杀幸存者汤姆·兰托斯代表对杨远说：“在技术和财务上，你们是巨人；但在道德上，你们是侏儒人。”#part0018.html#en265en）士涛的母亲也作了证词，杨远向她鞠了三次躬表示道歉，并说：“我想亲自道歉。”然而与此同时，公司的总法律顾问迈克尔·卡拉汉向众议员成员表示，他不会保证
  `Yahoo` 未来不会做完全相同的事情：“我不能要求我们的当地员工抵制合法要求并将自己的自由置于风险之中，即使在我个人看来，当地法律过于宽泛。”


  “极光””案凸显了这种紧张关系，也说明了与像中国这样的国家达成即使是例行的国际执法合作是多么困难。在世界许多地方，`FBI` 和联邦执法部门能够与当地的外国同事合作，即使各自所属国家在其他领域存在竞争关系；美国和俄罗斯在
  20 世纪 90 年代和 21 世纪 00 年代初的某些时期甚至在传统的执法工作上实现了合作。然而，尽管美中执法部门面临着共同的问题——有组织犯罪、毒品、儿童色情信息——这些问题在不同情况下可能是我们执法部门与他们合作的领域，但打击和封口人权活动人士仍然是中国执法优先事项中的首要任务之一，这一事实使得在其他问题上进行合作几乎不可能。双方都缺乏鼓励信息共享的信任。


