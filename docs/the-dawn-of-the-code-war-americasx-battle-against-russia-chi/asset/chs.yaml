  `Mak` 一直是一名活跃的中国情报官员，于 20 世纪 70 年代被派往美国，希望他能在那里立足并获取我们国家的机密。


  他仅仅代表了某美国官员告诉《华盛顿邮报》的中国“智力吸尘器”网络的一个部分——这是一个由情报人员、工程系学生和高级科学家组成的网络，他们专门针对经济和国防秘密，旨在帮助中国迅速追上美国的技术领先地位。


  商人布雷特·金斯顿（Brett Kingstone）曾自己的公司面临过中国资助的窃取行为，他告诉一家报纸：“美国有 3500 多名伪装成学生或持有 `H1B 签证
  [特殊工作签证]` 的特工，其唯一目的就是进入美国制造业或国防行业工作，其唯一目的就是为中国政府窃取秘密。”他们共同形成了一个高度协调、先进且持续的努力，以提升中国的国内能力。古代中国曾是世界上最具创新性的力量之一，从纸张、火药到指南针的发明，都是其背后的国家。但到
  20 世纪后期，它的品牌已成为廉价、仿制制造的代名词。中国领导层知道他们需要的增长，他们对国家的雄心要求中国重新获得创新领域的领先地位。正如一份美国情报报告所总结：“中国领导人认为
  21 世纪的前二十十年是该国家战略机会的窗口，让他们专注于经济增长、自主创新、科技进步以及可再生能源行业的发展。”实现这些目标的最快方法不是在国内进行创新——而是偷取我们更先进的技术。


  这种努力是如此广泛，以至于他们甚至在字面意义上偷吸尘器。同名无尘吸尘器的发明者詹姆斯·戴森（James Dyson）向英国政府抱怨，他花费了数百万英镑来打击中国的贸易窃密——仍然因
  `IP theft` 遭受了高达 `£400 万` 的损失。他甚至雇佣了私家探员，看到了他的电器在中国工厂内部被拆解和进行反向工程。正如他所说：“如果你开发了一个风扇并取得了成功，如果中国公司只是涌入并复制它，他们就坐了我们的车尾。他们没有开发或专利的成本，他们没有承担任何风险。这只是中国的一种习惯，即复制并将他人的财产转化为巨大的出口成功。”


  在 `Chung` 和 `Mak` 的案件中，FBI 几乎在字面意义上目睹了此类计划是如何运作的：他们在 `Mak` 的餐桌上方安装了监控摄像头，然后看着他反复将
