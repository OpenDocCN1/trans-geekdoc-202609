  ### FBI 的参与与国际协作


  到 2014 年，Keith Mularski 领导的匹兹堡小组的 FBI 探员——他曾在 2000 年代初在线卧伏协助取除了犯罪论坛 DarkMarket——正在处理该国三个最大的网络安全案件。Elliott
  Peterson 和 Steven J. Lampo 两个探员正在追捕 GameOver Zeus 背后的黑客，与此同时，他们的同事正在调查一起最终起诉五名中国解放军黑客的案件，这些黑客渗透了西门子、美国钢铁等公司的计算机系统以使中国工业受益，而其他同事则在追捕
  Darkode 网络论坛。


  当 Werner 和 Stone-Gross 提议与匹兹堡小组合作以击败 Slavik 的僵尸网络时，FBI 的 GameOver 案件已经进行了一年。双方意识到，为了对付僵尸网络，他们需要在三个战线上同时作战。首先，他们必须确定归属——一劳永逸地确定在运行
  GameOver 并建立刑事起诉；即使在发生了数百万美元的盗窃后，FBI 和安全行业连一个“商业俱乐部”成员的名字都没有。其次，他们需要攻破 GameOver
  本身的数字基础设施；这就是 Werner 和 Stone-Gross 发挥作用的地方。第三，他们需要通过收集法院命令并寻求其他政府的帮助来夺取全球服务器，禁用僵尸网络的物理基础设施。一旦完成这一切，他们需要私营部门的合作伙伴准备好软件更新和安全补丁，以便在他们控制僵尸网络的瞬间帮助恢复受感染的计算机。缺少任何一个环节，下一次击败
  GameOver Zeus 的努力都会像之前的尝试一样失败。






  为了确定 Slavik 的身份并获取有关“商业俱乐部（Business Club）”的情报，FBI 与 Fox-IT 展开合作，后者是一家以网络取证专长而闻名的荷兰机构。荷兰研究人员开始追踪与
  Slavik 犯罪团伙相关的旧用户名和电子邮件地址，以拼凑出该组织的运作方式。


  ### 商业俱乐部的结构

  事实证明，商业俱乐部是一个由约 50 名犯罪分子组成的松散联盟，他们每个人都要支付一笔入会费以访问 GameOver 的高级控制面板。该网络通过两个受密码保护的英国网站运行：`Visitcoastweekend.com`
  和 `Work.businessclub.so`，这些网站包含了详尽的记录、常见问题解答（FAQs）以及一个用于解决技术问题的“工单系统”。当调查人员获得法律许可渗透商业俱乐部服务器时，他们发现了一本极其详细的账本，记录了该组织正在进行的各种欺诈活动。“一切都散发着专业性，”Fox-IT
  的 Michael Sandee 解释道。当涉及到准确定金融机构之间交易的精确时间时，他说，“他们可能比银行还要清楚。”


  ### 识别 Evgeniy Mikhailovich Bogachev

  在追踪线索几个月后，Fox-IT 的调查人员从一个线人处获得了一个提示，关于一个他们可能感兴趣的电子邮件地址。这是他们追踪过的许多类似线索之一。“我们有很多面包屑，”Mularski
  说。但由于这一个线索指向了至关重要的发现。团队将该电子邮件地址追踪到 Slavik 用于运行商业俱乐部的英国服务器。通过更多的调查工作和更多的法院命令，当局最终追踪到了俄罗斯社交媒体网站，在在那里，该电子邮件地址可以与真实姓名联系起来：`Evgeniy
  Mikhailovich Bogachev`。起初，这对于该小组来说毫无意义的。经过几周的额外努力，他们才意识到这个名字实际上属于那个发明了 Zeus 并创建了商业俱乐部的“幽灵人物”。


  事实证明，Slavik 是一个 30 岁的男子，住在黑海边的俄罗斯度假城市安纳帕（Anapa），过着中产阶级的生活。在线照片显示他喜欢和妻子一起划船。这对夫妇有一个幼小的女儿。一张照片显示
  Bogachev 穿着豹纹睡衣，戴着深色墨镜，抱着一只大猫。调查小组意识到，他在仅 22 岁时就编写了 `Zeus` 的初稿。


  ### GameOver 作为情报工具

  但那并不是荷兰调查人员发现的最令人震惊的揭露。随着他们继续分析，他们注意到 GameOver 的掌舵人物一直在定期搜索某些国家成千上万台受感染的僵尸计算机，寻找诸如属于格鲁吉亚情报官员或土耳其精英警察部队领导人的电子邮件地址，或者带有标有乌克兰机密机密标记的文件。无论此人是谁，他们还在寻找与叙利亚冲突和俄罗斯军火交易相关的机密材料。在某个时刻，一个灵光灯被点亮了。“这些是间谍指令，”Sandee
  说。


  GameOver 不仅仅是一个复杂的犯罪恶意软件；它还是一个精密的情报收集工具。根据调查人员所能判定的，Bogachev 是商业俱乐部中唯一知道僵尸网络这一特殊功能的成员。他似乎在世界上最高产的银行抢劫犯的眼皮底下运行着一项秘密间谍行动。FBI
  和 Fox-IT 团队未能找到 Bogachev 与俄罗斯国家之间存在特定联系的证据，但某些实体似乎向 Slavik 提供在其巨大的僵尸计算机网络中搜索的特定术语。看来，Bogachev
  是俄罗斯的情报资产。


  ### 与克里米亚危机的联系

  2014 年 3 月，调查人员甚至可以目睹一场国际危机在 Bogachev 犯罪僵尸网络的“雪球”内实时上演。 Sochi 奥运会几周后，俄罗斯军队占了乌克兰的克里米亚地区，并开始努力破坏该国东边界。与俄罗斯的军事行动同步，Bogachev
  将其僵尸网络的一部分重定向，搜索受感染的乌克兰计算机上的政治敏感信息——搜集可能帮助俄罗斯预测对手下一步行动的情报。


  ### 间谍理论

  团队能够构建关于 Bogachev 间谍活动的初步理论和历史。这种明显的国家背景解释了为什么 Bogachev 能够如此肆无忌惮地经营一家大型犯罪企业，但也为
  `Zeus` 生命中的某些里程碑提供了新的线索。Slavik 用于查询情报的系统可以追溯到 2010 年左右，当时他伪造了退休，并使恶意软件的访问变得更加排他。也许
  Slavik 在那一年的某个时候出现在了俄罗斯安全部门的雷达上，作为获得在俄罗斯境外进行不被起诉的欺诈许可的交换，国家提出了某些要求。为了以最高的效率和秘密性执行这些要求，Slavik
  对他的犯罪网络实施了更严格的控制。


  ### 瓦解 GameOver

  发现 Bogachev 可能的情报联系为取缔 GameOver 的行动引入了一些复杂性——特别是涉及到招募俄罗斯合作的可能性时。在几个月的时间里，团队艰难地联系互联网服务提供商，请求接管
  GameOver 现有的代理服务器，以确保在正确的时刻能够翻转这些服务器并禁用 Slavik 的控制。同时，美国国土安全部、卡内基·梅隆大学以及许多反病毒软件公司准备好帮助客户重新获得其受感染计算机的访问权限。跨越大每周会议不断进行，官员们在英国、美国和其他地区协调行动。


  如何（甚至是否）瓦解一个僵尸网络仍然是政府和工业界的一个难题；接管一个命令与控制服务器是必要的，但这是不够的。你还需要消毒僵尸计算机本身，否则你就会在互联网上留下一件大杀伤性网络武器，等待着有人发现。然而，由于僵尸网络是由安装在成千上万甚至数十万台个人计算机上的恶意软件驱动的，关于公司或政府是否有权接触并消毒僵尸计算机，存在着复杂的法律问题。理论上，即使确定单台计算机运行的是哪个版本的恶意软件（这是停用的关键步骤）也需要搜查令；你如何为跨越美国所有
  94 个司法区的数十万台计算机（更不用说任何数字网络现在涵盖的众多国际边界）大规模编写搜查令呢？




  到 2014 年春末，当亲俄力量在乌克兰本土作战时，由美国领导的部队正准备进攻 `GameOver`。他们已经策划了一多要击垮该网络，对恶意软件进行了精细的逆向工程，秘密读取犯罪团伙的聊天日志以了解该团体的心理，并追踪允许该网络在全球传播的服务器物理基础设施。“到那时，研究人员对恶意软件的了解已经超过了作者，”案件首席
  FBI 探员之一埃利亚特·彼得森（Elliott Peterson）说道。正如 Mularski 所回忆，团队已经完成了所有关键环节：“在刑事上，我们可以做到；在民事上，我们可以做到；在技术上，我们可以做到。”


  检察官 Ethan·阿伦森（Ethan Arenson）协助安排了一系列前所未有的法律授权，使每个环节都严密契合。团队与数十人合作，与 70 多家互联网服务提供商以及从加拿大到英国、从日本到意大利的十几个其他执法机构进行沟通，准备在
  5 月 30 日（周五）开始进攻。卢克·德姆斯基（Luke Dembosky）是该案的检察官之一，他在回来协助协调案件之前，刚刚结束了在莫斯科担任司法部使官两年的工作。他回忆道对
  Mularski 在多年网络犯罪活动中建立的网络感到震惊。“我本以为我在全球有很多联系人；基思（Keith）的联系人多得多，”他回忆道，“我们坐那里试图弄如何将这个复杂的国际团队缝合在一起。‘谁认识某个可以在这个世界上某个偏远角落拔掉这台硬件？’基思似乎认识每一个人。”


  ## 攻击


  经过周密计划后，攻击终于开始了。加拿大和乌克兰当局关闭了 `GameOver` 的两个命令服务器，相继将它们全部下线。Werner 和 Stone-Gross
  开始将僵尸电脑重定向到一个精心构建的“陷阱”（sinkhole）中，该陷阱会吸收恶意流量，阻止 `Business Club` 访问其自身的系统。几个小时内，攻击毫无进展；研究人员苦苦于寻找代码中的漏洞所在之处。


  到下午 1 点，他们的陷阱仅吸引了约 100 台受感染计算机，对于已经增长到 50 万台机器的僵尸网络来说，这一百分比微不足道。一排官员站在会议室的 Werner
  和 Stone-Gross 身后，在两名工程师调试代码时，字面上地监视着他们的肩膀。“不是要给你们压力，”Mularski 在此时催道，“但如果你们能让它运行起来就太好了。”


  最终，到匹兹堡时间傍晚，进入陷阱的流量开始上升。在地球另一端，博格切夫（Bogachev）上线了。攻击中断了他的周末。也许他起初并不在意，因为他曾轻松应对过其他夺取控制其僵尸网络的尝试。“他立刻就开始试探。他并不知道我们做了什么，”彼得森回忆道。那天晚上，博格切夫再次为战斗做准备——为夺取网络控制权搏斗、测试、将流量重定向到新服务器，并破解匹兹堡团队的攻击方法。“这是一场网络领域的肉搏，”匹兹堡美国联邦检察官大卫·希克顿（David
  Hickton）回忆道，“看着这一切太不可思议。”


  ## 监控与响应


  团队能够在博格切夫不知情的情况下监控他的通信通道并击溃网络。随后，他们目睁睁地看着他试图使用 `Tor` 回归，渴望获得一些可见性。最终，在经历了数小时的失败后，`Slavik`
  沉默了。看来，这场攻击超出了他的预料。


  到周日晚上，在持续近`60`小时后，匹兹堡团队知道他们赢了。“看着这一切感觉很超现实，”德姆斯基回忆道。6 月 2 日周一，FBI 和司法部宣布了此次打击行动，并公布了针对博格切夫的
  14 项起诉书。


  惊讶的是，多年后，这一成功在很大程度上保持着：为止，该僵尸网络从未重组，尽管仍有约`5000`台计算机感染了 `Zeus` 恶意软件——那个陷阱依然存在。研究人员和调查人员长期认为，该行业从`2012`年到`2014`年遭受的犯罪冲击必然有几十个团伙所负责。但几乎所有的盗窃行为都来自一小少数高技能的
  `Business Club` 成员。“你进入这个领域会听到他们无处不在，”彼得森说，“但实际上这是一个非常微小的网络，他们比你想象的要容易破坏得多。”


  ## 挑战


  毕竟，`GameOver` 并不是唯一让我们对俄罗斯持续攻击美国公司感到担忧的案例。在打击 `GameOver` `Zeus` 僵尸网络几个月后，俄罗斯黑客就入侵了互联网巨头雅虎（`Yahoo`）的用户数据库；这是发生过规模最大的黑客攻击之一——虽然我们的案件只关注一次据称涉及`5
  亿`账户的入侵，但该公司已公开表示，泄露事件影响了其所有`30 亿`名用户。从我们的角度来看，这是国际舞台上的一场独特侮辱性犯罪：这场盗窃是在俄罗斯情报官员的明确配合下进行的，而这些官员的本职本就是打击网络犯罪。





  当这场黑客行动最终被发现并举报、FBI 案件展开时，调查人员锁定了四名特定的嫌疑人：两名俄罗斯联邦安全局（FSB）官员 `Dmitry Aleksandrovich
  Dokuchaev` 和 `Igor Anatolyevich Sushchin`，以及两名犯罪黑客 `Karim Baratov` 和 `Alexsey Belan`。这四个人每个人都有其独特之处：


  Dokuchaev 是俄罗斯 FSB 第二局（信息安全中心，被称为 `Center 18`）的一名官员。该部门相当于 FBI 的网络处，是负责`打击`网络犯罪的单位。Dokuchaev
  的背景对于一名情报人员来说非常独特：他曾作为俄罗斯黑客生活了十年，盗取信用卡并购买如“读卡器”和编码器等技术，这些技术帮助小偷通过物理塑料片模仿真实的信用卡。他曾以
  `Forb` 的网名上线，甚至用过自己的真名协助编辑一本名为 `Khaker` 的俄罗斯杂志，并在那里负责一个名为“侵入（Breaking In）”的板块。根据俄罗斯报纸的报道，他加入
  FSB 是为了避免在俄罗斯因信用卡欺诈被起诉。加入 FSB 后，他继续从事杂志工作，并在那里负责对被指控攻击 `Aeroflot`（俄罗斯航空）支付系统的黑客进行起诉。


  与此同时，他的 FSB 主管 `Sushchin` 以秘密身份在一家俄罗斯金融公司担任担任信息安全主管——这相当于一名领取政府薪水的美国国家安全局（NSA）黑客担任华尔街公司的技术安全主管。`Baratov`
  是一位出生于哈萨克斯坦的加拿大人，住在安大略省，他的社交媒体账号记录了他对豪华车的痴迷，尤其是他心爱的 `Mercedes`（奔驰）和阿斯顿。


  然而，`Belan` 是小组中最有趣的一个：对于调查人员来说，他并不是新面。这个留着乱发、20 多岁的拉脱维亚人以 `M4G` 的名字上线，实际上在雅虎黑客事件之前，他就已经被美国起诉过三次。像
  `Bogachev` 一样，Belan 是网络上的长期常客——他早在 2006 年就出现在在线论坛上（那时他可能还是个青少年），并黑入了多个东欧网站，包括一个在线游戏
  `lordmancer.ru`，但他很快转向了更大、利润更丰厚的目标。“他绝对在我们见过的最尖黑客的监控范围内，”`Flashpoint` 公司的安全研究员 `Vitali
  Kremez` 说。


  美国内华达州的美国检察官于 2012 年起诉 `Belan` 黑入在线鞋类零售商 `Zappos`；接着在明年，他因黑入两个大型在线文档存储网站 `Evernote`
  和 `Scribd` 再次起诉。他专门利用运行在流行的 `WordPress` 内容管理系统上的网站的漏洞，该系统驱动着许多中小型网站。他还针对外围系统，如公司内网、开发服务器或安全性不如主系统的分支机构服务器；他甚至有一次通过使用某公司工程师在
  `LinkedIn`（领英）个人资料上发布的信息发现了一个漏洞服务器，并黑入了该工程师位于加利福尼亚州圣塔克拉拉家中 `iMac` 上的服务器。“2012 年和
  2013 年间公开的许多大型泄密事件都归因于他，而其他新闻并未进入公众领域，”协助应对过 `Belan` 其中一次攻击的网络安全研究员 `Chris McNab`
  写道。


  在这些起诉之后，美国通过刑警组织发布了罕见的“红色通令”，请求其他国家在其领土上发现他时将其逮捕。不久，我们发现他正在希腊度假，当地当局逮捕了他——但他交了保释金（我们认为他不应该获得保释），然后迅速逃回俄罗斯。从那以后就没在俄罗斯境外露面过；正如他的律师告诉《纽约时报》的那样，“过去几年一直无法联系到他。”看来他很快重新上线，继续他长达十年的在线盗窃和欺诈。


  我们一直怀疑，是否正是因为他在希腊被捕以及那份红色通令，让 FSB 最初开始关注他。俄罗斯是否将美国最想要的犯罪黑客名单作为未来招募的清单？


  当调查人员追踪这三名合犯如何利用 `Yahoo` 数据库时，这是一场令人震惊的个人在线脆弱性巡检，展示了犯罪分子和情报机构如何为了各自的目标开始合作。


  利用从用户数据库获取的凭据和账户管理工具，合犯们能够伪造验证“cookie”，使自己看起来有权登录受保护的账户。`Yahoo` 合犯们利用盗取的信息监视了那些你认为情报机构会感兴趣的对象：美国和俄罗斯的记者和政府官员，以及一家知名俄罗斯网络安全公司的员工和其他黑客希望目标的科技公司员工。他们的美国目标包括网络安全、外交和军事领袖，甚至还有白宫人员——但也包括一些意外，例如一位内华达州的博彩官员。他们监视了俄罗斯国内及邻近欧洲国家的俄罗斯政府的批评者，以及《商业报》（`Kommersant`）等媒体的记者，甚至参与俄罗斯加入世界贸易组织的人员。但他们并未局限于传统的情报目标。他们还监视了俄罗斯、瑞士和美国的金融公司，以及一家法国运输公司和美国航空公司。他们利用账户信息定制更具针对性的针对性钓鱼邮件，以期入侵更多用户账户；在某一次，在针对某俄罗斯金融公司董事成员时，他们还针对其妻子和秘书的账户，并向其发送了一封看起来来自俄罗斯联邦税务局的针对性钓鱼邮件。




  俄罗斯联邦局（FSB）的官员经常派遣巴拉托夫（Baratov）利用盗取的雅虎信息破解其他电子邮件提供商和网站的 80 多个账户，并明确告诉他要针对这些人：例如俄罗斯联邦副主席助理、俄罗斯网络安全公司的高管、欧洲企业高管的
  Gmail 账户，以及俄罗斯某共和国体育部的一名工作人员。他们甚至让巴拉托夫监视俄罗斯同事调查员，要求他针对俄罗斯内政部一名在特殊技术项目局工作的官员，该局被称为`Department
  K`（K 局），负责网络犯罪和儿童色情案件。他每成功一次，FSB 就会付给他一笔奖金，通常约为 100 美元。巴拉托夫后来认罪并被判处五年监禁，他在认罪书中表示，在他雇佣黑客的业务中，最终访问了约
  11,000 个账户。


  犯罪分子与 FSB 之间独特的伙伴关系对双方都有利。贝兰（Belan）的 FSB 伙伴帮助他在网上掩盖踪迹，提供关于他们自己的网络安全调查的信息以及追踪黑客的技术。这些信息帮助贝兰运营他自己的在线金融诈骗业务，而
  FSB 也将他的信息用于自己的情报目的。正如博格切夫（Bogachev）在帮助监视乌克兰的同时从 GameOver Zeus 中盗取数百万一样，贝兰利用对雅虎的访问权限来操纵热门勃功能药物的搜索结果——将无意识的用户引导至向贝兰支付推荐流量的在线药店——并掠夺用户账户以获取信用卡，在账户中搜索`amex`、`mastercard`和`visa`等术语。他还搜索了某美国零售商用于发送在线礼品卡的邮箱地址。然后，为了经营垃圾邮件帝国，他建立了一个特殊的工具，以比人类更快的速度伪造身份凭据——每天制造数万个此类凭据，最终让他能够访问约
  3000 万个账户。随后他偷取了这些账户的地址录和联系人，帮助建立了一个远超雅虎的用户数据库，并将其出售给潜在的垃圾邮件发送者。


  此案让司法部公开了网络犯罪已成为何种规模的业务——以及网络世界正变得日益灰色：外国对手只要协助情报机构进行间谍活动，就乐于让犯罪分子不受阻碍地进行诈骗。


  但即使在雅虎入侵于 2014 年 12 月开始时，我们已经在拼命应对可能是美国见过的最奇怪的网络事件了。


  * 此案启发了 FX 电视剧集《美国人》（*The Americans*）。

  * 此案暴露了政府权限的漏洞，导致了《联邦刑事诉讼规则》中`Rule 41`的修正——该规则指导着搜索和查封。除了其他调整外，新修正允许法官签发搜索令，允许调查人员破解其辖区之外的计算机。这项新规则在
  2017 年被攻败 GameOver Zeus 的 FBI 小组首次使用，用于攻击长期存在的 Kelihos 僵尸网络，让 FBI 获得了一份特殊的 30 天搜索令，以帮助消毒计算机并“投毒”僵尸网络。

  * 由于 2014 年 5 月 19 日宣布中国人民解放军（PLA）案件，这次行动实际上曾被短暂推迟。到 2014 年，网络犯罪案件之多，有时很难安排好所有案件。


  # 第 7 章


  # 和平的守护者


  我只有一次在 FBI 指挥中心看过电影。FBI 的战略信息行动中心（`SIOC`）通常是进行严密、组织良好的简报会的现场，配有 PowerPoint 和加密视频会议。然而在
  2014 年 11 月的那个早晨，我们普通的晨简小组小组——包括 FBI 局长科米（Comey）和司法部长霍勒（Holder）——聚在一起观看美国政府最重要的电影：一部由索尼制片厂制作、塞斯·罗根（Seth
  Rogen）主演的粗俗闹剧喜剧。我们都困惑地看着电影；这部电影是如何引发了迄今袭击美国规模最高的网络攻击的？放映过程似乎非常超现实——科米对电影开了一个笑话。我们中没有谁是大粉丝；其中一人归咎于朝鲜迫使政府领导层观看它。毫无疑问，我正处于职业生涯中最奇怪的
  28 天。


  我在 FBI 指挥中心和战情室参加过很多困难的讨论，但没什么能为那场电影放映和随后的对话做好准备。后来，我发现自己正在战情室桌旁向政府通报正在演变的危机。我知道我们必须对待这次攻击；从本质上说，这是对美国价值观的攻击，但当我环顾房间，看到聚集在一起的国家情报机构和军事领导人时，我们没有人真正知道那个牵扰着我们所有人的问题的答案：当一家电影公司因为一部塞斯·罗根的喜剧而受到攻击时，我们可以应对到什么程度？


  索尼案让我们陷入了另一个灰色地带——一个外国国家对私人公司的新攻击。这在某些方面与我们目前在网络空间看到的现象相似——我们主要的外国对手，中国、俄罗斯、朝鲜和伊朗，都认为他们的网络计划对于推进其自身的国内政治目标至关重要。中国和俄罗斯有多个可以施压美国的领域，而伊朗和朝鲜这样较小较弱的对手需要网络世界的非对称优势。在网上，他们比使用传统的军事或经济武器要成功得多。这种网络力量在当朝鲜黑客针对索尼制片厂及其即将上映的电影《间谍会见》（*The
  Interview*）——一部关于试图刺杀朝鲜领导人的喜剧时变得显而易见。当一切结束时，外国势力对美国言论自由和表达自由的前所未有的攻击说明了对政府新权限的需求，以及网络领域给私营工业带来的防御挑战。


  索尼入侵事件——今天很大程度上被记忆为一个笑话——极大地提升了政府的网络应对能力，可能比过去十年中的任何其他事件都要大。这是一场我们经历过的前所未有的危机，但部分归功于我们在政府内部从中国
  PLA 案件和伊朗调查中汲取的教训，我们对如何解决它有了感觉——并在创纪录的 28 天内查出了是谁干的内部，并将这些信息公开了。此案加速了政府内部正在进行的变革：当尘埃落定时，我们制定了处理此类事件的新程序，建立了一个新的机密网络中心，白宫发布了一项新的行政命令。而且，尽管我们当时并不知道，这是一个全球其他国家都在密切关注的事件：它比任何其他网络事件都预示了两年后俄罗斯对总统选举的攻击。


  ![](img/00006.jpeg)




  事件发生在 2014 年 11 月 21 日周五，当时索尼影业的高层高管——包括两位联合主席艾米·帕斯卡（Amy Pascal）和迈克尔·林顿（Michael
  Lynton）——收到了一封诡异且带有威胁性的邮件：“我们对索尼影业造成了巨大的破坏。我们需要补偿，金钱上的补偿。支付损失，否则整个索尼影业将遭受轰炸。你们对我们非常了解。我们不会等太久。你们最好聪明点。”这封邮件似乎来自一个自称“上帝信徒”（God’sApstls）的团体，这个名字没有任何人认识。事实上，甚至这封邮件本身都没有引起制片厂高管的注意：帕斯卡的进了垃圾邮件箱，而林顿从未打开过它。


  下周一，随着感恩节周工作日的开始，攻击者发动了袭击。林顿在开着大众汽车上班的路上接到了首席财务官的电话，警告称似乎出现了安全漏洞；随后，他很快又接到了一个跟进电话——公司需要将其网络下线。某些可怕的事情发生了。“我们并不了解损害的程度、被盗了什么，或者任何细节，”林顿回忆道。


  在整个公司范围内，用户发现他们的电脑冻结了——屏幕上显示着“被 #GOP 破解”。一个恐怖的红色骷图像向用户伸去，下方的文字写道：“我们已经警告过你们了，这只是开始。我们将继续，直到我们的要求得到满足。我们获取了你们所有的内部数据，包括你们的秘密和顶级机密。如果不听从我们，我们将向世界发布下方所示的数据。”屏幕随后包含了五个据称被盗的数据文件的链接，并警告称公司在当天晚上（格林威治时间）晚上
  11 点之前必须“决定你们打算怎么办”，但该图形并没有明确它要求什么、索要多少或何种赎金，以及为什么这家公司会成为目标。并不是所有的链接都能正常工作，这使得人们很难判断发生了什么，但那些查看了
  217MB 压缩包的人发现了一堆奇异物品：索尼电影中演员的护照复印、受密码保护的电子表格、Outlook 邮箱、电影预算，以及似乎是其他制片厂电影的盗版。


  除了冻结的电脑，几个用于推广电影的 Twitter 账户也遭到了破解。它们也发布了带有怪异骷髅的“被 #GOP 破解”图像，并附带信息：“你们，包括迈克尔·林顿在内的罪犯必将下地狱。没有人能帮你们。”帕斯卡在库尔弗市（Culver
  City）索尼高管办公室三楼准备开始感恩节期间缩短的工作周时，在自己的电脑上看到了这个警告。那里是一个历史悠久的电影片场，其历史可以追溯到 20 世纪 30 年代米高华影业（MGM）的辉煌时代。


  太平洋时间上午 10:50——正距离赎金要求的截止时间仅剩四小时——好莱坞新闻网站 Deadline.com 报道了这场发生攻击的首条消息：“由于纽约及全球的电脑被黑客入侵，索尼公司今天的工作陷入了停滞。”公司忙于弄清楚发生了什么——退回到纸质通信，制片厂园区内到处贴满了告示，员工像保罗·里弗式一样在办公室之间奔波，告诉员工关闭电脑，并断开任何手机或平板电脑与公司
  Wi-Fi 的连接。公司在拍摄《雨中倾情》（*Singin’ in the Rain*）的舞台上建立了一个指挥中心，并联系了网络安全公司 FireEye，后者派遣了十二名危机响应人员前往加州。起初一片混乱，但并没有恐慌。“一位高管称之为‘一天的问题’，一位发言人告诉媒体公司正在调查“一起
  IT 事务”。


  然而，问题持续不断。“这是一段非常混乱、动荡的时期，”林顿回忆道。“他们毁了三分之二的服务器、我们大部分的电脑，他们显然窃取了大量数据，员工中对于正在发生的事情感到极度不安。”事实证明，该公司的电脑被“核毁”了——不仅是被冻结了，而是被彻底清空了，变成了散落在
  3000 张办公桌上的昂贵砖头”。周二，“和平守护者”（Guardians of Peace）在在网上发布了四部未上映的索尼电影，但目前还不清楚“GOP”黑客想要什么，或者他们为什么要攻击索尼。感恩节来来去去，索尼依然处于冻结状态。


  最后，在 11 月 29 日周六早早，一位名叫凯文·罗斯（Kevin Roose）的科技记者收到了另一封奇怪的邮件：“你好，我是 G.O.P. 的老板。几天前，我们告诉过你们我们已经在网上发布了索尼影业的电影，包括《安妮》（Annie）、疯狂的世界》（Fury）和《依旧》（Still
  Alice）。这些可以通过搜索引擎轻松获取。这次，我们将把索尼影业的数据发布到网上。数据量小于 100 Ter 字节。”他对这封邮件感到困惑，但点击链接了 Pastebin
  网站，该网站允许用户方便地在线分享信息。他发现了一个组织严密的索尼最核心的商业机密库。罗斯锁定了一个显示 6000 名员工工资的电子表格。罗斯对发现的内容感到震惊，并利用它在
  12 月 1 日写了一篇题为《被破解的文档揭露了好莱坞制片厂惊人的性别与种族差距》的文章，并发表在帕斯卡和林顿微笑的照片上方。现在回过，考虑到索尼影业黑客事件是一个里程碑式的时刻，这本是一个奇地正常的新闻报道——类似于许多正变得司空常的故事，即不满的内部人士、吹哨者或世界各地的黑客泄露了公司和政府机密。这篇文章写得很快，研究极少，且在尝试征索尼评论时未果，这篇九段文字的文章仅带过提到了攻击未知的起源，简要提到索尼“据报道正在调查朝鲜是否可能参与”，部分是因为索尼很快计划上映的关于朝鲜的争议性电影《采访》（The
  Interview）。


  《连线》杂志的金·泽特（Kim Zetter）是业内最有学识的安全类作家之一，《震网病毒》一书的作者，她几乎否定了朝鲜理论——这次攻击太奇怪、太张扬、也太不专业：“如果这听起来很荒唐，那是因为事实确实如此。对朝鲜的关注很弱，很容易被事实反驳，”她写道，“可能的元凶是黑客行动者或不满的内部人士。”然而，在政府内部，我们很快就知道这个理论不仅可能，而且很有可能。事实上，当时媒体或公众并不知道朝鲜在今年早些时候已经对一家英国媒体公司实施了类似的攻击。




  在索尼内部，没有任何高管在露笑。在罗斯（Roose）最初的报道后第二天，约 3800 名员工的个人细节开始泄露到网上——这些信息最终演变成了近 4000 万份文件——不仅包括社会安全号码等身份信息，在某些情况下还包括绩效评估和前员工被解雇的原因。在第一周还认为黑客攻击只是不便和对生产力阻的员工们，在第二周意识到，他们的生活和职业生涯正在发生根本性的变化。《纽约时报》指出，黑客的首轮攻势精准地瞄准了“这个隐秘的电影行业极度敏感的两件事——电影盗版和高管薪酬细节”。随着危机进入第二周，显而易见的是，黑客才刚刚开始。这并非普通的数据泄露；这场针对性攻击背后有着明确的信息和动机。一位安全高管说：“这就像是一场入室劫，黑客在夺走家族珍宝后点燃了房子。”


  一个新的邮件威胁来自“和平守护者”（Guardians of Peace）——告诉所有员工，如果不想遭受损害，就应该公开反对索尼。“如果你不这样做，不仅是你，你的家人也会面临危险。”起初只是一个
  IT 上的不便，很快演变成对公司以及美国言论自由和自由表达价值观的潜在生存威胁。这里存在着深层次的讽刺：美国的自由媒体竟然被利用来为一个世界上最专制、最反新闻自由的国家之一办事。《华盛顿邮报》报道道：“退一步说，《会面记者》（*The
  Interview*）在圣诞节大上映时，或许能从该事件引发的关注中获益。”打开许多被盗文件的密码并不隐晦：“DieSPE123”（即“杀掉索尼影视娱乐公司”）。正如林顿（Lynton）在一次员工大会会议上所说，他们正处于一片未知的领域：“我们没有可以遵循的剧本。”索尼终究是一家日本公司，它在世界各地都有员工，包括韩国——他们真的都安全吗？


  索尼影视的人们感到恐惧——FBI 派遣了特工来帮助安抚他们。他们的紧张可以理解——因为他们卷入了一场国际事件。对我来说，这是攻击影响的重要部分：一个黑客让在美国境内工作的美国工人害怕不敢上班。“朝鲜人在他们的攻击中也使用了心理战，”参与我们案件小组的卢克·德姆斯基（Luke
  Dembosky）回忆道，“他们利用通信向人们植入恐惧。他们作为其中的一部分执行了一场微型心理战行动。”


  ![](img/00006.jpeg)


  12 月 8 日，在对黑客真实目的保持数周疑惑的沉默后，终于来了一个要求：“立即停止播放这部破坏地区和平并引发战争的恐怖主义电影！你们，索尼和 FBI，找不到我们的。”


  我们都知道这部“恐怖主义电影”意味着什么：《会面记者>，这是一部由演员塞斯·罗根（Seth Rogen）和制作伙伴埃文·戈德伯格（Evan Goldberg）拍摄的电影，讲述了中情局的一个虚构计划：利用几个倒霉的电视记者获得对那位闭居独裁者的采访的机会，从而刺杀朝鲜领导人。罗根和戈德伯格此前曾合作过《阿里·甘秀》（*Da
  Ali G Show*），该剧的主星莎莎·巴伦·科恩（Sacha Baron Cohen）因饰演波拉特（Borat）而闻名——那个来自哈萨克斯坦的虚构的笨拙记者。这段经历种下了文化喜剧的种子，将其作为审专制、落后政权的一种——这种兴趣最终促使他们创作了《会面记者>，这部电影最初名为《杀死金正恩》。


  自从 6 月索尼发布第一部预告片以来，这部电影一直就争议不断。索尼位于东京的首席执行官曾私下表示反对——担心电影会激化与朝鲜的紧张关系——而这些担心很快变成了现实。6
  月 25 日，朝鲜官方通讯社称该电影是“恐怖主义”，发行该片是“不可容忍的”。它表示，如果电影继续进行，将面临“无情”的报复；第二天，该国向日本海发射了三枚短程导弹。塞斯·罗根对此消息并不太在意——他在推特上开玩笑道：“人们通常在付了
  12 美元看之前，并不会因为我的某部电影就想杀了我。哟！！”


  早期的争议让幕后的工作室感到担忧：他们整个夏天都在静静地向智库和美国政府官员核实自己应该有多害怕，他们还聘请了一家名为 McLarty Associates 的战略咨询公司来就朝鲜的行为提供建议。麦克拉蒂表示，危险是真实的——而且极有可能变为现实。麦克拉蒂的里奇·克莱因（Rich
  Klein）回忆道曾建议他们：“在美国进行物理打击超出了朝鲜的能力。但我们坚信，朝鲜可以尝试通过网络攻击来阻止电影。”


  在我出生以前，朝鲜就已经对美国利益构成了普遍性威胁；在 20 世纪 50 年代战争僵持后的几十年里，朝鲜半岛已变成世界上防御最森严、最坚固的边境，由数万美国军人保护。然而，在战争后的六十年里，弱小且孤立的朝鲜投射的力量范围并未超出半岛周围的海域。


  虽然朝鲜在战后最初几年处于优势地位，但随着时间的推移，韩国日益增长的经济稳定和技术进步扭转了权力平衡。随着朝鲜追求其认为有助于实现独立的核武器计划，其独裁政权在全球范围内日益孤立。它曾经对韩国实施所谓“速战速决”的愿望变得越来越不现实，因此它开始转向其他非战争手段来实现其目标。


  几十年来，朝鲜一直在进行挑衅性的低水平军事行动，并对韩国、其他亚洲邻国以及美国发动进攻——这些行动使其能够在展示能力和投射军事力量的同时，保持远低于地缘政治的战争门槛——尽管其中某些行动（从恐怖炸弹到简短炮击，再到击沉舰艇）是非常致命的。




  然而，在我担任政府的大部分时间里，我们首要关注并不是朝鲜的网络活动——我们主要担心的是它的核计划。这在我们所谓的“反扩散”领域是一项重大威胁——一个国家正积极试图非法获取技术，以帮助其初创的核武器计划。我们开展了一项重大倡议，试图阻止由于朝鲜因其鲁莽的地缘政治行为而面临国际制裁，导致所谓的“两用货物”和其他被禁技术的出口。


  ### 反扩散与非法贸易


  我们不断试图监管朝鲜对关键技术的搜寻，并与全球其他国家合作，限制朝鲜获取可能帮助其制造核武器或增强其军事力量的能力。


  #### 蔡贤泰（Hsien Tai Tsai）案

  我们处理过的最大的反扩散案例之一，是针对一个名为 `Hsien Tai Tsai`（或称 `Alex Tsai`）的商人及其台湾公司 `Trans Merits`
  和 `Global Interface` 的多年追捕。这是一个家族多代参与的骗局，还包括他的妻子和儿子 `Gary Tsai`。他们试图从美国向台湾出口关键的双用技术，虚假声称最终用户是
  `Trans Merits`，但实际上他们的意图是将技术转移到朝鲜。


  `Alex Tsai` 自 20 世纪 90 年代起就参与此类出口计划，并于 2008 年在台湾因“非法伪造发票向朝鲜运送受限材料”被起诉。随后，他在 2009
  年 1 月也成为美国制裁的目标，当时他担任朝鲜矿业开发贸易总公司（Korea Mining Development Trading Corporation）的采购代理，这是一家听起来无害，实际上是朝鲜主要的军事技术进口商之一。


  红旗不断出现，表明蔡氏家族仍在从事非法出口业务；在伊利诺伊州，他的儿子 `Gary` 成立了一家美国公司 `Factory Direct Machine Tools`，但继续分发印有
  `Trans Merits` 名称的片片，并依靠 `Trans Merits` 的邮箱账户处理部分工作。`FBI` 的调查发现了由 `Alex Tsai` 协助促成的多种非法出口技术，包括机床、LED
  路灯和油泵。我们在 `Alex Tsai` 与妻子在爱斯尼亚度假期间将其抓获，并在伊利诺伊州格伦维尤（Glenview）的家中抓获了 `Gary`。虽然他们最终在芝加哥的联邦法院认罪，但此案也指出了美国在打击此类非法贸易方式上存在的许多重要漏洞：`Gary`
  似乎很容易就能避开银行的监控，尽管他与受制裁人员拥有相同的姓氏。


  ![](img/00006.jpeg)


  ### 网络威胁的演变


  总的来说，朝鲜是在后期后期才表现为一种网络威胁——这既是因为他们开发这种能力较慢，也因为我们作为情报机构，对于“谁在网上做了什么”的理解仍在成熟中。朝鲜的大部分网络基础设施通过中国中转，因此有时很难理清各项归属——特别是在奥巴马政府早期。事实上，在
  2013 年，韩国最初将一次网络攻击归咎于中国，但后来才意识到那次攻击源自朝鲜。


  我们运行了一套复杂的系统来产生关于反恐主义甚至反扩散的情报报告，但在涉及网络安全方面，还没有达到同样的复杂程度。有太多的机构共享信息的方式不佳，导致难以构建出美国政府本身所掌握的全画像。


  美国政府确实知道朝鲜在网上构成了威胁：它是被列为全球四大顶级网络威胁的国家之一。朝鲜经常出现在我们的晨间情报简报中，特别是在试图利用网络手段窃取价值技术和规避制裁的背景下。我们甚至见过朝鲜试图在海外进行破坏性攻击。


  与伊朗类似，朝鲜发现网络行动——一个涵盖了其独特的犯罪、情报收集、数据窃取和进攻行动的伞状活动——作为对其南方邻国韩国和美国巨大军事优势的非对称应对和反制特别有用。朝鲜实际上是世界上军事化程度国家；在朝鲜战争后的几年里，它致力于统一半岛的目标，并将与韩国之间的非军事区变成了一个与历史上任何其他边界线都不相同的要固地区，集结的大炮和部队随时准备进行防御或进攻。


  ### 脆弱性与基础设施隔离


  网络之所以对朝鲜具有独特吸引力的方面之一是，它实际上有助于利用朝鲜落后的经济发展——相比之下，到 21 世纪初，任何西方政府或公司都已深度联网，日常运营和通信高度依赖计算机；而朝鲜的基础设施几乎停留在
  20 世纪 50 年，在技术漏洞方面寥寥无几。


  它的网络存在率实际上为零；政府和海外网站的总数只有几十个，而整个国家第一个可靠的宽带互联网连接直到 2010 年才安装；直到 21 世纪初，朝鲜境内任何想向外界发送电子邮件的人都必须使用仅有的两个网关之一，一个在平壤，一个在边境城市沈阳，电子邮件在沈阳被收集并每小时通过中国发送一次；一封邮件的价格约为
  1.50 美元。


  2014 年，该国主要依赖于单一 IP 地址块，共 1,024 个，这大约相当于一个中型公司单栋办公楼可能使用的量；这个 IP 数量比纽约市平均一个街区拥有的还要少。（它还使用了
  256 个中国网页地址。）2012 年，平壤科学技术大学的联合创始人解释说，整个大学共享一个 IP 地址——这只是美国一个大学宿舍的三分之一或五分之一。朴昌某当时告诉路透社记者：“学生不能长时间上网。他们只用它来学习。”那个让互联网对
  21 世纪其他地区变得如此宝贵的通道路门，被金正恩政府认为是一种危险的、不稳定的力量。相反，朝鲜政权主要投资于其自己的内部网，被称为“光网” (Kwangmyong)，该网络与更广泛的全球互联网隔绝。


  这种空白是让朝鲜成为一个任何人（包括美国政府）都难以理解的国家的原因之一。它的孤立程度与地球上任何其他政府或国家都不同；我们对数千年前某些原始文明的了解，都比对这个所谓的“隐士之国”日常运营的了解要多。它的网络存在几乎为零，决策过程极不透明。战略与国际研究中心（CSIS）的研究人员在研究朝鲜的网络战略后得出：“朝鲜被认为是世界上最难的情报目标之一。”




  FBI 在 20 世纪 90 年代就开始关注朝鲜对计算机的兴趣，当时纽约的反情报特员注意到该国在联合国的一些外交官正在参加计算机科学课程。正如 1999 年美国在科索沃地区展现出压倒性的军事实力以及入侵伊拉克后中国引发的数字觉醒一样，朝鲜在领导人金正日目睹了
  2003 年美国轻而易举地击败伊克的坦克和火炮后，其对数字战争作为一种平衡竞争地位手段的兴趣也加速增长。


  朝鲜的网络行动主要由其核心的情报和秘密行动部门——总侦察总局（`RGB`）以及最初为人知的 `121 局`运行。更传统的军事网络行动则由朝鲜人民军（`KPA`）总参谋部负责。朝鲜在
  2009 年至 2010 年间合并了许多网络单位，将来自朝鲜工人党和人民武装力量部的不同单位并入新成立的 `RGB`，该机构大致相当于于 `CIA`、`NSA`
  和美国特种作战司令部（`SOCOM`）的结合体。


  在 2009 年左右，即 `RGB` 网络单位整合期间，朝鲜开始频繁出现在针对美国和韩国网站的 `DDoS` 攻击背后——包括 2009 年 7 月针对从白宫到韩国国防部的二十多个网站的攻击。这些攻击是平庸的、司空常见的拒绝服务攻击，但在随后的几年里，这些攻击持续发生。2012
  年，在该半岛军衔最高的美国将领詹姆斯·D·瑟尔曼（James D. Thurman）将军向国会警告朝鲜“日益增长的网络战争能力”，表示该国“雇佣了受过专业训练的尖端计算机黑客，针对韩国或美国等对手发动网络渗透和攻击”。正如他所说，“这种攻击对朝鲜来说是理想的，为政权提供了一种在无法追源的情况下攻击[韩国]和美国利益的手段，并越来越多地用于包括军事、政府、教育和商业机构在内的各种目标。”


  该国精英网络战士中的许多（并非全部）都是 `121 局` 的成员。根据公开估计，到索尼黑客事件发生时，该部门的人员已从几百人增长到几千人。（其他估计数字要低得多：一位叛逃者被引用说，他认为朝鲜只有几十名顶尖黑客。）许多受过良好训练的黑客在首都平壤享有相对特权的生活，可以进入政府更好的学校、住房和医疗机构。他们很早就被招募；根据一名在
  2011 年教授计算机科学的叛逃者告诉阿尔及利亚电视台，在科学和数学方面表现出专长的小学生会被带到平壤，参加两所顶尖学校之一，即`金星 1 号`和 `2 号`中高中。“有一套金字塔型的天才招募系统，来自全国的聪明孩子——擅长数学、编程并具备顶尖分析能力的学生被选中并归类在`金星`，”他说道，“当他们从[`金星`]毕业后，会被送往朝鲜最顶尖的科技学院和大学，如`金日成大学`、`金策科技大学`以及平壤或咸兴[该国东海岸附近的一个城市]的其他大学。”


  朝鲜少数公开已知的网络战士之一赵明来毕业于著名的`米里姆学院`（Miriam College），这是该国顶尖的军事技术学校——西点军学院和卡内基梅隆大学的结合——并在
  20 世纪 90 年代协助开发了一种名为 `Win32/JML` 的恶意软件，专门针对韩国的 `Windows` 系统。


  朝鲜团队与其他对手密切合作，采用了伊朗在 2012 年夏天对`沙特阿美石油`攻击的战术。英国政府通信总部（`GCHQ`）前主管罗伯特·汉尼根（Robert Hannigan）表示：“我们必须假设他们得到了伊朗人的帮助。”


  ### 2013 年逻辑炸弹攻击


  2013 年 3 月 20 日下午 2 点，韩国的三家银行和两家媒体公司发现其计算机被所谓的“逻辑炸弹”抹除。这是一种恶意软件，一个名为 `AgentBase.exe`
  的文件，它在预设时间“爆炸”，清空了受感染计算机的硬盘并重启计算机。当设备重启时，一切无迹可寻：用户只收到了一条令人心惊肉跳的消息：“未找到启动设备。请在硬盘上安装操作系统。”


  韩国两家主要电视台——`韩国放送协会`（`Korean Broadcasting System`）和 `MBC` 的员工均报告了大量计算机的丢失，三家大银行——`新韩`、`农协`和`济州`银行的员工也是如此。另外一个电视频频道
  `YTN` 和另一家银行`Woori`报告了较小且未成功的攻击。由于银行努力重置网络并重新允许提取现金，韩国各地的客户在几小时内无法使用 ATM 机。总而言之，受影响机构有高达
  32,000 台计算机因攻击丢失——这是一次针对知名目标的震惊且具有破坏性的打击。





  这种名为 Jokra 木马的恶意软件似乎是在前一天通过一封可疑的钓鱼邮件投送的。这封可疑邮件出自一个名为 DarkSeoul 的神秘在线团体的产物，人们一直认为该组织是朝鲜黑客，或者是得到同情中国黑客帮助的朝鲜黑客。Jokra
  木马似乎也是来自北方的警告信号：在攻击发生前几天，朝鲜国家媒体通讯社曾警告西方，该国“绝不会对敌人的网络攻击坐视旁毙，这些攻击作为其扼杀我们手段的一部分已处于非常严重的阶段”。它并未说明朝鲜显然面临着哪些网络攻击。那年春末之后，几家顶级网站——包括韩国总统的网站——在朝鲜战争爆发六周纪念日期间遭了
  DDoS 攻击。


  2013 年夏天，韩国的智库和其他朝鲜统一运动的倡导者也成为了间谍恶意软件的攻击目标，这些恶意软件会在用户系统中开启后门并试图窃取用户凭据。这次攻击被称为 `kimsuky`，其名称源于一名攻击者注册
  Hotmail 邮箱账户时使用的名字，该恶意软件是专门为为击败由一家名为 `AhnLab` 的韩国公司开发的流行安全软件而构建的。卡巴斯基的安全研究人员解释道：“恶意软件作者特选中
  `AhnLab` 的安全产品并非偶然。这些攻击者甚至根本懒意规避外国厂商的产品，因为他们的目标完全是韩国。”这些攻击似乎源自与朝鲜接壤的两个中国省份的 IP 地址，并通过保加利亚的一个命令与控制服务器进行路由。


  到第二天夏天，朝鲜的网络活动展现出特别的创造力：他们通过隐藏在免费手机游戏中的恶意软件感染了近 20,000 部韩国手机，这些软件允许他们窃听或激活用户手机的视频。游戏长期一直是他们作案手段的一部分。多年来，朝鲜部分通过使用自动化工具在韩国角色扮演游戏
  `Lineage` 中积累积分来为其网络活动筹集资金，他们再将这些积分转手卖给其他用户。


  在 2014 年的同一个夏天，在攻击索尼仅仅几个月前，朝鲜首次尝试通过网络压力对付让其领导丢脸的人。朝鲜政府在 2014 年 8 月向英国政府表示强烈抗议——就在电影《采访记者》首部预告片发布几周后——因为英国频道四台（Channel
  Four）宣布计划制作一部以朝鲜为背景的剧集。这部 10 集剧《对头头》（Opposite Number）将由马特·查曼（Matt Charman）编写，他是一位因主演汤姆·汉克斯的作品《间谍桥》而闻名的新锐编剧。当剧集创作者解释其剧情时：“在世界上最秘密的国家朝鲜执行一项秘密任务时，一名英国核科学家被俘了，引发了一场本身必须保密的国际危机。意识到他们的人可能被强迫帮助朝鲜最终实现核技术的武器化，英国首相和美国总统，这两个政治立场迥然不同的领导人必须合作，并动员其政府各级力量，将世界从边缘拉回。”查曼认为这部剧是一个次“揭开我们对朝鲜人民究竟是谁以及其政府真正想要什么的既有认知”的机会。


  而这恰恰是朝鲜所恐惧的——其政府将这部英国剧称为“丑名昭著的闹剧”，但当他们的抗议未能阻止制作时，黑客攻击了频道四台。攻击在造成任何损害之前被发现，频道四台谨慎地继续进行，但索尼攻击进一步冷却了该广播机构的雄心。在索尼攻击之后，由于没有其他投资者站出来资助该剧开发，该剧被停产。


  随着对索尼攻击的展开，显而易见朝鲜已经吸取了 2013 年针对韩国银行攻击的教训——也许频道四台的快速行动阻止了一场此前可能发生的灾难性攻击。成功的网络攻击可以在不发射任何导弹的情况下从远处扰扰并瘫痪一家公司。


  ![](img/00006.jpeg)


  当索尼攻击进行时，索尼通过其在纽约的总法律顾问尼科尔·塞尔格曼（Nicole Seligman）几乎立即联系了 FBI，这正是应该采取的做法。“她知道该找谁，”莱顿（Lynton）说道，“这对我来说是重大的教训之一。当这些事情发生时，你只需要打电话。”尼科尔自己曾在政府工作过，她知道当公司声誉受到威胁时，政府内部应该联系的人。在几小时内，一个由
  20 人组成的 FBI 团队被派往索尼，低调地协助公司的应对。他们在现场停留了两个多月。


  索尼泄露事件出现在我的早晨威胁简报中。我把团队召到办公室，询问我们如何帮助应对。*这是一个我们可以尝试破案的事件吗？* 恰巧，在索尼攻击前几周，我们重组了办公室，任命了一位新的副部长，其工作是关注“国家资产”，例如国家关键基础设施。这个新职位负责监督网络事件的响应，作为受害公司的联系点，并确保我们汇集所有的情报和执法资源。这个
  2014 年宣布的新职位和部门重组似乎是计划已久的。我们曾向国会简报这些拟议的变更并获得他们的许可，而且司法部内部也存在紧张情绪，我们试图从其他部门争夺更多的网络安全业务；最终，网络犯罪确实处理不完。当我告诉路透社有关重组时，“我们需要发展能力和带宽，以应对我们看到的不断演变的威胁。”


  我们选择了匹兹堡经验计算机犯罪检察官卢克·德博斯基（Luke Dembosky）接手新职位。卢克处理过最近几年最大的网络犯罪案件，包括 `GameOver Zeus`
  僵尸网络案，并协助协调了对“暗网之路”（Silk Road）论坛的打击行动。卢克还担任过司法部驻莫斯科大使馆武官，因此非常熟悉网络犯罪起诉的挑战；他花了两年时间与普京政府谈判了一项前所未有的协议，旨在缓解网络紧张局势，建立了核紧急情况下使用的莫斯科-华盛顿“热线”。当索尼攻击发生时，他加入国家安全局（NSD）还很新，甚至在办公室墙上只挂了一幅画。他后来向我开玩笑道：“国家资产计划是从对国家资产的猛一击’开始的。”





  虽然一家即将上映搭档喜剧电影的娱乐公司并不完全是我们预期的卢克（Luke）会保护的那种“国家资产”，但我们几乎立刻意识到索尼（Sony）案所代表的意义：这是一场外国敌国家对美国境内知名公司发起的破坏性攻击。在许多方面，这正是我们在人员配置和演习中一直在努力的目标，也是我们预言不可避免会降临在我们海域的事件。在危机会议和与其他情报机构同事的电话会议中，我们解释说，尽管索尼这样的目标看起来不寻常，但我们需要将这次攻击视为国家安全威胁，并迅速采取行动：一是帮助受害者恢复运行——这种帮助本身就是一种威慑，向攻击者表明他们无法让一家公司陷入瘫痪；二是查明出作手是谁，以便我们能够公开这些信息并施加公开后果。第二个目标从第一天起就刻在我脑子里——我们的反应不能仅仅局限于情报圈，这一点至关重要。为了实现这一点，我们需要两点：对攻击者是谁达成明确共识，以及一份清晰的应对方案。这次攻击并不一定是战争行为——我们的反应也不应将其视为战争——但在“代码战争”（Code
  War）中，其运作受长期条约和国际法的约束较少，更多取决于实时创建和完善的规范，因此我们需要强有力的行动。


  ![](img/00006.jpeg)


  当我们忙着应对对索尼不断升级和扩大的攻击时，我们意识到自己在网络领域所依赖的工具是多么不成熟。自从莉莎（Lisa）作为国土安全顾问进入白宫以来，她一直致力于制定所谓的“气泡图”，以划定哪些机构处理何种网络事务。她在国家安全委员会（NSC）还协助创建了所谓的“网络响应小组”（CRG），该小组效仿了国家安全委员会的反恐安全小组（CSG）——后者是一个运行已久、高度精细的行动小组，用于应对恐怖主义事件。在攻击或预备攻击发生时，CSG
  会按小时、甚至在某些时候按分钟为单位协调政府的反应。但对于网络事件，从未存在过类似的机构。当国家安全委员会介入网络问题时，通常只处于进展缓慢的政策领域，帮助协调多个机构之间持续数月甚至数年的对话。她意识到，我们在网络安全领域需要一个针对作战信息的类似机制。事实证明，索尼攻击是
  CRG 首次接受测试。


  在网络安全领域，我们还缺乏另一种在反恐中经常使用的工具——一种“全社区评估”，它汇集了来自执法和情报部门等不同机构的证据和分析。在 9/11 事件后的这些几年里，政府实际上建立了国家反恐中心（NCTC），正是为了这一角色：加速信息共享，并确保对威胁和正在发生的事件进行跨机构分析。NCTC
  是位于弗吉尼亚州北部的一个大型建筑群，其中央指挥部看起来像电视剧 `24` 中的场景，一侧是 FBI 探员，另一侧是 CIA 官员和分析师，还有几十个其他机构的席位。在反恐工作中，你有时会有不同的小组声称对同一次攻击归功——而实际的执行者可能根本不会认领功劳。NCTC
  的集体评估是建立对情况事实共同理解的关键，从而让政府决策者能够公开声明某某小组实施了某某攻击。考虑到恐怖主义攻击引发的生死决策——我们是否要发动军事打击作为回应？是否要启动救援任务营救人质？——对于坐在桌旁的政策制定者来说，拥有关于谁相信什么的清晰信息是至关重要的。


  上述这些过程在网络安全领域并不存在——这导致在最初关于索尼攻击的国家安全委员会会议上出现了一些波折，因为各机构提供的评估略有不同。网络溯源一直是技术分析与我们所谓的“全源”情报的结合，即政府通过开源报告（外国国家可能在公开场合说的话）以及通过更隐蔽的手段（如人力来源，即人力情报
  HUMINT，和截获的通信，即信号情报 SIGINT）收集的所有非网络信息流。这一过程实际上与调查员和检察官建立一个普通刑事案件的方式非常相似，但我们并不总是很好地将这种“全源”方法应用于网络安全；特别是在早期，一些
  FBI 的网络专家可能过于关注技术，忽略了需要构建的更宏观图景。


  对冲突的理论感到沮丧，白宫的莉莎·莫纳科（Lisa Monaco）向国家安全委员会的网络协调员迈克尔·丹尼尔（Michael Daniel）索要一份可以提交给总统的正式评估。“我习惯了，在恐怖袭击后的第二天早上，在我的[威胁简报]文件夹里总有一份文件列出关于谁负责的评估，”她说道。她希望网络攻击也能如此。


  丹尼尔警告说，没有机制可以产生莉莎所要求的评估，但他表示他会请求国家情报委员会（一个协调机构）的帮助。他们回复说，可以在 45 天内产生此类评估。“我简直疯了，”莉莎回忆道。我们没法等
  45 天；相反，莉莎要求 FBI 与其他情报机构协调，制定一份可以在总统每日简报中提交的评估。尽管如此，这事并非在一天之间完成的——评估大约花了一周时间才准备好。


  莉莎极力推动采取更快的行动。桌上的许多人已经在中国解放军（PLA）案中经历过其中的某些过程，这有所帮助——我们已经通过那个开创性的案例克服了许多最初的疑虑，并有了一套剧本，甚至还有莉莎所说的制度性“肌肉记忆”，即为了使信息公开需要采取的步骤。然而，挑战在于，解放军案花费了很长时间（实际上是多年）才解决了机构内部的反对并完善了公开展示的证据。在索尼案中，我们没有那种时间。虽然并非所有其他机构都同意，但我们
  FBI 和司法部敦促了快速、公开的行动。


  我们意识到我们需要建立非常快的节奏——我经常与 FBI 副局长马克·F·朱利亚亚诺（Mark F. Giuliano）和国家安全局副局长理查德·莱格特（Richard
  Ledgett）保持联系。我们三个人都同意，美国需要更加激进。对索尼的攻击是此类中的第一个，但我们知道还会更多。下一次我们需要准备得更快。“我们需要在政府应对网络威胁的反应中培养出与应对恐怖事件相同的肌肉记忆，”莉莎在索尼攻击两个月后，在威尔逊中心的一次演讲中这样说道。


  ![](img/00006.jpeg)






  随着政府各机构审查各自的证据以及攻击的不断进行，联邦调查局（FBI）和整个情报界并没有花费多久就锁定了犯罪者。随着证据的积累，嫌疑人名单的首尾都指向了朝鲜。由于今年夏天早些时候发生的“四频道”（Channel
  Four）事件——这一事件在当时不为人知，但我们情报界对此非常熟悉——我们已经意识到朝鲜似乎在网络上积极维护着其领导人的公众形象。每一项新增证据的出现都强化了这一假设，从攻击者使用的技术方法到攻击的“布景”，再到没有其他人有充分的动机去伤害索尼（Sony）。


  ### 第一：黑客的声明与行为分析


  首先，是黑客本人的声明和行动。为了分析这些内容，FBI 征佣了一个此前从未参与过网络案件的部门：位于宽昆蒂科（Quantico）的精锐行为分析小组，他们因追踪连环杀手以及对《沉默的羔羊》等流行文化作品的分析而闻名世世，被称为“画像分析师”。FBI
  暴力犯罪分析国家中心包含多个行为分析小组，协助执法部门对从反恐、轰弹到白领犯罪的各类案件进行刑事调查分析。2012 年，FBI 成立了网络行为分析中心（CBAC），将工作范围扩大到网络威胁领域。通过分析恶意网络入侵者的行为模式——从他们使用的恶意软件类型到与受害者交流的方式，再到黑客“布景”现场的方式——CBAC
  的画像分析师利用传统的执法技能来帮助判定网络恶意活动的归属。


  对于我们这些调查街头犯罪的人来说，这是一个熟悉的概念：任何留下的并非对犯罪执行至关重要的证据，都代表了犯罪分子想要向犯罪现场观察者传达的信息。行为分析师知道，当他们发现这类额外信息时，这些线索对于活动的归因非常有帮助。例如，除了删除数据的恶意软件外，索尼黑客在受感染的索尼电脑上留下了一个名为“和平守护者”（Guardians
  of Peace）的“启动屏”以及各种标志。分析师们检查了这些图像和恶意软件的源代码行，以找出隐藏在其中的信息。正如科米（Comey）后来解释的那样：“我们将其与已知朝鲜实施过的其他攻击进行了对比，他们说：‘对我们来说太简单了。这都是同一批人干。’”


  ### 第二：技术指纹


  第二类证据与黑客的技术指纹有关——针对索尼部署的恶意软件似乎是用韩语编写的，而且在技术上与我们看到的 2013 年 3 月针对南韩国银行和新闻目标的攻击有显著的重叠。科米后来说：“索尼攻击中的工具具有惊人的相似性。”当政府和私营部门的工程师剖析该恶意软件时，他们它是一个擦除器（wiper），旨在精确针对索尼的网络，然后系统地删除它所发现的所有内容。据美国安全应急响应小组（US-CERT）称，恶意软件文件通常标记为
  `usbdrv3_32bit.sys` 和 `usbdrv3_64bit.sys`，它们与位于意大利、泰国和波兰的命令控制服务器通信。恶意软件显示了黑客在发起攻击前对索尼网络进行了何么仔细的绘制：该工具在激活前确保自己位于美国或英国约
  50 个特定的索尼系统之一，然后依靠被攻破的用户账户访问系统。正如一位安全专家告诉《连线杂志》（*Wired*）的那样，该恶意软件“包含用户名和密码以及一份内部系统列表，它连接到每一个系统并擦除硬盘[并删除主引导记录]。”通过向命令控制服务器“拨打电话”，该恶意软件能够帮助攻击者仔细列出他们摧毁的服务器和电脑列表，每台设备都由一个
  IP 地址标识。


  ### 第三：红队分析


  第三，情报界仔细地“排除”了其他潜在动机和可能的涉案者，对每一项证据都分析除朝鲜以外的替代方案。这种被称为“红队分析”的策略在军事和情报案件中很常见，但在刑事案件中部署得相对罕见。科米回忆道：“我们从整个情报界引来了一支红队，说：‘让我们来攻一下这个。还有什么可以解释这一点？可能还有哪些解释？我们可能漏掉了什么？存在哪些竞争性的假设？评估可能的替代方案。我们可能漏掉了什么？’最后我们得出了相同的结论。”


  ### 第四：数字证据


  第四点，也是最有说服力的点，是额外的数字证据。在大多数行动中，“和平守护者”将他们的威胁和声明隐藏在代理服务器之后，以伪装他们的所在地。“科米后来说：“但他们几次很粗心。好几次，要么是因为忘记了，要么是因为技术问题，他们直接连接，我们看到了他们。我们发现用于发布和发送邮件时使用的
  IP 地址是朝鲜人专用的 IP。”


  当所有证据汇集齐，毫无疑问，攻击源自朝鲜。“在我一生中，没有什么是我能完全把握的。但我对这次归因非常有信心，整个情报界也是如此，”詹姆斯·科米（James Comey）几周后在对攻击的唯一公开评论中说道。


  ### “高信度”的定义


  “高信度”（high confidence）这个特定短语，对政府以外的人来说可能似乎仅仅是安慰，但科米希望将其理解为情报界使用的一种技术定义——这个术语的含义比公众意识到的要深得多。政府将攻击归因于朝鲜的“信心”水平，恰恰是莉莎（Lisa）在白宫局势室里快要疯狂的原因：*情报界究竟相信什么？*


  对分析评估的相对“信心”水平进行标记，在过去的十年中已成为情报界的关注焦点；由于情报分析既是艺术也是科学，在提交给决策者的结论中总是存在某种程度的不确定性。自
  20 世纪 60 年代以来，美国的情报界一直苦于如何在为总统等决策者准备报告时表达他们的分析不确定性。“诗人派”（强调分析的艺术性）与“数学家派”（追求精确性和概率）之间存在着长期的争论。从那时起，情报界开始在提交报告时非常强调其评估的“信心”程度——试图捕捉一个结论相对于另一个结论的相对不确定性。正如前
  CIA 代理局长迈克尔·莫雷（Michael Morell）解释的，“事实证明，伊拉克战争真正的错误并不是他们得出的判断，而是事实：如果他们真的考虑过，分析师们只会说他们对萨达姆拥有大规模杀伤性武器的判断只有低信心。那将是一个完全不同的信息，不是吗？”





  正如莫雷（Morell）所说：“从伊拉克战争中学到的教训是，要真正关注你对自己所做判断的信心程度。‘不仅认为明天会下雨，而且对此很有信心’，或者‘明天会下雨，但你们要知道我对此的信心很低’。”


  今天，当情报部门做出评估时，他们会在结论中加入三种免责说明之一，以解释分析师对自己决策的信任程度。“低置信度”评估意味着“信息的可靠性和/或合理性存疑，或者信息过于碎片或缺乏充分证实，无法做出稳妥的分析推断，或者我们对来源存在重大疑虑或问题。“中等置信度”反映出“信息的来源可靠且合理，但质量不足或证实不充分，尚以支持更高水平的置信度。”最后，“高置信度”表示分析师的“判断是基于高质量的信息，和/或该问题的性质使得做出稳妥的判断成为可能。”


