  # 致谢


  这是一本关于他人成就的书。我们政府敬职的公共人员是世界的典范。我有幸在华盛顿特区美国检察官办公室、`FBI`以及司法部核心工作组共同共事的同事们，他们日复一日地在司法部工作，在法治下保护我们，并在此过程中不仅保护了我们的安全，也保护了我们的生活方式。我想特别感谢国家安全部门的同事们的工作，尽管我知道公开表扬并不是他们的动力。使命仍在继续。


  书中有很多人没有列出名字，因为他们不想引起关注，或者无法具名。重构过去四分之一反击网络攻击的经历表明，有成以十计——甚至数百——人的名字没有出现在前面的页面中，但他们作为政府或更广泛互联网社区的分析师、调查员、检察官、计算机科学家和网络工程师所付出的不懈努力，使得迄今为止的任何成功成为可能。我们在情报、执法和军事界的伙伴同样认为，我们需要更加公开和更积极地去瓦解那些试图在网络上制造伤害的人，并将起诉作为该过程中的工具之一，即使办理案件会使他们的任务变得更加困难。我希望能提到他们所有的名字。这是他们的故事：书中任何关于事实或判断的错误都是我的。


  在政府之外，我还想对参与这一故事的许多私营部门伙伴表示诚挚的感谢，从安全公司到社交媒体平台，再到信任我们代表他们寻求正义的受害者公司。


  我要感谢奥巴马总统赋予我担任国家安全部门助理司法检察长的荣幸；感谢罗伯特·S·穆勒（Robert S. Mueller）的领导，以及提供在`FBI`担任其幕僚长长的机会——没有比这更好的榜样了；并感谢莉莎·O·莫纳科（Lisa
  O. Monaco）的友谊、卓越的能力以及对国家的奉献性服务。


  我特别感谢迈克尔·盖诺诺（Michael Gaynor）和范妮·索特特（Vanessa Sauter）帮助收集法院记录、起诉书和其他研究，感谢我的编辑本·亚当斯（Ben
  Adams）的远见和耐心，以及 PublicAffairs 的梅丽莎·维罗内西（Melissa Veronesi）和梅丽莎·雷蒙德（Melissa Raymond）。在离开政府的新生活中，沃尔特·艾萨克森森（Walter
  Isaacson）、阿斯彭学院（Aspen Institute）以及我在 Morrison & Foerster 的新同事们欢迎了我，并让我继续工作于改善网络安全。


  感谢加雷·格拉夫（Garrett Graff），感谢你的技艺、幽默感和耐心：没有你，就不会这本书。我知道我在过程中的每一分钟都在斗争，在“故事需要被讲述”的信念与“尽可能少说话”的深层职业特性之间挣扎。可不是一个合作者的理想伙伴。


  最后也是最重要的，我的家人。感谢我的父母，他们对公共服务的坚定信念。感谢我的妻子莎拉（Sarah）和女儿西尔维（Sylvie）。


