  `Chi` 那里携带另一批沉重的文件。完全不用，`Tai` 安慰她——他们走私的所有东西现在都可以装进一张 `CD` 里。事实上，当探员在洛杉矶机场拦截这对夫妇并搜查他们的包时，他们携带的仅仅是
  `Mak` 在餐桌旁为他们精心刻制的那些 `CDs`。


  单张 `CD` 就能装下从 `Chung` 地室挖出的所有纸质文件；事实上，`Dongfan Chung` 几十年来拿的每一件东西都能放入一张 `CD-ROM`
  中。而且几年之后，甚至不再需要物理 `CD-ROM` 了——他们从根本就不需要派遣间谍前往美国了。


  中国的“吸尘器”正在升级。![](img/00006.jpeg)


  2007 年初，我有机会回到 `Main Justice`（司法部总部），那是 FBI 探员搜查 `Chung` 垃圾后的几个月，当时该国正对如何在网络空间对抗中国进行大规模的重新评估。我成为了司法部
  `CHIP 计划` 的全国协调员，该计划是由遍布全国的受过专门培训的“计算机黑客与知识产权”检察官组成的网络。


  我的新工作位于 `CCIPS` 内部——这是一个在国家政策层面监督计算机犯罪的单位，与在实地审判犯罪的节奏相比发生了巨大的变化。到那时，我已经审判了大约 40
  起案件，并处理了更多许多未进入审判就通过认罪协议结案的案件。多年来，我一直觉得自己大部分时间都处于被动模式。在计算机犯罪部门内部工作完全不同。那里没有几个前审判检察官。当我到达
  `CCIPS` 时，惊讶地发现我记得许多担任美国助理检察官初期的面孔——许多从事计算机犯罪工作的人正是我几年前向他们学习数字搜索和查封程序的人。他们对这个问题有着深层且合情理的归属感。


  `CCIPS` 在许多方面都是司法部里的一个“异类”——其愿景可能比其日常工作量看起来要更有远见；在那里的里的讨论往往倾向于关于不断演进的技术和法律趋势的长期交谈。多年来，该部门并没有太多的“计算机犯罪”（该部门缩写中的两个
  C），因此检察官们一直忙于名称中的“IP”（知识产权）部分，即知识产权案件，这些案件通常关注实物。负责计算机犯罪的检察官们忙于远离国家级威胁的案件——起诉电子邮件垃圾邮件者、点击欺诈和试图欺骗在线用户及广告主的广告软件案件，以及版权侵权案件，并为检察官提供数字证据方面的帮助。


  虽然许多前线检察官对整个司法部普遍不信任——很容易将华盛顿的官僚看作试图阻碍或抢夺实地案件——但 `CCIPS` 在合作方面实际上有不错的声誉。`CCIPS`
  的检察官们非常支持，对技术和这一快速演变的法律领域非常精通，而且完全不“争地盘”。我曾与一些人（如 `Chris Painter`）共同处理 `DIGITAL
  GRIDLOCK` 和 `Joseph Colon` 案件。






  由于 `CCIPS` 重点关注中国，其工作目标是与中国官员合作，打击中国境内的知识产权犯罪，与海外同行会面，并通过商业团体和传统的国际执法渠道开展工作。除了经济间谍活动外，软件盗版在中国泛滥，非法的盗版
  DVD 和音乐 CD 盘在各大城市的街头上公开售卖。在这些双边讨论和 `CCIPS` 内部对话中，焦点并不是国家级活动。正如我以前在基层担任检察官时一样，当收到可能某个国家参与了窃窃行为的信息时，我们会把信息送往司法部情报办公室或
  `FBI` 反间谍部门的闭门会议。


  我加入 `CCIPS` 仅几个月，就开始与莉莎·莫纳科（Lisa Monaco）交谈。我们之前在华盛顿美国检察官办公室共同担任检察官，现在她是主任罗伯特·穆勒（Robert
  Mueller）的特别顾问。她即将成为 `Mueller` 的幕僚，并正寻找人接替她目前的特别顾问职位，而 `Mueller` 总是希望这个职位由具有检察官背景的人担任。随着对话的持续，她解释说
  `Mueller` 认为 `FBI` 应在网络安全方面投入更多精力，特别是弄清楚如何应对国家级威胁。我早已亲眼看到 `CCIPS` 将其使命视为对犯罪集团的起诉，而非对国家级威胁的起诉。在宾夕法尼亚大街的主司法部对面，随着该局继续其
  9/1 之后的演变，从一个国内执法机构转变为以国家安全为核心的情报机构，它开始意识到网络是地平线上的下一个国际威胁——而 `FBI` 已经落后了。莉莎说，我的首批项目之一就是帮助该局弄清楚如何应对这种威胁。


  ### 爱沙尼亚网络攻击


  那时，我们不需要远看就能找到关于风险可能有多大的真实案例。当我开始与莉莎以及 `Mueller` 办公室的人讨论 `FBI` 需要提高其网络能力时，波罗的海国家爱沙尼亚遭受了似乎是世界上第一场针对国家基础设施的大规模网络攻击。


  2007 年 4 月底，爱沙尼亚政府移除了一座在首首都塔林林立已久的六英尺苏联士兵像。随着少数族俄罗斯人的抗议，暴乱爆发。随后，一个巨大的僵尸网络发动了攻击，用涌集的恶意流量淹没了该国几乎每一个主要网站，从报纸到政府服务器。ATM
  自动取款机瘫痪。政府服务陷入停滞。“这些攻击针对的是爱沙尼亚共和国的核心电子基础设施，”国防部长亚克·阿维克苏（`Jaak Aaviksoo`）后来说道，“所有主要的商业银行、电信公司、媒体机构和域名服务器——互联网的电话簿——都感受到了影响，这影响了大多数爱沙尼亚人口。这是僵尸网络首次威胁到整个国家的国家安全。”
  攻击持续了几天；许多恶意僵尸网络流量似乎源自属于俄罗斯商业网络（Russian Business Network）的服务器和 `ips`，该网络是总部位于圣彼得堡的在线网络活动活动巢穴。攻击来自俄罗斯这一点毫无悬疑——但在多大程度上是政府支持的仍然是一个公开的谜团。这次攻击引起了全球关注，并引发了困难的问题。爱沙尼亚是北约成员：他们能否援引“第五条规定”，宣布自己遭受攻击，并集结欧洲和美国为他们保卫？针对网络攻击，你能够发起多大现实世界的反报？在美国，爱沙尼亚攻击的新闻也让情报界重新审视了那些不断探测美国关键基础设施的外国黑客；网络安全的挑战之一在于，你作为黑客在报复性打击之前铺设的基础——一种你只有在自己遭到攻击时才会发起的攻击——与先发制人打击的准备工作看起来一模一样。我们需要担心到什么种程度？


  ![](img/00006.jpeg)


  ### 与罗伯特·穆勒会面


  我对我第一次与 `Robert Mueller` 会面记忆最多的是那次简短的面试。在听了多年关于他严厉交叉质询的故事后，在我走向霍佛佛大楼七楼套房很久以前，就做好了准备并坚定了意志，以迎接一场漫长的访谈。


  `Robert Mueller` 是美国助理检察官中的传奇人物；我从法学院时代起就关注他的职业生涯。他在 20 世纪 80 年代司法部内部晋升，在乔治·H·W·布什（`George
  H. W. Bush`）总统任内担任刑事部负责人。随后，当该届政府结束时，他在私人律师事务所只坚持了大约一年，就给当时华盛顿的美国检察官埃里克·霍德（`Eric
  Holder`）打了电话，请求回来担任一线检察官。这大致等同于一名三星将军退休后重新入伍成为一名少尉；然而，`Mueller` 将一生献给了公共服务，在 20
  世纪 60 年代自愿加入陆战队前往越南，他在起诉案件时从未比那时更快乐。他在 20 世纪 90 年代在华盛顿处理杀案（我后来也做过这份工作），然后担任旧金山美国检察官，接着在乔治·W·布什政府初期担任助理司法检察长，随后在
  2001 年夏天被任命为 `FBI` 局长并在 9/11 发生的一周上任。在之后的几年里，我的几位朋友和同事都有机会为他工作，不仅莉莎，还有肯·韦斯坦（`Ken
  Wainstein`，他在担任华盛顿美国检察官期间聘用了我，后来成为了 `Mueller` 的幕僚）以及马特·奥尔森（`Matt Olsen`，我的老友，曾担任
  `Mueller` 的特别顾问，后来担任国家恐怖主义中心主任）。我们四人都得出了相同的评价：`Mueller` 看起来就像是从历史书中走出来的人——专注、正直、谦逊且诚实。在一个有时过于关注自我和虚表的城市里，他几十年来一直埋头工作，让他的成果说话。


  那天坐在 `Mueller` 的办公室里时，我们直接进入了面试。`Mueller` 从不擅长闲聊，但他知道自己应该做出努力，所以用他那干练的检察官风格问道：“结婚了吗？”
  *是*。“呢？” *不是*。接着他就转向了其他话题。在几个问题之后，面试结束了。我站起来，意识到自己将为一个传奇人物在一个传奇组织中工作。


  2007 年 6 月，我第一次来到那座名为埃德加·霍佛大楼的巨大布鲁主义风格混凝土建筑上班，进入了设有 `FBI` 局长办公室的七楼套房。我的任务：弄清楚 `FBI`
  如何应对网络安全。我花了几个月时间听简报、实地考察站点，并与一直在调查网络威胁的小少数探员、分析师和技术人员交流。





  突然之间，我终于明白了华盛顿美国检察官办公室那紧锁的大门另一侧到底发生了什么；我获得了这幅画面的另一半信息。而事实比我想象的要糟糕得多。当 `Mueller`
  局长前往弗吉尼亚州北部参加所谓的“国家网络调查联合任务小组”（`NCIJTF`）时，Lisa 正在他身边。那是该局仍在完善的尝试，旨在创建一个类似于“反恐联合任务小组”之成功的国家级多机构团队。`NCIJTF`
  这个名字读起来很拗口，`Mueller` 在演讲中总是很难读准它；通常他直接称其为“网络任务小组”。该小组是根据 `Shawn Henry` 在华盛顿分局协助建立的一个网络小组模式建立的，该局领导层希望这种模式能够推广到全国。


  Lisa 和局长参加了一场大开眼界的简报会，分析师和探员向他们详细介绍了他们在网络格局中看到的两个主要的国家级威胁：中国和伊朗。伊朗是网络上的一股崛起力量，但中国已经非常成熟且老练。“这就是情报人员一直在强调的，”Lisa
  回忆道，“中国才是那只大老虎。”


  这类会议促成了一个由探员和局领导组成的小组，包括 `Lisa` 和当时的局长首席 `Lee Rawls`，他们开始重新评估 FBI 对计算机犯罪投入的各个方面——从投入数字取证的资源到应对这些威胁的团队结构。


  在七楼，`Lee Rawls` 一直在推动该局更深入地参与网络安全工作，他的话非常有分量。他是 `Mueller` 最亲信的密友；他们的友谊可以追溯到普林斯顿大学的时代。在之后的几十年里，他成为了一名经验丰富的华盛顿通达人——一位资深律师、曾任助理检察长、共和党参议院多数党领袖首席，还曾担任
  `Pennzoil` 的政府事务负责人并在国家国防大学任教。`Mueller` 在 21 世纪中期将他招入 FBI，以帮助应对 9/11 事件以来 FBI 经历的、官僚体制极其险恶的演变。`Raws`
  是一个彻头彻尾的共和党人，但在局里他扮演的是一个非政治的角色——利用他冷静的影响力、与 `Mueller` 的长期交情以及他对华盛顿政坛的了解，帮助 FBI 免于陷入政治。（Lee
  是少数几个能与 `Mueller` 局长平起平坐的人之一——而且并不害怕直面局长。`Mueller` 曾经讲过一次特别激烈的高层会议，据他描述，当时 `Mueller`
  显得“有点没耐心且脾气不好”，而 `Raws` 突然打断会议，随口问了一道：“FBI 局长和四岁小孩有什么区别？”全场陷入了沉默，随后 `Raws` 给出了他尖锐的反驳：“身高。”）


  等我加入团队时，FBI 已经经历了了数年的重大变革，这场变革始于 9/11 袭击后的几个小时内。在袭击发生的最初几天里，`Robert Mueller` 收到了
  `Bush` 总统一个非常具体的指令：“绝不再发生。”根据 `Mueller` 的说法，他在恐怖袭击发生后不久就向 `Bush` 总统进行了汇报，并开始逐一介绍
  FBI 在识别劫持者和追踪他们的联系方面取得的快速进展。总统中断了他，说 FBI 调查袭击固然很好——他相信 FBI 会做得很好——但他对 `Mueller`
  的问题非常简单：你们正在做什么来阻止下一次袭击？这是一个令人震惊的评价，它颠覆了 FBI 直到当时的 90 年历史。FBI 关注的是通过事后调查来打击犯罪——在银行抢劫者抢完银行后再抓住他们。但在恐怖主义的世界，大规模攻击的灾难性后果，以及
  9/11 事件中自杀式攻击者抵达美国，使得事后调查变得必要但并不充分。FBI——事实上，美国政府的所有工具，包括其情报机构和军队——都必须在恐怖主义发生之前被动起来阻止。成功不再被视为在家属哀伤时破案。成功是防止袭击从根本上发生。


  这是 `Mueller` 在担任 FBI 局长的 12 年里经常讲述的故事。我觉得自己可能亲耳听过 150 遍了。但他对这个故事及其传达的信息反复且无休止的强调，让我深刻理解了如何实现成功的文化变革：细节固然重要，但你不能忽视大局——文化和使命——作为领导者，你必须赋予组织中的每人去创造性地解决那些你无法想象的问题。


  这对 FBI 来说这一切都不容易——这不是什么微小的文化变革，也不是小小的官僚之争。事实上，即使在我 9/11 多年后到达这里时，FBI 也陷入了一场近乎生存的战斗中。在袭击之后，许多国会山领袖和情报老兵曾提议拆分
  FBI，成立一个“美国 MI5”，即一个专注于反恐和间谍活动的国内情报机构。`Mueller` 作为一名终身的司法部老兵，认为 FBI 保持完整至关重要，正因为
  FBI 将执法与情报完美相结合，并因为它植根于司法部并向司法部长（政府指定的宪法保护者和执行者）报告，国家才变得更强大、更安全。但如果 `Mueller` 在变革上失败了，美国执法的整个结构将发生改变。


  当时 FBI 的格言（作为其 9/11 后变革的一部分）是“威胁驱动、情报引导”，这意味着该局关注的是它和其他三字母机构能够收集到的特定的、可定义的威胁。


  头号威胁显而易见：基地基组织。反恐工作仍然占据了全部精力。当我为 `Mueller` 在 FBI 工作时，我的大部分时间——FBI 几乎每个人的大部分时间——仍然集中在恐怖主义上；今天很难忘记在
  2007 年我到达该局时，威胁格局是什么样子的。9/11 袭击已经发生五年多年，而之前的 2006 年夏天，可能是国家安全领域自 9/11 袭击发生后几个月以来最紧张的时期。西方情报机构曾拼命追踪一项可能导致毁灭性的计划，即使用过氧化氢基的液体炸药击落多架跨西洋飞机。最终，英国警方在
  8 月初于英国境内逮捕了 26 人。新闻报道和政府简报概述了当局如何在计划的最后阶段阻止了该行动——这是一场协调的攻击，涉及十多名自杀式攻击者，同时攻击飞往美国途中的三到十架飞机。死亡人数将轻易达到数千人；对国际旅行和商业的损失将轻易达到数十亿美元。




  尽管基地组织的威胁依然真实且紧迫，但 `FBI` 内部越来越多的声音——例如时任助理副局长 `Shawn Henry`——告诉我们，联邦局也需要向前看，预判网络威胁的兴起，并投入资源来应对它。我们在关注国际恐怖主义上花费了太久；他们的观点是，我们不应该在网络安全上重犯同样的错误。


  联邦局内部转型的另一位领导者是 `Steven Chabinsky`，这位律师在童年就被文本类游戏 `Adventure` 所吸引。在 20 世纪 90 年代的
  `FBI`，克林顿总统早期网络计划的背景下，`Chabinsky` 帮助组织了一项由局主导的、名为“国家基础设施保护中心”的工作。他后来回忆道：“在当时这是一个不可思议的概念，直到今天这种策略仍然是正确的。其核心理念是，多个政府机构和私营部门必须通力合作网络犯罪。”我最初是在担任检察官时认识
  `Chabinsky` 的，在转入 `FBI` 之前曾数字案件向他寻求过建议。


  在 `Lisa Monaco` 和 `Lee Rawls` 的支持下，`Chabinsky` 和 `Henry` 一直在为 `FBI` 网络工作的组织化而战战。当时的联邦局甚至无法很好理解
  `FBI` 自身掌握了哪些信息。在一个网络案件中，`Henry` 和 `Chabinsky` 发现多个分局处总共开启了 200 个针对类似威胁的案件。`Henry`
  后来说：“事实证明，当你查看所有情报并开始将其汇总时，发现这其实是同一群人——而不是 200 个独立的群体。你想想，在 200 个独立案件中，行政和执行层面上投入了大量资源，但数据之间缺乏大量的交叉关联。如果你在组织内部和政府内部都建立一套基础设施，你就可以分析这类信息，并真正深入地了解敌人到底是谁。”


  `FBI` 于 2002 年成立了正式的“网络处”（`Cyber Division`），意识到传统犯罪（如儿童色情信息、身份欺诈和知识产权盗窃）正向在线迁移，同时互联网也新犯罪开辟了新途径。在
  2003 年 7 月的一场国会听证会上，“网络处”的新任助理局长 `Jana D. Monroe` 解释道：“这包含了‘网络恐怖主义’、恐怖威胁、外国情报行动，以及由于非法侵入美国计算机网络引发的犯罪活动，包括对计算机支持的操作的破坏以及通过互联网盗取敏感数据。`FBI`
  评估认为对 `U.S.` 的网络威胁正在迅速扩大，因为能够利用计算机进行非法、有害且可能造成毁灭性目的的人员数量正在增加。”


  在此之前，数字犯罪在联邦局内部几乎是零散地处理的，缺乏全国性的协调，少数精通计算机的探员开创了新的调查技术，并将这所国内执法机构的角色推向了海外。但这些探员已经确定，网上并不缺少令人困扰的案件。


  尽管 `FBI` 的准军事化结构具有高度的等级森严，但其文化是高度去中心化的。56 个办事处中的每一个都由一名特勤探员监督，负责该地区范围内调查的方方面面。几十，案件都是逐案办理的。

  ...（此处省略重复内容，根据要求保留核心语义）...


  鉴于威胁的规模，`FBI` 的进展严重滞后；大多数主要的网络案件仅源于少数小组，主要位于亚特兰大和匹兹堡。我们需要从联邦局在反恐领域的转型中汲取教训，并在网络安全领域采取同样的方法。长期以来，我们一直把“网络”视为一个技术问题，一个你只需要沿着线缆追踪比特和字节的问题。黑客也是人。为了抓住他们，我们需要从人的角度去理解他们——他们的动力是什么，他们希望实现什么目标，他们的老板是谁，以及老板的老板又是谁。例如，为了对
  `China`，我们需要培养新的团队——探员、分析师和检察官——他们要精通政治和军事，而不仅仅依赖那些能够追踪 IP 地址和破解防火墙的人。




  穆勒和我们的团队会走到 FBI 的指挥中心，那里被称为“战略信息与行动中心”（SIOC），与司法检察长及其副部长进行晨间威胁简报。SIOC 位于霍佛大楼的核心区域，是
  20 世纪 90 年代俄克荷马市爆炸案后发明的，旨在帮助 FBI 管理和应对不断发生的危机。这里设有供来自政府各个部门的数十名人员的工作站，以及几间高科技但陈设的会议室，用于召开简报。


  我们每天早上的第一个小时都在讨论国家面临的最危险威胁。越来越多，这些威胁属于网络安全领域。我开始充分意识到中国对美国工业和政府黑客窃取是多么猖獗。就在我调入 FBI
  的同一个月，五角大楼发现中国军方成功渗透了国防部长罗伯特·盖茨办公室内的一台电脑；那不是一台敏感电脑，但五角大楼被迫将该特定网络下线了多周，以确定损失。


  在司法部正常的私营部门拓展工作中，我们当我们与行业领袖或贸易协会交流时，经常听到关于中国黑客攻击的类似故事。我们一贯听到公司内部巨大的挫败感，这并不是针对中国的盗窃，而是针对
  FBI 在调查网络犯罪时的行为。他们会说：“*告诉 FBI 还有什么意义呢*，*我们的信息就那样消失在一个黑匣子里了，我们永远得不到任何回音。信息仅仅是单向的。而且，我们甚至不确定是否想经历起诉的程序——FBI
  会为了收集证据而扰乱我们的运营，还是中国会完全将我们踢出市场？*”公司能看到这种经济窃取带来的麻烦——以及长期风险——但他们将此与与中国做生意带来的短期成功和扩张可能性进行了权衡。毕竟，被完全踢出中国市场，似乎比目前从他们网络中被盗取的任何东西都更像是一种生存风险。


  这些故事——以及我们自己的情报——令我们日益担心正有一股间谍和窃取浪潮正在掠夺美国企业。然而，我们也知道，大多数公司和董事会对对此多么不愿采取任何行动。


  我记得访问过西岸的一家公司，听取了一场简报，介绍了他们是如何仔细权衡与中国对抗的利弊的。他们的图表显示其中国业务目前处于盈利状态。他们知道自己的知识产权正被中国黑客窃取，他们预测了利润曲线，清楚地显示在七、八年后，被盗取的
  IP 将摧毁他们的业务模式。到那时，一个中国竞争对手将能够利用他们被盗取的信息以更低的成本提供产品。但那天，总法顾问在他们的执行会议室向我解释说，他们仍然盈利——并且不希望政府干预并打乱计划。


  我们试图说服他们这种思维方式是愚蠢的。我的语气中流露出而易见的挫败感，我指出他们自己的计算如何显示了他们最终的死亡。“你们在向我展示——你们已经做了预测——到那时你们想扭转业务就已经太晚了，”我说。


  总法顾问实际上同意我的评估，但他解释说，公司董事会在此时刻的首要任务是提高股东价值。谁能知道未来会发生什么？公司的领导层可能会变化，可能会有一些新的行业创新。但在那个时刻，他们想维持现状。他以一句令我摇头的话结束了对话：“我们会回来找你们并抱怨的，但我们现在还没到那个地步。”


  ![](img/00006.jpeg)


  在李·罗尔斯（Lee Rawls）办公室的多次对话中（那里就在穆勒局长套房隔壁的一条走廊），李、莉莎和我以及其他人讨论了政府在网络空间对华政策的愚蠢之处。中国已经是世界第二大经济体，正努力追赶美国。为了实现这一点，它通过掠夺我们的经济优势以惊人的速度建立自己的工业和经济。与冷战期间的苏联不同，中国知道在军事上无法与我们竞争——因此转而依靠隐蔽的威胁和机会来获取利益。中国的间谍活动遵循一种被称为“沙子”的哲学，在地缘政治上相当于“千刀割”。它最大的资源是人，旨在收集许多可以产生性影响的微小窃取。


  美国的持续沉默毫无意义。随着中国实力的增长，对抗中国不会变得更容易容易。每一天被浪费的时间都给了他们额外的优势——一种以美国工作岗位、创新和生产力为代价的非法优势。无论我们是否承认，我们处于一场危险的战斗中。


  中国的行为似乎远超国家间通常允许的间谍活动。虽然美国情报机构竭尽全力获取其他国家的经济、军事和政治信息，但美国政府并不参与旨在造福私营部门的间谍活动——我们没有通过获知中国航空公司的做法来帮助波音，也没有帮助孟山公司了解中国的农业系统。然而，中国正在利用政府的力量和资产为企业创造不公平的竞争环境；它正在帮助私营部门挑选赢家。


  政府主导的经济间谍活动历史悠久且复杂。例如，俄罗斯甚至法国多年来将其国家努力转向帮助私营部门和关键工业。众周知，20 世纪 90 年代商业高管被警告法国航空的头等舱被认为被监听，以此帮助法国高管在坐下谈判之前了解访客的计划——正如摩托罗拉在巴黎向法国电信（现名为
  `Orange SA`）推销时发现的，法国代表似乎对他们的计划了如指。


  最终，我们意识到中国的经济活动——像所有间谍活动一样——是一种成本效益分析：中国获取的经济收益是否超过了它因该活动而面临的地缘政治成本？在 2007 年，这对中国来说是一个很容易的决定：我们完全没有施加任何成本。罗尔斯认为是时候改变现状了。我们需要找到一种干扰中国经济间谍活动潮流的方法。






  # 要了解我们可以对挑战中国的网络行动采取哪些措施——并最终什么方法对重塑其行为有效——首先需要理解这个新兴的亚洲超级大希望通过其在线活动实现什么目标。中国长期以来将互联网作为加速其崛起、增长和现代化的工具，尽管它对网络化所带来的通信和信息自由一直抱持警惕。确保国内经济稳定——反过来确保政治稳定和执政共产党的未来——驱动了中国在世界舞台上的几乎每一个其他决策。中国共产党展现出了非凡的韧性和适应能力，比苏联多生存了几十年，而且其现代化努力使其避免了像北朝鲜和古巴等其他威权政体所经历的经济瘫痪。


  毛泽东失败的集体化努力在 20 世纪 60 年代严重破坏了国家经济，随之而来的饥荒导致超过 3000 万人死亡，使国家比朝鲜还要贫穷。到 1979 年，共产党改变了策略，放宽了经济限制，允许某种形式的私有市场经济再次出现。邓小平规定：“让一部分人先富起来，然后再大家一起富起来。”《纽约人》杂志负责报道中国的资深作家埃文·奥斯诺（Evan
  Osnos）写道，中国随后的崛起是“规模是工业革命百倍、速度十倍的转型”。1978 年，中国的人均收入仅为 200 美元，直到 2005 年，仍有 2.5 亿中国人（略少于美国总人口）每天生活费不足
  1.25 美元，人均收入仍在 3000 美元左右。但到 2014 年，人均收入已跃升至 6000 美元，在短短十年内翻了一番。


  互联网和数字世界是这种增长的关键驱动力；在许多领域，数字进步帮助中国在惊人速度工业化和现代化的，跨越了西方世界的几代技术和产业。互联网于 1996 年 1 月进入中国，当时每百名居民只有五条电话线。那年
  8 月，中国开始限制某些在线内容，仅仅一年后，《连线》（*Wired*）创造了“防火长城”一词，指代中国通过该系统限制对外部世界的访问并禁止某些具有潜在威胁的政治内容的系统。


  中国没有对应英文术语 *cyber*（网络/赛博）的正式词汇。我们倾向于将 *cyber* 涵盖在线进攻和防御、宣传努力和隐蔽措施，而中国战略家以一种微妙不同且更广泛的方式定义在线领域，用“网络战略”特指技术性的在线防护，而用“信息安全”指代一系列旨在在线影响他人的工具和行动。


  盟军行动（北约在南南哥维亚的空战）在美国很大程度上被遗忘了，但它极大地改变了中国军队的方法。1999 年 5 月 7 日，美国 B-2 隐形轰炸机在目标定位员将其误认为仓库后，意外击中了位于贝尔格莱德的中国大使馆，导致三人死亡。轰炸引发了中国政府的愤怒，谴其为“野蛮攻击”，该事件加剧了国际紧张局势；在华美国外交人员面临了数日有时是暴力的抗议，黑客破坏了美国驻北京大使馆的网站。更广泛地说，这一事件促使中国军队加快了现代化进程；20
  世纪 90 年代初，军队曾紧张地看着美国军在海湾战争中轻易地从科威特击败伊拉克军队。“一位美国军事理论家得出：“中国领导人意识到，如果不将信息技术整合到武器装备中，解放军将面临被落下的风险。中国认为可以通过利用大量的信息工程师和拥有笔记本电脑的公民，而非仅仅依靠士兵来跟上其他国家。”解放军开始关注他们所谓的“针灸战争”，即针对敌人指挥系统和基础设施的特定节点和关键网络枢纽。在前南夫轰炸行动后不久，中国主席江泽民宣布互联网是“政治、意识和文化的战场”。


  “从战略上讲，信息时代战争的目标是摧毁敌人发动战争的意志。从战术上讲，目标是瘫痪敌人的电力系统，”中国领先的信息战争战略家沈卫光解释道，“[信息战争]的本质是以信息为武器针对人心。它攻击的是国家的意志、军队的士气和指挥官的决心。”


  为了对抗这种新武器，FBI 以及整个美国政府需要一种新策略。罗尔斯和穆勒局长委派我研究这项策略；我们没有多少时间来组织它。穆勒想要快速的结果，并希望在秋季前宣布一种新方法。在他担任局长期间，穆勒很少公开讲话。与华盛顿的许多人不同，他不喜爱灯光焦点。但那些罕见的高调演讲是他学习过程中的关键部分，使他与工作人员在构思要说的内容以及如何表述时，有机会深入研究某个问题。随着演讲的临近，我们会进行一次一次的简报。作为一名一生的检察官，穆勒无情地对向他汇报的人进行交叉询问，深入挖掘，熟悉特定问题的细微差别，并形成自己的观点。他准备得非常仔细，吞噬简报备忘录和他每晚带回家的阅读资料。一旦我们确定了想让他说什么，我们就会又一遍一遍修改草稿；他准备时就像每场演讲都是审判的结案陈述。


  为了弄清楚穆勒在 2007 年会说什么，我去了匹兹堡。


  ![](img/00006.jpeg)


  匹兹堡初看之下似乎并不是美国政府顶尖网络侦探最可能的地方，但在过去的四个世纪里，一个独特的计算机科学资源群围绕这个工业中心建立，其中包括卡内基·梅隆大学——这里是软件工程研究所（一个联邦资助的研究中心）以及美国第一个计算机应急响应团队（CERT/CC）的所在地，后者可以追溯到互联网上第一个可怕的日子：莫里斯蠕虫的意外爆发。在随后的几年里，匹兹堡发展了一整套关键网络资源的生态系统，包括国家网络取证与培训联盟（NCFTA），自
  1997 年成立以来，它可能成为执法部门处理计算机犯罪最重要的交换中心。NCFTA 是这座城市从一个垂死的钢铁镇变为繁荣、时尚科技枢纽的剧变的一部分——而正是这座城市，多年后
  Uber 首次部署了其自动驾驶汽车。






  从理论上来说，至少根据政府的图表，公私部门的信息共享本应该是美国国土安全部国家网络安全与通信集成中心等机构的职责范围，这是一个总部位于弗吉尼亚州阿灵格顿、拥有
  700 人规模、年产值达数十亿美元的尖端机构。然而在实践中，自 1998 年在莫农加希拉拉河畔成立以来，行业资助的 `NCFTA` 内部发展出的紧密合作已使其成为联邦调查局（FBI）过去十年许多重大网络犯罪案件的核心。


  这个低预算的研究团队由调查员、研究人员和工程师组成——实际上是网络安全工作的国家级教学医院——它已成为 `Microsoft` 等私营公司分享潜在犯罪案件信息的关键论坛，让分配到
  `NCFTA` 的 FBI 探员能够收集并分发案件。


  案件通常会留在匹斯堡，如果是这样的话，它们最终会出现在 FBI 主管 `J. Keith Mularski` 的桌上——这位开拓性的网络探员曾化名 `Master
  Splyntr` 的身份，并帮助将匹斯堡团队打造了一支中坚力量。


  当我听 FBI 探员谈论他们观察中国威胁的窗口时，我意识到并不是所有人认为我们能通过新方法取得成功。事实上，许多同事认为我们可能永远不会在黑客攻击问题上公开与中国对抗——考虑到全球唯一超级大国美国与崛起的亚洲超级大国之间复杂的地缘政治关系，我们收集的关于中国行为的情报高度机密且极其敏感。网络安全的政治实在太复杂了。一位
  FBI 科长告诉我，他不认为有人会足够关心并愿意冒着得罪中国的风险。


  `Mueller` 还在推动 FBI 的全部 56 个分办事处关注他所谓的“领域意识”（domain awareness），确保负责每个办事处的特勤探员了解他们所在国家特定地区的威胁——以及这些威胁与其他地区的不同之处。除了基地组织之外，世界上还有许多其他事情让我们担心；除了南美毒品集团等长期存在的威胁外，我们还看到来自东欧等地区的跨国组织犯罪的兴起。


  虽然这种“领域意识”在分办事处层面是有效的，但我很快意识到，我们并没有真正理解网络威胁的国际图景。我在自己的案件中见过这种威胁，其他人也根据他们在自己管土内见过的案件有自己碎片化的理解，但
  FBI——以及整个美国政府——并没有一个关于正在发生情况的全球性的、易于理解的图景。FBI 的网络能力仍处于起步阶段；我们得到的关于网络威胁的情报在复杂性和分析性上，远不如我们经常看到的有关恐怖主义威胁的报告。美国公司个人面临的网络威胁究竟是什么？


  为了回答这个问题，FBI 建造了一块巨大的电视屏——`NCIJTF` 内的一块墙大的显示器——它将数据流汇聚在一起，实时观察网络威胁的展开。我记得我惊讶地盯着屏幕，看着一个中国黑客潜入一家大学，然后从那里跳到一家私营公司，接着从该网络渗透一家国防承包商的服务器。我真的眼睁睁看着数据开始流回中国。


  这块屏幕是一个技术奇迹——本身就是一次重大的情报成功，将多个数据源整合为单一、易于理解的视觉呈现。但很难看着屏幕时去思考它。


