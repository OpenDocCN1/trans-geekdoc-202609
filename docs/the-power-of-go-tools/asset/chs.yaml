  \ `io.Writer` 打印 hello”的行为，只要我们记得用适当的软件许可发布它。\n\n### 测试的命名\n\n我们不仅为包编写了一个很棒的测试，该测试本身的*名称*也传达了一些有用信息。为了帮助我们思考测试名称说明了系统行为的什么，我们可以使用\
