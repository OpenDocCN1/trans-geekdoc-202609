  \n\n\n\n运行此测试用例再次发生了 panic（崩溃）：\n\n```\n--- FAIL: TestListItems_GivesCorrectResultForInput\
  \ (0.00s)\npanic: runtime error: index out of range [0] with\nlength 0 [recovered]\n\
  ```\n\n无需查看堆栈跟踪，我们就能猜出问题在哪里：如果 `items` 是空的，我们甚至无法引用 `items[0]`。另一个特殊情况是：\n\n```\n\
  \n```\n\n([Listing `game/7`](https://github.com/bitfield/tpg-tests/blob/main/game/7/game.go))\n\
  \n这个用例通过了。\n\n## 重构\n\n-\n\n我们之前看到，无论 `ListItems` 的代码看起来多么优雅，如果它没有执行正确的功能，那毫无意义。既然现在它*确实*执行了正确的功能，我们处于一个良好的境地，因为我们有了选择。如果我们现在——就在此时此刻——必须交付，我们实际上可以做到。我们并不会为此感到高兴，因为代码难以阅读和维护，但*用户*并不在乎这些。*他们*关心的是这是否解决了了他们的问题。\n\
  \n但也许我们不必现在就交付。手头剩下的任何额外时间，现在都可以用来重构这段正确的代码，让它变得更好。而且，虽然重构时总是存在出错或引入 Bug 的风险，但我们有一个安全网：测试。\n\
  \n顺便说一下，“重构”的定义是在不改变程序任何相关*行为*的下下修改代码。由于测试定义了我们认为的所有相关行为，我们可以完全自由地更改代码，并依靠测试在代码开始产生不同*行为*时告诉我们。\n\
  \n由于根据输入项的数量，我们有四条不同的代码路径，我们可以更优雅地将其写为一个包含四个 case 的 `switch` 语句：\n\n```\n\n```\n\
  \n([Listing `game/8`](https://github.com/bitfield/tpg-tests/blob/main/game/8/game.go))\n\
  \n我们破坏了任何东西或改变了任何行为吗？没有，因为测试仍然通过了。我们本可以一开始就使用 `switch` 语句来编写 `ListItems`，从而节省这个重构步骤吗？当然可以，但我们最终还是来到了这里，只是换了一条路而已。\n\
  \n事实上，所有良好的程序都会经历至少几次重构循环。我们甚至不应该尝试在一次尝试中编写最终程序。相反，通过首先追求编写*正确*的代码，然后对其迭代几次以使其清晰、易读且易维护，我们将获得好多的结果。\n\
  \n> *写作本质上是一个迭代过程。很少有作家能一蹴呵就写出一个完成的作品；我们大多数人都在圈子里工作，反复回到同一段散文上，添加或删除单词、短语和句子，改变思维顺序，并将一个句子扩充成数页的文本。*\
  \  \n\n> —Dale Dougherty & Tim O’Reilly, [“Unix Text Processing”](https://amzn.to/3ObAKDI)\n\
  \n## 那么，这很简单\n\n毫无疑问，这里还可以进行更多重构，但我认为你已经明白了要点。我们开发了一些正确的、相当可读的代码，并附带了完全定义了用户关心的行为的测试。\n\
  \n而且我们在实现这一点时，完全不需要真的费力去*思考*。没有需要解决的烧脑问题；我们不需要发明任何计算机科学领域未知的复杂算法，或者可能在某些工作面试中被考到的算法。我们没有使用\
  \ Go 的任何高级特性，只是基础的字符串、切片和循环。\n\n这是一件好事。如果代码很难写，它就会很难理解，调试起来更难。所以我们*想要*代码是易于写的。\n\
  \n> *每个人都知道，调试比编写程序要难两倍。所以，如果你在写程序时已经尽可能聪明了，你以后该如何调试它呢？*  \n\n> —Brian Kernigan\
  \ & P.J. Plauger, [“Elements of Programming Style”](https://amzn.to/3bF2mm)\n\n\
  如果我们发现代码很难写，就会缩小野心，转而解决更简单的问题。我们将以这种方式不断简化问题，直到代码变得简单而易。然后我们就可以逐渐构建回真实的目标。\n\n>\
  \ *起初会感觉很慢。区别在于，当我们完成时，我们是真的完成了。由于我们正越来越接近真正的完成，这种表面上的缓慢只是幻觉。我们消除了大部分在应该结束之后仍持续很久、漫长而痛苦的测试与修复阶段。*\
  \  \n\n> —Ron Jeffries, [“The Nature of Software Development”](https://amzn.to/3cUylzy)\n\
  \n一旦一旦熟悉，测试优先的工作流完全并不慢。它是快速、愉快且高效的，结果是正确的、可读的、自测试的代码。\n\n看着经验丰富的开发者在测试的指导下快速构建出优秀的软件，是一种变革性的体验：\n\
  \n> *我曾在一个几个小时内长出了一个报告框架，观察者完全认为这是一个戏法。我一定在脑海中已经想好了生成的框架。不，抱歉。我只是测试驱动开发足够长，以至于可以在你意识到我犯了错误之前就从中恢复过来。*\
  \  \n\n> —Kent Beck, [“Test-Driven Development by Example”](https://amzn.to/3OR9pqg)\n\
  \n\n\n\n\n# Go 的 `testing` 包是如何运作的？\n\n* 我们该如何编写测试来表达意图？我们该如何测试错误处理？我们该如何构建有用的测试数据？那些我们没有想到的测试用例怎么办？\n\
  * 即使测试通过了，如果仍然潜伏着 Bug 怎么办？我们该如何测试那些看似不可测试的内容，例如并发或用户交互？命令行工具又该如何测试？\n* 我们该如何处理依赖过多的代码以及耦合过紧密的模块？我们能否测试与数据库和网络\
  \ API 等外部服务交互的代码？依赖于时间的代码又该如何测试？模拟对象（mock objects）是一个好主意吗？断言（assertions）又如何？\n*\
  \ 当代码库完全没有测试时我们该怎么办？例如，遗留系统？我们能以安全、无压力的方式对其进行重构和测试吗？如果我们因为写测试而被老板责备怎么办？如果现有的测试毫无用处怎么办？我们该如何通过代码审查来改进测试？\n\
  * 我们该如何处理那些乐观、挑剔、过度精确、冗余、不稳定（flaky）、失败或仅仅是缓慢的测试？测试又如何帮助我们改进系统的整体设计？\n\n很好，很高兴你问这个问题。享受书的剩余部分吧。\n\
  \n"
