  \n![](img/file10.png)\n\n到本书为止，我们关注的是*应用*：直接解决用户问题的软件。但并非所有的软件工程都是关于编写应用程序的。\n\n\
  开发者还需要*工具*：用于自动化日常任务的程序和服务，例如配置服务器和容器、运行构建和测试、部署他们的应用程序等。\n\n而且，当然，这一切都依赖底层的*系统*软件，如操作系统内核、网络栈、集群编排器等等。必须有人来编写（并维护）那些东西。\n\
  \n## 一个现实的运维任务\n\n那么，Go 对于这类软件有多合适呢？我们知道 Go 在通用编程方面有很多优势：它快速、可扩展、可维护，开发者可以很快就能发挥生产力。但是，用\
  \ Go 来编写工具和系统代码又如何？\n\n嗯，也许吧。因为 Go 是一门具有强类型系统的编译型语言，编译器可以做很多工作来帮助我们编写正确的程序。Go 还会暴露运行时错误，使得它们很难被忽视（尽管遗憾的是，并非不可能）。反过来，这有助于我们产出健壮、可靠的程序。\n\
  \n### 匹配并统计日志行\n\n让我们思考一个典型的 DevOps 类型任务，例如统计日志文件中匹配特定字符串（例如“error”）的行数。编写这段代码的好方法是什么？\n\
  \n大多数经验丰富的 Unix 用户可能会编写某种 shell*流水线*（pipeline）来完成任务。流水线是一组通过输入和输出连接的命令，因此数据可以在它们之间流动，而整体作业控制由\
  \ shell 处理。\n\n例如：\n\n```\n```\n\n`grep` 命令过滤其输入，只产生包含“error”的行，而 `wc -l` 仅统计它接收到的行数。\n\
  \n这条流水线的整体效果是打印 `log.txt` 中包含“error”的行数。shell 让我们很容易以这种方式组合 `grep` 和 `wc` 等单个命令，从而实现几乎任何你想的操作。\n\
  \n### 一个快速的 shell 咒语\n\n但 shell 大师们可以做更多。例如，假设我们有一个 Web 服务器访问日志需要分析。这里是此类日志中典型的一行：它包含了客户端的\
  \ IP 地址、时间戳以及关于请求的各种信息。\n\n```\n203.0.113.17 - - [30/Jun/2019:17:06:15 +0000] \"\
  GET / HTTP/1.1\"\n    200 2028 \"https://example.com/ \"Mozilla/5.0...\"\n```\n\n\
  假设我们想根据 IP 地址找到访问网站的前十名访客。我们该怎么做？\n\n每行代表一次请求，因此我们需要统计每个 IP 地址的行数，按频率降序排序，并取前十名。\n\
  \n一个像这样的 shell 单行命令就能胜任：\n\n```\n```\n\n这条命令从每行的第一列提取 IP 地址（`cut`），统计唯一值的数量（`uniq\
  \ -c`），按数字降序排序（`sort -rn`），并获取前十行（`head`）。\n\nshell 这种方式让我们轻松组合像 `grep` 和 `wc` 这样的单个命令来实现几乎任何你需要的操作。\n\
  \n但 shell 大师们可以做更多。例如，假设我们有一个 Web 服务器访问日志需要分析。这里是是此类日志中典型的一行：它包含了客户端的 IP 地址、时间戳以及关于请求的各种信息。\n\
  \n```\n203.0.113.17 - - [30/Jun/2019:17:06:15 +0000] \"GET / HTTP/1.1\"\n    200\
  \ 2028 \"https://example.com/ \"Mozilla/5.0...\"\n```\n\n假设我们想根据 IP 地址找到访问网站的前十名访客。我们该怎么做？\n\
  \n每行代表一次请求，因此我们需要统计每个 IP 地址的行数，按频率降序排序，并取前十名。\n\n一个像这样的 shell 单行命令就能胜任：\n\n```\n\
  ```\n\n这条命令从每行的第一列提取 IP 地址（`cut`），统计唯一值的数量（`uniq -c`），按数字降序排序（`sort -rn`），并获取前十行（`head`）。\n\
  \n### 如何用 Go 解决问题\n\n在 Go 语言中，我们更倾向于编写一个更优雅、更清晰的程序。\n\n**目标**：编写一个 Go 程序，读取文件，统计每个\
