  \ `os.Stdout` 在那里，但这个 `nil` 完全让人困惑。什么，你难道你不知道传递 `nil` 意味着“打印到标准输出”吗？太遗憾了。\n\n这不可能是正确的主意吧？如果说有什么比强制性文书工作更糟糕的事情，那就是强制性*毫无意义*的文书工作。你永远不想让用户向你传递一个“神秘的\
  \ `nil`”。\n\n标准库并不是完全没有这个问题。例如，你很可能见过这样的代码：\n\n\n\n\n那个 `nil` 是怎么回事？这并不显而易见，不是吗？如果那个参数不是必要的，为什么\
  \ API 要强迫我们提供它呢？如果它*总是*必要的，那么为什么这里是 `nil` 也可以的呢？\n\n答案再次是你必须知道（或者去钻研代码才能发现），这是因为这里放置的是*处理器*（handler）。如果你不需要自定义处理器，可以传递\
  \ `nil`，结果将使用*默认*处理器。\n\n\n\n\n通过这种方式，我们兼顾了这两者的优势：既有无需额外配置的合理默认行为，又有极少额外工作量的可定制行为。这就是我们要的结果。\n\
  \n在这种背景下，需要记住的一条规则（由研究员 Alan Kay 提出）是：“简单的事情应该是简单的，但复杂的事情应该是可能的。”它完美地捕捉了我们以用户为中心、减少额外工作量的方法。\n\
  \n## 一个简单的行计数器\n\n让我们把目前所学到的知识用来编写一个稍微实用的程序：它统计输入内容的行数并将结果打印到输出中。同样，直接在一个 `main`\
