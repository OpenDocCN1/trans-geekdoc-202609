  \ O’Connor\n\n## 引言\n> 自然哲学家生活的指导格言应该是：“追求简单并不要信任它。”(amzn/3woHJ) —Alfred North Whitehead\n\
  \n你好，欢迎阅读这本书！很高兴你能这里。\n\n\n## 在阅读之前我应该知道什么？\n虽然你不需要成为一名自信或专家 Go 程序员，但我将在书中假设你至少熟悉一些基础知识：编译和运行\
  \ Go 程序、结构体和切片的工作原理、函数的作用等。如果你是 Go 的完全新手，甚至对编程也完全陌生，我建议你先读读我的上一本书《趣 Go 之爱》：media/file1.png\n\
  \n读完那本书后，你将处于阅读这本书的理想起点。去吧！我在这里等你回来。\n\n这本书使用了 2023 年 8 月发布的 Go 1.21，所有的代码示例都已在至少该版本通过测试。然而，Go\
  \ 非常强调向后兼容性，因此书中的所有代码在后来的 Go 1.x 版本中仍然可以完美运行。通常情况下，它也适用于更早的版本，但我建议你使用你可以使用的最新版本的\
  \ Go。如果你的操作系统发行版中尚未提供 Go 1.21 软件包，你可以从源码编译，或直接从 Go 网站下载合适的二进制包：\n* https://go.dev/learn/\n\
  \n在本书中有几十个挑战供你解决，每个挑战都旨在帮助你测试对刚学概念的理解。在书中，你会看到许多需要实现的代码目标，用单词 GOAL 标记，如下所示：\n\n\n\
  当你看到这个时，停下阅读，看看是否能想出如何解决问题。你可以尝试编写代码并对照测试进行，或者仅仅思考你会怎么做。\n\n如果你认为自己有了答案，或者你卡住了不确定该做什么，你可以继续阅读获取\
  \ HINT（提示），或者进一步向后阅读如何构建 SOLUTION（解决方案）的逐步说明。\n\n如果你遇到困难，或只是想检查你的代码，每个挑战都附带了一个完整的示例解决方案，包含测试。所有解决方案也可以在此处的公共\
  \ GitHub 仓库中找到：\n\n\n\n\n\n\n\n> *当宣布图书馆包含了所有的书籍时，人们的第一反应是无尽的喜悦。所有人……都觉得自己是这个完整且秘密宝藏的拥有者。没有任何个人问题，也没有任何世界问题是找不到其辞藻华美的解决方案的——在某处……*\
  \ \n\n\n\n## 通用库\n\n这个程序哪里有问题？\n\n```\n\n```\n```\n```\n\n\n如果你白费力力寻找却没有发现 bug，我也不怪你。事实是，这个程序*本身*并没有什么问题。它是可以运行的，至少在某种程度上它实现了作者的意图：向终端打印一条消息，然后退出。\n\
  \n但我们对这个程序能*做*的事情存在一些局限性。其中最严重的一点是它不是一个*可以导入的包*。让我们来聊为什么这是一件大事。\n\n最早的计算机是单用途机器。它们只能执行设计之初的特定计算：例如炮弹的弹道。要计算不同的内容意味着要在物理上对机器进行重新布线。\n\
  \n需要一种洞力的飞跃才能意识到，一种更有用的计算机应该是那种可以执行*任何*计算而无需重新布线的机器。也就是说，它是*可编程的*。\n\n## 包是力量倍增器\n\
  \n另一个重大的进展是这样一个观点：我们不需要每次都从零开始编写每个程序。相反，我们可以创建可重用的“例程”。例如，计算平方根的代码非常复杂且容易出错，但它只需要编写一次。然后我们可以在任何需要计算平方根的程序中复制并使用该例程。\n\
  \n如今，我们将这种独立的软件块称为*模块*（modules）或*包*（packages），它们是所有现代编程的基础。\n\n如果没有包，我们必须一直向计算机指令我们想要执行的每一个细节。例如，如果没有标准库中的包，在\
  \ Go 中编写实用的程序将非常困难。\n\n换句话说，包是极其强大的力量倍增器。当我们使用像 Go 这样拥有丰富导入包生态系统的语言进行编程时，我们永远不需要重复造轮。\n\
  \n如果我们能弄清楚如何将未解决的问题分解成一系列由现有包解决的微型问题，那么我们就完成了 90%。\n\n## 通用的 Go 库是海量的\n\nGo *语言*本身非常小，从某种意义上说，是因为它的关键词，也没有海量的语法需要学习。对于我们这些正在学习它的人来说，这是一个极好的好消息。\n\
  \n但由于这个小语言附带了一个庞大的标准库，充满了各种实用且设计良好的包，我们可以立即用它来构建一些非常强大的程序。\n\n这很棒，但我们被局限于只能导入标准库中的包吗？显然不是。我们可以导入世界上任何发布的包，而且有大量的包可用。\n\
  \n我们把这种更广泛的由可导入 Go 包构成的生态系统称为*通用*库。在 GitHub 上快速搜索就能发现，这个通用库中有接近*五十万*个包（在其他地方还发布更多）。\n\
  \n换句话说，如果你能想象出来，可能就有一个 Go 包提供了该功能。包真的多到以至于，仅仅*找到*你想要的包就可能是一项挑战。[pkg.go.dev](https://pkg.go.dev/)\
  \ 网站让你搜索并浏览整个通用库：\n\n*   [`pkg.go.dev`](https://pkg.go.dev)\n\n如果你正在寻找一个包来解决某个特定问题，首先检查的好地方是\
  \ [awesome-go](https://github.com/avelino/awesome-go)，这是一个按主题精心策划的列表，包含了数千个各个领域最优秀的\
  \ Go 包：\n\n*   [`github.com/avelino/awesome-go`](https://github.com/avelino/awesome-go)\n\
  \n这是 Go 成为如今软件开发如此受欢迎的选择的众多原因之一。在许多情况下，创建一个特定程序所需要的只需要找到连接我们所需的各种包的正确方法。\n\n然后我们可以让*我们的*程序成为一个其他人可以使用的包，这个过程就像链反应一样持续下去。层层包！\n\
  \n## 共享我们的代码惠及所有人\n\n换句话说，没有任何程序是孤岛。但这就是列表 [`hello/1`](https://github.com/bitfield/tpg-tools2/blob/main/hello/1/main.go)\
  \ 中“你好世界”程序的问题所在：它*是*孤立的，打破了导入链。\n\nGo 的语法规则意味着所有代码都必须在*某个*包中，而我们的恰好在 `main` 包中。但\
  \ `main` 包有其特殊之处：它无法被导入。\n\n这意味着没有人能从我们的代码中受益。我们从这个包生态系统中*取用*，却没有回馈任何东西。这太遗憾了！如果我们的程序是值得写的，它就应该与数百万其他\
  \ Gopher 共享。为了让我们能够按照所需的规模编写软件，这必须是一个使用标准化组件的工业化过程。\n\n当我们编写包而不是程序时，会有何不同？Bill Kennedy\
  \ 贴切地称为*包导向设计*代表了思维的根本转变：\n\n> *所有的设计决策始于并终于包。包的目的是为特定的问题领域提供解决方案。为了有目的，包必须提供而不是包含。每个包的目标越明确，它所提供的内容就越清晰。*\n\
  \n> —Bill Kennedy, [关于包的设计哲学](https://www.ardanlabs.com/blog/2017/02/design-philosophy-on-packaging.html)\n\
  \n> *如今的软件开发者像殖民时代的铁枪匠，手工制作每一个螺丝和螺母。我们还没有从“像铁枪匠一样敲击软件”跃迁到“受信任、稳定的组件的商业级仓库”。*\n\n\
  > —Scott Rosenberg, [代码中的梦想](https://amzn.to/3NrFwhi)\n\n那么，优秀的程序员总是从编写可导入包的角度来思考，而不是死板的程序。事实证明，这是编写正确、易于理解且维护的软件的极佳方法。模块化就是良好的设计。\n\
  \n\n\n\n当然，我们可以编写任意数量的包，但在运行某些可执行的二进制文件之前，任何事情都不会真正*发生*。这意味着必须有一个 `main` 包，因为 Go\
  \ 构建可执行二进制文件的方式就是这样构建的。\n\n但我们已经说过了，程序中的实质性代码应该放在某些*可导入的*包中，这意味着它不能放在 `main` 中。所以，虽然必须存在一个\
  \ `main` 包，但推论结果是它应该做得越少越好。它应该导入我们的包，并调用某些入口函数来启动真实程序，仅此而已。\n\n我们并不真的想在 `main` 包中编写任何非平凡的*逻辑*，因为无法（直接）对其进行测试。而且无论它是否正确，它都无法在其他程序中被导入和使用，所以从开源社区的角度来看，它是一个死胡同。\n\
  \n让我们看看，如果我们从 `main` 中提取出所有的实质性代码，然后用对某个执行实际工作的假设包的调用来替换它，还会剩下什么。\n\n我们首先开始为这个项目创建一个新文件夹（命名为\
