  \n那么那个 `error` 参数是做什么的？它允许你控制在读取某些文件夹出错时发生什么。例如，假设我们没有权限读取 `subfolder` 的内容，那么当 `WalkDir`\
  \ 尝试打开它时，会产生一个 `fs.ErrPermission` 错误。在这种，`WalkDir` 会带有 `\"./subfolder\"` 和该错误调用我们的函数，函数可以决定如何处理它。\n\
  \n它能做的最简单的事情就是立即返回错误，在这种情况下，`WalkDir` 将停止遍历并返回相同的错误。不过，这通常不是我们想要的。例如，我们不希望一个权限错误在文件扫描任务结束几分钟前让一个运行了\
  \ 17 小时的作业崩溃，从而迫使我们从头开始。\n\n相反，我们可以返回特殊的错误值 `fs.SkipDir`，意思是“跳过此文件夹，但继续遍历”。我们在示例程序中没有处理错误，所以它将始终直接跳过任何无法读取的文件夹，这并不是完全不合理。但在生产程序中，你可能需要更复杂的错误处理。\n\
  \n## 一个查找文件的树形遍历器\n\n看起来使用文件系统和 `fs.WalkDir` 可以胜任我们的文件查找程序，那么让我们看看如何将其转换为一个功能完善且经过测试的\
