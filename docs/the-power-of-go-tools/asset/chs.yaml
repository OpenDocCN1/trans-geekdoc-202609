  \n# 1. 客户端\n\n> 一般来说，最好假设网络充满了恶意的实体。> [RFC122](https://datatracker.ietf.org/doc/html/rfc122)\n\
  \n![](img/file12.png)\n\n到目前为止，我们局限在本地机器上编写工具，让我们去外面看看那里有什么。\n\n## 简单的天气客户端\n\n\
  对于你可以想象的几乎任何通用任务，都有相应的公共 API 可以实现：从希伯来历转换为格列哥历、生成随机数或下载任意尺寸的图片。\n\n事实上，你可以在这个优秀的仓库中找到数百个这样的\
  \ API：\n\n*   [`github.com/public-apis/public-apis`](https://github.com/public-apis/public-apis)\n\
  \n### 我们需要什么？\n\n这很诱人，但让我们先尝试写一个天气客户端。假设我们只想获取位置的简要摘要：\n\n```\nClouds 11.2ºC\n```\n\
  \n可以使用工具在终端提示符或菜单栏显示天气状况。我们可以从哪里获取数据？\n\n让我们从那个列表中选择一个天气 API。OpenWeatherMap 是一个不坏的选择：\n\
  \n*   [`openweathermap.org/api`](https://openweathermap.org/api)\n\n浏览他们的文档，可以看到有很多与天气相关的\
  \ API 和端点，所以我们选择提供指定位置当前状况的一个：\n\n*   [`openweathermap.org/current`](https://openweathermap.org/current)\n\
  \n我们需要一个 API 密钥或令牌，可以通过注册 OpenWeatherMap 网站并输入电子邮件地址获取。使用该 API 是免费的；密钥有助于防止服务被滥用。\n\
  \n### 测试性能\n\n在我们担心尝试用 Go 实现之前，让我们先使用网络浏览器或如 `curl` 的命令行工具看看是否可以获得想要的数据。\n\nAPI\
