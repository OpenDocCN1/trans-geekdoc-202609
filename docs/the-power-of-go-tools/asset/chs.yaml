  \ 通配符只能匹配路径名中的非分隔符字符。句话说，我们无法编写递归 glob。\n\n某些语言和工具使用*双星*通配符来实现此功能：例如，`**/*.go` 会匹配文件系统中的任何\
  \ Go 文件。遗憾的是，`fs.Glob` 和其他使用通配符的 Go 标准库函数不支持这种语法。我们将继续思考。\n\n### 遍历树\n\n由于文件系统本质上是递归的，实际的递归操作总是相同的。原则上，标准库可以为我们完成工作，我们只需要为找到的每个文件或文件夹提供执行的具体代码。\n\
  \n`fs.WalkDir` 函数正是这样做的。它接收一个文件系统及其内部的起始路径，并递归*遍历*树，访问每个文件和文件夹（按字典顺序；即字母顺序）。\n\n\
  对于它找到的每一个，它都会调用你提供的函数，并传递路径名。例如：\n\n```\n\n```\n\n对于我们的示例树，`myFunc` 将为以下路径名中的每一个被调用一次：\n\
  \n```\n.\nfile.go\nsubfolder\nsubfolder/subfolder.go\nsubfolder2\nsubfolder2/another.go\n\
  subfolder2/file.go\n```\n\n\n\n\n第一个路径 ``.` 是文件系统本身的根目录。\n\n那么 `myFunc` 能用这些路径做些什么呢？嗯，它可以查看每个路径，如果它以\
  \ `.go` 结尾，就让计数器加 1。这听起来很有前景。让我们看看是否能写出 `myFunc`。\n\n我们传递给 `fs.WalkDir` 的函数必须具有与类型\
