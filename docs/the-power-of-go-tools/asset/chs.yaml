  \ `NewCounter` 在没有提供选项时返回错误，这正是我们想要立即知道的那种*灾难性* Bug，不是吗？\n\n### 处理错误\n\n每当你发现自己在想“忽略这个错误是没问题的，因为按照目前的程序，错误永远不会非空”时，请再想想。\n\
  \n首先，你对这一点可能是错的。对于一个足够复杂的程序，你几乎肯定对这一点是错的。\n\n其次，程序在未来一定会改变，修改它的人可能不知道返回一个错误可能会在很远的一个函数中导致崩溃。\n\
  \n基于未说明且错误的假设来忽略错误，就像在代码中留下一地雷等别人踩中；最有可能是你未来的自己。毕竟，事情出错的方式比它们顺利运行的方式多得多，所以我们代码的大部分关于错误处理是完全可以的。事实上，这在统计上是不可避免的。\n\
  \n如果忽略来自 `NewCounter` 的错误是不可接受的，我们能做什么？返回它？\n\n```\n\n```\n\n但起初编写 `Lines` 的整个理由是为了创建一个带有繁琐事务性工作的“最小\
  \ `main`”。嗯，我们刚刚创建了一些新的事务性工作：\n\n```\n\n```\n\n如果唯一会调用 `Lines` 的人除了记录日志并崩溃之外，无法对错误做任何有用的事情，我们还不如直接执行这些操作：\n\
  \n```\n\n([Listing count/3](https://github.com/bitfield/tpg-tools2/blob/main/count/3/count.go))\n\
  \n我们无法给用户提供有用的信息，因为用户无法修复我们的程序，这绝对是一个内部程序 Bug。这正是 `panic` 的用处：报告不可恢复的内部程序 Bug。\n\
  \n在 `main` 包之外调用 `panic` 通常不是一个好主意，因为如果有人使用你的包来构建他们自己的应用程序，他们不希望意外 panic。你没有立场判断对于*他们*来说什么是什么不是可恢复的错误，所以处理错误的正确方法是将它们返回给调用者并让他们决定。\n\
  \n然而，`Main` 是一个特定于 CLI 的函数，我们基本上可以将其看作真实 `main` 的委托等价物。我不喜欢这种半隐藏的 panic，但我更倾向于不让用户处理那些不是他们的错且永远不会发生的错误。\n\
  \n### 带有选项的行计数器\n\n这里是 `count` 包目前的状况：\n\n```\n\n```\n\n([Listing count/3](https://github.com/bitfield/tpg-tools2/blob/main/count/3/count.go))\n\
