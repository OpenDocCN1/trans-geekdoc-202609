  \n### 耗时潜在慢速的操作\n\nGo 提供了优秀的基准测试（benchmarking）设施来衡量性能，这些就在我们一直在使用的标准 `testing` 包中。在查看如何使用它们为\
  \ `Files` 编写基准测试之前，让我们先思考一下这个问题。测量某个函数运行速度实际上涉及了什么？\n\n如果我们没有内置的基准测试设施，并且想要测量某些潜在慢速操作期间流逝的时间，我们可以做什么呢？\n\
  \n一种方法可能如下所示：\n\n```\n\n```\n\n通过找到操作前后的当前时钟时间，并将两者相减，我们得到了流逝的时间。这很好。但这个数字的可靠性如何呢？\n\
  \n事实上，并不完全可靠：你的计算机在运行这个程序的同时，还在执行很多其他事情，其中任何一项都可能导致操作变快或变慢。\n\n换句话说，环境是嘈杂的，导致我们的时间测量产生抖动：如果我们重复多次相同的操作，我们将得到本质上是随机差异的结果。如果抖动相对于我们测量的总时间很大，那就是问题了。\n\
  \n为了避免这种情况，一个做法是运行操作很多次（例如百万次），然后将总和除以该数字以得到每次操作的平均时间。希望噪声大部分会被抵消，给我们一个更准确的结果。因此我们将在执行多次的循环内部调用该函数。\n\
  \n但运行多少次呢？如果函数非常快，我们应该运行多次。如果函数慢，我们应该运行少几次。迭代次数由基准框架决定。\n\n### 编写基准函数\n\n一旦我们看到如何使用它们为\
  \ `Files` 编写基准测试，让我们先思考一下这个问题。测量某个函数运行速度实际上涉及了什么？\n\n基准框架决定了迭代次数。在基准函数中，我们需要就是编写一个执行\
  \ `N` 次的循环，其中 `N` 由基准框架设置。它看起来是这样的：\n\n```\n\n```\n\n([Listing findgo/4](https://github.com/bitfield/tpg-tools2/blob/main/findgo/4/findgo_test.go))\n\
  \n正如测试名称以 `Test` 开头，基准名称以 `Benchmark` 开头。正如测试接收一个控制测试的 `*testing.T` 参数，基准接收一个类似的\
  \ `*testing.B` 参数。\n\n我们首先想测量 `Files` 搜索磁盘文件系统的时间，所以我们像测试一样使用 `os.DirFS` 创建一个。\n\
  \n计时器从基准函数开始就开始运行。但由于我们不想将 `os.DirFS` 的调用包含在基准计时中，我们随后调用 `b.ResetTimer()` 将时清零：“现在开始计时！”\n\
  \n现在我们编写之前讨论的循环，调用我们的函数 `N` 次。事实上，它将循环 `b.N` 次，其中 `b.N` 由框架控制。\n\n要运行此基准测试，使用以下命令：\n\
  \n```\ngoos: darwin\ngoarch: amd64\npkg: findgo\ncpu: Intel(R) Core(TM) i7-3615QM\
  \ CPU @ 2.30GHz\nBenchmarkFilesOnDisk-8    5434  33003 ns/op\nPASS\n```\n\n因为基准只是某种特殊的测试类型，我们正在使用\
  \ `go test` 命令，它也会运行我们的常规测试。这很合理，因为在测试通过之前，基准任何测试都没有意义：如果一个函数不需要正确，它可以运行得极快。\n\n\
  然而，我们还提供了 `-bench .` 标志，要求 `go test` 运行任何匹配正则表达式“.”的基准测试。由于这个“点”匹配任何字符，这将运行包中定义的所有基准测试。\n\
  \n输出给了我们关于运行测试的系统的上下文信息（`darwin` 内核，代表 macOS，在 `amd64` 架构上，具体为频率为 2.3GHz 的 Intel\
  \ Core i7）。\n\n然后它报告基准测试的结果：\n\n```\nBenchmarkFilesOnDisk-8    5434  33003 ns/op\n\
  ```\n\n名称后面的 `-8` 表示 Go 可用 8 个 CPU 核心，以防我们需要知道这一点：这对于并发程序可能很重要。\n\n\n\n\n下一个数字 `5434`\
  \ 表示循环总共执行了次数，因此也就是 `Files` 被调用的次数。\n\n最后，数字 `333303` 告诉我们每次操作（即每次调用 `Files`）的平均时间为\
  \ 333,000 纳秒及以上余量。也就是说，大约是 333 微秒。\n\n看起来非常快！我们能使用基于 `MapFS` 的文件系统做得更好吗？让我们来找一找：\n\
  \n([查看 findgo/4](https://github.com/bitfield/tpg-tools2/blob/main/findgo/4/findgo_test.go))\n\
  \n这里是结果：\n\n```\n```\n...\nBenchmarkFilesOnDisk-8    5492   353633 ns/op\nBenchmarkFilesInMemory-8\
  \  91056  13483 ns/op\n```\n\n查看最后一列，我们可以看到基于磁盘的基准测试再次耗时约 350 微秒，而基于内存的测试仅需 13 微秒。这大约快了\
  \ 25 倍，或者说大约快了一个数量级：正如我们预期的那样。\n\n那么，仅仅为了运行测试时节省 0.3 毫秒值得吗？嗯，我们都是忙碌的人，但还没忙到抽不出一一两个毫秒的地步。不过，考虑到\
  \ 25 倍提速对大型测试套件的影响，通过这种方式尽可能地消除不必要的磁盘 I/O 是非常有意义的。\n\n### 使用 `fs.FS` 让 API 更加具灵活性\n\
  \n没有任何事情可以阻止你编写自己的 `fs.FS` 实现，而且这非常直观。事实上，每当你编写 Go 代码来处理原则上可以被视为“路径-值树”的数据时，你可能都会考虑接受一个\
  \ `fs.FS` 作为输入，或者让你的数据类型本身满足 `fs.FS` 接口。这都有助于让你的包更加灵活、实用、强大且易于使用。\n\n我们可以从我们的文件查找器示例中看到这种效果。最初，因为它接收的是磁盘路径，我们唯一能用它搜索的是基于磁盘的文件系统。现在我们更新了它以接受\
  \ `fs.FS`，它就可以操作任何满足该接口的对象了。我们的测试可以给它传递一个 `MapFS`，而它运行良好。\n\n那么还有什么可以可行呢？我们之前提到过其他满足\
  \ `fs.FS` 的一些示例。为了好玩，让我们尝试使用源自 ZIP 归档包的文件系统来运行 `Files`：毕竟，它应该可以工作，不是吗？\n\n首先，让我们使用\
  \ `zip` 命令压缩我们的测试文件夹 `findgo` 及其内容。如果你没有该命令，可以使用任何可以创建标准 ZIP 文件的工具，包括 macOS Finder\
  \ 的“压缩”操作。\n\n```\n\n```\n```\nadding: tree/ (stored 0%)\nadding: tree/subfolder/\
  \ (stored 0%)\nadding: tree/subfolder/subfolder.go (stored 0%)\nadding: tree/subfolder2/\
  \ (stored 0%)\nadding: tree/subfolder2/another.go (stored 0%)\nadding: tree/subfolder2/file.go\
  \ (stored 0%)\nadding: tree/file.go (stored 0%)\n```\n\n这些文件都是空的，这就是为什么压缩它们看起来没有节省空间，但并不是重点：我们只是想要一个\
  \ ZIP 文件玩玩。现在，我们如何将其作为文件系统打开呢？\n\n幸运的是，Go 在标准库包 `archive/zip` 中提供了读取 ZIP 文件的设施，所以这是我们的测试：\n\
  \n```\n\n```\n([查看 findgo/4](https://github.com/bitfield/tpg-tools2/blob/main/findgo/4/findgo_test.go))\n\
  ```\n\n我们使用测试文件的路径调用 `zip.OpenReader`，其结果是一个满足 `fs.FS` 的值，因此我们可以直接将其传递给 `Files`。当然，它给了我们正确的答案：\n\
  \n```\nPASS\n```\n\n仅仅通过使用 `fs.FS` 抽象而不是直接与磁盘交互，我们就无需任何额外努力，就让我们的 `Files` 函数能够处理\
  \ ZIP 归档。如果你在自己的 API 中暴露了这种类型，其他人就可以在自己的代码中使用 `fs.FS` 值了。\n\n如果你的函数操作的是文件树或路径-值对集合，请考虑接受\
  \ `fs.FS` 而不是根路径。\n\n## 进阶\n\n如果你想找一些方法来多练习我们讨论过的观点，这里有一个微项目：\n\n-   编写一个实现 `fs.FS`\
  \ 接口的结构体，在内存中存储文件。\n-   实现 `fs.FS` 的 `Open` 方法，以便根据路径读取文件内容。\n-   编写一个测试用例，验证你的内存文件系统能够正常工作。\n\
  -   尝试将之前的文件查找逻辑应用到这个新的内存文件系统上。\n\n\n\n\n```go\nmain.go\n```\n\n这样才对！在实践中，当我们从 Go\
  \ 程序运行外部命令时，我们通常希望以某种方式捕获输出：例如，存储在 `bytes.Buffer` 中。但这已经足以证明该概念了。\n\n我们还能做更多吗？例如，向命令传递参数怎么样？\n\
  \n事实证明，`exec.Command` 是变长函数：它接受除第一个参数外的任意数量的字符串，并将它们解释为传递给命令的参数。\n\n以下是输出：\n\n```\n\
  -rw-r--r--  1 john  staff  127 30 Sep 15:46 main.go\n```\n\n## 何时不该使用 `exec`\n\n\
  尽管它提供了一个非常整洁的演示，但我们实际上并不想从 Go 程序运行 `ls` 命令：该功能用 Go 语言本身实现好得多，而且我们在文件系统章节中已经见过如何实现它。\n\
  \n同样，通过*调用 shell 命令*（即 shell out，即启动子进程）来运行如 `mkdir`、`touch`、`rm` 等标准文件管理命令也没有好处。所有这些功能要么标准库中已可用，要么很容易在\
  \ Go 中编写。不要为那些功能可以通过原生 Go 代码轻松实现的外部命令编写 shell 命令。那只会增加不必要的依赖。\n\n不过，假设我们想做一些更高级的操作，例如使用\
  \ `kubectl` 触发 Kubernetes 部署，或者使用 `gcloud`、`aws` 或 `az` 命令创建云虚拟机。这会是从 Go 运行外部命令的良好案例吗？\n\
  \n并不是。除了我们讨论过的依赖问题外，像 `kubectl` 这样复杂的程序往往随着时间而变化。新的标志（flags）和动词会被添加，旧的会被弃用，程序的行为可能会发生剧变。\n\
  \n新版本的 `kubectl` 很容易导致你的 Go 程序停止正常工作。由于我们通常需要此类工具的输出，我们必须对其进行*解析*以获取所需的信息，而这同样非常脆弱。\n\
  \n外部命令输出格式的微小变化可能会完全破坏依赖它们的程序，而且这类问题并不容易进行自动测试。\n\n更好的方法是寻找提供与命令行工具相同或相似功能的 Go 包。通常情况下，CLI\
  \ 工具本身就会使用该包来实现其功能。\n\n例如，这里是 `kubectl` 工具的完整的 `main` 函数，我相信大家都会同意它做了很多工作：\n\n([kubectl.go](https://github.com/kubernetes/kubernetes/blob/master/cmd/kubectl/kubectl.go))\n\
  \n看起来这里的代码并不多，但重点就在于：这个极简的 `main` 函数只是调用了配套的 `cli` 包来执行实际工作。如果 `kubectl` 可以该包，我们也可以。\n\
  \n那么，`kubectl` 的所有重要机制都在 Go 包中，我们可以在自己的程序中导入并使用它们，这是很合理的。`kubectl` 二进制文件能做的任何事情，我们也可以用纯\
  \ Go 做到，而无需对外部命令产生脆弱的依赖。\n\n在整本书中，我们一直努力设计具有“最小 `main`”的程序，现在当我们观察 `main` 时，就可以看到为什么这样做很有价值了。\n\
  \n## 何时该使用 `exec`\n\n从 Go 运行外部命令确实有合理的场景。例如，当我们需要此类工具的输出时，我们必须对其*解析*以获取所需的信息。\n\n\
  虽然我们不想在能用 Go 轻松实现其功能时使用外部命令，但这里并非如此。运行 `exec` 命令让我们的 Go 程序比我们尝试自己实现相同的功能要简单得多。\n\
  \n## 从 shell 脚本迁移\n\n使用 shell 脚本是可能的，但对于可维护的软件来说并不是理想的。我们改为使用 Go。\n\n## Go 中的命令包装器\n\
  \n当我们需要专利或闭源程序提供的信息时，特别是当它们仅以二进制文件形式提供时，我们可能别无选择 `exec`。\n\n### `pmset` 命令\n\n例如，假设我们想获取\
  \ Mac 当前的电池状态。我们可以在命令行通过特定的 `pmset` 命令轻松地做到这一点：\n\n```\nNow drawing from 'AC Power'\n\
  \ -InternalBattery-0 (id=1087905) 98%; charging;\n    0:42 remaining present: true\n\
  ```\n\n\n\n\n继续为此项目创建一个新文件夹（例如，你可以命名为 `battery`）。现在，我们应该编写的第一个测试是什么？\n\n假设我们想要一个\
  \ Go 函数，能够返回电池的当前电量状态。你可能会发现很难为此编写任何测试：你如何能预先知道正确的电池电量状态将*是*什么呢？\n\n任何根据某些外部条件返回动态信息的函数都无法通过将其结果与预期结果直接比较来测试。我们需要更深层次地思考。\n\
  \n在整本书中，我们一直在问一个问题：*我们到底在测试什么行为？*那么这里的答案是什么呢？\n\n很容易回答“函数正确地获取了电池状态”，但这是错误的。“获取电池状态”这一行为实际上并不存在于*我们的*代码中；它是在\
  \ `pmset` 命令中。那么，*我们的*代码到底做了什么呢？\n\n### 拆分行为\n\n我们真正要测试的行为分为两个部分：\n\n1. 我们带有正确的参数执行\
  \ `pmset` 命令\n2. 我们正确地解析 `pmset` 的输出\n\n当你这样构建时，测试这两个行为就变得更容易了，不是吗？第一个行为的“输出”仅仅是表示\
  \ `pmset` 命令行的字符串。\n\n第二个行为的“输入”是 `pmset` 在运行时打印的某种文本，它的输出是我们从中解析出的任何电池信息。\n\n在这两个步骤之间有一些代码之外的隐藏内容：基本上是\
  \ `pmset` 所做的一切。我们并不感兴趣测试 `pmset`，所以可以完全关注*我们的*代码所做的事情。在这种情况下，第一个行为是显而易见的，因为所需的命令行总是相同的：`pmset\
  \ -g ps`。不需要测试我们能产生这个字符串。我们可以想象这种情况可能会更复杂，并且需要测试，但让我们先认为这个问题解决了。\n\n一个难以测试的函数通常可以拆分为子行为，每个子行为都可以重构为可测试的函数。然后可以将这些行为*组合*成一个用户可以调用的函数。\n\
  \n## 解析命令输出\n\n第二个行为需要更多的思考。首先，我们需要一些测试输入。最好的测试数据总是真实数据，所以让我们使用 `pmset` 生成它，并将其输出*定向*到\
  \ `testdata` 文件夹中的文件中。\n\n正如我们之前看到的，结果将如下：\n\n```\nNow drawing from 'AC Power'\n\
  \ -InternalBattery-0 (id=10879075) 98%; charging; 0:42\nremaining present: true\n\
  ```\n\n这就是我们解析函数的输入；我们想要什么输出？嗯，我们可以从这段文本中提取出几条有用信息，例如电源状态、电池 ID、电量百分比以及剩余时间。\n\n\
  这对于一章来说太复杂了。让我们先关注电量百分比：如果我们能提取它，假设可以用同样的方法提取其他东西。我们希望避免被诱导解决比严格需要更多的问题。\n\n在不担心具体*如何*获取数字之前，我们可以为该函数编写一个测试。花一点时间尝试草拟一个。\n\
  \n目标：为“解析 `pmset` 输出的电量百分比”行为编写测试。使用 `pmset -g ps` 的真实输出作为测试数据。\n\n提示：首先，函数需要什么输入？嗯，我们将是一个字符串，因为\
  \ `pmset` 的输出是纯文本，所以字符串参数是合理的。\n\n输出呢？最有用的是代表电量百分比的*数字*，因此可以让函数返回 `int`。`pmset`\
  \ 不报告小数百分比，所以 `int` 就可以了。\n\n但是，提前考虑，我们可以看到未来可能还会从数据中提取其他信息。我们可以在 API 中留出空间吗？\n\n\
  我们希望避免更改函数的签名，因为这将破坏调用它的用户代码。相反，有一个表示我们想要全部电池信息的结构体类型会更方便。我们可以随时向它添加新字段，而无需对公共 API\
  \ 进行破坏性更改。\n\n所以定义这种类型的 `want` 变量，目前唯一的字段是电量百分比。为了消除歧义，将其命名为 `ChargePercent`。剩下的部分应该是简单的：调用函数，并用熟悉的方式比较\
  \ `got` 和 `want`。\n\n### 测试解析函数\n\n解决方案：这是我的尝试：\n\n```\n\n```\n\n([Listing battery/1](https://github.com/bitfield/tpg-tools/blob/main/battery/1/battery_test.go))\n\
  \n这看起来和我们写的其他测试大部分相似，很容易理解。我们读取测试数据，调用解析函数，并比较 `want` 和 `got`。\n\n`want` 是什么？`pmset`\
  \ 输出文本显示电量为 98%，这就是我们应该预期的 `ChargePercent`。\n\n`ParsePmsetOutput` 需要返回一个 `error`\
  \ 以及 `Status` 结构体，因为解析*可能会*失败：例如，如果格式发生了变化，我们可能无法理解输入。\n\n## 解析命令输出\n\n让我们写一个 `ParsePmsetOutput`\
  \ 的空实现并检查是否得到了预期的测试失败：\n\n```\n-       ChargePercent: 98,\n+       ChargePercent:\
  \ 0,\n```\n\n很好。这次测试是简单部分，而*实现*可能更有挑战性。让我们看看。\n\n目标：实现 `ParsePmsetOutput`。\n\n###\
  \ 问题\n\n提示：这需要思考。让我们明确问题陈述。我们预期的输入类似于测试数据：\n\n```\nNow drawing from 'AC Power'\n\
  \ -InternalBattery-0 (id=1087075) 98%; charging; 0:42\nremaining present: true\n\
  ```\n\n我们想要能够提取电量百分比：在这种情况下，即值 `98`。我们如何做到？\n\n遗憾的是，这不是简单的字符串匹配。我们预先不知道该值，因此无法搜索它。\n\
  \n该值也不总是位于文本中的相同字节位置，所以我们不能只读取第 63-64 字节之类的。我们甚至不能通过数单词来获取文本，因为推测“drawing from AC\
  \ Power”部分会变成其他内容。\n\n我们能做什么？\n\n* *\n\n解决方案：一些程序员在遇到这类问题时，会想：“我知道了，我要用正则表达式！”([现在他们有两个问题了。](http://regex.info/blog/2006-09-15/247))\n\
  \n什么样的正则表达式在这里有效？嗯，我们想要的是一个*数字序列*，但我们的示例中有多个这样的序列。我们可以再缩小一点范围吗？\n\n### 编写正则表达式\n\
  \n仔细观察，似乎只有*一个*数字序列后面跟着 `%` 字符，所以我们可以尝试匹配它。\n\n这是一个匹配一个或多个数字后跟一个 `%` 的正则表达式：\n\n\
  ```\n[0-9]+%\n```\n\n在 Go 中我们可以用它做什么？这是一个示例：\n\n```\n\n```\n\n我们的真实字符串不同，但这个简单的版本会让情况更容易观察。首先，我们*编译*正则表达式（它像一个微程序），得到一个可以使用的值\
  \ `r`。然后，我们用输入文本调用它的 `FindString` 方法。\n\n`FindString` 返回第一个完全匹配指定正则表达式的字符串，所以在这种情况下它是：\n\
  \n```\n98%\n```\n\n\n\n很好，但我们只想要 `98`，而不是末尾的 `%`。我们需要 `match` `%` 字符，以确保获取了正确的数字序列。但一旦我们\
  \ `have`（拥有）了它，我们就想从中提取数字。\n\n我们可以通过在正则表达式中添加括号来实现这一点，创建一个`捕获组`：\n\n```\n([0-9]+)%\n\
  ```\n\n如果这个表达式匹配了某段文本，我们就能提取出捕获组的内容：即括号内部的部分。它的样子如下：\n\n`FindString` 只返回整个匹配的字符串，而\
  \ `FindStringSubmatch` 返回一个字符串切片（`slice` of strings）。该切片的第一个元素是整个匹配的字符串（和之前一样），但第二个元素是捕获组的内容。\n\
  \n如果正则表达式中有多个组，那么这个切片中会有额外的元素，每个元素都持有对应组的内容。但事实上是，我们只有一个组，所以 `matches` 切片恰好包含两个元素：\n\
  \n```\n[\"98%\", \"98\"]\n```\n\n第二个元素是我们需要的，可以使用索引表达式 `matches[1]` 来获取。一旦得到了这个字符串，我们就有信心可以使用类似\
  \ `strconv.Atoi` 的方法将其转换为整数。\n\n现在我们有了计划。那么，我们该如何将这一切整合起来来实现 `ParsePmsetOutput`\
  \ 呢？\n\n### 使用 `regexp`\n\n事实上，与实际字符串匹配相比，`MustCompile` 操作是相对昂贵的。但编译在每个程序运行时只需要执行一次，所以我们可以在包级别在\
  \ `var` 语句中完成它。\n\n如果将 `MustCompile` 的调用放在解析函数内部，那么每次调用该函数时 `regexp` 都会被重新编译，这是没有必要的。一旦我们\
  \ `have`了编译后的值，就可以廉价地使用它来匹配任意数量的输入字符串。\n\n这是我写的函数版本：\n\n```\n([Listing battery/1](https://github.com/bitfield/tpg-tools2/blob/main/battery/1/battery.go))\n\
  ```\n\n在使用编译后的 `pmsetOutput` 正则表达式测试输入是否匹配后，我们现在需要检查它是否真的匹配了。如果匹配了，我们应该拥有捕获组的内容，因此\
  \ `matches` 中至少会有两个元素。我们可以检查 `len(matches)`，如果不是如此，则返回一个错误。\n\n注意，我们包含了无法解析的输出：仅仅说“解析失败”对用户或开发者都没有帮助。在错误消息中包含无法解析的文本只需要多按几次键，但它会极大地提高错误的可用性。\n\
  \n现在我们知道已经成功提取了所需的数字字符串，可以调用 `strconv.Atoi` 将其转换为整数值。这会返回 `error`，因为并不是所有的字符串都代表有效的整数。我们\
  \ `pretty`（很）确定我们的字符串是有效的，但同样，我们不要冒险。所以我们也检查那个错误。\n\n最后，我们得到了需要的 `int` 值，因此可以构造一个合适的\
  \ `Status` 字面量，并将其 `ChargePercent` 字段设置为我们计算出的值。\n\n让我们再次尝试测试：\n\n```\nPASS\n```\n\
  \n搞定了（Mischief managed!）！我们现在有信心，给定真实的 `pmset` 输出，我们可以从中提取出电池状态。\n\n那么，我们可以转向任务的另一部分：首先\
  \ `getting` 那个输出。我们可以想象有一个函数 `GetPmsetOutput`，它使用 `exec` 运行 `pmset` 并将其输出作为字符串返回。\n\
  \n但有一个问题。如果在单元测试中不允许执行外部命令，我们该如何为这样的函数编写单元测试呢？\n\n显然，我们做不到。但单元测试并不是我们可以编写的唯一类型。\n\
  \n### 集成测试\n\n单元测试顾顾名，测试的是代码中的某个 `unit`（单元），例如一个函数，通常是孤立的。它的任务是验证函数的 `logic`（逻辑）是否正确，因此它尝试避免使用任何外部依赖，例如命令。\n\
  \n另一方面，`integration`集成测试的任务是测试当我们 `do`（使用）那些外部依赖时会发生什么。它验证了我们对它们如何工作的假设：例如，我们以正确的方式执行了正确的命令。\n\
  \n### 为什么要隔离集成测试？\n\n为什么要对这两种测试进行区分？嗯，单元测试需要快速且轻量级，因为我们运行得非常频繁，它们唯一的失败理由只能是我们的代码出了问题。\n\
  \n不过，我们不需要频繁地运行集成测试，因为它们唯一崩溃可能是由于外部环境发生了变化：例如 `pmset` 命令被更新或删除了。\n\n单元测试在对外部依赖有某些假设的情况下检查程序的行为。集成测试则检查这些假设是否仍然\
  \ `correct`（正确）。所以，集成测试相对较慢或使用外部依赖并不重要，只要我们能找到一种方法，避免每次运行单元测试时都运行它们。\n\n### 编译标签\
  \ (Build tags)\n\n控制集成测试执行的一种常用方法是使用 `build tag`（构建标签）。\n\n构建标签是 Go 文件中的特殊注释，除非定义了该标签，否则它不会被编译。有一些\
  \ `predefined`（预定义）构建标签：例如，如果我们在 Windows 上构建，就会定义 `windows` 标签。同样，`darwin` 和 `linux`\
  \ 分别表示 macOS 和 Linux。\n\n在 Go 文件中指定构建标签的样子如下。它必须是文件的第一行，并且在 `package` 声明之前有一个空行：\n\
  \n```\n\n我们可以利用这种机制为某些代码提供特定操作系统的实现，例如。我们可以在受 `darwin` 构建标签保护的 Go 文件中编写 macOS 版本，在受\
  \ `linux` 保护的文件中编写 Linux 版本，以此此类推。\n\n但我们也可以定义任意的自定义标签。假设我们在一个新的 Go 文件开头放入以下内容：\n\
  \n```\n\n现在，除非定义了 `integration` 标签，否则 Go 工具将忽略此文件，在正常情况下它不会定义，因为不是预定义标签之一。如果文件包含测试，`go\
  \ test` 命令将不会运行它们。如果它包含实现，`go build` 将不会构建它们，以此此类推。\n\n假设我们为 `GetPmsetOutput` 写了一些测试，并将其放在单独的\
  \ Go 文件中，受 `integration` 构建标签保护。它不会被 `go test` 运行，这正是我们想要的，但当我们想运行时，该*如何*运行呢？\n\n\
  答案是你可以向 `go test` 命令提供任意构建标签，所以我们会运行类似下面的命令：\n\n```\n\n现在标签定义了，所以文件对 Go 可见，测试也将运行。但如果我们不在命令行中提供该标签，它就不会运行。\n\
  \n### 测试命令运行器\n\n我们应该写什么样的集成测试？我们知道将调用 `GetPmsetOutput`，该函数会执行 `pmset` 命令。很好。那么我们可以对它测试什么呢？\n\
  \n嗯，问题的另一种问法是：“什么可能会失败？”显然，运行命令可能由于许多原因而失败，最可能是命令不存在或路径不同。\n\n例如，我们在非 macOS 机器上运行此测试，它预计会失败。所以这是我们可以检查的一点。在这种情况下，我们会得到类似这样的错误：\n\
  \n```\nfork/exec /usr/bin/pmset: no such file or directory\n```\n\n如果这种情况在测试中发生，我们可以做一些工作让测试失败更友好。例如，我们可以检查\
  \ `runtime.GOOS` 的值，它告诉我们 Go 认为运行在什么操作系统上。如果不是 `darwin`，我们可以报告类似这样的失败：“此测试仅在 macOS\
  \ 上运行且 `/usr/bin/pmset` 可用时有效。”\n\n不过这有点花哨了，所以目前如果由于某种原因无法运行 `pmset` 命令，我们只简单使用\
  \ `t.Skip` 跳过测试。\n\n\n\n\n我们还需要进行另一个合理性检查。即使 `pmset` 可用，在没有电池的设备（例如 Mac mini）上，它也不会向我们报告任何有用信息。因此，如果我们从\
  \ `pmset` 的输出中没有找到 `InternalBattery` 字符串，我们也应该跳过这项测试。\n\n现在调用被测试的函数是相当安全的，那么我们应该测试它的什么内容呢？`GetPmsetOutput`\
  \ 返回一个字符串，所以我们可以测试该字符串是否为空，但这并不能证明什么。我们能做更多吗？我们无法预先知道字符串实际上*是什么*，所以不能简单地将其与一个字符串字面量进行比较。\n\
  \n但我们还有其他*可以*对它做的事情。我们可以将其传递给 `ParsePmsetOutput`。毕竟，如果我们正确地执行了 `pmset` 命令，那么它的输出*应该*是可以无错误解析的，不是吗？\n\
  \n所以我们可以检查错误值，但对于生成的 `Status` 结构体，还有什么可以测试的吗？事实证明，并没有。\n\n我们*可以*查看 `ChargePercent`\
  \ 字段并看它是否为默认值 `0`，这表示它尚未设置。但电池电量可能真的*是* 0%，在这种情况下，我们就会为实际上正确的代码得到一个虚假的测试失败。\n\n\
  无论如何，我们实际上根本不需要检查结果。如果 `ParsePmsetOutput` 没有返回错误，那么结果在定义上就是有效的。我们知道该函数可以工作，因为它有*自己*的测试。\n\
  \n我们在这里并不是在*测试*解析过程，只是利用它来检查 `pmset` 是否返回了可解析的内容。如果确实如此，我们就认为自己在执行它时没有搞得*太*糟糕。所以到目前为止我们已经做得足够了。\n\
  \n这里是测试代码：\n\n```go\n```\n\n([列出 battery/1](https://github.com/bitfield/tpg-tools2/blob/main/battery/1/battery_integration_test.go))\n\
  \n即使解析 `pmset` 输出没有错误，如果能*知道*实际解析的是什么值会更好，因此我们将其传递给 `t.Logf`。除非测试失败，或者我们使用 `-v`\
  \ 标志运行 `go test` 以启用详细模式，否则这些输出不会被打印。\n\n## 运行命令\n\n如果我们提供 `GetPmsetOutput` 的空实现，我们应该能够运行此测试并看到它失败：\n\
  \n```go\n--- FAIL: TestGetPmsetOutput_CapturesCmdOutput (0.00s)\n    battery_integration_test.go:19:\
  \ failed to\n        parse pmset output: \"\"\n```\n\n### 捕获输出\n\n很好。现在，我们如何实现 `GetPmsetOutput`\
  \ ？你已经知道如何使用 `exec.Command` 创建命令对象，以及使用 `Run` 运行它。如何获取它的输出作为 Go 值？\n\n在 `ls` 示例中，我们设置了命令的\
  \ `Stdout` 字段将输出发送到某处。可以使用类似 `strings.Builder` 的东西来捕获它，但有更简单的方法。\n\n命令对象有一个 `Output`\
  \ 方法，它可以运行命令并将输出作为字符串返回。事实上，获取标准错误流也非常方便。\n\n我们可以通过调用 `CombinedOutput` 同时获取标准输出和标准错误。如下：\n\
  \n```go\n([列出 battery/1](https://github.com/bitfield/tpg-tools2/blob/main/battery/1/battery.go))\n\
  \n这应该能通过测试，让我们尝试：\n\n```bash\nfork/exec /usr/bin/pmset -g ps: no such file or directory\n\
  ```\n\n哎。命令行作为一个单一字符串是正确的，但那并不是你将其*传递*给 `exec.Command` 的方式。\n\n它需要被拆分成单独的字符串，每个命令行参数一个：\n\
  \n```go\n// 好在我们写了那个集成测试，否则我们可能在真正运行程序之前都不会发现那个 bug。\n\n让我们再次尝试一次：\n\n```text\n\
  ...\n    battery_integration_test.go:21: Charge: 100%\n--- PASS: TestGetPmsetOutput_CapturesCmdOutput\
  \ (0.02s)\n```\n\n这不仅通过了，而且由于于 `-v` 标志，我们可以监控传递给 `t.Logf` 的电量百分值：\n\n```text\nCharge:\
  \ 100%\n```\n\n当然，我们对这个包还可以做更多事情，但这是一个很好的开始。某些程序员会很高兴，我们为他们提供了一个直接的方法，在 Go 代码中获取电池状态。否则，他们必须像我们所做的那样：研究运行什么命令、具体如何调用它、解析其输出等等。\n\
  \n## 何时导入第三方包\n\n当你遇到一些无法通过标准库简单解决的问题时（例如电池状态示例），值得提几句建议。这种情况经常发生，所以我们应该如何思考正确的处理方式？\n\
  \n第一要务是寻找一些现有的第三方包（例如在 [`pkg.go.dev`](https://pkg.go.dev/) 上查找）。如果已经有一个纯 Go 包恰好能实现我们需要的功能，那就太棒了——它的许可证允许我们使用它。但有时，我们能找到的最好的只是*接近*我们想要的东西。我们可能需要做大量的工作才能让它解决我们的问题。\n\
  \n即使我们是复制代码而不是导入它，我们仍然引入了一个可能包含 bug 的外部对象。如果它没有我们可以复制的单元测试，我们应该用测试来覆盖它。我们不能仅仅采取“如果某个东西在\
  \ GitHub 或 StackOverflow 上，它一定没问题”的态度。事实并非如此，对这些来源进行简要检查就能证实。\n\n毕竟，Go 的采用正在迅速增长，从统计学上说大多数\
  \ Go 程序员都是相对初学者。以此类推，我们在网上发现的大多数 Go 代码都不会太好。这并不意味着我们应该永远不要使用“找到的代码”：它意味着我们不应该假设它一定是良好风格的典范，甚至不假设它一定有效。\n\
  \n## 进一步探索\n\n如果你对编写一些执行外部命令的有趣程序感到兴奋和灵感，或者即使你没有，这里有一个建议：\n\n*   用 Go 写一个命令，计算执行某些*其他*命令所需的时间。例如，你可以这样使用它：\n\
