  \n```\nSunny 12.0ºC\n```\n\n### 处理更复杂的 API\n\n我们在本章中开发的代码是构建用于或任何 API 客户端的良好起点。让我们简要查看一下我们可能需要扩展代码以应对更复杂\
  \ API 的方法。\n\n### 请求数据\n\n我们可能需要将 JSON 编码的主体发送请求数据，而不是将其嵌入 URL 中。在这种情况下，定义一些 `APIRequest`\
  \ 适配器 struct 可能是一个好主意，就像我们对 `OWMResponse` 做的那样。\n\n为了确保我们正确序列化了请求数据，`httptest` 处理器可以通过\
  \ `unmarshalling` 它并与原始值进行比较来检查它。对于具有不同类型请求和响应的多个端点的 API，我们可能需要多个适配器 struct。\n\n\
  ### “CRUD” 方法\n\n管理某种外部资源的 API 的一种常见模式是被称为 `CRUD` 的方法集：创建（Create）、读取（Read）、更新（Update）和删除（Delete）。将这些每一项映射到客户端对象上相应的\
  \ Go 方法是合理的。\n\n资源通常关联着某个唯一 ID，以便我们可以指定我们想要的那个。通常 API 会分配一个 ID，因此 `Create` 应该返回它，而\
  \ `Read`、`Update` 和 `Delete` 应该将其作为参数。\n\n你通常可以一次性为所有的 `CRUD` 方法编写单个测试。它应该创建一个资源，读取它以检查是否已正确创建，更新它，并再次读取它以确保更新生效。然后测试可以删除该资源，并确保最后的读取失败，因为它已不再存在。\n\
  \n### 结语\n\n好了，我们已经到了结尾了。感谢你和我一起开启这段旅程！\n\n我们在书的开头描述了 Go 的“通用库”，并重新定义了我们作为软件开发者的角色——将自己视为这个库的贡献者，而不仅仅是编写解决即时问题的一次性工具。换句话说，我们编写的是包（packages），不仅仅是程序（programs）。\n\
