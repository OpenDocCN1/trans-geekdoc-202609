  \n这看起来很有前景。我们无法控制 `Println` 将输出发送到哪里，因为那是`hard-wired`（硬编码的）：它始终是 `os.Stdout`。但我们`can`\
  \ 控制 `Fprintln` 输出的去向，因为目的地是该函数的第一个参数。\n\n如果我们能构造一个 `Fprintln` 接受作为目的地的对象，我们就有了解决测试问题的方法。那么它是什么样子呢？这是\
