  \ 对其进行循环。\n\n接下来，我们使用现有的 `CmdFromString` 函数来解析命令行并创建一个可运行的 `Cmd` 对象。\n\n最后，我们使用\
  \ `CombinedOutput` 方法运行命令，*并且*将其标准输出和标准错误作为字符串获取，然后将其打印，连同任何错误一起输出。\n\n这非常基础，但它应该能*起点作用*。让我们试一下：\n\
  \n```go\n\n```\n\n```go\n\n```\n\n```go\n\n```go\n\n```\n\n嗯，没反应。它正在等待输入，但如果我们不知道这一点，可能只会认为它没有工作。\n\
  \n让我们记一下，添加一个合适的*提示*（prompt）字符，让它更符合用户习惯。\n\n如果我们输入一个命令会发生什么？\n\n```bash\nhello\n\
  ```\n\n不错！但如果输入一个不存在的命令呢；我们会看到错误吗？\n\n```bash\nerror: exec: \"bogus\": executable\
  \ file not found in $PATH\n```\n\n看起来很合理。我们还能尝试些什么？\n\n我们的“规范”说空行应该被忽略，所以让我们看看输入一个空行时会发生什么。什么都没有。极了。\n\
  \n最后，当我们关闭输入流（可以通过输入 Ctrl-D 实现）时会发生什么？我们希望 shell 能干净地关闭，理想情况下带有一个礼貌的告别信息，但它只是静静地退出了。没关系；我们可以稍微改进一下礼貌。\n\
  \n### 用户测试的反馈\n\n这是一次非常出色的*用户测试*。在开发早期尽早让你的程序面对真实用户 一直是一个很棒的主意。在这个阶段进行修改比以后要容易得多，因为那时我们将有很多多的代码需要修改。\n\
  \n当你真正开始使用程序的那一刻，你就会发现它有很多问题。所以不要等到太无法修复时才推迟这一时刻。相反，要尽快写得到一个可运行的程序，然后运行它。一旦你成为自己软件的*用户*，你就会立即发现那些在只看代码时无法察觉的可用性问题。\n\
