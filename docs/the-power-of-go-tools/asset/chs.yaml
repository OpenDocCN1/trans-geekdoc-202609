  \ 95% 的情况下，用户想要的都是 `os.Stdout`。\n\n那么遗憾的是，每个人都必须为提供这个强制性参数而付出易用性的代价。当然，传递这一个微小的值并不是什么大事，但这是*文书工作*。微小的不便在足够大的\
  \ API 上会累积起来变成一个主要的烦恼，因此我们想尽可能地消除它们。\n\n那么，有没有什么方法可以允许用户省略这个参数，*除非*他们想要“高级自定义”模式？我们*希望*程序能够默认将内容打印到\
  \ `os.Stdout`，除非我们选择用其他东西来覆盖它（例如在测试中）。\n\n## 如果我们允许用户传递 `nil` 呢？\n\n这里有一个主意。假设我们不再要求用户传递某个有效的\
  \ `io.Writer` 值作为参数，而是让他们传递 `nil`。我们可以在函数中检查这一点，在这种情况下将写入器设置为我们默认的 `os.Stdout`：\n\
