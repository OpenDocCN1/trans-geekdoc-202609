  \ Go 程序读取和写入 JSON 编码的数据。\n\n### `json` 包\n\n处理 JSON 的标准库 API 与 `gob` 的非常相似：\n\n\
  ```\n\n```\n\nJSON 数据通常用 UTF-8 编码的文本表示，这意味着它是人类可读的（对于某些“人类”值而言）：\n\n```\n\n```\n\
  \n将数据序列化为文本而不是比 `gob` 更节省空间的二进制格式（如 `gob`）有什么意义呢？嗯，能够肉眼读取编码后的数据是有用的，而这在 `gob` 中是无法做到的。\n\
  \n例如，我们可以看到这是从字符串（`john`）到某种结构体的映射，其中有一个数字类型的 `age` 字段和一个是字符串切片的 `hobbies` 字段。我们可以看到所有这些字段的值。\n\
  \n空白字符和换行有助于可读性，但实际上 JSON 忽略了它们。它们只是允许我们对数据进行*格式化打印*（pretty-print）以获得更好的可读性。\n\n\
  ### JSON 是一种实用的辅助语言\n\nJSON 并不感知 Go，但另一方面它的语法足够通用，适用于大多数编程语言和数据类型。这也许在某种程度上解释了 JSON\
  \ 为何被广泛采用。\n\n那么，JSON 的主要用途作为不同应用程序之间通信数据的辅助语言是合理的。使用 JSON 作为输入/输出也变得越来越常见。正如我们在管道章节中讨论过的，传统的\
  \ Unix 工具使用纯文本相互通信，或者更通地说，使用字节流。这与我们本书的重点完美契合。然而，字节流缺乏任何结构。\n\n### JSON 输出选项\n\n\
  JSON 至少具有了一些结构的概念：字符串、数字、切片和结构体。由于这个原因，许多工具如 `kubectl` 和 `terraform` 已经提供了 JSON\
  \ 选项。\n\n反使得编写编写它们输出的工具变得简单得多。有一些强大的工具可以操作 JSON，例如非常有价值的 `jq`：\n\n* [`stedolan.github.io/jq/`](https://stedolan.github.io/jq/)\n\
