  \ 什么时候被关闭？\n\n* * *\n\n### 空切片检查\n\n**解决方案：** 问题一是我们假设 `args` 切片至少包含一个元素。如果没有，代码将发生\
  \ panic（崩溃），因为它引用了 `args[0]`。事实上，除非你确定切片包含相应数量元素，否则引用切片索引是不安全的。我称之为 *YOLO 切片访问*；“人生只有一次”对于某些决策来说可能是一个很好的策略，但在编程中通常不适用。\n\
  \n在测试中，我们传递了一个单元素切片，所以这个问题被无意中隐藏了。我们如何通过测试优先的方法修复这个问题？\n\n**目标：** 通过测试优先修复此问题。\n\
  \n* * *\n\n**提示：** 事实上，我们刚刚想到了一个新行为，我们之前并没有意识到需要它。具体来说，如果我们向 `WithInputFromArgs`\
  \ 传递一个 nil 或空切片，程序不应该 panic。良好的程序不会 panic，优秀的程序员也不会。\n\n相反应该发生什么？嗯，我们的初衷是想让用户在命令行上传递文件名，我们已经做到了。但如果他们恰好没有提供任何文件名作为参数，程序直接读取标准输入是合理的。\n\
  \n更具体地说，我们可以规定如果向 `NewCounter` 提供了 `WithInputArgs` 但没有参数，它应该使用标准输入。\n\n### 测试无参数行为\n\
