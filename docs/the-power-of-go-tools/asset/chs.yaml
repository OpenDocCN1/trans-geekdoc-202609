  \ `main` 调用。\n\n\n\n\n\n让我们把自己想象成一个尝试使用我们包的用户。也许他们一直苦恼于编写一个能打印“hello, world”的 Go\
  \ 程序，然后他们惊喜地发现发布了一个名为 `hello` 的新包，恰好可以实现这个功能。\n\n## 强制性参数很烦人\n\n他们的第一步可能是尝试用一下，使用一个类似于我们在列表\
  \ [hello/3](https://github.com/bitfield/tpg-tools2/blob/main/hello/3/cmd/hello/main.go)\
  \ 中编写的程序：\n\n\n\n从开发者体验的角度来看，这*还可以*，但并不完美。为什么我们在这里必须把 `os.Stdout` 作为参数传递呢？难道这几乎是我们总是想要的东西不是显而易见的吗？为什么要让我们做这些显然没用的文书工作呢？\n\
  \n嗯，*我们*知道原因：那个参数必须在那里，因为在测试中，它不会是 `os.Stdout`；它会是 `*bytes.Buffer` 的东西。测试当然很棒，但*用户*真的想去传递这个参数吗？\n\
  \n答案是他们*可能*想：列表 [hello/3](https://github.com/bitfield/tpg-tools2/blob/main/hello/3/cmd/hellosrv/main.go)\
