  \ 中找到一种可能的解决方案。\n\n## 3. 参数\n\n> *对于客户来说，界面**就是**产品。*\n\n> —Jef Raskin，《人机交互》](https://amzn.to/3AeMh07)\n\
  \n![](img/file4.png)\n\n有很多仅在标准输入和输出上运行的有用程序，例如上一章中的行计数器。\n\n然而，如果我们有一种在命令行上传递程序参数的方法，我们就可以扩展可用行为范围。\n\
  \n例如，现在我们必须通过管道向我们的 `count` 程序输入文本，如下所示：\n\n```\n\n```\n\n```\n\n但如果你还没有这样做，你*可能会*假设程序应该通过命令行传递某个文件名。例如：\n\
