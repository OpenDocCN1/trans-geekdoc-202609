  \ [`howlong/1`](https://github.com/bitfield/tpg-tools2/blob/main/howlong/1)。\n\n\
  ## 8. Shell\n\n> *个人在很大程度上是不可编程的。他们所做的事情是富有想象力的程序员意想不到的。而他们想要那些程序员无法预判的东西。*\n\n\
  > —Scott Rosenberg,[《代码中做梦》](https://amzn.to/3NrFwhi)\n\n![](img/file9.png)\n\n\
  在上一章中，我们看到了如何使用 `exec` 包从 Go 运行命令。按照这个思路写一个非常基础的 shell 并不难。到底什么是*shell 呢？\n\n本质上，shell\
  \ 从输入中读取行并将它们作为命令执行。嗯，我们知道如何做这两件事，所以让我们玩玩吧，尝试写一个世界上功能最少的 shell。\n\n## 一个简单的 shell\n\
  \n\n\n\nShell（外壳）是一个初看起来本质上难以测试的程序示例，因为它是*交互式*的：它接收用户的输入并返回输出。你如何在测试中提供输入，或者如何验证输出呢？我们在书中已经介绍了一些可以帮助解决这些问题的技术。\n\
  \n### 定义行为\n\n但很容易掉入这样的陷阱：在自己脑子里完全搞清楚行为应该是什么之前，就尝试去写测试。让我们通过写下关于 Shell 应该做什么的一些合理假设，来稳固地建立这一点：\n\
  \n1. 它应该读取一行输入，并将其解释为命令行。\n2. 它应该执行该命令行并打印输出，以及任何错误信息。\n3. 如果输入行为空，Shell 应该什么都不做。\n\
  4. 如果输入行只包含文件结束符（EOF），Shell 应该退出（或许带有一条友善的提示信息）。\n\n这些描述足够具体了，让我们至少在编写某些测试时感到更加从容。也许不是*完全*的从容，但这是一个开始。\n\
  \n如果你不确定如何测试某个东西，通常是因为你还不确切知道它应该如何表现。情况通常也是如此。\n\n并不是我们最终无法写出覆盖所有指定行为的测试，但那对于帮助我们*实现*该行为可能并不是一个实用的测试。我们希望将其拆分成更小的部分，这样我们就可以通过测试先行的方式，逐步构建我们所需的机制。\n\
  \n### 确定第一个测试\n\n一项重要的软件设计技能是将问题*拆分*为我们可以独立预见测试和实现的行为单元。\n\n尽管我们关注的是行为而非函数，但问问自己“这里是否有任何一段行为可以实现为一个自包含的函数？”可能会很有帮助。\n\
  \n如果你看不出如何测试整个程序，也就是说，你可以转而问：“那么，我*可以*测试它的哪部分呢？”\n\n即使我们只能找到一件事，那也能帮助我们开始。假设我们从第一个行为开始：将输入行解释为命令。\n\
  \n我们知道，无论程序还做什么什么，它都需要能够接收一个表示命令行的字符串，并使用 `exec` 包从其创建一个可运行的 `Cmd` 对象。这听起来像是我们可以为之编写测试的内容。\n\
  \n**目标：** 为函数 `CmdFromString` 编写测试，该函数接收一个字符串并返回相应的 `*exec.Cmd` 值。该函数应该能够由空格分隔的命令行参数。\n\
  \n***\n\n**提示：** 再次，即使是看似简单的测试也向我们提出了一些有趣的小问题。第一个谜题是，我们的 `want` 是什么？\n\n假设我们有一些像\
  \ `/bin/ls -l main.go` 的输入（如之前的示例），并且函数返回了一个配置适当的 `*exec.Cmd`。我们如何检查它是正确的？\n\n我们想将\
  \ `CmdFromString` 的结果与测试期望的 `*exec.Cmd` 对象进行比较，但这可能并不简单。你能想到什么办法吗？\n\n### 比较不可比较的对象\n\
  \n**解决方案：** 我们可以从尝试这样一个想法开始：\n\n```\n```\n\n```\n\n这看起来合理，但行不通：\n\n```\nwant /bin/ls\
  \ -l main.go, got /bin/ls -l main.go\n```\n\n尽管它们打印的内容相同，但显然 `want` 和 `got` 并不相等。这是怎么了？\n\
  \n我们知道它们是指针，所以与其使用通用的 `%v`，不如使用用于指针的特殊格式化符 `%p`，来查看它们到底是什么：\n\n```\n```\n\n```\n\
  \n这清楚地解释了为什么它们不相等，以及为什么比较指针是没有意义的：\n\n```\nwant 0xc0000ec000, got 0xc0000ec160\n\
  ```\n\n它们指向内存中不同的位置。我们真正想要的是比较*它们所指向的结构体*，而不是指针本身。假设我们使用 `*` 运算符对两个值进行解引用：\n\n```\n\
  \n```\n\n```\n\n但这同样行不通：\n\n```\ninvalid operation: *want != *got (struct containing\
  \ []string\ncannot be compared)\n```\n\n就像比较两个指针没有意义一样，比较两个切片（slice）也没有意义，因为切片和指针一样，只是指向存储真实数据的内存位置的引用。因此，不允许比较包含切片字段的结构体。\n\
  \n幸运的是，我们不需要检查整个 `Cmd` 结构体，只需要它的 `Args` 字段。这是一个切片，但我们知道如何使用 `cmp.Equal` 来比较切片：\n\
  \n```\n\n```\n\n```\n\n由于 `CmdFromString` 的实现目前为空（简单地返回一个空命令），我们现在应该能看到测试失败，事实也确实是这样：\n\
  \n```\n-  \"/bin/ls\",\n+  \"\",\n-  \"-l\",\n-  \"main.go\",\n```\n\n**目标：** 通过实现\
  \ `CmdFromString` 使此测试通过。\n\n### 解析用户输入\n\n**提示：** `CmdFromString` 需要做什么？给定一个类似\
  \ `\"/bin/ls -l main.go\"` 的字符串，我们希望它返回以下结果：\n\n```\n\n```\n\n```\n\n这本质上只是按空格分割字符串，不是吗？我们可以使用\
  \ `strings.Fields` 来做到这一点：\n\n```\n\n```\n\n```\n\n现在我们有了一个字符串切片 `args`。我们知道路径将是第一个元素：`args[0]`。参数将是剩余的所有元素：`args[1:]`。\n\
  \n等等，如果 `input` 只包含空白字符或为空，`strings.Fields` 会返回一个空切片。在这种情况下，构造 `Cmd` 有意义吗？没有，因为对命令调用\
  \ `Run` 会导致崩溃（panic）。所以看起来 `CmdFromString` 在这种情况下需要返回 `error`。\n\n让我们更新测试吧：\n\n\
  ```\n\n```\n\n为了确保函数在输入为空时*确实*返回错误，让我们为此添加一个新的测试：\n\n```\n\n```\n\n***\n\n**解决方案：**\
  \ 为了通过*这个*测试，我们必须检查 `len(args)`，如果没有至少一个元素，则返回错误。不过，假设元素足够，我们可以将它们传递给 `exec.Command`\
  \ 并返回结果：\n\n```\n\n```\n\n```\n\n为什么是 `args[1:]...`？我们可能会尝试只写：\n\n```\n\n```\n\n\
  ```这*看起来*合理，但行不通：\n\n```\ncannot use args[1:] (value of []string) as string value\n\
  in argument to exec.Command\n```\n\n`args[1:]` 的结果是一个切片，但 `exec.Command` 并不*接收*切片：它是变变的，所以它接收任意数量的*字符串*。因此，我们需要使用展开运算符“`...`”将\
  \ `args[1:]` 的每个元素作为单独参数传递。\n\n 原型设计\n\n我们知道自己需要一个组件，但目前还不完全清楚它将如何融入整个程序中，或者我们可能还需要什么。让我们做一些原型设计，以便在尝试构建之前弄清楚我们到底*想要*什么。\n\
  \n### 伪代码大纲\n\n当你不确定程序的整体结构时，最好的办法是先草拟出 Shell 程序大致的样子，使用所谓的*伪代码*：\n\n\n\n\n\n```go\n\
  repeat forever:\n    read input line\n    parse command\n    execute command\n \
  \   print output or error\n```\n\n我们还没有完全准备好为这个部分编写测试，因为我们还需要完善一些细节。所以，让我们使用一种我称之为、略带开玩笑的技巧——*主驱动开发*（main-driven\
  \ development）。\n\n我们将编写一些 `main` 函数，大致实现我们想要的功能，因为我们现在还不完全*确定*自己具体想要什么。我们需要看到它运行起来是什么样子，并且可能还需要微调一些细节。\n\
  \n如果你不确定测试应该测试什么，可以尝试先写一个丢弃版的函数版本并对其进行测试，然后把它丢掉。让我们在这里采用这种策略。\n\n**目标：** 编写一个 `main.go`\
  \ 来实现基础的 shell 循环。不需要花哨，只需足够在屏幕上显示一些东西，这样我们就可以对其进行测试和调整。\n\n***\n\n**提示：** 好了，我们知道如何使用\
  \ `bufio.Scanner` 从标准输入读取行：这我们在关于行计数器的章节中已经做过了。让我们从这样的循环开始，然后添加对 `CmdFromString`\
  \ 的调用，将用户的输入转换为一个我们可以运行的命令对象。\n\n我们还知道如何使用 `CombinedOutput` 运行命令并获取合并输出，就像我们在上一章中处理电池状态命令时所做的那样。看看能否将这些部分组合起来，创建一个\
  \ shell 的雏形。\n\n### 主驱动开发\n\n**解决方案：** 这是我对程序的第一次尝试（位于 `cmd/shell/main.go`）：\n\n\
