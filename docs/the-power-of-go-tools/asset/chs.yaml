  \      unexpected command failure\n```\n\n嗯。看起来脚本中的 `exec` 这一行失败了，并不是因为 `count`\
  \ 命令返回了非零退出状态，而是因为我们的路径中*没有* `count` 命令。这很合理：我们还没有编译它！\n\n### 定义自定义命令\n\n请注意，我们完全可以乐意执行任何在路径中*确实存在*的外部命令，包括任何我们可以从终端运行的命令。这有时很有用，但并不是我们在这里需要的，因为我们想运行我们的\
  \ `count` 程序*就像*它是一个外部二进制文件一样，而不需要实际上去创建一个它。\n\n为了做到这一点，我们需要增加部分代码：\n\n```\n\n```\n\
