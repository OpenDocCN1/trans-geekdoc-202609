  \n这个程序有几个问题，至少是它相当复杂。你可能想通过理解它的工作原理来测试你的代码能力，但我并不推荐将其作为 Go 风格的模型。\n\n它只是一个快速、未经测试的黑科技，这也是部分原因。在\
  \ DevOps 工作中，我们经常被要求快速解决问题，而不是优雅。服务器现在可能正在着火，我们需要找出是哪个 IP 地址在烧它。用 shell 做这些要快得多，而且生成的程序要简单得多。\n\
  \n所以对于我们这些 Go 粉丝来说，这不是一个令人满意的结果。如果 Go 这么棒，为什么它看起来不适合这个问题呢？我们更想写什么样的代码？\n\n### 在什么语言中编写这很简单？\n\
  \n考虑到问题的性质，我们更倾向于将解决方案表达为*流水线*，就像 shell 程序一样。我们如何在 Go 中表达这种方式？类似这样的如何？\n\n```\n\n\
  换句话说，读取 `log.txt`，获取第一列，按频率排序，获取前十结果，并将其打印到标准输出。\n\n这不仅极其简洁，而且可能比 shell 流水线还要清晰。那么，我们可以让它变成现实让我们让我们。\n\
  \n## 程序即流水线\n\n在本书中，我们一直使用软件设计的“禅登山”技术：编写我们*希望*能写出的代码，然后推导出必要的架构来使这些代码可行。\n\n那么，我们该如何像禅登山者一样对付这个问题呢？我们已经完成了第一部分：我们有一个看起来不错的程序。那么，为了让这个程序按照编写的方式工作，我们还需要构建什么？\n\
  \n该程序一个值得注意的特点是它似乎主要由一系列*方法调用*组成。例如：\n\n```\n```\n\n`Column` 显然是某个东西的一个方法，`Freq`\
  \ 如此：点符号告诉了我们这一点。但到底是什么什么类型的方法呢？\n\n### 流畅式 API (Fluent API)\n\n\n\n\n假设这些方法中的每一个都会形成独立的、可重用的阶段，并且我们可以按顺序将它们组合在一起以实现我们想要的操作。那么这意味着什么？\n\
  \n嗯，为了让这个想法生效，`Column`、`Freq` 以及其他方法都必须是同一种类型的方法。我们称之为 `Pipeline`，并假设它是某种结构体。如果流水线上的每个方法也*返回*一个\
  \ `pipeline`，那么我们就可以按需链式调用任意数量这样的方法。\n\n这种模式有时被称为 `fluent` API（流式 API），其意思是数据“流过”流水线，上一个方法的输出作为下一个方法的输入。这和我们在本章开头看到的\
  \ Shell 流水线完全一样。这听起来很有前景！\n\n不过，此时我们产生了一个问题：当发生错误时会发生什么？\n\n## 顺序化操作中的错误\n\n显然，流水线阶段*可以*发生错误。例如，`File(\"\
  log.txt\")` 可能会因为文件不存在或我们无法读取而失败。通常，我们会让方法返回一个 `error` 结果来处理这个问题。\n\n但 `File` 方法在这里不能返回错误结果，因为这样我们就无法链式调用方法了。如果我们要对\
  \ `File` 的结果调用 `Column`，那么 `File` 只能返回一个值，而不是两个。\n\n如果 `File` 只能返回一个 `pipeline`，那么如果该流水线是无效的，而我们随后对其调用\
  \ `Column` 等方法会发生什么？我们不希望程序因 `panic` 而崩溃。我们需要某种方法让 `Column` 知道它实际上是否有有效数据可读。\n\n\
  为了解释这将如何工作，让我们先想一个更简单的程序。假设你有一个 `io.Writer`（可能代表一个文件），你需要向它写入许多短数据。\n\n每一个单独的写入操作都可能返回错误，因此你必须轮流检查每一个错误。类似于：\n\
  \n```\n```\n```\n```\n\n重复本身并不是问题，但*这种*重复真的是有必要的吗？我们真的需要检查每个单独 `Write` 操作的错误吗？还是我们真的只关心序列中的*某处*是否发生了错误？\n\
  \n我们对每个错误都采取完全相同的行动，立即退出并返回错误。看起来我们应该只需要这样做一次，而不是在每次写入操作后都做一次。\n\n我们可以在所有写入完成后，只检查\
  \ `err` 的最终值吗？不，因为可能*某些*写入失败了，但随后的写入成功了。当我们检查它时，`err` 变量会被覆盖为 `nil`。\n\n这*看起来*一切正常，但我们静默地丢失了一些用户数据。这是一个问题。我们能对此做什么？\n\
