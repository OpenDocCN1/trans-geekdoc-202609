  \n> *似乎对于我写的任何软件，在几年后我都会开始讨厌它，因为它变得越来越脆弱且令人令畏。*\n\n> *回想起来，我想我是在反应对未测试代码的常见体验：小小的改变意意导致了难以理解的大崩溃。*\n\
  \n> —Tim Bray，“[20 年代的测试](https://www.tray.org/ongoing/When/20x/2021/05/15/Testing-in-2021)”\n\
  \n![](img/file17.png)\n\n当你开启软件工程生涯或开始一个新项目时，脑子里在想些什么？你对要写的软件有什么希望和梦想？当你几年后回看它时，会有什么感觉？\n\
  \n我们将与优秀的软件联系在一起许多品质，但无疑最重要的它是它必须具有*正确性*。如果它没有做它应该做的事，那么它的其他属性几乎都不重要。\n\n## 自测试代码\n\
  \n我们如何知道编写的软件是正确的？而且，即使它开始是正确的，我们如何知道我们对其进行的微调没有引入 Bug 呢？\n\n\n\n\n\n能够让我们对软件的正确性更有信心的这一点就是为它编写测试。虽然测试在何时编写时都有用，但事实证明，当我们先编写测试时，它们会变得特别有用。为什么呢？\n\
  \n先写测试最重要的原因是，为了做到这一点，我们需要从用户的角度清晰地理解程序应该如何运行。这涉及到一些思考，而这种思考的最佳时机是在编写任何代码之前。\n\n\
  为什么呢？因为在还没有清楚代码应该做什么之前就尝试编写代码，纯粹是在浪费时间。它在重要方面几乎注定是错的。我们还可能设计出一个从实现者的角度很方便的设计，但它并不一定符合用户的需求。\n\
  \n先测试工作（Test-first）鼓励我们以小增量的方式开发系统，这有助于防止我们在错误的道路上走得太远。关注用户可见的微小、简单的行为也意味着我们对程序所做的所有工作都是为了增加它对用户的价值。\n\
  \n测试还可以引导我们走向良好的设计，部分是因为它们带给我们了一些使用自己 API 的经验，部分是由于将一个大程序拆分成许多小的、独立的、规范良好的模块会使其变得更易理解和维护。\n\
  \n我们的目标是得到自测试代码：\n\n> *当你能够对代码库运行一系列自动化测试，并确信如果测试通过，你的代码就没有任何实质性缺陷时，你就拥有了自测试代码。*\n\
  \n> *我对此的一种理解是，在构建你的软件系统的同时，你同时也构建了一个能够检测系统内部任何故障的检测器。如果团队中的任何人意外引入了 bug，检测器就会响起来。*\n\
  \n> —Martin Fowler,[“自测试代码”](https://martinfowler.com/bliki/SelfTestingCode.html)\n\
  \n这不仅仅是因为测试良好的代码更可靠，尽管那也很重要。测试真正的威力在于它们让开发者变得更快乐、压力更小，并提高了效率。\n\n> *测试是程序员的点石金石，将恐惧转化为无聊。“不，我没有搞坏任何东西。测试全部还是绿色的。”我感到的压力越大，运行测试就越多。立即运行测试带给我良好的感觉，并减少了我犯的错误，从而进一步减轻了我感到的压力。*\n\
  \n> —Kent Beck，[《示例型测试驱动开发》](https://amzn.to/3OR9pqg)\n\n## 冒险开始\n\n让我们看看在 Go 中先为函数编写测试是什么样的。假设我们正在编写一个老式的文字冒险游戏，比如[Zork](https://www.gamasutra.com/view/feature/1499/the_history_of_zork.php)，我们希望玩家看到这样的内容：\n\
  \n> *阁楼*\n\n\n\n> 阁楼充满了低矮的横梁和奇怪的角度，从一个相对整洁的区域开始，该区域向北、南和东延伸。你可以在这里看到一个电池、一把钥匙一张地图。\n\
  \n冒险游戏通常包含很多不同的地点和物品，但每个地点的共同点是，我们希望能够以句子的形式列出它的内容：\n\n```\n你可以在这里看到一个电池、一把钥匙和一张地图。\n\
  ```\n\n假设我们将这些物品存储为字符串，如下所示：\n\n```\na battery\na key\na tourist map\n```\n\n我们如何能取这样一组字符串并将它们列成一个句子，用逗号隔开，并以“and”结尾呢？这听起来像是一个函数的工作；让我们把它命名为\
  \ `ListItems`。\n\n对于这样的函数，我们可以写什么样的测试？你可能想停下来思考一下。\n\n一种方法是使用某些特定输入（如我们示例中的字符串）调用函数，并查看它返回什么。我们可以预测它在正常工作时应该返回什么，因此可以将该预测与实际结果进行比较。\n\
  \n这是使用 Go 内置的 `testing` 包编写该代码的一种方法：\n\n```\n```\n\n```\n\n([查看 `game/1`](https://github.com/bitfield/tpg-tests/blob/main/game/1/game_test.go))\n\
  \n现在不要太担心细节；我们稍后会处理。这个测试的要点如下：\n\n1. 我们使用测试输入调用函数 `game.ListItems`。\n2. 我们将结果与预期字符串进行对比。\n\
  3. 如果它们不同，我们调用 `t.Errorf`，这会导致测试失败。\n\n注意，我们编写这段代码时就像 `game.ListItems` 函数已经存在了一样。它并不存在。目前，这个测试是一项想象力练习。它表示如果这个函数存在，在给定输入的情况下，我们认为它应该返回这里。\n\
  \n但有趣的是，尽管如此，我们作为编写此测试的不可避免的一部分，已经出了许多重要的设计决策。首先，我们必须调用该函数，因此我们决定了它的名称（`ListItems`）以及它所属的包（`game`）。\n\
  \n我们还决定它的参数是一个字符串切片，并且（隐含地）它返回一个字符串结果。最后，我们通过精确指定函数应该产生什么结果（至少对于给定的输入），将函数的精确行为编码到测试中。\n\
  \n\n\n\n我注意到，当我向学生教授 Go 时，这个概念经常让他们遇到困扰。他们很容易地想象出函数本身可能是错误的。但对他们来说，接受 `test` 可能是错误的这个想法并不容易。遗憾的是，这种情况发生得频繁，即使在编写得最好的程序中也是如此。\n\
  \n**在你看到测试如预期般失败之前，你并没有真正拥有一个测试。**\n\n所以，除非我们看到测试在它应该失败时失败了，否则我们无法`确定`测试本身不包含逻辑错误。那么什么时候`应该`测试失败呢？当\
  \ `ListItems` 返回了错误的结果时。我们可以安排这种情况吗？当然可以。\n\n那么下一步就是：编写恰好足够的代码来让 `ListItems` 返回错误的结果，并验证测试在这种情况下是否会失败。如果它没有失败，我们就知道测试存在问题需要修复。\n\
  \n编写一个错误的函数听起来并不太困难，像这样的代码是可以接受的：\n\n```go\n// \n```\n\n这里几乎所有的内容都取决于我们在测试中已经做出的决定：函数名、它的参数类型、它的结果类型。为了让我们能够调用这个函数，所有这些都必须存在，即使我们只是打算实现足够的部分来返回错误的答案。\n\
  \n那么，我们在这里需要做的唯一选择就是返回什么实际结果，记住我们希望它是`不正确`的。\n\n给定给定的测试输入，我们可以返回的最简单的错误字符串是什么？也许只是空字符串吧。任何其他字符串也可以，只要它不是测试预期的那一个，但空字符串是最容易输入的。\n\
  \n## 使用 `go test` 运行测试\n\n让我们运行测试并检查它是否如我们预期的那样失败了：\n\n**`go test`**\n\n```\n---\
  \ FAIL: TestListItems_GivesCorrectResultForInput (0.00s)\n    game_test.go:18: want\
  \ \"You can see here a battery, a key, and\n    a tourist map.\", got \"\"\nFAIL\n\
  exit status 1\nFAIL    game    0.345s\n```\n\n令人放心。我们`知道`函数还没有产生正确的结果，所以我们预期测试能检测到这一点，而它确实做到了。\n\
  \n另一方面，如果测试在这一阶段`通过`了，或者可能以某种不同的错误失败，我们就知道有问题了。但它看起来没问题，所以现在我们可以继续真正实现 `ListItems`\
  \ 了。\n\n这是一个粗略的第一次尝试：\n\n```go\n// \n```\n\n([代码 `game/1`](https://github.com/bitfield/tpg-tests/blob/main/game/1/game.go))\n\
  \n我真的没有对这个想得太深，我确定这表现出来了。这没关系，因为我们现阶段的目标不是编写优雅、可读或高效的代码。尝试从零开始编写既正确`且`又优雅的代码是非常困难的。让我们不要通过在这里尝试多管兼顾来增加完成的难度。\n\
  \n事实上，我们`现在`唯一关心的事情就是让代码变得正确。一旦我们做到了，就可以随时对其进行整洁。另一方面，试图美化无法运行的代码是没有意义的。\n\n> 现在的目标不是获得完美的答案，而是通过测试。我们稍后会在真理与美的祭坛上做出牺牲。\n\
  \n> —Kent Beck，[测试驱动开发实战](https://amzn.to/3ORpq) 让我们看看它面对测试的表现：\n\n```\n--- FAIL:\
  \ TestListItems_GivesCorrectResultForInput (0.00s)\n    game_test.go:18: want \"\
  You can see here a battery, a key, and\n    a tourist map.\", got \"You can see\
  \ herea battery, a key, tourist map.\"\n```\n\n嗯，这看起来很`接近`，但显然不对。事实上，我们可以在这里改进一下测试，给我们提供一个更有帮助的信息。\n\
  \n## 使用 `cmp.Diff` 比较结果\n\n由于结果的一部分是正确的，但另一部分不是，我们实际上希望测试报告 `want` 和 `got` 之间的`差异`，而不仅仅是打印它们。\n\
  \n这里有一个非常有用的第三方包可以实现：[`go-cmp`](https://pkg.go.dev/github.com/google/go-cmp)。我们可以使用它的\
  \ `Diff` 函数来只打印两个字符串之间的差异。它在测试中看起来是这样的：\n\n```go\n// \n```\n\n([代码 `game/2`](https://github.com/bitfield/tpg-tests/blob/main/game/2/game.go))\n\
  \n这是结果如下：\n\n```\n--- FAIL: TestListItems_GivesCorrectResultForInput (0.00s)\n \
  \   game_test.go:20: strings.Join({\n                \"You can see here\",\n   \
  \     -       \" \",\n                \"a battery, a key,\",\n        -       \"\
  \ and\",\n                \"a tourist map.\",\n          }, \"\")\n```\n\n当两个字符串不同时，`cmp.Diff`\
  \ 会显示哪些部分是相同的，哪些部分只在第一个字符串中，哪些只在第二个字符串中。根据这个输出，两个字符串的第一部分是相同的：\n\n```\n\"You can\
  \ see here\",\n```\n\n但现在有了一些只在第一个字符串（`want`）中的文本：\n\n```\n-       \" \",\n```\n\
  这显示 `ListItems` 在某个地方漏掉了了空格。后面的部分在 `want` 和 `got` 中是一致的：\n\n```\n\"a battery, a\
  \ key,\",\n```\n不幸，`got` 中缺少了：\n\n```\n-       \"and\",\n```\n我们在最后一个项目项前遗漏了“and”：\n\
  \n```\n\"a tourist map.\",\n```\n你可以看到为什么 `want` 和 `got` 之间的差异会让我们得到预期的结果。让我们现在对\
  \ `ListItems` 进行一些调整以解决检测到的问题：\n\n```go\n// \n```\n\n([代码 `game/3`](https://github.com/bitfield/tpg-tests/blob/main/game/3/game.go))\n\
  \n有点丑，但谁在乎呢？正如我们之前看到的，在这一点，我们并不是试图编写美丽的代码。这种方法被形象地命名为“无耻绿色”（Shameless Green）：\n\n\
  > 无耻绿色代码最显而易见的质量是它非常简单。这里没有任何复杂的技巧。代码非常令人容易理解。不仅如此，尽管缺乏复杂性，这种解决方案表现非常好。\n\n> —Sandi\
  \ Metz & Katrina Owen，[99 瓶 OOP：对象设计的实用指南](https://sandimetz.com/99bottles) 句话说，无耻绿色代码以最简单、快速且最易理解的方式通过测试。那种解决方案可能不是`最好的`，正如我们所说，但也许足够。如果我们突然必须放下一切现在发布，我们`可以`咬着牙发布它。\n\
  \n那么 `ListItems` 现在可以工作了吗？测试结果如下：\n\n**`go test`**\n\n```\nPASS\nok      game  \
  \  0.160s\n```\n\n测试通过了，这意味着 `ListItems` 的行为是正确的。也就是说，它正在执行我们要求的操作，即以一种愉快的方式格式化列表。\n\
  \n## 新行为？新测试。\n\n我们对 `ListItems` 的要求`足够`了吗？这个测试在实际游戏代码中有用吗？如果玩家在一个房间里恰好有三个项目，我们可以相信\
  \ `ListItems` 会以正确的方式格式化。四个或更多项目可能也没问题。\n\n但是，只有两个项目呢？从代码来看，我不确定。它`可能`有效，也可能做一些很蠢的事。不过，考虑到`一个`项目的情况，我一眼就能看出结果将没有意义。\n\
  \n格式化一个空项目切片的结果显然也没有意义。那么我们该怎么办呢？我们可以向 `ListItems` 添加一些代码来处理这些情况，这也是许多程序员在这种情况下会做的。\n\
  \n\n\n但等一下。如果我们直接进行该更改，我们该如何知道自己做的是正确的呢？我们至少可以确信不会破坏三个或更多项目的格式，因为如果发生这种情况，测试将开始失败。但我们没有办法知道新代码是否正确地格式化了两个、一个或零个项目。\n\
  \n我们开始时说，我们让 `ListItems` 完成一项特定的任务，并且通过编写测试提前严谨地定义了它。`ListItems` 现在执行了该任务，因为它通过了测试。\n\
  \n如果我们现在反思后决定想让 `ListItems` 执行*更多*操作，那完全没问题。我们在编程时是被允许产生新想法的：事实上，如果没有新想法，那将太遗憾了。\n\
  \n但让我们采纳“新行为，新测试”的规则。每当我们想要一个新行为时，都必须为它编写一个测试，或者至少扩展现有的通过的用例，使其在我们感兴趣的用例上失败。\n\n\
  这样，我们迫使自己在开始编码之前让思路完全清晰，就像编写 `ListItems` 的第一个版本一样。我们也会知道自己什么时候写了*足够*的代码，因为测试将开始通过。\n\
  \n这是我发现学生有时会遇到困难的另一个点。通常，程序员越有经验，带给他们的麻烦就越多。他们太习惯于直接编写代码来解决问题，以至于很难在过程中插入一个额外的步骤：编写新的*测试*。\n\
  \n即使他们最初是测试驱动地编写了一个函数，随后的诱惑也是开始扩展该函数的行为，而不停下来扩展测试。在这种情况下，只需说“新行为，新测试”通常就足够提醒他们的记忆了。但彻底建立这个新习惯需要一段时间，所以如果你在起初遇到困难，你并不孤单。坚持下去。\n\
  \n## 测试用例\n\n我们可以编写一些新的测试函数，为每个想要检查的用例写一个，但那似乎有点浪费。毕竟，每个测试执行的都完全相同：使用某些输入调用 `ListItems`，并将结果与预期进行比较。\n\
  \n每当我们想要重复执行相同的操作，只是每次的数据不同时，我们可以使用*循环*来表达这个想法。在 Go 中，我们通常使用 `range` 操作符遍历某些数据切片。\n\
  \n这里什么数据才合理？嗯，这显然是一个测试*用例*（cases）切片，那么每个用例使用的最佳数据结构是什么呢？\n\n这里的每个用例由两个数据组成：传递给 `ListItems`\
  \ 的字符串和预期的结果。换句话说，就是 `input` 和 `want`，就像我们在现有的测试中一样。\n\nGo 的优点之一是，每当我们想将某些相关数据分组为这样的单个值时，只需为它定义一个任意的\
  \ `struct` 类型。让我们把它命名为 `testCase`：\n\n```\n```\n\n([Listing `game/4`](https://github.com/bitfield/tpg-tests/blob/main/game/4/game_test.go))\n\
  \n我们该如何重构现有的测试以使用新的 `testCase` 结构体类型？嗯，让我们从创建一个只包含一个元素的 `testCase` 值切片开始：我们已经拥有的三个项目用例。\n\
  \n```\n```\n\n([Listing `game/4`](https://github.com/bitfield/tpg-tests/blob/main/game/4/game_test.go))\n\
  \n接下来是什么？我们需要使用 `range` 遍历这个用例切片，对于每个用例，我们想将它的 `input` 值传递给 `ListItems`，并将结果与它的\
  \ `want` 值进行比较。\n\n```\n```\n\n([Listing `game/4`](https://github.com/bitfield/tpg-tests/blob/main/game/4/game_test.go))\n\
  \n这看起来与我们开始时的测试非常相似，只是测试的主体移动到了循环内部。这是合理的，因为我们在测试中执行的是完全相同的事情，但现在我们可以为多个*用例*重复执行它。\n\
  \n这通常被称为*表格测试*（table test），因为它检查了系统在给定不同输入和预期结果表格时的行为。将它们整合在一起时是这样的：\n\n```\n```\n\
  \n([Listing `game/4`](https://github.com/bitfield/tpg-tests/blob/main/game/4/game_test.go))\n\
