  ### 设计行为\n\n良好的程序本身很难被误用。所以，如果用户在命令行提供了文件名，程序应该*正常工作*。\n\n我们该如何安排它？\n\n### 确定范围\n\
  \n按照习惯，让我们先用文字描述我们想要的行为，然后将该描述转化为测试的形式。我们可能会这样：\n\n> “如果命令行指定了文件名，计数器应该计算该文件。否则，它应该从标准输入计数。”\n\
  \n也许你已经想到，在命令行上指定*多个*文件或使用 shell 通配符会方便（例如我们可以写 `count *.go`）。\n\n是的，确实，但让我们先克制一下野心。当你尝试编写任何程序时，一个很好的问题是：“我先能解决这个问题的哪个简单版本？”\n\
  \n如果我们能解决*一个*文件的问题，我们可以将该解决方案扩展到多个文件。所以，让我们分阶段进行。\n\n### 测试命令行参数\n\n首先，如果测试要向 `count`\
