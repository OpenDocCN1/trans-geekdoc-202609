  \n### 以易见性为面向编程\n\n事实上，我们从未真正需要解决任何难题，不是吗？设计的每个阶段在很大程度上逻辑性地衔接于上一个。我们不需要想出天才般的飞跃：当你遇到困难的问题时，你应该停下来有条理地朝着目标工作。\n\
  \n这一点通过阅读标准库的某些部分很好地说明了，例如。这看起来如此简单，几乎不会出错，不是吗？我们徒劳地寻找才华，但代码只是一步一步地向前推进。在结束时，我们觉得似乎漏掉了什么：也许巧妙的代码在另一个文件里。\n\
  \n但并没有巧妙代码。相反，标准库的巧妙性，以及良好的程序，处于更高的层次：在设计。这种简单性是优秀程序的特征，它并非偶然产生。它从以来就是目标。我把这种方式称为“易见性面向编程”，我是它是唯一值得的\
