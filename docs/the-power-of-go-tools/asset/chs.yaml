  \ `ScanWords`：\n\n非常简洁。让我们确保现有的 `lines` 仍然可以工作：\n\n\n\n\n“每个行为一个命令”的方法在像计数器这样的例子中完全合理。但实际的程序通常有许多不同的行为，如果为用户可能想要的每种组合都管理几十个二进制文件，将很奇怪。\n\
  \n### 引入标志（flags）\n\n因此，这类程序通常会让用户使用命令行参数来指定他们想要的行为。例如，我们可以将计数器程序实现为一个接受 `verb`（动词）作为参数的单一命令，如下所示：\n\
  \n```\n\n```\n\n或者\n\n```\n\n```\n\n```\n\n这并不糟糕；只是用户需要多输入一些字符，而且我们当然需要处理用户指定了`unknown`动词或根本没有指定动词的情况。但这是可以实现的。\n\
  \n然而，大多数程序还使用命令行参数处理其他事情。在计数器程序的例子中，它接受文件名。如果我们将动词与这些内容混合在一起，程序如何知道给定的参数代表动词，还是某个输入文件的名称？如果它两者兼是的呢？\n\
  \n因此，通常的做法是使用特殊格式来区分用于控制 `behaviour`（行为）的参数，例如在它们前面加上一个连字符。你可能已经熟悉此类命令中的连字符标志了：\n\
  \n```\n\n```\n\n在这里，开头的连字符识别出 `-v` 是一个标志，而不仅仅是某个 Go 包或源文件的名称。这个标志的特定含义是告诉 `go test`\
  \ 进入 `verbose`（详细模式）：即打印比平时更详细的输出。\n\n### 添加 `-lines` 标志\n\n假设我们为计数器程序添加了一个标志来控制行为，那么它看起来是什么样子的？让我们任意决定，`default`（默认）行为是计算单词，但你可以通过指定\
  \ `-lines` 标志来启用行计数模式：\n\n```\n\n```\n（计算单词）\n```\n\n```\n\n```\n（计算行）\n```\n\n\
  我们可以添加另一个 `another` 标志 `-words` 来计算单词，但没有必要。用户不想多输入任何多余的内容。只有两种可能的行为，所以我们只需要一个标志在它们之间进行选择。\n\
  \n所以，我们对想要的行为有了一个大致的想法。我们如何以测试的形式表达出来呢？让我们考虑一下之前之前的版本 `count` 程序使用的测试脚本：\n\n```\n\
  stdin three_lines.txt\nexec count\nstdout '³\\n$'\n\n-- three_lines.txt --\nthis\
  \ input\ncontains\nthree lines\n```\n\n([Listing count/5](https://github.com/bitfield/tpg-tools2/blob/main/count/5/testdata/script/count_counts_lines_from_stdin.txtar))\n\
  \n我们将开始修改这一点，以反映事实：我们现在希望 `count` 独立在不带任何标志的情况下计算其输入中的 `words`：\n\n```\nexec count\
  \ input.txt\nstdout '⁵\\n$'\n\n-- input.txt --\nthis input\ncontains\nfive words\n\
  ```\n\n([Listing count/8](https://github.com/bitfield/tpg-tools2/blob/main/count/8/testdata/script/count_counts_words_by_default.txtar))\n\
  \n现在我们可以添加一个新的脚本，显示在使用 `-lines` 标志时，程序计算的是行而不是单词：\n\n```\nexec count -lines input.txt\n\
  stdout '³\\n$'\n\n-- input.txt --\nthis input\ncontains\nthree lines\n```\n\n([Listing\
  \ count/8](https://github.com/bitfield/tpg-tools2/blob/main/count/8/testdata/script/count_counts_lines_with_lines_flag.txtar))\n\
  \n现在我们只有一个二进制文件，我们将回到在列表 [count/5](https://github.com/bitfield/tpg-tools2/blob/main/count/5/count_test.go)\
  \ 中的原始方案。我们只需要在 `cmd/count` 文件夹中一个 `main.go`：\n\n```\n\n```\n\n([Listing count/8](https://github.com/bitfield/tpg-tools2/blob/main/count/8/cmd/count/main.go))\n\
  \n我们在 `TestMain` 中定义了单一的 `count` 命令：\n\n```\n\n```\n\n([Listing count/8](https://github.com/bitfield/tpg-tools2/blob/main/count/8/cmd/count/main.go))\n\
  \n让我们看看之前的 `Main` 函数：\n\n```\n\n([Listing count/4](https://github.com/bitfield/tpg-tools2/blob/main/count/4/count.go))\n\
  \n### 实现行为\n\n我们是否需要对 `Counter` 结构体、它的选项或它的方法进行任何更改？其实并不需要。\n\n首先，我们如何检测 `-lines`\
  \ 标志的存在与否？我们当然可以读取 `os.Args`，但事实证明我们不需要。标准库如既往地支持我们。`flag` 包将恰好执行我们想要的操作：\n\n实际上，我们不需要添加很多代码来实现这一点。这是我们在\
  \ `Main` 顶部添加的第一部分内容：\n\n```我们调用函数 `flag.Bool` 来声明一个新标志，其名称为 `\"lines\"`，默认值为 `false`。我们还添加了一条有用的注释，向用户解释该标志的含义。\n\
  \n结果被赋值给 `lineMode`，我们将用它来根据标志判断“行模式”是开启还是关闭。\n\n我们还不知道标志的实际状态，因为我们还没有*解析*（parse）程序的参数。这会在调用这个函数时才会发生：\n\
  \n```\n\n```\n\n这意味着“亲爱的 `flag` 包，请解析程序的命令行参数，并使用它们来设置我之前定义的任何标志的值。”在这次调用之后，我们应该预期\
  \ `lineMode` 反映出用户是否提供了 `-lines` 作为参数。\n\n但我们现在不需要知道那个，因为无论如何我们必须构建 `Counter`。因为用户也可能在命令行上提供了一些文件名，我们仍然需要调用\
  \ `WithInputFromArgs`。然而，我们不再像以前那样传递 `os.Args[1:]`，因为那可能包含单词 `-lines`。而那不应该被解释为文件名，否则我们将得到之前看到的那个测试失败。\n\
  \n我们真正想要的是一种获取所有非标志参数的方法。换句话说，在调用 `flag.Parse` 提取了所有引用标志的参数后，我们想问“还剩下什么？”\n\n这正是\
  \ `flag.Args` 所做的：\n\n```\n\n最后，在构建了计数器 `c` 后，我们可以使用它来计算单词（或行）。这取决于 `lineMode` 的值：\n\
  \n```\n```\n\n\n\n为什么 `lineMode` 是一个指针而不是一个普通的 `bool` 值呢？嗯，当我们调用 `flag.Parse` 时，它需要修改我们定义的每一个变量。因此，在底层某些地方，它必须维护一个指向这些变量的指针列表。所以所有的\
  \ flag 变量都是指针，我们使用运算符对它们进行解引用，以获取所需的值。需要注意的一个重要点是，`flag` 包一旦看到非标志参数，就会停止解析。因此，你不能在参数之后放置标志：\n\
  \n```\nopen -lines: no such file or directory\n```\n\n### 帮助和用法信息\n\n当你的程序接收标志和参数时（即使不接收的情况下），为不确定该做什么的用户提供一个帮助信息是有好处的。通常，程序会识别\
  \ `-h` 或 `--help` 标志来实现此目的。事实上，这是内置在 `flag` 包中的功能，我们免费就获得了这种行为：\n\n```\nUsage of\
  \ count:\n  -lines        Count lines, not words\n```\n\n非常简洁！尽管如此，我们还可以稍微改进一下。它没有说明程序实际在做什么，而且假设用户知道这一点永远是不安全的。他们可能只是想知道系统上的\
  \ `count` 二进制文件是什么，是谁安装了它，为什么要安装。它也没有记录程序接受了命令行参数。让我们看看能做什么。稍微深入研究一下 `flag` 包发现，这里实际调用的函数是\
  \ `Usage`。它如下：\n\n为什么他们要这样声明一个 `var` 而不是直接定义 `Usage` 呢？理由非常充分：因为我们可以给它赋值。让我们分配我们自己的、更有信息的函数：这需要在我们调用\
  \ `flag.Parse` 之前完成，因为解析过程可能会触发用法信息的打印。结果如下：\n\n```\nUsage: count [-lines] [files...]\n\
  Counts words (or lines) from stdin (or files).\nFlags:\n  -lines        Count lines,\
  \ not words\n```\n\n如果没人能弄明白如何使用它，那么程序再优秀也无意义。为了让程序变得有用且友好，付出一点小努力就能产生深远的影响。\n\n\
  ## 进阶\n\n- 为行计数器程序中添加一个新的 `flag`，使其能够计算字节数而不是单词或行数。\n- 如果同时提供了字节计数标志和行计数标志，程序应该报告错误。\n\
  - 你可以在 [`count/9`](https://github.com/bitfield/tpg-tools/blob/main/count/9/) 中找到一种可能的解决方案。\n\
  \n## 5. 文件\n\n> Plan 9 拥有持久对象——它们被称为“文件”。\n> —Ken Thompson，引用自 [Plan 9 Fortunes](http://fortunes.cat-org/plan_9/)\n\
  \n许多 Go 程序都是以某种方式操作文件；我们在上一个章节中已经看到过如何打开文件并从其中读取数据。我们还可能被要求处理文件，并将文件作为数据进行管理：创建、删除、重命名、列出等。让我们先来看写入问题，看看构建一个处理文件写入的\
  \ Go 包涉及哪些内容。\n\n## 写入文件\n\n第一个要问的问题是程序本身是否需要处理文件。正如我们所看到的，Unix shell 可以很方便地从文件中读取数据并发送到程序的标准输入。当程序只需要以字节流的形式处理数据时，最类\
  \ Unix 的答案是从标准输入读取，并让操作系统来处理文件操作。\n\n同样，当产生需要作为文件的数据时，最简单且灵活的方法是让程序写入它自己的标准输出流。这可以通过\
  \ shell 重定向到需要的文件（甚至是某些其他程序的输入，例如）。\n\n### 明智日志的艺术\n\n顺便提一下，同样适用于日志，日志是写入数据的一种特殊情况。许多程序员花费大量的时间和精力在决定记录什么信息、在哪里记录、如何记录上。这些努力大部分都是浪费的。设计良好的应用程序不需要记录很多信息，如果有的话也很好。它们需要表达的内容可以放在标准输出（或根据情况放在标准错误）中，这为程序操作者提供了最大的灵活性，让他们来决定这些数据应该发送到哪里。\n\
  \n在决定记录某些信息之前，总是值得问问：“这条日志消息回答了关于程序行为的什么问题？”例如，答案可能是“它告诉我是某些错误”。这没关系，通常写入该消息的最佳位置是程序的标准错误流。。毕竟，那是用户最可能看到它的地方。\n\
  \n另一方面，如果你想不出任何日志消息可以帮助回答的有价值的问题，那么你就不需要这条消息了。如果你想要关于程序执行某件事的次数或频率的聚合信息，那么发布指标（使用\
  \ Prometheus 格式）可能比日志更好。\n\n同样，如果你想分析程序的性能，或者理解为什么行为异常，最好的选择可能是使用跟踪（如 tracing）而不是日志。如此，让我们看看写入文件的非相关用途，看看会出现什么模式。\n\
  \n### 测试 `WriteToFile` 函数\n\n让我们假设我们正在写入文件，而不仅仅是异常情况。这将是一个很有趣的测试。当然，我们想从测试开始，那么我们应该测试什么行为？嗯，我们已经以用户故事的形式有了要求的描述：程序创建一个文件并向其中写入一些数据。让我们像之前一样从中间向外推。调用什么样的函数比较合理？也许是：\n\
  \n```\n\n包名 `writer` 听起来很合理：它简洁、清晰，并描述了包的主要关注点。同样，`WriteToFile` 表示了我们正在尝试的功能。在实践中，可能会发现不同的名称更有意义，但这没关系。函数需要什么参数？显然，至少需要要创建的文件路径和要写入的数据。这些内容的适当类型是什么？我们通常将路径视为字符串，将任意数据视为\
  \ `[]byte`，因此我们需要在测试开头设置这些内容。\n\n现在我们知道了 `WriteToFile` 取什么，就可以问它返回什么（如果有的话）。对于任何函数的返回值，第一个要问的（无论它还返回什么）是它是否应该返回\
  \ `error`。回答这个问题的方法是问另一个问题：“可能会出现错误吗？”\n\n### 设计使错误不存在\n\n如果没有任何可以容易想象到的函数可能遇到错误的情况，那么答案就是否定的。同样，如果函数忽略错误是安全的，或者它能够处理任何发生的错误而不打扰调用者，那么它就不需要返回\
  \ `error` 了。\n\n最好的函数类型是不返回 `error` 的函数，因为这样你就不需要检查它了。在可能的情况下，考虑设计你的 API，使其执行给定操作时不需要返回\
  \ `error`。一个例子可能是删除文件：如果指定的文件不存在，删除函数应该返回错误吗？\n\n\n\n\n可以说，并不是：要求的行为是，在调用函数后，文件不应该存在。嗯，如果文件*确实*存在，函数可以将其删除；但如果它不存在，那么函数只需什么都不做就能成功！\n\
  \n> *消除异常处理复杂性的最佳方法是定义你的 API，使其没有需要处理的异常：**让错误不存在**。这听起来可能有些违经，但在实践中非常有效。*\n\n>\
  \ —约翰·奥斯特霍特（John Ousterhout），[《软件设计哲学》](https://amzn.to/3NfCg6E)\n\n换句话说，不要仅仅因为错误的存在就返回错误。相反，尝试设计那些*并不需要*返回错误的函数。\n\
  \n另一种方法是所谓的*崩溃即运行编程*（crash-only programming），正如其名所示，它涉及到完全不尝试去*处理*错误，而是在遇到错误时直接让程序崩溃。这听起来相当鲁莽，但在某些情况下可能是一个明智的主意。现代软件编排系统（如\
  \ Kubernetes）可以自动重启任何意外退出的程序。\n\n明明的程序设计者应该假设程序最终会崩溃，无论他们是出于本意还是无意。程序应该能够应对崩溃和重启，而不会丢失任何重要的状态或用户数据。\n\
  \n### 寻找灵感\n\n在这里发生错误时采取什么操作是合理的？嗯，首先，崩溃并没有帮助。这是一个包（package），所以我们不想剥夺用户这一选择的权利。我们在上一个章节中讨论过\
  \ `panic`，并指出单方面退出程序对任何包来说都是不友的行为。这里也一样。\n\n在这种情况下，我们无法通过设计来让错误消失：如果我们无法创建文件，或者无法将所有数据写入文件，用户需要知道这一点。虽然我们可能通过重试、将数据保存到其他地方、记录任何丢失的数据或任何其他方式来缓解错误，但这并不是我们应该在这里承担的责任。\n\
  \n向标准库寻求灵感总是一个好主意；我们能找到类似的东西吗？嗯，对于任何实现了 `io.Writer` 的类型，标准的 `Write` 方法看起来如下：\n\n\
  ```go\n```\n\n如你所见，它返回两个值：一个错误（error）和一个表示成功写入字节数的整数值 `n`。`Write` 的语义要求如果 `n` 小于\
  \ `len(p)`，则它必须返回一个非空错误：也就是说，如果它实际上没有写入提供的所有字节。\n\n我们在这里应该这样做吗？像往常一样，我们有冲突原则需要权衡。一方面，*最小惊讶原则*（Principle\
  \ of Least Surprise，又被称为“不要让我思考”规则）认为，事情的运行应该按照人们预期的方式运行。如果存在某种约定，例如，我们应该遵循它。\n\n\
  另一方面，正如俗所说，一切应该尽可能简单，但不能更简单。也就是说，在其他条件相同的情况下，简单通常应该胜出。\n\n这个函数的任务向文件写入一些数据，它唯一需要报告的是是否成功。所以，让我们让\
  \ `WriteToFile` 只返回 `error` 来指示这一点。\n\n### 我们到底在测试什么？\n\n那么我们做完了吗？如果我们调用了 `WriteToFile`\
  \ 并检查没有错误，还有什么是我们需要测试的吗？换句话说，像这样的代码足够了吗？\n\n```go\nif err := WriteToFile(\"testdata/write_test.txt\"\
  , data); err != nil {\n    t.Fatal(err)\n}\n```\n\n当然，你足够聪明不会回答“是”，因为你知道如果是那样，我不会问这个问题。所以，如果这*不*足够，为什么呢？\n\
  \n实际上，你会遇到很多 Go 测试看起来大体就像这个例子。这是我们可能称为“测试后开发”（test-last development）的症状：换句话说，它们可能是之后作为练习编写的。\n\
  \n这个测试本身并没有错，但问题在于它显然假设了*函数已经是正确的*。而这正是测试应该建立的，所以一定缺少了什么。\n\n事实上，任何测试都值得问：“我们在这里到底在测试什么？”让我们现在问吧。`WriteToFile`\
  \ 最重要的行为是什么？是返回 `nil` 错误吗？不，因为它可以通过简单的写入通过测试：\n\n```go\nif err := WriteToFile(\"\
  testdata/write_test.txt\", data); err != nil {\n    t.Fatal(err)\n}\n```\n\n这不对！`WriteToFile`\
  \ 的真实实现需要一些比返回 `nil` 更具挑战性的操作。它需要向文件中写入一些数据。\n\n让我们把这个描述变得具体，直到它听起来像一个测试。\n\n当我们调用\
  \ `WriteToFile` 并且它返回 `nil` 错误时，指定的文件应该存在，并且应该包含指定的数据。\n\n如果我们用一句话来表达这一点（例如由 `gotestd`\
  \ 生成），可能会说：\n\n```\n✔ WriteToFile writes data to file\n```\n\n这给了我们测试的名称，这是一个很好的开始：\n\
  \n```go\nfunc TestWriteToFileGivenToFile(t *testing.T) { ... }\n```\n\n听起来有点冗余：`WriteToFile`\
  \ 写入文件。因为它确实这么做了！实际上，这是一个命名良好的函数的标志。它的名字完美地表达了函数应该做什么。测试也反映了这一点。所以我们一定会调用 `WriteToFile`\
  \ 并检查错误，但不会停在此此。我们还会测试是否成功打开了文件，以及它包含了我们要的字节。可以使用 `os.ReadFile` 读取文件内容作为 `got`。现在，我们应该如何与\
  \ `want` 比较它们？\n\n### `cmp` 模块\n\n由于 `want` 和 `got` 都是 `[]byte` 类型，可以使用 `bytes.Equal`\
  \ 来比较它们，但让我们使用更复杂的 [`go-cmp`](https://github.com/google/go-cmp）模块，它有一个方便的“diff”功能。如果切片不同，我们将看到它们在何处以及如何不同。\n\
  \n我们需要为 `go-cmp` 包添加导入，因为它不是标准库的一部分。这里是完整的测试：\n\n```go\nimport (\n    \"os\"\n \
  \   \"testing\"\n\n    \"github.com/google/go-cmp/cmp\"\n)\n\nfunc TestWriteToFileGivenToFile(t\
  \ *testing.T) {\n    data := []byte(\"hello, world\")\n    if err := WriteToFile(\"\
  testdata/write_test.txt\", data); err != nil {\n        t.Fatal(err)\n    }\n  \
  \  got, err := os.ReadFile(\"testdata/write_test.txt\")\n    if err != nil {\n \
  \       t.Fatal(err)\n    }\n    if diff := cmp.Diff(data, got); diff != \"\" {\n\
  \        t.Errorf(\"WriteToFile() mismatch = -want +got%s\", diff)\n    }\n}\n```\n\
  \n由于 Go 在添加新依赖时不会自动下载，我们需要运行 `go mod tidy` 来完成这一切：\n\n```\ngo: finding module for\
  \ package github.com/google/go-cmp\ngo: found github.com/google/go-cmp v0.5.9\n\
  ```\n\n如果我们现在运行测试，应该预期在尝试打开文件时看到失败，因为我们知道还没有创建它。而这恰恰发生了：\n\n```\n--- FAIL: TestWriteToFileGivenToFile(0.00s)\n\
  \    writer_test.go:21: open testdata/write_test.txt: no such\n    file or directory\n\
  ```\n\n**目标：** 让这个测试通过。\n\n* * *\n\n**提示：** Go 标准库可以为我们完成大量的繁重工作，特别是当处理文件等事务时。查看\
  \ [`os` 包](https://pkg.go.dev/os)，看看是否能找到让这项工作变得简单的东西。\n\n## 实现 `WriteToFile` 函数\n\
  \n**解决方案：** 这是我能想到的 `WriteToFile` 最简单的实现：\n\n```go\nfunc WriteToFile(filename string,\
  \ data []byte) error {\n    return os.WriteFile(filename, data, 0600)\n}\n```\n\n\
  再次，我们可以打开文件进行写入，延迟关闭它，并将字节数据写入其中，但 `os.WriteFile` 通过一个函数调用就完成了所有这些操作。它在文件不存在时会创建文件，在文件存在时会截断它，这正是我们想要的行为。\n\
  \n### 文件权限\n\n顺便说一下，`os.WriteFile` 那个神秘的 `0600` 参数指定了创建的文件应该拥有的权限位。你可能知道在 Unix（以及类\
  \ Unix 系统）中，文件有一些元数据位来控制谁被允许对文件做什么：读取、写入、执行。使用八进制（base 8）字面量来表示这些是方便的，它以 `0o` 开头，表示“八进制”。\n\
  \n\n\n\n接下来的三个八进制数字分别表示所有者、用户组和所有人对文件的权限。特别是，值 `0o600` 意味着“所有者具有读写权限 (6)，用户组无访问权限\
  \ (0)，所有人无访问权限 (0)”。\n\n在语法上，我们必须为 `os.WriteFile`指定一些权限值，但我们并不太在意它具体是什么。虽然对*我们*来说，读和写权限是合理的，但我们不需要授予任何其他用户访问权限，所以这个值似乎是一个合理的选择。\n\
  \n我们的 `writer` 包的用户可能想 true 用它来创建其他用户可以读取的文件。在这种情况下，我们始终可以提供一个 `WriteToPublicFile`\
  \ 函数或类似的函数。但默认创建*私有*文件是明智的，因为即使我们警告用户不要用这个包处理敏感信息，但可以肯定，人迟早会有人这么做。\n\n### 当目录不存在时\n\
  \n让我们看看测试是否通过了：\n\n```\n--- FAIL: TestWriteToFile_WritesGivenDataToFile (0.00s)\n\
  \    writer_test.go:20: open testdata/write_test.txt: no such\n    file or directory\n\
  ```\n\n这很奇怪。它现在失败是因为 `WriteToFile` 返回了“无此类文件”的错误，这意味着 `os.WriteFile` 也返回了该错误。但 `WriteToFile`\
  \ 不是应该在文件不存在时创建它的吗？\n\n是的，它应该是的，但如果它应该所属的*目录*不存在，它并不会进一步创建该目录。我们并不真的想在用户计算机上承担创建大量文件树的工作。如果他们要求将文件写入一个不存在的目录，那可能是一个我们应该告知他们的错误。\n\
  \n让我们手动创建 `testdata`，这样测试就能运行了：\n\n```\n\n```\n\n```\n\n```\n\n```\n\n现在一切都正常了：\n\
  \n```\nPASS\nok      writer  0.185s\n```\n\n我们现有的测试中有什么地方是不令人满意的吗？一旦你有了一个通过的测试，检查它并看是否可以以任何方式进行改进，总是个好主意。\n\
  \n嗯，良好的单元测试的一个特点是它们应该是*幂等*的（拉丁语，意为“相同效果”）：它们应该始终执行相同的事情，并且应该始终让世界处于相同的状态。换句话说，测试不应该有副作用。\n\
  \n但这个测试有一个副作用，不是吗？它创建了文件 `testdata/write_test.txt`。这是一个问题，不仅是因为我们正在用未提交的更改污染代码仓库，而且因为这可能会掩盖\
  \ `WriteToFile` 中的 bug。\n\n### 一个灾难性的 bug\n\n我解释一下我的意思。由于输出文件现在已经被创建并包含了预预期数据，那么只要没人删除它，测试就会一直通过。\n\
  \n换句话说，它根本不再是一个测试了，因为即使随后将 `WriteToFile` 更改为什么什么都不做，它仍然可能通过：\n\n```\n\n```\n\n```\n\
  \n现在运行测试能捕获到这个*回归* bug 吗？不能：\n\n```\nPASS\nok      writer  0.148s\n```\n\n噢，天哪。这非常糟糕。我们不再拥有有效的测试，但最糟糕的是，它*看起来*好像我们还有。即使是代码覆盖率工具也会显示\
  \ `WriteToFile` 被测试覆盖了（这是一个实用的提醒：覆盖率并不是一切，或者说其实根本不是什么）。\n\n毕竟，代码覆盖率只证明了代码被*调用*了，而不是证明它运行正常。这有点像我们之前看到的无用测试，它只检查函数的\
  \ `error` 结果，忘记了其他部分。\n\n代码覆盖率毕竟只能证明代码被*调用*了，而不是证明它有效。这有点像我们之前看到的那个无用测试，只检查函数的 `error`\
  \ 结果，忘记了其他部分。\n\n**目标：** 这样是不行的，我们需要修复它。*\n\n**提示：** 这样做是错误的做法。*\n\n**解决方案：** 这样可以，正确的做法是检查文件是否存在。\n\
  \n\n\n\n\n([Listing writer/1](https://github.com/bitfield/tpg-tools2/blob/main/writer/1/writer_test.go))\n\
  \n我们还有什么没有涵盖？嗯，一个有趣的问题是：当我们尝试写入文件时，如果该文件已经存在，应该发生什么？\n\n一种方案是返回一个错误，但这真的是错误情况吗？毕竟，`WriteToFile`\
  \ 的工作是确保文件存在并包含给定的数据。在这种情况下，文件之前是否存在并不重要。\n\n那么，让我们通过设计来消除这个错误处理吧。我们简单地规定：如果输出文件已经存在，`WriteToFile`\
  \ 应该覆盖它（clobber）：即用新数据覆盖它。\n\n**目标：** 编写一个测试来证明 `WriteToFile` 会覆盖已存在的文件。\n\n* *\
  \ *\n\n**提示：** 在编写测试时，我们从想要的行为开始：如果代码运行正常，预期会发生什么？然后，为了将其转换为 Go 测试，我们问：“那么在什么情况下测试应该会失败呢？”\n\
  \n我们的意思是，如果已经存在一个同名文件，我们的 `WriteToFile` 函数应该完全替换它。那么，可能会哪里出错呢？\n\n嗯，一个 bug 可能是我们什么都没做，导致现有文件保持不变。另一个可能是我们简单地将数据追加到现有内容之后，这意味着文件最终包含了两组数据。\n\
  \n当然，我们总是可以想象其他 bug：我们在新数据前加上它，或者将其与旧数据交错在一起，或者完全删除该文件，或者将其留为空，或者格式化用户的电脑并安装 Windows\
  \ for Workgroups 3.11，或者生成无限位数的 π，或者……行了，你明白我的意思的。\n\n让我们尝试写一个测试，尽可能涵盖由于这些不同类型的\
