  \n这里是 `main.go`：\n\n```\n\n```\n\n```\n\n```\n\n([列表计数/3](https://github.com/bitfield/tpg-tools2/blob/main/count/3/cmd/count/main.go))\n\
  \n这种函数选项模式（functional options pattern）在 Go 中正变得越来越流行，你可能已经遇到过它，但也许你并不总是完全清楚它在解决什么问题。通过这种方式循序渐进地研究它，并考虑各种替代方案，有助于更容易理解*为什么*我们要使用函数选项，以及它们为什么是这样工作的。\n\
  \n这确实需要在包的侧增加一些额外的工作，但由于你可以在编写的每一个 Go 包中基本上使用完全相同的模式，因此它是工具箱中一个非常实用的工具。\n\n### 方法化选项（Methodical\
  \ options）\n\n使用函数来设置设置选项的另一种方法（而不是将其作为参数传递给构造函数）是在对象本身上添加方法。\n\n例如，为了设置行计数器的输入读取器，我们可以编写像这样的方法：\n\
  \n```\n\n```\n\n```\n\n我们该如何调用它？嗯，也许像这样：\n\n```\n\n```\n\n```\n\n我们需要将 `NewCounter`\
  \ 更改为只返回一个 `*counter` 而不返回 `error`，但没关系：如果 `NewCounter` 不再需要接收任何参数，那么它就不再需要返回 `error`\
  \ 了。\n\n可以说，使用方法来设置我们的选项——我们可以称其为方法化选项——其清晰度并不亚于函数式风格。而且我们不需要为每个选项重复包名前缀，这很不错。\n\
  \n你会在某些 Go 工具中看到这种风格，但我不能说我特别中意它。由于我们只能从这些方法中的每一个返回计数器本身，我们无法同时返回 `error`；这会破坏方法的链式调用（method\
  \ chaining）。因此，我们无法对选项方法的参数进行校验。\n\n这里还有一个更微妙的问题。用户并没有义务在使用对象之前调用这些方法：他们可以在任何时间调用它们。这*可能*是没问题的，也可能有问题。你的对象在开始工作后，能够处理其配置发生意料之外的变化吗？嗯，它最好能！\n\
  \n如果你*想要*让用户在使用对象时能够更改其配置，那么显然这种才是正确的方法，而这通过函数选项是无法实现的。另一方面，如果我们能保证配置不会在我们脚下突然变化，编写某些程序会变得更容易。\n\
