  \n`TestMain` 这个名字对 Go 来说是特殊的，因为当我们运行 `go test` 时，这个函数会在任何测试运行之前始终执行。它的目的是设置任何文本固件（fixtures）或其他测试运行所需的其他内容。在特定情况下，我们使用它来调用\
  \ `testscript.RunMain`。那么*它*是做什么的呢？\n\n它接受一个 map 参数，用于定义我们想要让测试脚本使用的任何“自定义命令”。在这种情况下，我们想要定义\
