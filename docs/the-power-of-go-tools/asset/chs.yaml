  \ `items[1]`：它不存在。因此产生了 panic。\n\n让我们将项目列表视为另一个特殊用例：\n\n```\n```\n\n([Listing `game/6`](https://github.com/bitfield/tpg-tests/blob/main/game/6/game.go))\n\
