  \n![](img/file5.png)\n\nAPI 生活生活一样，简单总是最好的计划。你的 API 越小，越容易使用（也越可能）。\n\n## 命令\n\n\
  我们希望工具足够简单且集中，到不需要很多选项和开关来控制它们的行为。一个只做一件事的工具比做两件事或 N 件事的工具更容易使用。但我们经常违背本能，为程序添加额外的模式和功能，从而导致需要更复杂的\
  \ API。\n\n### Unix 方式\n\n我们痛苦的行计数器不需要额外的功能就能变得有用，但为了演示，让我们给它一些。假设像某些勤奋的作者一样，我们急于知道目前为止写了多少个*单词*，而不仅仅是多少行。\n\
  \n最像 Unix（因此也像 Go）的这种方法实际上是编写*两个*独立的程序：一个计算单词，另一个计算行。\n\n当然，这两个程序可以共享大部分代码，因为它们会从\
  \ `count` 包导入代码，但从用户的角度来看，它们是两个不同的命令。\n\n让我们看看如何做到。\n\n### 多个 `main` 包\n\n如你所知，构建的每个\
