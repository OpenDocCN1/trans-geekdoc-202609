  \ 关闭文件和其他资源\n\n我们现在转向第二个问题：文件 `f` 没有被关闭，这意味着程序泄漏了一个资源（在本例中是一个文件句柄）。通常我们会在确认成功打开文件后立即\
  \ `defer` 调用 `f.Close()`，但在这里不可行。由于程序在完全读取文件后就会退出，因此任何情况下都会释放所有资源，这看起来可能不是大问题。但记住，我们写的是包，而不是程序。\n\
  \n因此，我们应该始终将资源泄漏视为潜在的严重问题，因为我们不知道其他开发者将如何使用我们的代码。它可能位于长时间运行的程序中，资源耗尽最终会导致程序崩溃。\n\
  \n## 更新用户界面\n\n让我们把那个的问题留留章节末尾的挑战吧。现在，让我们为更新后的程序做最后的润色。\n\n现在我们可以从标准输入也可以从命令行提供的文件名接收用于行计数的文本，我们需要修改\
  \ `Main()` 函数以包含该行为：\n\n```\n\n```\n\n\n\n\n为什么我们传递的是 `os.Args[1:]` 而不是简单的 `os.Args`？`os.Args`\
  \ 的第一个元素始终是运行的二进制文件的路径，我们对它感兴趣，所以可以跳过它。\n\n我们现在不再发生错误时调用 `panic`，而是将其报告到标准错误输出器（`os.Stderr`），并以退出状态\
  \ 1 终止程序，表示错误。\n\n### 一用户测试\n\n让我们运行程序并检查它是否按预期工作。首先，像之前一样从标准输入计算行数：\n\n```\n1\n\
  ```\n\n现在我们可以尝试在命令行中传递一个文件名：\n\n```\n3\n```\n\n最后，让我们看看如果既传递了文件名*又*向标准输入发送了文本会发生什么。哪一个占优先？\n\
  \n```\n3\n```\n\n事实证明，提供的文件名会导致标准输入被忽略，这是合逻辑的，也符合用户的预期。\n\n### 设置退出状态\n\n你可能已经注意到，由于我们的程序现在接收命令行参数，它的错误行为略有不同。之前程序唯一需要担心的错误是调用\
  \ `NewCounter` 时传入了某些无效选项（例如 `nil` 输入读取器）。\n\n而且，由于 `NewCounter` 只在包内部被调用，我们认为使用\
  \ `panic` 来信号这种内部编程错误是合情理的，尽管并不为此狂喜。\n\n确实，在读取输入流时也可能发生错误，但在这种情况下 `input.Scan` 会返回\
  \ `false`，我们会完成扫描并报告到为止成功读取的行数（如果有的话）。这并不不合理，但现在情况变得稍微复杂了。\n\n现在，例如，用户可以在命令行上提供一个*不存在*的文件名，或者至少由于某种原因无法读取。静默地忽略此类问题是不明智的，因为这不是用户想要的。我们需要报告该错误，以便他们决定如何处理。\n\
  \n正如你可能知道的，程序在完成时会向操作系统返回一个整数退出状态值。按照惯，如果一切正常，则为 0，否则大于 0。任何非零值都表示错误，程序可以根据需要使用不同的值来信号不同类型的问题。\n\
  \n我们到目前编写的程序隐式地返回了零退出状态，因为当 `main` 函数返回时就是发生这种情况。如果你想指定非零退出状态，可以通过调用带有所需值的 `os.Exit`\
  \ 函数来实现。\n\n### 实际上，我们已经使用过这一点，在列表 [count/4](https://github.com/bitfield/tpg-tools2/blob/main/count/4/count.go)\
  \ 的 `Main` 函数中，如果打开用户指定的文件出错，我们将以退出状态 1 终止程序。但这并不真正理想，因为现在使用我们包的人只需要*知道*调用 `Main`\
  \ 可能会退出程序。\n\n他们可能想要这种行为；例如，他们可能想尝试从某些错误中恢复，也许通过提示用户输入不同的文件名。总之，我们希望 `Main` 不要自自做这个决定，而是无论是否有错误都*始终*返回到\
  \ `main`。\n\n让我们对 `Main` 做一个微小的改动来实现此目标。我们将让它返回一个表示退出状态的 `int`，然后 `main` 就可以将其传递给\
  \ `os.Exit`（或者根据需要执行其他操作）。\n\n```\n([Listing count/4](https://github.com/bitfield/tpg-tools2/blob/main/count/4/count.go))\n\
  ```\n\n这里是调用它的更新后的 `main` 函数：\n\n```\n([Listing count/4](https://github.com/bitfield/tpg-tools2/blob/main/count/4/cmd/count/main.go))\n\
  ```\n\n非常简单，它在灵活性和工作量之间取得了很好的平衡。\n\n## 测试脚本\n\n我们在在本章早些部分看到，当程序需要读取其命令行参数时，这些参数最终将来自\
  \ `os.Args`。但因为这很难测试，我们设计了 `count` 包接收任意的 `[]string` 作为 `WithInputFromArgs` 的参数。\n\
  \n当我们从 `Main` 调用 `NewCounter` 函数时，我们*将* `os.Args` 作为该切片的值传递给它。但在测试中，我们可以自由地传递任何喜欢的字符串作为程序的“参数”。\n\
  \n这太棒了，以这种方式解耦我们的包始终是一个好主意，这样可以使它们更灵活，不那么依赖于以特定的方式使用。\n\n然而，这种解耦并不总是可能或方便的，而且当我们只能调用它的函数时，我们模拟从命令行使用包的能力是有限的。\n\
  \n### 作为二进制文件运行程序\n\n但我们仅仅局限于调用函数吗？例如，我们是否可以从 Go 测试中以二进制文件的形式执行程序，传递任意参数，并查看它的输出？\n\
  \n当然可以，因为我们可以用 Go 做任何事情。例如，我们可以写一个测试，在我们的 `main.go` 上执行 Go 编译器产生二进制文件，*然后*按照我们想要的方式执行该二进制文件。\n\
  \n这些通过使用 `os/exec` 包都是可能的。我们可以从测试中以子进程的形式执行程序，并将标准输出或错误流作为 `io.Reader` 值获取。\n\n\
  不过这涉及到一些管道工作，而且为我们写的每个程序重复它很麻烦。难道没有更好的方法吗？\n\n### 引入 `testscript`\n\n确实有。[testscript`](https://pkg.go.dev/github.com/rogpeppe/go-internal/testscript)\
  \ 包最初由 Go 团队编写用于测试 `go` 工具，现在经过调整和扩展，成为测试*任何*命令行工具的通用实用。使用 `testscript`，我们可以将测试编写成看起来像\
  \ shell 脚本的简单文本文件。示例如下：\n\n```\nstdin three_lines.txt\nexec count\nstdout '³$'\n\
  \n-- three_lines.txt --\nthis input\ncontains\nthree lines\n```\n([Listing count/5](https://github.com/bitfield/tpg-tools2/blob/main/count/5/testdata/script/count_counts_lines_from_stdin.txtar))\n\
  \n以 `stdin` 开头的行设置任何后续命令的标准输入来自文件 `three_lines.txt`。然后 `exec count` 行执行 `count`\
  \ 命令（即我们的行计数程序）。\n\n然后我们使用 `stdout` 对预期输出进行断言：具体来说是包含“3”，这是程序在正常工作时应该产生的内容。\n\n\
  换句话说，这个脚本*就是*一个测试，因此名为 ‘testscript’。它有两种失败的方式。第一，执行 `count` 命令可能返回非零退出状态。第二，它的输出可能不包含预期文本。\n\
  \n### 调用测试脚本\n\n那么，我们如何作为 `go test` 执行的一部分运行此脚本呢？我们只需要添加一个这样的 Go 测试：\n\n```\n([Listing\
  \ count/5](https://github.com/bitfield/tpg-tools2/blob/main/count/5/count_test.go))\n\
  ```\n\n考虑到我们之前关于编写用测试名称的所说，你可能会对这个测试简单地称为 `Test` 感到惊讶。这是因为它*本身*并不断言任何行为：它仅仅是为了运行我们的测试脚本。\n\
  \n这些脚本中的每一个都是父测试的子测试，该子测试的名称派自脚本文件名。例如，如果我们的脚本文件名为：\n\n```\ncount_counts_lines_from_stdin.txtar\n\
  ```\n\n那么通过 `gotestdox` 格式化的它的行为将是：\n\n```\n ✔ Count counts lines from stdin\n```\n\
  \n\n\n\n请注意，父测试除了调用 `testscript.Run` 之外没有做任何其他操作，该方法传递了一个 `Params` 对象来配置它。在这种情况下，我们设置的唯一参数是查找测试脚本的目录：`testdata/script`。\n\
  \n所以，让我们把脚本文件放在 `testdata/script` 文件夹中，并命名为类似 `count_counts_lines_from_stdin.txtar`\
  \ 的名称（`.txtar` 扩展很重要，但名称并不重要）。\n\n让我们尝试运行测试：\n\n```\n--- FAIL: Test/count_counts_lines_from_stdin\
  \ (0.00s)\n    testscript.go:429: > stdin three_lines.txt\n      > exec count\n\
