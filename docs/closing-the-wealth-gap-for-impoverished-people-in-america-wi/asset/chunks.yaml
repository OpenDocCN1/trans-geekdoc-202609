    # The Decline in Union Membership and the Great Divergence


    The decline in union membership and reduction of marginal tax rates roughly coincides
    with increases in income inequality which has come to be called the Great Divergence.
    In 1976, the richest 1% possessed just under 8% of total income but has increased
    since, reaching a peak of just over 18%—about 23.5% when capital gains are included—in
    2007, on the eve of the onset of the Great Recession. These numbers are eerily
    close to those reached in 1928 that lead to the crash that would usher in the
    Great Depression.


    # Accurate State of the U.S. Economy


    When it comes to our nation’s economy, it can easily seem like there’s nothing
    but good news. Headlines repeatedly highlight low unemployment and ongoing job
    growth, which contributes to a public narrative that the economy is strong. The
    Great Recession, it seems, must be behind us.


    But if the recession is indeed a thing of the past, it’s only past for some. Digging
    deeper exposes that middle and low-income workers and their families in the United
    States have not reaped their share of the benefits of the apparent recovery, benefits
    that such a recovery should produce for all, and not only the few. Data shows
    that, in fact, it’s only wealthier households and larger corporations that have
    gained noticeably since the recession ended a decade ago. This is because long-developing
    trends of inequality have proven impervious to the decade’s economic growth.


    It’s no surprise that boasts of a record-breaking economic recovery ring hollow
    to most Americans, for whom today’s wages are barely enough—and often not enough—to
    meet their basic needs, let alone the conditions of a modern middle-class life,
    like adequate health care and a quality education for their kids. The wealthier
    of us shouldn’t sit smugly on the rewards they’re reaping from this lopsided prosperity:
    these economic failings don’t only matter to the lower classes. Rather, they are
    a symptom of declining investment and productivity growth, declines that threaten
    not only the strength of the current economy but its fortunes in decades to come.
    If these unbalanced conditions aren’t corrected, and soon, then everyone loses.


    This report seeks to make those conditions clear: that not only is the economy
    weaker than the headlines, and the current administration’s rhetoric, would have
    us believe, but also the gains, however unequal, that it has acquired rest on
    fragile grounds indeed. The report will do so by delineating a set of straightforward
    facts about the current economy, based on and demonstrated through wide-reaching
    data, that will illustrate the weaknesses that lie just below the surface of the
    most frequently reported numbers.


    Here are the key takeaways of the report’s analysis:


    *   Wages and incomes continue to stagnate as working Americans struggle to maintain
    living standards, especially those with children.

    *   A larger share of America’s workers earn lower wages than do workers in other
    high-income nations.

    *   Wage gaps between white workers and workers of color persist; in fact, some
    gaps have even widened.

    *   Pay hikes in rural areas of the country have not kept up with urban locales.

    *   Those at the bottom of the income ladder are falling further behind those
    at the top.

    *   Workers’ share of national income has not improved from its post-recession
    low.

    *   Underemployment—and low employment-to-population ratios indicate that the
    economy is not providing enough jobs for the people who are willing and able to
    work.

    *   Public investment as a share of GDP is at its lowest levels since the end
    of the Second World War.

    *   The current economic expansion has brought no substantial boosts to productivity,
    innovation, and capital investment, limiting its potential for future growth.


    Taken together, these data reveal an economy that, years after the end of the
    Great Recession, is underperforming on many significant metrics. This broad-based
    underperformance calls for a more proactive and progressive economic policy to
    end wage stagnation, stimulate investment, and avoid future economic crises. The
    current federal economic policies, which consist of poorly targeted tax cuts and
    deregulation, have done nothing of note to build broadly shared prosperity.


    # Costs of Living Continue to Increase


    It has also become increasingly clear that the costs of goods and services normally
    associated with a decent standard of living have become prohibitively expensive
    relative to the cost of commodities in general, as measured through the overall
    consumer price index. While prices in general (“All Items, less shelter,” or everything
    except housing) have increased by about 15 percent since June 2009, housing prices
    have increased by nearly 23 percent. Medical services, of which health insurance
    is a major component, have increased by 36 percent since June 2009. The cost of
    education has also exploded by 40 percent relative to the start of the current
    recovery. Non-inflation-adjusted median hourly wages have increased by 25 percent
    since June 2009, meaning that the costs of education and medical care have substantially
    outpaced increases in pay since the start of the recovery.


    The prices of goods and services that we normally associate with a comfortable
    life—affordable higher education for your children, an adequately sized home with
    an affordable mortgage or monthly rent, health care that offers comprehensive
    coverage at a reasonable cost—are breaking the bank for working class people.
    Those that cannot keep up with these costs go without these necessities or they
    take on debt to purchase them.


    # Investment


    Capital investment of all firms as a share of total national income is not near
    the level seen prior to the last economic crisis, and is sitting at just 26 percent
    of GDP in the second quarter of 2019. More than a decade into the recovery, capital
    expenditures are so lackluster that they are nearly identical with the capital
    expenditures as a percentage of GDP levels that bottomed out immediately after
    the recession in the early 1990s. An October report from the Bureau of Economic
    Analysis also notes that gross private domestic investment has declined for the
    second straight quarter. In particular, gross private domestic investment in structures
    (factories, office buildings, and the like) has declined 15.3 percent since last
    quarter, the largest decline since the fourth quarter of 2015.


    Capital investment in machines, office supplies, land, and the construction of
    buildings implies real investment in an economy, which can lead to job creation
    and increased incomes for workers. Those increased incomes can fund increased
    consumption, thereby increasing growth in an economy where workers reap the benefits
    of capital investments.


    Net public investment has been on a secular decline as well, and has not recovered
    to the levels recorded prior to the economic crisis. As a share of GDP, it is
    at its lowest recorded level since the late 1940s, when there was a massive drawdown
    in public spending following World War II. With pressing needs like crumbling
    infrastructure, climate change, an aging population, and weak economic growth,
    increased public investment would be beneficial to economic performance, innovation,
    and productivity. Yet a political aversion to the role of government investment
    and procurement has prevented this option from being explored in practice.


    # The True State of the U.S. Economy

