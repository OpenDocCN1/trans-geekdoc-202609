    # How Blockchain Can Reduce Global Poverty


    But, what if this could benefit how blockchain can reduce global poverty? It already
    can, by way of allocating a variety of records, whether they be property or simply
    concessions, for the use of safe registration and proper analysis. These concepts
    can be used in protecting the seller, mitigating fraudulent actions, and enabling
    more automatic transfers of ownership for struggling countries without these ideals.
    It can also reduce manual errors, and improve security of document transference,
    all of which can benefit developing countries around the world.


    ## Rule of Law


    While the entirety of law itself can''t be transferred into that of a blockchain
    system, it still be generated in such a way that fuels how blockchain can reduce
    global poverty. One of these aspects is imply by way of storing the immense data
    of all the various principles as seen through smart contracts.


    Popular as "If this then that statements," the smart contracts are a form of third
    party concession that simply allows or disallows the validity of a transaction.
    In this format, a smart contract can be used as a distributed ledger, in automatically
    executing transactions that cannot be ignored. If used correctly, these iterations
    under the blockchain technology can develop legal frameworks that make it easier
    for organizations and citizens to obey agreements under the law, therefore making
    it cheaper for those involved to play by the rules.


    ## Insurance


    It''s one of the most intriguing concepts in how blockchain can reduce global
    poverty; insurance, whether that be in health and life, usually is too expensive,
    due to either administrative costs, or simply inabilities to afford services.
    For instance, only about 15 percent of the population of India has health insurance.


    Blockchain can greatly alter this phenomena by allocating a system for verification
    of transactions, which can deter (and expose) fraud, which will then reduce costs
    for insurers. One such blockchain-based microinsurance service is Consuelo, which
    is now allowing migrant workers the possibility of paying health and life insurance
    payments in small increments, verifying claims electronically and payments sent
    swiftly to ensure better opportunities for struggling economies.


    ## Economic Identity


    At its heart, out of all the various ways blockchain can reduce global poverty,
    the most essential and necessary of the bunch is economic inclusion. This stipulates
    that blockchain technology can reduce poverty not solely through financial transactions,
    but also on combining identity with commerce.


    BanQu, a blockchain-powered ID startup, is one form of potential economic identity
    that can be used to break countries out of the cycle of poverty. Their founder,
    Ashish Gadnis, believes that meshing these concepts is one of the only ways blockchain
    can further implement a more conducive economic identity for various poverty-stricken
    countries. This identity would give struggling individuals a way to facilitate
    their transactions and to simply participate in the action that which other exchanges
    simply disallow.


    ## Future of Poverty


    There''s a variety of potential for the likes of blockchain in reducing global
    poverty. The implementation of these technologies can largely benefit the world,
    not solely those in need, which is a more holistic, universal and up-front concession
    to the benefit if world economies. Going into the future, the blockchain ideal
    can mean wonders to finance, but also in elevating the world on a number of varied
    fronts.


    With many a variety of companies dropping their own forms of blockchain-powered
    digital identity programs, which validate individuals'' identities, ensuring that
    data of all kinds that are not only backed by validity, but complete accessibility
    will only be one of the many channels blockchain can reduce global poverty. The
    future of poverty may be unattainable (since poverty may very well be a thing
    of our past), and this can all be thanks to blockchain.


    # How Bill Gates Is Using Cryptocurrency Ripple to Fight Global Poverty


    If you''re reading this book, you obviously have access to a computer, or a smartphone.
    You have a roof over your head, WiFi and an education. Sure, you worked hard for
    these things, but you also most likely live in a country where there''s an infrastructure
    in place that made these accomplishments possible.


    Now, imagine how different your life would be if you never opened your first bank
    account. Your only option would be to somehow earn money in cash. You''d either
    need to hide it in your home, or spend the money right away on things you need.
    If an emergency happened and you needed to borrow money, you''d probably end up
    borrowing from high-interest loan sharks.


    While this sounds like a nightmare, it is actually an everyday reality for 2 billion
    "unbanked" people in under-developed countries around the world. The current economic
    system that''s in place makes it impossible for people living in true poverty
    to make their way out, regardless of how hard they try.


    The Bill and Melinda Gates Foundation''s motto is: All Lives Have Equal Value.
    For years, the couple have been using their own success to help bring improvements
    in health care and education to developing nations. Now, they have a vision for
    growing the economies of those countries.


    During the first ever Ripple Swell conference in Toronto during October 2017,
    distinguished speakers from major corporations and financial institutions met
    to educate investors from the banking world on blockchain technology. It was announced
    during this conference that The Gates Foundation will use the cryptocurrency Ripple
    in its Level One Project.


    Rather than relying on independent banking mobile money services, the "Mojaloop"
    would make it possible to send money to any account, not just people who keep
    their money in one particular bank or mobile provider.


    The potential for using the underlying blockchain technology to do real good in
    the world is no longer a just a concept. With Ripple''s digital currency XRP,
    the Mojaloop will be able to transfer currency quickly and easily across its network.
    (If you are unfamiliar with cryptocurrency and blockchain, check out our Beginner''s
    Guide to Cryptocurrency).


    Bill Gates has been involved in the cryptocurrency community for a very long time,
    and this plan has been years in the making.


    In a 2016 interview with Bloomberg, the mogul had this to say about how digital
    currency could help bank the unbanked: "It''s really the digital revolution. The
    poorest bought cows, stored gold, put currency under their mattress. ... But they
    are getting cellphones. People are going to have hope."


    The Gates Foundation is not alone in its enthusiasm for Ripple''s "xRapid" solutions.
    At the time that this article was written, more than 100 financial institutions
    had confirmed partnerships with Ripple. The Bank of England, The Federal Reserve,
    JPMorgan, and the Royal Bank of Canada are just a few examples, and rumors have
    swirled that some of the world''s biggest credit card companies may follow suit.


    Ripple''s CEO, Brad Garlinghouse, is the former CEO of AOL. During a Q&A on the
    last morning of the Swell conference, Garlinghouse confirmed that one day, Ripple''s
    network of 100 Billion XRP will preside over trillions of dollars in financial
    transactions.


    Unlike bitcoin, which holds long-term value only if the current economic system
    stumbles, Ripple favors government regulation of cryptocurrency. The goal is to
    allow banks around the world to have access to the technology, to improve lives,
    and not just for the lucky few who invested early.


    The future''s looking bright. If developing nations are able to join Western countries
    on a more level economic playing field, that would be a first step in a long journey
    toward alleviating global poverty.


