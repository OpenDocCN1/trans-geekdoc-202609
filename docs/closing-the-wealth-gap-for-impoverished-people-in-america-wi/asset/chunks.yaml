  trans: '

    根据世界不平等数据库，2014 年收入分配的底层 50% 仅获得了当年产生收入的 12.5%，而顶层 1% 则在同年获得了 20% 的收入。


    ## 区域不平等


    也有证据表明，工资增长因农村和城市地区而异。自 2016 年以来，位于大都会统计区 (MSA) 的工人时薪增长率在 3.2% 至 3.8% 之间。相比之下，同期非
    MSA 地区工人的时薪增长率为 2.8% 至 3.2%。虽然在大衰退刚结束时，这两组人之间的差距并不明显，但自 2016 年初以来，这一差距一直存在。这可能说明高薪就业增长集中在城市，而农村地区被抛在了后面，这与特朗普政府关于其经济政策的承诺背道而驰。


    ## 就业人口比处于复苏期历史低位


    就业人口比 (EPOP)，即处于黄金工作年龄且受雇人群的比例，与以往的复苏期相比，一直处于低位且复苏缓慢。当这一比率较低时，意味着要么找工作的人找不到工作，要么他们能找到的工作在薪酬、条件或其他偏好方面不尽如人意。这些人——即不再参与劳动力市场的人——不计入失业率。


    在最近一次衰退来袭之前，这两项指标对男性和女性都呈现了一定程度的上升趋势，大致表明体面工作广泛可得。然而，当大衰退期间数百万个工作岗位流失时，许多人并未立即重返劳动力市场。在大衰退之前的两次衰退后，男性的
    EPOP 花了六到八年才恢复。相比之下，在本轮复苏中，女性的 EPOP 花了十年才恢复到衰退前 72% 的水平——终于在 2018 年达标。男性的 EPOP
    仍低于大衰退前的水平，这也是经济运行低于充分就业、仍未达到 2007 年底 87% 水平的又一迹象。


    ## 经济未为未来增长奠定基础


    伴随着一个在薪酬、就业机会和生活成本方面让工人失望的经济，还有一些宏观经济指标表明，经济的生产潜力正在被浪费——无论是通过浪费性的减税、过早终止的刺激计划，还是在出现经济放缓迹象时紧随其后的加息后降息。


    ### 整体增长率缓慢


    自 2014 年第二季度反弹以来，经济的国内生产总值 (GDP)（总产出的衡量指标）每个季度都在增长，此后平均季度增长率约为 2.5%。这些增速与复苏期间的季度增速基本一致。然而，2017
    年《减税与就业法案》激起了促增长的乐观情绪，特别是 2018 年第四季度和 2019 年第二季度的表现令人失望。此外，将其视为全球停滞趋势的一部分来看，令人担忧。以下的数据分析（包括生产率、产能利用率和投资）将阐释一些有助于解释这种温和
    GDP 增长的主要嫌疑因素。


    ### 生产率


    生产率，即工人每工作一小时生产的产出量，是衡量经济健康状况的重要指标，因为其增长扩大了消费者需求和工人收入的潜力。随着工人以更高效的速度生产更多商品，商品对消费者来说变得更便宜。同时，随着对廉价商品需求的增加，企业获得更多收入，从而增加产出、招聘和整体经济收入。经济中的生产率增益越多，产生的收入就越多。理论上，其中一部分钱可以用于加薪。例如，在生产率增长约
    1.5%、通胀率 2% 的情况下，在不增加经济中劳动收入份额的前提下，工人的薪酬最高可按 3.5% 的同比增幅增长。20 世纪 90 年代末是持续的生产率增长促使员工薪酬大幅上涨的最近一段时期。在那个时期，生产率以每年
    2.5% 至 4% 的速度增长，导致工资持续增长高达每年 5%。20 世纪 60 年代初，生产率也以 2% 至 7% 的速度增长，70 年代初则为 3% 至
    6%。将这些时期与当前的扩张期形成对比：生产率仅在 2010 年代中期一次性超过 2% 的门槛，而所有员工的工资增长同比从未超过 3.9%，这令人担忧。


    ### 产能利用率


    美国所有行业的产能利用率自 20 世纪 60 年代末以来一直呈长期（非周期性）下降趋势。该利率可被视为衡量经济是否在充分潜力下运行的指标。粗略地说，该利率衡量的是现有设备和机器实际生产的产出量，占如果
    100% 充分利用这些设备和机器潜在产出量的份额。观察最近一次衰退的影响，我们看到随着房地产泡沫破裂、银行倒闭、投资和生产放缓、失业率飙升、商品和服务需求下降，该利率在
    2000 年代末急剧下降。实际产出与潜在产出之间的差距显著扩大，尽管经历了十年的复苏，该利率仍未反弹至 20 世纪 90 年代末和 2000 年代前几次经济扩张时的水平。事实上，这是有记录以来产能利用率首次未能突破
    80% 门槛的复苏期。机器闲置，就业人数减少，经济并未在满负荷运转。


    ## 什么是黑白财富差距？


    根据非营利公共政策研究组织布鲁金斯学会的数据，美国黑人家庭的平均净资产远低于白人家庭的平均净资产。


    > “布鲁金斯学会 2016 年报告称，非裔美国家庭的平均净资产约为 17,000 美元，而白人家庭的平均净资产为 171,000 美元，”克利夫兰非党派、非裔美国人主导的公共政策智库
    PolicyBridge 联合创始人兰德尔·麦克谢帕德说道。


    麦克谢帕德表示，造成这一差距的原因有很多，包括涉及住房、教育、监禁和职场的歧视性政策。他解释说，所有这些问题都影响着机会——从一个人能住在哪里到教育质量——这决定了找到薪酬优厚且收入有保障工作的能力。


    > “黑人的薪酬水平通常与白人不同。即使平均受教育程度更高，他们的报酬仍不在同一水平，”麦克谢帕德说。“那么，一个人还能做什么呢？读大学、硕士或博士，然后意识到平均而言，你赚的钱仍比一个辍学的白人少，这说明了很多问题。”


    > “如果你考虑制定政策来试图纠正种族财富差距，外面有很多政策，但任何不能以某种方式解决或配合缩小收入差距努力的政策，其功效都将是短暂的，”克利夫兰联邦储备银行高级研究经济学家丹尼尔·卡罗尔说道。


