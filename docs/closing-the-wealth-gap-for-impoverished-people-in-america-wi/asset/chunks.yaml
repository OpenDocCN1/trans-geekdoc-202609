    等，典型收入为 25 万美元或更多。中产阶级包含从教授到工厂工人的广泛工人群体，他们的收入可能超过 10 万美元。下层或工人阶级通常由失业者、残疾人和领取最低工资的人组成。随着美国经济增长，所有阶级的工资都应增长，以实现平等分配。


