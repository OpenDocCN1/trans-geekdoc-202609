    # 第 1 章


    ## 财富鸿沟


    ### 机会不均之地：美国


    在美国，贫富差距急剧扩大。低收入人群越来越难以摆脱其贫困的经济地位。关于“白手起家”致富的故事寥寥无几，贫困家庭的年工作时长却在增加（前提是他们有工作）。尽管美国是世界上最富有的国家，但其收入不平等程度远高于英国、澳大利亚和加拿大等其他主要国家（Rand,
    2004）。当前统计数据显示，富人越来越富，中等收入美国人停滞不前，穷人则落后得更远。


    尽管美国被视为物质财富与成功的乐土，但自建国以来贫困现象持续存在。大量美国人过去是、现在仍然是贫困的。按社会公认标准，他们缺乏充足的资源来养活、穿衣和安置自己（Rand,
    2004）。审视贫困存在许多问题，因为它是一个渗透社会每个维度且含义各异的问题。社会贫困意味着一些人被剥夺了接受体面教育的权利。政治贫困意味着无辜者因肤色入狱，而政治家却视而不见。经济贫困意味着部分人就业机会有限、住房不足。


    当个人陷入贫困时，他们不得不在缴纳账单和为孩子购买校服学习用品之间做选择。当个人贫穷时，其生活条件往往缺乏煤气、水和电等基本必需品。因缺乏货币资本和社会资本，他们不得不做出生死攸关的抉择。从本质上讲，贫困是缺乏在该社会取得成功所必需的经济、政治和社会资源的生活状态。贫困是无力、缺乏代表性和自由。只有当美国社会商品和服务的分配发生根本性变化、所有人站在更平等的竞争场上时，个人才不被视为贫困。在美国，贫困可定义为生物学层面（即个人无法满足生物学需求）和相对层面（即相较于社会其他成员处于贫困状态）（Iceland,
    2003）。


    人口普查局使用一组货币收入门槛来衡量贫困，该门槛基于家庭规模和结构。若家庭收入低于特定门槛，则被视为贫困。这些门槛由税前货币收入构成，如劳动收入、公共援助、赡养费、抚养费、社会保障福利和信托收入。对于人口普查局衡量贫困的方式存在大量批评，因其被认为陈旧且计算错误。衡量个人是否生活在贫困线以下最重要的指标是收入。根据人口普查局，家庭收入仅计算现金收入，不包括食品券、学校午餐计划和所得税抵免等其他类型的政府援助。一个有三个
    18 岁以下孩子的四口之家，若总收入低于 19,230 美元，即被视为贫困。例如，芝加哥生活在贫困线以下的人数下降了 6%，但这并不意味着贫困人口减少。芝加哥一半以上社区的贫困率实际上上升了。


    我对贫困的定义与人口普查局和 OMB（注：美国行政管理与预算局）使用的定义截然不同，因为我不仅衡量经济资源，还衡量政治和社会资源。人口普查局和 OMB 仅衡量现金收入。两者使用的定义不包含社会和政治剥夺等构念。使用该定义的人显然不理解，贫困不仅仅是缺钱。贫困是一种心理状态，导致人们在学业上落后、更可能犯罪、并失去希望。贫困不仅掏空钱包，更摧毁精神。贫困有多种概念化和操作化方式。2002
    年，人口普查局将国家科学院设计的一组替代衡量标准与其官方衡量标准进行了比较。然而，结果好坏参半。在一组增加了非现金福利的替代衡量标准下，贫困率反而上升了。这就是人口普查局坚持使用其官方衡量标准的原因。美国想假装贫困不存在，即便存在，也只有极少数人深受其害，通常是有色人种。


