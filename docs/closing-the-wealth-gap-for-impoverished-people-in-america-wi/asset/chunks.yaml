  trans: '

    尽管前任和现任政府言辞夸夸其谈，预测 2017 年减税将带来每年 4,000 美元的加薪，但工人们并未享受到处于扩张第十年的经济红利。薪资增速仍未能持续达到全体非农就业人员
    3.5%–4% 的同比增长区间，而这一涨幅本应与 2%–2.5% 的通胀率和 1.5% 的生产率增长相匹配。事实上，在目前的复苏周期中，同比薪资增速从未突破
    4% 的门槛。反观 1990 年代和 2000 年代的前两次复苏，在其顶峰时期，生产和非监督工人的 12 个月薪资增速达到了 4%–5.3%。特朗普政府时期的峰值薪资增速为
    2019 年夏季的 3.9%，不大于奥巴马政府时期 2016 年秋季的峰值，且远低于 1990 年代末的 5.3% 峰值和 2000 年代中期的 4.3%
    峰值。


    在生产和非监督工人——他们约占国家劳动力的 80%——中，薪资涨幅相对微薄，在本轮扩张期间平均每年仅 2.3%。1990 年代和 2000 年代的扩张期分别带来了
    3.2% 和 3.1% 的平均年薪资增长。相较于这些复苏期，大萧条结束后的这轮扩张在薪资增长方面表现令人失望。


    ## 美国工人持续落后于世界其他国家


    在经济合作与发展组织（OECD）成员国中，美国是个异类，工人薪资相对较低。按收入低于中位数工资三分之二的工人比例来界定，近四分之一的美国工人从事低薪工作。用中位数工资的百分比（67%）来定义低薪工作表明，虽然美国家庭中位数收入可能在增加，但更大比例的低薪工人被甩在了后面，尤其是与其他高收入国家相比。自
    1990 年代以来，美国的薪资增速也持续落后于其他 OECD 国家。这种与其他 OECD 国家的关系随时间并未发生显著变化：美国一直是一个持续的低薪社会，包括现在，尽管正处于有记录以来最长的经济复苏期中。


    ## 按性别和种族划分的薪资


    最近的复苏并未缩小不同种族和性别工人之间的薪资差距。尽管各种族和族裔的男女在过去五年中获得了适度的薪资增长，但群体间的薪资差距依然顽固存在。2019 年，黑人男性的周薪不足白人男性的
    70%，即使自 2015 年以来差距略有缩小。事实上，今年黑人男性相对于白人男性的薪资差距比 1982 年更大。1982 年，黑人女性的周薪与白人女性大致持平，但
    2019 年仅为白人女性中位数周薪的 81%。拉丁裔女性的薪资差距也从 1980 年代初的近乎平等恶化至 2019 年仅为白人女性中位数薪资的 73%。


    ## 低收入群体薪资增长乏力


    在收入分配的底端，薪资增长滞后。虽然前 25% 的工人在 2019 年享受到了超过 4% 的同比薪资涨幅，且第 50–75 百分位区间的薪资增速自 2018
    年底以来有所提高，但第 25–50 百分位和最底层四分位数直到今年春天才刚刚超过 3% 的年小时薪资增长。也就是说，自 2018 年中以来，收入分配中后四分之三的人群并未获得前
    25% 人群所享受的同等薪资涨幅。


    此外，自 2015 年以来，收入分配顶端和底端之间的增长差距已扩大。从长远来看，此类差距进一步加剧了经济中的收入不平等。疲软的薪资增长也表明经济并未达到充分就业。如果国家处于充分就业状态，我们将看到薪资增长加速，尤其是在低薪工人中。


    ## 贫困率居高不下，儿童尤甚


    尽管贫困人口和贫困儿童数量有所下降（根据美国人口普查局的官方贫困衡量标准和补充贫困衡量标准），2018 年仍有 3800 万人处于贫困中，其中包括近 1200
    万儿童。相对贫困衡量标准可用于相对于人口某一收入门槛（通常为中位数收入的某个分数）来衡量贫困。这些指标比衡量绝对贫困水平的指标（如官方贫困衡量标准 OPM
    和补充贫困衡量标准 SPM）提供了更有意义的数据，后者基于 1960 年代被认为维持基本生存所必需的最低商品篮子——SPM 还会根据现金转移支付和政府援助进行调整。像
    OPM 这样的绝对衡量标准未考虑消费性质的变化或随时间增加的成本，也未将贫困率与平均收入者挂钩。相对贫困衡量标准能更好地调整不断变化的生活水平，而且更接近大多数人对贫困的看法。


    按中位数收入的 60% 计算，2016 年近四分之一的人口处于贫困中，而近 31% 的儿童处于贫困中。2016 年——最新可用数据年份——中位数家庭收入的
    60% 为每年 35,420 美元。按此衡量，儿童贫困比例实际上从 2013 年到 2016 年大幅上升。这种持续的剥夺或许是经济并未惠及所有人、尤其是最边缘化人群的最清晰迹象。大萧条后的复苏未能充分提高适龄工人或有孩子的劳动家庭的收入。


    ## 国民收入中的劳动份额偏低


    “国民收入劳动份额”这一指标衡量的是归属于经济体中工资收入者的国内生产总值份额。它可作为美国工人权力以及国民收入在工人工资与公司利润之间分配的替代指标。自
    2000 年代初以来劳动份额的近期下降仍是一个悬而未决的问题，经济学家们一直难以破解，但有人认为这反映了劳动相对于资本话语权的下降。美国的工会密度远低于 1970
    年代，而企业垄断、股票回购、竞业限制条款、劳动保护弱化、离岸外包、全球供应链、金融机构在全球经济中作用的增强、外包，以及兼职和低薪工作的激增，都削弱了工人分享国家增益更大份额的能力。这也意味着生产率增益不一定会带来足够的薪资增长。


    人们本以为 2010 年代的长期复苏会扭转 2000 年代初开始的急剧下降。但在 2014 年至 2018 年间，劳动份额仅有微弱增长。事实上，劳动份额目前仍低于自
    1947 年有记录以来任何扩张期的水平。


    ## 不平等


    美国人口普查局报告称，2018 年所有新增收入的 23% 流向了收入最高的 5% 家庭，中间五分位数获得 14.1%，最低五分位数仅获 3.1%。对比 1968
    年的数据：当时收入最高的 5% 家庭获得 16.3% 的收入，中间五分位数获得 17.6%，最低五分位数获得 4.2%。自大萧条以来，顶层的收入份额持续增加。

