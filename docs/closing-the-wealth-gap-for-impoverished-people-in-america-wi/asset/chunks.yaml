    # What Happens If I Throw a Twenty Dollar Bill Into a Fire?


    The same is true for crypto. If I lose my sign in credentials to a certain digital
    wallet or exchange then I won''t be able to have access to those coins. Again,
    I can''t stress enough the importance of conducting business with a reputable
    company.


    ## Scaling


    Currently, this might be the biggest hurdle that''s preventing people from conducting
    more transactions on the blockchain. When it comes to the speed of transactions,
    fiat money moves much quicker than crypto for now. Visa can handle about 20,000
    transactions per second. Under normal circumstances, the blockchain can only handle
    around 10 per second. However, a new protocol is being enacted that will skyrocket
    this up to 60,000 transactions per second. Known as the Lightning Network, it
    could result in making crypto the future of money.


    ## Convenience


    The conversation wouldn''t be complete without talking about convenience. What
    do people typically like about their traditional banking and spending methods?
    For those who prefer cash, it''s obviously easy to use most of the time. If you''re
    trying to book a hotel room or a rental car, then you need a credit card. Personally,
    I use my credit card everywhere I go because of the convenience, security and
    rewards.


    Did you know there are companies out there providing all of this in the crypto
    space as well? Monaco is now issuing Visa logo-ed cards that automatically convert
    your digital currency into the local currency for you.


    If you''ve ever tried wiring money to someone you know that process can be very
    tedious and costly. Blockchain transactions allow for a user to send crypto to
    anyone in just minutes, regardless of where they live. It''s also considerably
    cheaper and safer than sending a bank wire.


    There are other modern methods for transferring money that exist in both worlds.
    Take, for example, applications such as Zelle, Venmo and Messenger Pay. These
    apps are used by millions of millennials everyday. Did you also know that they
    are starting to incorporate crypto as well?


    The Square Cash app now includes Bitcoin and CEO Jack Dorsey said: "Bitcoin, for
    us, is not stopping at buying and selling. We do believe that this is a transformational
    technology for our industry, and we want to learn as quickly as possible."


    He added, "Bitcoin offers an opportunity to get more people access to the financial
    system".


    While it''s clear that fiat spending still dominates the way most of us move money,
    the fledgling crypto system is quickly gaining ground. The evidence is everywhere.
    Prior to 2017 it was difficult to find mainstream media coverage. Now nearly every
    major business news outlet covers Bitcoin. From Forbes to Fidelity, they''re all
    weighing in with their opinions.


    What''s my opinion? Perhaps the biggest reason Bitcoin might succeed is that it''s
    fair, inclusive and grants financial access to more people worldwide. Banks and
    large institutions see this as a threat to their very existence. They stand to
    be on the losing end of the greatest transfer of wealth the world has ever seen.


    Still undecided? Ask yourself this question: "Are people trusting governments
    and banks more or less with each passing day?"


    Your answer to that question just might be what determines the future of money.


    # How to Buy Bitcoin


    The best way to learn about bitcoin, is to jump in and get a few in your "pocket"
    to get a feel for how they work.


    Despite the hype about how difficult and dangerous it can be, getting bitcoins
    is a lot easier and safer than you might think. In a lot of ways, it is probably
    easier than opening an account at a traditional bank. And, given what has been
    happening in the banking system, it is probably safer too.


    There are a few things to learn: getting and using a software wallet, learning
    how to send and receive money, learning how to buy bitcoin from a person or an
    exchange.


    ## Preparation


    Before getting started, you will need to get yourself a wallet. You can do this
    easily enough by registering with one of the exchanges which will host wallet
    for you. And, although I think you are going to want to have one or more exchange
    wallets eventually, you should start with one on your own computer both to get
    a better feel for bitcoin and because the exchanges are still experimental themselves.
    When we get to that stage of the discussion, I will be advising that you get in
    the habit of moving your money and coins off the exchanges or diversifying across
    exchanges to keep your money safe.


    ### What is a wallet?


    It is a way to store your bitcoins. Specifically, it is software that has been
    designed to store bitcoin. It can be run on your desktop computer, laptop, mobile
    device (except, as yet, Apple) and can also be made to store bitcoins on things
    like crypto thumb drives like a Nano Ledger X. If you are concerned about being
    hacked, then that is a good option. Even the Winklevoss* twins, who have millions
    invested in bitcoin, put their investment on hard drives which they then put into
    a safety deposit box.


    > *The Winklevoss twins are the ones who originally had the idea for a social
    networking site that became Facebook. They hired Mark Zuckerberg who took their
    idea as his own and became immensely rich.


    ### What do you need to know about having a bitcoin wallet on your computer?


    Below you can download the original bitcoin wallet, or client, in Windows or Mac
    format. These are not just wallets, but are in fact part of the bitcoin network.
    They will receive, store, and send your bitcoins. You can create one or more addresses
    with a click (an address is a number that looks like this: `1LyFcQatbg4BvT9gGTz6VdqqHKpPn5QBuk`).
    You will see a field where you can copy and paste a number like this from a person
    you want to send money to and off it will go directly into that person''s wallet.
    You can even create a QR code which will let someone take a picture with an app
    on their phone and send you some bitcoin. It is perfectly safe to give these out.


    > **NOTE:** This type of wallet acts both as a wallet for you and as part of the
    bitcoin system. The reason bitcoin works is that every transaction is broadcast
    and recorded as a number across the entire system (meaning that every transaction
    is confirmed and made irreversible by the network itself). Any computer with the
    right software can be part of that system, checking and supporting the network.
    This wallet serves as your personal wallet and also as a support for that system.
    Therefore, be aware that it will take up 8-9 gigabytes of your computer''s memory.
    After you install the wallet, it will take as much as a day for the wallet to
    sync with the network. This is normal, does not harm your computer, and makes
    the system as a whole more secure, so it''s a good idea.


    There will be other options and features, but to start out with, these are the
    items that you should know about.


    ## Getting Your First Bitcoins


    Now that you have a wallet, you will, of course, want to test them out.


    The very next place to go is where you want to buy your Bitcoin. Usually the easiest
    and safest place to purchase your first bitcoin is an exchange like Coinbase or
    Binance. These exchange are very beginner friendly and will give you step by step
    instructions on purchasing cryptocurrency. Just link you bank account and with
    a few quick clicks…. Congratulations! You have just entered the bitcoin economy.


    ## Buying Bitcoin Hand-to-Hand

    '
