    # Chapter 1


    ## The Wealth Gap


    ### The Land of Inadequate Opportunity in America


    In the United States, disparities between rich and poor have risen sharply. Low-income
    individuals are increasingly unlikely to escape from their economic position of
    poverty. There are few stories of how someone made it from "rags to riches," and
    poor families are increasing their annual working hours, if they have jobs. Although
    America is the wealthiest country in the world, income inequality is far greater
    here than in other major countries such as Great Britain, Australia, and Canada
    (Rand, 2004). Current statistics show that the rich is getting richer, middle
    income Americans are stagnating, and the poor is falling further behind.


    Although America is thought of as the land of material wealth and success, poverty
    has existed persistently since it was founded. Large numbers of Americans have
    been and still are poor. They lack the resources to feed, clothe, and shelter
    themselves adequately according to socially defined standards (Rand, 2004). There
    are many issues when looking at poverty because it is a problem that permeates
    every dimension of society and has different meanings. Social poverty means that
    some people will denied the right to a decent education. Political poverty means
    that innocent people are imprisoned on the basis of their skin color and politicians
    turn a blind eye. Economic poverty means there will be limited employment opportunities
    for some and inadequate housing.


    When individuals are poverty-stricken, they have to make choices between paying
    bills or buying school clothes and supplies for their children. When individuals
    are poor, their living conditions are often lacking in essentials such as gas,
    water, and electricity. They have make critical life or death decisions because
    they lack monetary and social capital. In essence, poverty is the state of living
    without economic, political and social resources that are necessary and requisite
    for achieving success in this society. Poverty is powerlessness, a lack of representation
    and freedom. The only point in which individuals would not be considered poverty-stricken
    is when there is a fundamental change in the distribution of goods and services
    in American society and everyone is on a more equal playing field. In the United
    States, poverty can be defined either as biological, meaning that individuals
    cannot meet biological needs and relative, which describes a person as poor in
    comparison to other members of their society (Iceland, 2003).


    The Census Bureau measures poverty by using a set of money income thresholds that
    is based on the family''s size and structure. If a family''s income falls below
    that particular threshold, they are considered poor. These thresholds consist
    of money income before taxes such as work earnings, public assistance, alimony,
    child support, social security benefits, and trusts. There has been much criticism
    of the way the Census Bureau measures poverty because it is considered archaic
    and miscalculated. The most important aspect used to measure whether an individual
    is living below the poverty line is income. According to the Census Bureau, only
    cash income is considered in a family''s income, not the other types of government
    assistance such as Food Stamps, school lunch programs and earned income tax credits.
    A family of four with three children under the age 18 would be considered poverty-stricken
    if their total income falls below $19,230. For example, in Chicago, the number
    of people living below the poverty line dropped by six percent but this does not
    mean there are fewer people living in poverty. More than half of Chicago''s neighborhoods
    poverty rates has increased.


    My definition of poverty is quite different than the one used by the Census Bureau
    and OMB because I measured not only economic resources, but political and social.
    The Census and the OMB only measures cash income. The definition used by the Census
    and the OMB do not allow for constructs such as social and political deprivation.
    The individuals who use this definition obviously do not understand that being
    impoverished is more than lacking money. Poverty is a state of mind that causes
    people to fall behind academically, to be more likely to commit criminal acts,
    and to lose hope. Poverty not only decimates pocketbooks but spirits. There are
    several ways that poverty might be conceptualized and operationalized. In 2002,
    the Census Bureau compared a set of alternative measures designed by the National
    Academy of Sciences with its own official measure. However, the findings were
    mixed. Under a set of alternative measures that added noncash benefits, the poverty
    rate increased. That is why the Census Bureau uses its official measure. The United
    States wants to pretend that poverty does not exist and if it does, only a few
    are actually afflicted, usually people of color.

