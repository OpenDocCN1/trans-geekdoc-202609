    各种规模的企业都很难找到合适的员工。通过区块链技术，企业可以通过数字数据库验证所有申请人的证书。区块链技术可用于创建一个去中心化的专业人士数据库，其中包含安全账本中经过验证的资格，企业可以参考该数据库招聘候选人。`Learning
    Machine` 是一家总部位于纽约的公司，旨在解决这一问题，专注于记录工人的可验证信息。


