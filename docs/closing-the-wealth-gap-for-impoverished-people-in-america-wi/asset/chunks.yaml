    Hоw аbоut if mу bаnk iѕ rоbbеd оr thеrе iѕ frаudulеnt асtivitу оn mу сrеdit саrd?
    Mу dероѕitѕ with thе bаnk аrе соvеrеd bу FDIC inѕurаnсе. Chаnсеѕ аrе mу bаnk will
    аlѕо rеvеrѕе аnу сhаrgеѕ оn mу саrd thаt I nеvеr mаdе. Thаt dоеѕn''t mеаn thаt
    сriminаlѕ wоn''t bе аblе tо рull оff ѕtuntѕ thаt аrе аt thе vеrу lеаѕt fruѕtrаting
    аnd timе соnѕuming. It''ѕ mоrе оr lеѕѕ thе реасе оf mind thаt соmеѕ frоm knоwing
    thаt I''ll mоѕt likеlу bе mаdе whоlе frоm аnу wrоngdоing аgаinѕt mе.


    In сrурtо, thеrе''ѕ a lоt оf сhоiсеѕ whеn it соmеѕ tо whеrе tо ѕtоrе уоur mоnеу.
    It''ѕ imреrаtivе tо knоw if trаnѕасtiоnѕ аrе inѕurеd fоr уоur рrоtесtiоn. Thеrе
    аrе rерutаblе еxсhаngеѕ ѕuсh аѕ Binаnсе аnd Cоinbаѕе thаt hаvе a рrоvеn trасk
    rесоrd оf righting wrоngѕ fоr thеir сliеntѕ. Juѕt likе thеrе аrе lеѕѕ thаn rерutаblе
    bаnkѕ аll оvеr thе wоrld, thе ѕаmе iѕ truе in сrурtо.'
  fmt: '

    # 加密货币概览


    ## 莱特币


    莱特币作为比特币的一种替代方案，试图解决许多阻碍比特币发展的问题。它不像以太坊那样具有韧性，其价值主要源于可靠用户的采用。值得注意的是，前谷歌工程师查理·李领导着莱特币的发展。他对莱特币的运作保持透明，并在
    Twitter 上非常活跃。


    莱特币曾长期充当比特币的“配角”，但情况在 2017 年初开始发生变化。首先，Coinbase 采用了莱特币，同时还采用了以太坊和比特币。随后，莱特币通过采用隔离见证技术修复了比特币的问题。这使其具备了降低交易费用并实现更多功能的能力。然而，决定性因素是查理·李决定将唯一重心放在莱特币上，甚至离开了他担任工程总监的
    Coinbase，只为专注于莱特币。因此，莱特币价格在过去几个月里上涨，其最强驱动因素是它可能成为比特币的真正替代品。


    ## 以太坊


    超级程序员维塔利克·布特林构想了以太坊，它能做比特币能做的一切。然而，其主要目的是成为一个构建去中心化应用的平台。区块链是两者差异所在。基本上，比特币的区块链记录一种合同类型，即资金是否从一个数字地址转移到了另一个地址。然而，以太坊有了显著扩展，因为它拥有更高级的脚本语言，并拥有更复杂、更广泛的应用范围。


    当开发者注意到以太坊的优越特性时，项目开始在其之上涌现。通过代币众筹，一些项目甚至筹集了数百万美元，这一趋势至今仍在继续。你可以在以太坊平台上构建奇妙事物这一事实，使其几乎像互联网本身一样。这导致价格飙升，所以如果你在今年早些时候购买了价值
    100 美元的以太坊，现在其价值将接近 3000 美元。


    ## 门罗币


    门罗币旨在解决匿名交易的问题。即使这种货币曾被视为洗钱的手段，门罗币旨在改变这一现状。基本上，门罗币和比特币的区别在于，比特币拥有透明的区块链，每笔交易都是公开且记录在案的。使用比特币，任何人都能看到资金如何以及在何处移动。比特币上存在某种不完美的匿名性。相比之下，门罗币拥有不透明而非透明的交易方式。没有人完全信服这种方法，但既然有些人出于各种目的热爱隐私，门罗币将长期存在。


    ## Zcash


    与门罗币不相上下，Zcash 也旨在解决比特币面临的问题。区别在于，与其完全透明，门罗币在其区块链风格中仅部分公开。Zcash 也旨在解决匿名交易的问题。毕竟，并非每个人都喜欢展示他们在星球大战纪念品上实际花了多少钱。因此，结论是这种类型的加密货币确实拥有受众和需求，尽管很难指出哪种专注于隐私的加密货币最终会脱颖而出。


    ## Bancor


    Bancor 也被称为“智能代币”，是加密货币的新一代标准，可以在储备中持有多种代币。基本上，Bancor 试图通过提高代币的流动性水平并让它们拥有自动化的市场价格，使交易、管理和创建代币变得容易。目前，Bancor
    拥有一个前端产品，包含钱包和智能代币的创建功能。社区中也有统计数据、个人资料和讨论等功能。简而言之，Bancor 协议支持内置价格发现机制，以及通过创新储备机制为智能合约代币提供流动性。通过智能合约，你可以即时清算或购买
    Bancor 储备中的任何代币。使用 Bancor，你可以轻松创建新的加密货币。现在谁不想要这个功能呢？


    ## EOS


    作为以太坊的另一个竞争对手，EOS 承诺通过提供一组更强大的工具来运行和创建平台上的应用，解决以太坊的扩容问题。


    ## Tezos


    作为以太坊的一种替代方案，Tezos 可以在无需太多努力的情况下达成共识升级。这个新区块链是去中心化的，因为它通过建立一个数字化的真正共同体实现自我治理。它促进了称为形式化验证的数学技术，并拥有针对最具金融分量、最敏感的智能合约的安全增强功能。绝对是未来几个月的一项绝佳投资。


    ## Cardano


    Cardano 是一个公共区块链平台。它是开源且去中心化的，通过权益证明达成共识。它可以用其内部加密货币 Ada 促进点对点交易。


    # 加密货币是货币的未来吗？


    货币的未来会是什么样子？想象一下走进一家餐厅，抬头看着数字菜单板上你最爱的套餐。只是它不是标价 8.99 美元，而是显示为 .009 BTC。


    加密货币真的能成为货币的未来吗？这个问题的答案取决在几个关键决策的整体共识上，范围从易用性到安全性和监管。


    让我们审视这枚（数字）硬币的两面，对比并对照传统法币与加密货币。


    ### 信任


    首先也是最重要的组成部分是信任。


    人们必须信任他们使用的货币。是什么赋予美元价值？是黄金吗？不，自 1970 年代以来美元就不再由黄金支持。那么是什么赋予美元（或任何其他法币）价值？一些国家的货币被认为比其他国家更稳定。最终，是人们相信发行该货币的政府坚定地站在其背后，并本质上保证其“价值”。


    既然比特币是去中心化的，意味着没有发行硬币的管理机构，信任是如何运作的？比特币位于区块链上，区块链基本上是一个在线会计账本，允许全世界查看每一笔交易。每笔交易都由矿工（在点对点网络上操作计算机的人）验证，以防止欺诈并确保没有双重支付。作为维护区块链完整性服务的交换，矿工因验证的每笔交易获得报酬。由于有无数矿工试图赚钱，每一个都会检查其他人的工作以寻找错误。这种工作量证明过程就是区块链从未被黑客攻破的原因。本质上，这种信任赋予了比特币价值。


    ### 安全性


    接下来让我们看看信任最亲密的朋友：安全性。


    如果我的银行被抢劫或我的信用卡发生欺诈活动怎么办？我在银行的存款受 FDIC 保险覆盖。我的银行很可能也会撤销我从未产生的任何信用卡费用。这并不意味着罪犯无法实施至少令人沮丧且耗时的噱头。这或多或少是来自于知道我极有可能从针对我的任何不法行为中得到补偿的安心感。


    在加密货币领域，关于把钱存在哪里有很多选择。必须知道交易是否为你的保护投保。有信誉良好的交易所，如 Binance 和 Coinbase，它们有为客户纠正错误的可靠记录。就像世界上有不那么靠谱的银行一样，加密货币领域也是如此。

    '
