    Cаrrоll 完成了一项关于黑白财富差距的研究。他指出，社会普遍看待黑人的方式是限制他们获得更多机会的原因。


    “他们，他们的印象是，我认为是错误的印象，你知道，他们从电视上看到的或听到的任何东西得来的。他们并没有真正与普通人打交道，”Cаrrоll 说。“所以如果你得到的只是那幅画面，就很容易把这些问题视为别人的问题。”


    McShераrd 说，一个令人震惊的事实是，白人和黑人之间的财富差距现在大致与 60 多年前一样。


    “这表明几十年过去了，但那些本可以思考这个问题或采取行动的立法者和其他公民领袖、政策制定者似乎并不在意，”McShераrd 说。


    McShераrd 说，开始缩小财富差距的最好方法之一是承认差距的存在，并承认黑人不是自己造成的。


    “让我最难过的时刻是当人们说，你知道，黑人，他们很懒惰，他们只是不够努力，然后哦，他们在抱怨什么？你知道，我创业时不得不做所有这些事，或者我必须做这个和那个——这没有考虑到，你知道，如果这是一场赛跑，你知道，你在起跑线上就比有色人种领先了一百码，因为他们没有那么多失地需要弥补。所以财富差距真正关乎的是弥补失地，”McShераrd
    说。


    ## 结论


    经济对大多数美国人不起作用，特别是对弱势群体。宏观经济表现指标，特别是投资和产能利用率，指向一个没有在其全部潜力下运行的经济。


    缓慢的增长和投资以及微弱的收入增长将使美国劳动者面临艰难着陆，如果经济陷入衰退。薪资增长比 2010 年代初期更快，但工人仍难以负担必需品。债务和财务负担依然存在，工薪阶层家庭面临财务压力的可能性是富裕家庭的两倍。工资增长率未达到类似扩张时期的水平，这表明经济未处于充分就业状态，工人仍在努力争取工作和加薪。


    像国际货币基金组织这样的全球经济机构正努力警告各国不要追求可能进一步加剧过去两个季度全球经济放缓的经济政策。当欧洲国家（如德国）努力避免经济下行时，美国在回购协议市场近期的不确定性和贸易政策方面正处于未知水域。疲软的工资增长因美国消费者的关键作用而增加了停滞的风险。此外，还有担忧认为经济一直靠瞄准不准的财政刺激支撑，而这可能正在失效。


    # 第 2 章


    ## 大多数美国人靠工资过日子


    ### 靠工资过日子


    如今，越来越多的美国人靠工资过日子。之所以发生这种情况，是因为人们为了生存花的钱比赚的钱多。你可以通过从月度预算中留出一点钱来打破这个循环。通过用收入中较小的百分比支付开支，应该会有一些结余用于储蓄或支付突发的意外紧急情况。学会有效地制定预算并坚持执行，是一项可以终身使用和传承的技能。以下提示可以帮助任何人在通往稳定财务未来的道路上。


    ### 个人财务


    掌控个人财务有利于个人信用和购买能力，这样做能让整体生活变得更好。制定月度预算并坚持执行。既然大多数人靠工资过日子，超支很容易被每月忽视，你可能会发现自己陷得更深。确定你能安全花费多少，这包括为意外开支存钱。密切记录你在每个预算项目上花了多少钱。


    ### 量入为出


    不要每月刷卡购买账单到来时你无法支付的物品。利息会累积，如果你只支付最低还款额，从长远来看，你为购买支付的钱可能比一开始直接用自己的钱买要多得多。


    在靠工资过日子时，尽量按时支付所有账单以避免滞纳金。这些滞纳金会累积并变得难以收拾。如果你靠工资过日子，一笔滞纳金就可能引发更多滞纳金的财务雪崩。只要可能，不惜一切代价避免它们，按时付款是必须的。


    ### 改善财务状况


    改善你的个人财务资产。拿出约 10-12% 的工资存入储蓄账户将大有裨益。这样在艰难的经济时期，就会有一些现金可以周转，而不必求助于信用卡或借高利贷。


    ### 金钱的影响


    金钱影响我们生活的许多方面。包括我们的信用报告。良好的信用报告分数被认为是 700 分及以上，很可能获得贷款的最佳利率。平均 640-700 分的信用分数很可能让你获得利率相当不错的贷款。否则，如果你的信用分数低于最低要求，你可能不会被考虑贷款，即使你碰巧运气好批到了，贷款很可能需要担保并伴随高利率。


    贷方会在你的信用历史中寻找某些迹象或习惯。学习这些财务困境的迹象以及如何避免它们是必须的。


    避免开设多个账户。试图开设多个账户是你信用报告上向贷方发出财务困境的信号指标。虽然用一张信用卡还另一张信用卡可能是摆脱债务的好方法（特别是如果你使用的是低利率信用卡），但这对贷方来说也是一个困境信号。此类行为告诉潜在贷方你无法靠目前的收入在财务上生存，应尽可能避免。


    当你陷入财务困境，靠工资过日子时，会感觉仿佛被困住了。然而，如果你明智地消费和储蓄，你可以解决金钱问题，克服它们，有时甚至能反客为主。如果你仍发现自己陷入财务困境并需要赚取额外现金，有许多在家工作的解决方案。


    ### 给靠工资过日子者的现实检验


    如果你靠工资过日子，这个循环似乎永远不会结束。在你意识到之前，生活似乎变成了一个向下的螺旋，永远不够用，勉强度日。你不仅试图让餐桌上有饭吃，还要防止房子被没收，以及应对债权人和催收员那些烦人的电话。好吧，是时候进行一次现实检验，下“靠工资过日子”这趟列车了。通过应用这些技巧，财务自由是有可能的。


    ### 先支付自己


    财务自由的一个秘诀是先支付自己。“好吧，如果月底根本没有足够的钱，我怎么做到？”你可能会问。永远先支付自己。当催收员打电话施压要钱时，你会想办法付给他们，但你永远不会给自己施加那种压力。无论是每月
    10 美元还是 100 美元，只要从某处开始，立即开始。你开始得越早，存得越多，就能越快不再靠工资过日子。


    ### 分析你的需求与愿望

