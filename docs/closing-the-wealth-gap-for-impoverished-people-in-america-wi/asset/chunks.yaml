    # Chapter 5


    ## Plan to Action


    ### How Blockchain Can Reduce Global Poverty


    Blockchain technology is a versatile piece of technological wonder not only capable
    of reducing poverty itself to historical connotations, but also permitting a wide
    berth of interesting and advancing elements for everyday productivity. As you
    can see, the applications of blockchain outside of financial services are innumerable
    and can be used in such a way that benefit poverty-stricken countries, as well
    as promoting a more fundamental system for relief programs, or other forms of
    financial assistance outside of the norm.


    The applications of blockchain technology are literally widespread, so much so
    that the technology could be applicable to, quite nearly, any and every form of
    market. It''s not solely a form of financial marketing service, or even a provider
    for digital currency. Blockchain technology is an advanced formula for the integration
    of data and other forms of information. When it comes to bolstering developing
    countries and likewise instituting a variety of blockchain systems for the benefit
    of financial inclusion, it would go without saying that the most fundamental outlier
    are the ways in which blockchain can reduce global poverty.


    ### Cheap Banking Facilities


    While the most important concept in the ways blockchain technology can reduce
    global poverty is essentially financial inclusion, there are a number of setbacks
    and, more or less, roadblocks to this equation. Much of the poor in any country
    tend to live off about $1.25 a day (if that), which then gives them little access
    to financial services, like banking, loans, and so on.


    Fortunately, among the most prominent ways in which blockchain can end poverty,
    is the creation of cheap banking facilities. We''ve already seen a great deal
    of this when investing in Bitcoin: the peer-to-peer blockchain tech allows users
    to open a wallet, receive and send money at will without an ID or credit history.
    This allows those in poor countries to either utilize microlending, as seen in
    Wayniloans'' bitcoin lending platform, or blockchain-enabled remittances, like
    the $410 billion that flows to developing countries around the world.


    ### Accessibility


    One of the most fundamental aspects behind the world of blockchain technologies
    and their utilization in various concepts can easily be understood simply by way
    of its immense accessibility. As previously noted, banking and finance can be
    done on such a remote level that the need for ID and credit histories would be
    unnecessary; leaving your house, therefore, has become pretty much unnecessary
    due to the tech and its inborn mobile device nature.


    This is how blockchain can reduce global poverty, simply by making emerging markets
    and developing countries more accessible to people around the world. More specifically
    in connotation to marginalized sectors, these accessibilities could grant a wide
    variety of concepts, as seen in EverEx. The small ICO allows migrant workers to
    send money back home through blockchain-powered transactions, giving those in
    smaller, less-economically stimulant countries more access to financial services.


    ### Role of Small Businesses


    Small business growth is the utmost key in bolstering struggling countries and
    is among the many ways blockchain can reduce global poverty. Simply by bolstering
    small business transactions and developing better channels of income can benefit
    developing countries all around the world.


    It''s not simply through the facilitation of these businesses, but in bolstering
    their transactions, as well. In many cases, blockchain systems can holistically
    adapt how we experience small business by allowing micro-credit transactions and
    services for loan coverages on starting business costs. This is only one of many
    ways blockchain tech will adapt small businesses and help to reverse poverty on
    a global scale.


    ### Unbanked and Underbanked


    Unbanked and underbanked means that an individual or country is without a proper
    form of access to services like checking accounts or making loans. As of right
    now, there are nearly 2.5 billion people who are either unbanked or underbanked,
    which means they have no direct form of legitimate lending, making them more vulnerable
    to predatory practices and loan sharks.


    To make them less vulnerable and more fundamentally protected by these malicious
    forms of finance, blockchain can reduce global poverty by way of enhancing these
    countries'' securities and legitimizing their markets. Blockchain technology will
    give unstable countries the option of leaving this cycle of extortionate interest
    rates and further financial instability by implementing a digital form of exchange
    that eliminates these negative concepts in financial markets.


    ### Decentralized Identity


    One of the most prominent uses of blockchain, and more specifically Bitcoin, is
    the decentralized identity that comes with them. Whether public or private, the
    specific blockchain then will always give organizations the most singular form
    of the truth available. Similarly, one way how blockchain can reduce global poverty
    is by using the same concepts for not-for-profit organizations helping the poor.


    Once a more fundamental, or even beneficial digital profile is comprised for an
    individual or country, the more this blockchain technology can be used to harness
    that individual''s or country''s provisions, therefore increasing their profile
    for further transactions. The decentralized identity is only one form of how blockchain
    enables 360-degree economic profiles for both countries and individuals in need.


    ### Role of Technology


    One of the most awesome ways blockchain technology is being used to fuel emerging
    markets is through technology. For instance, blockchain technology could give
    us a smarter energy grid, but that''s not solely how blockchain can reduce global
    poverty. Thanks to the likes of artificial intelligence, big data analytics and
    blockchain itself, the financial world itself has largely grown with innumerable
    channels that can be used as resources for the poor.


    By then securing a more fundamental reality for informal economies, the blockchain
    technology itself serves as the basis for scaling large systems of finance, for
    instance accumulating government pensions, increased job security, increased government
    protection for consumers, and much more. The realities of technology and poverty
    can go hand in hand when utilizing blockchain to stimulate proficient economic
    stimulus for the needy.


    ### Property Ownership


    With countries like Honduras, Georgia, and Sweden utilizing blockchain technology
    as a form of land ownership (despite Honduras'' attempts recently stalled), it''s
    clear that the aspects of blockchain can largely be used to register property
    ownership in a more fundamental aspect.

    '
  trans: '


    # 第 5 章


    ## 从计划到行动


    ### 区块链如何减少全球贫困


    区块链技术是一项用途广泛的技术奇迹，不仅能将贫困本身降格为历史名词，还能为日常生产力带来大量有趣且先进的元素。正如你所见，区块链在金融服务之外的应用数不胜数，既可用于造福贫困国家，也可用于推动更基础的救济体系，或其他常规之外的金融援助形式。


    区块链技术的应用简直无处不在，以至于该技术几乎可适用于任何形式的市场。它不仅仅是一种金融营销服务，甚至不仅仅是数字货币的提供者。区块链技术是数据及其他形式信息集成的先进公式。当谈到扶持发展中国家、并建立各类区块链系统以促进金融普惠时，毋庸置疑，最根本的突破口在于区块链减少全球贫困的多种途径。


    ### 低成本银行服务


    虽然区块链技术减少全球贫困最重要的概念本质上是金融普惠，但这一等式中存在诸多挫折，或多或少算得上是路障。任何国家的大多数穷人每天靠约 1.25 美元（甚至更少）生活，这使他们几乎无法获得银行、贷款等金融服务。


    幸运的是，区块链终结贫困的最显著途径之一，是创建低成本银行服务。投资比特币时我们已见识了许多这方面的案例：点对点区块链技术允许用户开设钱包，无需身份证或信用记录即可随意收发资金。这使得贫困国家民众能够利用小额贷款（如
    Wayniloans 的比特币借贷平台），或区块链赋能的汇款服务（如每年流向全球发展中国家的 4100 亿美元汇款）。


    ### 可及性


    区块链技术世界及其在各类概念中应用的最基本特征之一，可以通过其巨大的可及性轻松理解。如前所述，银行和金融业务可在如此偏远的层面开展，以至于身份证和信用记录变得不再必要；因此，得益于该技术与生俱来的移动设备属性，出门在外已变得几乎没有必要。


    这就是区块链减少全球贫困的方式，即让新兴市场和发展中国家对世界各地的人们更加可及。更具体地指向边缘化领域，这些可及性能赋予各种概念，如 EverEx 所示。这个小型
    ICO 允许移民工人通过区块链驱动的交易汇款回家，让那些处于较小、经济刺激较弱国家的人们获得更多金融服务。


    ### 小企业的作用


    小企业增长是扶持困境国家的关键，也是区块链减少全球贫困的诸多途径之一。仅通过扶持小企业交易、开发更好的收入渠道，就能使世界各地的发展中国家受益。


    这不仅体现在促进这些企业，更在于扶持其交易。在许多情况下，区块链系统能全面改变我们体验小企业的方式，允许微额信贷交易，并为创业成本提供贷款担保服务。这只是区块链技术适应小企业、帮助在全球范围扭转贫困的众多方式之一。


    ### 无银行账户与少银行账户人群


    “无银行账户”和“少银行账户”意味着个人或国家无法正当使用支票账户或贷款等服务。截至目前，近 25 亿人属于无银行账户或少银行账户人群，这意味着他们没有直接的合法融资渠道，更容易遭受掠夺性行为和高利贷的侵害。


    为了让他们少受侵害、更基本地受到保护，免受这些恶性金融形式的侵蚀，区块链可通过增强这些国家的安全性、使其市场合法化来减少全球贫困。区块链技术将给动荡国家一个选项，通过实施一种消除金融市场负面概念的数字交换形式，跳出高利率敛财和进一步金融不稳定的恶性循环。


    ### 去中心化身份


    区块链（更具体说是比特币）最显著的用途之一，是其附带的去中心化身份。无论公有链还是私有链，特定区块链始终能为组织提供最单一、最真实的数据来源。同样，区块链减少全球贫困的一种方式，是将相同概念用于帮助穷人的非营利组织。


    一旦为个人或国家建立了更基础、甚至更有益的数字档案，区块链技术就能更多地用于挖掘该个人或国家的资源，从而提升其档案以利于后续交易。去中心化身份只是区块链为有需要的国家和个人实现
    360 度经济画像的一种形式。


    ### 技术的作用


    区块链技术助推新兴市场最令人惊叹的方式之一，是通过技术本身。例如，区块链技术能给我们带来更智能的能源网络，但这并非区块链减少全球贫困的唯一途径。得益于人工智能、大数据分析和区块链本身，金融世界已大幅增长，拥有无数可作为穷人资源的渠道。


    通过为非正规经济确立更基础的现实，区块链技术本身成为大规模金融系统扩展的基础，例如积累政府养老金、增加就业保障、加强政府对消费者的保护等。当利用区块链为有需要者刺激高效经济复苏时，技术与贫困的现实可以携手并进。


    ### 财产所有权


    洪都拉斯、格鲁吉亚和瑞典等国将区块链技术用作土地所有权登记形式（尽管洪都拉斯近期尝试一度停滞），这清楚地表明，区块链的各方面可广泛用于以更基础的方式登记财产所有权。


