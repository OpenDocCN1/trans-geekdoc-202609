    +   6.   `LimitIterator` adds a basic pagination aspect to your applications.
    To use this iterator, you only need to supply the parent iterator, an offset,
    and a limit. `LimitIterator` will then only produce a subset of the entire data
    set starting at the offset. Taking the same example mentioned in step 2, we’ll
    paginate the results coming from our database query. We can do this quite simply
    by wrapping the iterator produced by the fetchCountryName() method inside a `LimitIterator`
    instance:


    ```

    $pagination = new LimitIterator(fetchCountryName(

    $sql, $connection), $offset, $limit);

    ```


    > Be careful when using `LimitIterator`. It needs to have the *entire* data set
    in memory in order to effect a limit. Accordingly, this would not be a good tool
    to use when iterating through large data sets.


    +   7.   Iterators can be *stacked*. In this simple example, an `ArrayIterator`
    is processed by a `FilterIterator`, which in turn is limited by a `LimitIterator`.
    First we set up an instance of `ArrayIterator`:


    ```

    $i = new ArrayIterator($a);

    ```


    +   8.   Next, we plug the `ArrayIterator` into a `FilterIterator` instance. Note
    that we are using the new PHP 7 anonymous class feature. In this case the anonymous
    class extends `FilterIterator` and overrides the accept() method, allowing only
    letters with even-numbered ASCII codes:


    ```

    $f = new class ($i) extends FilterIterator {

    public function accept()

    {

    $current = $this->current();

    return !(ord($current) & 1);

    }

    };

    ```


    +   9.   Finally, we supply the `FilterIterator` instance as an argument to `LimitIterator`,
    and provide an offset (2 in this example) and a limit (6 in this example):


    ```

    $l = new LimitIterator($f, 2, 6);

    ```'
