    # Building a recurring events generator


    A very common need related to generating a calendar is the scheduling of events.
    Events can be in the form of one-off events, which take place on one day, or on
    a weekend. There is a much greater need, however, to track events that are *recurring*.
    We need to account for the start date, the recurring interval (daily, weekly,
    monthly), and the number of occurrences or a specific end date.'
