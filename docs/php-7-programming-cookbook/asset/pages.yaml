  md: "+   10. Finally, to round off header handling, we present getHeadersAsString\
    \ that produces a single header string with the headers separated by `\\r\\n`\
    \ for direct use with PHP stream contexts:\n\n```\npublic function getHeadersAsString()\n\
    {\n    $output = '';\n    $headers = $this->getHeaders();\n    if ($headers &&\
    \ is_array($headers)) {\n        foreach ($headers as $key => $value) {\n    \
    \        if ($output) {\n                $output .= \"\\r\\n\" . $key . ': ' .\
    \ $value;\n            } else {\n                $output  = $key . ': ' . $value;\n\
    \            }\n        }\n    }\n    return $output;\n}\n```\n\n+   11. Still\
    \ within the Message class, we now turn our attention to version handling. According\
    \ to PSR-7, the return value for the protocol version (that is, HTTP/1.1) should\
    \ only be the numerical part. For this reason, we also provide onlyVersion() that\
    \ strips off any non-digit character, allowing periods:\n\n```\npublic function\
    \ getProtocolVersion()\n{\n    if (!isset($this->version)) {\n        $this->version\
