- pgno: 40
  md: "# # Creating a PHP 5 to PHP 7 code converter\n\nFor the most part, PHP 5.x\
    \ code can run unchanged on PHP 7. There are a few changes, however, that are\
    \ classified as **backwards incompatible**. What this means is that if your PHP\
    \ 5 code is written in a certain way, or uses functions that have been removed,\
    \ your code will break, and you'll have a nasty error on your hands.\n\n# ## Getting\
    \ ready\n\nThe **PHP 5 to PHP 7 Code Converter** does two things:\n\n+   - Scans\
    \ your code file and converts PHP 5 functionality that has been removed to its\
    \ equivalent in PHP 7\n- Adds comments with `// WARNING` where changes in language\
    \ usage have occurred, but where a re-write is not possible\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_40_0.png)\n\
    \n> Please note that after running the converter, your code is not guaranteed\
    \ to work in PHP 7. You will still have to review the `// WARNING` tags added.\
    \ At the least, this recipe will give you a good head start converting your PHP\
    \ 5 code to work in PHP 7.\n\nThe core of this recipe is the new PHP 7 `preg_replace_callback_array()`\
    \ function. What this amazing function allows you to do is to present an array\
    \ of regular expressions as keys, with the value representing an independent callback.\
    \ You can then pass the string through a series of transformations. Not only that,\
    \ the subject of the array of callbacks can *itself* be an array.\n\n# ## How\
    \ to do it...\n\n+   1. In a new class `Application\\Parse\\Convert`, we begin\
    \ with a `scan()` method, which accepts a filename as an argument. It checks to\
    \ see if the file exists. If so, it calls the PHP `file()` function, which loads\
    \ the file into an array, with each array element representing one line:\n\n```\n\
    ```\npublic function scan($filename)\n{\n    if (!file_exists($filename)) {\n\
    \        throw new Exception(\n            self::EXCEPTION_FILE_NOT_EXISTS);\n\
    \    }\n    $contents = file($filename);\n    echo 'Processing: ' . $filename\
    \ . PHP_EOL;\n\n    $result = preg_replace_callback_array( [\n```\n\n```"
  merge: -1
  img_proc: true
- pgno: 41
  md: "+   2.  Next, we start passing a series of key/value pairs. The key is a regular\
    \ expression, which is processed against the string. Any matches are passed to\
    \ the callback, which is represented as the value part of the key/value pair.\
    \ We check for opening and closing tags that have been removed from PHP 7:\n\n\
    ```\n    // replace no-longer-supported opening tags\n    '!^\\\\<\\$=(\\n| )!!'\
    \ =>\n        function ($match) {\n            return '<?php' . $match[1];\n \
    \       },\n    \n    // replace no-longer-supported opening tags\n    '!^\\\\\
    <\\$=(\\n| )!!' =>\n        function ($match) {\n            return '<?php echo\
    \ ' . $match[1];\n        },\n    \n    // replace no-longer-supported closing\
    \ tag\n    '!\\$>!' =>\n        function ($match) {\n            return '?>';\n\
    \        },\n```\n\n+   3.  Next is a series of warnings when certain operations\
    \ are detected and there is a potential code-break between how they're handled\
    \ in PHP 5 versus PHP 7. In all these cases, the code is not re-written. Instead,\
    \ an inline comment with the word WARNING is added:\n\n```\n    // changes in\
    \ how $$$$xx interpolation is handled\n    '!(.*)\\$\\$!!' =>\n        function\
    \ ($match) {\n            return '// WARNING: variable interpolation\n       \
    \         ' . ' now occurs left-to-right' . PHP_EOL\n                . '// see:\
    \ http://php.net/manual/en/'\n                . ' migration70.incompatible.php'\n\
    \                . $match[0];\n        },\n    \n    // changes in how the list()\
    \ operator is handled\n    '!(.*?)list\\(*?\\)(!!' =>\n        function ($match)\
    \ {\n            return '// WARNING: changes have been made\n                '\
    \ . ' in list() operator handling.'\n                . ' See: http://php.net/manual/en/'\n\
    \                . ' migration70.incompatible.php'\n                . $match[0];\n\
    \        };\n```"
  merge: -1
  img_proc: true
