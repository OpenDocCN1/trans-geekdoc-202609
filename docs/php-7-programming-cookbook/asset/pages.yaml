    \ this to the existing code:\n    $this->currencyCode = $currencyCode ??\n   \
    \     self::FALLBACK_CURRENCY;\n}\n```\n```\n\n> This approach, although obviously\
    \ solid and workable, tends to fall into the category called *halfway measures\
    \ or the easy way out!* This approach would also tend to eliminate full automation\
    \ as the currency code is not available from the HTTP header. As you have probably\
    \ gathered from other recipes in this book, we do not shy away from a more complex\
    \ solution so, as the saying goes, *strap on your seat belts!*\n\n+   2. We will\
    \ first need to establish some sort of lookup mechanism, where, given a country\
    \ code, we can obtain its predominant currency code. For this illustration, we\
    \ will use the Adapter software design pattern. According to this pattern, we\
    \ should be able to create different classes, which could potentially operate\
    \ in entirely different ways, but which produce the same result. Accordingly,\
    \ we need to define the desired result. For this purpose, we introduce a class,\
    \ `Application\\I18n\\IsoCodes`. As you can see, this class has all the pertinent\
    \ properties, along with a sort of universal constructor:\n\n```\n```php\nnamespace\
    \ Application\\I18n;\nclass IsoCodes\n{\n    public $name;\n    public $iso2;\n\
    \    public $iso3;\n    public $iso_numeric;\n    public $iso_3166;\n    public\
    \ $currency_name;\n    public $currency_code;\n    public $currency_number;\n\
    \    public function __construct(array $data)\n{\n```\n```"
