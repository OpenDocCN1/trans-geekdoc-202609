    \ $item) echo $item . ' ';\n    echo PHP_EOL;\n}\n$a = range('A', 'Z');\n$i =\
    \ new ArrayIterator($a);\nshowElements($i);\n```\n\n+   11. Here is a variation\
    \ that produces every other letter by stacking a FilterIterator on top of an ArrayIterator:\n\
    \n```\n$f = new class ($i) extends FilterIterator {\n    public function accept()\n\
