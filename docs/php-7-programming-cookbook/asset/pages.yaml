- pgno: 47
  md: '# # 2

    # Using PHP 7 High Performance Features


    In this chapter we will discuss and understand the syntax differences between
    PHP 5 and PHP 7, featuring the following recipes:


    +   Understanding the abstract syntax tree

    Understanding differences in parsing

    Understanding differences in `foreach()` handling

    Improving performance using PHP 7 enhancements

    Iterating through a massive file

    Uploading a spreadsheet into a database

    Recursive directory iterator


    # ## Introduction


    In this chapter we will move directly into PHP 7, presenting recipes that take
    advantage of new high performance features. First, however, we will present a
    series of smaller recipes that serve to illustrate the differences in how PHP
    7 handles parameter parsing, syntax, a `foreach()` loop, and other enhancements.
    Before we go into depth in this chapter, let’s discuss some basic differences
    between PHP 5 and PHP 7.


    PHP 7 introduced a new layer referred to as the **Abstract Syntax Tree** (AST),
    which effectively decouples the parsing process from the pseudo-compile process.
    Although the new layer has little or no impact on performance, it gives the language
    a new uniformity of syntax, which was not possible previously.'
  merge: -1
  img_proc: true
- pgno: 48
  md: "Another benefit of AST is the process of dereferencing. Dereferencing, simply\
    \ put, refers to the ability to immediately acquire a property from, or run a\
    \ method of, an object, immediately access an array element, and immediately execute\
    \ a callback. In PHP 5 such support was inconsistent and incomplete. To execute\
    \ a callback, for example, often you would first need to assign the callback or\
    \ anonymous function to a variable, and then execute it. In PHP 7 you can execute\
    \ it immediately.\n\n# Understanding the abstract syntax tree\n\nAs a developer,\
    \ it might be of interest for you to be free from certain syntax restrictions\
    \ imposed in PHP 5 and earlier. Aside from the uniformity of the syntax mentioned\
    \ previously, where you'll see the most improvement in syntax is the ability to\
    \ call any return value, which is **callable** by simply appending an extra set\
    \ of parentheses. Also, you'll be able to directly access any array element when\
    \ the return value is an array.\n\n# How to do it...\n\n+   1. Any function or\
    \ method that returns a callback can be immediately executed by simply appending\
    \ parentheses ( ) (with or without parameters). An element can be immediately\
    \ dereferenced from any function or method that returns an array by simply indicating\
    \ the element using square brackets [ ] ;. In the short (but trivial) example\
    \ shown next, the function `test()` returns an array. The array contains six anonymous\
    \ functions. `$a` has a value of `$t`. `$$a` is interpreted as `$test`:\n\n  \
    \  function test() {\n        return [\n            1 => function () { return\
    \ [\n                    1 => function ($a) { return 'Level 1/1:' . ++$a; },\n\
    \                    2 => function ($a) { return 'Level 1/2:' . ++$a; },\n   \
    \            ];},\n            2 => function () { return [\n                 \
    \   1 => function ($a) { return 'Level 2/1:' . ++$a; },\n                    2\
    \ => function ($a) { return 'Level 2/2:' . ++$a; },\n               ];}\n    \
    \    ]; }\n\n    $a = 't';\n    $t = 'test';\n    echo $$a() [1] ( ) [2] (100);"
  merge: -1
  img_proc: true
- pgno: 49
  md: "+   2.  AST allows us to issue the `echo ${a() [1] () [2] (100)}` command.\
    \ This is parsed\nleft-to-right, which executes as follows:\n\n    -   `${a()}`\
    \ interprets as `test()`, which returns an array\n    -   `[1]` references array\
    \ element 1, which returns a callback\n    -   `()` executes this callback, which\
    \ returns an array of two elements\n    -   `[2]` references array element 2,\
    \ which returns a callback\n    -   `(100)` executes this callback, supplying\
    \ a value of 100, which returns Level 1/2:101\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_49_0.png)\n\
    \n+   3.  The following is a more substantive example that takes advantage of\
    \ AST syntax to define a data filtering and validating class. First of all, we\
    \ define the `Application\\\\Web\\\\SecurityClass`. In the constructor, we build\
    \ and define two arrays. The first array consists of filter callbacks. The second\
    \ array has validation callbacks:\n\n```\npublic function __construct()\n{\n \
    \   $this->filter = [\n        'striptags'  => function ($a) { return strip_tags($a);\
    \ },\n        'digits'     => function ($a) { return preg_replace(\n         \
    \              '/[^0-9]/', '', $a); },\n        'alpha'      => function ($a)\
    \ { return preg_replace(\n                       '/[^A-Z]/i', '', $a); }\n   \
    \ ];\n    $this->validate = [\n        'alnum'      => function ($a) { return\
    \ ctype_alnum($a); },\n        'digits'     => function ($a) { return ctype_digit($a);\
    \ },\n        'alpha'      => function ($a) { return ctype_alpha($a); }\n    ];\n\
    }\n```\n\n+   4.  We want to be able to call this functionality in a *developer-friendly*\
    \ manner. Thus, if we want to filter digits, then it would be ideal to run a command\
    \ such as this:\n\n    $security->filterDigits($item);\n\n+   5.  To accomplish\
    \ this we define the magic method `__call()`, which gives us access to non-existent\
    \ methods:\n\n```\npublic function __call($method, $params)\n{\n```"
