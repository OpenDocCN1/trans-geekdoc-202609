- pgno: 519
  md: "# # Writing a simple test\n\nThe primary means of testing PHP code is to use\
    \ **PHPUnit**, which is based on a methodology called **Unit Testing**. The philosophy\
    \ behind unit testing is quite simple: you break down your code into the smallest\
    \ possible logical units. You then test each unit in isolation to confirm that\
    \ it performs as expected. These expectations are codified into a series of **assertions**.\
    \ If all assertions return TRUE, then the unit has passed the test.\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_519_0.png)\n\
    \nIn the case of procedural PHP, a unit is a function. For OOP PHP, the unit is\
    \ a method within a class.\n\n# ## How to do it...\n\n+   1. The first order of\
    \ business is to either install PHPUnit directly onto your development server,\
    \ or download the source code, which is available in the form of a single **phar\
    \ (PHP archive)** file. A quick visit to the official website for PHPUnit ([https://phpunit.de/](https://phpunit.de/))\
    \ lets us download right from the main page.\n\n+   2. It is a best practice,\
    \ however, to use a package manager to both install and maintain PHPUnit. For\
    \ this purpose, we will use a package management program called **Composer**.\
    \ To install Composer, visit the main website, [https://getcomposer.org/](https://getcomposer.org/),\
    \ and follow the instructions on the download page. The current procedure, at\
    \ the time of writing, is as follows. Note that you need to substitute the hash\
    \ of the current version in place of `<hash>`:\n\n```\n```php\nphp -r \"copy('https://getcomposer.org/installer',\n\
    \          'composer-setup.php');\"\nphp -r \"if (hash_file('SHA384', 'composer-setup.php')\n\
    \      === '<hash>') {\n      echo 'Installer verified';\n  } else {\n      echo\
    \ 'Installer corrupt'; unlink('composer-setup.php');\n  } echo PHP_EOL;\"\nphp\
    \ composer-setup.php\nphp -r \"unlink('composer-setup.php');\"\n```\n```\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_519_1.png)\n\
    \n# ### Best practice\n\nThe advantage of using a package management program such\
    \ as Composer is that it will not only install, but can also be used to update\
    \ any external software (such as PHPUnit) used by your application."
  merge: -1
  img_proc: true
- pgno: 520
  md: "+   3.  Next, we use Composer to install PHPUnit. This is accomplished by creating\
    \ a `composer.json` file that contains a series of directives outlining project\
    \ parameters and dependencies. A full description of these directives is beyond\
    \ the scope of this book; however, for the purposes of this recipe, we create\
    \ a minimal set of directives using the key parameter require. You will also note\
    \ that the contents of the file are in **JavaScript Object Notation (JSON)** format:\n\
    \n```\n    {\n        \"require-dev\" : {\n            \"phpunit/phpunit\" : \"\
    *\"\n        }\n    }\n```\n\n+   4.  To perform the installation from the command\
    \ line, we run the following command. The output is shown just after:\n\n```\n\
    \    php composer.phar install\n```\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_520_0.png)\n\
    \n+   5.  PHPUnit and its dependencies are placed in a vendor folder that Composer\
    \ will create if it does not already exist. The primary command to invoke PHPUnit\
    \ is then symbolically linked into the vendor/bin folder. If you place this folder\
    \ in your PATH, all you need do is to run this command, which checks the version\
    \ and incidentally confirms the installation:\n\n```\n    phpunit --version\n\
    ```"
  merge: -1
