- pgno: 523
  md: "+   In our `SimpleClassTest` test class, instead of including the library file,\
    \ we include the file that represents the `Demo` class. We need an instance of\
    \ `Demo` in order to run tests. For this purpose, we use a specially designed\
    \ `setup()` method, which is run before each test. Also, you will note a `teardown()`\
    \ method, which is run immediately after each test:\n\n```\n```\n<?php\nuse PHPUnit\\\
    Framework\\TestCase;\nrequire_once __DIR__ . '/Demo.php';\nclass SimpleClassTest\
    \ extends TestCase\n{\n    protected $demo;\n    public function setup()\n   \
    \ {\n        $this->demo = new Demo();\n    }\n    public function teardown()\n\
    \    {\n        unset($this->demo);\n    }\n    public function testAdd()\n  \
    \  {\n        $this->assertEquals(2, $this->demo->add(1,1));\n    }\n    public\
    \ function testSub()\n    {\n        $this->assertEquals(0, $this->demo->sub(1,1));\n\
    \    }  // etc.\n}\n```\n```\n\n> The reason why `setup()` and `teardown()` are\
    \ run before and after each test is to ensure a fresh test environment. That way,\
    \ the results of one test will not influence the results of another test."
  merge: -1
  img_proc: true
- pgno: 524
  md: "# **Testing database Model classes**\n\n+   1.  When testing a class, such\
    \ as a Model class, that has database access, other considerations come into play.\
    \ The main consideration is that you should run tests against a test database,\
    \ not the real database used in production. A final point is that by using a test\
    \ database, you can populate it in advance with appropriate, controlled data.\
    \ `setup()` and `teardown()` could also be used to add or remove test data.\n\n\
    +   2.  As an example of a class that uses the database, we will define a class\
    \ `VisitorOps`. The new class will include methods to add, remove, and find visitors.\
    \ Note that we’ve also added a method to return the latest SQL statement executed:\n\
    \n```\n```php\n<?php\nrequire __DIR__ . './../Application/Database/Connection.php';\n\
    use Application\\Database\\Connection;\nclass VisitorOps\n{\n\nconst TABLE_NAME\
    \ = 'visitors';\nprotected $connection;\nprotected $sql;\n\npublic function __construct(array\
    \ $config)\n{\n\t$this->connection = new Connection($config);\n}\n\npublic function\
    \ getSql()\n{\n\treturn $this->sql;\n}\n\npublic function findAll()\n{\n\t$sql\
    \ = 'SELECT * FROM ' . self::TABLE_NAME;\n\t$stmt = $this->runSql($sql);\n\twhile\
    \ ($row = $stmt->fetch(PDO::FETCH_ASSOC)) {\n\t\tyield $row;\n\t}\n}\n\npublic\
    \ function findById($id)\n{\n\t$sql = 'SELECT * FROM ' . self::TABLE_NAME;\n\t\
    $sql .= ' WHERE id = ?';\n\t$stmt = $this->runSql($sql, [$id]);\n```\n\n```"
