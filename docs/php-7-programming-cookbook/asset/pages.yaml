    }\n\npublic function __toString()\n{\n    return $this->name;\n}\n```\n```\n\n\
    +   4. In order to associate a subscriber with this publisher, we define `attach()`,\
    \ which is specified in the `SplSubject` interface. We accept an `SplObserver`\
    \ instance as an argument. Note that we need to add entries to both the `$subscribers`\
    \ and `$linked` properties. `$linked` is then sorted by value, represented by\
    \ the priority, using `arsort()`, which sorts in reverse and maintains the key:\n\
    \n```\n```\npublic function attach(SplObserver $subscriber)\n{\n    $this->subscribers[$subscriber->getKey()]\
    \ = $subscriber;\n    $this->linked[$subscriber->getKey()] =\n        $subscriber->getPriority();\n\
    \    arsort($this->linked);\n}\n```\n```\n\n+   5. The interface also requires\
    \ us to define `detach()`, which removes the subscriber from the list:\n\n```\n\
    ```\npublic function detach(SplObserver $subscriber)\n{\n    unset($this->subscribers[$subscriber->getKey()]);\n\
    \    unset($this->linked[$subscriber->getKey()]);\n}\n```\n```\n\n+   6. Also\
