  md: "+   8. When processing authorization, we initialize a few variables, and then\
    \ extract the page requested from the original request URI. If the page parameter\
    \ doesn't exist, we set a 400 code:\n```\npublic function isAuthorized(RequestInterface\
    \ $request)\n{\n    $code = 401;    // unauthorized\n    $text['page'] = $this->pages[$this->default];\n\
    \    $text['authorized'] = FALSE;\n    $page = $request->getUri()->getQueryParams()['page']\n\
    \    ?? FALSE;\n    if ($page === FALSE) {\n        $code = 400;    // bad request\n\
    \    } else {\n        $params = json_decode(\n            $request->getBody()->getContents());\n\
    \        $status = $params->status ?? self::DEFAULT_LEVEL;\n        $level = $params->level\
    \ ?? '*';\n        $allowed = $this->mergeInherited($status, $level);\n    }\n\
    \    if (in_array($page, $allowed)) {\n        $code = 200;    // OK\n       \
    \ $text['authorized'] = TRUE;\n        $text['page'] = $this->pages[$page];\n\
    \    } else {\n        $code = 401;\n    }\n}\n```\n\n9. Otherwise, we decode\
    \ the request body contents, and acquire the status and level. We are then in\
    \ a position to call mergeInherited(), which returns an array of pages accessible\
    \ to this status and level:\n\n+   10. If the requested page is in the $allowed\
    \ array, we set the status code to a happy 200, and return an authorized setting\
    \ along with the web page that corresponds to the page code requested:\n\n11.\
    \ We then return the response, JSON-encoded, and we are done:\n```\n$body = new\
    \ TextStream(json_encode($text));\nreturn (new Response())->withStatus($code)\n\
    ->withBody($body);\n```\n}"
