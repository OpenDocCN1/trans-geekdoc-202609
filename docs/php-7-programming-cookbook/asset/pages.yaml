- pgno: 134
  md: "5. If a class implements multiple interfaces, a **naming collision** occurs\
    \ if method signatures do not match. In this example, there are two interfaces,\
    \ `DateAware` and `TimeAware`. In addition to defining the `setDate()` and `setTime()`\
    \ methods, they both define `setBoth()`. Having duplicate method names is not\
    \ an issue, although it is not considered best practice. The problem lies in the\
    \ fact that the method signatures differ:\n\n```\n```PHP\ninterface DateAware\n\
    {\n    public function setDate($date);\n    public function setBoth(DateTime $dateTime);\n\
    }\n\ninterface TimeAware\n{\n    public function setTime($time);\n    public function\
    \ setBoth($date, $time);\n}\n\nclass DateTimeHandler implements DateAware, TimeAware\n\
    {\n    protected $date;\n    protected $time;\n    public function setDate($date)\n\
    \    {\n        $this->date = $date;\n    }\n    public function setTime($time)\n\
    \    {\n        $this->time = $time;\n    }\n    public function setBoth(DateTime\
    \ $dateTime)\n    {\n        $this->date = $date;\n    }\n}\n```\n```"
