  md: "+   4. We are then in a position to define the constructor, which accepts an\
    \ array of `php.ini` session settings as an argument. We use `ReflectionClass`\
    \ to get a list of class constants, and run the `$options` argument through a\
    \ loop to confirm the setting is allowed. Also note the use of `array_flip()`,\
    \ which flips keys and values, so that the actual values for our class constants\
    \ form the array key, and the name of the class constant becomes the value:\n\n\
    ```\n```php\nprotected $options;\nprotected $allowed;\npublic function __construct(array\
    \ $options)\n{\n    $reflect = new ReflectionClass(get_class($this));\n    $this->allowed\
    \ = $reflect->getConstants();\n    $this->allowed = array_flip($this->allowed);\n\
