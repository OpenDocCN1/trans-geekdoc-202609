    \   $message = __METHOD__ . ' : ' . self::ERROR_UNABLE . PHP_EOL;\n   $message\
    \ .= strip_tags($path) . PHP_EOL;\n   echo $message;\n   exit;\n}\n```\n\n+  \
    \ 3. Next, we decide what to do with the iteration. One possibility is to mimic\
    \ the output of the Linux `ls -l -R` command. Notice that we use the `yield` keyword,\
    \ effectively making this method into a **Generator**, which can then be called\
    \ from the outside. Each object produced by the directory iteration is an `SPL_FileInfo`\
    \ object, which can give us useful information on the file. Here is how this method\
    \ might look:\n\n```\npublic function ls($pattern = NULL)\n{\n   $outerIterator\
    \ = ($pattern\n      ? $this->regex($this->rdi, $pattern)\n      : $this->rdi;\n\
    \   foreach($outerIterator as $obj) {\n      if ($obj->isDir()) {\n         if\
    \ ($obj->getFileName() == '..') {\n            continue;\n         }\n       \
    \  $line = $obj->getPath() . PHP_EOL;\n   } else {\n      $line = sprintf('%4s\
    \ %1d %4s %4s %10d %12s %-40s' . PHP_EOL,\n         substr(sprintf('%o', $obj->getPerms()),\
    \ -4),\n         ($obj->getType() == 'file') ? 1 : 2,\n         $obj->getOwner(),\n\
    \         $obj->getGroup(),\n         $obj->getSize(),\n         date('M d Y H:i',\
    \ $obj->getATime()),\n         $obj->getFileName());\n   }\n   yield $line;\n\
    }\n```"
