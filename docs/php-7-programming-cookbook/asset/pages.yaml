- pgno: 474
  md: "+   6. Implementing the form protection token is actually quite easy! First\
    \ of all, you need to generate the token and store it in the session. We take\
    \ advantage of the new random_bytes() PHP 7 function to generate a truly random\
    \ token, one which will be difficult, if not impossible, for an attacker to match:\n\
    \n```\n```text\nsession_start();\n$token = urlencode(base64_encode((random_bytes(32))));\n\
    $_SESSION['token'] = $token;\n```\n```\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_474_0.png)\n\
    \n> The output of random_bytes() is binary. We use base64_encode() to convert\
    \ it into a usable string. We then further process it using urlencode() so that\
    \ it is properly rendered in an HTML form.\n\n+   7. When we render the form,\
    \ we then present the token as a hidden field:\n\n```\n```html\n<input type=\"\
    hidden\" name=\"token\" value=\"<?= $token ?>\" />\n```\n```\n\n+   8. We then\
    \ copy and alter the chap_12_form_unprotected.php script mentioned previously,\
    \ adding logic to first check to see whether the token matches the one stored\
    \ in the session. Note that we unset the current token to make it invalid for\
    \ future use. We call the new script chap_12_form_protected_with_token.php:\n\n\
    ```\n```php\nif ($_POST['process']) {\n    $sessToken = $_SESSION['token'] ??\
    \ 1;\n    $postToken = $_POST['token'] ?? 2;\n    unset($_SESSION['token']);\n\
    \    if ($sessToken != $postToken) {\n        $_SESSION['message'] = 'ERROR: token\
    \ mismatch';\n    } else {\n        $_SESSION['message'] = 'SUCCESS: form processed';\n\
    \        // continue with form processing\n    }\n}\n```\n```\n\n# How it works...\n\
    \nTo test how an infected web page might launch a CSRF attack, create the following\
    \ files, as shown earlier in the recipe:\n\n+   → chap_12_form_csrf_test_unprotected.html\n\
    \n+   → chap_12_form_unprotected.php"
