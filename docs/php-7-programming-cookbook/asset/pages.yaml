    $filterCol = NULL,

    $filterVal = NULL)

    {

    $linked = new ArrayIterator ();

    $filterVal = trim ($filterVal);

    foreach ($primary as $key => $row) {

    if ($filterCol) {

    if (trim ($row [$filterCol] )) == $filterVal) {

    $linked->offsetSet ($makeLink ($row), $key);'
