- pgno: 181
  md: "```\n                        ->where('email = :email'):getSql();\n        \
    \        $stmt->execute(['email' => $email]);\n                return Customer::arrayToEntity(\n\
    \                        $stmt->fetch(PDO::FETCH_ASSOC), new Customer());\n  \
    \              }\n```\n\n+   10. Now we are ready to define the save() method.\
    \ Rather than distinguish between INSERT and UPDATE, we will architect this method\
    \ to update if the ID already exists, and otherwise do an insert.\n\n+   11. First,\
    \ we define a basic save() method, which accepts a Customer entity as an argument,\
    \ and uses fetchById() to determine if this entry already exists. If it exists,\
    \ we call an doUpdate() update method; otherwise, we call a doInsert() insert\
    \ method:\n\npublic function save(Customer $cust)\n{\n        // check to see\
    \ if customer ID > 0 and exists\n        if ($cust->getId() && $this->fetchById($cust->getId()))\
    \ {\n                return $this->doUpdate($cust);\n        } else {\n      \
    \          return $this->doInsert($cust);\n        }\n}\n\n+   12. Next, we define\
    \ doUpdate(), which pulls Customer entity object properties into an array, builds\
    \ an initial SQL statement, and calls a flush() method, which pushes data to the\
    \ database. We do not want the ID field updated, as it's the primary key. Also\
    \ we need to specify which row to update, which means appending a WHERE clause:\n\
    \nprotected function doUpdate($cust)\n{\n        // get properties in the form\
    \ of an array\n        $values = $cust->entityToArray();\n        // build the\
    \ SQL statement\n        $update = 'UPDATE ' . $cust::TABLE_NAME;\n        $where\
    \ = ' WHERE id = ' . $cust->getId();\n        // unset ID as we want do not want\
    \ this to be updated\n        unset($values['id']);\n        return $this->flush($update,\
    \ $values, $where);\n}"
