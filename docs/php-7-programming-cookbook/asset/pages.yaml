- pgno: 179
  md: "![](img/39390f6d56c5a83b28db083a8bd5185c_179_0.png)\n\nThe danger here, however,\
    \ is that `fetchObject()` actually populates the properties (even if they are\
    \ protected) before the constructor is called! Accordingly, there is a danger\
    \ that the constructor could accidentally overwrite values. If you don’t define\
    \ a constructor, or if you can live with this danger, we’re done. Otherwise, it\
    \ starts to get tougher to properly implement the tie between RDBMS query and\
    \ OOP results.\n\n+   3. Another approach for the `fetchById()` method is to create\
    \ the object instance first, thereby running its constructor, and setting the\
    \ fetch mode to `PDO::FETCH_Into`, as shown in the following example:\n\n```\n\
    public function fetchById($id)\n{\n    $stmt = $this->connection->pdo\n      \
    \  ->prepare(Finder::select('customer')\n        ->where('id = :id')->getSgl());\n\
    \    $stmt->execute(['id' => (int) $id]);\n    $stmt->setFetchMode(PDO::FETCH_Into,\
    \ new Customer());\n    return $stmt->fetch();\n}\n```\n\n+   4. Here again, however,\
    \ we encounter a problem: `fetch()`, unlike `fetchObject()`, is not able to overwrite\
    \ protected properties; the following error message is generated if it tries.\
    \ This means we will either have to define all properties as `public`, or consider\
    \ another approach.\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_179_1.png)"
