- pgno: 521
  md: "# ## Running simple tests\n\n+   1.  For the purposes of this illustration,\
    \ let's assume we have a `chap_13_unit_test_simple.php` file that contains the\
    \ `add()` function:\n\n```\n<php>\nfunction add($a = NULL, $b = NULL)\n{\n   \
    \ return $a + $b;\n}\n```\n\n+   2.  Tests are then written as classes that extend\
    \ `PHPUnit\\Framework\\TestCase`. If you are testing a library of functions, at\
    \ the beginning of the test class, include the file that contains function definitions.\
    \ You would then write methods that start with the word test, usually followed\
    \ by the name of the function you are testing, and possibly some additional CamelCase\
    \ words to further describe the test. For the purposes of this recipe, we will\
    \ define a `SimpleTest` test class:\n\n```\n<php>\nuse PHPUnit\\Framework\\TestCase;\n\
    require_once __DIR__ . '/chap_13_unit_test_simple.php';\nclass SimpleTest extends\
    \ TestCase\n{\n    // testXXX() methods go here\n}\n```\n\n+   3.  Assertions\
    \ form the heart of any set of tests. The **See also** section gives you the documentation\
    \ reference for the complete list of assertions. An assertion is a PHPUnit method\
    \ that compares a known value against a value produced by that which you wish\
    \ to test. An example is `assertEquals()`, which checks to see whether the first\
    \ argument equals the second. The following example tests a method called `add()`\
    \ and confirms **2** is the return value for `add(1,1)`:\n\n```\npublic function\
    \ testAdd()\n{\n    $this->assertEquals(2, add(1,1));\n}\n```\n\n+   4.  You can\
    \ also test to see whether something is *not true*. This example asserts that\
    \ `1 + 1` does not equal **3**:\n\n```\n$this->assertNotEquals(3, add(1,1));\n\
    ```\n\n+   5.  An assertion that is extremely useful when used to test a string\
    \ is `assertRegExp()`. Assume, for this illustration, that we are testing a function\
    \ that produces an HTML table out of a multidimensional array:\n\n```\nfunction\
    \ table(array $a)\n{\n    $table = '<table>';\n```"
  merge: -1
