- pgno: 269
  md: "Using SOAP, in contrast to the process of implementing a REST client or server,\
    \ is quite easy as there is a PHP SOAP extension that provides both capabilities.\n\
    \n![](img/39390f6d56c5a83b28db083a8bd5185c_269_0.png)\n\n> A frequently asked\
    \ question is \"what is the difference between SOAP and REST?\" SOAP uses XML\
    \ internally as its data format. SOAP uses HTTP but only for transport, and otherwise\
    \ has no awareness of other HTTP methods. REST directly operates HTTP, and can\
    \ use anything for data formats, but JSON is preferred. Another key difference\
    \ is that SOAP can operate in conjunction with a WSDL, which makes the service\
    \ self-describing, thus more publicly available. Thus, SOAP services are often\
    \ offered by public institutions such as national health organizations.\n\n# ##\
    \ How to do it...\n\nFor this example, we will make a SOAP request for an existing\
    \ SOAP service offered by the United States National Weather service:\n\n+   1.\
    \  The first consideration is to identify the **WSDL** document. The WSDL is an\
    \ XML document that describes the service:\n\n```\n```php\n$wsdl = 'http://graphical.weather.gov/xml/SOAP_server/'\n\
    \        . 'ndfdXMLserver.php?wsdl';\n```\n```\n\n+   2.  Next, we create a *soap*\
    \ client instance using the WSDL:\n\n```\n```php\n$soap = new SoapClient($wsdl,\
    \ array('trace' => TRUE));\n```\n```\n\n+   3.  We are then free to initialize\
    \ some variables in anticipation of a weather forecast request:\n\n```\n```php\n\
    $units = 'm';\n$params = '';\n$numDays = 7;\n$weather = '';\n$format = '24 hourly';\n\
    $startTime = new DateTime();\n```\n```\n\n+   4.  We can then make a `LatLonListCityNames()`\
    \ SOAP request, identified as an operation in the WSDL, for a list of cities supported\
    \ by the service. The request is returned in XML format, which suggests creating\
    \ a `SimpleXMLElement` instance:\n\n```\n```php\n$xml = new SimpleXMLElement($soap->LatLonListCityNames());\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 270
  md: "5. Unfortunately, the list of cities and their corresponding latitude and longitude\
    \ are in separate XML nodes. Accordingly, we use the array_combine() PHP function\
    \ to create an associative array where latitude/longitude is the key, and the\
    \ city name is the value. We can then later use this to present an HTML SELECT\
    \ drop-down list, using asort() to alphabetize the list:\n\n```\n$cityNames =\
    \ explode('|', $xml->cityNameList);\n$latLonCity = explode(' ', $xml->latLonList);\n\
    $cityLatLon = array_combine($latLonCity, $cityNames);\nasort($cityLatLon);\n```\n\
    \n6. We can then get city data from a web request as follows:\n\n```\n$currentLatLon\
    \ = (isset($_GET['city']) ? strip_tags(\n  urldecode($_GET['city'])) : '' ;\n\
    ```\n\n7. The SOAP call we wish to make is NDFPDgenByDay(). We can determine the\
    \ nature of the parameters supplied to the SOAP server by examining the WSDL:\n\
    \n```\n<message name=\"NDFPDgenByDayRequest\">\n  <part name=\"latitude\" type=\"\
    xsd:decimal\"/>\n  <part name=\"longitude\" type=\"xsd:decimal\"/>\n  <part name=\"\
    startDate\" type=\"xsd:date\"/>\n  <part name=\"numDays\" type=\"xsd:integer\"\
    />\n  <part name=\"Unit\" type=\"xsd:string\"/>\n  <part name=\"format\" type=\"\
    xsd:string\"/>\n</message>\n```\n\n8. If the value of $currentLatLon is set, we\
    \ can process the request. We wrap the request in a try {} catch {} block in case\
    \ any exceptions are thrown:\n\n```\nif ($currentLatLon) {\n  list($lat, $lon)\
    \ = explode(',', $currentLatLon);\n  try {\n    $weather = $soap->NDFPDgenByDay($lat,\
    \ $lon,\n      $startTime->format('Y-m-d'), $numDays, $unit, $format);\n  } catch\
    \ (Exception $e) {\n    $weather = PHP_EOL;\n    $weather .= 'Latitude: ' . $lat\
    \ . ' | Longitude: ' . $lon;\n    $weather .= 'ERROR' . PHP_EOL;\n    $weather\
    \ = $e->getMessage() . PHP_EOL;\n    $weather .= $soap->__getLastResponse() .\
    \ PHP_EOL;\n  }\n?}\n```"
  merge: -1
  img_proc: true
