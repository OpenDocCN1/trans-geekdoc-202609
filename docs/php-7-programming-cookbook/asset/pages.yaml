  md: "# Working with PHP Object-Oriented Programming\n\n# How to do it…\n\n+   1.\
    \  Traits are identified with the keyword trait, and can contain properties and/or\
    \ methods. You may have noticed duplication of code when examining the previous\
    \ recipe featuring the CountryList and CustomerList classes. In this example,\
    \ we will re-factor the two classes, and move the functionality of the list()\
    \ method into a Trait. Notice that the list() method is the same in both classes.\n\
    2.  Traits are used in situations where there is duplication of code between classes.\
    \ Please note, however, that the conventional approach to creating an abstract\
    \ class and extending it might have certain advantages over using traits. Traits\
    \ cannot be used to identify a line of inheritance, whereas abstract parent classes\
    \ can be used for this purpose.\n3.  We will now copy list() into a trait called\
    \ ListTrait:\n```php\ntrait ListTrait\n{\n    public function list()\n    {\n\
    \        $list = [];\n        $sql = sprintf('SELECT $s, $s FROM $s',\n      \
    \                 $this->key, $this->value, $this->table);\n        $stmt = $this->connection->pdo->query($sql);\n\
    \        while ($item = $stmt->fetch(PDO::FETCH_ASSOC)) {\n            $list[$item[$this->key]]\
    \ =\n                $item[$this->value];\n        }\n\n        return $list;\n\
    \    }\n}\n```\n4.  We can then insert the code from ListTrait into a new class,\n\
    CountryListUsingTrait, as shown in the following code snippet. The entire\nlist()\
    \ method can now be removed from this class:\n```php\nclass CountryListUsingTrait\
    \ implements ConnectionAwareInterface\n{\n    use ListTrait;\n\n    protected\
    \ $connection;\n    protected $key = 'iso3';\n    protected $value = 'name';\n\
    \    protected $table = 'iso_country_codes';\n\n    public function setConnection(Connection\
    \ $connection)\n```"
