- pgno: 359
  md: "3. The first code to consider is how to define routing configuration. The obvious\
    \ answer is to construct an array, where each key would point to a regular expression\
    \ against which the URI path would match, and some form of action. An example\
    \ of such configuration is shown in the following code snippet. In this example,\
    \ we have three routes defined: home, page, and the default. The default should\
    \ be last as it will match anything not matched previously. The action is in the\
    \ form of an anonymous function that will be executed if a route match occurs:\n\
    \n```\n```php\n$config = [\n    'home' => [\n        'uri' => '!^/$!',\n     \
    \   'exec' => function ($matches) {\n            include PAGE_DIR . '/page0.php';\
    \ }\n    ],\n    'page' => [\n        'uri' => '!^/(page)/(\\d+)$!',\n       \
    \ 'exec' => function ($matches) {\n            include PAGE_DIR . '/page' . $matches[2]\
    \ . '.php'; }\n    ],\n    Router::DEFAULT_MATCH => [\n        'uri' => '!.+!',\n\
    \        'exec' => function ($matches) {\n            include PAGE_DIR . '/sorry.php';\
    \ }\n    ],\n];\n```\n```\n\n4. Next, we define our Router class. We first define\
    \ constants and properties that will be of use during the process of examining\
    \ and matching a route:\n\n```\n```php\nnamespace Application\\Routing;\nuse InvalidArgumentException;\n\
    use Psr\\Http\\Message\\ServerRequestInterface;\nclass Router\n{\n    const DEFAULT_MATCH\
    \ = 'default';\n    const ERROR_NO_DEF = 'ERROR: must supply a default match';\n\
    \    protected $request;\n    protected $requestUri;\n    protected $uriParts;\n\
    \    protected $docRoot;\n    protected $config;\n    protected $routeMatch;\n\
    ```\n```"
