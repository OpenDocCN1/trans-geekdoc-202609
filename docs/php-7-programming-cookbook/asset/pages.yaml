- pgno: 457
  md: '# 12


    # Improving Web Security


    In this chapter, we will cover the following topics:


    +   - Filtering `$_POST` data

    - Validating `$_POST` data

    - Safeguarding the PHP session

    - Securing forms with a token

    - Building a secure password generator

    - Safeguarding forms with a CAPTCHA

    - Encrypting/decrypting without `mcrypt`


    # Introduction


    In this chapter, we will show you how to set up a simple yet effective mechanism
    for filtering and validating a block of post data. Then, we will cover how to
    protect your PHP sessions from potential session hijacking and other forms of
    attack. The next recipe shows how to protect forms from **Cross Site Request Forgery
    (CSRF)** attacks using a randomly generated token.

    The recipe on password generation shows you how to incorporate PHP 7 true randomization
    to generate secure passwords. We then show you two forms of **CAPTCHA**: one that
    is text based, the other using a distorted image. Finally, there is a recipe that
    covers strong encryption without using the discredited and soon-to-be-deprecated
    `mcrypt` extension.'
  merge: -1
  img_proc: true
- pgno: 458
  md: '# # Filtering $_POST data


    The process of filtering data can encompass any or all of the following:


    +   - Removing unwanted characters (that is, removing `<script>` tags)

    - Performing transformations on the data (that is, converting a quote to `&quot;`)

    - Encrypting or decrypting the data


    Encryption is covered in the last recipe of this chapter. Otherwise, we will present
    a basic mechanism that can be used to filter $_POST data arriving following form
    submission.


    # ## How to do it...


    +   1. First of all, you need to have an awareness of the data that will be present
    in $_POST. Also, perhaps more importantly, you will need to be aware of the restrictions
    imposed by the database table in which the form data will presumably be stored.
    As an example, have a look at the database structure for the `prospects` table:


    | COLUMN | TYPE | NULL | DEFAULT |

    |---|---|---|---|

    | first_name | varchar(128) | No | None | NULL |

    | last_name | varchar(128) | No | None | NULL |

    | address | varchar(256) | Yes | None | NULL |

    | city | varchar(64) | Yes | None | NULL |

    | state_province | varchar(32) | Yes | None | NULL |

    | postal_code | char(16) | No | None | NULL |

    | phone | varchar(16) | No | None | NULL |

    | country | char(2) | No | None | NULL |

    | email | varchar(250) | No | None | NULL |

    | status | char(8) | Yes | None | NULL |

    | budget | decimal(10,2) | Yes | None | NULL |

    | last_updated | datetime | Yes | None | NULL |



    +   2. Once you have completed an analysis of the data to be posted and stored,
    you can determine what type of filtering is to occur, and which PHP functions
    will serve this purpose.


    +   3. As an example, if you need to get rid of leading and trailing white space,
    which is completely possible from user supplied form data, you can use the PHP
    `trim()` function. All of the character data has length limits according to the
    database structure. Accordingly, you might consider using `substr()` to ensure
    the length is not exceeded. If you wanted to remove non-alphabetical characters,
    you might consider using `preg_replace()` with the appropriate pattern.'
  merge: -1
  img_proc: true
- pgno: 459
  md: "+   4.  We can now group the set of desired PHP functions into a single array\
    \ of callbacks. Here is an example based on the filtering needs for the form data\
    \ that will eventually be stored in the *prospets* table:\n\n```\n```php\n$filter\
    \ = [\n    'trim' => function ($item) { return trim($item); },\n    'float' =>\
    \ function ($item) { return (float) $item; },\n    'upper' => function ($item)\
    \ { return strtoupper($item); },\n    'email' => function ($item) {\n        return\
    \ filter_var($item, FILTER_SANITIZE_EMAIL);\n    },\n    'alpha' => function ($item)\
    \ {\n        return preg_replace('/[^A-Za-z]/', '', $item);\n    },\n    'alnum'\
    \ => function ($item) {\n        return preg_replace('/[^0-9A-Za-z ]/', '', $item);\n\
    \    },\n    'length' => function ($item, $length) {\n        return substr($item,\
    \ 0, $length);\n    },\n    'stripTags' => function ($item) { return strip_tags($item);\
    \ },\n];\n```\n```\n\n+   5.  Next, we define an array that matches the field\
    \ names expected in `$POST`. In this array, we specify the key in the `$filter`\
    \ array, along with any parameters. Note the first key, `*`. We will use that\
    \ as a wildcard to be applied to all fields:\n\n```\n```php\n$assignments = [\n\
    \    '*'              => ['trim' => NULL, 'stripTags' => NULL],\n    'first_name'\
    \     => ['length' => 32, 'alnum' => NULL],\n    'last_name'      => ['length'\
    \ => 32, 'alnum' => NULL],\n    'address'        => ['length' => 64, 'alnum' =>\
    \ NULL],\n    'city'           => ['length' => 32],\n    'state_province'=> ['length'\
    \ => 20],\n    'postal_code'    => ['length' => 12, 'alnum' => NULL],\n    'phone'\
    \          => ['length' => 12],\n    'country'        => ['length' => 2, 'alpha'\
    \ => NULL,\n                         'upper' => NULL],\n    'email'          =>\
    \ ['length' => 128, 'email' => NULL],\n    'budget'         => ['float' => NULL],\n\
    ];\n```\n```\n\n+   6.  We then loop through the data set (that is, coming from\
    \ `$POST`) and apply the callbacks in turn. We first run all callbacks assigned\
    \ to the wildcard (`*`) key.\n\n> It is important to implement a wildcard filter\
    \ to avoid redundant settings. In the preceding example, we wish to apply filters\
    \ that represent the PHP functions `strip_tags()` and `trim()` for every item."
  merge: -1
  img_proc: true
- pgno: 460
  md: '+   7. Next, we run through all callbacks assigned to a particular data field.
    When we''re done, all values in $data will be filtered:


    ```

    foreach ($data as $field => $item) {

    foreach ($assignments[''*''] as $key => $option) {

    $item = $filter[$key]($item, $option);

    }

    foreach ($assignments[$field] as $key => $option) {

    $item = $filter[$key]($item, $option);

    }

    }

    ```


    # ## How it works...


    Place the code shown in steps 4 through 6 into a file called chap_12_post_data_filtering_basic.php.
    You will also need to define an array to simulate data that would be present in
