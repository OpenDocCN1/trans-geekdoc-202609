- pgno: 242
  md: "# Building Scalable Websites\n\nYou can use the already existing chap_06_post_data_config_callbacks.php\
    \ and chap_06_post_data_config_messages.php files described in the previous recipes.\
    \ Finally, define a chap_06_tying_filters_to_form.php file that sets up autoloading\
    \ and includes these three configuration files:\n\n```\n```php\n<?php\nrequire\
    \ __DIR__ . '/../Application/Autoload/Loader.php';\nApplication\\Autoload\\Loader::init(__DIR__\
    \ . '../..');\ninclude __DIR__ . '/chap_06_post_data_config_messages.php';\ninclude\
    \ __DIR__ . '/chap_06_post_data_config_callbacks.php';\ninclude __DIR__ . '/chap_06_tying_filters_to_form_definitions.php';\n\
    ?>\n```\n```\n\nNext, you can create instances of the form factory, filter, and\
    \ validator classes:\n\n```\n```php\nuse Application\\Form\\Factory;\nuse Application\\\
    Filter\\{ Validator, Filter };\n$form = Factory::generate($elements);\n$form->setFilter(new\
    \ Filter($Callbacks['filters'],\n    $Assignments['filters']));\n$form->setValidator(new\
    \ Validator($Callbacks['validators'],\n    $Assignments['validators']));\n```\n\
    ```\n\nYou can then check to see if there is any $_POST data. If so, perform validation\
    \ and filtering:\n\n```\n```php\n$message = '';\nif (isset($_POST['submit']))\
    \ {\n    $form->setData($_POST);\n    if ($form->validate()) {\n        $message\
    \ = VALIDATE_SUCCESS;\n    } else {\n        $message = VALIDATE_FAILURE;\n  \
    \  }\n    $form->filter();\n}\n?>\n```\n```\n\nThe view logic is extremely simple:\
    \ just render the form. Any validation messages and values for the various elements\
    \ will be assigned as part of validation and filtering:\n\n```\n```php\n<?= $form->render($form,\
    \ $formConfig); ?>\n```\n```"
  merge: -1
  img_proc: true
