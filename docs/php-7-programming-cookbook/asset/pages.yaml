  md: "Another radically new feature is the ability to **catch** certain types of\
    \ error. This is discussed in greater detail in *Chapter 13, Best Practices, Testing,\
    \ and Debugging*.\n\n# # Developing classes\n\nThe traditional development approach\
    \ is to place the class into its own file. Typically, classes contain logic that\
    \ implements a single purpose. Classes are further broken down into self-contained\
    \ functions which are referred to as **methods**. Variables defined inside classes\
    \ are referred to as **properties**. It is recommended to develop a test class\
    \ at the same time, a topic discussed in more detail in *Chapter 13, Best Practices,\
    \ Testing, and Debugging*.\n\n# ## How to do it...\n\n+   1.  Create a file to\
    \ contain the class definition. For the purposes of autoloading it is recommended\
    \ that the filename match the classname. At the top of the file, before the keyword\
    \ *class*, add a **DocBlock**. You can then define properties and methods. In\
    \ this example, we define a class *Test*. It has a property `$test`, and a method\
    \ `getTest()`:\n\n```\n```php\n<?php\ndeclare(strict_types=1);\n/**\n * This is\
    \ a demonstration class.\n *\n * The purpose of this class is to get and set\n\
    \ * a protected property $test\n */\nclass Test\n{\n\n    protected $test = 'TEST';\n\
    \n    /**\n     * This method returns the current value of $test\n     *\n   \
    \  * @return string $test\n     */\n    public function getTest(): string\n  \
    \  {\n        return $this->test;\n    }\n}\n```\n```"
