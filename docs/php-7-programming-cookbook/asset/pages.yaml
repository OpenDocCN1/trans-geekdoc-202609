    \    protected $destTable;\n    protected $fields;\n    protected $sourceCols;\n\
    \    protected $destCols;\n\n    public function __construct(\n        $sourceTable,\
    \ $destTable, $fields = NULL\n    )\n    {\n        $this->sourceTable = $sourceTable;\n\
    ```"
