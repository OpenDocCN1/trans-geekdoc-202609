- pgno: 85
  md: "# See also\n\nPHP 7.1 introduced a new type hint `iterable` which allows arrays,\
    \ `Iterators` or `Generators` as arguments. See this for more information:\n\n\
    +   - https://wiki.php.net/rfc/iterable\n\nFor a background discussion on the\
    \ rationale behind the implementation of scalar type hinting, have a look at this\
    \ article:\n\n+   - https://wiki.php.net/rfc/scalar_type_hints_v5\n\n# Using return\
    \ value data typing\n\nPHP 7 allows you to specify a data type for the return\
    \ value of a function. Unlike scalar type hinting, however, you don’t need to\
    \ add any special declarations.\n\n# How to do it...\n\n+   1.  This example shows\
    \ you how to assign a data type to a function return value. To assign a return\
    \ data type, first define the function as you would normally. After the closing\
    \ parenthesis, add a space, followed by the data type and a colon:\n\n```\n```\n\
    function returnsString(DateTime $date, $format) : string\n{\n    return $date->format($format);\n\
    }\n```\n```\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_85_0.png)\n\n> PHP 7.1\
    \ introduced a variation on return data typing called **nullable types**. All\
    \ you need to do is to change `string` to `?string`. This allows the function\
    \ to return either `string` or NULL.\n\n+   2.  Anything returned by the function,\
    \ regardless of its data type inside the function, will be converted to the declared\
    \ data type as a return value. Notice, in this example, the values of `$a`, `$b`,\
    \ and `$c` are added together to produce a single sum, which is returned. Normally\
    \ you would expect the return value to be a numeric data type. In this case, however,\
    \ the return data type is declared as `string`, which overrides PHP’s type-juggling\
    \ process:\n\n```\n```\nfunction convertsToString($a, $b, $c) : string\n\n   \
    \ return $a + $b + $c;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 86
  md: "+   3. You can also assign classes as a return data type. In this example,\
    \ we assign a return type of **DateTime**, part of the PHP **DateTime** extension:\n\
    \n```\nfunction makesDateTime($year, $month, $day) : DateTime\n{\n    $date =\
    \ new DateTime();\n    $date->setDate($year, $month, $day);\n    return $date;\n\
    }\n```\n\n+   The **makesDateTime()** function would be a potential candidate\
    \ for scalar type hinting. If **$year**, **$month**, or **$day** are not integers,\
    \ a **Warning** is generated when **setDate()** is called. If you use scalar type\
    \ hinting, and the wrong data types are passed, a **TypeError** is thrown. Although\
    \ it really doesn’t matter whether a warning is generated or a **TypeError** is\
    \ thrown, at least the **TypeError** will cause the errant developer who is misusing\
    \ your code to sit up and take notice!\n\n+   4. If a function has a return data\
    \ type, and you return the wrong data type in your function code, a **TypeError**\
    \ will be thrown at runtime. This function assigns a return type of **DateTime**,\
    \ but returns a string instead. A **TypeError** will be thrown, but not until\
    \ runtime, when the PHP engine detects the discrepancy:\n\n```\nfunction wrongDateTime($year,\
    \ $month, $day) : DateTime\n{\n    return date($year . '-' . $month . '-' . $day);\n\
    }\n```\n\n+   If the return data type class is not one of the built-in PHP classes\
    \ (that is, a class that is part of the SPL), you will need to make sure the class\
    \ has been auto-loaded, or included.\n\n# How it works...\n\nFirst, place the\
    \ functions mentioned previously into a library file called **chap_03_developing_functions_return_types_library.php**.\
    \ This file needs to be included in the **chap_03_developing_functions_return_types.php**\
    \ script that calls these functions:\n\n```\ninclude (__DIR__ . '/chap_03_developing_functions_return_types_library.php');\n\
    ```"
  merge: -1
  img_proc: true
