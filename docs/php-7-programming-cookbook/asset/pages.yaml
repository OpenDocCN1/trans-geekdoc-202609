  md: "# **Using anonymous classes as mock objects**\n\n+   1. A nice variation on\
    \ mock objects involves the use of the new PHP 7 anonymous class in place of creating\
    \ a formal class that defines mock functionality. The advantage of using an anonymous\
    \ class is that you can extend an existing class, which makes the object appear\
    \ legitimate. This approach is especially useful if you only need to override\
    \ one or two methods.\n\n+   2. For this illustration, we will modify `VisitorServiceTest.php`\
    \ presented previously, calling it `VisitorServiceTestAnonClass.php`:\n\n```\n\
    <?php\nuse PHPUnit\\Framework\\TestCase;\nrequire_once __DIR__ . '/VisitorService.php';\n\
    require_once __DIR__ . '/VisitorOps.php';\nclass VisitorServiceTestAnonClass extends\
    \ TestCase\n{\n    protected $visitorService;\n    protected $dbConfig = [\n \
    \       'driver'   => 'mysql',\n        'host'     => 'localhost',\n        'dbname'\
    \   => 'php7cookbook_test',\n        'user'     => 'cook',\n        'password'\
    \ => 'book',\n        'errmode'  => PDO::ERRMODE_EXCEPTION,\n    ];\n    protected\
    \ $testData;\n```\n\n+   3. You will notice that in `setup()`, we define an anonymous\
    \ class that extends `VisitorOps`. We only need to override the `findAll()` method:\n\
    \n```\npublic function setup()\n{\n    $data = array();\n    for ($x = 1; $x <=\
    \ 3; $x++) {\n        $data[$x]['id'] = $x;\n        $data[$x]['email'] = $x .\
    \ 'test@unlikelysource.com';\n        $data[$x]['visit_date'] =\n            '2000-0'\
    \ . $x . '-0' . $x . ' 00:00:00';\n        $data[$x]['comments'] = 'TEST ' . $x;\n\
    \        $data[$x]['name'] = 'TEST ' . $x;\n    }\n    \n    $this->testData =\
    \ $data;\n    $this->visitorService =\n        new VisitorService($this->dbConfig);\n\
    \    \n    $ops$Mock =\n        new class ($this->testData) extends VisitorOps\
    \ {\n```"
