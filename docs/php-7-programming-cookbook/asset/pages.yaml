    public function getDestInsert($table)

    {

    $sql = ''INSERT INTO '' . $table . '' '';

    $sql = ''( ''

    .

    implode('','', $this->getDestColumns($table))

    . '') ''

    ;

    $sql = '' VALUES '';

    $sql .= ''('';

    $sql .= implode('': '', $this->getDestColumns($table));

    return trim($sql);

    }

    ```

