- pgno: 576
  md: "# How it works...\n\nFirst of all, go to `https://github.com/php-fig/http-message/tree/master/src`,\
    \ the GitHub repository for the PSR-7 interfaces, and download them. Create a\
    \ directory called `Psr/Http/Message in /path/to/` and place the files there.\
    \ Alternatively, you can visit `https://packagist.org/packages/psr/http-message`\
    \ and install the source code using Composer. (For instructions on how to obtain\
    \ and use Composer, you can visit `https://getcomposer.org/`.)\n\nThen, go ahead\
    \ and define the classes discussed previously, summarized in this table:\n\n|\
    \ Class | Steps discussed in |\n| --- | --- |\n| Application\\MiddleWare\\Constants\
    \ | 2 |\n| Application\\MiddleWare\\Uri | 3 to 16 |\n| Application\\MiddleWare\\\
    Stream | 17 to 22 |\n| Application\\MiddleWare\\TextStream | 23 to 26 |\n| Application\\\
    MiddleWare\\UploadedFile | 27 to 31 |\n\nNext, define a chap_09_middleware_value_objects_uri.php\
    \ calling program that implements autoloading and uses the appropriate classes.\
    \ Please note that if you use Composer, unless otherwise instructed, it will create\
    \ a folder called `vendor`. Composer also adds its own autoloader, which you are\
    \ free to use here:\n\n```\n```\n<?php\nrequire __DIR__ . '/../Application/Autoload/Loader.php';\n\
    Application\\Autoload\\Loader::init(__DIR__ . '/..');\nuse Application\\MiddleWare\\\
    Uri;\n```\n```\n\nYou can then create a Uri instance and use the `with` methods\
    \ to add parameters. You can then echo the `Uri` instance directly as `__toString()`\
    \ is defined:\n\n```\n```\n$uri = new Uri();\n$uri->withScheme('https')\n    ->withHost('localhost')\n\
    \    ->withPort('8080')\n    ->withPath('chap_09_middleware_value_objects_uri.php')\n\
    \    ->withQuery('param=TEST');\n\necho $uri;\n```\n```"
