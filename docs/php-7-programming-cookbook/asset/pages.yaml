- pgno: 268
  md: '# Accessing Web Services


    To test your API, use the `Application\Web\Rest\AbstractApi::generateToken()`
    method to generate an authentication token that you can place in an `api_key.php`
    file, something like this:


    ```

    <?php return ''79e9b5211bbf2458a4085707ea378129'';

    ```


    You can then use a generic API client (such as the one described in the previous
    recipe), or a browser plugin such as RESTClient by Chao Zhou (see `http://restclient.net/`
    for more information) to generate sample requests. Make sure you include the token
    for your request, otherwise the API as defined will reject the request.


    Here is an example of a POST request for `ID 1`, which sets the `balance` field
    to a value of `888888`:


    ![](img/39390f6d56c5a83b28db083a8bd5185c_268_0.png)


    # There''s more...


    There are a number of libraries that help you implement a REST server. One of
    my favorites is an example implementing a REST server in a single file: `https://www.leaseweb.com/labs/2015/10/creating-a-simple-rest-api-in-php/`


    Various frameworks, such as CodeIgniter and Zend Framework, also have REST server
    implementations.'
