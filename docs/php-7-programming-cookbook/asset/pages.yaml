    $sql = ''SELECT ''

    .

    implode('','', $this->getSourceColumns()) . '' '';

    $sql = ''FROM '' . $this->getSourceTable() . '' '';

    if ($where) {

    $where = trim($where);

    if (stripos($where, ''WHERE'') !== FALSE) {

    $sql .= $where;

    } else {

    $sql .= ''WHERE '' . $where;

    }

    }

    return trim($sql);

    }

