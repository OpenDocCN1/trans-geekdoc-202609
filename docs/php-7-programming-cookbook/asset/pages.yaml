- pgno: 186
  md: "# # Embedding secondary lookups into query results\n\nOn the road towards implementing\
    \ relationships between entity classes, let us first take a look at how we can\
    \ embed the code needed to perform a secondary lookup. An example of such a lookup\
    \ is when displaying information on a customer, have the view logic perform a\
    \ second lookup that gets a list of purchases for that customer.\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_186_0.png)\n\
    \n# ## How to do it...\n\n+   1.  First of all, define a function that finds a\
    \ customer based on their ID. For the purposes of this illustration, we will simply\
    \ fetch an array using the fetch mode PDO::FETCH_ ASSOC. We will also continue\
    \ to use the Application\\Database\\Connection class discussed in Chapter 1, Building\
    \ a Foundation:\n\n```\n```python\nfunction findCustomerById($id, Connection $conn)\n\
    {\n    $stmt = $conn->pdo->query(\n        'SELECT * FROM customer WHERE id =\
    \ ' . (int) $id);\n    $results = $stmt->fetch(PDO::FETCH_ASSOC);\n    return\
    \ $results;\n}\n```\n```\n\n+   2.  Next, we analyze the purchases table to see\
    \ how the customer and product tables are linked. As you can see from the CREATE\
    \ statement for this table, the customer_ id and product_id foreign keys form\
    \ the relationships:\n\n```\n```sql\nCREATE TABLE 'purchases' (\n    'id' int(11)\
    \ NOT NULL AUTO_INCREMENT,\n    'transaction' varchar(8) NOT NULL,\n    'date'\
    \ datetime NOT NULL,\n    'quantity' int(10) unsigned NOT NULL,\n    'sale_price'\
    \ decimal(8,2) NOT NULL,\n    'customer_id' int(11) DEFAULT NULL,\n    'product_id'\
    \ int(11) DEFAULT NULL,\n    PRIMARY KEY ('id'),\n```\n```"
  merge: -1
  img_proc: true
- pgno: 187
  md: "```\nKEY 'IDX_C3F3' ('customer_id'),\nKEY 'IDX_665A' ('product_id'),\nCONSTRAINT\
    \ 'FK_665A' FOREIGN KEY ('product_id')\n  REFERENCES 'products' ('id'),\nCONSTRAINT\
    \ 'FK_C3F3' FOREIGN KEY ('customer_id')\n  REFERENCES 'customer' ('id')\n);\n\
    ```\n\n+   3. We now expand the original findCustomerId() function, defining the\
    \ secondary lookup in the form of an anonynous function, which can then be executed\
    \ in a view script. The anonymous function is assigned to the $results[''purchases'']\
    \ element:\n\n```\nfunction findCustomerId($id, Connection $conn)\n{\n    $stmt\
    \ = $conn->pdo->query(\n        'SELECT * FROM customer WHERE id = ' . (int) $id);\n\
    \    $results = $stmt->fetch(PDO::FETCH_ASSOC);\n    if ($results) {\n       \
    \ $results[''purchases''] =\n            // define secondary lookup\n        \
    \    function ($id, $conn) {\n                $sql = 'SELECT * FROM purchases\
    \ AS u '\n                    . 'JOIN products AS r '\n                    . 'ON\
    \ u.product_id = r.id '\n                    . 'WHERE u.customer_id = :id '\n\
    \                    . 'ORDER BY u.date';\n                $stmt = $conn->pdo->prepare($sql);\n\
    \                $stmt->execute([''id'' => $id]);\n                while ($row\
    \ = $stmt->fetch(PDO::FETCH_ASSOC)) {\n                    yield $row;\n     \
    \           }\n            };\n    }\n    return $results;\n}\n```\n\n+   4. Assuming\
    \ we have successfully retrieved customer information into a $results array, in\
    \ the view logic, all we need to do is to loop through the return value of the\
    \ anonymous function. In this example, we retrieve customer information at random:\n\
    \n```\n$result = findCustomerId(rand(1, 79), $conn);\n```"
  merge: -1
  img_proc: true
- pgno: 188
  md: "+   5.  In the view logic, we loop through the results returned by the secondary\
    \ lookup.\n    The call to the embedded anonymous function is highlighted in the\
    \ following code:\n\n```\n<table>\n  <tr>\n    <th>Transaction</th><th>Date</th><th>Qty</th>\n\
    \    <th>Price</th><th>Product</th>\n  </tr>\n<?php\n  foreach ($result['purchases'][$result['id'],\
    \ $conn) as $purchase) :\n  ?>\n    <tr>\n      <td><?= $purchase['transaction']\
    \ ?></td>\n      <td><?= $purchase['date'] ?></td>\n      <td><?= $purchase['quantity']\
    \ ?></td>\n      <td><?= $purchase['sale_price'] ?></td>\n      <td><?= $purchase['title']\
    \ ?></td>\n    </tr>\n<?php endforeach; ?>\n</table>\n```\n\n# How it works...\n\
    \nCreate a chap_05_secondary_lookups.php calling program and insert the code needed\
    \ to create an instance of Application\\Database\\Connection:\n\n```\n<?php\n\
    define('DB_CONFIG_FILE', './../config/db.config.php');\ninclude __DIR__ . './../Application\\\
    Database\\Connection.php';\nuse Application\\Database\\Connection;\n$conn = new\
    \ Connection(include __DIR__ . DB_CONFIG_FILE);\n```\n\nNext, add the findCustomerById()\
    \ function shown in step 3. You can then pull information for a random customer,\
    \ ending the PHP part of the calling program:\n\n```\nfunction findCustomerById($id,\
    \ Connection $conn)\n{\n  // code shown in bullet #3 above\n}\n$result = findCustomerById(rand(1,79),\
    \ $conn);\n?>\n```"
