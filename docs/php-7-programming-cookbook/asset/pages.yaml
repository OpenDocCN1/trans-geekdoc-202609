- pgno: 81
  md: "# Hinting at data types\n\nIn many cases when developing functions, you might\
    \ reuse the same library of functions in other projects. Also, if you work with\
    \ a team, your code might be used by other developers. In order to control the\
    \ use of your code, it might be appropriate to make use of a **type hint**. This\
    \ involves specifying the data type your function expects for that particular\
    \ parameter.\n\n# How to do it...\n\n+   1. Parameters in functions can be prefixed\
    \ by a type hint. The following type hints are available in both PHP 5 and PHP\
    \ 7:\n\n* Array\n* Class\n* Callable\n\n+   2. If a call to the function is made,\
    \ and the wrong parameter type is passed, a TypeError is thrown. The following\
    \ example requires an array, an instance of DateTime, and an anonymous function:\n\
    \n```\nfunction someTypeHint(Array $a, DateTime $t, Callable $c)\n{\n    $message\
    \ = '';\n    $message .= 'Array Count: ' . count($a) . PHP_EOL;\n    $message\
    \ .= 'Date: ' . $t->format('Y-m-d') . PHP_EOL;\n    $message .= 'Callable Return:\
    \ ' . $c() . PHP_EOL;\n    return $message;\n}\n```\n\n> You don't have to provide\
    \ a type hint for every single parameter. Use this technique only where supplying\
    \ a different data type would have a negative effect on the processing of your\
    \ function. As an example, if your function uses a `foreach()` loop, if you do\
    \ not supply an array, or something which implements Traversable, an error will\
    \ be generated.\n\n+   3. In PHP 7, presuming the appropriate declare() directive\
    \ is made, **scalar** (that is, integer, float, boolean, and string) type hints\
    \ are allowed. Another function demonstrates how this is accomplished. At the\
    \ top of the code library file which contains the function in which you wish to\
    \ use scalar type hinting, add this declare() directive just after the opening\
    \ PHP tag:\n\n```\ndeclare(strict_types=1);\n```"
  merge: -1
  img_proc: true
- pgno: 82
  md: "+   Now you can define a function that includes scalar type hints:\n\n```\n\
    function someScalarHint (bool $b, int $i, float $f, string $s) {\n    return sprintf\
    \ (\"\\n%20s : %5s\\n%20s : %5d\\n%20s \" .\n                    \": %5.2f\\n%20s\
    \ : %20s\\n\\n\",\n                    'Boolean', ($b ? 'TRUE' : 'FALSE') ,\n\
    \                    'Integer' , $i,\n                    'Float' , $f,\n    \
    \                'String', $s);\n}\n```\n\n+   In PHP 7, assuming strict type\
    \ hinting has been declared, boolean type hinting works a bit differently from\
    \ the other three scalar types (that is, integer, float, and string). You can\
    \ supply any scalar as an argument and no TypeError will be thrown! However, the\
    \ incoming value will automatically be converted to the boolean data type once\
    \ passed into the function. If you pass any data type other than scalar (that\
    \ is, array or object) a TypeError will be thrown. Here is an example of a function\
    \ that defines a boolean data type. Note that the return value will be automatically\
    \ converted to a boolean:\n\n```\nfunction someBoolHint (bool $b)\n{\n    return\
    \ $b;\n}\n```\n\n# How it works...\n\nFirst of all, you can place the three functions,\
    \ someTypeHint(), someScalarHint(), and someBoolHint(), into a separate file to\
    \ be included. For this example, we will name the file chap_03_developing_functions_type_hints_library.php.\
    \ Don't forget to add declare(strict_types=1) at the top!\n\nIn our calling code,\
    \ you would then include the file:\n\n```\ninclude (__DIR__ . DIRECTORY_SEPARATOR\
    \ . 'chap_03_developing_\nfunctions_type_hints_library.php');\n```\n\nTo test\
    \ someTypeHint(), call the function twice, once with the correct data types, and\
    \ the second time with incorrect types. This will throw a TypeError, however,\
    \ so you will need to wrap the function calls in a try { ... } catch ( ) { ...\
    \ } block:\n\n```\ntry {\n    $callable = function () { return 'Callback Return';\
    \ };\n    echo someTypeHint ([1,2,3], new DateTime(), $callable);\n    echo someTypeHint\
    \ ('A', 'B', 'C');\n```"
  merge: -1
  img_proc: true
- pgno: 83
  md: "```\n```text\n} catch (TypeError $e) {\n    echo $e->getMessage();\n    echo\
    \ PHP_EOL;\n}\n```\n```\n\nAs you can see from the output shown at the end of\
    \ this sub-section, when passing the correct data types there is no problem. When\
    \ passing the incorrect types, a `TypeError` is thrown.\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_83_0.png)\n\
    \n> In PHP 7, certain errors have been converted into an `Error` class, which\
    \ is processed in a somewhat similar manner to an `Exception`. This means you\
    \ can catch an `Error`. `TypeError` is a specific descendant of `Error` that is\
    \ thrown when incorrect data types are passed to functions. All PHP 7 `Error`\
    \ classes implement the `Throwable` interface, as does the `Exception` class.\
    \ If you are not sure if you need to catch an `Error` or an `Exception`, you can\
    \ add a block which catches `Throwable`.\n\nNext you can test `someScalarHint()`,\
    \ calling it twice with correct and incorrect values, wrapping the calls in a\
    \ `try { ... } catch () { ... }` block:\n\n```\n```php\ntry {\n    echo someScalarHint(TRUE,\
    \ 11, 22.22, 'This is a string');\n    echo someScalarHint('A', 'B', 'C', 'D');\n\
    } catch (TypeError $e) {\n    echo $e->getMessage();\n}\n```\n```\n\nAs expected,\
    \ the first call to the function works, and the second throws a `TypeError`.\n\
    \nWhen type hinting for boolean values, any scalar value passed will not cause\
    \ a `TypeError` to be thrown! Instead, the value will be interpreted into its\
    \ boolean equivalent. If you subsequently return this value, the data type will\
    \ be changed to boolean.\n\nTo test this, call the `someBoolHint()` function defined\
    \ previously, and pass any scalar value in as an argument. The `var_dump()` method\
    \ reveals that the data type is always boolean:\n\n```\n```php\ntry {\n    //\
    \ positive results\n    $b = someBooleanHint(TRUE);\n    $i = someBooleanHint(11);\n\
    \    $f = someBooleanHint(22.22);\n    $s = someBooleanHint('X');\n    var_dump($b,\
    \ $i, $f, $s);\n    // negative results\n    $b = someBooleanHint(FALSE);\n  \
    \  $i = someBooleanHint(0);\n```\n```"
  merge: -1
