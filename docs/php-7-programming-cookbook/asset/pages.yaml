  md: "# See also\n\nFor a good discussion on the difference between SOAP and REST,\
    \ refer to the article present at http://stackoverflow.com/questions/209905/representational-state-transfer-rest-and-simple-object-access-protocol-soap?lq=1.\n\
    \n# Creating a simple SOAP server\n\nAs with the SOAP client, we can use the PHP\
    \ SOAP extension to implement a SOAP server. The most difficult part of the implementation\
    \ will be generating the WSDL from the API class. We do not cover that process\
    \ here as there are a number of good WSDL generators available.\n\n# How to do\
    \ it...\n\n+   1.  First, you need an API that will be handled by the SOAP server.\
    \ For this example, we define an Application\\Web\\Soap\\ProspectsApi class that\
    \ allows us to create, read, update, and delete the prospects table:\n\n```\n\
    ```\nnamespace Application\\Web\\Soap;\nuse PDO;\nclass ProspectsApi\n{\n    protected\
    \ $registerKeys;\n    protected $pdo;\n\n    public function __construct($pdo,\
    \ $registeredKeys)\n    {\n        $this->pdo = $pdo;\n        $this->registeredKeys\
    \ = $registeredKeys;\n    }\n}\n```\n```\n\n+   2.  We then define methods that\
    \ correspond to create, read, update, and delete. In this example, the methods\
    \ are named put(), get(), post(), and delete(). These, in turn, call methods that\
    \ generate SQL requests that are executed from a PDO instance. An example for\
    \ get() is as follows:\n\n```\n```\npublic function get(array $request, array\
    \ $response)\n{\n    if (!($this->authenticate($request))) return FALSE;\n   \
    \ $result = array();\n    $id = $request[self::ID_FIELD] ?? 0;\n    $email = $request[self::EMAIL_FIELD]\
    \ ?? 0;\n    if ($id > 0) {\n        $result = $this->fetchById($id);\n```\n```"
