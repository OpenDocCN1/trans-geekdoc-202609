  md: '# # 7

    # Accessing Web Services


    In this chapter, we will cover the following topics:


    +   - Converting between PHP and XML

    - Creating a simple REST client

    - Creating a simple REST server

    - Creating a simple SOAP client

    - Creating a simple SOAP server


    # ## Introduction


    Making background queries to external web services is becoming an ever-increasing
    part of any PHP web practice. The ability to provide appropriate, timely, and
    plentiful data means more business for your customers and the websites you develop.
    We start with a couple of recipes aimed at data conversion between **eXtensible
    Markup Language (XML)** and native PHP. Next, we show you how to implement a simple
    **Representational State Transfer (REST)** client and server. After that, we turn
    our attention to **SOAP** clients and servers.


    # ## Converting between PHP and XML


    When considering a conversion between PHP native data types and XML, we would
    normally consider an array as the primary target. With this in mind, the process
    of converting from a PHP array to XML differs radically from the approach needed
    to do the reverse.'
