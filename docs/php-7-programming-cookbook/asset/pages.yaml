    # # Defining entities to match database tables\n\nA very common practice among\
    \ PHP developers is to create classes that represent database tables. Such classes\
    \ are often referred to as **entity** classes, and form the core of the **domain\
    \ model** software design pattern.\n\n# ## How to do it...\n\n+   1. First of\
    \ all, we will establish some common features of a series of entity classes.\n\
