  md: "# **Best practice**\n\nIt is a best practice to protect your sessions. An easy\
    \ way to help protect a session is to use session_regenerate_id(), which invalidates\
    \ the existing PHP session identifier and generates a new one. Thus, if an attacker\
    \ were to obtain the session identifier through illegal means, the window of time\
    \ in which any given session identifier is valid is kept to a minimum.\n\nYou\
    \ can now pull in the ACL configuration, and create instances for Authenticate\
    \ as well as Acl:\n\n```\n$config = require __DIR__ . '/../chap_09_middleware_acl_config.php';\n\
    $acl    = new Acl($config);\n$conn   = new Connection(include DB_CONFIG_FILE);\n\
    $dbAuth = new DbTable($conn, DB_TABLE);\n$auth   = new Authenticate($dbAuth, SESSION_KEY);\n\
    ```\n\nNext, define incoming and outbound request instances:\n\n```\n$incoming\
    \ = new ServerRequest();\n$incoming->initialize();\n$outbound = new Request();\n\
    ```\n\nIf the incoming request method was post, process the authentication calling\
    \ the login() method:\n\n```\nif (strtolower($incoming->getMethod()) == Constants::METHOD_POST)\
    \ {\n    $body    = new TextStream(json_encode(\n            $incoming->getParsedBody()));\n\
    \    $response = $auth->login($outbound->withBody($body));\n}\n```\n\nIf the session\
    \ key defined for authentication is populated, that means the user has been successfully\
    \ authenticated. If not, we program an anonymous function, called later, which\
    \ includes the authentication login page:\n\n```\n$info = $_SESSION[SESSION_KEY]\
    \ ?? FALSE;\nif (!$info) {\n    $execute = function () use ($auth) {\n       \
    \ include PAGE_DIR . '/auth.php';\n    };\n}\n```\n\nOtherwise, you can proceed\
    \ with the ACL check. You first need to find, from the original query, which web\
    \ page the user wants to visit, however:\n\n```\n} else {\n    $query = $incoming->getServerParams()['QUERY_STRING']\
    \ ?? '';\n```"
