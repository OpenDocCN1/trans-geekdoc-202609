    # See also


    For an excellent overview of website vulnerabilities, please refer to the article
    present at `https://www.owasp.org/index.php/Category:Vulnerability`. For information
    on session hijacking, refer to `https://www.owasp.org/index.php/Session_hijacking_attack`.


    # Securing forms with a token


    This recipe presents another very simple technique that will safeguard your forms
    against **Cross Site Request Forgery (CSRF)** attacks. Simply put, a CSRF attack
    is possible when, possibly using other techniques, an attacker is able to infect
    a web page on your website. In most cases, the infected page will then start issuing
    requests (that is, using JavaScript to purchase items, or make settings changes)
    using the credentials of a valid, logged-in user. It’s extremely difficult for
    your application to detect such activity. One measure that can easily be taken
    is to generate a random token that is included in every form to be submitted.
    Since the infected page will not have access to the token, nor have the ability
    to generate one that matches, form validation will fail.'
  merge: -1
  img_proc: true
