    \n+   9.  It is considered a best practice to define the properties as *protected*.\
    \ In order to access these properties, you will need to design *public* methods\
    \ that **get** and **set** the properties. Here is a good place to put to use\
    \ the PHP 7 ability to data-type to the return value.\n\n+   10. In the following\
    \ block of code, we have defined getters and setters for $name and $balance. You\
    \ can imagine how the remainder of these methods will be defined:\n\n```\npublic\
    \ function getName() : string\n{\n    return $this->name;\n}\n\npublic function\
    \ setName($name)\n{\n    $this->name = $name;\n}\n\npublic function getBalance()\
    \ : float\n{\n    return $this->balance;\n}\n\npublic function setBalance($balance)\n\
    {\n    $this->balance = (float) $balance;\n}\n```\n\n> It is not a good idea to\
    \ data type check the incoming values on the setters. The reason is that the return\
    \ values from a RDBMS database query will all be a *string* data type.\n\n+  \
    \ 11. If the property names do not exactly match the corresponding database column,\
    \ you should consider creating a mapping property, an array of key/value pairs\
    \ where the key represents the database column name and the value the property\
