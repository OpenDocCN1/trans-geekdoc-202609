  md: '2. Next we scan the list of `php.ini` session directives (documented at `http://php.net/manual/en/session.configuration.php`).
    We are specifically looking for directives that, in the `Changeable` column, are
    marked `PHP_INI_ALL`. Such directives can be overridden at runtime, and are thus
    available as arguments to `session_start()`:


    ![](img/39390f6d56c5a83b28db083a8bd5185c_554_0.png)


    3. We then define these as class constants, which will make this class more usable
    for development purposes. Most decent code editors will be able to scan the class
    and give you a list of constants, making it easy to manage session settings. Please
    note that not all settings are shown, in order to conserve space in the book:


    ```

    const SESS_OP_NAME            = ''name'';

    const SESS_OP_LAZY_WRITE      = ''lazy_write''; // AVAILABLE

    // SINCE PHP 7.0.0.

    const SESS_OP_SAVE_PATH       = ''save_path'';

    const SESS_OP_SAVE_HANDLER    = ''save_handler'';

