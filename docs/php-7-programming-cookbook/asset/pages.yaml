  md: "6. To initialize $startDate, we call stringOrDate(). We then attempt to generate\
    \ a value for $endDate by calling either stringOrDate() or calcEndDateFromOccurrences().\
    \ If we have neither an end date nor a number of occurrences, an exception is\
    \ thrown:\n\n```\n$this->startDate = $this->stringOrDate($startDate);\nif ($endDate)\
    \ {\n    $this->endDate = $this->stringOrDate($endDate);\n} elseif ($occurrences)\
    \ {\n    $this->endDate = $this->calcEndDateFromOccurrences();\n} else {\n   \
    \ throw new InvalidArgumentException(self::ERROR_INVALID_END);\n}\n$this->nextDate\
    \ = $this->startDate;\n```\n\n7. The stringOrDate() method consists of a few lines\
    \ of code that check the data type of the date variable, and return a DateTime\
    \ instance or NULL:\n\n```\nprotected function stringOrDate($date)\n{\n    if\
    \ ($date === NULL) {\n        $newDate = NULL;\n    } elseif ($date instanceof\
    \ DateTime) {\n        $newDate = $date;\n    } elseif (is_string($date)) {\n\
    \        $newDate = new DateTime($date);\n    } else {\n        throw new InvalidArgumentException(self::ERROR_INVALID_END);\n\
    \    }\n    return $newDate;\n}\n```\n\n8. We call the calcEndDateFromOccurrences()\
    \ method from the constructor if $occurrences is set so that we'll know the end\
    \ date for this event. We take advantage of the DatePeriod class, which provides\
    \ an iteration based on a start date, DateInterval, and number of occurrences:\n\
    \n```\nprotected function calcEndDateFromOccurrences()\n{\n    $endDate = new\
    \ DateTime('now');\n    $period = new DatePeriod(\n        $this->startDate, $this->interval,\
    \ $this->occurrences);\n    foreach ($period as $date) {\n        $endDate = $date;\n\
    \    }\n    return $endDate;\n}\n```"
