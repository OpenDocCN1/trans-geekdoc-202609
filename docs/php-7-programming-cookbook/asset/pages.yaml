    \ Here is the page where these lists can be found: http://www.currency-iso.org/en/home/tables/table-al.html.\n\
    \n# # Formatting date/time by locale\n\nThe formatting of date and time varies\
    \ region to region. As a classic example, consider the year **2016**, month April,\
    \ day 15 and a time in the evening. The format preferred by denizens of the United\
    \ States would be 7:23 PM, 4/15/2016, whereas in China you would most likely see\
    \ 2016-04-15 19:23. As mentioned with number and currency formatting, it would\
    \ also be important to display (and parse) dates in a format acceptable to your\
    \ web visitors.\n\n# **How to do it…**\n\n+   1. First of all, we need to modify\
