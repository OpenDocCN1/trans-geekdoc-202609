- pgno: 60
  md: "# ## How it works...\n\nFirst of all, we define a calling program, chap_02_performance\
    \ using_php7_enhancement_call.php, that takes advantage of the autoloading class\
    \ defined in *Chapter 1, Building a Foundation*, to obtain an instance of Application\\\
    Web\\Access:\n\n```\n```php\ndefine('LOG_FILES', '/var/log/apache2/*access*.log');\n\
    require __DIR__ . '/../Application/Autoload/Loader.php';\nApplication\\Autoload\\\
    Loader::init(__DIR__ . '/..');\n```\n```\n\nNext we define the anonymous function,\
    \ which processes one line in the log file. If an IP address is detected, it becomes\
    \ a key in the $frequency array, and the current value for this key is incremented:\n\
    \n```\n```php\n// define functions\n$freq = function ($line) {\n    $ip = $this->getIp($line);\n\
    \    if ($ip) {\n        echo '.';\n        $this->frequency[$ip] =\n        \
    \    (isset($this->frequency[$ip])) ? $this->frequency[$ip] + 1 : 1;\n    }\n\
    };\n```\n```\n\nWe then loop through the iteration of lines in each log file found,\
    \ processing IP addresses:\n\n```\n```php\nforeach (glob(LOG_FILES) as $filename)\
    \ {\n    echo PHP_EOL . $filename . PHP_EOL;\n    // access class\n    $access\
    \ = new Application\\Web\\Access($filename);\n    foreach ($access->fileIteratorByLine()\
    \ as $line) {\n        $freq->call($access, $line);\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
