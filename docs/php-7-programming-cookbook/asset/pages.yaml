- pgno: 503
  md: '# See also


    For an excellent discussion on why the mcrypt extension is being deprecated in
    PHP 7.1, please refer to the article at https://wiki.php.net/rfc/mcrypt-viking-funeral.
    For a good description of block cipher, which forms the basis for the various
    cipher methods, refer to the article present at https://en.wikipedia.org/wiki/Block_cipher.
    For an excellent description of AES, refer to https://en.wikipedia.org/wiki/Advanced_Encryption_Standard.
    A good article that describes encryption operation modes can be seen at https://en.wikipedia.org/wiki/Block_cipher_mode_of_operation.


    ![](img/39390f6d56c5a83b28db083a8bd5185c_503_0.png)


    For some of the newer modes, if the data to be encrypted is less than the block
    size, openssl_decrypt() will return no value. If you pad the data to be at least
    the block size, the problem goes away. Most of the modes implement internal padding
    so this is not an issue. With some of the newer modes (that is, xts) you might
    see this problem. Be sure to conduct tests on short strings of data less than
    eight characters before putting your code into production.'
  merge: -1
