    }\n```\n\n+   In a similar manner, we define a `filter()` method that calls the\
    \ `process()` method of the embedded `Application\\Filter\\Filter` instance. As\
    \ with the `validate()` method described in step 3, we need to check for the existence\
    \ of `$data` and `$filter`. If either is missing, we throw a `RuntimeException`\
    \ with the appropriate message:\n\n```\npublic function filter()\n{\n    if (!$this->data)\n\
    \        throw new RuntimeException(self::DATA_NOT_FOUND);\n\n    if (!$this->filter)\n\
    \        throw new RuntimeException(self::FILTER_NOT_FOUND);\n```\n\n+   We then\
    \ run the `process()` method, which produces an array of `Result` objects where\
    \ the `$item` property represents the end result of the filter chain. We then\
    \ loop through the results, and, if the corresponding `$element` key matches,\
    \ set the `value` attribute to the filtered value. We also add any messages resulting\
    \ from the filtering process. When the form is then re-displayed, all `value`\
    \ attributes will display filtered results:\n\n```\n$this->filter->process($this->data);\n\
    foreach ($this->filter->getResults() as $key => $result) {\n    if (isset($this->elements[$key]))\
    \ {\n        $this->elements[$key]\n            ->setAttribute('value', $result->item);\n\
    \        if (isset($result->messages)\n            && count($result->messages))\
