- pgno: 190
  md: "# **Implementing jQuery DataTables PHP lookups**\n\nAnother approach to secondary\
    \ lookups is to have the frontend generate the request. In this recipe, we will\
    \ make a slight modification to the secondary lookup code presented in the preceding\
    \ recipe, Embedding secondary lookups into QueryResults. In the previous recipe,\
    \ even though the view logic is performing the lookup, all processing is still\
    \ done on the server. When using **jQuery DataTables**, however, the secondary\
    \ lookup is actually performed directly by the client, in the form of an **Asynchronous\
    \ JavaScript and XML (AJAX)** request issued by the browser.\n\n# ## How to do\
    \ it...\n\n+   1. First we need to spin-off the secondary lookup logic (discussed\
    \ in the recipe above) into a separate PHP file. The purpose of this new script\
    \ is to perform the secondary lookup and return a JSON array.\n2. The new script\
    \ we will call chap_05_jquery_datatables_php_lookups_ajax.php. It looks for a\
    \ $_GET parameter, id. Notice that the SELECT statement is very specific as to\
    \ which columns are delivered. You will also note that the fetch mode has been\
    \ changed to PDO::FETCH_NUM. You might also notice that the last line takes the\
    \ results and assigns it to a data key in a JSON-encoded array.\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_190_0.png)\n\
    \n> It is *extremely* important when dealing with zero configuration jQuery DataTables\
    \ to only return the exact number of columns matching the header.\n\n```\n```PHP\n\
    $id = $_GET['id'] ?? 0;\n$sql = 'SELECT u.transaction,u.date,\n        u.quantity,u.sale_price,r.title\
    \ '\n    . 'FROM purchases AS u '\n    . 'JOIN products AS r '\n    . 'ON u.product_id\
    \ = r.id '\n    . 'WHERE u.customer_id = :id';\n$stmt = $conn->pdo->prepare($sql);\n\
    $stmt->execute(['id' => (int) $id]);\n$results = array();\nwhile ($row = $stmt->fetch(PDO::FETCH_NUM))\
    \ {\n    $results[] = $row;\n}\necho json_encode(['data' => $results]);\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 191
