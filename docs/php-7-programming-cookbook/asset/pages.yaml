    | Application\\Captcha\\Phrase | Generating a text CAPTCHA | 1 – 5 |\n| Application\\\
    Captcha\\CaptchaInterface |  | 6 |\n| Application\\Captcha\\Reverse |  | 7 |\n\
    | Application\\Captcha\\Image | Generating an image CAPTCHA | 2 - 13 |"
