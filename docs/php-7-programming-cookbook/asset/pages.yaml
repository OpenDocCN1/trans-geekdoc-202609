- pgno: 483
  md: '# Safeguarding forms with a CAPTCHA


    **CAPTCHA** is actually an acronym for **Completely Automated Public Turing Test
    to Tell Computers and Humans Apart**. The technique is similar to the one presented
    in the preceding recipe, *Securing forms with a token*. The difference is that
    instead of storing the token in a hidden form input field, the token is rendered
    into a graphic that is difficult for an automated attack system to decipher. Also,
    the intent of a CAPTCHA is slightly different from a form token: it is designed
    to confirm that the web visitor is a human being, and not an automated system.


    # How to do it...


    +   1. There are several approaches to CAPTCHA: presenting a question based on
    knowledge only a human would possess, text tricks, and a graphics image that needs
    to be interpreted.


    +   2. The image approach presents web visitors with an image with heavily distorted
    letters and/or numbers. This approach can be complicated, however, in that it
    relies on the GD extension, which may not be available on all servers. The GD
    extension can be difficult to compile, and has heavy dependencies on various libraries
    that must be present on the host server.


    +   3. The text approach is to present a series of letters and/or numbers, and
    give the web visitor a simple instruction such as *please type this backwards*.
    Another variation is to use ASCII "art" to form characters that a human web visitor
    is able to interpret.


    +   4. Finally, you might have a question/answer approach with questions such
    as *The head is attached to the body by what body part*, and have answers such
    as *Arm*, *Leg*, and *Neck*. The downside to this approach is that an automated
    attack system will have a 1 in 3 chance of passing the test.


    # Generating a text CAPTCHA


    +   1. For this illustration, we will start with the text approach, and follow
    with the image approach. In either case, we first need to define a class that
    generates the phrase to be presented (and decoded by the web visitor). For this
    purpose, we define an `Application\Captcha\Phrase` class. We also define properties
    and class constants used in the phrase generation process:


    ```

    namespace Application\\Captcha;\nclass Phrase\n{\n\tconst DEFAULT\_LENGTH\t\t=
    5;\n\tconst DEFAULT\_NUMBERS\t\t= ''0123456789'';\n\tconst DEFAULT\_UPPER\t\t=
    ''ABCDEFGHJKLMNOPQRSTUVWXYZ'' ;\n\tconst DEFAULT\_LOWER\t\t= ''abcdefghijklmnopqrstuvwxyz'';

    ```'
  merge: -1
  img_proc: true
- pgno: 484
  md: "```\nconst DEFAULT_SPECIAL =\n        '!\"\\'#$%&*()_+\\[\\]{}@\\\\^~<,>.?/\\\
    \\';\nconst DEFAULT_SUPPRESS = ['0', 'l'];\n```\n\n```\nprotected $phrase;\nprotected\
    \ $includeNumbers;\nprotected $includeUpper;\nprotected $includeLower;\nprotected\
    \ $includeSpecial;\nprotected $otherChars;\nprotected $suppressChars;\nprotected\
    \ $string;\nprotected $length;\n```\n\n+   2.  The constructor, as you would expect,\
    \ accepts values for the various properties, with defaults assigned so that an\
    \ instance can be created without having to specify any parameters. The $include*\
    \ flags are used to signal which character sets will be present in the base string\
    \ from which the phrase will be generated. For example, if you wish to only have\
    \ numbers, $includeUpper and $includeLower would both be set to FALSE. $otherChars\
    \ is provided for extra flexibility. Finally, $suppressChars represents an array\
    \ of characters that will be removed from the base string. The default removes\
    \ uppercase 0 and lowercase 1:\n\n```\npublic function __construct(\n        $length\
    \ = NULL,\n        $includeNumbers = TRUE,\n        $includeUpper = TRUE,\n  \
    \      $includeLower = TRUE,\n        $includeSpecial = FALSE,\n        $otherChars\
    \ = NULL,\n        array $suppressChars = NULL)\n    {\n        $this->length\
    \ = $length ?? self::DEFAULT_LENGTH;\n        $this->includeNumbers = $includeNumbers;\n\
    \        $this->includeUpper = $includeUpper;\n        $this->includeLower = $includeLower;\n\
    \        $this->includeSpecial = $includeSpecial;\n        $this->otherChars =\
    \ $otherChars;\n        $this->suppressChars = $suppressChars\n              \
    \  ?? self::DEFAULT_SUPPRESS;\n        $this->phrase = $this->generatePhrase();\n\
    \    }\n```"
