    \ process the login as you would have otherwise. For the purposes of this illustration,\
    \ you can simulate a login by using hard-coded values for the username and password:\n\
    \n```\n```php\n} else {\n    if ($_POST['captcha'] == $phrase) {\n        $username\
    \ = 'test';\n        $password = 'password';\n        if ($_POST['user'] == $username\n\
    \                && $_POST['pass'] == $password) {\n            $loggedIn = TRUE;\n\
    \            $_SESSION['user'] = strip_tags($username);\n            $_SESSION['isLoggedIn']\
    \ = TRUE;\n        } else {\n            $message = 'Invalid Login';\n       \
    \ }\n    } else {\n        $message = 'Invalid Captcha';\n    }\n}\n```\n```\n\
    \nYou might also want to add code for a logout option, as described in the Safeguarding\
    \ the PHP session recipe:\n\n```\n```php\n} elseif (isset($_POST['logout'])) {\n\
    \    session_unset();\n    session_destroy();\n    setcookie('PHPSESSID', 0, time()\
    \ - 3600);\n    header('Location: ' . $_SERVER['REQUEST_URI'] );\n    exit;\n\
    }\n```\n```\n\nYou can then run setCaptcha():\n\n```\n```php\nsetCaptcha($phrase,\
    \ $label, $image);\n```\n```\n\nLastly, don't forget the view logic, which, in\
    \ this example, presents a basic login form. Inside the form tag, you'll need\
    \ to add view logic to display the CAPTCHA and label:\n\n```\n```html\n<tr>\n\
    \    <th><?= $label; ?></th>\n    <td><?= $image; ?><input type=\"text\" name=\"\
    captcha\" /></td>\n</tr>\n```\n```"
