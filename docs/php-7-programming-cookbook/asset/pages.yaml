- pgno: 505
  md: '# ## 13


    # ## Best Practices, Testing, and Debugging


    In this chapter, we will cover the following topics:


    +   - Using Traits and Interfaces

    - Universal exception handler

    - Universal error handler

    - Writing a simple test

    - Writing a test suite

    - Generating fake test data

    - Customizing sessions using `session_start` parameters


    # ### Introduction


    In this chapter, we will show you how traits and interfaces work together. Then,
    we turn our attention to the design of a fallback mechanism that will catch errors
    and exceptions in situations where you were not able (or forgot) to define specific
    `try/catch` blocks. We will then venture into the world of unit testing, showing
    you first how to write simple tests, and then how to group those tests together
    into test suites. Next, we define a class that lets you create any amount of generic
    test data. We close the chapter with a discussion of how to easily manage sessions
    using new PHP 7 features.'
  merge: -1
  img_proc: true
- pgno: 506
  md: "# ## Using Traits and Interfaces\n\nIt is considered a best practice to make\
    \ use of interfaces as a means of establishing the classification of a set of\
    \ classes, and to guarantee the existence of certain methods. Traits and Interfaces\
    \ often work together, and are an important aspect of implementation. Whenever\
    \ you have a frequently used interface that defines a method where the code does\
    \ not change (such as a setter or getter), it is useful to also define a Trait\
    \ that contains the actual code implementation.\n\n# ### How to do it...\n\n+\
    \   1. For this example, we will use ConnectionAwareInterface, first presented\
    \ in Chapter 4, Working with PHP Object-Oriented Programming. This interface defines\
    \ a setConnection() method that sets a $connection property. Two classes in the\
    \ Application\\Generic namespace, CountryList and CustomerList, contain redundant\
    \ code, which matches the method defined in the interface.\n\n+   2. Here is what\
    \ CountryList looks like before the change:\n\n```\n```\nclass CountryList\n{\n\
    \    protected $connection;\n    protected $key    = 'iso3';\n    protected $value\
    \  = 'name';\n    protected $table  = 'iso_country_codes';\n\n    public function\
    \ setConnection(Connection $connection)\n    {\n        $this->connection = $connection;\n\
    \    }\n\n    public function list()\n    {\n        $list = [];\n        $sql\
    \ = sprintf('SELECT %s,%s FROM %s', $this->key,\n                $this->value,\
    \ $this->table);\n        $stmt = $this->connection->pdo->query($sql);\n     \
    \   while ($item = $stmt->fetch(PDO::FETCH_ASSOC)) {\n            $list[$item[$this->key]]\
    \ =  $item[$this->value];\n        }\n        return $list;\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 507
  md: "3. We will now move `list()` into a trait called `ListTrait`:\n\n```\ntrait\
    \ ListTrait\n{\n    public function list()\n    {\n        $list = [];\n     \
    \   $sql = sprintf('SELECT %s,%s FROM %s',\n                       $this->key,\
    \ $this->value, $this->table);\n        $stmt = $this->connection->pdo->query($sql);\n\
    \        while ($item = $stmt->fetch(PDO::FETCH_ASSOC)) {\n            $list[$item[$this->key]]\
    \ = $item[$this->value];\n        }\n        return $list;\n    }\n}\n```\n\n\
    4. We can then insert the code from `ListTrait` into a new class, `CountryListUsingTrait`,\
    \ as shown next:\n\n```\nclass CountryListUsingTrait\n{\n    use ListTrait;\n\
    \    protected $connection;\n    protected $key = 'iso3';\n    protected $value\
    \ = 'name';\n    protected $table = 'iso_country_codes';\n    public function\
    \ setConnection(Connection $connection)\n    {\n        $this->connection = $connection;\n\
    \    }\n}\n```\n\n5. Next, we observe that many classes need to set a connection\
    \ instance. Again, this calls for a trait. This time, however, we place the trait\
    \ in the Application\\Database namespace. Here is the new trait:\n\n```\nnamespace\
    \ Application\\Database;\ntrait ConnectionTrait\n{\n    protected $connection;\n\
    \    public function setConnection(Connection $connection)\n    {\n```"
  merge: -1
  img_proc: true
- pgno: 508
  md: "```\n$this->connection = $connection;\n```\n\n+   6. **Traits are often used\
    \ to avoid duplication of code.** It is often the case that you also need to identify\
    \ the class that uses the trait. A good way to do this is to develop an interface\
    \ that matches the trait. In this example, we will define Application\\Database\\\
    ConnectionAwareInterface:\n\n```\nnamespace Application\\Database;\nuse Application\\\
    Database\\Connection;\ninterface ConnectionAwareInterface\n{\n    public function\
    \ setConnection(Connection $connection);\n}\n```\n\n+   7. **And here is the revised\
    \ CountryListUsingTrait class.** Note that as the new trait is affected by its\
    \ location in the namespace, we needed to add a use statement at the top of the\
    \ class. You will also note that we implement ConnectionAwareInterface to identify\
    \ the fact that this class requires the method defined in the trait. Notice that\
    \ we are taking advantage of the new PHP 7 group use syntax:\n\n```\nnamespace\
    \ Application\\Generic;\nuse PDO;\nuse Application\\Database\\ {\n    Connection,\
    \ ConnectionTrait, ConnectionAwareInterface\n};\nclass CountryListUsingTrait implements\
    \ ConnectionAwareInterface\n{\n    use ListTrait;\n    use ConnectionTrait;\n\
    \    protected $key     = 'iso3';\n    protected $value  = 'name';\n    protected\
    \ $table  = 'iso_country_codes';\n}\n```"
  merge: -1
