- pgno: 337
  md: "# How to do it...\n\n+   Probably the most difficult part of the process is\
    \ determining which factors to include in the ACL. For the purposes of illustration,\
    \ let's say that our users are all assigned a level and a status. In this illustration,\
    \ the level is defined as follows:\n\n    'levels' => [0, 'BEG', 'INT', 'ADV']\n\
    \n+   The status could indicate how far they are in the membership signup process.\
    \ For example, a status of 0 could indicate they've initiated the membership signup\
    \ process, but have not yet been confirmed. A status of 1 could indicate their\
    \ e-mail address is confirmed, but they have not paid the monthly fee, and so\
    \ on.\n\n+   Next, we need to define the resources we plan to control. In this\
    \ case, we will assume there is a need to control access to a series of web pages\
    \ on the site. Accordingly, we need to define an array of such resources. In the\
    \ ACL, we can then refer to the key:\n\n    'pages' => [0 => 'sorry', 'logout'\
    \ => 'logout',\n               'login'  => 'auth',\n               1 => 'page1',\
    \ 2 => 'page2', 3 => 'page3',\n               4 => 'page4', 5 => 'page5', 6 =>\
    \ 'page6',\n               7 => 'page7', 8 => 'page8', 9 => 'page9']\n\n+   Finally,\
    \ the most important piece of configuration is to make assignments to pages according\
    \ to level and status. The generic template used in the configuration array might\
    \ look like this:\n\n    status => ['inherits' => <key>, 'pages' => [level =>\n\
    \                [pages allowed], etc.]]\n\n+   Now we are in a position to define\
    \ the Acl class. As before, we use a few classes, and define constants and properties\
    \ appropriate for access control:\n\n    namespace Application\\Acl;\n\n    use\
    \ InvalidArgumentException;\n    use Psr\\Http\\Message\\RequestInterface;\n \
    \   use Application\\MiddleWare\\{ Constants, Response, TextStream };\n\n    class\
    \ Acl\n    {\n        const DEFAULT_STATUS = '';\n        const DEFAULT_LEVEL\
    \ = 0;\n        const DEFAULT_PAGE = 0;\n        const ERROR_ACL = 'ERROR: authorization\
    \ error';\n        const ERROR_APP = 'ERROR: requested page not listed';"
  merge: -1
  img_proc: true
- pgno: 338
  md: "# Developing Middleware\n\n```\nconst ERROR_DEF =\n            'ERROR: must\
    \ assign keys \"levels\", \"pages\" and \"allowed\"';\nprotected $default;\nprotected\
    \ $levels;\nprotected $pages;\nprotected $allowed;\n```\n\n+   6. In the __construct()\
    \ method, we break up the assignments array into $pages, the resources to be controlled,\
    \ $levels, and $allowed, which are the actual assignments. If the array does not\
    \ include one of these three sub-components, an exception is thrown:\n\n```\n\
    public function __construct(array $assignments)\n{\n    $this->default = $assignments['default']\n\
    \                    ?? self::DEFAULT_PAGE;\n    $this->pages   = $assignments['pages']\
    \ ?? FALSE;\n    $this->levels  = $assignments['levels'] ?? FALSE;\n    $this->allowed\
    \ = $assignments['allowed'] ?? FALSE;\n    if (!($this->pages && $this->levels\
    \ && $this->allowed)) {\n        throw new InvalidArgumentException(self::ERROR_DEF);\n\
    \    }\n}\n```\n\n+   7. You may have noticed that we allow inheritance. In $allowed,\
    \ the inherits key can be set to another key within the array. If so, we need\
    \ to merge its values with the values currently under examination. We iterate\
    \ through $allowed in reverse, merging any inherited values each time through\
    \ the loop. This method, incidentally, also only isolates rules that apply to\
    \ a certain status and level:\n\n```\nprotected function mergeInherited($status,\
    \ $level)\n{\n    $allowed = $this->allowed[$status]['pages'][$level]\n      \
    \              ?? array();\n    for ($x = $status; $x > 0; $x--) {\n        $inherits\
    \ = $this->allowed[$x]['inherits'];\n        if ($inherits) {\n            $subArray\
    \ =\n                $this->allowed[$inherits]['pages'][$level]\n            \
    \        ?? array();\n            $allowed = array_merge($allowed, $subArray);\n\
    \        }\n    }\n    return $allowed;\n}\n```"
