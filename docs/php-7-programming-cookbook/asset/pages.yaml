    }\n```\n\n+   3.  For tests that involve a database, it is recommended that you\
    \ use a test database\n    instead of the live production database. Accordingly,\
    \ you will need an extra set\n    of database connection parameters that can be\
    \ used to establish a database\n    connection in the setup() method.\n4.  It's\
    \ possible that you wish to establish a consistent block of sample data. This\
    \ could\n    be inserted into the test database in the setup() method.\n5.  Finally,\
    \ you may wish to reset the test database after each test, which is\n    accomplished\
    \ in the teardown() method."
