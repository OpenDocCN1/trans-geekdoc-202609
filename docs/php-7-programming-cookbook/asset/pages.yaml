- pgno: 396
  md: "```\nprotected $primary;\nprotected $iterations;\npublic function __construct($primary)\n\
    {\n    $this->primary = $primary;\n}\n```\n\n+   2. Next we define a method, binarySearch(),\
    \ which sets up the search infrastructure. The first order of business is to build\
    \ a separate array, $search, where the key is a composite of the columns included\
    \ in the search. We then sort by key:\n\npublic function binarySearch(array $keys,\
    \ $item)\n{\n    $search = array();\n    foreach ($this->primary as $primaryKey\
    \ => $data) {\n        $searchKey = function ($keys, $data) {\n            $key\
    \ = '';\n            foreach ($keys as $k) $key .= $data[$k];\n            return\
    \ $key;\n        };\n        $search[$searchKey($keys, $data)] = $primaryKey;\n\
    \    }\n    ksort($search);\n}\n\n+   3. We then pull out the keys into another\
    \ array, $binary, so that we can perform the binary sort based on numeric keys.\
    \ We then call doBinarySearch(), which results in a key from our intermediary\
    \ array $search, or a Boolean, FALSE:\n\n$binary = array_keys($search);\n$result\
    \ = $this->doBinarySearch($binary, $item);\nreturn $this->primary[$search[$result]]\
    \ ?? FALSE;\n\n+   4. The first doBinarySearch() initializes a series of parameters.\
    \ $iterations, $found, $loop, $done, and $max are all used to prevent an endless\
    \ loop. $upper and $lower represent the slice of the list to be examined:\n\n\
    public function doBinarySearch($binary, $item)\n{\n    $iterations = 0;\n    $found\
    \ = FALSE;\n    $loop = TRUE;\n    $done = -1;\n    $max = count($binary);\n \
    \   $lower = 0;\n    $upper = $max - 1;"
