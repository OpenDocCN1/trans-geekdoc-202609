- pgno: 279
  md: "# # 8  \nWorking with Date/Time and International Aspects\n\nIn this chapter,\
    \ we will cover the following topics:\n\n+   - Using emoticons or emoji in a view\
    \ script\n- Converting complex characters\n- Getting the locale from browser data\n\
    - Formatting numbers by locale\n- Handling currency by locale\n- Formatting date/time\
    \ by locale\n- Creating an HTML international calendar generator\n- Building a\
    \ recurring events generator\n- Handling translation without gettext\n\n# ## Introduction\n\
    \nWe will start this chapter with two recipes that take advantage of a new **Unicode**\
    \ escape syntax introduced with **PHP 7**. After that, we will cover how to determine\
    \ a web visitor’s **locale** from browser data. The next few recipes will cover\
    \ the creation of a locale class, which will allow you to represent numbers, currency,\
    \ dates, and time in a format specific to a locale. Finally, we will cover recipes\
    \ that demonstrate how to generate an internationalized calendar, handle recurring\
    \ events, and perform translation without having to use `gettext`."
  merge: -1
  img_proc: true
- pgno: 280
  md: "# # Using emoticons or emoji in a view script\n\nThe word **emoticons** is\
    \ a composite of *emotion* and *icon*. **Emoji**, originating from Japan, is another,\
    \ larger, widely used set of icons. These icons are the little smiley faces, tiny\
    \ ninjas, and rolling-on-the-floor-laughing icons that are so popular on any website\
    \ that has a social networking aspect. Prior to PHP 7, however, producing these\
    \ little beasties was an exercise in frustration.\n\n# ## How to do it...\n\n\
    +   1.  First and foremost, you need to know the Unicode for the icon you wish\
    \ to present. A quick search on the Internet will direct you to any one of several\
    \ excellent charts.\n    Here are the codes for the three *hear-no-evil*, *see-no-evil*,\
    \ and *speak-no-evil* monkey icons:\n\n    U+1F648, U+1F649, and U+1F64A\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_280_0.png)\n\
    \n+   2.  Any Unicode output to the browser must be properly identified. This\
    \ is most often done by way of a meta tag. You should set the character set to\
    \ UTF-8. Here is an example:\n    <head>\n        <title>PHP 7 Cookbook</title>\n\
    \        <meta http-equiv=\"content-type\"\n        content=\"text/html;charset=utf-8\"\
    \ />\n    </head>\n\n+   3.  The traditional approach was to simply use HTML to\
    \ display the icons. Thus, you could do something like this:\n    <table>\n  \
    \      <tr>\n            <td>&#x1F648;</td>\n            <td>&#x1F649;</td>\n\
    \            <td>&#x1F64A;</td>\n        </tr>\n    </table>"
  merge: -1
  img_proc: true
- pgno: 281
  md: "+   4.  As of PHP 7, you can now construct full Unicode characters using this\
    \ syntax: `\"\\u{xxxx}\"`. Here is an example with the same three icons as in\
    \ the preceding bullet:\n\n```\n`<table>\n    <tr>\n        <td><?php echo \"\\\
    u{1F648}\"; ?> </td>\n        <td><?php echo \"\\u{1F649}\"; ?> </td>\n      \
    \  <td><?php echo \"\\u{1F64A}\"; ?> </td>\n    </tr>\n</table>`\n```\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_281_0.png)\n\
    \n# How it works...\n\nIn PHP 7, a new syntax was introduced that lets you render\
    \ any Unicode character. Unlike other languages, the new PHP syntax allows for\
    \ a variable number of hex digits. The basic format is this:\n\n```\n`\\u{xxxx}`\n\
    ```\n\nThe entire construct must be double quoted (or use **heredoc**). *xxxx*\
    \ could be any combination of hex digits, 2, 4, 6, and above.\n\nCreate a file\
    \ called *chap_08_emoji_using_html.php*. Be sure to include the *meta* tag that\
    \ signals the browser that UTF-8 character encoding is being used:\n\n```\n`<!DOCTYPE\
    \ html>\n<html>\n    <head>\n        <title>PHP 7 Cookbook</title>\n        <meta\
    \ http-equiv=\"Content-type\"\n            content=\"text/html;charset=utf-8\"\
    \ />\n    </head>`\n```\n\nNext, set up a basic HTML table, and display a row\
    \ of emoticons/emoji:\n\n```\n`<body>\n    <table>\n        <tr>\n           \
    \ <td>&#x1F648;</td>\n            <td>&#x1F649;</td>\n            <td>&#x1F64A;</td>`\n\
    ```"
  merge: -1
  img_proc: true
