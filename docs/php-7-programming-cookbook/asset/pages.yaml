  md: "+   We are now in a position to define the Application\\Web\\Rest\\Server class.\
    \ You may be surprised at how simple it is. The real work is done in the associated\
    \ API class:\n\n```\nnamespace Application\\Web\\Rest;\nuse Application\\Web\\\
    { Request, Response, Received };\nclass Server\n{\n    protected $api;\n    public\
    \ function __construct(ApiInterface $api)\n    {\n        $this->api = $api;\n\
    \    }\n}\n```\n\n+   Next, we define a listen() method that serves as a target\
    \ for the request. The heart of the server implementation is this line of code:\n\
    \n```\n$jsonData = json_decode(file_get_contents('php://input'), true);\n```\n\
    \n+   This captures raw input, which is assumed to be in JSON format:\n\n```\n\
    public function listen()\n{\n    $request = new Request();\n    $response = new\
    \ Response($request);\n    $getPost = $_REQUEST ?? array();\n    $jsonData = json_decode(\n\
    \        file_get_contents('php://input'), true);\n    $jsonData = $jsonData ??\
    \ array();\n    $request->setData(array_merge($getPost, $jsonData));\n```\n\n\
    We have also added a provision for authentication. Otherwise, anybody could make\
    \ requests and obtain potentially sensitive data. You will note that we do not\
    \ have the server class performing authentication; rather, we leave it to the\
    \ API class:\n\n```\nif (!$this->api->authenticate($request)) {\n    $response->setStatus(401);\n\
    \    echo $this->api::ERROR;\n    exit;\n}\n```"
  merge: -1
