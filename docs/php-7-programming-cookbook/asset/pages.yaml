- pgno: 119
  md: "```\nreturn self::$test;\n}\n```\n```\n\n+   2. The *self* keyword will bind\
    \ early, which will cause problems when accessing static information in child\
    \ classes. If you absolutely need to access information from the child class,\
    \ use the *static* keyword in place of *self*. This process is referred to as\
    \ **Late Static Binding**.\n\n+   3. In the following example, if you `echo Child::getEarlyTest()`,\
    \ the output will be **TEST**. If, on the other hand, you run `Child::getLateTest()`,\
    \ the output will be **CHILD**. The reason is that PHP will bind to the *earliest*\
    \ definition when using *self*, whereas the *latest* binding is used for the *static*\
    \ keyword:\n\n```\nclass Test2\n{\n    public static $test = 'TEST2';\n    public\
    \ static function getEarlyTest()\n    {\n        return self::$test;\n    }\n\
    \    public static function getLateTest()\n    {\n        return static::$test;\n\
    \    }\n}\n\nclass Child extends Test2\n{\n    public static $test = 'CHILD';\n\
    }\n```\n\n+   4. In many cases, the **Factory** design pattern is used in conjunction\
    \ with static methods to produce instances of objects given different parameters.\
    \ In this example, a static method `factory()` is defined which returns a PDO\
    \ connection:\n\n```\npublic static function factory(\n        $driver, $dbname,\
    \ $host, $user, $pwd, $options = [])\n{\n    $dsn = sprintf('%s:dbname=%s;host=%s',\n\
    \        $driver, $dbname, $host);\n    try {\n        return new PDO($dsn, $user,\
    \ $pwd, $options);\n    } catch (PDOException $e) {\n        error_log($e->getMessage());\n\
    \    }\n}\n```"
