- pgno: 23
  md: '# # 1


    # # Building a Foundation


    In this chapter, we will cover the following topics:


    +   - PHP 7 installation considerations

    - Using the built-in PHP web server

    - Defining a test MySQL database

    - Installing PHPUnit

    - Implementing class autoloading

    - Hovering a website

    - Building a deep web scanner

    - Creating a PHP 5 to PHP 7 code converter


    # ## Introduction


    This chapter is designed as a *quick start* that will get you up and running on
    PHP 7 so that you can start implementing the recipes right away. The underlying
    assumption for this book is that you already have a good knowledge of PHP and
    programming. Although this book will not go into detail about the actual installation
    of PHP, given that PHP 7 is relatively new, we will do our best to point out the
    quirks and *gotchas* you might encounter during a PHP 7 installation.


    # ## PHP 7 installation considerations


    There are three primary means of acquiring PHP 7:


    +   - Downloading and installing directly from the source code

    - Installing *pre-compiled* binaries

    - Installing a *AMP package (that is, XAMPP, WAMP, LAMP, MAMP, and so on)'
  merge: -1
  img_proc: true
- pgno: 24
  md: "# How to do it...\n\nThe three methods are listed in order of difficulty. However,\
    \ the first approach, although tedious, will give you the most finite control\
    \ over extensions and options.\n\n# Installing directly from source\n\nIn order\
    \ to utilize this approach, you will need to have a C compiler available. If you\
    \ are running Windows, **MinGW** is a free compiler that has proven popular. It\
    \ is based on the **GNU Compiler Collection (GCC)** compiler provided by the **GNU**\
    \ project. Non-free compilers include the classic **Turbo C** compiler from Borland,\
    \ and, of course, the compiler that is preferred by Windows developers is **Visual\
    \ Studio**. The latter, however, is designed mainly for C++ development, so when\
    \ you compile PHP, you will need to specify C mode.\n\nWhen working on an Apple\
    \ Mac, the best solution is to install the **Apple Developer Tools**. You can\
    \ use the **Xcode IDE** to compile PHP 7, or run `gcc` from a terminal window.\
    \ In a Linux environment, from a terminal window, run `gcc`.\n\nWhen compiling\
    \ from a terminal window or command line, the normal procedure is as follows:\n\
    \n+   - configure\n\t- make\n\t- make test\n\t- make install\n\nFor information\
    \ on configuration options (that is, when running `configure`), use the **help**\
    \ option:\n\n```\n```\nconfigure --help\n```\n```\n\nErrors you might encounter\
    \ during the configuration stage are mentioned in the following table:\n\n| Error\
    \ | Fix |\n|---|---|\n| configure: error: xml2-config not found. Please check\
    \ your libxml2 installation | You just need to install libxml2. For this error,\
    \ please refer to the following link: http://superuser.com/questions/740399/how-to-fix-php-installation-when-xml2-config-is-missing\
    \ |\n| configure: error: Please reinstall readline - I cannot find readline.h\
    \ | Install libreadline-dev |"
