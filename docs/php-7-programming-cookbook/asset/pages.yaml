    # ## Chaining $_POST filters


    Proper filtering and validation is a common problem when processing data submitted
    by users from an online form. It is arguably also the number one security vulnerability
    for a website. Furthermore, it can be quite awkward to have the filters and validators
    scattered all over the application. A chaining mechanism would resolve these issues
    neatly, and would also allow you to exert control over the order in which the
    filters and validators are processed.


    # ### How to do it...


    +   1. There is a little-known PHP function, filter_input_array(), that, at first
    glance, seems well suited for this task. Looking more deeply into its functionality,
    however, it soon becomes apparent that this function was designed in the early
    days, and is not up to modern requirements for protection against attack and flexibility.
    Accordingly, we will instead present a much more flexible mechanism based on an
    array of callbacks performing filtering and validation.'
  merge: -1
  img_proc: true
- pgno: 219
  md: "![](img/39390f6d56c5a83b28db083a8bd5185c_219_0.png)\n\nThe difference between\
    \ *filtering* and *validation* is that filtering can potentially remove or transform\
    \ values. Validation, on the other hand, tests data using criteria appropriate\
    \ to the nature of the data, and returns a boolean result.\n\n+   2. In order\
    \ to increase flexibility, we will make our base filter and validation classes\
    \ relatively light. By this, we mean *not* defining any specific filters or validation\
    \ methods. Instead, we will operate entirely on the basis of a configuration array\
    \ of callbacks. In order to ensure compatibility in filtering and validation results,\
    \ we will also define a specific result object, `Application\\Filter\\Result`.\n\
    \n+   3. The primary function of the Result class will be to hold a `$item` value,\
    \ which would be the filtered value or a boolean result of validation. Another\
    \ property, `$messages`, will hold an array of messages populated *during* the\
    \ filtering or validation operation. In the constructor, the value supplied for\
    \ `$messages` is formulated as an array. You might observe that both properties\
    \ are defined `public`. This is to facilitate ease of access:\n\n```\nnamespace\
    \ Application\\Filter;\n\nclass Result\n{\n    public $item;  // (mixed) filtered\
    \ data | (bool) result\n               of validation\n    public $messages = array();\
    \ // [(string) message,\n                               (string) message ]\n\n\
    \    public function __construct($item, $messages)\n    {\n        $this->item\
    \ = $item;\n        if (is_array($messages)) {\n            $this->messages =\
    \ $messages;\n        } else {\n            $this->messages = [$messages];\n \
    \       }\n    }\n}\n```\n\n+   4. We also define a method that allows us to merge\
    \ this `Result` instance with another. This is important as at some point we will\
    \ be processing the same value through a chain of filters. In such a case, we\
    \ want the newly filtered value to overwrite the existing one, but we want the\
    \ messages to be merged:\n\n```\npublic function mergeResults(Result $result)\n\
    {\n    $this->item = $result->item;\n    $this->mergeMessages($result);\n```"
