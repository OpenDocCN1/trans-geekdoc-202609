  md: "# See also\n\n+   An excellent article that shows example usage written by\
    \ Matthew Weir O’Phinney, the editor of PSR-7 (also the lead architect for Zend\
    \ Framework 1, 2, and 3), is available here: `https://mmop.net/blog/2015-01-26-psr-7-by-example.html`\n\
    \n# Defining a PSR-7 Response class\n\nThe Response class represents outbound\
    \ information returned to whatever entity made the original request. HTTP headers\
    \ play an important role in this context as we need to know that format is requested\
    \ by the client, usually in the incoming `Accept` header. We then need to set\
    \ the appropriate `Content-Type` header in the Response class to match that format.\
    \ Otherwise, the actual body of the response will be HTML, JSON, or whatever else\
    \ has been requested (and delivered).\n\n# How to do it…\n\n+   1. The Response\
    \ class is actually much easier to implement than the Request class as we are\
    \ only concerned with returning the response from the server to the client. Additionally,\
    \ it extends our `Application\\MiddleWare\\Message` class where most of the work\
    \ has been done. So, all that remains to be done is to define an `Application\\\
    MiddleWare\\Response` class. As you will note, the only unique property is `$statusCode`:\n\
    ```php\nnamespace Application\\MiddleWare;\nuse Psr\\Http\\Message\\{ Constants,\
    \ ResponseInterface, StreamInterface };\nclass Response extends Message implements\
    \ ResponseInterface\n{\n    protected $statusCode;\n```\n2. The constructor is\
    \ not defined by PSR-7, but we provide it for convenience, allowing a developer\
    \ to create a Response instance with all parts intact. We use methods from Message\
    \ and constants from the `Constants` class to verify the arguments:\n```php\n\
    public function __construct($statusCode = NULL,\n    StreamInterface $body = NULL,\n\
    \    $headers = NULL,\n    $version = NULL)\n{\n    $this->body = $body;\n   \
    \ $this->status['code'] = $statusCode ?? Constants::DEFAULT_STATUS_CODE;\n   \
    \ $this->status['reason'] =\n```"
