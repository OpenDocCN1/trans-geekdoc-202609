- pgno: 364
  md: "# See also\n\nFor information on rewriting using the NGINX web server, have\
    \ a look at this article: http://nginx.org/en/docs/http/nginx_rewrite_module.html.\
    \ There are plenty of sophisticated PHP routing libraries available that introduce\
    \ far greater functionality than the simple router presented here. These include\
    \ AltOrouter (http://alto router.com/), TreeRoute (https://github.com/baryshev/TreeRoute),\
    \ FastRoute (https:// github.com/nikic/FastRoute), and Aura.Router. (https://github.com/auraphp/\
    \ Aura.Router). In addition, most frameworks (for example, Zend Framework 2 or\
    \ CodeIgniter) have their own routing capabilities.\n\n# Making inter-framework\
    \ system calls\n\nOne of the primary reasons for the development of PSR-7 (and\
    \ middleware) was a growing need to make calls between frameworks. It is of interest\
    \ to note that the main documentation for PSR-7 is hosted by PHP Framework Interop\
    \ Group (PHP-FIG).\n\n# How to do it...\n\n+   The primary mechanism used in middleware\
    \ inter-framework calls is to create a driver program that executes framework\
    \ calls in succession, maintaining a common request and response object. The request\
    \ and response objects are expected to represent Psr\\Http\\Message\\ServerRequestInterface\
    \ and Psr\\Http\\Message\\ ResponseInterface, respectively.\n\n+   For the purposes\
    \ of this illustration, we define a middleware session validator. The constants\
    \ and properties reflect the session thumbrint, which is a term we use to incorporate\
    \ factors such as the website visitor's IP address, browser, and language settings:\n\
    \n```\n```\nnamespace Application\\MiddleWare\\Session;\nuse InvalidArgumentException;\n\
    use Psr\\Http\\Message\\ {\n    ServerRequestInterface, ResponseInterface\n};\n\
    use Application\\MiddleWare\\ { Constants, Response, TextStream };\nclass Validator\n\
    {\n    const KEY_TEXT = 'text';\n    const KEY_SESSION = 'thumbrint';\n    const\
    \ KEY_STATUS_CODE = 'code';\n    const KEY_STATUS_REASON = 'reason';\n```\n```"
  merge: -1
  img_proc: true
- pgno: 365
  md: "```\nconst KEY_STOP_TIME = 'stop_time';\nconst ERROR_TIME = 'ERROR: session\
    \ has exceeded stop time';\nconst ERROR_SESSION = 'ERROR: thumbprint does not\
    \ match';\nconst SUCCESS_SESSION = 'SUCCESS: session validates OK';\nprotected\
    \ $sessionKey;\nprotected $currentPrint;\nprotected $storedPrint;\nprotected $currentTime;\n\
    protected $storedTime;\n```\n\n+   3.  The constructor takes a ServerRequestInterface\
    \ instance and the session as arguments. If the session is an array (such as $_SESSION),\
    \ we wrap it in a class. The reason why we do this is in case we are passed a\
    \ session object, such as JSession used in Joomla. We then create the thumbprint\
    \ using the previously mentioned factors. If the stored thumbprint is not available,\
    \ we assume this is the first time, and store the current print as well as stop\
    \ time, if this parameter is set. We used md5() because it's a fast hash, is not\
    \ exposed externally, and is therefore useful to this application:\n\n```\npublic\
    \ function __construct(\n    ServerRequestInterface $request, $stopTime = NULL)\n\
    {\n\n    $this->currentTime    = time();\n    $this->storedTime     = $_SESSION[self::KEY_STOP_TIME]\
    \ ?? 0;\n    $this->currentPrint =\n        md5($request->getServerParams()['REMOTE_ADDR']\n\
    \            . $request->getServerParams()['HTTP_USER_AGENT']\n            . $request->getServerParams()['HTTP_ACCEPT_LANGUAGE']);\n\
    \    $this->storedPrint = $_SESSION[self::KEY_SESSION]\n        ?? NULL;\n   \
    \ if (empty($this->storedPrint)) {\n        $this->storedPrint = $this->currentPrint;\n\
    \        $_SESSION[self::KEY_SESSION] = $this->storedPrint;\n        if ($stopTime)\
    \ {\n            $this->storedTime = $stopTime;\n            $_SESSION[self::KEY_STOP_TIME]\
    \ = $stopTime;\n        }\n    }\n}\n```"
