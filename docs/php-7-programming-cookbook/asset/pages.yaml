    \ $list[$customer['id']] =  $customer['name'];\n}\nreturn $list;\n}\n```\n\n+\
    \   4.  Interfaces can be used to satisfy a type hint. The following class, ListFactory,\
    \ contains a factory() method, which initializes any class that implements ConnectionAwareInterface.\
    \ The interface is a guarantee that the setConnection() method is defined. Setting\
    \ the type hint to the interface instead of a specific class instance makes the\
    \ factory method more generically useful:\n\n```\nnamespace Application\\Generic;\n\
    \nuse PDO;\nuse Exception;\nuse Application\\Database\\Connection;\nuse Application\\\
    Database\\ConnectionAwareInterface;\n\nclass ListFactory\n{\nconst ERROR_AWARE\
    \ = 'Class must be Connection Aware';\npublic static function factory(\nConnectionAwareInterface\
    \ $class, $dbParams)\n{\nif ($class instanceofConnectionAwareInterface) {\n$class->setConnection(new\
    \ Connection($dbParams));\nreturn $class;\n} else {\nthrow new Exception(self::ERROR_AWARE);\n\
    }\nreturn FALSE;\n}\n```"
