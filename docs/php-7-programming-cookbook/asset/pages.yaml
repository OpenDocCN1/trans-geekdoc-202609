    \ that will hover the tags for each website represented in the scan list. In order\
    \ to prevent the scanner from crawling the entire `World Wide Web (WWW)`, we've\
    \ limited the scan to the target domain. The reason why `yield from` has been\
    \ added is because we need to yield the entire array produced by `HooVer::getTags()`.\
    \ The `yield from` syntax allows us to treat the array as a sub-generator:\n\n\
    ```\n```\npublic function scan($url, $tag)\n{\n    $vac     = new HooVer();\n\
    \    $scan   = $vac->getAttribute($url, 'href',\n            $this->getDomain($url));\n\
    \    $result = array();\n    foreach ($scan as $subSite) {\n            yield\
    \ from $vac->getTags($subSite, $tag);\n    }\n    return count ($scan);\n}\n```\n\
    \n```\n\n> The use of `yield from` turns the `scan()` method into a PHP 7 delegating\
    \ generator. Normally, you would be inclined to store the results of the scan\
