- pgno: 366
  md: "+   4. It’s not required to define `__invoke()`, but this magic method is quite\
    \ convenient for standalone middleware classes. As is the convention, we accept\
    \ `ServerRequestInterface` and `ResponseInterface` instances as arguments. In\
    \ this method, we simply check to see whether the current thumbprint matches the\
    \ one stored. The first time, of course, they will match. But on subsequent requests,\
    \ the chances are an attacker intent on session hijacking will be caught out.\
    \ In addition, if the session time exceeds the stop time (if set), likewise, a\
    \ 401 code will be sent:\n\n```\npublic function __invoke(\n    ServerRequestInterface\
    \ $request, Response $response)\n\n{\n    $code = 401; // unauthorized\n    if\
    \ ($this->currentPrint != $this->storedPrint) {\n        $text[self::KEY_TEXT]\
    \ = self::ERROR_SESSION;\n        $text[self::KEY_STATUS_REASON] =\n         \
    \   Constants::STATUS_CODES[401];\n    } elseif ($this->storedTime) {\n      \
    \  if ($this->currentTime > $this->storedTime) {\n            $text[self::KEY_TEXT]\
    \ = self::ERROR_TIME;\n            $text[self::KEY_STATUS_REASON] =\n        \
    \        Constants::STATUS_CODES[401];\n        } else {\n            $code =\
    \ 200; // success\n        }\n    }\n\n    if ($code == 200) {\n        $text[self::KEY_TEXT]\
    \ = self::SUCCESS_SESSION;\n        $text[self::KEY_STATUS_REASON] =\n       \
    \     Constants::STATUS_CODES[200];\n    }\n\n    $text[self::KEY_STATUS_CODE]\
    \ = $code;\n    $body = new TextStream(json_encode($text));\n    return $response->withStatus($code)->withBody($body);\n\
    }\n```\n\n+   5. We can now put our new middleware class to use. The main problems\
    \ with inter-framework calls, at least at this point, are summarized here. Accordingly,\
    \ how we implement middleware depends heavily on the last point:\n\n* Not all\
    \ PHP frameworks are PSR-7-compliant\n* Existing PSR-7 implementations are not\
    \ complete\n* All frameworks want to be the “boss”"
