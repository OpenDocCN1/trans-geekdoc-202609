    \  $pdo  = new PDO($dsn, $params['user'], $params['pwd'], $opts);\n  $sql  = 'SELECT\
    \ * FROM customer '\n         . \"'WHERE balance > :min \"\n         . \"AND balance\
    \ < :max AND level = :level \"\n         . \"ORDER BY id LIMIT 20'\";\n  $stmt\
    \ = $pdo->prepare($sql);\n  $stmt->bindParam('min',   $min);\n  $stmt->bindParam('max',\
    \   $max);\n  $stmt->bindParam('level', $level);\n\n  $min   = 5000;\n  $max \
    \  = 10000;\n  $level = 'ADV';\n  $stmt->execute();\n  showResults($stmt, $min,\
    \ $max, $level);\n\n  $min   = 0;\n  $max   = 100;\n  $level = 'BEG';\n  $stmt->execute();\n\
    \  showResults($stmt, $min, $max, $level);\n\n} catch (PDOException $e) {\n  echo\
    \ $e->getMessage();\n} catch (Throwable $e) {\n  echo $e->getMessage();\n}\n```\n\
    \nWhen the values of these variables change, the next execution will reflect the\
    \ modified criteria.\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_164_0.png)\n\n\
    ![](img/39390f6d56c5a83b28db083a8bd5185c_164_1.png)\n\n# Best practice\n\nUse\
    \ PDO::query() for one-time database commands. Use PDO::prepare() and PDOStatement::execute()\
