    # There''s more...


    In PHP 7, there was a problem when using `open_ssl_encrypt()` and `open_ssl_decrypt()`,
    and the **Authenticated Encrypt with Associated Data (AEAD)** modes supported:
    GCM and CCM. Accordingly, in PHP 7.1, three extra parameters have been added to
    these functions, as follows:


    | Parameter | Description |

    |---|---|

    | `\$tag` | Authentication tag passed by reference; variable value remains the
    same if authentication fails |

    | `\$aad` | Additional authentication data |

    | `\$tag_length` | 4 to 16 for GCM mode; no limits for CCM mode; only for `open_ssl_encrypt()`
    |



    For more information, you can refer to `https://wiki.php.net/rfc/openssl_aead`.'
