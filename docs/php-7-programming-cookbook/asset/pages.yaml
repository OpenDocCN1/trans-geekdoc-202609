    state_province\"]=>\n    bool(false)\n)\n```\n\nNotice that the *missing* fields,\
    \ *address* and *state_province* validate *FALSE*, and return the missing item\
    \ message.\n\n# Tying validation to a form\n\nWhen a form is first rendered, there\
    \ is little value in having a form class (such as *Application\\Form\\Factory*,\
    \ described in the previous recipe) tied to a class that can perform filtering\
    \ or validation (such as the *Application\\Filter\\** described in the previous\
    \ recipe). Once the form data has been submitted, however, interest grows. If\
    \ the form data fails validation, the values can be filtered, and then re-displayed.\
    \ Validation error messages can be tied to form elements, and rendered next to\
    \ form fields.\n\n# How to do it...\n\n+   1. First of all, be sure to implement\
    \ the classes defined in the *Implementing a Form Factory*, *Chaining $_POST Filters*,\
    \ and *Chaining $_POST Validators* recipes.\n2. We will now turn our attention\
    \ to the *Application\\Form\\Factory* class, and add properties and setters that\
    \ allow us to attach instances of *Application\\Filter\\Filter* and *Application\\\
    Filter\\Validator*. We also need define $data, which will be used to retain the\
    \ filtered and/or validated data:\n\n```\nconst DATA_NOT_FOUND = 'Data not found.\
    \ Run setData()';\nconst FILTER_NOT_FOUND = 'Filter not found. Run setFilter()';\n\
    ```"
