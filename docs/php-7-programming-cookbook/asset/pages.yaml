  md: "For information on nullable types, please refer to this article:\n\n+   https://wiki.php.net/rfc/nullable_types\n\
    \n# ## Using iterators\n\nAn **iterator** is a special type of class that allows\
    \ you to **traverse** a *container* or list. The keyword here is *traverse*. What\
    \ this means is that the iterator provides the means to go through a list, but\
    \ it does not perform the traversal itself.\n\nThe SPL provides a rich assortment\
    \ of generic and specialized iterators designed for different contexts. The `ArrayIterator`,\
    \ for example, is designed to allow object-oriented traversal of arrays. The `DirectoryIterator`\
    \ is designed for filesystem scanning.\n\nCertain SPL iterators are designed to\
    \ work with others, and add value. Examples include `FilterIterator` and `LimitIterator`.\
    \ The former gives you the ability to remove unwanted values from the parent iterator.\
    \ The latter provides a pagination capability whereby you can designate how many\
    \ items to traverse along with an offset that determines where to start.\n\nFinally,\
    \ there are a series of *recursive* iterators, which allow you to repeatedly call\
    \ the parent iterator. An example would be `RecursiveDirectoryIterator` which\
    \ scans a directory tree all the way from a starting point to the last possible\
    \ subdirectory.\n\n# ### How to do it...\n\n+   1. We first examine the `ArrayIterator`\
    \ class. It's extremely easy to use. All you need to do is to supply an array\
    \ as an argument to the constructor. After that you can use any of the methods\
    \ that are standard to all SPL-based iterators, such as `current()`, `next()`,\
    \ and so on.\n\n   ```\n   $iterator = new ArrayIterator($array);\n   ```\n\n\
    ![](img/39390f6d56c5a83b28db083a8bd5185c_89_0.png)\n\n+   2. As an example of\
    \ a practical use for the iterator, have a look at this example. It takes an iterator\
    \ and produces a series of HTML `<ul>` and `<li>` tags:\n\n   ```\n   function\
    \ htmlList($iterator)\n   {\n       $output = '<ul>';\n       while ($value =\
    \ $iterator->current()) {\n           $output .= '<li>' . $value . '</li>';\n\
    \           $iterator->next();\n       }\n   ```"
