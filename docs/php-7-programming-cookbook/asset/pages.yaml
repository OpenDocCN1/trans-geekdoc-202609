    # Writing your own iterator using generators


    In the preceding set of recipes we demonstrated the use of iterators provided
    in the PHP 7 SPL. But what if this set doesn''t provide you with what is needed
    for a given project? One solution would be to develop a function that, instead
    of building an array that is then returned, uses the yield keyword to return values
    progressively by way of iteration. Such a function is referred to as a *generator*.
    In fact, in the background, the PHP engine will automatically convert your function
    into a special built-in class called *Generator*.


    There are several advantages to this approach. The main benefit is seen when you
    have a large container to traverse (that is, parsing a massive file). The traditional
    approach has been to build up an array, and then return that array. The problem
    with this is that you are effectively doubling the amount of memory required!
    Also, performance is affected in that results are only achieved once the final
    array has been returned.'
  merge: -1
  img_proc: true
- pgno: 98
  md: "# ## How to do it...\n\n+   In this example we build on the library of iterator-based\
    \ functions, adding a generator of our own design. In this case we will duplicate\
    \ the functionality described in the section above on iterators where we stacked\
    \ an `ArrayIterator`, `FilterIterator`, and `LimitIterator`.\n\n+   Because we\
    \ need access to the source array, the desired filter, page number, and number\
    \ of items per page, we include the appropriate parameters into a single `filteredResultsGenerator()`\
    \ function. We then calculate the offset based on the page number and limit (that\
    \ is, number of items per page). Next, we loop through the array, apply the filter,\
    \ and continue the loop if the offset has not yet been reached, or break if the\
    \ limit has been reached:\n\n```\n\nfunction filteredResultsGenerator(array $array,\
    \ $filter, $limit = 10, $page = 0)\n{\n    $max    = count ($array);\n    $offset\
    \ = $page * $limit;\n\n    foreach ($array as $key => $value) {\n        if (!strpos($value,\
    \ $filter) !== FALSE) continue;\n        if (--$offset >= 0) continue;\n     \
    \   if (--$limit <= 0) break;\n        yield $value;\n    }\n}\n\n```\n\n+   You'll\
    \ notice the primary difference between this function and others is the **yield**\
    \ keyword. The effect of this keyword is to signal the PHP engine to produce a\
    \ Generator instance and encapsulate the code.\n\n# ## How it works...\n\nTo demonstrate\
    \ the use of the `filteredResultsGenerator()` function we'll have you implement\
    \ a web application that scans a web page and produces a filtered and paginated\
    \ list of URLs hoovered from `HREF` attributes.\n\nFirst you need to add the code\
    \ for the `filteredResultsGenerator()` function to the library file used in the\
    \ previous recipe, then place the functions described previously into an include\
    \ file, `chap_03_developing_functions_iterators_library.php`.\n\nNext, define\
    \ a test script, `chap_03_developing_functions_using_generator.php`, that includes\
    \ both the function library as well as the file that defines `Application\\Web\\\
    Hoover`, described in *Chapter 1, Building a Foundation*:"
