- pgno: 480
  md: "```\n       $list = array_unique($list);\n        file_put_contents($sourceFile,\
    \ implode(\"\\n\",$list));\n        }\n    }\n    return TRUE;\n}\n```\n\n6. Next,\
    \ we define a method that flips random letters in the word to uppercase:\n\n```\n\
    public function flipUpper($word)\n{\n    $maxLen     = strlen($word);\n    $numFlips\
    \ = random_int(1, $maxLen - 1);\n    $flipped = strtolower($word);\n    for ($x\
    \ = 0; $x < $numFlips; $x++) {\n        $pos = random_int(0, $maxLen - 1);\n \
    \       $word[$pos] = strtoupper($word[$pos]);\n    }\n    return $word;\n}\n\
    ```\n\n7. Finally, we are ready to define a method that chooses a word from our\
    \ source. We choose a word source at random, and use the file() function to read\
    \ from the appropriate cached file:\n\n```\npublic function word()\n{\n    $wsKey\
    \     = random_int(0, count($this->sourceList) - 1);\n    $list     = file($this->sourceList[$wsKey]);\n\
    \    $maxList = count($list) - 1;\n    $key     = random_int(0, $maxList);\n \
    \   $word = $list[$key];\n    return $this->flipUpper($word);\n}\n```\n\n8. So\
    \ that we do not always produce passwords of the same pattern, we define a method\
    \ that allows us to place the various components of a password in different positions\
    \ in the final password string. The algorithms are defined as an array of method\
    \ calls available within this class. So, for example, an algorithm of ['word',\
    \ 'digits', 'word', 'special'] might end up looking like hEiL0123aUTol:\n\n```\n\
    public function initAlgorithm()\n{\n    $this->algorithm = [\n        ['word',\
    \ 'digits', 'word', 'special'],\n        ['digits', 'word', 'special', 'word'],\n\
    \        ['word', 'word', 'special', 'digits'],\n```"
