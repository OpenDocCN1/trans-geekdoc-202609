- pgno: 332
  md: "**Best practice**\n\nNever store passwords in clear text. When you need to\
    \ do a password match, use `password_verify()`, which negates the need to reproduce\
    \ the password hash.\n\n+   4. The `Authenticate` class is a wrapper for an adapter\
    \ class that implements `AuthenticationInterface`. Accordingly, the constructor\
    \ takes an adapter class as an argument, as well as a string that serves as the\
    \ key, in which authentication information is stored in `$ _SESSION`: ```\n\n\
    ```\nnamespace Application\\Acl;\nuse Application\\MiddleWare\\ { Response, TextStream\
    \ };\nuse Psr\\Http\\Message\\ { RequestInterface, ResponseInterface };\nclass\
    \ Authenticate\n{\n    const ERROR_AUTH = 'ERROR: invalid token';\n    const DEFAULT_KEY\
    \ = 'auth';\n    protected $adapter;\n    protected $token;\n    public function\
    \ __construct(\n        AuthenticationInterface $adapter, $key)\n    {\n     \
    \   $this->key = $key;\n        $this->adapter = $adapter;\n    }\n```\n\n+  \
    \ 5. In addition, we provide a login form with a security token, which helps prevent\
    \ **Cross Site Request Forgery (CSRF)** attacks: ```\n\n```\npublic function getToken()\n\
    {\n    $this->token = bin2hex(random_bytes(16));\n    $_SESSION['token'] = $this->token;\n\
    \    return $this->token;\n}\npublic function matchToken($token)\n{\n    $sessToken\
    \ = $_SESSION['token'] ?? date('Ymd');\n    return ($token == $sessToken);\n}\n\
    public function getLoginForm($action = NULL)\n{\n    $action = ($action) ? 'action=\"\
    ' . $action . '\" ' : '';```\n```"
  merge: -1
  img_proc: true
- pgno: 333
  md: "```\n$output = '<form method=\"post\" ' . $action . '>';\n$output .= '<table><tr><th>Username</th><td>';\n\
    $output .= '<input type=\"text\" name=\"username\" /></td>';\n$output .= '</tr><tr><th>Password</th><td>';\n\
    $output .= '<input type=\"password\" name=\"password\" />';\n$output .= '</td></tr><tr><th>&nbsp;</th>';\n\
    $output .= '<td><input type=\"submit\" /></td>';\n$output .= '</tr></table>';\n\
    $output .= '<input type=\"token\" value=\"';\n$output .= $this->getToken() . '\"\
    \ />' ;\n$output .= '</form>';\nreturn $output;\n}\n```\n\n+   6.  Finally, the\
    \ login() method in this class checks whether the token is valid. If not, a 400\
    \ response is returned. Otherwise, the login() method of the adapter is called:\n\
    \n```\npublic function login(\n    RequestInterface $request) : ResponseInterface\n\
    {\n    \n    $params = json_decode($request->getBody()->getContents());\n    $token\
    \ = $params->token ?? FALSE;\n    if (!( $token && $this->matchToken( $token))\
    \ {\n        $code = 400;\n        $body = new TextStream(self::ERROR_AUTH);\n\
    \        $response = new Response($code, $body);\n    } else {\n        $response\
    \ = $this->adapter->login($request);\n    }\n    if ($response->getStatusCode()\
    \ >= 200\n        && $response->getStatusCode() < 300) {\n        $_SESSION[$this->key]\
    \ =\n            json_decode($response->getBody()->getContents());\n    } else\
    \ {\n        $_SESSION[$this->key] = NULL;\n    }\n    return $response;\n}\n\
    }\n```"
