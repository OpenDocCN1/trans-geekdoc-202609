- pgno: 367
  md: "+   6.  As an example, have a look at the configuration files for **Zend Expressive**,\
    \ which is a self-proclaimed PSR7 Middleware Microframework. Here is the file,\
    \ `middleware-pipeline.global.php`, which is located in the `config/autoload`\
    \ folder in a standard Expressive application. The `dependencies` key is used\
    \ to identify the middleware wrapper classes that will be activated in the pipeline:\n\
    \n```php\n<?php\nuse Zend\\Expressive\\Container\\ApplicationFactory;\nuse Zend\\\
    Expressive\\Helper;\nreturn [\n    'dependencies' => [\n        'factories' =>\
    \ [\n            Helper\\ServerUrlMiddleware::class =>\n                Helper\\\
    ServerUrlMiddlewareFactory::class,\n            Helper\\UrlHelperMiddleware::class\
    \ =>\n                Helper\\UrlHelperMiddlewareFactory::class,\n           \
    \ // insert your own class here\n        ],\n    ],\n];\n```\n\n+   7.  Under\
    \ the `middleware_pipeline` key, you can identify classes that will be executed\
    \ before or after the routing process occurs. Optional parameters include `path`,\
    \ `error`, and `priority`:\n\n```php\n'middleware_pipeline' => [\n    'always'\
    \ => [\n        'middleware' => [\n            Helper\\ServerUrlMiddleware::class,\n\
    \        ],\n        'priority' => 10000,\n    ],\n    'routing' => [\n      \
    \  'middleware' => [\n            ApplicationFactory::ROUTING_MIDDLEWARE,\n  \
    \          Helper\\UrlHelperMiddleware::class,\n            // insert reference\
    \ to middleware here\n            ApplicationFactory::DISPATCH_MIDDLEWARE,\n \
    \       ],\n        'priority' => 1,\n    ],\n    'error' => [\n        'middleware'\
    \ => [\n            // Add error middleware here.\n        ],\n        'error'\
    \     => true,\n    ],\n];\n```"
