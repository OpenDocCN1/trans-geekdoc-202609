- pgno: 292
  md: '# Working with Date/Time and International Aspects


    Here is the result as seen from a browser:


    ![](img/39390f6d56c5a83b28db083a8bd5185c_292_0.png)


    > Note that if the locale is set to `fr_FR`, a UK formatted number, when parsed,
    does not return the correct value. Likewise, when the locale is set to `en_GB`,
    a French formatted number does not return the correct value upon parsing. Accordingly,
    you might want to consider adding a validation check before attempting to parse
    the number.


    # See also


    +   ▶  For more information on the use and abuse of `setlocale()` please refer
    to this page: `http://php.net/manual/en/function.setlocale.php`.


    +   ▶  For a brief note on why number formatting will produce an error on some
    servers, but not others, check the **ICU (International Components for Unicode)**
    version. See the comments on this page: `http://php.net/manual/en/numberformatter.parse.php`.
    For more info on ICU formatting, see `http://userguide.icu-project.org/formatparse`.


    # Handling currency by locale


    The technique for handling currency is similar to that for numbers. We will even
    use the same `NumberFormatter` class! There is one major difference, however,
    and it is a show stopper; in order to properly format currency, you will need
