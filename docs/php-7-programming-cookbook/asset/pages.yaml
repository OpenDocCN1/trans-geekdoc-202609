    $assignments = [\n        'first_name'        => ['length' => 32, 'alpha' => NULL],\n\
    \        'last_name'         => ['length' => 32, 'alpha' => NULL],\n        'address'\
    \           => ['length' => 64, 'alnum' => NULL],\n        'city'            \
