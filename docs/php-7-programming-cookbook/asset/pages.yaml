  md: "6. To mock findByName() we simply return that array key from $this->testData.\
    \ For removeByName(), we unset the array key supplied as a parameter from $this->testData:\n\
    \n```\npublic function findByName($id)\n{\n    $sql = 'SELECT * FROM ' . self::TABLE_NAME;\n\
    \    $sql .= ' WHERE id = ?';\n    return $this->testData[$id] ?? FALSE;\n}\n\n\
    public function removeByName($id)\n{\n    $sql = 'DELETE FROM ' . self::TABLE_NAME;\n\
    \    $sql .= ' WHERE id = ?';\n    if (empty($this->testData[$id])) {\n      \
    \  return 0;\n    } else {\n        unset($this->testData[$id]);\n        return\
    \ 1;\n    }\n}\n```\n\n7. Adding data is slightly more complicated in that we\
    \ need to emulate the fact that the id parameter might not be supplied, as the\
    \ database would normally auto-generate this for us. To get around this, we check\
    \ for the id parameter. If not set, we find the largest array key and increment:\n\
    \n```\npublic function addVisitor($data)\n{\n    $sql = 'INSERT INTO ' . self::TABLE_NAME;\n\
    \    $sql .= ' (' . implode(',', array_keys($data)) . ')';\n    $sql .= ' VALUES\
    \ ';\n    $sql .= ' (' . implode('::', array_keys($data)) . ')';\n    if (!empty($data['id']))\
