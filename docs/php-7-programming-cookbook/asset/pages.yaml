    # Handling translation without gettext


    Translation is an important part of making your website accessible to an international
    customer base. One way this is accomplished it to use the PHP `gettext` functions,
    which are based on the **GNU** `gettext` operating system tools installed on the
    local server. `gettext` is well documented and well supported, but uses a legacy
    approach and has distinct disadvantages. Accordingly, in this recipe, we present
    an alternative approach to translation where you can build your own *adapter*.'
  merge: -1
  img_proc: true
- pgno: 320
  md: "Something important to recognize is that the programmatic translation tools\
    \ available to PHP are primarily designed to provide limited translation of a\
    \ word or phrase, referred to as the `msgid` (**message ID**). The translated\
    \ equivalent is referred to as the `msgstr` (**message string**). Accordingly,\
    \ incorporating translation typically only involves relatively unchanged items\
    \ such as menus, forms, error or success messages, and so on. For the purposes\
    \ of this recipe, we will assume that you have the actual web page translations\
    \ stored as blocks of text.\n\n> If you need to translate entire pages of content,\
    \ you might consider using the Google Translate API. This is, however, a paid\
    \ service. Alternatively, you could outsource the translation to individuals with\
    \ multi-lingual skills cheaply using Amazon Mechanical Turk. See the See Also\
    \ section at the end of this recipe for the URLs.\n\n# How to do it...\n\n+  \
    \ 1. We will once again use the Adapter software design pattern, in this case\
    \ to provide alternatives to the translation source. In this recipe, we will demonstrate\
    \ adapters for `.ini` files, `.csv` files, and databases.\n2. To begin, we will\
    \ define an interface that will later be used to identify a translation adapter.\
    \ The requirements for a translation adapter are quite simple, we only need to\
    \ return a message string for a given message ID:\n\n```\nnamespace Application\\\
    \\I18n\\\\Translate\\\\Adapter;\n\ninterface TranslateAdapterInterface\n{\n  public\
    \ function translate($msgid);\n}\n```\n\n+   3. Next we define a trait that matches\
    \ the interface. The trait will contain the actual code required. Note that if\
    \ we fail to find the message string, we simply return the message ID:\n\n```\n\
    namespace Application\\\\I18n\\\\Translate\\\\Adapter;\n\ntrait TranslateAdapterTrait\n\
    {\n  protected $translation;\n  public function translate($msgid)\n  {\n    return\
    \ $this->translation[$msgid] ?? $msgid;\n  }\n```"
  merge: -1
  img_proc: true
- pgno: 321
  md: "+   4.  Now we're ready to define our first adapter. In this recipe, we'll\
    \ start with an adapter that uses an .ini file as the source of translations.\
    \ The first thing you'll notice is that we use the trait defined previously. The\
    \ constructor method will vary between adapters. In this case, we use `parse_ini_file()`\
    \ to produce an array of key/ value pairs where the key is the message ID. Notice\
    \ that we use the `$filePattern` parameter to substitute the locale, which then\
    \ allows us to load the appropriate translation file:\n\n```\nnamespace Application\\\
    \\I18n\\\\Translate\\\\Adapter;\n\nuse Exception;\nuse Application\\\\I18n\\\\\
    Locale;\n\nclass Ini implements TranslateAdapterInterface\n{\n    use TranslateAdapterTrait;\n\
    \    const ERROR_NOT_FOUND = 'Translation file not found';\n    public function\
    \ __construct(Locale $locale, $filePattern)\n    {\n        $translateFileName\
    \ = sprintf($filePattern,\n            $locale->getLocaleCode());\n        if\
    \ (!file_exists($translateFileName)) {\n            error_log(self::ERROR_NOT_FOUND\
    \ . ': ' . $translateFileName);\n            throw new Exception(self::ERROR_NOT_FOUND);\n\
    \        } else {\n            $this->translation = parse_ini_file($translateFileName);\n\
    \        }\n    }\n}\n```\n\n+   5.  The next adapter, `Application\\\\I18n\\\\\
    Translate\\\\Adapter\\\\Csv`, is identical, except that we open the translation\
    \ file and loop through using `fgetcsv()` to retrieve the message ID / message\
    \ string key pairs. Here we show only the difference in the constructor:\n\n```\n\
    public function __construct(Locale $locale, $filePattern)\n{\n    $translateFileName\
    \ = sprintf($filePattern,\n        $locale->getLocaleCode());\n    if (!file_exists($translateFileName))\
    \ {\n        error_log(self::ERROR_NOT_FOUND . ': ' . $translateFileName);\n \
    \       throw new Exception(self::ERROR_NOT_FOUND);\n    } else {\n        $fileObj\
    \ = new SplFileObject($translateFileName, 'r');\n        while ($row = $fileObj->fgetcsv())\
    \ {\n            $this->translation[$row[0]] = $row[1];\n        }\n```"
