- pgno: 556
  md: "# How it works...\n\nPlace all the code discussed in this recipe into a `SessOptions.php`\
    \ file in the `Application\\Security` directory. You can then define a calling\
    \ program called `chap_13_session_options.php` to test the new class, which sets\
    \ up autoloading and uses the class:\n\n```\n<?php\nrequire _DIR_ . '/../Application/Autoload/Loader.php';\n\
    Application\\Autoload\\Loader::init(_DIR_ . '/../..');\nuse Application\\Security\\\
    SessOptions;\n```\n\nNext, define an array that uses the class constants as keys,\
    \ with values as desired to manage the session. Note that in the example shown\
    \ here, session information is stored in a subdirectory, session, which you need\
    \ to create:\n\n```\n$options = [\n SessOptions::SESS_OP_USE_ONLY_COOKIES => 1,\n\
    \ SessOptions::SESS_OP_COOKIE_LIFETIME => 300,\n SessOptions::SESS_OP_COOKIE_HTTPONLY\
    \ => 1,\n SessOptions::SESS_OP_NAME => 'UNLIKELYSOURCE',\n SessOptions::SESS_OP_SAVE_PATH\
    \ => _DIR_ . '/session'\n];\n```\n\nYou can now create the `SessOptions` instance\
    \ and run `start()` to start the session. You could use `phpinfo()` here to show\
    \ some information on the session:\n\n```\n$sessOpt = new SessOptions($options);\n\
    $sessOpt->start();\n$_SESSION['test'] = 'TEST';\nphpinfo(INFO_VARIABLES);\n```\n\
    \nIf you look for information on cookies using your browser's developer tools,\
    \ you will note the name is set to `UNLIKELYSOURCE` and the expiration time is\
    \ 5 minutes from now:\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_556_0.png)"
  merge: -1
