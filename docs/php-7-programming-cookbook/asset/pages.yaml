    \ cat logs/20160610.log\n2016-06-10 06:25:37 :: PDOException :: SQLSTATE[42000]:\
    \ Syntax error or access violation: 1064 You have an error in your SQL syntax;\
    \ check the manual that corresponds to your MySQL server version for the right\
    \ syntax to use near \"This is Not SQL\" at line 1\nedged:~/Desktop/Repos/php7_recipes/source/chapter13$\n\
    ```\n\n# See also\n\n+   - It might be a good idea to review the documentation\
    \ on the set_exception_handler() function. Have a look, especially, at the comment\
    \ (posted 7 years ago, but still pertinent) by Anonymous that clarifies how this\
    \ function works: http://php.net/manual/en/function.set-exception-handler.php.\n\
    \n# Universal error handler\n\nThe process of developing a universal error handler\
    \ is quite similar to the preceding recipe. There are certain differences, however.\
    \ First of all, in PHP 7, some errors are thrown and can be caught, whereas others\
    \ simply stop your application dead in its tracks. To further confuse matters,\
    \ some errors are treated like exceptions, whereas others are derived from the\
    \ new PHP 7 Error class. Fortunately for us, in PHP 7, both Error and Exception\
    \ implement a new interface called Throwable. Accordingly, if you are not sure\
    \ whether your code will throw an Exception or an Error, simply catch an instance\
    \ of Throwable and you'll catch both.\n\n# How to do it...\n\n+   1. Modify the\
    \ Application\\ErrorHandler class defined in the preceding recipe. In the constructor,\
    \ set a new errorHandler() method as the default error handler:\n\n```\npublic\
    \ function __construct($logFileDir = NULL, $logFile = NULL)\n{\n    $logFile =\
    \ $logFile ?? date('Ymd') . '.log';\n    $logFileDir = $logFileDir ?? _DIR_;\n\
    \    $this->logFile = $logFileDir . '/' . $logFile;\n    $this->logFile = str_replace('//',\
    \ '/', $this->logFile);\n    set_exception_handler([$this, 'exceptionHandler']);\n\
    \    set_error_handler([$this, 'errorHandler']);\n}\n```"
