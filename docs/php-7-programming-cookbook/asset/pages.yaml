- pgno: 247
  md: "+   3.  For the reverse process, also called recursively, we define two methods.\
    \ The first method, arrayToXml(), sets up an initial SimpleXMLElement instance,\
    \ and then calls the second method, phpToXml():\npublic function arrayToXml(array\
    \ $a)\n{\n    $xml = new SimpleXMLElement(‘<?xml version=\"1.0\" standalone=\"\
    yes\"?><root></root>’);\n    $this->phpToXml($a, $xml);\n    return $xml->asXML();\n\
    }\n\n+   4.  Note that in the second method, we use `get_object_vars()` in case\
    \ one of the array elements is an object. You’ll also note that numbers alone\
    \ are not allowed as XML tags, which means adding some text in front of the number:\n\
    protected function phpToXml($value, &$xml)\n{\n    $node = $value;\n    if (is_object($node))\
    \ {\n        $node = get_object_vars($node);\n    }\n    if (is_array($node))\
    \ {\n        foreach ($node as $k => $v) {\n            if (is_numeric($k)) {\n\
    \                $k = ‘number’ . $k;\n            }\n            if (is_array($v))\
    \ {\n                $newNode = $xml->addChild($k);\n                $this->phpToXml($v,\
    \ $newNode);\n            } elseif (is_object($v)) {\n                $newNode\
    \ = $xml->addChild($k);\n                $this->phpToXml($v, $newNode);\n    \
    \        } else {\n                $xml->addChild($k, $v);\n            }\n  \
    \      }\n    } else {\n        $xml->addChild(self::UNKNOWN_KEY, $node);\n  \
    \  }\n}"
