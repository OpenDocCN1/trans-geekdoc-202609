    \ request a client will make to a server, as well as request received from a client\
    \ by a server. Accordingly, we provide Application\\MiddleWare\\Request (requests\
    \ a client will make to a server), and Application\\MiddleWare\\ServerRequest\
    \ (requests received from a client by a server). The good news is that most of\
    \ our work has already been done: notice that our Request class extends Message.\
