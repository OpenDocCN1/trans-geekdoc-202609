- pgno: 232
  md: "# # Chaining $_POST validators\n\nThe *heavy lifting* for this recipe has already\
    \ been accomplished in the preceding recipe. Core functionality is defined by\
    \ `Application\\Filter\\AbstractFilter`. The actual validation is performed by\
    \ an array of validating callbacks.\n\n# ## How to do it...\n\n+   1.  Look over\
    \ the preceding recipe, *Chaining $_POST filters*. We will be using all of the\
    \ classes and configuration files in this recipe, except where noted here.\n \
    \   2.  To begin, we define a configuration array of validation callbacks. As\
    \ with the preceding recipe, each callback should implement `Application\\Filter\\\
    CallbackInterface`, and should return an instance of `Application\\Filter\\Result`.\
    \ Validators would take this generic form:\n\n```\n```php\nuse Application\\\\\
    Filter\\\\{ Result, Messages, CallbackInterface };\n$config = [\n// validator\
    \ callbacks\n'validators' => [\n'key' => new class () implements CallbackInterface\n\
    {\npublic function __invoke($item, $params) : Result\n{\n// validation logic goes\
    \ here\nreturn new Result($valid, $error);\n}\n},\n// etc.\n]\n];\n```\n```\n\n\
    +   3.  Next, we define a `Application\\Filter\\Validator` class, which loops\
    \ through the array of assignments, testing each data item against its assigned\
    \ validator callbacks. We make this class extend `AbstractFilter` in order to\
    \ provide the core functionality described previously:\n\n```\n```php\nnamespace\
    \ Application\\\\Filter;\nclass Validator extends AbstractFilter\n{\n// code\n\
    }\n```\n```"
  merge: -1
  img_proc: true
- pgno: 233
  md: "+   4.  Within this class, we define a core `process()` method that scans an\
    \ array of data and applies validators as per the array of assignments. If there\
    \ are no assigned validators for this data set, we simply return the current status\
    \ of `$valid` (which is `TRUE`):\n\n```\npublic function process(array $data)\n\
    {\n    $valid = TRUE;\n    if (!isset($this->assignments)\n        && count($this->assignments))\
    \ {\n        return $valid;\n    }\n```\n\n+   5.  Otherwise, we initialize `$this->results`\
    \ to an array of `Result` objects where the `$item` property is set to `TRUE`,\
    \ and the `$messages` property is an empty array:\n\n```\nforeach ($data as $key\
    \ => $value) {\n    $this->results[$key] = new Result(TRUE, array());\n}\n```\n\
    \n+   6.  We then make a copy of `$this->assignments` and check to see if there\
    \ are any `global` filters (identified by the `'*'` key). If so, we run `processGlobal()`\
    \ and then unset the `'*'` key:\n\n```\n$todo = $this->assignments;\nif (isset($todo['*']))\
    \ {\n    $this->processGlobalAssignment($todo['*'], $data);\n    unset($todo['*']);\n\
    }\n```\n\n+   7.  Finally, we loop through any remaining assignments, calling\
    \ `processAssignment()`. This is an ideal place to check to see if any fields\
    \ present in the assignments array is missing from the data. Note that we set\
    \ `$valid` to `FALSE` if any validation callback returns `FALSE`:\n\n```\nforeach\
    \ ($todo as $key => $assignment) {\n    if (!isset($data[$key])) {\n        $this->results[$key]\
    \ =\n            new Result(FALSE, $this->missingMessage);\n    } else {\n   \
    \     $this->processAssignment(\n            $assignment, $key, $data[$key]);\n\
    \    }\n    if (!$this->results[$key]->item) $valid = FALSE;\n}\nreturn $valid;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 234
  md: "+   8. As you will recall, each *assignment* is *keyed* to the data field,\
    \ and represents an array of callbacks for that field. Thus, in `processGlobalAssignment()`,\
    \ we need to loop through the array of callbacks. In this case, however, because\
    \ these *assignments* are **global**, we also need to loop through the **entire**\
    \ data set, and apply each global filter in turn.\n\n+   9. In contrast to the\
    \ equivalent `Application\\Filter\\Filter::processGlobalAssignment()` method,\
    \ we need to call `mergeValidationResults()`. The reason for this is that if the\
    \ value of `$result->item` is already `FALSE`, we need to ensure that it does\
    \ not subsequently get overwritten by a value of `TRUE`. Any validator in the\
    \ chain that returns `FALSE` must overwise any other validation result:\n\n```php\n\
    protected function processGlobalAssignment($assignment, $data)\n{\n    foreach\
    \ ($assignment as $callback) {\n        if ($callback === NULL) continue;\n  \
    \      foreach ($data as $k => $value) {\n            $result = $this->callbacks[$callback['key']]\n\
    \                     ($value, $callback['params']);\n            $this->results[$k]->mergeValidationResults($result);\n\
    \        }\n    }\n}\n```\n\n\n+   10. When we define `processAssignment()`, in\
    \ a manner akin to `processGlobalAssignment()`, we need to execute **each remaining\
    \ callback assigned** to each data key, again calling `mergeValidationResults()`:\
    \ \n\n```php\nprotected function processAssignment($assignment, $key, $value)\n\
    {\n    foreach ($assignment as $callback) {\n        if ($callback === NULL) continue;\n\
    \        $result = $this->callbacks[$callback['key']]\n                  ($value,\
    \ $callback['params']);\n        $this->results[$key]->mergeValidationResults($result);\n\
    \    }\n}\n```\n\n# How it works...\n\nAs with the preceding recipe, be sure to\
    \ define the following classes:\n\n+   ▶ `Application\\Filter\\Result`\n\n▶ `Application\\\
    Filter\\CallbackInterface`"
  merge: -1
  img_proc: true
- pgno: 235
  md: "+   * Application\\Filter\\Messages\n* Application\\Filter\\AbstractFilter\n\
    \nYou can use the chap_06_post_data_config_messages.php file, also described in\
    \ the previous recipe.\n\nNext, create a Validator.php file in the Application\\\
    Filter folder. Place the code described in step 3 to 10.\n\nNext, create a chap_06_post_data_config_callbacks.php\
    \ callback configuration file that contains configurations for validation callbacks,\
    \ as described in step 2. Each callback should follow this generic template:\n\
    \n```\n'validation_key' => new class () implements CallbackInterface\n{\n    public\
    \ function __invoke($item, $params) : Result\n    {\n        $error = array();\n\
    \        $valid = /* perform validation operation on $item */\n        if (!$valid)\n\
    \            $error[] = Messages::$messages['validation_key'];\n        return\
    \ new Result($valid, $error);\n    }\n}\n```\n\nNow you can create a chap_06_post_data_validation.php\
    \ calling script that initializes autoloading and includes the configuration scripts:\n\
    \n```\n<?php\nrequire __DIR__ . '/../Application/Autoload/Loader.php';\nApplication\\\
    Autoload\\Loader::init(__DIR__ . '/../..');\ninclude __DIR__ . '/chap_06_post_data_config_messages.php';\n\
    include __DIR__ . '/chap_06_post_data_config_callbacks.php';\n```\n\nNext, define\
    \ an array of assignments, mapping data fields to validator callback keys:\n\n\
    ```\n$assignments = [\n    'first_name'      => [ ['key' => 'length',\n      \
    \                     'params' => ['min' => 1, 'max' => 128]],\n             \
    \              ['key' => 'alnum',\n                            'params' => ['allowWhiteSpace'\
    \ => TRUE]],\n    ],\n    'last_name'       => [ ['key' => 'required','params'\
    \ => []] ],\n    'params'          => [ ['min' => 1, 'max' => 128]],\n    'params'\
    \          => [ ['key' => 'alnum',\n                            'params' => ['allowWhiteSpace'\
    \ => TRUE]],\n    ['key' => 'required','params' => []] ],\n```"
