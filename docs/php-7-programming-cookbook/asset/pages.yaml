- pgno: 360
  md: '+   5. The constructor accepts a `ServerRequestInterface` compliant class,
    the path to the document root, and the configuration file mentioned earlier. Note
    that we throw an exception if the default configuration is not supplied:

    ```

    public function __construct(ServerRequestInterface $request,

    $docRoot, $config)

    {

    $this->config = $config;

    $this->docRoot = $docRoot;

    $this->request = $request;

    $this->requestUri =

    $request->getServerParams()[''REQUEST_URI''];

    $this->uriParts = explode(''/'', $this->requestUri);

    if (!isset($config[self::DEFAULT_MATCH])) {

    throw new InvalidArgumentException(

    self::ERROR_NO_DEF);

    }

    }

    ```


    +   6. Next, we have a series of getters that allow us to retrieve the original
    request, document root, and final route match:

    ```

    public function getRequest()

    {

    return $this->request;

    }

    public function getDocRoot()

    {

    return $this->docRoot;

    }

    public function getRouteMatch()

    {

    return $this->routeMatch;

    }

    ```


    +   7. The `isFileOrDir()` method is used to determine whether we are trying to
    match against a CSS, JavaScript, or graphic request (among other possibilities):

    ```

    public function isFileOrDir()

    {

    $fn = $this->docRoot . ''/'' . $this->requestUri;

    $fn = str_replace(''//'', ''/'', $fn);

    if (file_exists($fn)) {

    return $fn;

    } else {

    return '''';

    }

    }

    ```'
