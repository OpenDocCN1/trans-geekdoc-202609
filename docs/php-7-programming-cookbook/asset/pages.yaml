  md: "+   4. Any attempts to use `<<` or `>>` with a negative operator, or beyond\
    \ 64, is wrapped in a `try { xxx } catch ( { xxx }` block, looking for an `ArithmeticError`\
    \ to be thrown:\n\n```\n```php\n// wraps bit shift operations in try / catch\n\
    '!(<(.*)?(\\\\d\\*s*(\\\\<|\\\\>\\\\>\\*?-?\\[d+] (.*)?\\$! =>\nfunction ($match)\
    \ {\n    return '// WARNING: negative and '\n    . 'out-of-range bitwise '\n \
    \   . 'shift operations will now '\n    . 'throw an ArithmeticError' . PHP_EOL\n\
    \    . 'See: http://php.net/manual/en/'\n    . 'migration70.incompatible.php'\n\
    \    . 'try {' . PHP_EOL\n    . \"\\t\" . $match[0] . PHP_EOL\n    . '}' catch\
    \ (\\\\ArithmeticError $e) {'\n    . \"\\t\" . 'error_log(\"File:\" '\n    . $e->getFile()'\n\
    \    . \" Message:\" . $e->getMessage());'\n    . '}' . PHP_EOL;\n},\n```\n```\n\
    \n> PHP 7 has changed how errors are handled. In some cases, errors are moved\
    \ into a similar classification as exceptions, and can be caught! Both the `Error`\
    \ and the `Exception` class implement the `Throwable` interface. If you want to\
    \ catch either an `Error` or an `Exception`, catch `Throwable`.\n\n+   5. Next,\
    \ the converter rewrites any usage of `call_user_method*()`, which has been removed\
    \ in PHP 7. These are replaced with the equivalent using `call_user_func*():`\n\
    \n```\n```php\n// replaces \"call_user_method()\" with\n// \"call_user_func()\"\
    \n'!call_user_method\\( (.*)?, (.*)?\\) (\\b|;) !' =>\nfunction ($match) {\n \
    \   $params = $match[3] ?? '';\n    return '// WARNING: call_user_method() has\
    \ '\n    . 'been removed from PHP 7' . PHP_EOL\n    . \"call_user_func(['\" .\
    \ trim($match[2]) . ',\"'\n    . trim($match[1]) . '] ' . $params . ');';\n},\n\
    ```\n```\n\n```\n```php\n// replaces \"call_user_method_array()\"\n// with \"\
    call_user_func_array()\"\n'!call_user_method_array\\( (.*)?, (.*)?, (.*)?\\) (\\\
    b|;) !' =>\n```\n```"
