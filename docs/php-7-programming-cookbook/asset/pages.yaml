  md: "+   4. The constructor accepts a database connection instance as an argument.\
    \ For our purposes, we will use Application\\Database\\Connection, defined in\
    \ *Chapter 5, Interacting with a Database*. We also need to provide the name of\
    \ the database table, as well as `$columns`, an array of arbitrary column keys\
    \ and labels, which will appear in the HTML form. This will reference `$mapping`,\
    \ where the key matches `$columns`, but where the value represents actual database\
    \ column names:\n\n```\npublic function __construct(Connection $connection, \n\
    \                         $table, array $columns, array $mapping)\n{\n    $this->connection\
    \  = $connection;\n    $this->setTable($table);\n    $this->setColumns($columns);\n\
    \    $this->setMapping($mapping);\n}\n```\n\n+   5. After the constructor, we\
    \ provide a series of useful getters and setters:\n\n```\npublic function setColumns($columns)\n\
    {\n    $this->columns = $columns;\n}\n\npublic function getColumns()\n{\n    return\
    \ $this->columns;\n}\n\n// etc.\n```\n\n+   6. Probably the most critical method\
    \ is the one that builds the SQL statement to be prepared. After the initial SELECT\
    \ setup, we add a WHERE clause, using `$mapping` to add the actual database column\
    \ name. We then add the operator and implement `switch()`, which, based on the\
    \ operator, may or may not add a named placeholder that will represent the search\
    \ item:\n\n```\npublic function prepareStatement(Criteria $criteria)\n{\n    $this->sql\
    \ = 'SELECT * FROM ' . $this->table . ' WHERE ';\n    $this->sql .= $this->mapping[$criteria->key]\
    \ . ' ';\n    switch ($criteria->operator) {\n        case 'NOT NULL' :\n    \
    \        $this->sql .= ' IS NOT NULL OR ';\n            break;\n        default\
    \ :\n            $this->sql .= $criteria->operator . ' ';\n            $this->sql\
    \ .= $this->mapping[$criteria->key] . ' OR ';\n    }\n}\n```"
