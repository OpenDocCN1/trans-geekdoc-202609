- pgno: 323
  md: "7. We are now ready to define the core Translation class, which is tied to\
    \ one (or more) adapters. We assign a class constant to represent the default\
    \ locale, and properties for the locale, adapter, and text file pattern (explained\
    \ later):\n\n```\nnamespace Application\\I18n\\Translate;\n\nuse Application\\\
    I18n\\Locale;\nuse Application\\I18n\\Translate\\Adapter\\TranslateAdapterInterface;\n\
    \nclass Translation\n{\n    const DEFAULT_LOCALE_CODE = 'en_GB';\n    protected\
    \ $defaultLocaleCode;\n    protected $adapter = array();\n    protected $textFilePattern\
    \ = array();\n\n```\n\n8. In the constructor, we determine the locale, and set\
    \ the initial adapter to this locale. In this manner, we are able to host multiple\
    \ adapters:\n\n```\npublic function __construct(TranslateAdapterInterface $adapter,\n\
    \                           $defaultLocaleCode = NULL,\n                     \
    \      $textFilePattern = NULL)\n{\n    if (!$defaultLocaleCode) {\n        $this->defaultLocaleCode\
    \ = self::DEFAULT_LOCALE_CODE;\n    } else {\n        $this->defaultLocaleCode\
    \ = $defaultLocaleCode;\n    }\n    \n    $this->adapter[$this->defaultLocaleCode]\
    \ = $adapter;\n    $this->textFilePattern[$this->defaultLocaleCode] = \n     \
    \   $textFilePattern;\n}\n\n```\n\n9. Next we define a series of setters, which\
    \ gives us more flexibility:\n\n```\npublic function setAdapter($localeCode, TranslateAdapterInterface\
    \ \n    $adapter)\n{\n    $this->adapter[$localeCode] = $adapter;\n}\npublic function\
    \ setDefaultLocaleCode($localeCode)\n{\n    $this->defaultLocaleCode = $localeCode;\n\
    }\npublic function setTextFilePattern($localeCode, $pattern)\n{\n    $this->textFilePattern[$localeCode]\
    \ = $pattern;\n}\n\n```"
