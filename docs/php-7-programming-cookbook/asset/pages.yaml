- pgno: 62
  md: '# There''s more...


    Many of the PHP 7 performance improvements have nothing to do with new features
    and functions. Rather, they take the form of internal improvements, which are
    *invisible* until you start running your programs. Here is a short list of improvements
    that fall into this category:


    | Feature | More info: | Notes |

    | :--- | :--- | :--- |

    | Fast parameter parsing | `https://wiki.php.net/rfc/fast_zpp` | In PHP 5, parameters
    provided to functions have to be parsed for every single function call. The parameters
    were passed in as a `string`, and parsed in a manner similar to the `scanf ( )`
    function. In PHP 7 this process has been optimized and made much more efficient,
    resulting in a significant performance improvement. The improvement is difficult
    to measure, but seems to be in the region of 6%. |

    | PHP NG | `https://wiki.php.net/rfc/phpng` | The PHP **NG (Next Generation)**
    initiative represents a rewrite of most of the PHP language. It retains existing
    functionality, but involves any and all time- savings and efficiency measures
    imaginable. Data structures have been compacted, and memory is used more efficiently.
    Just one change, which affects array handling, for example, has resulted in a
    significant performance increase, while at the same time greatly reducing memory
    usage. |'
  merge: -1
  img_proc: true
- pgno: 63
  md: '| **Feature** | More info: | **Notes** |

    | :--- | :--- | :--- |

    | Removing dead weight | [https://wiki.php.net/rfc/removal_of_dead_sapis_and_exts](https://wiki.php.net/rfc/removal_of_dead_sapis_and_exts)
    | There were approximately two dozen extensions that fell into one of these categories:
    deprecated, no longer maintained, unmaintained dependencies, or not ported to
    PHP 7. A vote by the group of core developers determined to remove about 2/3 or
    the extensions on the "short list". This results in reduced overhead and faster
    overall future development of the PHP language. |


    # # Iterating through a massive file


    Functions such as `file_get_contents()` and `file()` are quick and easy to use
    however, owing to memory limitations, they quickly cause problems when dealing
    with massive files. The default setting for the `php.ini` `memory_limit` setting
    is **128 megabytes**. Accordingly, any file larger than this will not be loaded.


    Another consideration when parsing through massive files is how quickly does your
    function or class method produce output? When producing user output, for example,
    although it might at first glance seem better to accumulate output in an array.
    You would then output it all at once for improved efficiency. Unfortunately, this
    might have an adverse impact on the user experience. It might be better to create
    a **generator**, and use the `yield` keyword to produce immediate results.


    # ## How to do it...


    As mentioned before'
