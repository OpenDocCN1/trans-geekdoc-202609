- pgno: 263
  md: "9. As mentioned earlier, the real work is done by the API class. We start by\
    \ defining an abstract class that ensures the primary methods get(), put(), and\
    \ so on are represented, and that all such methods accept request and response\
    \ objects as arguments. You might notice that we have added a generateToken()\
    \ method that uses the PHP 7 random_bytes() function to generate a truly random\
    \ series of 16 bytes:\n\n```\nnamespace Application\\Web\\Rest; \nuse Application\\\
    Web\\{ Request, Response }; \nabstract class AbstractApi implements ApiInterface\
    \ \n{\n  const TOKEN_BYTE_SIZE = 16; \n  protected $registeredKeys; \n  abstract\
    \ public function get(Request $request,\n        Response $response);\n  abstract\
    \ public function put(Request $request,\n        Response $response);\n  abstract\
    \ public function post(Request $request,\n        Response $response);\n  abstract\
    \ public function delete(Request $request,\n        Response $response);\n  abstract\
    \ public function authenticate(Request $request); \n  public function __construct($registeredKeys,\
    \ $tokenField)\n  {\n    $this->registeredKeys = $registeredKeys;\n  } \n  public\
    \ static function generateToken()\n  {\n    return bin2hex(random_bytes(self::TOKEN_BYTE_SIZE));\n\
    \  } \n}\n```\n\n10. We also define a corresponding interface that can be used\
    \ for architectural and design purposes, as well as code development control:\n\
    \n```\nnamespace Application\\Web\\Rest; \nuse Application\\Web\\{ Request, Response\
    \ }; \ninterface ApiInterface \n{\n  public function get(Request $request, Response\
    \ $response); \n  public function put(Request $request, Response $response); \n\
    \  public function post(Request $request, Response $response); \n  public function\
    \ delete(Request $request, Response $response); \n  public function authenticate(Request\
    \ $request); \n}\n```"
