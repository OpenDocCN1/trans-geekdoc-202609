  md: "```\nrequire __DIR__ . '/../Application/Autoload/Loader.php';\nApplication\\\
    Autoload\\Loader::init(__DIR__ . './../');\nuse Application\\Database\\Connection;\n\
    use Application\\Cache\\{ Constants, Core, Database, File };\nuse Application\\\
    MiddleWare\\{ Request, TextStream };\n```\n\nWell, a function that takes a long\
    \ time to run is needed, so prime number generator, here we go! The numbers 1,\
    \ 2, and 3 are given as primes. We use the PHP 7 yield from syntax to produce\
    \ these first three, then, we skip right to 5, and proceed up to the maximum value\
    \ requested:\n\n```\nfunction generatePrimes($max)\n{\n    yield from [1,2,3];\n\
    \    for ($x = 5; $x < $max; $x++)\n    {\n        if ($x & 1) {\n           \
    \ $prime = TRUE;\n            for($i = 3; $i < $x; $i++) {\n                if(($x\
    \ % $i) === 0) {\n                    $prime = FALSE;\n                    break;\n\
    \                }\n            }\n            if ($prime) yield $x;\n       \
    \ }\n    }\n}\n```\n\nYou can then set up a database cache adapter instance, which\
    \ serves as an argument for the core:\n\n```\n$conn    = new Connection(include\
    \ DB_CONFIG_FILE);\n$dbCache = new Database(\n        $conn, DB_TABLE, 'id', 'key',\
    \ 'data', 'group');\n$core    = new Core($dbCache);\n```\n\nAlternatively, if\
    \ you wish to use the file cache adapter instead, here is the appropriate code:\n\
    \n```\n$fileCache = new File(CACHE_DIR);\n$core      = new Core($fileCache);\n\
    ```\n\nIf you wanted to clear the cache, here is how it might be done:\n\n```\n\
    $uriString = '/?group=' . Constants::DEFAULT_GROUP;\n$cacheRequest = new Request($uriString,\
    \ 'get');\n$response = $core->removeByGroup($cacheRequest);\n```"
