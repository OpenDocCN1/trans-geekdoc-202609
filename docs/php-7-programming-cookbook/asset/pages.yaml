  md: "# ## See also\n\nFor more information on Late Static Binding, see this explanation\
    \ in the PHP documentation:\n\n```text\nhttp://php.net/manual/en/language.oop5.late-static-bindings.php\n\
    ```\n\n# # Using namespaces\n\nAn aspect that is critical to advanced PHP development\
    \ is the use of namespaces. The arbitrarily defined namespace becomes a prefix\
    \ to the class name, thereby avoiding the problem of accidental class duplication,\
    \ and allowing you extraordinary freedom of development. Another benefit to the\
    \ use of a namespace, assuming it matches the directory structure, is that it\
    \ facilitates autoloading, as discussed in *Chapter 1, Building a Foundation*.\n\
    \n# ## How to do it...\n\n+   1. To define a class within a namespace, simply\
    \ add the keyword `namespace` at the top of the code file:\n\t`namespace Application\\\
    Entity;`\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_122_0.png)\n\n> **Best practice**\n\
    As with the recommendation to have only one class per file, likewise you should\
    \ have only one namespace per file.\n\n+   2. The only PHP code that should precede\
    \ the keyword `namespace` would be a comment and/or the keyword `declare`:\n\n\
