  img_proc: true
- pgno: 478
  md: "The good news is that by simply increasing the length of the password beyond\
    \ the magic length of six characters exponentially increases the time to crack\
    \ the hashed password. Other factors, such as interspersing uppercase with lowercase\
    \ letters randomly, random digits, and special characters, will also have an exponential\
    \ impact on the time to crack. At the end of the day, we need to bear in mind\
    \ that a human being will eventually need to enter the passwords created, which\
    \ means that need to be at least marginally memorable.\n\n> **Best practice**\n\
    \nPasswords should be stored as a hash, and never as plain text. MD5 and SHA*\
    \ are no longer considered secure (although SHA* is much better than MD5). Using\
    \ a utility such as oclHashcat, an attacker can generate an average of 55 billion\
    \ attempts per second on a password hashed using MD5 that has been made available\
    \ through an exploit (that is, a successful SQL injection attack).\n\n# How to\
    \ do it...\n\n+   1.  First, we define a `Application\\Security\\PassGen` class\
    \ that will hold the methods needed for password generation. We also define certain\
    \ class constants and properties that will be used as part of the process:\n\n\
    ```\nnamespace Application\\Security;\nclass PassGen\n{\n    const SOURCE_SUFFIX\
    \ = 'src';\n    const SPECIAL_CHARS = '\\\\\\\"!\"£$%^&*()_-+= {} [] @~;\\''#<>?../|\\\
    \\' ;\n    protected $algorithm;\n    protected $sourceList;\n    protected $word;\n\
    \    protected $list;\n\n```\n\n+   2.  We then define low-level methods that\
    \ will be used for password generation. As the names suggest, `digits()` produces\
    \ random digits, and `special()` produces a single character from the `SPECIAL_CHARS`\
    \ class constant:\n\n```\npublic function digits($max = 999)\n{\n    return random_int(1,\
    \ $max);\n}\n\npublic function special()\n{\n    $maxSpecial = strlen(self::SPECIAL_CHARS)\
    \ - 1;\n    return self::SPECIAL_CHARS[random_int(0, $maxSpecial)];\n}\n\n```"
  merge: -1
  img_proc: true
- pgno: 479
  md: "![](img/39390f6d56c5a83b28db083a8bd5185c_479_0.png)\n\n> Notice that we are\
    \ frequently using the new PHP 7 function `random_int()` in this example. Although\
    \ marginally slower, this method offers true **Cryptographically Secure Pseudo\
    \ Random Number Generator (CSPRNG)** capabilities compared to the more dated `rand()`\
    \ function.\n\n+   3. Now comes the tricky part: generating a hard-to-guess word.\
    \ This is where the `$wordSource` constructor parameter comes into play. It is\
    \ an array of websites from which our word base will be derived. Accordingly,\
    \ we need a method that will pull a unique list of words from the sources indicated,\
    \ and store the results in a file. We accept the `$wordSource` array as an argument,\
    \ and loop through each URL. We use `md5()` to produce a hash of the website name,\
    \ which is then built into a filename. The newly produced filename is then stored\
    \ in `$sourceList`:\n\n```\n```\npublic function processSource(\n    $wordSource,\
    \ $minWordLength, $cacheDir)\n{\n    foreach ($wordSource as $html) {\n      \
    \  $hashKey = md5($html);\n        $sourceFile = $cacheDir . '/' . $hashKey .\
    \ '.'\n            . self::SOURCE_SUFFIX;\n        $this->sourceList[] = $sourceFile;\n\
    \    }\n}\n```\n```\n\n+   4. If the file doesn't exist, or is zero-byte, we process\
    \ the contents. If the source is HTML, we only accept content inside the `<body>`\
    \ tag. We then use `str_word_count()` to pull a list of words out of the string,\
    \ also employing `strip_tags()` to remove any markup:\n\n```\n```\nif (!file_exists($sourceFile)\
    \ || filesize($sourceFile) == 0) {\n    echo 'Processing: ' . $html . PHP_EOL;\n\
    \    $contents = file_get_contents($html);\n    if (preg_match('/<body>(.*)<\\\
    /body>/i',\n        $contents, $matches)) {\n        $contents = $matches[1];\n\
    \    }\n    $list = str_word_count(strip_tags($contents), 1);\n}\n```\n```\n\n\
    +   5. We then remove any words that are too short, and use `array_unique()` to\
    \ get rid of duplicates. The final result is stored in a file:\n\n```\n```\nforeach\
    \ ($list as $key => $value) {\n    if (strlen($value) < $minWordLength) {\n  \
    \      $list[$key] = 'xxxxxxx';\n    } else {\n        $list[$key] = trim($value);\n\
    \    }\n}\n```\n```"
