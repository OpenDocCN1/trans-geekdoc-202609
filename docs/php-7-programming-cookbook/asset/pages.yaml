  md: "# Interacting with a Database\n\nIn this example, we bind the variables $min,\
    \ $max, and $level to the prepared statement:\n\n```\n$min    = 0;\n$max   = 0;\n\
    $level = '';\n\ntry {\n  $dsn  = sprintf('mysql:host=%s;dbname=%s', $params['host'],\n\
