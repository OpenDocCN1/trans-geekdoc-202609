    \ PHP 7 has introduced a syntactical improvement referred to as `group use` which\
    \ greatly improves code readability:\n\nuse Application\\Entity\\ {\n    Name,\n\
    \    Address,\n    Profile\n};\n$name = new Name();\n$addr = new Address();\n\
    $prof = new Profile();\n\n+   6. As mentioned in Chapter 1, *Building a Foundation*,\
