- pgno: 253
  md: "# Creating a streams-based REST client\n\nWe are now ready to consider two\
    \ different ways to implement a REST client. The first approach is to use an underlying\
    \ PHP I/O layer referred to as **Streams**. This layer provides a series of wrappers\
    \ that provide access to external streaming resources. By default, any of the\
    \ PHP file commands will use the file wrapper, which gives access to the local\
    \ filesystem. We will use the http:/// or https:/// wrappers to implement the\
    \ Application\\Web\\Client\\Streams adapter:\n\n+   First, we define an `Application\\\
    Web\\Client\\Streams` class:\n\n```php\nnamespace Application\\Web\\Client;\n\n\
    use Application\\Web\\{ Request, Received };\n\nclass Streams\n{\n    const BYTES_TO_READ\
    \ = 4096;\n```\n\n+   Next, we define a method to send the request to the external\
    \ web service. In the case of GET, we add the parameters to the URL. In the case\
    \ of POST, we create a stream context that contains metadata instructing the remote\
    \ service that we are supplying data. Using PHP Streams, making a request is just\
    \ a matter of composing the URL, and, in the case of POST, setting the stream\
    \ context. We then use a simple `fopen()`:```php\npublic static function send(Request\
    \ $request)\n{\n    $data = $request->getDataEncoded();\n    $received = new Received();\n\
    \n    switch ($request->getMethod()) {\n\n    case Request::METHOD_GET :\n\n \
    \       if ($data) {\n            $request->setUri($request->getUri() . '? ' .\
    \ $data);\n        }\n\n        $resource = fopen($request->getUri(), 'r');\n\
    \        break;\n\n    case Request::METHOD_POST :\n        $opts = [\n      \
    \      $request->getTransport() =>\n                [\n                    'method'\
    \   => Request::METHOD_POST,\n                    'header'   => Request:::HEADER_CONTENT_TYPE\n\
    \                        . ': ' . Request:::CONTENT_TYPE_FORM_URL_ENCODED,\n \
    \                   'content'  => $data\n                ]\n        ];\n     \
    \   $resource = fopen($request->getUri(), 'w',\n            stream_context_create($opts));\n\
    \        break;\n```"
  merge: -1
  img_proc: true
