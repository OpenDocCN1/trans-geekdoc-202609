  md: "# Accessing Web Services\n\n+   8. In this recipe, we will define a `Application\\\
    Web\\Request` class that can accept parameters when we wish to generate a request,\
    \ or, alternatively, populate properties with incoming request information when\
    \ implementing a server that accepts requests:\n\n```php\nnamespace Application\\\
    Web;\nclass Request extends AbstractHttp\n{\n    public function __construct(\n\
    \        $uri = NULL, $method = NULL, array $headers = NULL,\n        array $data\
    \ = NULL, array $cookies = NULL)\n    {\n        if (!$headers) $this->headers\
    \ = $_SERVER ?? array();\n        else $this->headers = $headers;\n\n        if\
    \ (!$uri) $this->uri = $this->headers['PHP_SELF'] ?? '';\n        else $this->uri\
    \ = $uri;\n\n        if (!$method) $this->method =\n        $this->headers['REQUEST_METHOD']\
    \ ?? self::METHOD_GET;\n        else $this->method = $method;\n\n        if (!$data)\
    \ $this->data = $_REQUEST ?? array();\n        else $this->data = $data;\n\n \
    \       if (!$cookies) $this->cookies = $_COOKIE ?? array();\n        else $this->cookies\
    \ = $cookies;\n\n        $this->setTransport();\n    }\n}\n```\n\n+   9. Now we\
    \ can turn our attention to a response class. In this case, we will define an\
    \ `Application\\Web\\Received` class. The name reflects the fact that we are repackaging\
    \ data received from the external web service:\n\n```php\nnamespace Application\\\
    Web;\nclass Received extends AbstractHttp\n{\n    public function __construct(\n\
    \        $uri = NULL, $method = NULL, array $headers = NULL,\n        array $data\
    \ = NULL, array $cookies = NULL)\n    {\n        $this->uri = $uri;\n        $this->method\
    \ = $method;\n        $this->headers = $headers;\n        $this->data = $data;\n\
    \        $this->cookies = $cookies;\n        $this->setTransport();\n    }\n}\n\
    ```"
