- pgno: 516
  md: "+   We then define the new method, using the documented parameters. As with\
    \ our exception handler, we log information to a log file:\n\n```\npublic function\
    \ errorHandler($errno, $errstr, $errfile, $errline)\n{\n    $message = sprintf('ERROR:\
    \ %s : %d : %s : %s : %s' . PHP_EOL,\n        date('Y-m-d H:i:s'), $errno, $errstr,\
    \ $errfile, $errline);\n    file_put_contents($this->logFile, $message, FILE_APPEND);\n\
    }\n```\n\n+   Also, just to be able to distinguish errors from exceptions, add\
    \ EXCEPTION to the message sent to the log file in the exceptionHandler() method:\n\
    \n```\npublic function exceptionHandler($ex)\n{\n    $message = sprintf('EXCEPTION:\
    \ %19s : %20s : %s' . PHP_EOL,\n        date('Y-m-d H:i:s'), get_class($ex), $ex->getMessage());\n\
    \    file_put_contents($this->logFile, $message, FILE_APPEND);\n}\n```\n\n# How\
    \ it works...\n\nFirst, make the changes to Application\\Error\\Handler as defined\
    \ previously. Next, create a class that throws an error that, for this illustration,\
    \ could be defined as Application\\Error\\ThrowsError. For example, you could\
    \ have a method that attempts a divide by zero operation, and another that attempts\
    \ to parse non-PHP code using eval():\n\n```\n<?php\nnamespace Application\\Error;\n\
    class ThrowsError\n{\n    const NOT_PARSE = 'this will not parse';\n    public\
    \ function divideByZero()\n    {\n        $this->zero = 1 / 0;\n    }\n    public\
    \ function willNotParse()\n    {\n        eval(self::NOT_PARSE);\n    }\n}\n```\n\
    \nYou can then define a calling program called chap_13_error_throwable.php that\
    \ sets up autoloading, uses the appropriate classes, and creates an instance of\
    \ ThrowsError:\n\n```\n<?php\nrequire __DIR__ . '/../../Application/Autoload/Loader.php';\n\
    Application\\Autoload\\Loader::init(__DIR__ . '/..');\n```"
