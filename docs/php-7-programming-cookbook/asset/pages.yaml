    \n```\ntry {\n    file_put_contents($tempFile, json_encode($body));\n    $body\
    \ = new Stream($tempFile);\n    $header[Constants::HEADER_CONTENT_TYPE] = 'application/json';\n\
    \    $response = new Response($code, $body, $header);\n    $response->getHeaders();\n\
    \    echo $response->getBody()->getContents() . PHP_EOL;\n    var_dump($response);\n\
    ```\n\nTo wrap things up, catch any errors or exceptions using Throwable, and\
    \ don't forget to delete the temp file:\n\n```\n} catch (Throwable $e) {\n   \
    \ echo $e->getMessage();\n} finally {\n    unlink($tempFile);\n}\n```"
