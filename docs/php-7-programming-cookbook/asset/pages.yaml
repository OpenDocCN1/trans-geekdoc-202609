    \ to supply either # occurrences or an end date';\nconst ERROR_INVALID_DATE =\
    \ 'String i.e. YYYY-mm-dd or DateTime instance only';\nconst ERROR_INVALID_INTERVAL\
    \ = 'Interval must take the form \"P\\d+(D | W | M)\"';\n\npublic $id;\npublic\
    \ $flag;\npublic $value;\npublic $title;\npublic $locale;\npublic $interval;\n\
    public $description;\npublic $occurrences;\npublic $nextDate;\nprotected $endDate;\n\
