  md: "# Developing Middleware\n\nYou can use `time()` and `microtime()` to see how\
    \ long this script runs with and without the cache:\n\n```\n$start = time() +\
    \ microtime(TRUE);\necho \"\\nTime: \" . $start;\n```\n\nNext, generate a cache\
    \ request. A status code of 200 indicates you were able to obtain a list of primes\
    \ from the cache:\n\n```\n$uriString = '/?key=Test1';\n$cacheRequest = new Request($uriString,\
    \ 'get');\n$response = $core->getFromCache($cacheRequest);\n$status   = $response->getStatusCode();\n\
    if ($status == 200) {\n    $primes = json_decode($response->getBody()->getContents());\n\
    ```\n\nOtherwise, you can assume nothing was obtained from the cache, which means\
    \ you need to generate prime numbers, and save the results to the cache:\n\n```\n\
    } else {\n    $primes = array();\n    foreach (generatePrimes(MAX_NUM) as $num)\
    \ {\n        $primes[] = $num;\n    }\n    $body = new TextStream(json_encode($primes));\n\
    \    $response = $core->saveToCache(\n        $cacheRequest->withBody($body)\n\
    \    );\n}\n```\n\nYou can then check the stop time, calculate the difference,\
    \ and have a look at your new list of primes:\n\n```\n$time = time() + microtime(TRUE);\n\
    $diff = $time - $start;\necho \"\\nTime: $time\";\necho \"\\nDifference: $diff\"\
    ;\nvar_dump($primes);\n```\n\nHere is the expected output before values were stored\
    \ in the cache:"
