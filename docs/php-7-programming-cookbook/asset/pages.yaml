    ![](img/39390f6d56c5a83b28db083a8bd5185c_517_0.png)\n\nIf you wrap the method\
    \ calls in try/catch blocks and catch Throwable, the code execution continues:\n\
    \n```\ntry {\n    $error->divideByZero();\n} catch (Throwable $e) {\n    echo\
    \ 'Error Caught: ' . get_class($e) . ':'\n        . $e->getMessage() . PHP_EOL;\n\
    }\ntry {\n    $error->willNotParse();\n} catch (Throwable $e) {\n    echo 'Error\
    \ Caught: ' . get_class($e) . ':'\n        . $e->getMessage() . PHP_EOL;\n}\n\
    echo 'Application continues ... ' . PHP_EOL;\n```"
