- pgno: 7
  md: '# ## About the Author


    Doug Blier has been hooked on computers since his first program, written in Dartmouth
    BASIC on a DEC PDP-8, in 1971. In his wide-ranging career, this author has been
    a professional contract programmer since 1978, having written applications in
    BASIC, PL/I, assembler, FORTH, C, C++, dBase/FoxBase/Clipper, Pascal, Perl, Java,
    and PHP. He deployed his first website in 1993 while living in San Francisco.
    He speaks four languages, has traveled extensively, and has lived in the USA,
    France, the Netherlands, England, Sweden, Scotland, and Thailand. He also spent
    some years doing Linux system administration and TCP/IP networking. He is also
    an accomplished musician (he has written over 60 songs) as well as a writer, under
    the pen name of Dougias Alan.


    Doug''s own company is unlikelysource.com, which specializes in consulting, PHP
    programming, website development, and training (primarily for Zend Technologies
    Ltd and Rogue Wave Software Inc.


    His works of fiction published on https://www.lulu.com/ are The End, And Then?
    and Further Indications. Some of his technical works for O''Reilly Media are Learning
    PHP and MySQL, Learning PHP Security, Learning MongoDB, and Learning Doctrine.


    > First and foremost, I would like to dedicate this book to my mother, Betty Blier,
    who passed away in May 2016. She encouraged me all my life, and applauded my accomplishments
    (no matter how bad!). She attended all my music concerts, bought all my CDs, and
    read all my books (even if she did not understand them). I would also like to
    thank my long-suffering wife, Siri, who patiently endured the hours it took me
    to write this book without complaint. (She did, however, make threats if I agreed
    to take on another one... negotiations are ongoing.) Finally, I would like to
    thank a number of notables in the PHP community who let me bounce ideas off them
    or offered inspiration. These include, Matthew Weir O''Phinney, Cal Evans, Daryl
    Wood, Susie Pollock, Salvatore Pappalardo, Slavy Karadzhov, and Clark Everett.'
