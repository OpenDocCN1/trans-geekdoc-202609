    # Using middleware to cross languages


    Except in cases where you are trying to communicate between different versions
    of PHP, PSR-7 middleware will be of minimal use. Recall what the acronym stands
    for: **PHP Standards Recommendations**. Accordingly, if you need to make a request
    to an application written in another language, treat it as you would any other
    web service HTTP request.


    # How to do it...


    +   1.  In the case of PHP 4, you actually have a chance in that there is limited
    support for object-oriented programming. Accordingly, the best approach would
    be to downgrade the basic PSR-7 classes described in the first three recipes.
    There is not enough space to cover all the changes, but we present a potential
    PHP 4 version of `Application\\MiddleWare\\ServerRequest`. The first thing to
    note is that there are no namespaces! Accordingly, we use a classname with underscores,
    _, in place of namespace separators:


    ```

    ```

    class Application_MiddleWare_ServerRequest

    extends Application_MiddleWare_Request

    implements Psr_Http_Message_ServerRequestInterface

    {

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 373
  md: "2. All properties are identified in PHP 4 using the key word var:\n\n```\n\
    ```php\nvar $serverParams;\nvar $cookies;\nvar $queryParams;\n// not all properties\
    \ are shown\n```\n```\n\n3. The initialize() method is almost the same, except\
    \ that syntax such as $this->getServerParams() ('REQUEST_URI') was not allowed\
    \ in PHP 4. Accordingly, we need to split this out into a separate variable:\n\
    \n```\n```php\nfunction initialize()\n{\n  $params = $this->getServerParams();\n\
    \  $this->getCookieParams();\n  $this->getQueryParams();\n  $this->getUploadedFiles;\n\
    \  $this->getRequestMethod();\n  $this->getContentType();\n  $this->getParsedBody();\n\
    \  return $this->withRequestTarget($params['REQUEST_URI']);\n}\n```\n```\n\n4.\
    \ All of the $_XXX super-globals were present in later versions of PHP 4:\n\n\
    ```\n```php\nfunction getServerParams()\n{\n  if (!$this->serverParams) {\n  \
    \  $this->serverParams = $_SERVER;\n  }\n  return $this->serverParams;\n}\n//\
    \ not all getXxx() methods are shown to conserve space\n```\n```\n\n5. The null\
    \ coalesce operator was only introduced in PHP 7. We need to use isset(XXX) ?\
    \ XXX : '' instead:\n\n```\n```php\nfunction getRequestMethod()\n{\n  $params\
    \ = $this->getServerParams();\n  $method = isset($params['REQUEST_METHOD'])\n\
    \           ? $params['REQUEST_METHOD'] : '';\n  $this->method = strtolower($method);\n\
    \  return $this->method;\n}\n```\n```"
