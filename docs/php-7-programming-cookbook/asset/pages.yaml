- pgno: 283
  md: "# How to do it...\n\n+   1. Some languages are read right-to-left instead of\
    \ left-to-right. Examples include Hebrew and Arabic. In this example, we show\
    \ you how to present reverse text using the U+202E Unicode character for right-to-left\
    \ override. The following line of code prints txtet desreveR:\n   ```\n   echo\
    \ \"\\u{202E}Reversed text\";\n   echo \"\\u{202D}\"; // returns output to left-to-right\n\
    \   ```\n   Don't forget to invoke the left-to-right override character, U+202D,\
    \ when finished!\n   2. Another consideration is the use of composed characters.\
    \ One such example is ñ (the letter n with a tilde -- floating above). This is\
    \ used in words such as mañana (the Spanish word for morning or tomorrow, depending\
    \ on the context). There is a *composed character* available, represented by Unicode\
    \ code U+00F1. Here is an example of its use, which echoes mañana:\n   ```\n \
    \  echo \"ma\\u{00F1}ana\"; // shows mañana\n   ```\n   3. This could potentially\
    \ impact search possibilities, however. Imagine that your customers do not have\
    \ a keyboard with this composed character. If they start to type man in an attempt\
    \ to search for mañana, they will be unsuccessful.\n   4. Having access to the\
    \ *full Unicode* set offers other possibilities. Instead of using the *composed*\
    \ character, you can use a combination of the original letter n along with the\
    \ Unicode *combining* code, which places a floating tilde on top of the letter.\
    \ In this echo command, the output is the same as previously. Only the way the\
    \ word is formed differs:\n   ```\n   echo \"man\\u{0303}ana\"; // also shows\
    \ mañana\n   ```\n   5. A similar application could be made for accents. Consider\
    \ the French word élève (student). You could render it using composed characters,\
    \ or by using *combining* codes to float the accents above the letter. Consider\
    \ the two following examples. Both examples produce the same output, but are rendered\
    \ differently.\n   ```\n   echo \"\\u{00E9}\\l\\u{00E8}\\ve\";\n   echo \"e\\\
    u{0301}\\l\\e\\u{0300}ve\";\n   ```"
  merge: -1
  img_proc: true
