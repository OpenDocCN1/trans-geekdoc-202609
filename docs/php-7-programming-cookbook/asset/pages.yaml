    # Testing database model classes


    First, create an example class to be tested, VisitorOps, shown in step 2 in this
    subsection. You can now define a class we will call SimpleDatabaseTest to test
    VisitorOps. First of all, use require_once to load the class to test. (We will
    discuss how to incorporate autoloading in the next recipe!) Then define key properties,
    including test database configuration and test data. You could use php7cookbook_test
    as the test database:


    ```

    ```php

    <?php

    use PHPUnit\Framework\TestCase;

    require_once __DIR__ . ''/VisitorOps.php'';

    class SimpleDatabaseTest extends TestCase

    {

    protected $visitorOps;

    protected $dbConfig = [

    ''driver'' => ''mysql'',

    ''host'' => ''localhost'',

    ''dbname'' => ''php7cookbook_test'',

    ''user'' => ''cook'',

    ''password'' => ''book'',

    ''errmode'' => PDO::ERRMODE_EXCEPTION,

    ];

    protected $testData = [

    ''id'' => 1,

    ''email'' => ''test@unlikelysource.com'',

    ''visit_date'' => ''2000-01-01 00:00:00'',

    ''comments'' => ''TEST'',

    ''name'' => ''TEST''

    ];

    }

    ```

    ```


    Next, define setup(), which inserts the test data, and confirms that the last
    SQL statement was INSERT. You should also check to see whether the return value
    was positive:


    ```

    ```php

    public function setup()

    {

    $this->visitorOps = new VisitorOps($this->dbConfig);

    $this->visitorOps->addVisitor($this->testData);

    $this->assertRegExp(''/INSERT/'', $this->visitorOps->getSql());

    }

    ```

    ```'
