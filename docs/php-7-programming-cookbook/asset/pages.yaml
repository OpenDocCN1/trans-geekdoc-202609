    \ 'New York City');\ndefine('DEFAULT_DESTINATION', 'Redondo Beach');\ndefine('DEFAULT_FORMAT',\
    \ 'json');\n$apiKey = include __DIR__ . '/google_api_key.php';\nrequire __DIR__\
