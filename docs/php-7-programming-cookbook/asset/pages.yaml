    \ {\n            throw new InvalidArgumentException(\n                Constants::ERROR_INVALID_STATUS);\n\
    \        }\n        $this->status['code'] = $statusCode;\n        $this->status['reason']\
    \ = ($reasonPhrase\n            ? Constants::STATUS_CODES[$statusCode] : NULL);\n\
