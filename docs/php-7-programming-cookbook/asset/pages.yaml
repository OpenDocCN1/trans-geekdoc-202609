    # There’s more…


    The filter_input_array() function takes two arguments: the input source (in the
    form of a pre-defined constant used to indicate one of the $ * PHP super-globals,
    that is, $ _ POST), and an array of matching field definitions as keys and filters
    or validators as values. This function performs not only filtering operations,
    but validation as well. The flags labeled sanitize are actually filters.


    # See also


    Documentation and examples of filter_input_array() can be found at http://php.net/manual/en/function.filter-input-array.php.
    You might also have a look at the different types of filters that are available
    on http://php.net/manual/en/filter.filters.php.'
