  md: '# Building a bubble sort


    The classic **bubble sort** is an exercise often assigned to university students.
    Nonetheless, it''s important to master this algorithm as there are many occasions
    where built-in PHP sorting functions do not apply. An example would be sorting
    a multi-dimensional array where the sort key is not the first column.


    The way the bubble sort works is to recursively iterate through the list and swap
    the current value with the next value. If you want items to be in ascending order,
    the swap occurs if the next item is less than the current item. For descending
    order, the swap occurs if the reverse is true. The sort is concluded when no more
    swaps occur.


    In the following diagram, after the first pass, **Grape** and **Banana** are swapped,
    as are **Orange** and **Cherry**. After the 2nd pass, **Grape** and **Cherry**
    are swapped. No more swaps occur on the last pass, and the bubble sort ends:


    ![](img/39390f6d56c5a83b28db083a8bd5185c_390_0.png)


    # How to do it...


    +   1. We do not want to actually move the values around in the array; that would
    be horribly expensive in terms of resource usage. Instead, we will use a **linked
    list**, discussed in the previous recipe.


    +   2. First we build a linked list using the `buildLinkedList()` function discussed
    in the previous recipe.


    +   3. We then define a new function, `bubbleSort()`, which accepts the linked
    list by reference, the primary list, a sort field, and a parameter that represents
    sort order (ascending or descending):


    ```

    ```php

    function bubbleSort(&$linked, $primary, $sortField, $order = ''A'')

    {

    ```

    ```


    +   4. The variables needed include one that represents the number of iterations,
    the number of swaps, and an iterator based upon the linked list:


    ```

    ```php

    static $iterations = 0;

    $swaps = 0;

    $iterator = new ArrayIterator($linked);

    ```

    ```'
