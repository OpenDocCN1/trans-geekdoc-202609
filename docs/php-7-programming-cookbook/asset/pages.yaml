- pgno: 93
  md: "+   13. Returning to our example that produces a list of country names, suppose,\
    \ instead of only the country name, we wished to iterate through a multi-dimensional\
    \ array consisting of country names and ISO codes. The simple iterators mentioned\
    \ so far would not be sufficient. Instead, we will use ones that are known as\
    \ **recursive** iterators.\n\n+   14. First of all, we need to define a method\
    \ that uses the database connection class mentioned previously to pull all columns\
    \ from the database. As before, we return an ArrayIterator instance populated\
    \ with data from the query:\n\n```\n```\nfunction fetchAllAssoc($sql, $connection)\n\
    {\n    $iterator = new ArrayIterator();\n    $stmt = $connection->pdo->query($sql);\n\
    \    while($row = $stmt->fetch(PDO::FETCH_ASSOC)) {\n        $iterator->append($row);\n\
    \    }\n    return $iterator;\n}\n```\n```\n\n+   15. At first glance one would\
    \ be tempted to simply wrap a standard ArrayIterator instance inside RecursiveArrayIterator.\
    \ Unfortunately, this approach only performs a **shallow** iteration, and doesn't\
    \ give us what we want: an iteration through all elements of the multi-dimensional\
    \ array that is returned from a database query:\n```php\n$iterator = fetchAllAssoc($sql,\
    \ $connection);\n$shallow = new RecursiveArrayIterator($iterator);\n```\n\n+ \
    \  16. Although this returns an iteration where each item represents a row from\
    \ the database query, in this case we wish to provide an iteration that will iterate\
    \ through all columns of all rows returned by the query. In order to accomplish\
    \ this, we'll need to roll out the big brass by way of a RecursiveIteratorIterator.\n\
    \n+   17. Monty Python fans will revel in the rich irony of this class name as\
    \ it brings back fond memories of the *The Department of Redundancy Department*.\
    \ Fittingly, this class causes our old friend the RecursiveArrayIterator class\
    \ to work overtime and perform a **deep** iteration through all levels of the\
    \ array:\n```php\n$deep = new RecursiveIteratorIterator($shallow);\n```\n\n# How\
    \ it works...\n\nAs a practical example, you can develop a test script which implements\
    \ filtering and pagination using iterators. For this illustration, you could call\
    \ the `chap_03_developing_functions_filtered_and_paginated.php` test code file.\n\
    \nFirst of all, following best practices, place the functions described above\
    \ into an include file called `chap_03_developing_functions_iterators_library.php`.\
    \ In the test script, be sure to include this file."
  merge: -1
  img_proc: true
