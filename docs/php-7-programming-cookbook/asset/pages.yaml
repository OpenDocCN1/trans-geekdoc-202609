- pgno: 246
  md: "> Objects could also be considered for conversion; however, it is difficult\
    \ to render object methods in XML. Properties can be represented, however, by\
    \ using the `get_object_vars()` function, which reads object properties into an\
    \ array.\n\n# **How to do it...**”\n\n+   1.  First, we define an `Application\\\
    Parse\\ConvertXml` class. This class will hold the methods that will convert from\
    \ XML to a PHP array, and vice versa. We will need both the `SimpleXMLElement`\
    \ and `SimpleXMLIterator` classes from the SPL:\n\n    ```\n    namespace Application\\\
    Parse;\n\n    use SimpleXMLIterator;\n    use SimpleXMLElement;\n\n    class ConvertXml\n\
    \    {\n    }\n    ```\n\n+   2.  Next, we define a `xmlToArray()` method that\
    \ will accept a `SimpleXMLIterator` instance as an argument. It will be called\
    \ recursively and will produce a PHP array from an XML document. We take advantage\
    \ of the `SimpleXMLIterator` ability to advance through the XML document, using\
    \ the `key()`, `current()`, `next()`, and `rewind()` methods to navigate:\n\n\
    \    ```\n    public function xmlToArray(SimpleXMLIterator $xml) : array\n   \
    \ {\n        $a = array();\n\n        for( $xml->rewind(); $xml->valid(); $xml->next()\
    \ ) {\n            if(!array_key_exists($xml->key(), $a)) {\n                $a[$xml->key()]\
    \ = array();\n            }\n\n            if ($xml->hasChildren()) {\n      \
    \          $a[$xml->key() ][] = $this->xmlToArray($xml->current());\n        \
    \    }\n            else{\n                $a[$xml->key() ] = (array) $xml->current()->attributes();\n\
    \                $a[$xml->key()][ 'value'] = strval($xml->current());\n      \
    \      }\n        }\n        return $a;\n    }\n    ```"
