    \ idea to have a unique column other than `$id` that can be used to uniquely identify\
    \ the new customer.\n\n+   In this example we have chosen the email column, and\
    \ thus need to implement a `fetchByEmail()` service method:\n\n```\npublic function\
    \ fetchByEmail($email)\n{\n    $stmt = $this->connection->pdo->prepare(\n    \
    \        Finder::select('customer')\n```"
