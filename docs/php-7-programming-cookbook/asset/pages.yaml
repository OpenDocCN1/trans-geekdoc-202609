    \ to continue parsing every tree and branch, from a given starting point, until\
    \ there are no more files or directories. It so happens there is a marvelous class,\
    \ `RecursiveIteratorIterator`, that does exactly that. By wrapping `RecursiveDirectoryIterator`\
    \ inside `RecursiveIteratorIterator`, we accomplish a complete traversal of any\
    \ directory tree.\n\n> **Warning!**\n\nBe very careful where you start the filesystem\
    \ traversal. If you start at the root directory, you could end up crashing your\
    \ server as the recursion process will not stop until all files and directories\
    \ have been located!\n\n# How to do it...\n\n+   1.  First, we define a `Application\\\
    Iterator\\Directory` class that defines the appropriate properties and constants\
    \ and uses external classes:\n\n    ```php\n    namespace Application\\Iterator;\n\
    \n    use Exception;\n    use RecursiveDirectoryIterator;\n    use RecursiveIteratorIterator;\n\
    \    use RecursiveRegexIterator;\n    use RegexIterator;\n\n    class Directory\n\
