  md: "# **How to do it… **\n\n+   1. Methods identified by the interface cannot contain\
    \ actual code implementations. You can, however, specify the data types of method\
    \ arguments.\n\n+   2. In this example, **ConnectionAwareInterface** identifies\
    \ a method, **setConnection()**, **which requires an instance of Connection as\
    \ an argument:**\n\n```\n```python\ninterface ConnectionAwareInterface\n{\n  \
    \  public function setConnection(Connection $connection);\n}\n```\n```\n\n+  \
    \ 3. To use the interface, add the keyword **implements** after the open line\
    \ that defines the class. We have defined two classes, **CountryList** and **CustomerList**,\
    \ both of which require access to the **Connection** class via a method, **setConnection()**.\
    \ In order to identify this dependency, both classes implement **ConnectionAwareInterface**:\n\
    \n```\n```python\nclass CountryList implements ConnectionAwareInterface\n{\n \
    \   protected $connection;\n    public function setConnection(Connection $connection)\n\
    \    {\n        $this->connection = $connection;\n    }\n    public function list()\n\
    \    {\n        $list = [];\n        $stmt = $this->connection->pdo->query(\n\
    \            'SELECT iso3, name FROM iso_country_codes');\n        while ($country\
    \ = $stmt->fetch(PDO::FETCH_ASSOC)) {\n            $list[$country['iso3']] = $country['name'];\n\
    \        }\n        return $list;\n    }\n}\n\nclass CustomerList implements ConnectionAwareInterface\n\
    {\n    protected $connection;\n    public function setConnection(Connection $connection)\n\
    \    {\n        $this->connection = $connection;\n    }\n    public function list()\n\
    \    {\n```\n```\n```"
