    \ the DateTime extension admirably suited to event generation:\n```php\nnamespace\
    \ Application\\Libn;\n\nuse DateTime;\nuse DatePeriod;\nuse DateInterval;\nuse\
    \ InvalidArgumentException;\n\nclass Event\n{\n    // code\n}\n```\n2. Next, we\
    \ define a series of useful class constants and properties. You will notice that\
    \ we defined most of the properties public in order to economize on the number\
    \ of getters and setters needed. The intervals are defined as `sprintf()` format\
    \ strings; `%d` will be substituted for a value:\n```php\nconst INTERVAL_DAY =\
    \ 'P%dD';\nconst INTERVAL_WEEK = 'P%dW';\nconst INTERVAL_MONTH = 'P%dM';\nconst\
