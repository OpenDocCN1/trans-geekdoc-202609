    # Creating a simple REST client


    REST clients use **HyperText Transfer Protocol (HTTP)** to generate requests to
    external web services. By changing the HTTP method, we can cause the external
    service to perform different operations. Although there are quite a few methods
    (or verbs) available, we will only focus on GET and POST. In this recipe, we will
    use the **Adapter** software design pattern to present two different ways of implementing
    a REST client.


