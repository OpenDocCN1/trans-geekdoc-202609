- pgno: 75
  md: '# 3


    Working with


    PHP Functional


    Programming


    In this chapter we will cover the following topics:


    +   - Developing functions

    - Hinting at data types

    - Using return value data typing

    - Using iterators

    - Writing your own iterator using generators


    # Introduction


    In this chapter we will consider recipes that take advantage of PHP''s **functional
    programming** capabilities. Functional, or **procedural**, programming is the
    traditional way PHP code was written prior to the introduction of the first implementation
    of **object-oriented programming (OOP)** in PHP version 4. Functional programming
    is where program logic is encapsulated into a series of discreet **functions**,
    which are generally stored in a separate PHP file. This file can then be included
    in any future scripts, allowing the functions that are defined to be called at
    will.'
  merge: -1
  img_proc: true
- pgno: 76
  md: "# **Developing functions**\n\nThe most difficult aspect is deciding how to\
    \ break up programming logic into functions. The mechanics of developing a function\
    \ in PHP, on the other hand, are quite easy. Just use the `function` keyword,\
    \ give it a name, and follow it with parentheses.\n\n# **How to do it...**\n\n\
    +   1. The code itself goes inside curly braces as follows:\n\n```\n```php\nfunction\
    \ someName ($parameter)\n{\n    $result = 'INIT';\n    // one or more statements\
    \ which do something\n    // to affect $result\n    $result .= ' and also ' .\
    \ $parameter;\n    return $result;\n}\n```\n```\n\n+   2. You can define one or\
    \ more **parameters**. To make one of them optional, simply assign a default value.\
    \ If you are not sure what default value to assign, use `NULL`:\n\n```\n```php\n\
    function someOtherName ($requiredParam, $optionalParam = NULL)\n{\n    $result\
    \ = 0;\n    $result += $requiredParam;\n    $result += $optionalParam ?? 0;\n\
    \    return $result;\n}\n```\n```\n\nYou cannot redefine functions. The only exception\
    \ is when duplicate functions are defined in separate namespaces. This definition\
    \ would generate an error:\n\n```\n```php\nfunction someTest ()\n{\n    return\
    \ 'TEST';\n}\nfunction someTest ($a)\n{\n    return 'TEST: ' . $a;\n}\n```\n```\n\
    \n![](img/39390f6d56c5a83b28db083a8bd5185c_76_0.png)"
  merge: -1
  img_proc: true
- pgno: 77
  md: "+   3.  If you don't know how many parameters will be supplied to your function,\
    \ or if you want to allow for an infinite number of parameters, use ... followed\
    \ by a variable name. All parameters supplied will appear as an array in the variable:\n\
    \n```\nfunction someInfinite(...$params)\n{\n    // any params passed go into\
    \ an array $params\n    return var_export($params, TRUE);\n}\n```\n\n+   4.  A\
    \ function can call itself. This is referred to as **recursion**. The following\
    \ function performs a recursive directory scan:\n\n```\nfunction someDirScan($dir)\n\
    {\n    // uses \"static\" to retain value of $list\n    static $list = array();\n\
    \    // get a list of files and directories for this path\n    $list = glob($dir\
    \ . DIRECTORY_SEPARATOR . '*');\n    // loop through\n    foreach ($list as $item)\
    \ {\n        if (is_dir($item)) {\n            $list = array_merge($list, someDirScan($item));\n\
    \        }\n    }\n    return $list;\n}\n```\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_77_0.png)\n\
    \n> Usage of the **static** keyword inside functions has been in the language\
    \ for more than 12 years. What **static** does is to initialize the variable once\
    \ (that is, at the time **static** is declared), and then retain the value between\
    \ function calls within the same request.\n\nIf you need to retain the value of\
    \ a variable between HTTP requests, make sure the PHP session has been started\
    \ and store the value in $_SESSION.\n\n+   5.  Functions are constrained when\
    \ defined within a PHP **namespace**. This characteristic can be used to your\
    \ advantage to provide additional logical separation between libraries of functions.\
    \ In order to *anchor* the namespace, you need to add the **use** keyword. The\
    \ following examples are placed in separate namespaces. Notice that even though\
    \ the function name is the same, there is no conflict as they are not visible\
    \ to each other."
  merge: -1
  img_proc: true
- pgno: 78
  md: "+   6. We define someFunction() in namespace Alpha. We save this to a separate\
    \ PHP file, chap_03_developing_functions_namespace_alpha.php:\n\n```\n<?php\n\
    namespace Alpha;\n\nfunction someFunction()\n{\n    echo __NAMESPACE__ . ':' .\
    \ __FUNCTION__ . PHP_EOL;\n}\n```\n\n+   7. We then define someFunction() in namespace\
    \ Beta. We save this to a separate PHP file, chap_03_developing_functions_namespace_beta.php:\n\
    \n```\n<?php\nnamespace Beta;\n\nfunction someFunction()\n{\n    echo __NAMESPACE__\
    \ . ':' . __FUNCTION__ . PHP_EOL;\n}\n```\n\n+   8. We can then call someFunction()\
    \ by prefixing the function name with the namespace name:\n\n```\ninclude ( _DIR__\
    \ . DIRECTORY_SEPARATOR . 'chap_03_developing_functions_namespace_alpha.php');\n\
    include ( _DIR__ . DIRECTORY_SEPARATOR . 'chap_03_developing_functions_namespace_beta.php');\n\
    echo Alpha\\someFunction();\necho Beta\\someFunction();\n```\n\n> **Best practice**\n\
    It is considered best practice to place function libraries (and classes too!)\
    \ into separate files: one file per namespace, and one class or function library\
    \ per file.\nIt is possible to define many classes or function libraries in a\
    \ single namespace. The only reason you would develop into a separate namespace\
    \ is if you want to foster logical separation of functionality."
  merge: -1
  img_proc: true
- pgno: 79
  md: '# How it works...


    It is considered best practice to place all logically related functions into a
    separate PHP file. Create a file called chap_03_developing_functions_library.php
    and place these functions (described previously) inside:


    +   - someName()

    - someOtherName()

    - someInfinite()

    - someDirScan()

    - someTypeHint()


    This file is then included in the code that uses these functions.


    ```

    include (__DIR__ . DIRECTORY_SEPARATOR . ''chap_03_developing_functions_library.php'');

    ```


    To call the someName() function, use the name and supply the parameter.


    ```

    echo someName(''TEST'');    // returns "INIT" and also TEST"

    ```


    You can call the someOtherName() function using one or two parameters, as shown
    here:


    ```

    echo someOtherName(1);     // returns  1

    echo someOtherName(1, 1);  //  returns 2

    ```


    The someInfinite() function accepts an infinite (or variable) number of parameters.
    Here are a couple of examples calling this function:


    ```

    echo someInfinite(1, 2, 3);

    echo PHP_EOL;

    echo someInfinite(22.22, ''A'', [''a'' => 1, ''b'' => 2]);

    ```'
