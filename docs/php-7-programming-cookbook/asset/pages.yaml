- pgno: 433
  md: '+   10. We use a similar approach for getDestColumns(). The big difference
    compared to getting a list of source columns is that we only want the columns
    for one specific destination table, which is critical if there''s more than one
    such table is defined. We do not need to check to see if $destCol is set as this
    is already taken care of in the constructor for FieldConfig:


    ```

    ```

    public function getDestColumns($table)

    {

    if (empty($this->destCols[$table])) {

    foreach ($this->getFields() as $field) {

    if ($field->getDestTable() == $table) {

    $this->destCols[$table][$field->getKey()] =

    $field->getDestCol();

    }

    }

    }

    }

    return $this->destCols[$table];

    }

    ```

    ```


    +   11. Finally, we define a method that accepts as a first argument an array
    representing one row of data from the source table. The second argument is the
    name of the destination table. The method produces an array of data ready to be
    inserted into the destination table.


    +   12. We had to make a decision as to which would take precedence: the default
    value (which could be provided by a callback), or data from the source table.
    We decided to test for a default value first. If the default comes back NULL,
    data from the source is used. Note that if further processing is required, the
    default should be defined as a callback.


    ```

    ```

    public function mapData($sourceData, $destTable)

    {

    $dest = array();

    foreach ($this->fields as $field) {

    if ($field->getDestTable() == $destTable) {

    $dest[$field->getDestCol()] = NULL;

    $default = $field->getDefault($sourceData);

    if ($default) {

    $dest[$field->getDestCol()] = $default;

    } else {

    $dest[$field->getDestCol()] =

    $sourceData[$field->getSource()];

    }

    }

    }

    return $dest;

    }

    ```

