  md: "# How to do it…\n\n+   1. An alternative to stdClass is to define an anonymous\
    \ class.\n\nIn the definition, you can define any properties and methods (including\
    \ magic methods). In this example, we define an anonymous class with two properties\
    \ and a magic method, `__construct()`:```php\n$a = new class (123.45, 'TEST')\
    \ {\n    public $total = 0;\n    public $test = '';\n    public function __construct($total,\
    \ $test)\n    {\n        $this->total = $total;\n        $this->test = $test;\n\
    \    }\n};```\n\n+   2. An anonymous class can extend any class.\n\nIn this example,\
    \ an anonymous class extends FilterIterator, and overrides both the `__construct()\
    \ and accept() methods. As an argument, it accepts ArrayIterator $b, which represents\
    \ an array of 10 to 100 in increments of 10. The second argument serves as a limit\
    \ on the output:```php\n$b = new ArrayIterator(range(10,100,10));\n$f = new class\
    \ ($b, 50) extends FilterIterator {\n    public $limit = 0;\n    public function\
    \ __construct($iterator, $limit)\n    {\n        $this->limit = $limit;\n    \
    \    parent::__construct($iterator);\n    }\n    public function accept()\n  \
    \  {\n        return ($this->current() <= $this->limit);\n    }\n};```\n\n+  \
    \ 3. An anonymous class can implement an interface.\n\nIn this example, an anonymous\
    \ class is used to generate an HTML color code chart. The class implements the\
    \ built-in PHP Countable interface. A count() method is defined, which is called\
    \ when this class is used with a method or function that requires Countable:```php\n\
    define('MAX_COLORS', 256 ** 3);\n\n$d = new class () implements Countable {```"
