    if (php_sapi_name() === 'cli-server'\n    && is_file(__DIR__ . '/parse_url(\n\
    $_SERVER['REQUEST_URI'], PHP_URL_PATH))\n) {\n    return false;\n}\n\nchdir(dirname(__DIR__));\n\
    session_start();\n$_SESSION['time'] = time();\n$appDir = realpath(__DIR__ . '/../..');\n\
    $loader = require 'vendor/autoload.php';\n$loader->add('Application', $appDir);\n\
    $container = require 'config/container.php';\n$app = $container->get(\\Zend\\\
    Expressive\\Application::class);\n$app->run();\n```\n\nYou will then need to create\
    \ a wrapper class that invokes our session validator middleware. Create a SessionValidateAction.php\
    \ file that needs to go in the /path/to/source/for/this/chapter/expressive/src/App/Action\
    \ folder. For the purposes of this illustration, set the stop time parameter to\
    \ a short duration. In this case, time() + 10 gives you 10 seconds:\n\n```\nnamespace\
    \ App\\Action;\nuse Application\\MiddleWare\\Session\\Validator;\nuse Zend\\Diactoros\\\
    \ { Request, Response };\nuse Psr\\Http\\Message\\ResponseInterface;\nuse Psr\\\
    Http\\Message\\ServerRequestInterface;\nclass SessionValidateAction\n{\n    public\
    \ function __invoke(ServerRequestInterface $request,\n    ResponseInterface $response,\
    \ callable $next = null)\n    {\n        $inbound = new Response();\n        $validator\
    \ = new Validator($request, time()+10);\n        $inbound = $validator($request,\
    \ $response);\n        if ($inbound->getStatusCode() != 200) {\n            session_destroy();\n\
    \            setcookie('PHPSESSID', 0, time()-300);\n            $params = json_decode(\n\
    \                $inbound->getBody()->getContents(), TRUE);\n```"
