- pgno: 56
  md: "+   7. Adding a new element inside the `foreach()` loop, once the array iteration\
    \ by reference is complete, is also problematic in PHP 5. This behavior has been\
    \ made consistent in PHP 7. The following code example demonstrates this:\n\n\
    ```\n$a = [1];\nforeach($a as &$v) {\n    printf(\"%2d -\\n\", $v);\n    $a[1]=2;\n\
    }\n```\n\n+   8. We will observe the following output:\n\n| PHP 5 | PHP 7 |\n\
    | :--- | :--- |\n| 1 - | 1 - |\n| 2 - | 2 - |\n\n\n+   9. Another example of bad\
    \ PHP 5 behavior addressed in PHP 7, during array iteration by reference, is the\
    \ use of functions that modify the array, such as `array_push()`, `array_pop()`,\
    \ `array_shift()`, and `array_unshift()`.\nHave a look at this example:\n\n```\n\
    $a=[1,2,3,4];\nforeach($a as &$v) {\n    echo \"$v\\n\";\n    array_pop($a);\n\
    }\n```\n\n+   10. You will observe the following output:\n\n| PHP 5 | PHP 7 |\n\
    | :--- | :--- |\n| 1 | 1 |\n| 2 | 2 |\n| 1 | |\n| 1 | |\n\n\n+   11. Finally,\
    \ we have a case where you are iterating through an array by reference, with a\
    \ nested `foreach()` loop, which itself iterates on the same array by reference.\
    \ In PHP 5 this construct simply did not work. In PHP 7 this has been fixed. The\
    \ following block of code demonstrates this behavior:\n\n```\n$a = [0, 1, 2, 3];\n\
    foreach ($a as &$x) {\n    foreach ($a as &$y) {\n        echo \"$x - $y\\n\"\
    ;\n        if ($x == 0 && $y == 1) {\n            unset($a[1]);\n        }\n```"
