- pgno: 267
  md: '# How it works...


    Define the following classes, which were discussed in the previous recipe:


    +   - Application\Web\AbstractHttp

    - Application\Web\Request

    - Application\Web\Received


    You can then define the following classes, described in this recipe, summarized
    in this table:


    | Class Application\Web\* | Discussed in these steps |

    | :--- | :--- |

    | Response | 2 |

    | Rest\Server | 3 - 8 |

    | Rest\AbstractApi | 9 |

    | Rest\ApiInterface | 10 |

    | Rest\CustomerApi | 11 - 16 |


    You are now free to develop your own API class. If you choose to follow the illustration
    *Application\Web\Rest\CustomerApi*, however, you will need to also be sure to
    implement these classes, covered in Chapter 5, *Interacting with a Database*:


    +   - Application\Entity\Customer

    - Application\Database\Connection

    - Application\Database\CustomerService


    You can now define a `chap_07_simple_rest_server.php` script that invokes the
    REST server:


    ```

    ```php

    <?php

    $dbParams = include __DIR__ . ''/../../config/db.config.php'';

    require __DIR__ . ''/../../Application/Autoload/Loader.php'';

    Application\Autoload\Loader::init(__DIR__ . ''../'');

    use Application\Web\Rest\Server;

    use Application\Web\Rest\CustomerApi;

    $apiKey = include __DIR__ . ''/api_key.php'';

    $server = new Server(new CustomerApi($apiKey), $dbParams, ''id'');

    $server->listen();

    ```

    ```


    You can then use the built-in PHP 7 development server to listen on port `8080`
    for REST requests:


    ```

    `php -S localhost:8080 chap_07_simple_rest_server.php`

    ```'
