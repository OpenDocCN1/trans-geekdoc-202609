- pgno: 285
  md: '# # Getting the locale from browser data


    In order to improve the user experience on a website, it''s important to display
    information in a format that is acceptable in the user''s locale. **Locale** is
    a generic term used to indicate an area of the world. An effort in the I.T. community
    has been made to codify locales using a two-part designation consisting of codes
    for both language and country. But when a person visits your website, how do you
    know their locale? Probably the most useful technique involves examining the HTTP
    language header.


    # ## How to do it...


    +   1. In order to encapsulate locale functionality, we will assume a class, `Application\I18n\Locale`.
    We will have this class extend an existing class, `Locale`, which is part of the
    PHP `Intl` extension.


    > Note

    **I18n** is a common abbreviation for **Internationalization**. (Count the number
    of letters!)


    ```

    namespace Application\I18n;

    use Locale as PhpLocale;

    class Locale extends PhpLocale

    {

    const FALLBACK_LOCALE = ''en'';

    // some code

    }

    ```


    +   2. To get an idea of what an incoming request looks like, use `phpinfo (INFO_VARIABLES)`.
    Be sure to disable this function immediately after testing as it gives away too
    much information to potential attackers:

    `<?php phpinfo(INFO_VARIABLES); ?>`'
  merge: -1
  img_proc: true
- pgno: 286
  md: "# Working with Date/Time and International Aspects\n\n3. Locale information\
    \ is stored in `$\\_SERVER`[`HTTP\\_ACCEPT\\_LANGUAGE`]. The value will take this\
    \ general form: ll-CC,r1;q=0.n, ll-CC,r1;q=0.n, as defined in this table:\n\n\
    | Abbreviation | Meaning |\n|---|---|\n| ll | Two-character lowercase code representing\
    \ the language. |\n| - | Separates language from country in the locale code ll-CC.\
    \ |\n| CC | Two-character uppercase code representing the country. |\n| , | Separates\
    \ locale code from fallback **root locale** code (usually the same as the language\
    \ code). |\n| r1 | Two-character lowercase code representing the suggested root\
    \ locale. |\n| ; | Separates locale information from quality. If quality is missing,\
    \ default is q=1 (100%) probability; this is preferred. |\n| q | Quality. |\n\
    | 0.n | Some value between 0.00 and 1.0. Multiply this value by 100 to get the\
    \ percentage of probability that this is the actual language preferred by this\
    \ visitor. |\n\n4. There can easily be more than one locale listed. For example,\
    \ the website visitor could have multiple languages installed on their computer.\
    \ It so happens that the PHP Locale class has a method, acceptFromHttp(), which\
    \ reads the Accept-language header string and gives us the desired setting:\n\n\
    ```\n```python\nprotected $localeCode;\npublic function setLocaleCode($acceptLangHeader)\n\
    {\n    $this->localeCode =\n        $this->acceptFromHttp($acceptLangHeader);\n\
    }\n```\n```\n\n5. We can then define the appropriate getters. The get AcceptLanguage()\
    \ method returns the value from `$\\_SERVER`[`HTTP\\_ACCEPT\\_LANGUAGE`]:\n\n\
    ```\n```python\npublic function getAcceptLanguage()\n{\n    return $_SERVER['HTTP_ACCEPT_LANGUAGE']\
    \ ??\n           self::FALLBACK_LOCALE;\n}\npublic function getLocaleCode()\n\
    {\n    return $this->localeCode;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 287
  md: '+   6.  Next we define a constructor that allows us to "manually" set the locale.
    Otherwise, the locale information is drawn from the browser:

    public function __construct($localeString = NULL)

    {

    if ($localeString) {

    $this->setLocaleCode($localeString);

    } else {

    $this->setLocaleCode($this->getAcceptLanguage());

    }

    }


    +   7.  Now comes the big decision: what to do with this information! This is
    covered in the next few recipes.


    ![](img/39390f6d56c5a83b28db083a8bd5185c_287_0.png)


    Even though a visitor appears to accept one or more languages, that visitor does
    not necessarily want contents in the language/locale indicated by their browser.
    Accordingly, although you can certainly set the locale given this information,
    you should also provide them with a static list of alternative languages.


    # How it works...


    In this illustration, let''s take three examples:


    +   information derived from the browser

    apreset locale fr-FR

    a string taken from RFC 2616: da, en-gb;q=0.8, en;q=0.7


    Place the code from steps 1 to 6 into a file, Locale.php, which is in the Application\\
    I18n folder.


    Next, create a file, chap_08_getting_locale_from_browser.php, which sets up autoloading
    and uses the new class:


    ```

    <?php

    require __DIR__ . ''/../Application/Autoload/Loader.php'';

    Application\Autoload\Loader::init(__DIR__ . ''/../'');

    use Application\I18n\Locale;

    ```


    Now you can define an array with the three test locale strings:


    ```

    $locale = [NULL, ''fr-FR'', ''da, en-gb;q=0.8, en;q=0.7''];

    ```'
  merge: -1
  img_proc: true
- pgno: 288
  md: "# Working with Date/Time and International Aspects\n\nFinally, loop through\
    \ the three locale strings, creating instances of the new class. Echo the value\
    \ returned from getLocaleCode() to see what choice was made:\n\n```\n```\n   \
    \ echo '<table>';\n    foreach ($locale as $code) {\n        $locale = new Locale($code);\n\
    \        echo '<tr>\n            <td>' . htmlspecialchars($code) . '</td>\n  \
    \          <td>' . $locale->getLocaleCode() . '</td>\n        </tr>';\n    }\n\
    \    echo '</table>';\n```\n```\n\nHere is the result (with a little bit of styling):\n\
    \n![](img/39390f6d56c5a83b28db083a8bd5185c_288_0.png)\n\n# See also\n\n+   - For\
    \ information on the PHP Locale class, see http://php.net/manual/en/class.locale.php\n\
    - For more information on the Accept-Language header, see section 14.4 of RFC\
    \ 2616: https://www.w3.org/Protocols/rfc2616/rfc2616-sec14.html\n\n# Formatting\
    \ numbers by locale\n\nNumeric representations can vary by locale. As a simple\
    \ example, in the UK one would see the number three million, eighty thousand,\
    \ five hundred and twelve, and ninety-two one hundredths as follows:\n\n3,080,512.92.\n\
    \nIn France, however, the same number might appear like so:\n\n3 080 512,92"
  merge: -1
  img_proc: true
- pgno: 289
  md: "# How to do it...\n\nBefore you can represent a number in a locale-specific\
    \ manner, you need to determine the locale. This can be accomplished using the\
    \ Application\\I18n\\Locale class discussed in the previous recipe. The locale\
    \ can be set manually or from header information.\n\n+   Next, we will make use\
    \ of the format() method of the NumberFormatter class, to both output and parse\
    \ numbers in a locale-specific format. First we add a property that will contain\
    \ an instance of the NumberFormatter class:\n\n```\nuse NumberFormatter;\nprotected\
    \ $numberFormatter;\n```\n\nOur initial thought would be to consider using the\
    \ PHP function setlocale() to produce numbers formatted according to locale. The\
    \ problem with this legacy approach, however, is that everything will be considered\
    \ based on this locale. This could introduce problems dealing with data that is\
    \ stored according to database specifications. Another issue with setlocale()\
    \ is that it is based on outdated standards, including RFC 1766 and ISO 639. Finally,\
    \ setlocale() is highly dependent on operating system locale support, which will\
    \ make our code non-portable.\n\n+   Normally, the next step would be to set $numberFormatter\
    \ in the constructor. The problem with this approach, in the case of our Application\\\
    I18n\\Locale class, is that we would end up with a top-heavy class, as we will\
    \ also need to perform currency and date formatting as well. Accordingly, we add\
    \ a getter that first checks to see whether an instance of NumberFormatter has\
    \ already been created. If not, an instance is created and returned. The first\
    \ argument in the new NumberFormatter is the locale code. The second argument,\
    \ NumberFormatter::DECIMAL, represents what type of formatting we need:\n\n```\n\
    public function getNumberFormatter()\n{\n    if (!$this->numberFormatter) {\n\
    \        $this->numberFormatter =\n            new NumberFormatter($this->getLocaleCode(),\n\
    \                NumberFormatter::DECIMAL);\n    }\n    return $this->numberFormatter;\n\
    }\n```\n\n+   We then add a method that, given any number, will produce a string\
    \ that represents that number formatted according to the locale:\n\n```\npublic\
    \ function formatNumber($number)\n{\n    return $this->getNumberFormatter()->format($number);\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 290
  md: "+   4. Next we add a method that can be used to parse numbers according to\
    \ the locale, producing a native PHP numeric value. Please note that the result\
    \ might not return FALSE on parse failure depending on the server's ICU version:\n\
    \n```\npublic function parseNumber($string)\n{\n    $result = $this->getNumberFormatter()->parse($string);\n\
    \    return ($result) ? $result : self::ERROR_UNABLE_TO_PARSE;\n}\n```\n\n# How\
    \ it works...\n\nMake the additions to the Application\\\\I18n\\\\Locale class\
    \ as discussed in the preceding bullet points. You can then create a chap_08_formatting_numbers.php\
    \ file, which sets up autoloading and uses this class:\n\n```\n<?php\n    require\
    \ _DIR_ . '/../Application/Autoload/Loader.php';\n    Application\\Autoload\\\
    Loader::init(_DIR_ . '../');\n    use Application\\I18n\\Locale;\n```\n\nFor this\
    \ illustration, create two Locale instances, one for the UK, the other for France.\
    \ You can also designate a large number to be used for testing:\n\n```\n$localeFr\
    \ = new Locale('fr_FR');\n$localeUk = new Locale('en_GB');\n$number   = 1234567.89;\n\
    ?>\n```\n\nFinally, you can wrap the formatNumber() and parseNumber() methods\
    \ in the appropriate HTML display logic and view the results:\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <title>PHP 7 Cookbook</title>\n  <meta http-equiv=\"\
    content-type\"\n    content=\"text/html;charset=utf-8\" />\n  <link rel=\"stylesheet\"\
    \ type=\"text/css\"\n    href=\"php7cookbook_html_table.css\">\n</head>\n<body>\n\
    \  <table>\n    <tr>\n```"
  merge: -1
  img_proc: true
