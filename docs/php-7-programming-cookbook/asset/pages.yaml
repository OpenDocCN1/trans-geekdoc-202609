  md: "![](img/39390f6d56c5a83b28db083a8bd5185c_178_0.png)\n\nThe **relational model**,\
    \ upon which modern RDBMS systems are based, was first described by the mathematician\
    \ Edgar F. Codd in 1969. The first commercially viable systems evolved in the\
    \ mid-to-late 1970s. So, in other words, RDBMS technology is over 40 years old!\n\
    \n# How to do it...\n\n+   First of all, we need to design a class which will\
    \ house our query logic. If you are following the Domain Model, this class might\
    \ be called a **repository**. Alternatively, to keep things simple and generic,\
    \ we could simply call the new class Application\\\\Database\\\\CustomerService.\
    \ The class will accept an Application\\\\Database\\\\Connection instance as an\
    \ argument:\n\n```\nnamespace Application\\\\Database;\n\nuse Application\\\\\
    Entity\\\\Customer;\n\nclass CustomerService\n{\n    protected $connection;\n\n\
    \    public function __construct(Connection $connection)\n    {\n        $this->connection\
    \ = $connection;\n    }\n}\n```\n\n+   Now we will define a `fetchById()` method,\
    \ which takes a customer ID as an argument, and returns a single Application\\\
    \\Entity\\\\Customer instance or boolean **FALSE** on failure. At first glance,\
    \ it would seem a no-brainer to simply use PDOStatement::fetchObject() and specify\
    \ the entity class as an argument:\n\n```\npublic function fetchById($id)\n{\n\
    \    $stmt = $this->connection->pdo\n            ->prepare(Finder::select('customer')\n\
    \                       ->where('id = :id')->getSql());\n    $stmt->execute(['id'\
    \ => (int) $id]);\n    return $stmt->fetchObject('Application\\\\Entity\\\\Customer');\n\
    }\n```"
