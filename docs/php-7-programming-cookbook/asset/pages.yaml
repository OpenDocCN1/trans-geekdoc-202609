- pgno: 429
  md: "![](img/39390f6d56c5a83b28db083a8bd5185c_429_0.png)\n\n# ## Defining a mapper\n\
    \nA **mapper** or **data mapper** works in much the same manner as a hydrator:\
    \ converting data from one model, be it array or object, into another. A critical\
    \ difference is that the hydrator is generic and does not need to have object\
    \ property names pre-programmed, whereas the mapper is the opposite: it needs\
    \ precise information on property names for both models. In this recipe we will\
    \ demonstrate the use of a mapper to convert data from one database table into\
    \ another.\n\n# ### How to do it...\n\n+   1. We first define a `Application\\\
    Database\\Mapper\\FieldConfig` class, which contains mapping instructions for\
    \ individual fields. We also define appropriate class constants:\n\n```\nnamespace\
    \ Application\\Database\\Mapper;\nuse InvalidArgumentException;\nclass FieldConfig\n\
    {\n    const ERROR_SOURCE =\n        'ERROR: need to specify destTable and/or\
    \ source';\n    const ERROR_DEST = 'ERROR: need to specify either '\n        .\
    \ 'both destTable and destCol or neither';\n```"
  merge: -1
  img_proc: true
- pgno: 430
  md: "2.  Key properties are defined along with the appropriate class constants.\
    \ `$key` is used to identify the object. `$source` represents the column from\
    \ the source database table. `$destTable` and `$destCol` represent the target\
    \ database table and column. `$default`, if defined, contains a default value\
    \ or a callback that produces the appropriate value:\n```cpp\npublic $key;\npublic\
    \ $source;\npublic $destTable;\npublic $destCol;\npublic $default;\n```\n\n3.\
    \  We now turn our attention to the constructor, which assigns default values,\
    \ builds the key, and checks to see that either or both `$source` or `$destTable`\
    \ and `$destCol` are defined:\n```cpp\npublic function __construct($source = NULL,\n\
    \                              $destTable = NULL,\n                          \
    \    $destCol   = NULL,\n                              $default   = NULL)\n{\n\
    \    // generate key from source + destTable + destCol\n    $this->key = $source\
    \ . '.' . $destTable . '.' . $destCol;\n    $this->source = $source;\n    $this->destTable\
    \ = $destTable;\n    $this->destCol = $destCol;\n    $this->default = $default;\n\
    \    if (($destTable && !$destCol) ||\n        (!$destTable && $destCol)) {\n\
    \        throw new InvalidArgumentException(self::ERROR_DEST);\n    }\n    if\
    \ (!$destTable && !$source) {\n        throw new InvalidArgumentException(\n \
    \           self::ERROR_SOURCE);\n    }\n}\n```\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_430_0.png)\n\
    \n> Note that we allow source and destination columns to be NULL. The reason for\
    \ this is that we might have a source column that has no place in the destination\
    \ table. Likewise, there might be mandatory columns in the destination table that\
    \ are not represented in the source table."
  merge: -1
  img_proc: true
