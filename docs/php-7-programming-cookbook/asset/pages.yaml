  md: '# See also


    For more information on the protection of fonts as intellectual property, refer
    to the article present at `https://en.wikipedia.org/wiki/Intellectual_property_protection_of_typefaces`.


    # Encrypting/decrypting without mcrypt


    It is a little-known fact among members of the general PHP community that the
    `mcrypt` extension, the core of most PHP-based encryption considered secure, is
    anything but secure. One of the biggest issues, from a security perspective, is
    that the `mcrypt` extension requires advanced knowledge of cryptography to successfully
    operate, which few programmers have. This leads to gross misuse and ultimately
    problems such as a 1 in 256 chance of data corruption. Not good odds. Furthermore,
    developer support for `libmcrypt`, the core library upon which the `mcrypt` extension
    is based, was *abandoned* in 2007, which means the code base is out-of-date, bug-ridden,
    and has no mechanism to apply patches. Accordingly, it is extremely important
    to understand how to perform strong encryption/decryption *without* using `mcrypt`!


    # How to do it...


    +   1.  The solution to the problem posed previously, in case you''re wondering,
    is to use `openssl`. This extension is well maintained, and has modern and very
    strong encryption/decryption capabilities.


    > **Important**


    In order to use any `openssl*` functions, the `openssl` PHP extension must be
    compiled and enabled! In addition, you will need to install the latest OpenSSL
    package on your web server.


    +   2.  First, you will need to determine which cipher methods are available on
    your installation. For this purpose, you can use the `openssl_get_cipher_methods()`
    command. Examples will include algorithms based on **Advanced Encryption Standard**
    (AES), **BlowFish** (BF), **CAMELLIA**, **CAST5**, **Data Encryption Standard**
    (DES), **Rivest Cipher** (RC) (also affectionately known as **Ron''s Code**),
    and **SEED**. You will note that this method shows cipher methods duplicated in
    upper and lowercase.'
  merge: -1
  img_proc: true
- pgno: 498
  md: '+   3. Next, you will need to figure out which method is most appropriate for
    your needs. Here is a table that gives a quick summary of the various methods:


    | Method | Published | Key size (bits) | Key block size (bytes) | Notes |

    | :--- | :--- | :--- | :--- | :--- |

    | camellia | 2000 | 128, 192, 256 | 16 | Developed by Mitsubishi and NTT |

    | aes | 1998 | 128, 192, 256 | 16 | Developed by Joan Daemen and Vincent Rijmen.
    Originally submitted as Rijndael |

    | seed | 1998 | 128 | 16 | Developed by the Korea Information Security Agency
    |

    | cast5 | 1996 | 40 to 128 | 8 | Developed by Carlisle Adams and Stafford Tavares
    |

    | bf | 1993 | 1 to 448 | 8 | Designed by Bruce Schneier |

    | rc2 | 1987 | 8 to 1,024 defaults to 64 | 8 | Designed by Ron Rivest (one of
    the core founders of RSA) |

    | des | 1977 | 56 (+8 parity bits) | 8 | Developed by IBM, based on work done
    by Horst Feistel |


    +   4. Another consideration is what your preferred block cipher **mode of operation**
    is. Common choices are summarized in this table:


    | Mode | Stands For | Notes |

    | :--- | :--- | :--- |

    | ECB | Electronic Code Book | Does not require initialization vector (IV); supports
    parallelization for both encryption and decryption; simple and fast; does not
    hide data patterns; not recommended!!! |

    | CBC | Cipher Block Chaining | Requires IV; subsequent blocks, even if identical,
    are XOR''ed with previous block, resulting in better overall encryption; if the
    IVs are predictable, the first block can be decoded, leaving remaining message
    exposed; message must be padded to a multiple of the cipher block size; supports
    parallelization only for decryption |

    | CFB | Cipher Feedback | Close relative of CBC, except that encryption is performed
    in reverse |'
  merge: -1
  img_proc: true
- pgno: 499
  md: '| Mode | Stands For | Notes |

    |---|---|---|

    | OFB | Output Feedback | Very symmetrical: encrypt and decrypt are the same;
    does not supports parallelization at all |

    | CTR | Counter | Similar in operation to OFB; supports parallelization for both
    encryption and decryption |

    | CCM | Counter with CBC-MAC | Derivative of CTR; only designed for block length
    of 128 bits; provides authentication and confidentiality; **CBC-MAC** stands for
    **Cipher Block Chaining - Message Authentication Code** |

    | GCM | Galois/Counter Mode | Based on CTR mode; should use a different IV for
    each stream to be encrypted; exceptionally high throughput (compared to other
    modes); supports parallelization for both encryption and decryption |

    | XTS | XEX-based Tweaked-codebook mode with ciphertext Stealing | Relatively
    new (2010) and fast; uses two keys; increases the amount of data that can be securely
    encrypted as one block |


    +   5. Before choosing a cipher method and mode, you will also need to determine
    whether the encrypted contents needs to be unencrypted outside of your PHP application.
    For example, if you are storing database credentials encrypted into a standalone
    text file, do you need to have the ability to decrypt them from the command line?
    If so, make sure that the cipher method and operation mode you choose are supported
    by the target operating system.


    +   6. The number of bytes supplied for the **IV** varies according to the cipher
    method chosen. For best results, use `random_bytes()` (new in PHP 7), which returns
    a true **CSPRNG** sequence of bytes. The length of the IV varies considerably.
    Try a size of 16 to start with. If a `warning` is generated, the correct number
    of bytes to be supplied for that algorithm will be shown, so adjust the size accordingly:


    ```

    $iv = random_bytes(16);

    ```'
  merge: -1
  img_proc: true
- pgno: 500
  md: "7. To perform encryption, use `openssl_encrypt()`. Here are the parameters\
    \ that should be passed:\n\n| Parameter | Notes |\n| :--- | :--- |\n| Data | Plain\
    \ text you need to encrypt. |\n| Method | One of the methods you identified using\
    \ `openssl_get_cipher_methods()`. Identified as follows:*method_key_size-cipher_mode*<br><br>So,\
    \ for example, if you want a method of AES, a key size of 256, and GCM mode, you\
    \ would enter `aes-256-gcm`. |\n| Password | Although documented as *password*,\
    \ this parameter can be viewed as a *key*. Use `random_bytes()` to generate a\
    \ key with a number of bytes to match the desired key size. |\n| Options | Until\
    \ you gain more experience with openssl1 encryption, it is recommended you stick\
    \ with the default value of 0. |\n| IV | Use `random_bytes()` to generate an IV\
    \ with a number of bytes to match the cipher method. |\n\n8. As an example, suppose\
    \ you wanted to choose the AES cipher method, a key size of 256, and XTS mode.\
    \ Here is the code used to encrypt:\n\n```\n```\n$plainText = 'Super Secret Credentials';\n\
    $key = random_bytes(16);\n$method = 'aes-256-xts';\n$cipherText = openssl_encrypt($plainText,\
    \ $method, $key, 0, $iv);\n```\n```\n\n9. To decrypt, use the same values for\
    \ $key and $iv, along with the `openssl_decrypt()` function:\n\n```\n```\n$plainText\
    \ = openssl_decrypt($cipherText, $method, $key, 0, $iv);\n```\n```\n\n# How it\
    \ works...\n\nIn order to see which cipher methods are available, create a PHP\
    \ script called `chap_12_openssl1_encryption.php` and run this command:\n\n```\n\
    ```\n<?php\n  echo implode(',', openssl_get_cipher_methods());\n```\n```"
  merge: -1
  img_proc: true
