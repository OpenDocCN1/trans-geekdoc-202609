  md: "```\n$this->destTable = $destTable;\n$this->fields = $fields;\n}\n```\n\n+\
    \   7. We then define getters and setters for these properties:\n```php\npublic\
    \ function getSourceTable()\n{\n    return $this->sourceTable;\n}\npublic function\
    \ setSourceTable($sourceTable)\n{\n    $this->sourceTable = $sourceTable;\n}\n\
    // etc.\n```\n\n+   8. For field configuration, we also need to provide the ability\
    \ to add an individual field. There is no need to supply the key as a separate\
    \ argument as this can be obtained from the `FieldConfig` instance:\n```php\n\
    public function addField(FieldConfig $field)\n{\n    $this->fields[$field->getKey()]\
    \ = $field;\n    return $this;\n}\n```\n\n+   9. It is extremely important to\
    \ obtain an array of source column names. The problem is that the source column\
    \ name is a property buried in a `FieldConfig` object. Accordingly, when this\
    \ method is called, we loop through the array of `FieldConfig` objects and invoke\
    \ `getSource()` on each one to obtain the source column name:\n```php\npublic\
    \ function getSourceColumns()\n{\n    if (!isset($this->sourceCols) {\n      \
    \  $this->sourceCols = array();\n        foreach ($this->getFields() as $field)\
    \ {\n            if (!empty($field->getSource())) {\n                $this->sourceCols[$field->getKey()]\
    \ =\n                    $field->getSource();\n            }\n        }\n    }\n\
    \    return $this->sourceCols;\n}\n```"
