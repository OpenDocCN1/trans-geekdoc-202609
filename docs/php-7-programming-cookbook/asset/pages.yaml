- pgno: 54
  md: "The reason for the errors is that PHP 5 parses inconsistently, and arrives\
    \ at the wrong conclusion regarding the state of the variable variables requested\
    \ (as previously mentioned). Now you can **go** ahead and add the remaining examples,\
    \ as shown in steps 5 and 6. If you then run this script in PHP 7, the results\
    \ described will appear, as shown here:\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_54_0.png)\n\
    \n# See also\n\nFor more information on parsing, please consult the RFC, which\
    \ addresses **Uniform Variable Syntax**, and can be viewed at `https://wiki.php.net/rfc/uniform_variable_syntax`.\n\
    \n# Understanding differences in foreach() handling\n\nIn certain relatively obscure\
    \ circumstances, the behavior of code inside a `foreach()` loop will vary between\
    \ PHP 5 and PHP 7. First of all, there have been massive internal improvements,\
    \ which means that in terms of sheer speed, processing inside the `foreach()`\
    \ loop will be much faster running under PHP 7, compared with PHP 5. Problems\
    \ that are noticed in PHP 5 include the use of `current()`, and `unset()` on the\
    \ array inside the `foreach()` loop. Other problems have to do with passing values\
    \ by reference while manipulating the array itself.\n\n# How to do it...\n\n+\
    \   1. Consider the following block of code:\n\n```\n``` php\n$a = [1, 2, 3];\n\
    foreach ($a as $v) {\n  printf(\"%2d\\n\", $v);\n  unset($a[1]);\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 55
  md: "+   2. In both PHP 5 and 7, the output would appear as follows:\n   1\n   2\n\
    \   3\n\n+   3. If you add an assignment before the loop, however, the behavior\
    \ changes:\n```php\n$a = [1, 2, 3];\n$b = &$a;\nforeach ($a as $v) {\n    printf(\"\
    %2d\\n\", $v);\n    unset($a[1]);\n}\n```\n\n+   4. Compare the output of PHP\
    \ 5 and 7:\n\n| PHP 5 | PHP 7 |\n| :---- | :---- |\n| **1**   | **1**   |\n| **3**\
    \   | **2**   |\n|       | **3**   |\n\n+   5. Working with functions that reference\
    \ the internal array pointer also caused inconsistent behavior in PHP 5. Take\
    \ the following code example:\n```php\n$a = [1, 2, 3];\nforeach($a as &$v) {\n\
    \    printf(\"%2d - %2d\\n\", $v, current($a));\n}\n```\n\n> Every array has an\
    \ internal pointer to its current element starting from 1, `current()` returns\
    \ the current element in an array.\n\n+   6. Notice that the output running in\
    \ PHP 7 is normalized and consistent:\n\n| PHP 5   | PHP 7   |\n| :------ | :------\
    \ |\n| **1 - 2** | **1 - 1** |\n| **2 - 3** | **2 - 1** |\n| **3 - 0** | **3 -\
    \ 1** |"
  merge: -1
