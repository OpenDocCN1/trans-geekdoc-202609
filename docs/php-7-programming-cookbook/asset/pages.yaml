  md: "+   9.  **Path** is the part of the URI that follows the DNS address. According\
    \ to PSR-7, this must be encoded. We use the *rawurlencode()* PHP function as\
    \ it is compliant with RFC 3986. We cannot just encode the entire path, however,\
    \ as the path separator (that is, /) would also get encoded! Accordingly, we need\
    \ to first break it up using *explode()*, encode the parts, and then reassemble\
    \ it:\n\n```\n```\npublic function getPath()\n{\n    if (empty($this->urlParts['path']))\
    \ {\n        return '';\n    }\n    return implode('/', array_map(\"rawurlencode\"\
    ,\n        explode('/', $this->urlParts['path'])));\n}\n```\n```\n\n+   10. Next,\
    \ we define a method to retrieve the *query* string (that is, from $_GET). These\
