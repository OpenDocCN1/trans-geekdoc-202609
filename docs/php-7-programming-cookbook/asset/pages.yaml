  md: "The next image displays the customer list portion of the output:\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_511_0.png)\n\
    \n# Universal exception handler\n\nExceptions are especially useful when used\
    \ in conjunction with code in a `try`/`catch` block. Using this construct, however,\
    \ can be awkward in some situations, making code virtually unreadable. Another\
    \ consideration is that many classes end up throwing exceptions that you have\
    \ not anticipated. In such cases, it would be highly desirable to have some sort\
    \ of fallback exception handler.\n\n# How to do it...\n\n+   1. First, we define\
    \ a generic exception handling class, `Application\\Error\\Handler`:\n```cpp\n\
    namespace Application\\Error;\nclass Handler\n{\n    // code goes here\n}\n```\n\
    \n+   2. We define properties that represents a log file. If the name is not supplied,\
    \ it is named after the year, month, and day. In the constructor, we use `set_exception_handler()`\
    \ to assign the `exceptionHandler()` method (in this class) as the fallback handler:\n\
    ```cpp\nprotected $logFile;\npublic function __construct(\n    $logFileDir = NULL,\
    \ $logFile = NULL)\n```"
  merge: -1
  img_proc: true
