- pgno: 329
  md: '# # 9

    ## Developing Middleware


    In this chapter, we will cover the following topics:


    +   ► Authenticating with middleware

    ► Using middleware to implement access control

    ► Improving performance using the cache

    ► Implementing routing

    ► Making inter-framework system calls

    ► Using middleware to cross languages


    # ## Introduction


    As often happens in the IT industry, terms get invented, and then used and abused.
    The term **middleware** is no exception. Arguably the first use of the term came
    out of the **Internet Engineering Task Force (IETF)** in the year 2000. Originally,
    the term was applied to any software which operates between the transport (that
    is, TCP/IP) and the application layer. More recently, especially with the acceptance
    of **PHP Standard Recommendation number 7 (PSR-7)**, middleware, specifically
    in the PHP world, has been applied to the web client-server environment.


    ![](img/39390f6d56c5a83b28db083a8bd5185c_329_0.png)


    The recipes in this section will make use of the concrete classes defined in *Appendix,
    Defining PSR-7 Classes*.'
  merge: -1
  img_proc: true
- pgno: 330
  md: "# Authenticating with middleware\n\nOne very important usage of middleware\
    \ is to provide authentication. Most web-based applications need the ability to\
    \ verify a visitor via username and password. By incorporating PSR-7 standards\
    \ into an authentication class, you will make it generically useful across the\
    \ board, so to speak, being secure enough that it can be used in any framework\
    \ that provides PSR-7-compliant request and response objects.\n\n# How to do it...\n\
    \n+   1.  We begin by defining an `Application\\Acl\\AuthenticateInterface` class.\
    \ We use this interface to support the Adapter software design pattern, making\
    \ our `Authenticate` class more generically useful by allowing a variety of adapters,\
    \ each of which can draw authentication from a different source (for example,\
    \ from a file, using OAuth2, and so on). Note the use of the PHP 7 ability to\
    \ define the return value data type:\n    ```php\n    namespace Application\\\
    Acl;\n\n    use Psr\\Http\\Message\\{ RequestInterface, ResponseInterface };\n\
    \    interface AuthenticateInterface\n    {\n        public function login(RequestInterface\
    \ $request) :\n            ResponseInterface;\n    }\n    ```\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_330_0.png)\n\
    \n> Note that by defining a method that requires a PSR-7-compliant request, and\
    \ produces a PSR-7-compliant response, we have made this interface universally\
    \ applicable.\n\n+   2.  Next, we define the adapter that implements the `login()`\
    \ method required by the interface. We make sure to use the appropriate classes,\
    \ and define fitting constants and properties. The constructor makes use of `Application\\\
    Database\\Connection`, defined in *Chapter 5, Interacting with a Database*:\n\
    \    ```php\n    namespace Application\\Acl;\n    use PDO;\n\n    use Application\\\
    Database\\Connection;\n    use Psr\\Http\\Message\\{ RequestInterface, ResponseInterface\
    \ };\n    use Application\\MiddleWare\\{ Response, TextStream };\n    class DbTable\
    \ implements AuthenticateInterface\n    ```"
  merge: -1
  img_proc: true
- pgno: 331
  md: "```\n(  \nconst ERROR_AUTH = 'ERROR: authentication error';  \nprotected $conn;\
    \  \nprotected $table;  \npublic function __construct(Connection $conn, $tableName)\
    \  \n{  \n$this->conn = $conn;  \n$this->table = $tableName;  \n}\n```\n\n+  \
    \ 3.  The core login() method extracts the username and password from the request\
    \  \nobject. We then do a straightforward database lookup. If there is a match,\
    \ we store  \nuser information in the response body, JSON-encoded:\n\n```\npublic\
    \ function login(RequestInterface $request) :  \nResponseInterface  \n{  \n$code\
    \ = 401;  \n$info = FALSE;  \n$body = new TextStream(self::ERROR_AUTH);  \n$params\
    \ = json_decode($request->getBody()->getContents());  \n$response = new Response();\
    \  \n$username = $params->username ?? FALSE;  \nif ($username)  \n{  \n$sql =\
    \ 'SELECT * FROM ' . $this->table  \n. ' WHERE email = ?';  \n$stmt = $this->conn->pdo->prepare($sql);\
    \  \n$stmt->execute([$username]);  \n$row = $stmt->fetch(PDO::FETCH_ASSOC);  \n\
    if ($row)  \n{  \nif (password_verify($params->password,  \n$row['password']))\
    \  \n{  \nunset($row['password']);  \n$body =  \nnew TextStream(json_encode($row));\
    \  \n$response->withBody($body);  \n$code = 202;  \n$info = $row;  \n}  \n}  \n\
    }  \nreturn $response->withBody($body)->withStatus($code);  \n}\n```"
