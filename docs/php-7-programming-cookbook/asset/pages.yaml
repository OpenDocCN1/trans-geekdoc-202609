- pgno: 393
  md: "# **Implementing a stack**\n\nA **stack** is a simple algorithm normally implemented\
    \ as **Last In First Out (LIFO)**. Think of a stack of books sitting on a library\
    \ table. When the librarian goes to restore the books to their place, the topmost\
    \ book is processed first, and so on in order, until the book at the bottom of\
    \ the stack has been replaced. The topmost book was the last one to be placed\
    \ on the stack, thus last in first out.\n\nIn programming terms, a stack is used\
    \ to temporarily store information. The retrieval order facilitates retrieving\
    \ the most recent item first.\n\n# How to do it…\n\n+   1. First we define a class,\
    \ `Application\\Generic\\Stack`. The core logic is encapsulated in an SPL class,\
    \ `SplStack`:\n   ```\n   namespace Application\\Generic;\n   use SplStack;\n\
    \   class Stack\n   {\n       // code\n   }\n   ```\n\n+   2. Next we define a\
    \ property to represent the stack, and set up an `SplStack` instance:\n   ```\n\
    \   protected $stack;\n   public function __construct()\n   {\n       $this->stack\
    \ = new SplStack();\n   }\n   ```\n\n+   3. After that we define methods to add\
    \ and remove from the stack, the classic `push()` and `pop()` methods:\n   ```\n\
    \   public function push($message)\n   {\n       $this->stack->push($message);\n\
    \   }\n   public function pop()\n   {\n       return $this->stack->pop();\n  \
    \ }\n   ```"
  merge: -1
  img_proc: true
- pgno: 394
  md: "+   4. We also throw in an implementation of __invoke() that returns an instance\
    \ of the *stack* property. This allows us to use the object in a direct function\
    \ call:\n\n```\npublic function __invoke()\n{\n    return $this->stack;\n}\n```\n\
    \n# How it works...\n\nOne possible use for a stack is to store messages. In the\
    \ case of messages, it is usually desirable to retrieve the latest first, thus\
    \ it is a perfect use case for a stack. Define the Application\\Generic\\Stack\
    \ class as discussed in this recipe. Next, define a calling program that sets\
    \ up autoloading and creates an instance of the *stack*:\n\n```\n<?php\n// setup\
    \ class autoloading\nrequire __DIR__ . '/../Application/Autoload/Loader.php';\n\
    Application\\Autoload\\Loader::init(__DIR__ . '/../');\nuse Application\\Generic\\\
    Stack;\n$stack = new Stack();\n```\n\nTo do something with the stack, store a\
    \ series of messages. As you would most likely store messages at different points\
    \ in your application, you can use *sleep*() to simulate other code running:\n\
    \n```\necho 'Do Something ... ' . PHP_EOL;\n$stack->push('1st Message: ' . date('H:i:s'));\n\
    sleep(3);\n\necho 'Do Something Else ... ' . PHP_EOL;\n$stack->push('2nd Message:\
    \ ' . date('H:i:s'));\nsleep(3);\n\necho 'Do Something Else Again ... ' . PHP_EOL;\n\
    $stack->push('3rd Message: ' . date('H:i:s'));\nsleep(3);\n```\n\nFinally, simply\
    \ iterate through the stack to retrieve messages. Note that you can call the *stack*\
    \ object as if it were a function, which returns the SplStack instance:\n\n```\n\
    echo 'What Time Is It?' . PHP_EOL;\nforeach ($stack() as $item) {\n    echo $item\
    \ . PHP_EOL;\n}\n```"
  merge: -1
  img_proc: true
