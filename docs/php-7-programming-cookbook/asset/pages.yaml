- pgno: 485
  md: "+   We then define a series of getters and setters, one for each property.\
    \ Please note that we only show the first two in order to conserve space.\n\n\
    ```\npublic function getString()\n{\n    return $this->string;\n}\n\npublic function\
    \ setString($string)\n{\n    $this->string = $string;\n}\n\n// other getters and\
    \ setters not shown\n```\n\n+   We next need to define a method that initializes\
    \ the base string. This consists of a series of simple if statements that check\
    \ the various $include* flags and append to the base string as appropriate. At\
    \ the end, we use str_replace() to remove the characters represented in $suppressChars:\n\
    \n```\npublic function initString()\n{\n    $string = '';\n    if ($this->includeNumbers)\
    \ {\n        $string .= self::DEFAULT_NUMBERS;\n    }\n    if ($this->includeUpper)\
    \ {\n        $string .= self::DEFAULT_UPPER;\n    }\n    if ($this->includeLower)\
    \ {\n        $string .= self::DEFAULT_LOWER;\n    }\n    if ($this->includeSpecial)\
    \ {\n        $string .= self::DEFAULT_SPECIAL;\n    }\n    if ($this->otherChars)\
    \ {\n        $string .= $this->otherChars;\n    }\n    if ($this->suppressChars)\
    \ {\n        $string = str_replace(\n            $this->suppressChars, '', $string);\n\
    \    }\n    return $string;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 486
  md: "![](img/39390f6d56c5a83b28db083a8bd5185c_486_0.png)\n\n# Best practice\n\n\
    Get rid of letters that can be confused with numbers (that is, the letter **O**\
    \ can be confused with the number **0**, and a lowercase **l** can be confused\
    \ with the number **1**.\n\n+   5.  We are now ready to define the core method\
    \ that generates the random phrase that the CAPTCHA presents to website visitors.\
    \ We set up a simple `for()` loop, and use the new PHP 7 `random_int()` function\
    \ to jump around in the base string:\n\n```\npublic function generatePhrase()\n\
    {\n    $phrase = '';\n    $this->string = $this->initString();\n    $max = strlen($this->string)\
    \ - 1;\n    for ($x = 0; $x < $this->length; $x++) {\n        $phrase .= substr(\n\
    \            $this->string, random_int(0, $max), 1);\n    }\n    return $phrase;\n\
    }\n```\n\n+   6.  Now we turn our attention away from the phrase and onto the\
    \ class that will produce a text CAPTCHA. For this purpose, we first define an\
    \ interface so that, in the future, we can create additional CAPTCHA classes that\
    \ all make use of Application\\Captcha\\Phrase. Note that getImage() will return\
    \ text, text art, or an actual image, depending on which class we decide to use:\n\
    \n```\nnamespace Application\\Captcha;\ninterface CaptchaInterface\n{\n    public\
    \ function getLabel();\n    public function getImage();\n    public function getPhrase();\n\
    }\n```\n\n+   7.  For a text CAPTCHA, we define a Application\\Captcha\\Reverse\
    \ class. The reason for this name is that this class produces not just text, but\
    \ text in reverse. The __construct() method builds an instance of Phrase. Note\
    \ that getImage() returns the phrase in reverse:\n\n```\nnamespace Application\\\
    Captcha;\nclass Reverse implements CaptchaInterface\n{\n    const DEFAULT_LABEL\
    \ = 'Type this in reverse';\n    const DEFAULT_LENGTH = 6;\n```"
  merge: -1
  img_proc: true
- pgno: 487
  md: "```\nprotected $phrase;\npublic function _ construct (\n    $label  = self::DEFAULT_LABEL,\n\
    \    $length = self:: DEFAULT_LENGTH,\n    $includeNumbers = TRUE,\n    $includeUpper\
    \   = TRUE,\n    $includeLower   = TRUE,\n    $includeSpecial = FALSE,\n    $otherChars\
    \     = NULL,\n    array $suppressChars = NULL)\n{\n    $this->label = $label;\n\
    \    $this->phrase = new Phrase(\n        $length,\n        $includeNumbers,\n\
    \        $includeUpper,\n        $includeLower,\n        $includeSpecial,\n  \
    \      $otherChars,\n        $suppressChars);\n}\n\npublic function getLabel()\n\
    {\n    return $this->label;\n}\n\npublic function getImage()\n{\n    return strrev($this->phrase->getPhrase());\n\
    }\n\npublic function getPhrase()\n{\n    return $this->phrase->getPhrase();\n\
    }\n\n```\n\n# ## Generating an image CAPTCHA\n\n+   1.  The image approach, as\
    \ you can well imagine, is much more complicated. The phrase generation process\
    \ is the same. The main difference is that not only do we need to imprint the\
    \ phrase on a graphic, but we also need to distort each letter differently and\
    \ introduce noise in the form of random dots."
  merge: -1
  img_proc: true
- pgno: 488
  md: "+   We define a `Application\\Captcha\\Image` class that implements `CaptchaInterface`.\
    \ The class constants and properties include not only those needed for phrase\
    \ generation, but what is needed for image generation as well:\n\n```\n```php\n\
    namespace Application\\Captcha;\nuse DirectoryIterator;\n\nclass Image implements\
    \ CaptchaInterface\n{\n    const DEFAULT_WIDTH = 200;\n    const DEFAULT_HEIGHT\
    \ = 50;\n    const DEFAULT_LABEL = 'Enter this phrase';\n    const DEFAULT_BG_COLOR\
    \ = [255, 255, 255];\n    const DEFAULT_URL = '/captcha';\n    const IMAGE_PREFIX\
    \ = 'CAPTCHA_';\n    const IMAGE_SUFFIX = '.jpg';\n    const IMAGE_EXP_TIME =\
    \ 300;    // seconds\n    const ERROR_REQUIRES_GD = 'Requires the GD extension\
    \ + '\n        . ' the JPEG library';\n    const ERROR_IMAGE = 'Unable to generate\
    \ image';\n\n    protected $phrase;\n    protected $imageFn;\n    protected $label;\n\
    \    protected $imageWidth;\n    protected $imageHeight;\n    protected $imageRGB;\n\
    \    protected $imageDir;\n    protected $imageUrl;\n```\n```\n\n+   The constructor\
    \ needs to accept all the arguments required for phrase generation, as described\
    \ in the previous steps. In addition, we need to accept arguments required for\
    \ image generation. The two mandatory parameters are `$imageDir` and `$imageUrl`.\
    \ The first is where the graphic will be written. The second is the base URL,\
    \ after which we will append the generated filename. `$imageFont` is provided\
    \ in case we want to provide TrueType fonts, which will produce a more secure\
    \ CAPTCHA. Otherwise, we’re limited to the default fonts which, to quote a line\
    \ in a famous movie, *ain’t a pretty sight*:\n\n```\n```php\npublic function __construct(\n\
    \    $imageDir,\n    $imageUrl,\n    $imageFont = NULL,\n    $label = NULL,\n\
    \    $length = NULL,\n    $includeNumbers = TRUE,\n```\n```"
  merge: -1
  img_proc: true
- pgno: 489
  md: "```\n$includeUpper= TRUE,\n$includeLower= TRUE,\n$includeSpecial= FALSE,\n\
    $otherChars= NULL,\narray $suppressChars= NULL,\n$imageWidth= NULL,\n$imageHeight=\
    \ NULL,\narray $imageRGB= NULL\n}\n```\n\n+   4. Next, still in the constructor,\
    \ we check to see whether the imagecreatetruecolor function exists. If this comes\
    \ back as FALSE, we know the GD extension is not available. Otherwise, we assign\
    \ parameters to properties, generate the phrase, remove old images, and write\
    \ out the CAPTCHA graphic:\n\n```\nif (!function_exists('imagecreatetruecolor'))\
    \ {\n    throw new \\Exception(self::ERROR_REQUIRES_GD);\n}\n$this->imageDir \
    \   = $imageDir;\n$this->imageUrl    = $imageUrl;\n$this->imageFont   = $imageFont;\n\
    $this->label       = $label ?: self::DEFAULT_LABEL;\n$this->imageRGB    = $imageRGB\
    \ ?: self::DEFAULT_BG_COLOR;\n$this->imageWidth  = $imageWidth ?: self::DEFAULT_WIDTH;\n\
    $this->imageHeight = $imageHeight ?: self::DEFAULT_HEIGHT;\nif (substr($imageUrl,\
    \ -1, 1) == '/') {\n    $imageUrl = substr($imageUrl, 0, -1);\n}\n$this->imageUrl\
    \ = $imageUrl;\nif (substr($imageDir, -1, 1) == DIRECTORY_SEPARATOR) {\n    $imageDir\
    \ = substr($imageDir, 0, -1);\n}\n\n$this->phrase = new Phrase(\n    $length,\n\
    \    $includeNumbers,\n    $includeUpper,\n    $includeLower,\n    $includeSpecial,\n\
    \    $otherChars,\n    $suppressChars\n);\n$this->removeOldImages();\n$this->generateJpg();\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 490
  md: "+   5. The process of removing old images is extremely important; otherwise\
    \ we will end up with a directory filled with expired CAPTCHA images! We use the\
    \ DirectoryIterator class to scan the designated directory and check the access\
    \ time. We calculate an old image file as one that is the current time minus the\
    \ value specified by IMAGE_EXP_TIME:\n\n```\npublic function removeOldImages()\
    \ {\n    $old = time() - self::IMAGE_EXP_TIME;\n    foreach (new DirectoryIterator($this->imageDir)\n\
    \         as $fileInfo) {\n        if ($fileInfo->isDot()) continue;\n       \
    \ if ($fileInfo->getATime() < $old)\n            unlink($this->imageDir . DIRECTORY_SEPARATOR\n\
    \                  . $fileInfo->getFilename());\n    }\n}\n```\n\n+   6. We are\
    \ now ready to move on to the main show. First, we split the $imageRGB array into\
    \ $red, $green, and $blue. We use the core imagecreatetruecolor() function to\
    \ generate the base graphic with the width and height specified. We use the RGB\
    \ values to colorize the background:\n\n```\npublic function generateJpg()\n{\n\
    \    try {\n        list($red, $green, $blue) = $this->imageRGB;\n        $im\
    \ = imagecreatetruecolor(\n            $this->imageWidth, $this->imageHeight);\n\
    \        $black = imagecolorallocate($im, 0, 0, 0);\n        $imageBgColor = imagecolorallocate(\n\
    \            $im, $red, $green, $blue);\n        imagefilledrectangle($im, 0,\
    \ 0, $this->imageWidth,\n            $this->imageHeight, $imageBgColor);\n```\n\
    \n+   7. Next, we define x and y margins based on image width and height. We then\
    \ initialize variables to be used to write the phrase onto the graphic. We then\
    \ loop a number of times that matches the length of the phrase:\n\n```\n$xMargin\
    \ = (int) ($this->imageWidth * .1 + .5);\n$yMargin = (int) ($this->imageHeight\
    \ * .3 + .5);\n$phrase = $this->getPhrase();\n$max = strlen($phrase);\n$count\
    \ = 0;\n$x = $xMargin;\n$size = 5;\nfor ($i = 0; $i < $max; $i++) {\n```"
  merge: -1
  img_proc: true
- pgno: 491
  md: "+   8. If $imageFont is specified, we are able to write each character with\
    \ a different size and angle. We also need to adjust the x axis (that is, horizontal)\
    \ value according to the size:\n\n```\nif ($this->imageFont) {\n\t$size = rand(12,\
    \ 32);\n\t$angle = rand(0, 30);\n\t$y = rand($yMargin + $size, $this->imageHeight);\n\
    \timagegitttext($im, $size, $angle, $x, $y, $black,\n\t\t$this->imageFont, $phrase[$i]);\n\
    \t$x += (int) ($size + rand(0,5));\n\n```\n\n+   9. Otherwise, we're stuck with\
    \ the default fonts. We use the largest size of 5, as smaller sizes are unreadable.\
    \ We provide a low level of distortion by alternating between imagechar(), which\
    \ writes the image normally, and imagecharup(), which writes it sideways:\n\n\
    ```\n} else {\n\t$y = rand(0, ($this->imageHeight - $yMargin));\n\tif ($count++\
    \ & 1) {\n\t\timagechar($im, 5, $x, $y, $phrase[$i], $black);\n\t} else {\n\t\t\
    imagecharup($im, 5, $x, $y, $phrase[$i], $black);\n\t}\n\t$x += (int) ($size *\
    \ 1.2);\n}\n} // end for ($i = 0; $i < $max; $i++)\n\n```\n\n+   10. Next we need\
    \ to add noise in the form of random dots. This is necessary in order to make\
    \ the image harder for automated systems to detect. It is also recommended that\
    \ you add code to draw a few lines as well:\n\n```\n$numDots = rand(10, 999);\n\
    for ($i = 0; $i < $numDots; $i++) {\n\timagesetpixel($im, rand(0, $this->imageWidth),\n\
    \t\t\t\t  rand(0, $this->imageHeight), $black);\n}\n\n```\n\n+   11. We then create\
    \ a random image filename using our old friend md5() with the date and a random\
    \ number from 0 to 9999 as arguments. Note that we can safely use md5() as we\
    \ are not trying to hide any secret information; we're merely interested in generating\
    \ a unique filename quickly. We wipe out the image object as well to conserve\
    \ memory:\n\n```\n$this->imageFn = self::IMAGE_PREFIX\n\t. md5(date('YmdHis')\
    \ . rand(0, 9999))\n\t. self::IMAGE_SUFFIX;\nimagejpeg($im, $this->imageDir .\
    \ DIRECTORY_SEPARATOR\n\n```"
  merge: -1
  img_proc: true
- pgno: 492
  md: ". $this->imageFn);\n    imagedestroy($im);\n\n12. The entire construct is in\
    \ a `try/catch` block. If an error or exception is thrown, we log the message\
    \ and take the appropriate action:\n\n```\n} catch (\\Throwable $e) {\n    error_log(_METHOD\
    \ . ':' . $e->getMessage());\n    throw new \\Exception(self::ERROR_IMAGE);\n\
