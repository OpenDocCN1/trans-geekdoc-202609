  md: "# Using PHP 7 High Performance Features\n\nIn a slight twist, however, instead\
    \ of using the f* functions directly, instead we will use the SplFileObject class,\
    \ which is included in the SPL (Standard PHP Library):\n\n+   1. First, we define\
    \ a Application\\Iterator\\LargeFile class with the appropriate properties and\
    \ constants:\n\n```\nnamespace Application\\Iterator;\n\nuse Exception;\nuse InvalidArgumentException;\n\
    use SplFileObject;\nuse NoRewindIterator;\n\nclass LargeFile\n{\n    const ERROR_UNABLE\
    \ = 'ERROR: Unable to open file';\n    const ERROR_TYPE   = 'ERROR: Type must\
    \ be \"ByLength\",\n                         \"ByLine\" or \"Csv\"';\n    protected\
    \ $file;\n    protected $allowedTypes = ['ByLine', 'ByLength', 'Csv'];\n```\n\n\
    +   2. We then define a __construct() method that accepts a filename as an argument\
    \ and populates the $file property with an SplFileObject instance. This is also\
    \ a good place to throw an exception if the file does not exist:\n\n```\npublic\
    \ function __construct($filename, $mode = 'r')\n{\n    if (!file_exists($filename))\
    \ {\n        $message = __METHOD__ . ': ' . self::ERROR_UNABLE . PHP_EOL;\n  \
    \      $message .= strip_tags($filename) . PHP_EOL;\n        throw new Exception($message);\n\
    \    }\n    $this->file = new SplFileObject($filename, $mode);\n}\n```\n\n+  \
    \ 3. Next we define a method fileIteratorByLine() method which uses fgets() to\
    \ read one line of the file at a time. It's not a bad idea to create a complimentary\
    \ fileIteratorByLength() method that does the same thing but uses fread() instead.\
    \ The method that uses fgets() would be suitable for text files that include linefeeds.\
    \ The other method could be used if parsing a large binary file:\n\n```\nprotected\
    \ function fileIteratorByLine()\n{\n    $count = 0;\n    while (!$this->file->eof())\
    \ {\n        yield $this->file->fgets();\n        $count++;\n```"
