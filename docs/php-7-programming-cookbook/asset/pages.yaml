  md: "```\n}\n}\n```\n\n> The big disadvantage of both of these adapters is that\
    \ we need to preload the entire translation set, which puts a strain on memory\
    \ if there is a large number of translations. Also, the translation file needs\
    \ to be opened and parsed, which drags down performance.\n\n+   6. We now present\
    \ the third adapter, which performs a database lookup and avoids the problems\
    \ of the other two adapters. We use a PDO prepared statement which is sent to\
    \ the database in the beginning, and only one time. We then execute as many times\
    \ as needed, supplying the message ID as an argument. You will also notice that\
    \ we needed to override the `translate()` method defined in the trait. Finally,\
    \ you might have noticed the use of `PDOStatement::fetchColumn()` as we only need\
    \ the one value:\n\n```\nnamespace Application\\I18n\\Translate\\Adapter;\n\n\
    use Exception;\nuse Application\\Database\\Connection;\nuse Application\\I18n\\\
    Locale;\n\nclass Database implements TranslateAdapterInterface\n{\n    use TranslateAdapterTrait;\n\
    \    protected $connection;\n    protected $statement;\n    protected $defaultLocaleCode;\n\
    \    public function __construct(Locale $locale,\n                           \
    \     Connection $connection,\n                                $tableName)\n \
    \   {\n        $this->defaultLocaleCode = $locale->getLocaleCode();\n        $this->connection\
    \ = $connection;\n        $sql = 'SELECT msgstr FROM ' . $tableName\n        \
    \    . ' WHERE localeCode = ? AND msgid = ?';\n        $this->statement = $this->connection->pdo->prepare($sql);\n\
    \    }\n    public function translate($msgid, $localeCode = NULL)\n    {\n   \
    \     if (!$localeCode) $localeCode = $this->defaultLocaleCode;\n        $this->statement->execute([$localeCode,\
    \ $msgid]);\n        return $this->statement->fetchColumn();\n    }\n}\n```"
