- pgno: 417
  md: "# Building an object to array hydrator\n\nThis recipe is the converse of the\
    \ *Creating an array to object hydrator* recipe. In this case, we need to pull\
    \ values from object properties and return an associative array where the key\
    \ will be the column name.\n\n# How to do it...\n\n+   1. For this illustration\
    \ we will build upon the `Application\\Generic\\Hydrator\\GetSet` class defined\
    \ in the previous recipe:\n\n```\n```\nnamespace Application\\Generic\\Hydrator;\n\
    class GetSet\n{\n    // code\n}\n```\n```\n\n+   2. After the `hydrate()` method\
    \ defined in the previous recipe, we define an `extract()` method, which takes\
    \ an object as an argument. The logic is similar to that used with `hydrate()`,\
    \ except this time we're searching for `getXXX()` methods. Again, `preg_match()`\
    \ is used to match the method prefix and its suffix, which is subseqently assumed\
    \ to be the array key:\n\n```\n```\npublic static function extract($object)\n\
    {\n    $array = array();\n    $class = get_class($object);\n    $methodList =\
    \ get_class_methods($class);\n    foreach ($methodList as $method) {\n       \
    \ preg_match('/^(get)(.*)$/', $method, $matches);\n        $prefix = $matches[1]\
    \ ?? '';\n        $key    = $matches[2] ?? '';\n        $key = strtolower(substr($key,\
    \ 0, 1)) . substr($key, 1);\n        if ($prefix == 'get') {\n            $array[$key]\
    \ = $object->$method();\n        }\n    }\n    return $array;\n}\n```\n```\n\n\
    > > Note that we have defined `hydrate()` and `extract()` as static methods for\
    \ convenience."
  merge: -1
  img_proc: true
