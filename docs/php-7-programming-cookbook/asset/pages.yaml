- pgno: 493
  md: "Next, define a calling program called chap_12_captcha_text.php that implements\
    \ a text CAPTCHA. You first need to set up autoloading and use the appropriate\
    \ classes:\n\n```\n<?php\n    require __DIR__ . './../Application/Autoload/Loader.php';\n\
    \    Application\\Autoload\\Loader::init(__DIR__ . './../');\n    use Application\\\
    Captcha\\Reverse;\n```\n\nAfter that, be sure to start the session. You would\
    \ use appropriate measures to protect the session as well. To conserve space,\
    \ we only show one simple measure, session_regenerate_id():\n\n```\nsession_start();\n\
    \    session_regenerate_id();\n```\n\nNext, you can define a function that creates\
    \ the CAPTCHA; retrieves the phrase, label, and image (in this case, reverse text);\
    \ and stores the value in the session:\n\n```\nfunction setCaptcha(&$phrase, &$label,\
    \ &$image)\n{\n    $captcha = new Reverse();\n    $phrase = $captcha->getPhrase();\n\
    \    $label = $captcha->getLabel();\n    $image = $captcha->getImage();\n    $_SESSION['phrase']\
    \ = $phrase;\n}\n```\n\nNow is a good time to initialize variables and determine\
    \ the loggedIn status:\n\n```\n$image = '';\n    $label = '';\n    $phrase = $_SESSION['phrase']\
    \ ?? '';\n    $message = '';\n    $info = 'You Can Now See Super Secret Information!!!';\n\
    \    $loggedIn = $_SESSION['isLoggedIn'] ?? FALSE;\n    $loggedUser = $_SESSION['user']\
    \ ?? 'guest';\n```\n\nYou can then check to see whether the login button has been\
    \ pressed. If so, check to see whether the CAPTCHA phrase has been entered. If\
    \ not, initialize a message informing the user they need to enter the CAPTCHA\
    \ phrase:\n\n```\nif (!empty($_POST['login'])) {\n        if (empty($_POST['captcha']))\
    \ {\n            $message = 'Enter Captcha Phrase and Login Information';\n```"
