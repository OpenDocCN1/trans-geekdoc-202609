  md: "# How to do it…\n\n+   1.  First, be sure to define classes to represent the\
    \ `Uri`, `Stream`, and `UploadedFile` value objects, as described in the previous\
    \ recipe.\n\n+   2.  Now we are ready to define the core `Application\\MiddleWare\\\
    Message` class. This class consumes `Stream` and `Uri` and implements `Psr\\Http\\\
    Message\\MessageInterface`. We first define properties for the key value objects,\
    \ including those representing the message body (that is, a `StreamInterface`\
    \ instance), version, and HTTP headers:\n\n```\nnamespace Application\\MiddleWare;\n\
    use Psr\\Http\\Message\\ {\n    MessageInterface,\n    StreamInterface,\n    UriInterface\n\
    };\nclass Message implements MessageInterface\n{\n    protected $body;\n    protected\
    \ $version;\n    protected $httpHeaders = array();\n```\n\n+   3.  Next, we have\
    \ the `getBody()` method that represents a `StreamInterface` instance. A companion\
    \ method, `withBody()`, returns the current `Message` instance and allows us to\
    \ overwrite the current value of `body`:\n\n```\npublic function getBody()\n{\n\
    \    if (!$this->body) {\n        $this->body = new Stream(self::DEFAULT_BODY_STREAM);\n\
    \    }\n    return $this->body;\n}\npublic function withBody(StreamInterface $body)\n\
    {\n    if (!$body->isReadable()) {\n        throw new InvalidArgumentException(\n\
    \            self::ERROR_BODY_UNREADABLE);\n    }\n    $this->body = $body;\n\
    \    return $this;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 581
  md: "4. PSR-7 recommends that headers should be viewed as case-insensitive. Accordingly,\
    \ we define a findHeader() method (not directly defined by MessageInterface) that\
    \ locates a header using stripos():\n\n```\nprotected function findHeader($name)\n\
    {\n    $found = FALSE;\n    foreach (array_keys($this->getHeaders()) as $header)\
    \ {\n        if (stripos($header, $name) !== FALSE) {\n            $found = $header;\n\
    \            break;\n        }\n    }\n    return $found;\n}\n```\n\n5. The next\
    \ method, not defined by PSR-7, is designed to populate the $httpHeaders property.\
    \ This property is assumed to be an associative array where the key is the header,\
    \ and the value is the string representing the header value. If there is more\
    \ than one value, additional values separated by commas are appended to the string.\
    \ There is an excellent apache_request_headers() PHP function from the Apache\
    \ extension that produces headers if they are not already available in $httpHeaders:\n\
    \n```\nprotected function getHttpHeaders()\n{\n    if (!$this->httpHeaders) {\n\
    \        if (function_exists('apache_request_headers')) {\n            $this->httpHeaders\
    \ = apache_request_headers();\n        } else {\n            $this->httpHeaders\
    \ = $this->altApacheReqHeaders();\n        }\n    }\n    return $this->httpHeaders;\n\
    }\n```\n\n6. If apache_request_headers() is not available (that is, the Apache\
    \ extension is not enabled), we provide an alternative, altApacheReqHeaders():\n\
    \n```\nprotected function altApacheReqHeaders()\n{\n    $headers = array();\n\
    \    foreach ($_SERVER as $key => $value) {\n        if (stripos($key, 'HTTP_')\
    \ !== FALSE) {\n            $headerKey = str_replace('HTTP_', '', $key);\n   \
    \         $headers[$this->explodeHeader($headerKey)] = $value;\n        }\n  \
    \  }\n```"
