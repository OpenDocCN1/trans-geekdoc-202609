- pgno: 559
  md: '# # Defining PSR-7 Classes


    In this appendix, we will cover the following topics:


    +   Implementing PSR-7 value object classes


    Developing a PSR-7 Request class


    Defining a PSR-7 Response class


    # ## Introduction


    **PHP Standard Recommendation number 7 (PSR-7)** defines a number of interfaces,
    but does not provide actual implementations. Accordingly, we need to define concrete
    code implementations in order to start creating custom middleware.


    # ## Implementing PSR-7 value object classes


    In order to work with PSR-7 requests and responses, we first need to define a
    series of value objects. These are classes that represent logical objects used
    in web-based activities such as URLs, file uploads, and streaming request or response
    bodies.


    # ### Getting ready


    The source code for the PSR-7 interfaces is available as a `Composer` package.
    It is considered a best practice to use `Composer` to manage external software,
    including PSR-7 interfaces.'
  merge: -1
  img_proc: true
- pgno: 560
  md: '# **How to do it... **


    +   1. First of all, go to the following URL to obtain the latest versions of
    the PSR-7 interface definitions: `https://github.com/php-fig/http-message`. The
    source code is also available. At the time of writing, the following definitions
    are available:


    | Interface | Extends | Notes | What the methods handle |

    | :--- | :--- | :--- | :--- |

    | MessageInterface | | Defines methods common to HTTP messages | Headers, message
    body (that is, content), and protocol |

    | RequestInterface | MessageInterface | Represents requests generated by a client
    | The URI, HTTP method, and the request target |


    +   2. Unfortunately, we will need to create concrete classes that implement these
    interfaces in order to utilize PSR-7. Fortunately, the interface classes are extensively
    documented internally through a series of comments. We will start with a separate
    class that contains useful constants:


    > Note that we take advantage of a new feature introduced in PHP 7 that allows
    us to define a constant as an array.'
  merge: -1
  img_proc: true
