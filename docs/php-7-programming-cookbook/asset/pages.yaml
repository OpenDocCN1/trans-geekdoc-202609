- pgno: 465
  md: "# See also\n\n+   In Chapter 6, Building Scalable Websites, the recipe entitled\
    \ Chaining $_POST validators discusses how to incorporate the basic validation\
    \ concepts covered here into a comprehensive filter chaining mechanism.\n\n# Safeguarding\
    \ the PHP session\n\nThe PHP session mechanism is quite simple. Once the session\
    \ is started using session_start() or the php.ini session.autostart setting, the\
    \ PHP engine generates a unique token that is, by default, conveyed to the user\
    \ by way of a cookie. On subsequent requests, while the session is still considered\
    \ active, the user’s browser (or equivalent) presents the session identifier,\
    \ again usually by way of a cookie, for inspection. The PHP engine then uses this\
    \ identifier to locate the appropriate file on the server, populating $_SESSION\
    \ with the stored information. There are tremendous security concerns when the\
    \ session identifier is the sole means of identifying a returning website visitor.\
    \ In this recipe, we will present several techniques that will help you to safeguard\
    \ your sessions, which, in turn, will vastly improve the overall security of the\
    \ website.\n\n# How to do it...\n\n+   1. First of all, it’s important to recognize\
    \ how using the session as the sole means of authentication can be dangerous.\
    \ Imagine for a moment that when a valid user logs in to your website, that you\
    \ set a loggedIn flag in $_SESSION:\n\n```\nsession_start();\n$loggedIn = $_SESSION['isLoggedIn']\
    \ ?? FALSE;\nif (isset($_POST['login'])) {\n    if ($_POST['username'] == // username\
    \ lookup\n    && $_POST['password'] == // password lookup) {\n        $loggedIn\
    \ = TRUE;\n        $_SESSION['isLoggedIn'] = TRUE;\n    }\n}\n```\n\n+   2. In\
    \ your program logic, you allow the user to see sensitive information if $_SESSION['isLoggedIn']\
    \ is set to TRUE:\n<br>Secret Info\n<br><?php if ($loggedIn) echo // secret information;\
    \ ?>"
  merge: -1
  img_proc: true
- pgno: 466
  md: "+   3. If an attacker were to obtain the session identifier, for example, by\
    \ means of a successfully executed **Cross-site scripting (XSS)** attack, all\
    \ he/she would need to do would be to set the value of the `PHPSESSID` cookie\
    \ to the illegally obtained one, and they are now viewed by your application as\
    \ a valid user.\n\n+   4. One quick and easy way to narrow the window of time\
    \ during which the `PHPSESSID` is valid is to use `session_regenerate_id()`. This\
    \ very simple command generates a new session identifier, invalidates the old\
    \ one, maintains session data intact, and has a minimal impact on performance.\
    \ This command can only be executed after the session has started:\n\n```\n```\n\
    session_start();\nsession_regenerate_id();\n```\n```\n\n+   5. Another often overlooked\
    \ technique is to ensure that web visitors have a logout option. It is important,\
    \ however, to not only destroy the session using `session_destroy()`, but also\
    \ to unset `$_SESSION` data and to expire the session cookie:\n\n```\n```\nsession_unset();\n\
    session_destroy();\nsetcookie('PHPSESSID', 0, time() - 3600);\n```\n```\n\n+ \
    \  6. Another easy technique that can be used to prevent session hijacking is\
    \ to develop a finger-print or thumb-print of the website visitor. One way to\
    \ implement this technique is to collect information unique to the website visitor\
    \ over and above the session identifier. Such information includes the user agent\
    \ (that is, the browser), languages accepted, and remote IP address. You can derive\
    \ a simple hash from this information, and store the hash on the server in a separate\
    \ file. The next time the user visits the website, if you have determined they\
    \ are logged in based on session information, you can then perform a secondary\
    \ verification by matching finger-prints:\n\n```\n```\n$remotePrint = md5($ _SERVER['REMOTE_ADDR']\n\
    \        . $ _SERVER['HTTP_USER_AGENT']\n        . $ _SERVER['HTTP_ACCEPT_LANGUAGE']);\n\
    \n$printMatch = file_exists(THUMB_PRINT_DIR . $remotePrint);\nif ($loggedIn &&\
    \ !$printMatch) {\n    $info = 'SESSION INVALID!!!';\n    error_log('Session Invalid:\
    \ ' . date('Y-m-d H:i:s'), 0);\n    // take appropriate action\n}\n```\n```\n\n\
    ![](img/39390f6d56c5a83b28db083a8bd5185c_466_0.png)\n\nWe are using `md5()` as\
    \ it’s a fast hashing algorithm and is well suited for internal usage. It is not\
    \ *recommended* to use `md5()` for any external use as it is subject to brute-force\
    \ attacks."
  merge: -1
  img_proc: true
- pgno: 467
  md: "# How it works...\n\nTo demonstrate how a session is vulnerable, code a simple\
    \ login script that sets a $_SESSION['isLoggedIn'] flag upon successful login.\
    \ You could call the file chap_12_session_hijack.php:\n\n```\nsession_start();\n\
    $loggedIn = $_SESSION['loggedIn'] ?? '';\n$loggedIn = $_SESSION['isLoggedIn']\
    \ ?? FALSE;\n$username = 'test';\n$password = 'password';\n$info = 'You Can Now\
    \ See Super Secret Information!!!';\n\nif (isset($_POST['login'])) {\n    if ($_POST['username']\
    \ == $username\n        && $_POST['password'] == $password) {\n        $loggedIn\
    \ = TRUE;\n        $_SESSION['isLoggedIn'] = TRUE;\n        $_SESSION['loggedInUser']\
    \ = $username;\n        $loggedIn = $username;\n    }\n} elseif (isset($_POST['logout']))\
    \ {\n    session_destroy();\n}\n```\n\nYou can then add code that displays a simple\
    \ login form. To test for session vulnerability, follow this procedure using the\
    \ chap_12_session_hijack.php file we just created:\n\n+   1. Change to the directory\
    \ containing the file.\n2. Run the php -S localhost:8080 command.\n3. Using one\
    \ browser, open the URL http://localhost:8080/<filename>.\n4. Login as user test\
    \ with a password as password.\n5. You should be able to see **You Can Now See\
    \ Super Secret Information!!!**.\n6. Refresh the page: each time, you should see\
    \ a new session identifier.\n7. Copy the value of the PHPSESSID cookie.\n8. Open\
    \ another browser to the same web page.\n9. Modify the cookie sent by the browser\
    \ by copying the value of PHPSESSID."
  merge: -1
