- pgno: 509
  md: "# How it works...\n\nFirst of all, make sure the classes developed in *Chapter\
    \ 4, Working with PHP Object-Oriented Programming*, have been created. These include\
    \ the Application\\Generic\\CountryList and Application\\Generic\\CustomerList\
    \ classes discussed in *Chapter 4, Working with PHP Object-Oriented Programming*,\
    \ in the recipe *Using interfaces*. Save each class in a new file in the Application\\\
    Generic folder as CountryListUsingTrait.php and CustomerListUsingTrait.php. Be\
    \ sure to change the class names to match the new names of the files!\n\nAs discussed\
    \ in step 3, remove the list() method from both CountryListUsingTrait.php and\
    \ CustomerListUsingTrait.php list classes, and Add use ListTrait; in place of\
    \ the method removed. Place the removed code into a separate file, in the same\
    \ folder, called ListTrait.php.\n\nYou will also notice further duplication of\
    \ code between the two list classes, in this case the setConnection() method.\
    \ This calls for another trait!\n\nCut the setConnection() method out of both\
    \ CountryListUsingTrait.php and CustomerListUsingTrait.php list classes, and place\
    \ the removed code into a separate file called ConnectTrait.php. As this trait\
    \ is logically related to ConnectionAwareInterface and Connection, it makes sense\
    \ to place the file in the Application\\Database folder, and to specify its namespace\
    \ accordingly.\n\nFinally, define Application\\Database\\ConnectionAwareInterface\
    \ as discussed in step 6. Here is the final Application\\Generic\\CustomerListUsingTrait\
    \ class after all changes:\n\n```\n```php\n<?php\nnamespace Application\\Generic;\n\
    use PDO;\nuse Application\\Database\\Connection;\nuse Application\\Database\\\
    ConnectTrait;\nuse Application\\Database\\ConnectionAwareInterface;\nclass CustomerListUsingTrait\
    \ implements ConnectionAwareInterface\n{\n    use ListTrait;\n    use ConnectTrait;\n\
    \n    protected $key = 'id';\n    protected $value = 'name';\n    protected $table\
    \ = 'customer';\n}\n```\n```"
