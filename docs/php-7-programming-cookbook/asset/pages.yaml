  md: "Massive file iteration will be handled using the preceding recipe. We will\
    \ use the fgets\\_csv() function to convert a CSV row into a PHP array. Finally,\
    \ we will use the **PDO PHP Data Objects** class to make a database connection\
    \ and perform the insert.\n\n# How to do it...\n\n+   1. First, we define a Application\\\
    Database\\Connection class that creates a PDO instance based on a set of parameters\
    \ supplied to the constructor:\n\n```\n```\n<?php\nnamespace Application\\Database;\n\
    \nuse Exception;\nuse PDO;\n\nclass Connection\n{\n    const ERROR_UNABLE = 'ERROR:\
    \ Unable to create database connection';\n    public $pdo;\n\n    public function\
    \ __construct(array $config)\n    {\n        if (!isset($config['driver'])) {\n\
    \            $message = __METHOD__ . ' : ' . self::ERROR_UNABLE . PHP_EOL;\n \
    \           throw new Exception($message);\n        }\n        $dsn = $config['driver']\n\
    \            . ':host=' . $config['host']\n            . ';dbname=' . $config['dbname'];\n\
