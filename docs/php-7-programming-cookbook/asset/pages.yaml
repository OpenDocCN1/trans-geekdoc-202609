  md: "# See also...\n\n+   * For a good discussion on unit testing, have a look here:\
    \ https://en.wikipedia.org/wiki/Unit_testing.\n\n+   * For more information on\
    \ composer.json file directives, see https://getcomposer.org/doc/04-schema.md.\n\
    \n+   * For a complete list of assertions, have a look at this PHPUnit documentation\
    \ page:https://phpunit.de/manual/current/en/phpunit-book.html#appendixes.assertions.\n\
    \n+   * The PHPUnit documentation also goes into using getMockBuilder() in detail\
    \ here: https://phpunit.de/manual/current/en/phpunit-book.html#test-doubles.mock-objects\n\
    \n# Writing a test suite\n\nYou may have noticed after having read through the\
    \ previous recipe that it can quickly become tedious to have to manually run phpunit\
    \ and specify test classes and PHP filenames. This is especially true when dealing\
    \ with applications that employ dozens or even hundreds of classes and files.\
    \ The PHPUnit project has a built-in capability to handle running multiple tests\
    \ with a single command. Such a set of tests is referred to as a **test suite**.\n\
    \n# How to do it...\n\n+   1. At its simplest, all you need to do is to move all\
    \ the tests into a single folder:\n   ```\n   mkdir tests\n   cp *Test.php tests\n\
    \   ```\n\n+   2. You'll need to adjust commands that include or require external\
    \ files to account for the new location. The example shown (SimpleTest) was developed\
    \ in the preceding recipe:\n   ```php\n   <?php\n   use PHPUnit\\Framework\\TestCase;\n\
    \   require_once __DIR__ . '/../chap_13_unit_test_simple.php';\n\n   class SimpleTest\
    \ extends TestCase\n   {\n    // etc.\n   ```\n\n+   3. You can then simply run\
    \ phpunit with the directory path as an argument. PHPUnit will then automatically\
    \ run all tests in that folder. In this example, we assume there is a tests subdirectory:\n\
    \   ```\n   phpunit tests\n   ```"
  merge: -1
  img_proc: true
- pgno: 538
  md: "+   4. You can use the `--bootstrap` option to specify a file that is executed\
    \ prior to running the tests. A typical use for this option is to initiate autoloading:\n\
    \n```\nphpunit --bootstrap tests_with_autoload/bootstrap.php tests\n```\n\n+ \
    \  5. Here is the sample bootstrap.php file that implements autoloading:\n\n```php\n\
    <?php\nrequire __DIR__ . '/../../Application/Autoload/Loader.php';\nApplication\\\
    Autoload\\Loader::init([__DIR__]);\n```\n\n+   6. Another possibility is to define\
    \ one or more sets of tests using an XML configuration file. Here is an example\
    \ that runs only the Simple* tests:\n\n```xml\n<phpunit>\n    <testsuites>\n \
    \       <testsuite name=\"simple\">\n            <file>SimpleTest.php</file>\n\
    \            <file>SimpleDbTest.php</file>\n            <file>SimpleClassTest.php</file>\n\
    \        </testsuite>\n    </testsuites>\n</phpunit>\n```\n\n+   7. Here is another\
    \ example that runs a test based on a directory and also specifies a bootstrap\
    \ file:\n\n```xml\n<phpunit bootstrap=\"bootstrap.php\">\n    <testsuites>\n \
    \       <testsuite name=\"visitor\">\n            <directory>Simple</directory>\n\
    \        </testsuite>\n    </testsuites>\n</phpunit>\n```\n\n# How it works...\n\
    \nMake sure all the tests discussed in the previous recipe, *Writing a simple\
    \ test*, have been defined. You can then create a `tests` folder and move or copy\
    \ all the `*Test.php` files into this folder. You'll then need to adjust the path\
    \ in the `require_once` statements, as shown in step 2.\n\nIn order to demonstrate\
    \ how PHPUnit can run all tests in a folder, from the directory containing the\
    \ source code you defined for this chapter, run the following command:\n\n```bash\n\
    phpunit tests\n```"
