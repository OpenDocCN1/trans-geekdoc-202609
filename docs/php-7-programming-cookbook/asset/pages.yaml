- pgno: 413
  md: '# 11


    # Implementing Software Design Patterns


    In this chapter, we will cover the following topics:


    +   - Creating an array to object hydrator

    - Building an object to array hydrator

    - Implementing a strategy pattern

    - Defining a mapper

    - Implementing object-relational mapping

    - Implementing the Pub/Sub design pattern


    # Introduction


    The idea of incorporating **software design patterns** into **object-oriented
    programming (OOP)** code was first discussed in a seminal work entitled *Design
    Patterns: Elements of Reusable Object-Oriented Software*, authored by the famous
    Gang of Four (E. Gamma, R. Helm, R. Johnson, and J. Vlissides) in 1994. Defining
    neither standards nor protocols, this work identified common generic software
    designs that have proven useful over the years. The patterns discussed in this
    book are generally thought to fall into three categories: creational, structural,
    and behavioral.'
  merge: -1
  img_proc: true
- pgno: 414
  md: "Examples of many of these patterns have already been presented in this book.\
    \ Here is a brief summary:\n\n| Design pattern | Chapter | Recipe |\n|---|---|---|\n\
    | Singleton | 2 | Defining visibility |\n| Factory | 6 | Implementing a form factory\
    \ |\n| Adapter | 8 | Handling translation without gettext() |\n| Proxy | 7 | Creating\
    \ a simple REST client<br>Creating a simple SOAP client |\n| Iterator | 2 | Recursive\
    \ directory iterator |\n| | 3 | Using iterators |\n\nIn this chapter, we will\
    \ examine a number of additional design patterns, focusing primarily on Concurrency\
    \ and Architectural patterns.\n\n# ## Creating an array to object hydrator\n\n\
    The **Hydrator** pattern is a variation of the **Data Transfer Object** design\
    \ pattern. Its design principle is quite simple: moving data from one place to\
    \ another. In this illustration, we will define classes to move data from an array\
    \ to an object.\n\n# ### How to do it…\n\n+   1.  First, we define a Hydrator\
    \ class that is able to use getters and setters. For this illustration we will\
    \ use `Application\\Generic\\Hydrator\\GetSet`:\n    ```php\n    namespace Application\\\
    Generic\\Hydrator;\n    class GetSet\n    {\n        // code\n    }\n    ```\n\
    2.  Next, we define a hydrate() method, which takes both an array and an object\
    \ as arguments. It then calls the setXXX() methods on the object to populate it\
    \ with values from the array. We use get_class() to determine the object's class,\
    \ and then get_class_methods() to get a list of all methods. preg_match() is used\
    \ to match the method prefix and its suffix, which is subsequently assumed to\
    \ be the array key:\n    ```php\n    public static function hydrate(array $array,\
    \ $object)\n    {\n        $class = get_class($object);\n        $methodList =\
    \ get_class_methods($class);\n    ```"
  merge: -1
  img_proc: true
- pgno: 415
  md: "```\nforeach ($methodList as $method) {\n    preg_match('/^\\(set\\)(.*?)\\\
    $/i', $method, $matches);\n    $prefix = $matches[1] ?? '';\n    $key     = $matches[2]\
    \ ?? '';\n    $key    = strtolower(substr($key, 0, 1)) . substr($key, 1);\n  \
    \  if ($prefix == 'set' && !empty($array[$key])) {\n        $object->$method($array[$key]);\n\
    \    }\n}\nreturn $object;\n```\n\n# How it works...\n\nTo demonstrate how the\
    \ array to hydrator object is used, first define the `Application\\Generic\\Hydrator\\\
    GetSet` class as described in the How to do it... section. Next, define an entity\
    \ class that can be used to test the concept. For the purposes of this illustration,\
    \ create a `Application\\Entity\\Person` class, with the appropriate properties\
    \ and methods. Be sure to define getters and setters for all properties. Not all\
    \ such methods are shown here:\n\n```\nnamespace Application\\Entity;\nclass Person\n\
    {\n    protected $firstName = '';\n    protected $lastName  = '';\n    protected\
    \ $address   = '';\n    protected $city      = '';\n    protected $stateProv =\
    \ '';\n    protected $postalCode = '';\n    protected $country   = '';\n\n   \
    \ public function getFirstName()\n    {\n        return $this->firstName;\n  \
    \  }\n\n    public function setFirstName($firstName)\n    {\n        $this->firstName\
    \ = $firstName;\n    }\n\n    // etc.\n}\n```"
