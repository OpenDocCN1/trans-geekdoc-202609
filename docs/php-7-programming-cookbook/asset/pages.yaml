  md: "# ## Improving performance using the cache\n\nThe cache software design pattern\
    \ is where you store a result that takes a long time to generate. This could take\
    \ the form of a lengthy view script or a complex database query. The storage destination\
    \ needs to be highly performant, of course, if you wish to improve the user experience\
    \ of website visitors. As different installations will have different potential\
    \ storage targets, the cache mechanism lends itself to the adapter pattern as\
    \ well. Examples of potential storage destinations include memory, a database,\
    \ and the filesystem.\n\n# How to do it...\n\n+   1. As with a couple of other\
    \ recipes in this chapter, as there are shared constants, we define a discreet\
    \ Application\\Cache\\Constants class:\n   ```php\n   <?php\n   namespace Application\\\
    Cache;\n\n   class Constants\n   {\n       const DEFAULT_GROUP   = 'default';\n\
    \       const DEFAULT_PREFIX  = 'CACHE_';\n       const DEFAULT_SUFFIX  = '.cache';\n\
    \       const ERROR_GET      = 'ERROR: unable to retrieve from cache';\n     \
    \  // not all constants are shown to conserve space\n   }\n   ```\n\n+   2. Seeing\
    \ as we are following the adapter design pattern, we define an interface next:\n\
    \   ```php\n   namespace Application\\Cache;\n   interface CacheAdapterInterface\n\
    \   {\n       public function hasKey($key);\n       public function getFromCache($key,\
    \ $group);\n       public function saveToCache($key, $data, $group);\n       public\
    \ function removeByKey($key);\n       public function removeByGroup($group);\n\
    \   }\n   ```\n\n+   3. Now we are ready to define our first cache adapter, in\
    \ this illustration, by using a MySQL database. We need to define properties that\
    \ will hold column names as well as prepared statements:\n   ```php\n   namespace\
    \ Application\\Cache;\n   use PDO;\n   use Application\\Database\\Connection;\n\
    \   ```"
