- pgno: 5
  md: '# Foreword


    With PHP 7, we get a host of new features and improvements, such as abstract syntax
    tree, throwable errors, scalar type hints, return type declarations, speed improvements,
    and so much more.


    The question facing PHP developers these days is not "Should I use the new features?",
    but "How do I implement these features to build better applications faster?"


    I remember building applications in PHP 4. It was a simpler time for PHP developers
    as it could be intermingled with HTML and everything was in one file. Instead
    of frameworks, we had libraries of functions that got included. Applications were
    basically just CRUD desktop applications that we figured out how to shovel onto
    the web.


    Application development has changed several times since then. New frameworks,
    such as AJAX, PHPUnit, composer, and API-First, were introduced.


    All of these things, and many others, have influenced how PHP developers build
    applications. Today, you will be laughed out of a job if you have a paged-based
    application that mixed HTML and PHP. So, what will you do? How will you build
    modern PHP applications and APIs? How will you leverage all the new tools that
    PHP gives you to build faster, better, stronger applications? I am so glad you
    asked.


    My friend Doug Bierer has the answer for you. This isn''t YAUT (Yet Another Useless
    Tome) of information that you will put on a shelf and never use. The book you
    are holding in your hands is destined to, quickly, be a part of your ducttape
    library. (Every developer has a ducttape library. It is made up of those books
    you refer to so often that they are now held together by ducttape.)


    Doug takes the time to show you the new features that you need to understand,
    like so many developer books out there. Where this book is different is that the
    author takes the time to show you how to solve real-world problems using these
    new tools. Not only do you learn, but you can immediately solve problems with
    what you learn.'
  merge: -1
  img_proc: true
