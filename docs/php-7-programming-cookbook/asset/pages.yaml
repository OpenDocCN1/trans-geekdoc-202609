    \ performs the actual file movement. Note the extensive series of safety checks\
    \ to help prevent an injection attack. If randomize is not enabled, we use the\
    \ original user-supplied filename:\n\n```\npublic function moveTo($targetPath)\n\
    {\n    if ($this->moved) {\n        throw new Exception(Constants::ERROR_MOVE_DONE);\n\
