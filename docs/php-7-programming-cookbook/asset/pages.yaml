- pgno: 195
  md: '# 6


    # Building Scalable Websites


    In this chapter, we will cover the following topics:


    +   1.  Creating a generic form element generator

    2.  Creating an HTML radio element generator

    3.  Creating an HTML select element generator

    4.  Implementing a form factory

    5.  Chaining `$_POST` filters

    6.  Chaining `$_POST` validators

    7.  Tying validation to a form


    # Introduction


    In this chapter, we will show you how to build classes that generate HTML form
    elements. The generic element generator can be used for text, text areas, passwords,
    and similar HTML input types. After that, we will show variations that allow you
    to pre-configure the element with an array of values. The form factory recipe
    will bring all these generators together, allowing you to render an entire form
    using a single configuration array. Finally, we introduce recipes that allow filtering
    and the validation of incoming `$_POST` data.'
  merge: -1
  img_proc: true
- pgno: 196
  md: "# # Creating a generic form element generator\n\nIt’s pretty easy to create\
    \ a function that simply outputs a form input tag such as <input type=\"text\"\
    \ name=\"whatever\" >. In order to make a form generator generically useful, however,\
    \ we need to think about the bigger picture. Here are some other considerations\
    \ over and above the basic input tag:\n\n+   - The form input tag and its associated\
    \ HTML attributes\n- A label that tells the user what information they are entering\n\
    - The ability to display entry errors following validation (more on that later!)\n\
    - Some sort of wrapper, such as a <div> tag, or an HTML table <td> tag\n\n# ##\
    \ How to do it...\n\n+   1. First, we define a Application\\Form\\Generic class.\
    \ This will also later serve as a base class for specialized form elements:\n\
    \   ```php\n   namespace Application\\Form;\n\n   class Generic\n   {\n      \
    \ // some code ...\n   }\n   ```\n2. Next, we define some class constants, which\
    \ will be generally useful in form element generation.\n3. The first three will\
    \ become keys associated with the major components of a single form element. We\
    \ then define supported input types and defaults:\n   ```php\n   const ROW = 'row';\n\
    \   const FORM = 'form';\n   const INPUT = 'input';\n   const LABEL = 'label';\n\
    \   const ERRORS = 'errors';\n   const TYPE_FORM = 'form';\n   const TYPE_TEXT\
    \ = 'text';\n   const TYPE_EMAIL = 'email';\n   const TYPE_RADIO = 'radio';\n\
    \   const TYPE_SUBMIT = 'submit';\n   const TYPE_SELECT = 'select';\n   const\
    \ TYPE_PASSWORD = 'password';\n   const TYPE_CHECKBOX = 'checkbox';\n   const\
    \ DEFAULT_TYPE = self::TYPE_TEXT;\n   const DEFAULT_WRAPPER = 'div';\n   ```"
  merge: -1
  img_proc: true
- pgno: 197
  md: "+   4. Next, we can define properties and a constructor that sets them.\n\n\
    +   5. In this example, we require two properties, $name and $type, as we cannot\
    \ effectively use the element without these attributes. The other constructor\
    \ arguments are optional. Furthermore, in order to base one form element on another,\
    \ we include a provision whereby the second argument, $type, can alternatively\
    \ be an instance of Application\\\\Form\\\\Generic, in which case we simply run\
    \ the getters (discussed later) to populate properties:\n\n```\nprotected $name;\n\
    protected $type = self::DEFAULT_TYPE;\nprotected $label = '';\nprotected $errors\
    \ = array();\nprotected $wrappers;\nprotected $attributes; // HTML form attributes\n\
    protected $pattern = '<input type=\"$$\" name=\"$s\" $s>';\n```\n\n```\npublic\
    \ function __construct($name,\n                           $type,\n           \
    \                $label = '',\n                           array $wrappers = array(),\n\
    \                           array $attributes = array(),\n                   \
    \        array $errors = array())\n{\n    $this->name = $name;\n    if ($type\
    \ instanceof Generic) {\n        $this->type    = $type->getType();\n        $this->label\
    \   = $type->getLabelValue();\n        $this->errors  = $type->getErrorsArray();\n\
    \        $this->wrappers = $type->getWrappers();\n        $this->attributes =\
    \ $type->getAttributes();\n    } else {\n        $this->type    = $type ?? self::DEFAULT_TYPE;\n\
    \        $this->label   = $label;\n        $this->errors  = $errors;\n       \
    \ $this->attributes = $attributes;\n        if ($wrappers) {\n            $this->wrappers\
    \ = $wrappers;\n        } else {\n            $this->wrappers[self::INPUT]['type']\
    \ = self::DEFAULT_WRAPPER;\n            $this->wrappers[self::LABEL]['type'] =\
    \ self::DEFAULT_WRAPPER;\n            $this->wrappers[self::ERRORS]['type'] =\
    \ self::DEFAULT_WRAPPER;\n        }\n    }\n```"
  merge: -1
  img_proc: true
- pgno: 198
  md: "```\n```\n   }\n   $this->attributes['id'] = $name;\n}\n```\n```\n\n> > Note\
    \ that `$wrappers` has three primary subkeys: INPUT, LABEL, and ERRORS. This allows\
    \ us to define separate wrappers for labels, the input tag, and errors.\n\n+ \
    \  6. Before defining the core methods that will produce HTML for the label, input\
    \ tag, and errors, we should define a `getWrapperPattern()` method, which will\
    \ produce the appropriate wrapping tags for the label, input, and error display.\n\
    \n+   7. If, for example, the wrapper is defined as `<div>`, and its attributes\
    \ include `['class' => 'label']`, this method will return a `sprintf()` format\
    \ pattern that looks like this: `<div class=\"label\">%s</div>`. The final HTML\
    \ produced for the label, for example, would then replace `%s`.\n\n+   8. Here\
    \ is how the `getWrapperPattern()` method might look:\n```\npublic function getWrapperPattern($type)\n\
    {\n    $pattern = '<' . $this->wrappers[$type]['type'];\n    foreach ($this->wrappers[$type]\
    \ as $key => $value) {\n        if ($key != 'type') {\n            $pattern .=\
    \ ' ' . $key . '=\"' . $value . '\"';\n        }\n    }\n    $pattern .= '>' .\
    \ $s . '</' . $this->wrappers[$type]['type'] . '>';\n    return $pattern;\n}\n\
    ```\n\n+   9. We are now ready to define the `getLabel()` method. All this method\
    \ needs to do is to plug the label into the wrapper using `sprintf()`:\n```\n\
    public function getLabel()\n{\n    return sprintf($this->getWrapperPattern(self::LABEL),\n\
    \                   $this->label);\n}\n```\n\n+   10. In order to produce the\
    \ core input tag, we need a way to assemble the attributes. Fortunately, this\
    \ is easily accomplished as long as they are supplied to the constructor in the\
    \ form of an associative array. All we need to do, in this case, is to define\
    \ a `getAttrs()` method that produces a string of key-value pairs separated by\
    \ a space. We return the final value using `trim()` to remove excess spaces."
  merge: -1
  img_proc: true
- pgno: 199
  md: "11. If the element includes either the value or href attribute, for security\
    \ reasons we should escape the values on the assumption that they are, or could\
    \ be, user-supplied (and therefore suspect). Accordingly, we need to add an if\
    \ statement that checks and then uses htmlspecialchars() or urlencode():\n\n```\n\
    public function getAttrs() \n{\n    foreach ($this->attributes as $key => $value)\
    \ {\n        $key = strtolower($key);\n        if ($value) {\n            if ($key\
    \ == 'value') {\n                if (is_array($value)) {\n                   \
    \ foreach ($value as $i => $j) {\n                        $value[$i] = htmlspecialchars($i);\n\
    \                    } else {\n                        $value = htmlspecialchars($value);\n\
    \                    }\n                } elseif ($key == 'href') {\n        \
    \            $value = urlencode($value);\n                }\n                $attrs\
    \ .= $key . '=\"' . $value . '\"';\n            } else {\n                $attrs\
    \ .= $key . ' ';\n            }\n        }\n    }\n    return trim($attrs);\n\
    }\n```\n\n12. For the core input tag, we split the logic into two separate methods.\
    \ The primary method, getInputOnly(), produces only the HTML input tag. The second\
    \ method, getInputWithWrapper(), produces the input embedded in a wrapper. The\
    \ reason for the split is that when creating spin-off classes, such as a class\
    \ to generate radio buttons, we will not need the wrapper:\n\n```\npublic function\
    \ getInputOnly() \n{\n    return sprintf($this->pattern, $this->type, $this->name,\n\
    \                    $this->getAttrs());\n}\n```\n\n```\npublic function getInputWithWrapper()\
    \ \n{\n    return sprintf($this->getWrapperPattern(self::INPUT),\n           \
    \         $this->getInputOnly());\n}\n```"
  merge: -1
  img_proc: true
- pgno: 200
  md: "13. We now define a method that displays element validation errors. We will\
    \ assume that the errors will be supplied in the form of an array. If there are\
    \ no errors, we return an empty string. Otherwise, errors are rendered as <ul><li>error\
    \ 1</li><li>error 2</li></ul> and so on:\n\n```php\npublic function getErrors()\n\
    {\n    if (!$this->errors || count($this->errors == 0)) return '';\n    $html\
    \ = '';\n    $pattern = '<li>%s</li>';\n    $html .= '<ul>';\n    foreach ($this->errors\
    \ as $error)\n        $html .= sprintf($pattern, $error);\n    $html .= '</ul>';\n\
    \    return sprintf($this->getWrapperPattern(self::ERRORS), $html);\n}\n```\n\n\
