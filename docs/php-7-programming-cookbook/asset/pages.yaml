- pgno: 180
  md: "+   The last approach we will consider will be to fetch the results in the\
    \ form of an array, and manually hydrate the entity. Even though this approach\
    \ is slightly more costly in terms of performance, it allows any potential entity\
    \ constructor to run properly, and keeps properties safely defined as private\
    \ or protected:\n\n```\npublic function fetchById($id)\n{\n    $stmt = $this->connection->pdo\n\
    \             ->prepare(Finder::select('customer')\n                        ->where('id\
    \ = :id')->getSql());\n    $stmt->execute(['id' => (int) $id]);\n    return Customer::arrayToEntity(\n\
    \               $stmt->fetch(PDO::FETCH_ASSOC));\n}\n```\n\n+   To process a query\
    \ that produces multiple results, all we need to do is to produce an iteration\
    \ of populated entity objects. In this example, we implement a `fetchByLevel()`\
    \ method that returns all customers for a given level, in the form of `Application\\\
    Entity\\Customer` instances:\n\n```\npublic function fetchByLevel($level)\n{\n\
    \    $stmt = $this->connection->pdo->prepare(\n            Finder::select('customer')\n\
    \                    ->where('level = :level')->getSql());\n    $stmt->execute(['level'\
    \ => $level]);\n    while ($row = $stmt->fetch(PDO::FETCH_ASSOC)) {\n        yield\
    \ Customer::arrayToEntity($row, new Customer());\n    }\n}\n```\n\n+   The next\
    \ method we wish to implement is `save()`. Before we can proceed, however, some\
