- pgno: 391
  md: "+   In the while() loop, we only proceed if the iteration is still valid, which\
    \ is to say still in progress. We then obtain the current key and value, and the\
    \ next key and value. Note the extra if() statement to ensure the iteration is\
    \ still valid (that is, to make sure we don't drop off the end of the list):\n\
    \n```\nwhile ($Iterator->valid()) {\n    $currentLink = $Iterator->current();\n\
    \    $currentKey = $Iterator->key();\n    if (!$Iterator->valid()) break;\n  \
    \  $Iterator->next();\n    $nextLink = $Iterator->current();\n    $nextKey = $Iterator->key();\n\
    ```\n\n+   Next we check to see whether the sort is to be ascending or descending.\
    \ Depending on the direction, we check to see whether the next value is greater\
    \ than, or less than, the current value. The result of the comparison is stored\
    \ in $expr:\n\n```\nif ($Order == 'A') {\n    $expr = $primary[$linked->offsetGet\n\
    \        ($currentKey)]{$sortField} >\n        $primary[$linked->offsetGet($nextKey)]{$sortField};\n\
    } else {\n    $expr = $primary[$linked->offsetGet\n        ($currentKey)]{$sortField}\
    \ <\n        $primary[$linked->offsetGet($nextKey)]{$sortField};\n}\n```\n\n+\
    \   If the value of $expr is TRUE, and we have valid current and next keys, the\
    \ values are swapped in the linked list. We also increment $swaps:\n\n```\nif\
    \ ($expr && $currentKey && $nextKey\n    && $linked->offsetExists($currentKey)\n\
    \    && $linked->offsetExists($nextKey)) {\n    $tmp = $linked->offsetGet($currentKey);\n\
    \    $linked->offsetSet($currentKey,\n        $linked->offsetGet($nextKey));\n\
    \    $linked->offsetSet($nextKey, $tmp);\n    $swaps++;\n}\n```\n\n+   Finally,\
    \ if any swaps have occurred, we need to run through the iteration again, until\
    \ there are no more swaps. Accordingly, we make a recursive call to the same method:\n\
    \n```\nif ($swaps) bubbleSort($linked, $primary, $sortField, $Order);\n```\n\n\
    +   The real return value is the re-organized linked list. We also return the\
    \ number of iterations just for reference:\n\n```\nreturn ++$iterations;\n}\n\
    ```"
