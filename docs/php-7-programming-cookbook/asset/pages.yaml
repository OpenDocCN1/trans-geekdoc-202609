- pgno: 464
  md: "+   5. We then use nested foreach() loops to iterate through the block of data\
    \ one field at a time. For each field, we loop through the callbacks assigned\
    \ to that field:\n\n```\n```PHP\nforeach ($data as $field => $item) {\n\techo\
    \ 'Processing: ' . $field . PHP_EOL;\n\tforeach ($assignments[$field] as $key\
    \ => $option) {\n\t\tif ($validator[$key]['callback']($item, $option)) {\n\t\t\
    \t$message = 'OK';\n\t\t} else {\n\t\t\t$message = $validator[$key]['message'];\n\
    \t\t}\n\t\tprintf('%s : %s' . PHP_EOL, $key, $message);\n\t}\n}\n```\n```\n\n\
    ![](img/39390f6d56c5a83b28db083a8bd5185c_464_0.png)\n\nInstead of echoing the\
