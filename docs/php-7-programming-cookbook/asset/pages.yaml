  md: "2. We will also need to define a formal Application\\Web\\Response response\
    \ class, based on AbstractHttp. The primary difference between this class and\
    \ the others is that it accepts an instance of Application\\Web\\Request as an\
    \ argument. The primary work is accomplished in the __construct( ) method. It’s\
    \ also important to set the Content-Type header and status:\n\n```\n```php\nnamespace\
    \ Application\\Web;\nclass Response extends AbstractHttp\n{\n    public function\
    \ __construct(Request $request = NULL,\n        $status = NULL, $contentType =\
    \ NULL)\n    {\n        if ($request) {\n            $this->uri = $request->getUri();\n\
    \            $this->data = $request->getData();\n            $this->method = $request->getMethod();\n\
    \            $this->cookies = $request->getCookies();\n            $this->setTransport();\n\
    \        }\n        $this->processHeaders($contentType);\n        if ($status)\
    \ {\n            $this->setStatus($status);\n        }\n    }\n    protected function\
    \ processHeaders($contentType)\n    {\n        if (!$contentType) {\n        \
    \    $this->setHeaderByKey(self::HEADER_CONTENT_TYPE,\n                self::CONTENT_TYPE_JSON);\n\
    \        } else {\n            $this->setHeaderByKey(self::HEADER_CONTENT_TYPE,\n\
    \                $contentType);\n        }\n    }\n    public function setStatus($status)\n\
    \    {\n        $this->status = $status;\n    }\n    public function getStatus()\n\
    \    {\n        return $this->status;\n    }\n}\n```\n```"
