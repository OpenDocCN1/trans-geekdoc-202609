  md: "# Best Practices, Testing, and Debugging\n\n```\nforeach ($a as $row) {\n \
    \   $table .= '<tr><td>';\n    $table .= implode('</td><td>', $row);\n    $table\
    \ .= '</td></tr>';\n}\n$table .= '</table>';\nreturn $table;\n```\n\n+   6. We\
    \ can construct a simple test that confirms that the output contains `<table>`,\
    \ one or more characters, followed by `</table>`. Further, we wish to confirm\
    \ that a `<td>B</td>` element exists. When writing the test, we build a test array\
    \ that consists of three sub-arrays containing the letters A–C, D–F, and G–I.\
    \ We then pass the test array to the function, and run assertions against the\
    \ result:\n\n```php\npublic function testTable()\n{\n    $a = [range('A', 'C'),range('D',\
    \ 'F'),range('G','I')];\n    $table = table($a);\n    $this->assertRegExp('!^<table>.+</table>$!',\
    \ $table);\n    $this->assertRegExp('!<td>B</td>!', $table);\n}\n```\n\n+   7.\
    \ To test a class, instead of including a library of functions, simply include\
    \ the file that defines the class to be tested. For the sake of illustration,\
    \ let’s take the library of functions shown previously and move them into a Demo\
    \ class:\n\n```php\n<?php\nclass Demo\n{\n    public function add($a, $b)\n  \
    \  {\n        return $a + $b;\n    }\n\n    public function sub($a, $b)\n    {\n\
    \        return $a - $b;\n    }\n    // etc.\n}\n```"
