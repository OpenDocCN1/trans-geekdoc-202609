- pgno: 152
  md: "# # Using PDO to connect to a database\n\nPDO is a highly performant and actively\
    \ maintained database extension that has a unique advantage over vendor-specific\
    \ extensions. It has a common Application Programming Interface (API) that is\
    \ compatible with almost a dozen different Relational Database Management Systems\
    \ (RDBMS). Learning how to use this extension will save you hours of time trying\
    \ to master the command subsets of the equivalent individual vendor-specific database\
    \ extensions.\n\nPDO is subdivided into four main classes, as summarized in the\
    \ following table:\n\n| Class | Functionality |\n| :--- | :--- |\n| PDO | Maintains\
    \ the actual connection to the database, and also handles low-level functionality\
    \ such as transaction support |\n| PDOStatement | Processes results |\n| PDOException\
    \ | Database-specific exceptions |\n| PDODriver | Communicates with the actual\
    \ vendor-specific database |\n\n# ## How to do it...\n\n+   1.  Set up the database\
    \ connection by creating a `PDO` instance.\n2.  You need to construct a **Data\
    \ Source Name (DSN)**. The information contained in the DSN varies according to\
    \ the database driver used. As an example, here is a DSN used to connect to a\
    \ **MySQL** database:\n\n```\n```\n$params = [\n        'host'  => 'localhost',\n\
    \        'user'  => 'test',\n        'pwd'   => 'password',\n        'db'    =>\
    \ 'php7cookbook'\n];\n\ntry {\n    $dsn = sprintf('mysql:host=%s;dbname=%s',\n\
    \            $params['host'], $params['db']);\n    $pdo = new PDO($dsn, $params['user'],\
    \ $params['pwd']);\n} catch (PDOException $e) {\n    echo $e->getMessage();\n\
    } catch (Throwable $e) {\n    echo $e->getMessage();\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 153
  md: "3. On the other hand, **SQLite**, a simpler extension, only requires the following\
    \ command:\n```php\n$params = [\n    'db' => __DIR__ . '/../data/db/php7cookbook.db.sqlite'\n\
    ];\n$dsn = sprintf('sqlite:' . $params['db']);\n```\n\n4. **PostgreSQL**, on the\
    \ other hand, includes the username and password directly in the DSN:\n```php\n\
    $params = [\n    'host' => 'localhost',\n    'user' => 'test',\n    'pwd' => 'password',\n\
    \    'db' => 'php7cookbook'\n];\n$dsn = sprintf('pgsql:host=%s;dbname=%s;user=%s;password=%s',\n\
    \    $params['host'],\n    $params['db'],\n    $params['user'],\n    $params['pwd']);\n\
    ```\n\n5. The DSN could also include server-specific directives, such as unix_socket,\
    \ as shown in the following example:\n```php\n$params = [\n    'host' => 'localhost',\n\
    \    'user' => 'test',\n    'pwd' => 'password',\n    'db' => 'php7cookbook',\n\
    \    'sock' => '/var/run/mysqld/mysqlq.sock'\n];\n\ntry {\n    $dsn = sprintf('mysql:host=%s;dbname=%s;unix_socket=%s',\n\
    \        $params['host'], $params['db'], $params['sock']);\n    $opts = [PDO::ATTR_ERRMODE\
    \ => PDO::ERRMODE_EXCEPTION];\n    $pdo = new PDO($dsn, $params['user'], $params['pwd'],\
    \ $opts);\n} catch (PDOException $e) {\n    echo $e->getMessage();\n} catch (Throwable\
    \ $e) {\n    echo $e->getMessage();\n}\n```"
  merge: -1
  img_proc: true
- pgno: 154
  md: "Best practice\nWrap the statement that creates the PDO instance in a try {}\
    \ catch {} block. Catch a PDOException for database-specific information in case\
    \ of failure. Catch Throwable for errors or any other exceptions. Set the PDO\
    \ error mode to PDO::ERRMODE_EXCEPTION for best results. See step 8 for more details\
    \ about error modes.\nIn PHP 5, if the PDO object cannot be constructed (for example,\
    \ when invalid parameters are used), the instance is assigned a value of NULL.\
    \ In PHP 7, an Exception is thrown. If you wrap the construction of the PDO object\
    \ in a try {} catch {} block, and the PDO::ATTR_ERRMODE is set to PDO::ERRMODE_EXCEPTION,\
    \ you can catch and log such errors without having to test for NULL.\n\n+   6.\
    \  Send an SQL command using PDO::query(). A PDOStatement instance is returned,\
    \ against which you can fetch results. In this example, we are looking for the\
    \ first 20 customers sorted by ID:\n\n```\n$stmt = $pdo->query(\n'SELECT * FROM\
    \ customer ORDER BY id LIMIT 20');\n```\n\nPDO also provides a convenience method,\
    \ PDO::exec(), which does not return a result iteration, just the number of rows\
    \ affected. This method is best used for administrative operations such as ALTER\
    \ TABLE, DROP TABLE, and so on.\n\n+   7.  Iterate through the PDOStatement instance\
    \ to process results. Set the **fetch mode** to either PDO::FETCH_NUM or PDO::FETCH_ASSOC\
    \ to return results in the form of a numeric or associative array. In this example\
    \ we use a while() loop to process results. When the last result has been fetched,\
    \ the result is a boolean FALSE, ending the loop:\n\n```\nwhile ($row = $stmt->fetch(PDO::FETCH_ASSOC))\
    \ {\n    printf('%4d | %20s | %5s' . PHP_EOL, $row['id'],\n        $row['name'],\
    \ $row['level1']);\n}\n```\n\nPDO fetch operations involve a cursor that defines\
    \ the direction (that is, forward or reverse) of the iteration. The second argument\
    \ to PDOStatement::fetch() can be any of the PDO::FETCH_ORI_* constants. Cursor\
    \ orientations include prior, first, last, absolute, and relative. The default\
    \ cursor orientation is PDO::FETCH_ORI_NEXT."
  merge: -1
  img_proc: true
- pgno: 155
  md: "+   8.  Set the fetch mode to PDO::FETCH_OBJ to return results as a stdClass\
    \ instance. Here you will note that the while() loop takes advantage of the fetch\
    \ mode, PDO::FETCH_OBJ. Notice that the printf() statement refers to object properties,\
    \ in contrast with the preceding example, which references array elements:\n\n\
    ```\nwhile ($row = $stmt->fetch(PDO::FETCH_OBJ)) {\n    printf('%4d | %20s | %5s',\
    \ PHP_EOL,\n           $row->id, $row->name, $row->level);\n}\n```\n\n+   9. \
    \ If you want to create an instance of a specific class while processing a query,\
    \ set the fetch mode to PDO::FETCH_CLASS. You must also have the class definition\
    \ available, and PDO::query() should set the class name. As you can see in the\
    \ following code snippet, we have defined a class called Customer, with public\
    \ properties $id, $name, and $level. Properties need to be public for the fetch\
    \ injection to work properly:\n\n```\nclass Customer\n{\n    public $id;\n   \
    \ public $name;\n    public $level;\n}\n\n$stmt = $pdo->query($sql, PDO::FETCH_CLASS,\
    \ 'Customer');\n```\n\n+   10. When fetching objects, a simpler alternative to\
    \ the technique shown in step 5 is to use PDOStatement::fetchObject():\n\n```\n\
    while ($row = $stmt->fetchObject('Customer')) {\n    printf('%4d | %20s | %5s',\
    \ PHP_EOL,\n           $row->id, $row->name, $row->level);\n}\n```\n\n+   11.\
    \ You could also use PDO::FETCH_INTO, which is essentially the same as PDO::FETCH_CLASS,\
    \ but you need an active object instance instead of a class reference. Each iteration\
    \ through the loop re-populates the same object instance with the current information\
    \ set. This example assumes the same class Customer as in step 5, with the same\
    \ database parameters and PDO connections as defined in step 1:\n\n```\n$cust\
    \ = new Customer();\nwhile ($stmt->fetch(PDO::FETCH_INTO)) {\n    printf('%4d\
    \ | %20s | %5s', PHP_EOL,\n           $cust->id, $cust->name, $cust->level);\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 156
  md: "# Interacting with a Database\n\n+   12. If you do not specify an error mode,\
    \ the default PDO error mode is PDO::ERRMODE_SILENT. You can set the error mode\
    \ using the PDO::ATTR_ERRMODE key, and either the PDO::ERRMODE_WARNING or the\
    \ PDO::ERRMODE_EXCEPTION value. The error mode can be specified as the fourth\
    \ argument to the PDO constructor in the form of an associative array. Alternatively,\
    \ you can use PDO::setAttribute() on an existing instance.\n\n+   13. Let us assume\
    \ you have the following DSN and SQL (before you start thinking that this is a\
    \ new form of SQL, please be assured: this SQL statement will not work!):\n\n\
    ```php\n$params = [\n    'host' => 'localhost',\n    'user' => 'test',\n    'pwd'\
    \  => 'password',\n    'db'     => 'php7cookbook'\n];\n$dsn = sprintf('mysql:host=%s;dbname=%s',\
    \ $params['host'],\n    $params['db']);\n$sql = 'THIS SQL STATEMENT WILL NOT WORK';\n\
    ```\n\n+   14. If you then formulate your PDO connection using the default error\
    \ mode, the only clue that something is wrong is that instead of producing a PDOStatement\
    \ instance, the PDO::query() will return a boolean FALSE:\n\n```php\n$pdo1 = new\
    \ PDO($dsn, $params['user'], $params['pwd']);\n$stmt = $pdo1->query($sql);\n$row\
    \ = ($stmt) ? $stmt->fetch(PDO::FETCH_ASSOC) : 'No Good';\n```\n\n+   15. The\
