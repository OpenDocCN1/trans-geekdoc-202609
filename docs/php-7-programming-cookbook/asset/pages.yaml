  md: "Here is how the output might appear:\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_579_0.png)\n\
    \n# See also\n\n+   For more information on PSR, please have a look at https://en.wikipedia.org/wiki/PHP_Standard_Recommendation\
    \  \nFor information on PSR-7 specifically, here is the official description:\
    \ http://www.php-fig.org/psr/psr-7/  \nFor information on PHP streams, take a\
    \ look at http://php.net/manual/en/book.stream.php\n\n# Developing a PSR-7 Request\
    \ class\n\nOne of the key characteristics of PSR-7 middleware is the use of **Request**\
    \ and **Response** classes. When applied, this enables different blocks of software\
    \ to perform together without sharing any specific knowledge between them. In\
    \ this context, a request class should encompass all aspects of the original user\
    \ request, including such items as browser settings, the original URL requested,\
    \ parameters passed, and so forth."
