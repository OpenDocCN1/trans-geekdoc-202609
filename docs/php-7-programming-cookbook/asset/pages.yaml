  img_proc: true
- pgno: 402
  md: "7. Now that the core SELECT has been defined, we remove any trailing OR keywords,\
    \ and add a clause that causes the result to be sorted according to the search\
    \ column. The statement is then sent to the database to be prepared:\n\n```\n\
    ```php\n$this->sql = substr($this->sql, 0, -4)\n    . ' ORDER BY ' . $this->mapping[$Criteria->key];\n\
    $statement = $this->connection->pdo->prepare($this->sql);\nreturn $statement;\n\
    }\n```\n```\n\n8. We are now ready to move on to the main show, the search() method.\
    \ We accept an Application\\Database\\Search\\Criteria object as an argument.\
    \ This ensures that we have an item key and operator at a minimum. To be on the\
    \ safe side, we add an if() statement to check these properties:\n\n```\n```php\n\
    public function search(Criteria $Criteria)\n{\n    if (empty($Criteria->key) ||\
    \ empty($Criteria->operator)) {\n        yield ['error' => self::ERROR_INVALID];\n\
    \        return FALSE;\n    }\n```\n```\n\n9. We then call prepareStatement()\
    \ using try / catch to trap errors:\n\n```\n```php\ntry {\n    if (!$statement\
    \ = $this->prepareStatement($Criteria)) {\n        yield ['error' => self::ERROR_PREPARE];\n\
    \        return FALSE;\n    }\n```\n```\n\n10. Next we build an array of parameters\
    \ that will be supplied to execute(). The key represents the database column name\
    \ that was used as a placeholder in the prepared statement. Note that instead\
    \ of using =, we use the LIKE $value$ construct:\n\n```\n```php\n$params = array();\n\
    switch ($Criteria->operator) {\n    case 'NOT NULL' :\n        // do nothing;\
    \ already in statement\n        break;\n    case 'LIKE' :\n        $params[$this->mapping[$Criteria->key]]\
    \ =\n            '%' . $Criteria->item . '%';\n        break;\n    default :\n\
    \        $params[$this->mapping[$Criteria->key]] =\n            $Criteria->item;\n\
    }\n```\n```"
  merge: -1
  img_proc: true
- pgno: 403
  md: "+   11. The statement is executed, and the results returned using the `yield`\
    \ keywords, which effectively turns this method into a generator:\n\n```\n```PHP\n\
    \    $statement->execute($params);\n    while ($row = $statement->fetch(PDO::FETCH_ASSOC))\
    \ {\n        yield $row;\n    }\n    } catch (\\Throwable $e) {\n        error_log(__METHOD__\
    \ . ':' . $e->getMessage());\n        throw new Exception(self::ERROR_EXECUTE);\n\
    \    }\n    return TRUE;\n}\n```\n```\n\n# How it works...\n\nPlace the code discussed\
    \ in this recipe in the files Criteria.php and Engine.php under Application\\\
