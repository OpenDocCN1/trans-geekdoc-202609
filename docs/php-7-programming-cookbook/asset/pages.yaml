    >\n    </script>\n    <script type=\"text/javascript\"\n        charset=\"utf8\"\
    \n        src=\"//cdn.datatables.net/1.10.11/js/jquery.dataTables.js\">\n    </script>\n\
    \    <link rel=\"stylesheet\"\n        type=\"text/css\"\n        href=\"//cdn.datatables.net/1.10.11/css/jquery.dataTables.css\"\
    >\n</head>\n```\n```\n\n+   5. We then define a jQuery document ready function,\
    \ which associates a table with DataTables. In this case, we assign an id attribute\
    \ of customerTable to the table element that will be assigned to DataTables. You'll\
    \ also notice that we specify the AJAX data source as the script defined in step\
    \ 1, chap_05_jquery_datatables_php_lookups_ajax.php. As we have the $id available,\
    \ this is appended to the data source URL:\n\n```\n```html\n<script>\n    $(document).ready(function()\
    \ {\n        $('#customerTable').DataTable(\n            { \"ajax\": '/chap_05_jquery_datatables_php_lookups_ajax.php?id=<?=\
    \ $id ?>'}\n        );\n    });\n</script>\n```\n```"
