- pgno: 397
  md: "+   5. We then implement a `while()` loop and set the midpoint:\n   ```\n \
    \  while ($loop && !$found) {\n       $mid = (int) (($upper - $lower) / 2) + $lower;\n\
    \   ```\n\n+   6. We now get to use the new PHP 7 **spaceship operator**, which\
    \ gives us, in a single comparison, less than, equal to, or greater than. If less,\
    \ we set the upper limit to the midpoint. If greater, the lower limit is adjusted\
    \ to the midpoint. If equal, we're done and home free:\n   ```\n   switch ($item\
    \ <=> $binary[$mid]) {\n       // $item < $binary[$mid]\n       case -1 :\n  \
    \         $upper = $mid;\n           break;\n       // $item == $binary[$mid]\n\
    \       case 0 :\n           $found = $binary[$mid];\n           break;\n    \
    \   // $item > $binary[$mid]\n       case 1 :\n       default :\n           $lower\
    \ = $mid;\n   }\n\n+   7. Now for a bit of loop control. We increment the number\
    \ of iterations and make sure it does not exceed the size of the list. If so,\
    \ something is definitely wrong and we need to bail out. Otherwise, we check to\
    \ see whether the upper and lower limits are the same more than twice in a row,\
    \ in which case the search item has not been found. Then we store the number of\
    \ iterations and return whatever was found (or not):\n   ```\n   $loop = (($iterations++\
    \ < $max) && ($done < 1));\n   $done += ($upper == $lower) ? 1 : 0;\n   }\n  \
    \ $this->iterations = $iterations;\n   return $found;"
