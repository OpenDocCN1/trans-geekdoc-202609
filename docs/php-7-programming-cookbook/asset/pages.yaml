- pgno: 374
  md: "6. The JSON extension was not introduced until PHP 5. Accordingly, we need\
    \ to be satisfied with raw input. We could also possibly use `serialize()` or\
    \ `unserialize()` in place of `json_encode()` and `json_decode()`:\n\n```\nfunction\
    \ getParsedBody()\n{\n        if (!$this->parsedBody) {\n            if (($this->getContentType()\
    \ ==\n                Constants::CONTENT_TYPE_FORM_ENCODED\n                ||\
    \ $this->getContentType() ==\n                Constants::CONTENT_TYPE_MULTI_FORM)\n\
    \                && $this->getRequestMethod() ==\n                Constants::METHOD_POST)\n\
    \            {\n                $this->parsedBody = $_POST;\n            } elseif\
    \ ($this->getContentType() ==\n                Constants::CONTENT_TYPE_JSON\n\
    \                || $this->getContentType() ==\n                Constants::CONTENT_TYPE_HAL_JSON)\n\
    \            {\n                ini_set('allow_url_fopen', true);\n          \
    \      $this->parsedBody =\n                    file_get_contents('php://stdin');\n\
    \            } elseif (empty($_REQUEST)) {\n                $this->parsedBody\
    \ = $_REQUEST;\n            } else {\n                ini_set('allow_url_fopen',\
    \ true);\n                $this->parsedBody =\n                    file_get_contents('php://stdin');\n\
    \            }\n        }\n        return $this->parsedBody;\n    }\n```\n\n7.\
    \ The `withXXX()` methods work pretty much the same in PHP 4:\n\n```\nfunction\
    \ withParsedBody($data)\n{\n        $this->parsedBody = $data;\n        return\
    \ $this;\n    }\n```"
