  md: "# Implementing class autoloading\n\nWhen developing PHP using an **object-oriented\
    \ programming (OOP)** approach, the recommendation is to place each class in its\
    \ own file. The advantage of following this recommendation is the ease of long-term\
    \ maintenance and improved readability. The disadvantage is that each class definition\
    \ file must be included (that is, using `include` or its variants). To address\
    \ this issue, there is a mechanism built into the PHP language that will `autoload`\
    \ any class that has not already been specifically included.\n\n# Getting ready\n\
    \nThe minimum requirement for PHP autoloading is to define a global `__autoload(\
    \ )` function. This is a *magic* function called automatically by the PHP engine\
    \ when a class is requested but where said class has not been included. The name\
    \ of the requested class will appear as a parameter when `__autoload( )` is invoked\
    \ (assuming that you have defined it!). If you are using PHP namespaces, the full\
    \ namespaced name of the class will be passed. Because `__autoload( )` is a *function*,\
    \ it must be in the global namespace; however, there are limitations on its use.\
    \ Accordingly, in this recipe, we will make use of the `spl_autoload_register(\
    \ )` function, which gives us more flexibility.\n\n# How to do it...\n\n+   1.\
    \ The class we will cover in this recipe is `Application\\Autoload\\Loader`. In\
    \ order to take advantage of the relationship between PHP namespaces and autoloading,\
    \ we name the file `Loader.php` and place it in the `/path/to/cockbook/files/Application/Autoload`\
    \ folder.\n\n+   2. The first method we will present simply loads a file. We use\
    \ `file_exists( )` to check before running `require_once( )`. The reason for this\
    \ is that if the file is not found, `require_once( )` will generate a fatal error\
    \ that cannot be caught using PHP 7's new error handling capabilities:\n\n```\n\
    protected static function loadFile($file)\n{\n    if (file_exists($file)) {\n\
    \        require_once $file;\n        return TRUE;\n    }\n    return FALSE;\n\
    }\n```\n\n+   3. We can then test the return value of `loadFile( )` in the calling\
    \ program and loop through a list of alternate directories before throwing an\
    \ `Exception` if it's ultimately unable to load the file."
