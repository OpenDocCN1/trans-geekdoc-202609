- pgno: 526
  md: "# ### Using mock classes\n\n+   1. In some cases, the test will access complex\
    \ components that require external resources. An example is a service class that\
    \ needs access to a database. It is a best practice to minimize database access\
    \ in a test suite. Another consideration is that we are not testing database access;\
    \ we are only testing the functionality of one specific class. Accordingly, it\
    \ is sometimes necessary to define **mock** classes that mimic the behavior of\
    \ the their parent class, but that restrict access to external resources.\n\n\
    > > **Best practice**\n> Limit actual database access in your tests to the Model\
    \ (or equivalent) classes. Otherwise, the time it takes to run the entire set\
    \ of tests could become excessive.\n\n+   2. In this case, for illustration, define\
    \ a service class, `VisitorService`, which makes use of the `VisitorOps` class\
    \ discussed earlier:\n\n   ```php\n   <?php\n   require_once __DIR__ . '/VisitorOps.php';\n\
    \   require_once __DIR__ . '/../Application/Database/Connection.php';\n   use\
    \ Application\\Database\\Connection;\n   class VisitorService\n   {\n       protected\
    \ $visitorOps;\n       public function __construct(array $config)\n       {\n\
    \           $this->visitorOps = new VisitorOps($config);\n       }\n       public\
    \ function showAllVisitors()\n       {\n           $table = '<table>';\n     \
    \      foreach ($this->visitorOps->findall() as $row) {\n               $table\
    \ .= '<tr><td>';\n               $table .= implode('</td><td>', $row);\n     \
    \          $table .='</td></tr>';\n           }\n           $table .= '</table>';\n\
    \           return $table;\n       }\n   ```\n\n+   3. For test purposes, we add\
    \ a getter and setter for the `$visitorOps` property. This allows us to insert\
    \ a mock class in place of the real `VisitorOps` class:\n\n   ```php\n   public\
    \ function getVisitorOps()\n   {\n       return $this->visitorOps;\n   ```"
