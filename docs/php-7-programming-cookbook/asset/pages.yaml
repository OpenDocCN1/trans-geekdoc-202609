  md: "8.  Finally we define match(), which iterates through the configuration array\
    \ and runs the uri parameter through preg_match(). If positive, the configuration\
    \ key and $matches array populated by preg_match() are stored in $routeMatch,\
    \ and the callback is returned. If there is no match, the default callback is\
    \ returned:\n\n```\npublic function match() \n{\n    foreach ($this->config as\
    \ $key => $route) {\n        if (preg_match($route['uri'],\n            $this->requestUri,\
    \ $matches)) {\n            $this->routeMatch['key'] = $key;\n            $this->routeMatch['match']\
    \ = $matches;\n            return $route['exec'];\n        }\n    }\n\n    return\
    \ $this->config[self::DEFAULT_MATCH]['exec'];\n}\n```\n\n# How it works...\n\n\
    First, change to /path/to/source/for/this/chapter and create a directory called\
    \ routing. Next, define a file, index.php, which sets up autoloading and uses\
    \ the right classes. You can define a constant PAGE_DIR that points to the pages\
    \ directory created in the previous recipe:\n\n```\n<?php\n    define('DOC_ROOT',\
    \ __DIR__);\n    define('PAGE_DIR', DOC_ROOT . '/../pages');\n\n    require_once\
    \ __DIR__ . '/../../Application/Autoload/Loader.php';\n    Application\\Autoload\\\
    Loader::init(__DIR__ . '/../..');\n    use Application\\MiddleWare\\ServerRequest;\n\
    \    use Application\\Routing\\Router;\n```\n\nNext, add the configuration array\
    \ discussed in step 3 of this recipe. Note that you could add ()? at the end of\
    \ the pattern to account for an optional trailing slash. Also, for the home route,\
    \ you could offer two options: either / or /home:\n\n```\n$config = [\n    'home'\
    \ => [\n        'uri' => '!^(//home)$!?',\n        'exec' => function ($matches)\
    \ {\n            include PAGE_DIR . '/page0.php';\n        }\n```"
