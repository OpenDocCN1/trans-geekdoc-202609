- pgno: 592
  md: "After that, you can define a server program, chap_09_middleware_server.php,\
    \ which sets up autoloading and uses the appropriate classes. This script will\
    \ pull the incoming request into a `ServerRequest` instance, initialize it, and\
    \ then use `var_dump()` to show what information was received:\n\n```\n<?php\n\
    require __DIR__ . '/../Application/Autoload/Loader.php';\nApplication\\Autoload\\\
    Loader::init(__DIR__ . '../');\nuse Application\\MiddleWare\\ServerRequest;\n\n\
    $request = new ServerRequest();\n$request->initialize();\necho '<pre>', var_dump($request),\
    \ '</pre>';\n```\n\nTo run the server program, first change to the /path/to/source/for/this/chapter\
    \ folder. You can then run the following command:\n\n```\nphp -S localhost:8080\
    \ chap_09_middleware_server.php'\n```\n\nAs for the client, first create a calling\
    \ program, chap_09_middleware_request.php, that sets up autoloading, uses the\
    \ appropriate classes, and defines the target server and a local text file:\n\n\
    ```\n<?php\ndefine('READ_FILE', __DIR__ . '/getysburg.txt');\ndefine('TEST_SERVER',\
    \ 'http://localhost:8080/');\nrequire __DIR__ . '/../Application/Autoload/Loader.php';\n\
    Application\\Autoload\\Loader::init(__DIR__ . '../');\nuse Application\\MiddleWare{\
    \ Request, Stream, Constants };\n```\n\nNext, you can create a Stream instance\
    \ using the text as a source. This will become the body of a new Request, which,\
    \ in this case, mirrors what might be expected for a form posting:\n\n```\n$body\
    \ = new Stream(READ_FILE);\n```\n\nYou can then directly build a Request instance,\
    \ supplying parameters as appropriate:\n\n```\n$request = new Request(\n    TEST_SERVER,\n\
    \    Constants::METHOD_POST,\n    $body,\n    [Constants::HEADER_CONTENT_TYPE\
    \ =>\n        Constants::CONTENT_TYPE_FORM_ENCODED,\n        Constants::HEADER_CONTENT_LENGTH\
    \ => $body->getSize()]\n    );\n```"
  merge: -1
  img_proc: true
- pgno: 593
  md: 'Alternatively, you can use the fluent interface syntax to produce exactly the
    same results:


    ```

    $uriObj = new Uri(TEST_SERVER); $request = new Request(); $request->withRequestTarget(TEST_SERVER)
    ->withMethod(Constants::METHOD_POST) ->withBody($body) ->withHeader(Constants::HEADER_CONTENT_TYPE,
    Constants::CONTENT_TYPE_FORM_ENCODED) ->withAddedHeader( Constants::HEADER_CONTENT_LENGTH,
    $body->getSize());

    ```


    You can then set up a cURL resource to simulate a form posting, where the data
    parameter is the contents of the text file. You can follow that with curl_init(),
    curl_exec(), and so on, echoing the results:


    ```

    $data = http_build_query([''data'' => $request->getBody()->getContents()]); $defaults
    = array( CURLOPT_URL => $request->getUri()->getUriString(), CURLOPT_POST => true,
    CURLOPT_POSTFIELDS => $data, ); $ch = curl_init(); curl_setopt_array($ch, $defaults);
    $response = curl_exec($ch); curl_close($ch);

    ```


    Here is how the direct output might appear:


    ![](img/39390f6d56c5a83b28db083a8bd5185c_593_0.png)'
