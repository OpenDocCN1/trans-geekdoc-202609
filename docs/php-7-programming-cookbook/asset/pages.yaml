    </table>\n<input type=\"hidden\" name=\"token\" value=\"<?= $token ?>\" />\n</form>\n\
    <a href=\"/chap_12_form_view_results.php\">\n    CLICK HERE</a> to view results\n\
    </div>\n</body>\n</html>\n```\n\nWhen we display and submit data from the form,\
    \ the token is validated and the data insertion is allowed to continue, as shown\
    \ here:\n\n![](img/39390f6d56c5a83b28db083a8bd5185c_477_0.png)\n\n# **See also**\n\
    \nFor more information on CSRF attacks, please refer to `https://www.owasp.org/index.php/Cross-Site_Request_Forgery_(CSRF)`.\n\
    \n# ## Building a secure password generator\n\nA common misconception is that\
    \ the only way attackers crack hashed passwords is by using **brute force attacks**\
    \ and **rainbow tables**. Although this is often the first pass in an attack sequence,\
    \ attackers will use much more sophisticated attacks on a second, third, or fourth\
    \ pass. Other attacks include *combination*, *dictionary*, *mask*, and *rules-based*.\
    \ Dictionary attacks use a database of words literally from the dictionary to\
    \ guess passwords. Combination is where dictionary words are combined. Mask attacks\
    \ are similar to brute force, but more selective, thus cutting down the time to\
    \ crack. Rules-based attacks will detect things such as substituting the number\
    \ 0 for the letter o."
