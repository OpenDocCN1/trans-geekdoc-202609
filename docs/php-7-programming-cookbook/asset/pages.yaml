  md: "> A complete list of HTTP status codes can be found here: https://tools.ietf.org/html/rfc7231#section-6.1.\n\
    \n3. Next, we will tackle classes that represent value objects used by other PSR-7\
    \ classes. For a start, here is the class that represents a URI. In the constructor,\
    \ we accept a URI string as an argument, and break it down into its component\
    \ parts using the parse_url() function:\n\n```\n```php\nnamespace Application\\\
    \\MiddleWare;\nuse InvalidArgumentException;\nuse Psr\\\\Http\\\\Message\\\\UriInterface;\n\
    class Uri implements UriInterface\n{\n    protected $uriString;\n    protected\
    \ $uriParts = array();\n\n    public function __construct($uriString)\n    {\n\
    \        $this->uriParts = parse_url($uriString);\n        if (!$this->uriParts)\
    \ {\n            throw new InvalidArgumentException(\n                Constants::ERROR_INVALID_URI);\n\
    \        }\n        $this->uriString = $uriString;\n    }\n```\n\n```\n\n> **URI**\
    \ stands for **Uniform Resource Indicator**. This is what you would see at the\
    \ top of your browser when making a request. For more information on what comprises\
    \ a URL, have a look at http://tools.ietf.org/html/rfc3986.\n\n4. Following the\
    \ constructor, we define methods to access the component parts of the URI. The\
    \ **scheme** represents a PHP wrapper (that is, HTTP, FTP, and so on):\n\n```\n\
    ```php\npublic function getScheme()\n{\n    return strtolower($this->uriParts['scheme'])\
    \ ?? '';\n}\n```\n\n```\n\n5. The **authority** represents the username (if present),\
    \ the host, and optionally the port number:\n\n```\n```php\npublic function getAuthority()\n\
    {\n    $val = '';\n    if (!empty($this->getUserInfo()))\n        $val .= $this->getUserInfo()\
    \ . '@';\n```\n\n```"
