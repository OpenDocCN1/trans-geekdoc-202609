    \  6.  Finally, we define a method that returns the reason for the HTTP status,\
    \ which is a short text phrase, in this example, based on RFC 7231. Note the use\
    \ of the PHP 7 null coalesce operator `??` that returns the first non-null item\
    \ out of three possible choices:\n    ```\n    public function getReasonPhrase()\n\
    \    {\n        return $this->status['reason']\n    ```"
