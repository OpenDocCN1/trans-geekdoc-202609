  md: "# Defining a cURL-based REST client\n\nWe will now have a look at our second\
    \ approach for a REST client, one of which is based on the cURL extension:\n\n\
    +   1. For this approach, we will assume the same request and response classes.\
    \ The initial class definition is much the same as for the Streams client discussed\
    \ previously:\n   ```php\n   namespace Application\\Web\\Client;\n   use Application\\\
    Web\\{ Request, Received };\n   class Curl\n   {\n   ```\n\n+   2. The send()\
    \ method is quite a bit simpler than when using Streams. All we need to do is\
    \ to define an array of options, and let cURL do the rest:\n   ```php\n   public\
    \ static function send(Request $request)\n   {\n       $data = $request->getDataEncoded();\n\
    \       $received = new Received();\n       switch ($request->getMethod()) {\n\
    \       case Request::METHOD_GET :\n       $uri = ($data\n           ? $request->getUri()\
    \ . '?' . $data\n           : $request->getUri());\n       $options = [\n    \
    \       CURLOPT_URL => $uri,\n           CURLOPT_HEADER => 0,\n           CURLOPT_RETURNTRANSFER\
    \ => TRUE,\n           CURLOPT_TIMEOUT => 4\n       ];\n       break;\n      \
    \ ```\n\n+   3. POST requires slightly different cURL parameters:\n   ```php\n\
    \   case Request::METHOD_POST :\n   $options = [\n       CURLOPT_POST => 1,\n\
    \       CURLOPT_HEADER => 0,\n       CURLOPT_URL => $request->getUri(),\n    \
    \   CURLOPT_FRESH_CONNECT => 1,\n       CURLOPT_RETURNTRANSFER => 1,\n       CURLOPT_FORBID_REUSE\
    \ => 1,\n       CURLOPT_TIMEOUT => 4,\n       CURLOPT_POSTFIELDS => $data\n  \
    \ ];\n   break;\n   ```"
  merge: -1
