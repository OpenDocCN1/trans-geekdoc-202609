  md: "If, on the other hand, you use a `try`/`catch` block, the exception will be\
    \ caught and your application is allowed to continue, if it is stable enough:\n\
    \n```\n```PHP\n    try {\n        $throws1 = new ThrowsException($config);\n \
    \   } catch (Exception $e) {\n        echo 'Exception Caught: ' . get_class($e)\
    \ . ':' . $e->getMessage()\n            . PHP_EOL;\n    }\n    echo 'Application\
    \ Continues ...' . PHP_EOL;\n```\n```\n\nYou will observe the following output:\n\
    \n![](img/39390f6d56c5a83b28db083a8bd5185c_514_0.png)\n\nTo demonstrate use of\
    \ the exception handler, define a Handler instance, passing a parameter that represents\
    \ the directory to contain log files, before the try/catch block. After try/catch,\
    \ outside the block, create another instance of ThrowsException. When you run\
    \ this sample program, you will notice that the first exception is caught inside\
    \ the try/catch block, and the second exception is caught by the handler. You\
    \ will also note that after the handler, the application ends:\n\n```\n```PHP\n\
    \    $handler = new Handler(__DIR__ . '/logs');\n    try {\n        $throws1 =\
    \ new ThrowsException($config);\n    } catch (Exception $e) {\n        echo 'Exception\
    \ Caught: ' . get_class($e) . ':'\n            . $e->getMessage() . PHP_EOL;\n\
    \    }\n    $throws1 = new ThrowsException($config);\n    echo 'Application Continues\
    \ ...' . PHP_EOL;\n```\n```"
