    \ || !file_exists($tempFile)) {\n        throw new Exception(Constants::ERROR_BAD_FILE);\n\
    \    }\n    if (is_uploaded_file($tempFile)) {\n        throw new Exception(Constants::ERROR_FILE_NOT);\n\
    \    }\n```"
