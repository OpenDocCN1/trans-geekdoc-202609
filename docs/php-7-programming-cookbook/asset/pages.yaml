  md: "After that, we set up a `try {...} catch (...)` block, which catches `Throwable`.\
    \ This allows us to catch both exceptions and errors:\n\n```\n```php\n    try\
    \ {\n        // code goes here\n    } catch (Throwable $e) {\n        echo $e->getMessage();\n\
    \    }\n```\n```\n\nInside the `try {...} catch (...)` block we get an instance\
    \ of the connection and large file iterator classes:\n\n```\n```php\n    $connection\
    \ = new Application\\Database\\Connection(\n        include __DIR__ . DB_CONFIG_FILE);\n\
    \    $iterator = (new Application\\Iterator\\LargeFile(__DIR__ . CSV_FILE))\n\
    \        ->getIterator('Csv');\n```\n```\n\nWe then take advantage of the PDO\
    \ prepare/execute functionality. The SQL for the prepared statement uses `?` to\
    \ represent values that are supplied in a loop:\n\n```\n```php\n    $sql = 'INSERT\
    \ INTO `prospects` '\n        . '(\"id\",\"first_name\",\"last_name\",\"address\"\
    ,\"city\",\"state_province\",'\n        . '\"postal_code\",\"phone\",\"country\"\
    ,\"email\",\"status\",\"budget\",'\n        . '\"last_updated\") '\n        .\
    \ ' VALUES (?,?,?,?,?,?,?,?,?,?,?,?)';\n    $statement = $connection->pdo->prepare($sql);\n\
    ```\n```\n\nWe then use `foreach()` to loop through the file iterator. Each `yield`\
    \ statement produces an array of values that represents a row in the database.\
    \ We can then use these values with `PDOStatement::execute()` to execute the prepared\
    \ statement, inserting the row of values into the database:\n\n```\n```php\n \
    \   foreach ($iterator as $row) {\n        echo implode(',', $row) . PHP_EOL;\n\
    \        $statement->execute($row);\n    }\n```\n```\n\nYou can then examine the\
    \ database to verify that the data was successfully inserted.\n\n# Recursive directory\
    \ iterator\n\nGetting a list of files in a directory is extremely easy. Traditionally,\
    \ developers have used the `glob()` function for this purpose. To recursively\
    \ get a list of all files and directories from a specific point in a directory\
    \ tree is more problematic. This recipe takes advantage of an **(SPL Standard\
    \ PHP Library)** class `RecursiveDirectoryIterator`, which will serve this purpose\
    \ admirably."
