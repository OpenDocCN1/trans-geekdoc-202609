  md: "```\n__DIR__ . '/' . $data[$id]);\n} else {\n$body['text'] = $data;\n}\n```\n\
    \nOtherwise, return a response indicating a success code 204 and the size of the\
    \ request body received:\n\n```\n} elseif ($request->getMethod() == Constants::METHOD_POST)\
    \ {\n    $size = $request->getBody()->getSize();\n    $body['text'] = $size .\
    \ ' bytes of data received';\n    if ($size) {\n        $code = 201;\n    } else\
    \ {\n        $code = 204;\n    }\n}\n```\n\nYou can then catch any exceptions\
    \ and report them with a status code of 500:\n\n```\n} catch (Exception $e) {\n\
    \    $code = 500;\n    $body['text'] = 'ERROR: ' . $e->getMessage();\n}\n```\n\
    \nThe response needs to be wrapped in a stream, so you can write the body out\
