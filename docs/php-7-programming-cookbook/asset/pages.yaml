    \ retrieved could potentially be massive. Thus, it's better to immediately yield\
    \ the results in order to conserve memory and to produce immediate results. Otherwise,\
    \ there would be a lengthy wait, which would probably be followed by an out of\
    \ memory error.\n\n+   3. In order to keep within the same domain, we need a method\
    \ that will return the domain from the URL. We use the convenient `parse_url()`\
    \ function for this purpose:\n\n```\n```\npublic function getDomain($url)\n{\n\
    \    if (!$this->domain) {\n```\n\n```"
