  md: "# # Implementing a strategy pattern\n\nIt is often the case that runtime conditions\
    \ force the developer to define several ways of doing the same thing. Traditionally,\
    \ this involved a massive if/elseif/else block of commands. You would then either\
    \ have to define large blocks of logic inside the if statement, or create a series\
    \ of functions or methods to enable the different approaches. The strategy pattern\
    \ attempts to formalize this process by having the primary class encapsulate a\
    \ series of sub-classes that represent different approaches to solve the same\
    \ problem.\n\n# ## How to do it...\n\n+   1. In this illustration, we will use\
    \ the GetSet hydrator class defined previously as a strategy. We will define a\
    \ primary `Application\\Generic\\Hydrator\\Any` class, which will then consume\
    \ strategy classes in the `Application\\Generic\\Hydrator\\Strategy` namespace,\
    \ including `GetSet`, `PublicProps`, and `Extending`.\n\n+   2. We first define\
    \ class constants that reflect the built-in strategies that are available:\n\n\
    namespace Application\\Generic\\Hydrator;\nuse InvalidArgumentException;\nuse\
    \ Application\\Generic\\Hydrator\\Strategy\\ { GetSet, PublicProps, Extending\
    \ };\nclass Any\n{\n    const STRATEGY_PUBLIC = 'PublicProps';\n    const STRATEGY_GET_SET\
    \ = 'GetSet';\n    const STRATEGY_EXTEND = 'Extending';\n    protected $strategies;\n\
    \    public $chosen;\n\n\n+   3. We then define a constructor that adds all built-in\
    \ strategies to the $strategies property:\n\npublic function __construct()\n{\n\
    \    $this->strategies[self::STRATEGY_GET_SET] = new GetSet();\n    $this->strategies[self::STRATEGY_PUBLIC]\
    \ = new PublicProps();\n    $this->strategies[self::STRATEGY_EXTEND] = new Extending();\n\
    }"
  merge: -1
  img_proc: true
- pgno: 420
  md: "+   We also add an `addStrategy()` method that allows us to overwrite or add\
    \ new strategies without having to recode the class:\n\n```\npublic function addStrategy($key,\
    \ HydratorInterface $strategy) \n{\n    $this->strategies[$key] = $strategy;\n\
    }\n```\n\n+   The `hydrate()` and `extract()` methods simply call those of the\
    \ chosen strategy:\n\n```\npublic function hydrate(array $array, $object)\n{\n\
    \    $strategy = $this->chooseStrategy($object);\n    $this->chosen = get_class($strategy);\n\
    \    return $strategy::hydrate($array, $object);\n}\n\npublic function extract($object)\n\
    {\n    $strategy = $this->chooseStrategy($object);\n    $this->chosen = get_class($strategy);\n\
    \    return $strategy::extract($object);\n}\n```\n\n+   The tricky bit is figuring\
    \ out which hydration strategy to choose. For this purpose we define `chooseStrategy()`,\
    \ which takes an object as an argument. We first perform some detective work by\
    \ way of getting a list of class methods. We then scan through the list to see\
    \ if we have any `getX()` or `setX()` methods. If so, we choose the `GetSet` hydrator\
    \ as our chosen strategy:\n\n```\npublic function chooseStrategy($object)\n{\n\
    \    $strategy = NULL;\n    $methodList = get_class_methods(get_class($object));\n\
    \    if (!empty($methodList) && is_array($methodList)) {\n        $getSet = FALSE;\n\
    \        foreach ($methodList as $method) {\n            if (preg_match('/^(get|set).*$/',\
    \ $method)) {\n                $strategy = $this->strategies[self::STRATEGY_GET_SET];\n\
    \                break;\n            }\n        }\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 421
  md: "+   7. Still within our chooseStrategy() method, if there are no getters or\
    \ setters, we next use get_class_vars() to determine if there are any available\
    \ properties. If so, we choose PublicProps as our hydrator:\nif (!$strategy) {\n\
    \    $vars = get_class_vars(get_class($object));\n    if (!empty($vars) && count($vars))\
    \ {\n        $strategy = $this->strategies[self::STRATEGY_PUBLIC];\n    }\n}\n\
    \n\n+   8. If all else fails, we fall back to the Extending hydrator, which returns\
    \ a new class that simply extends the object class, thus making any public or\
    \ protected properties available:\nif (!$strategy) {\n    $strategy = $this->strategies[self::STRATEGY_EXTEND];\n\
    }\nreturn $strategy;\n}\n\n\n+   9. Now we turn our attention to the strategies\
    \ themselves. First, we define a new Application\\Generic\\Hydrator\\Strategy\
    \ namespace.\n\n+   10. In the new namespace, we define an interface that allows\
    \ us to identify any strategies that can be consumed by Application\\Generic\\\
    Hydrator\\Any:\nnamespace Application\\Generic\\Hydrator\\Strategy;\ninterface\
    \ HydratorInterface\n{\n    public static function hydrate(array $array, $object);\n\
    \    public static function extract($object);\n}\n\n\n+   11. The GetSet hydrator\
    \ is exactly as defined in the previous two recipes, with the only addition being\
    \ that it will implement the new interface:\nnamespace Application\\Generic\\\
    Hydrator\\Strategy;\nclass GetSet implements HydratorInterface\n{\n    public\
    \ static function hydrate(array $array, $object)\n    {\n        // defined in\
    \ the recipe:\n        // \"Creating an Array to Object Hydrator\"\n    }\n  \
    \  public static function extract($object)"
