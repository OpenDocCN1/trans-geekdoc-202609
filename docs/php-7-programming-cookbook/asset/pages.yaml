    tool. |


    # ### Installing a *AMP package


    **AMP** refers to **Apache**, **MySQL**, and **PHP** (also **Perl** and **Python**).
    The * refers to Linux, Windows, Mac, and so on (that is, LAMP, WAMP, and MAMP).
    This approach is often the easiest, but gives you less control over the initial
    PHP installation. On the other hand, you can always modify the php.ini file and
    install additional extensions to customize your installation as needed. The following
    table summarizes a number of popular *AMP packages:


    | Package | Where is it found | Free? | Supports* |

    | :--- | :--- | :--- | :--- |

    | XAMPP | www.apachefriends.org/download.html | Y | WML |

    | AMPPS | www.ampps.com/downloads | Y | WML |

    | MAMP | www.mamp.info/en | Y | WM |

    | WampServer | sourceforge.net/projects/wampserver | Y | W |'
  merge: -1
  img_proc: true
- pgno: 27
  md: '| Package | Where is it found | Free? | Supports* |

    | --- | --- | --- | --- |

    | EasyPHP | www .easyphp .org | Y | W |

    | Zend Server | www .zend .com /en /products /zend_ server | N | WML |


    In the preceding table, we''ve enlisted the *AMP packages where * is replaced
    by **W** for Windows, **M** for Mac OS X, and **L** for Linux.


    # There''s more...


    When you install a pre-compiled binary from a package, only core extensions are
    installed. Non-core PHP extensions must be installed separately.


    It''s worth noting that PHP 7 installation on cloud computing platforms will often
    follow the installation procedure outlined for pre-compiled binaries. Find out
    if your cloud environment uses Linux, Mac, or Windows virtual machines, and then
    follow the appropriate procedure as mentioned in this recipe.


    It''s possible that PHP 7 hasn''t yet reached your favorite repository for pre-compiled
    binaries. You can always install from source, or consider installing one of the
    *AMP packages (see the next section). An alternative for Linux-based systems is
    to use the Personal Package Archive (PPA) approach. Because PPAs have not undergone
    a rigorous screening process, however, security could be a concern. A good discussion
    on security considerations for PPAs is found at http://askubuntu.com/questions/35629/are-ppas-safe-to-add-to-my-system-and-what-are-some-red-flags-to-watch-out-fo.


    # See also


    General installation considerations, as well as instructions for each of the three
    major OS platforms (Windows, Mac OS X, and Linux), can be found at http://php.net/manual/en/
    install .general .php.


    The website for MinGW is http://www .mingw .org/.


    Instructions on how to compile a C program using Visual Studio can be found at
    https://msdn.microsoft.com/en-us/library/bb384838.


    Another possible way to test PHP 7 is by using a virtual machine. Here are a couple
    of tools with their links, which might prove useful:


    +   - Vagrant: https://github.com/rlerdorf/php7dev (php7dev is a Debian 8 Vagrant
    image that is preconfigured for testing PHP apps and developing extensions across
    many versions of PHP)

    - Docker: https://hub.docker.com/r/codersthephen/php7/ (it contains a PHP7 Docker
    container)'
