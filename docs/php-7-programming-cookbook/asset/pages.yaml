- pgno: 462
  md: "# See also\n\nIn Chapter 6, Building Scalable Websites, the recipe entitled\
    \ Chaining $_POST filters, discusses how to incorporate the basic filtering concepts\
    \ covered here into a comprehensive filter chaining mechanism.\n\n# Validating\
    \ $_POST data\n\nThe primary difference between filtering and validation is that\
    \ the latter does not alter the original data. Another difference is in intent.\
    \ The purpose of validation is to confirm that the data matches certain criteria\
    \ established according to the needs of your customer.\n\n# How to do it...\n\n\
    +   1. The basic validation mechanism we will present here is identical to that\
    \ shown in the preceding recipe. As with filtering, it is vital to have an idea\
    \ of the nature of the data to be validated, how it fits your customer's requirements,\
    \ and also whether it matches the criteria enforced by the database. For example,\
    \ if in the database, the maximum width of the column is 128, the validation callback\
    \ could use strlen() to confirm that the length of the data submitted is less\
    \ than or equal to 128 characters. Likewise, you could use ctype_alnum() to confirm\
    \ that the data only contains letters and numbers, as appropriate.\n\n+   2. Another\
    \ consideration for validation is to present an appropriate validation failure\
    \ message. The validation process, in a certain sense, is also a confirmation\
    \ process, where somebody presumably will review the validation to confirm success\
    \ or failure. If the validation fails, that person will need to know the reason\
    \ why.\n\n+   3. For this illustration, we will again focus on the prospects table.\
    \ We can now group the set of desired PHP functions into a single array of callbacks.\
    \ Here is an example based on the validation needs for the form data, which will\
    \ eventually be stored in the prospects table:\n\n```\n```php\n$validator = [\n\
    \    'email' => [\n        'callback' => function ($item) {\n            return\
    \ filter_var($item, FILTER_VALIDATE_EMAIL); },\n        'message' => 'Invalid\
    \ email address'],\n    'alpha' => [\n        'callback' => function ($item) {\n\
    \            return ctype_alpha(str_replace(' ', '', $item)); },\n        'message'\
    \ => 'Data contains non-alpha characters'],\n    'alnum' => [\n        'callback'\
    \ => function ($item) {\n            return ctype_alnum(str_replace(' ', '', $item));\
    \ },\n```\n```"
  merge: -1
  img_proc: true
