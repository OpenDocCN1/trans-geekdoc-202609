- pgno: 378
  md: "# ## Using getters and setters\n\nAt first glance, it would seemingly make\
    \ sense to define classes with **public properties**, which can then be directly\
    \ read or written. It is considered a best practice, however, to make properties\
    \ **_protected_**, and to then define a **getter** and **setter** for each. As\
    \ the name implies, a **_getter_** retrieves the value of a property. A **_setter_**\
    \ is used to set the value.\n\n> **Best practice**\n\nDefine properties as **_protected_**\
    \ to prevent accidental _outside access_. Use **_public get* and set*_** methods\
    \ to provide access to these properties. In this manner, not only can you more\
    \ precisely control access, but you can also make formatting and data type changes\
    \ to the properties while **_getting_** and **_setting_** them.\n\n# How to do\
    \ it…\n\n+   1.  **Getters and setters** provide additional flexibility when **_getting_**\
    \ or **_setting_** values.\n\nYou are able to add an additional layer of logic\
    \ if needed, something which would not be possible if you were to directly read\
    \ or write a public property. All you need to do is to create a public method\
    \ with a prefix of either **_get_** or **_set_**. The name of the property becomes\
    \ the suffix. It is a convention to make the first letter of the variable uppercase.\
    \ Thus, if the property is **_$testValue_**, the **_getter_** would be **_getTestValue()_.**\n\
    \n+   2.  In this example, we define a **_class_** with a **_protected_** property,\
    \ **_$date_**. Notice that the **_get_** and **_set_** methods allow for treatment\
    \ as either a **_DateTime_** object or as a string. The value is actually stored\
    \ in any event as a **_DateTime_** instance:\n\n```\n```\n$a = new class() {\n\
    \    protected $date;\n    public function setDate($date)\n    {\n        if (is_string($date))\
    \ {\n            $this->date = new DateTime($date);\n        } else {\n      \
    \      $this->date = $date;\n        }\n    }\n    public function getDate($asString\
    \ = FALSE)\n    {\n        if ($asString) {\n            return $this->date->format('Y-m-d\
    \ H:i:s');\n        } else {\n            return $this->date;\n```\n\n```"
  merge: -1
  img_proc: true
- pgno: 379
  md: "```\n        }\n    }\n};\n```\n\n+   Getters and setters allow you to filter\
    \ or sanitize the data coming in or going out. In the following example, there\
    \ are two properties, $intVal and $arrVal, which are set to a default initial\
    \ value of NULL. Notice that not only are the return values for the getters data-typed,\
    \ but they also provide defaults. The setters also either enforce the incoming\
    \ data-type, or type-cast the incoming value to a certain data-type:\n\n```\n\
    <?php\nclass GetSet\n{\n    protected $intVal = NULL;\n    protected $arrVal =\
    \ NULL;\n    // note the use of the null coalesce operator to return a\n    default\
    \ value\n    public function getIntVal() : int\n    {\n        return $this->intVal\
    \ ?? 0;\n    }\n    public function getArrVal() : array\n    {\n        return\
    \ $this->arrVal ?? array();\n    }\n    public function setIntVal($val)\n    {\n\
    \        $this->intVal = (int) $val ?? 0;\n    }\n    public function setArrVal(array\
    \ $val)\n    {\n        $this->arrVal = $val ?? array();\n    }\n}\n```\n\n+ \
    \  If you have a class with lots and lots of properties, it might become tedious\
    \ to define a distinct getter and setter for each property. In this case, you\
    \ can define a kind of fallback using the magic method __call(). The following\
    \ class defines nine different properties. Instead of having to define nine getters\
    \ and nine setters, we define a single method, __call(), which makes a determination\
    \ whether or not the usage is get or set. If get, it retrieves the key from an\
    \ internal array. If set, it stores the value in the internal array."
  merge: -1
  img_proc: true
- pgno: 380
  md: "The `__call()` method is a magic method which is executed if an application\
    \ makes a call to a non-existent method.\n\n```\n<?php\nclass LotsProps\n{\n \
    \   protected $firstName = NULL;\n    protected $lastName = NULL;\n    protected\
    \ $addr1    = NULL;\n    protected $addr2    = NULL;\n    protected $city    \
    \ = NULL;\n    protected $state    = NULL;\n    protected $province = NULL;\n\
    \    protected $postalCode = NULL;\n    protected $country  = NULL;\n    protected\
    \ $values  = array();\n\n    public function __call($method, $params)\n    {\n\
    \        preg_match('/^(get|set)(.*)$/i', $method, $matches);\n        $prefix\
    \ = $matches[1] ?? '';\n        $key    = $matches[2] ?? '';\n        $key = strtolower($key);\n\
    \        if ($prefix == 'get') {\n            return $this->values[$key] ?? '---';\n\
    \        } else {\n            $this->values[$key] = $params[0];\n        }\n\
    \    }\n}\n\n```\n\n# How it works…\n\nCopy the code mentioned in step 1 into\
    \ a new file, chap_10_oop_using_getters_and_setters.php. To test the class, add\
    \ the following:\n\n```\n// set date using a string\n$a->setDate('2015-01-01');\n\
    var_dump($a->getDate());\n\n// retrieves the DateTime instance\nvar_dump($a->getDate(TRUE));\n\
    \n```"
  merge: -1
  img_proc: true
