- pgno: 262
  md: "+   6. We then map API methods to the primary HTTP methods GET, PUT, POST,\
    \ and DELETE:\n\n```\n```PHP\n$id = $request->getData(){$this->api::ID_FIELD}\
    \ ?? NULL;\nswitch (strtoupper($request->getMethod())) {\n    case Request::METHOD_POST\
    \ :\n        $this->api->post($request, $response);\n        break;\n    case\
    \ Request::METHOD_PUT :\n        $this->api->put($request, $response);\n     \
    \   break;\n    case Request::METHOD_DELETE :\n        $this->api->delete($request,\
    \ $response);\n        break;\n    case Request::METHOD_GET :\n    default :\n\
    \        // return all if no params\n        $this->api->get($request, $response);\n\
    }\n```\n```\n\n+   7. Finally, we package the response and send it out, JSON-encoded:\n\
    \n```\n```PHP\n$this->processResponse($response);\necho json_encode($response->getData());\n\
    }\n```\n```\n\n+   8. The `processResponse()` method sets headers and makes sure\
    \ the result is packaged as an `Application\\Web\\Response` object:\n\n```\n```PHP\n\
    protected function processResponse($response)\n{\n    if ($response->getHeaders()\
    \ {\n        foreach ($response->getHeaders() as $key => $value) {\n         \
    \   header($key . ': ' . $value, TRUE,\n                   $response->getStatus());\n\
    \        }\n    }\n    header(Request::HEADER_CONTENT_TYPE\n           . ': '\
    \ . Request::CONTENT_TYPE_JSON, TRUE);\n    if ($response->getCookies() {\n  \
    \      foreach ($response->getCookies() as $key => $value) {\n            setcookie($key,\
    \ $value);\n        }\n    }\n}\n```\n```"
