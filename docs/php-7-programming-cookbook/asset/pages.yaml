  md: "+   13. The doInsert() method is similar, except that the initial SQL needs\
    \ to start with INSERT INTO ... and the id array element needs to be unset. The\
    \ reason for the latter is that we want this property to be auto-generated by\
    \ the database. If this is successful, we use our newly defined fetchByEmail()\
    \ method to look up the new customer and return a completed instance:\n\n```\n\
    ```\nprotected function doInsert($cust)\n{\n    $values = $cust->entityToArray();\n\
    \    $email = $cust->getEmail();\n    unset($values['id']);\n    $insert = 'INSERT\
    \ INTO ' . $cust::TABLE_NAME . ' ';\n    if ($this->flush($insert, $values)) {\n\
    \        return $this->fetchByEmail($email);\n    } else {\n        return FALSE;\n\
    \    }\n}\n```\n```\n\n+   14. Finally, we are in a position to define flush(),\
    \ which does the actual preparation and execution:\n\n```\n```\nprotected function\
    \ flush($sql, $values, $where = '')\n{\n    $sql .= ' SET ';\n    foreach ($values\
    \ as $column => $value) {\n        $sql .= $column . ' = :' . $column . ',';\n\
    \    }\n    // get rid of trailing ','\n    $sql = substr($sql, 0, -1) . $where;\n\
    \    $success = FALSE;\n    try {\n        $stmt = $this->connection->pdo->prepare($sql);\n\
    \        $stmt->execute($values);\n        $success = TRUE;\n    } catch (PDOException\
    \ $e) {\n        error_log(__METHOD__ . ':' . __LINE__ . ':'\n            . $e->getMessage());\n\
    \        $success = FALSE;\n    } catch (Throwable $e) {\n        error_log(__METHOD__\
    \ . ':' . __LINE__ . ':'\n            . $e->getMessage());\n        $success =\
    \ FALSE;\n    }\n    return $success;\n}\n```\n```"
