    \ {\n    f.position = 0\n    f.payload = p\n}\n\nfunc ReadAllTheBytes(reader io.Reader)\
    \ []byte {\n    data, err := io.ReadAll(reader)\n    if err != nil {\n       \
    \ log.Fatal(err)\n    }\n    return data\n}\n\nfunc main() {\n    fakeReader :=\
