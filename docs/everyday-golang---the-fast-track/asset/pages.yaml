  md: '# Chapter 5


    # Five ways to write an awesome CLI


    We''re having a renaissance of (Command Line Interfaces) CLIs - every programming
    language from Node.js to Go to less fashionable ones like .NET all have CLIs and
    developers love them.


    A command-line interface should be something that feels awesome to use, and not
    something that is jarring or in any way surprising. You should pay attention to
    the style, user-experience and approach used by the most popular CLIs, and learn
    lessons.


    CLIs (command-line interfaces) are text-based interfaces for your applications
    which are easily automated, fast to work with and can be combined with other CLIs
    to create workflows.


    Concepts carry across: almost every productivity application has a picture of
    a floppy disk. What does that do? There''s no need to guess or read the docs.
    It''s a save button. In the same way, -v means print verbose output for this command.


    When done well, a CLI:


    +   - Is easy to get started with

    +   - Has just enough to get the job done

    +   - Interoperates with other CLIs (through pipes or files)

    +   - Doesn''t surprise the user


    So here are five ways that you can make sure that your next CLI is one that developers
    love to use, and tell their friends about.


    # Pick Go


    It''s probably no surprise that when reading a book about Go, that I''m advocating
    for writing CLIs using Go, but here''s why.


    I prefer the OpenFaaS CLI which was written in Go over the Serverless Framework
    Inc CLI which was written in JavaScript with Node.js:


    +   - Compiles to a single static binary


    With Go you can provide a single static binary that contains your whole application
    or CLI for your chosen platform. To target a different CPU or OS you just pass
    in an environmental override when building. With JavaScript, you have to install
    Node.js, then install hundreds or thousands of tiny packages from npm.


    Here''s a binary for Linux, Mac, Windows and for a Raspberry Pi:


    ```

    GOOS=linux go build -o cli

    GOOS=darwin go build -o cli-darwin

    GOOS=windows go build -o cli.exe

    GOARCH=armv7 GOOS=linux go build -o cli-rpi

    ```'
