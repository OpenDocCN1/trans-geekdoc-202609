    \ this section we’ll explore a couple of party tricks that `go test` brings along.\
    \ Then we’ll put everything together that we’ve learned so far in a larger example,\
    \ where we isolate a dependency.\n\n# Statement coverage\n\nThe `go test` tool\
    \ has built-in code-coverage for statements. To try it with our example above\
    \ type in:\n\n```\n```text\n$ go test -cover\nPASS\ncoverage: 50.0% of statements\n\
    ok      github.com/alexlellis/golangbasics1  0.009s\n```\n```\n\nHigh statement\
