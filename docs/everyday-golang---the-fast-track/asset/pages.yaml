  md: "# Define a separate package or library\n\nUntil now, we have written code within\
    \ a single package called main. The main package is required to make a program\
    \ runnable on its own, however sometimes you'll want to write a library so that\
    \ code can be shared between programs.\n\nYou may also have a project with a main\
    \ package and an additional named package for code organisation. Packages can\
    \ be tested separately.\n\nGenerally, starting a variable, function or struct\
    \ with a capital letter means that it will be available outside the package to\
    \ other consumers.\n\nWe'll create a package that can perform a similar task to\
    \ the dir or ls shell commands.\n\nCreate a new project:\n\n```\n$ export GH_USERNAME=\"\
    alexellis\"\n$ mkdir -p $GOPATH/src/github.com/$GH_USERNAME/multiple-packages/\n\
    $ cd $GOPATH/src/github.com/$GH_USERNAME/multiple-packages/\n\n$ go mod init\n\
    go: creating new go.mod: module github.com/alexellis/multiple-packages\n```\n\n\
    Now create a folder for the package called cmd:\n\n```\n$ mkdir -p $GOPATH/src/github.com/$GH_USERNAME/multiple-packages/cmd\n\
    ```\n\nThen create ls.go inside it:\n\n```\npackage cmd\n```\n\nNow you have defined\
    \ a package called cmd, but it doesn't have any functions or structs exported.\n\
    \n```\npackage cmd\n\nfunc ExecuteLs(path string) (string, error) {\n    return\
    \ \"\", nil\n}\n```\n\nThe command can then be imported by a new main package\
    \ using the path github.com/alexellis/multiple-packages/cmd. In some cases, like\
    \ the HMAC library we used earlier, there is no need for the project to have its\
    \ own main entrypoint because it will only be consumed by third-parties as a function.\n\
    \nCreate main.go in the root folder:\n\n```\npackage main\n\nimport (\n    \"\
    fmt\"\n    \"os\"\n\n    \"github.com/alexellis/multiple-packages/cmd\"\n)\n\n\
    func main() {\n    wd, err := os.Getwd()\n    if err != nil {\n        fmt.Fprintf(os.Stderr,\
    \ \"unable to get working directory: %s\",\n            err.Error())\n    }\n\
    }\n```"
