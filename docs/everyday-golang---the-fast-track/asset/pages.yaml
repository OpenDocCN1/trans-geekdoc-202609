  md: "# Chapter 8\n\n# Store data with a database\n\nAlmost all line of business\
    \ applications will require a form of storage, so in this chapter I'll show you\
    \ how to connect to a Postgresl database. For other databases, you'll need to\
    \ find a different library, but the approach will be similar.\n\nNot all Go libraries\
    \ are equal. Some use pure Go code, and others link to a rich ecosystem of existing\
    \ C/C++ codebases. The ones which reference Go require CGO, which can introduce\
    \ a number of other issues and portability problems.\n\nOne of the most helpful\
    \ tools I've found for writing this eBook has been a todo list, so let's start\
    \ with that example. You can then customise the schema, the fields and operations\
    \ however you like to suit your own needs.\n\nCreate a directory for the exercise:\n\
    \n```\nexport GH_USERNAME=\"alexellis\"\nmkdir -p $GOPATH/src/github.com/$GH_USERNAME/todo-database/\n\
    cd $GOPATH/src/github.com/$GH_USERNAME/todo-database/\n```\n\nCreate schema.sql:\n\
    \n```\nCREATE TABLE todo (\n  id            INT GENERATED ALWAYS AS IDENTITY,\n\
    \  description   text NOT NULL,\n  created_date  timestamp NOT NULL,\n  completed_date\
    \ timestamp NULL\n);\n```\n\nWe're using a flat schema, with a single table. The\
    \ id field is generated, and then we have a longer field for the todo text and\
    \ a created/completed date field. Only the completed_date field can accept a null\
    \ entry.\n\nOnce you have defined a schema, it's time to provision a database\
    \ or to install Postgresql so that you can obtain credentials or a connection\
    \ string and create the schema.\n\nI decided to create a database using Postgresql\
    \ 11 on DigitalOcean. This is a managed service, and you'll find similar services\
    \ are available from other cloud providers such as AWS and GCP.\n\nYou can use\
    \ the psql tool to connect and create a database. Alternatively, you could input\
    \ a CREATE statement at the start of your application. Some authors write code\
    \ to automate maintenance like database creation and schema migration upon application\
    \ startup.\n\nMy connection string from the dashboard was: postgresql://doadmin:ildkg2my7g7lqqxh@todo-pg11-do-user-2197152-0.b.db.ondigitalocean.com:25060/defaultdb?sslmode=require\n\
    \nWhen you deploy your application, be careful that you do not hard-code any confidential\
    \ data. You may want to use a configuration file with strict permissions, or environment\
    \ variables to read the password and address. ‘"
