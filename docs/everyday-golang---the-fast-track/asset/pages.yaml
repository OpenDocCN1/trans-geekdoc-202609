  md: "On the line {{ if ($.Updates.YearBreak $in) }} you can see that I call a function\
    \ to determine when to break the line. The simplest way to add custom functions\
    \ to templates is to add functions to the type being accessed in the template.\n\
    \n```\n```go\n// Update represents an InsidersUpdate stored as a Gist\ntype Update\
    \ struct {\n    ID          string    `json:\"id,omitempty\"`\n    Description\
    \ string    `json:\"description,omitempty\"`\n    Date        time.Time `json:\"\
    date,omitempty\"`\n    MarkdownURL string    `json:\"markdownUrl,omitempty\"`\n\
    \    HTMLURL     string    `json:\"htmlUrl,omitempty\"`\n}\n\ntype Updates []Update\n\
    \n// YearBreak returns whether the previous item was in\n// another year\nfunc\
    \ (u Updates) YearBreak(i int) bool {\n    if i == 0 {\n        return true\n\
    \    }\n\n    return u[i-1].Date.Year() != u[i].Date.Year()\n}\n```\n```\n\nBy\
    \ checking the index of the current item, and the previous one, we can determine\
    \ whether we are at a breakpoint in the list of years and emails.\n\n# Real-world\
    \ templates - arkade\n\nA final example I'll share is the arkade project, where\
    \ templates were useful for determining which version of a CLI to download.\n\n\
    If there was a convention that all maintainers and vendors used for CLI naming\
    \ then we would only need one template for all downloads, however that's anything\
    \ but the case.\n\nYou may be wondering why these templates are compiled into\
    \ the Go binary? The Tool struct could be Marshaled into a JSON file for dynamic\
    \ updates, but having everything in one place, and being able to unit test quickly\
    \ seems to be working for us.\n\n```\n```\ntools = append(tools,\nTool{\nOwner:\
    \      \"inlets\",\nRepo:       \"inlets-pro\",\nName:       \"inlets-pro\",\n\
    Description: \"Cloud Native Tunnel for HTTP and TCP traffic.\",\nBinaryTemplate:\
    \ `{{ if HasPrefix .OS \"ming\" -}}\n{{.Name}}.exe\n{{- else if eq .OS \"darwin\"\
    \ -}}\n{{.Name}}-darwin\n{{- else if eq .Arch \"armv6l\" -}}\n{{.Name}}-armhf\n\
    {{- else if eq .Arch \"armv7l\" -}}\n{{.Name}}-armhf\n{{- else if eq .Arch \"\
    aarch64\" -}}\n```\n```"
