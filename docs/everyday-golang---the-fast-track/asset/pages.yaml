  md: "Test it out:\n\ngo run main.go\n\nFunction name: gumroad-bot      Image: ghcr.io/alexellis/gumroad-bot\
    \      Envs: 1\n\nYou can write a configuration file or YAML file to disk using\
    \ the Marshal function. Adapt the example:\n\n```\nfunc main() {\n    spec :=\
    \ Spec{\n        Image: \"docker.io/functions/figlet:latest\",\n        Name:\
    \  \"figlet\",\n    }\n\n    bytesOut, err := yaml.Marshal(spec)\n    if err !=\
    \ nil {\n        panic(err)\n    }\n\n    err = os.WriteFile(\"figlet.yaml\",\
    \ bytesOut, os.ModePerm)\n    if err != nil {\n        panic(err)\n    }\n   \
    \ fmt.Printf(\"Wrote: figlet.yaml.. OK.\\n\")\n}\n```\n\nTest it out:\n\n```\n\
    $ go run main.go\n\nWrote: figlet.yaml.. OK.\n\n$ cat figlet.yaml\n\nname: figlet\n\
    image: docker.io/functions/figlet:latest\n```\n\nIn a previous role, I found that\
    \ I could create huge amounts of CI jobs very quickly by reading an input file\
    \ and generating YAML using this library. It saved me a lot of time overall.\n\
    \n# Merging objects\n\nIf you create a large schema with many different fields,\
    \ it may be desirable to maintain a single example file and then allow users to\
    \ provide overrides for any values that need customisation.\n\nWe've used the\
    \ mergo library in the OpenFaaS project and had good experiences, however you\
    \ may find other libraries that fulfil a similar role.\n\nThis approach works\
    \ with any structs that you have in memory, and isn't specific to YAML.\n\nCreate\
    \ a new folder for the example:\n\n```\nexport GH_USERNAME=\"alexellis\"\nmkdir\
    \ -p $GOPATH/src/github.com/$GH_USERNAME/merge-objects\ncd $GOPATH/src/github.com/$GH_USERNAME/merge-objects\n\
    ```\n\nThis is how the API works:\n\n```\nmerged := Spec{}\n```"
