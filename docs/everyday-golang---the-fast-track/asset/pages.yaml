  md: '# Chapter 3


    # Cross-compile for different operating systems


    In the previous chapter we built a simple Go program that used an environment
    variable to print output, but the binary we produced could only be run on the
    same operating system and CPU architecture.


    If you have another computer with the same operating system, you can copy the
    binary to that computer and run it without any changes. If you are using a Mac,
    but want to run the program on a Raspberry Pi or Windows desktop, you will need
    to use Go''s built-in cross-compilation options to produce different binaries.


    You need to be aware of the target Operating System and the target CPU architecture.


    Go supports a number of Operating Systems, however these are the most used:


    +   - Windows

    +   - MacOS

    +   - Linux


    Go programs also need to be built for a specific CPU architecture and version.
    Most of the time this is a detail you can avoid, but if you expect your programs
    to be run on an Arm processor like a Raspberry Pi or an AWS Graviton server, you
    will need to bear this in mind too.


    +   - Regular PCs and cloud, covering both Intel and AMD CPUs - x86_64

    +   - 32-bit Arm devices like the Raspberry Pi are called armhf, armv7 or armv6l

    +   - 64-bit Arm servers and devices are called arm64 or aarch64


    If you don''t specify any options, your binary will be built for the computer
    you are using, otherwise you can customise the options and output filename.


    # Go build arguments


    Here''s how to build our first-go program for Windows, Linux and MacOS:


    ```

    GOOS=linux go build -o first-go

    GOOS=darwin go build -o first-go-darwin

    GOOS=windows go build -o first-go.exe

    ```


    To build for an Arm CPU, just add the following:


    ```

    GOARCH=arm GOOS=linux go build -o first-go-arm

    GOARCH=arm64 GOOS=linux go build -o first-go-arm64

    ```


    If you want to debug an issue with your binary, you can use the bash command file
    to see how it was built:


    ```

    file first-go

    first-go: ELF 64-bit LSB executable, x86-64, version 1 (SYSV), statically

    linked, not stripped

    ```'
  merge: -1
