    \ cases, we get the output as expected:\n\n```\nHello from 4\nHello from 3\nHello\
    \ from 5\nHello from 1\nHello from 2\n```\n\n# Error groups\n\nAnother way to\
    \ synchronise work in parallel is through the unofficial “errgroup” package from\
    \ the Golang team.\n\nThis becomes even more useful in the example above because\
    \ any of our Goroutines can return an error and be captured without having to\
    \ write code to synchronise messages over channels.\n\nNot only can the errgroup\
    \ run a number of Goroutines concurrently, but it can also run them serially in\
    \ a pipeline, checking the error of each task before moving onto the next.\n\n\
    To use an *error group*, import the `\"golang.org/x/sync/errgroup\"` package,\
    \ then define a new errgroup with `g := errgroup.Group{}`, then call `g.Go(func()\
    \ error { })` for each of the work items. You’ll notice that the `g.Go()` function\
    \ takes a function which can return an error. If there is no error, then return\
    \ `nil`, otherwise return the error and the whole execution will exit and bubble\
    \ up the error to the synchronising function.\n\n```\npackage main\n\nimport (\n\
    \    \"fmt\"\n    \"os\"\n    \"time\"\n\n    \"golang.org/x/sync/errgroup\"\n\
    )\n\nfunc main() {\n    g := errgroup.Group{}\n    g.Go(func() error {\n     \
    \   printLater(\"Hello\\n\", time.Millisecond*100)\n        return nil\n    })\n\
    \    g.Go(func() error {\n        // printLater(\"World\\n\", time.Millisecond*100)\n\
    \        return fmt.Errorf(\"world failed\")\n    })\n    g.Go(func() error {\n\
    \        printLater(os.Getenv(\"USER\")+\"\\n\", time.Millisecond*100)\n     \
    \   return nil\n```"
