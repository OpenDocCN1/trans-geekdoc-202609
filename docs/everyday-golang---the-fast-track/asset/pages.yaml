  md: "# The Prometheus Collector interface\n\nThe Collector interface is important\
    \ in Prometheus for when you want to extend the metrics or labels that are being\
    \ exported from your application. I tend to think it works better for when the\
    \ data is coming from a third party API or remote endpoint like a database or\
    \ the Kubernetes API server.\n\nI tend to implement a collector as a new type.\
    \ This code is adapted from the OpenFaaS gateway which is used in production by\
    \ every installation.\n\n```\ntype Exporter struct {\n}\n\nfunc NewExporter()\
    \ *Exporter {\n    return &Exporter{\n    }\n}\n```\n\n```\n// Describe is to\
    \ describe the metrics for Prometheus\nfunc (e *Exporter) Describe(ch chan<- *prometheus.Desc)\
    \ {\n\n}\n```\n\n```\n// Collect exports the values for each metric to Prometheus\n\
    func (e *Exporter) Collect(ch chan<- prometheus.Metric) {\n\n}\n```\n\nThe two\
    \ important methods are “Describe” - which lets Prometheus know what metrics are\
    \ being exported and “Collect” - which is where the actual data is exported. These\
    \ functions are invoked asynchronously by Prometheus, and you don’t need to invoke\
    \ them yourself.\n\nYou just need to register the instance of the Exporter.\n\n\
    ```\ne := NewExporter()\nprometheus.MustRegister(e)\n```\n\nAt that point, the\
    \ Prometheus Go SDK will call Describe followed by Collect each time it’s scraped\
    \ from the Prometheus server.\n\nSo what does it look like to populate these methods\
    \ with code?\n\nI’ll redact the example so that it only shows one of the fields\
    \ which is how many replicas exist in Kubernetes for each of the OpenFaaS functions.\
    \ The various label values for function_name will be reset and then populated\
    \ dynamically every time the Collect code runs.\n\nWe’ll also write a fake API\
    \ that returns how many replicas of each function we have in the OpenFaaS cluster.\
    \ We’ll start off with no data, then we’ll add some, see it showing up in the\
    \ metrics, then remove it and see that it’s removed and no longer tracked or exported,\
    \ showing how useful the Collector interface is for dynamic data.\n\napi.go:\n\
    \npackage main\n\n```\nfunc newAPIQuery() *APIQuery {\n    return &APIQuery{\n\
