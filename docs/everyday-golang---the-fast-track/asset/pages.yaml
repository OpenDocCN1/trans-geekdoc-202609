  md: "# Chapter 2\n\n# Create your first Go program\n\nYou can create a Go program\
    \ from memory, but I find it more useful to use an IDE like Visual Studio Code.\
    \ Visual Studio Code has a number of plugins that it can install to format your\
    \ code, tidy it up and add any paths for modules or packages that you import.\
    \ The automation is not as comprehensive as a paid IDE like Jetbrains’ GoLand,\
    \ but is fast and free.\n\nCreate a folder first-go then, save the following as\
    \ main.go:\n\n```\npackage main\n\nfunc main() {\n\n}\n```\n\nNow you have two\
    \ ways to run the program.\n\n+   1) Run go run main.go\n+   2) Run go build and\
    \ then run the resulting binary ./first-go\n\nNow print a console statement using\
    \ fmt.Printf. This will import the fmt package at the top of the file, and VSCode\
    \ will automatically run a number of Go plugins to update the main.go file for\
    \ you.\n\n```\npackage main\n\nimport (\n    \"fmt\"\n    \"os\"\n)\n\nfunc main()\
    \ {\n    name := os.Getenv(\"USER\")\n    fmt.Printf(\"Well done %s for having\
    \ your first Go\\n\", name)\n}\n```\n\nOne of the programs run by VScode is gofmt\
    \ and it’s an example of how Go’s opinionated design makes it easy to move between\
    \ code-bases without learning new conventions. You can run it against a text file\
    \ using gofmt -w -s main.go.\n\nNote the use of the os.Getenv call to look-up\
    \ your username from the USER environment variable.\n\nNote for Windows users:\
    \ try replacing “USER” with “USERNAME”\n\nNow, run the program again and you should\
    \ see output as per above."
