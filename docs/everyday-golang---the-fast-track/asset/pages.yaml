    \ dial tcp: lookup gitzub.com: no such host\nexit status 1\n```\n\n# Using a context\
    \ to handle timeouts\n\nNow, there’s also another potential problem here. Some\
    \ websites may hang or keep a connection open indefinitely. Go provides a concept\
    \ called “context” that can be passed into calls that make use of external resources\
    \ like with our HTTP request from above.\n\nA Context carries a deadline, a cancellation\
    \ signal, and other values across API boundaries.\n\nYou can view the docs for\
    \ the context package here: context.\n\nSome library functions allow a Context\
    \ to be passed via a parameter, but if one is not present, you can get the background\
    \ context with:\n\n```\nctx := context.Background()\n```\n\nYou may also see context.TODO()\
    \ used which can be used when no context is available, or it’s unclear which context\
    \ to use.\n\nIts API also has several utility methods for defining a cancellation\
    \ policy:\n\n```\nfunc WithCancel(parent Context) (ctx Context, cancel CancelFunc)\n\
    ```\n\nA parent context needs to be passed in, when the cancel function is called,\
    \ any in-progress operations must be stopped and resources should be released.\n\
    \n```\nfunc WithDeadline(parent Context, d time.Time) (Context, CancelFunc)\n\
    ```\n\nThis function is similar to WithCancel, except there is a deadline time/date\
    \ for some future date at which time the operation should be cancelled. This is\
    \ useful with HTTP requests or when accessing an external system.\n\n```\nfunc\
    \ WithTimeout(parent Context, timeout time.Duration) (Context, CancelFunc)\n```\n\
    \nThe WithTimeout function is also similar, but provides a helper so that a timeout\
    \ value can be passed in rather than an actual date in the future.\n\nIn the example\
    \ below, you’ll see how WithTimeout works.\n\n```\npackage main\n\nimport (\n\
    \  \"context\"\n  \"flag\"\n  \"fmt\"\n  \"io\"\n  \"net/http\"\n  \"os\"\n  \"\
    strings\"\n  \"time\"\n)\n```"
