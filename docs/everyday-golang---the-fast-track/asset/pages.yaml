  md: "# Sharing data between Goroutines\n\nThere are two approaches to sharing data\
    \ between Goroutines in Go, whilst staying within the bounds of memory. The first\
    \ would be to create a type with a locking mechanism, so that a reader or writer\
    \ could obtain a lock to prevent two Goroutines trying to update the same data\
    \ and the resulting race condition.\n\nIn the first example, our code may look\
    \ similar to:\n\n```\n```go\npackage main\n\nimport (\n    \"sync\"\n)\n\ntype\
    \ ScrapeRun struct {\n    Result []ScrapeResult\n    Lock   *sync.Mutex\n}\n\n\
    type ScrapeResult struct {\n    HTTPCode   int\n    HTTPLength int\n    Error\
    \      error\n}\n```\n```\n\nWithin the main program flow, you would write something\
    \ similar to:\n\n```\n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"io\"\
    \n    \"net/http\"\n    \"sync\"\n)\n\ntype ScrapeRun struct {\n    Results map[string]ScrapeResult\n\
    \    Lock    *sync.Mutex\n}\n\ntype ScrapeResult struct {\n    HTTPCode   int\n\
    \    HTTPLength int64\n    Error      error\n}\n\nfunc scrape(url string, sr *ScrapeRun)\
    \ {\n    res, err := http.Get(url)\n    if err != nil {\n        sr.Lock.Lock()\n\
    \        defer sr.Lock.Unlock()\n\n        sr.Results[url] = ScrapeResult{\n \
    \           Error:    err,\n            HTTPCode: http.StatusBadGateway,\n```\n\
    ```"
