- pgno: 38
  md: "+   - tests can feel like they’re written in a different language (RSpec/Mocha\
    \ for instance)\n+   - errors can be cryptic “assert: 0 == 1”\n+   - pages of\
    \ stack traces can be generated\n+   - tests stop executing after the first assert\
    \ fails - masking patterns of failure\n\nThere are third-party libraries that\
    \ replicate the feel of RSpec or Assert. See also [stretchr/testify](https://github.com/stretchr/testify).\n\
    \nDisclaimer: I want you to feel comfortable with Go’s approach, even if you are\
    \ not used to it. Do us both a favour, and don’t reach for your nearest BDD library\
    \ for Go. Why? Because one of the strongest properties of Go is consistency, the\
    \ fact that any Go developer should be able to pick up another Go codebase without\
    \ learning new libraries and styles.\n\n# Testing the Sum method\n\nCreate a folder\
    \ for the exercise:\n\n```\n```bash\nexport GH_USERNAME=\"alexellis\"\nmkdir -p\
    \ $GOPATH/src/github.com/$GH_USERNAME/sum-testing\ncd $GOPATH/src/github.com/$GH_USERNAME/sum-testing\n\
    ```\n```\n\nHere is an example of a method we want to test in the main package.\
    \ We have defined an exported function called Sum which takes in two integers\
    \ and adds them together.\n\nSave `main.go`:\n\n```\n```go\npackage main\n\nimport\
    \ \"fmt\"\n\nfunc sum(x int, y int) int {\n    // This code has a bug that adds\
    \ 1\n    return x + y + 1\n}\n\nfunc main() {\n    x := 5\n    y := 5\n    fmt.Printf(\"\
    %d + %d = %d\\n\", x, y, sum(x, y))\n}\n```\n```\n\nTry the application::\n\n\
    ```\n```bash\ngo run main.go\n5 + 5 = 11\n```\n```\n\nNotice there is a bug, we\
    \ will need to unit test this code.\n\nWe need to write our unit test in a separate\
    \ file, this is usually in the same package and folder as the code being tested,\
    \ but it doesn’t have to be. The reason why keeping the tests with the code is\
    \ useful is because:\n\n+   1. They can be imported as a single package\n+   2.\
    \ It means you can unit-test private methods, without making them public\n\nSave\
    \ `main_test.go`:\n\n```\n```go\npackage main\n\nimport \"testing\"\n\nfunc Test_sum(t\
    \ *testing.T) {\n```\n```"
