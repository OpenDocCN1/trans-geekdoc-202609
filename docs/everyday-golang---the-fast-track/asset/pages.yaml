    \ some languages, additional libraries add support for annotations that allow\
    \ a test to run for various values.\n\nSee this example from NUnit:\n\n```\n[Test]\n\
    [TestCase(\"hello@example.com\")]\n[TestCase(\"hello+plus@example.com\")]\n[TestCase(\"\
    hello.with.dots@example.com\")]\npublic void ValidateEmail_supports_real_emails(string\
    \ emailAddress)\n{\n    // ARRANGE\n    var sut = new EmailValidator();\n\n  \
    \  // ACT\n    var result = sut.ValidateEmail(emailAddress);\n\n    // ASSERT\n\
    \    Assert.That(result.IsValid, Is.True);\n}\n```\n\nIn Go, this would be achieved\
    \ through a test-table:\n\n```\nfunc TestMultiply_VariousNumbers(t *testing.T)\
    \ {\n    c:= Calculator{}\n\n    cases := []struct {\n        a int\n        b\
    \ int\n        want int\n        name string\n    }{\n        {-10, 1, -10, \"\
    negative case\"},\n        {10, 1, 10, \"positive case\"},\n        {10, 0, 0,\
    \ \"zero case\"},\n    }\n\n    for _, tc := range cases {\n        t.Run(tc.name,\
    \ func(t *testing.T) {\n            want := tc.want\n            got := c.Multiply(tc.a,\
    \ tc.b)\n\n            if want != got {\n                t.Fatalf(\"want %d, but\
    \ got %d\", want, got)\n            }\n        })\n    }\n}\n```\n\nIf you’d like\
    \ to see a more complex example, the OpenFaaS CLI where it determines the correct\
    \ choice of a number of variables: priority_test.go\n\nWhen using assertions instead\
    \ of pure Go:"
