- pgno: 123
  md: "# Chapter 16\n\n# Releasing a Docker container image\n\nI'll use the term Docker\
    \ image and container image interchangeably, since many people only know containers\
    \ by Docker.\n\nFirst of all, you'll need a Dockerfile which has a similar purpose\
    \ to the Makefile from earlier: to build a binary that can be shipped to users.\n\
    \nThis Dockerfile is going to be multi-stage, and also multi-architecture.\n\n\
    +   - multi-stage - the SDKs used to build the code are not shipped in the final\
    \ image\n+   - multi-archi(tecture) - the output can run on more than one target\
    \ platform\n\nMulti-arch builds are important when your target platform is an\
    \ Arm server and your development machine is Intel or AMD, and visa-versa if you're\
    \ an Apple M1 user.\n\nWe'll continue to use the release-it repo from the previous\
    \ section.\n\n```\nFROM --platform=${BUILDPLATFORM:-linux/amd64} golang:1.22 as\
    \ builder\n\nARG TARGETPLATFORM\nARG BUILDPLATFORM\nARG TARGETOS\nARG TARGETARCH\n\
    \nARG Version\nARG GitCommit\n\nENV CGO_ENABLED=0\nENV GO111MODULE=on\n\nWORKDIR\
    \ /go/src/github.com/alexellis/release-it\n\nCOPY . .\n\nRUN CGO_ENABLED=${CGO_ENABLED}\
    \ GOOS=${TARGETOS} GOARCH=${TARGETARCH} \\\n    go test -v ./...\n\nRUN CGO_ENABLED=${CGO_ENABLED}\
    \ GOOS=${TARGETOS} GOARCH=${TARGETARCH} \\\n    go build -ldflags \\\n    \"-s\
    \ -w -X 'main.Version=${Version}' -X 'main.GitCommit=${GitCommit}'\" \\\n    -o\
    \ /usr/bin/release-it .\n\nFROM --platform=${BUILDPLATFORM:-linux/amd64} gcr.io/distroless/static:nonroot\n\
    WORKDIR /\nCOPY --from=builder /usr/bin/release-it /\n```"
