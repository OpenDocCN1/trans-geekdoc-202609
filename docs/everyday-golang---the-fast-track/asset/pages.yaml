    \n  db_port: \"25060\"\n  db_name: \"defaultdb\"\n  db_ssl_mode: \"require\"\n\
    ```\n\n# Managing config between multiple environments\n\nWhenever you move this\
    \ application between a staging and production environment, you need to alter\
    \ the database URL and the secrets for it.\n\nThe secrets are relatively simple\
    \ to set up, you just run faas-cli secrets against both envrionments and set the\
    \ values as needed.\n\nFor the environment variables, you can create override\
    \ files and specify these during deployment.\n\nExample contents of: staging.yaml:\n\
    \n```\nenvironment:\n  db_host: \"todo-pg11-do-user-2197152-0.b.db.ondigitalocean.com\"\
    \n  db_port: \"25060\"\n  db_name: \"defaultdb\"\n  db_ssl_mode: \"require\"\n\
    ```\n\nExample contents of todo-fn.yaml:\n\n```\nversion: 1.0\nprovider:\n  name:\
    \ openfaas\n  gateway: http://127.0.0.1:8080\nfunctions:\n  todo-fn:\n    lang:\
    \ golang-middleware\n    handler: ./todo-fn\n    image: docker.io/alexellis2/todo-fn:latest\n\
    \    secrets:\n      - db-user\n      - db-pass\n    environment_file:\n     \
    \ - ${OF_ENV:-staging}.yaml\n```\n\nThis configuration picks staging.yaml as a\
    \ default, but if you configure the OF_ENV variable with prod, then the values\
    \ from prod.yaml will be used instead.\n\nLearn more about YAML - environment\
    \ variable substitution\n\n# Futher tasks\n\nHere are some further tasks you can\
