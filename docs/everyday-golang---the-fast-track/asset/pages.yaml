- pgno: 122
  md: "In our example, we’ll first checkout the code from GitHub for the release tag,\
    \ then run make all, followed by uploading the release artifacts to the GitHub\
    \ release.\n\n```\nname: publish\non:\n  push:\n    tags:\n      - '*'\njobs:\n\
    \  publish:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@master\n\
    \        with:\n          fetch-depth: 1\n      - name: Make all\n        run:\
    \ make all\n      - name: Upload release binaries\n        uses: alexellis/upload-assets@0.4.1\n\
    \        env:\n          GITHUB_TOKEN: ${{ github.token }}\n        with:\n  \
    \        asset_paths: '[\"./bin/release-it*\"]'\n```\n\nEach step in the workflow\
    \ file can use a specific GitHub Action like alexellis/upload-assets@0.4.1 or\
    \ actions/checkout@master, but when you leave that field blank, it uses the base\
    \ system such as ubuntu-latest. On the base Ubuntu runner you can execute standard\
    \ shell and build commands like make all.\n\nThe alexellis/upload-assets action\
    \ is one that I built to use on all the various OSS projects I maintain and allows\
    \ a number of files to be uploaded.\n\nUsers can then go ahead and download your\
    \ binary and run it on their system.\n\nFor instance:\n\n```\n$ cd /tmp/\n$ curl\
    \ -sLSf \\\n  -o ./release-it \\\n  https://github.com/alexellis/release-it/releases/download/0.2.11/release-it-darwin\
    \ \\\n  && chmod +x ./release-it \\\n  && ./release-it\n\nrelease-it: 0.2.11,\
    \ commit: 4379cbf694c55bd98f5080d76ac5972fd89dcc65\n```"
