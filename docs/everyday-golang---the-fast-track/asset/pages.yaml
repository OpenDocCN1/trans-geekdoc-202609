  md: "Now let’s set the timeout to be a little more aggressive, like 10ms and introduce\
    \ a flag so that we can easily configure the value.\n\n```\n```text\n$ go run\
    \ . -uri https://github.com/alexellis --timeout 10ms\nError: Get \"https://github.com/alexellis\"\
    : context deadline exceeded\nexit status 1\n\n$ go run . -uri https://github.com/alexellis\
    \ --timeout 1000ms\nError: Get \"https://github.com/alexellis\": context deadline\
    \ exceeded\nexit status 1\n\n$ go run . -uri https://github.com/alexellis --timeout\
    \ 3000ms\nTitle:  <title>alexellis (Alex Ellis) · GitHub</title>\n```\n```\n\n\
    So it looks like we need a rather generous timeout to fetch my GitHub profile\
    \ from a client in the UK.\n\n# Limiting concurrent work\n\nSo far, all the techniques\
    \ that we’ve seen do not allow us to limit resources. At some point, you may exceed\
    \ a limit like the number of files or HTTP connections that are allowed on your\
    \ machine, or the number of database connections that your Database as a Service\
    \ allows.\n\nIn those cases, it’s useful to think of limiting work. A similar\
    \ technique is implemented in the OpenFaaS CLI for building, pushing and deploying\
    \ functions.\n\nBy default, the level of concurrency is 1, but it can be overridden,\
    \ so that if you need to build 8 functions, you could have four of them being\
    \ processed at the same time. You can think of this approach as a “window”, 4\
    \ Goroutines will start, and receive 4/8 pieces of the work. When the work in\
    \ progress drops to 3, another item from the remaining queue of 4 items will be\
    \ processed until all the work is done and nothing is remaining.\n\nThe following\
    \ pattern updates our `titleOf` method to run without a channel, and to return\
    \ its results as `(string, error)`.\n\n```\n```go\nfunc titleOf(uri string, timeout\
    \ time.Duration) (string, error) {\n    ctx, cancel := context.WithTimeout(context.Background(),\
    \ timeout)\n    defer cancel()\n\n    req, err := http.NewRequestWithContext(ctx,\
    \ http.MethodGet, uri, nil)\n    if err != nil {\n        return \"\", err\n \
    \   }\n\n    res, err := http.DefaultClient.Do(req)\n    if err != nil {\n   \
    \     return \"\", err\n    }\n\n    if res.Body != nil {\n        defer res.Body.Close()\n\
    \        res, _ := io.ReadAll(res.Body)\n        for _, l := range strings.Split(string(res),\
    \ \"\\n\") {\n            if strings.Contains(l, \"<title>\") {\n            \
    \    return uri, nil\n            }\n        }\n    }\n}\n```\n```"
