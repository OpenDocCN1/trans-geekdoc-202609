    The binary for hash-browns will be in $GOPATH/bin/:


    ```

    $ ls $GOPATH/bin/


    $ $GOPATH/bin/hash-browns


    hash-browns by Alex Ellis

    Version:      Commit:

    2021/12/12 09:05:24 Listening on port: 8080

