    \   wg.Add(3)\n\n    go func() {\n        defer wg.Done()\n        printLater(\"\
    Hello\\n\", time.Millisecond*100)\n    }()\n    go func() {\n        defer wg.Done()\n\
    \        printLater(\"World\\n\", time.Millisecond*100)\n    }()\n    go func()\
    \ {\n        defer wg.Done()\n        printLater(os.Getenv(\"USER\")+\"\\n\",\
    \ time.Millisecond*100)\n    }()\n\n    wg.Wait()\n}\n\nfunc printLater(msg string,\
    \ duration time.Duration) {\n    time.Sleep(duration)\n    fmt.Printf(msg)\n}\n\
    ```\n\nNow we see the code complete, and print all the messages. We can tell that\
