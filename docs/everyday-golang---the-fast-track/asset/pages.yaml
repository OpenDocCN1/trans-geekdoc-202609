  md: "```\n$ go run main.go -message=\"my message\"\npanic: --secret is required\n\
    \ngoroutine 1 [running]:\nmain.main()\n    /home/alex/go/src/github.com/alexellis/validate-hmac-flags/main.go:20\
    \ +0x3ed\nexit status 2\n```\n\nBut we can get around this by setting the secret\
    \ to \"\" whitespace, so how do you handle that?\n\n```\nif len(strings.TrimSpace(secretVar))\
    \ == 0 {\n    panic(\"--secret is required\")\n}\n```\n\nWe can simply wrap the\
    \ value with strings.TrimSpace which will remove any whitespace and handle that\
    \ case for us.\n\nHere's the complete example:\n\n```\npackage main\n\nimport\
    \ (\n    \"flag\"\n    \"fmt\"\n    \"strings\"\n\n    \"github.com/alexellis/hmac\"\
    \n)\n\nfunc main() {\n    var inputVar string\n    var secretVar string\n\n  \
    \  flag.StringVar(&inputVar, \"message\", \"\", \"message to create a digest from\"\
    )\n    flag.StringVar(&secretVar, \"secret\", \"\", \"secret for the digest\"\
    )\n    flag.Parse()\n\n    if len(strings.TrimSpace(secretVar)) == 0 {\n     \
    \   panic(\"--secret is required\")\n    }\n\n    fmt.Printf(\"Computing hash\
    \ for: %q\\nSecret: %q\\n\", inputVar, secretVar)\n\n    digest := hmac.Sign([]byte(inputVar),\
    \ []byte(secretVar))\n    fmt.Printf(\"Digest: %x\\n\", digest)\n}\n```\n\nAs\
    \ an extra-work task, why don't you add a mode, so that your CLI can be used for\
    \ both generating and validating hashes?\n\nYou could either add a flag with flag.BoolVar\
    \ such as -generate=true/false, or a string mode like -mode=generate/validate."
