  md: "Another change with Go modules, was the ability to compile source code outside\
    \ of the $GOPATH/src convention. For instance, you could have your source code\
    \ at $HOME/dev/ instead of $HOME/go/src/ or wherever you’d set it.\n\nWhenever\
    \ you create a new Go project, it’s best to run go mod init first. If your code\
    \ falls within the conventional GOPATH structure, then it will have its name determined\
    \ automatically, but if not, you can pass it as an argument.\n\nCompare the following:\n\
    \n```\nexport GH_USERNAME=alexellis\n\n$ mkdir -p $GOPATH/src/github.com/$GH_USERNAME/hash-gen\n\
    $ cd $GOPATH/src/github.com/$GH_USERNAME/hash-gen\n$ go mod init\ngo: creating\
    \ new go.mod: module github.com/alexellis/hash-gen\n\n$ cat go.mod\nmodule github.com/alexellis/hash-gen\n\
    \ngo 1.16\n```\n\nAnd when run outside of GOPATH:\n\n```\n$ mkdir /tmp/hash-gen\n\
    $ cd /tmp/hash-gen\n$ go mod init\n\ngo: cannot determine module path for source\
    \ directory /tmp/hash-gen (outside GOPATH, module path must be specified)\n\n\
    Example usage:\n    'go mod init example.com/m' to initialize a v0 or v1 module\n\
    \    'go mod init example.com/m/v2' to initialize a v2 module\n\nRun 'go help\
    \ mod init' for more information.\n```\n\nTry one of the following instead:\n\n\
    ```\n$ go mod init hash-gen\n$ go mod init github.com/alexellis/hash-gen\n```\n\
    \nIt’s also possible to use Go modules and vendoring at the same time:\n\n```\n\
    $ cd /tmp/\n$ git clone https://github.com/alexellis/hash-browns\n$ cd hash-brown\n\
    $ rm -rf vendor\n$ go mod vendor\n$ ls vendor/\n```\n\nNow see that the vendor\
    \ folder has been created.\n\nYou can ask Go to build using the vendor folder\
    \ instead of its local packages cache at $GOPATH/pkg by adding -mod vendor to\
    \ the go build command.\n\n```\n$ go build -mod vendor\n```\n\nSo which approach\
    \ should you use?\n\nVendoring has the advantage of keeping all your source and\
    \ dependencies in one place, it also doesn’t require anything"
