    # Go doesn’t ship your tests\n\nIn addition, it may feel unnatural to leave files\
    \ named `addition_test.go` in the middle of your package. Rest assured that the\
    \ Go compiler and linker will not ship your test files in any binaries it produces.\n\
    \nHere is an example of finding the production vs test code in the net/http package\
    \ we used in the previous Golang basics tutorial.\n\n```\n```text\n$ go list -f={{.GoFiles}}\
    \ net/http\n[client.go cookie.go doc.go filetransport.go fs.go h2_bundle.go header.go\
    \ http.go jar.go\n↪  method.go request.go response.go server.go sniff.go status.go\
    \ transfer.go transport.go]\n\n$ go list -f={{.TestGoFiles}} net/http\n[cookie_test.go\
    \ export_test.go filetransport_test.go header_test.go http_test.go\n↪  proxy_test.go\
    \ range_test.go readrequest_test.go requestwrite_test.go response_test.go\n↪ \
    \ responsewrite_test.go transfer_test.go transport_internal_test.go]\n```\n```\n\
    \n# Stress testing your tests\n\nYour tests can also be run more than once, I’ve\
    \ found this to show up issues with race conditions or shared state in code that\
    \ I’ve written.\n\nSimply add `-test.count=100` to run your tests 100 times.\n\
    \nAt times, you’ll also see the tests refuse to run because the results are (cached).\
    \ In this instance, adding `-test.count=1` can get around that problem.\n\n# Running\
    \ tests in parallel\n\nIt may appear that your unit tests run well and in a deterministic\
    \ order, but often when they are run in parallel problems can be found before\
    \ they hit production. This is because when we test our code locally, it’s usually\
    \ with a lower load, or serially. On a production system, we may have many users\
    \ doing things in parallel."
