  md: "# Chapter 9\n\n# Write your own config files in YAML\n\nThe trend with 12 Factor\
    \ Apps is to make all configuration available through environment variables instead\
    \ of through files. This makes them easy to deploy with containers because files\
    \ tend to require additional permissions or filesystems to be created and mounted.\n\
    \nHowever environment variables can have drawbacks like length, and complexity\
    \ when there are many of them. Nesting is also difficult since they are all inputted\
    \ at the same level. You may find that a configuration file is the answer.\n\n\
    # A practical example of YAML in action\n\nIn the OpenFaaS CLI we added a configuration\
    \ file to store the credentials for different installations that you log into.\
    \ The CLI also has a configuration file for functions that you deploy called stack.yml.\n\
    \n```\nversion: 1.0\nprovider:\n  name: openfaas\n  gateway: http://127.0.0.1:8080\n\
    \nfunctions:\n  gumroad-upgrade:\n    lang: node12\n    handler: ./gumroad-upgrade\n\
    \    image: alexellis2/gumroad-upgrade:0.2.1\n    environment:\n      subject:\
    \ \"Your bonus upgrade to my video workshop\"\n      sender: sales@openfaas.com\n\
    \      region: \"eu-west-1\"\n    secrets:\n      - ses-access-key-id\n      -\
    \ ses-access-token\n      - seller-id\n      - secret-url\n```\n\nExample of an\
    \ OpenFaaS YAML file to configure building and deploying functions\n\nThe library\
    \ that I've used most is gopkg.in/yaml.v2. It suited the use-case that it's my\
    \ go-to library for parsing or saving YAML.\n\n# Read and write your own YAML\
    \ schema\n\nCreate a new folder and initialise it for the sample:"
  merge: -1
  img_proc: true
- pgno: 83
  md: "```\n```bash\nexport GH_USERNAME=\"alexlellis\"\nmkdir -p $GOPATH/src/github.com/$GH_USERNAME/yaml-config/\n\
    cd $GOPATH/src/github.com/$GH_USERNAME/yaml-config/\n```\n```\n\nTo load a configuration\
    \ file, you define a number of structs and annotate them, just like we did with\
    \ the JSON examples.\n\n```\n```go\ntype Spec struct {\n\n    // Name name of\
    \ the function\n    Name string `yaml:\"name\"`\n\n\n    // Image docker image\
    \ name of the function\n    Image string `yaml:\"image\"`\n\n    Environment map[string]string\
    \ `yaml:\"environment,omitempty\"`\n\n\n    // Limits for the function\n    Limits\
    \ *FunctionResources `yaml:\"limits,omitempty\"`\n}\n\n// FunctionResources Memory\
    \ and CPU\ntype FunctionResources struct {\n    Memory string `yaml:\"memory\"\
    `\n    CPU    string `yaml:\"cpu\"`\n}\n```\n```\n\nAs you can see from above,\
    \ where we would have put `json:\"field\"`, we just write yaml instead and then\
    \ go on to use a very similar interface to unmarshal the text into an object.\n\
    \nCreate main.go:\n\n```\n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"\
    os\"\n\n    yaml \"gopkg.in/yaml.v2\"\n)\n\n// Add above structs here\n\nfunc\
    \ main() {\n    bytesOut, err := os.ReadFile(\"config.yaml\")\n    if err != nil\
    \ {\n        panic(err)\n    }\n\n    spec := Spec{}\n    if err := yaml.Unmarshal(bytesOut,\
    \ &spec); err != nil {\n        panic(err)\n    }\n\n    fmt.Printf(\"Function\
    \ name: %s\\tImage: %s\\tEnvs: %d\\n\", spec.Name, spec.Image,\n        len(spec.Environment))\n\
    }\n```\n```"
