- pgno: 120
  md: "# Chapter 15\n\n# Building and releasing Go binaries\n\nWhether you’ve written\
    \ a CLI or a HTTP server, most of the time Go code can be compiled down to a static\
    \ binary which is self-contained and can run on the target system you specify.\n\
    \nIn an earlier chapter we covered cross-compilation, at this point you should\
    \ consider whether you need to target one environment such as Windows, Linux or\
    \ MacOS, or multiple.\n\n# The release-it example\n\n[Release-it](https://github.com/release-it/release-it)\
    \ repo is an example of a static Go binary that can be built and released through\
    \ GitHub Actions. It uses a [Makefile](https://github.com/release-it/release-it/blob/main/Makefile),\
    \ so it can also be run in other CI pipelines or manually as and when you create\
    \ a new release.\n\nThe Makefile has the following properties, all of which were\
    \ covered in previous chapters already:\n\n+   - It builds binaries for multiple\
    \ platforms and Operating Systems\n+   - It injects the Commit and Version from\
    \ git into the final binary\n\n```\n```makefile\nVersion := $(shell git describe\
    \ --tags --dirty)\n# Version := \"dev\"\nGitCommit := $(shell git rev-parse HEAD)\n\
    LDFLAGS := \"-s -w -X main.Version=$(Version) -X main.GitCommit=$(GitCommit)\"\
    \n\n.PHONY: all\nall: gofmt dist\n\n.PHONY: gofmt\ngofmt:\n\t@test -z $(shell\
    \ gofmt -l ./ | tee /dev/stderr) || (echo \"[WARN] Fix formatting issues\n\twith\
    \ 'make fmt'\" && exit 1)\n\n.PHONY: dist\ndist:\n\tmkdir -p bin/\n\tCGO_ENABLED=0\
    \ GOOS=linux go build -mod=vendor -a -ldflags $(LDFLAGS) -o\n\tbin/release-it-amd64\n\
    \tCGO_ENABLED=0 GOOS=darwin go build -mod=vendor -a -ldflags $(LDFLAGS) -o\n\t\
    bin/release-it-darwin\n\tGOARM=7 GOARCH=arm CGO_ENABLED=0 GOOS=linux go build\
    \ -mod=vendor -a -ldflags $(LDFLAGS)\n\t-o bin/release-it-arm\n\tGOARCH=arm64\
    \ CGO_ENABLED=0 GOOS=linux go build -mod=vendor -a -ldflags $(LDFLAGS) -o\n\t\
    bin/release-it-arm64\n\tGOOS=windows CGO_ENABLED=0 go build -mod=vendor -a -ldflags\
    \ $(LDFLAGS) -o\n\tbin/release-it.exe\n```\n```"
  merge: -1
  img_proc: true
- pgno: 121
  md: "In addition, it runs gofmt for good measure.\n\nIf there were any unit tests\
    \ in the project, then we could add an additional target for them, such as:\n\n\
    ```\n.PHONY: gotest\ngotest:\n    go test ./...\n```\n\nThen update the all line\
    \ to gofmt gotest dist which would run each of the tasks for us.\n\nClone the\
    \ example and build it:\n\n```\n$ mkdir $GOPATH/src/github.com/alexellis/\n$ cd\
    \ $GOPATH/src/github.com/alexellis/\n$ git clone https://github.com/alexellis/release-it\n\
    $ cd release-it\n$ make\n```\n\nBy default make will try to run the all target,\
    \ but you can also run make gofmt if you want to test formatting before committing\
    \ to a build.\n\nYou'll find each binary in the bin/ folder and can run them on\
    \ your system if it matches the OS/architecture pair, or copy it to another system\
    \ to run it there.\n\n![](img/0b5c3b498f62579835cf1d543b46de92_121_0.png)\n\n\
    Figure 15.1: GitHub's release page\n\nWhen you release binaries to users, GitHub's\
    \ release functionality can come in handy because it allows you to upload the\
    \ binaries manually or via automation.\n\n# Releasing your binaries with a GitHub\
    \ Action\n\nGitHub Actions is free to use for open source repositories (i.e public\
    \ ones) and comes with a number of free minutes for private ones also. This example\
    \ should be adaptable to other platforms like Jenkins or GitLab CI, since the\
    \ concepts are largely the same."
  merge: -1
