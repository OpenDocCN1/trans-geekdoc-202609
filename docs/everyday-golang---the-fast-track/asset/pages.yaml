- pgno: 44
  md: "You may also have a suite of tests that are slow to run, in that case running\
    \ in parallel may save time. 10x tests that take 1s to complete could run in 10\
    \ seconds serially, or in 1 second if run with a parallelism of 10.\n\nConsider\
    \ this example:\n\n```\npackage main\n\nimport (\n    \"testing\"\n    \"time\"\
    \n)\n\nfunc Test_Slow1(t *testing.T) {\n    time.Sleep(1 * time.Second)\n}\n\n\
    func Test_Slow2(t *testing.T) {\n    time.Sleep(1 * time.Second)\n}\n\nfunc Test_Slow3(t\
    \ *testing.T) {\n    time.Sleep(1 * time.Second)\n}\n\nfunc Test_Slow4(t *testing.T)\
    \ {\n    time.Sleep(1 * time.Second)\n}\n\nfunc Test_Slow5(t *testing.T) {\n \
    \   time.Sleep(1 * time.Second)\n}\n```\n\n```\n$ go test ./ -v\n=== RUN   Test_Slow1\n\
    --- PASS: Test_Slow1 (1.00s)\n=== RUN   Test_Slow2\n--- PASS: Test_Slow2 (1.01s)\n\
    === RUN   Test_Slow3\n--- PASS: Test_Slow3 (1.00s)\n=== RUN   Test_Slow4\n---\
    \ PASS: Test_Slow4 (1.01s)\n=== RUN   Test_Slow5\n--- PASS: Test_Slow5 (1.00s)\n\
    PASS\nok      github.com/alexellis/go-slow   5.343s\n```\n\nTo run the tests in\
    \ parallel, t.Parallel() has to be added to the test function, then the -test.parallel=N\
    \ parameter has to be passed in along with it.\n\n```\npackage main\n\nimport\
    \ (\n    \"testing\"\n    \"time\"\n)\n```"
