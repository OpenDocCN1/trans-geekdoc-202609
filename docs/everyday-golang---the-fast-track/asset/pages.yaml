- pgno: 101
  md: "# Reading the request\n\nA HTTP request has several ways to send data which\
    \ you can use in your function to decide what to do: * Body * HTTP headers * Query\
    \ string * Path * Host header\n\nCreate a new project and test it out:\n\n```\n\
    export GH_USERNAME=\"alexellis\"\nmkdir -p $GOPATH/src/github.com/$GH_USERNAME/yaml-config/\n\
    cd $GOPATH/src/github.com/$GH_USERNAME/yaml-config/\n\ngo mod init http-server\n\
    \ntouch main.go\n```\n\nThis is an example of how to read each of them:\n\n```\n\
    package main\n\nimport (\n    \"fmt\"\n    \"io\"\n    \"log\"\n    \"net/http\"\
    \n    \"time\"\n)\n\nfunc main() {\n    http.HandleFunc(\"/info\", func(w http.ResponseWriter,\
    \ r *http.Request) {\n        log.Printf(\"==================================================\"\
    )\n        log.Printf(\"Query-string: %s\", r.URL.RawQuery)\n        log.Printf(\"\
    Path: %s\", r.URL.Path)\n        log.Printf(\"Method: %s\", r.Method)\n      \
    \  log.Printf(\"Path: %s\", r.Host)\n        for k, v := range r.Header {\n  \
    \          log.Printf(\"Header %s=%s\", k, v)\n        }\n\n        if r.Body\
    \ != nil {\n            body, _ := io.ReadAll(r.Body)\n            log.Printf(\"\
    Body: %s\", string(body))\n        }\n        log.Printf(\"==================================================\"\
    )\n\n        w.WriteHeader(http.StatusAccepted)\n    })\n\n    port := 8080\n\
    \    s := &http.Server{\n        Addr: fmt.Sprintf(\":%d\", port),\n        ReadTimeout:\
    \ 10 * time.Second,\n        WriteTimeout: 10 * time.Second,\n        MaxHeaderBytes:\
    \ 1 << 20,\n    }\n    log.Printf(\"Listening on port: %d\\n\", port)\n    log.Fatal(s.ListenAndServe())\n\
    }\n```"
