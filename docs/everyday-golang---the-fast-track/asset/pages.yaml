  md: "```\ngithub.com/alexellis/hmac/v2 v2.0.0/go.mod h1:07hZZgTfh5fp5+vAamzodZPlbw+aQK+n...EvL0=\n\
    ```\n\nThe go.sum pins the specific version of the module for later use.\n\nNow\
    \ let's verify the digest we received using the library:\n\n```\npackage main\n\
    \nimport (\n    \"fmt\"\n    \"crypto/sha256\"\n\n    hmac \"github.com/alexellis/hmac/v2\"\
    \n)\n\nfunc main() {\n\n    input := []byte(`input message from API`)\n    secret\
    \ := []byte(`so secret`)\n\n    digest := hmac.Sign(input, secret, sha256.New)\n\
    \    fmt.Printf(\"Digest: %x\\n\", digest)\n\n    err := hmac.Validate(input,\
    \ fmt.Sprintf(\"sha256=%x\", digest), string(secret))\n    if err != nil {\n \
    \       panic(err)\n    }\n\n    fmt.Printf(\"Digest validated.\\n\")\n}\n```\n\
    \nRun the program with go run main.go and you'll see it pass as expected.\n\n\
    # Make use of flags\n\nGo has a built-in flag parsing library. We will explore\
    \ an alternative library, Cobra, in a later chapter. I've used Cobra in several\
    \ projects but even now, I always start with the simplest thing that will work.\
    \ Then later, if it is warranted, I'll move to a more complex, but powerful library\
    \ than the standard library's flags package.\n\n```\nexport GH_USERNAME=\"alexellis\"\
    \nmkdir -p $GOPATH/src/github.com/$GH_USERNAME/validate-hmac-flags/\ncd $GOPATH/src/github.com/$GH_USERNAME/validate-hmac-flags/\n\
    \ngo mod init\ngo: creating new go.mod: module github.com/alexellis/validate-hmac-flags\n\
    ```\n\nIn our previous example we created hashes by hard-coding the input and\
    \ secret, but that isn't going to be useful for our users. Let's use flags instead,\
    \ so that we can run:\n\n```\ngo run main.go\n-message=\"my message\" \\\n-secret=\"\
    terces os\"\n```\n\nAdapt the solution to use flag.StringVar to define each flag,\
    \ followed by flag.Parse:"
