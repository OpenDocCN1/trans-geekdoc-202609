  md: "# Chapter 7\n\n# Work concurrently work with Goroutines\n\nIn computing, concurrency\
    \ means being able to handle multiple tasks at once, but not necessarily working\
    \ on them at the exact same time. This concept is often confused with parallel\
    \ computing, the act of making progress on multiple tasks at the same time.\n\n\
    Go’s answer to concurrency is Goroutines. The documentation defines a “goroutine”\
    \ as: “a lightweight thread managed by the Go runtime.”\n\nWhy is that important?\
    \ Operating System (OS) threads are typically expensive to create and coordinate.\
    \ Go’s approach is described as a “lightweight” thread, meaning that there’s not\
    \ necessarily a 1:1 relationship between Operating System (OS) threads and Goroutines,\
    \ making them faster and more scalable.\n\nFor a deep dive into Goroutines and\
    \ synchronisation techniques, you may also like The Go Programming Language (Addison-Wesley).\n\
    \nIn this chapter, I want to cover some practical examples to show you how to\
    \ get started today. I’ll also mention a common pitfall that can catch even the\
    \ most experienced Golang programmers.\n\nWe’ll be covering: writing your first\
    \ Goroutine, creating Goroutines within a loop, synchronisation through WaitGroups,\
    \ error handling with Error groups, using channels and limiting the amount of\
    \ work in progress.\n\n# A simple example with Goroutines\n\nIn this example,\
    \ we have a printLater function which simulates a slow running call, slow enough\
    \ that we may want to run several calls concurrently and collect the results at\
    \ the end, rather than running each in serial and waiting longer.\n\n```\n```go\n\
    package main\n\nimport (\n    \"fmt\"\n    \"os\"\n    \"time\"\n)\n\nfunc main()\
