  md: "```\nhttp_requests_total{code=\"200\",method=\"post\"} 1\nhttp_requests_total{code=\"\
    400\",method=\"get\"} 1\n```\n\nYou'll see the histogram values in http_request_duration_seconds_bucket/sum/count\
    \ and counts for each status in http_requests_total.\n\n# Adding custom metrics\
    \ to your Prometheus data\n\nAt this point, adding your own additional custom\
    \ metrics is relatively simple.\n\n+   1) Define the metric and name it, make\
    \ sure that it stays within the scope of your handler\n+   2) Call prometheus.MustRegister\
    \ on the metric\n+   3) Call the metric's method within your handler to increment/decrement\
    \ or record the custom data\n\nEdit the previous example (custom-metrics). I've\
    \ removed the RED metrics for brevity, but you can combine the two.\n\n```\npackage\
    \ main\n\nimport (\n    \"crypto/sha256\"\n    \"encoding/hex\"\n    \"fmt\"\n\
    \    \"io\"\n    \"log\"\n    \"net/http\"\n    \"time\"\n\n    \"github.com/prometheus/client_golang/prometheus\"\
    \n    \"github.com/prometheus/client_golang/prometheus/promhttp\"\n)\n\n// computeSum\
    \ generates a SHA256 hash of the body\nfunc computeSum(body []byte) []byte {\n\
    \    h := sha256.New()\n    h.Write(body)\n    hashed := hex.EncodeToString(h.Sum(nil))\n\
    \    time.Sleep(time.Second * 5)\n    return []byte(hashed)\n}\n```\n\nNote the\
    \ 5 second sleep added to show the concurrent requests. It may be hard to see\
    \ the gauge going up unless we add some latency.\n\n```\nfunc main() {\n    port\
    \ := 8080\n    readTimeout := time.Second * 10\n    writeTimeout := time.Second\
    \ * 10\n\n    mux := http.NewServeMux()\n\n    hashesInflight := prometheus.NewGauge(prometheus.GaugeOpts{\n\
    \        Subsystem: \"http\",\n        Name:      \"hashes_inflight\",\n     \
    \   Help:      \"total hashes inflight\",\n    })\n    prometheus.MustRegister(hashesInflight)\n\
    ```"
