    \ * 1},\n    }\n\n    for _, c := range cases {\n        tc := c\n        t.Run(tc.Name,\
    \ func(t *testing.T) {\n            t.Parallel()\n            t.Logf(\"%s sleeping..\"\
    , tc.Name)\n            sleepFn(tc.Duration)\n            t.Logf(\"%s slept\"\
    , tc.Name)\n        })\n    }\n}\n\nfunc sleepFn(duration time.Duration) {\n \
