  md: "# Chapter 10\n\n# Inject version information into your binaries\n\nIn this\
    \ chapter, I'll show you how to inject variables into your Golang executable at\
    \ build-time.\n\nThe two ways we have used this in the OpenFaaS community are:\n\
    \n+   - To inject version information such as a Git commit ID (77b4dce) and Git\
    \ tag (0.1.0)\n+   - To add platform information such as whether the binary is\
    \ for Raspberry Pi or a desktop PC\n+   - To add a public key for validating licenses\
    \ for open-core features\n\nThis information becomes part of the compiled application,\
    \ but is determined once at build-time, instead of at run-time.\n\nHere's an example\
    \ where the Docker project's CLI contains a commit ID of 77b4dce along with the\
    \ Go version it was built with.\n\n```\n$ docker version\nClient: Docker Engine\
    \ - Community\n  Version:           19.03.13\n  API version:       1.40\n  Go\
    \ version:        go1.13.15\n  Git commit:        4484c46d9d\n  Built:       \
    \      Wed Sep 16 17:02:52 2020\n  OS/Arch:           linux/amd64\n  Experimental:\
    \      false\n```\n\nWhy add versioning information?\n\nI can't state how useful\
    \ and valuable it is to have a version number in your application when it comes\
    \ to bug reports from users. It can also help you spot outdated versions, and\
    \ show users verify what version they are using by running the program's version\
    \ command.\n\n# Capture useful variable(s)\n\nBefore you get started, think about\
    \ what makes sense to be injected at build-time? It could be anything from the\
    \ hostname of the CI machine to the result of a web-service call or more commonly\
    \ the last commit ID from your Git log.\n\nLet's use the last Git commit id.\n\
    \nCreate a test Git project with a README\n\n```\n$ mkdir /tmp/git-tester && \\\
    \ncd /tmp/git-tester && \\\ngit init && \\\necho \"Let's work with Git\" > README\
    \ && \\\ngit add . && \\\ngit commit -m \"Initial\" && \\\n```"
