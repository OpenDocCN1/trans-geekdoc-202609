    \        job=\"service\"\n    }[1m]\n)\n```\n\nNote the “job” is looking at the\
    \ scrape endpoint for our HTTP server. If you want, you can also review the amount\
    \ of Goroutines Prometheus itself is running, since it instruments itself under\
    \ the “prometheus” job.\n\n# Tracking HTTP metrics for our microservice\n\nWe\
    \ will now build a microservice that can generate a SHA256 hash of any input body,\
    \ and will return a 200 status code for valid inputs. When a body isn't present\
