    \ duration time.Duration) {\n    time.Sleep(duration)\n    fmt.Printf(msg)\n}\n\
    ```\n\nNow when you run this program, it will exit without any output. That is\
    \ because the Goroutines execute asynchronously, and therefore need to be synchronised\
    \ with the main program's execution flow.\n\nYou can synchronise Goroutines through\
    \ the use of channels, or a number of other primitives in the sync package of\
    \ the standard library. The WaitGroup is one of my preferred examples.\n\nThe\
    \ WaitGroup primary purpose is to block and wait for a number of tasks to complete.\n\
    \nTo use a WaitGroup, first, call the Add function with a number of tasks, then\
    \ set up your Goroutines. Within each Goroutine, you will need to have it call\
    \ Done when it has completed. Finally, within the function synchronising the work,\
    \ call wg.Wait() and it will block execution there until all the routines have\
    \ called Done and the outstanding tasks are set to 0.\n\n```\npackage main\n\n\
    import (\n    \"fmt\"\n    \"os\"\n```"
