  md: "# Chapter 12\n\n# Create dynamic content with templates\n\nTemplates are used\
    \ to replace tokens or expressions in a file or block of text (template) with\
    \ inputs provided at runtime.\n\nThey look similar to expressions found in front-end\
    \ templating technology like Embedded Ruby (ERb), for this reason they may seem\
    \ inituitive to you already.\n\nA template can be as simple as a single line of\
    \ text, or a multi-line block. The template could be read from disk, over the\
    \ Internet, or kept within a const in memory.\n\nHere's an example based upon\
    \ the Golang docs:\n\n```\nDear {{.Name}},\n\n{{if .Attended}}\nIt was a pleasure\
    \ to see you at the wedding.\n{{- else}}\nIt is a shame you couldn't make it to\
    \ the wedding.\n{{- end}}\n\nBest wishes,\nAlex\n```\n\nFirst, we need to load\
    \ the template into memory, then construct a typed struct or an inline struct\
    \ to pass in the values to be placed within the file, then we execute it to get\
    \ the result. .Name will be replaced directly, but .Attended is going to cause\
    \ one of the two following sentences to be added into the letter.\n\n```\n```go\n\
    package main\n\nimport (\n    \"bytes\"\n    \"fmt\"\n    \"text/template\"\n\
    )\n\nconst letter = `Dear {{.Name}},\n{{if .Attended}}\nIt was a pleasure to see\
    \ you at the wedding.\n{{- else}}\nIt is a shame you couldn't make it to the wedding.\n\
    {{- end}}\nBest wishes,\nAlex`\n\nfunc main() {\n```\n```"
