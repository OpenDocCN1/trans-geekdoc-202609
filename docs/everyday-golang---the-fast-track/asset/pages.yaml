    n\", time.Millisecond*100)\n    printLater(os.Getenv(\"USER\")+\"\\n\", time.Millisecond*100)\n\
    }\n\nfunc printLater(msg string, duration time.Duration) {\n    time.Sleep(duration)\n\
    ```\n```"
