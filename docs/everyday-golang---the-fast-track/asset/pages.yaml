  md: "The fourth option we’ll look at is what I would use if I wanted to ship something\
    \ like a React.js front-end along with a HTTP server or API written in Go.\n\n\
    ```\n```go\nimport \"embed\"\n\n// frontend holds our static web server content.\n\
    //go:embed image/* template/*\n//go:embed public/index.html\n//go:embed css/*\n\
    var frontend embed.FS\n```\n```\n\nNow you can simply link the embed.FS to a custom\
    \ HTTP middleware or handler and serve the files to users from a specific route\
    \ or path. You’ll learn more about HTTP servers later in the book, however this\
    \ is the example given in the Go documentation:\n\n```\n```go\nhttp.Handle(\"\
    /public/\",\n\thttp.StripPrefix(\"/public/\",\n\t\thttp.FileServer(http.FS(frontend))))\n\
    ```\n```\n\nYour API could be bound to the path /api/v1/ and then any static content\
    \ you have embedded would be served from /public/."
