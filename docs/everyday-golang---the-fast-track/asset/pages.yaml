- pgno: 32
  md: "That's it - and there are more platforms available too - like FreeBSD. You\
    \ won't need to install any dependencies and the final output binary can be tiny.\n\
    \nSee the initial few chapters of the eBook for a deeper-dive into static binaries\
    \ and how to support multiple architectures.\n\n+   - Consistent style\n\nGo is\
    \ an opinionated language and while there may be some differences between which\
    \ editors a project prefers - you will encounter a consistent standard for styling,\
    \ formatting and build tools. Something like Node.js could involve any number\
    \ of “task runners” or “transpilers” - or a more esoteric flavour of the language\
    \ like TypeScript or CoffeeScript.\n\nGo has a consistent style and was deliberately\
    \ designed to be unambiguous. Why is that important? It makes it easy for developers\
    \ to contribute, without having to invest much time in learning the code-base,\
    \ toolchain or style chosen. At time of writing, the CLI for OpenFaaS has 810\
    \ commits, and the whole project has over 8000 commits from 340 individual developers.\n\
    \n+   - Fast on every platform\n\nGo is rapid on all platforms, without an initial\
    \ lag. If you've ever used a CLI written in Python or Node.js, then you are probably\
    \ used to seeing an initial lag every time you use the CLI. This is made worse\
    \ on platforms like the Raspberry Pi, where just running node hello-world.js can\
    \ take 1.5-3.0 seconds to start running the first instruction.\n\n+   - Easy to\
    \ work with REST APIs\n\nGo includes a no-nonsense http client and has built-in\
    \ support for working with xml, json and binary formats. There's also a very good\
    \ library for working with YAML which is used in OpenFaaS here: stack.go\n\nThere\
    \ may be reasons why Node.js or another language is more suitable for your use-case.\
    \ If you've already decided to build a CLI in Go - then you can reap the benefits\
    \ of a fast binary that's small and easy to distribute.\n\nDid you know that you\
    \ can distribute an npm package that installs a Go CLI? I first saw this being\
    \ done by Cloudflare, and we adapted the same approach for the openfaas CLI npm\
    \ install -g @openfaas/faas-cli.\n\nThe code downloads the latest version of the\
    \ faas-cli binary from the GitHub releases page and then places it in the correct\
    \ location in the filesystem.\n\n# Parse flags & arguments\n\nThe standard Go\
    \ library includes a flags package that can be used to parse flags or arguments\
    \ in a couple of lines of code.\n\n```\npackage main\n\nimport (\n    \"flag\"\
    \n    \"fmt\"\n    \"os\"\n)\n\nfunc main() {\n    var image string\n    flag.StringVar(&image,\
    \ \"image\", \"\", \"Docker image\")\n    flag.Parse()\n\n    if len(image) ==\
    \ 0 {\n        fmt.Fprintf(os.Stderr, \"You must specify a Docker image name\"\
    )\n    }\n\n    fmt.Printf(\"Your Docker image was: %s\", image)\n}\n```"
