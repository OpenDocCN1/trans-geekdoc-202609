  md: "```\nfmt.Printf(\"- %s = error: %s\\n\", k, v.Error.Error())\n    } else {\n\
    \        fmt.Printf(\"- %s = [%d] %d bytes\\n\", k, v.HTTPCode, v.HTTPLength)\n\
    \    }\n}\n}\n```\n\nThis is the output from running the program:\n\n```\n$ go\
    \ run .\n- https://notfound.example.com/ = error: Get \"https://notfound.example.com/\"\
    : dial tcp:\n  lookup notfound.example.com: no such host\n- https://openfaas.com/\
    \ = [200] 32696 bytes\n- https://inlets.dev/ = [200] 69805 bytes\n```\n\nDid you\
    \ know? The sync.Mutex makes an exclusive lock on the object, meaning that no\
    \ other reads or writes are possible until the lock is released. This can cause\
    \ a bottleneck if there are both readers and writers of an object.\n\nThe sync.RWMutex\
    \ type can be used as a drop-in replacement for sync.Mutex, where an arbituary\
    \ number of readers can obtain a lock or a single writer.\n\n```\npackage main\n\
    \nimport (\n    \"sync\"\n)\n\nfunc main() {\n    lock := sync.RWMutex{}\n   \
    \ go readOperation(data, \"key\", &lock)\n    go writeOperation(data, \"key\"\
    , \"value\", &lock)\n\n    // Add synchronisation for the two routines here.\n\
    }\n\nfunc readOperation(data map[string]string, key string, lock *sync.RWMutex)\
    \ {\n    lock.RLock()\n    defer lock.RUnlock()\n    fmt.Println(data[\"key\"\
    ])\n}\n\nfunc writeOperation(data map[string]string, key, value string, lock *sync.RWMutex)\
    \ {\n    lock.Lock()\n    defer lock.Unlock()\n    data[key] = value\n}\n```\n\
    \nIn this case, the read and write operations can happen at the same time, because\
    \ the write lock will not block the function which reads the value.\n\nWhat’s\
    \ a real-world use-case for this pattern? Perhaps you have an in-memory cache\
    \ holding a list of active customers. The list needs to be downloaded over the\
    \ network, which can be an expensive operation. The list is then shared with a\
    \ number of Goroutines or handlers in your HTTP server. The read lock would be\
    \ obtained for accessing the data, and the write lock would be used by something\
    \ like a timer or a long-running loop that updates items within the cache.\n\n\
    The second approach would be for the Goroutines to simply output data, without\
    \ sharing a type. The calling code can then aggregate the results, without needing\
    \ to create a separate type with a lock. You’ll see an example of this in the"
