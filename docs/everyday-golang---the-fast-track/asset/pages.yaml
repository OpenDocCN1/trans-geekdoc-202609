  md: "The metric such as a Gauge needs to be defined within scope of the HTTP handler\
    \ where it's going to be used. And prometheus.MustRegister is also required.\n\
    \nThen simply call metric.Inc() when starting and metric.Dec() when done.\n\n\
    ```\ncustomHash := func(w http.ResponseWriter, r *http.Request) {\n    if r.Method\
    \ != http.MethodPost {\n        w.WriteHeader(http.StatusBadRequest)\n       \
    \ return\n    }\n    if r.Body != nil {\n        defer r.Body.Close()\n\n    \
