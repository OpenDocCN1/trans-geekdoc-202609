- pgno: 23
  md: '```

    file first-go-arm

    first-go-arm: ELF 32-bit LSB executable, ARM, EABI5 version 1 (SYSV),

    statically linked, not stripped


    file first-go-arm64

    first-go-arm64: ELF 64-bit LSB executable, ARM aarch64, version 1 (SYSV),

    statically linked, not stripped

    ```


    If you use the bash command du you can see the size of the binary, which includes
    debugging symbols.


    ```

    du -h ./first-go


    2.0M    ./first-go

    ```


    This file can sometimes be made smaller by stripping the debug symbols out.


    ```

    GOOS=linux go build  -a -ldflags "-s -w"


    d u -h first-go

    1.4M    first-go


    first-go: ELF 64-bit LSB executable, x86-64, version 1 (SYSV), statically linked,

    stripped

    ```


    Note the smaller size, and the “stripped” output from the “file” command.


    # CGO and portability


    CGO enables the creation of Go packages that call C code.


    “CGO” is Go’s ability to link to C/C++ libraries and is sometimes required to
    work with certain libraries like SQLite and certain Linux cryptographic packages
    which are not available in Go’s standard library.


    CGO makes portability more of a challenge and is beyond the scope of this book.
    My personal recommendation is to avoid it, all costs, if you plan to cross-compile
    your applications.


    A good way to ensure that you are not using any CGO is through the CGO_ENABLED=0
    environment variable that you can prefix to your builds.


    See also: Go docs on CGO and cgo is not Go by Dave Cheney'
