    \ you can perform an insert. Note that the $1 is substituted for `todo` string.\
    \ By using this syntax instead of `fmt.Sprintf` or string concatenation, we get\
    \ some level of protection against SQL injection attacks where a user may insert\
    \ additional SQL statements in a value.\n\n```\n```go\nfunc create(db *sql.DB,\
    \ todo string) error {\n    res, err := db.Query(`INSERT INTO\n        todo\n\
    \        (id, description, created_date)\n        VALUES\n        (DEFAULT, $1,\
    \ now());`,\n        todo)\n    if err != nil {\n        return err\n    }\n \
    \   defer res.Close()\n    return nil\n}\n```\n```\n\nThe list function returns\
    \ a slice of the Todo structs. You can use the same $1 technique to specify keys\
    \ or sort orders for the SELECT statement.\n\nFinally the Scan function is used\
    \ to populate the values from the row into the type using the proper typing. See\
    \ how we didn’t have to parse a date string into a `time.Time` for instance?\n\
    \n```\n```go\nfunc list(db *sql.DB) ([]Todo, error) {\n    rows, err := db.Query(`SELECT\n\
    \        id,\n        description,\n        created_date,\n        completed_date\n\
    \        FROM todo;`)\n\n    if err != nil {\n        return []Todo{},\n     \
    \       fmt.Errorf(\"unable to get from todo table: %w\", err)\n    }\n\n    todos\
    \ := []Todo{}\n    defer rows.Close()\n    for rows.Next() {\n        result :=\
    \ Todo{}\n        err := rows.Scan(&result.ID,\n            &result.Description,\n\
    \            &result.CreatedDate,\n            &result.CompletedDate)\n      \
    \  if err != nil {\n            return []Todo{}, fmt.Errorf(\"row scan error:\
    \ %w\", err)\n        }\n        todos = append(todos, result)\n```\n```"
