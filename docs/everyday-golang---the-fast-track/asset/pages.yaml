  md: "# Chapter 13\n\n# Write a HTTP server\n\nOne of the most useful projects you\
    \ can write with Go is a HTTP server. It's also one of easiest to start with using\
    \ files only from the standard library.\n\n```\npackage main\n\nimport (\n   \
    \ \"fmt\"\n    \"log\"\n    \"net/http\"\n    \"time\"\n)\n\nfunc main() {\n \
    \   http.HandleFunc(\"/\", func(w http.ResponseWriter, r *http.Request) {\n  \
    \      log.Printf(\"Request received\")\n        w.Write([]byte(\"Hello world\"\
    ))\n    })\n\n    port := 8080\n    s := &http.Server{\n        Addr:        \
    \ fmt.Sprintf(\":%d\", port),\n        ReadTimeout:  10 * time.Second,\n     \
    \   WriteTimeout: 10 * time.Second,\n        MaxHeaderBytes: 1 << 20,\n    }\n\
    \    log.Printf(\"Listening on port: %d\\n\", port)\n    log.Fatal(s.ListenAndServe())\n\
    }\n```\n\nTest it out:\n\n```\n# In terminal 1\ngo run main.go\n\n# In terminal\
    \ 2\n$ curl http://localhost:8080 ; echo\n\nHello world\n```\n\nThe http.Request\
    \ has the context and content of the HTTP request, you can explore the source\
    \ code here or with intelli-sense in your IDE."
