  md: "```\nuses: docker/build-push-action@v5\nwith:\n  outputs: \"type=registry,push=true\"\
    \n  platforms: linux/amd64,linux/arm/v6,linux/arm64\n  build-args: |\n    Version=${{\
    \ env.TAG }}\n    GitCommit=${{ github.sha }}\n  tags: |\n    ghcr.io/${{ env.REPO_OWNER\
    \ }}/release-it:${{ github.sha }}\n    ghcr.io/${{ env.REPO_OWNER }}/release-it:${{\
    \ env.TAG }}\n    ghcr.io/${{ env.REPO_OWNER }}/release-it:latest\n```\n\nYou\
    \ can see that the build-args are populated just as when we ran docker build or\
    \ buildx locally, and then we have some additional actions for setting up qemu.\
    \ Qemu is used by buildx to cross compile your code to work on other machines.\n\
    \nThe list of platforms (linux/amd64, linux/arm/v6, linux/arm64) means this container\
    \ will work on Raspberry Pi OS, 64-bit Arm servers and regular Intel/AMD servers\
    \ too.\n\nIf you're using ghcr.io, things are much simpler, GitHub Actions will\
    \ provide a temporary token that can be used to publish images, just make sure\
    \ you remember to include the permissions and packages: write sections from above\
    \ so the token has the appropriate permissions. For the Docker Hub or a private\
    \ registry, you'll need to create a separate pair of secrets i.e. DOCKER_USERNAME\
    \ and DOCKER_PASSWORD, then update the docker/login-action@v2 step to use them\
    \ instead.\n\nNote that with GHCR, your container image may be set to private\
    \ by default. You'll also need to make it public to share it, or authenticate\
    \ your Docker engine or Kubernetes cluster otherwise."
