    \ it with some tags that help the std library understand how to map the properties:\n\
    \n```\ntype people struct {\n    Number int `json:\"number\"`\n}\n```\n\nThe property\
    \ names need to begin with a capital letter which marks them as exportable or\
    \ public. If your struct's property is the same in the JSON you should be able\
    \ to skip the annotation.\n\nAnother thing to notice is that we pass the address\
    \ of the new / empty people struct into the method. You can try removing the &\
    \ symbol, but the value will be set in a different copy of the empty struct. This\
    \ may seem odd if you are coming from languages that pass parameters by reference.\n\
    \n# Retrieve the JSON via HTTP\n\nNow we can parse a JSON document matching that\
    \ of our API, let's go on and write a HTTP client to fetch the text from the Internet.\n\
    \nGo has a built-in HTTP client in the net/http package, but it has a problem\
    \ with long timeouts and there are some well-known articles recommending that\
    \ you set a timeout on your request explicitly.\n\nThere are more concise ways\
    \ of creating a HTTP request in Go, but by adding a custom timeout we will harden\
