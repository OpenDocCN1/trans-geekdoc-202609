    \ space.\nLet's wave to: Sergey Ryzhikov\nLet's wave to: Kate Rubins\nLet's wave\
    \ to: Sergey Kud-Sverchkov\nLet's wave to: Mike Hopkins\nLet's wave to: Victor\
    \ Glover\nLet's wave to: Shannon Walker\nLet's wave to: Soichi Noguchi\n```\n\n\
    我们现在编写了一些代码来通过 HTTP 获取资源，将其解析为 JSON，处理错误并使其可重用。然后我们通过提取函数来加固代码并使其更有用。\n\n## 第\
    \ 5 章：编写出色的 CLI 的五种方法\n\n我们正经历命令行界面（CLI）的复兴——从 Node.js 到 Go 再到像 .NET 这样不太流行的语言，每种编程语言都有\
    \ CLI，开发者们都喜欢它们。\n\n命令行界面应该使用起来感觉很棒，而不是令人不适或以任何方式令人惊讶。你应该关注最受欢迎的 CLI 使用的风格、用户体验和方法，并从中吸取教训。\n\
    \nCLI（命令行界面）是应用程序的基于文本的界面，易于自动化，操作快速，并且可以与其他 CLI 结合创建工作流。\n\n概念是相通的：几乎每个生产力应用程序都有一个软盘的图片。它做什么？不需要猜测或阅读文档。它是保存按钮。同样，`-v`\
    \ 表示为此命令打印详细输出。\n\n做得好的 CLI：\n\n- 上手容易\n- 恰好足够完成任务\n- 能与其他 CLI 互操作（通过管道或文件）\n\
    - 不会让用户感到意外\n\n所以以下是五种方法，可以确保你的下一个 CLI 是开发者喜欢使用并会告诉朋友的工具。\n\n### 选择 Go\n\n在阅读一本关于\
    \ Go 的书时，我主张使用 Go 编写 CLI，这可能并不令人惊讶，但原因如下。\n\n我更喜欢用 Go 编写的 OpenFaaS CLI，而不是用 JavaScript\
    \ 和 Node.js 编写的 Serverless Framework Inc CLI：\n\n- 编译为单个静态二进制文件\n\n使用 Go，你可以提供一个包含整个应用程序或\
    \ CLI 的单个静态二进制文件，针对你选择的平台。要针对不同的 CPU 或操作系统，只需在构建时传入环境覆盖。与 JavaScript 不同，你必须安装\
    \ Node.js，然后从 npm 安装数百或数千个微小的包。\n\n以下是 Linux、Mac、Windows 以及 Raspberry Pi 的二进制文件：\n\
    \n```\nGOOS=linux go build -o cli\nGOOS=darwin go build -o cli-darwin\nGOOS=windows\
    \ go build -o cli.exe\nGOARCH=armv7 GOOS=linux go build -o cli-rpi\n```\n\n就是这样——还有更多平台可用，比如\
    \ FreeBSD。你不需要安装任何依赖项，最终输出的二进制文件可以非常小。\n\n请参阅电子书的前几章，了解静态二进制文件的深入介绍以及如何支持多种架构。\n\
    \n- 一致的风格\n\nGo 是一种有主见的语言，虽然项目偏好的编辑器可能有所不同——你会遇到一致的样式、格式化和构建工具标准。像 Node.js 这样的东西可能涉及任意数量的“任务运行器”或“转译器”——或语言中更晦涩的变体，如\
    \ TypeScript 或 CoffeeScript。\n\nGo 具有一致的风格，并且是经过精心设计以消除歧义的。为什么这很重要？它使开发者能够轻松贡献，而无需花费大量时间学习代码库、工具链或所选风格。截至撰写时，OpenFaaS\
    \ 的 CLI 有 810 次提交，整个项目有超过 8000 次提交，来自 340 名个人开发者。\n\n- 在每个平台上都快速\n\nGo 在所有平台上都很快速，没有初始延迟。如果你曾经使用过用\
    \ Python 或 Node.js 编写的 CLI，那么你可能习惯了每次使用 CLI 时都会出现初始延迟。在像 Raspberry Pi 这样的平台上情况更糟，在那里运行\
    \ node hello-world.js 只需 1.5-3.0 秒即可开始运行第一条指令。\n\n- 易于使用 REST API\n\nGo 包含一个直截了当的\
    \ http 客户端，并内置支持 xml、json 和二进制格式的工作。还有一个非常好的用于处理 YAML 的库，在 OpenFaaS 中这里使用：`stack.go`\n\
    \n可能有原因使 Node.js 或其他语言更适合你的用例。如果你已经决定用 Go 构建 CLI——那么你可以获得快速、小巧且易于分发的二进制文件的优势。\n\
    \n你知道你可以分发一个安装 Go CLI 的 npm 包吗？我第一次看到 Cloudflare 这样做，我们也为 OpenFaaS CLI 采用了同样的方法\
    \ `npm install -g @openfaas/faas-cli`。\n\n代码从 GitHub 发布页面下载 faas-cli 二进制文件的最新版本，然后将其放置在文件系统的正确位置。\n\
    \n### 解析标志和参数\n\nGo 标准库包含一个 `flag` 包，可以在几行代码中用于解析标志或参数。\n\n```\npackage main\n\
    \nimport (\n    \"flag\"\n    \"fmt\"\n    \"os\"\n)\n\nfunc main() {\n    var\
    \ image string\n    flag.StringVar(&image, \"image\", \"\", \"Docker image\")\n\
    \    flag.Parse()\n\n    if len(image) == 0 {\n        fmt.Fprintf(os.Stderr,\
    \ \"You must specify a Docker image name\")\n    }\n\n    fmt.Printf(\"Your Docker\
    \ image was: %s\", image)\n}\n```\n"
