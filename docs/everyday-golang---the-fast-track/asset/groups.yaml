  - '[PAGE 92]


    # Chapter 11


    # Embed data in your application


    It can be useful to ship additional resources other than code with your applications.
    A common method for doing this is embedding files or data.


    In the “Store data with a database” chapter we created a todo app, which needed
    a schema to be created manually to define a table. But what if our application
    could create the table at start-up, if it didn’t exist already?


    Fortunately from Go 1.16 onwards, the embed package made this simple. Before that
    many third-party libraries were required.


    The Go docs show three ways we could achieve this:


    ```

    ```go

    import _ "embed"


    //go:embed schema.sql

    var tableCreate string

    print(tableCreate)

    ```

    ```


    At build time, the contents of schema.sql will be built into the application,
    and made available through the tableCreate string. This is very similar to the
    technique we saw for injecting a version into an application.


    If you had an image, then you would want to encode the bytes as a binary []byte
    slice.


    ```

    ```go

    import _ "embed"


    //go:embed logo.png

    var logo []byte

    fmt.Printf("Total bytes: %d\n", len(logo))

    ```

    ```


    Once in memory, the logo can then be served to a client via a HTTP connection,
    modified, or written to disk for instance.


    Using the embed.FS interface means that unlike in the previous example, the data
    is not kept in memory in a variable, and can be loaded on demand. This approach
    would be useful for large files.


    ```

    ```go

    import "embed"


    //go:embed ubuntu-20-cloudinit.iso

    var f embed.FS

    data, _ := f.ReadFile("ubuntu-20-cloudinit.iso")

    fmt.Printf("Total bytes: %d\n", len(data))

    ```

    ```


    Go is a perfectly good systems programming language, and you’ll find many packages
    for managing filesystems and networks. You could potentially ship something like
    an ISO image inside your application that can be written out to a disk at any
    time.'
