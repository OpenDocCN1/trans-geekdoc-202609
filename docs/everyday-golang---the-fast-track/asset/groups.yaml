    # Isolating dependencies


    What''s the difference between a unit test and an integration test?


    The difference between unit and integration tests is that unit tests usually isolate
    dependencies that communicate with network, disk etc. Unit tests normally test
    only one thing such as a function.


    Isolation in Go can be achieved through interfaces, but if you''re coming from
    a C# or Java background, they look a little different in Go. Interfaces are implied
    rather than enforced which means that concrete classes don''t need to know about
    the interface ahead of time.


    That means we can have very small interfaces such as io.ReadCloser which has only
    two methods made up of the Reader and Closer interfaces:


    ```

    Read(p []byte) (n int, err error)

    ```


    *Reader interface*


    ```

    Close() error

    ```


    *Closer interface*


    If you are designing a package to be consumed by a third-party then it makes sense
    to design interfaces so that others can write unit tests to isolate your package
    when needed. When these do not exist, it can create a lot of work and maintenance
    for a consumer.


    An interface can be substituted in a function call. So if we wanted to test this
    method, we''d just have to supply a fake / test-double class that implemented
    the Reader interface.


    Create a folder to work in:


    ```

    export GH_USERNAME="alexellis"

    mkdir -p $GOPATH/src/github.com/$GH_USERNAME/fake-1/

    cd $GOPATH/src/github.com/$GH_USERNAME/fake-1/

    ```


