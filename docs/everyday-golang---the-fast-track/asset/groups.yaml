    \n![](img/0b5c3b498f62579835cf1d543b46de92_7_0.png)\n\n图 1.1：Go 的新标志\n\n- Go 品牌指南\n\
    \n以下是一些在我脑海中出现的项目，它们完全（或大部分）用 Go 编写：\n\n- Docker - 由 Docker Inc 编写的容器引擎\n- Kubernetes\
    \ - 由 Google 和开源贡献者构建的容器集群系统\n- Traefik - 由 Traefik Labs 构建的负载均衡器\n- Istio - 用于加密\
    \ Kubernetes Pod 之间流量的服务网格\n- Consul、Terraform - 由 Hashicorp 构建的基础设施管理工具\n- Caddy\
    \ - 由 Matt Holt 编写的高速 HTTP 服务器\n- OpenFaaS - 用于托管你自己的函数的无服务器框架，由我和各种其他贡献者构建\n\n\
    这些只是数十万个出现在 GitHub Go 趋势页面上的项目中的几个。\n\n正如上面所见，Go 在服务器端项目中非常流行，但它也因二进制文件可以静态链接而非常流行于编写命令行界面（CLI）。\n\
    \n静态链接的 Go 二进制文件既快速又小巧，且不需要额外的运行时，使其成为非常受欢迎的选择。\n\n我个人对 Go 的亮点是：\n\n- 可移植性 - 静态编译便于分发\n\
    - 跨编译 - 能够使用单个命令（go build）为 Linux、Windows、macOS 操作系统（OS）和 Arm 计算机构建二进制文件\n- 并发模型\
    \ - Go 具有内置的并发机制，使其非常适合大小任务\n- 生态系统 - 了解 Go 意味着能够为几乎任何其他开源 Go 项目或产品做出贡献\n- 工具\
    \ - Go 包含自己的单元测试运行器和分析器，两者都简单易用\n- 意见 - Go 对格式、风格和类型有强烈的意见，使得在代码库之间移动变得容易\n\n\
    除此之外，Go 在其标准库或“stdlib”中拥有令人印象深刻的一套包。在 JavaScript、Ruby 或 Java 等编程语言中，许多有用的包和实用工具需要单独安装。\n\
    \n- crypto - X.509 证书和加密库\n- compress - 处理 zip 文件和归档\n- http - 非常强大且简单的 HTTP 客户端和服务器包，包括反向代理等\n\
    - net - 直接使用套接字、URL 和 DNS\n- encoding/json - 直接处理 JSON 文件\n- text/template - 用于在文件中替换标记并生成文本和\
    \ HTML 的强大模板引擎\n- os - 使用低级 OS 原语\n\n你可以在这里找到完整的包列表。\n\n在接下来的几章中，我们将探索上述一些亮点并解决各种实际问题。即使你是一名经验丰富的\
    \ Go 开发者，我也建议你完成每个练习，因为即使在 11 年后，我自己仍在学习新的方法和风格。\n\nGo 本身是一个非常稳定的语言，很少出现弃用或破坏性更改，因此\
    \ Go 的最新版本与本材料中提到的版本关系不大。内容会根据重大更改定期更新。\n\n## 开始使用 Go\n\n安装 Go 有三种方法。\n\n- 使用系统包安装\
    \ Go - 例如 msi（Windows）或 pkg（macOS）\n- 使用包管理器安装 Go - 例如 apt-get（Debian）、pacman（Arch\
    \ Linux）、brew（macOS）\n- 下载 tar 归档并解压到指定位置（仅限 Linux）\n\n如果你是新用户并且运行在 Windows 或\
    \ macOS 上，那么请继续使用第一个选项并从主页下载 Go。版本经常变化，因此请下载最新稳定版。\n\n如果你喜欢使用包管理器，你应该知道他们提供的版本通常落后。你可能正在安装一个非常旧的\
    \ Go 版本，一些功能可能不可用。\n\n### Windows 用户说明\n\n虽然 Go 命令可以在 cmd.exe 和 PowerShell 中运行，但一些示例命令需要\
    \ UNIX 风格的 shell，而该 shell 在 macOS 和 Linux 主机上可用。\n\n为了方便使用，建议你使用 Windows Subsystem\
    \ for Linux（WSL）尝试内容，如果你的系统可用。否则，请使用 Git Bash。\n\nGit Bash 提供了一个终端，你可以在其中运行 bash，访问\
    \ git 命令以及各种其他 UNIX 风格的命令，如 export、ls、mkdir 和 curl。\n\n### Linux 上的直接安装\n\n作为\
    \ Linux 用户，我经常需要在服务器、Docker 镜像或我的 Raspberry Pi 上安装 Go。我的 arkade 项目提供了一种快速高效的方式来下载最新版本，而无需构造\
    \ curl 语句或运行 tar。\n\n从以下地址下载并安装 arkade：https://github.com/alexellis/arkade\n\n\
