  md: "\n## CGO and portability\n\nCGO enables the creation of Go packages that call\
    \ C code.\n\n“CGO” is Go’s ability to link to C/C++ libraries and is sometimes\
    \ required to work with certain libraries like SQLite and certain Linux cryptographic\
    \ packages which are not available in Go’s standard library.\n\nCGO makes portability\
    \ more of a challenge and is beyond the scope of this book. My personal recommendation\
    \ is to avoid it, at all costs, if you plan to cross-compile your applications.\n\
    \nA good way to ensure that you are not using any CGO is through the `CGO_ENABLED=0`\
    \ environment variable that you can prefix to your builds.\n\nSee also: Go docs\
    \ on CGO and cgo is not Go by Dave Cheney\n\n```\nfile first-go-arm\nfirst-go-arm:\
    \ ELF 32-bit LSB executable, ARM, EABI5 version 1 (SYSV), statically linked, not\
    \ stripped\n\nfile first-go-arm64\nfirst-go-arm64: ELF 64-bit LSB executable,\
    \ ARM aarch64, version 1 (SYSV), statically linked, not stripped\n```\n\nIf you\
    \ use the bash command `du` you can see the size of the binary, which includes\
    \ debugging symbols.\n\n```\ndu -h ./first-go\n\n2.0M    ./first-go\n```\n\nThis\
    \ file can sometimes be made smaller by stripping the debug symbols out.\n\n```\n\
    GOOS=linux go build -a -ldflags \"-s -w\"\n\ndu -h first-go\n1.4M    first-go\n\
    \nfirst-go: ELF 64-bit LSB executable, x86-64, version 1 (SYSV), statically linked,\
    \ stripped\n```\n\nNote the smaller size, and the “stripped” output from the “file”\
    \ command.\n\n## Chapter 4\n\n### Fetch JSON from an HTTP endpoint\n\nThis has\
    \ to be one of the most common tasks for a new Go programmer. You have installed\
    \ Go, and have started to develop a CLI, now you need to interface with an external\
    \ API and make an HTTP “GET” call. It's very likely that the API will be using\
    \ JSON.\n\nWe will be querying an endpoint provided for free that tells us how\
    \ many astronauts are currently in space and what their names are.\n\nWe'll be\
    \ using HTTP and JSON from Go's standard library, and unlike with other languages,\
    \ we will not need to install any external packages.\n\n### Get started\n\nMake\
    \ yourself a folder for a new project (you can use your Github username here):\n\
    \n```\nexport GH_USERNAME=\"alexellis\"\nmkdir -p $GOPATH/src/github.com/$GH_USERNAME/get-json/\n\
    cd $GOPATH/src/github.com/$GH_USERNAME/get-json/\n```\n\nNow save a new file named\
    \ `main.go`:\n\n```go\npackage main\n\nfunc main() {\n\n}\n```\n\nThis program\
    \ is effectively hello-world without any print statements.\n\nGo ahead and run\
    \ the program, you have two ways to do this:\n\n```\ngo run main.go\n```\n\nOr\
    \ build a binary, then run it.\n\n```\ngo build\n./get-json\n```\n\nNow add a\
    \ print statement:\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n\
    \    fmt.Println(\"Hello world\")\n}\n```\n\nNow you can build and run the code\
    \ again, note that you can also change the output of the binary when compiled:\n\
    \n```\ngo build -o get-json\n./get-json\n```\n\nGo offers a convention-based formatting\
    \ of files, you can format a file and its indentation with:\n\n```\ngofmt -s -w\
    \ main.go\n```\n\nThe `-w` command writes the change to the file.\n\nAs we explored\
    \ in an earlier chapter, Go applications can also be cross-compiled for other\
    \ operating systems without any further changes, here’s how you can build the\
    \ above code for Windows:\n\n```\nGOOS=windows go build -o get-json.exe\n```\n\
    \n### Learn to parse JSON\n\nLet’s go on to parse some JSON. In Go we can turn\
    \ a JSON document into a struct which is useful for accessing the data in a structured\
    \ way. If a document doesn’t fit into the structure it will throw an error.\n\n\
    Let’s take an API from the Open Notify group - it shows the number of people in\
    \ space along with their names.\n\n### People in Space JSON\n\nIt looks a bit\
    \ like this:\n\n```json\n{\"people\": [{\"craft\": \"ISS\", \"name\": \"Sergey\
    \ Ryzhikov\"}, {\"craft\": \"ISS\", \"name\": \"Andrey Borisenko\"}, {\"craft\"\
    : \"ISS\", \"name\": \"Shane Kimbrough\"}, {\"craft\": \"ISS\", \"name\": \"Oleg\
    \ Novitskiy\"}, {\"craft\": \"ISS\", \"name\": \"Thomas Pesquet\"}, {\"craft\"\
    : \"ISS\", \"name\": \"Peggy Whitson\"}], \"message\": \"success\", \"number\"\
    : 6}\n```\n\nAccording to Wikipedia:\n\n> In computer science, marshalling or\
    \ marshaling (US spelling) is the process of transforming the memory representation\
    \ of an object into a data format suitable for storage or transmission. It is\
    \ typically used when data must be moved between different parts of a computer\
    \ program or from one program to another.\n\nIf you’re coming from Python, Ruby\
    \ or Node, then the “Unmarshal” behaviour in Go is usually used whenever you would\
    \ have parsed text to JSON.\n\nGo takes a reference to a struct, and then tries\
    \ to marshal the input into the data structure. The opposite operation is “Marshal”\
    \ which serializes an object into a text or binary representation.\n\nWe will\
    \ be importing the `fmt` package for the `Println` function and the `encoding/json`\
    \ package so that we can Unmarshal the JSON text into a struct.\n\nCreate `main.go`:\n\
    \n```go\npackage main\n\nimport (\n    \"encoding/json\"\n    \"fmt\"\n)\n\ntype\
    \ people struct {\n    Number int `json:\"number\"`\n}\n\nfunc main() {\n    text\
    \ := `{\"people\": [{\"craft\": \"ISS\", \"name\": \"Sergey Ryzhikov\"}, {\"craft\"\
    : \"ISS\", \"name\": \"Andrey Borisenko\"}, {\"craft\": \"ISS\", \"name\": \"\
    Shane Kimbrough\"}, {\"craft\": \"ISS\", \"name\": \"Oleg Novitskiy\"}, {\"craft\"\
    : \"ISS\", \"name\": \"Thomas Pesquet\"}, {\"craft\": \"ISS\", \"name\": \"Peggy\
    \ Whitson\"}], \"message\": \"success\", \"number\": 6}`\n    textBytes := []byte(text)\n\
    \n    p := people{}\n    err := json.Unmarshal(textBytes, &p)\n    if err != nil\
    \ {\n        fmt.Println(err)\n        return\n    }\n    fmt.Println(p.Number)\n\
    }\n```\n\nWe have hard-coded the JSON response from Open Notify so that we can\
    \ work on one chunk of behaviour at a time.\n\nThe `json.Unmarshal` function works\
    \ with a `[]byte` type instead of a string so we use `[]byte(stringHere)` to create\
    \ the format we need.\n\nIn order to make use of a struct to unmarshal the JSON\
    \ text we normally need to decorate it with some tags that help the std library\
    \ understand how to map the properties:\n\n```go\ntype people struct {\n    Number\
    \ int `json:\"number\"`\n}\n```\n\nThe property names need to begin with a capital\
    \ letter which marks them as exportable or public. If your struct's property is\
    \ the same in the JSON you should be able to skip the annotation.\n\nAnother thing\
    \ to notice is that we pass the address of the new / empty people struct into\
    \ the method. You can try removing the `&` symbol, but the value will be set in\
    \ a different copy of the empty struct. This may seem odd if you are coming from\
    \ languages that pass parameters by reference.\n\n### Retrieve the JSON via HTTP\n\
    \nNow we can parse a JSON document matching that of our API, let's go on and write\
    \ an HTTP client to fetch the text from the Internet.\n\nGo has a built-in HTTP\
    \ client in the `net/http` package, but it has a problem with long timeouts and\
    \ there are some well-known articles recommending that you set a timeout on your\
    \ request explicitly.\n\nThere are more concise ways of creating an HTTP request\
    \ in Go, but by adding a custom timeout we will harden our application.\n\nNow\
    \ create `main.go`:\n\n```go\npackage main\n\nimport (\n    \"encoding/json\"\n\
    \    \"fmt\"\n    \"io\"\n    \"log\"\n    \"net/http\"\n    \"time\"\n)\n\ntype\
    \ people struct {\n    Number int `json:\"number\"`\n}\n\nfunc main() {\n\n  \
    \  url := \"http://api.open-notify.org/astros.json\"\n\n    spaceClient := http.Client{\n\
    \        Timeout: time.Second * 2, // Timeout after 2 seconds\n    }\n\n    req,\
    \ err := http.NewRequest(http.MethodGet, url, nil)\n    if err != nil {\n    \
    \    log.Fatal(err)\n    }\n\n    req.Header.Set(\"User-Agent\", \"spacecount-tutorial\"\
    )\n\n    res, err := spaceClient.Do(req)\n    if err != nil {\n        log.Fatal(err)\n\
    \    }\n\n    if res.Body != nil {\n        defer res.Body.Close()\n    }\n\n\
    \    body, err := io.ReadAll(res.Body)\n    if err != nil {\n        log.Fatal(err)\n\
    \    }\n\n    p := people{}\n    err = json.Unmarshal(body, &p)\n    if err !=\
    \ nil {\n        log.Fatal(err)\n    }\n\n    fmt.Println(p.Number)\n}\n```\n\n\
    If you're used to writing Node.js, then you will be used to most I/O operations\
    \ returning a nullable error. The same is the case in Go and checking for errors\
    \ here has made the code quite verbose. You may want to refactor elements of the\
    \ code into separate methods - one to download and one unmarshal the JSON data.\n\
    \nIt may not always make sense to attempt to parse the HTTP response, one case\
    \ is if the HTTP code returned is a non-200 number. Here's how you can access\
    \ the HTTP code from the response:\n\n```\nfmt.Printf(\"HTTP status: %s\\n\",\
    \ res.Status)\n```\n\nIf you are unsure whether the JSON schema is stable and\
    \ expect it, at times, to return invalid JSON, then you could\n"
  mdcn: "\n\n## CGO 与可移植性\n\nCGO 使得创建调用 C 代码的 Go 包成为可能。\n\n“CGO”是 Go 链接 C/C++ 库的能力，有时在使用某些库时需要用到它，例如\
    \ SQLite，以及一些 Go 标准库中没有的 Linux 加密包。\n\nCGO 让可移植性变得更加困难，也超出了本书的讨论范围。我个人建议，如果你打算交叉编译应用程序，那么无论如何都要避免使用\
    \ CGO。\n\n确保你没有使用任何 CGO 的一个好方法，是通过 `CGO_ENABLED=0` 环境变量，你可以在构建命令前加上它。\n\n另请参阅：Go\
    \ 文档中关于 CGO 的内容，以及 Dave Cheney 所写的《cgo is not Go》。\n\n```\nfile first-go-arm\n\
    first-go-arm: ELF 32-bit LSB executable, ARM, EABI5 version 1 (SYSV), statically\
    \ linked, not stripped\n\nfile first-go-arm64\nfirst-go-arm64: ELF 64-bit LSB\
    \ executable, ARM aarch64, version 1 (SYSV), statically linked, not stripped\n\
    ```\n\n如果你使用 bash 命令 `du`，可以看到二进制文件的大小，其中包含调试符号。\n\n```\ndu -h ./first-go\n\n\
    2.0M    ./first-go\n```\n\n有时可以通过去除调试符号来让这个文件变得更小。\n\n```\nGOOS=linux go build\
    \ -a -ldflags \"-s -w\"\n\ndu -h first-go\n1.4M    first-go\n\nfirst-go: ELF 64-bit\
    \ LSB executable, x86-64, version 1 (SYSV), statically linked, stripped\n```\n\
    \n请注意更小的体积，以及 `file` 命令输出中的 “stripped”。\n\n## 第 4 章\n\n### 从 HTTP 端点获取 JSON\n\n\
    这一定是刚入门的 Go 程序员最常见的任务之一。你已经安装了 Go，并开始开发 CLI，现在你需要与外部 API 对接，发起一个 HTTP “GET” 请求。这个\
    \ API 很可能会使用 JSON。\n\n我们将查询一个免费提供的端点，它会告诉我们当前太空中有多少宇航员，以及他们的名字。\n\n我们将使用 Go 标准库中的\
    \ HTTP 和 JSON，与其他语言不同，我们不需要安装任何外部包。\n\n### 开始\n\n为你的新项目创建一个文件夹（此处可以使用你的 GitHub\
    \ 用户名）：\n\n```\nexport GH_USERNAME=\"alexellis\"\nmkdir -p $GOPATH/src/github.com/$GH_USERNAME/get-json/\n\
    cd $GOPATH/src/github.com/$GH_USERNAME/get-json/\n```\n\n现在保存一个名为 `main.go` 的新文件：\n\
    \n```go\npackage main\n\nfunc main() {\n\n}\n```\n\n这个程序实际上是一个没有任何打印语句的 hello-world。\n\
    \n继续运行这个程序，你有两种方式：\n\n```\ngo run main.go\n```\n\n或者构建一个二进制文件，然后运行它。\n\n```\n\
    go build\n./get-json\n```\n\n现在添加一条打印语句：\n\n```go\npackage main\n\nimport \"fmt\"\
    \n\nfunc main() {\n    fmt.Println(\"Hello world\")\n}\n```\n\n现在你可以再次构建并运行代码。注意，你也可以在编译时通过\
    \ `-o` 指定二进制文件的输出名称：\n\n```\ngo build -o get-json\n./get-json\n```\n\nGo 提供了一种基于约定的文件格式化方式，你可以用以下命令格式化文件及其缩进：\n\
    \n```\ngofmt -s -w main.go\n```\n\n`-w` 选项会将改动写入文件。\n\n正如我们在前面章节中探讨过的，Go 应用程序无需进一步修改即可为其他操作系统进行交叉编译。下面是为\
    \ Windows 构建上述代码的方法：\n\n```\nGOOS=windows go build -o get-json.exe\n```\n\n###\
    \ 学习解析 JSON\n\n接下来让我们解析一些 JSON。在 Go 中，我们可以将 JSON 文档转换为一个结构体，这有助于以结构化的方式访问数据。如果文档与结构体不匹配，就会抛出错误。\n\
    \n我们以 Open Notify 小组提供的一个 API 为例——它显示太空中的宇航员人数以及他们的姓名。\n\n### 太空中的宇航员 JSON\n\n\
    它看起来有点像这样：\n\n```json\n{\"people\": [{\"craft\": \"ISS\", \"name\": \"Sergey Ryzhikov\"\
    }, {\"craft\": \"ISS\", \"name\": \"Andrey Borisenko\"}, {\"craft\": \"ISS\",\
    \ \"name\": \"Shane Kimbrough\"}, {\"craft\": \"ISS\", \"name\": \"Oleg Novitskiy\"\
    }, {\"craft\": \"ISS\", \"name\": \"Thomas Pesquet\"}, {\"craft\": \"ISS\", \"\
    name\": \"Peggy Whitson\"}], \"message\": \"success\", \"number\": 6}\n```\n\n\
    根据维基百科：\n\n> 在计算机科学中，marshalling（美式拼写为 marshaling）是将对象的内存表示转换为适合存储或传输的数据格式的过程。它通常用在数据需要在计算机程序的不同部分之间移动，或从一个程序移动到另一个程序时。\n\
    \n如果你有 Python、Ruby 或 Node 背景，那么 Go 中的 “Unmarshal” 行为通常对应着你之前把文本解析为 JSON 的操作。\n\
    \nGo 会接收一个结构体的引用，然后尝试将输入映射到该数据结构中。相反的操作是 “Marshal”，它将对象序列化为文本或二进制表示。\n\n我们将导入\
    \ `fmt` 包以使用 `Println` 函数，并导入 `encoding/json` 包，以便将 JSON 文本 Unmarshal 到结构体中。\n\
    \n创建 `main.go`：\n\n```go\npackage main\n\nimport (\n    \"encoding/json\"\n  \
    \  \"fmt\"\n)\n\ntype people struct {\n    Number int `json:\"number\"`\n}\n\n\
    func main() {\n    text := `{\"people\": [{\"craft\": \"ISS\", \"name\": \"Sergey\
    \ Ryzhikov\"}, {\"craft\": \"ISS\", \"name\": \"Andrey Borisenko\"}, {\"craft\"\
    : \"ISS\", \"name\": \"Shane Kimbrough\"}, {\"craft\": \"ISS\", \"name\": \"Oleg\
    \ Novitskiy\"}, {\"craft\": \"ISS\", \"name\": \"Thomas Pesquet\"}, {\"craft\"\
    : \"ISS\", \"name\": \"Peggy Whitson\"}], \"message\": \"success\", \"number\"\
    : 6}`\n    textBytes := []byte(text)\n\n    p := people{}\n    err := json.Unmarshal(textBytes,\
    \ &p)\n    if err != nil {\n        fmt.Println(err)\n        return\n    }\n\
    \    fmt.Println(p.Number)\n}\n```\n\n我们硬编码了 Open Notify 的 JSON 响应，以便一次只处理一个行为。\n\
    \n`json.Unmarshal` 函数处理的是 `[]byte` 类型而不是字符串，因此我们使用 `[]byte(stringHere)` 来创建所需的格式。\n\
    \n为了使用结构体来 unmarshal JSON 文本，我们通常需要用一些标签（tag）来装饰它，以帮助标准库理解如何映射这些属性：\n\n```go\n\
    type people struct {\n    Number int `json:\"number\"`\n}\n```\n\n属性名需要以大写字母开头，这会将它们标记为可导出或公开的。如果你的结构体属性与\
    \ JSON 中的属性相同，那么可以跳过这个标签。\n\n另一件需要注意的事情是，我们向方法传入了新的/空的 people 结构体的地址。你可以试着去掉 `&`\
    \ 符号，但值会被设置在空结构体的另一个副本中。如果你来自按引用传递参数的语言，这可能看起来有些奇怪。\n\n### 通过 HTTP 获取 JSON\n\n\
    现在我们已经能够解析与我们的 API 匹配的 JSON 文档，接下来编写一个 HTTP 客户端，从互联网获取这段文本。\n\nGo 在 `net/http`\
    \ 包中内置了 HTTP 客户端，但它在超时时间过长方面存在问题，而且有一些知名文章建议你显式地在请求上设置超时。\n\n在 Go 中有更简洁的创建 HTTP\
    \ 请求的方式，但通过添加自定义超时，我们能让应用程序更健壮。\n\n现在创建 `main.go`：\n\n```go\npackage main\n\n\
    import (\n    \"encoding/json\"\n    \"fmt\"\n    \"io\"\n    \"log\"\n    \"\
    net/http\"\n    \"time\"\n)\n\ntype people struct {\n    Number int `json:\"number\"\
    `\n}\n\nfunc main() {\n\n    url := \"http://api.open-notify.org/astros.json\"\
    \n\n    spaceClient := http.Client{\n        Timeout: time.Second * 2, // Timeout\
    \ after 2 seconds\n    }\n\n    req, err := http.NewRequest(http.MethodGet, url,\
    \ nil)\n    if err != nil {\n        log.Fatal(err)\n    }\n\n    req.Header.Set(\"\
    User-Agent\", \"spacecount-tutorial\")\n\n    res, err := spaceClient.Do(req)\n\
    \    if err != nil {\n        log.Fatal(err)\n    }\n\n    if res.Body != nil\
    \ {\n        defer res.Body.Close()\n    }\n\n    body, err := io.ReadAll(res.Body)\n\
    \    if err != nil {\n        log.Fatal(err)\n    }\n\n    p := people{}\n   \
    \ err = json.Unmarshal(body, &p)\n    if err != nil {\n        log.Fatal(err)\n\
    \    }\n\n    fmt.Println(p.Number)\n}\n```\n\n如果你习惯编写 Node.js，那么你会习惯大多数 I/O 操作返回一个可能为\
    \ null 的错误。Go 中也是如此，而且在这里检查错误会让代码变得相当冗长。你可能想把代码中的部分内容重构为独立的方法——一个用于下载，一个用于 unmarshal\
