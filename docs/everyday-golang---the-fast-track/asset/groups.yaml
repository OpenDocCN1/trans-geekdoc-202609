    \nWe’ll be covering: writing your first Goroutine, creating Goroutines within\
    \ a loop, synchronisation through WaitGroups, error handling with Error groups,\
    \ using channels and limiting the amount of work in progress.\n\n# A simple example\
    \ with Goroutines\n\nIn this example, we have a printLater function which simulates\
