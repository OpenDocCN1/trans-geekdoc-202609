    \ ses-access-token\n      - seller-id\n      - secret-url\n```\n\n配置构建和部署函数的 OpenFaaS\
    \ YAML 文件示例\n\n我使用最多的库是 gopkg.in/yaml.v2。它适合用例，是我解析或保存 YAML 的首选库。\n\n## 读写您自己的\
