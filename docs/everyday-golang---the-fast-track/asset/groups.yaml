    ```\n```\n\n要加载配置文件，您需要定义多个结构体并对其进行注释，就像我们对 JSON 示例所做的那样。\n\n```\n```go\ntype\
    \ Spec struct {\n\n    // Name name of the function\n    Name string `yaml:\"\
    name\"`\n\n\n    // Image docker image name of the function\n    Image string\
    \ `yaml:\"image\"`\n\n    Environment map[string]string `yaml:\"environment,omitempty\"\
    `\n\n\n    // Limits for the function\n    Limits *FunctionResources `yaml:\"\
    limits,omitempty\"`\n}\n\n// FunctionResources Memory and CPU\ntype FunctionResources\
    \ struct {\n    Memory string `yaml:\"memory\"`\n    CPU    string `yaml:\"cpu\"\
    `\n}\n```\n```\n\n如上所示，我们本会放置 `json:\"field\"` 的地方，我们只需写 yaml，然后继续使用非常相似的接口将文本反序列化为对象。\n\
    \n创建 main.go：\n\n```\n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"os\"\
    \n\n    yaml \"gopkg.in/yaml.v2\"\n)\n\n// Add above structs here\n\nfunc main()\
    \ {\n    bytesOut, err := os.ReadFile(\"config.yaml\")\n    if err != nil {\n\
    \        panic(err)\n    }\n\n    spec := Spec{}\n    if err := yaml.Unmarshal(bytesOut,\
    \ &spec); err != nil {\n        panic(err)\n    }\n\n    fmt.Printf(\"Function\
    \ name: %s\\tImage: %s\\tEnvs: %d\\n\", spec.Name, spec.Image,\n        len(spec.Environment))\n\
    }\n```\n"
