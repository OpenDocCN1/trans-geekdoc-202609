    ## 第18章


    ## OpenFaaS与Go


    ![](img/0b5c3b498f62579835cf1d543b46de92_128_0.png)


    图18.1：OpenFaaS标志


    OpenFaaS 是一个开源、可移植且与云厂商无关的无服务器平台。


    欢迎阅读你的专属附加内容，仅面向高级版读者。


    ## 本章涵盖的主题


    - 无服务器的用例

    - OpenFaaS 简介

    - 适用于 OpenFaaS 的 Go 模板

    - 构建并测试你的第一个函数

    - 对函数进行单元测试

    - 在本地迭代

    - 拆分为多个文件和子包

    - 使用机密和数据库

    - 在多个环境之间管理配置

    - 自定义域名和路由

    - 下一步该去哪里


    ## 无服务器的用例


    说到“无服务器”，我发现潜在用户要么“一下就懂了”，要么完全没抓住要点。当你读到本书这一节时，我不确定你属于哪一类。


    我经常听到那些每天编写 HTTP 微服务、或者为客户构建平台间集成的开发者说：“我们还没准备好用无服务器”或者“我没有这种用例”。


    比较难解释的一点是：函数就是微服务，只是更加专门化。


    函数往往具备以下特点：


    - 比微服务更小

    - 更聚焦于单一用例或职责

    - 自动扩缩容并自动监控

    - 通过模板构建，无需处理 HTTP 服务器


    但它们覆盖的用例与微服务相同。它们可以读写数据库，可以为客户提供网页服务并拥有自定义域名，还可以用来运行批处理作业和处理数据。几乎没有什么事是函数做不到的。


    当我们说“函数”时，实际上是在说：“这是一种带有额外管理能力的微服务”，而通过统一的方式管理所有服务，可以减少重复劳动，让你更快地交付代码。


    所以，如果你以编写、维护或监控后端服务为生，那么你在日常工作中很可能用得上函数。


    另见：Serverless 2.0: Get started with the PLONK Stack • Alex Ellis • GOTO 2019


    我在博客文章《探索来自企业和社区的无服务器用例》中，介绍了来自社区和商业用户的具体用例。


    ## OpenFaaS 简介


    我对 Go 最早的记忆，是在 2015 年学习和撰写关于 Docker 的文章时。可复现构建的概念解决了当时我所在公司的一个重大痛点，但这项技术与当时使用的技术相比简直是天壤之别，于是我踏上了向他人讲解它的旅程。2016
    年，Docker 发布了“Swarm”产品，它允许多台运行容器的计算机作为分布式系统的一部分协同工作。大概也就是在那时，我听说了 FaaS 和无服务器这两个术语，而我当时完全不知道它们之间的区别。


    直到我开始尝试使用 AWS Lambda 来编写、调试和发布 Alexa 技能时，我才意识到容器能为函数带来什么。


    当时，无法直接在 AWS Lambda 中运行 Go 代码，常见的技巧是向 Node.js 运行时添加一个二进制文件，并让它在每次请求时被执行。然后是管道的问题。在一家大型企业工作时，我无法理解为什么将源代码控制连接到
    AWS Lambda 并使其直接部署变更如此困难。相反，当时通行的方法是使用 ZIP 文件和在本机编译的二进制文件。


    正是在那时，我开始了 OpenFaaS 的创建，当时（2016 年底）它还叫“faas”，第一个版本在次年五月的 Dockercon 主舞台上进行了演示。其中一个演示涉及对
    alexellis/faas GitHub 仓库上的 Star 事件进行响应。每收到一个 Star，就会生成一张虚拟拍立得照片，上传到 S3 存储桶，并展示在大屏幕上。


    那时候，如果你问 10 个人“无服务器”是什么意思，他们可能会根据自己所在的公司、接触函数的程度以及开始接触的时间给出不同的答案。我从 2016 年开始接触，当时“无服务器”在很大程度上等同于“函数即服务”（FaaS）。各个工作组曾试图定义这个术语或制定规范，但这些努力最终只形成了薄弱的标准和大量的困惑。我曾参与
    CNCF 的无服务器工作组，该小组撰写了 CNCF 白皮书。


    当我与 OpenFaaS 用户交流时，他们往往不太关心按量计费有多细、是否需要服务器管理，而更看重一个与云厂商无关的运行时，用于运行代码和处理事件。


    ## 与云函数的价值对比


    那么，OpenFaaS 相对于云函数的价值在哪里？


    - 避免被特定云厂商锁定。这意味着如果你有一个产品，你可以将其运行在公有云上为客户提供服务，也可以运行在客户自己的本地私有云中。

    - 自己设定限制。与其被告知一个函数允许的最大内存、最大大小、并发请求数或超时时间，你可以自己设置这些参数。如果你遇到了一个限制，并且它影响到了重要客户，你会怎么做？

    - 对解决方案进行白标。一些公司将 OpenFaaS 集成为其平台中一个运行函数的“黑盒”。这让他们的平台能够为用户运行代码并扩展平台自身。ADOPTERS
    文件中的例子包括 Waylay（一个低代码平台）和 LivePerson（一个面向客户的聊天平台）。

    - 扩展和调整。如果你需要对接某个消息队列或数据库，你可以编写代码来实现。如果你需要自定义函数的创建或运行方式，你可以分叉代码并对其进行修改以满足需求。


    ## 优点与缺点


    与此同时，我们也应该谈谈 OpenFaaS 相对于云函数的缺点。


    每个云厂商（如 Azure、Google Cloud 等）往往会让其云函数平台与其托管服务进行非常紧密的集成。如果你需要与 AWS 托管服务进行非常紧密的集成，那么
    AWS Lambda 可能更适合你的需求。


    OpenFaaS 相对容易运行，而且自从我们创建了 faasd 之后，部署几个函数不再需要你了解 Kubernetes。然而，如果你还没有使用 Kubernetes，在某些情况下使用云函数可能更简单。


    如果你正在为客户搭建一个你不想负责维护的函数，那么托管云函数所带来的支持服务可能会让你更放心。话虽如此，如果你是顾问，你可以为一个集群运行 OpenFaaS，服务所有客户。


    一些在 AWS 上使用 Kubernetes 的终端用户公司告诉我们，他们更倾向于用一种方式来部署和管理所有代码，这意味着使用 OpenFaaS 而不是托管的
    Lambda 平台。归根结底，你需要评估自己的需求，决定你是想要灵活性和自主性，由自己来支持和运行函数，还是想要一个托管平台，让云厂商承担部分职责。


    ## 你能在哪里运行 OpenFaaS 函数？


    你构建的任何 OpenFaaS 函数都会被打包成一个容器镜像。然后你可以将其部署到至少三个不同的平台上，只要它们支持 HTTP 微服务，甚至可能更多。


    - OpenFaaS——无论你在哪里听到“OpenFaaS”这个词，它很可能指的是运行在 Kubernetes 上的 OpenFaaS。你可以从云厂商那里获得托管的
    Kubernetes，这意味着控制平面无需你操心。然后你只需要管理节点，但这些节点也可以自动扩缩容。竞价实例可以大幅降低云主机的成本。

    - faasd——faasd 与 Kubernetes 上使用的 OpenFaaS 相同，但专门针对低开销和低资源需求进行了优化。它运行在单一主机上。

    - Google Cloud Run——你为 OpenFaaS 构建的大多数函数都可以在 Google 的 Cloud Run 上运行。你将按使用量付费，除了镜像本身之外，你无需管理任何东西。这不是完整的
    OpenFaaS 体验，但对某些用户来说可能很有用。


    在开始本节中的任何示例之前，你需要先搭建好 OpenFaaS。


    在你想构建函数的任何电脑上安装 Docker 和 faas-cli。


    ## 适用于 OpenFaaS 的 Go 模板


    OpenFaaS 提供了三个 Go 模板，供你用来构建函数：


    - `go` —— 一个使用 cgi/bin 方法的旧式模板

    - `golang-http` —— 一个 Go 模板，为你提供用户友好的 HTTP 请求/响应结构体

    - `golang-middleware` —— 我最喜欢的模板，为你提供 Go 标准库中的中间件


