  - "[PAGE 36]\n\n# Chapter 6\n\n# Writing unit-tests in Golang\n\nIn a previous chapter\
    \ we explored how to interact with a HTTP endpoint. We downloaded a response over\
    \ the Internet, and then parsed the JSON response into a struct.\n\nBut how would\
    \ we go about testing code that we write in Go? What can Go’s own test runner\
    \ offer us? And what kind of opinions does it prescribe?\n\n# Testing opinions\n\
    \nJust like Go has strong opinions and conventions for formatting, naming and\
    \ package layout, it has the same for unit-testing.\n\nGo actually has its own\
    \ built-in testing command called `go test` and a package testing which combine\
    \ to give a minimal but complete testing experience. The standard tool-chain also\
    \ includes benchmarking `go test -bench` and statement-based code coverage `go\
    \ test -cover` similar to [NCover](https://www.ndepend.com/) (.NET) or [Istanbul](https://istanbul.js.org/)\
    \ (Node.js).\n\nIf you are coming to Go from a language like Ruby, Java or .NET,\
    \ then you may be surprised to find that there is no assertions library, and certain\
    \ books go as far as to discourage any use of them.\n\nTo a JavaScript developer,\
    \ writing in a BDD style, testing a Sum method would look something like this:\n\
    \n```\n```javascript\nvar expect = require('expect');\n\ndescribe('Calculator',\
    \ function() {\n  describe('#multiply()', function() {\n    it('should return\
    \ -10 when 10 is multiplied by -1', function() {\n      const calc = new Calculator()\n\
    \      expect(calc.multiply(10, -1)).to.eql(-10)\n    });\n  });\n});\n```\n```\n\
    \nAn alternative to the above may be to use an `assert.AreEqual()` type of method\
    \ from the Java / C# world. The Go developers do not take this approach, and if\
    \ you want to see some examples of unit testing in Go, check out this test from\
    \ the OpenFaaS CLI which parses a YAML file: [stack_test.go](#).\n\nIn Go, the\
    \ same test would look more like this:\n\n```\n```go\nfunc TestMultiply_ForANegativeNumber(t\
    \ *testing.T) {\n    c := Calculator{}\n    want := -10\n    got := c.Multiply(10,\
    \ -1)\n\n    if want != got {\n```\n```"
