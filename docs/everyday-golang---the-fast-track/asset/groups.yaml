  - "[PAGE 122]\n\nIn our example, we’ll first checkout the code from GitHub for the\
    \ release tag, then run make all, followed by uploading the release artifacts\
    \ to the GitHub release.\n\n```\nname: publish\non:\n  push:\n    tags:\n    \
    \  - '*'\njobs:\n  publish:\n    runs-on: ubuntu-latest\n    steps:\n      - uses:\
    \ actions/checkout@master\n        with:\n          fetch-depth: 1\n      - name:\
    \ Make all\n        run: make all\n      - name: Upload release binaries\n   \
    \     uses: alexellis/upload-assets@0.4.1\n        env:\n          GITHUB_TOKEN:\
    \ ${{ github.token }}\n        with:\n          asset_paths: '[\"./bin/release-it*\"\
    ]'\n```\n\nEach step in the workflow file can use a specific GitHub Action like\
    \ alexellis/upload-assets@0.4.1 or actions/checkout@master, but when you leave\
    \ that field blank, it uses the base system such as ubuntu-latest. On the base\
    \ Ubuntu runner you can execute standard shell and build commands like make all.\n\
    \nThe alexellis/upload-assets action is one that I built to use on all the various\
    \ OSS projects I maintain and allows a number of files to be uploaded.\n\nUsers\
    \ can then go ahead and download your binary and run it on their system.\n\nFor\
    \ instance:\n\n```\n$ cd /tmp/\n$ curl -sLSf \\\n  -o ./release-it \\\n  https://github.com/alexellis/release-it/releases/download/0.2.11/release-it-darwin\
    \ \\\n  && chmod +x ./release-it \\\n  && ./release-it\n\nrelease-it: 0.2.11,\
    \ commit: 4379cbf694c55bd98f5080d76ac5972fd89dcc65\n```"
  - "[PAGE 123]\n\n# Chapter 16\n\n# Releasing a Docker container image\n\nI'll use\
    \ the term Docker image and container image interchangeably, since many people\
    \ only know containers by Docker.\n\nFirst of all, you'll need a Dockerfile which\
    \ has a similar purpose to the Makefile from earlier: to build a binary that can\
    \ be shipped to users.\n\nThis Dockerfile is going to be multi-stage, and also\
    \ multi-architecture.\n\n+   - multi-stage - the SDKs used to build the code are\
    \ not shipped in the final image\n+   - multi-archi(tecture) - the output can\
    \ run on more than one target platform\n\nMulti-arch builds are important when\
    \ your target platform is an Arm server and your development machine is Intel\
    \ or AMD, and visa-versa if you're an Apple M1 user.\n\nWe'll continue to use\
    \ the release-it repo from the previous section.\n\n```\nFROM --platform=${BUILDPLATFORM:-linux/amd64}\
    \ golang:1.22 as builder\n\nARG TARGETPLATFORM\nARG BUILDPLATFORM\nARG TARGETOS\n\
    ARG TARGETARCH\n\nARG Version\nARG GitCommit\n\nENV CGO_ENABLED=0\nENV GO111MODULE=on\n\
    \nWORKDIR /go/src/github.com/alexellis/release-it\n\nCOPY . .\n\nRUN CGO_ENABLED=${CGO_ENABLED}\
    \ GOOS=${TARGETOS} GOARCH=${TARGETARCH} \\\n    go test -v ./...\n\nRUN CGO_ENABLED=${CGO_ENABLED}\
    \ GOOS=${TARGETOS} GOARCH=${TARGETARCH} \\\n    go build -ldflags \\\n    \"-s\
    \ -w -X 'main.Version=${Version}' -X 'main.GitCommit=${GitCommit}'\" \\\n    -o\
    \ /usr/bin/release-it .\n\nFROM --platform=${BUILDPLATFORM:-linux/amd64} gcr.io/distroless/static:nonroot\n\
    WORKDIR /\nCOPY --from=builder /usr/bin/release-it /\n```"
