    \ Git 提交 SHA `036812b2e83c`。\n\n由于 Go 1.17 默认启用 Go modules（`GO111MODULE=on`），本书的其余部分将假定你也已启用它。\n\
    \n注意：在较旧的 Go 版本中，当 `GO111MODULE` 被设置为 `off` 时，代码会被下载到 `$GOPATH/src/` 而不是 `$GOPATH/pkg`。在未来的\
    \ Go 版本中，不使用 Go modules 的构建可能会被完全禁用。\n\n## Vendoring 与 Go modules\n\n在 Go 生态系统的早期，你的程序所使用的任何依赖的源代码都被放在一个\
    \ `vendor` 文件夹中。`vendor` 文件夹会与你的应用程序代码一起提交，为你提供构建应用程序所需的任何内容的副本和备份。\n\n在前面的例子\
    \ `hash-browns` 中，需要用到 `github.com/prometheus/procfs` 模块，它会被克隆到源代码树中，如下所示：\n\n\
    ```\n$GOPATH/src/github.com/alexellis/hash-browns\n$GOPATH/src/github.com/alexellis/hash-browns/vendor/github.com/prometheus/procfs\n\
    ```\n\n各种诸如 `dep` 之类的 vendoring 工具被用来下载和管理这些依赖。这些工具现在已被弃用。一个文件会指定需要哪些包，另一个“锁文件”会指定版本。因此你随时可以\
    \ `rm -rf` `vendor` 文件夹并运行类似 `dep ensure` 的命令，以获取所有各种文件的崭新副本并恢复。\n\n在 Go 1.13\
    \ 中，引入了 Go modules 的概念，它在很大程度上与 vendoring 相似，但有一个重大变化。依赖的源代码不再需要被克隆并与你的应用程序一起提交到源代码控制中。OpenFaaS\
    \ 的 40+ 个项目的过渡相对顺利，只有少数几个项目带来了麻烦，需要推迟处理。\n\nGo modules 的另一个变化是能够在 `$GOPATH/src`\
    \ 约定之外编译源代码。例如，你可以将源代码放在 `$HOME/dev/` 而不是 `$HOME/go/src/` 或你设置的其他位置。\n\n每当你创建新的\
    \ Go 项目时，最好先运行 `go mod init`。如果你的代码位于传统的 GOPATH 结构内，那么它的名称将被自动确定；如果不是，你可以将其作为参数传入。\n\
    \n对比以下示例：\n\n```\nexport GH_USERNAME=alexellis\n\n$ mkdir -p $GOPATH/src/github.com/$GH_USERNAME/hash-gen\n\
    $ cd $GOPATH/src/github.com/$GH_USERNAME/hash-gen\n$ go mod init\ngo: creating\
    \ new go.mod: module github.com/alexellis/hash-gen\n\n$ cat go.mod\nmodule github.com/alexellis/hash-gen\n\
    \ngo 1.16\n```\n\n而在 GOPATH 之外运行时：\n\n```\n$ mkdir /tmp/hash-gen\n$ cd /tmp/hash-gen\n\
