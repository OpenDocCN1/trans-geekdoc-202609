    \ A list of previous newsletter emails\n\n```\n<div class=\"card\">\n  <h5 class=\"\
    card-header\">Insiders Updates</h5>\n  <div class=\"card-body\">\n    <h5 class=\"\
    card-title\">Click on an update below, or use your browser to search for topics.</h5>\n\
    \    <ul>\n      <!-- Be a good person, and do not scrape this HTML -->\n    \
    \  {{ range $in, $el:= .Updates }}\n        {{ if ($.Updates.YearBreak $in) }}\n\
    \        </ul>\n        <p><b>{{ $el.Date.Year }}</b></p>\n        <ul>\n    \
    \    {{ end }}\n        <li id=\"{{ $el.ID }}\"><a href=\"{{ $.Path \"/update\"\
    \ }}?id={{ $el.ID }}\">{{ $el.Description }}</a></li>\n      {{ end }}\n    </ul>\n\
    \  </div>\n</div>\n```\n\nIn the example I used the range keyword to iterate around\
