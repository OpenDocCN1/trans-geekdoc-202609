    \ concurrency means being able to handle multiple tasks at once, but not necessarily\
    \ working on them at the exact same time. This concept is often confused with\
    \ parallel computing, the act of making progress on multiple tasks at the same\
    \ time.\n\nGo’s answer to concurrency is Goroutines. The documentation defines\
