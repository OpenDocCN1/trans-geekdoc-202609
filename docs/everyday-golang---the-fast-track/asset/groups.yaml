    \ /public/ 提供服务。\n\n## 第12章\n\n### 使用模板创建动态内容\n\n模板用于用在运行时提供的输入替换文件或文本块（模板）中的标记或表达式。\n\
    \n它们看起来与前端模板技术（如 Embedded Ruby (ERb)）中发现的表达式相似，因此你可能已经觉得它们很直观。\n\n模板可以简单到单行文本，也可以是多行块。模板可以从磁盘读取、通过互联网读取，或保存在内存中的\
