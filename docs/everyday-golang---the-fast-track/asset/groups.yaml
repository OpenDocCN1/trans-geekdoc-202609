    \ 1.0\nprovider:\n  name: openfaas\n  gateway: http://127.0.0.1:8080\nfunctions:\n\
    \  todo-fn:\nlang: golang-middleware\nhandler: ./todo-fn\nimage: docker.io/alexellis2/todo-fn:latest\n\
    secrets:\n  - db-user\n  - db-pass\nenvironment:\n  db_host: \"todo-pg11-do-user-2197152-0.b.db.ondigitalocean.com\"\
    \n  db_port: \"25060\"\n  db_name: \"defaultdb\"\n  db_ssl_mode: \"require\"\n\
    ```\n\n## 在多个环境之间管理配置\n\n每当你在 staging 和 production 环境之间迁移此应用程序时，你需要更改其数据库 URL\
    \ 和密钥。\n\n密钥相对简单设置，你只需在两个环境中运行 faas-cli secrets 并按需设置值即可。\n\n对于环境变量，你可以创建覆盖文件并在部署期间指定这些文件。\n\
    \n示例内容：staging.yaml：\n\n```\nenvironment:\n  db_host: \"todo-pg11-do-user-2197152-0.b.db.ondigitalocean.com\"\
    \n  db_port: \"25060\"\n  db_name: \"defaultdb\"\n  db_ssl_mode: \"require\"\n\
    ```\n\n示例内容：todo-fn.yaml：\n\n```\nversion: 1.0\nprovider:\n  name: openfaas\n\
    \  gateway: http://127.0.0.1:8080\nfunctions:\n  todo-fn:\n    lang: golang-middleware\n\
    \    handler: ./todo-fn\n    image: docker.io/alexellis2/todo-fn:latest\n    secrets:\n\
    \      - db-user\n      - db-pass\n    environment_file:\n      - ${OF_ENV:-staging}.yaml\n\
    ```\n\n此配置将 staging.yaml 作为默认值，但如果你将 OF_ENV 变量配置为 prod，则会改用 prod.yaml 中的值。\n\n\
    了解有关 YAML 的更多信息 - 环境变量替换\n\n## 进一步任务\n\n以下是你可以完成的一些进一步任务来测试你的知识：\n\n- 你将如何重构代码为子包，使数据库代码存在于单独的包中？\n\
    - 你能否使用正则表达式代替字符串匹配来使代码更高效？\n\n```\nID string\n}\n\nfunc Handle(w http.ResponseWriter,\
    \ r *http.Request) {\n    m := http.NewServeMux()\n\n    m.HandleFunc(\"/v1/create\"\
    , makeCreate())\n    m.HandleFunc(\"/v1/list\", makeList())\n\n    m.ServeHTTP(w,\
    \ r)\n}\n\nfunc makeCreate() func(http.ResponseWriter, *http.Request) {\n    return\
    \ func(w http.ResponseWriter, r *http.Request) {\n        if r.Body != nil {\n\
    \            defer r.Body.Close()\n            c := Customer{}\n            data,\
    \ _ := io.ReadAll(r.Body)\n            if err := json.Unmarshal(data, &c); err\
    \ != nil {\n            http.Error(w, \"unable to parse input as a Customer\"\
    , http.StatusInternalServerError)\n                return\n            }\n\n \
    \           log.Printf(\"Create for %s\", c.ID)\n            w.WriteHeader(http.StatusCreated)\n\
    \        }\n    }\n}\n\nfunc makeList() func(http.ResponseWriter, *http.Request)\
    \ {\n    return func(w http.ResponseWriter, r *http.Request) {\n        c := []Customer{\n\
    \            {ID: \"1\"},\n        }\n        out, _ := json.Marshal(c)\n    \
    \    w.Header().Set(\"Content-Type\", \"application/json\")\n        w.Write(out)\n\
    \    }\n}\n```\n\n部署函数后，你可以调用它并查看各种路径的处理程序：\n\n```\n$ curl -s http://127.0.0.1:8082/v1/list|jq\n\
    [\n  {\n    \"ID\": \"1\"\n  }\n]\n\n$ curl -s http://127.0.0.1:8082/v1/create\n\
    unable to parse input as a Customer\n\n$ curl -i -s -d '{\"ID\": \"2\"}' http://127.0.0.1:8082/v1/create\n\
    HTTP/1.1 201 Created\n```\n\n你应该能够使用第三方库中的 mux，但请记住，使用 Mux 不一定“更好”\n\n或比使用 switch\
    \ 或 if 语句检查 URL 前缀来决定做什么更符合惯用法。\n\n如果你想编写完整的 HTTP 微服务，并且不想使用函数处理程序，这也是一个选项，但你需要维护自己的\
    \ Dockerfile 或模板。模板抽象掉了用 Go 编写的 HTTP 端点所需的大量样板代码。\n\n查看 OpenFaaS Workload 定义，了解需要做什么才能让\
    \ OpenFaaS 管理现有容器，或使用 OpenFaaS 模板构建的容器。\n\n## 后续步骤\n\nOpenFaaS 在 https://docs.openfaas.com/\
    \ 提供全面的参考文档。\n\n你可能还喜欢：\n\n- Serverless for Everyone Else - OpenFaaS 的手册，其中包含许多用\
    \ Node.js 和 JavaScript 编写的示例。\n- Introduction to Serverless on Kubernetes - 由\
    \ Linux Foundation 委托的一门课程，涵盖 OpenFaaS 和 Python。\n- The OpenFaaS blog - 用于用例、案例研究和新闻。\n\
    \n如果你已经在生产环境或工作中为内部业务使用 OpenFaaS，请向 ADOPTERS.md 文件发送一个条目以通知维护者。根据下载统计数据，这里仅代表了部分商业用户。\n\
    \n如果你想了解有关 OpenFaaS 在工作中的更多信息，请查看支持页面：openfaas.com/support\n"
