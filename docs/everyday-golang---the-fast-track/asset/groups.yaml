    \ HTTP 服务器中的多个 Goroutine 或处理程序共享。读锁将用于访问数据，而写锁将由类似定时器或长时间运行的循环使用，以更新缓存中的条目。\n\n\
    第二种方法是让 Goroutine 直接输出数据，不共享类型。调用代码随后可以汇总结果，无需创建带锁的单独类型。你将在下面看到这种方法的示例：\n\n```go\n\
    var uri string\nflag.StringVar(&uri, \"uri\", \"\", \"uri to fetch\")\nflag.Parse()\n\
    \ntitleCh := make(chan string)\nerrorCh := make(chan error)\n\ngo titleOf(uri,\
    \ titleCh, errorCh)\n\nselect {\ncase title := <-titleCh:\n    fmt.Printf(\"Title:\
    \ %s\\n\", title)\ncase err := <-errorCh:\n    fmt.Printf(\"Error: %s\\n\", err.Error())\n\
    \    os.Exit(1)\n}\n}\n\nfunc titleOf(uri string, titleCh chan string, errCh chan\
    \ error) {\n    req, err := http.NewRequest(http.MethodGet, uri, nil)\n    if\
    \ err != nil {\n        errCh <- err\n        return\n    }\n\n    res, err :=\
    \ http.DefaultClient.Do(req)\n    if err != nil {\n        errCh <- err\n    \
    \    return\n    }\n    if res.Body != nil {\n        defer res.Body.Close()\n\
    \n        res, _ := io.ReadAll(res.Body)\n        for _, l := range strings.Split(string(res),\
    \ \"\\n\") {\n            if strings.Contains(l, \"<title>\") {\n            \
    \    titleCh <- l\n                return\n            }\n        }\n    }\n\n\
    \    errCh <- fmt.Errorf(\"no title found\")\n}\n```\n\n下面是一个运行工作负载的示例，包含三个不同的网站，然后是几个错误场景。\n\
    \n```text\n$ go run . -uri https://inlets.dev\nTitle:   <title>Inlets - The Cloud\
    \ Native Tunnel</title>\n\n$ go run . -uri https://github.com/alexellis/\nTitle:\
    \   <title>alexellis (Alex Ellis) · GitHub</title>\n\n$ go run .\nError: Get \"\
    \": unsupported protocol scheme \"\"\nexit status 1\n\n$ go run . -uri https://gitzub.com\n\
    Error: Get \"https://gitzub.com\": dial tcp: lookup gitzub.com: no such host\n\
    exit status 1\n```\n\n## 使用上下文处理超时\n\n现在，这里还存在另一个潜在问题。某些网站可能会挂起或无限期地保持连接打开。Go\
    \ 提供了一个称为“context”（上下文）的概念，可以将其传递给使用外部资源的调用，就像上面的 HTTP 请求一样。\n\nContext（上下文）会携带一个截止时间、一个取消信号以及其他值，跨过\
    \ API 边界。\n\n你可以在这里查看 context 包的文档：context。\n\n有些库函数允许通过参数传入 Context，但如果没有可用的\
    \ Context，你可以使用以下方法获取后台上下文：\n\n```go\nctx := context.Background()\n```\n\n你也可能会看到使用\
    \ context.TODO() 的情况，这可以用于没有可用的上下文，或者不清楚该使用哪个上下文的时候。\n\n它的 API 还提供了几个实用方法，用于定义取消策略：\n\
    \n```go\nfunc WithCancel(parent Context) (ctx Context, cancel CancelFunc)\n```\n\
    \n需要传入一个父上下文，当调用 cancel 函数时，任何正在进行的操作都必须停止，并应释放资源。\n\n```go\nfunc WithDeadline(parent\
    \ Context, d time.Time) (Context, CancelFunc)\n```\n\n这个函数与 WithCancel 类似，不同的是它有一个截止时间/日期，在未来的某个时间点，操作应当被取消。这对于\
    \ HTTP 请求或访问外部系统时很有用。\n\n```go\nfunc WithTimeout(parent Context, timeout time.Duration)\
    \ (Context, CancelFunc)\n```\n\nWithTimeout 函数也类似，但它提供了一个辅助函数，因此可以传入一个超时值，而不是未来的实际日期。\n\
    \n在下面的示例中，你将看到 WithTimeout 是如何工作的。\n\n```go\npackage main\n\nimport (\n  \"context\"\
    \n  \"flag\"\n  \"fmt\"\n  \"io\"\n  \"net/http\"\n  \"os\"\n  \"strings\"\n \
    \ \"time\"\n)\n\nfunc main() {\n    var uri string\n    var timeout time.Duration\n\
    \n    flag.StringVar(&uri, \"uri\", \"\", \"uri to fetch\")\n    flag.DurationVar(&timeout,\
    \ \"timeout\", time.Second*5, \"timeout for HTTP client\")\n\n    flag.Parse()\n\
    \n    titleCh := make(chan string)\n    errorCh := make(chan error)\n\n    go\
    \ titleOf(uri, timeout, titleCh, errorCh)\n\n    select {\n    case title := <-titleCh:\n\
    \        fmt.Printf(\"Title: %s\\n\", title)\n    case err := <-errorCh:\n   \
    \     fmt.Printf(\"Error: %s\\n\", err.Error())\n        os.Exit(1)\n    }\n}\n\
    \nfunc titleOf(uri string, timeout time.Duration, titleCh chan string, errCh chan\
    \ error) {\n    ctx, cancel := context.WithTimeout(context.Background(), timeout)\n\
    \    defer cancel()\n\n    req, err := http.NewRequestWithContext(ctx, http.MethodGet,\
    \ uri, nil)\n    if err != nil {\n        errCh <- err\n        return\n    }\n\
    \n    res, err := http.DefaultClient.Do(req)\n    if err != nil {\n        errCh\
    \ <- err\n        return\n    }\n\n    if res.Body != nil {\n        defer res.Body.Close()\n\
    \        res, _ := io.ReadAll(res.Body)\n        for _, l := range strings.Split(string(res),\
    \ \"\\n\") {\n            if strings.Contains(l, \"<title>\") {\n            \
    \    titleCh <- l\n                return\n            }\n        }\n    }\n\n\
    \    errCh <- fmt.Errorf(\"no title found\")\n}\n```\n\n现在，让我们将超时设置得更激进一些，比如 10ms，并引入一个\
    \ flag，以便我们能够轻松配置该值。\n\n```text\n$ go run . -uri https://github.com/alexellis\
    \ --timeout 10ms\nError: Get \"https://github.com/alexellis\": context deadline\
    \ exceeded\nexit status 1\n\n$ go run . -uri https://github.com/alexellis --timeout\
    \ 1000ms\nError: Get \"https://github.com/alexellis\": context deadline exceeded\n\
    exit status 1\n\n$ go run . -uri https://github.com/alexellis --timeout 3000ms\n\
    Title:  <title>alexellis (Alex Ellis) · GitHub</title>\n```\n\n所以看起来，我们需要一个相当宽裕的超时时间，才能从英国的一台客户端获取我的\
    \ GitHub 个人资料。\n\n## 限制并发任务\n\n到目前为止，我们所看到的所有技术都不允许我们限制资源。在某些时候，你可能会超过某个限制，比如你的机器上允许的文件数或\
    \ HTTP 连接数，或者你的“数据库即服务”所允许的数据库连接数。\n\n在这些情况下，考虑限制工作负载是很有用的。OpenFaaS CLI 中实现了一种类似的技术，用于构建、推送和部署函数。\n\
    \n默认情况下，并发级别为 1，但可以被覆盖，因此如果你需要构建 8 个函数，你可以让其中 4 个同时被处理。你可以将这种方法看作一个“窗口”，4 个 Goroutine\
    \ 会启动，并接收 8 份工作中的 4 份。当进行中的工作降到 3 份时，剩余队列中的 4 件任务中的另一件将被处理，直到所有工作完成且没有剩余为止。\n\n\
    下面的模式更新了我们的 `titleOf` 方法，使其无需 channel 即可运行，并返回 `(string, error)` 形式的结果。\n\n```go\n\
    func titleOf(uri string, timeout time.Duration) (string, error) {\n    ctx, cancel\
    \ := context.WithTimeout(context.Background(), timeout)\n    defer cancel()\n\n\
    \    req, err := http.NewRequestWithContext(ctx, http.MethodGet, uri, nil)\n \
    \   if err != nil {\n        return \"\", err\n    }\n\n    res, err := http.DefaultClient.Do(req)\n\
    \    if err != nil {\n        return \"\", err\n    }\n\n    if res.Body != nil\
    \ {\n        defer res.Body.Close()\n        res, _ := io.ReadAll(res.Body)\n\
    \        for _, l := range strings.Split(string(res), \"\\n\") {\n           \
    \ if strings.Contains(l, \"<title>\") {\n                return uri, nil\n   \
    \         }\n        }\n    }\n}\n```\n\n"
