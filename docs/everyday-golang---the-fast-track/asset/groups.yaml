  - "[PAGE 125]\n\nCongratulations, you've now built a static Golang binary, and shipped\
    \ it to a GitHub releases page and shipped your first multi-arch Docker that can\
    \ run on two different target platforms.\n\n# Shipping a Docker container from\
    \ GitHub Actions\n\nNow, the final step if you want to release a container image\
    \ for your GitHub repository is to define a GitHub action for it.\n\nCreate the\
    \ following file as .github/workflows/publish.yaml and commit it. It will run\
    \ a release build upon every tag you create, so every GitHub Release created in\
    \ the UI or API for your repo.\n\n```\n```yaml\nname: publish\n\non:\n  push:\n\
    \    tags:\n      - '*'\n\npermissions:\n  actions: read\n  checks: write\n  contents:\
    \ read\n  packages: write\n\njobs:\n  publish:\n    runs-on: ubuntu-latest\n \
    \   steps:\n      - uses: actions/checkout@master\n        with:\n          fetch-depth:\
    \ 1\n\n      - name: Get TAG\n        id: get_tag\n        run: echo TAG=latest-dev\
    \ >> $GITHUB_ENV\n      - name: Get Repo Owner\n        id: get_repo_owner\n \
    \       run: echo \"REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]'\
    \ '[:lower:]')\" > $GITHUB_ENV\n\n      - name: Set up QEMU\n        uses: docker/setup-qemu-action@v3\n\
    \      - name: Set up Docker Buildx\n        uses: docker/setup-buildx-action@v3\n\
    \n      - name: Login to Container Registry\n        uses: docker/login-action@v3\n\
    \        with:\n          username: ${{ github.repository_owner }}\n         \
    \ password: ${{ secrets.GITHUB_TOKEN }}\n          registry: ghcr.io\n\n     \
    \ - name: Release build\n        id: release_build\n```\n```"
