    \ longer.\n\n```\n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"os\"\n \
    \   \"time\"\n)\n\nfunc main() {\n    printLater(\"Hello\\n\", time.Millisecond*100)\n\
    \    printLater(\"World\\n\", time.Millisecond*100)\n    printLater(os.Getenv(\"\
    USER\")+\"\\n\", time.Millisecond*100)\n}\n\nfunc printLater(msg string, duration\
