    \ commit: 4379cbf694c55bd98f5080d76ac5972fd89dcc65\n```\n\n## Chapter 16\n\n###\
    \ Releasing a Docker container image\n\nI'll use the term Docker image and container\
    \ image interchangeably, since many people only know containers by Docker.\n\n\
    First of all, you'll need a Dockerfile which has a similar purpose to the Makefile\
    \ from earlier: to build a binary that can be shipped to users.\n\nThis Dockerfile\
    \ is going to be multi-stage, and also multi-architecture.\n\n- multi-stage -\
    \ the SDKs used to build the code are not shipped in the final image\n- multi-architecture\
    \ - the output can run on more than one target platform\n\nMulti-arch builds are\
    \ important when your target platform is an Arm server and your development machine\
    \ is Intel or AMD, and vice-versa if you're an Apple M1 user.\n\nWe'll continue\
    \ to use the release-it repo from the previous section.\n\n```\nFROM --platform=${BUILDPLATFORM:-linux/amd64}\
    \ golang:1.22 as builder\n\nARG TARGETPLATFORM\nARG BUILDPLATFORM\nARG TARGETOS\n\
    ARG TARGETARCH\n\nARG Version\nARG GitCommit\n\nENV CGO_ENABLED=0\nENV GO111MODULE=on\n\
    \nWORKDIR /go/src/github.com/alexellis/release-it\n\nCOPY . .\n\nRUN CGO_ENABLED=${CGO_ENABLED}\
    \ GOOS=${TARGETOS} GOARCH=${TARGETARCH} \\\n    go test -v ./...\n\nRUN CGO_ENABLED=${CGO_ENABLED}\
    \ GOOS=${TARGETOS} GOARCH=${TARGETARCH} \\\n    go build -ldflags \\\n    \"-s\
    \ -w -X 'main.Version=${Version}' -X 'main.GitCommit=${GitCommit}'\" \\\n    -o\
    \ /usr/bin/release-it .\n\nFROM --platform=${BUILDPLATFORM:-linux/amd64} gcr.io/distroless/static:nonroot\n\
    WORKDIR /\nCOPY --from=builder /usr/bin/release-it /\n```\n\nCongratulations,\
    \ you've now built a static Golang binary, and shipped it to a GitHub releases\
    \ page and shipped your first multi-arch Docker that can run on two different\
    \ target platforms.\n\n### Shipping a Docker container from GitHub Actions\n\n\
    Now, the final step if you want to release a container image for your GitHub repository\
    \ is to define a GitHub action for it.\n\nCreate the following file as .github/workflows/publish.yaml\
    \ and commit it. It will run a release build upon every tag you create, so every\
    \ GitHub Release created in the UI or API for your repo.\n\n```yaml\nname: publish\n\
    \non:\n  push:\n    tags:\n      - '*'\n\npermissions:\n  actions: read\n  checks:\
    \ write\n  contents: read\n  packages: write\n\njobs:\n  publish:\n    runs-on:\
    \ ubuntu-latest\n    steps:\n      - uses: actions/checkout@master\n        with:\n\
    \          fetch-depth: 1\n\n      - name: Get TAG\n        id: get_tag\n    \
    \    run: echo TAG=latest-dev >> $GITHUB_ENV\n      - name: Get Repo Owner\n \
    \       id: get_repo_owner\n        run: echo \"REPO_OWNER=$(echo ${{ github.repository_owner\
    \ }} | tr '[:upper:]' '[:lower:]')\" > $GITHUB_ENV\n\n      - name: Set up QEMU\n\
    \        uses: docker/setup-qemu-action@v3\n      - name: Set up Docker Buildx\n\
    \        uses: docker/setup-buildx-action@v3\n\n      - name: Login to Container\
    \ Registry\n        uses: docker/login-action@v3\n        with:\n          username:\
    \ ${{ github.repository_owner }}\n          password: ${{ secrets.GITHUB_TOKEN\
    \ }}\n          registry: ghcr.io\n\n      - name: Release build\n        id:\
    \ release_build\n        uses: docker/build-push-action@v5\n        with:\n  \
    \        outputs: \"type=registry,push=true\"\n          platforms: linux/amd64,linux/arm/v6,linux/arm64\n\
    \          build-args: |\n            Version=${{ env.TAG }}\n            GitCommit=${{\
    \ github.sha }}\n          tags: |\n            ghcr.io/${{ env.REPO_OWNER }}/release-it:${{\
    \ github.sha }}\n            ghcr.io/${{ env.REPO_OWNER }}/release-it:${{ env.TAG\
    \ }}\n            ghcr.io/${{ env.REPO_OWNER }}/release-it:latest\n```\n\nYou\
    \ can see that the build-args are populated just as when we ran docker build or\
    \ buildx locally, and then we have some additional actions for setting up qemu.\
