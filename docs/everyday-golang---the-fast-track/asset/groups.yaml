    # Add an external dependency


    Whilst the standard library is extensive, it''s likely that you will need to use
    an external dependency. Dependencies in Go are made available as source code that
    can be linked to your program, which differs from C# or Java where compiled assets
    (DLLs or JARs) are downloaded. For this reason, you''ll usually see that a Go
    package has a path to where it can be downloaded with git.


    You can use webhooks to receive events from third-party APIs such as GitHub.com
    or Stripe. Most of the time the webhooks are sent with a digest in the header,
    that you can use to verify that the message hasn''t been tampered with.


    HMAC uses a symmetric key that both sender/receiver share ahead of time. The sender
    will generate a hash when wanting to transmit a message - this data is sent along
    with the payload. The recipient will then sign the payload with the shared key
    again. And if the hash matches then the payload is assumed to be from the sender.


    Quote from alexellis/hmac


    Let''s use my library to create a digest of our own message, and then show how
    to verify it after. You can of course use the standard library directly, but the
    point of this exercise is to show: how to reference an external dependency. You
    can also browse the code for the dependency to see how to define your own.


    To begin with, we should initialise a Go module for our application. The Go modules
    file go.mod lists external dependencies that we want our program to depend upon.


