    \    err := json.Unmarshal(textBytes, &p)\n    if err != nil {\n        fmt.Println(err)\n\
    \        return\n    }\n    fmt.Println(p.Number)\n}\n```\n\nWe have hard-coded\
    \ the JSON response from Open Notify so that we can work on one chunk of behaviour\
    \ at a time.\n\nThe json.Unmarshal function works with a []byte type instead of\
    \ a string so we use []byte(stringHere) to create the format we need.\n\nIn order\
