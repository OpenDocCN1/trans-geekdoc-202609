    \ a Serverless Single Page App\n\n## 第 9 章\n\n## 编写自己的 YAML 配置文件\n\n12 Factor\
    \ Apps 的趋势是通过环境变量而不是文件使所有配置可用。这使得它们易于使用容器部署，因为文件往往需要额外的权限或创建和挂载文件系统。\n\n然而，环境变量也有缺点，例如长度，以及当它们很多时的复杂性。由于所有输入都在同一级别，嵌套也很困难。您可能会发现配置文件是答案。\n\
    \n## YAML 实际应用的实用示例\n\n在 OpenFaaS CLI 中，我们添加了一个配置文件来存储您登录的不同安装的凭据。CLI 还有一个用于您部署的函数的配置文件，名为\
