    ```go\nhttp.Handle(\"/public/\",\n\thttp.StripPrefix(\"/public/\",\n\t\thttp.FileServer(http.FS(frontend))))\n\
    ```\n```\n\nYour API could be bound to the path /api/v1/ and then any static content\
    \ you have embedded would be served from /public/."
  - "[PAGE 94]\n\n# Chapter 12\n\n# Create dynamic content with templates\n\nTemplates\
    \ are used to replace tokens or expressions in a file or block of text (template)\
    \ with inputs provided at runtime.\n\nThey look similar to expressions found in\
    \ front-end templating technology like Embedded Ruby (ERb), for this reason they\
    \ may seem inituitive to you already.\n\nA template can be as simple as a single\
    \ line of text, or a multi-line block. The template could be read from disk, over\
    \ the Internet, or kept within a const in memory.\n\nHere's an example based upon\
    \ the Golang docs:\n\n```\nDear {{.Name}},\n\n{{if .Attended}}\nIt was a pleasure\
    \ to see you at the wedding.\n{{- else}}\nIt is a shame you couldn't make it to\
    \ the wedding.\n{{- end}}\n\nBest wishes,\nAlex\n```\n\nFirst, we need to load\
    \ the template into memory, then construct a typed struct or an inline struct\
    \ to pass in the values to be placed within the file, then we execute it to get\
    \ the result. .Name will be replaced directly, but .Attended is going to cause\
    \ one of the two following sentences to be added into the letter.\n\n```\n```go\n\
    package main\n\nimport (\n    \"bytes\"\n    \"fmt\"\n    \"text/template\"\n\
    )\n\nconst letter = `Dear {{.Name}},\n{{if .Attended}}\nIt was a pleasure to see\
    \ you at the wedding.\n{{- else}}\nIt is a shame you couldn't make it to the wedding.\n\
    {{- end}}\nBest wishes,\nAlex`\n\nfunc main() {\n```\n```"
  - "[PAGE 95]\n\n```\n```go\npeople := []struct {\n    Name     string\n    Attended\
    \ bool\n}{\n    {\n        Name:     \"Alex\",\n        Attended: true,\n    },\n\
    \    {\n        Name:     \"Mick\",\n        Attended: false,\n    },\n}\n\nt\
    \ := template.Must(template.New(\"letter\").Parse(letter))\n\nfor _, person :=\
    \ range people {\n    buffer := bytes.Buffer{}\n    err := t.Execute(&buffer,\
    \ person)\n    if err != nil {\n        panic(err)\n    }\n    fmt.Printf(\"Letter\
    \ for %s:\\n\\n%s\\n\", person.Name, buffer.String())\n}\n```\n```\n\nRunning\
    \ the example we see the following output:\n\n```\n```\n$ go run main.go\nLetter\
    \ for Alex:\n\nDear Alex,\n\nIt was a pleasure to see you at the wedding.\nBest\
    \ wishes,\nAlex\n\nLetter for Mick:\n\nDear Mick,\n\nIt is a shame you couldn't\
    \ make it to the wedding.\nBest wishes,\nAlex\n```\n```\n\nWhenever I want to\
    \ add a HTML front-end to an application, I’ll turn to Go templates and embed\
    \ the HTML template files along with the code.\n\n# Advanced templates: ranges\
    \ and custom functions\n\nI use templates with my Sponsors’ Portal in order to\
    \ list and print out all the previous editions of my newsletter.\n\nHere is a\
