    # Advanced route handling


    You can add logic to a HTTP handler to only respond to certain HTTP methods, or
    to take different actions according to the path, however there are also a number
    of libraries available that can reduce code duplication.


    Gorilla''s mux is one of the most popular and is used in OpenFaaS and the inlets
    project.


    In this example, the function path can take a name as an argument which will be
    parsed and made available without any user action. The Regular Expression allows
    alpha-numerics plus dashes and requires at least one character.


    ```

    r.HandleFunc("/function/{name:[-a-zA-Z_0-9-]+}", functionProxy)

    ```


    Within the handler, the mux.Vars() helper function is used to query the name:'
