  mdcn: "\n在我们的示例中，我们首先会从GitHub上针对发布标签检出代码，然后运行`make all`，接着将发布产物上传到GitHub Release。\n\
    \n```\nname: publish\non:\n  push:\n    tags:\n      - '*'\njobs:\n  publish:\n\
    \    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@master\n\
    \        with:\n          fetch-depth: 1\n      - name: Make all\n        run:\
    \ make all\n      - name: Upload release binaries\n        uses: alexellis/upload-assets@0.4.1\n\
    \        env:\n          GITHUB_TOKEN: ${{ github.token }}\n        with:\n  \
    \        asset_paths: '[\"./bin/release-it*\"]'\n```\n\n工作流文件中的每个步骤都可以使用特定的GitHub\
    \ Action，例如`alexellis/upload-assets@0.4.1`或`actions/checkout@master`；而当该字段留空时，则会使用基础系统，比如`ubuntu-latest`。在Ubuntu基础运行环境中，你可以执行标准的Shell和构建命令，例如`make\
    \ all`。\n\n`alexellis/upload-assets` Action是我创建并用于我所维护的各种开源项目的，它支持上传多个文件。\n\n\
    用户随后就可以下载你的二进制文件，并在自己的系统上运行它。\n\n例如：\n\n```\n$ cd /tmp/\n$ curl -sLSf \\\n  -o\
    \ ./release-it \\\n  https://github.com/alexellis/release-it/releases/download/0.2.11/release-it-darwin\
    \ \\\n  && chmod +x ./release-it \\\n  && ./release-it\n\nrelease-it: 0.2.11,\
    \ commit: 4379cbf694c55bd98f5080d76ac5972fd89dcc65\n```\n\n## 第16章\n\n### 发布Docker容器镜像\n\
    \n我会交替使用“Docker镜像”和“容器镜像”这两个术语，因为许多人只通过Docker了解容器。\n\n首先，你需要一个Dockerfile，它的作用类似于之前的Makefile：构建一个可以分发给用户的二进制文件。\n\
    \n这个Dockerfile将是多阶段（multi-stage）的，同时也支持多架构（multi-architecture）。\n\n- 多阶段——构建代码所需的SDK不会包含在最终镜像中\n\
    - 多架构——构建产物可以在不止一个目标平台上运行\n\n当你的目标平台是Arm服务器而开发机是Intel或AMD时，多架构构建非常重要；反过来，如果你是Apple\
    \ M1用户，也同样重要。\n\n我们继续使用上一节中的`release-it`仓库。\n\n```\nFROM --platform=${BUILDPLATFORM:-linux/amd64}\
    \ golang:1.22 as builder\n\nARG TARGETPLATFORM\nARG BUILDPLATFORM\nARG TARGETOS\n\
    ARG TARGETARCH\n\nARG Version\nARG GitCommit\n\nENV CGO_ENABLED=0\nENV GO111MODULE=on\n\
    \nWORKDIR /go/src/github.com/alexellis/release-it\n\nCOPY . .\n\nRUN CGO_ENABLED=${CGO_ENABLED}\
    \ GOOS=${TARGETOS} GOARCH=${TARGETARCH} \\\n    go test -v ./...\n\nRUN CGO_ENABLED=${CGO_ENABLED}\
    \ GOOS=${TARGETOS} GOARCH=${TARGETARCH} \\\n    go build -ldflags \\\n    \"-s\
    \ -w -X 'main.Version=${Version}' -X 'main.GitCommit=${GitCommit}'\" \\\n    -o\
    \ /usr/bin/release-it .\n\nFROM --platform=${BUILDPLATFORM:-linux/amd64} gcr.io/distroless/static:nonroot\n\
    WORKDIR /\nCOPY --from=builder /usr/bin/release-it /\n```\n\n恭喜，你现在已经构建了一个静态Golang二进制文件，将其发布到了GitHub\
    \ Release页面，同时交付了你的第一个多架构Docker镜像，它可以在两种不同的目标平台上运行。\n\n### 从GitHub Actions发布Docker容器\n\
    \n现在，如果你想为自己的GitHub仓库发布容器镜像，最后一步就是为它定义一个GitHub Action。\n\n创建以下文件`.github/workflows/publish.yaml`并提交。每当你创建标签时，它都会执行一次发布构建，因此你在UI或API中为仓库创建的每个GitHub\
    \ Release都会触发构建。\n\n```yaml\nname: publish\n\non:\n  push:\n    tags:\n      -\
    \ '*'\n\npermissions:\n  actions: read\n  checks: write\n  contents: read\n  packages:\
    \ write\n\njobs:\n  publish:\n    runs-on: ubuntu-latest\n    steps:\n      -\
    \ uses: actions/checkout@master\n        with:\n          fetch-depth: 1\n\n \
    \     - name: Get TAG\n        id: get_tag\n        run: echo TAG=latest-dev >>\
    \ $GITHUB_ENV\n      - name: Get Repo Owner\n        id: get_repo_owner\n    \
    \    run: echo \"REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]'\
    \ '[:lower:]')\" > $GITHUB_ENV\n\n      - name: Set up QEMU\n        uses: docker/setup-qemu-action@v3\n\
    \      - name: Set up Docker Buildx\n        uses: docker/setup-buildx-action@v3\n\
    \n      - name: Login to Container Registry\n        uses: docker/login-action@v3\n\
    \        with:\n          username: ${{ github.repository_owner }}\n         \
    \ password: ${{ secrets.GITHUB_TOKEN }}\n          registry: ghcr.io\n\n     \
    \ - name: Release build\n        id: release_build\n        uses: docker/build-push-action@v5\n\
    \        with:\n          outputs: \"type=registry,push=true\"\n          platforms:\
    \ linux/amd64,linux/arm/v6,linux/arm64\n          build-args: |\n            Version=${{\
    \ env.TAG }}\n            GitCommit=${{ github.sha }}\n          tags: |\n   \
    \         ghcr.io/${{ env.REPO_OWNER }}/release-it:${{ github.sha }}\n       \
    \     ghcr.io/${{ env.REPO_OWNER }}/release-it:${{ env.TAG }}\n            ghcr.io/${{\
    \ env.REPO_OWNER }}/release-it:latest\n```\n\n你可以看到，`build-args`的填充方式与我们在本地运行`docker\
    \ build`或`buildx`时相同，然后我们还添加了一些用于设置QEMU的额外Action。QEMU被`buildx`用来交叉编译你的代码，使其能在其他机器上运行。\n\
    \n平台列表（`linux/amd64, linux/arm/v6, linux/arm64`）意味着该容器可以在Raspberry Pi OS、64位Arm服务器以及常规Intel/AMD服务器上运行。\n\
    \n如果你使用`ghcr.io`，事情会简单得多：GitHub Actions会提供一个临时令牌，用于发布镜像。只需确保你记得包含上面提到的`permissions`和`packages:\
    \ write`部分，以便令牌具有适当的权限。对于Docker Hub或私有registry，你需要创建一对单独的密钥，例如`DOCKER_USERNAME`和`DOCKER_PASSWORD`，然后更新`docker/login-action@v2`步骤来使用它们。\n\
    \n请注意，使用GHCR时，你的容器镜像默认可能被设置为私有。你需要将其设为公开才能共享，否则需要对你的Docker引擎或Kubernetes集群进行身份验证。\n\
    \n## 第17章\n\n### 你接下来的旅程\n\n我希望你喜欢我分享的这些配方和示例，它们来自我自己过去5-6年使用Go和开源社区的旅程。当然，我一直在学习，书中部分示例曾经是博客文章，但现在已经过时了。\n\
    \n### 提供反馈\n\n如果你有反馈，或者发现了错误，请随时联系我，这样我们可以一起改进这本电子书，让它惠及更多人。邮箱：[contact@openfaas.com](mailto:contact@openfaas.com)。\n\
    \n同样，如果你的团队或公司正在工作中使用Go，并希望获得建议或与熟悉Go和分布式系统的人交流，也请随时联系。\n\n### 为开源做贡献\n\n我们也在为社区维护的各种开源项目寻找贡献者。这是一个很好的方式，可以让你大展身手，并将所学付诸实践。\n\
    \n- [OpenFaaS](https://www.openfaas.com/)——可移植的开源无服务器函数平台\n- [arkade](https://github.com/alexellis/arkade)——直接从GitHub\
    \ Releases安装CLI和Kubernetes应用的市场\n- [k3sup](https://github.com/alexellis/k3sup)——使用K3s在个人电脑和云上启动Kubernetes集群\n\
    - [derek](https://github.com/alexellis/derek)——一个GitHub机器人，可自动完成开源项目中的维护者任务，并通过issue/PR评论向贡献者授予权限\n\
    - [inlets-operator](https://github.com/inlets/inlets-operator)——一个Kubernetes Operator，可为私有Kubernetes集群中的任意LoadBalancer服务提供公网IP\n\
    \n### 我的其他内容\n\nOpenFaaS本身是用Go编写的，它是一个可运行在Kubernetes、单台VM或Raspberry Pi上的无服务器平台。电子书和视频工作坊[Serverless\
    \ For Everyone Else](https://openfaas.com)已经售出450份，是开始学习函数的好去处。\n\n我还有一个关于使用Kubernetes（k3s）构建Raspberry\
    \ Pi集群的工作坊，内容涵盖如何从网络存储启动Raspberry Pi。网络存储比SD卡更快、更高效。电子书和视频工作坊可以在Gumroad上单独购买或作为套装购买：[Netbooting\
    \ workshop for Raspberry Pi with K3s](https://gumroad.com/l/netbooting)。\n\n如果你[在Twitter上关注我\
    \ @alexellisuk](https://twitter.com/alexellisuk)，就能看到我发布新视频、活动和博客文章的消息，这些内容可能会发布在多个平台上。\n\
    \n最后，感谢你购买这本电子书。无论你身处Golang旅程的哪个阶段，希望你都乐在其中。\n\n"
