    \ web server content.\n//go:embed image/* template/*\n//go:embed public/index.html\n\
    //go:embed css/*\nvar frontend embed.FS\n```\n```\n\nNow you can simply link the\
    \ embed.FS to a custom HTTP middleware or handler and serve the files to users\
