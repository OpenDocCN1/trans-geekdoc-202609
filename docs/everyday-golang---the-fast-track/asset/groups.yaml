    Since Go 1.17 turns Go modules on by default (GO111MODULE=on), the rest of the
    book will assume that you also have it enabled.


    Note: In older Go versions, whenever GO111MODULE is set to off, then the code
    is downloaded to $GOPATH/src/ instead of $GOPATH/pkg. Building without Go modules
    may be disabled completely in a future release of Go.


    # Vendoring and Go modules


    In the early days of the Go ecosystem, the source code of any dependencies being
    used by your program was placed a vendor folder. The vendor folder would be committed
    alongside your application code, giving you a copy and back-up of anything required
    to build your application.


    In the previous example, hash-browns, the github.com/prometheus/procfs module
    was required, which would be cloned into the source tree as follows:


    ```

    $GOPATH/src/github.com/alexellis/hash-browns

    $GOPATH/src/github.com/alexellis/hash-browns/vendor/github.com/prometheus/procfs

    ```


    Various vendoring tools such as dep were used to download and manage these dependencies.
    They are now deprecated. One file would specify which packages were required,
    and another “a lock file” would specify the versions. So at any time you could
    rm -rf the vendor folder and run something like dep ensure to get a fresh copy
    of all the various files restored.


    In Go 1.13 the concept of Go modules was introduced which largely mirrors vendoring,
    with one big change. The source for dependencies no longer needed to be cloned
    and committed to source control with your application. The transition for OpenFaaS’
    40+ projects was relatively smooth, with just a few projects causing headaches
    and needing to be deferred.'
