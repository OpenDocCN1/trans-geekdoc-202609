    \ transfer.go transport.go]\n\n$ go list -f={{.TestGoFiles}} net/http\n[cookie_test.go\
    \ export_test.go filetransport_test.go header_test.go http_test.go\n↪  proxy_test.go\
    \ range_test.go readrequest_test.go requestwrite_test.go response_test.go\n↪ \
    \ responsewrite_test.go transfer_test.go transport_internal_test.go]\n```\n\n\
    ## Stress testing your tests\n\nYour tests can also be run more than once, I’ve\
    \ found this to show up issues with race conditions or shared state in code that\
    \ I’ve written.\n\nSimply add `-test.count=100` to run your tests 100 times.\n\
    \nAt times, you’ll also see the tests refuse to run because the results are (cached).\
    \ In this instance, adding `-test.count=1` can get around that problem.\n\n##\
    \ Running tests in parallel\n\nIt may appear that your unit tests run well and\
    \ in a deterministic order, but often when they are run in parallel problems can\
    \ be found before they hit production. This is because when we test our code locally,\
    \ it’s usually with a lower load, or serially. On a production system, we may\
    \ have many users doing things in parallel.\n\nYou may also have a suite of tests\
    \ that are slow to run, in that case running in parallel may save time. 10x tests\
    \ that take 1s to complete could run in 10 seconds serially, or in 1 second if\
    \ run with a parallelism of 10.\n\nConsider this example:\n\n```go\npackage main\n\
    \nimport (\n    \"testing\"\n    \"time\"\n)\n\nfunc Test_Slow1(t *testing.T)\
    \ {\n    time.Sleep(1 * time.Second)\n}\n\nfunc Test_Slow2(t *testing.T) {\n \
    \   time.Sleep(1 * time.Second)\n}\n\nfunc Test_Slow3(t *testing.T) {\n    time.Sleep(1\
    \ * time.Second)\n}\n\nfunc Test_Slow4(t *testing.T) {\n    time.Sleep(1 * time.Second)\n\
    }\n\nfunc Test_Slow5(t *testing.T) {\n    time.Sleep(1 * time.Second)\n}\n```\n\
