    \n## 隔离依赖\n\n单元测试和集成测试有什么区别？\n\n单元测试和集成测试之间的区别在于，单元测试通常会隔离与网络、磁盘等进行通信的依赖。单元测试通常只测试一个东西，例如一个函数。\n\
    \n在 Go 中，可以通过接口实现隔离，但如果你有 C# 或 Java 的背景，它们在 Go 中的形式看起来会有些不同。接口是隐式实现而不是强制实现的，这意味着具体类不需要预先知道接口。\n\
