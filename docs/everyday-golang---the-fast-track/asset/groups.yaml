    \ `vendor` 文件夹已经被创建。\n\n你可以通过向 `go build` 命令添加 `-mod vendor` 参数，让 Go 使用 `vendor`\
    \ 文件夹进行构建，而不是使用位于 `$GOPATH/pkg` 的本地包缓存。\n\n```\n$ go build -mod vendor\n```\n\n\
    那么你应该使用哪种方法呢？\n\nVendoring 的优势在于将所有源代码和依赖保存在一个地方；它也不需要下载任何东西来执行构建。对于某些项目，例如 Kubernetes\
    \ 控制器，这意味着节省时间和带宽。如果你有任何私有依赖，vendoring 可能是最简单的选择，尤其是在容器或 CI 流水线中进行构建时。\n\n不进行\
    \ vendoring 而直接使用 modules 似乎是一种趋势，许多项目都删除了它们的 `vendor` 文件夹。这样做的一个优势是让代码审查更容易，因为在拉取请求或提交中变更的文件要少得多。处理私有\
    \ Go modules 可能会引起争议，所以提醒你留意。\n\n另请参阅：Go modules 参考文档\n\n## 第 2 章\n\n### 创建你的第一个\
