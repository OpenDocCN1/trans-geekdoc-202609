    \ (outside GOPATH, module path must be specified)\n\nExample usage:\n    'go mod\
    \ init example.com/m' to initialize a v0 or v1 module\n    'go mod init example.com/m/v2'\
    \ to initialize a v2 module\n\nRun 'go help mod init' for more information.\n\
    ```\n\n请尝试以下任一方式代替：\n\n```\n$ go mod init hash-gen\n$ go mod init github.com/alexellis/hash-gen\n\
    ```\n\n也可以同时使用 Go modules 和 vendoring：\n\n```\n$ cd /tmp/\n$ git clone https://github.com/alexellis/hash-browns\n\
