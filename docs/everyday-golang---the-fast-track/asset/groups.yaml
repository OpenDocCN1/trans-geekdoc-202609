    ![](img/0b5c3b498f62579835cf1d543b46de92_7_0.png)


    Figure 1.1: Go''s new logo


    +   - Go branding guidelines


    Here are some projects that come to mind, which are written entirely (or have
    major portions) in Go:


    +   - Docker - a container engine written by Docker Inc

    +   - Kubernetes - a clustering system for containers built by Google and open
    source contributors

    +   - Traefik - a load-balancer built by Traefik Labs

    +   - Istio - a service mesh to encrypt traffic between Kubernetes Pods

    +   - Consul, Terraform - tools for managing infrastructure built by Hashicorp

    +   - Caddy - a high performance HTTP server written by Matt Holt

    +   - OpenFaaS - serverless framework for hosting your own functions, built by
    myself and various other contributors


    These are just a few of hundreds of thousands of projects which have appeared
    on GitHub''s trending page for Go.


    As you can see from the above, Go is very popular for server-side projects, but
    it is also very popular for writing Command Line Interfaces (CLIs) because the
    binaries can be statically linked. Statically-linked Go binaries are both fast
    and small, and do not require an additional runtime making them a very popular
    choice.


    My personal highlights for Go are:


    +   - portability - static compilation for easy distribution

    +   - cross-compilation - being able to build binaries for Linux, Windows, MacOS
    Operating Systems (OS) and Arm computers with a single command (go build)

    +   - concurrency model - Go has built-in mechanisms for concurrency that make
    it well suited to tasks both small and large

    +   - ecosystem - knowing Go means being able to contribute to almost any other
    open source Go project or product

    +   - tooling - Go includes its own unit-testing runner and profiler, both of
    which are simple and easy to use

    +   - opinions - Go has strong opinions on formatting, style and typing that make
    it easy to move between codebases


    Above everything else, Go has an impressive set of packages available within its
    standard libraries or “stdlib”. There are many useful packages and utilities that
    would need to be installed separately in a programming language like JavaScript,
    Ruby or Java.


    +   - crypto - libraries for X.509 certificates and cryptography

    +   - compress - work with zip files and archives

    +   - http - a very powerful and simple HTTP client and server package including
    things like reverse proxies

    +   - net - work directly with sockets, URLS and DNS

    +   - encoding/json - work directly with JSON files

    +   - text/template - a powerful templating engine for replacing tokens in files,
    and generating text and HTML'
  - '[PAGE 8]


    +   - os - work with low level OS primitives


    You can find a complete package list here.


    Through the next few chapters we will explore some of the above highlights and
    also solve various practical problems. Even if you''re a seasoned Go developer,
    I''d recommend going through each of the exercises, because even after 11 years,
    I myself am still learning new approaches and styles.


    Go itself is a very stable language, which seldom sees deprecations or breaking
    changes, for that reason the latest version of Go has little bearing on the version
    mentioned in this material. The content is updated periodically in line with major
    changes.


    # Getting started with Go


    There are three ways to install Go.


    +   - Install Go using a system package - such as an msi (Windows) or pkg (MacOS)

    +   - Install Go using a package manager - such as apt-get (Debian), pacman (Arch
    Linux), brew (MacOS)

    +   - Download a tar archive and unpack it to a set location (Linux only)


    If you''re a new user and running on Windows or MacOS, then go ahead with the
    first option and download Go from the homepage. The version changes frequently,
    so download the latest stable version.


    If you like to use package managers, you should be aware that the version they
    offer often lags behind. You may be installing a very old version of Go, and some
    features may not be available.


    # A note for Windows users


    Whilst the Go commands can be run cmd.exe and PowerShell, some of the example
    commands expect a UNIX-style shell which is present on MacOS and Linux hosts.


    For ease of use, it''s recommended that you try the content using Windows Subsystem
    for Linux (WSL), if it is available for your system. Or if not, make use of Git
    Bash.


    Git bash provides a terminal where you can run bash, have access to the git command
    and various other UNIX-style commands such as export, ls, mkdir and curl.


    # Direct installation on Linux


    As a Linux user, I often need to install Go on a server, within a Docker image,
    or on my Raspberry Pi. My arkade project provides a quick and efficient way to
    download the latest version without having to construct a curl statement or run
    tar.


    Download and install arkade from: https://github.com/alexellis/arkade


    Then run:


    ```

    sudo arkade system install go


    Installing Go to /usr/local/

