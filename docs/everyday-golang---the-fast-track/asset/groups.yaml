    ↪  https://github.com/openfaas/golang-http-template\n\n$ ls ./template/\ngolang-http\
    \      golang-middleware\n```\n```\n\nThe golang-http template provides a request\
    \ and response style, and is most similar to the approach managed cloud functions\
    \ take.\n\nSee the contents of `template/golang-http/function/handler.go`:\n\n\
    ```\n```go\npackage function\n\nimport (\n    \"fmt\"\n    \"net/http\"\n\n  \
    \  handler \"github.com/openfaas/templates-sdk/go-http\"\n)\n\n// Handle a function\
    \ invocation\nfunc Handle(req handler.Request) (handler.Response, error) {\n \
    \   var err error\n\n    message := fmt.Sprintf(\"Body: %s\", string(req.Body))\n\
    \n    return handler.Response{\n        Body:       []byte(message),\n       \
    \ StatusCode: http.StatusOK,\n    }, err\n}\n```\n```\n\n+   - The HTTP body is\
    \ available in the `req.Body` variable.\n+   - The HTTP headers are available\
    \ in `req.Headers`.\n+   - The HTTP querystring, path and method are also available\
    \ in `req.QueryString`, `req.Path` and `req.Method`.\n\nThe golang-middleware\
    \ template offers a standard HTTP request handler instead:\n\nContents of `template/golang-middleware/function/handler.go`:\n\
    \n```\n```go\npackage function\n\nimport (\n```\n```"
  - "[PAGE 132]\n\n```\n\"fmt\"\n\"io\"\n\"net/http\"\n)\n\nfunc Handle(w http.ResponseWriter,\
    \ r *http.Request) {\n    var input []byte\n\n    if r.Body != nil {\n       \
    \ defer r.Body.Close()\n\n        body, _ := io.ReadAll(r.Body)\n\n        input\
    \ = body\n    }\n\n    w.WriteHeader(http.StatusOK)\n    w.Write([]byte(fmt.Sprintf(\"\
    Body: %s\", string(input))))\n}\n```\n\nBoth OpenFaaS and Cloud Run require a\
    \ container, so a Dockerfile is usually necessary. By using a template, the Dockerfile\
    \ gets abstracted away along with all the common boilerplate code like how to\
    \ set up a HTTP server and start listening on a TCP port. Those things still happen,\
    \ but are hidden away from your workflow and don’t need to be duplicated in every\
    \ function.\n\n# Your first function\n\nLet’s create a function that computes\
    \ a bcrypt hash of whatever input you send to it. Bcrypt is often used to hash\
    \ passwords for storage in databases.\n\nSee also: https://pkg.go.dev/golang.org/x/crypto/bcrypt\n\
    \nDecide where you want to upload your container images for your functions, and\
    \ set the below environment variable:\n\n```\nexport OPENFAAS_PREFIX=\"ghcr.io/alexellis\"\
    \nexport OPENFAAS_PREFIX=\"docker.io/alexellis2\"\nexport OPENFAAS_PREFIX=\"private.gcr.io/my-company\"\
    \n```\n\nThe Docker Hub and GitHub Container Registry provide a good starting\
    \ point. You can also use your own private registries, if you configure OpenFaaS\
    \ for this.\n\nMake sure that you’ve logged into Docker:\n\n```\ndocker login\n\
    ```\n\nNow set up your environment variable if you didn’t already do that in the\
    \ previous step.\n\n```\nexport OPENFAAS_PREFIX=\"docker.io/alexellis2\"\n```\n\
    \nCreate a folder for the function:\n\n```\nexport GH_USERNAME=\"alexellis\"\n\
    mkdir -p $GOPATH/src/github.com/$GH_USERNAME/bcrypt-fn/\ncd $GOPATH/src/github.com/$GH_USERNAME/bcrypt-fn/\n\
    ```\n\nNow scaffold a new function using the golang-middleware template:"
  - "[PAGE 133]\n\n```\nfaas-cli template store pull golang-middleware\n\nfaas-cli\
    \ new --lang golang-middleware \\\n  bcrypt-fn\n```\n\nCheck out the contents\
    \ of the generated bcrypt-fn.yml file:\n\n```\nversion: 1.0\nprovider:\n  name:\
    \ openfaas\n  gateway: http://127.0.0.1:8080\nfunctions:\n  bcrypt-fn:\n    lang:\
    \ golang-middleware\n    handler: ./bcrypt-fn\n    image: docker.io/alexellis2/bcrypt-fn:latest\n\
    ```\n\nYou can change the latest tag to a specific version such as 0.1.0 and then\
    \ increment this before each build of your function.\n\nUpdate the bcrypt-fn/handler.go\
    \ file so that it computes a bcrypt hash of whatever input you send it:\n\n```\n\
    package function\n\nimport (\n  \"fmt\"\n  \"io\"\n  \"net/http\"\n\n  \"golang.org/x/crypto/bcrypt\"\
    \n)\n\nfunc Handle(w http.ResponseWriter, r *http.Request) {\n  var input []byte\n\
    \n  if r.Body != nil {\n    defer r.Body.Close()\n    body, _ := io.ReadAll(r.Body)\n\
    \    input = body\n  }\n\n  res, err := bcrypt.GenerateFromPassword(input, bcrypt.DefaultCost)\n\
    \  if err != nil {\n    http.Error(w, fmt.Sprintf(\"Error: %s\", err), http.StatusInternalServerError)\n\
    \    return\n  }\n\n  w.WriteHeader(http.StatusOK)\n  w.Write(res)\n}\n```\n\n\
    Run these steps to set up the imported module:\n\n```\ncd bcrypt-fn\ngo mod init\n\
    go mod tidy\n```"
  - "[PAGE 134]\n\nThen `cd ..` back to the top level of your project, where the `bcrypt-fn.yml`\
    \ file is.\n\nYou must always run `go mod` commands alongside your `handler.go`\
    \ file, and not at the level of the YAML file.\n\n# Building your function\n\n\
    The workflow for building and deploying a function is as follows:\n\n+   - `faas-cli\
    \ build` creates a container image in your local Docker library\n+   - `faas-cli\
    \ push` pushes the image to your remote container registry\n+   - `faas-cli deploy`\
    \ deploys the function to your OpenFaaS Gateway using a REST API call\n\nThe above\
    \ three commands can be run via the `faas-cli up` command.\n\nAnd of these commands\
    \ can be run in CI/CD pipelines.\n\nSet up your OpenFaaS Gateway URL as an environment\
    \ variable and run `faas-cli up` to try out the function.\n\n```\n```sh\nexport\
    \ OPENFAAS_URL=http://127.0.0.1:8080\n\nexport DOCKER_BUILDKIT=1\n\nfaas-cli build\
    \ --build-arg GO111MODULE=on -f bcrypt-fn.yml\n```\n```\n\nThe `export DOCKER_BUILDKIT=1`\
    \ step will instruct Docker to use buildkit instead of its legacy approach for\
    \ building functions. Buildkit can work out much faster because it can cache the\
    \ layers in a more intelligent way and also run multiple steps in parallel. Ultimately,\
    \ this means your builds will be quicker.\n\nWhat will happen next is that the\
    \ Dockerfile for the function will be executed. This is hidden away from you in\
    \ the template at: `template/golang-middleware/Dockerfile`. You can read through\
    \ it now, if you like.\n\nIn a separate window, invoke the container:\n\n```\n\
    ```sh\ncurl --data-binary \"functions\" \\\n  http://127.0.0.1:8080/function/bcrypt-fn\n\
    \n$2a$10$ziCqH4XsqdfO5SQ4QqCenuF9qi1hhW50N7f4914fqZjacU5PzJsqq\n```\n```\n\nEach\
    \ time you run the function, you’ll get the same result. You’ll also notice that\
    \ the duration is relatively slow because the algorithm is designed to be CPU-intensive.\n\
    \nTime the invocation with:\n\n```\n```sh\ntime curl --data-binary \"functions\"\
    \ \\\n  http://127.0.0.1:8080/function/bcrypt-fn\n\n$2a$10$MypsuxBUfgTQa4IcW/XW3u.1uV/uWp4ktp/q3T10TFg4Exqjz9pge\n\
    real    0m0.108s\nuser    0m0.012s\nsys     0m0.012s\n```\n```\n\nYou can also\
    \ check the HTTP header for the `X-Duration-Seconds:` header, which is the time\
    \ the function to run, rather than the round-trip between curl and the container.\n\
    \n```\n```sh\ncurl -i --data-binary \"functions\" \\\n  http://127.0.0.1:8080/function/bcrypt-fn\n\
    \nHTTP/1.1 200 OK\nContent-Length: 60\nContent-Type: text/plain; charset=utf-8\n\
    ```\n```"
