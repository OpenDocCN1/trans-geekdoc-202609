    \ replicas := range e.api.QueryFunctions() {\n\t\te.ServiceReplicasGauge.\n\t\t\
    \tWithLabelValues(serviceName).\n\t\t\tSet(float64(replicas))\n\t}\n\n\te.ServiceReplicasGauge.Collect(ch)\n\
    }\n```\n\nIn the Describe method, we've told Prometheus about all the various\
    \ metrics which it needs to hold data for.\n\nAfter running `go mod init prometheus-collector`:\n\
    \n### main.go\n\n```go\npackage main\n\nimport (\n\t\"fmt\"\n\t\"log\"\n\t\"net/http\"\
    \n\t\"strconv\"\n\t\"time\"\n\n\t\"github.com/prometheus/client_golang/prometheus\"\
    \n\t\"github.com/prometheus/client_golang/prometheus/promhttp\"\n)\n\nfunc main()\
    \ {\n\tport := 8080\n\treadTimeout := time.Millisecond * 500\n\twriteTimeout :=\
    \ time.Millisecond * 500\n\n\tmux := http.NewServeMux()\n\tapi := newAPIQuery()\n\
    \n\te := NewExporter(api)\n\tprometheus.MustRegister(e)\n\n\tmux.Handle(\"/metrics\"\
    , promhttp.Handler())\n\tmux.Handle(\"/remove\", http.HandlerFunc(\n\t\tfunc(w\
    \ http.ResponseWriter, r *http.Request) {\n\t\t\tname := r.URL.Query().Get(\"\
    name\")\n\t\t\tapi.Remove(name)\n\t\t}))\n\n\tmux.Handle(\"/register\", http.HandlerFunc(\n\
    \t\tfunc(w http.ResponseWriter, r *http.Request) {\n\t\t\tname := r.URL.Query().Get(\"\
    name\")\n\t\t\treplicasV := r.URL.Query().Get(\"replicas\")\n\t\t\treplicas, _\
    \ := strconv.ParseInt(replicasV, 10, 64)\n\t\t\tapi.Register(name, int64(replicas))\n\
    \t\t\tw.WriteHeader(http.StatusAccepted)\n\t\t}))\n\n\ts := &http.Server{\n\t\t\
    Addr:           fmt.Sprintf(\":%d\", port),\n\t\tReadTimeout:    readTimeout,\n\
    \t\tWriteTimeout:   writeTimeout,\n\t\tMaxHeaderBytes: 1 << 20, // Max header\
    \ of 1MB\n\t\tHandler:        mux,\n\t}\n\tlog.Printf(\"Listening on: %d\", port)\n\
    \ts.ListenAndServe()\n}\n```\n\nIn the Collect method, we reset the metric, then\
    \ we add in any items that are present in the API's response. If an item is removed,\
    \ then it will no longer be exported as part of the service's metrics.\n\nRunning\
    \ the sample, you will see no metrics, since we have nothing to export:\n\n```sh\n\
    go run . &\n```\n\n```sh\ncurl -s http://127.0.0.1:8080/metrics | grep gateway\n\
    ```\n\nNow use the API /register endpoint to add three functions and their replica\
    \ count:\n\n```sh\ncurl -s \"http://127.0.0.1:8080/register?name=email&replicas=1\"\
    \ncurl -s \"http://127.0.0.1:8080/register?name=payment&replicas=3\"\ncurl -s\
    \ \"http://127.0.0.1:8080/register?name=scrape&replicas=0\"\n```\n\nTry the endpoint\
    \ again:\n\n```sh\ncurl -s http://127.0.0.1:8080/metrics | grep gateway\n```\n\
    \n```\n# HELP gateway_service_count Current count of replicas for function\n#\
    \ TYPE gateway_service_count gauge\ngateway_service_count{function_name=\"email\"\
    } 1\ngateway_service_count{function_name=\"payment\"} 3\ngateway_service_count{function_name=\"\
    scrape\"} 0\n```\n\nNow remove the email function's replicas and see that it's\
    \ also permanently removed from the set of values returned when the service's\
    \ /metrics endpoint is scraped.\n\n```sh\ncurl -s \"http://127.0.0.1:8080/remove?name=email\"\
    \n```\n\n```sh\ncurl -s http://127.0.0.1:8080/metrics | grep gateway\n```\n\n\
    ```\n# HELP gateway_service_count Current count of replicas for function\n# TYPE\
    \ gateway_service_count gauge\ngateway_service_count{function_name=\"payment\"\
    } 3\ngateway_service_count{function_name=\"scrape\"} 0\n```\n\nI recommend using\
    \ the Collector interface whenever you have a dynamic dataset or are obtaining\
    \ data from a third party system, in this case, from the Kubernetes API.\n\nYou\
    \ can find the complete code example in the samples/prometheus-collector folder.\n\
    \n## Chapter 15\n\n## Building and releasing Go binaries\n\nWhether you've written\
    \ a CLI or an HTTP server, most of the time Go code can be compiled down to a\
    \ static binary which is self-contained and can run on the target system you specify.\n\
    \nIn an earlier chapter we covered cross-compilation, at this point you should\
    \ consider whether you need to target one environment such as Windows, Linux or\
    \ MacOS, or multiple.\n\n### The release-it example\n\n[Release-it](https://github.com/release-it/release-it)\
    \ repo is an example of a static Go binary that can be built and released through\
    \ GitHub Actions. It uses a [Makefile](https://github.com/release-it/release-it/blob/main/Makefile),\
    \ so it can also be run in other CI pipelines or manually as and when you create\
    \ a new release.\n\nThe Makefile has the following properties, all of which were\
    \ covered in previous chapters already:\n\n- It builds binaries for multiple platforms\
    \ and Operating Systems\n- It injects the Commit and Version from git into the\
    \ final binary\n\n```makefile\nVersion := $(shell git describe --tags --dirty)\n\
    # Version := \"dev\"\nGitCommit := $(shell git rev-parse HEAD)\nLDFLAGS := \"\
    -s -w -X main.Version=$(Version) -X main.GitCommit=$(GitCommit)\"\n\n.PHONY: all\n\
    all: gofmt dist\n\n.PHONY: gofmt\ngofmt:\n\t@test -z $(shell gofmt -l ./ | tee\
    \ /dev/stderr) || (echo \"[WARN] Fix formatting issues with 'make fmt'\" && exit\
    \ 1)\n\n.PHONY: dist\ndist:\n\tmkdir -p bin/\n\tCGO_ENABLED=0 GOOS=linux go build\
    \ -mod=vendor -a -ldflags $(LDFLAGS) -o bin/release-it-amd64\n\tCGO_ENABLED=0\
    \ GOOS=darwin go build -mod=vendor -a -ldflags $(LDFLAGS) -o bin/release-it-darwin\n\
    \tGOARM=7 GOARCH=arm CGO_ENABLED=0 GOOS=linux go build -mod=vendor -a -ldflags\
    \ $(LDFLAGS) -o bin/release-it-arm\n\tGOARCH=arm64 CGO_ENABLED=0 GOOS=linux go\
    \ build -mod=vendor -a -ldflags $(LDFLAGS) -o bin/release-it-arm64\n\tGOOS=windows\
    \ CGO_ENABLED=0 go build -mod=vendor -a -ldflags $(LDFLAGS) -o bin/release-it.exe\n\
    ```\n\nIn addition, it runs gofmt for good measure.\n\nIf there were any unit\
    \ tests in the project, then we could add an additional target for them, such\
    \ as:\n\n```makefile\n.PHONY: gotest\ngotest:\n\tgo test ./...\n```\n\nThen update\
    \ the all line to `gofmt gotest dist` which would run each of the tasks for us.\n\
    \nClone the example and build it:\n\n```sh\n$ mkdir $GOPATH/src/github.com/alexellis/\n\
    $ cd $GOPATH/src/github.com/alexellis/\n$ git clone https://github.com/alexellis/release-it\n\
    $ cd release-it\n$ make\n```\n\nBy default make will try to run the all target,\
    \ but you can also run make gofmt if you want to test formatting before committing\
    \ to a build.\n\nYou'll find each binary in the bin/ folder and can run them on\
    \ your system if it matches the OS/architecture pair, or copy it to another system\
    \ to run it there.\n\n![](img/0b5c3b498f62579835cf1d543b46de92_121_0.png)\n\n\
    Figure 15.1: GitHub's release page\n\nWhen you release binaries to users, GitHub's\
    \ release functionality can come in handy because it allows you to upload the\
    \ binaries manually or via automation.\n\n### Releasing your binaries with a GitHub\
    \ Action\n\nGitHub Actions is free to use for open source repositories (i.e. public\
    \ ones) and comes with a number of free minutes for private ones also. This example\
    \ should be adaptable to other platforms like Jenkins or GitLab CI, since the\
    \ concepts are largely the same.\n"
  mdcn: "\n```go\ntype APIQuery struct {\n\tResponse map[string]int64\n}\n\nfunc (a\
    \ *APIQuery) Register(name string, replicas int64) {\n\ta.Response[name] = replicas\n\
    }\n\nfunc (a *APIQuery) Remove(name string) {\n\tdelete(a.Response, name)\n}\n\
    \nfunc (a *APIQuery) QueryFunctions() map[string]int64 {\n\treturn a.Response\n\
    }\n```\n\nAPI 有一个 map，我们将通过 HTTP 请求修改它，请求 /register 和 /remove 端点，传入函数名称和/或副本数量的查询字符串。通常，如果这是生产代码，我们还希望使用锁定机制，以确保对\
    \ map 的安全并发访问。\n\n### exporter.go\n\n```go\npackage main\n\nimport (\n\t\"github.com/prometheus/client_golang/prometheus\"\
    \n)\n\ntype Exporter struct {\n\tServiceReplicasGauge *prometheus.GaugeVec\n\t\
    api                  *APIQuery\n}\n\nfunc NewExporter(api *APIQuery) *Exporter\
    \ {\n\treturn &Exporter{\n\t\tapi: api,\n\t\tServiceReplicasGauge: prometheus.NewGaugeVec(\n\
    \t\t\tprometheus.GaugeOpts{\n\t\t\t\tNamespace: \"gateway\",\n\t\t\t\tName:  \
    \    \"service_count\",\n\t\t\t\tHelp:      \"Current count of replicas for function\"\
    ,\n\t\t\t},\n\t\t\t[]string{\"function_name\"},\n\t\t),\n\t}\n}\n\n// Describe\
    \ is to describe the metrics for Prometheus\nfunc (e *Exporter) Describe(ch chan<-\
    \ *prometheus.Desc) {\n\te.ServiceReplicasGauge.Describe(ch)\n}\n\n// Collect\
    \ exports the values for each metric to Prometheus\nfunc (e *Exporter) Collect(ch\
    \ chan<- prometheus.Metric) {\n\te.ServiceReplicasGauge.Reset()\n\n\tfor serviceName,\
    \ replicas := range e.api.QueryFunctions() {\n\t\te.ServiceReplicasGauge.\n\t\t\
    \tWithLabelValues(serviceName).\n\t\t\tSet(float64(replicas))\n\t}\n\n\te.ServiceReplicasGauge.Collect(ch)\n\
    }\n```\n\n在 Describe 方法中，我们已向 Prometheus 说明了它需要保存数据的所有各种指标。\n\nAfter running `go\
    \ mod init prometheus-collector`:\n\n### main.go\n\n```go\npackage main\n\nimport\
    \ (\n\t\"fmt\"\n\t\"log\"\n\t\"net/http\"\n\t\"strconv\"\n\t\"time\"\n\n\t\"github.com/prometheus/client_golang/prometheus\"\
    \n\t\"github.com/prometheus/client_golang/prometheus/promhttp\"\n)\n\nfunc main()\
    \ {\n\tport := 8080\n\treadTimeout := time.Millisecond * 500\n\twriteTimeout :=\
    \ time.Millisecond * 500\n\n\tmux := http.NewServeMux()\n\tapi := newAPIQuery()\n\
    \n\te := NewExporter(api)\n\tprometheus.MustRegister(e)\n\n\tmux.Handle(\"/metrics\"\
    , promhttp.Handler())\n\tmux.Handle(\"/remove\", http.HandlerFunc(\n\t\tfunc(w\
    \ http.ResponseWriter, r *http.Request) {\n\t\t\tname := r.URL.Query().Get(\"\
    name\")\n\t\t\tapi.Remove(name)\n\t\t}))\n\n\tmux.Handle(\"/register\", http.HandlerFunc(\n\
    \t\tfunc(w http.ResponseWriter, r *http.Request) {\n\t\t\tname := r.URL.Query().Get(\"\
    name\")\n\t\t\treplicasV := r.URL.Query().Get(\"replicas\")\n\t\t\treplicas, _\
    \ := strconv.ParseInt(replicasV, 10, 64)\n\t\t\tapi.Register(name, int64(replicas))\n\
    \t\t\tw.WriteHeader(http.StatusAccepted)\n\t\t}))\n\n\ts := &http.Server{\n\t\t\
    Addr:           fmt.Sprintf(\":%d\", port),\n\t\tReadTimeout:    readTimeout,\n\
    \t\tWriteTimeout:   writeTimeout,\n\t\tMaxHeaderBytes: 1 << 20, // Max header\
    \ of 1MB\n\t\tHandler:        mux,\n\t}\n\tlog.Printf(\"Listening on: %d\", port)\n\
    \ts.ListenAndServe()\n}\n```\n\n在 Collect 方法中，我们重置指标，然后添加 API 响应中存在的所有项目。如果删除了某个项目，则它将不再作为服务指标的一部分导出。\n\
    \n运行示例，你将看不到任何指标，因为我们没有任何内容可导出：\n\n```sh\ngo run . &\n```\n\n```sh\ncurl -s http://127.0.0.1:8080/metrics\
    \ | grep gateway\n```\n\n现在使用 API /register 端点添加三个函数及其副本数：\n\n```sh\ncurl -s \"\
    http://127.0.0.1:8080/register?name=email&replicas=1\"\ncurl -s \"http://127.0.0.1:8080/register?name=payment&replicas=3\"\
    \ncurl -s \"http://127.0.0.1:8080/register?name=scrape&replicas=0\"\n```\n\n再次尝试该端点：\n\
    \n```sh\ncurl -s http://127.0.0.1:8080/metrics | grep gateway\n```\n\n```\n# HELP\
    \ gateway_service_count Current count of replicas for function\n# TYPE gateway_service_count\
    \ gauge\ngateway_service_count{function_name=\"email\"} 1\ngateway_service_count{function_name=\"\
    payment\"} 3\ngateway_service_count{function_name=\"scrape\"} 0\n```\n\n现在删除 email\
    \ 函数的副本，并查看它也永久从服务 /metrics 端点被抓取时返回的值集合中移除。\n\n```sh\ncurl -s \"http://127.0.0.1:8080/remove?name=email\"\
    \n```\n\n```sh\ncurl -s http://127.0.0.1:8080/metrics | grep gateway\n```\n\n\
    ```\n# HELP gateway_service_count Current count of replicas for function\n# TYPE\
    \ gateway_service_count gauge\ngateway_service_count{function_name=\"payment\"\
    } 3\ngateway_service_count{function_name=\"scrape\"} 0\n```\n\n我建议在你拥有动态数据集或从第三方系统获取数据时使用\
    \ Collector 接口，在本例中是从 Kubernetes API 获取。\n\n你可以在 samples/prometheus-collector\
    \ 文件夹中找到完整的代码示例。\n\n## 第 15 章\n\n## 构建和发布 Go 二进制文件\n\n无论你编写的是 CLI 还是 HTTP 服务器，大多数情况下\
    \ Go 代码都可以编译成静态二进制文件，该文件是自包含的，可以在你指定的目标系统上运行。\n\n在之前的章节中我们介绍了交叉编译，此时你应该考虑是否需要针对单一环境，例如\
    \ Windows、Linux 或 MacOS，或多个环境。\n\n### Release-it 示例\n\n[Release-it](https://github.com/release-it/release-it)\
    \ 仓库是一个可通过 GitHub Actions 构建和发布的静态 Go 二进制文件的示例。它使用一个 [Makefile](https://github.com/release-it/release-it/blob/main/Makefile)，因此也可以在其他\
    \ CI 管道中运行，或在你创建新版本时手动运行。\n\nMakefile 具有以下属性，所有这些在之前的章节中都已介绍过：\n\n- 它为多个平台和操作系统构建二进制文件\n\
    - 它将 Commit 和 Version 从 git 注入到最终二进制文件中\n\n```makefile\nVersion := $(shell git\
    \ describe --tags --dirty)\n# Version := \"dev\"\nGitCommit := $(shell git rev-parse\
    \ HEAD)\nLDFLAGS := \"-s -w -X main.Version=$(Version) -X main.GitCommit=$(GitCommit)\"\
    \n\n.PHONY: all\nall: gofmt dist\n\n.PHONY: gofmt\ngofmt:\n\t@test -z $(shell\
    \ gofmt -l ./ | tee /dev/stderr) || (echo \"[WARN] Fix formatting issues with\
    \ 'make fmt'\" && exit 1)\n\n.PHONY: dist\ndist:\n\tmkdir -p bin/\n\tCGO_ENABLED=0\
    \ GOOS=linux go build -mod=vendor -a -ldflags $(LDFLAGS) -o bin/release-it-amd64\n\
    \tCGO_ENABLED=0 GOOS=darwin go build -mod=vendor -a -ldflags $(LDFLAGS) -o bin/release-it-darwin\n\
    \tGOARM=7 GOARCH=arm CGO_ENABLED=0 GOOS=linux go build -mod=vendor -a -ldflags\
    \ $(LDFLAGS) -o bin/release-it-arm\n\tGOARCH=arm64 CGO_ENABLED=0 GOOS=linux go\
    \ build -mod=vendor -a -ldflags $(LDFLAGS) -o bin/release-it-arm64\n\tGOOS=windows\
    \ CGO_ENABLED=0 go build -mod=vendor -a -ldflags $(LDFLAGS) -o bin/release-it.exe\n\
    ```\n\n此外，它还会运行 gofmt 以确保质量。\n\n如果项目中有任何单元测试，我们可以为其添加额外的目标，例如：\n\n```makefile\n\
    .PHONY: gotest\ngotest:\n\tgo test ./...\n```\n\n然后将 all 行更新为 `gofmt gotest dist`，这样就会为我们运行每个任务。\n\
    \n克隆示例并构建它：\n\n```sh\n$ mkdir $GOPATH/src/github.com/alexellis/\n$ cd $GOPATH/src/github.com/alexellis/\n\
    $ git clone https://github.com/alexellis/release-it\n$ cd release-it\n$ make\n\
    ```\n\n默认情况下 make 会尝试运行 all 目标，但你也可以运行 make gofmt，如果你想在提交构建之前测试格式。\n\n你会在 bin/\
    \ 文件夹中找到每个二进制文件，如果它与你的系统匹配的 OS/architecture 对，可以在你的系统上运行，或复制到另一系统上运行。\n\n![](img/0b5c3b498f62579835cf1d543b46de92_121_0.png)\n\
    \nFigure 15.1: GitHub 的发布页面\n\n当你向用户发布二进制文件时，GitHub 的发布功能会很有用，因为它允许你手动或通过自动化上传二进制文件。\n\
    \n### 使用 GitHub Action 发布你的二进制文件\n\nGitHub Actions 对于开源仓库（即公开仓库）免费使用，并且也为私有仓库提供一定数量的免费分钟数。此示例应可适应\
    \ Jenkins 或 GitLab CI 等其他平台，因为概念在很大程度上是相同的。\n\n"
