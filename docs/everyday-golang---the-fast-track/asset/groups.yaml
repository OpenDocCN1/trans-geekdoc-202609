    \        Name:  \"figlet\",\n    }\n\n    bytesOut, err := yaml.Marshal(spec)\n\
    \    if err != nil {\n        panic(err)\n    }\n\n    err = os.WriteFile(\"figlet.yaml\"\
    , bytesOut, os.ModePerm)\n    if err != nil {\n        panic(err)\n    }\n   \
    \ fmt.Printf(\"Wrote: figlet.yaml. OK.\\n\")\n}\n```\n\n试一试：\n\n```\n$ go run\
    \ main.go\n\nWrote: figlet.yaml. OK.\n\n$ cat figlet.yaml\n\nname: figlet\nimage:\
    \ docker.io/functions/figlet:latest\n```\n\n在之前的工作中，我发现通过读取输入文件并使用这个库生成 YAML，我可以非常快速地创建大量\
    \ CI 任务。总的来说，它为我节省了很多时间。\n\n## 合并对象\n\n如果你创建了一个包含许多不同字段的大型 schema，那么最好维护一个示例文件，并允许用户为任何需要自定义的值提供覆盖。\n\
    \n我们在 OpenFaaS 项目中使用了 mergo 库，并且体验很好，不过你也可以找到其他实现类似功能的库。\n\n这种方法适用于你内存中的任何结构体，并非\
    \ YAML 所特有。\n\n为示例创建一个新文件夹：\n\n```\nexport GH_USERNAME=\"alexellis\"\nmkdir -p\
    \ $GOPATH/src/github.com/$GH_USERNAME/merge-objects\ncd $GOPATH/src/github.com/$GH_USERNAME/merge-objects\n\
    ```\n\nAPI 的工作方式如下：\n\n```\nmerged := Spec{}\n```\n\n```\noverrides := Spec{}\n\
    \nerr := mergo.Merge(merged, override, mergo.WithOverride)\nif err != nil {\n\
    \    return merged, err\n}\n```\n\n下面是一个实际示例：\n\n```\npackage main\n\nimport (\n\
    \    \"fmt\"\n    \"github.com/imdario/mergo\"\n    yaml \"gopkg.in/yaml.v2\"\n\
    )\n\n// Paste the struct definitions in here.\n\nfunc main() {\n    base := Spec{\n\
    \        Image: \"docker.io/functions/figlet:latest\",\n        Name:  \"figlet\"\
