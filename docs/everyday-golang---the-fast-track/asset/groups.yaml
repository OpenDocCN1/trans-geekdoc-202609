    \ (e *Exporter) Collect(ch chan<- prometheus.Metric) {\n\n}\n```\n\nThe two important\
    \ methods are “Describe” - which lets Prometheus know what metrics are being exported\
    \ and “Collect” - which is where the actual data is exported. These functions\
    \ are invoked asynchronously by Prometheus, and you don’t need to invoke them\
    \ yourself.\n\nYou just need to register the instance of the Exporter.\n\n```\n\
