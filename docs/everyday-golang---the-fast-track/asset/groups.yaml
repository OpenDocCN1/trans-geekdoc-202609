    \ IDE，但快速且免费。\n\n创建一个文件夹 `first-go`，然后将以下内容保存为 `main.go`：\n\n```\npackage main\n\
    \nfunc main() {\n\n}\n```\n\n现在你有两种运行该程序的方法。\n\n- 1) 运行 `go run main.go`\n- 2)\
