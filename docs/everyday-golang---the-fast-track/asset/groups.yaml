    stage\": \"production\"},\n        Limits:      &FunctionResources{Memory: \"\
    1Gi\", CPU: \"100Mi\"},\n    }\n\n    overrides := []Spec{\n        base,\n  \
    \      production,\n    }\n\n    merged := Spec{}\n    for _, override := range\
    \ overrides {\n        err := mergo.Merge(&merged, override, mergo.WithOverride)\n\
    \        if err != nil {\n            panic(err)\n        }\n    }\n\n    bytesOut,\
    \ err := yaml.Marshal(merged)\n    if err != nil {\n        panic(err)\n    }\n\
    \n    fmt.Printf(\"Merged content:\\n\\n%s\\n\", string(bytesOut))\n}\n```\n\n\
    输出：\n\n```\n$ go run main.go\n\nMerged content:\n\nname: figlet\nimage: docker.io/functions/figlet:latest\n\
