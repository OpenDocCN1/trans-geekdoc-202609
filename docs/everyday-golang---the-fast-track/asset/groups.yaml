    ↪  https://github.com/openfaas/golang-http-template\n\n$ ls ./template/\ngolang-http\
    \      golang-middleware\n```\n\ngolang-http 模板提供请求和响应风格，与托管云函数采用的方法最为相似。\n\n\
    查看 `template/golang-http/function/handler.go` 的内容：\n\n```go\npackage function\n\
    \nimport (\n    \"fmt\"\n    \"net/http\"\n\n    handler \"github.com/openfaas/templates-sdk/go-http\"\
    \n)\n\n// Handle a function invocation\nfunc Handle(req handler.Request) (handler.Response,\
    \ error) {\n    var err error\n\n    message := fmt.Sprintf(\"Body: %s\", string(req.Body))\n\
    \n    return handler.Response{\n        Body:       []byte(message),\n       \
    \ StatusCode: http.StatusOK,\n    }, err\n}\n```\n\n- HTTP 请求体可在 `req.Body` 变量中使用。\n\
    - HTTP 头可在 `req.Headers` 中使用。\n- HTTP 查询字符串、路径和方法也可在 `req.QueryString`、`req.Path`\
    \ 和 `req.Method` 中使用。\n\ngolang-middleware 模板则提供标准的 HTTP 请求处理器：\n\n`template/golang-middleware/function/handler.go`\
    \ 的内容：\n\n```go\npackage function\n\nimport (\n    \"fmt\"\n    \"io\"\n    \"\
    net/http\"\n)\n\nfunc Handle(w http.ResponseWriter, r *http.Request) {\n    var\
    \ input []byte\n\n    if r.Body != nil {\n        defer r.Body.Close()\n\n   \
    \     body, _ := io.ReadAll(r.Body)\n\n        input = body\n    }\n\n    w.WriteHeader(http.StatusOK)\n\
    \    w.Write([]byte(fmt.Sprintf(\"Body: %s\", string(input))))\n}\n```\n\nOpenFaaS\
    \ 和 Cloud Run 都需要容器，因此通常需要 Dockerfile。通过使用模板，Dockerfile 以及所有常见的样板代码（如如何设置 HTTP\
    \ 服务器并在 TCP 端口上开始监听）都被抽象掉了。这些事情仍然会发生，但已从你的工作流程中隐藏起来，无需在每个函数中重复。\n\n## 你的第一个函数\n\
    \n让我们创建一个函数，对你发送给它的任何输入计算 bcrypt 哈希。Bcrypt 通常用于对数据库中存储的密码进行哈希处理。\n\n另请参阅：https://pkg.go.dev/golang.org/x/crypto/bcrypt\n\
