    \ .Attended}}\nIt was a pleasure to see you at the wedding.\n{{- else}}\nIt is\
    \ a shame you couldn't make it to the wedding.\n{{- end}}\n\nBest wishes,\nAlex\n\
    ```\n\nFirst, we need to load the template into memory, then construct a typed\
    \ struct or an inline struct to pass in the values to be placed within the file,\
    \ then we execute it to get the result. .Name will be replaced directly, but .Attended\
    \ is going to cause one of the two following sentences to be added into the letter.\n\
    \n```go\npackage main\n\nimport (\n    \"bytes\"\n    \"fmt\"\n    \"text/template\"\
    \n)\n\nconst letter = `Dear {{.Name}},\n{{if .Attended}}\nIt was a pleasure to\
    \ see you at the wedding.\n{{- else}}\nIt is a shame you couldn't make it to the\
    \ wedding.\n{{- end}}\nBest wishes,\nAlex`\n\nfunc main() {\n```\n\n```go\npeople\
    \ := []struct {\n    Name     string\n    Attended bool\n}{\n    {\n        Name:\
    \     \"Alex\",\n        Attended: true,\n    },\n    {\n        Name:     \"\
    Mick\",\n        Attended: false,\n    },\n}\n\nt := template.Must(template.New(\"\
    letter\").Parse(letter))\n\nfor _, person := range people {\n    buffer := bytes.Buffer{}\n\
    \    err := t.Execute(&buffer, person)\n    if err != nil {\n        panic(err)\n\
    \    }\n    fmt.Printf(\"Letter for %s:\\n\\n%s\\n\", person.Name, buffer.String())\n\
    }\n```\n\nRunning the example we see the following output:\n\n```\n$ go run main.go\n\
    Letter for Alex:\n\nDear Alex,\n\nIt was a pleasure to see you at the wedding.\n\
    Best wishes,\nAlex\n\nLetter for Mick:\n\nDear Mick,\n\nIt is a shame you couldn't\
    \ make it to the wedding.\nBest wishes,\nAlex\n```\n\nWhenever I want to add a\
    \ HTML front-end to an application, I’ll turn to Go templates and embed the HTML\
    \ template files along with the code.\n\n### Advanced templates: ranges and custom\
    \ functions\n\nI use templates with my Sponsors’ Portal in order to list and print\
    \ out all the previous editions of my newsletter.\n\nHere is a snippet of the\
    \ code that prints out the list:\n\n![](img/0b5c3b498f62579835cf1d543b46de92_96_0.png)\n\
    \nFigure 12.1: A list of previous newsletter emails\n\n```\n<div class=\"card\"\
    >\n  <h5 class=\"card-header\">Insiders Updates</h5>\n  <div class=\"card-body\"\
    >\n    <h5 class=\"card-title\">Click on an update below, or use your browser\
    \ to search for topics.</h5>\n    <ul>\n      <!-- Be a good person, and do not\
    \ scrape this HTML -->\n      {{ range $in, $el:= .Updates }}\n        {{ if ($.Updates.YearBreak\
    \ $in) }}\n        </ul>\n        <p><b>{{ $el.Date.Year }}</b></p>\n        <ul>\n\
    \        {{ end }}\n        <li id=\"{{ $el.ID }}\"><a href=\"{{ $.Path \"/update\"\
    \ }}?id={{ $el.ID }}\">{{ $el.Description }}</a></li>\n      {{ end }}\n    </ul>\n\
    \  </div>\n</div>\n```\n\nIn the example I used the range keyword to iterate around\
    \ the Updates slice, which contains a number of Update structs.\n\nThings then\
    \ get slightly more involved because I wanted to break the list according to the\
    \ year of the post, so that they would be broken up into blocks or groups.\n\n\
    On the line {{ if ($.Updates.YearBreak $in) }} you can see that I call a function\
    \ to determine when to break the line. The simplest way to add custom functions\
    \ to templates is to add functions to the type being accessed in the template.\n\
    \n```go\n// Update represents an InsidersUpdate stored as a Gist\ntype Update\
    \ struct {\n    ID          string    `json:\"id,omitempty\"`\n    Description\
    \ string    `json:\"description,omitempty\"`\n    Date        time.Time `json:\"\
    date,omitempty\"`\n    MarkdownURL string    `json:\"markdownUrl,omitempty\"`\n\
    \    HTMLURL     string    `json:\"htmlUrl,omitempty\"`\n}\n\ntype Updates []Update\n\
    \n// YearBreak returns whether the previous item was in\n// another year\nfunc\
    \ (u Updates) YearBreak(i int) bool {\n    if i == 0 {\n        return true\n\
    \    }\n\n    return u[i-1].Date.Year() != u[i].Date.Year()\n}\n```\n\nBy checking\
    \ the index of the current item, and the previous one, we can determine whether\
    \ we are at a breakpoint in the list of years and emails.\n\n### Real-world templates\
    \ - arkade\n\nA final example I'll share is the arkade project, where templates\
    \ were useful for determining which version of a CLI to download.\n\nIf there\
    \ was a convention that all maintainers and vendors used for CLI naming then we\
    \ would only need one template for all downloads, however that's anything but\
    \ the case.\n\nYou may be wondering why these templates are compiled into the\
    \ Go binary? The Tool struct could be Marshaled into a JSON file for dynamic updates,\
    \ but having everything in one place, and being able to unit test quickly seems\
    \ to be working for us.\n\n```\ntools = append(tools,\nTool{\nOwner:      \"inlets\"\
    ,\nRepo:       \"inlets-pro\",\nName:       \"inlets-pro\",\nDescription: \"Cloud\
    \ Native Tunnel for HTTP and TCP traffic.\",\nBinaryTemplate: `{{ if HasPrefix\
    \ .OS \"ming\" -}}\n{{.Name}}.exe\n{{- else if eq .OS \"darwin\" -}}\n{{.Name}}-darwin\n\
    {{- else if eq .Arch \"armv6l\" -}}\n{{.Name}}-armhf\n{{- else if eq .Arch \"\
    armv7l\" -}}\n{{.Name}}-armhf\n{{- else if eq .Arch \"aarch64\" -}}\n```\n"
