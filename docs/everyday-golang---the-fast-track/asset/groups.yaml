    mkdir -p $GOPATH/src/github.com/$GH_USERNAME/validate-hmac/

    cd $GOPATH/src/github.com/$GH_USERNAME/validate-hmac/


    go mod init

    go: creating new go.mod: module github.com/alexellis/validate-hmac

    ```


