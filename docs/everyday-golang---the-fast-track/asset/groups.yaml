  - "[PAGE 33]\n\nFrom my experiences in the world of enterprise development - the\
    \ average C# developer would have written his own string parser and then created\
    \ a ConsoleApp as an entry-point then a DLL Library for the parsing and one more\
    \ for the application code.\n\nWhen you contrast that to the snippet above, Go\
    \ is unpretentious. You can have a single file that compiles to a tiny binary\
    \ and only uses the standard library. And be done with that.\n\nI suggest you\
    \ start with the `flags` package with each new CLI, and when you reach its limits,\
    \ only then consider migrating to something more modular like Cobra.\n\nCobra\
    \ is used by Docker, Kubernetes and the OpenFaaS projects and means that handlers/commands\
    \ can live in separate files or modules. It also makes documenting each command\
    \ really simple. Checkout the code here for our ‘list functions’ command.\n\n\
    Another advantage of using “cobra” is that it has a verb noun syntax. This helped\
    \ us when designing our user experience. We went from a somewhat jarring experience\
    \ to something more fluid:\n\n```\n```text\nfaas-cli -deploy \\\n    -image=functions/alpine\
    \ \\\n    -name=cat \\\n    -fprocess=/bin/cat\n```\n```\n\nTo:\n\n```\n```text\n\
    faas-cli deploy \\\n    --image=functions/alpine \\\n    --name=cat \\\n    --fprocess=/bin/cat\n\
    ```\n```\n\nThe -deploy flag, became a sub-command called deploy and allowed us\
    \ to move the code into its own package. Cobra handles the parsing and help messages\
    \ for all the sub-commands you want to add.\n\nWe also took feedback about managing\
    \ multiple functions and created a YAML format which meant the CLI command could\
    \ be as simple as:\n\n```\n```text\nfaas deploy -f stack.yml\n```\n```\n\nOr\n\
    \n```\n```text\nfaas deploy -f \\\n    https://raw.githubusercontent.com/openfaas/faas-cli/master/stack.yml\n\
    ```\n```\n\n> Tip: pick verbs / commands carefully and ask other people if they\
    \ make sense. If something jars with you then it’s probably wrong. It can take\
    \ several iterations but what you’re aiming for is an intuitive experience.\n\n\
    # Automate everything\n\nCreate an automated build using a free and public CI\
    \ platform like GitHub Actions so that contributors or collaborators know whether\
    \ their changes can be integrated.\n\nUse GitHub releases to track changes in\
    \ the project and milestones. You can set up a post-build action in GitHub to\
    \ publish binary artifacts automatically for every platform you target.\n\nIf\
    \ you have a Docker image - publish that on the Docker store at the same time\
    \ as pushing a new release artifact. Tools like GitHub can obfuscate credentials\
    \ and keys so that they do not show up in logs.\n\nGo projects are very easy to\
    \ build in Docker. Here’s an example from the inlets-operator, a Kubernetes controller\
    \ which creates tunnel servers for Kubernetes services you want to expose in a\
    \ private cluster:\n\n+   - Dockerfile inlets-operator\n\nMake sure you use multi-stage\
    \ builds so you ship a lean image."
  - "[PAGE 34]\n\nFor the various projects I maintain, we tend to split the build\
    \ into a “CI” or “test” action:\n\n+   - ci-only.yaml for the inlets-operator\n\
    \nAnd a publish action:\n\n+   - publish.yaml for the inlets-operator\n\nWhile\
    \ it’s easy to start with - you do not want to be building 3-5 binary files on\
    \ your own machine for every release then uploading them to a web-form every time\
    \ you need an update.\n\n# Integrate with package managers\n\nIf you want to make\
    \ it easy for your target audience to be able to get hold of your CLI then you\
    \ need to make that as easy as possible. This means integrating with package managers.\n\
    \n+   - brew - if your target audience is the developer - then a large percentage\
    \ of them may have a Mac. brew is a package manage which means most CLIs are only\
    \ one command away brew install faas for instance\n+   - Linux - for Linux there\
    \ are many package managers so I've chosen to build a download utility which can\
    \ be run as root or as a regular user. To get the OpenFaaS CLI: curl -sL https://cli.openfaas.com\
    \ | sh - or to get hold of Docker: curl -sL https://get.docker.com | sh.\n+  \
    \ - Windows - Windows users have good options available for shells including Git\
    \ Bash (my preferred option) and the Windows Subsystem for Linux. WSL can use\
    \ the Linux curl utility, but if you are targeting “point and click” developers\
    \ you may want to create a “double-click” installer.\n\nWhatever you do - make\
    \ sure it’s automated and evaluate each package manager you support. Will you\
    \ have time to maintain the integration? Is it provided by the project or by the\
    \ community? What if it breaks? For instance - we maintain a guide on how to upgrade\
    \ our brew formula.\n\nTip: Make sure the update/release cycle of chosen packages\
    \ can match the cadence of your project. Whilst package managers are seen as a\
    \ best practice, the versions of applications you’ll find there can get out of\
    \ date very quickly. Direct downloads over HTTPS using your GitHub project’s release\
    \ page is probably the easiest and most convenient approach.\n\nYou can also offer\
    \ an auto-update or a help message to show users how to keep up to date. Here’s\
    \ an example from inletsctl, an open source tool for creating ad-hoc tunnel servers.\n\
    \n```\ninletsctl update\nYou can update inletsctl with the following:\n\n# For\
    \ Linux/MacOS:\ncurl -sLfs https://inletsctl.inlets.dev | sudo sh\n\n# For Windows\
    \ (using Git Bash)\ncurl -sLfs https://inletsctl.inlets.dev | sh\n\n# Or download\
    \ from GitHub: https://github.com/inlets/inletsctl/releases\n\nThanks for using\
    \ inletsctl!\n```\n\nThe faas-cli has code that can inform you whether your version\
    \ is out of date, feel free to browse the repository to see how it works.\n\n\
    ```\nfaas-cli version\n___       ____   ____\n/ _ \\ ___ / ___| |  _ \\ \n| |\
    \ | / _ \\___ \\ | | | |\n| |_| | (_) |__) || |_| |\n \\___/ \\___/____/ |____/\n\
    \n```"
