  \ 的股票价格\ndf = pd.read_csv('historical_prices.csv', parse_dates=['Date'])\ndf.set_index('Date',\
  \ inplace=True)\n\n# 计算移动平均线\ndf['MA_30'] = df['Close'].rolling(window=30).mean()\n\
  df['MA_90'] = df['Close'].rolling(window=90).mean()\n\n# 设置 Seaborn 绘图风格\nsns.set_style('whitegrid')\n\
