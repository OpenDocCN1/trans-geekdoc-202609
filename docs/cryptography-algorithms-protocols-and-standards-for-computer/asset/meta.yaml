- - '##'
  - 解释如果攻击者已知两对明文-密文对 $(M_1, C_1)$ 和 $(M_2, C_2)$，满足 $M_2 = \overline{M_1}$, $C_2
    = \overline{C_1}$，$C_1 = E(K, M_1)$, $C_2 = E(K, M_2)$，如何利用 `DES` 的补码性质将对 `DES`
    密钥进行暴力破解的计算减少大约 2 倍。假设只有加密和解密操作是耗时的。
