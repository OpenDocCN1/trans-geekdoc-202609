  \ of disillusionment）是盖特纳技术炒作周期中的一个阶段，这是 20 世纪 80 年代中期开发的一种概念，用于阐述新技术在为企业产生主流价值的过程中所经历的共同阶段。技术炒作周期的阶段包括：创新触发期，新技术出现时；预期膨胀高峰，被炒作的技术在市场讨论中达到顶点时；幻灭谷，早期实验的结果产生失望，企业对该技术产生怀疑；启蒙期，企业找到了技术的有效用途；以及最后，生产成熟期，技术在此期间实现了其潜力。要进一步了解炒作周期以及如何使用它，请参见\
