  \nZappos，174–175, 185\n\n零知识证明，110\n\n津巴韦，76\n\nZipcar，159\n\n\n\n\n\n## 智能合约\n\
  `smart contract`（智能合约）是一种通常运行在区块链上的计算机程序或协议。该程序促进、验证或执行由事件、链上交易或其他智能合约交互触发的业务流程。智能合约是传统合同流程的数字化和自主表示，包括合同的形成、具有执行力且不可篡改的权利义务的创建，以及履的执行。\n\
  \n## 主权身份 (SSI)\n主权身份（SSI）允许个人或组织拥有自己的数字和非数字身份，并明确同意与他人共享该身份以参与商业交易。由身份信任织物支持的去中心化身份服务能够以加密方式不可篡改地存储身份证明及其个人资料属性。随后，组织、个人或物品可以根据交互需要，提取并共享该身份记录的部分或全部。通过这种方式，SSI\
  \ 为想要根据每次交互共享数据或 ID 的个人或组织增加了安全性和灵活性。\n\n## 去中心化自治组织 (DAO)\n去中心化自治组织（DAO）是一种数字实体，可以在没有传统人工管理的情况下，与其他数字代理和公司实体进行业务交互。DAO\
  \ 依赖智能合约来管理和执行交互。根据定义，DAO 独立运行，可以跨越多个地理和法律管辖区以及机构边界。\n\n## 边缘计算与量子计算\n边缘计算描述了一种分布式计算环境，其中数据处理发生在产生或消费数据的物体或人员附近。其目标是通过保持不必要的流量远离网络中心来减少延迟。边缘计算还为感兴趣的对等节点之间的互连建立了本地枢纽。量子计算是一种计算的高级形式，通过量子力学的各个方面（包括叠加和纠缠）对数据进行操作。量子计算可以显著提高计算的效率和速度。参见\
  \ Wikipedia，s.v. “quantum computer,”最后修改于 2018 年 2 月 12 日；以及 Neil Gershenfeld 和\
  \ Isaac L. Chuang，“Quantum Computing with Molecules,”Scientific American, 1998 年\
  \ 6 月,66–71。\n\n## 物联网 (IoT)\n我们使用 `things`（事物）一词来描述计算机化和联网的机器。在今天的物联网（IoT）中，这些机器的功能主要是采集其嵌入的设备或环境的数据，并将其传输到中央存储。随着联网事物变得越来越智能——随着它们嵌入了\
  \ if-then 算法，最终嵌入了更复杂的 AI 形式——它们将能够购买、出售和请求服务。这种复杂性的增加将为收入、效率和客户关系管理开启新机会。智能事物代表了组织可以向其销售以及政府可以征税的新客户。人类已经使某些事物能够进行、购买和出售。\n\
  \n## Gartner 定义\nGartner 将 `smart contract` 定义为通常运行在基于区块链的技术平台上的计算机程序或协议。这些业务流程可能由事件、链上和链下交易或其他智能合约的交互触发。业务规则定义在智能合约中，它通过允许在没有第三方的情况下执行交易来自动执行规则，使智能合约能够自我执行。`technology\
  \ stack`（技术栈）是创建和支持应用程序时使用的系统软件组件和工具的组合。它包括相关程序、运行时环境、框架和编程语言。\n\n## 比特币挖矿\n比特币挖掘是一种计算过程，通过分布式共识在区块链上对交易进行身份验证、验证和保护。矿工通过解决名为中本共识或工作量证明的计算问题来完成此任务。作为对他们所使用的电力和计算资源的奖励，矿工从网络诞生之初创建的包含\
  \ 2100 万个比特币的代币池中获得比特币。这些代币随后可用于比特币生态系统中的其他用途。\n\n## 节点与共识\n并不是在区块链上进行交易的个人或实体都运行节点；例如，一个人可以拥有比特币或任何其他代币而不运行节点。然而，只有节点才能维护和更新账本副本。区块链使用了许多共识算法。其中一些常见的算法包括工作量证明、状态证明、权重证明和拜占庭容错。每种算法的操作方式略有不同，取决于所属区块链的用途。\n\
  \n## 零知识证明\n零知识证明是一种消息协议，允许个人和企业在不传输信息或与整个网络共享信息的情况下，确认与其相关的数据是正确的。这些证明为对点网络中的参与者提供了一种替代方法，进行交易和价值交换，无需暴露不想让未知参与者看到的专有数据——即使这些信息是伪名的。\n\
  \n## 智能城市\nGartner 将 `smart city` 定义为一种城市治理生命周期方法，旨在改善公民的生活、刺激经济并保护环境。策略的开发及其执行由一组公共部门和公民利益相关者驱动。他们通过数据和分析定义并衡量技术的影响，以创建以用户为中心且情境化的体验。参见\
  \ Bettina Tratz-Ryan 和 Bill Finnerty，“Hype Cycle for Smart City Technologies and\
  \ Solutions,”Gartner Research Note G00340460 (Gartner, August 1, 2018)。\n\n## 数字孪生\n\
  数字孪生是现实世界实体或系统的数字化表示。尽管使用软件构建，但数字孪生镜像了它们所代表的对象或空间的特征，因此当物体变化时，孪生也随之变化。数字孪生可能包含有关事件（例如传感器读取值或位置变化）、物体当前状态以及历史参考数据。它还可能包含与其持有数据相关的创建、读取、更新、删除或执行计算（包括分析）相关的编程逻辑。\n\
  \n## 双模策略\n双模（Bimodal）是管理两种独立但协调的工作风格的实践：一种侧重于可预测性，另一种侧重于探索。可预测模式针对更具预测性且更易的领域进行了优化。它专注于利用已知知识，同时为数字世界重组遗留环境。另一种模式是探索性的，通过实验解决新问题，并针对不确定性领域进行了优化。探索性计划通常从一个假设开始，并进行迭代测试和调整，可能采用最小可行性产品方法。两种模式对于创造巨大的价值和推动重大组织变革都至关重要，且没有任何方法是静态的。产品和技术更具预测性的演进（第一种模式）与新的创新（第二种模式）相结合，是企业双模能力和数字化转型的精髓。\n\
  \n\n\n\n\n去中心化应用（或 `dapp`）是包含执行协议代码并包含智能合约的应用程序的总称。但与智能合约不同，dapp 在流动的参与者集合（而非固定数量）之间执行交易，且不一定涉及财务义务。去中心化应用分为三类：价值类应用；治理、规则、投票等治理类应用；以及流程类应用（例如，合约结算）。\n\
  \nWWL（世界范围账本）是一个由相互交互和重叠的区块链组成的网络，可以根据需要独立使用（例如，医疗保健提供者对患者的视图）或结合使用（例如，患者可以跨多个医疗保健提供者查看其医疗记录）。详见\
  \ Homan Farahmand, David Furlonger, and Rajesh Kandaswamy，“Crypto-Politics and ‘World\
  \ Wide Ledger’ Will Rock your Business Competition,” Research Note G00355775 (Gartner,\
  \ September 17, 2018)。\n"
