- "# 区块链的真实业务：领导者如何在数字时代创造价值\n\n\n\n![cover.jpg](img/cover.jpg)\n![titlepage](img/title.jpg)\n\
  \n\n\n\n\n\n\n\n\n\n*献给 Brigette 和 Wing，她们让这本书变得更好，正如她们对待生活中的其他事情一样*\n\n前言\n\n\n\
  \n\n\n2019 年 1 月 3 日是首次区块链交易十周年。在该交易发生的几天后，我们就开始与企业高管讨论区块链创造数字机会的潜力。到目前，这些对话已多达数千年。我们也听过数百个技术供应商推销他们对技术的观点。这些互动让我们清楚，像你这样的资深管理人员正面临着艰难的选择。\n\
  \n你们中，刚刚开始探索区块链的人可能会觉得这项技术非常专业且复杂，属于技术专家的领域。你可能难以发现它与你和你的业务职能有何关联，因此缺乏从观察者转变为实验者的动力。你们中的另一些人可能是区块链的老兵，早在多年前就信服了这项技术以及它带来世界和平、消除饥饿的承诺。你可能对十年后的今天这些承诺仍未实现而感到失望。\n\
  \n无论你对这项颠覆性技术的经验如何，请理解，区块链的承诺——即提供一种与世界上任何人都或任何事物以任何交易规模进行业务往来且无需中间机构的方法——比以往任何时候都更加强大。问题不在于它是否会实现，而是何时实现。\n\
  \n我们写这本书是为了为你提供这些信息，以及它能够实现的功能。在此基础上，我们为你提供了做出明智决策所需的战略工具、视野和信心。简而言之，我们写这本书是为企业高管和政策制定者提供帮助，协助他们拨开迷雾，关注区块链可能解锁的核心价值主张。\n\
  \n以下是我们在研究这本书时与之交流过的一些机构：\n\n*   澳大利亚证券交易所 (`ASX`) 和托管信托与清算公司 (`DTCC`) 正在开发区块链平台，以使用于资产清算和结算的机制实现现代化。\n\
  *   台北医学大学医院正在开发一种区块链解决方案，以便在患者同意的情况下，促进跨机构访问患者记录。\n\n\n\n\n\n*   欧洲足球总协会（UEFA）作为冠军联赛和欧洲杯足球赛事的组织者，正与\
  \ IT 解决方案提供商 ELCA 合作开发区块链解决方案，以防止欺诈和价格欺诈——这是二级市场门票销售的主要问题——并维持赛事场场所的安全监管。\n*   大众汽车（Volkswagen）和雷诺（Renault）正分别使用区块链创建一种不可篡改的“护照”，记录车辆历史和维护记录，以防止里程表篡改和其他高昂的欺诈形式。\n\
  *   美国德克萨斯州奥斯市正在建立一套身份系统，以帮助无家者获得医疗保健和其他服务。\n\n对区块链的预期是有根据的。通过与高盛（Gartner）的同事共同研究，我们估计到\
  \ 2030 年，区块链可能会产生高达 3.1 万亿美元的新业务价值，其中一半将在 2025 年前实现，这些应用旨在改进运营效率。¹\n\n然而，这些回报并非免费。我们写此这本书的目标之一是实证关于区块链的声明，明确哪些是真实的，哪些是虚假的，并帮助作为业务领导者的你理解必须做什么才能确保获得你的价值份额。基于此，我们想强调，企业今天讨论和使用区块链的方式只是第一步。除了运营改进和提高效率，完全成熟的区块链解决方案将允许你重新设计业务关系、将非流动资产变现，并重新重新分配现有的数据和价值流，这些方式可能会重塑你的业务参与数字世界的方式。这才是区块链*真正*的业务。\n\
  \n为了描述你如何开始解锁你自己的这部分价值，我们将首先澄清区块链是什么，以及它可以让你实现哪些其他技术无法实现的功能。\n\n## 区块链的五个核心要素\n\n\
  从形式上讲，区块链是一种数字机制，用于创建一个分布式数字账本，点对点网络中的两个或多个参与者可以直接交换信息和资产，而无需受信任的中间人。区块链验证参与者的身份，并验证他们拥有想要交换的资产，以及交易可以进行。区块链在数字账本上记录与交易相关的信息，网络中的每个参与者都独立持有并更新账本的副本。记录是不可更改的、带有时间戳的、加密的并以块的形式相互链接；每个块是由约两千条交易记录组成的簇。²\
  \ 账本随着参与者的交易而增长。³\n\n但从通俗上讲，这个定义意味着什么？它意味着理论上你可以与位于地球上任何位置的未知伙伴进行业务，以任何交易规模交易任何资产，而不需要律师、银行、保险公司或其他任何中间人来确保你们双方都履行了所承诺。这种解决方案极大地扩展了业务可以交易的资产范围。这种安排还极大地增加了业务可以直接交易的对象或实体，而不需要第三方（第三方会分走一部分价值）。\n\
  \n区块链将现有技术和手段整合成一种新架构，由五个要素组成（图 1-1）：⁴\n\n1.  **分布式 (Distribution)**。区块链参与者在物理上彼此分离并连接在网络上。每个运行完整\
  \ `node` 的参与者都维护账本的完整副本，账本随新交易的发生而更新。节点是参与者拥有或使用的机器，并配备了运行下述共识算法的功能。⁵ 任何参与者都可以查阅账本的任何部分，但在规定情况外无法更改它。\n\
  2.  **加密 (Encryption)**。区块链使用公钥和私钥等技术以安全且半匿名的方式在块中记录数据（参与者使用伪名）。参与者可以控制自己的个人身份和其他信息，并仅共享交易中需要的内容。⁶\n\
  3.  **不可篡改性 (Immutability)**。区块链上的完成交易是经过加密签名的、带有时间戳的并按顺序添加到账本中的。除非参与者达成，否则记录不会被损坏或更改。这种协议被称为\
  \ `fork`（分叉）。⁷](../../Text/notes.html#ch1-en7)\n4.  **代币化 (Tokenization)**。区块链上的交易和其他交互涉及价值的安全交换。价值以代币的形式出现。⁸\
  \ 数字市场通过代币化运行得更有效。代币可以作为物理资产的数字表示，作为激励网络参与者的机制，或者为了创建和交换新形式的价值。它们还允许私人企业参与者控制自己的数据。\n\
  5.  **去中心化 (Decentralization)**。网络信息和运行规则由多台计算机（即 `node`）维护。在实践中，去中心化意味着没有单一实体控制所有计算机或信息或规则。每个节点都维护一份相同的副本。由每个节点运行的共识机制验证并批准交易。a\
  \ 这种去中心化的、共识驱动的结构消除了对中央权威的需求，并作为防止欺诈和错误交易的安全措施。\n\n\n* *\n\n区块链的五个要素\n\n![image](img/Figure_1.01.png)\n\
  \n* *\n\n区块链的五个核心要素共同允许不熟悉的双方能够在数字环境中安全互动。我们坚持这五个要素并非语义问题。当区块链缺少其中一个或多个要素时，其价值就会受到限制甚至被抵消。\n\
  \n然而，对于这一主题存在相反的观点。新技术通常会经历一个机会主义者试图以模糊或符合自身利益的方式定义市场的时期。用“数据库”一词来描述区块链就是这种例子。区块链*不是*数据库。尽管供应商有时错误地将其描述为数据库，但该机制有几个关键区别。例如，与数据库不同，区块链不是通用信息库。此外，区块链是不可篡改的；它不像数据库那样被读取、写入、删除和更改。最重要的是，虽然数据库可以分发给自己，但只有一个中央管理员控制它。在区块链中，管理是通过共识实现的。⁹\
  \ 中央控制与区块链的核心理念是矛盾的。\n\n在其他背景下我们也看到了误导性语言。供应商为了推销使用某些区块链支持技术和部分区块链设计元素的软件包或服务，充斥着“区块链洗白”（blockchain\
  \ washing）。同样，一些精通技术的公司正在实施他们称为“区块链”的解决方案，并要求供应链合作伙伴与之整合，以此作为将合作伙伴更深地嵌入其生态系统的一种方式。\n\
  \n\n\n\n另一个简单的现实是，区块链技术尚不成熟，机构还不知道如何使用它或从中提取价值。因此，许多机构仅对他们理解并具备管理技能的元素进行实验。结果，目前开发的大多数所谓的区块链解决方案（我们在本章开头列出了其中几个）仅使用了区块链五个要素中的部分元素。这些公司可能根本不需要区块链来实现相同的目的。根据我们的研究，在\
  \ 85% 的此类项目中，传统数据架构的表现与区块链相当，甚至更优。\n\n## 区块链如何为您的业务释放价值\n\n我们无法低估区块链可能开启的新商业活动量。为了对这种机会有一个直观感受，请考虑今天移动设备、GPS、放置在物理环境中的物联网（IoT）传感器，以及数十种其他使能设备产生的数据量，这些设备使数字和物理资产在网络环境中变得可见。这一设备网络规模大到令人难以想象，它每天产生超过\
  \ 255 万亿字节的数据[``../Text/notes.html#ch1-en10`]。像你这样的领导者希望为公司这些新数据资产变现，并与意向的买家进行交易。\n\
  \n但你赖以执行商业交易和管理风险的中心化基础设施——支付系统、保险、交付和物流服务以及法律合同——并不是为了处理当今通过数字或数字化资产所实现的各种机器对机器交易而设计的。数字交易不像模拟世界中的交易那样有最小尺寸限制。数据单元、加密货币、奖励积分和资产碎片（而非整体）只是数字化使得单体可交易的价值的几种新形式。单体来看，这些单位的价值可能低于\
  \ `$0.01`，但它们可以以百万或数万亿的单位进行交易。这些数字资产蓬勃发展的贸易是一项大生意，在我们撰写这本书时正处于爆炸式增长。亚马逊拥有一项流媒体数据市场的专利[``../Text/notes.html#ch1-en11`]。游戏等数字行业正在接受游戏内购买的微交易。新的市场每天都在形成，用于交易数据、单瓦特能量、碳信贷和其他以数字表示的资产。2017\
  \ 年爆发的加密货币和代币发行（ICO）热潮——随后经历了深度崩盘和向监管移动的趋势——并未抑制人们尝试金融的热情。这种热情预示着由区块链支持的代币驱动业务模式正走向主流，用以融资并捕捉数字机会。\n\
  \n建立信任、身份和支付的传统中心化机制并非为了在分布式以机器为中心的环境中自主处理这些数以万亿计的微交易——它们确实无法处理，更无法安全且高效地处理。企业需要一种不同的方法来处理新的数字资产和交互，而不引入一个可以收集交易中每一方数据并从中抽取部分价值的中介。你需要区块链。\n\
  \n区块链还可以重定向`existing`现有的价值流。它是通过减少中心市场力量（包括大型跨国公司、数字平台和大型中介）对四种业务货币的控制来实现的。这些业务货币是：数据、访问、技术和合同。我们在书中多处回顾了它们。目前只需说明数据是锚点货币，因为客户会留下数据足迹，就像汉塞尔和他的面包屑一样。强大的市场中介如大型零售商、金融服务公司,[此处文本截断，根据原文逻辑继续排版]\n\
  \n## 超越炒作\n\n创造新价值和释放现有流量的潜力使区块链成为可用最具革命性的技术之一。但从企业的角度来看，区块链目前仍处于早期且不断演变的阶段。它尚未在硬化的业务背景下证明自己，其某些元素——特别是去中心化和代币化——激进程度足以让业务领导者停下思考。更复杂的应用将通过实验和技术的不断成熟而到来。\n\
  \n与此同时，市场上充斥着大量矛盾的信息。一方面，许多观察者赞誉区块链是解决一系列不可能问题的`the`解决方案。另一方面，我们听到一些企业的轶事，他们启动了区块链试点，但未能将其转化为运营部署，导致成本节约或价值有限。将不切实际的预期、现实失望与\
  \ 2018 年的加密货币崩盘相结合，就得到了我们从 2016 年起一直在预测的内容。用高德的术语来说，区块链正在走向“幻灭之谷”，或者通俗地说，即“区块链寒冬”[``../Text/notes.html#ch1-en12`]。\n\
  \n处于区块链演变阶段的技术被推捧一段时间，然后经历几乎完全的反弹，这是正常的，在此期间人们会将高预期斥为为炒作。对于具有解决广泛复杂问题或创造巨大价值潜力的技术，这种反弹可能尤为剧烈。我们看到\
  \ 2001 年的互联网危机以及近期企业在数字化转型方面面临的挑战中也出现了类似的热情低落[``../Text/notes.html#ch1-en13`]。\n\
  \n然而，区块链不可避免地滑入谷底并不意味着你应该少使用这项技术。相反，你现在会想用它做更多事情。幻灭之谷之后是生产力平台；寒冬之后，是春天。\n\n\n\n\
  区块链将从今天的早期应用演变，以实现其全部潜力，支持广泛的新型数字交易。我们创建了高特区块链光谱（`图 1-2`）来阐说明其演进路径：从 2000 年代后期（许多区块链赋能技术进入主流视野）到如今仅使用少数几个元素的解决方案，再到区块链实现微型交易和解锁数字价值流的长期潜力。该光谱反映了包括我们的数百位客户在内的组织在参与区块链技术和设计原则的现实开发与应用中所积累的经验。我们以该光谱作为本书的指导框架，揭示了区块链将如何从现状演变为\
  \ 2030 年的样貌。如图所示，我们预计这一演变将分三个阶段展开。\n\n\n![高特光谱](img/Figure_1.png)\n\n\n区块链的第一阶段在\
  \ 2012 年后开始发力，当时业务领袖开始探索这项技术。我们预计这一阶段将持续到整个 2020 年代。区块链启发型解决方案仅使用三个元素——`distribution`（分发）、`encryption`（加密）和\
  \ `immutability`（不可篡改）。高知名案例包括开发了产品追踪解决方案的 `Alibaba`，以及全球航运公司 `Maersk`（马士基启动了名为\
  \ `TradeLens` 的解决方案）。\n\n区块链启发型解决方案专注于三个元素有几个原因：技术的成熟度、企业采用的准备以及实施的难易程度。虽然尚未立即普及，但许多首席信息官\
  \ (`CIO`) 表示他们正在尝试区块链，我们预计到 2025 年将出现更大规模。\n\n挑战不仅是技术性的。要从区块链启发型解决方案中受益，组织必须接受 `decentralization`（去中心化），并确保没有中央供应商可以拥有或控制数据。去中心化还允许参与者查看、追踪并记录谁查看以及谁使用了数据。\n\
  \n\n区块链完整型解决方案交付区块链的全价值主张。代币化（Tokenization）允许您创建并代表非流动性资产。去中心化确保了用户、资产和交易经过认证。通过部署所有五个元素——`distribution`、`encryption`、`immutability`、`tokenization`\
  \ 和 `decentralization`——区块链完整型解决方案实现了新形式价值的交易。\n\n虽然目前少数主流企业或政府正在构建区块链型解决方案，但许多初创公司正在这样做。这些解决方案的泛滥将推动组织探索具有更高去中心化的新运营方式。\n\
  \n\n2025 年后的某个时候，诸如 `IoT`、人工智能 (`AI`) 和去中心化主权身份 (`SSI`) 解决方案等补充技术将汇聚并与区块链网络更加深度集成。由此产生的增强型区块链解决方案将扩展可以代币化和交换的价值类型，并通过\
  \ `smart contracts`（智能合约）实现更多的小额交易。\n\n基于这些能力，新的市场将会出现，以使此前无法变现或非流动性的资产变现，例如知识产权\
  \ (`IP`)、数据、物理对象以及其他高量价值资产。\n\n去中心化主权身份解决方案将为增强型区块链网络带来特殊收益。这些技术允许参与者在数字钱包或其他存储机制中保护其个人数据，并根据为此设立的规则进行共享。当与\
  \ `AI` 结合时，`SSI` 会动态执行数据所有者建立的规则，并在数据共享或使用之前自动要求获得所有者的同意。\n\n\n\n随着增强型区块链解决方案带来新的价值形式，企业也将利用去中心化的运营结构来创新的业务模式。组织在技术上将能够将经济决策权委托给“事物”，这些“事物”将根据在区块链上的智能合约定义的条款进行自主运行。这些增强型事物可以将人类从交易中剔除，并最终推动区块链网络走向完全自主的交易，并最终建立去中心化自治组织（DAO）。^d\n\
  \n盖特的区块链光谱阐述了区块链的采用如何随时间演进，并将去中心化作为一种设计元素。这种演进将为您的行业和组织数字化创造一条新路径。\n\n\n随着区块链——以及业务——的演进，关乎利益的是您参与一个公平且易于获取的数字化驱动世界经济和社会的能力。在这样的环境中，多样化的企业、个人和“事物”将根据自己的条款进行互动、运营、获利并创造价值。这个世界并非必然的结论。\n\
  \n图 1-3 展示了当今日益技术支持的世界中的方向性选择。`y`轴代表演进中的数字化能力环境，从 Web 赋能到完全可编程。`完全可编程`意味着智能事物或自主代理已获得法律权限，可以做出独立决策以生产或消费资产。用一个简单的例子来说明，可编程建筑中的传感器可以决定房间照明系统所需的能量量，然后可以从管理邻居屋顶安装的微风力发电机的传感器处“购买”必要的能量。在完全可编程的环境中，这些价值交换可以在人类参与或不参与的情况下发生。`y`轴是不依赖区块链的。随着物联网、AI\
  \ 以及边缘和量子等先进计算范式变得更加占主地位，无论是否有区块链技术，业务和社会都将变得更加可编程。^e\n\n\n* *\n\n 规划数字化能力和去中心化程度\n\
  \n![image](img/Figure_1.03.png)\n\n* * *\n\n`x`轴代表了从治理结构的完全中心化到完全去中心化的连续体。连续体的概念至关重要，因为去中心化本身是一个动态状态——即使在区块链中也是如此。某些行业和相应的业务由于其结构的功能目前是高度中心化的。其他业务则天生更加碎片化。即使存在这种差异，沿`x`轴的任何重大移动都依赖于区块链，因为想要数字化转型并在去中心化治理下运行的组织*需要*区块链或其他形式的数字账本技术，以允许所有经济参与者（包括自主的“事物”）相互交易并获得相应的经济回报。只有*由区块链实现的*去中心化才能让网络环境在没有中间环节的情况下交易成为可能。\n\
  \n因此，虽然该图描述了四个象限，但可编程性的不可避免的增加实际上将组织的方向选择限制为二：组织将要么向上移动，在中心化治理下变得更加数字化；要么向东北方向移动，在去中心化治理下变得更加数字化。\n\
  \n过去二十年的重点一直是推动“数字化转型”。从图 1-3 来看，这种进展已将组织从左下角（大多数行业的大多数业务以相对中心化且大部分是模拟的方式运行）移过界线进入左上象限。虽然某些公司已从这种方法取得了积极成果，但许多数字平台仍难以实现价值。¹⁷\n\
  \n选择向上移动的组织将看到可编程性的增加，并继续沿着过去几年来在少数大型平台、银行、保险公司、电信公司和物流巨头的控制下遵循的轨迹。这些组织对产生的数据和价值拥有无限控制权，允许他们规定其他业务访问市场和技术的条款。绝对控制将使这些可编程实体随着时间的推移变得更加中心化。\n\
  \n相反，组织可以选择东北轨迹，变得更加数字化且也更加去中心化。少数公司已经决定应对东北象限，以相对去中心化的、数字化驱动的业务模式在市场中进行竞争。我们说“相对”，是因为业务的多方面性质也意味着公司在某些方面可能是相当中心化的，而在另一些方面是去中心化的。在业务方面采用去中心化的公司示例包括汽车共享供应商\
  \ `Zipcar`（它实现了去中心化的汽车所有），以及 `LO3 Energy`（它利用区块链支持个人能源生产和交换，而不涉及中心化的公用事业机构）。`Betabrand`\
  \ 和 `Everybody World` 等服装品牌拥有开源和众筹的产品开发模式。来自 `Kickstarter`、`Indiegogo` 和 `Ulule`\
  \ 等平台的众筹为独立创业项目提供了去中心化的融资。¹⁸\n\n这些世界变得更加可编程路径：向上移动并与数字原生平台和其他中心参与者直接竞争；向东北移动，你开启了绕过数字原生平台和其他中心化力量的潜力。在这个东北路径上，首先是带有五个定义元素设计的完整区块链解决方案，随后是基于包含“事物”作为参与者的网络并在设计协议中使用\
  \ AI 的增强型区块链解决方案。^f\n\n\n\n\n\n在完善区块链及增强区块链解决方案的设计中，固有的共识驱动决策理念本身就与大多数组织和商业领袖的理念背道而驰的。你和其他领导者可能倾向于仅仅将精力集中在受区块链启发的阶段，从而将自己的行动限制在图\
  \ 1-3 东北象限的边缘，而忽略了光谱中后期的阶段。\n\n然而，我们鼓励你在尝试受区块链启发的解决方案时保持长远眼光。我们将沿着去中心化连续谱的移动定位为你在一个日益程序化的世界和社会中面临的一种选择，但我们并不认为每个可用选项都具有同等的吸引力。数百万、甚至数十亿个互联网节点和联网对象在过去的二十年里一直在捕获通信；记录对话；并跟踪全球数十亿网络化人类和组织的移动、交易、关系、使用的对象以及正在考虑的对象。控制这些数据的公司和政府正不仅在收集数据，还在对其进行解读、回传、推推人们并影响行为。\n\
  \n这就是现实——我们的现实。全球范围内少数机构持有着海量的客户和公司数据。我们为了额外的便利和酷炫的新设备将这些数据交给了他们。他们并不需要像“老大哥”那样的阴险目标，这些资源的集中化就会产生令人不悦的经济和社会后果。\n\
  \n我们的经济和社会在未来几年内不会变得不数字化或不程序化。相反，它们正处于通往持续采用 AI 和不断扩展 IoT 的清晰道路上，至于几乎每一个资产、环境、流程和交互将在短短几十年内实现完全程序化，正如艾兰·图灵在五十年前描述的那样。你现在需要决定你想生活在什么样的程序化社会中。你想要一个交互、交易及相关数据由少数人控制的社会吗？还是你想要一个拥有广泛访问、隐私、参与和价值交换的社会？\n\
  \n后一种社会需要拥抱区块链并最终采纳所有五个元素。为了建立这样一个社会，你和其他商业领袖必须积极协作，将你们的企业重新构为更大网络中动态且日益自主的参与者。随着你们交换价值的方式与我们所处的日益智能化和万物驱动的环境对齐，这些收益将属于你、你的组织、经济、商业界以及社会。\n\
  \n## 你的真实业务透镜\n\n### 你学到了什么？\n\n区块链是一种计算机化的方式，允许网络中的两个或多个参与者在不需要获取价值份额的第三方中介的情况下交换资产。我们定义的区块链包含五个核心元素：分布、加密、不可篡改性、代币化和去中心化。这些元素共同创造了一个信任环境，在其中创建和共享价值。这些元素在实现的难易程度上并不相等。去中心化最具挑战性，因为它还需要在业务层面接受某种程度的去中心化治理。\n\
  \n\n作为一名领导者，你应该制定一个愿景，说明增加去中心化如何有利于你的业务。时间是短暂的，因为包含所有五个元素的完善区块链解决方案将于 2023 年开始获得市场关注。再往远一点是包含\
  \ IoT 和 AI 的未来业务和社会环境，在其中自主和智能物体拥有资产并交易价值。你需要知道可以如何为此准备。\n\n\n区块链的演变不容忽视。数十个案例访谈显示，国家、行业、企业和消费者正在采取措施了解其用途。这项技术的影响将是巨大的。让我们从深入研究当前受区块链启发的阶段开始。\n\
  \n![image](img/part1.jpg)\n\n受区块链启发的解决方案包含了五个设计元素中的三个：分布、不可篡改性和加密。在 2023 年之前，组织内部被称为“区块链”的大多数解决方案将是受区块链启发的。在正确的语境下，受区块链启发的解决方案例如可以提高效率；减少后台成本；加速确认和结算；并提高数据质量。一个符合这些标准的高潜力解决方案目前正在\
  \ `ASX` 开发中，用于取代其使用了二十年的 `CHESS`，这是一个记录持股、管理股票交易并促进所有权交换的系统。今天，`CHESS` 每天处理数百万交易。该系统是一个真正的支柱，但在技术领域，二十五年是一个很长的时间。`ASX`\
  \ 的信息官 Dan Chesterman 解释说，他在 2015 年得出结论，交易所改进 `CHESS` 已达到极限。\n\n考虑到面临的机遇和挑战，维持现状并非选择。`CHESS`\
  \ 运行私有协议，这使得 `ASX` 难以吸引亚太和中东的上市。澳大利亚政府也开放了股票清算和结算的竞争。`ASX` 在澳大利亚没有可靠的竞争对手，但技术进步可能会改变这一点。由于这些原因，该组织需要一个新系统来维持其在澳大利亚的地位，并成为大陆之外可行的全球合作伙伴。2016\
  \ 年，`ASX` 展示了其路线图，计划用分布式账本技术解决方案取代 `CHESS`——也就是说，作为许可链的 `CHESS`。然而，路线图还规定 `ASX`\
  \ 将为不想使用 `DLT` 能力的生态系统参与者构建 `ISO20022` 消息选项。\n\n`ASX` 以及其他开发受区块链启发解决方案的人看到了即使设计中没有代币或去中心化，使用这种新技术的收益。从股票开始，`ASX`\
  \ 计划纳入其他证券类别和新产品。最终，这一愿景可能成为变革澳大利亚市场和其他市场的基石。然而，风险也存在。我们将在本章为你阐明这些收益和风险，并提供评估你在市场上看到的解决方案的工具。\n\
  \n\n\n\n\n需要明确的是，我们坚信受区块链启发的解决方案并没有完全实现我们对区块链真实业务所期待的愿景。尽管如此，这些解决方案并非毫无价值。在正确的应用场景和背景下，它们可以改进文档管理、可追溯性以及防欺诈能力，并创造其他效率。通过对受区块链启发的原型类型进行分类，我们讨论了区分高收益方案与低收益方案的方法。但在描述这些原型之前，让我们重新审视区块链启发解决方案中的中心化问题，以及它如何影响构成区块链启发收益-风险计算核心的四种业务货币（`data`\
  \ 数据、`access` 访问、`contracts` 合同和 `technology` 技术）。\n\n\n回顾一下，这四种业务货币是数字环境（而不仅仅是环境）中价值和竞争优势的主要来源。在最简单的交互中，用户通过揭露其兴趣和习惯的细节来“支付”对软件或数字解决方案的免费访问；反之，数字平台利用这些数据来吸引广告商、开发新产品和功能，并越来越多地引导客户采取某些行动。用户与数字平台提供者之间缺乏明确且多方的合同，这意味着提供者收集多少数据、使用数据的频率以及在何种情况下使用都是没有限制。\n\
  \n所有中心化的数字平台对流经它们的数据施加控制。这意味着受区块链启发的解决方案正如数字平台一样，对数据实施中心化控制。此外，由于受区块链启发的解决方案并非为去中心化而设计，它们是以某种程度的网络中心协调和治理运行的。中心化通过将数据库管理机制方面作为信息架构的一部分来实现；数据库机制决定了哪个实体作为交易身份验证者和验证者，从而决定了什么被写入账本。尽管，正如我们之前解释的，区块链并不是数据库且缺乏中心权威，但受区块链启发的策略模糊了这些区别。有些人会认为“中心化区块链”是一个术语上的自矛盾，包含数据库的区块链根本就不是区块链。忽略这些语义上的争论，我们将这些利用数据库技术的解决方案称为“受区块链启发的”（`blockchain-inspired`）。\n\
  \n最重要的是，中心化解决方案拥有单一权威，并且不使用去中心化共识算法来验证参与者的身份并认证交易。此外，具有单一权威的中心化架构为网络创建了单点故障。简单来说，你听到的关于区块链比传统数据架构更安全、可靠的所有承诺，`如果设计是中心化的`，这些都不是真的。安全并不是唯一的考量。如果没有代币化去中心化共识，受区块链启发的解决方案无法让互不认识的参与者在没有第三方验证交易的情况下交换价值。\n\
  \n在中心化控制的解决方案下，区块链解决方案的所有权成为一个主要问题。对于像 `Bitcoin` 这样的去中心化区块链，没有所有者，且访问对任何想要参与并拥有相应基础设施的人（以伪匿名方式）开放的。相比之下，受区块链启发的解决方案通常有一个所有者或一组有限的所有者，且成员被限于受所有者邀请参与的方。由于由于原因，受区块链启发的解决方案也被称为`closed,\
  \ private`（封闭私有）或`permissioned`（许可）区块链网络。\n\n技术和业务控制的动态直接影响了特定解决方案能够带来的竞争机会和威胁。`Figure\
  \ 2-1` (`chapter02.html#fig2-1`) 重现了 `figure 1-3`，该图绘制了业务环境中运行的数字化程度或编程化程度以及去中心化程度。在\
  \ `figure 2-1` 中，受区块链启发的解决方案由阴影区域表示，其边界根据中心化控制程度清晰划分。\n\n\n* * *\n\n受区块链启发的收益区域\n\
  \n![image](img/Figure_2.01.png)\n\n* * *\n\n此图提供了中心化对区块链意义的战略视角。任何特定的受区块链启发的解决方案相对于数字化和去中心化程度，都会占据一个较窄的领地。某些区块链解决方案，例如\
  \ `ASX` 及其 `CHESS` 的替代方案，为市场问题提供了一个高度控制且中心化运营和治理的解决方案。这种选择的理由是合理的。正如 Chesterman\
  \ 在 2018 年 10 月于澳大利亚举行的 Gartner IT Symposium/Xpo 现场对话中所解释的：“我们并不是在解决信任问题。人们本质上信任\
  \ ASX 是 CHESS 中数据的真实性来源。我们解决的是数据同步问题。”\n\n其他同样由一家公司或一小组公司领导的解决方案可能对价值链中的其他成员施加控制。最终，某些解决方案希望随着时间的推移演变为去中心化的协作。这种区别通常可以在解决方案如何交易这四种业务货币中看到。让我们检查每种货币，并关注它们在光谱中受区块链启发的阶段是如何运作的。\n\
  \n\n数据在区块链光谱的所有阶段都是一种重要的货币，但在受区块链启发的阶段最为脆弱。这种脆弱性在旨在促进价值链中组织间交互的受区块链启发的解决方案中尤为明显。如果你的组织参与了这些区块链之一，且该区块链的治理允许单个参与者或小组访问或控制所有流经其它的数据，那么你可能在暴露自己的业务信息的情况下，而没有获得相应的见解或价值回报。\n\
  \n为了说明我们的意思，我们将以区块链协作项目 `TradeLens` 为例。`TradeLens` 由航运巨头 `Maersk` 和全球技术公司 `IBM`\
  \ 于 2018 年 8 月推出，是一个受区块链启发的物流解决方案，旨在简化供应链行业的信息共享。`Maersk` `TradeLens` 合作项目的业务发展总监\
  \ Daniel Wilson 告诉我们，该解决方案源于对物流行业数字解决方案更广泛的探索。“我们行业迫切需要数字化转型，使所有参与者都拥有可靠且可预测的信息流。我们看到区块链平台至少可以在某种程度上解决这些痛点。”\n\
  \n作为背景信息，全球有五千多艘集装箱船在海洋上航行，某些船舶载有高达两万个集装箱货物。航运业需要严密的记录来管理这些总量，但许多记录工作仍然是基于纸的。如果文件不完整、语言错误或丢失，货物可能会被滞留，产生额外的成本。\n\
  \n\n\n\nTradeLens 的目标是通过在一个受区块链启发的平台上捕捉必要的航运信息来实现流程数字化，该平台允许参与交易的各方在需要时访问记录。TradeLens\
  \ 网络在 2018 年 8 月启动时已有百多个全球物流行业参与者；到 2018 年 10 月，该平台已管理了 1.54 亿次航运事件，每日交易达到 100 万次。马士基（Maersk）报告，加入\
  \ TradeLens 的参与者占全球可用航运市场的 20%，推广者强调了区块链有望将货运管理时间缩短 40%。\n\n这种前景确实存在。然而，中心化的方法让一些行业参与者望而却步。例如，德国运输公司莎莎邮（Hapag-Lloyd）的高管公开表示，反对参与一个由竞争对手拥有并控制的平台。“从技术上说，这个解决方案是一个很好的平台，”首席执行官\
  \ Rolf Habben Jansen 说，“但它需要一种治理机制，使其成为一个行业平台，而不仅仅是马士基和 IBM 的平台。这是我们目前在许多此类倡议中看到的弱点，因为每个独立项目都声称提供一个由自己控制的行业平台。这是自相矛盾的，如果没有联合解决方案，我们将浪费大量资金，这对谁都没有益处。”\n\
  \n当我们询问威尔逊（Wilson）治理问题时，他说：“行业许多人的观点是，拥有一个促进信息共享标准的平台将是纯粹的利，但他们对治理模型表示担忧。我们在过去的十二个月里调整了治理结构，以反映行业的反馈。我们正在倾听市场。在技术方法上，我们没有听到过任何实质性的负面意见。”\n\
  \n关于技术，威尔逊补充道：“我们正在通过各种论坛讨论标准。我们正在使用开源技术；所有数据结构都是开放的。其他人可以采用相同的技术构建自己的平台，但他们为什么要这样做呢？价值在于将所有信息汇聚在一个地方，提供一个一站式服务。”\n\
  \n与此同时，另一个竞争性的航运行业区块链启发解决方案已经发布。全球航运业务网络（Global Shipping Business Network）拥有九家航运行业签署方，包括中远海（COSCO）和上海国际港。该网络已宣布开发区块链解决方案的意图，尽管该解决方案在实践中的形式尚不明确。\n\
  \n莎莎邮表达了数据访问和商业方面的担忧，这些担忧在任何使用中心化技术治理和中心化所有权的解决方案中都会出现。对于信息密集型解决方案，这些担忧会加剧。当区块链启发的解决方案允许一个具有卓越\
  \ AI 分析能力的大型公司查看、访问数据并影响系统内每一方的流向时，利益可能会不成比例地归该实体所有，差异会随着时间的推移而扩大。区块链启发解决方案中缺乏代币强化了权力的中心化，因为没有机制允许参与者控制自己的信息、提供同意或将其作为资产进行交易。\n\
  \n因此，当我们说数据是货币时，我们的意思是，区块链启发解决方案的形式、所有权和治理结构可以让参与者对他们输入的数据拥有多或少少的控制权。在签署此类解决方案之前，请了解你正在“支付”什么以及如何支付。\n\
  \n\n拥有区块链启发解决方案的企业控制着对流程或市场某部分的访问权限。想要参与的企业通过费用或订阅显式地为这种访问付费，但他们也通过将自己锁定在解决方案中或暴露其竞争信息来隐式地付费。\n\
  \n相比之下，许可式访问（permissioned access）的概念在完整的区块链解决方案并不存在。任何参与者或节点都可以加入区块链点对点网络。事实上，区块链的设计实际上有利于参与，因为当涉及更多节点时，基于去中心化共识的决策变得更强大、更可靠。访问和参与定义了其核心精神，其理念是透明度驱动对规则的遵守。这一概念类似于\
  \ eBay 早期使用成员评价来允许人们指责不履行拍卖条款的竞价者或卖家。使其开放、透明且负责，大家就会相处融洽。\n\n开放访问的理论益处是显而易见的，但现实更为复杂。对于习惯于看到边界的领导者来说，开放访问是一个具有挑战性的概念。对他们来说，一个具有许可访问、定义交互和已知参与者的区块链解决方案更熟悉、更舒适，并且可以应用于组织内部。\n\
  \n然而，这些熟悉的领域中存在风险。走向极端，区块链启发解决方案基于稀缺性而非可用性。解决方案创建者让这些形式的区块链变得有用，让“客户”和“合作伙伴”看到短期利益。但这种“价值”可能会被强制。例如，大客户或渠道合作伙伴可能会将其控制的区块链作为合作的条件。在这些情况下，访问区块链等同于访问市场。如果你拒绝，你将失去与最终客户联系的能力。\n\
  \n\n合同规定了业务的条款和条件。在区块链中，这些条款被纳入区块链技术中，要么作为`智能合约`——捕捉并执行区块链业务规则和协议的代码——要么在底层技术栈中。规则允许区块链在没有人工干预的情况下执行交易。\n\
  \n但是谁在定义这些规则，谁来决定修改？如果由一个实体定义规则并拥有区块链，那么就有理由怀疑。相比之下，如果决策是基于社区的且智能合约及其维护是透明的，它们可以作为平衡力量，使规则及其后果变得可见。因此，你需要了解智能合约的来源、谁负责相关代码的维护以及发生错误时谁承担责任。智能合约及其执行的规则绝不应被视为技术问题。这是一个业务问题，因为对合同的控制就意味着对区块链产生和交换的价值的控制。\n\
  \n\n\n\n许多已经上线的解决方案都是过渡性的；其首要目标是满足即时需求或机会。它们应该被视为学习平台，而不是长期解决方案，因为区块链技术正在不断演进和成熟。区块链技术的持续成熟至关重要，特别是对于区块链启发的解决方案，因为使用中心化治理构建的解决方案在以后很难（如果根本无法的话）实现去中心化。为中心化架构设计的技术无法用于去中心化，而且供应商没有动力去实现这一点，特别是当区块链使用了`their`的系统和技术栈时。从一开始就构建用于处理某种程度去中心化的开放解决方案将允许你更快地升级，并随着时间的推移朝着那个方向演进。\n\
  \n\n四种业务货币为评估目前正在开发的数百种受区块链启发的解决方案提供了一个视角。解决方案如何处理数据？谁拥有访问权限？谁来定义合约？谁来开发技术？这些问题的答案明确了交易伙伴或供应商提供的区块链解决方案在收益与风险之间的平衡。拥有这些答案也可以帮助你预先决定你希望构建或购买的解决方案中具备哪些特质。\n\
  \n鉴于市场中区块链活动的爆炸式增长，你将会经常问这些问题。正在进行的数百个受区块链启发的概念证明、试点和实施在处理这四种货币方面各不相同。针对这些差异，我们识别了五种区块链启发的原型（图\
  \ 2-2）。其中一些保留了随着时间推移演变为去中心化、代币化的可能性；如果设计原则允许，它们可以从区块链启发迁移到完全区块链化。其他原型则强化了与完全区块链解决方案不兼容的中心化运营方法。采用任何新技术都会带来风险，但迈出第一步将使你获益。为了帮助你决定如何做，我们展示了这五种原型的详细视图。\n\
  \n\n* * *\n\n区块链启发原型\n\n![image](img/Figure_2.02.png)\n\n* * *\n\n\n在 Christophe\
  \ 最近与一家汽车保险公司领导的对话中，该公司正寻求开发一种用于汽车理赔处理的区块链解决方案，我们问了一个在这类客户互动中常见的问题：为什么要用区块链？领导们想要捕捉并存储有关驾驶员、车辆和事故背景的信息，认为这些数据可以通过更透明的流程简化事故调查。然而，他们描述的没有任何东西需要区块链。事实上，在这种闭环、中心化的语境下，区块链可能比使用标准数据库和消息技术构建的替代方案更贵、更复杂且风险更高。Christophe\
  \ 告诉了领导们他的想法，但他们耸耸肩说，他们的高层告诉他们要设办法使用这项技术。公司对使用区块链的渴望与其说是该技术与问题的相关性，不如说是组织为了跟上数字化趋势而面临的压力。\n\
  \n我们经常听到某些组织开发区块链测试或试点，以解决一个内部问题，而这个问题本可以通过成熟的方法得到更好、更快、更廉价的解决。对于某些领导来说，围绕区块链的热热制造产生了隧道视野，使他们无法考虑替代方案。其他领导知道他们应该比较不同的选项，但认为这样做没有价值；他们的老板在区块链\
  \ FOMO 的影响下说，要么用区块链，要么回家呆蛋。正如一家区域性金融服务公司的 CIO 在 2018 年的高特 Gartner 中东研讨会上告诉 David\
  \ 的话一样：“你不明白；我的 CEO 叫我做区块链。”\n\nFOMO 驱动的区块链项目不太可能节省成本或创造价值。然而，它们并不是毫无意义的。探索像区块链这样的先进数字解决方案可以向市场传递一个信息，即你的组织是创新的并处于当前趋势的前沿。这种信息可以导致潜在客户对你青睐一眼。它还可以迫使竞争对手出于类似的\
  \ FOMO 原因投入时间和资源。\n\n然而，领导者需要警惕不要对对区块链的知识产生虚假的安全感，并仔细控制他们在此类解决方案上的支出资金。如果一个项目未能产生价值，某些领导会认为他们尝试了区块链但失败了，而实际上只是用错了场景。太多的\
  \ FOMO 区块损害了区块链的信誉。此外，当企业坚持预先实施区块链解决方案时，这些解决方案往往会给现有系统和流程带来负担。\n\n\n在这种原型中，一个强大的行动者或一小组行动者开发了一个区块链启发的解决方案，并邀请（有时要求）生态系统参与者使用。这些解决方案在定义上是区块链启发的，因为它们拥有单一所有者或相互熟悉的行动者集体。尽管某些提供中心化解决方案的供应商会使用“去中心化”和“共识”（去中心化系统的特征）等词汇，但该原型的中心所有权有力地表明其系统设计也是中心化的。\n\
  \n我们将这些解决方案称为“特洛木马”，因为它们从外面看很有吸引力。它们背后有声誉良好的品牌，拥有看似坚实的技术基础，并解决了行业中已知、昂贵且广泛的问题。然而，入场的代价是专利数据、流程和商业活动的潜在泄露。从业务货币的视角来看，特洛木马解决方案要求参与者放弃对数据和合同条款的部分控制，以换取对市场技术的访问。\n\
  \n沃尔玛食品追踪区块链似乎属于这一类。¹³ 该解决方案是为了追踪农产品供应链而开发的。据报道，沃尔玛的动机是为了防止疾病并降低污染成本。在非区块链环境中，可能需要几周或更长时间才能确定导致污染的确切农场或加工厂，在此期间会有几十人人生病。此类疫情在\
  \ 2018 年 11 月底在美国发生，涉及罗马生菜，事件发生后，生菜从货架上消失了一个月多时间。¹⁴ 这些事件浪费了未污染的农产品并损害了品牌声誉。完整的、可访问的记录将允许沃尔玛这样的商店更快地确定污染源并从源头阻止它。\n\
  \n不可否，行业需要更好的方法来阻止食品污染。然而，一旦供应链伙伴将数据输入中心化系统，这些公司就面临着风险，即与该系统共享数据，却无法因这些信息获得应有的补偿。\n\
  \n\n\n\n\n受特洛伊马启发的区块链解决方案的长期战略遵循了市场去中介化的路径——这条路径自工业时代以来一直被强大的渠道合作伙伴所切断。起初，这些主导企业通过提供解决现有问题的解决方案以及接触目标终端客户的途径，来鼓励贸易伙伴参与。但一旦进入系统，参与者就被锁定了——除非他们留下或接受新的条款和条件，否则平台所有者可以拒绝与他们交易。(](../Text/notes.html#ch2-en16)随着时间的推移，这些特洛伊马可以分析平台数据，并将采购转移到网络中成本最低或杠杆最低的参与者。他们还可以逐渐压力生产者提高质量、调整生产并降低成本，以便平台所有者吸引更多客户，从而促使规模进一步进一步极化。客户最初能从更高的便利性、改进的产品和更低的成本中获益。然而，市场权力的集中减少了竞争，导致供应可靠性降低、多样性减少、受客户选择的影响减弱，且成本增加。直接来说，特洛伊马解决方案驱动了更深层的中心化。\n\
  \n\n托管信与结算公司（`DTCC`）是美国金融系统的交易后清算和结算中介。与澳大利亚的 `ASX` 类似，`DTCC` 管理交易后流程，并作为美国市场交易活动的单一记录来源。2006\
  \ 年，`DTCC` 构建了一个名为`交易信息仓库`（`TIW`）的主机解决方案。正如 `DTCC` 董事总经理兼首席技术架构师 Robert Palatnick\
  \ 所描述的那样，该主机本应是“信用违约互换的中央黄金记录”。](](../Text/notes.html#ch2-en17)\n\n“当解决方案在 2006\
  \ 年推出时，主机解决了许多手工和基于纸质的流程，”Palatnick 说。“但自金融危机以来，成立了许多交易所，场外交易的量有所下降。由于主机需要升级，且市场规模在缩小，我们发现成本太高了。因此，我们与技术提供商、专家和客户聚在一起，决定\
  \ `TIW` 代表了利用区块链进行重大且有影响力的工作的好机会。”该公司目前正致力于使用分布式账本技术和云解决方案设计其 `TIW`。当我们与 Palatnick\
  \ 对话时，`TIW` 正在与十五家参与银行进行结构化测试，管理着约 10 万亿美元的未平头寸。\n\n与澳大利亚证券交易所替换 `CHESS` 系统一样，`TIW`\
  \ 属于机会性区块链启发的解决方案。这些解决方案解决了已知问题或机会，且发起公司对使用未经测试技术的风险、区块链与其他技术方案相比的成本，以及可能获得的收益进行了评估。该解决方案是受区块链启发的，但并没有增加去中心化的路径（而且像\
  \ `DTCC` 这样的中心机构也不希望这样）。\n\n机会性的区块链启发努力通过改进记录保存或流程层面的效率来提供价值。澳大利亚证券交易所也看到了向主要地理区域以外的客户扩展市场以获得额外价值的潜力。\n\
  \n组织也通过机会性区块链启发的解决方案获得了有用经验。这些努力为技术和实施团队带来了信誉，并让每个人获得了处理分布式数据共享中某些文化和技术挑战的经验。\n\n\
  对于一位在 2017 年上线区块链的中东银行前首席信息官来说，机会性区块链启发解决方案的收益是值得的。该解决方案旨在连接一个特定的群体，而不通过中介机构 `SWIFT`（全球银行电讯协会）。然而，系统在六个月后下线了。根据该\
  \ CIO 的说法，这是“缺乏投资回报率（ROI）”。\n\n尽管如此，该 CIO 对这段经历仍持积极态度。他说他的银行对这一特定用例获得了对区块链的信心，他的技术团队学会了如何构建和运营。“我们获得了关于这一切如何运作的良好经验，我们花费的钱很少，我们发现即使在最小的联盟中工作也是痛苦的，而我们的技术退出策略维护了客户体验。”他补充道，“这对银行来说是一次很好的公关活动！”](](../Text/notes.html#ch2-en18)\n\
  \n再次从货币的角度来看，机会性区块链启发的解决方案意味着对数据和合同控制权的某种损失。但正如银行 CIO 所承认的那样，这些解决方案在市场准入和技术经验方面确实提供了一些回报。\n\
  \n\n如今区块链的技术不成熟使得完整的解决方案在具有关键系统的环境中难以实施。尽管如此，一些组织正在探索受区块链启发的解决方案，并计划随着技术的成熟将其演进为完全的区块链解决方案。为了保持未来转型的可能性，所有者从一开始就必须做出支持去中心化和代币化的架构和运营决策，即使这些元素在初始部署中并未使用。\n\
  \n瑞典构建区块链房地产注册库的努力提供了一个具有演进潜力的解决方案的案例。\n\n\n\n\n瑞典测绘局（Lantmäteriet）是负责房地产管理的政府测绘与土地登记机构，其目前正在测试一种区块链解决方案以优化流程，并可能每年节省\
  \ 1.6 亿美元。它与 `SBAB Bank`、`Landshypotek Bank`、电信公司 `Telia Company`、管理咨询公司 `Kairos\
  \ Future` 以及区块链技术供应商 `ChromaWay` 建立了合作伙伴关系。正如测绘局首席创新官 Mats Snäll 所强调：“目标是开发一个运行房地产交易的区块链账本，节点最终将分布在并在理想情况下跨生态系统中的组织实现去中心化。”^(19\
  \ 测绘局区块链网络最终可能包括抵押贷款银行、房地产中介、律师事务所、房地产经纪人、物业开发商以及私人买卖双方。其目标是实现比现有公共不动产登记簿更高效、更透明的记录。\n\
  \n首笔交易于 2018 年 6 月在网络中发生。在初期的、“受启发的”形态下，该系统作为一个运行在有限数量节点上的闭环或许可网络运行。房双方的每一方都使用单独接口访问网络，系统使用了多种技术的组合，包括使用集中管理的数据库而非账本。初始设计中不包含任何数字代币。智能合约验证该过程，但该合约目前不是自动执行的：它仅验证交易是否发生，而不执行交易本身。\n\
  \n瑞典测绘局在实现规模化之前必须解决几个问题。有些问题是行政层面的（例如，瑞典法律要求房地产交易使用墨笔签名，而欧盟法律允许电子签名），另一些是操作层面的（房地产交易中的各种参与者有不同的参与业务需求，并非所有需求都能达成一致）。区块链解决方案可能还会引发文化问题。例如，客户在接受交换其主要财富来源的去中心化、数字化流程之前，可能需要时间。财务问题，如谁为解决方案付费以及谁从中受益，也必须得到解决。最后，测绘局必须考虑多方网络的监管治理。此外，一组银行和房地产公司正在开发一种竞争性的在线\
  \ Web 门户系统，这可能会瓜分市场，或成为更好的短期解决方案。尽管存在这些挑战，区块链土地登记的推动者断言，该解决方案可以演变成一个以“无许可”方式连接生态系统中所有参与者的网络。此类解决方案中的业务货币对参与者而言将以低到中等的风险水平交易。\n\
  \n第五种也是最后一种受区块链启发的原型是“生于区块链”的解决方案。这些解决方案由初创公司或绿地创新尝试开发，利用区块链作为基础元素，创造新市场或对现有业务模式进行颠覆性改进。由于去中心化和代币化核心元素尚不成熟，原生原型中的某些解决方案仍属于受区块链启发的类型，但由于其独立于现有企业环境的开发，将允许它们随着时间的推移向完全区块链解决方案进化。\n\
  \n具有显著区块链原生活跃性的领域是高等教育。例如，伍夫大学（Woolf University）就是一个原生区块链实体，希望成为第一个由区块链驱动的教育机构。它由来自牛津和剑桥的学者创立，旨在成为一个非营利的“无边界数字教育社会”，即学位课程的去中心化\
  \ Airbnb。伍夫大学通过安全合约连接教授和学生，并记录学习交换过程，以便学生获得学分，教授获得报酬。`WOOLF` 是智能合约中使用的原生代币，但讲师可以选择用\
  \ `WOOLF` 或其国家的法定货币获得报。伍夫大学将寻求欧盟 认证，并预计于 2019 年推出全球平台。\n\n原生区块链启发的解决方案将把新的业务模式或方法引入传统行业。未经测试的技术将成为主要的货币风险。这些解决方案将吸引那些希望控制自己数据并实验去中心化的参与者。\n\
  \n\n这五种区块链启发的部署原型清晰地阐述了区块链探索的广阔世界。每个原型的底层设计和业务动机决定了参与成本以及你从中获得什么。基于 FOMO（错失恐惧）的解决方案可以提供一些学习机会，但很少能提升组织的数字能力或去中心化程度。特洛伊马带着其参与者在图\
  \ 2-2 的网格中快速向上移动，虽然提供了更强的数字能力，但处于中心化模型之内。机会主义解决方案引导实施组织向东北方向移动，但由于缺乏去中心化而遭遇硬性限制。进化型和区块链原生解决方案在为组织准备去中心化和未来的完全区块链部署方面最具潜力。\n\
  \n大多数在有限风险下获得可衡量价值的业务将通过机会主义、进化型或区块链原生原型来实现。特洛伊马区块链将获得市场关注和可能的推动，但不太可能为平台所有者以外的任何人带来长期价值。如果由于时间和市场压力改变了特洛伊马的所有权结构，那么这些原型就可以进化为进化模型。\n\
  \n\n\n区块链启发解决方案将主导市场直到 2023 年左右。这些解决方案利用了五个关键区块链设计元素中的三个，通常解决涉及企业内部或企业间数据共享及工作流的已知挑战。良好的解决方案将带来利益，但你需要权衡涉及的风险和成本。由于区块链启发解决方案缺乏去中心化这一设计元素，互不认识参与者在没有第三方验证的情况下无法交易或交换价值。相反，这些解决方案通常有一个所有者或有限组的所有者，且成员受到限制。在这种背景下，数据、访问、合约和技术的业务货币可能根据解决方案的设计和目的由单一主体或子小组控制。这五种区块链原型反映了不同程度的中心化：基于\
  \ FOMO 的解决方案（大多数内部项目）、特洛伊马（例如沃尔玛）、机会主义解决方案（例如 ASX）、进化型努力（例如瑞典测绘局）以及区块链原生解决方案（例如伍夫大学）。\n\
  \n组织无法利用区块链启发解决方案来创建或交换新形式的价值，因为新的数字原生价值形式需要在去中心化环境中运行的代币。因此，光谱中的区块链启发阶段并非终点，而是通往完全区块链阶段的经站。\n\
  \n\n\n\n\n作为一名领导者，你希望根据数据、访问、合约和技术这四种业务货币对你的区块链开发进行审查和基准测试，以理解长期价值主张和风险。与你的执行团队提出以下问题：你的组织将如何追求区块链倡议？哪种原型最符合你的战略？你将如何管理你的业务货币？如果你已经参与了区块链试点、概念验证或全量实施，这些解决方案是受启发的吗？如果是，网络数据存储在何处？谁有权访问它？由谁来编写合约？\n\
  \n\n组织追求区块链倡议包括用于内部使用，以及通过特定市场、地理位置或价值链中的合作伙伴关系和联盟努力来实现。事实上，联盟是许多区块链活动的驱动力。尽管与志志同道合的伙伴分担风险具有潜在收益，但联盟也给组织带来了重大的挑战。你应该警惕将控制权让交给一个强大的中央权力或竞争对手。加入联盟还是不加入联盟？这是我们在下一章要解决的问题。\n\
  \n联盟在区块链开发中发挥着至关重要的作用。正如它们帮助推向市场的受启发的解决方案一样，联盟有多种形式。有些联盟将组织整合到真正的集体模式中以追求共同目标；另一些则代表了单一强大实体对行业下属机构施加影响的愿景。尽管某些人可能将后者视为合作伙伴关系或合资企业而非联盟，但我们对联盟采取了广义的观点，即任何为了个人成员无法独立实现的目标而共同努力的公司或组织团体。从这个角度来看，大多数计划中或开发中的企业区块链解决方案背后都有联盟的支持。\n\
  \n区块链联盟作为解决行业问题或地理问题的解决方案开发者，具有特别的信誉。考虑比利时 `Isabel Group` 正在开发的解决方案。`Isabel Group`\
  \ 于 1995 年由四家比利时银行组成联盟，每家银行持有该机构 25% 的股份，它是一个技术服务提供商，管理多银行等活动，并提供实现了解客户（`KYC`）合规的解决方案。`KYC`是一项旨在抑制洗钱的监管要求。¹\
  \ `KYC` 规则要求所有银行对参与金融交易的客户收集并定期更新身份信息。合规可能让银行花费数百万美元，但它没有带来任何竞争价值。`Isabel Group`\
  \ 提供的其他服务还在线身份管理、支付管理和安全。\n\n典型的 `KYC` 实践要求每家银行分别从企业客户处获取信息并在本地管理和定期更新（通常每六个月一次）。然而，由于企业可能与多家金融机构（有时是几十家）建立关系，这种方法会导致金融系统的冗余，并导致支付延迟或拒绝的不一致性，从而干扰资金流动。²\
  \ `Isabel Group` 相信区块链可以提供一种更高效的替代方案，并正在构建一种受启发的区块链解决方案，旨在每个更新周期仅捕捉并验证企业的 `KYC`\
  \ 凭证，无论企业拥有多少个银行关系。\n\n\n这些是令人信服的数字。但 `Isabel Group` 需要区块链来实现这些目标吗？“我们可以为这项倡议使用加密数据库，”`Verhaest`\
  \ 承认道，“但银行看到了区块链的优势，因为每家银行只能访问其自身客户的数据，结果就是它在整个联盟中执行了更广泛的信任。”\n\n`Verhaest` 的评论触及了联盟优势和风险的核心。像你这样的领导者可以从共享想法以及解决方案开发的成本和风险中获益。然而，你也会担心放弃控制权或将专有信息暴露给实际上是你的竞争对手的企业。在当前市场中，收益似乎占据上风，导致了各行业区块链联盟的快速形成。作为一名领导者，你无法忽视这些联盟对你行业区块链发展的影响。相反，你需要一个参与战略：为什么要加入联盟？何时加入联盟？如何以一种带来利益并限制风险的方式加入联盟？在本章中，我们将为你提供回答这些问题所需的工具。\n\
  \n## 区块链联盟：自相矛盾？\n\n对于许多区块链领导者来说，联盟似乎与区块链是天然契合的。实现直接交易的点对点网络需要许多运行执行网络规则共识协议的节点的弹性。作为多实体组织，联盟可以从一开始就通过核心参与者试点解决方案。如果这些解决方案被设计为向去中心化发展，那么它们将属于之前描述的受启发解决方案的演进形式。\n\
  \n尽管区块链和联盟之间存在显而见的相似性，但也存在差异。联盟的形成通常是为了整合市场资源，旨在开发和推广标准操作程序。为此目的成立的联盟示例包括用于跨境支付的\
  \ `SWIFT`、石油天然气行业的`石油出口国组织 (OPEC)`、农业市场的 `Dairy.com` 或娱乐媒体的 `Hulu`。这些联盟的存在是为了中心化地解决行业需求，有时以有利于大型强大成员的方式制定市场条款，而对较小的参与者和整个经济产生参差不齐的影响。这种中心化与区块链旨在让任何人都能平等参与和访问的承诺直接冲突。\n\
  \n当多个联盟以不同方式关注同一个问题时，中心化问题变得更加复杂。例如，多个区块链联盟正尝试解决 `KYC` 合规和贸易融资的挑战。⁴ 在 `KYC` 努力方面，有提到的\
  \ `Isabel Group`，以及由五家北欧银行开发的合资企业 `Nordic KYC Utility`，其计划服务第三方。`R3` 还进行了一项 `KYC`\
  \ 区块链试点，三十九家银行在十九个国家运营。⁵ 贸易融资领域的区块链联盟包括 `we.trade`、`Marco Polo`、`Voltron` 和 `eTradeConnect`，每个联盟的方法略有不同，取决于不同的区块链协议，例如\
  \ `Hyperledger`（Linux 用于区块链上分布式账本的开源工具）和 `R3` 的 `Corda`（另一个开源区块链平台）。\n\n\n\n\n如果多个联盟在关注相同问题的同时都获得了发展，那么对竞争将产生什么影响？从中心化的角度来看，尽管只有几个联盟选择，但这仍然创造了一个竞争受限的环境，从而保护了现状。在这种观点下，区块链联盟被视为一种保护市场实力的尝试，通过将参与者锁定在由中心中间机构推动的受区块链启发的解决方案中。这是一种“特洛伊马区块链”（`blockchain-as-Trojan-horse`）模型，旨在用“礼物”的承诺吸引毫无防备的领导者，而这份礼物最终将限制他们的独立性。\n\
  \n另一种方案是通过联盟之间的协作来驱动新标准。没有中心权威机构的标准可以鼓励市场准入、进一步的竞争和创新，并为互联和去中心化的系统建立基石。根据这种观点，联盟可以促进从受区块链启发的解决方案向区块链完备型、并最终向区块链增强型解决方案的转型。它们将挑战现状。\n\
  \n区块链作为整合力量和区块链作为去中心化力量这两种情景都是可能的。有些联盟将旨在使市场权力集中，而另一些将随着区块链市场的成熟而过时。虽然某些小组将会合并（如\
  \ `we.trade` 和 `Batavia`）、由于无法解决治理和商业条件而解散或搁浅，但另一些将开发系统和策略来实现去中心化，并演变为区块链完备型。⁶ 在区块链启发阶段以及可能在之后的阶段，所有类型的联盟都将处于无数倡议的中心。让我们看看当今市场中形成的各类联盟。\n\
  \n\n根据我们的统计，2019 年有超过一百个关注区块链的联盟，而且形成的数量在不断增加。联盟成员之间的关系差异很大，包括行业、地理、技术和业务隶属关系。许多企业属于一个以上的联盟。\n\
  \n\n区块链领域中一些最知名的联盟是基于行业关联的。例如，位于瑞士楚格的 `Energy Web Foundation` 识别并开发了跨行业的区块链用例。`Blockchain\
  \ Industry Initiative` 是一个欧洲项目，旨在评估保险行业的区块链创新。`Mobility Open Initiative` 包含了汽车行业的成员，而\
  \ `Blockchain in Transportation Alliance` 则专注于物流和运输行业的区块链标准。基于行业的联盟通常聚集在一起解决如 `KYC`、贸易金融、认证等行业问题。\n\
  \n\n某些联盟还关注特定国家或地区的挑战。例如，`Isabel Group` 起于比利时市场，但希望其区块链努力能够帮助欧盟的供应商。`Masterchain`\
  \ 是另一个专注于俄罗斯的区块链联盟，它在 `SWIFT` 网络监管下构建并测试了用于跨国支付的区块链解决方案。 7 `Russian FinTech` 强调了其他地理位置联盟，例如中国（`Blockchain\
  \ Shenzhen`）、卢森堡（`Infrachain`）、日本（`Blockchain Collaborative`）和阿拉伯酋联合国（`Global Blockchain\
  \ Council`）。 8\n\n\n技术联盟围绕某个平台或技术方法集结。由 `Linux Foundation` 在 2015 年发起的 `Hyperledger`\
  \ 以及 2017 年成立的 `Enterprise Ethereum Alliance` 是技术领先联盟的两个著名案例。⁹ 它们为了实现组织间协作的目标而形成，并且都促进了账本之间的互操作性。\
  \ 10\n\n第三个技术中心联盟是 `R3`，它诞生于金融服务机构和技术提供者之间的最初伙伴关系。它是开源 `Corda` 平台的创建者。作为 Hyperledger\
  \ 项目的首批参与者之一，由于其金融服务行业的背景，`R3` 具有一定的影响力。该组织与 `HSBC`、`ING` 以及 `Cargill` 合作，在泰国银行和加拿大中央银行开展了多次概念验证和试点。\
  \ 11 然而，由于多方企业级实施极其困难，一些 `R3` 联盟成员已经失去了信心并离开。 12 （Hyperledger 也遭受了流失。 13\n\n`Ant\
  \ Financial`（阿里巴巴的金融服务部门）与澳大利亚和新西兰的食品生产公司，以及中国的海关机构和物流公司 `Cainiao` 合作，是另一个关注业务流程的案例。鉴于中国巨大且不断增长进口市场，食品欺诈是一个巨大的问题。例如，2008\
  \ 年，在使用污染奶粉后三十万婴儿患病，六人死亡。 15 `Ant Financial` 拥有一种运营中的区块链追溯解决方案，该方案已在 `Tmall` 电商平台上应用于多种产品，包括进口奶粉和配方、蜂蜜产品、有机米、葡萄酒和酒，截至\
  \ 2018 年 11 月，追溯物品已超过 1.5 亿件。 16 一 `Ant Financial` 的代表在 2018 年 10 月向作者表示，“每个追溯物品都获得了一个唯一的区块链证书，消费者可以通过\
  \ `Alipay` 移动应用程序查询其产地、供应链和质量信息。得益于追溯解决方案，小型生产者也可以将其产品与市场上的低质仿制品区分开来。” 17\n\n##\
  \ 为什么联盟？\n区块链联盟成员通常围绕共同利益协作——行业、地理位置、技术或业务流程。然而，这些利益并不互斥。例如，一个专注于金融的联盟也可以对某项特定技术制定标准。或者，成员可能来自同一个国家，但拥有实现参与者地理扩张的共同目标。\n\
  \n\n\n\n然而，对基本关注点或方法达成共识往往不足以激励长期合作。相反，区块链联盟经历着频繁的变动。企业和业务领袖加入一个或多个联盟，参与一段时间后再次离开，通常在几个月后就会加入另一个联盟。协作的某些优势可能会鼓励成员在更长的时间内保持联系。\n\
  \n\n业务领袖加入联盟的动力通常源于交换主意和收集信息——有时甚至是为了收集竞争情报。尽管想法会有机地在公司之间流动，但联盟使这种共享更加高效，并赋予了信息合法性。领导者还声称，加入联盟为他们提供了公关机会，缓解了来自组织内部上级的“错恐惧症”（FOMO）压力。热度（或对热度的错觉）为他们为公司研究区块链实质提供了时间。\n\
  \n然而，即使是强大的学习益处，通常也不足以让领导者长期维持成员身份。当被要求增加投入时——例如通过投资或集成联盟构建的解决方案——领导者可能会认为没有足够的直接利益来迈出下一步。那些保持参与的人通常是基于更具可量化的利益而做的。\n\
  \n### 区块链作为极佳的谈话起点\n\n某些行业的领导者通常有共同的经验和协作想法，但他们并不总是能找到聚在一起分享这些想法的方法。特别是受高度监管行业的人员，可能会犹豫与行业内的其他人见面，担心这会导致他们触犯反垄断法。\n\
  \n“区块链让我们能够聚进一个房间进行交谈，我们发现我们在数字化工作方式上可以达成共识的领域，”挪威能源公司 Equinor 的运营与技术卓越高 Rebecca\
  \ Hofmann 说道。`../Text/notes.html#ch3-en18` 她接触区块链是在 2014 年的一场会议上，当时她在能源领域认识的各各领域的人士告诉她，需要建立一个能源区块链论坛，以促进理解、协作和对行业机会的探索。在几个月内，Hofmann\
  \ 创立了美国石油与天然气区块链论坛（US Oil & Gas Blockchain Forum）。成员现在包括 Equinor 以及雪佛、康德石油、埃森美、Repsol、Pioneer\
  \ Natural Resources 和 Hess。\n\nHofmann 认为，区块链为公司提供了一种过去无法实现的聚在一起的方式，以讨论区块链特定的需求和其他需求。“对我来说，”她说，“这比区块链技术本身更有意义，尽管没有区块链，我们都无法聚进这个房间。”他们以前尝试过协作。“我们有很多非营利标准委员会，试图为行业带来额外的效率，”Hofmann\
  \ 说，“我们只是从未信任过彼此，因此双方之间的流程一直处于碎片化。我们都是竞争对手，但也是合作伙伴，我们身上还带着一种互不信任的污名。区块链承诺了一个中心化的信任因素。我认为它正让人们说：‘哇，如果有一个地方让所有公司都能实时互动，而且我们都获得那个单一真理来源的副本，由于它是加密锁定的，我们可以信任那个来源，那太有趣了。这为我们打开了一扇门，让我们说：‘让我们聊聊这个。’`../Text/notes.html#ch3-en19`\n\
  \n自从她 2018 年 2 月创立该论坛以来，它分成了两个运营小组：原始的美国石油与天然气区块链论坛，专注于能源行业区块链技术的持续学习和人脉建立；以及在 2019\
  \ 年 1 月成立的 OOC 石油与天然气区块链联盟，专注于区块链解决方案的协作开发。当我们与 Hofmann 对话时，开发中的四个解决方案中的每一个都专注于石油天然气行业流程的集成和转型。在这个行业中，某些流程（如地震数据管理、卡车派单、支出审批、投票和合资企业结算交换）是高度碎片化的，且依赖纸质文件。\n\
  \n能源行业在促进更好的协作和对齐机会的愿望方面并不孤立。RCI Bank and Services 的区块链项目负责人 Jean-François Bonald（该公司为雷诺-日产-三菱的客户和经销商网络提供融资和业务）表达了与激励\
  \ Hofmann 建立其小组类似的观点。“从定义上说，”他说，“你不能独自建立分布式账本。联盟使我们能够与其他银行分组 . . . [其中一部分]我们被迫首先对参与规则达成一致，并对如何做出决策达成一致。”他认为，协作方面是关重要的。“如果由一方主导，区块链将无法运行。这关乎打破现有的垄断并开发新的生态系统。”`../Text/notes.html#ch3-en20`\n\
  \n\n新技术带来了各种风险，包括旧系统的退役、基础设施成本、集成成本、系统故障、安全漏洞、可扩展性和速度。每个组织，即使是拥有强大 IT 人才的公司，也面临这些风险。联盟使得汇集风险变得更容易，并通过小组资助概念验证、应用开发和测试实施来限制风险。成员的一个子集根据联盟设定的规则参与，但所有成员共享成果、教训、挑战和最佳实践。区块链行业倡议\
  \ B3i 最初作为一个联盟成立，在这种模式下进行技术协作。该组织随后成为一家私人软件公司 B3i Service AG，由十六家保险市场参与者拥有。它计划部署基于区块链的交易解决方案。`../Text/notes.html#ch3-en21`\n\
  \n联盟还通过促进有助于技术成熟的标准化来限制风险，从而降低行业成本。用于跨境支付的 SWIFT 网络说明了标准如何提供帮助。该网络为银行成员提供了一个相互发送资金的流程和机制。因为\
  \ SWIFT，新加坡的一家银行可以在新加坡市场收盘后向纽约的对手贷出 1000 万美元，并在第二天开盘前收回，所有的成本都比使用私有系统低得多，传输也更安全。标准字面上保持了资金流动。\n\
  \n在区块链领域，随着时间的推移，需要大量且复杂的标准。这些包括法律条款和条件的业务标准；资金标准；数据治理的技术标准；以及实现解决方案之间通信的互操作性标准。欧盟委员会的一项倡议——欧盟区块链观察与论坛旨在促进区块链创新和发展，近期发布了一份报告强调了标准的重要性。`../Text/notes.html#ch3-en22`\
  \ 国际标准化组织和澳大利亚标准协会（Standards Australia）正在探索类似的倡议。`../Text/notes.html#ch3-en23` 在区块链启发的阶段，标准开发将首先关注行业或职内部的共同问题。随着技术的成熟和业务演进以实现完整的区块链解决方案，标准将需要扩展到构建区块链解决方案的各种技术以及运行在其上的合约的细粒度水平。这一切都不是容易或快速的，在治理和商业责任方面存在着重大挑战。\n\
  \n\n\n标准也适用于实践标准。正如前面提到的，区块链的未来来自于去中心化的、完备且增强的区块链解决方案，这些解决方案运行在跨越整个价值链节点的点对点网络上。如果你的交易伙伴、客户和下游供应链参与者正在追求不兼容的方法，那么标准的缺乏将损害所有人的利益。有了实践标准，每个人都使用相同的技术和方法。标准化鼓励参与者对系统进行测试和使用。随着参与者的增加，联盟可以在更快的周期内对解决方案进行迭代和改进，添加吸引更多参与者的新功能。（由于交易量围绕特定解决方案聚拢，这一相同的过程也可能导致中心化程度的增加。如果联盟在一个高度受监管的行业运营并获得了政府监管机构的批准，那么其持续性就几乎可以了。）\n\
  \n标准对风险管理的最后一个益处适用于技术供应商的验证和整合。当联盟为多个成员开发供使用的单一解决方案时，这些技术应用和系统的个人买家就减少了。为了竞争这些项目，供应商必须使其开发流程专业化，并修复其解决方案中的缺陷。联盟合作可能导致的“买方市场”解释了为什么有许多大型企业供应商参与了各种联盟。他们希望确保自己被纳入最终解决方案中。\n\
  \n\n所有组织都有向内和向外的关注。虽然区块链驱动的解决方案可以解决某些后台问题，但你作为领导者，还需要考虑区块链在为你的客户、供应商和更广泛社区面临的挑战提供解决方案的能力。\n\
  \n\n2018 年 9 月，面向保险行业的区块链联盟 `RiskBlock Alliance` 宣布了它的第一个解决方案：`Mortality Monitor`（死亡监测）。`Mortality\
  \ Monitor` 为人险领域设计，扫描社会安全数据以验证保单人的去世，并将信息传递给相关的人险公司。其目标是数字化、简化和验证这一流程，以便亲属能够更快地获得人险理赔，并拦截欺诈理赔。该解决方案还保护了可能不知道亲人拥有人险保单的家庭成员。\n\
  \n`Mortality Monitor` 只是 `RiskBlock` 计划构建并为其区块链平台 `Canopy` 成员提供的区块链灵感解决方案之一。正如 `RiskBlock\
  \ Alliance` 在最近的会议中向我们传达的那样，其愿景是为保险和风险管理行业建立权威的区块链平台，然后开发运行在其之上的互操作解决方案。`RiskBlock`\
  \ 的成员中已经有多许多信誉良好的保险公司，包括 `Geico`、`Liberty Mutual`、`Munich Re` 和 `Nationwide`。\n\n\
  我们强调 `RiskBlock` 不仅是因为其愿景的远大，还因为其初始解决方案的重点。正如 `Isabel Group` 计划用于 `KYC` 合规的解决方案，`RiskBlock`\
  \ 的第一个应用程序关注于为所有人产生成本的后台问题。这非常常见。在我们对书中对联盟活动的审查中，我们看到目前对后台流程有显著且当前的关注，这很有道理。易受欺诈的、基于纸的流程是组织明显的痛点。解决这些问题可以通过后台效率的形式产生广泛的利益。然而，面临新数字进入者压力的领导者可能不想将他们的实验限制在基于流程的挑战上。相反，他们可以探索多元化的解决方案，包括对客户有直接影响的解决方案。他们需要将目光从内向外转向从外向内。\n\
  \n\n从外向内的解决方案通过卓越的产品设计、改进的客户体验或新的业务模式来解决未满足的客户需求。联盟通常不关注这些解决方案，因为成员将它们视为对其竞争优势至关重要的差异化。公司不希望联盟调解这些关系。\n\
  \n尽管面临显而易见的挑战，我们仍然认为，无论是个人企业还是联盟都无法仅仅关注后台的、向外的的问题。有太多的创业活动和来自数字原住民的竞争压力是不容忽视的。以汽车行业为例。区块链努力正在汽车价值链的各个孤岛中进行。这些努力包括上述\
  \ `雷诺`（Renault）和 `大众`（Volkswagen）为了获取车辆历史的开发，以及各种汽车保险公司改进理赔处理的努力。这两组努力都可能降低公司的直接成本，并可能为客户带来成本降低。但这些示例每个只关注汽车价值链的一部分，这种做法耐人寻味。保险公司有动力减少其所在生态系统部分的低效；制造商也是如此（在其所在部分）。但这些努力能帮助客户（即司机）吗？\n\
  \n司机通过一个视角看待所有与驾驶相关的问题——即试图到达想去地方的旅行者视角。从那个角度来看，汽车制造商、汽车修理厂、保险公司、加油站或电动汽车充电站、维护道路和收取过路费的交通部门、市政停车库和其他参与者都是同一个系统的一部分。只要每个孤岛是独立的且缺乏与网络的\
  \ `IoT` 集成，价值链的任何部分都无法对其他部分的运营提供太大帮助。但随着每个部分变得越来越智能，交通将变得更加整合，各个独立的参与者如果希望在市场上保持相关性，就必须协作。\n\
  \n这种智能汽车的未来非常接近。在十年内，车内的智能传感器能够与沿行驶路线的传感器进行通信以交换信息。德国公司 `博世`（Bosch）在德国政府的支持下成立了一名为\
  \ `StreetProbe` 的初创公司，以实现这一概念的一个版本。数据点如行驶状况（`减速；结冰了！`）；行驶距离（`如果你留在该车道，过路费为 $3.60，切换到快车道为\
  \ $5.00`）；以及停车可用性（`您的目的地附近有三个空位；您想预留其中一个吗？`）可以提供给车辆及其司机以做出决策。其中一些交换已经通过由人类调解的孤立过程发生。例如，司机可以从车载导航系统获知沿途的事故，车载感应器允许收费站注册车辆数据并收取正确的过路费。然而，这些系统之间并不相互交互，而且仍然需要大量的人为干预才能工作（例如，你必须在导航系统中输入目的地）。随着\
  \ `IoT` 成熟，人类的输入将不再必要；市政当局已经在为那个未来做准备。\n\n\n\n当这些传感器被用于执行交易时，增强的区块链网络可以促进支付和其他由价值驱动的交互，例如预留并支付停车费以及从电网取电。当自动驾驶车辆在多个所有者之间穿梭或在共享出行网络中运行时，该网络变得更加不可不可缺。31\
  \ 在那种共享环境中，汽车的信息系统将访问每位乘客的身份；记录每个人在什么时候行驶了多少里程；分配能源费用、拥堵税、按小时计算的保险费、通行费支付和事故索赔；并执行交易。\n\
  \n最近成立的移动出行开放区块链倡议（Mobility Open Blockchain Initiative）通过其用例列表指向了这一未来，包括共享出行、基于使用的保险和自动机器支付。其成员包括保险公司、汽车制造商和区块链技术提供商。我们提到这一倡议，与其说是为了它正在开发的解决方案（据我们所知没有正在运行的系统），不如说是因为它通过更广泛的汽车生态系统对出行体验的自内而外的关注。正如该倡议首席执行官克里斯·巴林格（Chris\
  \ Ballinger）在 2018 年 5 月接受 CoinDesk 采访时提到的：“推动[区块链解决方案]前进需要一个去中心化的业务网络。你真的需要通用的标准和方式来让汽车进行通信、识别身份并进行支付。但如果每家汽车公司都试图开发自己的汽车钱包或自己的通行费支付方式，或提供共享出行服务，这根本行不通；那是巴别塔。”32\n\
  \n巴林格指出，如果联盟要在区块链启发阶段之后在区块链领域发挥作用，就将经历一个不可避免的演变。正如组织必须关注可以利用数字机会的完备区块链解决方案一样，联盟——如果它们想保持相关性的话——也必须促进向去中心化的组织转型。\n\
  \n\n到本章为止，我们一直关注联盟在开发受区块链启发的解决方案方面所扮演的角色。我们还建议，它们可以促进市场向完备区块链解决方案转型。然而在现实中，各种组织在组建联盟时都面临着不可否认的挑战。委婉地说，在同一个行业内直接竞争的企业并没有良好的良好相处历史。相反，如果你回溯过去积极的联盟案例，这种趋势往往倾向于失败而非成功。\n\
  \n印度贷款业的经验具有启示意义。将许多银行聚集在一起为大额贷款提供资金的贷款模式曾被推崇为扩大信贷的同时限制风险的方法。然而，现实经验表明，银行之间并没有及时地共享信息。例如，当一家银行获知借人违约时，它并不总是与联盟成员共享该信息。信息的不共享导致了欺诈、信贷违约和其他增加参与者风险的事件。33\n\
  \n印度银行经历过的那种**信息囤积**行为往往解释了为什么联盟会失败。问题的根结在于信任。如果某些参与者留存信息或其他资产——例如技术访问权限、专利、资源或人才——那么联盟就无法公平地运作。当然，共享在制度或技术上并不总是容易的。在石油或金融服务等高度监管的行业中，联盟必须遵守严格的客户隐私法。由于这些行业过去引起了关注反垄断合谋的监管机构的不愿关注，领导者可能认为，在共享与越越监管边界之间寻找平衡点的努力太难了不值得费心。\n\
  \n即使在监管不是问题的情况下，组织也难以长期合作。我们的同事怀特·克拉帕奇（Dwight Klappich）与我们分享了他在供应链行业促进合作的经验：\n\n\
  > 我在 1992 年待过一家供应商，他们建立了一个运输系统，可以同时优化入货和出货货物。二十六年后，公司在优化出货货物方面取得了非常成功，但只有极少数公司成功实现了入货货物的自动化。为什么？入货运输是一个生态系统赋能和治理挑战，那里有成千上万的供应商和分布在许多地理位置的数百个物流提供商。将这些参与者接入一个平台已经够难了，但如何让供应商持续地做他们应该做的事、在他们应该做的时间、用他们应该的方式，以及时且一致的方式呢？这几乎是不可能的。如此反复。最初这样做非常困难，长期维持供应链完整依然困难，因为既有关系是脆弱的，需要不断的照料和维护。技术不是问题。再次，我们在\
  \ 1992 年就有技术，今天甚至有更好的系统，但采用率仍然很低，成功率更低，这很大程度上是因为生态系统赋能问题。34\n\n未来，这种选择可能会被你剥夺，这意味着物联网、人工智能和其他实现自动化的工具可能会比企业自主选择更早地将它们推在一起。企业可能被迫以反映客户体验的方式整合其产品或服务，或者向能够去中间化的权力妥协。为什么不主动应对挑战呢？联盟提供了一种在结构环境中协作的方式。为了最大限度地利用关系，领导者需要理解几个关键业务问题。\n\
  \n\n领导者应该考虑任何开发的区块链解决方案可能属于哪种原型，并以此为背景对图 3-1 的问题提问。这些问题可能会影响每个类型的体验，反之亦然。条形图反映了每个原型相对于每个问题的内在风险程度。例如，一个由于恐惧症（FOMO）而设计区块链的联盟没有目标（因此它们在该问题上的风险最大）。而一个拥有区块链原生解决方案的联盟在治理方面具有极佳的清晰度（低风险）。通过对这些问题的单独或组合的回答，你可以选择最小化风险和最大化机会的关系。\n\
  \n\n缺乏清晰度导致的联盟风险程度，按区块链原型划分\n\n![image](img/Figure_3.01.png)\n\n\n你的组织对区块链对客户战略意味着什么有愿景？你知道如何在市场中差异化你们吗？你想追求哪些新机会？不同的联盟在帮助你实现企业目标方面可能更好或更好，因此在加入联盟之前，你应该知道这些问题的答案。\n\
  \n尽管如此，即使你和组织对目标很明确，许多区块链联盟并非如此。这些联盟似乎是由对做*任何事*的普遍兴趣驱动的。它们可能仍然迅速增加成员，但如果成员的目标迥异且投入程度不一致，联盟在达成共识方面将面临挑战。\n\
  \n\n\n同样要警惕那些规模过大或定义过于宽泛的联盟。在识别问题与对细微差别和根本原因达成足够共识以探索区块链作为解决方案之间，存在着巨大的鸿沟。对于复杂问题，成员往往不愿分享，且利益相关者的需求迥异，这很难完成任何工作。从经验来看，目标明确、关注点较窄的联盟比意图模糊的宽泛联盟更具效率。\n\
  \n\n联盟参与者为协作带来了各种专业知识。为了创建一个鼓励参与和开放的环境，联盟需要明确哪些知识资产属于参与机构，哪些属于联盟。出于此，知识产权的创建、捐赠和变现应当有明确的定义。\n\
  \n\n对于联盟而言，资金是一个持续的挑战，它们必须在可持续资金的需求与对访问和控制的预期之间平衡。`R3` 的经验可以提供启发。该组织最初从少数股权利益相关者开始，后来扩展到订阅模式，允许成员扩大到超过数百名成员和合作伙伴。拥有大量成员为\
  \ `R3` 提供了更多资金选择，但这些选择也带来了目标多样的利益相关者群体。考虑一下技术供应商和专业服务公司在涉及用户的联盟中应扮演什么角色。你如何评估不同成员的贡献并对其给予补偿？支付结构应该是怎样的？平衡灵活性与可审计性至关重要。\n\
  \n\n联盟需要清晰的治理规则。所有成员拥有平等的投票权吗，还是分层成员？成员为投票池付费，还是通过选举产生投票职位？规则是基于多数原则、多元化还是一致原则？谁负责联盟运营？管理团队对谁负责？委员会是如何构建的？是非营利组织还是营利企业？如何仲裁反对或疑虑？如何考虑法规？哪些行业和管辖区的法规必须被考虑？规则是适用于整个联盟，还是仅适用于某些团队或倡议，如\
  \ `Hyperledger` 项目所示？随着业务和技术背景的变化，如何更新规则？无论这些答案如何，联盟都可以以多种方式使用区块链解决方案来运营组织、记录并执行规则。\n\
  \n\n了解谁负责或在联盟中有发言权很重要。决策是如何做出的？谁拥有投票权？如果决策或流程违反了政府监管机构或利益相关者的规定，谁来负责？正如我们提到的，联盟有时可以作为中心化主体运行。它们允许多方整合资源以创建共同的数字解决方案。然而尚不清楚它们是否也集成了责任。如果一个流程失败，共同开发是否会产生共同责任？监管机构对什么或谁拥有监督权：是对联盟还是对成员机构的资产负债表？区块链解决方案无法解决你的问责困境，但它们的记录对于处理争议和明确问责规则非常有价值。\n\
  \n\n了解谁负责或在联盟中有发言权同样重要。决策是如何做出的？谁拥有投票权？如果决策或流程违反了政府监管机构或利益相关者的规定，谁来负责？正如我们提到的，联盟有时可以作为中心化主体运行。它们允许多方整合资源以创建共同的数字解决方案。然而尚不清楚它们是否也集成了责任。如果一个流程失败，共同开发是否会产生共同责任？监管机构对什么或谁拥有监督权：是对联盟还是对成员机构的资产负债表？区块链解决方案无法解决你的问责困境，但它们的记录对于处理争议和明确问责规则非常有价值。\n\
  \n## 谁有权发言或获得声誉？外部沟通的清晰度\n\n成员需要通用的沟通规则。在为本书进行研究时，我们采访了一些并不 100% 同意他人所言的联盟成员。这种不一致的信息可能会损害联盟的信任基础，并产生法律和商业影响。务必确保你知道沟通规则是什么。\n\
  \n\n区块链联盟经常进行测试或试点项目，这些努力中的许多涉及第三方技术供应商和服务提供商。对外部知识的需求引发了关于如何选择和支付技术的重要问题，以及如何避免强势成员的供应商偏见。联盟如何与所有成员分享实施经验和最佳实践？谁为单个企业级的解决方案集成付费？解决方案将如何适应现有的系统和流程？成员使用联盟开发的解决方案有何义务？将适用哪些技术标准？技术选择对单个企业的安全政策产生什么影响？最关键的是，单个企业的技术债会增加吗？³⁶\n\
  \n\n\n\n\n在短短几年内，成立了许多财团，以促进特定行业、国家和技术平台的利益。在保护中心化运营和价值链方面有既得利益的强大将建立财团，以实现市场主导地位，并推广锁定参与者的“特洛伊木马”解决方案。\n\
  \n### 你应该如何应对？\n\n与敌人结盟需要仔细考虑，这取决于你对组织的愿景以及你打算如何利用区块链。首先，确保你的组织关于区块链战略与你所在行业或地理区域财团的意图和参与模型相匹配。其次，将潜在的财团按其区块链原型——恐惧错过型（FOMO）、特洛伊马型、机会型、进化型或原生型进行分类，并决定你可能探索哪些类型。最后，通过弄清相关财团的九个重要考虑因素来增加你的机会：目的、IP\
  \ 所有权、资金、治理、问责制、支付结构、外部沟通、技术采购和退出策略。\n### 接下来是什么？\n\n我们预计财团及其开发的解决方案将沿着去中心化连续体演进。随着它们的成熟，财团将考虑代币和代币化如何改进它们的解决方案。在下一章中，我们将探索代币化以及它如何驱动数字价值的新形式和增长。\n\
  \n![image](img/part2.jpg)\n\n代币实现了价值交换，并且几个世纪以来一直如此。它们可以追溯到两三千年前，当时非洲和亚洲贸易网络中使用贝壳作为一种支付形式。这些贝壳作为物理装饰品具有内在价值，随之而来的金银币也是如此。随着货币和银行系统几世纪的演变，具有内在价值的代币被法币所取代，法币价值由政府定义。¹\n\
  \n法币以经济稳定和安全的形式带来了广泛益处，但它也有局限性。对于数字环境而言，最相关的缺点是其物理形式和面额——法币交易有字面上的低限（美元面额为 0.01\
  \ 美元），由于全球支付系统底层中心化的性质和昂贵的基础，实际低限要高一些。²然而，随着设备和传感器能够交换单个数据片段、瓦特能量或几分钟注意力，小额交易变得越来越普遍。这些数字化的、基于机器的微交易需要在宏观范围内实时执行，这不是传统支付系统的设计初衷。\n\
  \n这些局限性在区块链脱颖而出很久以前驱动了人们对数字代币的拥抱。从 21 世纪 0 年代开始，撒哈拉以南非洲的城市居民开始向住在偏远农村庄的家庭成员发送手机分钟而不是现金。³\
  \ 几年后在津巴布韦，在恶性通货胀严重贬值了国家货币后，店主开始提供分钟而不是零钱。⁴ 当作为贸易单位时，手机分钟变成了价值代币，其原始用途之外还有其他用处。\n\
  \n这种灵活性对于用户来说是一种吸引人的品质，尽管发行者可能并非如此。对代币（包括加密货币）兴趣的爆发表明需求一直在增长。本章阐明了对区块链感兴趣的业务领导者无论存在噪音和潜在担忧，必须拥抱代币的原因和方法。在讨论区块链的真实业务时，我们对多种代币的价值提供了更广泛的论点。我们关注代币和代币化（使用代币创建和表示资产）如何在区块链中运作，为创造和参与者创造利益。我们展示了代币如何驱动数字业务转型、获取新资金并创造新市场。同样，我们强调了代币作为支付手段、交换机制以及奖励和激励参与者的工具的灵活性，让他们控制并变现个人资产。但买家要小心：代币也是数字平台和进一步市场整合的有用工具。为了解释为什么代币既能实现非数字公司的数字化转型，又能增强数字平台的力量，我们从解释数字环境中已经存在的不同类型代币开始，并证明它们作为区块链一部分的持续发展将驱动数字价值\n\
  \n理论上，数字环境中的代币类型可以与价值来源一样多。在探索它们在区块链中的特定用途之前，我们对代币进行泛泛定义，提出了以下四个类别：\n\n*法币代币*代表中央发行的政府货币，如欧元、美元或人民币，用于促进商品和服务的交换。这些代币最为人知的是它们的物理形式，包括纸币和硬币、贵金属和大宗商品。这种物理形式限制了它们在数字环境中的直接使用。\n\
  \n*过程代币*通过封装在数字环境中使用它们所需的流程来扩展法币的范围。例如，EMVCo 代币通常位于智能手机内部，代表银行、借记卡或信用卡账户信息；这些用于在远程环境中提供便利交易。同样，当用户点击`使用您的\
  \ Facebook 登录`功能时，Facebook 访问令牌会发放给第三方应用程序；这些代币同样封装了用户的登录凭据。\n\n\n\n\n\n`Complementary\
  \ tokens`（互补代币）在封闭或其他受限环境中作为交换媒介。示例包括航空公司的奖励积分、酒店忠诚度计划，或知名品牌如 `Starbucks Stars`\
  \ 和 `Uber cash`。其他例子还有数字货币，如 `Amazon coins` 或 `Q coins`。英国的 `Brixton` 等城镇也发行了互补货币——在这种情况下是\
  \ `Brixton pound`——用以支持本地小微企业。另一个互补货币的地理案例是日本的 `fureai kippu`（交流票），这是一种人们在志愿者慈善活动时获得的社会服务货币。从历史上看，`Complementary\
  \ tokens` 填充了 `fiat tokens`（法定代币）由于经济和监管原因，未能就其业务条款提供足够激励的空白。\n\n`Cryptocurrencies`（加密货币）是数字原生货币，替代法定货币并处理代币，可用于创建新形式的资产。加密货币有形式。`Utility\
  \ tokens`（实用代币）旨在作为一种为产品或服务的开发筹资的方法，并作为获取解决方案的机制。`Security tokens`（证券代币）让持有人拥有发行实体的股份，就像股东持有上市公司股份一样。`Stablecoins`（稳定币）是价值挂钩在第二种资产（例如法定货币）、上市商品或另一种加密货币上的加密货币。\n\
  \n加密货币十年的历史一直受到投机和操纵的困扰，这通常发生在 `security tokens` 和 `Initial Coin Offerings`（代币首次发行）的背景下。然而，欺诈行为的高曝光不应毒害整个类别。加密货币对于创建新形式的数字资产并建立新市场是必要的。例如，加密货币使参与者能够以数字形式代表流动性差的物理资产、对其进行代币化并交易。加密货币还可以交易数据单元、证书或知识产权。加密货币类别包括通过\
  \ `blockchain solution` 发行或交换的所有类型的代币；当特定的加密货币示例对整个类别给出误导性印象时，我们会注明。\n\n\n为了了解不同类型的代币在数字环境内部是如何运作的，让我们来看一个像计划假期一样常见的现实情况（`图\
  \ 4-1`）。想象一下像 Travelocity、Expedia 甚至 Facebook 这样的数字平台将使用代币来支持假期规划。如果是这样，规划将像现在一样开始，由客户对何时、何地以及和谁一起旅行做出基本决定。客户可能还会考虑其他细节，如酒店或航空偏好、喜欢的食物种类或餐厅，以及有趣的游览。在实体世界中，旅行者与他们的人类旅行代理分享这些信息。在互联网上，他们使用旅游中介网站上提供的模板。这些网站充当数据经纪人，因为它们使用客户信息来吸引各种旅游孤岛中的营销人员并产生收入。在我们的代币化环境中，关于旅行者计划的信息将发送这些数据旅行经纪人之一（`图\
  \ 4-1` 中的第 1 步）。\n\n\n* *\n\n中心化数字背景下的代币\n\n```\n![Figure_4.01.](img/Figure_4.01.png)\n\
  ```\n\n* *\n\n收到客户数据后，数据经纪人将获取信息并以代币形式将其捕获，从而创建 `data tokens`（数据代币）。在我们的示例中，代币存储在数据经纪人控制的\
  \ `digital wallet`（数字钱包）中。可能存在不同的代币代表酒店或航空偏好、喜欢的食物种类或餐厅，以及有趣的游览。在第 2 步，旅行者从数据经纪人处接收\
  \ `data tokens`。\n\n在第 3 步，旅行者使用 `data tokens` 预订酒店。在第 4 步，旅行者使用 `data tokens` 预订机票。在第\
  \ 5 步，旅行者使用 `data tokens` 支付游览。在第 6 步，旅行者使用 `data tokens` 与朋友分享。\n\n\n到为止，我们关注的是在缺乏区块链优势的情况下，数字和物理环境中形成的各种形式。此外，当代币用于区块链时，它们被设计用于履行三个目的至少一个。\n\
  \n首先，它们可以为发行者实现价值最大化。当代币的目的是价值最大化时，代币鼓励客户采取直接或间接有利于发行者的行动。`Reward points`（奖励积分）、`identity\
  \ tokens`（身份代币）和 `tokenized KYC information`（代币化的 KYC 信息）都是公司如何对现有资源进行代币化并在 `blockchain`\
  \ 中管理它，以便于发行、跟踪并允许所有者使用的示例。目标是增加客户的便利性或减少摩擦。在假期示例中，当酒店为接受额外报价的旅行者提供代币作为奖励时，这些代币实现了价值最大化。\n\
  \n其次，代币可以代表价值。`Cryptocurrencies` 可以被视为价值的表示。最直白地说，`bitcoin` 代表了比特币 `miners`（矿工）运行用于验证用户和验证交易的\
  \ `algorithm` 所使用的电力和计算资源的价值。通过 `bitcoin`，由于代币也是矿工参与运营网络的激励，代币也实现了价值最大化。\n\n虽然 `bitcoin`\
  \ 也是某些数字商业网站接受的支付方式，但大多数 `bitcoin` 交易是由货币投机者完成的，他们看重货币相对于美元或其他外汇的价值——换句话说，看重它在 `fiat`（法币）中代表的价值。除了\
  \ `bitcoin` 之外，允许 `blockchain network` 参与者交易现实资产或份额（例如能源合作社、投资证券或房地产）的加密货币也代表价值。回到旅行示例，当供应商对酒店房套餐等提议进行代币化时，他们正在创建代表其持有人价值的代币，因为这些代币可以交换资产或服务。\n\
  \n\n\n\n最后，代币（tokens）可以结合区块链创造一种新的价值。例如，代币允许参与者将以前无法变现或流动性差的资产变现。正如台北富邦银行行长郑润（Roman\
  \ Cheng）所强调的：“区块链创造了引入资产支持型代币的能力，例如针对大型企业买家供应链生态系统中的不同层级供应商所产生的应收账款。因此，它为这些[中小型企业]创造了强大的金融工具。”⁸\
  \ 另一个实现这一目的的代币及时示例可以在专注于数据交换的新兴数字资产市场中看到。这些市场中的一些将允许用户将其个人或公司数据代币化，并根据其市场价值积极出售或与获得批准的方共享。\n\
  \n例如，Edgecoin 拥有一种针对教育证书的区块链解决方案，允许大学将其学生记录数字化，并为毕业生提供经过认证的代币化副本，以便与雇主或其他机构共享。另一个使用代币促进数据资产交换的区块链提供商是\
  \ ClimateCoin，这是一个非营利组织，旨在让机构和政府开发的碳抵消市场个人也能触及。ClimateCoin 的 CO2 代币可以由任何人购买，其收益用于投资参与碳抵消活动的公司，例如可再生能源发电。\n\
  \n无论代币的目的是价值最大化、代表价值还是创造一种新价值，对于许多爱好者来说，代币都是区块链的核心意义，因为对特定形式价值的需求（代币所代表的价值或其创造的价值）驱动了网络的创建和对网络的参与。代币化资产的大小、流动性或价值并不受高或低端的限制，网络参与者可以是机器。因此，代币使经济活动急剧扩张，理论上包含了存在的每一个人、机器以及每种可交易资源。\n\
  \n\n在像规划假期这样简单的交易中，发挥作用的各种代币类型和目的明确表明，代币的多样性远比你根据当前市场对加密货币作为法币替代品的关注所预测的得多。我们理解这种将多种代币混为一谈的能，因为比特币区块链是第一个获得主流关注的分布式账本，也是第一个运行的完整区块链解决方案。但设计用于替代法币的加密货币只是数字环境中非常有用的代币类型。\n\
  \n尽管如此，首次代币发行（ICO）的热潮增加了困惑，并值得简要提及。ICO 俗称在开源环境中为基于区块链的倡议筹资金。作为 ICO 的一部分，公司在区块链平台上发行代币，并使用智能合约（自动执行协议条款的代码行）来管理代币发行并定义规则。尽管货币投机和诈骗是许多\
  \ ICO 的考虑因素之一，但那些带有真实意图发行的 ICO 预期代币持有者将获得开发中的平台或能力的权限。通过这种方式，代币对发行者来说扮演了双重角色：它代表价值，因为买家用法币支付费用；它可以通过吸引用户使用区块链解决方案来创造价值。我们将在第\
  \ 6 章中详细介绍 ICO 和金融去中心化。\n\n稳定币（Stablecoins），或稳定型加密货币，是另一个困惑的来源。它们的目标是匹配加密货币的数字优势，但没有困扰比特币等市场交易加密货币的波动性，这种波动性令担心风险的企业用户望而却。稳定币试图通过将其价值挂钩到法币（如美元）并在链外持有一定量的储备货币来缓解波动。稳定币发行者必须调整代币供应以匹配储备。由法币支持的稳定币往往是中心化的，因为其的目标货币变量是中心化的。它们的使用将一个中心传统行为者（政府或其代理，即央行）增加了另一个——而且后者可能比央行不稳定或声誉较低，因此信誉度较低。为了避免固有的中心化，稳定币可以将其价值挂钩到加密货币组合上。另一种选择是通过算法和智能合约复制央行的行为，以管理波动。\n\
  \n尽管稳定币有其支持者，但到目前为止，它们尚未实现与其底层法币的完美价格等值。最新的受害者是 Tether 币，由于市场怀疑该网络缺乏声称的美元储备，它失去了与美元的等值。⁹\
  \ 然而，市场尚未放弃稳定币。新的交易所于 2018 年底推出，提供了管理波动的替代方法。¹⁰\n\n\n现在我们已经为区块链中代币的不同类型和目的奠定了基础，让我们看看代币和代币化如何在盖特的区块链光谱上演进。\n\
  \n市场中受区块链启发的解决方案很少包含代币。然而，当代币成为受启发的设计的一部分时，它们通常服务于有限的目的，并可能整合发行者的权力。这种局限性降低了代币的效率，因为理想情况下，代币不应该是静态的；它们的意义在于适应性。企业可能会为了某个特定目的发行代币，并随着采用和交易量的增加而扩大该目的。客户计划可以驱动这种扩张，如上面的\
  \ `Q` 币示例所示。或者发行者可能从一开始就设计在不同条件下的代币使用。\n\n在图 4-1 所示的假期示例，在酒店获得的奖励代币变成了旅行者用于支付产品或服务的货币。如果该酒店与同城的其他供应商有合作伙伴关系，这些代币也可以在其他地点作为货币接受。你已经可以在简单代币环境之一的背景下想象这样的场景：航空公司奖励计划，它们现在就可以兑换发行者和计划合作伙伴的服务。在受区块链启发的解决方案内部，这种代币可以被高效地跟踪和存储。区块链甚至允许计划合作伙伴作为网络节点参与，并允许代币持有者根据网络规定的业务规则兑换任何组成的服务。\n\
  \n新加坡航空正在开发此类路线的私有区块链，使其 `KrisFlyer` 里数对持有它的旅行者更有意义，并让兑换合作伙伴参与。旅行者可以将里数兑换为 `KrisPay`\
  \ 代币以为数字钱包资金，然后使用该钱包在合作伙伴地点支付服务。¹¹\n\n\n\n\n\n其意图是让代币作为跨提供商和产品类别的奖励结算货币。客户将受益于更灵活的兑换规则，包括将奖励转移给家庭成员和朋友的可能，这意味着代币的流通性增强。相反，商户将从新业务中受益，并根据对客户需求的洞察，获得开发新产品的潜力。通过这种方式，区块链中的代币变成了一种动态且多用途的交换媒介。此类代币可用于受区块链启发的演进解决方案，以促进向完全区块链解决方案过渡。除了奖励代币外，旅游业对区块链技术也表现出极大兴趣。国际航空运输协会正在探索如何创建一个名为\
  \ `Travel Grid` 的区块链平台作为一种服务，让多种航空相关应用程序能够在上面运行。例如机场内的零售应用、航空公司票务、供应链管理以及其他功能。其意图是提高乘客的体验，并在这一价值\
  \ 2.7 万亿美元的航空业中鼓励生态系统的参与。\n\n旅游领域在探索利用代币以促进去中心化方面并非孤单。电竞也在拥抱代币——我们接下来讨论这一点。\n\n\n\
  游戏行业长期一直是数字实验的试验场。在区块链和比特币出现很久以前，就有了如 `Second Life`（2003 年发布）这样的虚拟世界和如 `World of\
  \ Warcraft`（2004 年发布）这样的大多人在线游戏。这两款游戏都有自己的数字货币，玩家通过这些货币兑换数字资源和现实世界资源。就像现实世界一样，游戏经济也面临真实的经济问题，如资源囤积、不平等、货币贬值、数字货币黑客攻击、银行挤兑和欺诈。这种高科技、娱乐、经济和社会实验的汇合，使得游戏行业成为代币创新的热床和值得关注的地方，考虑到游戏玩家的专业知识以及他们历史上倾向于在游戏内开发超出货币原始用途的货币倾向。在这片肥沃的土地上，电竞——锦赛驱动的视频游戏竞技——正成为区块链创新的领先竞争者。\n\
  \n电竞的全球观众人数估计为 38 亿。该市场结构跨越了全球游戏开发者社区（创意工作室和数千万名独立游戏设计师）、发行商（如 `Activision` 和 `Electronic\
  \ Arts`）、分销商（`Google Play`、`Apple Store`、`Microsoft` 以及游戏专用网站，如 `GameStop`）、在数百款游戏中进行竞技的玩家（`Clash\
  \ of Clans`、`Fortnite`、`Call of Duty` 等）以及平台（主机、、PC 和移动端）。同样，电竞也容易受到困扰所有高交易量环境的问题。该行业面临欺诈、高转换成本、游戏设计师或玩家获得报酬前的长时间延迟，以及数字平台收取的高昂费用等挑战。\n\
  \n几位参与者正考虑在区块链上实施代币以解决这些挑战。其中一个目标是帮助电竞进化为更专业的结构，例如由国际足联（`Federacíon Internationale\
  \ de Fútbol Associación`，`FIFA`）和其他组织建立的模型。这种专业化结构的一种路径是让电日在大型数字游戏业务的力量下整合。这些包括游戏发行商，如\
  \ `Activision`（其拥有 `Call of Duty`）和 `Electronic Arts`（其拥有极受欢迎的电竞系列 `FIFA 19`、`Madden\
  \ NFL 19` 和 `Battlefield`）。这两家发行商都为某些作品提供了游戏内代币系统。另一个整合力量是 `Amazon`，它有一个基于 `Amazon\
  \ Web Services` 的电竞平台名为 `GameOn`，游戏开发者通过它互动以举办锦赛、组成联赛并向玩家支付费用。`Amazon` 于 2013 年推出了\
  \ `Amazon coin` 虚拟货币，作为其数字产品生态系统的游戏和奖励货币。从那时起，市场上充分猜测 `Amazon` 计划推出 `Amazon 加密货币`，尽管该公司到\
  \ 2019 年年中尚未采取此行动。在其他数字平台上，当然，腾讯拥有其 `Q 币`，玩家可以在其生态系统的所有游戏中使用它。\n\n这些平台正面临来自游戏行业内部演变的区块链初创公司的竞争。游戏公司\
  \ `DreamTeam` 是一个在 2017 年推出的、资金丰富的例子，它拥有电竞锦赛组织者 `Major League Gaming` 和 `Electronic\
  \ Sports League` 的强大背景。`DreamTeam` 专注于 `League of Legends`（1 亿玩家）和 `Counter-Strike:\
  \ Global Offensive`（1200 万玩家）。在其区块链启发的平台上，通过使用 `DreamTeam token` 防止不付款和欺诈。`DreamTeam`\
  \ 到 2018 年底拥有 100 万玩家。\n\n另一个代币化解决方案来自 `GameCredits`，它于 2015 年推出以解决电竞中的欺诈和支付延迟问题。`GameCredits`\
  \ 的一个关键目标是增加向开发者的支付金额和速度，激励他们在 `GameCredits` 商店提供游戏。该公司表示，支付比例可以从 70%（`Google Play`\
  \ 和 `Apple Store` 的典型份额）增加到平台的 90%。\n\n`DMarket` 通过基于区块链的游戏代币进一步远离中心化平台模型，该代币旨在跨游戏和平台使用，因此一个游戏的资产可以购买另一个游戏的资产。通过连接\
  \ `Steam`（一个拥有数百款游戏的分发平台）推出，`DMarket` 在游戏经济中所做的正如我们在本文之前假设航空奖励可能发生的情况。其代币可以跨属性和供应商使用，从而实现更高的灵活性、忠诚度和回购。\n\
  \n最后一个值得关注的游戏币来自 `Enjin`，这是一个允许用户创建自己的代币以支持其游戏的平台。为了限制欺诈和重复计算，`Enj coin` 使用了一种设计元素来验证玩家是否拥有购买的物品。\n\
  \n电竞的社交属性凸显了社交媒体与游戏之间的交叉。允许观众奖励玩家的代币在社交媒体 `credits` 中有所回响，这些代币被设计用于社交媒体平台，以允许参与者通过点赞变现。有许多新的区块链社交媒体平台旨在颠覆\
  \ `Facebook`、`YouTube` 等，并采用奖励参与者帖子和点赞的模式。例如，`ConnectSocial` 在用户上传内容时发放奖励；该公司的愿景是促进影响者与他们选择的品牌之间的积极互动。另一个区块链社交媒体网站\
  \ `Steemit` 也会在内容创作者上传内容时奖励一定数量的币，并随着参与者的观看和点赞获得更多。将这一概念扩展到电竞，平台可以根据获胜、在电竞观众中的受欢迎程度或体育精神奖励玩家。再次扩展到零售或体验品牌，可以通过奖励客户发布使用产品的照片来培养品牌忠诚度。\n\
  \n\n\n\n高用户量和快速创新使得游戏行业成为创新代币开发的测试场，在这里，可以观察到用户如何推动代币的适应性，从而强化了去中心化的模型。从可用于多个游戏的\
  \ DMarket 代币，到 Enjin 的定制代币开发方法，这些公司及其他公司为亚马逊、谷歌或苹果的生态系统方法提供了极具吸引力的替代方案，并为其他行业的公司开辟了新模式。\n\
  ### 数据变现\n\n代币化还可以通过数据变现产生奖励。²² 早期关于大型数字公司捕获并暴露给第三方（例如剑桥分析公司）或被黑客攻击（例如 Equifax 和万豪豪酒店及度假村集团）的海量数据的揭露，已激励了企业和个人去获取对数据的控制权。²³\
  \ 这种对数据控制的关注已是蓄谋已久。互联网用户日益意识到，他们的数字行为正被捕获、存储、分析并出售给广告商和产品开发者。随着物联网（IoT）的收集与数字化，以及人工智能对物理和数字世界信息的分析，这个数据宝箱现在变得更加庞大。\n\
  \n区块链技术还使用户能够务实地评估何时、是否、何地、与谁以及如何用数据交换价值。新的新的面向数据的区块链解决方案正在开发中。这些解决方案利用代币对数据资产进行定价和交易。在区块链上，代币还可以允许在全球范围内进行去中心化的点对点数据交换，这种机制使数据所有者能够在明确许可同行查看或使用其数据之前，保持其所拥有数据的私密性。\n\
  \n一种为用户提供更多数据控制和监督的区块链解决方案来自 Datawallet，这是一家美德初创公司，拥有一种基于代币且受区块链启发的解决方案和移动应用程序，允许参与者同意与营销人员共享部分个人信息，以换数字交换代币。Datawallet\
  \ 对参与者的承诺是他们将获得报；对广告商的承诺则是信息将比他们从某些数据经纪处获得的信息更及时、更相关。（数据经纪人从在线资源和政府人口普查数据库（如车辆管理局）中混合提取信息，其中许多来源存在不准确和显著的时间滞后）。Datawallet\
  \ 对其卖给广告商的数据进行匿名化。²⁴\n\nDatawallet 的解决方案使用智能合约来捕获并执行数据所有者的意图和同意。通过这种方式，用户与其数据连接起来，所有权记录在区块链上。这些数据市场的基本要求。从合规角度来看，跟踪数据所有权和同意也为组织遵守隐私法规提供了一种方法，例如欧盟的《通用数据保护条例》（`GDPR`）。例如，在区块链中，从根信息（个人数据）到账本中相应记录的链接可以被切断。由于这种分离是审计的，参与者可以确认已按照\
  \ `GDPR` 的尊重了“被遗忘权”。\n\n此类工具将帮助参与数据变现的公司避免与隐私泄露相关的巨额罚款。²⁵ 随着更多数据由物联网产生，且这些数据通过人工智能变得更易于理解，代币在数据变现、管理同意和实现数据市场方面的作用将变得更加重要。\n\
  \n除了数据量和来源多样性之外，实现数据所有权和控制的技术也将发生逐渐演进。为了演示这可能如何运作，我们回到 4-1 中提出的假期场景。我们最初的场景涉及一个数字平台在交换中充当数据经纪并控制数据。经纪人可以访问旅行者数据和偏好。如果它使用代币，将导致更多的中心化。\n\
  \n4-2 重新审视了这个例子，但这次是在完整的区块链解决方案背景下，该方案使数据去中心化并允许参与者保留。\n\n```\n* * *\n完整区块链解决方案中的代币\n\
  ![image](img/Figure_4.02.png)\n* * *\n```\n\n在这种场景下，旅行者以代币化的形式与旅游供应商（航空公司、酒店等）协调共享数据，并通过数字钱包或其他只有旅行者可以访问的某些界面直接接收报价。旅行者可以定义代币使用的参数，并根据这些参数通过智能合约进行捕获。\n\
  \n处于中心使旅行者对数据拥有主权。去中心化将提高受消费者信任的供应商规定其自身条款和条件的能力。这些公司可以谈判并设定自己的价格，而不是让价格受平台条款引导。这种自由可以驱动他们的参与和创新。数据变现的去中心化将有利于市场竞争。\n\
  \n`Sovrin Network`、`Peer Mountain`、`Civic Technologies`、`SelfKey` 和 `Blockpass`\
  \ 等区块链创业潮正向数据所有者（无论是个人、组织还是物体）展示如何保持对数据的控制。这些公司允许参与者将个人或公司信息代币化，保持个人主权并对其进行公开交换。\n\
  \n由于代币可以在中心化和去中心化环境中使用，它们在未来几年中可能会遵循几种演进路径。例如，数字平台处于良好的位置，并正在投资利用代币（无论是否使用区块链）来对客户数据、身份和其他非货币资产进行变现，并通过这些资产扩大其数字生态系统的影响。除了上述亚马逊和腾讯在游戏领域的代币实验外，脸书、谷歌和阿里巴巴等公司在代币化也同样活跃。\n\
  \n\n\n例如，Facebook 正在开发自己的数字货币，据称其使用了区块链解决方案并发行了 `Libra` 作为稳定币。²⁶ `Facebook Libra`\
  \ 的可能意图是创建一种支持 `WhatsApp`、`Facebook Messenger` 和 `Instagram` 上点对点支付的结算货币。`Facebook\
  \ Libra` 也可以作为发布内容（即分享数据）用户的奖励，并作为跨 `Facebook` 域的支付机制。然而，这些场景中没有一个是与完全区块链模型兼容的，因为\
  \ `Facebook` 将控制这种货币及其使用。此外，任何数字平台用户手中的代币都可以被用于引导客户选择该平台的产品和服务，而不是第三方供应商的产品。专有代币同样可以用于补偿通过其平台进行销售的内容提供者、产品开发人员和服务公司。在中心化的语境下，代币构建了市场权力。\n\
  \n`Figure 4-3` 在 `chapter 1` 中引入的去中心化程度与数字化/可编程程度的四象限模型上绘制了部分代币。对于代币而言，“可编程”——表现为数字化连续谱的最北端——包含了代币的适应性。如果一个代币的目的可以根据业务环境、底层资产、需求、供给、所有权或转移性的变化进行调整，该代币具有适应性。（注意，该图并非在映射代币程序的质量，而只是展示了它们与去中心化和数字化的关系。）\n\
  \n\n* * *\n\n\n![image](img/Figure_4.03.png)\n\n* * *\n\n大部分现有代币旨在促进旧有的运营流程和交换模式（西南象限）。这些代币发挥着战术作用。现在，更具战略性的代币使用正在进行。一种在设计上是中心化且可编程的代币将为发行者提供高度的控制。为了建立采用率，数字生态系统在初始代币实施阶段可能会接受去中心化的某些方面。然而，去中心化元素可能是暂时的，因为目标是`控制`（图中的西北象限）。一旦代币的采用达到临界点——并锁定——我们预测在中心化语境下对代币的使用将演变为具有更多限制，从而变得更加中心化。例如，`Uber\
  \ Pro`（`Uber` 司机的奖励计划）在其代币中具有一些可编程性，但也受到 `Uber` 的高水平控制，因为只有满意度评分至少 4.85 且取消率低的司机才能参与。²⁷。该代币将只有轻微的去中心化，因为访问规则旨在影响\
  \ `Uber 生态系统` 内部客户和业务伙伴双方的行为。该代币的目标地是西北象限。该象限也是 `Amazon`、`Facebook` 的游戏代币以及 `DreamTeam`\
  \ 正在进行的中心化平台扩张的逻辑方向。\n\n对于它们来说，受区块链启发的解决方案很少包含代币，但那些带有代币的方案可以在转向之前，向更去中心化的方向稍微向东移动。当联盟或提供者实现其运营目标，或作为获得对代币流通速度和同质性更多控制时，代币可能会变得更加中心。管辖因素也可能影响代币的交换、存储、合法性和其他特征。\n\
  \n`新加坡航空` 凭借其实验性的区块链启发型奖励解决方案，可以遵循那条路径。目前的解决方案将去中心化水平限制在少数合作伙伴。在这个平台上，代币的主要目的是`协调`合作伙伴之间的流程（东南象限）。该象限中的代币在适应性方面有自然限制。为了变得更具可编程，网络必须适应所有合作伙伴的业务需求；但并不是`新加坡航空`及其`KrisFlyer\
  \ 计划`的目标。因此，代币计划最终可能会变得不再去中心化。\n\n对于电竞，另一条路径正在出现。`GameCredits`、`DMarket` 和 `Enjin`\
  \ 的代币比过去的游戏代币更去中心化且更具可编程性。它们的去中心化程度是对数字巨头试图控制行业以及对游戏玩家、粉丝和开发者多样化需求的直接回应。这些更去中心化的代币使游戏网络能够在新兴行业的`转型`期间（东北象限）创造价值。作为颠覆者，这些代币无疑将进入游戏流媒体领域。`Google`\
  \ 在 2019 年 3 月宣布了其 `Stadia` 流媒体服务，一些基于区块链的替代方案已经在计划挑战它。²⁸\n\n\n### 你学到了什么？\n\n代币化——使用代币对资产进行创建和表示——并不新鲜。中央银行和政府发行的法币代多年来与流程代币（如支持\
  \ `Apple Pay` 的代币）以及互补代币（如奖励积分）并存。区块链增强了代币的可用性和适应性，使其成为点对点网络中创建和交换价值的灵活动态机制。在区块链上，不同类型的代币将用于不同的用途。旨在替代法币的加密货币（如\
  \ `bitcoin`）将挑战中心化货币模型。实用型和安全代币将促进新的筹、融资和投资模式。\n\n代币超越了金融领域，实现了个人数据等非流动资产的货币化。代币还提供了管理旧问题的新方法。例如，它们帮助组织遵守数据隐私法规，如欧洲的\
  \ `GDPR`（对于 `B2B` 和 `IoT` 数据很重要）。代币还可以防止欺诈、加速支付（例如针对电竞中的玩家），并减少中间费用。\n\n\n你组织和所在行业的成熟程度影响了所需的代币类型。识别你的直接竞争对手或已经拥有代币策略的相邻公司。一旦你了解了目前的情况，就应该开始尝试将代币作为数字业务转型的代理。例如，你可以开发一种代币化的机制，赋予客户对他们数据的主权；这种权威将鼓励他们参与数据市场，因为他们知道自己对信息有控制权。将个人数据控制权让给所有者具有支持你遵守数据隐私法的附加收益。你还可以探索将代币作为奖励和激励。奖励引导网络参与者分享数据并创建新市场。这些示例说明了在去中心化的、完全区块链环境中，代币如何成为动态且多功能的经济代理，扩展你的市场权力。\n\
  \n\n代币依赖去中心化来发挥其全部潜力，以鼓励市场参与、数据共享、资产创建以及代币的多样性和适应性。在下一章中，我们将沿着区块链频谱继续向前，更充分探索去中心化——区块链的第五个设计元素。\n\
  \n\n\n去中心化在许多方面都是区块链的心脏。当去中心化与代币（即在商业生态系统中流动的隐喻血液）相结合时，去中心化决定了你和其他网络参与者是作为具有同等价值能力的真实对等主体进行运营，还是某些参与者获得了与其贡献不成比例的利益。如果你希望参与区块链驱动的数字市场并从从中获得最大收益，那么去中心化并非可选项。\n\
  \n尽管光谱中的“区块链完善”阶段要到 2023 年左右才会开始，但去中心化的实验已经在进行中。如果你的客户对某些事感到沮丧，我们保证某些区块链初创公司正在致力于去中心化的解决方案以缓解他们的沮丧。\n\
  \n例如，Golem 正在为需要大量处理能力的计算机用户开发解决方案。这些用户的需求是不规律的，因此无法获得 Amazon 或 Google 等云服务提供者的良好服务——由于运行分布式中心化计算网络存在沉没成本，这些供应商通常要求长期合同。Golem\
  \ 的解决方案允许点点网络中的参与者将其服务器和计算机上的空闲处理能力租给需要大量计算能力的用户。可以将其模型想象为过剩算力的“去中心化版 Airbnb”。就像\
  \ Airbnb 一样，Golem 正在构建一个具有撮合当下缺乏流动性供应潜力的平台。闲置计算供应是一个巨大的市场：全球服务器的使用率仅为总容量的 70%，这意味着数据中心有价值\
  \ 300 亿美元的闲置服务器。¹ Golem 方法还提供了新的关系可能性。Golem 不需要长期合同，可以根据需要访问资源，并使用代币奖励资产所有者。\n\n\
  该公司正在向计算机图形设计师营销其首个用例 Brass Golem，这些设计师在短期内需要大量动力来渲染二维设计，以便其在屏幕上呈现三维效果。自 2016 年成立以来，Golem\
  \ 已筹集了超过 1700 万美元。² 它加入了 Sonm、Ethernity Networks、Conduit 等区块链同仁，以及 Filecoin 和 Storj（两家专注于去中心化存储的区块链初创公司），通过去中心化模型重新构云计算。\n\
  \n随着 Golem 这样的区块链初创公司获得关注，随着受区块链启发的演化型或原生原型型解决方案扩大其用户群，传统组织将需要更积极地探索去中心化解决方案。然而，即使有这些明确的竞争推动，我们接触过的业务领导者对去中心化及其包含的一切表达了担忧。这些挑战跨越了技术、经济、社会系统以及商业治理领域。\n\
  \n在本章中，我们将探讨关于去中心化的广泛主题。我们定义了区块链去中心化的组成部分，概述了去中心化在日益数字化的环境中业务价值，并展示了传统如何在光谱上演进并接受去中心化。我们还将带你了解去中心化带来的主要挑战。我们将从去中心化的基础开始。\n\
  \n\n表面上看，去中心化的技术方面非常简单。区块链的设计并非依靠中央权威，而是根据区块链上交互的业务规则，赋予网络每个参与者对于其他参与者是否真实以及交易是否有效的`一次平等的投票`。参与者可以作为`节点`运行，即参与者拥有或使用的、在每次交易区块通过时运行区块链共识算法的机器。^a\
  \ 如果至少 51% 的全网络节点认为交易是正确的，它就会清除，然后由每个节点独立附加到其账本副本中。³ 一个节点可能错过或故意忽略的重复、双倍计算资产和欺诈交易，不太可能被共识遗漏。`一节点一票`的政策是区块链在缺乏中央权威的情况下解决身份验证和验证挑战的方法`。\n\
  \n但去中心化不仅仅关乎技术。它关关区块链如何定义和执行解决方案的业务规则。它关乎谁有权作为全节点参与网络。去中心化还关乎根据贡献分配参与者的奖励。总体而言，我们看到去中心化在治理、经济和技术类别中运行的八种主要方式。\n\
  \n\n**决策制定：** 参与者允许决策在区块链上进行代码化并执行，而没有中央权威介入其中。\n\n**参与：** 任何人或任何事物都可以作为全节点，前提是具备必要的基础设施并同意遵守运营条款。\n\
  \n**商业所有权与监督：** 没有单一实体或财团对区块链上产生的价值拥有多数股权。这种公平共享适用于货币价值，也适用于数据、访问权限、合同和技术的“货币”。\n\
  ### 经济\n\n**融资：** 没有任何单一实体或财团提供或负责区块链的流动性；健康的经济模型维持着平台的运行。\n\n**奖励分配：** 区块链根据约定且透明的规则，向所有运行共识的节点公平分配奖励。\n\
  ### 技术\n\n**技术架构：** 区块链依赖于共识算法和一节点一票政策来验证参与者并校验交易。\n\n**协议开发：** 解决方案的输入和源代码来自多个来源，通常通过开源开发。\n\
  \n**网络治理：** 没有单一实体或财团对区块链上的节点拥有多数控制权。参与者可以担任主动或被动角色，并拥有加入和退出的自由。\n\n尽管这八个要素可以在不同程度上去中心化，但它们之间存在明显的依赖关系。例如，拥有单一所有者或所有者组的区块链（例如中心化商业治理）可能会通过中央协调的技术架构来强化这种中心性。这种设计意味着区块链不依赖于去中心化共识，因此是一个区块链启发的原型。相比之下，开放参与可能依赖于共识驱动的技术架构来建立信任，因为参与者彼此并不认识。\n\
  \n\n尽管区块链目前存在技术局限性，但根据我们的经验，这些缺陷并不是公司犹豫不向去中心化的原因。组织阻力才是原因。\n\n像你这样的领导者告诉我们，他们正在挣扎如何应对区块链要求他们将决策控制权交给算法。你和其他领导者无疑对参与一个网络感到担忧，在那个网络中，你不知道也无法知道交易另一端是谁。你正在探索从一个你并不拥有或控制的资源（区块链）中提取价值意味着什么。这些治理问题的复杂性需要更多的关注。\n\
  \n\n\n\n\n在区块链中，算法执行代码中所包含的业务规则和决策。为了实现这一目标，领导者必须同意放弃对相应决策的控制权，并对决策进行足够详细的定义，以便转换为代码。\n\
  \n这种对控制权的放弃听起来是一个巨大的跨越。然而，一些业务领袖已经开始了这段旅程。通过使用人工智能以及核心系统和流程的外包获得的经验，为进入去中心化环境提供了阶石。⁴\n\
  \n智能合约持有在区块链中执行决策所需的代码。这些合约的复杂程度不相同。简单的智能合约处理单个决策或流程；复杂的智能合约则拥有一套完整的规则，定义了整个运营功能的决策，例如，供应链管理中涉及的所有财务任务（从采购到账单）。这些复杂合约在区块链世界中被称为\
  \ DAOs，即去中心化自治组织。可以将它们想象成业务线条的化身。在某些情况下，DAOs 将包含运营业务所需的所有业务规则，而 DAO 产生的交互、交易和创造的价值在物理世界中没有对应的产物。作为一个独立的业务，DAO\
  \ 将做出所有决策，并执行嵌入到其程序中的所有流程。引入先进的 AI 代理将允许运行在账本上的智能系统自主做出这些业务决策。\n\n如果以这种方式移交决策控制权的想法看起来很激进，请记住，这一切都不会作为第一步发生。相反，你将从将易于理解决策（如招聘或员工年度考核）去中心化到区块链解决方案开始，然后转向去中心化如项目管理或融资等流程，最后是整个公司功能。向\
  \ DAOs 的过渡同样会演进，首先侧重于已经高度标准化、代码化或自动化的流程或市场部分，这些部分可以适应现有的环境。\n\n\n作为区块链治理的一个要素，参与指的是在具备必要基础设施的情况下，允许谁或什么作为网络节点进行操作。在完全去中心化的区块链中，任何想做的人或事物都可以成为全节点。去中心化参与的一个常用同义词是`公共`或`无许可`网络。无许可网络与具有中心化参与的网络形成对比，后者被称为`私有`、`许可`或甚至`企业级`区块链。\n\
  \n中心化参与背后的逻辑是，它允许所有参与者知道他们交易的对象是谁，并符合组织和运营规范。你们中的许多人告诉我们，坦率地说，对与未知对手进行交易或交互的想法感到不安。然而，维护一个包含所有已知参与者的中心化系统会损害区块链的基础优势。从这个意义上说，许可链区块链就像一艘带有内置桨的机艇：你本不需要它们，那么它们为什么要放在那儿呢？\n\
  \n## 去中心化商业治理\n\n谁拥有区块链？谁监督它的治理？如果有人受伤或出现其他问题，谁来负责？在去中心化区块链中，关于所有权的答案既是无人拥有也是所有人拥有：没有单一参与者拥有整体，每个参与者都通过运行全节点、执行共识并可能为开源协议和解决方案开发做出贡献来对其维护和运营负责。\n\
  \n从表面上看，集体所有允许网络成本的分散，尽管去中心化本身带有某些成本。例如，运行共识算法需要运行它的节点消耗一些算力和能量。\n\n另一个影响治理的因素是社区统一。实现去中心化的共识通常依赖于多数原则。如果网络引入了某些人不同意采纳的新规则，那么网络可能会分裂或分叉。当网络成员对目标产生分歧并决定分成不同的网络时（例如比特币和比特币现金），就会产生分叉。分叉也可能是对紧急情况的响应，例如\
  \ 2016 年以太坊社区因为 DAO 项目而选择分叉。⁵ 在任何情况下，分叉都具有技术上的影响。\n\n\n去中心化的八个组件独立且结合运行，以构建一个共识驱动的环境，用于创造价值并公平地分配。重要的是，这八个组件是动态的；它们的去中心化程度随时间推而移动。\n\
  \n比特币区块链——通过去中心化架构协调的最大分布式区块链——提供了一个网络如何随时间演变的有用视角。比特币的奖励机制（全节点通过其维护网络和运行共识的工作获得比特币作为补偿）有助于这一趋势。节点被认为在`挖掘`比特币，运行节点的人被称为`矿工`。随着账本的增长，矿工需要更大的算力和更高的执行速度来运行共识。对于比特币，具有最高扩展性和成本效益运营的矿工可以比其他人挖得更快。这种差异导致了市场整合。比特币价值的下降加剧了这个问题，使得对于效率较低的矿工来说，奖励不再值得付出劳动。他们退出了矿池。这一切导致了挖矿的中心化；今天，四个矿池运行了超过\
  \ 50% 的比特币网络。⁶\n\n协议开发是比特币区块链中心化的另一个维度。开源解决方案的所谓承诺是，因为没有单一公司拥有它们，所以它们受益于众多独立程序员的多样化贡献。与由一个中央组织负责相比，更多的人可以在更短的时间内发现更多的错误并进行更多的改进。\n\
  \n开源模型也面临持续性挑战。例如，当 GitHub 在 2018 年 6 月被微软收购时，这次收购引发了对 GitHub 库中现有开源解决方案可持续性的质疑。⁷\
  \ 某些开发者将努力维护开放性，例如在甲骨文收购太阳系统公司后，将 MySQL 分叉为 MariaDB，将 Open-Office 分叉为 LibreOffice。\n\
  \n\n\n\n日本金融服务公司信信集团（Monex Group）的高级顾问 Pieter Franken 指出：“维护区块链的许多贡献是基于志愿者性质的。这种做法持续性如何？谁来维护源代码？代码漏洞出现由谁来负责？如果开发者的世界观与使用相关区块链的公司观点不同，会发生什么？这将对你的业务产生什么影响？在信信集团，我们认为分配资源来连接开发者社区是关重要的。”⁸\n\
  \n随着区块链的演进以及其开发挑战变得日益复杂，修复这些问题所需的技能也变得更加专业化，因此集中在少数几个开发者手中。同样的中心化倾向也适用于比特币。该平台的持续开发正由越来越少的人员完成，这增加了某位开发者引入漏洞的可能性。⁹\n\
  \n需要说明的是，目前没有证据表明比特币区块链已因为矿池中心化程度的增加或协议开发而遭到破解。我们强调这个例子是因为它代表了去中心化区块链技术演进中的一个自然实验。当你尝试量化基于共识构建的区块链解决方案的相对风险和回报时，这些教训提供了有用的素材。请记住，比特币或任何加密货币相对于全球交易量和业务范围来说，规模都非常小。还要意识到区块链开始时的蓝地状态：没有需要传输的遗留数据，没有需要翻译的现有流程，也没有具有既利益且需要协调和管理的成熟参与者。\n\
  \n在理解了区块链去中心化的本质及其多种运作方式后，让我们转向控制和价值创造问题，并从业务领导者提出的最迫切的问题视角来看：去中心化让你的组织通过区块链实现什么？\n\
  \n\n任何关于区块链去中心化的讨论都必须面对一个令人不安的事实：在传统业务中工作的你们正面临着对去中心化的巨大阻力。如今，很少有传统业务能够利用全部五个要素来构建区块链解决方案。你经常会听到关于为什么去中心化行不通的详尽理由。我们听到的最常见的理由如下：\n\
  \n*   中心化系统处理交易的速度比去中心化系统更快。\n*   出于安全或监管考虑，必须由一个已知的执行者进行控制。\n*   你的合作伙伴不会支持它。\n\
  *   中心化系统的能源消耗较低。\n*   每笔交易涉及的数据量或业务流程的复杂性使得去中心化无法实现。\n*   你需要中心化（并进行控制），因为你的参与者缺乏运行\
  \ `node` 的技术能力。\n*   区块链参与者不想暴露他们的交易数据，或者可能不想暴露他们的身份。\n\n这些论点在表面上一个都不准确，也不无根据。鉴于如今的技术能力，中心化系统的运行速度确实更快。它们通常能源消耗较低（取决于运营架构），并且能够更好地处理涉及大量描述性数据的交易。中心化可以为监管机构提供“可以掐住的咽喉”，它确实允许强大的执行者管理和控制标准化的流程和价值链。最后，中心化系统对于普通信息系统团队来说更容易管理。\n\
  \n然而，上述观点并不是支持在区块链中使用中心化设计的论据。它们仅仅是在当你需要或希望与信任的交易对手进行中心化协调和监督时，使用传统数据管理的理由。更准确地说，这些观点是自我施加的限制。你们并没有在想象在一个由去中心化定义的业务环境中可能实现什么，而是将区块链强行塞入组织现有的、具有自上而下层级的中心化结构中。这种固定的思维创造了一种策略上的循环论证，使得传统组织仅将区块链视为解决高成本内部或生态系统挑战的工具，然后合理化地认为他们设计的解决方案不需要去中心化，因为它们所解决的问题适用于已知参与者的封闭网络。要打破这种循环性思维，你可以转变视角。与其关注你为什么不需要去中心化，不如考虑它能为你做些什么。\n\
  \n\n正如我们之前描述的，去中心化系统重新定义了参与规则，从“赢家通吃”的经济学转向一种更公平的系统，在这种系统中，奖励根据参与者的贡献进行分配，且问责是透明的。考虑这种公平分配对于第\
  \ 1 章中引入的业务货币意味着什么：数据、访问权、合约和技术。正如我们指出的，数据是驱动数字经济的主要货币，因此数据访问和控制（通过合约实现）是数字能力的要赋能因素。当然，访问和控制不是一回事，但在中心化环境中它们是合为一的。例如，在\
  \ `Amazon` 或 `阿里巴巴` 这样的数字平台上，或者特洛伊木马或机会主义的受区块链启发的解决方案，参与者通过暴露他们的专有数据来隐含地支付访问费用，平台所有者从每笔销售或服务费中提取一定比例。费用收入是平台的一次性投入，但数据价值在平台所有者向下游利用这些数据以指导广告、产品植入、产品设计、供应链合作伙伴关系等时会产生多倍的重复价值。总之，中心化环境根据非正式合同运行，该合同要求参与者放弃对数据的控制，以换取对客户或技术的访问（或两者）。\n\
  \n等去中心化环境提供了一种替代方案，允许在数字语境下对数据的访问和控制进行单独谈判。正如我们在第 4 章中所示的，代币化允许参与者（无论是人、组织还是物）以可交易的形式捕捉数据，然后与交易伙伴全部或部分共享以产生新的收入来源。将代币化与去中心化相结合，让参与者能够控制如何共享这些信息，并让这种交换价值归他们所有。在没有数据所有者知道的情况下，没有第三方可以谈判数据交换。在去中心化环境中，互补技术（如身份和访问管理工具以及零知识证明等机密系统）让参与者能够更紧地掌握他们共享的信息、与谁共享以及如何共享^b。例如，企业可以保证机密数据已交付给另一方，而无需共享底层信息的细节。这种能力将对每个行业部门产生广泛的影响。在金融服务业的企业银行部门，贸易融资是使用此类方法改进采购订单流程的一个领域。通过使用\
  \ `eTradeConnect` 等平台，金融机构可以在银行间交叉引用融资信息且不共享客户数据的情况下，从而避免过度融资。¹⁰\n\n\n\n\n图 5-1\
  \ 重复了我们在第 1 章中引入的图像，以模拟当今商业环境中取决于去中心化程度和可编程程度的潜在组合。那些达到行业平均数字化水平并采用集权治理（层级化决策；集中管理的人员、流程和资源；以及集权的业务模式）的企业位于西南方的“结构”象限。对于这些公司来说，在不变得更加去中心化的情况下变得更加数字化，将他们推向北方的“最大化”象限，因为在这个象限中，组织最大化了对业务货币的控制和使用。这种向北的移动正是“特洛伊马”原型受区块链启发的解决方案能为你做的，正如第\
  \ 2 章中所描述。\n\n\n\n![image](img/Figure_5.01.png)\n\n一些传统业务已成功在西北象限占据一席之地，但过去的二十年让我们清楚看到，与数字平台进行面对面竞争有多么困难。这样做需要独家访问大量数据、分析能力，以及将所学到的知识转化为新产品开发和业务模式的能力。追求这条路径的人随着时间的推移会变得`less`（不）去中心化，以此对他们积累的数据以及观众所看到和购买的内容施加更多控制。\n\
  \n受区块链启发的进化型和原生原型的解决方案引导了区块链上执行的业务决策进行某种程度的去中心化，推动其部分进入或略高于“谈判”象限，之所以这样命名，是因为在这个象限中，参与者对业务货币拥有更多控制权，并为协商访问和使用这些资源创造了新环境。参与协作联盟可以帮助组织在去中心化连续谱上进一步推进，但如果没有技术架构的去中心化，就会限制。因此，对新运营方法、新业务机会或新价值来源感兴趣的组织将旨在向东北移动到“释放”象限。这些具有完全可编程性的去中心化区块链促进了新价值形式的创造，并与任何人在以任何规模和任何价格点进行交换。\n\
  \n正如我们所说的，组织似乎可以选择向北走或向东北走，但从机会的角度来看，这两个方向并不对等。物联网结合人工智能和边缘计算已经在沿着集权化-去中心化连续谱向相反的方向推动商业活动。¹¹。一方面，物联网和边缘计算的扩展通过将计算和决策权置于广泛分布的物体中推动了去中心化。另一方面，数字平台提供商通过增强其人工智能算法能力来强化权力，这些算法利用了他们从客户、物体、数据中心和其他来源收集的海量数据。\n\
  \n竞争差距不断扩大。对于绝大多数公司来说，竞争的能力将取决于他们如何利用去中心化的业务模型从流程和数据中获利。\n\n\n去中心化将为绝大多数公司提供更大的竞争机会。然而，这并不意味着接受去中心化治理、技术和经济对所有组织来说都是容易的。\n\
  \n相反，传统组织背负着巨大的隐性重量，拖了它们的脚步并使改变变得非常困难。僵化的组织流程、过时的产品和服务、旧的技术、固定的思维模式和不灵活的结构都是阻力的来源。这些来源解释了为什么组织变革专家\
  \ John Childress 关注持续努力的必要性。¹²\n\n将这种努力应用于去中心化，图 5-2 说明了组织 1 比组织 2 有更多运营和技术来源在拖其后腿。结果就是去中心化滞后。滞后越久，组织落后于阻较小的组织就越远。此外，学习成本与公司的文化强相关。得益于领先组织的技术实验，这种差异可能会防止后者追赶。同样，组织必须随着时间的推移施加更大的力量来实现进展。\n\
  \n\n\n![image](img/Figure_5.02.png)\n\n这些因素共同导致了组织 1 在组织 2 达到相应点很久之后仍无法达到其去中心化拐点。`去中心化拐点`是指你的组织中的阻力力量减弱、去中心化的收益开始积累的时间。在这个拐点之另一侧是竞争能力、效率、价值创造和盈利能力的提高，这些统称为`去中心化收益`。维持去中心化的收益需要持续且动态的努力，正如任何一组竞争活动一样。总之之，向去中心化的转型将带来挑战，但如果其他组织和竞争对手更早开始去中心化，挑战只会随着时间的恶化。\n\
  \n需要更多的实验来确定实现更大去中心化的确切最佳实践。激励和奖励结构在去中心化中起着重要作用。代币（Tokens）可用于向以符合变革目标方式行动的人和物体发放奖励。\n\
  \n协作软件开发商 Loomio 提供了一个在组织内部使用代币奖励小组行为的示例。背景信息是，Loomio 源于新西兰的占领运动（Occupy movement）。惠灵顿的一位占领经理\
  \ Benjamin Knight 受到运动中协作决策过程的启发，并希望将其应用于分布式环境。¹³。从这个种子开始，Loomio 诞生了。早期，组织（以合作社运营）创建了\
  \ Loomio 积分并发放以奖励首批成员。合作社的创始人描述了这些积分：“我们有一套独立的系统来认可人们为了启动项目而免费工作的工作，以及员工在我们的业务运转期间接受低于市场标准的薪资时所承担的机会成本。我们认可员工在没有保证的早期初创公司中投入时间所承担的风险，通过对早期赚取的积分设置了倍数。”¹⁴有趣的是，Loomio\
  \ 积分没有具体的价值。只有当董事会决定 Loomio 财务状况良好时，积分才能兑换现金奖金。\n\n\n\n\n\n在其他情况下，可以使用代币（tokens）来鼓励跨组织部门的信息共享。信息孤岛是层级制度的已知缺点之一。组织中将知识等同于权力，导致的信息囤积极大地延长了去中心化的延迟。但如果通过发放代币来鼓励和奖励信息共享，孤岛信息源是否会变得更加开放？答案尚未知，但我们鼓励你进行实验，以发现如何在组织内部对知识定价和共享。区块链实现了对这种行为的实时透明衡量，使领导者能够更好地理解推动组织向新运营模式所需的激励措施。\n\
  \n\n尽管去中心化具有优势，但受区块链启发的解决方案仍是传统组织在开发中的主导模型。同样，由于目前的市场状况，初创社区推出的解决方案也更具演化性，而非完全去中心化。除了这种共同的顽固外，一些高度集化的组织现在正在尝试某种程度的去中心化。\n\
  \n\n欧盟的支付曾由每个成员国以其自己的方式处理，但在 2008 年，欧盟支付流程根据“单一欧元支付区”（SEPA）倡议规则进行了整合，该计划要求支付受益人（即债权人）拥有身份凭证。法国银行负责在法国发行\
  \ SEPA 债权人 ID。这种手动流程既繁琐又容易出错，并且需要信息从纸质文档传输到数据库中。该程序导致了延迟，并与银行的 KYC（了解客户）流程重叠。\n\n\
  法国银行希望通过区块链使身份发行程序现代化，它看到了一个实验新技术、解决已知问题以及与其商业银行利益相关者互动的机会。它开发的区块链在设计上受到了灵感，而且新技术提供的解决方案是基础性的；一个安全的数字门户也可以实现相同的目的。但银行认为这对协作以及银行间流程最终去中心化具有更广泛的利益。我们采访法国银行的官员表示，该项目在法国银行与其服务的商业银行社区之间建立了新水平的互动。该项目还让每个人理解了去中心化如何影响决策、问责制以及数据隐私和权限。¹⁵\n\
  \n法国银行目前拥有软件、管理安全基础设施和私钥，并共同拥有数据。然而，其领导者希望治理模型能够随着时间的推移而转变。法国银行的一位受访者告诉克里斯托：“我们的角色是软件提供者和守门人。这不是可持续的治理。这对于商业银行不是首要任务，但我们需要集体治理，否则这将无法运作。”\n\
  \n对于一个中央银行官员来说，这是一个非常不起的评论。正如他所描述的，愿景是拥有一个开放的社区模型，实现更去中心化的开发、成本共享以及构建新的互补解决方案的能力。他将其与托管在`GitHub`上的开源项目进行了对比；对于法国银行及其客户来说，应用程序代码可以开源并供参与银行访问。虽然原始区块链是为法国设计的，但\
  \ SEPA 凭证 ID 适用于欧元区内的债权人。同样，KYC 凭证也使用一些相同的信息，使得能够利用同一平台实现互补用例。这些因素共同指向了欧洲央行在一种更具渐进性的去中心化区块链凭证模型上合作的机会。\n\
  \n### 欧洲足联协会：票务的安全去中心化\n\n另一个高度集化的组织通过区块链进行受控去中心化实验例子是欧洲足联协会（UEFA），它是国际足球联合会（FIFA）的欧洲管理机构。¹⁶\
  \ UEFA 组织了一些最负盛誉的全欧洲足球赛事，包括每年的欧冠联赛。UEFA 赛事的门票需求很大，并且存在一个强劲的、去中心化的二级市场进行转售——基本上就是黄牛。UEFA\
  \ 估计，只有 37%的门票给了一级买家；其余的则给了转售商和赞助商。\n\n二级销售给 UEFA 带来了几个问题。之一是安全性。当使用门票的人不是购买门票的人时，协会就失去了谁进入了其活动设施的记录。持续的体育暴力问题以及对恐怖主义日益增长的担忧，使得门票持有者的识别成为一个紧迫的问题。¹⁷价格操纵是另一个担忧。门票很快被涌入官方渠道的机器人（或经纪人）售光。这些门票随后以远得离谱价格出现在二级市场上。当普通家庭无法负担足球赛门票时，UEFA\
  \ 损害了品牌声誉，但没有钱流向 UEFA 或球队。相反，钱流向了票务经纪人，其中一些人与有组织犯罪有关。另外两个问题是伪造（当黄牛卖假票时）和双重计数（当黄牛将同一张票卖给多个买家时）。\n\
  \n尽管存在这些问题，UEFA 仍将二级销售视为业务的现实，也是实现社交观赛和口碑的好方法。替代渠道在到达 UEFA 无法覆盖的市场区域起着作用，因此目标不是完全停止二级销售，而是通过使用去中心化的经济市场来限制其负面影响。为此，UEFA\
  \ 正在转向区块链。\n\nUEFA 正与`SecuTix`和`TIXnGO`合作，这两家瑞士技术公司是瑞士 IT 公司`ELCA Group`的一部分。`SecuTix`和`TIXnGO`平台\
  \ 2018 年 5 月于法国里昂进行了其首次 UEFA 试点。该平台在那个城市用于发行和管理欧的欧洲联杯决赛赛的两万张门票。第二次试点是同年 8 月在爱沙尼亚的塔林进行的欧超超级杯比赛，涉及一万张门票。现在所有的目光都聚焦在这一解决方案的大奖：2020\
  \ 年欧洲杯，欧洲足球界相当于世界杯。¹⁸\n\n该平台的工作原理是提示购票者下载`SecuTix`和`TIXnGO`应用程序。应用程序连接到区块链，门票被代币化，以便平台记录门票购买并关联其所有权详情。如果所有者想将门票送给朋友或家人，可以通过应用程序实现，程序会将传输记录发送到区块链。当门票持有者想将门票放在公开市场上时，情况变得有趣起来。`SecuTix`和`TIXnGO`开发了在区块链应用程序内运行二级市场的能力。`SecuTix`平台定义了转售商允许收取的加价。这种做法防止了价格操纵，并限制了非法经纪人参与的动力，但维持了允许各种门票持有者（无论是个人还是票务经纪人）售卖给意向买家的去中心化环境。\n\
  \n\n\n\n\n由于每笔票务转移都记录在区块链上，`SecuTix` 和 `TIXnGO` 能够追踪票务并识别进入场馆的人员身份。理论上，这些信息可以提供给安全团队，如果安全人员认为票务持有者构成安全风险，就可以阻止其进入。在实践中，尚不清楚\
  \ UEFA 如何或是否会使用这一功能。正如 `SecuTix` 首席执行官 Frédéric Longatte 所解释的：“我们有一种架构上的解决方案来确保票务持有者的隐私得到保护，区块链上不存储任何个人数据，这一功能使我们的客户在符合\
  \ GDPR 规则的同时，仍保持将票务与购买者关联的能力。”19\n\nUEFA 与 `ELCA Group` 的合作展示了区块链如何实现业务决策的去中心化，特别是在涉及销售模式方面。该技术解决方案受区块链启发，但涉及使用\
  \ `tokens` 的组合治理和经济能力、二级市场参与者的加入，以及票务持有者自由出售或交换票务（在价格范围内）的灵活性，共同推动该解决方案在去中心化光谱上向东移动（图\
  \ 5-3）。随着时间的推移，这一方向可能会进一步延伸，因为该解决方案旨在整合二级票务市场，从而引入更多参与者和市场主体，目标实现票务周边经济系统更安全的去中心化。\n\
  \n`Banque de France` 和 `UEFA` 共同展示了中心化组织尝试去中心化以释放新机会的几种方式。然而，我们在本章介绍 `Golem`——一家原生区块链公司——是为了强调一个市场现实：初创公司已经在开发现有业务模式的去中心化替代方案。\n\
  \n### 图 5-3\n\n* *\n\n欧洲足球协会 (UEFA) 相对去中心化的票务系统\n\n![image](img/Figure_5.03.png)\n\
  \n* *\n\n一个例子是 `rLoop`，这一个支持令牌的 DAO（去中心化自治组织），专注于连接全球工程和设计领域的去中心化人才，以创造工程创新。该模型已凭借其\
  \ `Hyperloop` 高速交通系统的原型为公司赢得了 `SpaceX 创新奖`。20。`SpaceX` 竞赛可能会将 `rLoop` 归类为未来的实体，但该小组正在解决科学、技术、工程和数学\
  \ (STEM) 领域人才获取的当前问题。21。\n\n去中心化可以通过两种方式发生：中心化组织接受制度变革的需求并进行渐进式改变；或者提供替代价值创造方式的新进入者对去中心化产生强有力的推动。\n\
  \n## 你的业务视角\n\n#### 你学到了什么？\n\n受区块链启发的阶段将持续到大约 2025 年，届技术成熟和业务经验将使组织能够转向完全区块链解决方案。这种转型发生的快慢以及你从中受益的充分程度，取决于你多快地接受某种程度的去中心化。\n\
  \n去中心化不仅仅关乎技术。它包含八组成部分，分为三大类：治理（决策、参与以及商业所有权和监督）；经济（融资和奖励分配）；以及技术（技术架构、协议开发和网络治理）。这些组件决定了区块链如何定义和执行解决方案的业务规则；谁可以参与以及他们在网络中的角色；以及如何分配奖励。\n\
  \n#### 你应该如何做？\n\n为了利用区块链解决方案，你需要尝试去中心化。从简单的行政决策开始，然后进展到组织运营。由于你的组织文化将是最大的阻力来源，你应该尽早考虑奖励结构。\n\
  \n#### 接下来是什么？\n\n关于中心化或去中心化的辩论并非非黑即白的。区块链光谱强调了一条演进路径。市场、企业和运营的某些方面可能仍从中心化中获益。然而，随着区块链能力的成熟，你将遇到更多突破去中心化点的机会。在下一章中，我们将沿着光谱进一步移动，探讨完全区块链解决方案及其在推动这一演进中的作用。\n\
  \n\n\n\n\n这些新兴解决方案以及其他方案依赖于驱动数字平台的相同货币，但它们是以透明化的方式实现的。其设计中将代币化与去中心化相结合，这使得它们能够提供吸引消费者和卖方进入在线平台的相同利益，但又无需迫使这些参与者在使用它们时支付两次费用——一次是在购买物品或支付交易费用时花费的真实资金，另一次是以个人或组织数据的形式。\n\
  \n在本章中，我们将探索新兴的区块链完整（blockchain-complete）解决方案可能的样子，以及它们将如何挑战现有模型。我们重点介绍了区块链完整模型已经产生影响的行业，并展示了它们所提供的访问能力如何被转化为竞争优势。\n\
  \n# 区块链完整解决方案的优势\n\n零售业是追求区块链完整解决方案的初创公司的活跃领域之一。其他具有活跃区块链完整初创活动的行业还包括广告中介、数据存储、旅游中介和金融科技。这些行业的共同点是高度的数字化，以及一个对个人数据被剥削感到担忧的客户群体。区块链初创公司正在提供去中心化的、共识驱动的方案，以替代现有的中心化、平台驱动的模型。\n\
  \n一个例子来自区块链广告拦截浏览器提供商 `Brave`，它正在试点一种数字广告平台，当客户同意观看广告时，该平台用 `BATs`——基础注意力代币——补偿用户的注意力。³\
  \ `BitClave` 正在探索一种类似的模型，使用消费者活动代币，当用户同意共享个人数据或查看广告时给予他们奖励。消费者的浏览和购买行为不受影响，这意味着人们仍然可以不受阻碍地进行网络活动，但在他们揭示身份和偏好时，将获得奖励、更高的透明度和更多的选择权。\n\
  \n去中心化的环境可能会给数据质量带来一些反直觉的改进。区块链被称为`真理机器`，这是一个令人困扰的说法，因为数据可能是不完整的、不准确的、偏见的、特定场景的或具有误导性的。在数字平台上，“真理”是通过随着时间推积关于客户查看或购买的数据，然后根据这些洞察执行操作建立的。诚然，这些数据包含了相当的产品，且数量在不断增长，但它仍然只是客户总需求和偏好的一部分。我们中谁没有过这样的经历：在网络平台上看了一个边缘感兴趣的产品，结果该产品的广告在互联网上追了你几周？平台利用这种被污染的真理来引导客户进行某些操作和购买。\n\
  \n由区块链完整解决方案实现的准确、透明且私密的真理，可能会打破数字平台的市场权力，同时提高信任度，并允许广泛的机会和参与。共识算法实现了区块链完整解决方案中的“真理”。该算法将根据其认为不准确或不可验证的数据拒绝交易，并允许参与者进行交易，即使他们并不隐含地认识或信任对方。不遵守区块链规则的参与者将无权交易。违反这些规则的交易将无法通过验证。此外，记录的不可篡改允许参与者访问交易记录以解决任何结算后的争议。区块链启发的解决方案并不一定具有这些安全机制，即使有，它们的成本也更高、更繁琐。\n\
  \n准确性的提高和共识驱动的验证可以公平的形式带来广泛益处，特别是在公平参与和访问方面。只要一方遵循网络的共享规则，任何人或任何事物都可以在区块链完整网络中进行交互或交易。通过这种方式，区块链完整解决方案实现了万维网诞生之初就包含的平等访问承诺。鉴于数字平台作为守门人的权力，我们今天离这一承诺还很远。⁴\
  \ 为了增加收入，平台必须尽可能捕获数据，并限制竞争对手对相同资源的访问。这种捕获和控制产生了逆转去中心化的动力（参见图 6-1）。相比之下，区块链解决方案将参与者的范围扩大到任何认为有价值的人。尽管区块链并不一定产生一个完全开放参与的绿地，但它可以增加参与度并鼓励利益的公平分配。\n\
  \n## 图 6-1\n\n* * 区块链完整的可编程性与去中心化\n\n```\n![image](img/Figure_6.01.png)\n```\n\n\
  * *\n\n公平访问不仅是指参与的权利，还指参与的实际能力。高效、安全且私密的身份信息共享会强烈鼓励参与。便携且去中心化的身份凭证将成为区块链完整解决方案捕捉和共享信息的标准方式。在区块链完整环境中，这些凭证通常是捕捉用户信息的代币。（捕捉凭证的技术方法将沿光谱进一步发生变化。）代币可以存储在数字钱包中。数据所有者随后可以共享他们的代币，供指定的交易伙伴单次使用。安全许可是个人数据的一个应用。例如，你的凭证可以将你识别为财务账户的有效所有者。⁵\n\
  \n这种方法在许多行业中都有广泛的应用。我们最近与台北医学大学附属医院(`TMUH`) 的代表进行了交流，他们正在将患者数据放在区块链上，以便对患者记录进行更全面的管理和共享。⁶\
  \ TMUH Sees 患者控制其“健康照”的潜力，以改进文档保护并实现更高效的信息共享。在患者的许可被记录在智能合约后，提供人员可以访问由医院其他医生要求的检查报告，从而防止不必要的重复。患者还可以与医院系统外的护理提供人员共享他们的健康照。根据\
  \ TMUH 院长陈瑞玉博士的说法，“仅在效率方面的益处就是惊人的，即使对于系统中的少数试点患者也是如此。以前医疗记录交换需要三周；而现在同样的交换可以在三小时内完成。同样，由于数据交换更加完整和高效，保险公司对自付医疗费用的报销速度更快了。”⁷](../Text/notes.html#ch6-en7)\n\
  \n便携性是一个重要的特征。在 TMUH 的示例中，患者受益于拥有跨提供者和支付方的便携式医疗记录。对于企业来说，便携的执照或凭证可以大幅降低业务成本。企业无需为每个渠道合作伙伴单独进行认证流程，只需记录一次相关细节，将其存储在身份代币中，并在网络中共享。较小、本地或专业化的公司借此可以扩大其市场访问范围。\n\
  \n\n\n\n\n区块链完备网络中公平性的另一个要素是对价值的公平评估，这种评估基于整个网络的共识，从而实现了公平定价。公平的评估和定价将产生于更公平的市场准入。更广泛的参与使得平台、产品开发者和客户之间的权力和利益能够实现更广泛、更平衡的分配。正如第\
  \ 4 章所述，这种动态的早期迹象正在游戏行业中演变，这得益于区块链替代游戏零售商，例如 `EB Games`、`Sony`、`Nintendo`、`Apple`、`Google`\
  \ 和 `Microsoft`。区块链公司承诺为游戏销售销售提供更高的分成和更快的结算。\n\n智能合约通过捕有关可接受买价和卖价规则以及特定资产的交易条款，支持价值的公平评估和交换。像\
  \ `Gnosis`、`Delphy.org`、`Stox`、`Hivemind` 和 `Augur` 等预测市场解决方案可以允许市场参与者对市场活动进行投票，并获取与价格和价值相关的市场信息。\n\
  \n这些公平性元素并非纯理论，已经在一些广泛接受去中心化方法（特别是区块链）的行业中开始出现。金融作为一个活跃实验的领域之一，值得重点关注。\n\n## 通过区块链完备解决方案实现金融创新\n\
  \n中央银行对货币供应量、利率以及商业银行的特许和监管拥有完全控制权。这种中心化一直渗透到客户层面，导致需要资金来启动或增长的企业（以及零售客户）选择有限。创业者可以遵循万富翁兼《创业坦克》（Shark\
  \ Tank）明星马克·库班（Mark Cuban）的建议，他曾著名地表示：“最好的股权是汗水股权。你在不筹资金的情况下做得越多，走得就越远，拥有的公司股份就越多。”⁸这是一个很好的建议，但并非每家企业都可行，特别是在需要初始投资的领域。\n\
  \n缺乏资金获取途径被认为是主要限制之一。⁹创业者可以通过朋友或亲戚为自己的项目融资，或者通过众筹平台或去中心化金融寻求资金。¹⁰2017 年，众筹平台筹集了约\
  \ 330 亿美元。¹¹将智能合约作为流程的一部分也有助于实现更准确且可审计的交易流。¹²去中心化金融正在提供服务。¹³正如第 4 章所述，ICO 是最早的应用之一。¹⁴以太坊是首批采用智能合约的区块链之一；现在它是许多区块链执行规则的标准。¹⁵\n\
  \n从概念上讲，ICO 体现了区块链完备解决方案作为公平准入和价值交换促进者的承诺。它们通过扩大金融准入，服务于比商业银行、天使投资人或风险投资基金能够或可以服务的更多类型的创业者来实现这一点。准入的改进也延伸到了供应侧。ICO\
  \ 允许任何投资者在几乎任何水平支持创业者，即使是金额小于 0.01 美元。在一个从许多参与者那里收取少量资金的系统中，双方都能以公平的价格享受更公平的价值交换。\n\
  \n### 智能合约作为监管者\n\n在探索这些动态在现实中如何运作之前，我们想简要触及支持区块链完备解决方案并确保其参与者公平性和安全的机制。一个基础性的促进因素是智能合约。正如我们在讨论数字货币中所解释的，用户与数字平台之间缺乏明确合同，导致后者能够捕获并存储无限的数据。合同的存在将明确条款并规定参与者作为交换可以获得什么。智能合约的概念源于\
  \ 1994 年的尼克·萨萨博（Nick Szabo），他是一位计算机科学家和密码学家，被认为设计了比特币的前身。¹⁶\n\n\n\n\n\n简单的智能合约捕捉了基本的规则和标准，以实现自主的对点交易。而涉及多方或复杂信息流的更复杂的交易所则会使用更先进的技术，称为`decentralized\
  \ application`或`dapp`。`Dapps` 是使用`smart contracts` 加上额外的代码的应用程序，用于实现涉及后端计算和前端访问的数字资产（代币）交换。在不分过简化的情况下，如果一个交易仅仅是两个对点交换数据标记那样简单，则会使用`smart\
  \ contract`。而会使用`dapp` 来实现，例如保险理赔，这种理赔涉及从保险公司赔付资金给理赔人，并涉及理赔信息的交换和处理。\n\n`smart contracts`\
  \ 和 `dapps` 捕捉并执行`blockchain` 的规则。这些规则在公共区块链中具有`consensus mechanism`（共识机制）这一额外保障，以确保每笔交易都能公平地遵循。尽管捕捉这些规则的技术仍然不成熟，但它们将起到与当今中心化监管相同的功能——作为一种保障。事实上，`smart\
  \ contracts`、`dapps` 和 `consensus` 可能比我们现在拥有的中心化和中介金融系统更有效、更便宜、更快速。但在这一承诺实现之前，存在着显著的学习曲线，正如`DAO`\
  \ 项目所所示的那样。\n\n## DAO 项目\n\n`DAO` 项目是一个去中心化的区块链组织，其形成的目标是资助构建去中心化运营的项目，每个项目都由 `DAO`\
  \ 代币持有者投票。该项目没有可以意义的组织，被设计为完全由共识驱动。2016 年 5 月，它筹集了惊人的 1.5 亿美元。但下个月，一个代币持有者利用`smart\
  \ contract` 和网络代码中的漏洞，抽走了等于 5000 万美元的资金。得益于网络规则中的微妙之处，社区能够分叉该项目的`blockchain`，冻结货币，并将剩余的\
  \ `DAO` 资金清算给原始投资者。\n\n`DAO` 项目进一步证明了，一个引起共鸣的想法可以在不求助于传统资本市场的情况下从大众筹筹。但它也暴露了去中心化金融底层机制的不成熟，尤其是缺乏监管救济。`DAO`\
  \ 项目事件的罪祸首是运行在其`blockchain` 上的`smart contract`。`ICOs` 已经沦为传统货币操纵和其他非法手段带来的更直接挑战的牺牲品。\n\
  \n## ICO 的风险与收益\n\n`ICOs` 对金融去中心化的影响体现在通过区块链支持的众筹获得资金的公司数量上。挑战也通过 `ICO` 支持的风险企业的高失败率而显露出来。波士顿学院研究人员的一项分析显示，发行\
  \ `ICOs` 的初创公司中有 56% 在代币销售完成后的个月内倒闭了。考虑到大多数获得种子资金或风险投资的初创公司未能获得更多融资并最终倒闭，这种失败率并不令人意外。然而，这种被极度缩短的时间表引发了人们的疑问，即这些公司是否拥有足够严谨的想法来支持融资。\n\
  \n`ICOs` 吸引了许多合法企业家和投资者的关注，但也吸引了欺骗者和投机者的关注。一些欺诈是由自封的企业家实施的。一个听起来很响亮的想法加上过头的营销就可以吸引投资者参与\
  \ `ICO`，从而为发行组织带来数百万美元，即使该组织对这数百万美元的用途模糊不清。有限的监管允许了这种模糊性持续。\n\n正如第 4 章所述，代币分为几类。`Security\
  \ tokens` 代表对公司的股权投资，类似于在 `IPO` 中购买股票。相比之下，`Utility tokens` 则据称为持有者访问技术解决方案预留了排队位置。但早期的\
  \ `ICOs` 中很少有要求发行公司生产产品的关联合同。因此，许多 `ICOs` 什么都没有产生。即使是由诚实的企业家推销的合法想法也可能成为 `ICO` 操纵的受害者，特别是投资者发起的“拉高后出售”活动，他们推高币价，然后在市场上抛售代币，导致价值崩盘。此外，与\
  \ `ICOs` 和操纵主题混淆的还有 `cryptocurrency airdrops`（加密货币空投），这是一种向指定接收者的钱包一次性免费发放代币的行为；`airdrops`\
  \ 试图为代币及其相应的`blockchain` 创造流动性和兴趣。它们是区块链领域的零售促销活动。\n\n在这个炒作和模糊的市场中运营的许多企业家是寻求替代方案来资助其热忱的诚实商人。`bitcoin`\
  \ 和 `Ethereum` 币价的上涨帮助许多看到金融去中心化访问的承诺。然而，阵痛已经存在并将继续存在。2018 年加密货币价值的崩盘缓解了 `ICO` 热，导致下半年的\
  \ `ICOs` 数量远少于上半年。那些已经完成 `ICOs` 但未将资金转换为法币的组织看到了初始 `ICO` 价值的下降。这些组织现在没有足够的运营资金来继续下去。另一些则在资源更紧张的环境下重新制定它们的战略计划。\n\
  \n这些挑战都没有减少 `ICOs` 的承诺。相反，2017 年到 2018 年期间是去中心化金融的一个实用的概念证明。在公司所有权引入编程性从根本上改变了资产创建、投资和交换的模式。`ICOs`\
  \ 的成功与失败表明，广泛的金融去介化可以扩大金融的获取和交付。`ICOs` 对投资者来说似乎是有利的。上述波士顿学院的报告发现，`ICO` 投资者的平均收益率为\
  \ 86%；研究人员还认为，欺诈 `ICOs` 虽然是真的，但影响很小，因为投资者识别了它们并对这些 `ICOs` 资助不足。\n\n\n\n\n\n加拿大消息应用\
  \ `Kik` 成立于 2009 年，于 2017 年进行了一次反向 ICO。²²拥有大约三亿注册用户的 `Kik` 与 `WhatsApp`、`Facebook\
  \ Messenger` 和 `微信` 使用相同的广告驱动模式进行竞争。这家加拿大公司通过传统渠道筹集了大量资金，但在 2017 年，它决定将其解决方案演变为代币化和去中心化的全区块链模型。为此，`Kik`\
  \ 进行了反向 ICO 并出售了近 1 亿美元的 `Kin` 代币，这些代币也用于平台，在用户互动时提供激励和奖励。`Kik` 的首席执行官 Ted Livingston\
  \ 表示：“我们的最终愿景是让 `Kik` 成为成百上千个数字服务平台之一。如果我们能让所有开发者都集成 `Kin`，那么作为消费者，我可以在所有这些地方赚取并花费\
  \ `Kin` 会怎么样？”²³\n\n`Kik`并不是唯一尝试这种方法的公司。柯达（Kodak）在 2018 年实验了 `KodakCoin` ICO，作为\
  \ `KodakOne` 权利管理平台的一部分，该平台旨在允许摄影师对其数字作品的版权进行变现和监控。²⁴\n\n### 去中心化金融的监管\n\n加密货币以及随之而来的\
  \ ICO 大部分大多运行在政府监管范围之外。那些日子似乎已经结束了。²⁵ 在监管机构的严密监视下，围绕 ICO 的定义不明确的规则正在迅速组织成体系。一些国家（如中国和韩国）已完全禁止\
  \ ICO，并对加密货币活动进行严控。其他国家则采取了更加包容的态度。²⁶由于没有适用于跨国的标准政策，一个完全在区块链上运行的全球去中心化金融市场的想法仅仅是理论上的。\n\
  \n对于 ICO，美国已开始根据证券交易委员会的指南将证券型代币作为证券进行监管。²⁷其他国家（如加拿大、法国和德国）正在审查代币的功能，以确定特定代币是证券、实用工具或其他实体，并据此进行监管。例如，法国监管机构通过了\
  \ `PACTE` 法案，其中包含了一项鼓励代币发行者获得在该国运营签证的条款。²⁸\n\n明确的证券型代币将越来越多通过一种混合的 IPO/ICO 模型发行，被称为“证券型代币发行”，或简称\
  \ `STO`。²⁹围绕 `STO` 的合同比 ICO 更具结构化，其明确的要求为发行者和投资者提供了某些法律保护。`STO` 也将受到更严格的监管（取决于管辖区），并仅限于合格投资者。更严格监管可能会对去中心化参与产生巨大打击。³⁰\
  \ 然而，监管也可能允许创造更多元的证券，以促进数字资产和实体资产（如 `IoT` 设备及其产生的数据）的交易。\n\n`STO` 仅适用于证券型代币的发行。ICO\
  \ 将继续推进实用型代币，但在更有监管的未来，运行 ICO 的智能合约将包含对发行者和代币持有者的要求，规定在交换中谁获得什么。\n\n金融去中心化的路径必须考虑稳定币。由于稳定币旨在稳定加密货币的波动，它们间接参与了金融去中心化，同时创造了另一个与加密货币相关的监管挑战。监管机构需要对市场监管进行整体观察。迹象表明，一些监管机构打算这样做。例如，在美国，司法部和大商品期货交易委员会正在探索\
  \ `Tether` 稳定币作为操纵加密货币市场（特别是 `bitcoin` 交易）工具的角色。³¹\n\n### MOVIECOIN 与 ICO 之外的去中心化金融\n\
  \n围绕加密货币和 ICO 的宣传、活动和资金提供了一个关于全区块链模型如何颠覆旧规则的案例研究。区块链初创公司 `MovieCoin` 正试图将这种方法应用于大预算的好莱坞风格电影的融资。\n\
  \n大预算电影制作与风险支持的融资相似，因为两者都依赖于少数主要投资者的巨额资金。在电影行业，资金在任何人看到回报之前会被锁定多年。在电影院放映和流媒体方面还有另一层的合同和许可需要处理。\n\
  \n`MovieCoin` 正在开发去中心化的金融替代方案，使制作和分发端都更具流动性。该公司于 2017 年成立，开发了一个区块链平台和一个 `MOV` 代币来自动化支付收集和分配。`MOV`\
  \ 是一种旨在促进现金流管理的实用型代币。通过运行在 `MovieCoin` 平台上的智能合约，这些代币理论上将促进支付并消除第三方服务供应商，使参与的贡献者（包括演员和其他创作人员，他们通常要等多年才能拿到钱）获得报。消费者甚至可以购买\
  \ `MOV` 代币并用它们购买电影票。2018 年的 `MOV` 预售反响热烈，导致代币未进行公开发发售。³²\n\n投资者还可以在电影制作完成之前在加密市场上交易其股份。`MovieCoin`\
  \ 平台上的 `MSF` 代币与其限制访问和锁定投资，不如扩大投资者的参与度并提高市场流动性。\n\n2019 年，`MovieCoin` 计划推出另一种代币——`MovieCoin\
  \ Smart Fund` 代币 (`MSF`)，这是一种证券型代币，允许合格投资者投资购买和制作原创的好莱坞风格电影内容。创始人、前投资银行和电影融资专家 Christopher\
  \ Woodrow 告诉我们，`MovieCoin` 计划在六资助六部电影。³³ `MSF` 有效实现了电影所有权的数字化和去中心化。通过它，新一类合格投资者可以拥有电影的一部分。在接受《福布》杂志采访时，Woodrow\
  \ 说：“要考虑的关键点之一是准入。以前要投资好莱坞电影，必须拿着一张 5000 万美元的支票才能受到重视。利用区块链技术可以为以前无法做到的合格投资者开启一个全新的领域。”³⁴\n\
  \n### SWARM FUND\n虽然公司只对 `MOV` 实用型代币以及 2019 年的 `MSF` 代币有 ICO 计划，但 Woodrow 设想他的平台未来可以实现特定项目的代币。\n\
  \n\n\n\nSwarm Fund 是另一个寻求利用代币化结合去中心化，为投资者提供获取和交易价值新方式的公司示例。这家非营利区块链初创公司创建了他们所谓的`私募股权区块链`。其目标是通过让个人投资者购买通常只有机构才能购买的资产，来实现投资的民主化。私募股权、房地产、基础设施建设和自然资源都是\
  \ Swarm 希望向更广泛人群开放的投资领域。这些领域通常需要最低投资额，除了最富的人之外，其他人都无法负担。Swarm Fund 通过允许用户购买 `SWM`\
  \ 代币来进入这些领域，组织会将这些代币聚合成一个投资者群体，能够购买机构规模的区块。如果成功，Swarm 模式不仅可以挑战大型共同基金和对冲基金在广泛消费投资领域的支配地位，还能消除投资管理领域部分的中间环节。例如，通过引入基金费用和定价结构的透明度，并对投资组合提供更详细的洞察，初创公司可以为基金管理创建一个更去中心化的运营模式，并重塑竞争格局。\n\
  \n## 中心化解决方案的命运\n\n随着技术成熟到能够实现完整的区块链解决方案，以及组织开始尝试去中心化的决策、流程和业务模型，受区块链启发的解决方案和其他中心化方法的价值主张将发生变化。市场可能会出现许多场景。\n\
  \n一些在 2020 年代中期上线的受区块链启发的解决方案将获得认可并生存成为标准，即使组织正在拥抱更去中心化的模型。例如，即使去中心化的 `ICO` 环境不断演变，投资银行财团也可以开发出用于\
  \ IPO 的区块链，每种模型为融资市场的不同层次、行业或偏好服务。\n\n完整的区块链解决方案对现有的受区块链启发的解决方案产生不同影响，这取决于这些解决方案的类型。由于很少有\
  \ `FOMO` 解决方案能够投入运行或长期生存，当区块链解决方案成为可能时，这种类型的方案几乎不存在了。相比之下，设计用于自动化内部或行业流程的机性解决方案只要这些流程仍然存在，它们就仍然具有意义。例如，澳大利亚证券交易所正在开发以取代\
  \ `CHESS` 的新交易平台可能就源于机会性类型（参见第 2 章）。然而，这些解决方案不会保持静态。由财团构建或为实现跨组织使用而设计的机会性解决方案如果成功、吸引了用户并开始整合与业务流程相关的数据，可能会转向中心化。相反，随着解决方案所管理的决策被\
  \ `smart contract` 捕获并执行，它们可能会变得更加去中心化。构建为演进型或原生的受区块链启发的解决方案最有可能保持相关性并与去中心化的区块链解决方案共存，只要它们所推广的业务模式或数字资产继续产生长期兴趣。\n\
  \n其他中心化数字环境又是如何？当存在完整的区块链替代方案时，Amazon、Facebook、Google、腾讯、阿里巴巴、Airbnb 和 Uber 还会拥有如此大的权力吗？随着数字化的加速，数字平台无疑将继续获取大量数据来喂养其算法并开发新产品。许多完整区块链解决方案中个人数据的代币化将允许客户在数字环境中保持数据的隐私，但客户是否愿意为了短期的痛苦而放弃使用数字平台带来的便利和速度，仍然是一个未解决的问题。强大的价值主张加上代币形式的激励，对于将客户活动从数字平台转移是必要的。\n\
  \n## 你的真实业务视角\n\n### 你学到了什么？\n\n区块链光谱的完整区块链阶段将在 2020 年代中期开始，尽管这些解决方案自 2009 年比特币发布以来就已经存在了。事实上，在每个地理位置、市场和行业培养了区块链初创公司的\
  \ `ICOs` 证明了人们对去中心化模型的广泛兴趣。早期采用的行业包括金融，此外还有零售、旅游和社交媒体。完整的区块链解决方案旨在通过让客户获得更广泛的机会来赋能他们，但是在他们能够控制自己的身份和数据的环境中。\n\
  \n### 你应该对此做什么？\n\n紧跟市场趋势将使你掌握组织完整区块链活动的时机。持续监控区块链初创公司市场。新的完整区块链公司已经涌现，以扰乱各行业的现有者。这些初创公司希望开采的机会脉络预示了去中心化和代币化模型可以立足的一些可用机会。此外，继续跟踪\
  \ `ICO` 市场的活动。尽管该市场充满了法律困难、流动性问题和波动，但市场的成熟和某些监管的增加可能帮助去中心化金融部门转化为一个改进资本获取、更贴近客户并可能重构融资成本的机会。\n\
  \n### 接下来是什么？\n\n\n\n\n区块链完备解决方案的成熟将与其他技术趋势同步发生，包括物联网（IoT）和人工智能（AI）应用的日益增加。当区块链将物联网和自学习算法整合到其协议中时，我们将看到更多种的可交换资产、更快的交易速度以及更广泛的网络参与者。随着算法代理开始代表个人和组织进行自主交互和交易，网络甚至可能被“物”所接管。我们将在下一章中探索这个增强型区块链解决方案的世界。\n\
  \n![image](img/part3.jpg)\n\n在当前对区块链的热热中，人们很容易忽视那些在未来十年内准备爆发的并行技术趋势。对于区块链而言，其中最重要的是物联网和人工智能。今天，我们认为组织主要由人组成。然而，在短短几年后，随着组织在其产品和基础设施中嵌入数以十计的设备和传感器，组织内智能资产的数量可能会远超人数。今天，我们认为是人来做决策并采取行动。很快，许多决策将转化为算法并由自主执行。\n\
  \n物联网和人工智能将激活新的价值并驱动新的创新。当它们与区块链相结合时，就创造了`增强型区块链`——在这种区块链中，智能、自主的物体加入人类成为参与者，能够对数字资产进行识别、创建、交易和谈判。创新者们已经在向这些协同效应迈出尝试性一步。\n\
  \n住房短缺在中国大城市催生了非法租赁市场。当真正的房产所有者不在家时，保安可能会“租用”一个单元，或者租客本人可能会允许非法转租。住房诈骗的挑战正迫使中国尝试不同的方法。在北方城市雄安，规划者旨在区块链的支持打击住房诈骗，并提高租客获得物业的机会。蚂蚁金的一位代表解释了这种方法：“区块链将用于验证物业的真实性。房东和租客将在区块链上对租赁条款达成一致。区块链的另一个好处是，当租客申请住房贷款时，他们不需要涉及多个机构来证明租赁的真实性。因此，这种区块链租赁解决方案让租客享受更便利的房屋租赁体验。”¹雄安不是普通的城市；它是一个正在发展中的智能城市。^a\
  \ 除了使用区块链，它还使用了人工智能和物联网，具有结合这三者的潜力。²《AI 超级大战：中国、硅谷与新世界秩序》作者李开夫谈到了中国科技公司百度的努力：“百度已经在与雄安当地政府合作，建设一个以环境为重点的\
  \ AI 城市。可能性包括配备传感器的水泥、支持计算机视觉的交通灯、带有人脸识别功能的交叉路口以及将停车场改造为公园。”³\n\n当然，物联网和人工智能不需要区块链。这些技术已经开始影响我们的生活、工作和互动方式。然而，如果没有区块链，最强大且无处不在的物联网和人工智能解决方案将在中心参与者的控制下——如数字平台、政府实体、公用事业公司和银行等——在后台隐形无迹地运行。相比之下，有了区块链，物联网和人工智能变得更加透明和可审计，其操作可以实现货币化，从而开启创造价值的全新方式。\n\
  \n在本章中，我们研究了增强型区块链解决方案——定义为应用于由人和物组成的环境环境，并由自主算法智能运行的区块链——如何释放物联网和人工智能的潜力，同时确保隐私、公平和访问性。鉴于增强型区块链阶段在十年后才会开始，本章包含了一些推测和愿景。尽管如此，通过观察物联网和人工智能在数十个行业中的进展，我们将从今天的实验推演出增强型区块链的一些场景。特别是，我们研究了物联网、人工智能和区块链如何互补，并驱动广大组织迈向竞争优势。\n\
  \n## 物联网与人工智能简要入门\n\n高德（Gartner）将物联网定义为“一个包含嵌入技术的物理对象网络，这些技术能够使其与其内部状态或外部环境进行通信、感知或与之交互。”⁴这些嵌入对象实现了许多实际应用。例如，在制药领域，温度敏感药物包装中的传感器可以在条件略高于特定水平时激活嵌入的冷却功能，节省数百万美元的库存并可能挽救生命。⁵在智能城市中，物联网可以用于公共交通，以实时观察需求并动态改变火车班次，或者可以在公用事业公司拥有的地下管道上放置传感器，以检测故障点并防止主管破裂。\n\
  \n这些想法并非理论化。密苏里州堪萨斯市在 2018 年进行了一项试点，利用街道摄像头捕捉交通流数据。一种算法分析了数据并识别出产生坑洼高风险的街道。随后派遣街道维修队在坑洼出现`之前`对这些街道进行重新铺设。堪萨斯市首席信息官鲍勃·本内特估计，这种预防性维护方法通过在问题严重之前阻止其发生来节省了资金。⁶\n\
  \n区块链上的类似例子来自`PotholeCoin`，这是一个旨在使公共基础设施维修融资去中心化的解决方案。`PotholeCoin`应用程序允许司机注册所需的道路维修，并投入由代币资助的“赏金”支付维修费用。当积累了足够的代币时，区块链会向指定的维修机构（市政基础设施部门或私人承包商）发送消息。维修完成后，公司将通过智能合同付款。这种方法使社区成员能够集资资可能不是市政基础设施部门优先事项的维修工作。⁷\n\
  \n人工智能是指使用高级分析和其他基于逻辑的技术来解释事件、支持并自动化决策，以及采取行动。尽管人工智能的方法和技术各异，但在区块链背景下，我们泛泛使用该术语指的是自主运行`并调整`的智能算法（即无需人工干预），以实现更有效的数据管理，从而加速交易流和互动。当与物联网相结合时，人工智能可以检查由分布式多样物体网络收集的数据，得出结论，并实时对信息采取行动。在城市中，这些行动的简单示例包括改变交通灯以缓解拥堵、调整智能电网的能量分配、根据冲突迹象派遣警察巡逻，或者像堪萨斯市（在其坑洼试点中使用人工智能算法分析视频素材）那样优先考虑街道维护。\n\
  \n\n\n\n\n区块链在这一切中处于什么位置？物联网（IoT）、人工智能（AI）和区块链开始以相互互利的方式进行交互和进化。通过将区块链应用于物联网和 AI\
  \ 带来的能力，一种新型的信任基础设施得以实现。通过传感器采集并使用 AI 分析的数据将以透明的方式进行处理，可能更加安全，且不受操纵的威胁。由此增强的区块链解决方案将变得强大，并放大物联网和\
  \ AI 的有效应用。区块链与 AI 以及物联网之间的关系双方都值得更详细的说明。\n\n## 物联网与人工智能如何增强区块链\n\n当区块链的设计更加去中心化，且其代码能够处理更大规模、更复杂的交易时，它的优势会明显增加。物联网和\
  \ AI 无论是单独还是结合，都可以作为区块链去中心化的智能代理。让我们来看看这两项技术是如何实现这一角色的。\n\n### 智能合约变得真正智能\n\n正如前文所述，智能合约是捕并执行区块链业务规则的代码行。智能合约的最初愿景是假设合同将由具有智能、自学习能力的算法运行，这些算法能够适应环境。换句话说，算法的行为可以超越市场最初定义的规则，并可能挑战监管框架。\n\
  \n目前区块链中使用的智能合约并非如此。为受启发启发解决方案以及新兴的区块链原生解决方案开发的智能合约只是简单的 `if-then` 规则引擎，只能执行有限的特定操作。例如，ICO（代币发行）中使用的智能合约定义了提供的代币类型以及买家购买后获得什么，但它无法根据市场或参与者的活动动态改变结果。\n\
  \n如今智能合约的应用如此有限，是因为该技术尚未成熟到足以在足够的规模上可靠、安全地执行更多操作。另一个原因是业务领导者不习惯将控制权交给一行代码。在十年后，AI\
  \ 和区块链都将进化到光谱中的增强阶段，届可以使用更先进的算法和协议。届时，智能合约有望将变得足够智能、可靠且安全，能够自主引导和引发活动。人类在各种业务领域部署算法方面也将拥有更多经验。\n\
  \n区块链初创公司 Fetch 正通过其解决方案进入这一愿景领域，该方案允许采用者编写并部署自主软件代理来完成特定任务。Fetch 代理可以将数据从一个参与者传递给另一个，或者执行特定的服务。在该系统中，代理将获得\
  \ Fetch 令牌作为奖励。有趣的是，Fetch 平台允许设计者定义 Fetch 代理运行的工作环境。人类认为工作环境主要是基于地理角度的，而 Fetch 代理可能被设计为为了安全而调整其工作空间，例如。⁸\n\
  \n### 万物成为节点\n\n正如 AI 可以让区块链变得智能，物联网可以为特定的区块链扩展扩展去中心化，特别是在引入 5G 之后。⁹ 扩展物理环境中分布的物体的数量，为区块链网络创造了更多参与者。当然，并非所有物体都能采集数据并运行智能代码或做出自主决策。这需要足够的安全性、本地内存、网络能力、处理能力和本地储能，而只有部分物体具备这些条件。然而，足够大且强大到具有本地智能并自主运行的“复杂”物体可以作为区块链的参与者——甚至是具有经济和客户端特权的全节点——并以此扩展网络规模和价值潜力。\n\
  \n此外，物联网可以提高数据的即时性、质量和准确性，例如通过使某些应用中的数据源实现多样化并可能去中心化，使得没有任何单一数据点可以决定行动。以你家的气候为例。如果你住在一个旧建筑里，你可能只有一个温度控器，它测量其所在房间的空气温度，然后告诉制冷系统根据该读数调整处处。如果温度控器在厨房或附近，它所描述的家庭气候比真实情况要暖。相反，如果你有一组分布在家里各处的移动温度传感器，并安装了一个可以与传感器通信的网络温度控器，那么观测到的数据将提供一个更完整的画面。\n\
  \n通过交叉引用来自多个源的数据，物联网可以提高上传或链接到区块链的数据质量。从理论上讲，多个无偏见的来源可以提供比人类更可靠的观察视角。例如，一个直接从汽车内外连接物体收集数据的区块链，可以提供比车主更准确的真实版本，尤其是当该车主倾向于误导潜在买家关于车辆状况时。物联网这种方式可以促进真相的产生。\n\
  \n### 身份变得去中心化和主权\n\n在第 6 章中，我们描述了一种场景：在互联网上购物的人能够将其个人数据变现，并根据意愿与营销人员或零售商分享部分数据。从现在到区块链原生阶段的开始（大约\
  \ 2023 年），实现个人数据变化的技术仍然不成熟，部分原因是因为使用了静态 ID。\n\n相比之下，去中心化自主主权身份（或 `SSI`）是一种动态且不断进化的数字身份，人们可以灵活地使用。10\
  \ 个人的 `SSI` 将向数字系统识别身份，并在不丢失隐私的情况下提供安全访问。结合 AI，`SSI` 可以支持所有者部署的自主代理去寻找机会（例如，在我要工作的城市寻找一间新房子）并采取行动（获取房押贷款预审批）。\n\
  \n在各种语境下建立数字身份的需求是一个旧想法，但它正获得发展动力。万维网联盟（W3C）一直在努力为网络用户定义其称之的“去中心化标识符”的标准。11 与此同时，非营利组织\
  \ Sovrin Network 于 2017 年成立，作为一个开源项目，旨在作为互联网上创建和管理 `SSI` 的公共服务工具。Sovrin 的目标是创建一个驱动照或护照的数字等物——一种便携的、普遍接受的身份证明。然而，护照与\
  \ `SSI` 之间的区别在于，`SSI` 不由中心实体许可或维护。相反，互联网用户应该能够提供信息以确认身份，并通过去中心化系统获取 `SSI`。\n\n\n\
  \n\n\n# SSI 倡议\n\n在另一项行动中，不列颠伦比亚省政府正寻求应用 SSI 技术概念来解决现实问题。在最近与我们的交流中，不列颠伦比亚省新兴数字倡议执行主任约翰·乔丹（John\
  \ Jordan）描述了他的团队正在为省内企业开发的一种身份解决方案。正如 Jordan 所解释的，企业必须经过许多繁琐程序才能保持许可证有效。鉴于企业可能需要多个许可证、公司注册证明和其他验证文件，且这些文件均由不同的政府部门颁发，这一过程既昂贵又耗时。尽管整合并集中管理这些信息似乎是一个好主意，但\
  \ Jordan 认为整合是错误的方法。\n\n“我们希望摆脱中心数据权威机构，”他说，“我们不希望以聚合数据的方式，可能会导致这些数据被滥用。我们想让电子邮件、电话号码等数据的关联变得困难。”他继续道，“互联网已经崩溃了。当交易需要\
  \ Visa 或会损害隐私的大型数据存储作为支撑时，政府无法向经济中注入信任。”13\n\n该省正在开发的解决方案——是与安大略省的对应部门以及加拿大联邦政府合作——使商业注册机构、许可服务和承包机构等组织能够使用可验证凭证（verifiable\
  \ credentials，一种新兴的 W3C 标准）发布真实数据。这些可验证凭证将发布在一个使用 Hyperledger Indy 开源软件的公共凭证注册表（`OrgBook\
  \ BC`）上。这种初始方法是引导启动策略的一部分，旨在为市场出现允许企业主持有自己的可验证凭证的软件做好准备。不列颠伦比亚省和安大略省政府预见，企业将使用这些经过认证的数据来建立信任的点对点关系，例如与供应链伙伴之间所需的关系。这些新的软件服务共同相互协作，建立一个全新的全球系统——可验证组织网络（Verifiable\
  \ Organizations Network）。该网络将促进新的数字关系的形成，这些关系是可持续且值得信任的，无需中心化或中介服务。\n\n加拿大的地区政府并非唯一认为为企业创建自适应性\
  \ ID 解决方案具有行政价值。在华南方，作为大湾区（中国旨在将包括香港、澳门和深圳在内的多个城市整合为一个一体经济枢纽的努力名称）的一部分，香港应用科学技术研究院控股（`ASTRI`）正在探索如何利用区块链技术来促进香港、澳门和中国大陆之间的商业注册，这三者都有各自独特的法律框架。如今，注册过程非常复杂，企业必须信任未知的中介在另一个市场开设子公司。在这种情况下，正如\
  \ `ASTRI` 技术官 MeiKei Ieong 博士解释道，“区块链的作用很小。它只通过匹配数字密钥来检查数据是否真实并经过认证。它解决了一个特定问题，但对经济发展具有重要影响。”14\n\
  \n## 实体成为节点\n\n随着 SSI 技术的成熟，我们将看到 SSI 与物联网（IoT）的融合，形式为位于人体内部执行特定任务的生物植入物。生物植入物是医学研究的一个新兴领域。目前的应用包括：可以直接在皮肤下释放糖尿病药物无需每日或每周注射的植入物；用于通过深脑刺激治疗阿尔茨海默病和帕金森病等特定疾病的脑植入物；以及“假性记忆”——一种可以捕捉模式并回放的植入物。15\
  \ 对于瘫痪或缺失肢体的人来说，研究人员还在开发允许运动的植入物。16\n\n这些进展预计将导致可以放入人体并自主运行的植入物——将其想象成一个节点。一些私营公司并没有等待医疗领域提供解决方案。17\n\
  \n## 区块链如何惠及物联网和人工智能\n\n正如物联网和人工智能可以造福区块链一样，区块链同样可以惠及物联网和人工智能。区块链网络实现了更多样化的交易，提高了真实性水平，并鼓励了更多信任。让我们详细检查这些方面。\n\
  \n### 有了区块链，智能设备可以进行识别和交易\n\n目前的大多数物联网应用涉及在制造产品中内置传感器，并提供兼容的软件来提取和分析数据的公司。在这种背景下，设备之间并不相互交互，而是与中心平台交互。然而，随着物联网的成熟，交互的多样性和数量将大幅增加。5G\
  \ 技术的引入将推动这些增长。其结果之一是设备可以直接通信，而无需中心平台来调解交换。另一个结果是信息的种类更丰富、价值更高。例如，办公楼内的设备将能够与五十码外的公用事业管道内的设备对话。这些分布式设备属于不同的实体并运行在不同的技术上，它们需要一种方式相互识别、通信、谈判和交易。\n\
  \n区块链的核心价值主张是为分布式计算环境中的识别和微交易提供架构。为了实现识别，设备将拥有同于对象的去中心化 SSI。18 对于微交易，区块链将实现更多形式的价值。正如我们在第一章中所述的，法币及其代理方案（银行账户、信用卡、自动清算系统、SWIFT\
  \ 等）并非为设备之间可能的交易量、资产种类或机器机微交易类型而设计。当数百万此类设备交换单个能量单元或数据项时，任何单笔交易的规模将远低于 0.01 美元，而交易数量将增加到无法想象的规模。在这种高量、低单价的环境下需要新的价值形式和原生货币。\n\
  \n\n\n\n\n微交易能力延伸到了原生数字资产的交换。我们提供了一些示例，展示了在代币环境中，数据如何作为单个单元或包的形式进行交换和货币化，或者个人关注度如何出售给内容创作者。单个数据点或五分钟人类关注的市场价值随市场和语境而异，但通常情况下，单笔交易的价值将非常小——每笔几美分到几美元不等。在数百万甚至数十亿参与者之间安全且以极快速度交换这种价值，需要去中心化、自主且代币化的机制。因此，业务领袖必须意识到代币化在法货币替代和支付之外的作用。最重要的是能够利用代币来`创建并代表`新形式的价值，并实现这种这种价值的新型微交易。\n\
  \n增强区块链的第三种交易效应是能够分部分交易资产，而不仅仅是作为整体。这种构想在保险领域的一个例子是可变率定价。最近与某客户的讨论展示了航运行业进行差异化定价的可能性。例如，`smart\
  \ contract`可以对放置在船上低风险或高风险区域（中心位置更安全）的货物，或者通过更安全或较不安全的国际路线运输的货物，协商差异化定价。\n\n## 区块链让数据具备语境\n\
  \n物联网（IoT）和人工智能（AI）高度依赖于输入数据的质量、准确性和安全性。然而，业务领袖早就知道他们的某些数据是“脏”的。来源和类型的差异、捕获和组织方式、谁拥有访问权限、存储何处以及许多其他问题，使得数据可靠性成为一个棘手问题。\n\
  \n物联网和人工智能从多个源捕获并分析数据并从各种来源构建准确数字视图的结合能力，为数据准确性提供了一项优势。当与验证数据及其可审计记录的区块链共识机制相结合时，这些优势将变得更加可靠和有用。`consensus`可以拒绝与正常模式和系统规则不一致的数据。这种在大量数据源中发现不一致之处的能力，对于检测设备故障的早期迹象与检测数据泄露同样有用。有了这种通过共识验证的能力，任何对数据的篡改都更容易被审计。\n\
  \n人工智能也受益于可靠的数据。专家使用大型数据集来训练算法。数据越准确，算法的性能就越可靠；数据缺陷越多，算法就越偏偏。虽然编程周期中的人为影响也是一个因素，但我们需要避免向这些算法输入有缺陷的数据集。如果算法要克服抵押贷款发放工具或刑事判决算法等广泛应用中存在的算法偏见证据，我们需要使用我们能收集到的最准确的数据来开发它们。¹⁹\n\
  \n人工智能、物联网与区块链结合的愿景的一个示例是`digital twins`，即根据从传感器收集的数据创建的真实世界物体或系统的数字表示。^b 数字孪生允许组织以数字形式表示物理资产，以便更好地管理和交易这些资产。例如，香港机场管理局建立了香港国际机场的数字孪生，帮助其在执行机场扩建计划时协助设施规划和管理。数字孪生允许机场员工可视化机场区域，并对不同的变化进行建模以观察设计选择的影响。这种建模功能对于机场扩建的工程师以及零售店主特别相关，零售店主可以更容易地可视化增建部分将如何影响客流。\n\
  \n需要说明的是，机场管理局是一个中心化组织，其孪生并不存在于区块链上。将这一概念转换到涉及多个设施所有者和利益相关者的环境中，你就能看到增强区块链上的数字孪生如何从各种过程中获益。设施所有者可以验证数据并保护自己免受错误数据、错误交互和未经授权用户的影响。参与者还将享有访问权限，使得不同位置的人可以与数据交互并在此基础上决策。最后，区块链参与者将获得替代融资方案，这是由投资者查看并与之交互的能力所促进。\n\
  \n## 物联网与人工智能的危险区\n\n尽管存在优势，但物联网与人工智能结合数据和区块链也存在潜在的陷阱。一个问题来自数据过多。多个传感器收集相同或互补数据并向多个系统传输重复信息会增加复杂性，并产生很少的见解。请注意，物联网开发者使用数字孪生概念的变体，在网络边缘过滤冗余数据。\n\
  \n另一个风险是数字平台部署并利用事物来促进中心化，以至于区块链替代方案无法竞争。考虑一种模型，例如亚马逊部署了数千架交付无人机，然后将其剩余容量租给保险公司等第三方。例如，当保险代理人需要照片时，它可以下单，亚马逊可以让无人机在送货途中拍照。这种服务的便利性和高效将使保险公司以后很难切换到替代方案，而亚马逊则以极低的成本获得了新的收入来源以及新的数据来源。正如特洛伊木马启发的区块链解决方案通过交付短期价值吸引参与者，这种中心化的物联网服务可能会将事物变成特洛伊木马群，将流量和价值引向所有者。\n\
  \n然而，区块链解决方案可以通过实现预先物理接触和长期合同谈判的新型安全模式来缓解这个问题。例如，无人机将成为零售、物流和保险等跨行业共享资源，产生范围经济。得于区块链记录的不可篡改性，这种安排将提高对航空法规的合规性，并通过为无人机创建虚拟飞行数据“黑匣子”来提供保险。从商业模式的角度来看，跨行业的价值交换可能是暂时的，并以极小的单位进行交易。这些交换将产生由`smart\
  \ contract`治理的费用收入，允许用数据代币交换另一种形式的价值代币，这两种代币都通过区块链发行。例如，通过这种方式，区块链倍了业务交互，并实现了跨行业的新机会发现，甚至重塑了行业边界。\n\
  \n在 2018 年一起 Uber 车辆撞击行人后，消费者对自动驾驶汽车的发展也日益增加担忧。²⁰ 同样，谷歌的 Waymo 在亚利桑那州的查德勒也遭到了公民的愤怒，当地人质疑该公司的自动汽车对他们城市的工作和隐私意味着什么。²¹\n\
  \n\n\n\n因此，小型企业，尤其是直接面向消费者的微品牌，可能从行为透明化中获益最多。而区块链的不可篡改性、可追溯性和审计性功能为各种组织提供了一种保持透明度并证明其行为符合其意图的方法——在当今人们对公共和私立机构信任度较低的环境下，这是一个非常实用的工具[²²]。\n\
  \n# 智能城市：增强区块链的实验室\n\n城市运行在商业与政府之间一个奇特的十字路口。像企业一样，城市也需要收入，并竞争吸引那些支付当地所得税、房产税和销售税的人和机构。但城市还负责广泛的关键公共服务，包括执法、学校系统、安全用水和畅通的道路。当产生收入的人的需求与使用服务的人的需求发生冲突时，紧张局势便随之产生。\n\
  \n在高科技时代，随着城市争夺科技公司的关注，城市挑战发生了新的转折。这种竞争以多种形式出现，包括为了吸引或留住大型企业而进行的知名斗争（例如 `Amazon`\
  \ 的 `HQ2`）；技术导向型基金会（包括 `Bloomberg` 和 `Gates` 等）针对城市的资助活动；以及科技公司为了锁定市场并与监管者进行自然实验而对城市的招揽[²³]。城市是数据之战的最前沿。正如人们所说，时间短暂，因为现在全球超过一半的人口住在城市，这一比例预计到\
  \ 2050 年将增长到 65%[²⁴]。\n\n智能城市的理念被推为解决许多城市增长问题的方案。尽管对构成智能城市有不同的定义，但 `Gartner` 将其定义为一种城市治理的生命周期方法，专注于改善公民生活、刺激经济和保护环境，利用数据和分析为居民创造以用户为中心且情境化的体验[²⁵]。这种愿景是值得赞的，但智能城市的努力才刚刚开始，特别是它们需要持续的智能化支持[²⁶]。尽管如此，一些城市已经在将智能城市的方法应用于各种问题了。\n\
  \n## 现有环境中的智能理念\n\n堪萨斯市从 2016 年开始实施智能城市愿景。除了本章之前描述的路洼预防性维护解决方案外，堪萨斯市的计划还包括更新其交通系统使其更高效、更具包容性，并利用技术管理犯罪。拟议的变更包括改进低收入、高流量的廊道；整合自动驾驶车辆（特别是在机场内部及周边）；以及车辆内部和车辆之间的数字连接。公交和公交站标志牌上的传感器旨在提供关于人流量、旅行时间和交通需求的准确信息，以便城市能够更好地适应流量和需求[²⁷]。\n\
  \n数据是智能城市努力的重要资源。在纽约，市长的`恢复与韧性办公室`（`Office of Recovery and Resiliency`）正在利用数据指导其减少温室气体排放的优先事项，目标高达……²⁸]\n\
  \n*注：提供的源文本在后半部分包含碎片/不完整的句子。我在对可识别实体和路径应用格式规则的同时，保留了所提供的语义结构。*\n\n\n\n\n一个基于单一平台和统一技术构建的水岸（Quayside）可能会在能源效率、废物管理以及人类和车辆交通方面产生更好的短期成果。然而，这些收益是有代价的：对公民数据的控制权（以及随后的变现）将让给一家私人公司。在民主社会中，这种权力的集中是有问题的。一个人在有其他竞争选择时选择使用\
  \ `Gmail` 或 `Google` 是一回事；而一个在街道上行驶的人，其行为被摄像头捕捉并由其与其没有签署协议的第三方存储，则是另一回事。\n\n隐私倡导者担心这种中心化模式会创下的隐私先例。堪萨斯市的市民在考虑其城市的智慧化努力时也有同样的顾虑。改善一个低收入社区交通系统的计划包括安装光纤电缆以实现\
  \ `Wi-Fi`。但该项目也带来了摄像头以及枪击声检测系统，这让社区成员担心，市新的智慧系统还会为他们采集哪些关于他们的其他信息。³⁴\n\n### 智慧城市中的区块链\n\
  \n隐私与技术之间的紧张关系并非城市所独特。在任何更多数据与更多能够提取洞察力的智能算法融合的地方，这种情况都适用。我们强调的智慧城市案例暗示了市政领导者在城市环境中采取的不同方法。一些努力的开发旨在通过由\
  \ `IoT`、`AI`、`blockchain` 或这三者共同促进的、日益去中心化的环境，提高数字化水平。另一些人则希望将数字化作为进一步中心化的手段。图 7-1\
  \ 说明了这些场景。\n\n#### 图 7-1\n\n增强型区块链的可编程性与去中心化的对比\n\n![image](img/Figure_7.01.png)\n\
  \n西北象限代表了中心化控制下的高度数字化环境。可以称之为城市 `数字黑盒`。算法属于特定组织或机构的财产，对于受算法影响行为和行动的公民来说，这些算法是不可见的。该象限内的智慧城市努力示例包括由中国政府控制数据的雄安，以及多伦住在\
  \ 2019 年 1 月提出的模型（数据控制权由 `Alphabet` 下的 `Sidewalk Labs` 及其合作伙伴持有）。在城市中，控制权当然可以由政府掌握，也可以由技术提供者甚至大型物业所有者掌握。\n\
  \n重申一下，中心化方法在技术效率和交互性方面带来了优势，但在公民隐私、潜在的独立性以及居民利益公平分配方面存在代价。在城市黑盒中，技术事物不可避免地成为监控的代理。³⁵它们通过促使社区成员以特定方式行为，提供了控制他们的方法。³⁶。`AI`\
  \ 加快了对数据的处理速度，并可能就应该收集哪些数据来监控和影响公民行为提出新想法。\n\n社会评分引发了参差不齐的反应。一方面存在损害社区且全球城市都想要限制的行为。丢垃圾、过度使用能源或水、倾倒危险物品、暴力、犯罪、欺诈、剥削——这些只是冰一角。控制部门的核心参与者可以合理地辩称，他们的方法允许对这些行为进行更快速、更准确的监督，从而采取更相关的政策和管理方法。但对于已经习惯了隐私的民主社会来说，代价可能太大了。\n\
  \n另一种方法是让城市环境中的数字工具使用成为可选的——我们将这种方法称为 `模拟白盒`。纽约对建筑升级的建议属于这一类。政府已为希望拥有更高效制暖系统的建筑主发布了指南；这些许多指南包含了传感器技术。同样，该市提倡去中心化发电，以减轻当地公用事业公司\
  \ Con Edison 的压力，并使城市的能源系统对风暴或沿海洪水更具韧性。这些建议的数字化影响微乎其微，同时它们促进了所有权决策的持续去中心化。该象限代表了一个中间步骤。如果能源使用政策变得更加严格，或者城市感到来自具有更有吸引环境城市（包括由数字黑盒实现的城市）的竞争增加，建筑主、公司、市民和其他利益相关者将感受到变得数字化、更中心化或两者兼有的压力。\n\
  \n或者，城市也可以向不列颠伦比亚省 `Jordan` 方向移动，将公民数据的控制权交给所有者——即 `数字白盒` 模型。算法的参数和意图是公民的财产，他们决定如何塑造它们以影响期望的行为和行动。虽然\
  \ `blockchain` 结合 `IoT` 和 `AI` 无法解决数据隐私和使用的所有挑战，但它发挥着重要作用。由 `blockchain` 和去中心化 `SSI`\
  \ 实现的数字环境中的物体所收集的数据可以告知社区资源可用情况和发展需求，同时维护安全性、问责制数据隐私。去中心化的数字城市可以变成一个更具交易性和社交响应能力的环境，因为公民通过共享数据获得公平的价格，并能看到数据是如何被使用的。这些交易不仅关乎利润，还关乎社会福利，如住房、公共交通、洁净空气和绿地。去中心化的数字化还可以通过使城市合同的招标过程公开且可审计，提高地方政府的透明度。这些系统仍然可以引导行为，但它们是以透明的方式进行的，利用代币来激励和奖励。\n\
  \n城市和市民将选择哪种方法？随着 `blockchain` 唤起新的社会机会，我们可能会在全球看到符合数字白盒或数字黑盒场景的情况。对诸如 `Google`\
  \ 等数字平台失去个人数据控制权的恐惧，是挑战中心化的强大动力。因此，公民利益相关者（包括企业及其高管）需要了解 `IoT` 和 `AI` 算法在利益相关者环境中的用法，如果他们想影响并倡导这些工具的公平透明使用。为了这一点，公民必须被激励并参与其中。坦率说，增强型区块链为商业领袖提供了工具，通过代币的形式实现持续参与，为客户、市民和其他利益相关者提供奖励和激励。最终，增强型区块链帮助人们采取产生社会或社区利益的。\n\
  \n## 你的业务视角\n\n### 你学到了什么？\n\n`blockchain`、`IoT`、`AI` 和 `SSI` 的并行发展将在 21 世纪 20 年中期后期汇合成增强区块链解决方案。`IoT`\
  \ 和 `AI` 单独或共同可以促进去中心化并改进区块链。`IoT` 可以增加区块链网络的节点数量并提高数据质量。`AI` 可以通过学习算法使智能合约更智能。增加\
  \ `SSI` 解决方案为所有参与者（包括物体）提供了便携式 ID，提升了区块链的功能；智能物体必须能够识别对方并与其进行交易。\n\n\n\n利用这种共生关系的解决方案已经在智慧城市项目及其他领域出现。多伦多\
  \ Quayside 开发项目和堪萨斯市日益显的紧张局势凸显了在城市现代化需求与安全及数据隐私之间取得平衡的重要性。通过去中心化治理设计的增强型区块链解决方案可以平衡这些紧张关系。\n\
  \n### 你应该对此如何应对？\n\nAI 正在更广泛地嵌入到技术中，并在几年内，它将使各种机器能够做出自主的经济决策。无论是否有区块链，这种情况都会发生，但业务领导者应该探索增强型区块链解决方案如何发现新的、符合伦理的商业机会。\n\
  \n目前，人们对 `AI` 和 `IoT` 的反弹情绪持续不断，他们担心隐私侵犯，以及机器在呼叫中心或汽车驾驶位取代人类所带来的经济影响。作为领导者，你不能低估组织内外所需的透明度和企业社会责任，这将帮助利益相关者理解\
  \ `AI` 和 `IoT` 的优缺点。`Blockchain` 可以帮助你利用不可篡改的记录向利益相关者证明你的行为是恰当且合规的，并且你对个人数据的尊重是高度。\n\
  \n此外还要意识到，数字巨头可以利用专有的智能设备将 `IoT` 和 `AI` 变成“特洛伊木马”，以巩固市场地位。如果你早期投资增强型区块链解决方案，你可能会建立一种替代的市场地位。\n\
  \n### 接下来是什么？\n\n由共识治理的增强型区块链环境，对于构建和使用它们的组织如何协调其各种功能具有深远影响。当运营活动和决策被编码进 `smart\
  \ contract`，或者在更高级的情况下编码进 `DAO` 时，组织将呈现什么样貌、做什么？业务文化和领导力将如何适应？你的组织是否准备好迎接一个产品、客户和员工由物体或代码行表示的世界？当你的员工由人类和算法的混合代表时，你将如何领导？我们将在下一章探讨这些问题。\n\
  \n在增强型区块链阶段期间及之后，机器和其他物体可能变得多么强大，这一点怎么强调都不为过。AI 系统将能够汇聚成千上万个终身的业务规则和其他信息，并在极短时间内完成处理。在\
  \ `blockchain` 上，自执行的 `dapps` 将自主处理信息、得出结论并进行交易。在那个世界里，人类领导意味着什么，领导者又将如何履行这一角色？当组织不再由可识别的中心驱动时，组织会变成什么样子？\n\
  \n对于日益的组织及其领导者来说，这些问题触及了他们想要实现的根本。`ConsenSys` 的首席执行官、Ethereum` 的创始人之一 Joseph Lubin\
  \ 告诉我们：“如果我们用即时通信层包裹世界，并且拥有像 `Ethereum` 和 `Bitcoin` 这样的共识技术，仅仅这种共识形成的概念就对我们如何建立组织产生了影响。我们正在构建的技术启发着我们尝试新方法。”\n\
  \n当我们考虑到共识不仅可以在 `blockchain` 上运行，而且可以在组织的底层结构中运行时，我们受到了计算机集群（computerized swarms）新兴研究的启发。`Swarming`\
  \ 指蜜蜂或鸟类等动物在参与迁徙等集体活动时的集体行为。集群的领导权在飞行过程中会传递给不同的成员。领头的鸟利用自然界等同于共识的算法来共享群体的领导权，以决定谁参与以及他们承担什么角色。\n\
  \n计算机集群是计算机科学家实验的主题。集群曾出现在 2018 年韩国平昌冬季奥运会的开幕式上，以及 Lady Gaga 在 2017 年超级碗的中场休息表演中。在这两个例子中，无人机被设定为以编排的方式移动并在指定时间发光。但科学此后超越了预编程，转向了自主协作。2018\
  \ 年 6 月，`Science Robotics` 发表了一项研究结果，科学家们开发了第一群能够以集体智能运行的无人机集群。换句话说，集群是去中心化的，每架无人机都自主决定何时以及如何移动。\n\
  \n从集群无人机到 `blockchain` 上的去中心化自治组织（`DAOs`）聚集在一起共同谈判并执行业务交易，这是一个非常短的跨越。`DAOs` 或这些组织的集合可以履行许多功能（例如财务、法律、合规、通信），就像蜜蜂群包含蜂王、工蜂和公蜂，每只蜂都从事不同的工作。或者，一个\
  \ `DAOs` 集群可以整合资源并执行单个成员无法独立完成的交易，类似于 `Swarm Fund` 整合零售投资者的资源来购买机构资产的方式。\n\n集群提供了一个实用的比喻，描述了领导力将如何从层级模型演变为寻求价值的人与机器之间激进、自动化且自主的协作。尽管\
  \ `blockchain` 对组织的确切影响仍然是一个巨大的未知数，但在几十年内，今天占据组织时间和资源的许多任务将不再存在，或将由机器处理。在这种情况下，组织需要以与现在不同的方式领导、激励和奖励人们。考虑到可能的变化以及对这种变化准确性质的不确定性，本章是对区块链组织的一次思想实验。我们尝试回答诸此类问题：在区块链环境中，什么样的组织结构将主导？什么样的领导方法将成功？在充满\
  \ `AI` 和 `IoT` 的去中心化环境中，什么样的人才可以胜任？在一个去中心化和自治组织及参与者的世界里，你如何激励和奖励利益相关者？\n\n## 区块链上的组织\n\
  \n对于大多数在传统企业环境中工作的人来说，理解运行一个或多个基于共识驱动设计的增强型区块链的去中心化区块链概念将是非常的。人们连接和参与去中心化组织的方式与今天截然不同。在人们组织的方式、接收关于做什么、何时做以及为何而做的指导，以及工作的激励和补偿方面存在巨大差异。在去中心化区块链组织中，组织的结构和将盛行的领导风格都可能受到影响。\n\
  \n在区块链对组织可能产生的变革中有一个有趣的“元”转折，也会出现专门为组织设计的区块链解决方案，以实现新的架构、分配领导角色以及允许人才同意项目或角色的方法。例如，位于伦敦的初创公司\
  \ `Colony` 将其解决方案定位为技术栈中的“人力资本层”。`Colony` 允许组织定义需要做什么，并将结构和人才需求拆分为可执行的区块。\n\n\n\n\
  \n在第一层，用户首先创建一个殖民地（即组织），然后定义工作领域（例如财务、法律、市场），这些领域与一系列任务相关，任务是殖民地中最小的工作单位。Colony\
  \ 在不同的语境下使用标准词汇来描述参与者在殖民地扮演的各种角色。经理定义需要完成的任务，工作者完成任务，而评估者则决定任务是否达到了要求的质量水平。\n\n\
  参与者通过获得声誉来晋升其角色（经理、工人或评估者），而声誉是通过执行任务建立的。执行的客观上高水平的任务越多，声誉就越高。声誉越高，参与者在殖民地中能够扮演的领导角色就越大，其在殖民地产生的价值中所获得的股份也越大。Colony\
  \ 功绩主义精神至关重要的一点是：如果参与者停止贡献，声誉就会下降。早期的投入不会让参与者获得项目生命周期价值的任何股份。同样，魅力、偏好、吸引力、毕业学校或人圈，在一个围绕“谁以要求的质量做了什么工作”而组织的环境中，也起不起作用。没有人可以存储自己的影响力。激励和奖励是基于持续、不断的贡献的。\n\
  \n2019 年，Colony 的解决方案尚未投入运行。我们强调这家初创公司并不是为了其组织本身，而是为了它所代表的理念：一种功绩主义的工作环境，其中领导力和利益是流动的。当我们从思想上将“蜂群式\
  \ DAO（swarming DAOs）”的概念与类 Colony 的基于区块链的工具相结合时，我们看到了组织结构以及领导者进入权威职位的方式发生了重大变化。让我们仔细观察这两者。\n\
  \n### 从层级制到全自治制（FROM HIERARCHY TO HOLACRACY）\n\n几个年来，层级制一直是业务领导的主流标准和最常见的组织方法](../Text/notes.html#ch8-en5)。\
  \ 长期以来，它一直让我们系统中的每个参与者都朝着共同目标努力。我们可以将其长寿部分归功于企业管理的应用学科以及 20 世纪许多思想者的影响。例如，弗雷德里克·泰勒（Frederick\
  \ Taylor）、赫伯特·R·汤恩斯（Herbert R. Townes）和亨利·L·甘特（Henry L. Gantt）都是科学管理的主要贡献者；弗兰克和莉莉安·吉尔布斯（Frank\
  \ and Lillian Gilbreth）将个人效率的目标应用于团队；而彼得·德鲁克（Peter Drucker）帮助奠定了现代管理理论的基。通过他们和其他人的贡献，集权和层级制组织总体上比更水平或扁平的组织拥有更高的生产力。学者们将这种生产力归于组织内部清晰的关系网络和产生的奖励系统。这些元素让参与者能够有效地相互互动并获益。⁶\n\
  \n然而，层级制也有其缺点。⁷。 挑战包括面对变化时缺乏敏捷性、官僚化的决策既缓慢又不了解工作执行的实际情况、决策者与最接触客户的人之间距离过远，以及领导者偏见。当他们涉及的活动需要各种专业知识和观点时，陡的层级结构往往表现不佳。当世界经济由生产实体产品的公司主导，连接依赖固定电话和铁路时，对这种多样性的需求是不寻常的。但在数字环境中，这种需求是常态，特别是受移动、数字、社交以及最近的区块链解决方案影响的环境。在所有这些情况下，传统的管理方法都不具备提供所需的多元化能力。\n\
  \n有些组织早就发现了层级制的局限性。在数字时代黎明之前，一些激进者就看到了更扁平、更去中心化结构的敏捷优势。在他们的书籍《不匹配的经济》（*The Misfit\
  \ Economy*）中，Alexa Clay 和 Kyra Maya Phillips 描述了 19 世纪英国海盗采用的平等主义组织结构。由于海盗的风险由所有人承担，海盗作为集体进行运作，每个人都有投票权，并且在掠夺物中获得等的份额。“船长”仅在战斗期间拥有差异权力。⁸\n\
  \n更现代的非层级制业务例子包括伊利诺伊工具公司（ITW），它长期以来作为联邦制组织运营而闻名，其中央核心设定标准和战略，但让各个运营单元保持地方领导力和决策权。如果这家传统设备制造商的某个单元变得太大，领导者就会将其分成几个较小的部分，以便每个单元都能对其市场保持创业性的方法。ITW\
  \ 以这种模式运行了数十年，如今已是一家价值 143 亿美元的公司。⁹\n\n强生（约翰逊同样以其联邦模式闻名。前首席执行官 William Weldon 在\
  \ 2003 年解释说，J&J 的去中心化结构是其在消费包装品、医疗设备和制药领域多元产品线的产物。关注点、目标客户和监管复杂性的差异要求每种产品都作为一个拥有独立领导地位的业务来运营。10\
  \  Weldon 表示，保持这么多独立单元一致的挑战是值得付出的，因为去中心化结构为 J&J 增强了韧性。如果某个职能部门出现问题，它不会波及其他部门。11\n\
  \n离层级制更远的是 Zappos，这是一家在线鞋类服装零售商，正在进行全自治制（holacracy）的激进实验，这是一种将决策权去中心化给自组织和自治理团队的组织方法。尽管观察者注意到自\
  \ Zappos 采用全自治组织结构以来，其劳动力出现了前所未有的流失，但组织内部的领导者认为这种流失是变化的自然副作用。并不是每个员工都想成为实验的一部分。12\n\
  \n正如 Zappos 所示，习惯于有清晰边界的人可能对去中心化组织的需求感到不适。Zappos 的领导者对采用去中心化组织的挑战持乐观态度，但对于任何尝试彻底重组的组织来说，改变文化的困难是真实的。在为这本书进行研究期间，我们与几位具有去中心化组织经验的领导者进行了交流。一位受访者是一家拥去中心化的国际制造集团的高管。这位高管同意匿名分享他的经历，并报告去中心化模式在各个业务单元层面运作良好，这些单元开发特定的产品和业务模式，并在市场中作为协作、自组织的代理进行运作。\n\
  \n\n\n\nConsenSys 首席执行官 Lubin 分享了他对领导一个进行激进实验的年轻组织的观点。“ConsenSys 试图避免自上而下的命令与控制。然而，这可能会导致失去在中心化组织中可以免费拥有的清晰度和问责制。”[¹³\
  \ 该公司需要新的流程来确保清晰度和问责制。Lubin 还说，作为去中心化组织运营并不意味着完全拒绝层级化方法。例如，项目可以通过显式协议开发出短期的层级结构，使得在一种情况下\
  \ `Person A` 对 `Person B` 负责，而在另一种情况下 `B` 则对 `A` 负责。\n\n这两位高管的经验表明，根据区块链的协作精神进行运营需要领导者保持警惕。否则，很容易滑入\
  \ Lubin 所说的那种能够“免费”带来清晰度或问责制的做法中。文化吸引特定类型的人。在保留所有人员（无论其倾向如何）的情况下改变组织结构会产生冲突。为了更深入研究这一观察，让我们看看领导风格以及它们如何在区块链的无领导者环境中演变。\n\
  \n### 从权威到参与\n\n在层级化的命令与控制环境中，领导者往往之所以上位，是因为他们展示了在没有下属意见的情况下做出强有独立决策的能力。换句话说，他们可能会变得专权。或者，他们可能因为其官僚化能力以及遵循正式或非正式规则手册的能力而晋升。最后，他们可能具有魅力，并由于个人的亲和力吸引员工并影响他们的行为[¹⁴。\n\
  \n然而，鉴于平等参与、开放获取和开放贡献的精神，专权型、官僚型或魅力型风格在增强的区块链环境中很难脱颖而出。再加上所有将借助 `AI` 帮助做出自主决策的技术因素，你就拥有了另一层自我引导和自我追求的实体，它们将产生巨大的影响。区块链通过去中心化、共识以及`tokens`\
  \ 形式的个人激励和奖励，赋予了这些独立运行部分力量。很难想象在这种环境中，权力会流向一个站在房间前部发布指令的领导者。\n\n更有可能的优势将属于擅长协作形式领导力的人，包括所谓的参与式领导力和仆式领导力，这些方法可以追溯到区块链出现很久以前，并在数字领域之外也具有影响力[¹⁵]。例如，汽车巨头\
  \ `Toyota` 因为强调对他人的辅导和培养而被视为仆式领导力的典范。这不仅仅是空谈。`Toyota` 组织其汇报结构（注意，是层级化的），使得没有任何领导者的直接下属人数超过八个人[¹⁶]。其目的是让领导者有时间指导他们的直接下属，同时接受其直属领导对其业务负责指导（自我发展是\
  \ `Toyota` 风格领导力的另一个核心原则）。\n\n这些协作领导运动并不一定依赖区块链，但这种领导力与区块链是互为补充的。而且，天生追求协作并鼓励群体驱动共识的领导者，在去中心化环境中比那些依赖职位权威的人更有优势。\n\
  \n### 在没有追随者的领导\n\n为了考虑与区块链相关的组织结构和领导行为，我们将重新回顾集群（swarms）。这些结构展示了几个与区块链领导力相关的特质。\n\
  \n首先，集群具有去中心化的协调能力。技术集群在传统意义上并不是群体。它没有领导者，参与者也不是被选出的。集群是全管理的（holacratic）：参与者自主选择加入集群并在其中进行自我管理。这种特质表明，成功的区块链领导者将擅长设定目标或问题，并鼓励合格的参与者加入项目。清晰的目标设定、预期结果的清晰定义以及清晰的激励允许参与者加入并采取对个人和整个网络都有益的行动。像\
  \ `Colony` 或 `Bounty0x`（一种任务发布的区块链解决方案）这样的区块链解决方案可以提供组织和参与者执行愿景的技术机制[¹⁷]。\n\n其次，集群在规模和活动强度上都是动态的。组建或参与过敏捷团队，或其组织在数字化转型中采取双模态方法的领导者会对这种团队开发非常熟悉[[^a]。区块链领导者将需要类似于敏捷领导者的技能。他们必须保持宽阔的眼光，看到不同部分之间的联系并识别任何需求。区块链领导者不会从自上而下进行沟通，而是连接可能互不知情的人、事或资源[¹⁸]。领导者将继续这样做，直到事物变得足够智能相互发现并互动。\n\
  \n第三，集群会对环境做出反应并适应。如果成员收到新信息，他们可以自主转向另一种行动方案。这种环境下的领导者同样需要快速适应新信息。如果证据表明背景已经变化，他们不能过度执于五年战略计划或任何其他预结果。图\
  \ 8-1 总结了与传统层级结构相比，去中心化且非层级的区块链驱动环境中所需的领导风格和行为。\n\n#### 图 8-1\n从层级到全管理的领导风格\n\n\
  ![image](img/Figure_8.01.png)\n\n### 沟通你的目标以及将如何实现\n\n领导者将如何在日益去中心化的环境中吸引和激励人们？像所有组织一样，去中心化组织也需要开发方法来吸引能够在其去中心化文化中发展的参与者，并阻止那些不能适应的人。为了做到，正如史蒂芬·柯维三十年前建议的那样，“要从终开始”[¹⁹]。用最简单的话说，在去中心化的增强区块链环境中进行领导需要一个愿景。\n\
  \n当你的组织能够自主寻求价值、自我组织、与其他自主组织建立伙伴关系并互动时，你的组织为何存在以及它如何执行设计目标必须被明确定义。传统组织拥有人类思维处理慢速和季度董事会议中固有的自然制衡，因此在规则上可以更加灵活。\n\
  \n\n\n\n\n只要想一下 DAO 在一个人类工作日内可以承担的业务量。从理论上讲，该组织将访问海量数据，从中得出结论，并在你早晨从床走到咖啡机之前，就执行了数万甚至数百万笔交易。该组织在短短几分钟内可以进行的交互数量或范围将没有限制。具有这些能力的组织之间的竞争条款可能取决于机会主义上的细微差别——或者说是伦理上的细微差别。竞争压力将是极其剧烈的，这会导致公司在创造价值方面愿意降到多低而产生一场潜在的“逐底竞争”。我们真的希望在这个世界上运行的\
  \ DAO 没有任何限制地这样做吗？我们希望这些组织能够进行勾通吗？在某些领域（例如执法和抵押贷款审批，仅举两国），设计用于取代人类判断的算法的短期经验表明，算法可能带有与人类相同的偏见。作为领导者，你需要办法来对算法决策进行约束，评估它们如何变化，并确定这些变化是否公平。\n\
  \n除了公平和伦理，区块链上去中心化业务的约束将存在与今天存在约束的原因相同——因为法律要求这些约束。尽管法律通常滞后于技术的采用，但法律最终会鼓励某些业务行为并限制其他行为。区块链可以加速监管反应，因为不可篡改的记录允许监管机构更容易、更快速地审计你的行动，而且任何监管救济也可以同样具有动态性，因为监管机构将获得相同的工具。\n\
  \n除了法律，还有价值观。尽管米尔顿·弗里德曼（Milton Friedman）有一项著名的断言，企业唯一的责任是为股东创造利润，但许多领导者——可能更显著的是客户——认为企业在运营时应该对使其繁荣的人和资源保持底线的尊重。\n\
  \n领导算法所面临的挑战与领导人类所面临的挑战同样重要。幸运的是，这些挑战是紧密相关的。这两者都会驱动领导者定义愿景、使命和价值观，因为拥有一个你为何存在以及你所做事情的理由，有助于聚集你所需的人才和资源。它为去中心化应用（或\
  \ `dapp`）中编码的规则和条款提供了一个框架。`^b 从这些规则中，你可以吸引参与者来帮助你实现组织目标。这种方法让人们有机会根据自己的能力参与进来。一旦人们加入，你就需要一种方法来评估他们工作的质量，为他们的贡献提供报酬，并为他们的留下或回归创造激励。区块链在这里也可以发挥作用，使其易于审计工作记录并用\
  \ `tokens` 奖励质量。\n\n鲁宾（Lubin）谈到了 ConsenSys 在这方面正在实验的一些区块链机制。例如，ConsenSys 的某项“赏金”计划列出了需要资源的倡议。“我们正在让优秀的人才加入我们的项目，”他告诉我们，“我们可以指定工作内容。在\
  \ `Gitcoin` 上，如果项目或公司喜欢他们，我们就可以雇佣这些人。”关于明确需求的重要性，鲁宾建议，这些需求应该是组织与贡献者之间一份基于区块链的具有法律约束力的协议的一部分：“指定愿景、使命、运营目标、董事会、顾问委员会、完成工作的方法。如果软件开发团队遇到问题，识别出相关故事或问题。我们需要这些机制，外加上反馈机制。团队将有方法指定他们的预期结果，并为每个预期结果指定一个单一的责任人，以及争议解决、仲裁——所有这些都是协议的一部分。”\n\
  \n鲁宾以及我们交流过的其他人传达的信息表明，去中心化组织对清晰度的要求非常高。只有当你能清晰地阐述所需的资源时，你才能吸引它们。当然，一旦你拥有了这些资源，你就需要方法来认可并支付。区块链在奖励方面也会发挥作用。\n\
  \n### 通过区块链赋能工人\n\n人才招聘和管理的挑战是一个永恒的问题。高盛（Gartner）2019 年的 CEO 调查报告显示，32% 的受访者认为在未来三年内，人才基础将发生重大或彻底的变化。`²⁰\
  \ 经理理事（Conference Board）2018 年对 CEO 的一项调查将未能吸引到合适的人才列为受访者关注列表的首位，高于创建新业务模型以竞争颠覆性技术的需求²¹\
  \ 普华永道（PwC）的第二十一次年度 CEO 调查同样显示，全球 80% 的 CEO 认为他们的组织不具备竞争所需的数字技能。`²² 区块链为领导者人才寻找彼此、共同工作、创造价值和获得报酬的方式带来了新的选择。\n\
  \n数字环境中的人才吸引不能忽略临时、合同和零工模式（gig models）日益增长的影响。在模拟世界中，存在一个强大且不断增长的全球劳务派遣行业，他们短期内提供人才。`²³\
  \ 用于交通的 `Lyft` 和 `Uber` 以及用于非交通、劳动类活动的 `TaskRabbit`、`Upwork` 和中国的 `Ziwork` 等零工平台同样提供了获取工人的机制。摩根大通研究院（JPMorgan\
  \ Chase & Co Institute）的研究显示，自 2013 年以来，美国工人在这些平台上的参与度增长了 300%。²⁴](../Text/notes.html#ch8-en24)\
  \ 在西欧，各国预计有 9%到 22%的工人曾通过数字平台做过一些工作。`²⁵ 看到这种潜力，大型组织正在应用零工模式来补充自己的员工。会计师普华永道考虑到波动的用人需求，启动了\
  \ `PwC Talent Exchange`；华盛顿邮报则开发了其专有的 `Talent Network` 用来寻找自由职业记者。`²⁶ 总而言之，仅美国就有超过\
  \ 1600 万工人从事合同、自由职业或临时工作。`²⁷ 这种数字化招聘自由职业和临时工人的趋势背后的动力是不可否的。现有匹配工人与可用工作、确认工作以及补偿工人的机制问题也是如此。鉴于这些挑战，区块链初创公司并不意外地正在产生新的解决方案来调解零工和临时工作。\n\
  \n`Heymate` 于 2018 年在瑞士推出，其解决方案促进了工人与雇主之间的交易，且没有 `Upwork` 等零工平台上常见的价格竞价模式。`²⁸ `Workchain`\
  \ 提供了一种区块链工资解决方案，旨在为完成的工作提供即时支付，这是零工经济中的一个大问题，因为在某些平台上，完成工作到工人拿到钱之间存在很长的延迟。`Workchain`\
  \ 通过一种解决方案促进快速支付，该方案允许注册工人完成工作、在链上验证工作，并将资金立即发送到 `Workchain` 钱包中，他们可以将其兑现到 `Visa`\
  \ 预付借记卡。`Workchain` 还提供一种工资贷款，允许信用良好的工人预支未来的收入。\n\n\n\n\n另一个针对零工经济人才招聘与管理的区块链解决方案是位于澳大利亚悉尼的\
  \ `ChronoBank`。ChronoBank 的解决方案 `LaborX` 是一个区块链劳动力平台，允许雇主和劳动者建立联系并创建工作安排。雇主用 `LH`（劳工小时代币）购买员工的时间，该代币挂钩参与雇主所在国的时薪最低工资。\n\
  \n日益全球化的经济趋势同样需要解决方案，让雇主更容易支付位于另一个国家的劳动者的工资。初创公司 `Bitwage` 正在通过一种跨境工资单区块链解决这个问题。支付以\
  \ `bitcoin` 进行，并由 `Bitwage` 管理将其转换为劳动者所在的本地货币。至于为合同工或自由职业工作寻找人才，`Bitwage` 拥有一个招聘部门，可以将劳动者与广告中的职位进行匹配。\n\
  \n`ChronoBank` 和 `Workchain` 分别只解决组织领导者与其员工之间复杂关系中的某一方面。可以将它们看作是在雄心层面上受到区块链启发的，因为它们关注的是如何将现有流程转化为去中心化的数字环境。其他组织，例如本章之前描述的初创公司\
  \ `Colony`，则更进一步地重新构了人才招聘和工作，以解决通过透明度和奖励所实现的持续参与问题。\n\n### 透明度与奖励\n\n区块链组织所能做的事情最有趣的方面之一，是让领导者和劳动者拥有同样的权力来选择是否共同工作，并能获得关于各自工作表现的相同信息。这是一项激进的改变。雇主喜欢说拥有高需求技能的劳动者拥有权力，因为组织需要他们来满足客户需求。高需求劳动者可能拥有某些权力，但这种权力会被公司对员工薪酬、福利以及工作地点的政策限制所削弱。评估方法同样通常从上到下决定了一个人的产出如何被判断和奖励。普通员工几乎没有谈判的余地；即使是非常资深的员工，也会遇到硬性的限额限制。\n\
  \n区块链业务中可能的激进透明度可以改变这种层级制度。算法化的区块链组织只有在公开其业务内容、需要完成的工作以及完成这些工作所需的技能时，才能运行。劳动者产出的质量将接受审查，领导者的工作亦是如此。奖励也将是透明的，并通代币实现。\n\
  \n区块链对于实现特定输出所需的各种要求、完成工作与支付之间的关系，或者劳动者或领导者被分配到某一职位的基础是不可能模糊的。透明性、不可篡改性和审计性确保了这种清晰性。将流程（如员工目标和任务）转化为算法所需的定义纪律，将迫使组织和领导者变得具体化。领导者有时甚至在定义人才需求时需要倾向于绝对主义，以控制和限制链上活动。\n\
  \n具体性并不意味着排除偏见。组织可能会在无意中将偏见嵌入区块链中，从而嵌入到他们的人才管理计划中。领导者在定义需求和批准参与区块链网络时需要非常小心。区块链组织——像所有组织一样——需要强大的伦理标准。\n\
  \n我们正在看到区块链在人才招聘和管理方面的早期应用。例如，人力资源职能正在探索区块链解决方案来验证申请人的资质。区块链初创公司 `APPII` 为此目的提供了一个平台。某些工具还允许员工开发技能并续签证书，就像我们在教育领域强调的解决方案，这些解决方案用于捕和存储学生证明，并将学生与教师匹配以进行技能培养。这些示例与层级组织结构兼容，并且是从组织的角度设计的。虽然这种视角在当今的层级环境中是适用的，但我们建议\
  \ `Colony` 的双向平衡愿景（领导者评估员工，员工也评估领导者）为未来提供了一个更有趣、更有价值的模型。正如之前的图 8-1 所示，从传统的自上而下的结构转向更灵活的水平化结构，意味着向“自治制”（holacracy）的转变——这是\
  \ `Zappos` 采用的组织模型。\n\n自治组织中的人员会采取主动性，定义并寻求自己的目标，并在获得技能或看到新机会时调整这些目标。在实践中，劳动者（人类或实体）将选择是否竞标任务或参与项目；而不是像今天大多数环境那样被指派。重要的是，这种加入式模型可以容易地用于内部人才池，也可以用于去中心化的劳动力。该模型的运行方式是让所有参与者通过代币化的数据记录他们的技能、知识、证明、可靠性、理想时间和过去的成就。Lubin\
  \ 表示 `ConsenSys` 正在实验一种代币奖励系统，奖励人们填写入职信息，或者将技能画像放入钱包。这种方法同样适用于作为领导者的你。\n\n这种激进的透明度可以通过获取信息为工作环境带来客观性——我们敢说是公平吗？。另一种由技术实现的选择是\
  \ `futarchy`（预测治理），这是一种治理模型，其中业务社区定义特定项目的成功衡量标准，然后使用预测技术识别哪些行动最可能产生预期结果。由经济学家罗宾·汉森构想的政府治理模型已被区块链社区接纳，多个预测市场包括\
  \ `Augur`、`Stox`、`Gnosis`、`AlphaCast` 和 `Hivemind` 已经出现。\n\n这些市场可以为特定项目的要求和潜在贡献提供更高的可见性。领导者和员工将根据具体的产出接受评估、补偿和奖励（通过代币）。好感度、人脉以及公开推销能力对薪资水平和奖金率的影响将小于表现。基于种族、年龄、性取向或物理特征的歧视在匿名环境中将少得多（再次假设在匿名语境中发现的算法偏见会随着人类编写更智能的代码而消除）。几年前犯的一个大错误在持续高质量工作的背景下，评估权重将很小。奖励将不再通过领导者的“权威证明”（proof\
  \ of authority）获得，而是通过协作者的“能力证明”（proof of capability）获得。\n\n\n\n\n我们将本章定位为一场思想实验，探讨区块链的广泛使用如何改变领导力和组织结构。尽管区块链前景广阔，但它在组织方面也面临着一些重大挑战。虽然今天的环境很少能看出这些挑战可能是什么的迹象，但它们包含了领导责任、监督和默认行为。让我们逐一进行分析。\n\
  \n## 区块链中的领导责任\n\n区块链中的责任问题经常在我们的客户中被提及，大多数是在不确定性的背景下。例如，领导者们在纠结，如果两个匿名参与者之间的活动被视为非法，应该由谁来负责？如果一个发生昂贵违规的解决方案有多个所有者，那么由谁来承担风险？\n\
  \n当组织在中心化环境中违反监管准则时，监管机构会要求领导者承担责任。在极端情况下，这些领导者可能会入狱。这对于保持在法律允许范围内来说是一个非常好的动力。然而，正如我们在本章中强调的，在网络上自主运行的去中心化组织，并没有像在物理世界中运行的层级组织那样的领导者。\n\
  \n在这种情况下，`DAO` 还能受到监管吗？`DAOs` 是否应该像监管传统的以人为本的组织一样受到监管？如果发生了监管违规——即使是由数百万行代码中的某一行错误造成的——应该由谁来承担主要责任？我们不知道这些问题的答案，而且监管机构在关于加密货币的一些对话之外，尚未就区块链治理的监管细微差别公开发表过意见。\n\
  \n## 决策监督\n\n另一个具有复杂影响的问题是决策监督。在物理环境中，大多数决策由人类做出，存在天然的制衡机制。领导者会听取来自上级、同事、下属和客户的意见。运行在区块链上的算法接收不到这种持续的输入。意外的后果最终会显现，但可能是在数百万次交互和交易之后。\n\
  \n区块链纯主义者认为，共识机制如果足够大，就会剔除错误的决策。我们认为，认为这种机制是绝对安全的是不明智的。由于围绕 `AI` 使用的伦理结构和治理匮乏，我们的担忧进一步增加。组织可以在政策上将领导监督编码到\
  \ `DAOs` 的运行中。但随着 `DAOs` 增长到数百万行代码、应用于多个司法管辖区并不断更新，保持政策的一致性和权威可能会具有挑战性。总而言之，监督和治理缺乏简单的解决方案。\n\
  \n## 默认行为\n\n影响领导力的最后一个问题是默认行为。人们倾向于遵循一套固化习惯的倾向在行为心理学中已有详尽记录[`../Text/notes.html#ch8-en35`]。组织也容易受到默认的影响，正如克莱顿·克里斯坦森在《创新者困境》中所强调的那样。[`../Text/notes.html#ch8-en36`]。默认行为已经体现在目前的领导重点上，即将区块链视为强化现有业务模式的技术，而不是实现去中心化和新业务模式的工具。\n\
  \n诚然，现在还处于早期阶段。今天的领导者还没有被迫改变，但当计算机能够在`thumb drive`大小的机器上存储并分析整个行业的历史时，他们将不得不这样做。当寻求价值的对象能够识别出全新的价值形式时，它们会迫使组织适应吗？只要人类编写算法并教导它们，`code`\
  \ 就会反映人类的思维。原则上，如果思维倾向于公平、包容和道德红线，它的存在可能不是坏事。如果思维倾向于排除和维持旧模式，那么代码可能会出现问题。由谁来决定？\n\
  \n## 你的真实业务视角\n\n### 你学到了什么？\n\n参与、协作和激励对商业组织而言同样重要，它们对政府组织以及公民社区（包括本地和“全球本土”社区）同样重要。区块链的广泛采用可能对组织的运作方式和领导者的领导方式产生深远影响。“群体”为人类和机器如何结合提供了一个实用的比喻。`ConsenSys`\
  \ 和 `Colony` 展示了人们将如何参与活动、积累声誉并获得奖励。全景治理（Holacracies）、`futarchies`和`预测市场`实现了更有效的参与、协作和决策，以及领导者透明的问责。他们实现这一目标的方法是使用数据预测哪些选择或行为可能导致结果。\n\
  \n### 你应该对此怎么做？\n\n你需要明确业务目的和目标。在去中心化环境中，人才和资源将自主决定与你合作。为了保持这些资源的积极性，请采取措施评估你的领导风格和组织结构，并将它们与更层级化的工作和参与方式对齐。\n\
  \n此外，就领导、协作和管理像 `DAOs` 这样的算法实体需要什么寻求建议。参考法律框架以及伦理、道德和基于价值的结构来寻求指导。\n\n最后，意识到由于自主代理的引入，你的组织文化将会改变。检查你目前的奖励和激励机制，看看它们在多大程度上鼓励你组织中的人才协作。确保你建立了多向反馈机制以改进结果、问责和争议解决。考虑你的奖励机制如何影响员工在与代理协作方面的行为。\n\
  \n### 接下来是什么？\n\n我们开始编写这本书的目标是帮助业务领导者理解区块链现在和未来如何被重新定义你的客户和合作伙伴，以及你如何与他们互动。然而，尽管关注业务，我们对区块链的研究始终触及它如何从根本上改变更社会的互动规则。在下一章中，我们将扩大视野，从社会层面审区块链，并探索去中心化基础设施和代币化如何为易于访问、参与和创造价值的区块链社会开启大门。\n\
  \n\n\n\n构建一种对技术和业务友好的新型社会契约的模型已经在区块链世界中开始出现。其中知名度最高的模型发生在爱沙尼亚。^¹ 该国建立了一个名为 `X-Road`\
  \ 的数字平台，并将爱沙尼亚的政府机构连接到上面。`X-Road` 既全面又具有封闭性：它支撑了从医疗保健到金融的各种私人和公共服务，但未经信息所有人的许可，任何单一服务无法访问另一个服务的信息。对特定记录的查看也会被追踪和记录，并且查看者对信息的权限会经过验证。\n\
  \n在短短几年内，`X-Road` 在爱沙尼亚社会眼中已变得如此关键和可靠，以至于企业在其之上构建平台。芬兰政府同样租用了 `X-Road` 作为其数字基础设施，这引发了关于公民服务可移植性、边界性质以及政府主权的新问题。爱沙尼亚正在通过“电子居民”模型推动这些问题，该模型允许非爱沙尼亚人申请爱沙尼亚居民身份，并在那里建立企业和缴纳税款。作为一个自然资源有限且具有地缘政治脆弱历史的小国，爱沙尼亚正通过吸引欧盟创业者来寻求长期的经济独立。\n\
  \n爱沙尼亚仅有 130 万公民，`X-Road` 需要容纳的仅是伦敦或纽约（人口超过 800 万）此类平台需求的一部分，更不用墨西哥城或北京（人口超过 2000\
  \ 万）。尽管如此，该国在允许点对点共享网络的重要性这一观点上并不孤单。区块链显然可以在此基础上进行构建，并利用其更广泛的能力来重塑社会服务和参与。立陶宛——凭借其高科技部门、廉价的互联网接入以及复杂的金融科技和监管科技（解决监管问题的技术）计划——已经拥抱加密货币，并在\
  \ 2018 年的 ICO 投资中位居世界第三，仅次于中美。^² 马尔他政府已通过创建一个监管机构来监督智能合约和 `DAOs`，从而为区块链的发展提供合法性支持。^³\
  \ 在瑞士，祖格政府发布了基于 `Ethereum` 的数字标识符。日本已经实施了监管指南以允许加密货币交易。阿联酋正寻求实施区块链基础设施作为其“智慧迪拜”倡议的一部分。^⁴\
  \ 这些及其他示例表明了区块链作为赋能社会工具日益普及的一些方式。^⁵\n\n本章探讨了区块链对社会和社会结构可能产生的影响，反之，随着区块链的成熟，社会可能会如何反应或适应。在整个章节中，我们采取了基于组件的视角和整体视角。我们研究了区块链技术的孤立应用如何重塑实践或结构，以及这些组件如何跨越成百甚至数千个支持区块链的账本，从根本上改变社会的织理。我们从一个定义开始：什么是区块链社会？\n\
  \n## 选择区块链社会\n\n几年前，我们与 Gartner 的同事们开始了一项研究工作，描述与互联网、移动技术、云计算、大数据、社交媒体、物联网、人工智能和区块链相关的技术进步在未来的终极汇点。我们想要详细说明这些技术趋势如何分别和集体地驱动人类、事物、企业和社会互动方式的改变。在当时，我们将这种终点称为`可编程社会`，因为我们相信互动将取决于数字技术，但将影响人们如何聚集形成社区并参与持续的社会互动。\n\
  \n我们设想的可编程社会处于技术、业务和社会演进的终，这种演进始于万维网的出现。十年后，这种演进演变为数字业务的早期阶段，采用了 Gartner 所谓的`力量枢纽`来描述移动计算、社交媒体、云计算和大数据的合力。^⁶\
  \ 从数字业务——我们目前所处的阶段开始，我们的经济和社区将首先通过适应性业务阶段，在此期间，第一批启用`AI`的智能代理将根据其算法定义寻求价值并进行交易，然后演变为自主业务，届时这些智能代理将独立地适应和进化（参见图\
  \ 9-1）。\n\n### 图 9-1\n\n* *\n\n通往可编程社会的路径\n\n![image](img/Figure_9.01.png)\n\n缩写：`AI`\
  \ = 人工智能；`APIs` = 应用程序接口；`BI` = 商业智能；`CRM` = 客户关系管理；`DAO` = 去中心化自治组织；`EDI` = 电子数据交换；`ERP`\
  \ = 企业资源计划；`IoT` = 物联网；`SSI` = 自主身份。\n\n* * *\n\n许多技术元素将推动迈向可编程社会。例如，网络事物将继续扩散，量子和边缘计算等先进计算能力将变得更加可行。先进的`AI`\
  \ 将用于业务应用。事物之间的微交互和交易量将急剧上升。强大的中心参与者正在投资所有技术，以确保他们访问或拥有网络和数据。这些参与者包括政府、金融机构和强大的公司（包括数字平台提供商）。\n\
  \n同时，对社会变化的渴望是强烈的，并将将持续下去。在 2008 年金融危机之后，各种意识形态的公民开始质疑传统中央中介的信誉。全球化和技术自动化显然带来了巨大的增长，但伴随着显而未见的副作用，特别是收入不平等的加剧。法币长期以来被视为信任的象征，因为法币意味着受信任的权威（中央银行）对信誉良好的机构是否符合体系利益做出了定性判断，并反过来对借款人偿还贷款资金的能力做出了合理的判断。当这些机构需要使用纳税人的资金进行救助时，而其百万翁领导人却没有承担后果，这是对社会契约的破坏。\n\
  \n客户和企业向中介授予明确授权，包括银行、保险公司和制定监管这些法律的政府领导人。这种授权是有条件的；为了保留它，机构必须证明有它们比没有它们的世界更好（承认不同的参与者以不同的方式定义利益）。社会成员还向我们所有人管理生活的搜索引擎、手机、智能家居设备、社交媒体平台和\
  \ GPS 授予隐性授权。然而，随着数字化和社交媒体让显性授权和隐性授权之间的重叠甚至相互取代变得透明，现在显而易见，曾经受信任的机构正在推进许多公民既不批准也无法受益的目标。分歧变得更加明显，各层面的信任正在被侵蚀。\n\
  \n\n\n\n\n技术能力的进步加之社会中明显的紧张局势，表明我们的社会制度和基础设施是脆弱的，甚至可能已经破裂。世界上每一个国家现在都以不同程度经历着同样的政治、社会和经济压力。这最常见的表现是公民无法满足食物、住房、收入、医疗保健、教育和金融服务等基本需求。作为媒体的消费者，我们无法信任报纸或电视新闻的真实性。我们的政府基础设施需要维修、升级和扩张。气候引发的事件威胁着生命和生计，并导致人口流离。社会不同群体之间以及内部的信任正受到威胁，民主社会正变得更加极化。\n\
  \n## 技术进步与社会问题\n\n技术进步可能会从许多方面加剧这些社会问题。技术可能会破坏企业历史以来获取利润的价值来源。进步还可能导致职业过时以及对未来收入机会产生的不确定性。此外，`AI`\
  \ 在社会领域的控制和应用可能会加强关于谁有权获得社会资源的偏见。当然，相反情况也可能发生。技术进步也可以缓解这些问题。\n\n## 可编程社会\n\n简而言之，可编程社会具有多种可能性。我们作为领导者和公民如何管理技术颠覆并协商社会弱点，将决定我们未来社会的面貌。在`第\
  \ 6 章`关于去中心化金融的讨论以及其他地方中，我们强调了去中心化系统在实现公平获取资源和机会以及确保问责方面的影响。当我们上升到社会层面时，个体企业和机构所做的选择将为未来的可编程社会产生两种可能性。`图\
  \ 9-2`描绘了这些分歧的路径。\n\n### 图 9-2\n\n***\n\n编程社会与区块链社会\n\n![image](img/Figure_9.02.png)\n\
  \n***\n\n## 编程社会：奥威尔式的风险\n\n一个运行在可编程但中心化系统上的社会，其潜力坦率来说可能是变成“奥威尔式”的。在这种在这种`编程社会`中，极少数组织可能拥有关于个人行为、移动、财务、消费模式，甚至健康和\
  \ DNA 的海量信息。在这种情况下，`选择`将转化为“数据经纪人最利于推广的任何选项”。隐含的社会契约将是：个人和组织都放弃对数据、数字资源访问权、相关合同和技术的控制，以换取消费主义和数字平台上的可见性。新闻机构可能会以选择性和误导性的方式呈现信息。工作和参与社会的回报将分配不均。人权可能被广泛削减，例如通过限制获得医疗服务的资格、进入某些大学的机会以及在某些社区购买房屋的权利。组织可以将招聘限制在具有理想\
  \ DNA 特征的人员，或者根据由少数人垄断设计并从中受益的社会信用系统。\n\n一些读者会嗤之以鼻，认为社会绝不会让这样一个奥威尔式的世界出现。但其他人已经生活在那个世界里了。数十人在日常互动中经历着系统性偏见。虽然几乎每个社会都有好面，但人类在让所有成员平等获得社会权利和公共资源方面仍然普遍失败。这种失败存在于所有层面，无论是组织层面还是政府层面。某些形式的剥夺是故意的（例如，由于性别、种族、年龄或组织资历被剥夺选举权），而某些是偶然的（例如，由于缺少身份证导致某人无法获得医疗服务或投票）。在编程社会中，这种偏见可能会恶化，因为定义特权和奖励的能力可能会恶化。\n\
  \n## 区块链社会：赋权的未来\n\n相比之下，一个运行在可编程但去中心化系统上的社会，潜力可能是公平且赋权的。社会参与者控制自己的数据，并被赋予权力为自己的观点和社区发声。只有当我们书中所讨论的技术以商业规模部署时，去中心化的社会模型才会出现。去中心化治理模型如`holacrac`和`futarchies`\
  \ 同样会促进一种更具赋权的模式。社会契约将使个人和组织释放数据，并在其核心价值的基础上进行构建。\n\n我们将这种去中心化模型称为`区块链社会`。它实现了自我表述、访问、价值交换和社会利益分配的公平。这种社会的实现并非依靠运行在网络数字环境中的单一账本，而是依靠一组去中心化的区块链网络，这些网络相互叠并交织，形成一个能够跨网络交易的网格。`第\
  \ 4 章`提到了这种互操作性，展示了奖励积分如何转化为代币，首先用于一个供应商，然后用于生态系统的多个提供商。另一个互操作的例子是游戏代币可以在新聚合平台上的多个游戏之间使用。在\
  \ Gartner，我们将这种互操作的区块链网络网格称为`全球账本 (WWL)`。^a `WWL` 使 `dapps`和分布式账本能够独立驱动 `DAOs`，或作为任何中心化组织的嵌入单元。因此，`WWL`\
  \ 引入了一个全球信任架构，允许去中心化和中心化的组织单元及操作共存。\n\n\n\n\n\n什么样的社会会随着时间的推移脱颖而出？我们看好程序化社会或区块链社会。我们获得哪种社会取决于你作为公民和领导者的选择。在一个数字化高度发达环境中，社会的形成将像过去一样，基于部落、地理、文化、语言、经济或意识形态的联系。但在区块链社会中，参与者将选择自己的归属关系。同样，社会将随着时间的推移而凝聚或分裂，这取决于参与者定义和修订的执行社会契约的权利、法律和制度。通过对身份、投票和其他社会参与形式的普遍访问，区块链可以为社会中的所有参与者提供更广泛的准入和参与机会。让我们来看一些例子。\n\
  \n## 区块链社会中的身份\n\n世界人口中很大一部分——超过 10 亿人——没有办法证明自己的身份。⁷ 女性和年轻人受影响尤为严重，流离本土也是如此，包括居住在约旦的超过\
  \ 67 万名叙利亚难民。⁸ 缺乏身份证明使得很难获得联合国世界粮食计划（WFP）提供的食物援助等资源。⁹ 作为回应，WFP 试验了一种基于区块链的虹膜识别解决方案，该方案允许约旦阿兹拉奇难民营的难民进入当地合作伙伴超市，选择他们的食品，并提交虹膜扫描以在\
  \ WFP 区块链平台上进行自我识别。然后，通过将买家的身份与 WFP 分配给其个人的食品券相关联，对交易进行验证和认证。该解决方案最初是几百名难民的试点，现在正在考虑推广到所有在约旦并接受\
  \ WFP 支持的 50 万名叙利亚难民。观察者指出，随着时间的推移，区块链身份解决方案可以扩展到其他用途——例如，验证工作计划的资质。\n\n### 从约旦阿兹拉奇到德克萨斯州奥斯汀\n\
  \n联合国在区块链方面的工作启发了全球其他组织，让他们考虑使用区块链来解决类似的准入和识别挑战。像难民一样，无家可者通常缺少身份证明。当你没有地方住时，很难留住财产，如果没有实体身份证明，你就无法使用社会服务。\n\
  \n“最清楚的例子是使用流动诊所，”德克萨斯州奥斯汀市首席创新官凯里·奥康纳说。¹⁰“人们可以去那里注册该市[医疗保健]计划，然后去找一个初级保健医生。但在三个月后继续看诊该医生，你必须有身份证明；居住证明（因为这是一个针对市居民的计划）；以及收入证明（因为这些诊所预留给收入低于特定水平的低收入人群。”\n\
  \n德克萨斯大学奥斯汀分校德尔医学院的数据整合负责人 Anjum Khurshid 曾听过约旦的 WFP 实验，并告诉了奥康纳。当奥康纳调查时，她看到这对奥斯汀的无家可者和他们的他们的一线工作人员有许多益处：“案例工作人员花费大量时间寻找文件或细节，以便让接收者获得那些他们并未获得报酬提供的服务，”她说。\n\
  \n奥康纳的团队开始了一项区块链工作，并在奥斯汀的一万无家可者中确定了他们想要触达的主要群体。¹¹“如果你从定量角度来看，”奥康纳解释道，“每个进入无家可归状态[并接触社会服务]的人都会对他们的各种脆弱性进行评估。他们有成瘾吗？他们是否遭受虐待？他们是否患有疾病？等等。据此，他们会得到分数。高分者获得最多的资源，但如果最脆弱的人必须等待[住房或服务]，他们的状况通常会恶化。因此，我的团队开始思考如何能更快地接触那八千名低分人群，在他们的处境尚不那么危险时，也许可以给他们他们离开无家可归状态所需的东西。”\n\
  \n考虑到这一人群，奥康纳和她的团队于 2017 年 10 月申请了彭博格慈善基金市长挑战赛，并获得了第一阶段资金进行测试和创建原型——这是申请全部彭博格资助的必要步骤。团队成员设计了一个解决方案，涵盖所有可用的社会服务以及每个服务组织所需的文档。他们决定专注于与文档相关的元数据：不再需要出生证明副本或社会安全卡的副本，而是由区块链确认与该个人关联的有效出生证明或社会安全卡。然后，该解决方案有一种机制，让该人员可以在服务点登录并验证自己的身份。\n\
  \n奥康纳于 2018 年 8 月提交了市长挑战赛的最终提案。在我们交谈不久前，她听说提案未被接受。尽管如此，她并没有放弃为她的城市开发“最小可行性产品”寻找资金。\n\
  \n“当涉及到技术时，”她说，“我们没有花足够的时间讨论它如何帮助我们社会中最脆弱的成员。”她反思了开发和测试区块链身份解决方案花费的时间：“我们有这个想法是因为我们花了时间思考医务人员、案例工作人员、警察、图书馆工作人员的感受，并花了时间从底层观察与无家可归者生活的真实。这是一个系统性问题。在我参加的每一个有不同部门工作人员的会议上，他们都会：‘天哪，如果我们能共享信息就好了！’如果你考虑他们的痛点，同时也考虑赋权的问题，采取以人为本的视角是至关重要的，即使对于那些你认为没有资源或能力利用它的人也是如此。”\n\
  \n### 身份即权力\n\n利用你的身份信息为了自己的利益是一种权力形式。我们已经在营销和数据平台上探索了这一理念的多种应用。将这一理念扩展到区块链社会，我们看到身份驱动的解决方案有望应用于医疗保健、制药和医学研究行业——这些领域在社会和私人市场之间存在交叉。\n\
  \n健康领域一个备受关注的识别方面是个人基因组。23andMe 等公司允许消费者支付数百美元对其部分基因组进行测序。个人使用这些工具了解自己的种族遗传，或确定他们是否携带了与疾病相关的某些基因突变。作为回报，公司存储序列并将数据访问权卖给研究人员或制药公司等第三方。基因组数据所指的人在数据被共享时并不被告知；他们也没有因数据的使用而获得补偿。这种对遗传信息的控制缺失在医学和药物研究行业中很常见。¹²我们并不是说人们不应该分享数据，而是这种分享应该是每次的一种选择。\n\
  \n\n\n\n区块链让选择成为可能。位于英国的区块链初创公司 `Genomes` 正在构建一个区块链平台，个人可以选择在基因组解码的一刻起将其序列添加到其中。当公司或研究机构对基因组的某部分有疑问时，所有者可以选择性地解锁访问权限以换取价值。这个基因数据库可以通过为私人和公共研究机构提供全新的、更大的数据池来受益（得益于参与激励机制和改进的隐私保障）。公民也能从这种（理论上）安全的遗传信息存储方式中获益。\n\
  \n初创公司在拥抱区块链保护医疗数据方面并非孤单。我们在之前的章节中重点介绍的台北医学大学医院`解决方案的开发者们对区块链解决方案抱有希望。一旦他们在系统中拥有了所有患者数据，区块链网络将创建一种更灵活的方式来识别研究候选人，然后利用该平台捕获并跟踪研究数据。\n\
  \n如果区块链可以记录有关细胞和 DNA 的数据，它能对突触和脑波做到同样吗？哲学家梅兰·斯万（Melanie Swan）开发了“区块链思维”的概念，将思想和其他认知体验（或许最终是意识）作为“心智文件”收集并上传到区块链上。斯万对该解决方案的几种应用进行了推测。例如，心智文件区块链可能会在因年龄、受伤或疾病导致记忆缺失的情况下增强记忆，或者可能用于创建一个数字孪生，以测试未来的场景。\n\
  \n## 社会与代表\n\n身份与投票权直接相关。因此，旨在验证身份的相同区块链活动也可以帮助增加选举中的投票参与度。全球民主国家都在努力寻求非歧视的方法，确保只有拥有投票权的人行使该权利，并限制每个公民只有一票。然而，投票系统的缺陷导致了获取机会的不平等，并在确保计票数可靠方面产生了错误和延迟。\n\
  \n这些挑战激发了对区块链投票系统的实验。例如，美国西吉尼亚亚州在 2018 年开发了一个系统，以解决海外军事人员投票参与率低的问题。部署的公民有权通过缺席投票，但某些军事人员从未收到选票，收到选票的人也只有一小部分寄回。作为回应，西吉尼亚州政府与一家名为\
  \ `Voatz` 的区块链初创公司合作，开发了供居住海外的西吉尼亚州人使用的移动投票应用程序。总共有来自三十个县的 144 名海外人员下载了该应用，完成了注册流程，并在\
  \ 2018 年 11 月的选举中投了票。这些数字设计上很小，而且 `Voatz` 的方法是受区块链启发的。但作为概念验证，西吉尼亚州的实验指向了一个更多合规选民可以行使权利的未来。\n\
  \n其他国家和城市也在进行类似的投票相关应用实验。奥地利维也纳正在考虑将区块链作为保障各种政府数据（包括选民名单）的方法。日本筑波（`Tsukuba`）市官员测试了一种区块链系统，允许公民对当地开发项目投票。瑞士格（`Zug`）市正在进行一项多级实验，签发电子身份证，然后允许公民在地方政府选举投票前，在投票应用程序中使用它们进行身份识别。试点中提出的问题包括公民是否认为应该提供电子系统来支付图书馆罚款或停车罚单（实验投票的结果没有法律约束力）。\n\
  \n投票参与度的增加，结合加密、不可篡改且可审计的结果记录，为预测算法在投票系统上运行铺平了道路。社会中的预测工具可以实现“未来治理”（futarchical\
  \ government），这是由经济学家罗宾·汉森（Robin Hanson）提出的一种治理模式。在未来治理模式中，社会定义了广泛的福利标准，并使用预测工具评估哪些政策或方法最可能产生预期结果。投票方面存在显而易见的疑虑。例如，如果早期投票开始倾向于某种方法，它们是否会影响人们随大流投票，即使结果与投票者的个人信念冲突？但更容易让社会团结在一起并引导货币投资或政策的潜力是引人迷目的。\n\
  \n迄今为止，预测市场的经验仅限于少数实验。然而，社会成员希望根据当地共识主动引导当地投资的想法正受到关注，特别是为了确保更高水平的问责制和行动为导向的政策。\n\
  \n## 社会与投资\n\n财政资源对社会运行的重要性与对业务的重要性同样重要。然而，没有什么的话题比政府对财政资源的使用产生更多冲突了。让社区成员对社会资源的支出方式拥有选择权可能会提高认同感。它甚至可能产生更多财政资源：经济学家发现，如果允许纳税人选择他们的税款资助预算的哪些部分，他们愿意支付比资金进入资金池时多倍的金额。\n\
  \n多项地方资源控制的实验正在进行中。在孟加拉，一家名为 `ME SOLshare Ltd` 的公司（与德国咨询公司 `MicroEnergy International`\
  \ 的合资企业）正在为该国农村地区的社区配备太阳能阵列，这些阵列可以发电并实现交易。通过与当地非政府组织（NGO）和基础设施开发有限公司（`IDCOL`，孟加拉政府的开发银行）合作，`ME\
  \ SOLshare` 为未受公用事业覆盖的社区配备设备，并使用监控并将能量重定向到其他消费者的硬件系统来实现交易。移动支付系统和移动应用程序（非区块链）负责支付。\n\
  \n去中心化能源领域的许多区块链支持的实验之一正在纽约布鲁克林进行。在区块链能源解决方案提供者 `LO3 Energy` 和服务纽约市的能源公用事业 `Con\
  \ Edison` 的帮助下，一个微社区建立了一个微电网，自产生太阳能并卖给附近的其他其他人。布鲁克林的实验之所以可能，是因为一组房屋主集体购买了太阳能电池板。`LO3\
  \ Energy` 和 `Con Ed` 然后与面板所有者合作创建了监控发电的平台和应用程序，这些平台不是将多余能量输回 `Con Ed` 系统，而是让没有面板的当地居民购买这些剩余能量。这项去中心化能源实验得到了市政府的明确支持，该市对探索缓解纽约老旧基础设施的方法感兴趣。\n\
  \n\n\n\n去中心化资源的思想并不新鲜。非政府组织（NGO）和发展机构已经在能源、水务、医疗和其他社会服务的小型移动解决方案上投入了大量资源，但结果参差不齐。一个尚未解决的问题涉及捐助者或安装者离开后物理基础设施的维护和修理。当地社区并不总是知道如何修理损坏的设备，或者缺乏维修所需的零件。当共享资源损坏时，由谁来买单也并不明确。因此，非政府组织和发展金融机构正在投入社区参与。他们正积极与当地代表合作，以确保社区投资反映当前的需求。基础设施的全生命周期视角日益成为这些对话的一部分，而区块链可以通过提高追溯性、透明度和访问性，并减少欺诈或腐败来促进这一点。通过支持资源的公平获取和分配，区块链将使其财务和社会影响变得更加显著。\n\
  \n另一种由金融驱动的社区投资模式来自 Neighborly，它与市政府合作确定需要资金的当地项目，然后开发市政债券发行为项目筹集资金。地方政府可以使用该平台为学校建筑维护、道路维修、公共公园基础设施和其他社区资源筹集资金。区块链记录了谁拥有发行的债券，并确保这些投资者在债券到期时获得回报。由于债券经过正式注册并具有官方评级，它们是低风险的，由于最低投资门槛相对较低而广泛可用。它们也可以随时在二级债券市场上交易。\n\
  \n## 社会与边界\n\n许多人类社会是基于边界的。我们有国家和地区边界，定义了民族国家或市政府。组织也有某种边界；它定义了哪些人属于该组织。本章讨论的身份识别、选民参与和当地投资问题在今天都发生在既定政府边界的范围内。但将这些过程数字化并将其置于区块链上，有时可以让物理边界变得更具流动性。\n\
  \n我们绝不是在缩小边界在社会认同和治理中的字面意义和象征意义。西岸和加沙地带巴勒斯坦人，以及俄罗斯对克里米亚半岛持续兼并，只是边界与社会权力和安全紧密联系的两个例子。例如，2014\
  \ 年至 2018 年间，伊斯兰国在伊拉克北部维持了他们所谓的“哈里发国”政权，在基尔库库市及其周边为其极端版本的伊斯兰教创造了一个象征性的家园。暴力性较小、但争议性可能并没减小的是自由国（Liberland），它的存在基于对克罗地亚和塞尔维亚真实边界的分歧。`²³`\n\
  \n然而，正如某些人从边界中发现深层意义一样，另一些人正在对其质疑。由海上定居学院推动的“海上定居”运动，旨在建立一个完全位于国家边界之外的海洋社会，以便在没有政府监管的情况下追求技术创新。这一概念带有某种《侏罗纪公园》级别的傲慢，而且由于在海洋中心建造安全、宜居住环境的技术挑战，海上定居运动已经失去了动力。尽管如此，绕过政府法治的思想在某些非营利海洋船上依然存在，这些船在国际水域锚定时旅行提供流产等医疗服务。希腊同样利用船只安置移民，直到他们等待适当的处理。`²⁴`\n\
  \n区块链通过允许参与相互联系并访问社会资源，扩大了无边界社会的潜力。随着时间的推移，这种潜力可能会以更细粒的方式体现。一些加利福尼亚人关于该州是否应该宣布独立的随性设想可能会以“加利福尼亚区块链”的形式实现数字化呈现。在更小的规模上，区块链可以实现由微市场和微型企业组成的微社会。\n\
  \n## 我的互联网\n\n微型发展能进步到什么种程度？盖特提出的`WWL`（其全球账本网络）可以支持一个代理（自主或其他）的生态系统，这些代理可以促进价值的多元化交换。在我们目前的经济系统中，参与者、资产、客户和供应商相互独立，并与实现机制独立运行。相比之下，在区块链社会中，这些组件可以直接编码在同一个系统中。因此，你拥有的资源、你使用的融资机制、你拥有的或关于你的数据，以及你期望的合同条款，都编码在`WWL`\
  \ 上代表你交易的 `DAO` 或 `dapp` 内部。我们将系统及其组件的整合称为`我的互联网`。\n\n在`第 7 章`中，我们介绍了生物黑客和人类植入物的想法，它们与外部组件无缝通信。我们还讨论了思想波或基因组被捕捉并存储在区块链上的潜力。除了静态存储，我们的基因组还可以通过更先进的\
  \ CRISPR 编辑进行操纵。`²⁵` 我们希望这些技术进步达到何种程度？\n\n在对现有基因治疗文献进行回顾时，David 发现生物学上操纵行为、思想和能力比他之前认为的更接近。`²⁶`\
  \ 他假设，企业高管有一天可以使用基因增强，通过遗传程序获得竞争优势，这些程序能让他们思考得更快、做出更好的决定。`²⁷` 在今天这个轻数字化的社会中，技术能力是“外插的”（bolt-on），即容易添加到业务功能中。例如，一个需要用户启动并验证交易的数字钱包应用程序就是外插式能力。通过区块链技术，能力可以“内置”（built\
  \ in）到人类形态中。结合`SSI`，植入式代理可以代表你做出决定。这种能力引发了关于未来社会契约如何构建的问题。在一个机器住在人类体时代，人类之间的社会契约将如何书写？\n\
  \n## 区块链社会中的挑战\n\n我们看到区块链社会在实现参与和公平性方面的巨大前景。这个社会也带来了围绕安全、隐私和数据所有权的一些风险。\n\n\n\n\n\
  \n在区块链社会中，安全性变得既更加先进，也变得更加复杂。我们反复尝试揭穿“区块链是一个不可破解的系统”这一观点。尽管区块链完整解决方案的某些方面使其难以被破解，但在用于区块链账本或构建在其上的边缘技术中，仍然存在漏洞。例如，加密货币钱包在目前的形式下是不安全的，加密交易所的代币储备已发生过多次损失，智能合约代码也遭遇过黑客。物联网（IoT）系统也极不安全；它们目前缺乏制衡机制，无法确认采集并导入的数据是否反映了现实。\n\
  \n与安全相关的另一个问题是密钥管理。去中心化身份（SSI）、加密货币所有权和网络访问都是通过安全密钥来实现的，这些密钥类似于密码，但是由解决方案本身颁发的。就像对待密码一样，参与者必须跟踪密钥。如果丢失了密钥，你就会失去对代币、ID\
  \ 等的访问权限，且无法找回。在完全数字化的系统中，丢失密钥是一个重大风险。这种风险的一个真实世界演示发生在 2019 年 2 月，当时一家加密交易所的首席执行官去世时，手中握着存储的\
  \ 1.37 亿美元代币的唯一密钥。[`../Text/notes.html#ch9-en28`](\n\n随着社会变得更加程序化，数据所有权问题也将继续困扰我们。设计用于采集成员数据的社会系统将成为所有编程环境的基础，无论是编程的还是基于区块链的。作为领导者和社会成员，我们如何确保没有单一参与者可以获取所有数据？我们可以从构建去中心化系统开始，拒绝由强大公司推动的中心化模型。这种策略需要消费者大规模地离开那些带给我们许多收益但已被证明的中心化平台。在缺乏强有力替代方案的民主社会中，这种变化不会发生。在非民主社会中，数据去中心化将更具挑战性，因为这些社会的政府机构对其可以访问的内容几乎没有限制。`../Text/chapter07.html`\
  \ 在智能城市背景下描述的社会评分系统，当政府可以无限制地使用它时，会带有更加阴暗的色彩。据报道，中国的社会信用体系已经影响了谁可以乘坐飞机旅行或从事某些项目。[`../Text/notes.html#ch9-en29`](\n\
  \n公民参与在区块链社会中同样面临挑战。在我们所强调的例子（如投票和参与当地投资）中，我们假设人们会想要参与。但他们真的想吗？许多国家的投票参与率很低，不仅是因为我们在本章前面描述的投票挑战，还因为一些人不想投票、不认为投票很重要，或者不相信自己的票起作用。\n\
  \n关于参与和行为的类似问题也适用于技术开发者社区，他们对治理重要社会基础设施的算法拥有巨大的控制权。该领域的一些人员曾建议为软件开发者制定一套“希西波拉底誓言”。`../Text/notes.html#ch9-en30`](\
  \ 最近，B9lab 提出了一项“中丰誓言”（Satoshi oath），邀请区块链开发者考虑不可篡改性、中立性和去中心化的价值观如何在他们接触的每一个项目中得到体现。[`../Text/notes.html#ch9-en31`](这一理念的目的是为人们在区块链社会演进过程中，开始管理自己的自己的选择提供一个框架。\n\
  \n这些问题都指向……（注: 此处省略了部分重复性描述，排版逻辑遵循上述规则）\n\n## 你的真实业务视角\n\n### 你学到了什么？\n\n在这个技术能力以及随之而来的社会经济准则不断变化的时代，你需要决定自己作为领导者想要扮演什么角色。寻找机会利用区块链来吸引公民，并扩大每个人都有权享有的社会资源的获取。\n\
  \n### 你应该对此做什么？\n\n在更具战术层面，在采用或推广区块链时，请使用并推广强有密钥管理。安全管理在早期尤为重要，此时人们仍在学习信任区块链。为了让区块链开发者围绕一套指导原则达成共识，可以考虑为你的软件开发者采用一种类似于“希西波拉底誓言”的制度，例如中丰誓言。通过在制定区块链规范和标准方面担任领导角色，你也将获得品牌收益。\n\
  \n最后，为技术进步以实现“我的互联网”做好准备。个人将作为组织领导者、公民和消费者的身份与区块链系统进行交互——同一个人可能同时扮演这三个角色。无论你与这些角色的关系如何，识别这些角色的能力将帮助你从客户日益增长的社会经济参与中受益。\n\
  \n### 接下来是什么？\n\n在规避风险的组织中，等待新技术如何演变的冲动非常强。我们敦促作为公民和社会组织组织（包括企业）领导者的你们不要等待。程序化社会并不是遥远的梦想。它的某些方面已经在这里了，例如在执法部门使用算法来决定刑期。\n\
  \n如果我们希望未来的程序化社会能够允许公平和隐私，我们现在就需要奠定基础。平台领导者没有等待。管理资金流的金融机构没有等待。最大的保险公司没有等待。正因为他们没有等待，任何希望影响其社区方向和内部参与条款的社会机构（无论是公共还是私立）都无法负担起等待的代价。\n\
  \n\n\n\n\n对于区块链如何在你的组织、市场以及社会中演进，你拥有多种可供选择。这些选择自然地包含了相互冲突的元素，正如我们在书中多处讨论过的那样。\n\n\
  一方面，区块链被推崇为一种重新工程业务流程的革命性技术。另一方面，区块链的真实业务创造了新的市场、行业、客户类型，并并通过新的组织模式塑造了社会参与的方式。\n\
  \n一方面，企业正在中心化控制的氛围中部署区块链。另一方面，区块链的真实业务要求治理、经济模型和技术的去中心化。\n\n一方面，你在职业生涯中在一个层级分明的市场（很可能是一个组织）中获得了晋升。另一方面，区块链的真实业务通过使经济主体能够在共识驱动的环境中自主行动来驱动增长。\n\
  \n一方面，全球各地的社会都经历了公民对公共机构信任的广泛消解。另一方面，区块链的真实业务鼓励对新的社会契约以及新的参与和互动方式进行实验。\n\n一方面，AI\
  \ 的使用增加了谁控制业务货币（即数据、访问权限、合同和技术）的不透明性。另一方面，区块链的真实业务为基于智能机器的活动提供了透明度，并明确了价值交换和问责机制。\n\
  \n这种对比目标的列表还将继续增加。所有最大的区别存在于观察与行动之间——存在于你想要尽可能学习一切的愿景与你亲身投入并实验以发现区块链战略价值的需要之间。在技术问题上，你可能有一种强烈的本能，想在投资之前观察别人如何做。企业领导者长期以来的共识认为，所谓的\
  \ B 类公司——那些等到先驱证明了新技术的价值后才进行投资的公司——通常拥有最佳的位置。¹\n\nB 类策略（即等到区块链技术成熟后才采取行动的策略）在过去是有效的。但随着我们转向可编程社会，它将不再像以前那样有效。\n\
  \n关于数据、访问权限、合同和技术的业务，基于智能机器的活动提供了透明度，并明确了价值交换和问责机制。这种风险是高度的。接受区块链的真实业务需要一种去中心化的、更具透明性的更公平的组织模式，并确保所有参与者的利益。这种窗口因此很小。那些试图在区块链成熟后才行动的企业，将失去其原本占据的竞争优势。\n\
  \n那些认为技术应该能够随着区块链的发展而惠及尽可能多人的领导，无法等待五年、十十年或十五年来看到结果。他们现在就需要对这种去中心化的、可编程的未来愿景进行定义并执行。\n\
  \n## 第一章\n\n1。John-David Lovelock 等，《预测：区块链全球价值，2017–2030》，研究报告 G032574 (Gartner,\
  \ 2017 年 3 月 2 日)。\n\n2。在比特币中，区块大小是统一的，取决于记录。在其他链中，区块可能有所不同。例如，在以太坊中，区块大小取决于计算的密集程度。作为一个一般规则，任何区块包含约\
  \ 2000 笔交易。参见 Mitchell Moos，“比特币区块历史新高”，*Cryptoslate*，2019 年 4 月 8 日，[`cryptoslate.com/bitcoin-transactions-per-block-all-time-highs/`](https://cryptoslate.com/bitcoin-transactions-per-block-all-time-highs/)。\n\
  \n3。我们现在称为 `区块链` 的概念最早出现在 2008 年由名为 Satoshi Nakamoto 的匿名个人或小组发布的白皮书中。该皮书描述了一种可以在开放网络上安全交易的数字货币。区块链和\
  \ `bitcoin`（由 Nakamoto 设计的货币）共同解决了一个困扰理论家已的问题：如何确保两个无法直接通信的远距离同者对相同的行动达成共识。（这个问题在计算机科学领域被称为拜庭将领问题。）Nakamoto\
  \ 概念化了一种能够结算一定规模交易的方法，防止由于非物理且去中心化的支付而产生的“双重花费”，并确认和保护参与者的身份。参见 Satoshi Nakamoto，“比特币：点对点电子现金”，Bitcoin.org，2008\
  \ 年 11 月，[`bitcoin.org/bitcoin.pdf`](https://bitcoin.org/bitcoin.pdf)。\n\n4。组合创建区块链的现有技术（及其日期或近似起源日期）包括分布式通信网络（1964\
  \ 年左右）、数字签名（1976 年）、梅克尔树（1979 年）、补充货币（至少可追溯到公元 4000 年）、数字货币（1983 年左右）、工作量证明共识算法（1993\
  \ 年）、实用拜庭容错（1999 年）以及安全哈希算法 `SHA-256`（2001 年左右）。\n\n5。并不是每个在区块链上交易的人或实体都运行节点；例如，一个人可以拥有比特币或其他代币但不运行节点。只有全节点才能维护和更新副本。\n\
  \n6。Gartner 将 `加密` 定义为在传输前对位流进行系统的编码，以便未经授权的方无法对其解密。\n\n\n\n\n\n## 区块链分叉与数字令牌\n\n\
  分叉有不同的类型。硬分叉（Hard forks）发生在软件升级更改了网络协议规则时（例如区块大小的变化），所有节点都必须同意此类更改。软分叉（Soft forks）允许之前的协议操作具有后兼容性，只需要大多数节点同意。分叉发生的情况各不相同。最常见的情况是参与者的一个小组想要更改或升级区块链上运行的协议，而其他人对该更改持反对意见。在这种情况下，这两个小组可能会对区块链进行“分叉”，创建两个独立的网络。当区块链交易历史或决定网络运行的协议规则出现重大问题，且网络需要分叉以保护资产或取消有问题的交易时，也会发生分叉。\n\
  \n代币也可以被视为虚拟货币的形式，欧洲银行管理局将其定义为“一种价值的数字表示，既不是中央银行或公共机构发行，也不一定与法定货币绑定，但被自然人或法人作为支付手段接受并可以传输、存储或交易。”\n\
