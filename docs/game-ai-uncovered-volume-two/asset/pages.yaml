  md: '![](img/f4a4f6e4de5338a867590c30638990cf_82_0.png)


    IMAGE 7.6 An example goal path for the AI is shown in dark-grey and heuristic
    scores are in varying shades of grey.


    The mid-grey cells show a constant high cost since choosing the goal point within
    these cells would guarantee colliding with the obstacle. The light-grey cells
    are weighted less since driving to the goal location does not guarantee a collision.
    The follow-on parallel path might find a better goal in the next few frames to
    avoid collision. The weight in these light-grey cells varies depending on the
    distance from the obstacle, with the highest weight being at the obstacle boundary.


    # 7.8 CELL DECOMPOSITION


    The method used to determine the optimal goal location is to calculate the minimum
    cost (the sum of all the heuristics) for all the cells and adding them to a list.
    Then use a guided search, similar to A*, to determine which cells are most relevant
    to decompose. The cell with the lowest cost is removed from the set and sub-divided
    into two smaller cells. Those two new cells are then analysed to find their new
    minimum cost and placed into the set of all cells. This subdivision is continued
    until the area of the best cell is sufficiently small which results in its centre
    being your chosen goal location.'
