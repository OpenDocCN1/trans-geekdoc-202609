  md: 'If you now convert these times to distances, you can find the distance to collision
    as the product of your speed and the time to collide as follows:


    \( d_{col} = t_{col} \cdot v_a, \)


    and the distance to completely pass the vehicle as the product of your speed and
    the time to pass completely:


    \( d_{pass} = t_{pass} \cdot v_a \)


    For example, consider an AI vehicle that is travelling at 35 m/s and a traffic
    vehicle travelling in the same direction at 15 m/s with a 50-m gap between them.
    Using the equations above, you can calculate that the distance to collision in
    this case would be 87.5 m (assuming constant velocities). If the total length
    of both cars is 4 m, you can calculate the distance to totally pass the traffic
    vehicle as 94.5 m. If, however, you have the same scenario but with the traffic
    vehicle now travelling in the opposite direction i.e., oncoming, then its velocity
    would be –15 m/s resulting in a collision distance of 35 m and a total pass distance
    of 37.8 m. Image 7.3 shows the current location of the AI vehicle and the two
    example traffic vehicles above in world-space and transformed into path-space.


