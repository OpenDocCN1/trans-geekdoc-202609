  md: 'A set of vertices and a set of edges connecting the vertices is called an Undirected
    Graph. Given each road’s flow implies that movement can happen from one junction
    towards the other, but not in the reverse direction on that road, this is now
    a Directed Graph (Cormen et al., 2009a). Conceptually, if you were modelling a
    street network in a city, it would have been possible for roads to come back on
    themselves and merge into roads in the opposite direction, or to go in a loop,
    but given that the racetrack does not have any loops (or “cycles”), you do not
    have to worry about this scenario. A Directed Graph without loops is called a
    DAG (Cormen et al., 2009b). Unlike its cousin, the undirected graph, the lack
    of cycles and the direction introduces valuable constraints, which can make reasoning
    about operations and movements on a DAG cheaper and simpler.


    The above first-pass construction is a good start to show a more abstract representation
    of the racetrack and to introduce some terminology, but it has some weaknesses
    when thinking about implementation details. Junctions, conceptually, do not carry
    information about individual routes but are rather a concept for describing rudimentary
    racetrack topology. For example, there are three ways to traverse the track in
    Image 13.1, so if you were to have to store information about each path, you would
    need to implement a mechanism for tracking each path in the Junction data structure.
    The cost for this would be the addition of code complexity and a high cognitive
    load for anybody reading the code in the future. This translates to high man-hours
    for debugging and maintenance, resulting in delays and everything else that comes
    with it. Following the mantra of every good algorithm designer “can we do better?”
    (Roughgarden, 2017) and using the Discovery Method (Madu, 2014), while scribbling
    edge cases on a piece of paper, there is another approach that can be taken, which
    preserves the general idea of the DAG structure. Instead of having junctions as
    my vertexes, you can focus on the roads (or rather road endings) themselves being
    the vertexes. The rationale behind this is that if you had a simpler situation
    with a two-way split, as shown in Image 13.3, you could associate a path with
    each sleeve.


    ![](img/f4a4f6e4de5338a867590c30638990cf_127_0.png)


    IMAGE 13.3 Racetrack with a two-way split and end-of-road association.


    Conceptually, this is the case with three splits (three paths) or multiple splits
    at different locations. A useful observation here is that because the structure
    has a direction and no cycles, you can argue an upper bound on the total number
    of paths. If the graph was fully connected (i.e., there is a connection from every
    node upstream'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'to every node downstream without introducing cycles), you would have at most
    2^(n-1) paths (Liu, 1968), meaning that you can use this number to pre-allocate
    or reserve memory or assert for any inconsistencies in the implementation later
    on. It is worth noting that if the graph had cycles and/or was not directed, the
    maximum-paths estimation would not be as robust. There can be an unlimited number
    of paths when one gets caught in a loop.


    Assuming the Tools Department did not give us the individual roads, but just gave
    us junction data, it is possible to build the road-end DAG as follows:


    +   1. Take every edge in the previous graph and create a vertex (“edgex”) where
    each edge used to be.

    +   2. Take the vertex that each edgex’s original edge was pointing to, enumerate
    the edgexes that are coming out of it and connect the previous edgex to the outgoing
    edgexes that you are enumerating.

    +   3. The resulting graph is the graph of road ends that was described earlier.
    Except that you are missing the starting line, so you can simply add a dummy edgex
    “s” to denote where the starting line is.


    See Image 13.4 for the original racetrack but reframed using the above steps.


    ![](img/f4a4f6e4de5338a867590c30638990cf_128_0.png)


    IMAGE 13.4 The racetrack with edgex’ (S, 0, 1, 2, 3, 4).


    In the above description, the term “edgex” was used to describe vertexes in this
    newly created graph to distinguish it from the previous originating graph. Going
    forward, the term “vertex” will be used when referring to vertexes in this newly
    created graph.


    # 13.4 IMPLEMENTATION


