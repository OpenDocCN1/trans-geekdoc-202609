- pgno: 202
  md: '# 22 Generalised AI Planners


    Andrea Schiel


    # 22.1 INTRODUCTION


    In the field of game AI, planning is most often found in solving the problem of
    AI agent navigation – path planning. Outside of path planning, only a few games
    have implemented a full-order planner as part of their agent decision-making.
    Planning is unique in that it can deal with highly complex problems that involve
    solving for multiple constraints. Planners can be developed to coordinate multiple
    agents or to solve more abstract problems such as planning the build order in
    a real-time strategy game. Even when such a need exists in a game, planners are
    often not implemented, and this is partly because they are expensive to implement,
    they tend to have an inherently higher run-time cost, and authoring the data for
    the planners takes both time and expertise.


    As a result, in games, planners have been hardcoded for the domain (domain-specific)
    that they were designed to solve. F.E.A.R., a first-person shooter game (FPS)
    released in 2005, utilised an approach known as Goal-Oriented Action Planning
    (GOAP) for its full-order planning (Orkin, 2006). GOAP has since been used in
    many games including Shadow of Mordor, Shadow of War, Tomb Raider, and the Assassin’s
    Creed series (Conway et al., 2015). Even A*, typically a navigation solution,
    was specialised to work as a planner for AI control in Super Mario Brothers in
    2009 (Karakovskiy & Togelius, 2012). Several variants of hierarchical task networks
    (HTNs) have been used in titles such as Killzone 2 and Killzone 3 (Straatman et
    al., 2013), Transformers: War for Cybertron (Humphreys, 2013), Left Alive (Hasegawa,
    2019), Blue Protocol (Yoshimoto, 2020) and many others. HTNs tend to be domain-specific
    as they can be optimised with gameplay-aware tasks and actions to plan with. For
    example, Killzone 3 had weapon-specific methods such as use_missiles. StarCraft
    started with a highly domain-specific scripted AI but was later outfitted with
    a specialised AI Planner technique combined with machine learning (ML) (Deneke
    et al., 2020). Unity now provides a GOAP implementation which allows the user
    to specify the actions and goals for their game. This allows the planner to be
    used for any game, but it is useless without the actions and goals. As soon as
    the actions are authored and use game-specific knowledge, the planner is no longer
    generalised.


    # 22.2 GENERALISED PLANNERS DEFINED


    # 22.2.1 DOMAIN-SPECIFIC PLANNERS


    There is a hidden cost to being domain-specific. Planners like these require an
    expert to author all of the data. How much expert knowledge is required to author
    the data'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'for a given planner depends on the domain (the problem space) that the planner
    was designed to solve and the type of planner. Planners that solve very specific
    problems in a game, such as the build order problem, require domain-specific data
    such as available agents, resource costs, resource availabilities, and so on.
    The tasks or actions that make up the plan would contain specialised actions of
    the various gameplay elements such as performing an assassination or executing
    a build order. That the planner is built to know what problem it is solving is
    what makes it domain-specific. Some approaches naturally lend themselves to being
    domain-specific such as HTNs. HTNs are authored by their goals and/or tasks that
    they use to build a plan. These planners need to resolve conflicts and constraints
    during or after the planning phase which also tends to require domain knowledge.


    # 22.2.2 Domain Free Planners


    Domain-free planners are more generalised, making them more suitable for solving
    a wide range of problem types. These planners require the ability to handle and
    act at a much more fundamental level. They are generally more adaptable and deal
    well with new situations. Having an adaptable planner would be ideal for games
    that involve a level of unpredictability and are less structured. Their lack of
    domain specificity reduces the development time in the long run, as experts do
    not need to spend a vast amount of time encoding domain-specific tasks, goals,
    or actions. They also do not require domain experts. While this may not seem to
    be a strong point, consider that this would free up designers for game balancing
    and higher-level work. It also frees up the UI or tools programmer needed to develop
    the editor for the designer to work with. In larger studios, a generalised planning
    system could be used across multiple titles.


    In stark contrast to their specialised counterparts, generalised planners can
    also plan across disparate areas of the game. For example, in a FPS, instead of
    having one planner for path planning and another planner to work out the targets
    for a given agent, imagine a planner that could plan out where the agent needs
    to go, add in actions to shoot along the way, and even plan to reload, possibly
    even grabbing that med kit. In most games, this is currently simulated using influence
    maps, weighted pathfinding, or the use of a utility system. As game systems become
    more powerful, this approach, once only enjoyed by researchers and thought too
    slow, could become a powerful approach for the AI game programmer. The catch,
    of course, is to build a domain-independent planner usable for a game.


    # 22.3 APPROACHES TO GENERALISING PLANNERS


    Attempts have been made to generalise HTNs (and other planners) with the introduction
    of abstraction of how the planner''s problem (domain) is represented. In 1998,
    the Planning Domain Definition Language (PDDL) was presented to the AI Planning
    Systems (AIPS) competition (Ghallab et al., 1998). PDDL is now on its 4th variation,
    but still, the core idea is a common, general planning syntax for classical planners.
    The hope was that if the language was expressive enough, and generalised enough,
    a planner could solve any sort of problem. In other words, the ideal domain-free'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'planner would have no knowledge of the type of problem it was solving. Prior
    to PDDL, problems had to be expressed in a domain-specific way. The support for
    PDDL by a planner does not make it necessarily domainless, but it does allow for
    the abstraction of the problem space which is a good first step. Many off-the-shelf
    planning systems, both domain-independent and domain-specific, support PDDL to
    some extent. In the context of game development, having a domain-free way to express
    planning problems would extend the ability of the planner to solve for different
    areas of the game. For example, the same planner could solve a resource-building
    tree as well as solve for unit deployments. Arguments have been made that PDDL
    could be of use in games (Bartheye & Jacopin, 2019), but at the time of writing,
    there has not been widespread adoption of such in the industry.


    Another approach is to abandon the pure domainless planner and utilise either
    domain knowledge or more specialised planners in areas requiring a certain level
    of performance. This is referred to as the portfolio approach. This is a strategy
    that utilises more than one planner. For example, a game may leave the base path
    planning to an A*-based system but combine that with a more generalised planner
    for solving another area of the game. The idea behind a portfolio approach is
    to leverage the strengths of various planning methods to improve overall performance,
    robustness, and adaptability when dealing with different types of planning problems.
    It could be argued that many games with planners are somewhat already doing this.
    However, the portfolio approach is a little more involved as the system needs
    to choose which planner(s) to apply and implement strategies on how to merge the
    different plans. The planners in a portfolio can be all domain-independent, all
    domain-specific, or a mix. The planners would all be different in how they plan.
    Optimisations in portfolio approaches tend to be in how it chooses between plans
    and there have been some recent advances with the portfolio approach applied to
    generalised planners (Rizzini et al., 2015). Note that the execution of the various
    planners chosen can be in parallel, offering another opportunity for optimisation.
    While the use of the portfolio approach in games is not new (Churchill & Buro,
    2017), its use with full-order planners to offset the cost of domain-independent
    planners is still under active research. The detractor here is that now multiple
    planners need to be implemented and maintained. However, having a portfolio could
    also be a risk mitigation strategy against a lot of plan failures or spikes in
    performance.


    Possibly a more pragmatic approach would be the one taken by goal and task Pyhop
    or GTPyhop (Nau et al., 2021). This is the latest incarnation of a HTN that has
    been made to be as generalised as possible. GTPyhop is a goal-oriented variant
    of HTN – much like GOAP or goal decomposition planners (Shivashankar et al., 2012).
    As PDDL abstracts the problem domain, making it possible to describe many different
    types of planning problems, GTPyhop abstracts the goal and action space. Goals
    are decomposed into subgoals, and tasks are decomposed into subtasks. The generalisation
    is that GTPyhop provides a set of primitive methods that can be reused across
    different domains. These methods perform basic actions and can be combined in
    various ways to achieve higher-level objectives. Any game that currently uses
    an HTN could do the same. It does allow for the definition of new operators and
    methods, which could bring in some domain knowledge if the implementor is not
    careful. To guard against this, GTPyhop separates the planning system from its
    knowledge.'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'This allows the planning itself to be generalised while still allowing some
    injection and optimisation of specific knowledge. Other planners, such as Fast
    Downward, also utilise this modularisation to achieve domain independence. There
    are variants that use the portfolio approach, allowing Fast Downward to choose
    the best search approach at the time. Unlike GTPyhop, Fast Downward also supports
    PDDL. Both systems offer off-the-shelf planning systems that could be utilised
    in games.


    # 22.4 CHOOSING TO BE FREE


    Choosing the right planner, generalised or not, is going to be highly dependent
    on the types of problems being faced by the game''s AI. Assuming that the problem
    is a good planning problem, there are advantages and disadvantages to each type
    of planner. Spatial problems, such as path planning, tend to do well with a variant
    of A* search because these plans involve a small action space (walk), a large
    search space (the area the agent can walk), and a simple heuristic (cheapest cost).
    Research trees are not dissimilar from path planning as they too involve optimisation
    of costs. On the other hand, problems that involve timing or coordination do not
    do so well using a simple graph search. These sorts of problems usually fall to
    planners like GOAP or HTN. The choice between GOAP- and HTN-based planners can
    be determined by whether there are a few goals to choose between (GOAP) or multiple
    methods to solve the same goal (HTN). SPARK is a planner that deals in probabilities,
    which is useful if there is some ambiguity in assessing the outcome. If the problem
    space involves a lot of conflicts and constraints between possible actions, outside
    of pruning or optimisation of the search space, using a planner combined with
    a constraint solver may be required. Temporal constraints may require the use
    of a HTN like SIADEX which is better at expressing time. Table 22.1 gives an overview
    of the different planners discussed in this chapter.


    If the flexibility or reusability of a domain-free approach is needed but there
    is a pre-existing planner, then there is the option to convert the planner to
    become more generalised. This could involve the integration of PDDL, the further
    abstraction of its tasks or actions, and the separation (modularisation) of its
    data and its planning. The planners in Table 22.1 that are not naturally domain
    free, or support PDDL, could be converted to do so. If there is a specific subproblem
    that requires optimisation, the portfolio approach might be the solution. Further
    optimisations can occur by parallelising the planning and the use of pruning or
    heuristics to speed up the search.'
  merge: -1
  img_proc: true
