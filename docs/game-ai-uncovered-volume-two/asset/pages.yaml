- pgno: 144
  md: 'sensibly avoid walls and the player. As such, different agents can respond
    differently. For example, a prey-like unit being more self-preserving than risk-taking.

    Going back to the drones in a large cave example, the drones would be able to
    patrol an area while avoiding walls. If the drones are said to be evasive and
    prey-like by design, a different take on the flee behaviour can be achieved by
    processing both other types of AI units and the player as threats. A scenario
    with multiple flying units that pursue and evade each other is illustrated in
    Image 15.7.


    ![](img/f4a4f6e4de5338a867590c30638990cf_144_0.png)


    **IMAGE 15.7** AI scenario. Units A and B go after C while staying clear of each
    other. Unit C takes A and B as threats while it avoids obstacles and heads toward
    its interest point (the “Goal”).


    The seamless combination of the described interest and danger processing across
    multiple entities can produce an immersive experience for the player. It strives
    to achieve a pattern of movement that looks natural as it pursues its goals, while
    self-preserving by avoiding dangerous situations. How the goals and dangerous
    situations are determined can be as varied as intended, which may be used by different
    games in bespoke settings.


    The goals can also be represented by a multitude of entities. For example, path
    waypoints while on patrol or racing, enemy entities while engaged in combat, items
    to be picked up, and friendly entities if the unit has a group behaviour. A solution
    to easily identify the relationship between actors is to use tags for identifying
    the type of entity. Hierarchical tags can provide an even finer level of granularity.
    For a game that simulates air combat, an AI system may want to treat a health
    item differently from a friendly entity. Although both are interesting elements,
    each can have its own tweakable weight to be processed by the environmental steering
    algorithm.


    An interesting take would be considering two or more goals simultaneously, for
    instance, a flying unit may want to slightly deviate from the optimal path to
    the next waypoint just enough so that it can pick up a consumable item like health
    or fuel, before resuming its path-following routine. Furthermore, the weights
    for each item can also be adjusted at runtime. For example, if a unit is low on
    fuel the interest weight might be increased for the petrol can.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# 15.4 AGGRESSIVENESS PROFILES


    Regarding the general behaviour of the AI unit that implements Environment Steering,
    some overarching alterations can be made to produce a unit that is more relentless
    in searching for certain goals, taking more risks next to dangerous objects, or
    being more inclined to be defensive regardless of interest objects.


    # 15.4.1 DEFENSIVE


    A defensive profile is a more conservative take in contrast with the rather moderate
    approach as suggested in Image 15.3. In this instance, when there is a threat
    nearby, the unit’s main objective will be to avoid the threat. That means ignoring
    the interest points altogether while the threat is still present, which could
    be translated into a very low tolerance for any danger, or very specific kinds
    of threats. This case is shown in Image 15.8.


    ![](img/f4a4f6e4de5338a867590c30638990cf_145_0.png)


    IMAGE 15.8 (a) The defensive unit is presented with both goal and threat. (b)
    Defensive Profile overrides all interest directions and heads in the opposite
    direction of danger.


    # 15.4.2 Risky


    As part of an advanced strategy, the unit may choose a high-risk strategy. For
    instance, to lose another unit that is chasing it, it may still choose a potentially
    dangerous direction on purpose, going where another unit that is not so risk-inclined
    would take. This risk-taking can be mitigated by keeping the time to collision
    very small to still avoid objects at the last moment to ensure self-preservation.
    Another situation where this risk-taking may lead to higher rewards is to select
    a tight spot surrounded by dangerous actors that may lead to one of its goals
    faster. For example, a pick-up health item that is surrounded by enemies or obstacles.
    This risk-taking profile is shown in Image 15.9.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '![](img/f4a4f6e4de5338a867590c30638990cf_146_0.png)


    IMAGE 15.9 A display of an aggressive profile, AI unit taking risks for a higher
    reward. NE direction is chosen, despite the danger in the next radial N. (a) Top
    down view showing the resultant vector. (b) Interest and Danger vectors in each
    direction.


    As a further step, the weight applied to each interest or danger direction might
    be determined by the time to collision instead of distance by using the formula
    for velocity:


    ```

    ''AI unit = d/t

    ```


    Both velocity (v) of the AI unit and distance (d) to interest or danger actors
    can be easily queried at runtime. Knowing this, the time to collision can be derived
    by manipulating the formula above to give:


    ```

    ''Collision = d/v

    ```


    # 15.4.3 MODERATE


    A balance between both profiles described is to define a threshold value for both
    danger and interest scores for each radial. This can provide interesting combinations
    and further tweaking options to find the desired balance for the game requirements.
    Code Listing 15.3 explains how it can be done.'
