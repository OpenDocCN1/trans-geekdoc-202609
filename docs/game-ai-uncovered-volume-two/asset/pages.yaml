  md: '# 11.3.2 PLAYER-CENTRIC UTILITY FUNCTIONS


    There is a lot of value in making utility functions take the player into account
    in addition to the world state. For example, using the earlier scenario, if a
    player observes a fire start in a room, then they typically expect to see an onscreen
    actor going to get a fire extinguisher, rather than an off-screen actor that is
    closer to the extinguisher doing so, even though the outcome for the player is
    better in the latter case. As such, prioritising visible responsiveness is often
    the best strategy.


    Similarly, when tasks are used to create interesting rather than required behaviour,
    such as back-to-back searching, then it is usually worth prioritising tasks that
    the player is likely to see. This can be implemented by adjusting utility functions
    (or, indeed, dynamic creation and removal of tasks) based on the player''s current
    or anticipated position, or whether relevant locations and involved actors are
    currently visible. For player-created tasks, such as construction requests in
    a management simulation, you can very simply adjust the utility function to prefer
    these over background tasks as well as increasing the utility if you believe the
    player is getting impatient waiting for it. The hard part, of course, is accurately
    determining what a player is thinking just by observing their actions.


    # 11.3.3 ACTOR TASK SWITCHING


    An actor will naturally change tasks whenever the utility function finds a more
    appropriate option for them, and another actor may steal their task at any point
    if their utility function scores higher. As such, it is usually valuable to add
    some stickiness to the utility function for a task that an actor is already assigned
    to.


    It can be advantageous to consider how tasks are switched between actors, as there
    is usually some traversal involved as the actor to a task. As such, it can be
    useful to have the concept of pending actors for task roles, so swapping out only
    occurs when the new actor arrives and at a point in the task that is safe for
    the actor to exit. This can be useful when manning a piece of equipment, as it
    can be frustrating for a player if equipment such as a guard post is left needlessly
    unattended – even more so if other tasks rely on it being filled, such as a food
    counter with a required server and optional actors being served.


    It is also important to take care to avoid cycling between tasks, which can easily
    occur if multiple competing tasks have a utility function that can change positively
    and negatively over time; a simple error case would be using Euclidean distance
    for calculating the distance to a task where the actor then ends up on a traversal
    path that takes them farther from the task position. This sort of problem can
    be difficult to eliminate entirely, so a temporary history of previously performed
    tasks and time-stamps is valuable.


    It is also generally preferable that a task is at least partially performed, if
    possible, as it can look foolish to begin something and then immediately stop.
    A time limit before willingly exiting is often helpful.


    If an actor has no task available for them to perform, then they will fall back
    to their default behaviour outside of the utility system. This could be a simple
    wandering idle or a more complicated behaviour collection, but unless there are
    always'
