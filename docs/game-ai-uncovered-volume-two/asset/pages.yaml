  md: 'trained gameplay policy reaches the desired quality level, the context-guided
    agent behaviour model is ready to be deployed in the target game environment.


    # 10.5 CONCLUSION


    The design described in this chapter demonstrates a game industry workflow-compatible
    approach to integrating learning logic into BT-based agent AI behaviour authoring.
    The concepts presented need to be applied and tested in commercial video game
    environments, to provide real, industry-viable scenarios of learning integrations.
    To that effect, the author is currently experimenting with the deployment of the
    proposed design in the game 60 Seconds! (Robot Gentleman, 2015) to train game
    playing and automated playtesting agents based on skill and style player personas.
    Successful integration of learning into game agent AI and its incorporation into
    industry workflows has the potential to solve game playing and playtesting problems,
    where simpler or manual solutions would not suffice. However, it is not a replacement
    for ad hoc authoring and more importantly for human experts involved in creating
    AI.


