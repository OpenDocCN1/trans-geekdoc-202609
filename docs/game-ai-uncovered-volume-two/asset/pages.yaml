    # 7.5 HEURISTIC WEIGHTS


    With a representation of where another vehicle will be in relation to the AI vehicle’s
    progress, you also need to represent how much effect a collision with that vehicle
    is going to have. For this, you need to consider what the resultant effect on
    the AI vehicle velocity will be if a collision occurs. It is assumed that the
    collisions are elastic since those are most representative of the physics used
    in Wheelman, and therefore can use the following elastic, conservation of momentum
    formula:


    ```

    m_1 u_1 + m_2 u_2 = m_1 v_1 + m_2 v_2,

    (7.1)

    ```


    where m_1 and m_2 are the masses of the two vehicles, and u and v denote the initial
    and resultant velocities, respectively. Using the kinetic energy formula for elastic
    collisions, which is:


    ```

    m_1 u_1^2 / 2 + m_2 u_2^2 / 2 = m_1 v_1^2 / 2 + m_2 v_2^2 / 2

    (7.2)

    ```'
