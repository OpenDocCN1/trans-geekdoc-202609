    \ (before or parallel) would still be preserved. As a matter of fact, a DAG can\
    \ have multiple valid topological sorts. The reason for this is that some vertexes\
    \ could have the same set of dependencies, meaning that they can be ordered arbitrarily\
    \ with respect to each other.\n\n# 13.5 SHORTEST AND LONGEST PATH TECHNIQUE\n\n\
    Up until this point, a representation of a racetrack has been defined and a linear\
