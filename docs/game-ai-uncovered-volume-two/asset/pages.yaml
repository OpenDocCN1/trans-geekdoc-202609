  md: '# 13 Directed Acyclic Graphs

    for Fun and Profit


    Ivan Mateev


    # 13.1 INTRODUCTION


    Directed acyclic graphs (DAGs) are a well-studied area of Computer Science and
    a strong candidate for a theoretical backbone for a wide variety of AI systems,
    which require solving the problems of scheduling, enumeration of choice and even
    pathfinding. DAGs are usually taught within the curriculum of graduate-level and
    advanced undergraduate-level Graph Theory classes and can sometimes end up ignored
    by a lot of students due to the threatening appearance of the wider study of graphs.


    This chapter will summarise a semi-informal description of what DAGs are and present
    algorithmic solutions to standard graph problems but reframed and formulated to
    the framework of DAGs. It will also briefly cover some conceptual AI systems that
    run on top of DAG-like frameworks. Throughout, a hypothetical racing game framework
    will be used to motivate the set-up and the examples, but conceptually, the techniques
    can be used in any other conceptual environment. The techniques described in the
    chapter can be found and derived from publicly available sources, so this article
    should be thought of as a centralised point of reference on the subject.


    # 13.2 HYPOTHETICAL RACING FRAMEWORK


    The framework used throughout this chapter is that of a racing game with the following
    design requirements:


    +   • Racetracks can have multiple splits in them, allowing for the flow of the
    race to diverge and converge as the level designer wishes. Some routes might be
    longer than others.

    +   • Racetracks cannot have loops that back onto themselves and the flow of the
    race must always be from the starting line towards the finish line.

    +   • The AI needs to make route choices, other than the shortest route so that
    the race does not turn into a procession.

    +   • The AI needs to make route choices, such that the player always feels like
    they are in the race. Driving alone for miles behind or in front of the pack is
    no fun, so the designer wants the ability to motivate the AI to take longer or
    shorter routes throughout all possible choices to keep things interesting.


    An example track is provided in Image 13.1, where the track splits into three
    and merges back into one again:'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'A track-building tool has already been built by the Tools department and each
    of the individual road segments (marked A, B, C, D and E on the image) have been
    stored somewhere internally as well as information about the next section of road.
    The Tools department has been very diligent, and they have added functionality,
    where the length of each road is baked into its internal representation – absolute
    legends!


    The engineering requirement is to convert the above design requirements into a
    data structure, which can be modified and queried to answer questions as well
    as a technological unit, which motivates the AI to take and/or prefer a particular
    route at a given time.


    # 13.3 ARCHITECTURE


    A knee-jerk approach towards modelling the setup in Image 13.1 would be to track
    (pun not intended but appreciated) the junctions and merges of the individual
    road segments and represent each junction as a vertex and each road as an edge.
    The starting line and the finish line can be called S and F respectively and modelled
    with a vertex, which has one road going away or into the vertex: a deformed junction
    of sorts. The flow of the race is specified by the game design with each road
    flowing from the starting line to the finish line, so each edge has a direction.
    See Image 13.2.


    ![](img/f4a4f6e4de5338a867590c30638990cf_126_0.png)


    IMAGE 13.1 Example racetrack.


    ![](img/f4a4f6e4de5338a867590c30638990cf_126_1.png)


