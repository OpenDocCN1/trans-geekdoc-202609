- pgno: 43
  md: '# # 4 Dynamic Behaviour Trees

    Building for Scalability


    Jonathan Keslake


    # ## 4.1 INTRODUCTION


    Behaviour trees are one of, if not, the most used behaviour architectures for
    AI within the industry since their first major breakout role in the *Halo* franchise
    (Isla, 2005). They are such a constant that any move to use any other system such
    as a Goal-Oriented Action Planner or a Hierarchical Task Network can be difficult
    to justify. This popularity stems from familiarity with many designers already
    comfortable with the systems. Making a move away from using behaviour trees can
    be the wrong call for a game, given their inherent ease of use.


    At their best, the simplicity of behaviour trees allows a designer to take one
    look at a tree, and work out what an AI does and in what order it will do it.
    At their worst, they are a large jumble of complex interactions that require following
    a series of spaghetti strands around a far too large graph to work out why an
    AI has suddenly decided to investigate a rabbit warren in the middle of combat.
    They are prone to small errors that fail quietly and, due to the simplicity of
    their construction, often lack ways to share trees between different non-player
    characters (NPCs) easily. This leads to one of their greatest failings and large
    amounts of duplication, compounding the chance for small errors to seep in.


    This chapter explores the different methodologies that were used in the development
    of *The Survivalists* to encourage behaviour tree reuse and different ways to
    *hack* your trees to improve their reusability. This chapter promotes the construction
    of smaller reusable behaviour trees to allow the builder to focus on what is important
    in a tree without having to concern themselves with the myriad of systems present
    in a single game.


    # ## 4.2 BEHAVIOUR TREES


    Behaviour trees are considered simple, but only if they are viewed as a black
    box. The actual underlying system can become quite complex. Fortunately, there
    are many good resources about how to best write your own implementation in significant
    depth (Champandard and Dunstan, 2013). Alternatively, you can always just grab
    an existing implementation. Commercial engines tend to have good implementations
    lying around their asset stores, and Unreal Engine has one built into the core
    engine itself (Epic Games, 2022). Whether you build it yourself or use a third-party
    implementation, the overall layout of the system should be consistent with the
    brief explanation covered below:'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'The basic structure of a behaviour tree consists of a root node, composite
    nodes and leaf nodes and is depicted in Image 4.1. The elements depicted are as
    follows:


    ![](img/f4a4f6e4de5338a867590c30638990cf_44_0.png)


    IMAGE 4.1 Basic layout of a behaviour tree.


    +   - The root node is the entry point for the graph, and leaf nodes comprise
    all actions that can be taken by the AI.

    +   - A leaf node, once executed, can opt to either stay within itself for a certain
    amount of time or return success or failure, which is only relevant to the operation
    of their parents and principally by the composite nodes.

    +   - Composite nodes define how leaf nodes should lead into one another. While
    other types exist, such as parallel nodes, the two main flavours of composite
    nodes are selectors and sequencers. Selector nodes run all their child nodes in
    a sequence (leaf nodes or other composites), until the first node that returns
    success prompts, the selector itself to return success. If it gets through all
    its child nodes without any success, it returns failure. Sequence nodes run all
    their child nodes in sequence until a node returns failure, and then the Sequence
    node itself returns failure. If it gets through all its child nodes without any
    failures, it returns success.


    That is all there is to behaviour trees really, a very simple tree structure with
    basic flow control. The tree is run from the root downwards, from left to right,
    evaluating nodes according to the rules of the composite nodes until it arrives
    at the end of the tree. Once there, it just restarts the tree and does it all
    again. Connect this up to an AI character and you can watch them navigate the
    tree, making decisions and running behaviours.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# ## 4.2.1 INTERRUPTS


    One additional element of behaviour trees that we will be discussing is the concept
    of an *interrupt*, also known as a *monitor* (Champandard and Dunstan, 2013).


    As a behaviour tree is run left to right, sometimes a higher priority node that
    was originally evaluated as false might suddenly become true. A simple example
    of this is shown in Image 4.2.


    ![](img/f4a4f6e4de5338a867590c30638990cf_45_0.png)


    IMAGE 4.2 Simple implementation of handling spotted players.


    The issue is the selector on this branch will only be re-evaluated once the tree
    is re-evaluated. Leaving the NPC to finish their current behaviour, for example,
    an NPC completing a full patrol before responding to the player. This can be solved
    using the concept of an interrupt. An interrupt will take control away from the
    patrol behaviour when the player is spotted and restart the tree. This allows
    the NPC to respond immediately.


    The interrupt introduces a new problem for behaviour trees. No longer can we consider
    a branch of the tree in isolation. All other branches could now be waiting to
    rip control away from the current leaf behaviour. For behaviour trees to still
    function as described, interrupt nodes work on a prioritisation level with only
    interrupt nodes of a higher priority being checked, ensuring that once the world
    state changes, the NPC will know it needs to re-evaluate its tree.


    This is a good and logical trade off. The behaviour control is maintained within
    the tree instead of relying on an external system. It is good practice to visually
    highlight the interrupt nodes, so they do not need to be inspected to determine
    that they'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'are in fact interrupt nodes. For the behaviour tree system built for *The Survivialists*,
    this was done with an in-your-face bright red exclamation mark.


    # 4.2.2 Dynamic Behaviour Tree Nodes


    The ability to use subgraphs is ubiquitous in behaviour trees and is available
    in all good implementations. Subgraphs allow a behaviour tree to branch off to
    run another, separate behaviour tree. This is usually expressed as a node that
    references another tree, and, on execution, runs that tree. It is as though the
    entire tree was just pasted into the parent tree, which allows that section of
    the tree to be reused by different trees.


    Dynamic behaviour tree nodes take this one step further. A subgraph node explicitly
    states what tree to insert, whereas a dynamic behaviour tree node is more flexible.
    It allows different graphs to be substituted at runtime. A classic example of
    this is using smart objects.


    The actual *how* of how a subgraph is associated with a certain dynamic behaviour
    tree node is an in-depth question. Unreal’s implementation requires all dynamic
    nodes to have a custom gameplay tag; users then push behaviours into the tree
    against that tag and it gets assigned to the correct tree (Epic Games, 2022).
    *The Survivialists* supported a more flexible approach that also had custom nodes
    which each knew where to poll for the behaviour tree they should be running when
    they begin execution.


    The single largest issue with dynamic behaviour trees is that the simplicity of
    the tree has been compromised. No longer can you look at a single tree and work
    out exactly what an AI is doing. It is now dependent on whatever scenario an NPC
    encounters at runtime. Debugging tools can mitigate this somewhat, if analysing
    a live behaviour tree, the node can be made to show what tree it is currently
    running or intending to run as though it were just a common subgraph and not dynamic.
    When editing a tree out of runtime though, if too many dynamic tree nodes are
    present, it can get very confusing as to what is doing what and how your change
    will affect all the different possible trees that will be substituted.


    Dynamic behaviour trees are at their best when they comprise small bits of self-contained
    behaviour. They are then substituted into a node which itself is very explanatory
    about what the extension data is expected to do. Essentially you should be able
    to treat that dynamic behaviour tree node as though it is a concrete subgraph,
    so nothing too wacky or controversial can occur, but small changes in behaviour
    are accepted.


    # 4.2.3 Evaluating Good Changes to Trees


    Adding functionality to behaviour trees can serve to complicate the run of the
    tree and create new problems. Therefore, it is a good idea to establish a few
    important metrics for how to make sure your change goes off without a hitch:


    +   - Visualisation: Always ensure the change you made is immediately obvious
    on looking at the tree. For example, drawing a big red exclamation mark for interrupts
    helps drive home the point that this is not a normal node.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '+   - **Integrate into Debugging**: Good behaviour trees can be visualised
    at run-time, allowing the builder to follow the run of the tree as it goes. Great
    behaviour trees allow nodes to present runtime information about what is going
    on within them, such as which dynamic tree node they intend to run.

    +   - **Maintain Prioritisation**: Behaviour trees rely on their left-right prioritisation,
    do not mess with that.

    +   - **Keep It within the Tree**: Changes which rely on external systems just
    add another point of failure to your system. Keeping everything within the tree
    allows the builder to see everything relevant to the AI from a glance.


    # 4.3 PARENT–CHILD TREES


    Have you ever had two trees be almost identical save for a few nodes? You are
    trying to reuse the organisation of sequences and selectors and contain data in
    shared behaviour trees, but it just seems impossible. Essentially, you just end
    up recreating the same structure repeatedly, whenever you are creating a new tree
    for an NPC. As an example, take a look at Image 4.3, which is based on an actual
    behaviour tree from *The Survivalists*.


    ![](img/f4a4f6e4de5338a867590c30638990cf_47_0.png)


    IMAGE 4.3 Example parent behaviour tree.


    In this example, the highlighted nodes in the tree are the actual points of variation.
    When you make a new tree for a new NPC, you copy everything else in the tree and
    then just change each of those points to the NPC’s specific behaviours. In *The
    Survivalists*, we had groups of NPCs with just slightly different attacks, yet
    we were still having to create the whole graph for each individual NPC.


    The issue here is one of composition versus inheritance. Behaviour trees are perfectly
    happy to make use of composition to build their behaviours out of subgraphs, but
    no equivalent methodology exists for inheritance. If this were a class, you could'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'make the highlighted nodes into virtual functions, and each class that comes
    along would fill in the little bit of data when prompted, but would not have to
    know anything about how the parent class functions.


    Instead of duplicating each of these trees, you could make a new shared tree,
    dubbed a parent tree, for all NPCs of this type. Then, change each of the highlighted
    nodes instead to dynamic behaviour tree nodes. Each NPC then needs a child of
    this parent tree, with the ability to fill in these nodes with their own custom
    per-NPC logic. The child tree automatically inherits the layout of the parent
    tree.


    The true beauty of this solution comes from how simple this proves to be on a
    per-NPC basis. When creating a new NPC, you can select a parent tree, and then
    a lot of the extension points can be filled in with generic subtrees. In the example
    from The Survivalsits, the behaviours for the new NPC are already constructed
    for us; the only new trees required are the actual NPC-specific ones relating
    to managing how they attack.


    But what do our child trees look like? They need to be able to specify what tree
    they inherit from, but then also identify what needs to be overridden. If you
    were building this into a behaviour tree system from the start, you could consider
    this from the ground up. Only graphs with no parents would get the traditional
    behaviour tree layout starting with a root node, all others would get several
    starting points, generated from the listed extension points within the parent
    tree. At runtime, the parent tree would just be run, but the extension points
    would be the equivalent of virtual functions, with the actual graph to run being
    resolved by the child tree. You would also need to make sure that all extension
    points within subgraphs show up in that child tree as well. The Survivalsits had
    an attack control tree assigned to each of the hostile parent trees which did
    some shared attack logic before delegating out into the specific Attack behaviour
    for an NPC. An example of this is depicted in Image 4.4.


    ![](img/f4a4f6e4de5338a867590c30638990cf_48_0.png)


    IMAGE 4.4 Example child behaviour tree inheriting from the example parent behaviour
    tree in Image 4.3.


    This approach, however, would take a lot of work and time, time that was not available
    when developing The Survivalsits. Besides, most of the time, these extension points
    will be pointing to a subtree, as they will be shared behaviours. Additionally,
    if you do fill in each node with custom nodes, the layout will quickly become
    a mess. It is therefore advisable instead to just require each node to be a subgraph.


    For the implementation used in The Survivalsits, a separate data asset was created
    to wrap this information. Instead of an NPC referencing what behaviour tree it
    used, it would instead reference the asset, dubbed Behaviour Tree Data (BTData).
    This'
