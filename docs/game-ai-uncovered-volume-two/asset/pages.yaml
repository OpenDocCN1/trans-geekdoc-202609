  md: "```\nCode Listing 21.4: The ComputeCost function, using Boolean type.\n\nfunction\
    \ CurrentNode.ComputeCost with CurrentNode is C has\n    input: PlanRequest with\
    \ Request is R, PlanNode with OtherNode is O\n    output: Float with Cost is T\n\
    \    where T := (if (Ca # 0) -> TCa else 0) + sum(Ta)\n    with: TCa is cost of\
    \ A led to Cw or 0 if no A led to Cw,\n          preconditions are p of An | {Ai}\
    \ is action in R\n          where p(s, v) = Ow(s, v) and Ai = Oa\n          where\
    \ TaI is cost of Ai\n          where Oa is Ai led to Ow, Ow is World State pair(state\
    \ is s, value is v) of O\n          where Ca is Ai led to Cw, Cw is World State\
    \ pair(state is s, value is v) of C\n          T := if (Ca()=0) -> TCa else 0\n\
    \      for each A in R do\n        for each pair(s, v) in p of Ai do\n       \
    \   for each pair(s, v) in w of O do\n            if p(s, v) = Ow(s, v) and Oa\
    \ = Ai\n              T := T + TaI\nreturn T\n```\n\nThe ComputeCost function\
    \ shown in Code Listing 21.4 occurs for each neighbouring node being expanded.\
    \ Because the nodes generated by the GetNeighbours function (in Code Listing 21.3)\
    \ contain both the world states and the action that led to it, the ComputeCost\
    \ function can use this information to determine a cost. The last function to\
    \ be explored is one to estimate a cost. EstimateCost is shown in Code Listing\
    \ 21.5 and is used to estimate the cost from the current node to the goal node.\
    \ It returns a cost of 1 for any not-identical world state between two nodes.\n\
    \n```\nCode Listing 21.5: The EstimateCost function, using Boolean type.\n\nfunction\
    \ CurrentNode.EstimateCost with CurrentNode is C has\n    input: PlanNode with\
    \ OtherNode is O\n    output: Float with HeuristicCost is H\n    where H := (if\
    \ (Cw with HeuristicCost is v) => 1 else 0\n          : w is World State pair(state\
    \ is s, value is v)\n    H := 0\n    for each pair(s, v) in w of C do\n      \
    \  for each pair(s, v) in w of O do\n            if Cw(s, v) != Ow(s, v)\n   \
    \             H := H + 1\nreturn H\n```\n\n# 21.4 BALANCING THE PLAN\n\nThe second\
    \ core concept of SB-GOAP is balancing, or to be precise, the self-balancing of\
    \ actions. Since the SB-GOAP has a deep connection with A*, by adjusting the cost\
    \ of an action, you can affect the result of the planning process. But why would\
    \ you want to do that? You might want to adjust costs as the “optimal” plan is\
    \ not always “optimal”, especially in terms of game design. As mentioned previously,\
    \ a plan can be calculated in a single frame, but the actual execution (by"
