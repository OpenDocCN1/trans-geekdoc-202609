- pgno: 87
  md: 'You now have a path to follow in world-space that the AI can steer along and
    avoid any collisions, but one final part of the problem remains. No consideration
    has been given to the curvature of the goal path in world-space. Since the AI
    is driving physics-simulated vehicles and not cheating, you need to look along
    this world-space path and limit your chosen speed by the curvature of it. This
    ensures that the AI remains on the path and does not under-steer and collide with
    the obstacles you have worked hard to avoid. To achieve this, you need to build
    speed tables for the vehicle in a test level made up of one giant flat plane.
    For each AI vehicle type, set them to drive at constant speeds with regular intervals,
    e.g., 5, 10, 15 m/s, etc. Then, steer the vehicle fully in one direction at each
    of these speeds and record the radius of the arc they can achieve. As part of
    this test, also record how quickly the car can decelerate so you can accurately
    gauge braking distances. Once you know the curvature of your path in world-space,
    you can look up the speed tables and determine if you need to slow down to achieve
    the path with no under-steering.


    # 7.11 CONCLUSION


    In this chapter, the method used for driving through the busy traffic environment
    in Wheelman at high speed avoiding any collisions has been outlined. How to transform
    world-space roads to a linear path-space and also how to represent obstacles in
    that path-space were shown. It was also shown how you can simulate moving vehicles
    in this space and how to use a set of heuristics to guide the AI in choosing a
    smooth-flowing, organic path similar to how players might drive. How to dissect
    the path-space and find a goal location to drive towards was detailed and how
    also this is translated back into the 3D world.


    The results of this approach worked very well. The AI would drive around with
    very few collisions and look natural whilst doing so. There were up to six AI
    vehicles driving at any given time during the game, and each of these executed
    this cell decomposition method every frame on PC, Xbox 360, and PlayStation 3
    hardware, so it was also very efficient.


    # ACKNOWLEDGEMENTS AND PERMISSIONS


    A special thanks goes out to Ben Marsh who developed some of these ideas and was
    part of many lengthy discussions, and to Shaun Himmerick for allowing us to share
    these ideas and methods in this book.'
