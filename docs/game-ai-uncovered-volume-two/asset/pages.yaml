    +   14. (pickup p intel intel_loc)


    An important characteristic of an AI planning system is that all you have to do
    is describe the world and goals. The AI planning system will reason what needs
    to be done to reach the goals, there is no need to leave breadcrumbs to guide
    the planning system.


    # 18.3.6 PROBLEM GENERATION AND PRUNING


    Care needs to be taken so that you do not create a planning problem that is too
    big. You need to make sure that the branching factor is not too large. In large
    worlds, we do not want to expose all the items, enemies, doors, and the like.
    Use an iterative approach and only expose what is necessary to find a solution.
    To illustrate this in more detail, the previous example is used to show how this
    can be achieved.


    The planner starts at the goal and creates a location from which to pick up the
    intel. Next, it finds a path from the player''s location to the pickup location
    of the intel and checks if player will pass through any doors to get there. If
    so, an object for each door is created, the locations on both sides of each door
    are generated, and it checks what items can open these doors. Next, it iterates
    through all these items and finds a path from the player''s location to these
    items, performs the same checks, and generates the necessary objects. The planner
    finds that the player needs items of type C4 and Key. An item of type C4 is at
    a location, whereas the item of type Key is held by an officer, so you need to
    expose that to the planner as well.


    The number of grounded actions can be pruned by removing all grounded actions
    that are as follows:


    +   1. Do not have any relevant effects. For example, the grounded action (move
    p loc1 loc1) does not change a state when applied to it.

    +   2. Will never contribute to reaching any goals. This is done by labelling
    all grounded actions that can achieve any of the goals or any precondition of
    a grounded action that has been labelled. Any grounded action that is not labelled
    will never contribute to reaching the goals or enable an action that can.'
