    the third one''s score as a baseline.


    In an ideal world, developers would improve every aspect of their creatures until

    they achieved maximum believability; however, as resources are limited, this might

    not always be possible. In this example, this was assumed and, using only the
    tested

    creatures’ scores, developers would concentrate on improving Loncey because (a)
