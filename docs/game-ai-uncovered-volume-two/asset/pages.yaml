  md: '# 11 Utility Systems for High-Level Group Management


    Steve Bilton


    # 11.1 INTRODUCTION


    In the context of decision-making, utility refers to the *value* of a given action.
    As such, a utility system makes decisions by scoring all available actions and
    then executing the action with the greatest utility, producing what is essentially
    the *best* option available. This is a useful and well-documented technique that
    can be used to determine which action to perform at the individual level and can
    often result in emergent group behaviours (Graham, 2013).


    The main advantage of this methodology is that it requires minimal authoring.
    Adding a new action does not usually require knowledge of other actions beyond
    the relative scores they produce, as the control flow between actions does not
    need to be specified. The trade-off is the loss of control that results by offloading
    the work from the developer to the system, it becomes more difficult to enforce
    an action order.


    Instead of relying on the emergence of group behaviour, this chapter will explore
    using utility systems to manage groups of actors directly. This will allow us
    to determine the behaviour that individuals of a group should be exhibiting at
    any given point in time, allowing for more well-defined group behaviour in situations
    where cohesion is important. This high-level behavioural control can be applied
    to a variety of genres and has been proven in both management simulation and stealth
    action titles.


    # 11.2 UTILITY SYSTEMS FOR GROUP MANAGEMENT


    One clear use case for controlling a large group of individual actors that must
    act cohesively is in the management simulation genre. It is common for games of
    this type to involve many tasks that need performing in the world and many actors
    that could perform them, with a system that must allocate actors to tasks in an
    efficient manner.


    In this scenario, the player typically takes a relatively hands-off approach when
    it comes to assigning actors to tasks, although they are likely to want to influence
    decision-making. Rather, they will request tasks to be performed (or construct
    objects that have associated tasks, such as a theme park shop that requires manning)
    and hire actors with varying skills that they wish to perform them. In addition
    to this, actors often have their own desires, such as adequate food and rest –
    things that are'
  merge: -1
  img_proc: true
- pgno: 112
  md: "not beneficial to the player but are required as part of the challenge of creating\
    \ an environment that minimises this wasted time.\n\nThese problems lend themselves\
    \ naturally to a utility system. You can continuously determine the utility between\
    \ each actor and task pairing, and then assign out the pairings in order at the\
    \ end of each evaluation cycle. This provides automated 'ant-farm'-type behaviour\
    \ where the environment requires minimum player oversight, freeing them to make\
    \ more high-level decisions within the game as they are relatively unburdened\
    \ by micro-management.\n\n# 11.3 UTILITY TASKS\n\nA task is defined as a self-contained\
    \ logical construct that is made up of two parts:\n\n+   1. The utility function,\
    \ which takes an actor state and produces a value that is a combination of the\
    \ priority of the task for the current world state and the suitability of the\
    \ actor.\n+   \n+   2. The behaviour of any actor assigned to it, which specifies\
    \ how an actor assigned to the task must complete it. The complexity of the behaviour\
    \ can vary considerably, as it is highly context-dependent, but is typically a\
    \ graph of atomic actions that need to be performed or a behaviour tree.\n\nWhen\
    \ determining a utility function, you must consider not only which tasks are preferable\
    \ to perform over others, but also which individuals are best placed to perform\
    \ them – and the relationship between the two.\n\nThis is highly context-dependent,\
    \ but a starting point is often the distance between the actor and the task. For\
    \ example, you may prefer Task A is completed over Task B all things being equal,\
    \ but Task B may be very close to an actor and Task A very far away.\n\nSimilarly,\
    \ it is often a good idea to encourage tasks whose conditions are more difficult\
    \ to satisfy by giving them higher utility. This not only helps to produce a more\
    \ even spread of executed tasks but also helps ensure that rare tasks are able\
    \ to be executed at all.\n\nLet us take what appears to be a relatively simple\
    \ example, a fire that needs putting out. There are multiple considerations here:\
    \ Do you prefer actors near a fire extinguisher or near the fire? If the latter,\
    \ do you prefer fire extinguishers near the fire or near the actor? What if the\
    \ agent already holds a fire extinguisher? Should you hold a task for every fire\
    \ and assign them out, even if they are in proximity, or should you group them\
    \ together into single tasks, or lower the priority if nearby tasks are already\
    \ assigned to actors? Does the answer to that depend on how far the actors and\
    \ extinguishers are from the fires, whether they are likely to spread, and how\
    \ long an extinguisher can be used before it runs out?\n\nAs you can see, the\
    \ complications can quickly spiral out of control, so it is often wise to start\
    \ with the simplest implementation and see how that feels, rather than trying\
    \ to create an optimal result – more complexity slows evaluation and makes understanding\
    \ the system more difficult for both players and creators. In practice, simpler\
    \ implementations are often sufficient and even preferred."
