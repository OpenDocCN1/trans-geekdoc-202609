- pgno: 1
  md: '# # Game AI Uncovered


    Game AI Uncovered: Volume Two continues the series with the collected wisdom,
    ideas, tricks and cutting-edge techniques from 22 of the top game AI professionals
    and researchers from around the world.


    The techniques discussed in these pages cover the underlying development of a
    wide array of published titles, including The Survivalists, Wheelman, Plants vs.
    Zombies: Battle for Neighborville, Dead Space, Zombie Army 4, Evil Genius 2, Sniper
    Elite 5, Sonic & All-Stars Racing Transformed, DiRT: Showdown, and more.


    Contained within this volume are overviews and insights covering a host of different
    areas within game AI, including generalised planners, player imitation, awareness,
    dynamic behaviour trees, decision-making architectures, agent learning for automated
    playthroughs, utility systems, machine learning for cinematography, directed acyclic
    graphs, environment steering, difficulty scenarios, environmental cues through
    voxels, automated testing approaches, dumbing down your AI, synchronised path
    following, and much more.


    Beginners to the area of game AI, along with professional developers, will find
    a wealth of knowledge that will not only help in the development of your own games
    but also spark ideas for new approaches.


    This volume includes chapters written by Nuno Vicente Barreto, Steve Bilton, Andy
    Brown, Dr Allan Bruce, Richard Bull, Phil Carlisle, Sarah Cook, Michele Condò,
    Steven Dalton, Rodolfo Fava, Jonas Gillberg, Dominik Gotojuch, Dale Green, Tobias
    Karlsson, Jonathan Keslake, Fernando Penousal Machado, Ivan Mateev, Dr Nic Melder,
    Dr Bram Ridder, Paul Roberts, Licínio Roque, and Andrea Schiel.'
  merge: -1
