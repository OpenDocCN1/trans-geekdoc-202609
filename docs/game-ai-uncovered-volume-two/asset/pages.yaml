  md: 'Upon a Mimic Signature being interpreted by an NPC, the information surrounding
    the task must be fed to the behaviour tree that will be used to carry out the
    task. To do so, each Mimic Signature has a set of instructions to perform, which
    are responsible for acquiring the data relative to the completed Mimic Signature
    and feeding it to the behaviour tree’s Blackboard. For example, when the player
    instructs a buddy to chop down trees, the subject (tree) and location of the task
    must be funnelled through the Blackboard to the general-purpose behaviour tree
    responsible for the task in order to restrict the behaviour to a particular object
    type around the location at which the player originally performed the task.


    As mentioned earlier, a Mimic Signature’s subject is optional, allowing Mimic
    Behaviours to not be tied to an object or an item of a specific type. In the example
    shown in Image 3.5, the behaviour uses this in two ways. First, if the item type
    to be gathered in the first stage of the behaviour tree is None, then the Find
    Item behaviour tree node will search for all items on the ground; otherwise, it
    will search for only items of the type specified. Allowing this to be None allows
    the behaviour to operate with no restrictions; in other words, on every single
    item on the ground within the given mimic range, resulting in a quick and easy
    way to clean up a harvested area, or a post-battle scene, into a storage chest.
    Second, and adversely, the second stage of the behaviour tree allows the signature
    to specify a None delivery subject, meaning just the location at which the player
    dropped the item, resulting in a pile of easily accessible items on the ground.


    During the development of these behaviours, the concept of None Subjects resulted
    in a few unforeseen but chuckle-worthy issues. A Mimic Signature and corresponding
    behaviour were created to enable your primate partners to Repair partially destroyed
    objects. The intention was to allow the player and company to quickly put to rights
    their base after a particularly destructive raid or fight with the island’s evil
    inhabitants. The signature consisted of a single step, performing the Repair Action
    on a None subject (meaning any Subject), with the counterpart behaviour tree first
    performing a search for any object that was not at full health, moving the NPC
    to this object and then performing the Repair Action upon it. It worked great,
    although perhaps a little too well as a bug was quickly reported featuring a pair
    of monkeys. The first was doing as instructed by taking his axe to nearby trees
    and chopping them down. Meanwhile, one of their well-meaning siblings, after having
    repaired the partially destroyed walls of an entire base, was counteracting the
    chopping down of a tree by repairing it. Following this revelation, it was decided
    that a restriction was required to alleviate this somewhat fruitless combination,
    done so by creating a Repairable Subject tag, binding this to only the objects
    that should be tended to by a monkey and their Repair tool, and the existing Mimic
    Signature updated to be: Action – Repair, Subject – Repairable.


    By the time all Mimic Signatures were defined, and associated behaviour trees
    implemented, there were in excess of thirty signatures defining bespoke tasks
    but only six different behaviour trees to define the steps required due to the
    way data was fed to them, allowing the behaviour trees to be implemented in a
    generic way. Decisions on which tools could be used to complete these tasks were
    also left open to the player to decide. A monkey could be instructed to break
    rocks with little restriction on the tool equipped, and it might not be wise to
    use a delicate yet expensive'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'sword or a bow and arrow with limited ammunition, to get the job done, but
    if it is what the player wants, then it is what the player gets!


    In order to further reward the player for delegating the time-consuming tasks
    to their helpful gang, a simple system exists that rewards the player for giving
    their monkeys tasks. Upon performing a task, a monkey will acquire experience
    for that type of task, contributing to the level of competency they have for it.
    Each of the five competency levels sees the monkey perform the task both quicker
    and more efficiently. For example, a monkey well versed in breaking resources
    such as trees or rocks will have the damage inflicted upon each strike buffed,
    the delay between strikes reduced and the wear on the item being used lessened.
    A monkey with significant experience of delivering items will be able to store
    more items in their personal inventory and will move faster to items and delivery
    targets. Upon reaching the maximum level, a monkey will be able to perform a task
    multiple times more efficiently than the player.


    # 3.6 ADVANCED MIMICRY


    Given the complexity, or lack thereof, of the mimic system, it was discussed frequently
    how much further it could be taken. The first and most logical suggestion was
    to enable monkeys to perform multiple tasks in sequence rather than limiting them
    to a single task. For example, a monkey chopping down a tree, then mining rock,
    then gathering the resulting wood and stone and taking it to a crafting bench
    to craft a selection of items. Unfortunately, this did not make it into the shipped
    game but is something that would be easy to implement with just a couple of small
    changes. Rather than a monkey exiting their observation state upon observing the
    first task that they can perform, they would stay in observation mode and record
    every task in sequence until the player instructs them to stop observing. They
    would then attempt to perform each of the recorded tasks in the order that they
    were observed, building a sequence of behaviours to be carried out.


    Another wish list feature that did not make it into the shipped game was monkeys
    teaching other monkeys. Again, an easy feature to implement as all that was required
    was the ability for the player to set an observation target rather than it implicitly
    being the player. The actions performed by the monkeys are the same actions as
    those performed by the player, so all emit the same action tags, meaning an observer
    will observe the same actions and subjects no matter which character they are
    observing. Given this general-purpose implementation, it would be possible for
    the player to instruct a monkey to observe another monkey in order to get them
    to perform the same task rather than requiring the player to perform the task
    themselves. This could even be extended to having monkeys observe hostile NPCs
    in order to learn and mimic combat tasks, or to observe ambient, foraging NPCs
    in order to learn and mimic gathering behaviours.


    # 3.7 CONCLUSION


    During the design stages of the mimic feature in The Survivalists, there were
    concerns about how complex the learning logic may be and how difficult it could
    be to define the bespoke steps required to mimic a task. Upon work beginning on
    the'
