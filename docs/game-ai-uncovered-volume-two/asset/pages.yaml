- pgno: 83
  md: 'The cells are subdivided by taking their longest dimension and dividing it,
    ensuring you always make two new quadrilateral cells (or triangles). If you consider
    the light-grey area in Image 7.6, then again in Image 7.7, it shows how that cell
    is sub-divided twice. The light-grey cell is first subdivided into a smaller light-grey
    cell and a mid-grey cell. If you then subdivide the mid-grey cell, you get the
    smaller mid-grey cell and a dark-grey cell. When you evaluate the cost of a given
    cell, you find the minimum value of each heuristic individually for that cell
    and sum them to obtain the total minimum cost. When a cell is subdivided, the
    two new cells are not guaranteed to have the same minimum cost as their parent;
    however, they are guaranteed to never have a lower cost than their parent.


    ![](img/f4a4f6e4de5338a867590c30638990cf_83_0.png)


    IMAGE 7.7 Sub-dividing cells to generate smaller cells.


    # ## 7.9 ADDITIONAL HEURISTICS


    Avoiding collisions is one part of believable driving through the busy streets.
    Another is making the vehicle move smoothly and drive like a playert. To ensure
    this behaviour is achieved, you need to add some weight heuristics to the path-space
    to guide the vehicle. Two such important heuristics are used to ensure that the
    AI chooses flowing paths rather than ones that steer wildly from side to side.
    The first of these is to ensure the AI tries to steer further down the path rather
    than very close to the current location. This is done by adding a gradient starting
    with a high weight at \( y = 0 \) and fades to zero at a given distance along
    the y-axis. This distance varies depending on speed, i.e., the distance is shorter
    for lower speeds as opposed to being longer at higher speeds. The second heuristic
    to apply is to prefer steering in the current direction. Points along the direction
    of current velocity are weighted 0 but as the angle increases away from the velocity,
    the points are weighted higher. These combined heuristics are shown in Image 7.8
    and you can see a ''sweet spot'' with the minimum cost (lightest shade of grey)
    that would be chosen if no other heuristics were considered.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '![](img/f4a4f6e4de5338a867590c30638990cf_84_0.png)


    IMAGE 7.8 Heuristic added to encourage the AI to choose a location not too close
    in front and along the same direction of travel as its current velocity (shown
    by the arrow).


    Several other heuristics can be used to ensure the AI drives organically. These
    will not be discussed in detail, but they include:


    +   • A heuristic to try to encourage the AI to travel within lanes of traffic
    going in the same direction and to discourage the use of lanes in the opposite
    direction. This heuristic is also weighted such that if the AI is going to travel
    in a lane, it prefers the centre of the lane.

    +   • Another heuristic is used to discourage the AI from choosing to drive on
    the medial strip or pavements, and a further weight to discourage travelling beyond
    the pavement.

    +   • A heuristic to discourage driving very close to another vehicle.

    +   • A further heuristic that prefers choosing a goal location for a short time.
    Add the previous frame''s chosen location as a negative weight which gets stronger
    for a short time if rechosen before fading to zero.


    The final heuristic added to the path-space is to aid formation driving. At certain
    points during gameplay, you may want the AI to drive in a formation and use the
    vehicle to ram into the side of the player or remain in a location relative to
    the player so that the player can easily predict their position and ram them back.
    To do this, you apply a negative weight to these areas which the AI will choose
    to go to if there are no obstacles in the way. These are termed repulsors as first
    discussed in the'
