  md: '# 12.4 MOVIE TIMELINES AS SPATIO-TEMPORAL GRAPHS


    There have been previous examples of graph-based structures constructed from Movies.
    An example is the MovieGraphs dataset (Vicol et al., 2018), where a graph was
    constructed to describe key scenes in a variety of movies. A different approach
    is adopted here, by transforming the existing data of the MovieNet dataset into
    a series of spatio-temporal graphs. The general approach of the MovieNet dataset
    is to take each movie and perform a set of individual ML model feature extractions
    on it. So, for instance, applying a human object detector model on each shot to
    extract the bounding box of the actor. The MovieNet data is not supplied in graph
    form, so this must be constructed into a graph representation from the MovieNet
    annotated data. Additional ML models are applied to determine head and body poses
    from the frames supplied in the dataset. The bounding boxes and the body pose
    information are used to determine the PROSE values for things like facing directions
    and distance to the camera.


    One important aspect of any understanding of film is that it has movement, both
    within the view of the camera (actors moving around relative to the camera) and
    the movement of the camera itself. This change needs to be captured in any system
    that seeks to understand the structure of a movie.


    The approach here is to derive a series of graphs, connected in time via a timeline
    such that changes are stored in graph features over time. So, as properties of
    graph nodes (the position of an actor in the frame) change over time, it can be
    encoded to the node that represents the actor. The presence or absence of a node
    depicts that the particular actor or object is not visually present in a scene.


    This culminates in a series of graphs which depict the scene at any given frame,
    constructed by introducing a series of “key” graphs much like keyframes are used
    in animation or keyframes are included in video compression algorithms. The concept
    is to store at some regular interval a full graph and then represent changes in
    between keyframe graphs as simple changes in the timeline. This way you can reconstruct
    the graph for each frame by looking at the previous keyframe graph and then stepping
    through the changes since that frame and modifying the graph with any changes
    until the current frame. For example, adding and removing new nodes and edges,
    property updates on existing nodes, and the like. This way, a relatively sparse
    data structure is maintained but also allows for the capture of fine per-frame
    details as they are considered important.


    The keyframe interval for graph construction is determined by constructing an
    initial full graph-per-frame and then adaptively removing unmodified graph nodes,
    whilst maintaining a maximum distance to a keyframe graph. You can control how
    far each edited graph is from a full keyframe graph, given the volume of graph
    edits in the given frame sequence in the overall timeline. The aim is to reduce
    the duplication inherent in graphs where there are unchanging elements. For example,
    a static object is unlikely to change unless given an impulse via another object.


    The graph frames are stored in the OpenTimelineIO format (http://opentimeline.
    io/), where each shot is stored as a separate clip and each clip has each frame
    within it stored as metadata to the clip in NetworkX format, stored as a json
    object. A clip-per-shot is stored using the shot boundaries previously determined
    using the'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'Movenet pipeline tools. This relies on the PyShotDetect library to detect shot
    boundaries, but the essence is that a number of algorithms are used to determine
    changes in camera/lighting/scene composition. An OpenTimelineIO ‘otio’ file is
    constructed such that each clip in the timeline represents a shot detection boundary,
    this clip is then used to process the contents for the shot. The initial frame
    of each shot is determined to be a keyframe and a NetworkX graph is stored as
    metadata for the clip. This graph is stored as json format data within the metadata
    of the ‘.otio’ file and can be parsed by the NetworkX python graph reading library.


    Each frame, any changes to this graph structure are stored in NetworkX compatible
    json “frames” until a keyframe limit is reached, at which point another whole-graph
    NetworkX structure is stored. In order to make parsing for a series of shots more
    performant, all frames are analysed and stored as a dictionary of entities that
    appear in the series. In this manner, we’re able to runtime cache all important
    features such as actors and simply enable/disable them in scenes where they are
    present.


    Thus, we have a timeline which contains N clips, one per shot. Each shot has a
    keyframe graph as its first frame, then subsequent frames can have either partial
    change list-style graphs, or whole graphs depending on whether they are designated
    as keyframes or not. The graphs themselves can be of arbitrary complexity, which
    depends on the complexity of the cinematography and the purpose of the analysis.


    # 12.4.1 WHAT IS IN A GRAPH?


    An example graph for cinematography might contain elements such as:


    +   • What actors are visible in the scene?

    +       • Where are they in the frame?

    +       • Where are the vertical centre lines of their bounding boxes?

    +       • How far away are they from the camera?

    +       • Which direction are they facing?

    +       • Are they looking towards the camera or at an angle?

    +       • Are they moving, if so, in which direction?

    +   • Are there any props in the scene?

    +       • If so, where are they?

    +   • Are the actors looking at or interacting with the props?

    +   • Are the props moving?


    These values can be presented as a graph encoded as an expansion of a CFG that
    is defined within the PROSE language. To generate the graph, you can use a ML
    model to learn the probabilities of a graph expansion for a given node when a
    set of criteria are presented to construct a scene. This is like the Meta-Sim2
    architecture used for the generation of Unreal Engine driving scenes (Devaranjan
    et al., 2020).


    The probability of any of the PROSE grammar rules being true is a function of
    the context (what is known about the scene, such as how many actors are required,
    or the subject of the scene) and the graph structure previously expanded. In essence,
    you treat the generation as a series of graph expansions, each one adding more
    information to the graph until you reach a terminal where no further expansions
    are possible.'
