    show components unique to a world.


    Since the logical world is the sole authority over movement and collision, it
    is excusable to question the requirement to have the cosmetic entity outlined
    in Image 1.2 feature a collision shape. When a player is moving towards an obstacle
    that they can collide with, it is required that they perform their own collision
    detection within the cosmetic world. This is due to the round-trip time of data
    being sent to and received from the server. Relying on the server''s logical world
    to detect, and then correct a position, will result in several frames of the player
    being within collision as the time taken for the new position to be sent to the
    server; the collision detection to be performed and the resulting correction to
    be sent back to the client is not instantaneous. Rather than constantly walking
    into and being corrected out of collision, it is more robust for collision detection
    to be performed in the cosmetic world. This means the only correction required
    would be an edge case, such as a cosmetic world stopping their player character
    upon detecting collision with an object which has just been destroyed on the server
    and the de-spawn message not yet being received by the client. In this case, the
    server will send a correction with an updated position and velocity at around
    the same time that the de-spawn message is received for the object that was falsely
    collided with. Similar cases exist for interactions with objects, with the visual
    effects (VFX) of the interaction being spawned immediately and only corrected
    if the object can no longer be interacted with. Examples of these interactions
    are, but are not limited to:'
