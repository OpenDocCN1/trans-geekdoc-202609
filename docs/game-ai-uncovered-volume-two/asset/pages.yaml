  md: 'Because the Road IDs are not hashes, you can use them as indexes in an array,
    where lengths[x] is the length of said road. For example, lengths[2] is 2.5. The
    adjacency multimap from earlier will be used, which will be called adjacent. For
    example, adjacent[0] is {1,2,3}. And will be using the topological order contained
    in an array and call that ordered.


    Using the above, you can proceed as follows:


    +   1. Create an array of length ordered.size() called maxLengths and populate
    it with -INF.

    +   2. The longest path to the first node is 0.0, so set maxLengths[ordered[0]]
    to 0.0.

    +   3. For every vertex V in ordered, for every vertex W in adjacent[V] set maxLengths[W]
    to max(maxLengths[W], maxLengths[V] + lengths[W]).


    When step 3 completes, the element in maxLengths[ordered[ordered.size()-1]] will
    be the length of the longest path. The reason why this works is because iterating
    over ordered ensures that the DAG is visited from predecessor towards successor
    and because no element in ordered is before any successive element in the DAG.
    This means that you are always iterating towards the finish line and the max()
    call ensures that longer path lengths are recorded if you had previously come
    from a parallel path.


    You can also find the length of the shortest path with a slight modification:


    +   1. Create an array of length ordered.size() called minLengths and populate
    it with +INF.

    +   2. The shortest path to the first node is 0.0, so set minLengths[ordered[0]]
    to 0.0.

    +   3. For every vertex V in ordered, for every vertex w in adjacent[V] I set
    minLengths[W] to min(minLengths[W], minLengths[V] + lengths[W]).


    When step 3 completes, the element in minLengths[ordered[ordered.size()-1]] will
    be the length of the shortest path.


    Conceptually, to find the actual longest/shortest path (the roads to take), all
    it would take is an extra map from int to int and a modification of the above
    algorithm, but instead of calculating min/max there would be a branch that checks
    if {min/max} Lengths[V] +.


    Lengths[W] is smaller/bigger than the existing value at {min/max}Lengths[W] and
    if it is, the map and the {min/max}Lengths[W] value should be updated.


    When the procedure completes, the {min/max}Lengths container will contain the
    corresponding length values as before, but the new map will contain a chain of
    vertexes/roads taken to reach the finish line, which can be extracted in a manner
    similar to Dijkstra or A* (Cormen, et al., 2009b).


    # 13.6 ALL PATHS


    Having generated the shortest and longest paths, our AI can choose one of two
    paths based on the player''s performance in the game. While this is a good first
    step, this'
