- pgno: 24
  md: '# 1.4 HANDLING PATH INTERRUPTIONS


    An NPC receiving a new path when stationary requires no additional work, but it
    receiving a new path when already following another requires some correction.
    Upon a client receiving a new path when part-way along another means that some
    divergence will be evident, as during the time taken to receive the new path,
    the NPC will have continued along the old path. This is masked by blending from
    the old path onto the new path within a maximum of a fifth of a second. This is
    the only time that desynchronisation between client(s) and server occurs. Image
    1.7 gives an idea of how much a path could diverge under these circumstances.


    ![](img/f4a4f6e4de5338a867590c30638990cf_24_0.png)


    IMAGE 1.7 The diverged path taken when merging from an expired path to a new path.


    # 1.5 CONCLUSION


    While in no way a perfect solution, the decision to share an entire path to be
    followed per NPC proved to be a much more bandwidth-efficient solution than the
    streaming positional data for many NPCs in perpetuity. It also gave the guarantee
    that, in most cases, NPC positions were synchronised between server and client.


    The solution adopted required a little extra work to build and consume a data
    packet per path, per NPC that fully represented their positions for the entirety
    of their movement but saved on the work required to offer client-side prediction
    for NPC movement. This hopefully saved a lot of frustration from players attempting
    to interact with NPCs with locations not quite synchronised with the server, resulting
    in false positive player hits only to be corrected to a no-hit after a few frames.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 2 Going Stateless

    An Evolution of Behaviour

    Trees in Team17''s The

    Survivalists and Beyond


    Steven Dalton


    # 2.1 INTRODUCTION


    During the late stages of development on Team17''s The Survivalists it was decided
    that mobile devices be added as a launch platform alongside PC and consoles. Among
    the many challenges that this lofty goal unearthed was a significantly stricter
    runtime memory limitation, memory that was taken up by a variety of AI systems,
    but none more so than the behaviour tree framework.


    # 2.2 PRUNING THE BEHAVIOUR TREES


    After plenty of profiling and deliberation about what could be saved, where, why
    and how, it was proposed that the existing one instance per non-player character
    (NPC) behaviour tree implementation be investigated first. This was intended to
    allow a single behaviour trees'' instance to be shared between many NPCs, with
    the runtime behaviour tree state moved elsewhere, to be owned by each executor
    of the single behaviour tree instance.


    The reason that behaviour trees were an initial focus was because of the sheer
    amount of memory they consumed during busy gameplay scenes. A typically frantic
    scene in The Survivalists would see a single player, up to twenty companion NPC
    monkeys, a maximum of forty hostile NPCs and several ambient NPCs, such as the
    island''s wildlife, all interacting with each other and their surroundings. This
    eighty-plus strong NPC assembly would see the memory taken by behaviour trees
    alone balloon to a peak of just under 300 MB, a huge chunk of the total 1.8 GB
    capacity on some of the more restricted target devices.


    Another reason to select behaviour trees as one of the first areas to look at
    stemmed from the shared data approach taken, which is described in Chapter 4,
    Dynamic Behaviour Trees: Building for Scalability. This was the approach taken
    to create many of the small behaviour trees used by the majority of NPCs. This
    meant that the above-described scene would see eighty instances of many of the
    same behaviour trees sitting in memory all at once. If it did indeed prove simple
    to reduce this from eighty instances of each behaviour tree to one, then immediate
    improvements would'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'be realised in the region of hundreds of megabytes; a huge contribution to
    the run-time memory curtailment effort.


    After a little prototyping, a solution was arrived at that not only elegantly
    transferred the entire ownership of a behaviour trees'' state to each of the NPCs
    executing it but also proved rather surprising in its simplicity.


    # 2.2.1 Example Behaviour Tree


    Image 2.1 shows a significantly simplified approximation of the root and combat
    behaviour tree shared between all melee NPC archetypes in The Survivalists and
    will be used as an example from which comparisons between stateless and stateful
    implementations can be made.


    ![](img/f4a4f6e4de5338a867590c30638990cf_26_0.png)


    IMAGE 2.1 A simplified behaviour tree demonstrating the basic root and combat
    behaviour used by all melee NPCs in The Survivalists.


    # 2.3 PREPARING FOR STATELESSNESS


    The first consideration for moving to a stateless implementation was that of the
    runtime mutable and immutable states in each of the most common nodes in the existing
    behaviour trees. Each of these node types are described below, along with their
    immutable/mutable states.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 2.3.1 SEQUENCE


    A sequence node features one or more child nodes executed in order until either
    all children return Success, in which case it returns Success, or a single child
    returns Failure, in which case it returns Failure.


    Immutable state:


    +   List of references to child nodes. In the implementation employed in *The
    Survivalists*, this is a list of indices into a parent list containing every node
    owned by the containing behaviour tree shown in Image 2.2.


    ![](img/f4a4f6e4de5338a867590c30638990cf_27_0.png)


    IMAGE 2.2 A representation of how nodes are referenced by their owning behaviour
    tree and by sibling nodes.


    Mutable state:


    +   - The index of the current child being executed.

    +   - The execution state of the current child being executed (Running, Success
    or Failure).


    # 2.3.2 SELECTOR


    A selector node features one or more child nodes executed in order until either
    all children return Failure, in which case it returns Failure, or a single child
    returns Success, in which case it returns Success.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'The only difference between a selector node and a sequence node is the termination
    state; the mutable and immutable states are identical.


    # 2.3.3 PERFORM ACTION


    The Perform Action node is used to request that the NPC in question performs a
    bespoke action using the game''s actor and action system. Actions include Attack,
    Interact, Pick-up item, Drop item and the like with a specific action parameters
    data object specified on the node and passed to the actor to drive the requested
    action. The perform action node can request any type of action and host any type
    of action parameters data.


    Immutable state:


    +   - A reference to the Action Type object, a simple class employed as a tag.

    +   - A reference to the corresponding Action Parameters object.


    Mutable state:


    +   - None.


    # 2.3.4 CONDITION


    A condition node is one that immediately returns Success or Failure based on a
    condition class referenced by the node. Conditions can query any piece of character
    state such as percentage of health remaining, time since spawned, proximity to
    combat target and more. The condition node can host any condition class instance.


    Immutable state:


    +   - A reference to the condition object, a single instance of a class able to
    be shared.


    Mutable state:


    +   - None.


    # 2.3.5 DELAY


    Upon starting, the Delay node will retain focus until a specified duration has
    elapsed, and then return Success.


    Immutable state:


    +   - A float representing the duration for which the delay will be active.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Mutable state:


    +   • A float representing the time elapsed while this node is active.


    # 2.3.6 COOLDOWN


    A cooldown node is used to modify a child node, blocking the child after execution
    until a specified time has elapsed. For example, a 10-second cooldown node modifying
    a perform attack node will immediately return Failure every time the node is attempted
    to be executed for 10 seconds since the last time the perform action node completed
    successfully, meaning it can only be executed at most once every 10 seconds.


    The cooldown node is similar to the delay node in that it hosts a duration that
    is immutable at runtime and an elapsed time value that changes when the node is
    active. The only difference is that a cooldown node counts down while other parts
    of the tree are active, whereas the delay counts down only when active itself.
    It is therefore much more likely for multiple cooldown nodes to be counting down
    at the same time than it is for multiple delays to be active.


    It should be noted that it is only less likely for multiple delay nodes to be
    active at once, not impossible. Upon introducing the parallel node, a node that
    allows multiple children to be executed at once, it was made possible for multiple
    delay nodes to be active at once, at most one for each child of a parent parallel
    node. This became a major factor when discussing where the mutable state for the
    delay and cooldown nodes should be moved to, a consideration that will be discussed
    in detail later in this chapter.


    # 2.3.7 SUBTREE


    A subtree node is used to reference and pass control to another behaviour tree,
    often used to promote the reuse of smaller, encapsulated behaviour trees with
    a single purpose that can be reused in multiple places, and to make working with
    and editing trees more manageable.


    # Immutable state:


    +   • The behaviour tree to execute.


    # Mutable state:


    +   • None


    As can be seen above, some of the most used nodes were implicitly dealt with as
    they had no state to modify at runtime, these nodes being the perform action,
    condition and subtree nodes. Not a bad position to start in, but not an outright
    win as where to move the mutable state of the other nodes was still in question.'
  merge: -1
  img_proc: true
- pgno: 30
  md: "# 2.4 MOVING THE MUTABLE STATE\n\nSince the behaviour tree framework was already\
    \ making use of a blackboard per NPC to store various pieces of NPC and world\
    \ state to be accessed by behaviour trees, it was initially thought that all states\
    \ could simply be pushed to the blackboard. This only proved to be unworkable\
    \ once it was realised how many bespoke blackboard keys would have to be generated,\
    \ either automatically or by those working with the behaviour trees, to handle\
    \ all mutable states. For example, if you assume that a single NPC would make\
    \ use of ten behaviour trees in total, each with an average of ten composite nodes\
    \ (sequence, selector, etc.). It would require 100 unique blackboard keys to be\
    \ generated to track the 100 composite nodes’ mutable states that determine their\
    \ current child to be executed. While by no means impossible, this created an\
    \ additional task in which unique blackboard keys must either be generated automatically\
    \ or must be vetted for duplication after being created manually. The act of manually\
    \ creating and managing this number of unique blackboard keys would have added\
    \ a layer of complexity and concern to the creation and editing of behaviour trees\
    \ that could likely be avoided.\n\n# 2.4.1 REMOVING THE MUTABLE STATE\n\nRather\
    \ than automatically generating a lot of the blackboard keys and pushing a swathe\
    \ of additional data to the blackboard, it was investigated whether this step\
    \ could be removed entirely. Instead, a single structure containing a reference\
    \ to the current executing behaviour tree, the index of the current executing\
    \ node and the executing node’s execution status (Running, Failed or Succeeded)\
    \ was created and maintained, as a behaviour tree was executed. The composite\
    \ nodes that once relied upon an index into their list of children to be maintained\
    \ could instead infer what to do next upon a child node terminating by querying\
    \ this execution state metadata object, as defined in Code Listing 2.1.\n\n```\n\
    Code Listing 2.1: A very simple data structure containing\nall data required to\
    \ represent the current state and\ninfer how to progress a behaviour tree.\n\n\
    public enum ExecutionStatus\n{\n    Running, Succeeded, Failed\n}\n\npublic struct\
    \ ExecutionState\n{\n    public BehaviourTree _tree;\n    public int _nodeIndex;\n\
    \    public ExecutionStatus _executionStatus;\n}\n```\n\nImages 2.3–2.6 show how\
    \ this simple data structure representing a behaviour tree’s state changes when\
    \ moving between nodes. Rather than relying upon mutable states within the composite\
    \ nodes, it can simply be inferred what to do next. If the child of a sequence\
    \ node completes successfully, then it should simply move to the next child, the\
    \ index of which can be found by finding the failed nodes’ index in the list of\
    \ children, and selecting the next. If the child fails, then the parent sequence\
    \ node also fails."
  merge: -1
  img_proc: true
