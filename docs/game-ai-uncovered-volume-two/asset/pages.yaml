    located. This notation can be simplified by utilising the supertype Locatable:


    +   • (at Locatable Location)


    To open a door, you need to define what keys a door needs to be opened. A location
    is included in this predicate as well, to encode where an actor needs to stand
    to open the door with a key. This allows a door to be set up such that different
    keys could be used at different locations:


    +   • (requires Door Key Location)'
