  md: "Checking the distance between these gives:\n\n$d_{01} = |P_0 \\cdot P_1| =\
    \ 3$ is the distance from the agent to the closed tree in the wood.\n$d_{02} =\
    \ |P_0 \\cdot P_2| = 6$ is the distance from the agent to the forge.\n\nYou can\
    \ then use any sort of algorithm you want to get a normalised value between 0\
    \ and 1. In this case, using a SoftMax function and passing in 3 and 6, you get:\n\
    \\(\\sigma(d)_i = \\{0.04742, 0.9525\\}\\).\n\nYou can use these two values as\
    \ temporary multipliers without passing anything from memory, since it is a “one\
    \ shot update based on distance”, giving the following:\n\n“Work Wood” action\
    \ cost updated to = 0.04742 * 5 + 1 = 1.2371\n“Smelt Ore” action cost updated\
    \ to = 0.9525 * 5 + 1 = 5.7625\n\nIf you run the same plan with these two actions\
    \ having the costs updated, you will have the following result: {Mine Ore, Chop\
    \ Tree, Work Wood, Smelt Ore, Create Axe, Sell Axe}, which is a believable way\
    \ to deal with the plan in a different spatial context.\n\nThere is no difference\
    \ between the logic just described and for balancing. Everything is dependent\
    \ on the type of game, the design, the implementation, and many other factors.\
    \ Compared to the first core concept of SB-GOAP, which can be any well-defined\
    \ path search algorithm, the second core concept (balancing) can be whatever implementation\
    \ works – there is no strict approach. The only requirement is that it follows\
    \ these rules:\n\n+   1. It needs to be stored as shown in Table 21.1. It does\
    \ not need a data storage table strictly speaking as shown, but it needs a place\
    \ where it can be kept. This is because (in the case of balancing due to external\
    \ factors, during the execution of the actions of the plan), the multiplier must\
    \ be updated over time.\n+   \n+   2. It needs a way to bring back the multiplier\
    \ to 0 over time. This can be done after every plan issued if a multiplier does\
    \ not equal zero, by just dropping it by a constant value or by a result of a\
    \ decay function to reset to zero after some time has passed.\n+   \n+   3. The\
    \ multiplier should be between 0 and 1 to have more control over the hitch cost,\
    \ but the implementation can also decide to not clamp it. If this is the case,\
    \ the “hitch” cost will have a value more than its maximum value.\n\n# 21.5 INTERRUPTIONS\n\
    \nKeeping with the same example as previously described, the agent is concocting\
