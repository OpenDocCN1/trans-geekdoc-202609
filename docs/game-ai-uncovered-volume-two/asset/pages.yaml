- pgno: 49
  md: 'data contained which parent tree to use along with all relevant data for an
    NPC’s behaviour. This is shown in Image 4.5.


    ![](img/f4a4f6e4de5338a867590c30638990cf_49_0.png)


    IMAGE 4.5 Example Behaviour Tree Data (BTData) asset.


    Each NPC was guaranteed to have a unique BTData asset, and therefore the parent
    tree dynamic behaviour tree nodes were written to look up the asset associated
    with the NPC they were operating on and pull out the graph they were supposed
