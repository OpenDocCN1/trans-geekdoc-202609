- pgno: 113
  md: 'Care should also be taken to ensure it makes sense to create a task for a behaviour.
    While it can be very tempting to put as much logic under the same system as possible,
    using it to add a task that a single actor is required to perform immediately
    (with higher priority than any ‘normal’ task in the utility system) results in
    slower reactions and needless additional evaluation time. For example, tasks such
    as ‘run away from grenade’ or ‘move immediately to a point requested by the player’
    should usually be handled separately, or, at least, the system should treat them
    differently for faster response times.


    # 11.3.1 Multi-Actor Tasks


    It is possible to expand tasks further, such as a task that requires multiple
    actors to complete, where each role available to an actor may be required or optional.
    A simple example of this would be unloading a truck: A required role could be
    the actual unloading, with an optional role for conversing with the unloader.


    Despite the more expensive evaluation required due to increased combinations,
    the process is the same as with a single-actor task. You are simply testing every
    actor against every role within a task and scoring it accordingly. The main change
    to the assignment algorithm is when it comes to tasks that have multiple required
    roles, as you must ensure all can be filled before assigning out any individual
    actor. This is often a worthwhile addition for relatively little effort, as whether
    a task has multiple roles or not is entirely at the discretion of the task writer.


    This added complexity allows us to use the system for further applications, such
    as enemy tactical behaviour in shooters. It can be used for both high-level core
    behavioural group management (such as which members of a group to advance on the
    player position and when they should do so) and short-lived gameplay moments like
    the Systemic Scripts created for Splinter Cell: Blacklist at Ubisoft Toronto (Walsh,
    2014).


    Creating tasks that involve communication and cohesion between groups of actors
    is nicely encapsulated in the system, as all the information necessary for managing
    such coordination is within the task. It allows for actor relationships to be
    clearly defined for the duration of the task, so group members can be aware of
    each other and what they are (or should be) doing, branching as required to handle
    player interaction, bringing in new members as required, and ejecting members
    as they become untenable.


    Creating visible (and audible) group behaviours such as this is a highly effective
    way of making actors appear coordinated, as players who see cohesive behaviour
    are inclined to believe it happens more often than it actually does. Of course,
    that is not to say you cannot have tasks that only require a single actor in a
    tactical shooter, such as manning a searchlight or repairing a radio – but the
    addition of multiple actors allows for many more options, and to keep the various
    uses under a single umbrella system.'
