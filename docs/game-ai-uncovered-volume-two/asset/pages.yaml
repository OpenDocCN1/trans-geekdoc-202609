- pgno: 10
  md: '# Editor


    **Paul Roberts** is the Technical Director of the independent game studio Grinning
    Cat. Prior to this, he worked in a variety of Principal / Lead AI Programmer roles
    for a range of studios in the UK including Sumo Digital, Team17, Traveller''s
    Tales, Activision, and some smaller indie studios. For several years, Paul also
    led the Games Programming department at Staffordshire University, where he taught
    Game AI and programming principles. He has a Master''s degree in Computer Science
    with Artificial Intelligence, which focused on pathfinding, the development of
    the DRS algorithm and ways to test the believability of generated paths. Paul
    has written a number of books, some fiction, others academic, the latest of which
    is _Artificial Intelligence in Games_ published by CRC Press in 2022 and is also
    the editor for this Game AI Uncovered series.'
