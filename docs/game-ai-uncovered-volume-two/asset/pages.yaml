- pgno: 80
  md: '# ## 7.6 NON-DETERMINISTIC SIMULATION


    The steps above detail how you simulate the traffic in a deterministic manner.
    Players and other HSVD AI are non-deterministic, so you must take a slightly different
    approach to simulate them. Since these vehicles are likely to deviate over the
    time, it would take to collide with them, their simulation does not need to be
    as accurate. The same collision weight calculations are used based on the resultant
    speeds after the collision, but since the vehicles are travelling at similar velocities,
    the weights are generally much smaller. The path of non-deterministic vehicles
    is not well known; therefore, it is simply assumed they are travelling in a straight
    line at their current velocity. As this simulation is less accurate, you do not
    place a full obstacle into the path-space as with deterministic obstacles. Instead,
    you add a repuslor which will be discussed later.


    # ## 7.7 SUB-DIVIDING OBSTACLES INTO CELLS


    Once you have the obstacles mapped into path-space, you need to determine a method
    to analyse the problem space and calculate a preferred position to drive towards.
    To do this, you need to break the problem space down into quadrilaterals using
    the boundaries of all obstacles, and taking the current AI vehicle location as
    the source, project straight lines through each vertex of each obstacle.You also
    need to break down the space by projecting vertical and horizontal lines through
    each edge of the obstacle. Each of these quadrilaterals is referred to as a cell.
    Image 7.5 shows an example of how the cells are generated around a single obstacle.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '![](img/f4a4f6e4de5338a867590c30638990cf_81_0.png)


    **IMAGE 7.5** Basic problem space showing one obstacle and how the world is subdivided
    around the obstacle into cells.


    The goal is to find a location in this 2D path-space which minimises the cost
    of a set of heuristics. The only heuristic discussed so far is the obstacle weight.
    Additional heuristics that were applied to achieve smooth, organic driving are
    discussed later.


    The approximation for the path the AI will choose to take is to drive in path-space
    from the current location to a given single point and then continue to drive parallel
    with the road from there on. Image 7.6 shows such a goal path and shows how you
    start to score the cells.'
