- pgno: 132
  md: 'quickly becomes a problem in more intricate racetracks with multiple junctions.
    The AI will take one of the two paths, ignoring the rest. One approach to improving
    this would be the enumerate all of the possible paths and give the designers the
    ability to vary the choices based on how behind/ahead the player is.


    The technique outlined in finding the shortest/longest path is extremely versatile
    as it can be applied to other types of problems on a DAG and will be leaned on
    for the enumeration problem as well.


    The first thing you need to determine is how many paths in total there are in
    the racetrack. The same technique will be applied but with some modifications.
    Instead of the lengths, how many times the current road was visited will be accumulated
    with how many times the successor has been visited so far:


    +   1. Create an array of length ordered.size() called numPaths and populate it
    with 0.

    +   2. The number of paths through the first road is 1, so set numPaths[ordered[0]]
    to 1.

    +   3. For every vertex V in ordered, for every vertex W in adjacent[V] I set
    numPaths[W] = numPaths[W] + numPaths[V].


    The addition in step 3 is the key component. As the iteration progresses through
    the numPaths array, adding the current vertex''s value to the adjacent vertexes
    means that parallel path''s counts will get propagated and then get added together
    when two parallel beams of paths merge after a split. When the procedure finishes,
    numPaths[ordered[ordered.size()-1]] will contain the total number of paths from
    the start vertex to the final vertex and the number of paths in the entire DAG
    in total.


    Finding the total number of paths (three) allows us to enumerate all the paths.
    You can pre-allocate an array of three empty arrays and use the topological sort
    to implement the following scheme:


    +   1. Every path starts at ordered[0], so place ordered[0] in all three arrays;

    +   2. For each vertex V in ordered:

    +      a. Consecutively add every vertex W from adjacent[V] to every array that
    finishes with V.

    +      b. Sort the array of arrays by the last element of each array topologically.


    At the end of the scheme, you will have a linear path in each array. You can then
    run over every array or path in the array of arrays and use the lengths data from
    earlier to calculate the lengths of each path. As a finishing touch, you can sort
    the array of arrays by path length which might make querying a bit easier.


    # 13.7 CONCLUSION


    This chapter presented some key concepts of DAGs and culminated in an applicable
    method which combines different aspects of the key concepts. While the overall
    theme was to do with racetracks, the concepts directly apply to other areas like'
