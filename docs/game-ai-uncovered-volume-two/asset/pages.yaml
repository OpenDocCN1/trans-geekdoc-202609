  md: 'following a failure of learning logic. Performance testing is structured to
    support multiple stability and safety tests, based on the concept of Lyapunov
    design methods for safety (Chow et al., 2018), instead of limiting it to a single-time
    response control test, as was the case in the original proposal. Any condition
    expected to invoke ad hoc fallback can be incorporated into the performance safety
    controller logic.


    # 10.3.4 SMALL-SCALE LEARNING


    Each learning subtree may operate independently, as an individual instance of
    learning logic, contained within its learning node. It is up to a human expert
    to assign the desired learning context to each subtree, in accordance with context-guided
    structuring of the BT. This procedure, inspired by automated task decomposition
    research (Justesen et al., 2020), should yield smaller and more specialised learning
    models, departing from monolithic model approaches. Benefits include increased
    modularity and design control, as well as a potential increase in flexibility
    of training and a decrease in its costs.


    # 10.4 CONTEXT-GUIDED AGENT DEPLOYMENT


    # 10.4.1 OVERVIEW


    The deployment of a context-guided agent model instance is an iterative process
    of development-evaluation cycles, structured using the following steps, whose
    flow is depicted in Image 10.3:'
