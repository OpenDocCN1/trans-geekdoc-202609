    # 18.3 A WORKED EXAMPLE


    This example will use a domain for a Sniper Elite-like game, where the player
    needs to acquire special items, kill enemies, and eventually reach a location
    to exfiltrate.


    # 18.3.1 TYPES


    The types in this domain are:


    +   • Locatable – the supertype of:

    +     • Item – That might be necessary to collect or to open Doors with, and

    +     • Actor – the supertype of: Player and Enemy.

    +   • Location – A position in the world.

    +   • Door – A door obstacle that might need to be interacted with to proceed.


    # 18.3.2 PREDICATES


