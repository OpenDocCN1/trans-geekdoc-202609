    # 18.4 EXECUTION


    Now, with an understanding of how to create a domain, planning problems, and how
    AI planning works, the framework that has been used for automated testing on Zombie
    Army 4, Evil Genius2, and Sniper Elite 5 will be explained. The overall framework
    is depicted in Image 18.4.


    ![](img/f4a4f6e4de5338a867590c30638990cf_174_0.png)


    IMAGE 18.4 Execution framework.


    The driving component is the execution monitor. When the game is running, it will
    assess the current game state and use the predefined domain to create an AI planning
    problem. How this is handled is game-specific for example Zombie Army 4 needed
    a very different problem-generation algorithm than Evil Genius 2 did. The AI planning
    system is invoked once a problem has been generated. If a solution is found, then
    the execution monitor will dispatch one action at a time to the player. The player
    uses a controller to invoke an AI system to execute this action. After the action
    has been executed, the system will return whether it succeeded or failed to execute
    the action. If the action is successful, then the next action in the sequence
    is dispatched. When all actions have been executed, or when an action fails to
    excute, the execution monitor reassesses the current game state and creates a
    new AI planning problem to be solved.


    One benefit of this architecture is that the AI planning system takes care of
    most of the complexity (causal reasoning, making sure enough resources are available
    when it comes to executing an action, and the like), which leaves the execution
    behaviours relatively simple.


    The BTs used in Zombie Army 4, Evil Genius 2, and Sniper Elite 5 never had more
    than three nodes. However, it is important to make the systems that execute actions
    robust. If the execution of actions is brittle, then the system will spend most
    of the time replanning. For example, the move behaviour in Zombie Army 4 and Sniper'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'Elite 5 has combat capabilities to destroy enemies that got in the way by performing
    melee attacks.


    # 18.5 CONCLUSION


    This chapter described a novel automated testing framework that has been successful
    in completing the games: Zombie Army 4, Evil Genius 2, and Sniper Elite 5. An
    actual player is mimicked as closely as possible by making the executing behaviours
    set the key, mouse, and/or controller inputs. For these games, the only cheat
    used was invulnerability, which is common for automated testing purposes. Due
    to its ability to complete entire games, it has great code coverage and was able
    to find a good number of bugs. Furthermore, it has helped developers to find bugs
    such as out-of-world issues and soft locks. It has also helped designers find
    issues with the game design. For example, in Evil Genius 2, this system turned
    out to be a great tool to fine-tune and find bugs in the tutorial section. It
    even prompted the designers to change some aspects of the tutorial.


    The overall planning time was usually a few milliseconds and took around 25MiB
    for Evil Genius 2. The longest planning time was 1.5 seconds, which was on Sniper
    Elite 5. The highest memory usage was 180MiB on Evil Genius 2 for problems that
    could not find a solution with 1,000 explored nodes, which was the limit imposed
    before abandoning planning.


    The time it took for this system to play through a mission in Zombie Army 4 and
    Sniper Elite 5 ranged between 20 minutes to an hour. An Evil Genius 2 campaign
    took between 64 and 75 hours, depending on which genius was picked.


    While this framework was used to perform automated testing with great success,
    it is not limited to that role. It can be used to create more intelligent non-player
    characters that are not just reactive but deliberate about how to achieve future
    goals. This enables designers to create more believable environments where non-player
    characters do not just follow scripted behaviour, or only react to what the player
    is doing, but have goals that they can actively pursue. Other applications include
    multi-agent storytelling and making a game more accessible by playing part of
    a game autonomously or guiding a player through a game.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# 19 Dumbing Down AI

    The Art of Making

    Intelligence Stupid

    Sarah Cook


    # 19.1 INTRODUCTION


    Every programmer wants to make their artificial intelligence (AI) perfect, responding
    to events in the way we expect a human to, but this usually results in a game
    where the player can never win. So how can we make the AI less intelligent without
    it looking unconvincing? This chapter looks at some of the approaches used in
    real games, and how to use them successfully in yours.


    Establishing how intelligent an AI should be is an important step in this process,
    and this chapter briefly discusses some of the salient considerations for determining
    the level required. Next, it gives some tips on which areas are likely candidates
    for decreasing the skill of your AI. It then moves on to looking at common methods
    for reducing the intelligence of non-player characters (NPCs) such as randomisation,
    encouraging movement, and counter-intuitive responses. Finally, it gives examples
    of how smoke and mirrors can make these measures more believable.


    # 19.2 DETERMINING HOW INTELLIGENT YOUR AI SHOULD BE


    The first step in dumbing down your AI is to determine how intelligent your AI
    should be. This can be affected by several different considerations, such as the
    role of the AI, the intended players, and what you can sensibly vary. In general,
    you need to answer five main questions:


    # 19.2.1 QUESTION 1: WHAT IS THE FORMAT OF YOUR GAME?


    Is it turn-based, a shooter, or a simulation? The more immersive and realistic
    your game, the more intelligent your AI is going to need to be.


    # 19.2.2 QUESTION 2: WHAT IS THE ROLE OF AI IN YOUR GAME?


    This is likely to be determined by the type of game you are developing, although
    there are some overlaps. Different AI roles can suggest options for dumbing them
    down (these will be discussed in more detail later in the chapter), as well as
    indicating how stupid you can make them.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'Do the AI agents attack the player? What form do these attacks take? Do they
    have weapons such as guns and other projectiles? Are they restricted to melee
    attacks? Do attacks vary between agents? In much the same way as animals that
    use tools are perceived to be more intelligent, so are agents with weapons when
    compared to those without, but any form of AI attack can have its effectiveness
    varied to lower its skill level.


    Are the agents trying to beat the player in another way? Are they restricted to
    simple interactions with the player, or are they there just to be killed? AI designed
    to outmanoeuvre the player, such as reaching a target destination first, blocking
    player movement, or stealing items from the player, would be perceived as more
    intelligent than those limited to simple behaviours such as running away.


    Are they supporting characters? Is your AI a friend rather than a foe, who provides
    information, objectives, and items to the player? The need and options for dumbing
    down AI in this case are smaller and the variations are likely to rely on the
    extent of the information made available or the usefulness of the items.


    Alternatively, are your agents simulated AI versions of teammates, designed to
    mimic the actions and responses of human players? In this case, you can consider
    them in the same way as NPC enemies, as only their targets vary.


    Do different types of AI have different roles? For example, do you have cannon
    fodder agents that would be expected to be dumb combined with bosses that have
    more refined behaviour? If so, each type of agent should be considered separately,
    and their skill levels compared to achieve the desired effect.


    # ## 19.2.3 Question 3: WHAT LEVEL OF PLAYER IS YOUR GAME AIMED AT?


    Understanding the players that you are trying to reach is critical in determining
    how intelligent your AI really need to be. In general, AI aimed at casual gamers
    can be a lot more stupid than AI aimed at more serious players, as casual gamers
    tend to be a lot more forgiving than hardcore ones. For the casual market, you
    would also expect a lower player skill level, so they will need more help to beat
    the AI.


    In addition, you need to consider player expectations. More realistic game environments
    will encourage players to expect more realistic AI behaviours. Humanoid AI are
    usually assumed to be more intelligent than non-humanoid, so give thought to what
    the player will expect from the type of AI you have chosen.


    Do your research and look at what other games do. Remember to consider the type
    and target audience when choosing games to review.


    # ## 19.2.4 Question 4: WHAT VARIABLES CAN YOU CHANGE?


    What attributes affect the skill levels of your agents? This will normally be
    decided by the role of your AI, so consider this when choosing variables that
    you would like to vary. There is no point considering options that are not relevant
    to your chosen game type, such as projectile spread, for games that have only
    melee attacks, or route variation where only one route is possible.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'Having lots of attributes to choose from sounds like it would be advantageous,
    but more often than not you will find that only a handful of variables will give
    you more than enough flexibility.


    Could you completely disable part of the AI, rather than adjusting values? It
    is going to take time to understand and balance the AI data, so keep the variables
    independent where possible, and only change one variable at a time.


    # 19.2.5 SHOULD THE AI HAVE VARIABLE SKILL LEVELS DEPENDENT ON THE DIFFICULTY
    SETTINGS?


    If your game has multiple difficulty settings, should this affect the AI? If so,
    you will need to define the minimum and maximum skill of the AI, and which attributes
    can be varied to change this. Do not be tempted to change all the possible variables
    for all levels, if only changing one or two would work equally well.


    There are alternatives to varying AI skill levels to affect the difficulty. For
    example, increasing the number of agents, or replacing existing agents with their
    more intelligent counterparts, or varying the environment.


    How far you can dumb down the AI is determined by their believability. When do
    they stop being convincing? If your agents are not believable there will be an
    impact on the playability of the game, but it can be useful to find that point.
    This can be a very fine line, so be prepared to spend some time working out what
    is, and what is not, convincing. However, remember that believability is subjective,
    so it is likely to vary between players. Some players will always say that the
    AI is stupid, so make sure you get multiple opinions, and try to get them to explain
    their decision.


    # 19.3 METHODS FOR REDUCING AI SKILL


    Having established how intelligent your agents need to be, the next stage is to
    consider which approaches are the most appropriate for reducing the AI skill level.
    Again, the answers to the previous five questions will give you an idea of the
    available options, with different formats and AI roles having the biggest influence.
    In the majority of cases, skill variation will depend on some kind of randomisation,
    as is often the case with AI behaviour in general.


    The methods for reducing AI skill mostly fall into four categories:


    # 19.3.1 CATEGORY 1: ROUTE VARIATION


    Randomisation of the target destination or variation of the route itself can be
    used to vary how fast an AI can reach a destination. The purpose here is to allow
    the player to reach the goal first. Also, the AI can deviate from the ideal line
    in driving games, bringing an agent into attack range, or determine if an agent
    successfully intercepts the player to attack.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# 19.3.2 CATEGORY 2: RESTRICTING AI KNOWLEDGE


    By its very nature, a game will have access to all of the information all of the
    time, from player location to available resources, and even the results of randomised
    equations. Should the AI have access to all this information? At the opposite
    end of the scale, you could make the AI blind and deaf, with no access to the
    player and world information to make intelligent decisions.


    Obviously, neither of these approaches will make AI believable, so the trick is
    to find a reasonable level between the two. In addition, the passing of knowledge
    between AI, known as propagation, can also be controlled. Finding the correct
    balance for this can be difficult, but limiting what the AI knows about the player
    and the world is a must.


    # 19.3.3 CATEGORY 3: COUNTER-INTUITIVE BEHAVIOUR


    Counter-intuitive behaviour is where the AI does something substantially different
    to what would be expected of a human player. This can take many forms, from encouraging
    agents to move regardless of threat level or location, or searching for the player,
    to increased messaging of intentions. For example, agents that move out of cover
    only a short time after being attacked or the use of animations to telegraph an
    agent''s attack before they happen.


    # 19.3.4 CATEGORY 4: VARYING THE EFFECTIVENESS OF ATTACKS


    The AI should be prevented from delivering attacks with pinpoint accuracy every
    time. In many ways, this approach is related to the level of knowledge made available
    to the AI. Knowing the player''s location even when they are not visible leads
    to levels of attack accuracy above what would be believable, as does the ability
    of an agent to land a headshot every time. As with counterintuitive behaviour,
    there are many different approaches to reducing the effectiveness of attacks,
    from projectile spread and intentional misses to limiting player''s position prediction
    and targeting.


    Each of the methods described can be used individually or combined, although the
    specifics of how they are applied relies on factors such as game format and AI
    role. Route variation and restricting AI knowledge are common across many game
    types and genres, but even these will need to be adapted to the individual AI
    types and environments.


    Turn-based games, such as those where agents seek to take over a map, usually
    have more basic AI. This therefore offers fewer options when it comes to dumbing
    them down, but route variation and restricting AI knowledge are two approaches
    that can be used. This might include limiting information on player''s position,
    varying how effective attacks are using a randomised outcome, and changing routes
    to determine which areas of the map are uncovered over time.


    As the game environment becomes more realistic, and the roles of AI become more
    complex, the options for reducing skill level increase. In driving games, the
    AI could have inbuilt slowdowns and randomised crashes. Similarly, capture-the-flag-based
    games would rely heavily on route variation but could also limit the amount of
    player information available to effectively mask the player''s position.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Games requiring highly complex NPCs, such as those where the AI can attack
    the player with guns, give the highest number of possible approaches. Suggestions
    might be to restrict information on the player location and inventory, projectile
    spread, encouraging movement, and randomisation of routes between locations. These
    are only a small proportion of those which may be appropriate, and there are many
    other possible combinations, some of which will be discussed in more detail later
    in the chapter.


    Whatever the format and style of your game, it is important to remember to keep
    it simple wherever possible. With a huge number of possible approaches and combinations,
    it is advisable to start small with just one or two that are the most applicable.
    You can include more reductions in skill as you go, but understand why you are
    adding them, and remove any that are no longer in use.


    # ## 19.4 COMMON APPROACHES TO DUMBING DOWN NPCs WHO ATTACK THE PLAYER


    With many different options available, this section will look in more detail at
    one example – Humanoid AI, in realistic environments, who attack the player with
    weapons such as guns. This example has been chosen because it gives us many approaches
    to discuss, but the individual methods and combinations outlined are only a small
    number of the options available to reduce the AI''s skill level. Despite this,
    agents in such a scenario can be difficult to balance, as there is a fine line
    between them being believable to the player and just looking dumb.


    The most obvious place to start is by limiting the amount of player information
    made available to the AI, as this will also affect other aspects such as route
    variation and attack effectiveness. The game will always know the location of
    the player, and all information pertaining to inventory and the like, but you
    can restrict how much of this you make available to the AI.


    # ### 19.4.1 AI AWARENESS


    First, you need to decide a sensible range at which the NPC should be able to
    see or hear the player. In reality, the majority of AI systems rely mostly on
    sound to convey information, due to the expensive overhead of using line-of-sight
    tests, so most reactions will be triggered by this alone. This can also be used
    to our advantage, as a specific destination becomes less obvious compared to a
    general direction.


    Another consideration is how this distance affects weapon usage? For example,
    the firing of a gun would be heard much further away than a footstep, and the
    use of remote sounds such as explosives can be used to feed the AI false information.


    # ### 19.4.2 AI MEMORY


    How fast should the AI forget about player info? This is regularly controlled
    by cooldown timers, which makes it an easy way of adjusting AI behaviour. However,
    this can be difficult to balance and still have your NPCs believable. Typically
    using'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'times equivalent to those of a player prove to be too long, keeping the AI
    in cover or searching for much longer than feels appropriate, but decaying knowledge
    too quickly will make them appear stupid and unrealistic.


    # 19.4.3 World Knowledge


    Another thing to consider is how much game information should be made available
    to the AI? Should they just be informed of player location, or is passing on knowledge
    of the inventory they carry important too? Will this change over the course of
    the game, or be gained gradually as they encounter the player more frequently?
    In many cases purely knowing where the player is at any given time, possibly along
    with their movement speed and direction, should suffice.


    # 19.4.4 Shared AI Knowledge


    Propagation is the passing of knowledge from one AI to another, which can be a
    powerful tool. However, careful thought should go into what information is propagated,
    at what distance, and how fast. Not enough and the AI looks unresponsive, too
    much and the whole map suddenly knows the player''s location. This leads to another
    method for dumbing down AI skills. By reducing this passage of knowledge, or restricting
    its type, less information is known by the AI and they cannot respond to what
    they don''t know.


    # 19.4.5 Counter-Intuitive Responses


    Encouraging movement, for instance forcing an agent out of cover after a player
    attack, is a common form of counterintuitive behaviour employed for this type
    of game. Although it would be odd for NPCs not to hide for at least some time
    after being shot at or otherwise attacked, AI hiding behind cover is virtually
    impossible to shoot, so you need them to move regularly. This does not necessarily
    have to involve moving agents to completely different locations repeatedly but
    may use smaller movements such as peeking out to give the player more chance for
    an attack. Rather than immediately switching back to their prior behaviour, a
    de-escalation, first to moving between cover locations is likely to be more convincing.
    Using timers and randomisation to encourage movement provides a way to balance
    the effects.


    Moving towards threatening sounds rather than away from them is another form of
    counterintuitive behaviour that is regularly used in these situations. A good
    example of this is with search behaviours where agents can be seen scouring an
    area, trying to pinpoint the exact location of the sound that was heard. Although
    this may be expected in certain circumstances, such as the incidental noise made
    by player movement, it can be used widely to dumb down the AI. Searching can be
    used to lure AI into a trap, or to distract them from the players themselves,
    which makes it a powerful tool for many situations, as well as its use in reducing
    AI skill level. In addition, allowing de-escalation from defensive behaviour to
    searching allows NPCs to wander into player range without it looking like they
    were intentionally sent to be killed.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# ## 19.4.6 ROUTE VARIATION


    Route variation is widely used in games to make AI movement more believable. By
    extending and exaggerating this behaviour, it can also be employed to make NPCs
    appear less intelligent.


    By varying routes, an agent can be encouraged to pass through more dangerous areas,
    without being perceived as unrealistic by the player. Choosing paths that avoid
    cover, use narrow bottlenecks, or intentionally pass within range of the player
    makes agents more vulnerable to attack. Achieving this may be as simple as ignoring
    knowledge of player location when generating routes or deliberating weighting
    areas without cover as more desirable.


    Destination offsets or using longer or more complex routes can also be used to
    slow down NPCs, leading to them reaching a goal later or reducing the likelihood
    of them intercepting the player. This in turn can be used to affect the effectiveness
    of an attack or limit how much knowledge can be gained along the way.


    Also, limiting how often routes are updated can be used to make AI look less intelligent.
    Without regularly adjusting routes to follow a moving player, the precision of
    the original path generated rapidly becomes irrelevant. However, updating too
    frequently would allow the AI to accurately target the player for each attack.


    # ## 19.4.7 ATTACK VARIATION


    Varying the effectiveness of attacks offers a wide range of options for dumbing
    down AI. The type and variety of attacks will affect which approaches are the
    most likely to be appropriate, but there are methods that are common regardless.


    # ## 19.4.8 TELEGRAPHING AI INTENTIONS


    Telegraphing the intention to attack by deliberately messaging the player that
    an attack is about to begin can be used to make an assault less effective, leaving
    the player time to react or avoid the encounter. This could be as simple as a
    shout from an agent which advises the player that NPCs are closing in or using
    animations to taunt or announce the direction and type of attack about to be performed.
    Other than controlling how often these cues occur, it is a difficult approach
    to balance. Cues are either triggered or not, but a simple solution is to vary
    the magnitude of when they will occur.


    # ## 19.4.9 INTENTIONAL MISSES


    AI with knowledge of the player''s location, and a clear line-of-sight, should
    be able to land a maximum damage attack every time. Allowing this to happen, however,
    would lead to a game where the AI are very difficult to defeat, and therefore
    create a negative player experience. Intentional misses are a technique used to
    control the effectiveness of an attack, by allowing the AI to fail to land the
    attack at all, or by reducing the damage done when one does hit the player.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'This is one of the few options available to an agent that only has melee attacks,
    but intentional misses can be easily applied to agents with weapons. Generally,
    they are achieved by varying target locations or delaying the attack, although
    these variations can in turn take several forms. Possible options include small
    adjustments to the direction of the attack or delaying the attack until the player
    is out of range, making the agent overshoot or completely miss without looking
    unconvincing. In addition, limiting the use of position prediction, where the
    speed and direction of a player are taken into consideration when launching an
    attack, can also be used to create believable misses.


    # 19.4.10 Projectile Spread


    The spread of projectiles is a slight variation on the theme of intentional misses
    and can be applied to any projectile, not just bullets. It is not only a believable
    way of limiting the effectiveness of an attack but would in many cases occur in
    a similar real-world situation. This is achieved by applying a slight offset to
    the target location of the projectile or the path along which it travels. You
    should restrict the corresponding offsets to be small enough to be realistic.


    Applying spread means that not all shots will hit the player, and high-value impacts
    such as headshots can be reduced in frequency. The size of the spread and whether
    this should vary over time will normally be dependent on the type of projectile
    and weapon used to launch it. Common factors that are normally considered include
    weapon recoil, increased accuracy over time, the number of simultaneous projectiles,
    and the distance from the target.


    Whether you use one or many approaches to dumb down your AI, there are several
    ways that you can make their behaviour appear more intelligent than it is. The
    following section describes some hints and tips to achieve this.


    # 19.5 USING SMOKE AND MIRRORS TO MAKE AI MORE BELIEVABLE


    When trying to make dumbed-down AI more convincing, you generally have two options
    – try to deflect attention from the AI behaviour or call attention to it. Experience
    suggests that a combination of the two tends to work best, where this is possible.
    The following are just some of the ways in which this can be achieved.


    # 19.5.1 Calling out Mistakes Rather than Trying to Hide Them


    Although it seems illogical, calling out intended or even unintended mistakes,
    can make AI seem more intelligent. A good example of this might be animations
    or audio cues used as responses to intentional misses. Having an agent shout something
    like “Oh no I missed!”, “That didn’t work, run!”, or “Where did they go?” can
    be remarkably effective. In the same way, using animations showing frustration
    at having missed, or confusion about why the attack failed, can also be very convincing.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# 19.5.2 Using Speech to Explain Why the AI Are Acting in a Certain Way


    Speech can be a very good way to give believable reasons for counter-intuitive
    behaviour. It messages the intention of the AI if it is not immediately clear
    to the player, or can be employed to indicate why an agent’s behaviour has suddenly
    changed. An obvious example of this is using speech to announce the de-escalation
    of a threat, which can be used to deflect attention from how fast this has happened.
    Shouts between nearby AI can also be used to propagate knowledge about player
    location, which can be very effective to encourage teammates to retreat when under
    attack, or to search an area in which a sound has been heard.


    # 19.5.3 Varying Animations to Make the AI More Believable


    Using variations of animations is a common way of making AI behaviour more believable,
    not just when dumbing down AI. Even slight changes in idle animations can make
    NPCs more believable or enhance the differences between contrasting AI roles.
    When trying to deflect attention from reductions in AI skill, they can be used
    to hide near misses, add delays to attacks, or even just message the agent’s intention
    to the player. More specifically, an agent could taunt the player before an attack
    or slightly offset a melee designed to miss. Using a range of animations can also
    allow more control over some of the skill reduction approaches, or more easily
    accommodate randomisation.


    # 19.5.4 Behaviour that Implies that the AI Does Not Know Where the Player Is


    Investigation and searching behaviours are regularly used to imply to the player
    that their location is not known, regardless of what information the AI has access
    to. Rather than alerting agents on the first sighting of the player, or even an
    incidental noise, having them investigate the relevant location allows a delay
    in acquiring player knowledge that looks believable. On the flip side, having
    NPCs search the area in which a player was last seen can make them appear to forget
    the player’s location fairly quickly, a lot more convincingly.


    # 19.5.5 Emergent Behaviour


    Although not technically the correct usage of the term, here emergent behaviour
    refers to any seemingly intelligent behaviour, which has not been programmed or
    scripted. Often by not scripting exactly what AI should do in a given situation,
    and instead using more general rules allows AI to combine behaviours in ways that
    are not always expected. This in turn can lead to humorous situations and responses
    that would not have been convincing otherwise. Examples may be NPCs diving off
    bridges to avoid grenades or kicking projectiles as they dive to get out of the
    way. It would be virtually impossible to program these scenarios outside of a
    scripted cutscene or similar, but both appear realistic when encountered by accident.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# 19.6 CONCLUSION


    Every programmer wants to make their AI perfect, responding to events in the way
    we expect a human to, but this rarely leads to a good player experience. This
    chapter has looked at a variety of ways in which AI can be dumbed down, to make
    them easier to attack, or less lethal to the player.


    First, it laid out some guidelines for establishing how intelligent the AI should
    be, given the type of game, AI roles and a few other considerations. Next, it
    looked at several approaches that can be used to reduce the AI skill levels and
    applied them to give specific examples for use in a game with NPCs that attack
    the player with weapons. Finally, it gave a range of examples of how smoke and
    mirrors can make these measures more believable.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# 20 Race Director


    Andy Brown


    # 20.1 INTRODUCTION


    The most crucial element of racing AI is making the AI as competitive as possible
    without resorting to what some players would consider _cheating_. Sometimes, cheating
    is not even really cheating, but the AI not appearing human-like, such as making
    mistakes and doing their task too well can be perceived as such. For all the good
    things the AI does in a game, it will often be the weak points that get a mention
    in a review, so it is important to focus on the player experience and making the
    game accessible to your target audience.


    _Sonic & All Stars Racing Transformed_ brought together a range of techniques
    to deliver an AI experience that allowed the design team to deliver a game that
    could grow in difficulty whilst providing all players with a satisfying experience.
    This chapter will cover the system that managed the race as a whole – the _Race
    Director_ whose job it was to manage the race from a high level.


    # 20.2 KART RACING


    The most important element of any AI racer is getting the AI to be as competitive
    as possible before resorting to any kind of additional aids. The key to this is
    getting the AI to race around each of your circuits as quickly as possible, maximising
    corner speeds and taking the best racing line. Ideally, you want to have an AI
    that is so good that you can then just scale things back to reduce the difficulty.
    Each track on _Sonic & All Stars Racing Transformed_ was made up of either driving,
    boating, or air sections, but the basic premise was the same – ensuring maximum
    speed around the entire circuit. To get the AI to this level requires a process
    focused primarily on racing line modifications and maximising corner speeds to
    allow it to take each corner at the absolute limit. This is a manual process that
    involves watching the AI race around continuously whilst making small tweaks to
    each corner in turn. Obtaining metrics from the best human players is also essential
    to working out where you can shave time off a lap. These metrics can be obtained
    by either watching the QA department play the game in real time or by studying
    recordings of great lap times. This will be an ongoing process for the entirety
    of the project, but it becomes easier once the handling models are locked down.
    However, there will always be a hundredth of a second to be found by making small
    modifications.


    Most tracks in karting games will have shortcuts which not only give tracks variety
    but is one of the many levers available to modify the AI difficulty. The more
    difficult AI can take the shorter routes, whereas the easier AI would take the
    longer routes. To complicate matters slightly, in _Sonic & All Stars Racing Transformed_,'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'following the racing line, or taking all the shortcuts, did not always result
    in the fastest route around the track since the game also featured boost pads,
    which were often placed away from the racing line with an element of risk in taking
    them. The AI needs to consider these to ensure they remain competitive.


    Part of the AI following logic in karting games is the ability for the racing
    line to be semi-dynamic. In other words, it continually looks at the track ahead
    and patches in additional sections of the racing line for things to avoid or pick
    up. This means that boost pads can be taken if desired. This gives another lever
    for adjusting AI difficulty.


    With competitive racers in place, the next area to look at is pickups and weapons.
    Since Mario Kart, these have been a staple of karting games. Sonic & All Stars
    Racing Transformed featured a variety of pickups with most of them requiring some
    skill to use. No Mario-style blue shells for Sonic. For each weapon, the AI was
    given a unique behaviour which could be scaled to their skill level and depended
    on the difficulty settings. Tweaking these values created an engaging player experience.
    The game itself had a standard race option with easy, medium, and hard difficulties,
    but it also had a world tour where you would be introduced to the game with progression
    getting increasingly more difficult. Designers will undoubtedly require the ability
    to script the desired outcome of a race. This is where the Race Director comes
    in.


    # 20.3 RACE DIRECTOR


    The basic concept of the Race Director is that each AI racer has a profile which
    allows you to define the following:


    # 20.3.1 THE WEAPONS PROFILE


    The weapons profile contains all the tweakables for an AI using weapons or pickups.
    You could have an unlimited number of these profiles and apply them to any AI
    vehicle. For simplicity, assume that you only have easy, medium, and hard. Each
    profile would dictate distances at which weapons would be fired, the probability
    of missing the target and cool-down timers. You can even have separate values
    to distinguish between AI attacking other AI and human racers. All of these subtleties
    give you the ability to adjust the difficulty without it being obvious to the
    player.


    # 20.3.2 THE HANDLING PROFILE


    Each racer will require a handling profile. These are not necessarily tied to
    difficulty and are simply a way to dictate the various driving parameters for
    an AI racer and the various vehicle types. Sonic & All Stars Racing Transformed
    had three types – Land, Sea, and Air. These profiles include such things as look
    ahead distances, drift parameters, and the like and featured twenty four different
    characters. Handling profiles gave the ability to tweak individual vehicles if
    required. For vehicle types using the same handling model, a default set-up can
    be sufficient, but the option is still there if needed. Always better to have
    flexibility in a system!'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# ## 20.3.3 THE ZONE PROFILE


    Each racer is designated a zone profile. A zone is an area on the racetrack where
    attributes can be manipulated. A zone does not necessarily need to be a static
    location. It can be an area around another AI vehicle.


    This profile contains attributes for defining their pure driving skill. This boils
    down to three values. The main being a skill percentage which essentially gives
    you the ability to scale up or down the default maximum speed a vehicle can travel
    at. The remaining two values are a start and end distance, and these were defined
    when the zone was in operation. The distance itself is the distance from the racer
    they are tracking. An example of this can be seen in Table 20.1.


    TABLE 20.1

    Example Zone Profiles


    | Zone Name | AI Skill Multiplier | Start Distance | End Distance |

    |---|---|---|---|

    | IN FRONT OF RACER | 0.9 | 300 | 500 |

    | AROUND RACER | 0.9 | -300 | 300 |

    | BEHIND RACER | 1.0 | -600 | -300 |


    To briefly go through the details in Table 20.1, it states that if the AI can
    get 300 metres in front of the car they are tracking, then the zone “IN FRONT
    OF PLAYER” is activated, likewise if the AI drops behind the tracked player, then
    the “BEHIND PLAYER” zone would kick in. You can see that the behind-player zone
    would increase the skill of the AI, thus giving the AI a chance to catch up.


    A general rule for any of these zones is that if a human player is within close
    proximity, then there should be no cheating going on. The whole idea behind this
    is to mask the fact that the AI is dynamically adapting to how a human player
    is performing.


    The AI Skill Multiplier can also be greater than 1! This will technically allow
    the AI to cheat but it gives the design team the flexibility to increase the top
    speeds within reason – if the human players do not notice of course!


    # ## 20.3.4 ASSIGNING PROFILES


    The final piece of the puzzle is assigning these profiles to each racer. To do
    this, you need a table with a column for each racer. In Sonic & All Stars Racing
    Transformed, rather than assigning a profile to a specific racer, it was decided
    to assign them to races in certain positions which allowed for a shuffled-up starting
    grid and also provided more variety. This system is also dynamic in that the profile
    for each racer can be assigned based on their position. If the best AI at the
    time is hit and therefore drops down to last place, rather than them suddenly
    trying to regain first place, they can inherit the last place profile.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'A typical race profile for an easy race would look something like Table 20.2.
    The most important row that underpins the logic is “TargetPlayer”. This is the
    player that each AI will use as reference for their zone profile. You can see
    that the AI in first would track the best human player, the others would track
    the best AI player, the idea being that the best AI will dictate the pace for
    the rest of the AI to achieve some semblance of order. Should an AI come off track
    or be hit, then they will just slot into the relevant profile based on their position.
    This gives the design team a fair degree of control over how a race will pan out.


    # TABLE 20.2

    A Typical Race Profile in Sonic & All Stars Racing Transformed


    | Attribute | AI Position 1st | AI Position 2nd | AI Position 3rd | AI Position
    4th | AI Position 5th |

    |---|---|---|---|---|---|

    | Weapons profile | Easy | Easy | Easy | Easy | Easy |

    | Default car skill | 0.8 | 0.7 | 0.6 | 0.5 | 0.4 |

    | Default boat skill | 0.8 | 0.7 | 0.6 | 0.5 | 0.4 |

    | Default aircraft skill | 0.8 | 0.7 | 0.6 | 0.5 | 0.4 |

    | Default zone profile car | Easy | Easy | Easy | Easy | Easy |

    | Default zone profile boat | Easy | Easy | Easy | Easy | Easy |

    | Default zone profile aircraft | Easy | Easy | Easy | Easy | Easy |

    | Handling profile | Default | Default | Default | Default | Default |

    | Target player | BestHuman | BestAI | BestAI | BestAI | BestAI |

    | Pick shortest route probability | 0.2 | 0.1 | 0.1 | 0 | 0 |


    # 20.3.5 RACE SEGMENTATION


    There are a couple of important things missing – these being the behaviour at
    the start of a race and behaviour during a race. When developing *Sonic & All
    Stars Racing Transformed*, the design team had expressed an interest in making
    the race difficulty dynamic, so that even an easy race might begin with the AI
    being more difficult to race but on the final lap they could ease off and give
    the human player the satisfaction of just beating the AI as they cross the finish
    line. To achieve this, a simple concept was added to the race profile. The race
    itself could be split into segments, these segments would define a percentage
    of the overall race distance and would allow zone profiles and weapons profiles
    to be altered. No two tracks will be the exact same length, so using percentages
    allowed for a race profile to be applied to any track and reduced the game data
    required. These segment profiles can be applied to all racers or specific racers
    as required. An example is shown in Table 20.3.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '| Segment Name | Percentage | Override Zone Profile |

    |---|---|---|

    | StartLine | 10 | StartLine |

    | MidRace | 50 | Default |

    | EndRace | 40 | EndRace |


    Using the example values given in Table 20.3, you can see that the race has been
    split into three sections. The first being the StartLine segment. This allows
    all of the AI to go flat out at the start of the race, until 10% of the race distance
    is completed, where the Default Profile will be applied, followed by the EndRace
    Profile for the last 40% of the race. There is no limit to the number of segments.
    It is a design decision, but realistically you will only need three or four segments
    for most scenarios.


    # 20.4 CONCLUSION


    As stated at the beginning of the chapter, the key aim for the AI in Sonic & All
    Stars Racing Transformed was to make an enjoyable and competitive experience with
    a minimum of negative callouts in reviews. The Eurogamer, IGN & Gamespot reviews
    of the game either fail to mention the AI (a positive!) and where it is mentioned
    it was with comments such as “surprisingly competent AI rivals”. To this end,
    it can be concluded that the goals set out to achieve were met. On top of this,
    it gave the design team the ability to script the overall feel of a race from
    start to finish, was entirely data-driven, and was highly customisable. Variants
    of this code were also used in subsequent titles due to its success and flexibility.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# # 21 SB-GOAP


    Self-Balanced Goal-Oriented Action Planner


    Michele Condò


    # ### 21.1 INTRODUCTION


    There are several solutions to implement behaviours for non-player characters
    (NPCs) in games. One of these approaches is to use an automated planning architecture
    to solve the problem of decision-making and to execute the best strategy. The
    most famous automated planner is Goal-Oriented Action Planner (GOAP) (Orkin, 2003).


    GOAP is a simplified STRIPS-like planning architecture (Fikes & Nilsson, 1971)
    which can solve many problems relating to autonomous character behaviours in games.
    Although GOAP is powerful, it has some disadvantages, and two of these limitations
    usually lead to AI coders adopting other solutions instead. These limitations
    are that GOAP has less control over the plan compared to other solutions, and
    has the potential for repeating plans, which can break the player’s immersion.
    Normally, to solve these two problems, GOAP is placed side by side with other
    systems. To improve the control over the plan, a finite-state machine (FSM) can
    be used, while to solve the repetitiveness, some sort of randomness can be added.
    Although the GOAP might be implemented using algorithms such as A*, it is usually
    done as a decision tree-based approach only, which does not give much room for
    randomness (Millington, 2019).


    To overcome these limitations, you can use a strong path search algorithm-based
    approach, with custom action-related cost/estimate functions and use more detailed
    prerequisites and effects.


    If you put all this together, you get a Self-Balancing Goal-Oriented Action Planning
    architecture. This chapter details the Self-Balancing GOAP architecture (SB-GOAP),
    which gives more flexibility and plan variation, removes repetitiveness, gives
    more control, and limits the need for other systems to support the planner.


    # ### 21.2 SB-GOAP OVERVIEW


    SB-GOAP aims to solve some of the problems highlighted in the introduction. The
    advantages this architecture brings can be summarised as follows:'
  merge: -1
  img_proc: true
- pgno: 192
  md: "+   1. It creates more variations when planning, breaking the repetitiveness,\
    \ and reducing the chance of a plan reusing the same set of actions over time,\
    \ without the need to create different or more actions with different or more\
    \ prerequisites. This is because of its deep connection with the search path algorithm.\n\
    +   \n+   2. It gives more control over the plan, by explicitly marking a prerequisite\
    \ as “false” it can be excluded from an A* search.\n+   \n+   3. It needs to communicate\
    \ with the gameplay code to determine if an action of a plan was performed successfully.\n\
    \nSB-GOAP implements two cores of logic. The first is working within a path-searching\
    \ algorithm and taking advantage of it (since it is tightly knitted to it), driving\
    \ the decision-making. Actions require functions to compute cost, estimate cost,\
    \ get neighbours, and determine if a goal is reached. The second part is the logic\
    \ handling the connections between the planner and the gameplay code.\n\nIn short,\
    \ the first part exploits the search path algorithm in order to drive the plan,\
    \ not only by prerequisites but also by the cost of the actions, while the second\
    \ part aims to adjust such cost if the agent gets interrupted while actually performing\
    \ the action.\n\nIn fact, even if a plan can be computed in one frame, the actual\
    \ execution by the agent can last seconds, minutes, or longer. For instance, an\
    \ action such as “Create Axe” might take anywhere from 5 to 30 seconds. So, if\
    \ something happens to the agent while performing this action, it should be flagged\
    \ as “not optimal” for this goal.\n\n# 21.3 PATH SEARCH EXPLOITATION\n\nThis section\
    \ will define what an action is in SB-GOAP as it is slightly different from the\
    \ GOAP version. Image 21.1 shows a classic implementation of a GOAP action with\
    \ preconditions and effects. Preconditions are used to determine if an action\
    \ fulfils the requirements of the current state for it to be considered for the\
    \ plan. The effect is how this action will modify the world state. The effects\
    \ and preconditions are Boolean, which if they are present means they are considered\
    \ “true”, otherwise “false”, although an effect can exist and be set to “false”.\n\
    \nThis sort of action works well with a decision tree-based approach or for any\
    \ approach that does not require the searching of a path. This is because without\
    \ a cost, the planner can only reason with preconditions which results in repetitiveness\
    \ (Orkin, 2003).\n\n![](img/f4a4f6e4de5338a867590c30638990cf_192_0.png)\n\nIMAGE\
    \ 21.1 Action in the classic GOAP."
  merge: -1
  img_proc: true
- pgno: 193
  md: 'Image 21.2 depicts the same action shown in Image 21.1 using GOAP, but this
    time using a cost. In this version, the plan can be driven by the path search
    algorithm. Some sort of randomness can also be added to these types of actions
    but can result in worse plans.


    ![](img/f4a4f6e4de5338a867590c30638990cf_193_0.png)


    IMAGE 21.2 Action in GOAP with a cost.


    Image 21.3 depicts the same action, but this time using SB-GOAP. As can be seen,
    it has a cost, which is the “default” cost of the action. It is defined as a default
    cost because it is not the one that is going to be used. SB-GOAP externally defines
    two other fields – a “hitch” value, which is defined on a per-user basis, and
    a normalised multiplier, which is defined on a per-agent or per-type of agent
    basis. The first can be seen as the “obstacle” cost added to the action, if the
    actual execution gets interrupted, which will increase the traversal cost, and
    the multiplier, which scales the “hitch” cost (values between 0 and its maximum
    value).


    The preconditions and effects also have values. These can be Boolean or numerical,
    as the functions used in the path search algorithm are the ones dealing with them.
    For example, if the preconditions and effects were implemented as Booleans, you
    will have something like this:


    +   • Effects → Has Axe: TRUE, Has Wood: FALSE, Has Iron: FALSE

    +   • Preconditions → Has Wood: TRUE, Has Iron: TRUE


    If instead they were implemented as numerical values, you would have something
    like this:


    +   • Effects → Has Axe: +1, Has Wood: -2, Has Iron: –3

    +   • Preconditions → Has Wood: +2, Has Iron: +3


    ![](img/f4a4f6e4de5338a867590c30638990cf_193_1.png)'
