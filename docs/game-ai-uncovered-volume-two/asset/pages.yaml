    IMAGE 1.5 Monkeys following their smoothed paths when following the player. The
    path points can be seen as the sequence of larger X''s and O''s along the path.


    ![](img/f4a4f6e4de5338a867590c30638990cf_23_1.png)


    IMAGE 1.6 The paths of the more erratic rabbits escaping the player.'
