  md: '# 18 Automated Testing Using AI Planning


    Dr Bram Ridder


    # 18.1 INTRODUCTION


    As games are growing ever larger and more complex, the need for testing, and the
    time it takes to test a game, has increased. There are many well-established types
    of automated tests like unit tests, functional tests, and smoke tests. These tests
    gather performance metrics like frames per second, memory usage, loading times,
    bandwidth usage, and many more. They also perform code coverage, detect crashes,
    fire asserts, and create error logs, amongst a plethora of other functions. This
    data is invaluable for development teams to optimise and stabilise their games.


    This chapter will focus on automated testing i.e., tests that play the game as
    a player by simulating keyboard, mouse, and game controller inputs. Most solutions
    that are used to test games like this use a combination of pre-generated scripts,
    behaviour trees (BTs), finite-state machines (FSM), and reinforcement learning
    agents. They load a level and test it for a certain amount of time and then quit.
    Taking this a step further, an AI framework will be described that is capable
    of consistently completing entire games from start to finish. The benefits of
    such a system are manyfold. Not only does it provide more extensive code coverage
    and metrics that better reflect the game, but it can also detect game and level
    design issues. If the framework is unable to complete a game, then this is usually
    due to a coding bug or issue with the level or game design. The system described
    in this chapter has been successfully utilised to complete games such as _Zombie
    Army 4_, _Evil Genius 2_, and _Sniper Elite 5_, amongst others.


    # 18.2 AI PLANNING


    The roots of planning can be traced back to STRIPS, a planning language that defines
    an initial state and goal as propositional values and a set of actions. Each action
    has a precondition, which dictates when an action can be executed, and an effect
    which details how a state is updated after applying the action. A solution to
    such a planning problem is a sequence of actions that, when applied to the initial
    state, leads to a state where all the goal conditions are true. The most notable
    application of AI planning systems in the games industry is Goal-Oriented Action
    Planning (GOAP). This was first popularised by _FEAR_ and has since been used
    in various other projects like _Tomb Raider_, _Assassins Creed_, and _Middle-earth:
    Shadow of Mordor_ games. One of the main benefits of such deliberate systems,
    compared to reactive systems like BTs,'
  merge: -1
  img_proc: true
- pgno: 165
  md: "is that it allows for smarter AI that can reason how their actions affect the\
    \ world state and future actions.\n\n# ## 18.2.1 SIMPLE NUMERICAL PLANNING\n\n\
    Simple numerical planning problems are deterministic, fully observable, and can\
    \ reason about numbers but do not deal with time. The framework described is expressive\
    \ enough to model and find solutions to complete all campaigns of Evil Genius\
    \ 2, Sniper Elite 5, Zombie Army 4, and many others.\n\n# ## 18.2.1.1 Domain\n\
    \nA planning system needs an abstract model of the game that it needs to play,\
    \ a so-called Domain. This includes the following information:\n\n+   - The type\
    \ of things that can exist in the game. For example, Player, Enemy, Location,\
    \ Door, Key, and the like. Each type can also be a supertype of other types, for\
    \ instance, you could define a Type Actor that is the supertype of Player or Enemy.\n\
    \n+   - The properties between these types. These denote their relationships using\
    \ first-order predicate logic. Each predicate has a name and a sequence of types.\
    \ For example:\n+     - (at Actor Location), an `Actor` can be **at** a `Location`;\n\
    +     - amount Item Actor), an `Actor` can have an **amount** of `Items`. Numerical\
    \ predicates are prefixed with a #.\n\n+   - And finally, the actions the player\
    \ can perform in the game. Each action has a name, a sequence of named types,\
    \ specifies when it is applicable (its preconditions), and how it affects the\
    \ world state (its effects). For example, for a player to move from location A\
    \ to location B, the player must be at location A and there must be a valid path\
    \ from location A to B. The effect on the world of this action is that the player\
    \ is no longer at location A but is now at location B, see Code Listing 18.1 for\
    \ the full definition using PDDL notation.\n\n```\nCode Listing 18.1: A Move action.\n\
    \n(:action Move\n  :parameters (?p - Player ?from ?to - Location)\n  :precondition\
    \ (and\n    (at ?p ?from)\n    connected ?from ?to))\n  :effect (and\n    (not\
    \ (at ?p ?from))\n    (at ?p ?to))\n)\n```"
  merge: -1
  img_proc: true
- pgno: 166
  md: '# 18.2.1.2 The Problem


    During runtime, an *instance* of the domain is created, which consists of the
    initial state, a representation of the current game world, and the goal we are
    trying to achieve. This is a problem that the AI Planner is tasked to solve.


    # 18.2.1.2.1 The Initial State


    The initial state consists of all *Objects* that are part of the world. Each object
    has a unique name and is of a certain type that is defined in the domain. For
    example:


    +   • p – Player, object *p* of type *Player*.

    +   • blue_key – Key, object *blue_key* of type *Key*.


    It also contains all *Facts* that are true. A *Fact* is an instance of a predicate,
    where each *Type* is instantiated with an Object of the correct type or subtype.
    For example:


    +   • (at p player_loc), the *Player* object p is at the *Location* object *player_loc*,

    +   • amount blue_key p)=2, the *Player* object p has two *blue_key* objects.


    For boolean predicates, you only declare those *Facts* that are true. This is
    the so-called closed world principle which means that all *Facts* that are not
    declared are assumed to be false. For numerical facts, their numerical value is
    declared.


    # 18.2.1.2.2 The Goal


    The goal is a logical expression of what value *Facts* must have. For numerical
    facts, the following expressions are allowed: equal to, less than, greater than,
    less or equal to, and greater or equal to. For example, a goal could be:


    +   • (and (at p finish_loc) #(amount reactor_cores p)>3)


    # 18.2.2 Finding a Solution


    Once the initial state and the goal are defined, the AI planner creates all the
    possible facts and actions that can exist. In a process called *grounding*, all
    possible facts and *grounded* actions that can exist are constructed by enumerating
    all possible sets of objects that match the predicate’s types defined in the domain.


    For example, starting with the following objects:


    +   • p1, p2 – Player

    +   • loc1, loc2, loc3 – Location


    Six Facts will be generated:


    +   • (at p1 loc1)

    +   • (at p1 loc2)

    +   • (at p1 loc3)'
  merge: -1
  img_proc: true
- pgno: 167
  md: '+   - (at p2 loc1)

    +   - (at p2 loc2)

    +   - (at p2 loc3)


    Then 18 grounded Move actions will be generated:


    +   - (move p1 loc1 loc1)

    +   - (move p1 loc1 loc2)

    +   - (move p1 loc1 loc3)

    +   - (move p1 loc2 loc1)

    +   - (move p1 loc2 loc2)


    An AI Planner''s job is to find a sequence of grounded actions that transition
    from the initial state to a state where all the goals are satisfied. One of the
    major problems with AI Planning is the complexity of the problems; simple numerical
    problems are semi-decidable, which means that the search space can be too big
    for these techniques to find a solution in a reasonable amount of time. Even worse,
    if no solutions exist, then this cannot be proven. Even classical planning problems,
    which do not reason about numbers, are PSpace-Complete.


    # 18.2.3 State-Based Planning


    One of the search techniques developed to solve planning problems is to explicitly
    explore the search space. Searching can start at the initial state and the search
    space is explored by generating successor states from any state that has been
    generated until a goal state is found. This method is called Forward-Chaining
    Planning.


    You need a good heuristic to guide the AI planning system; given a state, which
    of the possible successor states should it explore first? The general way to formulate
    a heuristic is by abstracting the given planning problem and solving the simplified
    problem. The plan length of the solution to the simplified problem is used as
    the heuristic for the original problem. The approach used in this framework was
    the so-called Numerical Relaxed Planning Graph heuristic (nRPG).


    # 18.2.4 Numerical Relaxed Planning Graph Heuristic


    You relax a planning problem by adding negative effects to successor states, instead
    of deleting them, and using lower and upper bounds to capture the possible range
    of numerical facts. An nRPG is constructed by creating alternating fact and action
    layers as follows:


    +   1. The initial fact layer is the initial state of the AI planning problem.

    +   2. All actions whose preconditions are satisfied in the previous layer are
    added to the next action layer.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '+   4. The effects of the actions in the previous action layer are applied
    as follows:

    +   * All positive and negative boolean effects are added to the next fact layer.

    +   * All numerical effects expand the upper or lower bounds, accordingly.

    +   * A special No-Op action for each fact in the previous fact layer is added,
    whose precondition and effect are that fact.


    +   5. Is the goal satisfied in the current fact layer?

    +   * If so, we are done.

    +   * Otherwise, go to step 2.


    An example of an nRPG is depicted in Image 18.1. All No-Op actions and facts that
    were true in a previous fact layer are omitted for clarity. You may never reach
    a fact layer where the goals are valid. You stop the construction of the nRPG
    when you reach a fact layer whose facts are identical to the previous one. At
    this point, you can conclude that no solution exists for the original planning
    problem. After all, if no solution exists for the relaxed planning problem, then
    no solution exists for the original one. The reverse is not true though. If you
    can construct an nRPG, then you cannot conclude that a solution exists to the
    original planning problem.


    ![](img/f4a4f6e4de5338a867590c30638990cf_168_0.png)


    IMAGE 18.1 An example of an nRPG with a single goal fact.


    After an nRPG is constructed, the search for a solution to this relaxed problem
    as follows:


    +   1. Mark goal facts in the last Fact layer.

    +   2. Select an action in the same action layer as a marked fact that achieves
    that fact. Unmark the achieved fact and mark all the action''s preconditions in
    the previous fact layer.

    +   3. If there are no marked facts, or all marked facts are part of the initial
    state:

    +   * Then you are done, and the number of selected actions is the heuristic.

    +   * If not, go to step 2.


    Sadly, finding the optimal solution is an NP-Complete problem. To determine which
    action to pick for each marked fact, you use a heuristic. The cost of each action
    is the sum of the fact layers where each of its preconditions was first achieved.
    No-Ops have a cost of 0, so they are always chosen over other actions if possible.'
  merge: -1
  img_proc: true
