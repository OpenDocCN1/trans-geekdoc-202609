- pgno: 92
  md: 'human player, they are fully aware of why their team is reacting slower to
    threats. By incorporating training into your game, which will increase this stat,
    you have a ready-made feedback loop that keeps the player playing your game, and
    just as importantly, understanding why the AI plays the way it does.


    # 8.2 CONSIDERATIONS


    You may find that using the auto refresh when an opponent is in the observing
    player’s field of view kills off this approach to positional awareness. Especially,
    if the sport in question is one where teams are on opposing sides of the field
    and therefore a player can see the majority of the opponents. If this is the case,
    you may find that removing the field-of-view approach and just going with one
    of the refresh rate approaches works well. This approach also makes incorporating
    difficulty settings easier.


    When implementing such an approach, it is crucial that any decisions by the AI
    are made using the awareness positions. Quite often, there will be other ways
    of getting a position for an opponent, but the problem is these ways result in
    the actual position of the opponent. So, when other gameplay programmers are implementing
    mechanics, they should query the same structs; otherwise, it appears as though
    the player suddenly knows exactly where the opponent is. It can look odd and can
    appear as though the AI is cheating.


    # 8.3 THREAT AWARENESS


    Another area of player awareness that impacts AI sports people is how to determine
    which opponents are deemed as threats. Whether on Offence or Defence, the opposing
    players pose a threat to the goal of the team. How these threats are assessed
    is an important aspect of the awareness of each player on the field.


    When looking at the AI for a Cornerback, if the player they are marking crosses
    paths with another player, it is for them to decide which one to mark. Do they
    stay with the Wide Receiver they started with, but who has now headed into the
    centre of the field where a teammate could cover them, or do they stop marking
    their target and pursue the opponent that is now heading to the edge of the field.
    Different players will do different things depending upon the scenario, but in
    video games, the AI needs to look like they are at least making smart decisions.


    # 8.3.1 Threat Filters


    To ensure code is reusable and compartmentalised, the concept of a threat filter
    was developed. Different AI behaviours use as many or as few filters as required,
    and these are detailed in the next section. When assessing threats, the observing
    player stores an array of values (one for each opposing player on the field) which
    indicates the weighting of the threat. At each update, the weighting is set to
    a value of zero before the available filters are processed. Each individual filter
    will modify this weight based on the criteria of the threat. Each threat can return
    a maximum value of one, but in most cases will return a weighting for that filter.
    The weighting is a tweakable value that can be set by design but can never exceed
    one. When all filters'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'have been processed, the accumulated weight is divided by the number of filters
    to give a threat value between 0 and 1. The observing player will now understand
    which opposing players are the greatest threat to their team.


    There are a wide variety of different threat filters that can be applied, and
    only a subset of those used is described below. What is important is that each
    filter handles one assessment, and more complex assessments are made by layering
    up filters.


    # 8.3.1.1 Distance of the Opponent to the Ball Carrier Filter


    If the observing player is on the Offence, it is their job to protect their teammate
    who is running with the ball. To identify if an opponent is a threat to the ball
    carrier, the distance between the ball carrier and the opposing player being analysed
    is divided by a maximum distance to give a 0 to 1 value.


    # 8.3.1.2 Distance of the Opponent to the Observing Player Filter


    At times, the distance of an opposing player to the agent assessing the threat
    is an important factor. Those closer are deemed a higher threat than those further
    away. For example, the observing player could be the ball carrier who wants to
    make as many yards uphill as they can before they are brought down. If this threat
    is available to the behaviour, then the distance between the observing player
    and the opposing player being analysed is divided by a maximum distance to give
    a 0 to 1 value.


    # 8.3.1.3 Distance of the Opponent to the Endzone Filter


    If the opposing team has the ball, the distance of the ball carrier to the end
    zone is a huge consideration. The closer they are to the end zone, the greater
    the threat. When incorporating this filter into the threat analysis, the distance
    between the ball carrier and the endzone is divided by a maximum distance to give
    a 0 to 1 value.


    # 8.3.1.4 Positioning upfield to the Ball Carrier Filter


    When the observing player''s team does not possess the ball, it is important for
    them to stop the ball carrier from making yards. If they are ahead of the ball
    carrier, they should treat the ball carrier as a threat, but if they are already
    behind the ball carrier, and there is little chance of them catching up, then
    there is little they can do. For this filter, the field position of the observing
    player is compared to that of the ball carrier''s position. If they are upfield
    of the ball carrier (they are between the ball carrier and the end zone), the
    threat value is set to the weighting for this threat, otherwise it is scaled down
    to zero depending upon the distance away.


    # 8.3.1.5 Opponent Positioning inside Zone Filter


    For players that have a zone to protect, any opposing player within that zone
    is deemed a threat. Any opposing player inside the zone controlled by the observing
    player returns the weighting for this threat, and any opposing player not inside
    the zone returns a value of zero.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# 8.3.1.6 The Opponent Is the Ball Carrier Filter


    The ball carrier on the opposing team is always a threat. So, this filter is simple.
    If the opposing player has the ball, then this results in a value of one, otherwise
    it returns a value of zero.


    # 8.3.1.7 Opponent Positioning outside the Receiver Positioning Filter


    When a defensive player is looking to defend against a receiver, it is important
    for them to see opposing players moving to the outer edges of the field as a threat.
    This is because the receiver can then run upfield with little obstruction and
    the Quarterback can throw ahead of them. To incorporate this into the AI, this
    filter is used to calculate a ratio of the opposing player''s position to the
    field''s half-width to give a threat value in the range of 0 to 1, 1 being the
    player farthest outside, and 0 when the player is in the centre of the field.


    # 8.3.1.8 Opponent Is Currently Man-Marked Filter


    Players will from time to time be marking opposing players. To ensure teammates
    don''t all congregate around the same opponent, the concept of being man marked
    is used. Internally, this is a variable stored by a player that contains the player
    ID of the player marking them. This filter checks if there is already a valid
    player ID stored, and if so, returns a value of zero, otherwise the weighting
    for this threat is returned.


    Multiple players deeming the same opponent as the highest threat is a valid outcome,
    and at times, there should be multiple players trying to handle this threat. This
    filter reduces the chances of this happening though and in-game at most two players
    at any one time (the marker and the observing player) try to handle a threat who
    has a teammate marking them.


    # 8.3.1.9 The Opponent Is a Potential Receiver Filter


    When on Defence, it is crucial that the AI can understand which opponents may
    have the ball thrown at them. Potential receivers are determined by their role
    on the team. These include the Wide Receiver, the Tight End, and the Running Back.
    This filter checks the role of the opposing player, and if it is a potential receiver,
    the weighting for this threat is returned, otherwise zero is returned.


    # 8.3.2 THREAT FILTERS IN BEHAVIOURS


    For American Football, threats are assessed differently depending upon a player''s
    current role and the rules of the game. The approach that was taken was to analyse
    threats on a per-behaviour basis. A behaviour acts in the manner expected. A finite-state
    machine would be appropriate, or any other suitable approach. The important point
    is that the threat analysis is done external to the behaviour. The behaviours
    simply use the data to determine which opposing players are of the greatest concern
    and act appropriately. For example, the ball carrier will always look to work
    his way upfield but needs to avoid incoming threats. As threats change, the ball
    carrier will adjust to handle the next highest threat and manoeuvre in such a
    way as to avoid getting tackled.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'Not all behaviours require a threat analysis, so to save CPU processing, threats
    are not assessed for behaviours that do not use the information.


    The following behaviours required threats and are a subset of those required for
    the whole game. They do, however, show how different behaviours can use different
    combinations of the same filters to assess the threats in a way that suits the
    behaviour the player is currently enacting.


    # 8.3.2.1 Zone Coverage Behaviour


    When in zone coverage, a player is on the defensive side of the field and must
    keep track of opposing players looking to find a good position to catch the ball.
    They should also be aware of the ball carrier entering their zone, which would
    result in this behaviour being replaced with a simple behaviour that chases down
    the ball carrier and makes a tackle.


    The threat filters assessed for this behaviour are:


    +   - The opponent is the ball carrier filter.

    +   - Opponent positioning inside zone filter.

    +   - Distance of the opponent to the endzone filter.

    +   - Opponent is currently man-marked filter.

    +   - Distance of the opponent to the observing player filter.


    # 8.3.2.2 Lead Blocker Behaviour


    A Lead Blocker is a player on the offensive side of the field who runs ahead of
    the ball carrier and blocks off any incoming threats.


    The threat filters assessed are:


    +   - Distance of the opponent to the ball carrier filter.

    +   - Distance of the opponent to the observing player filter.

    +   - Opponent is currently man-marked filter.


    # 8.3.2.3 Ball Carrier Behaviour


    When any player on the field gets the ball, they have one job and that is to take
    it as many yards upheld as they can before an opposing player brings them down.


    The filter required to assess threats for this behaviour is:


    +   - Distance of the opponent to the observing player filter.


    # 8.4 CONCLUSION


    Awareness is a simple enough addition to any sports title and delivers great results.
    It does not remove the need for other stats such as sprint speed, it only enhances
    them. When it comes time to incorporate difficulty settings into your game, which
    always seems to be late in development, modifying the awareness stat or the threat
    weightings is a subtle way of adjusting the difficulty of your game without any
    of the AI players doing anything wrong.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# 9 Crafting the Illusion

    Difficulty Scenarios


    # Paul Roberts


    # 9.1 INTRODUCTION


    Difficulty is an aspect of games development that often gets left until the end
    of development. At which time there is panic because the game is too difficult,
    and some way is needed to make the AI play in such a way that it offers a challenge
    to the player, but is not so good that the player struggles to win. This chapter
    describes the approach taken to incorporate difficulty into the AI systems from
    an early stage, which was then expanded upon to create flexible difficulty and
    difficulty scenarios.


    # 9.2 INCORPORATING DIFFICULTY


    Difficulty should not be about the dumbing down of AI. Each agent in the game
    should make the best decision they can, given the information they have. If you
    do not give them enough information, they look stupid. Give them too much information
    and the AI is deemed to be cheating. The key here is for the AI to make the correct
    decision, so they do not look stupid, but their ability to enact their response
    is thwarted. In other words, they look incompetent rather than dumb. Imagine a
    stealth game where an AI guard is patrolling. The guard’s field of view can simply
    be modified to allow the player to sneak past. The player will accept the agent
    not spotting them if the field of view is not too narrow, but what would be better
    is an agent that spots the player slightly late (narrowed field of view) and then
    responds by taking aim and firing, but the aim of the agent is not great, so they
    miss the target. Perhaps the agent also runs to trigger an alarm. The guard’s
    run speed can also be reduced. This allows the AI to spot the player, make the
    correct response, miss when firing and be slow to trigger the alarm. In this scenario,
    the player is given the chance to avoid the guard, but if they fail, they have
    the opportunity to take out the threat, creating a more engaging encounter for
    the player, and one in which the AI does not look stupid.


    One of the absolute worst ways of incorporating levels of difficulty into a game
    is to modify the AI on the player’s side. For example, in a sports title, it is
    never fun for the ability of the player’s team to be modified to make the opposition
    more difficult. The player will notice if their team is running slower or are
    now unable to make a catch that they were making in the previous match without
    any trouble. The player can see what is happening and the immersion is lost, along
    with it possibly the player. Instead, any modifications should be applied to the
    opposing AI. Even better, make any modifications to individual agents.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'The example described highlights why it is important to consider AI difficulty
    early on. Imagine you have a maximum speed a player can run at and an agent on
    the player''s team is set to this maximum, it then becomes difficult to have an
    opposing agent run faster without the physics looking broken. The game will have
    been continuously balanced throughout development and suddenly cutting down the
    speed of the player''s agents will affect gameplay and possibly cause a whole
    host of unforeseen issues. Instead, by having a global maximum speed, one that
    looks and feels correct with the physics of the game, and then for agents to have
    a scale variable that is multiplied by this maximum, it is possible to modify
    the speed for all AI players on the team. It is also recommended to have a maximum
    scale that can be applied, which allows only the AI to go beyond. For example,
    if the maximum scale is set to 90%, then the remaining 10% can be used to scale
    for more difficult opponents. In the example of a sports title, the more difficult
    opponents can be faster because the highest range of speeds have been reserved,
    and the player''s team do not feel like they have been unfairly modified.


    This approach can be used for many player attributes beyond speed, and it is also
    possible to incorporate the same idea into all areas of information gathering
    for the AI. Areas such as AI awareness or threat analysis can incorporate a scaling
    factor and the field of view can be widened or shrunk based on a scale, as a multitude
    of other areas. The AI still makes the best decision they can with the information
    they have, and they still react as quickly as they can, but you now have the ability
    to reduce their difficulty without them looking stupid. The difficulty of the
    AI, and thus the game, is now controllable through a collection of variables.
    If these are exposed to the design department, through onscreen UI or a spreadsheet,
    they can tweak those numbers and find the balance which works best for the game.


    # 9.3 FLEXIBLE DIFFICULTY


    Most games will have at least three levels of difficulty – Easy, Medium and Hard.
    This can be incorporated in a couple of ways. The first approach is to have a
    global scale for each difficulty level. When playing on a particular setting (Easy,
    Medium or Hard), simply multiply the maximum values by the scale for this difficulty
    setting. When individual agents require their own settings, they will multiply
    their scaler by the new (modified by difficulty scale) maximums. Alternatively,
    the second approach is to have a scaling factor for each area of the AI that has
    a maximum value. Then, multiply each one individually.


    The second approach gives the most flexibility. Rather than the Easy difficulty
    dropping the scale of all areas by 50%, you can have different values per area.
    For example, modifying the speed of players by 50% can look ridiculous, but reducing
    the field of view by 50% looks fine. Table 9.1 gives an example of the AI areas
    and settings that could be applied in a sports title for a balanced game.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# TABLE 9.1

    Example AI Areas and Values for a Standard Game


    | Area Modifiable by the AI | Balanced Game |

    |---|---|

    | Attributes | 75% |

    | Positional awareness refresh rate (in seconds) | 0.6 |

    | Field of view (in degrees) | 90 |

    | Threat awareness weighting | 80% |

    | Pass accuracy | 75% |

    | Shot accuracy | 70% |

    | Time management | 80% |


    The example values shown in Table 9.1 can be tweaked by designers until they get
    a good feel for the game and have it playing at a medium level of difficulty.
    With these settings, it is possible to then set the scaling values for each difficulty
    setting that will modify those for a standard game. Table 9.2 gives an example
    of how the settings in Table 9.1 could be modified for these different difficulty
    levels.


    # TABLE 9.2

    Example Settings that Can Be Modified by Difficulty


    | | Easy | Medium | Hard |

    |---|---|---|---|

    | Attributes | -20% | - | +20% |

    | Positional awareness | +60% | - | +100% |

    | Field of view | -20% | - | +10% |

    | Threat awareness | -10% | - | +10% |

    | Pass accuracy | -30% | - | +20% |

    | Shot accuracy | -40% | - | +30% |

    | Time management | -20% | - | +10% |


    # 9.4 DIFFICULTY SCENARIOS


    Adding some personality to a team (not to an individual player) is an interesting
    concept. In sports, teams can go on a winning streak where they play beyond what
    would be expected from the individual players, or maybe a good team has a slump
    and they lose their mojo, or maybe the coach gives the team a grilling at half
    time and in the second half the team responds. All of this can be done quite easily
    by expanding on the ideas already presented in this chapter.


    Internally, there is no reason why there should only be three levels of difficulty.
    Exposing the player to the three levels is fine, but internally you could have
    more levels. Seven internal difficulty levels work well with the three (Easy,
    Medium and Hard) exposed levels. These internal levels could be called something
    like Very Easy, Easy, Moderately Easy, Medium, Moderately Hard, Hard and Very
    Hard. These internal settings should push the main setting to be slightly harder
    or easier.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'It is not difficult to extrapolate the approach taken in the previous section
    to create seven levels of difficulty.


    The reason for creating more levels of difficulty is to allow you to switch the
    levels at runtime without the player knowing. If the difficulty change is too
    great (i.e., Medium to Hard), the player will notice and feel cheated. Whereas
    changing from Medium to Moderately Hard is not such a large step. You can then
    switch from Moderately Hard to Hard and the player will accept the change. It
    just feels like the opposing team has got into a rhythm.


    With these seven levels of difficulty, it is now possible to modify the difficulty
    before and during a game. The following scenarios all work well in a sports title.


    # 9.4.1 HALF TIME TALK


    At half time if the opponents are losing, or the score is even, the coach could
    give the team a pep talk that inspires them to play better. Whatever the external
    difficulty is set to, the difficulty setting is increased by one. For example,
    Easy (external) moves to Moderately Easy (internal), or Hard (external) changes
    to Very Hard (internal).


    This should not guarantee the opponents a victory but should make them more difficult
    to play against in the second half. The human player should notice the change,
    and it helps if there is some gameplay indication that this has happened. For
    example, UI to inform the player or audio describing the coach''s reaction.


    # 9.4.2 CLOSE CALL


    This scenario is a form of rubber banding. Whenever the human player''s team takes
    the lead, the AI for the opposing team has its internal difficulty increased.
    When the scores become even again, the difficulty is dropped to its original (outward
    facing) difficulty setting.


    This scenario keeps a match competitive without it being obvious that the opponents
    have suddenly got more difficult.


    # 9.4.3 MOMENTUM


    If a team has momentum, possibly on a winning streak, this scenario will increase
    their difficulty. Stats are a big part of sports games, but so is psychology and
    game AI rarely brings this into the mix. This scenario allows the human player
    to look at the stats of the opposition, but then to see that they are on a winning
    streak, so to expect a fight.


    # 9.4.4 STRONG DEFENSIVE


    Some teams are better at defending than they are at scoring, or vice versa. This
    scenario allows you to change the internal difficulty level when the human player''s
    team has the ball. Simply increase the difficulty when on Defence and drop the
    difficulty when on Offence.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'It would be possible to change the stats of the defensive players on a team
    and get the same effect, but using this approach is more flexible and allows for
    a straightforward way to get the same results. Changing the stats of multiple
    players takes a lot longer to do and balance than setting a scenario for a match.


    # 9.5 CONCLUSION


    Difficulty is something that often gets left until later in a project and then
    it is left to the AI team to find a way to make the AI easier to play against.
    By thinking about this early in the project, you can incorporate difficulty in
    such a way as to create interesting gameplay scenarios that improve the overall
    game and add some hidden depth. Although this chapter leaned on sports games for
    much of the discussion, there is no reason why these approaches cannot be incorporated
    into other genres. The approaches described in this chapter have all been implemented,
    worked as described and reduced the stress on the team when the spectre of difficulty
    raised its head.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# # 10 Towards Controlled Design of Learning Agents for Automated Video Game
    Playing


    Dominik Gotojuch


    # ## 10.1 INTRODUCTION


    Research into machine learning (ML)-driven game playing has led to several notable
    achievements with AI outperforming champion-level human players in complex video
    games, such as Starcraft II (Blizzard Entertainment, 2010), Gran Turismo Sport
    (Polyphony Digital, 2017) and DOTA 2 (Valve Corporation, 2013) (Wurman et al.,
    2022). However, the impact of these milestones on commercial video game development
    has been limited thus far. Learning models have been effectively used in the agent
    AI of some select titles, including Creatures (Millennium Interactive, 1996),
    Black & White (Lionhead Studios, 2001), Forza Motorsport (Turn 10 Studios, 2005)
    and Supreme Commander 2 (Gas Powered Games, 2010), but it is an uncommon practice
    (Miyake, 2017). While game industry research in the field is ongoing (Zhao et
    al., 2020; Sestini et al., 2022), reports from these studies are sparse, and their
    influence on published titles is yet to be seen. The complexity and risks of modern
    video game production make it difficult to justify using unreliable and expensive
    ML solutions (Zhang et al., 2016; Zhao et al., 2020), when approximations generated
    by ad hoc behaviour authoring methods deliver satisfactory results (Colledanchise
    & Ögren, 2018). Prior efforts to integrate learning models into agent AI workflows
    have not provided optimal solutions for professional game development, due to
    incompatibilities with industrial workflows (Politowski et al., 2022). A generalisable
    and non-disruptive approach to integrating learning into these workflows is required
    to address the requirements of game development and make it more accessible for
    application in future games. Context-guided agent design which can potentially
    contribute towards this goal is presented in this chapter, along with its deployment
    procedure.


    # ## 10.2 BACKGROUND


    Because of their modularity, reactivity and scalability, behaviour trees (BTs)
    have become the de facto standard for implementing agent behaviours in video games
    (Yannakakis & Togelius, 2018). The transparent structure of BTs translates into
    a directed tree flow, updating the processing of a relevant traversal path through'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'the tree at a regular time interval by invoking logic implemented in tree nodes
    (Colledanchise & Ögren, 2018). To offset the limits and risks of manual behaviour
    authoring (Sagredo-Olivenza et al., 2019), dynamic restructuring and synthesis
    of BTs have been investigated (Colledanchise et al., 2018; Lim et al., 2010).
    This led to work on learning from demonstration by using recorded or live demonstrations
    to generate new or improved BT designs. While somewhat effective, these solutions
    suffer from limiting domain expert authoring control and obfuscating design transparency
    (Politowski et al., 2022).


    Non-industry research into learning-driven game playing has been mostly focussed
    on General Game Playing, which uses screen scraping, rather than a game’s internal
    representation, to learn a gameplay policy (Wurman et al., 2022). This approach
    incurs high training costs and is unlikely to be applicable in commercial game
    development within a reasonable time frame (Yannakakis & Togelius, 2018; Zhao
    et al., 2020). However, any black box learning model is unsuited for iterative
    development, as control over its design is limited (Zhang et al., 2016; Politowski
    et al., 2022). These constraints can be alleviated by integrating learning models
    into a BT (Colledanchise & Ögren, 2018; Zhang et al., 2016), thus allowing a partial
    transfer of robustness and modularity of a BT to learning models it contains (Colledanchise
    & Ögren, 2014). This was achieved by implementing a dedicated BT learning node,
    which embeds learning logic (Sagredo-Olivenza et al., 2017). While intuitive,
    the solution offers limited control over the learning node’s execution and provides
    no controllable resolution, should the node fail to execute. Failure of execution
    may be defined as producing invalid output, such as undesired behaviour or violating
    execution safety, potentially compromising the execution flow of the entire agent’s
    behaviour logic. Sprague and Ögren (2022) formally documented a safe, structural
    approach to tackle both these problems by embedding learning logic in a subtree,
    featuring *ad hoc* redundancy alongside learning logic.


    # 10.3 CONTEXT-GUIDED AGENT DESIGN


    # 10.3.1 OVERVIEW


    To take advantage of the proliferation of the BT architecture in the game industry,
    context-guided agent design involves integrating learning with safety and performance
    guarantees into BT development workflows for agent AI. Human domain experts are
    expected to remain at the centre of the design process and retain as much control
    over the agent decision-making logic model as possible (Sagredo-Olivenza et al.,
    2017; Politowski et al., 2022). This could potentially decrease friction and the
    risks of using learning in runtime environments of commercial video games. Key
    concepts of the design are:


    +   * **Context Guidance**: controlling behaviour flow through *ad hoc* authoring
    with a layered approach to separate the context of decision-making and action
    execution.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '+   - Safe Learning Integration: directly integrating learning logic into a
    BT as subtrees, featuring a dedicated BT learning node, and ad hoc safety control
    logic.


    +   - Small-Scale Learning: isolating the scope of learning for each learning
    model instance to its relevant, local context, to decrease training costs and
    increase output quality.


    # 10.3.2 CONTEXT GUIDANCE


    The hierarchical, subsumption architecture of a BT organically directs the flow
    of behaviour logic. By combining this inherent property of BTs with task decomposition
    similar to that of hierarchical reinforcement learning (RL), three context layers
    in a BT can be observed: *macro*, *proxy* and *micro* (Justesen et al., 2020).
    The *macrolayer* represents strategic decision-making logic and occupies the top
    of the tree, while the *microlayer* contains low-level agent actions and is located
    at the bottom of the tree (Colledanchise et al., 2018; Colledanchise & Ögren,
    2018). The optional *proxy layer* facilitates connections between the *macro-*
    and *microlayers*, if required. Such layering provides an organised structure
    for context-relevant positioning and flow control of learning subtrees. The context-guided
    structuring of the design is visualised in Image 10.1.


    ![](img/f4a4f6e4de5338a867590c30638990cf_103_0.png)


    IMAGE 10.1 Context-guided architecture flow with a separation between macro-,
    micro- and proxy layers.


    Macro- and microlayers can feature both ad hoc and learning logic, but if the
    proxy layer is present, it is expected to use ad hoc nodes exclusively to guarantee
    expert flow curation. The exact balancing of learning and ad hoc logic is left
    at the discretion of the designer, and the modularity of the outlined design allows
    for gradually scaling up the presence of learning subtrees.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'Their development should begin with stub-like, ad hoc implementations. After
    the intended learning logic is put in place, the stub or its revised version becomes
    the worst-case, safety fallback execution path.


    # 10.3.3 Safe Learning Integration


    Execution of learning logic is potentially unsafe and unreliable. Ad hoc safeguards
    and fallback logic are required to create performance and execution guarantees
    for integrated learning. In this case, reliability can be achieved by encapsulating
    learning models and ad hoc safety control logic in a single subtree, as discussed
    by Sprague and Ögren (2022). Before the learning node can run, the execution safety
    controller performs a series of designer-defined tests. In case of failure, the
    execution of the entire learning subtree is aborted. Otherwise, the performance
    safety controller conducts its own set of performance tests. Failure of performance
    testing results in triggering ad hoc fallback logic, followed by the conclusion
    of the subtree execution. If all tests are successful, the dedicated learning
    node (containing the actual learning logic) can be executed. Afterwards, the execution
    of the learning subtree is finalised.


    The original proposal of Sprague and Ögren (2022) was modified to address two
    shortcomings of their design: lack of ad hoc fallback logic execution guarantees
    and limited scope of performance safety control. The revised composite flow of
    the learning subtree, shown in Image 10.2, supports ad hoc fallback logic execution,


