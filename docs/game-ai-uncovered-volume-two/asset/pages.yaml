- pgno: 17
  md: '# # 1 Low Bandwidth,

    Synchronised Path

    Following in Team17’s

    The Survivalists


    Steven Dalton


    # ## 1.1 INTRODUCTION


    *The Survivalists* is a survival sandbox game set in Team17’s *Escapists* universe
    in which up to four players can play online to cooperate in exploring a vast,
    procedurally generated island filled with friends and foes alike. The fast-paced
    and frenetic gameplay means that fast, efficient, and precise non-player character
    (NPC) replication between online players is a priority to ensure a rich experience
    for all, regardless of connection quality. With up to 60 NPCs active and interacting
    with players at any one time, replication of their movement and actions is a constant
    concern with regard to both bandwidth consumption and connection speed and must
    be considered throughout development. This chapter will discuss in detail the
    measures put in place specifically to handle NPC replication.


    # ## 1.2 NETWORK MODEL


    The client-server network communication model adopted in *The Survivalists* saw
    the host (the player whose island is being explored) acting as the server for
    up to three additional players. The server acts as the sole authority when it
    comes to character movement and interactions by being the only instance of the
    game hosting a *logical world* as well as a *cosmetic world*, whereas each client
    has only an instance of a *cosmetic world*. This structure is depicted in Image
    1.1.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '![](img/f4a4f6e4de5338a867590c30638990cf_18_0.png)


    IMAGE 1.1 The Survivalists'' two-world, client-server architecture.


    # 1.2.1 The Logical World


    The logical world is the single acting authority of The Survivalists responsible
    for every logical operation. This includes collision detection and correction,
    authorising interactions between characters and objects or other characters, spawning
    objects, movement, and more. When the game begins, either in a single-player game
    or in a multiplayer game when a client joins, the logical world''s data is replicated
    to its cosmetic-world counterpart. This is done by taking the locations, orientations,
    and types of each entity and streaming them to the corresponding cosmetic world
    which is responsible for displaying the entities. This can be done in two ways
    depending on the type of game. A single-player game requires only that the data
    be sent locally to the sibling cosmetic world within the same game instance, whereas
    a multiplayer game requires that the server''s logical world is replicated in
    another player''s cosmetic world over the wire. In multiplayer games, only the
    server has an instance of both the logical world and the cosmetic world. All clients
    will have an instance of a cosmetic world with the server''s logical world controlling
    it.


    # 1.2.2 The Cosmetic World


    As discussed previously, the cosmetic world is responsible for representing the
    state of the game, or rather the state of the corresponding logical world, to
    the player. As entities are updated in the logical world, their counterparts or
    puppets are updated accordingly in the linked cosmetic world(s). Using this model,
    it is required that each entity in the world be represented in both a logical
    and a cosmetic form. A simple'
