    # 11.4 PERFORMANCE CONSIDERATIONS


    Performance of a system that effectively tests every actor against every role
    within every task naturally involves touching a lot of data and performing a lot
    of operations. Given the need for timely assignments, particularly when a task
    is no longer applicable, performance must be considered from an early stage. It
    is useful to break a task system into three distinct stages: data caching, evaluation,
    and assignment.


    Data caching involves making expensive calculations that are likely to be required
    multiple times (such as a task priority based on the world state, independent
    of which actor is assigned), as well as determining which actors and tasks are
    to be evaluated. This is important because it is possible for tasks or actors
    to be added and removed mid-evaluation, but you do not want to handle these changes
    mid-evaluation. Typically, this can be performed threaded in a single frame but
    could be time-sliced if required.


    Evaluation is the costliest process but can also be threaded and time-sliced.
    It can be difficult to find the most effective way to break up the evaluation
    such that it is spread evenly across multiple threads and frames, but doing so
    ensures consistency in the time taken within a frame and the total frame count.


    Finally, the assignment takes the long list of task-actor pairs and assigns them
    out in order. This is easy to time-slice but cannot be easily threaded. Fortunately,
    it is not normally too onerous, as sorting even a large list is usually relatively
    quick, and assignment is typically inexpensive. At every stage, it is important
    to try and reduce the number of tests that need to be performed. It is critically
    important to perform cheap tests first and remove tasks or actors from lists wherever
    possible. This may not help the worst case, but it makes a dramatic difference
    to the average case, which is much more common. This includes sanity-checking
    the cached data every frame to ensure it is still valid to perform tests, removing
    tasks that have been assigned from the pairing list during the assignment, and
    excluding actors from jobs they could not possibly perform based on their current
    task as the priority will never be sufficiently high. Ultimately, it is more beneficial
    to fail to evaluate a task or an actor due to changing circumstances than it is
    to try and handle the change – everything will be re-evaluated next cycle anyway.


    Continuous evaluation of every pairing in the system allows us to context switch,
    but if this is not required (such as a task being so sticky an actor may never
    leave it until completed), then it becomes possible to exclude actors from evaluation
    entirely if the task is still valid for that actor.


    Similarly, there are trade-offs between speed and quality when it comes to expensive
    operations. Even if such operations are deferred, large numbers of line-of-sight
    tests (or worse, pathfinding queries) can result in the total frame count becoming
    far too large. As such, it is often necessary to avoid these tests, and unfortunately,
    this can sometimes be noticed (particularly when it involves taking a long route
    to a task when another, closer task would have been more appropriate). There are
    mitigations for this, such as performing a Breadth First Search from the task
    to estimate actors'
  merge: -1
  img_proc: true
