    # 3.3 INTERPRETING PLAYER ACTIVITY


    To mimic the player''s behaviour, companion monkeys have a system to interpret
    an action, or sequence of actions, into something that they can perform. This
    is done by binding Action tags to any of the atomic actions that they can perform
    and Subject tags to any object that an action can be performed on. These tags
    are then combined to define Mimic Signatures, used by the observing NPC to look
    up a behaviour tree to activate, which results in them performing the same task.
    These Mimic Signatures can consist of one or more Action and Subject pairings
    that must be observed in order. Using the simple axe factory outlined earlier
    as an example and a few related behaviours, Images 3.2–3.4 depict the definitions
    of the required signatures.


    | Signature: ChopTree | Signature: Mine Ore |

    |---|---|

    | Action: Attack | Action: Attack |

    | Subject: Tree | Subject: Rock |


