- pgno: 200
  md: 'To keep the example short and to the point, the order of the actions does not
    change during the step, even if they might change because the cost changes. Remember,
    you do not decrease multipliers at every step, but all multipliers do start with
    a value of 0.0. Because the change can be very small, the following example will
    use SoftMax and the Sigmoid function to have an average increment with a small
    variation to show the change over the two issued plans.


    So, this is what happens:


    1. Plan(P):{Mine Ore, Smelt Ore, Chop Tree, Work Wood, Create Axe, Sell Axe} =
    10


    a. Killed at “Smelt Ore”: (Cost (c) 1.0, Multiplier (m) 0.0, Hitch (h) 5)


    \(\sigma(x)_i = e^{z_i} / \sum_{n=1}^N e^{z_k}\) for i = 1,...,N where N = # P(0,0,0,0,0,0)


    \(\sigma(x)_i = \{0.1667, 0.1667, 0.1667, 0.1667, 0.1667, 0.1667 \}\)


    b. \(m_2 = m_2 + \zeta_\alpha \left(\sigma(x)_2\right) = 0 + \zeta_\alpha \left(0.1667\right)
    = 0.5415\)


    c. New “Smelt Ore” Cost is C = 0.5415 x 5 + 1 = 3.707


    2. Plan(P):{Mine Ore, Smelt Ore, Chop Tree, Work Wood, Create Axe, Sell Axe} =
    12.707


    a. Killed at “Create Axe”: (Cost (c) 3.0, Multiplier (m) 0.0, Hitch (h) 10)


    \(\sigma(x)_i = e^{z_i} / \sum_{n=1}^N e^{z_k}\) for i = 1,...,N where N = # P(0,0.5415,0,0,0,0)


    \(\sigma(x)_i = \{0.1488, 0.2558, 0.1488, 0.1488, 0.1488, 0.1488 \}\)


    b. \(m_5 = m_5 + \zeta_\alpha \left(\sigma(x)_5\right) = 0 + \zeta_\alpha \left(0.1488\right)
    = 0.5371\)


    c. “Create Axe” Cost is C = 0.5371 x 10 + 3.0 = 8.371


    3. Plan(P):{Mine Ore, Smelt Ore, Chop Tree, Work Wood, Create Axe, Sell Axe} >
    15


    So, the cost of the plan (Plan 3) is now over 15 (to be precise it is 18.078),
    which means it is not a good choice for the plan considered for the goal of making
    gold. In fact, with a cost of only 15, the “Steal Gold” action will be the result
    of the new plan SB-GOAP has computed and returned to the agent.'
