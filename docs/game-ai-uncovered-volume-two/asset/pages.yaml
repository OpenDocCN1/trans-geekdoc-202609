  md: 'more accurately at short range, but as with most AI evaluation, you will often
    end up having to select sub-optimal, but faster, operations as the actor count
    increases.


    # ## 11.5 COMMUNICATION OF TASK ASSIGNMENT


    It is important to be able to communicate why a task has been assigned to an actor
    in any given processing cycle, as this is incredibly useful for debugging unexpected
    behaviour. This information can also be made player-facing, which is particularly
    useful in management titles as it allows players to better understand how to tailor
    their set-up in order to get their desired results.


    The difficulty comes from logging the large amount of information that is processed.
    It is not difficult to show the calculated utility function results of the current
    cycle, as this must be stored anyway as part of processing. However, showing how
    that utility has been calculated requires a fair amount of data to be stored and,
    typically, custom code on a per-task basis.


    As such, it is necessary to be strategic about the information presented. Of particular
    use is some information as to why an actor cannot be assigned to a task. A commonly
    identified problem is a failure to assign a task that the observer believes should
    be assigned. Showing this information, along with the calculated utilities of
    actor–task pairs, is generally enough to debug many problems at a relatively low
    cost.


    It is useful to allow this information to be filtered by both actor and task,
    ideally by selection in the world, as it is rare that a visual dump of all the
    data is particularly valuable and this encourages those not involved in the system,
    particularly QA, to better understand what is happening and send through the pertinent
    information.


    # ## 11.6 DESIGN AUTHORING


    Designers are inevitably going to require some control of the values fed into
    a utility function, as well as some control over the creation and removal of tasks.
    For example, a level designer of a tactical shooter may want to create or remove
    ‘patrol’ tasks based on where the player is currently situated in order to encourage
    NPCs to patrol nearer to the player’s position. Functionality can be provided
    for these requirements easily, and there is little reason not to include them.


    Similarly, it is not unusual for a designer to want to directly assign a task
    to actors, particularly when loading the level, and this is not difficult to achieve.
    It is, however, often wiser to simply ‘encourage’ actors to take tasks by adding
    optional designer weighting to the utility function for both a task and an actor–task
    pair. By not enforcing the assignment, you are able to be more adaptive to circumstances,
    the designer may not have considered, such as enforcing task assignment when a
    player enters a trigger volume at the front of a building. For example, it does
    not make much sense for actors to be assigned a task if they have already travelled
    far away from the task’s trigger volume. In such instances, a change of priority
    will encourage them to take it if they are still reasonably nearby, but not if
    there are more appropriate tasks to be performed.


    Another useful addition for designers, albeit a more difficult one to implement,
    is the ability to create semi-scripted tasks, such as a generic ‘patrol’ task
    that takes a'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'route around the environment that can be specified by a level designer. They
    are often necessary, however, as some degree of hand-authoring often produces
    better results than environmental analysis alone and it is not unusual for designers
    to want to carefully script moments of gameplay that are still triggered systemically.


    One way to provide this functionality is to introduce the concept of task templates,
    which are used to construct tasks with optional custom data. Using the patrol
    example, the task template could take a patrol route per actor role within a task,
    enabling the creation of multiple tasks within the system which are functionally
    identical but involve using a different patrol route.


    This injection of data into a template can also be generated on the fly, rather
    than being authored, which allows for highly dynamic behaviour. So, again using
    the patrol example, you could generate a patrol between the last known locations
    of a player in order to apply pressure in those areas, encouraging the player
    to try and advance from another direction.


    # 11.7 CONCLUSION


    Utility systems can be a valuable tool for managing large numbers of agents in
    a world with many activities that they could perform. This chapter has demonstrated
    the flexibility of such a system by detailing how it could be used to manage group
    behaviours in both management and tactical action games, which have very different
    behavioural requirements and would otherwise require complicated and inflexible
    hand-authored solutions.


    The common thread for games that may benefit from the complexity of a utility
    system is how systemic they are – group control is relatively straightforward
    when it is highly authored but becomes more difficult to manage as the problem
    space expands.


    This is a system that benefits most from being able to temporarily take control
    of individuals to perform interesting behaviour, then relinquishing them once
    this behaviour is performed. While it can be used for overall tactical control,
    it shines when performing relatively short-lived behaviour from a selection of
    possible options, creating visually interesting moments for the player to observe,
    and hopefully encouraging them to believe the AI are coordinating much more frequently
    than they are.


    Conversely, this can be overly heavyweight in situations where you either have
    high levels of authoring such that systemic results are unnecessary or in situations
    where an optimal assignment of tasks is not necessary. In those instances, tasks
    do not necessarily need a coordinator, and it is almost certainly simpler to do
    more ad hoc assignment on an individual basis (or, for groups, by mutual agreement).


