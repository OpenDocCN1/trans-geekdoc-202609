- pgno: 8
  md: '# # Preface


    When we began, *Game AI Uncovered* was only going to be a single volume, but it
    quickly became evident that there was a lot of interest from the game AI community
    to get involved and to make this into something bigger. So, to ensure each and
    every one of these amazing AI professionals could share this platform, we decided
    to keep going and create a second volume. This all happened while volume one was
    being developed, so trust me when I say the workload increased significantly.
    And it didn’t stop there. Spoiler alert, there will be a third volume next year,
    such was the interest.


    For me, this demonstrates how amazing the games industry is, and more specifically
    the game AI portion of it. There are so many extremely talented people in this
    industry, and their constant push to share knowledge, allow others to build upon
    their ideas, and continually move the field to better places, is astounding. Anyone
    who has worked in a games studio will know this happens daily, but reaching out
    to share new approaches and advances with the wider world is awe inspiring. It
    would be so easy to keep advances secret and to not share, but that’s not who
    we are.


    **Paul Roberts**'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Acknowledgements


    Game AI Uncovered (Volume Two) was quite an undertaking to bring together. Starting
    from scratch and reaching out to the game AI community to see if there was even
    any interest in such a project was a monumental undertaking. As it turned out,
    there was a great deal of interest. And a huge thanks to all those people (some
    of whom did not end up contributing a chapter themselves) who suggested colleagues,
    or friends that would be interested in getting involved.


    A special thanks to my wife, the amazing Emma Roberts who proofread this entire
    volume and, as she did with volume one, pointed out a plethora of inconsistencies
    and mistakes.


    The artwork throughout this volume was once again done by the super talented Nicholas
    Dent. He took our programmer art and not only made them look professional but
    also added a lot of character as well. Thanks Nick.


    The amazing cover artwork for this volume was provided by Team17 Digital from
    the game The Survivalists. Four chapters covering techniques from this game appear
    in this book: Low Bandwidth, Synchronised Path Following in Team17''s The Survivalists,
    Going Stateless: An Evolution of Behaviour Trees in Team17''s The Survivalists
    and Beyond, Monkey Business: NPC Player Imitation in Team17''s The Survivalists,
    and Dynamic Behaviour Trees: Building for Scalability.


    Thanks to the guys at CRC Press who have supported this project from the start.
    A special call out to Will Bateman, who supported the idea of a second volume
    right away (before volume one was published), such was his confidence in this
    series. And a huge thanks to Sathya Devi who spends hours turning my manuscripts
    into the amazing final product you see before you. I''d be remiss if I didn''t
    call out the excellent work that Simran Kaur does in the background. Thanks Simran.
    And to Shamayita Dey who took over the reins from Simran for Volume Two. Thanks
    Shamayita.


    A huge thanks to all those studios who supported their staff and allowed for this
    information to be shared.


    Projects of this kind are a labour of love. And I think each and every contributor
    in this series has shown an undeniable passion for the field of game AI. Sharing
    expertise and knowledge takes time. This is time outside of our day-to-day jobs
    of game development, meaning weekends and evenings over many months were filled
    with the development of this volume. This includes the writing, editing, drawing,
    rewriting, organising permissions, and much more. So, a final huge thank you goes
    to all our families who have both supported us and allowed us to take the time
    to work on this project.'
