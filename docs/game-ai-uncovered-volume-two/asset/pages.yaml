- pgno: 147
  md: "```\nCode Listing 15.3: Radials can be filtered out following score thresholds.\n\
    \nFVector UAWEnvironmentSteeringComponent::GenerateEnvironmentPlaneMapResult(FAWEnvironmentPlane&\
    \ EnvironmentPlane)\n{\n    FVector Result = EnvironmentPlane.SumPlane[0]; //Init\
    \ Result as first radial, //override if needed.\n    for (TPair<int32, FVector>&\
    \ RadialDirection : EnvironmentPlane.SumPlane)\n    {\n        int index = RadialDirection.Key;\n\
    \        if (EnvironmentPlane.DangerPlane[index].Size() > DangerThreshold ||\n\
    \            EnvironmentPlane.InterestPlane[index].Size() < InterestThreshold)\n\
    \        {\n            //Filter out radials according to\n            //the score\
    \ thresholds.\n            RadialDirection.Value *= 0;\n        }\n        if\
    \ (RadialDirection.Value.Size() > Result.Size())\n        {\n            Result\
    \ = RadialDirection.Value;\n        }\n    }\n    // (...)\n    return Result;\n\
    }\n```\n\n# 15.5 CONSIDERATIONS\n\nRay casts can be quite expensive if the number\
    \ of directions per environment plane is too high. There are quite a few solutions\
    \ to mitigate that cost, however. One of them is to keep a reasonable amount of\
    \ plane directions, a good rule of thumb is to go with 2° since in computers everything\
    \ is stored in binaries. A ballpark figure of directions is between 32 and 128\
    \ directions per plane, which renders smooth results and costs between 1 and 4\
    \ ms of processing per frame, respectively, depending on the hardware available.\n\
    \nMoreover, a viable option to keep ray casts to a minimum is to cache important\
    \ entities, such as enemy aircraft and items, into a pool in the game director.\
    \ This requires the storing of them in memory beforehand instead of querying for\
    \ all objects of a certain class on every update cycle. Even so, cached units\
    \ checking against each other would amount to a Big O of O (n²), which could be\
    \ drastically reduced with the use of Space Partitions such as Binary Space Partitioning\
    \ trees, quadtrees, and octrees. Consequently, cached units would only check against\
    \ each other if they were in the same or neighbouring cells in the octree.\n\n\
    Some other practical tips for better results can be achieved by making use of\
    \ sphere tracing rather than line tracing, since the former can take into consideration\
    \ the dimensions of the AI unit (represented by the sphere radius) and prevent\
    \ the unit from colliding unnecessarily with geometry in between the radials.\
    \ In addition, another logical step is balancing each plane map processing separately\
    \ before adding them together for the final resulting vector."
