    making a tree for each attack. The small tree was then combined into the custom
    attack graph, which, due to this mix of constraints, would always be the same
    i.e., a selector and a series of subgraphs. This whole process was automated.


    The custom attack graph was presented to a designer as an array of prioritised
    attacks on the BTData asset. An attack behaviour tree node was then created that
    could read this and perform the same behaviour as a selector node using that array
    of behaviour trees as its children. This node is then slotted into a generic attack
    control tree. Designers can now list out attacks to run in a prioritised order
    on that asset, and no intermediary tree is needed.


    Each of the actual attack actions the NPCs would perform were created as separate
    assets as they all needed to be networked properly. This process was an external
    requirement to the AI system but ended up with the duplication of entire attack
    graphs with all their movements and conditionals duplicated, with just a substitution
    in the appropriate asset to run. To avoid this, the attack action asset was removed
    and made part of the data on the behaviour tree data. Each element of the attack
    array then listed a behaviour tree indicating how the attack should be controlled
    and the data for the actual attack, including the damage values and all that modify
    good-ness. The attack tree node was modified to fill in a specific blackboard
    variable with the attack asset whenever that attack tree was loaded, which resulted
    in all the attack behaviour trees launching whatever asset was in that blackboard
    node instead.


    A further complication arose late in development – attacks needed to be varied
    based on weapons. Only one NPC in the game could carry items that being the monkeys
    that the player befriended. The player could give these monkeys weapons and the
    monkeys would fight by their side. The monkey’s behaviour tree needed to appropriately
    choose which attack to run based on the active weapon. To facilitate this change,
    the same list of attacks from the behaviour tree data was added to each item and
    then read out in a node to run. This allowed the monkeys to take advantage of
    all the attack behaviours previously set up for each enemy character. Additionally,
    this provided item-specific behaviours for how to, say, mine with each weapon
    or chop trees with each weapon, all using a behaviour tree and a node which knew
    to grab what it needed from each item.


    All this made adding new similar attacks very easy, you just opened an NPCs behaviour
    tree data asset, selected the parent tree and selected what attack pattern you
    wanted to copy from the several generic attack trees available to us. Anytime
    new behaviour was required, it would be built in the same generic way, allowing
    us to then reuse that data down the line just as easily.


    By using a flexible approach to your behaviour trees, you can make changes which
    speed up development and reduce the amount of maintenance that must be done around
    the behaviour trees themselves. The Survivalists ended up with designers creating
    different variations of attacks, such as just attack once in range, or check if
    a cooldown is complete before attacking, or maintain distance from the enemy and
    attack. They were then able to select the most appropriate attack for a new NPC
    or create a new attack for that specific NPC.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# 4.5 SHARING INTERRUPT LISTS


    An element of the behaviour tree approach that appeared as though it should be
    automated but proved the most difficult to get automated was the global interrupt
    system. In The Survivialists, the list of interrupts at the start of the behaviour
    trees grew and grew. These were to perform quick actions, such as being knocked
    back, or to block behaviour entirely, such as when the character dies.


    Interrupts have always been problematic in behaviour trees. Often, the addition
    of features to your game will require a custom response from an NPC, and that
    generally involves interrupting the current behaviour to play some unique behaviour.
    This distinctive set of nodes are usually located at the start of a behaviour
    tree and consist of a list of checks and responses for scenarios. For example,
    “Am I dying?”, “did I get hit?”, “was a grenade just thrown at me?” or “is a player
    currently talking to me?”.


    Using sensible behaviour tree logic, you can make a subgraph to house all of these
    interrupts. The subgraph can then be assigned to the behaviour trees of every
    NPC in the game. Whenever a new interrupt is required, it can be added to the
    graph and be propagated through to all NPCs in the game.


    This approach works well, until a stalwart NPC comes along that wants to react
    to the whole knockout interrupt with just a grunt. You could split this off into
    a whole new group, but the NPC is the same in every other way. To handle this
    scenario, it is advisable to turn each response to an interrupt into a dynamic
    behaviour tree. Now every NPC can provide a custom override for a certain interrupt
    and, if your system supports it, a default tree can be assigned as well, requiring
    NPCs to define only how they differ from the norm.


    This solves your problem, until later, a whole new interrupt is required for a
    single NPC. Monkeys in The Survivialists entered this situation all the time,
    with players able to interact with them in multiple different ways. The simplest
    solution was to add an interrupt to the global interrupts and hope it would only
    be activated for the one NPC. The issue with this approach is that it not only
    bloats the global interrupts but also causes all other NPCs to constantly check
    for an interrupt that will never happen, or worse, it happens and interrupts a
    behaviour it should not. To address this, you can split the interrupts graph into
    two, a global interrupt subgraph referenced by all NPCs and NPC-specific interrupts
    that can draw the extra interrupts out of somewhere on the NPC itself. These interrupts
    are themselves trees and so can be combined and shared easily. Any new interrupts
    can be added to only trees that care about them and trees can be split, added
    to, or combined into the required custom interrupts for each type of NPC.


    This approach proved to be sufficient for The Survivialists; however, a more complex
    game could take a similar approach to the attack graphs. Interrupts are basically
    a prioritised list of responses, so can be boiled down to a condition, a priority
    and a response. This can easily be represented as an ordered array of conditions
    and responses, or generated from multiple arrays, with one being a global array
    for all NPCs.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# ## 4.6 BLACKBOARDS


    Flexible approaches to behaviour trees always struggle when it comes to the blackboard.
    The blackboard, for anyone unaware, is a map of data that the behaviour tree can
    read from and write to. This map allows the behaviour tree to maintain data in
    the tree, writing it in one part and using it in another or allows external systems
    to write in data that will then be considered during the processing of the tree.


    The issue is that behaviour trees expect certain entries to be in the blackboard.
    If you know the exact details of what is going to be in your tree at startup,
    you can pre-allocate it, but this would have to be the per-NPC type, rather than
    per-tree, as each will construct unique trees. If we took this approach in *The
    Survivalists*, there would be a need to ensure every behaviour tree on all weapons
    in the game were included in the monkey’s pre-allocation.


    The approach taken was for all NPCs to make use of the same blackboard structure.
    In other words, they each have their own instance, but the blackboard layout was
    identical across all NPCs. This can cause the blackboard to be bloated for some
    NPCs who use it but also allows easy caching of blackboards for use by the next
    spawned NPC, saving valuable construction time. Additionally, the data is always
    laid out the same, allowing incredibly fast lookups of data. This relies on all
    NPCs sharing similar enough data, which was mostly true for *The Survivalists*,
    except for monkeys who had several specific ones. We could have spent the time
    to make a monkey blackboard that was a child of the general blackboard and tried
    to save some memory that way, but we managed to ship with a maximum of 200 simultaneous
    NPCs on mobile phones with 2 GB of RAM without the size of blackboards even coming
    into question as an issue.


    If this approach is not possible, there are several approaches you can take. The
    first would be to make a general blackboard to encapsulate any variables which
    will be shared among all trees and then have a unique blackboard per-behaviour
    tree. This may still cause the general blackboard to encapsulate NPC-specific
    behaviour though, so this general tree could be further subdivided depending on
    the active NPC, which then needs to ensure that it is never assigned to an NPC
    whose blackboard does not support its type.


    A final suggestion is questioning why blackboards need to be pre-allocated in
    the first place. Just make the blackboard an empty hash map with a getter which
    checks whether the entry exists and creates it if it does not. This can often
    be non-performant as all your data lookups would need to go through a hash map,
    but if the too-large general blackboard is an issue, hash maps are an option.


    # ## 4.7 CONCLUSION


    Embracing different methodologies for reusing behaviour trees not only speeds
    up development but also makes the remaining trees easier to maintain. Using shared
    parent trees for different types of AI and then building behaviour trees to represent
    each unique response to each extendable part of the tree produced a very flexible
    system while keeping true to the ideas of behaviour trees.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'Finally, building new mechanisms into behaviour trees do not always yield results
    or may lead to the system being seen as overly confusing. Care should be taken
    to not make changes too radically different from standard behaviour trees. Additionally,
    extra care needs to be taken with any shared trees as making any changes in one
    tree for just one NPC will affect all users. The behaviour asset suggested in
    this chapter which is ensured to be generated for each NPC independently can help
    to mitigate this.


    # REFERENCES


    +   - Champandard, A. J., and Dunstan, P. (2013) The behaviour tree starter kit.
    In Game AI Pro. Edited by Steve Rabin. CRC Press, Boca Raton, FL, Pp. 73–91.

    +   - Epic Games. (2022) Unreal Engine. Epic Games.

    +   - Isla, D. (2005) Handling complexity in the Halo 2 AI. Game Developers Conference,
    Moscone Centre West, San Francisco, CA, 2005.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# 5 Building a Buddy

    Choosing the Right Brain


    Dale Green


    # 5.1 INTRODUCTION


    As video game artificial intelligence (AI) goes, buddies arguably have the greatest
    scope for complexity. They are typically highly visible by design, meaning their
    actions often have a direct consequence on the player’s experience. This impact
    presents many challenges. No matter how great the story, music, or atmosphere
    of a game, a single rogue decision from a buddy can undermine it in an instant.
    Picture a buddy making a bad positioning decision and walking casually into a
    boss encounter. Buddies also, however, present many opportunities. From Elizabeth’s
    relationship with Booker in BioShock Infinite to Ellie’s combat support in The
    Last of Us, well-crafted buddy AI gives us the opportunity to develop meaningful
    and robust companions that help to define an experience.


    The systems that underpin such AI have the potential to be complex and vast. What
    appears to be a self-contained expression of intelligence is, in reality, the
    product of multiple systems collaborating to put on a convincing puppet show.
    Understanding what is required of your buddy AI, along with the different technologies
    and tools available, is crucial in being able to build an efficient, purposeful
    system capable of bringing your character to life in the way you envisioned.


    In this chapter, we will look at the key components of a buddy AI, highlighting
    the differences between a buddy and non-buddy AI. We will also highlight some
    of the challenges and considerations that buddies bring, along with scoping their
    desired intelligence and choosing suitable technologies.


    # 5.2 DEFINING BUDDY AI


    # 5.2.1 WHAT IS BUDDY AI?


    Buddy AI is a collective term for the systems that result in a specific type of
    AI agent – a buddy. A buddy, or companion, if you will, is an agent whose behaviours
    are designed to aid and accompany the player in their journey. The earlier examples
    of Elizabeth and Ellie are examples of very competent buddies, but the scale is
    vast. Sparx the Dragonfly, Spyro the Dragon’s long-serving companion, has much
    simpler behaviours, but is nonetheless a valued companion.


    Whether the buddy joins the player on their whole journey, or for a single encounter,
    any AI that has behaviours to accompany and/or aid the player in their journey,
    to some extent, can be described by the term.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# 5.2.2 BUDDY AI VS NON-BUDDY AI


    The goal of any AI agent is to act acutely within an evolving game world. From
    this perspective, a buddy agent and a non-buddy agent have a lot of overlap. The
    key behaviours for both can be broken down broadly into the three phases depicted
    in Image 5.1.


    ![](img/f4a4f6e4de5338a867590c30638990cf_55_0.png)


    IMAGE 5.1 Three key phases of AI processing.


    All AI agents must be able to query the world state and perform actions as a result.
    While there are certainly some differences within these phases, such as a buddy
    character perhaps needing to query more information than a standard agent, it
    is the Plan phase where some key differences lie. A buddy is an active participant
    along with the player, and this needs to be reflected in the decisions they make
    and how they interact with the world. They need to be able to aid the player without
    knowing ahead of time what they might do. This, however, needs to be balanced,
    so they are not too smart or over-eager, solving puzzles or killing enemies before
    the player has a chance to do so. Buddies must consider how their actions impact
    the player''s experience of the game in a way that non-buddies do not.


    One of the greatest challenges of creating a competent buddy is a result of their
    time in focus. This has a direct impact on their perceived intelligence, the scope
    of their decision-making, and how much room for error they have. Picture a standard
    enemy agent that is spawned in to take part in a firefight. This agent''s lifespan
    is scoped to a single encounter, meaning they are not likely to be in the direct
    focus of the player for very long, if at all. If at any point the player does
    have them in focus, so long as they are either – in-cover, moving, or shooting
    at the player, they will be perceived as intelligent; unless they do something
    outrageously stupid, there is simply not enough time for them not to be. A buddy,
    however, will be with the player throughout their journey, meaning they are in
    focus much more frequently. There is a greater opportunity for any simple, repetitive,
    or flawed behaviours to be spotted by the player. This means buddies must work
    harder, and more reliably, than their non-buddy counterparts to reach the same
    level of perceived intelligence.


    This difference in lifetime between a buddy and a non-buddy also creates a difference
    in how much their respective behaviours need to be considered. Following on with
    the example of a firefight, consider both agents shooting a weapon. If they are
    only to take part in a single, small battle, a non-buddy agent likely doesn''t
    need'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'to consider how much ammo they are using. They are likely cheating with unlimited
    ammo anyway! If you can''t get away with unlimited ammo for your buddy, their
    decision-making surrounding shooting needs to be much more considered. You do
    not want them running out of ammo at the start of a battle and then being useless.
    This same logic applies to any usable resource, such as health. A buddy''s actions,
    to avoid making them look myopic, must consider the future to some degree, increasing
    the complexity of their decision-making.


    Another example of increased decision complexity is positioning. A non-buddy agent
    is usually spawned for a given task. An NPC walking into a town, an enemy combat
    encounter, etc. They will position themselves in the optimum location to complete
    their task. Buddies must also do this but with an added level of consideration.
    You probably don''t want your buddy to stand on the toes of the player – they
    would get in the way. You also likely want your buddy somewhere on the screen,
    so their actions can be visible, but not in the player''s direct line of sight
    as again they may get in the way.


    In addition to being able-bodied agents in their own right, buddies need to also
    facilitate the player in their actions. To do this, they need a suitable system
    underpinning their decision-making.


    # 5.2.3 DETERMINING NEEDS


    To choose the correct system(s) to bring a buddy to life, it is crucial to first
    outline the desired behaviours, level of desired autonomy, and resulting challenges.
    Questions such as the following should be answered:


    +   - What kind of behaviours will they exhibit?

    +   - How much free will should they have?

    +   - How much should they contribute to gameplay?

    +   - Do they share the same abilities as the player?

    +   - How will they navigate the world?


    The answers to these types of questions will determine the scope of your buddy''s
    abilities. From that, the challenges of your design can be inferred and, in turn,
    what technologies would be most suitable. Naturally, the more restricted a buddy''s
    abilities, the fewer unknowns and therefore potential for issues there are. The
    less they can do, the less can go wrong. The downside of this is their potential
    for contribution is reduced. A buddy with many abilities and complex decision-making,
    however, has a much greater scope to make an impact, but also a greater scope
    for challenges to overcome.


    When identifying desired buddy behaviours, their ability to contribute and impact
    the game needs to be balanced such that the desired game experience can still
    be reliably presented. For example, if you were making a highly story-driven,
    cinematic game, a buddy with lots of free will has the potential to disrupt the
    desired experience. In this case, a more restricted, tightly controlled buddy
    would likely be more appropriate. It is important to identify this early so the
    most suitable technologies can be identified early.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'The most suitable technology is the one that provides just what you need, efficiently,
    with minimal technical debt. While Goal-Oriented Action Planning (GOAP) is a great
    technique, it is almost certainly the wrong choice for a small, linear, on-rails
    game. Determining buddy needs and scope for your game will help determine their
    required intelligence and level of autonomy. These are key metrics to identify
    early as it will heavily inform the system(s) that would be best used to bring
    your buddy to life.


    # ## 5.3 CHOOSING A BRAIN


    Once the requirements of a buddy are clearly outlined, appropriate systems can
    be chosen. We identified intelligence and level of desired autonomy as key metrics
    in choosing a technology, so those presented in this chapter have been roughly
    grouped by those criteria. Each of the following systems has different balances
    of control and authoring versus resulting autonomy. Generally, the less autonomy
    they have, the more their behaviours are going to need authoring, and vice versa.
    Though presented individually, these systems are not mutually exclusive, you just
    need to be aware of your performance budget when mixing and matching.


    # ### 5.3.1 LOW AUTONOMY: SCRIPTED CONTROL


    Scripted control gives full control over a buddy’s behaviour at the expense of
    practically any autonomy. When driving an agent via scripting, instead of actions
    being determined by some behavioural system, they are authored manually. Any other
    competing behavioural systems (if present) would get paused and the agent instead
    runs a fixed sequence of actions.


    The main benefit of scripted control is that you know exactly where your agents
    will be, when they will be there, and what actions they will perform. When directly
    authoring every action, you have full control, and with that comes full confidence
    in your agent’s behaviour. To be able to do this, however, you need to know what
    the game state will be, so when your buddy plays their action sequence, the world
    is in the state they were authored against.


    Practically, this mostly limits full scripted control to situations such as on-rail
    sections or real-time cutscenes, where the game state can be assured. There is
    also authoring overhead to consider. Every action you want your buddy to perform
    needs authoring against a set game state or environment, and if either of those
    changes, your script may need re-authoring too.


    For these reasons, scripted control is usually used in conjunction with more advanced
    behavioural systems, reverting to scripted control only when you need to directly
    control the buddy to ensure the correct experience is presented to the player.


    # ### 5.3.2 MEDIUM AUTONOMY: BEHAVIOUR MODELS


    While scripted control certainly has its place, most agent behaviours will be
    the result of more advanced systems, such as a finite state machine (FSM) or a
    behaviour tree. These systems present behaviours via topological models, reducing
    authoring'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'from an entire sequence of fixed actions to individual behaviours and transitions.
    How these models are executed is then determined at run time, typically based
    on factors such as the current game state.


    # 5.3.3 FINITE STATE MACHINES


    FSMs are one of the simplest ways of modelling behaviour. You need to only define
    discrete states and the transitions between them. All nodes are connected at the
    same level, there is no hierarchy, so execution moves from node to node as transition
    criteria are met. Image 5.2 shows an example FSM.


    ![](img/f4a4f6e4de5338a867590c30638990cf_58_0.png)


    # IMAGE 5.2 FSM example.


    Transitions between states here are simple and well-defined which results in a
    rigid behavioural flow. This may be suitable for an agent with simple behaviours,
    but it can become difficult and cumbersome to model more complex and nuanced behaviours
    in this way. Hierarchical FSMs offer a potential solution to this problem, whereby
    states themselves can be entire FSMs; however, a more common solution is the behaviour
    tree.


    # 5.3.4 BEHAVIOUR TREES


    Much like a FSM, a behaviour tree is a method of modelling and executing behaviours.
    Behaviour trees, however, are hierarchical structures and contain more elements,
    making it possible to build complex, branching structures as opposed to the more
    rigid structures of a FSM. This makes behaviour trees better suited to the complex
    needs of a buddy AI, and they are one of the most common AI systems as a result.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'The base elements in a behaviour tree are tasks. These are the leaf nodes in
    the model and encapsulate some functionality that, when called, will result in
    an action. Whenever a node of this type is executed, the associated logic will
    be run, and a return value passed from the node to its calling parent stating
    if the node was successful or not. The ''parent'' node here would be a composite
    node. These nodes have one or more children and determine how your individual
    tasks will be run, for example in sequence, or trying one at a time to see which
    one passes first.


    With just leaf nodes and composites, AI behaviours can be put together as in Image
    5.3 where a buddy agent would move to an item, try to pick it up and then use
    it.


    ![](img/f4a4f6e4de5338a867590c30638990cf_59_0.png)


    Other critical elements of a behaviour tree are Conditionals and Decorators, both
    of which sit atop leaf nodes. Conditionals allow us to define conditions that
    must be met before a leaf node is executed. Decorators are instructional nodes
    that allow us to do two things. First, they let us change the return value of
    a node, for example forcing it to always return true, which can be useful. They
    also let us change how the node itself runs, for example ensuring it runs indefinitely.
    This type of decorator is commonly used on base tree elements to keep the tree
    running indefinitely.


    To build on the previous example, suitable conditions might check that there is
    an item to pick up and that it can be used. A suitable decorator might ensure
    this whole sequence runs indefinitely so the agent is always evaluating if there
    are items to pick up. The updated behaviour tree is depicted in Image 5.4.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '![](img/f4a4f6e4de5338a867590c30638990cf_60_0.png)


    # IMAGE 5.4 Behaviour tree example continued.


    Behaviour trees are a popular tool for building AI as they allow you to model
    complex behaviours with relative ease. Particularly with buddy AI, there are many
    conditions that can affect how they should behave in the world, and with behaviour
    trees, you can account for that via conditions and modelling of appropriate behaviours.


    Earlier in the chapter, an example of choosing a position to stand at was given
    to demonstrate the considerations that buddies must make when executing seemingly
    simple behaviours. Using behaviour trees, we could account for the factors that
    were called out via conditions and different behaviour paths, something a simpler
    implementation might not have given us. This is a simple, but real-world, example
    of how determining a buddy’s needs upfront helps to inform which technologies
    are suitable.


    Behaviour trees are not without their drawbacks, however. Since they are typically
    fixed, their topology as standard does not change at runtime, meaning they can
    only execute a path that has been authored ahead of time. They can branch at different
    levels of hierarchy, creating some variation, but every potential path must be
    manually authored. Buddy agents can be some of the most complex agents in a game,
    so expressing all their behaviours is not a light task, and the resulting behaviour
    trees can become vast, consisting of thousands of nodes spread through multiple
    sub-trees. This size becomes cumbersome to manage and can be difficult to pinpoint
    specific behaviours amongst the many branches. Debugging behaviour trees is entirely
    possible, though can be difficult without proper tooling. Having the ability to
    step through execution, add breakpoints to certain nodes, etc., will make erroneous
    behaviours much easier to track down, though it introduces tool costs if you are
    implementing the system yourself.


    Behaviour trees are very powerful and highly authorable and thus are common place
    in game AI. Their flexibility and balance of authored content versus autonomy
    make them suitable for a wide range of agent types and abilities. Described here'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'briefly is a standard behaviour tree, but there are many variations that can
    be made to tailor it to your needs specifically.


    # 5.3.5 HIGH AUTONOMY: PROCEDURAL BEHAVIOURS


    An alternate approach to modelling behaviours hierarchically is an approach known
    as GOAP. With FSMs and Behaviour Trees, we are defining states or actions and
    then transitioning between them. With GOAP however, we uncouple our states and
    actions from authored transitions, instead letting a planning system determine
    the best set of actions that will allow us to reach a set goal. This results in
    procedural behaviours constructed at runtime, giving our agents the possibility
    of maximum autonomy.


    Goals in GOAP define the resulting state(s) that we want the agent, and/or the
    world, to be in. For example, having a buddy revive the player. We might consider
    this goal complete if the player is not currently downed. But how does the buddy
    complete this task? Through actions. Much like a leaf node in a Behaviour Tree,
    an action is an encapsulation of some functionality. Actions in GOAP, however,
    have both pre-conditions that determine if they can be executed and the resulting
    effects that determine how they change the state of the world and/or agent. They
    also come with an associated cost set by their author that is used in the planning
    stage.


    With our goals defined, and sub-actions capable of putting the world/agent into
    a state to satisfy those conditions, we pass over to our planner. This is the
    stage where a plan of action is generated for our agent. For a given goal, the
    planner will perform a search, such as A*, over the available actions to find
    all possible routes from the current state to the goal state. Image 5.5 shows
    an example of how a goal of ‘Eat’ might look.


    ![](img/f4a4f6e4de5338a867590c30638990cf_61_0.png)


    IMAGE 5.5 GOAP example.


    There are two possible paths identified. Overall, it is cheaper for the agent
    to start a fire and cook ingredients, however, if they do not have any ingredients
    to cook that branch would not be possible, so they would fall back to the more
    expensive approach of searching for food. Since the availability of actions differs
    based on the current game state, the same goal can be achieved in multiple different
    ways, bringing variability to decision-making that would be difficult to replicate
    with a fully authored model such as a behaviour tree. The process of determining
    action sequences at run time allows agents to react dynamically within their world.
    It also provides a time save for production. With GOAP, there is no need to implement
    defined behaviours'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'into a complex behaviour tree. Once the new behaviour is implemented, it is
    simply added to the pool and the planner will do its magic at runtime.


    The benefits of GOAP do not come without drawbacks. Depending on how many actions
    you have, the planning stage can be processor-intensive. For each goal to be evaluated,
    it will search over all actions available at the time, until the goal is met,
    within the set action limit. There is also re-validation of the current goal that
    needs to be done periodically to ensure that the initial game state has not changed,
    such that the current goal no longer makes sense.


    Another consideration, particularly applicable to buddies, is the lack of control
    over the resulting behaviours. Given they will be generated at runtime based on
    transient data, the current game state, it might be difficult to reproduce a given
    set of actions at a particular point in time. The procedural nature of the system
    means that without tightly controlling the game state, you could not be certain
    of what behaviours would be executed. This variability will also increase the
    need for stringent testing of the agent, ensuring that all behaviours can lead
    into/from one another without issue and that no bad sequences are generated.


    GOAP is a great system for bringing plenty of autonomy to an agent, allowing them
    to determine what to do at runtime without the need for explicit authoring. There
    are performance considerations to be made, however, if your design permits a highly
    autonomous agent, this is worth digging deeper into.


    # 5.4 CONCLUSION


    Any intelligent AI is the result of multiple systems and technologies working
    together. Buddy and non-buddy agents have a lot of overlap as they share a common
    goal of acting acutely in an evolving world in a realistic way. Differences between
    the two come into view when we consider just how they are to act within the world.
    Buddies must consider the player’s action and gameplay experience to an extent
    that generic AIs typically do not.


    Clearly breaking down the requirements of your buddy can help you infer the desired
    level of intelligence and autonomy, which in turn helps identify which technologies
    will be required to implement the design. In this chapter, we have looked at how
    to approach this process and some of the key technologies that are used to bring
    decision-making to AI agents. Hopefully, after reading, you can more clearly identify
    your own buddy needs, and have an idea of which type of system(s) will be most
    suitable.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# # 6 Making Up Your AI''s Mind

    Decision-Making Architectures


    Tobias Karlsson


    # ## 6.1 INTRODUCTION


    One of the first and most fundamental decisions you must make when you are creating
    an AI to control a creature in a game is what decision-making architecture to
    use. The decision-making architecture is the framework within which your AI decides
    what behaviour to execute and then executes that behaviour at any given moment.
    This chapter explores the more popular options available, their respective strengths
    and weaknesses, and under what circumstances you would choose one over the other.


    For this chapter, a behaviour is defined as a set of actions an AI can take to
    achieve a specific goal or to react to a specific situation. The granularity of
    each behaviour is up to the implementer, for instance, you could choose to have
    a behaviour for combat or to have many behaviours for different aspects of combat,
    such as a behaviour for reloading the AI’s weapon and one for throwing grenades.
    The granularity you choose depends on what makes sense for the AI in your game.
    The AI for an individual creature is created by giving it a set of behaviours
    and the information needed to select the appropriate behaviour at runtime.


    # ## 6.2 IMPORTANT CHARACTERISTICS


    There are many different characteristics of decision-making architectures, and
    which are more important in a given situation depends on the exact nature of the
    problem you are trying to solve; however, for most projects, many of the following
    characteristics will have some relevance.


    # ## 6.2.1 PREDICTING BEHAVIOUR SELECTION


    Every agent will have a set of behaviours. Some of these behaviours may be quick
    reactions to a surprising event, whereas others might be a fallback behaviour
    that is only active if no other good behaviour can be found. It is important to
    be able to reason about when and under what circumstances a particular behaviour
    will become'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'active and the priority of one behaviour when compared to another. This might
    seem like a simple requirement, but as the complexity of your AI grows, keeping
    track of all the conditions for when behaviours can activate or not and how they
    interact becomes more and more difficult. Even the simplest of agents tend to
    acquire an impressive array of tests and conditions for behaviour selection as
    you get closer to ship, to cover all the possible edge cases. A good decision-making
    architecture will make it easy for both the author(s) of the AI and anyone who
    will subsequently have to maintain it, to get a picture of the conditions for
    when an agent’s various behaviours will be selected for execution by looking at
    the data.


    # 6.2.2 UNDERSTANDING THE STATE OF A DECISION-MAKING PROCESS AT RUNTIME


    Even under the best of circumstances, you will find that your AI is going to choose
    the wrong behaviour as you test it; hence, it is critical to be able to inspect
    the state of the decision-making process at runtime so that you can determine
    why an agent decided to do what it did. You need to be able to understand what
    behaviour your agent is running, why a specific behaviour was selected, and why
    a specific behaviour was not selected. Ideally, you will also have access to not
    just the current state of your agent but also to a history of how it got there.
    Depending on how your architecture selects behaviours, the problem of describing
    a specific decision can range from trivial to requiring tracking a significant
    amount of extra data that may also be difficult to display. It is worth noting
    that having external applications, most commonly the editor pulling double duty,
    that can connect to an instance of the game and display that agent’s state, is
    becoming more and more popular. This is a great capability that is something you
    should seriously consider, but even with an external app, you will want to be
    able to display at least some of the AI’s state in game for quick debugging. This
    will allow for better information gathering, which can be used by your QA partners
    who may not have access to the editor. Something related and very beneficial is
    the ability to dump the current state of the AI to a file to be inspected later.
    This allows someone testing the game to easily provide you with a large amount
    of data about an agent that behaved unexpectedly.


    # 6.2.3 MODULARISATION


    Being able to create a behaviour from simpler, reusable parts is extremely powerful.
    Even if your game only has one agent, you will find that there are many functions
    and tests that recur in most behaviours. Being able to reuse the building blocks
    is going to save your development time, as you only need to write and test them
    once. More importantly, you can add metadata to your building blocks to improve
    your ability to debug your AI. Building blocks are frequently used to assemble
    the AI’s behaviour in a visual editor, but there are, of course, other options
    that create the same effect. Another benefit of using building blocks is that
    it becomes easier to learn and understand the AI system. A new developer only
    needs to learn how the building blocks work, rather than having to understand
    the details of each and every behaviour.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# ## 6.2.4 Hierarchical Decision-Making


    Modelling decision-making as a hierarchy of decisions can be very helpful. It
    matches well with how humans think about decisions. You make the big picture decision
    first, and then add more and more detailed decisions until you eventually reach
    the point where no more decisions need to be made and actions can be taken. An
    additional advantage of hierarchical decision-making is that it allows multiple
    behaviours to share decisions, meaning that you do not have to make the same calculations
    twice. For instance, if you have several behaviours that depend on there being
    a valid path to the targeted enemy, then collecting them all under one instance
    of that test in a hierarchy, allows you to make the test once and reject all of
    the behaviours together if the test fails. This also helps by making it easier
    to understand how an agent is going to behave, as decisions are split up into
    multiple, simpler decisions, and by runtime debugging becoming correspondingly
    simplified as it is easy to see where in a hierarchy a decision node failed.


    # ## 6.2.5 Ease of Adding New Behaviours


    Whenever you add a new behaviour to a character, you must ensure that it interacts
    well with all existing behaviours. This is always going to require some work,
    but some architectures make it easier to localise the changes, while others inherently
    have more dependencies between behaviours that need to be explicitly dealt with.


    # ## 6.2.6 Ability to Model States and State Transitions


    Often, AIs have distinct states that they can be in, with procedures for how to
    transition between them. An example of states that commonly occur in games is
    an agent being in either an *Idle*, *Alert*, or *Combat* state. Each of these
    states will come with a particular selection of valid behaviours, and the transitions
    between these states often require a specific process, for example, playing a
    surprised reaction when transitioning from *Idle* directly to *Combat*. In games,
    you will most often find clear instances of states at the very highest level of
    an AI as in the case of the idle-alerted-combat scenario, and at the very lowest
    levels, such as how a melee grapple attack works.


    # ## 6.2.7 Sequencing Behaviour


    The ability to sequence behaviour, i.e., first do A, then B, then C in that order
    is often very useful if the AI is to execute some more complex behaviour. Sequencing
    is a sub-problem of states and state transitions but can be implemented without
    states. Sequencing is normally relatively easy within an individual behaviour
    building block but becomes more difficult when creating sequences of separate
    behaviours, something that is usually desirable for modularisation.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# 6.2.8 NON-STATIC BEHAVIOUR PRIORITIES


    For some agents, the relative importance of performing an action compared to another
    one is dependent on the circumstances of its runtime environment. For example,
    imagine a bot in a classic first-person shooter arena deathmatch that has a behaviour
    for collecting health and one for ammo. If the bot’s health is critically low,
    getting health becomes much more important than if its health is nearly full.
    Similarly, getting more ammo becomes more important the less ammo the bot has.
    If the bot is close to dying, getting more health becomes more important than
    getting more ammo, even if it could do with more ammo, though if it does need
    more ammo, and if it is just a small detour to get some ammo when going to get
    health, making that detour might still be worth it. To properly solve this problem,
    the AI cannot rely on fixed priorities between behaviours and needs to be able
    to calculate relative priorities at runtime.


    # 6.2.9 ACTIVE BEHAVIOUR STICKINESS


    An important sub-problem of dynamic priorities is a desire to increase the priority
    of the currently active behaviour. Many times, the AI has several behaviours of
    similar, if not equal, priority, and under those circumstances, you may want to
    increase the priority of the active behaviour to prevent the AI from switching
    back and forth between behaviours. For instance, in the example above with the
    health and ammo pickup, if the need for both health and ammo is very similar,
    there is a risk that the AI will be ping-ponging between the two behaviours due
    to small changes to its perceived situation. Making the AI stick with a particular
    decision, even if that decision is not the optimal one, as long as it is good
    enough, generally leads to a better-behaving AI.


    # 6.3 IMPLEMENTATION-DEPENDENT CHARACTERISTICS


    In addition to the above characteristics of the different architectures, there
    are some characteristics of your implementation that are going to have a significant
    impact on how easy it is to work with it and how effective it is going to be at
    solving your problems. It is easy to ignore these, but there will be a cost down
    the line.


    # 6.3.1 OVERHEAD


    The quality of your AI will be highly dependent on your ability to create valid
    behaviours for most, if not all, scenarios an agent is likely to experience, closely
    followed by your ability to create behaviours that are observably distinct from
    each other. Consequently, as an AI developer, you are going to spend a large portion
    of your time adding and modifying AI behaviour. Minimising the amount of overhead
    that is required to add a new behaviour, a new behaviour building block or other
    capability for the AI is crucial. Any system that requires significant amounts
    of boilerplate work to create simple additions is going to result in a poorer
    product, as that time could have been spent on making better AI. If you start
    to notice that your behaviour'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'building blocks are becoming more and more complex while the number of building
    blocks remains more or less the same, then that is a good sign that adding a new
    building block is too complicated and requires too much work.


    # 6.3.2 Data Flow


    Your AI will be calculating data ranging from the success or failure of a specific
    task to a path found between two points as it performs validity tests and executes
    behaviours. Frequently, that data is of interest to other parts of the decision-making
    process as well as the behaviour execution, and how this data is communicated
    is very important. Success or failure is often communicated as a direct return
    value, and it is popular to use blackboards for more complicated data. While blackboards
    offer a lot of flexibility, they also act like global variables with many of the
    same drawbacks. These include data being globally visible and devoid of local
    context, which means that if your AI is considering different targets for potential
    melee and ranged attacks, you will need both a melee and a ranged target in your
    blackboard, even though in the local context, they would just be working on a
    target. Code reuse will be complicated as you need to know which target the code
    is meant to access, potentially making code less generic. Passing data directly
    between the building blocks of your behaviours, or in other ways scoping the data
    to the local context, avoids this problem and makes it easier to break up tasks
    into parts that produce and parts that consume data.


    # 6.4 COMPARING DIFFERENT ARCHITECTURES


    Different decision-making architectures have different strengths and weaknesses,
    and selecting the right one for your AI will make your development experience
    a lot easier. These strengths and weaknesses are described in the following section
    and summarised in Table 6.1.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# TABLE 6.1 Strengths and Weaknesses of Different Decision-Making Architectures


    | Architecture | Predictability | Debuggability | Modularisation | Hierarchical
    | Adding Behaviour | Sequencing | States & Transitions | Non-static Priorities
    | CPU |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | Prioritised list | ++ | ++ | . | - | + | - | - | - | ++ |

    | Hierarchical prioritised list | ++ | + | = | + | + | - | - | - | ++ |

    | Behaviour tree | ++ | + | ++ | ++ | = | = | - | - | + |

    | FSM | ++ | ++ | = | = | - | ++ | ++ | - | + |

    | hFSM | ++ | + | + | + | - | ++ | ++ | - | + |

    | Utility-based | - | - | + | = | - | - | - | ++ | = |

    | Hierarchical utility-based | - | - | + | + | - | - | - | ++ | = |

    | Planners | - | - | + | = | ++ | ++ | = | = | - |

    | Hierarchical planners | - | - | + | + | ++ | ++ | = | = | - |


    ++ Means Very Strong, + Strong, = Neither Strong nor Weak, - Weak, and -- Very
    Weak


    # 6.4.1 Prioritised Behaviour List


    A prioritised behaviour list is one of the simplest architectures available, yet
    it is surprisingly effective for a wide range of scenarios. It lists all the agent''s
    available behaviours in priority order. When a new behaviour needs to be picked,
    the AI will start from the top of the list and test each behaviour for validity
    until it finds the first valid behaviour which it will select for execution.


    It is very easy to understand which behaviour has priority over others as that
    is just the order of the behaviours in the list. Adding a new behaviour is also
    straightforward. You only need to decide where in the list it goes. Understanding
    which behaviour is currently selected is also easy. However, prioritised lists
    do not encourage modularisation and can easily be implemented with monolithic
    validity tests and behaviour execution. As modularisation helps with more detailed
    debugging, as well as with reuse, there is a risk of a lack of both. Finally,
    prioritised lists are flat by nature, meaning that there is no hierarchical decision-making,
    and they also lack any mechanism for state transitions or sequencing.


    # 6.4.2 Hierarchical Prioritised Behaviour Lists


    As noted, prioritised behaviour lists are not hierarchical, but there is no reason
    why you cannot make them so. The hierarchical version only differs from the flat
    one in that validity tests can either lead to another prioritised list or to a
    behaviour to execute.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'The hierarchical prioritised behaviour list gains hierarchical decision-making
    for the cost of a small increase in complexity, but otherwise shares the same
    strengths and weaknesses as the prioritised behaviour list.


    # ## 6.4.3 Behaviour Trees


    Behaviour trees are the perfect embodiment of hierarchical decision-making. They
    are also very strong when it comes to modularisation given that most implementations
    are built with a heavy emphasis on reusable building blocks, even though technically
    that is not a requirement. Behaviour trees allow the author good reasoning about
    which behaviour is going to execute, as their execution order is the depth-first
    search order of the tree until the first valid leaf is located. Understanding
    the current state of a behaviour tree and why a specific behaviour has been selected
    is straightforward. Just looking at the current active branch will give you most
    of the information, and by saving a little more data, you can easily display exactly
    which tests failed and which succeeded. Displaying the current state of a behaviour
    tree in game can be a little tricky since fitting trees on a screen quickly becomes
    difficult as they scale, but many systems have solved this problem by connecting
    their tree editor to the run-time, which allows for good visualisation. Where
    behaviour trees fall short is when you are dealing with states and state transitions.
    For instance, a node, like one playing an animation, that cannot be immediately
    exited requires some awkward compromises.


    # ## 6.4.4 Finite-State Machines


    FSMs excel when it comes to describing states and transitions between them. They
    make it easy to understand under what circumstances a behaviour is going to be
    active, and they are straightforward to visualise, yet FSMs'' real weakness is
    in those same transitions. The problem is that each state needs to have one transition
    per state that it is possible to transition to from that state. Often, most states
    are available from a given state, which leads to n² transitions. This results
    in a maintenance nightmare to keep track of all the transitions as the number
    of states grow. This creates a lot of work to add all the needed connections when
    adding a new state and makes it difficult to visualise a large number of states
    and transitions. Another related issue is that in many cases, there is no need
    for states with elaborate transitions in the first place. For instance, in combat,
    an agent may switch freely between most actions available to it assuming that
    they are valid. It might want to switch from attacking to moving closer to its
    target as soon as the target moves out of range, and back to attacking when it
    gets within range again. The AI does not need a complex transition from attacking
    to moving, it just needs to start moving, and when it is close enough, it will
    switch back to attacking again. Implementing this in an FSM just adds unnecessary
    overhead.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# 6.4.5 HIERARCHICAL FINITE-STATE MACHINES


    Hierarchical Finite-State Machines (hFSMs) are FSMs where each state can contain
    a nested state machine that forms a hierarchy. hFSMs are like FSMs in their strengths
    and weaknesses, with the difference that they gain the advantage of hierarchical
    decision-making.


    # 6.4.6 UTILITY-BASED DECISION-MAKING


    Sometimes, it is not possible to assign static priorities to behaviours, and instead,
    each behaviour’s relative priority needs to be decided at run time. Utility-based
    solutions were designed to solve this problem. In utility-based solutions, a utility
    score, i.e., a measure of how useful a particular behaviour would be for the AI
    to execute, is calculated for each behaviour, every update. The behaviour with
    the highest score is then selected to be executed. In many ways, utility-based
    decision-making is very similar to the prioritised behaviour list, except that
    instead of having static priorities, the behaviours are re-prioritised each update.
    This flexibility to be able to reprioritise the behaviours for a given situation
    is utility-based decision-making’s biggest strength, but the complexity of making
    it work is also its biggest weakness. Usually, when utility-based decision-making
    is described in literature, there will be a 2D graph showing how the utility of
    two different behaviours changes based on a single variable. It is easy to look
    at the graph and see where one behaviour becomes more important than the other,
    and the AI’s behaviour can be both easily understood and modified using this graph.
    Unfortunately, in order to create an interesting agent, your utility calculations
    will depend on a large number of variables, not just one, used to calculate the
    utility of a significant number of behaviours, often using non-linear functions.
    To illustrate how the different behaviours interact, you would need a graph with
    one additional dimension for each additional variable, something that quickly
    becomes impossible to illustrate. Keeping track of all these interactions is very
    challenging for any interesting AI system, which is why in practice you will see
    most utility systems divide their behaviours into classes that occupy distinct
    utility bands. This results in sets of a few behaviours in each band (often as
    few as just two or three), needing to have their utility calculations tuned against
    each other as the utility scores of all other behaviours are guaranteed to be
    outside their band.


    # 6.4.7 HIERARCHICAL UTILITY-BASED DECISION-MAKING


    As with most of the other solutions, it is easy to create a hierarchical version.
    Utility-based decision-making is no different and allows this approach to gain
    the strength of hierarchical decision-making.


    # 6.4.8 PLANNERS


    Planners allow the AI to construct plans at run time that match the current situation
    the AI finds itself in. These plans are constructed by assembling individual actions
    from a selection of actions that the AI has available to it. The actions come
    with'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'pre- and post-conditions and the planner uses these conditions to create a
    string of actions that allows the AI to transform the world in such a way that
    by the end of the plan, the current world state is transformed into the goal state.
    The most popular planner in games is Goal-Oriented Action Planning, but it should
    be noted that there are many other planners out there with different pros and
    cons.


    The big strength of the planners is that they allow the AI to solve situations
    that its creator has not thought of in advance. Assuming that there is a way to
    solve a situation with the actions available, the AI will be able to generate
    a plan to do so. This allows the programmer to focus on what actions an agent
    can take, which is a smaller problem, than on all the ways in which those actions
    can be combined. Another strength of planners is the ease of how they can be extended.
    Adding an action to the list of available actions immediately allows the AI to
    use that action in all situations that apply.


    Planners also have significant weaknesses. The most important one is that it is
    by far the most CPU-intensive way to come up with a plan. The architectures discussed
    previously offload this work to the programmer who creates all the plans available
    to the AI offline, and at run time, the AI only needs to decide which plan is
    the best option at any given time. Of course, that puts the onus on the programmer
    to come up with a plan for all possible scenarios to ensure that an agent always
    has a reasonable response, and if there are scenarios that the programmer has
    not considered, then there might be exploits or just bad reactions of the AI in
    the shipped product. It might sound like a tall task, but as it turns out, for
    many games, it is not that difficult. In most games, particularly action games,
    the AI''s life expectancy is very short, and they are engaged in a very active
    constrained activity (usually combat). Commonly, the majority of development time
    is spent on finding and fixing edge cases, something you would have to do when
    using a planner too. To compound the issue of the overhead for planning, plans
    in these kinds of environments usually do not last very long, often mere seconds,
    or even just fractions thereof, after which a new plan needs to be generated,
    exacerbating the performance problems.


    Where planners do shine is in situations where the AI can create long-term, complex,
    and stable plans where optimising its actions is important.


    # 6.4.9 HIERARCHICAL PLANNERS


    As with many of the other solutions, planners can be hierarchical. Hierarchical
    Task Networks is the most well-known version of a hierarchical planner. Such an
    approach has a significant benefit compared to non-hierarchical planners in that
    it is easy to create a system that is only creating a partial plan. This gets
    filled in as needed and can result in significant CPU savings.


    # 6.5 CONCLUSION


    At this point, you might be wondering which architecture is the best as all of
    them seem to have strengths and weaknesses. The short answer is that none of them
    is the best. They are all good at different things. Understanding these strengths
    and'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'weaknesses allows you to correctly analyse how a particular solution fits the
    needs

    of your project.


    You may also have heard of a successful game that used an architecture that this

    chapter suggests would not be the most suitable for that type of game and AI.
    For

    instance, there are several high-profile action games that use planners as the
    basis for

    their AI. Does that mean this chapter is wrong? No. Just because an architecture
    is

    not as well-suited to or is overkill for a specific problem does not mean that
    it cannot

    be used to solve that problem. Additionally, the decision of what architecture
    to use

    is not made in a vacuum. A company may have existing code, tooling, and expertise

    that may make using a certain type of architecture easier for them; however, as
    such

    things go, most decision-making architectures are just a small fraction of the
    AI code

    written for a project, and an initial investment in a well-chosen architecture
    can go a

    long way in making the development more pleasant.


    Another important point is that there is nothing preventing you from mixing

    and matching solutions. If the top level of your AI is best described by an FSM,

    but behaviour trees are more suitable for the rest, then you can use both, and
    if

    there is a need for deciding between those health and ammo pickups, you can have
    a

    utility-driven node in your behaviour tree. Of course, implementing multiple solutions

    comes with some significant additional work, and perhaps you can only pick one,
    in

    which case pick the one that is best suited to the problem you are trying to solve.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 7 High-Speed Vehicle Driving in Wheelman


    Dr Allan Bruce


    # 7.1 INTRODUCTION


    One of the core gameplay features of Wheelman is being involved in high-speed
    pursuits against AI-controlled enemy vehicles through the busy city of Barcelona.
    The game has two types of AI vehicles. The first is a richly populated traffic
    system consisting of vehicle AI that moves around the world slowly and in a predictable
    manner. The second type is a high-speed and unpredictable vehicle AI that behaves
    more akin to those seen in movie car chases. Players and AI need to navigate around
    the traffic and other obstacles whilst involved in high-speed pursuits with each
    other.


    This chapter describes the methods used to ensure the high-speed AI-controlled
    vehicles navigated around these obstacles and avoided collisions whilst maintaining
    the high speeds required to keep the player engaged in the gameplay.


    The approaches detailed throughout this chapter are termed ‘High Speed Vehicle
    Driving’ or HSVD for short. These include converting the navigable 3D world into
    a linear path-space that the AI can more easily reason with, where all obstacles
    are simulated and represented, the methods used to make the AI drive more organically
    and like a player, calculating an optimal solution to navigating the path-space,
    and the method by which this is then transformed back into the playable world.
    HSVD is what allows the AI to drive around the world of Wheelman in a fast-paced
    believable way.


    # 7.2 BUILDING PATH-SPACE


    Making AI reason in three dimensions is a daunting task. Thankfully, the playable
    world in Wheelman is essentially flat and can be easily represented as a 2D plane.
    Pathfinding is achieved using traditional nav-meshes which follow the streets
    for high-speed pursuits. To further simplify the problem-space for the AI, a transformation
    is performed from the top-down 2D world-space to a linear path-space. This representation
    removes all cornering from the problem space and ideally the AI vehicles just
    drive along this transformed space, and therefore only need to reason about their
    offset from the centre of the road. Image 7.1 shows the result of converting from
    world-space to path-space.


    The method used to do this conversion is to iterate over each segment of the road
    and use the length of the centre of the road segment to depict the length of the
    segment in path-space. To convert a point in world-space, calculate the perpendicular
    distance of that point from the centre line in addition to the perpendicular distance
    of'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'each side of the road at each end of the segment. The fraction of the point’s
    distance from the centre to the side of the road is used as the y coordinate in
    your path-space, where the centre of the road has a value of 0, negative numbers
    denote points to the left of the centre and positive values to the right. If the
    value of this y coordinate is –1, then the point would be at the very left-hand
    edge of the road, whereas +1 would be on the very right-hand edge of the road.


    To calculate the x coordinate for the path-space, perform a similar calculation
    as above but instead find the distance along the segment parallel to the centre
    of the road. This fraction along the segment would be 0 at the start of the segment
    and 1 at the end of the segment. Each segment is also indexed sequentially with
    0 being the current segment the AI is located on. Negative values are also used
    to represent segments behind the AI’s current segment.


    In Image 7.1, two example points are shown in world-space and path-space. Point
    A is on segment 2 and is approximately half the way down the segment so the x
    coordinate would be approximately 0.5. The point is a small amount to the left
    of the centre line so the y coordinate would be approximately –0.1. This would
    then be referenced as a 3-parameter vector as (2, 0.5, –0.1). Using the same techniques,
    it should be easy to see that point B would be represented in path-space approximately
    by (5, 0.9, 0.8).


    ![](img/f4a4f6e4de5338a867590c30638990cf_74_0.png)


    IMAGE 7.1 Converting from world-space to path-space.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'It is worth noting that these path-space y coordinates are not restricted from
    –1 to 1 as the nav-mesh is usually wider than the roads. Sometimes, the pursuits
    can wander off-road if the player guides them that way. The AI is allowed to follow
    off-road, but it does try to remain on the road as much as possible. The x coordinate,
    however, is bound from 0 to 1, and if it goes beyond, this then the point would
    be on the previous or next segment.


    # 7.3 OBSTACLES


    With a simple representation for AI vehicles to reason with, obstacles can be
    added to the problem space for the AI to avoid. The simplest type of obstacle
    is a static one and these come in two varieties: unbreakable and breakable. Since
    static obstacles do not move, you simply need to get the bounding box of the obstacles
    and transform each corner into the path-space. Since the vehicle being driven
    also has a finite size, expand each transformed point of the obstacle by half
    the width and length of the vehicle being driven. This then means you can reason
    about any point outside of an obstacle that the vehicle can occupy without overlapping
    the obstacle. Image 7.2 shows how an obstacle would be transformed from world-space
    into path-space. The road segment in the left image shows an obstacle with a bounding
    box labelled A, and a vehicle being driven with a bounding box labelled B. The
    road segment in the right image is the same road segment but represented in path-space.
    This shows how the obstacle''s bounding box is transformed into path-space. The
    dashed boxes are the half-extents of the AI vehicle which are expanded to the
    obstacle''s resultant bounds.


    ![](img/f4a4f6e4de5338a867590c30638990cf_75_0.png)


    IMAGE 7.2 Transforming obstacles from world-space to path-space.'
