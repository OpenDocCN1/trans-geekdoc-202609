- pgno: 134
  md: '# # 14 Navigating Broken Data


    Jonas Gillberg


    # ## 14.1 INTRODUCTION


    We have all seen it. Non-player characters (NPCs) standing still when they should
    be moving. Sometimes, it completely breaks their behaviour and they become unresponsive,
    whereas other times, they retain some basic functionality. For example, they continue
    to shoot at targets in the distance. It can be caused by the NPC standing in a
    place that has no nav-mesh, the exact position where they want to go has no nav-mesh
    or some similar problem. Throughout production, this is a common problem – content
    is updated, sometimes it is not flagged correctly for navigation, more often the
    nav-mesh is out of date, or some features are simply missing. This is to some
    degree to be expected. To have to wait for data to be fixed robs us of additional
    playtesting quality that could have been thorough production. This can be addressed
    by making the NPC navigation a bit more robust and fault-tolerant. This chapter
    will present a few ways in which this can be done: local resolution, relaxed navigation
    constraints, high-level goals, and feedback between these systems such that the
    right decision can be taken at the right level. These techniques have been successfully
    applied for test bots on titles such as Battlefield 2042, Plants vs. Zombies:
    Battle for Neighborville and Dead Space. A common counter-argument for making
    the system robust with internal fallbacks is that if the AI does not completely
    break down, the content will never be fixed. However, this depends on your development
    process. Detected errors and chosen fallbacks can be tracked. If those events
    also track positional information, they can be used to generate potentially very
    useful heatmaps to indicate the navigation quality at certain times or in certain
    parts of the game, with subtleties that may be lost if the only error response
    from the agent is an inability to function.


    # ## 14.2 LOCAL RESOLUTION


    # ### 14.2.1 DETECTION


    While navigating sections of the game without a nav-mesh, or with an out-of-date
    nav-mesh, or simply an environment containing dynamic obstacles not represented
    on the nav-mesh, the agent might get stuck. This applies especially to the area
    of bot testing where the bots try to navigate the game to the best of their ability
    even during very early stages of development. To be able to handle this, it must
    first be detected. One way to do this is to track the distance to the next waypoint,
    then if no progress has been made for a certain amount of time conclude that the
    agent is stuck. The amount of time that is considered being stuck, as well as
    the minimal move distance to reset this timer, is contextual. The time needs to
    be short enough to allow the agent to quickly resolve issues but must not be so
    short as to trigger during expected slow'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'movement such as a smoothly animated U-turn. In this scenario, the agent is
    either on what is thought to be a valid nav-mesh path or outside of the nav-mesh,
    so this cannot be resolved by repathing.


    # 14.2.2 TELEPORTATION


    Teleportation is a potential solution to the problem of an agent being stuck.
    It is a very powerful and easy-to-implement approach, but one that can produce
    some highly undesirable results. It is worth remembering that the agent is potentially
    in a situation where it is stuck without a reasonable way of extricating itself.
    If you do decide to teleport, where should that agent go? Teleportation can be
    handled at the path-following level by moving the agent to the next waypoint or
    even to the end of the path. Another reasonable teleportation target location
    is to a known good location. For example, where a friendly agent is located or
    straight to the target hostile. A hostile NPC that teleports to the exact location
    of the player can be very frustrating so it is something to avoid if possible.
    The value of teleportation depends greatly on how much you trust that the position
    the agent would teleport to is valid for what it is trying to accomplish. What
    if the agent is stuck because the next waypoint is blocked by a solid object which
    it will now teleport inside? Or if teleporting to the end of the path means that
    it would teleport outside of the currently loaded physics and fall through the
    world? Teleporting is also likely to cause the agent to skip important triggers
    in the world. Teleportation should be considered as a last resort. There are other
    approaches we should try first.


    # 14.2.3 LERPING


    Some situations might allow you to linearly interpolate (lerp) the agent’s position
    towards a goal. One important advantage of this approach is that it greatly reduces
    the risk that the agent misses important world triggers. Another advantage is
    that it is slower giving other systems (such as loading) enough time to respond.
    A major drawback is that it is even more likely than teleportation to put the
    agent in a state inside of or intersecting with another object, at least temporarily,
    given a likely reason for lerping would be that the agent is blocked by the object
    we are about to lerp through.


    # 14.2.4 AGENT RESET


    The worst-case scenario and very last resort is to simply de-spawn or kill off
    the agent. However, this does allow for a restart of the scenario, or perhaps
    to spawn in another agent, or if the agent being removed was insignificant, do
    nothing.


    # 14.2.5 INPUT SPAM


    For input-driven test bots, it has worked surprisingly well across many titles
    to simply press some combination of Jump, Sprint, Vault, Interact, Open Door,
    or whatever similar actions are available. This allows the agent to deal with
    obstacles in a way very similar to how a player would. It might be worth trying
    to detect the specific'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'type of obstacle the agent is attempting to navigate around, either with ray
    casts or other types of world queries, and this can potentially be done pre-emptively
    to avoid getting stuck in the first place. Depending on the situation, this pre-emptive
    scanning might cost more than it is worth and still might not detect the situation
    in time. If an agent becomes restuck in a short time period, you can cycle through
    different inputs depending on how many times in a row it has become stuck. Consider
    walking backwards or strafing whilst triggering the available actions. Sometimes,
    simple input spam will not be enough, and more complex or powerful methods need
    to be applied.


    # 14.2.6 Ray Cast Navigation


    It is also possible to build alternative ray- or shape-cast-based solutions for
    local workarounds when the navigation mesh is not reliable or as an extension
    of some form of local obstacle avoidance. This approach works well for open worlds
    with lots of moving obstacles. Before creating such a system, first consider whether
    you actually need it. It is very likely to be less exhaustive and reliable, with
    higher CPU runtime costs, than including the current unknowns at the nav-mesh
    level.


    # 14.3 RELAXED NAVIGATION CONSTRAINTS


    Pathfinding from one exact location to an equally precise target location is needlessly
    restrictive. The smallest input deviation on either the start or the goal causes
    the path to fail, and the agent goes nowhere. This is also not exactly what usually
    happens. Nav-mesh solutions often have some way of adjusting input start and goal
    positions to the nearest valid position on the nav-mesh, often referred to as
    snapping. A common reason for this might be that the positions are based on the
    physics positions and that the nav-mesh has been simplified and no longer matches
    the physics world that well. Increasing the snapping distance of the goal might
    avoid some of the cases where the path find would fail. Some navigation solutions
    simply allow you to specify the goal itself as a radius. In either case, trying
    to define a global constant for snapping or goal tolerance is hard, as how precisely
    the agent needs to get somewhere depends a lot on the context. For example, if
    an agent needs to interact with a specific object, this places greater constraints
    on where the agent can go, compared to if it just needs to get to an area to investigate
    something. Often, in more dynamic situations, such as an agent chasing another
    agent, it is likely that the current goal will change long before the end of the
    path is reached. A similar case could be an agent chasing the player, who moves
    off the nav-mesh for a short while. In this scenario, it is much better to get
    a position as close as possible to the player and to continue chasing, rather
    than to fail the path find and potentially break the chase behaviour as a whole.
    One way to mitigate this is to allow for intermediate goals.


    # 14.3.1 Intermediate Goals


    Intermediate goals can be used to allow for more permissive navigation snapping,
    followed by a more restrictive path find once the agent reaches that goal. Depending
    on your set-up, this could work similarly to how an agent follows a high-level
    navigation'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'path or simply be tracked as a Boolean to indicate the intermediate state.
    In the case of the NPC chasing a player that goes temporarily off the nav-mesh,
    it would allow the NPC to continue towards that intermediate goal and to re-path
    when the player moves. It is possible that even if the player does not move, the
    NPC could attack from such a position or something else will occur in the meantime
    which will render the issue irrelevant. This is different from simply keeping
    the last successful path until a better one is found in that it works even if
    the player is off the nav-mesh on the very first path find. The idea of an intermediate
    goal separate from the ultimate one can be beneficial in many situations as it
    can be more easily modified or discarded depending on the context.


    # 14.3.2 DIRECT PATH FALLBACK


    One of the things that intermediate goals do is to allow for a consistent way
    to manage goals that are temporarily, or permanently, off the nav-mesh. For temporary
    ones, the best case is for the situation to resolve itself by the time the intermediate
    goal is reached, and the subsequent path find is successful. However, if the goal
    is still unreachable from what is known to be the best possible position it can
    reach on the nav-mesh, it would need to go off the nav-mesh to reach it. To do
    this, you may need to lerp to the target position as discussed in 14.2 Local Resolution;
    however, if this should fail, teleportation should be considered.


    # 14.4 HIGH-LEVEL GOALS


    The high-level goal that drives an agent should be understood when determining
    which of the described approaches should be used. If the high-level goal of an
    agent is to get to an area, this should allow you to define a permissive area
    for the navigation goal, rather than specifying a position inside that area and
    relying on an otherwise defined constant for how permissive the snapping should
    be. On the other hand, if the agent needs to get to a very specific spot for some
    animation or special effect to play out correctly, teleportation might at times
    be the preferred option. High-level goals also have the benefit of being able
    to track progress independent of the current state of the agent''s navigation.
    Some issues might cause the agent to end up in some form of navigation loop, like
    falling and then getting up repeatedly. In this case, the high-level goal could
    have an absolute maximum time allowed for navigation or completion; at such a
    time, it might simply teleport the agent to the destination or use some other
    forceful means to resolve the situation. To better illustrate this, let us have
    a look at how all these things can fit together.


    # 14.5 PUTTING IT ALL TOGETHER


    While these techniques all have some value on their own, the sum can be greater
    than their parts. If a path find fails to find a path within the navigation goal
    tolerance, propagating that failure upwards to the high-level goal allows for
    a lot more context when acting on the path failure. In the context where reaching
    the goal is important, the closest current known position on the nav-mesh might
    be used as an intermediate'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'goal. For some other context, such as searching an area, it might make more
    sense to instead accept the end position of the path and make it the current navigation
    goal and also the high-level goal position. That way, it can be appropriately
    tracked at all levels and acted on accordingly. It might be that the goal itself
    is unimportant and if there are any issues with pathfinding, or path following,
    it should simply be aborted. Likewise, if the agent gets stuck following the path
    repeatedly, this might be what escalates the response to induce a teleport. You
    might also allow the local resolution failure to propagate all the way up to the
    high-level goal and on that level decide what to do. Once again, using the example
    of an area goal, it might make more sense to regenerate the navigation goal rather
    than to resort to some other form of resolution. Thinking about it as different
    levels and allowing the errors or issues to propagate up the hierarchy, and the
    resolution to be applied downwards can really help sort out ambiguous issues at
    the right level.


    # 14.6 REQUIREMENTS FOR NAVIGATING BROKEN DATA


    +   - Construct tolerant navigation goals.

    +   - Allow for navigation to intermediate goals to further refine path queries
    later.

    +   - Allow for off-mesh navigation.

    +   - Handle small obstacles and divergences from known navigation locally if
    possible.

    +   - Teleport is a better option than relying on perfect data.

    +   - It is better to teleport and report it as an error than to allow the agent
    to get stuck and hope it gets noticed and reported manually.

    +   - Make sure to propagate issues that need to be resolved, such as stuck events,
    up the control flow for context-appropriate resolution, like picking a new and
    better goal if possible.


    # 14.7 CONCLUSION


    This chapter has presented a few ways in which incomplete, broken or missing navigation
    data can be dealt with. Locally, through the use of abilities and teleportation.
    On a navigation level, using area goals, intermediate goals, and off-mesh navigation.
    And on a higher level, through the contextual generation of such area goals and
    appropriate handling of issues through propagation of feedback up the hierarchy.
    The intention has been to show how these techniques can help provide a more fault-tolerant
    AI implementation, especially throughout production, in the hopes that it will
    improve the quality of playtesting and ultimately the game.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# # 15 Environment Steering


    Rodolfo Fava


    # ## 15.1 INTRODUCTION


    Autonomous agent movement in a three-dimensional (3D) space can be challenging,
    especially when that involves handling multiple objectives at once. The games
    industry is constantly reinventing itself and the spearhead of innovation is,
    often, the necessity to push boundaries and find creative solutions to meet project
    requirements, without blowing the time and financial budget in which a game is
    allowed to thrive. This chapter aims to establish an intuitive, stateless, and
    efficient algorithm for implementing context-aware 3D navigation for air, space,
    and underwater movement, which expands upon Context Steering (Fray, 2015). The
    algorithm outlined in Fray (2015, p. 183) is very effective at tackling specific
    shortcomings of steering behaviours, being able to handle multiple conflicting
    objectives with much less oscillation than its predecessor.


    Context Steering (Fray, 2015), despite its contributions to renowned racing titles,
    admittedly falls short of managing 3D navigation, which is expected since the
    algorithm was originally made for a standard racing-game case, that is, without
    vertical mobility. This work presents a different way to deal with movement on
    three axes by an autonomous agent that moves around a level with complex shapes,
    accounting for various elements of threat and interest, dynamic or static, while
    giving the impression of natural movement to the human player. To this end, ray
    casting, interest maps, and linear algebra will be combined to produce a powerful
    framework. The result of which is an algorithm that offers a holistic solution
    to 3D autonomous agent movement that is context-aware, lightweight, and scalable.


    # ## 15.2 THE THEORY


    The first step to tackling 3D movement is accounting for 3D space. A solution
    can be found by dividing this complex task into three parts. Each of the three
    planes intersecting the unit will have their optimal direction calculated, and
    later those directions should be added together to produce a resulting vector
    that will guide the unit each update cycle. Over time, the algorithm will reproduce
    a natural-looking path for the unit to traverse through the environment while
    being context-aware.


    For starters, let us determine the three intersecting planes of the unit. The
    first plane, akin to Context Steering (Fray, 2015), is defined as the Alpha Plane
    see Image 15.1a. This can also be described as z=0. Likewise, the two other planes
    can be derived by taking each of the remaining coordinates equal to zero. For
    instance, by taking x=0, yields the Beta Plane, shown in Image 15.1b. Lastly,
    assigning y=0 yields the Gamma Plane, illustrated in Image 15.1c. Each plane will
    have its context'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'evaluated separately, then each resulting vector will be added together. The
    process of calculating each plane’s resulting vectors is discussed in detail in
    Section 15.3 Applications.


