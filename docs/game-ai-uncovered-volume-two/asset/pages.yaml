- pgno: 107
  md: '# 10.4.3 Step 2: Establish Learning Subtrees


    Early design of the context guides ad hoc implementation of the behaviour flow
    but does not provide information about the inclusion of learning in the design.
    To incorporate learning into the agent''s behaviour, designers need to identify
    flow segments that would benefit from being modelled with learning logic. Likely
    candidates include segments that fulfil any of the following conditions:


    +   - Need to be highly adaptive

    +   - Cannot be adequately represented using ad hoc structures, either due to
    the limitations of manually authored logic or the prohibitive complexity that
    arises when attempting to scale them up

    +   - Are expected to produce imitative output, based on demonstration data


    The decision to model a behaviour flow segment with learning should be supported
    by an informed selection of its learning policy generation method. Any individual
    technique compatible with context requirements is acceptable, but ensemble methods
    have been known to produce higher quality output if used effectively (Yannakakis
    & Togelius, 2018). The technique choice, in conjunction with context information,
    determines the data requirements for the target learning logic, and the scope
    of the follow-up technical work required.


    # 10.4.4 Step 3: Implement Context Architecture


    Establishing a technical foundation of the behaviour context architecture involves
    BT flow structuring and implementing game environment-specific solutions to facilitate
    the flow of the behaviour context. These tasks may vary across different game
    environments and tools used, but the workflow remains the same:


    +   - Implement functionality to interface with the game environment through BTs

    +   - Implement ad hoc BT flow (macro-, proxy- and microlayers)

    +   - Implement stubs of learning subtrees in the ad hoc BT flow

    +   - Implement ad hoc fallback logic for each learning subtree stub


    Once the implementation reaches a stage when evaluation becomes possible, an iterative
    cycle of testing and fine-tuning can begin. The implemented context architecture
    should be evaluated in the game''s environment, with respect to the identified
    behaviour goals and functional considerations. If the produced behaviour is valid
    and representative of the intended behaviour context, an ad hoc agent model can
    be declared stable. Otherwise, the architecture needs to be revised by repeating
    one or all Steps 1–3, until the issues are resolved.


    The output of this step is expected to be a BT-based implementation of the behaviour
    context outlined in Steps 1 and 2, including stub versions of learning subtrees.
    This ad hoc version of the behaviour flow will constitute the worst-case execution
    scenario, in terms of performance and quality.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# 10.4.5 Step 4: IMPLEMENT LEARNING


    At this point, the stable ad hoc agent model is already equipped with stub learning
    subtrees, which are still devoid of the actual learning logic. The learning logic,
    expressed within dedicated learning nodes, needs to be implemented and inserted
    into each learning subtree. The specifics of a dedicated learning node implementation
    will depend on a local set of technical factors, including the project architecture,
    tools used and the implementation of the game environment. In some cases, a single-node
    implementation will suffice, for instance, if the same learning technique is to
    be used across many learning subtrees. More complex scenarios would likely require
    a range of learning node specialisations, which could address local training and
    inference requirements.


    # 10.4.6 Step 5: ACQUIRE DATA


    Different learning methods have varied data requirements. In some cases, such
    as with RL techniques, data will be derived from training-time observations of
    the agent, and as such would have already been covered by the learning implementation
    in Step 4. If that is the case, Step 5 can be skipped. Otherwise, appropriate
    data acquisition and transformation procedures will be necessary to prepare valid
    datasets for use in target learning models. It is beyond the scope of this workflow
    to explore this process, but it can be as simple, or as complex, as required.
    Input datasets must be usable in the target game environment and compatible with
    the policy generation strategy of the relevant learning subtrees.


    # 10.4.7 Step 6: TRAIN LEARNING MODELS


    The final step of the workflow focuses on iteratively training learning models.
    Each iteration of training produces an output agent model to be evaluated in the
    context of the game environment, to determine if its behaviours are valid and
    of satisfactory quality in terms of the outlined behaviour context. Multiple passes
    of training are likely since revising of the parameterisation and timing of training
    will impact the generated policy. It is recommended to conduct the agent model
    inference evaluation in the target game environment. Validation of behaviour context
    from Step 3 should be repeated in Step 6. If any issues with the underlying context
    are detected, Steps 1–3 might need to be repeated to resolve any problems identified.
    The evaluation of the quality of the behaviour is in many ways subjective and
    requires an assessment from a human expert. To complement that assessment, data-driven
    measures should be used to quantitatively compare different agent output model
    revisions. This enables automating of the iterative training-evaluation cycles
    and potentially driving their revising using evolutionary algorithms, to procedurally
    improve the output model. Quantitative comparison may focus solely on output fitness,
    but ultimately, a holistic perspective of the game context-derived measures is
    likely to be relevant for output quality. Quality concerns could lead to repeating
    all or some of Steps 4–6 to improve the learning implementation, its input datasets
    or policy training. After the'
  merge: -1
  img_proc: true
