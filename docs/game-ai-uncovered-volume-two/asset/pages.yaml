- pgno: 20
  md: '+   - **Collecting an item and adding it to your inventory.**

    +     If the item was subsequently destroyed or picked up by another player, then
    the correction will see it removed from the inventory.

    +   - **Striking an object with a weapon.**

    +     Upon striking an object, a weapon''s health is reduced, the wielding character''s
    stamina is reduced, the hit object''s health is reduced in the logical world,
    and VFX are spawned in the cosmetic world. In _The Survivalists_, it was originally
    decided that any VFX spawned from false hits should be culled upon correction,
    but this looked stranger than letting them play out.


    # 1.3 NON-PLAYER CHARACTER REPLICATION


    While player character movement in _The Survivalists_ is achieved by frequent
    replication of their position, orientation, and velocity, it was not necessary
    or efficient to do the same for NPCs. Since NPCs will plan their movement and
    actions ahead of time in order to validate that a path is valid and that an action
    can be performed, it is wasteful to send frequent data packets representing changes
    in their position when instead a full representation of their future movement
    and action(s) can be transmitted to all cosmetic worlds.


    Upon deciding on an action to perform, for instance attacking a player, an NPC
    will have a path generated to the location from which their attack will be launched.
    Since this path must be generated to confirm that the action can be completed
    and will be followed, this path data can be optimised and leveraged by sending
    it to every cosmetic world attached to this logical world. When a path is generated,
    it goes through a post-process in which any inline points are removed as displayed
    in Image 1.3 to provide the smallest amount of data to be replicated to the cosmetic
    world.


    ![](img/f4a4f6e4de5338a867590c30638990cf_20_0.png)


    IMAGE 1.3 Left, a raw generated path. Right, a path pruned of all inline points.'
  merge: -1
  img_proc: true
- pgno: 21
  md: "Once the path data has been slimmed down to the fewest points required, it\
    \ goes through another process to provide all information required by the cosmetic\
    \ world. The resulting data is known as a Path Chunk.\n\n# 1.3.1 Path Chunks\n\
    \nA path chunk is a representation of a path that will be followed by an NPC and\
    \ contains a list of multiple Path Points. A path point contains three key pieces\
    \ of information, as shown in Code Listing 1.1, that allow the cosmetic NPC puppet\
    \ to perfectly follow the path, exactly as their logical-only counterpart will.\
    \ These include the following:\n\n+   - **Position**: The global position of this\
    \ point within the world.\n+   - **Arrival Time**: The time at which the path\
    \ follower will arrive at the path point.\n+   - **Speed**: The speed at which\
    \ the character will be moving upon reaching the path point.\n\n```\nCode Listing\
    \ 1.1: The information required to represent both spatial and temporal points\
    \ on a path allowing a cosmetic puppet to follow the path in unity with their\
    \ logical counterpart.\n\nstruct PathPoint\n{\n    Vector2 position;\n    float\
    \ arrivalTime;\n    float speed;\n}\n```\n\n# 1.3.2 CREATING PATH CHUNKS\n\nAfter\
    \ generating and pruning a path, and before packaging it up to be sent to the\
    \ connected cosmetic world(s), a further step must be completed in order to set\
    \ up the arrival times and speeds at each path point.\n\nFirst, the velocity of\
    \ each point must be calculated. Each character has a predetermined walking speed,\
    \ running speed, acceleration, and deceleration to be used when beginning and\
    \ ending their movement. When turning corners, no deceleration and subsequent\
    \ acceleration are applied. Using simple linear acceleration, it is possible to\
    \ determine the distance required to accelerate to and decelerate from the desired\
    \ speed when following a path. This allows an additional two path points to be\
    \ added to the path, one at which acceleration completes and a top speed is reached,\
    \ and one at which deceleration begins, with the final path point being the point\
    \ at which speed reaches 0. Image 1.4 shows a path with all of this representative\
    \ information at each path point, including the points injected into the path\
    \ to show where acceleration ends (B) and deceleration begins (E)."
  merge: -1
  img_proc: true
- pgno: 22
  md: '![](img/f4a4f6e4de5338a867590c30638990cf_22_0.png)


    IMAGE 1.4 A series of path points ready for cosmetic world consumption.


    # 1.3.3 CONSUMING PATH CHUNKS


    Upon receiving a path chunk, the cosmetic worlds’ entity will queue it until the
    arrival time on the first path point is reached and will then commence with interpolation
    along the path. Since the path points contain all the data required to interpolate
    the entity between each path point, the amount of work required of the cosmetic
    entity is small. An inverse of the linear acceleration formula can be used to
    determine the position between points when interpolating between two path points
    with different speeds, whereas a much simpler interpolation can be performed between
    two points with matching speeds. The same solution is performed on the logical
    entity meaning both entities, logical and cosmetic, will be fully synchronised.
    In addition to the interpolation along the path in both worlds, corner smoothing
    is applied to make navigation of the path less angular. Upon approaching a corner
    when following a path, an NPC (logical and cosmetic) will use a quadratic function
    to create a curve between two points equidistant from the actual path point, one
    before and one after. Images 1.5 and 1.6 show the resulting path that NPCs will
    precisely follow in both the logical and cosmetic worlds.'
  merge: -1
  img_proc: true
