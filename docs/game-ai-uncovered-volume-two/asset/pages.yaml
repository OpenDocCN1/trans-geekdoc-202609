    | Logical World | Cosmetic World |

    | :--- | :--- |

    | Entity Type | Entity Type |

    | Entity Unique Id | Entity Unique Id |

    | Position | Position |

    | Rotation | Rotation |

    | Collision shape (AA BBor Circle) | Collision shape |

    | Health | Sprite Renderer |

    | | Animator |

    | | Shadowcaster |

    | | Health UI |


