- pgno: 76
  md: 'When adding these obstacles to the path-space, a weight is included that discourages
    the AI from choosing to drive through them. If the obstacle is unbreakable, simply
    add a very large weight but if the obstacle is breakable, apply a weight proportional
    to the mass of the obstacle. For example, if one obstacle were a traffic cone,
    it would have a very small weight, whereas if it were a bus stand, it would have
    a much higher weight. These weights are discussed in more detail later.


    # 7.4 SIMULATING VEHICLES AS OBSTACLES


    To avoid other vehicles, a method to map the vehicle''s bounds into path-space
    as obstacles is required. Since these vehicles are dynamic, you will need to simulate
    where they will be relative to your own vehicle at each location on the path-space.
    Split this into two categories: deterministic and non-deterministic. As the name
    implies, deterministic vehicles are those whose location and can be accurately
    predicted over time. You can use this for the traffic within the game as you know
    what speed the traffic vehicles are driving at and their chosen route through
    the traffic system. For simplicity, traffic in Wheelman did not generally react
    to pursuits happening in its proximity and drove as if there was no pursuit. The
    only time the traffic reacted was when a head-on collision was imminent, in which
    case they would choose to swerve out of the way.


    Since the speed that the traffic vehicle will be travelling at is known and you
    control your own vehicle speed, you can predict the time it would take to collide
    with the vehicle. You can also calculate the time it would take to completely
    pass the vehicle. For simplicity, these calculations will be discussed with the
    assumption of constant velocities; however, in-game, you need to consider acceleration
    too. If the velocity of the traffic vehicle is $v_t$ and the velocity of the AI
    vehicle is $v_a$, then you simply find the difference of these to get the closing
    velocity $v_c$:


    ```

    $v_c = v_a - v_t$

    ```


    Now that you know the closing velocity, you can use the distance between the vehicles
    (the distance between the centres plus the half-length of each vehicle), $d_{ta}$,
    to determine the time until the collision occurs, $t_{col}$, simply using:


    ```

    $t_{col} = d_{ta} / v_c$

    ```


    If you take the sum of the length of both vehicles, $l_{ta}$, and use the closing
    velocity, you can then find the additional time it would take to overtake the
    vehicle as:


    ```

    $t_{overtake} = l_{ta} / v_c;$

    ```


    therefore, the total time to approach the vehicle and pass it is simply the sum
    of these times:


    ```

    $t_{pass} = t_{col} + t_{overtake}$

    ```'
