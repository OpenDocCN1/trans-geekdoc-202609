- pgno: 148
  md: '# 15.6 CONCLUSION


    All in all, Environment Steering provides an innovative take on context-aware
    3D movement that can easily be scaled and adapted to fit the requirements of a
    game. Even so, it is expected that high-quality results will still rely on appropriate
    balancing over many iterations. If any performance bottlenecks arise, practices
    such as caching and space partitioning are suitable approaches that will improve
    the efficiency of the approach detailed in this chapter.


    # REFERENCE


    Fray, A. (2015) Context steering. In *Game AI Pro 2*, Edited by Steve Rabin. CRC
    Press, Boca Raton, FL, pp. 183–193.'
