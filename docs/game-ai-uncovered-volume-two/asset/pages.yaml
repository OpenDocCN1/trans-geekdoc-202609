- pgno: 38
  md: 'item types being equipped or the proximity to objects, and the like. In such
    an event, the action being requested will either be blocked or will interrupt
    the active action(s). For example, an action that interrupts other actions is
    the Death Action. This is the highest priority action as it interrupts all others.
    An example of an action that could be blocked by another is the Attack Action,
    if requested when another Attack Action is still active.


    Actions are implemented in such a way that they are not tied to a particular item
    to use or object to interact with but deal explicitly with interfaces. For example,
    the Interact Action can be performed on any object in the world implementing the
    Interactable interface. Interaction Actions can range from lighting a torch to
    opening a storage chest or speaking with an NPC. The logic driving the interaction
    lives on the interactable object itself. An Attack Action on the other hand can
    be performed with any item equipped so long as the item implements an Attacker
    interface. Using this logic, any item can be set up to be used as a weapon with
    the logic driving the attack defined by the object itself.


    The actions that can be performed by a character require different results depending
    on the performing character and the item that they have equipped, if any. This
    is achieved by feeding an ActionParameters object, passed to the actor''s PerformAction
    method, to each action instance. Using an Attack Action as an example, the Attack
    action parameters object, derived from the base action parameters class, that
    is passed to the action, comes from the item that the character has equipped.
    This allows each item to define the effect of their use and allows any item to
    be used as a weapon by simply adding to it the component that hosts this attack
    data.


    # ## 3.5 MIMIC BEHAVIOUR


    Mimic Signatures and a monkey''s actions are tied together using behaviour trees.
    For each mimic signature that a companion can interpret, there is a corresponding
    behaviour tree. These trees, as with the actions, are kept relatively general
    purpose to allow reuse. For example, most of the many gather and deliver behaviours
    share the same behaviour tree with simple branches that deal with different gather
    locations and delivery destinations, such as the ground versus a storage container.
    The items that are to be used, the subjects they are to be used on and the local
    area of the task being mimicked does not need to be known at the time of creating
    the behaviour tree but is passed in every time a new Mimic Behaviour begins. Image
    3.5 shows a simplified version of the behaviour tree used for gathering and delivering
    any item to any receiver or location.'
