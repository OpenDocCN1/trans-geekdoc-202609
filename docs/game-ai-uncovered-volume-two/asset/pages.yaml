    There are other conclusions that can be drawn from the data which we’ll leave
    as

    an exercise for the reader. Each one will help to identify ways to iterate on
    Loncey

    and improve the believability in this creature. Finally, after iterating, developers
    can

    rerun a similar test and iteration process until they are satisfied with the overall

    results.


    # 17.4 CONCLUSION


    Creatures can play an integral part in world-driven video games. They provide

    audio-visual feedback over time which players can perceive. This lets them under-

    stand what creatures do and how they do it. And when done right, it may promote

    ‘presence’ in the player.


    The CBS was presented as a tool to aid AI programmers when developing crea-

    tures. It works on a 5-point scale and catered towards evaluating creatures through

    the lens of believability.


    Because content creation is a two-phased iterative process (creation followed
    by

    evaluation), the scale aims to complement existing architectures and algorithms.
    In

    particular, it is meant to help developers shift their mindset to reflect upon
    this to max-

    imise creatures’ believability, through a set of guidelines, and, subsequently,
    assess

    their results in a contextualised environment. By itself, the CBS can assess individual

    creatures, providing an idea of which areas need additional work. However, several

    evaluations can be combined to produce a CBS which allows developers to compare

    creatures and identify their strengths and weaknesses.


