    +   Fikes, R. E. and Nilsson, N. J. (1971) Strips: A new approach to the application
    of theorem proving to problem solving, Artificial Intelligence, 2(3–4), pp. 189–208.

    +   Millington, I. (2019) Artificial Intelligence for Games, Boca Raton, FL: CRC
    Press.

    +   Orkin, J. (2003) Applying goal-oriented action planning to games, AI Game
    Programming Wisdom, 2, pp. 217–228.'
