  md: '![](img/f4a4f6e4de5338a867590c30638990cf_106_0.png)


    IMAGE 10.3 Context-guided design deployment workflow.


    +   * Step 1: Design behaviour context

    +   * Step 2: Establish learning subtrees

    +   * Step 3: Implement context architecture

    +   * Step 4: Implement learning

    +   * Step 5: Acquire data

    +   * Step 6: Train learning models


    # 10.4.2 STEP 1: DESIGN BEHAVIOUR CONTEXT


    First, the context of the intended behaviour flow must be identified, to inform
    the agent’s AI design. By performing a requirements analysis of the target game
    environment with respect to the available action space and agent’s goals, behaviour
    objectives can be mapped to the *macrolayer*, selected actions to the *microlayer*
    and their connections to the *proxy layer*, if necessary. These assumptions can
    only be validated after the initial model is deployed. This may not be possible
    in the early stages of production, as complete knowledge of the game environment
    might not be available yet. In such a case, knowledge updates should be iteratively
    integrated into the design and expand the original scope of the behaviour context.'
