  md: '# 8 AI Awareness in Sports Games


    Paul Roberts


    # 8.1 INTRODUCTION


    In any sports game, there is a lot for a non-player character (NPC) to assess.
    This chapter will focus on the game of American Football. When on Offence, NPCs
    need to be aware of their teammates as well as their opponents, they need to position
    themselves such that they can receive the ball without an interception occurring,
    and they need to assess threats and react accordingly. When on Defence, analysing
    threats posed by opposing players is a challenge. As plays are secretly selected,
    there is no way for the Defence to know what an opposing player will do and where
    they will go. This is a core component of the game and reacting appropriately
    is what stops the Offence from gaining those precious ten yards.


    However, the human player needs to feel like they are the ones making an impact.
    If the AI shuts down every play, or alternatively fails to shut down any plays,
    the human player feels cheated, or as though the game is playing itself. Then
    the AI team is in a constant cycle of “the Offence is too good”, so improvements
    are made to the defensive AI. Then, “the Defence is too good”, and additional
    changes are made to improve the Offence. The cycle goes on. It would be easy to
    simply modify stats, such as speed, to allow one team to perform better, but this
    can be a blunt tool.


    This chapter details a couple of the approaches that were taken to allow for different
    players who have the same role (i.e., two Cornerbacks), and process the same code,
    to act differently. This approach allowed for the correct decisions to be made
    by the AI, but as those decisions were based upon what was deemed as a threat,
    via their awareness of the opposition; at that time, different and more believable
    responses were able to be chosen.


    # 8.2 POSITIONAL AWARENESS


    Take the role of a Wide Receiver. It is their job to get into a position where
    the quarterback can safely pass the ball to them. This could mean getting as far
    downfield as possible and creating separation between themselves and the cornerback
    whose job it is to mark them, or it could mean cutting in or zigzagging to send
    the Cornerback going in the wrong direction to create that separation. If the
    chosen approach is to simply run downfield, then the speed difference between
    the Wide Receiver and the Cornerback is all that is required. This does not show
    intelligence from the Wide Receiver though. What about a Wide Receiver who has
    the same speed as the player marking them or who is slower. Such a player should
    never be selected for the team'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'and will always be a bad option for a pass. It is in these situations where
    AI awareness becomes invaluable.


    Awareness of opposing players is achieved by allowing each player to retain their
    own local information about their opponents. This local information is what they
    think about the opponent and not actual information. By refreshing this data periodically,
    you ensure players have a degree of awareness but also allow players to react
    more slowly to developments on the field.


    To achieve this, a list of structs is required per player, where each struct in
    the list refers to an opponent. The struct contains the following details:


    +   - Player ID

    +   - Last known position

    +   - Estimated position

    +   - Direction

    +   - Velocity

    +   - Current refresh time

    +   - Refresh duration


    The idea is that each player will keep track of where they think the opponents
    are on the field. So, at the start of the game, each struct will be populated
    with the exact details of the opponent in question. As a play progresses, the
    player will refresh the struct with accurate positional data when they look at
    that player or when the refresh time has expired. At all other times, the data
    in each struct will be updated with a guess as to where the player thinks the
    opponent will be. This is achieved by taking their direction and velocity and
    calculating what position on the field they would be if they had continued with
    that trajectory.


    Take a look at Image 8.1. The player in black is a Cornerback and is looking to
    defend any throws to the Wide Receiver behind them. The Cornerback looks to position
    themselves between the Quarterback and the Wide Receiver, usually a yard or two
    away from the Wide Receiver. The image also shows the route the Wide Receiver
    is planning to take. The Cornerback does not have this information and should
    react to developments as they play out on the field. At this stage, the Cornerback
    stores the position of the Wide Receiver, the direction he is running and his
    speed and then sets the refresh counter ticking.'
  merge: -1
  img_proc: true
