  md: '# # 23 Unleashing Mayhem

    # The Demolition Derby Game

    # Modes of DiRT: Showdown


    Dr Nic Melder


    # ## 23.1 INTRODUCTION


    _Dirt Showdown_ is a racing game developed and published by Codemasters as a spin-off
    to the main _DiRT Off Road_ series. The game focused on a more arcade-style experience
    compared to the simulation-focused nature of the main _DiRT_ series and featured
    both competitive circuit-based and arena-based events where you competed directly
    against the AI. There were also various single-player events (Hoonigan Events)
    as well as multiplayer-only events (Party Modes). Business reasons dictated the
    release date which necessitated that _Showdown_ was designed to be an easy and
    quick game to make (the terms "reuse" and "reskin" were said a lot). From start
    to final submission, there were only around five months! In this time scale, it
    was necessary to create an entirely new arena-based vehicle AI system to support
    three new game modes: Rampage (traditional arena-based demolition derby), Knockout
    (think sumo wrestling but with cars) and Hard Target (everyone against the player,
    longest survival time wins).


    This chapter describes how the arena game modes were developed, and how the short
    project duration directly impacted the code architecture/decisions made.


    # ## 23.2 DESIGNER CONSTRAINTS


    # ### 23.2.1 CAR HANDLING


    The first decision that had a major impact on the design was what the handling
    would be like. Thankfully, it was decided that _Showdown_ would be very much an
    arcade game and so the handling was designed to be very easy to drive and very
    accessible. To achieve this, the car handling designers and vehicle physics programmers
    created a comparatively simple driving model, which essentially had no sliding
    or low top speeds. In fact, the top speeds were so low (approximately 50 mph/80
    kph) that they removed the speedometer from the game to hide the fact!


    It was also decided that only a few selected vehicles would compete in the Arena
    modes. Only ten different cars needed to be controlled by the AI. Furthermore,
    the main handling configurations were essentially the same across all the vehicle
    types. Even though they had different masses, steering locks, accelerations and
    top speeds,'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'the same basic handling configuration meant that the same AI steering and pedal
    controllers could be used for all the vehicles.


    The actual vehicle simulation was split into two parts, where there was an "invisible
    sled" that the wheels were attached to and then there was the visual body that
    was attached to the "sled" via springs. Doing it this way meant that the "sled"
    (which is essentially what the AI was controlling) could be set up and signed
    off early, allowing the other elements, such as body roll and damage to be built
    afterwards. It also meant that any changes to how the vehicle appeared visually
    whilst being driven could be adjusted without affecting the underlying handling,
    which would result in needing to rework the AI controllers. This meant that if
    it was decided that the truck needed more body roll, instead of adjusting the
    suspension to allow for the roll (which would affect the handling), instead, the
    connecting springs between the "sled" and the bodywork would be adjusted instead.
    This disconnect between the handling and the visuals allowed the AI to be developed
    on a stable handling system, whilst also allowing the designers to adjust and
    personalise the different vehicles without there being any huge impacts (or marginal
    impacts) on the vehicle AI''s ability to control them. Because it was decided
    early on that the cars would be more arcade feeling, and also that the arena cars
    would be fully fictional, the fact that the cars were now less realistic was not
    an issue.


    # ## 23.2.2 ARENA DESIGN


    Design rules for how the arenas were to be designed also needed to be established
    at the beginning of the project. Essentially, there were only two rules established:


    +   1. The arena floor needed to be a continuous height throughout. Continuous
    height did not mean flat, just that there could be no discontinuities anywhere
    in the arena. For example, you could not have a raised section separated by a
    wall, but with ramps on either side.


    +   2. Any fixed/unbreakable obstacles inside the arenas needed to be containable
    in a circular boundary.


    Of course, both of these rules were ignored by the artists, but at least the (truly
    awesome) level design team understood the need for these requirements so were
    able to rebuild them to adhere to the design specifications. In total, six arenas
    were designed and released, although these were further modified, by blocking
    off areas with barriers, to create eight distinct arenas. The final main arenas
    released are shown in Image 23.1.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '![](img/f4a4f6e4de5338a867590c30638990cf_213_0.png)


    IMAGE 23.1 The six main arena designs showing the outer boundary and any obstacles
    that were inside the arenas (marked as circles). The vehicles would spawned outside
    the arenas on ramps and would drive into the arenas once the game started. The
    spawn points and the ramps are not shown in the image.


    # 23.3 CONTROLLING THE CARS


    When Showdown was developed, four racing games (three DiRT games and one Grid
    game) had already been released, so the engine was already mature and well-tested,
    with a lot of useful features that could be leveraged.


    # 23.3.1 BASIC SPLINE GENERATION


    The one thing that the AI engine did well was to follow a spline. In the previous
    racing games, the splines would be set up by the level designers, but since this
    was an open arena with no fixed “route” another approach was needed. Instead,
    dynamically created splines were decided upon. This was done in two parts:


    +   1. Determine where to go.

    +   2. Create a spline from the current position and orientation to the target.


    Determining where to go was the job of the “Demolition Derby Overseer” (described
    later) which would provide a target position inside the arena. The current position
    would be the vehicle’s starting point. Creating a straight line between these
    two points and then telling the vehicle to follow the line would have worked (it
    did work, as this was the first thing tried), but it is not necessarily a great
    solution since it did not consider the turning circle of the vehicle or any obstacles
    in the way of the actual driven path. This necessitated using some type of spline.
    As the orientation of the'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'target position was of no concern but the orientation of the active vehicle
    was, a Cubic Bezier curve was used to generate the spline for the vehicle to follow.


    ![](img/f4a4f6e4de5338a867590c30638990cf_214_0.png)


    **IMAGE 23.2** A simple Cubic Bezier Spline. Note that the spline starts at the
    front of the car and not in the middle. This is because the steering controllers
    would minimise the error at the front of the vehicle when calculating the steering
    direction.


    A Cubic Bezier Spline requires three points and is depicted in Image 23.2. P0
    is the vehicle''s initial position and P2 is the target position. But where should
    P1 be placed? Since we want the spline to start with the orientation of the vehicle,
    P1 needs to be somewhere along a line through P0 in the vehicle''s facing direction
    (V). But how far along this line should P1 be placed? Through experimentation,
    it was found that a good spline that the vehicles could follow could be created
    by placing P1 at a projected position along the line V, 1/3rd of the length between
    P0 and P2 provided that P2 was not behind P0. A minimum distance from P0 was also
    always adhered to and, again, this distance was determined through experimentation.
    This was calculated as follows:


    ```

    float Dist=(P2-P0).Length();

    float ProjectionDist=(Dist/3)<MinDist ? MinDist : (Dist/3);

    Vector3 P1=P0+V * ProjectionDist;

    ```


    # 23.3.2 SPLINE FOLLOWING


    Once an appropriate path had been generated, to make the vehicle follow it requires
    converting the Bezier curve into a Catmull-Rom spline. Although it is possible
    to follow a Bezier curve directly, all the systems in the AI engine were already
    set up to follow Catmull-Rom splines, so converting a generated curve to this
    format meant that there was no need to change any of the spline following code
    (remember, there was less than five months development time to build these systems).
    One of the advantages of the Catmull-Rom spline is that it goes through every
    point, so converting to a Catmull-Rom spline just means sampling and storing the
    points along the curve (Dunlop, 2005).'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'The spline data curvature was then analysed to determine if the curvature was
    too tight and required a brake line and hold line to be added. Brake lines are
    used to set a speed at a point on a curve, and a hold line is the point where
    the vehicle could go to full throttle again. The brake lines were placed if the
    curvature was above a threshold (again determined by experimentation) and similarly
    the hold lines were placed in the same way as shown in Image 23.3. However, it
    is not clear what speed should be set for the brake lines? Typically, these speeds
    would be set manually by the level designers, or by tools that repeatedly run
    the vehicle through the corner whilst adjusting the speed, but since the splines
    were automatically generated, the level designers could not determine the speed.
    To generate the speed by simulating the tool (during the current frame update)
    is both computationally expensive and hard to implement.


    ![](img/f4a4f6e4de5338a867590c30638990cf_215_0.png)


    IMAGE 23.3 Spline showing where the brake and hold lines would be automatically
    placed.


    Luckily, this was trivial on Showdown since one of the new features of the previously
    released game (DiRT 3) was the use of curvature statistics for determining a vehicle’s
    speed through a corner. Each vehicle’s curvature statistics were generated by
    driving the vehicles around circular tracks and increasing their speed until they
    could no longer follow the spline. This would determine the maximum speed through
    a given radius. When other corners of the same radius/curvature were then encountered,
    this speed could be read from a table and applied. In practice, on DiRT 3, this
    worked reasonably well at getting the cars to run at 90% of the target speed,
    so this method was used to generate the initial speeds for the brake lines. Further
    tools would then iterate through each brake line adjusting the speeds as appropriate
    to get better cornering speeds/better track times. This iterative step was required
    to take into account the weight shift caused by the previous corners. However,
    for Showdown, this system worked well since the handling was essentially a “sled”
    that had no weight shift. So, to determine the speed through the brake line, it
    was a matter of getting the spline curvature at that point and then looking it
    up in the curvature data.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'There would be times though when the vehicle would fail to follow the path
    and would drift away from the spline. This could have been due to the generated
    spline being too tight for our vehicle to physically drive or because a different
    vehicle collided with it (or even because the steering controllers were not tuned
    that well), so if the vehicle was ever more than X m from the spline, it would
    trigger a spline rebuild request (X was between 5 and 10m).


    # 23.3.3 ADVANCED SPLINE GENERATION


    One of the novel features of the arenas was that they were not all simple “bowls”
    but were a variety of shapes and could also have fixed, unbreakable structures
    in them. Although the FlatOut games (Bugbear Entertainment, 2004) at the time
    contained objects in their arenas, these were fully destructible so it did not
    necessarily require special “structure avoidance” code for the AI cars. Showdown
    arenas were not circular. These two facts meant that an “arena representation”
    was needed to store the arena edges, as well as the boundaries of the obstacles
    inside them. The boundaries were stored as a simple Catmull-Rom spline and the
    fixed obstacles were stored as a circle with a centre and radius. Not all obstacles
    in the arenas were circular, but they were always stored as simple circles to
    simplify the collision detection system. An additional “inner boundary” was also
    created that typically just followed the outer walls but offset towards the inside
    by approximately 20m. The AI arena markup is shown in Image 23.4.


    ![](img/f4a4f6e4de5338a867590c30638990cf_216_0.png)


    IMAGE 23.4 Arena representation showing the outer arena boundary, the inner boundary,
    and the obstacles’ boundaries (marked as circles).


    As described above, the spline was generated between the vehicle and the target.
    But what if the generated spline went through one of these fixed obstacles, or
    even outside the arena? Depending on the situation, either the spline would need
    to be “subtly” modified, or maybe totally regenerated.


    # 23.3.3.1 Driving through an Obstacle


    In an arena with obstacles, the generated spline may go through an obstacle. It
    is both possible and computationally cheap to determine the bounding box of a
    cubic Bezier curve, so a first pass was done to determine if the curve’s bounding
    box intersected an obstacle’s bounding circle. Assuming this was the case, a more
    detailed'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'check was done to determine if the spline intersected the circle (Image 23.5).
    Finding the closest point on a spline (or Bezier curve) is non-trivial, iterative
    and involves complex maths, so instead, the generated cubic Bezier curve was converted
    into a series of points along the curve, and each individual point was tested
    against the circle. Calculating the points was required for converting the Bezier
    curve to the Catmull-Rom spline, so if no intersection was found then the converted
    spline could then be used for the path following.


    ![](img/f4a4f6e4de5338a867590c30638990cf_217_0.png)


    IMAGE 23.5 The initially generated spline (P_car to P_target) intersects the circle
    (centre C, radius r). The entry and exit intersection points are P_i1 and P_i2.


    However, what if an intersection had been found? In this case, you want to push
    the spline so that it is outside of the circle, so the entry and exit intersection
    points need to be found. Using the first and last points that were found inside
    the circle from the simple circle point test, a proper line-segment circle calculation
    can be done to calculate a more accurate intersection point on the circle’s edge.
    Once the two intersection points are found, you can calculate the new point that
    you want the spline to pass through. This new point (M) is the midpoint between
    the two intersection points. As shown in Image 23.6, the new point (P_new) is
    along the vector from the circle centre (C) through the Midpoint (M) with a distance
    of circle radius (r) and buffer distance (b) from the centre.


    ![](img/f4a4f6e4de5338a867590c30638990cf_217_1.png)


    IMAGE 23.6 The two new curves created that no longer intersect the obstacle. M
    is the midpoint between the two intersection points, and b is the buffer distance
    that you want to move the new point to (outside the obstacle).'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Once we had the new point, we could now create two new curves, one from the
    initial vehicle to this new position (P_car to P_new) and a second from the new
    position to the target (P_new to P_target). These two curves should then have
    been checked for intersections and split further as necessary, but the layouts
    of the Showdown arenas meant this was not needed. Although there were instances
    where an adjusted curve would then intersect another obstacle boundary, the chances
    of it happening were slim and not worth the processing to check.


    By making the arena obstacles all circles, the intersection test used (point circle
    then line-segment circle) was simple enough that brute forcing the tests was not
    too computationally expensive, i.e., we tested every obstacle in the arena against
    every new spline. If we had to deal with non-circular obstacles, then these intersection
    tests would have become much more computationally difficult, as well as requiring
    more complex algorithms for deciding where the new point should be.


    # 23.3.3.2 Driving Outside the Arena


    If a vehicle was already pushed against an outside wall, the generated spline
    would immediately go outside the arena. In this case, there was no possible way
    of creating a meaningful curve to follow by going forward. After detecting this
    situation, a curve would be generated but using the opposite direction that the
    vehicle was facing. This generated spline, starting behind the vehicle, would
    automatically trigger the code for spinning cars around when they are facing the
    wrong direction. This was free functionality as it was in the vehicle AI systems
    since the original Colin McRae: DiRT game.


    Sometimes, the curve generated would go outside the arena a little before coming
    back inside. In this case, the spline was repositioned in a similar way to the
    spline intersecting with the obstacles. First, the initial intersection between
    the spline and the boundary was found, and then the initial spline was cut, the
    point repositioned, and then two curves were created to form the path. However,
    during testing, it was found that just doing this with the arena boundary did
    not always create a spline that the vehicle could follow without hitting the boundary
    walls. This wasn''t a big deal (it is a demolition derby after all) but happened
    enough times that a better fix was needed. This fix required having an inner boundary
    to test against instead. By testing against this inner boundary and adjusting
    the curves against that meant now if there were some curves that were too tight,
    there was a big enough “safety zone” for the cars to run wide without hitting
    the wall. The inner boundary was about 10-m away from the actual boundary and
    can be seen in Image 23.4.


    Detecting an intersection with the boundary was done using a brute force method.
    The generated spline was cut into segments, and then each line segment from the
    generated spline was tested against each line segment that made up the boundary
    of the arena. This brute force method was horribly inefficient, with a test case
    of a 200-m long spline (which was a fairly typical length of spline that would
    be generated) to test against every line segment that made up the outer boundary
    took over 1 ms. This was a problem as the entire AI CPU budget was only 0.8 ms
    for all eight cars! And this was a task that needed to be run every time a new
    spline was generated. A better algorithm could have been chosen, or spatial partitioning
    could have been used, but this was not functionality that was readily available
    (either approach'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'would take time that just was not available – remember five months!). The thinking
    at the time was to optimise the brute force algorithm, and only allow the spline/boundary
    intersection test to run once per frame. After optimising the code using SIMD
    methods (Bikker, 2017), the CPU cost dropped by a factor of over 70 to less than
    0.02 ms for the same test. At that point, concerns about its performance were
    dispelled and it was allowed to run whenever it needed to.


    # 23.4 CONTROLLING THE FUN: THE DEMOLITION DERBY OVERSEER


    With the ability to generate splines and have the vehicles follow them, all the
    basics needed to build the demolition derby game modes were present. But the fundamentals
    of the actual game were still missing! Where should the cars drive to and who
    should they target? This became the primary responsibility of the Demolition Derby
    Overseer. As its name suggests, the Overseer was aware of all the vehicles in
    the game, actively assigning them targets and calculating the target points for
    the spline generation. For each vehicle in play, the Overseer would assign either
    a target vehicle to hit or a safe location to drive to. Which vehicle was targeted
    depended upon a number of factors that included: game mode, difficulty, the last
    time the vehicle was targeted, the number of vehicles targeting that vehicle,
    the relative position, and the orientation of the target vehicle.


    When targeting a vehicle, a spline would be generated to the target vehicle. Every
    few seconds, the spline would be rebuilt to take into account the new position
    of the target and then, if a hit was successful, or after a fixed time had passed,
    the vehicle would then need to drive away to be able to make another attempt.
    Driving away meant either finding a place far away to drive to or just attacking
    a different vehicle that was a reasonable distance away. The distance requirement
    was included because the speed of collision/damage caused was an integral part
    of the scoring system, plus the high-speed collisions always looked so much better
    than low-speed ones. Since the vehicle that was being targeted was a good distance
    away (often over 100 metres), and was moving, the generated spline needed to be
    updated regularly. Also, targeting the centre of the vehicle never gave good results
    as it would typically result in the vehicle ending up behind the target and just
    following it. Instead, it was necessary to predict where the vehicle was likely
    to be in the future. Using a very approximate guess at how long it would take
    the vehicle to drive from its current position to the target’s current position
    (just using the straight-line distance and speed), this was used as the time component
    in the prediction algorithm. The algorithm then took the current direction and
    velocity of the vehicle into account to predict where the vehicle would be at
    that time in the future. Using this new position as the target position resulted
    in much better targeting and also resulted in many spectacular T-Bones. Even though
    the system was very simple, because of the regular path updates, it became possible
    to be very precise on where to hit the vehicle. More importantly, it was possible
    to choose to not hit the vehicle but to get very close to it instead. This ability
    was used as part of the difficulty system and made for a fun gameplay experience
    on easier difficulties by having cars charging at the player, but'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'then purposely missing, but not being obvious about it (it looked like they
    really were trying to hit the player, but they were just not quite right in their
    positioning).


    Once all the demolition derby modes were working and were fully testable, the
    QA team found that they could easily outsmart the AI by just driving in a circle!
    This was easily fixed by incorporating the steering angle that the car was using
    into the prediction algorithm. In the previous racing games, this was not desirable
    as the AI now had access to information that the player does not have, but since
    it was an arcade game where realism and simulation were not the focus (unlike
    the main DiRT games), it was an acceptable solution. The “realistic” fix would
    have been to use the rotational velocity of the target vehicle instead, but that
    was a much more complex solution than just grabbing the steering angle directly.


    # ## 23.5 THE DIFFICULTY SYSTEM


    The difficulty system was a part of the Overseer as it was this system that decided
    who targeted whom and when. One aspect of the difficulty system was to control
    how often the player would get chosen as a target. On easy difficulties, there
    would only ever be a single vehicle targeting the player and there were periods
    of time where no one was targeting the player. On the higher difficulties, up
    to three vehicles could target the player simultaneously. Another element to adjusting
    difficulty was to modify a vehicle’s prediction setting so they would actively
    miss the targeted vehicle. The scoring was also modified so that for easier difficulties,
    hitting the player would earn a reduced score (for the AI vehicles) than at higher
    difficulties. Finally, the maximum amount of throttle that the AI would use was
    also adjusted for difficulty. This would make it easier for the player to avoid
    collision attempts and give them a bit more time to escape from a pursuing vehicle.
    Further to this, if they were hit successfully, the lower collision speed would
    result in less damage to the player.


    This system was not perfect. At times, an AI vehicle might be targeting one vehicle,
    but then get intercepted by another AI vehicle, or whilst chasing one vehicle,
    a different vehicle may get in the way and get hit instead. But because it was
    a Demolition Derby, it really did not matter that a vehicle was not hitting its
    desired targets since they were causing destruction anyway! There were also times
    when the AI vehicles might end up just driving into the arena wall or one of the
    fixed obstacles in the middle of the arenas. Again, this did not really matter
    since it did not happen very often, but they were also driving damaged cars around,
    so their steering probably did not work too well anyway.


    # ## 23.6 THE DEMOLITION DERBY GAME MODES


    Showdown had three different Demolition Derby game modes. These were Rampage,
    Knockout, and Hard Target. Each of these game modes were distinctly different,
    yet all used the same basic code and techniques as described in this chapter.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# ### 23.6.1 RAMPAGE


    Rampage was the traditional arena-based destruction derby event where the goal
    was to cause as much mayhem as possible. Points were scored for the amount of
    damage caused, with the highest score winning. This was the base demolition derby
    game mode that all the systems were designed to support.


    # ### 23.6.2 HARD TARGET


    Hard Target was a timed event where it was everyone against the player. The longer
    the player survived, the higher their score. The event started with the difficulty
    set at 50% and the player was against four AI vehicles. After an initial delay,
    extra AI vehicles were added into the arena every 15 seconds. Once all eight vehicles
    were in the arena, the difficulty would then increase by 5% every 15 seconds.
    Throughout testing, nobody was ever able to survive more than 10 minutes. In one
    instance of testing, a place was found where you “appeared” outside the arena
    (due to a bad boundary definition), and if you were outside the arena, the AI
    would not target you. After about eight minutes (all the cars were in the arena
    and the difficulty was now at 70%), I picked up the controller, drove into the
    arena, and then survived for only seven seconds more!


    # ### 23.6.3 KNOCKOUT


    The Knockout game mode was essentially sumo wrestling but with cars. The events
    took place on a raised platform, where pushing the cars out of the arena was the
    goal. Destroying them also scored points of course, but knocking them out of the
    arena was the most optimal way to get high scores. Unlike the Rampage game mode,
    in this case, it was imperative that cars did not drive into the boundaries as
    they would fall off instead of taking damage, so extra care was taken to ensure
    that would not be the case. These platforms were also always empty of obstacles
    so there was never a need to worry about hitting things other than other vehicles.
    Image 23.7 shows the two arenas used for the Knockout game modes.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '![](img/f4a4f6e4de5338a867590c30638990cf_222_0.png)


    **IMAGE 23.7** The Knockout arenas. Note that the outer boundary here is the actual
    boundary of the platform. The obstacle circles are where the ramps to get back
    onto the platform were located, and the lines are the “ramp splines” that the
    spline generation would connect to if an AI survived after falling off the platform.


    One big difference between this game mode and Rampage was that whilst on the platform,
    instead of generating curved splines to follow, straight lines between the vehicle
    and its target were used. This was due to two different people working on the
    two game modes simultaneously. When the proper spline generation was finished
    and working, the straight-line system used for Knockout was working well enough
    that the time needed to retune the game mode to use the splines was better spent
    on other things (remember, less than five months development time!). Knockout
    also had the additional issue of how to get cars back onto the platform once they
    were knocked off. Originally, the plan was to just respawn the vehicles at the
    base of the ramps, but with the addition of some “ramp splines” and some minor
    changes to the spline generation/targeting code, it was possible to generate a
    spline from the vehicle’s position to the closest ramp spline. One difference
    was that this time, there were two orientations needed: the vehicle’s orientation
    and the ramp spline direction. So, using the two directions and the two start
    points (vehicle position and ramp spline start), a Bezier spline was created instead
    of a Bezier curve as was done previously. This allowed the vehicle to drive around
    and position itself at the base of the ramp before fully accelerating and driving
    back on to the platform. From image 23.7, you should be able to see that the outer
    edge of the arena is not actually stored as well. This wasn’t necessary as we
    only ever created the paths to the ramp splines, so we just made sure that the
    arenas had enough space that the vehicles wouldn’t hit the arena walls.


    # 23.7 RACE STARTS


    As a final note, at the start of each event and after the lights changed, each
    vehicle would go full throttle into the middle of the arena to create a massive
    crash. Of course, the sensible player would just avoid the rush and then attack
    afterwards, so a couple of the cars were made to do the same. At every race start,
    a random position, mostly in the centre, was assigned to each car. By being mostly
    central, this added a bit of variability to how the first few seconds of the events
    proceeded. But for one or'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'two vehicles, a random point in the arena was assigned instead. This meant
    that you would see a car drive towards the centre and then just turn away from
    all the mayhem. Further to this, the vehicles would sometimes delay their start
    and join the fray a few seconds later. This may not have been the best way to
    score points, but it added variety and randomness to the race starts and ensured
    that each event was different.


    # 23.8 CONCLUSION


    This chapter has detailed the work that went into creating the arena-based demolition
    derby game modes on DiRT: Showdown. These systems were designed and built in less
    than five months by just two programmers (one of whom was a junior with only one
    year’s experience at the time!), but it was only achievable due to the existing
    tools and systems that could be leveraged. The tools that the level designers
    used were already familiar to them, even if they were now being used in a totally
    different way and the already existing code features could either be used directly
    (like the spline following system and statistics system) or copied and then updated
    (like the Overseer, which was based on the Race Choreographer from previous games).
    Given the time constraints that necessitated some of the decisions, the end result
    was remarkable. At the beginning of the project, the requirement was to deliver
    a single, empty arena with a single difficulty setting, but by the time it was
    completed five months later, there were multiple arenas (different shapes and
    with immovable obstacles inside) and three distinct game modes, with a fully working
    and tuneable difficulty system that featured precision driving and targeting.


