  md: 'non-deterministic simulation. Repulsors are used to dissuade the AI from choosing
    a given location if the weight is positive and to persuade them to choose a given
    location if the weight is negative. These repulsors are very small in size, approximately
    0.5 m², but have a fade over a further distance should the exact point not be
    suitable.


    Putting all these heuristics together, you have a process resulting in AI vehicle
    driving that looks organic and realistic, avoids collisions well, and can be used
    to encourage formation positions. The final part of the puzzle is to determine
    the speed for the vehicle. This is relatively simple as you often merely want
    to match the player’s speed. Therefore, using the player’s speed as a base, you
    set a target speed to be slightly slower than the player if the AI is ahead or
    slightly faster than the player if the AI is behind. In some scenarios, you may
    want the AI to drive as fast as possible, so you can merely set the target speed
    to be the vehicle’s top speed. The only time the AI should override the speed
    to slow down from these target speeds in path-space is when the goal location
    that is chosen is inside any potential collision cells (as shown by the light-grey
    cells in Image 7.6). When this scenario arises, simply set the target speed to
    match the vehicle it would collide with and, once there is a collision-free goal,
    you can increase its target speed again.


    # 7.10 TRANSFORMATION BACK TO WORLD-SPACE


    With a method for finding a collision-free path in path-space, you need to transform
    it back to world-space so that the AI can steer correctly in the game world. To
    do this, find each intersection of the goal path, and segment edges in path-space,
    and transform those locations back to world-space. Image 7.9 shows an example
    of a typical scenario that an AI would encounter in Wheelman. Image 7.10 then
    shows the simulated outcome and chosen goal path transformed back into world-space.'
