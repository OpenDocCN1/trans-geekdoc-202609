    The basic implementation for each plane goes as follows: For a unit to get to
    its goal while avoiding obstacles on the way (walls, other players, and the like),
    as shown in Image 15.2a, the algorithm would first generate n directions based
    on the forward vector of the unit. For the sake of clarity, the number of directions
    chosen is eight. This step would represent the *alpha* plane, as described in
    Image 15.1a. The term “radials” is used for the shorthand of these eight directions,
    as depicted in Image 15.2b, bearing in mind that an amount far higher can be used
    if a higher level of granularity is needed and the computational resources can
    be easily afforded by the application.


    ![](img/f4a4f6e4de5338a867590c30638990cf_140_1.png)


    IMAGE 15.2 Algorithm Basics. (a) Situation, (b) radials of n directions, (c) Interest
    Processing, (d) Danger Processing.


    The next step is to query for objects of interest, represented as the circle (the
    “Goal”) in Image 15.2c in this example. The distance vector between the goal and
    the AI unit is then projected on each of the directions where its dot product
    is over zero, to determine which ones are relevant to reach the current goal.'
