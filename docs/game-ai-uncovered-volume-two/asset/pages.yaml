  md: 'As we have seen in the two examples, the one based on the distance of the agent
    between two different locations where actions should take place, and the one where
    it gets killed twice, SB-GOAP is able to change behaviour and adapt without the
    need for any other external help. You just need to keep in mind that the cost
    and the hitch cost need to be well-designed for the type of agent and the type
    of game.


    # ## 21.6 CONCLUSION


    This chapter has shown how SB-GOAP is deeply driven by a path search algorithm.
    This allows it to not only look at the preconditions and effects, but it can use
    a cost proactively in order to decide “which route” the plan can take depending
    on variations. These variations can be achieved without the need of having another
    system on top, they can be “one shot” without the need of any memory storage,
    or the multiplier can be accumulated over time whenever something external happens
    to the agent during the actual execution of the actions.


    The balancing part of SB-BOAP can include a huge range of algorithms of any sort,
    from the simplest approach to the most complex. Also, emergent behaviours will
    be seen over time, which is within the control of the designers.


    The takeaway of using the SB-GOAP approach is that by having more control over
    the plan, and over a single action, it reduces the overhead of actions through
    to its reusability and the removal of supporting systems.


    SB-GOAP can be easily expanded to use neural networks. For instance, reinforcement
    learning could adjust the multipliers of the costs directly, since world states
    can be seen as nodes of the neural network and actions as connections (using the
    cost as weight).


    In short, how SB-GOAP is designed can be extended in many ways.


