- pgno: 149
  md: '# # 16 Using Voxels for Environmental Cues


    *Richard Bull*


    # ## 16.1 INTRODUCTION


    A common requirement when developing game AI is to enable non-player characters
    (NPCs) to reconcile the question of “Where am I right now?” In answering this
    question, you can facilitate features such as intelligent ambient conversation
    – “Hey! I recognise this place, I used to play here when I was a kid!”. You can
    efficiently check whether they are indoors or outdoors to see if they are safe
    from spying eyes (or acid rain!). You can check whether they are in a safe neighbourhood
    belonging to their faction, whether the space they occupy is too tight to transform
    themselves from a lithe robot into a giant truck, or whether they are standing
    dangerously close to a potential chokepoint that could be used for an ambush.


    The possibilities are as endless as the environmental cues you can parse, and
    these cues can directly provide you with more dynamic, reactive, and immersive
    NPC behaviour.


    # ## 16.2 THE SIMPLE APPROACH


    You can achieve all of this quite easily using trigger volumes. For example, suppose
    you have already modelled in your game world a large building with multiple rooms,
    situated in a village, which itself belongs within the boundaries of a county.
    A level designer could come along and mark up a trigger volume encompassing each
    room in the building, tagging the room with its type (kitchen, bedroom, and the
    like). They could then place a trigger volume encompassing the entire building,
    tagging it as indoors and with the building type – “the Manor house”. Finally,
    they could encompass the whole village with one huge trigger volume, tagging it
    with the village’s name as a region type, and marking it up as outdoors.


    As a rule, prioritise tag overrides hierarchically by smallest volume size. This
    means that if you move your avatar in this example around inside the village region
    volume, but they are not inside the house yet – so they are just occupying the
    single largest volume, then they are outdoors, and they are in the village. If
    they then enter the house, but they are not yet in a specifically marked up room,
    they now occupy the Manor house volume and the village volume. The village is
    outdoors, and the Manor house is indoors, so the agent is being told they are
    in both states, but because the Manor house volume is the smaller of the two overlapping
    boundaries that they occupy, they are definitely indoors. This example works even
    more robustly should they enter a room in the house which is exposed to the elements.
    For example, a little'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'courtyard space within the overall boundary of the Manor house. If this had
    its own room volume, marked as outdoors, and an agent stood here, they would be
    nested three volumes deep, and because the courtyard "room" is the smallest, they
    are now outdoors again.


    As you can tell from the examples, this is a very simple but powerfully clever
    markup system that NPCs can make good use of, and if your game world is unusually
    small, and rarely modified, this might be enough for your game. However, "unusually
    small" and "rarely modified" do not apply to a large majority of games in development!
    You could not, for example, expect the level designers to go through and mark
    up every room and every building in a *Grand Theft Auto 5*-scale open world, and
    then realistically expect them to stay on top of the multitudes of trigger volumes
    as the game world inevitably changes during development. It would be nice to fall
    back on this manual markup system for distinctly bespoke cases, but ideally, you
    need to supply the design team with a system that can maintain itself as best
    it can when environments are tweaked, and even supply as much automated environmental
    markup as it can without even needing to stick virtual signposts down.


    # ## 16.3 ANALYSING THE ENVIRONMENT USING VOXELS


    There are multiple methods of terrain analysis you could use to aid in automating
    manual markup, but a robust and classic method is the octree, to subdivide the
    environment into voxels. It might even already be happening in your game engine,
    for use by rendering or illumination systems, which means you may even be able
    to leverage some shared technology for the AI systems.


    Either way, what you need out of the octree is to subdivide the space so that
    you end up with a voxelised region of the environment where you have a set of
    voxels overlaying collision (closed voxels) and a set of voxels occupying navigable
    spaces (open voxels). Once you have this, you can use the current position of
    an NPC to query for their currently occupied open voxel and start to mark up and
    interrogate these voxels for spatial information.


    # ## 16.4 GENERATION PHASES


    The complete environmental markup process can take place offline, and the data
    generated can be saved and stored as a binary data file. However, there may be
    situations where some or all of the data would need to be regenerated at runtime
    if the environment is modified.


    A generation phases look like this, and each of these stages will be explored
    in more detail next:


    +   1. Generate the octree, and all open and closed voxels, using user-defined
    seed bounds.

    +   2. Cull any voxel that ends up fully outside the seed bounds after generation.

    +   3. Perform interior tests on open voxels.

    +   4. Propagate markup seeds throughout the voxel space.

    +   5. Inherit the tagging of any markup bounds into the voxel space.'
  merge: -1
  img_proc: true
- pgno: 151
  md: "# 16.4.1 GENERATING THE VOXEL SPACE\n\nTo begin the generation process, place\
    \ an oriented bounding box into your environment, which defines the region in\
    \ which you want to generate voxel markup space. During the octree generation,\
    \ this region is extruded to be uniform across the three dimensions (if it is\
    \ not already), and then any generated voxels that completely escape the original\
    \ bounding region can be culled at the end.\n\nThe octree generation is a recursive\
    \ function, called initially with the extruded seed bounding region, then subsequently\
    \ with octant bounds, and at a simple algorithmic level looks something Code Listing\
    \ 16.1.\n\n```\n**Code Listing 16.1: Recursive function for octree generation.**\n\
    \n```\nprivate void GenerateOctree(Bounds boundingBox)\n{\n    bool containsCollision\
    \ = CheckCollisionInside(boundingBox);\n\n    if (boundingBox.size.sqrMagnitude\
    \ <= m_MinVoxelSizeSqr)\n    {\n        // Reached minimum voxel size\n      \
    \  CreateVoxel(boundingBox, containsCollision);\n    }\n    else if (containsCollision)\n\
    \    {\n        // Break up octant into 8 pieces to isolate the collision further\n\
    \        var min = boundingBox.min;\n        var center = boundingBox.center;\n\
    \        var halfHeight = new Vector3(0.0f, 0.0f, boundingBox.size.z *\n     \
    \   0.5f);\n        var octantSize = (boundingBox.size / 2.0f);\n        var octantHalfSize\
    \ = octantSize * 0.5f;\n\n        // Bottom row 34\n        var octants = new\
    \ Bounds[8];\n        octants[0] = new Bounds(min + octantHalfSize, octantSize);\n\
    \        octants[1] = new Bounds( new Vector3(center.x, min.y, min.z) +\n    \
    \    octantHalfSize, octantSize);\n        octants[2] = new Bounds( new Vector3(min.x,\
    \ center.y, min.z) +\n        octantHalfSize, octantSize);\n        octants[3]\
    \ = new Bounds( new Vector3(center.x, center.y, min.z) +\n        octantHalfSize,\
    \ octantSize);\n\n        // Top row 78\n        // 56\n        octants[4] = octants[0];\n\
    \        octants[4].center = (octants[4].center + halfHeight);\n\n        octants[5]\
    \ = octants[1];\n        octants[5].center = (octants[5].center + halfHeight);\n\
    \n        octants[6] = octants[2];\n        octants[6].center = (octants[6].center\
    \ + halfHeight);\n\n        octants[7] = octants[3];\n        octants[7].center\
    \ = (octants[7].center + halfHeight);\n\n        for (int iOctant = 0; iOctant\
    \ < octants.Length; ++iOctant)\n            GenerateOctree(octants[iOctant]);\n\
    \    }\n    else\n    {\n        ////Fully open space voxel - potentially larger\
    \ than the minimum\n        //// voxel size.\n        CreateVoxel(boundingBox,\
    \ true);\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 152
  md: 'The first check in this function is to determine if the bounding area of the
    supplied octant contains any collision. It then subsequently checks to see if
    the bounds are at least as small as our smallest defined voxel size, and if so,
    create an open or closed voxel at this position and make no more recursive calls
    from here. Otherwise, if the bounding area did contain collision, it subdivides
    the next eight octants and calls recursively on each one. If it did not contain
    collision, you can create an open voxel, which could potentially be any size between
    the minimum voxel and the original seed octant bounds, and this particular branch
    is complete.


    What is being done here is to mark up all of the empty space within the original
    bounds, using the largest possible voxels it can, and at the same time marking
    up the collision with a density equivalent to the smallest allowed voxel size.
    This is a fast and effective method of determining what voxel is occupied by a
    world position, what connections this voxel has within the octree and a map in
    which to apply metadata related to the voxel for the NPCs to query.


    The next phase of the generation process is to cull any voxels that exist completely
    outside of the original seed boundary area. This can happen if the boundary must
    be extruded to fit in a uniform shape. Any voxels that overlap the boundary edges
    will be maintained, so the voxel space can bleed outside of the original boundary
    but only so far that they intersect.


    # 16.4.2 INTERIOR TESTS


    In the manual approach to placing environmental markup trigger volumes, the level
    designer is tagging the space as being indoors or outdoors. This is something
    that can easily be automated now with the voxel approach, using a simple series
    of upward ray casts from each open voxel.


    A reasonably effective and simple test for this is to take each open voxel and
    cast a ray to an apex height position from the top centre and each top corner.
    If a threshold of these five rays (say 50%) collides with a polygon, this voxel
    is indoor or at the very least under cover from the sky. Image 16.1 depicts this
    process.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '![](img/f4a4f6e4de5338a867590c30638990cf_153_0.png)


    IMAGE 16.1 Testing to see if a voxel is indoor or outdoor.


    You now have an octree that can query a world position and be told whether that
    position is indoor or outdoor.


    # 16.4.3 MARK-UP SEEDS AND PORTAL BOUNDARIES


    In the simple trigger-based volumetric approach to marking up rooms and regions,
    if you wanted to mark up a room interior as being a kitchen, you would extrude
    a trigger volume to fill the space and set that volume with a room:kitchen tag.
    As mentioned, this is fine until an artist modifies this room during development
    and the designer then has to keep on top of these changes, rebuilding their trigger
    volume to match. Using voxel space generation, you can now make this process more
    robust by simply having the designer place a markup seed – merely a world space
    position – instead of volumes.


    During the “Propagate markup seeds throughout the voxel space” (Phase four) of
    the generation process, you locate each seed placed within the octree boundary,
    find the octant/voxel within which it is placed, and mark this voxel with the
    seed tagging. You can assume that if this seed is tagged as room:kitchen, it will
    have been placed within an open voxel inside the kitchen interior space. Now you
    perform a flood-fill algorithm across all connected open voxels, and mark each
    of these connections as room:kitchen as well. The obvious issue with this flood-filling
    routine is that it will more than likely also leak out of doorways, and even if
    it did not because of the way the collision layers are sorted, you still might
    want to demarcate the kitchen room space to completely isolate the voxels used
    by the tag markup in a more controlled fashion. This is where portal boundaries
    come in handy.


    A portal boundary is simply a volume that can be placed during the level design
    markup process, at the same time as placing seeds, to block off entrances and
    exits to'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'a space that requires seeding in isolation. The kitchen example shown in Image
    16.2 has an entrance doorway and a window cut-out, which the voxel space would
    flow through. If you place a thin portal volume overlapping these holes, the octree
    generation will treat these volumes as collisions for the sake of generating open
    and closed voxels, essentially demarcating the space. These portals will not persist
    into the run-time of the game, other than the effect that they will have had on
    the voxel space.


    ![](img/f4a4f6e4de5338a867590c30638990cf_154_0.png)


    # IMAGE 16.2 Portal boundaries.


    # 16.4.4 INHERIT MARKUP BOUNDS


    This final stage is the simplest. You simply need to perform a pass over all of
    the manually placed markup bounds that a designer may have placed and propagate
    the tags onto the open voxels contained within them. Any existing type tags already
    autogenerated in previous phases should be stored hierarchically with precedence,
    as manual markup should trump automation. For example, if you have seeded your
    kitchen, and a designer has placed a manual boundary inside the room marking up
    a pantry inside it, then the kitchen room tag would be stored on the open voxel,
    but so too would the pantry tag with higher precedence. A point occupying said
    voxel would be, in terms of room occupation, "primarily inside the pantry, and
    also within the kitchen". This precisely mimics the occupying volume size order-of-precedence
    rule specified in the simple volumetric approach to markup described earlier.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# 16.5 CONCLUSION


    An octree is a powerful tool to use in your game engine for fast positional look-ups
    for all kinds of purposes, from rendering to game logic. Leveraging and sharing
    that technology for AI environmental querying, particularly when much of that
    data markup can be automated as part of the voxel generation, makes a lot of sense
    and can provide supplementary richness to AI behaviour and response. This markup
    could be used for simple ‘where am I’ querying, provide voxel-based environmental
    pathfinding for breadcrumbing, or even to make very high-level movement decisions
    based on region-type traversal, and it is always an ‘easy sell’ if you can reuse
    core game engine data for multiple purposes in your project development'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# # 17 The Creature Believability Scale


    Dr Nuno Vicente Barreto,

    Dr Fernando Penousal Machado,

    and Dr Licínio Roque


    # ## 17.1 INTRODUCTION


    To experience world-driven video games, players must believe, or at least accept,
    the information that they are provided with, even though it might challenge, or
    even contradict, their concept of reality. It becomes the developer''s goal to
    make the world feel believable – a concept that plays an integral part in improving
    player experience through engagement (Warpefelt, Johansson, & Verhagen, 2013).
    One of the elements responsible for that are the actors, or agents, inhabiting
    these worlds.


    When studying the production of content, the importance of evaluation becomes
    clear. To create believable creatures, the proper tools are required to both evaluate
    a creature''s behaviour and look beyond its visual representation. First, creatures
    are more than their individual elements and evaluation should take this into account.
    Second, they exist within a context. The latter defines their role, and any detraction
    may cause a creature to be perceived poorly.


    While, in the context of believability, humans have a predefined set of criteria,
    including showing personality, emotion, self-motivation, change and social relationships
    (Thomas & Johnston, 1995), creatures interact with humans differently. For example,
    they lack a human-understandable language, so the same criteria might not hold
    true.


    This chapter proposes an architecture-agnostic tool capable of measuring creature
    believability so that at the design stage (automated or otherwise) developers
    can maximise a creature''s perception. A set of heuristics, or rules, can be derived
    from such a tool, to inform and guide the process and to help design creatures
    who support the suspension of disbelief mediated by the fictional worlds of video
    games.


    # ## 17.2 UNDERSTANDING BELIEVABILITY


    Before introducing the evaluation instrument, an understanding of what is meant
    by ''believability'' is required. In the media, it is tightly coupled with the
    concept of suspension of disbelief. This was first introduced by Coleridge and
    Shawcross (2001), in their autobiographical reflection, when they state that believability
    is an act people must be willing to do (even at a subconscious level), framed
    within the medium''s bounded veracity (only requiring a ''semblance of truth''),
    happening in'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'a contextualised environment, or ‘moment.’ In short, when experiencing media,
    humans are willing to believe in something that is unbelievable, for the sake
    of context.


    In psychology, ‘presence’ encompasses how this phenomenon manifests itself in
    technology-based media. Defined as ‘the perceptual illusion of nonmediation’ (Lombard
    & Ditton, 2006), it is a phenomenon which causes a person to stop acknowledging
    the existence of a medium, responding as if it is absent. For example, acting
    as a window to its content. In both the games industry and its academic counterpart,
    it is argued that ‘presence’ plays an important role in improving the player’s
    experience (Warpefelt, Johansson, & Verhagen, 2013). It then becomes one of the
    goals of a development team to help create and maintain it.


    This then raises the question of how developers can provide players with a ‘semblance
    of truth’ to help them ‘suspend their disbelief’? This is where believability
    comes in. Fogg and Tseng (1999) state that in computer software, information corresponds
    to the mental model created by the user. This is also true in video games as players
    also create mental models when they play, leading them to accept in-game agents
    as ‘alive and thinking’ (Rosenkind, Winstanley & Blake, 2012). This is further
    supported by studies that not only show that believable agents are perceived to
    be more engaging than non-believable ones (Warpefelt, 2016) but also how to craft
    them.


    However, possibly due to the way people tend to anthropomorphise media content
    (Reeves & Nass, 2003), they overwhelmingly focus on humans (Reynaud, Donnat, &
    Corrible, 2014) despite the existence of other animals. Even video games focusing
    more on animals follow this anthropomorphic trend (Frank, Stern, & Resner, 1997).
    Nonetheless, they, as autonomous agents, are also meant to support the immersion
    of these virtual worlds. So, it then becomes important to provide the means by
    which to create them.


    For AI programmers tasked with designing, and developing creatures, having a tool
    that helps them evaluate content around a concept potentially as vague as believability,
    in a contextualised manner, becomes invaluable.


    # 17.3 THE CREATURE BELIEVABILITY SCALE


    The Creature Believability Scale (CBS) is a design tool to help developers assess
    and potentially produce their creations. It relies on characteristics meant to
    convey believability and takes the form of a 5-point rating scale containing twenty
    three statements divided into four categories. Participants can answer with one
    of the following agreement values: ‘Not At All’, ‘Slightly’, ‘Somewhat’, ‘Moderately’
    and ‘To a Great Extent’. The statements are as follows:


    **Relation with the Environment**: Items related to environmental interactions,
    ranging from reactions to environmental cues and directed behaviours to biological
    systemic exchanges.


    +   1. The creatures interact with the surrounding environment.


    +   2. The creatures have motor coordination.


    +   3. The creatures direct their movement towards/away from targets.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '+   4. The creatures can find objects in the environment.

    +   5. The creatures can expel organic waste.

    +   6. There are signs of previously expelled organic waste, such as faeces, urine,
    goo, and the like.

    +   7. The creatures’ actions are appropriate to their circumstances.


    **Biological/Social Plausibility:** This category relates to a creature’s plausibility
    as a biological organism; for example, showing autonomy, reactivity to its surroundings
    and the ability to interact with other creatures.


    +   8. The creatures can move independently.

    +   9. The creatures’ agility reflects their volume.

    +   10. The creatures react to environmental triggers.

    +   11. The creatures can perform tasks by coordinating with other creatures or
    humans.

    +   12. The creatures audio-visually communicate with other creatures or humans.

    +   13. The creatures engage in reproductive acts.

    +   14. There are signs of previous reproductive acts, such as eggs, cubs, pregnancy,
    and the like.


    **Adaptation:** This category relates to how a creature’s body and mind adapt
    to the environment and biological changes. For example, growing.


    +   15. The creatures learn from past events.

    +   16. The creatures use past experiences to overcome novel situations.

    +   17. The creatures change the way they look with age.

    +   18. The creatures change the way they sound with age.

    +   19. The creatures change the way they behave with age.

    +   20. The creatures can imitate others to develop their own behaviours.


    **Expression:** The elements in this category refer to how a creature uses its
    body as a means to communicate, learn, or survive.


    +   21. The creatures’ body language anticipates their actions.

    +   22. The creatures show signs of emotional reaction to objects, events, and
    other creatures.

    +   23. The creatures’ bodies seem adapted to their habitat.


    While this scale was designed to fill in the gap of an evaluation process, it
    can also be incorporated during the creation phase. This allows developers to
    produce content to maximise believability and, subsequently, assess if their interpretation
    of the scale aligns with the players. As such, a workflow can then be derived:


    +   - During the creation phase of a creature, the scale''s items can be viewed
    as heuristics.

    +   - These heuristics can be incorporated into its design and architecture.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '+   - During the evaluation phase, playtesting and expert evaluation can be
    used, with the CBS as a measuring tool, to validate the previously produced artefact.

    +   - This process can be repeated until developers are satisfied with their end
    result.


    With this scale, additional evaluation tools could be derived. One such tool is
    the CBS.


    # 17.3.1 THE CREATURE BELIEVABILITY SPECTRUM


    Though the CBS can output a believability index to help assess individual creatures,
    this can be supplemented by a more visual framework – a referential list to help
    compare video game creatures. Such frameworks can help designers understand not
    only how to improve pre-existing designs and interpreting how each dimension,
    and statement, contribute to its overall believability perception but also to
    compare their own designs against other elements.


    Thus, the CBS consists of an axis ranging from 0 (non-believable) to 10 (believable)
    where creatures are sorted according to their perceived believability index.


    Indexes can be calculated by summing the rates obtained after applying the CBS
    (or the median of each of its items’ ratings, if several players are used during
    data gathering). They can either be used to represent their overall ‘believability’,
    in which case all the items are used, or, to represent a specific category, in
    which case, only its items are considered.


    As mentioned, from a game design perspective, the CBS can provide additional insights.
    For instance, creatures from similar video games (or having similar roles/screen
    time) can be compared and categorised, through the spectrum, to allow developers
    to set baselines for their own creatures’ requirements, from either their overall
    perceived believability or from specific categories. Moreover, it can help us
    to understand how different approaches in both development and design may be perceived
    and assist in identifying potential pitfalls.


    # 17.3.2 EXAMPLE OF USING THE CREATURE BELIEVABILITY SCALE


    To illustrate how the scale could aid the design of creatures, imagine the following
    scenario: A team is developing a science-fiction exploration game where players
    take on the role of an astronaut tasked with bio-surveying an uncharted planet.
    During their research, they find a companion creature, nicknamed Lancey, who ends
    up helping them throughout the course of the game.


    For this practical example, the development team wants to assess the believability
    of three types of creatures the player encounters. They are as follows:


    +   - **Blarma**: These Armadillo-like creatures roam some of the areas of the
    environment. They appear individually, or in a line formation, and move by hopping
    around on alternate sides. Players can try to interact with them, but the Blarma
    do not react. Their on-screen presence can be small.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '+   * Loncey: A docile lion/coyote hybrid the astronaut meets early in their
    adventure. Outside of cutscenes, it is always near the player albeit it only wanders
    around and can be knocked unconscious by other creatures. Its onscreen presence
    is large.


    +   * Raptar: These are weak reptilian creatures that are hostile to the player.
    Players are forced to kill Raptars to proceed with their survey. They stay idle
