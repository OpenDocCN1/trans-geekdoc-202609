- pgno: 123
  md: 'the potential for expanding a node where it would break the grammar constraints.
    For example, the determination of the gender of an actor only makes sense in the
    context of having previously expanded that an actor node was placed. Similarly,
    expanding a prop in the graph should mask out the possibility of gender properties
    being returned. At the top level of the graph, the expansion probabilities are
    less constrained with this masked context. As the graph expands, the context becomes
    clearer, and fewer possibilities need to be considered. You can think of the masking
    process as a gating mechanism to maintain the structure of the grammar used to
    construct the graph. Once the probabilities are learnt, you have effectively learnt
    the distribution of movie properties and structure for a given input scenario;
    thus, allowing you to sample from that distribution to recreate a new graph.


    One important feature of this graph expansion approach is that you must be able
    to expand multiple alternative graph proposals. You do this to supply the user
    of the system with valid options rather than a strict output. This means that
    you need to present the different output generations in a manner that allows the
    user to select between them. Whilst this is an ongoing area of research, our approach
    is to generate multiple matching outputs as top-K entries (K = 3 is a good default)
    and allow the user to select quickly between the matches before deciding on an
    edit. To facilitate this, you render the potentially selected outputs in a selection-overlay
    material colour to differentiate it from existing scene content. The final step
    once the model has produced output is that the user accepts one of the top-k choices
    and this is finally instantiated into the scene and the corresponding sequence.
    To do this is a simple matter of extending the existing Unreal Engine sequencer
    API based on some Python code present in the engine.


    # 12.5 CONCLUSION


    As mentioned, this matter of selection and adoption into an authored scene is
    an area of research, both from a usability and a generative modelling perspective.
    At the simplest level, the author of the scene can simply “swipe left” on scenes
    they do not like until they find one they do. However, it raises a bigger question
    of design intent and how such models adapt to user preferences. Ultimately, it
    is likely that because ML models can adopt new knowledge, we might end up allowing
    for user biassing of resulting generations based on how often they select a particular
    generated output. So, if they are authoring a given “style”, perhaps the model
    will adopt more generations in the given style. For instance, opting to generate
    more Wes Anderson-style generations as part of a scene.


    Construction of a cut-scene therefore presents itself as a series of edits, recommendations,
    and shot selections and repeats this cycle until the scene is completed. From
    a user perspective, it might be perceived as a form of auto-completion, albeit
    of relatively complex scene construction data. One of the challenges with this
    approach is that it does still rely on the human using the system to select appropriate
    completions to form a narrative that is coherent. Individual shot choices are
    quite complex in traditional filmmaking. Often involving a whole new team in terms
    of editing the footage into a final film. It may eventually be possible to completely
    replace the human authorship of this approach entirely and simply infer an entire
    cut-scene'
