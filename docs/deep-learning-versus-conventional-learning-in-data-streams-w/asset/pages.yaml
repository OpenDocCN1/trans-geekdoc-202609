    readily seen that [32] and [42] adopt few rules to establish T-S fuzzy models
    and that the MSE value of the proposed method (0.0024) is superior to those reported
    in these two studies.


    # B. EXAMPLE 2: STATIONARY NONLINEAR FUNCTION


    Consider the following stationary nonlinear function [47]-[50]


    \(output = \left( 1 + x^{0.5} + y^{-1} + z^{-1.5} \right)^2. \quad (19)\)


    In this experiment, 40 data points from [50] are used to establish the T-S fuzzy
    model. The first 20 data points are training data, and the remaining 20 data points
    are testing data. Similarly, by utilizing the cluster validity criterion index,
    an appropriate rule number (\(c = 6\)) is found.'
