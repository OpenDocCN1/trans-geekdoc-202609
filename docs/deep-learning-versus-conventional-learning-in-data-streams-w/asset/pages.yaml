  md: 'In addition to the number of rules, the choice of initial values for the system
    parameters also affects the final results. Moreover, an inappropriate premise
    structure may be obtained, resulting in unreasonable modeling distortion. Therefore,
    many metaheuristic algorithms have been developed to find the appropriate parameters.
    In recent years, many nature-inspired heuristic algorithms have been developed
    and applied in various areas, including those for optimization problems [13]–[15],
    classification problems [16]–[19], and identification problems [20]. Most swarm
    intelligence concepts originate from the study of colonies or swarms of social
    organisms [21]–[23]. Among the various algorithms based on swarm intelligence,
    the ant colony optimization (ACO) algorithm, a popular metaheuristic algorithm,
    has shown a promising performance. The ACO algorithm, usually applied to combinatorial
    optimization problems, has been inspired by observations of the seeking behavior
    of ants [24]. The ACO algorithm shows the advantages of solving the optimization
    problem; however, for the fuzzy identification problem, many unknown parameters
    need to be found and the interval for each parameter is unknown. In addition,
    it takes a lot of time to find a solution; therefore, few studies have explored
    the fuzzy identification problem using the ACO algorithm. For this reason, an
    improved ACO based fuzzy identification method is proposed in this study to find
    the silted initial consequent parameters and the initial membership function matrix.


    # II. PRELIMINARIES


    Before discussing the proposed identification method, the T-S fuzzy model and
    some algorithms which are used to search the appropriate parameters for the T-S
    fuzzy model are reviewed in this section.


    # A. T-S FUZZY MODEL


    The T-S fuzzy dynamic model is described by fuzzy IF-THEN rules, which locally
    represent input-output relations of a nonlinear model. First, consider data set
    **X** = {**x**<sub>1</sub>, **x**<sub>2</sub>, ..., **x**<sub>N</sub>}, where
    _N_ is the number of data inputs, and for each input vector **x**<sub>k</sub>
    = {x<sub>1</sub>(k), x<sub>2</sub>(k), ..., x<sub>n</sub>(k)}, _n_ is the dimension
    of **x**<sub>k</sub> and _k_ is the _k<sup>th</sup>_ data set. The _i<sup>th</sup>_
    rule of the T-S fuzzy model is presented as:


    ```

    Rule i:

    IF $x_1(k)$ is $A_1^i$ AND $\cdots$ AND $x_n(k)$ is $A_n^i$

    THEN $y^i(k) = a_0^i + a_1^i x_1(k) + \cdots + a_n^i x_n(k)$ (1)

    ```


    where _i_ = 1, ..., _c_ is the _i<sup>th</sup>_ fuzzy rule, _c_ is the number
    of fuzzy rules, _x<sub>q</sub>_(_k_) is the input variable, _q_ = 1, 2, ..., _n_,
    $A_q^i$ is the fuzzy set, _y<sup>i</sup>_(_k_) is the output of the _i<sup>th</sup>_
    fuzzy rule, and $a_q^i$ is the consequent parameters of the _i<sup>th</sup>_ output.


    By using the product of inference, singleton fuzzifier, and center average defuzzifier,
    the defuzzified output of the overall T-S fuzzy model can be represented as:


    Related to the above discussion, a novel identification method based on an improved
    ACO algorithm is developed in this study. First, a cluster validity criterion
    index for the fuzzy c-regression model (FCRM) is used to determine the appropriate
    rule number of the T-S fuzzy model. Second, based on the improved ACO algorithm,
    the sifted initial membership function matrix and the consequent parameter matrix
    are obtained. Through an improved FCRM algorithm and the orthogonal least-squares
    (OLS) method, the premise and consequent parameters are obtained. Finally, some
    examples are provided to show the validity and effectiveness of the proposed identification
    method. The main contributions of this paper are as follows: i) with a cluster
    validity criterion index, the appropriate number of rules is obtained; ii) based
    on the improved ACO algorithm, a sifted initial consequent parameter matrix $\Theta_i(k)$
    is obtained; and iii) according to the obtained $\Theta_i(k)$ from the ACO algorithm
    and the improved FCRM, the membership function matrix **U** is obtained with fewer
    iterations. The rest of the paper is organized as follows. In Section II, the
    T-S fuzzy model and some algorithms that are used in the design procedure are
    introduced. In Section III, based on the FCRM algorithm, cluster validity criterion
    index, and ACO algorithm, a novel identification method based on the T-S fuzzy
    model is proposed. In Section IV, some examples are given to demonstrate that
    the proposed identification method provides better approximation and robustness
    than can be obtained using some existing methods. Last, conclusions are given
    in Section V.


    ```

    \(\hat{y}(k) = \frac{\sum_{i=1}^c w_i(k)y^i(k)}{\sum_{i=1}^c w_i(k)}\) (2)

    ```


    where $\hat{y}(k)$ is the output of the fuzzy system, the weight $w_i(k) = \prod_{q=1}^n
    A_q^i(x_q(k))$ and $\sum_{i=1}^c w_i(k) = 1$. $A_q^i(x_q(k))$ is the grade of
    the membership function, expressed as:


    ```

    \(A_q^i(x_q) = exp \left\{ - \left( \frac{x_q - \alpha_q^i}{\beta_q^i} \right)^2
    \right\}, q = 1, \cdots, n\) (3)

    ```


    where _i_ = 1, ..., _c_ is the _i<sup>th</sup>_ fuzzy rule, $\alpha_q^i$ and $\beta_q^i$
    represent the center bell-shaped membership function and the standard deviation
    of the bell-shaped membership function respectively.


    # B. FUZZY C-REGRESSION MODEL


    The fuzzy c-means (FCM) algorithm is regarded as a simple and effective clustering
    algorithm. However, the FCM algorithm is a hyper-spherical-shaped cluster algorithm;
    therefore, it is not suitable for hyper-plane-shaped clustering. Therefore, the
    FCRM clustering algorithm was proposed [25]–[28] to partition the input-output
    data pairs into hyper-plane-shaped clusters for the fuzzy modeling.'
