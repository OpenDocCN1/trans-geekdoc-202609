    # V. CONCLUSION


    In this paper, a novel fuzzy identification method that combines a modified cluster
    validity criterion index and ACO and OLS algorithms is proposed. In general, the
    initial premise structure and consequent parameters might affect the final identification
    result. Therefore, in this paper, the ACO algorithm is adopted to sift better
    initial premises and the consequent parameters. In addition, an insufficient number
    of rules will lead to an inappropriate premise structure and'
