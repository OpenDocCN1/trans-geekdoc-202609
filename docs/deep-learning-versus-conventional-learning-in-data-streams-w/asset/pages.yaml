  md: 'Consider the \(k^{th}\) input vector \(\mathbf{x}_k\) and output vector \(\hat{y}(k)\).
    The hyper-plane function is:


    \(\begin{aligned} y^i(k) &= f_i(\mathbf{x}_k, \Theta_i) \\ &= a_0^i + a_1^i x_1(k)
    + \cdots + a_n^i x_n(k) \\ &= \begin{bmatrix} 1 & \mathbf{x}_k \end{bmatrix} \Theta_i^T,
    \quad i=1, \cdots, c \end{aligned} \tag{4}\)


    where \(\Theta_i\) is the row vector of parameters for the \(i^{th}\) fuzzy rule
    consequent part.


    The fitness function of the FCRM clustering algorithm is defined as:


    \(J_m = f(\Theta_i) = \sum_{i=1}^c \sum_{k=1}^N (u_{ik})^m E_{ik}^2(\Theta_i)
    \tag{5}\)


    where, \(E_{ik}(\Theta_i) = |f_i(\mathbf{x}_k, \Theta_i) - y(k)| = |\begin{bmatrix}
    1 & \mathbf{x}_k \end{bmatrix} [\Theta_i]^T - y(k)|\) is the distance (measure
    of error) between \(f_i(\mathbf{x}_k, \Theta_i)\), and the modeling output \(y(k)\).
    The membership function \(u_{ik}\) and consequent parameters \(a_j^i\), shown
    in (6) and (7), cannot be trained toward the direction that minimizes the fitness
    function; therefore, an improved FCRM algorithm [29] is adopted in this paper.
    Based on the modified FCRM algorithm, the membership function \(u_{ik}\) and the
    consequent parameters \(a_j^i\) can refresh and vary towards the direction that
    minimizes the fitness function.


    \(u_{ik} = \left( \sum_{s=1}^c \left( \frac{E_{ik}(\Theta_i)}{E_{sk}(\Theta_s)}
    \right)^{\frac{-2}{m-1}} \right)^{-1}, \quad 1 \le i \le c, \quad 1 \le k \le
    N \tag{6}\)


    \(a_j^i = \frac{\sum_{k=1}^n (u_{ik})^m (y^i(k) - \sum_{p \ne j} a_p^i \hat{x}_p(k))
    \hat{x}_p(k)}{\sum_{k=1}^n (u_{ik})^m}, \quad 0 \le j \le n \tag{7}\)


    where \([\hat{x}_0(k), \hat{x}_1(k), \dots, \hat{x}_n(k)] = \begin{bmatrix} 1
    & \mathbf{x}_k \end{bmatrix} = [1, x_1(k), \dots, x_n(k)]\).


    # C. A MODIFIED CLUSTER VALIDITY CRITERION


    In the process of system identification, the number of clusters is always decided
    by the user. The number of rules will affect the number of parameters and the
    effectiveness of the cluster. Therefore, different approaches [12], [30], [31]
    have been proposed for searching for an appropriate cluster number. However, most
    of the methods are more suitable for hyper-spherical-shaped clustering algorithms.
    Since the FCRM is a hyper-plane-shaped algorithm, a modified cluster validity
    criterion [32] is adopted in this paper to search for the appropriate rule number.
    The cluster validity criterion is defined by the compactness-to-separation ratio,
    the numerator reflects the compactness of the hyperplane-shaped clusters, and
    the denominator indicates the separation of the hyperplane-shaped clusters. The
    optimal rule number \(c\) is obtained when \(F_{NEW}\) reaches its minimum.


    \(F_{NEW} \equiv \frac{\sum_{i=1}^c \sum_{k=1}^N (u_{ik})^m E_{ik}^2(\Theta_i)}{N
    \min_{\substack{i=1, \dots, c \\ j=1, \dots, c \\ i \ne j}} \frac{a_{ij} + k_2}{<|\mathbf{u}_i,
    \mathbf{u}_j>| + k_1}} \tag{8}\)


    where \(a_{ij} = \frac{|a_0^j - c_0^i|}{\Delta a_{max}}\), for \(i, j = 1, \dots,
    c, i \ne j\), \(\Delta a_{max} = \max_{i=1, \dots, c \\ j=1, \dots, c} |a_0^i
    - d_0^j|\), \(a_{ij} \in [0, 1]\) is normalized, \(\mathbf{u}_i = \mathbf{n}_i
    / \|\mathbf{n}_i\|\), \(<,>\) represents the inner product, \(\mathbf{n}_i = [a_1^i
    \cdots a_n^i - 1]^T\), \(k_1, k_2\) are small real positive constants to avoid
    the function from being zero or infinity.


    # D. IMPROVED ANT COLONY OPTIMIZATION ALGORITHM


    Ant colony optimization (ACO) [33]-[35] is a metaheuristic approach that is widely
    utilized to find an approximation solution for optimization problems. The ACO
    was inspired by observations of the foraging behavior of real ants. Similar to
    the behavior of ants seeking a path between their colony and a source of food,
    the ACO algorithm was first aimed at searching for an optimal path in a graph.
    Based on the ACO algorithm, the optimization problem can be transformed into the
    problem of finding the best path on a weighted graph. The ants (hereafter, ants)
    incrementally build solutions by moving on the graph. The solution construction
    process is stochastic and depends on the pheromone model, whose values are modified
    at runtime by the ants. The combination of fuzzy logic and ACO have been widely
    applied to solving the combinatorial optimization problem, such as the traveling
    salesman problem (TSP) [36], vehicle routing problem [37], railroad-blocking problem
    [38], optimal reconfiguration for distribution systems [39], fuzzy controller
    design [40], and so on. The ACO algorithm shows the advantage of solving the optimization
    problem; however, for continuous cases, the solution for the optimization problem
    is not as clear and straightforward. Some studies have adopted the concept of
    the ACO to find a solution to the optimization problem for continuous domain,
    but they often do not follow its steps exactly. From an examination of the fuzzy
    identification problem, many unknown parameters need to be found and the interval
    for each parameter is unknown. In addition, a lot of iterations are needed to
    obtain the optimal solution; therefore, few studies have explored the fuzzy identification
    problem using the combination of fuzzy logic and the ACO algorithm. Therefore,
    in this study, an improved ACO [41] is adopted to obtain the sifted initial membership
    function and consequent parameter matrices to establish a T-S fuzzy model with
    fewer iterations. The improved ACO algorithm is briefly described as follows.


    +   1) Initialize the solutions in the pheromone table, shown in Fig. 1, and substitute
    the solutions into the fitness function (5).


    +   2) Sort the solutions by fitness function and calculate the weight of each
    solution by (9).


    \(\bar{\omega}_v = \frac{1}{\zeta T \sqrt{2\pi}} e^{-\frac{(v-1)^2}{2\zeta^2 T^2}}
    \tag{9}\)


    where \(v\) is \(v^{th}\) solution, \(\zeta T\) is standard deviation, \(T\) is
    population size, and \(\zeta\) is a parameter of ACO. When \(\zeta\) is small,
    the best-ranked solutions are strongly preferred; otherwise, the probability becomes
    more uniform.'
