    Related to the above discussion, a novel identification method based on an improved
    ACO algorithm is developed in this study. First, a cluster validity criterion
    index for the fuzzy c-regression model (FCRM) is used to determine the appropriate
    rule number of the T-S fuzzy model. Second, based on the improved ACO algorithm,
    the sifted initial membership function matrix and the consequent parameter matrix
    are obtained. Through an improved FCRM algorithm and the orthogonal least-squares
    (OLS) method, the premise and consequent parameters are obtained. Finally, some
    examples are provided to show the validity and effectiveness of the proposed identification
    method. The main contributions of this paper are as follows: i) with a cluster
    validity criterion index, the appropriate number of rules is obtained; ii) based
    on the improved ACO algorithm, a sifted initial consequent parameter matrix $\Theta_i(k)$
    is obtained; and iii) according to the obtained $\Theta_i(k)$ from the ACO algorithm
    and the improved FCRM, the membership function matrix **U** is obtained with fewer
    iterations. The rest of the paper is organized as follows. In Section II, the
    T-S fuzzy model and some algorithms that are used in the design procedure are
    introduced. In Section III, based on the FCRM algorithm, cluster validity criterion
    index, and ACO algorithm, a novel identification method based on the T-S fuzzy
    model is proposed. In Section IV, some examples are given to demonstrate that
    the proposed identification method provides better approximation and robustness
    than can be obtained using some existing methods. Last, conclusions are given
    in Section V.


    ```

    \(\hat{y}(k) = \frac{\sum_{i=1}^c w_i(k)y^i(k)}{\sum_{i=1}^c w_i(k)}\) (2)

    ```


    where $\hat{y}(k)$ is the output of the fuzzy system, the weight $w_i(k) = \prod_{q=1}^n
    A_q^i(x_q(k))$ and $\sum_{i=1}^c w_i(k) = 1$. $A_q^i(x_q(k))$ is the grade of
    the membership function, expressed as:


    ```

    \(A_q^i(x_q) = exp \left\{ - \left( \frac{x_q - \alpha_q^i}{\beta_q^i} \right)^2
    \right\}, q = 1, \cdots, n\) (3)

    ```


    where _i_ = 1, ..., _c_ is the _i<sup>th</sup>_ fuzzy rule, $\alpha_q^i$ and $\beta_q^i$
    represent the center bell-shaped membership function and the standard deviation
    of the bell-shaped membership function respectively.


    # B. FUZZY C-REGRESSION MODEL


    The fuzzy c-means (FCM) algorithm is regarded as a simple and effective clustering
    algorithm. However, the FCM algorithm is a hyper-spherical-shaped cluster algorithm;
    therefore, it is not suitable for hyper-plane-shaped clustering. Therefore, the
    FCRM clustering algorithm was proposed [25]–[28] to partition the input-output
    data pairs into hyper-plane-shaped clusters for the fuzzy modeling.'
