    ## IV. 示例


    本节提供三个示例，以证明所提出的识别方法优于某些现有方法。为了显示原始模型与所提 T-S 模糊模型之间的误差，均方误差（MSE）和平均百分误差（APE）被用作性能指标，定义为：


    \(MSE = \frac{1}{N} \sum_{k=1}^N \left( y(k) - \hat{y}(k) \right)^2 \quad (16)\)

    \(APE = \frac{1}{N} \sum_{k=1}^N \frac{|y(k) - \hat{y}(k)|}{|y(k)|} \times 100\%
    \quad (17)\)


    其中 \(k\) 是第 \(k\) 个数据集，\(N\) 是数据点总数，\(y(k)\) 是第 \(k\) 个原始模型输出，\(\hat{y}(k)\) 是模型输出的第
    \(k\) 个数据点。


    ### A. 示例 1：静态非线性函数


    考虑以下静态非线性函数 [27], [29], [32], [42]-[46]:


    \(y = \left( 1 + x_1^{-2} + x_2^{-1.5} \right)^2, \quad 1 \le x_1 \text{ and }
    x_2 \le 5. \quad (18)\)


    本实验采用来自 [44] 的 (18) 的五十个输入输出数据点来建立 T-S 模糊模型，其中 T-S 模糊模型的输入变量为 \(x_1\) 和 \(x_2\)。通过应用聚类有效性准则指数
    \(F_{NEW}\)，获得了适当的聚类数 \(c=4\)。因此，最优规则数设置为 4。利用所提出的识别方法，得到了前件部分和后件部分的参数，如表 1 所示。


    | 规则 | \(A_1^1\) | ... | \(A_2^2\) | ... | \(\Theta_s\) | ... |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | i = 1 | 3.800 | ... | 4.063 | ... | 2.360 | ... |

    | i = 2 | 1.546 | ... | 3.371 | ... | -0.097 | ... |

    | i = 3 | 1.695 | ... | 1.661 | ... | -0.129 | ... |

    | i = 4 | 3.187 | ... | 1.735 | ... | 6.848 | ... |


    基于 [32], [42] 和 [43] 中提供的参数，原始模型、[42]、[32]、[43] 以及所提模型的三维模型表示的数据集和输出分别如图 2 所示。从图
    2 可以清楚地看出，所提出的模糊识别方法可以为原始非线性模型提供比 [32]、[42] 和 [43] 更好的近似模型。所建立的模型与非线性模型之间的比较及其近似误差如图
    3 所示。从表 2 可以清楚地看出，[32] 和 [42] 采用少量规则来建立 T-S 模糊模型，并且所提方法的 MSE 值（0.0024）优于这两项研究中报告的值。


    ### B. 示例 2：静态非线性函数


