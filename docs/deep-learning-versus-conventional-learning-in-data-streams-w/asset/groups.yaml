    **SHUN-HUNG TSAI** received the B.S. degree from the Department of Industrial
    Education, National Taiwan Normal University, Taipei, Taiwan, in 1999, and the
    M.S. and Ph.D. degrees from National Cheng Kung University, Tainan, Taiwan, in
    2001 and 2007, respectively, all in electrical engineering. He was an Electrical
    Engineer with Philips Building Semiconductor from 2003 to 2005. From 2005 to 2006,
    he was a Control Engineer of China Steel Corporation. From 2006 to 2007, he was
    a Process Integration Engineer with United Microelectronics Corporation. In 2008,
    he was an Associate Researcher with the Energy and AIge System Development Metal
    Industrial Research and Develop Centre, Kaohsiung, Taiwan. He was an Assistant
    Professor with the Department of Electrical Engineering, Chang Gung University
    of Taiwan in 2008. From 2009 to 2012, he was an Assistant Professor with the Graduate
    Institute of Automation Technology, National Taipei University of Technology.
    He is currently an Associate Professor with the Graduate Institute of Automation
    Technology, National Taipei University of Technology. His major research interests
    include nonlinear control, intelligent control, system identification, robots,
    and quadrotor design.


