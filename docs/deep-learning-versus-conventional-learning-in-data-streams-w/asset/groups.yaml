    the cluster algorithm is applied to identify the parameters of the established
    model. However, since the initial premise structure, consequent parameters, and
    number of rules might lead to an inappropriate premise structure and identification
    results, this study develops an algorithm that utilizes the ACO algorithm to find
    a better initial value and adopts a modified cluster validity criterion index
    to determine the appropriate rule number. In addition, by utilizing improved FCRM
    and OLS algorithms, the final premise structure and consequent parameters are
    obtained. The proposed identification algorithm is described below in detail.


    - Step 1: Set the number of clusters \(c = 2\) and \(c_{max}\), and find the appropriate
    number of clusters using (8). Set the parameters in the ACO algorithm and initialize
    the solution \(S_i, i = 1, ..., T\) and substitute \(S_i\) into fitness function
    (5) with \(\Theta_i = S_i\).


    - Step 2: Sort the solution by fitness function, and then arrange these solutions
    in ascending order. According to (9) and (10), we can obtain the probability value
    for renewing solutions as \(S_i (i = 1, ..., T)\).


    - Step 3: Calculate the mean \(\mu^i\) using the probability value obtained by
    Step 2 and the roulette method, and set standard deviation \(\sigma_v^i\) using
    (11). If the condition \(|f^{(l+1)}(\mu^i) - f^{(l+1)}(S_i)| < 0\) is satisfied,
    then set \(S_i = \mu^i\); otherwise, keep the original \(S_i\).


    - Step 4: If the condition \(|f^{(l+1)}(S_i) - f^{(l)}(S_i)| < \delta\) is satisfied,
    then define \(S_i \equiv \Theta_i\); otherwise set \(l = l + 1\) and return to
    Step 2.


    - Step 5: Search for the minimum fitness value using (5) until the condition \(\|\mathbf{U}^{(l+1)}
    - \mathbf{U}^{(l)}\| < \varepsilon\) is satisfied, where \(\mathbf{U}^{(l)} =
    \begin{bmatrix} u_{11}^{(l)} & \cdots & u_{1N}^{(l)} \\ \vdots & \ddots & \vdots
    \\ u_{c1}^{(l)} & \cdots & u_{cN}^{(l)} \end{bmatrix}\) .


    The center of the bell-shaped membership function \(\alpha_q^i\) and the standard
    deviation of the bell-shaped membership function \(\beta_q^i\) can be obtained
    by the following formulas:


    \(\begin{array}{ c }

    \alpha_q^i = \frac{\sum_{k=1}^n u_{ik}x_q}{\sum_{k=1}^n u_{ik}} \\

    (12)

    \end{array}\)


    \(\begin{array}{ c }

    \beta_q^i = \sqrt{\frac{2 \sum_{k=1}^n u_{ik} \left( x_q - \alpha_q^i \right)^2}{\sum_{k=1}^n
    u_{ik}}} \\

    (13)

    \end{array}\)


    The grade of the membership function \(A_q^i(x_q(k))\) can be obtained by (3),
    and weight \(w_i(k)\) and output \(\hat{y}\) can be obtained as \(w_i(k) = \prod_{q=1}^n
    A_q^i(x_q(k))\), and \(\hat{y}(k) = \frac{\sum_{i=1}^c w_i(k)\hat{y}^i}{\sum_{i=1}^c
    w_i(k)}\) .


    - Step 6: Substitute the input-output data and \(\hat{y}(k)\) obtained from Step
    5 into (14).


    \(\begin{array}{ c }

    \mathbf{y} = \bar{\Phi}\hat{\Theta}^T + \mathbf{e} \\

    (14)

    \end{array}\)


