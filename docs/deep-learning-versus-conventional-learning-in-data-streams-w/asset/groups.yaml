    | i = 1 | 3.800 | ... | 4.063 | ... | 2.360 | ... |

    | i = 2 | 1.546 | ... | 3.371 | ... | -0.097 | ... |

    | i = 3 | 1.695 | ... | 1.661 | ... | -0.129 | ... |

