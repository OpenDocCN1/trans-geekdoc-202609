    ## IV. EXAMPLES


    In this section, three examples are provided to demonstrate that the proposed
    identification method outperforms some existing methods. In order to show the
    error between the original model and the proposed T-S fuzzy model, the mean square
    error (MSE) and average percentage error (APE) are used as performance indices,
    defined as:


    \(MSE = \frac{1}{N} \sum_{k=1}^N \left( y(k) - \hat{y}(k) \right)^2 \quad (16)\)

    \(APE = \frac{1}{N} \sum_{k=1}^N \frac{|y(k) - \hat{y}(k)|}{|y(k)|} \times 100\%
    \quad (17)\)


    where \(k\) is the \(k^{th}\) data set, \(N\) is the total number of data points,
    \(y(k)\) is the \(k^{th}\) original model output and \(\hat{y}(k)\) is the \(k^{th}\)
    data point of the model output.


    ### A. EXAMPLE 1: STATIC NONLINEAR FUNCTION


    Consider the following stationary nonlinear function [27], [29], [32], [42]-[46]:


    \(y = \left( 1 + x_1^{-2} + x_2^{-1.5} \right)^2, \quad 1 \le x_1 \text{ and }
    x_2 \le 5. \quad (18)\)


    Fifty input-output data points of (18) from [44] are adopted in this experiment
    to establish the T-S fuzzy model, where the input variables of the T-S fuzzy model
    are \(x_1\) and \(x_2\). By applying the cluster validity criterion index \(F_{NEW}\),
    the appropriate cluster \(c=4\) is obtained. Therefore, the optimal rule number
    is set as 4. Utilizing the proposed identification method, the parameters of the
    antecedent and the consequent parts are obtained, as shown in Table 1.


