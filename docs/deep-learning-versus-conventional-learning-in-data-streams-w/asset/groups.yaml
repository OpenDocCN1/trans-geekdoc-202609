    ## V. 结论


    本文提出了一种结合修正的聚类有效性准则指标、ACO 算法和 OLS 算法的新型模糊辨识方法。通常，初始前件结构和后件参数可能会影响最终的辨识结果。因此，本文采用
    ACO 算法来筛选更好的初始前件和后件参数。此外，规则数量不足会导致前件结构不合适，建模结果不合理。因此，采用修正的聚类有效性准则指标来确定适当的规则数量。此外，不使用传统的
    FCRM 算法，而是采用改进的 FCRM 算法，模糊隶属度矩阵 U 和后件参数 Θ 可以逐渐朝着最小化适应度函数的方向进行刷新和变化。此外，前件参数可以从
    U 中得到，最终的后件参数可以通过 OLS 算法得到。最后，给出了三个示例，表明所提辨识方法相比其他方法能提供更好的近似结果和鲁棒性。


