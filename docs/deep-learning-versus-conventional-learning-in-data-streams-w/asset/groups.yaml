    的维度，_k_ 是第 _k_ 个数据集。T-S 模糊模型的第 _i_ 规则表示为：


    规则 i：

    IF $x_1(k)$ 是 $A_1^i$ 且 $\cdots$ 且 $x_n(k)$ 是 $A_n^i$

    THEN $y^i(k) = a_0^i + a_1^i x_1(k) + \cdots + a_n^i x_n(k)$ (1)


    其中 _i_ = 1, ..., _c_ 是第 _i_ 个模糊规则，_c_ 是模糊规则的数量，_x<sub>q</sub>_(_k_) 是输入变量，_q_
