    In order to show the robustness of the proposed fuzzy identification method, we
    compare the established model output with the other approaches under the different
    noises. Figs. 8 and 9 show the MSE values of the training and testing data under
    the signal-to-noise ratio (SNR), respectively. From Figs. 8 and 9, it can be observed
    that when the noise variance increase, the MSE values of the proposed method increases
    slightly more than in the other methods. Table 8 lists the comparison results
    of the proposed approach along with the other approaches under a different SNR
    level. From Table 8, it is evident that the proposed fuzzy identification method


    in this paper can provide a better robustness than the other three studies.


    # V. CONCLUSION


    In this paper, a novel fuzzy identification method that combines a modified cluster
    validity criterion index and ACO and OLS algorithms is proposed. In general, the
    initial premise structure and consequent parameters might affect the final identification
    result. Therefore, in this paper, the ACO algorithm is adopted to sift better
    initial premises and the consequent parameters. In addition, an insufficient number
    of rules will lead to an inappropriate premise structure and'
  - '[PAGE 8]


    unreasonable modeling results. A modified cluster validity criterion index is
    thus adopted to determine the appropriate rule number. In addition, instead of
    the conventional FCRM algorithm, an improved FCRM algorithm is utilized, and the
    fuzzy membership matrix U and consequent parameters Θ can be refreshed and varied
    towards the direction that minimizes the fitness function gradually. Furthermore,
    the antecedent parameters can be obtained from U and the final consequent parameters
    can be obtained via the OLS algorithm. Last, three examples are given to show
    that the proposed identification method provides better approximation results
    and robustness than those obtained using other methods.


