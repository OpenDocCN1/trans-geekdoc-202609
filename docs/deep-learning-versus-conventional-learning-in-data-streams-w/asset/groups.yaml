    2003 年至 2005 年在飞利浦半导体担任电气工程师。2005 年至 2006 年，他担任台湾中钢公司控制工程师。2006 年至 2007 年，他在联华电子公司担任工艺整合工程师。2008
    年，他担任台湾高雄市金属工业研究发展中心能源与老龄系统发展处副研究员。2008 年，他担任台湾长庚大学电气工程系助理教授。2009 年至 2012 年，他担任台湾台北科技大学自动化技术研究生院助理教授。他目前是台湾台北科技大学自动化技术研究生院副教授。他的主要研究兴趣包括非线性控制、智能控制、系统辨识、机器人和四旋翼机设计。


    ![](img/7a2a4261fbc1474308250e4dcaab8af5_9_1.png)


    **陈昀雯** 于 2013 年获得台湾台北市大同大学学士学位。她目前正在台湾台北科技大学自动化技术研究生院先进智能控制实验室攻读博士学位。她的主要研究兴趣包括机器视觉、系统辨识、自主移动机器人和聚类算法。


