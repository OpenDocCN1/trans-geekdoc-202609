    - 步骤 4：如果满足条件 \(|f^{(l+1)}(S_i) - f^{(l)}(S_i)| < \delta\)，则定义 \(S_i \equiv \Theta_i\)；否则设置
    \(l = l + 1\) 并返回步骤 2。


    - 步骤 5：使用 (5) 搜索最小适应度值，直到满足条件 \(\|\mathbf{U}^{(l+1)} - \mathbf{U}^{(l)}\| < \varepsilon\)，其中
    \(\mathbf{U}^{(l)} = \begin{bmatrix} u_{11}^{(l)} & \cdots & u_{1N}^{(l)} \\ \vdots
    & \ddots & \vdots \\ u_{c1}^{(l)} & \cdots & u_{cN}^{(l)} \end{bmatrix}\) 。


