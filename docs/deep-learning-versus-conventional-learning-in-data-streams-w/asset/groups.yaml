    # # A Novel Fuzzy Identification Method Based on Ant Colony Optimization Algorithm


    SHUN-HUNG TSAI AND YU-WEN CHEN

    Graduate Institute of Automation Technology, National Taipei University of Technology,
    Taipei 10608, Taiwan

    Corresponding author: S.-H. Tsai (shtsai@ntut.edu.tw, shtsai@mail.ntut.edu.tw)

    This work was supported by the Ministry of Science and Technology, Taiwan, under
    Grants MOST-104-2221-E-027-066 and MOST-105-2221-E-027-068.


    **ABSTRACT** In this paper, an identification problem for nonlinear models is
    explored and a novel fuzzy identification method based on the ant colony optimization
    algorithm is proposed. First, a modified cluster validity criterion with a fuzzy
    c-regression model is adopted to find appropriate rule numbers of the Takagi-Sugeno
    fuzzy model. Then, the ant colony optimization algorithm is adopted and the sifted
    initial membership function and the consequent parameters of the fuzzy model are
    obtained. Through an improved fuzzy c-regression model and the orthogonal least-squares
    method, the premise structure and the consequent parameters can be obtained to
    establish the Takagi-Sugeno fuzzy model. Some examples are illustrated to show
    that the proposed method provides better approximation results and robustness
    than those obtained using some of the existing methods.


    **INDEX TERMS** Fuzzy system identification, Takagi-Sugeno fuzzy model, ant colony
    optimization algorithm (ACO), fuzzy c-regression model.


    ## I. INTRODUCTION

    Fuzzy logic has been applied to the analysis of physical and engineering problems
    [1]–[4]. In addition, fuzzy models have been widely applied to the identification
    of nonlinear systems in the past few decades. Among the various types of fuzzy
    model, the Takagi-Sugeno (T-S) fuzzy model [5]–[7] is regarded as being effective
    and powerful for identifying nonlinear models. The T-S fuzzy model is described
    by a family of fuzzy IF-THEN rules that represent the local linear input-output
    relations of the model. The overall T-S fuzzy model can be obtained by blending
    these linear models via fuzzy membership functions to represent the nonlinear
    model. In addition, the T-S fuzzy model has been shown to be a universal function
    approximator as it can approximate any smooth nonlinear function to any degree
    of accuracy in any convex compact region [8]. Therefore, based on the T-S fuzzy
    model, many approaches have been developed for the identification of nonlinear
    models [9]–[11]. Identification approaches based on the T-S fuzzy model can be
    roughly classified into two types: One type is independent of the input-output
    data, with the T-S fuzzy model established from the nonlinear model via some known
    system parameters and analytic methods, such as the sector nonlinearities method
    [8] and the equilibrium point modeling methods [2]. However, the disadvantages
    are that the nonlinear system parameters must be known in advance. The other type
    of identification approach involves establishing the T-S fuzzy model based on
    the input-output data. The advantage is that the T-S fuzzy model can be established
    from the original model when the system parameters are not known. Therefore, it
    is recognized that the latter approach is more suitable for real-world applications
    than the former, and so many fuzzy identification methods based on input-output
    data have been developed.


    For the identification problem with the T-S fuzzy model, a major procedure is
    to determine the number of fuzzy rules. However, most approaches do not set the
    number of fuzzy rules automatically. So hierarchical sparse fuzzy inference systems
    have been proposed for finding the minimum rule numbers of the T-S fuzzy model
    [10]; however, for some models, the established T-S fuzzy model with minimum rule
    number cannot precisely represent the original model. In one study [11], the rule
    base and the number of rules were obtained during the evolutionary process in
    which the mutation process played a key role. In another study [12], an index
    was proposed to determine the appropriate rule number for a hyper-spherical-shaped
    clustering algorithm, but it was not suitable for hyper-planes. Therefore, in
    this study, a modified cluster validity criterion with the fuzzy c-regression
    model is adopted to obtain the appropriate rule numbers.'
