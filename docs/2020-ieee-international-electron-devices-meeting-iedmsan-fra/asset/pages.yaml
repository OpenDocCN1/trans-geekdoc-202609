    **Abstract—**In this work, we propose and demonstrate a multi-layer (3D) vertical
    RRAM (VRRAM) PUF with in-line stabilization scheme to improve both efficiency
    and reliability. An 8-layer RRAM array was manufactured with excellent uniformity
    and good endurance of $10^{9}$. From the variation in RRAM resistance, enhanced
    randomness is achieved by utilizing the parallelism of 3D structures. To address
    the issue of unstable bits in PUF output, in-line stabilization is proposed by
    employing asymmetric biasing to stabilize the unstable bits. The error rate is
    reduced by $-(76\%)$ for $(3/5)$ times. The proposed PUF features exhibit excellent
    resistance against machine learning attacks and passes both National Institute
    of Standards and Technology (NIST) 80-22 and 800-10 tests.


