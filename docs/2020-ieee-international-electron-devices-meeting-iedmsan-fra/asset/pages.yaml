    # ## II. PROPOSED PUF DESIGN


    A. 3D VRRAM Integration for High Density


    The 3D VRRAM structure in Fig. (1a) possesses the advantages of crosstalk and
    NAND to provide high area efficiency. The images are shown in Fig. (1a) and (b).
    Each layer of metal electrode and device structure can be stacked one by one.
    One TIN cell uses metal electrode and Ti layers as electrodes. Ti/HfOx layers
    are the switching layers. The device process flow and patterns are reported in
    our work [2]. The density of 3D cells is compared with 2D arrays in each layer.
    Fig. 3 shows the endurance test result with $4.5\sigma$ for $10^{5}$ cycles, and
    $3.8\sigma$ for $10^{6}$ cycles, which is a robust PUF output. Given that one-bit
    PUF output is generated, the response is generated by comparing 2 PUF cells. The
    PUF cell can be extracted independently for 1-bit 8-layer structure.


