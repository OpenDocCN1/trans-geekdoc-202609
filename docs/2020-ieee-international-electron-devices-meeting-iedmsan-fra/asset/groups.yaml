    # 一种用于安全应用的垂直 RRAM 和 0.0014% 误差内联组合方案的抗机器学习 3D PUF


    Jiang Wang$^{1,2}$, Dengyun Li$^{3}$, Chen Cheng, Jin$^{3}$, Haijun Jiang, Qting
    Ding, Qing Luo$^{2}$, Xiaoyue Xue$^{4}$, Hangbang Li$^{2}$, Xiaoyang Zeng and
    Ming Liu


    $1$浙江实验室，中国杭州；中国科学院微电子与集成技术重点实验室，中国北京；$^{2}$工业和信息化部第五电子研究所，中国广州；$^{3}$北京大学数学学院ASIC与系统国家关键实验室。
    $*xueoyang@gmail.com; lvhang@nju.edu.cn


    **摘要—** 在此工作中，我们提出并演示了一种具有内联稳定方案的层层（3D）垂直 RRAM（VRRAM）PUF，以同时提高效率和可靠性。制造了 8 层 RRAM
    阵列，具有极佳均匀性和 $10^{9}$ 的良好耐用性。通过 RRAM 电阻的变化，利用 3D 结构的并行性实现了增强的随机性。为了解决 PUF 输出中不稳定位点的问题，通过采用非对称偏置来稳定不稳定位点的内联稳定方案。在
    $(3/5)$ 的情况下，误差率降低了 $-(76\%)$。所提出的 PUF 特性表现出对机器学习攻击的卓越抵抗力，并通过了美国标准与技术研究院（NIST）80-22
    和 800-10 测试。


    ## I. 引言


    物理不可克隆函数（PUFs）已成为安全物联网（IoT）设备中硬件保护源的一种优势 [1–5]。该区域资源基于工艺偏差，很难在低面积/位成本且具有低误差率或低位错误率（BER）的情况下构建构建
    PUF [6]。此外，低 BER 可能会因为高电阻比或纠错误差的额外成本而导致成本效益低。。


    传统的 PUF 在 PUF 变化下面临面积效率低和位错误率不理想的问题。通常，强 PUF 基于仲裁器（arbiter）和环振荡器，而弱 PUF 则基于 SRAM、Flash
    和 DRAM [11–15]。然而，它们与 CMOS 技术不兼容，因为后者的面积和成本远超 10nm。BER 是由 PUF 变化下的输出不稳定性引起的 [13,14]。稳定和纠错技术（如使用强化算法和纠错码）可以帮助提高输出可靠性，但在结果中需要考虑成本因素
    [1–4]。


    最近，PUF 已利用存储电阻的固有变化实现，这提供了一种基于硬件的安全原语。由于 RRAM 集成在后端金属（BEOL），可以减少面积。通过使用自选电阻，PUF
    也可以变得非常灵活。在这项工作中，我们提出并演示了一种具有内联稳定方案的多层垂直 RRAM（VRRAM）PUF，以同时提高效率和可靠性。使用了基于 8 层
    RRAM 阵列的硅基 PUF。


    ## II. 提出的 PUF 设计


    A. 高密度的 3D VRRAM 集成


    图 (1a) 中的 3D VRRAM 结构具有跨串扰和 NAND 的优势，可以提供高面积效率。图像如图 (1a) 和 (b) 所示。每一层金属电极和器件结构都可以逐一堆叠。一个
    TIN 单元使用金属电极和 Ti 层作为电极。Ti/HfOx 层是开关层。器件工艺流程和模式在我们的工作中已报道 [2]。3D 单元的密度与每层的 2D 阵列进行了比较。图
    3 显示了 $10^{5}$ 次循环的 $4.5\sigma$ 和 $10^{6}$ 次循环的 $3.8\sigma$ 耐用性测试结果，这是一个稳健的 PUF
    输出。由于生成的单位 PUF 输出，响应是通过比较两个 PUF 单元生成的。对于 1 位 8 层结构，可以独立提取 PUF 单元。


    B. 增强型 3D-PUF 概念


    RRAM 的电阻表现出稳定特性，可以作为 PUF 的随机源 [5]。在此工作中，采用高阻态（HRS）来实现低功耗。通过应用电压偏置来选择不稳定位，生成一个
    PUF 输出。如图 4 所示，测量两个选定位之间的差异。两个不同的位位于同一行，读取时会产生感电流。比较两个位之间的差异。RRAM 阵列中的选行和列分开。得益于
    3D VRAM 中的 IR 降和无偏置的漏电流路径，RRAM 的增强随机性得到了保证。互连线中的寄生电阻受到影响，使得读取电流路径更加复杂和多样。其次，来自半选单元的漏电流在选定单元上显示出有效电压，导致不同产生不同的电阻状态。此外，与相同层数的
    2D 阵列相比，3D 交叉阵列具有更多的漏电流路径，提高了读取电流的随机性。原因是 3D 交叉阵列不同平面的位是连接的，进入选定平面的电流可能会流过其他未选定区域，形成了比相同层面积
    2D 更多的电流路径。假设 3D 生成器在每层中垂直创建 M×N 路径。因此，3D 和 2D 的电流路径计数关系为 (1)。


    C. 低 BER 的单元内稳定性


    误差率在 $(3/5)$ 的情况下降低了 $-(76\%)$。所提出的 PUF 特性表现出对机器学习攻击的卓越抵抗力，并通过了美国标准与技术研究院（NIST）80-22
    和 800-10 测试。


    测得的芯片间和芯片内汉明距离（HD）分别为 0.004 和 0.004。测得的芯片间和芯片内汉明距离分别为 0.004 和 0.004。测得的芯片间和芯片内汉明距离分别为
    0.004 和 0.004。测得的芯片间和芯片内汉明距离分别为 0.004 和 0.004。


    ## III. 结果与讨论


    测得的芯片间和芯片内汉明距离分别为 0.004 和 0.004。测得的芯片间和芯片内汉明距离分别为 0.004 和 0.004。测得的芯片间和芯片内汉明距离分别为
    0.004 和 0.004。测得的芯片间和芯片内汉明距离分别为 0.004 和 0.004。


    ## IV. 结论


    总结来说，一种具有内联稳定方案的多层 3D 垂直 RRAM（VRRAM）PUF 提高了提高了效率和可靠性。制造了 8 层 RRAM 阵列，具有极佳均匀性和
    $10^{9}$ 的良好耐用性。所提出的 PUF 特性表现出对机器学习攻击的卓越抵抗力，并通过了美国标准与技术研究院（NIST）80-22 和 800-10
    测试。


