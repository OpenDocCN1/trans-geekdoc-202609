    \ probability of event X given event Y has occurred, as specified in Equation\
    \ 4.7.\n\n$$P\\\\left( {X|Y} \\\\right) = \\\\ \\\\frac{P(Y|X).P\\\\left( X \\\
    \\right)}{P\\\\left( Y \\\\right)},$$  \n\n<graphic xlink:href=\"math4\\_7.tif\"\
    />\n\n(4.7)\n\nwhere\n\n *P*(*X*|*Y*) <img src=\"images/inline-math4\\_11.jpg\"\
    \ alt=\"\"/>  is the conditional probability of X given Y.\n\n *P*(*Y*|*X*) <img\
    \ src=\"images/inline-math4\\_12.jpg\" alt=\"\"/>  is the conditional probability\
    \ of Y given X.\n\n *P*(*X*) <img src=\"images/inline-math4\\_13.jpg\" alt=\"\"\
    />  is the Probability of event X.\n\n *P*(*Y*) <img src=\"images/inline-math4\\\
    _14.jpg\" alt=\"\"/>  is the Probability of event Y.\n\nThe best feature of Naive\
    \ Bayes is that it can handle an arbitrary number of independent variables regardless\
    \ of whether they are independent or continuous.\n\nFrom a set of variables  *X* = {*x*1, *x*2,−−−−−−*x**n*}\
    \ <img src=\"images/inline-math4\\_15.jpg\" alt=\"\"/>  we want to get the posterior\
    \ probability for the event *Cj* among the set of outcomes  *C* = {*c*1, *c*2,−−−−−−−*c**n*}\
    \ <img src=\"images/inline-math4\\_16.jpg\" alt=\"\"/> . Here in more generic\
    \ terms X is the set of predictors, and C is the categorical levels present in\
    \ the dependent variables.\n\nThe final posterior probability is as given [Equation\
    \ 4.8](#chapter04.xhtml#math4_8).\n\n$$p\\\\left( {C\\_{j\\\\ }|\\\\ X} \\\\right)\
    \ \\\\propto p\\\\ \\\\left( C\\_{j\\\\ } \\\\right)\\\\prod\\\\limits\\_{k}^{n}p\\\
    \\left( {x\\_{n\\\\ }|\\\\ C\\_{j\\\\ }} \\\\right).\\\\ $$  \n\n<graphic xlink:href=\"\
    math4\\_8.tif\"/>\n\n(4.8)\n\n### 4.6.1 Advantages of Naive Bayes\n\n*   It builds\
    \ the model quickly and makes quick decisions.\n\n*   It can handle both continuous\
    \ and discrete data.\n\n*   It is highly scalable with respect to the number of\
    \ predictors and data points.\n\n*   Medical Diagnosis\n\n*   Weather Prediction\n\
