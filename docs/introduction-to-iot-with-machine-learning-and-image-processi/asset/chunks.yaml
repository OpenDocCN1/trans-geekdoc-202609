    # Authors


    **Dr. Shrirang Ambaji Kulkarni** is a prolific learner, author, and faculty member
    with 18-plus years of experience in the field of Computer Science and Engineering.
    He is currently working as an Associate Professor at the National Institute of
    Engineering in the Department of Computer Science and Engineering, Mysore, India.


    **Dr. Varadraj P. Gurupur** is an distinguished faculty member and researcher
    in the field of Health Informatics. He has authored many research articles in
    reputed journals. He is currently working as an Associate Professor at the University
    of Central Florida in the Department of Health Informatics, Florida, USA.


    **Dr. Steven Lawrence Fernandes** is a high-profile researcher in the field of
    Image Processing. He is currently working as Post-Doctoral Fellow at the University
    of Central Florida in the Department of Computer Science and Engineering, Florida,
    USA.


    # Chapter 1: Introduction


    In the last three decades, technology has changed the way we live our lives. This
    happens to be a universally accepted truth. In this book, we attempt to illustrate
    the use of a new technology that has changed the world of communication, computing
    and computing education. Interestingly, the name of this technology coincides
    with that of a famous dessert named Raspberry Pie. Raspberry `Pi` is a single
    board computer developed in the United Kingdom. Incidentally, the organization
    that started this is known as the Raspberry Pi Foundation. This was first launched
    in the year 2012.


    By the year 2015, Raspberry Pi had gained wide-scale popularity. One of the key
    features of this technology was its size and adaptability. In some strange ways,
    Raspberry Pi was the panacea the world of technology was dreaming of. To build
    on this idea of a tiny computer, one must consider the fact that more than a decade
    ago you would have computer programs running on desktops wired to electromechanical
    systems that would use them. The advent of the Raspberry Pi enables the community
    of technology developers to innovate handheld devices than can encompass the power
    of regular computers. Our intention in writing this book is twofold: a) we want
    to provide a basic understanding of how `Raspberry Pi` can be used, and b) we
    want to provide information on how `Raspberry Pi` can be used for machine learning.


    While providing information on `Raspberry Pi`, we will help students comprehend
    the necessary information to develop applications. This is another very important
    reason this book is needed for its targeted audience. Additionally, the authors
    envision `Raspberry Pi` advancing science and technology across various domains
    such as medicine, security, communication, and the military. It is our attempt
    to have this book used as study material for courses teaching students about `Raspberry
    Pi`. It is our understanding that `Raspberry Pi` can be used extensively in healthcare
    systems.


    In this book, the authors present a transformative interdisciplinary perspective
    of `Raspberry Pi` usage. This idea is based on the philosophy of transformative
    transdisciplinary perspective presented by the founding fathers of Society for
    Design and Process. This philosophy is based on bringing about a positive change
    to one domain by making changes or improvements in another. This philosophy is
    applicable to `Raspberry Pi` because rapid improvements in `Raspberry Pi` and
    its applicability will facilitate and create a rostrum for improvements in all
    the domains in which this device can be used. One example will be the implementation
    of machine learning algorithms that can aid image processing. In this book, the
    authors have dwelled on some of the fundamental programming concepts that are
    needed for image analysis and machine learning.

