    \ Write a Python program using the `SciPy` library to compute the determinant\
    \ of an array \n\n$$\\begin{matrix} 1 \\\\ 4 \\\\ 7 \\\\ \\end{matrix}\\;\\;\\\
    \\;\\\\;\\\\begin{matrix} 2 \\\\ 5 \\\\ 8 \\\\ \\end{matrix}\\;\\\\;\\\\;;\\\\\
    begin{matrix} 3 \\\\ 6 \\\\ 9 \\\\ \\end{matrix}$$  \n\n<graphic xlink:href=\"\
    unmath3\\_16.tif\"/>\n\n6. Write a Python program using `Matplotlib` and considering\
    \ a suitable example to plot a 3-dimensional line graph.\n\n# Machine Learning\
    \ (#toc.xhtml#ch-04)\n\n## 4.0 What Is Meant by Machine Learning?\n\nIn machine\
    \ learning, algorithms attempt to learn without explicit instructions and human\
    \ interventions and only through experiences.\n\n## 4.1 Categories of Machine\
    \ Learning\n\nMachine learning algorithms are classified as:\n\n* Supervised\n\
    * Unsupervised\n* Reinforcement Learning\n\n### 4.1.1 Supervised Learning\n\n\
    Supervised algorithms learn from labeled data. In supervised learning, there are\
    \ sets of defined inputs and outputs; through multiple iterations, supervised\
    \ learning algorithms come up with a function that helps to correctly conclude\
    \ an output for a given set of inputs that were not part of training data.\n\n\
    ### 4.1.2 Unsupervised Learning\n\nUnsupervised algorithms work with unlabeled\
    \ data. Here the algorithms are provided only with data, and they try to find\
    \ the interesting patterns in this data. Unsupervised learning tries to find the\
    \ commonalities in the data; for a new sample, it tries to find the presence or\
    \ absence of the discovered commonalities.\n\n### 4.1.3 Reinforcement Learning\n\
    \nIn reinforcement learning, we have agents that interact with an environment\
    \ to maximize its rewards. It is like learning with a critic. For correct decisions,\
    \ the agent is rewarded; for wrong decisions, the agent is penalized. Thus, the\
    \ goal for an agent would be to maximize rewards and reach the goal state.\n\n\
    The machine learning algorithms of supervised, unsupervised and reinforcement\
    \ learning are illustrated in [Figure 4.1](#chapter04.xhtml#fig4_1)\n\n![Figure\
    \ 4.1 Categories of Machine Learning Algorithms.](images/fig4_1.jpg)\n\nFigure\
    \ 4.1 Categories of Machine Learning Algorithms.\n\nIn this book, we discuss the\
    \ classification of Supervised Machine Learning algorithms.\n\n## 4.2 Classification\
    \ in Machine Learning\n\nIn classification, we try to predict categorical values.\
    \ The labels for these categorical values come up with a finite set of classes.\n\
    \nExamples:\n\n* Given an image, predict cat or dog.\n* Given an email, predict\
    \ spam or real.\n\nIn binary classification, we have only two classes for prediction,\
    \ usually with values 0 and 1.\n\nIn multi classification, we have more than two\
    \ classes for prediction (e.g., cat, dog or deer).\n\nIn this chapter, we apply\
    \ the following algorithms for classification problems:\n\n1. Logistic Regression\n\
    2. Naïve Bayes\n3. Neural Network\n4. Support Vector Machine\n5. Random Forest\n\
    6. K N N\n7. Linear Discriminate Analysis (LDA)\n\n### 4.2.1 Metrics for Classification\n\
    \nThe following metrics have been used to evaluate the supervised algorithms as\
    \ mentioned section 4.2.\n\n#### 4.2.1.1 K-Fold Cross-Validation\n\nCross-validation\
    \ is an important technique used to validate the performance of a given model.\
    \ Cross-validation involves keeping a sample of the dataset for testing and training\
    \ the model on the remaining part of the dataset.\n\nThe value `k` determines\
    \ the number of groups into which data can be split. We have set the value of\
    \ `k` to 10. Thus, it is called 10-fold cross-validation.\n\nA value of `k` equaling\
    \ 10 is the most popular value for validating the accuracy of models.\n\n####\
    \ 4.2.1.2 Confusion Matrix\n\nA confusion matrix (sometimes known as an error\
    \ matrix) allows us to analyze the performance of a machine-learning algorithm\
    \ in a matrix format. Rows represent the predicted class, while columns represent\
    \ the actual class.\n\nThe confusion matrix layout is as depicted in Figure 4.2\n\
    \n**Figure 4.2** Confusion Matrix Layout.\n\n| || Actual Values |\n| --- | ---\
    \ |\n| Predicted Values || || Positive (Yes) | Negative (No) |\n| --- | --- |\
    \ --- | --- |\n| Positive (Yes) || TP || FP |\n| Negative (No) || FN || TN |\n\
    \n* `TP` stands for True Positive: the prediction is yes, and it is true.\n* `TN`\
    \ stands for True Negative: the prediction is no, and it is false.\n* `FN` stands\
    \ for False Negative: the prediction is no, and it is true.\n* `FP` stands for\
    \ False Positive: the prediction is yes, and it is false.\n\n**Accuracy` determines\
    \ the correctness of the confusion matrix; it is given in [Equation 4.1](#chapter04.xhtml#math4_1)\n\
    \n$$accuracy = \\frac{TP + TN}{total},$$\n\n<graphic xlink:href=\"math4\\_1.tif\"\
    />\n\n(4.1)\n\nwhere the total is the row sum of Predicted or the column sum of\
    \ Actuals.\n\n**Precision` gives the correctness of Prediction when it is Yes\
    \ and is given in [Equation 4.2](#chapter04.xhtml#math4_2)\n\n$$precision = \\\
    frac{TP}{Predicted Yes},$$\n\n<graphic xlink:href=\"math4\\_2.tif\"/>\n\n(4.2)\n\
    \nwhere Predicted Yes is the row sum of Predicted values.\n\n**Recall` is the\
    \ capacity of the model to find data points of interest and is given in [Equation\
    \ 4.3](#chapter04.xhtml#math4_3)\n\n$$recall = \\frac{TP}{TP + FN}.$$\n\n<graphic\
    \ xlink:href=\"math4\\_3.tif\"/>\n\n(4.3)\n\n## 4.3 Regression\n\nIn regression,\
    \ we try to predict continuous valued output. Machine learning algorithms that\
    \ predict continuous valued outputs are:\n\n* Linear Regression\n* Multiple Linear\
    \ Regression\n* Support Vector Machine (applied for both regression and classification)\n\
    \n## 4.4 Scikit-Learn\n\nScikit-learn is a library for Python Programming language\
    \ that supports machine learning. It supports machine-learning features like classification,\
    \ regression and clustering along with APIs to support popular algorithms like:\n\
    \n1. Linear Regression\n2. Logistic Regression\n3. Naive Bayes\n4. Neural Network\n\
    5. Support Vector Machine\n6. Random Forest\n7. K N N\n8. LDA\n\n### 4.4.1 Dataset\n\
    \nWe have analyzed the heart disease data set from University of California, Irvine.\
    \ For our classification tests, we used only 14 attributes, listed in [Table 4.1](#chapter04.xhtml#table4_1).\n\
    \nTable 4.1 Description of heart disease dataset attributes\n\n| Sl\\_No | Attribute\
    \ Name | Attribute Name and Description |\n| --- | --- | --- |\n| 1 | age | Age\
    \ in years |\n| --- | --- | --- |\n| 2 | sex | Sex (1 = male; 0 = female) |\n"
