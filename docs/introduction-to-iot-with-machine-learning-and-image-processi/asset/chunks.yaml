    Averaging applies the mathematical process of convolution to the image with a
    normalized box filter. Convolution is a mathematical operation describing how
    one function may alter another to produce a third function.

    * For example, if you consider a normalized box filter with dimensions of 4*4
    (i.e., 4 rows and 4 columns, with each element equal to 1), the total value equals
    16, so we will multiply it by 1/16. Here we used the read image and a (9*9) normalized
    box filter as the input parameters.

    * The built-in function `cv2.filter2D` sharpens the image by emphasizing the edges.
    There are three input parameters required: first is the read image, second is
    the depth (if we input a depth of -1, the sharpened image will have the same depth
    as the original image) and the third variable is the kernel.


