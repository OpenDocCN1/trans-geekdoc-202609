    \ 朴素贝叶斯\n\n朴素贝叶斯是一种监督学习技术。它基于贝叶斯定理的概率分类器。它代表了一种依赖于预测变量（独立变量）独立性的分类技术。\n\n“朴素”（Naive）一术意味着某些特征的出现与其他特征是独立的。“贝叶斯”（Bayes）一术告诉我们朴素贝叶斯的基础是贝叶斯定理。贝叶斯定理给出了事件\
    \ Y 发生事件 X 的条件概率，如公式 4.7 所示。\n\n$$P\\left( {X|Y} \\right) = \\ \\frac{P(Y|X).P\\\
    left( X \\right)}{P\\left( Y \\right)},  \n\n<graphic xlink:href=\"math4_7.tif\"\
    />\n\n(4.7)\n\n其中\n\n*   $P(X|Y)$ <img src=\"images/inline-math4_11.jpg\" alt=\"\
    \"/> 是给定 Y 的情况下 X 的条件概率。\n*   $P(Y|X)$ <img src=\"images/inline-math4_12.jpg\"\
    \ alt=\"\"/> 是给定 X 的情况下 Y 的条件概率。\n*   $P(X)$ <img src=\"images/inline-math4_13.jpg\"\
    \ alt=\"\"/> 是事件 X 的概率。\n*   $P(Y)$ <img src=\"images/inline-math4_14.jpg\" alt=\"\
    \"/> 是事件 Y 的概率。\n\n朴素贝叶斯最大的特征是它可以处理任意数量的独立变量，无论它们是独立的的还是连续的。\n\n从一组变量 $X = \\\
    {x_1, x_2, ..., x_n\\}$ <img src=\"images/inline-math4_15.jpg\" alt=\"\"/> 中，我们想要从输出结果集\
    \ $C = \\{c_1, c_2, ..., c_n\\}$ <img src=\"images/inline-math4_16.jpg\" alt=\"\
    \"/> 中获得事件 $C_j$ 的后验概率。在这里用更通用的术来说，$X$ 是预测变量集，$C$ 是因变量中存在的类别水平。最终的后验概率如公式 4.8\
    \ 所示。\n\n$$p\\left( {C_{j} }| X \\right) \\propto p\\ \\left( C_{j} } \\right)\\\
    prod_{k}^{n}p\\left( {x_{n} }| C_{j} }} \\right).  \n\n<graphic xlink:href=\"\
    math4_8.tif\"/>\n\n(4.8)\n\n### 朴素贝叶斯的优点\n\n*   它可以处理任意数量的独立变量，无论它们是独立的还是连续的。\n\
    *   计算速度快。\n*   在某些情况下，即使数据较少，效果也良好。\n\n### 朴素贝叶斯的应用\n\n*   垃圾诊断\n*   天气预测\n*\
