    \n<graphic xlink:href=\"unmath3\\_1.tif\"/>\n\nThe random.random() command returns\
    \ floating-point values between 0 to 1. However, as we have defined that we want\
    \ values between 0 and 4, our lower bound remains the same (i.e., 0). To get the\
    \ upper bound we need to multiply by 4, the value required in our case. Also,\
    \ the lower bound can be specified by adding the same, which can be safely ignored\
