    \ 试图实现：\n\n- 增大两个簇之间的距离。\n- 减小类内距离。\n\n选择 `W` 以使类间散度与类内散度之间的比值最大化。\n\n类间散度矩阵在公式\
    \ 4.13 中定义\n\n$$S\\_{B} = \\\\ \\\\sum\\limits\\_{i = 1}^{c}N\\_{i}\\\\left( {\\\
    \\mu\\_{i} - \\\\mu} \\\\right)\\\\left( {\\\\mu\\_{i} - \\\\mu} \\\\right)^{T},}$$\
    \  \n\n<graphic xlink:href=\"math4\\_13.tif\"/>\n\n(4.13)\n\n其中 `μ`[`i`]<img src=\"\
    images/inline-math4\\_19.jpg\" alt=\"\"/> 是类 `X`[`i`]<img src=\"images/inline-math4\\\
    _20.jpg\" alt=\"\"/> 的均值\n\n`N`[`i`]<img src=\"images/inline-math4\\_21.jpg\"\
