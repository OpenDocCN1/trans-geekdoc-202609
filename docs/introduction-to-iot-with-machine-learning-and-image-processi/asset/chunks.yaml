    ### 4.9.2 随机森林的优点


    - 减少了过拟问题。

    - 它具有对大型数据集产生准确预测的能力。

    - 它具有考虑缺失数据的能力。


    ### 4.9.3 随机森林的局限性


    - 树对训练数据中的变化敏感。

