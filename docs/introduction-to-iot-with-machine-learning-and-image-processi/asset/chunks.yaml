    `ARM` stands for `Advanced RISC Machines`. The company specializes in building
    processors based on `Reduced Instruction Set Computers` (`RISC`) architecture.
    `RISC` machines emphasize the use of registers and smaller instructions and thus
    can achieve higher speeds with the ability to execute millions of instructions
    per second. The smaller size of `ARM` processors’ low power consumption makes
    them most suitable for miniaturized devices like the `Raspberry Pi`.


    The latest model (`Raspberry Pi 3 B+`) uses `1.2 GHz` `ARM Cortex – A53` `Broadcom
    BCM 2837 Processor`. The significant difference is the quad-core `ARM Cortex A53`
    (`ARMv8`) cluster, which works at `1.2 GHz`, making it 50% faster than the `Raspberry
    Pi 2` model.


    ## 2.1 TimeLine of Raspberry Pi Models


    A brief timeline of various base `Raspberry Pi` models released to date follows.


    | Year: 2012 Model: `Raspberry Pi Model B` Size: `85.60 mm × 56.5 mm` CPU: `ARM1176JZF-S;
    32 bit` GPU: `Broadcom VideoCore IV @ 250 MHz` Speed: `700Mhz Single-Core CPU`
    RAM: `512MB RAM` | Year: 2013 Model: `Raspberry Pi Model A` Size: `85.60 mm ×
    56.5 mm` CPU: `ARM1176JZF-S 32 bit` GPU: `Broadcom VideoCore IV @ 250 MHz` Speed:
    `700Mhz Single-Core CPU` RAM: `256 MB RAM` |


    | --- | --- |


    | Year: 2014 Model: `Raspberry Pi Compute model` Size: `67.6 mm × 30 mm` CPU:
    `ARM1176JZF-S 32 bit` GPU: `Broadcom VideoCore IV @ 250 MHz` Speed: `700Mhz Single-Core
    CPU` RAM: `512 MB RAM` | Year: 2015 Model: `Raspberry Pi Zero` Size: `65 mm ×
    30 mm × 5 mm` CPU: `ARM1176JZF-S 32 bit` GPU: `Broadcom VideoCore IV @ 250 MHz`
    Speed: `1 GHz Single-Core CPU` RAM: `512 MB RAM` |


    | --- | --- |


    | **Latest Raspberry Pi Model** |


    | --- |

    | Year: 2018 Model: `Raspberry Pi 3 Model B+` Size: `85mm x 56mm x 17mm`. CPU:
    `Cortex-A53 (ARMv8) 64-bit` GPU: `Dual Core VideoCore IV GPU@400 MHz` Speed: `1.4GHz
    64-bit quad-core ARM Cortex A53 CPU` RAM: `1GB RAM` |


    ## 2.2 Components of a Raspberry Pi Model 3


    A brief component layout of `Raspberry Pi Model 3` is illustrated in [Figure 2.1](#chapter02.xhtml#fig2_1).
    The model we considered in this book is `Raspberry Pi 3 V 1.2`


    ![Figure 2.1 Raspberry Pi Model 3.](images/fig2_1.jpg)


    Figure 2.1 Raspberry Pi Model 3.


    ### 2.2.1 General Purpose Input-Output Pins (GPIO) Pins


    There are 40 general purpose input-output pins (`GPIO`) pins on the `Raspberry
    Pi` board as illustrated in [Figure 2.2](#chapter02.xhtml#fig2_2). These pins
    help the `Raspberry Pi` connect to the real world. With the help of these pins,
    the `Raspberry Pi` can help you control physical devices like motors, extension
    boards and `LEDs`.


    ![Figure 2.2 GPIO Pins.](images/fig2_2.jpg)


    Figure 2.2 GPIO Pins.


    The pins on the left side of the board are numbered using odd numbers from 1 to
    39; the right side uses even numbers from 2 to 40. The `GPIO` pins are numbered
    in two nomenclatures. One is the `GPIO` numbering and the other is the physical
    numbering. The `GPIO` numbering refers to the `Broadcom` numbering on `System
    on Chip`, whereas the physical numbering refers to the 40 pins specified on the
    `Raspberry Pi Board`.


    ### 2.2.2 Broadcom BCM283 7 64bit ARMv7 Quad Core Processor


    At the center of the `Raspberry Pi` is an `ARMv7 Quad Core Processor` with `1GB`
    of `RAM`, which works at `1.2 GHz`. The miniature size of the processor is noticeable.
    The Quad-Core nature of the processor at the rate of `1.2 Ghz` makes it it 50%
    faster than the `Raspberry Pi 2`. Coupled with `GPU`, the `Raspberry Pi` can work
    wonders in number-crunching situations.


    ### 2.2.3 Micro USB Slot


    The `Micro USB` power connector supplies power to the `Raspberry Pi` board. This
    is illustrated in [Figure 2.3](#chapter02.xhtml#fig2_3).


    ![Figure 2.3 Micro USB Slot.](images/fig2_3.jpg)


    Figure 2.3 Micro USB Slot.


    The `Raspberry Pi` board is powered by `5v DC` supply. To turn the `Raspberry
    Pi` on/off you need to turn this power supply on/off.


    ### 2.2.4 High Definition Multimedia Interface (HDMI) Port


    The `Raspberry Pi` provides a high definition multimedia interface (`HDMI`) output
    port. This is illustrated in [Figure 2.4](#chapter02.xhtml#fig2_4).


    ![Figure 2.4 HDMI Port.](images/fig2_4.jpg)


    Figure 2.4 HDMI Port.


    The `HDMI` port allows the `Raspberry Pi` to support `VGA`. However, `HDMI` also
    supports `1080p`.


    ### 2.2.5 Audio Jack


    For listening to sound, the `Raspberry Pi` provides a `3.5 mm` `audio jack`. This
    is illustrated in [Figure 2.5](#chapter02.xhtml#fig2_5).


    ![Figure 2.5 Audio Jack.](images/fig2_5.jpg)


    Figure 2.5 Audio Jack.


    ### 2.2.6 Universal Serial Bus (USB) Ports


    The `Raspberry Pi 3` provides universal serial bus (`USB`) ports. This is illustrated
    in [Figure 2.6](#chapter02.xhtml#fig2_6).


    ![Figure 2.6 USB Ports.](images/fig2_6.jpg)


    Figure 2.6 USB Ports.


    ### 2.2.7 Ethernet Socket


    The `Raspberry Pi` provides an `Ethernet socket`. This is illustrated in [Figure
    2.7](#chapter02.xhtml#fig2_6 - wait, the original text says fig2_7 [Figure 2.7](#chapter02.xhtml#fig2_7).


    ![Figure 2.7 Ethernet Port.](images/fig2_7.jpg)


    Figure 2.7 Ethernet Port.


    ### 2.2.8 Micro-SD Card Slot


    The `Raspberry Pi` provides an `micro-SD card slot`. This is illustrated in [Figure
    2.8](#chapter02.xhtml#fig2_8).


    ![Figure 2.8 SD Card Port.](images/fig2_8.jpg)


    Figure 2.8 SD Card Port.


    For the `Raspberry Pi` to boot through its operating system, it needs the operating
    system to reside on the `SD card`. This is essential, as `Raspberry Pi` does not
    have a hard-drive like a laptop or desktop.


    ## 2.3 Raspbian Operating System


    The soul of a computer system is its operating system. The preferred operating
    system for `Raspberry Pi` is `Raspbian`. `Raspbian` is based on `Debian`, which
    is a Linux-based operating system highly customized for `Raspberry Pi`. The popular
    versions of `Raspbian` are `Wheezy`, which is based on `Debian 7`, `Jessie`, which
    is based on `Debian 8`, and `Stretch`, based on `Debian 9`. The operating system
    considered in this book is `Jessie`.


    The `Jessie` version of `Raspberry Pi` focused on making the desktop more comfortable
    for end users. The `LibreOffice` suite was included in the `Jessie` version. This
    helps users write documents, prepare `PowerPoints` and work with `Excel spreadsheets`.
    All of these are compatible with `Microsoft Windows`. The graphical user interface
    provided for `Raspbian` is the `Lightweight Desktop Environment` or `LXDE`.


    ### 2.3.1 Operating Systems Available for Raspberry Pi


    Let us discuss some of the operating systems available for `Raspberry Pi`, shown
    in [Table 2.1](#chapter02.xhtml#table2_1).


    | Table 2.1 Operating System supporting Raspberry Pi |

    | --- |

    | **Raspbian** - Raspberry Pi Foundation recommended OS<br>- A very user friendly
    desktop environment<br>- Comes with a lot of pre-installed software |

    | **LibreELEC** - Designed to support Kodi-powered media center<br>- Can be paired
    with the KODI Remote App<br>- Can build a small home theater |

    | **Windows 10 IoT Core** - Provides integration with Visual Studio<br>- Supports
    both ARM and X86 architectures<br>- Supports development of connected devices
    |

    | **RISC OS** - Performance is key and is emphasized by the designers<br>- Comes
    with an archived file, which is unto 4MB, a very small size<br>- Provides better-
    drag-and-drop options |

