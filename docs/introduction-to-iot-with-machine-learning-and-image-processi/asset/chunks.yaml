    * 该程序涉及图像缩放以调整图像大小。

    * OpenCV 使用 `cv2.resize()` 函数为此目的。图像的大小可以手动指定或通过缩放因子指定。有不同的插值方法，缩小图像时优先使用 `cv2.INTER_AREA`，放大图像时使用
    `cv2.INTER_CUBIC` 或 `cv2.INTER_LINEAR`。默认插值方法是 `cv2.INTER_LINEAR`。

    * `cv2.resize(image, output image size, x scale, y scale, interpolation)` 接受五个参数。第一个参数是待调整大小的图像，第二个参数是输出图像的大小，第三和第四个参数是图像在
