    \ is 0, the outcome is bad; if AUC is 1, the outcome is good.\n\n## 4.5 Logistic\
    \ Regression\n\nLogistic regression is also a supervised learning technique. It\
    \ is more suitable as a classification technique rather than as a regression technique.\
    \ Logistic regression is more often applied to discrete classes. Examples of discrete\
    \ classes are male/female, cat/dog and pass/fail. Logistic regression models its\
    \ output as a logistic sigmoid function, which maps to the discrete classes.\n\
    \nThe mathematical modeling of logistic regression is as follows in Equation 4.5.\n\
    \n$$\\\\begin{matrix} y\\_{d} & {= \\\\log\\\\left( {p\\\\!/\\\\!{1 - p}} \\\\\
    right)} \\\\\\\\ & {= \\\\ \\\\gamma\\_{0} + \\\\ \\\\gamma\\_{1} \\\\ast \\\\\
    \ x\\_{1\\\\ } + \\\\ \\\\gamma\\_{2} \\\\ast \\\\ x\\_{2\\\\ } + - - - - - -\
    \ - \\\\ \\\\gamma\\_{n} \\\\ast \\\\ x\\_{m},} \\\\\\\\ \\\\end{matrix}$$  \n\
    \n<graphic xlink:href=\"math4\\_5.tif\"/>\n\n(4.5)\n\nwhere p is the probability\
    \ that  *y*[*d*] = 1 <img src=\"images/inline-math4\\_4.jpg\" alt=\"\"/>  given\
    \ the values of the vector of the input features x\n\n *γ*[0], *γ*[1], *γ*[2] −  −  −  −  −  − − *γ*[*n*]\
    \ <img src=\"images/inline-math4\\_5.jpg\" alt=\"\"/>  are estimated through the\
    \ maximum likelihood function.\n\n *x*[1 ], *x*[2 ],  −  −  −  −  −  − − *x*[*m* ]\
    \ <img src=\"images/inline-math4\\_6.jpg\" alt=\"\"/>  are vectors of the input\
    \ features.\n\n *γ*[*n*] <img src=\"images/inline-math4\\_7.jpg\" alt=\"\"/> \
    \ is known as the vector of coefficients.\n\n### 4.5.1 Logistic Regression Sigmoid\
    \ Function\n\nThe sigmoid function used in logistic regression is shown in [Figure\
    \ 4.11](#chapter04.xhtml#fig4_11).\n\n![Figure  4.11  Sigmoid Curve.](images/fig4_11.jpg)\n\
    \nFigure  4.11  Sigmoid Curve.\n\nThe sigmoid function maps any real value to\
    \ a value between 0 and 1. The sigmoid function is given by the [Equation 4.6](#chapter04.xhtml#math4_6).\n\
    \n$$S(y) = \\\\frac{1}{1 + e^{- y}},$$  \n\n<graphic xlink:href=\"math4\\_6.tif\"\
    />\n\n(4.6)\n\nwhere  *S*(*y*) <img src=\"images/inline-math4\\_8.jpg\" alt=\"\
    \"/>  is a value between 0 and 1.\n\n *y* <img src=\"images/inline-math4\\_9.jpg\"\
    \ alt=\"\"/>  is the input to the function.\n\n *e* <img src=\"images/inline-math4\\\
    _10.jpg\" alt=\"\"/>  is the base to the natural log.\n\n### 4.5.2 Types of Logistic\
    \ Regression\n\n*   **Binary logistic regression:** This type of logistic regression\
    \ models two outcomes only (e.g., pass and fail).\n\n*   **Multinomial logistic\
    \ regression:** This type of logistic regression models three or more outcomes\
    \ without any ordering (e.g., cats, dogs and sheep).\n\n*   **Ordinal logistic\
    \ regression:** This type of logistic regression models three or more outcomes\
    \ with ordering (e.g., product ratings from 1 to 5).\n\n#### To apply logistic\
    \ regression, the dataset should ideally support the following properties\n\n\
    *   The independent variables need to be independent of each other."
