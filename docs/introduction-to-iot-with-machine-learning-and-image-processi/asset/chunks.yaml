    ### Step 1

    Connect a monitor to Raspberry Pi via HDMI and a keyboard and mouse via a USB.


    ### Step 2: Install an Operating System.


    #### Step 2.1

    Use new out-of-box software (NOOBs) available at ([https://www.raspberrypi.org/downloads/](https://www.raspberrypi.org)).


    #### Step 2.2

    Extract the NOOBs downloaded.


    #### Step 2.3

    The downloaded NOOBS file must be copied into a formatted SD card. (SDHC card
    >2GB and ≤ = 32 GB follows FAT 32). NOOBs will install Raspbian on the SD card
    at the initial boot.


    ### Step 3: raspi-config


    #### `sudo raspi-config`


    You will see the following screen ([Figure 2.9](#chapter02.xhtml#fig2_9)). Choose
    the interfacing options.


    ![Figure 2.9 Choosing Interfacing Options.](images/fig2_9.jpg)


    Figure 2.9 Choosing Interfacing Options.


    Press Enter to move into an option and arrow keys to move up/down. Tab to select
    the options like <finish>.


    #### Step 3.1

    Change the user password. The default login is `pi` and password is `raspberry`.


    #### Step 3.2

    Enable boot to Desktop.


    #### Step 3.3: Internationalization options


    ##### Step 3.3.1

    Change-locale: select a language.


    ##### Step 3.3.2

    Change time zone.


    ##### Step 3.3.3

    Change keyboard layout. QWERTY is the default.


    Post successful configuration; the Raspberry Pi environment will look as shown
    in [Figure 2.10](#chapter02.xhtml#fig2_10).


    ![Figure 2.10 Raspberry Pi Desktop.](images/fig2_10.jpg)


    Figure 2.10 Raspberry Pi Desktop.


    ## 2.5 Applications of IoT


    According to Gartner[[1](#chapter02.xhtml#ref2_1)], by 2020 there will be around
    2.6 billion connected devices. This clearly indicates a potential host of applications.


    1. **Smart Home:** The Smart Home is the most potent application for IoT. You
    can control air conditioners, refrigerators, microwave ovens, lighting and entertainment
    systems through IoT-based control systems.

    2. **Wearable devices:** Monitoring human health parameters like heartbeat, blood
    pressure and other vitals is possible through wearable IoT devices. The constraint
    on these devices is that they must be small and energy efficient.

    3. **Farming:** Farmers are at times challenged to monitor crops and livestock
    at remote farm areas. Now this is possible through IoT. Also, detecting diseases
    of crops and water usage can be controlled through IoT devices.

    4. **Industrial IoT:** It has been now realized that IoT has a host of applications
    across different industries like manufacturing, oil and gas and energy. IoT helps
    industries in the automation and optimization of resources.


    ## Exercises


    1. Show how to make a headless Raspberry Pi.

    2. Explain why Secure Shell (`SSH`) is disabled from Raspberry Pi 3 onwards.

    3. What type of file system is preferred on the SD card used for uploading Raspberry
    Pi?

    4. Discuss the various operating systems available for Raspberry Pi with their
    advantages and disadvantages.

    5. Write a note on the most recent industrial applications of Raspberry Pi as
    IoT.


    ## Reference


    [1] Gartner, [https://www.gartner.com/en/newsroom/press-releases/2019-08-29-gartner-says-5-billion-enterprise-and-automotive-io](https://www.gartner.com),
    2019.


    # Chapter 3](#toc.xhtml#ch03)


    # Python and Its Libraries](#toc.xhtml#ch03)


    ## 3.1 Introduction


    Python is one of the most popular languages for Machine Learning. One of the dominant
    reasons for the popularity of Python is its rich support of libraries (see [Table
    3.1](#chapter03.xhtml#table3_1)).


    ### Table 3.1 Libraries for Python


    | Python Library | Usage |

    | --- | --- |

    | NumPy | Mathematical applications |

    | SciPy | Scientific Computing |

    | Pandas | Data Analysis |

    | matplotlib | Data Visualization |

    | Scikit-learn | Machine Learning |


    ## 3.2 Python


    ### 3.2.1 What Is Python?


    * Python was proposed by Guido Rossum in the late 1980s.

    * It is a simple but powerful high-level programming language.

    * It supports procedural and object-oriented concepts.

    * Python code is interpreted rather than compiled.


    ## 3.3 A Typical Python Program


    ![Figure 3.1 A Typical Python Program.](images/fig3_1.jpg)


    Figure 3.1 A Typical Python Program.


    ![Figure 3.2 Output of a Typical Python Program.](images/fig3_2.jpg)


    Figure 3.2 Output of a Typical Python Program.


    Thus, we now see a typical Python program, which computes the square root of every
    element of a given matrix. A Python program typically begins with an `import`
    statement. The `import` statement includes Python modules that provide a programmer
    with various library functions. In the mentioned program we used library functions
    like `map()` and `sqrt()`. Python follows strict rules for code indentation. The
    inner for loop is indented a few more spaces than the outer for loop.


    ## 3.4 Keywords


    Keywords are reserved words and cannot be used as names for programmer-defined
    variables. The keywords are listed in the `keyword` module and can be printed
    as seen in [Figure 3.3](#chapter03.xhtml#fig3_3).


    ![Figure 3.3 Python Code to Display Keyword List.](images/fig3_3.jpg)


    Figure 3.3 Python Code to Display Keyword List.


    ## 3.5 Python Variable


    * A python variable must begin with a letter (a – z, A – B) or underscore (`_`)
    followed by numbers or underscore.

    * Python variables are case sensitive.


    | | | |

    | --- | --- |

    | `mean` | valid variable |

    | `1_mean` | invalid variable |

    | `mean_new@` | invalid variable |

    | `_new_mean` | valid variable |


    ## 3.6 Comments in Python


    Python provides two types of comments. This is shown as `comments.py` in [Figure
    3.4](#chapter03.xhtml#fig3_4).


    ![Figure 3.4 Python Program to Demonstrate Comments.](images/fig3_4.jpg)


    Figure 3.4 Python Program to Demonstrate Comments.


    ![Figure 3.5 Output of comments.py.](images/fig3_5.jpg)


    Figure 3.5 Output of `comments.py`.


    In [Figure 3.5](#chapter03.xhtml#fig3_5), we observe that comments are ignored
    by the Python interpreter.


    ## 3.7 Python Data Types


    Variables in Python are typeless. Python supports dynamic typing, and the variable
    type is decided at runtime. Python data types can be categorized as shown in [Table
    3.2](#chapter03.xhtml#table3_2).


    ### Table 3.2 Python data types


    | Python Data Types | |

    | --- | --- |

    | Numeric | int long float bool |

    | Sequence | str list tuple |

    | Sets | set frozen set |

    | Mapping | dict |


    To determine the data type of the variable use the `type()` function in Python.
    Python program `datatype.py` as illustrated in [Figure 3.6](#chapter03.xhtml#fig3_6).


    ![Figure 3.6 Python Program to Demonstrate Different Data Types.](images/fig3_6.jpg)


    Figure 3.6 Python Program to Demonstrate Different Data Types.


    ![Figure 3.7 Output of datatype.py.](images/fig3_7.jpg)


    Figure 3.7 Output of `datatype.py`.


    ## 3.8 Python Operator Precedence


    The Python operator and precedence are given in [Table 3.3](#chapter03.xhtml#fig3_3).


    ### Table 3.3 Python Operator Precedence and Associativity


    | Operator | Highest/Lowest | Associativity |

    | --- | --- | --- |

    | `**` | | Right-to-left |

    | `~ + -` | | Left-to-right |

    | `* / % //` | | Left-to-right |

    | `+ -` | | Left-to-right |

    | `>> <<` | | Left-to-right |

    | `&` | | Left-to-right |

    | `^` | | Left-to-right |

    | `<= < > >=` | | Left-to-right |

    | `<> == !=` | | Left-to-right |

    | `= %= /= //= -= += *= **=` | | Right-to-left |

    | `is is not` | | Left-to-right |

    | `In not in` | | Left-to-right |

    | `not or and` | | Left-to-right |

