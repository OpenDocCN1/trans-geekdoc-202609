    ## 3.19 Pandas 简介


    Pandas 是数据科学家需要学习 Python 库之一。简而言之，Pandas 在 NumPy 数组的基础上构建了带行和列。Pandas 可以被可视化为具有表格和数据库能力的
    NumPy 数组。


    Pandas 的应用包括：


    *   将 NumPy 数组、Python 列表或字典转换为 dataframe 对象。

    *   打开本地 csv 文件。

    *   通过 URL 打开远程 csv 文件。


    ### 3.19.1 探索 Pandas


    检查 Pandas 是否正确安装，你可以输入图 3.50 所示的命令。


