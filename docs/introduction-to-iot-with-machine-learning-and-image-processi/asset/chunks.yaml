    ## 4.8 Support Vector Machine

    SVM is a supervised learning technique that helps in the classification and regression
    analysis of data. SVM strives to find a hyperplane that divides the data into
    corresponding classes. At the simplest level, a hyperplane is a straight line
    that divides the data into corresponding classes.


    Support vectors are the data points nearest a hyperplane. The distance from the
    nearest data point to the hyperplane is known as a `margin`, and the goal is to
    have a wider margin for optimal classification.


    The transformation of non-separable data points to transferable data points is
    possible through kernel functions.


    In our discussion, let us consider the Linear SVM.


    To get the maximum margin separation, the following Equations 4.9 and 4.10 need
    to be computed.


    $W^{(T)}X[i] + b > 1$

    (4.9)


    $W^{(T)}X[i] + b < -1$

    (4.10)


    Here Equation 4.9 is considered for all positive cases. Equation 4.10 is considered
    for negative cases.


    $\|W\|^2$ is required to be as small as possible.


    The separator is then defined as a set of points for the [Equation 4.11](#chapter04.xhtml#math4_11)


    $W \cdot x + b = 0$

    (4.11)


    ### 4.8.1 Advantages of Support Machines

    * They work well in high-dimensional spaces.

    * SVM is capable of avoiding overfitting.


    ### 4.8.2 Limitations of Support Machines

    * They have performance issues when with larger data.

    * SVM is impacted with the presence of noise.


    ### 4.8.3 Applications of SVM

    * Image Classification

    * Text

    * Bioinformatics


    #### Python program: svm.py


    ```python

    from pandas import read_csv

    from sklearn.model_selection import KFold

    from sklearn.model_selection import cross_val_score

    from sklearn.svm import SVC

    from sklearn.model_selection import train_test_split

    from matplotlib import pyplot as plt

    from sklearn import metrics

    from sklearn.preprocessing import StandardScaler


    filename = ''heart.csv''

    names = [''age'',''sex'',''cp'',''trestbps'',''chol'',''fbs'',''restecg'',''thalach'',''exang'',''oldpeak'',''slope'',''ca'',''thal'',''target'']

    dataframe = read_csv(filename, names=names)

    array = dataframe.values

    X = array[:,0:13]

    Y = array[:,13]

    X_train, X_test, y_train, y_test = train_test_split(X, Y, test_size = 0.2, random_state
    = 0)

    scaler = StandardScaler()

    scaler.fit(X_train)

    X_train = scaler.transform(X_train)

    X_test = scaler.transform(X_test)

    svmodel=SVC(kernel=''linear'',probability=True)

    r=svmodel.fit(X_train, y_train)

    kfold = KFold(n_splits=10, random_state=7)

    results = cross_val_score(svmodel, X, Y, cv=kfold)

    print("K-Fold Classification Accuracy:",results.mean()*100)

    y_pred = svmodel.predict(X_test)

    conf_matrix = metrics.confusion_matrix(y_test, y_pred)

    print(conf_matrix)

    print("Confusion Matrix Accuracy:",metrics.accuracy_score(y_test, y_pred)*100,"%")

    print("Confusion Matrix Precision:",metrics.precision_score(y_test, y_pred)*100,"%")

    print("Confusion Matrix Recall:",metrics.recall_score(y_test, y_pred)*100,"%")

    y_pred_prob = r.predict_proba(X_test)[:,1]

    fp_rate, tp_rate, _ = metrics.roc_curve(y_test, y_pred_prob)

    auc_score = metrics.roc_auc_score(y_test, y_pred_prob)

    plt.rcParams[''toolbar''] = ''None''

    plt.title(''Support Vector Machine'')

    plt.xlabel(''False Positive Rate'')

    plt.ylabel(''True Positive Rate'')

    plt.plot(fp_rate,tp_rate,label="data 1, auc="+str(auc_score))

    plt.legend(loc=4)

    plt.show()

    ```


    ## 4.9 Random Forest

    Random forest falls under the category of supervised learning. Random forest builds
    multiple trees and merges them for an accurate decision. Thus, random forest is
    involved in building multiple decision trees.


    ### 4.9.1 Decision Tree

    A Decision Tree follows a top-down approach in which the root nodes begin the
    process of binary splits with some criteria for the reduction in entropy. Here
    entropy is the measure of unpredictability in the data.

