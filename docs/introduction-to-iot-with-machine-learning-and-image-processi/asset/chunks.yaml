    # [Introduction](#toc.xhtml#ch-01)


    In the last three decades, technology has changed the way we live our lives. This
    happens to be a universally accepted truth. In this book, we attempt to illustrate
    the use of a new technology that has changed the world of communication, computing
    and computing education. Interestingly, the name of this technology coincides
    with that of a famous dessert named Raspberry Pie. Raspberry *Pi* is a single
    board computer developed in the United Kingdom. Incidentally, the organization
    that started this is known as the Raspberry Pi Foundation. This was first launched
    in the year 2012.


    By the year 2015, Raspberry Pi had gained wide-scale popularity. One of the key
    features of this technology was its size and adaptability. In some strange ways,
    Raspberry Pi was the panacea the world of technology was dreaming of. To build
    on this idea of a tiny computer, one must consider the fact that more than a decade
    ago you would have computer programs running on desktops wired to electromechanical
    systems that would use them. The advent of the Raspberry Pi enables the community
    of technology developers to innovate handheld devices than can encompass the power
    of regular computers. Our intention in writing this book is twofold: a) we want
    to provide a basic understanding of how a Raspberry Pi can be used for simple
    applications, and b) we want to provide fundamental information on how a Raspberry
    Pi can be used to advance innovations in machine learning and image recognition.


    While providing fundamental information on Raspberry Pi, we will help students
    comprehend the necessary information required to develop applications and devices.
    These devices and applications can have a wide range of applications such as networking
    devices, using devices and applications related to privacy and security, creating
    medical applications and developing sensors. The authors believe that this range
    of applications will help the scientific community adapt Raspberry Pi for use
    in some of their projects and thereby enhance its usability.


    Additionally, the authors are attempting to present information on how Raspberry
    Pi can successfully implement machine learning and image processing. The information
    presented in this book will help the community of researchers synthesize new scientific
    methods, algorithms, devices and other forms of technology into a wide range of
    application domains. The authors envision Raspberry Pi advancing the development
    of science and technology across various user domains such as medicine, security,
    communication, and the military. Last but not least, it is our attempt to have
    this book used as study material for courses teaching students about using Raspberry
    Pi. It is our understanding that Raspberry Pi can be used extensively in healthcare
    information systems.


    In this book, the authors present a transformative interdisciplinary perspective
    of Raspberry Pi usage. This idea is based on the philosophy of transformative
    transdisciplinary perspective presented by the founding fathers of Society for
    Design and Process Science \[[1](#chapter01.xhtml#ref1_1)\]. This philosophy is
    based on bringing about a positive transformative change to one domain by making
    changes or improvements in another. This philosophy is applicable to Raspberry
    Pi because rapid improvements in Raspberry Pi and its applicability will facilitate
    and create a rostrum for improvements in all the domains in which this device
    can be used. One example will be the implementation of machine learning algorithms
    that can aid image processing. In this book, the authors have dwelled on some
    of the fundamental programming concepts that are needed for image analysis and
    machine learning. This is another very important reason this book is needed for
    its targeted audience.


    While we engage ourselves in recognizing the importance of the Raspberry Pi, it
    is also important to note that Raspberry Pi has competitors or alternatives available
    in the market. A brief summary of these alternatives is listed in [Table 1.1](#chapter01.xhtml#table1_1).


