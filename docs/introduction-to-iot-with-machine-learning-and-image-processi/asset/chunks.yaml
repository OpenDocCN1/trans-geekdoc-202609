  trans: "\n\n### 3.15.1 字典方法\n\n* `dict.items()` 返回以键值对形式的字典。\n\n  ```python\n  print\
    \ dict.items()\n  [('a', 'apple'), ('c', 'cat'), ('b', 'ball'), ('e', 'elephant'),\
    \ ('d', 'dog')]\n  ```\n\n* `dict.keys()` 只返回字典的键。\n\n  ```python\n  print dict.keys()\n\
    \  ['a', 'c', 'b', 'e', 'd']\n  ```\n\n* `dict.values()` 只返回字典的值。\n\n  ```python\n\
    \  print dict.values()\n  ['apple', 'cat', 'ball', 'elephant', 'dog']\n  ```\n\
    \n### 3.16 Python 函数\n\nPython 中的自定义函数通过 `def` 关键字定义。函数可以接受参数并返回值。\n\n![图 3.24\
    \ 展示可以接受参数并返回值的 Python 程序。](img/fig3_24.jpg)\n\n图 3.24 展示可以接受参数并返回值的 Python 程序。\n\
    \n![图 3.25 Python 函数程序的输出。](img/fig3_25.jpg)\n\n图 3.25 Python 函数程序的输出。\n\n###\
    \ 3.17 NumPy 简介\n\nNumPy 是 numerical python 的缩写。它是一个基础的 Python 包，有助于执行数据分析并支持机器学习算法。由于机器学习算法的数据集来自各种来源并遵循不同的格式，处理这些数据变得非常具有挑战性。这些数据集可能包含图像、文本或音频剪。这些用于处理的数据源被可视化为数值数组。因此，NumPy\
    \ 作为一个 Python 包，提供了强大的数组处理功能：\n\n* `ndarray`，支持具有卓越性能的高维数组。\n\n* 数学函数，支持将整个数组作为一个单元进行操作。\n\
    \n它提供了对线性代数操作的支持，并允许 Python 代码与 C 和 C++ 交互。\n\n#### 如何使用 NumPy\n\n惯例是如图 3.26 所示的命令使用\
    \ NumPy。\n\n![图 3.26 NumPy 模块的使用。](img/fig3_26.jpg)\n\n图 3.26 NumPy 模块的使用。\n\n\
    如果你看到上面的屏幕，执行 `import numpy as np` 后解释器出现了提示符 ⋙；这意味着 NumPy 包已正确安装。\n\n### 3.18\
    \ NumPy 操作\n\n#### 3.18.1 从 Python 列表创建数组\n\n第一步是构建一个 Python 列表。让我们考虑 `lst=[10,\
    \ 20, 30, 40, 50]`。要将列表转换为数组，我们必须使用函数 `np.array()` 并列表作为参数传递（即 `lst`）。这在图 3.27\
    \ 中可视化。\n\n![图 3.27 从 Python 列表创建数组的 Python 命令代码](img/fig3_27.jpg)\n\n图 3.27 从\
    \ Python 列表创建数组的 Python 命令代码。\n\nNumPy 要求所有数组元素必须是相同类型。如果元素不匹配，低类型将转换为或提升为高类型。\n\
    \n![图 3.28 从 Python 列表创建数组时显示类型转换的 Python 命令代码](img/fig3_28.jpg)\n\n图 3.28 从 Python\
    \ 列表创建数组时显示类型转换的 Python 命令代码。\n\nNumPy 支持的一些基本数据类型如表 3.4 所示。\n\n表 3.4 NumPy 数据类型\n\
    \n| 数据类型 | 说明 |\n| --- | --- |\n| bool_ | 布尔值 True 或 False |\n| int32 | 支持 32\
    \ 位机器上的整数 |\n| int64 | 支持 64 位机器上的整数 |\n| uint32 | 支持 64 位机器上的无整数 |\n| float32\
    \ | 单精度浮点 |\n| float64 | 双精度浮点 |\n| complex64 | 带有实部和虚部的复数 |\n| complex128 | 带有实部和虚部的复数\
    \ |\n\n假设我们要创建一个浮点数组，可以使用 `dtype='float64'`。这在图 3.29 中所示。\n\n#### 3.18.2 创建数组\n\
    \n要创建一个包含 20 个元素的一维数组，我们可以使用 `arange` 函数。这在图 3.30 中所示。\n\n要创建一个维度为 3 x 3 且填充为\
    \ Integer64 类型 1 的二维数组，我们需要使用 `ones` 函数。这在图 3.31 中所示。\n\n"
