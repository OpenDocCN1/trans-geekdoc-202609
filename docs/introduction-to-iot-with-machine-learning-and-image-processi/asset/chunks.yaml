    因此，我们从数组 `a` 中获取索引 1 开始且小于索引 2 的行（即索引 1 的整列）。**注意：**NumPy 创建的子数组被视为视图（views）。因此，如果修改了子数组，修改将反映在原始数组中。这在图
    3.41 中所示。


    ![图 3.41 获取二维数组子数组的 Python 命令代码。](img/fig3_41.jpg)


