    NumPy 中的轴（Axis）是多维数组的。例如，一个二维数组有两个轴。如果 `axis=0`，意味着一个跨越行的垂直轴。或者，如果 `axis=1`，意味着一个横跨跨列的水平轴。让我们考虑两个一维数组的拼接。这在图
    3.44 中所示。


