    ### 3.18.3 Basic NumPy Operations


    *   **Array Attributes**: In most data-processing applications, the developers
    need to be aware of the array attributes. The attributes and their descriptions
    are illustrated in [Table 3.5](#chapter03.xhtml#fig3_5).


    Table 3.5 NumPy Array Attributes


    | Attribute | Description |

    | --- | --- |

    | ndim | Specifies the number of dimensions |

    | shape | Specifies the size of each dimension |

    | size | Specifies the total size of the array |

    | dtype | Specifies the datatype of the array elements |


    Consider a 2-dimensional array with dimensions 3 x 3 as follows


    $$\begin{matrix} 1 & 2 & 3 \\ 4 & 5 & 6 \\ 7 & 8 & 9 \\ \end{matrix}$$


    <graphic xlink:href="unmath3\_5.tif"/>


    Now using NumPy we create the above array and print its attributes.


    ![Figure 3.36 Python Command Code to Create a 2-Dimensional Array of Dimensions
    3 X 3 and Print Its Attributes.](images/fig3_36.jpg)


    Figure 3.36 Python Command Code to Create a 2-Dimensional Array of Dimensions
    3 X 3 and Print Its Attributes.


    The method `reshape()` is used to build a matrix of 3 x 3 with elements 1 to 9.
    The method `reshape()` will be discussed more elaborately in the following sections.


    *   **Array indexing**: The array index in Python starts from 0. Thus if we have
    to get the 5^(th) element of the array we need to say `array_name[4]`. This is
    illustrated in the [Figure 3.37](#chapter03.xhtml#fig3_37).


    ![Figure 3.37 Python Command Code to Access Array Elements.](images/fig3_37.jpg)


    Figure 3.37 Python Command Code to Access Array Elements.


    To access a multi-dimensional array we need to have a comma separated tuple of
    indices to access the array. Example `array_name[2][1]` will return the value
    of the element at the third row and second column. This is illustrated with the
    example in [Figure 3.38](#chapter03.xhtml#fig3_38).


    ![Figure 3.38 Python Command Code to Access Multi-dimensional Array.](images/fig3_38.jpg)


    Figure 3.38 Python Command Code to Access Multi-dimensional Array.


    *   **Working with subarrays**: To get a subarray from an array we use the slicing
    operations similar to lists. The syntax is `array_name[int_value, final_value,
    step_value]`.


    **1-Dimensional array**: Let us consider a 1-Dimensional array with values 0,
    1, 2, 3, 4, 5, 6.


    | Index | 0 | 1 | 2 | 3 | 4 | 5 | 6 |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | Values | 0 | 1 | 2 | 3 | 4 | 5 | 6 |


    To get the first three values, we need to execute the statement `a[:3]`. This
    says values are at index 0, 1 and 2. To get the last three values we need to execute
    `a[4:]`. This says all values after index 4. This is illustrated in [Figure 3.39](#chapter03.xhtml#fig3_39).


    ![Figure 3.39 Python Command Code to Get Subarray from Array.](images/fig3_39.jpg)


    Figure 3.39 Python Command Code to Get Subarray from Array.


    In [Figure 3.39](#chapter03.xhtml#fig3_39) we see that to get the middle values
    of an array `a` we splice it with the following range `a[2:5]` (i.e., all value
    greater than index 2 means starting from value 3, and up to index 5 means up to
    value 4).


    **2-dimensional array**: In case of two-dimensional arrays, the multiple splices
    are separated by commas. For example, if we have a 2-D array of dimensions 3 x
    3 as follows


    $$\begin{matrix} 1 & 2 & 3 \\ 4 & 5 & 6 \\ 7 & 8 & 9 \end{matrix}$$


    <graphic xlink:href="unmath3\_6.tif"/>


    Now using NumPy, we want to get the values of the single $\begin{matrix} 2 \\
    5 \\ 8 \end{matrix}$; we need to execute the following statements `a[:3,1:2]`.


    <graphic xlink:href="unmath3\_7.tif"/>


    This is illustrated in [Figure 3.40](#chapter03.xhtml#fig3_40).


    ![Figure 3.40 Python Command Code to Get Subarray from 2-D Array.](images/fig3_40.jpg)


    Figure 3.40 Python Command Code to Get Subarray from 2-D Array.


    Thus, we fetch 3 rows from array `a` for columns that start at index 1 and are
    less than index 2 (i.e., the entire column at index 1).


    **Note:** The subarrays created by NumPy are treated as views. Thus, if the subarray
    elements are modified, they are reflected back in the original array. This is
    illustrated in [Figure 3.41](#chapter03.xhtml#fig3_41).


    ![Figure 3.41 Python Command Code to Get Subarray from 2-D Array.](images/fig3_41.jpg)


    Figure 3.41 Python Command Code to Get Subarray from 2-D Array.


    Here we modify 2nd row 3rd element and assign it with a value 10. This is reflected
    back in the array `a` when we print out the same.


    *   **Copying an array**: We can make another copy of an array with the `copy()`
    function. This is illustrated in [Figure 3.42](#chapter03.xhtml#fig3_42).


    ![Figure 3.42 Python Command Code to Copy an Array.](images/fig3_42.jpg)


    Figure 3.42 Python Command Code to Copy an Array.


    *   **Array reshaping**: At times, we need to change the shape of an array (i.e.,
    from a row-vector to a column-vector). This is illustrated in the example shown
    in [Figure 3.43](#chapter03.xhtml#fig3_43).


    ![Figure 3.43 Python Command Code to Change the Shape of an Array.](images/fig3_43.jpg)


    Figure 3.43 Python Command Code to Change the Shape of an Array.


    *   **Array Concatenation**: It is possible to club two arrays into a single one
    through the concatenation process. The first routine we consider is `np.concatenate()`.
    This is illustrated in [Figure 3.44](#chapter03.xhtml#fig3_44).


    Axis in NumPy are with respect to multi-dimensional arrays. For example, a 2-dimensional
    array has two axes. If `axis=0`, that means a straight axis running downwards
    across the rows. Alternatively, if `axis=1`, that means a straight axis running
    horizontally across the columns. Let us consider the concatenation of two 1-dimensional
    arrays. This is illustrated in [Figure 3.44](#chapter03.xhtml#fig3_44).


    ![Figure 3.44 Python Command Code to Concatenate 1-dimensional Arrays.](images/fig3_44.jpg)


    Figure 3.44 Python Command Code to Concatenate 1-dimensional Arrays.


    The concatenation operation of multi-dimensional arrays is based on the axis.
    If `axis=0` it means the concatenation will be done vertically, and if `axis=1`,
    it means the concatenation will be done horizontally. This is illustrated with
    the examples in [Figures 3.45](#chapter03.xhtml#fig3_45) and [3.46](#chapter03.xhtml#fig3_46).


    ![Figure 3.45 Python Command Code to Concatenate Multi-dimensional Array Vertically.](images/fig3_45.jpg)


    Figure 3.45 Python Command Code to Concatenate Multi-dimensional Array Vertically.


    ![Figure 3.46 Python Command Code to Concatenate Multi-dimensional Array Horizontally.](images/fig3_46.jpg)


    Figure 3.46 Python Command Code to Concatenate Multi-dimensional Array Horizontally.


    If the arrays are of different dimensions and you want to concatenate them, then
    you can use `vstack()` vertical stack or `hstack()` horizontal stack routines.
    This is illustrated in the example below.


    ![Figure 3.47 Python Command Code to Concatenate Arrays of Different Dimensions.](images/fig3_47.jpg)


    Figure 3.47 Python Command Code to Concatenate Arrays of Different Dimensions.


    *   **Splitting Arrays**

