    \n$$S\\_{W} = \\\\;\\\\sum\\limits\\_{i = 1}^{c}..\\\\sum\\limits\\_{x\\_{k} \\\
    \\in x\\_{i}}{\\\\left( {x\\_{k} - \\mu\\_{i}} \\\\right){\\left( {x\\_{k} - u\\\
    _{i}} \\\\right)^{T},}}$$  \n\n<graphic xlink:href=\"math4\\_14.tif\"/>\n\n(4.14)\n\
    \n这里 `x`[`k`]<img src=\"images/inline-math4\\_24.jpg\" alt=\"\"/> 是样本类 `X`[`i`]<img\
    \ src=\"images/inline-math4\\_25.jpg\" alt=\"\"/> 的子集\n\n该矩阵的广义特征值问题在公式 4.15 中给出\n\
    \n`S`[`w`]^( − )*S`[`B`].  \n\n<graphic xlink:href=\"math4\\_15.tif\"/>\n\n(4.15)\n\
    \n通过求解方程 4.15 计算 `w` 特征向量，使得公式 4.16 最大化\n\n$$w = {arg\\\\; max}\\\\left| \\frac{W^{T}S\\\
