    Figure 5.1 Output of Python Program Load, Display and Save an Image on Raspberry
    Pi.


    * The objective of this code is to load, display and save an image. The first
    step is to import the computer vision package `cv2`.

    * We can read the image using the built-in function, `cv2.imread`. The `cv2.imread`
    function takes one parameter within a single inverted quote, which is the name
    of the image.

    * We can display the image using the built-in function, `cv2.imshow`. The `cv2.imshow`
    function requires 2 parameters: the name under which the image is saved and the
    variable containing the read image.

    * To save the image, we can use the built-in function, `cv2.imwrite`.

    * The built-in function, `cv2.waitkey`, is used to wait until you press any key
    in the keyboard.


    ## 5.2 Scaling (Resizing) Images – Cubic, Area and Linear Interpolations


    **Python Program: Scaling.py**


    ```python

    import cv2

    import numpy as np

    image = cv2.imread(''image_2.jpg'')

    cv2.imshow("Original", image)

    cv2.waitKey()

    # cv2.resize(image, output image size, x scale, y scale, interpolation)

    # Scaling using cubic interpolation

    scaling_cubic = cv2.resize(image, None, fx=.75, fy=.75, interpolation = cv2.INTER_CUBIC)

    cv2.imshow(''Cubic Interpolated'', scaling_cubic)

    cv2.waitKey()

    # Scaling using area interpolation

    scaling_skewed = cv2.resize(image, (600, 300), interpolation = cv2.INTER_AREA)

