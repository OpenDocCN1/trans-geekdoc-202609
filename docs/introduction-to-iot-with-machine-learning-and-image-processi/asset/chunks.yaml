    |


    | LattePanda Alpha || Unlike many alternatives; supports windows 10 and uses an
    Intel Core M3 processor |


    | Banana Pi M64 || Works with a wider range of operating systems |


    | RockPro 64 || A powerful 64 bit CPU |'
