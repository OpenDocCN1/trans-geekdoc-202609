  trans: "\n\n### 3.8.2 评估以下 Python 表达式\n\n* `2**3+4//7−6*9`\n* **步骤 1:** `(2**3)\
    \ = 8`\n* **步骤 2:** `4//7 = 0` (整数除法)\n* **步骤 3**: `6 * 9 = 54`\n* **步骤 4:** `8\
    \ + 0 = 8`\n* **步骤 5:** `8−54 = −46`\n* **Ans = − 46**\n\n## 3.9 Python 中的条件结构\n\
    \n条件结构在 Python 中用于根据某些条件执行操作。这些条件可以包含比较表达式或算术表达式，其结果为 True 或 False。\n\nPython\
    \ 中 IF-ELSE 语句的结构\n\n```python\nif condition1:\n    statement 1\nelif condition2:\n\
    \    statement 2\nelse:\n    statement 3\n```\n\n**示例:** 考虑以下描述\n0–1: 婴儿\n1–2:\
    \ 幼儿\n2–12: 儿童\n13–17: 青少年 (14 = 青少年早期)\n18 +: 成人\n\n**Python 程序**: `if_elif_stmt.py`\
    \ 在图 3.8 中所示。\n\n![图 3.8 展示 elif 语句的 Python 程序。](img/fig3_8.jpg)\n图 3.8 展示 elif\
    \ 语句的 Python 程序。\n\n![图 3.9 Python 程序 if_elif_stmt.py 的输出。](img/fig3_9.jpg)\n\
    图 3.9 Python 程序 if_elif_stmt.py 的输出。\n\n## 3.10 Python 中的三元运算符\n\nPython 三元运算符的语法如下。\n\
    \n`a if test else b`\n\n![图 3.10 展示使用三元运算符的 Python 程序。](img/fig3_10.jpg)\n图 3.10\
    \ 展示使用三元运算符的 Python 程序。\n\n![图 3.11 展示三元运算符的 Python 程序输出。](img/fig3_11.jpg)\n\
    图 3.11 展示三元运算符的 Python 程序输出。\n\n## 3.11 Python 中的循环结构\n\n当需要重复执行某些语句时，循环是非常用的。因此，语句会持续执行，直到满足某些条件。\n\
    \n### 3.11.1 While 循环\n\nwhile 循环是一种入口控制型循环。因此，只有在满足入口条件时才会进入循环。可能有一个计数器来记录循环执行的次数，最后当达到某个阈值时，循环终止。语法如下\n\
    \n```python\nwhile expression:\n    statement\n```\n\n只要条件为 True，while 循环就会迭代。Statement\
    \ 可以是单个语句或语句语句块。\n\n示例：Python 程序 `while_loop.py` 见于图 3.12。\n\n![图 3.12 展示 while\
    \ 循环的 Python 程序。](img/fig3_12.jpg)\n图 3.12 展示 while 循环的 Python 程序。\n\n![图 3.13\
    \ while_loop.py 的输出。](img/fig3_13.jpg)\n图 3.13 while_loop.py 的输出。\n\n### 3.11.2\
    \ For 循环\n\nPython 中的 for 循环在给定的值范围范围内迭代。for 循环的语法如下\n\n```python\nfor item in\
    \ sequence:\n    print item\n```\n\n示例：Python 程序 – `for_loop.py` 在图 3.14 中所示。\n\
    \n![图 3.14 展示 for_loop.py 的 Python 程序。](img/fig3_14.jpg)\n图 3.14 展示 for_loop.py\
    \ 的 Python 程序。\n\n![图 3.15 for_loop.py 的输出。](img/fig3_15.jpg)\n图 3.15 for_loop.py\
    \ 的输出。\n\n要以反向方式使用 for 循环进行迭代，请考虑程序 `for_loop_reverse.py`。\n\n![图 3.16 以反向方式展示\
    \ for 循环。](img/fig3_16.jpg)\n图 3.16 以反向方式展示 for 循环。\n\n!图 3.17 for_loop_reverse.py\
    \ 的输出。\n图 3.17 for_loop_reverse.py 的输出。\n\n### 3.11.3 While 与 For 循环结合 Else\n\n\
    当 `while` 条件变为 False 时，激活 `else` 循环。例如，考虑图 3.18 所示的 Python 程序。\n\n![图 3.18 展示\
    \ while 循环结合 else。](img/fig3_18.jpg)\n图 3.18 展示 while 循环结合 else。\n\n![图 3.19 while\
    \ 循环结合 else。](img/fig3_19.jpg)\n图 3.19 while 循环结合 else。\n\n当 `for` 循环通过序列中的所有元素迭代完毕时，`else`\
    \ 语句结合 `for` 循环。例如，考虑图 3.20 所示的 Python 程序。\n\n![图 3.20 展示 for 循环结合 else。](img/fig3_20.jpg)\n\
    图 3.20 展示 for 循环结合 else。\n\n![图 3.21 for 循环结合 else。](img/fig3_21.jpg)\n图 3.21\
    \ for 循环结合 else。\n\n## 3.12 Python 中的字符串\n\n字符串是用双引号括的连续字符集。\n示例：“Hello”，“Raju”\n\
    \n使用 `+` 运算符进行两个字符串的拼接。示例 `a = “Good”` 和 `b = “Morning”`。那么 `a+b` 将得到 Good Morning。如果指定的字符在字符串中，运算符\
    \ `in` 返回 True。如果指定的字符不在字符串中，`not in` 返回 True。示例 `G in Good` 返回 True，`G not in\
    \ Morning` 返回 True。\n\n### 3.12.1 字符串内置方法\n\n以下是一些常用的字符串方法：\n\n1. `len(string)`\
    \ 返回字符串的长度。\n示例：`len(“morning”)`\n输出：7\n\n2. `lower()` 将大写字母转换为小写。\n示例：`str= “HELLO”`\n\
    `print str.lower()`\n输出：hello\n\n3. `find()` 查找字符串是否存在于字符串或字符串的子字符串中。\n`find(sub,\
    \ start = 0, end = len(string))`\n示例：`str= “morning”`\n`str.find(\"r\",0,len(str))`\n\
    输出：2\n\n4. `replace()` 将旧字符串替换为新字符串并返回更新后的字符串。\n`replace(old, new, max_occurrence)`\n\
    示例：`str=\"Good Morning”`\n`str.replace(\"Morning\", \"Evening\",1)`\n输出：'Good\
    \ Evening'\n\n5. `split()` 方法提供将字符串按分隔分隔的小字符串的方法。输出是一个列表。\n示例：`str=\"Winning is\
    \ everything\"`\n`str.split()`\n输出：['Winning', 'is', 'everything']\n\n## 3.13\
    \ Python 中的列表\n\n列表是方括号内的逗号分隔值。示例 `lst = ['a', 'b', 'c', 'd']`。Python 程序 `list_op.py`\
    \ 在图 3.22 中展示了列表示例。\n\n![图 3.22 展示列表示例的 Python 程序。](img/fig3_22.jpg)\n图 3.22 展示列表示例的\
    \ Python 程序。\n\n![图 3.23 list_op.py 的输出。](img/fig3_23.jpg)\n图 3.23 list_op.py\
    \ 的输出。\n\n### 3.13.1 列表方法\n\n* `len(list)` 给出列表的长度。\n`lst=['a', 'b', 'c', 'd']`\n\
    `len(lst)`\n输出：4\n\n* `list.reverse()` 反转列表的元素。\n`lst=['a', 'b', 'c', 'd']`\n\
    `lst.reverse()`\n`lst=['d', 'c', 'b', 'a']`\n\n* `list.sort()` 按升序对列表元素排序。\n`lst=['d',\
    \ 'c', 'b', 'a']`\n`lst.sort()`\n`lst=['a', 'b', 'c', 'd']`\n\n## 3.14 Python\
    \ 中的元组\n\n元组是类似于列表的序列，但它们是不可变的（即它们不能被更改且它们使用括号）。示例 `tup=('a', 'b', 'c', 'd')`\n\
    \n* `len(tuple)` 给出元组的长度。\n`tup=('a', 'b', 'c', 'd')`\n`len(tup)`\n输出：4\n\n* `max(tuple)`\
    \ 返回元组中的最大值。\n`tup=(1,2,3,4)`\n`max(tup)`\n输出：4\n\n* `min(tuple)` 返回元组的最小值。\n\
    `tup=(1,2,3,4)`\n`min(tup)`\n输出：1\n\n"
- fmt: "\n### 3.15.1 Methods on Dictionaries\n\n* `dict.items()` returns dictionary\
    \ as key/value pairs.\n\n  ```python\n  print dict.items()\n  [('a', 'apple'),\
    \ ('c', 'cat'), ('b', 'ball'), ('e', 'elephant'), ('d', 'dog')]\n  ```\n\n* `dict.keys()`\
    \ returns the dictionary’s keys only.\n\n  ```python\n  print dict.keys()\n  ['a',\
    \ 'c', 'b', 'e', 'd']\n  ```\n\n* `dict.values()` returns the dictionary’s values\
    \ only.\n\n  ```python\n  print dict.values()\n  ['apple', 'cat', 'ball', 'elephant',\
    \ 'dog']\n  ```\n\n### 3.16 Python Functions\n\nA user-defined function in Python\
    \ is defined with the `def` keyword. A function can accept parameters and return\
    \ a value.\n\n![Figure 3.24 Python Program to Demonstrate a Function That Can\
    \ Accept and Return a Value.](images/fig3_24.jpg)\n\nFigure 3.24 Python Program\
    \ to Demonstrate a Function That Can Accept and Return a Value.\n\n![Figure 3.25\
    \ Output of Python Function Program.](images/fig3_25.jpg)\n\nFigure 3.25 Output\
    \ of Python Function Program.\n\n### 3.17 NumPy Introduction\n\nNumPy is an abbreviation\
    \ that stands for numerical python. It is a fundamental python package useful\
    \ for performing data analysis and supporting machine-learning algorithms. As\
    \ datasets for machine learning algorithms come from a variety of sources and\
    \ follow different formats, it becomes quite challenging to process the same.\
    \ These datasets may include images, text or sound clips. These data sources for\
    \ processing are visualized as numerical arrays. Thus, NumPy as a python package\
    \ supports huge capabilities for array processing. NumPy also provides the following\
    \ functionalities:\n\n* `ndarray`, which supports high-dimensional arrays with\
    \ superior performance capabilities.\n\n* Mathematical functions to support operations\
    \ on entire arrays as a single unit.\n\nIt provides support for linear algebra\
    \ operations and allows Python code to interact with C and C++.\n\n#### How to\
    \ use NumPy\n\nThe convention is to use NumPy with the command as illustrated\
    \ in [Figure 3.26](#chapter03.xhtml#fig3_26).\n\n![Figure 3.26 Usage of NumPy\
    \ module.](images/fig3_26.jpg)\n\nFigure 3.26 Usage of NumPy module.\n\nIf you\
    \ see the above screen, the execution of `import numpy as np` resulted in the\
    \ interpreter prompt ⋙; this means that the NumPy package is installed correctly.\n\
    \n### 3.18 NumPy Operations\n\n#### 3.18.1 Creating an Array from a Python List\n\
    \nThe first step is to build a Python list. Let us consider `lst=[10, 20, 30,\
    \ 40, 50]`. To convert the list to an array we have to use the function `np.array()`\
    \ and pass the argument to the list (i.e., `lst`). This is visualized in [Figure\
    \ 3.27](#chapter03.xhtml#fig3_27).\n\n![Figure 3.27 Python Command Code to Create\
    \ an Array from Python List.](images/fig3_27.jpg)\n\nFigure 3.27 Python Command\
    \ Code to Create an Array from Python List.\n\nNumPy requires that all array elements\
    \ be of the same type. If the elements do not match, the lower type will be converted\
    \ or promoted to a higher type.\n\n![Figure 3.28 Python Command Code to Show Type\
    \ Conversion When Creating an Array from Python List.](images/fig3_28.jpg)\n\n\
    Figure 3.28 Python Command Code to Show Type Conversion When Creating an Array\
    \ from Python List.\n\nSome of the basic datatypes supported by NumPy are illustrated\
    \ in [Table 3.4](#chapter03.xhtml#table3_4).\n\nTable 3.4 NumPy data types\n\n\
    | DataType | Description |\n| --- | --- |\n| bool_ | Boolean True or False |\n\
    | int32 | Supports Integers on 32 bit machines |\n| int64 | Supports Integers\
    \ on 64 bit machines |\n| uint32 | Supports Integers on 64 bit machines |\n| float32\
    \ | Single precision float |\n| float64 | Double precision float |\n| complex64\
    \ | Complex number with real and imaginary parts |\n| complex128 | Complex number\
    \ with real and imaginary parts |\n\nSuppose we want to create an array of floats,\
    \ we can use `dtype='float64'`. This is illustrated in [Figure 3.29](#chapter03.xhtml#fig3_29).\n\
    \n#### 3.18.2 Creating Arrays\n\nTo create a one-dimensional array of 20 elements,\
    \ we can use the `arange` function. This is illustrated in [Figure 3.30](#chapter03.xhtml#fig3_30).\n\
    \nTo create a two-dimensional array of dimensions 3 x 3 filled with 1s of Integer64\
    \ type, we need to use the `ones` function. This is illustrated in [Figure 3.31](#chapter03.xhtml#fig3_31).\n"
