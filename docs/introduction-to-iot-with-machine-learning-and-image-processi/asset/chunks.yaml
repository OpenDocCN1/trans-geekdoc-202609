    ## 2. Hidden Layer Neurons

    Hidden layer neurons have an activation function like `sigmoid` or `relu`. These
    are applied to the values received from the input layers.


    3. The processed values are then given to the output layers. These are the actual
    outputs of the algorithm.


    The outputs generated may need not be accurate. Thus, the backpropagation phase
    is initiated.


    In the backpropagation phase, the following steps are executed.


    1. The error is calculated by computing the difference between the output and
    the input. This difference is known as a `loss` and the corresponding function
    as the `loss function`. An example of the loss function is a mean squared error.


    2. A partial derivative of the error function known as the `gradient descent`
    is computed. If the slope of the error function is positive, then then weights
    can be reduced or the weights can be increased. This exercise reduces the overall
    error, and its corresponding function is called the `optimization function`.


    MLPs are suitable for classification problems in which the inputs are assigned
    a class or label.


    ### 4.7.1 Application of MLPs


    * Time Series Predictions

    * Image Processing

    * Character Recognition


    #### Python program: MLP.py


    ```python

    from pandas import read_csv

    from sklearn.model_selection import KFold

    from sklearn.model_selection import cross_val_score

    from sklearn.neural_network import MLPClassifier

    from sklearn.model_selection import train_test_split

    from matplotlib import pyplot as plt

    from sklearn import metrics

    from sklearn.preprocessing import StandardScaler


    filename = ''heart.csv''

    names = [''age'',''sex'',''cp'',''trestbps'',''chol'',''fbs'',''restecg'',''thalach'',''exang'',''oldpeak'',''slope'',''ca'',''thal'',''target'']

    dataframe = read_csv(filename, names=names)

    array = dataframe.values

    X = array[:,0:13]

    Y = array[:,13]

    X_train, X_test, y_train, y_test = train_test_split(X, Y, test_size = 0.2, random_state
    = 0)

    scaler = StandardScaler()

    scaler.fit(X_train)

    X_train = scaler.transform(X_train)

    X_test = scaler.transform(X_test)

    mlp = MLPClassifier(hidden_layer_sizes=(30, 30, 30), max_iter=1000)

    r=mlp.fit(X_train, y_train)

    kfold = KFold(n_splits=10, random_state=7)

    results = cross_val_score(mlp, X, Y, cv=kfold)

    print("K-Fold Classification Accuracy:",results.mean()*100)

    y_pred = mlp.predict(X_test)

    conf_matrix = metrics.confusion_matrix(y_test, y_pred)

    print(conf_matrix)

    print("Confusion Matrix Accuracy:",metrics.accuracy_score(y_test, y_pred)*100,"%")

    print("Confusion Matrix Precision:",metrics.precision_score(y_test, y_pred)*100,"%")

    print("Confusion Matrix Recall:",metrics.recall_score(y_test, y_pred)*100,"%")

    y_pred_prob = r.predict_proba(X_test)[:,1]

    fp_rate, tp_rate, _ = metrics.roc_curve(y_test, y_pred_prob)

    auc_score = metrics.roc_auc_score(y_test, y_pred_prob)

    plt.rcParams[''toolbar''] = ''None''

    plt.title(''Neural Network'')

    plt.xlabel(''False Positive Rate'')

    plt.ylabel(''True Positive Rate'')

    plt.plot(fp_rate,tp_rate,label="data 1, auc="+str(auc_score))

    plt.legend(loc=4)

    plt.show()

    ```


