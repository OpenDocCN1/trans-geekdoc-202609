- fmt: "\nLinear Discriminant Analysis (LDA) is a supervised learning technique. It\
    \ is used as a dimensionality reduction technique. LDA as a classification technique\
    \ was developed by R. A. Fisher.\n\nLDA tries to achieve:\n\n- Making the distance\
    \ between the two clusters large.\n- Making the intra-cluster distance small.\n\
    \nSelect `W` to maximize the ratio of between-class scatter and the within-class\
    \ scatter.\n\nThe between class scatter matrix is defined in [Equation 4.13](#chapter04.xhtml#math4_13)\n\
    \n$$S\\_{B} = \\\\ \\\\sum\\\\limits\\_{i = 1}^{c}N\\_{i}\\\\left( {\\\\mu\\_{i}\
    \ - \\\\mu} \\\\right)\\\\left( {\\\\mu\\_{i} - \\\\mu} \\\\right)^{T},}$$  \n\
    \n<graphic xlink:href=\"math4\\_13.tif\"/>\n\n(4.13)\n\nwhere `μ`[`i`]`<img src=\"\
    images/inline-math4\\_19.jpg\" alt=\"\"/> is the mean of the class `X`[`i`]<img\
    \ src=\"images/inline-math4\\_20.jpg\" alt=\"\"/>\n\n`N`[`i`]<img src=\"images/inline-math4\\\
    _21.jpg\" alt=\"\"/> is the number of samples in class `X`[`i`]<img src=\"images/inline-math4\\\
    _22.jpg\" alt=\"\"/> `μ`<img src=\"images/inline-math4\\_23.jpg\" alt=\"\"/> is\
    \ the overall mean of the data\n\n`c` is the overall number of classes.\n\nThe\
    \ within-class scatter matrix is\n\n$$S\\_{W} = \\\\;\\\\sum\\\\limits\\_{i =\
    \ 1}^{c}.\\\\sum\\\\limits\\_{x\\_{k} \\\\in x\\_{i}}{\\\\left( {x\\_{k} - \\\
    mu\\_{i}} \\\\right){\\left( {x\\_{k} - u\\_{i}} \\\\right)^{T},}}$$  \n\n<graphic\
    \ xlink:href=\"math4\\_14.tif\"/>\n\n(4.14)\n\nhere `x`[`k`]<img src=\"images/inline-math4\\\
    _24.jpg\" alt=\"\"/> is the subset of the sample class `X`[`i`]<img src=\"images/inline-math4\\\
    _25.jpg\" alt=\"\"/>\n\nThe generalized eigenvalue problem of the matrix is given\
    \ in [Equation 4.15](#chapter04.xhtml#math4_15)\n\n`S`[`w`]^( − )*S`[`B`].  \n\
    \n<graphic xlink:href=\"math4\\_15.tif\"/>\n\n(4.15)\n\nEquation 4.15 is solved\
    \ to compute `w` Eigenvectors that maximize [Equation 4.16](#chapter04.xhtml#math4_16)\n\
    \n$$w = {arg\\\\; max}\\\\left| \\\\frac{W^{T}S\\_{B}W}{W^{T}S\\_{W}W} \\\\right|.$$\
    \  \n\n<graphic xlink:href=\"math4\\_16.tif\"/>\n\n(4.16)\n\nSort the eigenvectors\
    \ by decreasing eigenvalues and choose the `k` eigenvectors with the largest eigenvalues\
    \ to form a transformation matrix. Use the transformation matrix to convert the\
    \ original data to lower space.\n\n### 4.11.1 Advantages of LDA\n\n- LDA is simple\
    \ and mathematically robust.\n- It produces results with accuracy comparable with\
    \ complex models.\n\n### 4.11.2 Limitations of LDA\n\n- LDA is sensitive to overfitting.\n\
    - It is not well suited to non-linear problems.\n\n#### Python program: LDA.py\n\
    \n```python\nfrom pandas import read_csv\nfrom sklearn.model_selection import\
