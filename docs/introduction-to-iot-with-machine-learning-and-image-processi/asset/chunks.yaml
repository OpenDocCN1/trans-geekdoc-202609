    `ARM` 代表 `Advanced RISC Machines`。该公司专门制造基于`精简指令集计算机`（`RISC`）架构的处理器。`RISC` 强调寄存器的使用和更小的指令，因此能够以每秒执行百万条指令的能力实现更高的速度。`ARM`
    处理器较小的尺寸和低功耗使其最适合如树莓派（`Raspberry Pi`）等小型设备。


    最新型号（`Raspberry Pi 3 B+`）使用了 `1.2 GHz` `ARM Cortex – A53` `Broadcom BCM 2837 处理器`。主要的区别在于四核
    `ARM Cortex A53` (`ARMv8`) 簇，它的运行频率为 `1.2 GHz`，比 `Raspberry Pi 2` 模型快了 50%。


    ## 2.1 树莓派型号时间线


    以下是迄今发布的各种基础`树莓派`型号简要时间线。


    | 年份：2012 型：`Raspberry Pi Model B` 尺寸：`85.60 mm × 56.5 mm` CPU：`ARM1176JZF-S;
    32 bit` GPU：`Broadcom VideoCore IV @ 250 MHz` 速度：`700Mhz 单核 CPU` RAM：`512MB RAM`
    | 年份：2013 型：`Raspberry Pi Model A` 尺寸：`85.60 mm × 56.5 mm` CPU：`ARM1176JZF-S 32
    bit` GPU：`Broadcom VideoCore IV @ 250 MHz` 速度：`700Mhz 单核 CPU` RAM：`256 MB RAM`
    |


    | --- | --- |


    | 年份：2014 型：`Raspberry Pi Compute model` 尺寸：`67.6 mm × 30 mm` CPU：`ARM1176JZF-S
    32 bit` GPU：`Broadcom VideoCore IV @ 250 MHz` 速度：`700Mhz 单核 CPU` RAM：`512 MB RAM`
    | 年份：2015 型：`Raspberry Pi Zero` 尺寸：`65 mm × 30 mm × 5 mm` CPU：`ARM1176JZF-S 32
    bit` GPU：`Broadcom VideoCore IV @ 250 MHz` 速度：`1 GHz 单核 CPU` RAM：`512 MB RAM`
    |


    | --- | --- |


    | **最新树莓派型号** |


    | --- |

    | 年份：2018 型：`Raspberry Pi 3 Model B+` 尺寸：`85mm x 56mm x 17mm`。CPU：`Cortex-A53
    (ARMv8) 64-bit` GPU：`双核 VideoCore IV GPU@400 MHz` 速度：`1.4GHz 64-bit 四核 ARM Cortex
    A53 CPU` RAM：`1GB RAM` |


    ## 2.2 树莓派型号 3 的组件


    `Raspberry Pi Model 3` 的简要组件布局如图图 2.1 所示。我们在书中考虑的型号是 `Raspberry Pi 3 V 1.2`。


    ![Figure 2.1 Raspberry Pi Model 3.](img/fig2_1.jpg)


    图 2.1 树莓派型号 3。


    ### 2.2.1 通用输入输出引脚 (GPIO) 引脚


    `树莓派`板上有 40 个通用输入输出（`GPIO`）引脚，如图图 2.2 所示。这些引脚帮助树莓派与现实世界连接。通过这些引脚的帮助，树莓派可以帮助你控制电机、扩展板和
    `LED` 等物理设备。


    ![Figure 2.2 GPIO Pins.](img/fig2_2.jpg)


    图 2.2 GPIO 引脚。


    板左侧的引脚使用 1 到 39 的奇数进行编号；右侧使用 2 到 40 的偶数。`GPIO` 引脚有两种命名方式：一种是 `GPIO` 编号，另一种是物理编号。`GPIO`
    编号指的是片上系统（`System on Chip`）上的 `Broadcom` 编号，而物理编号指的是 `树莓派板`上指定的 40 个引脚。


    ### 2.2.2 Broadcom BCM283 7 64 位位 ARMv7 四核处理器


    树莓派的中心是一个带有 `1GB` `RAM` 的 `ARMv7 四核处理器`，工作频率为 `1.2 GHz`。处理器的微型尺寸非常显著。在 `1.2 Ghz`
    频率下的四核特性使其比 `Raspberry Pi 2` 快了 50%。配合 `GPU`，树莓派在数值计算情况下大显异彩。


    ### 2.2.3 Micro USB 插槽


    `Micro USB` 电源接口为树莓派板供电。如图图 2.3 所示。


    ![Figure 2.3 Micro USB Slot.](img/fig2_3.jpg)


    图 2.3 Micro USB 插槽。


    树莓派板由 `5v DC` 电源供电。要开启树莓派，需要 `5v DC` 电源。


    ### 2.2.4 高清多媒体接口 (HDMI) 端口


    树莓派提供高清多媒体接口（`HDMI`）输出。如图图 2.4 所示。


    ![Figure 2.4 HDMI Port.](img/fig2_4.jpg)


    图 2.4 HDMI 端口。


    `HDMI` 端口允许树莓派支持 `1080p`。


    ### 2.2.5 音频


    为了听声音，树莓派提供了 `3.5 mm` 音频。如图图 2.5 所示。


    ![Figure 2.5 Audio Jack.](img/fig2_5.jpg)


    图 2.5 音频。


    ### 2.2.6 通用串行 (USB) 端口


    树莓派提供通用串行（`USB`）端口。如图图 2.6 所示。


    ![Figure 2.6 USB Ports.](img/fig2_6.jpg)


    图 2.6 USB 端口。


    ### 2.2.7 以太网插座


    树莓派提供以太网插座。如图图 2.7。


    ![Figure 2.7 Ethernet Port.](img/fig2_7.jpg)


    图 2.7 以太网端口。


    ### 2.2.8 微 SD 卡槽


    树莓派提供微 SD 卡插槽。如图图 2.8 所示。


    ![Figure 2.8 SD Card Port.](img/fig2_8.jpg)


    图 2.8 SD 卡端口。


    树莓派为了通过其操作系统启动，需要将操作系统存储在 `SD 卡`中。这是必要的，因为树莓派没有硬盘。


    ## 2.3 Raspbian 操作系统


    计算机系统的核心是操作系统。树莓派的首选操作系统是 `Raspbian`。`Raspbian` 基于 `Debian`，这是一种为树莓派高度定制的 操作系统。`Raspbian`
    的流行版本有基于 `Debian 7` 的 `Wheezy`、基于 `Debian 8` 的 `Jessie` 以及基于 `Debian 9` 的 `Stretch`。我们在书中考虑的操作系统是
    `Jessie`。


    树莓派的 `Jessie` 版本专注于让桌面更加舒适。`LibreOffice` 套件包含在 `Jessie` 版本中。这有助于编写文档、准备演示文稿和处理
    `Excel` 表格。这些都与 `Microsoft Windows` 兼容。`Raspbian` 提供的图形用户界面是轻量级桌面环境 `LXDE`。


    ### 2.3.1 树莓派可用操作系统


    让我们讨论一下树莓派的可用操作系统，见表 2.1。


    | 表 2.1 支持树莓派的操作系统 |

    | --- |

    | **Raspbian** - 树莓派基金会推荐的 OS<br>- 非常友好的桌面环境<br>-带有许多预装软件 |

    | **LibreELEC** - 为支持 Kodi 的媒体中心设计<br>- 可以与 KODI 遥控 App 配对<br>- 可以构建小型家庭影院 |

    | **Windows 10 IoT Core** - 提供与 Visual Studio 的集成<br>- 支持 ARM 和 X86 架构<br>- 支持连接设备进行开发
    |

    | **RISC OS** - 性能是设计者强调的关键<br>- 附带一个存档文件，大小仅 4MB，非常小<br>- 提供了更好的拖拽选项 |


