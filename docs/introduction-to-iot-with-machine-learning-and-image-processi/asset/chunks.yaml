    Sometimes we need to split an array into different arrays. This is accomplished
    with the `split()` function. If the split of the array is going to be into arrays
    of unequal sizes, then you need to give the split points. This is illustrated
    in [Figure 3.48](#chapter03.xhtml#fig3_48).


    ![Figure 3.48 Python Command Code to Split Arrays of Unequal Sizes.](images/fig3_48.jpg)


    Figure 3.48 Python Command Code to Split Arrays of Unequal Sizes.


    ```python

    a1, a2, a3 = np.split(a,[3,7])

    ```


    <graphic xlink:href="unmath3\_8.tif"/>


    Here the split for the first array is 0 to 2, for the second array 3 to 6 and
    for the third array it is 7 to 9. This we have accomplished with the split points
    `[3,7]`.


    However, there is another way of splitting an array to unequal sizes. This is
    accomplished with the routine `array_split()` and is illustrated in [Figure 3.49](#chapter03.xhtml#fig3_49).


    ![Figure 3.49 Python Command Code to Split Arrays of Unequal Sizes with Array_Split().](images/fig3_49.jpg)


    Figure 3.49 Python Command Code to Split Arrays of Unequal Sizes with Array_Split().


    ## 3.19 Pandas Introduction


    Pandas is one of the essential Python libraries you need to study as a productive
    data scientist. In brief, Pandas builds upon the capabilities of NumPy arrays
    into labeled rows and columns.


    Pandas can be visualized as the sum of NumPy array capabilities with the power
    of spreadsheets and relational databases.


    A small subset of Pandas applications includes:


    *   Converting a NumPy array, Python list or dictionary into a Pandas dataframe
    object.

    *   Opening a locally stored csv file.

    *   Helping to open a remote csv file through a URL.


    ### 3.19.1 Exploring Pandas


    To check whether Pandas has been installed properly, you can type the command
    illustrated in [Figure 3.50](#chapter03.xhtml#fig3_50).


    ![Figure 3.50 Python Command Code to Check Whether Pandas Is Installed Properly.](images/fig3_50.jpg)


    Figure 3.50 Python Command Code to Check Whether Pandas Is Installed Properly.


    If you get the interpreter prompt without any errors, that means Pandas has been
    installed properly.


    The two preliminary data structures of Pandas you need to study are `Series` and
    `DataFrame`.


    ![Figure 3.51 Python Command Code to Demonstrate Use of Pandas Series Object.](images/fig3_51.jpg)


    Figure 3.51 Python Command Code to Demonstrate Use of Pandas Series Object.


    In Pandas official documentation, a `Series` is described as a homogeneously typed
    structure. Let us consider the example illustrated in [Figure 3.52](#chapter03.xhtml#fig3_52).


    ![Figure 3.52 Python Command Code to Demonstrate Use of Series Object for Upcast.](images/fig3_52.jpg)


    Figure 3.52 Python Command Code to Demonstrate Use of Series Object for Upcast.


    Here we observe that the `Series` object allowed us to insert a string `''a''`.
    Thus the presence of int and string has resulted in an upcast of the type. If
    the array contains integers and floats, the array type will be upcasted to float.
    This is visualized with the help of the example as [Figure 3.53](#chapter03.xhtml#fig3_53).


    ![Figure 3.53 Python Command Code to Demonstrate Use of Series Object for Upcast
    from Integers to Floats.](images/fig3_53.jpg)


    Figure 3.53 Python Command Code to Demonstrate Use of Series Object for Upcast
    from Integers to Floats.


    Here we observe that the `series` object contained integers and floats and has
    been upcasted to floats. **Note:** Although the `Series` object will permit non-homogeneous
    elements, certain Pandas functions may not work. Since for the above series object
    we did not specify an index, it by default took an index from 0 to `N-1` where
    `N` is the number of elements in the `Series` object.


    Sub can be obtained by splicing the `Series` object like NumPy. This is illustrated
    in [Figure 3.54](#chapter03.xhtml#fig3_54).


    ![Figure 3.54 Python Command Code to Generate Sub-array Using Splicing of Series
    Object.](images/fig3_54.jpg)


    Figure 3.54 Python Command Code to Generate Sub-array Using Splicing of Series
    Object.


    In the case of `series` object in Pandas, we can access index using strings and
    not restrict ourselves like NumPy. This is illustrated in the example in [Figure
    3.55](#chapter03.xhtml#fig3_55).


    ![Figure 3.55 Python Command Code to Access Series Index Using Strings.](images/fig3_55.jpg)


    Figure 3.55 Python Command Code to Access Series Index Using Strings.


    The Pandas `Series` object could be visualized as a Python dictionary. Here the
    corresponding keys and their values are mapped together. This is illustrated in
    [Figure 3.56](#chapter03.xhtml#fig3_56).


    ![Figure 3.56 Python Command Code to Implement Series Object as Dictionary.](images/fig3_56.jpg)


    Figure 3.56 Python Command Code to Implement Series Object as Dictionary.


    Here, the indices are the keys of the dictionary in the sorted form.


    ### 3.19.2 DataFrame Object


    A `DataFrame` is a tabular structure like a spreadsheet in which each column represents
    different values. It can also be visualized as a collection of 1-dimensional `Series`
    objects. Thus a `DataFrame` can be thought of as a page in a spreadsheet. This
    is illustrated in [Table 3.4](#chapter03.xhtml#table3_4).


    Let us try to depict a state, its capital and the capital’s population.


    Table 3.4 Table of a state, capital and population


    | State | Capital | Population |

    | :--- | :--- | :--- |

    | Alabama | Montgomery | 198,232 |

    | Florida | Tallahassee | 193,078 |

    | Louisiana | Baton Rouge | 226,505 |

    | Massachusetts | Boston | 687,584 |

    | Virginia | Richmond | 230,254 |


    ![Figure 3.57 Python Command Code to Demonstrate Dataframe as a Tabular Structure.](images/fig3_57.jpg)


    Figure 3.57 Python Command Code to Demonstrate Dataframe as a Tabular Structure.


    As we have not specified the row indexes, it has taken the index values from 0
    to 4. We can access the `DataFrame` object by specifying the column name or by
    getting the data from a specific row.


    Example: `dataf[''state'']`


    To get specific row data we can use the following


    ```python

    dataf.ix[1]

    ```


    Here `ix` stands for indexing field. This is illustrated in [Figure 3.58](#chapter03.xhtml#fig3_58).


    ![Figure 3.58 Python Command Code to Access Dataframe Object.](images/fig3_58.jpg)


    Figure 3.58 Python Command Code to Access Dataframe Object.


    The datatype of the columns of a `DataFrame` object are of the same type. We can
    get the data types of all columns by specifying:


    *   `dataframeobject.dtypes`

    *   We can also get the datatype of a specific column by writing:

    *   `dataframeobject[''column_name''].dtype`


    ![Figure 3.59 Python Command Code to Access Dataframe Object.](images/fig3_59.jpg)


    Figure 3.59 Python Command Code to Access Dataframe Object.


    As a Pandas `DataFrame` object contains many records, it is sometime useful to
    check a limited number of sample records from the top or the bottom. Pandas provides
    functions like `head()` and `tail()` to accomplish the same.

