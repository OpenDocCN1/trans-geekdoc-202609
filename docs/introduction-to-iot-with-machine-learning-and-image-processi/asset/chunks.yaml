    \ for else with while loop.](images/fig3_19.jpg)\n\nFigure  3.19  Output of Python\
    \ Program for else with while loop.\n\nThe else statement is clubbed with the\
    \ for loop in the case in which the for loop has been exhausted by iterating with\
    \ all elements in the sequence. For example, consider the Python program illustrated\
    \ in [Figure 3.20](#chapter03.xhtml#fig3_20).\n\n![Figure  3.20  Python Program\
    \ to Demonstrate else in Combination with for loop.](images/fig3_20.jpg)\n\nFigure  3.20  Python\
    \ Program to Demonstrate else in Combination with for loop.\n\n![Figure  3.21  Output\
    \ of Python Program for Else with for loop.](images/fig3_21.jpg)\n\nFigure  3.21  Output\
    \ of Python Program for Else with for loop.\n\n## 3.12 Strings in Python\n\nStrings\
    \ are contiguous set of characters enclosed by double quotes in Python.\n\nExample:\
    \ “Hello”\n\n     “Raju”\n\nThe concatenation of two strings is performed with\
    \ the “+” operator. Example a = “Good” and b = “Morning”. Then a+ b will give\
    \ Good Morning.\n\nThe operator “in” returns True if the given character is in\
    \ the string. The operator “not in” returns True if the given character is not\
    \ in the given string. Example G in Good returns True and G not in Morning returns\
    \ True.\n\n### 3.12.1 String Built-in Methods\n\nFollowing are some of the commonly\
    \ used string methods\n\n1.  **len(string)** returns the length of the string.\
    \  \n\n    Example: len(“morning”)  \n\n    Output: 7\n\n2.  **lower()** converts\
    \ uppercase letters into lowercase.  \n\n    Example: str= “HELLO”  \n\n           print\
    \ str.lower()  \n\n    Output: hello\n\n3.  **find()** finds whether the string\
    \ is there in a string or in a substring of the string.  \n\n    find(sub, start\
    \ = 0, end = len(string))  \n\n    Example: str= “morning”  \n\n          str.find(\"\
    r\",0,len(str))  \n\n    Output: 2\n\n4.  **replace()** replaces the old string\
    \ with a new string and returns the updated string.  \n\n    replace(old, new,\
    \ max\\_occurrence)  \n\n    Example: str=\"Good Morning\"  \n\n            str.replace(\"\
    Morning\", \"Evening\",1)  \n\n    Output: 'Good Evening'\n\n5.  **split()** method\
    \ provides a way to split a string into small substrings separated by a delimiter.\
    \ The output is a list.  \n\n    Example: str=\"Winning is everything\"  \n\n\
    \            str.split()  \n\n    Output: \\['Winning', 'is', 'everything'\\]\n\
    \n## 3.13 List in Python\n\nA list is comma-delimited values enclosed in square\
    \ brackets. Example lst = \\['a', 'b', 'c', 'd'\\]. The Python program list\\\
    _op.py illustrates in [Figure 3.22](#chapter03.xhtml#fig3_22) an example of list.\n\
    \n![Figure  3.22  Python Program to Demonstrate an Example of list.](images/fig3_22.jpg)\n\
    \nFigure  3.22  Python Program to Demonstrate an Example of list.\n\n![Figure  3.23  Output\
    \ of Python Program list\\_op.py.](images/fig3_23.jpg)\n\nFigure  3.23  Output\
    \ of Python Program list\\_op.py.\n\n### 3.13.1 List Methods\n\n*   **len(list)**\
    \ gives the length of the list.  \n\n    lst=\\['a', 'b', 'c', 'd'\\]  \n\n  \
    \  len(lst)  \n\n    Output: 4\n\n*   **list.reverse()** reverses the elements\
    \ of the list.  \n\n    lst=\\['a', 'b', 'c', 'd'\\]  \n\n    lst.reverse()  \n\
    \n    lst=\\['d', 'c', 'b', 'a'\\]\n\n*   **list.sort()** sorts the elements of\
    \ the list in ascending order.  \n\n    lst=\\['d', 'c', 'b', 'a'\\]  \n\n   \
    \ lst.sort()  \n\n    lst= \\['a', 'b', 'c', 'd'\\]\n\n## 3.14 Tuples in Python\n\
    \nTuples are sequences similar to lists except that they are immutable (i.e.,\
    \ they cannot be changed and they use parentheses). Example tup=('a', 'b', 'c',\
    \ 'd')\n\n*   **len(tuple)** gives the length of the tuple.  \n\n    tup=('a',\
    \ 'b', 'c', 'd')  \n\n    len(tup)  \n\n    4\n\n*   **max(tuple)** returns the\
    \ max value in a tuple.  \n\n    tup=(1,2,3,4)  \n\n    max(tup)  \n\n    4\n\n\
    *   **min(tuple)** returns the min value of the tuple.  \n\n    tup=(1,2,3,4)\
    \  \n\n    min(tup)  \n\n    1\n\n## 3.15 Dictionaries in Python\n\nDictionaries\
    \ are key value pairs separated by “:” and enclosed in curly braces. Example dict\
    \ ={'a': 'apple', 'b': 'ball', 'c': 'cat', 'd': 'dog', 'e': 'elephant'}"
