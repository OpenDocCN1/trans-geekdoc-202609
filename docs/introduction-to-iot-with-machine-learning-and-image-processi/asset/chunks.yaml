    This book is divided into five chapters. The first chapter provides some introductory
    material on Raspberry Pi and a brief introduction to the authors. The second chapter
    explains different types of Raspberry Pis and provides the reader with important
    information on the slots and other necessary elements of the Raspberry Pi. An
    explanation on these elements or parts is essential from a usability perspective.
    It also provides instructions on installing the operating system `Raspbian` [[3](#chapter01.xhtml#ref1_3)]
    on Raspberry Pi. Additionally, it provides some information on peripheral devices
    and the ways in which they can be used with the Raspberry Pi.


    The importance of using `Raspbian` dwells in the idea that installing and using
    this operating system is a necessary step in the synthesis of systems and applications.
    `Raspbian` is a freely available operating system for the Raspberry Pi. It is
    important to note that `Raspbian` is not affiliated with the Raspberry Pi Foundation.
    `Raspbian` is a community-funded development effort as was the case in the early
    days of the Linux operating system. Interestingly, `Raspbian` is a Linux distribution
    built with the Linux operating system. `Raspbian` was first released in the year
    2012.


    The third chapter explains the elements of `Python` programming [[4](#chapter01.xhtml#ref1_4)]
    that are essential with respect to using Raspberry Pi. Here the authors dwell
    on esoteric programming details that are needed for successful Raspberry Pi application.
    These details include matrix operations, Cholesky decomposition and modifying
    data frames. It is important to note that data manipulation and analysis have
    become critical in today’s world of artificial intelligence and big data. Raspberry
    Pi provides the much-needed hardware for manipulating big data. The authors understand
    this need and provide some basic information on the development of systems for
    data manipulation using the Raspberry Pi. [Chapter 3](#chapter03.xhtml) contains
    necessary program snippets with illustrations of expected outcomes. One of the
    critical objectives of this illustration is to help the reader with machine learning
    application development using the Raspberry Pi. These applications can be applied
    to smart phones, wearable devices, farming devices and other IoT applications.


    [Chapter 4](#chapter04.xhtml) dwells on details with respect to programming machine-learning
    systems. The authors explore required approaches for splitting data sets into
    test and training sets essential for machine learning algorithm implementations.
    We use health informatics examples to explain how machine learning can be implemented
    using the Raspberry Pi. This chapter provides the reader with necessary information
    on synthesizing expert systems, developing knowledge banks and performing knowledge
    curation.


    Machine learning implementation is explained with several examples, programing
    snippets and figures associated with the outcome of their implementation. Implementation
    of machine learning is important in many domains including health informatics,
    where machine learning has been extensively used to predict healthcare outcomes
    and diagnoses and for genetics and bioinformatics. Machine learning and big data
    analytics have been helpful in predicting the early onset of diseases. Additionally,
    the possibility of the development of a disease or disorder later in life can
    be predicted with the application of bioinformatics based on the information derived
    from human genomes. The integration of Raspberry Pi into portable biomedical devices
    enhances the possibility of computation.


    Finally, [chapter 5](#chapter05.xhtml) deals with image processing using the Raspberry
    Pi. Here the authors provide many program snippets and associated outputs, thereby
    delineating details that are necessary for the reader to use the device to perform
    image-processing algorithms. In recent times, it has been observed that image
    processing and machine learning associate well. Thus, the authors provide information
    on machine learning and image processing in this book. With the advent of the
    Raspberry Pi, the size of the computational device for image processing is reduced
    while at the same time it improved the available computability. This aids the
    development and synthesis of real-time sensors in need of advanced processing.


    The authors have extensive experience in research and development of science and
    technology. Dr. Shrirang Kulkarni has a Doctoral degree in Computer Engineering;
    he started his career in research by exploring and developing technologies for
    ad hoc wireless networks. He further identified other areas of science and technology
    in which his fundamental approaches could be used, thereby expanding on the transdisciplinary
    and transformative nature of his research. He now works on research projects that
    involve using the Raspberry Pi for developing machine learning techniques for
    healthcare. Additionally, Dr. Kulkarni has written several books that have attained
    national attention in India. It is also important to mention that he has been
    involved in teaching engineering students for the last 18 years.


    Dr. Steven Fernandes is a well-accomplished researcher in the area of Internet
    of Things (IoT), machine learning, image processing and the design and development
    of intelligent systems. He has published more than 40 articles in reputable journals.
    Additionally, he has served as a guest editor for several special issues. Dr.
    Fernandes has been involved in teaching engineering students in India and the
    United States for about a decade.


    Finally, Dr. Varadraj Prabhu Gurupur is currently serving as an Associate Professor
    with the Department of Health Management and Informatics at the University of
    Central Florida. Dr. Gurupur has more than 100 publications, including a book,
    chapters, journal articles, abstracts, conference papers and published reviews.
    He has worked on several projects funded by agencies such as the National Science
    Foundation and the National Institutes of Health. He has been actively involved
    with the Institute of Electrical and Electronic Engineers for over a decade. Additionally,
    he has been honored with several national, regional and state level awards in
    the United States for his accomplishments in the area of Health Informatics. Dr.
    Gurupur received his Master’s in Computer Science in the year 2005 and Doctor
    of Philosophy in Computer engineering in 2010 from the University of Alabama at
    Birmingham.


