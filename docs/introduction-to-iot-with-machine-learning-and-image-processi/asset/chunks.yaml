    ## 4.10 K 邻域


    K 邻域（也称为 K 近邻 (KNN)）是一种监督学习算法。在这种基于实例的学习中，训练观测值被作为模型的一部分保留。它被称为基于竞争的学习，因为它使用数据实例之间的竞争来进行预测。它也被称为懒惰学习，因为构建模型的决策被推迟到预测时刻。当
    KNN 被称为非参数化的时，意味着它对底层数据分布不作任何假设。采用 K 近邻来执行分类。使用公式 4.12 所示的欧几里得距离公式来衡量距离


    $$d(a,b) = \sum_{i = 1}^{n}(b_{i} - a_{i})^{2}.$$


    两点之间的欧几里得提供了连接它们的长度。KNN 认为具有相似输入的样本属于同一类，如图 4.24(a)和图 4.24(b)所示。


    ### 4.10.1 K 邻域的优点


    - KNN 对于较小的数据运行良好。

    - KNN 对非线性数据有很好的效果。

    - KNN 可以应用于分类和回归。


    ### 4.10.2 K 邻域的局限性


    - KNN 在计算上开销较大。

    - KNN 对噪声数据敏感。


    #### Python 程序：Kighbor.py


    ```python

