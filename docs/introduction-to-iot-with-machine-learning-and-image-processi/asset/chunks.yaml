    ### 3.22.2 Sparse Matrix


    If a matrix contains a large number of zeros, we can call such matrix a sparse
    matrix.


    Example


    $$\begin{matrix} 1 \\ 0 \\ 0 \\ \end{matrix}\;\\;\\;\\;\\begin{matrix} 0 \\ 0
    \\ 0 \\ \end{matrix}\;\\;\\;\\;\\begin{matrix} 0 \\ 3 \\ 0 \\ \end{matrix}$$


    In the above matrix there are 2 non-zero values, and the other 7 values are zero.


    The formula to compute sparsity is


    $$\frac{\text{Number of zero elements}}{\text{Total number of elements}}$$


    Thus, the percentage of sparsity is (7/9)*100 = 77.78%, and the percentage of
    density is (2/9)*100 = 22.22%.

