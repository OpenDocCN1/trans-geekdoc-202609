    ## 4.10 K Neighbors


    K Neighbors (also known as K Nearest Neighbors (KNN)) is a supervised learning
    algorithm. In this type of instance-based learning, the training observations
    are retained as the part of the model. It is known as competition-based learning
    because it uses competition between data instances for prediction. It is also
    called lazy learning because the decision to build a model is pushed until the
    time for prediction. When KNN is referred as non-parametric, it means that it
    makes no assumptions of the underlying data distributions. K nearest neighbors
    are employed perform classification. Euclidean distance formula is used to measure
    the distance as in [Equation 4.12](#chapter04.xhtml#math412)


    $$d(a,b) = \sum_{i = 1}^{n}(b_{i} - a_{i})^{2}.$$


    The Euclidean distance between the two points provides the length connecting them.
    KNN believes that samples with similar inputs belong to the same class as illustrated
    in [Figure 4.24(a)](chapter04.xhtml#fig424) and [Figure 4.24(b)](chapter04.xhtml#fig424).


    ![Figure 4.24 a K=1 in KNN.](images/fig424a.jpg)


    Figure 4.24 a K=1 in KNN.


    ![Figure 4.24 b K=3 in KNN.](images/fig424b.jpg)


    Figure 4.24 b K=3 in KNN.


    Here is the new sample and stand for training samples. The value of `k` determines
    the closest neighbors to consider. When `K=1`, the label of the new sample will
    be that of the closest neighbor. When `K=3` voting by majority is considered.
    Suppose two labels are `X` and one label is `Y`. Then, per the majority system,
    the new label will be `X`. In a tie, a tie-breaker rule (e.g., closest neighbor
    or random label) is chosen.


    ### 4.10.1 Advantages of KNN


    - KNN is relatively fast for small training sets.

    - It makes no assumption of data and works well for non-linear data.

    - It can be applied for both classification and regression.


    ### 4.10.2 Limitations of KNN


    - KNN is computationally expensive because it retains the training data.

    - It is sensitive for larger datasets.


    #### Python program: kneighbor.py


