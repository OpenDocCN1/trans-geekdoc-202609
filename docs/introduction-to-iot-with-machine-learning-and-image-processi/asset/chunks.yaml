    * `cv2.drawContours` 是绘制轮廓的内置函数。\n* `cv2.drawContours(image, contours, index of\
    \ contours, color, thickness)`：轮廓索引为 `-1` 将绘制所有轮廓。\n\n# 参考文献\n\n1. Derek Molloy,\
