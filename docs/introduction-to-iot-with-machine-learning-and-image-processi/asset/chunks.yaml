    \ 显示膨胀图像的 Python 程序输出。](img/fig5_18.jpg)\n图 5.18 显示膨胀图像的 Python 程序输出。\n\n* 该程序应用了腐蚀（移除图像中对象边界的像素）和膨胀（在图像中对象的边界处添加像素）。\n\
    * `np.ones` 返回一个给定形状和类型的数组，其完全由 1 组成。\n* `np.ones(shape, dtype)`：在这里我们使用变量 `\"\
    kernel\"` 并为其赋值为 `np.ones(5,5)`，其维度为 5*5，格式为 `np.ones((5,5), dtype = \"uint8\"\
    )`。`uint8` 是 8 位的无符号整数。\n* 使用内置的腐蚀函数 `cv2.erode`，我们使用 `cv2.erode(image, kernel,\
    \ iterations = 1)`，输入参数为图像、卷积核和迭代次数。\n* 使用内置的膨胀函数 `cv2.dilate`，格式为 `cv2.dilate(image,\
    \ kernel, iterations = 1)`，使用相同的图像、卷积核和迭代次数输入。\n\n## 5.8 使用 Canny 边缘检测器进行边缘检测\n\
    \n```python\nimport cv2\nimport numpy as np\nimage = cv2.imread('image_8.jpg')\n\
    cv2.imshow(\"Original\", image)\ncv2.waitKey(0)\n# cv2.Canny 用于检测边缘的内置函数\n# cv2.Canny(image,\
    \ threshold_1, threshold_2)\ncanny = cv2.Canny(image, 50, 200)\ncv2.imshow('Canny\
    \ Edge Detection', canny)\ncv2.waitKey(0)\ncv2 destroyAllWindows()\n```\n\n**输出：**\n\
    \n![图 5.19 显示原始图像的 Python 程序输出。](img/fig5_19.jpg)\n图 5.19 显示原始图像的 Python 程序输出。\n\
    \n![图 5.20 展示 Canny 边缘检测的 Python 程序输出。](img/fig5_20.jpg)\n图 5.20 展示 Canny 边缘检测的\
    \ Python 程序输出。\n\n* 该程序检测图像中的边缘。\n* 我们使用 Canny 边缘检测器，它通常被认为是最强大且高效的方法；因此，它在许多实时应用中最为常用。\n\
    * 我们使用内置函数 `cv2.Canny(image, 50, 200)`，它需要三个输入参数：我们正在处理的图像、下限 `threshold_1` 和上限\
    \ `threshold_2`。\n\n## 5.9 使用轮廓进行图像分割\n\n```python\n# 分割：将图像划分为区域\n# 轮廓：对象边界周围的线或曲线\n\
    import cv2\nimport numpy as np\nimage = cv2.imread('image_9.jpg')\ncv2.imshow(\"\
    Original\", image)\ncv2.waitKey(0)\n# cv2.Canny 用于检测边缘的内置函数\n# cv2.Canny(image,\
    \ threshold_1, threshold_2)\ncanny = cv2.Canny(image, 50, 200)\ncv2.imshow(\"\
    Canny Edge Detection\", canny)\ncv2.waitKey(0)\n# cv2.findContours 是寻找轮廓的内置函数\n\
    # cv2.findContours(canny, contour retrieval mode, contour approximation mode)\n\
    # 轮廓检索模式: cv2.RETR_LIST (检索所有轮廓)\n# 轮廓近似模式: cv2.CHAIN_APPROX_NONE (存储所有边界点)\n\
    contours=cv2.findContours(canny,cv2.RETR_LIST,cv2.CHAIN_APPROX_NONE)\n# cv2.drawContours\
    \ 是绘制轮廓的内置函数\n# cv2.drawContours(image, contours, index of contours, color, thickness)\n\
    cv2.drawContours(image, contours, -1, (255,0,0), 10)\n# 轮廓索引 = -1 将绘制所有轮廓\ncv2.imshow(\"\
    Contours\", image)\ncv2.waitKey()\ncv2.destroyAllWindows()\n```\n\n**输出：**\n\n\
    ![图 5.21 显示原始图像的 Python 程序输出。](img/fig5_21.jpg)\n图 5.21 显示原始图像的 Python 程序输出。\n\
    \n![图 5.22 显示轮廓的 Python 程序输出。](img/fig5_22.jpg)\n图 5.22 显示轮廓的 Python 程序输出。\n\n\
    * 该程序执行图像分割（将图像划分为区域）以及轮廓（对象边界周围的线或曲线）。\n* 我们使用 Canny 边缘检测通过内置函数 `cv2.findContours`\
    \ 寻找轮廓。\n* `cv2.findContours(canny, contour retrieval mode, contour approximation\
