  \ 和 `b = “Morning”`。那么 `a+b` 将得到 Good Morning。如果指定的字符在字符串中，运算符 `in` 返回 True。如果指定的字符不在字符串中，`not\
  \ in` 返回 True。示例 `G in Good` 返回 True，`G not in Morning` 返回 True。\n\n### 3.12.1 字符串内置方法\n\
  \n以下是一些常用的字符串方法：\n\n1. `len(string)` 返回字符串的长度。\n示例：`len(“morning”)`\n输出：7\n\n2.\
  \ `lower()` 将大写字母转换为小写。\n示例：`str= “HELLO”`\n`print str.lower()`\n输出：hello\n\n3.\
  \ `find()` 查找字符串是否存在于字符串或字符串的子字符串中。\n`find(sub, start = 0, end = len(string))`\n\
  示例：`str= “morning”`\n`str.find(\"r\",0,len(str))`\n输出：2\n\n4. `replace()` 将旧字符串替换为新字符串并返回更新后的字符串。\n\
  `replace(old, new, max_occurrence)`\n示例：`str=\"Good Morning”`\n`str.replace(\"Morning\"\
  , \"Evening\",1)`\n输出：'Good Evening'\n\n5. `split()` 方法提供将字符串按分隔分隔的小字符串的方法。输出是一个列表。\n\
  示例：`str=\"Winning is everything\"`\n`str.split()`\n输出：['Winning', 'is', 'everything']\n\
