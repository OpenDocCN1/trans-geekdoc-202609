  \ 2019.\n\n# 第 3 章](#toc.xhtml#ch03)\n\n# Python 及其库](#toc.xhtml#ch03)\n\n## 3.1\
  \ 介绍\n\nPython 是机器学习领域最流行的语言之一。Python 流行的一个主要原因是其丰富的库支持（参见表 3.1）。\n\n### 表 3.1 Python\
  \ 库\n\n| Python 库 | 用途 |\n| --- | --- |\n| NumPy | 数学应用 |\n| SciPy | 科学计算 |\n| Pandas\
  \ | 数据分析 |\n| matplotlib | 数据可视化 |\n| Scikit-learn | 机器学习 |\n\n## 3.2 Python\n\n\
  ### 3.2.1 什么是 Python？\n\n* Python 由 Guido Rossum 在 20 世纪 80 年代后期提出。\n* 它是一种简单但强大的高级编程语言。\n\
  * 它支持过程化和面向对象的概念。\n* Python 代码是解释执行而非编译的。\n\n## 3.3 典型的 Python 程序\n\n![图 3.1 一个典型的\
