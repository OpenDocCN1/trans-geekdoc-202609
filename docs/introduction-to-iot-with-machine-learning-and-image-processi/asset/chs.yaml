  \ RAM` |\n\n## 2.2 树莓派型号 3 的组件\n\n`Raspberry Pi Model 3` 的简要组件布局如图图 2.1 所示。我们在书中考虑的型号是\
  \ `Raspberry Pi 3 V 1.2`。\n\n![Figure 2.1 Raspberry Pi Model 3.](img/fig2_1.jpg)\n\
  \n图 2.1 树莓派型号 3。\n\n### 2.2.1 通用输入输出引脚 (GPIO) 引脚\n\n`树莓派`板上有 40 个通用输入输出（`GPIO`）引脚，如图图\
  \ 2.2 所示。这些引脚帮助树莓派与现实世界连接。通过这些引脚的帮助，树莓派可以帮助你控制电机、扩展板和 `LED` 等物理设备。\n\n![Figure 2.2\
  \ GPIO Pins.](img/fig2_2.jpg)\n\n图 2.2 GPIO 引脚。\n\n板左侧的引脚使用 1 到 39 的奇数进行编号；右侧使用\
  \ 2 到 40 的偶数。`GPIO` 引脚有两种命名方式：一种是 `GPIO` 编号，另一种是物理编号。`GPIO` 编号指的是片上系统（`System on\
  \ Chip`）上的 `Broadcom` 编号，而物理编号指的是 `树莓派板`上指定的 40 个引脚。\n\n### 2.2.2 Broadcom BCM283\
  \ 7 64 位位 ARMv7 四核处理器\n\n树莓派的中心是一个带有 `1GB` `RAM` 的 `ARMv7 四核处理器`，工作频率为 `1.2 GHz`。处理器的微型尺寸非常显著。在\
  \ `1.2 Ghz` 频率下的四核特性使其比 `Raspberry Pi 2` 快了 50%。配合 `GPU`，树莓派在数值计算情况下大显异彩。\n\n###\
  \ 2.2.3 Micro USB 插槽\n\n`Micro USB` 电源接口为树莓派板供电。如图图 2.3 所示。\n\n![Figure 2.3 Micro\
  \ USB Slot.](img/fig2_3.jpg)\n\n图 2.3 Micro USB 插槽。\n\n树莓派板由 `5v DC` 电源供电。要开启树莓派，需要\
  \ `5v DC` 电源。\n\n### 2.2.4 高清多媒体接口 (HDMI) 端口\n\n树莓派提供高清多媒体接口（`HDMI`）输出。如图图 2.4 所示。\n\
  \n![Figure 2.4 HDMI Port.](img/fig2_4.jpg)\n\n图 2.4 HDMI 端口。\n\n`HDMI` 端口允许树莓派支持\
  \ `1080p`。\n\n### 2.2.5 音频\n\n为了听声音，树莓派提供了 `3.5 mm` 音频。如图图 2.5 所示。\n\n![Figure 2.5\
  \ Audio Jack.](img/fig2_5.jpg)\n\n图 2.5 音频。\n\n### 2.2.6 通用串行 (USB) 端口\n\n树莓派提供通用串行（`USB`）端口。如图图\
  \ 2.6 所示。\n\n![Figure 2.6 USB Ports.](img/fig2_6.jpg)\n\n图 2.6 USB 端口。\n\n### 2.2.7\
  \ 以太网插座\n\n树莓派提供以太网插座。如图图 2.7。\n\n![Figure 2.7 Ethernet Port.](img/fig2_7.jpg)\n\
  \n图 2.7 以太网端口。\n\n### 2.2.8 微 SD 卡槽\n\n树莓派提供微 SD 卡插槽。如图图 2.8 所示。\n\n![Figure 2.8\
  \ SD Card Port.](img/fig2_8.jpg)\n\n图 2.8 SD 卡端口。\n\n树莓派为了通过其操作系统启动，需要将操作系统存储在 `SD\
  \ 卡`中。这是必要的，因为树莓派没有硬盘。\n\n## 2.3 Raspbian 操作系统\n\n计算机系统的核心是操作系统。树莓派的首选操作系统是 `Raspbian`。`Raspbian`\
  \ 基于 `Debian`，这是一种为树莓派高度定制的 操作系统。`Raspbian` 的流行版本有基于 `Debian 7` 的 `Wheezy`、基于 `Debian\
  \ 8` 的 `Jessie` 以及基于 `Debian 9` 的 `Stretch`。我们在书中考虑的操作系统是 `Jessie`。\n\n树莓派的 `Jessie`\
  \ 版本专注于让桌面更加舒适。`LibreOffice` 套件包含在 `Jessie` 版本中。这有助于编写文档、准备演示文稿和处理 `Excel` 表格。这些都与\
  \ `Microsoft Windows` 兼容。`Raspbian` 提供的图形用户界面是轻量级桌面环境 `LXDE`。\n\n### 2.3.1 树莓派可用操作系统\n\
  \n让我们讨论一下树莓派的可用操作系统，见表 2.1。\n\n| 表 2.1 支持树莓派的操作系统 |\n| --- |\n| **Raspbian** - 树莓派基金会推荐的\
  \ OS<br>- 非常友好的桌面环境<br>-带有许多预装软件 |\n| **LibreELEC** - 为支持 Kodi 的媒体中心设计<br>- 可以与\
  \ KODI 遥控 App 配对<br>- 可以构建小型家庭影院 |\n| **Windows 10 IoT Core** - 提供与 Visual Studio\
  \ 的集成<br>- 支持 ARM 和 X86 架构<br>- 支持连接设备进行开发 |\n| **RISC OS** - 性能是设计者强调的关键<br>- 附带一个存档文件，大小仅\
  \ 4MB，非常小<br>- 提供了更好的拖拽选项 |\n\n\n\n\n\n### 第 1 步\n通过 HDMI 将显示器连接树莓派，并通过 USB 连接键盘和鼠标。\n\
  \n### 第 2 步：安装操作系统。\n\n#### 第 2.1\n使用从 ([`www.raspberrypi.org/downloads/`](https://www.raspberrypi.org))\
  \ 获取的新开箱软件 (NOOBs)。\n\n#### 第 2.2\n解压下载的 NOOBs。\n\n#### 第 2.3\n将下载的 NOOBS 文件复制到已格式化的\
  \ SD 卡中。（SDHC 卡 >2GB 且 ≤ 32 GB 符合 FAT 32 格式）。NOOBs 将在首次启动时在 SD 卡上安装 Raspbian。\n\n\
  ### 第 3 步：raspi-config\n\n#### `sudo raspi-config`\n\n你将看到如下屏幕（图 2.9）。选择接口选项。\n\n\
  ![图 2.9 选择接口选项。](img/fig2_9.jpg)\n\n图 2.9 选择接口选项。\n\n按 Enter 键进入选项，使用方向键向上/向下移动。按\
  \ Tab 键选择如 <finish> 等选项。\n\n#### 第 3.1\n更改用户密码。默认登录名为 `pi`，密码为 `raspberry`。\n\n\
  #### 第 3.2\n启用启动到桌面。\n\n#### 第 3.3：国际化选项\n\n##### 第 3.3.1\n更改区域（Change-locale）：选择一种语言。\n\
  \n##### 第 3.3.2\n更改时区。\n\n##### 第 3.3.3\n更改键盘布局。默认是 QWERTY。\n\n配置成功后；树莓派环境将如图 2.10\
  \ 所示。\n\n![图 2.10 树莓派桌面。](img/fig2_10.jpg)\n\n图 2.10 树莓派桌面。\n\n## 2.5 IoT 的应用\n\n\
  根据 Gartner[1] 的数据，到 2020 年将有 26 亿个连接设备。这清楚地表明了巨大的应用潜力。\n\n1. **智能家居**：智能家居是 IoT\
  \ 最强大的应用。你可以通过基于 IoT 的控制系统控制空调、冰箱、微波炉、照明和娱乐系统。\n2. **可穿戴设备**：可以通过可穿戴 IoT 设备监测心率、血压等人体体征参数。这些设备的限制是它们必须小巧且节能。\n\
  3. **农业**：农民有时面临在遥远农场监控作物和牲畜的挑战。现在通过 IoT 可以实现。此外，还可以通过 IoT 设备检测作物病害并控制用水量。\n4. **工业物联网\
  \ (IIoT)**：现在已经意识到 IoT 在制造业、石油气和能源等不同行业中具有大量应用。IoT 帮助行业实现自动化和资源优化。\n\n## 练习题\n\n\
