  *(注：原文文本中 4.10 之后包含大量重复的 Python 代码和乱码句子，已按要求过滤掉重复部分。)*\n\n\n\n线性判别分析（LDA）是一种监督学习技术。它被用作一种降维技术。LDA\
  \ 作为一种分类技术是由 R. A. Fisher 开发的。\n\nLDA 试图实现：\n\n- 增大两个簇之间的距离。\n- 减小类内距离。\n\n选择 `W`\
  \ 以使类间散度与类内散度之间的比值最大化。\n\n类间散度矩阵在公式 4.13 中定义\n\n$$S\\_{B} = \\\\ \\\\sum\\limits\\\
  _{i = 1}^{c}N\\_{i}\\\\left( {\\\\mu\\_{i} - \\\\mu} \\\\right)\\\\left( {\\\\mu\\\
  _{i} - \\\\mu} \\\\right)^{T},}$$  \n\n<graphic xlink:href=\"math4\\_13.tif\"/>\n\
  \n(4.13)\n\n其中 `μ`[`i`]<img src=\"images/inline-math4\\_19.jpg\" alt=\"\"/> 是类 `X`[`i`]<img\
  \ src=\"images/inline-math4\\_20.jpg\" alt=\"\"/> 的均值\n\n`N`[`i`]<img src=\"images/inline-math4\\\
  _21.jpg\" alt=\"\"/> 是类 `X`[`i`]<img src=\"images/inline-math4\\_22.jpg\" alt=\"\
  \"/> 中的样本数量，`μ`<img src=\"images/inline-math4\\_23.jpg\" alt=\"\"/> 是数据的总体均值\n\n\
  `c` 是类的总数。\n\n类内散度矩阵为\n\n$$S\\_{W} = \\\\;\\\\sum\\limits\\_{i = 1}^{c}..\\\\sum\\\
  limits\\_{x\\_{k} \\\\in x\\_{i}}{\\\\left( {x\\_{k} - \\mu\\_{i}} \\\\right){\\\
  left( {x\\_{k} - u\\_{i}} \\\\right)^{T},}}$$  \n\n<graphic xlink:href=\"math4\\\
  _14.tif\"/>\n\n(4.14)\n\n这里 `x`[`k`]<img src=\"images/inline-math4\\_24.jpg\" alt=\"\
  \"/> 是样本类 `X`[`i`]<img src=\"images/inline-math4\\_25.jpg\" alt=\"\"/> 的子集\n\n该矩阵的广义特征值问题在公式\
  \ 4.15 中给出\n\n`S`[`w`]^( − )*S`[`B`].  \n\n<graphic xlink:href=\"math4\\_15.tif\"\
  />\n\n(4.15)\n\n通过求解方程 4.15 计算 `w` 特征向量，使得公式 4.16 最大化\n\n$$w = {arg\\\\; max}\\\\\
  left| \\frac{W^{T}S\\_{B}W}{W^{T}S\\_{W}W} \\\\right|.$$  \n\n<graphic xlink:href=\"\
  math4\\_16.tif\"/>\n\n(4.16)\n\n按特征值降序排序特征向量，并选择特征值最大的 `k` 个特征形成变换矩阵。使用变换矩阵将原始数据转换为低维空间。\n\
  \n### 4.11.1 LDA 的优点\n\n- LDA 简单且在数学上是稳健的。\n- 它产生的结果与复杂模型相当的准确性。\n\n### 4.11.2 LDA\
  \ 的局限性\n\n- LDA 对过拟合敏感。\n- 它不适合非线性问题。\n\n#### Python 程序：LDA.py\n\n```python\nfrom\
  \ pandas import read_csv\nfrom sklearn.model_selection import KFold\nfrom sklearn.discriminant_analysis\
  \ import DiscriminantAnalysis\nfrom sklearn.preprocessing import StandardScaler\n\
  from sklearn.model_selection import cross_val_score\nfrom sklearn.model_selection\
  \ import train_test_split\nfrom sklearn import metrics\nfrom matplotlib import pyplot\
  \ as plt\nfilename = 'heart.csv'\nnames = ['age','sex','cp','trestbps','chol','bs','restecg','thalach','oldpeak','slope','ca','thal','target']\n\
  dataframe = read_csv(filename, names=names)\narray = dataframe.values\nX = array[:,0:13]\n\
  Y = array[:,13]\nX_train, X_test, y_train, y_test = train_test_split(X,Y,test_size=0.2,random_state=0)\n\
  kfold = KFold(n_splits=10, random_state=7)\nlsc = StandardScaler()\nlsc.fit(X_train)\n\
  X_train = lsc.transform(X_train)\nX_test = lsc.transform(X_test)\nldac = DiscriminantAnalysis()\n\
  r = ldac.fit_transform(X_train, y_train)\nresults = cross_val_score(ldac, X, cv=kfold)\n\
  print(\"K-Fold Classification Accuracy:\",results.mean()*100)\ny_pred = ldac.predict(X_test)\n\
  conf_matrix = metrics.confusion_matrix(y_test, y_pred)\nprint(\"The Confusion Matrix\
  \ is: \")\nprint(conf_matrix)\nprint(\"Confusion Matrix Accuracy:\",metrics.accuracy_score(y_test,\
  \ y_pred)*100,\"%\")\nprint(\"Confusion Matrix Precision:\",metrics.precision_score(y_test,\
  \ y_pred)*100,\"%\")\nprint(\"Confusion Matrix Recall:\",metrics.recall_score(y_test,\
  \ y_pred)*100,\"%\")\ny_pred_prob = ldac.predict_proba(X_test)[:,1]\nfp_rate, tp_rate,\
  \ _ = metrics.roc_curve(y_test, y_pred_prob)\nauc_score = metrics.roc_auc_score(y_test,\
  \ y_pred_prob)\nplt.rcParams['toolbar'] = 'None'\nplt.title('Linear Discriminant\
  \ Analysis')\nplt.xlabel('False Positive Rate')\nplt.ylabel('True Positive Rate')\n\
  plt.plot(fp_rate,tp_rate,label=\"data 1, auc=\"+str(auc_score))\nplt.legend(loc=4)\n\
