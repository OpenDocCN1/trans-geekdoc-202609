  \ Python 程序输出。\n\n* 该程序涉及图像缩放以调整图像大小。\n* OpenCV 使用 `cv2.resize()` 函数为此目的。图像的大小可以手动指定或通过缩放因子指定。有不同的插值方法，缩小图像时优先使用\
