    # ### 6.7.10 *Onosma tauricum*


    According to certain reports, there are approximately 102 *Onosma* species found
    in Turkey, and maximum species grow naturally in Europe and Asia regions. In addition,
    these species are not only used to treat various disorders, including fever, stranguary,
    leucoderma, bronchitis, and abdominal pain, but they are also a good source of
    adulterant which is generally used in chilli powder to enhance the color because
    of their dyeing and coloring properties. Few investigations have been done to
    demonstrate the anti-bacterial, anti-inflammatory, anti-cancerous, anti-nociceptive
    and wound healing activities of some species of *Onosma*. A study report was performed
    to analyze the activity of different extracts, ethyl-acetate (OTT-EtOAc), methanol
    (OTT-MeOH), and water (OTT-W) extracted'
