  md: '+   - The time it takes to perform medical activities is significantly reduced,
    with the management processes improvement as well.

    +   - IoT tools are able to replace medical assistance in situations where it
    is possible, for example, reminding about medications, visits, or rehabilitation.


    According to a 2015 study, there are more than 165,000 health-related mobile applications
    on the market. Over the past 2 years, the number of these applications has more
    than doubled. It is estimated that 90% of downloads are generated by 12% of applications.
    Most are about nutrition and exercise. The percentage of applications that allow
    patients to share information safely remains unchanged despite the increasing
    opportunities resulting from the development of information systems [62]. Nearly
    two-thirds of the mobile apps focus on lifestyle, diets, stress, and physical
    activity. In contrast, only 24% of applications concern diseases and their treatment
    [63], and the usage of health app in US in 2015 is shown in Figure 1.5.


    In 2013, over 43,000 health applications on the market had been downloaded more
    than 660 million times. However, most of them, due to their poor quality, are
    not very popular. More than half were downloaded by users fewer than 500 times,
    indicating low interest in most of them. On the contrary, five applications generated
    15% of all downloads, which proves their vast popularity. Data from a survey conducted
    in the USA in 2012 shows that for more than 50% of smartphone users, their phones’
    primary source of health knowledge is information. Nineteen percent of respondents
    downloaded a health-related app on their phones. Despite the massive popularity
    of the application, most of them are not authorized by regulatory bodies such
    as the FDA in the USA [64].


    By using mobile applications, it is easier to promote a healthy lifestyle and
    preventive care. Lack of motivation for systematic physical activity is a big
    problem. The solution here is, for example, the competition used by the Endomondo


    ![](img/7bb239370082cb34554bae1e45e2b0d7_24_0.png)


    FIGURE 1.5 Breakdown of health app usage in USA in 2015.'
