    Thus, analyzing CT images turn out to be more effective.


    # 7.5 FUTURE SCOPE AND LIMITATIONS OF THIS STUDY


    Deep learning algorithms, in general, are automated, robust systems but seek large
    amounts of data for evaluation. The application of the ResNet algorithm for COVID-19
    detection is efficient in determining automated classification. Still, with the
    limitation of valid data, the efficiency gets reduced. These limitations of the
    COVID-19 datasets are mentioned in twofolds. First, the data available were not
    in any proper format, including inconclusive, noisy, incomplete, and unmarked
    formats. They lead to variation in preparations of the data before applying ResNet
    by varied authors. Also, during training, we encounter issues like data redundancy,
    sparsity, and non-availability of values. The second limitation is the availability
    of a minimal dataset of actual COVID patient data. With this limitation, the ResNet
    algorithm causes underfit or overfit problems when pre-trained models are not
    considered. The following limitation of the reviews lies in the evaluation parameter
    selection. Due to a standard database''s unavailability, the authors have used
    varied images, and various parameters like sensitivity, specificity, F1-score,
    AUC, and ROC are evaluated. Therefore, we may not estimate which database or algorithm
    has high efficiency. Although we are moving ahead with using the X-ray and CT-scan
    analysis, the PCR-based RT–PCR method is still the standard and fast'
