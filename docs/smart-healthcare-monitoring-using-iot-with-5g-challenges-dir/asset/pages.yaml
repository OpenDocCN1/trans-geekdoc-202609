  md: 'most popular IoT solutions in healthcare organizations are used to monitor
    and keep patients in good condition (73%).


    A well-chosen diagnosis with the use of IoT tools and applications allows you
    to minimize medical costs while increasing the quality standards of service. Therefore,
    the use of IoT in medicine seems to be an inherent necessity that will allow the
    free functioning of the healthcare system and avoid injuries, accidents, or sudden
    deterioration of health. In addition, correctly implemented diagnosis with the
    use of IoT solutions has the positive impact that is represented by the following
    data [58]:


    +   - Medical consultations without the need for a personal visit and with the
    use of electronic communication via IoT and all its tools create a new medical
    reality and replace the classic approach to patients. This is evidenced by the
    fact that over 70% of patients, having a choice, would prefer a remote medical
    visit instead of a traditional one.

    +   - The use of electronic communication tools through IoT medication significantly
    improves the quality of medical services provided, and additionally allows increasing
    their number at the same time.

    +   - Telemedicine and IoT tools usage leads to better efficiency of medical services
    and eliminates the queues, so it makes it possible to the better use of regional
    medical access points.

    +   - Because of the perspective of costs (direct and indirect) related to civilization
    diseases (ChS-N and cancer), a huge savings in the healthcare system is possible
    with the use of IoT solutions to prevent, report, and diagnose such health problems.

    +   - IoT tools enable the better care of people who are under drug therapy, especially
    through the use of drug dose reminders, guidance on the use of drugs, reconciliation
    of various types of drug therapies carried out simultaneously, capturing drug
    interactions.


    The data collected thanks to IoT solutions serves to supervise better the companies
    producing drugs and medical equipment over the use of products. What’s more, reporting
    on drug intake thanks to the use of IoT tools allows you to observe the results
    of their use and allows you to detect side effects [59]. The implementation of
    IoT tools for medicine and healthcare management is also associated with the possibility
    of reporting non-compliance in the operation of these tools. Thanks to this, their
    producers can make corrections and do the preventive activities, as well as support
    the lack of response from the device users themselves. On the contrary, the data
    from IoT tools supplements the information collected from postmarket surveillance
    of their use [60]. They are utilized to support the determined balance between
    the positives and negatives of the IoT technology products.


    IoT tools increase the everyday life of an aging society, improving and extending
    the quality of life of patients [61]:


    +   - The data collected by IoT (e.g., certified for medical use wearables) may
    have an influence on faster diagnose of dementia, and may conduct constant reporting
    of the health and behavior of an older person.'
