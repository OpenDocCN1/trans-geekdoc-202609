    # 9.3 INTRODUCTION TO SMART HOSPITALS: A DIGITAL TRANSFORMATION IN HEALTHCARE


    A smart hospital is a hospital that relies on smartly optimized and self-driven
    procedure built on an optimized environment of interconnected devices, particularly
    based on IoT, to improve existing patient care technologies and introduce new
    opportunities. Figure 9.2 represents some key ideas behind the smart hospitals.


    Sensors and actuators are capable of managing the smart hospital. Wired or wireless
    sensors are incorporated into ECG monitors, smart thermostats, and blood pressure
    monitors. Here are some reasons that one should opt for smart hospitals.


    **Customization**—Smart hospitals enable the management to control the hospital
    equipment to ease the doctors so that they can be more productive in saving the
    patient’s life.


    +   I. **Comfort**—Smart hospitals help in making the responsibilities of doctors
    and medical staff easy so that they can be more productive and can devote their
    skills to save patient’s lives.'
