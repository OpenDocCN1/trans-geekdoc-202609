    | Contact tracing | Identification of close contacts (case detection) |

    | Contact tracing | Severity assessment |

    | Contact tracing | Manage (people and assets) |


    managing (people and assets) segment in which it is aimed toward resource management.
    It is a common knowledge that many countries that are in the low-to-middle-income
    (LMIC) group are already facing strains in the capacity and accessibility of their
    healthcare systems before COVID-19 pandemic [10]. When the pandemic started, the
    system became much more overloaded as it tried to cater to everyone, and it affected
    not just LMIC countries but others as well. Thus, it is important to have solutions
    that can cater to this issue so that matters like the movement of the patients,
    utilization of hospitals and their tools, patient monitoring, and transport can
    be handled without burdening the healthcare professionals and the system. Table
    13.1 shows the three segments of contact tracing discussed for COVID-19.


    # 13.3 AIMS OF EACH SEGMENT


    Identifying the segments of contact tracing alone will not be adequate in determining
    whether there are enough AI solutions to cater it. This is because the scope in
    each segment may be big that it requires more elements in it, or the scope can
    be a rarely occurring area that very less research ventures into it. Thus, it
    requires aims, in other words, the objectives of each segment to determine whether
    there are enough solutions in it that are catering the segments. These aims can
    be grasped from literatures that are discussing on the types of AI with contact
    tracing for COVID-19 pandemic. A study by Bansal et al. [11] provided seven utility
    for AI toward battling COVID-19.


    They are outbreak detection, prediction of spread, host–vector identification,
    preventive strategies and vaccine development, early case detection and tracking,
    prognosis prediction, and, last but not least, management and drug development.
    These utilities or aims are quite comprehensive as they cover many techniques
    of AI, which are deep learning, natural language processing, sentiment analysis,
    and machine vision. Even so, items such as outbreak detection and host–vector
    identification can be combined as one as they are referring to almost the same
    scenario [3]. On the other hand, the application of AI is categorized into four
    categories: screening and treatment, contact tracing, prediction and forecasting,
    drugs, and vaccination. Even though the categories or the aims are not much in
    variety, they still provide examples from several of the AI methods such as deep
    convolutional neural network, vector machine, and random forest algorithm.'
