  md: '# 9.1 INTRODUCTION


    Cloud computing can be defined as the interconnection of devices, which can be
    accessed and maintained remotely through the Internet. IoT as the platform can
    capture the real-time data, analyze the gathered data, and provide the environment
    to examine it. Both IoT and cloud technology are collectively dependent on each
    other.


    IoT, on the other hand, saves time and enhances the quality of life to a great
    extent. Primary healthcare systems around the world are stretched to a critical
    moment, especially in the developing countries where they have high patient-per-doctor
    ratios. In healthcare, interconnected devices have been introduced for patients
    in various forms such as ECG monitors, sleep monitors, body temperature monitors,
    electrocardiograms, or blood glucose level monitors, which require follow-up interaction
    with a healthcare professional.


    This makes a strong reason why one should opt for smart hospitals. Patients require
    constant monitoring of their glucose levels. Due to the high patient-per-doctor
    ratio, patients are often than not left unattended. This can be fatal as if the
    glucose bottle is mistakenly fed completely and not removed in time, the pressure
    difference between the empty bottle and the patient’s blood will cause an air
    embolism (outward flow of blood into the saline bottle). Figure 9.1 represents
    the essential elements of a smart healthcare system.


    In this chapter with the help of the cloud computing technology, Internet of Things
    (IoT), artificial intelligence (AI), and Android Operating System, the patient
    can seek help by clicking on the button and can alert the nurse and doctors; moreover,
    if the patient is in the unstable state, then the sensors will take care of the
    patient in case of emergency and normal monitoring of the patient’s health. The
    chapter presents a literature review, followed by a discussion over why one should
    opt for smart hospitals; then the technologies used and methodology will be discussed,
    followed by the proposed system, which enables us to understand the result and
    conclusions.


    ![](img/7bb239370082cb34554bae1e45e2b0d7_172_0.png)


    FIGURE 9.1 Smart healthcare system.'
