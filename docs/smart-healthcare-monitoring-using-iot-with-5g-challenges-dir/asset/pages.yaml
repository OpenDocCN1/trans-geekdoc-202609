  md: '# 2 Blending of Internet of Things and Deep Transfer Learning (DTL): Enabling
    Innovations in Healthcare (COVID-19) and Applications


    *Atlanta Choudhury and Kandarpa Kumar Sarma*


    # CONTENTS


    +   - 2.1 Introduction...................................................23

    +   - 2.2 Historical Background...........................................25

    +   - 2.3 Technical Background............................................25

    +   - 2.3.1 Deep Transfer Learning .......................................26

    +   - 2.3.2 Edge Devices..................................................26

    +   - 2.4 Literature Survey...............................................27

    +   - 2.5 Description of Proposed Model to Mitigate COVID-19................28

    +   - 2.6 Review of Certain Reported Works Related to ML/DL Approaches of COVID-19
    Detection, Prediction, and Other Issues...................29

    +   - 2.7 Challenges......................................................33

    +   - 2.8 Future Research Direction ......................................36

    +   - 2.9 Conclusion......................................................36

    +   - References..........................................................37


    # 2.1 INTRODUCTION


    Global healthcare systems are currently facing unprecedented hardships while handling
    the pandemic arising out of this deadly virus. The COVID-19, also called novel
    corona virus, is responsible for the ongoing pandemic, which causes respiratory
    issues leading even to death. It is transmitted among human beings and starts
    expanding to all. Contagiousness components in this deadly viruses are very high
    [1,2], hundreds of millions of people have been contaminated, and huge fatalities
    have been recorded within months from its outbreak. This deadly disease has been'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'classified as a pandemic by the World Health Organization (WHO) [3,4]. This
    is not the only pandemic that has been faced by human beings. Many such outbreaks
    have occurred in the past, and more may occur in the near future [5,6]. There
    are no appropriate drugs available in the market, but after clinical trials, vaccination
    has been started globally. There is no such readymade infrastructure available
    to deal with such outbreaks, but facilities are being created. To deal with such
    diseases, building medical and support capacity becomes important [7,8]. Among
    many support facilities, computation predictive tools are important as these provide
    a forecast to the emerging scenarios and enable people to visualize probable situations.
    Many researchers are attempting to develop techniques to obtain solutions for
    such situations and enable people to face such challenges [9,10]. Artificial intelligence
    (AI), including data science, is one of the key enabling techniques that are applied
    in such uncertain situations. Deep learning (DL), a part of AI, is a tool that
    can be configured to formulate prediction and forecast-based solution so that
    losses and fatalities could be minimized [11]. Due to deep architectural design
    and ability to perform feature extraction irrespective of data sources, DL models
    are the most reliable methods for dealing with medical datasets, particularly
    in pandemic conditions. Therefore, these techniques could also be applied and
    customized to handle this type of pandemic situation and help monitor social situation
    and observe biosafety norms, break the chain of spread, confirm the disease, drug
    discovery and appropriate use of vaccine, treatment, and many more [12,13]. AI
    tools are useful for the medical fraternity as these provide predictive analytics.
    The advantage of such systems is that these tools learn from the surroundings,
    retain the learning, and use it subsequently. To train such AI-driven techniques,
    huge datasets and robust computing resources are needed.


    For a pandemic situation to be analyzed by AI driven tools, insufficient data
    and variation in different geographic regions are impeding issues. They seriously
    influence the performance of AI-aided tools used commonly. Conventional AI tools
    like the ones based on DL require huge datasets which most of the time might not
    be available. Further, due to restrictions in mobility in the midst of pandemic
    situations, it might not be possible to collect sufficient amount of field or
    real-time data. In such situations, its conventional DL tools might prove to be
    ineffective. A solution to such a tricky situation comes from the use of deep
    transfer learning (DTL). It is an effective tool and works well despite limitations
    in data volume. DTL takes what it knows from one job and applies it to another
    after some fine-tuning [14]. In any pandemic scenario, EIDs such as the Internet
    of things (IoT), webcams, drones, intelligent medical equipment, robotic support
    are beneficial. Concerned organizations should use such facilities to deal with
    outbreaks because this equipment makes infrastructures sophisticated and automated
    [15]. As a result, computers are equipped with limited computational resources,
    which presents a number of challenges. Edge computing (EC) [16] is a method configured
    for real work situations including medical applications. EC is effective in monitoring,
    enabling knowledge update with contemporary data, ease of deployment, low cost,
    user-friendliness, and so on. Further, it can work together with AI tools to generate
    decision support. Conventional DL tools integrated to EC devices shall also'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'require huge volumes of data, which is a restriction. Therefore, in order to
    streamline restrictions due to lesser availability of data, DTL can be effectively
    employed with EC devices. This combination has been discovered to be a viable
    way to consolidate processing power and allow more systematic EC. Hence, in EDs
    that use DTL algorithm may be intelligent technique to formulate predictive analytics-based
    measures to face the devastating nature of COVID-19 pandemic [17]. Here we attempt
    to report several such issues and challenges with relevant technical backgrounds
    required to formulate methods for designing AI-driven infrastructure to deal with
    pandemic-like situations. Further, we also propose possible AI-based architecture
    as future scope to deploy DTL over EC to assists in efforts of mitigation of such
    outbreaks. In several countries, the concerned ministries of health have recommended
    several disease prevention measures for individuals, families, workplaces, schools,
    childcare centers, and senior citizens [18], many of which are based on AI techniques.
    These measures include following social distancing norms or increasing physical
    space between humans and their effective monitoring, autonomous robot for disinfectant
    spray, support to frontline workers, drug and food delivery, diagnosis, drug discovery
    and design.


    # 2.2 HISTORICAL BACKGROUND


    In Wuhan, Hubei Province, South China, the COVID-19 outbreak was first discovered.
    On December 31, 2019, local hospitals announced an unidentified pneumonia [19].
    This unidentified pneumonia has spread rapidly to almost all countries in the
    world. These cases were initially linked to the wholesale market, which specially
    deals with seafood in Huainan. This market is also famous for its wide range of
    live species. Each of these cases has its own set of clinical characteristics.
    Many of these cases have common symptoms that are similar to viral pneumonia,
    such as a dry cough, fever, dyspnea. The imaging findings of lung infiltrates
    indicated the seriousness of the new outbreak. On January 7, 2020, after examining
    samples acquired from a throat swab, the Centers for Disease Control and Prevention
    (CDC) diagnosed the mystery pneumonia as novel corona virus pneumonia (NCP) [20].
    It was eventually termed severe acute respiratory syndrome coronavirus 2 (SARS-CoV2)
    by the International Committee on Virus Taxonomy [21,22]. On February 11, 2020,
    the WHO called the disease COVID-19 [23]. The corona virus COVID-19 is produced
    by SARS-CoV-2. There are few indications that the number of contaminated and deceased
    patient will decrease, and the circumstances will remain volatile.


    # 2.3 TECHNICAL BACKGROUND


    Deep learning (DL), also called as hierarchical learning (HL) or deep structured
    learning (DSL), is a branch of AI that provides tools and methodologies to mimic
    the abilities of the human brain better than previously known approaches. DL is
    one of the most recent improvements that have been incorporated in the earlier
    generation artificial neural network (ANN) systems. Classical machine learning
    (ML) techniques had been used to make data inferences and predictions in the early
    1990s [24]. However, it has a number of disadvantages, such as relying on handcrafted
    features,'
  merge: -1
  img_proc: true
- pgno: 36
  md: '![](img/7bb239370082cb34554bae1e45e2b0d7_36_0.png)


    FIGURE 2.1 Proposed schematic diagram of DL-based COVID detection.


    data labeling, and being limited by human ability-centric accuracy. The handcrafted
    function isn''t required in DL [25]. With the aid of various innovative algorithms,
    computational power of modern computers, and the availability of large datasets,
    DL can make more accurate predictions and classifications.


    As already noted DL is a learning algorithm that falls under the AI umbrella,
    and it is based on ANN but in a much up-scaled level. The back propagation algorithm
    is used to train these models using the dataset [26]. It is a good optimizer tool
    for dealing with COVID-19. COVID-19 patients can be detected by checking body
    temperature (fever) and related symptoms. DL could be used for many other purposes
    such as patient care as well as detection of systematic social distancing observance
    and violation. Further, DL methods can be used to formulate robotic systems to
    handle pandemic-related crisis, provide support to patients, drug and food delivery,
    decontamination, drug design and discovery, identify and prevent spread of fake
    news, and create social awareness. The possibilities are enormous. The primary
    attributes of DL systems that are crucial in this case are their ability to replicate
    human behavior, provide prediction, and forecast (Figure 2.1).


    # 2.3.1 DEEP TRANSFER LEARNING


    After a model has been trained, transfer learning allows it to be employed on
    a new challenge. In comparison to traditional machine learning methods, a big
    training data collection is required for DL. As a result, the requirement for
    a large amount of labeled data is a major impediment to completing some critical
    domain-specific tasks, especially in the medical domain, where the development
    of large-scale, high-quality annotated medical data is a major challenge [27].
    Although scientists work tirelessly to find ways to reduce the risk and the effects
    of such constraints [28,29], the basic DL model needs a lot of computing power
    and the use of specialized hardware like GPU-enabled servers. DTL, a DL-based
    transfer learning [30], was used to provide a solution to this challenge. DTL
    greatly minimizes the need for training data and training time for a target domain-specific
    job by picking a pre-trained model (trained on another large dataset of the same
    target domain) for a fixed feature extractor or for further fine-tuning [31].
    It is now common in DL because it can train deep neural networks (DNN) with a
    small amount of data (Figure 2.2).


    # 2.3.2 EDGE DEVICES


    Edge or IoT devices capture and process data in real time by storing a copy of
    densely used data from the cloud locally and providing additional functionality
    to IoT devices. As a result, only the Fog server sends related data from IoT devices
    to the cloud.'
