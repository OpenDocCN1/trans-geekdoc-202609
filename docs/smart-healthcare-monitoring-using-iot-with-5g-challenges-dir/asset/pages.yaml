    and it is expected to be 80 years at the end of 2050, due to advancements in medical
    sciences and implementation of new technologies that are ultimately decreasing
    mortality and fertility rate and that lead to survival of individuals for longer
    periods of time. This in turn results in the more cases of dementia associated
    with a high risk for Alzheimer’s [80] (Figures 5.5 and 5.6).


