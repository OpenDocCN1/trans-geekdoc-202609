    not uncontrollable, and it would be the beginning to pass for a statement of the
    meaning of a pandemic [1].


    # 8.2 INTRODUCTION


    Coronaviruses are positive-sense RNA viruses that are enveloped and non-segmented
    and belong to Coronaviridae family, Nidovirales order. The highly contagious beta-coronavirus
    has the potential to cause COVID-19, named by WHO on February 11, 2020. The entire
    population is highly prone to this alarming disease; contact and respiratory droplets
    are the primary routes of transmission [3,4]. COVID-19 targets the epithelial
    cells of the alveoli of lungs by using receptor-mediated endocytosis like all
    other viruses via ACE2 (angiotensin-converting enzyme II) as an opening receptor.
    In the case of symptomatic patients, symptoms start appearing after not more than
    a week, including cough, fever, fatigue, nasal congestion, and other signs associated
    with the infection of the upper respiratory tract. The infection could progress
    to a severe state with dyspnea and pneumonia with severe chest pain, symptoms
    that could be seen by computer tomography which have been seen in case of 75%
    of infected individuals approximately. After second and third weeks in the case
    of symptomatic infection, pneumonia occurs mostly [5].


    # 8.3 REPLICATION AND PATHOGENESIS OF CORONAVIRUS


    In humans, cell receptor ACE is found in the lower respiratory tract. Also known
    as SARS-CoV cell receptor, it plays a role in the regulation of transmission among
    human beings or within cross-species [6,7]. After examining the isolated bronchoalveolar
    lavage fluid (BALF) taken from COVID-19 patients, it was confirmed that SARS-CoV-2
    uses the same cellular receptor for entry as SARS-CoV [8].'
