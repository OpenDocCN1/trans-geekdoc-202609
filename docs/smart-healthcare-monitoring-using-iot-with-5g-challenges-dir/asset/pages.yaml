    # 11.2 HEALTH MONITORING USING IOT AND MACHINE LEARNING


    IoT, AI, ML, and big data help physicians in finding the root cause of diseases
    in patients and also predict its seriousness using various technological tools
    and algorithms. IoT is a solution in reducing the burden on healthcare. Health
    monitoring system is a system useful to track health of a patient with the aid
    of sensors. It keeps track of the pulse rate of the patient, heart rate, pressure
    level rate, temperature, and so on. The system mechanically warns a user when
    the device senses any sudden changes in patient pulse or temperature and even
    displays description of patient temperature and heartbeat live on an internet
    [16].'
