  md: 'resource management. The benefits of IoT solutions include, among others, reduction
    of costs, increased productivity and safety of employees, better allocation of
    capital, and improvement in customer relations or management processes [32]. The
    IoT is also a challenge—it changes the mechanisms of competition, customer expectations,
    and the products themselves, and offers innovative functionalities, thus satisfying
    new consumer needs.


    Application of IoT technology is powerful and so far unlimited. Its solutions
    can be found both in the private sector in industries such as [33]:


    +   - Telecommunications and media.

    +   - Finances.

    +   - Logistics and production.

    +   - The retail trade.

    +   - Automotive.

    +   - Energy and media.

    +   - Agriculture.


    And in the public sector, healthcare management, and households.


    Based on the analysis of surveys and reports, scientists from IERC have published
    an extensive list of IoT applications, which confirms its strategic dimension
    among the technological trends in the coming years. The most important among them
    are [34]:


    +   1. **Smart Life**—Innovative, state-of-the-art technology aims to make life
    simpler and safer for consumers. Smart life includes management of:

    +      - Healthcare—A patient-centered and tailored business approach. Smart health
    covers a wide range of applications used in monitoring health conditions and physical
    activity (e.g., older people), vitality (e.g., people actively practicing sports),
    patient safety (both in hospital and at home). Thanks to the IoT, it is possible,
    for example, to control sleep (intelligent mattresses) or teeth (using smart brushes).
    Applications at the industrial level include monitoring of hygiene (e.g., informing
    about the need to wash hands in plants), the condition of goods (e.g., monitoring
    medical refrigerators) and safety (e.g., UV levels or radiation in nuclear power
    plants).

    +      - Banking—New banking and personal finance models.

    +      - Insurance—Moving from statistics to individual policies based on facts.

    +      - Public services—Improving efficiency and convenience for both administrations
    and managers and citizens.

    +   2. **Smart mobility**—Real-time route management and solutions to make travel
    more enjoyable and transport more reliable. Connecting vehicles to the Internet
    creates many new possibilities and applications that facilitate mobility and keep
    users safe. Smart Mobility includes:

    +      - Autonomous vehicle driving and all connected car services.

    +      - Mobility in the city—intelligent traffic management.

    +      - Intercity mobility—connecting communication systems.'
