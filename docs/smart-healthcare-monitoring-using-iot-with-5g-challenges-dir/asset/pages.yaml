    for physicians to handle, but they need such historical data to predict patient’s
    health, in which ML algorithm will be useful.


    Data mining techniques are used such as MLP, RF, DT, SVM, and KNN, and their efficiency
    is compared to confirm healthcare industry’s quality of service. Manual health
    related facilities are often unable to meet on time due to remote physical locations
    and thus causes significant life hazards. To support medical emergencies, real-time
    monitoring, early diagnosis and chronic disease, the main reason for using the
    IoT-based health care system is to use updated health care networks powered by
    wireless technology. In addition, IoT offers effective scheduling of scarce resources
