  md: '# 1 The Internet of Things in Healthcare Management: Potential Applications
    and Challenges


    P. Bajdor and M. Starostka-Patyk


    # CONTENTS


    +   1.1 Introduction...........................................................1

    +   1.2 Internet of Things in the Healthcare Management ............................2

    +   1.3 Internet of Things in Healthcare Management—Potential Applications ......6

    +   1.4 Challenges (Advantages and Barriers) ........................................12

    +   References...................................................................18


    # 1.1 INTRODUCTION


    The Internet of Things (IoT) concept has revolutionized the digital world. This
    idea was introduced and has been followed in many different areas. It has completely
    changed the way of many processes. The IoT’s applicability, scope, and diversity
    are endless and can permeate all aspects of everyday life [1]. One such application
    area is healthcare informatics of multidisciplinary characteristics, which uses
    information engineering in healthcare management. Traditionally, health information
    is derived from various sources, including a system that uses informatics solutions.
    However, the emergence of IoT meant that this information is often spread across
    various IoT devices. The use of the IoT concept is slowly becoming the norm in
    this area.


    Increasing spending on healthcare, demographic changes, especially the aging of
    societies, the threat of infectious diseases, and the increasingly multifaceted
    disease make innovation in healthcare provision a necessity. e-Health technologies
    are a promising innovative tool to tackle these problems [2]. Thanks to these
    technologies, it becomes possible to manage and monitor the health condition essential
    for the elderly constantly, and to monitor physical activity and patients’ safety
    at home and in healthcare institutions.


    The IoT will be conducive to better management of healthcare facilities and the
    improvement of communication between them. In 2005, the World Health Organization
    (WHO) recognized the potential of e-health in improving health'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'systems management and their safety and the quality and effectiveness [3].
    The WHO perceives the e-health as the use of information with the IT technologies
    for proper management of health [4]. A similar definition states that e-health
    covers all types of activities affecting the health sector. In detail this definition
    states that e-health includes tools that are or can be used by health authorities
    (administrations) and professionals (medical staff), as well as personalized (individual)
    healthcare services for patients and citizens [5]. e-Health refers to applying
    information and communication technologies to services, products, and management
    processes related to health. It also includes organizational changes in healthcare
    systems and their modern management. All this is done to improve citizens’ health
    and increase the efficiency and quality of healthcare services.


    The concept of e-health is therefore understood as, among other things, interactions
    between patients and suppliers of medical services, data transmission between
    healthcare providers, peer-to-peer communication, including communication with
    patients or healthcare professionals [6]. The term also includes the interactions
    and connectivity of health information; electronic health records—EHR; telemedicine
    services (providing health services at a distance using information and communication
    technologies, so-called online medical consultations); and personal, portable
    devices that, thanks to the possibility of communication with each other, regardless
    of the human being, can support prevention, diagnosis, treatment of disease, health
    monitoring, and even manage the patient’s lifestyle [5].


    The purpose of applying ICT in health management is to expand geographic access
    to healthcare services, improve data management, accelerate diagnosis and treatment,
    facilitate patient-to-doctor contact outside the office, and minimize fraud and
    abuse [7].


    IoT in healthcare applications has a lot of different requirements, mostly regarding
    the real-time recording of medical data, security and privacy of this data, and
    others, depending on the specific medical nature. Therefore, a good understanding
    of IoT’s basic applications in healthcare, opportunities, and threats is essential.


    # 1.2 INTERNET OF THINGS IN THE HEALTHCARE MANAGEMENT


    The healthcare IoT technology [8] ensures access to data associated with healthcare
    and analysis regarding the functioning of informatics and smart medical devices
    and networks of these [9]. It works based on the architectural structure base,
    because IoT depends on many interconnected devices, as mentioned in some literature
    [10], and the general architecture of IoT in healthcare is shown in Figure 1.1.
    These devices send data via the network, mainly the Internet, to the cloud, which
    health workers can access [11].


    IoT in healthcare management presents a whole range of essential benefits to health
    and people’s well-being, offering improved quality of life and reducing healthcare
    costs. The most substantial bare elements in this technology’s construction are
    wireless sensors used for remote monitoring of patients’ health status, together
    with communication systems and applications that send the necessary information
    about patients to their caregivers’ medical.'
  merge: -1
  img_proc: true
