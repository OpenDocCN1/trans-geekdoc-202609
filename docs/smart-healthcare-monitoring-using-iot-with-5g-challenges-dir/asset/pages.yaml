    # 7.3.1.1 ResNet Architecture


    Inspired by VGG-19, the architecture of ResNet uses a 34-layer plain network in
    addition to its so-called identity shortcut connection. The shortcut connections
    then transform the architecture into a residual network, as referred by [23].


    # 7.3.1.2 Using ResNet with Keras


    Keras is a neural network library designed in Python and is skilled in controlling
    over TensorFlow, Microsoft Cognitive Toolkit, R, Theano, or PlaidML [40] during
    implementation. The primary purpose behind Keras is to increase the execution
    time of deep neural networks. Keras applications include the following implementations
    of ResNet and provide ResNet V1 and ResNet V2 with 50, 101, or 152 layers.


    +   - ResNet50

    +   - ResNet101

    +   - ResNet152

    +   - ResNet50V2

    +   - ResNet101V2

    +   - ResNet152V2


    ResNetV2 is an updated version of the original ResNet V1 and uses batch normalization
    before each weight layer.


    There are various updated ResNet networks proposed, which may be referred from
    Xie et al. [44], Huang et al. [38], Huang et al. [45], and Srivastava et al. [46].
    With the recent advancement and efficiency of the ResNet algorithm, it is extensively
    used for COVID-19 detection with various Keras such as ResNet 18, ResNet 50, and
    ResNet 152, which is elaborated in the next section.


    # 7.4 REVIEW AND DISCUSSION


    The generalized representation for the COVID-19 diagnosis system is shown in Figure
    7.3 about the deep learning technique. The data collected from the COVID-suspected
    patients from the hospitals may be of various types, but for analysis purposes,
    X-ray and CT-scan images are mainly taken into consideration. The next step is
    data pre-processing, where the collected data of the patients are converted into
    an appropriate format by using operations like noise removal and resizing. Next,
    the data are partitioned using a cross-validation technique with segments of training,
    validation, and testing. The training data are then evaluated by a validation
    process followed by the test data. The primary step of diagnosis process is based
    on feature extraction, which is followed by the classification into class with
    the labels of COVID-positive and COVID-negative. Finally, the overall diagnosis
    setup is evaluated using parameters like accuracy, precision, and specificity
    sensitivity.'
