    The following statements have been selected on which the survey has been done:
    Mostly 60% of the people agreed with the statement that described about the mental
    illness related to lack of will power and self-confidence. About 60% admitted
    that mentally unhealthy people should live in a group at a separate place to avoid
    danger for healthy people. Nearly 46% of the respondents thought that they should
    maintain distance from the mentally depressed individual. About 41% agreed to
    the statement that they should sit with the mentally retarded people and talk
    to them. About 40% respondents did not imagine living with mentally ill individuals.
    Rest of 68% agreed to the statement that they should give proper care to the mentally
    ill people, while 57% were not afraid to work with the people who are mentally
    disturbed (Figure 5.4).


    # 5.21 POPULATION AGING IN INDIA


    Aging is associated with unavoidable and irreversible demographic transition.
    Due to advancements in medical science, including declining fertility rates and
    decrease in mortality rates, there is a spontaneous increase in the percentage
    of older population that give rise to more cases of dementia (age-related disease)
    [79].


    # 5.22 CHARACTERISTICS OF DEMENTIA


    Table 5.3 summarizes features that distinguish between normal aging, pre-dementia,
    and dementia.


