  md: 'machines to ‘learn’ from the data and making them more effective. Healthcare
    IoT systems include nano sensors attached to the patient’s body’s skin to monitor
    blood pressure, sugar levels, heartbeat, etc. This raw material is sent to the
    servers of the patient residing on the highly encrypted cloud network. Using advanced
    ML algorithms, the doctor may access raw data, prior prescriptions, etc., to prescribe
    new medications to patients in distant areas if appropriate. It is also possible
    to rescue people from life-threatening health problems such as sudden heart attacks,
    tumors, etc.


    The aging population needs immense medical assistance, in which the IoT-based
    health care system, along with ML, plays a crucial part in bridging the distance
    between patients and doctor. Hence, various ML techniques are discussed in this
    chapter with customized IoT data techniques for disease prediction that can be
    applied with greater precision to ML models of healthcare. Various models were
    described on the accurate prediction system for life threatening diseases such
    as heart diseases, Lung Cancer, Dementia, Arrhythmia and Brain Tumor using different
    datasets, and their experimental results are also discussed using various algorithms.
    IoT applications in healthcare have faced both advantages and obstacles along
    the way.


    For images affected by lung cancer, fuzzy rough set theory may be a potential
    work in this direction. It is also possible to add a Smart-Log with tracking tools
    to monitor user activities used for precise automatic diet prediction of adults.
    In case of arrhythmia disease, to enhance earlier detection and correct diagnosis
    of arrhythmic patients, certain other factors such as blood pressure should be
    controlled.


