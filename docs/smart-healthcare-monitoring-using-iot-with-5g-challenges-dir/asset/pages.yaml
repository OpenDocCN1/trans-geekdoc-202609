    # 7.6 CONCLUSION


    The COVID-19 continues to spread and mark its presence all over the world with
    evolutional new strains as time is progressing. In the present state, although
    most of the countries are equipped with vaccines, there is still no cure for the
    virus’s progression and effects. The effect of the virus is more dangerous because
    asymptomatic patients who do not show any symptoms spread the virus unknowingly.
    Therefore, the steeping in of the AI systems to at least detect and isolate the
    patients is of utmost importance. Various AI and IoT devices have provided promising'
