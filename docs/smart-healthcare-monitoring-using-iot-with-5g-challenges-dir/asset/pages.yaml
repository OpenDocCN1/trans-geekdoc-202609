    Few datasets are collected from Radiopaedia.org, which is an open-edit radiology
    resource, where cases are put together by radiologists and various health professionals
    across the globe [29]. A total of 59 samples of various sizes are collected from
    this source. The database with the highest number of samples (224,316) is obtained
    from the ChexPert database, consisting of 65,240 samples, which has'
