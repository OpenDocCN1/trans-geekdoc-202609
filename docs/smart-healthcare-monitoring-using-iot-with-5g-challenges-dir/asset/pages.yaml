    # 11.1 INTRODUCTION


    Artificial intelligence is so impactful in the field of healthcare as its purpose
    is to make systems more powerful in handling healthcare challenges, and by using
    different techniques, data can be interpreted, which is collected by diagnosing
    various chronic diseases like cancer, diabetes, Alzheimer’s disease, and cardiovascular
    diseases. It helps in improving clinical intervention, disease prediction, early
    detection, and disease progression. Machine learning (ML) techniques play a vital
    role in the healthcare sector, including the advancement of analytical model.
    These models can provide immediate benefit to clinical decision support system
    and healthcare service applications. To classify behavioral characteristics and
    health symptoms of the patient, these models examine the acquired data from different
    sources and sensor devices. ML and Internet of Things (IoT) have been widely used
    in healthcare.


    Here, we’ll discuss different ML algorithms that are useful in healthcare for
    the diagnosis and prediction of diseases, along with an importance of IoT in Healthcare.


    # 11.1.1 STUDY OF ML ALGORITHMS FOR DISEASE PREDICTION


    Today’s computing era is the era of the ML. ML is something in which a machine
    or system is able to learn from certain algorithms and make predictions on the
    basis'
