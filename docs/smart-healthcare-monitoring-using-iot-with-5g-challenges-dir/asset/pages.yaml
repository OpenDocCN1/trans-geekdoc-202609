    # 6.7.1.1 Mechanism of Action of Curcumin


    During AD, neuronal cells get degraded due to several different factors, including
    oxidative damage, high accumulation of beta amyloid or tau protein, metal toxicity,
    inflammation as shown in Figure 6.3 [43].


    # 6.7.2 AD TREATMENT: CURCUMIN ACT AS THE PLEIOTROPIC AGENT


    Considering several factors associated with etiology and various undefined mechanisms
    of AD, it is entirely sensible that different therapeutic drugs target only one
    particular factor that shows limited benefits (Figure 6.3). Therefore, now research
    is focused on the pleiotropic activity of various therapeutic agents in order
    to target several different affected processes as shown in Figure 6.4 [54,55].


