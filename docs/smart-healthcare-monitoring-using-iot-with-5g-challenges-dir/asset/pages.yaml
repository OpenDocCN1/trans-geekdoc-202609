  md: '# 12.2 ARTIFICIAL INTELLIGENCE IN COVID-19


    Artificial intelligence simply means to simulate human intelligence in machines
    such that these are programmed to think like human beings or mimic their actions.
    In recent days, digital technology has been very helpful in tackling various situations
    during the COVID-19 spread across the world. Taking into account the problems
    relating to the COVID-19 pandemic, AI can offer sophisticated solutions that are
    capable, together with modern technology, of managing the strength of human knowledge,
    intelligence, and creativity. The existing form of AI can be tried to identify
    a different pattern for COVID-19 databases, establishing some different machine
    learning and deep learning algorithms and techniques. It can deliver enough results
    in case one has enough data to test different systems with many approaches in
    a less amount of time [7].


    AI technique uses a CT scan methodology to detect viruses and is also helpful
    in assisting the medical professionals in identifying the components of the vaccine
    for the virus. It is also being used for creating medical chatbots so that people
    can take an assessment of their body, and one’s condition can be analyzed [9].
    One of the most important things to protect oneself from the virus is social distancing
    and sanitization. AI, through robots and drones, plays a very important role in
    this domain [4]. Authors [10] discussed the case of the manufacturing of masks
    by the charity and their problem faced in production. The authors further focused
    on the benefit of the blockchain and AI in the creation of the mask by charity
    and tracking, verifying the receiving of masks in hospitals by blockchain technique.


    # 12.2.1 Detecting COVID-19 from Chest Imaging Technique (X-Ray)


    In more critical cases of COVID-19, disease symptoms such as cough, cold, and
    faintness can also lead to pneumonia, organ failure, and even death. In people
    with COVID-19 pneumonia, respiratory problems spread faster in comparison with
    healthy people. The Chinese government released various new guidelines and recommendations
    for diagnosing and detecting COVID-19 through blood samples and reverse transcriptase
    or polymerase chain reaction (RT–PCR), a special indicator. The procedure of gene
    sequencing with RT–PCR takes a lot of time, and the individual should be admitted
    to the hospital immediately.


    Through the use of an automatic chest CT scanning system, people who have been
    tested positive with coronavirus and have developed pneumonia can be detected.
    Therefore immediate isolation and treatment should be considered in the department
    concerned. A critical person may suffer permanent lung damage even if he or she
    is not dead. According to the World Health Organization (WHO), COVID-19 creates
