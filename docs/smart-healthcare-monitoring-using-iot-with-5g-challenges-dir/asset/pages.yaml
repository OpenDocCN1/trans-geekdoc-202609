- pgno: 14
  md: 'The concept of IoT in healthcare management focuses on the concept of personal
    area networks (PAN), that is, a small network centered around a sensor connected
    to a machine or a human. PAN means a computer network connected to the devices
    that are used by the people [12]. A PAN network ensures data exchange between
    various computers, smartphones, tablets, etc. These networks are used to connect
    IT tools with a server gateway.


    The basic assumptions of the PAN for IoT in healthcare management are as follows
    [13]:


    +   - IT tools and people are equipped with sensors

    +   - IT tools report their status with the Internet connection

    +   - The established network is created when the need occurs and that is why
    it might be limited to some functions

    +   - While some IT tools might not have limitless power banks, their functions
    are possible to be cut off

    +   - The bordering power may cause the low bandwidth

    +   - It must be well secured as health data is fragile


    The range of applications present in healthcare IoT covers data collection using
    remote monitoring systems, which might be analyzed after the activity (e.g., sleep
    activity) and during their occurrence (e.g., heartbeat reports).


    IT tools such as Fitbit, Garmin, or Xiaomi Misfit, used for health reporting,
    analyze the persons’ health performance [14]. Because of some functionality limitations,
    most data of IT tools is exchanged with the use of LAN and/or WAN [15], which
    places high demands on the network. Also, IoT in healthcare management that evolves
    in real time in combination with a simultaneous development contributes to the
    different challenges [16]. They refer to some issues like security and privacy
    of data, efficient data maintaining and transferring, and large amounts of data
    management [17]. Such challenges and development of IT technologies connected
    to advanced sensors, mobile applications, artificial intelligence, big data, 3D
    printing, and mobility led to an increase in modern ways to support the medical
    business with the creation of new features of smart healthcare solutions [18].


    Requirements for the use of IoT in smart healthcare management are divided into
    two: functional and non-functional [19]. The functional specification refers to
    the details of smart healthcare architecture. A temperature reporting system is
    an example. Hence, functional requirements are specific to each component used
    in this healthcare system based on their application. Non-functional requirements
    seem not to be specific. Non-functional details relate to features of healthcare
    quality. In a broader perspective, non-functional healthcare specifications are
    broken down into functional and ethical details [20].


    There are many divisions of smart healthcare management systems, but here it is
    worth to mention how these specifications are broken down with regard to the software
    and hardware. The overarching criteria for an effective, intelligent healthcare
    management system are [21]:'
  merge: -1
  img_proc: true
- pgno: 15
  md: '+   - Energy

    +   - Possibilities of use in housing

    +   - Solidity of the system

    +   - Service assurance

    +   - Better perception by users

    +   - Better productivity

    +   - Possibilities for a broader exchange of information

    +   - Ease of use

    +   - The wide use of healthcare management tools that provide continuous support

    +   - System scalability for developing solutions

    +   - Wide inter-functioning


    Modern smart healthcare management systems are developed to provide fast medical
    help and care. Some higher sophisticated applications, with regard to these details
    [22], must possess environmental intelligence to improve service quality.


    It is possible to point out two critical aspects of IoT in healthcare management:
    services, such as devices to be worn on the body, and applications such as ECG
    or blood pressure monitoring [23]. Some examples of effective services and applications
    in IoT in healthcare management are mentioned in the literature [24], and Figure
    1.2 shows the primary services and applications examples in an IoT in healthcare.


    When analyzing the figure, you can notice that the services are used to create
    IoT in healthcare applications, while the applications are used directly by patients.
    In addition to their usefulness in supervising and managing the everyday health
    and well-being, the IoT devices in healthcare were designed to use with chronic
    diseases and their prevention, life and intervention remote assistants, improved
    management of drugs and healthcare, and prevention of disease in remote sites
    [25].


    Now, there are various wearable devices available for people, such as activity
    monitors, automatic external defibrillators, blood pressure monitors, glucometers,
    fall sensors, fitness and heart rate monitors, multi-parameter monitors, programmable
    syringe pumps, pulse oximeters, smart pill dispensers, smartwatches, and the


    ![](img/7bb239370082cb34554bae1e45e2b0d7_15_0.png)


    FIGURE 1.2 Primary services and applications examples in an IoT in healthcare.'
  merge: -1
  img_proc: true
