  md: '# 6.1 INTRODUCTION


    Demographic aging is a complex phenomenon that is associated with changes occurring
    in normal functions with relation to the longer period of time that results in
    the deficit in the cognitive functions and other brain-related activities [1,2].
    Deleterious deterioration in the normal biological functioning leads to several
    problems, including memory loss, language problem, difficulty in learning and
    calculating [3]. These all are the identifiable symptoms that are specifically
    related to Alzheimer’s disease (AD). This disease is worsening because it affects
    the individual’s behaviours so badly [2]. Nowadays, approximately 10 million new
    cases are there every year due to AD and dementia, which are growing issues related
    to a number of health problems [2]. Regular increase in the older population size
    leads to a higher risk of Alzheimer’s. Many research studies are going on to find
    a cure for that disease, but there is no effective therapy to properly treat the
    disease as the mechanism behind AD is not explored yet. The focus of the studies
    is just trying to control behavioral changes [3]. Thus, a number of research studies
    are focusing on finding out the potentially risk factors that directly link to
    the disease. Diet or nutrient concentration plays a crucial role in order to maintain
    normal functions of the body. For the regularity of systemic functions, nutrients
    act as a potent factor that helps in the regulation of different biological activities.
    Researchers are trying to identify the relationship between neurodegenerative
    diseases like AD and nutrients. In fact, the involvement of nutrients can be seen
    in a number of biochemical activities as they act as an energy source [4]. Due
    to this reason, modification in diet leads to various problems that affect central
    nervous system. This in turn leads to the excessive production of beta amyloid
    protein in the brain that causes neurodegeneration. From different studies, the
    relation has been found between cholesterol and apolipoprotein [4].


    Researchers have found that the harmful effects occur due to nutrition deficiency
    on this neurodegenerative disease that causes various health problems like obesity
    and malnutrition. According to certain studies, the effects of malnutrition have
    been observed in AD. After macro-specific and micro-specific studies on AD, researchers
    agree that nutrients or anti-oxidants deficiency may lead to the neurodegenerative
    disease [5]. Continuous weight loss and depletion in muscles result in the progression
    of neurodegeneration [6]. In addition, obesity has been identified as one of the
    common determinant factors for the progression of Alzheimer [5]. A case study
    had been conducted on 6,853 people and presented the data that shows these individuals
    had a large waist, and had a higher chance of developing this disorder than those
    who had a normal waist [7]. Another cohort study has demonstrated that a higher
    risk of dementia has been observed in those individuals who were obese under the
    age of 30–39, and it steadily decreased with a decreased in obesity [7].


    Moreover, certain nutrients and vitamins have been found to play some role during
    disease progression. The nutrient deficiency shows a huge impact on AD that has
    been estimated from a number of different studies. The deficiency of vitamins
    B, C, and E results in the higher AD risk [5]. However, different reviews related
    to this topic have demonstrated that the consumption of a single vitamin does
    not show any noticeable protective effects, but that a combination of different
    vitamins or'
