- pgno: 257
  md: '# 13 A Review of Artificial Intelligence Applications for COVID-19 Contact
    Tracing


    Thein Oak Kyaw Zaw, Mani Sehgar, Saravanan Muthaiyah, and Low Jing Hong


    # CONTENTS


    +   13.1 Introduction..............................................................247

    +   13.2 Classifying Contact Tracing Segments........................................248

    +   13.3 Aims of Each Segment ......................................................249

    +   13.4 Applications of AI in the Contact Tracing Segments............................252

    +   13.5 Conclusion ...............................................................257

    +   References...................................................................257


    # 13.1 INTRODUCTION


    COVID-19 pandemic that has spread around the globe has ushered countries to make
    contact tracing to be one of the key components in combating the virus as lockdown
    measures were lifted gradually [1]. As the name suggests, “contact tracing” is
    the process of identifying, assessing, and managing people who have been exposed
    to a disease to prevent onward transmission [2]. This means that contact tracing
    in the scope of COVID-19 can be broken down into three separate segments: (1)
    identification of the close contact (case detection), (2) severity assessment,
    and (3) managing (people and assets). Contact tracing is crucial because COVID-19
    is a highly infectious virus that has proliferated to more than 7,145,800 people,
    with 407,067 deaths by June 9, 2020, since its first emergence in the end of 2019
    [3]. Currently, only few countries have achieved to keep the pandemic under control
    with contact tracing solutions [4]. This reality indicates that there is much
    needed work to be exerted to make the solutions efficient and comprehensive, as
    many countries, if not most, are not able to do so. In the early stage of the
    pandemic, contact tracing was mainly conducted manually through interviews, and
    it highly demands human resources [5]. With the number of cases rising every day,
    resources that interview method requires increase tremendously up to a point that
    contact tracing are being delayed and becoming inefficient. Thus, countries started
    to adopt smart digital solutions wherein they utilize'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'technology such as Internet of Things (IoT) and artificial intelligence (AI)
    in making the solutions to be fast and effective [6].


    Apart from that, recent studies have pointed out that machine learning and AI
    are the promising technologies that have been adopted by various healthcare providers
    since they offer bigger upscaling, higher processing power, and reliability, which
    resulted in better performance than the professionals for specific areas [7].


    The same scenario has also been happening for COVID-19, where AI has been used
    in tackling the pandemic in many aspects. However, the majority of AI applications
    in contact tracing for COVID-19 have been used in the identification of close
    contacts (case detection) as well as severity assessment and lack in managing
    people and assets. This gap can be due to the understanding of the institutions
    that contact tracing is limited to only case identification. This is a crucial
    problem because many of the countries have seen a sharp rise in the number of
    daily cases, and the healthcare workforce is getting overwhelmed as the ratio
    of patient to front liners is getting substantial [8]. Thus, the healthcare providers
    need a solution to manage them (the patients, front liners, and medical assets)
    effectively so that the whole healthcare system will not collapse. In this point
    of view, the AI is found to be lacking heavily, and this study attempts to expose
    the gap while explicitly stating in-depth the specific areas that are lacking
    for the management (people and asset) segment. Not just that, this study will
    also review on the current application of contact tracing with AI in combating
    human-to-human COVID-19 infection in three separate segments accordingly that
    none in the literature world has done before.


    # 13.2 CLASSIFYING CONTACT TRACING SEGMENTS


    As stated by the World Health Organization [2], contact tracing (with regard to
    COVID-19) means the process of identifying, assessing, and managing people who
    have been exposed to a disease to prevent further transmission. From the statement,
    contact tracing can be separated into three segments: (1) identification of close
    contacts (case detection), (2) severity assessment, and (3) managing (people and
    assets). General understanding on contact tracing mainly revolves only around
    the first two segments, while overlooking the third one, making the solutions
    for it to be small in number. This, in return, creates many delays and constraints
    to provide healthcare services when the number of daily cases is at large. The
    moment the number of front liners is being overwhelmed by the number of cases,
    the healthcare efficiency in conducting the three segment activities drops significantly.
    Thus, solutions that can provide closure for managing (people and assets) are
    critical as they can help in lowering down the workload and strain of the front
    liners and the overall healthcare system. The first one, which is identification
    of close contacts (case detection) basically means diagnosing individuals who
    have been infected from a patient irrespective of whether the patient is symptomatic
    or asymptomatic.


    With many solutions available in this segment, many of the countries, if not most,
    have been utilizing mobile phones with bluetooth technology for it [9]. Severity
    assessment means the ability to determine the severity of the infected patients.
    Not limited to that scope, it also encompasses projecting the severity at the
    locations of the outbreak and of the groups of the infected. Last but not least
    is the'
  merge: -1
  img_proc: true
