  md: '# TABLE 1.2

    Examples of IoT in healthcare capabilities used


    | Healthcare Areas of IoT Connections | Examples of Capabilities Used |

    |---|---|

    | *Urgent and emergency care* | - Telecare service to triage alarm calls to the
    most appropriate responders to reduce emergency service activity.

    - Teleconsultation between community, ambulance service, and acute care.

    - Telehealth monitoring of patients not transported to hospital.

    - Telehealth for pre-operative assessment. |

    | *Hospital acute elective* | - Text and email appointment reminders.

    - Telehealth for pre- and post-operative assessment and telecoaching to maintain
    pre-operative behaviors.

    - Telecare/telehealth to support earlier discharge. |

    | *GP practice* | - Self-monitoring kiosks in practices for routine assessments.

    - Telehealth to assist with self-care and triaging assess to primary care.

    - Teleconsultation for those hard to reach or having mobility issues.

    - Telemedicine with specialists to prevent unnecessary outpatients.

    - Telecare for carer support, medication management, falls/ dementia. |

    | *Care home* | - Education and training apps and web portals to support staff.

    - Telehealth for care homes including teleconsultations between care home, primary
