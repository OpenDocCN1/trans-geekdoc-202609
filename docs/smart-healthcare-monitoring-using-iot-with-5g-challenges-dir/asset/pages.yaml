  img_proc: true
- pgno: 117
  md: 'multivitamins may enhance the action to generate protective effects toward
    that disease [8]. These vitamins are the natural antioxidants that exhibit potential
    to diminish oxidative stress by scavenging free radicals and decrease beta amyloid
    proteins that are the basic disease-causing factor in AD and aging [5]. Moreover,
    these effects might be noticed during the consumption of multivitamins [8].


    Phytochemicals are chemical compounds extracted from plant sources and have antioxidant
    properties. Several different studies have been conducted in order to find how
    antioxidants or polyphenols help in the reduction of beta amyloid content by lowering
    the oxidative stress particularly in AD patients [5]. A study conducted by Hartman
    showed that when a mice was supplemented with pomegranates that contains polyphenols,
    it showed a 50% reduction in developing AD than the normal mice which was kept
    as a control [9]. A research study on transgenic mouse done by Kim showed that
    a transgenic mouse that was treated with resveratrol, a polyphenol extracted from
    grapes, showed a decrease in the process of neurodegeneration and memory loss
    [10].


    The study is focused on the beneficial potent role of various different phytochemicals
    in AD. For this, the data was collected from different sources that show the association
    between polyphenols and AD. The aim of this review article is to answer this particular
    question, ‘How phytochemicals or polyphenols act as a potent therapeutic approach
    for the treatment of AD?’


    # 6.2 ALZHEIMER’S DISEASE


    AD affects the central nervous system and is characterized by the destruction
    of neurons, beta amyloid accumulation, presence of tau fibrils, and excess production
    of endogenous proteins that settle down as soluble and insoluble aggregates in
    brain especially in the hippocampus area [11–19]. Certain studies have found that
    the insoluble form of protein is inert whereas soluble aggregates are toxic forms
    having a potential to cause disease [20–25]. It is assumed that tau proteins,
    beta amyloid protein, and other oligomer have beta sheet conformation that play
    a role in pathogenicity [24–30]. Individuals suffering from AD has an average
    life of 8 years after diagnosis and this may go up to 20 years depending on the
    individual’s health status [31].


    # 6.3 SYMPTOMS


    Typically, AD is distinguished into three stages that vary according to the severity
    of disease and health status of individuals before being affected with AD [2,3].
    Early symptoms of AD are short-term loss of memory and thus result in difficulty
    to remember latest events or updates, meaning normal forgetfulness. For instance,
    the central AD stage usually includes symptoms like facing problems in communication,
    help is needed, proper care is required, forget name of the family members. In
    late-onset disease, people experience a lot of problems that totally disrupt their
    daily activities that include difficulty recognizing face of their own family
    members, forgetting their own homes and feeling lost escalated behavior, difficulty
    walking [2,31].'
