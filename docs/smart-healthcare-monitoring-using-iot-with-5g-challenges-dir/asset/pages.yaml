    # 1.4 CHALLENGES (ADVANTAGES AND BARRIERS)


    The development of modern technologies is rapid and covers all spheres of everyday
    life. The bases for this development are research and forecasts of the demand
    for new devices and systems in individual areas of life and economy based on them.
    One of the dynamically developing sectors in recent years is healthcare. Therefore,
    technological development is also moving in this direction, creating more and
    more new challenges. The evolution of digital health technologies is presented
    in Figure 1.4, in the form of Hype Cycle [56].


    The Allied Market Research reports [57] that the global IoT healthcare market
    will reach $136.8 billion in 2021. More than 3.7 million medical devices are already
    in use. The development of the healthcare sector in the field of IoT is evidenced
    by the fact that 60% of healthcare organizations have the IoT. Almost 87% of healthcare
    providers introduced the IoT services offered in the area, about 40% of the organizations
    of healthcare in the living biosensors use IoT. About 80% of organizations in
    the area of healthcare have reported an increase in innovation by implementing
    IoT, 73% of medical providers were able to reduce costs through the use of IoT.
    Market segment for smart tablets reached $6.93 billion by 2020. The


    ![](img/7bb239370082cb34554bae1e45e2b0d7_22_0.png)


    FIGURE 1.4 Evolution of digital health technologies—the Hype Cycle.'
