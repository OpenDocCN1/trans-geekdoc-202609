  md: '# TABLE 1.4


    # Advantages and barriers of IoT in healthcare


    +   - Facilitating access to healthcare

    +   - Increase in the quality of healthcare

    +   - Increase in the quality of life of patients

    +   - Increase in the safety of patients and doctors

    +   - Time savings for healthcare professionals (including doctors and nurses)
    and a response to staff shortages

    +   - Cost reduction

    +   - Modernizing and improving the efficiency of healthcare delivery (by enabling
    faster information flow and helping to transform healthcare systems from a piecemeal
    approach that includes prevention, primary care, treatment, and rehabilitation
    separately, to continuous care where all stages of treatment are closely intertwined
    (linked))

    +   - Improving and increasing the security of transmitting data on patients and
    their health condition

    +   - Accelerating the progress of medicine by facilitating the conduct of clinical
    trials


    +   - Lack of awareness and trust in e-health solutions among patients, citizens,
    and healthcare workers

    +   - Lack of interoperability between e-health systems

    +   - Limited or even lack of evidence describing on a large scale the profitability
    of using e-health tools and services

    +   - Legal uncertainty for the use of mobile health and wellness monitoring applications
    as well as a lack of transparency regarding the use of data collected by such
    applications

    +   - Lack of sufficient or fragmented legal framework, including no reimbursement
    system for e-health users

    +   - The necessity to incur high costs related to the creation and use of e-health
    systems

    +   - Regional differences in access to ICT services, including limited access
    to these services in specific areas

    +   - Strong fragmentation of the healthcare services market


    Thanks to its application, it is possible to notice a number of measurable benefits.
    Doctors will reduce time spent on documentation by 60%, will have more time for
    direct patient contact by about 29%, and will consult additional patients. For
    hospitals, the benefits are reflected in a 35% reduction in hospitalizations,
    a 53% reduction in emergency room interventions, and a 59% reduction in hospital
    bed days. While the benefits seen by social policy include improving the implementation
    of the strategy for the senior care, improving the efficiency of healthcare services,
    devising more attractive and innovative medical care policies, and enhancing the
    attractiveness of places of residence for dependent persons, the disabled, senior
    citizens, who require constant monitoring. SiDLY telecare wristbands allow seniors,
    people living alone, and people requiring support in everyday life to stay at
    home [73].


    2. In addition to the above case, another problem experienced in Poland is 40,000
    cardiac arrests per year. Among people who experience sudden cardiac arrest (SCA)
    in Poland, only 7% survive, while in the Scandinavian countries, this ratio is
    40% (data from the European Resuscitation Council).


    The remedy to this problem may be the use of the REANIMATOR application. It is
    an application that makes it easier to help a person with sudden cardiac arrest
    (SCA). It consists of two main modules: 1. automated external'
