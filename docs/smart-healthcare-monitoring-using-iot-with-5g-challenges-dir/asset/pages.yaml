    # 12.5 COVID-19 IMPACTS AND PROPOSED SOLUTIONS


    Many countries are affected because of this coronavirus. It has a global impact.
    Many solutions are proposed by the government to stop future cases of COVID-19,
    and medical organizations have been intimated to implement these solutions. Let’s
    take a look at the worldwide impact of COVID-19 and measures taken to reduce further
    transmission.


    # 12.5.1 Worldwide Impacts of COVID-19


    The COVID-19 has a global effect, which influences the different sectors like
    economy and environment. Almost everything got affected due to this pandemic.
    Some of its implications are discussed in detail here.


    # 12.5.1.1 Impact on the Economy


    The most impact of this virus has been on the economy. Many countries have enforced
    a full lockdown to obstruct more spread of this disease. All domestics, as well
    as international flights, are cancelled or suspended. Train services have also
    been stopped. Apart from this, many sectors like tourism and cinema have also
    come to a standstill. Lockdown leads to the economic recession in many countries.
    Many private companies have fired half of their employees, and few of them are
    not getting a full salary due to this lockdown. Some of the powerful countries
    are facing high inflation and unemployment rate, and due to this, they are unable
    to provide the best quality service to their people in this crucial time [28].
    According to a recent OECD research, 44% of families had at least one person whose
    employment has been affected by the crisis, such as job loss, layoff, retention
    scheme, decreased working hours, unpaid leave, or resignation [29].


    # 12.5.1.2 Impact on the Environment


    It is rightly said that “God’s stick does not make noise.” We, humans, have damaged
    the environment a lot. We only harm nature for our benefits. Environmental concerns
    include pollution, global warming, climate change, soil erosion, and change in
    the ecosystem who became the victim of increasing demands of humans [30,31]. Perhaps
    COVID-19 is the reason where all the human activities are stopped, and nature
    is healing on its own. Figure 12.7 depicts the commendable improvement in the
    air pollution level in China. Today, when everyone is in their home, the pollution
    level decreases drastically. The quality of seawater and the other water bodies
    has also improved. People have started respecting nature, and they understood
    the importance of plants and animals to maintain the balance of this nature.


    # 12.5.1.3 Impact on the Society


    This virus has had a positive impact on society. Family bonding is getting stronger.
    Now, families are spending quality time with each other. People are focused on'
  merge: -1
  img_proc: true
