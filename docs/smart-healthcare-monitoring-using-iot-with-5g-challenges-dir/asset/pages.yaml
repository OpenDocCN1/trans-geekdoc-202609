  md: 'handy injectors [1,3,26]. The IoMT application domain can include chronic disease
    (CD), health condition management (HCM), home medical care (HMH), hospital monitoring
    (HM), human activity recognition (HAR), medical nursing (MN), patient physiology
    (PPC), patient wear IoMT devices, pediatric and senior care (PEC), remote patient
    monitoring (RPM), concurrent reporting and monitoring (CRM), and patient drug
    tracking (TPM) [27].


    In addition to these fields of application, remote telemedicine monitoring consulting
    (TMRC) stands for a modern way of medical services based on the historical data
    and current reports exchanged between parties through Internet communication to
    improve patients’ healthcare [28]. The definition of telemedicine is strongly
    tied up with the telehealth (remote healthcare) [29]. In medical practice many
    of the applications use telemedicine. Based on the studies [14] that analyze the
    market of IT tools in medicine it is predicted that it will grow from $14.9 billion
    in 2017 to $52.2 billion in 2022. Currently, there are more than 500,000 different
    types of medical devices, including wearable external medical devices, implanted
    medical devices, and stationary medical devices.


    Thanks to the use of telemedicine, patients’ lives can be better. Telemonitoring
    services can improve the quality of life of chronically ill patients and reduce
    the need for hospitalization. Teleconsultation and teleradiology can reduce queues,
    optimize resource utilization, and increase efficiency [30]. It is estimated that
    the possibility of providing remote care for patients staying in their own homes,
    using telecommunications networks, will increase the survival rate by 15%, and
    decrease the length of hospitalization by 26%. On the contrary, the cost of nursing
    care can be reduced by around 10%. The introduction of e-prescriptions may reduce
    medical errors by 15%, resulting in inadequate dosing of the drug. Despite the
    aging of the EU countries’ population, e-health services can keep treatment costs
    similar [31].


    Technology IoT in healthcare management has now become an integral part of the
    same products, and—turning them into computers—provide four areas of benefits
    [32]. The benefits of using intelligent products in IoT in healthcare management
    are presented in Table 1.1.


    According to the European Commission, by using the advantages of new technologies,
    e-health can solve healthcare problems. The use of information and communication
    technologies in health and medical care systems, which will allow the provision
    of electronic medical services, can improve their quality. It will also increase
    their efficiency and management, increase and improve citizens’ quality of life,
    and open medical markets to innovation [33]. The quality of life for people with
    disabilities or chronic diseases will be promoted. The digital agenda’s goal was
    to ensure by 2015 the safe access to health data to facilitate the treatment from
    anywhere in the EU [34]. Failure to achieve this goal does not mean that there
    is no need to create such an option in the future.


    # 1.3 INTERNET OF THINGS IN HEALTHCARE MANAGEMENT—POTENTIAL APPLICATIONS


    The foremost step toward an intelligent healthcare system is to use the potential
    of existing technologies to deliver the best services to users and make their
    lives better.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# TABLE 1.1


    # Benefits of using intelligent products in IoT in healthcare management


    | Area | Benefits |

    |------|----------|

    | *MONITORING*—the product can inform about its condition or external conditions.
    | • Knowledge about the condition of the product

    • Information about the external environment

    • Product performance data

    • Product function check

    • User learning |

    | *CONTROL*—the product can be monitored through commands sent to it, or the user
    can learn by himself or herself using algorithms built into it. |  |

    | *OPTIMIZATION*—an intelligent product based on algorithms collecting data in
    real time and comparing it with historical data, increase its efficiency, and
    conduct diagnostics. | • Increasing product performance

    • Prognostics, diagnostics, repair, and service |

    | *AUTONOMY*—the product can recognize needs by itself, connect with other objects,
    and even repair itself. | • Self-performance enhancement

    • Self-connection with other devices or systems

    • Auto-diagnosis and auto-repair |


    IoT is a technology supporting healthcare management, which can help in professional
    medicine in almost every area where a clinical decision is made [22]. By using
    IoT utilizing different techniques, computers can learn to make accurate decisions
    based on health professionals and patients’ data and generate appropriately selected
    feedback.


    IoT devices powered by artificial intelligence can operate continuously and monitor
    people’s health. Intelligent robots, intelligent houses, and virtual assistants
    can provide the necessary support to the elderly and people with disabilities
    [35]. The use of the IoT in healthcare management can improve the quality of life,
    especially for the elderly. It is possible to install sensors in the house to
    monitor the daily life of the residents. In the event of inactivity, the needy
    people may be informed of the situation [36]. Such a solution is highly desirable
    in aging societies. IoT in healthcare might be used to connect staff with patients
    and support them [37], and examples of IOT capabilities used are summarized in
    Table 1.2.


    Thanks to the technology of the patient’s health’s wireless monitoring system,
    it is possible to do preliminary, remote diagnosis at home. From the point of
    view of the healthcare system’s operation, it is an economic system for providing
    health services. Nowadays, it is possible to collect medical data by the sensor
    placed, for example, in the watch, adhered to the body surface or through the
    implanted chip [38]. Thanks to using a wireless, remote system for monitoring
    the patient’s vital signs, using medical measuring equipment, and data transmission
    via the Internet (audio or video), the collected data is transferred to the doctor.
    The vital signs monitored include blood pressure, heart rate, oxygen saturation,
    body temperature, expiratory capacity (lung capacity), and blood glucose levels.
    The use of such an application, effectively'
