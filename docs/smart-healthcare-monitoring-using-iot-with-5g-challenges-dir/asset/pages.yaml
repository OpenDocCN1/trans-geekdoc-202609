- pgno: 28
  md: 'defibrillator (AED) locator, which will pinpoint the AED localization, and
    show the shortest way to find it, and 2. ‘virtual assistant’ that assists the
    entire situation. This IoT tool may also help in survival, which includes diagnosis
    of cardiac arrest, calling for professional help, early defibrillation, medical
    rescue operations conducted by professionals.


    The benefits of using this solution include an increase in the survival rate of
    people with SCA, thus reducing financial losses and deaths of working-age people.
    The savings might be even at around PLN 400,000. Improving the survival rate by
    1% means PLN 160,000,000 of savings [73].


    The presented problems and solutions together with the benefits are only two examples
    illustrating how many benefits can be brought by the appropriate application of
    IoT in healthcare management.


