  md: 'of it. ML algorithms are implemented everywhere. Its implementation is popular
    in so many applications. In online customer support, recommendation system, self-driving
    car, etc., ML algorithms are widely used [1,2].


    One such implementation of ML is in the field of healthcare, where it is useful
    in disease prediction and diagnosis that helps doctors for easier and better diagnosis
    of diseases. Most common three ML algorithms are:


    +   i. Supervised Learning (Train Me)

    +   ii. Unsupervised Learning (I''m self-sufficient in Learning)

    +   iii. Reinforcement Learning (My life My rules, Hit and Trial)


    Some of the commonly used Supervised ML techniques [3], which are useful for the
    prediction and diagnosis of diseases are mentioned below:


    +   a. **Decision Tree**—It is a tree-like representation of decisions and all
    their possible solutions based on certain conditions. It is a type of classification
    which is helpful for physicians as well as doctors in diagnosing patients with
    higher risk of particular diseases. Earlier disease prediction is possible with
    the help of decision trees.

    +   b. **Logistic Regression**—It is a supervised classification method based
    on linear regression [4]. It is known as regression but not logistic classifier
    because logistic regression uses linear models. This model can be used for binary
    classification as well as for multi-class classification problem. This model is
    useful to find a certain class of an independent variable; it can also find the
    possibility that a new instance belongs to or does not belongs to a new class
    by using an outcome that lies in range zero and one. Hence, to use the model for
    binary classification, and to make predictions, threshold the classifier output
    to 0.5. If the hypothesis returns a value >= 0.5, it is classified as “1,” otherwise
    as “0.” In healthcare, LR model helps in finding whether the tumor is malignant
    or not.

    +   c. **Support Vector Machine**—It is capable of performing outlier detection,
    regression and classification. Support Vector Machine is a discriminative classifier
    that is formally designed by a separative hyperplane. It can classify linear as
    well as non-linear data. It works by first mapping every data item into an n-dimensional
    feature space where n is the number of features, and then identifies the hyperplane
    that separates the data items into two classes while maximizing the marginal distance
    for both classes and minimizing the classification errors [5]. To perform the
    classification, we then need to find the hyperplane that differentiates the two
    classes by the maximum margin.

    +   d. **Random Forest**—It is a collection or ensemble of DTs [6], where decision
    trees are build using the whole dataset by considering all features but RF only
    a fraction of rows are selected randomly and particular number of features also
    selected at random for training. In this way, DTs are grown and each DT will result
    in a final outcome and RF will just compile the result of DTs to bring the final
    result. In RF, the use of multiple trees reduces the risk of over-fitting along
    with less time required in training. Its main advantage is that'
