  md: 'a patient’s symptoms [46]. IoT in healthcare management promises to develop
    practical solutions for healthcare services, enabling temperature monitoring as
    it is an essential parameter of the body to monitor body temperature [47].


    It is also necessary to ensure that the physician is able to analyze such a vast
    set of data. A program that detects only abnormal behavior of the patient (no
    medication) or the state of his or her health that requires intervention may be
    helpful here. Besides, the medical recorder’s sensors can monitor the patient’s
    condition and his or her body’s response to a given dose of the drug. Therefore,
    the doctor has the opportunity to analyze the correlation between the dose of
    the drug taken by the patient and his or her heart rate, breathing, and level
    of physical activity. After each data collection, thanks to mobile phones or computers’
    communication capabilities, they are placed on the server, which allows the doctor
    to study them. Using such technology, the patient may be instructed to change
    the drug or its dosage [48].


    Another attempt at medical diagnostics using modern technologies involves the
    implantation of a programmable-bio-nano-chip that can detect heart disease or
    tumor markers from a sample of the patient’s saliva. The implementation of such
    a chip in the patient’s body could provide an early notification system for these
    diseases long before they discover any symptoms [49]. However, in order for society
    to be able to adopt all of the above amenities in the medical services sector,
    it is necessary to solve the problems related to the protection of the privacy
    of people using them. This type of service provider must clearly state the purpose,
    frequency, and type of detailed personal information that will be tracked and
    the circle of entities that have access to this data. Secure transmission of sensitive
    data between the end user and the service provider must be ensured [50].


    When it comes to caring for the elderly, it should be noted that safely supporting
    older people’s independent lives in their place of residence can increase their
    self-confidence, ensure better autonomy, and provide them with real help. This
    is the primary goal of ambient assisted living (AAL), an AI-based IoT platform
    that uses information and communication technologies to achieve this goal. Recognizing
    activity and understanding behavior are desirable outcomes of using various AAL
    sensors [51]. It might be done directly with the help of wearable sensors or indirectly
    with environmental sensors and flux analysis. For example, by tracking a patient’s
    medications, it is possible to track patient consumption.


    Virtually everyone can use the IoT in healthcare stages of treatment. It is used
    in the prevention and diagnosis of disease, observation of patients, as well as
    at the stage of treatment, including hospital stay. Some hospitals are already
    part of the IoT. Many of the IoT devices are imperceptible to patients. Hospitals
    have, among others, devices that, after entering the appropriate parameters, enable
    communication with each other [52]. After examining the patient’s vital signs,
    they automatically adjust the appropriate doses of drugs and their administration
    frequency. Another example is endoscopic examinations that do not require the
    presence of a doctor. The patient swallows a tablet equipped with a camera that
    takes 36 shots/s, showing an image of the gastrointestinal tract. It is a less
    stressful and more comfortable test method for the patient [53]. Thanks to the
    use of intelligent refrigerators, the condition of medical supplies can be monitored
    in real time [54].'
