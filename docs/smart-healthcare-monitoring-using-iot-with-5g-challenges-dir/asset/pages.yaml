- pgno: 76
  md: '# 4.3 **THE ARCHITECTURE OF THE IOT**


    The critical element of the IoT is the global Internet network as an open communication
    channel. This is not without reason, because the last decades of the development
    of the Internet network have allowed for the creation and launch of entirely new
    services and functionalities of the Internet, which at the same time directly
    translates into the development of individual sectors of the economy.


    Using the IoT requires a change in the approach to building and applying mathematical
    models. IoT means that it is necessary to depart from the existing practices,
    where the predictive model was built based on the collected data and then used
    operationally as long as it maintained the required quality parameters. In the
    world of permanently communicating devices, where the stream of data available
    for analysis is vast and changes dynamically, the use of the classic approach
    will not give a sufficient opportunity to discount its hidden values [25]. Effective
    models must be built on data whose storage is economically unjustified. Their
    quick update has become a necessity, and analytical-supported decisions should
    be made immediately. Thus, the architecture of the tools that make up the IoT
    solutions, in the simplest terms, is based on:


    +   - Objects that can communicate or receive commands or transmit information,
    that is, objects equipped with sensors, sensors (temperature, vibration, humidity,
    motion, etc.) and transmitters enabling communication, receiving commands, and
    collecting and transmitting information.

    +   - Teleinformatic network mediating in dialogue, that is, infrastructure that
    enables communication, that is, data transfer between objects (examples and the
    most popular solutions include WiFi, Bluetooth, NFC wireless network, and also,
    mainly used in home automation systems, the Z-Wave system).

    +   - IT systems and solutions for processing collected data and transferring
    information to devices, that is, systems and IT solutions that are receivers of
    data collected and transferred by objects and places for their processing and
    decision-making (e.g., laptops, tablets, smartphones, and home cloud computing).


    Therefore, the idea of IoT solutions’ functioning (Figure 4.2) is based on using
    a computer network connected to the Internet, which connects all the cooperating
    elements [26].


    ![](img/7bb239370082cb34554bae1e45e2b0d7_76_0.png)


    **FIGURE 4.2**  Idea of the IoT solutions’ functioning.'
