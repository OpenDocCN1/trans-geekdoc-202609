  md: 'Hence, in this section, various methodologies using IoT and ML to predict and
    diagnose various diseases will be discussed.


    # 11.3.1 BRAIN TUMOR CLASSIFICATION USING MACHINE LEARNING AND ROLE OF IOT IN
    PROVIDING SOLUTION


    One of the deadliest diseases caused by uncontrollable and irregular partitioning
    of cells is the Brain Tumor. Various kinds of brain tumor exist, but the following
    types can be identified specifically as brain tumors [21,22]:


    +   - Benign tumor

    +   - Pre-malignant tumor

    +   - Malignant tumor


    A tumor which does not affect the healthy tissues, does not spread to non-adjacent
    tissues, and does not grow unexpectedly known as benign tumor. Moles are one of
    its examples, while a pre-malignant tumor is a pre-carcinogenic stage and, can
    be identified as a cancer, if not treated.


    Malignant neoplasm is also a kind of tumor that worsens with time and the death
    of the infected individual is eventually the outcome. Within the skull, tumor
    cells are present and develop within the skull, which is considered as the primary
    tumor.


    Incipient brain tumors are malignant brain tumors. Outside a skull, the tumor
    emerges and reaches to region of the skull called secondary tumor. One of the
    examples of secondary tumors are metastatic tumors. In the skull, the tumor takes
    its place and interferes with the brain’s normal functioning. The tumor switches
    to skull and raises brain pressure. First step towards treatment is the detection
    of the tumor [21,22].


    > “Detection of the brain tumor is one of the most challenging tasks in the medical
    image segmentation, since brain images are complicated and tumors can be analyzed
    only by expert physicians. In brain tumor diagnosis, the important task is to
    determine the exact location, orientation, and area of the abnormal tissues” [23].


    > “The important task of brain tumor diagnosis is the exact location, orientation
    and area of abnormal tissues” [23].


    In computer integrated surgery, presurgical planning and analysis of pathology,
    brain’s MRI may be useful [23,24].


    A software system based on IoT Thingspeak platform’s support SVM classifier that
    deals with brain cancer detection has been developed. It helps in detecting the
    tumor in brain by using MRI images of infected brains. SVM classifier is an enhanced
    SVM ML algorithm which is used for regression and classification purposes. The
    primary purpose of SVM classifier is to analyze and classify the collection of
    inputs accordingly.


