    # 9.5 Implementation of the Smart Hospital System


    In a smart hospital, the system operates in two important phases. The first includes
    the installing of devices. The second phase includes developing a mobile application
    with AI, android operating system, and Google cloud platform—Firebase.


    # 9.5.1 Initial Phase: Installation of Smart Devices in Hospitals


    The first phase includes the installation of devices in the hospital; these devices
    will be: Raspberry Pi, pcDuino, Beagle bone Black, and Cubie Board.


    # 9.5.2 Raspberry Pi


    Raspberry Pi will be installed in the circuit board IoT of the hospital, which
    operates all the sensors that are installed in the hospital building. It can be
    operated with the help of a mobile application, where the router will send wireless
    signals, which will be stored in the database/cloud.


    # 9.5.3 pcDuino


    It is a Arduino-based individual board minicomputer with the configuration of
    1 GHz ARM cortex-A8 processor. It is a low-cost and low-maintenance device, which
    is compatible with various programming languages like C, C++, and Java having
    standard android SDK and Python.


    # 9.5.4 Beagle Bone Black


    It is a more powerful device than any other device, having the configuration of
    1 GHz ARM Cortex-A8 processor, which supports both Linux and IoS, and is compatible
    with HDMI, video audio interface, VSB, and ethernet ports.


    # 9.5.5 Cubie Board


    It is configured as a dual-core ARM CortexA7 processor and has a range of input–output
    interface including USB, HDMI, IR, serial, Ethernet, SATA, and 96 pins extended
    interface.'
