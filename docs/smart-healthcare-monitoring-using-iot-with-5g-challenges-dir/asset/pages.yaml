    # 13.4  APPLICATIONS OF AI IN THE CONTACT TRACING SEGMENTS


    With three contact tracing segments and aims identified, the applications of AI
    can now be grouped accordingly and comprehensively. These applications should
    cover all the aims as much as possible, and the lack in any of the aims will be
    considered as a gap. Not just that, each aim is also set to consist of at least
    three solutions (does not matter theoretical or have been commercialized) to indicate
    that a solution does exists for it. Each aim that has less than three solutions
    will not be considered as a fulfillment of it. The main objective is to see if
    there are any AI solutions in each of the aims as it is not an easy task to develop
    one in a short period of time. It should be noted that the applications that are
    gathered in the list were gained from literatures in major journal databases from
    Google Scholar, Emerald Insight, Science Direct, and IEEE Explorer. Table 13.4
    illustrates the applications of AI with respect to contact tracing segments and
    aims.


    From Table 13.4, it shows that the identification of close contacts (case detection)
    segment has the most aims, with AI applications covering most of the aims. Only
    tracking and diagnosis have a wider gap for not completely utilizing AI solutions.
    Contact tracing can be a solution where whole world is affected due to COVID-19
    situation. The solution includes IoT but there will be an absence of AI. Not just
    that, it also shows that backtracking has been ineffective and lacking behind
    that almost no solutions of AI exist for it. Nevertheless, severity assessment
    segment has its aims fulfilled quite comprehensively. It is manage (people and
    assets) segment that has only one solution in one of the aims. Finally, one of
    the ultimate reasons for AI not being fully utilized for contact tracing'
