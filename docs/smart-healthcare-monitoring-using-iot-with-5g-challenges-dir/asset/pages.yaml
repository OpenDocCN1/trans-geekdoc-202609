  md: '# 3.3.3 TECHNIQUES FOR PROMOTING SERVICES


    IoT-based medical services can be facilitated by cloud computing (CC), big data,
    grid computing (GC), and other innovations [28].


    Load balancing, high availability, and high performance are all problems that
    CC presents. Additionally, it could be expanded through data centers to the mobile
    phone end-user, and as a cloud hosting provider, it allows for edge mobile connectivity.
    The introduction of CC into IoT-based medical care technology can allow services
    access to shared information from anywhere. In this way, services can be requested
    over the system, and services for various needs can be carried out.


    CC is said to be built on the base of GC. The inadequate computing functionality
    of medical sensor nodes is resolved by incorporating GC into the healthcare network.


    As the next move in computing, big data presents multiple obstacles to the science
    society, and necessitates a shared view, and discussion of a number of fields,
    like healthcare. It contains a vast volume of medical data obtained from sensor
    devices. There are also techniques for enhancing the quality of health-related
    diagnosis, and also tracking methods and shops.


    Which network style is best for IoT-based healthcare is a hot topic. Data, service,
    and patient-service models are the three basic ways of designing. The healthcare
    system is divided into items in the data-centric scheme depending on the health
    data collected. In a service-centric system, the healthcare framework is assigned
    depending on the characteristics that it would have. Finally, the patient-centric
    approach divides hospital systems based on the number of patients they accept
    for treatment.


    # 3.4 IOT HEALTHCARE SECURITY ISSUES AND CHALLENGES


    # 3.4.1 SECURITY ISSUES


    Since hackers or attackers can easily identify sensor information, protection
    has become a big issue in the IoT, and therefore the investigation of the most
    current security approaches in IoT is crucial. Holding various IoT vulnerabilities
    in consideration, security deployment and defense design typically has three stages.


    Health data could be an attractive and appealing target for a deceptive doer due
    to a lack of appropriate security measures. Mobile devices with cameras and other
    wearable technologies are also being used to gather computerized data from patients.
    In most cases, these are linked to applications that process and analyze information
    and indications. The functionality of these applications is often expanded by
    sending information to the server, and this phenomenon necessitates the use of
    sophisticated algorithms. Confidentiality, genuine use of intelligence, and legal
    concerns are the three essential elements in this area of protection.


    In addition, there are three points of security flaw: data transfer, devices,
