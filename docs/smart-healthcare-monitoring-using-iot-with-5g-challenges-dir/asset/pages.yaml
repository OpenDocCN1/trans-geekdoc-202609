    # 7.3 METHODS


    The application of deep learning provided a helping hand to the researchers for
    computerized COVID-19 analysis using medical images. Deep learning is popular
    and presents the exact representation from the learned data. Generally, deep learning–based
    systems comprise collecting data, feature extraction, data preparation, classification,
    and, lastly, evaluation of performance. New deep learning algorithms have been
    extensively used on X-ray and CT-scan images for coronavirus detection. Various
    deep learning pretrained models are designed considering convolution neural networks
    (CNNs) for COVID-19 such as ResNet, GoogleNet, AlexNet, SqueezeNet, MobileNet,
    DenseNet, and U-Net [23][34–39]. Among these models, the preexisting CNN termed
    as Residual Network (ResNet) has shown outstanding results using various classification
    tasks. The following discussion will give insights into the ResNet algorithm and
    its advantages.


    # 7.3.1 RESIDUAL NETWORK


    ResNet is a type of CNN introduced by Kaiming He and others in 2015 [23]. ResNet
    provides fast training of data and gives better performance of the parameters
    taken into consideration during the research work. Another advantage of considering
    ResNet architecture is its ability to feed images of sizes other than that they
    are trained with [40].


    Some additional layers are stacked in the deep neural network (DNN) to solve complex
    problems, resulting in better performance and accuracy. CNN, like AlexNet, has
    five convolution layers; the VGG network [41] has 19 layers; and GoogleNet (also
    codenamed Inception_v1) [42] has 22 layers. The reason behind adding more layers
    in these models is that these layers continuously learn more complex features.
    In image recognition, the layers may be divided as follows: layer one detects
    an image, layer two identifies textures, layer three detects objects, and so on.
    On the contrary, the traditional CNN models exhibit a maximum threshold for depth.
    Figure 7.1 describes the error percentage on training and testing data for a 20-
    and 56-layer network.'
