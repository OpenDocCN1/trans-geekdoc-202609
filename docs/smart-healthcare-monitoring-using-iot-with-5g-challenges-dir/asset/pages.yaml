- pgno: 98
  md: 'doesn’t allow the paracellular passive diffusion, which creates a hindrance
    during drug delivery. This hindrance can be overcome by using advanced nanotechnology.
    BBB consists of a number of capillaries of endothelial cells in the central nervous
    system attached together with the strong tight junctions that allow only nutrients
    or ions which provide neuronal protection to enter the brain part in order to
    maintain haemostasis to restrict the access of toxic substances or drug. The other
    additional barrier that inhibits the movement of certain molecules or drug entry
    is blood-CSF whose main role is the separation of blood from cerebrospinal fluid
    that is located at the choroid plexus and covers the subarachnoid space by enclosing
    the brain. There is some part of central nervous system where BBB is not present,
    but despite that, that particular regions contain micro vessels which are analogous
    to periphery, called as circumventricular organs, and consist of median eminence,
    choroid plexus. The free solute movement within interstitial fluid and blood is
    carried out by the capillaries which are present in the circumventricular organ.
    The presence of membrane transporters (influx and efflux transporters) acts as
    a barrier which permits the entry and exit of xenobiotics or drugs. Hindrance
    and degradation of drugs during drug delivery occur due to the presence of different
    potent enzymes in the brain which generate their effects to block the entry of
    drugs. To easily cross BBB by the process of passive diffusion, the drugs should
    be lipid molecules having the molecular weight of about less than 500 kDa with
    partition coefficient of 0.5 and 6.0 and pH should be neutral [59]. Certain different
    approaches have been used thus to overcome the problem that occurs during drug
    delivery to pass BBB that include biomimetics, intracranial infusion, diuretic
    agents, and convectional enhanced delivery [60–63]. With issues associated with
    safety, specificity which poses a problem to effective drug delivery to the target
    site [64,65]. In order to check the effectiveness of a wide range of drugs, animal
    models are used and are treated with the focused ultrasound that delivers a specific
    drug to the target site, including stem cells, viruses, antibodies, herceptin,
    nanoparticles, and chemotherapy [66–73].


    # 5.10 ACTIVATION OF MICROGLIA TO GENERATE RESPONSE TO INJURY


    During neurodegeneration, microglia gets activated and transformed into phagocytes
    which act as an antigen-presenting cells in central nervous system to generate
    response to remove cell debris. T-cells get activated through the receptors like
    Fcγ, MHC-class I&II, and B7 that are expressed by microglia. Microglia gets activated
    during death of neurons, and when there is no death of neuronal cells, they return
    back to their resting phase [74].


