    of the participants is not known. Depending on the frequency used, few databases
    are reviewed here, which may help the readers. As discussed earlier, the databases
    are categorized into X-ray and CT-scan images. Among the databases, the most used
    is the COVID-19 X-ray database [24]. It has a total of 589 samples, with 434 COVID-19
    patients and 155 other category patients. It is publicly available, and the images
    vary in size. Kaggle chest X-ray repository dataset [25,26] consists of 5,856
