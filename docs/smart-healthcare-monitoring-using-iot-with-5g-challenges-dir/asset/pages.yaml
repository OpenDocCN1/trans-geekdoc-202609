    and Resent [42] have been used. Google Net has reported the highest accuracy among
    these three pre-trained models.


    # 2.5 DESCRIPTION OF PROPOSED MODEL TO MITIGATE COVID-19


    As already highlighted earlier, DTL is effective in building predictive models
    to deal with COVID-19 situation. DTL does not need much data. There is another
    technique known as EC that is also useful when computing power is limited. As
    a result, combining both of these computational approaches or models may be more
    useful for developing AI-driven methods to deal with COVID. We may assume that
    DTL on EC (DTLEC) is a special combination to deal with the COVID pandemic. The
    advantages of both DTL and EC are incorporated to formulate these models. This
    DTLEC concept is not practically used to mitigate COVID-19 but is evolving [43–69].
    It has been observed that such a model could be useful in the healthcare industry,
    critical care units, quarantine facilities, and other areas where an outbreak
    could occur. Figure 2.3 shows edge devices or IoT devices implemented on EC and
    configured to use AI for decision making. Further, the system is designed to trigger
    an alert system implemented using a cloud-based approach. Later this edge device
    with a fine-tuning mechanism can be implemented with pre-trained datasets. Further,
    a DL-based graphical processing unit (GPU) enabled cloud server, which uses a
    standard dataset for performing feature extraction, is considered. Moreover, a
    pre-trained data model (DL based) is run over edge devices. With a fine-tuning
    mechanism, this edge device is considered to be implemented with pre-trained approach
    and dataset.


