  md: '# 6.4 EPIDEMIOLOGY


    It is estimated that approximately 15 million people from all over the world are
    suffering from this chronic disease [32]. Every year 0.5% new cases of AD under
    the age of 65 and 8% at the age of 85 years rise [32]. The disease growing rate
    is very high; the pervasiveness of disease keeps increasing from 3% at 65 years
    of age up to 40% at the age of 85 years or more [32]. Older people, aged 65 years
    or more, are mostly affected with this disease. Dementia patients have a high
    risk to develop the disease. AD affects the individuals at the age of 65, but
    still it is not an age-related disorder [2]. About 9% of cases have been detected
    in young-age people and are characterized as early-onset AD [2,3]. The risk factors
    that cause communicable diseases may show a relationship with AD also. Those factors
    are consumption of tobacco, unhealthy diets, obesity, diabetes, cardiovascular
    disease, hypertension, alcohol consumption [32]. However, there are no clear similar
    evidences to prove the effective relationship between these risk factors and AD
    [32]. Apolipoprotein gene (APOE gene) is associated with a high risk of developing
    AD at later stages; particularly ε4 allele is responsible for the progression
    of disease [33]. However, the presence of gene is not always related to the development
    of disease [3,34]. In fact, there are a number of genetic factors related to AD
    among different families that are not explored yet. Finally, people suffering
    from Down syndrome have a high risk of developing the disease. Depression, head
    trauma, social isolation, lack of awareness are the modifiable risk factors. Finally,
    women are more likely to be affected by this disease than men because life expectancy
    of women is longer than that of men [34].


    # 6.5 ETIOLOGY


    A number of studies that have been conducted have shown that oxidative stress
    leads to aging under normal metabolic conditions [1]. Oxidative damage and excess
    production of free radicals result in the mitochondria dysfunctioning because
    it maintains the oxidative metabolism; any damage in it leads to the failure in
    energy production; cells lose capacity to perform functions and eventually neurons
    or cells die [35]. The exact mechanism behind the disease is not known yet, but
    studies still are going on to identify it [33]. From the studies, it has been
    described that AD is caused by the mutation in the genes like APP, PSEN-1, and
    PSEN-II, but only 0.5 or fewer cases have been detected where the main disease
    causative factors are these genes [33].


    # 6.5.1 Amyloid Hypothesis


    Accumulation of beta amyloid proteins in the brain occurs due to mutation in specific
    genes APP, PSEN-1, PSEN-2, APOE, BACE-1, and IDE [33,36]. This accumulation in
    turns causes synaptic loss and loss of dendrites, and the eventually results in
    the death of neurons [33]. APP protein exists in two forms: Aβ-40 and Aβ-42. Under
    normal conditions, Aβ-40 plays a crucial role in the formation of synapses, helps
    in cellular transmission, and is found in many different proteins, whereas Aβ-42
    induces toxicity in neuronal cells [37]. The mechanism of how it exactly gets
    accumulated in the brain is not known yet. Figure 6.1 shows the known explanation
    about the mechanism behind the disease [38].'
