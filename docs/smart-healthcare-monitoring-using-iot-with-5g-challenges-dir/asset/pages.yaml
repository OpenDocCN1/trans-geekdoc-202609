- pgno: 83
  md: 'increase competitiveness and create added value for users. Smart home services
    and products show the most significant growth potential.


    To determine the development prospects of IoT and the degree of adaptation to
    this ecosystem among Polish Internet users, IAB Polska, in cooperation with the
    media and science representatives, carried out a dedicated research project [37].
    The study covered the following issues related to the IoT:


    +   - Awareness of the phenomenon and readiness to adapt.

    +   - Degree of adaptation and purchasing potential.

    +   - Barriers and benefits.


    As part of the study, 1,121 interviews with Polish Internet users aged over 14
    were conducted. The sample was representative in terms of sex, age, and frequency
    of use of the network, and the participation of the websites in the survey ensured
    coverage at the level exceeding 90%. The measurement was carried out using the
    CAWI method between May 6–31, 2015. The maximum estimation error at the 95% confidence
    level was 2.84%.


    The study decided to determine the readiness to use IoT solutions, understood
    as the degree of use of three types of devices with Internet access: home WiFi,
    mobile devices, and a car. Access to the first two channels was confirmed by all
    of the respondents, and every sixth of them declared that their car could connect
    to the Internet (e.g., playing music, navigation). In total, the vast majority
    of Internet users (86%) have access to wireless devices that support the network.
    It should be emphasized that it is mainly dependent on the age of network users—in
    the youngest group of respondents, it slightly exceeds the general level, then
    gradually increases to reach the maximum (93%), from the marketing perspective,
    in the target group of people of mobile working age (35–44 years old), then decreases
    among people over 44 years old.


    The study also verified Internet users’ level of knowledge about the term ‘IoT’.
    It shows that only 11% of Internet users have come across the term IoT. It is
    essential to note that although the level of knowledge is independent of age,
    significantly more men than women declared knowledge of this term. This knowledge
    is also correlated with the degree of digitization—people who use smart devices
    (smartphone, tablet) more often encountered this term. However, rarely a technological
    or industry language is understandable to average users, even if they use a given
    technology solution. It should therefore not be surprising that—according to the
    ‘IoT’ study—despite such a low technical knowledge of the concept, currently about
    40% of Polish Internet users have equipment that can function in the IoT ecosystem,
    and another 50% would use such devices if they had such a possibility.


    As of today, IoT solutions in the smart home category are characterized by the
    lowest degree of use (only a few percentage of respondents declare having such
    solutions), but this is an area with the most significant development potential
    among consumer applications of the IoT (Figure 4.6). This is evidenced by several
    indicators determined in the study [38]. First, Internet users’ households are
    characterized by a high degree of wireless data transmission—77% use their home
    WiFi (Figure 4.7). Moreover, this technology is widely used as 86% of its users
    use a wireless link to operate more than one device [38].'
