    # 6.8 CONCLUSION


    This chapter reviews all collected information from literature regarding the beneficial
    effects of phytochemicals on this deadly disease by analyzing the study or tests
    that have been done to determine the effectiveness of phytochemicals that are
    isolated from a variety of plants. In addition, several phytochemical studies
    were examined to understand different roles phytochemicals play in the inhibition
    of different signaling pathways associated with AD. According to one study, it
    was evaluated that people who take food with turmeric as a supplement (curcumin)
    are less likely to develop the disease than those without turmeric. Curcumin exhibited
    its efficiency in the clinical fields through a number of analytic studies and
    was found to directly interact with proteins involved in apoptosis, cytokines
    involved in inflammatory reactions and halting the function of phosphorylase kinase.
    In spite of that, the exact mechanism behind curcumin interaction with these molecules
    is not known yet. Quercetin treatment on rodents has shown protective effects
    against neurotoxicity to diminish the effects of oxidative stress. A number of
    novel phytochemicals have been extracted from different medicinal plants which
    show anti-inflammatory, anti-apoptotic, and anti-oxidant properties which might
    be the future therapeutic drug approach to treat AD. But their effectiveness has
    not been examined on human and animal models. Some phtyochemicals show their effectiveness
    when used in combination with other phytochemicals. In order to enhance the effects
    of phytochemicals, properties of compounds should be analyzed thoroughly by using
    other ways, techniques, or methods. Still there is no single drug in the market
    yet that has the ability to reverse the disease or control it. All phytochemical-based
    drugs only slower down the symptoms that appear during disease, but not cure the
    AD properly. Because the exact mechanism of AD is not known yet, the disease could
    not be controlled before the development of AD.


