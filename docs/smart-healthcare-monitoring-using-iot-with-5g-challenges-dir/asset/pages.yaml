    # # 8.10 CONCLUSION


    COVID-19 outbreak swept across disease originated country China and has spread
    to 210 countries/areas/territories, with total confirmed cases of about 1,700,378
    and 102,755 reported deaths till April 11. On August 5, the cumulative number
    of COVID19 cases worldwide exceeded 200 million, and it was only six months before
    reaching 100 million. This week alone, and more 4.2 million new cases and more
    than 65,000 new deaths were reported, a slight increase compared to the previous
    week. The Americas Region (14%) and the Western Pacific Region (19%) reported
    the largest increase in the proportion of new cases, reporting 1.3 million and
    more than 375,000 new cases, respectively. In addition, the number of new deaths
    reported in the Western Pacific Region increased significantly this week (46%).
    Of the 228 member states and territories, 38 (17%) reported a 50% increase in
    new cases from the previous week, and 34 (15%) reported a 50% increase in new
    deaths.'
