    # 6.7.11 Matricaria chamomilla L.


    This medicinal herb is used as an anxiolytic, antidepressant, anti-viral, anti-microbial,
    and anti-inflammatory agent. To demonstrate the effects of hydroalcoholic extracts
    (25–75 mg/kg) that were extracted from Matricaria chamomilla, a test was performed
    on mice that was treated with scopolamine (0.7 mg/kg) 30 minutes and the extract
    was orally administered for 7 days. The following compounds were observed: luteolin,
    rutin, chlorogenic acid, apigenin, cynaroside, and apigenin-7-glucoside in the
    hydroalcoholic extract. The results of the test showed the extract helped improve
    the memory deficit that was induced by the injection of scopolamine through modulating
    the activity of acetyl cholinesterase with the activation of BDNF and reduction
    in the expression of IL1β in the hippocampus region of brain. Therefore, it might
    be the propitious therapeutic drug approach in order to prevent neurodegenerative
    disorders that are associated with memory loss and amnesia [84].


    # 6.7.12 Allylguaiaacol


    Allylguaiaacol is a chemical compound (phytochemical) extracted from a number
    of plants including cloves, nutmeg, basil, and cinnamon that show anti-bacterial,
    anti-cancer, anti-inflammatory, and anti-oxidant properties with neuroprotective
    activities. The study was conducted to examine the effect of allylguaiaacol by
    treating HT22 cells of hippocampus with hydrogen peroxide (H₂O₂). The free radicals
    such as 2,2-diphenyl-1-picrylhydrazyl (DPPH), 2,2′-azino-bis-(3-ethylbenzothiazoline-6-sulphonic
    acid) (ABTS) act as scavengers, and their scavenging activities get enhanced with
    an increase in the expression of enzymes, like catalase and manganese superoxide
    dismutase (MnSOD), that act as anti-oxidants. Moreover it inhibits the damage
    caused by hydrogen peroxide in HT22 cell lines with an increase in the production
    of the brain-derived neurotrophic factor (BDNF). Allylguaiaacol showed potent
    effects by activating antioxidant enzymes with the regulation of proteins like'
