  md: 'Wearable IoT devices in healthcare are intelligent tools providing effective
    user experiences and services. They are the core of intelligent IoT solutions
    for healthcare management. These wearable devices, together with the telemedicine,
    are used for constant reporting of patient`s activities. They report by applications
    and exchange safe data through the IoT. Such wearable devices used to monitor
    the health signs are tending to be developed with smaller and smaller sizes to
    better fit the user requirements and to provide them the comfort of wearing them
    [40]. Another healthcare-related application is HAR, in which IoT serves for reporting
    the user activities [41]. Detecting and analyzing human activity is a difficult
    task as it takes significant time together with an expensive equipment. Proper
    reporting of people activity can help healthcare services improve training guidelines
    for recovery or the early indication of medical emergencies encountered in older
    patients, such as falls and heart failure [42].


    It is estimated that more than half of the patients do not take medications at
    all or take them contrary to the doctor’s recommendations. This poses both a medical
    and an economic problem. Poorly treated patients generate additional treatment
    costs, especially inpatient treatment. Much research is being done in the health
    sector management on new technologies in this area. In the context of the current
    level of technology development, new technologies can be implemented, although,
    for the time being, there are plans for the future [43]. For example, pharmaceutical
    companies are introducing pilot programs to monitor patient medication intake.
    The use of silicone microsensors mounted onto tablets allows monitoring of the
    patient’s intake of prescribed medications. The sand-grained chip on each tablet
    contains small amounts of copper and magnesium. When the chip is swallowed, the
    metals react with the gastric juice, generating an electrical voltage. This impulse
    is read by a medical recorder placed on the body’s surface (a patch placed on
    the skin). Thanks to the smartphone, the recorder sends a signal informing about
    drug intake. If the patient does not take the prescribed medications, the doctor
    or other authorized person—the patient’s guardian, will be informed about it.
    This device has been approved by the United States Food and Drug Administration
    (FDA) and European Medicines Agency (EMA) for pre-approval clinical trials as
    medical technology [44].


    Smart health devices are also used to report the health of patients with chronic
    diseases, and they measure many functions: scales, pulse oximeters, blood glucose
    meters, and cuffs for measuring blood pressure. On the basis of the results, information
    and alerts are sent to healthcare professionals to diagnose and react or care
    if necessary. IoT applications in healthcare are beneficial and used to treat
    chronic diseases related to specific therapy areas [37], and Figure 1.3 presents
    the classification of such apps by therapy area in 2013.


    Diabetes mellitus is a common chronic disease in which blood glucose levels are
    high for a long time. To deal with this, there is a need for non-invasive glucose
    sensor. The IoT in healthcare method to deal with is to connect sensors to healthcare
    providers [45]. Another critical issue is a heart disease. Reporting the heart
    activity is a necessity. The arrhythmia might be dangerous for the living, so
    such control prevents the emergency accidents. To prevent this from happening,
    linking IoT with ECG monitoring makes it possible to remotely offer proper functions
    and information about'
