    # 2.8 FUTURE RESEARCH DIRECTION


    AI-based DL and ML are already playing significant roles to combat COVID-19. The
    benefits of these models and graphical representation aid the automatic detection
    of the virus. Different types of pneumonia have already become standard methods
    adopted by the medical community. Extensive developments in this domain shall
    enable the medical professionals to correctly employ such tools to reduce probable
    faulty diagnosis while using scanning and detection medical instrument (X-ray
    machine, CT scan machine) to detect which one is simple pneumonia and which one
    is due to COVID-19. Primarily, both diagnosis and treatment of COVID-19 are important.
    However, finding a cure for COVID-19 is critical, which is critically related
    to the application of ML/DL tools for drug discovery and design. Smart robots
    are being used for sanitization of public arenas, delivery of products and drugs
    to COVID patients. This measure is helpful to stop the spread of COVID-19. ML/DL
    methods can monitor and track the behavior and social interaction characteristics
    of people and warn about impending danger due to their proximity to patients with
    COVID-19 if any. These approaches can help to create social networks, and spread
    the awareness about avoiding all forms of proximity with COVID-19 cases and effectively
    decelerate the potential spread of the disease. These standard machine-learning
    algorithms can be applied to recognize false information, then remove false news,
    data, or audio from the online portals so that scientific information about COVID-19
    only is circulated. The possibility of use of ML/DL methods for combating COVID-19
    is limitless.


    # 2.9 CONCLUSION


    Globally people are carrying out extensive research to find ways and means to
    combat COVID-19. This involves the use of ML/DL tools to monitor crowd behavior
    with regard to biosafety norms, build social networks to spread awareness, prevent
    circulation of fake news and information, assist in diagnosis between normal pneumonia
    and COVID-19 using images and scans, etc. The widespread COVID-19 has a major
    influence on many people’s lives around the world, and the number of individuals
    who have died because of this virus continues to climb. As a result, it is critical
    to examine various forecasting and prediction methods that will be useful in this
    pandemic situation in order to support the government and'
