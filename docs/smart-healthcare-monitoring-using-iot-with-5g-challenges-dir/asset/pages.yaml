  md: 'Figure 4.2 shows the complexity of technologies, standards, and subsequent
    revolutionary solutions included in the IoT environment, divided into layers based
    on the ISO-OSI (Open System Interconnection) model, starting from a physical device
    equipped with sensors enabling data acquisition, through communication systems,
    data collection, and processing systems, up to specific business models and applications
    [27].


    The Internet network was initially intended to connect computer units located
    in different locations for mutual information exchange. However, the further development
    of the Internet, including using a standardized language for communication with
    the TCP/IP protocol stack, allowed its global users to use e-mail and publish
    and search for information on websites. Over time, the use of network technologies
    has become more and more intensive, which made it possible to use them in e-commerce
    and create connected supply chains, in which cooperating enterprises work together
    on one product. Further the development of network technology made it possible
    for more efficient use of data and video and audio streams. Simultaneously, wireless
    access technologies started to develop, which enabled the launch of service mobility.
    As a result, social media, streaming services, and cloud services on a mass scale
    and in conjunction with mobile technologies began to be used. Today, the Internet
    is a global network connecting millions of private, public, business, academic,
    and government users, operating locally to international levels, connected by
    a wide range of electronic, wireless, and optical devices [28].


    Therefore, the natural effect of the further development of this technology is
    the connection to the Internet of more and more new things which, thanks to the
    possibility of data exchange, are characterized by completely new functionalities,
    thus becoming an integral part of the IoT. However, things can be all kinds of
    objects or people from the real world. What is more, everyday objects do not only
    mean electronic devices or technologically advanced products; they can be all
    things, even those in no way associated with electronics, such as food, clothes,
    furniture, raw materials, parts, art, culture, health. [29].


    Understanding the IoT as an ecosystem where objects can communicate with each
    other, with or without human intervention, is important. For information to be
    exchanged there are four necessary elements for the IoT functioning, presented
    in Figure 4.3, and three conditions must be met between two ‘things’ [30]:


    +   1. First of all a device equipped with a sensor that can collect certain information
    from the environment and then pass it on is needed. These can be objects equipped
    with various sensors: temperature, vibration, humidity, motion, GPS. The role
    of the transmitter can also be played by a smartphone


    ![](img/7bb239370082cb34554bae1e45e2b0d7_77_0.png)


    FIGURE 4.3 Elements of the IoT functioning.'
