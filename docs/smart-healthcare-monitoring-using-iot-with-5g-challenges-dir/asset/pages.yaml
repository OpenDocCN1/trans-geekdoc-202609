  md: 'Coronavirus carries virion S-glycoprotein on its surface that can attach to
    the cellular ACE receptor present on the human cell surface [9]. S-glycoprotein
    consists of two main subunits S1 and S2 in which S1 determines cellular tropism
    and a range of host susceptibility for virus. The role of S2 is not clearly mentioned
    in paper. RBD domain plays a vital role, while tandem domains, HR1 (heptad repeats
    1) and HR2, fuse with the cell membrane of the virus, a process mediated by the
    S2 subunit [10,11]. After the fusion of cellular membranes, the viral RNA get
    s released into the cellular matrix or cytoplasm, and pp1a and pp1ab, two polypeptides,
    are translated by the uncoated viral RNA, which encode unstructured proteins to
    form RTC (replication transcription complex) in double-membrane vesicles [12,13].


    Subgenomic RNAs get synthesized by the continuous replication of RTC that encodes
    structural proteins and accessory proteins. Mediating Golgi, endoplasmic reticulum
    (ER), nucleocapsids protein, envelope glycoproteins, and genomic RNA (newly formed)
    assemble and then form buds of viral particles. At last, the virion consists of
    vesicle fuse with the cellular membrane to deliver the virus. Spike (S)-glycoprotein
    and ACE receptor binding is a very crucial step for the entry of the virus; binding
    between the virus and the ACE receptor is an intensively studied approaches. β-Co
    receptor detection was done systematically, which showed that ACE-2 was expressed
    in human cells but not APN (aminopeptidase N) and peptidase-4 (DPP4) improved
    SARS-CoV-2 entrance, while other studies showed that the binding efficiency of
    ACE-2 and the virus is 10–20 folds higher than that of SARS-CoV [14].


    In case of SARS-CoV, trimer S protein cleavage is triggered by cathepsin and TMPRSS2
    (transmembrane protease serine 2), when membrane invagination is facilitated by
    other possible molecules for the endocytosis of SARS-CoV-2; still, it’s not clear
    yet [15,16]. Available data stated that the virulence of SARS-CoV-2 might be less
    than that of MERS-SoV and SARS-CoV; COVID-19 mortality is 3.9% lower than the
    MERS death rate (35%) and SARS-CoV (9.6%) [17]. Thus, SARS-CoV-2 pathogenic mechanisms
    and transmission mechanisms are covered by extensive studies.


    # 8.4 COVID-19 TRANSMISSION


    Various studies suggested that bat might be the potent source of SARS-CoV-2 infection
    occurred in the seafood market in China. The genome sequencing of the deadly virus
    showed 96.2% genome similarities with bat genome sequence. Studies proposed that
    there might be the same ancestor for SARS-CoV-2 in humans and bat CoV, although
    in seafood market bats are usually not sold. SARS-CoV-2 transmission among humans
    mainly occurs between members of a family when one member comes in contact with
    an infected one or a carrier one or any other COVID patient [4].


    # 8.5 CLINICAL COURSE (COVID-19)


    The median incubated period is estimated to be around 5–6 days (within the range
    of 0–14 days). The median estimated age of confirmed cases was about 59 years.
    By the analysis of the initial data, it was found that around more than 80% patients
    had'
