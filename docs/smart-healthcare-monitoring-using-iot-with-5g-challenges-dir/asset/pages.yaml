- pgno: 7
  md: '# Preface


    Before Internet of Things (IoT), patients’ interactions with doctors were limited
    to visits, and tele and text communications. There were no ways doctors or hospitals
    could monitor patients’ health continuously and make recommendations accordingly.
    IoT-enabled devices have made remote monitoring in the healthcare sector possible,
    unleashing the potential to keep patients safe and healthy, and empowering physicians
    to deliver superlative care. It has also increased patient engagement and satisfaction
    as interactions with doctors have become easier and more efficient. Furthermore,
    remote monitoring of patient’s health helps in reducing the length of hospital
    stay and prevents re-admissions. IoT also has a major impact on reducing healthcare
    costs significantly and improving treatment outcomes. IoT is undoubtedly transforming
    the healthcare industry by redefining the space of devices and people interaction
    in delivering healthcare solutions. IoT has applications in healthcare that benefit
    patients, families, physicians, hospitals, and insurance companies.


    In parallel, 5G will enhance many existing use cases while creating new ones unfulfilled
    by current technologies, such as remotely performed patient examinations and even
    operations. What is also certain is that critical healthcare services require
    reliable connections. 5G networks will provide near-instantaneous data transfer
    speeds, which will make a massive impact on all connected devices in healthcare.
    Huge data files of medical imagery could be transported quickly and reliably,
    leading to improved quality of care.


    The objective of this book is to provide a wide variety of topics as they pertain
    to knowledge management, decision science, inclusion of IoT, and 5G techniques
    with upgraded technologies. This publication will impact the field of business,
    organizations, management and information technology, healthcare industries, and
    hospitals because there is scant extant literature on IoT and 5G in smart healthcare
    as it pertains to business world.'
  merge: -1
  img_proc: true
