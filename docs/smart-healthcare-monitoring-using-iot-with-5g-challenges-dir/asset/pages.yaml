  md: '# Potential Applications and Challenges of IoT


    a. Glucose level sensing (GLS)—An individual with diabetes is primarily concerned
    with regulating the blood sugar levels to prevent glucose boundary abnormalities.
    Non-invasive, minimally invasive, and invasive approaches for controlling these
    levels are divided into three groups [24].


    +   i. The invasive group contains often-used approaches because, due to the direct
    contact with the blood of the patient, it has the greatest consistency in outcomes.

    +   ii. One of the methods under review concerns the minimally invasive group.
    This method makes use of small pores caused through laser radiation, which are
    tiny holes in the skin. When the holes are open, a system uses a steady vacuum
    to remove a small quantity of transdermal body fluid. An enzyme-based electrode
    processes and tests glucose rate with the sample collected.

    +   iii. Non-invasive category are non-invasive glucometers that have the goal
    of replacing a blood component with another from which external access is achieved.
    The procedure involves putting a sensor on a specific area of the body to receive
    a glucose measurement.


    b. ECG monitoring (ECGM)—The best tool for detecting heart irregularities is known
    to be an ECG. The ECGs differ between single and 12-lead ECG recording equipment.
    On the one side, ECG acquisition instruments in hospitals are typically large
    in size and facilitate high-precision, and long-term surveillance. They, however,
    restrict the movements and participation of the patients. Wearable health-monitoring
    devices offer continuous actual monitoring of patients by installing sensors.
    The data collection process, the lifecycle procedure of ECGM devices, includes
    the selection of the following processes [23]:


    +   i. The categories of sensors (e.g., wireless or wired),

    +   ii. The location of the sensors,

    +   iii. The numbers of sensors, and

    +   iv. The hardware needed to capture, store, and transmit data.


