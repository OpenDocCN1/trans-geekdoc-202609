    installations. Intelligent Energy and Grid include:


    +   - Energy savings through the use of more reliable and intelligent sensors
    and actuators.

    +   - Scalability of the safety functions.


    6. **Smart home, smart buildings, and infrastructure**—Use of the growing role
    of wireless Internet access (WiFi) in home automation, which is primarily due
    to the network nature of the electronics used in new electronics/'
