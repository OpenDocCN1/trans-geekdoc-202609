    # 6.7.7 Resveratrol


    Resveratrol is a phytoalexin phenolic molecule found abundantly in grapes, wine,
    peanuts, blueberries, mulberries, and tea, and is produced by certain plants when
    they get injured [79]. It is recognized as a miracle molecule due to its anti-inflammatory
    and anti-oxidant properties and shows a strong response toward neurodegenerative
    diseases. Various tests have been done on transgenic mice by inducing cognitive
    defects in mice, and resveratrol supplementation was shown to have reversal effects
    toward AD by inhibiting the action of TNF-alpha and levels of IL-1β with the elevation
    in the levels of BDNF in the regions of hippocampus. Moreover, it has been found
    that resveratrol is responsible for the induction in the IL-10 levels that causes
    inflammation by inhibiting TNF-alpha and levels of NF-kappa beta that leads to
    the activation of ERK-2/CREB pathways that are associated with signaling processes
    that promote neuronal survival with the increased level of GDNF and BDNF after
    administration of this phenolic compound [76,79]. In the new studies, it has been
    found that treated patient showed a 50% reduction in the levels of metalloproteinase-9
    (MMP-9) in the cerebrospinal fluid that is due to the activation of SIRT-1 (sirtuin-1).
    The increase in the level of MMP-9 responsible for the destruction of blood brain
    barrier (BBR) that allows the access of certain proteins and other molecules in
    the brain. Normally, low level of MMP-9 provides maintenance of blood–brain barrier
    [80]. The normal mechanism of signal transmission in the brain results in the
    proper functioning of brain (Figure 6.7) [81]. The mechanism of action of resveratrol
    in the pathogenesis of AD is described in Figure 6.8 [81].


    +   1. Beta and gamma secretase is responsible for the cleavage of APP that leads
    to the production of beta amyloid.

    +   2. Without the involvement of SIRT1, only AMPK activation promotes the potent
    function of resveratrol that leads to the clearance of the beta amyloid without
    creating any hindrance in the beta amyloid generation process.

    +   3. Resveratrol also causes the phosphorylation of PKC that plays a crucial
    role in the neuroprotective functions.

    +   4. The generation of Aβ-Cu, Aβ-Zn, and Aβ-Fe gets reduced due to the protective
    action of resveratrol.

