- pgno: 267
  md: '# 13.5 CONCLUSION


    Contact tracing has been around for quite some time in the research and development
    arena. It is only during COVID-19 pandemic that it has become such a great importance
    to the society as it helps tremendously in curtailing the pandemic. Thus, it is
    also with great urgency that AI solutions in it to be developed in a fast manner
    in order for it to be better. Therefore, it is important to identify AI solution
    in each of the segments as well as aims to identify which parts are lacking. These
    identifications enable researchers to direct their efforts toward the gaps as
    those are the real problems to be solved. Insights gleamed from this study shows
    that there is much needed work to be exerted in the managing (people and assets)
    segment for contact tracing with AI solutions. This is to ensure that COVID-19
    pandemic can be handled with better efficiency as humans and assets are a great
    resource. Not just that, it is also to ensure that the whole healthcare system
    will not collapse due to overload of cases. Apart from that, the study also illustrates
    that solutions for backward tracing and contact tracing are both lacking heavily
    in AI-based solutions. Therefore, again, more studies will need to be conducted
    in these two areas as they are the keys in controlling the pandemic. Finally,
    the study opens contact tracing view comprehensively in three segments in which
    none in the literature world has done before.


