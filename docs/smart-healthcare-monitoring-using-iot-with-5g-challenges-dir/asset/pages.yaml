    # 11.3.2.1 Characteristics of Dementia and Its Adverse Effects of Dementia


    A widespread phenomenon in elderly people is dementia which is also a leading
    cause of death among individuals over an age of 70 [33]. Dementia is normally
    caused by degeneration of the cerebral cortex, the portion of the brain that is
    responsible for personality, behavior, perceptions and emotions [34].


    In specific region, patients with dementia die as a result of the loss of brain
    cells in a specific area. The cognitive impairment that characterizes dementia
    results in these dead cells. In many parts of the world, the well-being of the
    ageing population is a considerable concern. For their caretakers and families,
    remote monitoring of elderly people’s health and well-being is helpful.


    Five major symptomatic areas linked to dementia have been identified by the Alzheimer’s
    Association are shown in Figure 11.4. In addition, these five forms of core dementia
    symptoms may be sub-categorized further into sub-symptoms [35].


    Behavioral and psychological symptoms of dementia (BPSD) may provide multiple
    signs for predicting the dementia’s onset along with above key symptomatic areas.
    Any of these dementia sub-symptoms can fit very closely into the signs of BPSD.
    A clinical phenomenon of heterogeneous collection is BPSD. BPSD symptoms are present
    in around 80–90% of people having dementia [37]. The phenomena of BPSD include
    changes in personality, deregulated patterns of sleep and wake-up, irregular motor
    behavior, vision and thinking changes, altered mood, and impaired feelings [37].
    In dementia patients, the below list shows some common BPSD symptoms:


    +   a. Apathy

    +   b. Repeated vocalization

    +   c. Change in personality

    +   d. Sleeping disorder

    +   e. Inappropriate behavior

    +   f. Spitting'
