    enjoyed the most significant interest among the wearables accessories presented.


    Above, the focus was on the most typical consumer solutions, but the portfolio
    of products and services associated with the IoT is vast [38]. It should also
    be noted that the potential of IoT devices depends on the intensity of Internet
    use (Figure 4.8).


    An example may be the use of IoT in the automotive industry, sport, and tourism,
    as well as culture and art (museums, cinemas) and many public places (hotels,
    airports, shops, etc.). The results of the study indicate that Polish Internet
    users are primarily prepared for this—76% use WiFi on mobile devices at least
    from time to time (e.g., phone, smartphone, tablet), 49% being in a museum or
    gallery would like to receive information and interesting facts about the exhibitions
    on the phone, and 41% being in the store get information about the products, discounts,
    and promotions. The IoT opens up great opportunities for the entire economy, innovation,
    and creativity.


    # 4.6 SMART HEALTH MANAGEMENT—INTERPRETATION OF THE PHENOMENON


    Regardless of the individual or social approach, human health is the most crucial
    good that should be constantly looked after. Along with the development of civilization,
    healthcare improves its activities from year to year. Modern technological achievements
    also help in this development. Smart health management (SHM) is defined as using
    information and communication technologies to support activities related to health
    protection [39].'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'SHM is the name used to describe tools or solutions that include products,
    systems, processes, and services for health authorities and professionals, and
    tailored health systems for patients and citizens, such as health information
    networks, electronic health books, telemedicine services, personal portable communication
    systems, health portals, and many other tools based on information and communication
    technologies, helping to prevent, diagnose, and treat diseases, monitor health,
    lead an appropriate lifestyle.


    Besides, this term covers many other terms such as telemedicine, telehealth, remote
    medical care, telematics in healthcare, medical IT, health information management,
    information, and communication technologies [40]. In addition to computer applications,
    smart health management includes cognitive information processing and communication
    tasks for medical practice, education, and research [41]. The essence of SHM is
    that it should support the transformation of healthcare processes to benefit patients
    and the healthcare system.


    At the same time, SHM aims to support patients by educating them about their health
    condition and prevention. It also allows patients to deal with crises on their
    own. It provides its users with services of a high-quality standard, supported
    by experienced health professionals, and also enables the maximum use of the potential
    of knowledge from available online sources. Thanks to this, using SHM, it is possible
    to monitor patients and reduce costs related to their treatment remotely, and
    eliminate geographical barriers in providing medical care [42].


    Despite the effective use of SHM in practice and its wide use by physicians and
    society it is possible to identify several success factors as well as some determined
    barriers. Additionally, some of the factors may exist in certain circumstances
    and, depending on them, may be considered severe (as a best practice) and less
    often as threats due to the lack of an appropriate implementation approach [43].
    Success and failure factors in implementing smart health are collected in Table
    4.3.


    The broad classification of the SHM is based on the services, medical devices,
    technologies used, applications, system management, and end users [44]. Classification
    of smart healthcare is presented in Figure 4.9.


    Connectivity technologies that are used play a vital role in expanding the applications
    for which the healthcare system is designed. The efficient integration of small
    devices through wireless technologies can help in implementing remote health monitoring
    through the IoT [45].


    The healthcare sector is transforming as a result of the digital revolution. New
    technologies are creating a new world of online healthcare, from robotic surgery
    to hyper-precise treatment. The IoT technology accelerates the change in healthcare
    management by enabling doctors to use data collected by medical devices. In this
    way, reactive healthcare becomes proactive care, helping to improve early diagnosis.
    In addition to facilitating remote healthcare, IoT technology can help health
    organizations become more efficient by tracking resources such as hospital beds
    [46].


    Data from the IoT help drive smart hospitals’ management and development, but
    it also helps to track the person’s health. IoT devices enable patients to be
    more active in controlling their health, which is especially important for the
    elderly and patients suffering from chronic diseases. Using IoT devices can also
    help to get out of the hospital faster and even prevent hospital stays [47].'
