    their health. They realized that money is not everything. Society, in general,
    is becoming more vegetarian. People understand the importance of nature.


    # 12.5.1.4 Impact on the Functioning of Organizations


    Since lockdown is followed in most of the countries, the working of many organizations
    also gets changed. Many employees are working from home. Educational institutions
    are also closed, so the teachers are shifted to the online mode of learning. Classes
    are held through an online platform for college and high school students. In some
    of the countries, there is a rise in the home delivery business. Now companies
    are making a huge profit; as people are not allowed to step outside, they are
    forced to pay high prices for home delivery. Medicines and food industries are
    using robots for home delivery so that proper distancing is maintained.


    # 12.5.2 Proposed Solutions


    The government of different countries proposed many solutions or have taken various
    steps for containing the virus outbreak. Some of them are given below and discussed
    in detail.


    # 12.5.2.1 Lockdown and Restriction of Mass Gathering


    A person gets infected with the coronavirus virus only by coming in direct contact
    with a person or an object carrying this virus. Hence, social distancing is necessary
    to stop this global pandemic. For controlling COVID-19 situation, the lockdown
    was imposed by the government of almost every country. There is a restriction
    on mass gathering in many countries. People are working from home. Despite the
    government order, it is now the primary duty of every person to maintain the social
    distancing to stop the spreading of this virus.'
