    # 5.1 BACKGROUND


    In 1906, Dr. Alois Alzheimer was the first person who illustrated this potent
    disastrous Alzheimer’s through the observation of shrinkage in the nerve cells
    of the brain in her patient who suffered from memory loss and psychological changes.
    It is estimated that more than 4 million people in India suffer from Alzheimer’s
    disease (AD), yet many people, especially rural people, are not aware of this
    disease because they usually consider the loss of memory as a sign of inexorable
    part of aging rather than the sign of any kind of neurodegenerative disease. AD
    keeps on increasing at a faster rate and thus there is increase in burden of Alzheimer’s
    in India. After China and USA, India has the third-highest caseloads in the world.
    But still there are no effective drugs and treatments available to cure this disease.
    More research is needed in this field to treat AD.


    # 5.2 INTRODUCTION


    AD is one of the heterogeneous disastrous neurodegenerative diseases that cause
    progressive relentless loss in relation to cognitive functions including thinking,
    language and behavior associated with the accumulation of amyloid-β (Aβ) peptides
    and tau proteins that ultimately result in the formation of senile plaques in
    the hippocampal region of the brain. Dementia usually affects the elder population,
    and is caused by AD, which is the most common form of dementing illness, showing
    a huge impact on family, personal, and societal life. The early typical symptoms
    that usually appear after the age of 60 are the loss of recent memories, language
    problems, mild coordination problems, and psychological issues. There are reports'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'related to coronal T1-weighted magnetic resonance imaging (MRI) scan studies
    in a patient who suffered from moderate AD. The study shows that disease progression
    in the hippocampus area leads to hippocampal atrophy [1].


    # 5.3 CHANGES OCCUR IN BRAIN DURING AD


    In central nervous system, neurons are the basic potent cells that help transmit
    information from one nerve to another. A normal healthy adult brain has over a
    billion neurons, each having long branching extensions, with an axon and several
    dendrites. Neurons communicate with each other by establishing a connection between
    them, called synapses, which are usually over trillions in number. The flow of
    information is usually carried out in the form of tiny chemicals like neurotransmitters
    which are released by single specific neuron and detected by other specific receiving
    neuron through the brain’s neuronal circuit which develops thoughts, emotions,
    movements, and cellular basis of memories.


    The two main changes in the brain associated with AD are accumulation of β-amyloid
    (protein fragment), a peptide made up of 36–43 amino acids outside neurons, and
    accumulation of tau protein in the defective form inside neurons that no longer
    stabilize the properties of microtubules. Accumulation of β-amyloid (beta-amyloid
    plaques) is believed to be responsible for the cell death because they restrict
    the transmission of information within the neurons at synapses, while tau protein
    (tau tangles) blocks nutrients exchange within the neurons. When the concentration
    of β-amlyoid starts increasing in the neurons, the point is reached at which defective
    tau protein spreads all over the brain. Inflammation and atrophy are the conditions
    that have been detected during AD. High concentration of toxic β-amyloid and abnormal
    form of tau protein results in the activation of immune cells in the brain called
    microglia, which are the defense cells present in the central nervous system by
    acting as macrophages to remove plaques, cell debris, and dead neurons through
    the process of phagocytosis. Due to loss of cells in the brain, it gets shrunk,
    which is the main cause of atrophy. The loss of cells results in the decrease
    in the capacity of the brain to metabolize the glucose (fuel source), causing
    slow cognitive function and loss of memory [2].


    According to research, several changes that occur in brain related with Alzheimer’s
    start showing symptoms at the age of 20 before the symptoms are visible. After
    developing early changes, the brain tries to recover it in order to perform the
    functions properly. When the disease gets worse, the brain is not able to recover
    instantly and then the person starts showing symptoms like the loss of cognitive
    functions [3].


    # 5.4 MILD COGNITIVE IMPAIRMENT


    Mild cognitive impairment (MCI) is a state in which individuals show benign but
    noticeable changes that are easily perceptible to the family others. Despite this
    condition, individuals are able to perform daily activities. MCI affects 20% of
    the individuals under the age of 65. The people who are suffering from MCI are
    more likely to develop Alzheimer’s rather than those without MCI [3].'
