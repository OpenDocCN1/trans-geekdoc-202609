    # 5.8.1 AMYLOID PRECURSOR PROTEIN


    The specific gene for amyloid precursor protein (APP) is located on chromosome
    21 in humans that comprises 19 exons, and in DNA, it spans approximately 240 kbp
    that plays a vital role in cell synaptic development, neuronal injury, iron export,
    and repair mechanism [8–12]. Mutation in APP gene causes proteolysis of this gene
    product and results in the formation of amyloid plaques [13–15]. APP and Aβ are
    the two potent indicators of AD, which are normal products of neuronal protein
    generated by the sequential process of proteolysis through the enzymes beta and
    gamma secretase that cut specifically at beta and gamma sites of APP. Patients
    who are generally suffering from Down syndrome usually have a high risk of AD
    because both the diseases occur due to changes in chromosome 21. APP undergoes
    certain post-translational modifications like tyrosine sulfation, glycosylation,
    sialylation, and other proteolytic processes to generate peptide fragments [16].
    It has been found that the translation of APP mRNA can be disrupted by changing
    a single nucleotide in the 5′UTR region of APP (single nucleotide polymorphism)
    [17].


    # 5.8.2 PSEN-1 AND PSEN-2 GENES


    Gene for Presenilin-1 and Presenilin-2 is located on chromosome 14 which determines
    the activity of β-secretase that is responsible for proteolysis that usually takes
    place in the APP and other NOTCH receptor-related proteins [18–20]. These genes
    are protagonist in structure, having 13 exons in which 10 exons consist of a coding
    sequence, whereas on the 4 different exons, the 5′ UTR region is present [21–24].
    The PSEN-1 gene contains CAAT box, STAT elements, and TAAT box in its promoter
    region that is responsible for the activation of transcription process that depends
    on signal transduction [24]. The proteins encoded by these both genes display
    67% similarities to each other [25–27]. In the case of PSEN-1, intronic polymorphism
    has been observed between exonS 8 and 9 that display a remarkable affiliation
    with late-onset disease [28]. However, several different dataset studies display
    different reports to confirm the association, but there are other reports too
    that give no description about association [29–35].'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# 5.8.3 TAU GENE


    Tau is a protein (phosphoprotein) that plays a potent role in the stabilization
    of neuronal structure and maintains the microtubule stability [36,37]. The gene
    that controls the production of protein tau is located on chromosome 17, which
    when gets mutated results in the development of neurofibrillary tangles inside
    the neurons, which in turn interfere the flow of information among the cells.
    Alternative splicing of a microtubule-associated protein tau (MAPT) gene results
    in the formation of tau proteins [38,39]. The changes in the post-transcriptional
    modification processes thus result in the excessive phosphorylation of tau into
    an abnormal form called neurofibrillary tangles [40]. In AD, phosphorylation usually
    occurs in 19 amino acids at serine position 119, 202, 409, 396 and threonine at
    231 [41,42].


    # 5.8.4 APOE GENE


    Apolipoprotein E consists of 299 amino acids that play a major role in neuronal
    protection and also in the lipid haemostasis [43–45]. There are three different
    major alleles found in the brain, e2, e3, and e4, according to their respective
    positions 112 and 158. The positions of wild-type e3, e2, and e4 are Cys 112 and
    Arg 158, Cys 112 and Arg158, and Cys 112Arg and Arg158 [46–48]. The most frequent
    allele is e3 that is found in most old adults, whereas e4 is observed mostly in
    AD patients [49–51]. Allele e4 is recognized as a genetically risk factor of AD
    [52]. The expression frequency of allele e4 has been observed highest in the study
    of Nigerian population with less prevalence of AD among them, which may be associated
    with low levels of cholesterol [53–56]. In a number of studies, it has been observed
    that e2 allele plays a protective role in AD [57,58] (Figure 5.1).


    # 5.9 BLOOD–BRAIN BARRIERS


    For the effective drug delivery to the target site, drugs should have potential
    to cross the blood–brain barriers (BBB) so that it could reach the target site,
    but BBB


    ![](img/7bb239370082cb34554bae1e45e2b0d7_97_0.png)


    FIGURE 5.1 Estimated allelic frequencies related to the APOE gene in humans in
    case studies associated with Caucasian population [58].'
