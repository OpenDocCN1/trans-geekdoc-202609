  md: '# 3.5 IoT Wearable Sensors


    Smart sensors that can be used as external attachments, inserted in clothes and
    dresses, inserted in the body, or even adhered to or covered in tattoos on the
    skin are all examples of IoT-enabled wearable devices. These devices can connect
    to the network in order to store, transmit, and retrieve data which can be used
    to make informed decisions. Wearable devices are becoming a bigger part of IoT,
    and they’re evolving from basic gadgets to more advanced and realistic applications.
    For communication and computing, smart wearables may communicate with a variety
    of other gadgets, such as smartphones.


    The wearable IoT system for health is mostly used for remote healthcare control,
    and in certain cases of recovery. Until uploading the user/health patient’s information
    over the Internet for further study, the devices capture health-related data,
    and the system can conduct limited computing. Data can also be received by the
    system, allowing the individual to create additional decisions. In several implementations,
    wearable sensors are linked to devices to monitor the data gathered and then transfer
    it to a CC system like Microsoft Azure or Amazon Web Services (AWS) for storage,
    processing, and analysis.


    Mobile wellness apps can be used to visualize examined data and offer information
    about a person’s or patient’s wellness. Furthermore, the examined data may be
    used to transmit special instructions to the wearable devices, like heating the
    body or delivering a shock, in treatment processes [31,32] (Figure 3.5).


    **Vital sign monitoring**—Body temperature, respiratory oximetry, and oxygen saturation
    are the key vital signs that medical practitioners and healthcare services track
    on a regular basis.


    **Non-vital monitoring**—Non-invasive evaluation is what non-vital symptoms surveillance
    entails.


    The following parameters, such as respiration rate and sugar levels, may be tracked.


    ![](img/7bb239370082cb34554bae1e45e2b0d7_66_0.png)


    FIGURE 3.5 IoT healthcare wearable sensors [31].'
