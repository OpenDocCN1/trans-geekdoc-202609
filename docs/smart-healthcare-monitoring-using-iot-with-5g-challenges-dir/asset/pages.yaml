    # 4.1 INTRODUCTION


    The modern environment shows an increased need to transform natural world objects
    into virtually intelligent objects. Intelligent systems, assemblies of interconnecting
    intelligence hoists, have integrated into the integrity surrounding us for good.
    Prof. John McCarthy (1929–2011) in the mid-1950s defined artificial intelligence
    (AI) as the science and engineering of creating intelligent machines, brilliant
    computers, to use humans’ intelligence. Nevertheless, AI is not limited to biologically
    observable methods. McCarthy defined intelligence as the computational part of
    achieving goals in the world [1].


    The phenomenon of AI described in this way remains unchanged to the present day,
    and on its basis, new concepts, methods, and IT tools are created that enable
    full or partial support of human-implemented processes. Among them, the following
    can be distinguished [2]:


    +   - **Data mining**—Methods of data mining involving the discovery of new, potentially
    useful patterns from large datasets and the use of algorithms to extract hidden
    information [3].

    +   - **Machine learning**—Learning systems in which changes in the value of their
    parameters occur autonomously and based on experience and lead to the improvement
    in the quality of their operation [4].

    +   - **Decision support systems** [5].

    +   - **Natural-language processing (NLP)**—Computer methods of understanding
    and deriving information from natural human language, i.e., that is used in everyday
    life by people [6].'
  merge: -1
  img_proc: true
- pgno: 72
  md: '+   - **Expert systems**—Expert systems that can collect and process enormous
    resources of knowledge and carry out inference processes that enable the formulation
    of answers to the questions asked [7].


    The Internet of Things (IoT) is also a response to this challenge of modern information
    technologies and AI. Its goal is to unify all fundamental elements and place them
    in a shared infrastructure, which will allow not only to control the environment,
    keep informed about the state of affairs but also have a huge impact on management
    [8]. Due to the dynamic development of devices with access to the Internet, the
    idea of the IoT has become not only natural but is also even indicated as one
    of the key growth drivers of the future global economy and management. The scale
    of IoT solutions’ application is enormous: from clothing, intelligent home appliances,
    building automation, and smart cities to management, defense systems, and health.


    # 4.2 DEFINING THE IOT


    The name IoT was first used in the 90s of the last century. British entrepreneur
    Kevin Ashton first used this concept in 1999. He described this phenomenon as
    a mutual cooperation of devices gathering, processing, and transmitting data between
    each other [9]. This cooperation in communication takes place without human intervention,
    which allows for systematic automation of processes and autonomous decision-making.
    He emphasized that the information powering computers and the Internet comes entirely
    from humans, and from the very beginning, all the data describing things and phenomena
    on the web was created and recorded by humans. The problem, however, is that man
    has limited time, attention, and precision, which is why he is not the best at
    collecting data about objects of the surrounding world.


    Meanwhile, it is on these objects (things), not on ideas, that the economy, society,
    and generally understood existence are based. Therefore, it is necessary to use
    computers to observe, identify, and understand the world without the limitations
    of human imperfection [10]. Communication devices without the human factor differ
    from the typical industrial systems because it is the idea of generally available
    and common network connected more and more new things, in suitably equipped and
    functional stand-alone sensors.


    The IoT became an increasingly well-known concept globally that concerns ordinary
    everyday human life in society and has countless application possibilities. The
    development of the IoT was initially based on the needs of large corporations
    that wanted to get the most significant benefit from the management and predictability
    provided by the ability to track all objects in the chains of cooperation in which
    these companies were involved [11]. Object coding and tracking capabilities have
    enabled enterprises to increase their productivity, improve their management,
    accelerate processes, reduce errors, prevent theft, and implement a comprehensive
    and flexible system organization using the IoT [12]. The IoT is, therefore, a
    technological revolution that represents the future of information technology
    and communication and that is developed depending on the dynamics of technological'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'innovation in a diverse environment, because regardless of the area in which
    it is applied, it allows each object to be marked for identification, automation,
    monitoring, and control.


    The available literature in information technologies does not indicate a clear
    and consistent definition of the term IoT. However, based on the existing literature,
    it can be indicated that the IoT is a kind of ecosystem in which objects equipped
    with sensors communicate with computers [13]. Additionally, in this ecosystem,
    objects can communicate with or without human involvement [14].


    The IoT enables objects/things to take an active part in human environment, for
    example, by making information available to other users or members of the network
    wirelessly, using the same IP protocol that connects the Internet. In this way,
    objects/things can independently recognize events and changes taking place in
    their environment and autonomously take appropriate action or reaction without
    human intervention [15].


    Speaking of the development of the IoT, we are talking about a wave of innovations
    using a network of intelligent objects (objects equipped with the ability to process
    data and cooperate), the essence of which is not only to meet the needs known
    today. As was the case with the first ‘Internet revolution’, we are also dealing
    with creating new application areas, unexpected consumer behavior, and new management
    models [16]. This is undoubtedly an area of great opportunities and significant
    risk inherent in mass waves of innovation. When defining the IoT, one should consider
    the prospects of its use and its structure and functionality.


    The definitions of the IoT from the perspective of use in services, interoperability,
    and technology with different approaches are presented by many authors in the
    literature [17], and they are summarized in Table 4.1.


    However, considering the aspects of construction and functionality, the IoT can
    be defined from a technological and architectural perspective.


    # TABLE 4.1

    Definitions of the IoT from different perspectives and approaches


    | Perspective | Approach | Definition |

    |---|---|---|

    | Services | IoT as a business ecosystem | A set of services using objects capable
    of collecting and processing information (interacting), networked, ensuring interoperability
    and synergy of applications. |

    | Interoperability | Internet of everything | Consumer devices and products are
    connected to the Internet and equipped with extensive digital functionalities.
    The concept assumes that technology’s future is the cooperation of devices, objects,
    and applications in the global network. |

    | Technology | IoT | A network of physical objects containing built-in technology
    allows for communication, observation of phenomena, manipulating the internal
    state of objects, and influencing their surroundings. |'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'In terms of technology, IoT is a network that connects devices with a wired
    or wireless connection, characterized by autonomy (not requiring human involvement)
    to obtain, share, process data, or interact with the environment under the influence
    of these data. It is a concept of building telecommunications networks and highly
    dispersed information systems that can be used, among others, to create intelligent
    control and measurement systems, analytical or control systems, practically in
    every area of life, economy, management, or science [18].


    The architectural approach defines the IoT as a concept of IT architecture that
    enables cooperation (interoperability) of various ICT systems supporting various
    domain applications and is based on the following layers [19]:


    +   - **Equipment**—Devices (or items equipped with them), in particular sensors,
    actuators, controllers, smartphones, tablets, laptops, or computers, can communicate
    and process data without human involvement or limited interaction.

    +   - **Communication**—Telecommunications infrastructure and telecommunications
    network (wired or wireless), operating based on any data transmission standards
    with any range (here the Internet).

    +   - **Software**—IT systems of IoT devices and software for data exchange, processing,
    system management, and security.

    +   - **Integration**—sets of defined IT services ensuring software interoperability
    at all architecture levels.


    According to the business and management definition, the IoT is an ecosystem of
    business and management services, using objects capable of collecting and processing
    information (interacting), connected in a network, ensuring interoperability and
    synergy of applications [20]. Combining IoT products/services allows us to understand
    better the consumer, environment, products, and processes identify critical events;
    and react to optimize immediately or, more precisely, personalize.


    The problem of standardizing nomenclature and definitions was also dealt with
    by the European Commission. In the study entitled IoT. Position Paper on Standardization
    for IoT technologies from January 2015, prepared by the European Research Cluster
    on the IoT, IoT is defined as a dynamic global network infrastructure with self-configuring
    capabilities, based on standard and interoperable communication protocols in which
    physical and virtual ‘things’ have an identity, physical characteristics, and
    a virtual personality, use intelligent interfaces, and are seamlessly integrated
    into the information network [15].


    According to the Cisco Internet Business Solutions Group (IBSG), the IoT concept
    describes four main elements that interact with each other in a network: people,
    data, processes, and things [21]. The basic architecture of IoT is presented in
    Figure 4.1.


    All elements of the IoT are connected via the Internet and provide direct communication
    [22]:


    +   - People to people (P2P).

    +   - Machines to people (M2P).

    +   - Machines to machines (M2M).'
  merge: -1
  img_proc: true
