    From the above, we may conclude that big data and AI technologies are important
    in combating the pandemic in different ways. The significant approaches are:


    +   i. Forecast of outbreak.

    +   ii. Tracing and detection of spread.

    +   iii. Detection and therapy.

    +   iv. Drug and discovery of booster dose.


    Learning-based approaches such as DL have also been found to be useful in virus
    centric modeling, grouping, and approximation. AI supports smart problem-solving
    tools for projecting successful and secure COVID-19 drug/booster dose design,
    which would be useful from both a science and a financial standpoint.'
