    From Figure 7.1, it is found that the 56-layer network gives more error percentage
    than that of a 20-layer network in the case of both training and testing data.
    The decrease in gradients due to backpropagation turns out to be the de-accelerating
    of the deep network algorithms with the increase in layers. Hence with an increase
    in the number of layers increases the error percentage in both training and testing
    data. Therefore, adding more layers on top of a network degrades the performance
    of the network. Since the error percentage of 56-layer networks lacks training
    and testing data, overfitting is not considered an issue. Instead, the network''s
    initialization, optimization function, and vanishing gradient problem may be an
    issue [43].


    The basic concept of ResNet is to initiate "identity shortcut connection," which
    helps to skip one or more layers in the system, as shown in Figure 7.2.


    The stacking of identity mapping over the present network does not deteriorate
    the network performance, maintaining the architecture performance [23]. This means
    that deeper models are more training error-free than their shallower counterparts.
    Thus, the fitting of stacked layers to residual mapping is more spartan than the
    direct fit of desired underlying mapping. Hence, we may say residual blocks make
    it easier for layers to learn identity functions. The use of ResNet has significantly
    improved the performance of neural networks with one or more layers.


