    WHO COVID-19 REPORTS Weekly epidemiological update on COVID-19 - 10 August 2021
    (who.int). As of April 2, 2020, it has overtaken 205 countries with 900,306 confirmed
    cases and 45,693 deaths [1,2]. On December 31, 2019, the office of the World Health
    Organization (WHO) of China was informed about the pneumonia cases associated
