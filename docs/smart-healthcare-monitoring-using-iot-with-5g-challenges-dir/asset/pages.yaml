  md: 'application. A considerable number of users compete with each other, for example,
    who will run more kilometers in a predetermined time [65].


    Some mobile applications to function correctly need additional external devices
    that monitor vital functions, such as pulse, blood pressure, respiratory rate,
    blood oxygenation. Their data collection is automatic, convenient, and continuous.
    This way of collecting data reduces the risk of errors. The part of the body for
    which most devices are produced is the wrist, for which as much as 55% of complementary
    devices are developed. The chest is in second place with 23% of devices. Other
    devices are prepared to be placed on the arms, head, clothes, legs. Devices that
    read vital signs from the ear, where they are unnoticeable, are becoming more
    popular. It is possible thanks to the progressive miniaturization of these devices
    [63].


    Also, the design of devices and applications for IoT in healthcare takes into
    account a number of factors and elements that both medics and patients pay attention
    to. In 2014, a study was carried out to identify users’ expectations regarding
    health applications [66]. These expectations of what patients and carers want
    from health apps are presented in Table 1.3.


    Carried around, wireless and mobile monitoring systems may become the best possible
    solution for many patients living far from healthcare facilities, whose vital
    parameters should be monitored on an ongoing basis. Such remote monitoring is
    a convenient and comfortable solution. It is associated with a reduction in costs
    and time. Constant monitoring allows for an earlier detection of possible irregularities.
    It enables immediate medical help in emergency situations, such as immediate drug
    administration or transport to the hospital. The time needed to make a diagnosis
    is reduced. It is also crucial that these devices are user-friendly, easy to wear,
    and intuitive to use. They should be highly acceptable for both the patient and
    the doctor. They will improve the process of data collection and flow, being the
    link between the patient and the doctor. Ultimately, however, they will not replace
    a specialist [67].


    The use of IoT in healthcare technology seems to be an extremely beneficial solution
    for both medicine and patients [68]. Meanwhile, there are not only advantages
    to using this type of solution, but there are also many barriers, as summarized
    in Table 1.4.


    Thanks to the use of modern technologies, it becomes possible to search vast collections
    of medical data in search of regularities and anomalies occurring in this data.
    Automatic search for recurring anomalies allows the finding of unknown dependencies
    in the development and consequences of diseases [69]. This is, for example, useful
    for clinical trials thanks to the ability to integrate and share the results of
    diagnostic tests obtained from patients. Such actions would accelerate the progress
    of medicine. The companies conduct clinical trials, the results of which are available
    only in their databases. Generally available medical data on a large number of
    patients who provide their medical data voluntarily would enable faster and cheaper
    disease detection and treatment [70]. The researchers emphasize that immediate
    data sharing will reduce the time needed to collect it when compared to traditional
    clinical trials. All this is to lead to a better understanding of the causes of
    disease and improvement in patients’ quality of life [71].'
