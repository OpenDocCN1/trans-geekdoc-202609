    solutions for COVID-19, yet the detection of the patients by means of processes
    other than RT-PCR is still within research. The detection process using X-ray
    and CT-scan images is still referred to as an additional measure to the RT-PCR
    test. This chapter reviews the AI application in the area of deep learning algorithms
    with the stress into the rapidly explored method ResNet for COVID-19 analysis.
    The robustness of ResNet provides promising results, but still there is room for
    improvements. The chapter review provides discussion based on the taxonomy considered
    for the classification of the methods. The methods are primarily classified into
    the pretrained model, where the already -trained models with the similar type
    of the disease are retrained with the addition of COVID-19 data. The second method
    is the customized deep learning method to train the systems from scratch. The
    review also provides insights into the databases, which are publicly available
    for evaluation, and it is expected to be of great help for the researchers working
    in the area. The limitations in the present study are also outlined with respect
    to non-uniform valid databases and the hazards caused due to the lack of real-time
    COVID-19 data, which are a high necessity for the deep learning methods. The nonavailability
    of gold standards for evaluation is also reported. Further, the probable solutions
    and outcomes were also discussed. Although the deep learning algorithms on medical
    images for COVID-19 can be considered an additional measure of identification,
    in recent times they may also provide highly efficient and faster solution to
    the conventional RT-PCR screening. If not then, at least with early detection
    with AI, they may be helpful in reducing the spread of the virus.'
