    under age 50, and higher in people with chronic comorbid conditions [18].


    # 8.6 CRITERIA FOR DIAGNOSIS


    SARS-CoV-2 preliminary identification was done by electron microscopy in the viral
    research institute (China) to examine its morphology. So far, another golden clinical
    approach for COVID-19 diagnosis is the detection of the nucleic acid in respiratory
    tract samples, nasal swabs, and throat samples by using RT-PCR. Further confirmation
    is done by next-generation sequencing [4].


    # 8.7 AVAILABLE CLINICAL THERAPIES FOR COVID-19 PATIENTS


    Till now, no therapeutic drug is approved by US Food and Drug Administration (FDA)
    to treat or prevent COVID-19. Current approaches in clinical management to somehow
    control the disease include the control and preventive measures with supportive
    care, along with supplemental oxygen or mechanical ventilator support when needed.
    A number of different antiviral drugs are being used to treat COVID-19 infection,
    for example, remdesivir (intravenous antiviral drug) that has activity against
    SARS-CoV-2 in vitro. Chloroquine and hydroxychloroquine are under clinical trials
    for pre- or post-exposure of SARS-CoV-2 infection prophylaxis. Other drugs are
    also under clinical trials. Numerous immunotherapies, antiviral agents, and vaccines
    are being explored and developed as potent therapies [19,20].


