  md: 'The Americas Region (14%) and the Western Pacific Region (19%) reported the
    largest increase in the proportion of new cases, reporting 1.3 million and more
    than 375,000 new cases, respectively. In addition, the number of new deaths reported
    in the Western Pacific Region increased significantly this week (46%). Of the
    228 member states and territories, 38 (17%) reported a 50% increase in new cases
