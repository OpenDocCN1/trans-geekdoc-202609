  md: '# 6.5.2 TAU HYPOTHESIS


    Neurons contain tau proteins that play a vital role in the stabilization of microtubules,
    to maintain cellular morphology and axonal transport [38]. The aggregation and
    accumulation of tau proteins in the form of neurofibrillary tangles leads to the
    neurodegeneration [39]. Tau protein loses its normal function when the paired
    helical filament undergoes hyper-phosphorylation that badly affects the frontotemporal
    lobe due to neuronal damage [40]. Interestingly, advanced researchers have demonstrated
    that a high dose of antioxidants decreases the tau hyperphosphorylation [41].
    It has been observed that DNA damage increases in double in the neuronal cells
    in the case of AD patient than normal individuals, and it might be an earlier
    sign of disease that can be used as a biomarker for further studies [42]. The
    formation of neuritic plaques in the brain is considered a potent sign of developing
    disease [43].


    # 6.6 REDUCTION IN ANTIOXIDANT ENZYMES IN BRAIN


    Antioxidants enzymes such as superoxide dismutase, glutathionine peroxidise, and
    catalase play potent roles in order to prevent the accumulation of free radicals,
    thereby reducing lipid peroxidation [44]. Reduction in these enzyme levels leads
    to accumulation of reactive oxygen species (ROS), which ultimately damage mitochondrial
    proteins.


    # 6.7 ROLE OF PHYTOCHEMICALS OR POLYPHENOLS


    Phytochemicals are the plant-derived chemical molecules found in a variety of
    sources like green tea, red wine, fruits, and vegetables [45]. Several polyphenols,
    like isoflavones, show specificity toward only one individual specific group of
    food, specifically found in soya, whereas other chemicals like quercetin have
    been detected mostly in all plants [45]. Various numbers of different phytochemicals
    are used for the treatment of AD on the basis of varied antioxidant properties.


    # 6.7.1 CURCUMIN


    Curcumin is used traditionally in several Indian dishes like curry powder as a
    spice to enhance the flavor of the dishes and is isolated from Cucuma longa (turmeric)
    [46]. Interestingly, according to different reports, it has been found that AD
    prevalence between the age of 70 and 79 years in India is less about 4.4-fold
    than the United States, which indicates that curcumin-rich diet reduces the effect
    of AD at a certain level [46]. Considerably, the evidences have been found from
    in-vivo and in-vitro studies that represent antioxidative, anti-inflammatory and
    anti-amyloidogenic properties having the potential to reduce the risk of AD [47,48].
    In addition, when chronic supplementary curcumin was given to transgenic mice
    (Tg2576) that was 16 months old, reduction in the concentration of beta amyloid
    was observed [49]. In ayurveda, curcumin is widely used as an anti-inflammatory
    agent to reduce pain in muscles and has anti-cancerous properties, too. But due
    to more advancements in science, it has been proved that turmeric'
