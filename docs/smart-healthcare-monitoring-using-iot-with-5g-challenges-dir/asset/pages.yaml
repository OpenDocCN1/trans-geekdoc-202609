    # 6.7.4.1 Role of Quercetin in Neuroprotection: In Vivo Studies on Humans and
    Animals


    Extensive evidence supports the role of quercetin as a neuroprotective agent and
    antagonistic agent for the oxidative stress [65–67]. Quercetin when taken orally
    protected the rodents from neurotoxicity that is generated due to oxidative stress
    [68–70], and it also provided protection from metal toxicity like methyl mercury,
    tungsten, and lead (Table 6.2) [71–74].


    F: female; GPx: glutathione peroxidase; M: male; MeHg: methylmercury; MPTP: 1-methyl-4-phenyl-1,2,3,6-tetrahydropyridine;
    PCBs: polychlorinated biphenyls; PND: postnatal day; SOD: superoxide dismutase.


    Still research studies should focus on the signaling mechanism, including signal
    transduction pathways, mitochondrial integrity, and proteasome functions and pharmacokinetic
    effects of quercetin.


    # 6.7.5 EGCG (Epigallocatechin-3-Gallate) and FA (Ferulic Acid)


    The green tea and carrots contain crucial polyphenolic compounds that help cure
    memory impairments. The different structural catechnins extracted from tea are
    shown in Figure 6.6 [75]. The regular uptake of these dietary components in a
    daily diet may help in the reduction of the symptoms of AD according to recent
    study reports. While this study has been focused on the two potent components,
    epigallocatechin-3-gallate and ferulic acid, that are found in carrots and green
    tea, and mice having Alzheimer’s symptoms were used as a model to determine the
    effects of these two components. The nutraceuticals have promising anti-amyloidogenic
    properties. For this study, transgenic mice were used as a study model which expressed
    human APP and presenilin 1 to check amyloidosis. EGCG and ferulic acid (30 mg/kg
    each) were given orally to the 12 months old mice with continuous observation
    for 3 months regularly. After 15 months, the combined effects of EGCG and ferulic
    acid were evaluated and were found to reduce or show a reversal of cognitive impairments”
    in these tests. Thus, the combined use of EGCG and ferulic acid has the most promising
    approach for treating Alzheimer’s [76,77].


    # 6.7.6 SUPPLEMENTATION OF CHOLINE


    Choline is an essential vitamin taken as a dietary supplement and is also found
    in certain foods. Choline is needed to maintain structural integrity in plants
    and animals. It is also a source of methyl groups that are required to perform
    a number of metabolic functions. It, when combined with an acetyl group, forms
    acetylcholine, a crucial neurotransmitter that helps in signaling processes of
    the brain by maintaining cognitive functions and maintaining expression of genes.
    Moreover, choline provides protection toward Alzheimer’s by reducing the level
    of neurotoxin and homocysteine (amino acid) a risk factor of Alzheimer’s. A number
    of studies have evaluated the elevated levels of homocysteine in AD patients that
