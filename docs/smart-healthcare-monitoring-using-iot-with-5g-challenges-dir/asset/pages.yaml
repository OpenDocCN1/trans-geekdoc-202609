    # 3.2 LITERATURE SURVEY


    In homes, engineering, community, and vehicles, technology has improved. Healthcare
    is one of the areas where emerging technologies often require attention and development.
    By applying various approaches and technology, different scholars have made different
    analyses on healthcare challenges and their monitoring methods.


    Stephanie et al. [1] presented a specific paradigm for potential work in this
    chapter. Healthcare programs based on IoT can be extended to all general structures
    and processes that track specific situation. Authors then provided a concise and
    structured description. State-of-the-art works owe to each aspect of the suggested
    model. Numerous portable, non-intrusive detectors, especially those measuring
    blood pressure, heart rate, and oxygen levels, were studied and discussed. Mrinai
    et al. [3] provides information on research studies and disease monitoring, exercise
    management, pediatric, private health, and elderly care management. The IoT medical
    field is resourceful, and safety, protection, accessibility, resource allocation
    are the most critical elements.


    Pace et al. [11] proposed INTER-Health framework aims to impose an interactive
    IoT framework for the decentralized smartphone tracking of the lifestyle of people
    to prevent health problems emerging from nutrition and physical activity disorders.
    This screening process can be delegated from the health center to the homes of
    the tracked individuals, and assisted by the use of on-body physical activity
    sensors during mobility.


    Inderpreet et al. [12] presented the structure of the sensors to easily demonstrate
    how the sensors perform in the healthcare sector. The cloud server receives the
    information, and then the information is transmitted to the web servers, then
    interconnected with a gateway with the support of WiFi or modem, and then transfers
    data to the single SoC platform with the support of the sensor nodes. Further,
    transmitting the information to the 6LoWPAN server then transferring information
    to the star-based 6LoWPAN health sensor and connecting this entire device or architecture
    to the Internet browser with the help of smartphone, phone, computer, one can
    quickly download the information and see all the information one needs.


    Further, Adarsh et al. [13] introduced a strategy that makes use of Healthcare
    4.0 to secure central authority from disease and implemented a decentralized technique,
    device and data protection, capacity enhancement, simple data maintenance, and
    offered comprehensive healthcare monitoring functionality. To improve the quality
    of the entire system and subsystems, a simulation optimization technique is implemented.
    Through experimentation and execution, the suggested solution is evaluated, checked,
    and verified.


    Deepak et al. [14] developed IoT-based intelligent medical care to avoid the isolation
    of a patient to an observation area. A patient can get a therapy plan tailor-made
    for his bodily needs in this method. The purpose of this technique is the'
