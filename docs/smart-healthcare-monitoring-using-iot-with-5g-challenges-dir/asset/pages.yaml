  md: '# 5.5 NEURAL MECHANISM


    During AD, numerous brain cells get affected and the numbers vary with respect
    to different regions by the expression of neuropeptides and neurotransmitters,
    including claustrum, substantia nigra, striatum, thalamus, locus ceruleus. Due
    to degenerative process, usually cells come under this process and thus loss of
    neuronal cells as a result of cellular atrophy. The pathobiology of this subtle
    disease also has potential to affect the non-neuronal cells like microglia, astrocytes,
    oligodendroglia, blood vessels, choroid plexus. The AD models of transgenic mice
    showed that the presence of amyloid plaques in the brain tissues has a great potential
    to disturb the normal brain functioning due to the loss of dendrite spines or
    synaptic dysfunction. Postmortem studies of brain tissues illustrated that individuals
    who suffer from this deadly disease usually have a strong decline in dendritic
    spines and density of synapses in the hippocampus region of the brain relative
    to normal brain tissues. Loss of dendritic spines is directly co-related with
    the worsening mental status and also acts as an indicator of disease [4].


    # 5.6 PATHOBIOGENESIS


    For the detailed explanation of AD, different hypotheses have been given: (a)
    Aβ amyloid hypothesis, (b) lysosome hypothesis, (c) calcium dysregulation hypothesis,
    (d) A-β amyloid oligomer hypothesis, (e) the tau hypothesis. Among all of these,
    amyloid hypothesis is the best studied one, on the basis of multiple reports that
    explain the weak interrelationship between A-β deposition in the brain, loss of
    neuron (neuronal atrophy), and cognitive impairments. In 1984, two scientists,
    George Glenner and Caine Wong, discovered the basic mechanism of Alzheimer’s by
    isolating multiple forms of meninvascular Aβ by proteolytic cleavage from protein
    amyloid precursor protein (APP). Thus, Alzheimer’s pathobiology is directly associated
    with the presence of Aβ peptide that results in spine instability and functional
    deficit in neuronal structures [3]. Toxic protein formation (amyloid and tau protein)
    and involvement of other non-neuronal cells like microglia cells act as macrophages
    to remove unwanted material from the brain to maintain normal functioning of brain
    [5].


    # 5.7 IMPAIRMENT IN MITOCHONDRIA LEADS TO PRODUCTION OF REACTIVE OXYGEN SPECIES


    Due to high metabolic activities in the brain, neurons require enormous energy
    for performing normal functions of the brain that are specifically carried out
    in the presence of mitochondria in the brain tissues through oxidative phosphorylation,
    during which reactive oxygen species (ROS) are generated in tremendous quantity,
    and then increased level is conventionally offset by the normal process of homeostasis
    in mitochondria. Aβ is a potent solitary molecule that has a great tendency to
    develop huge numbers of small clusters having potential to move freely in the
    brain and then ultimately form plaques which are indications (hallmark) of AD.
    Aβ molecules have the ability to penetrate the plasma membrane and come into contact
    with defective internal proteins of mitochondria, which causes the decline in
    the'
