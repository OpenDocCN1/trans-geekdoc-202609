  img_proc: true
- pgno: 260
  md: 'Vaishya et al. [12] provided seven aims of AI in COVID-19 pandemic. They are
    early detection and diagnosis of the infection, monitoring and treatment, contact
    tracing of the individuals, projection of cases and mortality, development of
    drugs and vaccines, reducing workload of healthcare workers, and prevention of
    disease. It should be noted that reducing the workload is a general category as
    the objective of AI is to reduce the workload of the people. All these studies
    show that there are similarities between the aims of all of the studies. In a
    study by Agbehadji et al. [13] also provided two aims that are similar, and they
    are: case detection and contact tracing. Thus, after analyzing the available literatures,
    the elements are coded into nine aims that relate back to the three segments of
    contact tracing. They are: (1) screening; (2) early warning and alert; (3) tracking;
    (4) prediction; (5) diagnosis; (6) prognosis; (7) monitoring, treatment, and cure;
    (8) societal control; and last but not least (9) asset optimization and tracking.
    Screening is to basically classify people who are COVID-19 positive from the vast
    amount of people who have come for medical checkups. It is crucial because more
    than half of the people who are infected by the virus do not display any symptoms.
    Yang et al.[14] stated that 48% from the infected patients in Wuhan, China, do
    not exhibit symptoms. Similarly, a study by Nir Menachemi reported 45% of people
    who are COVID-19 positive are asymptomatic [15]. Not limited to identification,
    screening also classifies the severity of the infection in a rapid manner from
    a huge pool of people. As for the early warning and alert, it is where the AI
    will try to predict early potential outbreaks and its severity. This is important
    so that if an outbreak occurs, it can be contained in a faster manner.


    Apart from that, screening also detects anything virus related to provide warnings,
    such as the trend and rate of mortality. Tracking is basically the contact tracing
    solutions in identifying the patients as well as the people to whom they have
    spread, to stop the outbreak. In addition to that, a solution that is able to
    cater for symptomatic and asymptomatic cases will be an added value. After this,
    forecast model helps in the prediction that is based on the consequences arise
    when patients were infected due to mortality and transmission rate. In a major
    outbreak situation where everything is in chaos, prediction helps a long way in
    reducing the resources for random mass testing, which may not be available [16].
    Next is the diagnostic, which means to identify the source of infection. Although
    this item can be combined with tracking, most of the current world contact tracing
    solutions have separated it since it is hard to do backward tracing or the identification
    of the source of infection. This is the reason that diagnostic is separated from
    tracking.


    *Prognosis* in this case can be considered as the higher level of *tracking*,
    where it analyzes the path of outbreaks by analyzing their trend. The main difference
    between them is that *tracking* is focused on identifying close contacts of the
    patients up to a point that the chain of infection is closed theoretically. *Prognosis*
    predicts the future state of the outbreak by analyzing the patterns, growth rates,
    and so on. *Monitoring, treatment, and cure* is basically for the AI to be able
    to provide required medication based on the symptoms and health conditions in
    easing up the quarantine centers. Not limited to that, it also monitors as well
    as predicts recoveries, identifies infected regions, and forecasts potential reoccurrences
    using AI. Next is the *societal control*, where the objective is to help the movements
    of the people going to specific quarantine centers. When the number of daily cases
    is high, it becomes complicated to'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'manage and make decisions on where to send the patients for quarantine. Not
    just that, it is also meant to provide answers for where to send the patients
    based on the capacities of the centers, its equipment utilization, the number
    of front liners, medication resources, and many more items. It should be noted
    that during emergencies, these matters are a critical issue. Last but not least
    is the *asset optimization and tracking*, which is quite similar to the previous
    aim where it focuses on humans. This aim optimizes assets utilization with AI
    during the pandemic period.


    As stated previously, pandemic period is where resources are being utilized at
    the maximum capacity for a prolonged period, and hence it is important to optimize
    the usage so that there will be less delays and less problems that popped out.
    The assets can be infrastructure-related such as the number of beds and available
    ventilators and can be wearable-related such as the availability of PPE suits
    and washable gowns. With all these aims identified, they are then directed back
    to the contact tracing segments that they relate to. Table 13.2 shows the aims
