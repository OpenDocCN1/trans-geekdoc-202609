    # **5.18 NO AWARENESS IN INDIA**


    India, having a population around 133.92 crores, is growing at a faster rate,
    out of whom more than 1.6 million people are suffering from this subtle disease,
    and this number is estimated to triple at the end of 2050. Alzheimer Day is celebrated
    on September 21 to create awareness among people about this neurodegenerative
    disease and its dreadful impacts on our daily lives.


    The president of ISCR, Dr. Chirag Trivedi, explains certain impacts of Alzheimer
    disease: In India, population keeps increasing, especially the elder population,
    so the burden of this disease is increasing. More women than men are more affected
    because of lower life expectancies of men. According to a *Lancet* study in 2016
    on healthy life expectancy, women have a higher life expectancy than men and indeed
    women spend their lives in disabled conditions facing lots of problems. For the
    proper cure of this disease, clinical research should be modified at an extent
    level [74].


    # **5.19 MYTHS ASSOCIATED WITH AD**


    People have a number of myths related to Alzheimer’s.


    # **5.19.1 MYTH 1**


    Alzheimer and dementia both are the same disease: Dementia is a mental illness
    that results in the reduction in the brain functions, including problems associated
    with memory, language, and reasoning, whereas AD commonly affects the people between
    the age of 60 and 80, that is recognized as a common form of dementia. The common
    symptoms associated with Alzheimer’s are loss of memory, which mostly affects
    individual’s daily life.


    # **5.19.2 MYTH 2**


    Alzheimer’s affects only elder population: AD generally affects the individuals
    under the age of 65, but a number of cases have been identified in which people'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'under the age 40 s and 50 s also come in contact with this disease, the situation
    of early-onset AD. Sometimes, symptoms that appear during AD are similar to symptoms
    associated with aging that can be distinguished from each other.


    # 5.19.3 Myth 3


    Alzheimer is a gene associated disorder: Many genes when mutated result in the
    development of Alzheimer’s. APOE e4’s presence increases the chances of Alzheimer’s,
    usually inherited from parents. Not only genetic factors lead to the development
    of this particular disease, but there are also certain environmental factors and
    daily lifestyle activities responsible for that. The disease affects not only
    those individuals who have APOE e4 genes, but also those who don’t have APOE e4
    genes.


    # 5.19.4 Myth 4


    No preventions for Alzheimer’s: There are no specified methods or techniques or
    drugs available in the market for the prevention of Alzheimer’s. But a number
    of studies have shown that a regular intake of omega-3, vitamins E, B, and C along
    with herbal remedies, selenium and folate and regular exercise can reduce the
    effects of this disease to a certain level.


    # 5.19.5 Myth 5


    Alzheimer’s is not lethal: Alzheimer’s destroys the nerve cells and then creates
    lots of problems in cell signaling pathways specifically associated with the normal
    brain functions that result in the loss of memory and changes in the behavioral
    pattern that can easily be predicted by family members.


    # 5.19.6 Myth 6


    Memory loss is a sign of Alzheimer: Alzheimer’s is responsible for the distorted
    activities that occur due to degeneration of nerve cells, including forgetting
    their names, their way to reach home, their close friends, and the way to communicate
    with the people.


    # 5.19.7 Myth 7


    Suffered from Alzheimer doesn’t indicate a specific sign which associated with
    the death of Alzheimer patient inspite of that Alzheimer patient could survive
    for certain period of times with this disease. Alzheimer does not directly lead
    to death of individuals but inspite of that AD patients could survive upto many
    more years after disease diagnosis. A number of different drugs are available
    in the market that slows down the progression of this disease to a certain extent
    [60].'
