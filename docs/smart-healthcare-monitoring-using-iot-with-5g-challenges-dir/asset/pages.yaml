  img_proc: true
- pgno: 37
  md: '![](img/7bb239370082cb34554bae1e45e2b0d7_37_0.png)


    FIGURE 2.2 Schematic diagram of DTL model.


    # Edge Computing


    Data is collected from a variety of IoT devices, then pre-processed before being
    delivered to the Fog server for analysis and processing, with the Edge providing
    real-time responses. While the cloud houses the core machine and maintains the
    whole database, the Fog constantly uploads only the most relevant data or information
    to the cloud database. Although EC is not a novel concept, it has proven to be
    extremely useful in the recent development of the IoT.


    # 2.4 LITERATURE SURVEY


    Already much work related to application of DL in COVID-19 domains has been reported,
    DL, which is based on Convolutional Neural Network (CNN) for screening COVID-19
    patients using their computed tomography (CT), has been reported with precision,
    sensitivity, and specificity of 89.5%, 87%, and 88%, respectively [32]. Another
    study found that chest X-ray images were 83.5% accurate in screening COVID-19
    cases [33]. To date, several DTL models have been suggested for application in
    COVID-19-related domains. Here a few such works are highlighted. In all such works,
    it is observed that the use of DTL involves the construction of multiple domain-related
    layers by aligning the joint distribution processes that support a common maximum
    mean discrepancy. This can be helpful to establish a transfer network. The authors
    of Ref. [34] suggest that based on the VGG model, a cutting-edge transfer-learning
    model has been developed. For feature extraction, the researchers used the Image
    Net [35] dataset, and for fine-tuning, they used handmark construction images.
    In Ref. [36], authors propose the use of DTL to classify abnormalities in MR images.
    The researchers used a fine-tuned pre-trained ResNet34 model. However, the global
    norm diagnostic microbiology laboratory and related research takes time and money,
    and there are many false-negative results [37]. Around the same time, due to a
    scarcity of services, studies are rarely performed in community health centers
    or hospitals. Medical resource management becomes very complex, and the outcome
    is large numbers of patients are being handled at once. DTL models are thought
    to be ideal for reducing the difficulties in this type of situation [38,39]. Generative-adversarial-networks
    (GANs) can also be used along with'
