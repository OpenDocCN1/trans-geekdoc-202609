    # 2.7 CHALLENGES


    For detecting COVID-19, ML and DL methods are useful as these can learn patterns,
    retain them, and use the learning subsequently. However, in many situations the
    application of ML and DL systems is confronted with significant challenges, such
    as data scarcity, the lack of large-scale pre-trained data, large noisy data and
    false positive labeling, a lack of understanding between medical science and engineering
    fields, data protection, and regulation, to name a few. A few important terms
    are highlighted below:


    +   1. **Regulation**—As the pandemic spreads its tentacles to the nooks and corners
    of the world, the numbers of infected and fatal cases is also increasing. Various
    measures such as lockdown and social distancing have been proposed'
