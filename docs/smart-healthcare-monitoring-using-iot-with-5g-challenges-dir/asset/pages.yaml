    # 5.13.2.2 Vitamin E


    It is a powerful antioxidant and plays a vital role to inhibit the oxidative degradation
    of lipids to cure a number of diseases like Alzheimer’s in which it delays the
    symptoms of that disease. The side effects usually observed are syncope and cataract,
    and the deficiency of vitamin E increases the risk of hemorrhage. Other antioxidants
    that have a huge impact on this disease are selegiline, ginkgo biloba, idebenone.


    # 5.13.2.3 Anti-inflammatory Drugs


    Certain anti-inflammatory drugs, including indomethacin, ibuprofen, prednisone,
    aspirin, have been identified to delay the regular progression of Alzheimer’s
    [62].


    # 5.14 CSF AND PLASMA PROTEIN DEPENDENT BIOMARKERS


    Various different biomarkers are being developed for the proper diagnosis of AD.
    The blood from patient is taken in order to check the concentration of certain
    proteins or ions whose increased or decreased level in the blood helps diagnose
    the disease. It has been found that in AD the level of Aβ-42 decreases with the
    simultaneously raised level of tau phosphorylated peptide protein [76].


    # 5.15 STIGMA


    Public stigma toward the people suffering from mental illness is a worldwide issue
    that shows the marked negative impacts on the individual’s personal life. The
    public point of view toward stigmatised group totally relies on several elements:
    First, they usually have pessimistic beliefs toward the stigmatized group and
    consider them as a stereotype. Second, they show emotional side towards stigmatized
    individuals. Third, they start discriminating these people. General public consider
    stigmatized groups as a sign of danger and start maintaining distance from them
    that results in social isolation [77]. According to the report of NCRB 2016, more
    than 13,200 individuals under the age of 65 were unable to find out their homes
    and then lost (Figure 5.3).


