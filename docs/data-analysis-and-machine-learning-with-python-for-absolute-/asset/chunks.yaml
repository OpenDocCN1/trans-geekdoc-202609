    # 第 8 章 过拟合与欠拟合


    ## 欠拟合

    欠拟合的概念很容易理解，即样本不足、训练不充分，甚至现有数据集（即训练集）中的特征也也没有被很好地学习。当它面对新样本进行预测时，其预测效果自然也就不会好到哪里。有时，也将欠拟合称为高偏差（high
    bias）。


    ## 过拟合

    过拟合意味着模型“细致地”反映了训练数据中的特征，使其在训练集上表现得过于“优秀”。但结果是它预测未知数据（新样本）的能力相对较差，且分类器将不知道是否存在任何问题。因此，有时也将过拟合称为高方差（high
    variance）。


    这里的高方差意味着模型在一个地方（训练集）表现良好，但在另一个地方（测试集）表现不好，这说明模型的泛化能力较差。此外，所谓的训练数据本身就存在误差。过于精确的拟合可能会将这些误差视为特征进行学习，导致在训练集上的拟合越精确，面对新样本时的预测效果就越差。


    欠拟合是克服的，例如在决策树算法中扩展分支，或者在神经网络中增加训练轮数，以便更精细地学习样本包含的特征。相比之下，克服过拟合困难得多。


    ## 模型选择与数据拟合

    拟合的一个重要原因是模型太复杂了。我们需要一个更简化的模型来学习数据中包含的特征。这种“回归自然”的修正策略就是 `regularisation`（正则化）。


    可以看出，如果我们盲目地追求减少训练误差，所选模型的复杂度只会越来越高。因为只有这样模型才能具有强大的数据拟合能力。然而，当模型足够复杂时，模型中的参数会过多，拟合的概率也会上升。在选择模型时，我们需要遵循一个基本原则：避免过拟合并提高泛化能力。


    模型选择与数据拟合之间的关系可以通过多项式函数的拟合问题来说明。对于这样的训练数据集 `T=(x1,y1),(x2,y2),...,(xn,yn)`，其中
    `xi` 是样本的观测值（即特征），`yi` 是对应的观测输出值（`i = 1, 2, ..., n`）。现在我们的任务是用次数为 `m` 的多项式函数来拟合这些数据（由于观测值是连续值，这是一个回归任务而非分类任务）。


    在这里，`m` 是一个变量值，例如一次多项式（`m=1`）、三次多项式（`m=3`）等。我们的目标是选择一个能够很好拟合训练数据并良好预测新样本的多项式函数。公式解释如下：目前有
    `m+1` 个特征：`x0,x1,x2,...,xm`。


    * 有 `m+1` 个需要学习的权重参数：`w0, w1,w2,…,wm`。

    * 这些参数的正、负、大小代表了我们选择特征时的“态度”。如果某个 `wi` 是一个很大的值，则意味着其对应的特征 `xi` 是“高加权”的，值得关注。

    * 如果某个 `wi` 值接近 0，则意味着与该权重关联的特征 `xi` 是“微不足道的”（无关紧要的），是可选的。


    有意识地让一些权重接近 0，从而放弃训练方法中的某些特征，这被称为 `weight decay`（权重衰减），它在某种程度上避免了过拟合。现在的问题是，如何学习“这
    m+1 个参数”？


    常用的策略之一是最小二乘法（`MLS`）。通常，拟合函数值 `f(xi,w)` 与期望标签 `yi` 之间存在误差，即残差。1829 年，大数学家高斯证明了，在误差
    `e0,e1,...,en` 独立同分布的假设下，最小二乘法具有优势。在所有无偏线性估计类中，它的方差是最小的（参见高斯-马尔可夫定理，Gauss-Markov
    Theorem）。


    也就是说，当残差的平方和最小时，拟合函数 `fxw` 与期望标签 `y` 之间的相似性最高。即公式中的 `L(w)` 得到最小值时。`w0, w1, w2,
    ..., wn` 即为最优拟合参数。


    '
