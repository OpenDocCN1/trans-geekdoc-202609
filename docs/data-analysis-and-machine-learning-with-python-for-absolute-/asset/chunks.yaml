    # Chapter 8 Data Analysis in Depth


    ## Decisions can also be made based on experience


    We have talked about a lot of successful cases of data analysis, but in fact,
    many companies have not done data analysis, relying on experience, are still developing
    very well. For example, Tumblr, a famous social networking website, has not done
    any data analysis before, but it ranks very high in the industry. How can we explain
    this?


    Experience is just an idea of reality and is far from real reality. There is often
    a big difference between the experience of an enterprise and the real market.
    This difference exists objectively. The president of Northwest Airlines once said
    vividly that for airlines, the most important problem in flight is the airplane''s
    engine. The engine is the power of the airplane. No problems should occur to the
    engine. If it happens, it will be catastrophic.


    But for the passenger, what affects his choice of airline may be whether or not
    the small table in front of the seat is clean. If a passenger gets on the plane,
    opens the small table and finds oil stains, he will be disappointed with the service
    and will never take this plane again. What we are trying to say is that no matter
    how good the engine is, the consumer is not directly aware of it, and what he
    can compare is often a matter of visual detail.


    In many cases, companies and consumers have different perspectives on issues,
    and there are differences in the criteria for evaluating good or bad. It is precisely
    because of this difference that companies may face great risks and costs when
    making decisions based on their own experience and intuition. It is the difference
    between enterprise experience and market demand, so empirical decision-making
    cannot guarantee that the enterprise can accurately grasp the pulse of the market
    at any time, and there will be certain risks.


    The role of data analysis is to enable companies to listen to the voice of the
    market and guide them to operate in accordance with the characteristics and laws
    of the market. Such decisions can be more objective and such companies can be
    more stable.


    ## Does Data analysis increase decision-making costs?


    It takes money to establish departments, recruit talents, purchase systems, and
    integrate data. Data analysis will greatly increase the cost of decision-making.
    Therefore, many of us believe that only large and powerful companies can do data
    analysis. Data analysis intuitively does increase the cost of decision-making.


    However, through data analysis, decision-making is made more objective, which
    not only reduces the losses caused by decision-making mistakes, but also reduces
    unnecessary management costs for enterprises. Compared with the losses caused
    by decision-making errors, the cost of data analysis is minimal. In fact, it is
    often not the costs incurred by data analysis that cause the company to suffer
    heavy losses, but the company''s decision-making errors. Many companies lack the
    awareness of data analysis, resulting in major decision-making mistakes, and even
    going nowhere.


    In addition to reducing the losses caused by decision errors, data analysis can
    also reduce unnecessary management costs for enterprises. For example, some companies
    often bring all new products to the market at the same time, and continue to push
    if they sell well, and then withdraw those that do not sell well. But let’s do
    the math, how much channel resources, labor, production line, and time cost will
    be occupied by those who do not sell well. If you do data analysis in the early
    stage to determine the market''s evaluation of new products, you will have choices
    when you launch new products and this strategy will save a lot of unnecessary
    management costs.


    Therefore, whether a company does data analysis or not has to be counted on two
    principles:

    1. How much does the data analysis cost?

    2. What are the benefits of data analysis?


    After that, weigh whichever is more important.


    ### Example


    Company A wants to invest in the development of a new product, but market performance
    is uncertain and there are four possible states. The company''s staff estimated
    the probability of occurrence of these four states and the corresponding profits.
    Company B is a data analysis company that can provide support for Company A''s
    new product decision-making. If analysis result of B shows that the new product
    presents any of three states (1, 2, 3), then it is recommended that Company A
    develops the product; if it presents status 4, then it is recommended that Company
    A gives up. The service fee for data analysis by Company B is $40,000. The question
    now is, if you are the decision maker of Company A, do you cooperate with Company
    B? As said before, whether to cooperate with Company B is to compare profit of
    non-cooperation and cooperation. If there is no cooperation, the profit of new
    product is equal to the weighted average profit with the four states as weights.


    What about insufficient data? Market research does have the problem of trust,
    but we must not give up because of setbacks. Instead, we must find the link and
    cause of the problem. I think the problem may lie in design or implementation.
    For example, in terms of data sources, if one family has collection sites distributed
    in first, second, and third-tier cities, while another has only collection sites
    distributed in first-tier cities, then the conclusion is definitely different.
    Which company has more reliable data depends on which company’s collection network
    is more representative. In terms of concept definition, suppose one defines microwave
    oven with more than $80, and another defines computer grill oven with more than
    $200, the conclusion is definitely different. Before investigation, relevant concepts
    need to be clearly defined. In addition, in the implementation process, whether
    survey time, location, and quality control are reasonable and effective will also
    affect the quality of survey. Research is a professional industry; omissions in
    any link may affect the accuracy and objectivity of survey results. Whether it
    is your own research or outsourcing to a company, you must have a certain degree
    of research to distinguish good from bad and control the credibility of data.


    *** Organizational structure of data analysis ***


    First, there is Party B (a third party) that can meet our analysis needs. Do we
    need to have our own analysts? Second, if necessary, should the analyst enter
    the existing business department or set up an independent data analysis department?


    #### 1. Does the company have its own analyst?


    My point is that even with B, we still need our own analysts. The company faces
    a large number of decision-making issues during operation, such as how to set
    up safety stocks? How to choose the right supplier? How to achieve optimal production
    arrangements? How to improve the success rate of new products? How to price? How
    to evaluate the effect of promotional activities? If there is a decision, there
    must be analysis requirements. If these requirements are outsourced to B, the
    cost is relatively high. Therefore, for small and medium-sized enterprises, having
    its own analyst can reduce costs; for large enterprises, outsourcing to a third
    party requires someone to contact. If this person has no knowledge of data analysis,
    it is difficult to find a suitable party. It is best to train your own analysts
    to improve the quality and efficiency of cooperation with third parties.


    #### 2. In which department the analyst is located


    This is actually a matter of organizational structure. There are two organizational
    structures:

    - **Decentralised structure**: Analysts are scattered across existing business
    departments.

    - **Comprehensive structure**: Analysts are concentrated in an independent data
    department.


    Both structures have their own advantages and disadvantages. The advantage of
    the decentralised structure is that it is close to the data sources of various
    departments, convenient for data retrieval, and strong in analytical autonomy.
    In addition, because data is scattered in various business departments, data leakage
    problems rarely occur. But the problem of decentralised structure is also obvious.
    The root cause is the embarrassment caused by the contradiction between departmental
    interests and comprehensive analysis.


    **The analyst''s embarrassment**:

    Suppose I am an analyst and I want to evaluate an investment project. I need to
    make a comprehensive evaluation based on data such as environment, market, competition,
    product, and profit. However, the environmental data is in the strategy department,
    the marketing and competition data is in the marketing department, the product
    data is in the product department, and the cost and profit data is in the finance
    department. I only belong to one of these departments. Under the division of departments,
    getting other data is very difficult, so I can only use what I have, and the nutritional
    value is naturally not too high.


    **Embarrassment in the business department**:

    The information resources of various departments cannot be shared, which will
    result in the situation that those who understand the market do not understand
    the product, and those who understand the product do not understand the market,
    thereby affecting the effective operation of the business department. Business
    departments such as marketing department and product department are like multiple
    transportation trunk lines. If there is no independent department, it affects
    the management and integration of data.

    '
