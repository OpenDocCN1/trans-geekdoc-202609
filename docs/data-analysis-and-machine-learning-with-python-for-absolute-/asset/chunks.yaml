    the drop-down form control just inserted, click the right mouse button, and select
    \[Set Control Format\]. Step 03 In the pop-up \[Set Control Format\] dialog box,
    set the range of \[Data Source Area\] to "Data Source! $B$5: $B$126", which is
    the date range of the notification, and then set the \[Cell Link\] range "Data
    conversion! $F$2", that is, when the corresponding date is selected, the corresponding
    value will be entered. \[Number of drop-down display items\] If there is no special
    requirement, you can use the default number of drop-down display items, click
    the \[OK\] button. ￼ At this time, the drop-down form control is set up. Select
    the required date in the control to get the corresponding value. For example,
    if you select the first date "2011-9-1", you get the value "1" , Select the 10th
    date "2011-9-10", and get the value "10". 2\. Data dynamic reference After setting
    the drop-down form control, we can refer to the corresponding data according to
    the value output by the control. Next, we will introduce how to reference the
    corresponding data in order to draw a chart. Since the two tables have something
    in common, then we can directly refer to the corresponding four consecutive rows
    of data from columns B to F in the "Data Source" table to the "Chart" A3:E6 area
    in the data area. Just now you also discovered that these two tables have something
    in common, even the order of the data indicators is the same, so we can consider
    quoting the data of the entire region at once, for example, using the OFFSET function.
    The OFFSET function takes the specified reference as the reference system, and
    obtains a new reference through a given offset. The returned reference can be
    a cell or a range of cells, and the number of rows or columns to return can be
    specified. The usage of the OFFSET function is as follows: ￼ OFFSET (Reference,
    Rows, Cols, \[Height\], \[Width\]) The parameters of the OFFSET function are explained
    as follows. ★ Reference: As the reference area of ​​the offset reference system,
    Reference must be a reference to a cell or a range of connected cells; otherwise,
    OFFSET returns the error value "#VALUE!". ★ Rows: The number of rows offset up
    (down) relative to the upper left corner of the offset reference system. The number
    of rows can be positive (representing below the initial reference) or negative
    (representing the Above). ★ Cols: Relative to the upper left cell of the offset
    reference system, the number of columns offset to the left (right). The number
    of columns can be positive (representing the right of the initial reference) or
    negative (representing the left). ★ Height: Height, that is, the number of rows
    of the reference area to be returned, Height must be a positive number. ★ Width:
    width, that is, the number of columns of the reference area to be returned, Width
    must be a positive number. Step 01 Use the mouse to select the A3: E6 cell area
    of ​​the "Data Conversion" table. Step 02 Click the \[Insert Function\] button
    on the left side of the edit bar, and find the OFFSET function in the \[Find and
    Reference\] category of the pop-up \[Insert Function\] dialog box and click the
    \[OK\] button. ￼ Step 03 In the pop-up \[Function Parameters\] setting dialog
    box, set each parameter in turn. ￼ let me explain the meaning of each parameter.
    ★ The Reference parameter is set to "Data source! B1", that is, the cell "Data
    source! B1" is used as the reference system. ★ The Rows parameter is set to cell
    "F2", which is the value n output by the drop-down form control, which is offset
    down by n rows. ★ The Cols parameter is set to "0", that is, column 0 is shifted
    to the right, that is, the column is not shifted, and column B where the "data
    source! B1" cell is directly taken. ★ The Heigh and Width parameters are set to
    "4" and "5" respectively, that is, the reference area to be returned. The domain
    is a cell area with 4 rows and 5 columns. The combined explanation of these parameters
    is to use the "data source! B1" cell as the reference frame, offset down by n
    rows, without offsetting the column, and refer to the cell area data of 4 rows
    and 5 columns. Next, let’s look at the most critical last step. Many people cannot
    complete it because this step is not done well. Step 04 After setting each parameter
    in the \[Function Parameters\] dialog box, press \[Ctrl+Shift+Enter\] key combination
    to get the data area called according to the output value of the control. Great.
    It''s really more convenient than the VLOOKUP function. It can reference the data
    of the entire area at once. After completing the quotation of the chart data,
    you can draw 4 corresponding bar charts based on the data in the "Chart Data Area".
    This is the same as the charts we draw daily. No special processing is required.
    1\. Text notification combination After the dynamic quotation of the chart data
    and the drawing of the chart are completed, it is time for us to combine the text.
    We need to prepare three data areas: "Notification Data Area", "Notification Data
    Conversion Area", and "Notification Text Area". ★ "Notification data area" is
    similar to "chart data area", that is, to quote the corresponding data according
    to the value output by the control. ★ "Notification data conversion area" is to
    convert the "notification data area" into the required text format, and insert
    the corresponding connection words between each data, so that the next step is
    to connect and combine the text. For example, the number of subscribers is 28284.
    Turn it into 28,000 subscribers. ★ "Notification text area" is to connect and
    combine the converted data and connecting words in the "notification data conversion
    area" to form a complete notification text. 1) Notification data area Now we first
    complete the data reference in the "Notification Data Area". Because the "Chart
    Data Area" has already referenced part of the data, we can directly quote the
    data we need. The data settings for each area are as follows. ★ We can directly
    quote the data of B6: E6 and B5: E5 in the "Chart Data Area" for the data of the
    current day and yesterday. ★ The chain data can be calculated by the formula "current
    day/yesterday -100%". ★ To accumulate data, you need to use the VLOOKUP function
    to match the corresponding data from the "data source" table according to the
    value output by the control. For example, the data matching formula for the number
    of accumulated users is: "=VLOOKUP($F$2+3, data source! A: H,8,0)”, the other
    cumulative data call methods can be deduced by analogy, and the setting call is
    performed. You can refer to the daily report template for the above specific settings
    and I will send it to you. 2) Notification data conversion area Now let’s look
    at the settings of the “Notification Data Conversion Area”. The key is the text
    conversion of data. The data settings of each area are as follows. ★ According
    to the numerical value, convert the current day and accumulated data into text
    data with corresponding units. For example, the number of subscribers from 28,284
    to 28,000 subscribers, we can use the TEXT function, enter "=TEXT(J4/10000,"0.0")"
    in cell J12, so that the value can be converted into the required text format.
    ★ Convert the ring data into text, for example, enter "=TEXT(ABS(L4),"0.0%")"
    in cell N12, because the ring ratio may rise or fall, so the absolute value of
    the ring data must be taken first , And then perform text conversion. ★ Use the
    If function to judge the chain data, and assign the words "rising", "falling"
    and "flat" according to the results. For example, we can enter "=IF(L4>0,"rising",IF()
    in cell L12 L4<0, "decline", "flat"))". ★ Add connecting words between the converted
    text data to prepare for the next step of the notification body connection combination
    to form a complete notification body. 3) Notification body area The last thing
    is to connect and combine the converted text data and connecting words in the
    "notification data conversion area" to form a complete notification body. We can
    use the CONCATENATE text connection function or the "&" text connector to do this.
    Connection, if there are many cells to be connected, it is recommended to use
    the CONCATENATE text connection function, which is simple, convenient and quick,
    and not easy to make mistakes. For example, we can enter "=CONCATENATE(I12,J12,K12,L12,M12,N12,O12,P12)"
    in cell I19, and then connect and combine to form a notification text: "1.2. Number
    of subscribers on the day: 28,000, the month-on-month increase was 27.6% over
    the previous day, and the cumulative number of subscribers was 46,000. The same
    applies to the combination of other bulletins, and I will not repeat the introduction.
    Drag the fill handle directly with the mouse to copy the cell formula to complete
    the setting. In this way, each data module of the "Notification Data Conversion
    Area" is set up. As long as you select the corresponding notification date through
    the drop-down form control, Excel will automatically quote the corresponding data
    and generate the corresponding data chart and the corresponding notification text.
    Indeed, it is much more efficient than before, saving time and effort. All these
    tasks must be carried out step by step. You can only have a thorough understanding
    of it if you do the report work first. If you tell you too early, you don''t know
    why you want to do it, or you can''t do it well. ￼Establish the Notification Text
    table After sorting out the "Data Source" table and the "Data Conversion" table,
    the next step is to associate the text of each notification with the table one
    by one, and according to the pre-determined points. Analyse the framework to organise. '
