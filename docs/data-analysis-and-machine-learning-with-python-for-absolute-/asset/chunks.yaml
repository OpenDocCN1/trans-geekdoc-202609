    在本章的下一节中，我们将开始通过录制宏来使用其简化的实用程序，探索 `VBA` 自动化系统的优势。让我们开始吧！


    ### 录制宏

    简单来说，`macro` 是 `VBA` 语句的集合，它们以宏的形式存储在 Excel 中，供我们调用和运行。需要注意的是，`macro` 的功能并不等同于
    `VBA`。它只是 `VBA` 中是最简单的实用工具之一。尽管许多 Excel 过程可以通过录制宏来完成，但仍然有一些尚未支持的复杂情况。在宏无法完成的任务中，包含了偏好设置，例如自定义函数、循环判断等。


    `Macros` 可以通过编写 `VBA` 语句获得，也可以通过录制语句获得。我们数据科学家通常使用的方法是先录制宏，然后根据录制完成的宏对语句进行优化和调整，以获得我们需要的宏。现在我们将录制一个具有单元格字体加粗和斜体功能的宏。


    **第 1 步**：创建一个新的 Excel 文件，点击指定 `代码` 组中的 `开发工具` 卡，然后点击 `录制` 按钮启动程序。


    **第 2 步**：在通常随 `录制宏` 对话框弹出框中，填写宏名称，根据需要设置快捷键、描述和其他信息。在本例中，使用了默认设置。完成后，点击 `确定`
    按钮。务必确保你从菜单栏保存该程序。


    **第 3 步**：在当前工作表中，将所选单元格 `A1` 的字体格式设置为加粗和斜体。你还有许多其他功能和选项可以进行尝试。


    **第 4 步**：在 `开发工具` 卡下的 `代码` 组中，点击 `停止录制` 按钮。此时，一个简单的宏被录制了，我们的任务完成。


    **注意**：`Excel 2010` 没有 `开发工具` 卡。你可以通过其他不同的命令行程序调用它。更多信息请参阅软件提供的官方文档。按照以下步骤设置 `[开发工具]`
    的路径：`[文件]`→`[选项]`→`[自定义功能区]` 在右侧的 `[主选项卡]` 下勾选 `[开发工具]` 前复选框。


    录制宏的目的是查看相应的宏代码。在完成刚刚执行的录制宏步骤后，我希望你对它的功能有了基本的了解。我们建议你研究并玩转 Excel 软件中的工具，这样你就能理解相应的宏代码。在下一章中，我们将讨论
    `VBA` 语法的核心要素。请继续！


    ### 第 2 章 VBA 语法核心要素

    在上一节中，我们录制了一个 `Macro`。我们希望已经在自己的机器上实验了该功能。现在我们建议你查看录制的宏代码，以便我们继续本章的解释。点击 `[开发工具]`
    卡，在 `[代码]` 组中点击 `[宏]` 按钮，打开 `[宏]` 对话框，你可以选择刚刚录制的 `"宏 1"`。点击 `[编辑]` 按钮，即可获取刚刚录制的
    `"宏 1"` 的 `VBA` 语句。


    我们之前解释的这个 `VBA` 语句实现了两个功能：一个是将字体设置为加粗，另一个是将字体设置为斜体样式。当我们观察这个 `VBA` 语句时，可以发现：


    *   以 `Sub` 开始，以 `End-Sub` 结束。实现功能的 `VBA` 语句夹在 `Sub` 过程之间。

    *   每个 `VBA` 语句代表一个功能。

    *   对象和属性之间用一个小点隔开。这个小点相当于句子中的连接词，表示所属关系，即一个属性属于一个特定的对象。

    *   当执行 `VBA` 语句时，它从第一句 `Sub` 开始，逐句执行，直到 `End Sub` 结束。

    *   单引号后的内容表示注释，这不仅能让你自己快速回想起来，还能让其他人快速理解你的 `VBA` 语言语句。注释默认以绿色显示。当执行宏代码时，系统将忽略这些注释行。


    上述条件是 `VBA` 的最基础语法要素。当然，需要掌握的语法结构不仅于此，还涉及变量声明和定义、循环语句等主题。在下一节中，我们将通过详细的示例讨论对象和属性。请继续！


    ### 对象与属性

    你是否想过什么是对象？什么是属性？这两个术语在计算机科学的每一个分支中几乎都具有意义，特别是在处理编程时。数据科学编程也不例外。VBA 不仅有对象、属性，还有方法、事件等概念。根据软件研究团队的调查，这些概念让许多初学者感到困惑。为了消除你的疑惑，我们将逐一让你理解它们。请遵循这些步骤，并在需要时尝试记录笔记。建议经常检查对象和属性的概念，以成为精通且高级的数据科学家。


    1. **对象 (Objects)**：对象是 `VBA` 处理操作的内容，它是 Excel 中的真实存在物。它不是实例，而是软件中的一个真实实体，可以被修改、创建，有时甚至被删除。对象的示例包括`工作簿`、`工作表`、`单元格`、`图表`等。

    2. **属性 (Properties)**：每个对象都有属性，属性对应于对象的设置，如名称、显示状态、颜色、大小、值等。引用属性时，对象和属性用点分隔。例如，如果对象是一个人，那么属性就是身高、体重、性别、年龄等特征。为了进一步扩展系统和软件的能力，需要明确记录并理解`属性`。

    3. **方法 (Methods)**：每个对象都有一个方法。方法是在对象上执行的操作，如选择、移动、复制**粘贴、清除等。在引用方法时，对象和方法也用点分隔。与属性相比，它们代表对象的某种状态或外观，是静态的，类似于语言中的名词；而方法是对象上的动作，类似于动词。方法需要明确定义，并且有时可以自定义以完成或实现我们的需求。Excel
    为数据科学家提供了不同的方法，以实验不同的策略和原则。

    4. **事件 (Event)**：事件指的是可能发生在对象上并能被对象识别的操作。例如，打开工作簿、激活工作表、点击按钮或表单等都会产生一系列事件。当对象发生事件时，它将驱动系统运行与事件对应的预编程
    `VBA` 语句。对象和事件通常用下划线分隔。例如，工作表事件是由数据科学家用来管理列单元格。这是一个事件。当事件所在的工作表被激活时，系统会自动执行 VBA
    语句。

    ```

    Range("A2") = 250

    ```


    那么，我们还需要学习什么？作为初学者，你不需要记住对象、属性、方法和事件的具体名称。你现在可能并不理解它们。当你接触它们时就会理解了。正如之前提到的，最好的学习方法是先录制宏，然后根据录制的宏对语句进行优化和调整，以获得我们需要的
    `VBA` 语句。

    '
