    # Chapter 11 What did we learn?


    Let''s review the main points of this module. First of all, we introduced the
    connotation of learning and machine learning. The key is that learning must improve
    its performance, otherwise it is "pseudo-learning".Machine learning algorithm
    also needs to be realised by programming. The difference between machine learning
    algorithm and ordinary programming is that it is learned from training data, and
    the realisation of its function depends on the characteristics of data, without
    explicit programming.


    Then, we mainly explained the three main forms of machine learning, which can
    be divided into supervised learning, unsupervised learning and semi-supervised
    learning according to whether there is "teacher signal" or not and whether label
    data is used.


    Simply put, **supervised learning** is a classification method using label data,
    which usually uses these correct and labeled data to train neural networks. **unsupervised
    learning** is a clustering method that uses distance to measure different classes.
    Unsupervised learning uses unlabeled data, that is, it doesn''t know what the
    output result of the input data is, so that the learning algorithm can find the
    model and law of the data itself. Unsupervised learning can perform "anomaly detection",
    that is, judge some points as "not gregarious", because it is the reverse application
    of clustering.


    At the end of this chapter, we systematically learned several common indicators
    to measure the performance of the model: `recall`, `precision`, `F1 score`, `P-R
    curve`, `ROC curve` and so on. They have their own emphasis when evaluating models.


    - The `recall` ratio reflects the ability of the classification model to recognise
    normal samples. The higher the recall ratio, the stronger the ability of the model
    to recognise normal samples.

    - The `precision` reflects the model''s ability to distinguish negative samples.
    The higher the precision, the stronger the model''s ability to distinguish negative
    samples.

    - The `F1 score` is a trade-off, and the larger its value, the more robust the
    model is.


    This chapter has explained the main concepts of machine learning. Through the
    help of previous study, please think about the following questions.


    ### 1. In machine learning, where is the limitation of Accuracy?

    **A:** In the classification task, although the accuracy is the simplest and most
    intuitive evaluation index, there are some unsuitable scenarios. For example,
    in the scenario where the negative samples account for 99%, the classifier will
    predict all the samples as negative samples, even if there is no prediction pair
    for any positive samples, the classification accuracy can reach 99%. This correct
    rate seems to be very high, but in fact, the positive sample is the sample we
    care about. Therefore, when the proportion of samples of different categories
    is very different, the category with a large proportion is often the main factor
    affecting the accuracy. For example, luxury users account for 1% of all users,
    and ordinary users account for 99%. Our goal is to select real luxury users, because
    they may be big revenue-generating users of the platform, so even if the classification
    accuracy reaches 99%, the classification algorithm will fail as long as no luxury
    users can be found.


    ### 2. What is the difference between P-R curve and ROC curve?

    **A:** The trend of `ROC curve` and `P-R curve` is almost the same when the difference
    between positive and negative samples is not large. However, when the proportion
    of negative samples is very high, the performances described by the two methods
    are quite different. `ROC curve` is basically unchanged, but `P-R curve` changes
    dramatically. That is to say, using the `P-R curve` to describe the unstable performance
    is not enough. It can be seen from the two sub-graphs that the `P-R curve` changed
    significantly after the negative samples increased by 10 times, while the `ROC
    curve` remained basically unchanged.


    What practical application value does this have? This feature allows `ROC curve`
    to overcome the interference caused by different positive and negative samples,
    and more objectively reflect the performance of the model itself. In many fields,
    the number of positive and negative samples is usually very uneven. For example,
    in the field of computing advertising, people usually care about the conversion
    rate of advertising. The positive sample (the audience interested in placing a
    certain kind of advertisement) is often 1/1000 (even 1/10000) of the negative
    sample (the audience not interested in the advertisement). For the same advertising
    push algorithm, if the test sets with different distribution of positive and negative
    samples are selected and the `P-R curve` is used to measure the conversion rate,
    the difference may be very large. That is to say, using `P-R curve` to evaluate
    such scenes is not objective, while using `ROC curve` to evaluate such scenes
    is much more objective. Therefore, `ROC curve` has more application scenarios,
    and is widely used in sorting, recommendation, advertising and other fields.


    ### What Next?

    With this, we have completed a perfect introduction to the data analysis platform.
    In the next module of this book we will talk about the next advanced topic and
    essential topic for data analysis mastery known as VBA automation. Follow along
    to know more about it.

    ![](rsrc244.jpg)


    # Python Programming for Data Analysis


    ## Introduction

    This section of this module is the main focus of this book. It focuses on the
    various processes of data analysis, and introduces what operations will occur
    in each process and advanced stuff such as how to implement these operations in
    Excel, and how to implement them in Python.


    The whole process of data analysis is actually the same as the principle of cooking.
    It is in a way to sort out a bunch of raw materials into different finished products.
    First we need to understand the basic pot we use (basic knowledge of `Python`)
    and then buy raw materials such as rice and vegetables (obtain data sources).
    When the vegetables are bought, we need to wash the rice and wash the vegetables
    (data preprocessing) so that the dishes are put together after washing. At this
    time, we should think about what kind of dishes you want to be selected at this
    time (data screening) and with this information the dishes are selected so that
    you can cut and match (numerical operation). When the dishes are cut, you can
    cook in the pot (data operation). Different dishes need to cook for different
    times so you need a cooking timer (time sequence). When the dishes are all done,
    cold dishes and hot dishes must not be put together so they need to be opened
    (data grouping). In addition to regular dishes, you can also make a fruit platter
    (multi-table splicing) after everything is done. After completion everything is
    ready to be served (the result is exported).


    What is the first thing after all the dishes are done? To visualise it for posting
    in different social media platforms. This process is the process of data visualization.
    However, to achieve all these specifications you need to have a good command over
    `Python` programming language. That is where this book comes for help for you.
    Follow along to know in detail about different `python` functionalities that Data
    analysts can utilise.

