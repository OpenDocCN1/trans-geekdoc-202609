  trans: "\n\n# 第 9 章 高级功能列表生成公式\n\n现在有一个列表，你需要对列表中的每个值进行平方运算，然后将结果放入一个新的列表中。让我们先看看普通方法的实现方式。列表的实现方式如下：\n\
    \n```python\nFor ( list) {\n    // 生成列表的逻辑\n    list[] gen()\n}\n```\n\n上面的需求相对简单，你可能无法体会列表生成的奇之处。让我们来看一些更复杂的需求。现在有两个列表，这两个列表中的值需要成对组合。我们可以分别通过普通方法和列表生成方法来实现它们。在上面的需求中，使用普通方法需要嵌套两个\
    \ `for` 循环，而列表生成只需要一行代码。如果数据量较小，`for` 循环的嵌套速度是可以接受的；如果数据量很大，`for` 循环嵌套的程序过多，运行速度就会变慢。\n\
    \n### map 函数\n`map` 函数的表达式形式为 `map(function,agrs)`，这意味着对序列 `args` 中的每个值执行函数操作，最后得到一个结果序列。`map`\
    \ 函数生成的结果序列不会直接显示所有结果，需要通过 `for` 循环遍历来获取结果。你也可以使用列表方法来生成包含结果值的列表。\n\n### Map python\n\
    \n### 模块\n模块是一个升级版的函数。正如我们之前所说，函数在程序可以通过函数名调用多次，但必须在定义函数的程序中调用。如果切换到其他程序，函数将无法工作。模块之所以是升级版的函数，是因为模块对应的程序可以在任何程序中通过模块名调用。如果你想调用一个函数，需要先定义它。同样，如果你想调用一个模块，需要先导入该模块。导入模块有两种主要方法。\n\
    \n#### 导入模块名\n数据分析领域使用了三个模块，即 `NumPy`、`Pandas` 和 `matplotlib`，Python 中有许多类似的模块。正因为有了这些模块，Python\
    \ 变得变得非常简单，并受到越来越多人的欢迎。\n\n### 接下来做什么？\n到此，我们完成了对 Python 数据分析的简要介绍。在下一个模块中，我们将通过示例讨论\
    \ VBA 自动化。让我们开始吧！\n\n![](img/rsrc244.jpg)\n\n# VBA 自动化\n\n## 第 1 章 自动化数据分析报告\n\
    \n如果你将一个企业比作一架 A380 飞机，那么我们日常的通知和文档就是飞机驾驶舱的仪表盘。如果飞行员没有仪表盘的引导，他显然无法在蓝天中飞行。同样，如果没有我们的日常报告，老板和运营部门将无法清晰、准确地掌握公司运营，也无法做出正确的业务决策。数据分析中的（或者说任何部门中的）日常通知真的非常重要。我们是否有一种方法在确保通知质量的同时提高工作效率？是的，数据科学家可以学习几种技术来使报告工作自动化。在本模块中，我们将讨论数据科学家经常推荐的\
    \ VBA 自动化的著名原则。请记住，学习本模块之前需要对 Microsoft Excel 有充分的了解。\n\n### 我们需要什么？\n为了实现 VBA\
    \ 自动化，我们只需要模板，并将常规且重复的日常通知工作自动化，这不仅可以确保通知质量，还能提高我们的工作效率。那么，我们如何对常规任务进行模板化和自动化呢？如果你是一个经验丰富的数据分析师，正苦于报告报告，那么这一章将帮助你使用\
    \ VBA 提供不同的方法。\n\n### 理解产物 — VBA\n如果你使用 Excel 有段时间了，那么你一定听过 VBA 这个名字。它在行业内非常有名，被建议作为数据科学家的必备技术技能。那么，VBA\
    \ 实际上是做什么的呢？它的表现又如何？VBA 非常强大，但并不难掌握或实现。这种简单性是它在企业中流行的主要原因之一。一旦你进入 VBA 自动化的大门，一切都会变得简单。\n\
    \n### 理解 VBA\nVisual For Application（视觉应用程序）\n正如我们现在所知的，数据分析使用 Excel 来完成任务，学习\
    \ VBA 是数据科学家的必备先决条件。此外，VBA 是行业推荐的技术资质。所以，如果你正尝试获得一份数据科学家的工作，那么在自己的项目里理解并实现 VBA\
    \ 是必须的。\n\n#### 它是如何工作的？\nExcel 中的每个菜单操作命令都对应一条 VBA 语句。当运行 VBA 语句时，Excel 会按相应的顺序执行每个\
    \ VBA 语句。这就像是 VBA 是 Excel 的实际遥控机制。VBA 的遥控功能不仅让操作变得更简单，还能让你获得一些使用 Excel 标准命令无法实现的功能。\n\
    \n### VBA 的优势\n在 Excel 中使用 VBA 有几个优势。下面解释了其中一些优点，以便你更好地理解 VBA 对 Excel 系统的优势之处：\n\
    \n*   它可以自动化固定和重复的任务、过程，并提高工作效率。\n*   它可以实现复杂的数据处理，并可以使用 VBA 工具进行策略分析。\n*   它提供了自定义的\
    \ Excel 函数、工具栏、菜单和界面。\n*   它可以连接到各种数据库，并精通地执行相应的数据库操作，从而提高主系统的可靠性和性能。\n\n"
- fmt: '

    In the next section of this chapter, we will start exploring the advantages of
    a `VBA` automation system by using its simplified utility by recording a macro.
    Let us go!


    ### Recording a macro

    Simply put, a `macro` is a collection of `VBA` statements, which are stored in
    Excel in the form of macros for us to call and run. It should be noted that the
    functionality of `macro` is by no means equal to `VBA`. It is just one of the
    simplest application utility in `VBA`. Although many Excel procedures can be completed
    by recording macros there are still some complications that are not yet being
    supported. One of many tasks that cannot be completed through macros are preferences
    such as custom functions, loop judgments, etc.


    `Macros` can be obtained by writing `VBA` statements and also by recording the
    statements. The way we data scientists usually use is to record the macro first
    and then optimise and adjust the sentences based on the completion of the recorded
    macro to get the macro we want. We will now record a macro with the function of
    bolding and italicising the cell font.


    **Step 1**: Create a new Excel file and click the `development Tools` tab in the
    stipulated `Code` group and then click the `Record` button to initiate the procedure.


    **Step 2**: In the pop-up that often comes with `record macro` dialog box fill
    in the macro name, set the shortcut key, description and other information as
    needed. In this example, the default settings are used. After finishing it click
    the `OK` button. Always make sure that you are saving the procedure from the menu
    bar.


    **Step 3**: In the current worksheet, set the font format of the selected cell
    from `A1` to bold and italic. There are tons of other features and options which
    you can experiment with.


    **Step 4**: In the `Code` group under the `development Tools` tab, click the `stop
    recording` button. At this instance, a simple macro will be recorded thus finishing
    our task.


    **Note**: `Excel 2010` doesn''t have a `development Tools` tab. You can call it
    out using different other command line procedures. For more information, look
    at your official documentation that is provided by the software. Set the path
    of `[Development Tools]` as following: `[File]`→`[Options]`→`[Customise Function
    Area]` Check the checkbox in front of `[Development Tools]` under the `[Main Tab]`
    on the right.


    The purpose of recording a macro is to view the corresponding macro code. After
    the steps of recording a macro we have performed just now I hope you got a basic
    understanding of its function. We recommend you to research and play with the
    tools in the Excel software so that you can understand the corresponding macro
    code. In the next chapter we will talk about the essentials of the `VBA` syntax.
    Follow along!


    ### Chapter 2 Essentials about VBA syntax

    In the previous chapter we have recorded a `Macro`. We hope that you experimented
    that feature in your own machine. Now we recommend you to view the macro code
    you have recorded so that we can continue with the explanation of this chapter.
    Click the `[Development Tools]` tab, in the `[Code]` group and click the `[Macro]`
    button to get the `[Macro]` dialog box so you can select Just record `"Macro 1"`.
    Click `[Edit]` button so that you can get the `VBA` statement of `"Macro 1"` that
    is just recorded.


    This `VBA` statement we explained previously achieves two functions one being
    setting the font to bold and the other being setting the font to italic style.
    When we observe this `VBA` statement, we can find the following:


    *   Start with `Sub` and end with `End-Sub`. The `VBA` statement that realises
    the function is sandwiched between the `Sub` process.

    *   Each `VBA` statement represents a function.

    *   The object and the attribute are separated by a small dot. The small dot is
    equivalent to the importance in the sentence, indicating the affiliation relationship,
    that is, an attribute belongs to a specific object.

    *   When the `VBA` statement is executed, it starts from the first sentence `Sub`
    and executes sentence by sentence until `End Sub` ends.

    *   The content after the single quotation mark indicates a comment, which not
    only allows you to recall quickly, but also enables others to quickly understand
    your `VBA` language sentence. The comment is displayed in green by default. When
    the macro code is executed, the system will ignore these comment lines.


    The above conditions are the basic syntax essentials of `VBA`. Of course, the
    syntax structure that needs to be mastered is more than that and involves topics
    such as variable declaration and definition, loop statements, etc. In the next
    section, we will discuss about objects and attributes with detailed examples.
    Follow along!


    ### Objects and Attributes

    Did you ever wonder what is an object? What are attributes? These two terms are
    almost significant with every branch of computer science and particularly when
    dealing with programming. Data science programming is not an exception. VBA not
    only has objects, properties, but also methods, events and other concepts. These
    concepts have made many beginners confused according to surveys conducted by the
    research team of the software. To clear your doubts we will let you understand
    them one by one. Please follow them and whenever required try to pen down notes.
    It is recommended to often inspect the concepts of objects and attributes to become
    a proficient and advanced data scientist.


    1. **Objects**: The object is the content of the `VBA` processing operation, which
    is a real thing in Excel. It is not an instance but a real entity in the software
    that can be modified and created and sometimes even deleted. Examples of objects
    includes `workbooks`, `worksheets`, `cells`, `charts`, etc.

    2. **Properties**: Every object has attributes, and an attribute corresponds to
    a setting of the object, such as name, display status, colour, size, value, etc.
    When referring to attributes, the objects and attributes are separated by dots.
    For example, if object is a person then attributes are like height, weight, gender,
    age and other characteristics. `Properties` needs to explicitly noted and understood
    for further expanding the abilities of the systems and softwares.

    3. **Methods**: Every object has a method. The method is an action performed on
    the object, such as selecting, moving, copying, pasting, clearing, etc. When referencing
    methods, the objects and methods are also separated by dots. Compared with attributes
    they represent a certain state or appearance of an object, which is static, like
    a noun in language, while a method is an action on an object, like a verb. Methods
    need to be definite explicitly and sometimes can be customised to complete or
    achieve our needs. Excel provides different methods for data scientists to experiment
    with different strategies and principles.

    4. **Event**: An event refers to an action that can occur on an object and can
    be recognised by the object. For example, opening a workbook, activating a worksheet,
    clicking a button or form, etc. will generate a series of events. When an event
    occurs to an object, it will drive the system to run a pre-programmed `VBA` statement
    corresponding to the event. The object and the event are often separated by an
    underline. For example worksheet event is performed by the data scientists to
    regulate the cells in the column. This is an event. When the worksheet where the
    event is located is activated, the system will automatically execute the VBA statement.

    ```

    Range("A2") = 250

    ```


    So, what else we need to learn? As a beginner, you don''t have to remember the
    specific names of objects, attributes, methods, and events. You may not understand
    them too much now. You will understand when you get in touch with them. As mentioned
    earlier, the best way to learn is to record the macro first, and then optimise
    and adjust the sentence on the basis of the recorded macro to get the `VBA` sentence
    we want.

    '
