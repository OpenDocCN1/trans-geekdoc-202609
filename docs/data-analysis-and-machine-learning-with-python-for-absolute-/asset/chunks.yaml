  trans: '


    * H0: 样本平均值为 5000 mA（原假设）。

    * H1: 样本均值不是 5000 mA（备择假设）。


    ### 2) 计算统计量

    结果显示，通过 `t test` 得到的统计量为 `-0.694`。仅从该统计量的值，无法直接判断样本是否符合 5000 mA 的平均值，因此需要进一步比较概率
    `P value`。


    ### 3) 比较概率 `P value` 并得出结论

    结果显示概率 `P value` 为 `0.502`，大于 `0.05` 阈值，表明无法拒绝原假设，也就是说，样本平均值为 5000 mA 的断言是正确的，这意味着该品牌的充电宝符合其声称的
    5000 mA 容量陈述。


    ### 2) 卡方检验与皮尔逊相关性检验

    卡方检验用于验证两个离散变量之间的独立性，而 `Pearson''s correlation test` 则用于验证两个数值变量之间的独立性。首先，使用卡方检验分析学生性别与是否录取的相关性。步骤如下（仍基于
    Python）：


    #### 1) 提出原假设和备择假设。

    * H0: 学生的性别与是否录取无关。

    * H1: 学生的性别与是否录取相关。


    #### 2) 计算统计量

    结果显示卡方检验的统计量为 `4.86`，通过概率 `P value` 可以获得明确的判断结果。


    #### 3) 比较概率 `P value` 并得出结论

    结果显示概率 `P value` 为 `0.028`，小于 `0.05` 阈值，表明应该拒绝原假设，即学生的性别被认为与是否录取相关。


    接下来，通过 `Pearson correlation test` 分析车速与刹车距离之间的相关性。具体步骤如下：


    #### 1) 提出原假设和备择假设。

    * H0: 车速与刹车距离无关。

    * H1: 车速与刹车距离相关。


    #### 2) 计算统计量

    结果显示车速与刹车距离之间的皮尔逊相关系数为 `0.807`，表明两者之间存在强相关性。为了进一步验证这一结论，可以计算概率 `P value`。


    #### 3) 比较概率 `P value` 并得出结论

    结果显示概率 `P value` 远小于 `0.05`，表明需要拒绝原假设，即车速与刹车距离之间的强相关性是正确的。


    ### 3) Shapiro 正态性检验

    对于样本的正态性，可以使用 `Shapiro test` 方法（通常要求样本量在 5000 以内，如果样本量超过 5000，可以使用 `KS test` 方法）。以乘客年龄数据为例，验证其是否符合正态分布。


    #### 1) 提出原假设和备择假设。

    * H0: 乘客年龄数据符合正态分布。

    * H1: 乘客年龄数据不符合正态分布。


    #### 2) 计算统计量

    结果显示 `Shapiro test` 的统计量为 `0.981`，但观察此值无法直接得出测试结论，因此仍然需要结合概率 `P value` 来得出明确结论。


    #### 3) 比较概率 `P value` 并得出结论

    结果显示概率 `P value` 远小于 `0.05`，因此需要拒绝乘客年龄不符合正态分布的原假设。


    因此，在数据分析过程中，通常需要对数据进行上述探索性研究。一方面，通过探索方法，分析师可以对数据有一个“底”，并了解数据的特征和规律；另一方面，通过深入研究，数据背后隐藏的价值会生动地呈现在分析师面前，然后根据数据分析的结果，为后续决策提供坚实依据。在下一章中，我们将讨论常见的数据分析方法。请继续关注！


