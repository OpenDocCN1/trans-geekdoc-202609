    # 第一章 什么是 Python？


    首先，Python 是一种拥有丰富且强大库的编程语言。Python 被称为“胶水语言”，因为它可以轻松地连接用其他语言（特别是 `C/C++`）编写的各种模块。Python
    语言的语法简单且易用。它有许多现成的库供你直接调用，以满足你在不同领域的需求。Python 受到数据分析、机器学习和人工智能领域越来越多程序员的青睐。因此，根据
    TIOBE 和 GitHub 的排名，Python 多次超越 Java，成为编程语言排名中位列第一。


    ## Python 的下载与安装


    本书没有下载 Python 的官方版本，而是使用了 `Anaconda`，它是 Python 的开源版本。选择 `Anaconda` 是因为它对刚开始学习
    Python 的人非常友好。众所周知，Python 有许多现成的库可以可以直接调用。但请记住，在调用它们之前必须先安装。如果你下载的是 Python 官方版本，你需要手动安装运行所需的库。但
    `Anaconda` 自带了一些常用的 Python 库，这种优势让你无需自己手动安装这些库。


    现在让我们来看 `Anaconda` 的具体安装过程。


    ### 第一步

    检查电脑的系统类型是 32 位操作系统还是 64 位操作系统。如下所示，如果你使用的是高端系统，应选择 64 位操作系统。如果你使用的是低端系统，我们建议安装
    32 位操作系统。


    ### 第二步

    进入官方网站（`https://www.anaconda.com`）并点击右上角的 `Download` 按钮进入下载页面。


    ### 第三步

    根据你的需求，根据电脑系统类型（`Windows/MacOS/Linux`）选择相应的软件类型。


    ### 第四步

    选择 `Python` 版本。由于 `Python 2` 在 2020 年后不再受到官方支持，建议每个人都选择 `Python 3`。本书的代码也是基于 `Python
    3` 的。在下一步，根据电脑操作系统的位数（`32Bit/64Bit`）选择相应的版本。


    ### 第五步

    下载后将其保存到电脑中，所示。由于是官方网站且文件较大，下载速度会较慢。你也可以去不同的私有仓库进行下载。


    ### 第六步

    双击安装包进行打开并安装，点击相应的 `Install` 按钮将软件获取到你的系统中。


    ### 第七步

    选择默认的安装路径且不添加环境变量，然后点击 `Next` 按钮并在弹出对话框中勾选相应的选项。


    ### 第八步

    等待下载完成后，继续点击 `Next` 按钮完成流程，确保无任何错误。


    ### 第九步

    点击并勾选隐私政策按钮，以便你了解软件是如何收集数据的。


    ### 第十步

    完成上述操作后，你将在电脑开始界面的左侧看到几个新添加的程序，这意味着 `Python` 已安装完成。点击 `Jupyter Notebook` 打开，会弹出一个黑框（右侧所示）。按下
    `Enter` 键后，你可以选择用哪个浏览器打开，建议选择 `Chrome` 浏览器。如果不是，请选择你喜欢的浏览器，如 `Firefox` 或 `safari`。


    ### 第一步

    当你看到带有默认选项的界面时，意味着环境已经配置完成。


    ## 接下来？


    在本书的下一章节中，我们将讨论 IDE 的重要性以及对于 Python 程序员和数据科学家来说必不可的功能。请仔细跟随。


    '
