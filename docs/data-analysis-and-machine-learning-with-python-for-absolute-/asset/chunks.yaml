- fmt: "\nTraditionally, we use lowercase `x` and `y` to represent specific input\
    \ variables and output variables. A variable can be either a scalar or a vector.\
    \ Unless otherwise specified, all vectors mentioned in this book are column vectors.\
    \ The standard writing is shown but this writing takes up a lot of space, so we\
    \ usually use Transposed writing where the superscript \"t\" is used as the transpose\
    \ symbol. What is represented here is the `i`th feature of the input variable\
    \ `x`. It is important to note that when there are multiple input variables, we\
    \ use `xj`. In this way, the `i`th feature of the `j`th variable is represented,\
    \ and the feature vector matrix is shown. \n\nFor supervised learning, the constructed\
    \ model is usually studied in the `Training Data` set, the model parameters are\
    \ adjusted, and then the prediction is verified in the `Test Data` set. For training\
    \ data, input signals (or variables) and output signals (or variables) usually\
    \ appear in pairs. Sometimes, the output signal is also called teacher signal\
    \ because it is instructive and can tune the parameters in the model through the\
    \ loss function. Therefore, the training data set is usually described.\n\nThere\
    \ are different types of input variables and output variables, which can be continuous\
    \ or discrete. Usually, people give different names to forecasting tasks according\
    \ to different types of input variables and output variables. For example, if\
    \ both the input variable and the output variable are continuous variables, then\
    \ such a prediction task is called as `Regression`. If the output variable is\
    \ a finite discrete value, then such a prediction task is called as `Classification`.\
    \ If both the input variables and the output variables are variable sequences,\
    \ then this prediction task is called `Tagging`, and we can think that tagging\
    \ is a generalisation of classification.\n\n## What Next?\nIn this chapter we\
    \ have provided a three step procedure for learning machine learning. In the next\
    \ chapter we will talk about the difference between traditional and special programming\
    \ known as machine learning. Often people wonder whether programming and machine\
    \ learning are related. We will talk specifically about this to clear your doubts.\
    \ Let us go! \n\n## Chapter 3: Differences between Traditional Programming and\
    \ Machine Learning\nAs mentioned earlier, machine learning takes data as raw material,\
    \ which can represent learning ability without explicit programming. Naturally,\
    \ the implementation of machine learning algorithm needs programming, but there\
    \ are obvious differences between machine learning and traditional explicit programming.\n\
    \nIn the traditional programming paradigm, by writing programs, giving input and\
    \ calculating, you can get the expected results. However, machine learning is\
    \ different. Based on the given input and expected results, model parameters are\
    \ obtained by calculation (fitting data), which in turn will constitute an important\
    \ part of the program. For software engineers, they are concerned about the correctness\
    \ and robustness of the program. However, data scientists (designers of machine\
    \ learning algorithms) usually deal with uncertainty and variability, because\
    \ they don't know what the program will look like before the model has been calculated.\n\
    \nTraditional programming paradigm materialises people's thinking into lines of\
    \ code, and usually the code is full of various `if` conditional statements. To\
    \ deal with each individualised situation, once the code is solidified, the result\
    \ of each run is the same. Usually there is no improvement in performance, so\
    \ traditional programming can't be said as learning. A famous CEO once pointed\
    \ out in a theme report that most of the current software is better to be called\
    \ as giraffe software. Why did he say that? Giraffes have the ability to survive\
    \ all their lives (running, eating leaves, etc.) as soon as they are born. However,\
    \ they have no learning ability, and their skills are all given by heaven, and\
    \ there is no room for improvement in their lives.\n\nAs we know, the core feature\
    \ of machine learning is to \"learn from data, improve performance, and do not\
    \ need explicit programming\". Explicit programming here does not mean that no\
    \ programming is needed, but means that no logic is needed explicitly in function\
    \ realisation, so that algorithms can \"learn\" rules from data. Moreover, once\
    \ the program has the ability of \"learning\", the data will change, and the function\
    \ of the program will change accordingly, but the logic of the program basically\
    \ does not need to be changed. They can be achieved by the purpose of responding\
    \ to all changes with invariability.\n\n### Why is machine learning not easy?\n\
    At first glance, machine learning doesn't seem to be complicated. As long as we\
    \ write a learning algorithm and feed it with data, the algorithm will learn automatically.\
    \ In fact, machine learning is not so simple. To run the machine learning programs,\
    \ readers need to install `sklearn` (a popular machine learning framework) in\
    \ advance. The code mainly is used to explain the meaning of the running result,\
    \ so it will not be studied in detail for the time being.\n\nAs a result, an `8×8`\
    \ digital matrix is displayed first, and then the image represented by this digital\
    \ matrix is given as output. Accordingly, what we want to say is that the world\
    \ seen by computers and people is completely different. The computer sees `8×8=64`\
    \ undifferentiated numbers, and then through algorithm calculation, it determines\
    \ a number `0` that human beings can understand, and deduces a meaningful number\
    \ from 64 meaningless numbers. It is amazing to think about it. In fact, this\
    \ is not too difficult for computers. Some handwritten numbers are difficult for\
    \ human beings to recognise but we have to train the machine to give correct numbers\
    \ classification. This is the main essence of the machine learning model building.\n"
