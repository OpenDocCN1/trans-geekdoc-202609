  trans: "\n\n# 第 5 章 数据结构-列表与字典\n\n## 列表的概念\n列表（list）是一种用于存储一组有序数据元素的数据结构，元素之间用逗号分隔。列表中的数据元素应该包含在方括号中，列表是一种可变数据类型。一旦创建了列表，你就可以对列表进行添加、删除或搜索。方括号中的数据可以是\
    \ `int` 类型或 `str` 类型。\n\n### 创建新列表\n创建新列表的方法相对简单，只需将数据元素包含在方括号中。以下是几种常见类型列表的新示例。\n\
    \n**创建一个空列表** 当方括号内没有数据元素时，该列表为空列表。\n```python\nthis_is_empty = [] // 这创建了一个空列表\n\
    ```\n\n**构建 int 类型的列表** 当方括号内的所有数据元素都是 `int` 类型时，该列表是一个 `int` 类型列表。\n```python\n\
    This-is-int = [6, 78, 98] // 这是一个包含 int 数据的列表\n```\n\n**构建 str 类型的列表**\n当方括号内的所有数据元素都是\
    \ `str` 类型时，该列表是一个 `str` 类型列表。\n```python\nStr_list = [\"f\",\"g\",\"h\"] // 这是一个包含字符串的列表\n\
    ```\n\n**创建一个 int+str 类型的列表** 当方括号中的数据元素同时包含 `int` 类型和 `str` 类型时，该列表是一个 `int+str`\
    \ 类型列表。\n```python\nCombine = [1,2,\"a\",\"b\"] // 这是一个包含字符串和整数的列表\n```\n\n###\
    \ 列表的复制\n列表的复制类似于字符串的复制，但也使用 `*` 运算符。\n```python\nlist = [2,7,8]\nlist * 3\nOutput:\
    \ [2,7,8,2,7,8,2,7,8]\n```\n\n### 列表的合并\n列表合并是将两个现有的列表合并。实现它有两种主要方法：一种是使用 `+`\
    \ 运算符，这与字符串的连接一致；另一种是使用 `extend()` 函数。\n\n通过用 `+` 运算符直接连接两个列表就可以合并的目的。列表的合并是有顺序的。要将列表\
    \ `B` 合并到列表 `A` 中，使用的方法是 `A.extend(B)`；要将列表 `A` 合并到列表 `B` 中，使用的方法是 `B.extend(A)`。\n\
    ```python\nLista = [2,4,5]\nList = [6,7,8]\nLista + List\nOutput: [2,4,5,6,7,8]\n\
    ```\n\n### 向列表插入新元素\n列表是可变的，也就是说，当你创建一个新列表时，你也可以对此列表进行操作。向列表中插入数据元素主要有两个函数可用：`append()`\
    \ 和 `insert()`。这两个函数会直接修改原始列表，而不会直接输出结果。你需要调用原始列表的名称来获取插入新元素后的列表。\n\n`append()`\
    \ 函数在列表的末尾插入新的数据元素。\n```python\nLista = [3,6,7]\nLista.append(12)\nOutput: [3,6,7,12]\n\
    ```\n\n**`insert()` 函数** 在列表的指定位置插入新的数据元素。\n```python\nLista = [2,5,6]\nLista.insert(6,8)\n\
    Output: [2,5,6,8]\n```\n\n### 删除列表中的值\n当删除列表中的值时，有两个函数 `pop()` 和 `remove()` 可用。\n\
    \n`pop()` 函数根据列表中的位置进行删除，即删除指定位置的值。\n```python\nLista = [6,3,4]\nLista.pop(4)\n\
    Output: [6,3]\n```\n\n`remove()` 函数根据列表中的元素进行删除，即删除一个元素。\n```python\nLista = [6,3,4]\n\
    Lista.pop(1) // 根据索引删除\nOutput: [6,4]\n```\n\n字体 排序列表中的值\n`sort()` 函数用于对列表中的值进行排序，`sort()`\
    \ 函数默认使用升序。\n```python\nLista = [6,7,1,3]\nLista.sort()\nOutput is [1,3,6,7]\n\
    ```\n\n## 数据结构-字典\n字典（`dict`）是一种键值对的结构，类似于通过联系人姓名查找地址和联系详情的地址录，即将键（名称）和值（详情）连接在一起。注意，键必须是唯一的，就像如果两个人恰好有相同的名字，你就无法找到正确的信息一样。键值对在字典中标记为\
    \ `{key1:value1,key2:value2}`。注意，键值对之间用冒号分隔，对之间用逗号分隔，所有内容包含在大括号内。\n\n### 创建新字典\n\
    首先创建一个空字典，然后向字典输入值。在下方创建一个新的地址录。直接以键值对的形式将值传入字典。将键值对以列表的形式存储在元组中，然后用 `dict` 进行转换。\n\
    ```python\nExample = { first : 1 , Second : 2 }\n```\n\n### 字典的 keys(), values()\
    \ 和 items() 方法\n- `keys()` 方法用于获取字典中的所有键。`Example.keys()`\n- `values()` 方法用于获取字典中的所有值。`Example.values()`\n\
    - `items()` 方法用于获取一组键值对。`Example.items()`\n\n在下一章中，我们将深入讨论元组及其在 Python 中的实现方式。元组通常被认为对数据科学家来说是非常重要的。\n\
    \n# 第 6 章 数据结构-元组与运算符\n\n## 元组的概念\n虽然元组（`tup`）与列表相似，但也存在差异。元组的元素不能被修改。元组使用圆括号，而列表使用方括号。\n\
    \n### 创建新元组\n创建元组相对简单，只需将一组数据元素包含在圆括号中。\n```python\nFirst = ( 3,6,7)\n```\n\n\
    ### 获取元组的长度\n获取元组长度的方法与获取列表的方法相同，两者都使用 `len()`。\n```python\nFirst = (3,6,7)\n\
    First(Len)\nOutput is 3\n```\n\n### 获取元组中的元素\n获取元组中的元素有两种方法：普通索引和切片索引。\n\n**普通索引**\
    \ 通常用于从列表中获取特定的元组。它常被 Web 开发人员使用。\n```python\nSame = (6,8,76,45)\nsame[1]\nOutput\
    \ 8\n```\n\n**切片索引** 用于自定义元组的搜索。通过示例来理解。\n```python\nsame = [3,6,7,5,33,21]\n\
    same[3:4]\nOutput is (5,)\n```\n\n 元组与列表之间的转换\n元组和列表是两种相似的数据结构，它们经常互相转换。\n\n使用\
    \ `list()` 函数将元组转换为列表。\n```python\nTup = (3,5,6)\nlist(Tup)\nOutput is [3,5,6]\n\
    ```\n使用 `tuple()` 函数将列表转换为元组。\n```python\nList = [6,7,4]\ntuple(list)\nOutput\
    \ is (6,7,4)\n```\n\n### zip() 函数\n`zip()` 函数用于将迭代对象（列表、元组）作为参数，将对象的相应元素打包成元组，然后返回这些元组的列表。`zip()`\
    \ 函数通常配合 `for` 循环使用。当迭代对象是元组时：\n```python\nList = { // 输入数据}\nTuple = ( // 输入示例\
    \ )\nFor { // 输入逻辑\n```\n```\n\n## 运算符\n运算符在处理复杂情况时通常是重要的。\n\n**算术运算符** 算术运算是加、减、乘、除的常规操作。下表显示了基本的算术运算符及其示例。\n\
    ```python\nvar - exam // 减法运算符\n``` **比较运算符** 比较运算符包括大于、等于和小于，主要用于比较并返回 True 或\
    \ False 结果。下表显示了常见的比较运算符。\n```python\nvar > exam // 比较运算符\n``` **逻辑运算符** 逻辑运算符包括\
    \ AND（与）、OR（或）和 NOT（非）。下表显示了逻辑运算符及其示例。\n```python\nvar && exam // 逻辑运算符\n```\n\
    \n"
