    # 第 10 章 高级机器学习概念


    在本章中，我们将进一步讨论对于理解数据分析概念至重要的高级机器学习主题。请仔细阅读！


    ## P-R 曲线


    在分类时，我们通常需要对学习模型的预测结果进行排序。第一个被认为是“最有可能”的样本，第二个被认为是“最不可能”的样本。因此，我们通常需要在中间设置一个 `Threshold`（阈值）。当预测值大于此阈值时，该样本为正样本，否则为负样本。根据不同的临界值，如果每个样本都被预测为正样本，将获得不同的精确率（Precision）和召回率（Recall）。


    如果将精确率作为纵轴，将召回率作为横轴，当设置临界值时，可以在坐标系上画出一个点。当设置多个临界值时，可以在坐标系中画出一条曲线。`P-R curve`可以直接显示分类算法的整体精确率和召回率。


    在比较几个分类算法时，如果算法 1 的 `P-R curve` 完全“包围”了算法 2 的 `P-R curve`，那么外侧的算法 1 具有更高的精确率和召回率（双双高），这表明算法
    1 的分类性能优于算法 2。但在更一般的情况下，算法之间的 `P-R curves` 是交错的，因此很难断定优劣，只能在特定的精确率和召回率下进行比较。


    但如果我必须进行竞争，该怎么办？比较 `P-R curve` 下的面积是安全的，在某种程度上，据说“双高”比例越大，性能越好。然而，这个面积并不容易估计，因此人们设计了一些综合考虑精确率和召回率的衡量标准。平衡点（`BEP`）就是一种衡量标准。


    当 `P=R` 时（可以看作一条夹角为 45 的直线），交点（`BEP`）将出现在这条直线与每个分类算法的 `P-R curve` 之间。算法的 `BEP`
    值越高，该算法的分类性能越好。例如，算法 2 的 `BEP` 比算法 1 大，因此在某种程度上说算法 2 的性能优于算法 1。`P-R curve` 的优点是直观的，但缺点是它受样本分布（如正类和负类的比例）的影响很大。


    相比之下，`ROC curve` 有更多优势，因此经常被用作二分类器性能评估的重要指标之一。让我们密切讨论 `ROC curve` 以及与其密切相关的 AUC。


    ## ROC 曲线


    `ROC curve` 是英文“receiver operating characteristic curve”（受试者工作特征曲线）的缩写。从它稍微奇怪的名字可以看出曲线最初并不是为机器学习领域设计的。`ROC
    curve`起源于军事领域，逐渐应用到医学、心理学等领域。在机器学习领域，`ROC curve` 可以被视为混淆矩阵的改进版本：通过不断调整阈值，给出不同版本的混淆矩阵，然后“连点成线”。让我们追溯源头，看看
    `ROC curve` 是如何来的，以便我们对它的用途有更深入的理解。


    据说在二战期间，`ROC curve`是由前线的电子工程师和雷达工程师发明的。雷达兵的任务明确，即盯着雷达显示屏看是否有敌飞机袭（显然，有飞机和没有飞机，这是一个典型的二分类问题）。从理论上讲，只要敌机袭击，雷达就会检测到相应的信号。然而，麻烦制造者——各种高空鸟类会加入其中。当它们出现在雷达扫描区域时，雷达屏幕也会显示外物入侵的信号。


    此时，该要测试雷达兵了。如果有信号，则“一切都很危险”并判断为敌机到来，这显然会增加误报率。然而，如果将所有信号都视为鸟，漏报率将会增加。每个尽职的雷达兵都想尽力提高敌机预测的准确性。但问题是，有些雷达兵天性谨慎，倾向于误报；有些雷达兵天生粗心，容易漏报。


    对于军队来说，如何选择“可靠”的雷达兵？事实上，在机器学习方面，每个雷达兵都可以被视为一个分类器，用来判断敌飞机是否到来。因此问题变为：如何选择性能卓越的分类器？最安全的方法是用数据说话。


    军事电子工程师总结了所有雷达兵的预测数据，特别是漏报和误报的概率，并将这些概率绘制在二维坐标系中。该坐标的坐标是灵敏度（简称 `TPR`），它表示当敌机真的袭击时，雷达兵预测准确的概率。横坐标是特异性（误报率，简称
    `FPR`），它表示当非敌机袭击（如鸟类飞过）时，雷达兵误判为敌机的概率。


    `FPR` 和 `TPR` 定义如下。`N` 是负样本的总数。在混淆矩阵中，`N` 是 `TN`（真负）和 `FP`（假正）之和，而 `FP` 是分类器误判为正样本的负样本数量。`P`
    代表正样本的总数。在混淆矩阵中，`p` 是 `TP`（真正）和 `FN`（假负）之和，而 `TP` 是正确预测的正样本数量。


    '
