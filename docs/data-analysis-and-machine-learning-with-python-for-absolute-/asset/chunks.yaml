    # 1. 描述性统计分析


    描述性统计分析侧重于数据的描述，这等于解释你看到的一幅图。数据的描述性统计实际上描述的是数据的特征，例如数据的平均水平、数据的可行范围以及数据的波动和离散程度。通过描述性统计分析，数据分析师可以更好地掌握和理解数据，从而在脑中形成“数字”。描述性统计分析既是数据分析过程中的基础环节，也是重要环节。它之所以必不可，是因为它的操作非常简单；它之所以重要，是因为它是下一步数据分析的前提。


    以下是描述性统计分析的示例：你的老板可能会问：“员工，请帮我检查一下 9 月份网站流量的基本数据。”那么问题是，这些基础数据包含哪些内容？首先我们应该检查
    9 月份的流量数据。通常在报告中 `PV` 和 `UV` 分别代表页面访问和用户访问，即访问网站的人数和访问页面次数。如果你了解描述性统计分析，可以用表格的形式展示网站流量的基础数据。


    以 `PV` 为例简要说明这些数据分析指标的含义。例如，假设该网站 9 月份的日均平均访问次数为 41,072.87 次，标准差为 5,685.52。访问次数名义上为
    30,471，月中四分之一的天每天访问量少于 36791.5 次，一半的天每天访问量少于 42,529 次，四之四的天每天访问量低于 44,643.25，整个月的最高访问量为
    9,847。需要注意的是，下四位数是统计学意义上的 25%分位数，上四位数是统计学意义上的 75%分位数。不要被我们提供的样本数据吓，这只是为了帮助你理解指标对于数据分析师岗位的重要类比。


    这个案例是一个典型的描述性统计分析。事实上，它简单地描述了数据的统计结果并表达了数据的统计特征。此外，数据的内在规律也可以通过图形描述。另一个例子：需要计算上个月电商平台各种支付渠道的支付比例，或者分析用户年交易额的分布特征。这两个问题可以通过饼图和直方图很好地描述。


    因此，描述性统计分析包括数据频率分析、数据集中趋势分析（如 `mean`、`median`、`mode` 等）、数据离散程度分析（如 `standard deviation`、`range`、`coefficient
    of variation` 等）、数据分布（如偏度、`kurtosis value` 等）以及一些基础统计图（如饼图、直方图、箱线图等）。在日常学习或工作中，数据分析师需要掌握这些基础统计描述方法，以便良好地融入业务并理解业务数据环境。


    # 2. 探索性统计分析


    探索性统计分析主要用于数据分析过程中的探索。通过探索，可以发现隐藏在数据背后的内在规律和联系。通常，探索性统计分析还能揭示数据异常的原因。


    例如，有必要研究某些变量之间是否存在相关性，两组样本之间是否存在显著差异，并探索企业的某些指标（如曝光量、广告点击率、支付成功率、某支付通道的账户等）。对于数据分析师来说，探索性统计分析策略在工作中被频繁应用，因为这种策略可以帮助分析师理解数据中不易发现的内在价值和联系。在大多数情况下，探索性统计分析使用数据可视化技术以图形形式呈现问题的答案，以便在视觉上发现数据中有趣的信息。


    对于探索两个变量之间的关系，最常用的方法是绘制它们的散点图。通过散点图，你可以直观地发现两者之间的某种内在关系（如线性关系、非线性关系或不相关关系）。因此，在探索车速与刹车距离的关系时，不妨画一个散点图来观察两者的关系。在这里，横轴代表汽车行驶速度，纵轴代表刹车距离。从图中可以看出，随着行驶速度的增加，刹车距离也增加。因此可以明确得出它们之间存在正线性关系。


    那么，这种线性关系可以用特定的数学函数表示吗？答案是定的。这部分内容将涉及后文描述推断统计分析。通常比较两组或多组样本的差异时，你可以选择统计中的箱线图（也称为须须图）。它有两个主要功能：一个是易于比较数据，另一个是识别数据中的异常样本点。


    在探索头舱舱女性乘客票价是否存在差异时，你可能希望选择箱线图来描述。在这里，横轴代表票价，纵轴代表男女性性别。两个箱线图的中间箱有一条清晰的分界线，那就是
    `median`（一种描述数据的集中指数，被理解为整体水平）。可以看出两个箱线图的 `medians` 并没有垂直对齐，表明男女乘客之间的票价存在显著差异。从最右侧还发现了一些样本点，这些点是通过箱线图技术识别出的异常点。显然，这是基于图形比较的结果，两者之间存在差异。


    那么，是否有一种定量方法可以验证男女票价之间存在显著差异？答案仍然是定的，可以通过推断统计分析来实现。


    对于探索 PC 和移动端电商交易额的比例变化，你可以选择百分比堆叠柱图。这种图最大的特点是所有条形的高度都标准化为 100%（即，所有条形的高度都是相同的），然后你可以比较内部比例的变化趋势。所示，这是不同时期
    PC 和移动端交易额比例的差异。提供的所有数据都只是供你理解的样本数据。你可以名义上搜索任何单独的数据，并用它来进一步理解下面解释的步骤。


    # 3. 推断统计分析


    推断统计分析非常经典但相对困难。我们都知道统计学本质上是根据样本的特征来推断整体情况。例如，通过随机抽样，从总体中抽取部分样本，并从样本推断总体平均水平（解决问题的方法是统计推断中的
    `mean test`）。根据样本的两个属性（即两个变量），我们需要确定这些属性之间是否存在相关性（统计推断中需要使用 `correlation coefficient
    test` 或 `chi-square test`）。根据样本的分布，判断总体是否服正态分布（使用 `normality test` 技术）。


    与探索性统计分析相比，推断统计分析更侧重于寻找定量答案，通常计算统计量和相应的概率 `P value`。如果概率 `P value` 小于 `.05`（默认比较值），你需要拒绝零假设（零假设是假设事件为真的假设，例如样本均值等于某个特定值、两个属性之间没有相关性、以及样本符合正态分布），否则，需要接受零假设。


    为了让读者掌握推断统计分析的方法，将使用几个小示例进行阐说明：


    ## 3.1 t 检验

    `t test` 也称为 `mean test`，即一种可以验证一个样本均值是否符合某个常数，或者两个样本的均值之间是否存在差异的检验方法。假设所示的数据是某品牌充电宝容量的采样数据，为了测试该品牌充电宝是否符合其标称的
    `5000 mA` 容量，需要使用基于 Python 的 `t-test` 工具。


    1) 提出原假设和备择假设。


    '
- fmt: "\n* H0: The sample average value is 5000 mA (null hypothesis).\n* H1: The\
    \ sample mean is not 5000 mA (alternative hypothesis).\n\n### 2) Calculate statistics\n\
    The result shows that the statistic obtained by the `t test` is `-0.694`. From\
    \ the value of this statistic alone, it is not directly possible to say whether\
    \ the sample meets the average value of 5000 mA, so it is necessary to further\
    \ compare the probability `P value`. \n\n### 3) Compare the probability `P value`\
    \ and draw conclusions\nThe results show that the probability `P value` is `0.502`,\
    \ which is greater than the `0.05` threshold, indicating that the original hypothesis\
    \ cannot be rejected, that is, the claim that the sample average value is 5000\
    \ mA is correct, which means that the brand’s power bank meets its advertised\
    \ capacity of 5000 mA statement.\n\n### 2) Chi-square test and Pearson correlation\
    \ test\nChi-square test is used to verify the independence between two discrete\
    \ variables, while `Pearson's correlation test` is used to verify the independence\
    \ between two numerical variables. First, the chi-square test is used to analyse\
    \ the correlation between the gender of the student and whether it is admitted.\
    \ The steps are as follows (still based on Python):\n\n#### 1) Propose the original\
    \ hypothesis and alternative hypothesis.\n* H0: The gender of the student is independent\
    \ of whether it is admitted or not.\n* H1: The gender of a student is not independent\
    \ of whether it is admitted or not.\n\n#### 2) Calculate statistics\nThe result\
    \ shows that the statistic of the chi-square test is `4.86`, and a clear judgment\
    \ result can be obtained with the help of the probability `P value`. \n\n####\
    \ 3) Compare the probability `P value` and draw conclusions\nThe results show\
    \ that the probability `P value` is `0.028`, which is less than the threshold\
    \ of `0.05`, indicating that the null hypothesis should be rejected, that is,\
    \ the gender of a student is considered to be related to whether it is admitted.\n\
    \nNext, analyse the correlation between car speed and braking distance through\
    \ `Pearson correlation test`. Specific steps are as follows:\n\n#### 1) Propose\
    \ the original hypothesis and alternative hypothesis.\n* H0: The speed of the\
    \ car is not related to the braking distance.\n* H1: The car speed is related\
    \ to the braking distance.\n\n#### 2) Calculate statistics\nThe results show that\
    \ the Pearson correlation coefficient between car speed and braking distance is\
    \ `0.807`, indicating that there is a strong correlation between the two. To further\
    \ verify this conclusion, the probability `P value` can be calculated.\n\n####\
    \ 3) Compare the probability `P value` and draw conclusions\nThe results show\
    \ that the probability `P value` is much less than `0.05`, indicating that the\
    \ null hypothesis needs to be rejected, that is, the strong correlation between\
    \ car speed and braking distance is correct.\n\n### 3) Shapiro normality test\n\
    For the normality test of the sample, the `Shapiro test` method can be used (usually\
    \ the sample size is required to be within 5000, if the sample size is above 5000,\
    \ the `KS test` method can be used). Take the age data of passengers as an example\
    \ to verify whether it obeys a normal distribution.\n\n#### 1) Propose the original\
    \ hypothesis and alternative hypothesis.\n* H0: The age data of passengers obey\
    \ a normal distribution.\n* H1: The age data of passengers does not follow a normal\
    \ distribution.\n\n#### 2) Calculate statistics\nThe result shows that the statistic\
    \ of `Shapiro test` is `0.981`, but looking at this value, the conclusion of the\
    \ test cannot be drawn directly, so it is still necessary to combine the probability\
    \ `P value` to make a clear conclusion.\n\n#### 3) Compare the probability `P\
    \ value` and draw conclusions\nThe results show that the probability `P value`\
    \ is much less than `0.05`, so it is necessary to reject the null hypothesis that\
    \ the age of passengers does not obey a normal distribution.\n\nTherefore, in\
    \ the process of data analysis, it is usually necessary to do the above exploration\
    \ and research on the data. On the one hand, through the exploration method, the\
    \ analyst can have a \"number\" of the data and understand the characteristics\
    \ and laws of the data. On the other hand, through in-depth research, the value\
    \ hidden behind the data is vividly displayed in front of data analysts, and then\
    \ based on the results of data analysis, it provides a strong basis for the next\
    \ decision. In the next chapter, we will talk about the common methods of data\
    \ analysis. Follow along!\n"
