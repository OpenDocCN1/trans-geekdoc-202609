    # 引言


    ## 面向数据分析师的基础机器学习


    从数据中获取洞察是数据分析的核心目的。为了实现这一目标，仅仅依靠人类观察是不够的。没有机器学习算法和原理，我们无法创造奇迹。


    在本模块中，我们将介绍机器学习的基础知识，帮助你理解什么是学习、什么是机器学习，以及机器学习的几个大类（监督学习、无监督学习、半监督学习）。我们还将讨论机器学习的模型评估和性能衡量，包括混淆矩阵、精确率、ROC
    曲线等。


    本模块的主要要点如下：


    * 帮助读者理解学习和机器学习的含义

    * 帮助读者理解监督学习、无监督学习和半监督学习的内涵

    * 帮助读者掌握过拟合和欠拟合

    * 学习并理解混淆矩阵、P-R 曲线和 ROC 曲线


    # 第一章：机器学习的定义


    在本节中，我们将讨论机器学习的定义以及过程中三个重要的步骤。


    ### 什么是机器学习？

    谈到机器学习时，首先我们需要知道学习的本质是什么。赫伯特·西蒙（Herbert Simon）教授是一位著名的学者，1975 年图灵奖获得者，并在 1978
    年获得诺贝尔经济学奖。他曾将学习定义为一个通过执行特定过程来提高性能的系统。学习过程对于机器学习系统来说特别重要。在西蒙看来，学习的核心目的是提高性能。


    事实上，对于人来说，这个定义也适用于许多实例和场景。如果我们只进行低层次重复性学习，而未能实现认知升级的目标，即使我们看起来非常勤奋，实际上只是一个性能没有提升的伪学习者。西蒙认为，对于计算机系统来说，机器学习（ML）是利用数据和某些特定方法（如统计方法或推理方法）来提高机器系统性能的关键。


    在经典的教材《机器学习》中，卡内基梅隆大学的著名学者教授汤姆·米切尔（Tom Mitchell）对“机器学习”给了一个更具体（实际上是抽象的）定义，如下：对于某个特定的`任务(T)`
    和特定的`性能评估标准(P)`，如果一个计算机程序在`T` 上表现，以`P` 为性能衡量标准，并通过经验（E）的积累不断改进自身，那么就可以说这个计算机程序从`E`
    中学习了知识。


    例如，AlphaGo 是一个学习围棋（一种棋类）的程序，它可以通过与自己下棋来获得经验。那么，它的任务 `T` 是参加围棋游戏，它的性能 `P` 通过胜率的概率来衡量。同样，学生的任务
    `T` 是上课、看书和写作业，它们的性能 `P` 通过测试分数来衡量。


    米切尔认为，对于一个学习问题，我们需要明确三个特征：首先是任务类型，其次是衡量任务性能提升的标准，最后是获取经验的来源。事实上，机器学习的定义根据视角的不同略有不同。


    例如，支持向量机（SVM）的主要推动者弗拉基米·瓦普尼克（Vladimir Vapnik）在其著作《统计学习理论》中提出，机器学习是基于经验数据的函数估计问题。在另一本由斯坦福大学统计系特雷沃·哈斯蒂（Trevor
    Hastie）编写的经典著作《统计学习基础》（*The Basis of Statistical Learning*）中提到，机器学习主要用于提取重要的模式和趋势并理解数据的内涵表达，即从数据中学习。


    这三个机器学习的定义各有侧重点和优点：

    * 米切尔的定义强调了学习的效果。

    * 瓦普尼克的定义关注机器学习的可操作性。

    * 哈斯蒂的定义突出了学习任务的分类。


    但这三者的共同特征是，它们都强调了经验和数据的重要性，并且认为机器学习提供了一种从数据中提取知识的方法。


    **接下来做什么？** 我们将在下一章讨论机器学习的三个步骤。请继续！


    # 第二章：机器学习的三个步骤


    机器学习在实际上近似等同于通过统计或推理在数据对象中找到与特定输入和预期输出相关的函数 `f`。通常，我们将输入变量（特征）空间写为大写的 `X`，输出变量空间写为大写的
    `Y`。


    根据定义，机器学习在形式上近似于 `Y≈f(X)`。在这种函数中，对于语音识别函数，如果给定音频信号作为输入，那么该函数 `F` 可以输出“Hello”和“How
    are you?”之类的字符串。对于图像识别函数，如果给定图片作为输入，在该函数的处理下，可以将猫或狗的判断作为输出（或识别结果）。


    从棋类函数来看，如果输入是围棋的棋谱状况，该游戏的下一步“最佳”移动可以作为输出。对于具有智能交互功能的系统（如微软的 Bing），当我们输入相同的语句如“How
    are you?”时，它可以输出智能应答，如“I am fine, thank you.”。


    每个特定的输入都是一个实例，它通常由特征向量组成。这里，所有特征向量存在的空间被称为特征空间，特征空间的每一个维度都对应实例的一个特征。但问题是，这种“易于使用”的函数并不容易找到。


    在输入猫的图片后，该函数并不一定输出“这是一只猫”，它可能会错误地输出这是一只狗或这是一条蛇。由于由于，我们需要建立一个评估系统来识别函数的优缺点。当然，非常有必要通过模型训练数据来培养良好的函数质量，这正是机器学习产生的地方。


    正如我们之前提到的，学习的核心是提高性能。通过训练数据，我们将成功率从 `f1` 提高到 `f2`。尽管 `f2` 仍然会有分类错误，但与 `f1` 的所有错误相比，它的性能已经得到了提高，这仍然处于学习阶段。具体来说，如果你想做好机器学习，你需要理解并遵循围绕它的三个主要步骤和哲学原则：


    1. 理解如何找到一系列函数，将预期的函数转化为建模问题。

    2. 理解如何找到一系列评估标准，将函数的评估转化为评估问题。

    3. 理解如何快速找到性能最佳的函数，将其转化为优化问题。


