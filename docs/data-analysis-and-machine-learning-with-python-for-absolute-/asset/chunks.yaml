    损失函数的值越小，实际输出与预期输出 `y` 之间的差异越小，我们构建的模型就越好。


    第一类损失函数很容易解释，即它显示了目标是否已实现。如果 `Achieved`，输出将为 `0`（无损失），如果未达到，则输出为 `1`。


    第二类损失函数更具体。以减肥为例，当前体重读数与减肥目标之间的差异可能是正数也可能是负数。例如，假设我们的减肥目标是 `70 kg`，但我们不小心减得太多了，到了
    `60 kg`，那么差异将是 `"-10"` kg。为了避免这种正负值的干扰，我们应该简单地取其绝对值。


    第三类损失函数与第二类相似，也起到了避免正负值干扰的作用。然而，为了计算方便（主要为了推导），有时会在前面加上一个系数 `"1/2"`，这样通过指数上的 `"2"`
    乘以系数上的 `"1/2"` 就可以得到 `"1"`。


    当然，为了计算方便，我们也可以使用对数损失函数，即第四类损失函数。其目的是可以使用极大似然估计来找到极值（将难以计算的乘除法转换为相对容易计算的加减法）。


    也许你可能会问，这些损失函数有什么用呢？它们当然有效！因为我们依靠这些损失函数的大小来“监督”机器学习算法，并使其朝着预期的目标移动。它是监督学习的核心符号之一之一。


    # 第 5 章 无监督学习


    与监督学习相反，无监督学习处于一个没有标记数据的学习环境中。世界各地的机器学习专家也指出，无监督学习本质上是“聚类”的同义词。聚类的想法起源非常早，可以追溯到中国和中东国家的《易经》。然而，真正意义上的聚类算法是在
    1950 年左右提出的。


    ## 为什么落后了这么多？


    原因是聚类算法的成功高度依赖于数据。当数据量较小时，聚类过程意义不大。当数据量很大时，人类大脑会变得迟钝，问题只能通过计算机解决，而计算机直到 1946 年才出现。


    如果说分类根据数据的特征或属性将新对象划分为现有的类别，那么聚类最初并不知道数据将被分成多少类，而是通过分析将数据聚合成几组。简单来说，给定数据，聚类能从数据学习到什么取决于数据本身的特征。


    基于此，大学教授对聚类做出了精彩的 12 字总结。一旦总结了一系列“类”或“组”的特征，当新数据来临时，我们可以根据它更接近哪个“类”或“组”来预测它属于哪一个，从而完成新数据的“分类”或“分组”功能。


    这就是整个无监督学习。众知的无监督学习算法包括 `K-Means Clustering`、`Hierarchical Clustering`、`Principal
    Components Analysis (PCA)`、`DBSCAN`、`Deep Belief Net` 等等。


    # 第 6 章 半监督学习


    半监督学习同时使用标记数据和未标记数据。从特定的角度来看，现代人类成长和学习的最佳方式是“半监督学习”。它既不是纯的“监督学习”（如果是这样，我们的创造力和认知系统可能会受到抑制，永远无法超越父母和老师），也不是完全的“无监督学习”（如果是这样，我们将花费大量时间像无根浮萍一样造轮子）。


    ## 到底什么是“半监督学习”？


    我们在下方给出它的正式定义。给定一组来自未知分布的标记示例 `(x1,y1), (x2,y2),...,(xk,yk)`，其中 `xi` 是输入数据，`yi`
    是标签。对于未标记样本集 `U=xk+1, xk+2,..., xk+u`，其中 `u` 是未标记样本的数量。我们期望通过学习得到某个函数：`fY→X`，通过它我们可以准确地预测未标记数据
    `lix+` 的标签 `iy`。


    这里，`xi∈X` 是一个 `D-dimensional vector`，`yi∈Y` 是示例 `xi` 的标签。


    正式定义很抽象，让我们举一个生活中的例子来帮助理解这个概念。假设我们已经学习：

    (a) Tom 的同学（数据 1）是一个富二代（标记为富二代）

    (b) Sam（数据 2）是一个富二代（标记为富二代）。


    假设我们不知道 Tom 的同学（数据 3）是谁或是否富有，但考虑到他经常和他一起出入高标准的会议，他经常接触上层阶级（也就是说，尽管他们是独立的，但分布在同一个地方），因此我们可以根据社会的观念轻松地将
    Tom 的同学标记为“富有者”。结果，我们已知的领域（标签数据）扩大了（从两个到三个），这完成了半监督学习的过程。


    事实上，半监督学习是利用“已知认知（标记的分类信息）”来扩展“未知领域”（通过聚类思想将未知归类为已知领域）。


    ## 算法与需求


    但存在一个基本的假设——聚类假设，其核心是相似样本具有相似的输出。常见的半监督学习算法包括 `generative method`、`semi-supervised
    support vector machine (S3VM for short)`、`graph semi-supervised learning`、`semi-supervised
    clustering` 等。事实上，我们对半监督学习的需求非常强烈。原因非常简单，因为人们能收集的标记数据非常有限，人工标记数据需要大量的人力和物力，但未标记数据大量且易于获取，这在互联网数据中更为常见，因此半监督学习特别重要。

    '
