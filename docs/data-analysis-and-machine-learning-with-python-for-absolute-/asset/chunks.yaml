    # 第 3 章 进入 VBA 运行环境


    在 Excel 中，`VBA` 语句主要在 Visual Basic 编辑器中编写、修改和运行。Visual Basic 编辑器简称为 `VBE`。它是一个可以与
    Excel 无缝链接的独立应用程序。但要使用 `VBE`，你必须先打开 Excel。`VBA` 模块存储在 Excel 工作文件中。除非激活了 `VBE`
    窗口，否则 `VBA` 模块是不可见的。什么是模块？简单来说，模块就像存储 `VBA` 语句的地方。我如何进入 `VBE` 窗口呢？除了我们刚刚掌握的通过编辑宏进入
    `VBE` 窗口外，还有其他常用的进入 `VBE` 窗口的方法。


    - 在“开发工具”选项卡的“代码”组中，点击“Visual Basic”按钮。

    - 按下组合键 `Alt+F11`。


    进入进入模块后，请亲自尝试不同的功能，以便更好地理解软件的范围以及可能需要的自动化原理。在下一节中，我们将讨论 `VBA` 调试技巧。


    ## VBA 调试技巧


    如果你不是一名经验丰富的 `VBA` 用户，那么你编写的 `VBA` 语句往往无法运行，并可能产生难以清除的错误。例如，如果语句中缺少符号或空格，它可能无法正常运行，甚至无法启动。这需要经过调试和修改才能正确运行。此时，我们需要通过调试来快速定位问题。`VBA`
    调试技巧主要包含以下点：


    - `F8` 键：使用 `F8` 键逐步运行 `VBA` 语句，快速定位无法运行或结果错误的 `VBA` 语句。

    - 立即窗口：可以通过 `Ctrl+G` 打开立即窗口，其中显示 `Debug` 的结果值。可以显示打印语句，并可以随时计算和运行代码。例如，我们需要检查参数
    `n` 的值是否正确，利用结果我们可以直接在 `VBE` 窗口中编写 `Debug.Print n` 语句，运行后即可显示 `n` 的值。

    - 监视窗口：可以将变量和表达式监视窗口，实时查看变量和表达式的值。

    - 本地窗口：你可以在本地窗口查看当前存在变量的值。

    - 编辑窗口：将鼠标悬停在编辑窗口中的变量上，即可显示该变量的值。


    在上述窗口中，你可以检查表达式和变量是否设置正确。通过运行代码，你可以获知此时表达式和变量的结果，也可以监控或回溯它们是否为我们所需的结果。这些是自动化软件周围的核心原理和系统哲学。我们刚刚介绍了一些与
    `VBA`相关的知识，为后续的报告自动化奠定了基础。你必须掌握这些基本概念，以免在后续专门通过示例讨论 Excel 自动化的学习过程中产生困惑。接下来，我们将学习报告自动化的相关知识。


    # 第 4 章 Excel 报告自动化


    通常，日报相对简单，主要汇报企业运营某些关键指标的完成情况。指标和通知内容基本上是固定的，因此我们可以对日报进行模板化和自动化。那么，我们如何制作模板并实现自动化流程呢？通常每天早上数据科学家首先登录公司数据库提取数据，将其复制到
    Excel 中进行相应的处理和图绘制，然后将绘制好的图表复制到 Word 文档并编辑通知文本。最后，以邮件正文的形式发送。我将在下节中详细分析介绍 Excel
    日报自动化的原理。


    1. 通过 `VBA` 语句，从数据库中自动提取前天的对应关键指标数据，并自动添加放置在名为“Data Source”的表格的对应位置，实现一键自动提取数据。

    2. 在数据转换区域，根据指定的日期条件，动态引用“data source”表中的对应数据，并自动绘图和合并通知文本。

    3. 在日报正文区域，引用对应的合并通知文本和绘制的图表。

    4. 通过控件选择要通知的日期，自动生成对应日期的日报正文。


    我们仍然使用“User Details”和“Order Details”表格作为日报数据源来介绍 Excel 日报自动化的实现。这是我们日报的最终显示结果。只要我们一键提取数据并选择要通知的日期，Excel
    就会自动引用对应的数据并生成相应的日报。连接的报告文本都合并在一起以节省精力。通常查看日报可以发现，日报通常分为两个部分：


    - 用户规模（新用户数、订阅者人数）。

    - 业务规模（订单数、业务收入）。


    这两部分等同于报告的分析框架。无论是特殊分析报告、月报、周报还是日报，每份报告都需要一个清晰的分析框架，以便读者能够正确、快速地理解报告内容。至此，我们对
    Excel 自动化流程进行了简单的介绍。在模块的下一节中，我们将讨论创建数据模板。请跟随！


    # 第 5 章 创建数据模板


    如果你有良好的数据规划习惯，不仅可以保持数据整洁，还需要减少数据处理的复杂性，节省数据处理时间并提高工作效率。同时，记住，我们需要规划日报所需的数据，建立数据模板，并实现
    Excel 日报的自动化。例如，为了方便理解，我们将提供一个示例。在“daily report.xls”文件中需要准备三个表格。以下是每个表格的简单介绍：


    - Data Source 表：用于存储每日通知所需的关键指标数据。

    - Data conversion 表：用于动态引用“data source”表中的对应数据，进行相应的数据转换，最后自动绘图并合并通知文本。

    - Daily report 表：根据分析框架，组织并引用“Data Conversion”表中的对应合并通知文本和绘制的图表，以精美的定制能力展示日报。


    '
- fmt: '

    # How to Create a "data source" table?


    First, we need to establish the data source table required by the daily report,
    and sort out the key indicators that the daily report needs to use for displaying
    the information. The key indicators are "number of new users", "subscribed users",
    "Number of Orders", "Business Revenue", "Cumulative Number of Subscribers", "Cumulative
    Number of Users", "Cumulative Number of Orders", and "Cumulative Business Revenue".


    If your daily report adds notification content, then this "data source" table
    should also include the added indicators to ensure the integrity and automation
    of the notified data.


    ## Setting Data Calculation Relationships


    After collecting and sorting out the key indicators required for the daily report,
    in the "data source" table template, you must start to set the data calculation
    relationship between the indicators.


    For example, "cumulative users", "cumulative orders", and "cumulative business
    income" columns can be used for cumulative calculation purposes. Take the "cumulative
    order count" as an example and enter the formula `=I4+E5` in cell `I5`, and then
    use the cell fill handle function in Excel to copy the formula in the cell below.
    This ensures that when there is the latest "order count", going to the "Data Source"
    table adding the "Cumulative Order Number" corresponding to the same row is also
    updated and calculated accordingly. In the same way, the “cumulative number of
    users” and “cumulative business income” are set accordingly.


    ## Logic for Cumulative Calculations


    Why does the "cumulative subscriber number" need to set the cumulative calculation
    relationship? This is because:


    1. **User Data**: We must understand that the cumulative calculation of the number
    of users is done to remove the double calculation ambiguities. The registered
    user data in the "User Details" table will not have duplicate user IDs. If it
    exists, it does not conform to the business logic. As long as it is registered
    before, it will not appear in the subsequent new registrations every day.

    2. **Order Data**: The ordering user data in the "Order Details" table has duplicate
    data, because this user can order products before and continue to order now, or
    continue to order at some time in the future, so the number of ordering users
    needs to be processed within a unit time.


    To de-duplicate calculations, simple cumulative addition calculations cannot be
    performed. Therefore, the "accumulative number of subscribers" needs to be recalculated
    in the database every day based on the number of subscribers after deduplication,
    while the "accumulative number of users" only needs to be set up once in the data
    template.


    With these basics, we can further proceed to talk about establishing a data conversion
    table.

    '
