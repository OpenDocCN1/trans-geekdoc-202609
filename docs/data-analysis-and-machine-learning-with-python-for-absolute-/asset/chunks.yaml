    # Chapter 4 Strategies and Statistical Analysis Methods


    Data analysis refers to the use of appropriate statistical analysis methods to
    analyse a large amount of collected data, and extract useful information from
    it and form conclusions. So the question is, what are the strategies and statistical
    analysis methods used for data analysis?


    From a macro perspective, the author divides data statistical analysis strategies
    into three categories, namely descriptive statistical analysis, exploratory statistical
    analysis, and inferential statistical analysis. The commonly used methods of data
    analysis are summarised into 5 types namely comparative analysis, group analysis,
    Predictive analysis method, funnel analysis method and AB test analysis method.
    Mastering these is equivalent to understanding the way of data analysis to a certain
    extent.


    Next, we will focus on the relevant knowledge points of these data statistical
    analysis strategies and methods with detailed explanations. Follow along!


    ## Three types of statistical analysis strategies


    The three types of strategies, descriptive statistical analysis, exploratory statistical
    analysis, and inferential statistical analysis, are a gradual analysis step from
    the shallower to the deeper. To engage in data analysis, you need to master these
    three types of statistical analysis strategies from the field of statistics.


