    4 core links. First, starting from the product details page, the conversion rate
    is 43.7%. That is, in this marketing activity, 43.7% of the users who has will
    enter. Therefore, with the help of the above-mentioned funnel analysis to compare
    the conversion rate between each link, when it is found that the conversion rate
    of some links has fallen steeply, it can be considered that some processes of
    the product or some steps of the marketing activities have gone out Problems,
    and then look for improvement solutions to these problems, and ultimately increase
    the overall conversion rate. 5\. AB test analysis method The AB test analysis
    method is also a comparative analysis method. This method focuses on comparing
    the two groups of AB samples with similar structure (such as similar user attributes
    and behaviours, similar product characteristics, etc.), and digging out their
    differences based on the index values ​​of the two groups of samples. For example,
    for the same functional page of an APP, two different styles of page layouts are
    designed, and then the two styles of pages are randomly assigned to test users
    (the structures of these users are relatively similar), and finally according
    to the user''s browsing conversion on the page rate to evaluate the pros and cons
    of different page layouts. Here is a specific example to illustrate. The order
    of payment methods presented by a company''s APP on the cashier interface (that
    is, the payment interface) is Whatsapp, Applepay, Normal (that is, bank card payment),
    and cash on delivery. In order to increase the proportion of quick payment, the
    order of payment methods is expected to be fine-tuned, namely Whatsapp,Applepay,
    Bankpay and cash on delivery. But can this order really increase the proportion
    of quick payments? In order to verify this problem, technicians tested two batches
    of similar sample users, and the results obtained. ￼ From the results, it can
    be seen that the adjustment of the payment method sequence still has an impact
    on the proportion of quick payment. After the adjustment of the sequence, the
    proportion of quick payment has increased by nearly two percentage points. Therefore,
    after the AB test, it can be considered that the adjustment of the payment method
    sequence is necessary. From the author''s point of view, there are certain rules
    (or steps) for solving everything, so as long as these rules are understood and
    mastered, the problem will be much simpler. For data analysis, there are also
    its rules, so readers must master the three types of statistical analysis strategies
    and five commonly used data analysis methods introduced in the previous article,
    and apply them to the work of data analysis. '
