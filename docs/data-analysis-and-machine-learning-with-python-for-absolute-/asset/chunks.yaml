    # Chapter 7 Philosophical Perspective of Machine Learning


    Philosophical Perspective of Machine Learning is important to understand because
    in the technological world privacy and safety matters. Macroscopically, basically
    all machine learning algorithms have two levels of efficacy: looking for laws
    in the past (historical data) and According to the summarised law, face the future
    (new sample) to predict. Philosophically, the former focuses on induction, while
    the latter belongs to deduction. The former is the foundation, while the latter
    is the core. Undoubtedly, the core value of machine learning algorithm is anchored
    in the prediction of new samples. ￼


    When it comes to forecasting, the most common thing in our daily life is to calculate
    divination face to face. Aside from the appearance of things, its logic also applies
    to the above two levels. Many fortune tellers can guess (that is, predict) customers''
    situation, which seems very powerful, but in fact their secret is not some art,
    but induction and deduction. There is a threshold for the profession of fortune
    telling. Not everyone can do it. Fortune tellers also need to learn. One of the
    esoteric books to train them is a booklet called "The fortune tellers guide".
    There are many useful observation formulas in this book.


    A great philosopher once said that induction is the foundation of all human knowledge.
    Yes, induction (abstracting general features from many individuals) is not the
    end point of knowledge. Only by performing prediction through deduction (from
    general to individual) can knowledge play its role. The same is true of fortune
    telling.


    When a customer (new sample) comes to tell fortune, the face reader can get the
    necessary information through observation, speech and some practical psychological
    skills. In the jargon of machine learning, it is to extract features. Applying
    the laws summarised in the past, we can accurately infer the identity of the person.
    In the jargon of machine learning, it is called as classification. We analysed
    the methodology of machine learning by taking face-to-face hexagrams as an example.


    All our current machine learning applications can basically be counted as "big
    fortune telling" based on big data (equivalent to historical experience) and big
    computing power (such as cloud computing). Why machine learning is being called
    "great fortune telling"? It can be seen that whether shopping on e-commerce websites,
    reading news on headlines, brushing vibrato or microblogging, the information
    (including advertisements) pushed by smart terminals is basically thousands of
    people, and it is by no means the same.


    In fact, in the digital world, your every move, every screen click, every friend''s
    praise, the stay time of page access, and the weight of fingertip sliding all
    constitute the learning material of machine learning algorithm, thus helping machine
    learning algorithm to form the "user profile" of each "customer". Finally, with
    the blessing of great computing power, distributed machine learning algorithm
    can give thousands of people "fortune telling" at the same time, and guess the
    preferences of users.


    ## Model performance evaluation


    Back to the discussion of machine learning. We know that many machine learning
    models can be used to solve the same problem, so how to evaluate the quality of
    these models? At this time, it is necessary to construct a series of "reliable"
    standards. Therefore, when it comes to machine learning, performance evaluation
    is an unavoidable topic.


    ## Experience error and test error


    Performance evaluation is mainly used to reflect the effect of the constructed
    learning model. In the prediction problem, to evaluate the performance of the
    model, it is necessary to compare the prediction results with the real labels.
    For supervised learning, if we have `M` samples, of which `A` is wrongly classified
    by the model, then a simple evaluation standard-classification error rate can
    be defined as `A/M`.


    Generally speaking, we call test error of learning model in training set, test
    set and generalisation error. Generalisation here refers to the performance of
    the model in new situations and new samples, and you can also understand it as
    "universal". Obviously, the ultimate goal of the training model is not only to
    expect it to perform well in the training set, but also to perform not inferior
    to the new samples in the environment. The adaptability of machine learning algorithm
    to new samples is called generalisation ability. This is like, if we train our
    children to be obedient and everything meets our expectations at home, it may
    not be a good thing, because the children will eventually go out of the house
    and set foot on the society. If, in the new environment, children can show strong
    adaptability (in terms of machine learning, strong generalisation ability), this
    is what we want. However, before the arrival of the new sample, we had no idea
    what it looked like.


    Therefore, it is only a beautiful dream to improve the generalisation ability
    of the model with the help of the so-called "new sample". Usually, what we can
    do is to divide the available data into two, one for training and the other for
    testing. It is used as a test set, which is functionally equivalent to a new sample
    because it does not participate in training. When training the model, the initial
    training error and test error are relatively high. With the increase of training
    times (the complexity of the model is improved), the training error will become
    smaller and smaller, but the test error may become larger and larger. We need
    to tradeoff the training error and test error to make them reach a trade-off equilibrium
    point. ￼ Why are training errors and testing errors high at first, and then they
    will gradually go their separate ways? This involves two important concepts in
    machine learning: under-fitting and overfitting, which are introduced separately
    in the next chapter.

    '
