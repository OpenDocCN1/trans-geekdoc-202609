    # 第 2 章 IDE 和 IDLE


    编程步骤通常易于跟从。但对于刚接触编程的初，我们提供了多种方法来帮助你理解以下主题。在程序运行期间，首先需要一个编辑器来编写代码。写完代码后，我们需要一个编译器将代码编译给计算机执行。在代码运行过程中，不可避免会发生一些错误。这时，你需要使用调试器对代码进行调试。


    ## 什么是 IDE？


    IDE 是英文 Integrated Development Environment（集成开发环境）的缩写，意味着将开发者所需的所有组件集成在一个平台中。集成开发环境是一种用于提供程序开发环境的应用程序。该程序通常包含代码编辑器、编译器、调试器和图形用户界面等工具。IDE
    包含了编程过程中使用的所有工具，因此我们我们在编写程序时通常选择使用 IDE。


    IDLE 是 IDE 之一，也是最简单、最基础的 IDE。当然，IDE 中有很多种 IDLE，例如 Visual Studio (VS)、PyCharm、Xcode、Spyder、Jupyter
    Notebook 等。如今，在数据分析领域，Jupyter Notebook 用得更为常用，本书中也会用到它。然而，我们需要告知你，IDE 的选择取决于个人喜好，我们希望你稍作研究，选择适合你需求的工具。


    ## Jupyter Notebook 简介


    ### a) 创建新的 Jupyter Notebook 文件

    在计算机搜索框中输入 `Jupyter Notebook`（不区分大小写），然后点击 `Open` 启动程序。打开 Jupyter Notebook 后，点击右上角的
    `New` 按钮，并在下拉列表中选择 `Python 3` 选项来创建一个 Python 文件。如果你尝试将其到其他平台，也可以选择 `Text File`
    选项创建一个 `.txt` 格式的文件。当你看到带有正常界面的界面时，意味着你已经创建了一个新的 Jupyter Notebook 文件。


    ### b) 运行你的第一段代码

    如前所述，在代码框中输入代码 `print("hello world")`，然后点击 `Run` 按钮，或按下 `Ctrl+Enter` 组合键。几秒钟内它将输出
    `hello world`，这意味着你的第一段代码正在成功运行。当你想要更改代码框以输入代码时，可以点击左上角的 `+` 按钮添加新的代码框。


    ### c) 重命名 Jupyter Notebook 文件

    在创建新的 Jupyter Notebook 文件时，文件名默认 `Untitled`（类似于 Excel 中的工作簿）。你可以点击 `File>Rename`
    来重命名文件。我们建议你在开始程序之前遵循某些重命名规则。不要在文件名中使用模糊的名称和符号。始终保持简单且易于组织。


    ### d) 保存 Jupyter Notebook 文件

    在编写代码并确定文件名后，此时可以保存代码文件。有两种保存方法：

    - **方法一**：点击 `File>Save and Checkpoint` 保存文件。这种方法会将文件保存到默认路径，默认文件格式为 `.ipynb`，这是
    Jupyter Notebook 的专属文件格式。

    - **方法二**：选择 `Download as` 选项保存文件，这等于 Excel 中的“另存为”。你可以自己选择保存路径和保存格式，以便更好地理解文件机制。


    ### e) 导入本地 Jupyter Notebook 文件

    当你收到 `.ipynb` 文件时，如何在计算机上打开它？打开文件？你可以点击 `Upload` 按钮找到文件的位置，并将文件加载到 Jupyter Notebook
    中。


    ### f) Jupyter Notebook 和 Markdown

    Jupyter Notebook 的代码框默认是代码模式，用于编程。你也可以将 Jupyter Notebook 的模式切换到 Markdown 模式。此时，代码框将变成文本框，内容将支持
    Markdown 语法。当你进行数据分析时，可以使用 Markdown 写下分析结果。这是 Jupyter Notebook 在数据从业者中流行的原因之一。


    ### g) 将目录添加到 Jupyter Notebook

    目录的功能是让内容易于查找。通常，较长的内容会有目录，如书籍、毕业论文等。你可以点击目录跳转到相应的代码。Jupyter Notebook 并不包含目录，需要手动安装。具体的安装过程如下：


    1. 在 Windows 搜索框中输入 `Anaconda Prompt` 并点击 `Open` 启动程序。

    2. 输入 `pip install jupyter_contrib_nbextensions` 并按回车运行，以安装 `jupyter_contrib_nbextensions`
    模块。

    3. 程序中间会出现 `y/n` 选项。输入 `y` 并按回车，直到出现 `Successfully installed` 提示为止。

    4. 在第 3 步的基础上，继续输入 `jupyter contrib nbextension install --user` 并按回车配置用户系统。

    5. 完成第 4 步后，打开 Jupyter Notebook，你将在界面上看到一个额外的 `Nbextensions` 标签，可以进一步实现。点击 `Nbextensions`
    标签打开它，并勾选 `Table of Contents(2)` 复选框。

    6. 此时，打开一个已有目录的 `.ipynb` 文件，你会在主界面框中看到一个额外的按钮（如图），但还没有显示目录。按下右上角框中的按钮，目录就会显示。


    上述步骤 1-6 为 Jupyter Notebook 创建了目录环境。接下来的部分将描述如何创建一个带有目录的新文件。


    1. 选择 `Heading` 作为代码框格式，并进入下一步以获得更好的优化。

    2. 直接在代码框中输入不同级别的标题。`1#` 表示一级标题，`2#` 表示二级标题，`3#` 表示三级标题（注意 `#` 与标题文本之间有一个空格）。标题级别随着
    `#` 的数量而降低。

    3. 运行第 2 步的代码块，你就可以获得你想要的结果。


    '
- fmt: "\n# Chapter 3 Basic concepts of Python Numbers\n\n## Python Numbers\nNumbers\
    \ are numbers used in daily life. In Python, integers and floating-point numbers\
    \ are commonly used, as shown in the following example.\n\n```python\nVar = 2\
    \ // This is an integer\nVar = 33.4 // This is a floating point number\n```\n\n\
    You can determine whether a number is an integer or a floating-point number by\
    \ checking whether there is a decimal point. For example, `66` is an integer,\
    \ but `66.0` is a floating-point number.\n\n## Variables\nVariables, that is a\
    \ synonym for the amount of change, can be understood as a container in which\
    \ various things (data) can be placed (stored), and the things that are placed\
    \ can be changed. There are many data points in the computer to store different\
    \ data. In order to distinguish different containers, we need to name these containers,\
    \ which is the essence of variable name. We can access the variable through the\
    \ variable name.\n\nWe can use four canned bottles as an analogy to understand\
    \ the importance of variables. The four canned bottles are four containers, that\
    \ is, four variables. From left to right, we named them `canned pineapple`, `canned\
    \ strawberry`, `canned yellow peach`, and `canned orange`. In this way, specific\
    \ variables can be obtained by the variable name. Variable names are the same\
    \ as we named them, and there is a certain degree of care. When defining variable\
    \ names in Python, you need to follow the following principles:\n\n- The variable\
    \ name must start with a letter or underline (`_`), and the middle of the name\
    \ can only consist of letters, numbers and underline.\n- The length of the variable\
    \ name must not exceed 255 characters.\n- The variable name must be unique within\
    \ the valid range.\n- Variable names cannot be keywords in Python.\n\nThe keywords\
    \ in Python are as follows: `Var`, `Var2`, `_var`. Variable names are case-sensitive.\
    \ For example, `Var` and `var` represent two different variables. \n\n## Identifiers\n\
    Identifiers are used to identify the name of something. They are used in Python\
    \ to identify variable names, symbolic constant names, function names, array names,\
    \ file names, class names, object names, etc. The rules for naming identifiers\
    \ are the same as those for naming variable names.\n\n## Data Types\nThere are\
    \ two main types of data in Python, number and string, of which numbers include\
    \ integer and floating point. We can use the `type()` function to view the data\
    \ type of a specific value.\n\n```python\nInt var = 1\nVar = 1.0\nprint(\" Hello\
    \ world\")\n```\n\nIn the above code, `1` is an integer, `type(1)` is an `int`;\
    \ `1.0` is a floating-point type, and `type(1.0)` is a `float`; `\"hello world\"\
    ` is a string, `type(\"hello world\")` the result is `str`.\n\n## Output format\
    \ settings\nIn Python, we use the keyword `print` for output. Sometimes we need\
    \ to do a certain amount of output format settings can be set using the `str.format()`\
    \ method. Where `str` is a string, the contents of `format` are filled into `{}`\
    \ of `str` string.\n\n```python\nprint(\" Hello world\")\n```\n\nFloating point\
    \ number settings: `.2f` means to display in floating point type and to display\
    \ two decimal places, or `.3f` or others.\n```python\nprint(.2f)\n```\n\nPercentage\
    \ setting: `.2%` indicates that it is displayed as a percentage, and two decimal\
    \ places are displayed, which can also be `.3%` or other.\n```python\nprint(%2)\n\
    ```\n\n## Indentation and annotation\nFor programmers, indentation and annotation\
    \ are pretty important. They not only make everything seem less fancy but also\
    \ will help programmers understand the importance of good coding practices.\n\n\
    ### Indent\nWe call the blank part at the beginning of the line of the code indentation.\
    \ The purpose of indentation is to identify the code block, that is, to let the\
    \ program know which part to run. Take `if` conditional statements as an example,\
    \ indentation is to let the program know which statement to execute when the conditions\
    \ are met. In other languages, curly braces are commonly used to indicate indents.\
    \ As long as there are spaces at the beginning of the line, even if it is indented,\
    \ no matter how many spaces there are, it is usually indented with 4 spaces, which\
    \ is also convenient to read the code. The statement blocks in functions, conditional\
    \ statements and loop statements in Python need to be indented.\n\n### Comments\n\
    Comments serve as explanatory to the code and do not really run. One-line comments\
    \ begin with `#`, as shown below. Multi-line comments can be implemented with\
    \ multiple `#`s, `'''`s, or `\"\"\"`s, as shown below.\n\n```python\n// This is\
    \ great and a comment\n```\n\nIn the next chapter, we will further expand our\
    \ python skills by discussing about strings and their functionalities.\n"
