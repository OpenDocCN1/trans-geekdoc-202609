    # 第 7 章 机器学习的哲学视角


    理解机器学习的哲学视角非常重要，因为在技术世界中，隐私和安全至关重要。从宏观上看，基本上所有的机器学习算法都有两个效能层面：在过去（历史数据）寻找规律，以及根据总结的规律面对未来（新样本）进行预测。从哲学角度来说，前者侧重于**归纳**，而后者属于**演绎**。前者是基础，后者是核心。毫无疑问，机器学习算法的核心价值锚于对新样本的预测。


    涉及到预测时，我们日常生活中最常见的就是面对面面相。除了事物的外表，其逻辑也适用于上述两个层面。许多占命师可以猜测（即预测）客户的情况，这看起来非常强大，但实际上他们的秘密并非某种术法，而是归纳与演绎。算命这一职业是有门槛的，并不是每个人都能做的。占命师也需要学习，训练他们的秘籍之一是一本名为《占命师指南》的小册子。书中有很多实用的观察公式。


    一位伟大的哲学家曾说，归纳是人类所有知识的基础。是的，归纳（从许多个体中抽象出通用特征）并不是知识的终点。只有通过演绎（从一般到特殊）进行预测，知识才能发挥其作用。算命也是如此。


    当一个客户（新样本）来算命时，面相师可以通过观察、语言和一些实用的心理技巧获取必要信息。在机器学习的术语中，这被称为**提取特征**。应用过去总结的规律，我们可以准确地推断出人的身份。在机器学习的术语中，这被称为**分类**。我们以面对面看卦为例，分析了机器学习的方法论。


    我们目前所有的机器学习应用基本上都可以看作是基于大数据（等同于历史经验）和强大算力（如云计算）的“大算命”。为什么机器学习被称为“伟大的算命”？可以看出，无论是在电子商务网站购物、阅读标题新闻、刷短视频还是发微博，智能终端推送的信息（包括广告）基本上是成千上万人的，且各不相同。


    事实上，在数字世界中，你的每一个动作、每一次屏幕点击、每一个朋友的赞美、页面访问停留时间以及手指滑动的权重都构成了机器学习算法的训练材料，从而帮助机器学习算法形成每个“客户”的“用户画像”。最后，在强大算力的加持下，分布式机器学习算法可以同时为成千上万人进行“算命”，并预测用户的偏好。


    ## 模型性能评估


    回到机器学习的讨论。我们知道许多机器学习模型可以解决同一个问题，那么如何评估这些模型的质量呢？此时，有必要构建一系列“可靠”的标准。因此，涉及到机器学习时，性能评估是一个不可避免的话题。


    ## 训练误差与测试误差


    性能评估主要用于反映构建的学习模型的效果。在预测问题中，为了评估模型的性能，需要将预测结果与真实标签进行比较。对于监督学习，如果我们有 `M` 个样本，其中
    `A` 被模型分类错误，那么一个简单的评估标准——分类错误率可以定义为 `A/M`。


    通常，我们把训练集中的模型误差称为训练误差，测试集中的误差称为泛化误差。这里的泛化是指模型在新情况和新样本中的表现，你也可以理解为“通用性”。显然，训练模型的最终目标不仅是希望它在训练集上表现良好，还希望它在环境中的新样本上表现不逊它们。机器学习算法对新样本的适应性被称为**泛化能力**。这就像如果我们训练孩子很听话，在家里一切都符合我们的预期，这可能不是一件好事，因为孩子最终会离开家踏入社会。如果在新环境中孩子能表现出很强的适应性（在机器学习中，即很强的泛化能力），这才是我们想要的。然而，在新样本到来之前，我们并不知道它是什么样的。


    因此，借助所谓的“新样本”来提高模型的泛化能力只是一个美丽的梦想。通常，我们做的是将可用数据分为两个，一部分用于训练，另一部分用于测试。后者作为测试集，在功能上等同于新样本，因为它不参与训练。训练模型时，初始的训练误差和测试误差较高。随着训练次数的增加（模型复杂度提高），训练误差会变得越来越小，但测试误差可能会变得越来越大。我们需要权衡训练误差和测试误差，使达到达到平衡点。为什么训练误差和测试误差最初很高，然后会逐渐分道扬扬？这涉及到机器学习中的两个重要概念：**欠拟合**和**过拟合**，它们将在下一章分别介绍。

    '
- fmt: '

    # Chapter 8 Over-fitting and Under-fitting


    ## Under-fitting

    The concept of under-fitting is easy to understand, that is, insufficient samples,
    poor training, and even the features in the existing data sets (i.e., training
    sets) are not well learned. When it makes predictions in the face of new samples,
    the natural prediction effect is not much better. Sometimes, we also call under-fitting
    high bias.


    ## Over-fitting

    Over-fitting means that the model "meticulously" reflects the features in the
    training data, so that it is too "excellent" in the training set. But as a result,
    its ability to predict unknown data (new samples) will be relatively poor, and
    the classifier will not know if there is any trouble. Therefore, sometimes we
    also call overfitting high variance.


    The high variance here means that the model is good in one place (training set)
    but not in another place (test set), which shows that the generalisation ability
    of the model is poor. In addition, the so-called training data itself has errors.
    Too precise fitting may take the errors of these data as characteristics to learn,
    which leads to the more accurate fitting in the training set, the worse the prediction
    effect in the face of new samples.


    Under-fitting is easy to overcome, such as expanding branches in decision tree
    algorithm, and increasing the number of training rounds in neural network, so
    as to learn the features contained in samples more delicately. In comparison,
    it is much more difficult to overcome over-fitting.


    ## Model selection and data fitting

    An important reason for fitting is that the model is too complex. What we need
    is a more simplified model to learn the features contained in the data. This corrective
    strategy of "returning to nature" is `regularisation`.


    It can be seen that if we blindly seek to reduce the training error, the complexity
    of the selected model can only get higher and higher. Because only in this way
    can the model have strong data fitting ability. However, when the model is complex
    enough, there will be too many parameters in the model, and the probability of
    fitting will rise. When choosing a model, we need to follow a basic principle:
    avoid over-fitting and improve generalisation ability.


    The relationship between model selection and data fitting is illustrated by taking
    the fitting problem of polynomial function as an example. For such a training
    data set `T=(x1,y1),(x2,y2),...,(xn,yn)`, where `xi` is the observed value (i.e.,
    feature) of the sample and `yi` is the corresponding output observed value (`i
    = 1, 2, ..., n`). Now our task is to fit these data with polynomial function of
    degree `m` (since the observed values are continuous values, this is a regression
    task rather than a classification task).


    Here, `m` is a variable value, for example, a polynomial of the first degree (`m=1`),
    a polynomial of the third degree (`m=3`), and so on. Our goal is to select a polynomial
    function which can fit the training data well and predict the new samples well.
    Equation is interpreted as follows: At present, there are `m+1` features: `x0,x1,x2,...,xm`.


    * There are `m+1` weight parameters to be learned: `w0, w1,w2,…,wm`.

    * The positive and negative, large and small of these parameters represent our
    "attitude" in choosing features. If a certain `wi` is a large value, it means
    that its corresponding feature `xi` is "highly weighted" and deserves attention.

    * If a certain `wi` value is close to 0, it means that the feature `xi` associated
    with this weight value is "people talk lightly" and is optional.


    Low consciously let some weights close to 0, so as to abandon some characteristics
    of the training method, called `weight decay` (weight decay), it avoids the over-fitting
    to some extent. The question now is, how to learn "these are m+1 parameters"?


    One of the commonly used strategies is the least squares (`MLS`). Generally, there
    is an error between the fitted function value `f(xi,w)` and the expected label
    `yi`, that is, the residual. In 1829, the great mathematician Gauss proved that
    under the assumption that errors `e0,e1,...,en` are independently and identically
    distributed, the least square method has an advantage. The variance is the smallest
    among all unbiased linear estimation classes (see Gauss-Markov Theorem, Gauss-Markov
    Theory).


    That is, when the sum of squares of residuals is the smallest, the similarity
    between fitting function `fxw` and expected label `y` is the highest. That is,
    when `L(w)` in formula gets the minimum value. `w0, w1, w2, ..., wn` are the optimal
    fitting parameters.

    '
