    # Chapter 6 Skills to be mastered


    For a data analyst, most of the daily work can be done by combining `Excel` and
    `SQL`. `Excel` is used for data processing and processing analysis, `SQL` is used
    for data query. The author has also consulted many friends in the circle, they
    have similar patterns in their work, namely `Excel` and `SQL`. Fortunately, these
    two tools are relatively easy to learn. In the author''s opinion, the difficulty
    is how to flexibly apply `Excel` skills and sort out the `SQL` access logic to
    improve work efficiency.


    ## Excel


    Excel is very important. It is not just a container for storing data. Users can
    also use its powerful functions, pivot tables, visualisation, `VBA` and other
    functions to help it complete a large amount of data analysis. Here may as well
    list some commonly used `Excel` functions. For example, statistical functions
    (`COUNT`, `COUNTA`, `COUNTBLANK`, `COUNTIFS`, `SUM`, etc.), string functions (`LEN`,
    `LENB`, `LEFT`, `RIGHT`, `MID`), numerical functions (`RAND`, `RANDBETWEEN`, `ABS.`)
    are some of the available functions in `excel` environment. If readers can use
    these `Excel` functions flexibly, data processing in daily work will become simple
    and easy.


    In addition, the powerful visualisation features included in `Excel` (such as
    pie charts, `bar charts`, `histograms`, `line charts`, `area charts`, `scatter
    charts`, `bubble charts`, `radar charts`, etc.) will also help daily data analysis
    (but `Excel` is mainly used for the processing of small data sets, but it will
    appear to be powerless when facing big data, at this time it cannot be compared
    with `Tableau`).


    `VBA` belongs to the programming part of `Excel` and is a macro language. It is
    organised by a series of commands and functions. Using powerful macro functions
    can avoid a lot of repetitive work, thereby saving time and improving work efficiency.
    Although `VBA` is not used very frequently in work, if there is an opportunity,
    readers use it to develop data reports or perform table calculations, which will
    greatly improve work efficiency and sense of accomplishment.


    ## Superb database query skills


    Database query skills are an essential skill for data analysts. First of all,
    if you don’t have this skill, you will find it difficult to find a job, because
    during the interview, the company will have some database-related test points.
    Second, if you need to deal with a large amount of data in the work, you will
    be very passive and making the work progress is not smooth, which reduces work
    efficiency.


    The reason why the database is important is mainly because the data that needs
    to be analysed in the work basically comes from the database. If you do not know
    how to query data from the database, it will become very difficult to process
    the data, which will also lead to the next step. Analysis cannot be carried out.
    Although there are many kinds of databases in the current market, such as `Oracle`,
    `SQL Server`, `MySQL`, `Hive`, etc., it does not mean that you have to learn them
    all, because they all use structured query languages and various database syntax.
    They are all very similar, as long as you have a good command of `SQL`, it can
    be said to be a pass through. For zero-based readers, it is recommended to go
    to the official `MySQL` website to download the community version of the database
    and then learn the query, modification, deletion, insertion, and stored procedures
    in the database and other related knowledge points.


    ## Proficient data visualisation skills


    To get familiar with the skills of data visualisation is also an essential requirement
    for data analysts, because data visualisation is very important for making vivid,
    eye-catching, and intuitive data reports. At present, more and more companies
    are beginning to pay attention to visualised data reports, and use various visualisation
    tools, such as `Excel`, `Tableau`, `PowerBI`, `Echarts`, and `D3.js`.


    Similar tools such as `Excel`, `Tableau`, and `PowerBI` are relatively simple
    to use, and you can draw cool visual graphics only by dragging and dropping. Readers
    can go to the official website of `Tableau` (`https://www.tableau.com`) to download
    and use the software, and then refer how to use `tableau` to draw commonly used
    statistical graphs to make boring data change to be more vivid.


    `PowerBI` is a business intelligence analysis software produced by `Microsoft`.
    It is a professional report production and data visualisation analysis tool that
    can be used as the analysis and decision engine behind the project team, department
    or the entire enterprise. The function of this software is similar to `Tableau`.
    It supports the connection of different data sources, the integration and processing
    of data, interactive reports, graphical visualisation analysis, the production
    and release of dashboards, etc. Readers can go to the `PowerBI` official website
    (`https://powerbi.microsoft.com`) to download and use the software.


    For similar tools such as `Echarts` and `D3.js`, readers are required to master
    a certain `JavaScript` language, and their learning costs will be relatively high.
    It can be further developed and learned through open source. Its disruptive functional
    design and technical features have received high attention from the industry.
    It has quickly become a "rising star" in the field of domestic data visualisation.
    It has been applied by hundreds of domestic companies in news media, securities
    finance, e-commerce, tourism and hotel, weather geography, games, electricity
    and many other fields. Readers can go to `Echarts` official website to learn more
    about the relevant knowledge.


    The full name of `D3` is `Data-Driven Documents`, which is a `JavaScript` library,
    mainly used to realise data visualisation. Since the suffix of `JavaScript` files
    is usually `.js`, `D3` is also called `D3.js`. In terms of data visualisation,
    `D3` can realise complex visualisation of data with only a few simple functions
    and generate gorgeous graphics. The visualisation effect of `D3` is shown. Readers
    can go to the official website of `D3` (`https://d3js.org/`) to learn more about
    it.


    ## Statistical programming techniques


    I don’t know if readers have found a problem, that is, when you are looking for
    jobs related to data analysis, you will basically see statistical modelling or
    data mining skills mentioned in the company’s job requirements, and applicants
    will also be attached. Some statistical software that should be mastered (such
    as `SPSS`, `SAS`, `Python`, `R`, etc.). Of the 4 software mentioned above, except
    `SPSS` which is a "dumb" statistical tool (ie a menu-based statistical tool, no
    programming is required), the other three are all programming statistical tools.
    For readers, it is very important to master the use of one or some of these tools
    and whether their proficiency in the use of these tools meets the requirements
    of the company is very important in the job search process and subsequent work.


    In daily work, the commonly used statistical models (or methods) include point
    estimation, interval estimation, analysis of variance, various hypothesis tests
    (such as `chi-square test`, `t test`, `F test`, `normality test`, etc.), data
    dimensionality reduction (such as `principal component analysis`, `factor analysis`,
    etc.). Commonly used data mining models include prediction algorithms (such as
    `multiple linear regression models`, `decision tree models`, `random forest models`,
    `K nearest neighbour algorithms`, `support vector machine SVM models`, etc.),
    classification algorithms (such as `Logistic regression model`, `Bayesian algorithm`,
    `boosted tree GBDT algorithm`, etc.) and clustering algorithms (such as `K-means
    clustering`, `hierarchical clustering`, `density clustering`, etc.).

    '
