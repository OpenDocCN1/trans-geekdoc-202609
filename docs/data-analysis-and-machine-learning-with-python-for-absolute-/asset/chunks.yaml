    # Chapter 3 Development Trends of Data Analysis


    In the previous chapter we have talked about different application scenarios of
    data analysis. In this chapter we will talk about development trends of data analysis.
    Follow along to know more about it.


    ## 1. Technological trends


    The development of big data technology makes data collection, storage, security
    and other technologies more and more mature. People pay more and more attention
    to the value of collected and stored data, thus driving the development of data
    analysis and data mining technology. The information extracted from massive data
    by using big data analysis technology has extremely high value.


    For example, supporting senior management of enterprises to make business decisions,
    identifying new sales and market opportunities, improving the organisation''s
    social media marketing capability, improving user loyalty and re-purchase rate,
    reducing user turnover rate, predicting risks in advance and preventing them are
    some of the examples.


    The development direction of big data analysis technology in the future can be
    roughly divided into the following two points: first, in-depth analysis of massive
    structured and semi-structured data to mine the hidden knowledge behind the data
    and the second is to carry out in-depth mining of unstructured data, transforming
    the rich information contained in text, graphics, sound, movies, hypermedia and
    other types into useful knowledge.


    ## 2. Industrial Development Trend


    The development of big data technology has driven the emergence and development
    of high-tech service industry including the combination of data software and hardware,
    consulting service industry providing professional big data solutions, and data
    service industry integrating data collection, processing, processing and analysis.
    Many departments of the world have successively issued policies to promote the
    development of the big data industry. With the gradual implementation of the policies,
    the development speed of the big data industry will also be faster and faster.


    ## 3. Talent Development Trend


    The development of big data technology has driven the rapid growth of enterprises''
    demand for big data analysis talents. Due to the lag in the training of big data
    talents, there is a large gap in big data analysis talents. Therefore, big data
    analysis talents will remain hot in the future.


    At present, the number of data analysis-related posts published on domestic mainstream
    recruitment websites shows a sustained and rapid growth, which shows that enterprises
    have a great demand for big data analysis talents. Judging from the job distribution
    area of data analysts, they are mainly distributed in economically developed big
    cities. Judging from the job distribution industry of data analysts, they are
    mainly concentrated in Internet, finance, games, biomedical, real estate, manufacturing
    and other industries. The number of data analyst positions in the Internet and
    financial industries is very high, because these industries have accumulated a
    large amount of business data in their daily operations, and the data is still
    growing rapidly.


    ## Career development and classification of data analysis


    The professional development of data analysis is divided into technical route
    and management route.


    The technical route is divided into data analysis assistants, data analysis specialists,
    primary data analysts, intermediate data analysts, senior data analysts, senior
    data analysts, data scientists, etc. The management route is divided into data
    analysis supervisor, data analysis manager, data analysis director and chief data
    officer.


    Divided from the work content, the positions of data analysis are mainly divided
    into two categories: business data analysis and data mining algorithm research
    and development. The basic requirements and functions of these two types of positions
    are introduced in detail below.


    ### Business data analysis


    * Get familiar with industry knowledge, company business and process and should
    have their own unique opinions, and also should be able to drive business decisions
    according to analysis conclusions.

    * Low skilled communication skills are mandatory. Also needs to deal with operations,
    products, marketing, technology, customer service and other departments.

    * Master data analysis ideas, analysis theories and data analysis methods, and
    apply them to practical work flexibly.

    * Master the corresponding data analysis tools, including `Excel`, `SQL`, `SPSS`,
    `R`, `Python`, `Tableau`, `PowerBI` and other software. Should be familiar with
    common algorithms, understand the analysis ideas of products and operations, and
    be able to come with business optimisation solutions and be able to promote landing
    pages.

    * The positions are mainly subdivided into data operation specialist, business
    analyst, operation analyst, BI analyst, data product manager, etc.


    ### Research and development of data mining algorithm


    * Should be familiar with the company''s business and processes, promote the application
    of data mining theory in different scenarios, and solve practical problems in
    product lines and business operations.

    * Should have solid theoretical foundation of statistics, data mining and machine
    learning and be able to use advanced mathematics knowledge to deduce high-dimensional
    mathematical models. Should get familiar with clustering, classification, regression,
    graph model and other machine learning algorithms and should thoroughly understand
    core algorithms, and have practical modelling experience.

    * Should have a solid theoretical foundation such as computer operating system
    and data structure, and master the computer technologies that big data depends
    on, including operating system(`Linux`, `shell`, etc.), real-time streaming computing(`Spark`,
    `Storm`), massive data processing(`Hadoop`, `Hbase`, `Hive`), development languages(`C`,
    `C++`, `Java`, `Scala`, etc.).


    ## Data Analysis as A career


    Job breakdown mainly includes data mining engineer, data algorithm engineer, data
    development engineer, data research and development engineer, machine learning
    engineer, etc. For a data analysis practitioner, it is not only necessary to master
    the technique of data analysis-the use of various data analysis tools, such as
    database `SQL`, `Excel`, `Python`, etc. The way here refers to the strategy (or
    methodology) of data analysis, and readers can also understand it as the idea
    or routine of data analysis. If only skills are mastered, then the role of data
    analysts becomes a porter and cannot reflect value. To do data analysis, you must
    have your own ideas and opinions. In the next chapter, we will discuss about strategies
    and statistical principles that all data scientists need to be aware of. Follow
    along to know about it.

    '
