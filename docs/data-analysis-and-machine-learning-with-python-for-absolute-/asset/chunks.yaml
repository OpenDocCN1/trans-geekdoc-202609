    通常，我们使用小写的 `x` 和 `y` 来表示特定的输入变量和输出变量。变量可以是标量，也可以是向量。除非另有说明，书中提到的所有向量均为列向量。虽然展示了标准的写法，但这种写法占据了大量空间，因此我们通常使用转置写法，用上标
    "t" 作为转置符号。这里表示的是输入变量 `x` 的第 `i` 个特征。需要注意的是，当存在多个输入变量时，我们使用 `xj`。通过这种方式可以表示第 `j`
    个变量的第 `i` 个特征，并展示特征向量矩阵。


    对于监督学习，构建的模型通常在 `Training Data` 集中进行研究，调整模型参数，然后在 `Test Data` 集中验证预测结果。对于训练数据，输入信号（或变量）和输出信号（或变量）通常成对出现。有时，输出信号也被称为教师信号，因为它具有指导性，并且可以通过损失函数调整模型中的参数。因此，通常会描述训练数据集。


    输入变量和输出变量有不同类型，可以是连续的也可以是离散的。通常，人们会根据输入变量和输出变量的不同类型对预测任务赋予不同的名称。例如，如果输入变量和输出变量都是连续变量，那么这种预测任务被称为
    `Regression`（回归）。如果输出变量是有限的离散值，那么这种预测任务被称为 `Classification`（分类）。如果输入变量和输出变量都是序列，那么这种预测任务被称为
    `Tagging`（标记），我们可以认为标记是分类的泛化。


    ## 接下来做什么？

    在本章中，我们提供了学习机器学习的三步流程。在下一章中，我们将讨论传统编程与被称为机器学习的特殊编程之间的区别。人们经常好奇编程和机器学习之间是否有联系。我们将专门讨论这一点以消除你的疑惑。让我们开始吧！


    ## 第 3 章：传统编程与机器学习的区别

    如前所述，机器学习以数据为原始材料，这可以在不需要显式编程的情况下表示出学习能力。自然地，机器学习算法的实现需要编程，但机器学习与传统显式编程之间存在明显的区别。


    在传统的编程范式中，通过编写程序、给出输入并进行计算，你可以获得预期结果。然而，机器学习是不同的。根据给定的输入和预期结果，通过计算（拟合数据）获取模型参数，这反过来又成了程序的重要部分。对于软件工程师来说，他们关心程序的正确性和健壮性。而数据科学家（机器学习算法的设计者）通常处理不确定性和变异性，因为在模型计算之前，他们不知道程序会是什么样的。


    传统的编程范式将人的思维具象化为行行代码，通常代码中充满了各种 `if` 条件语句。为了处理每个个性化的情况，一旦代码固化，每次运行的结果都是相同的。通常性能不会有提升，因此传统编程不能说是学习。某位著名的
    CEO 曾在一份主题报告中指出，大多数目前的软件与其被称为“长颈鹿软件”更合适。他为什么要这么说呢？长颈鹿出生就具有生存一生（奔跑、吃叶子等）的能力。然而，它们没有学习能力，所有的技能都是上天赋予的，它们的生命中没有改进的空间。


    正如众所周知，机器学习的核心特征是“从数据中学习，提高性能，且不需要显式编程”。这里的显式编程并不意味着不需要编程，而是意味着在函数实现中不需要显式的逻辑，以便算法可以从数据中“学习”规则。此外，一旦程序具有了“学习”能力，数据就会改变，程序的功能也会随之改变，但程序的逻辑基本上不需要改变。这可以实现“以不变应对所有变化”的目的。


    ### 为什么机器学习并不简单？

    初看之下，机器学习似乎并不复杂。只要我们写一个学习算法并向其输入数据，算法就会自动学习。事实上，机器学习并没有那么简单。为了运行机器学习程序，读者需要提前安装
    `sklearn`（一个流行的机器学习框架）。代码主要用于解释运行结果的含义，因此暂时不会对其进行详细研究。


    结果是首先显示一个 `8×8` 的数字矩阵，然后给出该数字矩阵表示的图像作为输出。相应地，我们要说的是计算机和人类看到的世界是完全不同的。计算机看到的是 `8×8=64`
    个无区别的数字，然后通过算法计算，确定一个人类可以理解的数字 `0`，并从 64 个无意义的数字中推出一个有意义的数字。这这令人惊讶。事实上，这对于计算机来说并不困难。有些手写数字人类较难以识别，但我们必须训练机器来给出正确的数字分类。这就是机器学习模型构建的主要本质。

    '
- fmt: '

    # Chapter 4 Supervised Learning


    In this section, we will focus on supervised learning. Firstly, we have a perceptual
    understanding of the connotation of supervised learning, and then give a formal
    definition of supervised learning. Finally, we will give the distinctive features
    of supervised learning and will define various commonly used loss functions.


    ## Perceptual knowledge of Supervised Learning


    In the words of Professors and famous scholars in the field of data mining, all
    Supervised Learning is basically synonymous with Classification. It learns the
    model from labeled training data, and then uses the model to predict its label
    for a given new data. The label here is actually the classification of something.


    To some extent, you can understand it as the "standard answer" of homework, and
    the output of each supervised study can be understood as your own answer. If the
    answer given by us is inconsistent with the standard answer, then the teacher
    or parents will supervise us to correct the problem, so that we will have a deeper
    understanding of the topic, and the correction rate will become higher and higher
    when doing new questions.


    For example, when I was a child, my parents told us that an animal was a cat,
    a dog or a pig, and then the impression of a cat, a dog or a pig was formed in
    my brain (equivalent to model building). When a "new" puppy appeared in front
    of me, I could call out "this is a puppy". This is explicitly called as label
    classification. If for some reason I called out "This is a little pig," then my
    parents would correct my deviation saying "No baby, this is a puppy." In this
    way, we train in two ways and constantly update our brain''s cognitive system.
    When we meet new cats, dogs and pigs next time, we will make a correct "prediction"
    classification with a high probability.


    This natural process is adopted by machine learning systems by developing models.
    In fact, the whole process of machine learning is doing one thing, that is, fitting
    a certain model through training and learning, and then expecting this model to
    fit the "new sample" well. This ability to fit the model to new samples is also
    called "generalisation ability", which is a very important property in machine
    learning algorithms.


    ## Formal Description of Supervised Learning


    In this section, we will give a more formal (or academic) description of supervised
    learning. Supervised learning is to learn a model by using labeled training data,
    and then use this model to predict new samples.


    In essence, the goal of supervised learning is to construct a mapping from input
    to output, which is represented by a model. The model belongs to the mapping set
    from input space to output space, which is called hypothesis space. Assuming that
    the space is determined, it means that the learning scope is determined. And how
    to find the best mapping in the hypothesis space is the biggest motivation of
    supervised learning.


    For supervised learning, the constructed model usually learns in the training
    set, adjusts the model parameters, and performs prediction verification in the
    test data set. Therefore, the training set is usually described by the formula
    using mathematical principles.


    Training data need to be used in the learning process, which is often given artificially.
    In this training set, the expected output of the system (i.e., label information)
    has been given in advance. If the actual output of the model is inconsistent with
    the expected output (there is a gap between the two), then the model has the responsibility
    to "supervise" the learning system to readjust the model parameters until the
    error between the two is within the tolerable range. Therefore, the expected output
    (label information) is also called "teacher signal".


    The process framework of supervised learning is roughly divided into two parts-learning
    and prediction. Specifically, the input data, which can be text, picture, audio,
    video, etc., are prepared first, and then the required features are extracted
    from the data to form feature vectors. Next, these feature vectors and the tag
    information of the input data are sent to a learning model (specifically, a learning
    algorithm), and an available prediction model is polished after repeated training.
    Then, the same feature extraction method is applied to the new sample to obtain
    the feature vectors of the new sample. Finally, taking the eigenvectors of these
    new samples as input, the prediction model is used to predict, and the expected
    Label information of the new samples is given.


    As mentioned earlier, if the input variables and output variables are of different
    types (either continuous or discrete), people usually give different names to
    the forecasting tasks according to the different types of input and output variables,
    such as classification, regression and annotation. Next we will talk about the
    problem of regression in supervised learning. Follow along!


    ## What is regression?


    The main function of regression is to predict the relationship between input variable
    `x` (independent variable, i.e. feature vector) and output variable `y` (continuous
    dependent variable, i.e. label). The expression of this relationship is usually
    a resolution function.


    In the function, each input variable has a weight, which is also called "coefficient".
    For a specific training set, the input variable `X` can be regarded as a known
    quantity. The purpose of training is to find a suitable coefficient, so that `Y`
    and `X` can be well fitted within the framework of the learned coefficient, that
    is by giving `X` so it can predict `Y` well.


    Therefore, to some extent, the study of regression problem is equivalent to function
    fitting, that is, selecting a function curve can fit the known data well and predict
    the unknown data well. Similarly, regression problem is divided into two parts:
    learning and prediction. The learning system constructs a model based on the training
    data, namely the function `y`. Where `β` represents an unknown parameter, which
    can be a scalar or a vector. `Y` can be associated with `x` and `β` by regression
    model. Then, given a new input, the forecasting system will give the corresponding
    output according to the learned model.


    ## Loss function


    As we know, in the supervised learning algorithm of machine learning, a decision
    function `f` is constructed in the hypothesis space. For a given input `x`, the
    corresponding output may be inconsistent with the original expected value `y`.
    Therefore, we need to define a Loss Function to measure the "gap" between them.


    The loss function is usually written as `l (y,) = l (y, f (x))`, and the value
    of this function is non-negative for convenience. There are four common loss functions:


    1. 0-1 loss function

    2. Absolute Loss function

    3. Quadratic Loss function

    4. logarithmic Loss function

    '
