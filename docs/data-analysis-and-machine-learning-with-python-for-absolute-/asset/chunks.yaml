    # 第 6 章 需要掌握的技能


    对于数据分析师来说，大部分日常工作可以通过结合 `Excel` 和 `SQL` 来完成。`Excel` 用于数据处理和处理分析，`SQL` 用于数据查询。作者也咨询了圈内的许多朋友，他们的工作模式非常相似，即都使用
    `Excel` 和 `SQL`。幸运的是，这两个工具相对容易学习。在作者看来，难度在于如何灵活地运用 `Excel` 技能并理清 `SQL` 的访问逻辑以提高工作效率。


    ## Excel


    Excel 非常重要。它不仅仅是一个存储数据的容器。用户还可以利用其强大的函数、透视表、可视化、`VBA` 等其他功能来完成大量的数据分析。这里也可以列出一些常用的
    `Excel` 函数。例如，统计函数（`COUNT`、`COUNTA`、`COUNTBLANK`、`COUNTIFS`、`SUM` 等）、字符串函数（`LEN`、`LENB`、`LEFT`、`RIGHT`、`MID`）、数值函数（`RAND`、`RANDBETWEEN`、`ABS.`）都是
    `excel` 环境中的可用函数。如果读者能够灵活地使用这些 `Excel` 函数，日常工作中的数据处理将变得简单易行。


    此外，`Excel` 包含的强大可视化功能（如饼图、`bar charts`、直方图、折线图、面积图、散点图、气泡图、雷达图等）也将助于日常数据分析（但 `Excel`
    主要用于小型数据集的处理，在面对大数据时会显得力不从心，此时无法与 `Tableau` 相比拟）。


    `VBA` 属于 `Excel` 的编程部分，是一种宏语言。它由一系列命令和函数组成。使用强大的宏函数可以避免很多重复性工作，从而节省时间并提高工作效率。虽然
    `VBA` 在工作中并不频繁使用，但如果有机会，读者可以使用它来开发数据报告或进行表格计算，这将极大地提高工作效率和成就感。


    ## 卓越的数据库查询技能


    数据库查询技能是数据分析师的必备技能。首先，如果你没有这项技能，你会发现找工作很难，因为在面试期间，公司会有数据库相关的测试点。其次，如果你在工作中需要处理大量数据，你会变得非常被动，工作进展不顺，从而降低工作效率。


    数据库之所以重要，主要是因为工作中需要分析的数据基本上来自数据库。如果你不知道如何从数据库中查询数据，处理数据将变得非常困难，这也会导致下一步——无法进行分析。虽然目前市上有许多种数据库，如
    `Oracle`、`SQL Server`、`MySQL`、`Hive` 等，但并不意味着你必须学会所有的它们，因为它们都使用结构化查询语言和各种数据库语法。它们非常相似，只要你熟练掌握了
    `SQL`，就可以说是一通百的。对于零基础的读者，建议去 `MySQL` 官网下载数据库的社区版，然后学习数据库中的查询、修改、删除、插入和存储过程等相关知识点。


    ## 熟练的数据可视化技能


    熟悉数据可视化技能也是数据分析师的基本要求之一，因为数据可视化对于制作生动、引人注目且直观的数据报告非常重要。目前，越来越多的公司开始关注可视化数据报告，并使用各种可视化工具，如
    `Excel`、`Tableau`、`PowerBI`、`Echarts` 和 `D3.js`。


    类似 `Excel`、`Tableau` 和 `PowerBI` 的工具使用较简单，你只需要拖放就能画出酷炫的视觉图形。读者可以去 `Tableau` 官网（https://www.tableau.com）下载并使用软件，然后参考如何使用
    `tableau` 绘制常用的统计图表，让枯燥的数据变得更加生动。


    `PowerBI` 是由 `Microsoft` 出的商业智能分析软件。它是一个专业的报告制作和数据可视化分析工具，可以作为项目团队、部门或整个企业的分析和决策引擎。该软件的功能与
    `Tableau` 类似，支持连接不同的数据源、数据的集成与处理、交互式报告、图形可视化分析、仪表板的制作与发布等。读者可以 `PowerBI` 官网（https://powerbi.microsoft.com）下载并使用软件。


    对于 `Echarts` 和 `D3.js` 等类似工具，读者需要掌握一定的 `JavaScript` 语言，学习成本较高。可以通过开源进行进一步开发和学习。其突破性的功能设计和技术特性引起了行业的高度关注，迅速成为国内数据可视化领域的“新星”。它已被国内数百公司应用于新闻媒体、证券金融、电商、旅游酒店、天气地理、游戏、电力等多个领域。读者可以去
    `Echarts` 官网了解更多相关知识。


    `D3` 的全称是 `Data-Driven Documents`，是一个 `JavaScript` 库，主要用于数据可视化。由于 `JavaScript`
    文件的后缀通常为 `.js`，因此 `D3` 也称为 `D3.js`。在数据可视化方面，`D3` 仅需几个简单的函数即可实现复杂的数据可视化并生成华丽的图形。`D3`
    的可视化效果所示。读者可以去 `D3` 官网（https://d3js.org/）了解更多信息。


    ## 统计编程技术


    不知道读者是否发现了一个问题，即当你寻找与数据分析相关的工作时，基本上会在公司的职位要求中看到统计建模或数据挖掘技能，申请者也会附带这些技能。需要掌握的某些统计软件（如
    `SPSS`、`SAS`、`Python`、`R` 等）。在上述 4 种软件中，除了 `SPSS` 是一个“傻瓜”统计工具（即基于菜单的统计工具，不需要编程）外，其他三个都是编程统计工具。对于读者来说，熟练掌握其中一种或几种工具非常重要，而在求职过程中及后续工作中，对这些工具的熟练程度是否符合公司要求也非常重要。


    日常工作中，常用的统计模型（或方法）包括点估计、区间估计、方差分析、各种假设检验（如`卡方检验`、`t 检验`、`F 检验`、`正态检验`等）、数据降维（如`主成分分析`、`因子分析`等）。常用的数据挖掘模型包括预测算法（如`多元线性回归模型`、`决策树模型`、`随机森林模型`、`K
    近邻算法`、`支持向量机 SVM 模型`等）、分类算法（如`逻辑回归模型`、`贝叶斯算法`、`提升树 GBDT 算法`等）以及聚类算法（如`K-means
    聚类`、`层次聚类`、`密度聚类`等）。


