    # 第 3 章 Python 数字的数字概念


    ## Python 数字

    数字是日常生活中使用的数字。在 Python 中，常用的是整数和浮点数，例如所示。


    ```python

    Var = 2 // This is an integer

    Var = 33.4 // This is a floating point number

    ```


    你可以通过检查是否存在小数点来判断一个数字是整数还是浮点数。例如，`66` 是一个整数，但 `66.0` 是一个浮点数。


    ## 变量

    变量，即变化数量的同义词，可以理解为一种容器，可以在其中放置（存储）各种物品（数据），且放置的内容是可以改变的。计算机中有许多数据点来存储不同的数据。为了区分不同的容器，我们需要为这些容器命名，这就是变量名的本质。我们可以通过变量名来访问变量。


    我们可以用四个罐头饮料来做类比，理解变量的重要性。这四个罐头饮料就是四个容器，即四个变量。从左到右，我们将它们命名为 `canned pineapple`（罐装菠萝）、`canned
    strawberry`（罐装草莓）、`canned yellow peach`（罐装黄桃）和 `canned orange`（罐装橙汁）。通过这种方式，可以通过变量名获取特定的变量。变量名与我们的命名相同，并且需要一定的注意。在
    Python 中定义变量名时，需要遵循以下原则：


    - 变量名必须以字母或下划线（`_`）开头，中间只能由字母、数字和下划线组成。

    - 变量名的长度不能超过 255 个字符。

    - 变量名在有效范围内必须唯一。

    - 变量名不能是 Python 的关键字。


    Python 中的关键字如下：`Var`、`Var2`、`_var`。变量名区分大小写。例如，`Var` 和 `var` 代表两个不同的变量。


    ## 标识符

    标识符用于标识事物的名称。它们在 Python 中用于标识变量名、符号常量名、函数名、数组名、文件名、类名、对象名等。标识符的命名规则与变量名相同。


    ## 数据类型

    Python 中主要有两种数据类型：数字和字符串，其中数字包括整数和浮点数。我们可以使用 `type()` 函数查看特定值的数据类型。


    ```python

    Int var = 1

    Var = 1.0

    print(" Hello world")

    ```


    在上面的代码中，`1` 是整数，`type(1)` 是 `int`；`1.0` 是浮点类型，`type(1.0)` 是 `float`；`"hello world"`
    是字符串，`type("hello world")` 的结果是 `str`。


    ## 输出格式设置

    在 Python 中，我们使用关键字 `print` 进行输出。有时我们需要进行某些输出格式设置，可以使用 `str.format()` 方法进行设置。其中
    `str` 是字符串，`format` 的内容填充到 `str` 字符串的 `{}` 中。


    ```python

    print(" Hello world")

    ```


    浮点数设置：`.2f` 表示以浮点类型显示并保留两位小数，或者使用 `.3f` 等。

    ```python

    print(.2f)

    ```


    百分比设置：`.2%` 表示以百分比形式显示，并显示两位小数，也可以是 `.3%` 等。

    ```python

    print(%2)

    ```


    ## 缩进和注释

    对于程序员来说，缩进和注释非常重要。它们不仅让一切看起来不那么杂乱，还能帮助程序员理解良好编码规范的重要性。


    ### 缩进

    我们将代码行开头的空白部分称为缩进。缩进目的是标识代码块，即让程序知道运行哪部分。以 `if` 条件语句为例，缩进是为了让程序知道在满足条件时执行哪条语句。在其他编程语言中，通常使用大括号来表示缩进。只要行开头有空格，即使是缩进，无论有多少个空格，通常使用
    4 个空格缩进，这也有便于阅读代码。Python 中函数、条件语句和循环语句中的语句块需要缩进。


    ### 注释

    注释对代码起到说明作用，并且不会实际运行。单行注释以 `#` 开头，如下所示。多行注释可以使用多个 `#`、`''''''` 或 `"""` 实现，如下所示。


    ```python

    // This is great and a comment

    ```


    在下一章中，我们将通过讨论字符串及其功能来进一步扩展我们的 Python 技能。


    '
- fmt: "\n# Chapter 4 Strings\n\n## The concept of strings\nA string is a finite series\
    \ consisting of zero or more characters, enclosed in single or double quotes,\
    \ and the symbol is `str` (short for string). The following are all string examples.\n\
    `“ Hello world”` `“ This is a string\"`\n\n## String connection\nString concatenation\
    \ is a relatively common requirement, such as concatenating first and last names.\
    \ You can use the operator `+` directly to connect two or more strings. Here is\
    \ a sample example:\n```\n“ Hello” + “ Universe”\n```\nThe output will be : `Hello\
    \ Universe` \n\n## Copy of string\nSometimes we need to repeat a string multiple\
    \ times. For example, if you want to repeat the sentence \"Python is really powerful\"\
    \ three times, you can use the operator `*` to repeat the string.\n```\n“ Python\
    \ is really powerful” * 3\n```\nThe above code is repeated three times for the\
    \ string, just enter `*3`. You can repeat as many times as needed. Here is an\
    \ output: \n```\nPython is really powerful\nPython is really powerful\nPython\
    \ is really powerful\n```\n\n## Get the length of a string\nMobile phone number,\
    \ ID number, and name are all strings. If you want to know the length of these\
    \ strings, you can use the `len()` function to get the length of the string. Here\
    \ is the code:\n```\nlen(“This is great”)\n```\nOutput is; `11`\nRemember that\
    \ space will not be added in the length of the string.\n\n## String search\nString\
    \ search refers to finding whether a certain string is contained in another string.\
    \ For example, if you know a user name, you want to know whether this user is\
    \ a test account (the test account is judged by the name contains the word test),\
    \ then Just look for the \"test\" string in the name. If it is found, it means\
    \ that the user is a test account; if it cannot be found, it means it is not a\
    \ test account. Both methods can be implemented with `in` or `not in`. \n\nIn\
    \ addition to `in` and `not in`, you can also use `find`. When you use `find`\
    \ to find whether a character exists in a string, if it exists, it returns the\
    \ specific position of the character, if it does not exist, it returns `-1`, as\
    \ shown below. Note that because the position is counted from 0 in Python, the\
    \ third position is 2. Here is an example:\n```\n“ Hello” in “ Hello World” True\n\
    ```\nHere is an another example:\n```\n“Foosball” in “ Fifa Worldcup” False\n\
    ```\n\n## String index\nString index refers to the selection of the value based\
    \ on the position of the value in the string. It should be noted that the position\
    \ in the string starts from 0.\n\n### Get the value of the first digit in the\
    \ string\nWith this, we can find the first digit in any particular string. This\
    \ is especially used in developing web applications. Here is code:\n```\nvar =\
    \ “ Great person”\nvar[0]\n```\nOutput is : `G`\n\n### Get the value of the 4th\
    \ bit in the string\n```\nvar = “ Great person”\nvar[3]\n```\nOutput is : `E`\n\
    \n### Get the value between the 2nd to the 4th digit in the string\nand does not\
    \ include the 4th digit. Code is :\n```\nvar[1:3]\n```\nOutput is: `Rea`\n\nWe\
    \ ask you to quickly on these other examples for your reference and better understanding\
    \ of the topic:\n1. Get the value from the 1st to the 4th digit in the string,\
    \ and does not contain the 4th digit, the 1st digit can be omitted.\n2. Get the\
    \ value between the 7th and the last digit in the string, and the last digit can\
    \ be omitted.\n3. Get the value of the last digit in the string.\n\nWe call the\
    \ above method of obtaining the value of the position through a specific position\
    \ as a normal index; the method of obtaining the value in the position interval\
    \ through a certain position interval is called a slice index.\n\n## String separation\n\
    String separation is to first separate a character with a certain delimiter, and\
    \ then return the separated value in the form of a list, using the `split()` function.\n\
    ```\n“ Hello , How , Are , You?” . split(,”)\n```\nHere is output: `['Hello’,’How’,’Are’,’You?’]`\n\
    \n## Remove characters\nThe method used to remove characters is the `strip()`\
    \ function, which is used to remove the specified characters at the beginning\
    \ and the end of the string. By default, the spaces or newlines at the beginning\
    \ and the end of the string are removed.\n```\n“AaA”.strip(“A”)\n```\nHere is\
    \ output: `‘A’\n\nWith this, we have completed a brief introduction to string\
    \ operations in Python. In the next chapter, we will discuss about Lists in Python.\
    \ Follow along!\n"
