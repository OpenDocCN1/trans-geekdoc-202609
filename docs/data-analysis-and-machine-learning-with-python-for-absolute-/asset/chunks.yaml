    \ the actual output and the expected output `y`, and the better the model we built.\n\
    \nThe first kind of loss function is easy to explain, that is, it shows whether\
    \ the goal has been achieved or not. If `Achieved`, the output will be `0` (no\
    \ drop) and if not reached, the output is `1`. \n\nThe loss function of the second\
    \ kind is more specific. Taking weight loss as an example, the difference between\
    \ the current weighing scale reading and the weight loss target may be positive\
    \ or negative. For example, suppose our weight loss goal is `70 kg`, but we accidentally\
    \ lose too much weight and reduce it to `60 kg`, then the difference will be `\"\
    -10\"` kg. In order to avoid such positive and negative interference, we should\
    \ simply take the absolute value.\n\nThe third kind of loss function is similar\
    \ to the second kind, which also plays the role of avoiding the interference of\
    \ positive and negative values. However, for the convenience of calculation (mainly\
    \ for derivation), a coefficient `\"1/2\"` is sometimes added in front of it,\
    \ so that `\"1\"` can be obtained by multiplying `\"2\"` on the exponent and `\"\
    1/2\"` on the coefficient.\n\nOf course, for the convenience of calculation, we\
    \ can also use the logarithmic loss function, that is, the fourth kind of loss\
    \ function. The purpose of this is that maximum likelihood estimation can be used\
    \ to find the extreme value (changing the multiplication and division method which\
    \ is difficult to calculate into the addition and subtraction method which is\
    \ relatively easy to calculate).\n\nPerhaps you may ask, what is the use of these\
    \ loss functions? Of course it works! Because we rely on the size of these loss\
    \ functions to \"supervise\" the machine learning algorithm and make it move towards\
    \ the expected goal. It is one of the core symbols of supervised learning.\n\n\
    # Chapter 5 Unsupervised Learning\n\nContrary to supervised learning, Unsupervised\
    \ Learning is in a learning environment where there are no labeled data. Machine\
    \ learning specialists all around the world also pointed out that unsupervised\
    \ learning is essentially a synonym of \"Cluster\". The idea of clustering originated\
    \ very early, which can be traced back to the book of changes copulative in China\
    \ and middle eastern countries. However, the clustering algorithm in the true\
    \ sense was put forward around 1950s.\n\n## Why is it so lagging behind?\n\nThe\
    \ reason is that the success of clustering algorithm is highly dependent on data.\
    \ When the amount of data is small, then the process of clustering is of little\
    \ significance. When the amount of data is large, the human brain will become\
    \ dull, and the problem can only be solved by computers, which only appeared in\
    \ 1946. \n\nIf classification refers to dividing new objects into existing categories\
    \ according to the characteristics or attributes of data then clustering does\
    \ not know how many categories the data will be divided into at first, but clusters\
    \ the data into several groups through analysis. Simply put, given the data, what\
    \ clustering can learn from the data depends on the characteristics of the data\
    \ itself.\n\nBased on this, Professors of universities made a wonderful 12-word\
    \ summary of clustering. Once the characteristics of a series of \"classes\" or\
    \ \"groups\" are summarised, when a new data comes, we can predict which \"class\"\
    \ or \"group\" it belongs to according to which \"class\" or \"group\" it is closer\
    \ to, thus completing the \"classification\" or \"grouping\" function of the new\
    \ data.\n\nThis is unsupervised learning on a whole. The well-known unsupervised\
    \ learning algorithms include `K-Means Clustering`, `Hierarchical Clustering`,\
    \ `Principal Components Analysis (PCA)`, `DBSCAN`, `Deep Belief Net` and so on.\n\
    \n# Chapter 6 Semi-supervised learning\n\nSemi-supervised Learning uses both labeled\
    \ data and non-labeled data. From a specific point of view, the best way for modern\
    \ human growth and learning is \"semi-supervised learning\". It is neither pure\
    \ \"supervised learning\" (if so, our creativity and cognitive system may be stifled,\
    \ and we will never surpass our parents and teachers) nor complete \"unsupervised\
    \ learning\" (if so, we will spend a lot of time rebuilding wheels like duckweed\
    \ without roots).\n\n## What exactly is \"semi-supervised learning\"?\n\nWe give\
    \ its formal definition below. Given a set of labeled examples `(x1,y1), (x2,y2),...,(xk,yk)`\
    \ from an unknown distribution, where `xi` is the input data and `yi` is the label.\
    \ For an unlabelled sample set `U=xk+1, xk+2,..., xk+u`, where `u` is the number\
    \ of unlabeled samples. We expect to get a certain function through learning:\
    \ `fY→X`, through which we can accurately predict the label `iy` of unlabeled\
    \ data `lix+`.\n\nHere, `xi∈X` is a `D-dimensional vector`, and `yi∈Y` is the\
    \ label of the example `xi`.\n\nThe formal definition is abstract, so let's give\
    \ an example in real life to help illustrate this concept. Suppose we have learned:\n\
    (a) Tom's classmate (data 1) is a rich boy (labeled as a rich boy)\n(b) Sam (data\
    \ 2) is a rich boy (labeled as a rich boy).\n\nSuppose we don't know who Tom's\
    \ classmate (data 3) is or whether he is rich, but considering that he often goes\
    \ in and out of high-standard conferences with him, he is often met by the upper\
    \ class (that is to say, although they are independent, they are distributed in\
    \ the same place), so we can easily label Tom's classmate \"a rich\" according\
    \ to the idea of our society. As a result, our known fields (tag data) are expanded\
    \ (from two to three), which completes the process of semi-supervised learning.\n\
    \nIn fact, semi-supervised learning is to expand \"unknown domain\" with \"known\
    \ cognition (labeled classified information)\" (the unknown is classified as known\
    \ domain by clustering thought).\n\n## Algorithms and Demand\n\nBut there is a\
    \ basic hypothesis-cluster hypothesis, the core of which is that similar samples\
    \ have similar outputs. Common semi-supervised learning algorithms include `generative\
    \ method`, `semi-supervised support vector machine (S3VM for short)`, `graph semi-supervised\
    \ learning`, `semi-supervised clustering` and so on. As a matter of fact, our\
    \ realistic demand for semi-supervised learning is very strong. The reason is\
    \ very simple, because the label data that people can collect is very limited,\
    \ and manual labelling of data requires a lot of manpower and material resources,\
    \ but non-label data exists in large quantities and is readily available, which\
    \ is more common in Internet data, so semi-supervised learning is particularly\
    \ important.\n"
