- fmt: "\n# Chapter 7 Data extraction automation\n\nNext, the most important thing\
    \ we need to do is to realise the one-click automatic extraction of the required\
    \ notification data every morning, which requires the knowledge of `SQL` and `VBA`\
    \ that we have previously mastered. How do you implement it? How to combine the\
    \ two?\n\nFirst of all, there is a prerequisite, that is, the database is maintained\
    \ by fixed IT personnel, and the daily operation-related \"user details\" and\
    \ \"order details\" log data files are imported into the `Access` database, and\
    \ then we only need to open it every day `Access` database queries the required\
    \ data. We can set the date conditions found in the `SQL` statement according\
    \ to the system time. Assuming that today’s date is \"2011-9-5\", we need to query\
    \ the data of yesterday (2011-9-4), then the date of the `SQL` statement The filter\
    \ condition is written as: `\"WHERE order date<DATE() AND order date>=DATE()-1\"\
    `, which can realize the effect of automatic fetching according to the system\
    \ time without manual adjustment. \n\nIf you adopt this method, you need to adjust\
    \ the `VBA` statement manually, which is a bit troublesome. If other colleagues\
    \ are not familiar with the `VBA` environment, it will be even more troublesome.\
    \ So there is another way of thinking that we can set the date input function,\
    \ and the system can query and extract relevant data based on the date entered,\
    \ so that we can extract the data for which day we want to extract. Therefore,\
    \ to fetch data from the database and append the data results to the corresponding\
    \ Excel table, you need to use `SQL` and `VBA` statements to achieve the following\
    \ functions:\n\n* Open the `Access` database.\n* Enter the date of data extraction.\n\
    * Run the designated `SQL` statement for withdrawal.\n* Automatically append the\
    \ data results of the `SQL` statement operation to the new record of the Excel\
    \ \"data source\" table.\n\nThe relevant `VBA` statements are written as follows:\n\
    \n```vba\n' The function of `InputBox` is to open the input dialog Box, prompt\
    \ to enter the withdrawal date, and assign it to `D1`\nD1 = InputBox(\"Please\
    \ enter the date that needs to be withdrawn, for example: 2011-9-4\", \"Withdrawal\
    \ date\")\nD2 = D1 + 1\n\n' To specify the database according to Replace the database\
    \ file name in the double quotes in the actual situation. Note that the `Access`\
    \ database file and the Excel file must be in the same path. If not, change to\
    \ `MyData = \"D:\\Data\\Business database.accdb\"`, and replace `Access` according\
    \ to the actual situation database file\nActiveSheet.Cells(N, 5).CopyFromRecordset\
    \ AdoConn.Execute(strSQL3)\nActiveSheet.Cells(N, 7).CopyFromRecordset AdoConn.Execute(strSQL4)\n\
    Close the database connection\nEnd Sub\n```\n\nThere is another question. Readers\
    \ usually don’t understand the assignment statements in `SQL` statements. What\
    \ do many double quotes, pound signs (`#`), and hyphens (`&`) mean? Okay, let\
    \ me explain separately:\n\n* The statement between the double quotes is the text\
    \ string in the `VBA` statement.\n* The pound sign (`#`) is mainly used in the\
    \ `SQL` query statement to indicate that the data type is date type, and the pound\
    \ sign (`#`) is usually added at both ends of the data value. This was introduced\
    \ when talking about the `SQL` statement query of the `Access` database.\n* The\
    \ connection symbol (`&`) is used in `VBA` statements to connect various text\
    \ strings to form a string of required strings, such as the `SQL` statement assigned\
    \ by the `strSQL1` variable in the `VBA` statement.\n\nBecause it is necessary\
    \ to query and extract data based on the input date, the `VBA` statement involves\
    \ two types of text: text string and date parameter. If each text string is directly\
    \ connected to the date parameters `D1` and `D2` without category separation and\
    \ then connected, the system will recognise the date parameters `D1` and `D2`\
    \ as text strings `D1` and `D2` instead of date parameters, so that they cannot\
    \ be quoted. The date entered in the dialog box is used for data filtering and\
    \ query, and an error occurs. \n\nTherefore, it is necessary to split a complete\
    \ `SQL` statement into each text string part, and then connect each text string\
    \ part and the date parameters `D1` and `D2` with a connector (`&`) to combine\
    \ them into a string of required `SQL` statements. This is like the combination\
    \ of the notification body in the \"data conversion\" table just introduced, combining\
    \ various text strings on demand. In addition, we need to pay special attention\
    \ to the use of space symbols, because `SQL` statements require that each keyword\
    \ be separated by space symbols, so pay attention to the use of space symbols\
    \ when connecting text strings with date parameters.\n\nAt present, it is not\
    \ necessary to understand the meaning of each sentence and how to write it. You\
    \ can directly apply ready-made `VBA` sentences. I have marked the places that\
    \ need to be adjusted in red, as long as you adjust them according to the actual\
    \ situation.\n\n### Set macro command button\n\nNext, insert this `VBA` statement\
    \ into the corresponding position of the Excel worksheet and set it as a command\
    \ button to extract data with one click.\n\n**Step 01**: Click the `[Development\
    \ Tools]` tab, in the `[Controls]` group, click the `[Insert]` button, and select\
    \ `[Button (Form Control)]` in the `[Form Controls]`. At this time, the mouse\
    \ becomes a \"cross\" shape. Press and hold the left mouse button at the position\
    \ where you want to place the button. Drag the mouse to draw a rectangle. This\
    \ rectangle represents the size of the button. When you are satisfied with the\
    \ size of the button, release the left mouse button, so that a command button\
    \ is added to the worksheet, and Excel automatically pops up a `[Specify Macro]`\
    \ dialog box.\n\n**Step 02**: In the pop-up `[Specify Macro]` dialog box click\
