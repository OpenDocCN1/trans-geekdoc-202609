- fmt: "\n# 1. Descriptive Statistical Analysis\n\nDescriptive statistical analysis\
    \ focuses on the description of the data, which is equivalent to explaining a\
    \ picture you see. Descriptive statistics of data actually describe the characteristics\
    \ of the data, such as the average level of the data, the feasible range of the\
    \ data, and the degree of fluctuation and dispersion of the data. Through descriptive\
    \ statistical analysis, data analysts can better grasp and understand the data,\
    \ so that they have \"numbers\" in their minds. Descriptive statistical analysis\
    \ is both a basic link and an important link in the process of data analysis.\
    \ The foundation is essential because its operation is very simple, and it is\
    \ important because it is the prerequisite for the next step of data analysis.\n\
    \nBelow is an example of descriptive statistical analysis: Your boss may ask:\
    \ \"Worker, please help me check the basic data of website traffic in September.\"\
    \ So the question is, what content will this basic data contain? First we should\
    \ check the traffic data for September. Usually in a report `PV` and `UV` respectively\
    \ represent page visits and user visits, that is, the number of visitors to the\
    \ website and the number of pages visited respectively. If you understand descriptive\
    \ statistical analysis, you can display the basic data of website traffic in a\
    \ table.\n\nTake `PV` as an example to briefly explain the meaning of these data\
    \ analysis indicators. For examples, let us assume that the average daily visitor\
    \ times of the website in September was 41,072.87 times, and the standard deviation\
    \ was 5,685.52. The number of visits nominally was 30,471, and one quarter of\
    \ the days in the month had fewer than 36791.5 visits per day, half of the days\
    \ in the month had fewer than 42,529 visits per day, and three-quarters of the\
    \ days in the month the number of visits per day is below 44,643.25, and the most\
    \ visits in the whole month is 49,847. It should be noted that the lower quartile\
    \ is the statistically significant 25% quantile, and the upper quartile is the\
    \ statistically significant 75% quantile. Don't be overwhelmed by the sample data\
    \ we provided. This is just an analogy to help you understand the importance of\
    \ metrics for a data analyst position.\n\nThis case is a typical descriptive statistical\
    \ analysis. In fact, it simply describes the statistical results of the data and\
    \ expresses the statistical characteristics of the data. In addition, the internal\
    \ laws of the data can also be described graphically. Another example: It is necessary\
    \ to calculate the payment proportion of various payment channels on an e-commerce\
    \ platform in the past month, or analyse the distribution characteristics of users'\
    \ annual transaction volume. These two problems can be well described by pie charts\
    \ and histograms.\n\nTherefore, descriptive statistical analysis includes data\
    \ frequency analysis, data central tendency analysis (such as `mean`, `median`,\
    \ `mode`, etc.), data dispersion analysis (such as `standard deviation`, `range`,\
    \ `coefficient of variation`, etc.), and data distribution (such as skewness value,\
    \ `kurtosis value`, etc.) and some basic statistical graphics (such as pie charts,\
    \ histograms, box plots, etc.). In daily study or work, data analysts need to\
    \ master these basic statistical description methods so that they can be well\
    \ integrated into the business and understand the business data environment.\n\
    \n# 2. Exploratory Statistical Analysis\n\nExploratory statistical analysis is\
    \ mainly used for exploration in the process of data analysis. Through exploration,\
    \ the internal laws and connections hidden behind the data can be discovered.\
    \ Usually, exploratory statistical analysis can also unearth the reasons for abnormalities\
    \ in the data.\n\nFor example, it is necessary to study whether there is a certain\
    \ correlation between certain variables, whether there is a significant difference\
    \ between the two sets of samples, and explore certain indicators in the enterprise\
    \ (such as exposure, advertising click-through rate, payment success rate, account\
    \ of a certain payment channel). For data analysts, the strategy of exploratory\
    \ statistical analysis is frequently applied in their work, because this strategy\
    \ can help analysts understand the inherent value and connections that are not\
    \ easy to find in the data. In most cases, exploratory statistical analysis uses\
    \ data visualisation techniques to graphically present the answers to questions\
    \ in order to visually discover interesting information in the data.\n\nFor exploring\
    \ the relationship between two variables, the most commonly used method is to\
    \ draw their scatter plots. Through the scatter plots, you can intuitively discover\
    \ a certain internal relationship between the two (such as linear relationship,\
    \ non-linear relationship or uncorrelated relationship). Therefore, when exploring\
    \ the relationship between car speed and braking distance, you might as well draw\
    \ a scatter diagram to observe the relationship between the two. In here, the\
    \ horizontal axis represents the driving speed of the car, and the vertical axis\
    \ represents the braking distance of the car. It can be seen from the figure that\
    \ as the driving speed increases, the braking distance also increases. Therefore,\
    \ it can be clearly concluded that there is a positive linear relationship between\
    \ them.\n\nSo, can this linear relationship be expressed by a specific mathematical\
    \ function? The answer is yes. This part of the content will involve the inferential\
    \ statistical analysis described later. Usually when comparing the difference\
    \ between two or more groups of samples, you can choose a box plot in statistics\
    \ (also called a box-and-whisker plot). There are two major functions: one is\
    \ to easily compare data and the other is to identify abnormal sample points in\
    \ the data. \n\nWhen exploring whether there is a difference in the fare between\
    \ male and female passengers in the first class, you may wish to choose a box\
    \ diagram to describe it. In here, the horizontal axis represents the passenger\
    \ fare, and the vertical axis represents the gender of male and female. There\
    \ is a clear dividing line in the middle box of the two box plots, which is the\
    \ `median` (a type used to describe data The centralisation index is understood\
    \ as the overall level). It can be seen that the `medians` of the two box plots\
    \ are not approximately vertically aligned, indicating a significant difference\
    \ in fares between male and female passengers. And from the far right side, some\
    \ sample points were also found, which are the abnormal points identified by the\
    \ box plot technique. Obviously, this is based on the comparison of graphics,\
    \ and there is a difference between the two.\n\nSo is there a quantitative way\
    \ to verify that there is a significant difference between male and female in\
    \ fares? The answer is still yes, and it can be achieved through inferential statistical\
    \ analysis.\n\nFor exploring the proportional change of an e-commerce transaction\
    \ volume between PC and mobile, you can choose a percentage stacked bar graph.\
    \ The biggest feature of this graph is that the height of all bars is standardised\
    \ to 100% (that is, the height of all bars) All are the same), and then you can\
    \ compare the changing trends of internal proportions. As shown, it is the difference\
    \ in the proportion of transaction volume between PC and mobile in different time\
    \ periods. All the data provided is just sample data for your understanding. You\
    \ can nominally search any individual data and can use it to further understand\
    \ the procedures explained below.\n\n# 3. Inferential Statistical Analysis\n\n\
    Inferential statistical analysis is very classic but relatively difficult. We\
    \ all know that statistics is essentially to infer the overall situation based\
    \ on the characteristics of the sample. For example, with the help of random sampling,\
    \ a partial sample is drawn from the population, and the average of the population\
    \ is inferred from the sample Level (the method to solve the problem is the `mean\
    \ test` in statistical inference). According to the two attributes of the sample\
    \ (that is, two variables), we need to determine whether there is a correlation\
    \ between the attributes (need to use `correlation coefficient test` or `chi-square\
    \ test` in statistical inference). According to the distribution of the sample,\
    \ judge whether the population obeys the normal distribution (using the `normality\
    \ test` technique).\n\nCompared with exploratory statistical analysis, inferential\
    \ statistical analysis focuses more on finding quantitative answers, usually calculating\
    \ statistics and the corresponding probability `P value`. If the probability `P\
    \ value` is less than `.05` (the default comparison value), you need to reject\
    \ the null hypothesis (the null hypothesis is the assumption that the event is\
    \ true, such as the sample mean is equal to a certain value, there is no correlation\
    \ between the two attributes, and the sample follows a normal distribution), Otherwise,\
    \ the null hypothesis needs to be accepted.\n\nIn order to enable readers to grasp\
    \ the method of inferential statistical analysis, a few small examples will be\
    \ used to illustrate:\n\n## 3.1 t test\nThe `t test` is also called the `mean\
    \ test`, that is, the test method that can verify whether the mean of a sample\
    \ meets a certain constant or whether there is a difference in the mean between\
    \ two samples. Assuming that the data shown is the sampling data of the capacity\
    \ of a certain brand of power bank, in order to test whether the brand of power\
    \ bank meets its advertised `5000 mA` capacity, a `t-test` tool (based on Python)\
    \ is needed.\n\n1) Propose the original hypothesis and alternative hypothesis.\n"
