    # 1. Data platform

    The data platform is the foundation of data support and application. To build
    a data platform, we need to work closely with relevant departments to integrate
    sales, customers, finance, production, employees, management, competition and
    other data. On this basis, introduce `CRM`, `ERP` and other management software,
    and do IT architecture and system updates.


    # 2. Data support

    Data support is to provide corresponding data according to the needs of business
    departments, such as users, competition, market, environment and other data. These
    data can be initially provided offline, and when the demand is basically stable
    and has begun to take shape, it can be presented online and assigned permissions.


    # 3. Data application

    Data application is the key responsibility and core value of the data analysis
    department. Data application areas include three aspects: strategy, investment,
    and marketing.


