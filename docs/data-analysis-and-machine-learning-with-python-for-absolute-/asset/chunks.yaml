    have different perspectives on issues, and there are differences in the criteria
    for evaluating good or bad. It is precisely because of this difference that companies
    may face great risks and costs when making decisions based on their own experience
    and intuition. It is the difference between enterprise experience and market demand,
    so empirical decision-making cannot guarantee that the enterprise can accurately
    grasp the pulse of the market at any time, and there will be certain risks. The
    role of data analysis is to enable companies to listen to the voice of the market
    and guide them to operate in accordance with the characteristics and laws of the
    market. Such decisions can be more objective and such companies can be more stable.
    Does Data analysis increases decision-making costs? It takes money to establish
    departments, recruit talents, purchase systems, and integrate data. Data analysis
    will greatly increase the cost of decision-making. Therefore, many of us believe
    that only large and powerful companies can do data analysis. Data analysis intuitively
    does increase the cost of decision-making. However, through data analysis, decision-making
    is made more objective, which not only reduces the losses caused by decision-making
    mistakes, but also reduces unnecessary management costs for enterprises. Compared
    with the losses caused by decision-making errors, the cost of data analysis is
    minimal. In fact, it is often not the costs incurred by data analysis that cause
    the company to suffer heavy losses, but the company''s decision-making errors.
    Many companies lack the awareness of data analysis, resulting in major decision-making
    mistakes, and even going nowhere. In addition to reducing the losses caused by
    decision errors, data analysis can also reduce unnecessary management costs for
    enterprises. For example, some companies often bring all new products to the market
    at the same time, and continue to push if they sell well, and then withdraw those
    that do not sell well. But let’s do the math, how much channel resources, labor,
    production line, and time cost will be occupied by those who do not sell well.
    If you do data analysis in the early stage to determine the market''s evaluation
    of new products, you will have choices when you launch new products and this strategy
    will save a lot of unnecessary management costs. Therefore, whether a company
    does data analysis or not has to be counted on two principles: how much does the
    data analysis cost? What are the benefits of data analysis? After that weigh the
    two, whichever is more important. Example : Company A wants to invest in the development
    of a new product, but the market performance of the product is uncertain and there
    are 4 possible states. The company''s marketing staff estimated the probability
    of occurrence of these four states and the corresponding profits. Company B is
    a data analysis company that can provide support for Company A''s new product
    decision-making. If the analysis result of B company shows that the new product
    presents any of the three states (1, 2, 3), then it is recommended that A company
    develop the new product; if it presents the status 4, then it is recommended that
    A company give up. The service fee for this data analysis by Company B is 40,000
    US dollars. The question now is, if you are the decision maker of Company A, do
    you cooperate with Company B in the development of this new product? As I said
    before, whether to cooperate with Company B is to compare the profit of non-cooperation
    and the profit of cooperation which is higher or lower. If there is no cooperation,
    the profit P of the new product is equal to the weighted average profit with the
    probabilities in the four states as the weights. What about Insufficient research
    data? Market research does have the problem of lack of trust, but we must not
    give up because of few setbacks. Instead, we must find the link and cause of the
    problem and then avoid it. I think the problem may lie in the design or implementation.
    For example, we just mentioned that for a company’s market share, different institutions
    provide different data. The problem may lie in the design process. These institutions
    may not provide you with the data sources and concept definitions that support
    the conclusion. In terms of data sources, if one family has 6,000 collection sites,
    distributed in first-, second-, and third-tier cities, while another has only
    2,000 collection sites, only distributed in first-tier cities, then the conclusion
    is definitely different. Which company has more reliable data depends on which
    company’s collection network distribution is more representative of the overall
    characteristics; which company’s sampling error is acceptable. For another example,
    in terms of concept definition, suppose it is a research on high-end microwave
    ovens. If one defines a microwave oven with a price of more than 80 dollars, and
    another defines a computer grill microwave oven with a price of more than 200
    dollars, the conclusion is definitely different. Before the investigation, relevant
    concepts need to be clearly defined.In addition, in the implementation process,
    whether the survey time, interviewees, survey location, and quality control are
    reasonable and effective will also affect the quality of the survey. It should
    be said that research is a highly professional industry. Omissions in any link
    may affect the accuracy and objectivity of the survey results. Whether it is your
    own research or outsourcing to a research company, you must have a certain degree
    of research. In this way, we can distinguish good from bad and control the credibility
    of survey data ￼ \*\*\*Organizational structure of data analysis \*\*\* First,
    there is Party B (a third party) that can meet our analysis needs. Do we need
    to have our own analysts? Second, if necessary, should the analyst enter the existing
    business department or set up an independent data analysis department? 1\. Does
    the company have its own analyst? Let me talk about the first question first.
    My point is that even with Party B, we still need our own analysts. The company
    will face a large number of decision-making issues during its operation, such
    as how to set up safety stocks? How to choose the right supplier? How to achieve
    optimal production arrangements? How to improve the success rate of new products?
    How to price? How to evaluate the effect of promotional activities? If there is
    a decision, there must be analysis requirements. If these requirements are outsourced
    to Party B, the cost is relatively high. Therefore, if it is a small and medium-sized
    enterprise, having its own analyst can reduce costs; if it is a large enterprise,
    outsourcing to a third party requires someone to contact the third party. If this
    person has no knowledge of data analysis, it is difficult to find a suitable third
    party. It is best to train your own analysts to improve the quality and efficiency
    of cooperation with third parties. 2\. In which department the analyst is located
    This is actually a matter of organisational structure. There are two organisational
    structures. One is that analysts are scattered across existing business departments,
    called a decentralised structure; the other is that analysts are concentrated
    in an independent data department, called a comprehensive structure. It should
    be said that the two structures have their own advantages and disadvantages. The
    advantage of the decentralised structure is that it is close to the data sources
    of various departments, convenient for data retrieval, and strong in analytical
    autonomy. In addition, the data is scattered in various business departments,
    and data leakage problems rarely occur. But the problem of decentralised structure
    is also obvious. The root cause is the embarrassment of the tripartite caused
    by the contradiction between departmental interests and comprehensive analysis.
    The analyst''s embarrassment Suppose I am an analyst, and I want to evaluate an
    investment project, and I need to make a comprehensive evaluation based on data
    such as environment, market, competition, product, and profit. However, the environmental
    data is in the strategy department, the marketing and competition data is in the
    marketing department, the product data is in the product department, and the cost
    and profit data is in the finance department. I only belong to one of these departments.
    Under the division of departments, I get other Departmental data is very difficult,
    so I can only have what kind of rice to do, and the nutritional value is naturally
    not too high. Embarrassment in the business department The information resources
    of various departments cannot be shared, which will result in the situation that
    those who understand the market do not understand the product, and those who understand
    the product do not understand the market, thereby affecting the effective operation
    of the business department. Business departments such as marketing department
    and product department are like multiple transportation trunk lines. If there
    is no independent department for information integration, it is like missing a
    transportation hub, and transportation at the interchange is prone to failure.
    The embarrassment of high-level decision makers Affected by the interests of this
    department, various departments will have the problem of reporting good news and
    not reporting worries and using data to compete for resources. It is difficult
    for the senior management to make effective assessments and optimal allocation
    of resources to various departments, which affects the overall control and system
    decision-making at the company level. The shortcomings of the decentralised structure
    can be compensated by the integrated structure. The integrated structure means
    that all analysts are concentrated in an independent data department, and the
    data department is directly responsible to the general manager, which is higher
    or equal to other business departments. You can freely retrieve data from each
    business department, and provide corresponding support for the business department
    according to the needs of the business department. At the same time, the data
    department does data management and analysis at the company level, assisting the
    general manager to do a good job in business cooperation, resource allocation,
    and performance appraisal among departments. The comprehensive structure can solve
    the contradiction between the departmental benefits brought by the decentralised
    structure and the comprehensive analysis. However, the integrated structure also
    has its shortcomings. Because analysts and business departments are independent
    of each other and are not familiar with each other, there will be deviations in
    the business department''s understanding of analysis reports and the data department''s
    understanding of business needs. In view of the shortcomings of the comprehensive
    structure, I think it can be solved by four major guarantees: standardised processes,
    detailed documents, reasonable presentation and smooth connection. Standardised
    process: The requirements are generally raised by the business department, and
    the results are returned to the business department through the data acquisition
    and calculation of the data department. In this process, the business department
    must not only provide data rules, but also the purpose of obtaining data and the
    indicators The definition, usefulness and value are described in detail; and the
    data department not only has to provide the final data, but also needs to explain
    the way to obtain the indicators and the calculation method. The ultimate goal
    is to make the two parties reach a consensus on understanding. Detailed documents:
    Two types of documents generated in the process-data requirements documents and
    data interpretation documents, detailed documentation is convenient for reference.
    Reasonable presentation: Let everyone see the data they want to see and understand
    the data intuitively. At the same time, whether it is a report, Excel, or other
    display methods, each indicator must be able to directly view its data interpretation
    document. Smooth connection: To ensure a smooth connection between business and
    data, there must be a connection person. This linker should be very familiar with
    the product’s strategic goals and business processes, and at the same time know
    the data acquisition methods and calculation methods. Perhaps it does not need
    to involve high-tech data ETL processing, organisation and optimisation, but must
    have its own calculation and calculation methods. The ability to obtain data,
    this interface is often the person in charge of the data department. What are
    the Responsibilities of the data analysis department? The value of data analysis
    is to provide support for corporate decision-making, which is also the responsibility
    of the data analysis department. How to achieve? I think we need to work hard
    in three aspects: data platform, data support, and data application. The following
    formula can be used to express the investment ratio of these three aspects: the
    responsibility of the data analysis department = 20% of the data platform + 30%
    of the data support + 50% of data applications. '
