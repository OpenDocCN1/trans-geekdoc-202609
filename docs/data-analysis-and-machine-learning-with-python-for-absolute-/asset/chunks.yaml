    \ Floating point number settings. . 2f means to display in floating point type\
    \ and to display two decimal places, or. 3f or others. print(.2f) Percentage setting\
    \ . 2% indicates that it is displayed as a percentage, and two decimal places\
    \ are displayed, which can also be. 3% or other. print(%2) Indentation and annotation\
    \ For programmers, indentation and annotation are pretty important. They not only\
    \ make everything seem less fancy but also will help programmers understand the\
    \ importance of good coding practices. Indent We call the blank part at the beginning\
    \ of the line of the code indentation. The purpose of indentation is to identify\
    \ the code block, that is, to let the program know which part to run. Take if\
    \ conditional statements as an example, indentation is to let the program know\
    \ which statement to execute when the conditions are met. In other languages,\
    \ curly braces are commonly used to indicate indents. As long as there are spaces\
    \ at the beginning of the line, even if it is indented, no matter how many spaces\
    \ there are, it is usually indented with 4 spaces, which is also convenient to\
    \ read the code. The statement blocks in functions, conditional statements and\
    \ loop statements in Python need to be indented,. Comments Comments serve as explanatory\
    \ to the code and do not really run. One-line comments begin with #, as shown\
    \ below. Multi-line comments can be implemented with multiple # s, ''s, or'' s,\
    \ as shown below. // This is great and a comment In the next chapter, we will\
    \ further expand our python skills by discussing about strings and their functionalities. "
