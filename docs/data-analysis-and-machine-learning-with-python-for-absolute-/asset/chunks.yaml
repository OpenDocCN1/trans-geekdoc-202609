    # 第 11 章 我们学了什么？


    让我们回顾一下本模块的要点。首先，我们介绍了学习和机器学习的内涵。关键点在于，学习必须能够提高其性能，否则它只是“伪学习”。机器学习算法还需要通过编程来实现。机器学习算法与普通编程的区别在于，它是从训练数据中学习的，且其功能的实现取决于数据的特征，而不需要显式编程。


    然后，我们主要解释了机器学习的三种主要形式，根据是否有“教师信号”以及是否使用标签数据，可以分为监督学习、无监督学习和半监督学习。


    简单来说，**监督学习**是一种使用标签数据进行分类的方法，通常使用这些正确且已标记的数据来训练神经网络。**无监督学习**是一种利用距离来衡量不同类别的聚类方法。无监督学习使用未标记的数据，也就是说它不知道输入数据的输出结果是什么，因此学习算法可以发现数据本身的模型和规律。无监督学习可以进行“异常检测”，即将某些点判断为“非离群点”，这是聚类的反向应用。


    在本章的最后，我们系统地学习了几个衡量模型性能的常用指标：`recall`（召回率）、`precision`（精确率）、`F1 score`（F1 分数）、`P-R
    curve`、`ROC curve` 等。它们在评估模型时有自己的侧重点。


    - `recall` 比例反映了分类模型识别正常样本的能力。召回率越高，模型识别正常样本的能力越强。

    - `precision` 反映了模型区分负样本的能力。精确率越高，模型区分负样本的能力越强。

    - `F1 score` 是一种权衡，其值越大，模型越稳健。


    本章解释了机器学习的主要概念。通过之前的学习帮助，请思考以下问题。


    ### 1. 在机器学习中，Accuracy（准确率）的局限性何何？

    **A:** 在分类任务中，虽然准确率是最简单、最直观的评估指标，但存在一些不合适的场景。例如，在负样本占 99% 的场景下，分类器会将所有样本预测为负样本，即使没有任何正样本的预测对，分类准确率也可以达到
    99%。这个正确率看起来很高，但实际上，正样本才是我们关心的样本。因此，当不同类别样本的比例差异很大时，比例占比大的类别往往是影响准确率的主要因素。例如，奢侈用户占所有用户的
    1%，而普通用户占 99%。我们的目标是选出真正的奢侈用户，因为他们可能是平台的大型收入用户，所以即使分类准确率达到了 99%，只要找不到任何奢侈用户，分类算法就是失败的。


    ### 2. P-R 曲线和 ROC 曲线之间有什么区别？

    **A:** 当正负样本差异不大时，`ROC curve` 和 `P-R curve` 的趋势几乎相同。然而，当负样本的比例非常高时，两种方法描述的性能截然不同。`ROC
    curve` 基本上不变，但 `P-R curve` 发生了剧烈变化。这意味着仅用 `P-R curve` 来描述不稳定的性能是不够的。从两个子图中可以看到，当负样本增加
    10 倍后，`P-R curve` 发生了显著变化，而 `ROC curve` 仍保持基本不变。


    这有什么实际应用价值？这一特性允许 `ROC curve` 能够克服由不同正负样本引起的干扰，更客观地反映模型本身的性能。在许多领域，正负样本的数量通常非常不均衡。例如，在计算广告领域，人们通常关心广告的转化率。正样本（对投放某种广告感兴趣的观众）通常是负样本（对广告不感兴趣的观众）的
    1/1000（甚至是 1/10000）。对于广告推送算法，如果选择了不同正负样本分布的测试集并使用 `P-R curve` 来衡量转化率，差异可能会很大。也就是说，使用
    `P-R curve` 评估此类场景是不直观的，而使用 `ROC curve` 评估此类场景要客观得多。因此，`ROC curve` 有更多应用场景，并广泛应用于排序、推荐、广告等领域。


    ### 接下来做什么？

    到此，我们已经完成了对数据分析平台的完美介绍。在本书的下一个模块中，我们将讨论数据分析精通所需的下一个高级主题和核心主题，即 VBA 自动化。请跟随我们了解更多信息。

    ![](img/rsrc244.jpg)


    # 用于数据分析的 Python 编程


    ## 引言

    本模块的这一部分是本书的重点。它关注数据分析的各种过程，介绍了每个过程中会发生的操作，以及如何在 Excel 中实现这些操作以及如何在 Python 中实现它们。


    数据分析的全过程实际上与烹饪的原理是一样的。它是将一堆原材料处理成不同的成品的方法。首先，我们需要了解我们使用的“锅”（Python 基础知识），然后购买原材料（获取数据源）。


