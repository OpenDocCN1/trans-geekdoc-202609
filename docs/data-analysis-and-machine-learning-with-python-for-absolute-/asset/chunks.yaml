    # 第 6 章 如何建立数据转换表？


    接下来，我们需要创建第二个表格，也称为“数据转换”表。建立此表有两个主要功能：

    * 动态引用“数据源”表中的对应数据并自动绘制图表。

    * 动态引用“数据源”表中的对应数据，并进行相应的数据转换，以及通知文本的自动组合。


    它主要包括“图表数据区域”、“柱图”、“通知数据区域”、“通知数据转换区域”、“通知文本区域”和“日期下拉选择”。“控制”这六个元素可以进一步分为三类：控制、图表和文本通知。


    ## 1. 控制设置

    我们先来看如何设置控件。后续图表和文本报告的动态引用需要根据控件进行选择和调用。


    **步骤 01**

    在“数据转换”工作表中，点击`[开发工具]`选项卡，在`[控件]`组中，点击`[插入]`按钮，在弹出的`[表单控件]`菜单中选择`[组合框（表单控件）]`，此时鼠标变成“十字””形。在想要放置表单控件的位置按住左鼠标键，拖动鼠标画出一个矩形，这个矩形代表表单控件的大小，对表单控件的大小满意后松开左鼠标键。会出现一个下拉表单控件。


    **步骤 02**

    选择刚刚插入的下拉表单控件，点击右鼠标键，并选择`[设置控件格式]`。


    **步骤 03**

    在弹出的`[设置控件格式]`对话框中，将`[数据源区域]`范围设置为`"数据源! $B$5:$B$126"`，这是通知的日期范围，然后将`[单元格链接]`范围设置为`"数据转换!
    $F$2"`，即当选择对应日期时，将填入对应的值。`[下拉显示项个数]`如果没有特殊要求，可以使用默认的下拉显示项个数，点击`[确定]`按钮。


    此时，下拉表单控件已设置完成。在控件中选择所需的日期以获取对应的值。例如，如果选择了第一个日期“2011-9-1”，得到值`"1"`；选择第 10 个日期“2011-9-10”，得到值`"10"`。


    ## 2. 数据动态引用

    设置好下拉表单控件后，我们可以根据控件输出的值来引用对应的数据。接下来我们将介绍如何引用对应的数据以绘制图表。


    由于这两个表有一些共同点，那么我们可以直接将“数据源”表中 B 列到 F 列的连续四行数据引用到数据区域的`"Chart" A3:E6`区域。刚才你也发现这两个表有共同点，甚至数据指标的顺序都是相同的，因此我们可以考虑一次性引用整个区域的数据，例如使用`OFFSET`函数。


    `OFFSET` 函数以指定的引用为引用系统，通过给定的偏移获取新的引用。返回的引用可以是单元格或单元格区域，可以指定返回的行数或列数。`OFFSET`函数的用法如下：


    ```

    OFFSET (Reference, Rows, Cols, [Height], [Width])

    ```


    `OFFSET` 函数的参数解释如下：

    * **Reference**（引用）：作为偏移引用系统的引用区域，`Reference` 必须是对单元格或连续单元格区域的引用；否则`OFFSET` 将返回错误值`"#VALUE!"`。

    * **Rows**（行）：相对于偏移引用系统左上角向上（向下）偏移的行数。行数可以是正数（表示下方）或负数（表示上方）。

    * **Cols**（列）：相对于偏移引用系统左上角单元向右（向左）偏移的列数。列数可以是正数（表示右侧）或负数（表示左侧）。

    * **Height**（高度）：即返回的引用区域的行数，`Height`必须为正数。

    * **Width**（宽度）：即返回的引用区域的列数，`Width`必须为正数。


    **步骤 01**

    使用鼠标选择“数据转换”表中的`A3:E6`单元格区域。


    **步骤 02**

    点击编辑栏左侧的`[插入函数]`，在`[引用]`分类中找到`OFFSET`函数，点击弹出的`[插入函数]`对话框中的`[确定]`。


    **步骤 03**

    在弹出的`[函数参数]`设置对话框中依次设置每个参数。参数的含义如下：

    * `Reference`参数设置为`"数据源! B1"`，即使用`数据源! B1`单元格作为引用系统。

    * `Rows`参数设置为`"F2"`，即根据下拉表单控件输出的值`n`向下偏移`n`行。

    * `Cols`参数设置为`"0"`，即列向右偏移，不偏移列，直接取`data 源! B1`单元格。

    * `Height`和`Width`参数分别设置为`"4"`和`"5"`，即返回的引用区域为 4 行 5 列。


    这些参数的组合说明是使用`data 源! B1`单元格作为引用框，向下偏移`n`行，不偏移列，引用 4 行 5 列的单元格区域。


    **步骤 04**

    在`[函数参数]`对话框设置好每个参数后，按`Ctrl+Shift+Enter`组合键根据控件的值获取区域。这比`VLOOKUP`函数方便得多。它可以一次性引用整个区域。完成图表引用后，你可以根据“图表数据区域”中的数据绘制对应的图表。


    ## 3. 文本组合

    动态引用图表数据并绘制图表后，我们需要组合文本。我们需要准备三个数据区域：“通知数据区域”、“通知数据转换区域”和“通知文本区域”。


    * “通知数据区域”与“图表数据区域”类似。

    * “通知数据转换区域”与“图表数据区域”类似。

    * “通知文本区域”与“图表数据区域”类似。


    （注：原文中存在大量重复段落，此处已根据逻辑进行了精简翻译。）


    '
- fmt: '

    1. Create a new worksheet and name it "Daily News".


    2. Enter the notification title in cell `A1`, merge cells `A1: H1`, and set the
    font size and typesetting to center.


    3. Add a date drop-down input control, you can directly copy the drop-down control
    that has been set in the "Data Conversion" table.


    4. Enter and set the body of the notification, for example, enter "1. User size"
    in cell `B4`, enter `=data conversion! I18` in cell `B5`, and copy the bar graph
    of the number of new users to the row of cell `B5` Below, the chart data will
    be updated as the original chart data is updated. The same is true for other notification
    text settings.


    5. You can hide unused cell areas outside the scope of the notification body.
    For example, to hide column `I` and the following columns, select column `I` with
    the mouse, press `[Ctrl+Shift+→]` at the same time, and click the mouse Right-click
    and select `[Hide]`. In the same way, you can also hide rows that are not used.


    6. If you want to hide the row and column headings, you can go to `[File]` → `[Options]`
    → `[Advanced]` to find the check box of `[Show row and column headings]` and uncheck
    it.


    With this, we have completed a brief introduction and expertise with VBA automation.
    In the next chapter, we will talk about data extraction with vivid details. Follow
    along!

