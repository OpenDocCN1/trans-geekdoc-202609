    \ how to find the best mapping in the hypothesis space is the biggest motivation\
    \ of supervised learning. For supervised learning, the constructed model usually\
    \ learns in the training set, adjusts the model parameters, and performs prediction\
    \ verification in the test data set.Therefore, the training set is usually described\
    \ by the formula using mathematical principles. ￼ Training data need to be used\
    \ in the learning process, which is often given artificially. In this training\
    \ set, the expected output of the system (i.e., label information) has been given\
    \ in advance. If the actual output of the model is inconsistent with the expected\
    \ output (there is a gap between the two), then the model has the responsibility\
    \ to \"supervise\" the learning system to readjust the model parameters until\
    \ the error between the two is within the tolerable range.Therefore, the expected\
    \ output (label information) is also called \"teacher signal\". The process framework\
    \ of supervised learning is roughly divided into two parts-learning and prediction.Specifically,\
    \ the input data, which can be text, picture, audio, video, etc., are prepared\
    \ first, and then the required features are extracted from the data to form feature\
    \ vectors. Next, these feature vectors and the tag information of the input data\
    \ are sent to a learning model (specifically, a learning algorithm), and an available\
    \ prediction model is polished after repeated training. Then, the same feature\
    \ extraction method is applied to the new sample to obtain the feature vectors\
    \ of the new sample. Finally, taking the eigenvectors of these new samples as\
    \ input, the prediction model is used to predict, and the expected Label information\
    \ of the new samples is given. ￼ As mentioned earlier, if the input variables\
    \ and output variables are of different types (either continuous or discrete),\
    \ people usually give different names to the forecasting tasks according to the\
    \ different types of input and output variables, such as classification, regression\
    \ and annotation. Next we will talk about the problem of regression in supervised\
    \ learning. Follow along! What is regression? The main function of regression\
    \ is to predict the relationship between input variable x (independent variable,\
    \ i.e. feature vector) and output variable y (continuous dependent variable, i.e.\
    \ label).The expression of this relationship is usually a resolution function.In\
    \ the function, each input variable has a weight, which is also called \"coefficient\"\
    . For a specific training set, the input variable X can be regarded as a known\
    \ quantity. The purpose of training is to find a suitable coefficient, so that\
    \ Y and X can be well fitted within the framework of the learned coefficient,\
    \ that is by giving X so it can predict Y well.Therefore, to some extent, the\
    \ study of regression problem is equivalent to function fitting, that is, selecting\
    \ a function curve can fit the known data well and predict the unknown data well.\
    \ Similarly, regression problem is divided into two parts: learning and prediction.The\
    \ learning system constructs a model based on the training data, namely the function\
    \ y. ￼ Where β represents an unknown parameter, which can be a scalar or a vector.Y\
    \ can be associated with x and β by regression model.Then, given a new input,\
    \ the forecasting system will give the corresponding output according to the learned\
    \ model. Loss function As we know, in the supervised learning algorithm of machine\
    \ learning, a decision function f is constructed in the hypothesis space. For\
    \ a given input x, the corresponding output may be inconsistent with the original\
    \ expected value y.Therefore, we need to define a Loss Function to measure the\
    \ \"gap\" between them.The loss function is usually written as l (y,) = l (y,\
    \ f (x)), and the value of this function is non-negative for convenience. There\
    \ are four common loss functions. \n\n1.  0-1 loss function ￼ \n\n2.  Absolute\
    \ Loss function ￼ \n\n3.  Quadratic Loss function ￼ \n\n4.  logarithmic Loss function\
    \ ￼ "
