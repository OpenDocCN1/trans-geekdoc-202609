    # Chapter 3 Entering VBA runtime environment


    In Excel, `VBA` statements are mainly written, modified and run in the Visual
    Basic editor. The Visual Basic editor is abbreviated as `VBE`. It is a separate
    application that can be seamlessly linked with Excel. But to use `VBE`, you must
    first open Excel. The `VBA` module is stored together with the Excel workbook
    file. Unless the `VBE` window is activated, the `VBA` module is invisible. What
    is a module? Simply put, a module is like a place where `VBA` statements are stored.
    How do I enter the `VBE` window? In addition to entering the `VBE` window by editing
    the macro which we have mastered just now, there are also commonly used methods
    to enter the `VBE` window.


    - In the `Code` group of the `Development Tools` tab, click the `Visual Basic`
    button.

    - Press `Alt+F11` key combination.


    After entering into the module experiment with different functionalities by yourself
    for better understanding the scope of the software and the automation principles
    that may be needed. In the next section, we will discuss about `VBA` debugging
    skills.


    ## VBA debugging skills


    If you are not an experienced `VBA` user, then the `VBA` statements you write
    will often fail to run and can run errors that are often hard to clear. For example,
    if a symbol or a space is missing in the statement then it may not run correctly,
    or even fail to run. It needs to be debugged and modified to run correctly. At
    this exact time, we need to quickly locate the problem through debugging. `VBA`
    debugging skills mainly have the following points.


    - `F8` key: Use the `F8` key to run `VBA` statements step by step, and quickly
    locate `VBA` statements that cannot be run or that have incorrect results.

    - Immediate window: The immediate window can be opened by `Ctrl+G`, in which the
    result value of the `Debug` is present. Print statement can be displayed, and
    the code can be calculated and run at any time. For example, we need to check
    whether the value of parameter `n` is correct and using the results we can then
    write the statement `Debug.Print n` directly in the `VBE` window, and the value
    of `n` can be displayed after running.

    - Monitoring window: Variables and expressions can be added to the monitoring
    window, and the values of variables and expressions can be viewed in real time.

    - Local window: You can view the value of the current existing variables in the
    local window.

    - Edit window: Hover the mouse on the variable in the edit window to display the
    value of the variable.


    In the above windows, you can check whether the expressions and variables are
    set correctly. By running the code, you can know what the results of the expressions
    and variables are at this time, and you can also monitor or retrospect whether
    they are the results we need. These are the essential principles and system philosophy
    that are surrounded by the Automation software. We just introduced some `VBA`-related
    knowledge to lay the foundation for subsequent report automation. You must master
    these basic concepts so that you will not be confused in the subsequent study
    that specifically discusses about the Excel automation with examples. Next, we
    will learn the relevant knowledge of report automation.


    # Chapter 4 Excel report automation


    Generally, daily reports are relatively simple, mainly reporting the completion
    of some key indicators of enterprise operations. The indicators and content of
    the notification are basically fixed, so we can template and automate the daily
    report. So how do we make templates and automate the procedure? Usually every
    morning data scientists first log in to the company database to extract data,
    and copy it to Excel for corresponding processing and drawing charts, and then
    copy the drawn charts to the Word document and edit the text of the notification.
    Finally, the body will be sent out in the form of the body of the email. Let me
    introduce the principle of Excel daily report automation with detailed analysis
    in the below section.


    1. Through the `VBA` statement, the corresponding key indicator data of the previous
    day is automatically extracted from the database, and it is automatically added
    and placed in the corresponding position in a table named "Data Source" to realise
    one-click automatic data extraction.

    2. In the data conversion area, according to the specified date conditions, dynamically
    quote the corresponding data in the "data source" table, and automatically draw
    charts and combine notification text.

    3. In the daily report body area, quote the corresponding combined notification
    text and drawn diagrams.

    4. Select the date to be notified through the control, and automatically generate
    the daily report body of the corresponding date.


    We still use the "User Details" and "Order Details" tables as the daily report
    data source to introduce the realisation of Excel daily report automation. This
    is the final display result of our daily report. As long as you extract data with
    one click and select the date to be notified, Excel will automatically quote the
    corresponding data and generate the corresponding daily report. The connected
    report texts are all combined to save time and effort. Usually looking at the
    daily report, we can see that this daily report is usually divided into two parts.


    - User scale (number of new users, number of subscribers).

    - Business scale (number of orders, business income).


    These two parts are equivalent to the analysis framework of the report. Whether
    it is a special analysis report, a monthly report, a weekly report, or a daily
    report, each report needs a clear analysis framework so that readers can understand
    the content of the report correctly and quickly. With this, we have provided a
    simple introduction to the Excel automation procedure. In the next section of
    this module, we will talk about creating a data template. Follow along!


    # Chapter 5 Creating a data template


    If you have a good data planning habit, you can not only keep your data in order,
    but also need to reduce the complexity of data processing, save data processing
    time, and improve work efficiency. Also it is important to remember that we need
    to plan the data required for the daily report, establish a data template, and
    realise the automation of the Excel daily report. For example, for your understanding
    we will provide an example. Three tables need to be prepared in the "daily report.xls"
    file. Here is a snippet about each of them.


    - Data Source table: This is used to store key indicator data required for daily
    notification.

    - Data conversion table: This is used to dynamically quote the corresponding data
    in the "data source" table, and carry out the corresponding data conversion, and
    finally automatically draw the chart and combine the notification text.

    - Daily report table: According to the analysis framework, organise and quote
    the corresponding combined notification texts and drawn charts in the "Data Conversion"
    table, and present the daily report with beautiful customisation abilities.

    '
