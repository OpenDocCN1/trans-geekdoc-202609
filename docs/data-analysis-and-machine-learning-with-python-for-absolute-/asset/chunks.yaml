    source table required by the daily report, and sort out the key indicators that
    the daily report needs to use for displaying the information. The key indicators
    are "number of new users" and "subscribed users", "Number of Orders", "Business
    Revenue", "Cumulative Number of Subscribers", "Cumulative Number of Users", "Cumulative
    Number of Orders", "Cumulative Business Revenue". ￼ If your daily report adds
    notification content, then this "data source" table should also include the added
    indicators to ensure the integrity and automation of the notified data. After
    collecting and sorting out the key indicators required for the daily report, in
    the "data source" table template, you must start to set the data calculation relationship
    between the indicators. For example, "cumulative users", "cumulative orders" ",
    "cumulative business income" columns can be used for cumulative calculation purposes.
    Take the "cumulative order count" as an example and enter the formula "=I4+E5"
    in cell I5, and then use the cell fill handle function in Excel to copy the formula
    in the cell below, so that when there is the latest "order count". When going
    to the "Data Source" table add the "Cumulative Order Number" corresponding to
    the same row that is also updated and calculated accordingly. In the same way,
    the “cumulative number of users” and “cumulative business income” are set accordingly.
    Why does the "cumulative subscriber number" need to set the cumulative calculation
    relationship like the "cumulative subscriber number"? This is because first of
    all, we must understand that the cumulative calculation of the number of users
    is done to remove the double calculation ambiguities. The registered user data
    in the "User Details" table will not have duplicate user IDs. If it exists, it
    does not conform to the business logic. As long as it is registered before, it
    will not appear in the subsequent new registrations every day. The ordering user
    data in the "Order Details" table has duplicate data, because this user can order
    products before and continue to order now, or continue to order at some time in
    the future, so the number of ordering users needs to be processed within a unit
    time. To de-duplicate calculations, simple cumulative addition calculations cannot
    be performed. Therefore, the "accumulative number of subscribers" needs to be
    recalculated in the database every day based on the number of subscribers after
    deduplication, while the "accumulative number of users" only needs to be set up
    once in the data template. With this basics we can further proceed to talk about
    establishing a data conversion table. '
