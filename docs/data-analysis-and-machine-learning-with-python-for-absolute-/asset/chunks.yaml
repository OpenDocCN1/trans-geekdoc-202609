  trans: "\n\n# 第 4 章 字符串\n\n## 字符串的概念\n字符串是由零个或多个字符组成的有限序列，用单引号或双引号括起来，其符号为 `str`（string\
    \ 的缩写）。以下是所有的字符串示例。\n`“ Hello world”` `“ This is a string\"`\n\n## 字符串连接\n字符串拼接是一个相对常见的需求，例如拼接姓和名。你可以直接使用运算符\
    \ `+` 来连接两个或多个字符串。这里有一个示例：\n```\n“ Hello” + “ Universe”\n```\n输出结果为：`Hello Universe`\
    \ \n\n## 字符串复制\n有时我们需要多次重复一个字符串。例如，如果你想将“Python is really powerful\" 这句话重复三次，可以使用运算符\
    \ `*` 来重复字符串。\n```\n“ Python is really powerful” * 3\n```\n上述代码会对该字符串进行三次重复，只需输入\
    \ `*3` 即可。你可以根据需要重复任意次数。以下是输出：\n```\nPython is really powerful\nPython is really\
    \ powerful\nPython is really powerful\n```\n\n## 获取字符串的长度\n手机号、身份证号和名字都是字符串。如果你想知道这些字符串的长度，可以使用\
    \ `len()` 函数来获取字符串的长度。以下是代码：\n```\nlen(“This is great”)\n```\n输出为：`11`\n记住，字符串的长度中不会包含空格。\n\
    \n## 字符串搜索\n字符串搜索指的是查找一个字符串是否包含另一个字符串。例如，如果你知道用户名，想知道该用户是否是测试账户（通过名称是否包含 test\
    \ 单词来判断测试账户），只需在名字中查找 \"test\" 字符串即可。如果找到了，说明该用户是测试账户；如果找不到，则说明不是测试账户。这两种方法都可以用\
    \ `in` 或 `not in` 实现。\n\n除了 `in` 和 `not in`，你还可以使用 `find`。当你使用 `find` 查找某个字符是否存在于字符串中时，如果存在，它会返回字符的具体位置；如果不存在，它会返回\
    \ `-1`，如下所示。注意，由于 Python 中的位置从 0 开始计数，所以第三个位置是 2。示例：\n```\n“ Hello” in “ Hello\
    \ World” True\n```\n这是另一个示例：\n```\n“Foosball” in “ Fifa Worldcup” False\n```\n\
    \n## 字符串索引\n字符串索引是指根据值在字符串中的位置来选择值。需要注意的是，字符串中的位置从 0 开始。\n\n### 获取字符串中的第一个字符\n\
    通过这种方法，我们可以找到任何特定字符串中的第一个字符。这在开发 Web 应用时特别有用。代码如下：\n```\nvar = “ Great person”\n\
    var[0]\n```\n输出为：`G`\n\n### 获取字符串中第 4 位的字符\n```\nvar = “ Great person”\nvar[3]\n\
    ```\n输出为：`E`\n\n### 获取字符串中第 2 到第 4 个字符之间的值\n且不包含第 4 个字符。代码为：\n```\nvar[1:3]\n\
    ```\n输出为：`Rea`\n\n我们要求你快速查看以下其他示例，以便参考并更好地理解该主题：\n1. 获取字符串中第 1 到第 4 个字符之间的值，且不包含第\
    \ 4 个字符，第 1 个字符可以省略。\n2. 获取字符串中第 7 个到最后一个字符之间的值，最后一个字符可以省略。\n3. 获取字符串中最后一个字符的值。\n\
    \n我们将上述通过特定位置获取位置值的方法称为普通索引；通过特定位置区间获取位置内值的方法称为切片索引。\n\n## 字符串分割\n字符串分割是先使用特定的分隔符对字符进行分割，然后使用\
    \ `split()` 函数以列表的形式返回分割值。\n```\n“ Hello , How , Are , You?” . split(,”)\n```\n\
    输出为：`['Hello’,’How’,’Are’,’You?’]`\n\n## 移除字符\n移除字符的方法是 `strip()` 函数，用于移除字符串开头和结尾指定的字符。默认情况下，会移除字符串开头和结尾的空格或换行符。\n\
    ```\n“AaA”.strip(“A”)\n```\n输出为：`‘A’\n\n到此，我们完成了对 Python 字符串操作的要介绍。在下一章中，我们将讨论\
    \ Python 中的列表（Lists）。请继续关注！\n\n"
- fmt: "\n# Chapter 5 Data structure-lists & dictionaries\n\n## Concept of List\n\
    A list is a data structure used to store a group of ordered data elements, separated\
    \ by commas. The data elements in the list should be enclosed in square brackets,\
    \ and the list is a variable data type. Once a list is created, you can add, delete\
    \ or search for elements in the list. The data in square brackets can be of type\
    \ `int` or `str`.\n\n### Create a new list\nThe method of creating a new list\
    \ is relatively simple, just enclose the data elements in square brackets. The\
    \ following are new examples of several common types of lists.\n\n**Create an\
    \ empty list** When there are no data elements in the square brackets, the list\
    \ is an empty list.\n```python\nthis_is_empty = [] // This creates an empty list\n\
    ```\n\n**Build a list of int types** When all the data elements of the square\
    \ brackets are of type `int`, this list is a list of type `int`.\n```python\n\
    This-is-int = [6, 78, 98] // This is a list with int data\n```\n\n**Build a list\
    \ of str types**\nWhen all data elements in square brackets are of type `str`,\
    \ this list is a list of a str type.\n```python\nStr_list = [\"f\",\"g\",\"h\"\
    ] // This is a list with strings\n```\n\n**Create a list of int+str type** When\
    \ the data element in the square brackets has both `int` type and `str` type,\
    \ the list is an `int+str` type list.\n```python\nCombine = [1,2,\"a\",\"b\"]\
    \ // This is a list with string and int\n```\n\n### Copy of List\nThe copy of\
    \ the list is similar to the copy of the string, but also uses the `*` operator.\n\
    ```python\nlist = [2,7,8]\nlist * 3\nOutput: [2,7,8,2,7,8,2,7,8]\n```\n\n### Merging\
    \ of lists\nList merging is to merge two existing lists together. There are two\
    \ main ways to implement it. One is to use the `+` operator, which is consistent\
    \ with the connection of strings; the other is to use the `extend()` function.\
    \ \n\nThe purpose of merging can be achieved by directly connecting the two lists\
    \ with the `+` operator. The merging of the lists is sequential. To merge list\
    \ `B` into list `A`, the method used is `A.extend(B)`, and to merge list `A` into\
    \ list `B`, the method used is `B.extend(A)`.\n```python\nLista = [2,4,5]\nList\
    \ = [6,7,8]\nLista + List\nOutput: [2,4,5,6,7,8]\n```\n\n### Insert a new element\
    \ into the list\nThe list is changeable, that is, when you create a new list,\
    \ you can also operate on this list. There are mainly two functions available\
    \ for inserting data elements into the list: `append()` and `insert()`. These\
    \ two functions will directly change the original list, and will not directly\
    \ output the results. You need to call the list name of the original list to get\
    \ the list after inserting new elements.\n\nThe function `append()` inserts a\
    \ new data element at the end of the list.\n```python\nLista = [3,6,7]\nLista.append(12)\n\
    Output: [3,6,7,12]\n```\n\n**The function `insert()`** inserts a new data element\
    \ at a specified position in the list.\n```python\nLista = [2,5,6]\nLista.insert(6,8)\n\
    Output: [2,5,6,8]\n```\n\n### Delete the value in the list\nWhen deleting the\
    \ value in the list, there are two functions `pop()` and `remove()` available.\
    \ \n\nThe `pop()` function deletes according to the position in the list, that\
    \ is, deletes the value at the specified position.\n```python\nLista = [6,3,4]\n\
    Lista.pop(4)\nOutput: [6,3]\n```\n\nThe `remove()` function deletes according\
    \ to the elements in the list, that is, delete an element.\n```python\nLista =\
    \ [6,3,4]\nLista.pop(1) // deletes according to the index\nOutput: [6,4]\n```\n\
    \n### Sort the values in the list\nThe `sort()` function is used to sort the values\
    \ in the list, and the `sort()` function uses ascending order by default.\n```python\n\
    Lista = [6,7,1,3]\nLista.sort()\nOutput is [1,3,6,7]\n```\n\n## Data structure-dictionary\n\
    A dictionary (`dict`) is a structure of key-value pairs, similar to an address\
    \ book that finds addresses and contact details by contact name, that is, links\
    \ the key (name) and value (details) together. Note that the key must be unique,\
    \ just like if two people happen to have the same name, you cannot find the correct\
    \ information. Key-value pairs are marked in the dictionary with `{key1:value1,key2:value2}`.\
    \ Note that the key-value pairs are separated by colons, and the pairs are separated\
    \ by commas, all of which are included in curly braces.\n\n### Create a new dictionary\n\
