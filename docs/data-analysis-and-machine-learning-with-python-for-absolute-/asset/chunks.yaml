    # Chapter 2 IDE and IDLE


    The steps of programming are usually easy to follow. But for beginners who are
    new to programming we provide various ways to help you understand the topic below.
    During the running of the program, an editor is first needed to write the code.
    After writing the code, we need a compiler to compile our code to the computer
    for execution. It is inevitable that some errors will occur during the code running.
    At this time, you need to use a debugger to debug the code.


    ## What is an IDE?


    IDE is the abbreviation of the English word Integrated Development Environment,
    which means integration of all the components in one platform for developers.
    An integrated development environment is an application program used to provide
    a program development environment. The program generally includes tools such as
    a code editor, a compiler, a debugger, and a graphical user interface. IDE contains
    all the tools used in the process of programming, so we generally choose to use
    IDE when writing programs.


    IDLE is one of the IDEs, and also the simplest and most basic IDE. Of course,
    there are many kinds of IDLE in IDE, such as Visual Studio (VS), PyCharm, Xcode,
    Spyder, Jupyter Notebook, etc. Nowadays, in the field of data analysis, Jupyter
    Notebook is more commonly used, and it is also used in this book. However, we
    need to inform you that choice of IDE is a personal preference and we want you
    to do a little bit research to chose the tool that is suitable for your needs.


    ## Introduction to Jupyter Notebook


    ### a) Create a new Jupyter Notebook file

    Enter `Jupyter Notebook` (not case sensitive) in the computer search box, and
    then click `Open` to start the procedure. After opening Jupyter Notebook, click
    the `New` button in the upper right corner and select the `Python 3` option in
    the drop-down list to create a Python file. You can also select the `Text File`
    option to create a `.txt` format file if you are trying to export it to other
    platforms. When you see the interface with a normal interface it means you have
    created a new Jupyter Notebook file.


    ### b) Run your first code

    As said, enter a piece of code `print("hello world")` in the code box, and then
    click the `Run` button, or press the `Ctrl+Enter` key combination. Within seconds
    it will output `hello world`, which means your first piece of code is running
    in a successful manner. When you want to change code box to enter the code, you
    can add a new code box by clicking the `+` button in the upper left corner.


    ### c) Rename Jupyter Notebook file

    When creating a new Jupyter Notebook file, the file name defaults to `Untitled`
    (similar to a workbook in Excel). You can click `File>Rename` to rename the file.
    We recommend you to follow certain renaming rules before starting the procedure.
    Don''t use ambiguity names and symbols in your file name. Always make it simple
    and easy to organise.


    ### d) Save Jupyter Notebook file

    After the code is written and the file name is determined, the code file can be
    saved at this time. There are two ways to save.

    - **Method one**: click `File>Save and Checkpoint` to save the file. This method
    will save the file to the default path, and the default file format is `.ipynb`,
    which is the exclusive file format of Jupyter Notebook.

    - **Method two**: select the `Download as` option to save the file, which is equivalent
    to `"Save As"` in Excel. You can choose the save path and save format yourself
    for easier understanding of the file mechanism.


    ### e) Import local Jupyter Notebook files

    When you receive the `.ipynb` file, how to open it on the computer. Open the file?
    You can press the `Upload` button to find the location of the file, and load the
    file into Jupyter Notebook.


    ### f) Jupyter Notebook and Markdown

    The code box of Jupyter Notebook is in code mode by default, which is used for
    programming. You can also switch the mode of Jupyter Notebook to Markdown mode.
    At this time, the code box will become a text box, and the content will support
    Markdown syntax. When you are doing data analysis, you can use Markdown to write
    down the analysis results. This is one reason why Jupyter Notebook is popular
    among data practitioners.


    ### g) Add directory to Jupyter Notebook

    The function of the catalog is to make the content easy to find. Generally, there
    will be catalogs for longer content, such as books, graduation thesis, etc. You
    can click the table of contents to jump the corresponding code. The directory
    is not included with Jupyter Notebook and needs to be installed manually. The
    specific installation process is as follows:


    1. Enter `Anaconda Prompt` in the Windows search box and click `Open` to start
    the procedure.

    2. Type `pip install jupyter_contrib_nbextensions` and press Enter to run to install
    the `jupyter_contrib_nbextensions` module.

    3. The `y/n` option will appear in the middle of the program. Enter `y` and press
    Enter until the `Successfully installed` prompt appears.

    4. On the basis of Step3, continue to enter `jupyter contrib nbextension install
    --user` and press Enter to configure the user system.

    5. After Step4 is completed, open Jupyter Notebook and you will see an additional
    `Nbextensions` tab on the interface that can be used for further implementation.
    Click the `Nbextensions` tab to open it, and check the `Table of Contents(2)`
    checkbox.

    6. At this time, open an `.ipynb` file that already has a directory, and you will
    see an extra button in the box on the main interface (as shown), but there is
    still no directory. Press the button in the box in the upper right corner of the
    figure, and the directory will be displayed.


    Step1- Step6 described above creates a directory environment for Jupyter Notebook.
    The following section describes how to create a new file with a directory.


    1. Select `Heading` as the code box format and head on to the next step for better
    optimisation.

    2. Directly enter the titles of different levels in the code box. `1#` indicates
    the first-level title, `2#` indicates the second-level title, `3#` indicates the
    third-level title (note that there is a space between `#` and the title text).
    The heading level decreases in turn as the number of `#`.

    3. Run the code block of Step2 and you can get the result as you are desired to
    get.


    With this, we have completed some of the important basics of the subject. In the
    next section, we will talk about basic concepts of Python. Follow along to learn
    Python that is absolutely necessary for data science to be implemented.

