    # Chapter 7 Loops & Conditionals


    ## for loop

    The `for` loop is used to traverse any sequence of items, which can be a list
    or a string, and perform corresponding operations for each item in the sequence.
    For example, the compulsory courses of a data analyst mainly include `Excel`,
    `SQL`, `Python` and statistics. If you want to be a data analyst, you must learn
    these four courses, and the learning order should be `Excel` first, then `SQL`,
    then `Python`, and finally statistics. The process of learning these four courses
    in turn is to traverse a `for` loop.


    ```python

    for ( Enter arguments here) { // Enter logic here }

    ```


    ## while loop

    The `while` loop is used to execute a program cyclically, that is, when the conditions
    are met, it will execute a program until it is terminated when the conditions
    are not met. For example, becoming a data analyst in seven weeks means that as
    long as you study according to the curriculum for seven weeks, you can be a data
    analyst and find a job. This is based on whether you have studied for seven weeks.
    If the study time has not reached seven weeks, then you need to keep studying
    until the study time is longer than seven weeks before you can stop studying and
    find a job. The specific process of executing `while` statement is shown The following
    is the implementation code.


    ```python

    While ( // Enter conditions) { // Enter logic here }

    ```


    ## Conditional statements


    ### if statement

    An `if` conditional statement is a program that first judges whether a certain
    condition is satisfied, and then executes the judgment statement if the condition
    is satisfied. The program after the `if` condition needs to indent the first line.
    For example, if you study the necessary skills of data analysts, you can find
    a job related to data analysis, but if you don''t study hard, it is difficult
    to find a job related to data analysis. We use `1` for studying hard, `0` for
    not studying hard, and assign an initial value of `1`, which means that you study
    hard. When judging whether to study hard or not, the specific process is shown
    in the following figure. The following is the implementation code.


    ```python

    If ( condition) { // statements }

    ```


    When judging whether you have not studied hard or not, the specific flow is shown
    in the following figure. The following is the implementation code.


    ```python

    If ( condition) { // logic 1 } { // logic 2 }

    ```

    Because the condition is not satisfied, the program after the `if` condition is
    executed, that is, the output is null.


    ### else statement

    The `else` statement is a supplement to `if` statement. `if` condition only explains
    what the program does when the condition is satisfied, but does not explain what
    the program does when the condition is not satisfied. The `else` statement is
    just used to explain what the program does when the condition is not satisfied.
    When judging whether to study hard or not, the specific process . The following
    is its code implementation.


    ```python

    Else { // Enter conditions here }

    ```

    When judging whether the condition is not to study well, the following code is
    implemented.


    ### elif statement

    The `elif` statement can be approximately understood as `else_if`. The above-mentioned
    `if` statement and `else` statement can only judge one statement, but when you
    need to judge multiple statements, you can use `elif` statement. `elif` may or
    may not have an `else` statement, but it must have an `if` statement. The specific
    execution order is to judge whether the conditions after `if` are met, if yes,
    run the program when `IF` is true, and end the loop; If the `if` condition is
    not satisfied, judge the `elif` statement. There can be multiple `elif` statements,
    but only 0 or 1 `elif` statements will be executed. For example, if you want to
    guess how many scores someone got in the exam, how should you guess? First, judge
    whether this person has passed the exam (`60` points is the standard). If it fails,
    guess a score less than `60` points. If it passes, then judge which score segment
    his score is in. The code implementation is as follows.


    ```python

    elseif { // logic 1 }

    If { // logic 2 }

    ```


    # Chapter 8 function


    A function is a program that can be reused in a program. This program is composed
    of a statement and a name. Once the function is defined, you can call and execute
    this program through this name in the program.


    ## ordinary functions

    Ordinary functions are generally composed of function names (required), parameters,
    statement blocks (required), return and variables. The function definition syntax
    is as follows.


    ```python

    def // Enter function here with parameters

    ```

    The key word used to define the function is `def`, and the parameters are put
    in parentheses after the function name (the parameters can be empty). The parameters
    should end with colons, and the statement block should be indented with four spaces.
    The statement block is the specific thing to be done by the function. Define a
    function named `learn_python`: The above function uses the function name `learn_python`
    to call the statement block corresponding to `learn_python` several times.


    ```python

    Def learn_python

    ```

