    # Chapter 9 Performance metrics in Machine Learning


    We often say, "mule or horse, pull it out for a walk". Similarly, whether the
    machine learning model is good or not, we have to compare it. But if you want
    to compare the advantages and disadvantages of models, you have to "draw a way
    out". Determine a "higher or lower" standard, which is the topic to be discussed
    in this section-the performance measurement of the model.


    ## Confusion Matrix of the Second Classification Binary Classifier


    Confusion Matrix of the Second Classification Binary Classifier is one of the
    most widely used classifiers in the field of machine learning. In the application
    scenario of binary classification, we can divide samples into the following four
    categories according to different combinations of real categories and predicted
    categories.


    * **True Positive (TP)**: A sample that is actually a positive class and predicted
    by the model as a positive class.

    * **False Positive class (FP for short)**: a sample that is actually a negative
    class but predicted as a positive class by the model.

    * **True Negative (TN)**: a sample that is actually negative and predicted by
    the model as negative.

    * **False Negative (FN for short)**: a sample that is actually a positive class
    but predicted by the model as a negative class.


    Obviously, these four types of samples have no intersection, and `TP+FP+TN+FN=`
    the total number of samples. Among them, the first class and the third class are
    samples with correct prediction, and the second class and the fourth class are
    samples with wrong prediction.


    We call the error that the sample is actually negative, but predicted by the model
    as positive, false positive (also known as Class I error). The error that the
    sample is actually a positive class but predicted by the model as a negative class
    is called omission (also known as Class Ⅱ error). `TP`, `FP`, `TN` and `FN` constitute
    a confusion matrix.


    Essentially, the confusion matrix will analyse the actual sample classification
    value (true class) and the model predicted classification value (predicted class).
    In the binary classification problem, we usually divide the samples into positive
    classes (or positive cases, which are often indicated by "1") and negative classes
    (negative cases, which are often indicated by "-1").


    For classification, the simplest and most direct criterion for evaluating a classifier
    is classification Accuracy, that is, the proportion of correctly classified samples
    to the total number of samples. For the second classification, this accuracy can
    be specifically expressed.


    However, it is not rigorous to describe the performance of classification algorithm
    only by accuracy. Sometimes we need to evaluate the performance in more detail
    with the help of recall, precision and F1 score.


    ## Recall, precision and F1 score


    The recall rate and precision rate are closely related to the positive samples.
    In order to understand these concepts, we give a schematic diagram. In the figure,
    the solid small circle represents the positive sample, the hollow small circle
    represents the negative sample, and the large circular area (composed of two semicircle
    areas) represents the sample judged as positive by the classification system.


    ### Recall rate


    `Recall (R, also called recall rate)` indicates the proportion of the number of
    correctly classified positive samples to the total number of all positive samples.
    There are two categories:


    For example, in the field of information retrieval, it is assumed that only nine
    related pages are returned by a search engine, and the other three related pages
    are scattered out of the observation range instead of returning. At this time,
    as far as the query system is concerned, the recall rate refers to the percentage
    of the retrieved related pages to all related pages in the system. The recall
    ratio can be represented by sub-graph. The recall rate reflects the comprehensiveness
    of retrieval, and its complement is the missing rate.


    ### Precision rate


    `Precision (P for short)` represents the proportion of the number of positive
    samples correctly predicted to the total number of positive samples judged by
    the classifier. It should be noted that there is a difference between precision
    and Accuracy.


    Whether it is precision rate or recall rate, the molecular part of them is `TP`
    (true class sample), but the denominator part is different. Accuracy refers to
    the proportion of correctly classified samples to the total number of samples,
    and its molecular part is two kinds of correctly classified samples. One is the
    true sample number, the other is the true negative sample number, and the denominator
    is the total sample number.


    Back to the precision rate, we also use the case of information retrieval to illustrate.
    Assume that the search engine returns a total of 13 pages, of which 9 are really
    related, while the other 4 are "self-thought" related (actually not related).
    The precision rate reflects the retrieval accuracy, that is, the ratio of the
    number of real related pages to the number of all retrieved related pages, and
    its complement is the false detection rate. The precision can be expressed by
    sub-graph.


    Generally speaking, when the precision rate is high, the recall rate is often
    low. On the contrary, when the recall rate is high, the precision rate is often
    low. For example, in history, there is such a cruel saying: "It''s better to kill
    a thousand people by mistake than to let one go". Here, we don''t pursue the meaning
    of this sentence. From the point of view of machine learning, it pursues the recall
    rate. In order to check it all, we will not hesitate to kill it by mistake. At
    this time, the precision rate is bound to be low. Please think about it, can you
    list the application scenarios where the precision rate is pursued and the recall
    rate is sacrificed?


    ### f1 score


    In order to give attention to both precision and recall, people also put forward
    another measure-F1 score. Essentially, the F1 score is actually the harmonic average
    of `p` and `r`. Different applications pay different attention to precision and
    recall, so F1 score is not a simple average of `P` and `R`.


    For example, in the commodity recommendation system, in order to disturb the user
    as little as possible and improve the user experience, it is often hoped that
    the detected commodity information will be as accurate as possible, which requires
    a high precision rate. However, in the fugitive retrieval system, it is often
    hoped that fugitives will be missed as little as possible, and the recall ratio
    is more important at this time. In order to have a tendency, the more general
    expression of F1 score is learnt. Among them, `β` is the ratio of relative importance
    of recall and precision. From formula it can be seen that when `1β >`, the items
    account for a larger proportion, that is, the recall rate has a greater impact
    on `Fβ`; On the contrary, when `1β <`, the precision has a greater influence on
    `Fβ`; When `1β=`, `Fβ` is `F1`.

    '
