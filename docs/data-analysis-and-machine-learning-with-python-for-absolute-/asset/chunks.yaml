- fmt: "\n# Chapter 5 Common methods of Data Analysis\n\nThe three types of statistical\
    \ analysis methods introduced above are general directions, that is, readers need\
    \ to use the strategies of these three types of statistical analysis methods to\
    \ describe or think about the phenomena and problems reflected by the data in\
    \ the process of data analysis. This section will share some specific common data\
    \ analysis methods from a detailed point of view (considering space limitations,\
    \ only some important methods are shared here), which are widely used in daily\
    \ study or work.\n\n## 1. Comparative analysis\n\nThis method is also called comparative\
    \ analysis method, which reflects the differences and changes in the number of\
    \ things through the comparison of indicators, which is the most commonly used\
    \ method in statistical analysis. In practical applications, readers may have\
    \ heard the terms of vertical comparison and horizontal comparison. \n\nVertical\
    \ comparison refers to the comparison of the same thing in the time dimension.\
    \ This comparison method mainly includes ring comparison (such as the number of\
    \ daily active users in the current month and the previous month. Month-to-month\
    \ comparison), year-on-year (such as the comparison of sales between March of\
    \ this year and March of the previous year), and fixed-base ratio (such as comparison\
    \ of the number of clicks from February to June with the number of clicks in January).\
    \ \n\nThe horizontal comparison is the comparison of different things at a fixed\
    \ time (such as the difference between different user levels in the price per\
    \ customer; the level of profitability between different categories; the payment\
    \ conversion rate of new users in different channels). Using the comparative analysis\
    \ method, the result obtained can be a relative value (such as percentage, multiple,\
    \ coefficient, etc.), or the absolute number of the difference and the related\
    \ percentage point (a percentage point is 1%), that is, the comparison index is\
    \ always subtracted. Therefore, it is possible to make judgments and evaluations\
    \ on scale, level, speed, etc. through comparative analysis.\n\n## 2. Group analysis\n\
    \nThe grouping analysis method is very similar to the comparative analysis method.\
    \ The difference is that the grouping analysis method can split the data into\
    \ various combinations according to multiple dimensions and can compare the differences\
    \ between the combinations. In order to enable readers to understand the difference\
    \ between group analysis and comparative analysis, here is a simple example to\
    \ illustrate. If you want to compare the sales of each sales channel in a month\
    \ (for example, October), you should use a comparative analysis method. If you\
    \ want to compare the sales of each sales channel in September, October, and November,\
    \ you should use group analysis Method. \n\nUsing the comparative analysis method,\
    \ we can find that the total sales volume of new books in October was 3863, of\
    \ which `Amazon.com` had the highest sales volume, accounting for 34.3% of the\
    \ total compared to the sales channels of `kobo.com`. Amazon’s sales volume is\
    \ nearly 6 times that of it. `Amazon`, `Kobo`, and `Apple Books` are the top three\
    \ channels in terms of sales volume, and their sales volume exceeds 85% of the\
    \ total sales volume. As shown, the time factor is added to the sales channel\
    \ (that is, horizontal comparison and vertical comparison are integrated), so\
    \ such data is usually called cross-sectional data. The data in the table (proportion\
    \ is the row percentage) is to compare the sales proportion of each channel in\
    \ the current month. From the data, it can be found that Amazon’s sales share\
    \ is showing a monthly upward trend, while `kobo.com` and `apple.com` are showing\
    \ a month-to-month downward trend. `Draft2digital` and local bookstore’s sales\
    \ share are very stable. In order to make the data display more intuitive, you\
    \ may wish to use the percentage bar chart introduced above to display the data.\
    \ According to this data, it is very easy to draw the conclusion that the sales\
    \ proportions of `kobo.com` and `apple.com` are gradually declining, while Amazon\
    \ is showing upward trend, and the other two channels have fluctu fluctu greatly.\n\
    \n## 3. Predictive analysis method\n\nThe predictive analysis method is mainly\
    \ used for the judgment and prediction of unknown data. This method is particularly\
    \ prominent and important in the era of big data. For example, based on historical\
    \ sales data in the past years, forecasting sales in the next months according\
    \ to various indicators to predict the possibility of suffering from a certain\
    \ disease use data left by consumers on the Internet to push goods. Forecast analysis\
    \ methods can be roughly divided into two types: one is forecast based on time\
    \ series, that is forecast according to the change of index value and time dependence\
    \ (specific forecast methods include moving average method, exponential smoothing\
    \ method, `ARIMA method`, etc.). The other is regression prediction, which is\
    \ to predict based on causal relationship between indicators (specific prediction\
    \ methods include `KNN algorithm`, `decision tree model`, etc.).\n\nThe following\
    \ is a simple case to illustrate the application of predictive analysis. Suppose\
    \ the factors that affect the sales profit (`Profit`) of a product include R&D\
    \ costs (`RD_Spend`), management costs (`Administration`) and marketing costs\
    \ (`Marketing_Spend`). So, how to predict the sales profit of commodities based\
    \ on these three factors? The following sections uses linear regression model\
    \ in predictive analysis method (for specific usage of model, readers can refer\
    \ to the later content of this book) to model the data and realise prediction\
    \ of commodity sales. From the result we can know the coefficients of multiple\
    \ regression model. Assuming that the significance of model and regression coefficient\
    \ are considered, the resulting regression model can be expressed as:\n\n```\n\
    Profit=63420+0.94*RD_Spend -0.01*Administration +0.03*Marketing\n```\nTherefore,\
    \ when specific values of the three factors are known, their values can be imported\
    \ into equations of linear regression to obtain possible commodity profits.\n\n\
    ## 4. Funnel analysis\n\nThe funnel analysis method is usually also called process\
    \ analysis method. Its purpose is to focus on the conversion rate of a certain\
    \ event in important link. This method is particularly common in the Internet\
    \ industry. Taking B2C e-commerce as an example, users usually have 4 important\
    \ links from browsing the page to completing the purchase. That is, the user enters\
    \ the product list page through homepage or search, then clicks on the specific\
    \ product to enter product detail page, then adds the product to the shopping\
    \ cart, and finally checks the product in shopping cart to complete the transaction.\
    \ Intuitive judgment shows that the number of users passing through these 4 important\
    \ links is definitely getting less and less, forming a cone-shaped funnel effect.\n\
    \nIn practical applications, data analysts can use funnel analysis method to monitor\
    \ the conversion rate, operational effects and processes of each important link\
    \ in the website operation process, and for links with particularly low conversion\
    \ rates or links with abnormal fluctuations make targeted corrections to ensure\
    \ the conversion rate and improve the overall operational effect. In order to\
    \ give readers an intuitive understanding, we may wish to take consumer behaviour\
    \ of e-commerce platforms as an example (assuming that e-commerce platform has\
    \ done corresponding marketing activities to promote a certain product, and the\
    \ conversion rate of the four links when users purchase the product is shown)\
    \ we will analyse the funnel effect of several important links. As seen from the\
    \ above, the funnel diagram involves 4 core links. First, starting from the product\
    \ details page, the conversion rate is 43.7%. That is, in this marketing activity,\
    \ 43.7% of the users will enter. Therefore, with the help of the above-mentioned\
    \ funnel analysis to compare the conversion rate between each link, when it is\
    \ found that the conversion rate of some links has fallen steeply, it can be considered\
    \ that some processes of the product or some steps of the marketing activities\
    \ have gone wrong, and then look for improvement solutions to these problems,\
    \ and ultimately increase the overall conversion rate.\n\n## 5. AB test analysis\
    \ method\n\nThe AB test analysis method is also a comparative analysis method.\
    \ This method focuses on comparing two groups of AB samples with similar structure\
    \ (such as similar user attributes and behaviours, similar product characteristics,\
    \ etc.), and digging out their differences based on the index values of the two\
    \ groups of samples. For example, for the same functional page of an APP, two\
    \ different styles of page layouts are designed, and then the two styles of pages\
    \ are randomly assigned to test users (the structures of these users are relatively\
    \ similar), and finally according to the user's browsing conversion on the page\
    \ rate to evaluate the pros and cons of different page layouts. \n\nSpecific example:\
    \ The order of payment methods presented by a company's APP on the cashier interface\
    \ (that is, the payment interface) is `Whatsapp`, `Applepay`, `Normal` (that is,\
    \ bank card payment), and `cash on delivery`. In order to increase the proportion\
    \ of quick payment, the order of payment methods is expected to be fine-tuned,\
    \ namely `Whatsapp`, `Applepay`, `Bankpay` and `cash on delivery`. But can this\
    \ order really increase the proportion of quick payments? In order to verify this\
    \ problem, technicians tested two batches of similar sample users, and the results\
    \ obtained. From the results, it can be seen that the adjustment of the payment\
    \ method sequence still has an impact on the proportion of quick payment. After\
    \ the adjustment of the sequence, the proportion of quick payment has increased\
    \ by nearly two percentage points. Therefore, after the AB test, it can be considered\
    \ that the adjustment of the payment method sequence is necessary.\n\nFrom the\
    \ author's point of view, there are certain rules (or steps) for solving everything,\
    \ so as long as these rules are understood and mastered, the problem will be much\
    \ simpler. For data analysis, there are also its rules, so readers must master\
    \ the three types of statistical analysis strategies and five commonly used data\
    \ analysis methods introduced in the previous article, and apply them to the work\
    \ of data analysis.\n"
