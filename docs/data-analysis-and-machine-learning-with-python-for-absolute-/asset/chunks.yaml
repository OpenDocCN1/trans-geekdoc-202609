    # 1. 数据平台

    数据平台是数据支持与应用的基础。为了构建数据平台，我们需要与相关部门紧密合作，整合销售、客户、财务、生产、员工、管理、竞争等数据。在此基础上，引入 `CRM`、`ERP`
    等管理软件，并进行 IT 架构和系统更新。


    # 2. 数据支持

    数据支持是根据业务部门的需求提供相应的数据，例如用户、竞争、市场、环境等数据。这些数据最初可以线下线下提供，当需求基本稳定并开始成型后，即可以在线形式呈现并分配权限。


    # 3. 数据应用

    数据应用是数据分析部门的核心职责和价值所在。数据应用领域包括策略、投资和营销三个方面。


    ![](img/rsrc244.jpg)


    ## 结语

    感谢你读完本电子书的最后。为了进一步提升在该领域的知识水平，建议你关注任何 `git hub` 项目。祝你的数据分析师职业顺利。


