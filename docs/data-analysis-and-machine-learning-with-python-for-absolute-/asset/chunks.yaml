    \ error, the complexity of the selected model can only get higher and higher.Because\
    \ only in this way can the model have strong data fitting ability. However, when\
    \ the model is complex enough, there will be too many parameters in the model,\
    \ and the probability of fitting will rise.When choosing a model, we need to follow\
    \ a basic principle: avoid over-fitting and improve generalisation ability. The\
    \ relationship between model selection and data fitting is illustrated by taking\
    \ the fitting problem of polynomial function as an example.For such a training\
    \ data set T=(x1,y1),(x2,y2),...,(xn,yn), where xi is the observed value (i.e.,\
    \ feature) of the sample and yi is the corresponding output observed value (i\
    \ = 1, 2, ..., n). Now our task is to fit these data with polynomial function\
    \ of degree m (since the observed values are continuous values, this is a regression\
    \ task rather than a classification task).Here, m is a variable value, for example,\
    \ a polynomial of the first degree (m=1), a polynomial of the third degree (m=3),\
    \ and so on.Our goal is to select a polynomial function which can fit the training\
    \ data well and predict the new samples well. Equation is interpreted as follows:\
    \ At present, there are m+1 features: x0,x1,x2,...,xm. \n\n*   There are m+1 weight\
    \ parameters to be learned: w0, w1,w2,…,wm. \n\n*   The positive and negative,\
    \ large and small of these parameters represent our \"attitude\" in choosing features.\
    \ If a certain wi is a large value, it means that its corresponding feature xi\
    \ is \"highly weighted\" and deserves attention. \n\n*   If a certain wi value\
    \ is close to 0, it means that the feature xi associated with this weight value\
    \ is \"people talk lightly\" and is optional. \n\nLow consciously let some weights\
    \ close to 0, so as to abandon some characteristics of the training method, called\
    \ weight decay (weight decay), it avoids the over-fitting to some extent. The\
    \ question now is, how to learn \"these are m+1 parameters\"?One of the commonly\
    \ used strategies is the least squares (MLS). Generally, there is an error between\
    \ the fitted function value f(xi,w) and the expected label yi, that is, the residual.\
    \ ￼ In 1829, the great mathematician Gauss proved that under the assumption that\
    \ errors e0,e1,...,en are independently and identically distributed, the least\
    \ square method has an advantage. The variance is the smallest among all unbiased\
    \ linear estimation classes (see Gauss-Markov Theorem, Gauss-Markov Theory).That\
    \ is, when the sum of squares of residuals is the smallest, the similarity between\
    \ fitting function (,) fxw and expected label y is the highest.That is, when L(w)\
    \ in formula gets the minimum value. w0, w1, w2, ..., wn are the optimal fitting\
    \ parameters. ￼ "
