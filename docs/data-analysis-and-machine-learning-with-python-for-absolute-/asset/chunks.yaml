    # Chapter 1 What is Python?


    First of all, Python is a programming language with a rich and powerful library.
    Python is called a glue language because it can easily connect various modules
    made in other languages (especially `C/C++`) together. The syntax of Python language
    is simple and easy to use. It has many ready-made libraries for you to call directly
    to meet your needs in different fields. Python is favoured by more and more programmers
    in the fields of data analysis, machine learning and artificial intelligence.
    Because of this, Python surpassed Java to become the first in the programming
    language rankings many times according to TIOBE and GitHub rankings.


    ## Python Download and Installation


    Instead of downloading the official Python version, the book uses `Anaconda`,
    an open source version of Python. `Anaconda` was chosen because it is so user
    friendly to people who have just started to learn Python. As we all know, Python
    has many off-the-shelf libraries that you can call directly. But remember that
    you must install them before calling them. If you download the official version
    of Python, you need to manually install the libraries you need to use. But `Anaconda`
    comes with some commonly used Python libraries and this advantage does not need
    to install the libraries yourself.


    Now let''s look at `Anaconda`''s specific installation process.


    ### Step1

    Check whether the system type of the computer is a 32-bit operating system or
    a 64-bit operating system. As shown in the following, the 64-bit operating system
    should be selected if you are using high end systems. If you are using low-end
    systems we recommend you to install the 32-bit operating system.


    ### Step2

    Enter the official website (`https://www.anaconda.com`) and click the `Download`
    button in the upper right corner to enter into the download form.


    ### Step3

    Select the corresponding software type according to the computer system type (`Windows/MacOS/Linux`)
    according to your requirements.


    ### Step4

    Select the `Python` version. Since `Python 2` will no longer be officially supported
    after 2020, it is recommended that everyone choose `Python 3`. The code of this
    book is also based on `Python 3`. In the next step select the corresponding version
    according to the number of bits (`32Bit/64Bit`) of the computer''s operating system.


    ### Step5

    Save it to the computer after downloading, as shown. Because it is an official
    website and the files are relatively large, the download speed will be relatively
    slow. You can also go to different private repos to download.


    ### Step6

    Double-click the installation package to open and install, and click the corresponding
    button known as `Install` to get the software in your system.


    ### Step7

    Select the default path for the installation path without adding environment variables,
    then click the `Next` button and check the corresponding option in the pop-up
    dialog box.


    ### Step8

    After waiting for the download to complete, continue to click the `Next` button
    to complete the procedure without any errors.


    ### Step9

    Click and check the button with privacy policy so that you understand how data
    is collected by the software.


    ### Step10

    After completing the above operations, you will see several newly added programs
    shown on the left side in the computer start interface, which means that `Python`
    has been installed. Click `Jupyter Notebook` to open, and a black box will pop
    up (shown on the right side). After pressing the `Enter` key, you will be able
    to choose which browser to open, and it is recommended to choose the `Chrome`
    browser. If not, please chose your desired one such as `Firefox` or `safari`.


    ### Step11

    When you see the interface with default options it means that the environment
    has been configured.


    ## What Next?


    In the next chapter of this book we will talk about IDE importance and its functionalities
    that are necessary for a Python programmer and data scientist. Follow along carefully.

