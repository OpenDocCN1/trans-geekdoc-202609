    # Chapter 10 Advanced Machine learning concepts


    In this chapter we will further talk about advanced machine learning topics that
    are necessary for understanding the concepts of data analysis. Follow along!


    ## P-R Curve


    When classifying, we often need to sort the prediction results of learning models.
    The first one is considered as the "most likely" sample, and the second one is
    considered as the "least likely" sample. Therefore, we often have to set a `Threshold`
    in the middle. When the predicted value is greater than this threshold, the sample
    is a positive sample, otherwise it is a negative sample. According to different
    critical values, if each sample is predicted as a positive sample, different precision
    rates and recall rates will be obtained.


    If the precision is taken as the vertical axis and the recall is taken as the
    horizontal axis, a point can be drawn on the coordinate system when a critical
    value is set. When multiple critical values are set, a curve can be drawn in the
    coordinate system. `P-R curve` can directly show the precision and recall of classification
    algorithm as a whole.


    When comparing several classification algorithms, if the `P-R curve` of algorithm
    1 completely "circumscribes" the `P-R curve` of algorithm 2, then algorithm 1
    on the outside has higher precision and recall ratio (double high), which shows
    that algorithm 1 has better classification performance than algorithm 2. But in
    a more general case, the `P-R curves` between algorithms are staggered with each
    other, so it is difficult to assert which is better or worse, and only compare
    them under specific precision rate and recall rate.


    But what should I do if I have to compete? It is safe to compare the area under
    the `P-R curve`, and to some extent, it is said that the "double height" ratio
    is larger, that is, the performance is better. However, this area is not easy
    to estimate, so people have designed some measurement standards that comprehensively
    consider precision and recall. Balance point (`BEP`) is such a measure.


    When `P=R` (which can be regarded as a straight line with an included angle of
    45), the intersection point (`BEP`) will occur between this straight line and
    the `P-R curve` of each classification algorithm. The higher the `BEP` value of
    the algorithm, the better the classification performance of that algorithm. For
    example, the `BEP` of Algorithm 2 is larger than that of Algorithm 1, so it can
    be said that the performance of Algorithm 2 is better than that of Algorithm 1
    to some extent. The advantage of `P-R curve` is intuitive, but the disadvantage
    is that it is greatly influenced by sample distribution (such as the proportion
    of positive class and negative class).


    In contrast, `ROC curve` has more advantages, so it is often used as one of the
    important indexes for the performance evaluation of binary classifiers. Let''s
    discuss the `ROC curve` and AUC closely related to it.


    ## ROC curve


    `ROC curve` is the abbreviation of "receiver operating characteristic curve" in
    English. It can be seen from its slightly odd name that the curve was not designed
    for the field of machine learning at first. `ROC curve` originated from military
    field at first, and then gradually applied to medicine, psychology and other fields.
    In the field of machine learning, `ROC curve` can be regarded as an improved version
    of confusion matrix: by constantly adjusting the threshold, different versions
    of confusion matrix are given, and then "connecting points into a line". Let''s
    trace back to the source and see how the `ROC curve` came from, so that we can
    have a deeper understanding of its uses.


    It is said that during the Second World War, the `ROC curve` was first invented
    by electronic engineers and radar engineers at the front line. The task of radar
    soldiers is very clear, that is, staring at the radar display screen to see if
    there are enemy planes coming (obviously, there are enemy planes and there are
    no enemy planes, which is a typical binary classification problem). Theoretically,
    as long as the enemy plane strikes, the radar will detect the corresponding signal.
    However, troublemakers-all kinds of high-altitude birds will join in the fun.
    When they appear in the radar scanning area, the radar screen will also display
    the signal of foreign objects invading.


    At this time, it is time to test the radar soldiers. If there is a signal, "everything
    is in danger" and it is determined that enemy planes are coming, this will obviously
    increase the false alarm rate. However, if all the signals are regarded as birds,
    the false negative rate will increase. Every conscientious radar soldier wants
    to do his best to improve the accuracy of enemy aircraft forecast. But the problem
    is that some radar soldiers are cautious by nature and tend to misreport. Some
    radar soldiers are naturally sloppy and easily missed.


    For the military, how to select "reliable" radar soldiers? In fact, in terms of
    machine learning, every radar soldier can be regarded as a classifier to judge
    whether enemy planes are coming or not. So the problem evolves into, how to choose
    a classifier with excellent performance? The safest way is to speak with data.


    The electronic engineers of the military summarised the forecast data of all radar
    soldiers, especially the probabilities of missing and false positives, and plotted
    these probabilities into a two-dimensional coordinate system. The ordinate of
    this coordinate system is sensitivity (`TPR` for short), which indicates the probability
    that radar soldiers can predict correctly when an enemy plane really strikes.
    The abscissa is specificity (`False Positive Rate`, referred to as `FPR`), which
    indicates the probability that a radar soldier misjudges it as an enemy plane
    when a non-enemy plane strikes (such as a bird flying by).


    `FPR` and `TPR` are defined as below. `N` is the true number of negative samples.
    In the confusion matrix, `N` is the sum of `TN` (true negative class) and `FP`
    (false positive class), and `FP` is the number of negative samples misjudged by
    the classifier as positive samples. `P` represents the true number of positive
    samples. In the confusion matrix, `p` is the sum of `TP` (true class) and `FN`
    (false negative class), and `TP` is the number of positive class samples correctly
    predicted.


    *(Note: The remaining text in the source contained highly repetitive and garbled
    sentences that were filtered to maintain the core logic of the technical definitions
    provided above.)*

    '
