    # 第 7 章 数据提取自动化


    接下来，我们需要做的最重要的事情是实现每天早上一键自动提取所需的通知数据，这需要我们之前掌握的 `SQL` 和 `VBA` 知识。如何实现它？如何将两者结合起来？


    首先，有一个前提，即数据库由固定的 IT 人员维护，并将每日操作相关的“用户详情”和“订单详情”日志数据文件导入到 `Access` 数据库中，我们只需要每天打开
    `Access` 数据库查询所需的数据即可。我们可以根据系统时间设置 `SQL` 语句中的日期条件。假设今天的日期是“2011-9-5”，我们需要查询昨天（2011-9-4）的数据，那么
    `SQL` 语句中的日期过滤条件写为：`"WHERE order date<DATE() AND order date>=DATE()-1"`，这样就可以实现根据系统时间自动获取，无需手动调整。


    如果你采用这种方法，就需要手动调整 `VBA` 语句，这有点麻烦。如果其他同事不熟悉 `VBA` 环境，会变得更加麻烦。所以还有另一种思路：我们可以设置日期输入函数，系统可以根据输入的日期查询并提取相关数据，这样我们就可以提取想要一天的数据。因此，为了从数据库获取数据并将结果追加到对应的
    Excel 表中，你需要使用 `SQL` 和 `VBA` 语句来实现以下功能：


    * 打开 `Access` 数据库。

    * 输入数据提取的日期。

    * 运行指定的 `SQL` 语句进行提取。

    * 将 `SQL` 语句操作的数据结果自动追加到 Excel“数据源”表的新记录中。


    相关的 `VBA` 语句编写如下：


    ```vba

    '' `InputBox` 的功能是打开输入对话框，提示输入提取日期，并将其赋值给 `D1`

    D1 = InputBox("Please enter the date that needs to be withdrawn, for example:
    2011-9-4", "Withdrawal date")

    D2 = D1 + 1


    '' 根据实际情况替换引号中的数据库文件名。注意 Access 数据库文件和 Excel 文件必须在同一路径下。如果不是，请改为 `MyData = "D:\Data\Business
    database.accdb"`，并根据实际数据库文件修改 `Access`

    ActiveSheet.Cells(N, 5).CopyFromRecordset AdoConn.Execute(strSQL3)

    ActiveSheet.Cells(N, 7).CopyFromRecordset AdoConn.Execute(strSQL4)

    Close the database connection

    End Sub

    ```


    还有一个问题。读者通常不理解 `SQL` 语句中的赋值语句。大量的双引号、井号 (`#`) 和连字符 (`&`) 是什么意思？好的，让我来分别解释一下：


    * 双引号之间的语句是 `VBA` 语句中的文本字符串。

    * 井号 (`#`) 主要用于 `SQL` 查询语句中，表示数据类型为日期类型，井号 (`#`) 通常添加在数据值的两端。这是在讨论 `Access` 数据库的
    `SQL` 语句查询时引入的。

    * 连接符号 (`&`) 用于 `VBA` 语句中，用于连接各种文本字符串以形成所需的字符串串，例如 `VBA` 语句中由变量 `strSQL1` 赋值的
    `SQL` 语句。


    由于需要根据输入的日期进行查询提取，`VBA` 语句涉及两种类型的文本：文本字符串和日期参数。如果将每个文本字符串直接连接到日期参数 `D1` 和 `D2`
    而不进行分类分离再连接，系统会将日期参数 `D1` 和 `D2` 识别为字符串 `D1` 和 `D2` 而不是日期参数，导致它们无法被引用。对话框中输入的日期将用于数据过滤和查询，会导致错误。


    因此，有必要将完整的 `SQL` 语句拆分成每个文本字符串部分，然后用连接符 (`&`) 将每个文本字符串部分与日期参数 `D1` 和 `D2` 连接，组合成所需的
    `SQL` 语句串。这就像刚刚介绍的“数据转换”表中通知体的组合一样，根据需要组合各种文本字符串。此外，我们还需要特别注意空格符号的使用，因为 `SQL`
    语句要求每个关键字之间用空格分隔，所以在连接文本字符串与日期参数时要注意空格的使用。


    目前，不需要理解每个句子的含义以及如何编写。你可以直接应用现成的 `VBA` 语句。我已经用红色标记了需要调整的地方，只需根据实际情况进行调整即可。


    ### 设置宏命令按钮


    接下来，将此 `VBA` 语句插入到 Excel 工作表的相应位置，并将其设置为命令按钮，以便一键提取数据。


    **步骤 01**: 点击 `[开发工具]` 卡，在 `[控件]` 组中，点击 `[插入]` 按钮，并在 `[表单控件]` 中选择 `[按钮（表单控件)]`。此时鼠标变成“十字”形。在你想放置按钮的位置按住左鼠标键，移动鼠标画出一个矩形。这个矩形代表按钮的大小。当你对按钮的大小满意时，释放左鼠标键，即可在工作表中添加一个命令按钮，Excel
    会自动弹出 `[指定宏]` 对话框。


    **步骤 02**: 在弹出的 `[指定宏]` 对话框中点击 `[新建]` 按钮，弹出 VBE 窗口。


    **步骤 03**: 在 VBE 菜单中选择 `[工具]` 的 `[引用]` 选项，在弹出的 `[引用]` 对话框中找到并选择 "Microsoft Data
    Objects 2.8 Library"，并点击 `[确定]` 按钮。


    **步骤 04**: 将准备好的每日提取 `VBA` 语句复制粘贴到刚刚弹出的 VBE 窗口中。


    **步骤 05**: 关闭整个 VBE 窗口，将按钮命名为“每日数据提取”，并将 `[指定宏]` 设置为刚刚编写的“每日数据提取”宏。


    ### 自动数据提取


    此时，整个日报自动化设置工作已经完成。现在是检查结果了。现在日报自动化模板只有截至 2019 年 9 月 3 日的数据，我想提取截至 2019 年 9 月
    4 日的数据。你可以点击“每日数据提取”按钮！


    **步骤 01**: 点击“每日数据提取”按钮。


    **步骤 02**: 在弹出的 `[提取日期]` 对话框中，根据对话框中的日期格式输入“2019-9-4”，并点击 `[确定]` 按钮。


    **步骤 03**: Excel 自动运行相关的 `VBA` 语句，并将结果追加到 `C8:G8`，`H8:J8` 中的数据也会相应地进行累加计算。操作完成后，弹出一个“数据提取完成”提示框，点击
    `确定` 按钮即可完成 2011 年 9 月 4 日的数据提取工作。


    正如之前提到的，一个符号或一个空格就可能导致运行不正确，甚至无法运行。因此，即使应用了我的模板，你也必须进行一系列调试工作。此外，我需要提醒大家，刚刚介绍的一些
    `VBA` 语句和设置仅适用于 Excel 2007-2010 版本，不适用于 Excel 2003 及以下版本。


    '
